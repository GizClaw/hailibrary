audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
    henry:
      display_name: Henry
      tts:
        delivery: practical and dry
        timbre: rugged and steady
        pace: unhurried
        pitch: low
    bill:
      display_name: Bill
      tts:
        delivery: wary and plainspoken
        timbre: rough and weathered
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE SHE-WOLF
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            After breakfast, the men lashed their small camp outfit to the sled. They turned their backs on the cheerful fire and headed into the darkness. At once, savage, sorrowful cries rose around them. The voices called to one another through the cold and dark, and distant voices answered. The men stopped talking. Daylight finally arrived at nine. At noon, a rose-colored glow warmed the southern sky. It marked the place where the curve of the earth stood between the midday sun and the northern world. The color soon vanished. The remaining gray light lasted until three. Then that faded too, and the heavy Arctic night settled once more over the lonely, silent land.
        - id: ch01-b02
          speaker: narrator
          text: >-
            As the darkness returned, the hunting cries came nearer from the right, the left, and behind. They came so close that more than once, fear swept through the tired dogs. The animals broke into sudden panics while they struggled onward. Each time, Bill and Henry had to bring them under control and straighten the tangled traces.
        - id: ch01-b03
          speaker: bill
          text: I wish they'd find some game and leave us alone.
        - id: ch01-b04
          speaker: henry
          text: They surely do wear on a man's nerves.
        - id: ch01-b05
          speaker: narrator
          text: They said nothing else until they made camp.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Henry was bending over the bubbling pot of beans and dropping in pieces of ice. Suddenly, he heard a blow, a shout from Bill, and a sharp snarl of pain among the dogs. He stood up in time to see a shadowy shape race over the snow and disappear into the shelter of the dark. Bill stood among the dogs, looking pleased and disappointed at once. He held a heavy club in one hand. In the other was the tail and part of the body of a sun-dried salmon.
        - id: ch01-b07
          speaker: bill
          text: It took half the fish, but I landed a good blow. Did you hear it yelp?
        - id: ch01-b08
          speaker: henry
          text: What did it look like?
        - id: ch01-b09
          speaker: bill
          text: I couldn't see much. Four legs, a mouth, and hair. It looked like any other dog.
        - id: ch01-b10
          speaker: henry
          text: Then it must be a tame wolf.
        - id: ch01-b11
          speaker: bill
          text: Whatever it is, it's tame enough to walk into camp at feeding time and help itself to fish.
        - id: ch01-b12
          speaker: narrator
          text: >-
            That night, after supper, the men sat together on the long box and drew at their pipes. Beyond the firelight, the circle of shining eyes had drawn closer than ever.
        - id: ch01-b13
          speaker: bill
          text: I wish they'd run into a herd of moose or something and stop following us.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Henry answered with a grunt, and it was not entirely sympathetic. For a full fifteen minutes, neither man spoke. Henry kept his gaze on the fire. Bill stared at the circle of eyes that burned in the darkness just beyond the light.
        - id: ch01-b15
          speaker: bill
          text: I sure wish we were reaching McGurry right now.
        - id: ch01-b16
          speaker: henry
          text: >-
            Stop wishing and talking doom. Your stomach's gone sour, that's all. Take a spoonful of soda. It'll sweeten you up and make you better company.
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: >-
            In the morning, a stream of furious curses from Bill woke Henry. He propped himself on one elbow and looked across the camp. Bill was standing among the dogs beside the newly built-up fire. His arms were raised as he cursed, and his face was twisted with rage.
        - id: ch01-b18
          speaker: henry
          text: Hello! What's wrong now?
        - id: ch01-b19
          speaker: bill
          text: Frog's gone.
          emotion: angry
        - id: ch01-b20
          speaker: henry
          text: No, he isn't.
        - id: ch01-b21
          speaker: bill
          text: I'm telling you, he's gone.
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: >-
            Henry sprang out of the blankets and hurried over to the team. He counted every dog with care. When he finished, he joined Bill in cursing the power of the Wild that had reached into their camp and stolen another one.
        - id: ch01-b23
          speaker: bill
          text: Frog was the strongest dog we had.
        - id: ch01-b24
          speaker: henry
          text: And he wasn't a foolish dog, either.
        - id: ch01-b25
          speaker: narrator
          text: And so they gave their second epitaph in two days.
        - id: ch01-b26
          speaker: narrator
          text: >-
            They ate a gloomy breakfast and harnessed the four remaining dogs to the sled. The day repeated all the days before it. The men labored without speaking as they crossed the face of the frozen world. Nothing broke the silence except the cries of the unseen wolves following behind them. Night came in the middle of the afternoon. As usual, the hunters drew closer and their cries grew louder. The excited, frightened dogs panicked again and again. They tangled the traces and left the two men more discouraged than before.
        - id: ch01-b27
          speaker: bill
          text: There. That should hold you, you foolish beasts.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Bill stood up, satisfied with his work. Henry left the cooking to inspect it. Bill had not merely tied the dogs. He had secured each one in the Indian fashion, using a stout stick four or five feet long. A leather thong around the dog's neck fastened one end of the stick so close that the dog could not reach the leather with its teeth. At the other end, another thong tied the stick to a stake in the ground. The dog could not chew the thong at its neck, and the rigid stick kept it from reaching the leather at the stake.
        - id: ch01-b29
          speaker: narrator
          text: Henry nodded his approval.
        - id: ch01-b30
          speaker: henry
          text: >-
            This may be the only thing that'll hold One Ear. He can cut through leather as neatly as a knife and almost as fast. Every dog will still be here in the morning.
        - id: ch01-b31
          speaker: bill
          text: You can count on that. If even one is gone, I'll give up my coffee.
        - id: ch01-b32
          speaker: henry
          text: >-
            Those wolves know we don't have enough bullets to kill them. A couple of good shots would teach them respect, but they come closer every night. Look past the firelight and keep your eyes steady. There! Did you see that one?
        - id: ch01-b33
          speaker: narrator
          text: >-
            For some time, the men entertained themselves by watching the dim shapes along the edge of the firelight. If they stared long and steadily at a pair of burning eyes, an animal's body slowly appeared around them. Sometimes the vague forms shifted, and the men could make out the movement.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Then a sound among the dogs caught their attention. One Ear was whining in quick, eager bursts. He lunged toward the darkness until his stick pulled him short, then turned and attacked the wood wildly with his teeth.
        - id: ch01-b35
          speaker: henry
          text: Look at that, Bill.
        - id: ch01-b36
          speaker: narrator
          text: >-
            A doglike animal slipped sideways into the full firelight. Its movements were quiet and secretive. It was wary and bold at the same time, and it watched the men with care as it came. Even so, its attention stayed fixed on the dogs. One Ear stretched toward the visitor as far as the stick allowed and whined eagerly.
        - id: ch01-b37
          speaker: bill
          text: That fool One Ear doesn't look very scared.
        - id: ch01-b38
          speaker: henry
          text: >-
            It's a she-wolf. Now we know what happened to Fatty and Frog. She lures a dog away, and then the whole pack rushes in and eats him.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The fire crackled between the men. Then a log fell apart with a loud spluttering sound, and the strange animal sprang backward out of the light and into the darkness.
        - id: ch01-b40
          speaker: bill
          text: Henry, I've been thinking.
        - id: ch01-b41
          speaker: henry
          text: Thinking what?
        - id: ch01-b42
          speaker: bill
          text: I think that's the one I hit with my club.
        - id: ch01-b43
          speaker: henry
          text: I don't doubt it for a moment.
        - id: ch01-b44
          speaker: bill
          text: And an animal that comfortable around campfires is behaving mighty suspiciously for a wolf.
        - id: ch01-b45
          speaker: henry
          text: >-
            It knows more than any proper wolf should. If it understands how to slip in among the dogs at feeding time, it's been around people before.
        - id: ch01-b46
          speaker: bill
          text: >-
            Old Villan had a dog that ran off with the wolves once. I know because I shot it out of a pack in a moose pasture over on Little Stick. Old Villan cried like a baby. He said the dog had been gone for three years, living with the wolves all that time.
        - id: ch01-b47
          speaker: henry
          text: >-
            I think you've solved it, Bill. That wolf is really a dog, and she's eaten fish from a man's hand plenty of times.
        - id: ch01-b48
          speaker: bill
          text: >-
            If I get a chance, that wolf-dog is dead. We can't afford to lose another animal.
        - id: ch01-b49
          speaker: henry
          text: But you only have three cartridges.
        - id: ch01-b50
          speaker: bill
          text: Then I'll wait until I'm sure I can't miss.
        - id: ch01-b51
          speaker: narrator
          text: >-
            In the morning, Henry built up the fire and cooked breakfast while Bill snored.
        - id: ch01-b52
          speaker: henry
          text: You were sleeping so comfortably, I didn't have the heart to wake you.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Bill began eating, still half asleep. He saw that his cup was empty and reached for the coffee-pot. It stood beside Henry, too far away for him to reach.
        - id: ch01-b54
          speaker: bill
          text: Say, Henry, haven't you forgotten something?
        - id: ch01-b55
          speaker: narrator
          text: Henry looked around with great care, then shook his head. Bill held up the empty cup.
        - id: ch01-b56
          speaker: henry
          text: You don't get any coffee.
        - id: ch01-b57
          speaker: bill
          text: We haven't run out, have we?
        - id: ch01-b58
          speaker: henry
          text: Nope.
        - id: ch01-b59
          speaker: bill
          text: And you don't think it'll upset my stomach?
        - id: ch01-b60
          speaker: henry
          text: Nope.
        - id: ch01-b61
          speaker: narrator
          text: Anger reddened Bill's face.
        - id: ch01-b62
          speaker: bill
          text: Then I'm very eager to hear your explanation.
          emotion: angry
        - id: ch01-b63
          speaker: henry
          text: Spanker's gone.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Without any hurry, Bill slowly turned his head and counted the dogs from where he sat. He had the weary air of a man who had accepted his bad luck and expected nothing else.
        - id: ch01-b65
          speaker: bill
          text: How did it happen?
        - id: ch01-b66
          speaker: henry
          text: >-
            I don't know. One Ear must have chewed him loose. Spanker couldn't have freed himself.
        - id: ch01-b67
          speaker: bill
          text: >-
            That cursed dog. He couldn't chew through his own thong, so he chewed Spanker's instead.
        - id: ch01-b68
          speaker: narrator
          text: Bill spoke slowly and gravely. There was no trace of anger in his voice, though fury was raging inside him.
        - id: ch01-b69
          speaker: henry
          text: >-
            At least Spanker's troubles are finished. By now, he's probably been digested and is running around inside twenty different wolves. Have some coffee, Bill.
        - id: ch01-b70
          speaker: narrator
          text: Bill shook his head. Henry raised the pot and urged him again.
        - id: ch01-b71
          speaker: henry
          text: Go on. Have some.
        - id: ch01-b72
          speaker: narrator
          text: Bill pushed his cup away.
        - id: ch01-b73
          speaker: bill
          text: >-
            I'll be damned if I do. I said I'd go without coffee if a dog disappeared, and I will.
        - id: ch01-b74
          speaker: henry
          text: It's mighty good coffee.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Bill stubbornly refused. He ate his breakfast dry, without a drop of coffee to wash it down. All the while, he muttered curses at One Ear for the trick the dog had played.
        - id: ch01-b76
          speaker: bill
          text: Tonight, I'll tie every dog beyond the others' reach.
        - id: ch01-b77
          speaker: narrator
          text: >-
            They had gone only a little more than a hundred yards when Henry's snowshoe struck something. The trail was dark, so he could not see what it was, but he recognized it by touch. He tossed it backward. It struck the sled, bounced along behind it, and finally stopped against Bill's snowshoes.
        - id: ch01-b78
          speaker: henry
          text: You may need that in your line of work.
        - id: ch01-b79
          speaker: narrator
          text: >-
            Bill cried out when he recognized it. The bare stick was all that remained of Spanker and the rig that had held him through the night.
        - id: ch01-b80
          speaker: bill
          text: >-
            They ate him, hide and all. The stick is clean as a whistle. They've even eaten the leather off both ends. Those wolves are terribly hungry, Henry. Before this trip is over, they'll give us plenty to worry about.
        - id: ch01-b81
          speaker: narrator
          text: Henry laughed in defiance.
        - id: ch01-b82
          speaker: henry
          text: >-
            Wolves have never followed me like this before, but I've survived far worse. It'll take more than a handful of those pests to finish me, Bill, my boy.
        - id: ch01-b83
          speaker: bill
          text: I don't know. I just don't know.
        - id: ch01-b84
          speaker: henry
          text: You'll know when we reach McGurry.
        - id: ch01-b85
          speaker: bill
          text: I'm not feeling very hopeful about that.
        - id: ch01-b86
          speaker: henry
          text: >-
            You're out of sorts, that's all. You need quinine, and I'll give you a strong dose as soon as we reach McGurry.
        - id: ch01-b87
          speaker: narrator
          text: >-
            Bill grunted his disagreement with Henry's diagnosis and fell silent. The day was like every other day. Light arrived at nine. At noon, the hidden sun briefly warmed the southern horizon without ever appearing above it. Then came the cold gray afternoon, and three hours later it faded into night.
        - id: ch01-b88
          speaker: narrator
          text: >-
            Just after the sun's useless attempt to appear, Bill pulled the rifle from beneath the sled lashings.
        - id: ch01-b89
          speaker: bill
          text: Keep going, Henry. I'm going to look around.
        - id: ch01-b90
          speaker: henry
          text: >-
            You'd better stay with the sled. You only have three cartridges, and there's no telling what might happen.
        - id: ch01-b91
          speaker: bill
          text: Who's talking doom now?
        - id: ch01-b92
          speaker: narrator
          text: >-
            Henry gave no answer and trudged onward alone. Again and again, he looked anxiously back into the gray emptiness where Bill had disappeared. Nothing moved there, and his partner remained out of sight. The sled had to follow every bend in the trail. An hour later, Bill caught up by taking shorter paths across those bends.
        - id: ch01-b93
          speaker: bill
          text: >-
            They're spread out over a wide stretch. They're following us and hunting other game at the same time. They're sure they'll get us, so they can afford to wait. Meanwhile, they'll eat anything else they find.
        - id: ch01-b94
          speaker: henry
          text: You mean they think they'll get us.
        - id: ch01-b95
          speaker: narrator
          text: Bill ignored the correction.
        - id: ch01-b96
          speaker: bill
          text: >-
            I saw some of them. They're terribly thin. I don't think they've eaten for weeks except for Fatty, Frog, and Spanker. There are so many wolves that those three dogs hardly counted. Their ribs stick out like washboards, and their bellies are drawn up against their backbones. They're desperate. Soon they'll go mad with hunger. Then we'd better watch out.
        - id: ch01-b97
          speaker: narrator
          text: >-
            A few minutes later, Henry was walking behind the sled when he gave a low warning whistle. Bill looked back and quietly stopped the dogs. A furry, slinking shape came around the last bend and trotted into plain view on the trail they had just crossed. Its nose stayed close to the ground. It moved with a smooth, sliding gait that seemed to take no effort. When the men stopped, it stopped too. It lifted its head and watched them steadily while its nostrils twitched, catching and studying their scent.
        - id: ch01-b98
          speaker: bill
          text: It's the she-wolf.
        - id: ch01-b99
          speaker: narrator
          text: >-
            The dogs had lain down in the snow. Bill walked past them to join Henry beside the sled. Together, the men watched the strange animal. She had followed them for days, and she had already brought about the destruction of half their dog team.
        - id: ch01-b100
          speaker: narrator
          text: >-
            After studying them, the she-wolf trotted forward a few steps. She stopped, watched, and came forward again. She repeated this until she stood less than a hundred yards away. Beside a clump of spruce trees, she raised her head and examined the entire outfit with her eyes and nose. She had the strangely wistful look of a dog, but there was no affection in it. Hunger had made that longing. It was as cruel as her own fangs and as merciless as the frost.
        - id: ch01-b101
          speaker: narrator
          text: >-
            She was large for a wolf. Even hunger could not hide it. The long lines of her lean frame showed that she belonged among the biggest animals of her kind.
        - id: ch01-b102
          speaker: henry
          text: She's nearly two and a half feet at the shoulder. I bet she's close to five feet long.
        - id: ch01-b103
          speaker: bill
          text: That's a strange color for a wolf. I've never seen a red one. She looks almost cinnamon-colored.
        - id: ch01-b104
          speaker: narrator
          text: >-
            In truth, she was not cinnamon-colored. Her coat was a true wolf coat, mostly gray. Yet a faint red shade seemed to appear and vanish across it. The color played tricks on the eye. One moment she was plainly gray. The next, unfamiliar hints and glints of red showed through before disappearing again.
        - id: ch01-b105
          speaker: bill
          text: She looks just like a big husky sled dog. I almost expect her to wag her tail.
        - id: ch01-b106
          speaker: bill
          text: Hello there, husky! Come here, whatever your name is!
        - id: ch01-b107
          speaker: henry
          text: She isn't the least bit afraid of you.
        - id: ch01-b108
          speaker: narrator
          text: >-
            Bill waved one hand at her in a threat and shouted loudly, but she showed no fear. The only change was that she became more watchful. The hungry, pitiless longing never left her eyes. To her, the men were meat, and she was starving. She wanted to come in and eat them, if only she dared.
        - id: ch01-b109
          speaker: bill
          text: >-
            Listen, Henry. We have three cartridges, but this is an easy shot. I couldn't miss. She's taken three of our dogs, and we ought to stop her. What do you say?
        - id: ch01-b110
          speaker: narrator
          text: >-
            Henry nodded his agreement. Bill carefully slid the rifle from under the sled lashings. He began lifting it toward his shoulder, but the gun never reached it. In that same instant, the she-wolf sprang sideways off the trail. She disappeared into the clump of spruce trees.
        - id: ch01-b111
          speaker: narrator
          text: >-
            The two men looked at each other. Henry gave a long, knowing whistle. They both understood how completely the she-wolf had judged the danger.
        - id: ch01-b112
          speaker: bill
          text: >-
            I should have known. Any wolf clever enough to join the dogs at feeding time would understand a gun. I'm telling you, Henry, she's behind all our trouble. Without her, we'd still have six dogs instead of three. I'm going to get her. She's too smart to shoot in the open, so I'll hide and wait for her. I'll bring her down as surely as my name is Bill.
        - id: ch01-b113
          speaker: henry
          text: >-
            Don't wander too far when you try it. If that pack rushes you, three cartridges won't help any more than three shouts. Those wolves are starving. Once they attack, they'll get you, Bill.
        - id: ch01-b114
          speaker: narrator
          text: >-
            They made camp early that night. Three dogs could not pull the sled as fast as six, nor could they keep going for as many hours. The exhausted animals were plainly wearing out under the load. The men went to bed early too. Before he lay down, Bill carefully checked every tether and made sure each dog was tied beyond the others' reach.
        - id: ch01-b115
          speaker: narrator
          text: >-
            The wolves were growing bolder, and they woke the men more than once during the night. The pack came so near to the camp that the dogs went wild with terror, straining and struggling against their bonds. Each time, one of the men had to leave the warm blankets and feed the fire with more wood. Only the stronger flames forced the daring hunters back to a safer distance before the men could sleep again.
        - id: ch01-b116
          speaker: narrator
          text: After one of those trips to the fire, Bill crawled back beneath the blankets.
        - id: ch01-b117
          speaker: bill
          text: >-
            I've heard sailors tell about sharks following a ship. Well, these wolves are land sharks. They know their work better than we do, and they aren't following us for their health. They're going to get us. They're surely going to get us, Henry.
        - id: ch01-b118
          speaker: henry
          text: >-
            They've already half beaten you if you talk that way. A man is half beaten the moment he says he is. The way you carry on, you're half eaten already.
        - id: ch01-b119
          speaker: bill
          text: They've killed better men than you and me.
        - id: ch01-b120
          speaker: henry
          text: Stop that miserable talk. I'm tired of hearing it.
          emotion: angry
        - id: ch01-b121
          speaker: narrator
          text: >-
            Henry rolled angrily onto his side. He was surprised when Bill did not answer with anger of his own. That was not like Bill at all. Usually, sharp words made him flare up at once. Henry lay awake for a long time, thinking about the change in his companion. At last, his eyelids fluttered, then sank, and he drifted toward sleep.
        - id: ch01-b122
          speaker: narrator
          text: >-
            There was no mistaking it. Bill had fallen into a deep gloom. As Henry slipped into sleep, one thought remained in his mind. Tomorrow, he would have to find a way to cheer Bill up.
