audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
    scott:
      display_name: 威登·斯科特
      tts:
        delivery: 正直果断，愤怒时依然清醒
        timbre: 清朗坚实
        pace: 稳健有力
        pitch: 中低
    scott_father:
      display_name: 老斯科特
      tts:
        delivery: 稳重随和，偶尔流露长辈式的诙谐
        timbre: 浑厚清楚
        pace: 不疾不徐
        pitch: 低
    scott_mother:
      display_name: 威登的母亲
      tts:
        delivery: 慈爱而谨慎，忧虑时语气紧张
        timbre: 温和圆润
        pace: 从容
        pitch: 中
    beth:
      display_name: 贝丝
      tts:
        delivery: 活泼爽直，爱在家人谈笑时机敏插话
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 温柔敏锐，遇事时果断清醒
        timbre: 柔和清亮
        pace: 稳定自然
        pitch: 中
  chapters:
    - id: ch01
      title: 第四章　同类的呼唤
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            一个月又一个月过去了。南方有吃不完的食物，也没有活要白牙去干。他长得肥壮，日子富足又快活。他不只是来到了地理上的南方，也进入了生命里的南方。人类的善意像阳光一样照着他，他便像栽进沃土的花，渐渐繁盛起来。
        - id: ch01-b02
          speaker: narrator
          text: >-
            可他终究跟别的狗不一样。那些狗从小只过文明世界的生活，白牙却比它们更懂法则，守得也更严。即便如此，他身上依然藏着凶悍的气息。荒野并没有真正离开他，体内的狼也只是睡着了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            白牙从不跟别的狗结伴。从小到大，他一直孤零零地活在同类之外，以后也不会改变。幼年时，唇唇和小狗群欺负他。落到比美·史密斯手里以后，他又成天跟狗搏杀。这些经历让他深深厌恶同类，也让他的生命偏离了原来的道路。他远离狗，反而依附于人。
        - id: ch01-b04
          speaker: narrator
          text: >-
            南方的狗同样不信任白牙。他身上的荒野气息，会唤醒它们天生的恐惧。它们一见他便龇牙低吼，满怀敌意地冲过来。后来，白牙发现根本不必真的咬它们。他只要亮出獠牙，抽动嘴唇，那些咆哮着扑来的狗往往就会猛然刹住，一屁股坐回去。
        - id: ch01-b05
          speaker: narrator
          text: >-
            只有柯莉仍是他的磨难。她一刻也不肯让白牙清静，主人怎么劝也不能让她跟白牙和好。她忘不了白牙杀鸡的事，认定他一肚子坏心。事情还没发生，她就先判他有罪。白牙走到马厩和猎犬群附近，她就像警察一样紧紧跟着。只要他朝鸽子或鸡多看一眼，她马上会尖声怒叫。白牙最喜欢趴下来，把头搁在前爪上装睡。柯莉每次都会被这一招弄糊涂，只好闭上嘴。
        - id: ch01-b06
          speaker: narrator
          text: >-
            除了柯莉，白牙的生活都很顺遂。他已经懂得克制，也能沉住气，对很多事情都学会了耐心。四周不再充满敌意，危险、伤痛和死亡也不再处处等着他。那种始终悬在头顶、叫他害怕的未知，渐渐消失了。生活变得温和又轻松，平平稳稳地向前流去，路上再没有恐惧，也没有敌人。
        - id: ch01-b07
          speaker: narrator
          text: >-
            白牙其实想念雪，只是自己并不知道。假如他能把那份感觉想清楚，也许会以为这个夏天实在太长了。每到盛夏，烈日晒得他难受，他心里也会隐约想起北方。这份思念让他烦躁不安，可他始终不明白自己到底缺少什么。
        - id: ch01-b08
          speaker: narrator
          text: >-
            白牙从来不善于表达感情。他只会偎依主人，或是在爱的低吼里添上一声轻柔的呢喃。如今，他又发现了第三种办法。从前，神一笑，他就会觉得自己受了侮辱，气得发狂。可爱的主人带着善意取笑他时，他怎么也生不起气来。旧日的怒火仍像针一样刺着他，想要往上冲，却被爱挡住了。
        - id: ch01-b09
          speaker: narrator
          text: >-
            他不能发火，又总得有所反应，便先摆出威严的样子。主人见了，反而笑得更响。白牙越想端起架子，主人笑得越厉害，最后竟把他的尊严全笑跑了。白牙微微张开嘴，嘴唇略略扬起，眼里露出疑惑的神情。那神情里的爱意远远多过笑意，可他确实已经学会笑了。
        - id: ch01-b10
          speaker: narrator
          text: >-
            他也学会跟主人嬉闹。主人把他摔倒，让他在地上滚来滚去，又拿各种粗野的把戏逗他。白牙便装作发怒，浑身毛发竖起，嘴里凶狠地咆哮，牙齿咔咔相击，仿佛真要咬死人。不过，他从不忘记分寸，每一口都只咬中空气。
        - id: ch01-b11
          speaker: narrator
          text: >-
            玩到最激烈时，拍打、推搡、空咬和咆哮会忽然一齐停下。他们隔着几英尺站住，彼此瞪着对方。紧接着，他们又同时笑了起来，像暴风雨的海面上突然升起太阳。最后，主人总会抱住白牙的脖子和肩膀，白牙也会低声呢喃，唱出自己的爱之歌。
        - id: ch01-b12
          speaker: narrator
          text: >-
            可别人休想跟白牙这样玩。他不答应。谁来逗他，他就竖起鬃毛，发出绝非玩笑的警告。白牙容许主人放肆，并不表示他愿意做一条随便的狗，见谁都亲热，任谁都可以拉来取乐。他只爱一个人，既不肯贬低自己，也不肯让这份爱变得廉价。
        - id: ch01-b13
          speaker: narrator
          text: >-
            主人常骑马出门，陪着他便成了白牙最重要的职责之一。从前在北方，白牙靠拉雪橇表示忠诚。南方没有雪橇，也不让狗驮重物，他便换了一种方式，跟着主人的马奔跑。无论一天有多漫长，他都不会累垮。他迈着狼那平稳又轻捷的步子，不费力地跑过五十英里，回家时还能神气地赶在马前。
        - id: ch01-b14
          speaker: narrator
          text: >-
            就是在陪主人骑马的时候，白牙学会了另一种表达方式。他一生只用过两次。第一次，主人正在训练一匹暴烈的纯种马。他想让马学会开关大门，这样骑手就不用下马了。可是每次靠近门边，那匹马都会受惊后退，猛地蹿开，而且越来越紧张。它扬起前蹄，主人便用马刺迫它落地。前腿刚一着地，它又抬起后腿乱踢。
        - id: ch01-b15
          speaker: narrator
          text: >-
            白牙越看越焦急，终于忍不住跳到马前，凶猛地吠了一声，像是在发出警告。后来他一次又一次想再吠，主人也总鼓励他，却只有一次成功。那一回，主人偏偏不在场。
        - id: ch01-b16
          speaker: narrator
          text: >-
            那天，他们正在牧场上疾驰。一只长耳大野兔突然从马蹄下窜出来，马受惊闪向一旁，失足倒地，主人也摔了下来，一条腿断了。白牙怒冲冲地扑向那匹闯祸的马，要咬断它的喉咙，主人的声音却喝住了他。主人查看过伤势，知道自己走不了了。
        - id: ch01-b17
          speaker: scott
          text: “回家！快回家去！”
        - id: ch01-b18
          speaker: narrator
          text: >-
            白牙不愿把主人独自留下。主人想写张字条，却翻遍口袋也没找到纸笔，只好又叫他回家。白牙依恋地望着主人，走了几步，又转回来低声呜咽。他竖起耳朵，怀着痛苦的专注，听主人温和而严肃地劝他。
        - id: ch01-b19
          speaker: scott
          text: “没事的，老伙计。你只管跑回家，告诉他们我出了事。回家去，你这头狼，快走吧！”
          emotion: calm
        - id: ch01-b20
          speaker: narrator
          text: >-
            白牙只听得懂“回家”，其余的话全不明白。但他知道，主人要他回去。他很不情愿地转身跑开，又迟疑着停下，回头望了一眼。
        - id: ch01-b21
          speaker: scott
          text: “回家！”
        - id: ch01-b22
          speaker: narrator
          text: >-
            这次命令又尖又急，白牙终于服从了。他赶到山景庄园时，一家人正在门廊上乘午后的凉。他浑身沾满尘土，喘着气跑进人群。
        - id: ch01-b23
          speaker: scott_mother
          text: “威登回来了。”
        - id: ch01-b24
          speaker: narrator
          text: >-
            孩子们欢呼着跑去迎接白牙。他避开他们，沿着门廊往前走，却被堵在摇椅和栏杆之间。白牙低吼着，想从他们身边挤过去。爱丽丝不安地望着孩子们。
        - id: ch01-b25
          speaker: alice
          text: “说真的，白牙一靠近孩子们，我心里就不踏实。我总怕有一天，他会忽然掉头袭击他们。”
          emotion: fearful
        - id: ch01-b26
          speaker: narrator
          text: >-
            白牙凶狠地咆哮一声，从角落里跃了出去，把男孩和女孩都撞倒了。爱丽丝赶紧把孩子叫到身边，一面安慰，一面嘱咐他们别再去烦白牙。
        - id: ch01-b27
          speaker: scott_father
          text: “狼到底还是狼，不能信任。”
        - id: ch01-b28
          speaker: beth
          text: “可白牙又不全是狼。”
        - id: ch01-b29
          speaker: narrator
          text: 贝丝替不在场的哥哥辩护，老斯科特却不肯让步。
        - id: ch01-b30
          speaker: scott_father
          text: “那只是威登自己的看法。他猜白牙身上混着一点狗的血统，可他自己也承认根本说不准。再看看白牙的模样……”
        - id: ch01-b31
          speaker: narrator
          text: >-
            老斯科特没能把话说完，因为白牙已经站到面前，凶狠地低吼起来。
        - id: ch01-b32
          speaker: scott_father
          text: “走开！趴下，听见没有！”
        - id: ch01-b33
          speaker: narrator
          text: >-
            白牙转向爱丽丝，一口咬住她的裙子，用力往外扯。轻薄的布料裂开了，爱丽丝吓得尖叫。现在，所有人终于都盯住了白牙。他不再低吼，只昂着头，逐一看进他们脸上。他的喉咙不停抽动，却发不出一点声音。为了吐出那团无法表达的东西，他浑身使劲，身体都快要痉挛了。
        - id: ch01-b34
          speaker: scott_mother
          text: “但愿他不是发疯了。我早就跟威登说过，北极的动物恐怕受不了这里这么暖的天气。”
          emotion: fearful
        - id: ch01-b35
          speaker: beth
          text: “我觉得他是在拼命想说话。”
        - id: ch01-b36
          speaker: narrator
          text: 就在这时，话语终于从白牙体内冲了出来，变成一阵响亮而急促的吠叫。
        - id: ch01-b37
          speaker: alice
          text: “威登一定出事了。”
        - id: ch01-b38
          speaker: narrator
          text: >-
            所有人一下子都站了起来。白牙冲下台阶，又回头看着他们，催他们跟上。这是他一生第二次，也是最后一次吠叫。而这一次，人们听懂了他。
        - id: ch01-b39
          speaker: narrator
          text: >-
            从此，山景庄园里的人对白牙又亲近了几分。连那个被他撕伤手臂的马夫也承认，就算白牙是一头狼，也是一头聪明的狼。只有老斯科特还坚持原来的看法。他从百科全书和各种博物学著作里找来尺寸和描述，一遍遍拿给大家作证，弄得人人都不胜其烦。
        - id: ch01-b40
          speaker: narrator
          text: >-
            日子继续向前，阳光不间断地洒在圣克拉拉谷上。后来白昼渐渐变短，白牙在南方的第二个冬天也快到了。这时，他发现了一件怪事。柯莉的牙好像不再尖利。她咬他时带着玩闹的意思，也多了一份温柔，根本不会真的让他疼。白牙忘了她从前怎样搅得自己不得安宁。柯莉绕着他蹦跳时，他也一本正经地回应，拼命想跟她玩，样子却只有滑稽可笑。
        - id: ch01-b41
          speaker: narrator
          text: >-
            有一天，柯莉带着他跑过庄园后方的牧场，一直追逐到树林里。那天下午，主人本来要骑马出门，白牙知道这件事。马已经配好鞍，站在门前等着。白牙犹豫了。
        - id: ch01-b42
          speaker: narrator
          text: >-
            可在他的生命深处，有一样东西比学过的法则更古老，比塑造他的习俗更有力量，也比他对主人的爱更深，甚至压过了求生的意志。柯莉见他迟疑，轻轻咬了他一下，转身跑远。白牙也转过身，跟着她去了。
        - id: ch01-b43
          speaker: narrator
          text: >-
            那一天，主人只得独自骑马出门。树林里，白牙和柯莉并肩奔跑。许多年前，在寂静的北方森林里，他的母亲吉切和老独眼也曾这样并肩奔跑。
