  chapters:
    - id: ch01
      title: THE CALL OF KIND
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The months passed. In the Southland, White Fang had plenty to eat and no work to do. He grew fat, comfortable, and happy. He was not only living in a warm country. His whole life had entered a kind of Southland. Human kindness shone on him like sunlight, and he flourished like a flower in good earth.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Even so, he was never quite like other dogs. He understood the law better than dogs that had known nothing else, and he obeyed it more carefully. Yet a hidden fierceness still showed in him. The Wild had not left him. The wolf inside him was only asleep.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He made no friends among the dogs. He had lived apart from his own kind, and he meant to go on that way. Lip-lip and the puppy-pack had tormented him when he was young. Later, Beauty Smith had forced him into fight after fight. Those years had fixed his hatred of dogs. His life had been turned away from his own kind, and he had drawn close to humans instead.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The Southland dogs distrusted him too. Something in White Fang woke their old fear of the Wild. They always met him with growls, snarls, and open hatred. But he learned that he did not have to use his teeth on them. A flash of his bare fangs and the twist of his lips were usually enough. They almost never failed. A dog charging at him would suddenly bellow and drop back on its haunches.
        - id: ch01-b05
          speaker: narrator
          text: >-
            One trouble never went away. Collie gave him no peace at all. She would not obey the law as readily as the others, and even the master's efforts could not make her accept White Fang. Her sharp, nervous snarl was always in his ears. She had never forgiven the chickens he had killed, and she was sure he meant to do wrong again. She judged him before he did anything. Around the stable and the hounds, she followed him like a policeman. If he so much as looked at a pigeon or a chicken, she burst into furious protest.
        - id: ch01-b06
          speaker: narrator
          text: >-
            White Fang found one sure way to stop her. He would lie down, rest his head on his front paws, and pretend to sleep. That always left Collie very puzzled and quiet.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Apart from Collie, life went well. White Fang had learned self-control and understood the law. He had become steady, calm, and patient. The world around him was no longer hostile. Danger, pain, and death did not seem to be hiding everywhere. Little by little, the unknown stopped feeling like a terror and a threat that might spring at him at any moment. Life was soft and easy now. It flowed along smoothly, without fear or enemies in his path.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Somewhere inside, he missed the snow, though he did not know it. If he could have put the feeling into a thought, he might have called this an unusually long summer. During the hottest days, when the sun made him suffer, a faint longing for the Northland stirred in him. It never became a clear memory or desire. He could not tell what was wrong. He only became restless and uneasy.
        - id: ch01-b09
          speaker: narrator
          text: >-
            White Fang had never shown his love openly. He could press close to the master, and he could add a soft, crooning note to his love-growl. Those were the only ways he knew. Then he discovered a third.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Laughter had always driven him wild with anger. But he could not be angry with the love-master. When Scott laughed at him in a friendly, teasing way, White Fang did not know what to do. The old anger pricked and stung inside him, trying to rise, but it ran straight into his love. At first, White Fang became very dignified. Scott only laughed harder. White Fang tried to look even more dignified, and that made the laughter worse.
        - id: ch01-b11
          speaker: narrator
          text: >-
            At last, the master laughed all the dignity out of him. White Fang's jaws opened slightly. His lips lifted, and a questioning look came into his eyes. There was more love than humor in it, but White Fang had learned to laugh.
        - id: ch01-b12
          speaker: narrator
          text: >-
            He also learned to romp with Scott. The master knocked him down, rolled him over, and played all kinds of rough tricks on him. White Fang answered by pretending to be furious. He bristled and growled ferociously. His teeth snapped together as if he meant to kill. Yet he never lost control or forgot that this was play. His jaws always closed on empty air.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Sometimes the play became a storm of blows, cuffs, snaps, and snarls. Then both of them would stop and stand a few feet apart, glaring. All at once, like the sun rising over a stormy sea, they would begin to laugh. The game always ended with Scott's arms around White Fang's neck and shoulders while White Fang crooned and growled his love-song.
        - id: ch01-b14
          speaker: narrator
          text: >-
            No one else was allowed to play with him that way. If anyone tried, White Fang stood on his dignity. His warning snarl and raised mane were not playful at all. Letting the master take such liberties did not make him a common dog who belonged to everyone. White Fang loved with his whole heart, and he gave that love to one man alone.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Scott often rode on horseback, and going with him became one of White Fang's great duties. In the Northland, he had shown his loyalty by working in the harness and pulling a sled. There were no sleds here, and Southland dogs did not carry burdens on their backs. So now he found a new way to serve. He ran beside the master's horse. Even the longest day could not tire him. He moved with the smooth, tireless, effortless stride of a wolf. After fifty miles, he would still come home ahead of the horse, light on his feet.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The riding brought out one more way for White Fang to express himself, though he used it only twice in his life. The first time came while Scott was teaching a spirited thoroughbred to open and close gates without making its rider climb down. Again and again, he brought the horse beside a gate and tried to close it. Each time, the horse grew frightened, backed away, and plunged. It became more nervous and excited by the minute. When it reared, Scott used his spurs to bring its front feet back to earth. Then the horse began kicking with its hind legs.
        - id: ch01-b17
          speaker: narrator
          text: >-
            White Fang watched with rising anxiety. At last, he could bear no more. He sprang in front of the horse and let out a fierce, warning bark. After that he often tried to bark again, and Scott encouraged him, but he managed it only once more. That second bark came when the master was not there to hear it.
        - id: ch01-b18
          speaker: narrator
          text: >-
            One day, horse and rider were racing across a pasture when a jackrabbit burst up beneath the horse's feet. The startled horse swerved violently, stumbled, and fell to the ground. Scott's leg was broken in the fall. White Fang flew in a rage at the throat of the horse that had caused the harm, but the master's voice stopped him before he could attack.
        - id: ch01-b19
          speaker: weedon_scott
          text: “Home! Go home!”
        - id: ch01-b20
          speaker: narrator
          text: >-
            Scott had examined his injury, but White Fang did not want to leave him. The master searched his pockets, thinking he might write a note, but he had no pencil or paper. Once again, he ordered White Fang home.
        - id: ch01-b21
          speaker: narrator
          text: >-
            White Fang looked at him sadly. He started away, came back, and gave a soft whine. Scott spoke to him in a gentle but serious voice. White Fang raised his ears and listened with such effort that it hurt.
        - id: ch01-b22
          speaker: weedon_scott
          text: >-
            “It's all right, old fellow. Run along home now. Go tell them something has happened to me. Home, you wolf. Off you go!”
          emotion: calm
        - id: ch01-b23
          speaker: narrator
          text: >-
            White Fang knew the word “home.” He did not understand the rest, but he understood that the master wanted him to go. He turned and trotted away unwillingly. Then he stopped and looked back over his shoulder, still uncertain.
        - id: ch01-b24
          speaker: weedon_scott
          text: “Go home!”
        - id: ch01-b25
          speaker: narrator
          text: >-
            The command was sharp this time, and White Fang obeyed. The family was sitting on the porch in the cool of the afternoon when he arrived, panting and covered in dust.
        - id: ch01-b26
          speaker: scotts_mother
          text: “Weedon's back.”
        - id: ch01-b27
          speaker: narrator
          text: >-
            The children cried out happily and ran to White Fang. He dodged them and hurried along the porch, but they trapped him between a rocking chair and the railing. He growled and tried to force his way through. Their mother watched nervously.
        - id: ch01-b28
          speaker: scotts_mother
          text: >-
            “I have to admit, he frightens me when he's near the children. I'm afraid that one day he'll suddenly turn on them.”
          emotion: fearful
        - id: ch01-b29
          speaker: narrator
          text: >-
            White Fang sprang savagely from the corner and knocked both children down. Their mother called them to her, comforted them, and told them to leave him alone.
        - id: ch01-b30
          speaker: scotts_father
          text: “A wolf is still a wolf. You can never trust one.”
        - id: ch01-b31
          speaker: beth
          text: “But White Fang isn't entirely wolf.”
        - id: ch01-b32
          speaker: narrator
          text: >-
            Beth defended her brother while he was away, but the judge answered her.
        - id: ch01-b33
          speaker: scotts_father
          text: >-
            “That's only Weedon's opinion. He guesses there may be some dog in White Fang, but he'll admit he doesn't know. And if you look at the animal—”
        - id: ch01-b34
          speaker: narrator
          text: >-
            Judge Scott never finished. White Fang stood in front of him, growling fiercely.
        - id: ch01-b35
          speaker: scotts_father
          text: “Go away! Lie down, sir!”
        - id: ch01-b36
          speaker: narrator
          text: >-
            White Fang turned toward the master's wife. Alice screamed as he caught her dress in his teeth and pulled until the delicate cloth tore. Now everyone was watching him. He stopped growling and stood with his head raised, searching their faces. His throat worked again and again, but no sound came. His whole body twisted with the effort to force out something he could not express.
        - id: ch01-b37
          speaker: scotts_mother
          text: >-
            “I hope he isn't going mad. I warned Weedon that this warm climate might be bad for an Arctic animal.”
        - id: ch01-b38
          speaker: beth
          text: “I truly think he's trying to speak.”
          emotion: surprised
        - id: ch01-b39
          speaker: narrator
          text: >-
            At that moment, speech burst from White Fang in a great rush of barking.
        - id: ch01-b40
          speaker: alice
          text: “Something has happened to Weedon.”
        - id: ch01-b41
          speaker: narrator
          text: >-
            Everyone sprang to their feet. White Fang ran down the steps, then looked back to make sure they followed. For the second and last time in his life, he had barked, and he had made himself understood.
        - id: ch01-b42
          speaker: narrator
          text: >-
            After that day, White Fang held a warmer place in the hearts of the people at Sierra Vista. Even the groom whose arm he had once slashed admitted that White Fang was a wise dog, wolf or not. Judge Scott refused to change his mind. He tried to prove his opinion with measurements and descriptions from encyclopedias and books about nature, though no one else was pleased by the argument.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The days passed beneath the steady, unbroken sunshine of the Santa Clara Valley. Then they grew shorter, and White Fang's second Southland winter drew near. He made a strange discovery about Collie. Her teeth no longer seemed sharp. There was playfulness in her nips now, and a gentleness that kept them from truly hurting him.
        - id: ch01-b44
          speaker: narrator
          text: >-
            White Fang forgot how miserable she had once made him. When Collie danced around him, he answered in his solemn way. He tried to play, though the result only made him look ridiculous.
        - id: ch01-b45
          speaker: narrator
          text: >-
            One afternoon, Collie led him on a long chase across the back pasture and toward the woods. White Fang knew the master planned to ride that day. The saddled horse stood waiting by the door, and White Fang hesitated.
        - id: ch01-b46
          speaker: narrator
          text: >-
            But something moved inside him that was deeper than every law he had learned. It was deeper than the customs that had shaped him, deeper than his love for the master, and even deeper than his own desire to live. While he stood uncertain, Collie nipped him and raced away. White Fang turned and followed her.
        - id: ch01-b47
          speaker: narrator
          text: >-
            The master rode alone that day. In the woods, White Fang ran beside Collie, just as his mother, Kiche, and old One Eye had run together long ago through the silent forests of the Northland.
