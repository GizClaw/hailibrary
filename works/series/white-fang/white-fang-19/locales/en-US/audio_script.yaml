audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
    weedon_scott:
      display_name: Weedon Scott
      tts:
        delivery: thoughtful and compassionate, with firm conviction
        timbre: clear and warm
        pace: measured
        pitch: medium
    matt:
      display_name: Matt
      tts:
        delivery: plainspoken and dry, with frontier steadiness
        timbre: rugged and earthy
        pace: relaxed
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE INDOMITABLE
      blocks:
        - id: ch01-b01
          speaker: weedon_scott
          text: “It's no use, Matt. There's no hope for him.”
        - id: ch01-b02
          speaker: narrator
          text: >-
            Weedon Scott sat on his cabin step, looking at the dog-musher. Matt could only shrug. Then both men turned toward White Fang. He stood at the far end of his taut chain, bristling and snarling as he strained toward the sled dogs. Matt had taught those dogs with a club to keep away from him. Now they lay at a safe distance and acted as though he wasn't there.
        - id: ch01-b03
          speaker: weedon_scott
          text: “He's a wolf. We'll never tame him.”
        - id: ch01-b04
          speaker: matt
          text: >-
            “I wouldn't be too sure. There might be plenty of dog in him. But I do know one thing, and there's no arguing with it.”
        - id: ch01-b05
          speaker: narrator
          text: >-
            Matt stopped there and gave a confidential nod toward Moosehide Mountain, as if he knew something important. Scott waited for a proper length of time, but Matt said nothing more.
        - id: ch01-b06
          speaker: weedon_scott
          text: “Well, don't keep it to yourself. What is it?”
        - id: ch01-b07
          speaker: narrator
          text: Matt jerked his thumb back at White Fang.
        - id: ch01-b08
          speaker: matt
          text: “Wolf or dog, he's been tamed before.”
        - id: ch01-b09
          speaker: weedon_scott
          text: “No!”
          emotion: surprised
        - id: ch01-b10
          speaker: matt
          text: >-
            “He has, and he's worked in harness. Take a good look. See those marks across his chest?”
        - id: ch01-b11
          speaker: weedon_scott
          text: “You're right. He pulled a sled before Beauty Smith got him.”
        - id: ch01-b12
          speaker: matt
          text: “Then there's no reason he can't pull one again.”
        - id: ch01-b13
          speaker: weedon_scott
          text: >-
            “You really think so? But we've had him for two weeks, and right now he seems wilder than ever.”
        - id: ch01-b14
          speaker: matt
          text: “Give him a chance. Let him loose for a while.”
        - id: ch01-b15
          speaker: narrator
          text: Scott stared at him in disbelief.
        - id: ch01-b16
          speaker: matt
          text: “I know you tried before, but you didn't bring a club.”
        - id: ch01-b17
          speaker: weedon_scott
          text: “Then you try.”
        - id: ch01-b18
          speaker: narrator
          text: >-
            Matt took a club and walked toward the chained animal. White Fang never took his eyes from it. He watched it as a caged lion watches a trainer's whip.
        - id: ch01-b19
          speaker: matt
          text: >-
            “See how he keeps his eye on the club? That's a good sign. He's no fool. He won't come at me while I've got this ready. He's not completely crazy.”
        - id: ch01-b20
          speaker: narrator
          text: >-
            Matt reached for White Fang's neck. White Fang crouched, his fur rising as he snarled. One eye followed the hand coming toward him. At the same time, he managed to keep track of the club hanging above him, ready to strike. Matt unfastened the chain from his collar and stepped away.
        - id: ch01-b21
          speaker: narrator
          text: >-
            White Fang could hardly understand that he was free. Many months had passed since Beauty Smith took possession of him. In all that time, he had known freedom only when he was released to fight another dog. Those moments never lasted. As soon as each fight ended, he was imprisoned again.
        - id: ch01-b22
          speaker: narrator
          text: >-
            What was he supposed to make of this? Perhaps the gods were preparing some new cruelty. He walked slowly and carefully, ready to be attacked at any moment. He had no idea what to do because nothing like this had ever happened before. First, he kept well away from the two watching men and crept to the cabin corner. Nothing happened there. Plainly puzzled, he came back again. He stopped about twelve feet from the men and studied them closely.
        - id: ch01-b23
          speaker: weedon_scott
          text: “Won't he run off?”
        - id: ch01-b24
          speaker: matt
          text: “We'll have to take the chance. There's only one way to find out.”
        - id: ch01-b25
          speaker: weedon_scott
          text: “Poor devil. What he needs is a little human kindness.”
          emotion: sad
        - id: ch01-b26
          speaker: narrator
          text: >-
            Scott went inside the cabin and returned with a piece of meat. When he tossed it to White Fang, White Fang sprang away and studied it from a distance.
        - id: ch01-b27
          speaker: matt
          text: “Major! Get back!”
        - id: ch01-b28
          speaker: narrator
          text: >-
            The warning came too late. Major leaped for the meat. The instant his jaws closed on it, White Fang struck and knocked him down. Matt rushed forward, but White Fang was quicker. Major staggered back to his feet while blood poured from his throat. It reddened the snow in a path that grew wider as he moved.
        - id: ch01-b29
          speaker: weedon_scott
          text: “It's terrible, but Major brought it on himself.”
        - id: ch01-b30
          speaker: narrator
          text: >-
            Matt was already swinging his foot at White Fang. White Fang leaped. Teeth flashed, and Matt cried out. Still snarling, White Fang scrambled several yards away. Matt bent over to examine his leg.
        - id: ch01-b31
          speaker: matt
          text: “He got me, all right.”
        - id: ch01-b32
          speaker: narrator
          text: >-
            He pointed to his torn trousers and underclothes. A red stain was growing underneath.
        - id: ch01-b33
          speaker: weedon_scott
          text: >-
            “I told you it was hopeless, Matt. I've thought about what we might have to do, then tried not to think about it. But we've reached that point now. There's only one thing left.”
          emotion: sad
        - id: ch01-b34
          speaker: narrator
          text: >-
            Slowly and unwillingly, Scott drew his revolver. He opened the cylinder and checked the cartridges.
        - id: ch01-b35
          speaker: matt
          text: >-
            “Hold on, Mr. Scott. That animal's been through hell. You can't expect him to come out of it like some pure, shining angel. Give him time.”
        - id: ch01-b36
          speaker: weedon_scott
          text: “Look at Major.”
        - id: ch01-b37
          speaker: narrator
          text: >-
            Matt looked at the wounded dog. Major had sunk into the snow inside a circle of his own blood. He was taking his last breaths.
        - id: ch01-b38
          speaker: matt
          text: >-
            “Major deserved it. You said that yourself, Mr. Scott. He tried to steal White Fang's meat, and now he's done for. That's what you'd expect to happen. I wouldn't give two whoops for a dog that wouldn't fight for his own food.”
        - id: ch01-b39
          speaker: weedon_scott
          text: “But he bit you too, Matt. Dogs are one thing, but there has to be a limit.”
        - id: ch01-b40
          speaker: matt
          text: >-
            “I deserved it too. Why did I try to kick him? You'd just said he was right to defend his meat. That means I had no right to kick him.”
        - id: ch01-b41
          speaker: weedon_scott
          text: “Killing him would be a mercy. He can't be tamed.”
        - id: ch01-b42
          speaker: matt
          text: >-
            “Now listen, Mr. Scott. Give the poor devil one fighting chance. He's never had any chance at all. He's just come through hell, and this is the first time he's been loose. Let him have a fair try. If he doesn't prove himself, I'll kill him myself. There. You have my word.”
        - id: ch01-b43
          speaker: weedon_scott
          text: >-
            “God knows I don't want him killed. We'll leave him loose and find out what kindness can do. I'll start now.”
        - id: ch01-b44
          speaker: narrator
          text: >-
            Scott put the revolver away. Then he walked toward White Fang, speaking in a soft, soothing voice.
        - id: ch01-b45
          speaker: matt
          text: “You'd better keep a club close.”
        - id: ch01-b46
          speaker: narrator
          text: Scott shook his head and kept trying to gain White Fang's trust.
        - id: ch01-b47
          speaker: narrator
          text: >-
            White Fang was suspicious. He knew something was coming. He had killed this god's dog and bitten the god's companion. What could follow except some terrible punishment? Yet when that punishment came, he would not surrender. He was indomitable. His fur stood up and his teeth showed. His eyes stayed watchful, and his whole body was wary and prepared for anything.
        - id: ch01-b48
          speaker: narrator
          text: >-
            The god carried no club, so White Fang allowed him to come quite close. Then the man's hand reached out and began to lower toward his head. White Fang shrank beneath it. His whole body tightened as he crouched. This was danger. It might be a trick or some hidden betrayal. He knew the hands of the gods. He knew their mastery and all the clever ways they could cause pain. Beyond that, he had always hated being touched.
        - id: ch01-b49
          speaker: narrator
          text: >-
            His snarl grew more threatening. He crouched lower and lower, but the hand still came down. White Fang did not want to bite it. He endured the danger for as long as he could. Then instinct surged up inside him and took command, driven by an endless hunger for life.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Weedon Scott believed he was quick enough to escape any snap or slash from those jaws. He had not yet learned how astonishingly fast White Fang could be. White Fang struck with the certainty and swiftness of a coiled snake.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Scott cried out sharply in surprise. He caught his torn hand and held it tight inside his other one. Matt let out a great oath and sprang to his side. White Fang crouched and backed away. He bristled, showed his fangs, and glared at them with menace. Now he could expect a beating as terrible as any he had suffered from Beauty Smith.
        - id: ch01-b52
          speaker: weedon_scott
          text: “Hey! What are you doing?”
          emotion: surprised
        - id: ch01-b53
          speaker: narrator
          text: Matt had rushed into the cabin and returned with a rifle.
        - id: ch01-b54
          speaker: matt
          text: “Nothing much. I'm only keeping my promise. I said I'd kill him if it came to that.”
        - id: ch01-b55
          speaker: weedon_scott
          text: “No, you won't!”
        - id: ch01-b56
          speaker: matt
          text: “Yes, I will. Just watch.”
        - id: ch01-b57
          speaker: narrator
          text: >-
            Matt had defended White Fang after the first bite. Now it was Scott's turn to defend him.
        - id: ch01-b58
          speaker: weedon_scott
          text: >-
            “You told me to give him a chance. Well, give it to him now. We've only just started, and we can't quit at the beginning. This time, I deserved what I got. And look at him!”
        - id: ch01-b59
          speaker: narrator
          text: >-
            White Fang stood near the cabin corner, forty feet away. His savage snarl was not aimed at Scott. It was aimed at Matt.
        - id: ch01-b60
          speaker: matt
          text: “Well, I'll be everlastingly gosh-swoggled!”
          emotion: surprised
        - id: ch01-b61
          speaker: weedon_scott
          text: >-
            “Look at how intelligent he is. He understands what a firearm means just as well as you do. We have to give that intelligence a chance. Put the rifle down.”
        - id: ch01-b62
          speaker: matt
          text: “All right. I'm willing.”
        - id: ch01-b63
          speaker: narrator
          text: Matt leaned the rifle against the woodpile.
        - id: ch01-b64
          speaker: matt
          text: “But would you look at that!”
          emotion: surprised
        - id: ch01-b65
          speaker: narrator
          text: White Fang had quieted at once. He had stopped snarling as soon as the rifle was put down.
        - id: ch01-b66
          speaker: matt
          text: “This is worth testing. Watch him.”
        - id: ch01-b67
          speaker: narrator
          text: >-
            Matt reached toward the rifle. At once, White Fang snarled. Matt stepped away from it, and White Fang lowered his lips over his teeth again.
        - id: ch01-b68
          speaker: matt
          text: “Now let's see what he does.”
        - id: ch01-b69
          speaker: narrator
          text: >-
            Matt picked up the rifle and slowly raised it toward his shoulder. White Fang's snarl began with that first movement. It grew stronger and stronger as the weapon came closer to firing position. One instant before the rifle was level with him, White Fang sprang sideways and vanished behind the cabin corner. Matt stood there, staring down the sights at the empty patch of snow White Fang had just occupied.
        - id: ch01-b70
          speaker: narrator
          text: >-
            The dog-musher solemnly lowered the rifle. Then he turned to his employer.
        - id: ch01-b71
          speaker: matt
          text: “I agree with you, Mr. Scott. That dog is too intelligent to kill.”
