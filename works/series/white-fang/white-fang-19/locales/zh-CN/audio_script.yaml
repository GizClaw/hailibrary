audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
    scott:
      display_name: 威登·斯科特
      tts:
        delivery: 正直果断，愤怒时依然清醒
        timbre: 清朗坚实
        pace: 稳健有力
        pitch: 中低
    matt:
      display_name: 马特
      tts:
        delivery: 老练朴实，说话直接
        timbre: 粗粝温厚
        pace: 从容
        pitch: 低
  chapters:
    - id: ch01
      title: 第五章　桀骜不驯
      blocks:
        - id: ch01-b01
          speaker: scott
          text: “看来是没指望了。”
          emotion: sad
        - id: ch01-b02
          speaker: narrator
          text: >-
            威登·斯科特坐在木屋门前的台阶上，望向赶狗人马特。马特只是耸耸肩，他也想不出办法。两人再一起看向铁链另一端的白牙。白牙把链子挣得笔直，浑身毛发耸立，咆哮着想扑向雪橇犬。马特早用棍子教训过那些狗，它们如今都懂得躲远些，趴在那里，只当白牙不存在。
        - id: ch01-b03
          speaker: scott
          text: “他是头狼。这样的野性，根本驯不下来。”
        - id: ch01-b04
          speaker: matt
          text: “这话可不一定。谁知道呢，也许他身上狗的那一半还多着。可有件事，我敢说绝不会错。”
        - id: ch01-b05
          speaker: narrator
          text: 马特停住话头，朝麋鹿皮山煞有介事地点点头。斯科特等了一会儿，终于失去了耐心。
        - id: ch01-b06
          speaker: scott
          text: “知道什么就痛快说，别舍不得。究竟是什么？”
        - id: ch01-b07
          speaker: narrator
          text: 马特用拇指朝身后的白牙一指。
        - id: ch01-b08
          speaker: matt
          text: “是狼也好，是狗也好，反正他早叫人驯过了。”
        - id: ch01-b09
          speaker: scott
          text: “不可能！”
          emotion: surprised
        - id: ch01-b10
          speaker: matt
          text: “真的，他还拉过雪橇。你仔细瞧瞧，他胸前不是有几道印子吗？”
        - id: ch01-b11
          speaker: scott
          text: “你说对了，马特。美人史密斯抓到他以前，他做过雪橇犬。”
        - id: ch01-b12
          speaker: matt
          text: “那他当然也能再做雪橇犬。”
        - id: ch01-b13
          speaker: scott
          text: “你真这么想？可我们已经养了他两个星期。他不但没好转，现在好像比过去更野了。”
        - id: ch01-b14
          speaker: matt
          text: “给他一次机会。先解开链子，让他自由活动一阵。”
        - id: ch01-b15
          speaker: narrator
          text: 斯科特不敢相信地看着他。
        - id: ch01-b16
          speaker: matt
          text: “没错。你以前也试过，可那次手里没有棍子。”
        - id: ch01-b17
          speaker: scott
          text: “那就由你来。”
        - id: ch01-b18
          speaker: narrator
          text: >-
            马特找来一根棍子，走近白牙。白牙盯住棍子的眼神，就像笼里的狮子盯着驯兽师的鞭子。
        - id: ch01-b19
          speaker: matt
          text: “看见没有？他的眼睛一直跟着棍子。这是个好兆头。他不傻，只要我拿着棍子，他就不敢扑上来。可见他还没有完全发疯。”
        - id: ch01-b20
          speaker: narrator
          text: >-
            马特把手伸向白牙的脖颈。白牙伏低身体，竖起毛发，喉间发出警告。他盯着靠近的手，也没有漏掉另一只手里的棍子。那根棍子悬在头顶，随时可能打下来。白牙既要防着手，又要提防棍子，还是一动不敢动。马特就这样解开项圈上的链扣，退到一旁。

            白牙几乎不能相信，自己竟然自由了。他落入美人史密斯手中已经好几个月。除了被放出去和别的狗厮杀，他从未有过片刻自由。每一场恶斗刚结束，铁链便会再次锁住他。

            眼前这一切从未发生过，他根本不知道该怎么办。也许，神又准备了什么更恶毒的新花招。白牙只能小心翼翼地移动，提防随时会来的袭击。他避开盯着自己的两个人，缓缓走到木屋墙角。没有袭击，也没有惩罚。他满心困惑，又走回来，在十二英尺外停住，目不转睛地观察着他们。
        - id: ch01-b21
          speaker: scott
          text: “他会不会跑掉？”
        - id: ch01-b22
          speaker: matt
          text: “只能冒一次险了。想知道他会不会跑，非得亲眼试过才行。”
        - id: ch01-b23
          speaker: scott
          text: “可怜的家伙。他该知道一次，人也能好好待他。”
          emotion: sad
        - id: ch01-b24
          speaker: narrator
          text: >-
            斯科特转身进屋，拿了一块肉出来，朝白牙抛过去。白牙却像躲避袭击一样，猛地从肉旁跳开。他站在远处，满腹狐疑地盯着那块肉，怎么也不肯靠近。就在这时，梅杰扑了过去。
        - id: ch01-b25
          speaker: matt
          text: “嘿，梅杰！回来！”
        - id: ch01-b26
          speaker: narrator
          text: >-
            警告已经迟了。梅杰纵身扑向那块肉，双颚刚刚合拢，白牙便发动袭击，把他撞翻在地。马特连忙冲过去，可白牙比他更快。梅杰踉跄着站起，喉咙里喷出的鲜血却已经把雪染红，而且红色还在向外铺开。
        - id: ch01-b27
          speaker: scott
          text: “这太糟了。不过，确实是梅杰自己抢肉在先。”
        - id: ch01-b28
          speaker: narrator
          text: >-
            可马特已经抬脚踢向白牙。只见白牙骤然一跃，牙光闪过，马特尖叫一声。白牙凶狠地咆哮着，一连向后蹿出好几码。马特弯下身去检查伤处，只见裤子和里面的衣服都被撕破，腿上的血迹还在越洇越大。
        - id: ch01-b29
          speaker: matt
          text: “这一口真叫他咬着了。”
        - id: ch01-b30
          speaker: scott
          text: “我说过他没救了。这个念头我早就有，只是不肯面对。现在没有别的办法了。”
          emotion: sad
        - id: ch01-b31
          speaker: narrator
          text: 斯科特极不情愿地拔出左轮手枪，打开弹巢，检查里面的子弹。
        - id: ch01-b32
          speaker: matt
          text: “斯科特先生，他刚从地狱里走出来。你总不能指望他马上变成洁白光明的天使。再给他一点时间吧。”
        - id: ch01-b33
          speaker: scott
          text: “看看梅杰。”
        - id: ch01-b34
          speaker: narrator
          text: 马特转头看去。梅杰已经倒在雪地上，自己的鲜血围成一圈。他显然只剩下最后一口气，眼看就要死了。
        - id: ch01-b35
          speaker: matt
          text: “那是他自找的，刚才你也这样说。他想抢白牙的肉，当然会送命。要是连自己的肉也不肯拼命护住，那样的狗，我看都懒得看。”
        - id: ch01-b36
          speaker: scott
          text: “狗之间的事可以这么算。可你看看自己的腿，我们总得划一条界线。”
        - id: ch01-b37
          speaker: matt
          text: “我挨咬也是自找的。我为什么要踢他？你才说他做得没错。既然没错，我就没有资格踢他。”
        - id: ch01-b38
          speaker: scott
          text: “杀了他反而是仁慈。他永远也驯不服。”
        - id: ch01-b39
          speaker: matt
          text: “斯科特先生，至少让这个可怜的家伙拼一次。他从前根本没有机会。他才刚逃出地狱，这又是头一回自由。给他公平的一次机会吧。要是他还是不成，我亲手杀他。就这么办！”
        - id: ch01-b40
          speaker: scott
          text: “上帝知道，我一点也不想杀他，更不愿看别人杀他。先让他自由活动，看看善意能不能改变他。现在，我就先试一次。”
        - id: ch01-b41
          speaker: narrator
          text: 斯科特收起左轮手枪，朝白牙走过去。他一边靠近，一边用温和安抚的声音同白牙说话。
        - id: ch01-b42
          speaker: matt
          text: “最好拿根棍子在手里。”
        - id: ch01-b43
          speaker: narrator
          text: >-
            斯科特摇摇头，继续设法取得白牙的信任。白牙心里只有怀疑。他知道一定有什么事就要发生。他杀了这个神的狗，又咬伤另一个神，除了可怕的惩罚，还能等来什么？可哪怕惩罚已经临头，他也决不屈服。白牙毛发直立，露出獠牙，双眼警觉，整个身体处处戒备，准备应付一切。

            斯科特没有拿棍子，所以白牙容许他走得很近。那只手伸了出来，慢慢落向白牙的脑袋。白牙把身体缩得更紧，在手掌下越伏越低。危险就在眼前，不是圈套，也一定是别的祸事。神的手有多强，又多么懂得伤害他，他早就知道。他也一向厌恶任何触碰。白牙的咆哮越来越凶，可手掌仍在落下。他不愿咬这只手，一直强忍着危险，直到求生的本能猛然涌上来。那股本能力量太强，终于彻底压倒了他的克制。

            斯科特原以为自己动作够快，不管白牙突然咬来还是挥牙撕来，都一定能及时躲开。可他还不了解白牙惊人的速度。白牙一击时，快得像猛然弹起的蛇，而且又准又狠。

            斯科特惊叫一声，连忙用另一只手抓紧受伤的手。马特破口大骂，跳到他身旁。白牙伏低身子，向后退去，浑身毛发耸立，獠牙完全露在外面，眼里满是凶狠的威胁。他知道，接下来就该挨一顿毒打了，那毒打一定会像美人史密斯从前给他的任何一次一样可怕。
        - id: ch01-b44
          speaker: scott
          text: “喂！你这是要干什么？”
          emotion: surprised
        - id: ch01-b45
          speaker: narrator
          text: 马特已经冲进木屋，拿着一支步枪跑了出来。他故意装出漫不经心的平静，开口时声音放得很慢。
        - id: ch01-b46
          speaker: matt
          text: “没什么。我只是要兑现刚才的承诺。我说过，如果非杀他不可，就由我来动手。现在轮到我了。”
        - id: ch01-b47
          speaker: scott
          text: “你不能杀他！”
        - id: ch01-b48
          speaker: matt
          text: “我非杀不可。你看着吧。”
        - id: ch01-b49
          speaker: narrator
          text: 刚才马特被咬时还替白牙求情，现在轮到斯科特替他求情了。
        - id: ch01-b50
          speaker: scott
          text: “是你说该给他一个机会。那就真给他一次。我们才刚开始，不能现在就放弃。这回是我自找的。而且，你看看他！”
        - id: ch01-b51
          speaker: narrator
          text: >-
            白牙站在木屋墙角附近，离两人足有四十英尺。他发出叫人血都要冻住的凶恶咆哮，可他盯着的不是刚被自己咬伤的斯科特，而是手持步枪的赶狗人马特。
        - id: ch01-b52
          speaker: matt
          text: “这可真把我吓傻了！”
          emotion: surprised
        - id: ch01-b53
          speaker: scott
          text: “看他多聪明。他和你一样明白枪是做什么的。既然他有这样的脑子，我们就该给这份聪明一次机会。把枪收起来。”
        - id: ch01-b54
          speaker: matt
          text: “好吧，我听你的。”
        - id: ch01-b55
          speaker: narrator
          text: 马特把步枪斜靠在柴堆旁。白牙很快安静下来，不再咆哮。下一刻，马特又惊叫起来。
        - id: ch01-b56
          speaker: matt
          text: “你再看！这事值得好好试一试，你瞧好了。”
        - id: ch01-b57
          speaker: narrator
          text: >-
            马特伸手去拿步枪，就在手指接近枪身的一刻，白牙立刻又咆哮起来。马特一退开，白牙抬起的嘴唇便落下去，重新遮住牙齿。
        - id: ch01-b58
          speaker: matt
          text: “现在只是试着玩玩。”
        - id: ch01-b59
          speaker: narrator
          text: >-
            马特拿起步枪，开始缓缓举向肩头。他一动，白牙便开始咆哮。枪口越接近瞄准的位置，吼声就越发凶猛。就在步枪快要对准他的前一刻，白牙猛地跃向一旁，躲到了木屋墙角后面。马特站在那里，沿着瞄准线望去，白牙刚才站过的地方只剩下一片空荡荡的雪地。

            他庄重地放下步枪，转身看向斯科特。
        - id: ch01-b60
          speaker: matt
          text: “斯科特先生，我同意你的话。这条狗聪明得让人下不了手。”
