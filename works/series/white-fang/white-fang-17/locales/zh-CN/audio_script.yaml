audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 仇恨的囚笼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            在疯狂之神的调教下，白牙成了恶魔。美人史密斯把他拴在堡垒后面的围栏里，天天戏弄他，用各种小小的折磨逼他发狂。他很快发现，白牙最受不了嘲笑。于是，每回用诡计害白牙吃了苦头，他就放声大笑，还伸手指着白牙，满脸轻蔑。只要这笑声响起，白牙就再也没有理智。他会陷进暴怒里，疯得甚至胜过美人史密斯。
        - id: ch01-b02
          speaker: narrator
          text: >-
            从前，白牙只是同类的敌人，虽然已经十分凶残。现在，他仇视世上的一切，也比从前更加凶猛。折磨叫他只剩下盲目的恨，心里连一点理智的火星都没有了。他恨脖子上的铁链，恨那些隔着木条看他的人，也恨跟在人身边的狗。那些狗知道他无法还击，偏要恶狠狠地冲他咆哮。他连围栏的木头也恨。可是从头到尾，他最恨的还是美人史密斯。
        - id: ch01-b03
          speaker: narrator
          text: >-
            美人史密斯这样折磨白牙，自有他的打算。一天，一群人围到了栏边。他拿着棍棒走进去，解下白牙脖子上的铁链，然后退了出去。白牙一得到自由，立刻绕着围栏狂奔，一次次想扑向外面的人。那模样既壮丽又可怕。他从鼻尖到尾根足有五英尺，肩高两英尺半，比同样大小的狼重得多。母亲留给他一副厚实的狗的体格。他身上没有脂肪，也没有多余的肉，体重却超过九十磅。那一身全是肌肉、骨骼和筋腱，每一寸血肉都为搏斗做好了准备。
        - id: ch01-b04
          speaker: narrator
          text: >-
            围栏的门再次打开，白牙忽然停住了。事情有些反常，他站着等待。门越开越大，一条巨犬被猛地推进来，门随即在它身后关紧。白牙从没见过獒犬，可对方庞大的身体和凶恶的样子吓不住他。眼前这个东西不是木头，也不是铁，他终于能把仇恨发泄到它身上。白牙猛扑过去，獠牙一闪，撕开了獒犬的颈侧。獒犬甩动脑袋，粗声咆哮着冲向他。可白牙一会儿在这里，一会儿又到了那里，叫它怎么也碰不着。他总是突然扑近，一口撕下去，再赶在反击到来前纵身退开。
    - id: ch02
      title: 战狼成名
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            外面的人高声喝彩。美人史密斯欣喜若狂，得意地看着白牙把獒犬撕得血肉模糊。那条狗从一开始就没有胜算，它实在太重，也太慢了。最后，美人史密斯挥棍逼退白牙，獒犬的主人趁机抓住自己的狗，把它从围栏里拖了出去。接着，赌输的人付了钱。钱币落进美人史密斯手里，叮当作响。
        - id: ch02-b02
          speaker: narrator
          text: >-
            从此以后，白牙竟盼着人们聚到围栏四周，因为那表示又要开打了。现在，他体内那股活着的力量，只能从搏斗里冲出来。他受尽折磨，被逼出满腔仇恨，又被牢牢囚禁。只有当主人愿意放进另一条狗时，他才有机会满足这份恨。美人史密斯没有看错他的本领，白牙从不失手。有一天，三条狗先后被送进来。另一天，一头刚从荒野捕来的成年狼被推入围栏。又有一天，两条狗一同扑向他。那是最惨烈的一战。白牙最终杀死了两个对手，自己也几乎送了命。
        - id: ch02-b03
          speaker: narrator
          text: >-
            秋天来了，初雪飘下，育空河上流着半凝的碎冰。美人史密斯带白牙上了一艘汽船，逆流前往道森。这时，北方到处都有人听说过“战狼”。汽船甲板上的笼子旁，总围着好奇的人。白牙有时对他们狂吼，有时只是躺着，用冰冷的仇恨看着他们。他从不问自己为什么恨，只知道恨，也任由自己沉进那股激情。生命已经成了地狱。他生来不是为了忍受这种狭窄的囚禁，人们却偏偏把他当作关在笼里的野兽。他们盯着他看，把棍子伸进栏杆逗他发怒，再对着他的咆哮哈哈大笑。
        - id: ch02-b04
          speaker: narrator
          text: >-
            这些人就是白牙身边的世界。正是他们一次次捏塑他，把他变得比大自然原本的安排更加凶残。好在大自然也给了白牙适应改变的能力。许多动物遇上这样的日子，早就死了，或者精神彻底垮掉。白牙却改变自己，活了下来，而且没有拿自己的精神作为代价。美人史密斯是个最凶恶的魔鬼，也是他的折磨者。也许这个人真能摧毁白牙的精神，可至少现在，他还远远没有成功。
    - id: ch03
      title: 道森的展品
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            美人史密斯心里有一个魔鬼，白牙心里也有一个。这两个魔鬼日日相斗，从不停歇。过去，白牙知道手持棍棒的人不能反抗，会伏下身体表示顺从。如今，他连这份智慧也丢掉了。只要看见美人史密斯，他就会暴怒。哪怕棍棒把他逼退，他还是露着獠牙，不停地低吼。谁也别想从他身上逼出最后一声。不管挨多少打，他总能再发出一声吼叫。等美人史密斯放弃离开，那声挑衅便一路追在身后。要不然，白牙就扑向笼栏，把满腔的恨怒吼出来。
        - id: ch03-b02
          speaker: narrator
          text: >-
            汽船到了道森，白牙被带上岸，可他的生活依然摆在人们眼前。他关在笼子里，周围永远有好奇的面孔。人们把他当作“战狼”展览，只需交五十美分的金沙，就能进来看他。他连睡觉也不得安宁。只要一躺下，就有人拿尖棍把他捅醒，免得观众觉得花钱不值。为了让表演好看，他几乎一直被逼在盛怒里。更可怕的是周围的气氛。人人看他都像看最凶猛的野兽。那些话语，那些小心戒备的动作，都隔着栏杆告诉他，他有多么可怕。这就像不断把燃料扔进凶性的火里。于是，他的凶猛吞噬自身，一天天变得更强。环境的压力，又一次把这团生命之泥捏成了新的模样。
        - id: ch03-b03
          speaker: narrator
          text: >-
            白牙不只供人参观，也成了专门上场的斗兽。每当有人安排好一场厮杀，他就会被牵出笼子，带到镇外几英里的树林。为了避开领地骑警，他们通常趁夜赶路。等上几个钟头，天亮时，观众和白牙的对手也到了。就这样，各种大小、各种品种的狗都同他打过。那片土地野蛮，那里的人也野蛮，每一场厮杀几乎都要用死亡收场。
        - id: ch03-b04
          speaker: narrator
          text: >-
            白牙一直活着，也就说明，死的总是别的狗。他从来没有输过。幼年时，他曾同利普利普和整群小狗一次次厮杀，那些经历现在全都派上了用场。白牙的四足紧紧抓住地面，没有哪条狗能叫他站立不稳。狼种狗最爱迎面猛冲，或是突然转向撞来，打算撞中他的肩膀，把他掀倒。麦肯齐猎犬、爱斯基摩犬、拉布拉多犬、哈士奇和马拉缪特犬，都试过这一招，也都失败了。人们彼此传说白牙从不倒地，每一回又都等着看他倒下。可是，他每次都叫他们失望。
    - id: ch04
      title: 无敌的对手
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            白牙的动作快得像闪电，这也是极大的优势。无论对手打过多少场，都没见过这样迅疾的狗。他发起攻击时更是毫无迟疑。普通的狗开打以前，总要龇牙、竖毛、低吼一阵。可这些架势还没做完，它就会被白牙撞倒，甚至没来得及从惊愕中回过神来，性命已经没了。这样的事一再发生。到后来，人们只好先按住白牙，等对手做完所有准备，站稳架势，再让对手抢先扑上来，才肯把他放开。
        - id: ch04-b02
          speaker: narrator
          text: >-
            不过，白牙最大的优势还是经验。他比任何对手都懂得怎样搏斗。他经历的厮杀更多，见过的手段和花招更多，自己会的招数也更多。至于他的打法，几乎已经找不到能够改进的地方。
        - id: ch04-b03
          speaker: narrator
          text: >-
            日子一久，白牙出战的机会越来越少。人们已经找不到能和他匹敌的狗，美人史密斯只好用狼来做他的对手。印第安人会专门设下陷阱，把狼捉来。每次白牙斗狼，总能引来大群观众，从来没有一次例外。有一回，他们弄到一头成年的母猞猁。这一次，白牙必须为自己的性命而战。母猞猁和他一样迅捷，也和他一样凶猛。白牙只有一口獠牙，她却还多了四只长着尖爪的脚。
        - id: ch04-b04
          speaker: narrator
          text: >-
            同猞猁打过以后，白牙再也没有参加搏斗。已经找不到动物能同他交手，至少在人们眼中，没有谁配做他的对手。他只好继续关在笼子里供人展览。第二年春天，一个叫蒂姆·基南的法罗牌庄家来到北方，还带来了克朗代克从未出现过的斗牛犬。它和白牙早晚会碰到一起。整整一个星期，在镇上的某些角落里，人们谈来谈去，谈的全是这场盼望已久的搏斗。
