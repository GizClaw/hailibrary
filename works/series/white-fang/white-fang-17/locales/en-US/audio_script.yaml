audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE MAKING OF A FIEND
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Under the teaching of the mad god, White Fang became a fiend. Beauty Smith kept him chained in a pen behind the fort. There he teased him, irritated him, and drove him wild with one small torment after another.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Beauty Smith soon learned what laughter did to him. He would trick White Fang in some painful way, then point a mocking finger and roar with scornful laughter. At those moments, all reason left White Fang. His rage became even madder than the man who tormented him.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Once, White Fang had been a fierce enemy only to other animals of his kind. Now he became the enemy of everything. He had been tormented until he hated blindly, without the smallest spark of reason. He hated the chain around him. He hated the men staring through the wooden slats, and the dogs that stood safely beside them and snarled at him. He even hated the wood of the pen. First, last, and more than anything else, he hated Beauty Smith.
        - id: ch01-b04
          speaker: narrator
          text: >-
            But Beauty Smith had a purpose. One day, a group of men gathered around the pen. Beauty Smith went inside carrying a club, removed the chain from White Fang's neck, and stepped out again. White Fang raced around the enclosure, trying to reach the men beyond it.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He was terrible and magnificent. He measured five feet from end to end and stood two and a half feet at the shoulder. The heavier build he had inherited from his dog mother made him much larger than a wolf of the same length. He weighed more than ninety pounds, with no fat and no useless flesh. His body was all muscle, bone, and sinew, perfectly formed for fighting.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The door began to open again. White Fang stopped and waited. Something strange was happening. The opening widened, a huge mastiff was shoved through it, and the door slammed shut.
        - id: ch01-b07
          speaker: narrator
          text: >-
            White Fang had never seen a dog like this, but its great size and fierce look did not frighten him. At last, here was something that was neither wood nor iron, something living on which he could unleash his hate. He sprang forward. His fangs tore down the side of the mastiff's neck.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The mastiff shook its head, gave a deep growl, and lunged at him. But White Fang seemed to be everywhere at once. He slipped away from every rush, darted back to slash with his teeth, and escaped before the larger dog could punish him.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Outside the pen, the men shouted and cheered. Beauty Smith watched White Fang tear and wound the mastiff, and the sight filled him with delight. The mastiff had never had a chance. It was too heavy and too slow. At last, its owner dragged it out while Beauty Smith held White Fang back with his club. The men settled their bets, and coins clinked into Beauty Smith's hand.
    - id: ch02
      title: THE FIGHTING WOLF
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Before long, White Fang began to look forward to the sight of men gathering around his pen. Their arrival meant a fight, and fighting was now his only chance to release the life and hatred inside him. Beauty Smith kept him imprisoned and constantly stirred that hatred, then allowed him to satisfy it only when another dog was put before him.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Beauty Smith had judged White Fang's power well. White Fang always won. One day, three dogs were sent into the pen, one after another. On another day, he faced a full-grown wolf that had just been caught in the Wild and shoved through the door. Then two dogs were turned against him at once. That was his hardest battle. He killed them both, but the fight left him half dead as well.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Autumn came. The first snow began to fall, and loose ice drifted down the river. Beauty Smith booked passage for himself and White Fang on a steamboat traveling up the Yukon to Dawson.
        - id: ch02-b04
          speaker: narrator
          text: >-
            By then, White Fang was famous throughout the land as the Fighting Wolf. Curious men crowded around the cage on the steamboat's deck. Sometimes he raged and snarled at them. Sometimes he lay still and watched them with cold hatred.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Why should he not hate them? The question never entered his mind. He knew nothing but hate, and he gave himself completely to it. Life had become a hell. He was not made to live in the close prison men used for wild animals, yet that was how they treated him. They stared, pushed sticks through the bars until he snarled, and laughed.
        - id: ch02-b06
          speaker: narrator
          text: >-
            These men were the world around him, and that world was shaping him into something fiercer than Nature had meant him to be. Still, Nature had made him able to change. Another animal might have died or had its spirit crushed. White Fang changed himself and survived, without giving up any of his spirit. Beauty Smith might someday have been able to break him, but so far, he had failed.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Beauty Smith had a devil inside him, and White Fang had one of his own. The two raged against each other without end. In earlier days, White Fang had known enough to crouch and submit when a man held a club. He had lost that wisdom now. The sight of Beauty Smith alone sent him into a fury.
        - id: ch02-b08
          speaker: narrator
          text: >-
            When they came close and the club beat him back, White Fang still growled, snarled, and bared his teeth. No beating could force the final growl out of him. He always had one more. When Beauty Smith finally stopped and moved away, a defiant growl followed him. Or White Fang hurled himself against the cage and bellowed his hatred through the bars.
    - id: ch03
      title: A LIFE ON DISPLAY
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            When the steamboat reached Dawson, White Fang was taken ashore. His life remained public. He stayed in a cage with curious men always around him. Beauty Smith displayed him as the Fighting Wolf, and each man paid fifty cents in gold dust to look at him.
        - id: ch03-b02
          speaker: narrator
          text: >-
            White Fang was never allowed to rest. If he lay down to sleep, someone jabbed him with a sharp stick so the paying crowd would see what it had come for. Most of the time, he was deliberately kept in a rage.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Worst of all was the feeling that surrounded him. The men treated him as the most terrifying of wild beasts, and everything they did carried that message through the bars. Every word and every careful movement told him how fierce they believed him to be. Their fear fed his fierceness like fuel feeding a flame. His ferocity turned upon itself and kept growing. Once again, the world around him pressed and shaped his nature.
        - id: ch03-b04
          speaker: narrator
          text: >-
            White Fang was more than an animal on display. He was a professional fighter. The matches came at irregular times, whenever Beauty Smith could arrange one. White Fang was taken from his cage and led into the woods several miles outside town. These trips usually happened at night, beyond the notice of the Territory's mounted police.
        - id: ch03-b05
          speaker: narrator
          text: >-
            After hours of waiting, daylight came. Then the spectators arrived, along with the dog White Fang would face. He fought dogs of every size and breed. The land was savage, the men were savage, and most of those battles ended in death.
        - id: ch03-b06
          speaker: narrator
          text: >-
            White Fang kept fighting, so it was the other dogs that died. He never lost. The lessons of his youth, when Lip-lip and the whole puppy pack had attacked him, now served him well.
        - id: ch03-b07
          speaker: narrator
          text: >-
            He held to the ground with a grip no dog could break. Wolf dogs loved to charge straight in, or turn suddenly at the last instant, strike his shoulder, and knock him over. Mackenzie hounds tried it. So did Eskimo dogs, Labrador dogs, huskies, and Malemutes. Every one of them failed. Men spoke of this strange power and watched each fight, hoping to see him thrown. White Fang always denied them that sight.
    - id: ch04
      title: NEVER DEFEATED
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            His speed gave him another enormous advantage. No opponent, however experienced, had ever met a dog that moved as fast as White Fang. Then there was the suddenness of his attack. An ordinary dog expected time to bristle, snarl, and growl before the fighting began. White Fang often knocked that dog down and finished it before it had truly started or recovered from its surprise.
        - id: ch04-b02
          speaker: narrator
          text: >-
            It happened so often that the men began holding White Fang back. They waited while the other dog went through all its warnings, got ready, and even made the first attack.
        - id: ch04-b03
          speaker: narrator
          text: >-
            His greatest advantage was experience. White Fang knew more about fighting than any dog he faced. He had fought more battles. He understood more kinds of attack, possessed more tricks of his own, and had brought his own way of fighting as close to perfection as it could come.
        - id: ch04-b04
          speaker: narrator
          text: >-
            As time passed, fights became harder to arrange. The men gave up hope of finding a dog that could equal him, so Beauty Smith had to match him against wolves. Indians trapped the wolves for that purpose, and each battle between White Fang and a wolf drew a crowd.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Once, Beauty Smith obtained a full-grown female lynx. This time, White Fang had to fight for his life. She was as quick as he was and every bit as fierce. White Fang had only his fangs, while the lynx also had four feet armed with sharp claws.
        - id: ch04-b06
          speaker: narrator
          text: >-
            After the lynx, the fighting stopped. No more animals were available, or at least none that the men considered worthy of facing White Fang. He remained in his cage as an exhibit through the winter.
    - id: ch05
      title: THE COMING FIGHT
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Spring came at last. Then Tim Keenan arrived in the Klondike. He was a faro dealer, and he brought a dog unlike any that had entered the country before.
        - id: ch05-b02
          speaker: narrator
          text: >-
            It was the first bulldog the Klondike had ever seen. With White Fang already famous as the Fighting Wolf, there was no escaping what would follow. The two dogs were bound to meet.
        - id: ch05-b03
          speaker: narrator
          text: >-
            For an entire week, in certain parts of Dawson, people talked of little else. The coming fight drove every conversation.
