audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
    scott:
      display_name: 威登·斯科特
      tts:
        delivery: 正直果断，愤怒时依然清醒
        timbre: 清朗坚实
        pace: 稳健有力
        pitch: 中低
    matt:
      display_name: 马特
      tts:
        delivery: 老练朴实，说话直接
        timbre: 粗粝温厚
        pace: 从容
        pitch: 低
  chapters:
    - id: ch01
      title: 第一章　远行
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            空气里早已有了征兆。灾难还没有露面，白牙却知道，一场变故正在逼近。他说不出会发生什么，也不明白原因。这份预感，来自他的神。白牙从不进木屋，只守在门前的台阶上，可神心里的打算，还是在不经意间泄露给了他。
        - id: ch01-b02
          speaker: matt
          text: “你听听门外！”
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: >-
            一天晚上吃饭时，马特突然叫斯科特侧耳细听。门外传来一阵低沉而焦急的呜咽，仿佛压在喉咙里的抽泣终于漏了出来。随后又是一声长长的嗅探。白牙要确定，他的神还在屋里，没有独自消失。
        - id: ch01-b04
          speaker: matt
          text: “我看这头狼已经猜到你的心思了。”
        - id: ch01-b05
          speaker: narrator
          text: 斯科特望着马特，目光几乎是在求他帮忙，嘴上却硬得很。
        - id: ch01-b06
          speaker: scott
          text: “我带一头狼去加利福尼亚，有什么用？”
        - id: ch01-b07
          speaker: matt
          text: “可不是吗？你带他去加利福尼亚，能拿他怎么办？”
        - id: ch01-b08
          speaker: narrator
          text: 马特不置可否，像是在等斯科特自己作决定。斯科特却觉得，他正在暗暗评判自己。
        - id: ch01-b09
          speaker: scott
          text: “那边的狗碰上他，一条也活不了。他会见一条杀一条。就算赔偿没让我破产，官府也会把他抓走，用电刑处死。”
        - id: ch01-b10
          speaker: matt
          text: “这个我承认，他确实是个杀手。”
        - id: ch01-b11
          speaker: narrator
          text: 斯科特怀疑地盯着他，像要看看这句话里藏着什么。
        - id: ch01-b12
          speaker: scott
          text: “所以，我绝不能带他走。”
        - id: ch01-b13
          speaker: matt
          text: “对，绝不能带。要真带去了，你还得专门雇个人看着他。”
        - id: ch01-b14
          speaker: narrator
          text: >-
            斯科特这才高兴地点点头。屋里静了下来，门外又响起半似啜泣的呜咽，还有那长长的、四处探寻的嗅声。
        - id: ch01-b15
          speaker: matt
          text: “不过有一点谁也否认不了，他把你看得比什么都重。”
        - id: ch01-b16
          speaker: scott
          text: “该死，伙计！我知道自己在想什么，也知道怎样对大家最好！”
          emotion: angry
        - id: ch01-b17
          speaker: matt
          text: “我赞成你。我只是还有句话想说。”
        - id: ch01-b18
          speaker: scott
          text: “那你到底想说什么？”
          emotion: angry
        - id: ch01-b19
          speaker: matt
          text: “我是想说，你不用发这么大的火。看你现在的样子，别人还以为你根本没拿定主意呢。”
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: 斯科特独自想了一会儿，再开口时，声音已经缓和下来。
        - id: ch01-b21
          speaker: scott
          text: “你说得没错，马特。我确实拿不定主意，麻烦就在这里。”
        - id: ch01-b22
          speaker: narrator
          text: 又沉默了一阵，他忽然像在说服自己。
        - id: ch01-b23
          speaker: scott
          text: “我要真把那条狗带上，岂不是荒唐透了。”
        - id: ch01-b24
          speaker: matt
          text: “我也觉得荒唐。”
        - id: ch01-b25
          speaker: narrator
          text: 斯科特听了，仍旧不满意。马特却装出一脸无辜。
        - id: ch01-b26
          speaker: matt
          text: “可他究竟怎么知道你要走，我真是怎么都想不通。”
        - id: ch01-b27
          speaker: scott
          text: “我也想不明白，马特。”
          emotion: sad
        - id: ch01-b28
          speaker: narrator
          text: >-
            那一天还是来了。木屋的门敞着，白牙看见地板上那只旅行包，也看见爱的主人正往里面装东西。人们进进出出，屋里往日的安宁全被不安搅乱。白牙原先只是嗅到了变故，如今，他终于明白了。神又要离开，而且和上一次一样，不会带他同行。

            当天夜里，白牙仰起口鼻，对着冰冷的群星发出长长的狼嗥。幼年时，他曾经离开荒野，赶回印第安人的村子。可村子已经消失，灰海狸的帐篷也不见了，原地只剩下一堆垃圾。那时他也是这样哀号。如今，他再一次向群星倾诉悲苦。
        - id: ch01-b29
          speaker: narrator
          text: 木屋里，两个男人刚躺下。
        - id: ch01-b30
          speaker: matt
          text: “他又不吃东西了。”
        - id: ch01-b31
          speaker: narrator
          text: 斯科特的床铺上传来一声咕哝，毯子也跟着动了动。
        - id: ch01-b32
          speaker: matt
          text: “你上次走了以后，他就差点撑不过去。这一回，他真有可能死掉。”
        - id: ch01-b33
          speaker: narrator
          text: 另一张床上的毯子烦躁地翻动起来。
        - id: ch01-b34
          speaker: scott
          text: “行了，闭嘴吧！你怎么比女人还爱唠叨。”
          emotion: angry
        - id: ch01-b35
          speaker: matt
          text: “对，你说得都对。”
        - id: ch01-b36
          speaker: narrator
          text: 斯科特听着黑暗里的声音，不知道马特是不是偷笑了一下。
        - id: ch01-b37
          speaker: narrator
          text: >-
            第二天，白牙更加焦虑，也更加坐立不安。主人出门，他就一步不离地跟在脚边。主人留在屋里，他便守着前门的台阶。透过敞开的门，他看见行李越来越多。旅行包旁添了两个大帆布袋和一只箱子。马特又把主人的毯子和毛皮袍卷进一小块防水布里。白牙看着这一切，嘴里不停呜咽。

            后来，两个印第安人过来扛起行李。马特自己抱着铺盖，提着旅行包，领他们走下山坡。白牙仔细看着，却没有跟去，因为主人还在木屋里。过了一阵，马特回来了。斯科特走到门边，把白牙叫了进去。
        - id: ch01-b38
          speaker: scott
          text: “你这个可怜的家伙。我要出远门了，老伙计，这次你不能跟。来吧，最后给我低吼一声，好好道个别。”
          emotion: sad
        - id: ch01-b39
          speaker: narrator
          text: >-
            白牙没有低吼。他依恋地望着主人，像是还在寻找一个答案。随后，他把头埋进主人的胳膊与身体之间，紧紧偎在怀里。
        - id: ch01-b40
          speaker: matt
          text: “船在鸣笛了！别再耽搁。你锁前门，我走后门，快点！”
        - id: ch01-b41
          speaker: narrator
          text: >-
            育空河上传来汽船低哑的轰鸣。前后两扇门同时砰地关上。斯科特等马特绕到屋前时，门里仍有低低的呜咽和抽泣，随后又响起深长的嗅探。
        - id: ch01-b42
          speaker: scott
          text: “马特，你一定照顾好他。以后写信告诉我，他过得怎么样。”
        - id: ch01-b43
          speaker: matt
          text: “当然。可你先听听他的声音！”
        - id: ch01-b44
          speaker: narrator
          text: >-
            两个人在下山的路上停住了。白牙的嗥声，就像一条狗守着已经死去的主人。他所有的悲苦都涌进那声音里，一阵阵猛然冲上高处，直叫人心碎。随后，嗥声又落成颤抖而凄凉的哀鸣，紧接着再一次冲起。一浪又一浪，全是悲恸。
        - id: ch01-b45
          speaker: narrator
          text: >-
            “极光号”是这一年第一艘驶向外界的汽船。甲板上挤满了发了财的冒险家，也挤满了已经一无所有的淘金客。如今，不论得意还是落魄，他们全都发疯似的想离开这片内地，正像当初发疯似的想闯进来一样。

            舷梯旁，斯科特正同准备上岸的马特握手。马特的手忽然在他掌中软了下来，目光一下越过斯科特，死死盯住他的身后，怎么也移不开。斯科特回过头。几英尺外，白牙正坐在甲板上，满眼深深的依恋，默默望着他。
        - id: ch01-b46
          speaker: narrator
          text: 马特震惊得低声骂了一句，斯科特也只能愣在那里。
        - id: ch01-b47
          speaker: matt
          text: “你把前门锁上了吗？”
          emotion: surprised
        - id: ch01-b48
          speaker: narrator
          text: 斯科特点点头，反问马特后门有没有锁好。
        - id: ch01-b49
          speaker: matt
          text: “当然锁好了，我敢担保！”
        - id: ch01-b50
          speaker: narrator
          text: 白牙讨好地压平耳朵，却一动不动，也不肯自己靠近。
        - id: ch01-b51
          speaker: matt
          text: “看来只能由我把他带下船了。”
        - id: ch01-b52
          speaker: narrator
          text: >-
            马特刚走两步，白牙便从他面前溜开了。马特索性猛扑过去，他就从一群人的腿缝间钻过。白牙一会儿伏低身子，一会儿转弯，一会儿猛然折回，在甲板上灵活地来回穿梭，始终没让马特抓住。可爱的主人一开口，他立刻停下，顺从地走了过去。
        - id: ch01-b53
          speaker: matt
          text: “我喂了他好几个月，他就是不肯到我手边。你只在刚认识那几天喂过他，他倒认准了你才是主人。我真想不通，他是怎么算明白的。”
        - id: ch01-b54
          speaker: narrator
          text: >-
            斯科特一直轻轻摸着白牙，这时忽然俯下身，指给马特看。他的口鼻上有几道刚刚留下的割伤，两眼之间还有一道裂口。马特也弯下腰，用手顺着白牙的腹部摸过去，那里同样满是划痕和伤口。
        - id: ch01-b55
          speaker: matt
          text: “我们把窗户忘得干干净净。他准是直接撞穿玻璃逃出来的，连肚皮底下都划破了！”
          emotion: surprised
        - id: ch01-b56
          speaker: narrator
          text: >-
            斯科特却没有听见。他的念头正在脑中飞快转动。“极光号”的汽笛发出最后一声开船通告，甲板上的人们纷纷沿着舷梯奔向岸边。马特解开自己颈间的印花大手帕，正要把它系在白牙身上，斯科特却一把握住了他的手。
        - id: ch01-b57
          speaker: scott
          text: “再见了，马特，老伙计。那头狼的事，你不用写信告诉我了。因为我已经决定……”
        - id: ch01-b58
          speaker: matt
          text: “什么！难道你真要把他留下？”
          emotion: surprised
        - id: ch01-b59
          speaker: scott
          text: “对，我就是这个意思。收回你的手帕吧。以后由我写信告诉你他的消息。”
        - id: ch01-b60
          speaker: narrator
          text: 马特走到舷梯中间，忽然停下，回头喊了起来。
        - id: ch01-b61
          speaker: matt
          text: “他受不了加利福尼亚的天气！天热的时候，你得给他剪毛！”
        - id: ch01-b62
          speaker: narrator
          text: >-
            舷梯收了起来，“极光号”离开河岸，慢慢驶向河心。斯科特挥手作最后的告别，随后转过身，朝守在身边的白牙俯下去。他轻拍白牙顺从的脑袋，又揉了揉那双压平的耳朵。
        - id: ch01-b63
          speaker: scott
          text: “现在吼吧，你这个该死的家伙，给我吼一声。”
