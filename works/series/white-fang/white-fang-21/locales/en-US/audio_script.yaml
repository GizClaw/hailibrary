audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
    weedon_scott:
      display_name: Weedon Scott
      tts:
        delivery: thoughtful and direct, with restrained tenderness
        timbre: clear and steady
        pace: measured
        pitch: medium
    matt:
      display_name: Matt
      tts:
        delivery: plainspoken and dry, with quiet warmth
        timbre: rugged and mellow
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: A CHANGE IN THE AIR
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            White Fang felt the coming trouble long before there was anything he could see as proof. A change was on its way. He could not have said what it was or why it was coming, but the gods themselves gave him the warning. Without knowing it, they showed their plans to the wolf-dog who haunted the cabin steps. He never entered the cabin, yet somehow he knew what was happening in their minds.
        - id: ch01-b02
          speaker: matt
          text: >-
            Listen to him out there, will you?
        - id: ch01-b03
          speaker: narrator
          text: >-
            It was supper time. Weedon Scott listened. Beyond the door came a low, worried whine, almost a sob that had only just become loud enough to hear. Then White Fang drew one long breath through his nose. His god was still inside. He had not yet vanished on some lonely, mysterious journey.
        - id: ch01-b04
          speaker: matt
          text: >-
            I truly believe that wolf knows you're leaving.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Scott looked across the table. His eyes nearly begged Matt to disagree, though his words said something else.
        - id: ch01-b06
          speaker: weedon_scott
          text: >-
            What in the devil would I do with a wolf in California?
        - id: ch01-b07
          speaker: matt
          text: >-
            That's exactly what I'm saying. What could you do with a wolf in California?
        - id: ch01-b08
          speaker: narrator
          text: >-
            That answer did not satisfy Scott. Matt seemed to be judging him without coming right out and saying what he thought.
        - id: ch01-b09
          speaker: weedon_scott
          text: >-
            The dogs down there wouldn't stand a chance against him. He'd kill them the moment he saw them. If the lawsuits didn't ruin me, the authorities would take him away and electrocute him.
        - id: ch01-b10
          speaker: matt
          text: >-
            I know. He's a born killer.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Scott gave him a suspicious look.
        - id: ch01-b12
          speaker: weedon_scott
          text: >-
            No. It simply wouldn't work.
        - id: ch01-b13
          speaker: matt
          text: >-
            Wouldn't work at all. Why, you'd have to hire a man just to look after him.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Scott's suspicion faded. He nodded, almost cheerfully. Then silence filled the cabin. At the door came that low, half-sobbing whine, followed by another long sniff searching for the man inside.
        - id: ch01-b15
          speaker: matt
          text: >-
            There's no question about it. He thinks the world of you.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Scott glared at him, suddenly furious.
        - id: ch01-b17
          speaker: weedon_scott
          text: >-
            Damn it, man! I know my own mind. I know what's best!
          emotion: angry
        - id: ch01-b18
          speaker: matt
          text: >-
            I'm agreeing with you. It's just...
        - id: ch01-b19
          speaker: weedon_scott
          text: >-
            Just what?
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: >-
            Matt began softly, but then his own anger rose.
        - id: ch01-b21
          speaker: matt
          text: >-
            Just this. You don't need to get so worked up. From the way you're acting, a man might think you don't know your own mind.
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: >-
            Scott wrestled with himself for a while. When he spoke again, his voice was gentler.
        - id: ch01-b23
          speaker: weedon_scott
          text: >-
            You're right, Matt. I don't know my own mind. That's the whole trouble.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Another pause passed. Then Scott burst out again.
        - id: ch01-b25
          speaker: weedon_scott
          text: >-
            Why, taking that dog with me would be completely ridiculous.
        - id: ch01-b26
          speaker: matt
          text: >-
            I'm agreeing with you.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Once more, Scott was not quite satisfied.
        - id: ch01-b28
          speaker: matt
          text: >-
            What gets me is how, in the name of the great Sardanapolis, he knows you're going.
        - id: ch01-b29
          speaker: weedon_scott
          text: >-
            I can't understand it either, Matt.
          emotion: sad
    - id: ch02
      title: LEFT BEHIND
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Then the proof came. Through the open cabin door, White Fang saw the dreaded travel bag lying on the floor, and he saw the love-master packing it. People came and went. The old peace of the cabin disappeared beneath the restless stir of preparation. White Fang had smelled the change before. Now he understood it. His god was getting ready for another journey, and since White Fang had been left behind before, he expected to be left again.
        - id: ch02-b02
          speaker: narrator
          text: >-
            That night, he raised the long howl of a wolf. As a puppy, he had run back from the Wild and found the village gone, with only a rubbish heap where Grey Beaver's tepee had stood. He had howled then. Now he lifted his muzzle toward the cold stars and told them his grief.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Inside, the two men had just gone to bed.
        - id: ch02-b04
          speaker: matt
          text: >-
            He's stopped eating again.
        - id: ch02-b05
          speaker: narrator
          text: >-
            A grunt came from Scott's bunk, and his blankets shifted.
        - id: ch02-b06
          speaker: matt
          text: >-
            Remember how he carried on the last time you left? I wouldn't be surprised if he died this time.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The blankets moved again, this time with irritation.
        - id: ch02-b08
          speaker: weedon_scott
          text: >-
            Oh, shut up! You nag worse than a woman.
          emotion: angry
        - id: ch02-b09
          speaker: matt
          text: >-
            I'm agreeing with you.
        - id: ch02-b10
          speaker: narrator
          text: >-
            In the darkness, Scott could not be sure whether Matt had snickered.
        - id: ch02-b11
          speaker: narrator
          text: >-
            By the next day, White Fang's worry had grown even stronger. When his master went outside, White Fang stayed at his heels. When Scott remained indoors, White Fang waited on the front steps. Through the doorway he watched the luggage grow. Two large canvas bags and a box now stood beside the travel bag. Matt rolled the master's blankets and fur robe into a small tarpaulin, while White Fang watched and whined.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Later, two Indians arrived. White Fang watched closely as they lifted the luggage and followed Matt down the hill. Matt carried the bedding and the travel bag. White Fang did not go after them. His master was still in the cabin.
        - id: ch02-b13
          speaker: narrator
          text: >-
            After a while Matt returned, and Scott came to the door. This time, he called White Fang inside.
        - id: ch02-b14
          speaker: weedon_scott
          text: >-
            You poor devil. I'm taking the long trail, old man, and you can't follow me. Come on, give me one growl. Let me hear one last good-bye growl.
        - id: ch02-b15
          speaker: narrator
          text: >-
            Scott rubbed White Fang's ears and tapped along his spine. But White Fang would not growl. He searched his master's face with wistful eyes, then pressed close and buried his head between Scott's arm and body.
    - id: ch03
      title: THE HOWL ON THE HILL
      blocks:
        - id: ch03-b01
          speaker: matt
          text: >-
            There she blows!
        - id: ch03-b02
          speaker: narrator
          text: >-
            From the Yukon came the rough bellow of a river steamboat.
        - id: ch03-b03
          speaker: matt
          text: >-
            You've got to make this quick. Lock the front door behind you. I'll use the back. Hurry now!
        - id: ch03-b04
          speaker: narrator
          text: >-
            Both doors slammed at once. Scott waited outside for Matt to come around the cabin. From behind the closed door came a low whine and a sound like sobbing. Then came long, deep breaths through White Fang's nose.
        - id: ch03-b05
          speaker: weedon_scott
          text: >-
            Take good care of him, Matt. Write to me and tell me how he's doing.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The two men started down the hill.
        - id: ch03-b07
          speaker: matt
          text: >-
            I will. But listen to him, will you?
        - id: ch03-b08
          speaker: narrator
          text: >-
            They both stopped. White Fang was howling the way dogs howl when their masters lie dead. He gave voice to all his misery. His grief poured upward in great, heart-breaking cries. Each cry sank into a low, shaking wail, then rose again in another rush of sorrow. The terrible pattern repeated itself again and again.
        - id: ch03-b09
          speaker: narrator
          text: >-
            The Aurora was the first steamboat of the year bound for the Outside. Her decks were packed with men who had made their fortunes and men who had lost everything. They were all as eager to leave the northern country as they had once been to enter it.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Near the gangplank, Scott shook Matt's hand while Matt prepared to go ashore. Suddenly, Matt's hand went loose. His eyes had fixed on something beyond Scott. Scott turned. Several feet away, White Fang sat on the deck, watching them with longing in his eyes.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Matt swore softly in amazement. Scott could only stare.
        - id: ch03-b12
          speaker: matt
          text: >-
            Did you lock the front door?
        - id: ch03-b13
          speaker: narrator
          text: >-
            Scott nodded.
        - id: ch03-b14
          speaker: weedon_scott
          text: >-
            What about the back door?
        - id: ch03-b15
          speaker: matt
          text: >-
            You can bet I locked it.
        - id: ch03-b16
          speaker: narrator
          text: >-
            White Fang flattened his ears in a friendly, pleading way, but he stayed where he was and made no move toward them.
        - id: ch03-b17
          speaker: matt
          text: >-
            I'll have to take him back ashore with me.
        - id: ch03-b18
          speaker: narrator
          text: >-
            Matt took two steps toward him. White Fang slipped away. Matt rushed at him, but White Fang darted between the legs of a group of men. He ducked, turned, doubled back, and glided around the deck, escaping every attempt to catch him.
        - id: ch03-b19
          speaker: narrator
          text: >-
            Then the love-master called. At once, White Fang obeyed and came to him.
        - id: ch03-b20
          speaker: matt
          text: >-
            He won't come to the man who's fed him all these months. But you hardly fed him at all after those first few days. I can't figure out how he decided you're the master.
        - id: ch03-b21
          speaker: narrator
          text: >-
            Scott stroked White Fang. Then he bent closer. Fresh cuts marked the dog's muzzle, and a gash ran between his eyes.
        - id: ch03-b22
          speaker: narrator
          text: >-
            Matt leaned down and ran a hand along White Fang's belly.
        - id: ch03-b23
          speaker: matt
          text: >-
            We completely forgot the window. He's cut and scraped all underneath. By gosh, he must have smashed straight through it!
          emotion: surprised
    - id: ch04
      title: THE LONG TRAIL TOGETHER
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Scott was no longer listening. His thoughts raced. The Aurora's whistle sounded its final warning. Men hurried down the gangplank toward shore. Matt pulled the bandana from his neck and began to tie it around White Fang. Scott caught his hand.
        - id: ch04-b02
          speaker: weedon_scott
          text: >-
            Good-bye, Matt, old man. And about the wolf, you won't need to write. You see, I've... I've decided.
        - id: ch04-b03
          speaker: matt
          text: >-
            What? You don't mean you're going to...?
          emotion: surprised
        - id: ch04-b04
          speaker: weedon_scott
          text: >-
            That's exactly what I mean. Take your bandana. I'll be the one writing to you about him.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Matt was halfway down the gangplank when he stopped and turned back.
        - id: ch04-b06
          speaker: matt
          text: >-
            He'll never stand that climate! You'll have to clip his coat when the weather gets warm!
        - id: ch04-b07
          speaker: narrator
          text: >-
            The gangplank was pulled aboard, and the Aurora swung away from the riverbank. Scott waved one last good-bye. Then he turned and bent over White Fang, who stood beside him.
        - id: ch04-b08
          speaker: weedon_scott
          text: >-
            Now growl, damn you. Growl.
        - id: ch04-b09
          speaker: narrator
          text: >-
            White Fang's head moved eagerly under Scott's hand, and his ears flattened as the love-master rubbed them.
