  chapters:
    - id: ch01
      title: THE MAKERS OF FIRE
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The cub came upon them without warning, and the fault was his own. He had been careless. After spending the whole night on the meat trail, he had only just awakened, heavy with sleep, and run from the cave to the stream for a drink. Perhaps that sleepiness kept him from noticing what lay ahead. Or perhaps it was simply that he knew the path to the pool so well. He had traveled it many times, and nothing had ever happened there.
        - id: ch01-b02
          speaker: narrator
          text: >-
            He passed the blasted pine, crossed the open ground, and trotted among the trees. Then, in the very same instant, he both saw and smelled something. Five living creatures sat silently on their haunches before him, and they were unlike anything he had ever seen. This was his first sight of human beings. The five men did not leap up when they saw him. They showed no teeth and gave no snarl. They did not move at all. They simply sat there, silent and threatening.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The cub stood just as still. Every familiar instinct told him to race away, but for the first time, another instinct held him back. Awe came down upon him. He felt so small and weak that he could not move. Before him was mastery and power greater than anything he knew.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He had never seen a man, yet some knowledge of men lived inside him. He recognized, in a dim way, the animal that had fought its way above all the other animals of the Wild. He looked not only through his own eyes, but through the eyes of all his ancestors. Wolves before him had circled countless winter fires in the dark. They had peered from the hearts of thickets and watched from safe distances as the strange two-legged animal ruled over other living things. Centuries of struggle and all the experience of those generations had left fear and respect in the cub's blood. That inheritance was too strong for a wolf so young. A grown wolf would have fled, but he was only a cub. He crouched helplessly, already halfway toward the submission wolves had offered ever since the first one came to sit beside a human fire and feel its warmth.
        - id: ch01-b05
          speaker: narrator
          text: >-
            One man rose, walked over, and bent above him. The cub pressed himself closer to the earth. The unknown had become flesh and blood, and now it was reaching down to seize him. His fur lifted by itself. His lips pulled back, baring his little fangs. The hand paused above him like doom.
        - id: ch01-b06
          speaker: indian_man
          text: "Wabam wabisca ip pit tah. Look at those white fangs!"
        - id: ch01-b07
          speaker: narrator
          text: >-
            The other men laughed loudly and urged him to pick up the cub. As the hand came lower and lower, two powerful instincts fought inside White Fang. One drove him to yield, and the other drove him to fight. What he did was a mixture of both. He gave way until the hand nearly touched him, then flashed his teeth and sank them into it. The next instant, a blow struck the side of his head and knocked him over. At once, all his fight vanished. His puppyhood and his old instinct to submit took control. He sat up on his haunches and cried. The bitten man was angry and struck the other side of his head. White Fang sat up again and cried louder than before.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The four others laughed even harder, and soon the bitten man was laughing too. They gathered around the cub while he wailed out his fear and pain. In the middle of it, he heard something, and the men heard it as well. The cub knew that sound. He gave one last, long cry, with more triumph than misery in it, then fell silent and waited. His mother was coming. She was fierce and impossible to defeat in his eyes. She fought and killed all things, feared nothing, and now she was racing toward him with a snarl because she had heard his cries.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Kiche burst among them. Her anxious, fighting motherhood made her look anything but gentle, yet to the cub, her protective rage was a beautiful sight. He gave a happy little cry and sprang toward her as the men hurried back several steps. She took her place over him and faced them. Her fur bristled, and a deep snarl rolled from her throat. Her face twisted with such savage warning that the bridge of her nose wrinkled from its tip all the way toward her eyes.
        - id: ch01-b10
          speaker: grey_beaver
          text: "Kiche!"
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: >-
            The cub felt his mother weaken at the sound of her name.
        - id: ch01-b12
          speaker: grey_beaver
          text: "Kiche!"
        - id: ch01-b13
          speaker: narrator
          text: >-
            This time the voice was sharp and commanding. The fearless she-wolf sank until her belly touched the ground. She whimpered, wagged her tail, and made signs of peace. The cub was horrified. Again, awe of mankind swept over him. His instinct had told him the truth, and his mother proved it. Even she submitted to these human animals.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Grey Beaver came to her and laid a hand on her head. Kiche only crouched lower. She did not snap or even threaten to snap. The other men crowded close. They felt her and handled her from every side, and she made no effort to resist them. They were greatly excited and filled the air with talk. The cub decided those sounds did not mean danger. He stayed crouched close to his mother, still bristling now and then, but trying as hard as he could to submit.
        - id: ch01-b15
          speaker: grey_beaver
          text: >-
            There is nothing strange about this. Her father was a wolf. Her mother was a dog, that is true. But my brother tied her in the woods for three nights during the mating season. So Kiche's father must have been a wolf.
        - id: ch01-b16
          speaker: salmon_tongue
          text: "It has been a year since she ran away, Grey Beaver."
        - id: ch01-b17
          speaker: grey_beaver
          text: "That is no surprise, Salmon Tongue. The famine had come, and there was no meat for the dogs."
        - id: ch01-b18
          speaker: three_eagles
          text: "She must have been living with the wolves."
        - id: ch01-b19
          speaker: grey_beaver
          text: "It seems so, Three Eagles. And this cub proves it."
        - id: ch01-b20
          speaker: narrator
          text: >-
            Grey Beaver put a hand on the cub. White Fang gave a small snarl, and the hand shot back to strike him. The cub hid his fangs and sank down meekly. When the hand returned, it rubbed behind his ears and along his back.
        - id: ch01-b21
          speaker: grey_beaver
          text: >-
            Yes, this cub proves it. His mother is plainly Kiche, but his father was a wolf. There is little dog in him and much wolf. His fangs are white, so White Fang will be his name. I have spoken. He belongs to me. Kiche was my brother's dog, and my brother is dead.
        - id: ch01-b22
          speaker: narrator
          text: >-
            The cub now had a name in the world. He lay watching while the men went on making those mouth sounds he could not understand. Then Grey Beaver drew the knife from the sheath hanging at his neck, entered the thicket, and cut a stick. White Fang watched every movement. Grey Beaver carved a notch into each end and secured a rawhide string in both notches. He tied one string around Kiche's throat, led her over to a small pine, and tied the other string around the tree.
        - id: ch01-b23
          speaker: narrator
          text: >-
            White Fang followed and lay beside her. Salmon Tongue reached out and rolled him onto his back while Kiche watched anxiously. Fear rose in him again. He could not stop a growl, though he made no attempt to bite. Crooked, spread fingers rubbed his stomach playfully and rolled him from side to side. He looked ridiculous lying on his back with his legs sprawling in the air, and his whole nature rebelled against such helplessness. He could do nothing to defend himself. If this man meant to harm him, he knew he could not escape. How could he spring away with all four feet waving above him?
        - id: ch01-b24
          speaker: narrator
          text: >-
            Still, submission kept his fear under control, and his growl stayed low. He could not silence that sound, but Salmon Tongue did not punish him with a blow. Stranger yet, the steady rubbing began to feel pleasant. Once White Fang was rolled onto his side, he stopped growling. Fingers pressed and prodded around the roots of his ears, and the pleasure grew stronger. By the time the man gave one last rub and scratch, then left him alone and walked away, the cub's fear was gone. He would know fear many times in his dealings with mankind, but this moment was a first small promise of the fearless friendship with people that would one day be his.
        - id: ch01-b25
          speaker: narrator
          text: >-
            After a while, strange sounds came nearer. White Fang quickly placed them among the sounds made by human animals. The rest of the traveling tribe soon appeared in a long line along the trail. There were men, many women, and children, about forty people in all, and every one of them carried heavy camp equipment and supplies. Many dogs came with them. Except for the partly grown puppies, the dogs also carried camp loads. Bags fitted tightly across their backs and fastened underneath, holding twenty or thirty pounds on each animal.
        - id: ch01-b26
          speaker: narrator
          text: >-
            White Fang had never seen dogs, but he felt at once that they were his own kind, though different in some way. When the dogs spotted him and Kiche, they showed very little difference from wolves. They rushed forward in an open-mouthed wave. White Fang bristled, snarled, and snapped into their faces, then went down beneath the pack. Sharp teeth slashed his body while he bit and tore at the legs and bellies above him. A tremendous uproar filled the air. Kiche fought for him with savage snarls. Human voices shouted, clubs struck bodies, and the dogs that felt those blows yelped in pain.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Only a few seconds passed before White Fang stood up again. The men were driving the dogs back with clubs and stones. They had defended him and saved him from the savage teeth of creatures that were somehow both his kind and not his kind. His mind could not form a clear idea of something as difficult as justice. Even so, he felt their justice in his own way and understood what these men were. They made the law, and they carried it out.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Their power worked unlike any animal power he knew. They did not need teeth or claws. They used their living strength to command lifeless things. Sticks and stones obeyed them, flew where the men sent them as if they were alive, and brought painful blows down on the dogs. To White Fang, such power was strange, impossible to imagine, and beyond nature. It was godlike. He could never know anything about gods. At most, he could recognize things that were beyond all knowing. Yet his wonder and awe were like a person's wonder at seeing some heavenly being on a mountaintop, throwing thunderbolts from both hands down upon an astonished world.
        - id: ch01-b29
          speaker: narrator
          text: >-
            When the last dog had been chased back and the uproar faded, White Fang licked his wounds and thought over his first taste of the cruelty of the pack. He had never dreamed that his kind included anyone beyond One Eye, Kiche, and himself. Those three had seemed to form a kind all their own. Now, without warning, he had discovered a great many creatures that appeared to belong to the same kind. A deep resentment stirred within him because the moment they saw him, they had rushed in and tried to destroy him.
        - id: ch01-b30
          speaker: narrator
          text: >-
            He also resented the stick that held his mother, even though the powerful men had tied it. It carried the feeling of a trap and of bondage, though he knew neither thing by name. Freedom had always been his inheritance. He could roam and run, or lie down whenever he wished. Now Kiche could move only as far as the stick allowed. Since White Fang had not yet outgrown his need to remain close to his mother, its length limited his freedom too.
        - id: ch01-b31
          speaker: narrator
          text: >-
            He liked none of it. He liked it even less when the people rose and began marching again. A small human took the free end of the stick and led Kiche away as a captive. White Fang had no choice but to follow behind her. He went on greatly troubled and worried by the unknown adventure into which he had entered.
        - id: ch01-b32
          speaker: narrator
          text: >-
            They traveled down the stream valley, far beyond the widest limits of White Fang's wanderings, until the stream joined the Mackenzie River. Canoes had been stored on poles high above the ground, and racks stood there for drying fish. The people made camp while White Fang watched with wondering eyes. Every moment showed him more of their superiority. Their mastery over all those sharp-fanged dogs breathed of power. What impressed him even more was their rule over lifeless things. They gave motion to objects that could not move on their own. They could even change the face of the land.
        - id: ch01-b33
          speaker: narrator
          text: >-
            He watched them raise frames of poles. That alone did not seem so wonderful, since these were the same beings who sent sticks and stones flying across great distances. Then cloth and skins went over the frames, turning them into tepees, and White Fang stared in astonishment. Their enormous size impressed him most. They rose around him on every side, like some monstrous form of life growing with impossible speed. They filled nearly the whole circle of his sight and towered threateningly above him. When the breeze stirred them into huge movements, he crouched in fear, watched them closely, and prepared to leap away if they threw themselves upon him.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Before long, his fear of the tepees began to fade. Women and children went in and out without being hurt. Dogs often tried to enter, only to be driven off by sharp voices and flying stones. At last White Fang left Kiche's side and crept toward the nearest wall. The curiosity that comes with growth pushed him onward. He had to learn, live, and act in order to gain experience. After everything that day, he expected the unknown to reveal itself in some enormous and unimaginable way. He crossed the final inches with painful slowness and care, then touched the canvas with his nose and waited. Nothing happened.
        - id: ch01-b35
          speaker: narrator
          text: >-
            The fabric smelled strange and was soaked through with human scent. He caught it gently in his teeth and gave a small tug. Nothing happened, though the canvas around his teeth moved. He pulled harder and produced a larger movement. That delighted him. He tugged harder still, then again and again, until the whole tepee was in motion. A woman's sharp cry rang out from inside and sent him racing back to Kiche. But after that discovery, the towering bodies of the tepees no longer frightened him.
        - id: ch01-b36
          speaker: narrator
          text: >-
            A moment later, he wandered from his mother again. Her stick was tied to a peg, so she could not follow. An older puppy approached with a slow show of importance and hostility. White Fang would later learn that his name was Lip-lip. He had already fought many puppy battles and had become a bully.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Lip-lip was a puppy and seemed to be White Fang's own kind, so White Fang saw no danger and meant to greet him as a friend. Then the stranger began walking on stiff legs, and his lips lifted clear of his teeth. White Fang stiffened and bared his own teeth in reply. For several minutes, they moved halfway around each other, testing one another as they bristled and snarled. White Fang was beginning to enjoy it as a kind of game. Without warning, Lip-lip moved with astonishing speed. He sprang in, slashed with his teeth, and leaped away again.
        - id: ch01-b38
          speaker: narrator
          text: >-
            The bite struck the shoulder the lynx had hurt, where soreness still lay deep beside the bone. Surprise and pain pulled a yelp from White Fang. In the next instant, anger swept over him, and he lunged at Lip-lip, snapping fiercely. But Lip-lip had spent his whole life in camp and fought through many puppy battles. Three times, four times, then half a dozen times, his small sharp teeth cut the newcomer. At last, White Fang yelped without shame and ran to the protection of his mother.
        - id: ch01-b39
          speaker: narrator
          text: >-
            It was the first of his many fights with Lip-lip. They were enemies from the beginning, with natures that would always clash.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Kiche licked White Fang gently with her tongue and tried to persuade him to remain beside her. His curiosity was too wild for that. Within a few minutes, he set out on another search and found Grey Beaver squatting on his heels. The man was doing something with sticks and dry moss spread over the ground before him. White Fang came near and watched. Grey Beaver made mouth sounds that the cub understood were not hostile, so he moved closer still.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Women and children brought Grey Beaver more sticks and branches. Whatever he was doing clearly mattered. Curiosity brought White Fang closer until he touched the man's knee, and by then he had already forgotten that this was a terrible human animal. Without warning, he saw something like a strange mist begin to rise from the sticks and moss beneath Grey Beaver's hands. Then a living thing appeared among the sticks themselves. It twisted and turned, and its color was the color of the sun in the sky.
        - id: ch01-b42
          speaker: narrator
          text: >-
            White Fang knew nothing at all about fire. It drew him just as the light at the mouth of the cave had drawn him in his early puppyhood. He crawled the few steps toward the flame. Above him, Grey Beaver gave a chuckle, but White Fang knew the sound was not hostile. He kept moving until his nose touched the flame. At that exact instant, his little tongue went out and touched it too.
        - id: ch01-b43
          speaker: narrator
          text: >-
            For one moment, he could not move. The unknown thing hidden among the sticks and moss had seized his nose savagely. Then he scrambled backward with an explosion of startled cries. Kiche heard him and leaped snarling to the end of her stick. She raged terribly because she could not reach him to help. Grey Beaver only laughed aloud, slapped his thighs, and told the whole camp what had happened. Soon everyone was roaring with laughter. In the middle of the human animals, White Fang sat on his haunches and cried again and again, a lonely and pitiful little figure.
        - id: ch01-b44
          speaker: narrator
          text: >-
            It was the worst pain he had ever felt. The sun-colored living thing that had grown beneath Grey Beaver's hands had scorched both his nose and tongue. He cried and cried without stopping, and every fresh wail brought another burst of human laughter. He tried to soothe his nose by licking it, but his tongue was burned too. The two injuries met and made the pain even worse. Then his cries became more hopeless and helpless than ever.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Then shame came over him. No one can say exactly how some animals recognize laughter and know when it is aimed at them, but White Fang knew. These human animals were laughing at him, and the shame of it filled him. He turned and fled, not from the pain of the fire, but from laughter that sank even deeper and wounded his spirit. He ran to Kiche, who raged at the end of her stick like an animal gone mad. She was the one creature in the world who was not laughing at him.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Twilight faded and night came down while White Fang lay beside his mother. His nose and tongue still hurt, but another trouble confused him more. He was homesick. Something inside him felt empty. He needed the hush and quiet of the stream and the cave in the cliff. Life here had become far too crowded. Men, women, and children were everywhere, forever making noises that irritated him. The dogs kept squabbling and bickering, bursting again and again into uproar and confusion.
        - id: ch01-b47
          speaker: narrator
          text: >-
            The peaceful loneliness of the only life he had known was gone. Here, even the air seemed to tremble with life. Sound hummed and buzzed without rest. Its force changed continually, growing louder and falling softer, while its pitch shifted without warning. The constant noise beat against his nerves and senses. It made him nervous and restless and kept him worried by the feeling that something was always about to happen.
        - id: ch01-b48
          speaker: narrator
          text: >-
            He watched the humans come and go and move about the camp. People look upon the gods they create with wonder, and White Fang looked upon these human animals in much the same way. To his dim understanding, they truly were higher beings and workers of wonders. They were creatures of mastery, possessing all kinds of powers that were unknown and impossible to him. They ruled living creatures and lifeless things alike. They forced moving things to obey. They gave movement to things that could not move. From dead wood and moss, they made a bright, sun-colored, biting life grow.
        - id: ch01-b49
          speaker: narrator
          text: >-
            They were the makers of fire. They were gods.
