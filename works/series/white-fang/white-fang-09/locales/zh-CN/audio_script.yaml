audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
    grey_beaver:
      display_name: 灰海狸
      tts:
        delivery: 威严果断，说话简短有分量
        timbre: 粗粝厚实
        pace: 从容
        pitch: 低
    salmon_tongue:
      display_name: 鲑鱼舌
      tts:
        delivery: 直率自然，带着探询意味
        timbre: 清晰稳健
        pace: 适中
        pitch: 中低
    three_eagles:
      display_name: 三鹰
      tts:
        delivery: 平实肯定，不疾不徐
        timbre: 沉稳清楚
        pace: 适中
        pitch: 中
    indian_1:
      display_name: 印第安人
      tts:
        delivery: 随意健谈，语气笃定
        timbre: 浑厚自然
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 第一章　造火者
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            幼崽冷不防撞见了他们。错在他自己，是他太不小心。那天，他刚从整夜的猎肉之路上醒来，睡意还沉，便跑出洞穴，到溪边喝水。也许正因为这样，他没有留意四周。也许是因为这条路实在太熟，他走过许多回，从来没出过事。
        - id: ch01-b02
          speaker: narrator
          text: >-
            他经过雷劈的松树，穿过空地，跑进林间。就在那一刻，他同时看见，也闻见了。前方静静蹲坐着五个活物，模样是他从未见过的。这是他第一次看见人。可那五个人既没有跳起来，也没有龇牙低吼。他们一动不动，沉默地坐在那里，透着危险。
        - id: ch01-b03
          speaker: narrator
          text: >-
            幼崽也僵在原地。照他的天性，本该立刻逃走。可体内忽然冒出另一种陌生的本能，把逃跑的冲动压住了。一股深重的敬畏落在他身上。他感到自己太弱，太小，连动也不能动。眼前是统御一切的威力，是远远超过他的强大力量。
        - id: ch01-b04
          speaker: narrator
          text: >-
            他从没见过人，祖先留下的本能却认得人。在荒野里，人靠争斗胜过百兽，成为了它们的主宰。此刻，幼崽不只在用自己的眼睛看，仿佛还借来了无数祖先的眼睛。那些眼睛曾在一个又一个冬夜里，绕着黑暗中的营火徘徊。它们也曾躲进灌木深处，隔着安全的距离，窥视那种陌生的两足动物，那种统治一切生灵的动物。许多个世纪的争斗，还有一代代积累的经验，早已化成恐惧和敬重，留在幼崽体内。那份遗传像咒语一样笼罩着他，他根本抵挡不了。要是已经成年，他会逃跑。可他只是一头幼狼，只能缩成一团，浑身僵硬，几乎已经献上顺从。自从第一头狼走到人的火边坐下，接受那份温暖，他的同类便开始这样向人屈服。
        - id: ch01-b05
          speaker: narrator
          text: >-
            一个印第安人站起来，走到他面前，弯腰伸手。那无形的未知终于有了血肉和形体，就压在他的头顶，马上要抓住他。幼崽把身体伏得更低，毛发竖起，嘴唇后缩，露出尖牙。那只手像命运一样悬在上方，忽然停住。男人笑了。
        - id: ch01-b06
          speaker: grey_beaver
          text: “瓦巴姆，瓦比斯卡，伊普，皮特，塔。瞧啊，是一对白牙！”
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: >-
            其余的人大笑着，催他把幼崽抱起来。手越来越近，幼崽体内的两种本能也激烈争斗。一种要他屈服，另一种要他反抗。最后，他用一个折中的办法，两样都做了。他一直顺从地忍着，等到那只手几乎碰上自己，才猛地反击。牙齿白光一闪，咬进了那只手。紧接着，他脑袋一侧挨了重重一巴掌，整个身子翻倒在地，所有斗志顿时散了。幼兽的天性和屈服的本能重新掌管了他。他后腿蹲地坐起来，尖声哀叫。可挨咬的男人还在气头上，又朝他另一侧脑袋打了一巴掌。他只好坐在那里，叫得比先前更加凄厉。
        - id: ch01-b08
          speaker: narrator
          text: >-
            四个人笑得更响，连挨咬的男人也笑了。他们围着幼崽，拿他的恐惧和疼痛取乐。就在这时，幼崽听见了一个声音。他知道那是什么，便拖长声音，发出最后一声哀号。这声哀号里的得意多过悲伤。随后，他安静地等着母亲赶来。那凶猛不屈、敢与一切生灵厮杀、从不知道害怕的母亲，已经听见了他的呼救，正咆哮着飞奔而来。
        - id: ch01-b09
          speaker: narrator
          text: >-
            基切跃进人群。护子的焦急与战意让她显得格外凶恶，可幼崽看见她满身的怒火，只觉得欢喜。他轻叫着迎上去，人形动物慌忙退开。母狼护住幼崽，浑身毛发竖立，正面盯着那些人，喉咙深处滚着低吼。她的鼻梁一直皱到两眼之间，整张脸都因威胁而扭曲。
        - id: ch01-b10
          speaker: grey_beaver
          text: “基切！”
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: >-
            幼崽感觉到母亲的气势一下软了。灰海狸又厉声喊了一遍她的名字，这次带着命令。那头无所畏惧的母狼立刻伏下身体，直到肚皮贴地。她低声呜咽，摇着尾巴，做出求和的姿态。幼崽惊骇地望着她，无法明白发生了什么。对人的敬畏再次席卷了他。母亲亲自证实了他的本能没有错。连她也向人形动物屈服了。
        - id: ch01-b12
          speaker: narrator
          text: >-
            灰海狸把手放在基切头上，她只把身子伏得更低，既不咬，也不威胁。其他人也围上来，在她身上摸摸拍拍，她毫不反抗。众人兴奋地交谈着。幼崽判断那些声音没有危险，便缩在母亲身边，偶尔竖起毛来，同时竭力表现顺从。
        - id: ch01-b13
          speaker: indian_1
          text: “这不奇怪。她父亲是狼。她母亲虽然是狗，可到了交配的季节，我兄弟把她拴在树林里整整三夜。所以，基切的父亲一定是头狼。”
        - id: ch01-b14
          speaker: salmon_tongue
          text: “灰海狸，她逃走已经一年了。”
        - id: ch01-b15
          speaker: grey_beaver
          text: “不奇怪，鲑鱼舌。那时正闹饥荒，没有肉喂狗。”
        - id: ch01-b16
          speaker: three_eagles
          text: “她这一年一直跟狼生活。”
        - id: ch01-b17
          speaker: grey_beaver
          text: “看来就是这样，三鹰。这头幼崽便是证据。”
        - id: ch01-b18
          speaker: narrator
          text: >-
            灰海狸伸手碰他，幼崽低低一吼，马上挨了一巴掌。他赶紧藏起尖牙，顺从地伏下去。那只手又落下来，揉揉他的耳根，再抚过他的背。
        - id: ch01-b19
          speaker: grey_beaver
          text: “他的母亲显然是基切，父亲却是狼，所以他身上的狗性少，狼性多。他的尖牙是白的，就叫白牙。我说定了。他是我的狗。基切原本是我兄弟的狗，而我兄弟已经死了。”
        - id: ch01-b20
          speaker: narrator
          text: >-
            幼崽就这样在世上有了名字。他趴在那里，看着灰海狸拔出颈间鞘里的刀，到灌木中砍下一根木棍。灰海狸在木棍两端刻出凹槽，分别系上生皮绳。一根绳套住基切的脖颈，另一根拴到小松树上。白牙跟过去，卧在母亲身旁。
        - id: ch01-b21
          speaker: narrator
          text: >-
            鲑鱼舌伸手把白牙翻得四脚朝天。基切焦急地看着。白牙又害怕了，忍不住低吼，却没敢咬。那只手弯起手指，在他肚皮上逗弄似的来回揉搓，还把他翻向两边。他摊在那里，四条腿悬在空中，模样又笨又滑稽，更是全无自卫的办法。他整个天性都讨厌这种姿势。假如这个人形动物想伤害他，他连逃也逃不掉。四条腿朝着天，又怎么能跳开呢？可屈服的本能压住了恐惧，他只轻轻低吼。这声音实在忍不住，鲑鱼舌却没有因此打他。更奇怪的是，白牙渐渐感到舒服。被翻到侧面时，他不吼了；手指按揉耳根时，那种舒服的感觉变得更强。等鲑鱼舌最后又揉又挠，起身离开，他已经一点也不怕了。往后与人相处，他还会害怕许多回；可这次抚摸，已经预示了他终有一天会毫无畏惧地与人相伴。
        - id: ch01-b22
          speaker: narrator
          text: >-
            不久，更多人形动物的声音传来。部落里其余的人排成长队走进营地。男人、女人和孩子加起来约有四十人，个个背着沉重的行装。许多狗也跟着他们。除了没长成的幼犬，每条狗都驮着紧贴腹部的口袋，里面装着二十到三十磅物资。
        - id: ch01-b23
          speaker: narrator
          text: >-
            白牙从没见过狗，却立刻感觉它们是自己的同类，只是有些不同。狗群发现他和基切时，表现得跟狼也没多少不同，转眼便一拥而上。白牙竖起毛，对着那股张着大嘴扑来的浪潮又吼又咬，很快被撞倒，压在狗群下面。他感觉一颗颗尖牙割开自己的身体，也拼命去咬头顶那些腿和肚腹，又撕又扯。四周顿时乱成一片。他听见基切为保护自己而发出的咆哮，也听见人形动物大声喊叫。木棒击中狗的身体，发出一声声闷响。挨打的狗尖声痛叫，所有声音混成了震耳的喧闹。
        - id: ch01-b24
          speaker: narrator
          text: >-
            几秒钟后，白牙重新站了起来。他看见人形动物用木棒和石块赶退狗群，保护他，把他从那些既像同类又不像同类的尖牙下救出来。他的头脑还说不清什么叫公正，却用自己的方式感到了他们的公正。他也明白了，人形动物制定法则，同时还会亲手执行法则。更让他惊奇的是他们执行法则的方式。白牙见过的动物都靠牙咬，靠爪抓，可这些人不用牙和爪。他们把自身活着的力量交给死物，让死物听从命令。木棒与石块受他们驱使，像有了生命一样飞过空中，落在狗群中，重重打伤那些狗。
        - id: ch01-b25
          speaker: narrator
          text: >-
            这种力量异乎寻常，无法想象，超越自然，简直像神力。白牙永远不会知道神是什么，至多只能知道世上有一些他无法理解的东西。可他对人形动物的敬畏，就像人站在山顶，看见天上的生灵双手投出雷霆，轰击整个目瞪口呆的世界。
        - id: ch01-b26
          speaker: narrator
          text: >-
            最后一条狗被赶开，喧闹终于平息。白牙舔着伤口，回想自己第一次领教的族群之残酷。这也是他第一次真正遇见一个族群。他从来没想过，自己的同类除了独眼、母亲和自己，竟然还有别的成员。他们三个一直像是世上单独的一族。现在，他突然发现了这么多看似同类的生灵，可它们一见面便想毁掉他，他心里自然生出一股怨恨。他也怨恨拴住母亲的木棍，哪怕动手的是比他强大得多的人形动物。那根木棍带着陷阱和囚禁的意味，尽管白牙还不知道什么是陷阱，什么是囚禁。随意游荡，尽情奔跑，想在哪里躺下就在哪里躺下，本是他生来就有的自由。如今，这份自由受到了侵犯。母亲只能在一根木棍的范围里活动；而他还离不开母亲，也被同一根木棍限制住了。
        - id: ch01-b27
          speaker: narrator
          text: >-
            他不喜欢这样。人形动物再次上路时，一个小小的人形动物牵着木棍另一头，让被俘的基切跟在后面。白牙走在基切身后，对这场新遭遇又不安，又忧虑。他们顺着溪谷走出很远，来到溪水汇入马更些河的地方。那里有高架起来收藏的独木舟，也有晾鱼架。人们就在这里扎营。
        - id: ch01-b28
          speaker: narrator
          text: >-
            白牙睁大眼睛看着，人形动物的地位在他心中不断升高。他们能够统御所有尖牙利齿的狗，这已经充满威力。可在幼狼眼里，他们统御死物的本领更加惊人。他们能让静止的东西动起来，甚至改变大地原来的模样。最先吸引白牙目光的，是一副副木杆搭成的架子。不过，能把木棍和石块远远掷出的生灵，搭起这样的架子，倒还不算太稀奇。接着，人们把布料和兽皮蒙上木杆，一座座巨大的圆锥帐篷便在四周升起。真正震慑白牙的，是它们庞大的体积。它们像一群飞快长大的巨怪，几乎占满了他的视野。他惊恐地望着它们阴森森地高耸在头顶。风一吹，帐篷便庞然晃动，他立刻伏低身体，警惕地盯着，随时准备在它们扑下来时逃走。
        - id: ch01-b29
          speaker: narrator
          text: >-
            很快，他看见女人和孩子安全地进出帐篷，也看见想进去的狗被呵斥和飞来的石块赶开，恐惧便慢慢退去。过了一阵，他离开基切，向最近的帐篷爬去。成长中的好奇心催促着他。为了学习，为了生活，也为了获得经验，他必须亲自去碰一碰那些陌生东西。离帐篷只剩最后几英寸时，他爬得慢极了，每一下都万分谨慎。这一天的遭遇已经让他相信，未知随时会用最惊人的方式显露真身。终于，他用鼻子碰到帆布，等了一会儿。什么也没发生。他闻闻那片浸透人味的陌生料子，用牙轻轻一扯。还是没有危险，只有旁边的帆布动了一点。他再用力，动静更大了。白牙觉得有趣，便一次又一次地扯，越扯越起劲，直到整座帐篷都晃动起来。里面一个女人忽然尖声呵斥，他连忙逃回基切身边。从此以后，他再也不怕这些高耸的庞然大物。
        - id: ch01-b30
          speaker: narrator
          text: >-
            片刻后，他又离开母亲，独自在附近游荡。基切的木棍拴在地上的木桩上，无法跟来。一条名叫唇唇的幼犬慢慢走近。它比白牙稍大，也年长一些，故意挺起身子，摆出气势汹汹、不可一世的架势。它在营地里打过许多场幼犬间的架，早已成了小恶霸。白牙见它是自己的同类，又不过是一条幼犬，看上去没什么危险，便打算友好相待。可这个陌生家伙的脚步忽然变得僵硬，四条腿绷得笔直，嘴唇也向上翻起，露出了牙。白牙也绷紧身子，龇牙回应。它们试探着绕了半圈，彼此咆哮，毛发根根竖起。这样过了几分钟，白牙渐渐觉得像在玩游戏，甚至开始乐在其中。唇唇却突然飞快扑上来，狠狠咬了一口，又立刻跳开。它正咬中那只曾被猞猁抓伤的肩膀，伤处深入骨头，至今仍在作痛。突然的袭击与疼痛让白牙惨叫一声，随即怒不可遏地冲上去，凶狠地反击。
        - id: ch01-b31
          speaker: narrator
          text: >-
            可唇唇一生都住在营地里，已经打过许多场幼犬间的架。它尖利的小牙一次、两次，一连许多次咬中这个新来的家伙。最后，白牙再也顾不得脸面，哀叫着逃回母亲身边求救。这只是他与唇唇无数次争斗中的第一场。他们从一开始就是敌人，仿佛天生如此，两种禀性注定要永远冲突。基切安抚地舔着白牙，想让他老实留在自己身旁。可他的好奇心正旺盛得无法压住。只过了几分钟，他便再次出发，去寻找新的事物。
        - id: ch01-b32
          speaker: narrator
          text: >-
            这一次，他找到了灰海狸。灰海狸蹲在地上，面前摊着木柴和干苔藓。女人和孩子不断送来更多树枝，显然正在做一件要紧的事。灰海狸发出的声音没有敌意，白牙便越靠越近，最后竟碰到了他的膝盖，完全忘了这是个可怕的人形动物。
        - id: ch01-b33
          speaker: narrator
          text: >-
            忽然，白牙看见一缕像雾的奇怪东西，从灰海狸手下的木柴与苔藓间升起来。接着，一个活物出现在木柴中。它不停扭曲翻卷，颜色就像天上的太阳。白牙根本不知道火是什么。火焰吸引着他，就像幼年最初那段日子里，洞口的亮光曾吸引他一样。他朝火焰爬近几步，听见灰海狸在头顶轻声发笑。他已经知道，这声音没有敌意。于是，他又往前挪。随后，他的鼻子碰到了火焰。就在同一瞬间，他小小的舌头也伸出去，对着火舔了一下。
        - id: ch01-b34
          speaker: narrator
          text: >-
            白牙一下僵住了。躲在木柴和苔藓里的未知猛兽，正狠狠咬住他的鼻子。他手忙脚乱地后退，爆发出一连串惊愕的尖叫。基切一听见，便咆哮着冲到木棍尽头。她发狂似的挣扎，却怎么也赶不过来救他。灰海狸放声大笑，双手拍着大腿，又把刚才的事情说给营地里的其他人听。笑声一处接一处响起来，很快，所有人都笑得前仰后合。白牙后腿蹲地，孤零零坐在人形动物中间，一声接一声地哀叫，看上去又无助，又可怜。
        - id: ch01-b35
          speaker: narrator
          text: >-
            这是他有生以来受过最厉害的伤。灰海狸手下长出的那个太阳般颜色的活物，烧焦了他的鼻子，也烧焦了他的舌头。他哭了一声又一声，没完没了。每当新的哀号响起，人形动物那边便爆发出一阵新的笑声。他想用舌头舔舔鼻子，让鼻子好受一点，可那条舌头也烧伤了。两处疼痛碰到一起，只会痛得更加厉害。白牙没有别的办法，只能哭得比刚才更绝望，也更无助。
        - id: ch01-b36
          speaker: narrator
          text: >-
            接着，羞耻压过了疼痛。他听得懂笑声，也知道人形动物为什么这样笑。某些动物为什么会懂得笑，又怎么知道别人正在嘲笑自己，这件事我们无法明白。可白牙就是用同样神秘的方式懂了。他为人形动物取笑自己感到羞耻，转身逃走。让他逃的不是火留下的灼痛，而是那阵笑声。笑声刺得比火更深，伤到了他的心。他一路奔回基切身边。母亲还在木棍尽头发狂似的挣扎，也是整个世界上唯一没有嘲笑他的生灵。
        - id: ch01-b37
          speaker: narrator
          text: >-
            暮色沉下去，黑夜来临。白牙卧在母亲身边。鼻子和舌头还疼，可更大的烦恼缠住了他。他想家了，心里空落落的，渴望溪谷的安静，也渴望崖壁洞穴里的那份安宁。如今，生命变得太拥挤。这里有那么多人形动物，男人、女人和孩子全在制造噪声，让他烦躁。狗群也总在争斗，随时爆发出叫嚷，掀起一场混乱。他从前只知道令人安适的孤独，可那种生活已经消失。这里甚至连空气都随着生命震颤，不停地嗡鸣和骚动。声响一会儿强，一会儿弱，调子也会猛然改变，一次次冲击他的神经和感官。白牙变得紧张、烦躁、心神不宁，总觉得有什么事情马上就要发生。
        - id: ch01-b38
          speaker: narrator
          text: >-
            他望着人形动物在营地里来来去去。人凝望自己创造的神灵时，大概也会像白牙这样望着他们。对他来说，他们的确是更高等的生灵，是真正的神。在他朦胧的理解中，他们创造奇迹的本领，丝毫不亚于人眼中的神。他们统御万物，拥有种种未知而不可思议的力量，是有生命与无生命之物共同的主宰。他们命令会活动的东西服从，又把运动交给静止的东西。最不可思议的是，他们还能让生命从死去的苔藓和木柴中生长出来。那生命像太阳一样明亮，也会狠狠咬人。他们是造火者。他们是神。
