  chapters:
    - id: ch01
      title: THE ENEMY OF HIS KIND
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            If White Fang had ever held even the smallest chance of becoming friendly with other dogs, it vanished when he became leader of the sled team. The dogs hated him because Mit-sah gave him extra meat. They hated every real favor and every favor they imagined he received. Most of all, they hated the sight of him running ahead of them, his waving tail and retreating hindquarters always before their eyes.
        - id: ch01-b02
          speaker: narrator
          text: >-
            White Fang hated them just as deeply. Leading the team brought him no pleasure. For three years he had beaten and mastered those dogs. Now he had to flee from the whole yelling pack. Yet he had to endure it or die, and everything alive in him meant to keep living. The instant Mit-sah ordered the team forward, the dogs leaped after White Fang with savage cries.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He had no way to defend himself. If he turned on the pack, Mit-sah's long whip would sting across his face. He could only run. He could not fight so many merciless fangs with nothing but his tail and hindquarters toward them. All day, every leap carried him away from his enemies and against his own pride.
        - id: ch01-b04
          speaker: narrator
          text: >-
            When a creature is forced to act against its nature, the hurt turns inward. It is like a hair that grows back into the body and becomes a sore. That was what happened inside White Fang. Every instinct urged him to spring upon the pack at his heels. But the gods forbade it, and their will was enforced by thirty feet of biting caribou-gut. He swallowed his rage as he ran, and his hatred grew as fierce and unconquerable as he was.
        - id: ch01-b05
          speaker: narrator
          text: >-
            White Fang truly became the enemy of his own kind. He asked for no mercy and offered none. The pack's teeth scarred him again and again, and his teeth left scars among them. Other sled leaders stayed close to the men for protection after the harnesses came off. White Fang refused to hide. He strode boldly through camp and punished the dogs at night for everything they had done to him by day. Before he led the team, they had always moved out of his path. The new arrangement had taught them what it felt like to chase him, and that changed the balance between them.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Before he became leader, the dogs had known enough to move aside for him. Now the chase filled their minds. They had watched him flee all day and felt themselves mastering him, so they would no longer give way at night. Whenever he passed among them, snarls, snaps, and growls broke out. Hatred seemed to fill the very air, and every clash fed the hatred inside him.
        - id: ch01-b07
          speaker: narrator
          text: >-
            When Mit-sah ordered a halt, White Fang stopped at once. At first, the other dogs rushed him then, only to find that Mit-sah stood behind him with the great whip singing through the air. In time they learned one rule. When an order stopped the team, they must leave White Fang alone. If he stopped without an order, they were free to attack and destroy him if they could. After a few such lessons, White Fang never stopped on his own. He learned quickly because these harsh conditions gave him no other way to survive.
        - id: ch01-b08
          speaker: narrator
          text: >-
            In camp, though, the dogs never learned to leave him alone. Each day's pursuit wiped away the lesson he had taught them the night before. That night, White Fang had to teach it all over again, only to see them forget it the following day. There was something deeper and more lasting in their hatred as well. They felt that White Fang was different. All of them were tamed wolves, but the others had lived beside people for generations. Much of the Wild had faded from them. To those dogs, the Wild was unknown and terrible. It was always threatening and always at war with them. In White Fang's looks, movements, and instincts, the Wild still lived. He seemed to give it a body. When they bared their teeth at him, they felt they were defending themselves from the destructive power hiding in the forest shadows and the darkness beyond the fire.
        - id: ch01-b09
          speaker: narrator
          text: >-
            One lesson did stay with them. They learned to stand together. White Fang was too dangerous for any dog to face alone, and without their massed attack he could have killed them one by one through the night. He might knock one dog down, but before he could strike the throat, the whole pack would be on him. At the first sign of trouble, they gathered into one body. Their own quarrels disappeared whenever White Fang threatened them.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Even together, they could not kill him. He was too fast, too strong, and too wise. He stayed away from narrow places and slipped back whenever they nearly surrounded him. No dog among them could bring him down. His feet held the earth as stubbornly as he held on to life. In his endless war with the pack, keeping his footing meant keeping his life, and White Fang understood that better than any of them.
        - id: ch01-b11
          speaker: narrator
          text: >-
            So the fires and shelter of human beings had softened the other dogs and weakened them beneath the protection of human strength. White Fang had been shaped another way. He became bitter and merciless, and declared a feud against every dog. He carried it out with such ferocity that even Grey Beaver, fierce as he was, could only marvel. Grey Beaver swore he had never known another animal like him. People in strange villages said the same when they counted their dead dogs and heard the stories of his killings.
        - id: ch01-b12
          speaker: narrator
          text: >-
            When White Fang was almost five, Grey Beaver took him on another long journey. They traveled along the Mackenzie, crossed the Rockies, and followed the Porcupine toward the Yukon. Village after village remembered what White Fang did to its dogs. He delighted in taking revenge on his own kind. Those ordinary dogs never expected his speed or his sudden, direct attack. They stood stiff-legged and bristling, ready for the usual challenge. White Fang gave them no time. Like a steel spring, he snapped into motion and reached their throats while surprise still held them.
        - id: ch01-b13
          speaker: narrator
          text: >-
            He had become an expert fighter, and he wasted nothing. He never spent his strength in a wrestling match. He struck too fast for that, and if he missed, he escaped just as fast. More than most wolves, he hated close contact with another body. It felt dangerous and made him frantic to get free, back on his own feet, with no living thing touching him. The Wild still clung to him and spoke through that fear. His outcast life from puppyhood had made the feeling stronger. Whenever another body pressed against his, danger seemed to be hiding in the contact. Deep within him, it always meant the same thing: a trap waiting to close.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Because he fought that way, most strange dogs never had a chance. White Fang slipped past their teeth. He either struck them or sprang clear, and in both cases he usually came away untouched. There were exceptions, of course. Sometimes several dogs fell on him together and punished him before he could escape. Once in a while, a single dog landed a deep wound. Those moments were accidents rather than the usual result. Most of the time, his skill carried him onward without a mark.
        - id: ch01-b15
          speaker: narrator
          text: >-
            He also judged time and distance with extraordinary accuracy. He never stopped to calculate either one. His eyes saw an action clearly, his nerves carried the sight to his brain, and the parts of his body answered one another more smoothly than they did in an average dog. When another dog leaped or drove its fangs at him, White Fang's brain understood the space covered by that movement and the time it would take. Without thinking, he avoided the attack. In the same instant, he found the tiny opening for a strike of his own. Nerves, mind, and muscles worked as one finer fighting machine. He deserved no praise for that. Nature had simply given him more than she gave most animals.
        - id: ch01-b16
          speaker: narrator
          text: >-
            That summer, White Fang arrived at Fort Yukon. Late in the winter, Grey Beaver had crossed the great divide between the Mackenzie and the Yukon. He spent the spring hunting among the western foothills of the Rockies. When the ice broke on the Porcupine River, he built a canoe and paddled downstream. At last he reached the place where the Porcupine joined the Yukon, just below the Arctic Circle. The old Hudson's Bay Company fort stood there. Around it were many Indigenous people, plenty of food, and more excitement than White Fang had ever known.
        - id: ch01-b17
          speaker: narrator
          text: >-
            It was the summer of 1898. Thousands of gold seekers were traveling up the Yukon toward Dawson and the Klondike. They still had hundreds of miles ahead, though many had already been traveling for a year. Even the shortest journeys had covered five thousand miles, and some people had come from the other side of the world.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Grey Beaver stopped at the fort. A whisper of the gold rush had reached him, so he had brought several bundles of fur and another bundle filled with mittens and moccasins sewn with gut. He would never have risked such a long journey without expecting a generous profit. What he actually earned went far beyond anything he had imagined. In his wildest hopes, he had expected at most to double his money. Instead, he made ten times as much. He settled down to trade slowly and carefully, willing to spend the whole summer and the following winter if that was what it took to sell every last item.
        - id: ch01-b19
          speaker: narrator
          text: >-
            At Fort Yukon, White Fang saw white men for the first time. Beside the people he knew, they seemed like a higher race of gods. Their power impressed him, because power was what made a god. He did not reason this out or form a clear idea that one group was stronger than another. He simply felt it, and the feeling was powerful. As a puppy, he had sensed human strength in the towering shapes of the tepees people built. Now he saw it in massive log houses and the enormous fort. These white gods controlled the things around them more completely than any gods he had known. Grey Beaver had always seemed the mightiest of all. Here, even he appeared like a child-god beside them.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Feeling, more often than thought, guides an animal's actions. Everything White Fang did now came from his sense that these new gods were stronger. At first, he was deeply suspicious. He could not know what strange terrors belonged to them or what unknown pain they could inflict. Curiosity drew him toward them, while fear told him not to be noticed. For the first few hours, he was content to slink around and observe from a safe distance. Then he watched the dogs near them. When no harm came to those animals, White Fang ventured closer.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The white men were just as curious about him. His wolfish looks caught their attention at once, and they pointed him out to one another. Their pointing made White Fang wary. Whenever one tried to approach, he showed his teeth and backed away. No one managed to touch him, and that was fortunate for them.
        - id: ch01-b22
          speaker: narrator
          text: >-
            White Fang soon discovered that no more than a dozen white gods lived at the fort. But every two or three days, a steamer came to the riverbank and remained for several hours. To him, each colossal boat was another astonishing display of power. White men stepped off those steamers, and other white men left aboard them. Their numbers seemed endless. In his first day or two at the fort, he saw more of them than all the Indigenous people he had seen in his life. As the days passed, still more came up the river. They stopped for a while, then continued upstream until they vanished from sight.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The white gods might be powerful, but their dogs did not amount to much. White Fang learned this as soon as he mixed with the animals that came ashore beside their masters. Those dogs came in every shape and size. Some had legs that seemed far too short, while others had legs that seemed far too long. They had hair instead of proper fur, and a few had hardly any hair at all. Worst of all, not one of them knew how to fight.
        - id: ch01-b24
          speaker: narrator
          text: >-
            White Fang fought them and quickly came to despise them. They were soft and helpless. They made a great noise and stumbled about, trying to win by strength alone where he used speed and cunning. A strange dog would charge him, bellowing. White Fang sprang aside, and before the dog understood where he had gone, he struck its shoulder, rolled it over, and drove for the throat.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Sometimes that throat stroke succeeded. The wounded dog fell in the dirt, and the waiting pack of Indian dogs rushed in and tore it apart. White Fang had learned long ago that gods became angry when their dogs were killed. He quickly understood that white men were no different. Once he had knocked a strange dog over and slashed its throat open, he was satisfied to step away. The pack charged in and did the cruel work of finishing the animal. Then the white men rushed upon those dogs and punished them heavily. Stones, clubs, axes, and every other weapon they could seize came down on White Fang's companions. Meanwhile, he stood a little way off and watched. The gods saw the pack doing the killing, so White Fang escaped their anger. His cunning kept the blame away from him.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The other dogs learned too, and White Fang learned with them. They discovered that their best chance came just after a steamer tied up at the bank. That was when the strange dogs first stepped ashore and the attack could begin. Once two or three had been knocked down and destroyed, the white men understood what was happening. They hurried their remaining animals back aboard, then took savage revenge on the attackers. One man had watched the pack tear his setter to pieces before his eyes. He pulled a revolver and fired six times in quick succession. When the shots ended, six Indian dogs lay dead or dying. To White Fang, the gun was one more display of the white gods' terrible power, and the lesson sank deep into him.
        - id: ch01-b27
          speaker: narrator
          text: >-
            White Fang enjoyed all of this. He felt no love for other dogs, and he was clever enough to keep himself out of danger. At first, killing the newcomers was only a diversion. After a while, it became his regular occupation. He had no work of his own because Grey Beaver was busy trading and growing rich. So White Fang waited near the landing with the rough pack of Indian dogs and watched for steamers. The moment one arrived, their sport began. It lasted only a few minutes. As soon as the white men recovered from their surprise, the gang scattered, and the fun ended until another boat came.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Yet White Fang could hardly be called a member of that pack. He never mingled with the others. He kept apart, remained entirely himself, and was feared even by the dogs that worked beside him. Still, he joined them in the hunt. The pack waited while White Fang stepped forward and started the quarrel with a strange dog. Once he had knocked the newcomer down, they rushed in to finish it. His part was over. He withdrew alone, and when the outraged gods came running, he left the pack to receive all the punishment.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Starting those fights took almost no effort. Whenever strange dogs came ashore, White Fang only had to show himself. The instant they saw him, they rushed forward because instinct drove them. To them, he was the Wild itself. He was the unknown and threatening terror that had prowled through the darkness beyond the first campfires. Their ancestors had crouched close to those fires and slowly changed while living beside people. They learned to fear the Wild they had left behind and, in a sense, betrayed. Generation after generation, that fear settled more deeply into the nature of their descendants. For centuries, the Wild had meant terror and destruction. Through all that time, human masters had given their dogs complete freedom to kill wild creatures. By doing so, the dogs protected both themselves and the gods whose company they shared.
        - id: ch01-b30
          speaker: narrator
          text: >-
            These dogs had come fresh from the gentle southern world. They trotted down the gangplank and stepped onto the Yukon shore. The moment they saw White Fang, an irresistible impulse told them to rush him and destroy him. A town might have raised them, but it had not erased their inherited fear of the Wild. Their own eyes saw a wolfish creature standing before them in the clear daylight. Yet it was as if countless older eyes were looking through theirs as well. Through the memory passed down from their ancestors, they knew White Fang for a wolf. With that recognition came the memory of the ancient feud between their kind and his.
        - id: ch01-b31
          speaker: narrator
          text: >-
            That made White Fang's days enjoyable. If the sight of him forced the strange dogs to attack, he welcomed it. They believed he was rightful prey, and he believed the same of them.
        - id: ch01-b32
          speaker: narrator
          text: >-
            His life had prepared him for this. He had first opened his eyes in a lonely cave, and his earliest battles had been against the ptarmigan, the weasel, and the lynx. Later, Lip-lip and the whole puppy pack had made his youth bitter with their persecution. None of those experiences had been wasted. They had all helped form the animal now waiting at the landing. Yet his life could have taken another shape, and then he would have become a different creature. If Lip-lip had never existed, White Fang might have spent his puppyhood among the others. He could have grown more like a dog and learned to like dogs. If Grey Beaver had possessed the measure of affection and love, he might have reached into the deepest parts of White Fang's nature and brought many kindly qualities to the surface. But none of those things had happened.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Life had shaped White Fang until he became what he was: grim and solitary, without love and full of ferocity, the enemy of all his kind.
