audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 第一章　同类之敌
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            白牙的天性里，也许原本还藏着一点点与同类亲近的可能。可自从他做了雪橇队的领头犬，这点可能就永远消失了。狗群恨透了他。米特萨总给他额外的肉，还给他种种优待，有些是真的，有些只是群狗想象出来的，这些都让它们恨他。更让它们发狂的是，他总在队伍最前面奔逃。那条蓬松的大尾巴不停摇摆，两条后腿又永远在向前远去，整天都在它们眼前晃。
        - id: ch01-b02
          speaker: narrator
          text: >-
            白牙也一样痛恨它们。对他来说，领头拉雪橇一点也不快活。三年来，这群狗中的每一条都受过他的痛打，向他低过头。现在，他却必须在它们的狂吠声里一路逃跑，实在难以忍受。可他不得不忍，除非他愿意送命。而白牙体内那股生命力，一点也不想死去。米特萨刚喊出发，狗群就会发出急切而凶狠的叫声，一起朝他冲来。
        - id: ch01-b03
          speaker: narrator
          text: >-
            白牙不能回头抵抗。他只要转身，米特萨手里的鞭梢就会抽上他的脸，带来火辣辣的刺痛。他剩下的路只有一条，那就是逃。面对身后那群嚎叫的恶狗，尾巴和后腿哪能算得上武器？那么多冷酷的尖牙，他根本挡不住。所以他只能向前奔逃。每一次跳跃都违背他的本性，也伤害他的骄傲。他就这样跳着、跑着，一跑便是整整一天。
        - id: ch01-b04
          speaker: narrator
          text: >-
            强行压住天性的冲动，天性就会转过来伤害自己。那感觉好比一根毛，本应朝身体外面长，却偏偏倒着扎进肉里。伤处便会红肿、溃烂，久久作痛。白牙所受的折磨也是这样。他体内所有的冲动都在催促他扑向身后狂吠的狗群，可诸神不准他回头。诸神的命令后面，还有驯鹿肠制成的长鞭。它足有三十英尺，鞭梢咬进肉里毫不留情。白牙只能咽下痛苦。怨毒和恶意在他心里不断长大，最后变得和他的凶猛与不屈一样强烈。
        - id: ch01-b05
          speaker: narrator
          text: >-
            世上要是有谁真正成了同类的敌人，那就是白牙。他不向敌手求饶，也从不饶过敌手。狗群常在他身上咬出伤痕，他也一次次让狗群留下自己的印记。别的领头犬到了营地，卸下挽具之后，总会缩到诸神身边寻求保护，白牙却不肯这样做。他大模大样地在营地里行走，白天受了多少罪，夜里就要讨回多少。过去，狗群看见他会主动让路。如今，它们追了白牙整整一天，他逃跑的样子在它们脑中反复出现。占据上风的感觉也支配了它们，让它们再也不肯退让。白牙只要走近，争斗就会爆发。他一路经过的地方，总响着龇牙声、撕咬声和低吼声。他周围的空气仿佛也充满仇恨与恶意，而这些东西又让他心里的仇恨变得更深。
        - id: ch01-b06
          speaker: narrator
          text: >-
            米特萨下令停车，白牙一定会照办。这在起初害苦了别的狗。它们一停下来便扑向可恨的领头犬，却马上发现情势已经完全变了。米特萨就站在白牙背后，手中长鞭正呼呼作响。几次以后，群狗终于明白，主人既然叫停，它们就得放过白牙。可白牙要是没有听见命令便自行停步，它们就可以扑上去，能把他杀掉也没有关系。白牙吃过几次苦，便再也不擅自停下了。他学东西一向很快。在这样严酷的生活里，想要活下去，就只能学得快。
        - id: ch01-b07
          speaker: narrator
          text: >-
            可一到营地，群狗就是学不会离白牙远点。白天，它们一路追赶他，朝他叫嚣，前一晚才吃过的教训也随之消失。夜里，它们只好重新领教一遍，第二天又马上忘记。它们对白牙的敌意还来自更深的地方。群狗能感觉到，白牙和它们不完全一样，光是这点区别就足以让它们仇视他。它们也是驯养的狼，只是已经跟着人生活了许多代，身上的荒野气息早已消退。在它们眼里，荒野陌生、可怕，永远带着威胁，也永远在争战。白牙的样貌、动作和本能却还属于荒野。他就像荒野本身，站在群狗面前。所以它们向白牙露出尖牙时，也是在抵挡森林阴影和营火外的黑暗中，那股随时可能扑来的毁灭力量。
        - id: ch01-b08
          speaker: narrator
          text: >-
            群狗还是学会了一件事，它们绝不能分散。白牙太可怕，没有一条狗敢独自迎战。它们每次都结成一群，否则白牙一个晚上就能把它们逐条杀死。可只要它们聚在一起，白牙也找不到下杀手的机会。他或许能把一条狗撞倒，但还来不及咬断它的喉咙，整群狗就已经压了上来。争斗刚有一点苗头，全队便立刻靠拢，共同面对他。平日里，这些狗也会互相争吵。可一察觉要和白牙开战，它们便把彼此的争端全忘了。
        - id: ch01-b09
          speaker: narrator
          text: >-
            当然，群狗无论怎么努力，也杀不了白牙。他的动作太快，力量太强，头脑也太聪明。他绝不走进难以脱身的狭窄地方。一旦发现狗群快要围住自己，便总能向后退出包围。想把他撞翻也不可能，因为没有一条狗有那样的本事。白牙的四脚牢牢抓住地面，就像他牢牢抓住生命。在这场与狗群永不停歇的战争里，站稳脚跟就等于保住性命。这一点，没有谁比白牙懂得更清楚。
        - id: ch01-b10
          speaker: narrator
          text: >-
            白牙就这样成了同类的敌人。那些同类原本也是狼，却被人的火焰驯服，在人类强大力量的庇护下变得软弱。白牙不一样。他满怀苦毒，绝不和解。他的本性就是这样被一点点塑成的。他把所有狗都当成血仇，也用最可怕的方式报复它们。灰海狸自己已经凶悍野蛮，看见白牙的凶猛仍然忍不住惊叹。他发誓说，从来没有见过这样的野兽。陌生村庄里的印第安人听到白牙杀过多少当地的狗，也会发出同样的誓言。
        - id: ch01-b11
          speaker: narrator
          text: >-
            白牙快五岁时，灰海狸带他开始了又一次长途旅行。他们走过麦肯齐河沿岸的许多村庄，翻越落基山脉，又顺着豪猪河来到育空河。白牙一路给各地的狗带来惨烈破坏，许多年以后，人们还记得他的所作所为。他尽情向同类复仇，并且从中得到快意。那些都是普通的狗，根本没有防备。它们应付不了白牙的速度，也应付不了他干脆直接、毫无预警的袭击。它们不知道眼前的白牙是什么，只知道一道带来杀戮的闪电忽然出现。它们竖起毛，绷直腿，向他挑战。白牙不浪费时间摆架势。他像钢弹簧那样骤然弹起，一口直取喉咙。那些狗还在惊愕之中，甚至不明白发生了什么，就已经死在他的牙下。
        - id: ch01-b12
          speaker: narrator
          text: >-
            白牙已经成了打斗的高手。他懂得节省体力，从不白费力气，也绝不跟对手扭成一团。他的进攻快得让缠斗根本无法开始。即使扑空，也会快得让对方来不及缠住他。狼本来就不喜欢贴身搏斗，白牙尤其厌恶与另一个身体长久接触。他一碰到对手，便觉得危险就在身边，心里立刻变得惊慌急躁。他必须赶快离开，重新自由地站在四条腿上，不碰任何活物。这是他身上的荒野仍在坚持自己的本性。从幼年起，他就过着被排斥、独自流浪的生活，这让他更害怕接触。他总觉得接触里藏着危险，藏着陷阱。对陷阱的恐惧早已埋进生命深处，也织进了他的每一丝血肉。
        - id: ch01-b13
          speaker: narrator
          text: >-
            正因为这样，陌生狗碰见白牙根本没有机会。白牙会避开它们的尖牙，然后击倒对手，或者及时脱身。无论是哪一种，他自己通常都不会受伤。不过，任何事情都有例外。有时好几条狗同时扑来，会在他逃走以前伤到他。偶尔也有一条狗能在他身上留下很深的伤口，但那只是意外。大多数时候，他已经高明得近乎可怕，总能一路打过去而毫发无伤。
        - id: ch01-b14
          speaker: narrator
          text: >-
            白牙还有另一样本领，他能把时间和距离判断得十分准确。当然，他不会有意识地计算，所有判断都会自己完成。他的眼睛看得准，神经也会把景象准确送进大脑。他身体的各个部分比普通狗配合得更好，动作更顺畅，也更稳定。神经、头脑和肌肉之间的协调尤其出色。眼睛刚把一个动作的影像传来，大脑不需要思考，就知道这个动作能到达哪里，又要多久才能完成。因此，别的狗扑来或张口咬来时，白牙可以及时闪开。同时，他还能抓住短得几乎看不见的空隙，发动自己的攻击。他的身体和头脑，就像一架更加完善的机器。不过这没有什么值得称赞的。只不过大自然给他的，要比给普通动物的更多。
        - id: ch01-b15
          speaker: narrator
          text: >-
            到了夏天，白牙来到了育空堡。冬末时，灰海狸越过了麦肯齐河和育空河之间的大分水岭。整个春天，他都在落基山脉西边外围的山岭间打猎。后来，豪猪河的冰层裂开、消融，他造了一只独木舟，沿河一直划到豪猪河汇入育空河的地方，那里就在北极圈下方。古老的哈得孙湾公司堡垒便建在那里。堡垒旁有许多印第安人，有充足的食物，还有白牙从未见过的热闹。那是1898年的夏天。几千名淘金者正沿育空河向上游赶，要去道森和克朗代克。他们离终点还有几百英里，可不少人已经走了整整一年。即使路程最短的人，到这里也走过五千英里，还有一些人来自世界的另一边。
        - id: ch01-b16
          speaker: narrator
          text: >-
            灰海狸决定留在这里。他早就听到了淘金热的消息，这次带来了几大捆毛皮，还有一捆用动物肠线缝成的连指手套和鹿皮鞋。他料定这趟买卖能带来丰厚利润，不然绝不会冒险走这么远。可真正赚到的钱，还是远远超出预料。他最狂野的美梦，也不过是把本钱翻一倍，最后却赚了十倍。灰海狸便像一个地道的印第安人那样住下来，不急不躁，小心做着生意。即使要用掉整个夏天，再搭上下一个冬天，他也愿意慢慢卖完所有货物。
        - id: ch01-b17
          speaker: narrator
          text: >-
            白牙第一次见到白人，也是在育空堡。跟他过去熟悉的印第安人相比，这些人仿佛属于另一个种族，是比旧日诸神更高等的诸神。他从他们身上感到了更强的力量，而力量正是神性依靠的根基。白牙没有认真思考，也没有在心里得出什么清楚的结论。他只是强烈地感觉到，白皮肤的诸神更有力量。幼年时，人类搭起的圆锥帐篷曾高高压在他眼前，让他感到人的力量。如今，粗重原木建成的房屋和巨大堡垒，又带来了同样的震撼。力量到处可见。白皮肤的诸神很强大，支配物质的本领远胜他见过的诸神。灰海狸曾是那些神里最有力量的一个，可站在白人面前，他也只像一个孩子般的神。
        - id: ch01-b18
          speaker: narrator
          text: >-
            白牙确实只感觉到了这一切，并没有真正想明白。可动物做事，往往更听从感觉，而不是思考。现在，他的所有举动都出自一个感觉，那就是白人属于更高等的诸神。一开始，他对他们充满猜疑。他不知道这些人还藏着什么陌生的恐怖本领，也不知道他们能造成怎样的伤害。他想观察他们，又害怕被他们注意。最初几个钟头，他只在远处悄悄绕行，躲在安全的地方看着。后来，他发现靠近白人的狗都平安无事，才试着走近一点。
        - id: ch01-b19
          speaker: narrator
          text: >-
            白人也对白牙十分好奇。他那副狼的样子一下就吸引了所有目光，人们互相指给同伴看。他们一抬手指他，白牙便立刻警惕起来。等有人试着靠近，他就露出牙齿，向后退开。谁也没能把手放到他身上。对那些白人来说，这其实是件幸事。
        - id: ch01-b20
          speaker: narrator
          text: >-
            没过多久，白牙就看出，真正住在这里的诸神很少，最多只有十二个人。每隔两三天，便会有一艘汽船靠岸，停上几个钟头。汽船庞大得惊人，也是力量的一种显现。白人从船上下来，又搭船离开。他们的数量仿佛永远也数不完。只过了一两天，白牙见到的白人就已经超过了他一生见过的印第安人。后来，他们还是不断沿河而来，短暂停留，又继续向上游驶去，直到消失不见。
        - id: ch01-b21
          speaker: narrator
          text: >-
            白皮肤的诸神也许什么都做得到，他们的狗却没有多少本事。白牙跟随主人上岸的狗交手之后，很快就看清了这一点。那些狗大小不一，长得也很不匀称。有些腿短得过分，另一些又长得过分。它们身上只有普通的毛发，没有浓密的皮毛，还有几条甚至几乎没什么毛。最要紧的是，它们一条也不会打架。
        - id: ch01-b22
          speaker: narrator
          text: >-
            白牙既然把同类当成敌人，自然会和这些狗交战。他很快就开始轻蔑它们。它们软弱又无能，叫起来倒是很响，只会笨拙地乱扑，企图用蛮力做到白牙靠速度和计谋就能做到的事。它们咆哮着冲过来，白牙朝旁边一闪，便从它们眼前消失了。还没等它们反应过来，他已从侧面撞中肩头，把对手掀倒，再咬向它的喉咙。
        - id: ch01-b23
          speaker: narrator
          text: >-
            有时候，这致命的一口会咬得很准。受伤的狗滚倒在泥里，一直等候的印第安狗群随即扑上去，把它撕成碎片。白牙很懂得怎样保护自己。他早已知道，诸神看见自家的狗被杀，会大发雷霆，白人也是一样。所以他撞倒白人的狗，撕开它的喉咙以后，便会退到一旁，让狗群冲上去结束那条狗的性命。接下来，白人会愤怒地赶到，把惩罚重重落在狗群身上，白牙却不会受牵连。他只在不远处看着。石头、棍棒、斧头，还有各种武器，全落向那些同伴。白牙真是聪明极了。
        - id: ch01-b24
          speaker: narrator
          text: >-
            后来，他的同伴也用自己的方式学聪明了，白牙又从它们那里学到新的办法。群狗发现，汽船刚刚靠岸的时候最好玩。头两三条陌生狗一倒下，被它们撕碎，白人便会赶紧把剩下的狗送回船上，然后狠狠报复行凶的狗群。有一回，一个白人亲眼看着自己的塞特猎犬被撕碎，立刻拔出左轮手枪，飞快开了六枪。狗群中也有六条倒下，有的已经死去，有的正在断气。对白牙来说，这又是力量的一次显现，深深留在了他的意识里。
        - id: ch01-b25
          speaker: narrator
          text: >-
            白牙很喜欢这样的生活。他不爱自己的同类，又足够机灵，总能避开伤害。最初，杀死白人的狗还只是一种消遣，渐渐却成了他每天要做的事。他没有别的活要干，灰海狸又忙着做买卖，眼看越来越富有。于是白牙和一群名声很坏的印第安狗守在码头附近，等待下一艘汽船。船一靠岸，欢乐便开始了。只需几分钟，白人就会从惊讶中清醒过来，狗群也会四散逃走。乐子结束了，大家只能等下一艘船。
        - id: ch01-b26
          speaker: narrator
          text: >-
            不过，要说白牙属于这群狗，其实并不准确。他从不和它们混在一起，始终离群而居，只做他自己。那群狗甚至也害怕他。他确实会和它们配合。每逢陌生狗上岸，白牙负责挑起争斗，狗群就在旁边等待。他把陌生狗掀翻之后，它们便冲上去完成杀戮。可白牙随即也会离开，把愤怒的诸神带来的惩罚全留给狗群。
        - id: ch01-b27
          speaker: narrator
          text: >-
            白牙根本不必费心挑衅。他只要在陌生狗上岸时现身，就已经足够。那些狗一看见他，便会扑过来。这是刻在它们身上的本能。白牙就是荒野，是未知的、可怕的、永远带着威胁的东西。在远古时代，它们的祖先畏缩在火堆旁，改变着自己的本能。那时，白牙所代表的力量就在火光以外的黑暗里游荡。狗的祖先正是在那里学会害怕荒野。它们本来来自荒野，后来却离开它、背叛了它。对荒野的恐惧就这样传过一代又一代，深深印进狗的天性。几百年来，荒野一直代表恐怖和毁灭。人类也始终允许狗杀死荒野中的生灵，因为这样既能保护狗自己，也能保护与狗共同生活的诸神。
        - id: ch01-b28
          speaker: narrator
          text: >-
            这些狗刚离开南方温暖安逸的世界，沿着跳板跑下汽船，来到育空河岸。它们只要看见白牙，就会被一股强烈的冲动抓住，非扑上去消灭他不可。哪怕是在城镇长大的狗，也照样生来畏惧荒野。明亮的白天里，站在它们面前的是一个长得像狼的生灵。看见他的，不只是一双双眼睛，还有它们祖先的眼睛。凭着代代相传的记忆，它们认出白牙就是狼，也想起了那场流传已久的仇恨。
        - id: ch01-b29
          speaker: narrator
          text: >-
            因为这一切，白牙在育空堡的日子过得格外快活。陌生狗看见他就扑来，对他当然再好不过，对它们却再糟不过。它们认为白牙是可以放心捕杀的猎物，而在白牙眼里，它们同样也是可以捕杀的猎物。
        - id: ch01-b30
          speaker: narrator
          text: >-
            白牙出生在孤寂的洞穴里，睁眼看见天光以后，最初几次争斗的对手便是雷鸟、鼬和猞猁。这些经历没有白费。后来，唇唇带着整群幼犬不断迫害他，让他的幼年充满痛苦，那些经历也没有白费。事情原本可以完全不同，白牙也可能长成完全不同的模样。要是从来没有唇唇，他本会与别的幼犬一起长大，身上会多一点狗的性情，也会更喜欢自己的同类。要是灰海狸懂得温情和爱意，他或许能探到白牙天性的最深处，把那里许多善良的品质引出来。可是，这些事从来没有发生。生活一次次塑造着白牙，最终把他变成了现在的样子。他阴郁、孤独，不懂得爱，性情凶猛，也成了所有同类的敌人。
