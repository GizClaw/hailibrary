  chapters:
    - id: ch01
      title: THE GREY CUB
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One cub was different from all his brothers and sisters. Their fur already showed the reddish color they had inherited from their mother, the she-wolf. His fur alone was grey, like his father's. In that one feature, he belonged to the straight wolf stock rather than to his mother's line. In fact, his body had come true to old One Eye in nearly every way. There was only one exception. The little cub had two eyes, while his father had only one.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Those eyes had opened only a short time ago, but already they saw steadily and clearly. Even before they opened, he had known the world through touch, taste, and smell. He knew each of his two brothers and two sisters very well. He tumbled about with them on weak, clumsy legs and fought with them too. As his temper rose during those little struggles, a strange rasp shook his small throat. It was the first beginning of the growl he would have later.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He had known his mother long before he could see her. Touch, taste, and smell had taught him what she was. To him, she was a never-failing source of warmth, liquid food, and tenderness. Her tongue moved gently over his soft little body, caressing him until he was quiet. The feeling made him nestle closer against her, and there he would drift to sleep.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He slept through most of his first month. Now that he could see well, he stayed awake for longer stretches, and little by little he learned his world. It was a gloomy place, though he could not know that because he had never seen another. Its light was dim, but his eyes had never needed to adjust to anything brighter. The walls of the lair made his whole world very small. Yet he knew nothing of the wide land outside those walls. With no larger world to compare it to, he never felt trapped by the narrow space.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Still, he discovered very early that one wall was unlike every other. It was the mouth of the cave, where the light came in. The cub had felt its pull before he had thoughts of his own or could choose what to do. Even before his eyes opened, the light beat against his sealed lids. His eyes and the nerves behind them answered with tiny flashes, like warm-colored sparks that felt strange and pleasant. Every fiber of his living body reached toward that light. The urge belonged to the life within him, not yet to the cub as a separate, thinking creature. A plant turns toward the sun without knowing why, and in the same way, his body was drawn toward that brightness.
        - id: ch01-b06
          speaker: narrator
          text: >-
            At first, before any of them had a conscious life, he and all the other cubs crawled toward the cave mouth without knowing what they were doing. Not one of them ever chose the dark corners by the back wall. Their need for light was part of being alive. Their little bodies were almost like puppets, moving blindly toward it, like vines reaching out their tendrils. Later, each cub began to feel separate wishes and desires. Then the attraction became even stronger. Again and again they crawled and sprawled toward the brightness, and again and again their mother drove them back.
        - id: ch01-b07
          speaker: narrator
          text: >-
            That was how the grey cub learned that his mother was more than a soft, soothing tongue. When he would not stop crawling toward the light, he met her nose in a sharp nudge of warning. Later, he met her paw. With one quick and carefully aimed stroke, it crushed him down and rolled him over and over. That taught him what hurt meant. Then he learned two ways to avoid it. He could refuse the risk in the first place, or, if he had already gone too far, he could dodge and retreat. These were among his first conscious actions and his first broad lessons about the world. Once he had pulled away from pain automatically, just as he had crawled toward the light automatically. Now he drew back because he knew it was pain.
        - id: ch01-b08
          speaker: narrator
          text: >-
            He was a fierce little cub, as all the litter were. That was only natural. He was a flesh-eating animal, born from a breed of hunters that killed meat and ate it. His father and mother lived on nothing else. Even the milk that had fed the first weak flicker of his life was made directly from meat. Now he was one month old, and his eyes had been open for only a week. Already he was beginning to eat meat himself. The she-wolf swallowed it first, then brought it back half-digested for five growing cubs, because their hungry mouths demanded more than her breast could give.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Yet he was the fiercest of the five. His rough little growl was louder than the others, and his tiny fits of rage were more terrible. He was the first to discover how one clever stroke of a paw could roll another cub over. He was also the first to seize a brother or sister by the ear, clamp his jaws tight, and pull and tug while growling. More than any of them, he troubled his mother by trying to reach the cave mouth.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Each day, the light drew him more strongly. He was always setting out on adventures that carried him a yard toward the cave mouth, and his mother was always sending him back. He did not understand that this was an entrance. He knew nothing about passages that led from one place into another, because he knew of no other place and could not imagine a way to reach one. To him, the opening was simply a wall made of light.
        - id: ch01-b11
          speaker: narrator
          text: >-
            That shining wall was the sun of his little world, just as the true sun belonged to creatures outside. It called him as a candle calls a moth. He was forever trying to reach it. The fast-growing life inside him kept pushing him toward it without rest. That life knew the light marked the one way out and the path he was born to follow. But the cub himself knew none of this. He did not even know there was an outside.
        - id: ch01-b12
          speaker: narrator
          text: >-
            One thing about the light wall was strange to him. He had come to recognize his father as the one other grown creature in his world. One Eye was a wolf like his mother. He slept near the brightness, and he was the one who brought meat into the lair. Yet this father had a curious habit. Again and again, One Eye walked straight into the far white wall and vanished.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The cub could not understand how it happened, and his mother never allowed him close enough to try the far wall for himself. He had explored all the other walls, though. Each time, the end of his tender nose struck something hard, and the blow hurt. After several painful adventures, he left those walls alone. Without thinking further, he accepted that vanishing into a wall was simply something his father did. In the same way, milk and half-digested meat were simply things that belonged to his mother.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The grey cub did not think the way a person thinks. His mind worked in dim ways, but the answers it reached were as sharp and certain as a person's conclusions. He had a simple method. He sorted each thing into its place and accepted it without asking why it happened. Knowing how it happened was enough. After bumping his nose a few times, he understood that he could not disappear into walls. He also understood that his father could. He felt no need to discover why they were different. Logic and physics had no place in his young mind.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Then, like most creatures of the Wild, he learned about famine very early in life. The meat stopped coming, and there was no longer any milk in his mother's breast. At first the cubs whimpered and cried, though mostly they slept. It did not take long for hunger to pull them into a heavy stupor. Their squabbles and small rages ended. They made no more attempts at growling, and all their adventures toward the far white wall stopped. They only slept while the life inside them flickered and sank low.
        - id: ch01-b16
          speaker: narrator
          text: >-
            One Eye grew desperate. He hunted far and wide and hardly slept in the lair, which had become a miserable place. The she-wolf also left her cubs to search for food. Soon after they were born, One Eye had gone back several times to the Indian camp and stolen rabbits from the snares. But the snow melted, the streams opened, and the people moved away. That source of food was gone.
        - id: ch01-b17
          speaker: narrator
          text: >-
            At last the grey cub came back to life and noticed the white wall again. But now his little world held far fewer lives. Only one sister remained. The other cubs were gone. Food made his own body round and strong once more, but it had come too late for her. She no longer raised her head or tried to play. She slept on, a tiny skeleton covered with skin, while the flame of life sank lower and lower. At last it went out.
        - id: ch01-b18
          speaker: narrator
          text: >-
            A second famine came, though it was not as severe as the first. When it ended, the grey cub no longer saw his father sleeping by the entrance or appearing and disappearing through the wall. The she-wolf knew why One Eye never returned, but she had no way to tell her son.
        - id: ch01-b19
          speaker: narrator
          text: >-
            While hunting for meat, she had gone up the left branch of the stream, into the country of the lynx. There she found One Eye's trail, already a day old, and followed it. At the end lay all that remained of him. The marks around the place told of a battle and showed that the lynx had won, then gone back to her rocky lair. The she-wolf found that lair before she left. But the signs said the lynx was inside, and she did not dare enter.
        - id: ch01-b20
          speaker: narrator
          text: >-
            From then on, the she-wolf avoided the left fork when she hunted. She knew there were kittens in the lynx's den. She also knew their mother was fierce, quick to anger, and terrible in a fight. Half a dozen wolves might drive a spitting, bristling lynx into a tree. One wolf alone faced a very different danger, especially when the lynx had hungry kittens behind her.
        - id: ch01-b21
          speaker: narrator
          text: >-
            But the Wild was the Wild, and motherhood was motherhood. In the wilderness or beyond it, a mother would fight fiercely to protect her young. The day would come when, for the sake of her grey cub, the she-wolf would take the left fork. She would go to the lair among the rocks and face the wrath of the lynx.
