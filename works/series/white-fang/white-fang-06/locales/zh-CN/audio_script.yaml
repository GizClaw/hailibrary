audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 灰色幼崽
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            他和兄弟姐妹们长得不一样。其他幼崽的毛已经泛出母狼那样的红褐色，只有他随了父亲，是整窝里唯一的灰色幼崽。他承袭的是纯正的狼种。若只看外貌，他简直就是老独眼狼的翻版。只有一点不同，父亲少了一只眼睛，他的两只眼睛却好好的。
        - id: ch01-b02
          speaker: narrator
          text: >-
            灰色幼崽睁眼没几天，眼前的东西已经看得很清楚。其实，在双眼还闭着的时候，他就会用身体去感觉，用嘴去尝，用鼻子去闻。他早就熟悉两个兄弟和两个姐妹，也开始和他们笨手笨脚地玩闹、争抢。一发起小脾气，喉咙里还会震出沙沙的怪声。这声音以后会变成真正的低吼。
        - id: ch01-b03
          speaker: narrator
          text: >-
            母亲更是他还没睁眼就认识的。他从触感、味道和气味里知道，母亲那里有温暖，有乳汁，也有温柔。她柔软的舌头从他小小的身体上舔过去，他便安静下来，紧紧贴到她身边，慢慢睡着。出生后的第一个月，他大半时间就是这样度过的。
        - id: ch01-b04
          speaker: narrator
          text: >-
            现在，他能看见了，醒着的时间也一天比一天长。他渐渐熟悉了自己的世界。那是个阴暗的世界，可他不知道它阴暗，因为他从未见过别处。那里的光很微弱，可他的眼睛也从没适应过更亮的光。他的世界还很小，四面的洞壁就是它的边界。但他不知道洞外还有广阔天地，自然也不会觉得这样的生活太狭窄。
        - id: ch01-b05
          speaker: narrator
          text: >-
            不过，他很早就察觉到，有一面墙跟别处不同。那是洞口，光就是从那里来的。那时候，他还没有清楚的念头，更不会有意识地决定自己要做什么。可在双眼睁开之前，那片光已经牢牢吸引住了他。光照在闭着的眼皮上，眼睛和视神经便随着细小的亮点一下一下跳动。那些闪光暖暖的，奇妙得让他喜欢。
        - id: ch01-b06
          speaker: narrator
          text: >-
            他全身每一根纤维里的生命，都在渴望那片光，催着身体向它靠近。这并不是他自己明白的愿望，而是构成身体的生命在行动，就像植物体内的生机总会把它推向太阳。在意识还没醒来时，他总是向洞口爬。他的兄弟姐妹也一样，没有一只会爬向后壁那些黑暗的角落。
        - id: ch01-b07
          speaker: narrator
          text: >-
            光吸引着这些幼崽，就像吸引草木。生命离不开光，于是他们那些小木偶似的身体，受着体内的力量摆布，盲目地向前爬，仿佛藤蔓伸向前方的卷须。后来，每只幼崽都有了自己的性情，也开始知道自己想要什么，光对他们的吸引反而更强了。他们一次次连爬带滚地奔过去，又一次次被母亲赶回去。
        - id: ch01-b08
          speaker: narrator
          text: >-
            就是在不断奔向光亮的途中，灰色幼崽发现，母亲不只有一条柔软温柔的舌头。她的鼻吻会忽然拱过来，狠狠教训他。后来，她还会看准时机挥出一爪，把他按倒，推得一连翻上好几个滚。他就这样认识了疼痛，又学会了怎样避开它。最好的办法是别去招惹。要是已经惹来了，就赶快闪开，赶快后退。
        - id: ch01-b09
          speaker: narrator
          text: >-
            这些已经不是单凭本能做出的反应，而是他有意识的行动，也是他最早从这个世界学到的道理。从前，他碰到疼痛就会自动缩回去，正像他会自动爬向光亮。如今，他躲开疼痛，是因为他知道那东西会疼。
        - id: ch01-b10
          speaker: narrator
          text: >-
            他是一头凶猛的小狼，兄弟姐妹也都是。这并不奇怪。他们是食肉的野兽，血脉来自捕杀猎物、吞吃血肉的狼。父母全靠肉活着，就连他们刚刚出生时吸到的奶，也是母狼吃下血肉以后化出来的。一个月大的时候，灰色幼崽睁眼才一星期，已经开始吃肉了。那是母狼吞下又消化了一半，再吐出来喂给他们的肉。五只幼崽越长越大，她的乳汁已经不够他们吃了。
        - id: ch01-b11
          speaker: narrator
          text: >-
            而灰色幼崽还是这一窝里最凶的。他喉咙里那种沙哑的低吼，比谁发出的都响。小小的怒火烧起来，也比他们的更吓人。他第一个学会巧妙地拍出一爪，把同窝的幼崽掀倒。也是他第一个咬住别的幼崽的耳朵，紧咬着牙又拉又扯，嘴里还不停低吼。每当母亲阻止孩子们靠近洞口，他当然也是最让她操心的那个。
        - id: ch01-b12
          speaker: narrator
          text: >-
            灰色幼崽越来越迷恋那片光。每天，他都要一次又一次向洞口探险。每一趟不过爬出一码远，每一趟又都被母亲赶回来。他还不知道那里叫入口，更不知道入口是一条通道，可以把一个地方和另一个地方连起来。他从未见过别的地方，当然也想不到有什么路能通向那里。所以在他眼中，那只是墙，一面由光构成的墙。
        - id: ch01-b13
          speaker: narrator
          text: >-
            外面的生灵有太阳，灰色幼崽的世界里也有这面光墙。它像烛火吸引飞蛾一样，叫他一心只想靠近。身体里的生命飞快长大，又不停把他推向那里。他的生命知道，那是唯一的出口，是他命中注定会走上的路。可灰色幼崽自己什么也不知道。他根本不知道，自己的小世界之外还有一个世界。
        - id: ch01-b14
          speaker: narrator
          text: >-
            光墙还有一件古怪的事。这时候，灰色幼崽已经认得父亲了。他知道，父亲是这个世界里的另一个居民，和母亲是同类，常常睡在光亮旁边，还会带肉回来。可父亲有一种奇怪的本领。他能一直走进远处那面白墙，然后从眼前消失。灰色幼崽怎么也弄不懂。
        - id: ch01-b15
          speaker: narrator
          text: >-
            母亲不许他接近那面白墙，可他探查过其余的墙。柔嫩的鼻尖一撞上去，立刻碰到坚硬的阻挡。那滋味很疼。试过几回以后，他便不再招惹那些墙。他也没有费心去想，只把穿墙消失当成父亲特有的本领，就像乳汁和半消化的肉是母亲特有的东西。
        - id: ch01-b16
          speaker: narrator
          text: >-
            灰色幼崽其实并不会像人那样思考。他的头脑还在一片蒙眬中运转，可得出的结论却非常清楚。他只管接受发生的一切，不会追问为什么。事情为何会这样，他从不烦恼。知道它怎样发生，对他来说就够了。这其实是在把不同的事一件件分开，归到各自的位置。
        - id: ch01-b17
          speaker: narrator
          text: >-
            鼻子在后壁撞过几次，他便接受了一件事，那就是自己不能从墙里消失。看见父亲几次走进白墙，他也接受了另一件事，父亲能够从墙里消失。父亲为何做得到，自己为何做不到，他一点也不想查明白。逻辑和物理，从来不是他头脑中的东西。
        - id: ch01-b18
          speaker: narrator
          text: >-
            荒野里的生灵大多很早就尝过饥荒，灰色幼崽也不例外。有一段日子，肉没有了，母亲的乳房里也不再有奶。起初，幼崽们还会呜咽哭叫，可更多时候只是睡觉。很快，他们便饿得昏昏沉沉。再也没有打闹，没有争抢，没有小小的怒火，也没有谁还练习低吼。通向远处白墙的探险也彻底停了。幼崽们一直睡着，体内的生命之火微弱地闪了几下，越来越暗。
        - id: ch01-b19
          speaker: narrator
          text: >-
            独眼狼陷入了绝望。他跑遍很远的地方寻找食物，几乎不在巢里睡觉。洞穴如今已经凄凉得让人难受。母狼也离开孩子，出去找肉。孩子出生后的头几天，独眼狼曾几次跑回印第安人的营地，从捕兔套里偷走猎物。可积雪融化以后，溪流解冻了，印第安人也搬走了。这条食物的来路就此断了。
        - id: ch01-b20
          speaker: narrator
          text: >-
            后来，灰色幼崽终于重新有了精神，又开始留意远处的白墙。他这才发现，小小世界里的居民少了许多。兄弟姐妹中，只剩一个姐妹还在身旁，其余的都不见了。灰色幼崽慢慢恢复力气，只能独自玩耍。那个姐妹再也抬不起头，也不再挪动身体。
        - id: ch01-b21
          speaker: narrator
          text: >-
            灰色幼崽吃到了肉，身体又一点点圆润起来。可是这份食物对他的姐妹来得太晚。她不停地睡着，身上只剩一层皮裹着细小的骨头。那里面，生命的火焰越燃越弱，最后终于灭了。
        - id: ch01-b22
          speaker: narrator
          text: >-
            又过了一段日子，灰色幼崽再也看不到父亲从光墙里进进出出，也看不到他睡在洞口。这是在第二场饥荒快结束时发生的。那次饥荒没有第一次那么严重。母狼知道独眼狼为什么没回来，可她没办法把自己见到的事告诉孩子。
        - id: ch01-b23
          speaker: narrator
          text: >-
            有一次，母狼独自外出寻找食物，走进溪流左边的岔道。那里是猞猁出没的地方。她发现了独眼狼一天前留下的足迹，便一路追过去。在足迹尽头，她找到了他，或者说，找到了他剩下的残骸。周围到处都是搏斗留下的痕迹。那些痕迹也告诉她，猞猁打赢以后退回了自己的巢穴。
        - id: ch01-b24
          speaker: narrator
          text: >-
            母狼离开前还找到了那座巢。她看得出来，猞猁就在里面，不敢进去。从此以后，每次外出捕猎，她都会躲开左岔道。她知道那座巢穴里有一窝猞猁幼崽，也很清楚母猞猁凶狠暴躁，打起架来有多可怕。
        - id: ch01-b25
          speaker: narrator
          text: >-
            若是六头狼围住一只吐着唾沫、竖起全身毛的猞猁，把她逼到树上，那还好办。可只有一头狼，独自面对一只猞猁，情形就完全不同了。何况，那只猞猁背后还有一窝饥饿的幼崽。
        - id: ch01-b26
          speaker: narrator
          text: >-
            可荒野终究是荒野，母爱终究是母爱。不论在荒野里，还是在荒野之外，母亲为了保护孩子，都能变得无比凶猛。那一天终究会来。为了灰色幼崽，母狼会再次踏进左岔道，走向岩石中的巢穴，也走向猞猁的怒火。
