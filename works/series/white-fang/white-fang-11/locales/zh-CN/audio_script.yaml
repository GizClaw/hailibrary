audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 第三章　弃儿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            唇唇一直折磨白牙，让他的日子越来越阴暗。白牙本来就有野性，可这场没完没了的迫害，把他的凶狠推得远远超出了天性。连营地里的人形动物也认定他是条恶狗。哪里有人争吵，哪里有狗打架，或是哪个女人发现肉被偷了，白牙总在那儿，而且往往就是祸事的根源。人们从不追问他为什么会变成这样，只看见他惹出的麻烦。他们说他鬼鬼祟祟，是小偷，是专门煽动争斗的惹事精。女人们气急了，就当面骂他是头没用的狼，早晚不会有好下场。白牙只是警觉地盯着她们，准备躲开随时可能砸来的东西。
        - id: ch01-b02
          speaker: narrator
          text: >-
            营地里住着那么多生命，白牙却成了孤零零的弃儿。所有半大的狗都听唇唇带领，一起跟他作对。他和它们确实不一样。也许那些家犬能感觉到，他身上流着荒林的血，所以像仇视狼一样，本能地仇视他。既然已经结了仇，它们很快就有了更多敌视他的理由，因为每一条狗都曾尝过白牙的牙齿。白牙给它们的伤，常常比自己挨的更重。单独交手时，他能打败其中许多，可它们从不让他只对付一个。只要争斗开始，营地里所有半大狗都会奔来，一齐压到他身上。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一次次被狗群围攻，教会了白牙两件要紧的事。第一件，是被一大群敌人包围时，怎样保住自己。第二件，是单独撞见一条狗时，怎样用最短的时间把它伤得最重。困在敌群里，能不能四脚着地，关系到他的性命。这个本领，他练得像猫一样好。成年狗用沉重的身体撞来，可能把他撞上半空，也可能让他贴着地面滑出去。不管向后还是向旁边跌，他总把腿收在身下，落地时四脚仍然朝下。
        - id: ch01-b04
          speaker: narrator
          text: >-
            普通的狗真正撕咬以前，总要先低吼、竖毛，再绷直四腿威吓一番。白牙把这些全省了。多耽搁一会儿，别的狗就会赶到，他必须立刻动手，再立刻脱身。所以，他从不给对手警告。敌人还没有防备，他已经猛冲过去，狠狠咬下。这样一来，一条狗还没明白出了什么事，肩头已经被撕开，或是耳朵已经被扯烂，等于先输了半场。白牙也发现，毫无准备的狗特别容易撞倒。狗一倒下，柔软的颈下便会露出来片刻，那正是夺命的地方。世代捕猎的狼，早把这份知识传进了他的血脉。于是，他主动出击时总用同一套办法。先找到一条落单的半大狗，趁它不备将它撞倒，再一口咬向喉咙。
        - id: ch01-b05
          speaker: narrator
          text: >-
            白牙还没有长成，下颚不够宽，也不够有力，还不能一口咬死敌手。不过，营地里已经有不少半大狗带着撕裂的颈伤，那些伤口清楚地显出了他的杀心。有一天，他在林边抓住一个落单的仇敌。他一遍遍将对方撞倒，一遍遍扑咬喉咙，最后割破了大血管，让它死在那里。当天夜里，整个营地都闹翻了。有人看见事情经过，把消息告诉了死狗的主人。女人们又想起从前丢失的肉，都来愤怒地围攻灰海狸。可灰海狸把白牙关进帐篷，亲自守住门口。无论族人怎样喊着要报仇，他就是不肯交出白牙。
        - id: ch01-b06
          speaker: narrator
          text: >-
            从此以后，人和狗都恨白牙。他成长的这段日子里，从来没有一刻安全。每条狗都想咬他，每个人都可能动手。同类见了他便咆哮，那些神见了他便咒骂，还会扔来石头。白牙的身体总是紧绷着。他防着正面的袭击，也提防暗算，还要留意突然飞来的东西。他随时都能又快又冷静地行动，要么亮出牙齿扑上去，要么带着威吓的低吼跳开。
        - id: ch01-b07
          speaker: narrator
          text: >-
            营地里不管幼犬还是成年狗，没有谁能像白牙一样，发出那么可怕的低吼。低吼是用来警告和恫吓的，什么时候该用，得有准确的判断。白牙既知道时机，也知道怎样把一切狠毒、恶意和恐怖都放进声音里。他的鼻梁不断抽搐，皱出一道道棱纹。背毛一浪接一浪地竖起。鲜红的舌头像蛇一样飞快吐出，又缩回嘴里。双耳紧贴脑后，眼睛闪着仇恨，嘴唇向后翻起，獠牙上滴着涎水。任何袭击者看见这副模样，几乎都会停顿一下。白牙若没有防备，这一瞬间也足够他看清处境，决定是战是退。有时候，对手这一停便不再进攻。甚至面对成年狗，他也曾靠着一声低吼，体面地全身而退。
        - id: ch01-b08
          speaker: narrator
          text: >-
            半大狗群不许白牙跟着它们奔跑，白牙便让其中任何一条狗也不敢独自奔跑。他会藏在灌木里偷袭，也会守在路边伏击。狗群为了防备这个自己造就的可怕敌人，只能紧紧聚在一起。除了唇唇，没有谁敢单独出门。河边要是出现一条落单的幼犬，它不是会被杀死，就是会被白牙突然截住，再尖声惨叫着逃回营地，把所有人都惊动起来。
        - id: ch01-b09
          speaker: narrator
          text: >-
            狗群已经牢牢记住不能分散，白牙的报复却没有停止。他遇到落单的狗，就主动袭击。它们聚在一起，也会反过来追他。每次只要看见白牙，整群狗便冲上去，而他通常都能靠速度逃脱。可是，哪条狗如果跑得太快，冲到了同伴前面，它就要遭殃了。白牙会猛然转身，扑倒最前面的追兵，在狗群赶到以前狠狠撕伤它。这样的事一次又一次发生。那些狗追得兴奋起来，便常常忘了分寸。白牙却从来不会忘。他一面飞跑，一面回头察看，始终准备着转身扑倒那个离同伴太远的追赶者。
        - id: ch01-b10
          speaker: narrator
          text: >-
            半大的狗天生就要玩耍，可眼前的处境，把它们的嬉戏变成了一场仿真的战争。追猎白牙成了它们最重要的游戏。这游戏会要命，也从来没有轻松的时候。白牙跑得最快，所以什么地方都敢去。他徒然等候母亲回来的那些日子里，常把整群狗引进附近的树林，领着它们狂奔。它们一次也没能抓住他。狗群的吠叫总会提前传来，白牙却独自无声地奔跑，柔软的脚掌落在地上，像一道穿过树林的影子，就像从前的父亲和母亲。他比那些狗更接近荒野，也更懂荒野里的秘密和计谋。白牙最爱踏进流水，让水冲掉自己的气味和踪迹。接着，他会安静地伏在附近的灌木丛中，听那些狗找不到他，在四周发出困惑的叫声。
        - id: ch01-b11
          speaker: narrator
          text: >-
            同类恨他，人也恨他。白牙永远不肯屈服，永远有人向他开战，而他也永远在向外还击。于是，他长得很快，却只朝着一个方向成长。这样的土地上，温情和爱意根本开不出花，他甚至不知道世上还有这样的东西。他学会的规矩只有一条，那就是服从强者，欺压弱者。灰海狸是神，又比他强，所以他服从。比他年幼、比他弱小的狗，则是应该毁掉的东西。
        - id: ch01-b12
          speaker: narrator
          text: >-
            白牙只朝力量的方向生长。受伤和死亡随时可能降临，他捕杀猎物、保护自己的本领也就被逼得过分强大。他比别的狗动作更敏捷，跑得更快，也更加狡猾，更加致命。他的身体更灵活，更精瘦，肌肉和筋腱像铁一样坚韧。他更能忍耐，也更残酷、更凶猛、更聪明。这些本领，他一样都不能少。只有变成这样，他才能在充满敌意的环境里守住自己，继续活下去。
