  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE OUTCAST
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Lip-lip went on making White Fang's life miserable. Under that constant torment, White Fang grew meaner and fiercer than his nature alone would have made him. He had always carried some wild savagery inside him, but now it grew far beyond what was natural. Even the people in camp began to know him for his wickedness.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Whenever fighting or uproar broke out, White Fang was usually mixed up in it. If dogs were squabbling, or a woman cried out over stolen meat, everyone expected to find him at the heart of the trouble. No one stopped to ask what had driven him there. They saw only the harm he caused. To them, he was a sneaking thief who stirred up trouble. Angry women called him a worthless wolf and promised him a bad end. He watched them closely as they spoke, ready to dodge anything they might throw.
        - id: ch01-b03
          speaker: narrator
          text: >-
            So White Fang became an outcast in the middle of the crowded camp. Every young dog followed Lip-lip's lead. White Fang was different from them, and perhaps they could sense the wild wolf blood in him. Whatever the reason, they joined Lip-lip in tormenting him. Once they had turned against him, they kept finding reasons to stay against him. Every one of them felt his teeth sooner or later. White Fang gave them more wounds than he received, and he could defeat many of them one at a time. But they never let him fight one at a time. As soon as a fight began, all the young dogs came running and threw themselves upon him.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Those pack attacks taught him two things that mattered greatly. He learned how to protect himself when many dogs fought him at once. He also learned how to do the most damage to one dog in the shortest possible time. Staying on his feet meant staying alive, and he became as sure-footed as a cat. A grown dog might strike him with its heavy body and send him flying sideways or backward. Yet whether he flew through the air or slid over the ground, his legs always came under him, with his feet pointing down toward the earth.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Most dogs begin a fight with warnings. They growl, raise their fur, and stalk around on stiff legs. White Fang learned to skip all that. Any delay gave the other young dogs time to reach him, so he had to strike and escape. He gave no sign before he attacked. He rushed in at once, snapping and slashing before the other dog could prepare. That was how he learned to cause a serious wound in an instant. He also learned how powerful surprise could be. A dog caught off guard, with its shoulder cut or its ear torn before it understood the danger, was already half beaten.
        - id: ch01-b06
          speaker: narrator
          text: >-
            A surprised dog was also easy to knock over. Once it fell, the soft underside of its neck lay open for a moment. That was the place to strike if White Fang meant to take its life. He knew this without being taught. Generations of hunting wolves had passed the knowledge down to him. His own attacks followed a simple pattern. He found a young dog alone, caught it by surprise, knocked it down, and drove his teeth toward the unprotected throat.
        - id: ch01-b07
          speaker: narrator
          text: >-
            White Fang was not fully grown, and his jaws were still too small and weak to make that throat attack deadly. Even so, many young dogs carried torn throats that showed exactly what he had tried to do. Then one day, at the edge of the woods, he caught an enemy alone. Again and again he knocked the dog down and attacked its throat. At last he cut a great vein, and the dog died.
        - id: ch01-b08
          speaker: narrator
          text: >-
            That night, the camp erupted. Someone had seen the killing and carried the news to the dead dog's master. The women remembered every piece of meat White Fang had stolen, and angry voices crowded around Grey Beaver. But Grey Beaver had shut White Fang inside his tepee. He stood firmly at the entrance and would not let his people take the revenge they demanded.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Now both people and dogs hated White Fang. Through this time in his life, he never felt safe for a moment. Every dog had teeth for him, and every person had a hand against him. His own kind greeted him with growls. His gods met him with curses and stones. He lived with every nerve pulled tight, always watching for an attack or some object thrown without warning. At any instant, he was ready to act. He could spring forward with flashing teeth, or leap away with a threatening snarl.
        - id: ch01-b10
          speaker: narrator
          text: >-
            No dog in camp, young or old, could snarl as terribly as White Fang. A snarl is meant to warn or frighten, but a dog must know the right moment to use it. White Fang knew both how and when. He could pour everything cruel, hateful, and dreadful in him into that sound. His nose twisted again and again. Waves passed through his raised fur. His tongue flicked out like a red snake, then vanished. His ears lay flat, hatred shone in his eyes, and his curled lips uncovered wet fangs.
        - id: ch01-b11
          speaker: narrator
          text: >-
            That sight could make almost any attacker hesitate. If White Fang had been surprised, even a brief pause gave him the moment he needed to judge what to do. Often, the hesitation lasted longer, until the attacker gave up completely. More than once, his snarl allowed him to retreat from a grown dog without losing his pride.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The pack of half-grown dogs had driven him out, but his bloody methods and quick attacks made them pay for it. Since he was not allowed to run with them, he made sure that none of them could safely run without the others. He hid in the brush and waited beside their paths, so the young dogs became afraid to go anywhere alone. Except for Lip-lip, they had to crowd together to protect themselves from the enemy they had created. A puppy found alone beside the river might die. Or it might race back into camp, shrieking in pain and terror, with White Fang close behind.
        - id: ch01-b13
          speaker: narrator
          text: >-
            White Fang did not end his revenge after the young dogs learned to stay together. He attacked whenever he caught one by itself, and the whole pack attacked whenever they found him together. The mere sight of White Fang sent them charging after him. Most times, his speed carried him safely away. But if one dog ran ahead of the others, that dog suffered for it.
        - id: ch01-b14
          speaker: narrator
          text: >-
            White Fang had learned to turn without warning on the dog leading the chase. Before the rest could catch up, he would knock that eager pursuer down and tear it badly. It happened often. Once the dogs were racing after him, excitement made them forget caution. White Fang never forgot. As he ran, he kept glancing behind him. He was always prepared to whirl around and bring down whichever dog had pulled too far ahead of the pack.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Young dogs must play, and the danger around them turned their play into a kind of pretend war. Chasing White Fang became their favorite game. Yet it was a deadly game, and they always played it seriously. White Fang was the fastest of them all, so he was not afraid to go wherever he pleased. While he waited and waited for his mother to return, he led the pack on wild chases through the nearby woods. They always lost him in the end.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Their barking and cries told White Fang where they were. He ran alone and made no sound, his feet soft against the ground. Like his mother and father before him, he moved as a shadow among the trees. He was closer to the Wild than the camp dogs were, and he knew more of its hidden ways. One of his favorite tricks was to run through water until his trail disappeared. Then he settled quietly into a nearby thicket while the confused pack cried out all around him.
        - id: ch01-b17
          speaker: narrator
          text: >-
            His own kind hated him, and so did the people. He would not surrender, though everyone fought him and he fought everyone in return. Because of that, he developed quickly, but only along one narrow path. This was no place for kindness or affection to grow. He did not understand such feelings at all.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The rule he learned was to obey whatever was strong and crush whatever was weak. Grey Beaver was a god, and Grey Beaver was strong, so White Fang obeyed him. A younger or smaller dog was weak, and therefore something to destroy. Everything in White Fang was growing toward power.
        - id: ch01-b19
          speaker: narrator
          text: >-
            He lived each day in danger of injury or death. To survive, every instinct for hunting and self-protection had to grow beyond its natural measure. He became quicker than the other dogs and faster over the ground. He grew more cunning and more deadly. His body became leaner and more flexible, with muscles and tendons as hard as iron. He could endure more, and he became more cruel, more ferocious, and more intelligent.
        - id: ch01-b20
          speaker: narrator
          text: >-
            White Fang had to become all of those things. Otherwise, he could never have held his place or survived in the hostile world around him.
