audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
    henry:
      display_name: Henry
      tts:
        delivery: practical and dry
        timbre: rugged and steady
        pace: unhurried
        pitch: low
    bill:
      display_name: Bill
      tts:
        delivery: wary and plainspoken
        timbre: rough and weathered
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE TRAIL OF THE MEAT
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A dark spruce forest stood on both sides of the frozen waterway. A recent wind had stripped the white frost from the trees. In the fading light, they leaned toward one another, black and threatening. A vast silence ruled the land. Nothing lived or moved across that lonely, frozen waste. Its spirit was colder than sadness. There was a hint of laughter in it, but not the laughter of joy. This laughter was more terrible than sorrow, as cold as the frost and as mirthless as the smile of the sphinx. It held the grim certainty of a truth that could never be escaped. It was as if the ancient wisdom of eternity were laughing at life, at every living thing that struggled to keep going. This was the Wild, the savage, frozen-hearted Northland Wild.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Yet there was life out there, struggling against it. A line of wolfish dogs labored down the frozen waterway. Frost edged their bristling coats. Each breath became a cloud of vapor, then settled on their fur as crystals. Leather harnesses and traces tied them to a sled dragging behind. The sled had no runners at all. It was built of strong birch-bark, and its whole broad bottom rested on the snow. The front curled upward like the end of a scroll. That curve forced its way beneath the soft snow, which rose and rolled before it like a wave.
        - id: ch01-b03
          speaker: narrator
          text: >-
            A long, narrow box was lashed firmly to the sled. There were other things aboard as well. Blankets, an axe, a coffee-pot, and a frying-pan all had their places. Yet the long box stood out above everything else and took up most of the room.
        - id: ch01-b04
          speaker: narrator
          text: >-
            One man moved ahead of the dogs on wide snowshoes. A second man struggled behind the sled. Inside the box lay a third man. His struggle was finished. The Wild had conquered him and beaten him down, and he would never move or fight again. The Wild does not welcome movement. Life itself is an offense to it because life means movement, and the Wild is always trying to bring movement to an end. It freezes water so it cannot run to the sea. It drives the sap from the trees until their great hearts freeze. Most fiercely of all, it hunts and crushes man. Man is the most restless living thing, forever rebelling against the law that every movement must finally stop.
        - id: ch01-b05
          speaker: narrator
          text: >-
            But the two living men kept on, one in front and one behind. They were not afraid, and they would not give in. Fur and soft-tanned leather covered their bodies. Frozen breath had crusted their lashes, cheeks, and lips so completely that no one could have made out their faces. They looked like ghostly masks. They seemed like undertakers carrying a ghost through a ghostly world. Under all that frost, though, they were men. They were entering a land of emptiness, mockery, and silence. They were tiny adventurers facing an enormous adventure, setting their strength against a world as distant, strange, and lifeless as the deepest reaches of space.
        - id: ch01-b06
          speaker: narrator
          text: >-
            They traveled without speaking. They needed every breath for the work of keeping their bodies in motion. The silence was everywhere. It felt like a real weight pressing on them, the way many layers of deep water press on a diver's body. The endless, unchanging vastness drove them back into the farthest corners of their minds. It squeezed away their false courage, their excitement, and their proud ideas about their own importance. They knew they were limited and small, no more than specks moving with a little skill and less wisdom among the great, blind forces of the world.
        - id: ch01-b07
          speaker: narrator
          text: >-
            One hour passed, then another. The pale light of that short, sunless day was already fading when a faint cry rose far away in the still air. It swept upward quickly until it reached one high, trembling note. The note held there, tight and tense, before slowly dying away. It might have been the wail of a lost soul, except that it carried a fierce sadness and the eager hunger of a hunter. The man in front turned his head until his eyes met the eyes of the man behind. Across the long, narrow box, each man nodded to the other.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Another cry pierced the silence, thin and sharp as a needle. Both men placed it at once. It came from somewhere behind them, across the wide stretch of snow they had already crossed. Then a third cry answered the second. That one also came from behind, but farther to the left.
        - id: ch01-b09
          speaker: henry
          text: They're following us, Bill.
        - id: ch01-b10
          speaker: narrator
          text: Henry's voice came out hoarse and unreal in that empty land. Even those few words seemed to take an effort.
        - id: ch01-b11
          speaker: bill
          text: Meat's hard to find. I haven't seen a rabbit track in days.
        - id: ch01-b12
          speaker: narrator
          text: >-
            After that, they said nothing more. Their ears stayed alert for every hunting cry that continued to rise behind them.
        - id: ch01-b13
          speaker: narrator
          text: >-
            When darkness fell, they turned the dogs into a group of spruce trees beside the waterway and made camp. They built their fire and used the coffin beside it as both seat and table. On the far side of the flames, the wolf-dogs stayed in a cluster. They snarled and quarreled among themselves, but not one of them showed the least desire to wander away into the darkness.
        - id: ch01-b14
          speaker: bill
          text: Henry, those dogs are staying mighty close to camp tonight.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Henry crouched over the fire and settled the coffee-pot with a piece of ice. He nodded, but said nothing yet. Only after he had taken his seat on the coffin and begun to eat did he answer.
        - id: ch01-b16
          speaker: henry
          text: They know where their hides are safe. Better to eat supper than be supper. Those dogs have sense.
        - id: ch01-b17
          speaker: narrator
          text: Bill slowly shook his head.
        - id: ch01-b18
          speaker: bill
          text: I don't know about that.
        - id: ch01-b19
          speaker: narrator
          text: Henry gave him a curious look.
        - id: ch01-b20
          speaker: henry
          text: Never heard you doubt their sense before.
        - id: ch01-b21
          speaker: narrator
          text: Bill took his time chewing his beans.
        - id: ch01-b22
          speaker: bill
          text: Did you notice how they carried on when I fed them?
        - id: ch01-b23
          speaker: henry
          text: They did make more trouble than usual.
        - id: ch01-b24
          speaker: bill
          text: How many dogs do we have, Henry?
        - id: ch01-b25
          speaker: henry
          text: We have six dogs.
        - id: ch01-b26
          speaker: bill
          text: >-
            Right. Six dogs. I took six fish from the bag and gave one to every dog. Then I found One Ear hadn't eaten, so I had to go back for another fish.
        - id: ch01-b27
          speaker: henry
          text: You counted wrong.
        - id: ch01-b28
          speaker: bill
          text: >-
            I'm telling you, we have six dogs. I pulled out six fish, but One Ear got none. I won't swear everything that ate was a dog, Henry, but seven of them got fish.
        - id: ch01-b29
          speaker: narrator
          text: Henry stopped eating. He looked across the fire and counted the dogs one by one.
        - id: ch01-b30
          speaker: henry
          text: There are only six now.
        - id: ch01-b31
          speaker: bill
          text: I saw the other one run away over the snow. There were seven. I saw them.
        - id: ch01-b32
          speaker: narrator
          text: Henry looked at him with pity.
        - id: ch01-b33
          speaker: henry
          text: I'll be almighty glad when this trip is done.
        - id: ch01-b34
          speaker: bill
          text: What's that supposed to mean?
        - id: ch01-b35
          speaker: henry
          text: This load is getting on your nerves. Now you're starting to see things.
        - id: ch01-b36
          speaker: bill
          text: >-
            I thought of that. So when I saw it run off, I checked the snow. Its tracks were there. Then I counted again, and all six dogs were still here. The tracks are out there now. Want me to show you?
        - id: ch01-b37
          speaker: narrator
          text: >-
            Henry did not answer. He went on chewing in silence until the meal was finished. Then he topped it off with one last cup of coffee. He wiped his mouth with the back of his hand before he finally spoke.
        - id: ch01-b38
          speaker: henry
          text: Then you think you know what it was?
        - id: ch01-b39
          speaker: narrator
          text: >-
            Before Henry could finish, a long wailing cry came from somewhere in the darkness. It was both savage and sad. Henry stopped and listened. Then he waved one hand toward the sound and completed his question.
        - id: ch01-b40
          speaker: henry
          text: Was it one of them?
        - id: ch01-b41
          speaker: narrator
          text: Bill nodded in firm agreement.
        - id: ch01-b42
          speaker: bill
          text: I'd sooner believe that than anything else. You heard the fuss the dogs made.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Cry followed cry, and answering cries came back from every side. Soon the silence had become an uproar. The dogs showed their fear by crowding together. They pressed so close to the fire that the heat began to scorch their fur. Bill threw on more wood before he lit his pipe.
        - id: ch01-b44
          speaker: henry
          text: You're sounding pretty low tonight.
        - id: ch01-b45
          speaker: narrator
          text: Bill drew thoughtfully on his pipe for a long while before speaking again.
        - id: ch01-b46
          speaker: bill
          text: >-
            Henry, I've been thinking. That fellow in the box is luckier than you or I will ever be.
        - id: ch01-b47
          speaker: narrator
          text: He showed whom he meant by pointing his thumb down at the box they were sitting on.
        - id: ch01-b48
          speaker: bill
          text: When we die, we'll be lucky if they pile enough stones over us to keep the dogs away.
        - id: ch01-b49
          speaker: henry
          text: >-
            We don't have his family or his money. You and I can't afford to have our funerals carried across the country.
        - id: ch01-b50
          speaker: bill
          text: >-
            That's what puzzles me. A man like him, some sort of lord back home, never short of food or blankets... why would he come wandering through the most Godforsaken end of the earth?
        - id: ch01-b51
          speaker: henry
          text: He might have reached a fine old age if he'd stayed home.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Bill opened his mouth to answer, then changed his mind. Instead, he pointed into the solid wall of darkness pressing around them. No shape could be seen in that complete blackness. There was only a pair of eyes shining like live coals. Henry nodded toward a second pair, then a third. A whole circle of bright eyes had formed around the camp. Now and then one pair moved. Sometimes a pair vanished, only to appear again a moment later.
        - id: ch01-b53
          speaker: narrator
          text: >-
            The dogs grew more restless by the moment. Then a sudden wave of fear sent them rushing to the near side of the fire. They cringed and crawled around the men's legs. In the scramble, one dog was knocked over at the edge of the flames. It yelped with pain and terror, and the smell of its singed coat filled the air. The commotion made the ring of eyes shift uneasily and draw back a little. As soon as the dogs grew quiet, the eyes settled into place again.
        - id: ch01-b54
          speaker: bill
          text: It's a cursed shame we're so short of ammunition.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Bill finished his pipe and helped Henry make their bed. Before supper, Henry had laid spruce boughs across the snow. Now the two men spread fur and blankets over them. Henry answered with a grunt and began unlacing his moccasins.
        - id: ch01-b56
          speaker: henry
          text: How many cartridges did you say were left?
        - id: ch01-b57
          speaker: bill
          text: >-
            Three. I wish it were three hundred. Then I'd teach those devils a lesson!
          emotion: angry
        - id: ch01-b58
          speaker: narrator
          text: Bill shook his fist angrily at the shining eyes. Then he placed his moccasins securely before the fire.
        - id: ch01-b59
          speaker: bill
          text: >-
            I wish this cold would break, too. It's been fifty below for two weeks. I wish I'd never started this trip, Henry. I don't like the look of things. Something feels wrong. Most of all, I wish this trip were finished and we were sitting by the fire at Fort McGurry, playing cribbage right now.
        - id: ch01-b60
          speaker: narrator
          text: Henry only grunted and crawled into bed. Just as he was beginning to doze, Bill's voice brought him back.
        - id: ch01-b61
          speaker: bill
          text: >-
            Henry, that strange one that came for a fish... why didn't our dogs attack it? That's what keeps troubling me.
        - id: ch01-b62
          speaker: henry
          text: >-
            You worry too much, Bill. You were never like this before. Now hush and sleep. You'll be fine in the morning. It's your stomach making you fret.
        - id: ch01-b63
          speaker: narrator
          text: >-
            The men slept side by side beneath the same covering, and their breathing grew heavy. The fire slowly died down. Around the camp, the circle of shining eyes crept closer. The dogs pressed tightly together in fear. Now and then they snarled a warning when one pair of eyes came too near.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Once the dogs made such a racket that Bill woke. Careful not to disturb Henry, he climbed out of bed and put more wood on the fire. As the flames rose, the circle of eyes moved farther back. Bill glanced casually at the dogs huddled together. Then he rubbed his eyes and studied them more sharply. At last he slipped under the blankets again.
        - id: ch01-b65
          speaker: bill
          text: Henry, wake up. Henry!
        - id: ch01-b66
          speaker: narrator
          text: Henry groaned himself awake.
        - id: ch01-b67
          speaker: henry
          text: What's wrong this time?
        - id: ch01-b68
          speaker: bill
          text: Nothing. Only there are seven again. I just counted them.
        - id: ch01-b69
          speaker: narrator
          text: Henry received the news with a grunt. The sound slid into a snore as he drifted back to sleep.
        - id: ch01-b70
          speaker: narrator
          text: >-
            In the morning, Henry woke first and shook Bill out of bed. It was already six o'clock, but daylight was still three hours away. In the darkness, Henry set about preparing breakfast. Bill rolled the blankets and made the sled ready so everything could be lashed down.
        - id: ch01-b71
          speaker: bill
          text: Henry, how many dogs did you say we had?
        - id: ch01-b72
          speaker: henry
          text: We have six dogs.
        - id: ch01-b73
          speaker: bill
          text: That's wrong.
        - id: ch01-b74
          speaker: henry
          text: Are there seven again?
        - id: ch01-b75
          speaker: bill
          text: No, there are five now. One is gone.
        - id: ch01-b76
          speaker: henry
          text: That can't be right!
          emotion: angry
        - id: ch01-b77
          speaker: narrator
          text: Henry cried out in anger. He abandoned the cooking, hurried over, and counted the dogs for himself.
        - id: ch01-b78
          speaker: henry
          text: You're right, Bill. Fatty's gone.
        - id: ch01-b79
          speaker: bill
          text: Once he started, he went like greased lightning. He vanished before you could blink.
        - id: ch01-b80
          speaker: henry
          text: >-
            He never had a chance. They swallowed him alive. I'll bet he was still yelping as he went down their throats, damn them!
          emotion: angry
        - id: ch01-b81
          speaker: bill
          text: Fatty was always a fool of a dog.
        - id: ch01-b82
          speaker: henry
          text: >-
            Even a foolish dog shouldn't be fool enough to run off and kill himself that way. Look at the rest of the team. I know their ways, and I bet not one of them would do it.
        - id: ch01-b83
          speaker: narrator
          text: Henry looked over the rest of the team. His practiced eye weighed the strongest traits of each animal at a glance.
        - id: ch01-b84
          speaker: bill
          text: You couldn't drive them away from this fire with a club. I always thought something was wrong with Fatty.
        - id: ch01-b85
          speaker: narrator
          text: >-
            And that was the epitaph they gave a dead dog on the Northland trail. Brief as it was, it said more than the epitaph of many another dog, and many another man.
