audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳克制，带着北地故事的冷峻感
        timbre: 低沉清晰，略带粗粝
        pace: 舒缓而有张力
        pitch: 中低
    henry:
      display_name: 亨利
      tts:
        delivery: 务实镇定，偶尔透出疲惫和不耐烦
        timbre: 厚实干涩
        pace: 平稳
        pitch: 中低
    bill:
      display_name: 比尔
      tts:
        delivery: 谨慎多虑，说话直率，紧张逐渐加深
        timbre: 沙哑偏薄
        pace: 稍慢，思索时有停顿
        pitch: 中
  chapters:
    - id: ch01
      title: 肉的踪迹
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            冰封的河道两边，幽暗的云杉林沉沉地逼视着。刚过去的风刮掉了枝头的白霜。暮色越来越深，黑黝黝的树木像是彼此压在一起，透着凶兆。
        - id: ch01-b02
          speaker: narrator
          text: >-
            无边的寂静统治着大地。这里荒芜、寒冷，没有生命，也没有一点动静。说它悲哀都还不够。它仿佛藏着一种笑，像斯芬克斯的笑一样毫无欢意，像冰霜一样冷酷，还带着绝不会出错的森严。仿佛那亘古而深不可测的智慧，正在嘲笑生命的徒劳，嘲笑生命为了活下去所做的一切挣扎。这就是荒原，野蛮、冷酷又无情的北国荒原。
        - id: ch01-b03
          speaker: narrator
          text: >-
            可这片土地上毕竟还有生命，而且正公然和它抗争。一长列狼一般的狗，沿着冰河艰难前行。它们蓬乱的毛边结满白霜，呼出的气刚离开嘴就冻成白雾，落回身上，又结成霜晶。
        - id: ch01-b04
          speaker: narrator
          text: >-
            狗身上套着皮挽具，皮索后面连着一架雪橇。雪橇没有滑板，是用结实的桦树皮做成的，整个底面贴着雪。前端卷起，好钻到松软的积雪下面，把雪推得像浪一样向前翻滚。
        - id: ch01-b05
          speaker: narrator
          text: >-
            车上牢牢捆着一只狭长的长方形箱子。旁边还有毯子、斧头、咖啡壶和平底锅。不过最显眼的，还是那只占去大半地方的箱子。
        - id: ch01-b06
          speaker: narrator
          text: >-
            狗群前面，一个男人踩着宽大的雪鞋，吃力地走。雪橇后面，另一个男人也在艰难跋涉。箱子里还躺着第三个男人。他的劳苦已经结束了。荒原征服了他，把他击倒了。从此，他再也不会动，也不会挣扎。
        - id: ch01-b07
          speaker: narrator
          text: >-
            荒原厌恶一切运动，因为生命就是运动，而它总想把运动毁掉。它冻住河水，不许河水奔向大海。它抽尽树里的汁液，直到粗壮的树心也冻得僵硬。它最凶猛也最可怕的手段，是追逼人，碾压人，逼人屈服。人偏偏是万物中最不安分的，总想反抗那条定律。到最后，一切运动都要归于静止。
        - id: ch01-b08
          speaker: narrator
          text: >-
            可一前一后这两个活着的男人不害怕，也不肯低头。他们仍旧艰难地走着，全身裹在毛皮和鞣软的皮革里。呼出的气结成霜，厚厚盖住睫毛、脸颊和嘴唇，让人看不清他们的模样。他们像戴上了鬼魅的面具，成了幽灵世界里的两个送葬人，正送另一个幽灵上路。
        - id: ch01-b09
          speaker: narrator
          text: >-
            可藏在这些东西下面的，终究是人。他们深入这片荒凉、沉寂又仿佛在嘲笑人的土地。两个渺小的冒险者，决意投进一场无比巨大的冒险，只靠自己的力量，对抗一个像太空深渊那样遥远、陌生、没有脉搏的世界。
        - id: ch01-b10
          speaker: narrator
          text: >-
            他们一句话也不说，把每一口气都留给走路。四面八方的寂静像是有了形体，压着他们的心神，就像深水一层层压住潜水人的身体。那无边无际、永不改变的威严沉沉压下来，把他们逼进各自心里最深的地方。
        - id: ch01-b11
          speaker: narrator
          text: >-
            人的热望、自负的激情，还有对自己过高的估量，都像葡萄里的汁一样被挤了出去。到最后，他们终于看清自己有多么有限，多么渺小。他们不过是几点微尘，只凭一点微不足道的机巧和少得可怜的智慧，在庞大而盲目的自然力量之间缓缓移动。
        - id: ch01-b12
          speaker: narrator
          text: >-
            一个钟头过去了，又一个钟头过去了。没有太阳的短短白昼只剩下一点惨淡的微光，也快要消失。就在这时，寂静的空气里升起一声微弱而遥远的嗥叫。
        - id: ch01-b13
          speaker: narrator
          text: >-
            那声音迅速冲高，到了最高处还在颤动，绷得紧紧的，久久不落。随后，它才慢慢低下去，终于消失。那声音像一个迷路的灵魂在哀号，只是里头还带着悲凉的凶狠和饥饿的急切。
        - id: ch01-b14
          speaker: narrator
          text: >-
            走在前面的男人回过头，正好迎上后面那个男人的目光。隔着狭长的箱子，两个人互相点了点头。
        - id: ch01-b15
          speaker: narrator
          text: >-
            第二声嗥叫又响了，像针尖一样刺穿寂静。两个人都听出了方向。声音就在他们身后，在刚刚走过的那片雪原里。紧接着，第三声回应也从后方传来，却是在第二声的左边。
        - id: ch01-b16
          speaker: henry
          text: 它们盯上咱们了，比尔。
        - id: ch01-b17
          speaker: narrator
          text: >-
            亨利的嗓音很嘶哑，在荒原上听起来虚幻又失真。仿佛只说出这几个字，也要花去很大的力气。
        - id: ch01-b18
          speaker: bill
          text: 肉越来越难找了。我好几天都没见过兔子的脚印。
        - id: ch01-b19
          speaker: narrator
          text: >-
            后来，他们再没开口，只竖着耳朵，听身后一声接一声传来的狩猎嗥叫。
        - id: ch01-b20
          speaker: narrator
          text: >-
            黑暗落下来时，他们把狗赶进河边的一簇云杉，扎下了营。棺材放在火边，既是凳子，也是桌子。狼狗挤在篝火另一边，彼此低吼争斗，却没有一只愿意走进黑暗。
        - id: ch01-b21
          speaker: bill
          text: 亨利，它们今晚是不是离营地特别近？
        - id: ch01-b22
          speaker: narrator
          text: >-
            亨利蹲在火边，用一块冰压稳咖啡壶，只点了点头。直到他坐到棺材上开始吃饭，才开口回答。
        - id: ch01-b23
          speaker: henry
          text: 它们知道待在哪儿才能保住皮。它们宁可吃东西，也不想变成别人的食物。这些狗聪明着呢。
        - id: ch01-b24
          speaker: narrator
          text: 比尔摇了摇头。
        - id: ch01-b25
          speaker: bill
          text: 那可不好说。
        - id: ch01-b26
          speaker: narrator
          text: 亨利诧异地看着他。
        - id: ch01-b27
          speaker: henry
          text: 我还是头一回听你说它们不聪明。
        - id: ch01-b28
          speaker: bill
          text: 亨利，我刚才喂狗的时候，它们闹得有多凶，你留意到了吗？
        - id: ch01-b29
          speaker: narrator
          text: 比尔慢吞吞嚼着豆子。
        - id: ch01-b30
          speaker: henry
          text: 是比平时闹得凶一些。
        - id: ch01-b31
          speaker: bill
          text: 咱们一共有几条狗，亨利？
        - id: ch01-b32
          speaker: henry
          text: 六条。
        - id: ch01-b33
          speaker: narrator
          text: >-
            比尔停了一会儿，好让下面的话显得更有分量。
        - id: ch01-b34
          speaker: bill
          text: 我刚才说过了，咱们有六条狗。我从袋里拿了六条鱼，一条狗一条。可喂到最后，鱼却少了一条。
        - id: ch01-b35
          speaker: henry
          text: 是你数错了。
        - id: ch01-b36
          speaker: bill
          text: 咱们就是六条狗。我也确实拿了六条鱼，可独耳没吃到。后来我又回到袋子那儿，另外拿了一条给它。
        - id: ch01-b37
          speaker: henry
          text: 咱们只有六条狗。
        - id: ch01-b38
          speaker: bill
          text: 可我不敢说吃鱼的全是狗。我只知道，当时有七个家伙吃到了鱼。
        - id: ch01-b39
          speaker: narrator
          text: >-
            亨利停下嘴，隔着火堆把狗数了一遍。
        - id: ch01-b40
          speaker: henry
          text: 现在明明只有六条。
        - id: ch01-b41
          speaker: bill
          text: 我亲眼看见多出来的那条从雪地上跑走了。我没看错，当时就是七条。
        - id: ch01-b42
          speaker: narrator
          text: 亨利带着怜悯看了看他。
        - id: ch01-b43
          speaker: henry
          text: 等这趟路走完，我可真得谢天谢地了。
        - id: ch01-b44
          speaker: bill
          text: 你这是什么意思？
        - id: ch01-b45
          speaker: henry
          text: 我是说，咱们拖着的这个东西快把你逼疯了。你已经开始看见根本不存在的东西啦。
        - id: ch01-b46
          speaker: bill
          text: 我也这么怀疑过。所以看见它从雪地上跑掉以后，我特意去查了。雪上真有它的脚印。我再数一遍，狗还是六条。脚印现在还留在那儿呢。你想不想去看看？我带你去。
        - id: ch01-b47
          speaker: narrator
          text: >-
            亨利没回答，只默默吃着。饭吃完后，他又喝尽最后一杯咖啡，才用手背擦了擦嘴。
        - id: ch01-b48
          speaker: henry
          text: 那你觉得，它是……
        - id: ch01-b49
          speaker: narrator
          text: >-
            黑暗里突然传来一声漫长的哀嗥，凶狠又悲凉，打断了他。亨利停下来听，然后朝声音传来的方向挥了挥手，才把问题问完。
        - id: ch01-b50
          speaker: henry
          text: 是它们当中的一只？
        - id: ch01-b51
          speaker: narrator
          text: 比尔点了点头。
        - id: ch01-b52
          speaker: bill
          text: 我宁愿相信是这样，也不愿往别处想。刚才狗闹得有多厉害，你也看见了。
        - id: ch01-b53
          speaker: narrator
          text: >-
            一声嗥叫刚落，又有一声回应。四面八方全是叫声，寂静一下变成了喧嚣。狗群吓得挤在一起，紧贴着篝火，连毛都被热气烤焦了。比尔又添了些木柴，这才点起烟斗。
        - id: ch01-b54
          speaker: henry
          text: 我看你有点泄气了。
        - id: ch01-b55
          speaker: narrator
          text: >-
            比尔若有所思地抽了很久，才再次开口。
        - id: ch01-b56
          speaker: bill
          text: 亨利，我刚才在想，箱子里那个人以后会比咱俩走运得多。
        - id: ch01-b57
          speaker: narrator
          text: >-
            他用拇指朝下一戳，指了指两个人坐着的箱子。
        - id: ch01-b58
          speaker: bill
          text: 等咱俩死的时候，要是还有人肯往尸首上堆足石头，不让狗吃掉，那就算走运了。
        - id: ch01-b59
          speaker: henry
          text: 可咱们不像他。他有亲朋，有钱，还有那些别的东西。把一个死人运上千里再安葬，咱俩可出不起这个钱。
        - id: ch01-b60
          speaker: bill
          text: 我就是想不通。这个人在自己的国家里是个勋爵，还是什么大人物。他从来不用发愁吃的和毯子，干吗偏要闯到这片连上帝都不管的天涯海角？我怎么也想不明白。
        - id: ch01-b61
          speaker: henry
          text: 他要是老实待在家里，本来能活到很老。
        - id: ch01-b62
          speaker: narrator
          text: >-
            比尔张开嘴想说话，最后又改了主意。他没出声，只伸手指向四周压过来的黑暗。那片彻底的漆黑里，什么形状也看不见，只有一双眼睛像燃烧的炭一样亮着。亨利用头示意第二双，又示意第三双。发亮的眼睛已经围着营地连成一圈。有时一双眼睛会挪动，或者突然消失，过一会儿又重新出现。
        - id: ch01-b63
          speaker: narrator
          text: >-
            狗群越来越不安，突然吓得一窝蜂冲到篝火这边。它们缩着身子，贴着地面，全挤在两个男人腿旁。混乱里，一条狗被撞倒在火堆边。它又疼又怕，尖叫起来，空气里立刻散开一股焦毛味。
        - id: ch01-b64
          speaker: narrator
          text: >-
            这一闹，那一圈眼睛不安地移动了一阵，还往后退了些。可是狗群刚安静下来，它们又回到了原处。
        - id: ch01-b65
          speaker: bill
          text: 偏偏赶上弹药不够，真他妈倒霉。
          emotion: angry
        - id: ch01-b66
          speaker: narrator
          text: >-
            比尔抽完烟斗，就帮亨利把毛皮和毯子铺在云杉枝上。晚饭前，亨利已经把这些树枝垫到了雪地上。他哼了一声，开始解鹿皮靴的鞋带。
        - id: ch01-b67
          speaker: henry
          text: 你说咱们还剩多少发子弹？
        - id: ch01-b68
          speaker: bill
          text: 三发。要是有三百发就好了。我非得让这群该死的东西吃点苦头！
          emotion: angry
        - id: ch01-b69
          speaker: narrator
          text: >-
            他冲那些发亮的眼睛愤怒地挥了挥拳，然后把鹿皮靴稳稳放在火边烤着。
        - id: ch01-b70
          speaker: bill
          text: 我还盼着这场严寒赶快过去。整整两个星期，天天都是零下五十度。我真希望自己从没走上这趟路，亨利。眼前这个样子让我很不舒服，总觉得有什么地方不对。既然都许愿了，那我还希望这趟路已经走完，咱俩现在正坐在麦格里堡的火炉边玩克里比牌。那才叫日子。
        - id: ch01-b71
          speaker: narrator
          text: >-
            亨利哼了一声，钻进了被窝。他刚迷迷糊糊睡着，比尔又叫醒了他。
        - id: ch01-b72
          speaker: bill
          text: 喂，亨利。那条混进来吃鱼的家伙，狗为什么不扑上去咬它？这事我怎么都想不通。
        - id: ch01-b73
          speaker: henry
          text: 你想得太多了，比尔。你以前可不是这样。现在闭上嘴，好好睡一觉。明早醒来，一切都没事了。是你的胃在冒酸水，才害得你胡思乱想。
        - id: ch01-b74
          speaker: narrator
          text: >-
            两个人盖着同一床铺盖，肩并肩睡沉了。火一点点低下去，营地四周那圈发亮的眼睛也越逼越近。狗群害怕地挤成一团。只要有一双眼睛靠近，它们就会发出威吓的低吼。
        - id: ch01-b75
          speaker: narrator
          text: >-
            有一回，狗群闹得太凶，把比尔惊醒了。他小心爬出被窝，没吵醒亨利，又往火里添了木柴。火焰猛地蹿起，那圈眼睛便向后退去。
        - id: ch01-b76
          speaker: narrator
          text: >-
            比尔随意看了一眼挤在一起的狗，接着揉揉眼睛，又仔细看了一遍。然后，他钻回毯子里。
        - id: ch01-b77
          speaker: bill
          text: 亨利。喂，亨利。
        - id: ch01-b78
          speaker: narrator
          text: 亨利呻吟一声，从睡梦里醒来，不耐烦地问他。
        - id: ch01-b79
          speaker: henry
          text: 又怎么了？
        - id: ch01-b80
          speaker: bill
          text: 没什么。不过现在又有七条了。我刚刚数过。
        - id: ch01-b81
          speaker: narrator
          text: >-
            亨利哼了一声，算是听见了。那一声哼很快变成鼾声，他又睡着了。
        - id: ch01-b82
          speaker: narrator
          text: >-
            清早，亨利先醒了。他把比尔从被窝里赶出去。虽然已经六点，离天亮却还有三个钟头。黑暗中，亨利忙着准备早饭，比尔卷起毯子，收拾雪橇，准备把行李捆好。
        - id: ch01-b83
          speaker: bill
          text: 喂，亨利。你说咱们原来有几条狗？
        - id: ch01-b84
          speaker: henry
          text: 六条。
        - id: ch01-b85
          speaker: bill
          text: 错了。
        - id: ch01-b86
          speaker: henry
          text: 怎么，又变成七条了？
        - id: ch01-b87
          speaker: bill
          text: 不是，是五条。有一条不见了。
        - id: ch01-b88
          speaker: henry
          text: 见鬼！
          emotion: angry
        - id: ch01-b89
          speaker: narrator
          text: >-
            亨利怒叫一声，丢下正在煮的东西，走过来数狗。
        - id: ch01-b90
          speaker: henry
          text: 你说得没错，比尔。胖子不见了。
        - id: ch01-b91
          speaker: bill
          text: 它跑起来快得像抹了油，一眨眼就没影了。
        - id: ch01-b92
          speaker: henry
          text: 它根本没有逃命的机会。那些家伙一定把它活吞了。我敢说，它从它们喉咙里滑下去的时候还在惨叫。
        - id: ch01-b93
          speaker: bill
          text: 胖子本来就是条傻狗。
        - id: ch01-b94
          speaker: henry
          text: 可狗就算再傻，也不会傻到自己跑出去送死。
        - id: ch01-b95
          speaker: narrator
          text: >-
            亨利打量着剩下的狗。每条狗最显眼的脾气，他一眼就看得出来。
        - id: ch01-b96
          speaker: henry
          text: 我敢说，别的狗绝不会这样干。
        - id: ch01-b97
          speaker: bill
          text: 就算拿棍子赶，它们也不会离开火堆。我一直觉得胖子有点不对劲。
        - id: ch01-b98
          speaker: narrator
          text: >-
            这就是一条死在北国雪道上的狗得到的墓志铭。它还不算最简薄的。另有许多狗，也有许多人，连这样一句墓志铭都得不到。
