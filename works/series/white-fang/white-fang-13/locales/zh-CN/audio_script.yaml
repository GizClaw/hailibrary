audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 第五章　契约
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            十二月过了大半，灰海狸沿麦肯齐河向上游远行，米特萨和克卢库奇跟他一起上路。灰海狸亲自驾一架雪橇，拉橇的是换来或借来的狗。米特萨赶着另一架小雪橇，七只幼犬套在前面。那东西更像玩具，不过米特萨喜欢得不得了。他觉得自己已经开始干男人的活儿，还能学习怎样驾驭和训练雪橇犬，幼犬也可以借机习惯挽具。小雪橇多少还有点用，上面载着将近两百磅的装备和食物。
        - id: ch01-b02
          speaker: narrator
          text: >-
            白牙看惯了营地里的狗套着挽具卖力拉橇，所以人们第一次给他套上挽具时，他并没有太过抗拒。他脖子上套着塞满苔藓的项圈。两条牵引带从那里连到另一条带子，绕过胸膛，再搭上后背。带子后面系着长绳，白牙就是用它拖动雪橇。
        - id: ch01-b03
          speaker: narrator
          text: >-
            七只幼犬里，别的狗都出生在这一年较早的时候，已经有九到十个月大，只有白牙才八个月。每只狗各拴一根绳，任意两根都不一样长，至少相差一只狗的身长。绳子全都汇到雪橇前端的铁环上。这架雪橇没有滑板，只用桦树皮做成平底，前端往上翘，不会一头扎进雪里。雪像水晶粉末一样松软，这种构造能把雪橇和货物的重量摊到更宽的雪面上。狗也从雪橇头部像一把扇子那样散开，各走各的雪地，谁都不会踩进同伴的脚印。
        - id: ch01-b04
          speaker: narrator
          text: >-
            扇形队列还有别的妙处。后面的狗若想偷袭前面的狗，长短不同的绳子会拦住它。它只能回过头，去扑绳子比自己短的同伴。可这一转身，它既要面对对方，也要面对赶橇人的鞭子。更妙的是，它越想追上前面的狗，就越要使劲拉橇。雪橇一快，前面的狗也跑得更快。后面的狗怎么也追不上。它跑得越快，被追的狗就逃得越快，其他狗也一齐加速。雪橇自然越来越快。人不动声色地用了这个巧计，把野兽驾驭得更加牢靠。
        - id: ch01-b05
          speaker: narrator
          text: >-
            米特萨很像灰海狸，父亲那份老成的智慧，他也得到了不少。他从前见过唇唇欺负白牙。那时唇唇是别人的狗，米特萨不敢怎么样，最多偶尔扔一块石头。如今唇唇归他了，他便把它套在最长的绳子上，报复它过去的所作所为。唇唇就这样成了领头狗，看上去像是得到全队中最显眼的一份荣耀，其实威风全丢光了。从前它是狗群里的恶霸和首领，如今却成了整群狗憎恨和欺负的对象。
        - id: ch01-b06
          speaker: narrator
          text: >-
            唇唇跑在最长的绳子尽头，所有狗抬眼就能看见它正在前面逃。映入他们眼里的，总是蓬松的大尾巴和飞奔的后腿。这副样子哪有竖起鬃毛、露出尖牙时那么吓人？何况狗天生就爱追赶逃跑的东西。他们一看唇唇往前奔，便觉得它是在逃避自己，立刻想追上去。
        - id: ch01-b07
          speaker: narrator
          text: >-
            雪橇才一动，橇队就追着唇唇跑起来，一追就是一整天。起初，唇唇还会因为威风受损，气冲冲地回头扑向追赶者。可米特萨立刻甩出那条三十英尺长的驯鹿肠鞭，狠狠抽向它的脸，逼它夹着尾巴继续逃。唇唇敢面对狗群，却不敢面对鞭子。它只能绷紧长绳，把自己的腰胁始终留在同伴的牙齿前面。
        - id: ch01-b08
          speaker: narrator
          text: >-
            米特萨还有更狡猾的办法。他故意偏爱唇唇，让狗群追赶领头狗时更加起劲。他当着其他狗的面，只拿肉给唇唇吃。这样的偏爱简直让他们发狂。狗群又妒又恨，气得在鞭子够不到的地方团团乱转。唇唇则在米特萨保护下吃肉。就算没有肉，米特萨也会把其他狗隔开，装作正在给唇唇喂食。
        - id: ch01-b09
          speaker: narrator
          text: >-
            白牙倒很喜欢拉橇。他早已比其他狗更彻底地服从诸神，也深知违抗诸神根本没有用。狗群曾经不断欺负他，这使同类在他心里越来越不重要，人的地位却越来越高。他从没学会依靠同类的陪伴，基奇也几乎被他忘了。他内心还能够表达出来的情感，几乎全都倾注在对主人的效忠上。于是白牙卖力做工，服从纪律，听从命令。狼和野狗被驯服以后，忠诚与勤勉缺一不可，而这两种品性在白牙身上尤其强烈。
        - id: ch01-b10
          speaker: narrator
          text: >-
            白牙和别的狗并不是毫无来往。只是他们之间只有争斗和仇恨。他从来不会跟同伴玩，只会跟他们厮杀，把唇唇当首领时自己受过的撕咬百倍奉还。唇唇早已算不上首领了，除了套在长绳尽头，领着同伴和身后颠簸的雪橇拼命奔逃。到了营地，它只能紧贴米特萨、灰海狸或克卢库奇，半步也不敢离开。所有狗的尖牙都对准了它。白牙当年受过的欺凌，如今让它彻彻底底尝了一遍。
        - id: ch01-b11
          speaker: narrator
          text: >-
            唇唇垮台以后，白牙本来可以统领狗群。可他太阴郁，也太孤僻。他只会狠揍同队的狗，平时连理都不理。他一走近，别的狗就赶快让路，胆子再大的也不敢抢他的肉。他们反而会拼命吞下自己那份，唯恐白牙过来夺走。白牙太懂那条规矩了，欺压弱者，服从强者。他飞快吃完自己的肉，再去看谁还没有吃完。一声低吼，尖牙一闪，那只倒霉的狗便只能对着冷漠的群星哀号，看白牙把它剩下的肉吃光。
        - id: ch01-b12
          speaker: narrator
          text: >-
            偶尔会有一只狗猛然反抗，可白牙马上就能把它制服。这种冲突倒叫他的身手一直保持敏锐。他十分珍惜自己在狗群里的那份孤独，不许任何同伴闯进来，因此常常要靠打斗守住它。每一场争斗都很短。白牙实在太快，对方还没弄清出了什么事，身上已经裂开伤口，流出血来。战斗仿佛还没有真正开始，就已经结束了。
        - id: ch01-b13
          speaker: narrator
          text: >-
            诸神怎样严厉管束橇队，白牙也怎样严厉管束同伴。他不许他们有半点放肆，逼他们时时刻刻敬畏自己。狗群彼此间爱做什么就做什么，那不关他的事。但他们必须让他独自清静。他要从中间走过，他们就得闪开，而且无论什么时候，都要承认他的地位。谁的腿稍稍僵直，嘴唇掀起一点，或是竖起一撮毛，他都会立刻扑上去，冷酷又迅速地让那只狗明白，它犯了大错。
        - id: ch01-b14
          speaker: narrator
          text: >-
            白牙成了一个凶暴可怕的专制者。他的统治像钢一样坚硬，对弱者尤其残酷。幼年时，他和母亲孤立无援，只能在无情的生存搏斗中抵抗荒野，终于活下来。那番经历没有白费。他也早早学会，遇到比自己强大的力量，就要悄然退让。这一点同样没有白费。他欺凌弱者，却敬重强者。跟随灰海狸长途跋涉时，他们会经过许多陌生人的营地。每逢置身那些成年狗中间，白牙总会小心走路，绝不轻易招惹他们。
        - id: ch01-b15
          speaker: narrator
          text: >-
            一个月又一个月过去，灰海狸仍在赶路。白牙每天在路上奔走许久，还要不停拉橇，身体越来越强壮。他的心智似乎也已经长成。他充分认识了自己生活的世界，眼光变得冷酷又实际。在白牙眼里，这世界凶狠而残暴，没有温暖，没有爱抚，也没有亲情。精神里那些明亮甜美的东西，他从未见过。
        - id: ch01-b16
          speaker: narrator
          text: >-
            白牙并不爱灰海狸。灰海狸虽然是神，却是个极其野蛮的神。白牙愿意接受他的统治，因为他有更高的智慧，也有更强的力量。白牙的天性里确实有某种东西渴望一个主人，否则当初他不会离开荒野，主动回来献上忠诚。这份统治也是他自己所求的。但他的性情里还有一些从未被触动的深处。灰海狸若肯温和地说一句话，伸手轻轻抚摸他，也许就能唤醒那些东西。可是灰海狸从不这样做，那不是他的性情。他只懂得野蛮的统治。他用棍棒主持公道，用击打的疼痛惩罚过错。对白牙做得好的奖赏，也不过是少打一棍。
        - id: ch01-b17
          speaker: narrator
          text: >-
            所以白牙一点也不知道，人的手原来可以给他一座天堂。他甚至不喜欢人形动物的手，见到它们总会警惕。在他看来，手是必须躲开的东西。手有时送来肉，可更常送来伤痛。它们会扔石块，会挥动木棍、大棒和鞭子，会扇他、打他。就算只是碰到他，也会又掐又拧又扯，想方设法叫他疼痛。在陌生村落里，孩子们的手也残忍地伤过他。有一次，一个刚会走路的印第安幼儿差点戳瞎他的眼睛。从那以后，白牙不再容许孩子靠近。只要他们伸着那双不祥的手走来，他就会马上起身避开。
        - id: ch01-b18
          speaker: narrator
          text: >-
            后来，在大奴湖畔的一个村子里，白牙为了反抗人形动物的手，不得不修改灰海狸教给他的一条法则。过去他知道，咬伤诸神是不可宽恕的大罪。那天，一个男孩正用斧头劈冻硬的驼鹿肉，肉屑不断飞落在雪上。白牙也照每个村子里所有狗的习惯，四处寻找食物，路过时便停下来吃那些碎屑。男孩放下斧头，拿起一根粗棍，迎头朝他打去。白牙及时跳开，男孩却追了上来。他是个初来乍到的陌生者，只能从两座圆锥帐篷之间逃跑，不料前面立着一道高高的土坡，他被堵进了死角。
        - id: ch01-b19
          speaker: narrator
          text: >-
            唯一的出口被男孩守住了。男孩举着棍子，一步步逼近，随时准备打下去。白牙怒火冲天，竖起全身的毛，正对男孩发出低吼。他懂得觅食的规矩。冻肉屑这样的废料，谁找到就归谁。他没有做错事，也没有破坏规矩，男孩却偏要打他。接下来的一切，白牙几乎来不及明白。怒火一下涌起，他便扑了上去。男孩也没看清发生了什么，只知道自己忽然倒进雪里，握棍的手已经被白牙的牙齿撕开。
        - id: ch01-b20
          speaker: narrator
          text: >-
            白牙却很清楚，自己已经违背诸神的法则。他的牙齿咬进了神圣的肉，只怕要受最可怕的惩罚。他逃到灰海狸身后，缩在那双保护他的腿边。挨咬的男孩和家人赶来报仇，但他们没能如愿。灰海狸护着白牙，米特萨和克卢库奇也站在他这边。白牙听双方激烈争吵，看他们愤怒地打着手势，终于知道自己做得没错。他这才明白，神也分不同的神。有些是他的神，有些不是，两者并不一样。自己的神无论公平与否，他都得承受。别的神要是不公，他却可以用牙齿反抗。这也是诸神定下的法则。
        - id: ch01-b21
          speaker: narrator
          text: >-
            当天还没过完，白牙又学到了更多。米特萨独自进森林捡柴，碰见挨咬的男孩和他的几个同伴。两边争吵起来，那些男孩一齐扑向米特萨。拳脚从四面八方落下，米特萨眼看就要招架不住。白牙起初只在旁边看。这是诸神之间的事，和他无关。可他很快认出，挨打的是米特萨，是自己的神。白牙没有思量，狂怒已经带着他跃进混战。五分钟后，男孩们全都四散奔逃，许多人流出的血一路滴在雪上，留下白牙利齿的证明。回到营地，米特萨讲完经过，灰海狸便吩咐人给白牙许多肉。白牙吃得饱饱的，昏昏欲睡地躺在火边。他知道，那条新法则已经得到了证实。
        - id: ch01-b22
          speaker: narrator
          text: >-
            这些经历又让白牙懂得了财产的法则，也懂得自己有责任守卫财产。从保护自己的神，到保护神所拥有的东西，中间只差一步，白牙很快便迈了过去。属于他的神的一切，都必须挡住整个世界，不许任何人碰。为了守住这些东西，哪怕咬伤别的神也在所不惜。这样做既像是亵渎神明，又十分危险。所有神都强大无比，一只狗根本不是对手。可白牙还是学会了迎面冲向他们，凶狠地战斗，不再害怕。责任压倒了恐惧。那些想偷东西的神也渐渐知道，灰海狸的财物碰不得。
        - id: ch01-b23
          speaker: narrator
          text: >-
            白牙很快还发现，小偷通常都很胆小，只要警报一响便会逃跑。他也看出，从自己示警到灰海狸赶来帮忙，中间只隔很短的工夫。小偷真正害怕的并不是白牙，而是灰海狸。白牙从不用吠叫示警，他根本不会吠叫。他只会直接扑向闯入者，只要够得着，就把牙齿扎进去。他阴郁而孤僻，从不和别的狗来往，反倒特别适合看守主人的财物。灰海狸也有意鼓励并训练这一本领。白牙因此变得更加凶猛，更不肯屈服，也更加孤独。
        - id: ch01-b24
          speaker: narrator
          text: >-
            几个月过去，狗与人之间的契约越系越紧。这份契约古老得很，第一头离开荒野、走到人身边的狼，就曾和人订立它。此后每一头作出同样选择的狼和野狗，都要亲自重新订立一次，白牙也不例外。条件其实很简单。为了拥有一个有血有肉的神，他交出了自由。神给他食物、火、保护和陪伴。他则看守神的财物，保护神的身体，为神做工，服从神的命令。
        - id: ch01-b25
          speaker: narrator
          text: >-
            有了一个神，就得为他服侍。白牙的服侍里有责任，也有敬畏，却没有爱。他不知道爱是什么，从来没有体验过。基奇已经成了遥远的记忆。他把自己交给人时，不只离开了荒野，也离开了自己的同类。按照那份契约，就算以后再次见到基奇，他也不会抛下自己的神，跟母亲离去。对人的忠诚，已经成了白牙天性中更强大的一条法则。它胜过自由，也胜过同类和亲族。
