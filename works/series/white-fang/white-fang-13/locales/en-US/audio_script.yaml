audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE COVENANT
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            December was well under way when Grey Beaver set out on a journey up the Mackenzie. Mit-sah and Kloo-kooch traveled with him. Grey Beaver drove one sled behind dogs he had traded for or borrowed. Mit-sah drove a second, smaller sled pulled by a team of puppies.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Mit-sah's sled was almost a toy, but he loved it. He felt he was beginning to do a man's work. He was learning how to drive dogs and train them, while the puppies were learning to work in harness. The little sled was useful, too. It carried nearly two hundred pounds of food and equipment.
        - id: ch01-b03
          speaker: narrator
          text: >-
            White Fang had watched the camp dogs labor in harness, so he did not resist much when his own harness first went on. A collar stuffed with moss circled his neck. Two traces ran from it to a strap around his chest and over his back. The long rope that joined him to the sled was fastened there.
        - id: ch01-b04
          speaker: narrator
          text: >-
            There were seven puppies on the team. The others had been born earlier that year and were nine or ten months old. White Fang was only eight months old. A separate rope tied each dog to the sled, and every rope had a different length. Between one rope and the next, there was at least the length of a dog's body.
        - id: ch01-b05
          speaker: narrator
          text: >-
            All the ropes met at a ring on the front of the sled. It had no runners. It was a birch-bark toboggan with its front turned upward so it would not dig beneath the snow. The broad bottom spread the load across as much snow as possible, which mattered because the snow was soft as crystal powder.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The dogs spread out from the nose of the sled like an open fan. That kept each one from stepping in another's tracks, and the different rope lengths served another purpose. A dog could not attack the one ahead from behind. He would have to turn toward the dog on the shorter rope, meeting both that dog's face and the driver's whip.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The cleverest part was this. If a dog tried to catch the one ahead, he had to pull harder and make the sled move faster. Then the dog he was chasing could run faster, too. The faster the pursuer ran, the faster his target ran, and every other dog ran faster with them. The whole team sped up, but the pursuer never caught the dog he wanted. In this roundabout way, the men made the dogs work harder and brought them further under control.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Mit-sah had much of his father's quiet wisdom. He remembered how Lip-lip had tormented White Fang. Back then, Lip-lip belonged to someone else, so Mit-sah had done no more than throw an occasional stone at him. Now Lip-lip was Mit-sah's dog, and Mit-sah took his revenge by fastening him to the longest rope.
        - id: ch01-b09
          speaker: narrator
          text: >-
            That made Lip-lip the leader, which looked like an honor. In truth, it stripped away every bit of his old importance. He had once bullied and ruled the pack. Now the pack hated him and hunted him.
        - id: ch01-b10
          speaker: narrator
          text: >-
            At the end of the longest rope, Lip-lip was always running away in full view of the others. They saw only his bushy tail and fleeing hind legs. That sight was far less frightening than his raised mane and shining teeth. To the dogs behind him, anything that ran away was something to chase.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The instant the sled started, the team raced after Lip-lip, and the chase lasted all day. At first, anger and wounded pride made him turn on his pursuers. Each time, Mit-sah snapped the stinging lash of his thirty-foot caribou-gut whip into Lip-lip's face. Lip-lip might have faced the pack, but he could not face the whip. He had to turn and run, keeping his rope tight and his flanks ahead of his teammates' teeth.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Mit-sah had an even sharper trick. He kept the pursuit alive by favoring Lip-lip over the other dogs. Before their eyes, he gave Lip-lip meat and no one else. The team raged just beyond the reach of his whip while Lip-lip ate under his protection. When Mit-sah had no meat, he held the dogs back and merely pretended to feed Lip-lip. Either way, their jealousy and hatred grew.
        - id: ch01-b13
          speaker: narrator
          text: >-
            White Fang took readily to the work. He had gone further than the other dogs in yielding to the rule of the gods, and he knew how useless it was to resist their will. The pack's persecution had also pushed other dogs lower in his world and raised men higher. He had never depended on his own kind for company. Kiche was almost forgotten. With so little else left for his feelings to reach toward, he gave his loyalty to the gods he had accepted as masters.
        - id: ch01-b14
          speaker: narrator
          text: >-
            So White Fang worked hard. He learned discipline and obeyed. He brought unusual faithfulness and willingness to his labor, the very qualities that wolves and wild dogs must have when they come under the rule of man.
        - id: ch01-b15
          speaker: narrator
          text: >-
            There was a bond between White Fang and the other dogs, but it was made of warfare and hatred. He had never learned to play with them. Fighting was all he knew, and he paid them back many times over for the bites and slashes they had given him when Lip-lip ruled the pack.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Lip-lip was a leader now only while he fled at the end of his rope with the sled bouncing behind him. In camp, he stayed close to Mit-sah, Grey Beaver, or Kloo-kooch. He dared not leave the protection of the gods. Every dog had turned against him, and he suffered the persecution that White Fang had once endured.
        - id: ch01-b17
          speaker: narrator
          text: >-
            With Lip-lip overthrown, White Fang might have taken command of the pack. But he was too grim and solitary to become its leader. He beat his teammates when they challenged him and ignored them the rest of the time. They moved aside whenever he came near. Not even the boldest dared steal his meat. Instead, they swallowed their own shares quickly, afraid that once White Fang had finished his portion, he would come and take what remained of theirs.
        - id: ch01-b18
          speaker: narrator
          text: >-
            White Fang understood the law. Oppress the weak and obey the strong. He ate his own meat as fast as he could. Then, if another dog had not finished, a snarl and a flash of teeth sent that dog howling its protest to the uncaring stars while White Fang ate the rest.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Now and then, one of the dogs flared into rebellion. White Fang crushed it at once, and each fight kept his skills sharp. He guarded the lonely space he kept around himself, and he fought often to preserve it. The fights never lasted long. He was too quick. Before the other dog truly knew the fight had begun, White Fang had cut it open and beaten it.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The gods ruled the sled team with rigid discipline, and White Fang ruled his fellows just as sternly. He never gave them the smallest freedom where he was concerned. They could do as they liked among themselves. He did not care. But they had to leave him alone, move out of his path whenever he chose to walk among them, and always admit that he was master over them. One stiff-legged challenge, one lifted lip, or one bristle of fur was enough. He sprang on the offender without mercy and swiftly taught it to give way.
        - id: ch01-b21
          speaker: narrator
          text: >-
            He became a monstrous tyrant, with a mastery as hard as steel. He took revenge on the weak. His cubhood had trained him for that. Back then, he and his mother had stood alone, with no help, and still survived the pitiless struggle of the Wild. Those days had taught him to crush what was weaker. They had also taught him to step softly whenever greater strength passed near. He oppressed the weak, but he respected the strong. During the long journey with Grey Beaver, he was careful indeed around the full-grown dogs in every strange camp they entered.
        - id: ch01-b22
          speaker: narrator
          text: >-
            The months went by, and Grey Beaver's journey continued. Long days on the trail and steady work at the sled made White Fang stronger. His mind developed along with his body until his understanding of life seemed almost fully formed. He knew his world well, and his view of it was plain and hard. To him, it was a bleak and brutal place. There was no warmth in it, no tenderness or affection, and none of the bright sweetness of the spirit.
        - id: ch01-b23
          speaker: narrator
          text: >-
            White Fang felt no affection for Grey Beaver. He accepted him as a god, but a savage one. Grey Beaver ruled because he had greater intelligence and greater physical strength. Something deep in White Fang wanted such a master. Otherwise, he would never have returned from the Wild and offered his loyalty.
        - id: ch01-b24
          speaker: narrator
          text: >-
            There were depths in White Fang that no one had ever reached. A kind word or the gentle touch of Grey Beaver's hand might have stirred them, but Grey Beaver gave neither. That was not his way. His place above White Fang depended on harsh rule, and harshly he kept it. He dealt out justice with a club and punished wrongdoing with painful blows. When White Fang did well, his only reward was that no blow fell.
        - id: ch01-b25
          speaker: narrator
          text: >-
            White Fang knew nothing of the heaven a human hand might hold for him. He distrusted the hands of the man-animals and did not like them. Sometimes they brought meat, but more often they brought pain. Hands threw stones, swung sticks, clubs, and whips, and struck him with slaps and blows. Even when they merely touched him, they knew how to pinch, twist, and wrench.
        - id: ch01-b26
          speaker: narrator
          text: >-
            In strange villages, children had hurt him with their cruel hands. Once, a small, stumbling child had nearly poked out one of his eyes. From all this, White Fang learned to distrust every child. He could not bear them. Whenever they approached with those threatening hands, he rose and moved away.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Then, in a village beside Great Slave Lake, the cruelty of human hands led him to change one of the laws Grey Beaver had taught him. Until then, he had believed that biting one of the gods was the one crime that could never be forgiven.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Like the other village dogs, White Fang went out looking for food. A boy was chopping frozen moose meat with an axe, and chips flew onto the snow. White Fang passed close by, saw the scraps, and stopped to eat them. Then he noticed the boy set down the axe and pick up a heavy club.
        - id: ch01-b29
          speaker: narrator
          text: >-
            White Fang leaped aside just before the club came down. The boy chased him. White Fang was a stranger there, and as he fled between two tepees, he found himself trapped against a high bank of earth. His only way out lay between the tepees, and the boy stood there blocking it.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The boy held the club ready and closed in on him. White Fang faced him, furious, with his fur raised and a snarl in his throat. His sense of justice had been outraged. He knew the law of foraging. Waste scraps like those frozen chips belonged to the dog that found them. He had done nothing wrong and broken no law, yet the boy meant to beat him.
        - id: ch01-b31
          speaker: narrator
          text: >-
            White Fang hardly knew what happened next. Rage surged through him, and he moved so fast that the boy did not understand it either. One moment the boy was standing over him. The next, he was sprawled in the snow, and White Fang's teeth had torn open the hand that held the club.
        - id: ch01-b32
          speaker: narrator
          text: >-
            But White Fang understood that he had broken the law of the gods. His teeth had entered the sacred flesh of one of them, and he expected a terrible punishment. He ran to Grey Beaver and crouched behind his legs. Soon the bitten boy and his family arrived, demanding revenge.
        - id: ch01-b33
          speaker: narrator
          text: >-
            They did not get it. Grey Beaver defended White Fang, and Mit-sah and Kloo-kooch stood with him. The argument went on around White Fang, full of angry words and threatening gestures. He could not follow it as a man would, but he watched and listened. The boy's family finally went away without its revenge, and White Fang understood that his own gods had judged his act to be right.
        - id: ch01-b34
          speaker: narrator
          text: >-
            That was how he learned that there were different kinds of gods. Some were his own, and some belonged to others. Whether his gods treated him justly or unjustly, he had to accept whatever came from their hands. But he did not have to accept injustice from strange gods. He was allowed to answer them with his teeth. This, too, was a law of the gods.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Before that day ended, White Fang learned more about the law. Mit-sah went alone into the forest to gather firewood and met the boy who had been bitten. Other boys were with him. Angry words passed between them, and then they all attacked Mit-sah. Blows struck him from every side, and he was losing the fight.
        - id: ch01-b36
          speaker: narrator
          text: >-
            At first, White Fang only watched. This was a matter among gods, and it had nothing to do with him. Then he understood that the boy under attack was Mit-sah, one of his own special gods. White Fang did not stop to reason. A wild rush of anger sent him leaping into the fight.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Five minutes later, boys were fleeing across the snow. Many left drops of blood behind them, proof that White Fang's teeth had been busy. Back in camp, Mit-sah told what had happened. Grey Beaver ordered that White Fang be fed, and ordered that he be given plenty. White Fang ate until he was full. As he grew sleepy beside the fire, he knew that the law had been proved true.
        - id: ch01-b38
          speaker: narrator
          text: >-
            These experiences led him to another lesson. He came to understand ownership and the duty to defend what was owned. Protecting his god's body led naturally to protecting his god's possessions. Whatever belonged to Grey Beaver had to be defended against the whole world, even if White Fang had to bite other gods to do it.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Biting a god was a fearful thing, almost a violation of everything White Fang had learned. It was dangerous, too. The gods were powerful, and no dog could match them. Yet White Fang learned to stand against them, fierce and unafraid, when they threatened what belonged to his own god. Duty became stronger than fear, and gods who came to steal learned to leave Grey Beaver's property alone.
        - id: ch01-b40
          speaker: narrator
          text: >-
            White Fang quickly discovered that a thieving god was usually a cowardly one who ran when the alarm was raised. He also learned that Grey Beaver would come to help soon after an alarm. The thief did not truly run from White Fang. He ran because he feared Grey Beaver.
        - id: ch01-b41
          speaker: narrator
          text: >-
            White Fang never raised that alarm by barking. He did not bark at all. Instead, he charged straight at the intruder and sank in his teeth whenever he could. He wasted no warning cries and gave a thief no time to remain. His grim, solitary nature kept him apart from the other dogs, leaving him free to watch what mattered to his master. That made him especially well suited to guard Grey Beaver's property. Grey Beaver encouraged and trained him in this work. As a result, White Fang grew fiercer, harder to defeat, and more alone than ever.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Month followed month, and the covenant between dog and man bound them ever more tightly. It was the ancient covenant first made when a wolf came in from the Wild and gave himself to man. Every wolf and wild dog that came after had entered the same bargain. Like all of them, White Fang had no one to explain it to him. He had to discover all its terms for himself through the life he lived beside the gods.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The terms were simple. White Fang gave up his freedom in exchange for the possession of a living god of flesh and blood. He belonged to the god, but the god also belonged to him. From that bond came food and fire, protection and companionship. In return, White Fang guarded the god's possessions, defended his body, worked for him, and obeyed him.
        - id: ch01-b44
          speaker: narrator
          text: >-
            To belong to a god meant that White Fang must serve. His service came from duty and awe, not love. He did not know what love was because he had never known its touch. Kiche had faded into a distant memory.
        - id: ch01-b45
          speaker: narrator
          text: >-
            When White Fang surrendered to man, he left behind both the Wild and his own kind. The covenant now reached so deeply into him that even if he met Kiche again, he would not leave his god to follow her. His loyalty to man had become a law within him, stronger than his love of freedom, stronger than kind and kin.
