audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
    scott:
      display_name: 威登·斯科特
      tts:
        delivery: 正直果断，愤怒时依然清醒
        timbre: 清朗坚实
        pace: 稳健有力
        pitch: 中低
    scott_father:
      display_name: 老斯科特
      tts:
        delivery: 稳重随和，偶尔流露长辈式的诙谐
        timbre: 浑厚清楚
        pace: 不疾不徐
        pitch: 低
    scott_mother:
      display_name: 威登的母亲
      tts:
        delivery: 慈爱而谨慎，忧虑时语气紧张
        timbre: 温和圆润
        pace: 从容
        pitch: 中
    beth:
      display_name: 贝丝
      tts:
        delivery: 活泼爽直，爱在家人谈笑时机敏插话
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高
    mary:
      display_name: 玛丽
      tts:
        delivery: 温和开朗，与家人相处自然亲切
        timbre: 柔亮清晰
        pace: 从容轻快
        pitch: 中
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 温柔敏锐，遇事时果断清醒
        timbre: 柔和清亮
        pace: 稳定自然
        pitch: 中
    surgeon:
      display_name: 外科医生
      tts:
        delivery: 专业坦率，面对家属时耐心温和
        timbre: 清晰沉稳
        pace: 从容准确
        pitch: 中
  chapters:
    - id: ch01
      title: 第五章　沉睡的狼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            就在这段日子里，报纸上到处都是一条骇人的新闻。一个名叫吉姆·霍尔的囚犯，竟从圣昆廷监狱逃了出来。这个人凶残得像一头食肉野兽。仿佛他出生时就没长对，后来交到社会手里，又被那双严酷的手越捏越坏。他正是社会亲手造出的怪物。
        - id: ch01-b02
          speaker: narrator
          text: >-
            在狱中，任何惩罚都不能让他屈服。他宁肯沉默着、发疯似的战斗到死，也不肯活着认输。他反抗得越凶，社会对他越狠，而这些残酷手段只会把他变得更凶。紧身衣、挨饿、拳打脚踢，还有警棍，这些明明都不是对待吉姆·霍尔的办法，他得到的却始终只有这些。从他还是旧金山贫民窟里一个柔弱的孩子起，社会就把他当成一团柔软的黏土，任意揉捏成自己想要的模样。
        - id: ch01-b03
          speaker: narrator
          text: >-
            第三次入狱时，吉姆碰上一个几乎和他一样野蛮的狱警。那人亏待他，向典狱长撒谎诬告，害他丢掉减刑积分，还处处迫害他。狱警有钥匙和左轮手枪，吉姆却只有双手和牙齿。有一天，他猛扑上去，像丛林野兽一样咬住了狱警的喉咙。
        - id: ch01-b04
          speaker: narrator
          text: >-
            从那以后，他在一间专关顽犯的铁牢房里，被关了整整三年。地板是铁，墙是铁，顶棚也是铁。他从没离开一步，看不见天空，也见不到一线阳光。白天只有昏暗的微光，夜里只剩漆黑的死寂。他像被活埋在铁坟里，没有一张人脸可看，也没有一个人能同他说话。食物从门洞推进来，他就像野兽一样咆哮。他恨世间的一切。有时一连几天几夜，朝整个宇宙吼出怒火。有时几星期、几个月不出一声，只让黑暗中的寂静一点点啃噬灵魂。他还是一个人，却也成了怪物，仿佛疯子的幻象里最可怕的恶兽。
        - id: ch01-b05
          speaker: narrator
          text: >-
            后来有一夜，他逃了。狱警说这绝不可能，可牢房确实空了，门口横着一具尸体，半截在里，半截在外。通往外墙的路上还有两名死去的狱警。为了不弄出声响，他们全是被吉姆徒手杀死的。
        - id: ch01-b06
          speaker: narrator
          text: >-
            吉姆带走死者的武器，成了一座逃进群山的活军火库。社会组织起来的全部力量都追在后面，还给他的脑袋悬下重赏。贪财的农场主提着霰弹枪出门，只盼他的血能还掉一笔抵押债，或供一个儿子读完大学。自认热心公益的公民也取下步枪，加入追捕。成群的猎犬循着他流血的脚印追踪，法律豢养的侦缉猎犬，那些拿钱替社会战斗的人，则借助电话、电报和专列，日夜紧咬不放。
        - id: ch01-b07
          speaker: narrator
          text: >-
            有时追捕者真会撞见他。有人英雄般迎面作战，也有人吓得慌忙逃命，连铁丝网都不顾一切地冲了过去。全州的人坐在早餐桌边读到这些消息，倒看得十分痛快。可每次交锋过后，总有死者和伤员被一车车运回城里。空出来的位置马上又有人补上，人人都急着参加这场猎人行动。
        - id: ch01-b08
          speaker: narrator
          text: >-
            后来，吉姆·霍尔忽然消失了。猎犬找不到中断的踪迹。偏远山谷里的牧场主会被持枪者拦住，逼着证明身份，而贪图赏金的人却在十几座山上先后声称找到了吉姆的尸体。
        - id: ch01-b09
          speaker: narrator
          text: >-
            山景庄园也天天读报。大家读这些消息，不是出于好奇，而是因为担忧。女人们都很害怕，老斯科特却嘴上嗤之以鼻，还拿这事说笑。可他实在没有轻松的理由。就在他离开法官席前的最后几天，吉姆曾站在他面前听候判刑，还在公开法庭上，当着所有人的面发誓，总有一天要找判他入狱的法官报仇。
        - id: ch01-b10
          speaker: narrator
          text: >-
            这一次，吉姆没有说错。他根本没犯那桩罪。用盗贼和警察的黑话说，有人把他“送上了快车”，硬生生栽进监狱，叫他替一件没做过的事服刑。因为已有两次前科，老斯科特判了他五十年。法官不知道警方设下了阴谋，不知道证据是捏造的、证词是伪造的，也不知道吉姆无罪。吉姆同样不知道法官只是受了蒙骗。他以为法官什么都清楚，还跟警方串通一气，亲手制造了这桩可怕的冤案。
        - id: ch01-b11
          speaker: narrator
          text: >-
            五十年生不如死的刑期一宣告，吉姆便憎恨起这个虐待他的社会里的一切，在法庭上狂怒咆哮，六个穿蓝制服的人合力才把他拖倒。在他眼里，法官正是撑住整座不义拱门的拱心石。他把所有怒火都倾泻到老斯科特身上，抛下一连串威胁，发誓将来一定报复。随后，他走进那座活坟，又从里面逃了出来。
        - id: ch01-b12
          speaker: narrator
          text: >-
            白牙对这一切毫不知情。他和主人的妻子爱丽丝倒有一个秘密。每晚，等山景庄园全都安静下来，所有人睡着以后，爱丽丝就会起床，把白牙悄悄放进屋，让他睡在宽敞的大厅里。白牙不是家犬，本来不许在房子里过夜，所以每天清早，她又会悄悄下楼，趁家里人还没醒，把他放到外面去。
        - id: ch01-b13
          speaker: narrator
          text: >-
            一天夜里，全屋的人都睡熟了，白牙却忽然醒来。他伏在那里，一动不动，安静地嗅着空气。气味带来一个消息，屋里出现了陌生的神。他的耳朵也捕捉到那人移动的细小声音。白牙没有狂吠，那不是他的作风。陌生人走得很轻，他跟得更轻，因为身上没有衣服摩擦皮肉。在荒野捕猎时，他面对过无比胆怯的活物，早就懂得，出其不意有多重要。
        - id: ch01-b14
          speaker: narrator
          text: >-
            陌生人停在大楼梯下倾听。白牙守在暗处，眼睛看着，耐心等着，浑身纹丝不动，仿佛已经死去。沿这道楼梯上去，就会走到爱的主人身边，也会走到主人最珍爱的一切身边。白牙竖起了全身的毛，却仍旧等待。陌生人终于抬起一只脚，开始上楼。就在那一刻，白牙无声地扑了出去。
        - id: ch01-b15
          speaker: narrator
          text: >-
            他腾空跃上那人的后背，前爪紧扣肩膀，獠牙咬进后颈。他挂住片刻，把人拖得向后倒下，两个身体一起砸上地板。白牙迅速跳开。陌生人刚挣扎着要起身，他又扑回去撕咬。
        - id: ch01-b16
          speaker: narrator
          text: >-
            整座山景庄园都在惊恐中醒来了。楼下像有二十个恶鬼打成一团。左轮手枪接连开火，一个男人因恐惧和剧痛发出一声惨叫。凶猛的咆哮与低吼混在一起，家具和玻璃不断碎裂、倒塌，发出的巨响盖过了所有声音。
        - id: ch01-b17
          speaker: narrator
          text: >-
            可这场骚动来得快，停得也快，前后还不到三分钟。家里人害怕地挤在楼梯顶端。楼下仿佛是一口漆黑的深渊，从里面传来咯咯的声音，像空气在水里冒泡。有时那声音又变得尖细，近似哨音，可很快也弱下去，彻底消失。最后，黑暗里只剩沉重的喘息，仿佛一个受伤极重的生命还在拼命争取空气。
        - id: ch01-b18
          speaker: narrator
          text: >-
            威登按下开关，楼梯和楼下大厅一下亮了起来。他和父亲各拿一把左轮手枪，小心地下楼。其实已经没有危险。白牙做完了他的事。倒塌破碎的家具中间躺着一个男人，身体微微侧着，一条胳膊遮住了脸。威登俯身挪开胳膊，把那张脸翻了过来。敞开的喉咙已经说明，他究竟是怎么死的。
        - id: ch01-b19
          speaker: scott_father
          text: “是吉姆·霍尔。”
        - id: ch01-b20
          speaker: narrator
          text: >-
            父子俩意味深长地彼此看了一眼，随后转向白牙。他也侧卧在地，眼睛闭着。两人俯下身时，他努力抬了抬眼皮，想要看清他们，尾巴也分明动了一下，却怎么也摇不起来。威登轻轻拍他，他用一声微弱的低吼回应主人的爱抚，很快又没了声音。眼皮重新垂下、合拢，整个身体仿佛彻底松开，扁平地贴在地板上。
        - id: ch01-b21
          speaker: scott
          text: “可怜的家伙，他怕是撑不住了。”
          emotion: sad
        - id: ch01-b22
          speaker: scott_father
          text: “能不能撑住，还得试过才知道。”
        - id: ch01-b23
          speaker: narrator
          text: >-
            老斯科特立刻走向电话。外科医生赶来，忙了一个半小时。天色渐亮，窗外的晨光让电灯暗了下去。除了孩子们，全家人都围在医生身边，等他说出结果。
        - id: ch01-b24
          speaker: surgeon
          text: >-
            “坦白说，他活下来的机会只有千分之一。一条后腿断了，三根肋骨折断，至少一根刺进了肺里。血差不多流光了，也很可能有严重内伤。他一定被人狠踩过，身上还有三处被子弹打穿的伤。说有千分之一，其实都太乐观了。他连万分之一的机会也没有。”
        - id: ch01-b25
          speaker: scott_father
          text: >-
            “那也不能放过任何可能救他的办法！费用不用考虑。给他照X光，什么方法都试。威登，马上发电报到旧金山，请尼科尔斯医生过来。医生，我不是不信任你，可我们得把每一个机会都给白牙。”
        - id: ch01-b26
          speaker: surgeon
          text: >-
            “我当然明白。白牙值得大家尽全力。照料他的时候，要像照料一个生病的人，像照料病孩子一样细心。还有，别忘了我说过的体温问题。我上午十点再来。”
          emotion: calm
        - id: ch01-b27
          speaker: narrator
          text: >-
            白牙真的得到了这样的护理。老斯科特提议请一名专业护士，姑娘们却气愤地齐声反对，谁也不肯把照料白牙的任务让给外人。她们亲自守着他，照顾他。医生认为连万分之一都没有的活命机会，最终竟被白牙牢牢抓住了。
        - id: ch01-b28
          speaker: narrator
          text: >-
            这也不能怪医生看错。他一辈子医治和开刀的，都是文明社会里养得娇嫩的人。这些人世世代代受到庇护，自己也一直过着有遮挡的生活。跟白牙相比，他们既脆弱又松软，抓住生命的手也没什么力气。白牙却直接来自荒野。那里没有谁能得到庇护，弱者早早就会死去。他的父亲、母亲都不软弱，再往前数的世世代代也一样。他继承了钢铁般的体魄和荒野的生命力。无论精神还是血肉，身体的每一个部分，都用远古生灵曾有的坚韧紧紧抓住生命。
        - id: ch01-b29
          speaker: narrator
          text: >-
            此后的许多个星期，白牙被石膏和绷带牢牢缚住，像个连动也不能动的囚犯，只能慢慢熬过日子。他一睡就是很久，也做了许多梦。北国的幻景化成一场没有尽头的游行，从脑海中不断经过。过去的幽灵全回来了，陪在他的身边。他又和吉切住进洞穴，又战战兢兢地爬到灰海狸膝前献上忠诚，也又一次被唇唇和那群狂吠乱叫的小狗追着拼命逃生。
        - id: ch01-b30
          speaker: narrator
          text: >-
            他梦见自己在寂静中奔跑，在饥荒的月份里追猎活食。他又跑在雪橇队最前面，米特萨和灰海狸在后方挥响生皮鞭。来到狭窄处，狗队像合拢的扇子挤成一列，身后传来“拉！拉啊！”的喊声。他还重新活过了落入比美·史密斯手中的日子，也打遍了从前每一场恶斗。每逢这时，他就在梦里呜咽低吼，守着他的人都说，这一定是噩梦。
        - id: ch01-b31
          speaker: narrator
          text: >-
            最折磨他的，是那些叮叮当当的电车。在梦里，它们成了山一般巨大、尖叫着喷火的猞猁。他伏在灌木后，等一只松鼠离开树的庇护，走到地面上足够远的地方。可等他扑出去时，松鼠会突然变成可怕的电车，山一样压在头顶，尖叫、撞响，还朝他喷出火焰。老鹰从蓝天俯冲下来，也会在落到他身上的一刻变成无处不在的电车。有时他又回到比美·史密斯的围栏里。人群在外面聚集，他知道又要打斗，便死死盯着门，等对手进场。可门一开，硬挤进来的还是电车。这样的梦发生了上千次，每一次唤起的恐惧，都和第一次一样鲜明而强烈。
        - id: ch01-b32
          speaker: narrator
          text: >-
            终于，最后一条绷带和最后一块石膏都拆掉了。那天像过节一样，山景庄园上上下下全都围在白牙身边。威登揉着他的耳朵，他便从喉咙里哼出充满爱意的低吼。爱丽丝叫他“受祝福的狼”，大家听了齐声赞同，所有女人立刻都喜欢上这个名字，也跟着这样叫他。
        - id: ch01-b33
          speaker: narrator
          text: >-
            白牙试着站起来，却虚弱得接连几次摔倒。他实在躺得太久，肌肉已经忘了怎样使力，身上的力量也消失了。他为自己的软弱感到羞愧，好像没有尽到服侍诸神的责任，叫他们失望了。于是，他一次次奋力挣扎，终于用四条腿站住，身体却仍旧摇摇晃晃，前后摆动。
        - id: ch01-b34
          speakers: [alice, beth, mary, scott_mother]
          ensemble: chorus
          text: “受祝福的狼！”
          emotion: happy
        - id: ch01-b35
          speaker: narrator
          text: 老斯科特得意地看着她们。
        - id: ch01-b36
          speaker: scott_father
          text: “这可是你们亲口说的。跟我一直讲的一样，普通的狗做不到这些。他就是狼。”
        - id: ch01-b37
          speaker: scott_mother
          text: “是一头受祝福的狼。”
        - id: ch01-b38
          speaker: scott_father
          text: “对，受祝福的狼。以后我也这么叫他。”
        - id: ch01-b39
          speaker: surgeon
          text: “他还得重新学走路，不如现在就开始吧。不会伤着他的，把他带到外面去。”
        - id: ch01-b40
          speaker: narrator
          text: >-
            于是，白牙被带到屋外，像一位国王出行。山景庄园所有人都簇拥在他身边，围着他，小心照料他。他仍然很虚弱，刚走上草坪，就不得不卧下来休息了一会儿。随后，这支队伍又继续向前，慢慢朝马厩走去。白牙每动一下，沉睡已久的肌肉里便多出一小股力气，血液也开始在其中奔流，四条腿渐渐找回了力量。
        - id: ch01-b41
          speaker: narrator
          text: >-
            到了马厩，他们看见柯莉卧在门口，六只胖乎乎的小狗崽正在她身边晒着太阳玩耍。白牙满眼惊奇地望着它们。柯莉发出警告的低吼，他就谨慎地待在远处。威登用脚尖帮了一把，把一只笨拙爬行的小狗崽轻轻推向他。白牙怀疑地竖起毛，主人却告诉他，一切都好。柯莉被一个女人抱在怀里，仍嫉妒地盯住白牙，低吼着警告他，事情才没那么简单。
        - id: ch01-b42
          speaker: narrator
          text: >-
            小狗崽摇摇摆摆地爬到白牙面前。他竖起耳朵，好奇地看着这个小东西。两只鼻子碰在一起，小狗温暖的小舌头舔过他的面颊。白牙也伸出舌头，连自己都不知道为什么，就轻轻舔了舔小狗的脸。
        - id: ch01-b43
          speaker: narrator
          text: >-
            诸神高兴地拍手欢呼。白牙吃了一惊，困惑地望着他们。接着，虚弱又占了上风，他卧下来，竖着耳朵，头偏向一边，继续观察那只小狗。其余几只也摇摇晃晃地爬过来。柯莉厌恶极了，白牙却庄重地容许它们爬上自己的身体，在他身上跌跌撞撞。起初，听着诸神的喝彩，他还有一点从前的拘谨和笨拙。可小狗们继续嬉闹、扑抓，这点不自在也慢慢消失了。他耐心地半闭着眼，躺在温暖的阳光下打起盹来。
