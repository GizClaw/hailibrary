  chapters:
    - id: ch01
      title: THE SLEEPING WOLF
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Around this time, every newspaper carried the story of a convict who had made a daring escape from San Quentin. His name was Jim Hall, and he was a savage man. Something in him had been wrong from birth, and society had done nothing to set it right. Its hands had been harsh from the beginning. Jim Hall showed what those hands could make of a human being. He had become a beast, and a deadly one.
        - id: ch01-b02
          speaker: narrator
          text: >-
            In prison, nothing could control him. Punishment could not break his spirit. He could fight in silence until he died, but he could not submit and go on living. The harder he fought, the more cruelly society treated him, and that cruelty only made him fiercer. Straitjackets, starvation, beatings, and clubs were exactly the wrong treatment. Still, that was what he got. It had been that way since he was a soft little boy in a San Francisco slum, ready to be shaped by the world around him.
        - id: ch01-b03
          speaker: narrator
          text: >-
            During his third prison term, Jim met a guard who was nearly as brutal as he was. The guard treated him unfairly. He lied to the warden, cost Jim the credits he had earned, and tormented him. But the guard had keys and a revolver, while Jim had only his bare hands and his teeth. One day Jim leaped on him and tore at his throat like an animal from the jungle.
        - id: ch01-b04
          speaker: narrator
          text: >-
            After that, they put Jim in the cell for prisoners they could not control. He stayed there for three years. Iron made up the floor, the walls, and the roof. He never left it. He never saw the sky or felt the sun. Day brought only dim half-light, and night became a black silence. He was buried alive inside an iron tomb.
        - id: ch01-b05
          speaker: narrator
          text: >-
            No human face came before him, and he had no one to speak to. Whenever food slid through the opening, he growled like a wild animal. He hated everything. For whole days and nights, he roared his anger at the universe. Then weeks or months would pass without a sound while the darkness ate into him. He was both a man and something monstrous, as terrible as any creature in a madman's nightmare.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Then, one night, he escaped. The guards said escape was impossible, but the iron cell stood empty. A dead guard lay across its doorway, half inside and half outside. Two more bodies marked Jim's path through the prison to the outer walls. He had killed them with his hands so there would be no gunshots.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Jim took the dead guards' weapons and fled through the hills, armed like a moving arsenal. All the organized power of society followed him. There was a rich reward for his capture, and greedy farmers came out with shotguns. His blood might pay off a mortgage or put a son through college. Other citizens reached for their rifles and joined the chase in the name of public duty. Bloodhounds tracked his bleeding feet. Behind them came the law's paid hunters, using telephones, telegraphs, and special trains to stay on his trail by day and night.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Sometimes the hunters found him. Some men stood and fought bravely. Others crashed through barbed-wire fences as people across the state read every thrilling detail over breakfast. After each clash, the dead and wounded were carried back to town, and fresh men eagerly took their places in the manhunt.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Then Jim Hall vanished. The bloodhounds searched, but the trail was gone. Armed men stopped harmless ranchers in lonely valleys and forced them to prove who they were. Meanwhile, greedy men claimed to have found Jim's remains on one mountainside after another, hoping to collect the reward.
        - id: ch01-b10
          speaker: narrator
          text: >-
            At Sierra Vista, the family read the news with more fear than curiosity. The women were frightened. Judge Scott laughed the danger away, though he had good reason not to. In his final days on the bench, Jim Hall had stood before him to be sentenced. There in the open courtroom, Jim had sworn that one day he would take revenge on the judge.
        - id: ch01-b11
          speaker: narrator
          text: >-
            This time, Jim Hall had been innocent. The police had framed him for a crime he did not commit. Because he already had two convictions, Judge Scott sentenced him to fifty years in prison.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The judge did not know about the police conspiracy. He did not know the evidence had been invented or that witnesses had lied. Jim, in turn, did not know that the judge was simply unaware. He believed Judge Scott understood everything and had helped the police carry out the injustice.
        - id: ch01-b13
          speaker: narrator
          text: >-
            When Judge Scott pronounced fifty years of living death, Jim rose in fury. He raged through the courtroom until six uniformed officers dragged him down. To Jim, the judge held the whole structure of injustice together. He poured all his anger on him and promised revenge. Then Jim Hall went away to his living death, and escaped.
        - id: ch01-b14
          speaker: narrator
          text: >-
            White Fang knew none of this. But he and Alice, his master's wife, shared a secret. Every night, after everyone at Sierra Vista had gone to bed, she got up and let White Fang into the great hall to sleep. He was not a house dog, and the family did not allow him indoors at night. So each morning, Alice slipped downstairs early and let him out before anyone woke.
        - id: ch01-b15
          speaker: narrator
          text: >-
            One night, with the whole house asleep, White Fang woke and lay perfectly still. He tested the air and caught the message of a strange man's presence. Then he heard the stranger moving. White Fang did not burst into furious barking. That was not his way. The man stepped softly, but White Fang moved more softly still. No clothes brushed against his body to betray him. He followed without a sound. In the Wild, he had hunted creatures that startled at the smallest noise, and he understood the power of surprise.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The stranger stopped at the foot of the great staircase and listened. White Fang watched and waited without moving, as still as death. Those stairs led to the love-master and everyone the love-master held dear. White Fang's fur rose, but still he waited. Then the stranger raised one foot and began to climb.
        - id: ch01-b17
          speaker: narrator
          text: >-
            That was when White Fang struck. He gave no warning and no snarl. He sprang through the air and landed on the man's back. His forepaws locked around the man's shoulders, and his fangs sank into the back of the man's neck. White Fang held on just long enough to pull him over backward. They crashed to the floor together. Then White Fang leaped aside. As the man fought to rise, the slashing fangs came at him again.
        - id: ch01-b18
          speaker: narrator
          text: >-
            All Sierra Vista woke in terror. Downstairs, it sounded as if twenty demons were fighting. Revolver shots cracked through the house. A man screamed once in horror and pain. Snarls and growls rose over the smashing of furniture and breaking of glass.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Then, almost as suddenly as it began, the uproar ended. The fight had lasted no more than three minutes. The frightened family gathered at the top of the stairs. From the darkness below came a wet, choking sound, like air bubbling through water. At times it sharpened almost into a whistle. That sound soon stopped too. Only the heavy panting of a creature desperate for breath came up from the black hall.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Weedon Scott pressed a button, and light flooded the staircase and hall. He and Judge Scott went down carefully, each holding a revolver. But there was no longer any need for caution. White Fang had finished his work. Broken furniture lay everywhere. In the middle of the wreckage, a man lay partly on his side with one arm over his face. Weedon bent down, moved the arm, and turned the face toward the light. The terrible wound in the man's throat showed how he had died.
        - id: ch01-b21
          speaker: scotts_father
          text: “Jim Hall.”
        - id: ch01-b22
          speaker: narrator
          text: >-
            Father and son exchanged a meaningful look. Then they turned toward White Fang. He was lying on his side too. His eyes were closed, though the lids lifted a little as he tried to see them bending over him. His tail stirred in a useless effort to wag. Weedon stroked him, and a low growl rumbled in answer. It was very weak and quickly faded. His eyes fell shut again, and his whole body seemed to loosen and sink flat against the floor.
        - id: ch01-b23
          speaker: weedon_scott
          text: “He's finished, poor fellow.”
          emotion: sad
        - id: ch01-b24
          speaker: scotts_father
          text: “We don't know that yet.”
        - id: ch01-b25
          speaker: narrator
          text: >-
            Judge Scott went straight to the telephone.
        - id: ch01-b26
          speaker: surgeon
          text: “To be honest, he has one chance in a thousand.”
        - id: ch01-b27
          speaker: narrator
          text: >-
            The surgeon had worked on White Fang for an hour and a half. Dawn was coming through the windows now, and the electric lights had begun to look dim. Everyone in the family except the children stood around him, waiting for his judgment.
        - id: ch01-b28
          speaker: surgeon
          text: >-
            “His hind leg is broken. Three ribs are broken, and at least one has pierced a lung. He's lost nearly all the blood in his body, and there may be serious damage inside. Something must have jumped on him. Then there are the three bullets that passed straight through him. Even one chance in a thousand is too hopeful. He hasn't one chance in ten thousand.”
        - id: ch01-b29
          speaker: scotts_father
          text: >-
            “Then we must give him every chance there is. I don't care what it costs. Use the X-ray. Do anything that may help. Weedon, send a telegram to Doctor Nichols in San Francisco at once. I mean no disrespect to you, Doctor, but White Fang must have every possible advantage.”
        - id: ch01-b30
          speaker: narrator
          text: >-
            The surgeon smiled with patient understanding.
        - id: ch01-b31
          speaker: surgeon
          text: >-
            “I understand completely. He deserves everything we can do. Nurse him as carefully as you would a sick child, and remember what I told you about his temperature. I'll come back at ten.”
        - id: ch01-b32
          speaker: narrator
          text: >-
            White Fang got that careful nursing. Judge Scott suggested hiring a trained nurse, but the girls refused at once. They would care for him themselves. And White Fang survived on the one chance in ten thousand that the surgeon had said was not his.
        - id: ch01-b33
          speaker: narrator
          text: >-
            No one could blame the surgeon for judging wrongly. All his life, he had treated and operated on civilized human beings. They lived sheltered lives, just as many generations before them had done. Beside White Fang, they were soft and frail. They clung to life, but there was little strength in their grip.
        - id: ch01-b34
          speaker: narrator
          text: >-
            White Fang had come straight from the Wild, where weakness dies young and no one is promised shelter. There had been no weakness in his father or mother, nor in the generations before them. He had inherited an iron body and the life force of the Wild. In flesh and spirit, every part of him held on with the ancient strength that had once belonged to all living creatures.
        - id: ch01-b35
          speaker: narrator
          text: >-
            The weeks dragged on. Plaster casts and bandages held White Fang down like a prisoner and denied him even the smallest movement. He slept for long hours, and he dreamed. An endless procession of Northland visions passed through his mind. The ghosts of his past came back and lived beside him.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Once more, he was in the lair with Kiche. Once more, he crept trembling to Grey Beaver's knees and offered his obedience. Again he fled from Lip-lip and the whole howling pack of puppies.
        - id: ch01-b37
          speaker: narrator
          text: >-
            He ran through the silence again, hunting living food in the hungry months. Then he was leading the sled team, with the rawhide whips of Mit-sah and Grey Beaver snapping behind him. Their voices shouted as the trail narrowed, and the team folded together like a fan to squeeze through.
        - id: ch01-b38
          speaker: narrator
          text: >-
            He lived through his days with Beauty Smith again, and through every fight he had fought. At those times he whimpered and snarled in his sleep. The people watching him knew his dreams were bad.
        - id: ch01-b39
          speaker: narrator
          text: >-
            One nightmare came more often than any other. It was filled with the clanking monsters of the electric railway, which seemed to him like enormous screaming lynxes. In one dream, he hid behind a screen of bushes and waited for a squirrel to move far enough from the safety of its tree. The instant he sprang, the squirrel changed into an electric car. It towered above him like a mountain, shrieking, clanging, and spitting fire.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Another time, he challenged a hawk as it dropped from the blue sky. While it rushed down, it too became the terrible electric car. Or he found himself back in Beauty Smith's pen. Men gathered outside, and White Fang knew a fight was coming. He watched the gate for his enemy. It opened, and the dreadful electric car came in at him. The dream returned a thousand times, and its terror was always as sharp as the first time.
        - id: ch01-b41
          speaker: narrator
          text: >-
            At last, the day came when the final bandage and plaster cast were removed. It was a day of celebration. Everyone at Sierra Vista gathered around. Weedon rubbed White Fang's ears, and White Fang crooned his love-growl. Alice called him the Blessed Wolf. The women loved the name, and soon all of them were calling him the Blessed Wolf.
        - id: ch01-b42
          speaker: narrator
          text: >-
            White Fang tried to stand, but after several attempts, weakness pulled him down. He had lain still for so long that his muscles had forgotten their work, and all their strength was gone. He felt ashamed, as if his weakness meant he was failing the gods he ought to serve. So he forced himself to try again. At last he stood on all four legs, trembling and swaying.
        - id: ch01-b43
          speakers: [alice, scotts_mother, woman_1]
          ensemble: chorus
          text: “The Blessed Wolf!”
          emotion: happy
        - id: ch01-b44
          speaker: narrator
          text: >-
            Judge Scott looked at the women with triumph.
        - id: ch01-b45
          speaker: scotts_father
          text: >-
            “You've said it yourselves. It's what I've argued all along. No ordinary dog could have done what he did. He's a wolf.”
        - id: ch01-b46
          speaker: scotts_mother
          text: “A Blessed Wolf.”
        - id: ch01-b47
          speaker: scotts_father
          text: >-
            “Yes, a Blessed Wolf. That is what I shall call him from now on.”
        - id: ch01-b48
          speaker: surgeon
          text: >-
            “He'll need to learn how to walk again, so he may as well begin now. It won't harm him. Take him outdoors.”
        - id: ch01-b49
          speaker: narrator
          text: >-
            They took him out like a king, with all Sierra Vista surrounding him and caring for him. He was terribly weak. When he reached the lawn, he lay down and rested.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Then the little procession moved on. Each step sent the blood through White Fang's legs, and brief sparks of strength returned to muscles that had lain useless for so long. Slowly, with the family still gathered around him, he made his way to the stables. Collie lay in the doorway there, and six round puppies played in the sunshine around her.
        - id: ch01-b51
          speaker: narrator
          text: >-
            White Fang stared in wonder. Collie gave him a warning snarl, and he kept his distance. Weedon used his toe to ease one sprawling puppy toward him. White Fang's fur rose with suspicion, but his master assured him that everything was safe. One of the women held Collie in her arms. Collie watched jealously and snarled that nothing about this was safe at all.
        - id: ch01-b52
          speaker: narrator
          text: >-
            The puppy sprawled to a stop in front of White Fang. He lifted his ears and watched it with curiosity. Their noses met. A small warm tongue touched his cheek. White Fang did not know why, but his own tongue came out, and he licked the puppy's face.
        - id: ch01-b53
          speaker: narrator
          text: >-
            The gods clapped and cried out with pleasure. White Fang looked at them, surprised and puzzled. Then his weakness returned, and he lay down again. With his ears raised and his head tilted to one side, he watched the puppy.
        - id: ch01-b54
          speaker: narrator
          text: >-
            To Collie's great disgust, the other puppies came sprawling toward him. White Fang solemnly allowed them to climb and tumble all over him. At first, while the gods applauded, some of his old awkwardness and self-consciousness returned. But as the puppies kept playing and pawing at him, it passed away.
        - id: ch01-b55
          speaker: narrator
          text: >-
            White Fang lay there with patient eyes half closed, drowsing in the sun.
