audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    young_princess:
      display_name: 小公主
      tts:
        delivery: 温柔善良，身处恐惧时仍显出坚定与勇气
        timbre: 清澈柔和
        pace: 适中
        pitch: 中高音
    crow_prince:
      display_name: 乌鸦王子
      tts:
        delivery: 真诚郑重，受苦时低沉，重获自由后温暖喜悦
        timbre: 年轻醇厚
        pace: 稍缓
        pitch: 中低音
    elder_sister:
      display_name: 姐姐
      tts:
        delivery: 好奇急切，受惊时慌乱尖锐
        timbre: 明亮清晰
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 玫瑰丛里的乌鸦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有三位公主，个个年轻美丽。小公主的容貌并不比两个姐姐更出众，可她最惹人疼爱。
        - id: ch01-b02
          speaker: narrator
          text: 离她们的宫殿约半英里，有一座无人居住的城堡，破得几乎要倒了。城堡四周的花园却开满鲜花，小公主常常到那里散步。
        - id: ch01-b03
          speaker: narrator
          text: 一天，她在椴树下来回走着，一只黑乌鸦从玫瑰丛里跳到她面前。它浑身是伤，还流着血。善良的小公主看见这副模样，心里难过极了。乌鸦知道她在怜惜自己，便开口说话。
        - id: ch01-b04
          speaker: crow_prince
          text: 我并不是真的乌鸦。我是一位中了魔法的王子，只能在苦难中度过青春。公主，你若愿意，就能救我。不过，你得告别亲人，搬到这座破城堡里，一直陪着我。
        - id: ch01-b05
          speaker: crow_prince
          text: 城堡里只有一个房间还能住，里面有一张金床。你必须独自住在那里。无论夜里看见什么、听见什么，都千万不能叫。只要喊出一声，我受的苦就会加倍。
        - id: ch01-b06
          speaker: narrator
          text: 小公主没有迟疑。她离开家人，匆匆赶到破城堡，住进了那间摆着金床的房间。
    - id: ch02
      title: 金床上的考验
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 天黑以后，公主躺上金床，紧紧闭着眼睛，却一点睡意也没有。到了午夜，她忽然听见有人沿着走廊走来，吓得心都提了起来。
        - id: ch02-b02
          speaker: narrator
          text: 房门猛地打开，一群模样古怪的怪物闯进来。它们先在大壁炉里点起火，再把一口盛满滚水的大锅架到火上。
        - id: ch02-b03
          speaker: narrator
          text: 接着，它们朝床边围过来。公主浑身发抖。怪物们不停地尖叫号哭，把她从床上拖下来，一直拖向那口大锅。她几乎吓死，却始终没发出半点声音。
        - id: ch02-b04
          speaker: narrator
          text: 就在这时，雄鸡突然啼叫。所有恶灵一眨眼便消失了。
        - id: ch02-b05
          speaker: narrator
          text: 乌鸦随即飞进房间，欢喜得绕着屋子跳个不停。它诚心诚意地向公主道谢。
        - id: ch02-b06
          speaker: crow_prince
          text: 谢谢你这样善待我。今晚过后，我受的苦已经轻了许多。
        - id: ch02-b07
          speaker: narrator
          text: 公主有个姐姐，好奇心特别重。她打听清楚事情的经过，便跑到破城堡里探望妹妹，还一再央求，要和妹妹在金床上住一夜。
        - id: ch02-b08
          speaker: elder_sister
          text: 求求你，就让我陪你一晚吧。我一定要看看夜里到底会发生什么。
        - id: ch02-b09
          speaker: narrator
          text: 小公主心软，最后答应了。可一到午夜，那群怪物刚刚现身，姐姐便吓得尖叫起来。从那以后，小公主再也不让任何人留下，夜里只肯独自守候。
        - id: ch02-b10
          speaker: narrator
          text: 她白天孤零零地过日子，夜晚又要面对那些可怕的事。若不是那么勇敢，她早就撑不住了。乌鸦每天都会来看她，感谢她忍受这一切，也告诉她，自己的痛苦一天比一天轻。
    - id: ch03
      title: 最后一年的苦难
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两年就这样过去了。一天，乌鸦来到公主面前，告诉她最后还要做一件事。
        - id: ch03-b02
          speaker: crow_prince
          text: 再过一年，七年的期限就满了，我也能摆脱魔法。可在我恢复本来的样子、继承祖先的产业以前，你得离开这里，到外面的世界给人当女仆。
        - id: ch03-b03
          speaker: narrator
          text: 公主马上答应下来。此后的整整一年，她都在别人家里做女仆。她虽然年轻美丽，主人待她却很坏，让她吃了许多苦。
        - id: ch03-b04
          speaker: narrator
          text: 一天傍晚，她正在纺亚麻。那双纤白的小手已经累得抬不起来。忽然，身边传来窸窣的响声，还有一声欢喜的呼喊。
        - id: ch03-b05
          speaker: narrator
          text: 公主抬起头，看到一位英俊的年轻人站在身旁。年轻人跪到她脚下，轻轻亲吻她疲惫的双手。
        - id: ch03-b06
          speaker: crow_prince
          text: 我就是那位王子。那时我变成黑乌鸦，到处流浪，受尽折磨，是你的善良救了我。现在跟我回城堡吧，让我们在那里幸福地生活。
    - id: ch04
      title: 一百年的幸福
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 于是，他们回到那座曾让两人受尽痛苦的城堡。可到了那里，他们几乎认不出眼前的地方。残破的城堡已经重新建好，里里外外都修葺一新。
        - id: ch04-b02
          speaker: narrator
          text: 他们就在那里生活了一百年。整整一百年，都充满了欢乐与幸福。
