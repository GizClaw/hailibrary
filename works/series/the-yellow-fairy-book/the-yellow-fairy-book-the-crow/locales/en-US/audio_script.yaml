audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, clear, and quietly cautionary
        timbre: gentle and resonant
        pace: measured
        pitch: medium
    crow_prince:
      display_name: The Crow Prince
      tts:
        delivery: earnest and grateful, growing joyful when freed
        timbre: rich and youthful
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Crow in the Garden
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there were three young and beautiful Princesses. The youngest was no fairer than her sisters, but she was the most lovable of them all.
        - id: ch01-b02
          speaker: narrator
          text: About half a mile from their palace stood an empty castle that had nearly fallen into ruin. No one lived there, yet the garden around it was a mass of blooming flowers. The youngest Princess often went there to walk among them.
        - id: ch01-b03
          speaker: narrator
          text: One day, as she paced beneath the lime trees, a black crow hopped from a rosebush in front of her. The poor creature was torn and bleeding. The kind Princess was deeply troubled at the sight. Then the crow turned to her and spoke.
        - id: ch01-b04
          speaker: crow_prince
          text: I am not truly a black crow. I am an enchanted Prince, doomed to spend my youth in misery. You could save me, Princess, if you chose to. But you would have to leave your family and stay beside me in this ruined castle.
        - id: ch01-b05
          speaker: crow_prince
          text: One room can still be lived in, and there is a golden bed inside. You must live there alone. Whatever you see or hear at night, you must not cry out. A single scream from you would double my suffering.
        - id: ch01-b06
          speaker: narrator
          text: The good Princess left her home and said goodbye to her family at once. She hurried to the ruined castle and made the one habitable room, with its golden bed, her home.
    - id: ch02
      title: The Nights in the Ruined Castle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: As night drew near, the Princess lay down on the golden bed. She shut her eyes tightly, but sleep would not come. At midnight, she heard someone moving along the passage. A moment later, to her horror, the door flew wide open and a troop of strange beings entered her room.
        - id: ch02-b02
          speaker: narrator
          text: At once, they lit a fire in the great fireplace and set an enormous cauldron of boiling water over it. When that was done, they came toward the bed. Screaming and yelling all the while, they dragged the trembling girl toward the cauldron. She nearly died of fright, but she never made a sound.
        - id: ch02-b03
          speaker: narrator
          text: Suddenly, a cock crowed, and every evil spirit vanished. At that same moment, the crow appeared. He hopped joyfully around the room and thanked the Princess with all his heart. Because of her goodness, he told her, his suffering had already grown much lighter.
        - id: ch02-b04
          speaker: narrator
          text: One of the Princess's elder sisters was very curious. She discovered what had happened and came to visit the ruined castle. She begged so earnestly to share the golden bed for one night that the kind young Princess finally agreed.
        - id: ch02-b05
          speaker: narrator
          text: But when the strange beings appeared at midnight, the elder sister screamed in terror. After that failed night, the youngest Princess insisted on keeping watch alone. She would never let anyone share the golden bed again.
        - id: ch02-b06
          speaker: narrator
          text: She spent each day in solitude. At night, she might have been frightened if she had not been so brave. Every day the crow came to thank her for enduring it all, and he assured her that his suffering was far less than before.
    - id: ch03
      title: A Year of Service
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Two years passed. Then one day, the crow came to the Princess with news.
        - id: ch03-b02
          speaker: crow_prince
          text: In one more year, the spell upon me will break, for my seven years will be over. But before I can take my true form again and claim what belonged to my forefathers, you must go into the world and serve as a maid.
        - id: ch03-b03
          speaker: narrator
          text: The young Princess agreed at once and went out into the world. For a whole year, she served as a maid. Though she was young and beautiful, the people she served treated her very badly, and she endured one hardship after another.
        - id: ch03-b04
          speaker: narrator
          text: One evening, she sat spinning flax. She had worked until her small white hands were weary. Then she heard a rustle beside her, followed by a joyful cry. A handsome young man stood there. He knelt at her feet and kissed her tired hands.
    - id: ch04
      title: The Prince Returns
      blocks:
        - id: ch04-b01
          speaker: crow_prince
          text: I am the Prince you freed from terrible torment through your goodness, when I wandered in the form of a black crow. Come with me now to my castle, and we will live there happily together.
          emotion: happy
        - id: ch04-b02
          speaker: narrator
          text: Together they returned to the castle where they had both endured so much. But when they arrived, it was hard to believe this was the same ruined place. The whole castle had been rebuilt and made beautiful again.
        - id: ch04-b03
          speaker: narrator
          text: And there they lived for a hundred years, a hundred years of joy and happiness.
