  chapters:
    - id: ch01
      title: Five Horses on Sunday
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In one village lived two men with the same name. Both were called Klaus. One owned four horses, so people called him Big Klaus. The other owned only one, and they called him Little Klaus. Now listen to what happened to them, for this is a true story.
        - id: ch01-b02
          speaker: narrator
          text: All week long, Little Klaus had to plow for Big Klaus and lend him his only horse. In return, Big Klaus lent Little Klaus his four horses on Sundays, but only then. So on Sunday, Little Klaus had five horses before his plow, and he cracked his whip with delight.
        - id: ch01-b03
          speaker: narrator
          text: The sun shone brightly. Church bells rang from the towers, and people in their best clothes walked past with hymn books under their arms. They were going to hear the minister preach. Whenever they looked toward the field, Little Klaus felt grander than ever.
        - id: ch01-b04
          speaker: little_klaus
          text: Gee-up, my five horses!
        - id: ch01-b05
          speaker: big_klaus
          text: You must not call them that. Only one of those horses belongs to you.
        - id: ch01-b06
          speaker: narrator
          text: Little Klaus meant to remember. But the moment another person passed, he forgot.
        - id: ch01-b07
          speaker: little_klaus
          text: Gee-up, my five horses!
        - id: ch01-b08
          speaker: big_klaus
          text: You had better stop. Say it once more, and I will strike your horse on the head so hard that it will fall dead where it stands.
          emotion: angry
        - id: ch01-b09
          speaker: little_klaus
          text: I truly won't say it again!
        - id: ch01-b10
          speaker: narrator
          text: Then more people came by and nodded good morning. Little Klaus saw how fine his field looked with five horses crossing it. Happiness carried away his promise. He cracked his whip once more.
        - id: ch01-b11
          speaker: little_klaus
          text: Gee-up, my five horses!
        - id: ch01-b12
          speaker: big_klaus
          text: Then I will take care of your horses!
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: Big Klaus seized an iron bar and struck Little Klaus's one horse on the head. The poor animal dropped down and died at once.
        - id: ch01-b14
          speaker: little_klaus
          text: Oh, no! Now I have no horse at all!
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: Little Klaus began to cry. He had lost the only horse he owned. Afterward, he removed the horse's skin and spread it out to dry. When it was ready, he folded the skin into a sack, slung the heavy bundle over his shoulder, and set off for town. He hoped to sell the skin there.
        - id: ch01-b16
          speaker: narrator
          text: The road was long and led through a great dark forest. A dreadful storm rose around him. Little Klaus lost his way, and night fell before he found the road again. There was no hope of reaching town until morning.
    - id: ch02
      title: The Wizard in the Sack
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: A large farmhouse stood before him. Its shutters were closed, though light shone through the cracks. Little Klaus thought he might be allowed to spend the night there, so he knocked. The farmer's wife opened the door.
        - id: ch02-b02
          speaker: little_klaus
          text: Could you please let me stay here tonight?
        - id: ch02-b03
          speaker: narrator
          text: When the woman heard what he wanted, she refused. Her husband was away, she said, and she would not admit a stranger.
        - id: ch02-b04
          speaker: little_klaus
          text: Then I suppose I must sleep outside.
        - id: ch02-b05
          speaker: narrator
          text: The door shut in his face. Close beside the house stood a tall haystack. Between the haystack and the farmhouse was a small outbuilding with a flat roof of thatch. It offered some shelter from the storm, but a live stork stood on the roof beside its nest.
        - id: ch02-b06
          speaker: little_klaus
          text: I can sleep on that roof. It will make a splendid bed, as long as the stork doesn't fly down and bite my legs.
        - id: ch02-b07
          speaker: narrator
          text: Little Klaus climbed onto the outbuilding and settled down. The shutters on the house windows did not quite meet at the top, so he could see into the room.
        - id: ch02-b08
          speaker: narrator
          text: Inside, a great table was covered with wine, roast meat, a beautiful fish, and delicious cakes. The farmer's wife sat there with the sexton. She filled his glass while he helped himself to the fish, his favorite dish.
        - id: ch02-b09
          speaker: little_klaus
          text: If only I could have some of that feast!
        - id: ch02-b10
          speaker: narrator
          text: Then Little Klaus heard a rider coming along the road. It was the farmer returning home. He was a worthy man in most ways, but he had one strange peculiarity. He could not bear the sight of a sexton, and seeing one drove him wild. The sexton knew this. That was why he had chosen to visit the farmer's wife while her husband was away, and why she had dared to serve him her finest food.
        - id: ch02-b11
          speaker: narrator
          text: At the sound of the farmer's approach, they both became frightened. The wife begged the sexton to hide in a large empty chest. He climbed inside at once. Then she hurriedly hid the food and wine in her oven. If her husband saw them, he would demand an explanation.
        - id: ch02-b12
          speaker: little_klaus
          text: Oh, dear! All that wonderful food is disappearing!
        - id: ch02-b13
          speaker: farmer
          text: Is somebody up there? Why are you lying on that roof? Come into the house with me.
        - id: ch02-b14
          speaker: narrator
          text: Little Klaus climbed down and explained that he had lost his way. He asked if he might stay for the night.
        - id: ch02-b15
          speaker: farmer
          text: Of course you may. But first, we must get something to eat!
        - id: ch02-b16
          speaker: narrator
          text: The farmer's wife welcomed them kindly now. She set out a long table and brought each man a large plate of porridge. The hungry farmer ate eagerly. Little Klaus could only think about the fish, roast meat, cakes, and wine hidden in the oven.
        - id: ch02-b17
          speaker: narrator
          text: The sack containing the dry horse skin lay beneath his feet. The porridge tasted poor beside the feast he had seen, so he pressed his foot onto the sack. The skin gave a loud squeak.
        - id: ch02-b18
          speaker: little_klaus
          text: Hush now!
        - id: ch02-b19
          speaker: narrator
          text: He trod on the sack again, and this time the dry skin squeaked even louder.
        - id: ch02-b20
          speaker: farmer
          text: What's that in your sack?
        - id: ch02-b21
          speaker: little_klaus
          text: Oh, that's a wizard. He says we shouldn't eat porridge. He has filled the whole oven with roast meat, fish, and cakes for us.
        - id: ch02-b22
          speaker: farmer
          text: Goodness me!
          emotion: surprised
        - id: ch02-b23
          speaker: narrator
          text: The farmer opened the oven and found every tempting dish his wife had hidden. He believed the wizard had conjured it all. His wife could say nothing. She placed the food on the table, and they ate the fish, the roast meat, and the cakes.
        - id: ch02-b24
          speaker: narrator
          text: Little Klaus pressed the sack once more. Again, the horse skin squeaked.
        - id: ch02-b25
          speaker: farmer
          text: What is the wizard saying now?
        - id: ch02-b26
          speaker: little_klaus
          text: He says he has conjured three bottles of wine for us too. They are standing in the corner beside the oven.
        - id: ch02-b27
          speaker: narrator
          text: The wife had to bring out the wine she had hidden. The farmer drank and grew very merry. More than anything, he wanted a wizard like the one in Little Klaus's sack.
        - id: ch02-b28
          speaker: farmer
          text: Can your wizard conjure up the Devil? I would like to see him now, while I'm in such good spirits.
        - id: ch02-b29
          speaker: little_klaus
          text: My wizard can do anything I ask. Isn't that so?
        - id: ch02-b30
          speaker: narrator
          text: He stepped on the sack and made it squeak.
        - id: ch02-b31
          speaker: little_klaus
          text: There, did you hear him? He says yes. But he warns that the Devil is so ugly, you may not want to look at him.
        - id: ch02-b32
          speaker: farmer
          text: I'm not afraid. What does the Devil look like?
        - id: ch02-b33
          speaker: little_klaus
          text: He will appear in the shape of a sexton.
        - id: ch02-b34
          speaker: farmer
          text: Then he must be ugly! I can't bear the sight of a sexton. Still, if I know it's the Devil, I won't mind. I'm ready to see him, as long as he doesn't come too close.
        - id: ch02-b35
          speaker: little_klaus
          text: I will ask my wizard.
        - id: ch02-b36
          speaker: narrator
          text: Little Klaus pressed the sack and bent his ear toward it.
        - id: ch02-b37
          speaker: farmer
          text: Well? What does he say?
        - id: ch02-b38
          speaker: little_klaus
          text: He says to open the chest in the corner. You will see the Devil crouching inside. But hold the lid tightly, or he may escape.
        - id: ch02-b39
          speaker: farmer
          text: Will you help me hold him?
        - id: ch02-b40
          speaker: narrator
          text: The farmer approached the chest where his wife had hidden the real sexton. The man inside was trembling with fear. The farmer raised the lid just a little and looked in.
        - id: ch02-b41
          speaker: farmer
          text: Ugh! I saw him! He looked exactly like our sexton. What a horrible sight!
          emotion: fearful
        - id: ch02-b42
          speaker: narrator
          text: After that, the farmer needed another drink. They kept drinking far into the night.
    - id: ch03
      title: The Chest on the Bridge
      blocks:
        - id: ch03-b01
          speaker: farmer
          text: You must sell me that wizard. Name your price. I will give you a whole bushel of money this very moment.
        - id: ch03-b02
          speaker: little_klaus
          text: No, I really can't sell him. Just think of everything this wizard can give me.
        - id: ch03-b03
          speaker: narrator
          text: But the farmer wanted him desperately and kept begging.
        - id: ch03-b04
          speaker: little_klaus
          text: Well, you gave me shelter tonight, so I will do it. The wizard will cost one bushel of money, and the measure must be filled to the top.
        - id: ch03-b05
          speaker: farmer
          text: You shall have it. But take that chest away too. I won't keep it here another hour. The creature may still be inside.
        - id: ch03-b06
          speaker: narrator
          text: The bargain was made. Little Klaus handed over the sack with the dry horse skin, which the farmer now believed held a wizard. In return, he received a full bushel of money. The farmer also lent him a wheelbarrow, because Little Klaus had to carry both the coins and the great chest away. Little Klaus said farewell and pushed the barrow toward the wood. All the while, the frightened sexton remained shut inside the chest.
        - id: ch03-b07
          speaker: narrator
          text: Beyond the wood ran a broad, deep river. Its current was so strong that a swimmer could scarcely fight against it. A new bridge crossed the water, and Little Klaus stopped at its very center. Then he spoke loudly enough for the sexton to hear.
        - id: ch03-b08
          speaker: little_klaus
          text: What shall I do with this foolish chest? It feels as heavy as stone, and dragging it will only tire me. I think I'll throw it into the river. If it floats home to me, good. If it doesn't, that doesn't matter either.
        - id: ch03-b09
          speaker: narrator
          text: With one hand, he lifted the chest a little, pretending that he meant to cast it over the bridge.
        - id: ch03-b10
          speaker: sexton
          text: No, don't throw it in! Let me climb out first!
          emotion: fearful
        - id: ch03-b11
          speaker: little_klaus
          text: Oh! He's still in there! I must toss him into the water quickly and drown him.
        - id: ch03-b12
          speaker: sexton
          text: Please, no! Set me free, and I will give you a whole bushel of money.
          emotion: fearful
        - id: ch03-b13
          speaker: little_klaus
          text: Ah, that changes everything.
        - id: ch03-b14
          speaker: narrator
          text: Little Klaus opened the chest, and the sexton scrambled out as fast as he could. Once he was safe, the sexton pushed the empty chest over the bridge and into the river. Then he led Little Klaus to his house and paid the promised bushel of money. Little Klaus already had one bushel from the farmer. Now, with the sexton's payment added to it, his wheelbarrow was full of coins.
        - id: ch03-b15
          speaker: narrator
          text: Back in his room, Little Klaus poured all the coins into a heap.
        - id: ch03-b16
          speaker: little_klaus
          text: My horse brought a very good price! Big Klaus will rage when he learns how rich that one horse made me. But I won't tell him yet.
        - id: ch03-b17
          speaker: narrator
          text: Little Klaus sent a boy to borrow Big Klaus's bushel measure. Big Klaus wondered what he could want with it. He smeared tar across the bottom, so that a little of whatever was measured would stick there.
        - id: ch03-b18
          speaker: narrator
          text: His trick worked. When the measure came back, three new silver five-shilling pieces clung to the tar.
        - id: ch03-b19
          speaker: big_klaus
          text: What can this mean?
        - id: ch03-b20
          speaker: narrator
          text: Big Klaus ran straight to Little Klaus.
        - id: ch03-b21
          speaker: big_klaus
          text: Where did you get so much money?
        - id: ch03-b22
          speaker: little_klaus
          text: It came from my horse skin. I sold it last night.
        - id: ch03-b23
          speaker: big_klaus
          text: That is certainly a fine price!
    - id: ch04
      title: Four Horse Skins
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Big Klaus rushed home, snatched up an axe, and killed all four of his horses. He skinned them and carried the hides into town.
        - id: ch04-b02
          speaker: big_klaus
          text: Horse skins for sale! Who wants to buy horse skins?
        - id: ch04-b03
          speaker: narrator
          text: Shoemakers and tanners came running from every direction. They asked how much he wanted.
        - id: ch04-b04
          speaker: big_klaus
          text: One bushel of money for every skin.
        - id: ch04-b05
          speakers: [shoemaker_1, shoemaker_2, tanner]
          ensemble: chorus
          text: Are you mad? Do you think we keep money by the bushel?
        - id: ch04-b06
          speaker: narrator
          text: Big Klaus walked on through the streets, calling the same thing again.
        - id: ch04-b07
          speaker: big_klaus
          text: Horse skins for sale! Who wants to buy horse skins?
        - id: ch04-b08
          speaker: narrator
          text: Every time someone asked the price, he demanded a bushel of money.
        - id: ch04-b09
          speakers: [shoemaker_1, shoemaker_2, tanner]
          ensemble: chorus
          text: He is making fools of us!
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: The townspeople had had enough. The shoemakers grabbed the measuring sticks they used in their trade, and the tanners took up their heavy leather aprons. Together they closed around Big Klaus and gave him a sound beating while they mocked the price he had demanded.
        - id: ch04-b11
          speakers: [shoemaker_1, shoemaker_2, tanner]
          ensemble: chorus
          text: Skins for sale, are they? We'll tan your skin! Get out of town!
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: Big Klaus fled as fast as he could to save his life. When he finally reached home, he was furious.
        - id: ch04-b13
          speaker: big_klaus
          text: Little Klaus will pay dearly for this. I will kill him!
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: Little Klaus's grandmother had just died. She had been very unkind to him, yet he was deeply grieved. He laid her in his warm bed and hoped somehow to bring her back to life.
        - id: ch04-b15
          speaker: narrator
          text: She remained there all night. Little Klaus sat in a corner and slept in a chair, as he had often done before. During the night, the door opened. Big Klaus entered with his axe.
        - id: ch04-b16
          speaker: narrator
          text: He knew exactly where Little Klaus's bed stood. He crept up and struck the grandmother on the head, believing that Little Klaus lay beneath the covers.
        - id: ch04-b17
          speaker: big_klaus
          text: There! You will never get the better of me again.
        - id: ch04-b18
          speaker: narrator
          text: Big Klaus went home. Little Klaus had seen what he did.
        - id: ch04-b19
          speaker: little_klaus
          text: What a wicked man! He came here to kill me. It was fortunate that Grandmother was already dead, or he would have killed her.
    - id: ch05
      title: The Innkeeper's Temper
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Little Klaus dressed his grandmother in her Sunday clothes. He borrowed a horse from a neighbor and harnessed it to a cart. Then he seated his grandmother on the back bench so she would not fall out while he drove.
        - id: ch05-b02
          speaker: narrator
          text: At sunrise, they stopped before a large inn. Little Klaus went inside for a drink. The innkeeper was rich and worthy, but he had a fiery temper.
        - id: ch05-b03
          speaker: innkeeper
          text: Good morning! You are traveling early today.
        - id: ch05-b04
          speaker: little_klaus
          text: Yes. I am taking my grandmother to town. She is sitting outside in the cart, because I can't bring her in. Would you take her a glass of mead? You must speak loudly. She is very hard of hearing.
        - id: ch05-b05
          speaker: innkeeper
          text: Certainly. I'll take it to her.
        - id: ch05-b06
          speaker: narrator
          text: The innkeeper filled a large glass and carried it to the dead grandmother, who sat stiffly upright in the cart.
        - id: ch05-b07
          speaker: innkeeper
          text: Here is a glass of mead from your son.
        - id: ch05-b08
          speaker: narrator
          text: The dead woman neither answered nor moved.
        - id: ch05-b09
          speaker: innkeeper
          text: Can't you hear me? Your son has sent you a glass of mead!
        - id: ch05-b10
          speaker: narrator
          text: The innkeeper shouted the same message again. Then he shouted it a third time, as loudly as he could. Still the old woman gave no answer and never moved from her place. At last, his hot temper flared. He threw the glass straight into her face. The blow sent her toppling backward into the cart, because Little Klaus had seated her there without tying her in place.
        - id: ch05-b11
          speaker: little_klaus
          text: What have you done?
          emotion: surprised
        - id: ch05-b12
          speaker: narrator
          text: Little Klaus ran from the inn and caught the host by the throat.
        - id: ch05-b13
          speaker: little_klaus
          text: You have killed my grandmother! Look at the great hole in her forehead!
          emotion: angry
        - id: ch05-b14
          speaker: innkeeper
          text: What a terrible misfortune! My hot temper caused it all. Dear Little Klaus, I will give you a bushel of money and bury your grandmother as if she were my own. Only don't tell anyone. They might cut off my head, and that would be most uncomfortable.
          emotion: fearful
        - id: ch05-b15
          speaker: narrator
          text: So Little Klaus received another bushel of money, and the innkeeper buried the grandmother with the care he would have given his own.
        - id: ch05-b16
          speaker: narrator
          text: When Little Klaus returned home with all that money, he sent the boy to borrow Big Klaus's measure again. Big Klaus saw the coins that came back on the tarred bottom.
        - id: ch05-b17
          speaker: big_klaus
          text: What's this? Didn't I kill him? I had better see for myself.
          emotion: surprised
        - id: ch05-b18
          speaker: narrator
          text: He carried the measure to Little Klaus and stared wide-eyed at the heap of money.
        - id: ch05-b19
          speaker: big_klaus
          text: Now tell me. Where did all this money come from?
        - id: ch05-b20
          speaker: little_klaus
          text: You killed my grandmother instead of me. I sold her and got one bushel of money.
        - id: ch05-b21
          speaker: big_klaus
          text: That is a very good price!
        - id: ch05-b22
          speaker: narrator
          text: Big Klaus hurried home, took his axe, and killed his own grandmother. He laid her in a cart and drove to the apothecary's shop.
        - id: ch05-b23
          speaker: big_klaus
          text: Would you like to buy a dead body?
        - id: ch05-b24
          speaker: apothecary
          text: Who is it? And how did you get the body?
        - id: ch05-b25
          speaker: big_klaus
          text: It is my grandmother. I killed her so I could get a bushel of money.
        - id: ch05-b26
          speaker: apothecary
          text: You are out of your mind! Never say such a thing again, or you will lose your head. What you have done is dreadful and wicked. You deserve to be punished.
          emotion: angry
        - id: ch05-b27
          speaker: narrator
          text: The apothecary's words frightened Big Klaus so badly that he leaped into his cart and drove home at full speed. The apothecary and everyone nearby decided he must be mad, so they let him escape.
        - id: ch05-b28
          speaker: big_klaus
          text: You will pay for this, Little Klaus. You will pay dearly!
          emotion: angry
    - id: ch06
      title: The Sack by the Church
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: As soon as Big Klaus reached home, he found the largest sack he owned and marched to Little Klaus's house.
        - id: ch06-b02
          speaker: big_klaus
          text: You have fooled me again! First I killed my horses, and then I killed my grandmother. This is all your fault, but you will never trick me again.
          emotion: angry
        - id: ch06-b03
          speaker: narrator
          text: Big Klaus grabbed Little Klaus, forced him into the sack, tied it shut, and swung it over his shoulder.
        - id: ch06-b04
          speaker: big_klaus
          text: Now I am taking you to the river to drown you!
          emotion: angry
        - id: ch06-b05
          speaker: narrator
          text: The river was a long way off, and Little Klaus was not light. Their road passed the church. The organ sounded within, and the congregation was singing beautifully.
        - id: ch06-b06
          speaker: narrator
          text: Big Klaus set the sack beside the church door. He thought he might as well go inside and hear one psalm before continuing. Little Klaus could not loosen the cord, and everyone else was in church. Big Klaus left him there and went in.
        - id: ch06-b07
          speaker: little_klaus
          text: Oh, dear! Oh, dear!
        - id: ch06-b08
          speaker: narrator
          text: He twisted and turned inside the sack, but the knot would not give way. Then an ancient cattle-driver came along. His hair was snow-white, and he carried a long staff. Behind him walked a herd of cows and oxen. The animals bumped the sack and knocked it over.
        - id: ch06-b09
          speaker: little_klaus
          text: Alas, I am so young, and still I must die!
          emotion: sad
        - id: ch06-b10
          speaker: cattle_driver
          text: And I am a poor old man, yet I cannot die.
          emotion: sad
        - id: ch06-b11
          speaker: little_klaus
          text: Open this sack and climb in instead of me. Then you will die in a moment.
        - id: ch06-b12
          speaker: cattle_driver
          text: I will gladly do that.
        - id: ch06-b13
          speaker: narrator
          text: The old man opened the sack, and Little Klaus struggled free at once.
        - id: ch06-b14
          speaker: cattle_driver
          text: You will look after my cattle, won't you?
        - id: ch06-b15
          speaker: narrator
          text: The cattle-driver climbed into the sack. Little Klaus tied it securely, then went on his way with the cows and oxen.
        - id: ch06-b16
          speaker: narrator
          text: Soon Big Klaus came out of the church and lifted the sack onto his shoulders. It seemed much lighter now, because the old cattle-driver weighed barely half as much as Little Klaus.
        - id: ch06-b17
          speaker: big_klaus
          text: How easy he is to carry now! Hearing part of the service must have made the load lighter.
        - id: ch06-b18
          speaker: narrator
          text: Big Klaus went on until he reached the river. It was deep and broad, just as before. Without opening the sack or looking inside, he lifted it and threw it far out into the water. He never doubted that Little Klaus was still tied up inside.
        - id: ch06-b19
          speaker: big_klaus
          text: Down you go! You will never make a fool of me again!
        - id: ch06-b20
          speaker: narrator
          text: Then Big Klaus went home. At the crossroads, he stopped short. There was Little Klaus, driving the whole herd before him.
        - id: ch06-b21
          speaker: big_klaus
          text: What is this? Didn't I drown you?
          emotion: surprised
        - id: ch06-b22
          speaker: little_klaus
          text: Yes, you did. You threw me into the river about half an hour ago.
        - id: ch06-b23
          speaker: big_klaus
          text: Then where did you get those splendid cattle?
    - id: ch07
      title: The Cattle Beneath the River
      blocks:
        - id: ch07-b01
          speaker: little_klaus
          text: These are sea-cattle. I will tell you everything, and I thank you for drowning me. Now I am back on land, and I am truly rich.
        - id: ch07-b02
          speaker: little_klaus
          text: I was frightened inside that sack. The wind whistled past my ears when you threw me from the bridge into the cold river. I sank straight to the bottom, but I wasn't hurt. The softest grass was growing beneath me, and I landed upon it.
        - id: ch07-b03
          speaker: little_klaus
          text: At once, the sack opened. A lovely maiden stood there in snow-white clothes, with a green garland around her wet hair. She took my hand and said, “Are you Little Klaus? Here are some cattle to begin with. Another herd is waiting a mile farther along the road, and I will give you those as a present.”
        - id: ch07-b04
          speaker: little_klaus
          text: Then I understood that the river is a great road for the sea-people. They travel beneath the water from the sea all the way to the place where the river ends. Everything down there was beautiful, with flowers and fresh grass everywhere. Fish shot past my ears like birds flying through our air. The people were lovely, and fine cattle grazed beside the ditches and dikes.
        - id: ch07-b05
          speaker: big_klaus
          text: If it is so beautiful below, why did you come back up here? I would have stayed.
        - id: ch07-b06
          speaker: little_klaus
          text: Coming up was the clever thing to do. Remember, the sea-maiden said another herd waited a mile farther along the road. By road, she meant the river, because she cannot travel any other way.
        - id: ch07-b07
          speaker: little_klaus
          text: But the river bends one way and then another, so following it is a long journey. I came onto land to cut across the fields and meet it again farther on. That saves nearly half a mile, and I will reach my sea-cattle much sooner.
        - id: ch07-b08
          speaker: big_klaus
          text: You are a lucky fellow! Do you think I would receive cattle too, if I went to the bottom of the river?
        - id: ch07-b09
          speaker: little_klaus
          text: Oh, yes, I think you would. But you are too heavy for me to carry to the river in a sack. If you walk there and climb into it yourself, I will be very pleased to throw you in.
        - id: ch07-b10
          speaker: big_klaus
          text: Thank you. But if I reach the bottom and get no sea-cattle, remember that I will give you a terrible beating.
        - id: ch07-b11
          speaker: little_klaus
          text: Oh, no! You needn't be so hard on me.
        - id: ch07-b12
          speaker: narrator
          text: Together they returned to the river. The thirsty cows and oxen saw the water and rushed toward it to drink.
        - id: ch07-b13
          speaker: little_klaus
          text: See how fast they are running? They want to go back to the bottom.
        - id: ch07-b14
          speaker: big_klaus
          text: Yes, but help me first, or you will get a beating.
        - id: ch07-b15
          speaker: narrator
          text: The large sack lay across the back of one of the oxen. Big Klaus climbed inside it.
        - id: ch07-b16
          speaker: big_klaus
          text: Put a stone in with me. I am afraid I may not sink all the way to the bottom.
        - id: ch07-b17
          speaker: little_klaus
          text: You will sink well enough.
        - id: ch07-b18
          speaker: narrator
          text: Even so, Little Klaus placed a large stone inside the sack. He tied it tightly and pushed it into the river. Plump! Big Klaus struck the water and sank like lead to the bottom.
        - id: ch07-b19
          speaker: little_klaus
          text: I doubt he will find any cattle down there.
        - id: ch07-b20
          speaker: narrator
          text: And with that, Little Klaus drove his own cattle home.
