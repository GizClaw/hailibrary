audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的神秘与克制, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    little_klaus:
      display_name: 小克劳斯
      tts: {delivery: 机灵从容，困境中总带着狡黠的自信, timbre: 清亮灵活, pace: 适中偏快, pitch: 中高音}
    big_klaus:
      display_name: 大克劳斯
      tts: {delivery: 粗暴急躁，贪心时直来直去, timbre: 粗厚有力, pace: 稍快, pitch: 中低音}
    farmer:
      display_name: 农夫
      tts: {delivery: 豪爽直率，醉意中越发好奇而冲动, timbre: 厚实成熟, pace: 适中, pitch: 中低音}
    sexton:
      display_name: 教堂司事
      tts: {delivery: 谨慎拘束，受惊时慌乱急切, timbre: 偏细成熟, pace: 适中偏快, pitch: 中高音}
    shoemaker:
      display_name: 鞋匠
      tts: {delivery: 直爽泼辣，受戏弄时毫不客气, timbre: 明亮结实, pace: 稍快, pitch: 中音}
    tanner:
      display_name: 制革匠
      tts: {delivery: 粗犷爽利，发怒时带着讥讽, timbre: 沙哑厚重, pace: 稍快, pitch: 中低音}
    innkeeper:
      display_name: 店主
      tts: {delivery: 本性正派却脾气火爆，惊慌时语气急促, timbre: 洪亮成熟, pace: 适中偏快, pitch: 中低音}
    apothecary:
      display_name: 药剂师
      tts: {delivery: 严肃清醒，训斥时斩钉截铁, timbre: 清晰冷静, pace: 适中, pitch: 中音}
    cattle_driver:
      display_name: 赶牲口的老人
      tts: {delivery: 年迈疲惫，对死亡怀着平静的渴望, timbre: 苍老低哑, pace: 缓慢, pitch: 低音}
  chapters:
    - id: ch01
      title: 五匹马与一张马皮
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一个村子里住着两个同名的人，他们都叫克劳斯。一个有四匹马，人们叫他大克劳斯。另一个只有一匹马，人们叫他小克劳斯。下面这个千真万确的故事，讲的就是他们俩。
        - id: ch01-b02
          speaker: narrator
          text: 从星期一到星期六，小克劳斯天天替大克劳斯犁田，还得把自己唯一的马借给他。只有星期天，大克劳斯才把四匹马都借过来，让小克劳斯耕自己的地。也只有在这一天，五匹马才都跟小克劳斯自己的马一样。他高兴得不得了，鞭子甩得啪啪响。
        - id: ch01-b03
          speaker: narrator
          text: 阳光明亮，教堂钟声响个不停。村民们穿着最体面的衣服，夹着赞美诗集去听牧师讲道。每当有人经过，小克劳斯就得意地高声吆喝。
        - id: ch01-b04
          speaker: little_klaus
          text: 驾，我的五匹马！
        - id: ch01-b05
          speaker: big_klaus
          text: 不准那么喊。这里只有一匹马是你的。
        - id: ch01-b06
          speaker: narrator
          text: 小克劳斯听了，只好答应不喊。可第二个路人一从田边走过，他马上忘得干干净净，又叫起“我的五匹马”。大克劳斯再次喝止他，还说得明明白白，再敢喊一次，就朝他那匹马的脑袋来一下，让它当场倒地断气。
        - id: ch01-b07
          speaker: little_klaus
          text: 我真的不会再说了！
        - id: ch01-b08
          speaker: narrator
          text: 偏偏又有一群人经过，还朝他点头问早安。小克劳斯望着五匹马替自己犁田，越看越神气。他把鞭子一甩，还是忍不住喊了出来。
        - id: ch01-b09
          speaker: little_klaus
          text: 驾，我的五匹马！
        - id: ch01-b10
          speaker: big_klaus
          text: 好啊，看我怎么收拾你的马！
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: 大克劳斯抓起铁棍，重重砸在小克劳斯那匹马的头上。马当场倒下，再也不动了。小克劳斯哭着说，自己如今连一匹马也没有了。
        - id: ch01-b12
          speaker: narrator
          text: 小克劳斯哭了一阵，只好剥下马皮，把它晒干，塞进口袋扛在肩上，准备到城里卖掉。城里离村子很远，中间还隔着一片黑沉沉的大森林。他走进林中，偏偏又赶上可怕的暴风雨，很快迷了方向。等他终于摸回正路，天已经黑透，那一晚无论如何也进不了城。
        - id: ch01-b13
          speaker: narrator
          text: 路边有一座宽大的农舍，窗板虽然紧闭，缝隙里却透着明亮的灯光。小克劳斯心想，主人要是肯让自己借宿一夜就好了。他上前敲门，开门的是农夫的妻子。她听完请求，只说丈夫不在家，自己绝不会收留陌生人，随即把门关在他面前。
        - id: ch01-b14
          speaker: little_klaus
          text: 那我只好睡在外面了。
        - id: ch01-b15
          speaker: narrator
          text: 农舍附近立着一大垛干草，草垛和房子之间还有一间小棚屋。平平的茅草顶上站着一只活鹳，它的窝也筑在那里。小克劳斯打量着屋顶，心想，只要那只鹳不飞下来啄自己的腿，那里就是一张再好不过的床。他爬进棚屋，找了个舒服的地方躺下。农舍的木窗板顶端没有合严，他从缝隙里刚好能看清屋内。
        - id: ch01-b16
          speaker: narrator
          text: 屋里摆着一张大桌子，上面放满葡萄酒、烤肉，还有一条漂亮的鲜鱼。农夫妻子和教堂司事坐在桌边，再没有第三个人。她正往司事的杯里斟酒，司事则把叉子伸向自己最爱吃的鱼。小克劳斯把脑袋尽量探近窗口，馋得心里直念叨，要是能分到一点儿就好了。接着，他又看见了香喷喷的糕点。这哪里是一顿晚饭，分明是一场盛宴。
        - id: ch01-b17
          speaker: narrator
          text: 这时，路上传来渐渐逼近的马蹄声，原来是农夫回来了。他为人十分正派，却有一个谁也解释不了的怪脾气，只要看见教堂司事，就会气得发疯。司事也正因为知道他不在家，才特意来向他的妻子问安。农夫妻子这才把家里最好的东西都摆了出来。如今两人听见马蹄声，顿时吓得没了主意。
        - id: ch01-b18
          speaker: narrator
          text: 农夫妻子求司事赶快钻进一口空着的大箱子。他知道农夫有多么讨厌自己，马上躲了进去。女人又手忙脚乱地把满桌酒菜和葡萄酒全塞进烤炉。要是丈夫看见这些好东西，肯定会问它们是为谁准备的。小克劳斯眼睁睁看着整桌盛宴消失，忍不住在棚屋上面叹起气来。
        - id: ch01-b19
          speaker: little_klaus
          text: 哎呀，哎呀！
        - id: ch01-b20
          speaker: narrator
          text: 农夫抬头发现了他，问他为什么睡在棚屋上面。小克劳斯讲了自己怎样在森林里迷路，又请求借宿一晚。农夫爽快地答应了，还把他叫进屋，说睡觉以前，两个人得先找些东西填饱肚子。
    - id: ch02
      title: 口袋里的魔法师
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 农夫妻子客客气气地迎接他们，重新铺好长桌，却只端来一大盘麦粥。农夫正饿得厉害，一勺接一勺，吃得十分香甜。小克劳斯却满脑子都是刚才看见的鲜鱼、烤肉和糕点。他明知道那些东西就藏在烤炉里，嘴里的麦粥自然一点滋味也没有。
        - id: ch02-b02
          speaker: narrator
          text: 装马皮的口袋就在他脚边。他悄悄踩了一脚，晒干的马皮吱嘎一响。他叫口袋安静，又踩一下，这回响得更大了。
        - id: ch02-b03
          speaker: farmer
          text: 咦，你的口袋里是什么？
        - id: ch02-b04
          speaker: little_klaus
          text: 是个魔法师。他嫌我们吃麦粥，还说自己已经变出一烤炉的烤肉、鲜鱼和糕点了。
        - id: ch02-b05
          speaker: narrator
          text: 农夫惊讶得叫出声来，赶紧打开烤炉。里面果然有鲜鱼、烤肉和糕点，每一道都叫人流口水。他不知道那是妻子刚刚藏进去的，还真信是口袋里的魔法师变出来的。农夫妻子一句也不敢解释，只得把好吃的全端上桌。三个人痛痛快快吃了一顿。吃到一半，小克劳斯又把脚伸向口袋，让马皮吱嘎一响。
        - id: ch02-b06
          speaker: farmer
          text: 这一次，魔法师又说了什么？
        - id: ch02-b07
          speaker: little_klaus
          text: 他说还变了三瓶葡萄酒，就在烤炉旁边的墙角。
        - id: ch02-b08
          speaker: narrator
          text: 农夫妻子听了，只好走到墙角，拿出自己藏好的三瓶酒。农夫一杯接一杯地喝，越喝越快活，也越来越相信那个魔法师什么都能变。他实在眼馋，恨不得马上把魔法师装进自己的口袋。
        - id: ch02-b09
          speaker: farmer
          text: 他能把魔鬼变来吗？我现在兴致正好，很想亲眼见见魔鬼！
        - id: ch02-b10
          speaker: little_klaus
          text: 我叫他做什么，他就做什么。对吧，魔法师？听，他回答“对”。不过他说，魔鬼丑得吓人，你见了一定不会喜欢。
        - id: ch02-b11
          speaker: farmer
          text: 我才不怕。魔鬼到底长什么样？
        - id: ch02-b12
          speaker: little_klaus
          text: 他会变成教堂司事的模样。
        - id: ch02-b13
          speaker: farmer
          text: 那可真够丑的！我最讨厌看见教堂司事。不过我知道他是魔鬼，就不怕了。只是别让他靠得太近。
        - id: ch02-b14
          speaker: narrator
          text: 小克劳斯又踩响口袋，把耳朵贴上去，装作仔细听魔法师说话。
        - id: ch02-b15
          speaker: little_klaus
          text: 魔法师说，打开墙角那口箱子，你就能看见魔鬼蹲在里面。可得抓牢箱盖，千万别放他逃走。
        - id: ch02-b16
          speaker: farmer
          text: 你来帮我按住他，好吗？
        - id: ch02-b17
          speaker: narrator
          text: 农夫壮着胆子朝箱子走去，还请小克劳斯帮忙按住箱盖。真正的司事正缩在里面，听到他们要看魔鬼，已经吓得魂不附体。农夫小心地把盖子掀开一条缝，往里一瞧，正好看见司事那张脸，马上尖叫着向后跳开。
        - id: ch02-b18
          speaker: farmer
          text: 呸，我看见了！他跟我们那位司事长得一模一样，真是吓死人了！
          emotion: fearful
        - id: ch02-b19
          speaker: narrator
          text: 农夫看过这个“魔鬼”，只好再喝几杯酒压惊。他和桌边的两个人一直喝到深夜。酒喝得越多，他越觉得口袋里的魔法师是个宝贝。他非要小克劳斯把魔法师卖给自己，随便小克劳斯开价，还说只要点头，马上就付满满一斗钱。
        - id: ch02-b20
          speaker: little_klaus
          text: 我本来真舍不得。这个魔法师能替我变出多少东西啊！不过，你今晚好心收留了我，我就卖给你吧。我要满满一斗钱，还得装得冒尖。
        - id: ch02-b21
          speaker: farmer
          text: 没问题。可你得把那口箱子也带走。我一刻都不想留着它，谁知道魔鬼是不是还在里面？
        - id: ch02-b22
          speaker: narrator
          text: 小克劳斯把装着干马皮的口袋交给农夫，换来一斗装得冒尖的钱。农夫又借给他一辆独轮车，让他运走那斗钱和吓人的箱子。小克劳斯说声再见，推起车便上了路。至于真正的教堂司事，他还缩在那口大箱子里，一声也不敢出呢。
        - id: ch02-b23
          speaker: narrator
          text: 森林另一边有条又宽又深的大河，水急得人几乎游不过去。河上新修了一座桥。小克劳斯走到桥中央，故意让箱里的人听见自己的话。
        - id: ch02-b24
          speaker: little_klaus
          text: 这口破箱子沉得像装满石头，拖下去只会累死我。还是扔进河里吧。它能漂回我家最好，漂不回去也没什么。
        - id: ch02-b25
          speaker: narrator
          text: 他单手把箱子抬起一点，装作马上要扔下桥。
        - id: ch02-b26
          speaker: sexton
          text: 别扔！千万别扔！先让我出去！
          emotion: fearful
        - id: ch02-b27
          speaker: little_klaus
          text: 哎哟，他居然还在里面！我得赶快把他扔进水里淹死！
        - id: ch02-b28
          speaker: sexton
          text: 不要啊！只要放我走，我给你满满一斗钱！
          emotion: fearful
        - id: ch02-b29
          speaker: little_klaus
          text: 那可就另当别论了。
        - id: ch02-b30
          speaker: narrator
          text: 小克劳斯这才打开箱子。司事飞快地爬出来，生怕他改变主意。他顺手把空箱推进河里，然后赶回家取来满满一斗钱。小克劳斯从农夫那里已经得过一斗，如今再添上这一斗，整辆独轮车都装满了钱。
        - id: ch02-b31
          speaker: little_klaus
          text: 嘿，我这匹马卖得可真值钱！大克劳斯要是知道我靠一匹马发了财，一定会气疯。现在先别告诉他。
    - id: ch03
      title: 一斗钱的价钱
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小克劳斯把钱倒在自己屋里，堆成一大堆，却不急着把消息告诉大克劳斯。他只派一个男孩过去借斗。大克劳斯猜不出他有什么东西需要拿斗量，便偷偷在斗底抹上一层焦油。这样，不管量的是粮食还是别的东西，总会粘下一点。果然，斗送回来时，底下牢牢粘着三枚崭新的五先令银币。
        - id: ch03-b02
          speaker: big_klaus
          text: 这些银币是哪儿来的？你怎么会有那么多钱？
        - id: ch03-b03
          speaker: little_klaus
          text: 是那张马皮卖的钱。我昨天傍晚卖掉了。
        - id: ch03-b04
          speaker: big_klaus
          text: 一张马皮竟能卖这么高的价钱！
          emotion: surprised
        - id: ch03-b05
          speaker: narrator
          text: 大克劳斯听见这个价钱，马上相信城里的人会出大钱买马皮。他匆匆跑回家，拿起斧头，接连砍死自己的四匹马，又剥下四张皮，一股脑儿运进城。他走过一条又一条街，扯着嗓子反复叫卖，唯恐别人听不见。
        - id: ch03-b06
          speaker: big_klaus
          text: 卖马皮！谁要买马皮？每张只收一斗钱！
        - id: ch03-b07
          speakers: [shoemaker, tanner]
          ensemble: duo
          text: 你疯了吗？谁家的钱会拿斗来量？
        - id: ch03-b08
          speaker: narrator
          text: 大克劳斯不肯改口，还是沿街叫喊。无论哪个鞋匠或制革匠来问，他都坚持每张马皮要一斗钱。大家听得越来越恼火，认定他不是疯子，就是存心拿全城的人寻开心。鞋匠们抓起手里的量尺，制革匠们抄起厚实的皮围裙，围住大克劳斯就是一顿痛打。
        - id: ch03-b09
          speakers: [shoemaker, tanner]
          ensemble: duo
          text: 马皮，马皮！我们先替你好好硝一硝这张皮！快滚出城去！
        - id: ch03-b10
          speaker: narrator
          text: 大克劳斯拼命逃回家，才算保住性命。他发誓要让小克劳斯付出代价，还要亲手杀了他。
        - id: ch03-b11
          speaker: narrator
          text: 那时，小克劳斯的祖母恰好刚刚去世。她活着的时候待他很不好，可小克劳斯仍旧伤心极了。他把老人抱到自己暖和的床上，甚至想试试看，暖一整夜能不能让她活过来。祖母就这样躺在床上。小克劳斯自己坐到墙角的椅子里睡觉，以前他也常常在那里过夜。
        - id: ch03-b12
          speaker: narrator
          text: 到了夜里，房门忽然被推开。大克劳斯提着斧头，悄悄走进屋里。他很清楚小克劳斯的床摆在哪里，黑暗中也没有细看，走到床前便举起斧头，朝枕边那颗脑袋狠狠砍下去。他哪里知道，床上躺的是已经死去的祖母。
        - id: ch03-b13
          speaker: big_klaus
          text: 这下好了，你再也别想占我的便宜！
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: 大克劳斯走后，小克劳斯才从墙角出来。他想，这个人真恶毒，分明是来杀自己的。幸亏祖母本来就死了，不然这一斧头真会要她的命。
        - id: ch03-b15
          speaker: narrator
          text: 天亮前，他给祖母换上礼拜日才穿的衣裳，又向邻居借来一匹马，套在车前。他把祖母扶到后座，安置得稳稳当当，免得赶车时掉下去，这才驾车出发。太阳升起的时候，他们来到一家大客店门前。小克劳斯下车进去找些喝的。店主家里很有钱，人也很正派，只有一样不好，他的脾气特别暴躁。
        - id: ch03-b16
          speaker: innkeeper
          text: 早上好！你这么早就上路了？
        - id: ch03-b17
          speaker: little_klaus
          text: 我要带祖母进城。她还坐在外面的车上，我没法扶她进来。请你给她一杯蜂蜜酒吧。她耳朵很背，你得说得特别大声。
        - id: ch03-b18
          speaker: narrator
          text: 店主爽快地答应下来，倒了满满一大杯蜂蜜酒，亲自端到外面的马车旁。死去的祖母直挺挺坐在后座。店主把酒递到她面前，说是她孙子请她喝的，可老人当然一句话也不回答，连眼皮都没有动一下。
        - id: ch03-b19
          speaker: innkeeper
          text: 这是你孙子请你喝的蜂蜜酒！你听见没有？他请你喝酒！
        - id: ch03-b20
          speaker: narrator
          text: 店主以为她耳背，便把同一句话又喊一遍，再喊一遍，声音一次比一次大。老太太还是纹丝不动。店主的暴脾气终于上来了。他一怒之下，把酒杯朝她脸上扔去。老人并没有绑在座位上，身子被酒杯一撞，仰面倒进马车里。
        - id: ch03-b21
          speaker: little_klaus
          text: 你杀了我祖母！快看，她的额头上有个大窟窿！
        - id: ch03-b22
          speaker: innkeeper
          text: 哎呀，都是我这坏脾气闯的祸！我给你一斗钱，也会像安葬自己的祖母那样安葬她。千万别说出去，不然我会被砍头，那可太不好受了！
          emotion: fearful
        - id: ch03-b23
          speaker: narrator
          text: 小克劳斯收下满满一斗钱，店主也把他的祖母好好安葬了。
        - id: ch03-b24
          speaker: narrator
          text: 小克劳斯带着钱回到家，又派那个男孩去向大克劳斯借斗。大克劳斯听见这件事，惊得摸不着头脑。他明明亲手砍过床上那个人，怎么小克劳斯不但活着，还又有钱可量？这一次，他不肯只把斗借出去，而是亲自拿着斗找上门。一进屋，他果然看见地上又堆着一大堆钱。
        - id: ch03-b25
          speaker: big_klaus
          text: 这又是从哪里弄来的？
        - id: ch03-b26
          speaker: little_klaus
          text: 你杀的是我祖母，不是我。我把祖母卖掉，正好换了一斗钱。
        - id: ch03-b27
          speaker: narrator
          text: 大克劳斯觉得这笔买卖好极了。他跑回家，拿斧头杀死自己的祖母，把尸体放上车，赶到药剂师那里。
        - id: ch03-b28
          speaker: big_klaus
          text: 你要不要买一具死尸？这是我祖母。我杀了她，想换一斗钱。
        - id: ch03-b29
          speaker: apothecary
          text: 你简直疯了！别再说这种话，不然你会掉脑袋！你做了这么可怕的恶事，理应受到惩罚！
          emotion: angry
        - id: ch03-b30
          speaker: narrator
          text: 药剂师越说越严厉，告诉他这是多么可怕的罪过，又说像他这样邪恶的人本该受到惩罚。大克劳斯听见自己可能会掉脑袋，吓得一句也不敢再说。他跳上马车，拼命抽马，一口气逃回村子。药剂师和旁边的人都认定这个人疯得不轻，因此谁也没有追赶。
    - id: ch04
      title: 教堂门边的口袋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 大克劳斯一路咬牙切齿，说小克劳斯必须为这件事付出代价。到家后，他找出最大的一只口袋，径直冲去算账。
        - id: ch04-b02
          speaker: big_klaus
          text: 你又骗了我！我先杀了四匹马，后来又杀了祖母，全都是你害的！这回你再也骗不了我了！
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: 大克劳斯一把抓住小克劳斯，硬把他塞进那个大口袋，紧紧扎住袋口，再扛到肩上。他一路叫嚷，这一次要把小克劳斯扔进河里淹死。可是从村子到河边还有很长一段路，小克劳斯又不算轻。大克劳斯背着他越走越慢，肩膀也越来越酸。
        - id: ch04-b04
          speaker: narrator
          text: 他们经过教堂，里面传出风琴和动听的歌声。大克劳斯把口袋放在门边，觉得不妨先进去听一首赞美诗。大家都在教堂里，小克劳斯又解不开绳子，只能在袋中扭来扭去。
        - id: ch04-b05
          speaker: little_klaus
          text: 哎呀，哎呀，我该怎么出去呢？
        - id: ch04-b06
          speaker: narrator
          text: 这时，一位老得不能再老的牧人从教堂门前经过。他的头发白得像雪，一只手握着长长的牧杖，身后赶着一大群母牛和公牛。牛群不知道袋里有人，挤过门边时撞上了口袋，竟把它整个撞翻在地。
        - id: ch04-b07
          speaker: little_klaus
          text: 唉，我还这么年轻，马上就要死了！
          emotion: sad
        - id: ch04-b08
          speaker: cattle_driver
          text: 可怜的我这么老，却怎么也死不了。
          emotion: sad
        - id: ch04-b09
          speaker: little_klaus
          text: 那就解开口袋，替我钻进来吧。你一进去，马上就能死。
        - id: ch04-b10
          speaker: cattle_driver
          text: 我很愿意。可我进去以后，你会替我照看这些牛吧？
        - id: ch04-b11
          speaker: narrator
          text: 老人解开袋口，小克劳斯立刻爬出来。等老人钻进口袋，他重新扎紧绳子，赶着牛群走了。
        - id: ch04-b12
          speaker: narrator
          text: 没过多久，大克劳斯听完一段赞美诗，从教堂里走了出来。他扛起口袋，立刻觉得肩上的分量轻了许多。原来，赶牲口的老人连小克劳斯一半重都不到。大克劳斯却哪里想得到袋里换了人？他只当自己听过一段礼拜仪式，心也轻了，力气也大了。
        - id: ch04-b13
          speaker: narrator
          text: 他继续走到那条又深又宽的大河边，连袋口也没有打开看一眼，便使足力气，把装着老牧人的口袋抛进水中。他还以为自己终于除掉了小克劳斯，便站在岸边，冲着正在下沉的口袋高声大喊。
        - id: ch04-b14
          speaker: big_klaus
          text: 下去吧！这回看你还怎么戏弄我！
          emotion: angry
        - id: ch04-b15
          speaker: narrator
          text: 大克劳斯转身回家。走到十字路口，他却看见小克劳斯好端端地迎面而来，身后还赶着一大群牛。
        - id: ch04-b16
          speaker: big_klaus
          text: 怎么会这样？我不是刚把你淹死了吗？
          emotion: surprised
        - id: ch04-b17
          speaker: little_klaus
          text: 没错，大约半个钟头前，你把我扔进河里了。
        - id: ch04-b18
          speaker: big_klaus
          text: 那这些漂亮的牛又是从哪里来的？
    - id: ch05
      title: 河底的海牛
      blocks:
        - id: ch05-b01
          speaker: little_klaus
          text: 这些都是海牛！我把事情从头讲给你听。说起来，我还得谢谢你把我淹下去。现在我不但平安回到陆地，还成了真正的有钱人。刚才待在袋里时，我可吓坏了。你从桥上把我扔进冰冷的河水，风在我耳边呼呼地响，我一直往下掉，根本不知道会落到哪里。
        - id: ch05-b02
          speaker: little_klaus
          text: 我一直沉到河底，却一点儿也没有摔疼。原来下面长着世上最美、最柔软的青草，我正好落在那片草地上。口袋一落地，袋口立刻自己打开了。一个美丽极了的姑娘朝我走来。她穿着雪白的衣裳，湿漉漉的头发上围着一圈绿色花环，还亲手把我从草地上牵了起来。
        - id: ch05-b03
          speaker: little_klaus
          text: 她先问我是不是小克劳斯。等我回答以后，她就把眼前这一群牛送给我，让我先赶走。她还说，只要顺着河底的路再走一英里，就会看见另一群牛。那一群也是她送给我的礼物。
        - id: ch05-b04
          speaker: little_klaus
          text: 我这才明白，这条大河原来就是海底人的大道。他们在水下沿着河道来来往往，从大海一直走到河流尽头，才踏上陆地。那里的景色美得不得了，到处开着鲜花，脚下全是新鲜的绿草。鱼儿从我耳边飞快游过，就像这儿的鸟从空中飞过一样。海底的人个个俊美，连沟渠和堤岸上吃草的牛也漂亮极了。
        - id: ch05-b05
          speaker: big_klaus
          text: 河底既然这么美，你为什么还要回到上面？换作我就不回来了。
        - id: ch05-b06
          speaker: little_klaus
          text: 我上来正是因为这样走更聪明，也更省路。你听见了，海姑娘让我沿着那条路再走一英里。她说的路当然就是河，因为她根本没有别的路可走。可是我知道，这条河一会儿弯向东，一会儿绕向西，顺着河底走要兜好大一个圈子。我先回到岸上，赶着牛横穿田野，再从前面回到河边，就能少走整整半英里，也能更快找到等我的那群海牛。
        - id: ch05-b07
          speaker: big_klaus
          text: 你可真走运！要是我也沉到河底，能不能得到一群牛？
        - id: ch05-b08
          speaker: little_klaus
          text: 我想当然能。不过你太重，我可没法装在口袋里，把你一路扛到河边。你要是自己走过去，再钻进口袋，我倒很乐意把你扔下去。
        - id: ch05-b09
          speaker: big_klaus
          text: 那就谢谢你了。可我到了下面，要是没有海牛，你可得挨一顿狠揍！
        - id: ch05-b10
          speaker: little_klaus
          text: 别对我这么凶嘛，不会没有的！
        - id: ch05-b11
          speaker: narrator
          text: 两人一起来到河边。牛群早就渴了，一看见河水，便争先恐后地跑去喝。
        - id: ch05-b12
          speaker: little_klaus
          text: 你看它们跑得多快！它们又想回河底去了！
        - id: ch05-b13
          speaker: big_klaus
          text: 先来帮我。要不然，我还是会揍你！
        - id: ch05-b14
          speaker: narrator
          text: 大克劳斯钻进放在公牛背上的大口袋。他担心自己沉不到河底，还叫小克劳斯放一块石头进来。
        - id: ch05-b15
          speaker: little_klaus
          text: 你一定沉得下去。不过，好吧，就照你说的办。
        - id: ch05-b16
          speaker: narrator
          text: 小克劳斯虽然说不用担心，还是照大克劳斯的意思，搬来一块沉甸甸的大石头，塞进口袋。他把袋口扎得紧紧的，确认大克劳斯和石头都不会掉出来，随后朝河中用力一推。只听扑通一声，大克劳斯连人带石头落进水里，像一块铅直沉河底。
        - id: ch05-b17
          speaker: little_klaus
          text: 不知道他能不能找到那些牛！
        - id: ch05-b18
          speaker: narrator
          text: 说完，小克劳斯赶着自己的牛，回家去了。
