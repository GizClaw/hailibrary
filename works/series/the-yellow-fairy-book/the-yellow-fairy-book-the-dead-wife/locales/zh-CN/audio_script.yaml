audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    husband:
      display_name: 丈夫
      tts:
        delivery: 真挚深情，悲伤中带着难以克制的冲动
        timbre: 温厚低沉
        pace: 舒缓
        pitch: 中低音
    wife:
      display_name: 妻子
      tts:
        delivery: 温柔清晰，劝告时安静而坚定
        timbre: 柔和温暖
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 火堆前的木偶
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一对夫妻住在森林深处，离族人很远。他们常常一起打猎，在外面度过整整一天。后来，妻子留在家里料理的事情太多，只好让丈夫独自出门。奇怪的是，只要少了妻子陪伴，他打猎就再也没有过好运气。
        - id: ch01-b02
          speaker: narrator
          text: 有一天，丈夫外出时，妻子病倒了。几天以后，她离开了人世。丈夫悲痛万分，把她葬在两人生活过的屋子里。可往后的日子太孤单，他便照着妻子的身量做了一个木偶，给它穿上妻子的衣裳，让它坐在火堆前，仿佛妻子又回来了。
        - id: ch01-b03
          speaker: narrator
          text: 每次打猎回家，他都先来到木偶身边，轻轻拂掉落在它脸上的灰。如今，找食物、做饭和缝补全压在他一个人身上，再也没人帮忙。这样的日子过了整整一年。
    - id: ch02
      title: 回来的妻子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天夜里，丈夫打猎回来，发现门口已经备好木柴，屋里的火也生着。第二晚，锅里甚至炖着一块快熟的肉。他四处寻找，却怎么也找不到做这些事的人。
        - id: ch02-b02
          speaker: narrator
          text: 再次出猎时，他没有走远，还特意提早回家。隔着很长一段路，他看见一个女人背着木柴走进屋里，便飞快赶过去推开门。火堆前坐着的已经不是木偶，而是他的妻子。
        - id: ch02-b03
          speaker: wife
          text: 你怎么也不能从悲痛里走出来，伟大神灵怜悯你，才让我回到你身边。可是，在见到族人以前，你不能伸手碰我。只要碰了我，我就会死去。
        - id: ch02-b04
          speaker: narrator
          text: 丈夫把这番话牢牢记住。妻子也留了下来，每天搬柴生火。直到有一天，丈夫算了算日子，开口对她说。
        - id: ch02-b05
          speaker: husband
          text: 你离开人世已经两年了。我们回族人那里吧。到了以后，你就能完全好起来，我也终于可以碰你了。
        - id: ch02-b06
          speaker: narrator
          text: 他备好路上的食物，串起两串鹿肉，一串让妻子背着，另一串自己背着。两个人就这样上了路。
    - id: ch03
      title: 雪中的足迹
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 族人的营地要走六天。还差一天就能到时，天空下起了雪。夫妻俩已经疲惫不堪，便停下来生火做饭，又把兽皮铺在地上，准备睡一晚。
        - id: ch03-b02
          speaker: narrator
          text: 这时，丈夫再也压不住心里的情意，张开双臂，想把妻子搂进怀里。妻子连忙摆手阻止他。
        - id: ch03-b03
          speaker: wife
          text: 我们还一个族人都没见到。现在碰我，真的太早了。
        - id: ch03-b04
          speaker: narrator
          text: 丈夫没有听从劝告，还是紧紧抱住了她。可他低头一看，怀里的妻子不见了，双臂抱着的竟然是那个木偶。
        - id: ch03-b05
          speaker: narrator
          text: 他痛苦地推开木偶，独自奔到营地，把这两年发生的事全讲给族人听。有些人不相信，便跟着他回到那处歇脚的地方。
        - id: ch03-b06
          speaker: narrator
          text: 木偶还躺在雪地上。旁边清清楚楚留着两个人的足迹，其中一人的脚印，和木偶的脚一模一样。
        - id: ch03-b07
          speaker: narrator
          text: 从那以后，丈夫一生都活在深深的悲伤里。
