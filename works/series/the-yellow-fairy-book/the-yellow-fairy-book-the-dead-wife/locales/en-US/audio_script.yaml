  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, clear, and quietly cautionary
        timbre: gentle and resonant
        pace: measured
        pitch: medium
    husband:
      display_name: The Husband
      tts:
        delivery: earnest, grieving, and impulsive
        timbre: warm and grounded
        pace: measured
