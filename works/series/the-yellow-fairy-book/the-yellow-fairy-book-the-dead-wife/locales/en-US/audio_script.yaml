  chapters:
    - id: ch01
      title: The Wooden Doll
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a man and his wife lived deep in the forest, far from the rest of their tribe. They often hunted together all day. After a while, though, the wife had so much work at home that she could no longer go. Her husband hunted by himself, but without her beside him, he never had any luck.
        - id: ch01-b02
          speaker: narrator
          text: One day, while the man was out hunting, his wife became ill. A few days later, she died.
        - id: ch01-b03
          speaker: narrator
          text: Her husband mourned her bitterly. He buried her inside the house where she had spent her life. As time passed, he grew so lonely that he made a wooden doll as tall and as large as she had been. He dressed it in her clothes and set it before the fire, trying to imagine that his wife had come back.
        - id: ch01-b04
          speaker: narrator
          text: The next day, he went hunting. As soon as he came home, he walked over to the doll and brushed the fallen ashes from its face. He had little time to spare. Now he had to find food, cook, and mend everything, with no one there to help him. In this way, a whole year went by.
    - id: ch02
      title: The Wife Returns
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At the end of that year, the man returned from hunting one night and saw wood lying beside the door. Inside, a fire was burning. The following night, he found wood and a fire again. This time, there was also meat in the kettle, almost ready to eat.
        - id: ch02-b02
          speaker: narrator
          text: He looked everywhere for the person who had done these things, but he found no one. The next time he went hunting, he stayed close to home and returned early. While he was still far off, he saw a woman carrying wood on her shoulders and walking into the house.
        - id: ch02-b03
          speaker: narrator
          text: The man hurried forward and threw open the door. The wooden doll was gone. In its place, his wife sat before the fire.
        - id: ch02-b04
          speaker: wife
          text: The Great Spirit saw that nothing could comfort you, and he felt sorry for you. So he allowed me to return. But you must not reach out and touch me until we have seen the rest of our people. If you touch me before then, I will die.
        - id: ch02-b05
          speaker: narrator
          text: Her husband obeyed. The woman stayed in the house once more. She carried in the wood and lit the fire, just as she had before. Then one day, the man spoke to her.
        - id: ch02-b06
          speaker: husband
          text: Two years have passed since you died. Let us go back to our tribe now. Once we are there, you will be well, and I will be able to touch you.
    - id: ch03
      title: The Journey Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The man prepared food for their journey. He strung together some deer meat for his wife to carry, and another share for himself. Then they set out for the camp of their tribe, which was six days away.
        - id: ch03-b02
          speaker: narrator
          text: When only one day's journey remained, snow began to fall. They were tired and longed to rest, so they made a fire and cooked some food. Then they spread out their skins and prepared to sleep.
        - id: ch03-b03
          speaker: narrator
          text: But the man's heart was deeply stirred. He reached both arms toward his wife. She waved him back.
        - id: ch03-b04
          speaker: wife
          text: We still have not seen anyone. It is too soon.
    - id: ch04
      title: The Footprints in the Snow
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The man would not listen. He caught his wife in his arms, and suddenly he was holding the wooden doll.
        - id: ch04-b02
          speaker: narrator
          text: When he saw what had happened, his misery overcame him. He pushed the doll away and ran to the camp. There he told his people the whole story.
        - id: ch04-b03
          speaker: narrator
          text: Some of them did not believe him, so they returned with him to the place where he and his wife had stopped. The doll was lying there. Beside it, two sets of footprints crossed the snow, and one set had feet shaped like the doll's.
        - id: ch04-b04
          speaker: narrator
          text: For all the rest of his life, the man grieved bitterly.
