audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的机智与克制, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    woman:
      display_name: 女人
      tts: {delivery: 温柔慈爱，心中总怀着希望, timbre: 温暖柔和, pace: 适中, pitch: 中音}
    witch:
      display_name: 老女巫
      tts: {delivery: 见多识广，说话干脆而神秘, timbre: 苍老微哑, pace: 稍慢, pitch: 中低音}
    thumbelina:
      display_name: 拇指姑娘
      tts: {delivery: 温柔真挚，怯弱中藏着勇气, timbre: 轻盈清澈, pace: 适中, pitch: 高音}
    old_toad:
      display_name: 老癞蛤蟆
      tts: {delivery: 自作主张，得意而粗鲁, timbre: 粗哑黏滞, pace: 稍慢, pitch: 低音}
    toad_son:
      display_name: 癞蛤蟆儿子
      tts: {delivery: 迟钝木讷，只会笨拙地叫嚷, timbre: 低沉浑浊, pace: 缓慢, pitch: 低音}
    bird_1:
      display_name: 小鸟甲
      tts: {delivery: 欢快活泼，歌声清亮, timbre: 轻巧明亮, pace: 轻快, pitch: 高音}
    bird_2:
      display_name: 小鸟乙
      tts: {delivery: 欢快活泼，歌声轻盈, timbre: 轻柔通透, pace: 轻快, pitch: 高音}
    bird_3:
      display_name: 小鸟丙
      tts: {delivery: 欢快活泼，歌声甜美, timbre: 纤细清脆, pace: 轻快, pitch: 高音}
    cockchafer:
      display_name: 大金龟子
      tts: {delivery: 冲动自信，很容易受旁人左右, timbre: 清脆而略带嗡鸣, pace: 稍快, pitch: 中音}
    lady_chafer_1:
      display_name: 金龟子太太甲
      tts: {delivery: 挑剔傲慢，说话尖刻, timbre: 尖细干脆, pace: 稍快, pitch: 中高音}
    lady_chafer_2:
      display_name: 金龟子太太乙
      tts: {delivery: 大惊小怪，满是嫌弃, timbre: 细薄刺耳, pace: 稍快, pitch: 高音}
    lady_chafer_3:
      display_name: 金龟子太太丙
      tts: {delivery: 自鸣得意，不屑一顾, timbre: 干涩利落, pace: 适中, pitch: 中音}
    field_mouse:
      display_name: 老田鼠
      tts: {delivery: 精明絮叨，偶尔流露朴实的善意, timbre: 温厚成熟, pace: 适中, pitch: 中高音}
    mole:
      display_name: 鼹鼠
      tts: {delivery: 一本正经，自负而缺少情趣, timbre: 低沉含混, pace: 缓慢, pitch: 低音}
    swallow:
      display_name: 燕子
      tts: {delivery: 真诚感恩，洒脱而深情, timbre: 清朗悦耳, pace: 流畅, pitch: 中高音}
    prince:
      display_name: 花精王子
      tts: {delivery: 彬彬有礼，年轻而诚挚, timbre: 清澈明亮, pace: 适中, pitch: 中高音}
  chapters:
    - id: ch01
      title: 花朵里的小姑娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个女人一心想要一个小小的孩子，却不知道该去哪里寻找。一天，她只好去求助一位老女巫。
        - id: ch01-b02
          speaker: woman
          text: 我太想有个小小的孩子了。您知道哪里能找到一个吗？
        - id: ch01-b03
          speaker: witch
          text: 你来得正巧，我们刚准备好一个。拿着这颗大麦粒吧。它可不是田里种的，也不是喂鸡的。种进花盆，你自然会看到奇妙的事。
        - id: ch01-b04
          speaker: narrator
          text: 女人欢喜地道了谢，付给女巫一先令，因为那颗大麦粒正值这个价钱。她拿着它回到家，仔细种进花盆。转眼间，土里冒出一朵硕大美丽的花，看起来很像郁金香。可是红黄相间的花瓣仍然紧紧合着，仿佛它还只是一个花苞。
        - id: ch01-b05
          speaker: woman
          text: 多美的花呀！
        - id: ch01-b06
          speaker: narrator
          text: 她亲了亲红黄相间的花瓣，花儿一下子绽开。这的确是一朵随处可见的郁金香，可绿绒般的花心里，竟坐着一个端正漂亮的小姑娘，身高还不到半个拇指。大家便叫她拇指姑娘。光滑精巧的核桃壳是她的摇篮，蓝紫罗兰花瓣是褥子，玫瑰花瓣是被子。夜里，她睡在这张小床上。白天，她在桌上玩耍。女人放了一只水碗，用浸在水里的花围住碗沿。拇指姑娘坐着碗中央的郁金香花瓣，从这一边航行到另一边，两根白马鬃就是她的桨。那景象美极了。她还会唱歌，声音比人们听过的任何歌声都更轻柔甜美。
        - id: ch01-b07
          speaker: narrator
          text: 一天夜里，一只又丑又黏的老癞蛤蟆从破窗爬进来。她跳上桌，一眼看见玫瑰花瓣下熟睡的拇指姑娘。
        - id: ch01-b08
          speaker: old_toad
          text: 这个小姑娘给我儿子做妻子，再合适不过了。
        - id: ch01-b09
          speaker: narrator
          text: 老癞蛤蟆捧起装着拇指姑娘的核桃壳，从窗口跳进花园，又把她带到一条又宽又大的河边。两岸湿滑泥泞，癞蛤蟆和儿子就住在这里。哎呀，她的儿子简直和母亲一个模样，又丑又笨，浑身黏糊糊的。他看见核桃壳里的漂亮小姑娘，只会扯着嗓子叫。
        - id: ch01-b10
          speaker: toad_son
          text: 呱，呱，呱！
        - id: ch01-b11
          speaker: old_toad
          text: 小点声，别吵醒她。她轻得像羽毛，随时会逃。先把她放在河心的睡莲叶上，她在那里下不了岸。咱们赶紧回沼泽底下收拾新房。
        - id: ch01-b12
          speaker: narrator
          text: 小河里长着许多睡莲，宽阔的绿叶像是在水上游动。老癞蛤蟆把核桃壳放在离岸最远、也最大的一片叶子上。清晨，拇指姑娘早早醒来。她看看四周，硕大的绿叶外面全是水，自己无论如何也到不了岸边，顿时伤心得哭个不停。
        - id: ch01-b13
          speaker: narrator
          text: 这时候，老癞蛤蟆正在沼泽底下忙碌。她用灯芯草和黄色的金盏花叶装饰房间，想让新儿媳的住处显得富丽堂皇。收拾好以后，她带着丑陋的儿子游回来，打算先取走漂亮的摇篮，放进新房。到了叶子旁边，她在水中朝拇指姑娘深深鞠了一躬。
        - id: ch01-b14
          speaker: old_toad
          text: 这是我儿子。你要嫁给他，住进沼泽底下，往后可气派了。
        - id: ch01-b15
          speaker: toad_son
          text: 呱，呱，呱！
        - id: ch01-b16
          speaker: narrator
          text: 母子俩拿着精巧的摇篮游走了。拇指姑娘不愿和黏糊糊的老癞蛤蟆生活，更不愿嫁给她丑陋的儿子，只能独自在叶子上哭。水下游动的小鱼早已看清癞蛤蟆，也听见了她的话。它们探出头来，一见小姑娘那么美丽，都不忍让她被带进沼泽。这样的事绝不能发生。小鱼们围住托着叶子的绿茎，一口一口把它咬断。绿叶载着拇指姑娘顺流而去，很快漂到老癞蛤蟆再也追不到的地方。
        - id: ch01-b17
          speaker: narrator
          text: 睡莲叶载着她向下游漂去，一路经过好几座城镇。坐在灌木枝头的小鸟都看见了这个小小的旅人，纷纷唱了起来。
        - id: ch01-b18
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: 多漂亮的小姑娘呀！
        - id: ch01-b19
          speaker: narrator
          text: 就这样，拇指姑娘乘着叶子越漂越远，漂向完全陌生的地方，离开了自己的故乡。
    - id: ch02
      title: 树林里的夏与冬
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一只美丽的小白蝴蝶在她头顶飞舞，最后落在叶子上。他喜欢拇指姑娘，她也喜欢这个新伙伴。现在癞蛤蟆再也追不到她，沿途又处处美丽。太阳照着河水，水面像最明亮的银子一样闪闪发光。她解下腰带，一头系住蝴蝶，一头系住叶子。蝴蝶拉着她，叶子比从前更快地滑过水面。
        - id: ch02-b02
          speaker: narrator
          text: 忽然，一只大金龟子飞来。他一眼看见拇指姑娘，马上搂住她纤细的腰，把她带上了树。绿叶继续顺流漂走，被牢牢拴住的蝴蝶也只能跟着远去。拇指姑娘被带到树上，吓得不得了。可她最担心的还是白蝴蝶。是她亲手把他拴在叶子上的，他若挣脱不了，恐怕会活活饿死。金龟子对此毫不在意，只让她坐在一片大绿叶上，拿花蜜给她吃。
        - id: ch02-b03
          speaker: cockchafer
          text: 你长得真漂亮，虽说一点也不像金龟子。
        - id: ch02-b04
          speaker: narrator
          text: 树上的金龟子都赶来瞧她。他们围着她挑剔地打量。
        - id: ch02-b05
          speaker: lady_chafer_1
          text: 她怎么只有两条腿？真可怜！
        - id: ch02-b06
          speaker: lady_chafer_2
          text: 她连一根触角也没有！
        - id: ch02-b07
          speakers: [lady_chafer_1, lady_chafer_2, lady_chafer_3]
          ensemble: chorus
          text: 她可真难看！
        - id: ch02-b08
          speaker: narrator
          text: 拇指姑娘其实美极了。那只把她抢来的金龟子原本也知道这一点，可听所有太太不停说她丑，他渐渐也觉得她难看，不愿再把她留在身边。他带着她飞下树，放到一朵雏菊上，随她爱去哪里就去哪里。拇指姑娘坐在那里流泪，以为自己丑得连金龟子都不愿理睬。可她分明是人们能够想象出的最美丽的姑娘，身体柔嫩又娇小，就像最可爱的玫瑰花瓣。
        - id: ch02-b09
          speaker: narrator
          text: 整个夏天，可怜的拇指姑娘独自住在大树林里。她把草叶编成床，吊在三叶草叶下挡雨，每天采花蜜充饥，清晨再喝叶片上的露水。夏天过去，秋天也过去，漫长而寒冷的严冬终于来了。曾为她婉转歌唱的小鸟全都飞走，树木落尽叶子，花儿纷纷枯死，替她遮风挡雨的那片大三叶草蜷曲起来，最后只剩一根干枯的梗。
        - id: ch02-b10
          speaker: narrator
          text: 她的衣服已经破烂不堪，身体又瘦又小，冷得直发抖。可怜的拇指姑娘眼看就要冻死。雪花纷纷落下。我们个子很大，她却只有一英寸高，所以每一片落到她身上的雪，都像一整铲雪砸在我们身上。她把一片枯叶裹在身上，可叶子早已从中间裂开，丝毫不能保暖。
        - id: ch02-b11
          speaker: narrator
          text: 树林外是一片收割过的麦田，庄稼早已不见，冻土上只剩密密的干麦茬。对拇指姑娘来说，这就是一片需要穿过的森林。她走着走着，忽然在一根麦秆下面发现一扇小门。门后住着一只老田鼠，她的洞穴温暖舒适，不仅有储满粮食的仓房，还有气派的厨房和饭厅。拇指姑娘已经整整两天没吃东西，只好走到门前，讨一小片大麦。
        - id: ch02-b12
          speaker: field_mouse
          text: 可怜的小东西，快进来暖一暖，和我一起吃饭吧。
        - id: ch02-b13
          speaker: narrator
          text: 老田鼠看见这个冻坏的小东西，心里十分可怜她。她本性其实很善良，便把拇指姑娘请进温暖的屋子，同自己一起吃了一顿饭。相处以后，老田鼠越来越喜欢她，还答应让她留下来度过整个冬天。
        - id: ch02-b14
          speaker: field_mouse
          text: 你可以住下，不过要把屋子收拾干净，还得讲故事给我听。我最爱听故事了。
        - id: ch02-b15
          speaker: narrator
          text: 拇指姑娘把老田鼠交代的每一件事都认真做好，屋子收拾得整整齐齐，故事也讲得十分动听。不久，田鼠说自己正在等待一位客人。那位邻居每星期都会来拜访一次，家境比她富裕得多，屋子又宽又大，身上还总穿着一件漂亮的黑天鹅绒外套。
        - id: ch02-b16
          speaker: field_mouse
          text: 你要是能嫁给他，以后就什么也不愁了。虽然他看不见，你还是要把最好听的故事都讲给他听。
        - id: ch02-b17
          speaker: narrator
          text: 拇指姑娘听完，并没有把这门亲事放在心上，因为那位邻居不过是一只鼹鼠。后来，鼹鼠果然穿着黑天鹅绒外套来拜访她们。老田鼠见他来了，便当着拇指姑娘的面不停夸奖这位邻居。
        - id: ch02-b18
          speaker: field_mouse
          text: 他又富有，又有学问。房子比我的大二十倍。可惜他讨厌太阳和花，还总说它们不好，因为他从来没见过。
    - id: ch03
      title: 黑暗地道里的燕子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 拇指姑娘只得唱歌给鼹鼠听。她唱了《瓢虫，瓢虫，快回家！》，又唱了许多别的歌，声音美妙极了。鼹鼠听得爱上了她，却谨慎得一句也没有表露。不久以前，他新挖了一条长长的地道，从自己家一直通到邻居田鼠家，还大方地准许田鼠和拇指姑娘随时进去散步。
        - id: ch03-b02
          speaker: narrator
          text: 鼹鼠提醒她们，地道里埋着一只刚死不久的真鸟，有尖嘴，也有羽毛，不过用不着害怕。他叼着一块会像火一样发光的朽木，走在前面，替她们照亮又长又黑的地道。到了死鸟身边，他把宽鼻子顶在洞顶，拱出一个小洞，让日光照下来。路中央果然躺着一只燕子。他美丽的翅膀紧贴身体，头和爪子都缩在羽毛里，显然已经冻僵了。
        - id: ch03-b03
          speaker: narrator
          text: 拇指姑娘想起夏日里动听的鸟鸣，心里难过极了。鼹鼠却伸出弯腿，踢了燕子一脚。
        - id: ch03-b04
          speaker: mole
          text: 这下他再也唱不了啦。做小鸟真是可怜！幸亏我的孩子不是鸟。它们除了唱歌什么也不会，一到冬天就只能饿死。
        - id: ch03-b05
          speaker: field_mouse
          text: 您说得真有道理。鸟唱得再好又有什么用？冬天还不是要挨饿受冻，那滋味可真好受呢！
        - id: ch03-b06
          speaker: narrator
          text: 拇指姑娘一句话也没有说。等鼹鼠和田鼠从燕子身边走过去，她才悄悄落在后面，俯下身子，拨开盖住燕子脑袋的羽毛，轻轻吻了吻他紧闭的眼睛。她想到整个夏天里陪伴自己的歌声，心里越发难过。
        - id: ch03-b07
          speaker: thumbelina
          text: 也许，夏天为我唱歌的就是你。亲爱的小鸟，你给过我那么多快乐。
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: 鼹鼠把透光的洞重新封好，又护送两位女士回家。那天夜里，拇指姑娘躺在床上，怎么也睡不着。她索性起身，用一根根麦秆编成又大又厚的毯子，再费力地搬回地道，盖到燕子身上。她还从田鼠房里找到像棉花一样柔软的蓟花绒，厚厚地堆在燕子四周，好让可怜的小鸟暖暖和和地躺着。
        - id: ch03-b09
          speaker: thumbelina
          text: 再见了，漂亮的小鸟。谢谢你在树木青翠、阳光温暖的夏天，为我唱过那么美的歌。
          emotion: sad
        - id: ch03-b10
          speaker: narrator
          text: 说完，她把自己的小脑袋贴在燕子胸口，竟听见了微弱的心跳。这只鸟并没有死，只是冻僵了。如今，拇指姑娘一点点暖热了他的身体，他也正在慢慢苏醒。燕子原该在秋天飞往遥远的异乡，可有些燕子动身太迟，寒气会让它们从天上坠落，像死去一样躺着，随后再被大雪盖住。
        - id: ch03-b11
          speaker: narrator
          text: 拇指姑娘先是吓得发抖。燕子比只有一英寸高的她大得多。可她很快鼓起勇气，把绒毛堆紧，又把自己的被子盖到他头上。第二天夜里，她举着一块发光的朽木再来看他。燕子已经睁开了眼，只是还很虚弱。
        - id: ch03-b12
          speaker: swallow
          text: 谢谢你，漂亮的小姑娘。我现在真暖和！等力气恢复，我就能重新飞进温暖的阳光了。
          emotion: happy
        - id: ch03-b13
          speaker: thumbelina
          text: 外面还在下雪，冷得都结冰了。你留在暖和的床上吧，我来照顾你。
        - id: ch03-b14
          speaker: narrator
          text: 她用一片花瓣盛来水，燕子喝下以后，才把自己的遭遇告诉她。他的一边翅膀曾被荆棘划伤，再也飞不快了。别的燕子都飞往遥远的温暖国度，他却渐渐落在后面，最后筋疲力尽，从空中坠落下来。至于后来发生了什么，他一点儿也不记得。
        - id: ch03-b15
          speaker: narrator
          text: 整整一个冬天，燕子都藏在地道里。拇指姑娘悉心照料他，鼹鼠和田鼠一点儿也不知道，因为他们根本容不下这只可怜的小鸟。
        - id: ch03-b16
          speaker: narrator
          text: 春天终于来了，阳光重新温暖大地。燕子向拇指姑娘告别，她替他打开鼹鼠先前在洞顶拱出的洞口，灿烂的日光一下子洒在她身上。燕子请她坐到自己的背上，一起飞回远方绿色的树林。拇指姑娘多么想答应啊，可她又想到，老田鼠收留了她一个冬天，自己若是不告而别，对方一定会很伤心。
        - id: ch03-b17
          speaker: thumbelina
          text: 不，我不能跟你走。
          emotion: sad
        - id: ch03-b18
          speaker: swallow
          text: 再见了，亲爱又善良的小姑娘！
          emotion: sad
        - id: ch03-b19
          speaker: narrator
          text: 燕子唱着“啾，啾”，飞进了绿树林。拇指姑娘含泪望着他。她舍不得燕子，也过得很不快活。老田鼠不许她走进阳光。屋顶上的麦子越长越高，成了围困她的浓密森林。
    - id: ch04
      title: 地底婚礼前的告别
      blocks:
        - id: ch04-b01
          speaker: field_mouse
          text: 拇指姑娘，你要做新娘了！邻居已经向你求婚。你这样的穷孩子能交上这份好运，可要知足。快纺出做嫁妆的细麻布，鼹鼠太太该有的东西一样也不能少。
        - id: ch04-b02
          speaker: narrator
          text: 拇指姑娘只得从早到晚不停纺线。鼹鼠每天傍晚都会来看她，还说太阳眼下太热，已经把大地晒得像石头一样硬。等夏天一过，日光不再这样灼人，他们便举行婚礼。可拇指姑娘听着这些安排，一点儿也高兴不起来，因为她根本不喜欢这只愚蠢的鼹鼠。
        - id: ch04-b03
          speaker: narrator
          text: 每天早晨太阳升起时，每天傍晚太阳落下时，她都会偷偷走到门边。微风把高高的麦穗吹向两旁，她便能从缝隙里仰望蓝天。外面的世界该有多么明亮、多么美丽啊。她一心想再见到亲爱的燕子。可是燕子始终没有回来，想必已经飞到了很远很远的大绿树林里。
        - id: ch04-b04
          speaker: narrator
          text: 秋天，嫁妆终于备好了。老田鼠告诉她，四个星期后就要举行婚礼。
        - id: ch04-b05
          speaker: field_mouse
          text: 不准任性，不然我就用尖牙咬你！你的丈夫多么体面，连国王也没有他那样的天鹅绒外套。他的仓房和地窖都是满的，你应该感恩。
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 婚礼的日子终于到了。鼹鼠前来接她，要带她住进地底深处。从今以后，她再也不能回到温暖的太阳下，因为那正是鼹鼠最不喜欢的东西。拇指姑娘伤心极了，只求最后出去看一眼美丽的太阳。田里的麦子已经割完，地面只剩干枯的麦茬。她又向屋外走了一步，朝太阳伸出双臂，随后搂住长在那里的一朵小红花。
        - id: ch04-b07
          speaker: thumbelina
          text: 再见，明亮的太阳！再见！小红花，你见到亲爱的燕子时，请替我向他问好。
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: 忽然，她听见熟悉的“啾，啾”声。燕子正从头顶飞过。他看见拇指姑娘，高兴地落下来。她哭着告诉燕子，自己不愿嫁给丑鼹鼠，更不愿永远住在见不到阳光的地下。
        - id: ch04-b09
          speaker: swallow
          text: 冬天快来了，我也要飞往温暖的地方。你坐到我背上，我们一起离开丑鼹鼠和他的黑屋子，越过高山，飞到永远有阳光、永远开着花的国度。你曾在地道里救过我的命，现在跟我走吧。
        - id: ch04-b10
          speaker: thumbelina
          text: 好，我和你一起走！
          emotion: happy
        - id: ch04-b11
          speaker: narrator
          text: 拇指姑娘坐上燕子背，双脚踩住他展开的一边翅膀。他们飞过树林和海洋，越过终年积雪的高山。冷的时候，她钻进温暖的羽毛，只露出小脑袋，看着脚下辽阔的世界。
        - id: ch04-b12
          speaker: narrator
          text: 他们终于来到温暖的国度。这里的太阳更加明亮，天空仿佛也高了一倍。树篱上挂着最鲜嫩的绿色和紫色葡萄，树林里长着橙子和柠檬，香桃木与薄荷的气息飘在空中。漂亮的小孩子们在路上奔跑，追着色彩绚丽的大蝴蝶玩耍。可燕子并没有停下，他继续向前飞，沿途的景色也变得越来越美。
        - id: ch04-b13
          speaker: narrator
          text: 蔚蓝的湖边生着最华美的绿树，树下矗立着一座闪闪发光的白色大理石宫殿，在灿烂阳光里格外耀眼。藤蔓缠绕着一根根高高的石柱，檐下筑着许多燕巢。其中一个燕巢，正属于一路驮着拇指姑娘飞来的燕子。
        - id: ch04-b14
          speaker: swallow
          text: 我的家就在这里。可我住得太乱，你大概不会喜欢。下面有许多美丽的花，你选一朵安家吧。我送你下去，以后你想做什么都可以。
        - id: ch04-b15
          speaker: thumbelina
          text: 那真是太好了！
          emotion: happy
    - id: ch05
      title: 百花的王后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 地上倒着一根巨大的白色大理石柱，早已摔成三截，可石块之间却开满世上最美的白花。燕子带着拇指姑娘飞下去，把她轻轻放到一片宽阔的花瓣上。她低头一看，惊讶地发现花心里坐着一位小小的男子。他洁白透明，像玻璃做成，头戴最精巧的金王冠，肩上生着最美丽的翅膀，身量恰好和拇指姑娘一样小。
        - id: ch05-b02
          speaker: narrator
          text: 原来，每一朵花里都住着一位小小的男子或女子，他们全是花的精灵。而眼前这位头戴金冠、肩生双翼的小男子，正是所有花精的国王。
        - id: ch05-b03
          speaker: thumbelina
          text: 他长得多英俊呀！
          emotion: surprised
        - id: ch05-b04
          speaker: narrator
          text: 花精王子起先很怕燕子。对他这样小的人来说，燕子简直是个可怕的巨人。可当他看见拇指姑娘，心里只剩下欢喜，因为她是他一生见过的最美女孩。王子从头上取下自己的金王冠，轻轻戴到她头上。他先问了她的名字，随后又郑重地开口。
        - id: ch05-b05
          speaker: prince
          text: 你愿意做我的妻子，成为百花的王后吗？
        - id: ch05-b06
          speaker: narrator
          text: 这位高贵的王子与癞蛤蟆的儿子、穿黑天鹅绒外套的鼹鼠完全不同。拇指姑娘高兴地答应了他。每朵花里都走出一位精巧美丽的先生或女士，看着他们就是一种快乐。大家都给她送上礼物，其中最好的，是一双漂亮的翅膀。翅膀被安在她背上，从此，她也能从这一朵花飞到另一朵花了。
        - id: ch05-b07
          speaker: narrator
          text: 所有人都围着这对新人，祝他们永远幸福。燕子坐在上方的巢里，也使出全部本领，为他们唱起婚礼进行曲。他能唱得多好，就唱得多好。歌声那样动听，他心里却十分难过。一路走来，他早已那么喜爱拇指姑娘，实在不愿从此同她分开，也舍不得独自飞往远方。
        - id: ch05-b08
          speaker: prince
          text: 你不该再叫拇指姑娘了。这个名字不好听，而你生得这么美。以后，我们叫你五月花吧。
        - id: ch05-b09
          speaker: swallow
          text: 再见，再见！
          emotion: sad
        - id: ch05-b10
          speaker: narrator
          text: 小燕子怀着沉重的心情，向拇指姑娘告别，随后飞往更遥远的地方。他飞了很久很久，越飞越远，最后一直回到丹麦。在那里，他有一个小小的巢，筑在一扇窗户上方。窗里住着他的妻子，她会讲童话故事。燕子停在巢边，对她唱起“啾，啾”，把一路见到的事情全唱给她听。就这样，我们才知道了拇指姑娘的整个故事。
