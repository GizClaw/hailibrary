  chapters:
    - id: ch01
      title: The Tiny Girl and the Toads
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a woman who longed for a very tiny child, but she had no idea where to find one. At last she went to an old Witch for help.
        - id: ch01-b02
          speaker: woman
          text: I would dearly love to have a tiny little child. Can you tell me where I might find one?
        - id: ch01-b03
          speaker: witch
          text: Why, I have just the thing! Take this barley grain. It isn't the sort farmers plant or feed to their chickens. Put it in a flowerpot, and you'll soon see what it can do.
        - id: ch01-b04
          speaker: narrator
          text: The woman thanked her and paid the shilling it cost. At home, she planted the grain. At once, a large, lovely flower sprang up. It looked like a tulip, though its petals were still folded tight around the bud.
        - id: ch01-b05
          speaker: woman
          text: What a beautiful flower!
        - id: ch01-b06
          speaker: narrator
          text: She kissed its red and yellow petals, and the flower opened. It was a real tulip, like those seen every day. But there, in the center, sat a tiny, graceful girl on the soft green petals. She was barely half the length of a thumb, so the woman called her Thumbelina.
        - id: ch01-b07
          speaker: narrator
          text: Thumbelina slept in a polished walnut shell. Violet petals made her mattress, and a rose leaf covered her. By day she played on a table where the woman had set a bowl inside a ring of flowers, their stalks standing in the water. A wide tulip petal floated in the middle. Thumbelina sat on it and sailed from one side of the bowl to the other, rowing with two white horsehairs. It was a lovely sight. She could sing, too, more softly and sweetly than anyone had ever heard.
        - id: ch01-b08
          speaker: narrator
          text: One night, an old toad crawled in through a broken windowpane. She was ugly, clumsy, and clammy. She hopped onto the table and found Thumbelina asleep beneath her red rose leaf.
        - id: ch01-b09
          speaker: old_toad
          text: She would make a lovely wife for my son.
        - id: ch01-b10
          speaker: narrator
          text: The toad picked up the walnut-shell cradle with Thumbelina inside and carried it through the window into the garden. She lived with her son beside a wide stream with slippery, marshy banks. He was every bit as ugly and clammy as his mother. When he saw Thumbelina, he could say only one thing.
        - id: ch01-b11
          speaker: toad_son
          text: Croak, croak, croak!
        - id: ch01-b12
          speaker: old_toad
          text: Hush! You'll wake her, and she may escape. She's as light as a feather. We'll put her on a broad water-lily leaf out in the stream. It will be an island to someone so small, and she won't be able to run away while we prepare her room beneath the marsh.
        - id: ch01-b13
          speaker: narrator
          text: Many water lilies grew in the brook. Their broad green leaves looked as though they were swimming on the water. The largest leaf lay farthest from shore. The old toad swam out to it and left Thumbelina there in her walnut shell.
        - id: ch01-b14
          speaker: narrator
          text: Early the next morning, Thumbelina woke and saw water on every side. She could not reach land, and she began to cry bitterly.
        - id: ch01-b15
          speaker: narrator
          text: Below the marsh, the old toad decorated a room with rushes and yellow marigold leaves. She wanted everything to look grand for her new daughter-in-law. Then she and her son swam back. She meant to carry away the pretty cradle first and put it in the room before Thumbelina arrived. The old toad bowed low in the water.
        - id: ch01-b16
          speaker: old_toad
          text: This is my son. You are going to marry him and live splendidly with us beneath the marsh.
        - id: ch01-b17
          speaker: toad_son
          text: Croak, croak, croak!
        - id: ch01-b18
          speaker: narrator
          text: The toads picked up the neat little walnut-shell cradle and swam away with it. Thumbelina stayed behind, alone on the great green leaf. She wept because she did not want to live with the clammy old toad or marry her ugly son.
        - id: ch01-b19
          speaker: narrator
          text: Little fish beneath the water had seen the toads clearly and heard every word of their plan. They lifted their heads above the surface to look at Thumbelina. She was so pretty that they could not bear to let her be taken under the marsh. No, they would not allow it. The fish gathered around the green stalk beneath her leaf and nibbled it through.
        - id: ch01-b20
          speaker: narrator
          text: The cut leaf broke free and floated away, carrying Thumbelina far beyond the toads' reach. She sailed past several towns, and little birds in the bushes sang when they saw her.
        - id: ch01-b21
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: What a pretty little girl!
        - id: ch01-b22
          speaker: narrator
          text: The leaf drifted farther and farther downstream. Carried along by the flowing water, Thumbelina left her native land far behind.
    - id: ch02
      title: The Cockchafer and the Cold
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: A beautiful white butterfly fluttered over Thumbelina and settled on her leaf. He liked her, and she was delighted to have him there. The toads were far behind now, and the journey was beautiful. Sunlight sparkled on the water like bright silver.
        - id: ch02-b02
          speaker: narrator
          text: Thumbelina took off her sash. She tied one end around the butterfly and fastened the other to the leaf. With the butterfly pulling, the leaf glided faster than ever.
        - id: ch02-b03
          speaker: narrator
          text: Then a large cockchafer flew past. The moment he noticed Thumbelina, he caught her around the waist and carried her up into a tree. The green leaf kept floating downstream with the butterfly still tied to it, unable to get free.
        - id: ch02-b04
          speaker: narrator
          text: Thumbelina was terrified as the cockchafer carried her into the tree, but she worried even more about the white butterfly. She had tied him fast to the drifting leaf, and if he could not escape, he would starve. The cockchafer did not care about him. He sat Thumbelina on a broad green leaf and gave her honey from the flowers to eat.
        - id: ch02-b05
          speaker: cockchafer
          text: You are very pretty, even if you don't look anything like a cockchafer.
        - id: ch02-b06
          speaker: narrator
          text: Before long, the other cockchafers in the tree came to visit. They looked Thumbelina over from head to foot.
        - id: ch02-b07
          speaker: lady_chafer_1
          text: Why, she has only two legs. How dreadful!
        - id: ch02-b08
          speaker: lady_chafer_2
          text: And she hasn't any feelers!
        - id: ch02-b09
          speakers: [lady_chafer_1, lady_chafer_2, lady_chafer_3]
          ensemble: chorus
          text: She's ugly!
        - id: ch02-b10
          speaker: narrator
          text: In truth, Thumbelina was very pretty. The cockchafer who had stolen her had known that perfectly well. But after hearing all the ladies call her ugly, he began to think so too. He no longer wanted to keep her. He carried her down from the tree, placed her on a daisy, and said she could go wherever she pleased.
        - id: ch02-b11
          speaker: narrator
          text: Thumbelina sat there crying because the cockchafer had rejected her for being ugly. Yet she was as lovely as anyone could be, soft and delicate as the finest rose leaf.
        - id: ch02-b12
          speaker: narrator
          text: All summer, Thumbelina lived alone in the great wood. She wove a bed from blades of grass and hung it beneath a clover leaf to keep off the rain. She ate honey from the flowers and drank dew from the leaves each morning.
        - id: ch02-b13
          speaker: narrator
          text: Summer passed, and then autumn. At last came the long, cold winter. The singing birds flew away. The trees lost their leaves, the flowers died, and Thumbelina's sheltering clover leaf curled up until only a dry stalk remained.
        - id: ch02-b14
          speaker: narrator
          text: Her clothes were torn, and she was so tiny and thin that the cold went right through her. She seemed certain to freeze. Then the snow began to fall. To Thumbelina, who stood only an inch high, each snowflake struck like a whole shovelful of snow falling on one of us. She wrapped herself in a dead leaf, but it was split down the middle and gave no warmth. She shook with cold.
        - id: ch02-b15
          speaker: narrator
          text: Just beyond the wood was a large cornfield. The corn was long gone, leaving dry stubble in the frozen earth. To Thumbelina, those bare stalks were a forest. As she wandered among them, she found the door of a field mouse's home beneath a cornstalk.
        - id: ch02-b16
          speaker: narrator
          text: Inside her hole, the field mouse lived warm and comfortable. Her storeroom was full of corn, and she had a fine kitchen and dining room. Thumbelina had eaten nothing for two days, so she went to the door and begged for one small piece of barley.
        - id: ch02-b17
          speaker: field_mouse
          text: You poor little thing! Come into my warm room and have dinner with me.
        - id: ch02-b18
          speaker: narrator
          text: The field mouse was kindhearted underneath her fussy ways, and she soon grew fond of Thumbelina.
        - id: ch02-b19
          speaker: field_mouse
          text: You may stay here for the winter if you like. In return, keep my room neat and tell me stories. I do love a good story.
        - id: ch02-b20
          speaker: narrator
          text: Thumbelina did everything the old field mouse asked, and did it very well.
    - id: ch03
      title: The Swallow in the Tunnel
      blocks:
        - id: ch03-b01
          speaker: field_mouse
          text: I am expecting a visitor. My neighbor calls once a week. He is much richer than I am, with enormous rooms and a fine black velvet coat. If you could marry him, you would never want for anything. He is blind, though, so be sure to tell him your prettiest stories.
        - id: ch03-b02
          speaker: narrator
          text: Thumbelina took little interest in the visitor, because he was only a mole. Soon he arrived, wearing his black velvet coat.
        - id: ch03-b03
          speaker: field_mouse
          text: He is wonderfully rich and clever. His house is twenty times the size of mine. He cannot stand sunshine or beautiful flowers, though, and he has nothing good to say about them because he has never seen them.
        - id: ch03-b04
          speaker: narrator
          text: Thumbelina had to sing for him. She sang “Ladybird, ladybird, fly away home,” along with other songs. Her voice was so pretty that the mole fell in love with her. He did not tell her, though. He was a very cautious fellow.
        - id: ch03-b05
          speaker: narrator
          text: Not long before, the mole had dug a long underground passage from his own home to the field mouse's. He gave the field mouse and Thumbelina permission to walk through it whenever they wished. He warned them not to fear the dead bird lying in the passage. It was a real bird with a beak and feathers. It must have died only a short time before and now lay buried where the mole had made his tunnel.
        - id: ch03-b06
          speaker: narrator
          text: When they went to see the passage, the mole led the way. He carried a piece of rotten wood in his mouth, because it glowed like fire in the dark and lit their path through the long tunnel. When they reached the place where the bird lay, he pressed his broad nose against the roof and pushed open a hole. Daylight streamed down into the passage.
        - id: ch03-b07
          speaker: narrator
          text: A swallow lay in the middle of the path. His beautiful wings were pressed close against his sides, and his head and claws were tucked beneath his feathers. The poor bird seemed to have died from the cold. Thumbelina felt deeply sorry for him. She loved all the little birds. They had sung and twittered so beautifully to her through the summer.
        - id: ch03-b08
          speaker: narrator
          text: The mole kicked the swallow with his short, crooked legs.
        - id: ch03-b09
          speaker: mole
          text: He won't be singing anymore! What a miserable thing it must be to live as a little bird. I'm thankful none of my children will be birds. They always starve in winter.
        - id: ch03-b10
          speaker: field_mouse
          text: That is very sensibly said. What good are all a bird's songs once winter comes? It can only starve and freeze. A pleasant life indeed!
        - id: ch03-b11
          speaker: narrator
          text: Thumbelina said nothing. When the mole and the field mouse walked on, she bent over the swallow, gently moved the feathers away from his head, and kissed his closed eyes.
        - id: ch03-b12
          speaker: thumbelina
          text: Perhaps you were one of the birds who sang to me so sweetly last summer. Your songs gave me so much joy, dear little bird.
        - id: ch03-b13
          speaker: narrator
          text: The mole closed the opening that let in the daylight and escorted the two ladies home. But Thumbelina could not sleep that night. She got out of bed and wove a large blanket from straw. Then she carried it into the tunnel and spread it over the swallow. She found thistledown in the field mouse's room, soft as cotton, and piled it around him so the poor little bird could lie warmly buried.
        - id: ch03-b14
          speaker: thumbelina
          text: Farewell, pretty little bird. Thank you for your beautiful summer songs, when the trees were green and the warm sun shone on us.
        - id: ch03-b15
          speaker: narrator
          text: She rested her head against the swallow's heart. He was not dead. The cold had frozen him, but her care had begun to warm him back to life.
        - id: ch03-b16
          speaker: narrator
          text: Swallows fly to distant countries in autumn. A few start too late. The cold overcomes them, and they fall as if dead before the snow covers them.
        - id: ch03-b17
          speaker: narrator
          text: Thumbelina trembled with fear when she felt the swallow's heart beating. Compared with a girl only an inch high, he was enormous. Still, she gathered her courage. She tucked the down more closely around him and placed her own rose-leaf cover over his head.
        - id: ch03-b18
          speaker: narrator
          text: The next night, she crept back into the tunnel. The swallow was alive, though still very weak. He opened his eyes for a moment and saw Thumbelina holding a piece of glowing wood, the only lantern she had.
        - id: ch03-b19
          speaker: swallow
          text: Thank you, pretty little child. I am wonderfully warm now. Soon I will be strong again, and then I can fly out into the warm sunshine.
        - id: ch03-b20
          speaker: thumbelina
          text: Oh, no, it is bitterly cold outside! The snow is falling, and everything is frozen. Stay here in your warm bed. I will look after you.
        - id: ch03-b21
          speaker: narrator
          text: Thumbelina brought him water in a flower petal, and he drank it. Then he told her what had happened. A bramble had torn one of his wings. He could not fly as fast as the other swallows, and they had gone far ahead toward warmer lands. At last he dropped to the ground from exhaustion. He remembered nothing after that.
        - id: ch03-b22
          speaker: narrator
          text: The swallow stayed in the tunnel all winter. Thumbelina cared for him tenderly until he grew strong. The mole and the field mouse never knew, for neither of them could bear the poor bird.
        - id: ch03-b23
          speaker: narrator
          text: At last spring came, and the sun warmed the earth again. Thumbelina opened the hole the mole had made in the roof, and bright sunlight poured down on her. The swallow said goodbye. Before leaving, he asked Thumbelina to come with him into the green wood. She could sit safely on his back.
        - id: ch03-b24
          speaker: narrator
          text: Thumbelina dearly wanted to sit on the swallow's back and fly far away to the green wood. But she thought of the old field mouse. The mouse would be sad if Thumbelina suddenly ran away, and so she decided she could not leave.
        - id: ch03-b25
          speaker: thumbelina
          text: No, I must not go with you.
          emotion: sad
        - id: ch03-b26
          speaker: swallow
          text: Farewell, dear, good little girl!
          emotion: sad
        - id: ch03-b27
          speaker: narrator
          text: The swallow flew into the sunshine. Thumbelina watched him go with tears in her eyes, because she had grown very fond of him.
        - id: ch03-b28
          speaker: swallow
          text: Tweet, tweet!
        - id: ch03-b29
          speaker: narrator
          text: He disappeared into the green wood, leaving Thumbelina very unhappy.
    - id: ch04
      title: The Mole's Proposal
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Thumbelina was not allowed to step outside into the warm sunshine. Above the field mouse's home, the newly planted corn grew higher and higher into the air. To the poor little girl, who stood only an inch tall, it became a thick forest.
        - id: ch04-b02
          speaker: field_mouse
          text: Thumbelina, you are going to be a bride! Our neighbor has asked to marry you. What luck for a poor child like you! Start spinning the linen for your dowry at once. Nothing can be missing when you become the mole's wife.
        - id: ch04-b03
          speaker: narrator
          text: Thumbelina had to sit and spin from morning until night. The mole visited every evening. He told her that the summer sun was now so fierce that it baked the earth as hard as stone. Once summer ended, he said, the sun would lose its heat. Then they would hold the wedding.
        - id: ch04-b04
          speaker: narrator
          text: Thumbelina was not happy. She disliked the foolish mole. Each morning at sunrise and each evening at sunset, she slipped to the doorway. Whenever the breeze parted the tall ears of corn, she caught a glimpse of blue sky. She thought of the bright world outside and longed to see her dear swallow again. But he never came. He must have flown far into the great green wood.
        - id: ch04-b05
          speaker: narrator
          text: By autumn, Thumbelina had finished her dowry.
        - id: ch04-b06
          speaker: field_mouse
          text: Your wedding is only four weeks away! Don't be stubborn, or I shall bite you with my sharp white teeth. You are getting a fine husband. Not even the King owns a velvet coat like his, and his storeroom and cellar are full. You ought to be grateful.
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: At last the wedding day arrived. The mole came to take Thumbelina away to his home deep underground. Once she lived there, she would never come out into the warm sun again, because the mole could not bear it. Thumbelina was heartbroken. Now she had to say goodbye to the beautiful sunlight forever.
        - id: ch04-b08
          speaker: narrator
          text: The corn had been harvested, and only dry stubble remained. Thumbelina stepped outside and reached her arms toward the sunlight.
        - id: ch04-b09
          speaker: thumbelina
          text: Farewell, bright sun! Farewell, farewell!
          emotion: sad
        - id: ch04-b10
          speaker: narrator
          text: She put her arms around a little red flower growing nearby.
        - id: ch04-b11
          speaker: thumbelina
          text: If you ever see my dear swallow, please give him my love.
          emotion: sad
        - id: ch04-b12
          speaker: narrator
          text: Just then, a familiar sound reached her ear.
        - id: ch04-b13
          speaker: swallow
          text: Tweet, tweet!
        - id: ch04-b14
          speaker: narrator
          text: Thumbelina looked up. The swallow was flying overhead. He was overjoyed to see her. Through her tears, she told him that she did not want to marry the ugly mole and spend the rest of her life underground, where the sun never shone.
        - id: ch04-b15
          speaker: swallow
          text: Winter will soon be here, and I must fly to warmer lands. Will you come with me? Sit on my back, and we'll leave the ugly mole and his dark house far behind. We'll cross the mountains and reach a country where the sun shines brighter, summer never ends, and flowers bloom all year. Please come, dear Thumbelina. You saved my life when I lay frozen in that dark tunnel.
        - id: ch04-b16
          speaker: thumbelina
          text: Yes, I will go with you!
          emotion: happy
        - id: ch04-b17
          speaker: narrator
          text: Thumbelina climbed onto the swallow's back and placed her feet on one of his outspread wings. Then he rose into the air.
    - id: ch05
      title: Away to the Warm Lands
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: They flew high over woods and seas, then above great mountains where snow lay all year. Whenever the icy air made Thumbelina cold, she crept beneath the swallow's warm feathers. Only her tiny head stayed outside, so she could gaze down at all the beautiful sights in the world below.
        - id: ch05-b02
          speaker: narrator
          text: At last they reached the warm lands. The sun shone more brightly there, and the sky seemed twice as high. Fine green and purple grapes hung in the hedges. Oranges and lemons grew in the woods, and the air smelled of myrtle and mint. Along the roads, pretty little children ran about and played with great, splendid butterflies.
        - id: ch05-b03
          speaker: narrator
          text: Still the swallow flew farther, and everything around them became more and more beautiful. Beside a blue lake, beneath magnificent green trees, stood a shining castle of white marble. Vines climbed and curled around its tall pillars. Swallows had built many nests among them, and one of those nests belonged to the swallow who carried Thumbelina.
        - id: ch05-b04
          speaker: swallow
          text: Here is my home. But you would not be happy living with me, because I am far too untidy for you. Choose a home in one of those lovely flowers below. I will carry you down, and then you may do whatever you wish.
        - id: ch05-b05
          speaker: thumbelina
          text: That would be wonderful!
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: Thumbelina clapped her little hands. Nearby, a great white marble column had fallen and broken into three pieces. Beautiful white flowers grew between them. The swallow carried her down and placed her on one broad leaf.
    - id: ch06
      title: The Queen of the Flowers
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: To Thumbelina's astonishment, a tiny man sat in the middle of the flower. He was as white and clear as if he had been made of glass. A beautiful golden crown rested on his head, and shining wings rose from his shoulders. He was no bigger than Thumbelina herself.
        - id: ch06-b02
          speaker: narrator
          text: He was the spirit of the flower. A tiny man or woman lived inside every blossom, and this one was King over them all.
        - id: ch06-b03
          speaker: thumbelina
          text: How handsome he is!
        - id: ch06-b04
          speaker: narrator
          text: She whispered the words to the swallow. At first the little Prince was frightened, because the swallow looked like a giant beside him. Then he saw Thumbelina, and he was delighted. She was the most beautiful girl he had ever seen.
        - id: ch06-b05
          speaker: narrator
          text: The Prince took the golden crown from his head and placed it on hers. Then he asked her name. He asked whether she would become his wife and reign beside him as Queen of all the flowers.
        - id: ch06-b06
          speaker: narrator
          text: This Prince was nothing like the toad's son or the mole in his black velvet coat.
        - id: ch06-b07
          speaker: thumbelina
          text: Yes, I will marry you.
          emotion: happy
        - id: ch06-b08
          speaker: narrator
          text: From every flower came a tiny lady or gentleman, each so lovely that it was a pleasure to see them. One by one, they brought gifts for Thumbelina. The finest gift of all was a beautiful pair of wings. They fastened the wings to her back, and now she could fly from one flower to another.
        - id: ch06-b09
          speaker: narrator
          text: Everyone wished her joy. High above them, the swallow sat in his nest and sang the wedding march as well as he could. Yet he was sad. He loved Thumbelina dearly and did not want to part from her.
        - id: ch06-b10
          speaker: prince
          text: You will not be called Thumbelina anymore. That name is much too plain for someone so pretty. From now on, we will call you May Blossom.
        - id: ch06-b11
          speaker: swallow
          text: Farewell, farewell!
          emotion: sad
        - id: ch06-b12
          speaker: narrator
          text: With a heavy heart, the little swallow flew on to distant lands. Farther and farther he went, all the way back to Denmark. There he had a small nest above a window. His wife lived beyond that window, and she knew how to tell fairy stories.
        - id: ch06-b13
          speaker: swallow
          text: Tweet, tweet!
        - id: ch06-b14
          speaker: narrator
