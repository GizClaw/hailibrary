audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    golden_prince:
      display_name: 黄金岛王子
      tts:
        delivery: 真挚勇敢，身处绝境仍有坚定的少年意气
        timbre: 清朗明亮
        pace: 适中而有起伏
        pitch: 中音
    rose_king:
      display_name: 玫瑰岛国王
      tts:
        delivery: 慈爱庄重，悲伤中保留国王的威严
        timbre: 苍老厚重
        pace: 稍缓
        pitch: 中低音
    rosalie:
      display_name: 罗莎莉
      tts:
        delivery: 温柔坚定，悲苦中不失清醒与勇气
        timbre: 清澈柔和
        pace: 适中
        pitch: 中高音
    sky_prince:
      display_name: 天空王子
      tts:
        delivery: 骄纵急切，恳求时热烈，受挫时阴沉暴躁
        timbre: 华亮而冷峻
        pace: 稍快
        pitch: 中音
    dwarf_prince:
      display_name: 侏儒王子
      tts:
        delivery: 多愁而执着，说到爱情时痛苦深切
        timbre: 低柔微哑
        pace: 稍缓
        pitch: 中低音
    dwarf_friend:
      display_name: 侏儒王子的朋友
      tts:
        delivery: 关切坦率，劝说时理智而诚恳
        timbre: 温和清晰
        pace: 适中
        pitch: 中音
    young_man:
      display_name: 园中青年
      tts:
        delivery: 深情忧郁，说起失去爱情时带着不安
        timbre: 年轻柔和
        pace: 稍缓
        pitch: 中音
    sea_king:
      display_name: 海洋之王
      tts:
        delivery: 粗暴残忍，以威吓和折磨他人为乐
        timbre: 低沉如雷
        pace: 缓慢有压迫感
        pitch: 低音
  chapters:
    - id: ch01
      title: 天空王子与玫瑰岛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一位仙女，掌管大地、海洋、火焰和天空。她有四个儿子。长子聪敏活泼，想象力丰富，母亲认为火是最高贵的元素，就让他做了火焰之王。次子反应有些迟缓，却很有智慧，做事也谨慎，因此得到了大地。第三个儿子身躯巨大，性情粗野凶蛮。母亲以他的缺陷为耻，便让他统治海洋，想把那些缺陷藏起来。最小的儿子任性善变，后来成了天空王子。
        - id: ch01-b02
          speaker: narrator
          text: 天空王子年纪最小，也最受宠爱。可仙女并没有因此看不见他的弱点。她预见儿子有一天会坠入情网，为爱情吃尽苦头，便认定最好的办法是从小教他憎恶女人。让她万分欣慰的是，王子年岁越长，这份厌恶也越深。他听惯了爱情给王子们招来灾祸的故事，又听母亲把可怜的小爱神说得无比可怕，毫不费力就相信世间所有邪恶都是爱神惹出来的。仙女不讲这些时，就想方设法让儿子爱上狩猎。
        - id: ch01-b03
          speaker: narrator
          text: 狩猎果然成了王子最大的乐趣。仙女特意造了一片森林，种上华美的树木，把四方的动物都放进林中，还在中央建起一座举世无双的宫殿。她以为这样足以让任何王子满足。可是，人终究躲不过自己的命运。母亲天天责骂爱神，天空王子早就听烦了。一天，仙女外出办事，临走再三叮嘱他绝不能离开领地。她一走，王子反倒立刻决定违抗母命。
        - id: ch01-b04
          speaker: narrator
          text: 他独自待得无聊，便命天空精灵送自己去邻国的宫廷。那个王国坐落在玫瑰岛上。那里四季温和，青草常绿，鲜花常香。海浪不拍打礁石，只在岸边轻轻化开。金色灌木铺满大地，葡萄藤被果实压弯了腰。
        - id: ch01-b05
          speaker: narrator
          text: 岛上的国王有个女儿，名叫罗莎莉，比世上任何姑娘都美。天空王子第一眼看见她，就忘掉了从出生以来听过的一切可怕预言。母亲筹划多年的防备，往往一瞬间便会彻底落空。王子立刻盘算该怎样得到自己的幸福，而他想到的最便捷、也最野蛮的办法，就是命随从的精灵把罗莎莉掳走。
        - id: ch01-b06
          speaker: narrator
          text: 国王失去女儿，日夜哭泣。他唯一的安慰，是向一位刚到宫廷的陌生王子诉说悲痛。他并不知道，这个年轻人也见过罗莎莉，也早已深深爱上了她。一天，国王满面愁容地沿海岸走着，身边只有陌生王子陪伴。两人沉默了很久，年轻人终于开口。
        - id: ch01-b07
          speaker: golden_prince
          text: 世上总有办法补救一场灾祸。只要您答应把女儿嫁给我，我就去把她带回您身边。
        - id: ch01-b08
          speaker: rose_king
          text: 你只是在拿空话安慰我。我亲眼看见她被卷上天空。她拼命呼喊，那声音谁听了都会心软，偏偏打动不了抢走她的野蛮人。我的孩子如今不知在哪片陌生土地上受苦，那里也许从没有人去过。我恐怕再也见不到她了。不过，慷慨的陌生人，你去吧。你若真能带回罗莎莉，就和她永远幸福地住在这里。我现在便宣布，你是这个国家的继承人。
          emotion: sad
    - id: ch02
      title: 魔法石与远行
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 罗莎莉的父亲还不知道，这位陌生人正是黄金岛的王子。黄金岛的都城从一片海伸到另一片海。平静的海水洗着覆满黄金的城墙，远远望去，就像金黄的沙岸。墙上方长着连成一片的橙树和柠檬树，城里的每条街道也都铺着黄金。
        - id: ch02-b02
          speaker: narrator
          text: 黄金岛国王只有这一个儿子。王子出生时，预言说他一生会遇到无数奇事，国王和王后听了非常害怕。恰好有位仙女在场。她为了宽慰两人，变出一颗小石子，要他们等王子长大再交给他。只要把石子含在嘴里，人就会隐去身形，但绝不能开口，否则石子会失去全部魔力。仙女希望它能帮助王子躲过危险。
        - id: ch02-b03
          speaker: narrator
          text: 王子才刚长大，就想看看别的国家是否也像故乡一样辉煌。他借口巡视父亲的几座小岛，乘船出了海。一场可怕的风暴把船刮到陌生海岸，大多数随从都被野人杀死。王子靠魔法石隐去身形，从野人中间穿过，逃回海边，又登上自己的船。
        - id: ch02-b04
          speaker: narrator
          text: 他重新登船以后，最先看见的陆地就是玫瑰岛，于是立刻去了罗莎莉父王的宫廷。他第一眼见到公主，也和所有人一样爱上了她。王子带着这份爱留在宫中好几个月，直到天空王子突然把罗莎莉卷走。全岛的男人都陷入悲痛和绝望，可在这么多伤心人中，黄金岛王子才真正是悲痛欲绝。他日夜哀叹自己的失落，无论别人怎样安慰，也无法减轻他的痛苦。
        - id: ch02-b05
          speaker: golden_prince
          text: 难道我再也见不到美丽的公主了吗？谁知道她在哪儿，又落到了怎样的仙人手里？我只是凡人，可爱情给了我力量。就算寻遍整个世界，我也一定要找到她。
          emotion: sad
        - id: ch02-b06
          speaker: narrator
          text: 说完，他便离开宫廷，踏上旅途。他疲惫地走了许多天，始终没有公主的消息。一天清晨，他穿过茂密的森林，看见松树大道尽头立着一座宏伟宫殿。想到罗莎莉也许就关在那里，他的心猛地跳起来，立刻加快了脚步。
        - id: ch02-b07
          speaker: narrator
          text: 宫殿的大门由整块玛瑙制成，见他走近，竟自行转开。他穿过三重庭院，每座庭院四周都有深沟环绕，沟中流水潺潺，岸边飞着羽毛鲜艳的鸟。这里处处珍奇华美，王子却几乎不曾抬眼。他心里只有罗莎莉，只想知道该到哪里寻找她。他推开一扇又一扇门，搜遍一个又一个角落，既没见到公主，也没碰见任何人。
        - id: ch02-b08
          speaker: narrator
          text: 最后只剩一片小树林。林中有座用橙树搭成的厅堂，四角各连着一间小屋。前三间只有雕像和奇珍。走进第四间，隐身王子终于看见了罗莎莉。可天空王子正跪在她脚边，苦苦求她回心转意。罗莎莉只是摇头。
        - id: ch02-b09
          speaker: rosalie
          text: 不。你把我从深爱的父亲身边抢走，就算把世间所有荣华都给我，也安慰不了我。走开！我永远只会憎恨你，鄙视你。
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: 她说完便转身回房，并不知道隐身王子已跟在身后。王子怕旁人在场时惊动她，决定等到天黑。漫长的几个时辰里，他写下一首献给公主的诗，放在她床边。他一心想着救走罗莎莉，最后决定等天空王子每年探望母亲和兄长时再动手。
    - id: ch03
      title: 看不见的重逢
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天，罗莎莉独自在房中想着自己的苦难。书桌上的一支笔忽然自己立起来，在白纸上写起字。她不知道有只看不见的手正握着笔，自然惊讶万分。笔一停，她马上走到桌边，看到纸上是一首动人的诗。
        - id: ch03-b02
          speaker: narrator
          text: 诗里说，无论她经受怎样的悲苦，都有另一个人和她一同承受。那个人全心全意爱着她，若不能把她从所憎恨的男子手中救出去，便绝不会停下。诗中的话给了罗莎莉勇气。虽然她不知道对方是谁，还是把自己的全部遭遇讲给这个看不见的人听，又说起父亲宫中曾经来过一位年轻的陌生人。
        - id: ch03-b03
          speaker: rosalie
          text: 他的模样深深迷住了我。从见到他的那天起，我心里就再也容不下别人。
        - id: ch03-b04
          speaker: narrator
          text: 王子听到这里，再也忍不住了。他吐出含在口中的石子，扑倒在罗莎莉脚边。两人终于重逢，狂喜不已。等心情稍稍平静，他们便商量怎样逃出天空王子的掌控。可这件事并不容易，一颗魔法石每次只能让一个人隐身。若要救罗莎莉，黄金岛王子就必须把石子交给她，让自己暴露在敌人的怒火下。公主无论如何也不同意。
        - id: ch03-b05
          speaker: rosalie
          text: 不行，王子。你既然来了，这座岛对我就不再是牢狱。况且有位仙女一直庇护你，每年这时，她都会去你父王的宫廷。你马上去找她，请她再赐给你一颗同样的石子。有了它，我们要逃出去就不难了。
        - id: ch03-b06
          speaker: narrator
          text: 几天后，天空王子从母亲的宫殿回来，隐身王子已经上路了。可他完全忘了来时的方向，在森林里迷失许久。等他终于回家，那位仙女已经离开。他再悲痛也只能等她下次来，让罗莎莉多受三个月折磨。想到这里，他绝望得几乎要立刻返回囚禁公主的地方。
        - id: ch03-b07
          speaker: narrator
          text: 一天，他沿林间小径散步，看见一棵大橡树从树干中间裂开，两位王子走了出来，边走边认真交谈。黄金岛王子含着石子，他们看不见他，以为四下无人，便毫不压低声音。
        - id: ch03-b08
          speaker: dwarf_friend
          text: 怎么，你真要永远被这段注定没有结果的痴情折磨吗？你统治着整个王国，难道就没有别的事能让你满足？
        - id: ch03-b09
          speaker: dwarf_prince
          text: 做侏儒王子有什么用？母亲统治四大元素又有什么用？我还是得不到阿让蒂娜公主的爱。自从看见她坐在森林的鲜花中间，我没有一天、一个夜晚不想她。可我很清楚，她永远不会在意我。
          emotion: sad
        - id: ch03-b10
          speaker: dwarf_prince
          text: 我的宫中有一座岁月之室。第一间的巨镜照出过去，第二间让人看见现在，第三间能读到未来。我见过阿让蒂娜以后，就躲进那里察看。镜中没有她的爱情，只有她对我的轻蔑。明知命运如此，我还是爱她。你说，我的心意该有多深？
          emotion: sad
        - id: ch03-b11
          speaker: narrator
          text: 黄金岛王子听得欢喜极了，因为阿让蒂娜正是他的妹妹。他希望借妹妹对侏儒王子的影响，请侏儒王子帮忙，从兄长手中救出罗莎莉。他兴冲冲赶回父亲的宫殿，果然见到了那位仙女朋友。仙女立刻又给了他一颗一模一样的魔法石。
        - id: ch03-b12
          speaker: narrator
          text: 王子一刻也不肯耽搁，马上赶去营救罗莎莉。他一路疾行，很快回到囚禁她的森林。宫殿还在，公主却不见了。他从上到下找遍宫殿，仍看不到她的踪影，绝望得恨不得死去千百次。最后，他想起两位王子谈过的岁月之室。只要回到那棵橡树，走进映照现在的房间，就一定能查出罗莎莉的下落。
        - id: ch03-b13
          speaker: narrator
          text: 幸好，王子很快找到密道机关，走进映照现在的房间。镜中，罗莎莉正坐在地上哭泣，许多精灵日夜守着她，一步也不离开。
    - id: ch04
      title: 绝望仙女的岛
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 镜中的景象让王子更痛苦了。他不知道那座城堡在哪里，也不知道该往何处寻找。可他已下定决心，即使走遍全世界，也一定要找到那里。他趁顺风扬帆出海，命运却仍不放过他。陆地刚从眼前消失，一场猛烈的风暴便突然袭来。
        - id: ch04-b02
          speaker: narrator
          text: 船在浪里颠簸几个时辰，最后撞上礁石，摔得粉碎。王子抓住一根漂浮的桅杆，才没有沉下去。他和风浪搏斗很久，终于被冲上一座陌生小岛。刚刚登岸，他就听见最凄厉的哭号，其中又混着他一生听过的最美妙的歌声，心中十分惊讶。
        - id: ch04-b03
          speaker: narrator
          text: 王子的好奇心立刻被勾了起来。他小心地循声走去，直到看到两条巨龙守在树林入口。巨龙可怕极了，满身覆盖着闪亮的鳞片，卷曲的长尾一直拖向远处的陆地，嘴和鼻孔都喷着烈焰，那双眼睛连最勇敢的人看了也会发抖。王子隐着身，巨龙看不见他，他便从它们身旁溜进了树林。
        - id: ch04-b04
          speaker: narrator
          text: 林中竟是一座迷宫。他绕了很久，没遇见一个人，只看到一圈手从地下伸出来，露出手腕。每只手腕都戴着金镯，上面写着名字。越往深处走，王子越好奇。最后，两具尸体横在柏树小径中央，拦住了他。死者颈上各系一条猩红细绳，手臂上也有镯子，刻着他们自己和两位公主的名字。
        - id: ch04-b05
          speaker: narrator
          text: 王子认出两名死者是故乡附近两座大岛的国王，却从未听过金镯上那两位公主的名字。他为两人的不幸命运难过，立刻动手挖墓安葬他们。谁知尸身才放进墓穴，两人的手便猛地伸出土面，露出手腕以上的部分，和迷宫里那些同伴的手一样，直挺挺地留在外面。
        - id: ch04-b06
          speaker: narrator
          text: 王子想着这桩怪事继续前行。走到小径拐角，他看见一个高个男子满脸痛苦，双手握着一条和死者颈上一模一样的丝绳。再走几步，那人遇到另一个同样痛苦的男子。两人默默拥抱，什么也没说，便各自把绳子套上脖子，并肩倒地死去。
        - id: ch04-b07
          speaker: narrator
          text: 王子急忙冲过去，拼命想解开绳结，却怎么也松不开。他只能把两人也埋葬起来，随后继续赶路。此时他已经明白，岛上有可怕的魔法，自己必须万分小心。他从巨龙身边溜出去时，心里实在庆幸。
        - id: ch04-b08
          speaker: narrator
          text: 接着，他走进一座美丽的园林。园中清泉流淌，鲜花芬芳，到处都是年轻男女。可王子忘不了刚才在迷宫中看到的恐怖景象，急切地想找到线索，解开这个谜团。他注意到一对年轻人正在交谈，便悄悄走近几步，想听听能否从他们的话中弄明白那件怪事。果然，那位青年说出了答案。
        - id: ch04-b09
          speaker: young_man
          text: 你发誓会爱我到死，可我怕你的心会变。我总觉得，自己很快就得去找绝望仙女了。她统治这座岛的一半，专门带走那些被爱人抛弃、不愿再活下去的人。她把他们关进迷宫，让他们永远走下去，手上戴着镯子，颈上系着绳子，直到遇见另一个同样痛苦的人。
        - id: ch04-b10
          speaker: young_man
          text: 两人一相遇，绳子就会收紧，他们当场倒下，要等第一个路过的人把他们埋葬。这种死法虽然可怕，可要是失去了你的爱，死也比活着甜美。
          emotion: fearful
        - id: ch04-b11
          speaker: narrator
          text: 看到这对幸福的恋人，王子反而更加悲伤。他整天沿海岸游荡，打发时光。一天，他坐在礁石上哀叹自己无法离岛。忽然，大海像是升到了天边，洞穴里响起骇人的尖叫。他抬头一看，一个女人从海底冲出来，发狂似的逃跑，身后有个暴怒的巨人紧追不舍。
        - id: ch04-b12
          speaker: narrator
          text: 女人的哭喊让王子心软了。他吐出石子，拔剑追向巨人，想替她争取逃走的时间。可他刚靠近，巨人便用手上的戒指碰了碰他。王子顿时僵住，动弹不得。巨人追上女人，一把抱住她，带着她沉进海里，又派来几个海神，把黄金岛王子牢牢锁住。王子也被拖向深海，以为自己再也见不到罗莎莉了。
    - id: ch05
      title: 海底的囚徒
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 王子贸然攻击的巨人，正是元素女王的第三个儿子，海洋之王。他用戒指碰过王子，那戒指能让凡人在水下生活。黄金岛王子被海神用锁链捆住后，才知道戒指的力量。他们押着王子，穿过奇异怪兽的住处，又穿过辽阔无边的海藻森林。
        - id: ch05-b02
          speaker: narrator
          text: 最后，他们来到一片辽阔的巨大沙地，四周耸立着一座座嶙峋的岩石。在所有岩石中，有一块比其余的都高。巨人高高坐在那块岩石顶上，仿佛那块岩石就是他的王座。王子被海神一路拖到他面前，海洋之王从高处俯视着这个鲁莽闯来的凡人。
        - id: ch05-b03
          speaker: sea_king
          text: 鲁莽的凡人，你本来该死。不过，我偏要留下你的命，让你受更残酷的折磨。去吧，和那些供我取乐、任我折磨的人待在一起！
          emotion: angry
        - id: ch05-b04
          speaker: narrator
          text: 话音一落，王子发现自己已被锁在一块岩石上。四周还拴着许多王子和公主，他们也都是巨人掳来的俘虏。这个巨人最大的乐趣，就是在海上掀起风暴，好让自己的囚徒越来越多。
        - id: ch05-b05
          speaker: narrator
          text: 王子的双手被牢牢缚住，没法取出和使用魔法石，只能日夜思念罗莎莉。终于有一天，巨人忽然想挑选几个俘虏，让他们互相搏斗，供自己取乐。他命众人抽签，其中一支恰好落在黄金岛王子身上。王子的锁链立刻被解开。他的身体刚一自由，就抓起石子放进口中，转眼隐去了身形。
        - id: ch05-b06
          speaker: narrator
          text: 巨人眼看王子突然消失，惊讶极了，立刻命人严守所有通道。可惜已经太迟，王子早从两块岩石中间溜走了。他在海底森林里走了很久，身边尽是可怕的怪兽。他翻过一块又一块岩石，从一株水中巨木摸到另一株，终于来到海岸边的一座大山脚下。
        - id: ch05-b07
          speaker: narrator
          text: 这座山，正是王子在映照现在的房间里见过的那座。罗莎莉就被囚禁在山中。王子满心欢喜，登上这座直插云端的高山，在山顶找到一座宫殿。他走进宫殿，又在长廊中央找到一间水晶屋。
        - id: ch05-b08
          speaker: narrator
          text: 罗莎莉坐在水晶屋正中，精灵们日夜守着她。屋子没有门，也没有窗。王子束手无策，不知道怎样才能让公主知道自己回来了。罗莎莉从清晨一直哭到黄昏，王子看着她，心都快碎了。
    - id: ch06
      title: 水晶屋外的逃亡
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 一天，罗莎莉在屋里来回走动，发现水晶墙上忽然蒙起一层雾气，像是有人对着墙呵了口气。更奇怪的是，她走到哪里，哪里的水晶就失去光泽。公主仅凭这一点，便猜到恋人已经回来。
        - id: ch06-b02
          speaker: narrator
          text: 为了让天空王子不再戒备，她先对他表现得很和善，这样再提出减轻囚禁的请求，也不会立刻遭到拒绝。起初，她只请求每天在长廊里走一个时辰，天空王子答应了。隐身王子很快抓住机会，把石子递到她手里。罗莎莉立刻将它含入口中，消失不见。
        - id: ch06-b03
          speaker: narrator
          text: 天空王子发现公主不见了，顿时暴怒。他命令天空精灵飞遍所有地方，不管罗莎莉躲在哪里，都必须把她抓回来。精灵们领命，立刻分散到大地各处。
        - id: ch06-b04
          speaker: narrator
          text: 这时，罗莎莉和隐身王子正手牵着手，走向长廊尽头的一扇门。穿过门外的露台，就能进入花园。他们不敢出声，悄悄往前走，以为已经安全。谁知一个暴怒的怪物无意间撞上两人，罗莎莉受惊，松开了王子的手。
        - id: ch06-b05
          speaker: narrator
          text: 隐身的人一开口，石子就会失去魔力。他们又知道精灵就在附近，稍有一点声音便会暴露行踪。两个人什么也做不了，只能伸手向四下摸索，盼望彼此的手能够再次相遇。可自由带来的快乐没能维持多久。罗莎莉在森林里徒劳地来回寻找，始终找不到王子，最后停在一眼泉水旁。
        - id: ch06-b06
          speaker: narrator
          text: 她一路在树干上留下话，要是爱人经过，就请别人告诉他，她住在这里。她每天都会坐在泉边，让自己的眼泪流进泉水。这些话被一个精灵看见，精灵马上回去告诉主人。天空王子也隐去身形，由精灵领到泉边，等着罗莎莉前来。
        - id: ch06-b07
          speaker: narrator
          text: 罗莎莉一走近，天空王子便伸出一只手。她以为那是恋人的手，急切地握住。天空王子趁机用绳子捆住她的双臂，随后现出身形，命精灵把她拖进最深的地穴。
        - id: ch06-b08
          speaker: narrator
          text: 隐身王子恰在这时赶到。他看见天空王子飞上天空，手中牵着一条丝绳，立刻明白绳子另一端带走的就是罗莎莉。绝望彻底压倒了他。有那么一刻，他甚至想结束自己的生命。
        - id: ch06-b09
          speaker: golden_prince
          text: 遭受了这么多不幸，我还怎么活下去？我以为苦难终于结束了，没想到现在比从前更糟。我该怎么办？我永远也找不到那个怪物把罗莎莉藏在了哪里。
          emotion: sad
        - id: ch06-b10
          speaker: narrator
          text: 这个不幸的年轻人已经决定任由自己死去，而他的悲痛也几乎真能要了他的命。就在这时，他忽然想到，也许能借助岁月之室，查出公主被囚禁的地方。这个念头终于给了他一点安慰。他继续穿过森林，走了几个小时，来到一座神殿门前。
        - id: ch06-b11
          speaker: narrator
          text: 门口守着两头巨狮。王子隐着身，平安走进神殿。中央有一座祭坛，坛上放着一本书，后面垂着巨大的帷幕。他走过去翻开书，里面记着世上所有恋人的姓名。他从书中读到，天空王子把罗莎莉关进了一座深渊。那里只有一个入口，必须经过黄金泉才能进去。
        - id: ch06-b12
          speaker: narrator
          text: 可王子根本不知道黄金泉在哪里。按理说，他和罗莎莉的距离并没有缩短多少，他自己却不这么想。
        - id: ch06-b13
          speaker: golden_prince
          text: 也许我每走一步，反而离她更远。可只要知道她还活在世上的某个地方，我就已经非常感激了。
          emotion: calm
    - id: ch07
      title: 黄金泉与归途
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 隐身王子离开神殿，面前出现六条穿过树林的小路。他正站在那里犹豫，不知道该选哪一条，忽然看到两个人沿着最右边的小径朝他走来。来者正是侏儒王子和他的朋友。隐身王子突然很想打听妹妹阿让蒂娜公主的消息，便悄悄跟在他们身后，偷听两人的谈话。
        - id: ch07-b02
          speaker: dwarf_prince
          text: 你以为我有办法，却不肯挣脱这条锁链吗？我明知道阿让蒂娜公主永远不会爱我，可每过一天，她在我心里反而比前一天更亲爱。更可怕的是，我总觉得她已经爱上了别人。
          emotion: sad
        - id: ch07-b03
          speaker: dwarf_prince
          text: 所以我要借黄金泉结束这份痛苦。只要把一滴泉水落在旁边的沙地上，它就会写出我情敌的名字，也就是她爱的人。我害怕这个考验，可我越害怕，就越相信自己的不幸是真的。
          emotion: fearful
        - id: ch07-b04
          speaker: narrator
          text: 隐身王子听完，像影子一样紧紧跟着他。走了一阵，他们终于来到黄金泉。不幸的恋人叹了口气，俯身用手指蘸起泉水，把一滴水珠滴在沙上。水珠立刻写出火焰王子的名字，那正是侏儒王子的兄长。这个答案给他的打击太重，他当场昏倒在朋友怀里。
        - id: ch07-b05
          speaker: narrator
          text: 与此同时，隐身王子一心盘算着怎样救出罗莎莉。自从被海洋之王的戒指碰过，他既能在陆地生活，也能在水里呼吸，于是马上跳进黄金泉。他看到角落有扇门通往山腹。山脚下立着一块高岩，岩石上钉着铁环，环中系着一条绳子。
        - id: ch07-b06
          speaker: narrator
          text: 王子立刻猜到，绳子锁住的正是公主。他拔剑一挥，将绳索斩断。就在那一刻，他感觉罗莎莉的手握进自己掌中。天空王子不断苦苦哀求，要她现出身形，罗莎莉却一直把魔法石含在口中，始终没有吐出。
        - id: ch07-b07
          speaker: narrator
          text: 隐身王子和罗莎莉就这样手牵着手，一同翻过大山。可公主不像王子那样能在水中生活，因此没法穿过黄金泉。两个人嘴里都含着石子，既不能开口说话，也看不见彼此，只好在泉边紧紧依偎，不敢松开对方。天空王子狂怒之下掀起一场可怕的暴风雨，他们被风雨困在那里，冷得浑身发抖。
        - id: ch07-b08
          speaker: narrator
          text: 风暴持续了许多天。忽然，一股可怕的热浪席卷而来。闪电接连划破天空，雷声轰鸣，火球从天而降，烧毁大片森林，甚至连田野里的庄稼也化成了灰烬。转眼之间，就连溪流也彻底干涸了。王子立刻抓住这个难得的机会，牵着公主越过已经干涸的黄金泉。
        - id: ch07-b09
          speaker: narrator
          text: 此后，他们又走了很久很久，终于回到美丽而辉煌的黄金岛。可以肯定，从那以后，他们再也不愿离开那里了。
