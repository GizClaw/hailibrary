  chapters:
    - id: ch01
      title: The Prince of the Air
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a fairy who ruled over earth, sea, fire, and air. She had four sons. Her eldest was quick, lively, and full of imagination, so she made him Lord of Fire, the element she considered noblest. Her second son was rather dull, but his wisdom and good judgment made up for it, and she gave him the earth to govern.
        - id: ch01-b02
          speaker: narrator
          text: Her third son was a wild, savage giant. His mother was ashamed of his faults and hoped to hide them by making him King of the Seas. The youngest was ruled by his passions and could change his temper without warning. He became Prince of the Air.
        - id: ch01-b03
          speaker: narrator
          text: The youngest was his mother's favorite, but she saw his weaknesses clearly. She believed that falling in love would one day cause him terrible pain. To protect him, she raised him to fear and dislike all women. From childhood on, he heard story after story about princes ruined by love. His mother painted Cupid as such a dreadful creature that the boy soon believed love was the source of every evil.
        - id: ch01-b04
          speaker: narrator
          text: When she was not warning him against women, the fairy taught him to love hunting. It became his greatest pleasure. She created a new forest for him, filled it with magnificent trees, and set loose animals from every corner of the world. In its center she built a palace more beautiful than any other. After that, she felt she had given a prince everything he could need for happiness.
        - id: ch01-b05
          speaker: narrator
          text: Yet no one can fight his fate forever. Deep down, the Prince grew tired of hearing the same warnings. One day his mother left the palace on business and begged him not to leave the grounds. He seized the chance to disobey her.
        - id: ch01-b06
          speaker: narrator
          text: Alone and bored, he quickly forgot her advice. He ordered spirits of the air to carry him to the court of a neighboring king. That kingdom lay on the Island of Roses, where the grass was always green and every flower smelled sweet. The waves seemed to fade softly against the shore. Golden shrubs covered the land, and heavy bunches of grapes bent the vines low.
        - id: ch01-b07
          speaker: narrator
          text: The island's king had a daughter named Rosalie, lovelier than any girl in the world. The moment the Prince of the Air saw her, every warning he had heard since birth vanished from his mind. Years of careful teaching were undone in an instant. He decided that the quickest way to make himself happy was to order his spirits to carry Rosalie away.
        - id: ch01-b08
          speaker: narrator
          text: Her father wept for her day and night. His only comfort was speaking of his loss with an unknown young prince who had recently arrived at court. The King did not know how deeply the stranger cared for Rosalie. He, too, had seen her and fallen in love.
        - id: ch01-b09
          speaker: narrator
          text: One day the grieving King walked beside the sea with the stranger. After a long silence, the young man spoke.
        - id: ch01-b10
          speaker: prince_of_golden_isle
          text: Every trouble must have some remedy. Promise me Rosalie's hand in marriage, and I will bring her home to you.
        - id: ch01-b11
          speaker: king_of_roses
          text: You are trying to comfort me with an empty promise. I saw her swept into the air. Her cries would have softened anyone except the cruel creature who stole her. She may be wasting away in a land no man has ever reached. I fear I will never see her again. Still, go, generous stranger. If you can bring Rosalie back, marry her and live happily here. From this moment, I name you my heir.
          emotion: sad
        - id: ch01-b12
          speaker: narrator
          text: Rosalie's father knew nothing of the stranger's name or rank. In truth, he was the only son of the King of the Golden Isle. Its capital stretched from one sea to another. Quiet water washed walls covered in gold, bright as yellow sand. Orange and lemon trees formed a living rampart above them, and even the streets were paved with gold.
    - id: ch02
      title: The Magic Pebble
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At the Prince's birth, a life of adventure had been foretold for him. His parents were so frightened that a friendly fairy tried to comfort them. She produced a small pebble and told them to keep it for their son. If he put it in his mouth, he would become invisible. But he had to remain silent, for the stone would lose its magic the moment he tried to speak. The fairy hoped it would protect him from every danger.
        - id: ch02-b02
          speaker: narrator
          text: As soon as the Prince began to leave boyhood behind, he longed to know whether other countries were as splendid as his own. He claimed he was only visiting some small islands that belonged to his father, then sailed away. A terrible storm drove his ship onto an unknown shore. Savages killed most of his followers, but the Prince escaped by using the pebble. Invisible, he passed right through their midst and wandered back to the coast, where he boarded his ship again.
        - id: ch02-b03
          speaker: narrator
          text: The next land he saw was the Island of Roses. He went straight to its court, saw Rosalie, and fell in love with her as everyone did. He had spent several months there when the Prince of the Air carried her off. Every man on the island grieved, but the Prince of the Golden Isle could not be consoled. Day and night, he mourned her loss.
        - id: ch02-b04
          speaker: prince_of_golden_isle
          text: Will I never see my lovely Princess again? Who knows where she is, or what fairy is holding her? I am only a man, but my love is strong. I will search the whole world until I find her.
          emotion: sad
        - id: ch02-b05
          speaker: narrator
          text: With that, he left the court and prepared for his journey. He traveled for many exhausting days without hearing one word about Rosalie. Then, one morning in a thick forest, he saw a magnificent palace at the end of a pine avenue. His heart leaped. Perhaps he was looking at her prison.
        - id: ch02-b06
          speaker: narrator
          text: He hurried to a gate made from a single piece of agate. It swung open before him. Beyond it were three courtyards, each surrounded by a deep ditch of running water. Brilliant birds flew along the banks. Everything was rare and beautiful, but the Prince hardly looked. He searched every room and opened every door, thinking only of Rosalie. Still, he found no one.
        - id: ch02-b07
          speaker: narrator
          text: One place remained. In a small wood stood a hall made entirely of orange trees, with a room opening from each corner. Three rooms held only statues and marvelous objects. In the fourth, the invisible Prince found Rosalie. His joy faded when he saw the Prince of the Air kneeling at her feet and begging her to love him. Rosalie only shook her head.
        - id: ch02-b08
          speaker: rosalie
          text: I refuse. You tore me away from the father I love. All the splendor in the world cannot comfort me for that. Go away. I can feel nothing for you except hatred and contempt.
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: She turned from him and entered her own rooms. Without her knowing, the invisible Prince followed. He feared she might discover him while others were near, so he waited quietly for darkness. During those long hours, he wrote Rosalie a poem and left it beside her bed. Then he planned her rescue. He decided to act during the yearly visit the Prince of the Air made to his mother and brothers.
        - id: ch02-b10
          speaker: narrator
          text: One day Rosalie sat alone, thinking over her troubles. A pen suddenly rose from her desk and began writing by itself on a white sheet of paper. She stared in amazement. When the pen stopped, she hurried to read the lovely verses. They said that someone shared her sorrow, loved her with all his heart, and would never rest until he freed her from the man she hated.
        - id: ch02-b11
          speaker: narrator
          text: Encouraged by the message, Rosalie told the unseen writer her whole story. She also spoke of a young stranger who had arrived at her father's palace. His face had charmed her so deeply that she had thought of no one else since that day. The Prince could hold himself back no longer. He took the pebble from his mouth, became visible, and threw himself at Rosalie's feet.
        - id: ch02-b12
          speaker: narrator
          text: Once their first joy had passed, they began planning how to escape the Prince of the Air. The task was not simple. One pebble could hide only one person. To save Rosalie, the Prince would have to reveal himself and face his enemy's fury. Rosalie refused to allow it.
        - id: ch02-b13
          speaker: rosalie
          text: No, Prince. Now that you are here, this island no longer feels like a prison. A fairy who protects you visits your father's court at this season. Go and find her at once. Beg her for another stone with the same power. Once we each have one, nothing will stand in the way of our escape.
    - id: ch03
      title: The Cabinets of the Years
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Prince of the Air returned from his family's palace a few days later, but the invisible Prince had already gone. On his journey home, he could not remember the path he had taken through the forest. He was lost for so long that the fairy had left before he reached the Golden Isle. There was nothing he could do but wait for her next visit while Rosalie suffered three more months in captivity.
        - id: ch03-b02
          speaker: narrator
          text: The thought nearly drove him to despair. He was close to turning back toward Rosalie's prison when he saw an enormous oak split open along its trunk. Two princes stepped out, deep in conversation. Because the pebble hid him, they thought they were alone and spoke freely.
        - id: ch03-b03
          speaker: prince_gnome_friend
          text: Must you go on suffering for a love that can never end well? You have an entire kingdom. Is there truly nothing in it that can make you content?
        - id: ch03-b04
          speaker: prince_gnome
          text: What good is it to be Prince of the Gnomes, with a mother who rules all four elements, if I cannot win Princess Argentine's love? I saw her once among the flowers in the forest, and I have thought of her every hour since. I love her, though I know she will never care for me.
          emotion: sad
        - id: ch03-b05
          speaker: prince_gnome
          text: You know the three cabinets of the years in my palace. Great mirrors show the past in the first, the present in the second, and the future in the third. After I saw Argentine, I went there to learn my fate. The future showed me only her scorn. Yet even knowing that, I cannot stop loving her.
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: This was wonderful news to the invisible listener. Princess Argentine was his own sister. He hoped her influence over Prince Gnome might persuade that prince's brother to release Rosalie. He hurried back to his father's palace and found the friendly fairy there. She immediately gave him a second magic pebble.
        - id: ch03-b07
          speaker: narrator
          text: He wasted no time. Traveling as fast as he could, he reached the forest where Rosalie had been held. The palace was still there, but she was gone. He searched from top to bottom and found no trace of her. His despair grew so terrible that again and again he felt ready to end his life.
        - id: ch03-b08
          speaker: narrator
          text: Then he remembered the cabinets of the years. If he could return to the oak, the mirrors might show him what had happened. Luckily, he soon discovered the secret entrance. In the cabinet of the present, he saw Rosalie reflected in the glass. She sat on the floor, weeping bitterly, while genii guarded her every hour of the day and night.
        - id: ch03-b09
          speaker: narrator
          text: The vision made him more miserable, because it did not tell him where the castle stood. Still, he resolved to search the whole world. He sailed away with a good wind, but his bad fortune followed him. Before the land had disappeared, a violent storm struck. For hours the ship was driven helplessly about, until it smashed to pieces on the rocks.
        - id: ch03-b10
          speaker: narrator
          text: The Prince caught a floating beam and held on through a long struggle with wind and waves. At last he was thrown onto a strange island. As he reached the shore, he heard cries of terrible anguish mixed with the sweetest songs he had ever known. Curious, he moved forward carefully and found two huge dragons guarding the entrance to a wood.
        - id: ch03-b11
          speaker: narrator
          text: Glittering scales covered their bodies. Their curling tails stretched far across the ground. Fire shot from their mouths and noses, and their eyes could make the bravest person tremble. But they could not see the invisible Prince. He slipped between them and entered the wood.
    - id: ch04
      title: The Island of Despair
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At once the Prince found himself in a labyrinth. He wandered a long time without meeting anyone. All he saw at first was a circle of human hands rising from the earth above the wrists. Each hand wore a golden bracelet engraved with a name. Farther in, two dead men lay in a cypress walk. Scarlet cords circled their necks. Their bracelets bore their own names and the names of two princesses.
        - id: ch04-b02
          speaker: narrator
          text: The Prince recognized the dead men as kings of two large islands near his home, though he did not know the princesses' names. Grieving for them, he buried both bodies. As soon as he finished, their hands pushed up through the soil and remained there among the others.
        - id: ch04-b03
          speaker: narrator
          text: He went on, wondering at everything he had seen. Around a bend came a tall man whose face was filled with misery. He carried a silken cord as red as the cords around the dead kings. A few steps later, he met another man just as wretched. Without speaking, the two embraced, placed the cords around their own throats, and fell dead side by side.
        - id: ch04-b04
          speaker: narrator
          text: The Prince rushed to help them and struggled to undo the cords, but the knots would not loosen. He buried the men and continued on, now certain that he must be cautious or fall victim to the same enchantment.
        - id: ch04-b05
          speaker: narrator
          text: He passed the dragons again and entered a lovely park filled with clear streams, sweet flowers, and crowds of young men and women. The horrors of the labyrinth remained in his mind. Hoping for an explanation, he moved close to two young people who were talking.
        - id: ch04-b06
          speaker: despairing_prince
          text: You swear you will love me until death, but I am afraid your heart will change. Then I will have to seek Fairy Despair, who rules half this island. She takes lovers whose sweethearts have rejected them and who no longer wish to live. She shuts them in that labyrinth forever, with a bracelet on each arm and a cord around each neck.
          emotion: fearful
        - id: ch04-b07
          speaker: despairing_prince
          text: They wander until they meet someone whose misery equals their own. Then the cords tighten, and both fall where they stand. They lie there until a stranger buries them. That death is terrible, but if I lost your love, it would seem sweeter than living.
          emotion: fearful
        - id: ch04-b08
          speaker: narrator
          text: Seeing so many happy lovers only deepened the Prince's grief. He spent his days wandering beside the sea. One day he sat on a rock, mourning his fate and the impossibility of leaving the island. Suddenly the sea seemed to rise almost to the sky, and hideous screams rang through the caves.
        - id: ch04-b09
          speaker: narrator
          text: A woman rose from the water, fleeing wildly from a furious giant. Her cries touched the Prince's heart. He removed the stone from his mouth, drew his sword, and rushed at the giant to give her time to escape. Before he could strike, the giant touched him with a ring. The Prince froze where he stood.
        - id: ch04-b10
          speaker: narrator
          text: The giant caught the woman, seized her in his arms, and plunged her beneath the sea. Then he ordered tritons to chain the Prince of the Golden Isle. They carried him down into the ocean, and he lost all hope of ever seeing Rosalie again.
    - id: ch05
      title: Beneath the Sea
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The giant was Lord of the Sea, third son of the Queen of the Elements. His ring had given the mortal Prince the power to live underwater. Bound by the tritons, the young man was carried past the homes of strange monsters and through immense forests of seaweed. At last they reached a vast plain of sand enclosed by towering rocks. The giant sat like a king on the tallest one.
        - id: ch05-b02
          speaker: lord_of_sea
          text: Reckless mortal, you deserve to die. Instead, you will live and suffer something crueler. Take your place among the prisoners it pleases me to torment.
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: At his command, the Prince was chained to a rock. He was not alone. Princes and princesses were fastened all around him, captives the giant had collected. The Lord of the Sea delighted in creating storms simply to add more prisoners.
        - id: ch05-b04
          speaker: narrator
          text: With his hands bound, the Prince could not reach his magic pebble. He passed every day and night thinking of Rosalie. At last the giant decided to amuse himself by making some captives fight. Lots were drawn, and the Prince's name was chosen. His chains were removed at once.
        - id: ch05-b05
          speaker: narrator
          text: The moment his hands were free, he snatched up the pebble and vanished. The giant stared in astonishment, then ordered every passage guarded. He was too late. The Prince had already slipped between two rocks.
        - id: ch05-b06
          speaker: narrator
          text: For a long time the invisible Prince wandered through underwater forests filled with frightening monsters. He climbed one rock after another and found his way from tree to tree. At last he reached the edge of the sea beneath a mountain he recognized. He had seen it in the cabinet of the present. Rosalie was imprisoned there.
        - id: ch05-b07
          speaker: narrator
          text: Joyfully, he climbed the mountain until he pierced the clouds and found a palace at its summit. Inside a long gallery stood a room made of crystal. Rosalie sat in its center, watched night and day by genii. The room had no door and no window. The Prince could not imagine how to tell her he had returned, and it broke his heart to watch her weep from morning until night.
    - id: ch06
      title: Lost in the Forest
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: One day Rosalie paced back and forth inside the room. To her surprise, a patch of the crystal wall turned cloudy, as if someone had breathed on it. Wherever she moved, the cloud followed. That was enough to make her suspect that her lover had returned.
        - id: ch06-b02
          speaker: narrator
          text: To put the Prince of the Air at ease, Rosalie began treating him graciously. Then she asked him to make her captivity a little less severe. Her first request was simple. She wanted permission to walk in the long gallery for one hour each day. He granted it.
        - id: ch06-b03
          speaker: narrator
          text: During one of those walks, the invisible Prince placed the second stone in her hand. Rosalie slipped it into her mouth and vanished. Her captor flew into a fury. He commanded every spirit of the air to search all space and bring Rosalie back, wherever she might be. At once they scattered across the whole earth.
        - id: ch06-b04
          speaker: narrator
          text: Meanwhile, Rosalie and the Prince moved hand in hand through a gallery door, across a terrace, and into the gardens. They glided silently on and already thought themselves safe. Then a furious monster crashed into them by accident. Rosalie was so frightened that she released the Prince's hand.
        - id: ch06-b05
          speaker: narrator
          text: Neither one could speak while invisible. They also knew the spirits were everywhere and would recognize them at the smallest sound. All they could do was reach through the air, hoping their hands would meet again.
        - id: ch06-b06
          speaker: narrator
          text: Their freedom did not last long. After wandering through the forest in vain, Rosalie stopped beside a fountain. As she searched, she carved a message into the trees.
        - id: ch06-b07
          speaker: rosalie
          text: If my beloved Prince comes this way, tell him that I live here now. Every day I sit beside this fountain and mix my tears with its water.
          emotion: sad
        - id: ch06-b08
          speaker: narrator
          text: One of the genii read the words and reported them to his master. The Prince of the Air made himself invisible and waited by the fountain. When Rosalie came near, he held out his hand. She eagerly took it, believing she had found her lover. He used that moment to bind her arms with a cord. Then he became visible and ordered his spirits to drag her into the deepest pit.
        - id: ch06-b09
          speaker: narrator
          text: At that very moment, the invisible Prince arrived. He saw the ruler of the genii rising through the air with a silken cord in his hand and understood at once that Rosalie was being carried away.
        - id: ch06-b10
          speaker: narrator
          text: Despair overwhelmed him. For a moment, he thought of ending his life.
        - id: ch06-b11
          speaker: prince_of_golden_isle
          text: How can I survive so much misery? I thought my troubles were over, but now they are worse than before. What can I do? I will never discover where that monster has hidden Rosalie.
          emotion: sad
        - id: ch06-b12
          speaker: narrator
          text: He had decided to let himself die, and his grief alone might have killed him. Then he remembered the cabinets of the years. Perhaps they could reveal Rosalie's new prison. That thought gave him one small ray of comfort, and he kept walking through the forest.
        - id: ch06-b13
          speaker: narrator
          text: After several hours, he reached a temple guarded by two enormous lions. Invisible, he passed them safely. An altar stood in the center. A book lay upon it, with a great curtain hanging behind. The Prince opened the book and found the names of every lover in the world. It told him that the Prince of the Air had taken Rosalie to an abyss whose only entrance was through the Fountain of Gold.
        - id: ch06-b14
          speaker: narrator
          text: He had no idea where the fountain was. Even so, he did not feel as helpless as before.
        - id: ch06-b15
          speaker: prince_of_golden_isle
          text: Each step I take may carry me farther from her, but at least I know she is alive somewhere.
    - id: ch07
      title: The Fountain of Gold
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: When the Prince left the temple, six paths stretched into the woods. He was trying to choose among them when two people approached along the path farthest to his right. They were Prince Gnome and his friend. Eager for news of his sister Argentine, the invisible Prince followed and listened.
        - id: ch07-b02
          speaker: prince_gnome
          text: Do you think I would not break these chains if I could? I know Argentine will never love me, yet she grows dearer to me every day. Worse still, I believe she loves someone else. I have decided to end my torment at the Golden Fountain.
          emotion: sad
        - id: ch07-b03
          speaker: prince_gnome
          text: One drop of its water on the sand will write the name of the man she loves. I dread learning the truth. But the very fact that I fear the test convinces me I am right.
          emotion: fearful
        - id: ch07-b04
          speaker: narrator
          text: After hearing this, the invisible Prince followed Prince Gnome as closely as a shadow. Before long, they reached the Golden Fountain. The unhappy lover sighed, dipped one finger into the water, and let a drop fall onto the sand. It wrote the name of Prince Flame, his own brother. The discovery struck Prince Gnome so hard that he fainted into his friend's arms.
        - id: ch07-b05
          speaker: narrator
          text: While they stood there, the invisible Prince considered how to free Rosalie. Since the Lord of the Sea's ring had given him the power to live in water, he dived straight into the fountain. In one corner he found a door that led inside the mountain.
        - id: ch07-b06
          speaker: narrator
          text: At the mountain's foot stood a high rock with an iron ring fixed to it. A cord was tied to the ring. The Prince guessed that Rosalie was chained at its other end. He drew his sword and cut it. At once he felt her hand slip into his. Despite every plea from the Prince of the Air, she had kept the pebble in her mouth and remained invisible.
        - id: ch07-b07
          speaker: narrator
          text: Hand in hand, the invisible lovers crossed the mountain. But Rosalie could not live underwater, so she could not pass through the Golden Fountain. Unable to speak or be seen, they clung together at its edge. Around them raged the terrible storm the Prince of the Air had raised in his fury.
        - id: ch07-b08
          speaker: narrator
          text: The storm continued for many days. Then a tremendous heat spread through the land. Lightning flashed and thunder crashed. Bolts of fire fell from the sky, burning forests and fields of grain. In a single moment, even the streams dried up. The Prince seized his chance and carried Rosalie across the empty Golden Fountain.
        - id: ch07-b09
          speaker: narrator
          text: Their journey to the Golden Isle was still long. But at last they reached it, and we may be certain that neither of them ever wished to leave again.
