audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的机智与克制, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    scotsman:
      display_name: 苏格兰人
      tts: {delivery: 疲惫谨慎，说话务实, timbre: 坚实成熟, pace: 适中, pitch: 中低音}
    irishman:
      display_name: 爱尔兰人
      tts: {delivery: 勇敢热诚，心直口快, timbre: 活泼成熟, pace: 明快, pitch: 中音}
    princess:
      display_name: 公主
      tts: {delivery: 亲切诚恳，意志坚定, timbre: 明亮柔和, pace: 适中, pitch: 中高音}
    attacker_1:
      display_name: 袭击者甲
      tts: {delivery: 粗暴凶狠，咄咄逼人, timbre: 粗哑低沉, pace: 急促, pitch: 低音}
    attacker_2:
      display_name: 袭击者乙
      tts: {delivery: 冷酷蛮横，声声催逼, timbre: 干涩阴沉, pace: 急促, pitch: 中低音}
    attacker_3:
      display_name: 袭击者丙
      tts: {delivery: 暴躁强硬，不容违抗, timbre: 尖利阴沉, pace: 稍快, pitch: 中音}
    fair_haired_lad:
      display_name: 金发少年
      tts: {delivery: 礼貌平静，心思隐秘, timbre: 轻盈年轻, pace: 适中, pitch: 中高音}
    first_old_man:
      display_name: 第一位老人
      tts: {delivery: 好客深思，带着久远岁月的沉静, timbre: 深厚苍老, pace: 舒缓, pitch: 低音}
    second_old_man:
      display_name: 第二位老人
      tts: {delivery: 和善耐心，愿意相助, timbre: 醇和苍老, pace: 舒缓, pitch: 低音}
    bird_master:
      display_name: 百鸟之主
      tts: {delivery: 威严好奇，从容果断, timbre: 洪亮苍老, pace: 适中, pitch: 中低音}
    eagle:
      display_name: 大鹰
      tts: {delivery: 强悍直率，沉着自信, timbre: 宽厚有力, pace: 适中, pitch: 低音}
    hen_wife:
      display_name: 养鸡妇
      tts: {delivery: 朴实爽直，耳聪目明, timbre: 温暖苍老, pace: 适中, pitch: 中音}
  chapters:
    - id: ch01
      title: 沉睡的城堡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，苏格兰人、英格兰人和爱尔兰人一起在军中服役。三个人早就一心想逃，只等第一个机会。机会一来，他们果然逃了。他们在一片大森林里走了整整两天，一口吃的、一口喝的也没有，沿途连一所房子都没见到。林中有野兽出没，每到夜里，他们只好爬上树，在高高的枝头过夜。
        - id: ch01-b02
          speaker: narrator
          text: 第二天早晨，苏格兰人从树顶望见远处有一座大城堡。他心里很明白，要是继续困在森林里，只吃一点草根，自己很快就会送命。于是一下树，他便独自朝城堡走去，连自己看见了什么都没告诉同伴。也许这两天的饥饿和苦难已经改变了他们。只要自己能够活命，谁也不再管别人会落得什么下场。
        - id: ch01-b03
          speaker: narrator
          text: 他走了大半天，来到城堡时，天色已经很晚。可所有的门都关着，烟囱里也没有一缕炊烟。他失望透顶，以为自己终究逃不过一死，便躺到墙边。就在这时，高处忽然有一扇窗打开了。他连忙抬头，看见窗前站着一位女子，美得胜过他平生见过的任何人。
        - id: ch01-b04
          speaker: scotsman
          text: 啊，一定是命运把你送来救我的！
        - id: ch01-b05
          speaker: princess
          text: 确实是命运。你需要什么，又为什么来到这里？
        - id: ch01-b06
          speaker: scotsman
          text: 我是走投无路才来的。我没吃没喝，眼看就要没命了。
        - id: ch01-b07
          speaker: princess
          text: 那就进来吧。这里吃的喝的多得很。
        - id: ch01-b08
          speaker: narrator
          text: 女子让他进了城堡，先打开一间屋子，摆出食物让他吃。等他填饱肚子，又领他来到一间更大的屋子。里面躺着许多沉睡的男人。苏格兰人走到一张空床边，躺了下来，很快也睡得和他们一样沉。
        - id: ch01-b09
          speaker: narrator
          text: 再说森林里的两个人。夜幕降临，野兽出来活动的时候又到了。英格兰人碰巧爬上苏格兰人望见城堡时待过的那棵树。天刚蒙蒙亮，他便朝四面八方张望，也看见了那座城堡。他没有对爱尔兰人说一个字，独自悄悄走了。到了城堡，他的遭遇和苏格兰人一模一样。
        - id: ch01-b10
          speaker: narrator
          text: 可怜的爱尔兰人孤零零留在林中，根本不知道两个同伴去了哪里，只能又悲伤又凄凉地待在原地。夜晚来临，他也爬上那棵树。天一亮，他同样望见了城堡，于是马上朝那里动身。
        - id: ch01-b11
          speaker: narrator
          text: 爱尔兰人赶到城堡时，那里没有火光，也不见一个活人的影子。没过多久，头顶的窗户打开了。他抬头看见那位美丽的女子，便问她能不能给自己一点吃的喝的。女子亲切又爽快地答应了，只请他进门。他当然愿意，立刻走进一间华美的屋子。那里摆着一张床，床帐的每个环扣上都挂着钻石戒指。端来的饮食，也是他从没见过的珍馐美味。屋里的奇景叫他看得入迷，竟然忘了自己还饿着肚子，一口也没动。女子见状，便问他究竟还想要什么。
        - id: ch01-b12
          speaker: irishman
          text: 先告诉我，你是谁，从哪里来，又是谁把你留在这里。要不然，我什么也不吃。
        - id: ch01-b13
          speaker: princess
          text: 我是一位中了魔法的公主。父王答应，谁能救我，生前就分给他三分之一的国土，死后让他继承整个王国，还把我嫁给他。我在这里待了十六年。你是第一个问我是谁的人，其他来过的男人全睡在楼下的大屋里。我觉得，你就是能救我的人。
        - id: ch01-b14
          speaker: irishman
          text: 那你快说，我怎样才能解除魔法？
        - id: ch01-b15
          speaker: princess
          text: 城堡里有一间小屋。只要一个男人连续三晚从十点守到午夜，我就能恢复自由。
        - id: ch01-b16
          speaker: irishman
          text: 这个人你找到了。我来守。
    - id: ch02
      title: 三个可怕的夜晚
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 公主随即给了他一只烟斗和一些烟草，爱尔兰人便走进那间小屋。没过多久，门外就响起一阵猛砸乱敲的声音。外面的那些家伙声声催逼，命令他马上把门打开。
        - id: ch02-b02
          speakers: [attacker_1, attacker_2, attacker_3]
          ensemble: chorus
          text: 把门打开！
          emotion: angry
        - id: ch02-b03
          speaker: irishman
          text: 我偏不开。
        - id: ch02-b04
          speaker: narrator
          text: 下一刻，门板猛地飞进来，那些家伙也跟着冲进了屋。他们把爱尔兰人打倒在地，对他又踢又踹，还跪在他的身体上，一直折磨到午夜。公鸡刚一啼叫，袭击者便全都消失了。爱尔兰人这时已经只剩下一口气。
        - id: ch02-b05
          speaker: narrator
          text: 天一亮，公主便来到小屋。她发现他直挺挺躺在地上，连一个字也说不出。她拿出一只瓶子，倒出里面的东西，替他从头到脚擦了一遍。他马上恢复得像从前一样健壮。可身体虽然好了，昨夜的毒打他还记得清清楚楚，怎么也不肯再试一次。公主苦苦求他留下，还说第二夜不会那么难熬。他最后还是让步了。
        - id: ch02-b06
          speaker: narrator
          text: 第二晚快到午夜，门外又响起开门的命令。这次来的家伙是前一晚的三倍。爱尔兰人一动不动，既不出去，也不肯开门。没多久，他们砸破门板，一股脑儿压到他身上。他们抓住他，一次次把他抛向屋顶，还跳起来往他身上踩，直到公鸡啼叫才全部消失。
        - id: ch02-b07
          speaker: narrator
          text: 清晨，公主来看看他是不是还活着。她拿出瓶子放到他的鼻孔下面，不一会儿便让他醒了。爱尔兰人开口第一句话，就是骂自己太蠢，竟然为了一个刚认识的人，一次又一次跑来送死。他下定决心，马上离开这里，再也不留下了。
        - id: ch02-b08
          speaker: princess
          text: 求你再留一晚。只差这一夜，我就自由了。明早只要你还有一点气息，瓶里的东西就能让你完全复原。
        - id: ch02-b09
          speaker: narrator
          text: 听完这番话，爱尔兰人决定再留一晚。可到了第三夜，袭击他的人又比前两夜加起来还多两倍。他挨了整整一夜的毒打，怎么看也不像能活到早晨。黎明时，公主发现他像死人一样倒在地上。她俯身去探，却辨不出还有没有呼吸。她又伸手摸他的脉搏，终于发现一丝微弱的跳动。公主立刻把瓶里的东西全倒在他身上。不久，他站了起来，身体又和从前一样健壮。三个可怕的夜晚总算熬过去了，公主身上的魔法也解除了。
        - id: ch02-b10
          speaker: princess
          text: 我现在必须离开。过几天，我会乘四匹灰马拉的马车回来接你。
        - id: ch02-b11
          speaker: irishman
          text: 别闹了！这三个晚上我付了那么大的代价，现在还要跟你分开？
        - id: ch02-b12
          speaker: narrator
          text: 可爱尔兰人的话还没能留住她。一眨眼，公主已经不见了。他眼看着她离去，真不知道该拿自己怎么办。好在公主临走前留给他一根小魔杖。只要他愿意，用魔杖轻轻一碰，就能唤醒城堡里那些沉睡的男人。其中有些人，已经在那里一动不动地睡了整整十六年。
    - id: ch03
      title: 金发少年的别针
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 爱尔兰人独自躺在三把椅子上，忽然看见一个金发少年走进门来。
        - id: ch03-b02
          speaker: irishman
          text: 小伙子，你从哪儿来的？
        - id: ch03-b03
          speaker: fair_haired_lad
          text: 我来替您准备饭菜。
        - id: ch03-b04
          speaker: irishman
          text: 谁叫你来的？
        - id: ch03-b05
          speaker: fair_haired_lad
          text: 我的女主人。就是那位中了魔法、如今已经自由的公主。
        - id: ch03-b06
          speaker: narrator
          text: 爱尔兰人这才明白，公主派少年来照料他。少年还说，女主人要他第二天早上九点准备好，到时她会按照约定，乘马车来接他。爱尔兰人听见这个消息，高兴极了。第二天早晨，眼看约定的时辰快到了，他便走进花园等候。少年却偷偷从口袋里拿出一根大别针，趁主人没有察觉，插进他的外衣后襟。别针刚一插进去，爱尔兰人立刻沉沉睡去。
        - id: ch03-b07
          speaker: narrator
          text: 没过多久，公主果然乘着四匹马拉的马车来了。她问金发少年，他的主人醒了没有。少年回答说，他还在睡。
        - id: ch03-b08
          speaker: princess
          text: 真不走运。难道一整夜还不够他睡吗？告诉他，明天这个时辰要是还见不到他，他这一生恐怕再也见不到我了。
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: 公主走后，少年拔下别针，爱尔兰人马上醒了。
        - id: ch03-b10
          speaker: irishman
          text: 你见到她了吗？
        - id: ch03-b11
          speaker: fair_haired_lad
          text: 见到了。她说，明天九点要是见不到您，您就再也见不到她了。
        - id: ch03-b12
          speaker: narrator
          text: 爱尔兰人听完懊恼极了，却怎么也想不通，自己为什么偏偏在公主到来时睡着。他决定当晚早早上床，第二天好及时起身，也的确这样做了。快到九点，他又走进花园等候公主，金发少年也跟在身边。少年一瞅准机会，便再次把别针插进他的外衣。爱尔兰人又像前一天一样睡着了。
        - id: ch03-b13
          speaker: narrator
          text: 九点整，公主乘着四匹马拉的马车准时来到。她问少年，他的主人起床没有。少年告诉她，主人还在睡，就跟前一天一模一样。
        - id: ch03-b14
          speaker: princess
          text: 唉，真替他难过。昨夜睡那么久，还不够吗？告诉他，他再也不会在这里见到我了。把这把剑交给他，说是我送的，也把我的祝福带给他。
          emotion: sad
        - id: ch03-b15
          speaker: narrator
          text: 公主一离开，少年就拔下别针。爱尔兰人顿时醒来，第一句话还是问有没有见到她。少年说见到了，又拿出公主留下的剑。爱尔兰人气恼到了极点，简直恨不得杀了这个少年。可是他才往肩后一看，金发少年已经消失得无影无踪。
        - id: ch03-b16
          speaker: narrator
          text: 他又独自留在城堡里，便走进那间睡满了人的大屋。在众人当中，他找到那两个同他一起逃离军队、后来又丢下他的伙伴。爱尔兰人想起公主告诉过他的办法，用她留下的魔杖先碰醒了他们。两个人立刻从床上一跃而起。离开时，爱尔兰人送给他们许多金银，任他们尽力带走。随后，他又忙着把其余的人一个个唤醒。沉睡者实在太多，要全部叫醒可不是件轻松的事。那一整天，城堡的两扇大门都挤满了醒来的人。
    - id: ch04
      title: 寻找蓝山
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可是失去公主的痛楚日夜啃噬着爱尔兰人的心。最后，他决定走遍世界，看看能不能打听到她的消息。他从马厩里挑出最好的一匹马，踏上旅程。三年间，他穿过一片又一片森林和荒野，却没有一个人知道公主在哪里。他终于绝望到了极点，甚至想结束自己的生命，便拔出金发少年替公主转交的那把剑。就在这时，他发现剑刃一侧竟刻着一行字。
        - id: ch04-b02
          speaker: narrator
          text: 那行字说：“到蓝山来找我。”爱尔兰人重新鼓起勇气，立刻放弃了寻死的念头。他收起剑，怀着希望继续前行，总会有人知道蓝山在哪里吧。他漫无目的地走了很远，终于看见远处有一点灯光，便径直赶去。那光来自一所小房子。屋里的人听见马蹄声，马上出来查看。他看见一个陌生人骑在马上，便询问爱尔兰人为何到这里，又要去哪里。
        - id: ch04-b03
          speaker: first_old_man
          text: 我在这里住了三百年。三百年来，除了你，我一个人也没见过。
        - id: ch04-b04
          speaker: irishman
          text: 我找了整整三年，只想遇到一个知道蓝山在哪里的人。
        - id: ch04-b05
          speaker: first_old_man
          text: 进来住一夜吧。我有一本记载世间万事的书。今晚我会全部查一遍。只要里面真有蓝山，我们一定找得到。
        - id: ch04-b06
          speaker: narrator
          text: 爱尔兰人在老人那里住了一夜，清晨一到便起身准备离开。老人告诉他，自己为了从头到尾翻查那本书，整整一夜都没有合眼，书里却没有半个字提到蓝山。不过，他有一个兄弟住在九百英里外。世上若还有人知道蓝山在什么地方，那位兄弟一定知道。爱尔兰人说，自己的马已经快撑不住了，根本走不了九百英里。老人却说不要紧。
        - id: ch04-b07
          speaker: first_old_man
          text: 我只要吹声口哨，天黑以前，你就能到我兄弟家。
        - id: ch04-b08
          speaker: narrator
          text: 老人吹响口哨。爱尔兰人还没弄清自己究竟到了世上什么地方，就发现已经站在另一位老人的门前。那位老人也告诉他，自己已经三百年没见过一个人了，随后问他要到哪里去。
        - id: ch04-b09
          speaker: irishman
          text: 我想找个人问问，蓝山到底在哪里。
        - id: ch04-b10
          speaker: second_old_man
          text: 留在这里过夜吧。我也有一本记载世间万事的书。只要书里有蓝山，天亮以前我就会找到。
        - id: ch04-b11
          speaker: narrator
          text: 爱尔兰人又住了一夜，可第二本书里同样没有半个字提到蓝山。老人看他垂头丧气，便说自己还有一个兄弟住在九百英里外。要是能从谁那里打听到蓝山，准是那位兄弟。老人还答应让他在天黑前赶到。口哨一响，爱尔兰人果真落在第三位老人的家门口。那老人看见他，惊讶极了，说自己也有三百年没见过一个人了。
        - id: ch04-b12
          speaker: bird_master
          text: 你要去哪里？
        - id: ch04-b13
          speaker: irishman
          text: 我四处奔波，是为了打听蓝山。
        - id: ch04-b14
          speaker: bird_master
          text: 蓝山？
        - id: ch04-b15
          speaker: irishman
          text: 对，就是蓝山。
        - id: ch04-b16
          speaker: bird_master
          text: 这名字我没听过。可只要它真的存在，我就能找出来。全世界的鸟都听我号令。我吹声口哨，它们就会飞来。等我逐一问过它们来自哪里，我们就会有答案。
        - id: ch04-b17
          speaker: narrator
          text: 老人吹响口哨。哨声一落，全世界的鸟儿纷纷从四面八方朝这里聚来。他一只一只询问它们从哪里来，却没有一只来自蓝山。等所有鸟都问完，他发现少了一只大鹰，心里奇怪它为什么没有赶来。过了一会儿，远处飞来一个庞然大物，连天空也被遮暗了。它不断靠近，越飞越显得巨大，到头来原来正是那只大鹰。大鹰刚一落地，老人便训斥它，问是什么耽搁了它，叫它远远落在大家后面。
        - id: ch04-b18
          speaker: eagle
          text: 我也没有办法。我要赶的路，比今天任何一只鸟都远二十多倍。
        - id: ch04-b19
          speaker: bird_master
          text: 那你是从哪里来的？
        - id: ch04-b20
          speaker: eagle
          text: 蓝山。
        - id: ch04-b21
          speaker: bird_master
          text: 真的吗？那里正在做什么？
        - id: ch04-b22
          speaker: eagle
          text: 今天，他们正在筹备蓝山国王女儿的婚礼。三年来，她一直拒绝嫁人，要等到彻底不再指望那个替她解除魔法的人回来。她和父王约好的期限就是三年。现在，她不能再等了。
        - id: ch04-b23
          speaker: narrator
          text: 爱尔兰人立刻明白，公主苦等了三年的人正是自己。可是知道了又有什么用？他觉得自己这一生也没有希望到达蓝山。老人看出他越来越悲伤，便问大鹰，要什么报酬才肯让这个男人骑在背上，把他送到蓝山。
        - id: ch04-b24
          speaker: eagle
          text: 我要六十头牛。把它们杀了，每头切成四块。我每次回头，他就往我嘴里扔一块肉。
    - id: ch05
      title: 一年零一天的婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 爱尔兰人和老人一听见要求，马上出去打猎。天黑前，他们猎到六十头牛，照大鹰的话把每头牛切成四大块。老人叫大鹰伏下身子，好把牛肉堆到它背上。不过，他们先得找来一架十四级的梯子，才能爬上鹰背。两人尽力把肉堆稳，老人又叫爱尔兰人上去，叮嘱他，大鹰每次回头都要喂给它一块牛肉。
        - id: ch05-b02
          speaker: narrator
          text: 老人一声令下，大鹰立刻腾空而起。一路上，它每次转过头，爱尔兰人就扔一块牛肉进它嘴里。可是快到蓝山王国边境时，牛肉偏偏吃光了。大鹰再次回过头来，爱尔兰人没有肉可喂，竟把石头扔到了它的尾巴与后颈之间。
        - id: ch05-b03
          speaker: narrator
          text: 大鹰猛地翻了一个整圈，把爱尔兰人从背上甩进海里。他正好落在国王宫殿前面的海湾。幸亏他的脚尖刚刚能够碰到海底，他才没有淹死，总算设法爬上了岸。
        - id: ch05-b04
          speaker: narrator
          text: 爱尔兰人走进城里，只见条条街道都在灯火中闪闪发亮，公主的婚礼马上就要开始了。他走进迎面遇到的第一所房子，那里恰好住着国王的养鸡妇。他问那位老妇人，城里为什么如此喧闹，又为什么到处亮着这么多灯。
        - id: ch05-b05
          speaker: hen_wife
          text: 公主今晚要出嫁，可她一点也不情愿。她天天盼着那个替她解除魔法的人回来。
        - id: ch05-b06
          speaker: irishman
          text: 这枚金币给你。快去把她带到这里来。
        - id: ch05-b07
          speaker: narrator
          text: 老妇人收下金币，马上去找公主，很快便带着她回来了。公主和爱尔兰人一见面，立刻认出了彼此。两个人终于结为夫妻，还举行了一场盛大无比的婚礼。那场婚礼，整整持续了一年零一天。
