  chapters:
    - id: ch01
      title: The Enchanted Castle
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, a Scotsman, an Englishman, and an Irishman were serving together in the army. The first chance they found, all three ran away. For two days they wandered through a great forest with nothing to eat or drink and not one house in sight. Each night, they climbed into the trees to keep safe from the wild beasts below.
        - id: ch01-b02
          speaker: narrator
          text: On the second morning, the Scotsman looked down from his tree and spotted a great castle far off. He knew that roots of grass would not keep him alive much longer. So when he reached the ground, he headed for the castle without telling either companion what he had seen. Perhaps hunger and hardship had made each man care only about saving himself.
        - id: ch01-b03
          speaker: narrator
          text: He walked for most of the day. By the time he arrived, it was late. Every door was shut, and no smoke rose from the chimneys. Bitterly disappointed, he lay down beside the wall and thought he would die after all. Then a window opened high above him. He looked up and saw the most beautiful woman he had ever set eyes on.
        - id: ch01-b04
          speaker: scotsman
          text: Oh, Fortune herself must have sent you to me!
        - id: ch01-b05
          speaker: princess
          text: Perhaps she has. What do you need, and what brought you here?
        - id: ch01-b06
          speaker: scotsman
          text: Need brought me. I am dying for food and drink.
        - id: ch01-b07
          speaker: princess
          text: Then come inside. There is plenty here for you.
        - id: ch01-b08
          speaker: narrator
          text: The Scotsman went in with her. She opened a room and set food before him. After he had eaten, she led him to a much larger chamber. A great number of men were lying there, all fast asleep. The Scotsman chose an empty bed, lay down among them, and soon slept just as soundly as they did.
        - id: ch01-b09
          speaker: narrator
          text: Back in the forest, evening came, and so did the hour when the wild beasts prowled. The Englishman climbed the very tree from which the Scotsman had seen the castle. At dawn he looked in every direction and saw it too. He slipped away without one word to the Irishman. At the castle, everything happened to him just as it had to the Scotsman.
        - id: ch01-b10
          speaker: narrator
          text: Now the poor Irishman was alone. He had no idea where his companions had gone, and he stayed there feeling miserable. The next night he climbed that same tree. At daybreak, he saw the castle and set out for it.
        - id: ch01-b11
          speaker: narrator
          text: He traveled toward the castle until he reached its walls. There was no fire, no smoke, and no other sign that anyone lived there. Before long, he heard the window open over his head. He looked up and saw the same beautiful woman. The Irishman asked whether she would give him food and drink. She answered with great kindness that she would, if he would only come inside. He needed no second invitation.
        - id: ch01-b12
          speaker: narrator
          text: She brought him into a room and served food and drink finer than anything he had ever known. A bed stood there with diamond rings hanging from every loop in its curtains. All the other wonders in the chamber astonished him just as much. He stared until he forgot that he had come in starving. When the woman saw the meal untouched, she asked what more he could want.
        - id: ch01-b13
          speaker: irishman
          text: I will not touch food or drink until you tell me who you are, where you came from, and who shut you in this place.
        - id: ch01-b14
          speaker: princess
          text: Then I will tell you. I am an enchanted Princess. My father has promised my rescuer a third of his kingdom while he lives, the whole kingdom after his death, and my hand in marriage. If any man can free me, I believe you can. I have been here sixteen years. In all that time, you are the first visitor who ever asked who I was. Every other man is asleep in the great room below.
        - id: ch01-b15
          speaker: irishman
          text: Tell me what spell holds you and what I must do to break it.
        - id: ch01-b16
          speaker: princess
          text: There is a little room here. If one man will stay inside it from ten until midnight for three nights in a row, the spell will end.
        - id: ch01-b17
          speaker: irishman
          text: Then you have found your man. I will do it.
    - id: ch02
      title: Three Nights of the Spell
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The Princess brought him a pipe and tobacco, and the Irishman entered the little room. Before long, someone began hammering and pounding outside the door. Voices ordered him to let them in.
        - id: ch02-b02
          speakers: [attacker_1, attacker_2, attacker_3]
          ensemble: chorus
          text: Open this door!
          emotion: angry
        - id: ch02-b03
          speaker: irishman
          text: I will not open it.
        - id: ch02-b04
          speaker: narrator
          text: The very next moment, the door flew inward and the attackers burst through with it. They knocked him down, kicked him, and knelt on his body until midnight. At the crowing of the cock, every one of them vanished. The Irishman was barely alive.
        - id: ch02-b05
          speaker: narrator
          text: As soon as daylight came, the Princess entered the room. She found him stretched full length across the floor and unable to speak one word. From a bottle, she poured something into her hands and rubbed him from head to foot. At once he became as sound as ever. Even with his strength restored, he remembered every kick from the night before and had no wish to try again. The Princess begged him not to leave. She told him that the second night would not be so bad. In the end, he yielded and stayed.
        - id: ch02-b06
          speaker: narrator
          text: Near midnight on the second night, he heard the order to open the door again. This time, three attackers had come for every one who had been there before.
        - id: ch02-b07
          speakers: [attacker_1, attacker_2, attacker_3]
          ensemble: chorus
          text: Open up and let us in!
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: The Irishman did not move toward them or touch the door. Soon they smashed their way in and fell upon him. They seized him and tossed him from one to another, right up toward the ceiling. Then they leaped over him until the cock crowed, and all of them disappeared.
        - id: ch02-b09
          speaker: narrator
          text: In the morning, the Princess came to learn whether he still lived. She held the bottle to his nostrils, and he soon came back to himself.
        - id: ch02-b10
          speaker: irishman
          text: I must be a fool to let myself be killed for anyone alive. I am leaving. I will not stay here another night.
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: The Princess pleaded with him. Only one more night stood between her and freedom.
        - id: ch02-b12
          speaker: princess
          text: If there is even one spark of life left in you at dawn, what is in this bottle will make you whole again.
        - id: ch02-b13
          speaker: narrator
          text: All her pleading finally persuaded him to stay. On the third night, three attackers came for every one who had come on the second night. The little room seemed overrun with them. They fell upon the Irishman and treated him so cruelly that it looked very unlikely he would be alive when morning came.
        - id: ch02-b14
          speaker: narrator
          text: At dawn, the Princess found him on the floor as if he were dead. She listened for breath but could not be certain there was any. Then she felt his pulse and found the faintest movement. She poured the bottle over him. Before long, he stood up, every bit as well as before. The three nights were finished, and the Princess was free from the spell.
        - id: ch02-b15
          speaker: princess
          text: I must leave for a little while. In a few days I will return for you in a carriage drawn by four gray horses.
        - id: ch02-b16
          speaker: irishman
          text: Ah, be easy now. Do not talk of leaving me. I have paid dearly for you these last three nights if we must part at once.
        - id: ch02-b17
          speaker: narrator
          text: In the twinkling of an eye, she disappeared. The Irishman did not know what to do. Before going, though, she had given him a little rod. Whenever he wished, he could use it to wake the sleeping men, including some who had slept for sixteen years.
    - id: ch03
      title: The Fair-haired Lad
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Left alone, the Irishman stretched himself across three chairs. Before long, a little fair-haired lad came through the door.
        - id: ch03-b02
          speaker: irishman
          text: Where have you come from, my lad?
        - id: ch03-b03
          speaker: fair_haired_lad
          text: I have come to prepare your food.
        - id: ch03-b04
          speaker: irishman
          text: And who sent you to do that?
        - id: ch03-b05
          speaker: fair_haired_lad
          text: My mistress sent me. She is the Princess who was under the spell and is free now.
        - id: ch03-b06
          speaker: narrator
          text: From that answer, the Irishman understood that the Princess had sent the lad to wait on him and see to his meals. The boy also brought a message. His mistress wanted the Irishman ready at nine the next morning. At that hour, she would come for him with the carriage, exactly as she had promised. This news pleased him greatly.
        - id: ch03-b07
          speaker: narrator
          text: As nine o'clock drew near the next day, the Irishman went into the garden. Behind him, the fair-haired lad took a large pin from his pocket and slipped it into the back of his master's coat. The Irishman noticed nothing. At once, he fell sound asleep.
        - id: ch03-b08
          speaker: narrator
          text: Soon the Princess arrived in her carriage with four horses and asked the lad whether his master was awake.
        - id: ch03-b09
          speaker: fair_haired_lad
          text: No, he is still asleep.
        - id: ch03-b10
          speaker: princess
          text: That is a sad thing for him, when the whole night was not long enough for his sleep. Tell him this. If he does not meet me here at the same hour tomorrow, he may never see me again as long as he lives.
          emotion: sad
        - id: ch03-b11
          speaker: narrator
          text: Once the Princess had gone, the lad pulled out the pin. His master woke that instant.
        - id: ch03-b12
          speaker: irishman
          text: Have you seen her?
        - id: ch03-b13
          speaker: fair_haired_lad
          text: Yes. She said that if you fail to meet her at nine tomorrow, you will never see her again.
        - id: ch03-b14
          speaker: narrator
          text: The Irishman was deeply sorry. He could not understand why sleep had overcome him just when she was due. He decided to go to bed early so he would rise in good time, and that is what he did.
        - id: ch03-b15
          speaker: narrator
          text: Near nine the next morning, he went back to the garden to wait. The fair-haired lad went with him. As soon as the boy found his chance, he put the pin into his master's coat again. Once more, the Irishman fell asleep.
        - id: ch03-b16
          speaker: narrator
          text: At exactly nine, the Princess arrived with her four-horse carriage. She asked whether his master had risen.
        - id: ch03-b17
          speaker: fair_haired_lad
          text: No. He is asleep, just as he was yesterday.
        - id: ch03-b18
          speaker: princess
          text: Dear, dear. I am sorry for him. Was all last night still not sleep enough? Tell him he will never see me here again. Give him this sword in my name, and give him my blessing with it.
          emotion: sad
        - id: ch03-b19
          speaker: narrator
          text: She went away. The lad removed the pin, and the Irishman woke immediately.
        - id: ch03-b20
          speaker: irishman
          text: Have you seen her?
        - id: ch03-b21
          speaker: fair_haired_lad
          text: I have. She left this sword for you.
        - id: ch03-b22
          speaker: narrator
          text: In pure vexation, the Irishman was ready to kill the lad. But when he glanced over his shoulder, the fair-haired boy had vanished without a trace.
        - id: ch03-b23
          speaker: narrator
          text: Alone again, the Irishman went into the great room of sleepers. Among them, he found the Scotsman and Englishman who had deserted the army with him. He remembered the Princess's words about the little rod, and his two comrades were the first men he touched with it.
        - id: ch03-b24
          speaker: narrator
          text: The Scotsman and Englishman sprang to their feet at once, awake after their long sleep. Before they went away, the Irishman gave each of them as much silver and gold as he could carry. Then he turned to all the others. One after another, he touched them with the rod and brought them back to waking life. There were so many that the work lasted a long while. All day, the newly awakened men crowded around both doors of the castle.
        - id: ch03-b25
          speaker: narrator
          text: Yet the loss of the Princess troubled him day and night. At last, he set out to search the world for anyone who could bring him news of her. He chose the finest horse in the stable and rode away.
        - id: ch03-b26
          speaker: narrator
          text: For three years he crossed forests and wildernesses. Not one person could tell him anything about the Princess. At last, despair overcame him. He drew the sword she had left, meaning to end his life. Then he noticed words written along one side of the blade.
        - id: ch03-b27
          speaker: narrator
          text: The words said, “You will find me in the Blue Mountains.” Hope returned to him. He put away the sword and went on, searching for someone who could tell him where those mountains lay.
    - id: ch04
      title: The Masters of the World's History
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After wandering a long way without watching where he went, the Irishman saw a distant light. He made straight for it and found a little house. The man inside heard the horse's hooves and came out. At the sight of a stranger on horseback, he asked what had brought him there and where he meant to go.
        - id: ch04-b02
          speaker: first_old_man
          text: I have lived here for three hundred years, and in all that time you are the only human being I have seen.
        - id: ch04-b03
          speaker: irishman
          text: For three years I have searched for someone who can show me where the Blue Mountains are.
        - id: ch04-b04
          speaker: first_old_man
          text: Come in and spend the night. I own a book containing the history of the world. Tonight I will search it from beginning to end. If the Blue Mountains are named there, we will find them.
        - id: ch04-b05
          speaker: narrator
          text: The Irishman stayed. At morning, he rose and prepared to leave. The old man had spent the whole night awake over his book, but he had found no mention of the Blue Mountains.
        - id: ch04-b06
          speaker: first_old_man
          text: Listen, though. If such a place exists anywhere on earth, my brother may know it. He lives nine hundred miles from here. If anyone in this world can tell you where those mountains are, he can.
        - id: ch04-b07
          speaker: irishman
          text: I could never ride nine hundred miles. My horse is already failing.
        - id: ch04-b08
          speaker: first_old_man
          text: That need not stop you. One blow on my whistle will take you to my brother's house before night.
        - id: ch04-b09
          speaker: narrator
          text: The old man raised the whistle and blew. The Irishman could not tell what happened or where in the world he was going. The next thing he knew, he stood outside the brother's door, nine hundred miles away and well before nightfall. The second old man came out and marveled at him. He too said that three hundred years had passed since he had seen another person. Then he asked where this unexpected traveler was bound.
        - id: ch04-b10
          speaker: irishman
          text: I am trying to find anyone who can tell me where the Blue Mountains are.
        - id: ch04-b11
          speaker: second_old_man
          text: Stay here tonight. I too have a book of the world's history. If that place appears anywhere in it, I will know where it lies before daylight.
        - id: ch04-b12
          speaker: narrator
          text: The Irishman spent the night there, but this book held no word of the Blue Mountains either. When the old man saw how disappointed his guest was, he spoke of another brother who lived nine hundred miles away.
        - id: ch04-b13
          speaker: second_old_man
          text: If anyone can give you news of those mountains, it will be my brother. I can send you to his home before tonight.
        - id: ch04-b14
          speaker: narrator
          text: He blew his whistle, and before nightfall the Irishman stood at the third brother's house. This man was amazed. He too had gone three hundred years without seeing another human being.
        - id: ch04-b15
          speaker: bird_master
          text: Where are you going?
        - id: ch04-b16
          speaker: irishman
          text: I am traveling from place to place, asking the way to the Blue Mountains.
        - id: ch04-b17
          speaker: bird_master
          text: The Blue Mountains, you say?
        - id: ch04-b18
          speaker: irishman
          text: Yes, those are the ones.
        - id: ch04-b19
          speaker: bird_master
          text: I have never heard that name. But if the mountains exist, I can discover them. I command every bird in the world. When I blow my whistle, they must all come. I will ask where each bird has flown from. That is our best hope of finding the place.
        - id: ch04-b20
          speaker: narrator
          text: The master of birds blew his whistle. From every part of the world, wings began to beat toward his house. Birds small and great gathered around him until all seemed to have answered his call. The old man questioned them one by one, asking each where it had come from. He went through the whole company, but not a single bird said it had flown from the Blue Mountains.
        - id: ch04-b21
          speaker: narrator
          text: When he had gone through them all, the old man realized that one great Eagle was missing. He wondered why she had not answered his whistle with the rest. Soon, something enormous appeared in the distance and darkened the sky as it came. The shape kept drawing nearer and growing larger. At last, everyone could see that it was the missing Eagle. When she landed before him, the old man scolded her and demanded to know what had kept her so far behind all the other birds.
        - id: ch04-b22
          speaker: eagle
          text: I could not arrive any sooner. I had more than twenty times farther to fly than any bird here.
        - id: ch04-b23
          speaker: bird_master
          text: Then where have you come from?
        - id: ch04-b24
          speaker: eagle
          text: From the Blue Mountains.
        - id: ch04-b25
          speaker: bird_master
          text: The Blue Mountains indeed! What is happening there?
        - id: ch04-b26
          speaker: eagle
          text: Today they are preparing the wedding of the King of the Blue Mountains' daughter. For three years she refused every man, hoping the one who freed her from the spell would come. She cannot wait any longer. She agreed with her father that she would remain unmarried for only three years.
        - id: ch04-b27
          speaker: narrator
          text: The Irishman knew she had been waiting for him. Still, the knowledge seemed useless, because he had no hope of reaching the Blue Mountains in his lifetime. The old man saw his sadness and asked what payment the Eagle wanted to carry the traveler there.
        - id: ch04-b28
          speaker: eagle
          text: Kill sixty cattle and cut each one into quarters. Whenever I turn my head, he must throw one quarter into my mouth.
    - id: ch05
      title: The Blue Mountains
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Irishman and the old man went hunting as soon as they heard the Eagle's price. Before evening, they had killed sixty cattle and cut them into quarters, just as she had ordered.
        - id: ch05-b02
          speaker: narrator
          text: The old man told the Eagle to lie down while they loaded the meat onto her back. Even then, they could not reach her. They had to find a ladder with fourteen steps before they could climb high enough. Up that ladder they carried all the quarters and piled them as securely as they could. When everything was ready, the old man told the Irishman to mount beside the load. He reminded him carefully that every time the Eagle looked over her shoulder, he must throw a quarter of beef into her mouth.
        - id: ch05-b03
          speaker: narrator
          text: The Irishman climbed the ladder. At the old man's word, the Eagle rose into the air. Each time she turned her head, her passenger threw a quarter of beef into her open mouth.
        - id: ch05-b04
          speaker: narrator
          text: They flew on toward the Blue Mountains, and the heap of beef grew smaller with every turn of the Eagle's head. Just as they came near the borders of the kingdom, the final quarter was gone. Once again, the Eagle looked over her shoulder and opened her mouth. The Irishman had no meat left to throw. Instead, he seized the stone that lay between her tail and her neck and hurled that into her mouth.
        - id: ch05-b05
          speaker: narrator
          text: The Eagle turned a complete somersault and flung him into the sea. He fell into the bay directly before the King's palace. By good fortune, the tips of his toes touched the bottom. He struggled through the water and reached the shore.
        - id: ch05-b06
          speaker: narrator
          text: He climbed into the town. Every street shone with lights, and the Princess's wedding was about to begin. The first house he entered belonged to the King's hen-wife. He asked the old woman why the whole town was filled with noise and light.
        - id: ch05-b07
          speaker: hen_wife
          text: The Princess is being married tonight, though she does not wish it. Every day she has watched for the man who broke her spell, hoping he would come.
        - id: ch05-b08
          speaker: irishman
          text: Here is a guinea for you. Go and bring the Princess to this house.
        - id: ch05-b09
          speaker: narrator
          text: The old woman went out and soon came back with the Princess. The Princess and the Irishman knew each other at once.
        - id: ch05-b10
          speaker: narrator
          text: They were married there in the kingdom, and their splendid wedding lasted for a year and a day.
