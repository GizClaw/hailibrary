audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    lake:
      display_name: 湖水
      tts:
        delivery: 神秘低缓，警告时郑重而急切
        timbre: 清澈空灵
        pace: 舒缓
        pitch: 中低音
    serpent:
      display_name: 七头蛇
      tts:
        delivery: 威严凶暴，话语沉重而充满威胁
        timbre: 粗粝浑厚
        pace: 缓慢
        pitch: 低音
    queen:
      display_name: 王后
      tts:
        delivery: 端庄柔和，悲伤时克制低沉
        timbre: 温润成熟
        pace: 舒缓
        pitch: 中音
    nun:
      display_name: 老修女
      tts:
        delivery: 亲切朴实，语气笃定而神秘
        timbre: 苍老柔和
        pace: 不疾不徐
        pitch: 中低音
    horse:
      display_name: 马儿
      tts:
        delivery: 忠诚恳切，说话直接而坚定
        timbre: 温厚清晰
        pace: 适中
        pitch: 中低音
    abbess:
      display_name: 女院长
      tts:
        delivery: 慈爱庄重，指点时清楚而不容置疑
        timbre: 苍老沉稳
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 百兽之王的惩罚
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有位国王决意远航。他召齐舰队和水手，昼夜不停地向前航行，最后来到一座岛上。岛上尽是参天大树，每棵树下都卧着一头狮子。众人才登岸，狮群便一齐扑来，要把他们吞掉。
        - id: ch01-b02
          speaker: narrator
          text: 一场恶战过后，猛兽终于被制服，国王的人却也死去了大半。幸存者穿过森林，在另一边发现一座美丽的花园。世间所有草木，都在那里一同繁茂生长。
        - id: ch01-b03
          speaker: narrator
          text: 园里有三眼奇异的泉。第一眼流白银，第二眼流黄金，第三眼流珍珠。众人解下背囊，把珍宝装得满满的。花园中央还有一个大湖。他们刚走到岸边，湖水竟说起话来。
        - id: ch01-b04
          speaker: lake
          text: 你们是什么人？来这里做什么？难道是来拜见我们的国王？
        - id: ch01-b05
          speaker: narrator
          text: 众人吓坏了，谁也答不出话。
        - id: ch01-b06
          speaker: lake
          text: 害怕才对。你们擅闯这里，性命已经难保。我们的国王长着七个头，现在还在睡觉，可再过一会儿，他就会醒来，到我这里沐浴。谁在花园里撞见他，谁也逃不掉。要想活命，就脱下衣服，从这里一路铺到城堡。国王喜欢在柔软的东西上滑行。一高兴，他便不会吃你们。你们会受一点惩罚，但之后还能离开。
        - id: ch01-b07
          speaker: narrator
          text: 众人赶紧依言行事，铺好衣服，留在原地等候。正午时，大地突然震颤，许多地方裂开了口子。狮子、老虎和各种猛兽纷纷钻出，把城堡团团围住。紧接着，成千上万头野兽又涌出城堡，跟在它们的国王七头蛇身后。
        - id: ch01-b08
          speaker: narrator
          text: 七头蛇滑过铺在路上的衣服，来到湖边，问这些柔软的东西是谁放的。湖水告诉他，是一群前来致敬的人。七头蛇命人把他们带来。众人跪行上前，恭恭敬敬地讲了自己的经历。
        - id: ch01-b09
          speaker: serpent
          text: 你们竟敢闯进这里，我就这样惩罚你们。从今往后，每年都要从你们的百姓中送来十二名少年、十二名少女，给我吞食。若敢不从，我就灭掉你们整个国家。
        - id: ch01-b10
          speaker: narrator
          text: 七头蛇派一头野兽领他们走出花园，放他们回国。众人把岛上的遭遇告诉百姓。到了进献的日子，国王颁下告示，请十二名少年和十二名少女自愿献身，好救下祖国。年轻人争相赶来，人数远远超过所需。
    - id: ch02
      title: 黑帆船与神奇的苹果
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 人们造起一艘新船，挂上黑帆。被选中的少年少女登船，驶向百兽之王的国土。他们一上岛便来到湖边。这回狮子一动不动，泉水不再流淌，湖水也不说话。
        - id: ch02-b02
          speaker: narrator
          text: 众人留在那里等候。没过多久，大地便猛烈震动，比上一次更加可怕。七头蛇没有带任何野兽，独自来到湖边。他看见猎物正在等候，一口就将他们全部吞下。船员只得返航回国。此后年年如此，一转眼，许多年过去了。
        - id: ch02-b03
          speaker: narrator
          text: 这个不幸国家的国王和王后已经年老，却一直没有儿女。一天，王后坐在窗前痛哭。她知道，自己没有孩子，国王死后，王冠便会落到外人手中。忽然，一位手拿苹果的小老太太出现在她面前。
        - id: ch02-b04
          speaker: nun
          text: 王后陛下，您为什么哭？是什么事让您这样难过？
        - id: ch02-b05
          speaker: queen
          text: 唉，好妈妈，我伤心，是因为自己没有孩子。
          emotion: sad
        - id: ch02-b06
          speaker: nun
          text: 原来您为这件事烦恼。听我说，我是纺纱修道院的修女。这只苹果，是母亲临终时留给我的。谁吃了它，谁就会生下一个孩子。
        - id: ch02-b07
          speaker: narrator
          text: 王后给了老太太一些钱，买下那只苹果。她削去果皮，将果肉吃了，又把果皮抛出窗外。院子里恰好有匹母马自在走动，一口吃掉了果皮。后来，王后生了一个男孩，母马也产下一匹小公马。男孩和马驹一同长大，彼此相爱，亲密得像一对兄弟。
        - id: ch02-b08
          speaker: narrator
          text: 岁月流逝，国王去世了，王后也去世了。他们十九岁的儿子孤零零地留了下来。一天，年轻人正与自己的马说话，马儿向他进言。
        - id: ch02-b09
          speaker: horse
          text: 请听我说。我爱你，只希望你和这个国家都平安。要是每年还送十二名少年和十二名少女给百兽之王，这个国家很快就会毁掉。骑到我背上吧。我带你去见一个女人，她知道怎样杀死七头蛇。
    - id: ch03
      title: 纺纱修道院的指点
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 年轻人立刻上马。马儿驮着他走了很远，来到一座中空的大山。山腹里藏着巨大的洞窟，一位老太太正坐在里面纺纱。这里就是修女们的修道院，那位老太太便是女院长。
        - id: ch03-b02
          speaker: narrator
          text: 修女们终日纺纱，所以修道院才有这个名字。洞窟四周的坚硬岩壁上，凿着一张张供她们安睡的石床，中央燃着一盏灯。修女们轮流守护火焰，绝不能让它熄灭。谁若让灯灭了，其他人就会把她处死。
        - id: ch03-b03
          speaker: narrator
          text: 王子看见女院长，马上扑倒在她脚边，求她指点自己怎样杀死七头蛇。女院长扶他起身，给了他一个拥抱。
        - id: ch03-b04
          speaker: abbess
          text: 孩子，你要知道，是我派修女去见你母亲，让你来到世上。那匹马与你一同降生，也是我的安排。有它相助，你就能消灭怪物，解救世人。现在，我告诉你该怎样做。
        - id: ch03-b05
          speaker: abbess
          text: 先给马驮上棉花，再走我指给你的秘密通道。野兽们不知道那条路，你可以一直走到七头蛇的宫殿。国王会睡在床上，四周挂满铃铛，床顶悬着一柄剑。世上只有那柄剑能杀他。就算剑刃折断，也会为他的每个头重新长出一段，所以七个头都能斩掉。
        - id: ch03-b06
          speaker: abbess
          text: 你还要骗过七头蛇。轻轻溜进寝殿，用棉花塞住床边所有铃铛，再悄悄取下宝剑，迅速朝他的尾巴砍一剑。他会惊醒。若是看见你，就会把你抓住。你必须立刻斩下第一个头，然后等下一个头冒出来。它一出现，也马上斩掉。一直这样做，直到七个头全都落地。
    - id: ch04
      title: 七个头落地
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 女院长为王子祝福，他随即踏上征途。沿着她指明的秘密通道，他避开野兽，来到七头蛇的城堡。
        - id: ch04-b02
          speaker: narrator
          text: 王子谨慎地照着女院长的每一句嘱咐行事，终于顺利杀死了七头蛇。
        - id: ch04-b03
          speaker: narrator
          text: 野兽们一听说自己的国王已死，全都急匆匆朝城堡赶来。可王子早已骑上马，远远跑出了它们能够触及的地方。野兽们拼命追赶，却怎么也追不上。王子终于平安回到了家乡。
        - id: ch04-b04
          speaker: narrator
          text: 王子就这样杀死七头蛇，把自己的国家从那场可怕的压迫下解救了出来。
