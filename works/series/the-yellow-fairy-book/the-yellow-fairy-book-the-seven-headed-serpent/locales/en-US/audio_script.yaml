  chapters:
    - id: ch01
      title: The Island of Beasts
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king who decided to make a long voyage. He gathered his ships and sailors, and they traveled night and day until they reached an island covered in enormous trees. A lion lay beneath every tree. The moment the king's men came ashore, all the lions rose and sprang at them. The battle lasted a long time. At last the men defeated the beasts, but most of the sailors had been killed.
        - id: ch01-b02
          speaker: narrator
          text: The survivors crossed the forest. Beyond it, they found a beautiful garden where every kind of plant in the world grew together. Three springs flowed there. One ran with silver, one with gold, and one with pearls. The men opened their packs and filled them with treasure.
        - id: ch01-b03
          speaker: narrator
          text: In the center of the garden lay a great lake. As the men came to its shore, the Lake spoke to them.
        - id: ch01-b04
          speaker: lake
          text: Who are you, and why have you come here? Have you come to visit our king?
        - id: ch01-b05
          speaker: narrator
          text: The men were so frightened that none of them answered.
        - id: ch01-b06
          speaker: lake
          text: You are right to be afraid. You came here at the risk of your lives. Our king has seven heads. He is sleeping now, but he will soon wake and come here to bathe. No one who meets him in this garden can escape. If you want to live, take off your clothes and spread them along the path from the lake to the castle. The king loves to glide over something soft. It will please him, and he will not eat you. He will punish you, but afterward he will let you leave.
        - id: ch01-b07
          speaker: narrator
          text: The men followed the Lake's advice and waited. At noon, the earth began to shake. Cracks opened in the ground, and lions, tigers, and other wild beasts climbed out. They gathered around the castle. Then thousands more poured from its gates behind their king, the Seven-headed Serpent.
        - id: ch01-b08
          speaker: narrator
          text: The Serpent slid across the clothes and came to the Lake. He asked who had scattered those soft things over his path. The Lake told him that some visitors had laid them there to honor him. At once, the Serpent ordered the men brought before him. They came on their knees and briefly told him how they had reached the island.
        - id: ch01-b09
          speaker: serpent
          text: You dared to enter my land, so this is your punishment. Every year, you must bring me twelve young men and twelve young women from your people. I will devour them. If you fail, I will destroy your whole nation.
        - id: ch01-b10
          speaker: narrator
          text: The Serpent sent one of his beasts to guide the men out of the garden. They sailed home and told their people everything that had happened.
    - id: ch02
      title: The Black-sailed Ship
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Soon it was time to pay the Serpent his dreadful tribute. The king called for twelve young men and twelve young women who would give their lives to save the country. Far more than twenty-four came forward. A new ship was built with black sails, and the chosen young people set out for the island.
        - id: ch02-b02
          speaker: narrator
          text: They went straight to the Lake. This time, the lions did not move. The three springs had stopped flowing, and the Lake said nothing. The young people waited. Before long, the earth shook even more violently than it had before. The Seven-headed Serpent came alone, without his army of beasts. He saw the victims waiting and swallowed them all in one mouthful.
        - id: ch02-b03
          speaker: narrator
          text: The ship's crew sailed home. Year after year, the same terrible thing happened, until many years had gone by.
        - id: ch02-b04
          speaker: narrator
          text: By then the king and queen were growing old, and they had no children. One day, the queen sat at her window and wept bitterly. When the king died, their crown would pass to strangers because she had no child. Suddenly, a little old woman appeared before her with an apple in her hand.
        - id: ch02-b05
          speaker: nun
          text: Why are you crying, my queen? What has made you so unhappy?
        - id: ch02-b06
          speaker: queen
          text: Oh, good mother, I have no children. That is why I am so miserable.
          emotion: sad
        - id: ch02-b07
          speaker: nun
          text: Is that all that troubles you? Then listen. I am a nun from the Spinning Convent. When my mother died, she left me this apple. Whoever eats it will have a child.
        - id: ch02-b08
          speaker: narrator
          text: The queen paid the old woman and took the apple. She peeled and ate it, then threw the rind from the window. A mare roaming loose in the courtyard below found the peel and ate it.
        - id: ch02-b09
          speaker: narrator
          text: In time, the queen gave birth to a little boy, and the mare bore a male foal. The boy and the foal grew up side by side and loved each other like brothers.
    - id: ch03
      title: The Spinning Convent
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Years passed. The old king died, and so did the queen. Their son was nineteen now, and he was left alone. One day, as he talked with his horse, the Horse gave him serious counsel.
        - id: ch03-b02
          speaker: horse
          text: Hear me. I love you, and I want what is best for you and for this country. If you keep sending twelve young men and twelve young women to the King of the Beasts every year, your land will soon be ruined. Climb onto my back. I will carry you to a woman who can tell you how to kill the Seven-headed Serpent.
        - id: ch03-b03
          speaker: narrator
          text: The young king mounted, and the Horse carried him far away to a hollow mountain. A vast cavern opened in its side. Inside, an old woman sat spinning. She was the Abbess, and this underground place was the convent of the nuns. They spent all their time spinning, which was why it was called the Spinning Convent.
        - id: ch03-b04
          speaker: narrator
          text: Beds had been cut from the solid rock all around the cavern walls. A light burned in the center. The nuns took turns watching it so that it could never go out. If one of them allowed the flame to die, the others put her to death.
        - id: ch03-b05
          speaker: narrator
          text: As soon as the prince saw the old Abbess at her spinning, he fell at her feet.
        - id: ch03-b06
          speaker: prince
          text: Please tell me how I can kill the Seven-headed Serpent.
        - id: ch03-b07
          speaker: narrator
          text: The Abbess helped him rise and embraced him.
        - id: ch03-b08
          speaker: abbess
          text: My son, I was the one who sent a nun to your mother and caused you to be born. I caused the Horse to be born with you, too. With his help, you can free the world from this monster.
    - id: ch04
      title: The Sword Above the Bed
      blocks:
        - id: ch04-b01
          speaker: abbess
          text: Now I will tell you what to do. Load your horse with cotton. I will show you a secret passage to the Serpent's palace, hidden where the wild beasts cannot see it. When you enter, you will find the king asleep in a bed surrounded by bells. A sword hangs above him. That is the only sword that can kill him. Whenever its blade breaks, a new blade will grow for the next of the monster's seven heads. With it, you can cut off every one.
        - id: ch04-b02
          speaker: abbess
          text: You must trick him first. Slip very quietly into his bedchamber and stuff cotton into every bell around the bed. Then gently take down the sword. Strike the monster's tail hard and fast. That will wake him. If he sees you, he will seize you, so cut off his first head at once. Wait for the next head to rise, then cut that one off as well. Keep striking until all seven heads are gone.
        - id: ch04-b03
          speaker: narrator
          text: The Abbess blessed the prince, and he rode away to begin his dangerous task. Following the hidden passage she had shown him, he reached the Serpent's castle without being seen by the wild beasts.
        - id: ch04-b04
          speaker: narrator
          text: Inside, he found the Seven-headed Serpent asleep on his bed. Bells hung all around it, just as the Abbess had said, and the one sword that could kill the monster waited overhead. The prince moved softly through the chamber. He packed the cotton into every bell, one by one, so none of them could ring.
        - id: ch04-b05
          speaker: narrator
          text: Then he eased the sword down and struck the Serpent on the tail. The monster woke. Before it could seize him, the prince swept off the first head. Another rose in its place. He waited, struck again, and cut it away. Each time the blade broke, a fresh blade grew from the sword. The prince went on until the seventh head fell and the King of the Beasts was dead.
    - id: ch05
      title: The Country Set Free
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As soon as the wild beasts heard that their king had been killed, they all rushed toward the castle. But the prince had already mounted his Horse and ridden far beyond their reach.
        - id: ch05-b02
          speaker: narrator
          text: The beasts chased him as fast as they could, but they could not catch him. The prince reached his own country safely.
        - id: ch05-b03
          speaker: narrator
          text: And so he freed his people from the terrible tribute of the Seven-headed Serpent.
