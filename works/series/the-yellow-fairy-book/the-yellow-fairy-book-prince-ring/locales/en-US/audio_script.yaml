  chapters:
    - id: ch01
      title: The Ring in the Barrel
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a King and Queen who had two children, a daughter named Ingiborg and a son named Ring. Prince Ring cared less for adventure than most noblemen did in those days. He was not known for great strength or skill with weapons.
        - id: ch01-b02
          speaker: narrator
          text: When Ring was twelve, he rode into the forest with his men on a fine winter day, simply to enjoy himself. They traveled a long way before they spotted a hind with a gold ring around its horns. Ring wanted very much to catch it if he could. The whole company gave chase and rode without stopping, until one horse after another began to fail beneath its rider.
        - id: ch01-b03
          speaker: narrator
          text: At last Ring's own horse gave out. Just then, a darkness as black as night fell around them, and they could no longer see the hind. By now they were far from any house. They decided it was high time to go home, only to discover that they were lost. At first they stayed together. Then each man became certain that he alone knew the proper way. Before long they had separated and gone in different directions.
        - id: ch01-b04
          speaker: narrator
          text: Ring wandered until he reached a small clearing near the sea. A woman sat there beside a large barrel. He greeted her politely, and she welcomed him graciously.
        - id: ch01-b05
          speaker: narrator
          text: Ring looked into the barrel. At the bottom lay an extraordinarily beautiful gold ring. He stared at it so long that the woman noticed.
        - id: ch01-b06
          speaker: woman
          text: You may have the ring, if you are willing to reach down and take it.
        - id: ch01-b07
          speaker: ring
          text: Thank you. A ring like that is certainly worth trying for.
        - id: ch01-b08
          speaker: narrator
          text: The barrel did not look deep at all, so Ring leaned over its rim, certain that his hand would easily reach the ring. Yet whenever he stretched a little farther, the bottom seemed to sink away from him. While he was bent deep inside, the woman suddenly rose and pushed him in headfirst.
        - id: ch01-b09
          speaker: woman
          text: There. Now you can make your home inside it.
        - id: ch01-b10
          speaker: narrator
          text: She fastened the lid and threw the barrel into the sea. Ring could feel it drifting away from land and rolling helplessly over the waves. He knew he was in terrible trouble.
        - id: ch01-b11
          speaker: narrator
          text: He could not tell how many days he spent tossing over the sea. At last the barrel began knocking against rocks. That gave him a little hope. Perhaps he had reached land, rather than some lonely reef in the open water. Ring was a fair swimmer, so he finally decided to kick out the bottom of the barrel. Once it broke away, he swam out and managed to reach the shore.
        - id: ch01-b12
          speaker: narrator
          text: The rocks beside the water were smooth and level, but high cliffs rose directly above them. It looked almost impossible to climb. Ring followed the foot of the cliffs for a while, searching for a way up. At last he chose a place and began. The climb was hard, and it took him some time, but he finally pulled himself onto the top.
    - id: ch02
      title: The Secret in the Parlour
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: From the cliff top, Ring saw that he had landed on an island. Forest covered the land, apples grew among the trees, and the place itself seemed pleasant. He wandered there for several days. Then one day a tremendous noise came crashing through the forest. Ring was so frightened that he ran among the trees to hide.
        - id: ch02-b02
          speaker: narrator
          text: A Giant appeared, dragging a sledge piled high with wood. He came straight toward Ring, leaving the boy no chance to escape. Ring could only lie down where he was and wait. When the Giant found him, he stood still and studied him for a while. Then he gathered Ring into his arms, carried him home, and treated him with surprising kindness.
        - id: ch02-b03
          speaker: giant
          text: Wife, I found this child in the forest. You may keep him to help you around the house.
        - id: ch02-b04
          speaker: narrator
          text: The Giant's wife was delighted. She fondled Ring as if he were a little child. Ring stayed with them and obeyed them willingly in everything, and each day they treated him with greater kindness.
        - id: ch02-b05
          speaker: narrator
          text: One day the Giant led Ring through the house and showed him room after room. Only the parlour remained closed. That made Ring curious. He was sure some rare treasure must be hidden inside. So one day, while the Giant was away in the forest, Ring went to the parlour and managed to force its door halfway open.
        - id: ch02-b06
          speaker: narrator
          text: A living creature moved inside. It rushed across the floor toward Ring and said something he could not make himself hear. He leaped back in fright and slammed the door. Once his fear began to fade, curiosity made him try again, because now he wanted to know what the creature had said. The very same thing happened. Ring grew angry at his own fear. On the third attempt, he gathered all his courage, opened the door, and forced himself to stand firm.
        - id: ch02-b07
          speaker: narrator
          text: Inside stood a large Dog. It looked directly at him and spoke.
        - id: ch02-b08
          speaker: snati
          text: Choose me, Prince Ring.
        - id: ch02-b09
          speaker: narrator
          text: Ring went away feeling uneasy. The Dog did not seem like much of a treasure, yet its words stayed in his mind.
        - id: ch02-b10
          speaker: narrator
          text: No one knows how long Ring lived with the Giant and his wife. Then one day the Giant told him that the time had come to take him from the island to the mainland, because the Giant himself had little longer to live. He thanked Ring for serving the household so well and promised that the boy could choose any one thing the Giant owned.
        - id: ch02-b11
          speaker: ring
          text: You owe me no payment. The little I did was worth almost nothing. But if you truly wish to give me something, I choose whatever is in the parlour.
        - id: ch02-b12
          speaker: giant
          text: You have chosen my old wife's right hand. Still, I gave my word, and I will keep it.
        - id: ch02-b13
          speaker: narrator
          text: The Giant brought out the Dog, which ran to Ring with every sign of joy. Ring was still so afraid that he struggled to hide it.
        - id: ch02-b14
          speaker: narrator
          text: The Giant led Ring and the Dog down to the sea. A stone boat waited there, just large enough to carry the three of them. They crossed safely to the mainland. Before leaving, the Giant said a warm goodbye. He told Ring that he could take possession of everything on the island once the Giant and his wife were dead. That time, he said, would come within two weeks.
        - id: ch02-b15
          speaker: narrator
          text: Ring thanked the Giant for that promise and for all the kindness he had already shown. The Giant returned to his island, while Ring and the Dog walked away from the shore. Ring had no idea what country they had reached. He was still afraid of the Dog and could not bring himself to speak. After they had traveled in silence for some time, the Dog finally spoke first.
        - id: ch02-b16
          speaker: snati
          text: You cannot be very curious. You have not even asked my name.
        - id: ch02-b17
          speaker: ring
          text: Then what is your name?
        - id: ch02-b18
          speaker: snati
          text: You had better call me Snati-Snati. We are nearing a King's home. Ask him to shelter us for the winter and give us one small room to share.
        - id: ch02-b19
          speaker: narrator
          text: Ring was beginning to fear the Dog less. Together they reached the royal home and asked the King for shelter through the winter, with one small room for them both. The King agreed. But when his men saw the strange Dog, they began laughing. They moved toward Snati as if they meant to torment him.
        - id: ch02-b20
          speaker: ring
          text: I advise you to leave him alone. If you trouble him, you may regret it.
        - id: ch02-b21
          speaker: narrator
          text: The men answered that they did not care what Ring thought.
    - id: ch03
      title: Red's Two Tests
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After a few days, the King saw that there was something remarkable about Ring and valued him above the other men. But a counsellor named Red grew jealous of the stranger's rising place.
        - id: ch03-b02
          speaker: red
          text: I cannot understand why you think so highly of this stranger. He has done nothing to prove that he is better than anyone else.
        - id: ch03-b03
          speaker: king
          text: He has only been here a short while.
        - id: ch03-b04
          speaker: red
          text: Then send Ring and me to cut wood tomorrow. You can see which of us does more.
        - id: ch03-b05
          speaker: narrator
          text: Snati overheard the entire plan and repeated it to Ring. He advised Ring to ask the King for two axes, so he would have another ready if the first one broke. The next morning the King told Ring and Red to go into the forest and cut trees for him. Both men agreed, and Ring received the two axes he had requested.
        - id: ch03-b06
          speaker: narrator
          text: Ring took two axes, and the men went separate ways in the forest. As soon as Ring reached his place, Snati took one axe and worked beside him. That evening the King came to inspect the piles. Ring's heap was more than twice the size of Red's.
        - id: ch03-b07
          speaker: king
          text: I thought Ring was far from useless, but I have never seen so much work done in one day.
        - id: ch03-b08
          speaker: narrator
          text: The King valued Ring more than ever, which made Red still more bitter. Before long, Red suggested another trial.
        - id: ch03-b09
          speaker: red
          text: If Ring is truly such a mighty man, ask him to kill the wild oxen in the forest. Make him skin them and bring you their hides and horns before evening.
        - id: ch03-b10
          speaker: king
          text: Is that not a hopeless task? Those beasts are terribly dangerous. No one has ever dared to face them.
        - id: ch03-b11
          speaker: red
          text: He has only one life to lose. We would learn how brave he really is, and if he defeats them, you would have good reason to make him a nobleman.
        - id: ch03-b12
          speaker: narrator
          text: Red kept pressing his argument until the reluctant King gave way. One day the King asked Ring to kill the wild oxen and return with both hides and all their horns by evening. Ring had never been told how dangerous the animals were. He agreed at once and set off. Red watched him go with great delight, certain that the young man would never return alive.
        - id: ch03-b13
          speaker: narrator
          text: The moment Ring came near the oxen, they charged him with loud bellows. One was enormous, and the other was somewhat smaller. Ring was terrified.
        - id: ch03-b14
          speaker: snati
          text: Well, what do you think of them?
        - id: ch03-b15
          speaker: ring
          text: I do not like them at all.
        - id: ch03-b16
          speaker: snati
          text: If we want to survive, we have no choice but to attack. You face the smaller one. I will take the great one.
        - id: ch03-b17
          speaker: narrator
          text: Snati sprang at the enormous ox and soon brought it down. Meanwhile Ring went against the smaller beast, though he was trembling with fear. He fought as best he could, but the ox almost had him underneath its body by the time Snati finished his own battle. The Dog did not hesitate. He rushed to his master's side and helped him kill the second ox.
        - id: ch03-b18
          speaker: narrator
          text: Each began skinning an ox. Ring was only halfway done when Snati finished his. By evening the work was complete, but Ring could not carry both hides and all four horns.
        - id: ch03-b19
          speaker: snati
          text: Put everything on my back. I will carry it as far as the Palace gate.
        - id: ch03-b20
          speaker: narrator
          text: Ring loaded Snati with all the horns and the hide of the larger ox. He staggered along beneath the smaller hide himself. At the gate they set everything down. Ring went to the King and asked him to come outside, then presented the hides and horns.
        - id: ch03-b21
          speaker: king
          text: I know no man who can equal you. What courage you have shown! You have my deepest thanks.
        - id: ch03-b22
          speaker: narrator
          text: From then on, Ring sat beside the King. Everyone honored him and called him a great hero. Red could no longer speak openly against him, but he became even more determined to bring about his death.
    - id: ch04
      title: The Three Golden Treasures
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "At last Red thought of another plan. He went to the King and said he had remembered three treasures stolen about a year earlier: a gold cloak, a gold chessboard, and a bright gold piece."
        - id: ch04-b02
          speaker: king
          text: Do not remind me of those things.
        - id: ch04-b03
          speaker: red
          text: Ring is said to be mighty enough for any task. Ask him to recover the treasures before Christmas, and promise him your daughter if he succeeds.
        - id: ch04-b04
          speaker: narrator
          text: The King said it would be wrong to ask this when he could not even tell Ring where to search. Red ignored every objection and kept arguing until the King gave in. About a month before Christmas, the King called Ring to him.
        - id: ch04-b05
          speaker: king
          text: I must ask a great favor of you. Find the gold cloak, the gold chessboard, and the bright gold piece that were stolen from me last year. Bring them back before Christmas, and I will give you my daughter as your wife.
        - id: ch04-b06
          speaker: ring
          text: Where should I begin looking for them?
        - id: ch04-b07
          speaker: king
          text: You must discover that for yourself. I do not know where they are.
        - id: ch04-b08
          speaker: narrator
          text: Ring left the King and said nothing for some time. He could see that he was in terrible difficulty, since he had no idea where the treasures might be. On the other hand, the task gave him an excellent chance to marry the King's daughter. Snati saw that his master was at a loss. He told Ring not to turn away from the King's request, but warned that Ring would fall into great danger unless he followed Snati's advice exactly. Ring agreed and began preparing for the journey.
        - id: ch04-b09
          speaker: snati
          text: First, go all around this country and collect as much salt as you possibly can.
        - id: ch04-b10
          speaker: narrator
          text: Ring gathered so much salt that he could hardly lift it.
        - id: ch04-b11
          speaker: snati
          text: Put it on my back.
        - id: ch04-b12
          speaker: narrator
          text: Snati carried the salt and ran ahead until they reached a steep cliff.
        - id: ch04-b13
          speaker: snati
          text: We have to climb here.
        - id: ch04-b14
          speaker: ring
          text: That does not look easy at all.
        - id: ch04-b15
          speaker: snati
          text: Hold tightly to my tail.
        - id: ch04-b16
          speaker: narrator
          text: Ring gripped Snati's tail, and the Dog pulled him onto the lowest ledge. When Snati climbed to the second ledge, Ring became dizzy from the height. On the third climb, he was nearly fainting. Snati made one last effort and reached the top, where Ring fell to the ground unconscious. After a little while he recovered. They crossed a short stretch of level ground until they came to a cave.
        - id: ch04-b17
          speaker: narrator
          text: It was Christmas Eve. They climbed above the cave and looked through a window. Inside, four trolls slept beside a fire, with a large pot of porridge hanging over it.
        - id: ch04-b18
          speaker: snati
          text: Pour every bit of the salt into that porridge pot.
        - id: ch04-b19
          speaker: narrator
          text: Ring emptied in the salt. Before long the trolls woke. The old hag, the most frightful of them all, tasted the porridge first.
        - id: ch04-b20
          speaker: troll_hag
          text: What has happened here? The porridge is full of salt! Only yesterday I used witchcraft to draw this milk from four kingdoms, and now it is ruined!
        - id: ch04-b21
          speaker: narrator
          text: One after another, the other trolls came to taste the porridge. Unlike the hag, they thought it was good, and soon the family had eaten it all. Then the salt began to work. The old hag grew so thirsty that she could no longer endure it. She told her daughter to go outside and bring back water from the river nearby.
        - id: ch04-b22
          speaker: troll_daughter
          text: I will not go unless you lend me your bright gold piece.
        - id: ch04-b23
          speaker: troll_hag
          text: You will not have it, even if I die of thirst.
        - id: ch04-b24
          speaker: troll_daughter
          text: Then die.
        - id: ch04-b25
          speaker: troll_hag
          text: Oh, take it, you brat! Go now, and hurry back with that water.
        - id: ch04-b26
          speaker: narrator
          text: The daughter took the gold piece. It was so bright that it lit the whole plain as she ran. At the river she lay down to drink. Ring and Snati had already climbed from the roof, and they pushed her headfirst into the water.
        - id: ch04-b27
          speaker: narrator
          text: Back in the cave, the hag waited impatiently for her water. When the girl did not return, her mother decided she must be running all over the plain, showing off the shining gold piece. At last the hag turned to her son and ordered him to fetch even a single drop of water.
        - id: ch04-b28
          speaker: troll_son
          text: I will not go unless you give me the gold cloak.
        - id: ch04-b29
          speaker: troll_hag
          text: You will never have it, even if I die.
        - id: ch04-b30
          speaker: troll_son
          text: Then you may die.
        - id: ch04-b31
          speaker: troll_hag
          text: Take it, then! Go, and be quick with the water.
        - id: ch04-b32
          speaker: narrator
          text: The son put on the cloak. Its golden light showed him the way outside and down to the river. When he bent to drink, Ring and Snati leaped on him, stripped away the cloak, and threw him into the water.
        - id: ch04-b33
          speaker: narrator
          text: Still no water came. The old hag could bear her thirst no longer. She complained to her husband that both children were surely running around and amusing themselves, just as she had expected those little wretches to do. Then she ordered the old troll himself to go out and bring her a drink.
        - id: ch04-b34
          speaker: old_troll
          text: I will not go unless you lend me the gold chessboard.
        - id: ch04-b35
          speaker: troll_hag
          text: You cannot have it, even if I die.
        - id: ch04-b36
          speaker: old_troll
          text: You might as well let me. It is a very small favor to ask.
        - id: ch04-b37
          speaker: troll_hag
          text: Take it, you complete disgrace! You are no better than those two brats.
        - id: ch04-b38
          speaker: narrator
          text: The old troll carried the chessboard down to the river. Just as he stooped to drink, Ring and Snati seized the board and threw him in. But while they climbed back toward the cave, they saw the old troll's ghost marching up from the water.
        - id: ch04-b39
          speaker: narrator
          text: Snati attacked the ghost at once, and Ring joined him. After a hard struggle, they defeated the old troll for a second time. When they returned to the window, the hag was heading for the door.
        - id: ch04-b40
          speaker: snati
          text: We must rush inside and stop her there. If she gets out, we will have no chance. She is the worst witch who ever lived, and iron cannot cut her. One of us must pour boiling porridge over her while the other strikes her with red-hot iron.
        - id: ch04-b41
          speaker: narrator
          text: They hurried into the cave. The moment the hag saw them, she knew who Ring was.
        - id: ch04-b42
          speaker: troll_hag
          text: So you have come, Prince Ring. You must have dealt with my husband and children.
        - id: ch04-b43
          speaker: narrator
          text: As she moved to attack, Snati sprang at her with a red-hot iron from the fire. Ring poured boiling porridge over her without stopping. In that way, they finally killed her.
        - id: ch04-b44
          speaker: narrator
          text: When the struggle was over, they burned both the hag and the old troll until nothing remained but ashes. Then they explored every part of the cave. It held a great quantity of gold and many other treasures. They chose the most valuable things, carried them as far as the cliff, and left them there for later. Then they hurried home with the King's three lost treasures.
        - id: ch04-b45
          speaker: narrator
          text: They reached the Palace late on Christmas night, and Ring placed the gold cloak, the gold chessboard, and the bright gold piece before the King.
    - id: ch05
      title: A Hand in the Night
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The King was beside himself with joy. He could hardly believe that Ring had succeeded where no one else could even have known where to begin. He marveled at the young man's cleverness in every kind of trial and valued him more highly than ever. As promised, he betrothed his daughter to Ring. A great feast began in their honor and was to last throughout Christmastide.
        - id: ch05-b02
          speaker: narrator
          text: Ring thanked the King courteously for the marriage and for every other kindness. When he had finished eating and drinking in the hall, he went to his room to sleep. Snati made an unusual request.
        - id: ch05-b03
          speaker: snati
          text: Let me sleep in your bed tonight. You can sleep in my usual place.
        - id: ch05-b04
          speaker: ring
          text: Of course. After all you have done for me, you deserve far more than that.
        - id: ch05-b05
          speaker: narrator
          text: Snati climbed into Ring's bed. Some time later, he returned and told Ring that he could sleep there now. But he warned him not to touch anything he found in the bed.
        - id: ch05-b06
          speaker: narrator
          text: Meanwhile, Red entered the great hall and showed the King his right arm. Its hand was gone.
        - id: ch05-b07
          speaker: red
          text: Now you can see what sort of man your future son-in-law truly is. He cut off my hand for no reason at all.
        - id: ch05-b08
          speaker: narrator
          text: The King was furious at the charge against the man who was to marry his daughter. Still, he declared that he would learn the truth before passing judgment. If Ring had taken Red's hand without cause, Ring would be hanged. If the attack had happened differently, then Red would die instead. The King sent for Ring and demanded to know why he had cut off the counsellor's hand.
        - id: ch05-b09
          speaker: narrator
          text: Snati had already told Ring what happened during the night. Instead of answering at once, Ring asked the King to come with him. In Ring's room, the King saw a severed hand lying on the bed. It was still gripping a sword.
        - id: ch05-b10
          speaker: ring
          text: During the night, this hand reached over the partition with that sword. It would have run me through in my bed if I had not defended myself.
        - id: ch05-b11
          speaker: king
          text: Then I cannot blame you for saving your own life. Red has earned his death.
        - id: ch05-b12
          speaker: narrator
          text: Red was hanged, and Ring married the King's daughter.
    - id: ch06
      title: The Two Princes Named Ring
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: On the first night Ring and his bride went to bed, Snati asked to lie at their feet. Ring gave him permission. In the night, Ring woke to howling and cries beside them.
        - id: ch06-b02
          speaker: narrator
          text: He quickly struck a light and looked around. An ugly dog's skin lay close beside him, while a beautiful young Prince lay unconscious in the bed. Ring understood that something extraordinary had happened. He immediately picked up the skin and burned it. Then he took the stranger by the shoulders and shook him until he opened his eyes.
        - id: ch06-b03
          speaker: ring
          text: Who are you? What is your name?
        - id: ch06-b04
          speaker: freed_prince
          text: My name is Ring, and I am a King's son. My mother died when I was young. My father married again, and his new wife was a witch. She cast a spell that changed me into a dog.
        - id: ch06-b05
          speaker: freed_prince
          text: The spell could only end if a Prince who shared my name let me sleep at his feet on the first night after his wedding.
        - id: ch06-b06
          speaker: freed_prince
          text: When the witch learned that you were also called Ring, she tried to destroy you before you could set me free. She was the hind you chased through the forest. She was the woman beside the barrel in the clearing. And she was the old hag we killed in the cave.
        - id: ch06-b07
          speaker: narrator
          text: When all the wedding feasting had ended, the two Princes who shared the name Ring gathered a company of men. They returned to the steep cliff and brought home every treasure that Ring and Snati had left there. After that they sailed to the Giant's island. The Giant and his wife were gone, just as he had foretold, and the men removed everything of value from the island too.
        - id: ch06-b08
          speaker: narrator
          text: Ring gave his sister Ingiborg in marriage to the Prince he had freed. He also entrusted his father's kingdom to his namesake. Ring himself remained with his father-in-law. He received half the kingdom while the old King lived, and after the King's death, it all became his.
