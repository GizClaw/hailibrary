audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的神秘与克制, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    ring:
      display_name: 林王子
      tts: {delivery: 彬彬有礼，诚恳中渐渐显出勇气, timbre: 清亮年轻, pace: 适中, pitch: 中音}
    woman:
      display_name: 林中女人
      tts: {delivery: 起初和善，随后冷酷得意, timbre: 圆滑成熟, pace: 从容, pitch: 中低音}
    giant:
      display_name: 巨人
      tts: {delivery: 威严直率，却有深厚善意, timbre: 洪亮浑厚, pace: 舒缓, pitch: 低音}
    snati:
      display_name: 斯纳蒂—斯纳蒂
      tts: {delivery: 忠诚机敏，说话果断而胸有成竹, timbre: 坚实洪亮, pace: 适中, pitch: 中低音}
    king:
      display_name: 国王
      tts: {delivery: 庄重宽厚，思虑周全, timbre: 醇厚成熟, pace: 适中, pitch: 中低音}
    red:
      display_name: 雷德
      tts: {delivery: 心怀嫉妒，表面恭敬而暗藏算计, timbre: 干涩偏窄, pace: 从容, pitch: 中音}
    troll_hag:
      display_name: 老妖婆
      tts: {delivery: 凶狠专横，语气暴躁多疑, timbre: 粗粝苍老, pace: 适中, pitch: 低音}
    troll_daughter:
      display_name: 山怪女儿
      tts: {delivery: 任性尖刻，索要东西时毫不退让, timbre: 粗哑年轻, pace: 稍快, pitch: 中高音}
    troll_son:
      display_name: 山怪儿子
      tts: {delivery: 固执不耐烦，说话又闷又冲, timbre: 沉重年轻, pace: 适中, pitch: 中低音}
    old_troll:
      display_name: 老山怪
      tts: {delivery: 满腹牢骚，固执中带着狡猾, timbre: 苍老沙哑, pace: 缓慢, pitch: 低音}
    freed_prince:
      display_name: 被解救的林王子
      tts: {delivery: 高贵真诚，重获自由后满怀感激, timbre: 清朗沉稳, pace: 适中, pitch: 中低音}
  chapters:
    - id: ch01
      title: 金环与木桶
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一个王国里住着国王和王后。他们有一双儿女，女儿名叫英吉堡，儿子名叫林。那时候的贵族男子大多喜欢冒险，林却不太一样。他没有非凡的力气，也没凭武艺出过名。
        - id: ch01-b02
          speaker: narrator
          text: 林十二岁那年，一个晴朗的冬日，他带着随从骑马进森林游玩。他们一路走了很远，忽然看见一头母鹿，鹿角上套着一枚金环。林很想捉住它，便领着众人纵马追赶，一刻也不停。马匹一匹接一匹累得再也跑不动，最后连林自己的马也支撑不住了。
        - id: ch01-b03
          speaker: narrator
          text: 就在这时，四周突然黑得伸手不见五指，母鹿也消失了。他们早已远离人烟，附近连一座房子也没有。众人觉得早该回家了，这才发现自己迷了路。起初大家还走在一起，后来人人都觉得自己认准的方向才对，谁也不肯跟着别人走，于是便各奔东西。
        - id: ch01-b04
          speaker: narrator
          text: 林也跟其余人一样迷失了方向。他独自走了一阵，来到林中一片靠海的小空地。那里有个女人坐在椅子上，身边立着一只大木桶。林有礼貌地向她问好，她也亲切地招呼林。林低头一看，桶底躺着一枚美得出奇的金戒指。他喜欢极了，盯着看了许久，怎么也移不开眼睛。女人把这一切都看在眼里。
        - id: ch01-b05
          speaker: woman
          text: 喜欢就拿去吧，只要你肯伸手把它取出来。
        - id: ch01-b06
          speaker: ring
          text: 谢谢您。这样一枚戒指，当然值得试一试。
        - id: ch01-b07
          speaker: narrator
          text: 木桶看着一点儿也不深。林探身进去，以为一伸手就能碰到戒指。可他越往下够，桶就变得越深。他正拼命伸长手臂，女人忽然站起来，一把将他头朝下推进桶里。
        - id: ch01-b08
          speaker: woman
          text: 好了，你就在里头安家吧。
        - id: ch01-b09
          speaker: narrator
          text: 女人扣紧桶盖，把木桶扔进大海。林感觉自己漂离陆地，随着海浪上下颠簸，心里明白，这下可糟透了。
        - id: ch01-b10
          speaker: narrator
          text: 他不知道在海上漂了多少天。终于，木桶撞上岩石，发出咚咚的响声。林心里有了一点希望，也许那是陆地，不是大海中央一块孤零零的礁石。他还算会游水，最后狠下心踹破桶底，从缺口钻出来，游向岸边。海边的岩石平坦光滑，他总算平安爬了上去。
        - id: ch01-b11
          speaker: narrator
          text: 可岸边上方全是高高的峭壁。林沿着崖脚走了好一阵，才选定一处向上攀爬。他费尽力气，终于登上崖顶。
    - id: ch02
      title: 客厅里的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 林站在高处四下张望，发现这里是一座小岛。岛上长满树林，枝头还结着苹果，看起来十分宜人。他独自在岛上过了几天。一天，森林里忽然传来震天巨响，吓得他赶紧躲进树丛。
        - id: ch02-b02
          speaker: narrator
          text: 一个巨人拖着满载木柴的雪橇，直直朝他走来。林无路可逃，只能伏在原地。巨人发现他以后，停下来端详片刻，接着把他抱回了家，还待他出奇地和善。
        - id: ch02-b03
          speaker: giant
          text: 老伴，我在树林里捡到这个孩子。把他留下吧，也能帮你做些家务。
        - id: ch02-b04
          speaker: narrator
          text: 巨人的妻子高兴极了，把林当小孩子一样搂了又搂。林从此住下来，凡是交给他的事，他都勤快去做，对巨人夫妇也十分听话。他们看在眼里，待他一天比一天亲厚。
        - id: ch02-b05
          speaker: narrator
          text: 一天，巨人带林看遍家里所有房间，只有客厅始终锁着。林越想越好奇，觉得里面一定藏着极稀罕的珍宝。后来，巨人又进森林去了，林便悄悄来到客厅门外，费了好一番力气，才把门推开一半。一个活物在屋里动了动，随即贴着地面朝他冲来，嘴里还说了什么。林吓得猛然跳开，砰地关上门。
        - id: ch02-b06
          speaker: narrator
          text: 惊慌过去以后，他又想听清那句话，便再试一次，结果还是被吓了回来。林气自己胆小，第三次鼓足勇气推开门，站在那里不再后退。这回他看清了，屋里是一条大狗。
        - id: ch02-b07
          speaker: snati
          text: 选我吧，林王子。
        - id: ch02-b08
          speaker: narrator
          text: 林不安地走开了。那条狗看起来怎么也不像珍宝，可这句话一直留在他心里。
        - id: ch02-b09
          speaker: narrator
          text: 不知过了多久，巨人告诉林，自己已经活不了多久，该把他送回大陆了。巨人感谢林这些日子的帮助，让他从家中任挑一样东西。
        - id: ch02-b10
          speaker: ring
          text: 我做的那点事不值得酬谢。不过，您若一定要送我东西，我想要客厅里的那一样。
        - id: ch02-b11
          speaker: giant
          text: 哎呀，你选中了我老伴的右手！可我已经答应你，绝不能反悔。
        - id: ch02-b12
          speaker: narrator
          text: 巨人把狗领出来，它欢喜地跑向林。林还是怕得厉害，只能竭力不让自己露怯。巨人又带他们来到海边。那里停着一条石船，大小恰好容下巨人、王子和狗。他们乘船渡过海。到了大陆，巨人亲切地向林告别，还说自己和妻子不到两个星期就会死去，到时岛上的一切都归林所有。
        - id: ch02-b13
          speaker: narrator
          text: 林谢过巨人的馈赠和照顾，带着狗离开海岸。他不知道自己到了哪个国家，也不敢跟狗说话。沉默着走了一阵，狗终于先开口了。
        - id: ch02-b14
          speaker: snati
          text: 你可真不好奇，竟然连我的名字都不问。
        - id: ch02-b15
          speaker: ring
          text: 那么，你叫什么名字？
        - id: ch02-b16
          speaker: snati
          text: 你就叫我斯纳蒂—斯纳蒂吧。前面快到一位国王的宫殿了。请他收留我们过冬，再给咱们一间小屋住。
        - id: ch02-b17
          speaker: narrator
          text: 林渐渐不那么怕它了。他们来到宫中，国王答应收留他们。臣仆们见到这条怪狗，都笑着想去捉弄它。林劝他们住手，否则吃亏的可能是他们自己。那些人却说，谁也不在乎他的意见。
    - id: ch03
      title: 雷德的两次考验
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 过了几天，国王看出林很不寻常，越来越器重他。谋臣雷德却妒火中烧，跑去对国王挑拨。
        - id: ch03-b02
          speaker: red
          text: 这个外乡人什么本事也没显露过，您为什么把他看得比别人都高？
        - id: ch03-b03
          speaker: king
          text: 他来到这里毕竟还没多久。
        - id: ch03-b04
          speaker: red
          text: 那就让我们明天一起去砍柴，看看谁干得更多。
        - id: ch03-b05
          speaker: narrator
          text: 斯纳蒂听见了这番密谋，马上转告林，又叫他向国王要两把斧头，免得第一把坏了便无斧可用。第二天，国王命林和雷德进森林伐木。两人都答应了，林也领到了两把斧头。他们分头走开以后，斯纳蒂拿起备用的那一把，和林一同砍树。傍晚，国王照约定前来查看，只见林堆起的木柴比雷德的两倍还多。
        - id: ch03-b06
          speaker: king
          text: 我早知道林不是个无用的人。这样的活儿，我从没见谁一天干完过。
        - id: ch03-b07
          speaker: narrator
          text: 国王更加器重林，雷德也更加不满。他又向国王进言，说林既然真是个了不起的勇士，就该派他去对付森林里的野牛。雷德要他当天杀死野牛，剥下牛皮，再赶在傍晚以前，把所有牛皮和牛角带回宫中。
        - id: ch03-b08
          speaker: king
          text: 那几头野牛凶险无比，从来没人敢去对付。你这不是叫他送死吗？
        - id: ch03-b09
          speaker: red
          text: 他也只有一条命，正好让我们看看他有多勇敢。要是他真能赢，您也有理由封他为贵族。
        - id: ch03-b10
          speaker: narrator
          text: 国王本不愿意，却经不住雷德一再纠缠，终于答应了。一天，他把林叫来，要林进森林杀掉那些野牛，傍晚带回牛角和牛皮。林不知道野牛有多可怕，立刻答应下来，马上动身。雷德暗自欢喜，认定他这回死定了。
        - id: ch03-b11
          speaker: narrator
          text: 林一看见野牛，它们便咆哮着冲来。一头大得吓人，另一头稍小些。林怕得浑身发冷。
        - id: ch03-b12
          speaker: snati
          text: 这两头野牛，你觉得怎么样？
        - id: ch03-b13
          speaker: ring
          text: 糟透了，我一点儿也不喜欢。
        - id: ch03-b14
          speaker: snati
          text: 想活命就只能迎上去。你对付小的，我来收拾大的。
        - id: ch03-b15
          speaker: narrator
          text: 斯纳蒂扑向大野牛，很快便把它放倒。林战战兢兢地迎战另一头，眼看就要被压在身下，斯纳蒂及时赶来，帮主人杀死了它。
        - id: ch03-b16
          speaker: narrator
          text: 他们各自剥牛皮。斯纳蒂早已干完，林才剥到一半。等两人把活儿全做完，林又发愁自己背不动两张牛皮和所有牛角。斯纳蒂叫他把东西全放到自己背上，一直驮到宫门。
        - id: ch03-b17
          speaker: narrator
          text: 林把牛角和两张牛皮都放到斯纳蒂背上，只留下较小的那张皮给自己。他扛着它一路走得东倒西歪。到了宫门，两人把东西全卸在地上。林先进去见国王，请他亲自走到门外，然后把两头牛的皮和角全部交上。国王惊叹他的勇武，说再也找不到第二个像他这样的人，又诚心感谢他的功劳。
    - id: ch04
      title: 三件失落的宝物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 从此，国王让林坐在自己身边，人人都敬重他，把他当作大英雄。雷德再也找不到话攻击他，心里却更想除掉他。一天，他忽然想出一条计策，便去告诉国王，自己刚刚想起国王大约一年前丢失的金斗篷、金棋盘和明亮的金币。
        - id: ch04-b02
          speaker: king
          text: 别再让我想起那些宝物！
        - id: ch04-b03
          speaker: red
          text: 林不是无所不能吗？请他在圣诞节前找回宝物。只要他成功，您就把女儿嫁给他。
        - id: ch04-b04
          speaker: narrator
          text: 国王觉得这要求很不妥，因为他连宝物在哪里都不知道。可雷德不停劝说，直到国王让步。离圣诞节还有一个月左右时，国王把林叫来，说有件大事想请他帮忙。
        - id: ch04-b05
          speaker: ring
          text: 您要我做什么？
        - id: ch04-b06
          speaker: king
          text: 请你找回我的金斗篷、金棋盘和明亮的金币。它们大约一年前被偷走了。你若能在圣诞节前带回来，我就把女儿嫁给你。
        - id: ch04-b07
          speaker: ring
          text: 可我应该去哪里找呢？
        - id: ch04-b08
          speaker: king
          text: 这只能靠你自己查明，我也不知道。
        - id: ch04-b09
          speaker: narrator
          text: 林离开国王后沉默了很久。他知道自己陷进了天大的难题，可从另一方面说，能有机会娶到公主，又实在叫人高兴。斯纳蒂看出主人束手无策，告诉他，国王交代的事不能不做。不过，他必须事事照自己的指点去办，否则就会遇上大麻烦。林答应了，随即开始准备远行。
        - id: ch04-b10
          speaker: snati
          text: 先走遍附近各处，能收集多少盐，就收集多少。
        - id: ch04-b11
          speaker: narrator
          text: 林找来的盐多得几乎背不动。斯纳蒂把盐驮到背上，领他来到一座陡峭的悬崖脚下。
        - id: ch04-b12
          speaker: snati
          text: 咱们得从这里爬上去。
        - id: ch04-b13
          speaker: ring
          text: 这可一点儿也不轻松。
        - id: ch04-b14
          speaker: snati
          text: 抓紧我的尾巴。
        - id: ch04-b15
          speaker: narrator
          text: 斯纳蒂把林拖上第一层岩台，又跃上第二层。林头晕目眩，快要昏过去了。斯纳蒂第三次奋力一跃，终于登上崖顶。林一到上面便晕倒在地，过了一会儿才醒来。
        - id: ch04-b16
          speaker: narrator
          text: 林醒来以后，他们沿着平坦的原野走了一小段，来到一个洞穴。那天正是圣诞前夜。他们没有从洞口进去，而是爬上洞顶，找到一扇窗户，从那里朝里看。只见四个山怪正睡在火边，火焰上方吊着一口煮粥的大锅。
        - id: ch04-b17
          speaker: snati
          text: 把所有盐都倒进那口粥锅。
    - id: ch05
      title: 山怪的洞穴
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 林把盐全倒了进去。山怪们不久便醒了。最可怕的老妖婆先尝一口粥，立刻叫起来。
        - id: ch05-b02
          speaker: troll_hag
          text: 这是怎么回事？粥怎么这么咸！昨天我才施巫术，从四个王国弄来牛奶，今天竟煮成了咸粥！
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: 其余三个山怪听见叫声，也都围到锅边尝了尝，反而觉得这锅咸粥滋味不错。他们就这样把粥吃了个精光。没过多久，老妖婆渴得嗓子冒烟，再也忍受不住，只好叫女儿到外面去，从附近的河里取些水来。
        - id: ch05-b04
          speaker: troll_daughter
          text: 把那枚明亮的金币借给我，不然我不去。
        - id: ch05-b05
          speaker: troll_hag
          text: 就算我渴死，也绝不给你！
          emotion: angry
        - id: ch05-b06
          speaker: troll_daughter
          text: 那你就渴死吧。
        - id: ch05-b07
          speaker: troll_hag
          text: 好吧，你这个小坏蛋，拿去！快把水带回来，别磨磨蹭蹭。
        - id: ch05-b08
          speaker: narrator
          text: 女儿拿着金币跑出洞去。那金币明亮得出奇，光芒照遍了整片原野。她一路来到河边，俯下身去喝水。趁这个时候，林和斯纳蒂已经从洞顶下来，悄悄赶到她身后，一把将她头朝下推进河中。
        - id: ch05-b09
          speaker: narrator
          text: 老妖婆等不到水，抱怨女儿准是拿着金币四处乱跑，又叫儿子去取水。
        - id: ch05-b10
          speaker: troll_son
          text: 把金斗篷给我，不然我不去。
        - id: ch05-b11
          speaker: troll_hag
          text: 就算我渴死，也绝不给你！
          emotion: angry
        - id: ch05-b12
          speaker: troll_son
          text: 那你就渴死吧。
        - id: ch05-b13
          speaker: troll_hag
          text: 好吧，拿去！快去取水，一定要赶快回来。
        - id: ch05-b14
          speaker: narrator
          text: 儿子披上金斗篷。斗篷光芒四射，把脚下的路照得清清楚楚。他走到河边，正要喝水，林和斯纳蒂便扑上去，夺下斗篷，将他扔进河里。
        - id: ch05-b15
          speaker: narrator
          text: 老妖婆渴得再也忍不住，又叫丈夫去取水。她说那两个小坏蛋果然在外面到处游荡玩耍。
        - id: ch05-b16
          speaker: old_troll
          text: 把金棋盘借给我，不然我不去。
        - id: ch05-b17
          speaker: troll_hag
          text: 就算我渴死，也绝不给你！
          emotion: angry
        - id: ch05-b18
          speaker: old_troll
          text: 这么小的请求你都不答应，那你还是渴死算了。
        - id: ch05-b19
          speaker: troll_hag
          text: 拿去吧，你这个没出息的东西！你跟那两个小坏蛋简直一个样。
          emotion: angry
        - id: ch05-b20
          speaker: narrator
          text: 老山怪带着金棋盘走出洞穴，一路来到河边。他正要俯下身喝水，林和斯纳蒂冲出来，抢走棋盘，把他也推进河里。两人还没回到洞顶，就看见那个老家伙的鬼魂从河里爬出，朝他们大步走来。斯纳蒂立刻扑上去，林也从旁相助。经过一场恶战，他们才第二次制伏了他。
        - id: ch05-b21
          speaker: narrator
          text: 他们回到窗口时，老妖婆正朝洞门走去。
        - id: ch05-b22
          speaker: snati
          text: 马上冲进去，趁她还在洞里制伏她。要是让她走出来，咱们就毫无胜算。她是世上最凶恶的女巫，铁器伤不了她。一个人不断把滚烫的粥泼到她身上，另一个人拿烧红的铁器刺她。
        - id: ch05-b23
          speaker: narrator
          text: 两人冲进洞去。老妖婆一见他们便开了口。
        - id: ch05-b24
          speaker: troll_hag
          text: 林王子，你果然来了。我的丈夫和孩子，想必都叫你收拾了。
        - id: ch05-b25
          speaker: narrator
          text: 斯纳蒂看出老妖婆正要进攻，便从火里抽出一件烧得通红的铁器，猛扑过去。林则守在粥锅旁，不停把滚烫的粥浇在她身上。两个人照这个办法苦战，终于杀死了她。随后，他们把老山怪和妖婆烧成灰烬，又仔细搜遍洞穴，在里面找到了大量黄金和珍宝。
        - id: ch05-b26
          speaker: narrator
          text: 他们从洞里的财宝中挑出最贵重的，一件件搬到悬崖边，暂时留在那里。随后，两人不敢耽搁，带着国王丢失的三件宝物匆匆赶回宫殿。圣诞节当晚很迟的时候，他们终于到了。林走到国王面前，把金斗篷、金棋盘和明亮的金币一一交还。
    - id: ch06
      title: 雷德的断手
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 国王欣喜若狂，也惊叹林无论遇到什么考验都有办法。他比从前更加器重林，当场把女儿许配给他，还宣布订婚宴要延续整个圣诞节期。林彬彬有礼地感谢国王赐婚，也谢过他从前的种种照顾。那晚，他在大厅里吃喝完毕，便回自己的房间睡觉。
        - id: ch06-b02
          speaker: snati
          text: 今晚让我睡在你的床上吧，你去睡我平常躺的地方。
        - id: ch06-b03
          speaker: ring
          text: 当然可以。你为我做了这么多，这点回报远远不够。
        - id: ch06-b04
          speaker: narrator
          text: 斯纳蒂上了王子的床。过了一阵，它回来叫醒林。
        - id: ch06-b05
          speaker: snati
          text: 现在你可以回床上睡了，不过别碰床上的任何东西。
        - id: ch06-b06
          speaker: narrator
          text: 再说雷德。他来到大厅，举起失去右手的胳膊给国王看，还说，国王现在总该看清未来的女婿究竟是什么样的人了，因为林没有任何缘由就砍掉了他的手。国王听后勃然大怒，当即决定把真相查个明白。
        - id: ch06-b07
          speaker: king
          text: 要是林毫无缘由地砍了你的手，我就绞死他。若是另有缘故，那该死的人就是你。
        - id: ch06-b08
          speaker: narrator
          text: 国王立刻派人召来林，当面问他为什么砍掉雷德的手。斯纳蒂早已把夜里发生的事告诉林。林没有站在大厅里争辩，只请国王跟自己去看一样东西。国王随他来到卧房，只见床上赫然躺着一只人的断手，手中还紧紧握着一把剑。
        - id: ch06-b09
          speaker: ring
          text: 昨晚，这只手从隔板上方伸过来，想用剑刺穿睡在床上的我。要不是我出手自卫，现在已经没命了。
        - id: ch06-b10
          speaker: king
          text: 既然是这样，我不能责怪你保住自己的性命。雷德确实死有余辜。
        - id: ch06-b11
          speaker: narrator
          text: 雷德被处以绞刑。随后，林和国王的女儿举行了婚礼。
    - id: ch07
      title: 两位同名的王子
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 新婚之夜，夫妻俩上床时，斯纳蒂又向林提出一个请求。
        - id: ch07-b02
          speaker: snati
          text: 今晚，请准许我卧在你们脚边。
        - id: ch07-b03
          speaker: narrator
          text: 林答应了。半夜，他听见身边传来一阵号叫和呼喊，连忙点起灯。只见近旁落着一张丑陋的狗皮，床上却躺着一位俊美的王子。林立刻抓起狗皮，把它扔进火里烧掉。随后，他回到床边，不停摇晃那个昏迷不醒的人，直到对方终于睁开眼睛。
        - id: ch07-b04
          speaker: ring
          text: 你叫什么名字？
        - id: ch07-b05
          speaker: freed_prince
          text: 我也叫林，是一位国王的儿子。我年幼时失去了母亲，父亲后来娶了一个女巫。她对我施了魔法，把我变成一条狗。只有一个与我同名的王子，在自己新婚之夜准许我睡在脚边，我才能摆脱咒语。
        - id: ch07-b06
          speaker: freed_prince
          text: 女巫一知道你和我同名，就想方设法害死你，免得你替我解除魔法。你和随从追赶的母鹿是她，空地上守着木桶的女人是她，我们刚在洞里杀死的老妖婆也是她。
        - id: ch07-b07
          speaker: narrator
          text: 漫长的宴会终于结束。两位同名的王子带着一队人马来到悬崖，把先前留在那里的珍宝全部运回宫殿。办完这件事，他们又乘船前往巨人居住过的小岛，把岛上一切值钱的东西也搬了回来。
        - id: ch07-b08
          speaker: narrator
          text: 林把妹妹英吉堡许配给那位被他解除魔咒的同名王子，还把父王的王国交给他治理。林自己则留在岳父身边。国王在世的时候，他分得半个王国。等国王去世以后，他便继承了整个王国。
