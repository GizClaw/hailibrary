audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与温情
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    youth:
      display_name: 青年
      tts:
        delivery: 勇敢机敏，年轻坦率，历经磨难后更加沉稳
        timbre: 清朗坚实
        pace: 适中
        pitch: 中音
    eastern_magician:
      display_name: 东方魔法师
      tts:
        delivery: 睿智沉着，说话清楚而有分量
        timbre: 苍老醇厚
        pace: 舒缓
        pitch: 中低音
    bird_1:
      display_name: 彩羽鸟甲
      tts:
        delivery: 机灵好奇，话里带着一点调侃
        timbre: 清脆明亮
        pace: 轻快
        pitch: 高音
    bird_2:
      display_name: 彩羽鸟乙
      tts:
        delivery: 见多识广，语气活泼而笃定
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高音
    witch_maiden:
      display_name: 女巫姑娘
      tts:
        delivery: 美丽自信，温柔时迷人，愤怒时冷厉威严
        timbre: 柔润清冷
        pace: 从容
        pitch: 中高音
    warning_voice:
      display_name: 神秘声音
      tts:
        delivery: 遥远而郑重，反复发出警告
        timbre: 轻柔空灵
        pace: 缓慢
        pitch: 中音
    raven:
      display_name: 乌鸦
      tts:
        delivery: 果断机敏，出言简短有力
        timbre: 粗哑清晰
        pace: 稍快
        pitch: 中低音
    king:
      display_name: 老国王
      tts:
        delivery: 威严宽厚，忧心国土与家人
        timbre: 浑厚稳重
        pace: 从容
        pitch: 低音
    princess:
      display_name: 公主
      tts:
        delivery: 温柔坚定，对丈夫深情而执着
        timbre: 清澈柔和
        pace: 稍缓
        pitch: 中高音
    finnish_magician:
      display_name: 芬兰魔法师
      tts:
        delivery: 审慎神秘，判断明确
        timbre: 苍劲低沉
        pace: 缓慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 寻找所罗门王的戒指
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，一头可怕的怪物从北方闯进人间。它一路吞吃人和牲畜，把大片土地变成荒野。人们害怕再没人来救，大地上的活物迟早会被它吃光。
        - id: ch01-b02
          speaker: narrator
          text: 怪物长着牛一样的身子、青蛙一样的四条腿。两条前腿又短又小，两条后腿却又粗又长，身后还拖着一条十英寻长的蛇尾。它走路也像青蛙，一蹦就是半英里。幸好它每到一个地方，总要停留好几年，把周围的人畜全吃光以后，才会继续向前。
        - id: ch01-b03
          speaker: narrator
          text: 它全身的鳞片比石头和金属还硬，任何猎人都伤不了它。两只巨眼到了夜里灿若明灯，白天也一样耀眼。谁不幸看上一眼，就会像中了魔法，身不由己地冲进它的嘴里。恶龙因此躺着不动，也有人兽自动送到口中。邻国的国王们悬下重赏，无论用武力还是法术，只要能除掉它就有厚报。许多人前去碰运气，却个个惨败。人们甚至点燃它栖身的大森林。整片森林烧成灰烬，火焰还是没伤它一分。
        - id: ch01-b04
          speaker: narrator
          text: 本国的智者中却流传着一个古老的说法。所罗门王有一枚刻着神秘铭文的印戒，谁拥有它，又有足够的智慧读懂戒上的字，就能找到杀死北方之龙的办法。只是没人知道戒指藏在哪里，世上也找不到一位能解读铭文的术士或学者。
        - id: ch01-b05
          speaker: narrator
          text: 后来，一位善良勇敢的青年出发寻找戒指。他听说古老的智慧来自东方，便一路朝太阳升起的方向走。几年后，他终于遇见一位著名的东方魔法师，赶紧向老人求教。
        - id: ch01-b06
          speaker: eastern_magician
          text: 凡人的智慧太浅，帮不了你。天上的鸟儿或许能为你指路，只要你听得懂它们的话。留下住几天，我可以教会你。
        - id: ch01-b07
          speaker: youth
          text: 多谢您。眼下我没有东西报答，可我要是能办成这件事，一定重重酬谢您。
        - id: ch01-b08
          speaker: narrator
          text: 魔法师独自在月光下采来九种药草，熬成一剂强大的药。他让青年连喝三天，每天九匙。到第三天，青年果然听懂了鸟语。
        - id: ch01-b09
          speaker: eastern_magician
          text: 要是你找到了所罗门王的戒指，就回来找我。我能替你读懂戒上的铭文，全世界再没有第二个人能做到。
        - id: ch01-b10
          speaker: narrator
          text: 青年继续赶路。从此有飞鸟陪他交谈，他再也不觉得孤单，也从鸟儿那里听到了许多凡人的学问永远教不了他的事。可日子一天天过去，戒指始终没有消息。一天傍晚，他走得又热又累，坐在森林的一棵树下吃晚饭，忽然看见树梢上栖着两只从未见过的彩羽鸟。它们正在谈论他。
        - id: ch01-b11
          speaker: bird_1
          text: 我认得树下那个到处乱跑的傻瓜。他走了那么远，还没找到所罗门王失落的戒指。
        - id: ch01-b12
          speaker: bird_2
          text: 他该去求女巫姑娘帮忙。戒指就算不在她手里，她也准知道是谁拿着。
        - id: ch01-b13
          speaker: bird_1
          text: 可他上哪儿找她？她今天在这里，明天就去了别处。找她就跟追风一样难。
        - id: ch01-b14
          speaker: bird_2
          text: 她现在在哪儿，我也不知道。不过再过三夜就是月圆，她会到附近的泉边洗脸。她每个月都这样做，好永远年轻，不长皱纹。
        - id: ch01-b15
          speaker: bird_1
          text: 泉水离这儿不远。我们去看看她怎么洗吧？
        - id: ch01-b16
          speaker: bird_2
          text: 好啊，你去我就去。
        - id: ch01-b17
          speaker: narrator
          text: 青年立刻决定跟随它们。他有两桩担忧，一怕自己睡着以后错过鸟儿，二怕没有翅膀，双腿怎么也赶不上它们。头一夜，他累得无法一直醒着，心中牵挂又让他睡不安稳。天刚亮，他便抬头看去，见两只鸟还把头埋在翅膀下，这才放下心。他吃过早饭，等着它们动身，可鸟儿整天只在一棵棵树间跳跃觅食，傍晚又回到原处睡觉。第二天仍是这样。
        - id: ch01-b18
          speaker: bird_1
          text: 今天该去泉边，看女巫姑娘洗脸了。
        - id: ch01-b19
          speaker: narrator
          text: 第三天，两只鸟一直等到中午才向南飞去。青年拼命追赶，生怕向导飞出自己的视线。他跑得精疲力竭、喘不过气，中途只歇了三小会儿，终于跟到林中一块小空地。鸟儿落在空地边一棵高树的树顶，中央正有一眼清澈的泉水。青年赶到树下坐好，屏住呼吸，继续听它们说话。
        - id: ch01-b20
          speaker: bird_1
          text: 太阳还没落下。等月亮升起来，姑娘才会到泉边。她会看见树下的青年吗？
        - id: ch01-b21
          speaker: bird_2
          text: 恐怕什么也逃不过她的眼睛，何况是个年轻人。就看他够不够聪明，能不能躲开她的罗网了。
        - id: ch01-b22
          speaker: bird_1
          text: 那我们等着瞧，看他们会有什么结果。
    - id: ch02
      title: 月光下的女巫姑娘
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 暮色完全散尽，满月已经照亮森林。青年听见轻轻的窸窣声。片刻后，一位姑娘从林中出来，轻盈地掠过草地，双脚仿佛几乎没有沾地，一直来到泉水旁边。青年一生中从没见过这样美丽的人，目光落到她身上，便再也无法移开。
        - id: ch02-b02
          speaker: narrator
          text: 姑娘像是没有发现任何人。她走到泉边，先抬头望着满月，随后跪下来，用清凉的泉水洗了九遍脸。她再次仰头望月，又绕着泉眼慢慢走了九圈，一边走，一边唱起歌来。
        - id: ch02-b03
          speaker: witch_maiden
          text: 圆月当空清辉满，愿我容颜永不残。双颊莫教失红润！夜夜月儿虽渐缺，姑娘却要花容艳，青春永驻不凋零！
        - id: ch02-b04
          speaker: narrator
          text: 她用长发擦干脸，正要离开，忽然看见树下的青年，便朝他走来。青年起身等候。
        - id: ch02-b05
          speaker: witch_maiden
          text: 你竟敢偷看我在月光下的秘密，本该受重罚。不过你是外乡人，不懂这里的规矩，这次我饶了你。你得老实告诉我，你是谁，又是怎么来到这个从没有凡人踏足的地方。
        - id: ch02-b06
          speaker: youth
          text: 美丽的姑娘，请原谅我无意冒犯。我漂泊了很久，偶然走到这里，只想在树下睡一夜。你来时，我不知道该怎么办，只好静静留在原地。我没想到这样也会惹你生气。
        - id: ch02-b07
          speaker: witch_maiden
          text: 那就跟我回去过夜吧。枕头总比湿苔藓睡着舒服。
        - id: ch02-b08
          speaker: narrator
          text: 青年有些迟疑，这时树顶的鸟儿又开了口。
        - id: ch02-b09
          speakers: [bird_1, bird_2]
          ensemble: duo
          text: 她叫你去，你就去。只是千万别交出一滴血，否则就是把灵魂卖掉了。
        - id: ch02-b10
          speaker: narrator
          text: 青年跟着姑娘走进一座美丽的花园。园里矗立着一座华美的宅邸，在月下闪着金银的光，仿佛整座房子都由金银造就。里面的房间一间比一间富丽，数百支蜡烛燃在金烛台上，照得像最明亮的白昼。最后，两人来到摆满珍贵菜肴的房间。桌边放着一把金椅和一把银椅。姑娘坐在金椅上，请青年坐银椅。白衣少女无声地来回服侍，整顿饭没有一人说话。
        - id: ch02-b11
          speaker: narrator
          text: 饭后，青年和女巫姑娘愉快地交谈了很久。后来，一个身穿红衣的女人走进来，提醒他们该睡觉了。青年被带进另一间房。那里摆着一张丝绸铺成的床，上面堆满柔软的羽绒垫。他睡得十分香甜，耳边却仿佛一直有人反复低声警告。
        - id: ch02-b12
          speaker: warning_voice
          text: 记住，千万别交出一滴血！
        - id: ch02-b13
          speaker: narrator
          text: 第二天早晨，姑娘问青年愿不愿意永远留下。青年没有马上回答，她便继续说下去。
        - id: ch02-b14
          speaker: witch_maiden
          text: 你看，我永远年轻美丽，也没人管我，想做什么都可以，所以以前从没想过成亲。可我第一眼见到你就喜欢上了你。你若愿意，我们就结为夫妻，像王公贵族那样生活。我的财富多得数不清。
        - id: ch02-b15
          speaker: narrator
          text: 面对这样美丽的姑娘和数不清的财富，青年当然不能不心动。可他也清楚记得，树上的鸟儿把她叫作女巫。那个神秘声音发出的警告，也一遍遍在他耳边回响。他不敢贸然答应，只好把真实的心思藏好，小心地回答她。
        - id: ch02-b16
          speaker: youth
          text: 好姑娘，这件事太重要了。我不能马上决定，请你别生气。给我几天仔细想想，我们再说吧。
        - id: ch02-b17
          speaker: witch_maiden
          text: 当然可以。你愿意的话，想上几个星期也行。只管问问自己的心。
        - id: ch02-b18
          speaker: narrator
          text: 为了让等待的日子过得愉快，姑娘带青年看遍华美宅邸的每一个角落，又把所有珍奇宝物拿给他看。青年不知道，那些东西全是所罗门王的印戒变出来的。姑娘想要什么，戒指就能让什么出现，可没有一样能够长存。它们会像风一样消散，不留半点痕迹。青年却把眼前的一切都当成真的。
        - id: ch02-b19
          speaker: narrator
          text: 青年就这样在宅邸里住了下来。一天，姑娘忽然领他走进一间从没去过的密室。房间中央摆着一张银桌，桌上只有一只小巧的金盒。姑娘停在桌边，指着那个盒子，告诉青年，这里面装着她最大的宝物，整个世界都找不出第二件。
        - id: ch02-b20
          speaker: witch_maiden
          text: 盒里是一枚举世无双的金戒指。等我们成亲，我就把它送给你，让你成为最幸福的人。不过，要让我们的爱情永远不变，你得给我左手小指上的三滴血。
        - id: ch02-b21
          speaker: narrator
          text: 青年打了个寒战。他记得这关系到自己的灵魂，却没有露出恐惧，只装作随口一问，戒指究竟有什么本领。
        - id: ch02-b22
          speaker: witch_maiden
          text: 没人能完全读懂戒上的符号，我只知道一半，也足够施展奇迹了。戴在左手小指上，我能像鸟一样飞去任何地方。戴在无名指上，我会隐身，别人看不见我，我却什么都看得见。戴在中指上，火、水和利器都伤不了我。戴在食指上，我想要什么就能变出什么，连房屋也能转眼造好。戴在拇指上，这只手便能击碎岩石和高墙。
        - id: ch02-b23
          speaker: witch_maiden
          text: 戒上还有更重要的秘密，只是世上没人看得懂。它从前属于列王中最有智慧的所罗门王。至于戒指是不是凡人造的，谁也不知道。人们说，是一位天使把它送给了智慧之王。
    - id: ch03
      title: 戒指易主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 青年听完这番话，决心想办法把戒指拿到手，虽然他还不完全相信那些神奇的本领。他很想请姑娘把戒指交给自己摸一摸，又不大敢开口。过了一会儿，姑娘把它放回金盒。几天后，两人再次谈起这枚魔戒，青年便故意表示怀疑。
        - id: ch03-b02
          speaker: youth
          text: 一枚戒指真能有这么大的力量？我不相信。
        - id: ch03-b03
          speaker: narrator
          text: 姑娘打开金盒，取出戒指。戒指在她手里亮得像一道最清澈的阳光。她把它戴上左手中指，叫青年拿刀全力砍她，因为他绝不可能伤得了她。青年起初不肯，禁不住她再三催促，只好先像玩闹那样轻轻试探，随后当真挥刀。两人之间仿佛隔着一道无形的铁墙，姑娘毫发无损，站在那里笑个不停。
        - id: ch03-b04
          speaker: narrator
          text: 接着，她把戒指换到无名指上，转眼便消失了。没过多久，她又笑着出现在青年身旁，指间捏着戒指。
        - id: ch03-b05
          speaker: youth
          text: 也让我试试吧，看我能不能做到这些事。
        - id: ch03-b06
          speaker: narrator
          text: 姑娘根本没有想到青年会欺骗自己，毫不犹豫地把珍贵的魔戒交到他手里。青年拿着戒指，却故意装出记性不好的样子。他说自己忘了刚才听过的用法，又问了一遍，究竟戴在哪根手指上，刀剑和其他利器才伤不了身体。
        - id: ch03-b07
          speaker: witch_maiden
          text: 哎呀，是左手中指呀。
        - id: ch03-b08
          speaker: narrator
          text: 姑娘拿起刚才的刀，朝青年身上砍去。青年也接过刀，亲手试着割自己的身体，果然像有无形的力量护住他，怎么也割不动。接着，他又装出好奇的样子，请姑娘教自己怎样借助戒指劈开石块和岩石。姑娘没有起疑，立刻带他来到庭院。院子里正立着一块巨大的岩石。
        - id: ch03-b09
          speaker: witch_maiden
          text: 把戒指戴在左手拇指上，你就知道这只手有多大的力气了。
        - id: ch03-b10
          speaker: narrator
          text: 青年照做，只挥一拳，巨石便迸成千百块。他心想，幸运到了眼前还不用，才是真正的傻瓜。这样的机会错过便不会再有。于是两人对着碎石发笑时，他装作玩闹，把戒指套上左手无名指。
        - id: ch03-b11
          speaker: witch_maiden
          text: 现在我看不见你了，除非你把戒指摘下来。
        - id: ch03-b12
          speaker: narrator
          text: 青年却不想摘。他走远几步，把戒指换到左手小指，立刻像鸟儿一样飞上天空。
        - id: ch03-b13
          speaker: witch_maiden
          text: 回来吧，朋友！你已经知道我说的全是真话了。
        - id: ch03-b14
          speaker: narrator
          text: 青年没有回来。姑娘这才明白自己受了骗，痛悔不已，恨自己竟把戒指交给了他。
        - id: ch03-b15
          speaker: narrator
          text: 青年一路飞行，片刻也不曾停歇，直到东方魔法师的住处。老人见他寻找戒指成功，喜出望外，立刻动手解读戒上的神秘符号。可那些铭文实在深奥，他整整花了七个星期，才终于看得清清楚楚。随后，他把降伏北方之龙的办法告诉青年。
        - id: ch03-b16
          speaker: eastern_magician
          text: 铸一匹铁马，四只蹄下都装小轮。再造一支两英寻长的铁矛，矛身中央要像大树那么粗，两头都磨尖。矛的中部系两条十英寻长的铁链。你把戒指戴在左手拇指上，才能挥动它。
        - id: ch03-b17
          speaker: eastern_magician
          text: 把长矛刺穿恶龙的上下颚。它咬住铁矛时，你要立刻跳下铁马，用铁桩把两条链子钉牢，让它挣脱不了。两三天后，等它耗尽力气，你再靠近，用戒指的神力给它最后一击。
        - id: ch03-b18
          speaker: eastern_magician
          text: 靠近以前，戒指要一直戴在无名指上，让怪物看不见你，否则它会用长尾把你打死。事情办完以后也要小心，别弄丢戒指，更不能让别人用诡计骗走。
        - id: ch03-b19
          speaker: youth
          text: 多谢您的指点。要是这办法成功，我一定报答您。
        - id: ch03-b20
          speaker: eastern_magician
          text: 戒指教给我的智慧已经是最大的报酬，我不需要别的东西。
    - id: ch04
      title: 屠龙的英雄
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 青年借助戒指，穿过天空飞回故乡。在家住了几星期后，他听人传说北方之龙已经逼近，很快就会闯过边境。国王公开许诺，谁能从怪物手里拯救全国，就把公主嫁给谁，还会赐给他大片国土。青年进宫禀告，只要国王备齐自己需要的一切，他便很有希望降伏恶龙。国王欣然答应了全部要求。
        - id: ch04-b02
          speaker: narrator
          text: 工匠们照他的吩咐造好铁马、巨矛和铁链，可铁马实在太重，连一百个人合力也推不动。青年没有别的办法，只能借戒指的神力亲自移动它。此时恶龙近在眼前，只消再跳两下便会越过边境。他却忽然犯了难。若从后面推马，自己又怎么骑上去，照魔法师说的那样迎战？就在这时，一只乌鸦意外飞来指点他。
        - id: ch04-b03
          speaker: raven
          text: 骑在马上，用长矛抵住地面向后撑，就像撑船离岸一样。
        - id: ch04-b04
          speaker: narrator
          text: 青年照它说的去做，这一招果然让铁马轻松向前。恶龙已经张开血盆大口，等着猎物送上门。再走几步，人和马就会一同被吞下。青年吓得浑身发抖，血都凉了，却没有失去勇气。他把沉重的铁矛直直举在手中，使尽全身力气，猛地刺穿怪物的下颚，又赶在恶龙闭嘴前快如闪电地跳下马。
        - id: ch04-b05
          speaker: narrator
          text: 一声雷霆般的巨响传到几英里之外，那是恶龙的上下颚紧紧咬住了长矛。青年回头一看，矛尖已经从怪物的上颚高高穿出。他知道另一头必须牢牢固定在地面上，不然恶龙仍会挣脱。可怪物的牙已经深深咬进铁马，那匹沉重的马也彻底报废。青年赶紧抓起早就备好的巨大铁桩，把矛上的两条铁链一端接一端牢牢钉进地里。
        - id: ch04-b06
          speaker: narrator
          text: 怪物垂死挣扎了整整三天三夜。它痛苦地扭动庞大的身体，长尾一次又一次猛烈抽打地面，连十英里外的大地也像遇上地震一样颤抖。等到恶龙终于耗尽力气，尾巴再也不能动弹，青年才走近它。他借戒指的神力举起一块二十个普通人也搬不动的巨石，对准恶龙的脑袋狠狠砸下。没过多久，北方之龙便一动不动地死在他面前。
        - id: ch04-b07
          speaker: narrator
          text: 可怕的怪物死了，消息很快传遍四方，全国一片欢腾。人们用迎接世间最强大君王的盛大礼仪，把屠龙者迎进城里。整支大军都没做到的事，这位英雄独自一人办成了。老国王根本不用催促女儿，公主已经愿意把手交给他。
        - id: ch04-b08
          speaker: narrator
          text: 几天后，一场华美的婚礼开始了。邻国的国王们全都赶来，感谢这位为天下除去共同仇敌的人，欢庆足足持续了四个星期。可所有人只顾共同的喜悦，竟忘记掩埋恶龙庞大的尸体。尸体渐渐散发出可怕的恶臭，附近再也无法住人。不久，整片空气都染上了毒，一场瘟疫随即暴发，夺去了几百人的性命。
        - id: ch04-b09
          speaker: narrator
          text: 危难之际，王子决定再次去找东方魔法师。他用戒指化作飞鸟，飞上天空。可俗话说，不义之财终究不会带来好运。那枚偷来的戒指到底给他招来了灾祸。女巫姑娘一直不分昼夜地寻找戒指，从没停下。她用魔法发现王子正化作飞鸟赶往东方，立刻把自己变成老鹰，在空中等候。
        - id: ch04-b10
          speaker: narrator
          text: 等那只鸟飞进视野，姑娘一眼便认出了他，因为王子把戒指用丝带系着，正挂在颈上。老鹰猛扑过去，利爪刚抓住飞鸟，便从他颈上扯走戒指。鸟身人根本来不及反抗。她带着猎物飞落地面，两人恢复人形，又一次面对面站在一起。
        - id: ch04-b11
          speaker: witch_maiden
          text: 恶棍，现在你落到我手里了！我把爱情给了你，你却用欺骗和偷窃回报我。你偷走我最珍贵的宝物，还想做国王的女婿，幸福过日子吗？如今轮到我掌握你的命运。我要让你为罪行付出代价！
          emotion: angry
        - id: ch04-b12
          speaker: youth
          text: 饶了我吧！求你饶了我！我知道自己伤你有多深，也真的从心底后悔了！
        - id: ch04-b13
          speaker: witch_maiden
          text: 现在哀求和后悔都太迟了。我若饶你，人人都会当我是傻瓜。你先践踏我的爱情，又偷走我的戒指，伤害了我两次。你必须受罚。
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: 姑娘把戒指戴在左手拇指上，单手提起王子，像带一件东西那样把他夹在腋下，大步离开。这一次，她没有领他回那座富丽堂皇的宅邸，而是走进岩石深处一个阴冷的洞穴。洞壁上垂挂着一条条沉重的锁链。她把王子的双手双脚全都牢牢锁住，让他再也无法逃走。
        - id: ch04-b15
          speaker: witch_maiden
          text: 你就锁在这个洞里，一直到死吧。我每天会送来足够的食物，让你不至于活活饿死。可是从今以后，你用不着再怀着希望，因为你永远也别想重新得到自由。
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: 说完，她把王子独自留在洞里，转身离去。
    - id: ch05
      title: 七年囚禁之后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 老国王和公主焦急地等了好几个星期，始终没有王子归来的消息。公主常常梦见丈夫正在遭受巨大的痛苦，心里越来越不安。她便请求父王召集所有术士和魔法师，请他们设法查清王子身在何处，又该怎么把他救出来。
        - id: ch05-b02
          speaker: narrator
          text: 全国的魔法师们使尽各自的法术，却只能看出王子依旧活着，而且正在受尽折磨。至于他究竟被关在哪里，所有人都毫无办法。最后，人们请来一位声名远播的芬兰魔法师，把他带到老国王面前。只有他看出了比别人更多的线索。
        - id: ch05-b03
          speaker: finnish_magician
          text: 国王的女婿被关在东方。囚禁他的不是凡人，而是一个法力更强大的存在。
        - id: ch05-b04
          speaker: narrator
          text: 国王立即派使者前往东方寻找女婿。使者们十分幸运，遇见了那位解读过所罗门王戒指的老魔法师。他从戒指那里得到的智慧胜过世上所有人，很快便查清了想知道的事，也指出了王子被囚禁的地方。
        - id: ch05-b05
          speaker: eastern_magician
          text: 他被魔法困在那里。没有我相助，谁也救不了他。我亲自跟你们去。
        - id: ch05-b06
          speaker: narrator
          text: 东方魔法师和使者们一同出发，由懂得道路的飞鸟在前面引路。几天后，他们终于找到那座深藏在岩石中的洞穴。可怜的王子已经在那里被锁了将近七年。昏暗中，他一眼就认出了东方魔法师，老人却久久认不出眼前的囚徒，因为王子瘦得脱了形，早已完全变了模样。
        - id: ch05-b07
          speaker: narrator
          text: 老魔法师走到王子身边，用法术一条条解开他手脚上的锁链。他没有让这个虚弱的人立刻上路，而是留在洞中悉心照料他，日日守着他，等他一点一点恢复。直到王子恢复健康，重新有了踏上归途的力气，一行人才动身回国。王子终于回到故乡，却得知老国王就在当天早晨去世。于是，他继承王位，成了这个国家的新国王。
        - id: ch05-b08
          speaker: narrator
          text: 王子经历了将近七年的囚禁，漫长的苦难终于结束。登上王位以后，好日子重新来到，而且一直伴随他走完一生。只是那枚曾帮他屠龙、又给他招来灾祸的魔戒，再也没有回到他的手中。从女巫姑娘夺回它的那一天起，它也再不曾被任何凡人的眼睛看见。
        - id: ch05-b09
          speaker: narrator
          text: 现在，假如你就是那位王子，难道不会宁愿留在美丽的女巫姑娘身边吗？
