  chapters:
    - id: ch01
      title: The Monster from the North
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, or so the old people tell us, a terrible monster came out of the North. It ruined whole stretches of country and devoured both people and animals. Its destruction was so great that everyone feared it would leave no living creature on the earth.
        - id: ch01-b02
          speaker: narrator
          text: The Dragon had the body of an ox and the legs of a frog, with two short legs in front and two long ones behind. A serpent's tail, ten fathoms long, trailed after it. It moved by leaping like a frog, and every leap carried it half a mile. Luckily, it stayed in one place for years and moved on only after it had eaten everything nearby.
        - id: ch01-b03
          speaker: narrator
          text: No hunter could harm it. Scales harder than stone or metal covered its whole body. Its two huge eyes shone like the brightest lamps, by night and even by day. Anyone unlucky enough to look into them fell under a spell and ran straight into the monster's jaws. So the Dragon could lie still while people and beasts came to it.
        - id: ch01-b04
          speaker: narrator
          text: All the neighboring kings promised rich rewards to whoever could destroy the monster, whether by strength or by magic. Many people decided to try their luck. Every one of them failed miserably. At last, people set fire to the great forest where the Dragon lay, hoping the flames would do what weapons could not. The whole forest burned to the ground. When the fire was over, the monster had not suffered the slightest harm.
        - id: ch01-b05
          speaker: narrator
          text: The country's wise men did know of one hope, preserved in an old tradition. They said that a person who possessed King Solomon's signet ring could overcome the Dragon. Secret writing was engraved upon the ring. Anyone wise enough to understand that writing could discover exactly how the monster must be killed. Yet no one knew where the ring was hidden. Even if it were found, there was no sorcerer or learned man who could explain the inscription.
        - id: ch01-b06
          speaker: narrator
          text: At last, a brave and kindhearted young man set out to find the ring. He traveled toward the sunrise, because he knew that the wisdom of ancient times came from the East. After years of searching, he met a famous Eastern magician and asked for help.
        - id: ch01-b07
          speaker: eastern_magician
          text: Human beings have very little wisdom, so they cannot guide you. The birds of the air would guide you better, if only you understood their language. Stay with me for a few days, and I can teach you to understand them.
        - id: ch01-b08
          speaker: narrator
          text: The young man accepted with thanks.
        - id: ch01-b09
          speaker: youth
          text: I have no way to reward your kindness now. But if my search succeeds, I will repay you richly for your trouble.
        - id: ch01-b10
          speaker: narrator
          text: The magician gathered nine kinds of herbs, alone and by moonlight, and brewed them into a powerful potion. For three days, he gave the young man nine spoonfuls each day. After that, the young man understood the language of birds.
        - id: ch01-b11
          speaker: eastern_magician
          text: If you find Solomon's ring and make it yours, come back to me. I can explain the writing engraved on it, and no one else in the world can do that.
        - id: ch01-b12
          speaker: narrator
          text: From then on, the young man never felt lonely as he walked. Wherever he went, birds were speaking around him, so he always had company. By listening to them, he learned many things that ordinary human knowledge could never have taught him. Yet the days and months passed, and among all the birds' talk he heard nothing about the ring he was seeking.
    - id: ch02
      title: The Birds at the Spring
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One evening, he was hot and weary from walking. He sat beneath a forest tree to eat his supper and noticed two unfamiliar birds with brilliant feathers in its highest branches. They were talking about him.
        - id: ch02-b02
          speaker: first_bird
          text: I know that wandering fool down there. He has come all this way and still has not found what he wants. He is searching for King Solomon's lost ring.
        - id: ch02-b03
          speaker: second_bird
          text: Then he needs the Witch-maiden's help. She can surely point him the right way. If she does not have the ring herself, she certainly knows who does.
        - id: ch02-b04
          speaker: first_bird
          text: But how could he ever find her? She never stays in one place. She is here today and gone tomorrow. He might as well try to catch the wind.
        - id: ch02-b05
          speaker: second_bird
          text: I cannot say where she is now. But three nights from tonight, she will come to the spring and wash her face. She goes there every month when the moon is full, so she will never grow old or wrinkled and will always keep the bloom of youth.
        - id: ch02-b06
          speaker: first_bird
          text: The spring is close by. Shall we go and watch how she does it?
        - id: ch02-b07
          speaker: second_bird
          text: Gladly, if you want to.
        - id: ch02-b08
          speaker: narrator
          text: The young man decided at once that he would follow the birds to the spring. But two things made him uneasy. They might leave while he was asleep, or they might fly too swiftly for him to keep them in sight, since he had no wings of his own. He was far too weary to stay awake all night. Even so, his worry would not let him sleep soundly. At the first light of dawn, he looked into the treetop and was relieved to find both bright-feathered companions still there, asleep with their heads tucked beneath their wings.
        - id: ch02-b09
          speaker: narrator
          text: He ate his breakfast and waited for the birds to begin their journey. But they did not leave that day. From morning until evening, they only hopped from one tree to another in search of food. When darkness came, they returned to their old perch and went to sleep. The young man waited through a second night, and the whole of the next day passed in exactly the same way.
        - id: ch02-b10
          speaker: first_bird
          text: Today we must fly to the spring and see the Witch-maiden wash her face.
        - id: ch02-b11
          speaker: narrator
          text: Even then, the birds remained in the tree until noon. At last, they spread their wings and flew south. The young man's heart pounded with fear that he would lose his guides, but he managed to keep them in sight. Each time they settled on a tree, he ran after them until he caught up, exhausted and out of breath. After three short rests, the birds reached a small clearing in the forest and perched at the top of a tall tree on its edge. A clear spring lay in the middle. When the young man finally overtook them, he sat beneath their tree and listened closely.
        - id: ch02-b12
          speaker: first_bird
          text: The sun has not set. We must wait until the moon rises and the maiden comes. Do you think she will notice that young man under the tree?
        - id: ch02-b13
          speaker: second_bird
          text: Very little escapes her eyes, and she will certainly notice a young man. But will he have enough sense to stay out of her snares?
        - id: ch02-b14
          speaker: first_bird
          text: Let us wait and see what happens between them.
        - id: ch02-b15
          speaker: narrator
          text: The last evening light faded completely, and the full moon rose over the forest. Then the young man heard a soft rustle among the trees. A few moments later, a maiden came out of the forest. She glided across the grass so lightly that her feet barely seemed to touch the ground, then stopped beside the spring. The young man could not turn his eyes away from her. In all his life, he had never seen a woman so beautiful.
        - id: ch02-b16
          speaker: narrator
          text: The maiden appeared to notice nothing. She looked up at the full moon, knelt, and bathed her face nine times. She looked at the moon once more, then walked nine times around the spring, singing as she went.
        - id: ch02-b17
          speaker: witch_maiden
          text: Full-faced moon whose light is bright, never let my beauty fade. Never let my cheek grow pale. As the moon grows less each night, let the maiden bloom more brightly. Let her freshness never fail.
        - id: ch02-b18
          speaker: narrator
          text: She dried her face with her long hair and turned to leave. Then she suddenly saw the young man and came toward his tree. He rose and waited for her.
        - id: ch02-b19
          speaker: witch_maiden
          text: You deserve a heavy punishment for spying on my secret moonlit rites. I will forgive you this once because you are a stranger and did not know better. But you must tell me the truth. Who are you, and how did you reach a place where no mortal has ever walked?
        - id: ch02-b20
          speaker: youth
          text: Please forgive me, beautiful maiden. I did not mean to offend you. After wandering a long way, I happened upon this tree and thought it a good place to sleep. When you arrived, I did not know what to do. I stayed silent and still because I did not think watching quietly would trouble you.
        - id: ch02-b21
          speaker: witch_maiden
          text: Come home with me for the night. A pillow will give you better sleep than damp moss.
        - id: ch02-b22
          speaker: narrator
          text: The young man hesitated. Then he heard the birds overhead.
        - id: ch02-b23
          speakers: [first_bird, second_bird]
          ensemble: duo
          text: Go with her, but do not give her any blood, or you will sell your soul.
    - id: ch03
      title: The Witch-maiden's Treasure
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Trusting the birds' advice, the young man followed the maiden. Soon they entered a beautiful garden. In its midst stood a magnificent house, glittering under the moon as if every wall were made of gold and silver. Once inside, he passed through one splendid chamber after another, and every room seemed finer than the last. Hundreds of candles burned in golden holders. Their light filled the house so brightly that it seemed like the middle of day.
        - id: ch03-b02
          speaker: narrator
          text: At last they came to a chamber where a table was spread with the costliest dishes. Two chairs had been placed beside it, one made of gold and the other of silver. The Witch-maiden seated herself on the golden chair and offered the silver one to her guest. Maidens dressed entirely in white served the meal. Their feet made no sound as they moved around the room, and not one word was spoken while the two ate.
        - id: ch03-b03
          speaker: narrator
          text: When the silent meal was finished, the young man and the Witch-maiden sat together and talked pleasantly for a long time. At last, a woman dressed in red entered and reminded them that it was time to sleep. The young man was shown to another chamber. There he found a silken bed piled with soft cushions of down. He slept more delightfully than he had in years, yet through his sleep he seemed to hear a voice close beside the bed, repeating the same warning.
        - id: ch03-b04
          speakers: [first_bird, second_bird]
          ensemble: duo
          text: Remember. Do not give her any blood.
        - id: ch03-b05
          speaker: narrator
          text: The next morning, the maiden asked whether he would like to stay with her forever. When he did not answer at once, she went on.
        - id: ch03-b06
          speaker: witch_maiden
          text: You see that I am always young and beautiful. No one gives me orders, and I can do whatever I please. I never wanted to marry before, but I liked you from the moment I saw you. If you agree, we can marry and live like a prince and princess. I have riches enough for both of us.
        - id: ch03-b07
          speaker: narrator
          text: Her offer tempted him. Still, he remembered that the birds had called her a witch, and their warning rang in his ears. He chose his answer carefully.
        - id: ch03-b08
          speaker: youth
          text: Please do not be angry, dear maiden, but I cannot decide such an important matter at once. Give me a few days to think before we settle anything.
        - id: ch03-b09
          speaker: witch_maiden
          text: Of course. Take several weeks if you wish, and listen to what your own heart tells you.
        - id: ch03-b10
          speaker: narrator
          text: To make his time with her pleasant, she led him through every part of her beautiful dwelling and showed him one splendid treasure after another. The young man believed that all this wealth was solid and real. He did not know that the Witch-maiden had produced every bit of it by enchantment with King Solomon's signet ring. Nothing she showed him was fixed or lasting. Like the wind, it could pass away without leaving a trace behind.
        - id: ch03-b11
          speaker: narrator
          text: One day, she led him into a secret room. A small gold box stood on a silver table, and she pointed to it.
        - id: ch03-b12
          speaker: witch_maiden
          text: This is my greatest treasure, and nothing else in the world is like it. Inside is a precious gold ring. When we marry, I will give it to you as a wedding gift, and it will make you the happiest man alive. But if our love is to last forever, you must give me three drops of blood from the little finger of your left hand.
        - id: ch03-b13
          speaker: narrator
          text: A cold shudder went through him. Now he knew his soul was at stake. He hid his fear and gave her no answer. Instead, as carelessly as he could, he asked what made the ring so remarkable.
        - id: ch03-b14
          speaker: witch_maiden
          text: No mortal understands all its power because no one can fully read the secret signs upon it. Even with the little I know, I can do wonders. On the little finger of my left hand, it lets me fly anywhere like a bird. On the third finger, it makes me invisible. I can see everything around me, but no one can see me.
        - id: ch03-b15
          speaker: witch_maiden
          text: On the middle finger of my left hand, it keeps fire, water, and every sharp weapon from harming me. On my forefinger, it creates whatever I desire. In a moment, I can raise a house or make anything else I wish for. And on my left thumb, it gives that hand enough strength to break rocks and walls.
        - id: ch03-b16
          speaker: witch_maiden
          text: There are other signs whose secrets no one knows, and they must hide things of great importance. The ring once belonged to King Solomon, the wisest king, who lived in the age of the wisest men. No one knows whether mortal hands made it. People say an angel gave it to him.
        - id: ch03-b17
          speaker: narrator
          text: As he listened, the young man resolved to gain possession of the ring, although he did not fully believe all the wonders she claimed for it. More than anything, he wanted her to let him hold it and test its power for himself. But he feared that a direct request would make her suspicious, so he said nothing. After a while, the Witch-maiden placed the ring back in the little gold box and closed it away.
    - id: ch04
      title: The Stolen Ring
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: A few days later, they spoke of the ring again. This time, the young man challenged her.
        - id: ch04-b02
          speaker: youth
          text: I cannot believe that one little ring truly has all the powers you claim.
        - id: ch04-b03
          speaker: narrator
          text: The maiden opened the little gold box and took out the ring. As she held it up between her fingers, it glittered like the clearest ray of sunlight. Then, to prove the first of her claims, she slipped it onto the middle finger of her left hand.
        - id: ch04-b04
          speaker: witch_maiden
          text: Take that knife and try your hardest to cut me. You will find that you cannot hurt me.
        - id: ch04-b05
          speaker: narrator
          text: The young man did not want to strike her, but she would not let the matter drop. At first, he made only a playful attempt with the knife. Then he struck in earnest and used all his strength. Each time, it felt as though an unseen wall of iron stood between them. The blade could not reach her, and the maiden remained before him, laughing and completely unharmed. Next, she moved the ring to the third finger of her left hand and vanished from his sight. A moment later, she stood beside him again, laughing as she held the ring between her fingers.
        - id: ch04-b06
          speaker: youth
          text: Please let me try. I want to see whether I can do those wonders too.
        - id: ch04-b07
          speaker: narrator
          text: The Witch-maiden suspected no trick and handed him the ring. He pretended he had forgotten her instructions.
        - id: ch04-b08
          speaker: youth
          text: Which finger keeps a sharp weapon from hurting me?
        - id: ch04-b09
          speaker: witch_maiden
          text: The middle finger of your left hand.
        - id: ch04-b10
          speaker: narrator
          text: She laughed as she answered. Then she took the knife and struck at him. He even tried to cut himself, but no blade could touch him.
        - id: ch04-b11
          speaker: youth
          text: Now show me how the ring can split stones and rocks.
        - id: ch04-b12
          speaker: narrator
          text: She led him into a courtyard where a huge boulder stood.
        - id: ch04-b13
          speaker: witch_maiden
          text: Put the ring on your left thumb. Then you will see how strong your hand has become.
        - id: ch04-b14
          speaker: narrator
          text: He put the ring on his left thumb as she had told him. To his astonishment, one blow from his fist shattered the great boulder into a thousand pieces. Then a thought came to him. Anyone who failed to use good luck while he had it was a fool, and if this chance slipped away, it might never return. The Witch-maiden was still laughing with him over the broken stone. As if continuing their game, he casually moved the ring from his thumb to the third finger of his left hand.
        - id: ch04-b15
          speaker: witch_maiden
          text: Now you are invisible to me, and you will stay invisible until you take the ring off.
        - id: ch04-b16
          speaker: narrator
          text: He had no intention of taking it off. He moved farther away, slipped it onto his left little finger, and rose through the air like a bird.
        - id: ch04-b17
          speaker: witch_maiden
          text: Come back, my friend! Now you can see that everything I told you was true.
        - id: ch04-b18
          speaker: narrator
          text: At first, the Witch-maiden thought he was still playing with the ring. She called after him and waited for him to turn back. But the young man flew farther and farther away and never returned. Then she understood that he had deceived her. Too late, she bitterly regretted trusting him and placing her greatest treasure in his hands.
    - id: ch05
      title: The Dragon's Defeat
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The young man flew without stopping until he reached the Eastern magician who had taught him the speech of birds. The old man was delighted that the search had succeeded. He began studying the secret signs on the ring at once, but it took seven weeks to understand them clearly. Then he told the young man how to defeat the Dragon of the North.
        - id: ch05-b02
          speaker: eastern_magician
          text: First, have an iron horse cast with small wheels beneath each foot. You must carry a spear two fathoms long. The ring on your left thumb will give you strength enough to wield it. Make the spear as thick in the middle as a great tree, with both ends sharp. Fasten two strong chains to its center, each ten fathoms long.
        - id: ch05-b03
          speaker: eastern_magician
          text: Drive the spear through the Dragon's jaws. As soon as he is caught upon it, leap quickly from the iron horse. Use iron stakes to fix both chains firmly in the ground so he cannot escape. After two or three days, his strength will fail. Then put Solomon's ring on your left thumb and strike the final blow.
        - id: ch05-b04
          speaker: eastern_magician
          text: Until you are close enough, keep the ring on your third finger so the monster cannot see you. Otherwise, one blow from his long tail could kill you. When it is over, guard the ring well. Do not lose it, and do not let anyone trick it away from you.
        - id: ch05-b05
          speaker: narrator
          text: The young man thanked him and promised a reward if the plan succeeded.
        - id: ch05-b06
          speaker: eastern_magician
          text: The ring has already taught me so much wisdom that I want no other reward.
        - id: ch05-b07
          speaker: narrator
          text: They parted, and the young man flew swiftly home. After he had been there several weeks, word came that the terrible Dragon was close and would soon enter the country. The King proclaimed that whoever freed the land from the monster would marry his daughter and receive a great part of the kingdom.
        - id: ch05-b08
          speaker: narrator
          text: The young man went before the King and said he had good hope of overcoming the Dragon, if everything he needed was supplied. The King agreed. Craftsmen made the iron horse, the enormous spear, and the chains exactly as he asked.
        - id: ch05-b09
          speaker: narrator
          text: When every part was ready, they discovered that the iron horse was so heavy that even a hundred men together could not move it from the spot. There was no choice. The young man would have to use the ring's power and move it by his own strength. By then, the Dragon had drawn so near that two of its enormous leaps would carry it across the frontier. The young man stopped to consider what he should do. The magician had said he must ride the horse, but if he stood behind it to push, he could not ride upon it at the same time. Just then, a raven unexpectedly called down some advice.
        - id: ch05-b10
          speaker: raven
          text: Sit on the horse. Brace the spear against the ground and push yourself forward, the way a boatman pushes away from shore.
        - id: ch05-b11
          speaker: narrator
          text: The young man followed the raven's advice, and the iron horse rolled forward easily. The Dragon waited with its monstrous mouth stretched wide for its prey. In only a few more steps, both rider and horse would be swallowed.
        - id: ch05-b12
          speaker: narrator
          text: The sight filled the young man with horror. He trembled, and his blood ran cold, but he did not lose his courage. Gripping the massive iron spear, he held it upright in his hand. At the last possible moment, he brought it down with all the strength the ring had given him and drove it straight through the monster's lower jaw. Then, before the Dragon had time to snap its mouth shut around him, he sprang from the iron horse as fast as lightning.
        - id: ch05-b13
          speaker: narrator
          text: Behind him came a fearful crash like thunder. The Dragon's jaws had closed upon the spear, and the sound could be heard for miles around. When the young man dared to turn, he saw the upper point of the spear standing high above the Dragon's upper jaw. He knew the other sharp end had driven itself firmly into the ground. But the monster's teeth had also closed upon the iron horse. They held it fast and had made it useless.
        - id: ch05-b14
          speaker: narrator
          text: The young man hurried to drive his enormous iron stakes into the ground and fastened both chains. For three days and three nights, the monster fought against death. Its tail struck the earth so violently that the ground shook ten miles away as though an earthquake had come.
        - id: ch05-b15
          speaker: narrator
          text: At last, the tail stopped moving. With the ring's strength, the young man lifted a stone that twenty ordinary men could not have moved. He brought it down again and again upon the Dragon's head. Soon the terrible monster lay dead before him.
        - id: ch05-b16
          speaker: narrator
          text: When the news spread, joy swept through the country. The people received the conqueror in the city with the honors of the mightiest king. The old King did not have to persuade his daughter to marry the Dragon's slayer. She was already willing to give her hand to the hero who had done alone what whole armies had attempted in vain.
        - id: ch05-b17
          speaker: narrator
          text: A magnificent wedding followed within days, and the celebration lasted four full weeks. Kings from every neighboring land came to thank the man who had freed the world from their common enemy.
    - id: ch06
      title: The Witch-maiden's Revenge
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: In all that rejoicing, everyone forgot one necessary thing. No one buried the Dragon's vast body. As it lay there, it began to give off such a dreadful smell that no one could live anywhere near it. Before long, the foulness poisoned the air itself. A pestilence spread through the country, and many hundreds of people died.
        - id: ch06-b02
          speaker: narrator
          text: In this new distress, the King's son-in-law decided that he must ask the Eastern magician for help once more. He used the ring to take the shape of a bird and set off through the air toward the East. Yet there is an old saying that gains acquired by wrongdoing never prosper. The precious ring had been stolen, and in the end it brought the Prince misfortune.
        - id: ch06-b03
          speaker: narrator
          text: The Witch-maiden had searched without rest, by day and night, until her magic showed her where the ring had gone. She learned that the Prince, in the shape of a bird, was flying toward the Eastern magician. So she changed herself into an eagle and waited in the sky.
        - id: ch06-b04
          speaker: narrator
          text: When the bird appeared, she knew him by the ring hanging from a ribbon around his neck. The eagle swooped upon him. The instant her talons seized him, she tore away the ring before he could stop her. She carried her prey to the ground, and there they stood face to face again in their human forms.
        - id: ch06-b05
          speaker: witch_maiden
          text: Now you are in my power, villain! I offered you my love, and you answered with lies and theft. You stole my most precious jewel. Did you truly expect to live happily as the King's son-in-law? The tables have turned. I hold the power now, and I will punish you for what you did.
          emotion: angry
        - id: ch06-b06
          speaker: youth
          text: Forgive me, please forgive me! I know how deeply I wronged you, and I repent it with all my heart.
        - id: ch06-b07
          speaker: witch_maiden
          text: Your prayers and regret have come too late. If I spared you now, everyone would call me a fool. You wronged me twice. First you rejected my love, and then you stole my ring. You must accept the punishment.
          emotion: angry
        - id: ch06-b08
          speaker: narrator
          text: She placed the ring on her left thumb, lifted the young man with one hand, and carried him away beneath her arm. This time, she took him not to a glittering palace but to a deep cave in the rock. Chains hung from its wall.
        - id: ch06-b09
          speaker: narrator
          text: She bound his hands and feet so he could not escape. Then she spoke in anger.
        - id: ch06-b10
          speaker: witch_maiden
          text: You will stay chained here until you die. Each day, I will bring just enough food to keep you from starving. But never hope to be free again.
          emotion: angry
        - id: ch06-b11
          speaker: narrator
          text: With that, she left him alone in the cave.
    - id: ch07
      title: Seven Years in Chains
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Back home, the old King and his daughter waited anxiously for the Prince to return. Many weeks passed, but no message or rumor of him reached them. Again and again, the King's daughter dreamed that her husband was enduring some terrible suffering. At last, she begged her father to summon every enchanter and magician he could find. Perhaps one of them could discover where the Prince had been taken and how he might be set free.
        - id: ch07-b02
          speaker: narrator
          text: The magicians used all their arts, but they learned only two things. The Prince was still alive, and he was enduring great suffering. Not one of them could say where to find him. At last, a celebrated magician was brought from Finland to stand before the King. He discovered that the King's son-in-law was imprisoned somewhere far away in the East. His captor was not human, but a being with far greater power.
        - id: ch07-b03
          speaker: narrator
          text: The King sent messengers east to search for his son-in-law. By good fortune, they met the old magician who had read the signs on Solomon's ring and had gained more wisdom from them than anyone else in the world. He soon discovered where the Prince was imprisoned.
        - id: ch07-b04
          speaker: eastern_magician
          text: Enchantment holds him there, and you cannot free him without my help. I will travel with you.
        - id: ch07-b05
          speaker: narrator
          text: Guided by birds, they journeyed for several days and reached the cave. The unfortunate Prince had been chained there for almost seven years. He recognized the magician at once, but he had grown so thin that the old man did not recognize him.
        - id: ch07-b06
          speaker: narrator
          text: The magician broke the chains with magic. He cared for the Prince until his strength returned and he could travel. When the Prince finally reached home, he learned that the old King had died that very morning. The Prince was raised to the throne in his place.
        - id: ch07-b07
          speaker: narrator
          text: After his long suffering, prosperity came to him and remained until the end of his life. But he never recovered the magic ring, and no mortal eyes have ever seen it again.
        - id: ch07-b08
          speaker: narrator
          text: Now, if you had been the Prince, would you not rather have stayed with the beautiful Witch-maiden?
