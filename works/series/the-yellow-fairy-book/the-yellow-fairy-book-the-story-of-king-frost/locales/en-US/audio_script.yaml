audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, clear, and quietly cautionary
        timbre: gentle and resonant
        pace: measured
        pitch: medium
    stepmother:
      display_name: The Stepmother
      tts:
        delivery: sharp, domineering, and impatient
        timbre: harsh and cutting
        pace: brisk
        pitch: medium
    stepdaughter:
      display_name: The Stepdaughter
      tts:
        delivery: gentle, courteous, and quietly brave
        timbre: soft and clear
        pace: measured
        pitch: medium-high
    king_frost:
      display_name: King Frost
      tts:
        delivery: crisp, commanding, and wintry
        timbre: dry and crackling
        pace: deliberate
        pitch: low
    dog:
      display_name: The Little Dog
      tts:
        delivery: rhythmic, lively, and certain
        timbre: bright and wiry
        pace: brisk
        pitch: high
    daughter:
      display_name: The Stepmother's Daughter
      tts:
        delivery: rude, spoiled, and quick-tempered
        timbre: hard and youthful
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Left in the Frost
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a peasant woman who had a daughter of her own and a stepdaughter. Her own girl always got her way. Whatever she did, her mother declared it right. But the stepdaughter had a hard life. No matter how much trouble she took or how well she did her work, she was blamed and never thanked. Nothing she did could please the woman.
        - id: ch01-b02
          speaker: narrator
          text: In truth, the poor girl was worth her weight in gold. She was kind-hearted and thought of others before herself. Still, her stepmother could not bear her. The girl spent her days in tears, for there was no living peacefully with such a woman. At last, the stepmother decided to be rid of her, one way or another.
        - id: ch01-b03
          speaker: stepmother
          text: Send that girl away, old man. Take her anywhere, as long as I never have to see her face or hear her voice again. Leave her out in the fields, and let the biting frost finish her.
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: The poor old father wept and begged his wife to show mercy, but she would not change her mind, and he was too afraid to oppose her. So he put his daughter into a sledge. He did not even dare give her a horse blanket to keep out the cold.
        - id: ch01-b05
          speaker: narrator
          text: He drove her far out across the bare, open fields. There he kissed her goodbye and left her alone. Then he hurried home as fast as he could, because he could not bear to see her miserable death.
    - id: ch02
      title: King Frost's Three Questions
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The deserted girl sat beneath a fir tree at the edge of the forest and wept without a sound. All at once, she heard a faint noise. King Frost was leaping from tree to tree, cracking his fingers as he came. At last he reached her fir tree. He landed beside her with a sharp, crisp crackle and looked into her lovely face.
        - id: ch02-b02
          speaker: king_frost
          text: Well, maiden, do you know me? I am King Frost, king of the red noses.
        - id: ch02-b03
          speaker: stepdaughter
          text: Greetings, great King. Have you come to take me away?
        - id: ch02-b04
          speaker: king_frost
          text: Are you warm, maiden?
        - id: ch02-b05
          speaker: narrator
          text: The girl was shivering, but her answer came gently.
        - id: ch02-b06
          speaker: stepdaughter
          text: Yes, King Frost. I am quite warm.
        - id: ch02-b07
          speaker: narrator
          text: King Frost bent low over her. The crackling grew louder, and the air felt full of knives and darts. Then he questioned her again.
        - id: ch02-b08
          speaker: king_frost
          text: Are you warm, maiden? Are you warm, beautiful girl?
        - id: ch02-b09
          speaker: narrator
          text: Her breath was nearly freezing on her lips, yet she still spoke softly.
        - id: ch02-b10
          speaker: stepdaughter
          text: I am quite warm, King Frost.
        - id: ch02-b11
          speaker: narrator
          text: King Frost ground his teeth and cracked his fingers. His eyes flashed, and now the crisp crackling rang louder than ever. For the third and final time, he asked her the question.
        - id: ch02-b12
          speaker: king_frost
          text: Maiden, are you still warm? Are you still warm, little love?
        - id: ch02-b13
          speaker: narrator
          text: The poor girl had grown so stiff and numb that she could barely force out an answer.
        - id: ch02-b14
          speaker: stepdaughter
          text: Still warm, O King!
        - id: ch02-b15
          speaker: narrator
          text: Her gentle manners, her courteous answers, and the way she bore her suffering without complaint touched King Frost. He felt pity for her. He wrapped her in warm furs and covered her with blankets. Then he brought out a great chest filled with lovely jewels and a rich robe embroidered in gold and silver.
        - id: ch02-b16
          speaker: narrator
          text: The girl put on the robe and looked lovelier than ever. King Frost helped her into his sledge, and six white horses carried them away.
    - id: ch03
      title: The Little Dog's Prophecy
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Meanwhile, the wicked stepmother waited at home for word that the girl was dead. She was already making pancakes for the funeral feast.
        - id: ch03-b02
          speaker: stepmother
          text: Old man, go back to the fields. Find your daughter's body and bury her.
        - id: ch03-b03
          speaker: narrator
          text: Just as the old man was about to leave, the little dog beneath the table began to bark.
        - id: ch03-b04
          speaker: dog
          text: Your daughter shall live and bring you delight. Her daughter shall die before the end of this night.
        - id: ch03-b05
          speaker: stepmother
          text: Be quiet, you foolish beast! Here is a pancake, but now you must say, “Her daughter shall have much silver and gold. His daughter is frozen quite stiff and cold.”
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: The little dog ate the pancake. Then it barked once more.
        - id: ch03-b07
          speaker: dog
          text: His daughter shall wear a crown on her head. Her daughter shall die without ever being wed.
        - id: ch03-b08
          speaker: narrator
          text: The old woman offered the dog more pancakes and tried to frighten it with blows. Nothing worked. It went on barking the same words. Then, without warning, the door creaked and flew open. A great heavy chest was pushed into the room. Behind it came the stepdaughter, radiant and beautiful in a gown that glittered with silver and gold.
        - id: ch03-b09
          speaker: narrator
          text: For a moment, the shining sight dazzled the stepmother. Then she called out to her husband.
        - id: ch03-b10
          speaker: stepmother
          text: Old man, harness the horses to the sledge at once. Take my daughter to that same field and leave her on the very same spot.
        - id: ch03-b11
          speaker: narrator
          text: So the old man took the woman's daughter into the fields. He left her beneath the very tree where he had said goodbye to his own child. Only a few minutes passed before King Frost came by and looked at her.
        - id: ch03-b12
          speaker: king_frost
          text: Are you warm, maiden?
        - id: ch03-b13
          speaker: daughter
          text: What a blind old fool you are to ask me that! Can't you see my hands and feet are almost frozen?
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: King Frost sprang back and forth before her and kept asking his question. Each time, she answered with rude, harsh words. At last, he became very angry. He cracked his fingers, ground his teeth, and froze her to death.
    - id: ch04
      title: The Final Return
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Back in the hut, the mother waited for her daughter to return. As time passed, she grew impatient.
        - id: ch04-b02
          speaker: stepmother
          text: Get the horses out, old man, and bring her home. Be careful not to overturn the sledge and lose the chest.
        - id: ch04-b03
          speaker: narrator
          text: But the little dog under the table began to bark again.
        - id: ch04-b04
          speaker: dog
          text: Your daughter is frozen quite stiff and cold. She never shall have a great chest full of gold.
        - id: ch04-b05
          speaker: stepmother
          text: Stop telling such wicked lies! Here is a cake. Now say, “Her daughter shall marry a mighty king.”
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: At that very moment, the door flew open. The woman rushed outside to welcome her daughter. But when she took the frozen body in her arms, the cold struck her too, and she died.
