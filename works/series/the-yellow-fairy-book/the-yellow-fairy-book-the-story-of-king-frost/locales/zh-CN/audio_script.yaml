audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的神秘与克制, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    stepmother:
      display_name: 继母
      tts: {delivery: 刻薄专横，贪心时急切强硬, timbre: 尖利粗涩, pace: 稍快, pitch: 中高音}
    father:
      display_name: 父亲
      tts: {delivery: 软弱忧伤，说话迟疑而低沉, timbre: 苍老厚重, pace: 缓慢, pitch: 低音}
    stepdaughter:
      display_name: 继女
      tts: {delivery: 温柔谦和，苦难中仍克制有礼, timbre: 清澈柔和, pace: 稍缓, pitch: 中高音}
    king_frost:
      display_name: 霜王
      tts: {delivery: 威严锐利，声音里带着寒风般的逼迫感, timbre: 清脆冷峻, pace: 稳健, pitch: 中低音}
    dog:
      display_name: 小狗
      tts: {delivery: 机灵笃定，预言念得响亮而有节奏, timbre: 明亮清脆, pace: 稍快, pitch: 高音}
    daughter:
      display_name: 亲生女儿
      tts: {delivery: 骄横急躁，受不得半点委屈, timbre: 年轻尖亮, pace: 快, pitch: 高音}
  chapters:
    - id: ch01
      title: 被遗弃在严寒中
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个农妇，家里有一个亲生女儿，还有一个继女。亲生女儿想怎样就怎样，不论做什么，母亲都觉得她没错。继女的日子可就苦了。她再怎么尽心也要挨骂，出了多少力也听不到一句好话。她做什么都不对，样样都是错。其实，这姑娘无私又善良，比金子还珍贵。可继母就是容不下她，叫她天天流泪。在这个女人身边，谁也过不了安生日子。她一心要赶走姑娘，不管用什么手段都在所不惜，总逼着丈夫把人送走。
        - id: ch01-b02
          speaker: stepmother
          text: 老头子，把她弄走！扔到哪里都行，别再让她那张脸碍我的眼，也别叫她的声音来烦我。把她送到野地里，让严霜来收拾她！
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: 可怜的父亲哭着求她发发慈悲，可这个女人拿定了主意，他不敢反抗。他把女儿放上雪橇，甚至连一条挡寒的马毯也不敢给她，就把她拉到光秃秃的空旷原野。他亲了亲女儿，留下她一个人，又飞快地赶回家。他实在不忍心亲眼看着女儿悲惨地死去。
        - id: ch01-b04
          speaker: narrator
          text: 姑娘坐在森林边的一棵枞树下，默默掉泪。忽然，远处传来轻微的响声。霜王正从一棵树跃向另一棵树，一路捏着指节，咔咔作响。他跳到枞树前，带着一串清脆的噼啪声落在姑娘身边，仔细看着她秀美的脸。
        - id: ch01-b05
          speaker: king_frost
          text: 喂，姑娘，你知道我是谁吗？我是霜王，是红鼻子之王。
        - id: ch01-b06
          speaker: stepdaughter
          text: 向伟大的王致敬！您是来带我走的吗？
        - id: ch01-b07
          speaker: king_frost
          text: 姑娘，你觉得暖和吗？
        - id: ch01-b08
          speaker: narrator
          text: 姑娘浑身发抖，声音也在颤。
        - id: ch01-b09
          speaker: stepdaughter
          text: 很暖和，霜王。
    - id: ch02
      title: 霜王的考验与馈赠
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 霜王俯下身，凑得更近了。噼啪声越来越响，四周的空气仿佛塞满了刀子和利箭。
        - id: ch02-b02
          speaker: king_frost
          text: 姑娘，你暖和吗？美丽的姑娘，你还暖和吗？
        - id: ch02-b03
          speaker: narrator
          text: 她呼出的气几乎刚到嘴边就冻住了，可她依然温柔地低声回答。
        - id: ch02-b04
          speaker: stepdaughter
          text: 很暖和，霜王。
        - id: ch02-b05
          speaker: narrator
          text: 霜王咬着牙，又把指节捏得咔咔直响，双眼闪着寒光。四周清脆的噼啪声比任何时候都响。他最后又问了一遍。
        - id: ch02-b06
          speaker: king_frost
          text: 姑娘，你现在还暖和吗？小可爱，你还暖和吗？
        - id: ch02-b07
          speaker: narrator
          text: 可怜的姑娘已经冻得僵硬麻木，只能勉强喘出几个字。
        - id: ch02-b08
          speaker: stepdaughter
          text: 还……还暖和，陛下！
        - id: ch02-b09
          speaker: narrator
          text: 她一直温和有礼，没有抱怨过一句。霜王被她打动，终于起了怜悯之心。他拿毛皮把姑娘裹紧，又盖上厚毯子，还搬来一口大箱子。箱里装满美丽的珠宝，也装着一件用金银丝绣成的华贵衣裳。姑娘穿上它，比从前更加美丽。霜王请她登上自己的雪橇，六匹白马便拉着他们离开了。
    - id: ch03
      title: 小狗的预言
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 狠毒的继母还在家里等着姑娘的死讯。她甚至烙好了丧宴上吃的薄饼，然后催丈夫出门。
        - id: ch03-b02
          speaker: stepmother
          text: 老头子，你去野地里找找你女儿的尸首，再把她埋掉。
        - id: ch03-b03
          speaker: narrator
          text: 老人正要走，桌子底下的小狗忽然叫了起来。它叫得像是在念一首预言。
        - id: ch03-b04
          speaker: dog
          text: 老人的女儿会活着，给他带来喜悦。老妇的女儿今夜便要永远诀别。
        - id: ch03-b05
          speaker: stepmother
          text: 闭嘴，你这蠢东西！我给你一张薄饼，你得说：她的女儿会有满箱金银，他的女儿已经冻得冰凉。
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: 小狗吃下薄饼，又汪汪叫了起来。
        - id: ch03-b07
          speaker: dog
          text: 他的女儿头上会戴起王冠。她的女儿没人求婚，也永远不会成婚。
        - id: ch03-b08
          speaker: narrator
          text: 老妇人拿出更多薄饼哄它，又挥手要打，想把它吓住。可小狗始终重复同样的话。就在这时，门吱呀一声打开了。一口沉甸甸的大箱子被推进屋里，后面跟着光彩照人的继女。她身上的衣裳闪着金光银光，晃得继母一时睁不开眼。继母看清以后，立刻朝丈夫喊起来。
        - id: ch03-b09
          speaker: stepmother
          text: 老头子，马上套好马！把我的女儿送到那片野地，就放在同一个地方，一点儿也不许错！
        - id: ch03-b10
          speaker: narrator
          text: 老人只得把她的女儿带走，把她留在自己先前与亲生女儿分别的同一棵枞树下。没过多久，霜王便来到她面前。
        - id: ch03-b11
          speaker: king_frost
          text: 姑娘，你觉得暖和吗？
        - id: ch03-b12
          speaker: daughter
          text: 亏你问得出口，你这个瞎眼的老蠢货！没看见我的手脚都快冻僵了吗？
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: 霜王在她面前来回跳动，一次次问她冷不冷、暖不暖。姑娘每回都用粗野无礼的话顶撞他。最后，霜王真的发怒了。他咬紧牙，捏响指节，把她活活冻死在树下。
    - id: ch04
      title: 冰冷的结局
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 小屋里，母亲还在等女儿回来。她等得越来越不耐烦，又命令丈夫去接人。
        - id: ch04-b02
          speaker: stepmother
          text: 老头子，把马牵出来，快去接她回家。你可当心点儿，别弄翻雪橇，把那口箱子弄丢了！
        - id: ch04-b03
          speaker: narrator
          text: 桌下的小狗再次汪汪叫起来。
        - id: ch04-b04
          speaker: dog
          text: 你的女儿已经冻得冰凉，再也得不到金子满箱。
        - id: ch04-b05
          speaker: stepmother
          text: 不许说这种恶毒的谎话！给你一块饼。现在说：她的女儿会嫁给一位强大的国王。
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 话音刚落，门猛地敞开了。母亲急忙冲出去迎接女儿。她伸手把那具冻僵的身体抱进怀里，也被那彻骨的寒气活活冻死了。
