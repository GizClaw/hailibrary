audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    eldest_brother:
      display_name: 大哥
      tts:
        delivery: 阴狠傲慢，得意时带着刻薄
        timbre: 粗硬低沉
        pace: 适中
        pitch: 中低音
    second_brother:
      display_name: 二哥
      tts:
        delivery: 冷酷狡猾，常带附和与算计
        timbre: 干涩清晰
        pace: 适中
        pitch: 中音
    ferko:
      display_name: 费尔科
      tts:
        delivery: 善良真诚，受难时克制，后来坚定勇敢
        timbre: 清朗年轻
        pace: 适中
        pitch: 中音
    raven_1:
      display_name: 第一只乌鸦
      tts:
        delivery: 好奇随意，带着鸟儿般的机敏
        timbre: 沙哑轻快
        pace: 稍快
        pitch: 中高音
    raven_2:
      display_name: 第二只乌鸦
      tts:
        delivery: 见多识广，说起奇事时自然笃定
        timbre: 沙哑沉着
        pace: 适中
        pitch: 中音
    wolf:
      display_name: 狼
      tts:
        delivery: 忠诚爽快，关键时刻果断有力
        timbre: 浑厚粗粝
        pace: 适中
        pitch: 低音
    mouse:
      display_name: 小老鼠
      tts:
        delivery: 机灵热诚，说话轻快而有把握
        timbre: 细亮柔和
        pace: 稍快
        pitch: 高音
    queen_bee:
      display_name: 蜂后
      tts:
        delivery: 轻盈亲切，承诺时自信从容
        timbre: 明亮清脆
        pace: 稍快
        pitch: 中高音
    king:
      display_name: 国王
      tts:
        delivery: 威严冷酷，愤怒和恐惧逐渐失去控制
        timbre: 厚重威严
        pace: 适中
        pitch: 低音
    princess:
      display_name: 公主
      tts:
        delivery: 温柔端庄，忧伤时真挚克制
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高音
  chapters:
    - id: ch01
      title: 三兄弟上路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一对穷苦夫妇有三个相貌堂堂的儿子。家里的食物连父母都不够吃，更养不饱三个孩子。于是，兄弟三人决定离家闯荡，碰碰运气。母亲给了每人一条面包，又为他们祝福。三人依依不舍地告别父母，上了路。
        - id: ch01-b02
          speaker: narrator
          text: 最小的弟弟名叫费尔科。他身材挺拔，蓝眼睛，金头发，脸庞白里透红，就像牛奶映着玫瑰。两个哥哥认定，弟弟凭着这副好相貌，一定会比他们走运，因此嫉妒得不得了。
        - id: ch01-b03
          speaker: narrator
          text: 一天，天气炎热，三个人走累了，便坐到树下休息。费尔科很快睡熟，两个哥哥却没有睡。大哥悄悄对二哥开了口。
        - id: ch01-b04
          speaker: eldest_brother
          text: 咱们不如给费尔科一点苦头吃。他长得好看，谁见了都喜欢，可没人那样喜欢咱们。只要把他除掉，咱们的运气也许会好得多。
        - id: ch01-b05
          speaker: second_brother
          text: 正合我意。先吃光他的面包。等他饿得来求咱们，就说除非肯让咱们弄瞎他的眼睛，或者打断他的腿，否则一口也不给。
        - id: ch01-b06
          speaker: narrator
          text: 大哥高兴极了。两个恶棍抢过弟弟的面包，趁他熟睡，吃得一点不剩。
        - id: ch01-b07
          speaker: narrator
          text: 费尔科醒来以后，饿得伸手去找面包。两个哥哥立刻冲他叫嚷。
        - id: ch01-b08
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: 馋鬼，你睡着时已经把自己的面包吃光了！你爱饿多久就饿多久，我们连一点碎屑也不会给你。
        - id: ch01-b09
          speaker: narrator
          text: 费尔科不明白自己怎么会在梦里吃东西，却没有争辩。他空着肚子熬过一天一夜。第二天早晨，饥饿终于逼得他哭了起来，只能求哥哥分一点面包。两人一边大笑，一边重复前一天的话。弟弟仍苦苦哀求，大哥这才提出条件。
        - id: ch01-b10
          speaker: eldest_brother
          text: 让我们弄瞎你一只眼睛，再打断你一条腿，我们就给你一点面包。
        - id: ch01-b11
          speaker: narrator
          text: 费尔科听见这个条件，哭得比先前更伤心。他忍受着饥饿的折磨，一直熬到太阳升上高空，实在撑不住，只好答应。哥哥们弄瞎了他的左眼，又打断他的左腿。他急忙伸手去接食物，可得到的只是一点小得可怜的面包屑。饥肠辘辘的年轻人一口便吃完，只得再求一块。
        - id: ch01-b12
          speaker: narrator
          text: 他哭着说自己快要饿死，再求一块。两个哥哥越听越开心，反倒骂他贪吃。费尔科又挨了一整天。夜里，他终于向饥饿屈服，用右眼和右腿换来了第二点面包。
        - id: ch01-b13
          speaker: narrator
          text: 两个哥哥如愿把弟弟弄瞎，又打断他的双腿。他们毁掉了费尔科的容貌，也让他从此成了残废。随后，两人把他扔在地上，任他呻吟，自己继续赶路。费尔科吃完哥哥留下的那点面包，放声痛哭。可是四周没有人听见，更没有人来救他。
    - id: ch02
      title: 山上的露水与湖水
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 黑夜降临，费尔科只能在地上爬。他看不见方向，甚至没有眼睛可闭。第二天，太阳再次升到高空，烈日灼烤着他的身体。他想找一块阴凉地歇歇疼痛的四肢，便艰难地爬上一座小山，躺进草里。他以为自己正靠在一棵大树的阴影下。
        - id: ch02-b02
          speaker: narrator
          text: 可那并不是树，而是一架绞刑架。架子上停着两只乌鸦。疲惫的年轻人才躺稳，第一只乌鸦便问起附近有没有奇事。
        - id: ch02-b03
          speaker: raven_1
          text: 这附近有什么特别稀奇的东西吗？
        - id: ch02-b04
          speaker: raven_2
          text: 当然有，而且有好些是别处绝对找不到的。山下有个湖。就算人快死了，只要进去洗一洗，也会马上恢复健康。还有这座山上的露水，哪怕从小失明的人拿它洗眼睛，也能看得像鹰一样清楚。
        - id: ch02-b05
          speaker: raven_1
          text: 我的眼睛倒不用治，谢天谢地，一直好好的。可是许多年前，我的翅膀中了一箭，从那以后又软又没力气。咱们现在就飞到湖边，让它也恢复过来吧。
        - id: ch02-b06
          speaker: narrator
          text: 两只乌鸦飞走了。费尔科听得满心欢喜，焦急地等着天黑，好用珍贵的露水洗眼睛。
        - id: ch02-b07
          speaker: narrator
          text: 太阳终于沉到群山背后。山上渐渐凉下来，露水打湿了草叶。费尔科把脸贴进草地，让露珠沾满双眼。只在一瞬间，他便重新看见了，而且看得比从前任何时候都清楚。
        - id: ch02-b08
          speaker: narrator
          text: 明亮的月光为他照出通往湖边的路。他爬过去，把折断的双腿浸入水中。腿刚碰到湖水，就恢复得和从前一样，又结实又有力。费尔科感谢仁慈的命运把自己引到小山上，让他听见乌鸦的谈话。他取出一只瓶子，灌满治病的湖水，这才精神十足地继续赶路。
        - id: ch02-b09
          speaker: narrator
          text: 没走多远，他遇见一头用三条腿走路的狼。那狼一瘸一拐，满面愁苦，看见费尔科便凄惨地嚎叫。
        - id: ch02-b10
          speaker: ferko
          text: 好朋友，别难过。我很快就能把你的腿治好。
        - id: ch02-b11
          speaker: narrator
          text: 费尔科把一些珍贵的湖水倒在狼爪上。转眼间，狼的四条腿全都好了，立刻轻快地四处蹦跳起来。这个知恩的动物热切地谢过救命恩人，又郑重答应，将来只要费尔科需要帮助，它一定会赶来还这份情。
        - id: ch02-b12
          speaker: narrator
          text: 费尔科来到一块刚刚犁过的田地，看见一只小老鼠正靠两条后腿艰难爬行。它的两只前爪，都被捕鼠夹打断了。费尔科心疼这个小家伙，十分亲切地同它说话，又用湖水洗了洗它小小的前爪。老鼠马上恢复健康，谢过这位好心的医生，飞快地越过一道道犁沟，跑远了。
        - id: ch02-b13
          speaker: narrator
          text: 费尔科再次上路。没走多远，一只蜂后迎面撞到他身上。它拖着一片受伤的翅膀，那翅膀刚被一只大鸟残忍地撕成两半。费尔科仍像帮助狼和老鼠时一样乐意相助，把几滴治病的湖水洒到伤处。蜂后的翅膀立刻长好了。
        - id: ch02-b14
          speaker: queen_bee
          text: 谢谢你的好心。总有一天，我一定会报答你。
        - id: ch02-b15
          speaker: narrator
          text: 蜂后快活地嗡嗡唱着飞走了。费尔科继续漂泊，走了许多天，终于来到一个陌生的王国。听说国王的女儿美得如同白昼，他便决定到王宫去，请国王给自己一份差事。
    - id: ch03
      title: 鲜花宫殿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 费尔科来到王宫，才跨进大门，最先看见的就是那两个残害他的哥哥。他们已经设法在国王手下谋得职位。两人见弟弟的眼睛和双腿都恢复如初，吓得魂不附体。他们生怕费尔科把一路上的恶行告诉国王，那样一来，自己就会被送上绞刑架。
        - id: ch03-b02
          speaker: narrator
          text: 宫里所有人的目光，都被这个俊美的年轻人吸引了。公主也看得入迷，因为她从未见过这样好看的人。两个哥哥看在眼里，恐惧又添上妒火，便再次打定主意除掉弟弟。他们跑去诬告费尔科，说这个邪恶的魔法师进宫，是想抢走公主。
        - id: ch03-b03
          speaker: narrator
          text: 国王命人把费尔科押到面前。
        - id: ch03-b04
          speaker: king
          text: 有人告发你，说你是来夺走我女儿的魔法师。我本该判你死刑。不过，我会给你三项任务。全部完成，我就饶你性命，但你必须离开这个国家。只要有一项办不到，我就把你吊死在最近的树上。
        - id: ch03-b05
          speaker: narrator
          text: 国王又转向那两个哥哥。
        - id: ch03-b06
          speaker: king
          text: 你们替他出个难题。不管有多难，他都只能办成，否则就死。
        - id: ch03-b07
          speaker: eldest_brother
          text: 请陛下命他在一天之内，造一座比这座王宫更美的宫殿。造不出来，就把他吊死。
        - id: ch03-b08
          speaker: narrator
          text: 国王很中意这个主意，立刻命费尔科第二天动手。两个哥哥以为这回终于能永远除掉他，满心得意。费尔科却心如刀割，只恨自己为什么要越过边界，踏进这个王国。他在王宫周围的草地上绝望地徘徊，不停思索该怎样逃过死刑，可怎么也想不到办法。
        - id: ch03-b09
          speaker: narrator
          text: 一只小蜜蜂忽然飞来，落在他的肩头，对着他耳边低声说话。
        - id: ch03-b10
          speaker: queen_bee
          text: 好心的恩人，什么事让你这样发愁？也许我能帮忙。我就是那只被你治好翅膀的蜜蜂，一直想找机会报答你。
        - id: ch03-b11
          speaker: ferko
          text: 唉，你怎么帮得了我？这件事就算全世界最有本领的人也做不到。明天日落以前，我得造出一座比国王的王宫还美的宫殿。
        - id: ch03-b12
          speaker: queen_bee
          text: 原来只有这件事。你尽管放心，明天太阳下山以前，一座任何国王都没住过的宫殿就会建好。你留在这里，等我回来报信。
        - id: ch03-b13
          speaker: narrator
          text: 蜂后快活地飞走了。费尔科听了它的保证，安心躺到草地上，一觉睡到第二天清晨。
        - id: ch03-b14
          speaker: narrator
          text: 第二天一大早，全城的人都起了床。人人都在猜，那个陌生人究竟会在哪里动工，又会用什么办法造出神奇的宫殿。只有公主沉默而忧伤。她太牵挂这个俊美年轻人的命运，整夜都在哭泣，泪水把枕头彻底湿透了。
        - id: ch03-b15
          speaker: narrator
          text: 费尔科在草地上等了一整天。傍晚，蜂后飞回来，又落到他的肩上。
        - id: ch03-b16
          speaker: queen_bee
          text: 宫殿已经造好了。振作起来，带国王到城墙外的小山上去看吧。
        - id: ch03-b17
          speaker: narrator
          text: 费尔科马上向国王报信，说宫殿已经完工。整个宫廷都随他出城，亲眼去看这桩奇迹。城墙外的小山上，矗立着一座辉煌的鲜花宫殿。造宫殿的每一朵花，都是凡人花园里最娇艳的。深红玫瑰铺成屋顶，百合花嵌成窗户，白色康乃馨筑成墙壁。明艳的报春花和紫罗兰铺在脚下，大门由华丽的郁金香和水仙组成，向日葵便是门环。
        - id: ch03-b18
          speaker: narrator
          text: 四周还有成片的风信子和各种香花。芬芳飘得很远，让在场的人全都沉醉。这座宫殿，是知恩图报的蜂后召集全国所有蜜蜂，一起建成的。
        - id: ch03-b19
          speaker: narrator
          text: 国王的惊讶简直没有边际。公主先望着神奇的花宫，又把目光转向同样喜悦的费尔科，眼里闪着欢欣的光。两个哥哥却嫉妒得脸色发绿。眼前的奇迹丝毫没有改变他们的心意，他们反而更加坚持，说弟弟绝不是什么普通人，只能是邪恶的魔法师。
    - id: ch04
      title: 比王宫还高的谷堆
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 国王虽然惊叹于费尔科的本领，却更恼火他逃过一死。他又向两个哥哥发问。
        - id: ch04-b02
          speaker: king
          text: 他确实完成了第一项任务，当然是邪恶的魔法帮了他。现在该让他做什么？必须尽可能困难。他若失败，就得死。
        - id: ch04-b03
          speaker: eldest_brother
          text: 庄稼都割完了，还没有入仓。让这个恶棍在明晚以前，把全国的谷物堆到一起。只要落下一根麦秆，就处死他。
        - id: ch04-b04
          speaker: narrator
          text: 公主听见这个残酷的主意，吓得脸色惨白。费尔科却比面对第一项任务时镇定多了。他又走到王宫外的草地上，一边徘徊，一边思索该怎样摆脱困境。可是直到太阳西沉、黑夜降临，他还是没想出一条生路。这时，一只小老鼠忽然从他脚边的草丛里钻了出来。
        - id: ch04-b05
          speaker: mouse
          text: 好心的恩人，见到你真高兴。你为什么愁眉苦脸？让我帮帮你吧，我也好报答你救我的大恩。
        - id: ch04-b06
          speaker: ferko
          text: 唉，这件事不是人能办到的，你又怎么帮我？明晚以前，全国的谷物都要收拢起来，堆成一大堆。哪怕少一根麦秆，我也得赔上性命。
        - id: ch04-b07
          speaker: mouse
          text: 原来是这件事，那不值得你这样发愁。相信我吧，下一次太阳落山以前，你就会听到任务完成的消息。
        - id: ch04-b08
          speaker: narrator
          text: 小老鼠飞快地钻进田野。费尔科相信它一定守信，便放心地躺在柔软的草地上，熟睡到第二天早晨。白天过得格外缓慢。傍晚时，小老鼠终于回来了。
        - id: ch04-b09
          speaker: mouse
          text: 所有田地都收拾干净了，一根麦秆也没留下。它们全堆在那边的小山上，成了一个大谷堆。
        - id: ch04-b10
          speaker: narrator
          text: 费尔科高兴地去见国王，告诉他一切要求都已经办妥。整个宫廷再次出城观看这桩奇迹，惊讶一点不比上次少。只见全国的谷物堆在一起，比国王的宫殿还高。人们再去查看各处田地，果然没有找到一根遗漏的麦秆。
        - id: ch04-b11
          speaker: narrator
          text: 原来，小老鼠召来了全国所有同伴。它们齐心合力，把每一粒谷物、每一根麦秆都收到了山上。
        - id: ch04-b12
          speaker: narrator
          text: 国王怎么也藏不住惊讶，心里的怒火却越烧越旺。两个哥哥不停地重复，说费尔科不折不扣是个邪恶的魔法师，国王也比从前更加愿意相信他们。只有美丽的公主真心为年轻人的成功而高兴。她亲切地望着费尔科，费尔科也用同样亲切的目光望着她。
        - id: ch04-b13
          speaker: king
          text: 邪恶的魔法又救了他。第三项任务该是什么？无论多么不可能，他也必须做到，不然就死。
        - id: ch04-b14
          speaker: eldest_brother
          text: 让他在明晚以前，把全国的狼都赶到这座山上。办到了，就放他走。办不到，就按陛下说的吊死他。
        - id: ch04-b15
          speaker: narrator
          text: 公主顿时哭了起来。国王一看见她落泪，便命人把她关进高塔，严加看守。除非这个危险的魔法师离开王国，或被吊死在树上，否则不许放她出来。
    - id: ch05
      title: 群狼上山
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 费尔科再次走进田野，坐到一个树桩上，思量接下来该怎么办。忽然，那头被他治好断腿的大狼跑到面前，站住了。
        - id: ch05-b02
          speaker: wolf
          text: 好心的恩人，又见到你真高兴。你怎么独自坐在这里发愁？只要我能帮忙，你尽管说。我一直想让你知道，我没有忘记你的恩情。
        - id: ch05-b03
          speaker: narrator
          text: 费尔科把第三项任务告诉了狼。若是明天办不到，他便会丢掉性命。
        - id: ch05-b04
          speaker: ferko
          text: 可我究竟该怎么做，才能把全国的狼全都赶到那座山上？
        - id: ch05-b05
          speaker: wolf
          text: 要办的只是这件事吗？那就不用担心了。任务交给我。明天日落以前，我会回来找你。振作起来。
        - id: ch05-b06
          speaker: narrator
          text: 狼说完便迈开四腿，很快跑远了。费尔科高兴极了，因为这一次，他觉得自己的性命已经保住。可一想到美丽的公主，他又深深地伤心起来。国王即使放他活着离开这个国家，他也会从此再也见不到她。费尔科重新躺到草地上，很快沉沉睡去。
        - id: ch05-b07
          speaker: narrator
          text: 第二天，费尔科一整日都在田野里徘徊。傍晚，那头狼匆匆跑来。
        - id: ch05-b08
          speaker: wolf
          text: 全国的狼都聚齐了，正在树林里等你。快去请国王上山，让他亲眼看见你完成任务。然后马上回来，骑到我背上。我会帮你把群狼赶过去。
        - id: ch05-b09
          speaker: narrator
          text: 费尔科径直进宫，告诉国王，他已经准备好完成第三项任务，请国王到山上亲眼观看。随后，费尔科回到田野，跨上狼背，骑着它奔向附近的树林。
        - id: ch05-b10
          speaker: narrator
          text: 大狼快如闪电，驮着费尔科绕树林飞奔。只过了一会儿，几百头狼便从林间站起，出现在他们面前。狼的数量每一刻都在增加，很快便由几百变成了成千上万。费尔科和大狼把它们全都赶在前面，一路赶上小山。
        - id: ch05-b11
          speaker: narrator
          text: 国王、整个宫廷，还有费尔科的两个哥哥，都站在山上等待。只有公主没有来。她还被关在高塔里，独自伤心地哭泣。
        - id: ch05-b12
          speaker: narrator
          text: 两个哥哥眼看阴谋又一次落空，气得直跺脚，嘴边冒出白沫。国王看着庞大的狼群越逼越近，忽然被恐惧压倒了。
        - id: ch05-b13
          speaker: king
          text: 够了，够了！我们不要更多狼了！
          emotion: fearful
        - id: ch05-b14
          speaker: wolf
          text: 继续！继续！
        - id: ch05-b15
          speaker: narrator
          text: 又有许多狼奔上山来。它们露出雪白的牙齿，发出可怕的嚎叫。
        - id: ch05-b16
          speaker: king
          text: 先停下来！只要你把群狼赶走，我就把一半王国给你！
          emotion: fearful
        - id: ch05-b17
          speaker: narrator
          text: 费尔科装作没有听见，又赶来几千头狼。在场的人全都吓得发抖。
        - id: ch05-b18
          speaker: king
          text: 停下！只要你让这些狼回到原来的地方，我就把整个王国都给你！
          emotion: fearful
        - id: ch05-b19
          speaker: wolf
          text: 继续！继续！
        - id: ch05-b20
          speaker: narrator
          text: 费尔科仍领着群狼向前，一点也没有停下的意思。最后，狼群扑向国王，又扑向那两个恶毒的哥哥。只在转眼之间，它们便把这三个人和整个宫廷吞吃得干干净净。
    - id: ch06
      title: 新国王
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 费尔科径直回到王宫，打开高塔，放出了公主。就在当天，两人成婚，费尔科也加冕成为这个国家的新国王。
        - id: ch06-b02
          speaker: narrator
          text: 群狼完成了这件事，便安安静静地离开王宫，回到各自原来生活的地方。此后许多年，费尔科和新娘一直过着和平幸福的生活。王国上下，无论地位高低，也无论年长年幼，都深深爱戴他们这对国王和王后。
