cover_prompt: |-
  A wordless cover gathers bright motifs from The Yellow Fairy Book in a sunlit landscape of fields, mountains, and a distant palace. Six white swans fly above a young woman, a green frog rests beside a spring, a flying ship approaches from the clouds, and a tiny steadfast tin soldier stands near a paper dancer. At the center, a child opens a golden hazelnut and releases a warm flock of butterflies into the air. The emerging butterflies are the focal action, carrying the eye among the surrounding stories without dividing the scene into panels. Use a broad elevated composition with strong yellow accents and generous luminous sky at the top. Keep the many folk traditions distinct and respectful, the mood non-frightening, and all figures original rather than based on later adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
