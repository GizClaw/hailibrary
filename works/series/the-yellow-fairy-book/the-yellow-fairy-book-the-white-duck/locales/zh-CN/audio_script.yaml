audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 威严真挚，遇事果断
        timbre: 浑厚沉稳
        pace: 从容
        pitch: 中低音
    queen:
      display_name: 王后
      tts:
        delivery: 温柔细腻，情感真切
        timbre: 柔和明亮
        pace: 舒缓
        pitch: 中音
    witch:
      display_name: 女巫
      tts:
        delivery: 表面亲热圆滑，话音深处藏着冷意
        timbre: 干涩克制
        pace: 从容
        pitch: 中低音
    little_drake:
      display_name: 小公鸭
      tts:
        delivery: 稚嫩机警，直率认真
        timbre: 轻盈清亮
        pace: 轻缓
        pitch: 中高音
  chapters:
    - id: ch01
      title: 王后走进花园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位强大威严的国王娶了一位美丽的公主。世上再没有比他们更幸福的夫妻。可新婚的日子还没过完，国王就要领兵远征，去一个遥远的国家，只能把年轻的妻子留在家中。
        - id: ch01-b02
          speaker: narrator
          text: 王后哭得十分伤心。国王百般安慰她，临行前又再三叮嘱。
        - id: ch01-b03
          speaker: king
          text: 我不在的时候，你千万别离开城堡。不要和陌生人来往，也不要听信坏人的话。尤其要当心那些来历不明的女人。
        - id: ch01-b04
          speaker: narrator
          text: 四件事，王后一件不落，全都郑重答应下来。国王走后，她和侍女们闭门不出，整日在房中纺线织布，心里想的全是远方的丈夫。
        - id: ch01-b05
          speaker: narrator
          text: 她常常又孤单又难过。一天，王后坐在窗前，泪珠一滴滴落到手中的活计上。一个拄拐杖的老婆婆来到窗下。她模样亲切又朴实，一开口更是甜得很。
        - id: ch01-b06
          speaker: witch
          text: 美丽的王后，您为什么这么发愁？别总闷在屋里，到碧绿的花园里走走吧。树上有鸟儿欢唱，花间有蝴蝶翻飞，蜜蜂和小虫也在嗡嗡歌唱。您还能看阳光钻进玫瑰和百合，追赶藏在花心里的露珠。外面这样明亮，一定能赶走您的烦恼。
        - id: ch01-b07
          speaker: narrator
          text: 王后记得自己的诺言，很久都没有答应。可听着听着，她动摇了。只去花园待一会儿，看看花木和翻飞的蝴蝶，听听鸟鸣和虫鸣，再晒晒太阳，能有什么害处呢？
        - id: ch01-b08
          speaker: narrator
          text: 王后哪里知道，这个面目慈祥的老婆婆其实是个恶毒的女巫。女巫嫉妒她的好运，一心想毁掉她。毫不知情的王后跟着女巫走进花园，一路还听着她的甜言蜜语。
        - id: ch01-b09
          speaker: narrator
          text: 花园中央有一方池塘，池水清得像水晶。女巫在池边停下脚步。
        - id: ch01-b10
          speaker: witch
          text: 今天太阳晒得真厉害，池水看着多清凉啊。美丽的王后，您不想下去洗个澡吗？
        - id: ch01-b11
          speaker: queen
          text: 不，我想还是算了。
        - id: ch01-b12
          speaker: narrator
          text: 可才过了一会儿，王后就后悔了。水这样清凉干净，下去洗一洗，总不至于出事。她脱下华贵的长袍，迈进池塘。那双娇嫩的脚刚碰到水波，肩头忽然挨了重重一推。女巫把她推进深水，厉声叫道。
        - id: ch01-b13
          speaker: witch
          text: 从现在起，你就变成白鸭，永远在水里游吧！
    - id: ch02
      title: 城堡里的女巫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 女巫变成王后的模样，穿上王后的华服，坐进宫廷女眷中间，等国王回来。不久，外面传来隆隆的马蹄声和猎犬的吠叫。她赶去迎接车驾，一把搂住国王的脖子，亲吻起来。
        - id: ch02-b02
          speaker: narrator
          text: 国王满心欢喜，根本没看出怀里的女人不是心爱的妻子，而是恶毒的女巫。
        - id: ch02-b03
          speaker: narrator
          text: 宫墙外，可怜的白鸭还在池塘里游来游去。她在池边生下三枚蛋。一天早晨，蛋里孵出两只毛茸茸的小母鸭，还有一只模样难看的小公鸭。
        - id: ch02-b04
          speaker: narrator
          text: 白鸭辛苦地把三个孩子养大。它们跟着妈妈在水里划动，捉池中的金鱼，又跳到碧绿的岸上，摇摇摆摆地走来走去。它们抖着羽毛，神气地叫着“嘎，嘎”。
        - id: ch02-b05
          speaker: narrator
          text: 妈妈总告诫它们，千万别走得太远，更不要靠近花园那头的城堡。
        - id: ch02-b06
          speaker: queen
          text: 那座城堡里住着一个恶毒的女巫。她已经毁了我，也一定会想尽办法害你们。
        - id: ch02-b07
          speaker: narrator
          text: 可小家伙们没有把妈妈的话放在心上。一天，它们在花园里玩着玩着，竟走到了城堡窗下。
    - id: ch03
      title: 不眠之夜
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 女巫一闻气味，就认出了它们，气得咬牙切齿。可她藏住怒火，装得十分和善。她把孩子们叫过去，一边说笑，一边领进一间漂亮的屋子。
        - id: ch03-b02
          speaker: narrator
          text: 女巫拿食物给它们吃，又让它们睡在柔软的垫子上。随后，她走进王宫的厨房，吩咐仆人。
        - id: ch03-b03
          speaker: witch
          text: 把刀磨快，生起一堆旺火。再装满一大锅水，吊到火上烧开。
        - id: ch03-b04
          speaker: narrator
          text: 两只小母鸭很快睡着了。小公鸭躺在姐妹中间，盖着它们的翅膀，身上暖暖的，却怎么也睡不着。到了夜里，它还睁着眼睛，忽然听见女巫来到门外。
        - id: ch03-b05
          speaker: witch
          text: 小东西们，你们睡着了吗？
        - id: ch03-b06
          speaker: narrator
          text: 小公鸭替自己和两个姐姐回答。
        - id: ch03-b07
          speaker: little_drake
          text: 我们睡不着，醒着流眼泪。尖刀磨得快，要把小命催。炉火烧得旺，锅中水滚沸。我们不敢睡，躺着直发颤。
          emotion: fearful
        - id: ch03-b08
          speaker: witch
          text: 它们还醒着。
        - id: ch03-b09
          speaker: narrator
          text: 女巫低声嘟囔着，在走廊里来回踱了一阵，又回到门边。
        - id: ch03-b10
          speaker: witch
          text: 小东西们，你们睡着了吗？
        - id: ch03-b11
          speaker: narrator
          text: 小公鸭又替两个姐姐答了一遍。
        - id: ch03-b12
          speaker: little_drake
          text: 我们睡不着，醒着流眼泪。尖刀磨得快，要把小命催。炉火烧得旺，锅中水滚沸。我们不敢睡，躺着直发颤。
          emotion: fearful
        - id: ch03-b13
          speaker: witch
          text: 又是这番话。我得进去亲眼看看。
        - id: ch03-b14
          speaker: narrator
          text: 她轻轻推开房门。两只小母鸭睡得正沉，小公鸭躺在它们中间。女巫当场杀死了三个孩子。
    - id: ch04
      title: 白鸭的哭诉
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天一早，白鸭心急如焚地绕着池塘寻找孩子。她一声声呼唤，四下搜寻，却连影子也没找到。她心中升起不祥的预感，知道孩子们准是遭了毒手。
        - id: ch04-b02
          speaker: narrator
          text: 白鸭飞出水面，一直飞进王宫。庭院的大理石地上，三个孩子并排躺着，早已断了气，身体冷得像石头。
        - id: ch04-b03
          speaker: narrator
          text: 她扑到孩子们身上，用双翅盖住那三具小小的身体，悲伤地哭起来。
        - id: ch04-b04
          speaker: queen
          text: 嘎，嘎，我的小心肝！嘎，嘎，我的小宝贝！含辛茹苦把你们养大，如今竟在眼前遭了残杀。有什么好的，我都给你们尝。柔软的窝里，我把你们暖。日日夜夜疼爱守望，你们是我唯一的欢乐和希望。
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: 国王听见白鸭悲伤的哭诉，便转身问那个被他当作妻子的女人。
        - id: ch04-b06
          speaker: king
          text: 妻子，这事太奇怪了！你听听那只白鸭。
          emotion: surprised
        - id: ch04-b07
          speaker: witch
          text: 亲爱的丈夫，你在说什么呀？鸭子嘎嘎叫，有什么好奇怪的？来人，把那只鸭子赶出庭院！
        - id: ch04-b08
          speaker: narrator
          text: 仆人们追来撵去，却怎么也赶不走白鸭。她绕了一圈又一圈，每次都飞回孩子们身边，继续哭诉。
        - id: ch04-b09
          speaker: queen
          text: 嘎，嘎，我的小心肝！嘎，嘎，我的小宝贝！恶毒的女巫夺走你们的命，她是条狡诈狠毒的长虫。她先从我身边偷走国王，又把我的孩子一一杀伤。她让我从幸福的妻子变成一只鸭，永远活在水里。但愿我还能恢复王后的模样，但愿你们从不曾遭她杀伤。
          emotion: sad
    - id: ch05
      title: 王后归来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 国王听懂了白鸭的话，渐渐疑心自己受了骗。他立刻吩咐仆人。
        - id: ch05-b02
          speaker: king
          text: 捉住那只鸭子，把她带到我面前。
        - id: ch05-b03
          speaker: narrator
          text: 仆人们来回奔跑，白鸭却一次次从他们身边闪过，怎么也不肯被捉住。最后，国王亲自走到人群中间。白鸭立刻拍着翅膀，落进他的手中。
        - id: ch05-b04
          speaker: narrator
          text: 国王轻轻抚摸她的双翼。转眼间，白鸭变回一位美丽的女子。国王一眼就认出了自己心爱的妻子。
        - id: ch05-b05
          speaker: narrator
          text: 王后告诉国王，花园里的鸭巢中藏着一只瓶子，里面装着几滴疗愈泉的泉水。人们取来瓶子。王后把泉水洒在两只小母鸭和小公鸭身上。
        - id: ch05-b06
          speaker: narrator
          text: 三具小小的尸体变成三个可爱的孩子，重新站了起来。国王和王后喜不自胜。从此，一家人在美丽的王宫里幸福地生活在一起。
        - id: ch05-b07
          speaker: narrator
          text: 至于恶毒的女巫，国王下令把她捉走。她最终没有落得好下场。
