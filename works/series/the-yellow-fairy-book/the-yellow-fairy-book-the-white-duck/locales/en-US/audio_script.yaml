audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, clear, and quietly cautionary
        timbre: gentle and resonant
        pace: measured
        pitch: medium
    king:
      display_name: The King
      tts:
        delivery: noble, sincere, and decisive
        timbre: rich and steady
        pace: measured
        pitch: medium-low
    queen:
      display_name: The Queen
      tts:
        delivery: tender, thoughtful, and expressive
        timbre: soft and luminous
        pace: unhurried
        pitch: medium
    witch:
      display_name: The Witch
      tts:
        delivery: coaxing and smooth with a hidden edge
        timbre: dry and controlled
        pace: measured
        pitch: medium-low
    little_drake:
      display_name: The Little Drake
      tts:
        delivery: young, alert, and plainly earnest
        timbre: light and clear
        pace: gentle
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Queen in the Garden
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a great and powerful King married a lovely Princess. No two people could have been happier. But before their honeymoon had ended, the King had to leave on a military expedition to a distant country.
        - id: ch01-b02
          speaker: narrator
          text: His young wife wept bitterly at the thought of being left behind. The King tried to comfort her, and before he went, he gave her a solemn warning.
        - id: ch01-b03
          speaker: king
          text: Stay inside the castle while I am away. Do not speak with strangers or listen to wicked advisers. Most of all, be careful of any strange woman who comes near you.
        - id: ch01-b04
          speaker: narrator
          text: The Queen faithfully promised to obey him in all four things. When the King rode away, she shut herself in her own rooms with her ladies. She spent her days spinning and weaving, always thinking of her royal husband and waiting for him to come home.
        - id: ch01-b05
          speaker: narrator
          text: She was often sad and lonely. One day, she sat by the window, letting her tears fall onto her work. An old woman came up outside. She looked kind and ordinary, and she leaned on a crutch as she spoke in a sweet, flattering voice.
        - id: ch01-b06
          speaker: witch
          text: Why do you sit here looking so unhappy, fair Queen? Come into the green garden. The birds are singing in the trees, butterflies are fluttering over the flowers, and the bees are humming. You can watch the sunlight chase the dew through the roses and lilies. All that brightness will help you forget your troubles.
        - id: ch01-b07
          speaker: narrator
          text: For a long time, the Queen refused. She remembered her promise to the King. At last, though, she began to wonder what harm there could be in walking through the garden for a little while. She longed to see the flowers, hear the birds, and stand in the sunshine instead of staying in her room all day.
        - id: ch01-b08
          speaker: narrator
          text: The Queen had no idea that this harmless-looking old woman, leaning so humbly on her crutch, was really a wicked witch. The witch envied her good fortune and was determined to ruin her. Knowing none of this, the Queen followed her into the garden and listened to her smooth, flattering words.
        - id: ch01-b09
          speaker: narrator
          text: In the middle of the garden lay a pond as clear as crystal. When they reached it, the old woman stopped.
        - id: ch01-b10
          speaker: witch
          text: The sun is scorching today, and that water looks wonderfully cool. Would you like to bathe in it, fair Queen?
        - id: ch01-b11
          speaker: queen
          text: No, I do not think I should.
        - id: ch01-b12
          speaker: narrator
          text: A moment later, the Queen changed her mind. Why should she not bathe in such cool, fresh water? Surely no harm could come from that. She took off her royal robes and stepped into the pond.
        - id: ch01-b13
          speaker: narrator
          text: Her feet had barely touched the ripples when the witch gave her shoulders a mighty shove and sent her into the deep water.
        - id: ch01-b14
          speaker: witch
          text: From this moment on, you shall swim as a White Duck!
    - id: ch02
      title: The Witch in the Palace
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The witch took the Queen's shape, dressed herself in the royal robes, and sat among the ladies of the court to wait for the King's return.
        - id: ch02-b02
          speaker: narrator
          text: Before long, horses' hoofs thundered outside and dogs began to bark. The witch hurried out to meet the royal carriages. She threw her arms around the King's neck and kissed him. The King was so full of joy that he never guessed the woman in his arms was a witch and not his beloved wife.
        - id: ch02-b03
          speaker: narrator
          text: Beyond the palace walls, the poor White Duck swam back and forth across the pond. Near the water, she laid three eggs. One morning, they hatched into two small, fluffy ducklings and one little ugly drake.
        - id: ch02-b04
          speaker: narrator
          text: The White Duck raised the three little creatures with care. They paddled behind her across the pond, caught goldfish, hopped onto the bank, and waddled over the green grass. They strutted about, ruffling their feathers and crying, “Quack, quack.”
        - id: ch02-b05
          speaker: narrator
          text: Their mother often warned them not to wander far. She told them about the castle beyond the garden and the danger inside it.
        - id: ch02-b06
          speaker: queen
          text: A wicked witch lives in that castle. She has already ruined me, and she will do everything she can to ruin you too.
        - id: ch02-b07
          speaker: narrator
          text: But the young birds did not heed her warning. One day, as they played around the garden, they strayed close to the castle windows.
    - id: ch03
      title: A Night in the Castle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The witch knew them at once by their smell. She ground her teeth in anger, but she hid what she felt. Pretending to be very kind, she called them over, joked with them, and led them into a beautiful room inside the castle.
        - id: ch03-b02
          speaker: narrator
          text: There she gave them food and showed them a soft cushion where they could sleep. Then she went down to the palace kitchens and gave the servants their orders.
        - id: ch03-b03
          speaker: witch
          text: Sharpen the knives. Build a great fire, fill the large kettle with water, and hang it over the flames.
        - id: ch03-b04
          speaker: narrator
          text: Meanwhile, the two ducklings fell asleep. The little drake lay between them, tucked beneath their wings so their feathers would keep him warm. But he could not sleep. He was still wide awake when the witch came to the door that night.
        - id: ch03-b05
          speaker: witch
          text: Little ones, are you asleep?
        - id: ch03-b06
          speaker: narrator
          text: The little drake answered for all three of them.
        - id: ch03-b07
          speaker: little_drake
          text: We cannot sleep. We wake and weep. The knife is sharp and will take our life. The fire is hot, the pot is boiling, and we lie here trembling.
          emotion: fearful
        - id: ch03-b08
          speaker: witch
          text: They are still awake.
        - id: ch03-b09
          speaker: narrator
          text: The witch paced up and down the passage. After a while, she returned to the door.
        - id: ch03-b10
          speaker: witch
          text: Little ones, are you asleep?
        - id: ch03-b11
          speaker: narrator
          text: Once more, the little drake spoke for his sisters.
        - id: ch03-b12
          speaker: little_drake
          text: We cannot sleep. We wake and weep. The knife is sharp and will take our life. The fire is hot, the pot is boiling, and we lie here trembling.
          emotion: fearful
        - id: ch03-b13
          speaker: witch
          text: That is the very same answer. I will go in and see for myself.
        - id: ch03-b14
          speaker: narrator
          text: She gently opened the door. The two little ducklings were sound asleep, and the little drake lay between them. Then and there, the witch killed all three.
    - id: ch04
      title: The White Duck's Lament
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next morning, the White Duck circled the pond in distress, searching everywhere for her little ones. She called and called, but found no trace of them. In her heart, she knew that something terrible must have happened.
        - id: ch04-b02
          speaker: narrator
          text: She fluttered out of the water and flew to the palace. There, on the marble floor of the courtyard, lay her three children. They were dead and cold as stone.
        - id: ch04-b03
          speaker: narrator
          text: The White Duck threw herself over them and covered their small bodies with her wings. Then she cried out in grief.
        - id: ch04-b04
          speaker: queen
          text: Quack, quack, my little loves! Quack, quack, my turtle-doves! I raised you through grief and pain, and now you lie slain before my eyes. I gave you the best I had and kept you warm in my soft nest. I watched over you day and night. You were my joy, my one delight.
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: The King heard the White Duck's sorrowful complaint and turned to the woman he believed was his wife.
        - id: ch04-b06
          speaker: king
          text: Wife, what strange wonder is this? Listen to that White Duck.
          emotion: surprised
        - id: ch04-b07
          speaker: witch
          text: My dear husband, what could you mean? There is nothing strange about a duck quacking. Servants, drive that bird out of the courtyard.
        - id: ch04-b08
          speaker: narrator
          text: The servants chased the White Duck this way and that, but they could not drive her away. Again and again, she circled back to the place where her children lay. Each time, she cried out over them.
        - id: ch04-b09
          speaker: queen
          text: Quack, quack, my little loves! Quack, quack, my turtle-doves! The wicked witch took your lives, that wicked, cunning snake. First she stole my King away. Then she killed my children. She changed me from a happy wife into a duck for all my life. If only I were Queen again. If only you had never been slain.
          emotion: sad
    - id: ch05
      title: The Queen Restored
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As the King listened, he began to suspect that he had been deceived. He called to his servants.
        - id: ch05-b02
          speaker: king
          text: Catch that duck and bring her to me.
        - id: ch05-b03
          speaker: narrator
          text: The servants ran back and forth, but the White Duck always darted past them and would not be caught. At last, the King stepped down among them himself. The duck immediately fluttered into his hands.
        - id: ch05-b04
          speaker: narrator
          text: The King stroked her wings. At once, the White Duck became a beautiful woman, and he recognized his own dear wife.
        - id: ch05-b05
          speaker: narrator
          text: The Queen told the King that a bottle could be found in her nest in the garden. Inside it were precious drops from the spring of healing. The bottle was brought to her, and she sprinkled the healing water over the two ducklings and the little drake.
        - id: ch05-b06
          speaker: narrator
          text: From those three small, lifeless bodies rose three lovely children. The King and Queen were overjoyed to see them, and the whole family lived happily together in the beautiful palace.
        - id: ch05-b07
          speaker: narrator
          text: As for the wicked witch, the King ordered that she be taken away, and she came to no good end.
