audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的机智与克制, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    first_queen:
      display_name: 老王后
      tts: {delivery: 温柔端庄，临终嘱托中带着忧虑, timbre: 柔和虚弱, pace: 缓慢, pitch: 中音}
    false_queen:
      display_name: 新王后
      tts: {delivery: 外表高贵，话语里藏着冷酷与算计, timbre: 圆润而冷冽, pace: 从容, pitch: 中低音}
    king:
      display_name: 国王
      tts: {delivery: 威严却容易受人摆布，感情真切, timbre: 浑厚成熟, pace: 适中, pitch: 低音}
    hermod:
      display_name: 赫尔莫德
      tts: {delivery: 坦率坚定，年轻而勇敢, timbre: 清朗结实, pace: 适中, pitch: 中音}
    hadvor:
      display_name: 哈德沃尔
      tts: {delivery: 温柔坚韧，困境中仍沉着果断, timbre: 清澈明亮, pace: 适中, pitch: 中高音}
    olof:
      display_name: 奥洛夫
      tts: {delivery: 忠诚机敏，提醒危险时干脆清楚, timbre: 温暖清晰, pace: 稍快, pitch: 中音}
    giant:
      display_name: 三头巨人
      tts: {delivery: 阴沉狡诈，言语带着威逼, timbre: 粗重低哑, pace: 缓慢, pitch: 低音}
    dream_woman:
      display_name: 梦中女子
      tts: {delivery: 神秘慈和，指引清楚而镇定, timbre: 空灵柔和, pace: 舒缓, pitch: 中音}
    island_witch:
      display_name: 岛上女巫
      tts: {delivery: 见多识广，说话直截了当, timbre: 苍老沉稳, pace: 稍慢, pitch: 中低音}
  chapters:
    - id: ch01
      title: 林中的新王后
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位国王和一位王后。他们只有一个女儿，名叫哈德沃尔。公主容貌美丽，也是王国的继承人。夫妻俩还收养了一个男孩，名叫赫尔莫德。他和公主年纪相仿，长得英俊，做事又聪明。两个孩子常在一起玩耍，渐渐喜欢上了彼此。还很年轻时，他们就瞒着众人订下了婚约。
        - id: ch01-b02
          speaker: narrator
          text: 后来，王后病得很重。她料想这恐怕是自己最后一场病，知道已经来日无多，便派人把国王请到床前，想在临终前求他一件事。
        - id: ch01-b03
          speaker: first_queen
          text: 我只求你郑重地答应我一件事。以后若要再娶，除了善良的赫特兰女王，千万不要娶别人。
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: 国王答应了。不久，王后便去世了。日子久了，国王厌倦了独自生活，于是备好船只，出海去找赫特兰女王。海上忽然升起浓雾，他彻底迷失了方向。经过许多波折，他终于发现陆地。国王把船泊好，独自上岸。走了一阵，他来到一片树林，往里没走多远便停下了脚步。
        - id: ch01-b05
          speaker: narrator
          text: 林中传来悦耳的竖琴声。国王循声走到一块空地，只见那里有三个女人。一个衣着华贵，神情十分悲伤，抱着竖琴坐在金椅上。另一个年轻些，也穿得很讲究，坐的椅子却没那么气派。第三个模样俊俏，站在她们身旁，衣服外披着绿斗篷，一眼便看得出是服侍另外两人的女仆。
        - id: ch01-b06
          speaker: false_queen
          text: 你是什么人？又要往哪里去？
        - id: ch01-b07
          speaker: king
          text: 我是一国之君，王后已经去世。如今我要去赫特兰，向那里的女王求婚。
        - id: ch01-b08
          speaker: false_queen
          text: 命运安排得真巧。海盗洗劫了赫特兰，还杀死了国王。我吓得逃离故土，历尽艰难才来到这里。我就是你要找的女王，身边的是我的女儿和女仆。
        - id: ch01-b09
          speaker: narrator
          text: 国王马上向她求婚。女人欣然接受，当场答应嫁给他。她带着女儿和女仆，跟国王一起回到船上。一路航程没有什么可说的。等国王回到自己的国家，便大摆宴席，迎娶了这个女人。宫中也暂时平静了一阵。
        - id: ch01-b10
          speaker: narrator
          text: 赫尔莫德和哈德沃尔都不大理会新王后母女。哈德沃尔却和那个身披绿斗篷的女仆十分亲近。她名叫奥洛夫，常来公主自己的城堡看望她，两人渐渐成了好友。不久，国王出征去了。他前脚刚走，王后就找到赫尔莫德，要他娶自己的女儿。
        - id: ch01-b11
          speaker: hermod
          text: 我不会娶她。
        - id: ch01-b12
          speaker: false_queen
          text: 既然这样，你也休想得到哈德沃尔！我要把你送到一座荒岛上，叫你白天做狮子，夜里才能变回人。你还会一直思念哈德沃尔，受尽折磨。除非她烧掉你的狮皮，否则你永远别想解脱。可那一天还早得很呢！
          emotion: angry
        - id: ch01-b13
          speaker: hermod
          text: 那我也对你下咒。只要我挣脱了你的魔法，你就会变成大耗子，你女儿会变成小耗子。你们会在大厅里互相撕咬，直到我拔剑杀死你们。
        - id: ch01-b14
          speaker: narrator
          text: 赫尔莫德说完便消失了，谁也不知道他去了哪里。王后命人四处搜寻，可无论哪里都找不到他。
    - id: ch02
      title: 地底来的求婚者
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，奥洛夫来陪哈德沃尔，问她知不知道赫尔莫德去了哪里。公主伤心地说不知道。
        - id: ch02-b02
          speaker: olof
          text: 那我把真相告诉你。王后是女巫，她女儿也是，只不过披着美人的模样。赫尔莫德不肯娶她女儿，王后便把他送到岛上，叫他白天做狮子，夜里做人。只有你烧掉狮皮，他才能恢复自由。
        - id: ch02-b03
          speaker: olof
          text: 王后也替你挑好了丈夫。她的弟弟住在地下世界，是个三头巨人。她想把巨人变成俊美的王子，再逼你嫁给他。她当初也是把我从父母家掳来的。幸好我这件绿斗篷能挡住邪术，她才一直伤不了我。
        - id: ch02-b04
          speaker: narrator
          text: 哈德沃尔想到王后替自己安排的这桩婚事，比先前更加悲伤。她苦苦央求奥洛夫，一定替自己想个脱身的办法。
        - id: ch02-b05
          speaker: olof
          text: 那个求婚者会从城堡地板底下钻出来。听见响动，看见地板裂开，你就把事先烧热的沥青狠狠灌进去。这一招准能对付他。
        - id: ch02-b06
          speaker: narrator
          text: 就在这段日子里，国王从战场回来了。听说赫尔莫德下落不明，他很受打击。王后竭力安慰他，过了一阵，国王也不再像先前那样挂念了。哈德沃尔仍留在自己的城堡，照奥洛夫的话做好了准备，只等求婚者找上门。
        - id: ch02-b07
          speaker: narrator
          text: 没过几个夜晚，城堡底下忽然传出震耳的轰响。公主立刻明白是谁来了，马上叫女仆们准备帮忙。隆隆声越来越近，也越来越响，地板终于裂开了。她们立刻抬来那锅滚烫的沥青，朝裂口狠狠灌下去。地下的声音渐渐微弱，最后彻底停了。
        - id: ch02-b08
          speaker: narrator
          text: 第二天一早，王后在宫门外找到了巨人的尸体。她站到弟弟身旁，念起咒语。
        - id: ch02-b09
          speaker: false_queen
          text: 我要把你变成一位俊美的王子。等我指控哈德沃尔时，她一个字也不能替自己辩解。
        - id: ch02-b10
          speaker: narrator
          text: 巨人的尸体果然变成了俊美的王子。王后随即回宫，找到国王。
        - id: ch02-b11
          speaker: false_queen
          text: 人们都说你的女儿善良，我看未必。我弟弟来向她求婚，她却叫人杀了他。尸体就在宫门外。
        - id: ch02-b12
          speaker: narrator
          text: 国王跟她去看尸体，觉得事情十分蹊跷。他说，这样俊美的青年足以与哈德沃尔相配，要是他来求婚，自己原本一定会答应。王后要求亲自决定公主的惩罚。国王不愿亲手处置自己的女儿，很乐意把这件事交给她。王后的判决是为弟弟筑起一座大坟冢，再把哈德沃尔和他关在一起。
        - id: ch02-b13
          speaker: narrator
          text: 奥洛夫知道这个阴谋，赶去告诉公主。哈德沃尔又求她指点自己。
        - id: ch02-b14
          speaker: olof
          text: 进去时，你要在衣服外松松披一件大斗篷。巨人的鬼魂会起来，身边还带着两条狗。他会叫你割下他腿上的肉喂狗。你先别答应，除非他告诉你赫尔莫德在哪里，又该怎么去找。
        - id: ch02-b15
          speaker: olof
          text: 后来他会让你踩着他的肩膀爬出去，却又想揪住斗篷把你拖回来。只要斗篷披得松，他抓到的就只有斗篷，你便能逃走。
        - id: ch02-b16
          speaker: narrator
          text: 坟冢筑好后，巨人的尸体被放了进去。哈德沃尔连一句话也不准替自己辩解，也被迫走进墓里。等两人被单独封在里面，一切果然照奥洛夫说的发生了。王子重新变回三头巨人，鬼魂起来行走，身边还跟着两条狗。他要公主割下他腿上的肉喂狗。
        - id: ch02-b17
          speaker: hadvor
          text: 先告诉我赫尔莫德在哪里，我怎样才能找到他。否则，我绝不会答应。
        - id: ch02-b18
          speaker: giant
          text: 他在一座荒岛上。你得剥下我脚底的皮，做成一双鞋。穿上它，你既能走陆地，也能踏过海面。
        - id: ch02-b19
          speaker: narrator
          text: 哈德沃尔剥下巨人脚底的皮，做成了鞋。巨人这才让她踩上自己的肩膀，爬出坟冢。她刚纵身跃出去，他果然伸手揪住斗篷，想把她拖回来。可斗篷只是松松搭在肩头。哈德沃尔把它留下，自己顺利脱身。
    - id: ch03
      title: 荒岛上的狮皮
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 哈德沃尔一路来到海边，找到了通往赫尔莫德所在荒岛最近的水道。神奇的鞋托住她，让她轻松走过海峡。登上小岛，只见沿海尽是沙滩，上方耸立着高高的峭壁，却找不到任何可以攀登的路。她走了很久，心里悲伤，身体也累极了，便躺下来沉沉睡去。
        - id: ch03-b02
          speaker: narrator
          text: 睡梦中，一个高个子女人来到她面前。
        - id: ch03-b03
          speaker: dream_woman
          text: 我知道你是哈德沃尔公主，正在寻找赫尔莫德。他就在岛上，可你独自爬不上悬崖。我已经放下一根绳子，你可以沿着它上去。
        - id: ch03-b04
          speaker: dream_woman
          text: 岛这么大，你也不容易找到他的住处。我把一团线放在你身边。握住线头，线团会在前面滚动，为你带路。旁边还有一条腰带。醒来以后系上它，你便不会饿得昏倒。
        - id: ch03-b05
          speaker: narrator
          text: 女人说完便消失了。哈德沃尔醒来一看，梦中的一切果然都是真的。绳索从崖顶垂下，线团和腰带也都在身旁。她先把腰带系好，再沿着绳索爬上峭壁。线团一路滚在前面，把她带到一个不大的洞口。她走进洞里，看见一张低矮的床，便钻到床下躲起来。
        - id: ch03-b06
          speaker: narrator
          text: 到了傍晚，洞外响起脚步声。哈德沃尔知道狮子已经来到洞口。它先在外面抖了抖身体。紧接着，她又听见一个男人朝床边走来。那人独自念叨自己的遭遇，还一遍遍想起哈德沃尔和从前的日子。公主听出这正是赫尔莫德，却没有出声，只静静等着。
        - id: ch03-b07
          speaker: narrator
          text: 等赫尔莫德熟睡后，她才从床下爬出来，走到洞外，把他脱在那里的一张狮皮烧掉。随后，她回到洞中唤醒了赫尔莫德。两人终于重逢，欢喜得难以形容。
        - id: ch03-b08
          speaker: narrator
          text: 第二天，他们商量怎样离开小岛，却想不出办法。哈德沃尔说起那个梦，猜想岛上一定有人能帮助他们。
        - id: ch03-b09
          speaker: hermod
          text: 我知道岛上住着一个女巫。她很愿意帮助求上门的人。看来我们只能去找她了。
        - id: ch03-b10
          speaker: narrator
          text: 于是，两人一同来到女巫的洞穴。女巫和十五个年幼的儿子都在里面。他们便上前说明来意，请她帮助自己渡海返回大陆。
        - id: ch03-b11
          speaker: island_witch
          text: 这可不容易。那个被埋葬的巨人已经变成大鲸鱼，正等着在路上袭击你们。不过，我会借你们一条船。要是遇见鲸鱼，觉得性命难保，就喊我的名字。
        - id: ch03-b12
          speaker: narrator
          text: 两人十分感激她的帮助和提醒，连声道谢，乘船离开小岛。走到半路，只见一条巨鱼激起大片水花，劈波斩浪，直朝他们冲来。他们认出那就是巨人，觉得眼下正是呼救的时候，马上高声喊出女巫的名字。
        - id: ch03-b13
          speaker: narrator
          text: 转眼间，另一条巨鲸从船后赶来，身后还跟着十五条较小的鲸。它们全都越过小船，迎向巨人所变的鲸鱼。海上顿时爆发一场恶战，风浪翻腾，巨浪不断扑向小船。赫尔莫德和哈德沃尔拼命支撑，才没让海水把船灌满。
        - id: ch03-b14
          speaker: narrator
          text: 打了好一阵，海水渐渐被鲜血染红。随后，那条大鲸和十五条小鲸全都消失了。赫尔莫德和哈德沃尔则平安抵达陆地。
    - id: ch04
      title: 大厅里的两个女巫
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 与此同时，国王的大厅里也发生了怪事。王后和她的女儿都失踪了，那里却多出一只大耗子和一只小耗子，总在互相撕咬。许多人都试过赶走它们，可谁也办不到。日子就这样过去。王后不见踪影，两个怪物又搅得大厅再无半点欢乐，国王又忧又愁，几乎发了狂。
        - id: ch04-b02
          speaker: narrator
          text: 一天傍晚，众人正在大厅里愁眉不展地坐着，赫尔莫德忽然走了进来，腰间还佩着一把剑。他走上前向国王致意。国王欢喜极了，迎接他时，就像看见一个死去的人重新归来。
        - id: ch04-b03
          speaker: narrator
          text: 赫尔莫德还没落座，便径直走向正在撕咬的两只耗子，拔剑把它们劈成两半。众人惊愕地定睛一看，大厅地板上躺着的竟是两个死去的女巫。
        - id: ch04-b04
          speaker: narrator
          text: 赫尔莫德从王后的魔咒讲起，把自己和哈德沃尔经历的一切都告诉了国王。国王听说两个邪恶的妖物终于被除掉，十分高兴。接着，赫尔莫德请求迎娶哈德沃尔。
        - id: ch04-b05
          speaker: king
          text: 我答应这门婚事。我已经老了，王国也交给你吧。
        - id: ch04-b06
          speaker: narrator
          text: 于是，赫尔莫德迎娶哈德沃尔，登上王位，成了国王。奥洛夫也嫁给了一位英俊的贵族。我们的故事，到这里便讲完了。
