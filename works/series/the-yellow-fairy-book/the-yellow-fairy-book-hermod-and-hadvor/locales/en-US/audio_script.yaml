  chapters:
    - id: ch01
      title: The King's New Bride
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a King and Queen had one daughter, Hadvor. She was beautiful, and because she was their only child, the kingdom would one day be hers. They also had a foster son named Hermod. He was about Hadvor's age, handsome, and clever at nearly everything. The two children were always together. They grew so fond of each other that, while they were still young, they secretly promised to marry.
        - id: ch01-b02
          speaker: narrator
          text: In time, the Queen fell gravely ill. She knew she might not recover, so she sent for the King and asked one last thing of him.
        - id: ch01-b03
          speaker: first_queen
          text: If you ever marry again, promise me you will choose no one but the Queen of Hetland the Good.
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: The King gave his word, and soon afterward the Queen died.
        - id: ch01-b05
          speaker: narrator
          text: Years passed. At last, the King grew weary of living alone. He fitted out his ship and sailed away to find the Queen of Hetland the Good. A fog closed around him at sea, so thick that he lost all sense of direction. After struggling on for a long while, he finally reached land. He tied up his ship, went ashore alone, and walked until he entered a forest.
        - id: ch01-b06
          speaker: narrator
          text: A little way among the trees, he heard the sweet music of a harp. He followed it to a clearing. Three women were there. One sat on a golden chair, richly dressed, holding the harp with a sorrowful face. A younger woman, also finely dressed, sat on a plainer chair. Beside them stood a very pretty maid in a green cloak.
        - id: ch01-b07
          speaker: narrator
          text: The King watched for a moment, then stepped forward and greeted them. The woman on the golden chair asked who he was and where he meant to go. He told her he was a king whose queen had died, and that he was sailing to Hetland the Good to ask its Queen to marry him.
        - id: ch01-b08
          speaker: queen
          text: Fortune has brought you to the very person you seek. Pirates plundered Hetland and killed its King. I escaped in terror, and after a hard journey I came here with my daughter and my maid.
        - id: ch01-b09
          speaker: narrator
          text: The King asked at once if she would be his wife. She gladly accepted. All four made their way back to the ship, and in time they reached the King's country. He gave a great feast and married the woman. For a while, all was quiet.
        - id: ch01-b10
          speaker: narrator
          text: Hermod and Hadvor paid little attention to the new Queen or her daughter. Hadvor did become close friends with the maid, whose name was Olof. Olof often came to visit her at the castle.
    - id: ch02
      title: The Queen's Spell
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before long, the King went away to war. As soon as he was gone, the Queen sought out Hermod. She told him she wanted him to marry her daughter.
        - id: ch02-b02
          speaker: hermod
          text: I will not marry her. That is my plain answer.
        - id: ch02-b03
          speaker: narrator
          text: The Queen flew into a terrible rage.
        - id: ch02-b04
          speaker: queen
          text: Then you will not have Hadvor either! I send you to a desert island, where you will be a lion by day and a man by night. You will think of Hadvor always, and that will make your sorrow worse. The spell will hold until Hadvor burns the lion's skin, and she will not do that soon.
          emotion: angry
        - id: ch02-b05
          speaker: hermod
          text: Then hear my spell in return. The moment I am free of your enchantment, you will become a rat and your daughter a mouse. You will fight each other in the hall until I kill you both with my sword.
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: Hermod vanished. No one knew where he had gone. The Queen ordered a search, but he could not be found anywhere.
        - id: ch02-b07
          speaker: narrator
          text: One day, while Olof was visiting Hadvor, she asked whether the Princess knew what had happened to Hermod. Hadvor sadly said she did not.
        - id: ch02-b08
          speaker: olof
          text: Then I will tell you, because I know the truth. The Queen made Hermod disappear. She is a witch, and her daughter is one too, though both wear beautiful shapes. Hermod refused to marry the daughter, so the Queen sent him to an island. He is a lion by day and a man by night, and only you can free him by burning the lion's skin.
        - id: ch02-b09
          speaker: olof
          text: The Queen has chosen a husband for you as well. Her brother lives in the Underworld. He is a three-headed Giant, but she means to turn him into a handsome prince and marry him to you. She has done such things before. She stole me from my parents and forced me to serve her. Still, she has never harmed me, because this green cloak protects me from her magic.
        - id: ch02-b10
          speaker: narrator
          text: Hadvor was more distressed than ever when she heard what marriage the Queen had planned. She begged Olof to find a way to save her.
        - id: ch02-b11
          speaker: olof
          text: I think your suitor will rise through the castle floor. When you hear him coming and the floor starts to open, be ready with blazing pitch. Pour plenty of it into the opening. He will not be able to bear that.
    - id: ch03
      title: The Wooer from Below
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Around this time, the King returned from the war. He was deeply troubled that no one knew where Hermod had gone. The Queen comforted him as well as she could, and after a while he thought less often about the disappearance.
        - id: ch03-b02
          speaker: narrator
          text: Hadvor stayed in her castle and prepared for the suitor Olof had warned her about. Not many nights later, a heavy rumbling sounded beneath the castle. Hadvor knew at once what it meant and called her maids to help. The thunder under their feet grew louder and louder. When the floor began to split open, they lifted the caldron and poured a great quantity of blazing pitch into the gap. The noise weakened, faded, and finally stopped.
        - id: ch03-b03
          speaker: narrator
          text: Early the next morning, the Queen went to the palace gate. Her brother, the Giant, lay dead there. She stood over him and cast another spell.
        - id: ch03-b04
          speaker: queen
          text: Become a handsome prince. And when I accuse Hadvor, let her be unable to speak in her own defense.
        - id: ch03-b05
          speaker: narrator
          text: The dead Giant changed into the body of a beautiful young prince. Then the Queen went back inside and spoke to the King.
        - id: ch03-b06
          speaker: queen
          text: Your daughter is not as good as people say. My brother came to ask her to marry him, and she had him killed. I found his body lying at the palace gate.
        - id: ch03-b07
          speaker: narrator
          text: The King went with the Queen to see the body. He found the whole thing very strange. Such a handsome young man, he said, would have made Hadvor a worthy husband, and he would gladly have allowed the marriage.
        - id: ch03-b08
          speaker: narrator
          text: The Queen asked to choose Hadvor's punishment. The King agreed, because he could not bear to punish his own daughter himself. The Queen ordered him to build a great burial mound for her brother and shut Hadvor inside it beside the body.
        - id: ch03-b09
          speaker: narrator
          text: Olof knew every part of the Queen's plan. She hurried to Hadvor and told her what had happened. Once again, Hadvor begged her to say what she should do.
        - id: ch03-b10
          speaker: olof
          text: First, find a wide cloak and wear it loosely over your clothes when they put you in the mound. Once you are alone with the Giant, his ghost will rise with two dogs. He will ask you to cut flesh from his legs and feed it to them. Promise nothing until he tells you where Hermod is and how to reach him.
        - id: ch03-b11
          speaker: olof
          text: After that, he will let you stand on his shoulders to climb out. He still means to trick you. He will seize your cloak and try to drag you back, so be sure it rests loosely on your shoulders. Then the cloak will come away in his hands.
    - id: ch04
      title: Escape from the Mound
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The burial mound was soon ready. The Giant's body was laid inside, and Hadvor was forced to enter without being allowed to defend herself. The mound was closed, leaving the two of them together.
        - id: ch04-b02
          speaker: narrator
          text: Everything happened just as Olof had foretold. The handsome prince became a Giant again. His two dogs came with him, and he demanded that Hadvor cut pieces from his legs to feed them.
        - id: ch04-b03
          speaker: hadvor
          text: I will promise nothing until you tell me where Hermod is and how I can find him.
        - id: ch04-b04
          speaker: giant
          text: Hermod is on a desert island. You cannot reach it unless you skin the soles of my feet and make yourself a pair of shoes. Those shoes will carry you over both land and sea.
        - id: ch04-b05
          speaker: narrator
          text: Hadvor took the skin from the soles of the Giant's feet and made the shoes. Then he allowed her to climb onto his shoulders so she could reach the opening of the mound.
        - id: ch04-b06
          speaker: narrator
          text: Hadvor sprang out. The Giant grabbed her cloak and tried to pull her back, but she had left it loose, just as Olof had told her. The cloak slipped from her shoulders, and Hadvor escaped.
        - id: ch04-b07
          speaker: narrator
          text: She made her way down to the sea, choosing the place where the crossing to Hermod's island was shortest. The strange shoes held her above the water, and she crossed the strait with ease.
        - id: ch04-b08
          speaker: narrator
          text: On the island, a sandy beach ran beside the sea, with high cliffs rising above it. Hadvor could find no path upward. Her heart was heavy, and the long journey had worn her out, so she lay down and fell asleep.
        - id: ch04-b09
          speaker: narrator
          text: While she slept, she dreamed that a tall woman came to her.
        - id: ch04-b10
          speaker: dream_woman
          text: I know you are Princess Hadvor, and that you have come to search for Hermod. He is here on this island, but you cannot climb these cliffs without help. I have lowered a rope for you. The island is so large that Hermod's home would be hard to find, so I am leaving a ball of thread beside you. Hold the loose end, and the ball will roll ahead and lead you there. I am also leaving a belt. Put it on when you wake, and hunger will not make you faint.
        - id: ch04-b11
          speaker: narrator
          text: The woman vanished. Hadvor woke and found that every part of the dream was true. A rope hung down from the top of the cliff. Beside her lay the ball of thread and the belt. She put on the belt first, so she would not grow faint from hunger. Then she used the rope to climb the cliff. At the top, she took hold of the loose thread. The ball rolled ahead of her, and Hadvor followed wherever it led.
    - id: ch05
      title: The Lion's Skin
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At last, the ball of thread led Hadvor to a small cave. She went inside and found a low couch. Then she crawled beneath it and hid.
        - id: ch05-b02
          speaker: narrator
          text: Evening came. Hadvor heard footsteps outside. A lion had reached the cave mouth. It shook itself there, and then she heard a man walking toward the couch.
        - id: ch05-b03
          speaker: narrator
          text: Hadvor knew it must be Hermod. He spoke aloud about the cruel life he was living. He remembered Hadvor and the days they had shared long ago. She stayed silent until he fell asleep.
        - id: ch05-b04
          speaker: narrator
          text: Then Hadvor crept from beneath the couch and slipped outside. The lion's skin lay at the cave mouth, where Hermod had shaken it off. She burned it completely, returned to the cave, and woke him. The spell was broken. Hermod and Hadvor knew each other at once, and their joy at being together again was greater than words could tell.
        - id: ch05-b05
          speaker: narrator
          text: In the morning, they discussed what to do next. Neither could see how they might leave the island. Hadvor told Hermod about her dream and said she believed someone there could help them.
        - id: ch05-b06
          speaker: hermod
          text: A Witch lives on this island, and she is always willing to help people. Our only hope is to go to her.
        - id: ch05-b07
          speaker: narrator
          text: They went to the Witch's cave. She was there with her fifteen young sons. Hermod and Hadvor asked her to help them cross to the mainland.
        - id: ch05-b08
          speaker: island_witch
          text: That will be harder than many things. The Giant from the burial mound is waiting for you. He has changed himself into a great whale, and he will attack you on the way. Still, I will lend you a boat. If the whale meets you and your lives are in danger, call me by name.
        - id: ch05-b09
          speaker: narrator
          text: Hermod and Hadvor thanked the Witch warmly for her help and her warning. Then they took the boat and set out from the island.
    - id: ch06
      title: The Battle of the Whales
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: While they were crossing, a huge fish came toward them. It churned the sea and sent waves crashing around the boat. Hermod and Hadvor knew this must be the Giant. They could imagine no greater danger in which to call upon the Witch, so they cried out her name.
        - id: ch06-b02
          speaker: narrator
          text: At once, another enormous whale appeared behind their boat, with fifteen smaller whales following it. The whole company swept past Hermod and Hadvor and rushed to meet the Giant-whale.
        - id: ch06-b03
          speaker: narrator
          text: A savage battle began between the Giant-whale and the Witch with her fifteen sons. The sea grew so violent that Hermod and Hadvor could hardly keep their little boat from filling with water. Waves broke over the sides, and they had to fight to stay afloat. The struggle went on for a long time. At last, they saw the sea around the whales turn red with blood.
        - id: ch06-b04
          speaker: narrator
          text: Then the great whale and all fifteen smaller ones disappeared. The fight was over, and Hermod and Hadvor reached the mainland safely.
    - id: ch07
      title: Hermod Comes Home
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Meanwhile, strange events had taken place in the King's hall. The Queen and her daughter had vanished. In their place, a rat and a mouse fought each other without stopping. Many people tried to drive them out, but no one could do it.
        - id: ch07-b02
          speaker: narrator
          text: Time passed. The King nearly lost his senses from grief and worry. His Queen was gone, and the two horrible creatures had driven every trace of happiness from the hall.
        - id: ch07-b03
          speaker: narrator
          text: One evening, everyone sat there in gloom. Suddenly, Hermod entered with a sword at his side and greeted the King. The King welcomed him with overwhelming joy, as though Hermod had returned from the dead.
        - id: ch07-b04
          speaker: narrator
          text: Before taking his seat, Hermod walked over to the rat and mouse as they fought. He drew his sword and cut them both in two. Everyone stared in astonishment. Two dead witches now lay on the floor where the creatures had been.
        - id: ch07-b05
          speaker: narrator
          text: Hermod told the King everything that had happened. The King was glad to be free of such wicked beings. Then Hermod asked to marry Hadvor. The King gladly gave his consent. He was old by then, so he gave Hermod the kingdom as well, and Hermod became King.
        - id: ch07-b06
          speaker: narrator
          text: Olof married a handsome nobleman.
        - id: ch07-b07
          speaker: narrator
          text: And that is the end of the story.
