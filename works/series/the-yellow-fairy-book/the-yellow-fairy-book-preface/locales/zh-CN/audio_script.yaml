audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切诙谐，带着一本正经的调侃
        timbre: 温暖清朗
        pace: 从容而富有变化
        pitch: 中音
  chapters:
    - id: ch01
      title: 又一本童话集
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 编者想，孩子们一定肯痛痛快快地原谅他，因为他又出版了一本童话集。蓝色的、红色的、绿色的，我们已经有了，现在又来了黄色的。只要孩子们喜欢，还肯好心告诉编者他们喜欢，别人说些什么，他就不大放在心上。
        - id: ch01-b02
          speaker: narrator
          text: 不过，有一位先生似乎觉得，把这么多带插图的童话印出来，又配上红红蓝蓝的封面，并不是很妥当。他叫G. 劳伦斯·戈姆，是民俗学会的会长。这个学会是个学术团体。每年，他都要向自己的臣民发表一次演说。编者是臣民之一，约瑟夫·雅各布斯先生也是。雅各布斯出版过许多好看的童话，还配着漂亮的插图。顺便告诉你，这些书可以到河滨街的纳特先生那里买到。
        - id: ch01-b03
          speaker: narrator
          text: 你不妨想一想，雅各布斯先生和编者听见会长说，他们不该出版童话集，尤其不该出版红色、绿色和蓝色的童话集时，该有多么惊慌！两个人都说，他们看不出这有什么害处。他们还愿意“请国人公断”，让孩子们组成陪审团来审判。直到今天，他们还是看不出自己做错了什么。不但如此，他们就像诗里的威廉老爹，随时准备“再做一次，又做一次”。
    - id: ch02
      title: 仙境里的真故事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这究竟有什么害处呢？事情是这样的。民俗学会由全国最聪明、最博学、最漂亮的男男女女组成。他们喜欢研究仙境的历史和地理，而这些学问就藏在非常古老的故事里，也就是乡下人和未开化民族世代口传的那些故事。
        - id: ch02-b02
          speaker: narrator
          text: 有几句小诗说：“小小苏族人，小小克罗人，小小爱斯基摩人，浑身冷冰冰。”人们认为，这些人最熟悉仙境和那里的居民。
        - id: ch02-b03
          speaker: narrator
          text: 可是，《黄色童话集》和另外几本童话集中，还有许多故事出自多尔诺瓦夫人、汉斯·克里斯蒂安·安徒生先生这样的人。他们既不是未开化民族，也不是乡野村民。民俗学会，或者至少它的会长，认为这些故事不如另外那些真实，不该混在一起出版。
        - id: ch02-b04
          speaker: narrator
          text: 我们的看法却不同。只要一个故事读起来有趣，对我们来说，它就已经足够真实了。所以这些故事全都收在这里，还配上了福特先生的插图。我们不觉得这些图画或故事会把孩子引入歧途。
    - id: ch03
      title: 世上有没有仙子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 世上到底有没有仙子？这个问题可不好回答。赫胥黎教授认为没有。编者自己从没见过仙子，可他认识好几位见过的人。他们在苏格兰高地见到了仙子，还听见过仙子的音乐。要是哪天到了下洛哈伯，你可以去仙子山看看。只要挑一个晴朗的日子，说不定你也会像那些大人一样，亲耳听见那音乐。
        - id: ch03-b02
          speaker: narrator
          text: 再想想看，如果仙子真的不存在，为什么全世界的人都相信有呢？古希腊人相信，古埃及人、印度人和北美印第安人也相信。要是根本没有仙子，这么多不同的民族怎么会都见过她们，也听见过她们呢？巴林-古尔德牧师小时候曾到吟游诗人之乡旅行，还亲眼见过好几位仙子。
        - id: ch03-b03
          speaker: narrator
          text: 有了这些理由，编者认定仙子确实存在。不过，她们从来不会伤害谁。英格兰的仙子早已被烟雾和学校教师吓跑了。巨人已经绝迹，真正的矮人倒是在非洲森林里十分常见。
        - id: ch03-b04
          speaker: narrator
          text: 关于仙子的故事，大概有不少并不完全真实。可人们也讲过许多拿破仑、克拉弗豪斯、尤利乌斯·恺撒和圣女贞德的不实传闻，而这些人无疑都真正存在过。所以，聪明的孩子应该记住，假如长大以后加入了民俗学会，可别以为有人曾把这本书里的每一个故事都当作绝对真实的事实交给他。这些故事印出来，只是为了让他开心。至于确切的事实，他日后可以再去研究，也可以干脆不去管。
    - id: ch04
      title: 故事从哪里来
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这本书收了俄罗斯、德国、法国、冰岛、北美印第安和其他地方的故事。翻译这些故事的，有奇普小姐、阿尔玛·阿莱恩小姐和西拉·阿莱恩小姐、塞拉小姐、克雷吉先生、布莱克利小姐、登特夫人，还有朗夫人。冰岛故事是克雷吉先生翻译的。北美印第安故事则不同，它们抄自美国史密森民族学局出版的英译本。书里的插图都是福特先生画的。
        - id: ch04-b02
          speaker: narrator
          text: 希望孩子们觉得，这一本并不比先前送到他们眼前的那些童话集逊色。在说“再见”以前，编者还要劝大家，求学的时候一定要读一读已故萨克雷先生的《玫瑰与戒指》，那本书的插图也是作者亲手画的。
        - id: ch04-b03
          speaker: narrator
          text: 编者认为，每个孩子的藏书里都绝不能少了这一本。大家应该催促父母，一有机会就把它买来，因为没有读过它，教育便算不得完整。
        - id: ch04-b04
          speaker: narrator
          text: 这篇序言的署名是A. 朗。
