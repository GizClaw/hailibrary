  chapters:
    - id: ch01
      title: The Child of Snow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there lived a man and his wife who had no children, and this caused them great sorrow. One bright winter day, they stood outside their cottage. The woman looked up at the many little icicles hanging from the roof and sighed.
        - id: ch01-b02
          speaker: mother
          text: I wish I had as many children as there are icicles up there.
          emotion: sad
        - id: ch01-b03
          speaker: father
          text: Nothing could make me happier than that.
        - id: ch01-b04
          speaker: narrator
          text: Just then, a tiny icicle broke away from the roof and fell straight into the woman's mouth. She swallowed it with a smile.
        - id: ch01-b05
          speaker: mother
          text: Maybe now I'll have a snow child!
          emotion: happy
        - id: ch01-b06
          speaker: narrator
          text: Her husband laughed at such a strange thought, and they went back inside. Yet before long, the woman gave birth to a little girl. The baby was white as snow and cold as ice. Whenever they carried her close to the fire, she screamed until they took her somewhere cool again.
        - id: ch01-b07
          speaker: narrator
          text: The little girl grew with amazing speed. Within a few months, she could run and talk. But raising her brought her parents plenty of worry. All summer long, she insisted on staying in the cellar. In winter, she slept outdoors in the snow, and the colder the weather became, the happier she was. Her parents simply called her Our Snow-daughter, and that name stayed with her for the rest of her life.
    - id: ch02
      title: The Child of Fire
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, the parents sat beside the fire and talked about their daughter's extraordinary ways. Outside, a snowstorm was raging, and the Snow-daughter was happily playing in it. Her mother gave a deep sigh.
        - id: ch02-b02
          speaker: mother
          text: I wish I had given birth to a Fire-son!
        - id: ch02-b03
          speaker: narrator
          text: As she spoke, a spark leaped from the great wood fire and landed in her lap. She laughed.
        - id: ch02-b04
          speaker: mother
          text: Well, maybe now I'll have a Fire-son!
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: The man laughed too and took it for a fine joke. But soon afterward, his wife gave birth to a boy, and then the matter did not seem like a joke at all. The baby screamed with all his strength until they placed him right beside the fire. If the Snow-daughter came anywhere near him, he almost cried himself into a fit.
        - id: ch02-b06
          speaker: narrator
          text: The Snow-daughter avoided the boy whenever she could. She would creep into the corner farthest from him. Their parents called the baby Our Fire-son, and his name also stayed with him all his life.
        - id: ch02-b07
          speaker: narrator
          text: The Fire-son was every bit as troublesome to raise as his sister had been. Still, he grew quickly, and before he was a year old, he could run and speak. His skin was red as fire, and his body was hot to the touch. He sat on the hearth as close to the flames as he could and still complained that he was cold.
        - id: ch02-b08
          speaker: narrator
          text: Whenever his sister entered the room, he nearly crawled into the fire to escape her chill. She, in turn, complained of the terrible heat whenever he came close. In summer, the Fire-son lay outside in the sun while the Snow-daughter hid in the cellar. So the brother and sister seldom came near each other. In fact, they took great care not to.
    - id: ch03
      title: The Fur Cloaks
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: By the time the Snow-daughter had grown into a beautiful woman, her father and mother had both died, one after the other. The Fire-son had grown into a fine, strong young man. With their parents gone, he spoke to his sister.
        - id: ch03-b02
          speaker: fire_son
          text: I'm going out into the world. There is no reason for me to stay here now.
        - id: ch03-b03
          speaker: snow_daughter
          text: Then I'm coming with you. You are the only person I have left, and I feel that good fortune will come if we set out together.
        - id: ch03-b04
          speaker: fire_son
          text: I love you with all my heart. But I freeze whenever you're near me, and you almost die from the heat when I come close. How can we travel together without making each other miserable?
        - id: ch03-b05
          speaker: snow_daughter
          text: Don't worry. I've thought about that and found a way for us to manage. Look, I had two fur cloaks made, one for each of us. If we wear them, I won't feel your heat so much, and you won't feel my cold.
          emotion: calm
        - id: ch03-b06
          speaker: narrator
          text: They put on the fur cloaks and cheerfully started their journey. For the first time in their lives, brother and sister could be together in complete happiness.
    - id: ch04
      title: The Houses of Ice and Fire
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: For a long time, the Fire-son and the Snow-daughter wandered through the world. At the beginning of winter, they reached a great wood and decided to remain there until spring. The Fire-son built himself a hut and kept an enormous fire burning inside. His sister wore very little and stayed outdoors through every day and night.
        - id: ch04-b02
          speaker: narrator
          text: One day, the King of that land came hunting in the wood. He saw the Snow-daughter walking in the open air and wondered who this beautiful girl could be, dressed so lightly in winter. He stopped to speak with her. Before long, he learned that she could not bear heat and her brother could not bear cold.
        - id: ch04-b03
          speaker: narrator
          text: The King was so charmed by the Snow-daughter that he asked her to marry him. She agreed, and their wedding was celebrated with great splendor.
        - id: ch04-b04
          speaker: narrator
          text: For his wife, the King ordered a vast house of ice to be made beneath the ground, where it would not melt even in summer. For his brother-in-law, he built another house with huge ovens all around it. Those ovens were kept hot through every day and every night.
        - id: ch04-b05
          speaker: narrator
          text: The Fire-son was delighted with his new home. But living in such endless heat made his body hotter and hotter, until it became dangerous for anyone to stand too close to him.
    - id: ch05
      title: The Last Feast
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One day, the King held a great feast and invited his brother-in-law along with all the other guests. The Fire-son did not arrive until everyone had gathered. The instant he entered, the heat pouring from him was so fierce that every guest fled outside into the open air.
        - id: ch05-b02
          speaker: narrator
          text: The King grew very angry.
        - id: ch05-b03
          speaker: king
          text: If I had known how much trouble you would cause, I would never have welcomed you into my home!
          emotion: angry
        - id: ch05-b04
          speaker: narrator
          text: The Fire-son only laughed.
        - id: ch05-b05
          speaker: fire_son
          text: Don't be angry, dear brother! I love heat, and my sister loves cold. Come and let me give you a hug. Then I'll go straight home.
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: Before the King could answer, the Fire-son caught him in a tight embrace. The King screamed in agony. The Snow-daughter had taken shelter from her brother's heat in the next room, but when she heard the cry, she rushed back. The King lay dead on the floor, burned to a cinder.
        - id: ch05-b07
          speaker: narrator
          text: At the sight of him, the Snow-daughter turned on her brother and flew at him. A fight began unlike any fight the earth had ever seen. People heard the noise and hurried to the room. When they reached it, they saw the Snow-daughter melting away into water, while the Fire-son burned to a cinder.
        - id: ch05-b08
          speaker: narrator
          text: And so the unhappy brother and sister came to their end.
