audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的神秘与克制, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    mother:
      display_name: 母亲
      tts: {delivery: 温厚直率，愿望里带着深深的牵挂, timbre: 柔和清晰, pace: 稳健, pitch: 中音}
    father:
      display_name: 父亲
      tts: {delivery: 朴实温和，说话简短坦率, timbre: 温暖厚实, pace: 稍缓, pitch: 中低音}
    snow_daughter:
      display_name: 雪女儿
      tts: {delivery: 清醒坚定，温柔中藏着决绝, timbre: 清澈轻盈, pace: 稳健, pitch: 中高音}
    fire_son:
      display_name: 火儿子
      tts: {delivery: 热烈爽直，亲近中带着危险的莽撞, timbre: 明亮有力, pace: 稍快, pitch: 中音}
    king:
      display_name: 国王
      tts: {delivery: 威严自持，动怒时尖锐急促, timbre: 低沉洪亮, pace: 稳健, pitch: 低音}
  chapters:
    - id: ch01
      title: 冰凌落入口中
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一对夫妻一直没有孩子，这成了两人心里最大的伤痛。一个阳光明亮的冬日，他们站在小屋外。妻子抬头望着屋檐，那儿垂着一根又一根小冰凌。她看了许久，轻轻叹了口气，又转身望向丈夫。
        - id: ch01-b02
          speaker: mother
          text: 要是我的孩子能像这些冰凌一样多，那该多好啊。
          emotion: sad
        - id: ch01-b03
          speaker: father
          text: 我也再盼望不过了。
        - id: ch01-b04
          speaker: narrator
          text: 这时，一根细小的冰凌脱离屋檐，正巧落进妻子嘴里。她笑着咽下了它。
        - id: ch01-b05
          speaker: mother
          text: 这一下，我说不定会生出一个雪孩子呢！
        - id: ch01-b06
          speaker: narrator
          text: 丈夫觉得这个念头实在古怪，笑着同妻子回了屋。谁知没过多久，妻子真的生下一个女孩。她白得像雪，冷得像冰。父母只要把她抱近炉火，她就拼命哭叫，非得回到凉爽的地方才肯停。女孩长得快极了，几个月后已经会跑会说。可要把她养大并不容易，父母为她费尽心思，也总是放心不下。她整个夏天都要躲在地窖里，冬天却睡在屋外的雪地上。天气越冷，她就越快乐。父母叫她“我们的雪女儿”，这个名字从此伴了她一生。
    - id: ch02
      title: 火星落进怀中
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，父母坐在火边，说起女儿那些奇特的习惯。屋外正刮着猛烈的雪暴，雪女儿却在风雪里尽情玩耍。母亲看着看着，又深深叹了一口气。
        - id: ch02-b02
          speaker: mother
          text: 要是我生的是个火儿子就好了！
        - id: ch02-b03
          speaker: narrator
          text: 话刚出口，一粒火星便从旺盛的柴火中飞出来，落在她怀里。母亲笑了起来。
        - id: ch02-b04
          speaker: mother
          text: 看来这一回，我也许真会生个火儿子！
        - id: ch02-b05
          speaker: narrator
          text: 父亲听了哈哈大笑，只当这是句有趣的玩笑。可不久以后，妻子果真生下一个男孩，他再也笑不出来了。男孩哭得震天响，非要紧贴着火焰才会安静。雪女儿若是靠近，他更会拼命喊叫，几乎抽搐过去。姐姐也尽量避开弟弟，总悄悄缩到离他最远的角落。父母便叫男孩“我们的火儿子”，这个名字同样跟了他一生。这个孩子也给父母添了许多忧虑。
        - id: ch02-b06
          speaker: narrator
          text: 火儿子也长得出奇地快，不满一岁就会跑会说。他红得像火，身上烫得不能摸，却整天贴着壁炉喊冷。姐姐若在屋里，他简直恨不得钻进火焰。弟弟只要靠近，姐姐便不停喊热。夏天，火儿子总躺在阳光下，雪女儿却藏进地窖。就这样，姐弟两个很少碰面，而且总在小心避开对方。
    - id: ch03
      title: 姐弟同行
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 雪女儿刚刚长成美丽的姑娘，父母便先后离开了人世。火儿子这时也成了英俊强壮的青年。他对姐姐说出了自己的打算。
        - id: ch03-b02
          speaker: fire_son
          text: 我要到外面的世界去闯一闯。留在这里，还有什么意思？
        - id: ch03-b03
          speaker: snow_daughter
          text: 我跟你走。除了你，我在世上再没有亲人了。我总觉得，只要我们一起出发，好运就会来。
        - id: ch03-b04
          speaker: fire_son
          text: 我是真心爱你，可你一靠近，我就冻得发抖。我走到你身边，你又会热得几乎送命。我们怎么一起赶路，才不会叫对方受苦？
        - id: ch03-b05
          speaker: snow_daughter
          text: 别为这个发愁，我早就想好办法了。我请人做了两件毛皮斗篷，咱们一人一件。披上它，我不会那么热，你也不会那么冷，我们就能彼此相伴了。
          emotion: calm
        - id: ch03-b06
          speaker: narrator
          text: 姐弟俩披上斗篷，高高兴兴地上了路。平生第一次，他们能待在一起，而且都觉得十分快乐。两人在世上漂泊了很久。初冬来到一片大森林时，他们决定留下过冬，等春天来了再走。火儿子搭起一间小屋，屋里的大火日夜燃烧。雪女儿只穿着很少的衣服，白天黑夜都留在外面。
        - id: ch03-b07
          speaker: narrator
          text: 一天，这个国家的国王来森林打猎。他看见雪女儿穿得那样单薄，独自在露天漫步，十分惊奇，便停下来同她交谈。国王很快知道，她经不起热，弟弟受不了冷。他被雪女儿深深吸引，开口请她做自己的妻子。雪女儿答应了，婚礼办得格外隆重。
        - id: ch03-b08
          speaker: narrator
          text: 国王在地下为妻子造了一座大冰屋，就连夏天也不会融化。他又给妻弟盖了一所房子，四面围着巨大的火炉，昼夜烧个不停。火儿子住得快活极了。只是那里的热气从不消退，他的身体也变得越来越烫。谁要是走得太近，便会遇到危险。
    - id: ch04
      title: 冰与火的结局
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 有一天，国王举行盛宴，把妻弟也请了来。客人全部到齐以后，火儿子才出现。他身上的热气太强，众人顷刻间全逃到屋外的露天处躲避，谁也不敢再靠近。国王顿时怒不可遏。
        - id: ch04-b02
          speaker: king
          text: 要是早知道你会带来这么多麻烦，我绝不会让你进我的家门！
          emotion: angry
        - id: ch04-b03
          speaker: fire_son
          text: 姐夫，别生气呀！我喜欢热，姐姐喜欢冷。来，让我抱你一下，抱完我马上就回家。
        - id: ch04-b04
          speaker: narrator
          text: 国王还没来得及作声，火儿子已经牢牢抱住了他。国王痛得放声惨叫。雪女儿原本躲在隔壁房间，避开弟弟身上的热气。听见叫声，她急忙赶来，只见国王倒在地上，已经烧成焦炭。
        - id: ch04-b05
          speaker: narrator
          text: 雪女儿看见这一幕，转身便扑向弟弟。两人打了起来。那是一场世间从未见过的搏斗。响声引来了附近的人。等人们赶到，只见雪女儿正在化成一摊水，火儿子也正在烧成焦炭。
        - id: ch04-b06
          speaker: narrator
          text: 这对不幸的姐弟，就这样迎来了结局。
