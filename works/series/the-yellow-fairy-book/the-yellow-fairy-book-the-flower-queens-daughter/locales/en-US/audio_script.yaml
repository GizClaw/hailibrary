  chapters:
    - id: ch01
      title: The Little Bell
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One day, a young Prince rode across a meadow that stretched for miles ahead. When he reached a deep, open ditch, he turned aside so he could ride around it. Then he heard someone crying below. He got down from his horse and walked beside the ditch, following the sound. To his astonishment, he found an old woman trapped at the bottom.
        - id: ch01-b02
          speaker: narrator
          text: She begged him to help her. The Prince bent down and lifted her out of that living grave. As he did, he asked how she had fallen in.
        - id: ch01-b03
          speaker: good_fairy
          text: My son, I am very poor. I left soon after midnight so I could sell my eggs in the town market this morning. But I lost my way in the dark and fell into this deep ditch. Without your kindness, I might have stayed there forever.
        - id: ch01-b04
          speaker: prince
          text: You can scarcely walk. Let me put you on my horse and lead you home. Where do you live?
        - id: ch01-b05
          speaker: good_fairy
          text: Do you see that little hut in the distance? It stands over there at the edge of the forest.
        - id: ch01-b06
          speaker: narrator
          text: The Prince lifted her onto his horse, then walked beside her and led the way. Before long, they reached the hut at the forest's edge. The old woman climbed down and turned to him.
        - id: ch01-b07
          speaker: good_fairy
          text: Wait here for just a moment. I have something to give you.
        - id: ch01-b08
          speaker: narrator
          text: She disappeared inside, then quickly returned.
        - id: ch01-b09
          speaker: good_fairy
          text: You are a mighty Prince, but you also have a kind heart, and that deserves a reward. Would you like the most beautiful woman in the world for your wife?
        - id: ch01-b10
          speaker: prince
          text: I certainly would.
        - id: ch01-b11
          speaker: good_fairy
          text: Then listen. The most beautiful woman in all the world is the Flower Queen's daughter. A dragon is holding her captive. If you wish to marry her, you must first set her free, and I will help you.
        - id: ch01-b12
          speaker: good_fairy
          text: Take this little bell. Ring it once, and the King of the Eagles will appear. Ring it twice, and the King of the Foxes will come. Ring it three times, and the King of the Fishes will stand beside you. They will help whenever you are in trouble. Now farewell, and may heaven bless your journey.
        - id: ch01-b13
          speaker: narrator
          text: She placed the bell in his hand. At once, the hut and the old woman vanished as if the earth had swallowed them.
        - id: ch01-b14
          speaker: narrator
          text: The Prince understood then that he had been speaking with a good fairy. He tucked the bell safely into his pocket and rode home. There he told his father that he meant to free the Flower Queen's daughter. The very next day, he would set out into the wide world to find her.
    - id: ch02
      title: Three Years on the Road
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next morning, the Prince mounted his fine horse and left home. He wandered around the world for a whole year. His horse died from exhaustion, and the Prince suffered hunger and hardship. Still, he found no trace of the maiden he sought.
        - id: ch02-b02
          speaker: narrator
          text: At last, he came to a hut where a very old man sat outside. The Prince asked him a question.
        - id: ch02-b03
          speaker: prince
          text: Do you know where the Dragon lives, the one who keeps the Flower Queen's daughter prisoner?
        - id: ch02-b04
          speaker: first_old_man
          text: No, I do not. But follow this road straight ahead for one year. You will reach a hut where my father lives. He may be able to tell you.
        - id: ch02-b05
          speaker: narrator
          text: The Prince thanked him for the advice and continued his journey. For another whole year, he followed that same road. At the end of it, he found a little hut with another very old man inside. He asked the man the same question about the Dragon and his prisoner.
        - id: ch02-b06
          speaker: second_old_man
          text: No, I do not know where the Dragon lives. Keep straight along this road for one more year. You will come to my father's hut, and I know he can tell you.
        - id: ch02-b07
          speaker: narrator
          text: So the Prince wandered on for a third year, never leaving that road. At last, he reached another hut and found the third old man. This man was the father of the second old man and the grandfather of the first. Once again, the Prince asked where the Dragon lived.
        - id: ch02-b08
          speaker: third_old_man
          text: The Dragon lives on that mountain, and he has just begun his year of sleep. He stays awake for one whole year, then sleeps through the next. But if you want to see the Flower Queen's daughter, climb the second mountain. The Dragon's old mother lives there, and every night she holds a ball. The Flower Queen's daughter always attends.
    - id: ch03
      title: The Mother Dragon's Castle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Prince climbed the second mountain. There he found a castle made entirely of gold, with windows of diamond. He opened the great gate that led into the courtyard. He was just about to walk in when seven dragons rushed at him and surrounded him. They demanded to know why he had come.
        - id: ch03-b02
          speaker: prince
          text: I have heard so much about the Mother Dragon's beauty and kindness. I would like to serve her.
        - id: ch03-b03
          speaker: narrator
          text: The dragons were pleased by this flattering answer. Their eldest spoke to him.
        - id: ch03-b04
          speaker: eldest_dragon
          text: Very well. Come with me, and I will take you to the Mother Dragon.
        - id: ch03-b05
          speaker: narrator
          text: They went into the castle and passed through twelve splendid halls, each one made of gold and diamonds. In the twelfth room, the Mother Dragon sat on a diamond throne. She was the ugliest woman under the sun, and she had three heads. The sight of her shocked the Prince. So did her voice, which sounded like a great flock of ravens croaking at once.
        - id: ch03-b06
          speaker: mother_dragon
          text: Why have you come here?
        - id: ch03-b07
          speaker: prince
          text: I have heard so much about your beauty and your kindness that I would be honored to enter your service.
        - id: ch03-b08
          speaker: mother_dragon
          text: Very well. But first you must take my mare to the meadow and guard her for three days. If you fail to bring her safely home each evening, we will eat you.
        - id: ch03-b09
          speaker: narrator
          text: The Prince accepted the task and led the mare out to the meadow.
    - id: ch04
      title: The Mare in the Clouds
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The moment the mare reached the grass, she vanished. The Prince searched everywhere, but he could not find her. At last, he gave up in despair. He sat on a large stone and thought about the terrible end waiting for him.
        - id: ch04-b02
          speaker: narrator
          text: Then he noticed an eagle flying overhead and suddenly remembered the little bell. He took it from his pocket and rang it once. The air rustled beside him, and in an instant, the King of the Eagles came down at his feet.
        - id: ch04-b03
          speaker: king_of_eagles
          text: I know why you called me. You are searching for the Mother Dragon's mare, and she is galloping among the clouds. I will gather every eagle in the sky. Together, they will catch her and bring her back to you.
        - id: ch04-b04
          speaker: narrator
          text: With that, the Eagle King flew away. Near evening, the Prince heard a tremendous rushing in the sky. He looked up and saw thousands of eagles driving the mare ahead of them through the air. The whole flock swept down to the ground at his feet. Then the eagles handed the mare over to him.
        - id: ch04-b05
          speaker: narrator
          text: The Prince rode back to the Mother Dragon. She stared at him in wonder when she saw that he had returned with her mare.
        - id: ch04-b06
          speaker: mother_dragon
          text: You managed to guard my mare today. As your reward, you may come to my ball tonight.
        - id: ch04-b07
          speaker: narrator
          text: She gave him a cloak made of copper and led him into a great room. Young he-dragons and she-dragons danced together there. Among them was the beautiful daughter of the Flower Queen. Her gown was woven from the loveliest flowers in the world, and her face had the colors of lilies and roses.
        - id: ch04-b08
          speaker: narrator
          text: While the Prince danced with her, he found a moment to whisper in her ear.
        - id: ch04-b09
          speaker: prince
          text: I have come to set you free.
        - id: ch04-b10
          speaker: flower_queens_daughter
          text: If you bring the mare back safely on the third day, ask the Mother Dragon to reward you with one of the mare's foals.
        - id: ch04-b11
          speaker: narrator
          text: The ball ended at midnight. Early the next morning, the Prince led the mare into the meadow once more. Again, she vanished before his eyes. This time, he drew out the little bell and rang it twice.
        - id: ch04-b12
          speaker: narrator
          text: At once, the King of the Foxes appeared before him.
        - id: ch04-b13
          speaker: king_of_foxes
          text: I already know what you need. The mare has hidden herself inside a hill. I will call every fox in the world and send them to find her.
        - id: ch04-b14
          speaker: narrator
          text: The Fox King disappeared. That evening, many thousands of foxes brought the mare back to the Prince.
        - id: ch04-b15
          speaker: narrator
          text: He rode home to the Mother Dragon with the mare. This time, she rewarded him with a cloak made of silver. Once again, she led him into the ballroom. The Flower Queen's daughter was delighted to see him alive and unharmed. When they danced together, she leaned close and whispered in his ear.
        - id: ch04-b16
          speaker: flower_queens_daughter
          text: If you succeed again tomorrow, take the foal and wait for me in the meadow. When the ball is over, we will escape together.
    - id: ch05
      title: The Foal and the Golden Cloak
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: On the third day, the Prince led the mare out to the meadow again. Once more, she vanished before his eyes. The Prince took out the little bell and rang it three times.
        - id: ch05-b02
          speaker: narrator
          text: In an instant, the King of the Fishes appeared.
        - id: ch05-b03
          speaker: king_of_fishes
          text: I know exactly what you need. The mare is hiding in a river. I will summon all the fish in the sea and order them to bring her back to you.
        - id: ch05-b04
          speaker: narrator
          text: Toward evening, the mare was returned to him. The Prince led her home, and the Mother Dragon spoke.
        - id: ch05-b05
          speaker: mother_dragon
          text: You are a brave young man. I will make you my personal servant. But first, what would you like as your reward?
        - id: ch05-b06
          speaker: prince
          text: Give me one of your mare's foals.
        - id: ch05-b07
          speaker: narrator
          text: The Mother Dragon gave it to him at once. She also gave him a cloak made of gold, for she had fallen in love with the Prince after hearing him praise her beauty.
        - id: ch05-b08
          speaker: narrator
          text: That evening, the Prince entered the ball wearing his golden cloak. Before the celebration ended, he slipped away and went straight to the stables. He mounted his foal, rode into the meadow, and waited for the Flower Queen's daughter.
        - id: ch05-b09
          speaker: narrator
          text: Near midnight, the beautiful girl appeared. The Prince lifted her onto the horse in front of him. Then the two of them flew like the wind until they reached the Flower Queen's home.
    - id: ch06
      title: Summer and Winter
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The dragons discovered that the pair had fled. They woke their brother from his year-long sleep and told him what had happened. He flew into a terrible rage and decided to lay siege to the Flower Queen's palace.
        - id: ch06-b02
          speaker: narrator
          text: But the Queen made a forest of flowers spring up around her home. It rose as high as the sky, and no one could force a path through it.
        - id: ch06-b03
          speaker: narrator
          text: When the Flower Queen learned that her daughter wished to marry the Prince, she spoke to him.
        - id: ch06-b04
          speaker: flower_queen
          text: I gladly give my consent to your marriage. But my daughter may stay with you only in summer. In winter, when everything is dead and snow covers the ground, she must return to me and live in my palace beneath the earth.
        - id: ch06-b05
          speaker: narrator
          text: The Prince agreed. He took his beautiful bride home, and their wedding was celebrated with great splendor.
        - id: ch06-b06
          speaker: narrator
          text: The young couple lived happily together until winter arrived. Then the Flower Queen's daughter left and returned to her mother. When summer came, she went back to her husband, and their joyful life began again. It lasted until winter drew near and she returned once more to the Flower Queen.
        - id: ch06-b07
          speaker: narrator
          text: All her life, she came and went with the seasons. Even so, she and the Prince always lived happily together.
