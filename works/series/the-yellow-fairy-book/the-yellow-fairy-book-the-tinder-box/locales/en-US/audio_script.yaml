  chapters:
    - id: ch01
      title: The Hollow Tree
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A soldier came marching down the high road. Left, right! A left, right! His knapsack was strapped to his back, and his sword swung at his side as he marched. He had been away fighting in the wars. Now those days were behind him, and he was making his way home.
        - id: ch01-b02
          speaker: narrator
          text: An old Witch met him on the road. She was terribly ugly, and her lower lip hung all the way down to her breast.
        - id: ch01-b03
          speaker: witch
          text: Good evening, Soldier! What a fine sword you have, and what a fine knapsack! Now, you look like a proper soldier. You ought to have all the money you can carry.
        - id: ch01-b04
          speaker: soldier
          text: Thank you, old Witch.
        - id: ch01-b05
          speaker: narrator
          text: The Witch pointed to a great tree beside the road.
        - id: ch01-b06
          speaker: witch
          text: Do you see that tree? It is hollow. Climb to the top, and you will find a hole that leads down inside. I will tie a rope around your waist. When you call, I can pull you up again.
        - id: ch01-b07
          speaker: soldier
          text: And what am I supposed to do down there?
        - id: ch01-b08
          speaker: witch
          text: Get money! When you reach the bottom of the tree, you will find yourself in a great hall. It is bright down there, because more than three hundred lamps are burning. You will see three doors. Each one can be opened, because the keys are already waiting in the locks.
        - id: ch01-b09
          speaker: witch
          text: In the first room, a dog sits on a chest. His eyes are as big as saucers, but never mind him. Spread my blue-check apron on the floor, lift the dog onto it, and take all the copper money you want.
        - id: ch01-b10
          speaker: witch
          text: The next room holds silver. Its dog has eyes as big as mill-wheels. Put him on my apron too, and help yourself. The third room holds all the gold you can carry. That dog has eyes as big as the Round Tower at Copenhagen, and he is savage. Still, if you set him on my apron, he will not touch you.
        - id: ch01-b11
          speaker: soldier
          text: That sounds very good. But what do you want in return? You cannot be doing this for nothing.
        - id: ch01-b12
          speaker: witch
          text: I do not want one farthing. Just bring me an old tinder-box. My grandmother left it down there the last time she went in.
        - id: ch01-b13
          speaker: soldier
          text: All right. Tie the rope around me.
        - id: ch01-b14
          speaker: witch
          text: Here is the rope, and here is my blue-check apron.
        - id: ch01-b15
          speaker: narrator
          text: The Soldier climbed the tree and lowered himself through the hole. Just as the Witch had promised, he landed in a great underground hall where three hundred lamps were burning.
    - id: ch02
      title: Three Dogs and Three Chests
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: He opened the first door. Ugh! There was the dog, staring at him with eyes as big as saucers.
        - id: ch02-b02
          speaker: soldier
          text: You're a fine fellow, aren't you?
        - id: ch02-b03
          speaker: narrator
          text: The Soldier went straight up to the dog and placed him on the Witch's blue-check apron. Then he lifted the lid of the chest and took as much copper as his pockets could hold. When he was done, he shut the chest, put the dog back on top, and went into the second room. Sure enough, another dog sat there, and his eyes were as large as mill-wheels.
        - id: ch02-b04
          speaker: soldier
          text: Don't stare at me so hard! Your eyes will pop right out of your head.
        - id: ch02-b05
          speaker: narrator
          text: Once again, he lifted the dog onto the apron and opened the chest. The moment he saw all the silver inside, the copper no longer seemed worth carrying. He threw every copper coin away. Then he filled both his pockets and his knapsack with nothing but silver.
        - id: ch02-b06
          speaker: narrator
          text: Then he entered the third room. What a sight! The last dog's eyes were each as large as the Round Tower at Copenhagen, and they spun in his head like wheels.
        - id: ch02-b07
          speaker: soldier
          text: Good evening!
        - id: ch02-b08
          speaker: narrator
          text: He saluted, because he had never seen such a dog. After taking a closer look, he decided he had seen quite enough. He put the dog on the floor and opened the chest.
        - id: ch02-b09
          speaker: narrator
          text: Heavens, what a mountain of gold! With that treasure, he could have bought the whole town. He could have bought every sugar pig, every tin soldier, every whip, and every rocking horse in the whole world. The silver went tumbling out. In its place went gold, filling his pockets and his knapsack. He even packed gold into his cap and boots. By then he could hardly walk, but now he was truly rich.
        - id: ch02-b10
          speaker: narrator
          text: He returned the dog to the chest, shut the door, and called up through the tree.
        - id: ch02-b11
          speaker: soldier
          text: Pull me up now, old Witch!
        - id: ch02-b12
          speaker: witch
          text: Did you remember the tinder-box?
        - id: ch02-b13
          speaker: soldier
          text: Bother! I completely forgot it.
        - id: ch02-b14
          speaker: narrator
          text: He went back for the tinder-box, and then the Witch pulled him up. Soon he stood on the road again with gold in his pockets, knapsack, cap, and boots.
        - id: ch02-b15
          speaker: soldier
          text: What are you going to do with that tinder-box?
        - id: ch02-b16
          speaker: witch
          text: That is none of your concern. You have your money. Now give me my tinder-box.
        - id: ch02-b17
          speaker: soldier
          text: We'll see about that. Tell me what you want it for, or I'll draw my sword and cut off your head!
          emotion: angry
        - id: ch02-b18
          speaker: witch
          text: No! Do not do that!
          emotion: fearful
        - id: ch02-b19
          speaker: narrator
          text: At once, the Soldier cut off her head, and that was the end of the Witch. He tied all his gold in her apron, slung the bundle over his shoulder, slipped the tinder-box into his pocket, and walked toward the town.
    - id: ch03
      title: Riches Lost and Found
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: It was a splendid town. The Soldier chose the finest inn, asked for its best room, and ordered his favorite dinner. With so much money, he was rich indeed.
        - id: ch03-b02
          speaker: narrator
          text: The servant who cleaned his boots thought they looked surprisingly old for such a wealthy gentleman. Of course, the Soldier had not yet bought new ones. By the next day, he had respectable boots and fine clothes. He no longer looked like an ordinary soldier. Now he looked like a noble lord.
        - id: ch03-b03
          speaker: narrator
          text: People told him about the grand sights of the town, the King, and the King's beautiful daughter.
        - id: ch03-b04
          speaker: soldier
          text: How can I see the Princess?
        - id: ch03-b05
          speakers: [townsman_1, townsman_2]
          ensemble: duo
          text: No one is allowed to see her!
        - id: ch03-b06
          speaker: townsman_1
          text: She lives in a huge copper castle with walls and towers all around it.
        - id: ch03-b07
          speaker: townsman_2
          text: Only the King may come and go. A prophecy says she will marry a common soldier, and the King will never allow that.
        - id: ch03-b08
          speaker: soldier
          text: I would very much like to see her.
        - id: ch03-b09
          speaker: narrator
          text: But there was no way to get permission. So the Soldier went on enjoying his new life. He visited the theater and rode through the King's garden. He also gave a great deal of money to the poor. That was kind of him. He knew from his own earlier days how hard life could be when a person did not have one farthing in the world.
        - id: ch03-b10
          speaker: narrator
          text: Now he was rich and dressed in fine clothes, so he made many friends. They all said he was an excellent man and a true nobleman. The Soldier liked that very much. But day after day, he spent more money and never earned any. At last, the day came when he had only two shillings left.
        - id: ch03-b11
          speaker: narrator
          text: He had to leave the beautiful rooms where he had been living. His new home was a tiny attic tucked under the roof. There was no servant there to help him. He cleaned his own boots and even patched them himself with a darning needle. None of his fine friends climbed up to visit. Suddenly, they all thought there were far too many stairs.
        - id: ch03-b12
          speaker: narrator
          text: One dark evening, he could not even afford a light. Then he remembered the scrap of tinder inside the box from the hollow tree. He found it and struck a spark. At once, the door flew open. The dog with saucer-sized eyes stood before him.
        - id: ch03-b13
          speaker: copper_dog
          text: What does my lord command?
        - id: ch03-b14
          speaker: soldier
          text: What is this? If this tinder-box can bring me whatever I want, then it is a marvelous thing. Dog, fetch me some money!
          emotion: surprised
        - id: ch03-b15
          speaker: narrator
          text: Away went the dog, and back he came with a great purse of money in his mouth.
        - id: ch03-b16
          speaker: narrator
          text: Now the Soldier understood the tinder-box. One strike summoned the dog from the copper chest. Two brought the dog from the silver chest. Three called the dog that guarded the gold. The Soldier moved back into his handsome rooms and dressed splendidly again. His friends recognized him at once and treated him with great respect.
    - id: ch04
      title: The Princess at Midnight
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One day, the Soldier began thinking about the Princess again.
        - id: ch04-b02
          speaker: soldier
          text: It is strange that no one can see her. Everyone says she is beautiful, but what good is that if she must sit forever in a copper castle full of towers? There must be some way for me to see her. Now, where is my tinder-box?
        - id: ch04-b03
          speaker: narrator
          text: He struck a spark, and the dog with eyes like saucers appeared.
        - id: ch04-b04
          speaker: soldier
          text: I know it is the middle of the night, but I would very much like to see the Princess, just for a moment.
        - id: ch04-b05
          speaker: narrator
          text: The dog was through the door before the Soldier could even turn around. A moment later, he came back with the Princess asleep on his broad back. She was so beautiful that anyone could see she was a real Princess. The Soldier looked at her and could not stop himself from kissing her. He was a thorough soldier, after all. As soon as that was done, the dog ran back to the copper castle with the sleeping Princess.
        - id: ch04-b06
          speaker: narrator
          text: In the morning, while the King and Queen drank tea, the Princess told them what had happened in her sleep.
        - id: ch04-b07
          speaker: princess
          text: I had such a strange dream last night. I rode on a dog's back, and a soldier kissed me.
          emotion: surprised
        - id: ch04-b08
          speaker: queen
          text: Well, that is quite a story.
        - id: ch04-b09
          speaker: narrator
          text: The Queen arranged for a lady-in-waiting to watch beside the Princess the following night. She meant to learn whether it was only a dream or something that had truly happened.
        - id: ch04-b10
          speaker: narrator
          text: The Soldier longed so much to see the Princess again that he sent for her that very night. The dog carried her away as fast as he could. Behind them came the lady-in-waiting in soft india-rubber shoes.
        - id: ch04-b11
          speaker: narrator
          text: She followed them to a large house and watched them disappear inside.
        - id: ch04-b12
          speaker: lady_in_waiting
          text: Now I know which house it is.
        - id: ch04-b13
          speaker: narrator
          text: She took a piece of chalk and drew a large cross on the door. Then she went home and lay down. The dog soon returned, carrying the Princess back to the castle. On his way out, he noticed the cross on the Soldier's door. So he found some chalk of his own and drew crosses on every door in town. That was clever of him. With the same mark everywhere, the lady-in-waiting could no longer pick out the right house.
        - id: ch04-b14
          speaker: narrator
          text: Early the next morning, the King, the Queen, the ladies-in-waiting, and the officers went searching for the place where the Princess had been.
        - id: ch04-b15
          speaker: king
          text: There it is!
        - id: ch04-b16
          speaker: queen
          text: No, my dear, there it is!
        - id: ch04-b17
          speakers: [townsman_1, townsman_2, townsman_3]
          ensemble: chorus
          text: But here is one cross, and there is another!
        - id: ch04-b18
          speaker: narrator
          text: Everywhere they looked, another cross appeared. The mark was no help at all.
    - id: ch05
      title: The Trail to the Soldier
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Queen was an extremely clever woman. She could do a great deal more than simply ride around in a coach. She took out her great golden scissors, cut a piece of silk, and sewed it into a pretty little bag. Then she filled the bag with the finest grains of buckwheat and tied it around the Princess's neck. Last of all, she cut a tiny hole in the silk. Wherever the Princess went, the grains would trickle out and mark the entire road behind her.
        - id: ch05-b02
          speaker: narrator
          text: That night, the dog came again. He carried the Princess to the Soldier, who was deeply in love with her. The Soldier wished he were a Prince, because then he might have married her.
        - id: ch05-b03
          speaker: narrator
          text: The dog never noticed the falling grain. It marked a trail all the way from the castle to the Soldier's window, where the dog climbed the wall with the Princess on his back.
        - id: ch05-b04
          speaker: narrator
          text: In the morning, the King and Queen could see exactly where their daughter had gone. They seized the Soldier and put him in prison.
        - id: ch05-b05
          speaker: narrator
          text: The prison was dark and dreary. There the Soldier sat while they told him his fate.
        - id: ch05-b06
          speakers: [townsman_1, townsman_2]
          ensemble: duo
          text: Tomorrow, you will be hanged.
        - id: ch05-b07
          speaker: narrator
          text: That news did nothing to cheer him. Worse still, his tinder-box was back at the inn.
        - id: ch05-b08
          speaker: narrator
          text: The next morning, he peered through the iron bars that covered his little window. Below him, people were hurrying out of town to watch him hang. He could hear the drums beating and see the soldiers marching through the streets. Everywhere he looked, people were rushing to and fro on their way to the scaffold.
        - id: ch05-b09
          speaker: narrator
          text: A shoemaker's apprentice skipped past below in his leather apron and shoes. He was going so merrily that one shoe flew off and struck the prison wall, right beside the Soldier's window.
        - id: ch05-b10
          speaker: soldier
          text: Ho there, shoemaker's boy! You needn't rush. Nothing can happen until I arrive. Run to the house where I used to live and bring me my tinder-box. I'll give you four shillings, but you must hurry as fast as you can.
        - id: ch05-b11
          speaker: narrator
          text: The boy was glad to earn four shillings. He fetched the tinder-box and gave it to the Soldier. And now, listen to what happened next.
    - id: ch06
      title: The Soldier Becomes King
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: A great scaffold had been built outside the town. Soldiers stood all around it, and hundreds of thousands of people crowded together to watch. The King and Queen were there too. They sat side by side on a magnificent throne, directly across from the judges and every member of the council.
        - id: ch06-b02
          speaker: narrator
          text: The Soldier was already standing at the top of the ladder. Just as they were about to slip the rope around his neck, he spoke up. Even a poor condemned criminal, he said, was always allowed one innocent request before receiving his punishment. His own request was small. He wanted to smoke one little pipe of tobacco, because it would be his last pipe in this world.
        - id: ch06-b03
          speaker: narrator
          text: The King could not deny him. The Soldier took out the tinder-box and struck it once, twice, three times.
        - id: ch06-b04
          speaker: narrator
          text: And there stood all three dogs. One had eyes as big as saucers, the second had eyes as large as mill-wheels, and the third had eyes as big as the Round Tower at Copenhagen.
        - id: ch06-b05
          speaker: soldier
          text: Help me! Do not let them hang me!
          emotion: fearful
        - id: ch06-b06
          speaker: narrator
          text: The dogs sprang upon the judges and the whole council. They caught some by the legs and some by the nose, then tossed them so high that they crashed down and were smashed to pieces.
        - id: ch06-b07
          speaker: king
          text: I will not stand for this!
          emotion: angry
        - id: ch06-b08
          speaker: narrator
          text: But the largest dog seized the King and the Queen and threw them after the others. The soldiers were frightened, and all the people cried out together.
        - id: ch06-b09
          speakers: [townsman_1, townsman_2, townsman_3]
          ensemble: chorus
          text: Good Soldier, you shall be our King, and you shall marry the beautiful Princess!
        - id: ch06-b10
          speaker: narrator
          text: They placed the Soldier in the King's coach. The three dogs danced in front of it.
        - id: ch06-b11
          speakers: [copper_dog, silver_dog, gold_dog]
          ensemble: chorus
          text: Hurrah! Hurrah!
        - id: ch06-b12
          speaker: narrator
          text: The boys whistled, and the soldiers presented arms as the coach went by.
        - id: ch06-b13
          speaker: narrator
          text: The Princess came out of the copper castle and became Queen, which pleased her very much.
        - id: ch06-b14
          speaker: narrator
          text: The wedding celebrations lasted eight days. The dogs sat at the table and made eyes at everyone.
