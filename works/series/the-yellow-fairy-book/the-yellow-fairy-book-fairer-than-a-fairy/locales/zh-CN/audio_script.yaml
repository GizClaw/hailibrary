audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    rainbow_prince:
      display_name: 彩虹王子
      tts:
        delivery: 温柔真挚，言语高贵而深情
        timbre: 清朗年轻
        pace: 适中
        pitch: 中音
    fairer_than_a_fairy:
      display_name: 美胜仙女
      tts:
        delivery: 温柔勇敢，历经磨难仍保有坚定与深情
        timbre: 明亮柔和
        pace: 适中
        pitch: 中高音
    third_fairy:
      display_name: 第三位仙女
      tts:
        delivery: 慈爱温和，话语里带着令人安心的笃定
        timbre: 温暖成熟
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 被仙女掳走的公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有位国王，成婚许多年，一直没有孩子。后来，上天终于赐给他一个女儿。小公主美得出奇，国王想来想去，觉得世上再没有更合适的名字，便叫她“美胜仙女”。
        - id: ch01-b02
          speaker: narrator
          text: 国王为人宽厚，根本没想到，这样一个狂妄的名字会招来全体仙女的憎恨与嫉妒。她们刚听说这件事，便发誓要把小公主抢走。就算不狠狠折磨她，也要把她藏到世人看不见的地方。
        - id: ch01-b03
          speaker: narrator
          text: 这件恶毒的差事落到了拉格丽头上。她是仙女中年纪最大的一个，老得只剩一只眼睛和一颗牙。每天夜里，这两样东西还得泡在强身药水中。偏偏她心肠最坏，仙女们想出的卑鄙勾当，她没有一样不肯做。
        - id: ch01-b04
          speaker: narrator
          text: 拉格丽活得够久，坏主意又多，轻而易举便掳走了才七岁的美胜仙女。小姑娘落在这个丑陋怪物手里，吓得几乎没了命。她们在地下走了一个钟头，来到一座华丽的宫殿，四周还有秀美的花园。眼前的景象不再那么可怕，公主又发现心爱的猫儿和狗儿也一路跟来，这才稍稍安心。
        - id: ch01-b05
          speaker: narrator
          text: 老仙女把她带进一间漂亮屋子，说这里以后归她住。接着，拉格丽厉声命令她，绝不能让壁炉里烧得正旺的火熄灭。她又交出两只玻璃瓶，要公主万分小心地看守。若敢违命，便要受到最可怕的惩罚。拉格丽撂下威胁就消失了。小姑娘一下轻松许多，觉得这两件差事并不难，便放心地去看宫殿和花园。
        - id: ch01-b06
          speaker: narrator
          text: 几年过去，公主习惯了孤单的日子。她始终遵守老仙女的命令，也渐渐忘了父王的宫廷。一天，她从花园的喷泉旁经过，看见阳光落在水面上，映出一道灿烂的彩虹，便停下脚步欣赏。就在这时，彩虹的光芒中央忽然传出一个年轻男子的声音，竟是在同她说话。那声音温柔悦耳，说的话也十分动人，叫人忍不住猜想，他本人一定同样迷人。可周围一个人影都没有，这也只能是猜想了。
        - id: ch01-b07
          speaker: rainbow_prince
          text: 我是一位王子。我的父王很有权势，可拉格丽怨恨我的父母，便施法夺走了我原来的形体，还把我困在这座宫殿里。起初，我觉得这里的每一天都很难熬。可是自从看见你，又爱上你以后，我再也不盼着离开了。
        - id: ch01-b08
          speaker: narrator
          text: 说完自己的遭遇，王子又讲了许多温柔的情话。美胜仙女从没听人这样向她倾诉，更没有受过这样的殷勤，心里既欢喜，又感动。可是王子只有化作彩虹时才能现身说话，所以非得等阳光照上水面，让光线汇成彩虹，两人才见得到彼此。
    - id: ch02
      title: 熄灭的炉火
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 美胜仙女不肯错过任何一次相会。两个人常常在喷泉旁谈上许久。有一天，他们聊得太入神，公主竟忘了照料炉火。等她想起来，火已经熄灭了。
        - id: ch02-b02
          speaker: narrator
          text: 拉格丽回来便发现了这件事。她正愁找不到机会折磨公主，立刻命她第二天一早去向洛克里诺讨火。那是个见谁吃谁的怪物，最喜欢抓年轻姑娘。公主温顺地领了命，连告别也来不及，便动身走向几乎必死的险境。
        - id: ch02-b03
          speaker: narrator
          text: 穿过树林时，一只鸟儿唱着歌，叫她从附近的泉水里捡起一颗亮石子，等需要时再用。公主照做了。到了洛克里诺家，幸好只有他的妻子在。那女人见她年纪轻轻，美丽又温和，已经很喜欢她。公主再送上亮石子，她更是心动。
        - id: ch02-b04
          speaker: narrator
          text: 洛克里诺的妻子爽快地给了她火，又收下发亮的石子，拿另一颗石头回赠，告诉她以后也许用得上。她没有伤害公主，反而让她平安离开。拉格丽见这趟凶险的差事竟有了好结果，又吃惊，又恼火。公主急着把自己的遭遇告诉王子，见面后才知道，庇护王子的亲族仙女早已把事情告诉了他。
        - id: ch02-b05
          speaker: narrator
          text: 王子害怕心上人再遇险，便想出了比花园喷泉更方便的相会办法。每天清晨，公主把一大盆水放到窗台上。阳光一照，彩虹便会清清楚楚地出现，就像从前在喷泉上空一样。这样，她不用离开房间，也能守住炉火和那两只玻璃瓶。瓶子里泡着的，正是拉格丽夜里取下的眼睛和牙齿。此后好一阵，只要天上有阳光，两位恋人便能相伴，享受每一个明亮的时辰。
        - id: ch02-b06
          speaker: narrator
          text: 可有一天，彩虹王子现身时悲痛欲绝。他刚刚得到消息，自己马上要被逐出这个可爱的地方，却连会被送往哪里也不知道。两个年轻人一想到即将分离，都陷入绝望。他们一直守到最后一线阳光消失，才依依不舍地分开，只盼第二天早晨还能见上一面。偏偏第二天阴暗昏沉，厚厚的云层遮住天空。直到傍晚时分，太阳才从云后短暂地露了脸。
        - id: ch02-b07
          speaker: narrator
          text: 美胜仙女急忙冲到窗边，却在慌乱中撞翻水盆，洒光了昨夜仔细盛好的水。屋里再也找不到别的水，只剩那两只玻璃瓶中的药水。这是分别前见到心上人的唯一机会，她没有丝毫迟疑，顾不得老仙女的威胁，打碎瓶子，把药水全倒进盆里。彩虹立刻现身。
        - id: ch02-b08
          speaker: rainbow_prince
          text: 无论要想多少办法，我都一定救你离开这里。等我们都恢复自由，你愿意嫁给我吗？
        - id: ch02-b09
          speaker: fairer_than_a_fairy
          text: 我绝不会嫁给别人。只要能再同你相聚，就算要我面对死亡，我也愿意。
        - id: ch02-b10
          speaker: narrator
          text: 两人柔情万般地诉说离别，王子的许诺炽热而真诚，公主的回答也毫不动摇。可告别的时间短得可怜。彩虹消失后，公主决定冒上一切风险，立即逃走。她没有带别的东西，身边只有猫儿、狗儿、一小枝桃金娘，还有洛克里诺妻子送的石头。
    - id: ch03
      title: 逃出拉格丽的追赶
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 拉格丽发现囚徒逃了，气得发狂，立刻全速追赶。公主早已累坏，那颗石头自行化成一座山洞，替她挡住外面的危险，让她躺下休息。拉格丽刚追到洞口，守护主人的小狗就扑上去狠狠咬她。她被咬得踉跄起来，一头撞上洞角，把仅剩的牙齿也磕断了。
        - id: ch03-b02
          speaker: narrator
          text: 趁拉格丽还在疼痛和愤怒中挣扎，公主逃出了很远。恐惧一时给了她力量，让她继续赶路，可她最终还是一步也走不动了，只得倒下休息。手中的桃金娘枝碰到地面，四周立刻长出一座绿荫浓密的凉亭。公主满心希望能在里面安安稳稳睡上一觉。她钻进去，很快便沉沉睡去。
        - id: ch03-b03
          speaker: narrator
          text: 拉格丽仍不肯放弃。她追到凉亭，以为这回一定能抓住公主。树枝上的猫儿却早已盯住她，猛地扑向她的脸，抓出了她唯一的眼睛。从此，美胜仙女再也不用受她迫害了。
        - id: ch03-b04
          speaker: narrator
          text: 可危险刚刚过去，公主便被饥饿和干渴压垮了。她觉得自己一定会死，费了好大力气，才拖着身子走到附近一幢绿白相间的漂亮小屋。一位同样穿着绿白衣裳的美丽夫人住在那里，屋里似乎再没有别人。她亲切地接待了几乎昏倒的公主，给她一顿丰盛的晚餐，又让她在舒适的床上安睡一夜。第二天，夫人告诉她，虽然前面还有许多磨难，她最终会得到想要的一切。
        - id: ch03-b05
          speaker: narrator
          text: 临别时，绿白衣夫人送给她一颗坚果，叮嘱她不到万分危急绝不能打开。公主走过一段漫长又疲惫的路，又来到一所一模一样的房子。第二位夫人也同前一位完全相像，待她同样亲切。这回的礼物不是坚果，而是一只金石榴，临行前也留下同样的叮嘱。
        - id: ch03-b06
          speaker: narrator
          text: 忧伤的公主拖着疲惫的脚步继续向前。一路经历许多艰难困苦后，她又在第三所相同的房子里得到休息和庇护。原来三位夫人是亲姐妹，都有仙术，心性和容貌也极其相似，所以希望自己的衣裳与房屋也样样相同。她们平日专门帮助落难的人，性情温柔仁慈，恰好与残酷恶毒的拉格丽完全相反。
        - id: ch03-b07
          speaker: narrator
          text: 第三位仙女安慰公主，请她不要灰心，还向她保证，这一路的磨难一定会得到回报。
        - id: ch03-b08
          speaker: third_fairy
          text: 收下这只水晶香水瓶吧。记住，只有到了万分危急的时候，才能把它打开。
          emotion: calm
        - id: ch03-b09
          speaker: narrator
          text: 公主热切地道了谢。美好的希望重新回到心里，她又踏上了旅途。
    - id: ch04
      title: 银城堡里的沉睡
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 后来，她走进一片微风轻柔、香气甜美的树林。还不到一百码，一座银城堡便出现在眼前。四条粗壮的银链把它悬在四棵大树之间。城堡吊得十分稳当，微风只会让它轻轻摇摆，恰好能把人摇入梦乡。
        - id: ch04-b02
          speaker: narrator
          text: 公主非常想进去看看，可城堡悬在离地不远的半空，四面又看不见门窗。她忽然认定，该打开第一位仙女送的坚果了。为什么呢？说真的，就连讲故事的人也猜不出来。坚果一打开，里面走出一个小得不得了的门房。他腰带上挂着一条细链，链子末端的金钥匙，只有你见过的最小别针一半长。
        - id: ch04-b03
          speaker: narrator
          text: 公主一手托住小门房，一边攀上银链。别看门房只有那么一点大，他还是用金钥匙开启一道暗门，让她进了城堡。里面是一座占满整座城堡的华丽大厅，天花板上的金星与宝石星辰照亮四周。大厅中央悬着一张雅致的睡榻，彩虹各种颜色的帷幔垂在周围。吊起睡榻的金绳随着城堡轻轻晃动，也把榻上的人舒舒服服地摇入沉睡。
        - id: ch04-b04
          speaker: narrator
          text: 彩虹王子正躺在那里，比从前更加俊美。他从消失那天起便陷在魔法的沉睡里。美胜仙女第一次见到他的真容，几乎不敢细看。她既怕这张脸配不上自己深爱的声音与谈吐，又因为他毫无反应，感到有些受伤。
        - id: ch04-b05
          speaker: narrator
          text: 公主高声讲起自己经历的每一场危险。她一连讲了二十遍，王子依旧沉睡，连一点回应也没有。于是，她打开金石榴。每一粒石榴籽都变成一把小提琴，飞上穹顶，奏起悦耳的乐曲。王子只是微微睁眼，那半醒的模样竟显得更加英俊。
        - id: ch04-b06
          speaker: narrator
          text: 王子迟迟认不出自己，公主又焦急，又不耐烦。她取出第三件礼物，打开水晶香水瓶。一条小海妖立刻飞了出来，先让所有小提琴停下，再贴着王子的耳朵唱起歌来。她把公主为寻找心上人而受过的所有苦难一一唱出，还在歌声中温柔地责怪了王子几句。她还没唱出多少，王子便完全醒了。他看到美胜仙女，欣喜若狂地扑倒在公主脚边。
        - id: ch04-b07
          speaker: narrator
          text: 就在同一刻，大厅四壁向外伸展，层层敞开，露出一张镶满宝石的黄金宝座。华丽的宫廷开始聚集，几辆精美的马车也驶到城堡，车里坐满了盛装贵妇。最富丽的第一辆车里，坐着彩虹王子的母亲。她深情地抱住儿子，随后告诉他，他的父亲已经去世多年，仙女们的怒气终于消散了。如今，他可以平安回国，统治那些盼望他归来的臣民。
    - id: ch05
      title: 彩虹国王与美胜仙女
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 朝廷欢声雷动，迎接新王。若在平日，这一切定能使他快乐。可他此刻满心只想着美胜仙女。他正要把公主介绍给母亲与众位廷臣，心里确信，她的美好一定能赢得所有人的喜爱。就在这时，三位绿白衣仙女忽然一同出现。
        - id: ch05-b02
          speaker: narrator
          text: 三姐妹当着众位廷臣的面，揭开了美胜仙女出身王室的秘密。王后随即让这对年轻的恋人与自己同乘马车，立刻一起向王国的都城出发。
        - id: ch05-b03
          speaker: narrator
          text: 他们一到都城，百姓便以震天动地的欢呼迎接。婚礼没有片刻耽搁，立刻举行了。此后的漫长岁月里，彩虹国王与美胜仙女王后的美德与美貌从来不曾消减，他们对彼此的深情也始终如初。
