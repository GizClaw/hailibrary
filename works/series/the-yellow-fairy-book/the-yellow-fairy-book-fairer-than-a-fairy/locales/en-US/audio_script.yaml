  chapters:
    - id: ch01
      title: The Princess and the Fairy
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a King who had been married for many years but had no children. At last, heaven granted him a daughter of such extraordinary beauty that only one name seemed worthy of her. He called her Fairer-than-a-Fairy.
        - id: ch01-b02
          speaker: narrator
          text: The good-natured King never imagined how that proud name would anger every fairy who heard it. They grew jealous of the child and decided to seize her. Then they would torment her, or at least hide her where no human eyes could see her.
        - id: ch01-b03
          speaker: narrator
          text: They gave the task to Lagree, the oldest fairy among them. She had only one eye and one tooth left, and each night she kept them in a special liquid to strengthen them. Lagree was so spiteful that she happily spent all her time carrying out the other fairies' meanest tricks.
        - id: ch01-b04
          speaker: narrator
          text: With all her experience and malice, Lagree had little trouble carrying off the Princess. Fairer-than-a-Fairy was only seven, and the sight of that hideous creature nearly frightened her to death. Lagree took her on a journey underground that lasted an hour. At the end of it stood a splendid palace surrounded by lovely gardens. The child felt a little safer there, especially when she discovered that her pet cat and dog had followed her all the way.
        - id: ch01-b05
          speaker: narrator
          text: Lagree took her to a pretty room and said it would be hers. A bright fire burned in the grate, and the old fairy gave her a strict command.
        - id: ch01-b06
          speaker: lagree
          text: Never let this fire go out. Guard these two glass bottles just as carefully. If you disobey me, you will be sorry.
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: After those dreadful threats, Lagree vanished. The little girl was free to explore the palace and its grounds, and she was relieved that her two duties seemed so easy.
        - id: ch01-b08
          speaker: narrator
          text: Several years went by. The Princess became used to her lonely life and always obeyed Lagree. Little by little, she even forgot the court of her father, the King.
    - id: ch02
      title: Prince Rainbow
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, the Princess passed a fountain in the garden. Sunlight struck the water and made a brilliant rainbow. She stopped to admire it. Then, to her amazement, a young man's voice spoke from the center of the shining colors.
        - id: ch02-b02
          speaker: narrator
          text: His voice was sweet, and the pleasant things he said made her imagine that the speaker must be just as charming. Still, that could only be a fancy of hers, because she could see no one at all inside the rainbow.
        - id: ch02-b03
          speaker: prince_rainbow
          text: I am a young prince, the son of a powerful king. Lagree held a grudge against my parents, so she took away my natural shape for several years and shut me inside this palace. At first, I could hardly bear my prison. But since I saw you and came to love you, I no longer wish to leave.
        - id: ch02-b04
          speaker: narrator
          text: Prince Rainbow said many more tender things. No one had ever spoken to the Princess that way before, and his attention pleased and touched her.
        - id: ch02-b05
          speaker: narrator
          text: The Prince could appear and speak only as a rainbow. Sunlight had to fall upon water before his colored rays could take shape. So Fairer-than-a-Fairy never wasted a moment when she could meet him. The two of them spent many long hours together, talking beside the fountain whenever the sun allowed it.
        - id: ch02-b06
          speaker: narrator
          text: One day, their talk held them so completely that time slipped away. The Princess forgot the fire, and it went out. Lagree noticed as soon as she returned. She was delighted to have a reason to punish her lovely prisoner.
        - id: ch02-b07
          speaker: lagree
          text: At dawn tomorrow, you will go to Locrinos. Bring back fire to light the one you neglected.
        - id: ch02-b08
          speaker: narrator
          text: Locrinos was a cruel monster who ate everyone he met, and he especially liked catching young girls. Fairer-than-a-Fairy obeyed without complaint. She could not even say farewell to Prince Rainbow before setting out toward what seemed like certain death.
        - id: ch02-b09
          speaker: narrator
          text: As she crossed a wood, a bird sang down to her.
        - id: ch02-b10
          speaker: bird
          text: There is a shining pebble in the fountain nearby. Pick it up, and use it when you need it.
        - id: ch02-b11
          speaker: narrator
          text: The Princess followed the bird's advice. In time, she reached Locrinos's house. Luckily, only his wife was home. The woman was struck by the girl's youth, beauty, and gentle manners, and the gift of the shining pebble impressed her even more.
        - id: ch02-b12
          speaker: narrator
          text: She willingly gave the Princess some fire. In exchange for the pebble, she handed her a different stone.
        - id: ch02-b13
          speaker: locrinos_wife
          text: Take this stone with you. It may be useful one day.
        - id: ch02-b14
          speaker: narrator
          text: Then Locrinos's wife sent her safely away without harming her.
    - id: ch03
      title: The Last Ray of Sunshine
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Lagree was both surprised and displeased when the Princess returned safely from such a dangerous errand. Fairer-than-a-Fairy waited anxiously for a chance to meet Prince Rainbow and tell him everything that had happened. But when they met again, he already knew the whole adventure. A fairy who was his relative and watched over him had brought him the news.
        - id: ch03-b02
          speaker: narrator
          text: The thought of further danger to his beloved Princess made the Prince plan a safer meeting place. Each morning, Fairer-than-a-Fairy set a large basin of water on her window ledge. As soon as sunlight touched the water, the Rainbow appeared as clearly as he had in the fountain.
        - id: ch03-b03
          speaker: narrator
          text: Now they could meet while she kept watch over the fire and the two bottles where Lagree stored her eye and tooth at night. For a time, the lovers spent every hour of sunshine together.
        - id: ch03-b04
          speaker: narrator
          text: Then one day, Prince Rainbow appeared overcome with sorrow. He had just learned that he would be banished from the palace, though he had no idea where he would be sent.
        - id: ch03-b05
          speaker: prince_rainbow
          text: They are sending me away from this place, and I do not even know where I am going.
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: The young couple were in despair. They stayed together until the last ray of sun disappeared, still hoping to meet the next morning. But the next day was dark and gloomy. Not until late afternoon did the sun break through the clouds, and then only for a few minutes.
        - id: ch03-b07
          speaker: narrator
          text: Fairer-than-a-Fairy hurried to the window and knocked over the basin. All the water she had prepared the night before spilled away. The only water left was inside Lagree's two bottles. This was her last chance to see her lover before they were separated. She broke the bottles and poured their liquid into the basin, and Prince Rainbow appeared at once.
        - id: ch03-b08
          speaker: narrator
          text: Their farewell was tender. The Prince vowed that he would do everything in his power to free her, and he begged her to marry him as soon as they were both at liberty.
        - id: ch03-b09
          speaker: prince_rainbow
          text: I will leave nothing undone until you are free. When we are both beyond Lagree's power, will you become my wife?
        - id: ch03-b10
          speaker: fairer_than_a_fairy
          text: I will marry no one else. I would face death itself to find you again.
        - id: ch03-b11
          speaker: narrator
          text: They had little time for more. The Rainbow vanished, and the Princess decided to risk everything. She fled at once with only her dog, her cat, a sprig of myrtle, and the stone from Locrinos's wife.
    - id: ch04
      title: Lagree's Pursuit
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When Lagree discovered that her prisoner had escaped, she flew into a fury and raced after her. She caught up just as the exhausted Princess lay down inside a cave. The magic stone had turned itself into that shelter for her.
        - id: ch04-b02
          speaker: narrator
          text: The little dog stood guard over his mistress. He sprang at Lagree and bit her so badly that she stumbled against the corner of the cave and broke off her only tooth. While pain and rage overwhelmed the old fairy, Fairer-than-a-Fairy escaped and put some distance between them.
        - id: ch04-b03
          speaker: narrator
          text: Fear kept the Princess moving for a while, but at last she could go no farther. As she sank down to rest, her sprig of myrtle touched the earth. At once, a cool green bower grew around her, and she hoped to sleep there in peace.
        - id: ch04-b04
          speaker: narrator
          text: Lagree had not abandoned the chase. She arrived just after Fairer-than-a-Fairy fell fast asleep and thought she had caught her victim at last. But the cat spotted her. It leaped from the branches, flew at Lagree's face, and tore out her only eye. The Princess was free of her persecutor forever.
        - id: ch04-b05
          speaker: narrator
          text: It might seem that everything should have been well then. Instead, Fairer-than-a-Fairy was overcome by hunger and thirst. She felt certain she would die and could barely drag herself to a pretty green-and-white house nearby.
        - id: ch04-b06
          speaker: narrator
          text: A beautiful lady met her there, dressed in green and white to match the house. She seemed to be its only inhabitant. The lady welcomed the fainting Princess with great kindness, served her an excellent supper, and gave her a delightful bed for the night.
        - id: ch04-b07
          speaker: first_sister
          text: You will face many more troubles, but in the end, you will reach the one you long for.
        - id: ch04-b08
          speaker: narrator
          text: As they parted, the green-and-white lady gave the Princess a nut with one warning.
        - id: ch04-b09
          speaker: first_sister
          text: Open this only when your need is truly urgent.
        - id: ch04-b10
          speaker: narrator
          text: After another long and tiring journey, Fairer-than-a-Fairy came to a second house. The lady who welcomed her looked exactly like the one she had left behind. Once again the Princess was given shelter, and once again she received a gift with the same warning. This lady gave her a golden pomegranate.
        - id: ch04-b11
          speaker: second_sister
          text: Keep this pomegranate closed until you are in urgent need.
        - id: ch04-b12
          speaker: narrator
          text: The sorrowful Princess had to leave that refuge and continue her weary way. She met many more troubles and hardships on the road. At last, she reached a third house exactly like the first two, where she once again found rest and shelter.
        - id: ch04-b13
          speaker: narrator
          text: The three houses belonged to three sisters with fairy gifts. The sisters were so alike in looks and nature that they wanted their homes and clothes to match as well. They spent their lives helping the unfortunate, and they were as gentle and generous as Lagree had been cruel and spiteful.
        - id: ch04-b14
          speaker: third_sister
          text: Do not lose heart. All these troubles will bring you their reward.
        - id: ch04-b15
          speaker: narrator
          text: The third sister gave her a crystal scent bottle and repeated the familiar warning.
        - id: ch04-b16
          speaker: third_sister
          text: Open this only in the greatest need.
        - id: ch04-b17
          speaker: narrator
          text: Fairer-than-a-Fairy thanked her warmly and set out again, cheered by more hopeful thoughts.
    - id: ch05
      title: The Silver Castle
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: In time, her road entered a wood filled with sweet scents and soft breezes. Before she had walked a hundred yards, she saw a wonderful silver castle hanging from four of the largest trees by strong silver chains. It was balanced so perfectly that the slightest breeze rocked it gently enough to send anyone inside to sleep.
        - id: ch05-b02
          speaker: narrator
          text: Fairer-than-a-Fairy longed to enter. But the castle hung above the ground, and she could see no doors or windows. For no clear reason, she felt sure that this was the moment to use the nut. She opened it.
        - id: ch05-b03
          speaker: narrator
          text: Out stepped a tiny hall porter. A little chain hung from his belt, and on its end was a golden key only half as long as the smallest pin.
        - id: ch05-b04
          speaker: narrator
          text: The Princess climbed one of the silver chains with the tiny porter in her hand. Small as he was, he unlocked a secret door with his golden key and let her inside.
        - id: ch05-b05
          speaker: narrator
          text: One magnificent room seemed to fill the whole castle. Golden stars set with jewels lit it from the ceiling. In the center hung an elegant couch on golden cords, with curtains in every color of the rainbow. Whenever the breeze rocked the castle, the couch swayed with it and gently rocked its occupant to sleep.
        - id: ch05-b06
          speaker: narrator
          text: Prince Rainbow lay on that beautiful couch. He looked lovelier than ever, but he was trapped in the deep sleep that had held him ever since he disappeared.
        - id: ch05-b07
          speaker: narrator
          text: This was the first time Fairer-than-a-Fairy had seen his true shape. She hardly dared look at him. What if his face did not match the voice and tender words that had won her heart? Yet when he showed no sign of waking, she also felt hurt by what seemed like indifference.
        - id: ch05-b08
          speaker: narrator
          text: She told him about every danger and hardship she had endured. She repeated the story twenty times in a loud, clear voice, but the Prince slept on without noticing her.
        - id: ch05-b09
          speaker: narrator
          text: Then she opened the golden pomegranate. Every seed inside became a tiny violin. They flew into the high roof and began to play a beautiful melody.
        - id: ch05-b10
          speaker: narrator
          text: The music did not wake the Prince completely. He only opened his eyes a little, which made him look handsomer still.
        - id: ch05-b11
          speaker: narrator
          text: Fairer-than-a-Fairy grew impatient when he still did not recognize her. She took out her final gift and opened the crystal scent bottle. A little siren flew free, silenced the violins, and sang close beside the Prince's ear.
        - id: ch05-b12
          speaker: narrator
          text: The siren's song told him everything his beloved had suffered while searching for him. It even gently reproached him for sleeping through her story. Before the song had gone far, Prince Rainbow was wide awake. Overjoyed, he threw himself at the Princess's feet.
    - id: ch06
      title: The Return of the King
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At that very moment, the walls spread apart and opened, revealing a golden throne covered in jewels. A magnificent court gathered around it. Elegant carriages arrived too, filled with splendidly dressed ladies. Prince Rainbow's mother sat in the first and finest carriage.
        - id: ch06-b02
          speaker: narrator
          text: She embraced her son with great affection. Then she gave him the news of his kingdom.
        - id: ch06-b03
          speaker: prince_mother
          text: Your father died several years ago. The fairies' anger has finally passed, and you may return in peace to rule. Your people have been longing for you.
        - id: ch06-b04
          speaker: narrator
          text: The court welcomed its new King with joyful cries. At any other time, such a welcome would have delighted him. Now every thought belonged to Fairer-than-a-Fairy. He was just about to present her to his mother and the assembled court. He felt sure that her goodness and beauty would win every heart. Before he could do so, the three green-and-white sisters appeared.
        - id: ch06-b05
          speaker: narrator
          text: The sisters revealed that Fairer-than-a-Fairy was a princess by birth. The Queen took both lovers into her carriage and set off with them for the capital.
        - id: ch06-b06
          speaker: narrator
          text: The city received them with tremendous joy. The people celebrated their return, and the wedding took place without delay.
        - id: ch06-b07
          speaker: narrator
          text: As the years passed, King Rainbow and Queen Fairer-than-a-Fairy never lost their virtue, their beauty, or their love for one another.
