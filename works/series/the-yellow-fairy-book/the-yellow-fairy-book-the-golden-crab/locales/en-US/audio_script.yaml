  chapters:
    - id: ch01
      title: The Golden Crab
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a fisherman who lived with his wife and their three children. Every morning he went out to fish, and he sold whatever he caught to the King. One day, a golden crab came up among the other fish. When the fisherman reached home, he laid the fish together in a great dish. But the crab shone so beautifully that he placed it by itself, high on a cupboard shelf.
        - id: ch01-b02
          speaker: narrator
          text: His wife began cleaning the fish. She had tucked up her gown, leaving her feet uncovered, when a little voice suddenly spoke from the cupboard.
        - id: ch01-b03
          speaker: prince
          text: Pull down your petticoat. Your feet are showing.
        - id: ch01-b04
          speaker: narrator
          text: The woman turned around in surprise and saw that the Golden Crab had spoken.
        - id: ch01-b05
          speaker: fisher_wife
          text: What? You can talk, you ridiculous crab?
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: She was not at all pleased by his remark. She took him down and put him on a dish. Later, when her husband came home and the family sat down to dinner, the Crab's small voice spoke again.
        - id: ch01-b07
          speaker: prince
          text: Please give me something to eat as well.
        - id: ch01-b08
          speaker: narrator
          text: Everyone stared, but they gave him a share. When the fisherman picked up the Crab's plate afterward, he found it filled with gold. The same thing happened day after day, and before long he had grown very fond of the Crab.
    - id: ch02
      title: The King's Impossible Tasks
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, the Crab spoke to the fisherman's wife.
        - id: ch02-b02
          speaker: prince
          text: Go to the King. Tell him I want to marry his younger daughter.
        - id: ch02-b03
          speaker: narrator
          text: The woman went to the palace and delivered the proposal. The King laughed a little at the thought of his daughter marrying a crab. Still, he did not refuse. He was a prudent king, and he suspected that the Crab might be a prince under a spell.
        - id: ch02-b04
          speaker: king
          text: Tell the Crab I will give him my daughter on one condition. By tomorrow morning, he must build a wall before my castle, far higher than my tower. Every flower in the world must grow and bloom upon it.
        - id: ch02-b05
          speaker: narrator
          text: The fisherman's wife carried the message home. The Crab handed her a golden rod.
        - id: ch02-b06
          speaker: prince
          text: Go to the place the King showed you. Strike the ground three times with this rod. Tomorrow morning, the wall will be there.
        - id: ch02-b07
          speaker: narrator
          text: The woman did exactly as he told her, then went away. When the King awoke the next morning, he saw the wall standing before him, just as he had demanded. It rose higher than his tower, covered with all the flowers of the world.
        - id: ch02-b08
          speaker: fisher_wife
          text: Your Majesty, everything you ordered has been done.
        - id: ch02-b09
          speaker: king
          text: That is very well, but I still cannot give him my daughter. First, there must be a garden before my palace with three fountains. One must spray gold, one diamonds, and one brilliant jewels.
        - id: ch02-b10
          speaker: narrator
          text: So the woman returned and struck the ground three more times with the rod. The next morning, the garden was there. At last the King consented, and the wedding was set for the following day.
    - id: ch03
      title: The Crab's Secret
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Then the Crab gave the golden rod to the old fisherman and told him of a certain mountain.
        - id: ch03-b02
          speaker: prince
          text: Knock on that mountain with the rod. A dark-skinned man will come out and ask what you want. Tell him, “Your master, the King, orders you to send his golden garment that shines like the sun.” Make him give you the queenly robes of gold and precious stones that look like flower-covered meadows, too. Then bring me both garments and the golden cushion.
        - id: ch03-b03
          speaker: narrator
          text: The fisherman went to the mountain and knocked as he had been told. The keeper came out.
        - id: ch03-b04
          speaker: mountain_keeper
          text: What do you want?
        - id: ch03-b05
          speaker: fisher
          text: Your master, the King, orders you to send his golden garment that shines like the sun. I must also take the queenly robes of gold and precious stones that look like flower-covered meadows, and the golden cushion.
        - id: ch03-b06
          speaker: narrator
          text: The keeper gave him everything, and the fisherman carried the treasures home. The Crab put on the golden garment and climbed onto the golden cushion. The fisherman bore him that way to the castle, and the Crab presented the other splendid garment to his bride.
        - id: ch03-b07
          speaker: narrator
          text: The wedding took place. When the newly married pair were alone, the Crab revealed his secret to the young Princess.
        - id: ch03-b08
          speaker: prince
          text: I am the son of the greatest king in the world. I live under an enchantment. By day I must be a crab, but at night I become a man. I can also take the shape of an eagle whenever I wish.
        - id: ch03-b09
          speaker: narrator
          text: As soon as he had spoken, he shook himself and became a handsome young man. But when morning came, he had to creep back into his crab shell. The same change happened every day.
        - id: ch03-b10
          speaker: narrator
          text: The royal family could not understand the Princess. She was affectionate toward the Crab and always treated him with careful courtesy. They knew there must be a secret. Yet however closely they watched, they could not discover it.
        - id: ch03-b11
          speaker: narrator
          text: A year passed, and the Princess had a son named Benjamin. Still, her mother thought the marriage very strange. At last she urged the King to ask whether their daughter would rather have another husband.
        - id: ch03-b12
          speaker: princess
          text: I married the Crab, and he is the only husband I will have.
        - id: ch03-b13
          speaker: king
          text: Then I will hold a tournament in your honor. I will invite every prince in the world. If one of them pleases you, you may marry him.
    - id: ch04
      title: The Tournaments
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: That evening, the Princess told the Crab what her father had said. He gave her the golden rod.
        - id: ch04-b02
          speaker: prince
          text: Go to the garden gate and knock with this. A dark-skinned man will come out and ask why you called him and what you need. Tell him, “Your master, the King, orders you to send his golden armor, his horse, and the silver apple.” Bring them all to me.
        - id: ch04-b03
          speaker: narrator
          text: The Princess did as he asked and returned with the armor, the horse, and the silver apple. On the following evening, the Prince prepared for the tournament. Before leaving, he warned his wife.
        - id: ch04-b04
          speaker: prince
          text: When you see me, do not tell anyone that I am the Crab. If you do, evil will follow. Stand at the window with your sisters. I will ride past and toss you the silver apple. Catch it, but if they ask who I am, say you do not know.
        - id: ch04-b05
          speaker: narrator
          text: He kissed her, warned her once more, and left. The Princess stood at the window with her sisters to watch the tournament. Soon her husband rode past and threw the silver apple up to her. She caught it and carried it to her room. Before long, her husband returned to her.
        - id: ch04-b06
          speaker: narrator
          text: The King was astonished that none of the princes seemed to interest his daughter, so he arranged a second tournament. The Crab gave his wife the same instructions as before. This time, the keeper gave her a golden apple. Before the Prince left, he spoke to her again.
        - id: ch04-b07
          speaker: prince
          text: I know you will betray me today.
        - id: ch04-b08
          speaker: princess
          text: I swear I will not tell anyone who you are.
        - id: ch04-b09
          speaker: narrator
          text: He repeated his warning and rode away. That evening, the Princess watched from the window with her mother and sisters. The Prince suddenly galloped past on his horse and tossed her the golden apple.
        - id: ch04-b10
          speaker: narrator
          text: The Queen flew into a rage and struck her daughter across the ear.
        - id: ch04-b11
          speaker: queen
          text: You foolish girl! Does even that prince fail to please you?
          emotion: angry
        - id: ch04-b12
          speaker: princess
          text: That prince is the Crab himself!
          emotion: fearful
        - id: ch04-b13
          speaker: narrator
          text: Now the Queen was angrier still because no one had told her sooner. She rushed into her daughter's room, found the empty crab shell, and threw it into the fire. The poor Princess wept bitterly, but nothing could undo what had happened. Her husband never came back.
    - id: ch05
      title: The Palace Below the Earth
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: For a while, we must leave the Princess and follow someone else. One day, an old man went to a stream with a crust of bread. Just as he bent down to dip it in the water, a dog leaped out, snatched the bread from his hand, and ran away.
        - id: ch05-b02
          speaker: narrator
          text: The old man chased the dog. It reached a door, pushed it open, and darted inside. He followed, but he could not catch it. Instead, he found himself at the top of a staircase. He went down the steps and saw a stately palace before him.
        - id: ch05-b03
          speaker: narrator
          text: Inside the palace was a great hall. A table had been laid for twelve people. The old man wanted to see what would happen, so he hid behind a large picture on the wall.
        - id: ch05-b04
          speaker: narrator
          text: At noon, a tremendous noise filled the hall, and the old man trembled. At last he found the courage to peer out. Twelve eagles were flying into the room, and the sight frightened him even more.
        - id: ch05-b05
          speaker: narrator
          text: The eagles flew to a stone fountain and bathed in its basin. All at once, they changed into twelve handsome young men. They took their places around the table. One youth lifted a cup of wine.
        - id: ch05-b06
          speaker: eagle_youth_1
          text: Let us drink to my father!
        - id: ch05-b07
          speaker: narrator
          text: Another youth raised his own cup.
        - id: ch05-b08
          speaker: eagle_youth_2
          text: And let us drink to my mother!
        - id: ch05-b09
          speaker: narrator
          text: The toasts continued around the table. Then one young man lifted his wine. It was the enchanted Prince.
        - id: ch05-b10
          speaker: prince
          text: A health to my dearest lady. May she live long and well! But a curse upon the cruel mother who burned my golden shell!
          emotion: sad
        - id: ch05-b11
          speaker: narrator
          text: The Prince wept bitterly. Then all twelve youths rose and returned to the great stone fountain. They became eagles once more and flew away.
        - id: ch05-b12
          speaker: narrator
          text: The old man left as well. He climbed back into the daylight and went home. Not long afterward, he heard that the Princess was ill, and only the telling of stories brought her any relief. So he went to the royal castle and was allowed to speak with her. He told her all he had seen in the underground palace.
        - id: ch05-b13
          speaker: princess
          text: Can you find the way back to that palace?
        - id: ch05-b14
          speaker: old_man
          text: Yes, I certainly can.
        - id: ch05-b15
          speaker: narrator
          text: The Princess asked him to lead her there at once.
    - id: ch06
      title: The Enchantment Ends
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The old man guided the Princess to the underground palace. In the great hall, he hid her behind the large picture and told her to remain perfectly still. Then he hid there beside her.
        - id: ch06-b02
          speaker: narrator
          text: Soon the twelve eagles flew in. They bathed in the fountain and became young men. The Princess recognized her husband among them at once. She tried to rush from her hiding place, but the old man held her back.
        - id: ch06-b03
          speaker: narrator
          text: The young men sat down at the table. The Prince picked up his cup of wine and spoke once more.
        - id: ch06-b04
          speaker: prince
          text: A health to my dearest lady. May she live long and well! But a curse upon the cruel mother who burned my golden shell!
          emotion: sad
        - id: ch06-b05
          speaker: narrator
          text: The Princess could hold herself back no longer. She ran forward and threw her arms around her husband. He knew her immediately.
        - id: ch06-b06
          speaker: prince
          text: Do you remember when I told you that you would betray me? Now you know I spoke the truth. But that unhappy time is over. Listen carefully. I must remain enchanted for three more months. Will you stay here with me until the spell ends?
        - id: ch06-b07
          speaker: princess
          text: I will stay with you. Go back to the castle and tell my parents that I am remaining here.
        - id: ch06-b08
          speaker: narrator
          text: The old man returned to the castle with her message. The King and Queen were deeply vexed when they heard it. But the Princess stayed beside her husband.
        - id: ch06-b09
          speaker: narrator
          text: Three months passed. When the Prince's enchantment ended, he was no longer forced to become an eagle. He was a man again, and he and the Princess returned home together.
        - id: ch06-b10
          speaker: narrator
          text: From then on, they lived happily. And we who have heard their story are happier still.
