audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, clear, and quietly cautionary
        timbre: gentle and resonant
        pace: measured
        pitch: medium
    youth:
      display_name: The Youth
      tts:
        delivery: bright, brave, and direct
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    swallow:
      display_name: The Swallow
      tts:
        delivery: quick, alert, and precise
        timbre: light and airy
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: The Castle Above the Glass
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there was a mountain made of glass. At its very top stood a castle of pure gold. In front of the castle grew an apple tree, and every apple on it was golden.
        - id: ch01-b02
          speaker: narrator
          text: Anyone who picked one of those apples could enter the castle. Inside, an enchanted Princess sat in a silver room. She was more beautiful than anyone could say, and she was just as rich. Precious stones filled the cellars. Great chests of the finest gold stood along the walls of every room.
        - id: ch01-b03
          speaker: narrator
          text: Knights came from far away to try their luck. They put sharp nails in their horses' shoes, but nothing helped. No rider could climb beyond the middle of the mountain. Horse and knight would slip and tumble all the way down that steep glass slope. Some men broke an arm or a leg. Many broke their necks.
        - id: ch01-b04
          speaker: narrator
          text: From her window, the Princess watched those bold knights urge their splendid horses upward. One glimpse of her gave them fresh courage. Men came from every quarter of the world, hoping to rescue her, but every attempt failed. For seven years, she waited for someone to reach the top.
        - id: ch01-b05
          speaker: narrator
          text: Around the foot of the mountain lay a heap of dead riders and horses. Wounded men groaned nearby, unable to move another step. The whole place looked like one vast churchyard.
        - id: ch01-b06
          speaker: narrator
          text: Three days before the seven years would end, a knight appeared in golden armor. He rode a spirited horse straight toward the deadly hill. He drove in his spurs and charged up the glass. Halfway to the top, he quietly turned his horse around and rode down again without one slip or stumble.
        - id: ch01-b07
          speaker: narrator
          text: The next day, he tried once more. His horse stepped across the glass as easily as level ground, and sparks flew from its hooves. The other knights stared. The golden rider was almost at the summit. In another moment, he would have reached the apple tree.
        - id: ch01-b08
          speaker: narrator
          text: Then a huge eagle rose before him. As it spread its mighty wings, one wing struck the horse in the eye. The frightened animal shied. Its nostrils opened wide, its mane flew, and it reared high into the air. Its hind feet slipped.
        - id: ch01-b09
          speaker: narrator
          text: Horse and rider crashed down the mountainside. Nothing remained of them but bones, rattling inside the battered golden armor like dry peas in a pod.
    - id: ch02
      title: The Boy with the Lynx Claws
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Only one day remained before the seven years were over. Then a mere schoolboy came to the mountain. He was merry and happy-hearted, but he was also strong and well grown. He saw how many knights had died for nothing. Even so, he walked to the steep slope and began to climb.
        - id: ch02-b02
          speaker: narrator
          text: For a long time, the boy had heard his parents talk about the beautiful Princess in the golden castle above the Glass Mountain. He listened to every story and decided to try his own luck. Before he came, he went into the forest and caught a lynx. He cut off its sharp claws and fastened them to his hands and feet.
        - id: ch02-b03
          speaker: narrator
          text: With those claws to help him, he started boldly up the mountain. But the sun was nearly down, and he had climbed no farther than halfway. He was so exhausted that he could hardly breathe. His mouth was dry with thirst.
        - id: ch02-b04
          speaker: narrator
          text: A huge black cloud passed above him. He begged it again and again to give him one drop of water. He opened his mouth and waited, but the cloud sailed on. Not even a drop of dew touched his dry lips.
        - id: ch02-b05
          speaker: narrator
          text: His feet were torn and bleeding. Soon he could hold on only with his hands. Evening closed around him. He strained his eyes toward the summit, trying to see it. Then he looked down.
        - id: ch02-b06
          speaker: narrator
          text: Far below was a yawning abyss, and certain death waited at the bottom. The half-decayed bodies of horses and riders lay there. Every other brave man who had tried this climb had met that same end.
        - id: ch02-b07
          speaker: narrator
          text: By then, the night was almost pitch-black. Only the stars shone on the Glass Mountain. The poor boy clung to it as though his bloodstained hands had been glued there. He had no strength left to climb. With no hope of rescue, he quietly waited for death.
        - id: ch02-b08
          speaker: narrator
          text: All at once, he fell into a deep sleep. He forgot the danger and slept sweetly against the glass. Yet the sharp claws on his hands were buried so firmly in the mountain that he could not fall.
    - id: ch03
      title: The Eagle and the Golden Apple Tree
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The eagle that had destroyed the golden knight and his horse guarded the golden apple tree. Every night, it flew around the Glass Mountain and kept watch. As soon as the moon came out from behind the clouds, the eagle left the tree and circled through the air. That was when it saw the sleeping boy.
        - id: ch03-b02
          speaker: narrator
          text: The bird was hungry for carrion. Certain that the boy was a fresh corpse, it swept down toward him. But the boy was awake now. The moment he saw the eagle, he knew the bird might be his one chance to escape.
        - id: ch03-b03
          speaker: narrator
          text: The eagle drove its sharp talons into the boy's tender flesh. He endured the pain without making a sound, then seized both of the bird's feet. Terrified, the eagle carried him high into the air and began circling the castle tower. The boy held on bravely.
        - id: ch03-b04
          speaker: narrator
          text: Below him, the palace glittered in the pale moonlight like a dim lamp. He saw its high windows. Around one window ran a balcony, and there sat the beautiful Princess, lost in sad thoughts.
        - id: ch03-b05
          speaker: narrator
          text: Then the boy saw that the eagle had carried him close to the apple tree. He pulled a small knife from his belt and cut off both the eagle's feet. In agony, the bird soared upward and disappeared into the clouds. The boy fell among the tree's broad branches.
        - id: ch03-b06
          speaker: narrator
          text: He pulled the eagle's severed claws from his flesh. Then he laid the peel of a golden apple over the wound. In a single moment, it was completely healed. He picked several more beautiful apples, put them in his pocket, and went toward the castle.
        - id: ch03-b07
          speaker: narrator
          text: A great dragon guarded the door. The boy threw one golden apple at it, and at once the beast vanished.
        - id: ch03-b08
          speaker: narrator
          text: At that same moment, a gate opened. Beyond it was a courtyard filled with flowers and lovely trees. The enchanted Princess sat on a balcony with all her attendants around her.
        - id: ch03-b09
          speaker: narrator
          text: As soon as she saw the boy, the Princess ran to meet him and welcomed him as her husband and master. She gave him all her treasure, and he became a rich and powerful ruler.
        - id: ch03-b10
          speaker: narrator
          text: But he never returned to the earth below. Only the mighty eagle, guardian of the Princess and the castle, could have carried so much treasure down from the mountain. The eagle had lost its feet, and it died. Its body was found in a wood on the Glass Mountain.
    - id: ch04
      title: The Wonder Below the Mountain
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One day, the youth was walking through the palace garden with the Princess, who was now his wife. He looked over the edge of the Glass Mountain. To his astonishment, he saw a great crowd gathered far below.
        - id: ch04-b02
          speaker: narrator
          text: He blew his silver whistle. The swallow who served as messenger in the golden castle flew past, and the youth called to the little bird.
        - id: ch04-b03
          speaker: youth
          text: Fly down there and find out what is happening.
        - id: ch04-b04
          speaker: narrator
          text: The swallow sped away like lightning. It soon returned with an answer.
        - id: ch04-b05
          speaker: swallow
          text: The eagle's blood has brought everyone below back to life. All who died on this mountain are waking today as if they had only been asleep. They are mounting their horses again, while all the people watch this unheard-of wonder with joy and amazement.
