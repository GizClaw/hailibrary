audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    youth:
      display_name: 少年
      tts:
        delivery: 开朗勇敢，声音虽年轻却坚定沉着
        timbre: 清亮有力
        pace: 适中
        pitch: 中高音
    swallow:
      display_name: 燕子
      tts:
        delivery: 机敏利落，禀报消息时清楚而兴奋
        timbre: 轻盈明亮
        pace: 稍快
        pitch: 高音
  chapters:
    - id: ch01
      title: 金城堡与七年之约
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一座玻璃山。山顶上立着一座纯金的城堡，城堡前还有一棵苹果树，结的全是金苹果。
        - id: ch01-b02
          speaker: narrator
          text: 只要摘下一只金苹果，就能走进城堡。那里有一间银屋，一位中了魔法的公主坐在屋中。她美得世间少有，也富得惊人。地窖里堆满宝石，每个房间的墙边都摆着大箱大箱最好的黄金。
        - id: ch01-b03
          speaker: narrator
          text: 许多骑士从远方赶来，都想试试运气。他们给马钉上尖利的蹄钉，可玻璃山又陡又滑。无论怎么冲，马儿到了半山腰就会倒退，连人带马一路摔到山脚。有人断了胳膊，有人折了腿，还有许多勇士摔断了脖子。
        - id: ch01-b04
          speaker: narrator
          text: 公主坐在窗前，看那些勇敢的骑士骑着骏马来救她。人们只要看见她，就会鼓起新的勇气。天下四方的骑士一个接一个地来了，却没有一个成功。公主就这样等了整整七年，盼着终于有人能爬上玻璃山。
        - id: ch01-b05
          speaker: narrator
          text: 山脚下堆着骑士和战马的尸骨。许多受了重伤的人也躺在那里呻吟，再走不动一步。附近看起来就像一片巨大的墓地。再过三天，七年之期就要结束了。这时候，一位穿着金甲的骑士骑着烈马，来到了山前。
        - id: ch01-b06
          speaker: narrator
          text: 金甲骑士用马刺猛催坐骑，一口气冲上半山腰。然后，他从容地拨转马头，又稳稳走了下来，马蹄一次也没滑。第二天，他再次向山顶冲去。马儿踩着玻璃，像走在平地上，蹄下不断飞出火星。
        - id: ch01-b07
          speaker: narrator
          text: 其余骑士看得目瞪口呆。金甲骑士已经快到山顶了，再向前一步，就能碰到苹果树。忽然，一只巨鹰腾空飞起。它展开强壮的翅膀，一下打中了马的眼睛。
        - id: ch01-b08
          speaker: narrator
          text: 烈马受了惊，张大鼻孔，猛甩鬃毛，整个身子高高立起。它的后蹄一滑，便驮着骑士从陡坡滚了下去。最后，人和马都只剩下骨头。那些骨头装在砸瘪的金甲里，哗啦哗啦响，就像豆荚里的干豌豆。
    - id: ch02
      title: 徒步登山的少年
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 七年之期只剩最后一天。山脚下又来了一个人，却不过是个上学年纪的少年。他快活开朗，身子长得结实高大。看到那么多骑士白白送命，他也没有害怕，而是走到山前，徒步向上攀登。
        - id: ch02-b02
          speaker: narrator
          text: 很早以前，少年就常听父母说起那位公主。她被困在玻璃山顶的金城堡里，等着有人去救。少年把这些话记在心里，决意也来碰碰运气。
        - id: ch02-b03
          speaker: narrator
          text: 动身前，他先到森林里捉住一只猞猁，割下它尖利的爪子，绑在自己的双手和双脚上。有了这些利爪，他便勇敢地爬上玻璃山。
        - id: ch02-b04
          speaker: narrator
          text: 太阳快落山时，少年才爬到半山腰。他累得几乎喘不过气，嘴唇也渴得干裂。一大片乌云从头顶飘过，他苦苦求它落下一滴水。少年张大嘴巴等着，可乌云径直飘走，连一滴露水也没给他留下。
        - id: ch02-b05
          speaker: narrator
          text: 少年的双脚已经磨破，鲜血直流。现在，他只能用双手攀住山壁。暮色越来越深，他抬起头，使劲寻找山顶。接着，他又向脚下望去。
        - id: ch02-b06
          speaker: narrator
          text: 下方是一道张着大口的深渊，掉下去必死无疑。谷底堆满骑士和战马半腐的尸体，散发着恶臭。原来，那些和他一样勇敢登山的人，全都死在了那里。
        - id: ch02-b07
          speaker: narrator
          text: 天几乎全黑了，玻璃山上只剩星光。可怜的少年仍挂在山壁上，血淋淋的双手像粘住了玻璃。他已经没有力气再爬，眼看活不下去了，便静静等待死亡。
        - id: ch02-b08
          speaker: narrator
          text: 可就在这时，他忽然沉沉睡去，连自己正悬在险处也忘了，竟睡得十分香甜。好在那些尖爪仍牢牢扎进玻璃。少年虽然睡着了，身子却挂得很稳，没有掉下去。
    - id: ch03
      title: 巨鹰带他飞上山顶
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 金苹果树由一只巨鹰看守。掀翻金甲骑士和战马的，正是它。每到夜里，巨鹰都会绕着玻璃山飞，仔细查看四周。月亮刚从云后露面，它就离开苹果树，飞到空中盘旋，很快发现了熟睡的少年。
        - id: ch03-b02
          speaker: narrator
          text: 巨鹰贪吃腐肉，以为那是一具刚死的尸首，便猛扑下来。少年这时醒了。他一看见巨鹰，心里立刻有了主意。也许这只鹰正能带他脱险。
        - id: ch03-b03
          speaker: narrator
          text: 巨鹰的利爪深深扎进少年的皮肉。他忍住剧痛，一声没出，双手死死抓住鹰的两只脚。巨鹰吓坏了，带着少年飞上高空，又绕着城堡的塔楼一圈圈盘旋。少年始终抓紧不放。
        - id: ch03-b04
          speaker: narrator
          text: 他看见宫殿闪着光。在淡淡的月色里，整座宫殿就像一盏朦胧的灯。他还看见一排高窗。其中一扇窗外有座阳台，美丽的公主正坐在那里，独自沉在哀伤的思绪里。
        - id: ch03-b05
          speaker: narrator
          text: 眼看苹果树已经很近，少年从腰带里拔出小刀，一下割断巨鹰的两只脚。巨鹰痛苦地冲向高空，消失在云层里。少年则掉在苹果树粗壮宽阔的枝杈上。
        - id: ch03-b06
          speaker: narrator
          text: 他拔掉留在自己肉里的鹰爪，又剥下一只金苹果的皮，贴住伤口。只过了一眨眼，伤口便完全愈合。他摘下几只漂亮的金苹果，装进口袋，朝城堡走去。
        - id: ch03-b07
          speaker: narrator
          text: 城堡门前守着一条巨龙。少年拿出一只苹果朝它扔去，那怪兽顿时消失了。与此同时，一道大门缓缓打开。门后是一座开满鲜花的庭院，里面长着美丽的树木。中了魔法的公主正带着侍从坐在阳台上。
    - id: ch04
      title: 玻璃山上的君主
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 公主一见少年，立刻跑来迎接，认他做自己的丈夫和主人。她把全部珍宝都交给了他。少年从此成了一位富有而强大的君主。
        - id: ch04-b02
          speaker: narrator
          text: 可是，少年再也没有回到山下的人间。那些财宝太多太重，只有强壮的巨鹰才能用翅膀把它们运下山。可巨鹰失去了双脚，不久便死了。后来，人们在玻璃山的一片树林里找到了它的尸体。
        - id: ch04-b03
          speaker: narrator
          text: 日子一天天过去。
    - id: ch05
      title: 山脚下的奇迹
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 有一天，少年和妻子公主在宫苑里散步。他从玻璃山边缘向下一看，惊讶地发现山脚聚集了许多人。少年吹响银哨，金城堡里负责送信的燕子马上飞了过来。
        - id: ch05-b02
          speaker: youth
          text: 你飞到山下去，替我问问那里出了什么事。
        - id: ch05-b03
          speaker: narrator
          text: 小燕子像闪电一样飞走了。没过多久，它便赶回来禀报消息。
        - id: ch05-b04
          speaker: swallow
          text: 巨鹰的血让山下所有人都活过来了！从前死在这座山上的人，今天全像睡醒了一样，一个个站起身，重新跨上战马。四周的百姓都在看着这个从没听说过的奇迹，他们又惊讶，又欢喜。
          emotion: surprised
