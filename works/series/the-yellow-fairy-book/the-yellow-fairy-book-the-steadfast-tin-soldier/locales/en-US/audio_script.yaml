  chapters:
    - id: ch01
      title: The One-Legged Soldier
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there were twenty-five tin soldiers, all brothers because they had been made from the same old tin spoon. They wore red and blue uniforms, carried their guns on their shoulders, and stared straight ahead. The first thing they heard when the lid came off their box was a little boy cheering and clapping. The soldiers were his birthday present, and he began setting them out on the table.
        - id: ch01-b02
          speaker: little_boy
          text: Hurrah for the tin soldiers!
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: Twenty-four looked exactly alike. The last soldier was different because the tin had run short before he was finished. He had only one leg. Even so, he stood as firmly on that one leg as all the others stood on two. This is the soldier who became famous.
        - id: ch01-b04
          speaker: narrator
          text: The table held many other toys. The finest was a little cardboard castle, with windows that showed the rooms inside. Tiny trees stood before it around a mirror that looked like a lake. Wax swans floated on the shining surface. Yet the loveliest sight was a little paper lady standing in the open doorway.
        - id: ch01-b05
          speaker: narrator
          text: She wore a dress of delicate muslin. A narrow blue ribbon lay around her shoulders, fastened with a glittering gold-paper rose as large as her head. She was a dancer, so she held both arms out and lifted one leg high in the air. The Tin Soldier could not see that leg at all. He thought she had only one, just like him.
        - id: ch01-b06
          speaker: tin_soldier
          text: She is the wife for me. But she is a grand lady who lives in a castle, while I share a box with twenty-four brothers. She could never live there. Still, I must find a way to meet her.
        - id: ch01-b07
          speaker: narrator
          text: He placed himself behind a snuffbox on the table. From there he could watch the graceful little Dancer. She stayed balanced on one toe without ever falling.
    - id: ch02
      title: The Toys at Midnight
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Night came. The people in the house went to bed, and the other tin soldiers were put back in their box. Then the toys began visiting one another, dancing, and fighting battles. The soldiers rattled inside their box because they wanted to join in, but they could not lift the lid.
        - id: ch02-b02
          speaker: narrator
          text: The nutcrackers played leapfrog. The slate pencil raced all over the slate. They made so much noise that the canary woke and began speaking to them in poetry. Only the Tin Soldier and the little Dancer stayed where they were. She stood on tiptoe with her arms spread wide. He stood firm on his single leg and never took his eyes from her face.
        - id: ch02-b03
          speaker: narrator
          text: At midnight the clock struck twelve. Crack! The lid of the snuffbox flew open. There was no snuff inside it. Up popped a little black imp instead.
        - id: ch02-b04
          speaker: black_imp
          text: Listen, Tin Soldier! Stop staring at someone who is far too grand for you.
        - id: ch02-b05
          speaker: narrator
          text: The Tin Soldier did not answer. He acted as though he had heard nothing.
        - id: ch02-b06
          speaker: black_imp
          text: Fine. Just wait until tomorrow!
        - id: ch02-b07
          speaker: narrator
          text: Morning came, and the children got up. Someone placed the Tin Soldier in the window. Perhaps the wind did what followed, or perhaps it was the black imp. No one knows. Suddenly the window flew open, and the soldier tumbled head over heels from the third floor.
        - id: ch02-b08
          speaker: narrator
          text: It was a dreadful fall. He struck the street headfirst, with his one leg pointing into the air and his gun jammed between two paving stones. The little boy and the nursery maid hurried downstairs to search. They came so close that they nearly stepped on him, yet neither of them saw him.
        - id: ch02-b09
          speaker: narrator
          text: He could have called out and told them where he was. Then they surely would have found him. But a soldier in uniform, he thought, should not cry for help. So he remained silent.
    - id: ch03
      title: The Paper Boat
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Soon a light rain began. The drops fell faster and faster until rain poured down. When the storm had passed, two street boys came along and spotted the Tin Soldier.
        - id: ch03-b02
          speaker: street_boy_one
          text: Look at this! A tin soldier! Let us send him sailing in a boat.
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: The boys folded a boat from a piece of newspaper, set the soldier inside, and launched it in the gutter. They ran beside him, clapping as he sailed away. The rainwater rose in great waves, and the current rushed along. The little paper boat pitched up and down. Soon it was moving so fast that the Tin Soldier trembled.
        - id: ch03-b04
          speaker: narrator
          text: Still, he showed no fear. He kept his gun on his shoulder, held himself steady, and looked straight ahead. Then the boat swept into a long tunnel beneath the street. It was as dark as the box where he had once lived.
        - id: ch03-b05
          speaker: tin_soldier
          text: Where am I going now? This must be the black imp's doing. If only the little lady were here beside me, I would not care if it grew twice as dark.
        - id: ch03-b06
          speaker: narrator
          text: A huge water rat who lived in the tunnel came rushing toward him.
        - id: ch03-b07
          speaker: water_rat
          text: Where is your passport? Show it to me at once!
        - id: ch03-b08
          speaker: narrator
          text: The Tin Soldier said nothing. He only tightened his grip on his gun. His boat raced onward while the rat chased behind. The creature bared his teeth and shouted at every chip of wood and piece of straw they passed.
        - id: ch03-b09
          speaker: water_rat
          text: Stop him! He has not paid the toll, and he refuses to show his passport!
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: The current grew faster and stronger. Ahead, the soldier could see daylight at the tunnel's end. But he also heard a terrible roar. The gutter emptied there into a wide canal. For someone as small as he was, the drop would be like a great waterfall.
        - id: ch03-b11
          speaker: narrator
          text: He was already too close to escape. The boat spun around three times, then four. Water poured in until it reached the brim, and the paper began to sink. The Tin Soldier stood as stiffly as he could. No one would ever say that he had flinched.
        - id: ch03-b12
          speaker: narrator
          text: The water climbed to his neck. The soggy paper softened as the boat sank deeper, and then the water closed over his head. He thought of the beautiful little Dancer whose face he believed he would never see again. Over and over, he seemed to hear the same words.
        - id: ch03-b13
          speaker: mysterious_voice
          text: Forward, forward, soldier bold! Death is waiting, grim and cold!
        - id: ch03-b14
          speaker: narrator
          text: The paper split in two, and the soldier dropped through the water. At that very moment, a great fish swallowed him.
    - id: ch04
      title: Inside the Fish
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: It was terribly dark inside the fish, darker even than the tunnel. There was hardly any room. The steadfast little Tin Soldier lay stretched out full length, still carrying his gun on his shoulder.
        - id: ch04-b02
          speaker: narrator
          text: The fish swam up and down. Then it twisted and thrashed in the most frightening way before suddenly becoming still. Something flashed like lightning. Daylight streamed in, and a voice cried out.
        - id: ch04-b03
          speaker: cook
          text: Why, the little Tin Soldier is inside this fish!
          emotion: surprised
        - id: ch04-b04
          speaker: narrator
          text: The fish had been caught and taken to market. Someone bought it and carried it to the kitchen. When the cook cut it open with her large knife, she found the soldier. She picked him up between finger and thumb and carried him into the other room. Everyone wanted to see the hero who had come out of a fish, but the Tin Soldier felt no pride.
        - id: ch04-b05
          speaker: narrator
          text: They set him on the table. What strange things happen in this world! He was back in the very room where his journey had begun. The same children were there, with the same toys and the same grand castle. In its doorway stood the beautiful little Dancer.
        - id: ch04-b06
          speaker: narrator
          text: She was still balanced on one leg, with the other raised high in the air. She was steadfast too. The sight touched the Tin Soldier so deeply that he nearly wept tin tears. But he did not think tears suited a soldier. He gazed at her, and she said nothing.
    - id: ch05
      title: The Heart in the Ashes
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Without warning, one of the little boys picked up the Tin Soldier and threw him into the stove. The boy gave no reason. Perhaps the black imp in the snuffbox was behind this as well.
        - id: ch05-b02
          speaker: narrator
          text: The Tin Soldier lay in the flames, feeling a terrible heat. He could not tell whether it came from the fire or from the strength of his love. All the color had vanished from his uniform. No one could say whether his travels or his sorrow had taken it away.
        - id: ch05-b03
          speaker: narrator
          text: He looked at the little lady, and she looked back at him. He could feel himself melting, but he remained steadfast with his gun upon his shoulder.
        - id: ch05-b04
          speaker: narrator
          text: Just then a door opened. The draft caught the little Dancer and lifted her from the table. Light as a spirit, she flew straight into the stove beside the Tin Soldier. The flames took her, and that was the end of the little Dancer.
        - id: ch05-b05
          speaker: narrator
          text: The Tin Soldier melted into a small lump of metal. The next morning, when the maid cleared away the ashes, she found that the lump had taken the shape of a heart.
        - id: ch05-b06
          speaker: narrator
          text: Nothing remained of the little Dancer except her golden rose, burned as black as a cinder.
