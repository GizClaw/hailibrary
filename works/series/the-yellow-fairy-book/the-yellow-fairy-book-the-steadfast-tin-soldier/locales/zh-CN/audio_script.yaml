audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的机智与克制, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    little_boy:
      display_name: 小男孩
      tts: {delivery: 天真活泼，兴奋时干脆响亮, timbre: 清脆明亮, pace: 稍快, pitch: 高音}
    tin_soldier:
      display_name: 锡兵
      tts: {delivery: 坚定克制，心声真挚而羞涩, timbre: 清朗结实, pace: 适中, pitch: 中音}
    imp:
      display_name: 黑色小妖怪
      tts: {delivery: 阴阳怪气，威吓中带着恶作剧般的尖刻, timbre: 尖细发紧, pace: 稍快, pitch: 中高音}
    street_boy:
      display_name: 街头男孩
      tts: {delivery: 顽皮冒失，发现新玩意时兴高采烈, timbre: 清亮稚嫩, pace: 快, pitch: 高音}
    water_rat:
      display_name: 水耗子
      tts: {delivery: 蛮横急躁，盘问时咄咄逼人, timbre: 粗涩尖利, pace: 快, pitch: 中高音}
    cook:
      display_name: 厨娘
      tts: {delivery: 爽利朴实，惊讶时直截了当, timbre: 明亮厚实, pace: 适中, pitch: 中音}
  chapters:
    - id: ch01
      title: 桌上的舞蹈家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有二十五个锡兵。他们全是用同一把旧锡勺铸成的，所以都是亲兄弟。每个锡兵都穿着红蓝军装，肩扛步枪，眼睛直望前方。盒盖一揭开，他们来到世上听见的第一句话，就是一个小男孩拍着手欢呼。
        - id: ch01-b02
          speaker: little_boy
          text: 锡兵万岁！
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: 那天正是小男孩的生日，锡兵是别人送给他的礼物。他立刻把他们一个个摆到桌上。二十五个兄弟的模样完全一样，只有最后铸成的那个不同。轮到他时，锡不够了，所以他只有一条腿。可他用一条腿站着，也和别的锡兵用两条腿一样稳。后来出了名的，正是这个锡兵。
        - id: ch01-b04
          speaker: narrator
          text: 桌上还有许多玩具。最精致的是一座纸板城堡，从一扇扇窗户望进去，连里面的房间也看得见。城堡前立着几棵小树，围住一面像湖水的小镜子。几只蜡天鹅浮在湖面，镜中还映着它们的影子。不过，最美的还是敞开的大门口那位纸做的小舞蹈家。她穿着最细的薄纱裙，肩头围着窄窄的蓝缎带。缎带中间别着一朵闪亮的金纸玫瑰，足有她的头那么大。
        - id: ch01-b05
          speaker: narrator
          text: 小舞蹈家伸开双臂，把一条腿高高抬在空中。锡兵怎么找也找不到那条腿，就以为她和自己一样，也只有一条腿。
        - id: ch01-b06
          speaker: tin_soldier
          text: 她正好可以做我的妻子！可是，她那么高贵，住的又是城堡。我只有一只盒子，还得跟二十四个兄弟挤在一起，她哪能住得惯？不过，我一定要认识她。
        - id: ch01-b07
          speaker: narrator
          text: 锡兵便躺到鼻烟盒后面，从那里悄悄望着娇小的舞蹈家。她一直单脚站着，始终没有失去平衡。到了夜里，屋里的人都上床睡了，别的锡兵也回了盒子。玩具们这才开始串门、跳舞、打仗。锡兵们也想出去，只能在盒中急得哐啷作响，怎么也顶不开盖子。胡桃夹子玩起跳背，石笔满石板乱跑。屋里闹得这样响，连金丝雀都被吵醒了，还开口念起诗来。
        - id: ch01-b08
          speaker: narrator
          text: 只有锡兵和小舞蹈家留在原处。她踮着脚，双臂伸展。他用一条腿坚定地站着，眼睛始终望着她。
    - id: ch02
      title: 从窗口到街沟
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 钟敲了十二下。啪的一声，鼻烟盒的盖子弹开了。里面没有鼻烟，只有一个黑色小妖怪，这正是盒子的奇妙之处。
        - id: ch02-b02
          speaker: imp
          text: 喂，锡兵！不该你看的东西，就别老盯着！
        - id: ch02-b03
          speaker: narrator
          text: 锡兵理也不理，仿佛没有听见。
        - id: ch02-b04
          speaker: imp
          text: 好啊，等到明天，你就知道厉害了！
        - id: ch02-b05
          speaker: narrator
          text: 第二天早晨，有人把锡兵放上窗台。究竟是风吹的，还是小妖怪作怪，我也不知道。窗户忽然打开，锡兵从三楼一头栽了下去。这一跤可真狠！他脑袋朝下落在地上，独腿竖在空中，步枪卡进两块铺路石之间。
        - id: ch02-b06
          speaker: narrator
          text: 女仆和小男孩立刻下楼寻找。他们离锡兵那么近，差一点就踩到他，却还是没有看见。只要他喊一声“我在这里”，他们准能找到。可他身上穿着军装，觉得出声呼救不合身份。不一会儿，天上飘起毛毛雨。雨点越落越快，最后成了倾盆大雨。雨停后，两个街头男孩走了过来。
        - id: ch02-b07
          speaker: street_boy
          text: 快看，这里有个锡兵！咱们给他做条船，让他来回航行！
          emotion: happy
        - id: ch02-b08
          speaker: narrator
          text: 两个孩子用报纸折成小船，把锡兵放进去，让他顺着街沟来回漂流。他们跟在岸边，一路拍手。沟里的浪真大，水也真急，纸船不停地上下颠簸。漂到水流中央时，船快得叫锡兵浑身发抖。可他仍旧坚定，半点声色也不露，绝不让人看出心里有一丝慌乱。他只管牢牢地扛稳步枪，直望前方。忽然，小船钻进一条长长的隧道，四周黑得就像他的盒子。
        - id: ch02-b09
          speaker: tin_soldier
          text: 我这是要到哪里去？唉，准是黑色小妖怪害的！要是那位小姑娘也坐在我身旁，这里就算再黑一倍，我也不怕。
    - id: ch03
      title: 黑暗的航程
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一只住在隧道里的大水耗子忽然蹿了出来。
        - id: ch03-b02
          speaker: water_rat
          text: 你的通行证呢？快拿出来！
        - id: ch03-b03
          speaker: narrator
          text: 锡兵一声不响，只把枪握得更紧。小船继续飞驰，水耗子紧追在后，龇着牙冲木片和稻草大叫。
        - id: ch03-b04
          speaker: water_rat
          text: 拦住他！快拦住他！他没交过路费，也没给我看通行证！
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: 水流越来越急，也越来越猛。锡兵已经能看见隧道尽头的亮光，可耳边那阵轰鸣足以吓坏任何勇敢的人。你想想看，街沟的水到了隧道尽头，就会直泻进一条大运河。对锡兵来说，这和我们从瀑布上冲下去一样危险。
        - id: ch03-b06
          speaker: narrator
          text: 他离出口越来越近，再也稳不住小船，只能随着水势往前冲。可怜的锡兵竭力把身体挺直，决不能让人日后说他临阵退缩。船猛转了三四圈，水一直灌到船沿，纸也越泡越软。船开始下沉，越沉越深。水先淹到他的脖子，接着又没过头顶。锡兵想着那位美丽的舞蹈家，知道自己再也见不到她的脸了。耳边反复响着两句歌。
        - id: ch03-b07
          speaker: narrator
          text: 向前，向前，勇敢的兵！死亡在前，冷酷无情！
        - id: ch03-b08
          speaker: narrator
          text: 纸船裂成两半，锡兵掉进水里。就在那一刻，一条大鱼把他吞了下去。鱼肚子比隧道更黑，还挤得厉害。坚定的小锡兵只能直挺挺地躺着，枪依旧扛在肩头。
        - id: ch03-b09
          speaker: narrator
          text: 大鱼一会儿游上，一会儿游下，随后猛烈地扭动起来，样子可怕极了。接着，它突然一动不动。锡兵仿佛看见一道闪电从鱼身上掠过，日光一下照进鱼腹。原来，大鱼已经被人捉住，送到市场卖掉，又带进了厨房。厨娘用一把大刀剖开鱼腹，惊叫起来。
        - id: ch03-b10
          speaker: cook
          text: 咦，小锡兵在这里！
          emotion: surprised
    - id: ch04
      title: 一颗锡做的心
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 厨娘用拇指和食指拈起锡兵，把他带进房间。人人都想看看这个从鱼肚子里找出来的英雄，可他一点也不骄傲。等人们把他放上桌，怪事发生了。他竟回到原来待过的房间，眼前还是同样的孩子，桌上还是同样的玩具，还有那座华丽的城堡。
        - id: ch04-b02
          speaker: narrator
          text: 美丽的小舞蹈家也在那里，仍然一条腿站立，另一条腿高高举起。她和锡兵一样坚定。锡兵感动得差点掉下锡做的眼泪，可军人不该落泪。他只是望着她，她也一句话没说。
        - id: ch04-b03
          speaker: narrator
          text: 忽然，一个小男孩抓起锡兵，什么理由也没说，就把他扔进火炉。想来，这又是鼻烟盒里的黑色小妖怪在捣鬼。
        - id: ch04-b04
          speaker: narrator
          text: 锡兵躺在火炉里，只觉得热得可怕。他不知道灼烧自己的是炉火，还是爱情的炽热。他身上的颜色已经全褪了。究竟是一路漂泊让他变了色，还是满心忧伤，谁也说不清。他望着小舞蹈家，小舞蹈家也望着他。锡兵觉得自己正在熔化，却仍坚定地站着，步枪还扛在肩上。
        - id: ch04-b05
          speaker: narrator
          text: 一扇门突然打开，穿堂风卷起小舞蹈家。她像轻盈的风精一样，飞向火炉里的锡兵，霎时燃起火焰。她就这样结束了。锡兵也熔成小小的一团。
        - id: ch04-b06
          speaker: narrator
          text: 第二天早晨，女仆清理炉灰，发现锡兵已经变成一颗心的形状。小舞蹈家只剩下那朵镀金的玫瑰，烧得像煤渣一样乌黑。
