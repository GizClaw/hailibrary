  chapters:
    - id: ch01
      title: The Giants' Wedding
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a poor boy with neither father nor mother. He earned his living by tending the sheep of a great lord. He stayed with the flock in the open fields by day and by night. Only when the weather turned very wet and stormy did he shelter in a little hut at the edge of a great forest.
        - id: ch01-b02
          speaker: narrator
          text: One night, as he sat on the grass beside his sheep, he heard someone crying nearby. He got up and followed the sound. At the entrance to the wood, he was dismayed to find a Giant lying on the ground. The Herd-boy was about to run as fast as he could when the Giant called to him.
        - id: ch01-b03
          speaker: wounded_giant
          text: Don't be frightened. I won't hurt you. If you'll bind up my foot, I'll reward you well. I injured it while I was trying to pull an oak tree out by the roots.
        - id: ch01-b04
          speaker: narrator
          text: The Herd-boy took off his shirt and wrapped it around the Giant's wounded foot. The Giant stood up and spoke again.
        - id: ch01-b05
          speaker: wounded_giant
          text: Come with me now, and I'll give you your reward. We're celebrating a wedding today, and there'll be plenty of fun. You can enjoy it with us. But my brothers mustn't see you, so fasten this belt around your waist. It will make you invisible.
        - id: ch01-b06
          speaker: narrator
          text: He handed the boy a belt, then led him to a fountain. Hundreds of Giants and Giantesses had gathered there for the wedding. They danced and played games until midnight. Then one Giant tore up a plant by its roots. All the wedding guests made themselves so thin that they slipped through the hole and vanished into the earth.
        - id: ch01-b07
          speaker: narrator
          text: The wounded Giant waited until everyone else had gone. Then he called out.
        - id: ch01-b08
          speaker: wounded_giant
          text: Herd-boy, where are you?
        - id: ch01-b09
          speaker: herd_boy
          text: I'm right here beside you.
        - id: ch01-b10
          speaker: wounded_giant
          text: Touch me, and you'll come underground with us.
        - id: ch01-b11
          speaker: narrator
          text: The boy did as he was told. Before he could imagine such a thing was possible, he found himself in a huge hall with walls of pure gold. To his amazement, the tables and chairs inside belonged to his master. Within minutes, all the company began to eat and drink.
    - id: ch02
      title: The Magic Loaf
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: It was a magnificent feast, and the hungry young Herd-boy ate and drank heartily. Once he had taken all he could manage, a thought came to him. Why not slip a loaf of bread into his pocket? He would be glad to have it the next day. When no one was watching, he seized a loaf and tucked it under his tunic.
        - id: ch02-b02
          speaker: narrator
          text: No sooner had he hidden it than the wounded Giant limped over and whispered to him.
        - id: ch02-b03
          speaker: wounded_giant
          text: Herd-boy, where are you?
        - id: ch02-b04
          speaker: herd_boy
          text: Here I am.
        - id: ch02-b05
          speaker: wounded_giant
          text: Hold on to me, and I'll take you back above ground.
        - id: ch02-b06
          speaker: narrator
          text: The Herd-boy held fast to the Giant. A few moments later, he was standing on the earth again, but the Giant had disappeared. He went back to his sheep, took off the invisible belt, and carefully hid it in his bag.
        - id: ch02-b07
          speaker: narrator
          text: The boy was hungry the next morning. He took out the loaf from the wedding feast and tried to cut himself a piece. Though he used all his strength, he could not cut off so much as a crumb. In despair, he bit into it. To his astonishment, a piece of gold dropped from his mouth and rolled to his feet.
        - id: ch02-b08
          speaker: narrator
          text: He bit the loaf a second time, then a third. Each time, another piece of gold fell from his mouth, while the bread remained whole. The Herd-boy was overjoyed by his good fortune. He hid the magic loaf in his bag, hurried to the nearest village to buy food, and then returned to his flock.
    - id: ch03
      title: Seven Bags of Gold
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The lord who owned the sheep had a beautiful daughter. Whenever she walked through the fields with her father, she smiled and nodded to the Herd-boy. For a long time, the boy had planned to surprise her on her birthday. As the day drew near, he put on the invisible belt and filled a sack with gold pieces. In the middle of the night, he slipped into her room, left the sack beside her bed, and went back to his sheep.
        - id: ch03-b02
          speaker: narrator
          text: The girl was delighted when she found it the next morning, and so were her parents. The Herd-boy was so pleased that he had made them happy that he brought another sack of gold the following night. He did the same thing for seven nights. The girl and her parents became certain that a good Fairy must be leaving the gold. At last they decided to hide and watch, so they could discover who truly brought it.
        - id: ch03-b03
          speaker: narrator
          text: On the eighth night, a fearful storm of wind and rain broke over the Herd-boy as he carried another sack toward the house. Only when he reached his master's door did he notice that he had forgotten the invisible belt. He did not want to walk all the way back to his hut through the wind and wet. So he entered the girl's room as he was, set the sack beside her, and turned to leave.
        - id: ch03-b04
          speaker: narrator
          text: His master stepped out and confronted him.
        - id: ch03-b05
          speaker: lord
          text: So it was you, you young rogue! You were going to steal the gold that a good Fairy brings here every night.
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: The accusation startled the Herd-boy so badly that he stood trembling before his master. He did not dare explain why he was there. The lord spoke again.
        - id: ch03-b07
          speaker: lord
          text: Until now, you've always served me well, so I won't send you to prison. But you must leave your place at once, and I never want to see your face again.
    - id: ch04
      title: The Herd-boy Returns
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Herd-boy returned to his hut. He gathered up the magic loaf and the invisible belt, then went to the nearest town. There he bought fine clothes and a beautiful coach drawn by four horses. He hired two servants as well, and drove back to his former master.
        - id: ch04-b02
          speaker: narrator
          text: The lord could hardly believe his eyes when the Herd-boy returned in such splendor, wearing the fine clothes he had bought. The young man told him about the wounded Giant, the underground wedding, the invisible belt, and the loaf that gave him gold. Then he asked to marry the lord's beautiful daughter. The lord readily gave his consent.
        - id: ch04-b03
          speaker: narrator
          text: And the Herd-boy and the lord's daughter lived together in peace and happiness for the rest of their lives.
