  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, clear, and quietly cautionary
        timbre: gentle and resonant
        pace: measured
        pitch: medium
    herd_boy:
      display_name: The Herd-boy
      tts:
        delivery: humble, warm-hearted, and sincere
        timbre: clear and youthful
        pace: moderate
        pitch: medium
    wounded_giant:
      display_name: The Wounded Giant
      tts:
        delivery: booming but friendly, with grateful good humor
        timbre: deep and broad
