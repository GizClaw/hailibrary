audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    herd_boy:
      display_name: 牧童
      tts:
        delivery: 朴实善良，惊讶时仍带着少年人的真诚
        timbre: 清朗年轻
        pace: 适中
        pitch: 中音
    wounded_giant:
      display_name: 受伤的巨人
      tts:
        delivery: 粗犷豪爽，对恩人亲切而守信
        timbre: 浑厚低沉
        pace: 稍缓
        pitch: 低音
    lord:
      display_name: 领主
      tts:
        delivery: 威严直接，误会时严厉，明白真相后爽快
        timbre: 厚重清晰
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 受伤的巨人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个无父无母的穷孩子，靠替一位大领主放羊过日子。他白天黑夜都守在田野里，只有碰上狂风暴雨，才躲进大森林边的小屋。
        - id: ch01-b02
          speaker: narrator
          text: 一天夜里，牧童坐在羊群旁，听见不远处有人哭。他循着声音找过去，竟看到一个巨人倒在树林入口。牧童吓得转身就跑，巨人赶紧叫住他。
        - id: ch01-b03
          speaker: wounded_giant
          text: 别怕，我不会伤你。你若肯替我把脚包好，我一定重重谢你。我刚才拔一棵橡树，伤着脚了。
        - id: ch01-b04
          speaker: narrator
          text: 牧童脱下衬衫，裹住巨人受伤的脚。巨人站起来，要带他去领谢礼。
        - id: ch01-b05
          speaker: wounded_giant
          text: 跟我来吧。我们今天要办婚礼，可热闹了，你也去好好玩一场。不过，不能让我的兄弟们看见你。把这条带子系在腰上，你就能隐身。
        - id: ch01-b06
          speaker: narrator
          text: 巨人把腰带交给牧童，走在前面，领他来到一眼泉水旁。几百个巨人和女巨人聚在那里，正准备举行婚礼。大家跳舞，又玩了各种游戏，一直热热闹闹地闹到半夜。
        - id: ch01-b07
          speaker: narrator
          text: 一个巨人连根拔起一株植物。所有巨人都把身子变得细细的，从地上的洞口钻了下去。受伤的巨人留到最后，朝牧童喊了一声。
        - id: ch01-b08
          speaker: wounded_giant
          text: 牧童，你在哪儿？
        - id: ch01-b09
          speaker: herd_boy
          text: 我就在你旁边。
        - id: ch01-b10
          speaker: wounded_giant
          text: 那就碰着我，你也能跟我们一起到地下去。
        - id: ch01-b11
          speaker: narrator
          text: 牧童照他说的做了。他还来不及弄明白怎么回事，便已站在一座大厅里，连墙壁都是纯金的。更让他吃惊的是，厅里的桌椅全都属于他的主人。没过多久，众人便开席了。
    - id: ch02
      title: 咬不完的面包
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 宴席豪华极了。牧童放开肚子吃喝，直到一点也装不下。他望着桌上的面包，心里有了主意。
        - id: ch02-b02
          speaker: herd_boy
          text: 我何不藏一条面包带走？留到明天，正好可以填肚子。
        - id: ch02-b03
          speaker: narrator
          text: 他趁人不注意，抓起一条面包，塞进短上衣底下。刚藏好，受伤的巨人便一瘸一拐地走来，压低了声音。
        - id: ch02-b04
          speaker: wounded_giant
          text: 牧童，你在哪里？
        - id: ch02-b05
          speaker: herd_boy
          text: 我在这儿。
        - id: ch02-b06
          speaker: wounded_giant
          text: 抓住我吧，我带你回地面上去。
        - id: ch02-b07
          speaker: narrator
          text: 牧童抓紧巨人，转眼又回到了地面。巨人不见了。他回到羊群旁，解下隐身腰带，小心收进袋子。
        - id: ch02-b08
          speaker: narrator
          text: 第二天一早，牧童饿了，想从巨人婚宴上带回来的面包上切一块吃。可他用尽力气，连最小的一片也切不动。没办法，他只好用牙咬。谁知一块金子从嘴里掉出来，滚到了脚边。他惊讶得几乎不敢相信自己的眼睛。
        - id: ch02-b09
          speaker: narrator
          text: 他又咬两口，每一口都掉出一块金子，面包却还是完整的。牧童高兴坏了，赶紧把魔法面包收好，跑到最近的村庄买些吃的，然后回来继续放羊。
    - id: ch03
      title: 七夜的礼物
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那位领主有个非常美丽的女儿。她陪父亲走过田野时，总会对牧童微笑点头。牧童早就想在姑娘生日那天，送她一份惊喜。
        - id: ch03-b02
          speaker: narrator
          text: 生日快到了。一天半夜，牧童系好隐身腰带，带着一袋金币溜进姑娘的房间，把金子放在床边，又悄悄回去看守羊群。
        - id: ch03-b03
          speaker: narrator
          text: 第二天，姑娘在床边发现满满一袋金币，她和父母都欢喜极了。牧童想到自己的礼物给姑娘带来这么大的快乐，心里也十分满足。到了第二夜，他又悄悄走进房间，送来一袋金币。
        - id: ch03-b04
          speaker: narrator
          text: 就这样，他一连送了七个夜晚。姑娘和父母认定，每夜送来金子的准是一位善良的仙女。不过，他们还是决定躲起来守候，亲眼看看送金子的人究竟是谁。
    - id: ch04
      title: 第八个风雨之夜
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第八天夜里，牧童又带着一袋金币上路。半道上狂风大作，暴雨倾盆。直到赶到主人的宅子，他才发现自己忘带隐身腰带了。
        - id: ch04-b02
          speaker: narrator
          text: 牧童不愿冒着风雨折回小屋，就直接走进姑娘的房间，把金币放到她身边。可他刚要离开，主人便从藏身处出来，挡住了去路。
        - id: ch04-b03
          speaker: lord
          text: 好个小无赖！每夜都有善良的仙女送来金币，你竟想把它们偷走，是不是？
        - id: ch04-b04
          speaker: narrator
          text: 牧童惊得呆住了，只会站在那里发抖，根本不敢解释自己为何会来。领主又开了口。
        - id: ch04-b05
          speaker: lord
          text: 你过去替我做事，一向还算规矩，我就不送你去坐牢。现在立刻离开，以后再也别让我看见你。
        - id: ch04-b06
          speaker: narrator
          text: 牧童回到小屋，带上魔法面包和隐身腰带，去了最近的城镇。他买来漂亮衣裳，又置办一辆华美的马车，套上四匹马，还雇了两个仆人。随后，他坐着马车回去见领主。
        - id: ch04-b07
          speaker: narrator
          text: 你可以想象，领主看见从前的牧童这样气派地回来，该有多么惊讶。年轻人把落到自己身上的奇遇和好运，从头到尾全都告诉了他，又请求娶他美丽的女儿。领主听完，爽快地答应了。
        - id: ch04-b08
          speaker: narrator
          text: 从此，牧童和姑娘平安幸福地生活在一起，直到生命尽头。
