audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与温情
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    father_king:
      display_name: 父王
      tts:
        delivery: 威严正直，困境中带着忧虑
        timbre: 浑厚稳重
        pace: 从容
        pitch: 中低音
    witch:
      display_name: 老女巫
      tts:
        delivery: 老练阴沉，说话胸有成竹
        timbre: 苍老沙哑
        pace: 缓慢
        pitch: 低音
    sister:
      display_name: 公主
      tts:
        delivery: 温柔坚定，历经苦难仍保持端庄
        timbre: 清澈柔和
        pace: 稍缓
        pitch: 中高音
    brother_1:
      display_name: 大哥
      tts:
        delivery: 关切谨慎，语气沉着
        timbre: 清朗稳重
        pace: 适中
        pitch: 中音
    brother_2:
      display_name: 二哥
      tts:
        delivery: 真诚关切，带着无奈
        timbre: 明亮温和
        pace: 适中
        pitch: 中音
    brother_3:
      display_name: 三哥
      tts:
        delivery: 直率克制，心疼妹妹
        timbre: 清亮
        pace: 适中
        pitch: 中高音
    brother_4:
      display_name: 四哥
      tts:
        delivery: 温和忧郁，语气诚恳
        timbre: 柔和
        pace: 稍缓
        pitch: 中音
    hunter_1:
      display_name: 猎人甲
      tts:
        delivery: 警觉直接，问话清楚
        timbre: 粗犷明亮
        pace: 适中
        pitch: 中音
    hunter_2:
      display_name: 猎人乙
      tts:
        delivery: 直率和缓，带着劝说意味
        timbre: 坚实温和
        pace: 适中
        pitch: 中低音
    country_king:
      display_name: 年轻国王
      tts:
        delivery: 坦率温厚，关键时刻庄重坚定
        timbre: 清朗醇厚
        pace: 从容
        pitch: 中音
    queen_mother:
      display_name: 王太后
      tts:
        delivery: 冷硬刻薄，怀疑中透着恶意
        timbre: 尖冷低沉
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 森林里的婚约
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有位国王在一片大森林里打猎。他只顾追赶野兽，把所有随从都远远甩在了后面。等到傍晚，他停下来四下一看，才发现自己彻底迷了路。无论往哪里走，都找不到出去的方向。这时，一个脑袋颤巍巍的老妇人迎面走来。国王并不知道，她其实是个女巫。
        - id: ch01-b02
          speaker: father_king
          text: 好心的婆婆，你能带我走出这片森林吗？
        - id: ch01-b03
          speaker: witch
          text: 当然可以，国王陛下。不过，您得先答应我一个条件。要是不答应，您就永远出不去，只能在这里饿死。
        - id: ch01-b04
          speaker: father_king
          text: 你有什么条件？
        - id: ch01-b05
          speaker: witch
          text: 我有个女儿，她的美貌举世无双，正配做您的妻子。只要您立她为王后，我就领您出去。
        - id: ch01-b06
          speaker: narrator
          text: 国王已经走投无路，只好答应。女巫领他回到小屋，女儿正坐在炉火旁，仿佛早就料到国王会来。她的确非常美，国王心里却一点也不喜欢她。每当看着她，他暗中总会感到一阵恐惧。国王把姑娘扶上马，女巫便指给他出路。回到王宫后，婚礼举行了。
        - id: ch01-b07
          speaker: narrator
          text: 国王从前有过一位妻子，留下七个孩子，六个男孩和一个女孩。他爱这些孩子胜过世上的一切。国王怕继母亏待他们，甚至伤害他们，就把孩子们送到森林深处的一座城堡。那里藏得极严密，路也难找。幸亏一位聪明的老妇人给了国王一团魔线。每次往前一抛，线团就会自己滚开，领他走到城堡。
        - id: ch01-b08
          speaker: narrator
          text: 国王常去探望心爱的孩子。王后见他一次次独自离宫，十分恼火，也很想知道他在森林里究竟做什么。她用许多钱收买仆人，终于问出了城堡的秘密，也知道只有那团魔线能带人找到路。王后从此一刻也不得安宁，直到查出国王把线团藏在哪里。接着，她缝好几件白色小衬衫，照女巫母亲教的办法，在每一件里都藏进魔法。
        - id: ch01-b09
          speaker: narrator
          text: 国王出门后，王后拿着衬衫走进森林，由线团带到了城堡。孩子们远远瞧见有人来了，还以为是父亲，便欢欢喜喜地跑去迎接。王后把小衬衫一件件披到六个男孩身上。衣服刚碰到身体，他们就变成六只天鹅，飞过森林，不见了踪影。王后满意地回了宫，以为继子们全被除掉了。那个女孩没有跟哥哥们跑出来，王后根本不知道她还在城堡里。
    - id: ch02
      title: 寻找六只天鹅
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天，国王来探望孩子，却只见到了女儿。
        - id: ch02-b02
          speaker: father_king
          text: 你的哥哥们到哪里去了？
        - id: ch02-b03
          speaker: sister
          text: 唉，亲爱的父亲，他们飞走了，只把我一个人留在这里。
          emotion: sad
        - id: ch02-b04
          speaker: narrator
          text: 女孩告诉父亲，自己从小窗望出去时，看见哥哥们变成天鹅，飞过森林。她还拿出从院里一根根收集起来的羽毛，那都是哥哥们飞走时落下的。国王悲痛万分，却没有想到这桩恶事是王后做的。他怕女儿也被人夺走，便想把她带回宫。女孩惧怕继母，恳求父亲让她在森林的城堡里再留一夜。
        - id: ch02-b05
          speaker: narrator
          text: 可怜的姑娘心想，这里已经不是自己的家了，她一定要去寻找哥哥。天一黑，她就逃进森林，整整跑了一夜。第二天，她仍旧不停地跑，直到累得再也迈不动脚。这时，她发现一间小屋，走进去一看，里面的房间摆着六张小床。姑娘不敢睡在任何一张床上，就钻到其中一张床下，躺在坚硬的地板上，打算在那里过夜。
        - id: ch02-b06
          speaker: narrator
          text: 太阳落山后，窗口忽然传来响动，六只天鹅飞进了屋。它们落到地板上，互相吹掉全身的羽毛，天鹅皮也像衬衫一样脱了下来。姑娘立刻认出哥哥们，高兴地从床下爬出来。哥哥们重逢妹妹，也欣喜万分，可这份快乐很快就过去了。
        - id: ch02-b07
          speakers: [brother_1, brother_2, brother_3, brother_4]
          ensemble: chorus
          text: 你不能留在这里。这是强盗的巢穴，他们要是回来发现你，一定会杀了你。
        - id: ch02-b08
          speaker: sister
          text: 你们不能保护我吗？
        - id: ch02-b09
          speakers: [brother_1, brother_2, brother_3, brother_4]
          ensemble: chorus
          text: 不能。每天晚上，我们只能脱下天鹅皮一刻钟，暂时变回人。时间一到，我们又会成为天鹅。
        - id: ch02-b10
          speaker: sister
          text: 难道没有办法解开你们的魔法吗？
          emotion: sad
        - id: ch02-b11
          speakers: [brother_1, brother_2, brother_3, brother_4]
          ensemble: chorus
          text: 没有，那条件太难了。你必须六年不说话，也不发笑，还得用星花给我们缝六件衬衫。只要漏出一个字，所有辛苦就都白费了。
          emotion: sad
        - id: ch02-b12
          speaker: narrator
          text: 话刚说完，一刻钟就到了。哥哥们重新变成天鹅，从窗口飞走。姑娘却已经下定决心，哪怕赔上性命，也要救他们。她离开小屋，走进森林，爬到树上过了一夜。第二天一早，她采来星花，开始缝衬衫。从此，她不和任何人说话，也没有心思发笑，只安静地坐着，一针一线地缝下去。
    - id: ch03
      title: 沉默的新娘
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 姑娘在森林里住了一段日子。一天，这个国家的国王前来打猎，他手下的猎人走到了她栖身的树下。
        - id: ch03-b02
          speakers: [hunter_1, hunter_2]
          ensemble: duo
          text: 你是谁？
        - id: ch03-b03
          speaker: narrator
          text: 姑娘没有回答。
        - id: ch03-b04
          speakers: [hunter_1, hunter_2]
          ensemble: duo
          text: 下来吧，我们不会伤害你。
        - id: ch03-b05
          speaker: narrator
          text: 她只是默默摇头。猎人不停追问，她便摘下脖子上的金项链扔给他们。他们还是不走，她又扔下腰带。见这也没有用，她接着扔下袜带，最后连衣裙也脱下来丢了下去。猎人始终不肯放过她，干脆爬上树，把她抱下来，带到国王面前。
        - id: ch03-b06
          speaker: country_king
          text: 你是谁？为什么坐在那棵树上？
        - id: ch03-b07
          speaker: narrator
          text: 姑娘依旧不出声。国王换遍自己会的语言来问，她都像鱼一样沉默。可她实在太美了，国王的心被打动，对她生出深深的爱意。他用斗篷裹住姑娘，让她坐在自己身前，一起骑马回到城堡。
        - id: ch03-b08
          speaker: narrator
          text: 国王命人给她换上华美的衣裳。她顿时光彩照人，像白昼一样明亮，可谁也不能叫她开口。用餐时，国王让她坐在身旁。她端庄谦和的举止，让国王越来越喜爱。
        - id: ch03-b09
          speaker: country_king
          text: 我只愿娶这位姑娘，世上别的女子我谁也不要。
        - id: ch03-b10
          speaker: narrator
          text: 几天后，他们成了婚。可是国王的母亲很不满意，常常说年轻王后的坏话。
        - id: ch03-b11
          speaker: queen_mother
          text: 谁知道这个姑娘是什么来历？她连话都不会说，哪里配得上国王？
          emotion: disgusted
    - id: ch04
      title: 六年的沉默
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一年后，王后生下第一个孩子。王太后把婴儿从她身边偷走，又跑去告诉国王，说王后亲手杀了孩子。国王不肯相信，也不许任何人伤害妻子。王后仍旧安静地坐在那里，一针一线缝着衬衫，对别的事一概不理。
        - id: ch04-b02
          speaker: narrator
          text: 第二个孩子出生后，王太后又做了同样的事，可国王还是不肯相信她。
        - id: ch04-b03
          speaker: country_king
          text: 她那么温柔善良，绝不会做这种事。要是她能够开口，为自己辩解，一定可以证明她是清白的。
        - id: ch04-b04
          speaker: narrator
          text: 等到第三个孩子也被偷走，王后再次受人指控，却还是不能替自己说一句话。国王只好把她交给法庭，法庭判她受火刑而死。
        - id: ch04-b05
          speaker: narrator
          text: 行刑那天，正好是六年期限的最后一天。六年来，王后没有说过一句话，也没有笑过一次。现在，她终于能让亲爱的哥哥们摆脱魔法。六件衬衫全都缝好了，只是最后一件还缺一只左袖。
    - id: ch05
      title: 火刑柱前的天鹅
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 王后被押往火刑柱时，把六件衬衫搭在手臂上。她站上柴堆，火把就要点燃，抬眼却看见六只天鹅从空中飞来。王后知道，解脱的时刻终于到了，心中满是欢喜。
        - id: ch05-b02
          speaker: narrator
          text: 天鹅们绕着她盘旋，又低低悬在空中。王后把衬衫一件件抛到它们身上。衣服刚一碰到天鹅，天鹅皮便纷纷落下，六位哥哥活生生地站到她面前。他们个个平安俊美，只有最小的哥哥，因为最后一件衬衫少了左袖，左臂仍是一只天鹅翅膀。兄妹们紧紧拥抱，互相亲吻。
        - id: ch05-b03
          speaker: narrator
          text: 王后来到国王面前。国王站在一旁，惊讶得说不出话。六年的沉默终于结束了。
        - id: ch05-b04
          speaker: sister
          text: 我最亲爱的丈夫，现在我能说话了。我可以明明白白地告诉你，我没有罪，是别人诬陷了我。
        - id: ch05-b05
          speaker: narrator
          text: 王后说出了王太后的骗局，告诉国王，她怎样偷走三个孩子，又把他们藏了起来。孩子们很快被接回宫，国王欣喜万分。狠毒的王太后也落得了悲惨的下场。
        - id: ch05-b06
          speaker: narrator
          text: 从此，国王、王后和她的六位哥哥幸福安宁地生活了许多年。
