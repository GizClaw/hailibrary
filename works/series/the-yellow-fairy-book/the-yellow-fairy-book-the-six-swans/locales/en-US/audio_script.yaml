  chapters:
    - id: ch01
      title: Lost in the Wood
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, a king went hunting in a great wood. He chased the game so eagerly that none of his courtiers could keep up. By evening he was alone, and when he stopped to look around, he knew he was completely lost. He searched for a way out, but found none. Then an old woman came toward him, her head shaking as she walked. The king did not know that she was a witch.
        - id: ch01-b02
          speaker: first_king
          text: Good woman, can you show me the way out of this wood?
        - id: ch01-b03
          speaker: witch
          text: Why, certainly, Your Majesty. But I have one condition. If you refuse it, you will never leave this wood. You will starve here.
        - id: ch01-b04
          speaker: first_king
          text: What must I do?
        - id: ch01-b05
          speaker: witch
          text: I have a daughter more beautiful than any woman in the world. She would make a fitting wife for you. Promise to make her your queen, and I will lead you out.
        - id: ch01-b06
          speaker: narrator
          text: In his distress, the king agreed. The old woman took him to her little house, where her daughter sat beside the fire. The young woman greeted him as though she had been waiting. She truly was beautiful, but the king did not like her. Whenever he looked at her, a hidden horror stirred inside him. Still, he lifted her onto his horse. The witch showed him the way, and when they reached his palace, the wedding was celebrated.
    - id: ch02
      title: The Enchanted Shirts
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The king had been married before. He had seven children from his first marriage, six boys and one girl, and he loved them more than anything. He feared their new stepmother might treat them badly or even harm them, so he hid them in a lonely castle deep in a wood. The place was so well concealed that even he needed magic to find it. A wise woman had given him a reel of thread. Whenever he threw it ahead, it unwound and led him along the secret path.
        - id: ch02-b02
          speaker: narrator
          text: The king visited his children so often that the queen grew angry about his absences. She wanted to know why he went into the wood alone. She paid his servants well, and they revealed both the hidden castle and the magic reel. The queen would not rest until she found where the king kept it. Then she made six little white shirts and sewed a spell into every one, using the witchcraft her mother had taught her.
        - id: ch02-b03
          speaker: narrator
          text: One day, after the king rode away, the queen took the shirts into the wood. The reel guided her to the castle. When the children saw someone approaching, they thought their dear father had come, and the six boys ran joyfully to meet him. The queen threw a shirt over each boy. The moment the cloth touched them, they became swans and flew away above the forest.
        - id: ch02-b04
          speaker: narrator
          text: The queen returned home well satisfied, certain she had rid herself of her stepchildren. But the girl had not run out with her brothers. She knew nothing about what had happened.
    - id: ch03
      title: The Brothers' Secret
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next day, the king came to see his children. Only his daughter was there.
        - id: ch03-b02
          speaker: first_king
          text: Where are your brothers?
        - id: ch03-b03
          speaker: princess
          text: Oh, dear Father, they have gone away and left me here alone.
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: She told him how she had looked from her little window and seen six swans flying over the trees. In the yard, she had gathered the feathers they dropped, and now she showed them to him. The king grieved, but he never imagined that the queen had committed this wicked deed. Afraid his daughter might be taken too, he wanted to bring her home with him. The girl feared her stepmother and begged to remain in the woodland castle for just one more night.
        - id: ch03-b05
          speaker: narrator
          text: But she had already made up her mind. This was no longer her home. She would go and find her brothers. When night fell, she fled into the forest. She ran all night and all through the next day, until weariness stopped her. Then she found a little hut. Inside was a room with six small beds. She did not dare lie on any of them, so she crept beneath one bed and stretched out on the hard floor.
        - id: ch03-b06
          speaker: narrator
          text: After sunset, she heard a sound. Six swans flew through the window and landed on the floor. They blew at one another until all their feathers came away, and each swan skin slipped off like a shirt. At once, the girl knew her brothers. Overjoyed, she crawled out from under the bed. The brothers were just as delighted to see their little sister, but their happiness did not last.
        - id: ch03-b07
          speakers: [brother_1, brother_2, brother_3, brother_4]
          ensemble: chorus
          text: You cannot remain here. This hut belongs to robbers. If they return and find you, they will kill you.
        - id: ch03-b08
          speaker: princess
          text: But couldn't you keep me safe?
        - id: ch03-b09
          speakers: [brother_1, brother_2, brother_3, brother_4]
          ensemble: chorus
          text: No. Each evening we can take off our swan skins for only a quarter of an hour. We become human for that short time, and then we must turn back into swans.
        - id: ch03-b10
          speaker: narrator
          text: The little sister began to cry.
        - id: ch03-b11
          speaker: princess
          text: Is there no way to set you free?
          emotion: sad
        - id: ch03-b12
          speakers: [brother_1, brother_2, brother_3, brother_4]
          ensemble: chorus
          text: The task is much too hard. For six years, you must never speak or laugh. During that time, you must make six shirts for us from star-flowers. If even one word passes your lips, all your work will be lost.
        - id: ch03-b13
          speaker: narrator
          text: As soon as they finished speaking, the quarter of an hour ended. The brothers became swans again and flew out through the window.
    - id: ch04
      title: Six Years of Silence
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The maiden was determined to free her brothers, even if it cost her life. She left the hut, climbed a tree in the forest, and spent the night among its branches. In the morning, she gathered star-flowers and began to sew. She could speak to no one, and she had no desire to laugh. She sat quietly, with her eyes fixed on her work.
        - id: ch04-b02
          speaker: narrator
          text: She had lived that way for some time when the king of that country came hunting in the forest. His hunters reached the tree where she sat and called up to her.
        - id: ch04-b03
          speaker: hunter_1
          text: Who are you?
        - id: ch04-b04
          speaker: narrator
          text: She did not answer.
        - id: ch04-b05
          speaker: hunter_2
          text: Come down. We won't hurt you.
        - id: ch04-b06
          speaker: narrator
          text: The maiden only shook her head. When they kept questioning her, she tossed down the golden chain from her neck. They still would not go away, so she gave them her girdle, then her garters, and at last her dress. Nothing made them leave. The hunters climbed the tree, lifted her down, and brought her before the king.
        - id: ch04-b07
          speaker: second_king
          text: Who are you? Why were you sitting in that tree?
        - id: ch04-b08
          speaker: narrator
          text: Again, she said nothing. The king questioned her in every language he knew, yet she remained as silent as a fish. Her beauty touched his heart, and he fell deeply in love with her. He wrapped her in his cloak, seated her before him on his horse, and carried her back to his castle.
        - id: ch04-b09
          speaker: narrator
          text: There, the maiden was dressed in splendid clothes, and her beauty shone as brightly as day. Still, no one could draw a single word from her. The king placed her beside him at his table. Her modest ways pleased him so much that he soon made his choice.
        - id: ch04-b10
          speaker: second_king
          text: This is the maiden I will marry. I want no other woman in the world.
        - id: ch04-b11
          speaker: narrator
          text: A few days later, they were married. But the king's mother hated the marriage and spoke cruelly about the young queen.
        - id: ch04-b12
          speaker: king_mother
          text: Who can say where this girl came from? She cannot even speak. She is not fit to marry a king.
    - id: ch05
      title: The False Accusations
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A year later, the young queen gave birth to her first child. The king's mother stole the baby away, then went to her son with a terrible accusation.
        - id: ch05-b02
          speaker: king_mother
          text: The queen has killed her child.
        - id: ch05-b03
          speaker: narrator
          text: The king refused to believe her and would not let anyone harm his wife. Through it all, the queen sat quietly sewing the six shirts. She would not turn her thoughts from her task.
        - id: ch05-b04
          speaker: narrator
          text: When the queen had a second child, the wicked mother did the same thing again. Still, the king could not bring himself to believe the charge.
        - id: ch05-b05
          speaker: second_king
          text: She is far too gentle and good to do such a thing. If she could speak and defend herself, everyone would know she was innocent.
        - id: ch05-b06
          speaker: narrator
          text: Then a third child was born. Once more, the king's mother took the baby, and once more she accused the silent queen. The queen could not say one word in her own defense. This time, the king had to surrender her to the law. The judgment was that she must be burned to death.
        - id: ch05-b07
          speaker: narrator
          text: The day chosen for her death was also the final day of the six years. She had kept silent and had never laughed. Now the enchantment was almost broken. All six shirts were finished except for the left sleeve of the last one.
    - id: ch06
      title: The Swans Return
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: When the queen was led to the stake, she carried the shirts over her arm. She stood upon the pile, and the fire was about to be lit. Then she looked around and saw six swans flying through the sky. She knew her release was near, and her heart danced with joy.
        - id: ch06-b02
          speaker: narrator
          text: The swans circled her and hovered low. She threw a shirt over each one. As soon as the cloth touched them, their swan skins fell away. Her brothers stood before her, alive, well, and handsome. Only the youngest was not entirely restored. In place of his left arm, he still had a swan's wing.
        - id: ch06-b03
          speaker: narrator
          text: The brothers and their sister embraced and kissed one another. Then the queen went to her astonished husband and, for the first time, spoke.
        - id: ch06-b04
          speaker: princess
          text: My dearest husband, I can speak now. I can tell you openly that I am innocent, and every charge against me was false.
        - id: ch06-b05
          speaker: narrator
          text: She told him how his mother had deceived them, taking all three children and hiding them away. The children were brought back, and the king rejoiced to see them. The wicked mother came to no good end.
        - id: ch06-b06
          speaker: narrator
          text: And the king and queen, together with her six brothers, lived for many years in happiness and peace.
