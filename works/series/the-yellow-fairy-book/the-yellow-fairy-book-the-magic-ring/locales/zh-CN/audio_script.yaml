audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的神秘与幽默, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    martin:
      display_name: 马丁
      tts: {delivery: 善良直率，温厚而坚定, timbre: 清朗朴实, pace: 从容, pitch: 中音}
    mother:
      display_name: 马丁的母亲
      tts: {delivery: 直爽操心，情绪鲜明, timbre: 苍老温厚, pace: 稍缓, pitch: 中高音}
    butcher_1:
      display_name: 屠夫甲
      tts: {delivery: 粗声粗气，带着嘲弄, timbre: 粗哑, pace: 明快, pitch: 中低音}
    butcher_2:
      display_name: 屠夫乙
      tts: {delivery: 强硬轻蔑，毫不客气, timbre: 厚重, pace: 明快, pitch: 低音}
    peasant:
      display_name: 粗野的农夫
      tts: {delivery: 生硬冷淡，言语简短, timbre: 沙哑, pace: 稍快, pitch: 中低音}
    rich_peasant:
      display_name: 富农
      tts: {delivery: 平静精明，不露心思, timbre: 沉稳, pace: 从容, pitch: 中低音}
    serpent_princess:
      display_name: 蛇公主
      tts: {delivery: 温柔神秘，言语恳切, timbre: 柔和清澈, pace: 舒缓, pitch: 中音}
    underworld_king:
      display_name: 地下国王
      tts: {delivery: 慈爱庄重，宽宏大方, timbre: 浑厚温暖, pace: 从容, pitch: 低音}
    king:
      display_name: 国王
      tts: {delivery: 威严傲慢，偶带讥讽, timbre: 浑厚有力, pace: 从容, pitch: 中低音}
    princess:
      display_name: 公主
      tts: {delivery: 娇柔圆滑，冷意藏在甜美话音里, timbre: 明亮柔美, pace: 舒缓, pitch: 中高音}
    youth_1:
      display_name: 魔法青年甲
      tts: {delivery: 整齐果断，毫不迟疑, timbre: 清朗, pace: 稳健, pitch: 中音}
    youth_2:
      display_name: 魔法青年乙
      tts: {delivery: 整齐果断，毫不迟疑, timbre: 明亮, pace: 稳健, pitch: 中音}
    youth_3:
      display_name: 魔法青年丙
      tts: {delivery: 整齐果断，毫不迟疑, timbre: 厚实, pace: 稳健, pitch: 中低音}
    courtier_1:
      display_name: 朝臣甲
      tts: {delivery: 逢迎刻薄，幸灾乐祸, timbre: 尖亮, pace: 明快, pitch: 中高音}
    courtier_2:
      display_name: 朝臣乙
      tts: {delivery: 逢迎刻薄，笑意明显, timbre: 清亮, pace: 明快, pitch: 中音}
    courtier_3:
      display_name: 朝臣丙
      tts: {delivery: 逢迎刻薄，语气夸张, timbre: 偏厚, pace: 明快, pitch: 中低音}
    schurka:
      display_name: 舒尔卡
      tts: {delivery: 忠诚勇猛，性子急躁, timbre: 粗厚有力, pace: 稍快, pitch: 中低音}
    waska:
      display_name: 瓦斯卡
      tts: {delivery: 机敏沉着，亲切自信, timbre: 轻柔灵巧, pace: 从容, pitch: 中高音}
    baker:
      display_name: 面包师
      tts: {delivery: 热情响亮，吆喝富有节奏, timbre: 洪亮, pace: 明快, pitch: 中音}
    mouse_king:
      display_name: 鼠王
      tts: {delivery: 惊慌中不失尊严，恳切机敏, timbre: 细而稳, pace: 稍快, pitch: 高音}
    little_mouse:
      display_name: 小老鼠
      tts: {delivery: 伶俐勇敢，轻快自信, timbre: 细小清脆, pace: 明快, pitch: 高音}
  chapters:
    - id: ch01
      title: 两百弗罗林
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一对老夫妻有个独生子，名叫马丁。父亲的寿数到了，便躺在床上咽了气。他辛苦操劳了一辈子，留给妻儿的却只有两百弗罗林。母亲本想把钱存起来，以备不时之需。可这个不时之需转眼就来了，家里的面粉已经吃光。明明手里还有两百弗罗林，谁肯坐着挨饿呢？她只好取出一百弗罗林，叫马丁进城买足一年的面粉。
        - id: ch01-b02
          speaker: narrator
          text: 马丁带着钱向城里走去。来到肉市，只见那里一片混乱，愤怒的叫骂声、此起彼伏的狗吠声响成一团。他挤进围观的人群，发现屠夫们捉住一条猎鹿犬，把它紧紧拴在柱上，正毫不留情地狠命抽打。马丁越看越不忍心，终于走上前去。
        - id: ch01-b03
          speaker: martin
          text: 朋友们，这条狗已经够可怜了，你们为什么还要这样打它？
        - id: ch01-b04
          speakers: [butcher_1, butcher_2]
          ensemble: duo
          text: 它刚吞了一头才杀的猪，我们打它当然有理！
        - id: ch01-b05
          speaker: martin
          text: 那就别打了，把它卖给我吧。
        - id: ch01-b06
          speaker: butcher_1
          text: 想要这件宝贝？少了一百弗罗林可不成。
        - id: ch01-b07
          speaker: narrator
          text: 马丁听见价钱，吃了一惊。可对方既然不肯少要，他还是从口袋里取出整整一百弗罗林，换来那条名叫舒尔卡的猎狗。回到家，母亲迎上来，满心盼着他买回的面粉，见到的却只有一条狗。
        - id: ch01-b08
          speaker: mother
          text: 家里连一把面粉都没有了，你竟拿一百弗罗林买了这头没用的畜生！明天带上最后一百弗罗林再去。箱底只够烤一张饼，撑不过后天了。
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: 第二天，母亲把箱底最后一点面粉扫出来，烤成一张饼。马丁带着家里最后一百弗罗林再次出门。刚到城边，他便遇见一个模样粗野的农夫。那人把绳子紧紧勒在一只可怜的猫的脖子上，拖着它往前走。
        - id: ch01-b10
          speaker: martin
          text: 停下！你要把这只猫拖到哪儿去？
        - id: ch01-b11
          speaker: peasant
          text: 它咬死了我的鹅，我要淹死它。
        - id: ch01-b12
          speaker: martin
          text: 别淹它，卖给我吧。一百弗罗林全在这里。
        - id: ch01-b13
          speaker: narrator
          text: 农夫收下钱，马丁带走了猫儿瓦斯卡。回到家，母亲先问他带回什么，又追问还有没有别的。听说最后的钱也花光了，她气得骂马丁是个一无是处的懒骨头，当场赶他出门，要他到陌生人中间讨生活。马丁不敢顶嘴，便唤上舒尔卡和瓦斯卡，带着它们去最近的村子找活干。半路上，他遇见一位富农，对方问清他的去处，愿意把他带回家。
        - id: ch01-b14
          speaker: rich_peasant
          text: 跟我来吧。我不给工人发工钱，不过你若忠心干满一年，最后一定不会吃亏。
        - id: ch01-b15
          speaker: narrator
          text: 马丁答应了条件，勤勤恳恳干了整整一年。他忠心服侍主人，干什么都不惜力气。结算的日子到了，富农把他领进谷仓，指着两只装得满满的口袋，让他随意挑选。一袋装满白银，另一袋却只有沙子。马丁仔细看过，猜想这里面必有花样，宁可选那袋沙子。他把沉重的口袋扛上肩，又到外面的世界寻找新工作。
    - id: ch02
      title: 地下王国的戒指
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 马丁不停地走啊走，终于进入一片阴森的大森林。走到森林中央，他看见一块草地，那里正燃着熊熊大火。烈焰中央困着一个姑娘，比马丁平生见过的任何人都美。她被火焰团团包围，一看见马丁，立刻向他高声求救。
        - id: ch02-b02
          speaker: serpent_princess
          text: 马丁，你若想得到幸福，就用忠心工作换来的沙子扑灭火焰，救我一命吧！
        - id: ch02-b03
          speaker: narrator
          text: 马丁心想，这袋沙子压得肩膀生疼，与其一路背着受累，当然不如拿它救一条人命。他立刻卸下口袋，把里面的沙子全倒进火中。熊熊大火瞬间熄灭。可就在同一刻，奇事发生了。美丽的姑娘忽然化作一条蛇，猛地蹿到马丁身上，盘住他的脖子，又贴在他耳边柔声说话。
        - id: ch02-b04
          speaker: serpent_princess
          text: 别怕，我爱你，也愿意陪你走遍天下。现在先跟我去地下的父王之国。父王会给你金银宝石，你一样也别拿，只求他把小指上的戒指送给你。那枚戒指从一只手抛到另一只手，就会召来十二个年轻人。再难的吩咐，他们一夜也能办妥。
        - id: ch02-b05
          speaker: narrator
          text: 他们辗转走了很久，来到路中央的一块巨岩前。蛇从马丁颈上滑到潮湿的地面，立刻又变回美丽的姑娘。她指给马丁一道刚够一人钻过的洞口。两人钻过岩缝，沿着长长的地下通道一直前行。尽头竟是一片辽阔的原野，头顶还铺展着蓝天。原野中央立着一座斑岩城堡，金色屋顶熠熠生辉，城垛也闪着光。姑娘告诉马丁，这就是她父王的宫殿，父王在这里统治整个地下王国。
        - id: ch02-b06
          speaker: underworld_king
          text: 孩子，我几乎不敢盼着再见到你。这些年，你究竟去了哪里？
        - id: ch02-b07
          speaker: serpent_princess
          text: 父王，是这位年轻人把我从可怕的死亡中救了出来。
        - id: ch02-b08
          speaker: underworld_king
          text: 年轻人，我要奖赏你的勇气。金子、银子、宝石，你想拿多少都可以。
        - id: ch02-b09
          speaker: martin
          text: 多谢陛下，可我不贪图这些财宝。请把您小指上的戒指赐给我吧。看见它，我就会想起您的恩德；等我结婚，还会把它送给新娘。
        - id: ch02-b10
          speaker: narrator
          text: 地下国王从小指上摘下戒指，交给马丁，却提出一个条件。他郑重告诫马丁，绝不能向任何人泄露这是一枚魔戒，否则灾祸马上就会落到马丁自己头上。马丁收好戒指，谢过国王，沿着来时的路离开地下王国。他重见天日以后便赶回故乡，发现母亲仍住在原来的老屋。母子俩又住到一起，日子安稳得没有一丝波澜，仿佛会永远这样过下去。
        - id: ch02-b11
          speaker: narrator
          text: 后来有一天，马丁忽然想成婚了。他还不肯随便娶一位姑娘，偏要选择身份最高贵的新娘，说得明白些，也就是国王的女儿。可他不相信自己能把求婚的话说好，便打定主意，请年老的母亲代自己进宫说亲。
        - id: ch02-b12
          speaker: mother
          text: 你为什么不娶一个门当户对的姑娘？我这穷老太婆跑去替你求娶公主，咱们母子的脑袋都可能保不住！
          emotion: fearful
        - id: ch02-b13
          speaker: martin
          text: 妈妈，别怕。相信我，不会出事的。只是你一定要带一个明确的答复回来。
    - id: ch03
      title: 国王的难题
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 老妇人只得听从儿子的吩咐，一瘸一拐地来到王宫。她一路没有受阻，进了庭院，又径直登上通往国王接见厅的台阶。平台上站着一排排衣饰华美的朝臣。他们盯着这个古怪的老太婆，冲她喊叫，又连说带比画，告诉她严禁上楼。可她一心要完成儿子的嘱托，严厉的话和阻拦的手势都吓不退她。几个人抓住她的胳膊，硬把她拦下，她便扯开嗓子大叫，终于惊动了国王。
        - id: ch03-b02
          speaker: narrator
          text: 国王走到阳台，看见老妇人疯狂挥舞双臂，还听见她喊着，不亲自向国王陈明来意就绝不离开，于是命人把她带来。老妇人被领进金碧辉煌的接见厅。国王斜倚在紫色软垫中，四周站满大臣和朝臣。老妇人向他深深行礼，却站在那里一声不响。国王只好问，这位老太太究竟要他做什么。
        - id: ch03-b03
          speaker: mother
          text: 陛下千万别生气。我今天来，是替儿子求亲的。
        - id: ch03-b04
          speaker: king
          text: 这个女人莫不是疯了？
          emotion: angry
        - id: ch03-b05
          speaker: mother
          text: 请耐心听完，再给我一句痛快话。您有一位美丽的女儿，我有一个聪明善良的儿子。整个王国也找不到比他更好的女婿，世上没有他做不到的事。您到底肯不肯把公主嫁给他？
        - id: ch03-b06
          speaker: narrator
          text: 国王一直听到老妇人说完，脸色越来越黑，神情也越来越严厉。可他忽然转念一想，自己堂堂国王，何必同这个可怜的老傻瓜生气？嘴边紧绷的线条慢慢松开，眉间的怒意也消失了。四周的大臣和朝臣都惊讶地看着他。随后，国王用温和而嘲弄的声音给出了条件。
        - id: ch03-b07
          speaker: king
          text: 让你儿子在二十四小时内，在我的宫窗对面造一座壮丽城堡，再用纯水晶桥与王宫相连。桥边要有结金银苹果的树，枝头要有极乐鸟。右边还要有一座五个金圆顶的教堂，让他在那里迎娶公主。若办不到，你们母子就先浸焦油，再滚羽毛，最后到集市上受刑，给我的朝臣取乐。
        - id: ch03-b08
          speaker: narrator
          text: 国王唇边挂着笑。朝臣们想到老妇人的下场，笑得浑身发抖，还大声称赞这条妙计。
        - id: ch03-b09
          speakers: [courtier_1, courtier_2, courtier_3]
          ensemble: chorus
          text: 等他们浸满焦油、粘满羽毛，一定有趣极了！这小子想在一天内完成任务，还不如在手心里长出胡子！
        - id: ch03-b10
          speaker: mother
          text: 陛下，这真是您的旨意？我真得把这道命令带回去吗？
          emotion: fearful
        - id: ch03-b11
          speaker: king
          text: 正是。办成了，他就娶公主；办不成，你们俩就进焦油桶、上火刑柱。
        - id: ch03-b12
          speaker: narrator
          text: 老妇人一路流着苦泪回家。见到马丁，她一边哀号，一边说自己早就劝过他娶个门当户对的人。如今进宫求亲果然要了他们的命，母子俩都会先浸焦油、滚羽毛，再到集市上被活活烧死。马丁只让母亲相信自己，安心去睡。随后，他走到小屋前，把戒指从一只手抛到另一只手。十二个年轻人应声出现，等候他的差遣。
        - id: ch03-b13
          speakers: [youth_1, youth_2, youth_3]
          ensemble: chorus
          text: 请说吧，您要我们做什么？
        - id: ch03-b14
          speaker: narrator
          text: 马丁把国王的每一道命令都说了出来。年轻人答应，天亮以前一定原样办妥。第二天早晨，国王醒来向窗外望去，一座壮丽的新城堡竟立在自己王宫的正对面，一座纯水晶桥把两座宫殿连在一起。桥边长着果树，枝头挂满金苹果和银苹果，极乐鸟就栖息在果实之间。桥右边的宏伟教堂有五个金圆顶，在阳光下闪闪发亮。钟声响彻四方，仿佛要召唤天涯海角的人都来观看这场奇迹。
        - id: ch03-b15
          speaker: narrator
          text: 国王原本更想看未来的女婿浸焦油、滚羽毛、上火刑柱。可是王者的誓言不能违背，眼前的奇迹又明明完全符合自己开出的条件，他只得勉强接受这门婚事。他打起精神，正式封马丁为公爵，给女儿备下丰厚的嫁妆，又召集王国里最好的厨师和乐师，张罗了一场从未有人见过的盛大婚宴。直到多年以后，乡间的老人仍在谈论那场婚礼。
    - id: ch04
      title: 公主偷走魔戒
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 婚礼过后，马丁和公主住进新宫殿。那里舒适又奢华，马丁从前连做梦也想象不到。他整天快快乐乐，无忧无虑；公主却终日烦闷。她觉得父王逼自己嫁给穷寡妇的儿子，而不是异国的年轻王子，实在让她蒙受了奇耻大辱。她越想越痛苦，把所有时间都花在一件事上，那就是怎样摆脱这个不称心的丈夫。
        - id: ch04-b02
          speaker: narrator
          text: 公主决定先探出马丁力量的秘密。她用甜言蜜语百般哄劝，问他为什么如此聪明，世上竟没有办不到的事。马丁起初守口如瓶。可有一天，他的心肠软了。公主带着迷人的微笑来到身边，一面温柔地奉承他，一面递给他一杯药酒。那杯酒气味很浓，尝起来却甜得很。
        - id: ch04-b03
          speaker: princess
          text: 你这么聪明，世上什么难事都能办成。告诉我吧，你究竟有什么神奇的本领？
        - id: ch04-b04
          speaker: narrator
          text: 马丁喝下药酒，嘴巴再也守不住秘密。他说出全部力量都藏在指上的魔戒里，又把戒指的用法一五一十告诉公主。说着说着，他便沉沉睡去。公主见药力已经发作，丈夫睡得毫无知觉，便轻轻从他手指上取下魔戒，独自来到庭院里，把它从一只手抛到另一只手。
        - id: ch04-b05
          speakers: [youth_1, youth_2, youth_3]
          ensemble: chorus
          text: 请说吧，您要我们做什么？
        - id: ch04-b06
          speaker: princess
          text: 天亮以前，把城堡、水晶桥、教堂和果树全都移走，只留下马丁从前住的破屋。趁他睡着，把他送回旧房。再把我带到天涯海角，送进那位老国王的宫殿。那里才配得上王家公主。
        - id: ch04-b07
          speakers: [youth_1, youth_2, youth_3]
          ensemble: chorus
          text: 遵命。
        - id: ch04-b08
          speaker: narrator
          text: 第二天早晨，国王从窗口望出去，惊讶地发现城堡、桥、教堂和果树全都消失，原地只剩一间光秃秃、破败不堪的小屋。他立刻召来女婿，命马丁解释究竟发生了什么。马丁望着身为岳父的国王，一句解释也说不出来。国王勃然大怒，召集大臣开会，指控马丁施展巫术、欺骗君王，又把公主弄得不知所终。最后，马丁被判关进一座高高的石塔，不给一口食物，也不给一滴水，直到活活饿死。
        - id: ch04-b09
          speaker: narrator
          text: 到了最危急的时候，老朋友舒尔卡和瓦斯卡想起马丁曾救它们逃过惨死，便商量该怎样回报主人。舒尔卡低声咆哮，恨不得把所有人都撕成碎片。瓦斯卡却若有所思地呼噜着，用柔软的爪子挠挠耳背，安静地想了好一阵。几分钟后，它终于拿定了主意。
        - id: ch04-b10
          speaker: waska
          text: 我们进城去。遇到面包师，你冲到他两腿中间，掀翻头顶的托盘。我趁乱叼走面包卷，给主人送去。
        - id: ch04-b11
          speaker: narrator
          text: 说干就干。两个忠心的伙伴一同小跑进城，很快遇见一位头顶托盘的面包师。他一边走，一边朝四面张望，还扯开嗓门，唱歌似的响亮吆喝。
        - id: ch04-b12
          speaker: baker
          text: 新鲜面包卷，香甜小蛋糕！精巧面点样样好！快来买，快来挑，包你吃了忘不了！
        - id: ch04-b13
          speaker: narrator
          text: 就在这时，舒尔卡猛地冲过他的两腿。面包师脚下一绊，托盘翻落，面包卷撒了一地。他怒气冲冲地追赶猎狗，瓦斯卡便趁机把面包卷一只只拖到灌木后藏好。片刻以后，舒尔卡甩掉面包师回来会合。它们带上全部面包，飞快地奔到囚禁马丁的石塔下。瓦斯卡身手敏捷，沿着塔外一直爬到装有铁栅的窗口。
        - id: ch04-b14
          speaker: waska
          text: 主人，你还活着吗？
        - id: ch04-b15
          speaker: martin
          text: 还剩一口气。我快饿死了，没想到自己会这样死在塔里。
          emotion: sad
        - id: ch04-b16
          speaker: narrator
          text: 瓦斯卡告诉主人，它和舒尔卡一定会照顾他。随后，它爬下高塔，叼起一个面包卷送到窗口。接着又是一个，又是一个。它一次次爬上爬下，直到把整托盘面包全都送进塔里。马丁终于有了暂时活命的食物，可真正要救他脱离牢狱，还得找回那枚戒指。
        - id: ch04-b17
          speaker: waska
          text: 舒尔卡和我会照顾你。我们现在去天涯海角，把魔戒找回来。主人，你一定要省着吃这些面包，坚持到我们回来。
    - id: ch05
      title: 瓦斯卡与鼠王
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 瓦斯卡告别心爱的主人，和舒尔卡一同上路。它们走啊走，翻过一程又一程，一路四下寻找公主的踪迹。凡是可疑的足印，它们都要追查；凡是遇见的猫狗，它们都要询问；每个从身边经过的旅人说了什么，它们也仔细倾听。最后，它们终于听说，十二个年轻人把公主送去的天涯海角之国已经不远。一天，它们抵达那个遥远的王国，直奔王宫。它们同宫里的猫狗一一交朋友，反复询问公主和魔戒，却没有谁能说出多少。
        - id: ch05-b02
          speaker: narrator
          text: 一天，瓦斯卡到宫中地窖捕捉老鼠，看见一只格外肥胖、吃得滚圆的家伙。它猛扑过去，把利爪扎进对方柔软的皮毛，张嘴就要吞下。生死关头，小东西用哀求的声音开了口。
        - id: ch05-b03
          speaker: mouse_king
          text: 请饶我一命！我能替你效劳。我是鼠王，若死在这里，整个鼠族也要灭绝。
          emotion: fearful
        - id: ch05-b04
          speaker: waska
          text: 我可以饶你，不过先替我拿回一件东西。这里的公主是我主人的恶妻，她偷走了一枚魔戒。无论如何都要把戒指取来。事情办成以前，我不会松开爪子。
        - id: ch05-b05
          speaker: narrator
          text: 鼠王答应下来，立刻召集王国里所有臣民。棕的、灰的、大的、小的，无数老鼠从四面八方赶来，围成一圈。它们的国王仍被压在瓦斯卡的利爪下面。鼠王告诉忠诚的臣民，谁能从陌生公主那里偷来魔戒，救它脱离这场惨死，谁就会得到胜过王国里所有老鼠的尊荣。
        - id: ch05-b06
          speaker: little_mouse
          text: 陛下，我常在夜里溜进公主的卧房。她把一枚戒指看得比眼珠还宝贵，白天戴在手上，夜里含在嘴里。我愿意去偷。
        - id: ch05-b07
          speaker: narrator
          text: 小老鼠轻快地跑进公主卧房，藏在那里等候天黑。公主睡熟以后，它悄悄爬上床，在枕头上咬开一个小洞。它钻进洞口，把细小的绒羽一根根拖出来，再全都推到公主鼻子下面。轻飘飘的绒毛随着呼吸飞进鼻孔，又钻进嘴里。公主猛然惊醒，先大打喷嚏，接着不停咳嗽。她再也含不住戒指，那枚戒指一下从嘴里掉出，落在床罩上。
        - id: ch05-b08
          speaker: narrator
          text: 小老鼠闪电般夺走戒指，赶紧带到地窖，交给瓦斯卡，赎回了鼠王。瓦斯卡这才松开利爪。它和舒尔卡马上启程，白天赶路，夜里也不停歇，终于又回到囚禁马丁的石塔下。猫儿沿着塔外爬上去，再次来到那扇装有铁栅的窗口前。
        - id: ch05-b09
          speaker: waska
          text: 马丁，亲爱的主人，你还活着吗？
        - id: ch05-b10
          speaker: martin
          text: 瓦斯卡，是你吗？我已经三天没有吃东西，快要饿死了。
        - id: ch05-b11
          speaker: waska
          text: 振作起来！从今天起，等着你的只有幸福和好运。若不是眼下不宜猜谜，我真想让你猜猜我们带回了什么。主人，你的戒指找回来了！
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: 听见戒指失而复得，马丁的喜悦再也装不下了。他疼爱地抚摸瓦斯卡。猫儿贴着主人蹭来蹭去，幸福地呼噜着；塔下的舒尔卡也高高跳起，欢快地吠叫。马丁接过那枚熟悉的戒指，立刻从一只手抛到另一只手。十二个年轻人随即出现在石塔里，等候他的命令。
    - id: ch06
      title: 魔戒归来
      blocks:
        - id: ch06-b01
          speakers: [youth_1, youth_2, youth_3]
          ensemble: chorus
          text: 请说吧，您要我们做什么？
        - id: ch06-b02
          speaker: martin
          text: 先赶快拿吃的喝的来，再请乐师到这里，让音乐响上一整天。
        - id: ch06-b03
          speaker: narrator
          text: 城里和宫里的人听见石塔传出音乐，全都惊讶极了。他们跑去禀告国王，说马丁的塔里一定又有巫术。他不但没有饿死，反而伴着乐声欢宴，盘碟、杯盏和刀叉叮当作响。那音乐甜美得像有魔力，每个经过塔下的人都会停住脚步，舍不得离开。
        - id: ch06-b04
          speaker: narrator
          text: 国王立刻派使者到绝食塔查看。使者看见里面的情形，吃惊得钉在原地。国王又派几位首席大臣前往，他们也看得动弹不得。最后，国王只好亲自来到塔下，同样被美妙的音乐迷住。马丁这才再次召来十二个年轻人，向他们发出新的命令。
        - id: ch06-b05
          speaker: martin
          text: 重新造起我的城堡，用水晶桥连上王宫。让结金银苹果的树和枝头的极乐鸟全都回来。恢复五个圆顶的教堂，让钟声召唤王国四方的百姓。最后，把我那负心的妻子带回来，送进女眷的房间。
        - id: ch06-b06
          speaker: narrator
          text: 一切都照马丁的吩咐办妥了。宏伟的城堡重新拔地而起，水晶桥再次通向王宫。结着金银苹果的树回到桥边，极乐鸟落回枝头，五个金圆顶的教堂也恢复原样，钟声传遍整个王国。马丁这才走出绝食塔，挽着岳父国王的手臂，把他领进新宫殿。公主已经从天涯海角被送回女眷的房间。她孤零零地坐在那里，吓得浑身发抖，等着死亡降临。
        - id: ch06-b07
          speaker: martin
          text: 国王，我的岳父，您的女儿让我吃尽了苦头。您说，该怎样惩罚她？
        - id: ch06-b08
          speaker: king
          text: 亲爱的王子，我的女婿，你若爱我，就别再发怒了。饶恕我的女儿，让她重新回到你的心里吧。
          emotion: calm
        - id: ch06-b09
          speaker: narrator
          text: 听了国王的请求，马丁心里的怒火渐渐平息，终于原谅了妻子，又接纳她回到自己身边。从此，两人幸福地生活在一起。马丁的老母亲也离开旧屋，搬进宫殿与儿子同住。忠心的舒尔卡和瓦斯卡始终陪着主人，他再也没有同它们分开。至于那枚魔戒，不用说你也知道，马丁再也没有让它离开自己半步。
