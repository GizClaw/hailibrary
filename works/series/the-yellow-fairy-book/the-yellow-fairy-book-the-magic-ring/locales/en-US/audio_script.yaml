  chapters:
    - id: ch01
      title: Schurka and Waska
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, an old couple lived with their only son, Martin. When the old man's time came, he stretched out on his bed and died. He had worked and struggled all his life, yet all he left his wife and son was two hundred florins. The widow meant to put the money away for a rainy day. But that rainy day was already close. Every bit of their meal had been used, and who would choose starvation with two hundred florins at hand? She counted out half the money, gave it to Martin, and sent him into town to buy enough meal for an entire year.
        - id: ch01-b02
          speaker: narrator
          text: Martin set off. At the meat market, he found a crowd in an uproar. Men were shouting, dogs were barking, and in the middle of it all, the butchers had tied a stag-hound to a post. They were beating him without mercy. Martin pushed through the crowd and saw the poor animal.
        - id: ch01-b03
          speaker: martin
          text: Friends, why are you treating that dog so cruelly?
        - id: ch01-b04
          speaker: butcher
          text: We have good reason. He just ate a pig that had been freshly killed.
        - id: ch01-b05
          speaker: martin
          text: Then stop beating him and sell him to me.
        - id: ch01-b06
          speaker: butcher
          text: Buy him if you like. But such a treasure will cost you a hundred florins, and not one penny less.
        - id: ch01-b07
          speaker: martin
          text: A hundred florins! Well, if you truly will take no less, then here they are.
        - id: ch01-b08
          speaker: narrator
          text: Martin handed over every coin and took the dog, whose name was Schurka. When they reached home, his mother came straight to meet them.
        - id: ch01-b09
          speaker: mother
          text: Well, what did you buy?
        - id: ch01-b10
          speaker: martin
          text: I bought Schurka, this dog.
        - id: ch01-b11
          speaker: narrator
          text: His mother flew into a rage and scolded him soundly. There was hardly a handful of meal in the house, she told him. He ought to be ashamed of spending the money on a useless animal while they had nothing to eat. The next morning, she placed their last hundred florins in his hand and sent him back to town. She had just shaken the final grains of meal from the chest and baked one bannock. That little loaf would not last beyond the next day. This time, Martin must bring home provisions.
        - id: ch01-b12
          speaker: narrator
          text: As Martin entered the town again, he met a rough-looking peasant dragging a cat behind him. A string was tied around the poor creature's neck.
        - id: ch01-b13
          speaker: martin
          text: Stop! Where are you taking that poor cat?
        - id: ch01-b14
          speaker: peasant
          text: I am going to drown him.
        - id: ch01-b15
          speaker: martin
          text: What has he done to deserve that?
        - id: ch01-b16
          speaker: peasant
          text: He killed one of my geese.
        - id: ch01-b17
          speaker: martin
          text: Please don't drown him. Sell him to me instead.
        - id: ch01-b18
          speaker: peasant
          text: I will not take less than a hundred florins.
        - id: ch01-b19
          speaker: martin
          text: Surely that is enough. Look, here is the money.
        - id: ch01-b20
          speaker: narrator
          text: The peasant pocketed the hundred florins, and Martin took the cat, whose name was Waska. At home, his mother met him once more.
        - id: ch01-b21
          speaker: mother
          text: Well, what have you brought this time?
        - id: ch01-b22
          speaker: martin
          text: I brought home Waska, this cat.
        - id: ch01-b23
          speaker: mother
          text: And what else did you bring?
        - id: ch01-b24
          speaker: martin
          text: Nothing. I had no money left for anything else.
        - id: ch01-b25
          speaker: mother
          emotion: angry
          text: You useless good-for-nothing! Get out of this house. Go and beg your bread from strangers!
        - id: ch01-b26
          speaker: narrator
          text: Martin did not dare argue with her. He called Schurka and Waska and left with them, heading toward the nearest village to look for work. On the road, he met a wealthy peasant, who asked where he was going.
        - id: ch01-b27
          speaker: martin
          text: I am looking for work as a day laborer.
        - id: ch01-b28
          speaker: rich_peasant
          text: Then come with me. I must warn you, though, that I pay no wages. Serve me faithfully for one year, and I promise it will be to your advantage.
        - id: ch01-b29
          speaker: narrator
          text: Martin agreed to those strange terms. For a whole year he worked diligently and served his master faithfully. Whatever the labor required, he never spared himself. At last, the day came for his service to be rewarded. Instead of counting out wages, the rich peasant led Martin into a barn. There he pointed to two full sacks standing side by side.
        - id: ch01-b30
          speaker: rich_peasant
          text: Choose whichever sack you want.
        - id: ch01-b31
          speaker: narrator
          text: Martin looked inside. One sack held silver, and the other held sand.
        - id: ch01-b32
          speaker: martin
          text: There must be a trick here. I had better choose the sand.
        - id: ch01-b33
          speaker: narrator
          text: He swung the sack onto his shoulders and went out into the world to seek fresh work.
    - id: ch02
      title: The Kingdom Under the Earth
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Martin walked on and on until he reached a vast, gloomy wood. In its heart, he came to a meadow where a fire was burning. A lovely young woman stood amid the flames, more beautiful than anyone Martin had ever seen. The moment she saw him, she called out.
        - id: ch02-b02
          speaker: serpent_princess
          emotion: fearful
          text: Martin, if you want to find happiness, save me! Use the sand you earned for your faithful service and put out these flames.
        - id: ch02-b03
          speaker: martin
          text: This sand is heavy, and saving a person's life is far better than carrying it on my back.
        - id: ch02-b04
          speaker: narrator
          text: He lowered the sack and poured the sand over the flames. The fire went out at once. But in that same instant, the lovely young woman became a serpent. She darted toward Martin, wound herself around his neck, and whispered gently into his ear.
        - id: ch02-b05
          speaker: serpent_princess
          text: Do not be frightened, Martin. I love you, and I will travel through the world with you. First, you must follow me bravely into my father's kingdom beneath the earth. Once we arrive, remember what I tell you. He will offer you gold, silver, and dazzling jewels. Do not touch any of them. Ask instead for the ring on his little finger. That ring holds magic power. Toss it from one hand to the other, and twelve young men will appear. Whatever you command, however difficult it may be, they will finish it in a single night.
        - id: ch02-b06
          speaker: narrator
          text: They set out together. After wandering a long way, they came to a place where a great rock rose straight out of the road. The serpent slipped from Martin's neck. As soon as she touched the damp ground, she became the lovely young woman again. She pointed to a hole in the rock, barely wide enough for a man to squeeze through.
        - id: ch02-b07
          speaker: narrator
          text: They squeezed through the opening and entered a long passage beneath the ground. They followed it until it opened suddenly onto a broad field, and above that field stretched a blue sky. In the center stood a magnificent castle built of porphyry. Its roof was made of gold, and its battlements glittered in the light. Martin's beautiful guide told him that this was her father's palace. From there, he lived and ruled over all his kingdom in the Underworld.
        - id: ch02-b08
          speaker: narrator
          text: They entered side by side, and the King welcomed them kindly. He turned first to his daughter.
        - id: ch02-b09
          speaker: underworld_king
          emotion: surprised
          text: My child, I had almost lost hope of ever seeing you again. Where have you been all these years?
        - id: ch02-b10
          speaker: serpent_princess
          text: Father, I owe my life to this young man. He saved me from a terrible death.
        - id: ch02-b11
          speaker: narrator
          text: The King faced Martin with a gracious smile.
        - id: ch02-b12
          speaker: underworld_king
          text: Your courage deserves a reward. Ask for whatever your heart desires. Take all the gold, silver, and precious stones you wish.
        - id: ch02-b13
          speaker: martin
          text: Thank you, mighty King, but I have no desire for gold, silver, or jewels. If you will grant me one favor, please give me the ring from your little finger. Whenever I look at it, I will remember Your Majesty's kindness. And when I marry, I will give it to my bride.
        - id: ch02-b14
          speaker: narrator
          text: The King removed the ring and placed it in Martin's hand.
        - id: ch02-b15
          speaker: underworld_king
          text: Take it, good young man, but on one condition. You must never tell anyone that this ring is magical. The moment you do, you will bring misfortune upon yourself.
        - id: ch02-b16
          speaker: narrator
          text: Martin thanked the King and returned by the road that had brought him into the Underworld. Once he reached the open air, he made his way home. His mother was still living in the old house, and the two of them settled down happily together. Their days passed so quietly that life seemed likely to continue that way forever. Then Martin decided he wanted to marry, and not just anyone. He wanted a King's daughter. Since he did not trust himself to do the courting, he chose to send his mother.
    - id: ch03
      title: The King's Impossible Command
      blocks:
        - id: ch03-b01
          speaker: martin
          text: You must go to the King and ask him to give me his lovely daughter's hand in marriage.
        - id: ch03-b02
          speaker: mother
          emotion: surprised
          text: My son, what can you be thinking? Why not marry someone of your own rank? That would suit you far better than sending a poor old woman to the royal court to ask for a Princess. Such a foolish errand could cost us both our heads!
        - id: ch03-b03
          speaker: martin
          text: Don't be afraid, little mother. Trust me, and all will be well. Just be sure you return with some kind of answer.
        - id: ch03-b04
          speaker: narrator
          text: His mother obeyed. She hobbled to the palace, crossed the courtyard without being stopped, and began climbing the steps to the royal audience chamber. At the top stood rows of courtiers in magnificent clothes. They stared at the strange old figure. They called down to her and made every possible sign to show that she was forbidden to climb those stairs.
        - id: ch03-b05
          speaker: narrator
          text: Their stern words and gestures did nothing. The old woman kept climbing, determined to carry out her son's command. At last, some courtiers seized her arms and held her back by force. She let out such a tremendous yell that the King heard it and stepped onto the balcony to discover what was happening.
        - id: ch03-b06
          speaker: narrator
          text: He saw the old woman waving her arms wildly and heard her scream that she would not leave until she had put her case before the King himself. So he ordered the courtiers to bring her into his presence. They conducted her into the golden audience chamber. The King sat there among cushions of royal purple, leaning back while his counselors and courtiers surrounded him. The old woman came forward, made a deep curtsy, and then stood silently before the throne until he spoke.
        - id: ch03-b07
          speaker: king
          text: Well, my good old woman, what can I do for you?
        - id: ch03-b08
          speaker: mother
          text: I have come on a matter of courtship, Your Majesty. Please don't be angry with me.
        - id: ch03-b09
          speaker: king
          emotion: angry
          text: Has this woman lost her senses?
        - id: ch03-b10
          speaker: mother
          text: If Your Majesty will hear me patiently and give me a plain answer, you will see that I have not. You have a lovely daughter who must marry. I have a son who wishes to marry her, and you will find no cleverer young man or better son-in-law in your kingdom. There is nothing he cannot do. So tell me plainly, Your Majesty. Will you give your daughter to my son?
        - id: ch03-b11
          speaker: narrator
          text: The King listened until the old woman had finished her strange request. With every passing moment, his face became darker and his expression more severe. Then a thought came to him. Was it worth the trouble for a King to become angry with one poor old fool? The hard lines around his mouth began to smooth away, and the frown left his brow. His counselors and courtiers watched in amazement. They expected fury, but instead he answered the old woman in a mild and mocking voice.
        - id: ch03-b12
          speaker: king
          text: If your son is truly as clever as you claim, let him build a magnificent castle opposite my palace windows in twenty-four hours. A bridge of pure crystal must join the two palaces. Trees must grow on both sides, bearing golden and silver apples, with birds of Paradise sitting among their branches. To the right of the bridge, he must build a church with five golden domes. There he will marry my daughter, and we will hold the wedding feast in his new castle.
        - id: ch03-b13
          speaker: king
          text: But if he fails to carry out my royal command, I will act as a just and gentle monarch. I will have both of you dipped first in tar and then in feathers. After that, you will be put to death in the marketplace for the amusement of my court.
        - id: ch03-b14
          speaker: narrator
          text: A smile played around the King's lips. The counselors and courtiers shook with laughter at the old woman's foolishness and praised the King's clever plan.
        - id: ch03-b15
          speakers: [courtier_1, courtier_2]
          ensemble: duo
          text: What a fine joke it will be to see them tarred and feathered! Her son could grow a beard on his palm as easily as he could finish that task in one day.
        - id: ch03-b16
          speaker: narrator
          text: The poor old woman was terrified. Her voice trembled when she spoke.
        - id: ch03-b17
          speaker: mother
          emotion: fearful
          text: Is that truly Your Majesty's will? Must I carry this command home to my poor son?
        - id: ch03-b18
          speaker: king
          text: Yes, old woman. That is my command. If your son succeeds, my daughter will be his reward. If he fails, you will both go to the tar barrel and the stake.
        - id: ch03-b19
          speaker: narrator
          text: The old woman wept bitterly all the way home. When she found Martin, she repeated the King's words between her sobs.
        - id: ch03-b20
          speaker: mother
          emotion: fearful
          text: Didn't I warn you to marry someone of your own rank? We would be better off if you had listened. I told you this visit could cost us our lives. Now they will cover us in tar and feathers and burn us in the public marketplace. How terrible!
        - id: ch03-b21
          speaker: martin
          emotion: calm
          text: Don't be frightened, little mother. Trust me, and you will see that everything will be well. Go to sleep with a peaceful mind.
        - id: ch03-b22
          speaker: narrator
          text: Martin stepped outside the hut and tossed his ring from one palm to the other. Twelve young men appeared at once and asked what work he required. Martin repeated the King's entire command.
        - id: ch03-b23
          speakers: [youth_1, youth_2, youth_3]
          ensemble: chorus
          text: By tomorrow morning, everything will stand exactly as the King ordered.
        - id: ch03-b24
          speaker: narrator
          text: When the King awoke the next morning and looked through his window, he could hardly believe his eyes. A magnificent castle stood directly opposite his own palace. Between them stretched a bridge made of pure crystal. Trees grew on both sides, and golden and silver apples hung from every branch. Birds of Paradise perched among the shining fruit. To the right of the bridge stood a splendid church. Its five golden domes gleamed in the sunlight, and its bells rang as though they meant to call people from every corner of the earth to come and look upon the wonder.
        - id: ch03-b25
          speaker: narrator
          text: The King would much rather have seen his future son-in-law covered in tar and feathers and burned at the stake. But he remembered his royal promise and had to accept what had happened. He made Martin a Duke, gave his daughter a rich dowry, and prepared the grandest wedding feast anyone had ever seen. Old people in that country still spoke of it years afterward.
    - id: ch04
      title: The Stolen Ring
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After the wedding, Martin and his royal bride moved into the magnificent new palace. Martin lived in comfort and luxury beyond anything he had ever imagined. He was happy from morning to night. The King's daughter was not. All day long, she brooded over the shame she felt at being made to marry a poor widow's son instead of a wealthy young prince from a foreign land. She became so unhappy that she thought of nothing but how to rid herself of the husband she did not want.
        - id: ch04-b02
          speaker: narrator
          text: First she had to discover the secret of his power. With soft praise and caresses, she tried to coax Martin into explaining how he could do anything in the world. At first, he refused to tell her. Then one day, when he was more willing to please her, she came to him with a winning smile. She spoke sweetly and gave him a strong, sugary potion to drink.
        - id: ch04-b03
          speaker: narrator
          text: Once he drank it, Martin could no longer keep the secret. He told her that all his power rested in the magic ring on his finger. He explained exactly how to use it, and while he was still speaking, he sank into a deep sleep. The Princess saw that her potion had worked. She slipped the ring from his finger, went into the courtyard, and tossed it from one palm to the other.
        - id: ch04-b04
          speaker: narrator
          text: The twelve young men appeared instantly and asked for her command.
        - id: ch04-b05
          speaker: princess
          text: Before morning, remove this castle, the crystal bridge, and the church. Put the poor hut where Martin once lived with his mother in their place. While he sleeps, carry my husband back to his old humble room. Then take me to the farthest end of the earth. An old King lives there who will welcome me into his palace and give me all the honor a royal Princess deserves.
        - id: ch04-b06
          speakers: [youth_1, youth_2, youth_3]
          ensemble: chorus
          text: Your command will be obeyed.
        - id: ch04-b07
          speaker: narrator
          text: The next morning, the King looked from his window and stared in astonishment. The palace, bridge, church, and trees had all disappeared. In their place stood one bare, miserable hut.
        - id: ch04-b08
          speaker: narrator
          text: The King immediately sent for his son-in-law and commanded him to explain what had happened. Martin stood before the royal father of his missing wife and looked at him, but he could not say a single word. The King became furious. He called his council together and laid three charges against Martin. He had practiced witchcraft, deceived his King, and somehow made away with the Princess. The council condemned him to imprisonment in a high stone tower. No food or drink was to reach him. He would remain there until starvation ended his life.
        - id: ch04-b09
          speaker: narrator
          text: In that desperate hour, his old friends Schurka and Waska remembered that Martin had once saved each of them from a cruel death. Now their master needed the same faithful help from them. The two animals took counsel together and tried to decide what they could do. Schurka growled and declared that he wanted to tear everyone to pieces. Waska did not answer at once. She purred thoughtfully, scratched the back of her ear with one velvet paw, and remained lost in thought. After several quiet minutes, she had made up her mind and turned to Schurka with a plan.
        - id: ch04-b10
          speaker: waska
          text: We will go into town together. As soon as we meet a baker, rush between his legs and knock the tray from his head. I will grab the rolls and carry them away to our master.
        - id: ch04-b11
          speaker: narrator
          text: They lost no time. The two faithful animals trotted into town and soon met a baker balancing a tray on his head. He looked from side to side as he called out his wares.
        - id: ch04-b12
          speaker: baker
          text: Fresh rolls and sweet cake! Fancy bread of every kind! Come and buy, come and take. You are sure to find just what you like!
        - id: ch04-b13
          speaker: narrator
          text: At that moment, Schurka dashed between the baker's legs. The man stumbled, the tray tipped over, and every roll fell to the ground. The furious baker chased Schurka while Waska dragged the rolls out of sight behind a bush. A moment later, Schurka joined her. Together they raced to the stone tower with the stolen bread.
        - id: ch04-b14
          speaker: narrator
          text: Waska was nimble enough to climb the outside of the tower. She reached the barred window and called through it anxiously.
        - id: ch04-b15
          speaker: waska
          emotion: fearful
          text: Master, are you still alive?
        - id: ch04-b16
          speaker: martin
          emotion: sad
          text: Barely. I have almost starved to death. I never dreamed I would end my life this way, dying of hunger.
        - id: ch04-b17
          speaker: waska
          emotion: calm
          text: Don't lose heart, dear master. Schurka and I will care for you.
        - id: ch04-b18
          speaker: narrator
          text: She climbed down and came back with one roll, then another, and then another, until she had carried up the whole trayful.
        - id: ch04-b19
          speaker: waska
          text: Dear master, Schurka and I are leaving for a distant kingdom at the very end of the earth. We are going to bring back your magic ring. Make these rolls last until we return.
        - id: ch04-b20
          speaker: narrator
          text: Waska said farewell to her beloved master. Then she and Schurka began their long journey.
    - id: ch05
      title: The King of the Mice
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: They traveled on and on, always searching to the right and left for some trace of the Princess. Whenever they found a track, they followed it as far as they could. They questioned every cat and dog they met along the way. They also listened carefully to the talk of every traveler who passed them on the road. At last, word reached them that the kingdom at the utmost ends of the earth, where the twelve young men had carried the Princess, was no longer very far away. One day, after all that searching and travel, they finally entered the distant kingdom.
        - id: ch05-b02
          speaker: narrator
          text: Schurka and Waska went directly to the palace. They made friends with all the cats and dogs there and asked each of them about the Princess and the magic ring. None of the animals could tell them very much. Then, one day, Waska went down into the palace cellar to hunt mice and rats. She spotted one mouse that was especially fat and well fed. She sprang, buried her claws in his soft fur, and was about to swallow him when the little creature begged for mercy.
        - id: ch05-b03
          speaker: mouse_king
          emotion: fearful
          text: Spare my life, and I may be very useful to you! I will do everything in my power to help. I am the King of the Mice. If I die, the whole race of mice will die with me.
        - id: ch05-b04
          speaker: waska
          text: Very well. I will let you live, but first you must serve me. A Princess lives in this castle. She is the wicked wife of my dear master, and she stole his magic ring. You must take it from her, whatever it costs. Do you understand? My claws will stay in your fur until the ring is found.
        - id: ch05-b05
          speaker: mouse_king
          text: Agreed. I will do as you ask.
        - id: ch05-b06
          speaker: narrator
          text: Still held beneath Waska's claws, the Mouse King summoned every mouse in his kingdom. Countless mice gathered around him, large and small, brown and gray, until they formed a circle.
        - id: ch05-b07
          speaker: mouse_king
          text: My dear and faithful subjects, I am in danger of a cruel death. Whoever steals the magic ring from the strange Princess will set me free. That mouse will be honored above every other mouse in my kingdom.
        - id: ch05-b08
          speaker: narrator
          text: A tiny mouse stepped forward at once.
        - id: ch05-b09
          speaker: tiny_mouse
          text: At night, I often creep around the Princess's bedroom. She owns a ring that she guards more closely than anything else. She wears it on her finger all day, and when she sleeps, she keeps it inside her mouth. I will steal it for you, Sire.
        - id: ch05-b10
          speaker: narrator
          text: The tiny mouse hurried to the Princess's room and waited for darkness. When the Princess had fallen asleep, the mouse climbed onto her bed. It gnawed a hole in her pillow and pulled out the little down feathers one at a time. Then it scattered them beneath her nose.
        - id: ch05-b11
          speaker: narrator
          text: The soft fluff rose beneath the sleeping Princess and flew into her nose and mouth. She started awake with a fit of sneezing and coughing. The ring slipped from her mouth and fell onto the coverlet. Before she could recover, the tiny mouse seized it and raced away. The brave little creature carried the ring straight to Waska as the ransom for the King of the Mice. Waska lifted her claws, and the Mouse King went free.
        - id: ch05-b12
          speaker: narrator
          text: With the magic ring safely in their care, Waska and Schurka left the palace. They traveled by day and through the night, hurrying all the way back toward the high stone tower where Martin lay imprisoned.
    - id: ch06
      title: Music in the Starvation Tower
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: When they reached the tower, Waska climbed its wall and made her way to the barred window once again.
        - id: ch06-b02
          speaker: waska
          emotion: fearful
          text: Martin, dear master, are you still alive?
        - id: ch06-b03
          speaker: martin
          emotion: sad
          text: Waska, my faithful little cat, is that really you? I am dying of hunger. I have not eaten a bite for three days.
        - id: ch06-b04
          speaker: waska
          emotion: happy
          text: Take heart, dear master. From today on, you will know only happiness and good fortune. If this were a time for riddles, I would make you guess what Schurka and I brought back. Just think of it. We found your ring!
        - id: ch06-b05
          speaker: narrator
          text: Martin's joy had no limit. He stroked Waska lovingly, and she rubbed against him and purred. Far below, Schurka leaped into the air and barked with delight. Martin took the ring and tossed it from one hand to the other. At once, the twelve young men appeared and asked for his command.
        - id: ch06-b06
          speaker: martin
          text: First, bring me food and drink as quickly as you can. Then bring musicians here, and let us have music all day long.
        - id: ch06-b07
          speaker: narrator
          text: Soon music floated from the tower over the town and palace. The people were filled with amazement. Martin was supposed to be dying of starvation, yet he seemed to be making merry over a feast. Along with the music came the clatter of plates and glasses, knives and forks. The melodies themselves were so sweet and enchanting that people passing the tower forgot where they were going. One after another, they stopped in the street simply to listen.
        - id: ch06-b08
          speaker: narrator
          text: The townspeople hurried to the palace with their news. Witchcraft must be at work in Martin's tower, they said, because a starving prisoner could not possibly be holding such a feast. The King sent a messenger there at once to discover the truth. What the messenger saw and heard astonished him so completely that he stood rooted to the spot. When he did not return with an answer, the King sent his chief counselors. They, too, were transfixed with wonder. At last, the King went to the tower himself, and the beauty of the music held him spellbound just as it had held everyone else.
    - id: ch07
      title: The Palace Restored
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Martin summoned the twelve young men again and gave them one final command.
        - id: ch07-b02
          speaker: martin
          text: Raise my castle once more, and join it to the King's palace with a crystal bridge. Restore the trees with their golden and silver apples, and put the birds of Paradise back among the branches. Rebuild the church with its five golden domes. Let the bells ring out and call the people from all four corners of the kingdom. There is one more thing. Bring back my faithless wife and lead her into the women's chamber.
        - id: ch07-b03
          speaker: narrator
          text: Everything was done exactly as Martin commanded. Once again, the castle rose beside the royal palace, and the crystal bridge joined them. The trees, shining fruit, and wondrous birds returned. The church stood beneath its five golden domes, and its bells called across the kingdom. Martin left the Starvation Tower, took the King, his father-in-law, by the arm, and led him into the restored palace. There sat the Princess in the women's chamber, trembling with fear as she waited to die.
        - id: ch07-b04
          speaker: martin
          text: King and royal father, your daughter has caused me great suffering. What punishment should she receive?
        - id: ch07-b05
          speaker: king
          emotion: calm
          text: My beloved Prince and son-in-law, if you love me, let mercy take the place of anger. Forgive my daughter and welcome her back into your heart.
        - id: ch07-b06
          speaker: narrator
          text: Martin's heart softened, and he forgave his wife. From then on, they lived happily together. His old mother came to live with him. He never parted from Schurka or Waska, and you may be sure that he never again allowed the magic ring to leave his possession.
