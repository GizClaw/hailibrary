audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的机智与克制, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    prince:
      display_name: 王子
      tts: {delivery: 自尊而果断，伪装时朴实沉着, timbre: 清亮年轻, pace: 适中, pitch: 中音}
    princess:
      display_name: 公主
      tts: {delivery: 娇纵任性，见到新奇玩意时兴奋急切, timbre: 明亮娇嫩, pace: 稍快, pitch: 中高音}
    old_queen:
      display_name: 老王后
      tts: {delivery: 沉着精明，心里早有主意, timbre: 温和成熟, pace: 从容, pitch: 中低音}
  chapters:
    - id: ch01
      title: 寻找真正的公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有位王子一心想娶公主，而且非得是真正的公主才行。他为此走遍了全世界，也遇见过不少公主。可是每一位身上，总有一点小小的缺憾。他始终没法断定，对方到底是不是真正的公主。看来，他还没有找到真正的那一位。到头来，他只好失望地回了家，心里别提多难过了。
        - id: ch01-b02
          speaker: narrator
          text: 一天夜里，暴风雨突然来了。雷声震耳，闪电一道接一道，雨水成片地往下泼，实在吓人。就在这时，宫门被人敲响了，老国王亲自过去开门。
    - id: ch02
      title: 风雨中的来客
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 门外站着一位公主。她被风雨淋得狼狈极了，水顺着头发和衣裙一直流进鞋尖，又从鞋跟淌出来。可她仍然说，自己就是一位真正的公主。
        - id: ch02-b02
          speaker: old_queen
          text: 是不是真的，我们马上就知道了！
        - id: ch02-b03
          speaker: narrator
          text: 老王后心里这么想着，嘴上却什么也没说。她走进卧室，先把床上的被褥全拿掉，在床板上放了一粒豌豆。然后，她往上铺了二十床褥子，又盖上二十床鸭绒被。那天晚上，公主就睡在这张床上。
    - id: ch03
      title: 一夜没有合眼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天一早，大家问公主，昨夜睡得好不好。
        - id: ch03-b02
          speaker: princess
          text: 哎呀，别提了，简直糟透了！我一夜几乎没合眼。床上不知放了什么，硬邦邦地硌着我，弄得我浑身青一块紫一块。太可怕了！
        - id: ch03-b03
          speaker: narrator
          text: 这下，大家知道她确实是真正的公主了。隔着二十床褥子和二十床鸭绒被，她居然还能感觉到那粒豌豆。除了真正的公主，谁还会这样娇嫩敏感呢？
    - id: ch04
      title: 千真万确的故事
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王子终于确定，自己找到了真正的公主，于是便娶了她。至于那粒豌豆，它后来被送进王家博物馆。要是没人把它偷走，你现在去那里，还能亲眼看到呢。
        - id: ch04-b02
          speaker: narrator
          text: 所以说，这个故事可是千真万确的。
