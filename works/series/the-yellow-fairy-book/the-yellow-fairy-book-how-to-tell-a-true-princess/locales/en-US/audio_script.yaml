  chapters:
    - id: ch01
      title: A Princess in the Storm
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a Prince who wanted to marry a Princess, but she had to be a true Princess. He traveled all over the world to find one. There were plenty of Princesses, yet something was wrong with every one of them. He could never be sure that any of them was genuine.
        - id: ch01-b02
          speaker: narrator
          text: At last, he came home feeling very low. He had wanted a true Princess so dearly.
        - id: ch01-b03
          speaker: narrator
          text: Then, one night, a dreadful storm broke over the palace. Thunder crashed, lightning flashed, and rain poured down in torrents. In the middle of it all, someone knocked at the palace gate. The old King went to open it.
        - id: ch01-b04
          speaker: narrator
          text: A Princess stood outside, soaked by the storm. Water ran from her hair and dress, down into the toes of her shoes, and out again at the heels. Even in that sad state, she said she was a true Princess.
    - id: ch02
      title: The Queen's Test
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The old Queen thought they would soon find out whether the visitor was telling the truth. But she said nothing.
        - id: ch02-b02
          speaker: narrator
          text: The old Queen kept that thought to herself. She went into the bedroom, stripped all the bedding away, and placed a pea at the very bottom of the bed.
        - id: ch02-b03
          speaker: narrator
          text: Over the pea, she piled twenty mattresses. Over those, she laid twenty soft eiderdown quilts. That was the bed prepared for the Princess.
    - id: ch03
      title: A Sleepless Night
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next morning, they asked the Princess how she had slept.
        - id: ch03-b02
          speaker: princess
          text: Oh, I slept terribly! I hardly closed my eyes all night. I don't know what was in that bed, but I was lying on something so hard that my whole body is black and blue. It was dreadful!
        - id: ch03-b03
          speaker: narrator
          text: Then they knew she was a true Princess. She had felt the pea through twenty mattresses and twenty eiderdown quilts. No one but a true Princess could be so sensitive.
    - id: ch04
      title: The True Princess
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: So the Prince married her. At last, he knew he had found a true Princess.
        - id: ch04-b02
          speaker: narrator
          text: The pea was placed in the Royal Museum, where it may still be seen, unless someone has stolen it.
        - id: ch04-b03
          speaker: narrator
          text: And that is a true story.
