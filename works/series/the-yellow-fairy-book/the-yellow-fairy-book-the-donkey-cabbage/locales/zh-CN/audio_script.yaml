audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    hunter:
      display_name: 猎人
      tts:
        delivery: 坦率爽朗，受骗后转为机警坚定
        timbre: 年轻清亮
        pace: 适中
        pitch: 中音
    wise_woman:
      display_name: 智慧的老妇人
      tts:
        delivery: 慈祥神秘，说话笃定而意味深长
        timbre: 苍老柔和
        pace: 舒缓
        pitch: 中低音
    witch:
      display_name: 女巫
      tts:
        delivery: 贪婪强硬，发号施令时冷厉逼人
        timbre: 苍老沙哑
        pace: 稍缓
        pitch: 低音
    maiden:
      display_name: 姑娘
      tts:
        delivery: 温柔迟疑，受逼迫时藏着不安
        timbre: 柔美清澈
        pace: 适中
        pitch: 中高音
    first_giant:
      display_name: 第一个巨人
      tts:
        delivery: 粗鲁好奇，语气漫不经心
        timbre: 粗厚低沉
        pace: 稍缓
        pitch: 低音
    second_giant:
      display_name: 第二个巨人
      tts:
        delivery: 凶狠短促，毫无耐心
        timbre: 浑厚粗粝
        pace: 稍快
        pitch: 低音
    third_giant:
      display_name: 第三个巨人
      tts:
        delivery: 傲慢轻蔑，说话懒洋洋
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
    servant:
      display_name: 女仆
      tts:
        delivery: 朴实自然，语气轻快直接
        timbre: 清脆朴素
        pace: 适中
        pitch: 中高音
    miller:
      display_name: 磨坊主
      tts:
        delivery: 爽快务实，说话直截了当
        timbre: 粗实温和
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 老妇人的礼物
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个年轻猎人，胆子很大，心也快活。有一天，他独自走进森林，一路吹着口哨。一个模样丑陋的老妇人迎面走来。
        - id: ch01-b02
          speaker: wise_woman
          text: 你好啊，亲爱的猎人！你这么自在，我却又饿又渴。能不能施舍一点东西给我？
        - id: ch01-b03
          speaker: narrator
          text: 猎人可怜她，把口袋里能省下的钱全给了她。他刚要离开，老妇人又叫住他。
        - id: ch01-b04
          speaker: wise_woman
          text: 先听我说完。你有一副好心肠，我也要送你礼物。再往前走一会儿，你会看到九只鸟在树上争一件斗篷。朝鸟群中间开枪，它们就会把斗篷丢下来，其中一只鸟会中弹死去。那是如意斗篷，披在肩上，只要想着一个地方，眨眼就能到。你再挖出死鸟的心，整个吞下。以后每天早晨，枕头底下都会有一枚金币。
        - id: ch01-b05
          speaker: narrator
          text: 猎人谢过老妇人，心里又惊又喜，只盼她许下的那些好东西能够应验。他才走出大约一百码，头顶的树枝间就响起一片尖叫和鸟鸣。抬头一看，一群鸟正用嘴啄、用爪子扯一块布，又拉又拽，打成一团。每一只都像是非要把它抢到手不可。
        - id: ch01-b06
          speaker: hunter
          text: 真奇怪！老妇人说的事竟然全在眼前。
        - id: ch01-b07
          speaker: narrator
          text: 他端起枪，扣动扳机，朝鸟群正中开了一枪。羽毛顿时四散飞开，鸟儿们尖叫着逃走，只有一只死在地上。那件斗篷也轻飘飘地落了下来。猎人一件一件照老妇人的话去做。他剖开死鸟，找到那颗心，整个吞下，又带着斗篷回了家。
        - id: ch01-b08
          speaker: narrator
          text: 第二天醒来，他想起老妇人的许诺，连忙掀起枕头。下面果然闪着一枚金币。再过一天，又有一枚。此后每个早晨，只要他一起床，就能找到新的金币。金子越积越多，堆成了一大堆。他却渐渐觉得，守着这些金子待在家里，实在没有什么意思。
        - id: ch01-b09
          speaker: hunter
          text: 有这么多金子，却哪儿也不去，又有什么用？我要出门走走，好好看看这个世界。
        - id: ch01-b10
          speaker: narrator
          text: 于是，他告别父母，背上猎囊和猎枪，踏上了旅途。
    - id: ch02
      title: 城堡里的骗局
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，猎人穿过一片密林，看见平原上立着一座大城堡。一扇窗前有个老妇人，身边站着一位美丽极了的姑娘。那老妇人其实是女巫。她一眼就看出了猎人的秘密。
        - id: ch02-b02
          speaker: witch
          text: 宝贝女儿，从树林里出来的那个人，身体里藏着一件神奇宝物。那颗鸟心会让他的枕头下面每天出现一枚金币。这样的东西本来就该归咱们。你得照我的办法，把它哄过来。
        - id: ch02-b03
          speaker: narrator
          text: 女巫把计策一步步教给女儿，告诉她怎样把鸟心弄到手，又该怎样哄骗猎人。最后，她还恶狠狠地威胁姑娘，要是不服从，一定会吃苦头。猎人走近城堡，看到了窗前那张美丽的脸。他嘴上说自己只是想歇脚，心却早已被姑娘留住了。
        - id: ch02-b04
          speaker: hunter
          text: 已经走了这么远，就到这座美丽的城堡歇一歇吧。反正我有的是钱。
        - id: ch02-b05
          speaker: narrator
          text: 其实，真正留住他的是那位姑娘。城堡里的人热情接待了猎人。不久，他便爱姑娘爱得什么都顾不上了，只想看着她。姑娘无论想要什么，他都会答应。
        - id: ch02-b06
          speaker: witch
          text: 时候到了，该把鸟心取出来了。放心，它离开身体时，他根本察觉不到。
        - id: ch02-b07
          speaker: narrator
          text: 女巫调好药水，倒进高脚杯，让女儿端给猎人。
        - id: ch02-b08
          speaker: maiden
          text: 亲爱的，就为了我，把这杯酒喝下去吧。
        - id: ch02-b09
          speaker: narrator
          text: 猎人毫不怀疑，接过高脚杯，把药水一口喝完。鸟心马上从他嘴里冒了出来。姑娘不能让他发觉，便悄悄接住，照母亲的吩咐，自己吞了下去。从此，金币不再出现在猎人的枕下，而是每天落在姑娘的枕下。可猎人中了魔法，又爱她爱得神魂颠倒，还是整天陪在她身边，别的什么也不想。
        - id: ch02-b10
          speaker: witch
          text: 鸟心有了，那件如意斗篷也不能留下。你得把它拿来。
        - id: ch02-b11
          speaker: maiden
          text: 就把斗篷留给他吧。他已经没有那些金币了！
        - id: ch02-b12
          speaker: witch
          text: 这种宝物世上少有，我非拿到不可！你再敢不听话，我一定重重罚你。
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 女巫打了女儿一顿。姑娘没有办法，只好依从。一天，她站在窗边，远远望着外面，装出忧伤的样子。
        - id: ch02-b14
          speaker: hunter
          text: 你怎么一个人站在这里？为什么这样难过？
        - id: ch02-b15
          speaker: maiden
          text: 亲爱的，那边有一座花岗岩山，山上长满珍贵的宝石。我太想去看一看了，每次想起就难过。可只有鸟儿飞得到，人怎么可能过去呢？
        - id: ch02-b16
          speaker: hunter
          text: 原来你只为这件事发愁。别担心，我马上就能带你去。
        - id: ch02-b17
          speaker: narrator
          text: 猎人用斗篷把姑娘裹好，心里许下愿望。眨眼之间，两人已经坐在花岗岩山上。昂贵的宝石长满四周，闪出的光芒明亮耀眼，看着真叫人喜欢。他们东挑西选，把最美、最珍贵的宝石收拢在一起。这时，女巫借姑娘的手施了法，猎人的眼皮越来越沉，连双脚也快支撑不住了。
        - id: ch02-b18
          speaker: hunter
          text: 我累得站不住了。咱们坐一会儿，让我歇歇吧。
        - id: ch02-b19
          speaker: narrator
          text: 猎人枕着姑娘的腿睡着了。等他睡熟，姑娘解下他肩上的斗篷，披到自己身上，许愿回了城堡，把猎人和满山宝石全都抛在身后。
    - id: ch03
      title: 云下的菜园
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 猎人一觉睡足，睁开眼睛，才明白心爱的人背叛了自己。她不但带走了斗篷，还把他孤零零留在这座荒凉的山上。猎人满心都是悲苦，却想不出任何离开的办法，只能坐在那里发愁。
        - id: ch03-b02
          speaker: hunter
          text: 唉，世上的人为什么这样不守信？
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: 这座山属于一群凶猛的巨人。他们住在这里，也在这里做买卖。没过多久，三个高大的巨人朝猎人走来。猎人急忙躺下，假装睡得很沉。
        - id: ch03-b04
          speaker: first_giant
          text: 地上这条小蚯蚓是什么东西？
        - id: ch03-b05
          speaker: second_giant
          text: 管他是什么，一脚踩死！
        - id: ch03-b06
          speaker: third_giant
          text: 为他费力气可不值得。让他活着吧。他不可能留在山上，只要往高处爬，云彩自然会把他卷走。
        - id: ch03-b07
          speaker: narrator
          text: 巨人们一边说，一边渐渐走远了。他们不知道，猎人躺在地上，把每句话都听得一清二楚。等他们消失，猎人马上站起来，向山顶爬去。他刚在那里坐了一会儿，一朵云便飘过来，将他卷到空中。云带着他在天上走了许久，才慢慢沉下去，停在一座围着高墙的大菜园上空。猎人平安落地，身边全是卷心菜和别的蔬菜。
        - id: ch03-b08
          speaker: hunter
          text: 要是能找到吃的就好了。我饿坏了，可这里没有苹果，没有梨，什么水果也没有，只有一园子蔬菜。实在不行，生菜也能填肚子。虽然没多好吃，至少能让我恢复些力气。
        - id: ch03-b09
          speaker: narrator
          text: 他四处寻找，挑了一棵长得不错的菜。才吃下几口，身体就变得古怪起来。身上冒出四条腿，脑袋变得又粗又大，头顶还长出两只长耳朵。猎人惊恐地看着自己的模样，这才发现，他已经彻底变成了一头驴。可肚子还是很饿。那鲜嫩多汁的菜，对现在的他来说又格外可口，他非但没有停下，反而越吃越香。
        - id: ch03-b10
          speaker: narrator
          text: 接着，他吃到了另一种卷心菜。菜刚咽下去，身体又开始变化，他重新成了人。猎人躺下睡了一觉。第二天早晨，他从两种卷心菜上各掰下一棵菜头。
        - id: ch03-b11
          speaker: hunter
          text: 有了这两棵菜，我就能拿回自己的东西，也能叫背叛我的人得到惩罚。
        - id: ch03-b12
          speaker: narrator
          text: 他带上菜头，翻过围墙，去找姑娘的城堡。走了两天，他顺利找到了那里。他把脸涂成棕色，弄得连亲生母亲也认不出来，然后走进城堡，请求借宿。
        - id: ch03-b13
          speaker: hunter
          text: 我累得一步也走不动了，请让我在这里住一晚吧。
        - id: ch03-b14
          speaker: witch
          text: 你这个乡下人，到底是谁？又来这里做什么？
        - id: ch03-b15
          speaker: hunter
          text: 我是国王派出的使者，奉命去寻找天底下最好的生菜。现在菜已经找到了，可太阳太烈，娇嫩的叶子快要蔫掉。我真不知道还能不能把它继续带下去。
        - id: ch03-b16
          speaker: narrator
          text: 女巫一听，馋得立刻想尝。
        - id: ch03-b17
          speaker: witch
          text: 亲爱的乡下人，先让我尝一尝这神奇的生菜吧。
        - id: ch03-b18
          speaker: hunter
          text: 当然可以。我带了两棵，正好送给你一棵。
    - id: ch04
      title: 三头驴
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 猎人打开袋子，把坏卷心菜交给女巫。女巫没有起半点疑心。她一想到这道从没尝过的新鲜菜肴，就馋得直流口水，干脆亲自到厨房里料理。菜刚做好，她连端上桌都等不及，抓起两片叶子塞进嘴里。叶子一咽下去，她就失去人的模样，变成一头驴，跑进了院子。
        - id: ch04-b02
          speaker: narrator
          text: 随后，女仆走进厨房，看见菜已经做好，便端起来准备送上楼。走到半路，她照老习惯，先尝了两片叶子。魔法马上发作，女仆也变成一头驴，跑出去和老女巫待在一起，盛着生菜的盘子则掉在了地上。屋里的人还不知道厨房发生了什么。
        - id: ch04-b03
          speaker: narrator
          text: 那时，猎人正陪姑娘坐着。菜迟迟没有送来，姑娘已经等不及了。
        - id: ch04-b04
          speaker: maiden
          text: 真奇怪，那盘生菜到底到哪儿去了？
        - id: ch04-b05
          speaker: narrator
          text: 猎人猜到卷心菜已经显灵。
        - id: ch04-b06
          speaker: hunter
          text: 我去厨房看看，亲自替你取来。
        - id: ch04-b07
          speaker: narrator
          text: 他到了厨房，看见两头驴在院子里乱跑，生菜却撒在地上。
        - id: ch04-b08
          speaker: hunter
          text: 很好，已经有两个吃到了自己那一份！
        - id: ch04-b09
          speaker: narrator
          text: 猎人捡起剩下的菜叶，放回盘中，端到姑娘面前。
        - id: ch04-b10
          speaker: hunter
          text: 这道好菜，我亲自给你送来了。现在不用再等了。
        - id: ch04-b11
          speaker: narrator
          text: 姑娘吃下菜叶，也立刻失去人的模样，变成一头驴，跑进院子。猎人洗掉脸上的棕色，让她们认出自己，随后走到三头驴面前。
        - id: ch04-b12
          speaker: hunter
          text: 你们背叛了我，现在该领到自己的报偿了。
        - id: ch04-b13
          speaker: narrator
          text: 他用一根绳子拴住三头驴，把它们赶到一座磨坊。猎人敲了敲窗子，磨坊主探出头来，问他有什么事。
        - id: ch04-b14
          speaker: hunter
          text: 我有三头讨厌的牲口，不愿再养。你要是肯收下，给它们饭吃，给它们棚子住，再照我的吩咐管教，我愿意付给你任何数目的钱。
        - id: ch04-b15
          speaker: miller
          text: 没问题。你想让我怎么管它们？
        - id: ch04-b16
          speaker: narrator
          text: 猎人把三头驴的待遇交代得清清楚楚。最老的驴原本是女巫，每天要挨三顿打，只吃一顿饭。年轻些的驴原本是女仆，每天挨一顿打，吃三顿饭。最年轻的驴就是姑娘，不许打，也要吃三顿饭。姑娘虽然背叛过他，猎人终究还是狠不下心，不肯让她受鞭打。
    - id: ch05
      title: 失而复得
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 猎人独自回到城堡，在那里找到了自己需要的一切。几天以后，磨坊主赶来报告三头驴的情形。
        - id: ch05-b02
          speaker: miller
          text: 那头每天挨三顿打、只能吃一顿饭的老驴已经死了。另外两头每天都有三顿饭，倒还活着，可它们伤心得不得了，恐怕也撑不了多久。
        - id: ch05-b03
          speaker: narrator
          text: 猎人听完以后，终于可怜起她们来，心里的怒气也消了。他让磨坊主把两头驴赶回城堡。等她们到了，猎人拿出好卷心菜，让她们吃下。魔法解除了，两头驴重新恢复了人的模样。美丽的姑娘一见猎人，立刻跪倒在他面前。
        - id: ch05-b04
          speaker: maiden
          text: 亲爱的，请原谅我做下的坏事！全是母亲逼我的，我并不愿意那样做。我是真心爱你的。你的如意斗篷挂在柜子里。那颗鸟心，我也能调一杯药水还给你。
        - id: ch05-b05
          speaker: narrator
          text: 猎人听完，却改变了主意。
        - id: ch05-b06
          speaker: hunter
          text: 鸟心留在你那里吧。反正没有分别，因为我要娶你，让你做我亲爱而忠贞的妻子。
        - id: ch05-b07
          speaker: narrator
          text: 于是，他们举行了婚礼。从那以后，两个人幸福地生活在一起，直到生命尽头。
