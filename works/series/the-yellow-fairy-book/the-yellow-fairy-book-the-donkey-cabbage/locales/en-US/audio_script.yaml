  chapters:
    - id: ch01
      title: The Gifts in the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a young hunter who went boldly into the forest, whistling as he walked. His heart was merry and light. Along the way, he met an ugly old woman.
        - id: ch01-b02
          speaker: wise_woman
          text: Good day, dear hunter. You look happy and content, but I am hungry and thirsty. Could you spare me a little something?
        - id: ch01-b03
          speaker: narrator
          text: The hunter felt sorry for her. He reached into his pocket and gave her all he could spare. He was about to go on when she stopped him.
        - id: ch01-b04
          speaker: wise_woman
          text: Listen carefully, dear hunter. Your kind heart deserves a gift. Soon you will come to a tree where nine birds are fighting over a cloak. Shoot into the middle of them. They will drop the cloak, and one bird will fall dead. Take the cloak. It is a wishing-cloak. Put it around your shoulders, wish for any place, and you will be there in the blink of an eye. Then take the dead bird's heart and swallow it whole. Every morning after that, you will find a gold piece beneath your pillow.
        - id: ch01-b05
          speaker: narrator
          text: The hunter thanked the wise woman. As he walked away, he wondered whether such splendid promises could possibly come true. About a hundred yards farther on, screams and chirps sounded above him. He looked up and saw nine birds in the branches. They were tearing at a cloak with their beaks and claws. They shrieked, pulled, and fought as though each bird meant to keep it for itself.
        - id: ch01-b06
          speaker: hunter
          text: Well, this is a wonder. Everything is just as the old woman said.
        - id: ch01-b07
          speaker: narrator
          text: He raised his gun and fired into their midst. Feathers flew everywhere. The flock scattered with loud cries, but one bird dropped dead, and the cloak floated to the ground. The hunter cut open the bird, found its heart, swallowed it, and carried the cloak home.
        - id: ch01-b08
          speaker: narrator
          text: When he woke the next morning, he remembered the promise and wondered whether it had come true. He lifted his pillow, and there lay a shining gold piece. Another appeared the following morning, and another every morning after that. He gathered them until he had a heap of gold.
        - id: ch01-b09
          speaker: hunter
          text: What use is all this gold if I only stay at home? I want to travel and see something of the world.
        - id: ch01-b10
          speaker: narrator
          text: So he said farewell to his parents, slung his hunting bag and gun over his shoulder, and set out into the world.
    - id: ch02
      title: The Castle and the Bird-Heart
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day the hunter passed through a thick wood. Beyond it, a great castle stood on the plain. An old woman was looking from one window, with a beautiful maiden beside her. The old woman was a witch. The moment she saw the traveler, she knew what treasure he carried inside him.
        - id: ch02-b02
          speaker: witch
          text: That man has a marvelous treasure in his body, my darling daughter, and we must take it. We have more right to it than he does. He carries a bird's heart, and because of it, a gold piece appears beneath his pillow every morning.
        - id: ch02-b03
          speaker: narrator
          text: The witch explained how her daughter must coax the heart from him. At last she angrily threatened the girl with punishment if she refused.
        - id: ch02-b04
          speaker: narrator
          text: As the hunter approached, he saw the maiden's lovely face. He told himself that he had traveled far enough for one day and could afford to rest at such a fine castle. But the truth was that the maiden had drawn him there.
        - id: ch02-b05
          speaker: narrator
          text: He entered the house and was welcomed with kindness and generous food. Before long, he had fallen so deeply in love with the witch's daughter that he could think of nothing else. He spent all his time looking into her eyes, and whatever she wanted, he gladly did.
        - id: ch02-b06
          speaker: witch
          text: Now we must get the bird-heart. He will never feel it leave him.
        - id: ch02-b07
          speaker: narrator
          text: The witch prepared a drink and poured it into a goblet. She gave it to her daughter, who carried it to the hunter.
        - id: ch02-b08
          speaker: maiden
          text: Drink to me, my dearest.
        - id: ch02-b09
          speaker: narrator
          text: He emptied the goblet. At once, the bird-heart came out of his mouth. The maiden secretly caught it and swallowed it herself, just as her mother had ordered. From then on, no gold appeared beneath the hunter's pillow. Instead, the gold lay beneath the maiden's. Yet he was so much in love and so completely bewitched that he noticed nothing beyond his wish to stay beside her.
        - id: ch02-b10
          speaker: witch
          text: We have the bird-heart. Now we must take his wishing-cloak as well.
        - id: ch02-b11
          speaker: maiden
          text: Let him keep that. He has already lost his wealth.
        - id: ch02-b12
          speaker: witch
          text: A cloak like that is a rare wonder. I must have it, and I will have it.
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: The witch beat her daughter and warned that worse would follow unless she obeyed. So one day the maiden stood at the window and stared sadly into the distance.
        - id: ch02-b14
          speaker: hunter
          text: Why are you standing there looking so unhappy?
        - id: ch02-b15
          speaker: maiden
          text: Oh, my love, the granite mountain lies far away over there. Precious stones grow upon it, and I long to see them. But who could ever bring me there? Only birds can fly so far. A man never could.
          emotion: sad
        - id: ch02-b16
          speaker: hunter
          text: If that is all that troubles you, I can easily put your heart at ease.
        - id: ch02-b17
          speaker: narrator
          text: He wrapped the wishing-cloak around them both and wished them onto the granite mountain. In an instant, they were sitting upon it. Precious stones glittered so brightly on every side that it was a pleasure simply to see them. Together they gathered the most beautiful and costly stones. Then the old witch worked through her daughter and made the hunter's eyes grow heavy.
        - id: ch02-b18
          speaker: hunter
          text: Let us sit and rest for a while. I am so tired I can hardly stay on my feet.
        - id: ch02-b19
          speaker: narrator
          text: He rested his head in the maiden's lap and fell asleep. Once she knew he was sleeping soundly, she loosened the cloak from his shoulders and put it around herself. She left the stones and the mountain behind and wished herself home.
    - id: ch03
      title: The Mountain and the Cabbages
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the hunter woke, he found himself alone on the wild mountain. The woman he loved had betrayed him.
        - id: ch03-b02
          speaker: hunter
          text: Oh, why is there so much faithlessness in the world?
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: He sat there in sorrow and trouble, with no idea what to do. The mountain belonged to fierce, enormous giants who lived and traded there. Before long, he saw three of them striding toward him. He quickly lay down as though he had fallen into a deep sleep.
        - id: ch03-b04
          speaker: narrator
          text: The first giant nudged him with one great foot.
        - id: ch03-b05
          speaker: giant_1
          text: What kind of earthworm is this?
        - id: ch03-b06
          speaker: giant_2
          text: Crush him to death.
        - id: ch03-b07
          speaker: giant_3
          text: He is not worth the trouble. Let him live. He cannot stay here, and if he climbs any higher, the clouds will catch him and carry him away.
        - id: ch03-b08
          speaker: narrator
          text: The giants went on their way, never knowing that the hunter had heard every word. As soon as they were gone, he climbed to the summit. He had not been sitting there long when a cloud swept past, caught him up, and carried him through the sky.
        - id: ch03-b09
          speaker: narrator
          text: For a time the cloud traveled across the sky. Then it sank low and hovered above a large vegetable garden surrounded by walls. It set him safely on the ground among cabbages and other vegetables. The hunter looked all around him.
        - id: ch03-b10
          speaker: hunter
          text: If only there were something here to eat. I am terribly hungry, and I see no apples, pears, or any other fruit. There are vegetables everywhere, and nothing else.
        - id: ch03-b11
          speaker: narrator
          text: At last he decided that, in such need, he could eat a little salad. It might not taste very good, but it would refresh him. He chose a fine head of cabbage and began to eat. After only a few mouthfuls, a strange feeling came over him. Four legs grew from his body. His head became thick, and two long ears rose above it. To his horror, he had turned into a donkey.
        - id: ch03-b12
          speaker: narrator
          text: He was still hungry, and now the juicy leaves tasted delicious to him. He ate with even greater appetite until he reached a different kind of cabbage. The moment he swallowed it, another change began. His long ears, thick head, and four legs vanished, and he became a man again.
        - id: ch03-b13
          speaker: narrator
          text: The hunter lay down and slept away his weariness. When he woke the next morning, he broke off one head of the cabbage that had turned him into a donkey and one head of the cabbage that had made him human again.
        - id: ch03-b14
          speaker: hunter
          text: These will help me recover what belongs to me and punish the ones who betrayed me.
        - id: ch03-b15
          speaker: narrator
          text: He put both heads into his bag, climbed over the garden wall, and went in search of the castle. After wandering for two days, he found it. He browned his face until even his own mother would not have recognized him, then entered the castle and asked for a night's lodging.
        - id: ch03-b16
          speaker: hunter
          text: I am so weary that I cannot take another step.
        - id: ch03-b17
          speaker: witch
          text: Tell me, countryman, who are you, and what brings you here?
        - id: ch03-b18
          speaker: hunter
          text: I am a messenger from the King. He sent me to find the finest salad that grows beneath the sun. I was lucky enough to discover it, and I am carrying it with me now. But the sun is so hot that the tender cabbage may wilt. I fear I cannot take it much farther.
        - id: ch03-b19
          speaker: narrator
          text: The witch's mouth watered when she heard about this wonderful salad.
        - id: ch03-b20
          speaker: witch
          text: Dear countryman, let me taste this remarkable cabbage.
        - id: ch03-b21
          speaker: hunter
          text: Gladly. I brought two heads, so I can spare one for you.
        - id: ch03-b22
          speaker: narrator
          text: He opened his bag and handed her the bad cabbage. She suspected nothing. Eager to taste the new dish, she went straight to the kitchen and prepared it herself. She could not even wait for it to be served. She put two leaves into her mouth, and as soon as she swallowed them, she lost her human form. A donkey ran out into the courtyard where the witch had stood.
    - id: ch04
      title: Three Donkeys
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: A servant came into the kitchen and found the cooked salad waiting. She picked it up to carry it upstairs, but as usual, she tasted the food on the way. After two leaves, the enchantment seized her. She too became a donkey and ran into the courtyard beside the witch. The dish of salad fell to the floor.
        - id: ch04-b02
          speaker: narrator
          text: Meanwhile, the disguised hunter was sitting with the beautiful maiden. No one brought the salad, though she badly wanted to taste it.
        - id: ch04-b03
          speaker: maiden
          text: I cannot imagine where that salad has gone.
        - id: ch04-b04
          speaker: narrator
          text: The hunter guessed that the cabbage had already begun its work.
        - id: ch04-b05
          speaker: hunter
          text: I will go to the kitchen and bring it myself.
        - id: ch04-b06
          speaker: narrator
          text: In the kitchen, he saw the fallen dish. Through the window, he could see two donkeys running around the yard.
        - id: ch04-b07
          speaker: hunter
          text: Good. Two of them have had their share.
        - id: ch04-b08
          speaker: narrator
          text: He gathered the remaining leaves, placed them back on the dish, and carried it to the maiden.
        - id: ch04-b09
          speaker: hunter
          text: I have brought you this delicious food myself, so you need not wait any longer.
        - id: ch04-b10
          speaker: narrator
          text: The maiden ate. Like the others, she immediately lost her human shape and ran into the courtyard as a donkey. Then the hunter washed the brown color from his face, so the three enchanted women would know him. He followed them outside.
        - id: ch04-b11
          speaker: hunter
          text: Now you will receive your reward for betraying me.
        - id: ch04-b12
          speaker: narrator
          text: He tied all three donkeys together with a rope and drove them away. When he came to a mill, he knocked at the window. The miller put out his head and asked what the stranger wanted.
        - id: ch04-b13
          speaker: hunter
          text: I have three troublesome animals, and I no longer wish to keep them. Take them, give them food and shelter, and treat them exactly as I tell you. I will pay whatever you ask.
        - id: ch04-b14
          speaker: miller
          text: Why not? What do you want me to do with them?
        - id: ch04-b15
          speaker: hunter
          text: Give the oldest donkey three beatings and one meal each day. Give the younger one one beating and three meals. Give the youngest no beating at all, and three meals.
        - id: ch04-b16
          speaker: narrator
          text: The oldest donkey was the witch, the younger was the servant, and the youngest was the maiden. Even after all she had done, the hunter could not bring himself to have the maiden beaten.
        - id: ch04-b17
          speaker: narrator
          text: He returned to the castle and found there everything he wanted. A few days later, the miller came to see him with news of the donkeys.
        - id: ch04-b18
          speaker: miller
          text: I must tell you that the old donkey is dead. She had three beatings and only one meal a day. The other two are alive and receive all three meals, but they are so sad that I do not think they will last much longer.
    - id: ch05
      title: The Good Cabbage
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The hunter took pity on the two who remained. He put aside his anger and told the miller to drive them back to the castle. When they arrived, he gave each donkey some of the good cabbage to eat. At once, the servant and the maiden lost their donkey shapes and became human again.
        - id: ch05-b02
          speaker: narrator
          text: The beautiful maiden fell to her knees before him.
        - id: ch05-b03
          speaker: maiden
          text: Oh, my dearest, forgive the wrong I did to you. My mother forced me to obey her. I acted against my own will, because I truly love you. Your wishing-cloak is hanging in a cupboard. I can also prepare a drink that will return the bird-heart to you.
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: She offered to return both treasures. But as the hunter listened, he thought again about all that had happened, and his mind changed.
        - id: ch05-b05
          speaker: hunter
          text: Keep the bird-heart. It makes no difference now, because I will take you as my own dear and faithful wife.
        - id: ch05-b06
          speaker: narrator
          text: So the wishing-cloak remained at the castle, and the maiden kept the bird-heart. Then their wedding was celebrated, and the hunter and his bride lived happily together until death.
