audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的神秘与克制, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    prince:
      display_name: 王子
      tts: {delivery: 勇敢诚恳，年轻而坚定, timbre: 清亮有力, pace: 适中, pitch: 中音}
    king:
      display_name: 国王
      tts: {delivery: 威严慈爱，下定决心时果断庄重, timbre: 浑厚成熟, pace: 适中, pitch: 中低音}
    queen:
      display_name: 王后
      tts: {delivery: 温柔关切，安慰儿子时轻松笃定, timbre: 温暖柔和, pace: 适中, pitch: 中音}
    red_girl:
      display_name: 红衣姑娘
      tts: {delivery: 神秘直接，警告时冷静严肃, timbre: 明亮空灵, pace: 稍缓, pitch: 中高音}
    white_horse:
      display_name: 白马
      tts: {delivery: 忠诚急切，劝诫时清楚有力, timbre: 坚实洪亮, pace: 适中, pitch: 中低音}
    mother_of_the_sun:
      display_name: 太阳之母
      tts: {delivery: 严厉威严，宣判时冷酷不容置疑, timbre: 深沉有力, pace: 稍缓, pitch: 低音}
  chapters:
    - id: ch01
      title: 红衣姑娘的梦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，有一位强大的国王。上天赐给他一个聪明俊美的儿子。王子十岁时，才智已经胜过宫里所有谋士。到了二十岁，他又成了全国最了不起的英雄。
        - id: ch01-b02
          speaker: narrator
          text: 国王宠爱儿子，总让他穿着一身闪耀的金衣，看上去就像太阳。王后送给他一匹白马。这匹马从来不睡，跑起来快得像风。百姓也都爱戴王子，说天底下再没有第二个这样的人，于是称他为太阳英雄。
        - id: ch01-b03
          speaker: narrator
          text: 一天夜里，国王和王后做了同一个怪梦。梦中，一位从头到脚穿着红衣的姑娘走到他们面前。
        - id: ch01-b04
          speaker: red_girl
          text: 你们若想让儿子真正成为太阳英雄，而不只是顶着这个名号，就让他去世上寻找太阳树。找到以后，他要摘下一只金苹果，把它带回家。
        - id: ch01-b05
          speaker: narrator
          text: 第二天，两人说起梦里的事，这才知道彼此梦见的情形一模一样。他们都觉得非常惊奇。国王对妻子说出了自己的决定。
        - id: ch01-b06
          speaker: king
          text: 这一定是上天给我们的征兆。我们该送儿子出去。等他回来，他就会像红衣姑娘说的那样，成为名副其实的太阳英雄。
        - id: ch01-b07
          speaker: narrator
          text: 王后流着眼泪答应了。国王马上命儿子去找太阳树，带一只金苹果回来。王子一想到即将踏上的旅程，心里十分高兴，当天就出发了。
    - id: ch02
      title: 太阳树的考验
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 王子在世间走了很久。出发后的第九十九天，他终于碰见一位老人，从老人那里问到了太阳树的位置。他照着指点继续前行，又走了九十九天，来到一座金色城堡前。那座城堡孤零零地立在无边荒野的正中央。
        - id: ch02-b02
          speaker: narrator
          text: 王子敲了敲门。没有人应声，门却被看不见的手无声地推开了。他四下找不到人，只好骑马继续向前，来到一片宽阔的草地。太阳树就长在草地上。
        - id: ch02-b03
          speaker: narrator
          text: 他来到树下，伸手去够一只金苹果。树却突然越长越高，把果实送到了他够不着的地方。身后响起笑声。王子转过身，看到红衣姑娘正朝他走来。
        - id: ch02-b04
          speaker: red_girl
          text: 勇敢的尘世之子，你真觉得太阳树的苹果伸手就能拿到吗？你得先过一道难关。两只凶猛的黑狼会来毁树，你要守上九天九夜，不能让它们得手。你敢吗？
        - id: ch02-b05
          speaker: prince
          text: 我敢。我会守住太阳树，整整九天九夜都不离开。
        - id: ch02-b06
          speaker: red_girl
          text: 那就记住，要是守不住，太阳会取走你的性命。现在开始吧。
        - id: ch02-b07
          speaker: narrator
          text: 红衣姑娘说完，回到了金色城堡。她才走，两只黑狼便扑了出来。太阳英雄挥剑逼退它们，可没过多久，它们又来了。他再次把狼赶走，刚刚坐下歇息，黑狼已经又冲到眼前。
    - id: ch03
      title: 第八夜的失败
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这样的争斗持续了七天七夜。黑狼一次次扑来，太阳英雄也一次次把它们赶开。就在这时，那匹从不开口的白马转过头，忽然说起了人的话。
        - id: ch03-b02
          speaker: white_horse
          text: 仔细听我说。一位仙女把我送给你母亲，就是要我在这时候帮你。你一旦睡着，让黑狼伤到这棵树，太阳一定会杀死你。
        - id: ch03-b03
          speaker: white_horse
          text: 仙女早已预见危险，所以对世上所有人施了法。这样，谁也不能服从太阳的命令来杀你。可她漏掉了一个。只要你睡着，让狼毁了树，那个漏网的家伙就会要你的命。千万别睡，一定要挡住黑狼。
        - id: ch03-b04
          speaker: narrator
          text: 太阳英雄拼尽全力抵挡黑狼，也拼命忍住睡意。可到了第八夜，他再也支撑不住，终于沉沉睡去。
        - id: ch03-b05
          speaker: narrator
          text: 等他醒来，身边已经站着一个黑衣女人。两只黑狼伤害了太阳树。
        - id: ch03-b06
          speaker: mother_of_the_sun
          text: 你这任务完成得太糟了，竟然让黑狼毁伤太阳树。我是太阳的母亲。我命你立刻离开，也判你死刑。你什么也没有做，根本配不上太阳英雄这个称号，却还骄傲地让大家这样叫你。
        - id: ch03-b07
          speaker: narrator
          text: 年轻人满心忧伤，骑上白马回家去了。
    - id: ch04
      title: 太阳的判决
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王子回到故乡，人们纷纷围住他，急着听他讲旅途中的奇遇。王子却一句也不肯说，只把经过告诉了母亲。老王后听完，反倒笑了起来。
        - id: ch04-b02
          speaker: queen
          text: 别发愁，我的孩子。仙女一直护着你，太阳至今也没找到谁能杀你。打起精神来，高高兴兴地过日子吧。
          emotion: calm
        - id: ch04-b03
          speaker: narrator
          text: 过了一段日子，王子渐渐忘了这场遭遇。他娶了一位美丽的公主，两个人幸福地生活在一起。
        - id: ch04-b04
          speaker: narrator
          text: 有一天，王子出门打猎，忽然渴得厉害。他找到一条小溪，俯下身去喝水。可正是这个动作害死了他。一只螃蟹游过来，用钳子扯掉了他的舌头。
        - id: ch04-b05
          speaker: narrator
          text: 人们把奄奄一息的王子抬回家。他躺在临终的床上，那个黑衣女人又一次出现了。
        - id: ch04-b06
          speaker: mother_of_the_sun
          text: 太阳到底还是找到了一个不受仙女法术约束的东西。它取了你的性命。天底下任何人，要是没有资格却妄自占有一个称号，都会得到同样的下场。
