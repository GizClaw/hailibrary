  chapters:
    - id: ch01
      title: A Dream in Red
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Many thousands of years ago, there lived a mighty King with a clever and beautiful son. By the age of ten, the boy knew more than all the royal counselors together. By twenty, he had become the greatest hero in the kingdom.
        - id: ch01-b02
          speaker: narrator
          text: His father delighted in him and dressed him in golden clothes that flashed and sparkled like the sun. His mother gave him a white horse that never slept and flew as swiftly as the wind. Everyone in the land loved the young man. They called him the Sun-Hero, because they believed there was no one like him beneath the sun.
        - id: ch01-b03
          speaker: narrator
          text: Then, one night, the King and Queen had the very same strange dream. A girl dressed all in red came to each of them with a message.
        - id: ch01-b04
          speaker: red_girl
          text: If you want your son to become the Sun-Hero in deed, and not only in name, send him out into the world. He must find the Tree of the Sun, pluck one of its golden apples, and bring it home.
        - id: ch01-b05
          speaker: narrator
          text: In the morning, the King and Queen told each other what they had dreamed. They were amazed to discover that every part of their dreams was the same.
        - id: ch01-b06
          speaker: king
          text: This must be a sign from heaven. We should send our son into the world, so he can return as the Red Girl foretold, the Sun-Hero in deed and not merely in name.
        - id: ch01-b07
          speaker: narrator
          text: The Queen agreed, though she wept many tears. At once, the King ordered his son to search for the Tree of the Sun and bring back a golden apple. The Prince was delighted by the adventure ahead. He set out that very day.
    - id: ch02
      title: The Tree of the Sun
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The Prince wandered through the world for a long time. On the ninety-ninth day of his journey, he met an old man who could tell him where the Tree of the Sun grew. The Prince followed the old man's directions. After another ninety-nine days of riding, he reached a golden castle in the middle of a vast wilderness.
        - id: ch02-b02
          speaker: narrator
          text: He knocked at the castle door. It opened without a sound, moved by hands he could not see. No one was there, so he rode onward. Beyond the castle, he entered a great meadow, and there stood the Tree of the Sun.
        - id: ch02-b03
          speaker: narrator
          text: The Prince rode up to the tree and reached for a golden apple. In that instant, the tree rose higher. Its fruit moved beyond his grasp. Then someone laughed behind him. He turned and saw the girl in red walking toward him.
        - id: ch02-b04
          speaker: red_girl
          text: Brave son of the earth, did you truly think you could take an apple from the Tree of the Sun so easily? First, you must face a difficult trial. Two wild black wolves will come to damage the tree. You must guard it from them for nine days and nine nights. Can you do that?
        - id: ch02-b05
          speaker: prince
          text: I can do it. I will keep watch over the Tree of the Sun for all nine days and nine nights.
        - id: ch02-b06
          speaker: red_girl
          text: Then remember this. If you fail, the Sun will kill you. Begin your watch now.
        - id: ch02-b07
          speaker: narrator
          text: The Red Girl returned to the golden castle. She had scarcely gone when the two black wolves appeared. The Sun-Hero drove them back with his sword, but they soon returned. He chased them away again. Yet almost as soon as he sat down to rest, they came racing back once more.
    - id: ch03
      title: Nine Days and Nine Nights
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: For seven days and seven nights, the struggle went on. Again and again, the wolves attacked, and each time the Sun-Hero forced them away. Then his white horse did something it had never done before. It spoke to him in a human voice.
        - id: ch03-b02
          speaker: white_horse
          text: Listen carefully. A Fairy gave me to your mother so that I could help you. If you fall asleep and allow the wolves to harm this tree, the Sun will surely kill you. The Fairy knew this danger was coming. She cast a spell over everyone in the world, so none of them could obey the Sun's order to take your life.
        - id: ch03-b03
          speaker: white_horse
          text: But she forgot one creature, and that one will certainly kill you if you sleep and the wolves damage the tree. Stay awake. Keep those wolves away.
        - id: ch03-b04
          speaker: narrator
          text: The Sun-Hero fought with all his strength. He held the black wolves back and resisted his need for sleep. But on the eighth night, his strength gave out. He fell into a deep sleep.
        - id: ch03-b05
          speaker: narrator
          text: When he woke, a woman dressed in black stood beside him. The wolves had damaged the Tree of the Sun.
        - id: ch03-b06
          speaker: mother_of_the_sun
          text: You have failed badly. You let the two black wolves harm the Tree of the Sun. I am the mother of the Sun, and I order you to leave this place at once. I also sentence you to death. You proudly allowed people to call you the Sun-Hero, though you had done nothing to earn that name.
        - id: ch03-b07
          speaker: narrator
          text: Sadly, the young man mounted his horse and rode home.
    - id: ch04
      title: The Sun's Sentence
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When the Prince returned, people crowded around him. They were eager to hear about his adventures, but he told them nothing. Only his mother learned what had happened. When he confided everything to her, the old Queen laughed.
        - id: ch04-b02
          speaker: queen
          text: Do not trouble yourself, my child. The Fairy has protected you until now, and the Sun has found no one who can kill you. So lift your spirits and be happy.
          emotion: calm
        - id: ch04-b03
          speaker: narrator
          text: In time, the Prince forgot his adventure. He married a beautiful Princess, and for a while they lived very happily together.
        - id: ch04-b04
          speaker: narrator
          text: Then one day, while the Prince was hunting, he became terribly thirsty. He found a stream and bent down to drink. That simple act brought about his death. A crab swam toward him and tore out his tongue with its claws.
        - id: ch04-b05
          speaker: narrator
          text: The Prince was carried home, already dying. As he lay on his deathbed, the woman in black appeared before him once more.
        - id: ch04-b06
          speaker: mother_of_the_sun
          text: So the Sun has found someone at last. The Fairy's spell did not cover this creature, and it has caused your death. The same fate will come to anyone beneath the sun who claims a title without having the right to bear it.
