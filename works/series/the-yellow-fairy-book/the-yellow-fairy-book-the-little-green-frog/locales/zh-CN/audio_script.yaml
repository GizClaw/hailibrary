audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    saphir:
      display_name: 萨菲尔王子
      tts:
        delivery: 真挚有礼，年轻热烈，经历挫折后更显坚定
        timbre: 年轻清亮
        pace: 适中
        pitch: 中音
    little_frog:
      display_name: 小绿蛙／塞尔蓬蒂娜
      tts:
        delivery: 聪慧坚定，训诫时严厉，显露真身后温柔矜持
        timbre: 柔美清澈
        pace: 适中
        pitch: 中高音
    fairy:
      display_name: 仙女
      tts:
        delivery: 从容笃定，亲切中带着不容置疑的威严
        timbre: 明亮柔和
        pace: 舒缓
        pitch: 中高音
  chapters:
    - id: ch01
      title: 魔镜里的姑娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 在世界一个连讲故事的人也记不起名字的地方，从前住着两位国王。一个叫佩里多尔，一个叫迪亚曼蒂诺。他们是表兄弟，也是疆土相接的邻国之君，两个人都受仙女庇护。只是平心而论，仙女对他们的爱，远远比不上他们的妻子。
        - id: ch01-b02
          speaker: narrator
          text: 身为国王，凡事容易称心如意，做个好人反倒比平民更难。两位国王都算不上善良，迪亚曼蒂诺尤其糟糕。他恶待妻子阿格朗蒂娜，仙女终于不肯再容忍，让他死去了。他留下一个尚在襁褓中的独生女儿。女孩是王位继承人，母亲便以王太后的身份摄政。阿格朗蒂娜贤明善良，一心照顾百姓，只有一件事令她伤心。仙女自有打算，把小公主塞尔蓬蒂娜带走，亲自抚养，她只得与女儿分离。
        - id: ch01-b03
          speaker: narrator
          text: 佩里多尔真心爱着康斯坦丝王后，却总因粗心惹她难过。仙女为了惩罚他，叫王后突然死去。直到妻子不在了，他才知道自己的爱有多深。从此，他陷在悲痛里，却始终没有荒废国事，百姓便称他“忧伤的佩里多尔”。他这样过了整整十五年。若没有仙女暗中相助，只怕早已追随王后而去。
        - id: ch01-b04
          speaker: narrator
          text: 可怜的国王唯一的安慰是萨菲尔王子。母亲去世那年，王子只有三岁。从那以后，国王把许多心力都放在儿子的教养上。等他长到十五岁，一位王子该懂的事，他全懂了。不仅如此，他模样俊美，举止迷人，性情也温和可亲，见过他的人都愿意同他亲近。
        - id: ch01-b05
          speaker: narrator
          text: 仙女却担心，他太爱父亲，会打乱她们为他安排的命运。于是，她们在王子最喜欢的小屋里放了一面黑框镜子，那是当时常从威尼斯运来的样式。过了好几天，萨菲尔才发现它。他走近一看，镜中没有自己的脸，只有一个像清晨那样明丽的少女。少女刚刚告别童年，她每一个动作都清清楚楚地映在镜里。
        - id: ch01-b06
          speaker: narrator
          text: 萨菲尔立刻爱上了镜中人。从早到晚，他只想守在屋里看着这位陌生姑娘。能随时见到心爱的人，当然甜蜜，可他一想到两人不知会有怎样的结局，心又会沉下去。
        - id: ch01-b07
          speaker: narrator
          text: 一年后，他在镜中又看见一面镜子。那面镜子和他的一模一样，就在少女手里。少女才得到它不久，也已经为它荒废了所有正事。萨菲尔猜得出，她必定也在镜中看着某个人。可少女的身影总挡在前面，他怎么也看不见那张脸，只能确定对方是个男人。这一点已经足够让他嫉妒得发狂。当然，这又是仙女的安排，她们想必自有用意。
        - id: ch01-b08
          speaker: narrator
          text: 这时萨菲尔约莫十八岁，康斯坦丝王后离世已有十五年。佩里多尔越来越忧伤，终于一病不起。百姓爱戴国王，听说他性命垂危，举国绝望，萨菲尔更是悲痛万分。病中的国王只谈王后。他悔恨从前伤过她的心，也盼着有一天能再见她。全国的医生和水疗办法都试遍了，毫无用处。最后，他只求独自安静躺着，不让人打扰。
    - id: ch02
      title: 王冠鸟与小绿蛙
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 国王最难忍受的，是胸口像压着重物，连呼吸都困难，只好命人一直敞开窗户，让空气流进来。一天，侍从才离开几分钟，一只羽毛绚丽的鸟便绕着窗子飞来，最后落在窗台上。它的羽毛是天蓝和金色，脚与尖喙像红宝石一样灿烂，亮得叫人无法逼视。那双眼睛令最耀眼的钻石也失色，头顶还戴着一顶更加华美的王冠。王冠究竟是什么做的，谁也说不清。至于歌声，更是无人听过，因为它从来不唱。
        - id: ch02-b02
          speaker: narrator
          text: 鸟儿只是定定望着国王。它看一眼，国王便恢复一分力气。等它飞进房间，佩里多尔已经健康得像王后去世以前一样。他欢喜地伸手去捉救命恩人，鸟儿却比燕子还快，转眼逃走了。仆从赶来后，国王细说鸟儿的样貌。人们骑马的骑马，步行的步行，还请来捕鸟人，却哪里都找不到。百姓深爱国王，赏赐又丰厚，男女老少顷刻间全涌向田野，连城镇都空了。
        - id: ch02-b03
          speaker: narrator
          text: 这一场忙乱除了让大家撞来撞去，什么结果也没有。更糟的是，国王很快又病回原样，仿佛鸟儿从没来过。萨菲尔深爱父亲，眼看别人全都失败，便认定自己也许能找到那只鸟。他不顾众人阻拦，带着随从骑马远行，把希望全交给运气。他没有计划，也说不出哪条路更值得走，只知道该去鸟儿喜欢栖息的地方。每道树篱、每片灌木都查看过，路上的人也问遍了，可越找越没有线索。
        - id: ch02-b04
          speaker: narrator
          text: 他终于来到世上最大的一片森林，里面全是雪松。枝叶铺开浓密的阴影，树下却长着柔软的青草，开满珍奇花朵。萨菲尔认定鸟儿会喜欢这里，决心搜遍森林再走。他还叫捕鸟人和随从编网，把网涂成那只鸟的颜色，觉得世上的人和鸟都容易被与自己相像的东西骗住。那些随从竟也精通捕鸟。毕竟，要是什么都不会，怎么能当廷臣呢？
        - id: ch02-b05
          speaker: narrator
          text: 找了将近一整天，萨菲尔渴得再也走不动。幸好，不远处有一眼清泉。他从口袋里掏出随身的小杯子。一个老练的旅人，当然不能不带杯子。可他正要舀水，一只漂亮得出奇的小绿蛙跳进杯里。萨菲尔烦躁地把它甩开，它却快如闪电，马上又跳回来。他正要再甩，小绿蛙用世上最美的一双眼睛看着他。
        - id: ch02-b06
          speaker: little_frog
          text: 我是你要找的鸟儿的朋友。先把水喝足，再好好听我说。
        - id: ch02-b07
          speaker: narrator
          text: 王子喝够了水，照小绿蛙的吩咐躺在草地上休息。
        - id: ch02-b08
          speaker: little_frog
          text: 接下来每一步，你都得完全照办。把随从叫来，让他们留在附近的小村庄，等你召唤。然后面向南边，在右手找到一条种满黎巴嫩雪松的路，独自走下去。走很远以后，你会看见一座宏伟的城堡。把这粒沙子埋在大门边，越近越好。它会打开门，也会让里面所有人睡着。你马上去马厩，别理会任何别的东西。挑出最漂亮的马，跳上马背，尽快回来。再会了，王子。祝你好运。
        - id: ch02-b09
          speaker: narrator
          text: 小绿蛙说完便跳进泉水，不见了。萨菲尔离家以后，第一次觉得这样有希望。他把随从召集起来，命他们留在村庄等候，自己找到了向南延伸的雪松路。他独自走了很久，终于来到城堡。那里整座用水晶砌成，装饰全是纯金，比他想象的还辉煌。可他心里只有父亲和鸟儿，无暇观看，赶紧把沙粒埋在门边。大门立刻洞开，所有居民也沉沉睡去。
        - id: ch02-b10
          speaker: narrator
          text: 他冲进马厩，已经摸到最漂亮的马，却看见旁边挂着一副华美马具。既然马都要偷走了，顺手拿走马鞍，似乎也不该怪他。他匆忙把马具套上，城堡里的人却全醒了。他们涌进马厩，抓住王子，把他拖去见主人。王子的借口实在站不住脚，幸好主人喜欢他的相貌，没有追究，放他走了。
        - id: ch02-b11
          speaker: narrator
          text: 城堡主人放他离开后，萨菲尔没有带回马，也没有得到鸟儿。他羞愧又沮丧，拖着脚步回到泉边，简直不敢抬头。小绿蛙早在那里等着，当然也早已知道他没有照办，怒气一点也不小。
        - id: ch02-b12
          speaker: little_frog
          text: 你把我当成什么人？难道我告诉你那些办法，只是闲着无聊，想找个人说说话吗？你竟敢把我的话全丢在脑后！
          emotion: angry
    - id: ch03
      title: 三次闯进城堡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王子懊悔极了，低声下气地道歉。过了好一阵，小绿蛙的心终于软下来，又交给他一粒小东西。这一次不是沙子，而是一粒金子。她要他照先前的办法打开城门，使居民沉睡，但不能再去毁掉希望的马厩。他得径直进城堡，尽快穿过一道道走廊，找到一间满是香气的卧房。那里有位美丽少女睡在床上。他要立刻叫醒她，把她带走，不管她怎样反抗都不能理会。
        - id: ch03-b02
          speaker: narrator
          text: 王子逐条照办。大门打开，众人熟睡，他也找到了床上的少女。他把她唤醒，坚定又客气地请她马上跟自己离开。少女听他劝了一会儿，答应同行，却说必须先穿好衣裙。这个要求实在太合理，萨菲尔根本没想到该拒绝。
        - id: ch03-b03
          speaker: narrator
          text: 可少女的手刚碰到衣裙，整座宫殿便从沉睡中猛然醒来。人们冲进卧房，抓住萨菲尔，把他牢牢捆了起来。他又气自己的愚蠢，又被突来的灾祸惊得说不出一句辩解。若不是仙女暗中软化了抓捕者的心，他这一次一定会遭殃。那些人又让他悄悄离开，可他想到还要面对帮助过自己的小绿蛙，便觉得比受罚更难堪。这样的失败，要他怎么说出口？他和自己挣扎了很久，才承认别无选择，而且无论挨怎样的骂都是活该。小绿蛙果然气得厉害，责备的话一句接着一句。王子谦卑地求饶，还小心地指出，少女只想先穿好衣裙，这个要求那么合情合理，实在很难不答应。
        - id: ch03-b04
          speaker: little_frog
          text: 你必须学会别人怎样吩咐，你就怎样做。
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: 萨菲尔苦苦求她，小绿蛙终于消了气，举起一颗小钻石。
        - id: ch03-b06
          speaker: little_frog
          text: 再回城堡，把钻石埋在门边。这次不许去马厩，也不许进卧房，那两个地方给你的教训还不够吗？直接去花园，穿过门廊，走进一片小绿林。林子中央有棵树，树干是黄金，叶子是翡翠。你寻找的鸟儿就栖在上面。砍下它站着的树枝，马上带回来。听清楚了，要是你第三次违背我的话，就别再指望我，也别指望任何人帮你。
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: 小绿蛙跳回水中。王子这回真把警告放进了心里，带着钻石出发，决心再也不做不该做的事。他打开城门，径直走向花园，果然找到门廊、绿林和那棵华美的树。黄金树干托着翡翠叶片，鸟儿正在其中一根枝头熟睡。他迅速砍下整根树枝。旁边还挂着一只灿烂的金笼子，用来带鸟赶路再方便不过。若是从前，他一定顺手拿走，可这次他碰也没碰。他抱稳树枝，屏住呼吸，踮着脚一路返回，唯恐惊醒好不容易得到的鸟儿。
        - id: ch03-b08
          speaker: narrator
          text: 泉水却不见了，原地出现一座雅致的乡间小宫殿。门口站着一位迷人的少女。萨菲尔一见到她，神智都像飞散了。
        - id: ch03-b09
          speaker: saphir
          text: 什么？小姐！真的是你吗？
          emotion: surprised
        - id: ch03-b10
          speaker: little_frog
          text: 殿下，我早就见过您的脸，却从没想到，您也曾经看见我。
        - id: ch03-b11
          speaker: saphir
          text: 你不会知道，我有多少天、多少个时辰，只顾望着你，什么也做不了。
        - id: ch03-b12
          speaker: narrator
          text: 两人各自说起经历的怪事。越谈下去，他们越确定魔镜里的影像都是真的，镜中那个让自己日夜牵挂的人，此刻就站在眼前。他们温柔地交谈了许久。萨菲尔终于忍不住问，这位美丽的陌生姑娘为什么独自在森林里，原来的泉水又去了哪里。那只小绿蛙曾给他所有帮助，他还必须把仍在沉睡的鸟儿交给她。眼前的姑娘会不会知道小绿蛙的下落呢？
    - id: ch04
      title: 小绿蛙的真身
      blocks:
        - id: ch04-b01
          speaker: little_frog
          text: 殿下，您要找的小绿蛙，就站在面前。我来告诉您自己的身世吧。故事并不长。我不知道故乡在哪里，也不知道父母是谁，只知道自己名叫塞尔蓬蒂娜。仙女从我出生起就照顾我。她们不让我知道家世，却用心教导我，对我有无数恩惠。我一直与世隔绝，尤其是过去两年，我觉得这样的生活再好不过。因为，我也有一面镜子……
        - id: ch04-b02
          speaker: narrator
          text: 她羞得说不下去，停了一会儿，才重新镇定。
        - id: ch04-b03
          speaker: little_frog
          text: 您知道，仙女要人服从，从来不许追问。她们把这座小宫殿变成泉水，又把我变成青蛙，叫我对第一个来到泉边的人说出那些话。可是，当您站在我面前，我心里全是对您的思念，却只能让您看见那副丑怪模样，实在像受刑一样。再痛苦，我也只能服从。我全心盼着您成功，不只为了您，也为了自己。只有等您得到鸟儿，我才能恢复原形。可我真的不知道，您为什么寻找它。
        - id: ch04-b04
          speaker: narrator
          text: 萨菲尔便把父亲怎样因思念王后而病倒，医生和水疗又怎样全都无效，王冠鸟如何只凭目光使父亲恢复健康，随后又突然消失，全都讲给她听。他也说起父亲很快复病，自己因此离开宫廷，决心无论走多远都要把鸟找回去。塞尔蓬蒂娜越听越难过，美丽的眼睛里渐渐盛满泪水。
        - id: ch04-b05
          speaker: little_frog
          text: 殿下，除了镜中的模样，您对我什么也不知道。我连父母的名字都说不出来，现在却知道，您是一位国王的儿子。
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: 萨菲尔一再告诉她，爱情已经让两个人地位相等。
        - id: ch04-b07
          speaker: little_frog
          text: 我正因为太爱您，才不能让您娶一个门第配不上您的女人。我当然会痛苦，可我不会改变决定。除非仙女告诉我，我的出身配得上您，否则不管多么爱您，我都不会接受您的求婚。
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: 两人眼看还要谈很久，一位仙女忽然乘着象牙车出现。她身边坐着一位美丽妇人，虽已不再年轻，容貌依然动人。这一刻，鸟儿也忽然醒了。它飞上萨菲尔的肩膀，用鸟儿所能做到的方式亲昵地依偎着他。从此以后，它再也没有离开过那肩头。
        - id: ch04-b09
          speaker: fairy
          text: 塞尔蓬蒂娜，你做得很好，我对你十分满意。萨菲尔王子，请来见过我带来的这位夫人。她就是你的姨母阿格朗蒂娜，也是迪亚曼蒂诺国王的遗孀。
        - id: ch04-b10
          speaker: narrator
          text: 姨母、外甥和失散多年的母女惊喜地相互拥抱，过了好久才肯松手。仙女随后登上马车，让阿格朗蒂娜坐在自己身边，又把萨菲尔与塞尔蓬蒂娜安置在前座。她还传话给王子的随从，告诉他们美丽的鸟儿确实找到了，叫他们不必赶路，慢慢回到佩里多尔的宫廷。一切安排妥当，象牙车便升上天空。车在空中飞得极快，可两个年轻人心中有太多事要想，也有太多话要说，竟觉得时光比飞车走得还快。
    - id: ch05
      title: 失而复得的王后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 萨菲尔与塞尔蓬蒂娜还沉浸在相见的喜悦里，象牙车已经来到佩里多尔的宫殿。国王病得只剩最后一口气，侍从把他抬到屋顶的一间房里，所有人都觉得他随时会死。
        - id: ch05-b02
          speaker: narrator
          text: 象牙车刚出现在城堡外，王冠鸟便振翅飞起，直奔垂死的国王。它落到佩里多尔身边，立刻治好了他的病。紧接着，鸟儿恢复了原来的模样。站在国王面前的，竟是他以为已经死去十五年的康斯坦丝王后。
        - id: ch05-b03
          speaker: narrator
          text: 佩里多尔以为这一生再也见不到妻子，此刻终于重新拥抱了她，也再次把历尽艰险归来的儿子抱在怀中。萨菲尔这才明白，救过父亲又引他踏上旅程的鸟儿，一直就是自己的母亲。另一桩秘密也揭开了。塞尔蓬蒂娜正是阿格朗蒂娜与迪亚曼蒂诺失散的女儿，是邻国唯一的王位继承人。仙女当年把她带走抚养，如今终于让母女相认。她和萨菲尔一样，生来就是王族，再也不必担心自己的出身配不上心爱的人。
        - id: ch05-b04
          speaker: narrator
          text: 在仙女们的帮助下，佩里多尔开始为萨菲尔和塞尔蓬蒂娜筹备婚礼。王国的百姓听见喜讯，无不欢欣鼓舞。从此以后，每个人都幸福而满足地生活着，直到生命的终点。
