audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, clear, and quietly cautionary
        timbre: gentle and resonant
        pace: measured
        pitch: medium
    saphir:
      display_name: Prince Saphir
      tts:
        delivery: earnest, courteous, and quick to wonder
        timbre: clear and youthful
        pace: moderate
        pitch: medium
    serpentine:
      display_name: Princess Serpentine
      tts:
        delivery: graceful, firm, and tender beneath restraint
        timbre: bright and youthful
        pace: measured
        pitch: medium-high
    fairy:
      display_name: The Fairy
      tts:
        delivery: composed, gracious, and quietly authoritative
        timbre: luminous and mature
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: The Two Kingdoms
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In a part of the world whose name I have forgotten, there once lived two kings named Peridor and Diamantino. They were cousins and neighbors, and both were under the fairies' protection. Even so, the fairies did not love either king half as much as his wife did.
        - id: ch01-b02
          speaker: narrator
          text: Princes usually get their own way, and that can make goodness harder for them than it is for ordinary people. So it was with these two kings. The fairies said Diamantino was by far the worse. He treated his wife, Aglantine, so badly that they would no longer let him live. When he died, he left behind a baby daughter. The child was his only heir and would one day inherit the kingdom. Until then, the widowed Queen Aglantine was made regent. She ruled wisely and did all she could to make her people happy. Her only sorrow was that her daughter was gone. For reasons of their own, the fairies had decided to take little Princess Serpentine away and raise her themselves.
        - id: ch01-b03
          speaker: narrator
          text: King Peridor truly loved his wife, Queen Constance, but his thoughtless ways often hurt her. To punish that carelessness, the fairies caused the Queen to die without warning. Only after she was gone did Peridor understand how deeply he had loved her. His sorrow never made him neglect the work of a king, yet it filled the rest of his life. His people began to call him Peridor the Sorrowful. He lived that way for fifteen years, sunk in such misery that it hardly seemed possible a man could endure it. He might have died if the fairies had not had other plans.
        - id: ch01-b04
          speaker: narrator
          text: His one comfort was his son, Prince Saphir. The boy had been only three when his mother died, and great care was taken with his education. By fifteen, he had learned everything a prince was expected to know. He was charming, too, and pleasant to everyone.
        - id: ch01-b05
          speaker: narrator
          text: Around that time, the fairies suddenly became afraid that Saphir's love for his father might interfere with the future they had arranged for him. To prevent that, they placed a small mirror in a pretty little room he especially liked. It had a black frame of the kind often brought from Venice. For several days Saphir noticed nothing new. Then he saw the mirror and stepped closer for a better look. To his amazement, the face in the glass was not his own. It belonged to a girl as lovely as the morning. Better still, the wonderful mirror showed every movement she made as she grew from childhood into a young woman.
        - id: ch01-b06
          speaker: narrator
          text: Saphir gave his whole heart to that beautiful image. No one could draw him away from the room for long, because he always wanted to watch the unknown girl. It was a joy to see her whenever he wished, but sometimes his spirits fell. He could not imagine how such a strange adventure might end.
        - id: ch01-b07
          speaker: narrator
          text: He had owned the mirror for about a year when a new worry came. One day, as he watched the girl, he noticed what seemed to be another mirror reflected beside her. It looked exactly like his and possessed the same power. He was right. The girl had only just received it, yet she was already neglecting all her duties so she could gaze into it. Saphir understood why her behavior had changed and why she consulted the glass so often. Again and again he tried to see the person reflected there, but her body always stood between him and the image. He could tell only that the hidden face belonged to a man. That alone was enough to drive him wild with jealousy. The fairies had arranged this as well, and they must have had their reasons.
    - id: ch02
      title: The Wondrous Bird
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: By then Saphir was about eighteen, and fifteen years had passed since his mother's death. King Peridor had grown unhappier with every year. At last he became so ill that everyone feared he would soon die. The whole nation despaired at the news, for his people loved him dearly. No one suffered more than his son.
        - id: ch02-b02
          speaker: narrator
          text: Throughout his illness, Peridor spoke only of Queen Constance. He mourned the pain his thoughtless behavior had caused her, and he held fast to the hope that one day he would see her again. Every doctor in the kingdom tried to cure him. Every kind of water treatment was tried as well, but nothing did him any good. At last he persuaded everyone to stop their efforts and let him lie quietly in his own room, where no visitor would trouble him.
        - id: ch02-b03
          speaker: narrator
          text: A heavy pain pressed on his chest and made breathing difficult, so he ordered the windows left open for more air. One day he was alone for a few minutes when a brilliant bird fluttered around the window and settled on the sill. Its feathers shone sky-blue and gold. Its beak and feet glittered like rubies, and its eyes made the brightest diamonds seem dull. A crown rested on its head. I cannot tell you what that crown was made of, but I am certain it was finer than everything else. I cannot describe the bird's voice either, because it never sang.
        - id: ch02-b04
          speaker: narrator
          text: The bird did nothing but gaze steadily at the King. Under that gaze, Peridor felt his strength returning. After a little while the creature flew into the room, never taking its eyes from him. Every glance made the sick man stronger. Soon he felt as well as he had been before the Queen died. Joy filled him, and he reached for the bird to which he owed his cure. But the creature was faster than a swallow. It slipped away before his hands could close around it.
        - id: ch02-b05
          speaker: narrator
          text: Peridor called out, and his attendants rushed into the room. He described the marvelous creature, but no one had seen it leave. They searched on horseback and on foot and called every bird-catcher to help. Still they found nothing. The people loved their king, and the reward he promised was enormous. In the blink of an eye, every man, woman, and child had hurried into the fields to join the hunt. The towns stood completely empty.
        - id: ch02-b06
          speaker: narrator
          text: All that commotion brought only confusion and no sign of the bird. Worse still, Peridor soon became as sick as before. Saphir loved his father dearly and could not bear to watch him weaken again. He convinced himself that he might succeed where everyone else had failed and prepared for a much longer search. Though people tried to stop him, he rode away with his household and trusted chance to guide him. He had no plan and no reason to choose one road over another. His only idea was to visit the places birds liked best. He examined every hedge and thicket and questioned everyone he met along the road. The farther he traveled and the harder he searched, the less he found.
        - id: ch02-b07
          speaker: narrator
          text: At last Saphir reached one of the largest forests in the world, a forest made entirely of cedars. Wide branches spread overhead and cast deep shadows. Even so, the grass beneath them was soft and green and covered in the rarest flowers. This seemed exactly like the place birds would choose for a home. Saphir resolved not to leave until he had searched the wood from end to end. He went further still. He ordered nets made and painted in the colors of the wondrous bird, reasoning that all creatures are easily caught by what resembles them. The trained bird-catchers helped prepare them, and so did his attendants, who were excellent at the work. After all, a man can hardly be a courtier unless he knows how to do everything.
    - id: ch03
      title: The Frog at the Fountain
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After searching for nearly a whole day, Saphir was overcome with thirst. He was too tired to go farther when he spotted a bubbling fountain of perfectly clear water. As an experienced traveler, he carried a little cup in his pocket, for no one should take a journey without one. He was about to dip it into the fountain when a lovely green frog, far prettier than most frogs, jumped straight into it.
        - id: ch03-b02
          speaker: narrator
          text: Saphir did not pause to admire her beauty. He shook her out impatiently, but that did no good. She sprang back as quickly as lightning and settled into the cup again. Maddened by thirst, the Prince lifted his hand to shake her off a second time. Before he could do it, the little creature fixed the most beautiful eyes in the world upon him and spoke.
        - id: ch03-b03
          speaker: serpentine
          text: I am a friend of the bird you seek. Drink first, and then listen to me.
        - id: ch03-b04
          speaker: narrator
          text: The Prince drank until his thirst was gone. At the Little Green Frog's command, he lay down to rest on the grass.
        - id: ch03-b05
          speaker: serpentine
          text: You must follow every part of my instructions. Call your attendants together and tell them to wait in a nearby hamlet until you need them. Then face south and take the road on your right. Cedars of Lebanon grow along the whole way. Follow it for a long while, and you will reach a magnificent castle.
        - id: ch03-b06
          speaker: serpentine
          text: Now listen carefully. Take this tiny grain of sand and bury it as close as you can to the castle gate. It will open the gate and put everyone inside to sleep. Go straight to the stable. Do not pay attention to anything except what I have told you. Choose the finest horse, leap onto its back, and return to me as fast as you can. Farewell, Prince. I wish you good luck.
        - id: ch03-b07
          speaker: narrator
          text: With that, the Little Green Frog plunged into the water and vanished. Saphir felt more hopeful than he had since leaving home. He did exactly as she had said. He left his attendants in the hamlet, found the cedar-lined road, and followed it alone. At last he reached the castle gate. The place was even grander than he had expected. Its walls were crystal, and every ornament was solid gold.
        - id: ch03-b08
          speaker: narrator
          text: Saphir had no thoughts to spare for all that beauty. He hurried to bury the grain of sand in the earth beside the gate. In a single instant, the gates flew open and every person inside the castle fell sound asleep. He rushed straight to the stable and put his hand on the finest horse there. Then a magnificent set of harness hanging close by caught his eye. It surely belonged to that horse, he thought, and anyone stealing a horse could hardly be blamed for taking its saddle too. Without once considering the danger, he began fastening it onto the animal.
        - id: ch03-b09
          speaker: narrator
          text: In that instant, the spell broke and the people in the castle awoke. They raced into the stable, threw themselves upon Saphir, seized him, and dragged him before their lord. The Prince could offer only feeble excuses for trying to carry away the horse. Luckily, the lord of the castle took a liking to his face. He let Saphir leave without asking anything more.
        - id: ch03-b10
          speaker: narrator
          text: Saphir crept back to the fountain, miserable and ashamed. The Frog was waiting, and she gave him the scolding he deserved.
        - id: ch03-b11
          speaker: serpentine
          text: What do you think I am? Did you imagine I gave you all that advice merely because I enjoyed hearing myself talk?
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: Saphir grieved so deeply and apologized so humbly that the good little Frog finally softened. She gave him another tiny grain. This one was made of gold. He must repeat everything he had done before, she said, but this time he must avoid the stable that had ruined his hopes. Instead, he was to go inside the castle itself and slip as quickly as he could through the passages. Eventually he would reach a room filled with perfume. There he would find a beautiful maiden asleep on a bed. He must wake her at once and carry her away. Whatever she said or did to resist him, he must pay no attention.
    - id: ch04
      title: Two Broken Commands
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Saphir obeyed each instruction, and at first his second attempt went perfectly. The gate opened. The people inside fell asleep. He hurried along the passage and found the girl resting on her bed exactly where the Frog had promised.
        - id: ch04-b02
          speaker: saphir
          text: Please wake up. You must come with me at once.
        - id: ch04-b03
          speaker: narrator
          text: He was firm but polite, and after some persuasion the maiden agreed to follow him. She had only one condition.
        - id: ch04-b04
          speaker: serpentine
          text: I will come, but first you must let me put on my dress.
        - id: ch04-b05
          speaker: narrator
          text: The request sounded so reasonable that Saphir never thought to refuse it. Yet the moment the maiden touched her dress, the whole palace awoke. The Prince was caught and bound. He was so angry with his own foolishness, and so stunned by the disaster, that he did not even try to explain himself. Things might have ended terribly if the fairies had not softened his captors' hearts. Once again, they allowed him to leave unharmed.
        - id: ch04-b06
          speaker: narrator
          text: What troubled Saphir most was the thought of facing the Frog who had helped him so generously. How could he appear before her with such a story? He struggled with himself for a long time. At last he accepted that there was no other choice and that he deserved whatever she might say. She said a great deal, for by then she had worked herself into a terrible rage. Saphir humbly begged her pardon. He even dared to point out that it would have been very hard to deny such a reasonable request from the young lady.
        - id: ch04-b07
          speaker: serpentine
          text: You must learn to do exactly as you are told.
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: That was the only answer she would give. Still, poor Saphir was so unhappy and pleaded so earnestly that her anger faded at last. She held up a tiny diamond.
        - id: ch04-b09
          speaker: serpentine
          text: Return to the castle and bury this diamond beside the door. Do not go back to the stable or the bedroom. Both have already proved disastrous for you. Walk straight to the garden. Pass through a portico into a small green wood. At its center stands a tree with a golden trunk and emerald leaves. The beautiful bird you have searched for will be perched there.
        - id: ch04-b10
          speaker: serpentine
          text: Cut off the branch beneath the bird and bring it straight back to me. I warn you solemnly, Prince. If you disobey me a third time, you can expect no more help from me or from anyone else.
        - id: ch04-b11
          speaker: narrator
          text: The Frog jumped into the water. Saphir took her warning to heart and set out resolved to deserve no punishment. Everything was as she had described it. He found the portico, the little wood, and the splendid tree. The bird slept soundly upon one of its branches.
        - id: ch04-b12
          speaker: narrator
          text: Saphir quickly cut off the branch with the sleeping bird still perched upon it. A magnificent golden cage hung nearby. He noticed it at once, and it would certainly have made the journey much easier for the bird. This time, however, he remembered the Frog's warning and left temptation alone. He carried the branch back toward the fountain, holding his breath and walking on tiptoe the whole way for fear of waking his prize.
    - id: ch05
      title: Serpentine's Secret
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: But the fountain was no longer where Saphir had left it. In its place stood a charming little country palace. A lovely maiden waited in the doorway, and at the sight of her, the Prince could scarcely think.
        - id: ch05-b02
          speaker: saphir
          text: Madam! Can it truly be you?
          emotion: surprised
        - id: ch05-b03
          speaker: narrator
          text: The maiden blushed before answering.
        - id: ch05-b04
          speaker: serpentine
          text: My lord, I first saw your face long ago. I never dreamed that you had seen mine.
        - id: ch05-b05
          speaker: saphir
          text: You cannot imagine how many days and hours I have spent gazing at you in wonder.
        - id: ch05-b06
          speaker: narrator
          text: They told each other all the strange things that had happened to them. As each story answered the other, they became more certain that the images in their mirrors had been true. They spoke tenderly for some time. Then Saphir could hold back his questions no longer. By what lucky chance was this unknown beauty wandering in the forest? Where had the fountain gone? Did she know anything about the Frog who had brought him all this happiness? He still owed that creature the bird, and the bird was somehow fast asleep upon its branch.
        - id: ch05-b07
          speaker: serpentine
          text: My lord, the Frog is standing before you. My story is not long. I know neither my country nor my parents. I can tell you only that my name is Serpentine. The fairies have cared for me since birth. They chose to hide my family from me, but they educated me and have always shown me endless kindness. I have lived apart from the world, and for the last two years I wanted nothing else. I had a mirror...
        - id: ch05-b08
          speaker: narrator
          text: Shyness stopped her voice. After a moment, she mastered herself and continued.
        - id: ch05-b09
          speaker: serpentine
          text: You know that fairies expect to be obeyed without questions. They changed this little house into the fountain you saw, and they changed me into a frog. Then they ordered me to repeat those instructions to the first person who came for water. When you appeared, my heart was already full of you. It was agony to let you see me in such a dreadful shape, but there was no escape from their command. I wanted you to succeed with all my heart, for your sake and for mine. I could not regain my true form until you possessed the beautiful bird. Yet I still do not know why you sought it.
        - id: ch05-b10
          speaker: narrator
          text: Saphir told her about his father's sickness and everything that had led him into the forest. Serpentine listened, grew very sad, and filled her lovely eyes with tears.
        - id: ch05-b11
          speaker: serpentine
          text: My lord, you know no more of me than what the mirror showed you. I cannot even name my parents, and now I learn that you are a king's son.
          emotion: sad
        - id: ch05-b12
          speaker: narrator
          text: Saphir insisted that love made them equals, but Serpentine would not be persuaded.
        - id: ch05-b13
          speaker: serpentine
          text: I love you too much to let you marry beneath your rank. It will make me deeply unhappy, but I will not change my mind. Unless the fairies tell me that my birth is worthy of yours, I cannot accept your hand, whatever I may feel.
          emotion: sad
    - id: ch06
      title: The Fairies' Design
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Their conversation had reached this point and might have continued for a long while. Then a fairy appeared in an ivory chariot. Beside her sat a beautiful woman who had passed her early youth. At that same moment, the wondrous bird woke from its deep sleep. It fluttered onto Saphir's shoulder and fondled him as well as any bird could. From that moment on, it never willingly left him.
        - id: ch06-b02
          speaker: fairy
          text: Serpentine, I am entirely satisfied with the way you have behaved.
        - id: ch06-b03
          speaker: narrator
          text: The fairy greeted Saphir warmly and presented him to her companion. This lady, she explained, was his aunt Aglantine, the widow of King Diamantino. Then everyone fell into one another's arms.
        - id: ch06-b04
          speaker: narrator
          text: When their embraces ended, the fairy climbed back into the chariot and seated Aglantine beside her. Saphir and Serpentine took the front seat. Before they departed, she sent word to the Prince's attendants. They need not hurry after him. They could travel slowly back to King Peridor's court, knowing that the beautiful bird had truly been found. With everything comfortably settled, the chariot rose into the air. It flew with marvelous speed, but time seemed to pass even faster for Saphir and Serpentine. They had so much to think about as they traveled together.
        - id: ch06-b05
          speaker: narrator
          text: Saphir and Serpentine were still dazed with the happiness of seeing one another when the chariot reached Peridor's palace. The sick King had been carried to a room on the roof, where his nurses expected him to die at any moment. As soon as the chariot came within sight of the castle, the bird flew from Saphir's shoulder. It made straight for the dying King and cured him at once.
        - id: ch06-b06
          speaker: narrator
          text: As soon as the King was well, the bird took its natural shape. Before Peridor stood Queen Constance, the wife he had believed dead for so many years. His sorrow vanished in the joy of holding his wife and his son again. Then, with the fairies' help, he began preparing the wedding of Saphir and Serpentine. The mystery of Serpentine's birth was solved at last. She was the daughter of Aglantine and Diamantino, the baby princess whom the fairies had taken away. She was every bit as much a princess as Saphir was a prince.
        - id: ch06-b07
          speaker: narrator
          text: The people throughout the kingdom rejoiced at the happy news, and everyone lived happily and contentedly for the rest of their lives.
