audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    good_queen:
      display_name: 善良王后
      tts:
        delivery: 睿智慈爱，言语温和而笃定
        timbre: 温暖明亮
        pace: 舒缓
        pitch: 中音
    wicked_queen:
      display_name: 恶王后
      tts:
        delivery: 骄傲狠厉，焦急时透出尖锐与算计
        timbre: 冷冽清晰
        pace: 适中
        pitch: 中高音
    black_monkey:
      display_name: 黑猴子
      tts:
        delivery: 神秘庄重，像在宣告不可更改的预言
        timbre: 轻细幽远
        pace: 舒缓
        pitch: 中高音
    governess:
      display_name: 女教师
      tts:
        delivery: 慈爱体贴，思虑周全，关键时刻坚定果断
        timbre: 温暖成熟
        pace: 适中
        pitch: 中音
    young_king:
      display_name: 年轻的国王
      tts:
        delivery: 勇敢坦率，待人真诚而有王者气度
        timbre: 明亮年轻
        pace: 适中
        pitch: 中低音
    alphege:
      display_name: 阿尔菲奇王子
      tts:
        delivery: 温厚高贵，坦荡而重感情
        timbre: 清朗年轻
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 红宝石护身符
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 许多年以前，有一位国王。第一位王后善良又美丽，却在生下小王子时去世了。国王悲痛欲绝，只有看见这个王位继承人，心里才稍稍得到安慰。
        - id: ch01-b02
          speaker: narrator
          text: 小王子受洗时，邻国一位以智慧和仁慈闻名的公主做了他的教母。人们都叫她善良王后。她给孩子取名阿尔菲奇，从此把他当作自己的心肝宝贝。
        - id: ch01-b03
          speaker: narrator
          text: 两三年后，国王再婚了。新王后美得无可挑剔，性情却远不如先王后温厚。她也生下一个儿子。一想到阿尔菲奇挡在自己的孩子和王位之间，她便妒火中烧，只是在国王面前从不露出来。
        - id: ch01-b04
          speaker: narrator
          text: 后来，她再也忍不下去，派一个最信得过的仆人去见自己的老朋友山中仙女，求仙女想办法除掉继子。仙女却回答，她虽然凡事都愿意讨王后欢心，也绝不敢伤害阿尔菲奇，因为有一股比她更强大的力量在保护他。
        - id: ch01-b05
          speaker: narrator
          text: 善良王后的国家十分遥远，她只能隔着重重山水守护教子。不过，王子身边发生的一切，她都知道，恶王后的阴谋也瞒不过她。她送来一颗硕大华美的红宝石，叮嘱阿尔菲奇日夜戴着。只要他留在父王的国境内，宝石就能挡住所有伤害。一旦出了国境，它的法力也就消失了。
        - id: ch01-b06
          speaker: narrator
          text: 恶王后千方百计想把他弄到国外，却次次失败。国王有一个远嫁他乡的妹妹，兄妹俩感情深厚，一直通信不断。公主从信中听说了许多阿尔菲奇的事，很想见见这位可爱的外甥，便请哥哥准许王子去做客。国王本来有些犹豫，经不住妻子一再劝说，终于答应了。
        - id: ch01-b07
          speaker: narrator
          text: 阿尔菲奇已经十四岁了，生得俊美，性情也十分讨人喜欢。从婴儿时起，宫里一位身份尊贵的夫人便照料他。按照当时的习俗，她先掌管王子的哺育，后来又做他的女教师。等王子长大，她的丈夫又做了王子的老师兼监护人。因此，阿尔菲奇从没离开过这对夫妇。他们像疼独生女扎伊达一样疼爱他，王子也深深爱着他们。
        - id: ch01-b08
          speaker: narrator
          text: 王子出发时，这对忠心的夫妇自然陪在身边，后面还跟着大批侍从。在父王的国土上走了好一阵，一路都平安无事。可他们刚越过边境，便要顶着烈日穿过一片荒原。
        - id: ch01-b09
          speaker: narrator
          text: 众人庆幸附近有一小片树林，赶紧躲到树荫下歇脚。王子渴得厉害，恰好旁边流着一条细细的小溪，侍从很快取来水。谁知他才尝了一口，就猛然跳下马车，转眼消失了。焦急的随从们找遍四周，哪里还有他的影子？
        - id: ch01-b10
          speaker: narrator
          text: 大家正一边搜寻，一边呼喊，一只黑猴子忽然出现在突出的岩石上。
        - id: ch01-b11
          speaker: black_monkey
          text: 可怜的伤心人，你们这样找下去也找不到王子。回自己的国家吧。你们要先有一段时间认不出他，他才能回到你们身边。
        - id: ch01-b12
          speaker: narrator
          text: 黑猴子说完就不见了，只留下又悲伤又困惑的廷臣。他们不肯死心，又找了许久。可所有努力都没有用，众人别无选择，只得回国报信。国王承受不住这个噩耗，一病不起，不久便去世了。
    - id: ch02
      title: 宫里的绿猴子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 恶王后看见自己的儿子戴上王冠，大权也落在自己手里，心中十分得意。可她统治得冷酷无情，百姓都厌恶她，还认定阿尔菲奇就是被她害死的。若不是年轻的国王确实深受爱戴，国内早已起了叛乱。
        - id: ch02-b02
          speaker: narrator
          text: 可怜的阿尔菲奇从前那位女教师，也在老国王去世后不久失去了丈夫。她带着女儿离开宫廷，退居自家宅邸。扎伊达渐渐长成一位美丽又惹人喜爱的姑娘，母女俩却始终没有停止怀念她们亲爱的王子。
        - id: ch02-b03
          speaker: narrator
          text: 年轻的国王最爱打猎，常带着国中身份最高贵的青年们外出。一天，他们追猎了整整一上午，国王才在一条小溪旁停下来。他坐进小树林的阴影里歇息，那里早已为他搭好一顶华丽的帐篷。
        - id: ch02-b04
          speaker: narrator
          text: 吃午饭时，国王发现树上坐着一只碧绿鲜亮的小猴子。它望着他的目光那么温柔，竟叫他心里一软。国王不准廷臣惊吓它，还亲手递去食物。
        - id: ch02-b05
          speaker: narrator
          text: 小猴子发现大家都在看它，便从一根树枝跳到另一根树枝，慢慢来到国王身边。它斯斯文文地接过食物，最后竟走到餐桌旁。国王高兴地把它抱在膝上，又亲自带回王宫，不肯把照料它的事交给别人。很快，整个宫廷都在谈论这只漂亮的绿猴子。
        - id: ch02-b06
          speaker: narrator
          text: 一天早晨，女教师和扎伊达正单独待在一起，绿猴子忽然从敞开的窗户跳了进来。原来它逃出了王宫。它温顺又亲人，母女俩很快从最初的惊吓中缓过来。猴子同她们相处了一阵，那亲昵讨喜的举止彻底赢得了两人的心。
        - id: ch02-b07
          speaker: narrator
          text: 国王发现了它的去处，便派人来接它回宫。可谁一伸手去捉，猴子就凄惨地叫起来，显得痛苦极了。两位夫人舍不得看它这样难受，只好求国王让它在这里多住一阵，国王也答应了。
        - id: ch02-b08
          speaker: narrator
          text: 一天傍晚，母女俩坐在花园的喷泉边。小猴子一直用又悲伤又充满爱意的眼睛望着扎伊达。等大颗大颗的泪珠从它脸上滚落，两人更猜不透是怎么回事了。
        - id: ch02-b09
          speaker: narrator
          text: 第二天，母女俩坐在茉莉花亭里，又谈起绿猴子的古怪举动。母亲终于说出了压在心底的话。
        - id: ch02-b10
          speaker: governess
          text: 好孩子，我不能再瞒着你了。我总觉得，这只绿猴子就是我们心爱的阿尔菲奇王子，只是被变成了这副模样。我知道这话听来荒唐，可这个念头怎么也赶不走，搅得我一刻都不得安宁。
        - id: ch02-b11
          speaker: narrator
          text: 她抬起头，只见小猴子就坐在那里。它流着眼泪，又连连比画，仿佛在说，她猜对了。
    - id: ch03
      title: 王子恢复真身
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那天夜里，女教师梦见了善良王后。
        - id: ch03-b02
          speaker: good_queen
          text: 别再哭了，照我的话做。到花园的大桃金娘树下，掀开树脚那块小大理石板。下面有一只水晶瓶，里面装着鲜绿色的液体。把瓶子拿走，再准备一池铺满玫瑰的水。把你眼下最挂念的那个东西放进去，用绿液替它仔细擦洗全身。
        - id: ch03-b03
          speaker: narrator
          text: 女教师立刻惊醒，连忙赶到花园。那里果然和梦中说的一模一样。她又唤醒女儿，两人瞒着女仆准备浴池。扎伊达采来许多玫瑰，她们把猴子放进一只硕大的碧玉浴池，再用绿液擦遍它的全身。
        - id: ch03-b04
          speaker: narrator
          text: 两人没有提心吊胆多久，猴皮便忽然脱落。站在她们面前的，竟是已经长大的阿尔菲奇。他英俊迷人，世上再找不出第二个。这场重逢的欢喜根本无法用言语说尽，母女俩一时连一句完整的话也说不出来。
        - id: ch03-b05
          speaker: narrator
          text: 等心情稍稍平静，她们请王子讲讲这些年的经历。阿尔菲奇便把一切都告诉了她们。他说起自己刚被变成猴子时，在荒原上吃过的种种苦头。那些日子里，他唯一的安慰，就是善良王后前来看望。最后，也是她想出办法，引他遇见了弟弟。
        - id: ch03-b06
          speaker: narrator
          text: 几个人一连谈了好几天，仿佛总有说不完的话。后来，扎伊达的母亲开始思量，该怎样让阿尔菲奇登上本来就属于他的王位。
        - id: ch03-b07
          speaker: narrator
          text: 王宫里的恶王后却越来越不安。从儿子带回猴子的那一天起，她就认定那正是阿尔菲奇，一心想取他的性命。如今，山中仙女又证实了她的猜疑。她再也等不下去，立刻哭着去找年轻的国王。
        - id: ch03-b08
          speaker: wicked_queen
          text: 我刚得到消息，有几个心怀不轨的人推出来一个冒牌货，想把你赶下王位。你必须马上把他处死！
          emotion: fearful
        - id: ch03-b09
          speaker: narrator
          text: 年轻的国王很勇敢。他答应母亲，很快就会惩罚那些谋反的人。可他没有贸然动手，而是仔细查问了整件事。最后，他觉得一个安分的寡妇和一个年轻姑娘，实在不大可能策划一场叛乱。
    - id: ch04
      title: 兄弟相认
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 国王决定亲眼见见这两个人，亲自查明真相。一天夜里，他没有告诉王后和任何大臣，只带一小队随从，悄悄来到两位夫人居住的宅邸。
        - id: ch04-b02
          speaker: narrator
          text: 母女俩正同阿尔菲奇谈得入神。听见深夜有人敲门，她们赶紧请王子暂时藏起来。可门一打开，外面站着的竟是国王和他的随从。母女俩怎么也没想到来人会是他们，顿时大吃一惊。
        - id: ch04-b03
          speaker: young_king
          text: 我知道你们在密谋夺走我的王冠，还想害我的性命。我今晚就是来听你们解释的。
        - id: ch04-b04
          speaker: narrator
          text: 女教师刚要回答，已经听见一切的阿尔菲奇便走了出来。
        - id: ch04-b05
          speaker: alphege
          text: 弟弟，你要的解释，该由我来给。
        - id: ch04-b06
          speaker: narrator
          text: 阿尔菲奇举止从容，气度高贵。所有人都默默望着他，惊讶得说不出话。年轻的国王终于认出了这位失踪多年的兄长。
        - id: ch04-b07
          speaker: young_king
          text: 不错，你真的是我哥哥！现在我终于找到了你。请收回王位吧，它本来就属于你，我再也没有权利占着它。
          emotion: surprised
        - id: ch04-b08
          speaker: narrator
          text: 说完，他恭敬地吻了吻哥哥的手。阿尔菲奇一头扑进弟弟怀里。兄弟俩随即赶往王宫，当着全体廷臣的面，阿尔菲奇从弟弟手中接过王冠。
        - id: ch04-b09
          speaker: narrator
          text: 为了消除众人心中最后一点疑虑，他又取出善良王后在自己幼年时送的红宝石。廷臣们正凝神观看，宝石忽然发出一声巨响，从中裂开。就在同一时刻，恶王后也断了气。
    - id: ch05
      title: 阿尔菲奇国王
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 阿尔菲奇很快迎娶了亲爱而美丽的扎伊达。婚礼上，善良王后亲自现身，他的喜悦这才圆满。
        - id: ch05-b02
          speaker: good_queen
          text: 从今以后，山中仙女再也没有力量伤害你了。
          emotion: calm
        - id: ch05-b03
          speaker: narrator
          text: 善良王后陪年轻夫妇住了一阵，送给他们无比贵重的礼物，这才返回自己的国家。阿尔菲奇国王坚持与弟弟共享王位。所有人都活到很大年纪，始终受到天下人的爱戴与敬仰。
