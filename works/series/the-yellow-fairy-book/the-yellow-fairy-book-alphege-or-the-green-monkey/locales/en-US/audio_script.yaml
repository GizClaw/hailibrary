  chapters:
    - id: ch01
      title: The Lost Prince
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Many years ago, a king lost his first wife when their little son was born. She had been good and beautiful, and the king was crushed by grief. His only comfort was to look upon his heir.
        - id: ch01-b02
          speaker: narrator
          text: At the baby's christening, the king chose a neighboring princess to be his godmother. She was so well known for wisdom and kindness that everyone called her the Good Queen. She named the child Alphege and loved him from that day on.
        - id: ch01-b03
          speaker: narrator
          text: Time can soften even the deepest grief. After two or three years, the king married again. His new queen was certainly beautiful, but she was nothing like his first wife in temper. In due course, she had a son of her own. From then on, she burned with anger because Alphege stood between her child and the throne. Yet she took great care to hide her jealousy from the king.
        - id: ch01-b04
          speaker: narrator
          text: At last she could bear it no longer. She sent a trusted servant to an old and faithful friend, the Fairy of the Mountain, and asked the fairy to find a way to remove her stepson.
        - id: ch01-b05
          speaker: fairy_of_the_mountain
          text: I would gladly please the Queen, but I can do nothing against the young prince. A power greater than mine protects him.
        - id: ch01-b06
          speaker: narrator
          text: Far away in her own country, the Good Queen kept close watch over her godson. The distance could not prevent her from learning all that happened, including every one of the wicked queen's plans. So she sent Alphege a large and magnificent ruby. He must wear it by day and by night, she warned him, for it would guard him from every attack. But the jewel's power would last only while he remained inside his father's kingdom.
        - id: ch01-b07
          speaker: narrator
          text: The wicked queen knew the ruby's limit. Again and again she tried to lure the prince out of the country, but every attempt failed. Then chance gave her what she wanted.
        - id: ch01-b08
          speaker: narrator
          text: The king had one sister, married to the ruler of a distant land. She loved her brother dearly, and the two of them always kept up a close correspondence. Everything she heard about Alphege made her long to meet such a charming nephew. Again and again, she begged the king to let the prince visit her. He hesitated, but his wife argued against his doubts until at last he agreed.
        - id: ch01-b09
          speaker: narrator
          text: Alphege was fourteen then, the handsomest and most engaging boy anyone could imagine. Since infancy, a great lady of the court had cared for him. By the custom of the time, she first served as his chief nurse and then as his governess. When he grew beyond her care, her husband became his tutor and governor. Alphege had never been separated from this excellent couple. They loved him as dearly as their only daughter, Zayda, and he returned their love warmly.
        - id: ch01-b10
          speaker: narrator
          text: Naturally, the devoted couple went with Alphege when he set out. A large company of attendants traveled with them. For some time, their journey through his father's lands went perfectly well. Soon after they crossed the frontier, however, they had to pass over a desert plain beneath a burning sun.
        - id: ch01-b11
          speaker: narrator
          text: They stopped beneath a cluster of trees, and Alphege complained of terrible thirst. A tiny stream ran nearby, so his attendants quickly brought him water. The instant he tasted it, he leaped from his carriage and vanished.
        - id: ch01-b12
          speaker: narrator
          text: His frightened followers searched everywhere. They were calling and hunting among the trees when a black monkey appeared on a point of rock.
        - id: ch01-b13
          speaker: black_monkey
          text: Poor, grieving people, you will not find your prince. Go home. He cannot be restored until you have failed to know him for a time.
        - id: ch01-b14
          speaker: narrator
          text: The monkey vanished as soon as it had spoken. The courtiers were left sadly confused by its strange message. Still they searched, but every effort to find Alphege proved useless. They had no choice but to return to their own country with the dreadful news. It caused the king such distress that he fell ill and died not long afterward.
    - id: ch02
      title: The Green Monkey
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The queen's ambition knew no bounds. She was delighted to see the crown placed on her son's head, while all real power fell into her own hands. Her rule was so harsh that the people hated her, and nearly everyone believed she had secretly done away with Alphege. They would certainly have risen against her if her son had not deserved and won their love.
        - id: ch02-b02
          speaker: narrator
          text: Alphege's former governess had lost her husband not long after the old king died. She withdrew to her own home with Zayda. The girl grew into a lovely and lovable young woman, and both mother and daughter still mourned their dear prince.
        - id: ch02-b03
          speaker: narrator
          text: The young king loved to hunt and often rode out with the noblest young men in his kingdom. After one long morning of chasing game, he rested beside a brook in a small, shady wood. A splendid tent had been set up there for his meal.
        - id: ch02-b04
          speaker: narrator
          text: As he ate, he noticed a little monkey with fur of the brightest green. It sat in a tree and looked at him so tenderly that he was deeply moved. He ordered the courtiers not to scare it away.
        - id: ch02-b05
          speaker: narrator
          text: The monkey noticed how much attention the king was paying it. It jumped from branch to branch, drawing closer little by little. When the king held out some food, the creature accepted it with the daintiest manners. At last it ventured right onto the table. The delighted king lifted it onto his knees, and the monkey did not resist.
        - id: ch02-b06
          speaker: narrator
          text: Delighted with his new companion, the king carried the monkey home. He would let no one else care for it. Before long, the entire court could talk of nothing but the pretty green monkey.
        - id: ch02-b07
          speaker: narrator
          text: One morning, while the governess and Zayda were alone, the monkey sprang through an open window. It had escaped from the palace. Its gentle, affectionate ways soon settled the fright it had given them, and before long it had won both their hearts.
        - id: ch02-b08
          speaker: narrator
          text: The monkey stayed with them for some time, charming them more with every gentle trick. Then the king discovered where his pet had gone and sent someone to bring it back. But whenever anyone tried to catch the monkey, it cried so pitifully and seemed so miserable that the two ladies begged to keep it a little longer. The king gave his consent.
        - id: ch02-b09
          speaker: narrator
          text: One evening beside the garden fountain, the monkey gazed at Zayda with sad, loving eyes. She and her mother did not know what to think. Then large tears began to roll down its cheeks, and their wonder only grew.
        - id: ch02-b10
          speaker: narrator
          text: The next day, mother and daughter sat in a jasmine bower and talked about the green monkey's strange behavior.
        - id: ch02-b11
          speaker: governess
          text: My dear child, I cannot hide this from you any longer. I keep thinking that the green monkey is our beloved Prince Alphege, changed into this strange shape. It sounds impossible, I know. But the thought will not leave my heart or give me any peace.
        - id: ch02-b12
          speaker: narrator
          text: She looked up as she spoke. There sat the little monkey, answering her with tears and gestures that seemed to say she was right.
    - id: ch03
      title: The Prince Restored
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: That night, the governess dreamed of the Good Queen.
        - id: ch03-b02
          speaker: good_queen
          text: Weep no more, and do exactly as I tell you. In your garden, lift the small marble slab beneath the great myrtle tree. Under it you will find a crystal vase filled with bright green liquid. Take the thing that fills your thoughts now. Bathe it among roses, and rub it well with the liquid.
          emotion: calm
        - id: ch03-b03
          speaker: narrator
          text: At those words, the governess woke. She lost no time in getting up and hurrying into the garden. Beneath the marble slab, she found the crystal vase exactly where the Good Queen had promised. Then she rushed to wake Zayda. The two of them prepared the bath alone, for they would not let any of their servants know what they were doing.
        - id: ch03-b04
          speaker: narrator
          text: Zayda gathered armfuls of roses. When all was ready, they put the monkey into a great jasper bath, and her mother rubbed the green liquid over its body.
        - id: ch03-b05
          speaker: narrator
          text: They did not wait long. Suddenly, the monkey skin fell away. Before them stood Prince Alphege, now the handsomest and most charming of men. No words could hold the joy of that meeting.
        - id: ch03-b06
          speaker: narrator
          text: When their first joy had quieted a little, the ladies begged Alphege to tell them his adventures. He described all he had suffered in the desert from the moment he was transformed. Through those hardships, his only comfort had been the Good Queen's visits. At last she had shown him how he might meet his brother.
        - id: ch03-b07
          speaker: narrator
          text: Several days passed in long and absorbing conversations. Then the governess began to consider how Alphege might be given the throne that was rightfully his.
    - id: ch04
      title: The Brothers Meet
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Meanwhile, the wicked queen was growing more anxious each day. From the very beginning, she had felt certain that her son's pet monkey was really Prince Alphege, and she longed to put an end to him. Now the Fairy of the Mountain confirmed what she suspected. The queen burst into tears and hurried to her son.
        - id: ch04-b02
          speaker: wicked_queen
          text: I have learned that wicked people have produced an impostor to steal your throne. You must have him killed at once!
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: The young king was a brave man. He assured his mother that he would soon punish the conspirators, but first he made careful inquiries into the matter. What he learned gave him reason to doubt her story. It hardly seemed likely that a quiet widow and a young girl would dream of starting a revolution.
        - id: ch04-b04
          speaker: narrator
          text: He decided to visit the ladies and learn the truth himself. One night, without telling the queen or his ministers, he rode to their palace with only a small group of followers.
        - id: ch04-b05
          speaker: narrator
          text: At that moment, the two ladies were deep in conversation with Alphege. When someone knocked so late at night, they asked the prince to hide for a while. Then the door opened, and to their astonishment, the king entered with his companions.
        - id: ch04-b06
          speaker: young_king
          text: I know you are plotting against my life and my crown. I have come to hear your explanation.
        - id: ch04-b07
          speaker: narrator
          text: Before the governess could answer, Alphege stepped from hiding. He had heard everything.
        - id: ch04-b08
          speaker: alphege
          text: Brother, I am the one who must explain.
        - id: ch04-b09
          speaker: narrator
          text: He spoke with such grace and dignity that everyone stared at him in silence. Then the young king recognized the brother who had vanished years before and recovered from his amazement.
        - id: ch04-b10
          speaker: young_king
          text: Yes, you truly are my brother. Now that I have found you, take the throne. It is yours, and I have no right to keep it.
        - id: ch04-b11
          speaker: narrator
          text: With those words, he respectfully kissed Alphege's hand. Alphege threw his arms around him, and the brothers hurried to the royal palace.
    - id: ch05
      title: King Alphege
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The brothers entered the royal palace together. Before the entire court, the young king placed the crown in his brother's hands. To clear away any remaining doubt, Alphege showed everyone the ruby the Good Queen had given him in childhood.
        - id: ch05-b02
          speaker: narrator
          text: While the court was gazing at the jewel, it split apart with a tremendous crack. At that same moment, the wicked queen died.
        - id: ch05-b03
          speaker: narrator
          text: King Alphege soon married his dear and lovely Zayda. His happiness was complete when the Good Queen appeared at their wedding.
        - id: ch05-b04
          speaker: good_queen
          text: The Fairy of the Mountain has lost all power over you. She can never harm you again.
        - id: ch05-b05
          speaker: narrator
          text: The Good Queen stayed with the young couple for a time and gave them the most costly presents. Then she returned to her own country.
        - id: ch05-b06
          speaker: narrator
          text: King Alphege insisted that his brother share the throne. They all lived to a good old age, loved and admired by everyone.
