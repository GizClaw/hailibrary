  chapters:
    - id: ch01
      title: The Ship in the Wood
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, an old couple had three sons. The two older sons were clever. They loved their mother, gave her fine clothes, and always spoke kindly to her. The youngest was thought a perfect fool. He was forever getting in his mother's way, and she had no patience with him.
        - id: ch01-b02
          speaker: narrator
          text: One day, news spread through the village. The King had issued a decree. He would give his daughter, the Princess, in marriage to whoever could build a ship that flew. The two clever brothers decided at once to try their luck and asked their parents for a blessing. Their mother brushed and straightened their clothes until they looked their best. She packed a generous store of food for their journey and even added a bottle of brandy. As soon as they had gone, the Simpleton began pestering her. He wanted her to make him presentable and let him set out after them.
        - id: ch01-b03
          speaker: mother
          text: What could ever become of a fool like you? The wolves would eat you alive.
        - id: ch01-b04
          speaker: simpleton
          text: I will go! I will go! I will go!
        - id: ch01-b05
          speaker: narrator
          text: He would not stop. At last his mother gave him a crust of bread and a bottle of water, then paid no more attention to him. So the Simpleton set out. Before he had gone far, he met a little old man. They greeted each other, and the old man asked where he was bound.
        - id: ch01-b06
          speaker: simpleton
          text: I'm going to the King's Court. He has promised his daughter to the man who can make a flying ship.
        - id: ch01-b07
          speaker: manikin
          text: Can you build such a ship?
        - id: ch01-b08
          speaker: simpleton
          text: No, I can't.
        - id: ch01-b09
          speaker: manikin
          text: Then why are you going at all?
        - id: ch01-b10
          speaker: simpleton
          text: I couldn't tell you.
        - id: ch01-b11
          speaker: manikin
          text: Well then, sit here beside me. We can rest and share a bite to eat. Show me what you have in your bag.
        - id: ch01-b12
          speaker: narrator
          text: The Simpleton felt ashamed of his poor meal. Still, he did not want to make a fuss. He opened the bag and could hardly believe his eyes. The hard crust was gone. In its place were two lovely fresh rolls and some cold meat. He shared everything with the little man, who ate gladly and licked his lips.
        - id: ch01-b13
          speaker: manikin
          text: Go into that wood and stop at the first tree. Bow three times, strike the tree with your axe, then kneel with your face against the earth. Stay there until someone raises you. You will find a ship beside you. Climb in and fly to the King's palace. And if you meet anyone along the way, take him with you.
        - id: ch01-b14
          speaker: narrator
          text: The Simpleton thanked the little man warmly and said farewell. Then he went into the wood. He stopped before the very first tree and bowed three times. He struck its trunk with his axe, dropped to his knees, and laid his face against the earth, exactly as he had been told. While he waited for someone to raise him, he fell asleep. A little later, something woke him. He sat up, rubbed his eyes, and saw a finished ship waiting at his side. He climbed aboard without delay.
        - id: ch01-b15
          speaker: narrator
          text: The ship rose higher and higher. In another moment, it was flying through the air.
    - id: ch02
      title: The Strange Crew
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The Simpleton kept watch below. He soon saw a man kneeling on the road with one ear pressed to the damp earth.
        - id: ch02-b02
          speaker: simpleton
          text: Hello down there! What are you doing?
        - id: ch02-b03
          speaker: listener
          text: I'm listening to everything that is happening in the world.
        - id: ch02-b04
          speaker: simpleton
          text: Come along with me in my ship.
        - id: ch02-b05
          speaker: narrator
          text: The man was only too glad to accept. He climbed in beside the Simpleton, and the ship flew on and on through the air. After a time, the Simpleton looked down again. Another man was hopping along the road on one leg, while his other leg was tied all the way up behind his ear.
        - id: ch02-b06
          speaker: simpleton
          text: Hello! Why are you hopping on one leg like that?
        - id: ch02-b07
          speaker: runner
          text: I have to. I run so fast that if I let my other leg loose, one bound would carry me to the end of the earth.
        - id: ch02-b08
          speaker: simpleton
          text: Then come aboard with us.
        - id: ch02-b09
          speaker: narrator
          text: The runner had no objection, so he joined them. The ship flew on and on. Next, the Simpleton saw a man below, aiming a gun far into the distance.
        - id: ch02-b10
          speaker: simpleton
          text: Hello! What are you aiming at? There isn't a bird anywhere in sight.
        - id: ch02-b11
          speaker: marksman
          text: Why would I bother with a nearby target? I can hit any beast or bird a hundred miles away. That's the shooting I enjoy.
        - id: ch02-b12
          speaker: simpleton
          text: Come into the ship with us.
        - id: ch02-b13
          speaker: narrator
          text: The marksman was delighted to join them and climbed aboard. The flying ship traveled farther and farther. When the Simpleton next looked down at the road, he saw a man carrying a basket piled high with bread upon his back. He waved to the stranger and called out to him.
        - id: ch02-b14
          speaker: simpleton
          text: Hello! Where are you going with all that bread?
        - id: ch02-b15
          speaker: glutton
          text: I'm fetching breakfast.
        - id: ch02-b16
          speaker: simpleton
          text: Breakfast? You already have a whole basket on your back.
        - id: ch02-b17
          speaker: glutton
          text: This little basket is nothing. I could swallow the lot in one mouthful.
        - id: ch02-b18
          speaker: simpleton
          text: Then come with us in the ship.
        - id: ch02-b19
          speaker: narrator
          text: The great eater joined the company, and the ship climbed through the air again. It flew up and onward until a vast lake came into view. A man was walking beside the water and plainly searching for something, though there seemed to be nothing missing anywhere along the shore.
        - id: ch02-b20
          speaker: simpleton
          text: Hello! What are you looking for?
        - id: ch02-b21
          speaker: drinker
          text: I need some water. I'm terribly thirsty.
        - id: ch02-b22
          speaker: simpleton
          text: There's an entire lake in front of you. Why not drink from that?
        - id: ch02-b23
          speaker: drinker
          text: You think that would be enough? I could drain it in a single gulp.
        - id: ch02-b24
          speaker: simpleton
          text: Well, come with us.
        - id: ch02-b25
          speaker: narrator
          text: The great drinker climbed aboard, and the ship carried the growing company farther still. The Simpleton looked down once more. Beneath them, a man was making his way through a forest with a bundle of wood dragging behind him. Surrounded by trees, he was hauling more wood on his back.
        - id: ch02-b26
          speaker: simpleton
          text: Hello! Why carry wood through a forest?
        - id: ch02-b27
          speaker: wood_bearer
          text: This isn't ordinary wood.
        - id: ch02-b28
          speaker: simpleton
          text: What kind is it?
        - id: ch02-b29
          speaker: wood_bearer
          text: Throw it on the ground, and it turns into an army of soldiers.
        - id: ch02-b30
          speaker: simpleton
          text: Come into the ship with us, then.
        - id: ch02-b31
          speaker: narrator
          text: The wood bearer joined them too, bringing his bundle with him. Once more the ship flew on and on. When the Simpleton leaned out for another look, he noticed a man walking below with a load of straw upon his back.
        - id: ch02-b32
          speaker: simpleton
          text: Hello! Where are you taking that straw?
        - id: ch02-b33
          speaker: straw_bearer
          text: To the village.
        - id: ch02-b34
          speaker: simpleton
          text: Doesn't the village have any straw of its own?
        - id: ch02-b35
          speaker: straw_bearer
          text: Not straw like this. Scatter it on the hottest summer day, and the air turns cold at once. Snow falls, and people freeze.
        - id: ch02-b36
          speaker: narrator
          text: The Simpleton invited him aboard, and the straw bearer joined the strange crew.
    - id: ch03
      title: The King's Impossible Feast
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last, the flying ship and its strange crew reached the King's Court. The King was in the middle of his dinner when the vessel arrived. He immediately sent one of his courtiers outside to learn what enormous, unfamiliar bird had come flying through the air. The courtier went up to the ship and peered inside. As soon as he understood what he was seeing, he hurried back to the royal table. He reported that the bird was really a flying ship, and that its crew was nothing more than a handful of peasants.
        - id: ch03-b02
          speaker: narrator
          text: The King remembered his royal promise, but he refused to let the Princess marry a poor peasant. After thinking hard, he found a way to be rid of the young man.
        - id: ch03-b03
          speaker: king
          text: I'll set him tasks no one could possibly finish. That will get rid of him.
        - id: ch03-b04
          speaker: narrator
          text: He called for a courtier and carefully explained the first command. The Simpleton must fetch healing water from the very end of the world, and he must bring it back before the King finished dinner. But while the King was still telling the messenger exactly what to say, the Listener aboard the ship heard every word. He hurried to the poor Simpleton and warned him of the task that was coming.
        - id: ch03-b05
          speaker: simpleton
          text: Oh, what can I do? Finding that water could take a year. It might take my whole life.
          emotion: fearful
        - id: ch03-b06
          speaker: runner
          text: Don't be afraid. I'll bring the King his water.
        - id: ch03-b07
          speaker: narrator
          text: Just then, the courtier arrived with the royal command.
        - id: ch03-b08
          speaker: simpleton
          text: Tell His Majesty that I will obey his order.
        - id: ch03-b09
          speaker: narrator
          text: The runner untied the foot from behind his ear and raced away. Almost at once, he reached the world's end and drew healing water from the well.
        - id: ch03-b10
          speaker: runner
          text: That was tiring. I'll rest for a few minutes. The King won't reach dessert just yet.
        - id: ch03-b11
          speaker: narrator
          text: He lay down on the grass. The sun dazzled him, so he shut his eyes and fell sound asleep. Back at the ship, everyone waited anxiously. The King's meal was nearly done, but their friend had not returned. The Listener put his ear to the ground.
        - id: ch03-b12
          speaker: listener
          text: What a fine fellow he is! He's stretched out on the ground, snoring away.
          emotion: surprised
        - id: ch03-b13
          speaker: narrator
          text: The marksman seized his gun, took careful aim toward the world's end, and fired to wake the sleeper. A moment later, the runner came racing back. He stepped aboard the ship and placed the healing water in the Simpleton's hands. The King was still seated at his table, finishing his dinner, when the news reached him. His first impossible command had been obeyed in every detail.
        - id: ch03-b14
          speaker: narrator
          text: The King wondered what he could possibly do now. At last, he chose a task that seemed even more impossible. He told another courtier that the Simpleton and his companions must immediately eat twelve whole oxen and twelve tons of bread. Once again, while the King was still speaking to his messenger, the Listener heard the plan. He went straight to the Simpleton and repeated the new command.
        - id: ch03-b15
          speaker: simpleton
          text: Oh, what in the world can I do? Eating all that could take us a year. It might take our whole lives.
          emotion: fearful
        - id: ch03-b16
          speaker: glutton
          text: Don't worry. I'm so hungry, it may not be enough for me.
        - id: ch03-b17
          speaker: narrator
          text: When the courtier arrived with the royal message, the Simpleton sent him back with a promise that the order would be obeyed. Servants brought twelve roasted oxen and twelve tons of bread and laid the entire feast beside the ship. The great eater sat down before it. In that single sitting, he devoured every ox and every last piece of bread.
        - id: ch03-b18
          speaker: glutton
          text: I call that a small meal. I wish they'd brought more.
        - id: ch03-b19
          speaker: narrator
          text: The King tried yet another test. This time, the Simpleton and his whole company were ordered to drink forty casks of wine on the spot, and every cask held forty gallons. The Listener caught the King's words as he had before. He brought the command back to the Simpleton, who fell into despair once more.
        - id: ch03-b20
          speaker: simpleton
          text: Oh, what can we do now? Drinking so much could take a year. It might take our whole lives.
          emotion: fearful
        - id: ch03-b21
          speaker: drinker
          text: Don't be afraid. I'll swallow it all in one gulp. Just watch me.
        - id: ch03-b22
          speaker: narrator
          text: The forty great casks were brought to the ship. In no time at all, every one of them had vanished down the thirsty man's throat.
        - id: ch03-b23
          speaker: drinker
          text: I'm still thirsty. I could have done with two more casks.
    - id: ch04
      title: The Iron Bathhouse
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The King then invited the Simpleton to take a bath in the royal palace. Once the bath was over, he promised, the betrothal could take place. It sounded like the trials were finally done, but the bathhouse was made entirely of iron. In secret, the King ordered his servants to heat the room so fiercely that the Simpleton would suffocate inside it.
        - id: ch04-b02
          speaker: narrator
          text: When the Simpleton entered, he found the iron walls glowing red. Luckily, the straw bearer had followed him inside. Once the door was shut, his companion scattered the peculiar straw. The red-hot walls cooled in an instant. Then the room became so bitterly cold that the Simpleton could scarcely bear to bathe, and all the water froze.
        - id: ch04-b03
          speaker: narrator
          text: With the bathwater frozen solid, the Simpleton climbed onto the stove. He wrapped himself from head to foot in the bath blankets and lay there through the whole night. In the morning, the King's servants opened the iron door, expecting to find that the heat had killed him. Instead, he was lying there safe and sound, cheerfully singing to himself.
        - id: ch04-b04
          speaker: narrator
          text: When the King heard this astonishing news, he grew sad. He could think of no way to escape such an unwanted son-in-law. Then a brilliant idea came to him.
        - id: ch04-b05
          speaker: king
          text: Tell that rascal to raise an army for me this very instant! Go and give him my royal command. This time, I believe I have him.
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: As before, the Listener overheard the command and repeated it to the Simpleton.
        - id: ch04-b07
          speaker: simpleton
          text: Oh no! Now I'm truly finished.
          emotion: fearful
        - id: ch04-b08
          speaker: wood_bearer
          text: Not at all. Have you forgotten about me?
        - id: ch04-b09
          speaker: narrator
          text: Meanwhile, the courtier ran all the way from the palace. He reached the ship panting and delivered the King's message.
        - id: ch04-b10
          speaker: simpleton
          text: Good. I will raise the King's army. But if he still refuses to accept me as his son-in-law, I will make war on him and carry the Princess away by force.
        - id: ch04-b11
          speaker: narrator
          text: That night, the Simpleton and the wood bearer went into a great field and took the bundle with them. The wood bearer spread the sticks in every direction. At once, a mighty army covered the field. Regiment after regiment of foot soldiers and horsemen stood there. Bugles rang out and drums thundered. The warhorses neighed, the riders lowered their lances, and the soldiers presented their weapons.
    - id: ch05
      title: The Royal Wedding
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next morning, the King woke to the noise of war. He heard bugles and drums, clattering horses, and shouting soldiers. From his window, he saw lances flash in the sunlight and weapons and armor glitter across the field.
        - id: ch05-b02
          speaker: king
          text: Against this man, I am powerless.
        - id: ch05-b03
          speaker: narrator
          text: The King sent the Simpleton royal robes and costly jewels. Then he commanded him to come to the palace and marry the Princess. The young man dressed in all the royal finery. When he appeared at Court, he looked so grand and stately that no one could have recognized the poor Simpleton who had first arrived in the flying ship. He seemed completely changed. The moment the Princess saw him, she fell in love with him.
        - id: ch05-b04
          speaker: narrator
          text: Never had anyone seen such a splendid wedding. Food and wine were everywhere, and there was so much of both that even the great eater and the great drinker had all they wanted.
