audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的神秘与幽默, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    simpleton:
      display_name: 傻小子
      tts: {delivery: 憨直朴实，遇事慌张却始终守信, timbre: 清亮厚实, pace: 稍缓, pitch: 中音}
    mother:
      display_name: 母亲
      tts: {delivery: 偏心而不耐烦，话说得直截了当, timbre: 苍老干脆, pace: 稳健, pitch: 中音}
    old_manikin:
      display_name: 小老头儿
      tts: {delivery: 和善神秘，吩咐清楚而笃定, timbre: 温暖微哑, pace: 舒缓, pitch: 中高音}
    listener:
      display_name: 顺风耳
      tts: {delivery: 机警敏锐，说话利落, timbre: 清晰明亮, pace: 稍快, pitch: 中音}
    runner:
      display_name: 飞毛腿
      tts: {delivery: 自信爽快，行动迅疾又略显贪睡, timbre: 轻快清朗, pace: 稍快, pitch: 中高音}
    marksman:
      display_name: 神枪手
      tts: {delivery: 沉着自信，语气干净果断, timbre: 坚实清亮, pace: 稳健, pitch: 中音}
    glutton:
      display_name: 大肚汉
      tts: {delivery: 豪爽坦率，对食物永不满足, timbre: 浑厚洪亮, pace: 从容, pitch: 中低音}
    drinker:
      display_name: 海量汉子
      tts: {delivery: 豪迈自信，总像还没有喝够, timbre: 宽厚响亮, pace: 从容, pitch: 中低音}
    wood_carrier:
      display_name: 背木柴的伙伴
      tts: {delivery: 沉稳可靠，关键时刻胸有成竹, timbre: 低沉厚实, pace: 稳健, pitch: 低音}
    straw_carrier:
      display_name: 背稻草的伙伴
      tts: {delivery: 朴实平静，对神奇本领习以为常, timbre: 温和微哑, pace: 稍缓, pitch: 中音}
    king:
      display_name: 国王
      tts: {delivery: 骄傲狡猾，受挫时焦躁恼怒, timbre: 威严低沉, pace: 稳健, pitch: 低音}
    courtier:
      display_name: 廷臣
      tts: {delivery: 恭谨正式，传令时清楚利落, timbre: 清晰平直, pace: 稳健, pitch: 中音}
  chapters:
    - id: ch01
      title: 傻小子和飞船
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一对老夫妻有三个儿子。两个哥哥聪明，又会讨母亲欢心，给她好衣裳，陪她说好听的话。老三却是个十足的傻小子，总在母亲跟前碍事，母亲对他一点耐心也没有。一天，村里传开了国王的诏令。谁造得出一艘会飞的船，谁就能迎娶公主。两个哥哥马上要去碰碰运气，还请父母为他们祝福。母亲替他们收拾好衣服，装足一路的食物，又放进一瓶白兰地。哥哥们一走，傻小子也缠着母亲，要她替自己收拾好，放他出门。
        - id: ch01-b02
          speaker: mother
          text: 你这么个傻瓜，出去能做成什么？只怕先叫狼吃了！
        - id: ch01-b03
          speaker: simpleton
          text: 我要去，我要去，我就是要去！
        - id: ch01-b04
          speaker: narrator
          text: 母亲实在拗不过他，只扔给他一块硬面包皮和一瓶水，便不再理会。傻小子带着这点寒酸的食物上了路。没走出多远，他遇见一个身材矮小的老头儿。两人客客气气地问候过，老头儿便问起他要到哪里去。
        - id: ch01-b05
          speaker: simpleton
          text: 我要去国王的宫廷。谁能造出一艘飞船，国王就把女儿嫁给谁。
        - id: ch01-b06
          speaker: old_manikin
          text: 那你造得出飞船吗？
        - id: ch01-b07
          speaker: simpleton
          text: 我造不出。
        - id: ch01-b08
          speaker: old_manikin
          text: 那你还去干什么？
        - id: ch01-b09
          speaker: simpleton
          text: 我也不知道。
        - id: ch01-b10
          speaker: old_manikin
          text: 既然这样，就坐下来陪我歇会儿。咱们吃点东西吧，把你袋里的食物拿出来。
        - id: ch01-b11
          speaker: narrator
          text: 傻小子怕那块硬面包皮叫人笑话，可还是打开了袋子。谁知里面竟有两只新鲜柔软的面包卷，还有一些冷肉。他惊得不敢相信自己的眼睛，连忙拿出来同老头儿分享。老头儿吃完，舔了舔嘴唇。
        - id: ch01-b12
          speaker: old_manikin
          text: 走进那片树林，在第一棵树前鞠三个躬，再拿斧头砍树。接着跪下，把脸贴在地上，等到有人扶你起来。那时，你身边会出现一艘船。登上去，飞往王宫。路上不管遇见谁，都请他一道上船。
        - id: ch01-b13
          speaker: narrator
          text: 傻小子诚心诚意谢过老头儿，同他告别后走进树林。他在第一棵树前停步，把每一句吩咐都照办了。等他跪下去，把脸贴住泥土，不知不觉便睡着了。过了一阵，有人将他唤醒。他睁开眼睛，揉了又揉，看见身旁果然停着一艘已经造好的船，立刻登了上去。船不断升高，转眼飞进空中。傻小子守在船边向下张望，发现路上有个人正跪在湿地上，把一只耳朵紧紧贴着泥土。
        - id: ch01-b14
          speaker: simpleton
          text: 喂！你趴在下面干什么？
        - id: ch01-b15
          speaker: listener
          text: 我在听世上各处发生的事。
        - id: ch01-b16
          speaker: simpleton
          text: 那就上船来，跟我一起走吧。
        - id: ch01-b17
          speaker: narrator
          text: 那人听见邀请，求之不得，马上登船坐到傻小子身旁。飞船在空中飞呀，飞呀，飞呀。过了一程，傻小子又从船边看见下面的路上有个人单腿蹦跳，另一条腿竟然捆起来，挂在耳朵后面。
        - id: ch01-b18
          speaker: simpleton
          text: 喂！你为什么只用一条腿跳着走？
        - id: ch01-b19
          speaker: runner
          text: 我走得实在太快。要是不捆住一条腿，一步就蹿到世界尽头了。
        - id: ch01-b20
          speaker: simpleton
          text: 那就上船，同我们一道走。
        - id: ch01-b21
          speaker: narrator
          text: 飞毛腿毫不推辞，也上了船。飞船不停向前，越飞越远。傻小子始终留心看着下面，忽然望见路上有个人举起一支枪，正朝遥远的地方瞄准。
        - id: ch01-b22
          speaker: simpleton
          text: 喂！你瞄准什么呢？这么远望过去，连一只鸟也没有。
        - id: ch01-b23
          speaker: marksman
          text: 打近处有什么意思？百英里外的飞禽走兽，我也能一枪命中。这样的目标才值得我开枪。
        - id: ch01-b24
          speaker: simpleton
          text: 那你也上船来吧。
        - id: ch01-b25
          speaker: narrator
          text: 神枪手听了十分高兴，也登船加入他们。飞船继续向前，越飞越远。傻小子又看见下面的道路上有个人背着满满一篮面包，便探出身子，朝他挥手呼喊。
        - id: ch01-b26
          speaker: simpleton
          text: 喂！你要上哪儿去？
        - id: ch01-b27
          speaker: glutton
          text: 我要去拿点面包吃早饭。
        - id: ch01-b28
          speaker: simpleton
          text: 可你背上已经有满满一篮面包了呀。
        - id: ch01-b29
          speaker: glutton
          text: 这么一点算什么？我一口就能吞光。
        - id: ch01-b30
          speaker: simpleton
          text: 那就上船，跟我们走吧。
    - id: ch02
      title: 奇异的伙伴
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 大肚汉上船以后，飞船再次升入空中，一路向前飞去。前方出现一座宽阔的大湖。傻小子往下一看，只见一个人沿着湖岸走来走去，四处张望，显然是在寻找什么东西。
        - id: ch02-b02
          speaker: simpleton
          text: 喂！你在找什么？
        - id: ch02-b03
          speaker: drinker
          text: 找水喝。我实在太渴了。
        - id: ch02-b04
          speaker: simpleton
          text: 眼前就是一整座湖，你怎么不喝？
        - id: ch02-b05
          speaker: drinker
          text: 这么点水也叫够？我一口就能喝干整座湖。
        - id: ch02-b06
          speaker: simpleton
          text: 那你也上船来吧。
        - id: ch02-b07
          speaker: narrator
          text: 海量汉子也成了船上的伙伴。飞船飞得更远了。傻小子又来到船边向外看，这一回，他发现下方的森林里有个人拖着一捆木柴，一步一步从树木之间穿过。
        - id: ch02-b08
          speaker: simpleton
          text: 喂！森林里到处都是树，你为什么还拖着木柴走？
        - id: ch02-b09
          speaker: wood_carrier
          text: 这不是普通木柴。
        - id: ch02-b10
          speaker: simpleton
          text: 那它有什么特别？
        - id: ch02-b11
          speaker: wood_carrier
          text: 只要扔到地上，这捆木柴就会变成一支大军。
        - id: ch02-b12
          speaker: simpleton
          text: 那就上船，同我们一起走。
        - id: ch02-b13
          speaker: narrator
          text: 背木柴的人也加入了。飞船飞呀飞，傻小子又望见一个背稻草的人。
        - id: ch02-b14
          speaker: simpleton
          text: 喂！你要把稻草背到哪里？
        - id: ch02-b15
          speaker: straw_carrier
          text: 我要把它背到村子里。
        - id: ch02-b16
          speaker: simpleton
          text: 难道村里没有稻草吗？
        - id: ch02-b17
          speaker: straw_carrier
          text: 这捆可不一样。哪怕盛夏最热的时候，只要把它撒开，天马上会冷下来，雪也会落下来，把人冻僵。
        - id: ch02-b18
          speaker: narrator
          text: 傻小子听完，也请他上了船。就这样，飞船载着一群奇异的伙伴，终于来到国王的宫廷。国王那时正在吃饭，远远瞧见空中飞来一只从未见过的庞大怪鸟，立刻派一名廷臣去探个究竟。廷臣来到近前，探头朝船里一看，马上认出了它。他匆匆赶回去禀报，说那不是鸟，而是一艘真正的飞船，船上坐着的不过是几个农民。
        - id: ch02-b19
          speaker: narrator
          text: 国王这才想起自己当众立过的誓言。可是，一想到要把公主嫁给一个穷农民，他便怎么也不肯答应。他想了又想，盘算了许久，终于有了一个自以为高明的主意。
        - id: ch02-b20
          speaker: king
          text: 我交给他几件绝对办不成的差事，自然就能把他赶走。
        - id: ch02-b21
          speaker: narrator
          text: 国王当场叫来一名廷臣，仔细吩咐他去传令。傻小子必须赶在国王吃完这顿饭以前，从世界尽头取回疗伤神水。可国王的话还没交代完，船上的顺风耳已经听得一清二楚，连忙把这道要命的差事告诉傻小子。
        - id: ch02-b22
          speaker: simpleton
          text: 哎呀，这可怎么办？要找到那神水，恐怕得花一年，甚至耗上一辈子。
          emotion: fearful
        - id: ch02-b23
          speaker: runner
          text: 不用怕。国王要的神水，我去取。
        - id: ch02-b24
          speaker: narrator
          text: 这时，廷臣恰好来到船边，把国王的命令说了一遍。
        - id: ch02-b25
          speaker: simpleton
          text: 请回禀陛下，他的命令一定照办。
    - id: ch03
      title: 国王的三项难题
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 飞毛腿解开挂在耳后的那条腿，拔脚便跑。他的脚程实在快得惊人，一眨眼已经来到世界尽头，又从那里的井中打出疗伤神水。赶完这段路，他却觉得身上有些疲倦。
        - id: ch03-b02
          speaker: runner
          text: 先歇几分钟吧。国王离吃甜点还早呢。
        - id: ch03-b03
          speaker: narrator
          text: 他躺倒在草地上。阳光晃眼，他一闭上眼睛，很快便睡熟了。船上的伙伴焦急地等着，眼看国王快要吃完午饭，飞毛腿仍不见踪影。顺风耳俯下身，把耳朵贴到地上。
        - id: ch03-b04
          speaker: listener
          text: 这家伙真会挑时候！他正躺在地上，呼噜打得震天响呢！
          emotion: surprised
        - id: ch03-b05
          speaker: narrator
          text: 神枪手立刻端起枪，朝世界尽头的方向仔细瞄准，随即开了一枪，用枪声惊醒那个贪睡的伙伴。片刻之后，飞毛腿果然赶回来了。他登上飞船，把疗伤神水亲手交给傻小子。国王还坐在桌前吃着最后几口午饭，消息已经送进宫里。第一道命令被他们分毫不差地完成了。
        - id: ch03-b06
          speaker: narrator
          text: 国王只得另想一件更难的事。他叫来廷臣，命傻小子和伙伴们立刻吃光十二头牛和十二吨面包。顺风耳照旧听见了全部吩咐。
        - id: ch03-b07
          speaker: simpleton
          text: 哎呀，十二头牛、十二吨面包！我们吃上一年也吃不完，也许一辈子都不够。
        - id: ch03-b08
          speaker: glutton
          text: 这有什么可怕的？我正饿着呢，只怕那点东西还不够。
        - id: ch03-b09
          speaker: narrator
          text: 廷臣带着国王的口信来到船边。傻小子仍旧请他回去禀报，说这道命令一定照办。没过多久，十二头已经烤熟的牛和十二吨面包全被送到飞船旁。大肚汉独自坐下来，只用一顿饭的工夫，便将那么多食物吃得干干净净。
        - id: ch03-b10
          speaker: glutton
          text: 这顿也太少了。要是他们再多送些来就好了。
        - id: ch03-b11
          speaker: narrator
          text: 国王接着下令，要他们当场喝光四十桶酒，每桶都有四十加仑。顺风耳把话转告傻小子，傻小子顿时陷入绝望。
        - id: ch03-b12
          speaker: simpleton
          text: 哎呀，这么多酒怎么喝得完？只怕一年不够，一辈子也不够。
          emotion: fearful
        - id: ch03-b13
          speaker: drinker
          text: 别担心。我一口就能喝光，你等着看吧。
        - id: ch03-b14
          speaker: narrator
          text: 四十桶酒送到飞船旁边，每桶足有四十加仑。海量汉子张口一喝，转眼间，所有酒桶都空了。
        - id: ch03-b15
          speaker: drinker
          text: 怎么我还是渴？再来两桶才好呢。
    - id: ch04
      title: 烧红的铁浴室
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 国王又想出一条毒计。他传令让傻小子到王宫的浴室洗澡，还许诺说，等他洗完就举行订婚礼。那间浴室全用铁造成。国王早已吩咐手下把它烧到滚烫，打算将傻小子活活闷死。可怜的年轻人一进去，就看见四面的铁墙已经烧得通红。幸好背稻草的伙伴也跟在他身后，一起走进了浴室。
        - id: ch04-b02
          speaker: narrator
          text: 门刚在两人身后关紧，伙伴便把背来的稻草撒满浴室。烧红的铁墙一下子冷却，屋里越来越冷，最后冷得傻小子几乎受不了，连所有的洗澡水都结成了冰。澡当然洗不成了。傻小子只好爬上炉子，用洗澡的毯子紧紧裹住身体，在那里躺了一整夜。第二天早晨，人们打开门，看见他安然无恙地躺着，嘴里还快活地唱着歌。
        - id: ch04-b03
          speaker: narrator
          text: 这桩怪事传到国王耳中，他愁得不得了。这个女婿如此不中意，却怎么也赶不走。正苦恼时，一个新主意忽然冒了出来。
        - id: ch04-b04
          speaker: king
          text: 叫那个混蛋立刻给我变出一支军队！马上把朕的旨意传给他。这一回，我看他还怎么逃得掉。
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 顺风耳又听见国王的命令，赶紧转告傻小子。
        - id: ch04-b06
          speaker: simpleton
          text: 哎呀，这一回我真的完了。
          emotion: fearful
        - id: ch04-b07
          speaker: wood_carrier
          text: 怎么会呢？你难道把我忘了？
        - id: ch04-b08
          speaker: narrator
          text: 说话的正是那个拖着木柴穿过森林的伙伴。这时，廷臣从宫殿一路跑来，累得上气不接下气，终于把国王的命令传到了。
        - id: ch04-b09
          speaker: courtier
          text: 陛下命你立刻为他变出一支军队。
        - id: ch04-b10
          speaker: simpleton
          text: 好，我就替国王变出一支军队。不过，事情办成以后，他若还不肯认我这个女婿，我便向他开战，用武力带走公主。
    - id: ch05
      title: 大军与婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 夜里，傻小子和背木柴的伙伴带着那捆神奇的木柴，一起走进一片广阔的田野。伙伴把木柴朝四面八方撒开。只在顷刻之间，一支威武的大军便出现在原野上。步兵与骑兵一团接一团，一队接一队，望不到尽头。号角吹响，战鼓擂动，战马长嘶。骑手端平长矛，士兵齐齐举起武器敬礼。
        - id: ch05-b02
          speaker: narrator
          text: 第二天早晨，国王被这些征战的声响惊醒。号角与战鼓震耳欲聋，战马不停嘶鸣，士兵们的呼喊一阵接着一阵。国王急忙走到窗前，只见阳光照在大军身上。无数长矛闪闪发亮，铠甲与兵器也耀眼生辉。
        - id: ch05-b03
          speaker: king
          text: 同这个人相比，我根本没有抵抗的力量。
        - id: ch05-b04
          speaker: narrator
          text: 骄傲的国王终于低头了。他送去王室礼服和昂贵的珠宝，命傻小子穿戴起来，进宫迎娶公主。未来的女婿换上华贵礼服，立刻显得威风凛凛、气度不凡，整个人都变了模样。再也没有人认得出，他就是从前那个可怜的傻小子。公主第一眼看见他，便爱上了他。
        - id: ch05-b05
          speaker: narrator
          text: 世上从未有过这样盛大的婚礼。宴席上的食物和美酒多得惊人，就连大肚汉与海量汉子，也终于吃饱喝足了。
