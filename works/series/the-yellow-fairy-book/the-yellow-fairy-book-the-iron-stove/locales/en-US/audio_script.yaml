  chapters:
    - id: ch01
      title: The Voice in the Iron Stove
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, when wishes still came true, an old witch enchanted a king's son. She shut him inside a great iron stove in the middle of a wood. He lived there for years, and no one could set him free. Then a king's daughter lost her way in that same wood. For nine days she wandered in circles, unable to find her father's kingdom. At last, she came upon the iron stove, and a voice spoke from inside it.
        - id: ch01-b02
          speaker: prince
          text: Where have you come from, and where are you trying to go?
        - id: ch01-b03
          speaker: princess
          text: I cannot find the road to my father's kingdom. I fear I will never reach home.
        - id: ch01-b04
          speaker: prince
          text: I can bring you home very quickly, if you promise to do what I ask. I am a prince of higher rank than you, and I mean to marry you.
        - id: ch01-b05
          speaker: narrator
          text: The princess was frightened. What could a young woman do with an iron stove? But she longed to return to her father, so she gave her promise.
        - id: ch01-b06
          speaker: prince
          text: Come back to me with a knife. Use it to scrape a hole through the iron.
        - id: ch01-b07
          speaker: narrator
          text: The prince sent her a silent guide. He walked beside her and brought her home in only two hours. Joy filled the castle. The old king embraced and kissed his daughter, but she was deeply troubled.
        - id: ch01-b08
          speaker: princess
          text: Dear Father, listen to what happened. I would never have escaped that great wild wood if I had not found an iron stove. I had to promise that I would go back, free the one inside, and marry him.
        - id: ch01-b09
          speaker: narrator
          text: The old king nearly fainted from fear, for she was his only daughter. After they talked it over, they decided to send the beautiful miller's daughter in her place.
    - id: ch02
      title: The Princess Keeps Her Word
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The miller's daughter was taken to the stove and given a knife. She scraped at the iron for twenty-four hours without leaving the smallest mark. At daybreak, the voice called from inside.
        - id: ch02-b02
          speaker: prince
          text: I believe morning has come outside.
        - id: ch02-b03
          speaker: millers_daughter
          text: I think so too. I can hear my father's mill turning.
        - id: ch02-b04
          speaker: prince
          text: Then you are the miller's daughter. Leave at once, and tell the king's daughter to come herself.
        - id: ch02-b05
          speaker: narrator
          text: She returned and told the king that the man in the stove had refused her. He still wanted the princess. The king was afraid, and his daughter wept. Then they chose the swineherd's daughter, who was even more beautiful, and paid her a piece of gold to take the princess's place. She too scraped for a full day and made no mark. When dawn came, the voice spoke again.
        - id: ch02-b06
          speaker: prince
          text: It sounds as if daylight has come.
        - id: ch02-b07
          speaker: swineherds_daughter
          text: Yes, I think it has. I hear my father blowing his horn.
        - id: ch02-b08
          speaker: prince
          text: So you are the swineherd's daughter. Go away and send the king's daughter. Tell her my warning will come true. If she refuses to come, her whole kingdom will fall into ruin, until not one stone stands upon another.
        - id: ch02-b09
          speaker: narrator
          text: The princess cried when she heard the warning, but nothing could change her promise. She said goodbye to her father, tucked a knife into her belt, and went back to the stove. The moment she arrived, she began scraping. This time the iron yielded. Before two hours had passed, she had opened a little hole. She looked through it and saw a beautiful young man shining with gold and precious stones. At once, she fell in love with him. She worked harder until the opening was wide enough for him to climb out.
        - id: ch02-b10
          speaker: prince
          text: You are mine, and I am yours. You are my bride, and you have set me free.
        - id: ch02-b11
          speaker: narrator
          text: He wanted to take her straight to his kingdom. She begged to visit her father once more. The prince agreed, but warned her to say no more than three words to her father before returning. She went home and, alas, spoke more than three. At once, the iron stove vanished and passed away over a mountain of glass and sharp swords. The prince himself remained free, no longer shut inside it.
        - id: ch02-b12
          speaker: narrator
          text: The princess took leave of her father, carried a little money with her, and returned to the great wood to search for the stove. For nine days she looked, but she could not find it. At last, hunger left her wondering how she could live. That evening she climbed a small tree. She feared the wild beasts and wished the night would never come.
    - id: ch03
      title: The House of Toads
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At midnight, she saw a tiny light far away and wished she could reach it. She climbed down and followed it to a little old house surrounded by tall grass. A heap of wood stood outside. Wondering what she might find there, she peered through the window. The room held only large and little toads. Yet a table was beautifully set with roast meat and wine, and every dish and cup was silver. The sight gave her courage, and she knocked.
        - id: ch03-b02
          speaker: old_toad
          text: Little green toad with crooked leg, open the door and see who shook the latch.
        - id: ch03-b03
          speaker: narrator
          text: A little toad came and let her in. All the toads welcomed her and gave her a seat. They asked how she had reached their house and what she wanted. The princess told them everything that had happened. She had broken the prince's rule by speaking more than three words, so the stove had vanished with him. She had already searched for a long time, and now she must keep wandering over mountain and valley until she found him.
        - id: ch03-b04
          speaker: old_toad
          text: Little green toad with twisted leg, go to the corner you know and bring me the great old chest.
        - id: ch03-b05
          speaker: narrator
          text: The little toad brought out a huge chest. Then the toads gave the princess food and drink. They led her to a beautiful bed of silk and rich cloth, where she slept soundly.
        - id: ch03-b06
          speaker: narrator
          text: At dawn, the princess rose from the silken bed. The old toad opened the huge chest and took out three kinds of things for her journey. The princess would need them to cross a high glass mountain, three cutting swords, and a great lake. Once she had passed all three dangers, she would find her beloved again. The toad gave her three large needles, a plough-wheel, and three nuts, and told her to guard them carefully.
        - id: ch03-b07
          speaker: narrator
          text: The princess set out. When she reached the glass mountain, its surface was so slippery that she could not walk on it. She placed the needles behind her feet and then ahead of them, step by step, until she crossed. On the other side, she put them safely away. At the three cutting swords, she climbed onto the plough-wheel and rolled over them. Last came the great lake. When she had crossed it, she found a beautiful castle.
    - id: ch04
      title: Two Nights at the Prince's Door
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The princess entered the castle and presented herself as a poor maid looking for work. She knew the prince she had freed was there. The household hired her as a kitchen-maid for very little pay. But the prince believed she had died long ago, and he was about to marry another princess.
        - id: ch04-b02
          speaker: narrator
          text: That evening, after the kitchen-maid finished washing up and was ready to rest, she felt the three nuts in her pocket. She cracked the first, meaning to eat its kernel. Instead, she found a beautiful royal dress inside. When the bride heard about it, she came and begged to have it. She offered to buy the dress and insisted that something so fine did not belong to a servant.
        - id: ch04-b03
          speaker: princess
          text: I will not sell it for money. You may have it if you let me sleep outside the prince's door tonight.
        - id: ch04-b04
          speaker: narrator
          text: The bride agreed. The dress was lovely, and she owned few like it. That evening, she spoke to her bridegroom.
        - id: ch04-b05
          speaker: bride
          text: That foolish maid wants to sleep outside your door.
        - id: ch04-b06
          speaker: prince
          text: If that suits you, it suits me.
        - id: ch04-b07
          speaker: narrator
          text: But the bride poured a sleeping draught into his wine. In his room, he slept so deeply that the kitchen-maid could not wake him. She wept outside his door through the whole night.
        - id: ch04-b08
          speaker: princess
          text: I freed you from the iron stove in the wild wood. I searched for you. I crossed a glass mountain, three sharp swords, and a great lake to find you. Why will you not hear me now?
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: Servants nearby heard her crying and told their master in the morning.
        - id: ch04-b10
          speaker: narrator
          text: The next evening, after she had washed everything in the kitchen, she cracked the second nut. Inside was a dress even finer than the first. The bride saw it and wanted this one too, but again the kitchen-maid refused money. Her price was another night outside the prince's door. The bride agreed, then slipped another sleeping draught into his drink. Once more, he slept so soundly that he heard nothing while the kitchen-maid wept through the night.
        - id: ch04-b11
          speaker: princess
          text: I set you free from the iron stove in the wood. I searched until I had crossed a glass mountain, three sharp swords, and a great lake. I came all that way to find you, and still you do not hear me.
          emotion: sad
        - id: ch04-b12
          speaker: narrator
          text: Again, the servants heard her crying. In the morning, they told the prince what had happened.
    - id: ch05
      title: The Third Nut
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: On the third evening, the kitchen-maid finished washing up and cracked the last nut. This time, the dress inside was more beautiful still, and it was made of pure gold. The bride wanted it the moment she saw it.
        - id: ch05-b02
          speaker: princess
          text: You may have this dress only if I sleep outside the prince's door for a third night.
        - id: ch05-b03
          speaker: narrator
          text: The bride accepted her condition. But that night, the prince took care not to drink the sleeping draught. When the kitchen-maid began to weep, he heard her.
        - id: ch05-b04
          speaker: princess
          text: My dearest, I freed you from that terrible wood and from the iron stove.
          emotion: sad
        - id: ch05-b05
          speaker: narrator
          text: The prince sprang up.
        - id: ch05-b06
          speaker: prince
          text: You are right. You are mine, and I am yours.
        - id: ch05-b07
          speaker: narrator
          text: Though it was still night, he climbed into a carriage with the true bride beside him. They took away the false bride's clothes so that she could not follow them. Then the prince and princess left the castle together and began the long journey back.
    - id: ch06
      title: Two Kingdoms
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At the great lake, the prince and princess rowed across. At the three sharp swords, they sat on the plough-wheel and rolled over them. At the glass mountain, they used the three needles to climb. At last, they reached the little old house.
        - id: ch06-b02
          speaker: narrator
          text: The moment they stepped inside, the little old house changed into a great castle. Every one of the toads was freed from enchantment and became a beautiful king's child. The king's children ran about the castle in joy.
        - id: ch06-b03
          speaker: narrator
          text: The prince and princess were married there and remained in that castle, which was far larger than her father's. But the old king did not like living alone, so they went and brought him to stay with them. In this way, they had two kingdoms and lived in great wealth.
        - id: ch06-b04
          speaker: narrator
          text: A mouse has run. My story is done.
