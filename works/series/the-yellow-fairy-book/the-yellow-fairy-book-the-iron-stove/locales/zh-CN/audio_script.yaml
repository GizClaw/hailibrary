audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与温情
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    princess:
      display_name: 公主
      tts:
        delivery: 真挚柔和，在漫长考验中渐渐坚定
        timbre: 清澈年轻
        pace: 适中
        pitch: 中高音
    first_king:
      display_name: 老国王
      tts:
        delivery: 慈爱庄重，忧虑时略显迟疑
        timbre: 浑厚成熟
        pace: 稍缓
        pitch: 中低音
    prince:
      display_name: 王子
      tts:
        delivery: 高贵笃定，感情深沉而克制
        timbre: 温暖清朗
        pace: 适中
        pitch: 中低音
    millers_daughter:
      display_name: 磨坊主的女儿
      tts:
        delivery: 朴实直率，回答时不加修饰
        timbre: 明亮年轻
        pace: 适中
        pitch: 中高音
    swineherds_daughter:
      display_name: 猪倌的女儿
      tts:
        delivery: 坦率质朴，语气利落
        timbre: 清亮年轻
        pace: 适中
        pitch: 中音
    old_toad:
      display_name: 老蟾蜍
      tts:
        delivery: 慈和神秘，念歌谣时庄重而有韵律
        timbre: 低沉苍老
        pace: 舒缓
        pitch: 低音
    little_toad:
      display_name: 小蟾蜍
      tts:
        delivery: 机敏殷勤，动作轻快
        timbre: 轻细清脆
        pace: 适中
        pitch: 高音
    bride:
      display_name: 假新娘
      tts:
        delivery: 矜持而精于算计，面对珍宝时急切
        timbre: 平滑冷淡
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 铁炉里的声音
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，在愿望还能成真的年代，一位王子中了老巫婆的魔法，从此只能待在森林里的一只大铁炉中。他在那里过了许多年，始终没人能救他出来。后来，一位公主在同一片森林里迷了路。她找不到回父亲王国的方向，绕来绕去走了九天，最后来到那只铁炉跟前。就在这时，炉里传出了声音。
        - id: ch01-b02
          speaker: prince
          text: 你从哪里来，又想去哪里？
        - id: ch01-b03
          speaker: princess
          text: 我找不到回父亲王国的路，恐怕再也回不了家了。
        - id: ch01-b04
          speaker: prince
          text: 只要你答应我的要求，我很快就能送你回家。我是王子，身份比你还尊贵。我要娶你做妻子。
        - id: ch01-b05
          speaker: narrator
          text: 公主害怕了。一个年轻姑娘怎么能和铁炉过日子呢？可她实在太想回家，还是答应了。
        - id: ch01-b06
          speaker: prince
          text: 你要再回来一次，带上一把刀，在铁炉上刮出一个洞。
        - id: ch01-b07
          speaker: narrator
          text: 王子派来一个沉默的引路人。那人陪公主走了两个钟头，就把她送回了家。城堡里一片欢腾，老国王搂着唯一的女儿连连亲吻。公主却满心不安。
        - id: ch01-b08
          speaker: princess
          text: 亲爱的父亲，请听我说。要不是碰见那只铁炉，我根本走不出大森林。为了回来，我答应再去救出炉里的人，还要嫁给他。
        - id: ch01-b09
          speaker: narrator
          text: 老国王听得差点昏过去，因为公主是他唯一的女儿。父女俩商量后，决定请美貌的磨坊主女儿冒充公主。他们把姑娘带到森林，交给她一把刀，叫她去刮铁炉。她刮了整整二十四个钟头，却连一点痕迹也没留下。天亮时，炉里的声音开口了。
        - id: ch01-b10
          speaker: prince
          text: 外面好像天亮了。
        - id: ch01-b11
          speaker: millers_daughter
          text: 我也觉得天亮了。我好像听见父亲的磨坊在轰隆隆地转。
        - id: ch01-b12
          speaker: prince
          text: 原来你是磨坊主的女儿。马上走，叫国王的女儿自己来。
    - id: ch02
      title: 公主信守诺言
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 磨坊主的女儿回去禀告老国王，炉里的人不要她，只肯见公主。国王害怕，公主也哭了。王宫里还有一位猪倌的女儿，她比先前的姑娘更加漂亮。国王给了她一枚金币，请她代替公主。她同样刮了整整二十四个钟头，没能伤到铁炉分毫。清晨，炉里的声音又问起天色。
        - id: ch02-b02
          speaker: prince
          text: 外面是不是已经亮了？
        - id: ch02-b03
          speaker: swineherds_daughter
          text: 我想是的。我听见父亲在吹号角。
        - id: ch02-b04
          speaker: prince
          text: 你是猪倌的女儿。马上离开，让国王的女儿过来。告诉她，我说的事一定会发生。她要是不来，整个王国都会毁掉，连两块叠在一起的石头也不会剩下。
        - id: ch02-b05
          speaker: narrator
          text: 公主听到警告，又哭了起来。可哭也没有用，她许下的诺言不能更改。她向父亲告别，把刀插进腰带，独自回到森林。她刚一动手，铁屑便纷纷落下。还不到两个钟头，炉壁上就有了一个小洞。公主凑近洞口往里一看，只见一位俊美的青年坐在炉中，浑身闪着黄金和宝石的光。她当场就爱上了他，手里的刀刮得更快，终于把洞扩大到能让王子钻出来。
        - id: ch02-b06
          speaker: prince
          text: 你属于我，我也属于你。你是我的新娘，是你让我重获自由。
        - id: ch02-b07
          speaker: narrator
          text: 王子想马上带她去自己的王国，公主却请求再见父亲一面。他答应了，只准她和父亲说三个字，然后立刻回来。可惜公主回家后说了不止三个字。铁炉顿时消失，越过玻璃山和三把锋利的宝剑，去了遥远的地方。不过，王子已经自由，再也不必受铁炉囚禁。
        - id: ch02-b08
          speaker: narrator
          text: 公主再次辞别父亲，带上一点钱，到大森林里寻找铁炉。她找了整整九天，始终一无所获，还饿得不知道该怎么活下去。傍晚，她爬上一棵小树。她害怕森林里的野兽，真希望黑夜永远不要降临。到了午夜，她忽然看见远处有一点亮光。
        - id: ch02-b09
          speaker: princess
          text: 唉，要是我能走到那点亮光那里就好了。
        - id: ch02-b10
          speaker: narrator
          text: 她下了树，循着光来到一座低矮的旧屋。屋子周围荒草丛生，门前堆着一小堆木柴。公主担心自己闯进了可怕的地方，便从窗外悄悄看进去。屋里只有大大小小的蟾蜍，可桌上却摆着香喷喷的烤肉和美酒，所有盘子和酒杯都是银制的。眼前的景象给了她勇气，她敲响了门。
    - id: ch03
      title: 蟾蜍的旧屋
      blocks:
        - id: ch03-b01
          speaker: old_toad
          text: 小小绿蟾蜍，弯腿蹦又跳。快把大门打开瞧一瞧，看看是谁把门闩摇。
        - id: ch03-b02
          speaker: narrator
          text: 小蟾蜍应声走来，替公主打开大门。她进屋以后，所有蟾蜍都向她问好，请她坐下，问她怎么会来到这里，又在寻找什么。
        - id: ch03-b03
          speaker: princess
          text: 我没有守住约定，对父亲说了三个字以外的话，铁炉就带着王子消失了。我已经找了很久。现在，我只能继续翻山越岭，四处漂泊，直到找到他为止。
        - id: ch03-b04
          speaker: old_toad
          text: 小小绿蟾蜍，弯腿又蹒跚。快到你熟悉的墙角边，把那只古老的大箱搬到我面前。
        - id: ch03-b05
          speaker: narrator
          text: 小蟾蜍走到墙角，搬来一只硕大的旧箱子。蟾蜍们拿出食物和饮料，请公主吃饱喝足，又领她去睡一张铺着丝绸和华贵绢缎的精美床铺。公主躺下以后，安稳地睡了一整夜。
        - id: ch03-b06
          speaker: narrator
          text: 天亮后，公主从丝绸床上起身。老蟾蜍打开大箱子，拿出三样东西给她。前方有一座高高的玻璃山、三把锋利的宝剑，还有一个大湖。只有越过这些险阻，公主才能找到心上人。老蟾蜍给了她三枚大针、一个犁轮和三颗坚果，叮嘱她仔细保管。
        - id: ch03-b07
          speaker: narrator
          text: 公主带着宝物出发。玻璃山滑得站不住脚，她先把三枚大针插在脚后，再拔出来插到脚前，借力一步步翻过山。到了另一边，她小心地收好大针。面对三把利剑，她坐上犁轮，从剑刃上滚了过去。最后，她渡过大湖，来到一座美丽的城堡。
        - id: ch03-b08
          speaker: narrator
          text: 公主进了城堡，自称是个想找差事的穷姑娘。她知道自己从大森林的铁炉里救出的王子就在里面，于是甘愿留下来做工钱微薄的厨房女仆。可是王子以为她早已死去，正准备迎娶另一位公主。
    - id: ch04
      title: 王子门外的两夜
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 当天傍晚，厨房女仆洗完碗碟，准备歇息时摸到衣袋里的三颗坚果。她敲开第一颗，本想吃掉果仁，里面却出现了一件华美的王室礼服。新娘听说了，马上来求她把礼服卖给自己，还说这么好的衣服不该穿在一个女仆身上。
        - id: ch04-b02
          speaker: princess
          text: 我不要钱。只要你让我在王子的房门外睡一夜，这件礼服就归你。
        - id: ch04-b03
          speaker: narrator
          text: 那件礼服实在太美，而新娘自己又没有几件这样的衣裳，于是她答应了。到了晚上，她把女仆的要求告诉王子。
        - id: ch04-b04
          speaker: bride
          text: 那个愚蠢的女仆，偏偏想睡在你的门外。
        - id: ch04-b05
          speaker: prince
          text: 只要你愿意，我没有意见。
        - id: ch04-b06
          speaker: narrator
          text: 新娘却在他的酒里放了安眠药。王子回房以后睡得太沉，厨房女仆怎么也叫不醒他。公主守在门外，哭了整整一夜。
        - id: ch04-b07
          speaker: princess
          text: 我在荒莽的森林里，把你从铁炉中救了出来。为了找你，我翻过玻璃山，越过三把利剑，又渡过大湖。如今我就在这里，你为什么听不见我？
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: 几个仆人就在外面，他们听见公主哭了一整夜，也听见她反复诉说一路寻找王子的经过。第二天早晨，他们便把这件事告诉了王子。
        - id: ch04-b09
          speaker: narrator
          text: 第二天晚上，公主洗完碗碟，又咬开第二颗坚果。里面的礼服比第一件还美。新娘看见后也想买走，公主仍旧不要钱，只要求在王子门外再睡一夜。新娘答应以后，又让王子喝下掺有安眠药的酒。他再次沉沉睡去，整夜什么也听不见。
        - id: ch04-b10
          speaker: princess
          text: 我从森林的铁炉里救了你。为了找到你，我走过玻璃山、三把利剑和大湖。现在我终于来了，你还是听不见我的声音。
          emotion: sad
        - id: ch04-b11
          speaker: narrator
          text: 公主又哭了一夜。仆人们听得清清楚楚，第二天早晨再次告诉了主人。
    - id: ch05
      title: 第三颗坚果
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第三天晚上，公主做完厨房的活，咬开最后一颗坚果。这次出现的礼服更加美丽，整件都是纯金制成的。新娘一看就想据为己有。
        - id: ch05-b02
          speaker: princess
          text: 你可以拿走这件礼服，但要让我第三次睡在王子门外。
        - id: ch05-b03
          speaker: narrator
          text: 新娘答应了。这一回，王子留了心，没有喝下安眠药。门外刚传来公主的哭声，他就听见了。
        - id: ch05-b04
          speaker: princess
          text: 我最亲爱的心上人，我曾在可怕的荒野里，把你从铁炉中救出来。
          emotion: sad
        - id: ch05-b05
          speaker: narrator
          text: 王子立刻从床上跃起。
        - id: ch05-b06
          speaker: prince
          text: 你说得没错。你属于我，我也属于你。
        - id: ch05-b07
          speaker: narrator
          text: 天还没亮，两人便一起坐上马车。他们拿走了假新娘的衣服，让她没有衣服可穿，无法追赶，然后连夜离开城堡，踏上归途。
    - id: ch06
      title: 两个王国
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 来到大湖边，王子和公主划船渡过湖水。到了三把利剑前，他们一同坐上犁轮，从锋利的剑刃上滚过去。面对光滑的玻璃山，两人又把三枚大针插进山面，借着针的支撑一步步翻到另一边。最后，他们回到了蟾蜍居住的低矮旧屋。
        - id: ch06-b02
          speaker: narrator
          text: 两人刚踏进屋门，低矮的旧屋便化作一座宏伟的城堡。所有蟾蜍都解除了魔法，原来他们全是俊美的王子和公主。重获自由的王子和公主高兴极了，在城堡里欢喜地跑来跑去。
        - id: ch06-b03
          speaker: narrator
          text: 王子和公主在那里举行婚礼，住进了这座城堡。它比公主父亲的城堡还要大得多。可是老国王不喜欢孤零零地生活，他们便把他接来同住。于是，两人拥有了两个王国，从此过着极其富足的生活。
        - id: ch06-b04
          speaker: narrator
          text: 老鼠跑过来，故事讲完啦。
