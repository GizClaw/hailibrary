audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, clear, and quietly cautionary
        timbre: gentle and resonant
        pace: measured
        pitch: medium
    old_man:
      display_name: The Old Man
      tts:
        delivery: knowing, grave, and gently authoritative
        timbre: aged and weathered
        pace: unhurried
        pitch: low
    master_of_life:
      display_name: The Master of Life
      tts:
        delivery: solemn, compassionate, and commanding
        timbre: deep and resonant
        pace: slow
        pitch: low
  chapters:
    - id: ch01
      title: The Path to the South
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, far away in North America, there lived a beautiful maiden. No other girl in her whole tribe was thought so lovely. Many young braves wanted to marry her, but she would listen to only one. He was a handsome young chief who had won her heart years before.
        - id: ch01-b02
          speaker: narrator
          text: Their wedding was arranged, and everyone rejoiced with them. The young couple looked forward to many happy years together. Then, on the very night before the wedding feast, the maiden suddenly fell ill. Her friends gathered around her and wept, but she could not speak to them. Quietly, she died.
        - id: ch01-b03
          speaker: narrator
          text: The young chief had set his whole heart on her, and he thought of her day and night. He laid aside his bow. He no longer went hunting or joined the fighting. From sunrise until sunset, he sat beside the place where she had been laid and thought of all the happiness buried there.
        - id: ch01-b04
          speaker: narrator
          text: Many days passed. At last, a small light seemed to reach him through the darkness. The oldest people of the tribe had spoken of a path to the Land of Souls. They said that anyone who searched with care could find it.
        - id: ch01-b05
          speaker: narrator
          text: Early the next morning, the chief rose and prepared to leave. He put food in his pouch and carried an extra skin over his shoulders. He did not know how long the journey would be or what kind of country lay ahead. He knew only this. If the path was truly there, he would find it.
        - id: ch01-b06
          speaker: narrator
          text: At first, he could see no reason to choose one direction over another. Then he remembered hearing an old man say that the Land of Souls lay toward the south. Hope and courage returned to him, and he turned that way.
        - id: ch01-b07
          speaker: narrator
          text: For many miles, the land looked just like the country around his home. The forests, hills, and rivers seemed the same. Only the snow changed. It had covered the hills and trees when he set out, but it grew thinner as he traveled south, until it vanished. Soon buds opened on the trees and flowers rose beneath his feet. Blue sky replaced the heavy clouds, and birds sang all around him. Then he knew he had chosen the right road.
    - id: ch02
      title: The Keeper of the Way
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: His lost bride must be near now. The thought made his heart beat with joy, and he hurried on with quick, light steps. His path carried him through a dark wood and then up steep cliffs. At the top stood a small hut, or wigwam.
        - id: ch02-b02
          speaker: narrator
          text: An old man dressed in skins waited in the doorway with a staff in his hand. The young chief began to explain why he had come, but the old man already knew.
        - id: ch02-b03
          speaker: old_man
          text: I have been waiting for you, and I know what brought you here. The one you seek passed this way only a short time ago. Come into my hut. She rested here too. I will answer your questions and tell you where to go.
        - id: ch02-b04
          speaker: narrator
          text: The young man entered, but his heart was too eager to let him rest for long. When he stood again, the old man rose with him and led him to the door.
        - id: ch02-b05
          speaker: old_man
          text: Look far out there. Do you see the water and the plains beyond it? That is the Land of Souls. No living man can enter while he carries his body. Leave your body here, along with your bow and arrows, your skin, and your dog. I will keep them safe for you.
    - id: ch03
      title: The Land of Shadows
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The old man turned away. The young chief left his body and all his belongings behind. Now he felt as light as air, and his feet hardly seemed to touch the ground as he flew onward.
        - id: ch03-b02
          speaker: narrator
          text: The farther he went, the sweeter the scents became and the more beautiful the flowers grew. Animals no longer hid when he came near. They pressed their noses against him. Birds circled around him, and fish lifted their heads from the water to watch him pass.
        - id: ch03-b03
          speaker: narrator
          text: Before long, he noticed something stranger still. Neither rocks nor trees blocked his way. He passed right through them without even feeling it. They were not truly rocks and trees now. They were only the souls of rocks and trees, because he had entered the Land of Shadows.
        - id: ch03-b04
          speaker: narrator
          text: He hurried on as if his feet had wings. At last, he reached the shore of a great lake. A lovely island lay in the middle, and on the bank waited a canoe made of glittering stone. Two shining paddles rested inside it.
    - id: ch04
      title: The Happy Island
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The chief leaped into the canoe, seized the paddles, and pushed away from shore. Then, to his joy and wonder, another stone canoe came after him. The maiden he had traveled so far to find was sitting inside it.
        - id: ch04-b02
          speaker: narrator
          text: They could not reach each other. Great waves rolled between their canoes. Again and again, the waves seemed ready to sink the boats, but they never did. The young man and the maiden drew back in fear. Far below them lay the bones of people who had died before. Men and women struggled inside the waves, and only a few made it across. Children alone showed no fear and reached the farther shore safely.
        - id: ch04-b03
          speaker: narrator
          text: The chief and the maiden trembled at the terrible sights and sounds, yet nothing harmed them. They had lived without evil, and the Master of Life had declared that no evil would come to them. Both canoes arrived safely at the shore of the Happy Island.
        - id: ch04-b04
          speaker: narrator
          text: Together, they wandered through fields of flowers and beside rushing streams. They felt no hunger or thirst, no cold or heat. The air fed them, and the sun kept them warm. There were no graves to remind them of the dead. The young chief no longer thought of war or hunting animals. He and the maiden would gladly have walked there forever.
        - id: ch04-b05
          speaker: narrator
          text: But as the wind murmured around him, the chief heard the voice of the Master of Life.
        - id: ch04-b06
          speaker: master_of_life
          text: Go back to the place you came from. I have work for you, and your people need you. You will rule them for many years. My messenger is waiting at the gate. Take back the body you left with him, and he will tell you what you must do. Listen to him and be patient. In time, you will join the maiden you must leave now. I have accepted her, and she will stay forever young and beautiful, just as she was when I called her away from the Land of Snows.
