audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    old_man:
      display_name: 老人
      tts:
        delivery: 洞悉一切，庄重而温和，话语自有威严
        timbre: 苍老浑厚
        pace: 从容
        pitch: 低音
    master_of_life:
      display_name: 生命之主
      tts:
        delivery: 庄严慈悲，命令中带着抚慰
        timbre: 深沉洪亮
        pace: 缓慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 通往南方的路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，在遥远的北美洲，住着一位美丽的原住民姑娘。全族的姑娘里，谁也没有她那样动人。许多年轻勇士都想娶她，她却只中意一位英俊的酋长。几年前，那位酋长就已经赢得了她的心。
        - id: ch01-b02
          speaker: narrator
          text: 婚期定下来了，族人都为他们高兴，两个人也一心盼着往后长长久久地相伴。可就在婚宴前一晚，姑娘忽然病倒。亲友围着她落泪，她连一句告别的话都没能说出口，就安安静静地离开了人世。
        - id: ch01-b03
          speaker: narrator
          text: 年轻酋长把整颗心都给了她，从白天到黑夜，想的全是她。他收起弓箭，不再出征，也不再打猎。每天太阳升起，他就坐在姑娘长眠的地方，直到太阳落下。他觉得，自己所有的幸福也埋在了那里。
        - id: ch01-b04
          speaker: narrator
          text: 许多天过去了。终于，黑暗里像是照进了一点亮光。他记起族中最年长的人说过，世上有一条路能通往灵魂之乡。只要用心去找，就一定能找到。
        - id: ch01-b05
          speaker: narrator
          text: 第二天一早，他装好一袋食物，又往肩上披了一张兽皮，便出发了。这段旅程要走多久，路上会遇见什么，他全不知道。不过有一件事，他心里再明白不过。只要那条路存在，他就非找到它不可。
        - id: ch01-b06
          speaker: narrator
          text: 可一走出家门，他便犯了难。四面八方看起来没有分别，到底该往哪里去呢？忽然，他想起有位老人好像提过，灵魂之乡就在南方。希望重新升起，他也有了勇气，于是转身朝南走去。
        - id: ch01-b07
          speaker: narrator
          text: 一连走过许多英里，眼前仍像故乡一样。森林还是那样的森林，山岭和河流也没有什么不同。只有雪渐渐变了。刚出发时，山头和树枝都压着厚厚的积雪。越往南走，雪越少，最后彻底不见了。
        - id: ch01-b08
          speaker: narrator
          text: 很快，树上冒出嫩芽，花朵也从他脚下钻了出来。阴沉的云散去，头顶露出蓝天，四处响起鸟鸣。年轻酋长看着这一切，终于知道自己找对了方向。
    - id: ch02
      title: 守路的老人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一想到很快就能再见到新娘，他的心便欢喜得怦怦直跳，脚步也又轻又快。他穿过幽暗的树林，攀上几处陡峭的悬崖。到了崖顶，一间小屋出现在眼前，那是原住民搭建的棚屋。
        - id: ch02-b02
          speaker: narrator
          text: 门口站着一位身披兽皮的老人，手里还拄着木杖。年轻酋长才开口，要讲自己为何远道而来，老人便打断了他。
        - id: ch02-b03
          speaker: old_man
          text: 我一直在等你，也知道你为什么来。你寻找的姑娘刚从这里过去不久。进屋歇一会儿吧，她也曾在我这里歇过脚。你有什么疑问，我都会回答，也会告诉你接下来往哪里走。
        - id: ch02-b04
          speaker: narrator
          text: 年轻人走进小屋，可一颗心急着赶路，哪里还坐得住。没过多久，他就站起身来。老人也随他起身，一同走到门边。
        - id: ch02-b05
          speaker: old_man
          text: 你往远处看。看见那片水，还有水那边的平原了吗？那里就是灵魂之乡。可是，人带着肉身便进不去。把身体留在这里吧。你的弓箭、兽皮，还有你的狗，也一并留下。我会替你保管好。
    - id: ch03
      title: 幽魂之乡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 老人转身离开了。年轻酋长也把肉身和随身的一切都留在原处。此刻，他轻得像一阵风，往前飞奔时，双脚几乎碰不到地面。
        - id: ch03-b02
          speaker: narrator
          text: 他越往前走，闻到的花香越甜，看到的花也越美。野兽不再远远躲开，反倒走到身边，用鼻子轻轻蹭他。鸟儿围着他飞，鱼儿也探出头来，望着他从水边经过。
        - id: ch03-b03
          speaker: narrator
          text: 没过多久，更奇妙的事发生了。前方明明有岩石和树木，却再也拦不住他。他径直从中穿过，自己竟毫无感觉。原来，那些已经不是真正的石头和树木，只是它们留下的灵魂。他已经走进了幽魂之乡。
        - id: ch03-b04
          speaker: narrator
          text: 年轻酋长继续赶路，脚下仿佛生了翅膀。最后，一座大湖挡在面前，湖心坐落着一座美丽的小岛。岸边停着一只闪闪发光的石舟，舟里还放着两支明亮的桨。
    - id: ch04
      title: 幸福岛
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 他一跃跳进石舟，抓起双桨，划向湖心。才离开岸边，他就看见另一只一模一样的石舟跟了上来。那个让他千里迢迢赶到这里的姑娘，正坐在舟中。年轻酋长又惊又喜，可他们还是碰不到彼此。
        - id: ch04-b02
          speaker: narrator
          text: 一道道巨浪在两只石舟之间翻滚，看起来随时会把船吞没，却一次也没有真的打沉它们。年轻酋长和姑娘都吓得缩起身子。他们低头望去，只见深深的湖底堆着从前死去之人的白骨。浪里还有许多男男女女在挣扎，最后只有很少的人渡了过去。
        - id: ch04-b03
          speaker: narrator
          text: 只有那些孩子一点也不害怕，一个个平安到了对岸。可怕的景象就在眼前，可怕的声音也从四周传来，年轻酋长和姑娘浑身发抖，却始终没有受到伤害。因为他们一生没有作恶，生命之主也说过，灾祸不会落到他们身上。
        - id: ch04-b04
          speaker: narrator
          text: 两只石舟终于安然靠上幸福岛。年轻酋长和姑娘走过开满鲜花的原野，又沿着奔流的溪水前行。在那里，他们感觉不到饥饿和口渴，也不觉得冷或热。空气滋养他们，阳光温暖他们。
        - id: ch04-b05
          speaker: narrator
          text: 岛上没有坟墓，他们也就忘记了死亡。年轻酋长不再想起战争，更不再想着猎杀野兽。他和姑娘多希望能这样一直走下去，永远也不停步。可就在风声轻轻低语时，他听见了生命之主的声音。
        - id: ch04-b06
          speaker: master_of_life
          text: 回到你来的地方去吧。我有事情交给你，你的族人也需要你。往后的许多年，你都要做他们的首领。我的使者正在门口等候。去重新穿上你留在那里的身体，他会告诉你该做什么。听从他的话，耐心等待。将来有一天，你会再见到这个现在不得不离开的姑娘。她已经得到接纳，会永远年轻，永远美丽，就像我从冰雪之乡召她来时一样。
