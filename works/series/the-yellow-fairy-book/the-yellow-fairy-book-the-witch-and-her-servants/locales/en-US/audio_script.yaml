  chapters:
    - id: ch01
      title: The Three Trees
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a King had three sons. The eldest was Szabo, the second was Warza, and the youngest was Iwanich. One beautiful spring morning, the King walked through his gardens with all three. He admired the many fruit trees as they went. Some were covered from branch to branch in blossom. Others bent all the way toward the earth beneath the weight of rich fruit. As the four of them wandered, they unexpectedly came upon a patch of waste ground. Three splendid trees grew there by themselves. The King stopped and looked at them for a moment. Then he sadly shook his head and walked on without a word.
        - id: ch01-b02
          speaker: narrator
          text: His sons asked why the trees made him so unhappy, and the King told them their story.
        - id: ch01-b03
          speaker: king
          text: I planted those three trees on that very spot when I was twenty years old. A famous magician had given their seeds to my father and promised they would grow into the finest trees the world had ever seen. My father did not live long enough to see the promise come true. On his deathbed, he told me to transplant them here and tend them with the greatest care. I obeyed him in everything. For five long years, I watched and waited without seeing any fruit. Then one day I noticed blossoms on the branches. Only a few days later, the most exquisite fruit I had ever laid eyes on appeared among them.
        - id: ch01-b04
          speaker: king
          text: The magician had warned my father that if anyone picked even one fruit before it ripened, all the rest would rot at once. Ripe fruit would turn golden yellow. So I ordered my head gardener to guard the trees closely. Every day, the fruit looked more tempting, and every day I struggled not to disobey the warning.
        - id: ch01-b05
          speaker: king
          text: One night, I dreamed the fruit was perfectly ripe. I tasted it, and it was more delicious than anything I had eaten while awake. The moment I rose, I sent for the gardener and asked whether the fruit had ripened overnight.
        - id: ch01-b06
          speaker: king
          text: Instead of answering, he fell at my feet and swore he was innocent. He had kept watch all night, he said, but somehow, as if by magic, every beautiful fruit had been stolen.
        - id: ch01-b07
          speaker: king
          text: The theft grieved me, but I knew the gardener was faithful, so I did not punish him. Instead, I made a plan for the following year. I did not truly believe the magician's warning, and I thought it would be better to pick everything early than lose it all again. When the time came, I ordered every unripe fruit taken from the trees. The apple I tasted was bitter and unpleasant. By the following morning, all the fruit we had gathered had rotted away.
        - id: ch01-b08
          speaker: king
          text: After that, I placed my most faithful servants around the trees. Still, every year on this same night, an unseen hand stole the ripe fruit. By morning, not one apple remained. Some time ago, I stopped setting guards at all.
        - id: ch01-b09
          speaker: narrator
          text: When the story ended, Szabo spoke first.
        - id: ch01-b10
          speaker: szabo
          text: Forgive me, Father, but I think you are wrong to give up. Surely someone in your kingdom can defend the trees against a thieving magician's tricks. As your eldest son, I claim the first chance. Tonight, I will guard the fruit myself.
        - id: ch01-b11
          speaker: narrator
          text: The King agreed. That evening, Szabo climbed into one of the trees, ready to defend the fruit even with his life. He watched for half the night. A little after midnight, though, a sleep he could not resist overcame him. He did not wake until full daylight, when every fruit was gone.
        - id: ch01-b12
          speaker: narrator
          text: The following year, the second brother, Warza, tried his luck. He too fell asleep, and morning brought the very same result. Then the youngest brother's turn came. Iwanich was not discouraged in the least, although both brothers who had failed were much older and stronger than he was. At nightfall, he climbed into the tree just as they had done. The moon rose and covered the whole countryside in soft light. The watchful young Prince could make out even the smallest object clearly.
        - id: ch01-b13
          speaker: narrator
          text: At midnight, a mild west wind stirred the branches. At that same moment, a snow-white bird shaped like a swan floated down onto his chest. Iwanich quickly caught its wings. To his amazement, the bird vanished from his hands, and he found himself holding the most beautiful young woman he had ever seen.
        - id: ch01-b14
          speaker: militza
          text: You have nothing to fear from Militza. No evil magician stole your fruit. That magician stole the seeds from my mother, and the loss caused her death. Before she died, she told me to take back the fruit that does not belong to you, every year as soon as it ripens. I would have taken it again tonight. But you caught me so firmly that you broke the spell upon me.
        - id: ch01-b15
          speaker: narrator
          text: Iwanich had climbed the tree ready to face a dreadful magician. He had never imagined that the thief would be a lovely girl. As he listened to Militza, he fell desperately in love with her. The two of them spent all the hours that remained in happy conversation. At last, the night began to end. When Militza said that she must go, Iwanich begged her not to leave him.
        - id: ch01-b16
          speaker: militza
          text: I would gladly remain longer, but a wicked witch once cut away a lock of my hair while I slept. That gave her power over me. If morning finds me here, she may harm me, and perhaps you as well.
        - id: ch01-b17
          speaker: narrator
          text: Militza slipped a sparkling diamond ring from her finger and placed it in the Prince's hand.
        - id: ch01-b18
          speaker: militza
          text: Keep this ring to remember Militza. If we never meet again, think of me sometimes. But if your love is true, come and find me in my own kingdom. I am forbidden to show you the road. This ring can guide you instead.
        - id: ch01-b19
          speaker: militza
          text: If you have enough love and courage for the journey, study the diamond whenever you reach a crossroads. When it shines as brightly as before, keep straight ahead. When its light grows dim, choose a different road.
        - id: ch01-b20
          speaker: narrator
          text: Militza bent down and kissed Iwanich on the forehead. Before he could answer, she passed through the branches in a little white cloud and disappeared.
        - id: ch01-b21
          speaker: narrator
          text: Day broke. Still lost in wonder, Iwanich climbed down and walked toward the palace as if dreaming. He did not even know whether the fruit remained. His thoughts were only of Militza and how to reach her.
        - id: ch01-b22
          speaker: narrator
          text: The head gardener saw him leave and ran to the trees. They were heavy with ripe fruit. He hurried to the King with the joyful news. The delighted King rushed into the garden and ordered him to pick an apple. Its taste was every bit as luscious as the fruit in his dream.
        - id: ch01-b23
          speaker: narrator
          text: The King went straight from the garden to Iwanich. He embraced his youngest son tenderly and covered him with praise. Then he asked how the Prince had managed to protect such precious fruit from the magician's power. The question put Iwanich in a difficult position. He would not reveal what had truly happened in the tree, so he quickly invented an answer.
        - id: ch01-b24
          speaker: iwanich
          text: Around midnight, a huge wasp flew among the branches and kept buzzing around me. I fought it off with my sword. By dawn, I was exhausted, and then it vanished as suddenly as it had come.
        - id: ch01-b25
          speaker: narrator
          text: The King never doubted him. He sent his son to rest after such a tiring night, then ordered feast after feast to celebrate the saving of the wonderful fruit. The whole capital rejoiced. Iwanich alone stayed away from the celebrations.
        - id: ch01-b26
          speaker: narrator
          text: While the King attended a banquet, Iwanich gathered several purses of gold, mounted the fastest horse in the royal stable, and raced away like the wind. No one knew he had gone.
        - id: ch01-b27
          speaker: narrator
          text: No one discovered his absence until the next day. The distressed King sent search parties in every direction across the kingdom, but they found no trace of him. After six months, the searchers gave him up for dead. Another six months passed, and the people at home forgot all about him. In the meantime, Iwanich kept traveling with the help of Militza's ring. At each doubtful road, its light showed him whether to go on or turn aside. His journey went well, and no evil befell him.
    - id: ch02
      title: Through the Wild Forest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Three months after leaving home, Iwanich reached a vast forest. It seemed no human foot had ever entered it, and its end could not be seen. He had just found a narrow path and was about to ride in when someone called for him to stop and asked where he was going.
        - id: ch02-b02
          speaker: narrator
          text: The Prince turned. Beneath an oak sat a tall, gaunt man in miserable rags, leaning on a crooked staff. The man and the tree were almost the same grey color, so Iwanich had ridden past without noticing him.
        - id: ch02-b03
          speaker: iwanich
          text: Where would I be going except through the forest?
        - id: ch02-b04
          speaker: old_beggar
          text: Through that forest? Then no one has told you what lives there. You are riding blindly toward your death. The depths are filled with more savage tigers, hyenas, wolves, bears, snakes, and other monsters than anyone could count. If I cut you and your horse into tiny pieces and tossed them among those beasts, there would not be one piece for every hundred of them. If you value your life, take another road.
        - id: ch02-b05
          speaker: narrator
          text: The old man's terrible warning took Iwanich aback. For a full minute, he considered what he ought to do. Then he remembered the rule Militza had given him and looked down at his ring. The diamond had not dimmed at all. It shone as brightly as ever, telling him that the path through the forest was still the right one.
        - id: ch02-b06
          speaker: iwanich
          text: Even if worse creatures lived in those woods, I would still have no choice. I must pass through them.
        - id: ch02-b07
          speaker: narrator
          text: He urged his horse onward. Behind him, the beggar shouted so loudly that Iwanich turned back to the oak.
        - id: ch02-b08
          speaker: old_beggar
          text: I truly feel sorry for you. If nothing can change your mind, at least take advice that may protect you. Here is a bag of bread crumbs and a living hare. They are yours. But leave your horse with me. Fallen trees will trip it, and briars will catch its legs.
        - id: ch02-b09
          speaker: old_beggar
          text: About a hundred yards into the forest, the beasts will surround you. Scatter the bread crumbs among them at once. They will rush to eat. When the final crumb is gone, throw down the hare without losing a moment. It will race away, and the beasts will chase it. Then you can cross the forest unharmed.
        - id: ch02-b10
          speaker: narrator
          text: Iwanich thanked the old man for his counsel. He climbed down from his horse and left the animal behind, just as he had been told. With the bag of crumbs and the living hare held in his arms, he stepped among the trees. He had scarcely lost sight of his gaunt grey friend when growls and snarls rose from the thicket close beside him. Before the Prince had time to think, the most dreadful-looking creatures hemmed him in. A cruel tiger watched with a glittering eye from one side. On the other, a great she-wolf showed her gleaming teeth. A huge bear growled fiercely nearby, and a horrible snake coiled in the grass right at his feet.
        - id: ch02-b11
          speaker: narrator
          text: Even with death all around him, Iwanich did not forget the beggar's instructions. He plunged one hand into the bag, pulled out as many crumbs as he could hold, and scattered them among the beasts. Again and again, he reached into the bag and threw another handful. The creatures rushed greedily after the food. But the bag grew lighter and lighter, and the Prince began to feel afraid. At last, his hand found nothing. The final crumb was gone. Still hungry, the beasts crowded around him again, eager now for fresh prey. Without wasting a moment, Iwanich seized the hare and threw it to them.
        - id: ch02-b12
          speaker: narrator
          text: The instant its feet touched earth, the hare flattened its ears and shot through the woods like an arrow from a bow. The wild beasts raced after it, leaving Iwanich alone. His ring still sparkled, so he continued straight through the forest.
        - id: ch02-b13
          speaker: narrator
          text: Before long, a most extraordinary man came toward him. He stood no more than three feet tall. His legs were crooked, and prickles covered his whole body like a hedgehog. Two lions walked beside him, tied to the ends of his long beard. He stopped Iwanich and spoke in a harsh voice.
        - id: ch02-b14
          speaker: little_man
          text: Are you the man who just fed my bodyguards?
        - id: ch02-b15
          speaker: narrator
          text: Iwanich was too astonished to answer at once.
        - id: ch02-b16
          speaker: little_man
          text: I am deeply grateful for your kindness. What reward can I give you?
        - id: ch02-b17
          speaker: iwanich
          text: I ask only to cross these woods safely.
        - id: ch02-b18
          speaker: little_man
          text: Of course. To make certain of it, I will send one lion to protect you. When you leave the forest and approach a palace beyond my lands, set him free. Otherwise, an enemy may capture and kill him.
        - id: ch02-b19
          speaker: narrator
          text: The little man untied one lion from his beard and ordered it to guard the young Prince carefully. With that protector beside him, Iwanich walked on. He met many more wolves, hyenas, leopards, and other beasts, but all kept their distance when they saw his escort.
        - id: ch02-b20
          speaker: narrator
          text: Iwanich hurried as fast as he could. Hour followed hour, yet he saw no green field and no human home. Near evening, the trees finally thinned. Through their woven branches, he saw a wide plain.
        - id: ch02-b21
          speaker: narrator
          text: At the forest's edge, the lion stopped and would go no farther. The Prince remembered the little man's warning about lands outside the forest. He thanked the lion warmly for guarding him so well and said farewell. By then, complete darkness had fallen, and Iwanich had to wait for daylight before continuing. He gathered grass and fallen leaves into a bed. Then he found dry branches, lit a fire, and slept soundly beside it until morning.
        - id: ch02-b22
          speaker: narrator
          text: When he woke, a beautiful white palace gleamed in the distance. He walked toward it and reached its door in about an hour. Inside, he passed through hall after marble hall until he found a great staircase of porphyry leading down into a lovely garden.
        - id: ch02-b23
          speaker: narrator
          text: Iwanich cried out with joy. There stood Militza, surrounded by girls who were weaving flower wreaths to adorn their mistress. The moment she saw him, she ran forward and embraced him tenderly. He told her every adventure of his journey, and together they entered the palace, where a magnificent meal waited.
        - id: ch02-b24
          speaker: narrator
          text: After the meal, Militza called the whole court together. Before them all, she presented Iwanich as her future husband. Everyone immediately began preparing for the wedding. It took place soon afterward, with all the pomp and magnificence that belonged to a royal marriage.
        - id: ch02-b25
          speaker: narrator
          text: For three months, they were wonderfully happy. Then Militza received an invitation to visit her mother's sister. She was unhappy to leave her husband, but she did not wish to refuse. She promised to return within seven days and said a tender goodbye.
        - id: ch02-b26
          speaker: militza
          text: Before I leave, I am giving you every key in the castle. Go wherever you please and do whatever you wish. I beg only one thing. Do not open the little iron door in the north tower. Seven locks and seven bolts hold it shut. If you open it, both of us will suffer.
        - id: ch02-b27
          speaker: narrator
          text: Iwanich gave his word. Militza departed, once more promising to be back in seven days.
    - id: ch03
      title: The Iron Door
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Once he was alone, Iwanich began to wonder what the forbidden room in the north tower could contain. The thought tormented him. For two full days, he resisted the temptation even to go and look at the door. On the third day, curiosity became too strong for him. He took a burning torch and hurried up the tower. One after another, he unfastened all seven locks and drew back all seven bolts. The moment the last fastening came free, the little iron door burst open.
        - id: ch03-b02
          speaker: narrator
          text: A shocking sight waited beyond it. Smoke blackened the tiny room. Long blue flames gave the only weak light. A huge cauldron of pitch boiled above the fire, and iron chains held a wretched man inside it. He screamed in agony.
        - id: ch03-b03
          speaker: narrator
          text: Horrified, Iwanich asked what terrible crime had earned such a punishment.
        - id: ch03-b04
          speaker: magician
          text: I will tell you everything. But first, please ease my suffering a little.
        - id: ch03-b05
          speaker: iwanich
          text: What can I do to help you?
        - id: ch03-b06
          speaker: magician
          text: Bring a little water. Sprinkle only a few drops over me, and I will feel relief.
        - id: ch03-b07
          speaker: narrator
          text: Pity moved the Prince before he considered what he was doing. He ran into the courtyard, filled a jug, and poured the water over the man.
        - id: ch03-b08
          speaker: narrator
          text: At once, a terrible crash sounded, as though every pillar holding up the palace had broken together. The bewildered Prince could make no sense of what followed. The palace whirled around his head. Its towers, doors, and windows spun with it, and so did the room and the great cauldron. For several minutes, the whole world seemed to turn around him. Then the palace, the prisoner, the fire, and everything else vanished into thin air. Iwanich suddenly stood alone on a desolate heath covered with nothing but rocks and stones.
        - id: ch03-b09
          speaker: narrator
          text: Now he understood what his heedless curiosity had done. Too late, he cursed it. In despair, he wandered across the heath, scarcely looking where he stepped. At last, a distant light led him to a wretched little hut.
        - id: ch03-b10
          speaker: narrator
          text: The hut belonged to the same kindhearted gaunt grey beggar who had given him the crumbs and the hare. The old man did not recognize Iwanich, but when the stranger knocked, he welcomed him and gave him shelter for the night.
        - id: ch03-b11
          speaker: narrator
          text: In the morning, the Prince asked whether his host could help him find work. No one nearby knew him, and he no longer had enough money for the journey home.
        - id: ch03-b12
          speaker: old_beggar
          text: My son, no one lives anywhere around here. I must walk to faraway villages to earn my own living, and even then I often go hungry. But if you are willing to serve old Corva the witch, follow the little stream below my hut for about three hours. On the left, you will find a hill of sand. That is where she lives.
        - id: ch03-b13
          speaker: narrator
          text: Iwanich thanked him and set out. About three hours later, he reached a gloomy grey stone wall. That was only the back of Corva's home. The front looked worse. A fence of spikes surrounded it, and every spike held a human skull. Inside this dreadful enclosure stood a little black house with two barred, cobwebbed windows and a battered iron door.
        - id: ch03-b14
          speaker: narrator
          text: The Prince knocked on the battered door. From somewhere inside, a woman's rasping voice ordered him to enter. Iwanich opened it and stepped into a kitchen whose walls and ceiling were stained black with smoke. A hideous old woman stood by the fire, warming her skinny hands over its heat. The Prince told her that he wished to become her servant. Corva looked him over and said she badly needed someone and that he appeared to be exactly the sort of servant who would suit her.
        - id: ch03-b15
          speaker: narrator
          text: When he asked about the work and wages, she led him along a narrow, damp passage to a vault used as a stable. Two pitch-black horses, a mare and her foal, stood in one stall.
        - id: ch03-b16
          speaker: witch_corva
          text: Your task is simple. Lead this mare and foal to the fields each day, and never let either escape. Guard them for one full year, and you may ask me for any reward you choose. But if one gets away, your final hour has come. Your head will sit on the last empty spike of my fence. Every other skull belongs to a servant who failed me.
        - id: ch03-b17
          speaker: narrator
          text: Iwanich thought his situation could hardly become worse, so he accepted.
        - id: ch03-b18
          speaker: narrator
          text: At daybreak the next morning, he drove the two black horses out to the fields. Throughout the day, neither the mare nor the foal made any attempt to escape. He brought them back safely that evening. Corva stood in her doorway to receive him. She behaved kindly and set a good meal before him. The same thing happened day after day, and for a long while all went well with the Prince. Early each morning, he led the animals to pasture. Every evening, he returned them safe and sound to their stall.
    - id: ch04
      title: Three Grateful Creatures
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One day, Iwanich and the horses came to a riverbank. A large fish had somehow been thrown onto the land and was struggling desperately to reach the water. The Prince felt sorry for it. He lifted it in his arms and tossed it back into the stream.
        - id: ch04-b02
          speaker: narrator
          text: As soon as it was safely in the water, the astonished Prince saw it swim back to the bank and speak.
        - id: ch04-b03
          speaker: fish
          text: Kind benefactor, how can I repay your goodness?
        - id: ch04-b04
          speaker: iwanich
          text: I want nothing. I am glad I was able to help you.
        - id: ch04-b05
          speaker: fish
          text: Then please do one favor for me. Take a scale from my body and guard it well. If you ever need me, throw it into the river. I will come at once.
        - id: ch04-b06
          speaker: narrator
          text: Iwanich bowed, gently removed one scale, and put it away before returning home.
        - id: ch04-b07
          speaker: narrator
          text: A short time later, he was leading the horses toward their usual pasture when he noticed a flock of birds shrieking and darting wildly through the air. He hurried closer. A great crowd of ravens had attacked an eagle. The eagle was large and fought bravely, but too many enemies pressed around it. At last, it could fight no more.
        - id: ch04-b08
          speaker: narrator
          text: Iwanich felt sorry for the great bird. He snatched up a fallen branch and rushed into the fight, swinging it at the ravens. The flock had not expected a man to attack. Terrified by his sudden blows, the surviving ravens scattered through the air. Many of their companions lay dead or wounded on the ground where the battle had taken place.
        - id: ch04-b09
          speaker: narrator
          text: Freed from its attackers, the eagle plucked a feather from its wing and gave it to the Prince.
        - id: ch04-b10
          speaker: eagle
          text: Kind benefactor, accept this feather as a sign of my gratitude. If you need my help, blow it into the air. I will do everything within my power for you.
        - id: ch04-b11
          speaker: narrator
          text: Iwanich thanked the eagle. He placed the feather beside the fish scale and drove the horses home.
        - id: ch04-b12
          speaker: narrator
          text: On another day, he wandered farther than usual and came near a farmyard. The place pleased him, and the horses found plenty of good grass. As he sat beneath a tree, a nearby cry caught his attention. A fox was trapped in a snare set by the farmer. The poor animal struggled, but could not break free.
        - id: ch04-b13
          speaker: narrator
          text: Again and again, the trapped fox pulled against the snare, but every effort failed. The good-natured Prince could not leave it suffering there. He went over, opened the trap, and set the animal free. The fox thanked him with all its heart. Then it turned its bushy tail toward him, pulled out two long hairs, and offered them to him.
        - id: ch04-b14
          speaker: fox
          text: If you ever need my help, throw these two hairs into a fire. In a moment, I will stand beside you, ready to obey.
        - id: ch04-b15
          speaker: narrator
          text: Iwanich stored the hairs with the scale and feather. As darkness came on, he hurried back with the horses.
    - id: ch05
      title: The River and the Clouds
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Iwanich's year of service was nearly finished. Only three days remained. On the first of those evenings, while eating supper, he saw Corva slip into the stable. He followed quietly, crouched in the doorway, and listened.
        - id: ch05-b02
          speaker: witch_corva
          text: Tomorrow, wait until Iwanich falls asleep. Then hide in the river and remain there until I call you back. If you disobey me, I will beat you until you bleed.
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: Iwanich returned to his room, determined that nothing would make him sleep the next day. In the morning, he took the mare and foal to the fields as usual, but this time he tied a cord around them and kept its end in his hand.
        - id: ch05-b04
          speaker: narrator
          text: For the first few hours, Iwanich held tightly to the cord and kept his eyes open. But Corva used her magic against him. A sleep too powerful to resist overcame him, and his hand loosened. The mare and foal slipped free, ran to the river, and hid beneath the water as they had been ordered. It was late in the evening before Iwanich woke. The cord lay empty, and both horses were gone. Horror filled him. In despair, he cursed the moment he had entered the cruel witch's service. He could already picture his own head fixed on the sharp, empty spike beside those of the other servants.
        - id: ch05-b05
          speaker: narrator
          text: Then he remembered the fish scale he always carried beside the feather and the hairs. He pulled it from his pocket, ran to the river, and threw it into the water. Within a minute, the grateful fish appeared at the bank.
        - id: ch05-b06
          speaker: fish
          text: My friend and benefactor, what do you ask of me?
        - id: ch05-b07
          speaker: iwanich
          text: I was ordered to guard a mare and her foal, but they escaped and hid in this river. If you wish to save my life, please drive them back onto the land.
        - id: ch05-b08
          speaker: fish
          text: Wait here. My friends and I will soon force them out of the water.
        - id: ch05-b09
          speaker: narrator
          text: With those words, the fish turned and disappeared into the deepest part of the stream. Almost at once, a rushing, hissing sound rose from the water. Fish were moving everywhere below the surface. Waves dashed hard against both banks, and white foam flew high into the air. Suddenly, the mare and foal leaped out of the churning river and landed on dry ground. Both animals trembled and shook with fear.
        - id: ch05-b10
          speaker: narrator
          text: Iwanich leaped onto the mare, caught the foal's bridle, and rode home in high spirits. When Corva saw the horses return, she could barely hide her fury. She served his supper, then slipped back into the stable. Again, he followed and listened while she scolded the animals for hiding so poorly.
        - id: ch05-b11
          speaker: witch_corva
          text: Tomorrow, when he sleeps, climb into the clouds and stay there until I call you. Fail me again, and I will beat you until you bleed.
          emotion: angry
        - id: ch05-b12
          speaker: narrator
          text: The next morning, Iwanich led the horses out once more. A magic sleep soon overcame him. The mare and foal ran away and hid in soft, billowing clouds that hung low from the mountains.
        - id: ch05-b13
          speaker: narrator
          text: When the Prince awoke and saw that both were gone, he immediately thought of the eagle. He drew out the feather and blew it into the air. The bird swooped down beside him.
        - id: ch05-b14
          speaker: eagle
          text: What would you have me do?
        - id: ch05-b15
          speaker: iwanich
          text: My mare and foal ran away and hid in the clouds. If you wish to save my life, bring both animals back to me.
        - id: ch05-b16
          speaker: eagle
          text: Wait a little. With my friends beside me, I will soon drive them down.
        - id: ch05-b17
          speaker: narrator
          text: With those words, the eagle spread its wings, flew upward, and disappeared into the mass of cloud. Iwanich had hardly begun to wait when the clouds stirred. Then he saw the mare and foal racing toward him through the sky. A great host of eagles of every size flew behind and around them, driving them down. The Prince caught both horses, thanked the eagle for its help, and cheerfully brought the animals home again.
        - id: ch05-b18
          speaker: narrator
          text: Corva was more disgusted than ever to see him return. After putting down his supper, she crept into the stable. Iwanich followed. He heard her abuse the horses for failing to hide well among the clouds.
        - id: ch05-b19
          speaker: witch_corva
          text: Tomorrow, as soon as he is asleep, hide in the King's henhouse on the lonely part of the heath. Stay there until I call. This time, if you fail me, I truly will beat you until you bleed.
          emotion: angry
    - id: ch06
      title: The Royal Henhouse
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: On the following morning, the Prince drove the horses to the fields. Magic sleep overcame him just as before, and the mare and foal ran away to the royal henhouse.
        - id: ch06-b02
          speaker: narrator
          text: Iwanich woke, found them missing, and decided to call the fox. He lit a fire and threw in the two hairs. Within moments, the fox stood beside him.
        - id: ch06-b03
          speaker: fox
          text: How may I serve you?
        - id: ch06-b04
          speaker: iwanich
          text: Tell me where I can find the King's henhouse.
        - id: ch06-b05
          speaker: fox
          text: It is less than an hour away. Come, and I will lead you there.
        - id: ch06-b06
          speaker: narrator
          text: As they walked, the fox asked why he needed to visit the royal henhouse. Iwanich explained how he had lost the mare and foal and had to recover them.
        - id: ch06-b07
          speaker: fox
          text: That will not be easy. Still, I have a plan. Wait beside the henhouse door for your horses. I will slip through a hole in the wall and chase the hens. Their noise will wake the women who tend them. When those women see the horses, they will think the animals caused the trouble and drive them outside. Be ready to catch the mare and foal the moment they appear.
        - id: ch06-b08
          speaker: narrator
          text: Iwanich took his place beside the door. The fox slipped through the hole in the wall and darted among the hens, chasing them from side to side. Their clucking and squawking grew so loud that the women who kept the royal poultry woke and ran to see what had happened. They saw the mare and foal inside and immediately decided that the two horses had frightened the birds. Just as the clever fox had predicted, they drove both animals out. Iwanich caught the foal's bridle, swung himself onto the mare's back, and hurried away.
        - id: ch06-b09
          speaker: narrator
          text: As they crossed the heath, the mare suddenly spoke to her rider.
        - id: ch06-b10
          speaker: mare
          text: You are the first person who has ever outwitted old Corva. Now you may choose your reward. Promise you will never betray me, and I will tell you what to ask for.
        - id: ch06-b11
          speaker: narrator
          text: Iwanich promised to keep her confidence.
        - id: ch06-b12
          speaker: mare
          text: Ask for nothing but my foal. No other creature in the world is like it, and neither love nor money could buy it. In only a few minutes, it can travel from one end of the earth to the other. Cunning Corva will try to change your mind. She will call the foal lazy and sickly. Do not believe her. Refuse every other reward.
        - id: ch06-b13
          speaker: narrator
          text: The thought of riding an animal that could cross the whole earth in minutes filled Iwanich with longing. He promised the mare that he would ask for her foal and would accept no substitute. When he reached the black house this time, Corva received him with more friendliness than she had ever shown before. She placed a rich and splendid meal in front of him and waited while he ate. Only when he had finished did she remind him that his year of service was complete and ask him to name the reward he demanded.
        - id: ch06-b14
          speaker: iwanich
          text: I want one thing, and only one. Give me your mare's foal.
        - id: ch06-b15
          speaker: narrator
          text: Corva pretended to be astonished.
        - id: ch06-b16
          speaker: witch_corva
          text: You deserve far better than that creature. The foal is lazy and nervous, blind in one eye, and entirely worthless.
        - id: ch06-b17
          speaker: narrator
          text: Corva offered her servant better rewards and kept describing everything that was wrong with the foal. But Iwanich knew exactly what he wanted. He remembered the mare's warning and refused to be persuaded. At last, the old witch saw that his mind was fixed and that no argument would turn him away from his choice. She gave in and prepared to honor her promise.
        - id: ch06-b18
          speaker: witch_corva
          text: I must keep my promise, so the foal is yours. I know who you are and what you seek, and I will tell you how this animal can help. The man you freed from the cauldron is a mighty magician. Because of your curiosity and carelessness, Militza fell into his power. He carried her, her palace, and everything she owned into a distant land.
        - id: ch06-b19
          speaker: witch_corva
          text: You are the only person who can kill that magician. He knows it, and he fears you so greatly that he has sent spies to watch you. Every day, they report all your movements to him. The foal can carry you to the distant country where he has taken Militza. But when you finally reach him, beware. Do not speak a single word to him, no matter what he says. One word will place you in the power of his friends. Seize him by the beard at once and dash him to the ground.
    - id: ch07
      title: Militza Restored
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Iwanich thanked the old witch for telling him what had become of Militza and how the magician could be defeated. Then he went to the stable and mounted his new foal. The moment he pressed his spurs against its sides, the marvelous animal sprang away. It did not gallop along the heath. It rose into the sky, carrying Iwanich through the air as swiftly as lightning.
        - id: ch07-b02
          speaker: narrator
          text: The foal covered the enormous distance with astonishing speed. Darkness was already gathering when the Prince noticed several figures far ahead in the evening sky. The two parties drew closer and closer until Iwanich could see them clearly. The magician was there with his friends. They too were traveling through the air, seated in a carriage drawn by owls.
        - id: ch07-b03
          speaker: narrator
          text: The magician came face-to-face with Iwanich and saw that escape was impossible. He turned to the Prince with false friendliness.
        - id: ch07-b04
          speaker: magician
          text: Three times over, my kind benefactor!
        - id: ch07-b05
          speaker: narrator
          text: The magician's greeting did not make Iwanich forget Corva's warning. He did not answer with even one word. Before the magician or his friends could act, the Prince reached out, seized the wicked man firmly by the beard, and dashed him from the flying carriage to the ground below. At that same moment, the foal sprang down upon the fallen magician. It struck him again and again, kicking and stamping with its hard hooves until the mighty magician was dead.
        - id: ch07-b06
          speaker: narrator
          text: In that same moment, Iwanich found himself back in his bride's palace, and Militza flew into his arms.
        - id: ch07-b07
          speaker: narrator
          text: From then on, Iwanich and Militza lived together in unbroken peace and happiness for the rest of their lives.
