audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 威严慈爱，伤感时低沉，欢喜时爽朗
        timbre: 浑厚沉稳
        pace: 从容
        pitch: 中低音
    sabo:
      display_name: 萨博
      tts:
        delivery: 自信爽直，带着长子的担当
        timbre: 明朗结实
        pace: 稳健
        pitch: 中音
    ivanich:
      display_name: 伊万尼奇
      tts:
        delivery: 真诚勇敢，言语干脆，历险中渐显沉着
        timbre: 清亮坚定
        pace: 适中
        pitch: 中音
    militsa:
      display_name: 米利察
      tts:
        delivery: 温柔坦率，忧虑中仍有坚定
        timbre: 柔美清澈
        pace: 舒缓
        pitch: 中高音
    gardener:
      display_name: 园丁总管
      tts:
        delivery: 忠厚谨慎，受惊时急切
        timbre: 朴实温和
        pace: 适中
        pitch: 中音
    beggar:
      display_name: 灰衣乞丐
      tts:
        delivery: 苍老善良，劝告时恳切而郑重
        timbre: 沙哑低沉
        pace: 缓慢
        pitch: 低音
    forest_master:
      display_name: 森林主人
      tts:
        delivery: 粗声直率，知恩图报
        timbre: 粗粝浑厚
        pace: 适中
        pitch: 低音
    captive_sorcerer:
      display_name: 被囚的魔法师
      tts:
        delivery: 痛苦中藏着狡猾，获释后虚假亲热
        timbre: 阴沉沙涩
        pace: 缓慢
        pitch: 中低音
    witch:
      display_name: 女巫
      tts:
        delivery: 表面亲热圆滑，话音深处藏着冷意
        timbre: 干涩克制
        pace: 从容
        pitch: 中低音
    fish:
      display_name: 大鱼
      tts:
        delivery: 感激诚恳，答应相助时干脆
        timbre: 圆润清亮
        pace: 适中
        pitch: 中音
    eagle:
      display_name: 鹰
      tts:
        delivery: 庄重有力，感恩而守信
        timbre: 高亢清朗
        pace: 稳健
        pitch: 中音
    fox:
      display_name: 狐狸
      tts:
        delivery: 机敏亲切，出主意时轻快笃定
        timbre: 灵巧明亮
        pace: 稍快
        pitch: 中高音
    mare:
      display_name: 黑母马
      tts:
        delivery: 沉着睿智，提醒时谨慎明确
        timbre: 柔和低沉
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 三棵神奇的果树
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，一位国王有三个儿子。长子叫萨博，次子叫瓦尔扎，最小的叫伊万尼奇。一个晴朗的春日早晨，国王带着三个儿子在花园里散步。他们一路看见繁花和累累果实，最后来到一片荒地。那里长着三棵挺拔秀美的树。国王望着树，悲伤地摇了摇头，默默走开。
        - id: ch01-b02
          speaker: narrator
          text: 三个儿子都不明白，便追问父亲为什么伤心。国王把这三棵树的往事告诉了他们。
        - id: ch01-b03
          speaker: king
          text: 我二十岁那年，亲手把它们栽在这里。那树种原是一位有名的魔法师送给你们祖父的。他说，它们会长成世上最美的三棵树。你们祖父没能等到那一天，临终前嘱咐我移栽树种，好好照料。我照做了。整整五年后，树上才开花，又过几天，便结出了我从没见过的诱人果实。
        - id: ch01-b04
          speaker: king
          text: 魔法师曾经警告过，只要有人摘下一枚没熟的果子，其余的果子马上就会腐烂。只有变成金黄色，才算真正成熟。因此，我命令园丁总管日夜看守。
        - id: ch01-b05
          speaker: king
          text: 我每天都去看。那些果子一天比一天好看，我几乎忍不住想提前摘一个。一天夜里，我梦见它们全熟了。我摘下一枚尝了尝，那滋味胜过我吃过的一切。醒来以后，我立刻叫来园丁，问果子是不是一夜之间成熟了。
        - id: ch01-b06
          speaker: king
          text: 园丁一句话也没说，先扑倒在我脚下。他发誓自己没有偷懒，整夜都守在树旁。可不知中了什么魔法，那么美的三棵树，竟被偷得一枚果子也没剩。
        - id: ch01-b07
          speaker: king
          text: 我知道园丁忠心，没有罚他。我也不太相信魔法师的警告，就决定第二年不等果子成熟，先把它们全摘下来。谁知我只咬了一口，便觉得又苦又涩。第二天早晨，剩下的果子全烂了。
        - id: ch01-b08
          speaker: king
          text: 从此，我每年都派最忠诚的仆人守树。可每到今天这个夜晚，总有一只看不见的手摘走全部果实。第二天，枝头一枚苹果也不会剩。近几年，我连守卫都懒得再派了。
        - id: ch01-b09
          speaker: sabo
          text: 父王，请您别怪我直说。我想，您弄错了。咱们的王国里一定有人能斗过那个偷果子的魔法师。我是长子，应该第一个去试。今晚就让我守住这些果子。
        - id: ch01-b10
          speaker: narrator
          text: 国王答应了。傍晚，萨博爬上树，决心拼上性命也不让果子被偷。他撑过半夜，可午夜刚过，一股无法抵挡的睡意便压了下来。等他醒来，天已经亮了，树上的果子也全没了。
        - id: ch01-b11
          speaker: narrator
          text: 第二年，瓦尔扎也去守树，结果和哥哥一模一样。接下来，轮到了最小的伊万尼奇。两个哥哥比他年长，也比他强壮，可他们的失败并没有吓退他。
        - id: ch01-b12
          speaker: narrator
          text: 夜色降临，伊万尼奇也爬上树去。月亮升起来，把柔和的光洒向四野。王子始终警醒，连最小的动静也看得清楚。
        - id: ch01-b13
          speaker: narrator
          text: 到了午夜，一阵轻柔的西风摇起树枝。一只雪白的鸟轻轻落在王子胸前，模样像天鹅一样。伊万尼奇赶紧抓住它的双翼。就在一眨眼间，白鸟不见了。他怀里抱着的，竟是他平生见过的最美丽的姑娘。
        - id: ch01-b14
          speaker: militsa
          text: 你不用害怕米利察。偷走你家果实的，并不是什么邪恶魔法师。那个人从我母亲那里偷走了树种，还害死了她。母亲临终前嘱咐我，每年果实成熟时都要把它们取走，因为这些树本来就不属于你们。今晚，我原本也会像往年一样带走果子。可你紧紧抓住我，破除了我身上的魔法。
        - id: ch01-b15
          speaker: narrator
          text: 伊万尼奇本以为会撞见一个可怕的魔法师，没想到等来的却是这样美丽的姑娘。他一下子深深地爱上了她。两个人愉快地谈了一整夜。米利察要走时，王子苦苦挽留，舍不得放她离开。
        - id: ch01-b16
          speaker: militsa
          text: 我也想再陪你一会儿。可是有个恶毒的女巫，趁我睡着时剪走了我的一绺头发。从那以后，我只能听她摆布。天亮时我要是还在这里，她一定会害我，也可能伤害你。
        - id: ch01-b17
          speaker: narrator
          text: 米利察从手指上取下一枚闪亮的钻石戒指，交给王子。
        - id: ch01-b18
          speaker: militsa
          text: 留着这枚戒指，记住米利察吧。万一我们再也见不到，也请你偶尔想起我。要是你真心爱我，就到我的王国来找我。我不能告诉你该走哪条路，不过这枚戒指会指引你。
        - id: ch01-b19
          speaker: militsa
          text: 只要你有足够的爱和勇气，就尽管上路。每逢来到岔路口，先看看钻石。它要是依旧明亮，你就继续向前。它要是暗下来，你就换一条路。
        - id: ch01-b20
          speaker: narrator
          text: 米利察俯身吻了吻王子的额头。伊万尼奇还没来得及开口，她就变成一小团白云，穿过树枝，消失不见了。
    - id: ch02
      title: 戒指指引的旅程
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 天亮后，伊万尼奇心里仍装满昨夜那个不可思议的姑娘。他像在梦里一样走回王宫，甚至不知道树上的果子有没有被摘走。他只想着米利察，想着怎样才能找到她。
        - id: ch02-b02
          speaker: narrator
          text: 园丁总管见王子离开，赶紧跑到树下。枝头挂满了成熟的果实。他马上把喜讯报给国王。国王欣喜若狂，奔进花园，命园丁摘下几枚。苹果果然像他梦里尝过的一样，又甜又多汁。
        - id: ch02-b03
          speaker: narrator
          text: 国王随即去见伊万尼奇。他亲热地拥抱儿子，连声称赞，又问王子用了什么办法，破掉魔法，保住了珍贵的果实。伊万尼奇不想说出真相，一时十分为难。
        - id: ch02-b04
          speaker: ivanich
          text: 午夜前后，一只大得吓人的黄蜂钻进树叶，一直围着我嗡嗡转。我挥剑赶它，直到天快亮时，已经累得一点力气也没有了。那只黄蜂才忽然消失，就像它突然出现时一样。
        - id: ch02-b05
          speaker: narrator
          text: 国王完全相信了。他叫儿子马上休息，自己却下令摆开宴席，庆祝神奇的果实终于保住。整座都城都热闹起来，人人分享着国王的欢喜，只有伊万尼奇没有赴宴。
        - id: ch02-b06
          speaker: narrator
          text: 趁国王去参加宴席，王子带上几袋金币，从王家马厩牵出最快的马，迎着风飞驰而去。没有一个人发现。第二天，人们才知道他失踪了。国王悲痛万分，派人找遍王国各地，却始终没有消息。半年后，大家认定他已经死去。再过半年，也没有人提起他了。
        - id: ch02-b07
          speaker: narrator
          text: 这一年里，伊万尼奇一直照着戒指的指引前进，路上没有遇见祸患。出发三个月后，他来到一片大森林的入口。那片林子仿佛从来没人进去过，茫茫林海看不到尽头。王子发现一条小路，正要进林，忽然有人在身后大喊。
        - id: ch02-b08
          speaker: beggar
          text: 站住，年轻人！你要去哪儿？
        - id: ch02-b09
          speaker: narrator
          text: 伊万尼奇回头一看，橡树下坐着一个瘦骨嶙峋的高个子男人。他穿着破衣服，手里拄着弯木杖，整个人的颜色几乎和橡树相同。难怪王子骑马经过时没看见他。
        - id: ch02-b10
          speaker: ivanich
          text: 我还能去哪儿？当然是要穿过这片森林。
        - id: ch02-b11
          speaker: beggar
          text: 穿过森林？你一定没听说过这里有多可怕，才会这样闯进去送死。先停一停，听我说。林子深处有数不清的猛虎、鬣狗、野狼、熊、毒蛇，还有各种怪物。就算把你和马一起剁碎了分给它们，每一百头野兽也尝不到一小口。听我劝，想活命就换条路吧。
        - id: ch02-b12
          speaker: narrator
          text: 王子吃了一惊。他想了想，又低头看戒指。钻石仍旧明亮。
        - id: ch02-b13
          speaker: ivanich
          text: 哪怕林子里还有更可怕的东西，我也没有别的路。我非过去不可。
        - id: ch02-b14
          speaker: narrator
          text: 他一夹马腹，继续向前。可老乞丐在后面喊得太响，他只好回头，再次骑到橡树下。
        - id: ch02-b15
          speaker: beggar
          text: 我实在放心不下。你既然非闯不可，至少让我教你一个办法，也许能帮你躲过怪物。这袋面包屑，还有这只活野兔，都送给你救命。不过马得留下。林中有倒下的树和荆棘，它走不了多远。
        - id: ch02-b16
          speaker: beggar
          text: 进去大约一百码，野兽就会围住你。你马上抓起面包屑，朝它们中间撒。等它们争着吃完最后一粒，就赶紧把野兔放出去。兔子会拼命逃，野兽会转身去追。这样，你便能平安穿过森林。
        - id: ch02-b17
          speaker: narrator
          text: 伊万尼奇谢过老人，下了马，抱着布袋和野兔走进林中。灰衣瘦老人的身影才刚消失，附近的灌木里便响起低吼。转眼间，王子被一群可怕的猛兽围住。猛虎的眼睛凶狠发亮，母狼露出森森利齿，巨熊厉声咆哮，脚边草丛里还盘着一条骇人的毒蛇。
        - id: ch02-b18
          speaker: narrator
          text: 王子牢牢记着老人的话，一把又一把地抓出面包屑，抛给野兽。布袋越来越轻，他心里也越来越害怕。最后一粒面包屑终于没了。饥饿的野兽朝他逼近，贪婪地盯住眼前的猎物。伊万尼奇赶紧把野兔扔了出去。
        - id: ch02-b19
          speaker: narrator
          text: 野兔一落地，就把耳朵贴向身后，像箭一样冲进森林。野兽全都追了过去，只留下王子一人。他看看戒指，钻石依旧明亮，于是继续向森林深处走去。
    - id: ch03
      title: 森林尽头的宫殿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 没走多远，一个模样奇怪极了的人迎面而来。他只有三英尺高，两条腿弯得厉害，浑身长满尖刺，活像一只刺猬。两头狮子跟在他身边，各自拴在他长胡子的一端。
        - id: ch03-b02
          speaker: forest_master
          text: 刚才给我的卫士喂东西吃的人，是你吗？
        - id: ch03-b03
          speaker: narrator
          text: 伊万尼奇惊讶得几乎答不出话。小个子又粗声问他。
        - id: ch03-b04
          speaker: forest_master
          text: 多谢你的好心。我要送你什么，才能报答你？
        - id: ch03-b05
          speaker: ivanich
          text: 我什么也不求，只想平安走出这片森林。
        - id: ch03-b06
          speaker: forest_master
          text: 当然可以。为了保你平安，我再送一头狮子护送你。等你出了森林，走近一座不归我管的宫殿，就把它放回来。别让它落进敌人手里，被人杀掉。
        - id: ch03-b07
          speaker: narrator
          text: 小个子从胡子上解下一头狮子，叫它好好保护王子。伊万尼奇带着新卫士继续赶路。沿途又遇见许多野狼、鬣狗、豹子和别的猛兽，可它们一见狮子，全都远远躲开了。
        - id: ch03-b08
          speaker: narrator
          text: 王子拼命加快脚步。一个时辰又一个时辰过去，眼前还是没有绿野，也看不到人烟。直到傍晚，树木才渐渐稀疏。他从交错的枝条间望见一片辽阔的平原。
        - id: ch03-b09
          speaker: narrator
          text: 来到森林出口，狮子停了下来。王子诚心谢过它的保护，和它告别。天色已经全黑，他只能等到早晨再走。于是，他拿青草和树叶铺床，又点起一堆枯枝，安稳地睡了一夜。
        - id: ch03-b10
          speaker: narrator
          text: 第二天醒来，伊万尼奇朝远处一座闪着白光的宫殿走去。大约一个时辰后，他来到宫门前，推门进去。他穿过一座又一座大理石厅堂，来到宽阔的斑岩石阶前。石阶一路向下，通往一座美丽的花园。
        - id: ch03-b11
          speaker: narrator
          text: 王子忽然看见米利察站在一群姑娘中间。姑娘们正在编花环，准备装饰女主人的宫殿。伊万尼奇忍不住欢呼起来。米利察一看见他，便跑过来，温柔地拥抱了他。
        - id: ch03-b12
          speaker: narrator
          text: 王子讲完一路上的奇遇，两个人一同走进宫殿。那里早已摆好丰盛的宴席。米利察召集宫廷众人，把伊万尼奇介绍给大家，告诉他们，这就是她未来的丈夫。
        - id: ch03-b13
          speaker: narrator
          text: 婚礼马上开始筹备，不久便隆重举行，场面盛大华丽。伊万尼奇和米利察幸福地生活了三个月。一天，米利察收到姨母的邀请，请她前去作客。
        - id: ch03-b14
          speaker: narrator
          text: 公主舍不得丈夫，却也不愿拒绝姨母。她答应最迟七天回来。临别时，她依依不舍，又把一件要紧的事告诉王子。
        - id: ch03-b15
          speaker: militsa
          text: 城堡所有的钥匙都交给你。你想去哪里就去哪里，想做什么也都可以。我只求你答应一件事。北塔有一扇小铁门，上面挂着七把锁，还插着七根门闩。千万别打开它。要不然，我们两个人都会遭殃。
        - id: ch03-b16
          speaker: narrator
          text: 伊万尼奇答应了。米利察离开时，再一次保证七天以内一定回来。
    - id: ch04
      title: 北塔里的囚徒
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王子独自留在宫殿里，好奇心却不停折磨着他。北塔那间屋里，到底藏着什么？头两天，他忍住了，没有去看。第三天，他实在忍不下去，举着火把冲上塔楼，一把接一把打开小铁门上的锁。最后，铁门猛地弹开了。
        - id: ch04-b02
          speaker: narrator
          text: 门后的景象，是他怎么也想不到的。小屋被烟熏得漆黑，只有一堆火勉强照亮四周。长长的蓝色火舌不断向上蹿，火上吊着一口大锅，里面的沥青翻滚沸腾。一个可怜的人站在锅里，被铁链紧紧锁着，疼得不停惨叫。
        - id: ch04-b03
          speaker: narrator
          text: 伊万尼奇看得心惊胆战。他问那个人究竟犯了什么滔天大罪，才会受到这样可怕的刑罚。
        - id: ch04-b04
          speaker: captive_sorcerer
          text: 我会把一切都告诉你。不过，求你先让我少受一点痛苦。
        - id: ch04-b05
          speaker: ivanich
          text: 我要怎么做，才能帮你？
        - id: ch04-b06
          speaker: captive_sorcerer
          text: 给我一点水。只要往我身上洒几滴，我就会好受些。
        - id: ch04-b07
          speaker: narrator
          text: 王子动了怜悯之心，根本没想自己正在做什么。他跑到城堡院里，装来满满一罐水，全都浇在锅中那个人身上。
        - id: ch04-b08
          speaker: narrator
          text: 霎时间，一声可怕的巨响震得人耳朵发麻，仿佛宫殿里所有柱子都在倒塌。整座宫殿带着塔楼、门窗和那口大锅，一起绕着头晕眼花的王子旋转。几分钟后，一切都消失得无影无踪。伊万尼奇发现自己孤零零站在一片荒凉的石砾原野上。
        - id: ch04-b09
          speaker: narrator
          text: 这时，王子才明白，自己的轻率闯下了多大的祸。他痛恨自己的好奇，可后悔已经迟了。他绝望地走过荒原，连脚下都不看，心里尽是悲苦。走了许久，他终于看见远处一点灯光。那光来自一间破败的小屋。
        - id: ch04-b10
          speaker: narrator
          text: 屋主人正是从前送他面包屑和野兔的灰衣瘦乞丐。伊万尼奇敲响房门。老人没有认出他，还是收留他住了一夜。
        - id: ch04-b11
          speaker: narrator
          text: 第二天早晨，王子问老人能不能替他找份活儿。他在这里谁也不认识，身上的钱也不够回家。
        - id: ch04-b12
          speaker: beggar
          text: 孩子，附近全是没人的荒野。我自己也得走到很远的村子里讨生活，就是这样，还常常吃不饱。不过，你要是肯给老女巫科尔瓦当仆人，就沿着我屋子下面那条小溪往上游走。大约三个时辰后，你会在左边看见一座沙丘。她就住在那里。
        - id: ch04-b13
          speaker: narrator
          text: 伊万尼奇谢过老人，照他说的上路。走了三个时辰左右，王子来到一堵阴森森的灰石墙前。那只是屋子的后墙，已经很不起眼。等绕到正面，他才发现，这座房子更叫人厌恶。
        - id: ch04-b14
          speaker: narrator
          text: 老女巫在屋外竖了一圈尖桩，每根桩上都插着一颗人头骨。可怕的围墙里面，立着一间黑色小屋。屋子只有两扇带铁栏的窗，蛛网爬满窗面，门也是一扇破旧的铁门。
        - id: ch04-b15
          speaker: narrator
          text: 王子敲了敲门。一个女人用粗粝刺耳的嗓音叫他进去。他推门走进一间烟熏火燎的厨房。一个丑陋的老太婆坐在火边，烘着两只干瘦的手。王子说自己想给她当仆人。女巫告诉他，她正缺一个帮手，而他看起来再合适不过。
        - id: ch04-b16
          speaker: narrator
          text: 伊万尼奇问自己要做什么，又能得到多少工钱。女巫领他穿过狭窄潮湿的过道，走进一间当作马厩的地窖。一个栏位里，站着一匹漆黑的母马和一匹漆黑的小马驹。
        - id: ch04-b17
          speaker: witch
          text: 你每天只要把这匹母马和它的马驹赶到野地，别让任何一匹逃走。整整一年都能看住它们，我就把你想要的任何东西送给你。只要跑掉一匹，你就得死。你的脑袋会插在篱笆最后那根空尖桩上。其余尖桩已经全装饰好了。那些头骨，都属于以前没能完成差事的仆人。
        - id: ch04-b18
          speaker: narrator
          text: 伊万尼奇心想，自己的处境不可能更坏了，便答应女巫。第二天清早，他把两匹马赶到野地。它们完全没有逃跑的意思，傍晚又被他平安带回。女巫和颜悦色地站在门前迎接，还摆出一顿好饭。往后的日子也一样，王子每天早出晚归，一切都很顺利。
    - id: ch05
      title: 三位受助的朋友
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 一天，伊万尼奇放马来到河边。他看见一条大鱼不知出了什么意外，被冲到岸上，正拼命挣扎，想回到水里。王子可怜它，便把鱼抱起来，扔回河中。
        - id: ch05-b02
          speaker: narrator
          text: 大鱼刚进水，又游回岸边。它在惊讶的王子面前开口说起话来。
        - id: ch05-b03
          speaker: fish
          text: 善良的恩人，您救了我。我该怎样报答这份大恩？
        - id: ch05-b04
          speaker: ivanich
          text: 我什么也不要。能帮到你，我已经很满足了。
        - id: ch05-b05
          speaker: fish
          text: 那也请您答应我一件事。从我身上取下一片鱼鳞，好好收着。以后需要帮忙，就把它扔进河里。我马上会来帮助您。
        - id: ch05-b06
          speaker: narrator
          text: 伊万尼奇向大鱼欠了欠身，从它身上取下一片鳞，仔细收好，这才回去。
        - id: ch05-b07
          speaker: narrator
          text: 又过了一些日子。一天清晨，王子照常赶马去牧场，忽然看见一大群鸟聚在一起。它们吵闹着疯狂飞舞，许多乌鸦正在围攻一只鹰。鹰虽然高大强壮，奋力抵抗，最后还是寡不敌众，只得认输。
        - id: ch05-b08
          speaker: narrator
          text: 伊万尼奇可怜那只鹰，抄起一根树枝朝乌鸦打去。乌鸦被突如其来的攻击吓坏了，纷纷飞走。地上留下不少死伤的乌鸦。鹰脱离敌人的折磨后，从翅膀上拔下一根羽毛，递给王子。
        - id: ch05-b09
          speaker: eagle
          text: 善良的恩人，请收下这根羽毛，算作我感谢您的凭证。日后需要我帮忙，就把羽毛吹向空中。我一定尽力相助。
        - id: ch05-b10
          speaker: narrator
          text: 王子谢过鹰，把羽毛和鱼鳞放在一起，又赶着两匹马回家。
        - id: ch05-b11
          speaker: narrator
          text: 另一天，伊万尼奇比平常走得更远，来到一座农庄附近。这里长着许多鲜嫩的青草，他很喜欢，便决定留下来放一天马。刚要在树下坐下，附近传来一声哀叫。原来，一只狐狸中了农夫设下的捕兽夹。
        - id: ch05-b12
          speaker: narrator
          text: 狐狸拼命挣扎，怎么也逃不掉。好心的王子又赶过去，替它打开了夹子。狐狸诚心诚意地向他道谢，又从蓬松的尾巴上扯下两根毛。
        - id: ch05-b13
          speaker: fox
          text: 以后需要我帮忙，就把这两根毛扔进火里。转眼之间，我就会来到您身边，听您吩咐。
        - id: ch05-b14
          speaker: narrator
          text: 伊万尼奇把狐狸毛和鱼鳞、鹰羽收在一起。天色渐暗，他赶着两匹马匆匆回家。与此同时，他为女巫服役的期限也快满了。再过三天，整整一年就结束，他可以拿到酬劳，离开这里。
    - id: ch06
      title: 最后三天的考验
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 最后三天的第一晚，伊万尼奇回家吃饭时，发现老太婆偷偷溜进马厩。他悄悄跟过去，蜷身蹲在门口，听见女巫命令两匹马，第二天等王子睡着，就躲进河里，一直藏到她召唤才准回来。要是违抗，她便把它们打得鲜血淋漓。
        - id: ch06-b02
          speaker: narrator
          text: 王子听得清清楚楚。他回到房里，下定决心，第二天无论怎样也不能睡着。清晨，他像平常一样带马去野地，还用绳子拴住它们，把绳头始终握在手中。
        - id: ch06-b03
          speaker: narrator
          text: 可几个时辰后，女巫施展了魔法。伊万尼奇再也撑不住，沉沉睡去。母马和马驹挣脱绳索，照女巫的命令逃走了。
        - id: ch06-b04
          speaker: narrator
          text: 直到深夜，王子才醒来。他惊恐地发现两匹马没了，心中满是绝望。他后悔不该给残忍的女巫当仆人，仿佛已经看见自己的头插在最后那根锋利的尖桩上。
        - id: ch06-b05
          speaker: narrator
          text: 这时，他想起了一直随身带着的鱼鳞。王子取出鱼鳞，跑到河边，把它扔进水中。转眼之间，那条知恩图报的大鱼便游到岸边。
        - id: ch06-b06
          speaker: fish
          text: 我的朋友，我的恩人，您有什么吩咐？
        - id: ch06-b07
          speaker: ivanich
          text: 我奉命看守一匹母马和一匹马驹。它们逃走了，藏在河里。你要是愿意救我的命，请把它们赶回岸上。
        - id: ch06-b08
          speaker: fish
          text: 请等一会儿。我和朋友们很快会把它们赶出水面。
        - id: ch06-b09
          speaker: narrator
          text: 大鱼说完便潜入深处。几乎就在同时，水中响起奔涌的嘶嘶声。波浪拍打河岸，水沫飞上半空，两匹马猛地跃上陆地，吓得浑身发抖。伊万尼奇立刻骑上母马，抓住马驹的缰绳，兴高采烈地赶回去。
        - id: ch06-b10
          speaker: narrator
          text: 女巫看见两匹马，几乎压不住怒火。她给王子摆好晚饭，又偷偷去了马厩。伊万尼奇跟在后面，听见她厉声责骂两匹马没有藏好。她命令它们第二天等王子睡着，便藏进云里，直到她召唤才回来。要是再不听话，就把它们打得鲜血淋漓。
        - id: ch06-b11
          speaker: narrator
          text: 第二天早晨，伊万尼奇把马赶到野外，又一次中了魔法，沉沉睡去。母马和马驹立刻逃跑，藏进从群山上低垂下来的团团柔云中。
        - id: ch06-b12
          speaker: narrator
          text: 王子醒来，不见两匹马，马上想起那只鹰。他拿出羽毛，朝空中一吹。转眼间，鹰俯冲下来，落在他身边。
        - id: ch06-b13
          speaker: eagle
          text: 您要我做什么？
        - id: ch06-b14
          speaker: ivanich
          text: 我的母马和马驹逃了，藏在云里。你若愿意救我的命，请把它们送回来。
        - id: ch06-b15
          speaker: eagle
          text: 等一小会儿。我和朋友们很快会把它们赶回您身边。
        - id: ch06-b16
          speaker: narrator
          text: 鹰腾空而起，消失在云层中。仿佛只过了一眨眼，大大小小的一群鹰便驱赶着两匹马向王子飞来。伊万尼奇捉住母马和马驹，谢过鹰，又欢欢喜喜地把马赶回家。
        - id: ch06-b17
          speaker: narrator
          text: 老女巫见他回来，比前一天更加恼火。她摆好晚饭，又溜进马厩。王子听见她痛骂两匹马没有在云里藏好。接着，她叫它们第二天趁王子睡着，躲进国王的鸡舍。鸡舍在荒原一个偏僻的角落。它们必须藏到她召唤。这次再敢违抗，她一定把它们打得鲜血淋漓。
        - id: ch06-b18
          speaker: narrator
          text: 第三天清晨，王子照常赶马去野外。和前两天一样，他中了魔法，很快睡熟。母马和马驹立即逃进王家的鸡舍。
        - id: ch06-b19
          speaker: narrator
          text: 伊万尼奇醒来，见马又不见了，便决定求狐狸帮忙。他生起一堆火，把两根狐狸毛扔进去。没过多久，狐狸就来到他身边。
        - id: ch06-b20
          speaker: fox
          text: 我能为您做些什么？
        - id: ch06-b21
          speaker: ivanich
          text: 我想知道，国王的鸡舍在什么地方。
        - id: ch06-b22
          speaker: fox
          text: 从这里走过去，不用一个时辰。我带您去。
        - id: ch06-b23
          speaker: narrator
          text: 路上，狐狸问王子为什么要找王家鸡舍。伊万尼奇说出自己的不幸，也告诉它，无论如何都得找回母马和马驹。
        - id: ch06-b24
          speaker: fox
          text: 这件事不容易。不过等等，我想到办法了。您守在鸡舍门外，等着两匹马。我从墙洞钻进鸡群，好好追它们一阵。母鸡一吵，养鸡妇就会惊醒，出来看看出了什么事。她们见到那两匹马，一定以为是马惊动了鸡群，就会把它们赶出去。到时候，您马上捉住它们。
        - id: ch06-b25
          speaker: narrator
          text: 一切果然和聪明的狐狸料想的一样。两匹马被赶出鸡舍，王子立刻翻身跃上母马，抓住马驹的缰绳，飞快地赶回去。
    - id: ch07
      title: 神驹与最后的决战
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 伊万尼奇兴高采烈地骑过荒原。忽然，身下的母马开口对他说起话来。
        - id: ch07-b02
          speaker: mare
          text: 从来没有人能骗过老女巫科尔瓦，你是第一个。现在，你可以随意向她索取一件东西，作为这一年服役的酬劳。只要你答应绝不出卖我，我就给你一个忠告。照着做，一定对你有好处。
        - id: ch07-b03
          speaker: narrator
          text: 王子答应绝不会泄露母马的秘密。
        - id: ch07-b04
          speaker: mare
          text: 什么都不要，只要我的马驹。世上没有别的马能和它相比，花再多钱也买不到。它只用几分钟，就能从大地一头跑到另一头。科尔瓦很狡猾，一定会劝你别选它，还会说它又懒又多病。你千万别信，只管坚持要马驹。
        - id: ch07-b05
          speaker: narrator
          text: 伊万尼奇很想得到这样的神驹，便答应听从母马的忠告。这一次，科尔瓦格外亲热地迎接他，还摆出满桌丰盛饭菜。等王子吃完，她问他做满一年，想要什么酬劳。
        - id: ch07-b06
          speaker: ivanich
          text: 我不要多，也不要少，只要那匹母马生的小马驹。
        - id: ch07-b07
          speaker: narrator
          text: 女巫装出大吃一惊的模样。她说，王子应该得到远比马驹贵重的东西。那畜生又懒又胆小，还有一只眼睛是瞎的，根本一无是处。可伊万尼奇清楚自己想要什么，始终不肯改变主意。
        - id: ch07-b08
          speaker: witch
          text: 我必须守信，把马驹交给你。既然我知道你是谁，也知道你想做什么，那就告诉你，这匹马能怎样帮助你。
        - id: ch07-b09
          speaker: witch
          text: 被你从沸腾沥青锅里放走的，是一个法力强大的魔法师。因为你的好奇和轻率，米利察落进了他的手里。他把米利察、她的城堡，还有她所有的一切，全都搬去了一个遥远的国度。
        - id: ch07-b10
          speaker: witch
          text: 世上只有你能杀死他。所以，他十分害怕你，已经派出密探盯住你的一举一动。那些密探每天都会把你的行踪告诉他。
        - id: ch07-b11
          speaker: witch
          text: 等你见到魔法师，一个字也别跟他说。否则，你会落进他那些朋友手里。你要马上抓住他的胡子，把他摔倒在地。
        - id: ch07-b12
          speaker: narrator
          text: 伊万尼奇谢过女巫，骑上马驹，双脚轻轻一夹。神驹立刻像闪电一样飞过天空。
        - id: ch07-b13
          speaker: narrator
          text: 天色渐渐暗下来。王子看见远处有几个人影，不久便和他们迎面相遇。那正是魔法师和他的朋友们。他们坐在一辆猫头鹰拉着的车里，从天空中驶来。
        - id: ch07-b14
          speaker: narrator
          text: 魔法师发现伊万尼奇挡在前面，已经无路可逃，便装出亲热的样子招呼他。
        - id: ch07-b15
          speaker: captive_sorcerer
          text: 三次救过我性命的大恩人啊！
        - id: ch07-b16
          speaker: narrator
          text: 王子一个字也没回答。他立即揪住魔法师的胡子，把他狠狠摔在地上。与此同时，马驹跃到魔法师身上，四蹄不停踢踏，直到他断了气。
        - id: ch07-b17
          speaker: narrator
          text: 转眼之间，伊万尼奇回到了新娘的宫殿。米利察亲自飞奔出来，投入他的怀抱。
        - id: ch07-b18
          speaker: narrator
          text: 从此以后，他们再也没有受到打扰，一生平安，幸福地生活到生命尽头。
