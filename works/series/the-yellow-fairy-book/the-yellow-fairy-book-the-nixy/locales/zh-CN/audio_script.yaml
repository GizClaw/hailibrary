audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    miller:
      display_name: 磨坊主
      tts:
        delivery: 朴实诚恳，忧愁中带着深深的悔恨
        timbre: 温厚而略显沧桑
        pace: 适中
        pitch: 中低音
    nixy:
      display_name: 水妖
      tts:
        delivery: 柔和诱人，平静中藏着不容违抗的力量
        timbre: 清冷流丽
        pace: 舒缓
        pitch: 中音
    hunters_wife:
      display_name: 猎人的妻子
      tts:
        delivery: 真挚坚韧，悲伤深切却从不失去勇气
        timbre: 年轻清澈
        pace: 适中
        pitch: 中高音
    old_witch:
      display_name: 老妇人
      tts:
        delivery: 洞悉一切，言语直接而不慌不忙
        timbre: 苍老干涩
        pace: 缓慢
        pitch: 中低音
    hunter:
      display_name: 猎人
      tts:
        delivery: 坦率稳重，历经忧伤后更显温柔
        timbre: 年轻有力
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 磨坊主的契约
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个磨坊主，家里的钱财和货物多得用不完。谁知祸事一夜之间就来了。他忽然变得一贫如洗，连身下这座磨坊都快不属于自己了。白天，他绝望地四处徘徊。到了夜里，他也睡不着，只能满怀愁苦，一直睁眼躺到天亮。
        - id: ch01-b02
          speaker: narrator
          text: 一天，天还没亮，磨坊主就起身走到外面，想让清晨的空气替自己宽宽心。他沿着磨坊池塘来回走，忽然听见水里窸窣作响。再走近一看，一个雪白的女人正从波浪中缓缓升起。
        - id: ch01-b03
          speaker: narrator
          text: 磨坊主一眼便认出，那是池塘里的水妖。他吓坏了，既想逃走，又不敢挪动。正在迟疑，水妖叫出了他的名字，问他为什么满面忧愁。她的声音听来十分亲切，磨坊主这才鼓起勇气，把自己的困境都说了出来。
        - id: ch01-b04
          speaker: miller
          text: 我这一辈子原本富足顺利，可如今穷得走投无路，实在不知道还能怎么办。
        - id: ch01-b05
          speaker: narrator
          text: 水妖安慰了他，接着提出一个交换条件。
        - id: ch01-b06
          speaker: nixy
          text: 把你家里最小的东西给我吧。我会让你的日子比从前更加兴旺。
        - id: ch01-b07
          speaker: narrator
          text: 磨坊主心想，她说的无非是小狗或小猫，于是立刻答应下来，满怀希望地回了磨坊。可他刚到门口，仆人便迎上来告诉他，妻子才生下一个男孩。
        - id: ch01-b08
          speaker: narrator
          text: 这消息把磨坊主吓得魂不附体。他沉着一颗心进了屋，把那份要命的契约告诉妻子和亲人。
        - id: ch01-b09
          speaker: miller
          text: 只要能保住我的孩子，水妖答应给我的好运，我一丝一毫也不要了。
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: 可是谁也想不出解救的办法。大家只能处处留心，绝不让孩子靠近磨坊池塘。
    - id: ch02
      title: 水妖索取代价
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 男孩平安长大，磨坊主的家业也一天比一天兴旺。没过几年，他比遭难以前还要富有。可他从没真正快活过，因为那份契约始终压在心上。他知道，水妖总有一天会来讨债。
        - id: ch02-b02
          speaker: narrator
          text: 一年又一年过去，男孩长成了一个机敏勇敢的猎人。当地领主看中他的本领，把他收在身边效力。不久，年轻人娶了一位美丽的妻子，两个人过得安宁又幸福。
        - id: ch02-b03
          speaker: narrator
          text: 有一天，猎人外出打猎，一只野兔从脚边猛地蹿出来，穿过空旷的田野向前奔逃。猎人一路追赶，终于开枪打死了它。他只顾低头剥兔皮，完全没发现自己已经走近了磨坊池塘。那可是他从小就受人告诫，绝不能靠近的地方。
        - id: ch02-b04
          speaker: narrator
          text: 剥完兔皮，他走到水边，想洗掉手上的血。双手才碰到池水，水妖便突然出现，用湿淋淋的手臂抱住他，一下将他拖进了波浪深处。
        - id: ch02-b05
          speaker: narrator
          text: 到了晚上，猎人仍没回家，妻子急得坐立不安。后来，人们在磨坊池塘边发现了他的猎袋，她立刻明白，丈夫已经遭了难。
        - id: ch02-b06
          speaker: narrator
          text: 她悲痛欲狂，绕着池塘走了一圈又一圈，不停呼唤丈夫。最后，悲伤和疲惫耗尽了她的力气，她倒下睡着了。梦里，她穿过一片鲜花盛开的草地，看见一间小屋。屋里住着一位老妇人，答应帮她救回丈夫。
        - id: ch02-b07
          speaker: narrator
          text: 第二天醒来，猎人的妻子立刻出发，去寻找梦中的老妇人。她走了许多天，终于找到那片草地和那间小屋。她把丈夫失踪的经过，还有梦中得到的指引，全都告诉了老妇人。
        - id: ch02-b08
          speaker: old_witch
          text: 等到下一次月圆，你就去池塘边，用金梳子梳你的黑发。梳完以后，把梳子放在岸上。
        - id: ch02-b09
          speaker: narrator
          text: 猎人的妻子送上丰厚的礼物，诚心向老妇人道谢，然后回家等待。
    - id: ch03
      title: 三次月圆
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 等待的日子慢得难熬，月亮终于还是圆了。年轻的妻子来到池塘边，用金梳子梳过黑发，再把梳子放到岸上。她焦急地盯着水面。
        - id: ch03-b02
          speaker: narrator
          text: 不久，水里传来汹涌声。一个巨浪忽然升起，卷走了金梳子。片刻后，丈夫的头浮出水面，悲伤地望着她。可他一个字都没来得及说，另一个浪头便把他重新吞没。池塘又静得纹丝不动，只有月光在水面闪烁。她见到了丈夫，却依然救不了他。
        - id: ch03-b03
          speaker: narrator
          text: 她绝望地流浪了许多个日夜，最后累得沉沉睡去。梦中，那位老妇人再次出现。第二天早晨，她赶回鲜花草地上的小屋，把自己的悲苦说给老妇人听。
        - id: ch03-b04
          speaker: old_witch
          text: 下一次月圆时，再到磨坊池塘去。你要吹奏一支金笛，曲子吹完，就把笛子放在岸边。
        - id: ch03-b05
          speaker: narrator
          text: 月亮再次变圆，猎人的妻子依言来到池塘。她吹完金笛，把它放在岸上。水声随即涌来，一个浪头又将笛子卷走。
        - id: ch03-b06
          speaker: narrator
          text: 丈夫的头露了出来。这一回，他越升越高，半个身子都出了水。他哀伤地望着妻子，向她伸出双臂。可另一个巨浪马上扑来，又把他拖了下去。
        - id: ch03-b07
          speaker: narrator
          text: 眼看丈夫又从面前被夺走，妻子方才满怀的喜悦和希望全都碎了，她再次陷入绝望。
        - id: ch03-b08
          speaker: narrator
          text: 那个梦第三次来安慰她。她又一次找到老妇人的小屋，请求指引。
        - id: ch03-b09
          speaker: old_witch
          text: 等下一次月亮变圆，你带一架金纺车去池塘边。在那里纺线，纺完以后，把纺车留在岸上。
    - id: ch04
      title: 洪水将他们冲散
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 猎人的妻子照着老妇人的话去做。月亮刚圆的那一夜，她坐在池塘边，用金纺车纺起线来。纺完之后，她把纺车留在岸上。
        - id: ch04-b02
          speaker: narrator
          text: 几分钟后，水里响起汹涌声，一个浪头卷走了纺车。丈夫的头立刻浮上水面，越升越高。这一次，他终于踏上岸，扑到妻子颈间，紧紧抱住了她。
        - id: ch04-b03
          speaker: narrator
          text: 就在这时，池水猛然暴涨，漫过两人脚下的岸，将他们一起拖进洪流。年轻的妻子绝望地向老妇人求救。
        - id: ch04-b04
          speaker: hunters_wife
          text: 求求你，快救救我们！
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: 转眼间，猎人变成了青蛙，妻子变成了蟾蜍。可是就连这样，他们也没能留在一起。奔腾的水把两人远远冲散。
        - id: ch04-b06
          speaker: narrator
          text: 洪水退去以后，他们都变回了原来的模样。可他们各自落在一个陌生的国度，谁也不知道另一个人究竟去了哪里。
        - id: ch04-b07
          speaker: narrator
          text: 猎人只好做了牧羊人，他的妻子也成了牧羊女。许多年里，他们独自守着各自的羊群，在孤独和悲伤中生活。
    - id: ch05
      title: 月光下的笛声
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 后来有一天，牧羊人来到牧羊女居住的国度。他喜欢这里，也看出草场丰美，很适合自己的羊群，便把羊都赶了过来，继续过着牧羊的日子。
        - id: ch05-b02
          speaker: narrator
          text: 牧羊人和牧羊女渐渐成了亲密的朋友。可是，他们谁也没认出眼前的人正是自己苦苦思念的伴侣。
        - id: ch05-b03
          speaker: narrator
          text: 一天晚上，月亮正圆。两个人坐在一起看守羊群，牧羊人拿起笛子吹奏起来。
        - id: ch05-b04
          speaker: narrator
          text: 笛声让牧羊女想起了从前。也是在一个月圆之夜，她曾坐在磨坊池塘边，吹过那支金笛。回忆一下涌上来，她再也忍受不住，放声哭了。
        - id: ch05-b05
          speaker: hunter
          text: 你为什么哭？到底是什么事让你这样伤心？请告诉我吧。
        - id: ch05-b06
          speaker: narrator
          text: 牧羊人一再追问，直到她说出自己的全部经历。听着听着，他眼前的迷障仿佛突然消散了。他终于认出，这位牧羊女就是自己的妻子。她也认出了失散多年的丈夫。
        - id: ch05-b07
          speaker: narrator
          text: 两个人满心欢喜，一同回到故乡。从此，他们过上了安宁幸福的生活。
