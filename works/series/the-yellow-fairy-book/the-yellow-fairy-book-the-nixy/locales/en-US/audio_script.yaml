  chapters:
    - id: ch01
      title: The Miller's Bargain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a miller who had more money and goods than he knew what to do with. Then sorrow came in the night. All at once, his prosperity vanished. He became so poor that he could barely call the mill his own. All day he wandered about in despair, unable to see what he could do. At night he found no rest at all. He lay awake until morning, lost in troubled thoughts.
        - id: ch01-b02
          speaker: narrator
          text: One morning, before dawn, he went outside, hoping the open air might ease his heart. As he walked beside the mill-pond, the water rustled. He looked closer and saw a white woman rising from the waves.
        - id: ch01-b03
          speaker: narrator
          text: He knew at once that she was the nixy of the mill-pond. He was so frightened that he could not decide whether to run or stay. While he stood there, she called him by name and asked why he was so sad.
        - id: ch01-b04
          speaker: miller
          text: All my life I was rich and fortunate. Now I have fallen into such want that I no longer know what to do.
        - id: ch01-b05
          speaker: narrator
          text: Her friendly voice gave him courage. The nixy comforted him and offered to make him richer than he had ever been before. In return, he must give her the youngest thing in his house.
        - id: ch01-b06
          speaker: nixy
          text: Give me the youngest thing in your house, and I will make you more prosperous than ever.
        - id: ch01-b07
          speaker: narrator
          text: The miller thought she could only mean one of the young puppies or kittens in his house. That seemed a small price for the end of all his misery, so he gave the nixy his promise at once. He returned to the mill full of hope. But at the threshold, a servant met him with unexpected news. His wife had just given birth to a boy.
        - id: ch01-b08
          speaker: narrator
          text: Horror filled the poor miller. With a heavy heart, he told his wife and their relations about the fatal bargain.
        - id: ch01-b09
          speaker: miller
          text: I would gladly give up every bit of the fortune she promised, if only I could save my child.
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: No one knew how to help him. They could only make sure the child never went near the mill-pond.
    - id: ch02
      title: The Nixy Claims Her Due
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The boy grew strong, and meanwhile everything the miller touched seemed to prosper. Within a few years, he was richer than he had been before his troubles began. But he could not enjoy any of it. The bargain with the nixy was always in his thoughts. As each year passed, he knew the day must come when she would demand that he keep his promise.
        - id: ch02-b02
          speaker: narrator
          text: The years passed. The boy grew into a bold and skillful hunter, and the lord of the land took him into his service. Before long, he married a pretty young woman, and the two of them lived together in peace and happiness.
        - id: ch02-b03
          speaker: narrator
          text: One day, while the hunter was out, a hare sprang up at his feet and raced ahead of him across an open field. He followed it eagerly for some distance and finally shot it. Then he stopped to skin it. He was so busy with his work that he never noticed how close he had come to the mill-pond, the one place he had been taught to avoid since childhood.
        - id: ch02-b04
          speaker: narrator
          text: When the work was done, he went to wash the blood from his hands. The moment he dipped them into the pond, the nixy rose from the water. She caught him in her wet arms and dragged him beneath the waves.
        - id: ch02-b05
          speaker: narrator
          text: He did not return that evening, and his wife grew terribly anxious. Then his game bag was found beside the mill-pond, and she knew what had happened.
        - id: ch02-b06
          speaker: narrator
          text: Almost wild with grief, she walked around and around the pond, calling for her husband without rest. At last sorrow and weariness overcame her. She fell asleep and dreamed that she crossed a meadow full of flowers. There she found a hut, and inside it was an old witch who promised to restore her husband.
        - id: ch02-b07
          speaker: narrator
          text: When morning came, the hunter's wife set out to find the witch. She wandered for many days before she reached the flowery meadow and found the hut from her dream. She told the old woman everything that had happened, and how the dream had led her there.
        - id: ch02-b08
          speaker: old_witch
          text: When the moon is full, go to the pond. Comb your black hair with a golden comb, then place the comb upon the bank.
        - id: ch02-b09
          speaker: narrator
          text: The young wife gave the witch a handsome present and thanked her with all her heart. Then she went home to wait.
    - id: ch03
      title: Three Full Moons
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Time moved slowly, but at last the full moon rose. The hunter's wife went to the pond and combed her black hair with a golden comb. When she finished, she set it on the bank and watched the water impatiently.
        - id: ch03-b02
          speaker: narrator
          text: Soon there came a rushing sound. A great wave rose without warning and swept the comb from the bank. A moment later, her husband's head appeared above the water, and he looked sadly at her. Before he could speak a single word, another wave came and pulled him under again. The pond lay still and motionless, glittering in the moonlight. His wife had seen him, but she was no nearer to setting him free.
        - id: ch03-b03
          speaker: narrator
          text: In despair, she wandered for days and nights. At last exhaustion drew her into a deep sleep, and once again she dreamed of the old witch. The next morning, she returned to the hut in the flowery meadow and told the old woman of her grief.
        - id: ch03-b04
          speaker: old_witch
          text: At the next full moon, go back to the mill-pond. Play a golden flute there, and afterward lay it on the bank.
        - id: ch03-b05
          speaker: narrator
          text: When the moon was full again, the hunter's wife went to the pond and played a golden flute. She laid it on the bank when the music ended. Once more the water rushed, and a wave carried the flute away.
        - id: ch03-b06
          speaker: narrator
          text: Her husband's head appeared. This time he rose higher and higher, until half his body was above the water. He looked sadly at his wife and reached his arms toward her. Then another wave surged up and dragged him below.
        - id: ch03-b07
          speaker: narrator
          text: She had stood on the bank filled with joy and hope. Now, seeing him torn away before her eyes, she fell back into despair.
        - id: ch03-b08
          speaker: narrator
          text: Yet the same dream came to comfort her a third time, and once more she made her way to the witch's hut in the flowery meadow.
        - id: ch03-b09
          speaker: old_witch
          text: When the next full moon comes, take a golden spinning-wheel to the pond. Spin beside the water, then leave the wheel upon the bank.
    - id: ch04
      title: Swept Apart
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The hunter's wife followed the witch's advice. On the first night of the full moon, she sat beside the pond and spun with a golden spinning-wheel. When she was done, she left the wheel on the bank.
        - id: ch04-b02
          speaker: narrator
          text: Within minutes, the water rushed and a wave swept the spinning-wheel away. At once the hunter's head rose from the pond. Higher and higher he came, until at last he stepped onto the bank and threw his arms around his wife.
        - id: ch04-b03
          speaker: narrator
          text: Suddenly the pond rose over its banks. The flood closed around the couple and dragged them both beneath the water. In her despair, the young wife called upon the old witch for help.
        - id: ch04-b04
          speaker: hunters_wife
          text: Help us! Please, help us!
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: In an instant, the hunter became a frog and his wife became a toad. Still, they could not remain together. The rushing water tore them apart.
        - id: ch04-b06
          speaker: narrator
          text: When the flood was finally over, they both returned to their human shapes. But each had been carried to a strange country, and neither knew what had become of the other.
        - id: ch04-b07
          speaker: narrator
          text: The hunter became a shepherd, and his wife became a shepherdess. For many years, they tended their sheep in loneliness and sorrow.
    - id: ch05
      title: The Shepherd's Flute
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One day, the shepherd came to the country where the shepherdess lived. He liked the place, and its rich pastures suited his flock. So he brought his sheep there and continued his solitary life.
        - id: ch05-b02
          speaker: narrator
          text: The shepherd and the shepherdess became close friends, though neither recognized the other at all.
        - id: ch05-b03
          speaker: narrator
          text: Then, one evening when the moon was full, they sat together watching their flocks. The shepherd began to play his flute.
        - id: ch05-b04
          speaker: narrator
          text: The music carried the shepherdess back to the full-moon night beside the mill-pond, when she had played the golden flute. The memory was more than she could bear, and she burst into tears.
        - id: ch05-b05
          speaker: hunter
          text: Why are you crying? Please tell me what has made you so sad.
        - id: ch05-b06
          speaker: narrator
          text: He would not let the matter rest until she told him her whole story. As he listened, it was as though scales fell from his eyes. The shepherd knew her at last. She was his wife, and she recognized her husband too.
        - id: ch05-b07
          speaker: narrator
          text: Full of joy, they returned to their own home. There they lived together in peace and happiness ever after.
