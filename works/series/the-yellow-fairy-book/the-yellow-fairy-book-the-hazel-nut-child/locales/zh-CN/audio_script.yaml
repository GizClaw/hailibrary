audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的神秘与克制, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    hazel_nut_child:
      display_name: 榛子小人
      tts: {delivery: 机敏自信，活泼中透着坚定, timbre: 清亮年轻, pace: 稍快, pitch: 高音}
    mother:
      display_name: 母亲
      tts: {delivery: 慈爱务实，笑语中带着温和的怀疑, timbre: 温暖成熟, pace: 适中, pitch: 中音}
    father:
      display_name: 父亲
      tts: {delivery: 朴实亲切，说话直截了当而稳重, timbre: 醇厚成熟, pace: 适中, pitch: 中低音}
  chapters:
    - id: ch01
      title: 小小的信使
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，有一对夫妻一直没有孩子。他们天天向上天祈求，哪怕赐给他们一个只有榛子那么大的孩子也好。上天终于听见了。夫妻俩果真有了一个榛子大小的儿子，只是这孩子从此再也没有长高一点儿。
        - id: ch01-b02
          speaker: narrator
          text: 父母十分疼爱这个小小的生命，总是精心哺育他、照料他。别看儿子个头小，心眼儿可聪明极了。他既机灵又懂事，说出的话、做出的事，常常让邻居们惊叹不已。
        - id: ch01-b03
          speaker: narrator
          text: 榛子小人十五岁那年，有一天坐在桌上的蛋壳里，正好挨着母亲。母亲转头看着他，问起了他的将来。
        - id: ch01-b04
          speaker: mother
          text: 你都十五岁了，可身子还是这么小，什么活儿也干不了。以后究竟想做什么呢？
        - id: ch01-b05
          speaker: hazel_nut_child
          text: 我要当信使。
        - id: ch01-b06
          speaker: narrator
          text: 母亲一听，扑哧笑出了声。
        - id: ch01-b07
          speaker: mother
          text: 你要当信使？这主意可真稀奇！普通人一分钟走完的路，你那双小脚要走一个钟头呢！
        - id: ch01-b08
          speaker: hazel_nut_child
          text: 我还是要当信使！您托我办一件事吧，看我是不是转眼就能回来。
        - id: ch01-b09
          speaker: mother
          text: 好吧。你去邻村找姨妈，替我取一把梳子回来。
        - id: ch01-b10
          speaker: narrator
          text: 榛子小人马上跳出蛋壳，跑到街上。正巧，一个骑马人要去邻村。他顺着马腿爬上去，躲到马鞍下面，又掐马儿，又用针扎它。马儿又跳又立，转眼便狂奔起来。骑马人使尽力气，也没法叫它停下。
        - id: ch01-b11
          speaker: narrator
          text: 一到邻村，榛子小人就收起了针。马儿早已累坏，只能慢得像蜗牛一样向前挪。他趁机爬下马腿，跑到姨妈家取了梳子。回去时，他遇上另一个骑马人，又用同样的办法搭了一程。
        - id: ch01-b12
          speaker: narrator
          text: 母亲接过梳子，惊讶得简直不敢相信。
        - id: ch01-b13
          speaker: mother
          text: 你怎么这么快就回来了？
          emotion: surprised
        - id: ch01-b14
          speaker: hazel_nut_child
          text: 妈妈，您现在明白了吧？我早就说过，当信使正适合我。
    - id: ch02
      title: 把马夺回来
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 父亲也养着一匹马，常牵它到田野里吃草。有一天，他带榛子小人一同去了。到了中午，父亲要回家给母亲捎个话，便把看马的事交给儿子。
        - id: ch02-b02
          speaker: father
          text: 你留在这里，好好看着马。我回家一趟，很快就来。
        - id: ch02-b03
          speaker: narrator
          text: 父亲走后，一个强盗经过这里。他只看见马在吃草，没看见有人守着。榛子小人藏在草丛里，那么小，强盗怎么可能瞧得见？强盗骑上马，扬长而去。
        - id: ch02-b04
          speaker: narrator
          text: 榛子小人身手敏捷，顺着马尾巴爬上去，一口咬住马背。马儿一下子暴怒起来。强盗拼命想让它转弯，它偏偏全不理会，驮着他直奔自己的家。
        - id: ch02-b05
          speaker: narrator
          text: 父亲看见陌生人骑着自家的马回来，惊讶得愣住了。榛子小人飞快地爬下来，把经过从头到尾说了一遍。父亲马上叫人抓住强盗，把他送进监牢。
    - id: ch03
      title: 骑着鹳飞向南方
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 又过了几年。一个秋天，榛子小人已经二十岁了。他要告别父母，出去闯荡世界。
        - id: ch03-b02
          speaker: hazel_nut_child
          text: 再见了，爸爸妈妈。我要到外面的世界去。等我发了财，一定马上回来看你们。
        - id: ch03-b03
          speaker: narrator
          text: 父母听完都笑了。他们根本不相信，这个小人真能办到。
        - id: ch03-b04
          speaker: narrator
          text: 当天晚上，榛子小人爬上屋顶。几只鹳在那里筑了巢，这时都已经睡熟。他悄悄爬到鹳爸爸背上，用一根丝线缚住它一边翅膀的关节，再钻进柔软的绒羽里睡着了。
        - id: ch03-b05
          speaker: narrator
          text: 第二天早晨，鹳群向南飞去，因为冬天就要来了。榛子小人伏在鹳背上，一路飞过天空。想休息的时候，他便把丝线缚到鸟儿另一边翅膀的关节上，鹳就没法继续飞了。
        - id: ch03-b06
          speaker: narrator
          text: 他就这样来到黑人居住的国度。鹳群在都城附近住了下来。那里的人见到榛子小人，惊奇万分，便把他和那只鹳一起带去见国王。
        - id: ch03-b07
          speaker: narrator
          text: 国王一见这个小家伙就十分高兴，总把他留在身边。没过多久，国王越来越喜爱他，竟送给他一颗大钻石，足足有榛子小人本人四倍大。
    - id: ch04
      title: 带着钻石回家
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 榛子小人用丝带把钻石牢牢系在鹳的颈下。等别的鹳开始准备向北飞，他便解开缚在自己这只鹳翅膀上的丝线。鹳群振翅飞起，每飞一刻，他就离故乡更近一点。
        - id: ch04-b02
          speaker: narrator
          text: 榛子小人终于回到了自己的村庄。他解下鹳颈下的丝带，让钻石落在地上，又用沙土和石块把它盖好。接着，他赶紧跑去叫父母。那颗钻石实在太重，凭他自己怎么也抬不动，只能请父母来把宝贝搬回家。
        - id: ch04-b03
          speaker: narrator
          text: 从此，榛子小人和父母一直过着幸福富足的生活，直到去世。
