  chapters:
    - id: ch01
      title: The Little Messenger
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a husband and wife who had no children. Every day they prayed to Heaven to send them a child, even one no bigger than a hazelnut. At last, Heaven heard their prayer. They had a son exactly the size of a hazelnut, and he never grew another inch.
        - id: ch01-b02
          speaker: narrator
          text: His parents loved the tiny creature dearly. They nursed him, tended him carefully, and cared for him with great tenderness. Their son was remarkably clever too. He was so sharp and sensible that all the neighbors wondered at the wise things he said and did.
        - id: ch01-b03
          speaker: narrator
          text: When the Hazel-nut Child was fifteen, he sat one day in an eggshell on the table beside his mother. She looked at him and spoke.
        - id: ch01-b04
          speaker: mother
          text: You are fifteen years old now, but you are still so tiny. What kind of work do you mean to do?
        - id: ch01-b05
          speaker: hazel_nut_child
          text: I will be a messenger.
        - id: ch01-b06
          speaker: narrator
          text: His mother burst out laughing.
        - id: ch01-b07
          speaker: mother
          text: A messenger? What an idea! Your little feet would need an hour to cover the distance an ordinary person walks in a minute.
        - id: ch01-b08
          speaker: hazel_nut_child
          text: I still mean to be a messenger. Give me a message to carry, and you will see how quickly I come back.
        - id: ch01-b09
          speaker: mother
          text: Very well. Go to your aunt in the next village and bring me a comb.
        - id: ch01-b10
          speaker: narrator
          text: The Hazel-nut Child sprang out of his eggshell and ran into the street. There he found a man on horseback who was just setting out for the next village. The little boy climbed up the horse's leg and settled beneath the saddle. Then he pinched the horse and pricked it with a pin.
        - id: ch01-b11
          speaker: narrator
          text: The horse plunged and reared, then tore away at a hard gallop. Its rider tried to stop it, but the animal would not slow down. As soon as they reached the village, the Hazel-nut Child stopped pricking. The exhausted horse went on at a snail's pace, and the boy slipped down its leg.
        - id: ch01-b12
          speaker: narrator
          text: He ran to his aunt and asked for the comb. On his way back, he met another rider and traveled home by the very same trick. When he handed the comb to his mother, she stared at him in amazement.
        - id: ch01-b13
          speaker: mother
          text: How did you get home again so fast?
          emotion: surprised
        - id: ch01-b14
          speaker: hazel_nut_child
          text: You see, Mother? I was right. Being a messenger is exactly the work for me.
    - id: ch02
      title: The Stolen Horse
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The boy's father owned a horse and often took it into the fields to graze. One day, he brought the Hazel-nut Child along. At noon, the father turned to his tiny son.
        - id: ch02-b02
          speaker: father
          text: Stay here and watch the horse. I have to go home with a message for your mother, but I will soon be back.
        - id: ch02-b03
          speaker: narrator
          text: After his father left, a robber came past. He saw the horse grazing with no one near it. Of course, he could not see the Hazel-nut Child hidden down in the grass. The robber mounted the horse and rode away.
        - id: ch02-b04
          speaker: narrator
          text: But the little boy was wonderfully active. He climbed up the horse's tail and bit it on the back. The horse became so furious that it ignored every turn the robber tried to make it take. Instead, it galloped straight home.
        - id: ch02-b05
          speaker: narrator
          text: The father was astonished to see a stranger riding his horse. The Hazel-nut Child quickly climbed down and told him everything that had happened. His father had the robber arrested at once and sent to prison.
    - id: ch03
      title: South on a Stork
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: One autumn, when the Hazel-nut Child was twenty years old, he said farewell to his parents.
        - id: ch03-b02
          speaker: hazel_nut_child
          text: Goodbye, dear Father and Mother. I am setting out into the world. As soon as I have become rich, I will come home to you.
        - id: ch03-b03
          speaker: narrator
          text: His parents laughed at the little man's words. They did not believe him for a moment.
        - id: ch03-b04
          speaker: narrator
          text: That evening, the Hazel-nut Child climbed onto the roof, where some storks had made their nest. While the birds slept, he crept onto the father stork's back. He tied a silk cord around the joint of one wing, nestled among the soft downy feathers, and fell asleep.
        - id: ch03-b05
          speaker: narrator
          text: Winter was drawing near, so the storks flew south the next morning. The little man traveled through the air on the father stork's back. Whenever he wanted to rest, he fastened his silk cord around the joint of the other wing, and the bird could fly no farther.
        - id: ch03-b06
          speaker: narrator
          text: In this way, he reached the country where the Black people lived. The storks made their home close to the capital. When the people there saw the tiny traveler riding with the stork, they were amazed. They took both of them before the King of that country.
        - id: ch03-b07
          speaker: narrator
          text: The King was delighted with the little creature and always kept him near. Before long, he had grown so fond of the Hazel-nut Child that he gave him a diamond four times as large as the boy himself.
    - id: ch04
      title: The Diamond Comes Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Hazel-nut Child tied the diamond securely beneath the stork's neck with a ribbon. When he saw the other storks preparing to fly north, he untied the silk cord from his stork's wings. Away they went, drawing nearer to his home every minute.
        - id: ch04-b02
          speaker: narrator
          text: At last, the Hazel-nut Child reached his own village. He loosened the ribbon around the stork's neck, and the diamond dropped to the ground. First he hid it under sand and stones. Then he ran to fetch his parents, because the treasure was far too heavy for him to lift.
        - id: ch04-b03
          speaker: narrator
          text: From that time on, the Hazel-nut Child and his parents lived happily and prosperously together until they died.
