  chapters:
    - id: ch01
      title: Six Men Set Out
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man who had mastered all kinds of skills. He served bravely in a war, but when the fighting ended, he was discharged with only three farthings of pay. He set off with the coins in his pocket, angry at the poor reward.
        - id: ch01-b02
          speaker: soldier
          text: Just wait. I won't put up with this. Once I find the right men, the King will have to give me every treasure in his kingdom.
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: He strode into a forest and found a man who had pulled six trees from the earth as easily as six straws.
        - id: ch01-b04
          speaker: soldier
          text: Will you serve me and travel at my side?
        - id: ch01-b05
          speaker: strong_man
          text: I will. First, let me carry this little bundle of sticks home to my mother.
        - id: ch01-b06
          speaker: narrator
          text: The strong man wound one tree around the other five, lifted the whole bundle onto his shoulders, and carried it away. Then he returned and joined the soldier.
        - id: ch01-b07
          speaker: soldier
          text: The two of us should be able to make our way through the wide world.
        - id: ch01-b08
          speaker: narrator
          text: Before long, they came upon a hunter kneeling with his gun at his shoulder. He was aiming at something far away.
        - id: ch01-b09
          speaker: soldier
          text: Hunter, what can you possibly be aiming at from here?
        - id: ch01-b10
          speaker: hunter
          text: Two miles away, a fly is sitting on the branch of an oak tree. I mean to shoot out its left eye.
        - id: ch01-b11
          speaker: soldier
          text: Then come with me. With three of us together, the wide world will be easy to cross.
        - id: ch01-b12
          speaker: narrator
          text: The hunter agreed. The three men soon passed seven windmills whose sails were spinning quickly, though there was no breeze at all. Not even a leaf stirred.
        - id: ch01-b13
          speaker: soldier
          text: What is driving those windmills? There isn't a breath of wind.
        - id: ch01-b14
          speaker: narrator
          text: Two miles farther on, they saw a man sitting in a tree. He held one nostril shut and blew through the other.
        - id: ch01-b15
          speaker: soldier
          text: What are you blowing at from up there?
        - id: ch01-b16
          speaker: blower
          text: Those seven windmills two miles back. I'm keeping their sails turning.
        - id: ch01-b17
          speaker: soldier
          text: Come along with us. Four men like us can travel easily through the wide world.
        - id: ch01-b18
          speaker: narrator
          text: The blower climbed down and went with them. After a while, they found a man standing on one leg. He had unstrapped the other and laid it beside him.
        - id: ch01-b19
          speaker: soldier
          text: You certainly know how to make yourself comfortable when you rest.
        - id: ch01-b20
          speaker: runner
          text: Rest? I'm a runner. I took off one leg so I wouldn't move too fast. With both legs on, I can outrun a bird in flight.
        - id: ch01-b21
          speaker: soldier
          text: Come with us, then. With five together, we'll make short work of the wide world.
        - id: ch01-b22
          speaker: narrator
          text: The runner joined them. Soon they met a man wearing a little hat tipped over one ear.
        - id: ch01-b23
          speaker: soldier
          text: Mind your manners! Straighten that hat. You look like a madman with it hanging over one ear.
        - id: ch01-b24
          speaker: frost_man
          text: I can't put it on straight. If I did, such a frost would come that birds would freeze in the sky and fall dead to the ground.
        - id: ch01-b25
          speaker: soldier
          text: You had better join us. Now that there are six of us, we can travel through the wide world with ease.
        - id: ch01-b26
          speaker: narrator
          text: So the man with the little hat went with them, and the six companions continued on their way.
    - id: ch02
      title: The Race for Water
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The six came to a town where the King had announced a dangerous contest. Whoever raced his daughter and beat her would become her husband. Whoever lost would have his head cut off. When the soldier heard the proclamation, he declared that he would enter.
        - id: ch02-b02
          speaker: soldier
          text: My servant will run in my place.
        - id: ch02-b03
          speaker: king
          text: Then both of you must stake your heads. If your servant loses, his life and yours belong to the winner.
        - id: ch02-b04
          speaker: narrator
          text: The soldier accepted those terms. He strapped the runner's second leg back on and gave him his orders.
        - id: ch02-b05
          speaker: soldier
          text: Be quick now. Make certain we win.
        - id: ch02-b06
          speaker: narrator
          text: The race was to a stream far from town. The first runner to return with water would win. The King's daughter took one pitcher, the runner took another, and they started together.
        - id: ch02-b07
          speaker: narrator
          text: The princess had gone only a short distance when the runner vanished from sight. To the people watching, it seemed that a gust of wind had whistled past. He reached the stream in no time, filled his pitcher, and turned for home.
        - id: ch02-b08
          speaker: narrator
          text: Halfway back, however, he grew terribly drowsy. He set down the pitcher and lay on the ground. A horse's skull was lying nearby, so he used it as a pillow. He thought its hard bones would keep him from sleeping long, but he fell fast asleep.
        - id: ch02-b09
          speaker: narrator
          text: Meanwhile, the King's daughter reached the stream. She could run as well as any ordinary man. She filled her pitcher and hurried back. When she found her rival asleep beside the road, she was delighted.
        - id: ch02-b10
          speaker: princess
          text: Now my enemy is helpless in my hands!
          emotion: happy
        - id: ch02-b11
          speaker: narrator
          text: She poured the water out of his pitcher and raced on. The contest would have been lost if the hunter had not been watching from the castle tower. His sharp eyes saw everything.
        - id: ch02-b12
          speaker: hunter
          text: Oh no. The King's daughter won't trick us like that.
        - id: ch02-b13
          speaker: narrator
          text: He loaded his gun and took careful aim. His shot knocked the horse's skull from beneath the runner's head without touching the sleeping man.
        - id: ch02-b14
          speaker: narrator
          text: The runner woke and sprang up. His pitcher was empty, and the princess was far ahead. Still, he did not lose heart. He dashed back to the stream, filled the pitcher again, and reached town ten minutes before she did.
        - id: ch02-b15
          speaker: runner
          text: There, you see? I was only stretching my legs. I wouldn't call that a real run.
    - id: ch03
      title: The Iron Room
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The King was furious that a common discharged soldier had won his daughter. The princess was even angrier. Father and daughter talked together, trying to find a way to destroy the soldier and his companions.
        - id: ch03-b02
          speaker: king
          text: I've thought of a way. Don't be afraid. None of them will ever return home.
        - id: ch03-b03
          speaker: narrator
          text: Then the King approached the six men with an invitation.
        - id: ch03-b04
          speaker: king
          text: You should celebrate together now. Come, eat and drink your fill.
        - id: ch03-b05
          speaker: narrator
          text: He led them into a room with an iron floor, iron doors, and iron bars across every window. A table inside was covered with delicious food.
        - id: ch03-b06
          speaker: king
          text: Go in and enjoy yourselves.
        - id: ch03-b07
          speaker: narrator
          text: As soon as all six were inside, the King had the doors shut and bolted. He summoned the cook and ordered him to build a great fire beneath the room. It was to burn until the iron glowed red.
        - id: ch03-b08
          speaker: narrator
          text: The cook obeyed. At first, the men around the table thought the rich meal was making them warm. The heat kept rising. When they tried to leave and found every door and window fastened, they understood. The King meant to suffocate them.
        - id: ch03-b09
          speaker: frost_man
          text: He won't succeed! I'll bring a frost so bitter that the fire will be ashamed of itself and die.
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: The man set his little hat straight. At once, freezing cold filled the room. Every trace of heat disappeared, and the food began to freeze hard on the dishes.
        - id: ch03-b11
          speaker: narrator
          text: A few hours passed. Certain that his guests had died in the heat, the King ordered the doors opened and went in to look. Instead, all six men stood before him, alive and well.
        - id: ch03-b12
          speakers: [soldier, strong_man, hunter, blower]
          ensemble: chorus
          text: At last! We can go outside and warm ourselves. It was so cold in here that all the food froze solid.
        - id: ch03-b13
          speaker: narrator
          text: The King stormed off to the cook. He scolded the man and demanded to know why his order had not been followed.
        - id: ch03-b14
          speaker: cook
          text: There's more than enough heat under that room. Come and see it for yourself.
        - id: ch03-b15
          speaker: narrator
          text: The King looked beneath the iron floor and saw an enormous fire blazing there. Then he knew this trap could not harm the six men. Once again, he began searching for a way to rid himself of his unwelcome guests.
    - id: ch04
      title: The Sack of Gold
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The King called the soldier before him and offered him a bargain.
        - id: ch04-b02
          speaker: king
          text: Give up your claim to my daughter, and I'll pay you in gold. You may take as much as you wish.
        - id: ch04-b03
          speaker: soldier
          text: Gladly, Your Majesty. Give me as much gold as one of my servants can carry, and I'll give up the princess.
        - id: ch04-b04
          speaker: narrator
          text: The King was delighted. The soldier promised to return for the payment in fourteen days. Then he gathered every tailor in the kingdom and kept them sewing for all fourteen days. Together, they made an enormous sack.
        - id: ch04-b05
          speaker: narrator
          text: When it was ready, the soldier told the strong man to shoulder it. They carried it to the palace. The King stared at the bale of cloth, which looked as large as a house, and fear crept over him.
        - id: ch04-b06
          speaker: king
          text: What a mighty fellow! He can carry that mountain of cloth on one shoulder. How much of my gold will he take away?
        - id: ch04-b07
          speaker: narrator
          text: The King had a ton of gold brought out. It took sixteen of his strongest men to carry it, but the strong man picked it up with one hand and dropped it into the sack.
        - id: ch04-b08
          speaker: strong_man
          text: Is that all? Bring me more. This little bit hardly covers the bottom.
        - id: ch04-b09
          speaker: narrator
          text: Again and again, the King sent servants for more treasure. The strong man pushed every load into the sack, yet it was still only half full.
        - id: ch04-b10
          speaker: strong_man
          text: More! These crumbs will never fill it.
        - id: ch04-b11
          speaker: narrator
          text: At last, seven thousand wagons arrived with all the gold in the kingdom. The strong man swept the wagons into the sack, oxen and all.
        - id: ch04-b12
          speaker: strong_man
          text: I won't be fussy anymore. I'll take whatever comes, just so we can fill this sack.
        - id: ch04-b13
          speaker: narrator
          text: Even after the whole treasure had gone in, there was room to spare.
        - id: ch04-b14
          speaker: strong_man
          text: Enough. A sack doesn't have to be full before you tie it shut.
        - id: ch04-b15
          speaker: narrator
          text: He fastened the sack, swung it onto his back, and walked away with his companions.
    - id: ch05
      title: The King's Last Pursuit
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When the King saw one man carrying away the wealth of his entire country, his anger boiled over. He ordered his cavalry to mount, chase the six companions, and bring back the strong man and his sack.
        - id: ch05-b02
          speaker: narrator
          text: Two regiments soon caught up with the travelers. The soldiers surrounded them and shouted their command.
        - id: ch05-b03
          speakers: [cavalryman_1, cavalryman_2]
          ensemble: duo
          text: You are our prisoners! Put down that sack of gold, or we'll cut you to pieces!
          emotion: angry
        - id: ch05-b04
          speaker: blower
          text: Prisoners, are we? Before that happens, you can dance in the air!
        - id: ch05-b05
          speaker: narrator
          text: He pressed one nostril shut and blew through the other. The two regiments broke apart and flew high into the blue sky. Some sailed one way over the mountains, and some sailed the other.
        - id: ch05-b06
          speaker: narrator
          text: The sergeant-major begged for mercy. He had nine wounds from battle, he said, and had proved himself a brave man. He did not deserve such a disgrace.
        - id: ch05-b07
          speaker: sergeant_major
          text: Please let me down! I've been wounded nine times in battle, and I've always served bravely. Don't leave me up here in shame!
          emotion: fearful
        - id: ch05-b08
          speaker: narrator
          text: The blower spared him and lowered him safely to the ground.
        - id: ch05-b09
          speaker: blower
          text: Go back to your King. Tell him that if he sends more cavalry, I'll blow every last soldier into the air.
        - id: ch05-b10
          speaker: narrator
          text: The sergeant-major carried the warning home.
        - id: ch05-b11
          speaker: king
          text: Let those fellows go. They must be bewitched.
        - id: ch05-b12
          speaker: narrator
          text: So the six companions brought the treasure home. They shared it among themselves and lived contentedly for the rest of their days.
