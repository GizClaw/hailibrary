audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    master:
      display_name: 主人
      tts:
        delivery: 自信果断，受辱时带着不平，说起计划来胸有成竹
        timbre: 坚实明亮
        pace: 适中
        pitch: 中音
    strong_man:
      display_name: 大力士
      tts:
        delivery: 爽直憨厚，面对再重的东西也毫不费力
        timbre: 宽厚有力
        pace: 稍缓
        pitch: 低音
    hunter:
      display_name: 猎人
      tts:
        delivery: 专注沉着，说话简洁，显出百发百中的把握
        timbre: 清晰冷静
        pace: 适中
        pitch: 中低音
    blower:
      display_name: 吹风人
      tts:
        delivery: 豪爽自若，显露本领时带着顽皮的威风
        timbre: 洪亮通透
        pace: 适中
        pitch: 中低音
    runner:
      display_name: 飞毛腿
      tts:
        delivery: 轻快自信，对自己的速度颇为得意
        timbre: 年轻清亮
        pace: 稍快
        pitch: 中高音
    frost_man:
      display_name: 歪帽人
      tts:
        delivery: 谨慎中带着奇异的自信，危急时斩钉截铁
        timbre: 清冷沉稳
        pace: 适中
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 威严傲慢，算计落空后压着恼怒与惊慌
        timbre: 低沉厚重
        pace: 稍缓
        pitch: 低音
    princess:
      display_name: 公主
      tts:
        delivery: 骄傲好胜，抓住机会时流露出毫不掩饰的欣喜
        timbre: 明亮锐利
        pace: 稍快
        pitch: 中高音
    cook:
      display_name: 厨子
      tts:
        delivery: 受责问时委屈而笃定，急于证明自己照办了命令
        timbre: 朴实清楚
        pace: 适中
        pitch: 中音
    cavalryman_1:
      display_name: 骑兵甲
      tts:
        delivery: 奉命追击时强硬威吓
        timbre: 粗犷响亮
        pace: 稍快
        pitch: 中低音
    cavalryman_2:
      display_name: 骑兵乙
      tts:
        delivery: 奉命追击时强硬威吓
        timbre: 浑厚有力
        pace: 稍快
        pitch: 中音
    cavalryman_3:
      display_name: 骑兵丙
      tts:
        delivery: 奉命追击时强硬威吓
        timbre: 高亢清晰
        pace: 稍快
        pitch: 中高音
    sergeant_major:
      display_name: 军士长
      tts:
        delivery: 久经战阵却在半空中惊慌求饶
        timbre: 沙哑有力
        pace: 急促
        pitch: 中低音
  chapters:
    - id: ch01
      title: 六个奇人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一个人，样样本领都懂一些。他在战场上勇敢作战，表现得很好。可战争一结束，军队只给了他三个小钱，就把他遣散了。他带着这点军饷上路，心里很不服气。
        - id: ch01-b02
          speaker: master
          text: 等着瞧吧，这样打发我，我可不答应。只要找到合适的伙伴，国王早晚得把全国的财宝都交出来。
        - id: ch01-b03
          speaker: narrator
          text: 他气冲冲地走进森林，看见一个人拔起六棵大树，就像拔六根稻草那么轻松。
        - id: ch01-b04
          speaker: master
          text: 你愿意做我的仆人，跟我一起闯天下吗？
        - id: ch01-b05
          speaker: strong_man
          text: 愿意。不过，我得先把这小捆柴送回家给母亲。
        - id: ch01-b06
          speaker: narrator
          text: 那人拿起一棵树，把另外五棵缠成一捆，往肩上一扛就走了。送完这捆“柴”，他回来跟着主人上路。
        - id: ch01-b07
          speaker: master
          text: 凭我们两个，应该足以走遍天下了！
        - id: ch01-b08
          speaker: narrator
          text: 两人走了一程，遇到一个猎人。猎人单膝跪在地上，枪架在肩头，正全神贯注地瞄准远方。
        - id: ch01-b09
          speaker: master
          text: 猎人，你在瞄什么？
        - id: ch01-b10
          speaker: hunter
          text: 两英里外，有只苍蝇停在橡树枝头。我要打掉它的左眼。
        - id: ch01-b11
          speaker: master
          text: 那就跟我走吧。我们三个联手，走遍天下就容易了。
        - id: ch01-b12
          speaker: narrator
          text: 猎人答应了。他们一起往前走，来到七座风车前。风车叶片转得飞快，周围却没有一丝风，连树叶也纹丝不动。
        - id: ch01-b13
          speaker: master
          text: 一点风也没有，到底是谁让这些风车转个不停？
        - id: ch01-b14
          speaker: narrator
          text: 他们又走了两英里，看见一个人坐在树上。他按住一边鼻孔，正从另一边呼呼地吹气。
        - id: ch01-b15
          speaker: master
          text: 喂，你坐在上面吹什么呢？
        - id: ch01-b16
          speaker: blower
          text: 两英里外不是有七座风车吗？我正给它们吹风，好叫它们转起来。
        - id: ch01-b17
          speaker: master
          text: 你也跟我走吧。我们四个联手，走遍天下就容易了。
        - id: ch01-b18
          speaker: narrator
          text: 吹风人下了树，加入他们。过了一阵，众人又看见一个人单腿站着，另一条腿竟然卸了下来，就放在身旁。
        - id: ch01-b19
          speaker: master
          text: 你这样歇着，可真够舒服的！
        - id: ch01-b20
          speaker: runner
          text: 我是个飞毛腿，卸下一条腿，是怕自己走得太快。两条腿一起跑时，我比飞鸟还快呢。
        - id: ch01-b21
          speaker: master
          text: 跟我走吧。我们五个联手，走遍天下就容易了。
        - id: ch01-b22
          speaker: narrator
          text: 飞毛腿也跟他们走了。没过多久，他们遇见一个戴小帽子的人。那顶帽子歪在一边，耷拉着遮住了他的一只耳朵。
        - id: ch01-b23
          speaker: master
          text: 规矩些，规矩些！别把帽子歪在一只耳朵上。瞧你这副模样，简直像个疯子！
        - id: ch01-b24
          speaker: frost_man
          text: 我可不敢把帽子戴正。只要端端正正地扣好，马上就会降下严霜，连天上的鸟都要冻僵，掉到地上死去。
        - id: ch01-b25
          speaker: master
          text: 那你也跟我走吧。我们六个联手，走遍天下就容易了。
    - id: ch02
      title: 取水赛跑
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 六个人来到一座城里。国王早已颁下告示，不管是谁，只要赛跑赢过公主，就能做她的丈夫。可要是输了，便要掉脑袋。主人一听，马上说自己愿意参赛。
        - id: ch02-b02
          speaker: master
          text: 不过，我要让仆人替我跑。
        - id: ch02-b03
          speaker: king
          text: 那你们两个都得拿脑袋作赌注。你和你仆人的头，都要押给胜者。
        - id: ch02-b04
          speaker: narrator
          text: 条件就这样讲定了。主人给飞毛腿装回另一条腿，叮嘱他一定要赢。比赛的规矩很简单，谁先从远处的小溪里取水回来，谁就获胜。
        - id: ch02-b05
          speaker: master
          text: 现在跑得机灵些，可别让我们输掉！
        - id: ch02-b06
          speaker: narrator
          text: 飞毛腿和公主各拿一只水罐，同时起跑。公主才跑出不远，观众已经看不见飞毛腿了，只听见风从身边呼啸而过。他转眼便赶到小溪，装满水罐，往回跑去。
        - id: ch02-b07
          speaker: narrator
          text: 可他跑到半路，忽然困得睁不开眼。他放下水罐，躺下来睡着了。为了不让自己睡得太舒服，他特意找来地上的一只马头骨当枕头，想着这样能早点醒来。
        - id: ch02-b08
          speaker: narrator
          text: 公主也很会跑，速度和寻常男子一样快。她赶到小溪，灌满一罐水，匆匆往回走。路上，她发现飞毛腿正在熟睡，高兴极了。
        - id: ch02-b09
          speaker: princess
          text: 我的敌手这下可落到我手里了！
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: 她把飞毛腿罐里的水倒得一滴不剩，继续向终点奔去。若不是猎人碰巧站在城堡的塔楼上，用锐利的双眼看清这一切，他们就彻底输了。
        - id: ch02-b11
          speaker: hunter
          text: 公主休想这样算计我们。
        - id: ch02-b12
          speaker: narrator
          text: 猎人装好枪，只开了一枪，便从飞毛腿脑袋底下打飞了马头骨，没有伤到他一丝一毫。飞毛腿惊醒过来，跳起身一看，水罐空了，公主已经远远跑在前面。
        - id: ch02-b13
          speaker: narrator
          text: 他没有泄气，提着空罐奔回小溪，又把水装满。即便多跑了这一趟，他还是比公主早了整整十分钟回到终点。
        - id: ch02-b14
          speaker: runner
          text: 瞧，我刚才不过活动了一下腿脚。那根本算不上赛跑。
        - id: ch02-b15
          speaker: narrator
          text: 国王气坏了，公主更是恼火。她身为公主，竟然要嫁给一个出身平民的退伍士兵。父女俩凑在一起，商量怎样除掉他和他的伙伴。
    - id: ch03
      title: 铁屋里的严霜
      blocks:
        - id: ch03-b01
          speaker: king
          text: 我想到办法了。别害怕，他们一个也别想活着回家。
        - id: ch03-b02
          speaker: narrator
          text: 国王说完，又转向六个人。
        - id: ch03-b03
          speaker: king
          text: 现在你们该一起庆祝了。尽管去吃，尽管去喝，好好快活一番吧。
        - id: ch03-b04
          speaker: narrator
          text: 他把六个人领进一间屋子。那里的地板和房门都是铁铸的，连窗户也装着铁栅栏。屋里摆了一桌美味的食物。
        - id: ch03-b05
          speaker: king
          text: 都进去吧，好好享用这桌佳肴。
        - id: ch03-b06
          speaker: narrator
          text: 六个人刚进去，国王就命人关门上闩。接着，他叫来厨子，要厨子在屋子底下点起大火，一直把铁板烧得通红。厨子照着吩咐做了。
        - id: ch03-b07
          speaker: narrator
          text: 六个人围着桌子吃喝，觉得屋里越来越暖。起初，他们还当这是美酒佳肴带来的热意。可温度越升越高，他们想出去时，才发现门窗都被锁死。这下大家明白了，国王想把他们活活闷死。
        - id: ch03-b08
          speaker: frost_man
          text: 他休想得逞！我来降下一场严霜，叫那团火羞愧得自己熄灭！
        - id: ch03-b09
          speaker: narrator
          text: 歪帽人把帽子端端正正地扣好。严霜立刻降下来，屋里的热气全消失了，盘中的食物也开始结冰。几个钟头以后，国王以为他们已经热死，便叫人开门，亲自进去察看。
        - id: ch03-b10
          speaker: narrator
          text: 房门打开，六个人却全都活得好好的，正站在那里。
        - id: ch03-b11
          speakers: [master, strong_man, hunter, blower]
          ensemble: chorus
          text: 总算能出去暖和暖和了！这屋里冷得连盘中的食物都冻硬啦。
        - id: ch03-b12
          speaker: narrator
          text: 国王怒气冲冲地找来厨子，狠狠骂了一顿，问他为什么不照命令办事。
        - id: ch03-b13
          speaker: cook
          text: 下面的火已经够旺了。陛下不信，就亲自去看看吧。
        - id: ch03-b14
          speaker: narrator
          text: 国王一看，铁屋下面果然烧着一堆熊熊烈火。他只好承认，这个办法伤不了六个人。于是，他又开始琢磨，该怎么赶走这些不受欢迎的客人。他把主人叫到面前，提出用黄金换回女儿。
        - id: ch03-b15
          speaker: king
          text: 只要你肯收下黄金，放弃娶我女儿的权利，想要多少，我就给你多少。
    - id: ch04
      title: 装走国王的财宝
      blocks:
        - id: ch04-b01
          speaker: master
          text: 当然可以，陛下。给我一个仆人能够扛走的黄金，我就不娶您的女儿。
        - id: ch04-b02
          speaker: narrator
          text: 国王听了非常高兴。
        - id: ch04-b03
          speaker: master
          text: 十四天后，我来拿走黄金。
        - id: ch04-b04
          speaker: narrator
          text: 主人随后召来全国所有的裁缝，让他们连续缝了十四天，终于做成一只大得吓人的口袋。到了约定的日子，拔树的大力士把口袋扛在肩上，跟主人一起去见国王。国王望着那个像房子一样大的麻布包，心里一下慌了。
        - id: ch04-b05
          speaker: narrator
          text: 他暗自盘算，这个力大无穷的家伙，得装走多少黄金啊？可话已经说出口，国王只好命人搬来一吨黄金。这些金子足足要十六个最强壮的汉子一起抬。
        - id: ch04-b06
          speaker: narrator
          text: 大力士伸出一只手，轻轻松松抓起那一吨黄金，往口袋里一扔。
        - id: ch04-b07
          speaker: strong_man
          text: 怎么不多拿一点？这点金子连口袋底都盖不住。
        - id: ch04-b08
          speaker: narrator
          text: 国王没有办法，只得一次又一次派人去搬自己的财宝。大力士把送来的金银全都塞进口袋，可装了半天，口袋才只有一半满。
        - id: ch04-b09
          speaker: strong_man
          text: 再拿来！这么几粒碎屑，哪能填满我的口袋？
        - id: ch04-b10
          speaker: narrator
          text: 于是，七千辆大车把全国的黄金运了过来。大力士懒得卸车，干脆把大车连同拉车的牛，全都塞进了口袋。
        - id: ch04-b11
          speaker: strong_man
          text: 我也不挑了。送来什么就收什么，先把这只口袋装满再说。
        - id: ch04-b12
          speaker: narrator
          text: 王国里能拿来的东西都装进去了，口袋还是没有满。
        - id: ch04-b13
          speaker: strong_man
          text: 就到这里吧。口袋没装满，扎起来反倒更省事。
        - id: ch04-b14
          speaker: narrator
          text: 他把那只巨大的口袋往背上一甩，便和伙伴们一起离开了。
    - id: ch05
      title: 骑兵飞上蓝天
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 国王眼看一个人背走了全国的财富，气得暴跳如雷。他立刻命骑兵上马追赶，要他们拦住六个人，把大力士和那袋黄金一起带回来。
        - id: ch05-b02
          speaker: narrator
          text: 两个骑兵团很快追上了六个人，朝他们厉声喊话。
        - id: ch05-b03
          speakers: [cavalryman_1, cavalryman_2, cavalryman_3]
          ensemble: chorus
          text: 你们已经是俘虏了！马上放下这袋黄金，不然就把你们全都砍倒！
        - id: ch05-b04
          speaker: blower
          text: 你们说什么？我们是俘虏？那还早得很呢。还是先请你们到天上跳舞吧！
        - id: ch05-b05
          speaker: narrator
          text: 吹风人按住一个鼻孔，从另一个鼻孔朝两个骑兵团猛吹过去。骑兵们一下子散开了，纷纷飞上蓝天，越过群山。有的被吹向这边，有的被吹向那边。
        - id: ch05-b06
          speaker: narrator
          text: 一名军士长被吹到半空，吓得大声求饶。
        - id: ch05-b07
          speaker: sergeant_major
          text: 饶了我吧！我身上有九处战伤，一直是条勇敢的汉子，不该落到这个地步！
          emotion: fearful
        - id: ch05-b08
          speaker: narrator
          text: 吹风人放过军士长，让他平平安安落回地面，又要他给国王捎一句话。
        - id: ch05-b09
          speaker: blower
          text: 现在回去告诉国王。他要是还敢派骑兵来，我就把他们一个不剩地吹上天。
        - id: ch05-b10
          speaker: narrator
          text: 国王收到口信，终于不敢再追了。
        - id: ch05-b11
          speaker: king
          text: 让那些家伙走吧。他们准是中了魔法。
        - id: ch05-b12
          speaker: narrator
          text: 六个人把财宝带回家，彼此平分。从此以后，他们心满意足地生活，直到生命的最后一天。
