  chapters:
    - id: ch01
      title: The Hawk and the Abyss
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a witch who took the shape of a hawk. Night after night, she flew to a village church and smashed its windows. Three brothers who lived in that village were determined to kill the wicked bird. The two older brothers each stood guard inside the church with a gun, but it did no good. Whenever the hawk appeared overhead, they fell asleep. They woke only when the windows came crashing in.
        - id: ch01-b02
          speaker: narrator
          text: At last it was the youngest brother's turn. He put a heap of thorns under his chin. If he grew drowsy and let his head fall, the sharp points would prick him awake.
        - id: ch01-b03
          speaker: narrator
          text: The moon had risen, and the night was almost as bright as day. Suddenly, a terrible noise sounded above him, and a great heaviness came over his eyes. His eyelids closed. His head sank, and the thorns stabbed his chin so painfully that he woke at once.
        - id: ch01-b04
          speaker: narrator
          text: He saw the hawk diving toward the church. In an instant, he raised his gun and fired. The wounded bird dropped heavily beside a great stone, with its right wing badly hurt. The young man ran over and found that a vast abyss had opened beneath the stone.
        - id: ch01-b05
          speaker: narrator
          text: He hurried to fetch his brothers. Together they brought pinewood and ropes. They tied burning wood to one rope and slowly lowered the light into the depths. At first, the flame showed nothing but dirty gray walls in the darkness.
        - id: ch01-b06
          speaker: narrator
          text: The youngest brother decided to explore the abyss himself. He climbed down the rope until he reached the bottom. There, instead of bare rock, he found a lovely meadow filled with green trees and beautiful flowers.
    - id: ch02
      title: The Castle Below
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: A huge stone castle stood in the middle of the meadow. Its iron gate was wide open, so the young man went inside. Everything there seemed to be made of copper. The only person he found was a lovely girl combing her golden hair. Each strand that fell to the floor rang like pure metal.
        - id: ch02-b02
          speaker: narrator
          text: He looked at her closely. Her skin was smooth and fair, her blue eyes shone brightly, and her hair gleamed like the sun. He loved her the moment he saw her. He knelt at her feet and begged her to marry him.
        - id: ch02-b03
          speaker: narrator
          text: The girl was glad to accept him, but there was something he needed to know.
        - id: ch02-b04
          speaker: golden_haired_girl
          text: Yes, I will marry you gladly. But I cannot go up to your world while my mother, the old witch, is alive. Only the sword hanging in this castle can kill her, and it is so heavy that no one can lift it.
        - id: ch02-b05
          speaker: narrator
          text: The young man went into another room, where everything was made of silver. There he found his bride's sister, another beautiful girl. She was combing her silver hair, and each fallen strand rang against the floor like pure metal.
        - id: ch02-b06
          speaker: narrator
          text: The silver-haired girl gave him the sword. He pulled with all his strength, but he could not raise it.
        - id: ch02-b07
          speaker: narrator
          text: Then a third sister came to him with something to drink.
        - id: ch02-b08
          speaker: third_sister
          text: Take a drop of this. It will give you the strength you need.
        - id: ch02-b09
          speaker: narrator
          text: After one drop, the sword would not move. After a second, it began to shift. Only when he drank the third drop could he lift the sword and swing it over his head.
        - id: ch02-b10
          speaker: narrator
          text: The young man hid in the castle and waited. As evening drew near, the old witch returned. Still in the shape of a hawk, she landed in a large apple tree and shook down several golden apples. Then she dropped to the earth. The moment her feet touched the ground, she changed from a hawk into a woman.
        - id: ch02-b11
          speaker: narrator
          text: This was the chance he had waited for. He swung the mighty sword with all his strength. The witch's head fell, and her blood spurted across the walls.
    - id: ch03
      title: The Brothers' Betrayal
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: With no danger left to fear, the young man packed all the castle's treasures into great chests. Then he signaled his brothers to pull them out of the abyss. The chests went up first, followed by the three lovely sisters. Soon everyone and everything was above ground except the youngest brother.
        - id: ch03-b02
          speaker: narrator
          text: He did not quite trust his brothers. Instead of tying himself to the rope, he fastened a heavy stone to it and let them pull. At first they hauled with all their might. When the stone was halfway up, they suddenly let go. It plunged to the bottom and shattered into a hundred pieces.
        - id: ch03-b03
          speaker: youngest_brother
          text: If I had trusted them, that is what would have happened to my bones.
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: He wept bitterly. It was not the treasure he mourned, but the lovely girl with the swanlike neck and golden hair.
        - id: ch03-b05
          speaker: narrator
          text: For a long time, he wandered sadly through the beautiful world below. One day he met a magician, who asked why he was crying. The young man told him everything that had happened.
        - id: ch03-b06
          speaker: magician
          text: Do not lose heart, young man. Guard my children, who are hidden in the golden apple tree, and I will carry you straight back to the earth. Another magician in this land is always eating my children. I tried hiding them underground and locking them inside the castle, but it was no use. Now they are hidden in the apple tree. Hide there too, and at midnight you will see my enemy.
    - id: ch04
      title: The Golden Apple Tree
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The young man climbed into the tree. He picked some of its beautiful golden apples and ate them for supper.
        - id: ch04-b02
          speaker: narrator
          text: At midnight, the wind began to rise. A rustling came from the foot of the tree. Looking down, the young man saw a long, thick serpent start to climb. It wound around the trunk and crept higher and higher.
        - id: ch04-b03
          speaker: narrator
          text: The serpent pushed its enormous head into the branches. Its eyes glittered fiercely as it searched for the nest where the little children lay. When they saw the hideous creature, the children trembled in terror and hid beneath the leaves.
        - id: ch04-b04
          speaker: narrator
          text: The young man raised the mighty sword. With one blow, he cut off the serpent's head. Then he chopped the body into small pieces and scattered them to the four winds.
        - id: ch04-b05
          speaker: narrator
          text: The children's father was overjoyed that his enemy was dead. He told the young man to climb onto his back, and in that way he carried him up to the world above.
    - id: ch05
      title: Home Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The young man hurried joyfully to his brothers' house. He burst into a room where everyone had gathered, but no one knew him. Only his bride recognized her lover at once. She had been working as a cook for her sisters.
        - id: ch05-b02
          speaker: narrator
          text: His brothers had been certain he was dead. They returned his treasures at once, then fled into the woods in terror.
        - id: ch05-b03
          speaker: narrator
          text: But the good young man forgave everything they had done and shared his treasure with them. Then he built a great castle with golden windows. There he and his golden-haired wife lived happily together for the rest of their lives.
