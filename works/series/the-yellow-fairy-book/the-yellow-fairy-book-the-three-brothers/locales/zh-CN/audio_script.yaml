audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    youngest_brother:
      display_name: 小弟
      tts:
        delivery: 善良勇敢，历经背叛仍不失真诚
        timbre: 清朗年轻
        pace: 适中
        pitch: 中音
    magician:
      display_name: 魔法师
      tts:
        delivery: 恳切庄重，话语里带着忧虑与希望
        timbre: 深厚温和
        pace: 稍缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 教堂里的鹰
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个女巫，每到夜里就变成一只鹰，去撞碎村里教堂的窗户。村里有三兄弟，个个都下定决心，要除掉这只四处作恶的鹰。两个哥哥先后带着枪守在教堂里，却全都失败了。鹰刚在他们头顶高处出现，睡意便把他们压倒了。等惊醒时，只听见窗玻璃哗啦啦摔碎的声音。
        - id: ch01-b02
          speaker: narrator
          text: 轮到小弟守夜，他在下巴底下放了许多尖刺。只要困得一点头，刺就会扎疼他，让他清醒。
        - id: ch01-b03
          speaker: narrator
          text: 月亮升起来了，四下亮得像白天一样。忽然，一阵可怕的声响传来，浓重的睡意也压住了小弟。他闭上眼，脑袋垂到肩头，尖刺一下扎进肉里，疼得他立刻惊醒。
        - id: ch01-b04
          speaker: narrator
          text: 恶鹰正在朝教堂俯冲。小弟一把抄起枪，瞄准它开了一枪。鹰的右翼受了重伤，重重落在一块大石头下面。小弟赶过去察看，竟发现石头下裂开一道深不见底的巨大深渊。
        - id: ch01-b05
          speaker: narrator
          text: 他马上叫来两个哥哥，三人一起拖来许多松木和绳索。他们把燃烧的松木绑在绳端，慢慢放下去。下面起初一片漆黑，火把只照见肮脏的灰石壁。小弟决定亲自探路，沿着绳子下到深渊底部，眼前却出现一片美丽的草地，到处是苍翠的树木和娇艳的花朵。
    - id: ch02
      title: 地下城堡
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 草地中央立着一座巨大的石头城堡，通往城堡的铁门敞得大大的。堡里的一切仿佛都是铜铸的。小弟四处寻找，只见到一位美丽的姑娘。她正梳理金发，每根头发一落地，都会响起纯金属般清脆的声音。
        - id: ch02-b02
          speaker: narrator
          text: 小弟仔细一看，姑娘肌肤白皙光洁，蓝眼睛明亮闪耀，头发像太阳一样金灿灿的。他当即爱上了她，跪在她脚边，恳求她嫁给自己。姑娘欣然答应，却也提醒他，老女巫就是她的母亲。只要母亲还活着，她便永远不能回到地上的世界。
        - id: ch02-b03
          speaker: narrator
          text: 姑娘还告诉他，要杀死女巫，只有一个办法，就是用城堡里悬挂的宝剑。可那把剑重得谁也举不起。小弟走进另一间屋子，那里的一切全是银制的。他看见未婚妻的姐姐正在梳银发。她的每根头发落地时，也会发出纯金属般清脆的声音。
        - id: ch02-b04
          speaker: narrator
          text: 姐姐把宝剑交给他，他使尽浑身力气，剑仍纹丝不动。最后，第三位姐妹走来，送给他一种能增加力气的药水。喝下第一滴，他还是举不起剑。第二滴下肚，宝剑终于动了。等喝到第三滴，他已能把宝剑高高挥过头顶。
        - id: ch02-b05
          speaker: narrator
          text: 小弟藏在城堡里，等着老女巫回来。天色渐暗，她终于飞来了。她先俯冲到一棵大苹果树上，摇下几颗金苹果，又扑向地面。双脚刚沾地，她便从鹰变回了女人。小弟等的正是这一刻。他使出全身力气挥动巨剑，女巫的头顿时滚落下来，鲜血喷溅在墙壁上。
        - id: ch02-b06
          speaker: narrator
          text: 危险消除了。小弟把城堡里所有财宝装进一只只大箱子，发出信号，叫哥哥们用绳索往上拉。他们先拉走财宝，再拉上三位姑娘。等一切都到了地面，只剩小弟还在深渊底下。他对两个哥哥有些怀疑，便没有亲自抓住绳子，而是先绑上一块沉重的石头。
        - id: ch02-b07
          speaker: narrator
          text: 两个哥哥起初拉得很卖力，等石头升到半途，却突然松手。巨石坠回深渊底部，摔成上百块碎片。
        - id: ch02-b08
          speaker: youngest_brother
          text: 原来我若信了他们，现在摔碎的就是我的骨头了。
          emotion: sad
        - id: ch02-b09
          speaker: narrator
          text: 小弟伤心地哭了起来，眼泪怎么也止不住。他并不是舍不得那些财宝，而是想念那位脖颈如天鹅一般优美、长着金色头发的姑娘。
    - id: ch03
      title: 金苹果树上的孩子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他在美丽的地下世界里悲伤地流浪了很久。一天，他遇见一位魔法师。魔法师问他为什么哭，小弟便说出了自己的全部遭遇。
        - id: ch03-b02
          speaker: magician
          text: 年轻人，别再难过了。只要你肯保护藏在金苹果树里的孩子们，我马上送你回到地面。这里还有另一个魔法师，他总要吃掉我的孩子。我把他们藏到地下，锁进城堡，也没有用。现在他们躲在苹果树里。你也藏到树上去，午夜就会看见我的仇敌。
        - id: ch03-b03
          speaker: narrator
          text: 小弟爬上苹果树，摘了几颗漂亮的金苹果当晚餐。午夜时分，风渐渐刮起来，树脚下传来一阵沙沙声。他低头望去，一条又长又粗的大蛇正往上爬。它把身体盘绕在树干上，一圈一圈，越爬越高。
        - id: ch03-b04
          speaker: narrator
          text: 大蛇把巨大的脑袋伸进枝叶，两眼闪着凶光，到处寻找藏着小孩子的巢。孩子们看见这丑恶可怕的怪物，吓得浑身发抖，急忙躲到树叶下面。
        - id: ch03-b05
          speaker: narrator
          text: 小弟举起巨剑，只一剑便砍下蛇头。他又把蛇身斩成小块，撒向四面八方。
        - id: ch03-b06
          speaker: narrator
          text: 孩子们的父亲见仇敌死了，喜悦万分。他让小弟骑上自己的背，就这样把年轻人驮回了地上的世界。
    - id: ch04
      title: 金窗户的城堡
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 回到地面，小弟满心欢喜，飞快奔向哥哥们的家。他一头闯进众人聚集的屋子，可谁也没有认出他。只有那位金发姑娘一眼认出了自己的爱人。她这时正在给两个姐姐当厨娘。
        - id: ch04-b02
          speaker: narrator
          text: 两个哥哥一直深信弟弟早已死去。如今见他活着回来，他们马上交还他的财宝，又吓得逃进森林。善良的小弟却原谅了他们做过的一切，还把自己的财宝分给他们一份。
        - id: ch04-b03
          speaker: narrator
          text: 后来，他建起一座大城堡，每扇窗户都是金的。他和金发妻子住在那里，一生幸福，直到生命的尽头。
