    captive_princess:
      display_name: The Captive Princess
      tts:
        delivery: dignified and tender, with firm resolve beneath her gentleness
        timbre: bright and graceful
        pace: moderate
        pitch: medium-high
    fairy_godmother:
      display_name: The Fairy Godmother
      tts:
        delivery: wise, assured, and kindly direct
