    wizard_king:
      display_name: The Wizard King
      tts:
        delivery: commanding, passionate, and quick to darken with anger
        timbre: rich and mature
        pace: measured
        pitch: medium-low
    prince:
      display_name: The Prince
      tts:
        delivery: earnest, courteous, and quietly courageous
        timbre: clear and youthful
        pace: moderate
