  chapters:
    - id: ch01
      title: The King and His Son
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In very ancient times, there lived a King. His power came not only from his vast dominions, but from the magic secrets he had mastered. He spent much of his early youth seeking pleasure. Then he met a Princess of remarkable beauty, asked her to marry him, and won her hand. He believed himself the happiest man alive.
        - id: ch01-b02
          speaker: narrator
          text: A year later, they had a son. The little Prince was worthy of his distinguished parents, and the whole Court admired him. As soon as the Queen thought he was strong enough to travel, she secretly took him to see her Fairy godmother.
        - id: ch01-b03
          speaker: narrator
          text: The visit had to remain secret. The Fairy had warned the Queen that her husband was a magician, and Fairies and Wizards had been enemies since anyone could remember. The King might not approve of his wife's friendship with a Fairy.
        - id: ch01-b04
          speaker: narrator
          text: The Fairy took the deepest interest in everything that concerned the Queen, and she was delighted with the little Prince. She gave him the power to please everyone from the time he lay in his cradle. She also made it wonderfully easy for him to learn everything that could help him become a perfectly accomplished Prince. His teachers watched in delight as he learned with astonishing speed and constantly surpassed every hope they had for him.
        - id: ch01-b05
          speaker: narrator
          text: Before the Prince was many years older, his mother died. Her last advice was that he must never undertake anything important without first consulting the Fairy who protected him.
        - id: ch01-b06
          speaker: narrator
          text: The Prince grieved deeply, but his sorrow was nothing beside his father's. The King could not be comforted. Time and reason brought him no relief, and every familiar face and object reminded him of the wife he had lost.
        - id: ch01-b07
          speaker: narrator
          text: At last he decided to travel for a change of scene. His magic let him visit each country in a different shape. Every few weeks he returned to the place where he had left a small band of followers, but nothing he saw held his attention for long.
    - id: ch02
      title: The Princess in the Garden
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day the King took the shape of an eagle. He flew across many countries until he reached a lovely new land. The air was sweet with jasmine and orange blossoms, which grew thickly over the ground. He flew lower and saw great gardens filled with rare flowers. Fountains tossed clear water into the air in a hundred shapes.
        - id: ch02-b02
          speaker: narrator
          text: A broad stream wound through the gardens. Richly decorated barges and gondolas floated upon it, carrying elegantly dressed people covered in jewels. In one barge sat the Queen of that country, her ladies, and her only daughter. No mortal had ever been seen who was lovelier than this Princess. She was more beautiful than the Day Star. Even with an eagle's strong sight, the King was nearly dazzled by her.
        - id: ch02-b03
          speaker: narrator
          text: He settled on top of a tall orange tree, where he could watch the Princess as long as he pleased. Now, an eagle with a King's heart in its breast is likely to be bold. The moment he saw her, he decided to carry her away. He felt certain that he could no longer live without her.
        - id: ch02-b04
          speaker: narrator
          text: He waited until she began to step ashore. Before her equerry could offer his hand, the eagle swept down and seized her. The Princess screamed in heartbreak when she found herself in his talons. Her distress touched him, but he would not release her. He flew so swiftly that he could not even speak to comfort her.
        - id: ch02-b05
          speaker: narrator
          text: When he thought they were safely far away, he slowly descended and set her down in a meadow full of flowers. He begged her pardon for taking her by force. Then he told her he meant to carry her to his great kingdom and wanted her to rule there beside him. He added every tender and comforting phrase he could think of.
        - id: ch02-b06
          speaker: narrator
          text: For a while, the Princess could not speak. Then she began to weep. The sight of her tears moved the King.
        - id: ch02-b07
          speaker: wizard_king
          text: Adorable Princess, please dry your tears. All I want is to make you the happiest person in the world.
        - id: ch02-b08
          speaker: captive_princess
          text: If that is true, my lord, then give back the freedom you stole from me. If you will not, I can only see you as my worst enemy.
        - id: ch02-b09
          speaker: narrator
          text: The King answered that her resistance drove him to despair. Still, he hoped to take her somewhere she would be honored by everyone and surrounded by every pleasure. Then he seized her again. Though she cried out, he carried her swiftly toward his capital.
        - id: ch02-b10
          speaker: narrator
          text: Near the city, he gently placed her on a lawn. As he did, a magnificent palace rose before her very feet. Its architecture was imposing. Inside, the rooms were handsome, and everything was furnished in the finest possible taste.
        - id: ch02-b11
          speaker: narrator
          text: The Princess had expected to be alone. Instead, she found many pretty girls eager to serve her, while a brilliantly colored parrot spoke to her in the most charming way.
        - id: ch02-b12
          speaker: narrator
          text: The King had returned to his own form when they reached the palace. He was no longer young, but he might have pleased anyone except this Princess. His violence had filled her with such hatred that she made no effort to hide it. He hoped time would soften her anger and help her grow used to seeing him.
        - id: ch02-b13
          speaker: narrator
          text: He surrounded the palace with a dense cloud, then hurried back to Court, where his long absence had caused great anxiety. The Prince and all the courtiers rejoiced to see their beloved King. Soon, however, they had to endure more of his absences than ever.
        - id: ch02-b14
          speaker: narrator
          text: The King pretended that business kept him shut inside his study. In truth, he spent that time with the Princess, who would not change her mind. He could not understand her refusal. At last he feared that, despite every precaution, she had heard of his son. The Prince was young, handsome, and good, and everyone at Court adored him.
        - id: ch02-b15
          speaker: narrator
          text: The thought made the King horribly uneasy. He decided to remove the cause of his fear by sending the Prince away on his travels with a magnificent company.
    - id: ch03
      title: The Prince's Promise
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After visiting several Courts, the Prince came to the kingdom where the lost Princess was still deeply mourned. Her father and mother received him with great kindness. Their sorrow had silenced the Court's celebrations, but now some of those festivities were revived to honor their royal guest.
        - id: ch03-b02
          speaker: narrator
          text: One day, while visiting the Queen in her own apartments, the Prince noticed an extraordinarily beautiful portrait. He eagerly asked whose face it showed. Through many tears, the Queen told him it was all she had left of her beloved daughter. The Princess had suddenly been carried away, and no one knew how or where she had gone.
        - id: ch03-b03
          speaker: narrator
          text: The story moved the Prince deeply. He vowed to search the whole world and never rest until he had found the Princess and returned her to her mother's arms.
        - id: ch03-b04
          speaker: princess_mother
          text: If you succeed, you will have my gratitude forever. My daughter shall be your wife, and all the estates I own shall be yours as well.
        - id: ch03-b05
          speaker: narrator
          text: The Prince cared far more about the thought of winning the Princess than about her mother's estates. After taking leave of the King and Queen, he began his search. The Queen gave him a miniature portrait of her daughter, the same one she usually wore herself.
        - id: ch03-b06
          speaker: narrator
          text: His first act was to seek the Fairy who had protected him since childhood. He told her the whole adventure and begged for all the help her wisdom and magic could give him.
        - id: ch03-b07
          speaker: narrator
          text: The Fairy listened carefully, then asked for time to consult her books. When she had considered the matter, she told him the Princess was not far away. Yet entering her enchanted palace would be far too difficult. The Prince's own father had hidden it inside a thick cloud.
        - id: ch03-b08
          speaker: fairy_godmother
          text: The only plan I can see is to get hold of the Princess's parrot. That may be possible, because the bird often flies some distance around the palace.
        - id: ch03-b09
          speaker: narrator
          text: The Fairy went out to look for it. Before long, she returned with the parrot in her hand and quickly shut it in a cage. Then she touched the Prince with her wand and changed him into a parrot exactly like it. Once she had told him how to find the Princess, he set out.
    - id: ch04
      title: The Parrot's Secret
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Prince reached the hidden palace safely. But the Princess was even more beautiful than he had expected, and at first the sight of her left him unable to speak. She became anxious. Her parrot was her greatest comfort, and she feared it had fallen ill. She lifted him into her hand and gently caressed him.
        - id: ch04-b02
          speaker: narrator
          text: Her kindness reassured the Prince and helped him play his part. He began saying one charming thing after another, and the Princess was delighted.
        - id: ch04-b03
          speaker: narrator
          text: Soon the King appeared. The parrot watched closely and was glad to see how plainly the Princess disliked him. Once the King had gone, she withdrew to her dressing-room, and the parrot flew after her. There he heard her lament the King's endless persecution. The King had kept pressing her to agree to marry him, and she remained miserable under his demands.
        - id: ch04-b04
          speaker: narrator
          text: The parrot comforted her with such tender and clever words that she began to wonder whether this could truly be her own bird. When the Prince saw that she was ready to listen, he spoke.
        - id: ch04-b05
          speaker: prince
          text: Madam, I must trust you with a very important secret. Please don't be frightened by what I am about to tell you. The Queen your mother sent me here to set you free. To prove it, look at this portrait. She gave it to me herself.
        - id: ch04-b06
          speaker: narrator
          text: He drew the miniature from beneath his wing. The Princess was astonished. Yet after all she had seen and heard, hope was impossible to resist. She recognized the little portrait of herself that her mother always wore.
        - id: ch04-b07
          speaker: narrator
          text: The parrot told her who he really was and why he had set out to find her. He explained what her mother had promised if he brought her safely home. He also told her how the Fairy had already helped him enter the hidden palace. The Fairy had assured him that she would provide a way to carry the Princess back to her mother's arms.
        - id: ch04-b08
          speaker: narrator
          text: When he saw how closely she listened, he begged permission to return to his true shape. The Princess gave no answer. So he pulled one feather from his wing, and at once a Prince of surpassing beauty stood before her. Looking at him, she could not help hoping that so charming a person might truly win her freedom.
    - id: ch05
      title: The Flight Through the Air
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Meanwhile, the Fairy had prepared a chariot and harnessed two powerful eagles to it. She placed the cage and the true parrot inside, then ordered the bird to guide the chariot to the Princess's dressing-room window.
        - id: ch05-b02
          speaker: narrator
          text: Within minutes, the chariot arrived. The Princess stepped inside with the Prince and was delighted to find her own parrot waiting there.
        - id: ch05-b03
          speaker: narrator
          text: As the chariot rose into the air, the Princess noticed a figure riding on an eagle just ahead of them. The sight alarmed her a little, but the Prince quickly reassured her.
        - id: ch05-b04
          speaker: prince
          text: Don't be afraid. That is the good Fairy to whom you owe so much. She is leading us safely back to your mother.
        - id: ch05-b05
          speaker: narrator
          text: That same morning, the King woke suddenly from a troubled sleep. He had dreamed that someone was carrying the Princess away from him. He changed himself into an eagle and flew straight to the hidden palace.
        - id: ch05-b06
          speaker: narrator
          text: When he found her gone, he flew into a terrible rage. He hurried home and consulted his magic books. Through them, he discovered that his own son had taken away the treasure he valued so greatly.
        - id: ch05-b07
          speaker: narrator
          text: At once, the King changed into a harpy. Rage filled him, and he meant to devour his son and even the Princess if he could catch them. He rushed after them at full speed.
        - id: ch05-b08
          speaker: narrator
          text: But he had begun too late. The Fairy also raised a strong wind behind the young couple, and it held back anyone who tried to pursue them.
    - id: ch06
      title: The Wedding and the Wizard's Defeat
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Imagine the joy of the Queen when she saw the daughter she had given up for lost standing before her again. She welcomed the kindly Prince who had found and rescued the Princess with equal delight. The Fairy entered beside them, but even in that joyful moment, she brought a grave warning.
        - id: ch06-b02
          speaker: fairy_godmother
          text: The Wizard King will be here very soon, and his loss has driven him into a fury. His rage and magic will destroy the Prince and Princess unless they are already married when he arrives.
        - id: ch06-b03
          speaker: narrator
          text: The Queen hurried to tell her husband. There was no delay. The Prince and Princess were married on the spot.
        - id: ch06-b04
          speaker: narrator
          text: Just as the ceremony ended, the Wizard King arrived. Finding himself too late threw him into such despair and confusion that he appeared in his natural form. He tried to sprinkle a black liquid over the bride and bridegroom, intending to kill them.
        - id: ch06-b05
          speaker: narrator
          text: The Fairy stretched out her wand. The black liquid fell back upon the Magician himself, and he dropped senseless to the ground. The Princess's father was deeply offended by this cruel attempt at revenge. He ordered the Wizard King to be carried away and locked in prison.
        - id: ch06-b06
          speaker: narrator
          text: A magician loses all his power as soon as he is imprisoned. The Wizard King now found himself helpless and entirely at the mercy of the people he had so badly wronged.
        - id: ch06-b07
          speaker: narrator
          text: The Prince pleaded for his father and obtained a pardon. The prison doors were opened.
        - id: ch06-b08
          speaker: narrator
          text: The moment he was free, the Wizard King appeared in the air as a strange and unknown bird. He cried out as he flew away.
        - id: ch06-b09
          speaker: wizard_king
          text: I will never forgive my son or the Fairy for the cruel wrong they have done me!
          emotion: angry
        - id: ch06-b10
          speaker: narrator
          text: Everyone begged the Fairy to make her home in their kingdom, and she agreed. She built herself a magnificent palace and brought all her books and fairy secrets there. From then on, she had the joy of watching the perfect happiness she had helped bring to the entire royal family.
