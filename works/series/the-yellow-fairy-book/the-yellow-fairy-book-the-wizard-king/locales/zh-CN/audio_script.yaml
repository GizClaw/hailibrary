audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    wizard_king:
      display_name: 魔法国王
      tts:
        delivery: 威严而多情，欲望受阻时迅速转为阴沉暴怒
        timbre: 浑厚成熟
        pace: 适中
        pitch: 中低音
    prince:
      display_name: 王子
      tts:
        delivery: 真诚有礼，温柔中带着勇气与坚定
        timbre: 年轻清亮
        pace: 适中
        pitch: 中音
    captive_princess:
      display_name: 公主
      tts:
        delivery: 高贵温柔，面对强迫时坚定不屈
        timbre: 明亮柔美
        pace: 适中
        pitch: 中高音
    fairy_godmother:
      display_name: 仙女教母
      tts:
        delivery: 睿智笃定，慈爱而干脆
        timbre: 清澈成熟
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 国王与王子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，有一位国王。他统治着辽阔的疆土，还掌握着许多魔法秘诀。年轻时，他一心享乐。后来遇见一位美貌非凡的公主，立刻向她求婚。公主答应了，他便觉得自己是世上最幸福的人。
        - id: ch01-b02
          speaker: narrator
          text: 一年后，他们生下一个儿子。小王子样样都配得上这对出众的父母，宫里人人都喜欢他。等孩子长得足够结实，王后便悄悄带他去拜访自己的仙女教母。
        - id: ch01-b03
          speaker: narrator
          text: 这趟拜访必须瞒着国王。仙女早就提醒过王后，她的丈夫是魔法师。仙女和魔法师自古结怨，他未必肯让妻子来见仙女。
        - id: ch01-b04
          speaker: narrator
          text: 仙女教母十分关心王后，也很喜欢小王子。她赐给孩子一种天赋，让他从小就能赢得所有人的喜爱。她还让他学什么都格外轻松。凡是成为优秀王子所需的本领，他都学得飞快，总是超出众人的期望，老师们别提多高兴了。
        - id: ch01-b05
          speaker: narrator
          text: 可王子还没有长大，母亲就去世了，这给他带来极深的悲痛。王后临终时留下最后的嘱咐，以后凡是遇到大事，他一定要先去请教那位受母亲托付、一直保护他的仙女。
        - id: ch01-b06
          speaker: narrator
          text: 王子非常伤心，父王的悲痛却比他更深。国王失去了深爱的妻子，谁也安慰不了他。时间和劝解都没有用，身边熟悉的人和东西只会一次次勾起回忆。
        - id: ch01-b07
          speaker: narrator
          text: 国王只好出外游历，盼着换换地方能排解愁苦。他在一处地方留下几名随从，自己凭魔法变成不同的模样，走过一个又一个国家，每隔几星期才回来一次。可他一路寻寻觅觅，不论看见什么，都没有一样能真正留住他的心。
    - id: ch02
      title: 花园里的公主
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 有一天，国王变成一只鹰，飞越许多国家，来到一片陌生而美丽的土地。茉莉和橙花的香气飘满空中。他循着花香飞低一些，看见几座大花园，里面开着珍奇的花朵，清亮的喷泉变幻出上百种姿态。
        - id: ch02-b02
          speaker: narrator
          text: 一条宽阔的河流穿过花园，装饰华美的游船和贡多拉漂在水面。船上的人衣着考究，满身珠宝。其中一艘船上，坐着这个国家的王后、她唯一的女儿和随行女官。那位公主比启明星还美，世间从未有人见过这样动人的女子，几乎连鹰的锐眼也会被她耀花。
        - id: ch02-b03
          speaker: narrator
          text: 国王停在一棵高大的橙树顶上，从那里既能看清四周的景色，也能尽情凝望公主。要知道，鹰的胸膛里若装着一颗国王的心，胆子往往大得很。他一见公主就认定，没有她，自己再也活不下去，于是当场决定把她抢走。
        - id: ch02-b04
          speaker: narrator
          text: 公主正要上岸，侍从官还没来得及伸手搀扶，那只鹰便猛冲下来，将她抓上天空。公主发现自己落进鹰爪，发出令人心碎的尖叫。国王虽被她的恐惧打动，却不肯放开她。他飞得太快，连安慰的话也无法开口。
        - id: ch02-b05
          speaker: narrator
          text: 飞到足够远的地方，国王才缓缓落下，把公主放在开满鲜花的草地上。他求公主原谅自己的粗暴，说要带她去一个强大的王国，请她与自己共同为王，又说尽温柔的话来安慰她。
        - id: ch02-b06
          speaker: narrator
          text: 公主久久说不出话，回过神来便泪如雨下。国王见了，深受触动。
        - id: ch02-b07
          speaker: wizard_king
          text: 可敬可爱的公主，求你别哭了。我只想让你成为世上最幸福的人。
        - id: ch02-b08
          speaker: captive_princess
          text: 陛下，如果你说的是真话，就把夺走的自由还给我。否则，我只能把你当作我最凶恶的敌人。
        - id: ch02-b09
          speaker: narrator
          text: 国王说，她的抗拒令他绝望。不过，他仍想带她去一个人人敬重她、种种欢乐环绕着她的地方。说完，他不顾公主哭喊，再次把她抓上天空，径直飞向自己的都城。
        - id: ch02-b10
          speaker: narrator
          text: 到了都城附近，他把公主轻轻放在草坪上。就在她双脚落地时，一座富丽堂皇的宫殿从眼前拔地而起。宫殿外面气势宏伟，里面一间间屋子都十分漂亮，家具和陈设也无不精美雅致。
        - id: ch02-b11
          speaker: narrator
          text: 公主原以为自己会孤零零地留在这里，没想到许多漂亮姑娘围在身边，个个都想殷勤服侍她，还有一只羽毛鲜艳的鹦鹉，专拣世上最好听的话说给她听。这多少给了她一点安慰。
        - id: ch02-b12
          speaker: narrator
          text: 国王已经恢复了本来面目。他虽不年轻，换作别人或许会喜欢他，可他的暴行早让公主恨透了他。公主毫不掩饰这份厌恶。国王仍盼着时间能消解她的怒气，让她习惯自己。
        - id: ch02-b13
          speaker: narrator
          text: 国王怕人发现这座宫殿，特意用浓云把它团团围住，随后匆匆赶回自己的宫廷，因为他离开太久，那里的人已经十分担心。王子和朝臣见敬爱的国王归来，都很欢喜。只是从那以后，国王离开的次数更多了。他总说要进书房处理政务，其实是去陪伴那位始终不肯屈服的公主。
    - id: ch03
      title: 王子的誓言
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 国王不明白公主为什么如此坚决，竟怀疑她听说过自己儿子的迷人风采。王子年轻俊美，心地仁慈，宫里人人都爱戴他。国王越想越不安，索性给王子配上一支华丽的随行队伍，打发他出外游历。
        - id: ch03-b02
          speaker: narrator
          text: 王子走访了好几个国家的宫廷，后来到了一个仍在深深哀悼失踪公主的王国。这里的欢庆早因公主失踪而停下了。国王和王后亲切地接待王子，又重新举行了一些庆典，向这位远道而来的客人表示敬意。
        - id: ch03-b03
          speaker: narrator
          text: 一天，王子到王后的内殿拜访，被一幅美丽绝伦的画像深深吸引，急忙询问画中人是谁。王后流着泪说，这是爱女留给她的唯一慰藉。公主忽然被人掳走，她至今不知道女儿身在何处，也不知道她是怎样消失的。
        - id: ch03-b04
          speaker: narrator
          text: 王子听完深受感动，当场立下誓言。他要走遍天下寻找公主，只要还没找到她、还没把她送回母亲怀中，自己就一天也不肯休息。王后向他保证，若真能救回女儿，她会永远感激他的恩情，还会把公主嫁给他，把自己名下的全部领地一并送上。
        - id: ch03-b05
          speaker: narrator
          text: 王子真正向往的是公主，王后许诺的领地远远没有她动人。他辞别国王和王后，带着王后平日佩戴在身上的女儿小像，踏上了寻找公主的旅途。他做的第一件事，就是去找母亲当年托付的仙女，请她在这件大事上用法术和智慧帮助自己。
        - id: ch03-b06
          speaker: narrator
          text: 仙女仔细听完事情的来龙去脉，请王子等一等，让她查阅魔法书。经过一番推究，她发现公主离得不远，可宫殿被王子的父王用浓云围住，王子想闯进去实在太难。她能想出的唯一办法，是先捉住公主的鹦鹉。那只鸟常飞到宫殿周围较远的地方，这事并非没有希望。
        - id: ch03-b07
          speaker: narrator
          text: 仙女出门寻找，不久果然把鹦鹉捧了回来。她将它关进笼子，又用魔杖一点，把王子变成了一只一模一样的鹦鹉，随后告诉他该怎样飞到公主身边。
        - id: ch03-b08
          speaker: narrator
          text: 王子平安进入宫殿，却被公主远胜想象的美貌迷住，好一阵子说不出话。公主见这只平日最能安慰自己的鹦鹉忽然不出声，又惊讶又担心，以为它生病了，便把它捧在手中轻轻爱抚。王子这才安下心来，也有了勇气演好鹦鹉的角色。他说出数不清的悦耳话语，把公主哄得十分开心。
        - id: ch03-b09
          speaker: narrator
          text: 国王很快来了。王子看出公主有多么厌恶他，心中暗喜。国王一走，公主便回到梳妆室，鹦鹉也跟了进去。它听见公主悲叹国王不断纠缠，逼她同意婚事，便用聪明又温柔的话安慰她。公主听着听着，开始怀疑这到底是不是原来的鹦鹉。
        - id: ch03-b10
          speaker: narrator
          text: 王子看出她已经愿意信任自己，这才开了口。
        - id: ch03-b11
          speaker: prince
          text: 殿下，我有一个非常重要的秘密要告诉你。接下来不管听见什么，都请别害怕。我受你母后之托来救你。你若想要凭证，请看这幅她亲手交给我的小像。
        - id: ch03-b12
          speaker: narrator
          text: 他从翅膀底下取出小像。公主惊讶万分，却一眼认出画的是自己，而且这幅画像从前一直佩在母亲身上。亲眼见过、亲耳听过这一切，她心里终于升起了希望。
        - id: ch03-b13
          speaker: narrator
          text: 见公主并没有太过害怕，王子又把一切说得明明白白。他告诉她，自己究竟是谁，她的母后许下了什么，以及仙女到现在为止怎样帮助了他。那位仙女还亲口答应，一定会想出办法，把公主送回母亲怀中。
        - id: ch03-b14
          speaker: narrator
          text: 公主一直专心听着。王子便请求她准许自己恢复原形。公主没有说话，他于是从翅膀上拔下一根羽毛。一位俊美无双的王子立刻出现在眼前。看着这样迷人的人，公主怎能不盼望他会为自己带来自由？
    - id: ch04
      title: 飞越浓云
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 与此同时，仙女已经备好一辆马车，把两只强健的鹰套在车前。她把装着真鹦鹉的笼子放上车，让那只鸟引着马车飞到公主梳妆室的窗前。
        - id: ch04-b02
          speaker: narrator
          text: 几分钟后，马车就到了。公主和王子一同登上车，又见到了自己的鹦鹉，心里十分欢喜。马车升上天空时，公主看见前方有一个身影骑在鹰背上，不禁有些害怕。
        - id: ch04-b03
          speaker: prince
          text: 别怕，那是帮助我们的善良仙女。她正领着我们走，会一路护送你平安回到母亲身边。
        - id: ch04-b04
          speaker: narrator
          text: 就在那天早晨，国王从一个纷乱不安的梦中惊醒。他梦见公主被人夺走，立刻变成鹰，飞往那座宫殿。公主果然不见了。他怒不可遏，赶回家翻查魔法书，才知道夺走这件珍宝的竟是自己的儿子。
        - id: ch04-b05
          speaker: narrator
          text: 国王马上化作鸟身女妖，满腔怒火地追了出去。他决心，只要追得上，就吞掉儿子，甚至连公主也不放过。他使出全部速度，可惜出发得太迟。仙女又在那对年轻人身后刮起一阵强风，专门阻挡任何追赶他们的人。国王逆风前进，只能被越拖越远。
        - id: ch04-b06
          speaker: narrator
          text: 王后早已以为再也见不到女儿，如今不但爱女归来，还带回了救她脱险的可爱王子。那份狂喜，想必不用多说。仙女跟着他们进了宫，随即发出警告。
        - id: ch04-b07
          speaker: fairy_godmother
          text: 魔法国王很快就会追到这里。他失去了公主，一定怒火冲天。王子和公主若还没有正式成婚，谁也挡不住他的魔法，保不住他们的性命。
        - id: ch04-b08
          speaker: narrator
          text: 王后急忙去告诉丈夫，婚礼当场就举行了。
    - id: ch05
      title: 魔法落回自身
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 仪式刚刚完成，魔法国王就赶到了。他因来迟一步而绝望，连头脑也乱了，竟以本来面目现身。他拿出黑色液体，想洒在新郎和新娘身上，把他们杀死。
        - id: ch05-b02
          speaker: narrator
          text: 仙女及时伸出魔杖一挡，那些原本要取人性命的黑色液体全落在了魔法师自己身上。他当场倒地，失去了知觉。公主的父王见他竟敢对新婚夫妇进行这样残忍的报复，深感冒犯，便命人把他抬走，牢牢锁进监牢。
        - id: ch05-b03
          speaker: narrator
          text: 魔法师只要进了监牢，所有法力就会消失。国王落到自己曾经伤害过的人手中，顿时窘迫万分。王子替父亲恳求宽恕，终于求得赦免，牢门随即打开。
        - id: ch05-b04
          speaker: narrator
          text: 门一开，人们就看见魔法国王化作一只谁也不认识的鸟，飞上了天空。
        - id: ch05-b05
          speaker: wizard_king
          text: 我的儿子和那个仙女这样残酷地伤害我，我永远也不会原谅他们！
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: 他一边高喊，一边远远飞走了。众人恳求仙女留在这个王国，她答应下来，为自己建起一座壮丽的宫殿，又把魔法书和仙术秘诀都搬了进去。从此，她亲眼看着整个王室在自己的帮助下得到圆满的幸福，心中也十分快乐。
