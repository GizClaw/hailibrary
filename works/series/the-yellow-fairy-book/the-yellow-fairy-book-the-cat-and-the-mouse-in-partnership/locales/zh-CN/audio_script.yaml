audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切诙谐，带着一本正经的调侃
        timbre: 温暖清朗
        pace: 从容而富有变化
        pitch: 中音
    cat:
      display_name: 猫
      tts:
        delivery: 圆滑从容，谎话说得理直气壮
        timbre: 柔滑而略显低沉
        pace: 舒缓
        pitch: 中低音
    mouse:
      display_name: 老鼠
      tts:
        delivery: 真诚温和，疑惑时直率认真
        timbre: 轻细清亮
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 合伙过日子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一只猫结识了一只老鼠。猫天天说自己有多爱老鼠，又有多看重这份友情，终于说动老鼠跟她住进同一所房子，两人合伙过起日子来。
        - id: ch01-b02
          speaker: cat
          text: 咱们得给冬天预备点吃的，不然到时候准会挨饿。小老鼠，你又不能到处乱跑，万一撞进捕鼠夹，那可就糟了。
        - id: ch01-b03
          speaker: narrator
          text: 老鼠觉得这番劝告很有道理。她们便买来一小罐油脂，留着冬天吃。可是，该把它藏到哪儿呢？两个人左想右想，商量了半天，猫终于想出了一个地方。
        - id: ch01-b04
          speaker: cat
          text: 我看，放在教堂最稳妥。谁会跑到那里拿它呢？咱们藏在角落里，等真的缺吃的了再动。
        - id: ch01-b05
          speaker: narrator
          text: 她们照商量好的办法，把小罐子稳稳当当地藏进教堂。可没过多久，猫便馋得心里发痒，怎么也忘不了那罐油脂。
        - id: ch01-b06
          speaker: cat
          text: 小老鼠，我正要告诉你，我表亲生了个小儿子，白身子上有棕色斑点。她请我去做教母。今天让我出去一趟吧，你一个人在家好好看门。
        - id: ch01-b07
          speaker: mouse
          text: 好呀，你尽管去。吃到什么好东西，可要想起我。我真想尝一小滴洗礼宴上的红葡萄酒。
    - id: ch02
      title: 三次教母
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可这些话全是假的。猫没有表亲，也没人请她做教母。她直奔教堂，悄悄溜到油脂罐边，把最上面一层舔得干干净净。然后，她在城里的屋顶上闲逛，看够了景色，又摊开身子晒太阳。每次想起那罐油脂，她都要舔舔嘴唇。天黑以后，猫才回家。
        - id: ch02-b02
          speaker: mouse
          text: 啊，你回来啦！今天一定过得很快活吧？
        - id: ch02-b03
          speaker: cat
          text: 挺顺当的。
        - id: ch02-b04
          speaker: mouse
          text: 那孩子叫什么名字？
        - id: ch02-b05
          speaker: cat
          text: 舔掉一层。
        - id: ch02-b06
          speaker: mouse
          text: “舔掉一层”？这名字可真稀奇，又真古怪。你们家的人都这样取名吗？
          emotion: surprised
        - id: ch02-b07
          speaker: cat
          text: 有什么可怪的？总比你教子那个“偷面包”的名字强吧。
        - id: ch02-b08
          speaker: narrator
          text: 没过多久，猫又馋起来了。
        - id: ch02-b09
          speaker: cat
          text: 还得请你再帮我看一天家。又有人请我做教母了。那个孩子脖子上有一圈白毛，我实在没法推辞。
        - id: ch02-b10
          speaker: narrator
          text: 好心的老鼠又答应了。猫却偷偷从城墙底下溜过去，直奔教堂，一口气吃掉了半罐油脂。
        - id: ch02-b11
          speaker: cat
          text: 还是一个人独享的东西最香。
          emotion: happy
        - id: ch02-b12
          speaker: narrator
          text: 猫对这一天干的事满意极了。等到晚上，她才心满意足地回家。老鼠一见她进门，便问起孩子的名字。
        - id: ch02-b13
          speaker: mouse
          text: 这次的孩子叫什么呀？
        - id: ch02-b14
          speaker: cat
          text: 吃掉一半。
        - id: ch02-b15
          speaker: mouse
          text: “吃掉一半”？哪有这样的名字！我这辈子从没听过，日历上也一定找不到。
          emotion: surprised
    - id: ch03
      title: 一干二净
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 又过了不久，猫想起舔油脂的滋味，嘴里再次淌起口水来。
        - id: ch03-b02
          speaker: cat
          text: 好事总要来三回。我又得去做教母了。这孩子浑身漆黑，四只爪子却雪白，身上连一根白毛都没有。两年才碰得上一次这样的事，你会让我去吧？
        - id: ch03-b03
          speaker: mouse
          text: 舔掉一层，吃掉一半……这些名字怎么一个比一个古怪？我越想越不明白。
        - id: ch03-b04
          speaker: cat
          text: 你整天穿着深灰外套，拖着长尾巴坐在家里，当然会胡思乱想。谁叫你白天从不出门呢？
        - id: ch03-b05
          speaker: narrator
          text: 猫走后，老鼠在家忙着清扫。她把屋子从里到外收拾得整整齐齐。贪嘴的猫却守着油脂罐，把里面的东西吃得一点不剩。
        - id: ch03-b06
          speaker: cat
          text: 东西全没了，心也就安了。
          emotion: happy
        - id: ch03-b07
          speaker: narrator
          text: 到了晚上，猫油光水滑、心满意足地回了家。老鼠马上问第三个孩子叫什么。
        - id: ch03-b08
          speaker: cat
          text: 这个名字你听了也不会喜欢。他叫“一干二净”。
        - id: ch03-b09
          speaker: mouse
          text: “一干二净”？这个名字肯定也没印在任何地方。一干二净……到底是什么意思呢？
        - id: ch03-b10
          speaker: narrator
          text: 老鼠摇摇头，蜷起身子睡着了。从那以后，再也没人来请猫做教母。
    - id: ch04
      title: 冬天的油脂罐
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 冬天终于来了，外面再也找不到吃的。老鼠想起了她们储藏的那罐油脂。
        - id: ch04-b02
          speaker: mouse
          text: 走吧，猫，咱们去拿存下的油脂。现在吃起来一定特别香。
        - id: ch04-b03
          speaker: cat
          text: 可不是吗。你吃起来一定很香，就跟把细舌头伸到窗外一样香。
        - id: ch04-b04
          speaker: narrator
          text: 她们一同动身，来到教堂存放油脂的地方。罐子还好端端地摆在原处，里面却已经空空如也。
        - id: ch04-b05
          speaker: mouse
          text: 啊，我现在全明白了！事情全露馅了！你可真是我的好朋友！每次说去做教母，你都在偷吃我们的油脂。先是舔掉一层，再是吃掉一半，然后——
          emotion: surprised
        - id: ch04-b06
          speaker: cat
          text: 住嘴！你再多说一个字，我就把你吃掉！
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 可怜的老鼠已经把“一干二净”送到了舌尖。她的话刚出口，猫就纵身扑过去，一把抓住她，吞进肚里。
        - id: ch04-b08
          speaker: narrator
          text: 你看，世道就是这样。
