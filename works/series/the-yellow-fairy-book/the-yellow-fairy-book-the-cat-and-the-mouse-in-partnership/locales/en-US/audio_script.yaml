audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, clear, and quietly cautionary
        timbre: gentle and resonant
        pace: measured
        pitch: medium
    cat:
      display_name: Cat
      tts:
        delivery: smooth and self-assured, turning sharp when challenged
        timbre: silky and mature
        pace: relaxed
        pitch: medium-low
    mouse:
      display_name: Mouse
      tts:
        delivery: sincere, trusting, and plainly spoken
        timbre: light and clear
        pace: moderately quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: A Pot for Winter
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A cat became acquainted with a mouse. She spoke so much about her love and friendship that the mouse finally agreed to share a house with her and divide the housekeeping.
        - id: ch01-b02
          speaker: cat
          text: We must put some food aside for winter. If we do not, we will go hungry. And you, little Mouse, cannot safely go everywhere. Sooner or later, you might run into a trap.
        - id: ch01-b03
          speaker: narrator
          text: The mouse took this advice, and together they bought a little pot of fat. But where could they keep it? They talked for a long time before the cat found an answer.
        - id: ch01-b04
          speaker: cat
          text: The church is the safest place I know. No one will think of taking it from there. We can hide it in a corner and leave it untouched until we truly need it.
        - id: ch01-b05
          speaker: narrator
          text: They hid the little pot safely in the church. Before long, the cat began to crave the fat. She thought about it until she could resist no longer. Then she told the mouse a story.
        - id: ch01-b06
          speaker: cat
          text: Little Mouse, I meant to tell you something. My cousin has a baby son, white with brown spots, and she has asked me to be his godmother. Let me go out today, and you can look after the house by yourself.
        - id: ch01-b07
          speaker: mouse
          text: Of course you should go. And if they give you anything delicious, remember me. I would dearly love just one drop of the red christening wine.
    - id: ch02
      title: Top Off
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Not one word of the cat's tale was true. She had no cousin, and no one had asked her to be a godmother. She went straight to the church, crept over to the little pot, and began to lick. She kept at it until the whole top layer of fat was gone.
        - id: ch02-b02
          speaker: narrator
          text: Afterward, she wandered over the town roofs and looked at the view. She stretched out in the sun and licked her lips whenever she remembered the little pot. At evening, she went home.
        - id: ch02-b03
          speaker: mouse
          text: Ah, there you are! You must have had a lovely day.
        - id: ch02-b04
          speaker: cat
          text: Yes, everything went very well.
        - id: ch02-b05
          speaker: mouse
          text: And what name did they give the child?
        - id: ch02-b06
          speaker: cat
          text: Top Off.
        - id: ch02-b07
          speaker: narrator
          text: The cat gave the answer without the least warmth.
        - id: ch02-b08
          speaker: mouse
          text: Top Off? What an extraordinary name! I have never heard one like it. Does that name run in your family?
          emotion: surprised
        - id: ch02-b09
          speaker: cat
          text: Why should it sound strange? It is no worse than Bread Thief, the name of your own godchild.
    - id: ch03
      title: Half Gone
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: It was not long before the cat felt that same powerful craving. Once again, she prepared an excuse for the mouse.
        - id: ch03-b02
          speaker: cat
          text: I must ask you to be kind and mind the house alone again. I have been invited to serve as godmother a second time. This baby has a white ring around his neck, so I simply cannot refuse.
        - id: ch03-b03
          speaker: narrator
          text: The kind mouse agreed. The cat slipped beneath the town wall and made her way to the church. This time, she ate until half the fat in the pot was gone.
        - id: ch03-b04
          speaker: cat
          text: Nothing tastes better than something you eat all by yourself.
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: She was delighted with her day's work. When she came home, the mouse had a question.
        - id: ch03-b06
          speaker: mouse
          text: What did they call this child?
        - id: ch03-b07
          speaker: cat
          text: Half Gone.
        - id: ch03-b08
          speaker: mouse
          text: Half Gone? What a name! I have never heard such a thing in all my life. I do not believe that name appears anywhere in the calendar.
          emotion: surprised
    - id: ch04
      title: Clean Gone
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Soon the cat's mouth watered again at the thought of licking the fat. For a third time, she spoke to the mouse.
        - id: ch04-b02
          speaker: cat
          text: Good things always come in threes. I have to be godmother once more. This baby is completely black, with bright white paws and not one white hair anywhere else on his body. A thing like that happens only once in two years, so you will let me go, won't you?
        - id: ch04-b03
          speaker: mouse
          text: Top Off. Half Gone. Those names are so peculiar. I cannot stop wondering about them.
        - id: ch04-b04
          speaker: cat
          text: You stay home all day in your dark gray coat, with that long tail of yours, until your mind fills up with foolish ideas. That is what comes of never going out in daylight.
        - id: ch04-b05
          speaker: narrator
          text: While the cat was away, the mouse gave the house a proper cleaning and left everything neat. The greedy cat, meanwhile, ate every last bit of fat in the pot.
        - id: ch04-b06
          speaker: cat
          text: Once it is all gone, I can stop worrying about it.
        - id: ch04-b07
          speaker: narrator
          text: That night, she came home sleek and satisfied. At once, the mouse asked what the third child had been named.
        - id: ch04-b08
          speaker: cat
          text: You will not like this name any better. They called him Clean Gone.
        - id: ch04-b09
          speaker: mouse
          text: Clean Gone? I do not believe that name has ever been printed, any more than the others have. Clean Gone. What could it possibly mean?
          emotion: surprised
        - id: ch04-b10
          speaker: narrator
          text: The mouse shook her head. Then she curled herself up and went to sleep.
    - id: ch05
      title: The Empty Pot
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: No one asked the cat to be a godmother again. Then winter came, and there was no food outdoors. The mouse remembered what they had stored away.
        - id: ch05-b02
          speaker: mouse
          text: Come on, Cat. Let us go and fetch our pot of fat. We saved it for a time like this, and it will taste wonderful now.
        - id: ch05-b03
          speaker: cat
          text: Oh, yes. It will taste every bit as good as if you stuck your thin tongue out through the window.
        - id: ch05-b04
          speaker: narrator
          text: They set off together. When they reached the church, the pot was still in its hiding place. But it was completely empty.
        - id: ch05-b05
          speaker: mouse
          text: Ah, now I understand what happened! Now it has all come out. Some friend you are! You ate everything while you claimed to be a godmother. First the top came off. Then half was gone. Then—
          emotion: angry
        - id: ch05-b06
          speaker: cat
          text: Be quiet! Say one more word, and I will eat you up!
          emotion: angry
        - id: ch05-b07
          speaker: narrator
          text: The words “Clean Gone” were already on the poor mouse's tongue. The moment she said them, the cat sprang at her, caught her, and swallowed her.
        - id: ch05-b08
          speaker: narrator
          text: And that, you see, is the way of the world.
