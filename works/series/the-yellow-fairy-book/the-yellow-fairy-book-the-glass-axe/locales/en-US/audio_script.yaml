audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, clear, and quietly cautionary
        timbre: gentle and resonant
        pace: measured
        pitch: medium
    queen:
      display_name: The Queen
      tts:
        delivery: tender, grave, and urgent
        timbre: soft and fading
        pace: slow
        pitch: medium-high
    fairy:
      display_name: The Wicked Fairy
      tts:
        delivery: harsh, commanding, and quick to fury
        timbre: sharp and aged
        pace: deliberate
        pitch: medium-low
    prince:
      display_name: The Prince
      tts:
        delivery: earnest, courageous, and openhearted
        timbre: clear and youthful
        pace: moderate
        pitch: medium
    black_girl:
      display_name: The Black Girl
      tts:
        delivery: warm, resourceful, and quietly brave
        timbre: clear and youthful
        pace: moderate
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Queen's Warning
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a King and Queen who had everything they could wish for, except a child. After twelve years, the Queen finally gave birth to a son. Her happiness lasted only a day, for she knew she was dying. Before the end, she called her husband close and gave him one warning.
        - id: ch01-b02
          speaker: queen
          text: Never let our child's feet touch the ground. The moment they do, a wicked Fairy will take him into her power and cause him great harm.
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: Those were the poor Queen's last words. The boy grew strong and tall. When his nurse could no longer carry him, he rode through the palace gardens in a little wheeled chair. At other times, servants carried him on a litter. Someone always watched to make sure his feet never touched the earth.
        - id: ch01-b04
          speaker: narrator
          text: But living this way was bad for his health. The doctors ordered him to exercise on horseback, and he soon became an excellent rider. He went on long excursions with the King's stud-groom and a great company of attendants. Every day they rode through the neighboring fields and woods, and every evening he came safely home.
        - id: ch01-b05
          speaker: narrator
          text: Many years passed in this way, and the Prince became a man. Almost everyone had forgotten the Queen's warning by then. The old precautions were still observed, but more from long habit and custom than from any thought of danger.
        - id: ch01-b06
          speaker: narrator
          text: One day, the Prince and his attendants rode into a wood where the King sometimes hunted. Their path crossed a stream with thick brush along its banks. As the horses entered the water, a hare sprang from the grass and ran for the thicket. The Prince raced after it and nearly caught it. Then his saddle girth snapped, and he fell hard.
        - id: ch01-b07
          speaker: narrator
          text: The instant his foot touched the earth, he vanished before the horrified courtiers. They searched everywhere, but found no trace of him. At last they knew the wicked Fairy had taken him, just as the Queen had warned.
        - id: ch01-b08
          speaker: narrator
          text: The old King was overcome with grief when the courtiers brought him the news. He knew the Fairy's power had fulfilled the Queen's dying warning, but he had no way to free his son from that fate. He spent his old age alone and sorrowful. Still, he held to one hope. Perhaps some fortunate chance would one day rescue the Prince from his enemy.
    - id: ch02
      title: The Glass Axe
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: As soon as the Prince touched the ground, an unseen force seized him violently and swept him away. He had no idea where it was taking him. When he could see again, a strange new world stretched before him, utterly unlike the one he had left. The Fairy lived in a magnificent castle surrounded by a vast lake, and a bridge of clouds was the only path to it. High mountains rose beyond the water. Dark woods ran along the banks, while heavy mist hung over everything and a deep silence covered the whole domain.
        - id: ch02-b02
          speaker: narrator
          text: When they reached her domain, the Fairy showed herself. She warned the Prince that he must obey every command exactly or face a terrible punishment. Then she handed him an axe made of glass.
        - id: ch02-b03
          speaker: fairy
          text: Cross the cloud bridge and go into the wood. Cut down every tree before sunset. And if you meet a black girl there, do not speak to her.
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: The Prince listened meekly until the Fairy had finished. Then he accepted the glass axe and set off for the forest. His feet seemed to sink into the clouds at every step, but fear gave speed to them. He crossed the lake safely and began his work at once.
        - id: ch02-b05
          speaker: narrator
          text: At his very first blow, the glass axe struck the tree and shattered into a thousand pieces. The poor Prince was so terrified that he did not know what to do. He was in mortal fear of the punishment the wicked old Fairy would inflict. With no idea where he was going, he wandered back and forth through the wood. At last, weariness and misery overcame him. He sank to the ground and fell fast asleep.
        - id: ch02-b06
          speaker: narrator
          text: A sudden sound woke him. Beside him stood a black girl. Remembering the Fairy's warning, he did not dare speak. The girl greeted him kindly and asked whether the wicked Fairy held him in her power. He answered with a silent nod.
        - id: ch02-b07
          speaker: black_girl
          text: She holds me too. I must wander in this form until a young man takes pity on me and carries me safely across that distant river. Beyond it, my captor's power ends.
        - id: ch02-b08
          speaker: narrator
          text: The girl explained that the distant river marked the end of the Fairy's domain and power. Her words gave the Prince such confidence that he told her his whole sorrowful story. Then he asked for her advice. How could he escape punishment when the Fairy discovered that the trees still stood and her axe lay broken?
        - id: ch02-b09
          speaker: black_girl
          text: The Fairy who rules us both is my own mother. You must never reveal that secret, or it will cost me my life. Promise that you will try to free me, and I will help you complete every task she gives you.
        - id: ch02-b10
          speaker: narrator
          text: The Prince gladly promised to do all she asked and to try to set her free. The girl warned him once more that he must never betray her secret. Then she handed him a drink, and before long his senses sank into a deep sleep.
        - id: ch02-b11
          speaker: narrator
          text: When he awoke, the glass axe lay beside him, whole again. Every tree in the wood had been cut down. Amazed, he hurried over the cloud bridge and reported that the work was done.
        - id: ch02-b12
          speaker: narrator
          text: The Fairy could hardly believe it. When she saw the unbroken axe, she demanded to know whether he had seen or spoken to the black girl.
        - id: ch02-b13
          speaker: prince
          text: I never once looked up from my work. I saw no one, and I spoke to no one.
        - id: ch02-b14
          speaker: narrator
          text: The Prince swore that he had never looked away from his work. Unable to draw anything else from him, the Fairy gave him only a little bread and water. Then she showed him a small, dark cupboard and told him he could sleep there.
        - id: ch02-b15
          speaker: narrator
          text: At first light, she woke him and handed him the glass axe again.
        - id: ch02-b16
          speaker: fairy
          text: Go back and chop every fallen tree into firewood. Tie all the wood into bundles. And remember, if you meet the black girl, you must not go near her or say one word.
        - id: ch02-b17
          speaker: narrator
          text: The task was no easier than the first, but the Prince set out with a lighter heart. This time he knew he could count on the black girl's help. He crossed the cloud bridge with a quicker step. Hardly had he reached the other side when his friend appeared, greeted him cheerfully, and asked what the Fairy demanded now. When she heard the new command, she smiled.
        - id: ch02-b18
          speaker: black_girl
          text: You need not be afraid.
        - id: ch02-b19
          speaker: narrator
          text: She gave him another drink, and once more he fell into a deep sleep. When he awoke, every tree had been chopped into firewood and neatly tied into bundles.
        - id: ch02-b20
          speaker: narrator
          text: He returned to the castle as quickly as he could and told the Fairy that her command had been obeyed. She was even more astonished than before. Again she asked whether he had seen or spoken to the black girl. The Prince knew better than to break his word, so once more he firmly denied it.
    - id: ch03
      title: The Golden Castle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On the third day, the Fairy gave the Prince a task harder than either of the others.
        - id: ch03-b02
          speaker: fairy
          text: Build a castle on the far side of the lake using nothing but gold, silver, and precious stones. Finish it within one hour, or a dreadful fate awaits you.
        - id: ch03-b03
          speaker: narrator
          text: The Prince heard this without fear, for he trusted his black friend completely. Full of hope, he hurried across the bridge. On the far side, he knew at once where the castle must stand. Spades, hammers, axes, and every other kind of building tool lay scattered across the ground, ready for a worker's hand. Yet he could see no gold, silver, or precious stones anywhere.
        - id: ch03-b04
          speaker: narrator
          text: Before he had time to lose heart, the black girl beckoned from behind a rock. She had hidden there so her mother would not see her. The Prince ran to her joyfully and asked for her help with the new task.
        - id: ch03-b05
          speaker: narrator
          text: This time, the Fairy had watched every movement from her window. She saw the Prince hide behind the rock with her daughter. Her piercing scream echoed through the mountains. The frightened pair scarcely dared to look out from their shelter. Then the enraged Fairy came racing over the cloud bridge, with her dress and hair flying in the wind.
        - id: ch03-b06
          speaker: narrator
          text: The Prince believed they were lost, but the girl told him to take courage and follow her as fast as he could. Before leaving their shelter, she broke a small piece from the rock, spoke magic words over it, and threw it toward her mother.
        - id: ch03-b07
          speaker: narrator
          text: At once, a glittering palace rose before the Fairy's eyes. Its dazzling splendor blinded her, and she stumbled among its many doors and passages. For a long while, she could not find her way out.
        - id: ch03-b08
          speaker: narrator
          text: Meanwhile, the girl hurried onward with the Prince close behind. They raced for the river, knowing that once they reached the other bank, they would be beyond the wicked Fairy's power forever. But they had not covered even half the distance when they heard her again. The rustle of her clothes and her muttered curses came closer and closer behind them.
        - id: ch03-b09
          speaker: narrator
          text: The Prince was terrified. He could not look back, and his strength was failing. Before he could give up hope, the girl spoke more magic words. In an instant, she became a pond, and the Prince became a duck swimming on its surface.
        - id: ch03-b10
          speaker: narrator
          text: When the Fairy saw the pond and duck, her fury had no limit. She tried every piece of magic she knew to make the pond disappear. At last she raised a hill of sand beneath her feet, meaning to dry up all the water at once. Instead, the sand only drove the pond a little farther away, and its waters seemed to increase rather than shrink.
        - id: ch03-b11
          speaker: narrator
          text: When she saw how little her magic could do, the Fairy turned to trickery. She threw a great many golden nuts into the pond, hoping they would tempt the duck close enough to catch. But the little creature refused to be caught, and every attempt failed.
        - id: ch03-b12
          speaker: narrator
          text: Then a new plan came to the wicked old Fairy. She went back to the rock that had sheltered the fugitives and hid herself behind it. From there, she watched carefully for the moment when the Prince and her daughter would take their natural forms and continue their journey.
    - id: ch04
      title: The Church in the Dark Wood
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Fairy did not have to wait long. As soon as the girl believed her mother was safely out of the way, she restored the Prince and herself to their human shapes. Then they set off cheerfully for the river, never knowing that the Fairy was watching from her hiding place.
        - id: ch04-b02
          speaker: narrator
          text: They had taken only a few steps when the Fairy rushed after them with a drawn dagger. She was nearly upon them. Then, instead of her daughter and the Prince, she found a great stone church. A huge monk guarded its entrance.
        - id: ch04-b03
          speaker: narrator
          text: Breathless with rage, the Fairy drove her dagger at the monk's heart. The blade shattered at his feet. Desperate to destroy them both, she decided to pull down the whole church.
        - id: ch04-b04
          speaker: narrator
          text: Three times she stamped upon the ground. The earth trembled beneath her, and both the church and the monk began to shake. The Fairy saw that her spell was working. Certain the building would fall, she moved some distance away so the stones would not crush her too.
        - id: ch04-b05
          speaker: narrator
          text: But she had gone scarcely a yard when the church and monk vanished. Around her stood a wood as black as night, filled with wolves, bears, and wild beasts of every kind.
        - id: ch04-b06
          speaker: narrator
          text: At once, her rage turned to terror. Every wolf, bear, and wild creature seemed to defy her power, and she feared that at any moment they would tear her to pieces. She decided it was wiser to find her way out of the forest as best she could. After that, she would pursue the fugitives again and destroy them by force or cunning.
        - id: ch04-b07
          speaker: narrator
          text: Meanwhile, the Prince and the girl had returned to their natural forms. They hurried onward as fast as they could, desperate to reach the river before the Fairy escaped. At last they came to the bank, only to find no possible way across. Worse still, the girl's magic seemed to have lost all its power.
        - id: ch04-b08
          speaker: black_girl
          text: The time for my deliverance has not come yet. But you promised to do everything you could to free me, so now you must follow my command exactly. Take this bow and these arrows. Kill every beast you see, and do not spare a single living creature.
        - id: ch04-b09
          speaker: narrator
          text: With those words, she disappeared. She had barely vanished when a huge wild boar burst from the nearby thicket and charged straight at the Prince. The young man did not lose his presence of mind. He drew the bow at once and sent an arrow straight through the beast's skull.
        - id: ch04-b10
          speaker: narrator
          text: The boar fell heavily. From its side sprang a little hare, racing like the wind along the riverbank. The Prince shot again, and the hare dropped dead at his feet.
        - id: ch04-b11
          speaker: narrator
          text: At that same moment, a dove rose into the air and circled his head in the most trusting way. The Prince remembered the girl's command. He did not dare spare even this gentle little creature. He took another arrow from his quiver and brought down the dove, just as he had brought down the boar and hare.
        - id: ch04-b12
          speaker: narrator
          text: When he went to examine the bird, there was no dove on the ground. In its place lay a round white egg.
    - id: ch05
      title: Beyond the River
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As the Prince stared at the egg and wondered what it meant, he heard wings beating overhead. He looked up and saw a huge vulture swooping toward him with its claws spread wide.
        - id: ch05-b02
          speaker: narrator
          text: He snatched up the egg and threw it at the bird with all his strength. The ugly monster vanished. In its place stood the most beautiful girl the astonished Prince had ever seen.
        - id: ch05-b03
          speaker: narrator
          text: While all this was happening, the wicked Fairy finally found her way out of the dark wood. Now she called upon the last resource in her power to overtake her daughter and the Prince. As soon as she reached open ground, she climbed into her chariot. A fiery dragon drew it up into the air and carried her toward the river.
        - id: ch05-b04
          speaker: narrator
          text: Just as the Fairy reached the river, she saw the two lovers in each other's arms. They were swimming through the water as easily as two fish. In her fury, she forgot every danger. Quick as lightning, she drove the dragon and chariot down upon them.
        - id: ch05-b05
          speaker: narrator
          text: But the river seized her chariot and pulled it down into the deepest water. The waves swept the wicked Fairy away and carried her downstream. At last, thorn bushes caught her, and there she became a good meal for all the little fish swimming around.
        - id: ch05-b06
          speaker: narrator
          text: So at last, the Prince and his lovely bride were entirely free forever from the wicked Fairy's power. They made their way home as quickly as they could. The old King, who had waited in sorrow and loneliness for so many years, welcomed them with joy and gladness.
        - id: ch05-b07
          speaker: narrator
          text: The very next day, a magnificent wedding feast was held. And as far as anyone knows, the Prince and his bride lived happily ever after.
