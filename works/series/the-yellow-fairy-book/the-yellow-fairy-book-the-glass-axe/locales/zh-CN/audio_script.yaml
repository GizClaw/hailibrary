audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容，带着古老童话的神秘与幽默
        timbre: 温暖清朗
        pace: 舒缓而富有变化
        pitch: 中音
    queen:
      display_name: 王后
      tts:
        delivery: 温柔而郑重，临终告诫中透着急切
        timbre: 轻柔微弱
        pace: 缓慢
        pitch: 中高音
    fairy:
      display_name: 邪恶仙女
      tts:
        delivery: 冷酷专横，发怒时尖利逼人
        timbre: 苍老锐利
        pace: 稍慢而有压迫感
        pitch: 中低音
    prince:
      display_name: 王子
      tts:
        delivery: 真诚勇敢，年轻而坦率
        timbre: 清朗年轻
        pace: 适中
        pitch: 中音
    black_girl:
      display_name: 黑姑娘
      tts:
        delivery: 温和机敏，危急中依然勇敢镇定
        timbre: 清澈年轻
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 王后的警告
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位国王和一位王后。他们想要的东西几乎样样都有，只盼着能有一个孩子。十二年以后，王后终于生下一个儿子。可这份喜悦才过了一天，她就走到了生命尽头。
        - id: ch01-b02
          speaker: narrator
          text: 临终前，王后把丈夫叫到身边，留下最后一句告诫。
        - id: ch01-b03
          speaker: queen
          text: 无论如何，也别让孩子的双脚碰到地面。他只要一落地，就会落进一个邪恶仙女手里。她一定会狠狠折磨他。
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: 王后说完便去世了。小王子一天天长大，身体也越来越结实。等他重得乳母抱不动时，人们给他造了一把带小轮子的椅子。没有旁人帮忙，他也可以坐着在王宫花园里来往。其他时候，他便乘着肩舆出门。无论到哪里，总有人小心照看、严密守护，生怕哪一天他的脚会碰到地面。
        - id: ch01-b05
          speaker: narrator
          text: 可这样的日子有损健康，医生便叫他骑马锻炼。王子很快成了出色的骑手，常由父王的马厩总管带着大队随从，陪他骑马远游。他日日穿过附近的田野和树林，傍晚总能平安回来。
        - id: ch01-b06
          speaker: narrator
          text: 年复一年，王子长大成人。几乎没人还记得王后临终前的警告。虽然大家仍旧不让他的双脚落地，处处小心防备，可这样做多半只是照着多年的旧习惯，并不是谁还真把那句预言放在心上。
        - id: ch01-b07
          speaker: narrator
          text: 一天，王子带着随从来到父王打猎的树林。他们正要渡过一条灌木丛生的小河，一只野兔被马蹄声惊起，朝密林飞奔。王子立刻纵马去追。眼看快追上了，马鞍的肚带突然断开，他重重摔了下去。
        - id: ch01-b08
          speaker: narrator
          text: 王子的脚一碰到地面，整个人就在惊恐的群臣眼前消失了。众人四处奔走，把远近全找遍了，仍不见他的踪影。这时他们才不得不承认，王后临终前的警告已经应验，邪恶仙女的魔力真的抓走了王子。老国王听到噩耗，悲痛得无可奈何。他只能在哀伤和孤独中慢慢老去，同时守着一线希望，盼儿子有一天能碰上好运，逃出仇敌的手掌。
    - id: ch02
      title: 云桥与玻璃斧
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 王子刚落地，就被一股看不见的力量猛然抓住。他不知道自己正被带往哪里，等眼前重新清楚时，一个完全陌生的世界铺展开来，和故乡没有半点相似。那里有一座大湖，仙女华丽的城堡被湖水围在中央。通往城堡的只有一座云朵织成的桥。湖对岸群山高耸，黑森林沿岸伸展，浓雾笼罩着所有景物，到处静得听不见一点声音。
        - id: ch02-b02
          speaker: narrator
          text: 仙女回到自己的领地，这才在王子面前现身。
        - id: ch02-b03
          speaker: fairy
          text: 我的每一道命令，你连最小的地方也得照办。敢有一点违抗，我就重重罚你。拿着这把玻璃斧，走过云桥，把对岸树林里的树全砍倒。太阳落山前必须做完。你多半会遇见一个黑姑娘，不许走近她，更不许跟她说话！
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: 王子顺从地拿起斧头。走在云桥上，每一步都像要陷进云里，可心里的恐惧催着他飞快向前。他平安到了树林，马上举斧砍树。第一斧才落下，玻璃斧就撞成了上千块碎片。
        - id: ch02-b05
          speaker: narrator
          text: 王子想到邪恶的老仙女会怎样惩罚自己，吓得完全没了主意。他在树林里来回乱走，既不知道该做什么，也不知道自己要去哪里。最后，疲劳和痛苦一起压垮了他。他倒在地上，很快睡得不省人事。不知过了多久，一阵突如其来的响动把他惊醒。他睁眼一看，身边正站着一个黑姑娘。
        - id: ch02-b06
          speaker: narrator
          text: 王子记着仙女的警告，不敢开口。姑娘却亲切地向他问好。
        - id: ch02-b07
          speaker: black_girl
          text: 你是不是也落在那个邪恶仙女手里了？
        - id: ch02-b08
          speaker: narrator
          text: 王子默默点了点头。
        - id: ch02-b09
          speaker: black_girl
          text: 我也受她控制。她罚我一直用现在这副模样四处游荡，除非有个年轻人愿意可怜我，把我平安带到远处那条河的对岸。过了河，她的领地和魔力就管不到我们了。
        - id: ch02-b10
          speaker: narrator
          text: 王子听她这样说，便信任了她。他讲完自己的遭遇，又说树一棵也没砍，斧头却碎了，请姑娘告诉他，该怎样躲过仙女的惩罚。
        - id: ch02-b11
          speaker: black_girl
          text: 那个抓住我们俩的仙女，其实是我的亲生母亲。这个秘密千万不能泄露，不然我会没命。你只要答应设法救我，我就站在你这一边。母亲交给你的差事，我都会替你完成。
        - id: ch02-b12
          speaker: narrator
          text: 王子满心欢喜，把姑娘提出的要求全答应下来。姑娘又郑重提醒他，一定不能辜负自己的信任，更不能让母亲知道这个秘密。接着，她递给王子一剂饮料。他才喝下去没多久，知觉就渐渐模糊，很快便沉入酣睡。
        - id: ch02-b13
          speaker: narrator
          text: 醒来一看，玻璃斧完好地躺在身边，整片树林的树都已倒下。王子急忙回到城堡，告诉仙女差事做完了。仙女看见完整的斧头，又听说树全砍倒，怎么也不信这是他独自做的。
        - id: ch02-b14
          speaker: fairy
          text: 你见过那个黑姑娘吗？你跟她说话没有？
        - id: ch02-b15
          speaker: prince
          text: 我一刻也没有停手，连头都没抬过，更没有见过她。
        - id: ch02-b16
          speaker: narrator
          text: 王子勇敢地说了谎，还发誓自己干活时一刻也不曾抬头。仙女一遍遍盘问，却始终问不出破绽。她只给王子一点面包和水，又领他来到一间狭小阴暗的储物室，告诉他，夜里只能睡在这里。
    - id: ch03
      title: 三桩差事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 天刚发亮，仙女便叫醒王子，又把玻璃斧塞给他。
        - id: ch03-b02
          speaker: fairy
          text: 把昨天砍倒的木头全劈成柴，再一捆一捆扎好。要是碰见黑姑娘，不许靠近，也不许开口！
        - id: ch03-b03
          speaker: narrator
          text: 这桩差事一点也不轻松，可王子知道黑姑娘会帮忙，脚步比头一天轻快得多。他刚过云桥，姑娘就笑着来迎接他。听完仙女的要求，她只说了一句。
        - id: ch03-b04
          speaker: black_girl
          text: 别害怕，我来帮你。
          emotion: calm
        - id: ch03-b05
          speaker: narrator
          text: 她递来另一剂饮料，王子喝过便睡熟了。再次醒来时，所有砍倒的树木都已经劈成柴，整整齐齐扎成一捆一捆，随时可以取去烧火。王子尽快赶回城堡，告诉仙女她的命令已经办妥。仙女比上次更加惊讶，又追问他到底见没见过黑姑娘，有没有同她说话。王子知道自己绝不能背弃诺言，便再次大胆说谎，没有吐露半点真相。
        - id: ch03-b06
          speaker: narrator
          text: 第三天，仙女交给他的差事更加可怕。
        - id: ch03-b07
          speaker: fairy
          text: 到湖对岸去，用金子、银子和宝石造一座城堡。整座城堡不能掺进别的东西。一个钟头之内造不完，等着你的就是最可怕的下场。
        - id: ch03-b08
          speaker: narrator
          text: 王子听完并不忧虑，因为他已经全心相信那位朋友一定会来帮助自己。他满怀希望，匆匆赶过云桥，一眼便认出造城堡的地方。铲子、锤子、斧头和各种营造工具散了一地，仿佛随时等着工匠拿起来开工，可是遍地都看不见金子、银子和宝石的影子。
        - id: ch03-b09
          speaker: narrator
          text: 王子还没来得及灰心，就看见黑姑娘躲在远处的岩石后面，正向他招手。她怕被母亲发现，不敢露面。王子欢喜地跑过去，请她帮忙想办法。
        - id: ch03-b10
          speaker: narrator
          text: 可这一回，仙女一直守在窗口监视。她亲眼看见王子和女儿藏到岩石后面，尖叫声震得群山回响。两人还不敢探出头，仙女已经怒气冲冲地越过云桥，头发和衣裙全在风里飞舞。
        - id: ch03-b11
          speaker: narrator
          text: 王子以为自己必死无疑，姑娘却叫他鼓起勇气，快快跟上。逃走以前，她从岩石上掰下一块，念过咒语，朝母亲扔去。一座金光耀眼的宫殿立刻升起，刺得仙女睁不开眼。宫殿里的门和过道又多又乱，把她困在里面，一时找不到出口。
    - id: ch04
      title: 仙女的追赶
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 黑姑娘带着王子一路飞奔，急着赶到远处那条河。只要到了对岸，两人便能永远逃出邪恶仙女的领地和魔力。可路还没走到一半，他们又听见衣裙的窸窣声，还有压低的咒骂声。仙女已经紧紧追到身后。
        - id: ch04-b02
          speaker: narrator
          text: 王子吓得不敢回头，身上的力气也快用尽。姑娘立刻念起咒语。她变成一方池塘，王子变成一只鸭子，浮在池水上。
        - id: ch04-b03
          speaker: narrator
          text: 仙女气得发狂，使尽魔法想让池塘消失。她从脚下变出一座沙丘，打算立刻把池水吸干。谁知沙丘只把池塘推远了一点，水非但没有减少，反而像是越来越多。老仙女眼看自己的法术起不了作用，只好改用诡计。她往池中撒下许多金核桃，想把鸭子诱过来。可小鸭无论如何也不肯让她捉住，她费尽心思仍是一场空。
        - id: ch04-b04
          speaker: narrator
          text: 老仙女又想出一条诡计。她藏到先前那块岩石后面，等女儿和王子恢复人形。姑娘以为母亲已经走远，果然让两人变回原样，高高兴兴地继续赶路。
        - id: ch04-b05
          speaker: narrator
          text: 他们才走几步，仙女就握着出鞘的匕首追了上来。眼看刀尖逼近，王子和姑娘忽然不见了。仙女面前只剩一座巨大的石头教堂，门口站着一个身材魁梧的修士。
        - id: ch04-b06
          speaker: narrator
          text: 仙女被怒火逼得气喘吁吁，一刀刺向修士的心口。匕首却碰也伤不到他，只掉在她脚边，摔得粉碎。绝望之下，她决定干脆推倒整座教堂，把两个猎物永远埋在下面。她朝地面重重跺了三脚，大地立刻颤抖起来，教堂和守门的修士也跟着摇晃。
        - id: ch04-b07
          speaker: narrator
          text: 仙女看见教堂已经摇晃起来，怕倒塌时砸伤自己，赶忙退到稍远的地方。可她还没走出一码，教堂和修士便一同消失。她这才发现，四周已经变成黑夜一般的树林，里面挤满了狼、熊和各种各样的猛兽。
        - id: ch04-b08
          speaker: narrator
          text: 仙女的怒火一下变成恐惧。野兽全都不怕她的魔法，随时可能把她撕碎。她只得先设法走出森林，再去追赶两人，盘算着无论用蛮力还是诡计，都要毁掉他们。
    - id: ch05
      title: 河边的解救
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 王子和黑姑娘早已恢复人形，拼命朝河边赶。可真的到了河岸，他们才发现没有办法渡河，姑娘的魔法似乎也失效了。
        - id: ch05-b02
          speaker: black_girl
          text: 解救我的时刻还没到。你答应过会尽力救我，现在一定要听我的。拿着这副弓箭，把你看见的野兽全都杀死。无论是什么活物，一个也不能放过。
        - id: ch05-b03
          speaker: narrator
          text: 说完，姑娘便消失了。附近的灌木丛立刻冲出一头大野猪，直奔王子而来。王子没有慌张，张弓一箭射穿它的头颅。野猪重重倒地，一只小野兔却从它身旁蹿出，沿着河岸飞跑。
        - id: ch05-b04
          speaker: narrator
          text: 王子再次拉开弓，野兔便死在脚边。就在同一刻，一只鸽子从那里飞上天空，十分亲昵地绕着王子的头打转，仿佛全心信任着他。可王子牢牢记着姑娘的命令，不敢因为怜惜而放过这个小生灵。他从箭囊里取出另一支箭，也把鸽子射落在地，让它像野猪和野兔一样死去。
        - id: ch05-b05
          speaker: narrator
          text: 可等他上前察看，地上没有鸽子的尸体，只有一枚圆圆的白蛋。他正盯着蛋猜想其中的含义，头顶忽然响起扫动翅膀的声音。一只巨大的兀鹫张开利爪，朝他俯冲下来。
        - id: ch05-b06
          speaker: narrator
          text: 王子一把抓起白蛋，使出全身力气朝大鸟掷去。说来也奇，那只张着利爪的丑陋怪物顿时消失了。惊呆的王子再定睛一看，站在自己眼前的，竟是他一生见过的最美丽的姑娘。
        - id: ch05-b07
          speaker: narrator
          text: 这时，邪恶的老仙女终于走出了森林。她使出最后一招，登上由喷火巨龙拖曳的战车，飞上天空追赶女儿和王子。等她赶到河边，只见两个相爱的人抱在一起，像两条鱼那样轻松地游过河水。
        - id: ch05-b08
          speaker: narrator
          text: 仙女什么危险也顾不得了，快如闪电地扑向他们。河水却一把攫住战车，拖进最深的水底。波浪又卷着老仙女一路冲下去，最后把她挂在荆棘丛里，让水中的小鱼饱餐了一顿。
        - id: ch05-b09
          speaker: narrator
          text: 王子和美丽的新娘终于得到自由。他们尽快赶回老国王身边，国王欢欢喜喜地迎接了两人。第二天，一场无比盛大的婚宴举行了。就我们所知，从此以后，王子和新娘永远过着幸福的生活。
