audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉静从容，带着古老童话的机智与克制, timbre: 温暖清朗, pace: 舒缓而富有变化, pitch: 中音}
    sigurd:
      display_name: 西格德
      tts: {delivery: 坦率坚定，年轻时爽朗，成为国王后沉稳果断, timbre: 坚实清朗, pace: 适中, pitch: 中低音}
    old_king:
      display_name: 老国王
      tts: {delivery: 慈爱庄重，带着年迈君王的从容, timbre: 苍老浑厚, pace: 舒缓, pitch: 低音}
    father_in_law:
      display_name: 公主的父王
      tts: {delivery: 温和郑重，说话诚恳而不失威严, timbre: 成熟厚实, pace: 适中, pitch: 中低音}
    real_queen:
      display_name: 真王后
      tts: {delivery: 温柔坚韧，受困时悲伤却不失尊严, timbre: 柔和清澈, pace: 适中, pitch: 中高音}
    witch:
      display_name: 石舟女巫
      tts: {delivery: 狡诈凶狠，冒充王后时傲慢暴躁, timbre: 干涩阴沉, pace: 稍慢, pitch: 中低音}
    nurse:
      display_name: 乳母
      tts: {delivery: 善良谨慎，对孩子温柔，遇到怪事时紧张克制, timbre: 温润年轻, pace: 适中, pitch: 中高音}
  chapters:
    - id: ch01
      title: 归国的航程
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位国王和一位王后。他们的儿子名叫西格德，长得英俊，又强壮又灵活。后来，国王老得弯下了腰。他不知道自己还能活多久，只盼着临终前能看见儿子成婚。
        - id: ch01-b02
          speaker: old_king
          text: 西格德，你该去找一位与你相称的姑娘了。有个国家的国王生着一位美丽的女儿，你若能娶到她，再合适不过。
        - id: ch01-b03
          speaker: narrator
          text: 西格德愿意听从父亲的安排。他与父亲告别，收拾行装，照着指点来到了那个国家，请求迎娶公主。那里的国王欣然答应，却提出了一个条件。
        - id: ch01-b04
          speaker: father_in_law
          text: 我的身体不大好，已经难以治理这个国家。你得尽可能久地留在这里，帮助我。
        - id: ch01-b05
          speaker: sigurd
          text: 我答应。不过，将来听到父亲去世的消息，请准许我回到自己的国家。
        - id: ch01-b06
          speaker: narrator
          text: 西格德和公主成了婚。他帮助岳父治理国家，夫妻二人感情很深。一年后，他们有了一个儿子。孩子两岁时，西格德的父亲去世了。于是，他带着妻儿登船，从海路返回故乡。
        - id: ch01-b07
          speaker: narrator
          text: 船航行了几天。离家只剩一天路程时，风突然停了，海面死一般寂静。那天，船上的人大多睡着了。西格德和王后带着小王子坐在甲板上说话。后来西格德困得睁不开眼，便独自下舱休息，留下王后陪孩子玩。
        - id: ch01-b08
          speaker: narrator
          text: 过了很久，王后看见海上有个黑影，正一点点靠近。起初，她只能看见船里有个人影在划桨。等它贴到大船边上，她才看清，那竟是一条石船。一个丑陋得可怕的女巫从船里爬上甲板。
        - id: ch01-b09
          speaker: narrator
          text: 王后怕得无法形容。她说不出话，也挪不动脚，根本无法叫醒西格德和水手。女巫径直走到她跟前，夺走孩子，把他放在甲板上。接着，女巫剥下王后的华服，一件件穿到自己身上，模样也随之变得像个凡人。最后，她把王后塞进石船。
        - id: ch01-b10
          speaker: witch
          text: 我给你下了咒。不许放慢半分，直到你抵达冥界，见到我的兄弟。
        - id: ch01-b11
          speaker: narrator
          text: 王后惊得失了神，一动也不能动。石船立刻载着她飞离大船，很快就消失了。
        - id: ch01-b12
          speaker: narrator
          text: 小王子哭了起来。女巫怎么哄也哄不好，只得抱着他下舱，叫醒西格德，还劈头责骂国王把母子二人丢在甲板上，自己却和全船的人一起睡觉。
        - id: ch01-b13
          speaker: witch
          text: 你也太粗心了！怎么连一个守船的人都不留下，让我独自待在甲板上？
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: 从前的王后从没对他说过一句气话，西格德听了十分惊讶。不过，他觉得这次挨骂也不算冤，便和她一起哄孩子，还是没有用。他叫醒水手，命人升帆。风已经重新吹起，正把船送向港口。
    - id: ch02
      title: 王宫里的山怪
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 西格德回到故国时，百姓还在为老国王哀伤。见王子终于归来，他们又欢喜起来，拥立他做了国王。
        - id: ch02-b02
          speaker: narrator
          text: 小王子却从甲板上那场变故以后一直啼哭。从前那么乖的孩子，怎么也安静不下来。西格德只好从宫里的侍女中选了一名乳母。孩子一到她怀里，马上不哭了，又恢复了从前的乖巧。
        - id: ch02-b03
          speaker: narrator
          text: 西格德也渐渐觉得，航海归来的王后变了许多，而且没有一处是变好的。她比过去傲慢，也更加固执，越来越难相处。没过多久，宫中其他人也察觉了异样。
        - id: ch02-b04
          speaker: narrator
          text: 宫里有两个爱下棋的年轻人，一个十八岁，一个十九岁。他们常在房中一连下上很久，而他们的房间正挨着王后的房间。一天，两人听见隔壁传来王后的声音，便把耳朵贴到墙缝上。
        - id: ch02-b05
          speaker: witch
          text: 我只打个小哈欠，就是个漂亮的小姑娘。哈欠打到一半，我就是半个山怪。要是把哈欠痛痛快快打完，我就彻头彻尾是个山怪了。
        - id: ch02-b06
          speaker: narrator
          text: 她张开大嘴，打了个惊天动地的哈欠，眨眼就变成一个丑陋吓人的山怪。随后，一个三头巨人托着装满肉的食槽，从地板下面钻出来。他叫女巫妹妹，把食槽摆在她面前。
        - id: ch02-b07
          speaker: narrator
          text: 女巫伏在槽边大吃起来，不把肉吃光便不停口。两个年轻人看见了所有事情，却没听见兄妹二人再交谈。他们又惊又怕。女巫原来能吞下这么多肉，难怪和国王同桌时总吃得那么少。
        - id: ch02-b08
          speaker: narrator
          text: 肉一吃完，三头巨人便带着食槽，沿着来路沉入地下。女巫也重新变回人的样子。两个年轻人不再奇怪，她为什么在国王的餐桌上总吃得那么少了。
    - id: ch03
      title: 地板下的白衣女子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 再说那名照料小王子的乳母。一天傍晚，她点起蜡烛，正抱着孩子，脚下的几块地板忽然弹开了。一名美丽的白衣女子从洞口走上来。她腰间束着铁带，铁带上连着一根铁链，一直伸进地下。
        - id: ch03-b02
          speaker: narrator
          text: 白衣女子走到乳母面前，接过孩子，紧紧搂在胸前。随后，她把孩子交还给乳母，沿原路离去，地板又在身后合拢。她一句话也没有说。乳母吓坏了，却没把这件事告诉任何人。
        - id: ch03-b03
          speaker: narrator
          text: 第二天傍晚，同样的事又发生了。白衣女子抱过孩子，再把他交还给乳母。可这一回，她临走前悲伤地开了口。
        - id: ch03-b04
          speaker: real_queen
          text: 两次已经过去，只剩下一次了。
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: 乳母听了更加害怕，担心小王子会遭遇危险。可这位陌生女子看起来并无恶意，她疼爱孩子，就像那是自己的亲生骨肉。乳母猜想，女子已经来了两天，那句话必定是说，她只能再来最后一天。
        - id: ch03-b06
          speaker: narrator
          text: 乳母终于下定决心，把整件事告诉西格德，请他在女子再次出现时亲自到场。
        - id: ch03-b07
          speaker: nurse
          text: 陛下，请您明天在那个时辰来我的房间。那名女子还会再来一次。
        - id: ch03-b08
          speaker: narrator
          text: 西格德答应了。第二天，他提前来到乳母房中，手握出鞘的宝剑，坐着等候。没多久，地板再次弹开。那名白衣女子拖着铁链走了上来。
        - id: ch03-b09
          speaker: narrator
          text: 西格德一眼就认出，这才是他真正的王后。他立刻挥剑，斩断了铁带上的锁链。地下顿时传出轰鸣和崩裂声，整座王宫都剧烈摇晃。人人都以为，宫殿马上就要震成碎片。过了许久，巨响与震动才终于停下，众人也渐渐回过神来。
        - id: ch03-b10
          speaker: narrator
          text: 西格德与真正的王后紧紧相拥。随后，王后把自己的遭遇从头说起。
        - id: ch03-b11
          speaker: real_queen
          text: 那天，船上的人全都睡着了。女巫乘着石船来到我们旁边，夺走孩子和我的衣服，又把我赶进石船。等大船从眼前消失，石船载着我穿过一片黑暗，最后停在一个三头巨人身边。
        - id: ch03-b12
          speaker: real_queen
          text: 巨人逼我嫁给他，我不肯，他就把我独自关起来。他说，只要我不答应，就永远别想获得自由。
        - id: ch03-b13
          speaker: real_queen
          text: 后来，我想出了一个办法。我告诉他，只要让我连续三天回到人间看望儿子，我就愿意嫁给他。他答应了，却把铁带套在我腰上，又用这根锁链把我和他自己拴在一起。
        - id: ch03-b14
          speaker: real_queen
          text: 你砍断锁链时，那巨人一定从地下通道摔了下去。他就住在王宫下面。刚才那些巨响，是他摔落时发出的。宫殿那样摇晃，是因为他正在垂死挣扎。
    - id: ch04
      title: 真王后归来
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 西格德终于明白了。难怪这段日子陪在他身边的“王后”总是傲慢暴躁，原来她一直是石舟女巫。
        - id: ch04-b02
          speaker: narrator
          text: 国王立刻命人用布袋蒙住女巫的头，用石头把她砸死，再让没有驯服的烈马将她撕成碎片。
        - id: ch04-b03
          speaker: narrator
          text: 那两个年轻人这才敢说出，他们曾从墙缝里听见女巫谈论自己的山怪模样，也亲眼看见她变身，还看见三头巨人从地下送来一槽肉。先前，他们畏惧假王后的权势，一直不敢声张。
        - id: ch04-b04
          speaker: narrator
          text: 真正的王后恢复了全部尊荣，人人都敬爱她。那名忠诚的乳母嫁给了一位贵族，国王和王后还送给她许多贵重的礼物。
