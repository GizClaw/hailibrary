  chapters:
    - id: ch01
      title: Sigurd's Marriage
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there were a King and Queen with a son named Sigurd. He was strong and active, and handsome too. As the King grew old and bent beneath the weight of his years, he called for his son. He did not know how much longer he would live, and he wished to see Sigurd married before he died.
        - id: ch01-b02
          speaker: old_king
          text: It is time for you to find a wife who is worthy of you, my son.
        - id: ch01-b03
          speaker: narrator
          text: Sigurd was willing, but he asked where his father thought he should look.
        - id: ch01-b04
          speaker: sigurd
          text: Where do you think I might find the right wife?
        - id: ch01-b05
          speaker: old_king
          text: In a certain country lives a King with a beautiful daughter. If you can win her hand, I think the match would be a fine one.
        - id: ch01-b06
          speaker: narrator
          text: Then father and son parted. Sigurd prepared for the journey and traveled to the country his father had named. When he reached the court, he asked the King for his daughter's hand. The King gladly agreed, but he set one condition. Sigurd must stay there for as long as he could, because the King was weak and could no longer govern his kingdom well.
        - id: ch01-b07
          speaker: princess_father
          text: You may marry my daughter, but remain here and help me rule for as long as you are able.
        - id: ch01-b08
          speaker: sigurd
          text: I agree. But if news comes that my father has died, you must let me return to my own country.
        - id: ch01-b09
          speaker: narrator
          text: So Sigurd married the Princess and helped her father govern. He and his wife loved each other dearly. A year later they had a son, and when the boy was two years old, word came that Sigurd's father was dead. Sigurd prepared to go home with his wife and child. They boarded a ship and set out across the sea.
    - id: ch02
      title: The Stone Boat
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They had sailed for several days and were only one day's voyage from home when the breeze suddenly died. The sea lay perfectly still. One day, Sigurd and his Queen sat talking on deck with their little son while nearly everyone else aboard slept. Before long, Sigurd grew so drowsy that he could not keep his eyes open. He went below to lie down, leaving the Queen on deck to play with their child.
        - id: ch02-b02
          speaker: narrator
          text: A good while later, the Queen noticed something black upon the sea. It drew nearer and nearer until she saw that it was a boat with someone rowing inside. At last it came alongside the ship. The boat was made of stone, and a fearfully ugly Witch climbed out of it and stepped aboard.
        - id: ch02-b03
          speaker: narrator
          text: The Queen was more frightened than words could tell. She could not speak, and she could not move to wake Sigurd or the sailors. The Witch came straight to her, snatched away the child, and laid him on the deck. Then she stripped the Queen of her fine clothes and put them on herself. Dressed that way, the Witch looked like a human woman.
        - id: ch02-b04
          speaker: narrator
          text: Last of all, the Witch forced the Queen into the stone boat and laid a spell upon her.
        - id: ch02-b05
          speaker: witch
          text: I place this spell on you. Your boat will never slow until it carries you to my brother in the Underworld.
        - id: ch02-b06
          speaker: narrator
          text: The Queen sat stunned and still. At once, the boat shot away from the ship, and before long she vanished from sight.
        - id: ch02-b07
          speaker: narrator
          text: As soon as the boat was gone, the child began to cry. The Witch tried to soothe him, but nothing worked. She carried him below and woke Sigurd. Then she angrily blamed him for leaving her alone on deck while he and the whole crew slept.
        - id: ch02-b08
          speaker: witch
          text: How could you leave us alone up there? You and every sailor were asleep, and no one was watching the ship!
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: Sigurd was astonished. His Queen had never spoken an angry word to him before. Still, he thought she had good reason this time. He tried to quiet the child with her, but the boy would not stop crying. Then Sigurd woke the sailors and ordered them to raise the sails. A breeze had sprung up, blowing straight toward the harbor.
    - id: ch03
      title: The False Queen
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The ship soon reached Sigurd's homeland. Everyone there had been mourning the old King's death, but the people rejoiced when Sigurd returned to the court. They made him their new King.
        - id: ch03-b02
          speaker: narrator
          text: Yet Sigurd's little son hardly stopped crying after that day on the ship. Before then, he had always been a good and quiet child. At last, Sigurd placed him in the care of a nurse from among the court maids. The moment she took charge of him, he stopped crying and behaved just as he had before.
        - id: ch03-b03
          speaker: narrator
          text: Sigurd also felt that the Queen had changed greatly during the voyage, and not for the better. She was prouder now, more stubborn, and far harder to live with. Before long, other people at court noticed it too.
        - id: ch03-b04
          speaker: narrator
          text: Two young men at court, one eighteen and the other nineteen, loved to play chess. They often sat over the board for hours. Their room was beside the Queen's, and through the wall they often heard her talking. One day they listened more closely. They pressed their ears to a crack and heard every word she said.
        - id: ch03-b05
          speaker: witch
          text: When I yawn just a little, I am a pretty young maiden. When I yawn halfway, I am half a troll. And when I yawn as wide as I can, I am a troll through and through.
        - id: ch03-b06
          speaker: narrator
          text: Then she opened her mouth in a tremendous yawn. In an instant, she became a fearfully ugly troll. The two young men watched in amazement.
        - id: ch03-b07
          speaker: narrator
          text: A three-headed Giant rose straight through the floor, carrying a trough filled with meat. He greeted the troll as his sister and set the food before her. She began eating and did not stop until the trough was empty. Neither the Giant nor his sister said another word.
        - id: ch03-b08
          speaker: narrator
          text: The young men could hardly believe how greedily she ate or how much she swallowed. Now they understood why the Queen ate so little at the King's table. When she finished, the Giant and his trough disappeared through the floor. Then the Queen took on her human shape again.
    - id: ch04
      title: The Woman Beneath the Floor
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Now let us return to the King's little son and his nurse. One evening, the nurse lit a candle and held the child in her arms. Suddenly, several floorboards sprang up. Through the opening came a beautiful woman dressed in white. An iron belt circled her waist, and an iron chain fastened to it ran down into the ground.
        - id: ch04-b02
          speaker: narrator
          text: The woman came to the nurse, took the child, and pressed him to her breast. Then she gave him back without saying a word. She went down through the opening, and the floor closed over her. The nurse was terribly frightened, but she told no one what she had seen.
        - id: ch04-b03
          speaker: narrator
          text: The same thing happened the next evening. This time, as the woman turned to go, she spoke in a sorrowful voice.
        - id: ch04-b04
          speaker: real_queen
          text: Two are gone. Only one remains.
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: Then she vanished as before. Her words frightened the nurse even more. Perhaps some danger threatened the child. Still, the nurse did not believe the strange woman meant him harm. She had held the boy as tenderly as if he were her own son.
        - id: ch04-b06
          speaker: narrator
          text: What troubled the nurse most was the warning that only one remained. Since the woman had already come on two days, the nurse guessed that only one day was left.
        - id: ch04-b07
          speaker: narrator
          text: At last, the nurse went to Sigurd. She told him everything and asked him to come to her room the next day at the hour when the woman usually appeared.
        - id: ch04-b08
          speaker: nurse
          text: Please come and see this for yourself tomorrow. Be here before the woman returns.
        - id: ch04-b09
          speaker: narrator
          text: Sigurd promised he would. The next day he arrived early and sat in a chair with his sword drawn, waiting.
    - id: ch05
      title: The Chain Is Broken
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Soon the floorboards sprang up once more. The beautiful woman climbed into the room, dressed in white, with the iron belt around her waist and the chain trailing below. Sigurd knew her at once. This was his own true Queen.
        - id: ch05-b02
          speaker: narrator
          text: Without a moment's delay, he swung his sword and cut through the iron chain. A dreadful crashing and roaring came from deep underground. The whole palace shook so violently that everyone thought it would break into pieces. At last, the noise died away and the trembling stopped. Slowly, the people in the room recovered from their terror.
        - id: ch05-b03
          speaker: narrator
          text: Sigurd and his Queen embraced. Then she told him all that had happened. While everyone aboard the ship slept, the Witch had come, stolen her clothes, and sent her away in the stone boat.
        - id: ch05-b04
          speaker: real_queen
          text: Once the ship was out of sight, the boat carried me on through darkness. At last, I landed beside a three-headed Giant. He wanted me to marry him, but I refused.
        - id: ch05-b05
          speaker: narrator
          text: Because she would not consent, the Giant shut her away alone. He told her she would never be free until she agreed to become his wife. After some time, the Queen began to plan a way out. At last, she gave the Giant an answer.
        - id: ch05-b06
          speaker: real_queen
          text: I told him I would marry him if he let me visit my son on earth for three days in a row.
        - id: ch05-b07
          speaker: narrator
          text: The Giant agreed, but first he locked the iron belt around her. He fastened one end of the chain to that belt and wound the other end around his own waist. That was why she could rise to the palace only for those brief visits.
        - id: ch05-b08
          speaker: real_queen
          text: When your sword broke the chain, the Giant must have fallen down the underground passage. His home lies directly beneath this palace. The crashing and shaking must have come from his death struggle.
        - id: ch05-b09
          speaker: narrator
          text: Now Sigurd finally understood why the woman who had called herself his Queen had been so cruel and ill-tempered.
    - id: ch06
      title: The True Queen Restored
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Sigurd acted at once. He ordered a sack drawn over the Witch's head. She was stoned to death and afterward torn apart by untamed horses.
        - id: ch06-b02
          speaker: narrator
          text: Only then did the two young chess players tell what they had heard and seen in the false Queen's room. Until the Witch was gone, they had been too afraid of her power to speak.
        - id: ch06-b03
          speaker: young_man_one
          text: We heard her describe how her yawns would change her into a troll.
        - id: ch06-b04
          speaker: young_man_two
          text: And we watched the three-headed Giant rise through her floor with a trough of meat. She ate every bit of it before he disappeared again.
        - id: ch06-b05
          speaker: narrator
          text: The true Queen was restored to her royal place, and everyone loved her. Sigurd and the Queen rewarded the faithful nurse with splendid gifts, and she married a nobleman.
