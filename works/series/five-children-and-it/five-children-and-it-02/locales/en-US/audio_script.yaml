  chapters:
    - id: ch01
      title: THE DREAM THAT WAS TRUE
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Anthea woke from a dream that felt entirely real. She had been walking through the Zoological Gardens in pouring rain without an umbrella. Every animal looked miserable and growled gloomily at the weather. When her eyes opened, the growling and the rain were still there. The growling was only Jane, breathing heavily in her sleep because she had a slight cold. The rain came from the wet corner of a bath towel. Robert was gently squeezing drops onto Anthea's face, and he now explained that he meant to wake her.
        - id: ch01-b02
          speaker: anthea
          text: Oh, stop that!
        - id: ch01-b03
          speaker: narrator
          text: >-
            She spoke rather crossly, and Robert stopped. He was not a cruel brother. He was merely clever at making apple-pie beds and booby traps, waking sleeping relatives in unusual ways, and doing all those other little things that make family life so pleasant.
        - id: ch01-b04
          speaker: anthea
          text: I had the strangest dream.
        - id: ch01-b05
          speaker: jane
          text: >-
            So did I! I dreamed we found a Sand-fairy in the gravel pit. It said it was a Psammead and promised us one new wish every day, and then...
        - id: ch01-b06
          speaker: narrator
          text: Jane had awakened all at once, without warning.
        - id: ch01-b07
          speaker: robert
          text: >-
            That's exactly what I dreamed! I was about to tell you. We made our first wish the moment it offered. You girls were silly enough to ask for all of us to be beautiful as the day. We were, too, and it was absolutely awful.
        - id: ch01-b08
          speaker: anthea
          text: >-
            Can different people really have the same dream? I dreamed all of that as well as the Zoo and the rain. The baby didn't know us, and the servants locked us out because our wonderful beauty made us look like strangers, and...
        - id: ch01-b09
          speaker: narrator
          text: The eldest brother called from across the landing.
        - id: ch01-b10
          speaker: cyril
          text: >-
            Come on, Robert! You'll miss breakfast again, unless you're planning to dodge your bath the way you did on Tuesday.
        - id: ch01-b11
          speaker: robert
          text: >-
            Come here a moment! I didn't dodge it. I had my bath after breakfast in Father's dressing room because someone had emptied ours.
        - id: ch01-b12
          speaker: narrator
          text: Cyril appeared in the doorway, only partly dressed.
        - id: ch01-b13
          speaker: anthea
          text: We all had the same odd dream. Every one of us dreamed about finding a Sand-fairy.
        - id: ch01-b14
          speaker: narrator
          text: Her words faded when she saw Cyril's scornful face.
        - id: ch01-b15
          speaker: cyril
          text: >-
            A dream? Don't be silly. It really happened. That's why I want to get downstairs early. We'll go back as soon as breakfast is over and make another wish. This time, we'll settle exactly what we want before we get there. Nobody asks for anything unless everyone agrees. I am finished with being perfectly beautiful, thank you very much.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The other three dressed with their mouths hanging open. If the Sand-fairy adventure had been real, then putting on real clothes felt strangely like a dream. Jane believed Cyril at once. Anthea was less certain. Then they saw Martha and heard her clear, detailed account of everything naughty they had done the day before. After that, Anthea believed it too.
        - id: ch01-b17
          speaker: anthea
          text: >-
            Servants only dream about the things in the Dream-book. They dream of snakes, or oysters, or going to a wedding. A wedding means a funeral, a snake means a false female friend, and oysters mean babies.
        - id: ch01-b18
          speaker: cyril
          text: Speaking of babies, where is the Lamb?
        - id: ch01-b19
          speaker: jane
          text: >-
            Martha is taking him to Rochester to visit her cousins. Mother gave her permission. She's dressing him now in his very best coat and hat. Please pass the bread and butter.
        - id: ch01-b20
          speaker: robert
          text: She actually seems to enjoy taking him.
        - id: ch01-b21
          speaker: cyril
          text: >-
            Servants like taking babies to visit their relations. I've noticed that before, especially when the babies are wearing their best clothes.
        - id: ch01-b22
          speaker: jane
          text: >-
            I expect they pretend the babies belong to them. They pretend they aren't servants at all, but wives of grand dukes, and the babies are little dukes and duchesses. Martha will probably tell her cousin that. She'll have a wonderful time.
        - id: ch01-b23
          speaker: narrator
          text: Jane dreamily helped herself to more marmalade.
        - id: ch01-b24
          speaker: robert
          text: >-
            She won't have a wonderful time carrying our infant duke all the way to Rochester. Not if she feels anything like I would.
        - id: ch01-b25
          speaker: cyril
          text: Imagine walking to Rochester with the Lamb on your back. What a nightmare!
        - id: ch01-b26
          speaker: jane
          text: >-
            She's going in the carrier's cart. Let's see them off. That will be polite and kind, and we'll know for certain that they're gone for the day.
        - id: ch01-b27
          speaker: narrator
          text: >-
            So that was what they did. Martha wore her Sunday dress in two shades of purple. It was so tight across the chest that she had to stoop. Her blue hat had pink cornflowers and a white ribbon, while a green bow decorated her yellow lace collar. The Lamb wore his very best cream-colored silk coat and matching hat. They made an elegant pair when the carrier's cart collected them at the Cross Roads. Its white cover and red wheels rolled away and slowly disappeared in a cloud of chalk dust.
        - id: ch01-b28
          speaker: cyril
          text: Now for the Psammead!
        - id: ch01-b29
          speaker: narrator
          text: And away the four children went.
    - id: ch02
      title: A GRAVEL PIT FULL OF GOLD
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            They chose their wish as they walked. Everyone was in a hurry, but this time they did not scramble down the steep sides of the gravel pit. They went around by the safe lower road, just as carts did. The ring of stones they had placed around the Psammead's hiding place showed them exactly where to dig. The sun burned in a cloudless deep blue sky, and the sand felt hot beneath their hands.
        - id: ch02-b02
          speaker: robert
          text: What if it really was only a dream?
        - id: ch02-b03
          speaker: narrator
          text: The boys uncovered the spades they had buried beneath a heap of sand and began to dig.
        - id: ch02-b04
          speaker: cyril
          text: What if you suddenly became sensible? One is about as likely as the other.
        - id: ch02-b05
          speaker: robert
          text: What if you tried speaking politely for once?
        - id: ch02-b06
          speaker: jane
          text: Shall we girls dig for a while? You boys look as if you're getting rather hot.
        - id: ch02-b07
          speaker: narrator
          text: Jane laughed, but Robert was now very hot indeed.
        - id: ch02-b08
          speaker: robert
          text: What if you kept your silly ideas to yourself?
          emotion: angry
        - id: ch02-b09
          speaker: anthea
          text: >-
            We will. Robert, dear, don't be so cross. We won't say another word. You can speak to the Fairy and ask for the wish we chose. You'll do it much better than we could.
        - id: ch02-b10
          speaker: robert
          text: Stop pretending to be so sweet. Here, use your hands now. We're close!
        - id: ch02-b11
          speaker: narrator
          text: >-
            He was no longer truly angry. All four children dug with their hands. Soon they uncovered the Psammead's brown, hairy, spider-shaped body, its long limbs, bat ears, and eyes on stalks like a snail's. Everyone breathed out in relief. A creature lying in the sand was proof that yesterday had not been a dream. The Psammead sat upright and shook the grains from its fur.
        - id: ch02-b12
          speaker: anthea
          text: How is your left whisker this morning?
        - id: ch02-b13
          speaker: psammead
          text: Not especially well. It had a restless night. Still, thank you for asking.
        - id: ch02-b14
          speaker: robert
          text: >-
            Are you feeling strong enough to grant wishes today? We want one extra wish as well as the ordinary one, but the extra wish is only a tiny thing.
        - id: ch02-b15
          speaker: psammead
          text: >-
            Humph! Until I heard you quarreling right above my head, and making such a noise about it, I was quite sure I had dreamed all of you. I have some very peculiar dreams.
        - id: ch02-b16
          speaker: narrator
          text: >-
            The Psammead said "humph" exactly as it is spelled. Jane hurried to change the subject before it could say any more about their bad tempers.
        - id: ch02-b17
          speaker: jane
          text: Do you? I wish you would tell us about your dreams. They must be terribly interesting.
        - id: ch02-b18
          speaker: psammead
          text: Is that your wish for today?
        - id: ch02-b19
          speaker: narrator
          text: >-
            It yawned. Cyril muttered that this was just like a girl, and everyone else kept quiet. Saying yes would cost them the wishes they had agreed upon. Saying no would be horribly rude. They had all been taught good manners, and had even learned a little of them, which is not the same thing. Every child sighed with relief when the Psammead spoke again.
        - id: ch02-b20
          speaker: psammead
          text: >-
            If I tell you my dreams, I won't have enough strength left for another wish. I couldn't even give you good tempers, common sense, manners, or any other small thing like that.
        - id: ch02-b21
          speaker: cyril
          text: >-
            Please don't trouble yourself about any of those things. We can manage them perfectly well without help.
        - id: ch02-b22
          speaker: narrator
          text: >-
            Cyril answered eagerly. The others exchanged guilty looks. They wished the Fairy would stop talking about good tempers, or give them one proper scolding and finish with it. The Psammead suddenly stretched out its long eye stalks. One eye nearly touched Robert's round human eye.
        - id: ch02-b23
          speaker: psammead
          text: Very well. Give me the little wish first.
        - id: ch02-b24
          speaker: robert
          text: We don't want the servants to notice any of the gifts you give us.
        - id: ch02-b25
          speaker: anthea
          text: Any of the gifts you are kind enough to give us.
        - id: ch02-b26
          speaker: robert
          text: Yes, any gifts you're kind enough to give us. That's what I meant.
        - id: ch02-b27
          speaker: narrator
          text: The Fairy puffed itself out a little, released its breath, and nodded.
        - id: ch02-b28
          speaker: psammead
          text: >-
            Done. That was easy. People hardly notice anything in any case. Now, what is the other wish?
        - id: ch02-b29
          speaker: robert
          text: We want to be richer than the wildest dreams of... of whatever it is.
        - id: ch02-b30
          speaker: jane
          text: Avarice.
        - id: ch02-b31
          speaker: psammead
          text: >-
            Yes, that's the word. It won't do you much good, which is one comfort. Remember, I can't give you more than the dream itself. How much money do you want? Gold or banknotes?
        - id: ch02-b32
          speaker: robert
          text: Gold, please. Millions and millions of it.
        - id: ch02-b33
          speaker: psammead
          text: Would enough gold to fill this gravel pit satisfy you?
        - id: ch02-b34
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Oh, yes!
        - id: ch02-b35
          speaker: psammead
          text: Then get out before I begin, unless you want the gold to bury you alive.
        - id: ch02-b36
          speaker: narrator
          text: >-
            Its thin arms grew terribly long and waved so wildly that the children raced toward the cart road. Only Anthea remembered her manners while she ran.
        - id: ch02-b37
          speaker: anthea
          text: Good morning! I hope your whisker feels better tomorrow!
        - id: ch02-b38
          speaker: narrator
          text: >-
            The children reached the road and looked back. The sight was so brilliant that they had to close their eyes, then open them again a tiny bit at a time. Looking straight into the pit was almost like staring at the noonday sun on Midsummer Day. New gold coins filled the entire hollow, right to the top. They covered the little front doors of the sand martins' nests. Where the cart road curved down, the coins lay in banks and heaps, as stones lie beside a country road. A shining slope descended from the flat golden surface between the tall walls of the pit. Every piece was minted gold. Sunlight flashed from countless faces and edges until the quarry glowed like the mouth of a furnace, or like one of those fairy halls that sometimes appears in the sunset sky.
        - id: ch02-b39
          speaker: narrator
          text: >-
            All four children stared with open mouths. Not one of them spoke. At last Robert bent down at the edge of the cart road and picked up a loose coin. He examined the front, turned it over, and examined the back. When he spoke, his voice was low and sounded quite unlike him.
        - id: ch02-b40
          speaker: robert
          text: They aren't sovereigns.
        - id: ch02-b41
          speaker: cyril
          text: They're gold. That's what matters.
        - id: ch02-b42
          speaker: narrator
          text: >-
            Then everyone talked at once. They scooped up handfuls of treasure and let the coins stream through their fingers like water. The ringing sound they made was wonderful music. For a while, playing with the gold was so delightful that nobody thought of spending it. Jane sat between two heaps, and Robert began burying her, just as children bury their father in sand when he falls asleep on the beach with a newspaper over his face.
        - id: ch02-b43
          speaker: jane
          text: Stop! It's much too heavy. You're hurting me!
          emotion: fearful
        - id: ch02-b44
          speaker: robert
          text: Nonsense.
        - id: ch02-b45
          speaker: narrator
          text: He continued piling on the coins.
        - id: ch02-b46
          speaker: jane
          text: Let me out! I mean it!
          emotion: fearful
        - id: ch02-b47
          speaker: narrator
          text: >-
            They pulled her free. Her face had gone so very white, and she was trembling slightly.
        - id: ch02-b48
          speaker: jane
          text: You don't know how that feels. It's like having stones piled on you, or heavy chains.
        - id: ch02-b49
          speaker: cyril
          text: >-
            If this gold is going to help us, we can't stand here staring at it. Fill your pockets and let's buy things. Remember, it will all disappear at sunset. We should have asked the Psammead why its gifts don't turn to stone. Perhaps this gold will. There's a pony and cart in the village.
        - id: ch02-b50
          speaker: jane
          text: Do you mean to buy it?
        - id: ch02-b51
          speaker: cyril
          text: >-
            Of course not. We'll hire it and drive to Rochester. Then we'll buy piles and piles of things. Take as much gold as you can carry. The coins have a man's head on one side and something like the ace of spades on the other. Fill your pockets and come along. You can talk while we walk, if you absolutely must.
    - id: ch03
      title: TOO MUCH TO CARRY
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Cyril sat down and stuffed coins into his clothes. He filled all nine pockets of his Norfolk suit. He filled his handkerchief too, then tucked more gold inside the front of his shirt. At last he tried to stand. He staggered under the weight and dropped back onto the ground.
        - id: ch03-b02
          speaker: cyril
          text: >-
            You all laughed when I asked Father to put nine pockets in this suit. Now you can see why they're useful.
        - id: ch03-b03
          speaker: robert
          text: Throw some cargo overboard, old fellow. Nine pockets are going to sink your ship.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Cyril had no choice. He removed some of the coins, and then they started toward the village. It was more than a mile away. The road was thick with dust, the sun grew hotter at every step, and the money in their clothes seemed to become heavier and heavier.
        - id: ch03-b05
          speaker: jane
          text: >-
            How can we possibly spend all of it? We must have thousands of pounds between us. I'm hiding some behind this stump, and the first thing we buy in the village must be biscuits. Dinner time was ages ago.
        - id: ch03-b06
          speaker: narrator
          text: Jane pushed several handfuls of gold into the hollows of an old hornbeam stump.
        - id: ch03-b07
          speaker: jane
          text: >-
            They're so round and yellow. Don't you wish they were gingerbread nuts, and we could eat them?
        - id: ch03-b08
          speaker: cyril
          text: They aren't gingerbread, and we can't eat them. Keep moving.
        - id: ch03-b09
          speaker: narrator
          text: >-
            They trudged on, tired and bent beneath their loads. Before the village came into sight, several more stumps along the hedge were hiding small fortunes. Even after leaving all that treasure behind, the children carried about twelve hundred guineas into the village. Nothing about them looked rich. Anyone passing would have guessed that each child owned half a crown at most. Heat shimmered over the red roofs, mixed with the blue haze of wood smoke. The four dropped heavily onto the first bench they saw. It stood outside the Blue Boar Inn.
        - id: ch03-b10
          speaker: narrator
          text: >-
            They decided that Cyril must go inside and ask for ginger beer. Anthea explained that children were not supposed to enter public houses, while men were allowed, and Cyril was closest to being a man because he was the eldest. He went in. The other three sat under the hot sun and waited.
        - id: ch03-b11
          speaker: robert
          text: >-
            How can it be this hot? Dogs stick out their tongues when they're warm. Do you think it might cool us down too?
        - id: ch03-b12
          speaker: jane
          text: We could try it.
        - id: ch03-b13
          speaker: narrator
          text: >-
            They pushed their tongues out as far as possible until their throats felt stretched. It made them thirstier, not cooler, and it annoyed everyone who walked past. They pulled their tongues in just as Cyril returned with the drinks.
        - id: ch03-b14
          speaker: cyril
          text: >-
            I had to use my own two shillings and sevenpence. I was saving it to buy rabbits. They refused to change a gold coin. When I showed the man a handful, he laughed and called them card counters. I bought sponge cakes as well, and some caraway biscuits from a glass jar on the counter.
        - id: ch03-b15
          speaker: narrator
          text: >-
            The sponge cakes were soft but somehow dry. The biscuits were dry but somehow soft, which biscuits should never be. The ginger beer made up for all of it.
        - id: ch03-b16
          speaker: anthea
          text: >-
            I'm the next eldest, so it is my turn to try buying something with our money. Where do they keep the pony and cart?
        - id: ch03-b17
          speaker: narrator
          text: >-
            The pony cart belonged to The Chequers. Anthea went around to the yard because little girls were certainly not meant to enter the bar. When she came back, she said she felt pleased, though not proud.
        - id: ch03-b18
          speaker: anthea
          text: >-
            He says the cart will be ready very soon. For one of our gold pieces, he'll drive us to Rochester, wait while we buy everything, and bring us home. I think I handled that rather well.
        - id: ch03-b19
          speaker: cyril
          text: I suppose you think you're extremely clever. How did you persuade him?
        - id: ch03-b20
          speaker: anthea
          text: >-
            I was clever enough not to wave handfuls of money around and make it look worthless. A young man was washing a horse's leg with a sponge and pail. I held out one coin and asked if he knew what it was. He didn't, so he called his father. The old man said it was a spade guinea. He asked if it truly belonged to me and whether I could spend it as I liked. I said yes, then offered it for the trip to Rochester. He agreed. His name is S. Crispin.
        - id: ch03-b21
          speaker: narrator
          text: >-
            Soon they were riding along beautiful country lanes in a neat pony trap. It was a new experience, and a pleasant one too. New experiences are not always pleasant. Quite apart from the pleasure of the ride, each child silently planned magnificent ways to spend the money. Nobody shared those rich thoughts with anyone else, and especially not with the old innkeeper. It would never do for him to hear them talking as grandly as they were thinking. At their request, Mr. Crispin stopped near the bridge in Rochester.
        - id: ch03-b22
          speaker: cyril
          text: If someone wanted to buy a carriage and horses, where would you send him?
        - id: ch03-b23
          speaker: crispin
          text: >-
            Billy Peasemarsh at the Saracen's Head. Mind you, I wouldn't tell any man which horse to buy, and I wouldn't take another man's advice if I were choosing one myself. But if your father wants a carriage and team, Billy is as honest as anyone in Rochester, and civil spoken too.
        - id: ch03-b24
          speaker: cyril
          text: Thank you. The Saracen's Head.
        - id: ch03-b25
          speaker: narrator
          text: >-
            Now the children watched one of nature's laws turn upside down and balance on its head. Any grown-up will tell you that money is hard to earn and easy to spend. Their fairy money had been very easy to obtain, yet spending it was nearly impossible. Every shopkeeper in Rochester shrank from the glittering coins. Most of them called it foreign money.
        - id: ch03-b26
          speaker: narrator
          text: >-
            Anthea first tried a hat shop. She needed a new hat because she had accidentally sat on hers earlier that day. In the window she found a splendid one decorated with pink roses and the blue breast feathers of peacocks. Its label said, "Paris Model, three guineas."
        - id: ch03-b27
          speaker: anthea
          text: >-
            That's perfect. The label asks for guineas, not sovereigns, and guineas are exactly what we have.
        - id: ch03-b28
          speaker: narrator
          text: >-
            Anthea took out three spade guineas. Her hands were rather dirty because she had gone to the gravel pit without gloves. The young woman in black silk stared at her, whispered to an older and less attractive woman who also wore black silk, then returned the coins.
        - id: ch03-b29
          speaker: milliner
          text: I'm afraid these are not current coins.
        - id: ch03-b30
          speaker: anthea
          text: They are real money, and they belong to me.
        - id: ch03-b31
          speaker: milliner
          text: >-
            That may be so, but this kind of money is no longer fashionable. We would rather not accept it.
        - id: ch03-b32
          speaker: anthea
          text: >-
            They think we stole it. If I'd been wearing gloves, my hands wouldn't look dishonest and nobody would have suspected us.
        - id: ch03-b33
          speaker: narrator
          text: >-
            The children tried a humbler shop. The girls chose cotton gloves costing sixpence three farthings. The shopkeeper held a guinea close and examined it through her spectacles, but said she had no change for such a coin. Once again Cyril had to spend the two shillings and sevenpence meant for his rabbits. That dwindling little store of ordinary money also paid ninepence halfpenny for a green purse made of imitation crocodile skin.
        - id: ch03-b34
          speaker: narrator
          text: >-
            They moved from shop to shop. They tried to buy toys, perfume, silk handkerchiefs, books, fancy stationery boxes, and photographs of nearby sights. Not one merchant in Rochester wanted to change a guinea that day. With each failure the children grew dirtier, and their hair became wilder. Jane slipped in a muddy patch left by a water cart. Worse still, all four were ravenously hungry. Two pastry shops refused to sell them food for their gold. Perhaps the smell of cakes made the hunger worse, as Cyril suggested. At last, desperation gave them a plan.
        - id: ch03-b35
          speaker: narrator
          text: >-
            They whispered together, then marched into a third pastry shop. Its owner was named Beale. Before anyone behind the counter could stop them, each child snatched three fresh penny buns. Each pressed the three buns together between dirty hands, took a huge bite from the triple sandwich, and stood ready to defend it. Twelve buns remained clutched in four pairs of hands, while four mouths were much too full for speech. The horrified pastry cook rushed around the counter.
        - id: ch03-b36
          speaker: cyril
          text: Take the price from this.
        - id: ch03-b37
          speaker: narrator
          text: >-
            Cyril spoke as clearly as he could through his mouthful. He held out a guinea he had prepared before entering. Mr. Beale snatched it, bit it, and slipped it into his pocket.
        - id: ch03-b38
          speaker: beale
          text: Now get out.
        - id: ch03-b39
          speaker: anthea
          text: But what about our change?
        - id: ch03-b40
          speaker: beale
          text: >-
            Change? I'll give you change! Out you go, and count yourselves lucky I don't call the police to ask where you found that coin.
          emotion: angry
    - id: ch04
      title: THE SARACEN'S HEAD
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The four millionaires took their buns to the Castle Gardens and finished eating there. The soft cakes were full of currants and tasted wonderful. Their spirits rose with every bite. Even so, the thought of asking Billy Peasemarsh about a horse and carriage made the bravest of them nervous. The boys wanted to abandon the plan. Jane was naturally hopeful, and Anthea was usually determined. Between them, the girls persuaded everyone to go on.
        - id: ch04-b02
          speaker: narrator
          text: >-
            By now the entire party was dirty beyond description. They made their way to the Saracen's Head and went through the yard, since that approach had worked at The Chequers. Mr. Peasemarsh stood there. He was tall and thin, with very blue eyes, a tight mouth, and narrow lips. Robert had been chosen to speak. In books, gentlemen bought horses rather than ladies, and Cyril had already taken his turn at the Blue Boar.
        - id: ch04-b03
          speaker: robert
          text: We were told that you have a great many horses and carriages for sale.
        - id: ch04-b04
          speaker: peasemarsh
          text: You were told correctly, young man.
        - id: ch04-b05
          speaker: robert
          text: We'd like to buy some, please.
        - id: ch04-b06
          speaker: peasemarsh
          text: I'm sure you would.
        - id: ch04-b07
          speaker: robert
          text: Would you show us a few so we can choose?
        - id: ch04-b08
          speaker: peasemarsh
          text: Who are you trying to fool? Did someone send you here with a message?
        - id: ch04-b09
          speaker: robert
          text: >-
            We truly want to buy horses and carriages. A man told us you were honest and polite, but perhaps he was wrong.
        - id: ch04-b10
          speaker: peasemarsh
          text: >-
            Well, upon my sacred word! Shall I parade every horse in my stable for Your Honor? Or should I ask the Bishop whether he has one or two nags he'd care to sell you?
        - id: ch04-b11
          speaker: robert
          text: Yes, please, if it isn't too much trouble. That would be very kind.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Mr. Peasemarsh shoved both hands into his pockets and laughed. None of the children liked the sound of it. Then he shouted for Willum. A stooping stableman appeared in a doorway.
        - id: ch04-b13
          speaker: peasemarsh
          text: >-
            Come and see this young duke, Willum. He wants to buy the whole stable, every last horse and carriage. I'll wager he hasn't got two pennies to bless himself with.
        - id: ch04-b14
          speaker: narrator
          text: Willum followed his master's pointing thumb and examined Robert with contemptuous interest.
        - id: ch04-b15
          speaker: willum
          text: Does he now? Well, fancy that.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Both girls tugged at Robert's jacket and begged him to leave. Robert would not. He was furious.
        - id: ch04-b17
          speaker: robert
          text: >-
            I am not a duke, and I never claimed to be one. You say I haven't got two pennies. What do you call these?
          emotion: angry
        - id: ch04-b18
          speaker: narrator
          text: >-
            Before anyone could stop him, Robert pulled out two plump handfuls of shining guineas. Mr. Peasemarsh stared. He plucked one coin from Robert's palm, held it between finger and thumb, and bit it. Jane expected him to offer them the finest horse in the stable. The others did not expect anything so pleasant. Even they were shocked by what he said.
        - id: ch04-b19
          speaker: peasemarsh
          text: Willum, close the yard gates.
        - id: ch04-b20
          speaker: narrator
          text: Willum grinned and went to obey.
        - id: ch04-b21
          speaker: robert
          text: >-
            Good afternoon. We won't buy any of your horses now, no matter what you say. I hope this teaches you to be more civil.
        - id: ch04-b22
          speaker: narrator
          text: >-
            Robert had noticed a small side gate standing open. He moved toward it as he spoke, but Billy Peasemarsh stepped into his path.
        - id: ch04-b23
          speaker: peasemarsh
          text: Not so quickly, you little piece of rubbish. Willum, fetch the police.
        - id: ch04-b24
          speaker: narrator
          text: >-
            Willum hurried off. The children crowded together like frightened sheep while Mr. Peasemarsh scolded them and waited for the police.
        - id: ch04-b25
          speaker: peasemarsh
          text: >-
            You're a fine collection, aren't you? Coming here and tempting honest men with these guineas!
        - id: ch04-b26
          speaker: cyril
          text: They belong to us.
        - id: ch04-b27
          speaker: peasemarsh
          text: >-
            Oh, certainly. We know nothing suspicious about that, do we? Nothing at all! And you dragged these little girls into it. Listen, I'll let the girls go if you boys come quietly with the police.
        - id: ch04-b28
          speaker: jane
          text: >-
            We won't leave without the boys. The money belongs to us just as much as it belongs to them, you wicked old man.
        - id: ch04-b29
          speaker: peasemarsh
          text: Then where did you get it?
        - id: ch04-b30
          speaker: narrator
          text: >-
            His voice softened a little. That was not at all what the boys had expected after Jane called him names. Jane looked desperately at the others but said nothing.
        - id: ch04-b31
          speaker: peasemarsh
          text: >-
            What's happened to your tongue? It worked well enough when you were insulting me. Speak up. Where did the money come from?
        - id: ch04-b32
          speaker: jane
          text: We found it in the gravel pit.
        - id: ch04-b33
          speaker: peasemarsh
          text: Tell me another one.
        - id: ch04-b34
          speaker: jane
          text: >-
            It's true. A fairy lives there. It's covered in brown fur, with ears like a bat and eyes like a snail. It grants one wish every day, and the wishes really happen.
        - id: ch04-b35
          speaker: peasemarsh
          text: >-
            Poor child. She's touched in the head. That makes it even worse for you boys, pulling a sick little girl into your burglaries.
        - id: ch04-b36
          speaker: anthea
          text: >-
            She is not mad. There really is a fairy. If I see it again, I'll wish something for you. I would, anyway, if taking revenge weren't wicked. So there!
          emotion: angry
        - id: ch04-b37
          speaker: peasemarsh
          text: Mercy on us, there's another one!
        - id: ch04-b38
          speaker: narrator
          text: >-
            Willum returned with a spiteful grin. A constable followed behind him. Mr. Peasemarsh drew the officer aside and spoke for a long time in a low, urgent whisper.
        - id: ch04-b39
          speaker: constable
          text: >-
            I expect you're right. In any case, I'll arrest them for unlawfully possessing the coins while we make inquiries. The magistrate can settle the rest. The afflicted girls will likely go to a home, and the boys to a reformatory. Come along, youngsters. Making a fuss won't help. Mr. Peasemarsh, you bring the girls. I'll keep the boys in front of me.
        - id: ch04-b40
          speaker: narrator
          text: >-
            Rage and horror left the four children speechless. They were herded through the streets of Rochester. Angry, ashamed tears blurred their eyes. Robert walked straight into a passerby and did not know who she was until a familiar voice cried out.
        - id: ch04-b41
          speaker: martha
          text: >-
            Well, I never! Master Robert, what in the world have you been doing now?
        - id: ch04-b42
          speaker: lamb
          text: Panty! Want own Panty!
        - id: ch04-b43
          speaker: narrator
          text: They had walked straight into Martha and the Lamb.
    - id: ch05
      title: SUNSET AT THE POLICE STATION
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Martha behaved splendidly. She refused to believe one word of the constable's story or Mr. Peasemarsh's. They took everyone beneath an archway and ordered Robert to empty his pockets so she could see the guineas.
        - id: ch05-b02
          speaker: martha
          text: >-
            I don't see a thing. You two have lost your senses! There isn't any gold there. All I can see are the poor child's hands, covered in grime and black as a chimney. I never thought I'd live to see such a day!
        - id: ch05-b03
          speaker: narrator
          text: >-
            For a moment, the children thought Martha was being noble, even if she was also telling a lie. Then they remembered the extra wish. The Psammead had promised that servants would never notice its gifts. Martha truly could not see the gold. She was telling the truth after all, which was right and proper but not especially heroic.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Dusk was settling over Rochester when they reached the police station. The constable told his story to an inspector in a large, bare room. At one end stood something like a clumsy nursery guard, meant to hold prisoners. Robert wondered whether it was called a cell or a dock.
        - id: ch05-b05
          speaker: inspector
          text: Officer, produce the coins.
        - id: ch05-b06
          speaker: constable
          text: Empty your pockets.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Cyril thrust both hands desperately into his pockets. For one moment he stood perfectly still. Then he began to laugh. It was a strange, painful laugh that felt much more like crying. His pockets were empty. Every other pocket was empty too. The sun had set, and every piece of fairy gold had vanished.
        - id: ch05-b08
          speaker: inspector
          text: Empty them properly, and stop making that noise.
        - id: ch05-b09
          speaker: narrator
          text: >-
            Cyril turned out every pocket in his Norfolk suit, all nine of them. Not one held a coin.
        - id: ch05-b10
          speaker: inspector
          text: Well!
        - id: ch05-b11
          speaker: constable
          text: >-
            I don't know how they managed it. Crafty little beggars! They walked in front of me all the way here. I kept my eyes on them, but I didn't want to draw a crowd and block the street.
        - id: ch05-b12
          speaker: inspector
          text: This is extremely remarkable.
        - id: ch05-b13
          speaker: narrator
          text: The inspector frowned.
        - id: ch05-b14
          speaker: martha
          text: >-
            If you've finished bullying these innocent children, I'll hire a private carriage and take them home to their papa's mansion. You'll hear more about this, young man! I told you from the beginning that they had no gold, while you stood there pretending you could see it in their poor helpless hands. It's rather early in the day for a constable on duty to stop trusting his own eyes. As for the other man, the less we say, the better. He keeps the Saracen's Head, so he knows what sort of liquor he serves there.
        - id: ch05-b15
          speaker: inspector
          text: Take them away, for goodness' sake.
        - id: ch05-b16
          speaker: narrator
          text: >-
            The inspector spoke crossly to Martha. As they left, he turned on the constable and Mr. Peasemarsh with an even sharper voice. He said, "Now then!" to them at least twenty times.
        - id: ch05-b17
          speaker: narrator
          text: >-
            Martha kept her promise. Since the carrier's cart had already gone, she hired a very grand carriage and took them home. She had defended the children magnificently in front of the police. Once they were alone, though, she became furious about their wandering into Rochester without permission. None of them dared mention Mr. Crispin, who was still waiting in the city with his pony and cart.
        - id: ch05-b18
          speaker: narrator
          text: >-
            And so their day of limitless wealth ended with all four children sent to bed in deep disgrace. Their great fortune had left them only two pairs of cotton gloves, dirty on the inside from the hands they were meant to hide, one green purse made of imitation crocodile skin, and twelve penny buns that had long since been eaten.
        - id: ch05-b19
          speaker: narrator
          text: >-
            Their greatest worry was the guinea paid to Mr. Crispin. What if it had vanished at sunset along with the rest? The next day they walked down to the village. They meant to apologize for leaving him waiting in Rochester and to learn what had happened to his payment. They found the old gentleman perfectly friendly, with no complaint about the missed journey home. His guinea had not disappeared. He had bored a hole through it and hung it from his watch chain, where it had become an ornament instead of ordinary money.
        - id: ch05-b20
          speaker: narrator
          text: >-
            The children found it much harder to care what had happened to the guinea Mr. Beale took for the buns. That may not have been entirely honest, but it was understandable. Later, the matter began to trouble Anthea. At last she secretly posted twelve penny stamps to "Mr. Beale, Baker, Rochester." Her note said, "To pay for the buns."
        - id: ch05-b21
          speaker: narrator
          text: >-
            I hope Mr. Beale's guinea did disappear. He was not a pleasant pastry cook at all. Besides, any truly respectable shop sells seven penny buns for sixpence.
