        timbre: 干涩粗哑
        pace: 中慢速
        pitch: 中低音
    martha:
      display_name: 玛莎
      tts:
        delivery: 爽利泼辣，护着孩子时毫不退让
        timbre: 响亮厚实
        pace: 稍快
        pitch: 中音
    crispin:
      display_name: 克里斯平先生
      tts:
        delivery: 友善朴实，说话谨慎
        timbre: 温厚略哑
        pace: 中慢速
        pitch: 中低音
    shop_assistant:
      display_name: 女店员
      tts:
        delivery: 客气疏远，带着戒备
        timbre: 清冷平直
        pace: 中速
        pitch: 中高音
    baker:
      display_name: 比尔先生
      tts:
        delivery: 粗暴急躁，句子短促
        timbre: 粗硬
        pace: 稍快
        pitch: 中低音
    peasemarsh:
      display_name: 皮斯马什先生
      tts:
        delivery: 刻薄多疑，嘲弄时夸张
        timbre: 干瘦尖利
        pace: 中速
        pitch: 中高音
    willem:
      display_name: 威勒姆
      tts:
        delivery: 粗俗懒散，带着幸灾乐祸
        timbre: 沙哑沉闷
        pace: 中慢速
        pitch: 低音
    constable:
      display_name: 警察
      tts:
