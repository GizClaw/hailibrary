        timbre: 厚重有力
        pace: 中速
        pitch: 中低音
    inspector:
      display_name: 督察
      tts:
        delivery: 威严克制，困惑时仍不失官腔
        timbre: 低沉清晰
        pace: 中慢速
        pitch: 低音
  chapters:
    - id: ch01
      title: 第二章　金灿灿的基尼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 早晨，安西娅从一个真实得吓人的梦里醒来。梦里大雨倾盆，她没带伞，一个人在动物园里走。动物们淋得苦恼极了，一只只阴沉地低吼。她睁开眼，吼声还在，雨点也还在。原来，吼声是略微着了凉的简在沉沉呼吸。雨点呢，是一条湿浴巾的角在往她脸上滴水。罗伯特正轻轻挤那只湿角，好把她弄醒。他自己也是这么解释的。
        - id: ch01-b02
          speaker: anthea
          text: 哎呀，别闹了！
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: 罗伯特马上住了手。他毕竟不是个残忍的弟弟，只不过很会叠让人钻不进被窝的苹果派床，也很会布置恶作剧机关，发明各种叫醒熟睡亲人的办法。这些本领，当然都能给一家人带来不少欢乐。
        - id: ch01-b04
          speaker: anthea
          text: 我刚才做了个特别奇怪的梦。
        - id: ch01-b05
          speaker: jane
          text: 我也做梦了。我梦见咱们在砾石坑里挖出一个沙仙。它说自己叫普萨米德，还说每天都能替咱们实现一个新愿望，而且……
        - id: ch01-b06
          speaker: robert
          text: 可我也梦见这个了！我正想跟你们说呢。它一讲完，咱们就许了第一个愿望。你们两个姑娘傻得像驴，非要大家美得像白昼。后来咱们是美极了，也倒霉透了。
        - id: ch01-b07
          speaker: anthea
          text: 难道几个人真会做同一个梦吗？这些我全梦见了，连动物园和大雨也有。宝宝认不出咱们，仆人还把咱们关在门外。咱们漂亮得闪闪发光，模样全变了，而且……
        - id: ch01-b08
          speaker: narrator
          text: 对面的楼梯平台上传来了西里尔的声音。
        - id: ch01-b09
          speaker: cyril
          text: 罗伯特，快一点儿！不然早饭又要迟到。除非你还想像星期二那样躲掉洗澡。
        - id: ch01-b10
          speaker: robert
          text: 你过来一下。我星期二才没躲。洗澡水让人倒掉了，我是早饭后去爸爸的更衣室洗的。
        - id: ch01-b11
          speaker: narrator
          text: 西里尔衣服还没穿齐，就站到了门口。
        - id: ch01-b12
          speaker: anthea
          text: 你听着，我们几个都做了同一个怪梦，梦见找到了沙仙。
        - id: ch01-b13
          speaker: narrator
          text: 西里尔轻蔑地看了她一眼，安西娅越说声音越小。
        - id: ch01-b14
          speaker: cyril
          text: 梦？你们这些小傻瓜，那是真的。昨天的事全都发生过。我才想早点下楼。吃过早饭，咱们马上去找它，再许一个愿望。不过这一次，出门前必须先商量好。大家没同意，谁也不许抢着开口。天下无双的美貌，我再也不想试了。只要我脑子还清楚，就绝对不许！
        - id: ch01-b15
          speaker: narrator
          text: 另外三个孩子张着嘴继续穿衣服。姑娘们都觉得，如果沙仙的梦是真的，那么眼前这场明明白白的穿衣服，反而更像一场梦。简认为西里尔说得对，安西娅却还拿不准。几个孩子带着这个疑问下楼吃早饭。直到她们见到玛莎，听她清清楚楚地数落大家昨天怎么淘气，安西娅才彻底相信。昨天那些奇怪的事，原来真的不是四个人碰巧做过的同一场梦。
        - id: ch01-b16
          speaker: anthea
          text: 仆人做梦，只会梦《解梦书》里的事。不是蛇和牡蛎，就是去参加婚礼。参加婚礼代表要办丧事，蛇是虚情假意的女性朋友，牡蛎就是婴儿。
        - id: ch01-b17
          speaker: cyril
          text: 说到婴儿，羔羊宝宝在哪儿？
        - id: ch01-b18
          speaker: jane
          text: 玛莎要带他去罗切斯特见表亲，妈妈答应了。她正在给宝宝穿衣服，外套和帽子都是最漂亮的。请把黄油面包递给我。
        - id: ch01-b19
          speaker: robert
          text: 她看起来居然还挺乐意带宝宝去。
        - id: ch01-b20
          speaker: cyril
          text: 仆人最喜欢抱着小宝宝去见亲戚，我早就发现了。尤其是打扮得最漂亮的宝宝。
        - id: ch01-b21
          speaker: jane
          text: 我猜，她们会装成宝宝的妈妈，还要装成自己不是仆人，而是嫁给了身份高贵的公爵。然后就说，宝宝是小公爵，或者小公爵小姐。玛莎肯定也会这样跟表亲讲。她一定快活死了。
        - id: ch01-b22
          speaker: robert
          text: 要是她有一点儿像我，背着咱们那位小公爵走到罗切斯特，可不会快活死。绝对不会。
        - id: ch01-b23
          speaker: cyril
          text: 背着羔羊宝宝一路走到罗切斯特？我的天，我也这么想。
        - id: ch01-b24
          speaker: jane
          text: 她坐运货马车去。咱们去送送他们吧。这样又客气又好心，还能确定他们今天一整天都不在家。
        - id: ch01-b25
          speaker: narrator
          text: 于是，他们真的去送了。玛莎穿着只在礼拜日穿的双色紫裙，胸口紧得她不得不弓着背。她戴一顶蓝帽，上面有粉红矢车菊和白缎带，脖子上围着黄花边，还系了绿蝴蝶结。羔羊宝宝也穿上最漂亮的乳白绸外套，戴了最漂亮的帽子。运货马车从十字路口接走了这打扮漂亮的一大一小。白篷顶和红车轮渐渐消失在白垩尘土里。
        - id: ch01-b26
          speaker: cyril
          text: 现在就去找普萨米德！
        - id: ch01-b27
          speaker: narrator
          text: 四个孩子拔腿就走。路上，他们终于商量好了今天的愿望。大家虽然急得要命，却没从边坡爬进砾石坑，而是照大车走的安全低路绕了下去。昨天，他们在沙仙消失的地方围了一圈石头，所以很快就找到了。太阳烧得白亮，天空深蓝，没有一丝云，沙子烫得碰不得。
        - id: ch01-b28
          speaker: narrator
          text: 男孩子从沙堆里挖出昨天埋下的小铲，动手挖起来。
        - id: ch01-b29
          speaker: robert
          text: 啊，没准儿昨天到底只是一场梦。
        - id: ch01-b30
          speaker: cyril
          text: 没准儿你还是个明白人呢。这两件事一样有可能。
        - id: ch01-b31
          speaker: robert
          text: 没准儿你也能把话说得客气一点儿。
          emotion: angry
        - id: ch01-b32
          speaker: jane
          text: 要不让我们姑娘挖一会儿？你们两个好像越来越热了。
        - id: ch01-b33
          speaker: robert
          text: 要不你别拿那把傻桨伸进来搅和？
          emotion: angry
        - id: ch01-b34
          speaker: narrator
          text: 罗伯特这时确实热得火冒三丈。
        - id: ch01-b35
          speaker: anthea
          text: 我们不搅和。亲爱的罗伯特，你别生气。我们保证一句话也不说，由你告诉沙仙咱们商量好的愿望。你肯定比我们说得好。
        - id: ch01-b36
          speaker: robert
          text: 你也别装模作样了。小心，现在该用手挖！
        - id: ch01-b37
          speaker: narrator
          text: 他的口气已经不再生气。大家改用手挖。没过多久，沙仙棕色多毛的蜘蛛身子、长胳膊长腿、蝙蝠耳朵和蜗牛眼睛，全露了出来。孩子们满意地深吸一口气。这当然不可能是梦。
        - id: ch01-b38
          speaker: narrator
          text: 普萨米德坐起身，抖掉毛里的沙。
        - id: ch01-b39
          speaker: anthea
          text: 您左边的胡须今天好些了吗？
        - id: ch01-b40
          speaker: psammead
          text: 没什么值得夸的，昨晚不大安稳。不过谢谢你还惦记。
        - id: ch01-b41
          speaker: robert
          text: 我说，您今天还有力气替人实现愿望吗？除了每天照例的那个，我们还特别想多要一个。额外那个愿望特别小。
        - id: ch01-b42
          speaker: psammead
          text: 哼！你们刚才就在我头顶吵，声音还那么大。听见你们以前，我还真以为你们全是我梦出来的。我有时会做非常古怪的梦。
        - id: ch01-b43
          speaker: narrator
          text: 沙仙说的那个“哼”，你要是把故事讲出声，可一定得原样念出来，因为它当时就是这样哼的。
        - id: ch01-b44
          speaker: jane
          text: 真的吗？真希望您能给我们讲讲那些梦，肯定特别有趣。
        - id: ch01-b45
          speaker: psammead
          text: 这就是你们今天的愿望吗？
        - id: ch01-b46
          speaker: narrator
          text: 西里尔嘟囔了一句“姑娘家就是这样”，其他人都没出声。说“是”，商量好的愿望就全泡汤了。说“不是”，又太没礼貌。他们都有人教过礼貌，也的确学会了一点儿。不过，有人教过和真正学会，从来不是一回事。沙仙又开口时，大家一齐松了口气。
        - id: ch01-b47
          speaker: psammead
          text: 我要是费力气讲梦，就没法再给你们愿望了。连好脾气、常识、礼貌这种小玩意儿也给不了。
        - id: ch01-b48
          speaker: cyril
          text: 这些事千万别麻烦您，我们自己应付得来。
        - id: ch01-b49
          speaker: narrator
          text: 其他孩子心虚地互相看看，只盼沙仙别总拿好脾气说事。它真要训人，痛快训一顿也好，只要训完别再提。
        - id: ch01-b50
          speaker: psammead
          text: 好吧。先说那个小愿望。
        - id: ch01-b51
          speaker: narrator
          text: 它猛地伸出两只蜗牛眼，其中一只差点戳进罗伯特圆溜溜的眼睛。
        - id: ch01-b52
          speaker: robert
          text: 我们希望仆人不会注意到您送给我们的东西。
        - id: ch01-b53
          speaker: anthea
          text: 是您好心送给我们的东西。
        - id: ch01-b54
          speaker: robert
          text: 对，是您这么好心送给我们的东西。
        - id: ch01-b55
          speaker: narrator
          text: 沙仙把身子稍稍鼓起来，吐出一口气。
        - id: ch01-b56
          speaker: psammead
          text: 已经办好了，容易得很。反正人们平时就不怎么留意东西。下一个愿望呢？
        - id: ch01-b57
          speaker: robert
          text: 我们想要富得超过那个什么的梦想。
        - id: ch01-b58
          speaker: jane
          text: 贪欲。
        - id: ch01-b59
          speaker: psammead
          text: 没错。不过这也不会让你们得到多少好处，倒叫人放心。来吧，我不能给得超过梦想。你们要多少？金币，还是钞票？
        - id: ch01-b60
          speaker: robert
          text: 请给我们金币，要几百万枚。
        - id: ch01-b61
          speaker: psammead
          text: 装满整个砾石坑，够不够？
        - id: ch01-b62
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 够！
        - id: ch01-b63
          speaker: psammead
          text: 那就赶快出去。等我一动手，你们会活埋在金币下面。
        - id: ch01-b64
          speaker: narrator
          text: 它把瘦骨嶙峋的胳膊伸得老长，吓人地挥舞起来。孩子们拼命朝大车进坑的那条路跑。
        - id: ch01-b65
          speaker: anthea
          text: 早安！希望您的胡须明天就好起来。
        - id: ch01-b66
          speaker: narrator
          text: 只有安西娅临跑前还没完全慌掉，怯生生地补上了这句话。
        - id: ch01-b67
          speaker: narrator
          text: 到了路上，他们回头一看，只好先紧紧闭眼，再一点一点睁开。眼前亮得叫人受不了，仿佛在仲夏节的正午直盯太阳。整座沙坑从底到顶都塞满了崭新闪亮的金币，连小沙燕那些小小的家门也给埋没了。大车道拐进坑里的地方，金币像路边石头一样堆成一堆堆。两面高高的坑壁之间，金币平平铺开，又向下淌成一道金光灿烂的长坡。放眼望去，所有发亮的东西都是铸好的金币，再也看不到一块普通沙地。正午阳光照着无数硬币的边缘和侧面。光在那里闪着，跳着，热烘烘地刺进眼睛。整座采石场就像熔炉张开的口，又像夕阳里偶尔出现在天边的仙宫。
        - id: ch01-b68
          speaker: narrator
          text: 孩子们看呆了，张着嘴站在那里，谁也说不出话。最后，罗伯特停下来，从路边的金币堆上捡起一枚。他翻过来又翻过去，看了半天，才用一种完全不像自己的低沉声音开口。
        - id: ch01-b69
          speaker: robert
          text: 这不是金镑。
        - id: ch01-b70
          speaker: cyril
          text: 可它总归是金子。
        - id: ch01-b71
          speaker: narrator
          text: 这一下，大家全说起话来。他们一把把捧起黄金，让金币像水一样从指缝间流下去。叮叮当当的声音，好听得像音乐。起初，他们只顾着玩，连这些钱还能拿去买东西都忘了。简坐在两座金币堆中间，罗伯特用金币埋她，就像在海边用沙埋睡着的爸爸，那时爸爸脸上还盖着一张报纸。可是，金币还没盖到简的一半，她就叫了起来。
        - id: ch01-b72
          speaker: jane
          text: 啊，快停！这些钱太重了，压得我好疼！
          emotion: fearful
        - id: ch01-b73
          speaker: robert
          text: 胡说。
        - id: ch01-b74
          speaker: narrator
          text: 罗伯特说完，还是往她身上堆。
        - id: ch01-b75
          speaker: jane
          text: 我叫你放我出去！
          emotion: fearful
        - id: ch01-b76
          speaker: narrator
          text: 大家把简拉出来时，她脸色煞白，身子还在微微发抖。
        - id: ch01-b77
          speaker: jane
          text: 你们根本不知道那有多难受，像给石头压住了，又像身上锁着铁链。
          emotion: fearful
        - id: ch01-b78
          speaker: cyril
          text: 听着，要是真想从这些钱里得到点儿好处，咱们就不能只站着发呆。把口袋装满，去买东西。别忘了，太阳一落山，它们就留不住了。刚才真该问问普萨米德，金币会不会变成石头。对了，村里有辆小马车。
        - id: ch01-b79
          speaker: jane
          text: 你想把那辆车买下来？
        - id: ch01-b80
          speaker: cyril
          text: 不是，傻瓜，是租下来。咱们坐车去罗切斯特，把想要的东西买上一大堆。每个人能装多少就装多少。还有，这些钱不是金镑。一面是个男人的头像，另一面像黑桃尖。赶紧装口袋。你们非要说个不停，就边走边说。
        - id: ch01-b81
          speaker: narrator
          text: 西里尔坐下来，把金币往口袋里塞。
        - id: ch01-b82
          speaker: cyril
          text: 我让爸爸给这套诺福克衣服缝九个口袋，你们还笑我。现在知道有什么用了吧？
        - id: ch01-b83
          speaker: narrator
          text: 大家很快就知道了。九个口袋、手帕，还有衬衫前面的空当，全让西里尔塞满了。他只好站起来，可刚一站稳，脚下就晃了晃，又一屁股坐回地上。
        - id: ch01-b84
          speaker: robert
          text: 扔掉一点儿货吧，老兄，不然船要沉了。谁让你缝九个口袋？
        - id: ch01-b85
          speaker: narrator
          text: 西里尔只得扔掉一些。接着，他们朝村里走。路有一英里多，尘土很厚。太阳像是越来越热，口袋里的金子也越来越沉。
        - id: ch01-b86
          speaker: jane
          text: 我真不知道怎么才能花光这些钱。咱们身上肯定有几千英镑。我要把一部分藏在树篱的这个树桩后面。到了村里，咱们先买饼干吧，午饭早就错过了。
        - id: ch01-b87
          speaker: narrator
          text: 简掏出一两把金币，藏进一棵老鹅耳枥的凹洞。
        - id: ch01-b88
          speaker: jane
          text: 它们这么圆，又这么黄。要都是姜饼果子，咱们现在就能吃，那该多好。
        - id: ch01-b89
          speaker: cyril
          text: 可它们不是，咱们也吃不了。快走！
        - id: ch01-b90
          speaker: narrator
          text: 他们越走越沉，也越来越累。还没到村子，树篱里已经有好几个树桩替他们藏起了小宝库。可到了村里，他们口袋里仍有大约一千二百枚基尼。里面这样富有，外表却平常得很，谁也看不出他们每人身上会有超过半克朗的钱。暑气在路上蒸腾，树林间飘着蓝烟，村庄的红屋顶蒙在昏暗朦胧的烟气里。四个孩子走得两腿发沉，口袋也沉甸甸地拍着身子。他们一进村就坐上遇到的第一张长凳。那凳子正好在蓝野猪客栈门外。
        - id: ch01-b91
          speaker: narrator
          text: 大家决定让西里尔进客栈买姜汁啤酒。照安西娅的说法，男人进酒馆没什么不对，小孩子才不该进去，而西里尔年纪最大，比他们更接近男人。于是他进去了，另外三个坐在太阳下等。
        - id: ch01-b92
          speaker: robert
          text: 哎呀，我的帽子热死了！狗一热就伸舌头。要是咱们也伸舌头，会不会凉快点儿？
        - id: ch01-b93
          speaker: jane
          text: 可以试试。
        - id: ch01-b94
          speaker: narrator
          text: 三个人拼命把舌头伸得老长，连喉咙都绷紧了。这样只让每个路过的人都不高兴，也让他们更加口渴。他们只得把舌头收回去。正好这时，西里尔拿着姜汁啤酒回来了。
        - id: ch01-b95
          speaker: cyril
          text: 我只好花自己的两先令七便士，那本来是留着买兔子的。他们不肯换金币。我抓了一把给那个人看，他只顾笑，还说这是打牌用的筹码。我又从吧台上的玻璃罐里买了海绵蛋糕和几块葛缕子饼干。
        - id: ch01-b96
          speaker: narrator
          text: 海绵蛋糕柔软，却干巴巴的。饼干也很干，又偏偏软塌塌，而饼干本来绝不该软。好在有姜汁啤酒，什么缺点都能原谅。
        - id: ch01-b97
          speaker: anthea
          text: 现在该轮到我拿钱办事了，我是第二大的。小马车停在哪里？
        - id: ch01-b98
          speaker: narrator
          text: 车停在方格旗客栈。大家都知道，小姑娘不该进酒馆的吧台间，所以安西娅从后门去了院子。她出来时，用自己的话说，是很满意，却不骄傲。
        - id: ch01-b99
          speaker: anthea
          text: 他说马上就能把车备好，送咱们去罗切斯特，等咱们买完东西，再送咱们回来。车钱是一枚金镑，或者不管咱们这种钱叫什么。我觉得这件事办得很好。
        - id: ch01-b100
          speaker: cyril
          text: 你肯定觉得自己聪明极了。你到底怎么办成的？
        - id: ch01-b101
          speaker: anthea
          text: 反正我没聪明到一把把掏钱，让人觉得这些钱很不值钱。我只找到一个年轻人，他正拿海绵和水桶擦马腿。我举起一枚钱，问他认不认识。他说不认识，要去叫父亲。他父亲来了，说那是黑桃基尼，又问钱是不是我的，我能不能自己作主。我说能，再问起小马车。我告诉他，只要把咱们送到罗切斯特，那枚基尼就给他。他叫S·克里斯平。他答应了。
        - id: ch01-b102
          speaker: narrator
          text: 坐上漂亮的双轮小马车，沿秀丽的乡间道路飞驰，是孩子们从没体验过的事，而且非常愉快。新鲜的体验，可不见得总会让人愉快。车轮飞快转着，乡间景色从两边掠过去。一路上，每个孩子都默默盘算自己要怎样花钱，只放在心里想。谁也没把那些豪阔的打算说出来，因为让赶车的老店主听见，总觉得不大合适。照孩子们的要求，老人把他们放在桥边。
        - id: ch01-b103
          speaker: cyril
          text: 要是您想买马和马车，会去哪一家？
        - id: ch01-b104
          speaker: crispin
          text: 去撒拉逊人头像客栈，找比利·皮斯马什。不过买马这种事，愿老天别让我向谁推荐别人。换成我买，也不会听别人的推荐。可要是你们父亲要置办一套车马，整个罗切斯特找不到比比利更正直、更客气的人。这话是我说的。
        - id: ch01-b105
          speaker: cyril
          text: 谢谢您。撒拉逊人头像客栈。
        - id: ch01-b106
          speaker: narrator
          text: 这时候，孩子们开始发现，有一条自然法则像杂技演员一样倒过来，头朝下站着。每个大人都会告诉你，钱很难挣，却很容易花。仙子的钱来得毫不费力，要花掉却不只是困难，简直不可能。罗切斯特的商人见了那些亮闪闪的仙金，全都躲着走。他们多半把它叫作外国钱。
        - id: ch01-b107
          speaker: narrator
          text: 安西娅早上不巧坐坏了帽子，便先去买新帽。她看中一顶非常漂亮的，上面有粉红玫瑰和孔雀蓝的胸羽，橱窗里写着“巴黎款式，三基尼”。
        - id: ch01-b108
          speaker: anthea
          text: 这下正好。既然写的是基尼，就该收基尼，不会非要咱们没有的金镑。
        - id: ch01-b109
          speaker: narrator
          text: 安西娅拿出三枚黑桃基尼。她的手很脏，因为去砾石坑前没戴手套。年轻女店员穿着黑绸衣，死死盯着她，又走去和另一个同样穿黑绸衣、年纪更大也更难看的店员低声说了几句。接着，她们把钱退了回来，说这不是流通的钱。
        - id: ch01-b110
          speaker: anthea
          text: 这是真钱，也是我自己的。
        - id: ch01-b111
          speaker: shop_assistant
          text: 我想也是。不过现在不时兴用这种钱，我们不收。
        - id: ch01-b112
          speaker: anthea
          text: 她们一定以为钱是咱们偷的。我要是戴着手套，她们就不会觉得咱们不诚实。肯定是我的脏手让她们起了疑心。
        - id: ch01-b113
          speaker: narrator
          text: 于是，他们换了一家朴素的小店。姑娘们各买一双棉手套，每双六便士又四分之三便士。可女店主隔着眼镜看了看他们递出的基尼，说找不开。手套只好用西里尔准备买兔子的两先令七便士来付。他们还用那笔钱买了一只仿鳄鱼皮的绿色钱包，价钱是九个半便士。
        - id: ch01-b114
          speaker: narrator
          text: 他们又走进一家又一家店。有的卖玩具和香水，有的卖绸手帕和书，有的卖精美的文具盒，还有的卖附近名胜照片。孩子们原本打算把这些东西大批买下，可这一天，整个罗切斯特都没有人肯兑换哪怕一枚基尼。店主们看钱的眼神各不相同，结果却完全一样。四个百万富翁只好一次次收回金币，空着手走到下一家。他们越走越脏，头发越来越乱。简还在洒水车刚走过的湿路上滑了一跤，衣服也弄得更狼狈。大家饿得越来越厉害，却找不到肯收基尼、拿食物给他们的人。
        - id: ch01-b115
          speaker: narrator
          text: 连着在两家糕饼店碰壁以后，他们饿得实在受不了。西里尔认为，也许正是店里的蛋糕香味让他们更饿。四个人凑在一起，低声定下一套作战计划，走投无路地实行起来。他们排成一队冲进第三家糕饼店。店主叫比尔。柜台后的人还没来得及阻拦，每个孩子已经抓起三个刚出炉的一便士小圆面包，用脏手把三个面包啪地叠在一起，狠狠咬了一大口。接着，他们举着十二个面包，嘴里塞得满满的，摆好架势等着迎战。大吃一惊的糕饼店老板绕过柜台冲了出来。
        - id: ch01-b116
          speaker: cyril
          text: 喏，从这里面扣钱吧。
        - id: ch01-b117
          speaker: narrator
          text: 西里尔努力把话说清楚，把进门前准备好的一枚基尼递过去。比尔先生一把抢走金币，咬了一口，塞进了口袋。
        - id: ch01-b118
          speaker: baker
          text: 滚出去！
          emotion: angry
        - id: ch01-b119
          speaker: anthea
          text: 可您还没找钱呢？
        - id: ch01-b120
          speaker: baker
          text: 找钱？我还要找你们算账！快滚。我没叫警察来问问你们从哪儿弄到这钱，你们就该庆幸了！
          emotion: angry
        - id: ch01-b121
          speaker: narrator
          text: 四位百万富翁去了城堡花园，把圆面包吃完。面包里柔软的葡萄干甜美极了，像魔法一样让他们重新振作。刚才在糕饼店里，他们还摆出一副准备迎战的架势。现在吃饱了，勇气却没有跟着完全回来。一想到还要去撒拉逊人头像客栈，试探比利·皮斯马什肯不肯卖马和车，连最勇敢的人也有点害怕。两个男孩子已经想放弃，简却一向满怀希望，安西娅又多半非常固执。两个姑娘坚决要去，最后还是她们占了上风。
        - id: ch01-b122
          speaker: narrator
          text: 四个人一同走进撒拉逊人头像客栈。这时，他们已经脏得没法形容。在方格旗客栈时，从院子进去的办法很成功，所以他们这回也照办。皮斯马什先生就在院子里。大家事先说好由罗伯特开口，因为书里买马的总是男士，不是女士，何况西里尔在蓝野猪客栈已经轮过一次。
        - id: ch01-b123
          speaker: robert
          text: 我们听说，您有很多马和马车要卖。
        - id: ch01-b124
          speaker: peasemarsh
          text: 他们说得没错，年轻人。
        - id: ch01-b125
          speaker: narrator
          text: 皮斯马什先生身材瘦长，眼睛蓝得出奇，嘴唇很薄，嘴巴紧紧绷着。
        - id: ch01-b126
          speaker: robert
          text: 我们想买几匹马，再买几辆车。
        - id: ch01-b127
          speaker: peasemarsh
          text: 我敢说，你们当然想。
        - id: ch01-b128
          speaker: robert
          text: 能请您带我们看看吗？我们想挑几匹。
        - id: ch01-b129
          speaker: peasemarsh
          text: 你这是拿谁寻开心？是不是别人叫你来捎话的？
        - id: ch01-b130
          speaker: robert
          text: 我已经说了，我们就是来买马和马车的。有人说您为人正直，说话也客气，不过我看他可能弄错了。
        - id: ch01-b131
          speaker: peasemarsh
          text: 老天在上！要不要我把整个马厩的马都牵出来，请尊贵的大人一匹匹过目？还是派人去主教府上问问，看他肯不肯割爱一两匹马？
        - id: ch01-b132
          speaker: robert
          text: 那就请您问吧，只要不会太麻烦。您愿意这样帮忙，真是太好了。
        - id: ch01-b133
          speaker: narrator
          text: 皮斯马什先生把双手插进口袋，哈哈大笑。孩子们都不喜欢他笑起来的样子。接着，他扯开嗓门大喊。
        - id: ch01-b134
          speaker: peasemarsh
          text: 威勒姆！
        - id: ch01-b135
          speaker: narrator
          text: 一个弓着背的马夫出现在马厩门口。
        - id: ch01-b136
          speaker: peasemarsh
          text: 威勒姆，快来看看这位小公爵！他要把咱们整个马场一口吞下，马匹和车一件不留。我敢打赌，他口袋里连两个便士也没有，穷得连祝福自己的钱都掏不出来！
        - id: ch01-b137
          speaker: narrator
          text: 威勒姆顺着主人拇指指的方向看去，带着轻蔑又好奇的神情，把罗伯特打量了一遍。
        - id: ch01-b138
          speaker: willem
          text: 他还真想买，是吗？
        - id: ch01-b139
          speaker: narrator
          text: 两个姑娘都拉着罗伯特的外套，求他赶快离开。可罗伯特已经气坏了。
        - id: ch01-b140
          speaker: robert
          text: 我不是小公爵，也从没装过公爵。至于两个便士，您说这些又是什么？
          emotion: angry
        - id: ch01-b141
          speaker: narrator
          text: 别人还没来得及拦，罗伯特已经掏出满满两大把闪亮的基尼，捧给皮斯马什先生。那人认真看了，还用拇指和食指夹起一枚，一把夺过去咬了一口。简以为，他接下来会让他们随便挑马厩里最好的马。其他孩子没那么乐观。可那人冷冷开口时，就连最不抱希望的人也吃了一惊。
        - id: ch01-b142
          speaker: peasemarsh
          text: 威勒姆，把院门关上。
        - id: ch01-b143
          speaker: narrator
          text: 威勒姆咧嘴一笑，走去关门。
        - id: ch01-b144
          speaker: robert
          text: 那么，下午好。不管您接下来还想说什么，我们都不买您的马了。希望这能让您学到一点儿教训。
        - id: ch01-b145
          speaker: narrator
          text: 罗伯特说话时，看见旁边一扇小门还开着，便朝那里走。皮斯马什先生却堵住了路。
        - id: ch01-b146
          speaker: peasemarsh
          text: 别这么急着走，你这个小渣滓！威勒姆，去叫警察。
          emotion: angry
        - id: ch01-b147
          speaker: narrator
          text: 威勒姆走了。孩子们像几只受惊的羊，紧紧挤在一起。警察到来以前，皮斯马什先生一直数落他们，其中一句尤其清楚。
        - id: ch01-b148
          speaker: peasemarsh
          text: 瞧瞧你们这群好东西，拿着基尼来引诱老实人！
          emotion: angry
        - id: ch01-b149
          speaker: cyril
          text: 这些基尼本来就是我们的。
        - id: ch01-b150
          speaker: peasemarsh
          text: 哦，当然。我们完全不知道这些钱是怎么回事，一点儿都不知道。还把两个小姑娘也拖下水。听好，只要你们乖乖跟警察走，我可以放姑娘们出去。
        - id: ch01-b151
          speaker: jane
          text: 我们不要你放！除非男孩子也一起走。这些钱有他们的一份，也有我们的一份。你这个邪恶的老头！
          emotion: angry
        - id: ch01-b152
          speaker: peasemarsh
          text: 那你们说，钱是从哪儿来的？
        - id: ch01-b153
          speaker: narrator
          text: 他的语气反倒缓和了一点儿，这可不是男孩子们听到简骂人后预料的结果。简痛苦地看看其他人，谁也没有说话。
        - id: ch01-b154
          speaker: peasemarsh
          text: 怎么，舌头丢了？刚才骂人不是挺利索吗？说啊，钱从哪儿来的？
        - id: ch01-b155
          speaker: jane
          text: 从砾石坑里来的。
        - id: ch01-b156
          speaker: peasemarsh
          text: 接着编。
        - id: ch01-b157
          speaker: jane
          text: 我说的是真的。那里有个仙子，浑身都是棕色的毛，耳朵像蝙蝠，眼睛像蜗牛。它每天给我们一个愿望，而且每次都会成真。
        - id: ch01-b158
          speaker: peasemarsh
          text: 脑子有毛病，是不是？你们两个男孩把这个可怜的病孩子也拖进偷窃的勾当，那就更可耻了。
        - id: ch01-b159
          speaker: anthea
          text: 她没有疯，这都是真的。砾石坑里就是有个仙子。下次见到它，我要替你许个愿。至少，要是报复不算坏事，我就会这么做！
          emotion: angry
        - id: ch01-b160
          speaker: peasemarsh
          text: 我的老天，竟然又有一个！
        - id: ch01-b161
          speaker: narrator
          text: 威勒姆回来了，脸上挂着恶毒的笑，身后还跟着一名警察。皮斯马什先生凑近警察，声音沙哑又认真，低声讲了很久。
        - id: ch01-b162
          speaker: constable
          text: 我看你说得对。不管怎样，我先按非法持有财物把他们带走，等候调查，之后交给治安法官。两个有病的小姑娘大概会送去收容院，男孩送去教养院。好了，走吧，小家伙们。吵闹也没用。皮斯马什先生，请您带着姑娘，我来押男孩子。
        - id: ch01-b163
          speaker: narrator
          text: 四个孩子又愤怒又害怕，连话都说不出来。他们被押着穿过罗切斯特的街道。警察赶着两个男孩子走，皮斯马什先生看住两个姑娘。路上的人都能看见他们这一队，可孩子们什么也顾不上了。屈辱和愤怒的泪水遮住了眼睛。罗伯特低着头往前走，一头撞上一个行人，却没有认出对方，直到一个熟悉得不能再熟悉的声音响起来。
        - id: ch01-b164
          speaker: martha
          text: 哎哟，我可真没见过这样的事！罗伯特少爷，您这回又闯什么祸了？
          emotion: surprised
        - id: ch01-b165
          speaker: baby
          text: 豹豹，要自己的豹豹！
        - id: ch01-b166
          speaker: narrator
          text: 他们撞见的正是玛莎和羔羊宝宝。玛莎的表现精彩极了。不管警察说什么，皮斯马什先生说什么，她一个字都不信。他们走到一道拱门下，两个男人逼罗伯特掏空口袋，把基尼给她看，她照样不信。
        - id: ch01-b167
          speaker: martha
          text: 我什么也没看见。你们两个全疯了！那里根本没有金子，只有这可怜孩子的手。瞧瞧，全是黑灰和泥，活像一根烟囱。啊，没想到我这辈子还能碰上这种事！
          emotion: angry
        - id: ch01-b168
          speaker: narrator
          text: 孩子们觉得，玛莎真是高尚极了，哪怕说谎总有那么一点儿不对。接着，他们想起沙仙的保证，仆人绝不会注意到仙子送的东西。原来玛莎是真的看不见金子，句句都是实话。这样当然完全正确，只是不算格外高尚了。
        - id: ch01-b169
          speaker: narrator
          text: 他们到警察局时，天已经渐渐暗了。警察把事情讲给一位督察听。督察坐在空荡荡的大屋子里。屋子一头有样东西，像一圈笨重的育儿室壁炉栏杆，是用来关犯人的。罗伯特弄不清，那究竟是牢房，还是被告席。
        - id: ch01-b170
          speaker: inspector
          text: 警员，把那些硬币拿出来。
        - id: ch01-b171
          speaker: constable
          text: 把口袋全掏空。
        - id: ch01-b172
          speaker: narrator
          text: 西里尔绝望地把手伸进口袋，忽然站着不动了。接着，他笑了起来。那笑声古怪得叫人难受，与其说像笑，不如说更像哭。他的口袋空了，其他人的也一样。太阳落山以后，所有仙金当然全都消失了。
        - id: ch01-b173
          speaker: inspector
          text: 把口袋掏出来。别发出那种怪声。
        - id: ch01-b174
          speaker: narrator
          text: 西里尔把口袋一个个翻出来。诺福克衣服上那九个曾让他无比富有的口袋，全翻得底朝天。每一个都空空如也。
        - id: ch01-b175
          speaker: inspector
          text: 咦！
          emotion: surprised
        - id: ch01-b176
          speaker: constable
          text: 我不知道这群狡猾的小混蛋耍了什么手段。一路上，他们始终走在我前面。我看得很紧，又没让他们引来人群，堵住交通。
        - id: ch01-b177
          speaker: inspector
          text: 这可真奇怪。
        - id: ch01-b178
          speaker: martha
          text: 要是您已经欺负够这些无辜的孩子，我就雇一辆私人马车，带他们回爸爸的宅邸。年轻人，这件事还没完！我早说过，他们可怜的小手里根本没有金子，是你们硬说看见了。值勤的警察这么早就不能相信自己的眼睛，实在稀奇。至于另一个人，最好少说两句。他开的是撒拉逊人头像客栈，卖的酒究竟是什么东西，他自己最清楚。
          emotion: angry
        - id: ch01-b179
          speaker: inspector
          text: 看在老天的分上，快把他们带走吧！
          emotion: angry
        - id: ch01-b180
          speaker: narrator
          text: 可他们离开警察局时，督察又对着警察和皮斯马什先生，一连说了二十遍“喂，我说”。每一遍，都比刚才对玛莎说话更凶。
        - id: ch01-b181
          speaker: narrator
          text: 玛莎说到做到。运货马车已经走了，她便雇来一辆非常豪华的马车，带孩子们回家。方才面对警察，她寸步不让，英勇地保护他们。可是车门一关，身边只剩自己人，她的态度马上变了。她为了孩子们自个儿乱跑到罗切斯特，狠狠发了一顿火。四个人一路挨着训，谁也不敢辩解，更没人敢提村里那位赶小马车的老人。可怜的老人此刻还在罗切斯特等他们回来。
        - id: ch01-b182
          speaker: narrator
          text: 就这样，拥有无边财富的一天结束了。孩子们怀着深深的羞耻，被打发上床。早晨，他们还以为几百万枚金币能买来一切。到了晚上，那座金山连一枚也没留在口袋里。他们留下的全部财富，只有两双棉手套。戴手套时，他们的手太脏，连手套里面也弄脏了。还有一只仿鳄鱼皮钱包，以及十二个早已消化得无影无踪的一便士圆面包。
        - id: ch01-b183
          speaker: narrator
          text: 最让他们不安的是，不知道老先生收下的那枚基尼，会不会也在日落时消失。第二天，他们特意走到村里找他。一来要为没有按照约定，在罗切斯特和他会合而道歉，二来也想亲眼看看那枚基尼到底还在不在。老人对他们非常友好，并没有因为白等一场而为难他们。那枚基尼也没有消失。他还在金币上钻了一个孔，把它仔细挂在自己的表链上，留作纪念。
        - id: ch01-b184
          speaker: narrator
          text: 至于面包师收下的那一枚，孩子们觉得，它消不消失都无所谓。这或许不大诚实，不过换个角度看，也不算完全不近人情。可是后来，安西娅一直放不下这件事。她终于偷偷寄了十二枚邮票给“罗切斯特的面包师比尔先生”，信里只写了一句。
        - id: ch01-b185
          speaker: anthea
          text: 补付小圆面包的钱。
        - id: ch01-b186
          speaker: narrator
          text: 我倒希望那枚基尼真的消失了。那位糕饼店老板实在一点儿也不讨人喜欢。他收下一整枚基尼，却连该找的钱也不肯给，还反过来威胁要马上叫警察过来查问孩子们。再说，所有真正体面的店里，六便士都能买到七个一便士小圆面包呢。
