  chapters:
    - id: ch01
      title: BIGGER THAN THE BAKER'S BOY
      blocks:
        - id: ch01-b01
          speaker: cyril
          text: Listen, I've got an idea.
        - id: ch01-b02
          speaker: robert
          text: Does it hurt much?
        - id: ch01-b03
          speaker: cyril
          text: Don't be an idiot. I'm serious.
        - id: ch01-b04
          speaker: anthea
          text: Be quiet, Bobs.
        - id: ch01-b05
          speaker: robert
          text: Silence, everyone. The Squirrel is about to make a speech.
        - id: ch01-b06
          speaker: narrator
          text: >-
            They were all in the backyard. Cyril climbed onto the rim of the water barrel, balanced there, and began.
        - id: ch01-b07
          speaker: cyril
          text: >-
            Friends, Romans, countrymen, and countrywomen! We found a Sammyadd, and we've had wishes. We had wings. We were beautiful as the day, and that was thoroughly awful. We had wealth, castles, and that rotten gipsy business with the Lamb. But where has it got us? We haven't gained one thing that's truly worth having.
        - id: ch01-b08
          speaker: robert
          text: Things have happened to us. That counts for something.
        - id: ch01-b09
          speaker: cyril
          text: Not unless the right things happen. Now, I've been thinking—
        - id: ch01-b10
          speaker: robert
          text: You? Really?
        - id: ch01-b11
          speaker: cyril
          text: >-
            Yes, in the silent thingummies of the night. Wishes are like history questions. You know the date of the Conquest perfectly well until someone asks you, and then it vanishes from your head. When we're fooling around as usual, useful wishes are always popping into the mind of the person who's there to see them.
        - id: ch01-b12
          speaker: robert
          text: Hear, hear!
        - id: ch01-b13
          speaker: cyril
          text: >-
            Even if that person is very stupid. Why, Robert himself might think of a useful wish if he didn't hurt his poor little brain by trying so hard. Stop it, Bobs! You'll tip the whole thing over.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Robert's teasing led to a struggle on the edge of the water barrel. A fight in such a place is exciting, but it is also wet. When it ended and the boys had partly dried themselves, Anthea spoke.
        - id: ch01-b15
          speaker: anthea
          text: You did start it, Bobs. Now your honor is satisfied, please let Squirrel finish. We're wasting the whole morning.
        - id: ch01-b16
          speaker: narrator
          text: Cyril was still squeezing water from the tails of his jacket.
        - id: ch01-b17
          speaker: cyril
          text: All right. I'll call it peace if Bobs will.
        - id: ch01-b18
          speaker: robert
          text: Peace, then. But I've got a lump over my eye as big as a cricket ball.
        - id: ch01-b19
          speaker: narrator
          text: Anthea patiently handed him a dusty-looking handkerchief. Robert bathed his injuries without a word, and she turned back to Cyril.
        - id: ch01-b20
          speaker: anthea
          text: Go on, Squirrel.
        - id: ch01-b21
          speaker: cyril
          text: Let's play bandits, forts, soldiers, or any of our old games. If we try not to think of a wish, we're certain to think of one. That's how it always happens.
        - id: ch01-b22
          speaker: narrator
          text: The others agreed, and they quickly settled on bandits.
        - id: ch01-b23
          speaker: jane
          text: It will do as well as anything else.
        - id: ch01-b24
          speaker: narrator
          text: At first Robert made a rather gloomy bandit. Then Anthea borrowed the red-spotted handkerchief in which the gamekeeper had brought Martha mushrooms that morning. She tied it around Robert's head and made him the wounded hero who had saved the bandit captain the day before. That cheered him wonderfully.
        - id: ch01-b25
          speaker: narrator
          text: Soon everyone was armed. Bows and arrows hanging across their backs looked splendid. Umbrellas and cricket stumps stuck through their belts, making them seem armed to the teeth. A few turkey feathers gave their white country hats a wonderfully brigandish air. They covered the Lamb's mail cart with a red-and-blue checked tablecloth, and it became an excellent baggage wagon. The Lamb slept inside and caused no trouble at all. Then the whole bandit company marched down the road toward the sand pit.
        - id: ch01-b26
          speaker: cyril
          text: We should stay near the Sammyadd, in case a wish suddenly comes to us.
        - id: ch01-b27
          speaker: narrator
          text: It is easy to decide to play bandits, chess, ping-pong, or any other pleasant game. It is much harder to play with spirit when all the wonderful wishes you can and cannot imagine are waiting just around the corner. The game began to drag. Some bandits decided that the others were being disagreeable, and said so plainly. Then the baker's boy came along with a basket full of loaves. This chance was too good to miss.
        - id: ch01-b28
          speaker: cyril
          text: Stand and deliver!
        - id: ch01-b29
          speaker: robert
          text: Hand over your money, or your life!
        - id: ch01-b30
          speaker: narrator
          text: They blocked the road on either side of him. Unfortunately, the baker's boy did not join in the game. He was unusually large, even for a baker's boy.
        - id: ch01-b31
          speaker: baker_boy
          text: Knock it off, d'you hear?
        - id: ch01-b32
          speaker: narrator
          text: He shoved the bandits aside without the least respect. Robert threw Jane's skipping rope like a lasso. It missed the boy's shoulders, wrapped around his feet, and tripped him. His basket overturned. Fresh loaves bumped and bounced across the dusty white road. The girls ran after them. In another instant Robert and the baker's boy were fighting man to man, while Cyril watched to see fair play.
        - id: ch01-b33
          speaker: narrator
          text: The skipping rope twisted around their legs like an interested snake trying to make peace. It failed badly. Its boxwood handles kept springing up and striking shins and ankles, which was not peaceful at all. Yes, this was the second fight, or contest, in the chapter. I cannot help that. It was that sort of day. You know there are days when quarrels keep happening even when no one meant them to.
        - id: ch01-b34
          speaker: narrator
          text: I cannot describe the fight properly, because I never see what happens in a fight, not even when dogs are fighting. If I wrote the adventure tales that appeared in The Boys of England when I was young, Robert would certainly have won. But like George Washington, I cannot tell a lie. I cannot hide the truth even about a cherry tree, much less a fight. Robert was badly beaten for the second time that day. The baker's boy blackened his other eye. He also pulled Robert's hair and kicked his knee, though both were against every rule of fair and gentlemanly fighting. Robert always claimed he could have beaten the boy if the girls had stayed out of it. I am not certain. What followed was especially painful for boys with self-respect.
        - id: ch01-b35
          speaker: narrator
          text: Cyril was pulling off his coat so he could help his brother properly when Jane wrapped both arms around his legs. She cried and begged him not to be beaten too. That word, “too,” was bad enough for Robert. Then Anthea rushed between the fighters, caught the baker's boy around the waist, and pleaded with him to stop.
        - id: ch01-b36
          speaker: anthea
          text: Please don't hurt my brother anymore! He didn't mean it. It was only a game, and I'm sure he's terribly sorry.
          emotion: fearful
        - id: ch01-b37
          speaker: narrator
          text: This was most unfair to Robert. If the baker's boy had possessed any chivalry and accepted Anthea's humiliating apology, honor would have kept Robert from ever punishing him later. But the boy had no chivalry at all. He shoved Anthea away, then chased Robert down the road with kicks and insults. At the sand pit, one final kick sent Robert sprawling into a heap of sand.
        - id: ch01-b38
          speaker: baker_boy
          text: That'll teach you, you little pest!
          emotion: angry
        - id: ch01-b39
          speaker: narrator
          text: The baker's boy turned back to gather his loaves and continue his rounds. Jane still clung to Cyril with desperate strength, so he could do nothing without hurting her. The boy walked away red and damp in the face, abusing them to the last. He called them a pack of silly idiots and vanished around the corner. At last Jane's grip loosened. Cyril turned away in silent dignity and followed Robert. The girls came after him, crying without restraint.
        - id: ch01-b40
          speaker: narrator
          text: They threw themselves down beside Robert in the sand, a deeply unhappy party. Robert was sobbing, mostly from rage. A truly heroic boy may always be dry-eyed after a fight, but then, a truly heroic boy always wins.
        - id: ch01-b41
          speaker: narrator
          text: Cyril was angry with Jane. Robert was furious with Anthea. Both girls were miserable, and all four children detested the baker's boy. For a while, the silence was full of feeling.
        - id: ch01-b42
          speaker: narrator
          text: Robert dug hands and toes into the sand and writhed with fury.
        - id: ch01-b43
          speaker: robert
          text: Just let that coward wait until I'm grown up! The brute! I hate him, and I'll pay him back. He only won because he's bigger than I am.
          emotion: angry
        - id: ch01-b44
          speaker: jane
          text: You did start it.
        - id: ch01-b45
          speaker: robert
          text: Of course I did, silly, but I was only playing. And he kicked me. Look at this!
        - id: ch01-b46
          speaker: narrator
          text: Robert pulled down one stocking and showed them a purple bruise marked with red.
        - id: ch01-b47
          speaker: robert
          text: I only wish I were bigger than he is. That's all.
        - id: ch01-b48
          speaker: narrator
          text: He drove his fingers into the sand, then leaped up when they touched fur. It was the Psammead, of course, lying in wait to make fools of them again, as Cyril said afterward. In the next moment, Robert's wish came true. He was bigger than the baker's boy. He was much, much bigger.
        - id: ch01-b49
          speaker: narrator
          text: He was taller than the enormous policeman who once stood at the Mansion House crossing. That policeman was the largest man I had ever seen, as well as the kindest, and he helped old ladies safely across. No one had a ruler in a pocket, so they could not measure Robert. But he was taller than your father would be standing on your mother's head, which I am sure your father would never be cruel enough to do. He must have stood ten or eleven feet high, and he was as broad as a boy of that height should be.
        - id: ch01-b50
          speaker: narrator
          text: Luckily, his Norfolk suit had grown with him. There he stood inside it with one gigantic stocking rolled down, showing the enormous bruise on his vast leg. Huge tears of anger still shone on his flushed giant face. He looked so astonished, and he was so very large to be wearing a little Eton collar, that the others could not help laughing.
        - id: ch01-b51
          speaker: cyril
          text: The Sammyadd has caught us again.
        - id: ch01-b52
          speaker: robert
          text: Not us. Me. If any of you had a scrap of decent feeling, you'd ask it to make you this size too. You can't imagine how foolish it feels.
        - id: ch01-b53
          speaker: cyril
          text: I don't want to imagine it. I can see perfectly well how foolish it looks—
        - id: ch01-b54
          speaker: anthea
          text: Oh, stop! I don't know what's wrong with you boys today. Squirrel, let's be fair. Poor Bobs looks dreadful all by himself up there. We ought to ask the Sammyadd for another wish and have all of us made the same size, if it will do it.
        - id: ch01-b55
          speaker: narrator
          text: The others agreed, though without much joy. But when they found the Psammead, it refused.
        - id: ch01-b56
          speaker: psammead
          text: Certainly not. He's a rude, violent boy, and being the wrong size for a while will do him good. Why did he dig me up with those horrible wet hands? He nearly touched me! He's a complete savage. A Stone Age boy would have known better.
          emotion: angry
        - id: ch01-b57
          speaker: narrator
          text: Robert's hands were wet with tears.
        - id: ch01-b58
          speaker: psammead
          text: Now go away and let me rest. Why can none of you wish for something sensible, such as food, drink, good manners, or better tempers? Go on. Be off with you!
          emotion: angry
        - id: ch01-b59
          speaker: narrator
          text: It almost snarled, shook its whiskers, and turned a sulky brown back on them. Even the most hopeful child knew that further argument was useless. They returned to the enormous Robert.
        - id: ch01-b60
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: What are we going to do now?
        - id: ch01-b61
          speaker: robert
          text: First, I'm going to reason with that baker's boy. I'll catch him at the end of the road.
        - id: ch01-b62
          speaker: cyril
          text: Don't hit someone smaller than you, old man.
        - id: ch01-b63
          speaker: robert
          text: Do I look as if I'd hit him? I'd kill him if I did. But I mean to give him something to remember. Wait while I pull up my stocking.
        - id: ch01-b64
          speaker: narrator
          text: His stocking was now as big as a small pillowcase. He pulled it up and strode away. Each step covered six or seven feet. By the time the baker's boy came downhill with his empty basket, on his way to meet the bread cart, Robert was waiting at the end of the road.
        - id: ch01-b65
          speaker: narrator
          text: Robert hid behind a haystack in the corner farmyard. He heard the boy coming and whistling. Then he sprang out and seized him by the collar.
        - id: ch01-b66
          speaker: robert
          text: Now I'm going to teach you not to kick boys who are smaller than you.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Robert's voice had grown about four times as large, just like the rest of him. He lifted the baker's boy onto the top of the haystack, sixteen feet above the ground. Then Robert sat on the cowshed roof and told the boy exactly what he thought of him. The boy may not have heard every word, because he was frozen with terror. Robert said everything he could think of, repeated some of it, and then shook him.
        - id: ch01-b68
          speaker: robert
          text: Now get down however you can.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Robert left him there. I do not know how the baker's boy climbed down. I do know that he missed his master's cart and got into the hottest possible trouble when he finally reached the bakery. Perhaps you feel sorry for him. Still, someone had to teach him that English boys fight with their fists, not their feet.
        - id: ch01-b70
          speaker: narrator
          text: >-
            His trouble only grew when he tried to explain to his master that the boy he had beaten was followed by a giant as tall as a church. No one could believe a tale like that. They believed it the next day, but by then it was too late to help the baker's boy.
        - id: ch01-b71
          speaker: narrator
          text: >-
            Robert found the others in the garden. Anthea had wisely asked Martha to serve dinner outside. The dining room was rather small, and fitting a brother Robert's size inside would have been extremely awkward. The Lamb had slept peacefully through the whole stormy morning. Now he was sneezing. Martha decided he had a cold and would be better off indoors.
        - id: ch01-b72
          speaker: cyril
          text: That's just as well. If the Lamb saw you at that dreadful size, I don't believe he'd ever stop screaming.
        - id: ch01-b73
          speaker: narrator
          text: >-
            Robert was what a draper would call an outsize boy. He could step straight over the iron gate at the front of the garden without touching it. Martha brought dinner outside. There was cold veal with baked potatoes, followed by sago pudding and stewed plums.
        - id: ch01-b74
          speaker: narrator
          text: >-
            Of course, Martha saw Robert at his ordinary size. She gave him his ordinary serving of meat and potatoes, and not a bite more. You cannot imagine how small your usual dinner looks when you are several times your proper size. Robert groaned and asked for more bread. Martha would not keep bringing bread forever. She was in a hurry because the gamekeeper planned to call on his way to Benenhurst Fair, and she wanted to be smartly dressed before he arrived.
        - id: ch01-b75
          speaker: robert
          text: I wish we were going to the fair.
        - id: ch01-b76
          speaker: cyril
          text: You can't go anywhere at that size.
        - id: ch01-b77
          speaker: robert
          text: Why not? Fairs have giants much bigger than I am.
        - id: ch01-b78
          speaker: cyril
          text: No, they certainly do not—
        - id: ch01-b79
          speaker: narrator
          text: >-
            Jane suddenly screamed so loudly that everyone thumped her back and asked whether she had swallowed a plum stone.
        - id: ch01-b80
          speaker: jane
          text: >-
            No, it isn't a plum stone. I've had an idea! Let's take Robert to the fair and charge people to see him. Then we'll finally get something useful from the old Sammyadd.
          emotion: surprised
        - id: ch01-b81
          speaker: robert
          text: Take me? I'm far more likely to take all of you.
        - id: ch01-b82
          speaker: narrator
          text: >-
            That was exactly what happened. Jane's idea appealed irresistibly to everyone except Robert. Even he came around when Anthea suggested that he should receive two shares of whatever money they made.
        - id: ch01-b83
          speaker: narrator
          text: >-
            A little old pony cart stood in the coach house, the sort called a governess cart. They wanted to reach the fair as quickly as possible, so Robert agreed to push the others in it. His enormous steps carried him along very fast indeed. Wheeling the cart felt no harder to him now than wheeling the Lamb's little mail cart had that morning. The Lamb's cold kept him from joining the party.
        - id: ch01-b84
          speaker: narrator
          text: >-
            Being pushed in a pony cart by a giant was a strange feeling. Everyone enjoyed the journey except Robert and the few people they passed on the road. Most of those people stiffened where they stood in what Anthea called standing-up fits. Just outside Benenhurst, Robert hid among the hay in a barn. The other three continued to the fair without him.
        - id: ch01-b85
          speaker: narrator
          text: >-
            Swings rocked above the crowd. A merry-go-round hooted, tooted, and blared. There was a shooting gallery and a coconut shy. Cyril felt a powerful urge to win a coconut, or at least to try, but he resisted it. He approached the woman who was loading little guns. Behind her, glass bottles hung on strings against a sheet of canvas.
        - id: ch01-b86
          speaker: rebecca
          text: Step right up, young gentleman! One penny a shot!
        - id: ch01-b87
          speaker: cyril
          text: No, thank you. We're here on business, not pleasure. Who is in charge?
        - id: ch01-b88
          speaker: rebecca
          text: Who is what?
        - id: ch01-b89
          speaker: cyril
          text: The master. The head of the fair. The boss of the show.
        - id: ch01-b90
          speaker: rebecca
          text: >-
            Him over there, asleep in the sun. I wouldn't wake him too suddenly. His temper goes contrary in hot weather. Better take a shot while you wait.
        - id: ch01-b91
          speaker: cyril
          text: This is important, and it could make him a great deal of money. He'll be sorry if we take it somewhere else.
        - id: ch01-b92
          speaker: rebecca
          text: Money in his pocket, is it? You're not joking? What have you got?
        - id: ch01-b93
          speaker: cyril
          text: A giant.
        - id: ch01-b94
          speaker: rebecca
          text: You are joking!
        - id: ch01-b95
          speaker: anthea
          text: Come and see for yourself.
        - id: ch01-b96
          speaker: narrator
          text: >-
            The woman looked doubtful. She called over a ragged little girl in striped stockings and a dirty white petticoat hanging below a brown dress. The woman left her to load the guns and guard the shooting gallery, then turned to Anthea.
        - id: ch01-b97
          speaker: rebecca
          text: >-
            Well, hurry up. If this is a joke, you'd better admit it. I'm mild as milk, but my Bill is a proper terror, and—
        - id: ch01-b98
          speaker: anthea
          text: >-
            He truly is a giant. He's a giant little boy, and he wears a Norfolk suit like my brother's. We left him outside the fair because people stare and go into those standing-up fits when they see him. We thought you might show him for pennies and pay us something. It would need to be quite a lot, because we promised him a double share.
        - id: ch01-b99
          speaker: narrator
          text: >-
            The woman muttered several strange words that carried no clear meaning for the children. All the while, she held Anthea's hand very tightly. Anthea could not help wondering what would happen if Robert wandered away, or if he became his proper size before they reached the barn. But she knew the Psammead's gifts truly lasted until sunset, however inconvenient their lasting might be. Besides, somehow she did not think Robert would care to go anywhere alone while he was so huge.
        - id: ch01-b100
          speaker: narrator
          text: >-
            At the barn, Cyril called to Robert. The loose hay stirred, and Robert began to come out. His hand and arm appeared first. Then a foot and leg followed, each much larger than the woman expected.
        - id: ch01-b101
          speaker: rebecca
          text: My goodness!
          emotion: surprised
        - id: ch01-b102
          speaker: narrator
          text: >-
            Then, by slow and heavy degrees, Robert's entire enormous body emerged from the barn. The woman drew a long breath. She poured out so many astonished words that the children understood hardly any of them. Her earlier strange muttering now sounded quite ordinary by comparison. At last she returned to plain English.
        - id: ch01-b103
          speaker: rebecca
          text: >-
            What will you take for him? Anything reasonable! We'd have a special wagon built. I know a secondhand one that belonged to a baby elephant before it died, and it could be done up beautifully. Name your price. He's soft in the head, isn't he? Most giants are, though I've never seen one like him. We'll treat him like a king, feed him first-rate food, and give him a duke's own bed. He must be dotty if he needs children to cart him around. Tell me what you'll take, cash in hand!
        - id: ch01-b104
          speaker: robert
          text: >-
            They won't take anything. I'm no softer than you are, and probably less so. I'll be in your show for today if you give me fifteen shillings.
        - id: ch01-b105
          speaker: narrator
          text: >-
            Robert hesitated before naming such an enormous price.
        - id: ch01-b106
          speaker: rebecca
          text: >-
            Done! Come meet my Bill, and we'll settle a price for the whole season. I dare say you might earn as much as two pounds every week, regular. Come along now, and for goodness' sake, make yourself as small as you possibly can!
        - id: ch01-b107
          speaker: narrator
          text: >-
            Her quick agreement made Robert feel he had cheated himself. He wished he had asked for thirty shillings. Robert could not make himself very small, no matter how he tried. A crowd gathered at once. At the head of an excited procession, he entered the trampled fairground and crossed its dry, stubbly yellow grass to the largest tent. Robert crept inside, and Rebecca went to fetch Bill, the big man who had been sleeping in the sun.
        - id: ch01-b108
          speaker: narrator
          text: >-
            Bill was not pleased to be woken. Through a slit in the tent, Cyril saw him scowl, shake his sleepy head, and raise a heavy fist. Rebecca talked very fast. Cyril heard her swear that Robert would be the biggest attraction Bill had ever had. Now Cyril shared Robert's feeling that fifteen shillings was much too little.
        - id: ch01-b109
          speaker: narrator
          text: >-
            Bill slouched into the tent. At the sight of Robert's magnificent size, he said very little.
        - id: ch01-b110
          speaker: bill
          text: Strike me pink!
          emotion: surprised
        - id: ch01-b111
          speaker: narrator
          text: >-
            Then he counted out fifteen shillings, mostly in sixpences and pennies, and gave the money to Robert.
        - id: ch01-b112
          speaker: bill
          text: >-
            We'll settle your share after tonight's show. You'll be so happy with us, you'll never want to leave. Can you sing a song, or do a little dance?
        - id: ch01-b113
          speaker: robert
          text: Not today.
        - id: ch01-b114
          speaker: narrator
          text: >-
            Robert rejected the thought of singing “As Once in May,” his mother's favorite and the only song that came to mind.
        - id: ch01-b115
          speaker: bill
          text: >-
            Levi, clear those pictures out of here! Empty the tent and hang a curtain or something. What a shame we haven't got tights his size, but we'll have some before the week is over. Young man, you've made your fortune. It's a good thing you came to me instead of certain fellows I know. Some men beat their giants and starve them too. I'll tell you plainly, you've never been luckier in your life. I'm a lamb, I am. I won't deceive you.
        - id: ch01-b116
          speaker: robert
          text: >-
            I'm not afraid of anyone beating me. But I'm terribly hungry. Please get me something to eat.
        - id: ch01-b117
          speaker: narrator
          text: >-
            Robert had to crouch on his knees because the tent was too low for him to stand upright. Even in that position, he could look down on nearly everyone, including the hoarse showman who called himself a lamb.
        - id: ch01-b118
          speaker: bill
          text: Rebecca, get him food, and give him the best we've got!
        - id: ch01-b119
          speaker: narrator
          text: >-
            Bill whispered to Rebecca about putting something down in black and white first thing the next morning. She returned with bread and cheese. That was all, but it tasted delightful to the large and empty Robert. Meanwhile, Bill posted guards around the tent. Their orders were to raise the alarm if Robert attempted to escape with his fifteen shillings.
        - id: ch01-b120
          speaker: anthea
          text: As though we weren't honest!
        - id: ch01-b121
          speaker: narrator
          text: >-
            Then a very strange and wonderful afternoon began. Bill knew his business. The photographic views, the viewing glasses that made the pictures seem almost real, and the lamps that lit them were quickly packed away. An old red-and-black carpet became a curtain across the tent, with Robert hidden behind it. Outside, Bill climbed onto a trestle table and made a speech. It was rather a good speech.
        - id: ch01-b122
          speaker: bill
          text: >-
            Ladies and gentlemen! Today I have the great privilege of presenting the eldest son of the Emperor of San Francisco. An unhappy love affair with the Duchess of the Fiji Islands forced him to leave his own country. Now he has taken refuge in England, the land of liberty, where freedom is the right of every man, no matter how large that man may be! The first twenty people who reach this tent door will see the giant for threepence each. After that, the price goes up, and I make no promise about how high it may rise. Now is your chance!
        - id: ch01-b123
          speaker: narrator
          text: >-
            A young man spending his afternoon out with his sweetheart stepped forward first. For this occasion, he took on a princely manner. No expense would be spared. Money was no object. If his girl wanted to see the giant, she would see the giant, even though it cost threepence each and every other entertainment at the fair cost only a penny.
        - id: ch01-b124
          speaker: narrator
          text: >-
            Bill raised the flap and the couple entered the tent. The very next moment, the girl's wild scream thrilled through everyone waiting outside. Bill slapped his leg with delight and whispered to Rebecca.
        - id: ch01-b125
          speaker: bill
          text: That's done the trick!
          emotion: happy
        - id: ch01-b126
          speaker: narrator
          text: >-
            Her scream was an excellent advertisement for the wonders of Robert. The girl came out pale and trembling, and a curious crowd closed around the tent and pressed her for an account.
        - id: ch01-b127
          speaker: bailiff
          text: What was it like?
        - id: ch01-b128
          speaker: young_woman
          text: >-
            Oh, horrible! You wouldn't believe it. He's as big as a barn and terribly fierce. The sight of him froze my blood. I wouldn't have missed it for anything.
          emotion: fearful
        - id: ch01-b129
          speaker: narrator
          text: The terrible fierceness she described had only been Robert trying very hard not to laugh.
        - id: ch01-b130
          speaker: narrator
          text: >-
            Soon he stopped wanting to laugh. Before sunset he felt much more like crying, and more like sleeping than either. People entered one, two, and three at a time all afternoon. Robert had to shake hands with everyone who wished it. He had to sit still while people punched and pulled him, then patted and thumped him, all so they could satisfy themselves that he was a real giant.
        - id: ch01-b131
          speaker: narrator
          text: >-
            The other children sat on a bench, watching and waiting until they were terribly bored. It seemed to them that this was the hardest way of earning money anyone had ever invented. And all for fifteen shillings. Bill had already collected four times that amount. News of the giant spread through the country. Tradespeople came from near and far in carts, and gentlefolk arrived in carriages.
        - id: ch01-b132
          speaker: narrator
          text: >-
            One gentleman wore an eyeglass and a very large yellow rose in his buttonhole. He leaned close to Robert and made a generous offer in an obliging whisper.
        - id: ch01-b133
          speaker: gentleman
          text: I'll pay you ten pounds a week to appear at the Crystal Palace.
        - id: ch01-b134
          speaker: robert
          text: >-
            I'm sorry, but I can't. There's no sense promising something I can't do.
        - id: ch01-b135
          speaker: gentleman
          text: >-
            Ah, poor fellow. Bound by a contract for years, I suppose. Well, here is my card. When your term is over, come straight to me.
        - id: ch01-b136
          speaker: robert
          text: I will, if I'm still this size.
        - id: ch01-b137
          speaker: gentleman
          text: A little more growth would only improve matters.
        - id: ch01-b138
          speaker: narrator
          text: >-
            After the gentleman left, Robert beckoned Cyril closer.
        - id: ch01-b139
          speaker: robert
          text: Tell them I must have a rest, and I mean to have one. And tell them I want my tea.
        - id: ch01-b140
          speaker: narrator
          text: >-
            They brought tea, then hurriedly pinned a paper notice to the tent. It announced that the show was closed for half an hour while the giant had his tea. Inside, the children held a quick council.
        - id: ch01-b141
          speaker: robert
          text: How in the world am I going to escape? I've been trying to work that out all afternoon.
        - id: ch01-b142
          speaker: cyril
          text: >-
            Walk out after sunset, when you're your proper size. They can't do anything to us.
        - id: ch01-b143
          speaker: narrator
          text: Robert stared at him.
        - id: ch01-b144
          speaker: robert
          text: >-
            They'd nearly kill us when they saw me shrink. No, we must be alone at sunset. We need another plan.
        - id: ch01-b145
          speaker: cyril
          text: I know what to do.
        - id: ch01-b146
          speaker: narrator
          text: >-
            Cyril went to the tent entrance. Bill stood just outside, smoking a clay pipe and talking softly to Rebecca. Cyril heard him say that finding the giant was as good as having a fortune left to them.
        - id: ch01-b147
          speaker: cyril
          text: >-
            You can admit people again in a minute. He's nearly finished his tea. But he must be alone when the sun goes down. He gets very strange then, and if anyone bothers him, I won't answer for what happens.
        - id: ch01-b148
          speaker: bill
          text: What happens to him?
        - id: ch01-b149
          speaker: cyril
          text: >-
            I don't know exactly. It's a sort of change. He isn't himself at all. You'd hardly recognize him. Someone will get hurt if he isn't alone around sunset.
        - id: ch01-b150
          speaker: narrator
          text: Every word of that was true.
        - id: ch01-b151
          speaker: bill
          text: He'll be all right for the evening, I suppose?
        - id: ch01-b152
          speaker: cyril
          text: Oh, yes. Half an hour after sunset, he'll be completely himself again.
        - id: ch01-b153
          speaker: rebecca
          text: Best keep him happy, Bill.
        - id: ch01-b154
          speaker: narrator
          text: >-
            About half an hour before sunset, by Cyril's estimate, the tent closed again while the giant ate his supper. The crowd was greatly amused by the giant's meals and by the very short time between them.
        - id: ch01-b155
          speaker: bill
          text: Well, he can certainly eat. A fellow his size has to fill himself properly.
        - id: ch01-b156
          speaker: narrator
          text: Inside the tent, the four children breathlessly arranged their escape.
        - id: ch01-b157
          speaker: cyril
          text: >-
            You girls must leave now and go home as fast as you can. Forget the wretched pony cart. We'll fetch it tomorrow. Robert and I are dressed alike, so we'll manage somehow, the way Sydney Carton did. But you girls have to get out, or none of it will work. We can run and you can't, whatever you may think. And no, Jane, Robert cannot rush out and knock everyone down. The police would follow him until he became his proper size, then arrest him in an instant. You must go. If you don't, I'll never speak to you again. Really, you put us in this mess by clinging around people's legs this morning. Now go, I tell you!
        - id: ch01-b158
          speaker: narrator
          text: Jane and Anthea went to Bill.
        - id: ch01-b159
          speakers: [jane, anthea]
          ensemble: duo
          text: We're going home. We'll leave the giant with you. Please be kind to him.
        - id: ch01-b160
          speaker: narrator
          text: >-
            Anthea later admitted that this was very deceitful. Still, what else could they do? Once the girls were gone, Cyril approached Bill.
        - id: ch01-b161
          speaker: cyril
          text: >-
            He wants some ears of corn from the field beyond the next one. I'll run and get them. Could you lift the back of the tent a little? He says he's suffocating and needs a breath of air. I'll make sure no one peeks in. Cover him up so he can sleep while I fetch the corn. He insists on having it, and there's no stopping him when he gets like this.
        - id: ch01-b162
          speaker: narrator
          text: >-
            They made the giant comfortable under a heap of sacks and an old tarpaulin. The back of the tent was raised to let in air, and the brothers were left alone to finish their plan in whispers. Outside, the merry-go-round blared its comic music and gave a sudden scream now and then to attract attention.
        - id: ch01-b163
          speaker: narrator
          text: >-
            Half a minute after the sun went down, a boy in a Norfolk suit walked out through the front of the tent and passed Bill.
        - id: ch01-b164
          speaker: cyril
          text: I'm going to fetch the corn.
        - id: ch01-b165
          speaker: narrator
          text: >-
            He slipped quickly into the fairground crowd. At that same instant, another boy came through the raised curtain and passed Rebecca, who stood guard behind the tent.
        - id: ch01-b166
          speaker: robert
          text: I'm going after the corn.
        - id: ch01-b167
          speaker: narrator
          text: >-
            He too moved quietly away and was lost among the people. Cyril was the boy who had left by the front. Robert was the boy from the back, now restored to his proper size because the sun had set.
        - id: ch01-b168
          speaker: narrator
          text: >-
            The boys walked quickly across the field and along the road until Robert caught up with Cyril. Then they ran. They reached home at the same time as the girls. It was a long way from the fair, and all four children had run for most of it.
        - id: ch01-b169
          speaker: narrator
          text: >-
            They learned exactly how long the way was next morning. They had to walk back to the fair and drag the pony cart all the way home. There was no enormous Robert to wheel them along as easily as the Lamb in his mail cart, with the children as babies and Robert as their gigantic nursemaid.
        - id: ch01-b170
          speaker: narrator
          text: >-
            I cannot possibly tell you what Bill and Rebecca said when they pulled away the sacks and discovered that their giant had disappeared. For one thing, I was not there. For another, I simply do not know.
