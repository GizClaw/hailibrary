audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带一点含蓄的幽默
        timbre: 温暖清亮
        pace: 从容而有变化
        pitch: 中音
    cyril:
      display_name: 西里尔
      tts:
        delivery: 自信爽快，像个爱拿主意的大孩子
        timbre: 明亮结实
        pace: 稍快
        pitch: 中高音
    anthea:
      display_name: 安西娅
      tts:
        delivery: 认真体贴，着急时干脆利落
        timbre: 清澈柔韧
        pace: 中速
        pitch: 中高音
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，偶尔一本正经
        timbre: 清亮饱满
        pace: 中速
        pitch: 中音
    jane:
      display_name: 简
      tts:
        delivery: 天真敏感，想象丰富
        timbre: 轻柔明亮
        pace: 中速
        pitch: 高音
    martha:
      display_name: 玛莎
      tts:
        delivery: 爽利泼辣，护着孩子时毫不退让
        timbre: 响亮厚实
        pace: 稍快
        pitch: 中音
    psammead:
      display_name: 赛米阿德
      tts:
        delivery: 古怪不耐烦，讥讽里带着老资格的神气
        timbre: 干涩沙哑
        pace: 中速
        pitch: 中低音
    bakery_boy:
      display_name: 面包店伙计
      tts:
        delivery: 粗鲁蛮横，受惊后慌乱发虚
        timbre: 粗重年轻
        pace: 稍快
        pitch: 中低音
    becca:
      display_name: 贝卡
      tts:
        delivery: 精明泼辣，招揽生意时热切夸张
        timbre: 响亮略沙
        pace: 快速
        pitch: 中高音
    bill:
      display_name: 比尔
      tts:
        delivery: 油滑老练，嗓门里带着生意人的热络
        timbre: 低沉沙哑
        pace: 中速
        pitch: 低音
    young_woman:
      display_name: 看巨人的姑娘
      tts:
        delivery: 胆小易惊，激动时语不成句
        timbre: 清脆纤细
        pace: 稍快
        pitch: 高音
    constable:
      display_name: 法警
      tts:
        delivery: 好奇直接，带着公事口吻
        timbre: 稳重厚实
        pace: 中速
        pitch: 中低音
    gentleman:
      display_name: 戴单片眼镜的绅士
      tts:
        delivery: 客气自信，像在认真谈一桩体面的买卖
        timbre: 圆润文雅
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 第八章　比面包店伙计还高大
      blocks:
        - id: ch01-b01
          speaker: cyril
          text: 听我说，我有个主意。
        - id: ch01-b02
          speaker: robert
          text: 怎么，疼得很厉害吗？
        - id: ch01-b03
          speaker: cyril
          text: 别犯傻！我说的是正经事。
        - id: ch01-b04
          speaker: anthea
          text: 鲍勃斯，别插嘴。
        - id: ch01-b05
          speaker: robert
          text: 好吧，大家安静，听松鼠演说。
        - id: ch01-b06
          speaker: narrator
          text: 四个孩子正好都在后院。西里尔站到水桶边上，稳住身子，像个真正的演说家似的开了口。
        - id: ch01-b07
          speaker: cyril
          text: 朋友们，罗马人，同胞们，还有女同胞们！咱们找到了赛米阿德，也许过不少愿。咱们长过翅膀，美得像白昼一样，那次可真够受的。咱们有过财富，有过城堡，还碰上小羊羔被吉卜赛人带走的倒霉事。可折腾了这么久，咱们连一样真正有用的东西都没留下。
        - id: ch01-b08
          speaker: robert
          text: 可咱们经历了不少事呀，这多少也算收获吧。
        - id: ch01-b09
          speaker: cyril
          text: 要是发生的不是该发生的事，那还不够。这些天我一直在想……
        - id: ch01-b10
          speaker: robert
          text: 你真的会想吗？
        - id: ch01-b11
          speaker: cyril
          text: 我在夜晚寂静的……反正就是那个什么里想。这就像别人忽然问你，诺曼征服是哪一年。你平常明明知道，真问到头上，答案反倒全跑了。女士们，先生们，咱们平时只顾胡闹，事情自己找上门来，看见它的人自然就会想到真正要紧的愿望。
        - id: ch01-b12
          speaker: robert
          text: 说得好！
        - id: ch01-b13
          speaker: cyril
          text: 不管看见的人有多蠢，哪怕是罗伯特，只要不硬逼着他那点儿可怜的小脑筋想个不停，说不定也会碰巧想出一个真正有用的愿望。鲍勃斯，我叫你别出声！你快把整场演说搅坏了。
        - id: ch01-b14
          speaker: narrator
          text: 两个男孩就在水桶边扭打起来。这当然很刺激，只是免不了弄得浑身湿透。架打完了，两人勉强擦了擦身上的水，安西娅才重新开口。
        - id: ch01-b15
          speaker: anthea
          text: 本来就是你先动手，鲍勃斯。现在面子也挣够了，让松鼠接着讲吧。咱们已经快把整个上午都浪费了。
        - id: ch01-b16
          speaker: cyril
          text: 行。只要鲍勃斯肯停战，我也肯。
        - id: ch01-b17
          speaker: robert
          text: 那就停战。不过我眼睛上边鼓了个包，简直跟板球一样大。
        - id: ch01-b18
          speaker: narrator
          text: 安西娅耐心地递给他一块灰扑扑的手帕。罗伯特一声不响，把手帕敷在伤处。
        - id: ch01-b19
          speaker: anthea
          text: 好了，松鼠，你接着说。
        - id: ch01-b20
          speaker: cyril
          text: 咱们就玩强盗、要塞或者打仗，随便挑一种老游戏。只要别故意想着愿望，好主意准会自己冒出来。以前不都是这样吗？
        - id: ch01-b21
          speaker: narrator
          text: 大家都同意了，很快选定玩强盗。
        - id: ch01-b22
          speaker: jane
          text: 反正玩什么都一样。
        - id: ch01-b23
          speaker: narrator
          text: 得承认，罗伯特起初只肯做个没精打采的强盗。后来安西娅向玛莎借来一块带红点的手帕。这天早晨，看守人送蘑菇来时，正是用它包着蘑菇。安西娅把手帕扎在罗伯特头上，说他是昨天救过强盗头子的负伤英雄，他马上来了精神。没过多久，人人都武装好了。弓箭背在身后，看上去十分神气。雨伞和板球门柱插在腰带里，更是活像武装到了牙齿。乡下男人常戴的白棉帽，只要插上几根火鸡羽毛，也有了十足的绿林好汉气派。小羊羔躺在童车里熟睡，丝毫不碍事。车上蒙着红蓝格子桌布，成了一辆再好不过的辎重车。强盗一伙就这样沿着通往沙坑的路出发了。
        - id: ch01-b24
          speaker: cyril
          text: 咱们最好别离赛米阿德太远。万一突然想到一个愿望呢？
        - id: ch01-b25
          speaker: narrator
          text: 决定玩一种有趣的游戏很容易，可只要想到拐角那边有数不清的神奇愿望等着，谁还能专心玩下去？强盗游戏很快就没意思了。几个强盗越看同伴越讨厌，还当面说了出来。就在这时，面包店伙计挎着一篮面包沿路走来。这样的机会当然不能放过。
        - id: ch01-b26
          speaker: cyril
          text: 站住！把东西交出来！
        - id: ch01-b27
          speaker: robert
          text: 要钱还是要命！
        - id: ch01-b28
          speaker: narrator
          text: 两个男孩从左右两边拦住他。可这个格外高大的伙计一点儿也不想陪他们玩。
        - id: ch01-b29
          speaker: bakery_boy
          text: 都给我滚开，听见没有！
          emotion: angry
        - id: ch01-b30
          speaker: narrator
          text: 他粗鲁地把小强盗们推到一旁。罗伯特马上抡起简的跳绳去套他，本想套住肩膀，绳子却缠住了他的双脚，把他绊倒在路上。篮子翻了，新鲜面包在满是尘土的白垩土路上滚得到处都是。女孩们赶紧去捡，罗伯特已经跟伙计一对一打了起来，西里尔站在旁边监督，非要这场架打得公平不可。
        - id: ch01-b31
          speaker: narrator
          text: 跳绳像一条热心劝架的蛇，绕着两人的腿扭来扭去。可它一点儿忙也没帮上，两个黄杨木手柄还不停敲打他们的小腿和脚踝，怎么也算不上在维护和平。这已经是本章第二场架了，或者照更体面的说法，第二场较量。可这一天偏偏就是这样。有些日子，争吵会一场接一场地找上门来，根本不管你愿不愿意。我又不会写《英国男孩》杂志里那种精彩的冒险故事，没法把打斗讲得有声有色。打架时到底发生了什么，我一向看不清，哪怕打架的只是两条狗。再说，要是我真是给那本杂志写故事的人，最后赢的当然该是罗伯特。可是我跟乔治·华盛顿一样，不会说谎，哪怕只是为了樱桃树也不行，更别说为了一场架了。所以我只能老实告诉你，罗伯特这天第二次挨了痛打。
        - id: ch01-b32
          speaker: narrator
          text: 面包店伙计打青了他的另一只眼睛，还揪头发、踢膝盖，把公平和绅士风度全扔到一边。罗伯特后来总说，要不是女孩们碍事，他一定会赢。我可不大相信。西里尔正要脱外套，像样地去帮弟弟，简却抱住他的双腿，哭着求他别也上去挨打。那个“也”字已经够伤罗伯特的心了，安西娅接下来的举动更叫他难受。她冲到两人中间，一把抱住伙计的腰。
        - id: ch01-b33
          speaker: anthea
          text: 求求你，别再打我哥哥了！他不是故意的，我们只是在玩。他现在一定后悔极了。
          emotion: sad
        - id: ch01-b34
          speaker: narrator
          text: 这话对罗伯特实在不公平。要是伙计有一点正直侠义的心肠，听从安西娅的哀求，接受她这番让罗伯特难堪的道歉，罗伯特以后碍于荣誉，就再不能把他怎么样。即使罗伯特真担心这一点，也很快不用担心了。这个伙计心里根本没有侠义二字。他猛地推开安西娅，一路踢着、骂着，把罗伯特追下大路，直追到沙坑，最后又补上一脚，将他踢进沙堆，摔成一团。
        - id: ch01-b35
          speaker: bakery_boy
          text: 这下该长记性了吧，你这个小混蛋！
          emotion: angry
        - id: ch01-b36
          speaker: narrator
          text: 伙计回去收拾面包，继续送货。简还死死抱着西里尔，西里尔又不能真把她弄疼，只好眼看着那人满脸通红、浑身是汗地走远。他一直骂孩子们是蠢货，直到消失在拐角后面，简才松手。西里尔带着无声的尊严转身去找罗伯特，两个女孩跟在后面，哭个不停。
        - id: ch01-b37
          speaker: narrator
          text: 这一群人可一点儿也不快活。大家扑倒在沙地上，围着正在抽泣的罗伯特。他确实在哭，主要是气得掉眼泪。我也知道，真正英勇的男孩打完架后，眼睛总是干的。可真正英勇的男孩总能打赢，这回罗伯特却输了。西里尔在生简的气，罗伯特对安西娅怒不可遏，两个女孩伤心得要命，四个人谁也不喜欢那个面包店伙计。于是，出现了一阵法国作家所说的“充满感情的沉默”。罗伯特把十根手指和脚趾全挖进沙里，气得不停扭动身子。
        - id: ch01-b38
          speaker: robert
          text: 那个胆小鬼等着瞧吧！等我长大了，非找他报仇不可。这个畜生，不就是仗着比我高吗？
          emotion: angry
        - id: ch01-b39
          speaker: jane
          text: 可是，是你先动手的呀。
        - id: ch01-b40
          speaker: robert
          text: 我当然知道！你这个傻瓜。我只是在玩，他却真的踢我。你们看看！
          emotion: angry
        - id: ch01-b41
          speaker: narrator
          text: 罗伯特扯下长袜，露出一块紫红色的淤青。
        - id: ch01-b42
          speaker: robert
          text: 我只希望自己能比他高大，就这么简单。
        - id: ch01-b43
          speaker: narrator
          text: 他又把手指插进沙里，忽然碰到一团毛茸茸的东西，吓得跳了起来。那当然是赛米阿德。后来西里尔说，它照旧守在这里，专等着把他们变成傻瓜。愿望立刻实现了。罗伯特确实比面包店伙计高大，而且高大得多。他甚至比多年前在市长官邸路口值勤的那个大个子警察还高。那位警察总会好心扶老太太过马路，不但是我见过最高大的人，也是最和善的人。可惜谁的口袋里都没有尺，罗伯特究竟多高，没法量。他大概有十英尺或十一英尺，就算你爸爸站到你妈妈头顶上，也不会比他高。我相信你爸爸绝不会坏心眼到真去试一试。罗伯特的身子也宽得正合比例，幸好诺福克套装跟着一起变大了。他站在那里，一只硕大的长袜还卷在脚踝上，露出巨腿上的巨大淤青。发红的巨人脸上仍挂着愤怒的泪珠，脸色又惊讶得不得了，脖子上还戴着伊顿式硬领。其他孩子看着他那副模样，实在忍不住笑了。
        - id: ch01-b44
          speaker: cyril
          text: 赛米阿德又把咱们捉弄了。
        - id: ch01-b45
          speaker: robert
          text: 不是咱们，是我！你们要还有良心，就该想办法让它把你们也变得这么大。你们根本不知道，这种感觉有多傻。
        - id: ch01-b46
          speaker: cyril
          text: 我可不想知道。只要看看你有多傻，我就全明白了。
        - id: ch01-b47
          speaker: anthea
          text: 哎呀，别吵了！你们两个今天到底怎么回事？松鼠，咱们得公平些。可怜的鲍勃斯孤零零待在那么高的地方，一定难受极了。咱们再去求赛米阿德吧。只要它肯，我觉得大家都该变得跟他一样大。
        - id: ch01-b48
          speaker: narrator
          text: 另外两个孩子很不痛快地同意了。可是找到赛米阿德以后，它怎么也不肯再许愿。
        - id: ch01-b49
          speaker: psammead
          text: 我才不干。他又粗鲁又好斗，让他暂时长成一个不合适的尺寸，正好受点教训。谁叫他用那双讨厌的湿手挖我？差一点儿就碰到我了！他简直是个野蛮人，连石器时代的男孩都比他懂事。
          emotion: angry
        - id: ch01-b50
          speaker: narrator
          text: 罗伯特的手的确湿了，是被眼泪打湿的。
        - id: ch01-b51
          speaker: psammead
          text: 快走，让我清静清静。真不懂你们为什么不许点明智的愿，比如吃的、喝的，或者好教养和好脾气。走吧！
          emotion: angry
        - id: ch01-b52
          speaker: narrator
          text: 它抖着胡须，几乎发出一声低吼，然后把闹别扭的棕色后背转向孩子们。谁都看得出，再商量也没用。他们只好重新面对高大得吓人的罗伯特。
        - id: ch01-b53
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: 咱们现在到底怎么办？
        - id: ch01-b54
          speaker: robert
          text: 第一件事，我要去找那个面包店伙计讲讲道理。我会在大路尽头等他。
        - id: ch01-b55
          speaker: cyril
          text: 老兄，可别打个头比你小的人。
        - id: ch01-b56
          speaker: robert
          text: 我看起来像要打他吗？我一拳下去，他连命都没了。不过我一定得给他一个忘不了的教训。先等我把袜子提好。
        - id: ch01-b57
          speaker: narrator
          text: 他提起那只足有小枕套那么大的长袜，迈步走开了。如今他一步能跨六七英尺，轻轻松松便走到山脚，等着面包店伙计回来。那人已经给沿路的农舍送完面包，正提着空篮子下山，要去追店主的马车。
        - id: ch01-b58
          speaker: narrator
          text: 罗伯特躲在拐角农场院子的干草垛后面。听见伙计吹着口哨走近，他猛地跳出来，一把揪住对方的衣领。
        - id: ch01-b59
          speaker: robert
          text: 好，现在我要让你知道，踢一个比自己矮小的男孩，会有什么下场。
          emotion: angry
        - id: ch01-b60
          speaker: narrator
          text: 罗伯特比平时高了四倍，声音也响了四倍。他举起伙计，把人放到离地十六英尺左右的干草垛顶上，自己坐在牛棚屋顶，把憋在心里的话全说了出来。伙计大概没能听进去多少，因为他早就吓得神志恍惚。罗伯特把能想到的斥责全讲完，有几句还讲了两遍，最后又摇了摇他。
        - id: ch01-b61
          speaker: robert
          text: 好了，现在你想怎么下来，就怎么下来吧。
        - id: ch01-b62
          speaker: narrator
          text: 罗伯特说完便走了。伙计究竟怎样从草垛上下来的，没人知道。只知道他错过了店主的马车，终于回到面包房后，又掉进了一锅最烫的滚水里。当然，他不是真的掉进滚水，而是挨了一顿最厉害的骂。我也替他难过。不过话说回来，的确该有人教教他，英国男孩打架不许动脚，只能用拳头。他告诉店主，自己先前打赢的男孩后来变成了教堂那么高的巨人。这样的故事自然没人相信，于是他那锅滚水变得更烫了。第二天，大家倒相信了这件事。可对面包店伙计来说已经太晚，半点儿用处也没有。
        - id: ch01-b63
          speaker: narrator
          text: 罗伯特回到同伴身边，发现他们都在花园里。安西娅已经请玛莎准许大家在外面吃午饭。餐厅太小，容不下这么大的哥哥。小羊羔在整个闹哄哄的上午都睡得很安稳，这时却打起喷嚏。玛莎说他着凉了，最好留在屋里。
        - id: ch01-b64
          speaker: cyril
          text: 这样正好。他只要看见你大得这么吓人，准会尖叫个没完。
        - id: ch01-b65
          speaker: narrator
          text: 罗伯特确实是服装店老板所谓的“特大号”男孩，前花园的铁门抬脚就能跨过去。玛莎把午饭端到外面，先是冷小牛肉配烤土豆，后面还有西米布丁和炖李子。她当然看不出罗伯特和往常有什么不同，仍旧只给他平常那一份肉和土豆，一点儿也没多添。一个人长到平时的好几倍以后，那份普通午饭看起来有多么微不足道，你简直没法想象。罗伯特呻吟着又要了些面包，玛莎却不肯没完没了地拿给他。她正忙着呢。看守人打算在去贝嫩赫斯特集市的路上过来一趟，她想赶在他到来以前，把自己打扮得漂漂亮亮。
        - id: ch01-b66
          speaker: robert
          text: 真希望咱们也能去集市。
        - id: ch01-b67
          speaker: cyril
          text: 你长成这样，哪儿也去不了。
        - id: ch01-b68
          speaker: robert
          text: 为什么不行？集市上也有巨人，而且比我还大得多。
        - id: ch01-b69
          speaker: cyril
          text: 才没有大多少……
        - id: ch01-b70
          speaker: narrator
          text: 西里尔还没说完，简忽然大叫一声。那声音又响又突然，大家一齐拍她的后背，问她是不是吞了李子核。
        - id: ch01-b71
          speaker: jane
          text: 没有，不是李子核！我想到一个主意。咱们带罗伯特去集市，让他们付钱看他。这样总算能从那个老赛米阿德身上捞到一点真正的好处了！
          emotion: surprised
        - id: ch01-b72
          speaker: robert
          text: 什么叫你们带我去？应该说我带你们去！
          emotion: angry
        - id: ch01-b73
          speaker: narrator
          text: 结果还真是罗伯特带他们去。除了罗伯特本人，谁都抵挡不住这个主意。后来安西娅提议，不管赚多少钱，都给罗伯特双份，他终于答应了。马车房里有一辆老旧的小马车，就是人们所说的家庭女教师车。大家急着赶到集市，罗伯特便推着另外三个孩子上路。他腿长，步子快，推这辆车就像早晨推小羊羔的童车一样轻松。小羊羔感冒了，没能一起去。
        - id: ch01-b74
          speaker: narrator
          text: 坐在小马车里，让一个巨人在后面推，感觉奇妙极了。除了罗伯特和路上遇见的寥寥几个人，大家都很享受这段旅程。那些路人一看见他们，便站在路边露出古怪的反应。安西娅说，他们多半突然患上了一种站着抽搐的怪病。快到贝嫩赫斯特时，罗伯特不能再往人多的地方走了。他躲进一座谷仓，其他三个孩子坐着小马车，继续前往集市。
        - id: ch01-b75
          speaker: narrator
          text: 集市里有秋千，有又呜呜叫、又嘟嘟响、喇叭震天的旋转木马，还有射击摊和投球打椰子的摊子。西里尔忍住了赢一只椰子，或者至少试一试的冲动，走到一个女人面前。她站在一排悬在帆布前的玻璃瓶旁，正给小枪装弹。
        - id: ch01-b76
          speaker: becca
          text: 来呀，小少爷！一便士打一枪！
        - id: ch01-b77
          speaker: cyril
          text: 不用了，谢谢。我们是来谈生意的，不是来玩的。这里谁管事？
        - id: ch01-b78
          speaker: becca
          text: 你问谁？
        - id: ch01-b79
          speaker: cyril
          text: 就是管事的人，头儿，这个场子的老板。
        - id: ch01-b80
          speaker: becca
          text: 他在那边。就是那个穿脏亚麻布外套、在太阳底下睡觉的胖子。不过我劝你别猛地叫醒他。天气这么热，他的脾气尤其坏。你等着的时候，不如先打一枪。
        - id: ch01-b81
          speaker: cyril
          text: 这件事很要紧，能让他赚很多钱。我们要是把东西带到别处，他准会后悔。
        - id: ch01-b82
          speaker: becca
          text: 哦，要是能给他送钱，那可不一样。你不是在耍我吧？到底是什么东西？
        - id: ch01-b83
          speaker: cyril
          text: 一个巨人。
        - id: ch01-b84
          speaker: becca
          text: 你果然在逗我吧？
        - id: ch01-b85
          speaker: anthea
          text: 跟我们来看看就知道了。
        - id: ch01-b86
          speaker: narrator
          text: 女人将信将疑地打量他们，又叫来一个衣衫褴褛的小姑娘。小姑娘穿着条纹长袜和脏白衬裙，衬裙下摆露在棕色连衣裙外面。女人把射击摊交给她看守，转向安西娅。
        - id: ch01-b87
          speaker: becca
          text: 那就快走！可你要是在耍我，最好现在就承认。我本人温顺得像牛奶，我家比尔发起火来可吓人得很，而且……
        - id: ch01-b88
          speaker: narrator
          text: 安西娅带她朝谷仓走去。
        - id: ch01-b89
          speaker: anthea
          text: 真的是个巨人，不过是个巨人小男孩。他穿着诺福克套装，就跟我弟弟身上的一样。我们没带他进集市，是因为人们看见他就盯着不放，还像患了那种站着抽搐的怪病。也许你们愿意展览他，收些便士。只要也付给我们一点钱就行，不过得多一些，因为我们答应过他，赚到的钱要给他双份。
        - id: ch01-b90
          speaker: narrator
          text: 女人咕哝了一串含糊的话。孩子们只听清“我发誓”“疯了”和“烤面包片”，完全猜不出她是什么意思。她已经牢牢抓住安西娅的手，攥得紧紧的。安西娅不免担心，万一罗伯特自己走了，或者忽然恢复了原来的大小，该怎么办？不过她知道，赛米阿德的礼物不管多么不方便，都会实实在在持续到日落。而且不知为什么，她觉得罗伯特长成这副样子以后，大概也不会乐意撇下他们，独自到别处闲逛。
        - id: ch01-b91
          speaker: narrator
          text: 到了谷仓，西里尔喊了一声罗伯特。松散的干草动了起来，先伸出一只手和一条胳膊，接着又伸出一只脚和一条腿。
        - id: ch01-b92
          speaker: becca
          text: 哎哟！我的老天爷！
          emotion: surprised
        - id: ch01-b93
          speaker: narrator
          text: 罗伯特庞大的身子慢慢从干草里完全钻了出来。女人深吸一口气，说了一长串话。这回，就连“疯了”和“烤面包片”听起来都成了再普通不过的字眼。最后，她总算说起孩子们听得懂的话。
        - id: ch01-b94
          speaker: becca
          text: 你们要多少钱才肯卖他？只要价钱还讲理，多少都行。我们能专门给他造辆车。至少，我知道哪里有辆二手车，收拾一下就很体面。从前有头小象用过它，后来那头象死了。你们开个价吧。他是不是个傻子？巨人多半都傻，可我真是头一回见到，从来也没见过！我们当场付现钱，还会像伺候国王一样伺候他，给他最上等的饭菜，再给他一张公爵才配睡的好床。他要不傻，也不会需要你们几个小鬼领着到处跑。说吧，你们到底要多少？
        - id: ch01-b95
          speaker: robert
          text: 他们一分钱也不会收。我并不比你傻，说不定还比你聪明。我今天可以让你们展览，只要你肯付我……十五先令。
        - id: ch01-b96
          speaker: becca
          text: 成交！现在就来见我家比尔，咱们还得谈谈整个集市期间的价钱。以后每星期固定给你两镑，我看也没问题。来吧，看在老天的分上，尽量把自己缩小一点儿！
        - id: ch01-b97
          speaker: narrator
          text: 她答应得太快，罗伯特马上觉得自己亏待了自己，恨不得刚才开价三十先令。至于缩小，那是无论如何也办不到的。人们很快围过来，兴冲冲地跟在后面排成一支长队。罗伯特就这样领着队伍走进举办集市的那片草地。草地早被人踩得稀烂，满地都是短短的草茬，黄澄澄的，还扬着尘土。他来到最大的一顶帐篷前，只能弯着腰钻进去。女人则跑去叫醒她家比尔。
        - id: ch01-b98
          speaker: narrator
          text: 比尔就是那个在太阳下睡觉的胖男人。他被人叫醒以后，显然很不高兴。西里尔从帐篷裂缝里往外看，只见他紧紧皱着眉，挥舞一只沉重的拳头，还晃了晃睡意蒙眬的脑袋。贝卡接着飞快地解释起来。西里尔听不清她说的全部，只听见“老天在上”和“这辈子最大的摇钱树，我敢发誓”。听到这些，他也渐渐跟罗伯特一样，觉得十五先令开得实在太少了。
        - id: ch01-b99
          speaker: narrator
          text: 比尔拖着脚走进帐篷，看清罗伯特那气势非凡的身量，倒没说多少话。孩子们后来能记起来的，只有一句“老天爷，真见鬼了”。不过他没有耽搁，很快掏出整整十五先令。这些钱大多是六便士硬币和铜币，沉甸甸地交到了罗伯特手里。
        - id: ch01-b100
          speaker: bill
          text: 等今晚演完，咱们再谈以后怎么分账。乖乖，你跟着我们，一定快活得再也不想走。你会唱歌吗？或者来一小段踢踏舞？
        - id: ch01-b101
          speaker: robert
          text: 今天不行。
        - id: ch01-b102
          speaker: narrator
          text: 罗伯特原想唱《五月往事》。妈妈很喜欢这首歌，也是他当时唯一想得起来的，可他最后还是没唱。
        - id: ch01-b103
          speaker: bill
          text: 去叫利瓦伊，把那些该死的照片都搬出去！帐篷腾空，再挂一道帘子。可惜咱们没有你这个尺码的紧身衣，不过这星期结束前准能做好。年轻人，你要发大财了。幸好你找的是我，没落到别的家伙手里。我见过有人打自己的巨人，还故意饿他们。所以我跟你说，你今天真是走了这辈子最大的好运。我呀，温顺得像只小羊羔，从不骗人。
        - id: ch01-b104
          speaker: robert
          text: 我不怕谁来打我。不过我快饿坏了，希望你能给我弄点吃的。
        - id: ch01-b105
          speaker: narrator
          text: 帐篷太矮，罗伯特只能屈膝跪着，可就算这样，他还是能低头俯视这只“小羊羔”。
        - id: ch01-b106
          speaker: bill
          text: 贝卡，给他弄吃的去，记住，要最好的！还有，这事得白纸黑字写下来，明早第一件事就办。
        - id: ch01-b107
          speaker: narrator
          text: 贝卡去取食物了。她拿来的其实不过是面包和奶酪，可对肚子空空的大罗伯特来说，吃起来实在美味极了。比尔则派人在帐篷四周站岗。那些人守住每一个可能离开的地方，只要罗伯特企图带着十五先令逃跑，就马上向比尔报信。
        - id: ch01-b108
          speaker: anthea
          text: 他们这是什么意思，好像我们会骗人似的！
          emotion: angry
        - id: ch01-b109
          speaker: narrator
          text: 接下来，一个又奇异又精彩万分的下午开始了。比尔确实很懂行。所有风景照片都被收了起来，观看照片用的窥镜也搬走了。透过那些镜片看去，照片里的风景原本简直跟真的一样。就连照亮照片的灯也全撤掉了。帐篷中间挂起一道帘子，其实不过是一块红黑相间的旧地毯。罗伯特藏在帘子后，比尔站到帐篷外的一张搁板桌上，发表了一番很像样的演说。
        - id: ch01-b110
          speaker: bill
          text: 各位，今天我有幸向公众介绍一位真正的巨人！他是旧金山皇帝的长子，因为不幸爱上斐济群岛的公爵夫人，被迫离开祖国，到英格兰寻求庇护。这里是自由的国土，一个人不管长得多么高大，自由都是他应有的权利！最先来到帐篷门口的二十位客人，每人只要三便士，就能亲眼观看这位巨人。二十人以后，票价可就要上涨了。至于最后涨到多高，我也不敢保证。诸位，现在就是最好的机会！
        - id: ch01-b111
          speaker: narrator
          text: 第一个走上前来的，是个陪心上人出来享受下午假日的年轻人。遇上这种时候，他当然要在姑娘面前摆出王公贵族般的气派，显得不惜花费，好像金钱根本不算什么。他的姑娘想看巨人，那就让她看好了。哪怕看巨人每人要花三便士，而集市上其他每一种娱乐都只收一便士，他也绝不能迟疑。
        - id: ch01-b112
          speaker: narrator
          text: 门帘一掀，那对男女走了进去。下一刻，姑娘疯狂的尖叫声刺进每个人的耳朵。
        - id: ch01-b113
          speaker: bill
          text: 这下可成了！
          emotion: happy
        - id: ch01-b114
          speaker: narrator
          text: 比尔拍着大腿，低声对贝卡说。那声尖叫果然给罗伯特的魅力做了一个绝妙的广告。姑娘从帐篷里出来时脸色煞白，浑身发抖，帐篷周围已经挤满了等着看巨人的人。
        - id: ch01-b115
          speaker: constable
          text: 里面那东西是什么样的？
        - id: ch01-b116
          speaker: young_woman
          text: 啊，太可怕了！你根本不会相信。它有谷仓那么大，还凶得吓死人。我的骨头都冻僵了。可我这辈子要是没见过它，一定会后悔死！
          emotion: fearful
        - id: ch01-b117
          speaker: narrator
          text: 罗伯特看起来那么凶，其实只是因为他正拼命忍着不笑。但没过多久，他便一点儿也不想笑了。还没到日落，他已经更想哭，而不是笑。比起这两件事，他又更想好好睡上一觉。整个下午，人们一个接一个、两个一对、三个一群，不断走进帐篷。谁想跟巨人握手，罗伯特就得伸手去握。别人戳他、扯他、拍他、捶他，他也得老老实实忍着，好叫每一位花了钱的客人都相信，他确实是个货真价实的巨人。
        - id: ch01-b118
          speaker: narrator
          text: 另外三个孩子坐在长凳上看着、等着，简直无聊透顶。在他们看来，世上再也发明不出比这更辛苦的赚钱法了，何况他们只拿到十五先令。比尔已经收进这个数目的四倍。巨人的消息传开以后，坐货车来的商人和乘马车来的体面人，全都从远近各处赶来。一个戴着单片眼镜、纽扣眼里插着一朵硕大黄玫瑰的绅士，好意地低声向罗伯特提出，每星期付他十镑，请他到水晶宫登台。罗伯特明知日落后会怎样，只能拒绝这份优厚的邀请。
        - id: ch01-b119
          speaker: robert
          text: 我不能答应。明知道做不到的事，答应了也没用。
          emotion: sad
        - id: ch01-b120
          speaker: gentleman
          text: 唉，可怜的人。你大概跟他们签了好多年的契约吧？拿好我的名片，等契约到期，就来找我。
        - id: ch01-b121
          speaker: robert
          text: 到那时候我要还是这么大，一定去找您。
        - id: ch01-b122
          speaker: gentleman
          text: 再长大一点儿就更好了。
        - id: ch01-b123
          speaker: narrator
          text: 绅士离开后，罗伯特朝西里尔招了招手。
        - id: ch01-b124
          speaker: robert
          text: 去告诉他们，我必须休息，非休息不可。我还得喝下午茶。
        - id: ch01-b125
          speaker: narrator
          text: 下午茶很快送进来了。帐篷外也匆匆钉起一张纸，告诉等候的人群，这里暂停开放半小时，因为巨人正在喝下午茶。总算没有客人再进来戳戳碰碰，四个孩子马上凑到一起，匆匆开起了一场紧急会议。
        - id: ch01-b126
          speaker: robert
          text: 我到底怎么才能逃出去？我整个下午都在想这件事。
        - id: ch01-b127
          speaker: cyril
          text: 等太阳落山，你恢复原来的大小，直接走出去不就行了？他们又不能把咱们怎么样。
        - id: ch01-b128
          speaker: robert
          text: 他们要是亲眼看见我变小，差不多会把咱们打死。不行，太阳落山时，旁边一定不能有人。
          emotion: fearful
        - id: ch01-b129
          speaker: cyril
          text: 我有办法。
        - id: ch01-b130
          speaker: narrator
          text: 西里尔干脆地说完，走到门边。外面，比尔抽着陶土烟斗，正压低声音跟贝卡说话。
        - id: ch01-b131
          speaker: bill
          text: 简直像继承了一大笔财产。
        - id: ch01-b132
          speaker: cyril
          text: 听我说，过一会儿就能重新放人进来。他快喝完下午茶了。不过太阳落山的时候，必须让他独自待着。他每天到这个时候都会变得很古怪。谁去打扰他，我可不能保证会出什么事。
        - id: ch01-b133
          speaker: bill
          text: 怎么回事？他会犯什么毛病？
        - id: ch01-b134
          speaker: cyril
          text: 我也不知道。就像是……会发生某种变化。到那时，他一点儿也不像平常的自己，你简直认不出他，真的古怪极了。日落前后要是不让他独处，准会有人受伤。
        - id: ch01-b135
          speaker: narrator
          text: 这话倒完全是真的。
        - id: ch01-b136
          speaker: bill
          text: 到了晚上，他还能恢复吧？
        - id: ch01-b137
          speaker: cyril
          text: 当然。日落半小时以后，他就会完全恢复。
        - id: ch01-b138
          speaker: becca
          text: 那最好顺着他。
        - id: ch01-b139
          speaker: narrator
          text: 到了西里尔估摸着离日落大约还有半小时的时候，帐篷便再次关门。这回对外给出的理由是，巨人正在里面吃晚饭。等候的人群听说以后，拿巨人的两顿饭挨得这么近取笑个不停。
        - id: ch01-b140
          speaker: bill
          text: 得承认，他的胃口可真不小。不过你们瞧瞧，他长这么大，当然得多吃些。
        - id: ch01-b141
          speaker: narrator
          text: 帐篷里，四个孩子屏住呼吸，安排起撤退计划。
        - id: ch01-b142
          speaker: cyril
          text: 你们两个女孩现在就走，用最快的速度赶回家。别管那辆讨厌的小马车了，明天再取。罗伯特和我穿得一样，我们会像西德尼·卡顿那样想出办法。你们必须先出去，不然什么办法都行不通。我们能跑，你们跑不了，不管你们自己怎么想。简，别说了。让罗伯特冲出去撞倒别人也没用，警察会追着他跑。等他恢复原来的大小，他们马上会逮捕他。你们非走不可！再不走，我以后再也不跟你们说话。说到底，今早要不是你们抱住别人的腿，咱们也不会惹上这场麻烦。快走，我叫你们走！
        - id: ch01-b143
          speaker: narrator
          text: 简和安西娅只好离开。
        - id: ch01-b144
          speakers: [anthea, jane]
          ensemble: duo
          text: 我们回家了。巨人就交给你，请你好好照顾他。
        - id: ch01-b145
          speaker: narrator
          text: 安西娅后来承认，这句话实在很会骗人。可当时，她们又能怎么办呢？两个女孩走后，西里尔去找比尔。
        - id: ch01-b146
          speaker: cyril
          text: 听我说，他现在想要几穗麦子，隔一块地的那片田里就有。我这就跑去拿。还有，你能不能把帐篷后面稍微卷起来一点？他说里面闷得喘不过气。我会守着，不许别人偷看。先让我把他盖好，哄他睡一会儿，再去拿麦穗。他现在非要不可。每次变成这样，谁也拦不住他。
        - id: ch01-b147
          speaker: narrator
          text: 大家照西里尔的话，搬来一堆麻袋和一块旧防水布，把巨人盖好，安顿得舒舒服服。帐篷后面的帘子也卷了起来，兄弟俩终于可以单独留下。他们压低声音，不让外面的岗哨听见，把逃走的计划一点一点商量妥当。帐篷外，旋转木马一直轰响着滑稽的曲调，偶尔又冒出一声尖啸，把集市上众人的注意吸引过去。
        - id: ch01-b148
          speaker: narrator
          text: 太阳落山半分钟后，一个穿诺福克套装的男孩从比尔身边走了出去。
        - id: ch01-b149
          speaker: cyril
          text: 我去拿麦穗。
        - id: ch01-b150
          speaker: narrator
          text: 他很快混进人群。就在同一刻，另一个男孩从帐篷后面出来，经过守在那里的贝卡身旁。
        - id: ch01-b151
          speaker: robert
          text: 我去追那个拿麦穗的人。
        - id: ch01-b152
          speaker: narrator
          text: 第二个男孩也悄悄走开，很快消失在人群里。从前门出去的是西里尔，从后门出去的是罗伯特。就在太阳落山以后，他已经恢复了原来的大小，所以穿着同样的诺福克套装，看起来正好可以冒充哥哥。两人先快步穿过田野，再沿大路往前走。罗伯特很快追上西里尔，接着兄弟俩一起撒腿飞跑，一刻也不敢耽搁。
        - id: ch01-b153
          speaker: narrator
          text: 他们到家时，正好跟女孩们一样早。那段路实在太远，兄弟俩和女孩们大半程都在奔跑。这距离确实远得很。第二天，他们还得原路返回，把留在集市的小马车一路拖回家。这一回，可没有一个高大无比的罗伯特替他们从后面推车，推得轻轻松松，好像车里坐着几个小娃娃，而他是个身形巨大的保姆。
        - id: ch01-b154
          speaker: narrator
          text: 等比尔和贝卡发现巨人不见了，他们究竟说了些什么，我实在无法告诉你。首先，也是最要紧的一点，我根本不知道他们说了什么。
