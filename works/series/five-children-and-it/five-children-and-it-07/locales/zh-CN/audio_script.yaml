audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带一点含蓄的幽默
        timbre: 温暖清亮
        pace: 从容而有变化
        pitch: 中音
    cyril:
      display_name: 西里尔
      tts:
        delivery: 自信爽快，像个爱拿主意的大孩子
        timbre: 明亮结实
        pace: 稍快
        pitch: 中高音
    anthea:
      display_name: 安西娅
      tts:
        delivery: 认真体贴，着急时干脆利落
        timbre: 清澈柔韧
        pace: 中速
        pitch: 中高音
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，偶尔一本正经
        timbre: 清亮饱满
        pace: 中速
        pitch: 中音
    jane:
      display_name: 简
      tts:
        delivery: 天真敏感，想象丰富
        timbre: 轻柔明亮
        pace: 中速
        pitch: 高音
    martha:
      display_name: 玛莎
      tts:
        delivery: 爽利泼辣，护着孩子时毫不退让
        timbre: 响亮厚实
        pace: 稍快
        pitch: 中音
    herald:
      display_name: 传令兵
      tts:
        delivery: 高声庄重，带着古代军令的威吓
        timbre: 洪亮粗厚
        pace: 中慢速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 围城与上床
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 孩子们坐在昏暗的宴会厅里，挤在一张光秃秃的长木桌尽头。玛莎已经端来了午饭，可午饭既看不见，也摸不着。他们把桌面来回摸了个遍，摸到的除了桌子，还是桌子。眼看真是一点儿指望也没有了，西里尔却忽然摸了摸口袋。
        - id: ch01-b02
          speaker: cyril
          text: 有了！你们快看，是饼干！
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: 那些饼干碎了不少，可到底还是饼干。有三块是完整的，另外还有满满一把碎块和渣。西里尔说，这是今早厨娘给他的，他早就忘得干干净净。说着，他把饼干仔仔细细分成四堆，一点儿也不偏心。大家高高兴兴地吃了起来，谁也顾不上说话。饼干味道有点儿怪，因为它们跟一绞焦油细绳、几颗青绿的冷杉球果和一团鞋匠蜡一起，在西里尔口袋里待了整整一上午。
        - id: ch01-b04
          speaker: robert
          text: 松鼠，你不是最会解释什么看不见之类的事吗？为什么这些饼干还在，面包、肉和别的东西却都没了？
        - id: ch01-b05
          speaker: cyril
          text: 我也说不准。也许因为饼干本来就在咱们手里吧。咱们身上的东西没有变，我口袋里的东西也全都好好的。
        - id: ch01-b06
          speaker: robert
          text: 那么，只要羊肉到了咱们手里，它就会变成真的。真希望能把它找出来！
        - id: ch01-b07
          speaker: cyril
          text: 可咱们找不到。我看东西进嘴以前，还不能算是咱们的。
        - id: ch01-b08
          speaker: jane
          text: 或者，进口袋以前也不算。
        - id: ch01-b09
          speaker: cyril
          text: 哪个傻姑娘会把羊肉塞进口袋？不过我想到办法了。先试试看！
        - id: ch01-b10
          speaker: narrator
          text: 西里尔弯下腰，把脸凑到离桌面只有一英寸的地方，嘴巴不停地一张一合，像是在咬空气。罗伯特正垂头丧气地说这办法没用，忽然愣住了。西里尔已经站直身子，得意地咧着嘴，嘴里叼着一块方方正正的面包。面包是真的，人人都看见了。他一咬下一口，剩下的面包立刻消失。不过这不要紧，他明明知道面包还拿在手里，哪怕看不见，也摸不着。他朝两根手指之间的空气再咬一口，牙齿落下去时，那一口空气又变成了面包。
        - id: ch01-b11
          speaker: narrator
          text: 其他人立刻照样做起来，对着空荡荡的桌面不停张嘴。罗伯特还逮住了一片羊肉。至于后来，我看还是替这痛苦的一幕拉道帘子吧。总之，他们都吃足了羊肉。玛莎来换盘子时，说她这辈子没见过这么乱的桌子。幸好布丁只是普通的板油卷。玛莎问他们要糖浆、果酱还是糖，孩子们一齐说什么也别加。
        - id: ch01-b12
          speaker: martha
          text: 嘿，我可真没见过。下回又不知道要闹出什么！
        - id: ch01-b13
          speaker: narrator
          text: 玛莎走后，孩子们又上演了一幕我不愿细说的场面。要知道，像狗一样用嘴从桌上叼起一片片板油布丁，谁的样子也不会好看。不过最要紧的是，他们总算吃过午饭，胆气也壮了一些，可以准备迎接日落前必将到来的进攻了。罗伯特身为队长，坚持登上一座塔顶侦察。大家全都跟着爬上去，站在塔顶朝四面望，城堡周围顿时一览无余。
        - id: ch01-b14
          speaker: narrator
          text: 护城河外，围城军队的帐篷遍布四面八方。兵士们全都忙得不可开交，有的擦拭兵器，有的磨利刀刃，有的给弓重新上弦，还有的把盾牌擦得锃亮。孩子们看着眼前这副忙碌的景象，脊背便一阵阵不自在地发冷。这时，一大队人马沿路走来，几匹马在前面吃力地拖着一根巨大的树干。西里尔认出那是攻城槌，脸一下子白了。
        - id: ch01-b15
          speaker: cyril
          text: 幸亏咱们有护城河，吊桥也升起来了。我根本不知道怎么摆弄那座桥。
        - id: ch01-b16
          speaker: anthea
          text: 城堡都被围了，吊桥当然应该升起来。
        - id: ch01-b17
          speaker: robert
          text: 可城堡里按说也该有兵士吧？
        - id: ch01-b18
          speaker: cyril
          text: 谁知道这座城堡被围多久了。说不定勇敢的守军在刚开战时就死得差不多了，粮食也吃光了。如今只剩下几个无畏的幸存者，那就是咱们。咱们得誓死守城。
        - id: ch01-b19
          speaker: anthea
          text: 可誓死守城，到底先做什么？
        - id: ch01-b20
          speaker: cyril
          text: 咱们该全副武装。敌人一上来，就朝他们放箭。
        - id: ch01-b21
          speaker: anthea
          text: 从前敌人靠得太近，守军还会往下倒滚烫的铅水。爸爸在博迪亚姆城堡指给我看过专门倒铅水的孔。这里的城门塔楼也有。
        - id: ch01-b22
          speaker: jane
          text: 我倒很庆幸这只是一场游戏。它真的只是游戏，对不对？
          emotion: fearful
        - id: ch01-b23
          speaker: narrator
          text: 没有人回答。城堡里倒有不少模样古怪的兵器。可真要带上它们，孩子们就会像西里尔说的那样，不仅是全副武装，简直还要被武器压得沉甸甸。那些刀剑、长矛和弩太重了，就连西里尔堂堂男子汉的力气也吃不消。长弓更糟，四个孩子没有一个能把它拉开哪怕一点儿。短刀轻一些，可简只盼敌人永远别靠得近到用得上它们。
        - id: ch01-b24
          speaker: cyril
          text: 没关系，短刀可以当标枪扔，也可以从上面往他们头上丢。院子另一边还有许多石头。咱们搬一些上来，要是他们想游过护城河，就用石头砸他们。
        - id: ch01-b25
          speaker: narrator
          text: 很快，城门上方的房间里就多了两堆东西。一堆是石头，另一堆是亮闪闪、尖森森、一看就危险的短刀和小刀。安西娅穿过院子去搬更多石头时，又想出了一个极有用的主意。她请玛莎下午茶只给大家饼干，说他们正在玩围城的游戏，要拿饼干给守军储备粮食。她的手搬石头弄得太脏，便请玛莎把她那份直接塞进口袋，又答应通知其他三个人亲自来拿。
        - id: ch01-b26
          speaker: narrator
          text: 这主意真妙。玛莎给每个孩子的口袋都塞进满满一把空气，那些空气一进口袋，便成了饼干。守军直到日落都不愁粮食了。他们还搬来几锅冷水，准备代替城堡里没有的滚烫铅水，浇到敌人头上。
        - id: ch01-b27
          speaker: narrator
          text: 下午过得快得出奇。守城实在刺激，可除了罗伯特，谁也不能一直觉得这真是会送命的危险差事。其他人只从远处看过营地和围城的兵士，从没跟他们面对面，总觉得一半像是在玩假装守城的游戏，一半像做了一个清楚得惊人、又绝对安全的美梦。罗伯特亲眼见过那些人和兵器有多真实，所以只有偶尔才能这么想。
        - id: ch01-b28
          speaker: narrator
          text: 到了仿佛该喝下午茶的时候，孩子们吃掉各自的饼干，又从院子那口深井里打来井水，倒进一只只角杯里喝。西里尔坚持留下八块饼干，怕有人在激战中饿得发晕。他正把这些储备粮藏进一个没有门的小石柜，突然响起一声又响又凶的号角，吓得他当场掉了三块。
        - id: ch01-b29
          speaker: robert
          text: 这下你们看见了吧？一切都是真的。他们要进攻了。
        - id: ch01-b30
          speaker: narrator
          text: 大家全冲到狭窄的窗口前。罗伯特看见敌人纷纷钻出帐篷，像蚂蚁一样到处移动。杰金正在吊桥接岸的地方跑来跑去。罗伯特恨不得让杰金亲眼看见自己朝他吐舌头，还真的冲窗外用力吐了一下。其余几个孩子脸色惨白，谁也没有心思朝任何人吐舌头。他们惊讶又敬佩地望着罗伯特。
        - id: ch01-b31
          speaker: anthea
          text: 罗伯特，你真的很勇敢。
        - id: ch01-b32
          speaker: cyril
          text: 胡说！他整个下午都在准备着要勇敢，我只是没准备好。再过半眨眼的工夫，我准比他还勇敢。
        - id: ch01-b33
          speaker: jane
          text: 你们两个谁最勇敢，有什么要紧？西里尔许愿要城堡，简直傻透了。我不想玩了。
        - id: ch01-b34
          speaker: narrator
          text: 罗伯特板起脸，正要纠正她，安西娅却抢先哄起简来。
        - id: ch01-b35
          speaker: anthea
          text: 你其实还想玩的。这游戏挺好，因为他们绝不可能进来。就算进来了，文明军队也总会放过妇女和孩子。
          emotion: calm
        - id: ch01-b36
          speaker: jane
          text: 可你真的肯定他们文明吗？他们看起来像是好久好久以前的人。
          emotion: fearful
        - id: ch01-b37
          speaker: anthea
          text: 当然文明。你看他们长矛上的小旗子，多鲜亮！首领也威风极了。骑灰马的就是他，对不对，罗伯特？
        - id: ch01-b38
          speaker: narrator
          text: 简终于肯往外看了。眼前的景象美得几乎叫人忘记害怕。绿草地上扎着一顶顶白帐篷，长矛尖端的小旗迎风闪动，铠甲也亮晶晶的，披巾和短上衣颜色鲜艳，活像一幅绚丽的彩色画。号角一阵接一阵地响起。吹号的人停下来换气时，孩子们还能听见铠甲碰撞的叮叮当当，以及许多人说话汇成的低低嗡鸣。
        - id: ch01-b39
          speaker: narrator
          text: 一个号手走到护城河边。那条河这时看起来比最初窄得多。他吹出一声格外长、格外响的号音，是孩子们至今听过最长、最响的一声。等刺耳的声音终于消散，号手身边的传令兵朝城门楼高声喊话。他的声音越过护城河，清清楚楚传到守军耳中。
        - id: ch01-b40
          speaker: herald
          text: 城中之人听着！
        - id: ch01-b41
          speaker: robert
          text: 这边听着呢！
        - id: ch01-b42
          speaker: herald
          text: 奉我主国王之名，也奉我等贤明之主、忠诚首领沃尔弗里克·德·塔尔博特爵士之命，命此城立刻投降！若敢不从，必遭火焚刀斩，绝不宽赦。尔等降是不降？
        - id: ch01-b43
          speaker: robert
          text: 不降！我们当然不降！永不，永不，永不投降！
        - id: ch01-b44
          speaker: herald
          text: 那么，尔等便自负其命！
        - id: ch01-b45
          speaker: robert
          text: 大家欢呼，让他们知道咱们不害怕。把短刀也摇得哗啦响，声势大一点儿。一、二、三！嗨，嗨，万岁！再来一次！嗨，嗨，万岁！最后一次！嗨，嗨，万岁！
        - id: ch01-b46
          speaker: narrator
          text: 孩子们的欢呼声又尖又弱，不过短刀哗啦啦的碰撞声给它添了些力量，也添了些厚度。护城河对面的营地立刻用另一阵喊声回答。这座被困的堡垒随即感觉到，进攻真的开始了。城门上方的房间越来越暗。简想起太阳就快落山，愿望也快结束了，总算多了一丁点儿勇气。
        - id: ch01-b47
          speaker: anthea
          text: 护城河窄得真吓人。
          emotion: fearful
        - id: ch01-b48
          speaker: robert
          text: 就算他们游过来，也进不了城堡。
        - id: ch01-b49
          speaker: narrator
          text: 话刚说完，罗伯特就听见门外楼梯上传来沉重的脚步，还有钢铁铿锵的碰撞声。大家一动不动，连气也不敢喘。脚步声顺着塔楼的台阶继续向上。罗伯特轻轻跳到门边，脱掉了鞋。
        - id: ch01-b50
          speaker: robert
          text: 你们在这里等着。
        - id: ch01-b51
          speaker: narrator
          text: 他又快又轻地跟着靴声和马刺的响声追上去，从门边偷看上层的房间。杰金果然在那里，浑身还滴着护城河里的水。他弯着身子摆弄一套机件，罗伯特认定那东西就是操纵吊桥的。罗伯特猛地撞上房门，飞快转动锁里的大钥匙。杰金正好从里面扑到门边，却已经来不及了。罗伯特转身飞奔下楼，冲进塔底那间窗户最大的小屋。
        - id: ch01-b52
          speaker: robert
          text: 咱们本来应该守住这里！
        - id: ch01-b53
          speaker: narrator
          text: 其他人跟着跑来。又一名兵士已经游过护城河，十根手指紧紧攀住了窗台。罗伯特后来一直没弄明白，那人到底怎么从河水里爬到了这么高的地方。当时他只看见死死抓住窗台的手指，便抄起地上的铁棍，使出全身力气打下去。那人扑通一声掉回河里。罗伯特马上退出小屋，砰地关上门，推动几根大得惊人的门闩，又高喊西里尔来帮忙。
        - id: ch01-b54
          speaker: narrator
          text: 几个孩子站在拱顶门楼里，喘得上气不接下气，只顾你看看我，我看看你。简的嘴巴还张得大大的。
        - id: ch01-b55
          speaker: robert
          text: 打起精神，简妮。用不了多久了。
          emotion: calm
        - id: ch01-b56
          speaker: narrator
          text: 头顶忽然传来吱嘎声，什么东西咔啦啦地摇晃起来，连脚下的石板都仿佛在发抖。紧接着轰然一响，孩子们全听明白了，吊桥已经被放下，稳稳落到了原位。
        - id: ch01-b57
          speaker: robert
          text: 准是杰金那个混蛋干的。咱们还有铁闸。我差不多敢肯定，操纵铁闸的地方在下面。
        - id: ch01-b58
          speaker: narrator
          text: 马蹄和武装兵士的脚步已经踏上吊桥，桥面被踩得空洞地震响，回声一阵接着一阵。
        - id: ch01-b59
          speaker: robert
          text: 快上楼！咱们往他们头上丢东西！
        - id: ch01-b60
          speaker: narrator
          text: 这时，就连两个女孩也差不多勇敢起来了。她们跟着罗伯特跑上楼，听他的指挥，从狭长的窗口往下扔石头。下面顿时乱成一片，还传来几声呻吟。
        - id: ch01-b61
          speaker: anthea
          text: 哎呀，我怕咱们真的把人砸伤了！
          emotion: fearful
        - id: ch01-b62
          speaker: narrator
          text: 她放下正要扔出去的石头，罗伯特却气冲冲地一把抢了过去。
        - id: ch01-b63
          speaker: robert
          text: 我倒希望真把他们砸伤了！要是有满满一大壶滚铅水，拿什么换我都愿意。还想叫我们投降！
          emotion: angry
        - id: ch01-b64
          speaker: narrator
          text: 更多沉重的脚步声不断涌了过来。声音忽然停顿了一下，攻城槌便雷鸣似的轰然撞上厚重的大门。小屋里已经黑得快看不见了。
        - id: ch01-b65
          speaker: robert
          text: 我们守住了！我们绝不投降！太阳随时都该落山了。听，他们又在下面吵。可惜没时间多搬些石头。把那锅水倒下去吧。也许没什么用，可他们准不喜欢。
        - id: ch01-b66
          speaker: jane
          text: 咱们是不是最好投降呀？
          emotion: fearful
        - id: ch01-b67
          speaker: robert
          text: 绝不投降！你愿意的话，咱们可以跟他们谈判。等我长大，一定要当兵。你们等着瞧吧，不管谁说什么，我也不进文官部门。
        - id: ch01-b68
          speaker: jane
          text: 那就挥块手帕，请他们谈判吧。我觉得今晚的太阳根本不会落下去。
          emotion: fearful
        - id: ch01-b69
          speaker: robert
          text: 先把水倒给那群畜生尝尝！
          emotion: angry
        - id: ch01-b70
          speaker: narrator
          text: 安西娅把铁锅朝最近的倒铅孔倾斜，把水倒了下去。下面传来一声水响，可谁也不像是被淋到了。攻城槌再次撞上大门。安西娅停了下来。罗伯特趴到地上，闭起一只眼睛，朝孔里仔细看。
        - id: ch01-b71
          speaker: robert
          text: 咱们真蠢。这些孔是直通门楼的。只有敌人攻破大门和铁闸，眼看什么都守不住了，才从这里倒铅水。把锅给我。
        - id: ch01-b72
          speaker: narrator
          text: 罗伯特爬上墙壁正中那块三角形的窗台，接过安西娅手里的锅，把水从射箭孔里倒出去。就在水流出去的一刹那，攻城槌的轰撞声、敌人的脚步声，还有“投降”和“德·塔尔博特万岁”的喊声，全都突然停住，像烛芯上的火被一下掐灭。昏暗的房间仿佛旋转起来，翻了个底朝天。等孩子们回过神，他们已经平平安安站在自家前面的大卧室里。这里正是那栋屋顶装着花式铁饰的房子，那些铁饰一直像是建筑师做的噩梦。
        - id: ch01-b73
          speaker: narrator
          text: 四个孩子一齐紧紧挤到窗口，探头朝外张望。护城河、帐篷和整支围城大军都消失得无影无踪。窗外又是自家的花园，大丽花、金盏花、紫菀和迟开的玫瑰乱蓬蓬地长在一起。尖刺森森的铁栏杆还在原处，栏杆外那条白色道路安安静静。每个人都长长舒了一口气。
        - id: ch01-b74
          speaker: robert
          text: 这下没事了！我早就说过吧？而且咱们到底没有投降，对不对？
          emotion: happy
        - id: ch01-b75
          speaker: cyril
          text: 现在你们该庆幸我许愿要一座城堡了吧？
        - id: ch01-b76
          speaker: anthea
          text: 我想现在是有点儿庆幸。可我不想再许一次了，亲爱的松鼠！
        - id: ch01-b77
          speaker: jane
          text: 简直太精彩了！我一点儿也没害怕。
          emotion: happy
        - id: ch01-b78
          speaker: narrator
          text: 西里尔刚要揭穿她，安西娅赶紧把他拦住。
        - id: ch01-b79
          speaker: anthea
          text: 你们听我说，我刚刚才想到。这是咱们头一回许了愿，却没有惹出麻烦。一丁点儿麻烦都没有。楼下没有人大发雷霆，咱们平平安安，还过了痛快极了的一天。也不完全算痛快，不过你们明白我的意思。现在咱们知道罗伯特多么勇敢，当然西里尔也一样，简也是。而且咱们没跟任何一个大人闹出麻烦。
        - id: ch01-b80
          speaker: narrator
          text: 房门突然被人狠狠推开。玛莎一开口，大家就听出她气坏了。
        - id: ch01-b81
          speaker: martha
          text: 你们真该害臊！我就知道，你们不可能一整天都不闹出点儿混账事！人家不过到前门台阶上透口气，你们就把洗脸壶里的水全倒在人家头上！全都给我上床去，一个不许留。明早起来，看看能不能变成几个好孩子。快点儿，别叫我说第二遍！十分钟以后，谁还没在床上，我就叫他好看。我的新帽子啊，全给毁了！
          emotion: angry
        - id: ch01-b82
          speaker: narrator
          text: 玛莎气冲冲地甩身走了。孩子们在后面七嘴八舌，又是懊悔，又是道歉，她却一个字也不肯听。他们确实很抱歉，可这真的不能全怪他们。你正在朝围城的敌军倒水，城堡却突然变回了自己的家。其他东西都跟着变了，偏偏那锅水没变，还正好落到别人的干净新帽子上。这样的事，谁又拦得住呢？
        - id: ch01-b83
          speaker: cyril
          text: 可那锅水为什么没有变没呢？
        - id: ch01-b84
          speaker: robert
          text: 它为什么要变没？不管到了世界上什么地方，水还不都是水。
        - id: ch01-b85
          speaker: jane
          text: 我想，城堡里的井跟咱们马厩院子里的井，本来就是同一口。
        - id: ch01-b86
          speaker: narrator
          text: 事实还真是这样。
        - id: ch01-b87
          speaker: cyril
          text: 我早就知道，咱们不可能过完一个许愿日还不惹麻烦。刚才好得简直不像真的。走吧，鲍勃斯，我的军事英雄。咱们赶紧钻进被窝，玛莎也许就没那么生气，说不定还会端点儿晚饭上来。我快饿坏了！晚安，小家伙们。
        - id: ch01-b88
          speaker: jane
          text: 晚安。我只希望城堡别在半夜里悄悄爬回来。
        - id: ch01-b89
          speaker: anthea
          text: 它当然不会回来。不过玛莎会回来，不是半夜，是过一会儿。你转过去，我替你解开罩衫带子上的结。
        - id: ch01-b90
          speaker: jane
          text: 要是沃尔弗里克·德·塔尔博特爵士知道，被围的守军有一半穿着罩衫，他该觉得多丢脸呀？
        - id: ch01-b91
          speaker: anthea
          text: 另一半还穿着灯笼裤呢。对，准会丢脸得要命。你站稳一点儿，再乱动只会把结拉得更紧。
