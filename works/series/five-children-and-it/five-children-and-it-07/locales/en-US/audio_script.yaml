  chapters:
    - id: ch01
      title: A SIEGE AND BED
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The children sat at one end of a long bare table in the gloomy banqueting hall. Hope seemed gone. Martha had brought dinner, but the food could not be seen or felt. When they ran their hands over the tabletop, all they found was table.
        - id: ch01-b02
          speaker: narrator
          text: Then Cyril suddenly felt inside his pocket.
        - id: ch01-b03
          speaker: cyril
          text: Wait! Look what I've got. Biscuits!
          emotion: surprised
        - id: ch01-b04
          speaker: narrator
          text: >-
            They were broken and badly crumbled, but they were biscuits. Three were whole, and there was a good handful of bits and crumbs besides.
        - id: ch01-b05
          speaker: cyril
          text: Cook gave them to me this morning, and I completely forgot.
        - id: ch01-b06
          speaker: narrator
          text: >-
            He divided them very fairly into four little heaps. The children ate in happy silence. The biscuits tasted rather odd after spending all morning beside tarred string, green fir cones, and a ball of cobbler's wax in Cyril's pocket.
        - id: ch01-b07
          speaker: robert
          text: >-
            But listen, Squirrel. You're the clever one who explains all this invisible business. Why are the biscuits still here when the bread and meat have vanished?
        - id: ch01-b08
          speaker: cyril
          text: >-
            I don't know. Maybe it's because we already had them. Nothing that belongs to us has changed. Everything else in my pocket is still there.
        - id: ch01-b09
          speaker: robert
          text: Then the mutton would turn real if we had it. I only wish we could find it!
        - id: ch01-b10
          speaker: cyril
          text: We can't find it. Perhaps food isn't ours until it's in our mouths.
        - id: ch01-b11
          speaker: jane
          text: Or in our pockets.
        - id: ch01-b12
          speaker: cyril
          text: >-
            Who puts mutton in a pocket, goose-girl? Still, I have an idea. I'll try it.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Cyril bent until his face was an inch above the table. Then he opened and shut his mouth as if he were biting the air.
        - id: ch01-b14
          speaker: robert
          text: It's no use. You'll only... Hullo!
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: >-
            Cyril straightened up with a triumphant grin and a square of real bread between his teeth. Everyone could see it. The moment he bit off a piece, the rest vanished again. That did not matter, because he knew he still held it, though he could neither see nor feel it. He took another bite from the empty space between his fingers, and bread appeared as his teeth closed on it.
        - id: ch01-b16
          speaker: narrator
          text: >-
            A moment later, all four children were leaning close to the bare-looking table and snapping at the air. Robert managed to catch a slice of mutton. I think it is kinder to draw a veil over the rest of that painful sight. They all got as much mutton as they needed. When Martha came to change the plates, she said that in all her born days she had never seen such a mess.
        - id: ch01-b17
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Just the plain pudding, please. No treacle, jam, or sugar.
        - id: ch01-b18
          speaker: martha
          text: Well, I never! Whatever will be next?
          emotion: surprised
        - id: ch01-b19
          speaker: narrator
          text: >-
            Luckily, the pudding was a plain suet roly-poly, so they could refuse every invisible sauce Martha offered. What followed was no prettier than dinner, because nobody looks graceful picking up slices of suet pudding from a table with their mouth like a dog. But at least the children had eaten. That was the important thing. With their courage restored, they could prepare for the attack that would come before sunset.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Robert was captain, and he insisted that they climb to the top of a tower to scout. From there they could see all around the castle. Beyond the moat, tents surrounded them on every side. Uncomfortable shivers ran down the children's backs as they watched the men cleaning and sharpening weapons, restringing bows, and polishing shields. Then a large party came down the road. Their horses dragged an enormous tree trunk behind them. Cyril turned pale because he knew it was meant for a battering ram.
        - id: ch01-b21
          speaker: cyril
          text: >-
            Thank goodness we have a moat, and the drawbridge is already up. I wouldn't have known how to raise it.
        - id: ch01-b22
          speaker: unidentified_child
          text: Of course a besieged castle would have its drawbridge raised.
        - id: ch01-b23
          speaker: robert
          text: Shouldn't a castle like this have soldiers inside it?
        - id: ch01-b24
          speaker: cyril
          text: >-
            We don't know how long the siege has lasted. Maybe most of the brave defenders died at the beginning, and all the food was eaten. Now only a few fearless survivors remain. That's us, and we'll defend the castle to the death.
        - id: ch01-b25
          speaker: anthea
          text: How exactly do we start defending it to the death?
        - id: ch01-b26
          speaker: cyril
          text: We arm ourselves properly, and when they attack, we shoot at them.
        - id: ch01-b27
          speaker: anthea
          text: >-
            Besieged people used to pour boiling lead on anyone who came too close. Father showed me the special holes at Bodiam Castle. There are holes just like them in this gate tower.
        - id: ch01-b28
          speaker: jane
          text: I'm glad this is only a game. It is only a game, isn't it?
          emotion: fearful
        - id: ch01-b29
          speaker: narrator
          text: Nobody answered her.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The children found plenty of strange weapons around the castle. If they were going to be armed at all, Cyril's promise that they would be "heavily armed" was certainly coming true. The swords, lances, and crossbows were too heavy even for his manly strength. None of the children could begin to bend the longbows. Daggers were easier to manage, though Jane hoped the enemy would never come near enough for a dagger to be useful.
        - id: ch01-b31
          speaker: cyril
          text: >-
            We can throw the daggers like spears, or drop them on people's heads. There are lots of stones across the courtyard too. We should carry some up in case anyone tries to swim across the moat.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Soon a heap of stones filled the room above the gate. Beside it lay a bright, spiky, dangerous heap of knives and daggers.
        - id: ch01-b33
          speaker: narrator
          text: While Anthea crossed the courtyard for more stones, an excellent idea came to her. She went to Martha.
        - id: ch01-b34
          speaker: anthea
          text: >-
            Could we have only biscuits for tea? We're playing at besieged castles, and we need food for the garrison. Please put mine in my pocket because my hands are filthy. I'll send the others for theirs.
        - id: ch01-b35
          speaker: narrator
          text: >-
            It was a wonderfully useful idea. One by one, the children fetched their shares. Martha pushed four generous handfuls of invisible air into their pockets, and each handful became biscuits as soon as it belonged to them. The garrison now had enough food to last until sunset. The children also carried up several iron pots of cold water. They meant to pour it on the besiegers instead of boiling lead, which the castle did not seem to have provided.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The afternoon flew by. It was wonderfully exciting. Only Robert remembered all the time that the danger was real. To the others, who had seen the enemy only from far away, it felt half like make-believe and half like a clear, safe dream. Even Robert felt that way now and then.
        - id: ch01-b37
          speaker: narrator
          text: >-
            When it seemed to be tea-time, they ate their biscuits and drank water from the deep well in the courtyard. There were no cups, so they drank from horns. Cyril insisted on setting eight biscuits aside in case anyone felt faint under the strain of battle.
        - id: ch01-b38
          speaker: narrator
          text: >-
            He was putting them into a small stone cupboard without a door when a sudden sound made him drop three. A trumpet gave a loud, fierce cry.
        - id: ch01-b39
          speaker: robert
          text: You see? It is real. They're going to attack.
        - id: ch01-b40
          speaker: narrator
          text: Everyone rushed to the narrow windows.
        - id: ch01-b41
          speaker: robert
          text: >-
            They're coming out of their tents and running around like ants. There's Jakin dancing about where the bridge meets the castle. I wish he could see me stick my tongue out at him. Yah!
        - id: ch01-b42
          speaker: narrator
          text: >-
            The other children were much too pale to make faces at anyone. They looked at Robert with new respect.
        - id: ch01-b43
          speaker: anthea
          text: You really are brave, Robert.
        - id: ch01-b44
          speaker: cyril
          text: >-
            Rubbish! He's had the whole afternoon to get ready to be brave. I just wasn't ready yet. Give me half a moment, and I'll be braver than he is.
        - id: ch01-b45
          speaker: narrator
          text: Cyril's pale face had suddenly turned red.
        - id: ch01-b46
          speaker: jane
          text: >-
            Oh, what does it matter which of you is bravest? Cyril was perfectly silly to wish for a castle. I don't want to play anymore.
          emotion: fearful
        - id: ch01-b47
          speaker: robert
          text: This isn't a game...
        - id: ch01-b48
          speaker: anthea
          text: >-
            Of course you want to play, Jane. It really is a good game. They can't possibly get inside, and civilized armies always spare women and children if they do.
          emotion: calm
        - id: ch01-b49
          speaker: jane
          text: Are you absolutely sure they're civilized? They come from such a long time ago.
          emotion: fearful
        - id: ch01-b50
          speaker: anthea
          text: >-
            Of course they are. Look at the bright little flags on their lances, and see how grand their leader is. That's him on the gray horse, isn't it, Robert?
        - id: ch01-b51
          speaker: narrator
          text: >-
            Jane agreed to look. The scene was almost too beautiful to be frightening. Green grass spread around the white tents. Little flags fluttered from the flashing lances, and armor gleamed among the bright colors of scarves and tunics. It looked just like a splendid colored picture. The trumpets kept sounding. Whenever the trumpeters stopped to draw breath, the children could hear armor clinking and clanging below, with a low murmur of many voices behind it.
        - id: ch01-b52
          speaker: narrator
          text: >-
            A trumpeter came forward alone and stopped at the very edge of the moat. Somehow the stretch of water now looked much narrower than it had before. He raised his trumpet and blew the longest, loudest blast the children had heard all day. The blaring note carried across the water and into the gatehouse. When its last echo had died away, a man standing beside the trumpeter shouted to the garrison inside.
        - id: ch01-b53
          speaker: herald
          text: Ho there, inside the castle!
        - id: ch01-b54
          speaker: robert
          text: Hullo there!
        - id: ch01-b55
          speaker: herald
          text: >-
            In the name of our lord the King and our good and trusted leader, Sir Wulfric de Talbot, we order this castle to surrender. Refuse, and you will face fire and sword, with no mercy. Do you surrender?
        - id: ch01-b56
          speaker: robert
          text: No, of course we don't! Never, never, never!
        - id: ch01-b57
          speaker: herald
          text: Then whatever happens will be your own fault.
        - id: ch01-b58
          speaker: robert
          text: >-
            Cheer so they know we aren't afraid. Rattle the daggers too, so we sound louder. Ready? One, two, three! Hip, hip, hooray! Again! Hip, hip, hooray! Once more! Hip, hip, hooray!
        - id: ch01-b59
          speaker: narrator
          text: >-
            The children's cheers came out rather high and weak, but the daggers rattling together gave them some strength and depth. Another shout answered from the camp across the moat. At that moment, the little garrison inside the besieged fortress knew that the attack had truly begun.
        - id: ch01-b60
          speaker: narrator
          text: >-
            The room above the great gate was growing dark. Jane found a tiny bit of courage in the thought that sunset must be close.
        - id: ch01-b61
          speaker: anthea
          text: The moat looks terribly narrow now.
        - id: ch01-b62
          speaker: robert
          text: Even if they swim across, they still can't get into the castle.
        - id: ch01-b63
          speaker: narrator
          text: >-
            As he spoke, heavy feet sounded on the stairs outside, and steel clanked with every step. Nobody breathed. The footsteps climbed past them toward the turret. Robert slipped off his shoes and moved softly to the door.
        - id: ch01-b64
          speaker: robert
          text: Wait here.
        - id: ch01-b65
          speaker: narrator
          text: >-
            He crept quickly and quietly after the boots and the clanking spurs, then peered into the upper room. Jakin stood there dripping with moat water. He was working at the machinery that Robert felt sure controlled the drawbridge. Robert slammed the door without warning and turned its huge key just as Jakin sprang toward him from inside.
        - id: ch01-b66
          speaker: narrator
          text: >-
            Robert raced downstairs to the little turret at the foot of the tower, where the largest window was. The others hurried after him.
        - id: ch01-b67
          speaker: robert
          text: We should have been guarding this window!
        - id: ch01-b68
          speaker: narrator
          text: >-
            He was only just in time. Another man had swum across and somehow climbed out of the moat. His fingers were already hooked over the window ledge. Robert saw them clinging there, seized an iron bar from the floor, and struck them as hard as he could. The man dropped back into the moat with a plop and a splash. A moment later, Robert was outside the room. He slammed its door, shot the enormous bolts home, and called Cyril to help him.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Then the children stood in the arched gatehouse, breathing hard and staring at one another. Jane's mouth hung open.
        - id: ch01-b70
          speaker: robert
          text: Cheer up, Jenny. It can't last much longer.
          emotion: calm
        - id: ch01-b71
          speaker: narrator
          text: >-
            A creaking sound came from above. Something rattled and shook, and even the paving stones beneath the children seemed to tremble. Then a crash told them that the drawbridge had been lowered into place.
        - id: ch01-b72
          speaker: robert
          text: >-
            That was that beast Jakin. At least the portcullis is still down. I'm almost sure its controls are lower in the tower.
        - id: ch01-b73
          speaker: narrator
          text: >-
            Hooves and marching feet rang hollowly across the drawbridge.
        - id: ch01-b74
          speaker: robert
          text: Upstairs, quick! We'll drop things on them!
        - id: ch01-b75
          speaker: narrator
          text: >-
            By now even the girls felt almost brave. They followed Robert quickly up the stairs. Under his direction, they lifted stones from the heap and dropped them through the long narrow windows. A confused noise rose from below, and among it they could hear men groaning.
        - id: ch01-b76
          speaker: anthea
          text: Oh dear! I think we've hurt someone.
        - id: ch01-b77
          speaker: narrator
          text: Anthea put down the stone she had been about to throw. Robert snatched it up furiously.
        - id: ch01-b78
          speaker: robert
          text: >-
            I certainly hope we hurt them! I'd give anything for a good kettle of boiling lead. Asking us to surrender, indeed!
          emotion: angry
        - id: ch01-b79
          speaker: narrator
          text: >-
            More feet tramped below. Then there was a pause, followed by the battering ram's first thundering blow against the great door. By now the little room was almost completely dark.
        - id: ch01-b80
          speaker: robert
          text: >-
            We've held them back, and we won't surrender! The sun has to set any moment. Listen, they're shouting underneath us again. There isn't time to fetch more stones. Pour the water down. It won't stop them, but they'll hate it.
        - id: ch01-b81
          speaker: jane
          text: Oh dear, wouldn't it be better to surrender?
          emotion: fearful
        - id: ch01-b82
          speaker: robert
          text: >-
            Never! We can ask for a parley if you like, but we will not surrender. I'm going to be a soldier when I grow up. You'll see. Nobody will make me join the Civil Service.
        - id: ch01-b83
          speaker: jane
          text: >-
            Let's wave a handkerchief and ask to talk. I don't believe the sun is ever going to set tonight.
          emotion: fearful
        - id: ch01-b84
          speaker: robert
          text: Give those brutes the water first!
          emotion: angry
        - id: ch01-b85
          speaker: narrator
          text: >-
            The bloodthirsty Robert insisted that the water must go first. Anthea tipped a pot over the nearest lead hole and began to pour. They heard it splash somewhere below, but no one underneath seemed to feel a drop. The ram smashed into the great gate again, and Anthea stopped pouring.
        - id: ch01-b86
          speaker: robert
          text: >-
            How stupid of us. These holes go straight into the gatehouse. They're for attacking the enemy after they've passed the door and the portcullis, when nearly everything is lost. Give me the pot.
        - id: ch01-b87
          speaker: narrator
          text: >-
            Robert lay flat and looked through a lead hole. Then he crawled onto the three-cornered window ledge in the middle of the wall. Anthea passed him the pot, and he poured the water through the arrow slit.
        - id: ch01-b88
          speaker: narrator
          text: >-
            As the water began to fall, everything stopped at once. The battering ram, the marching enemy, and the cries of "Surrender!" and "De Talbot forever!" all went out like the snuff of a candle. The little dark room seemed to whirl around them and turn upside down. When the children came to themselves, they were safe and sound in the large front bedroom of their own house, the one with the nightmare of ornamental ironwork along its roof.
        - id: ch01-b89
          speaker: narrator
          text: >-
            They all crowded around the window and looked out. The moat was gone. So were the tents and the entire besieging army. Outside lay their own garden, tangled with dahlias, marigolds, asters, and late roses. Beyond its spiky iron railings, the quiet white road stretched past the house exactly as it should. Everyone drew one long, deep breath.
        - id: ch01-b90
          speaker: robert
          text: >-
            There, it's all right! I told you it would be. And we never surrendered, did we?
        - id: ch01-b91
          speaker: cyril
          text: Aren't you glad now that I wished for a castle?
        - id: ch01-b92
          speaker: anthea
          text: >-
            I think I am now. But I don't think I'd want you to wish for it again, dear Squirrel.
        - id: ch01-b93
          speaker: jane
          text: It was absolutely splendid! I wasn't frightened at all.
        - id: ch01-b94
          speaker: cyril
          text: Oh, really...
        - id: ch01-b95
          speaker: anthea
          text: >-
            Wait. I've just thought of something. This is the very first wish that hasn't landed us in trouble. There hasn't been even the tiniest scrap of a row. No one is raging downstairs. We're safe and sound, and we've had a wonderfully jolly day. Well, not exactly jolly, but you know what I mean. Now we know how brave Robert is, and Cyril too, of course, and Jane as well. Best of all, we haven't quarreled with one single grown-up.
        - id: ch01-b96
          speaker: narrator
          text: The door flew open.
        - id: ch01-b97
          speaker: martha
          text: >-
            You ought to be ashamed of yourselves! I knew you couldn't get through one day without some wicked trick. A person can't even breathe the air on the front step without you emptying the washstand jug over her head! Every one of you, off to bed. Try to wake up as better children tomorrow. Go on, and don't make me say it twice. If any of you isn't in bed in ten minutes, you'll know about it. And me wearing a brand-new cap too!
          emotion: angry
        - id: ch01-b98
          speaker: narrator
          text: >-
            Martha swept out while the children called after her in a chorus of regrets and apologies. She paid no attention. They truly were sorry, but it was not their fault. When you are pouring water onto a besieging enemy and your castle suddenly changes into your own house, you cannot help it if everything changes except the water and that water happens to land on someone else's clean cap.
        - id: ch01-b99
          speaker: cyril
          text: I still don't understand why the water didn't vanish.
        - id: ch01-b100
          speaker: robert
          text: Why would it? Water is water everywhere.
        - id: ch01-b101
          speaker: jane
          text: Maybe the castle well was the same well we have in the stable yard.
        - id: ch01-b102
          speaker: narrator
          text: And Jane was right.
        - id: ch01-b103
          speaker: cyril
          text: >-
            I knew a wish-day couldn't end without a row. Everything had been much too good to be true. Come on, Bobs, my great military hero. If we jump into bed quickly, Martha may not be quite so furious. She might even bring us some supper. I'm terribly hungry. Good night, girls.
        - id: ch01-b104
          speaker: jane
          text: Good night. I hope the castle doesn't creep back during the night.
        - id: ch01-b105
          speaker: anthea
          text: >-
            Of course it won't. Martha will be back, though, and she'll be here in a minute. Turn around, Jane. I'll untie that knot in your pinafore strings.
        - id: ch01-b106
          speaker: jane
          text: >-
            Wouldn't Sir Wulfric de Talbot have felt humiliated if he'd known that half the castle's defenders wore pinafores?
        - id: ch01-b107
          speaker: anthea
          text: >-
            And the other half wore knickerbockers. Yes, terribly humiliating. Now hold still. You're only pulling the knot tighter.
