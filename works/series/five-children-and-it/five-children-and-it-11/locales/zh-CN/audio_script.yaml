audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带一点含蓄的幽默
        timbre: 温暖清亮
        pace: 从容而有变化
        pitch: 中音
    cyril:
      display_name: 西里尔
      tts:
        delivery: 自信爽快，像个爱拿主意的大孩子
        timbre: 明亮结实
        pace: 稍快
        pitch: 中高音
    anthea:
      display_name: 安西娅
      tts:
        delivery: 认真体贴，着急时干脆利落
        timbre: 清澈柔韧
        pace: 中速
        pitch: 中高音
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，偶尔一本正经
        timbre: 清亮饱满
        pace: 中速
        pitch: 中音
    jane:
      display_name: 简
      tts:
        delivery: 天真敏感，想象丰富
        timbre: 轻柔明亮
        pace: 中速
        pitch: 高音
    martha:
      display_name: 玛莎
      tts:
        delivery: 爽利泼辣，护着孩子时毫不退让
        timbre: 响亮厚实
        pace: 稍快
        pitch: 中音
    psammead:
      display_name: 赛米阿德
      tts:
        delivery: 古怪尖刻，厌烦中带着老资格的傲慢
        timbre: 干涩沙哑
        pace: 中速
        pitch: 中高音
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔爽快，遇事果断而有主见
        timbre: 温暖清晰
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十一章　最后一个愿望
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 你已经知道，这是第十一章，也是最后一章。所以，这一天正是西里尔、安西娅、罗伯特和简最后一次有机会从赛米阿德，也就是沙仙子那里得到东西。可孩子们自己并不知道。他们满怀着玫瑰色的美梦，一早就有了许多漂亮又明智的主意。平常他们越想越想不出真正值得许的东西，这天却恰好相反。简后来回想起来，只说了一句：“事情向来就是这样。”
        - id: ch01-b02
          speaker: narrator
          text: 那天人人起得格外早。早餐前，大家就在花园里满怀希望地商量。用印有维多利亚女王头像的两先令硬币凑成一百英镑，仍旧最受欢迎。一人一匹小马的主意也紧追在后。早晨把马许来，骑上整整一天，日落时让它消失，第二天再许回来，这样连铺马厩的草料和养马的地方都省了。可早餐时，妈妈的信到了。外婆已经好些，爸爸妈妈希望当天下午就能回家。孩子们欢呼起来，早餐前那些愿望也一下全散了。大家都明白，今天的愿望该让妈妈高兴，不能只顾自己。
        - id: ch01-b03
          speaker: cyril
          text: 妈妈到底会喜欢什么呢？
        - id: ch01-b04
          speaker: jane
          text: 她会喜欢我们几个都乖乖的。
        - id: ch01-b05
          speaker: cyril
          text: 可那对我们太没意思了。再说，不靠沙仙子，我们也应该能做到。得许一件真正了不起、不靠愿望绝对得不到的东西。
        - id: ch01-b06
          speaker: anthea
          text: 说话小心，别忘了昨天。如今不管在哪里，只要说出“我希望”，愿望就会实现。今天尤其不能再惹出蠢事。
        - id: ch01-b07
          speaker: cyril
          text: 知道了，用不着唠叨。
        - id: ch01-b08
          speaker: narrator
          text: 玛莎正好端着一壶热水进来，脸上的神气摆明了有要紧话要说。
        - id: ch01-b09
          speaker: martha
          text: 谢天谢地，咱们还都活着，能吃上这顿早饭！
        - id: ch01-b10
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 怎么啦？出什么事了？
        - id: ch01-b11
          speaker: martha
          text: 没什么。只不过如今这世道，谁都可能在床上叫人杀掉。
        - id: ch01-b12
          speaker: narrator
          text: 玛莎说得阴森森的。简听了，一阵恐怖的寒意从背上窜下来，顺着两条腿一直跑到脚趾尖。奇怪的是，这股寒意虽然吓人，却又让她觉得十分刺激。
        - id: ch01-b13
          speaker: jane
          text: 真有人在床上被杀了吗？
        - id: ch01-b14
          speaker: martha
          text: 倒也不完全是，可也差不多。皮斯马什庄园昨晚进了贼。比尔刚刚告诉我，奇滕登夫人的每一颗钻石、每一件珠宝，还有那些值钱东西，全叫强盗拿走了。她现在昏过去又醒来，醒来又昏过去，两次昏倒中间几乎只来得及喊一句：“啊，我的钻石！”偏偏奇滕登勋爵又去了伦敦，根本不在家。
        - id: ch01-b15
          speaker: anthea
          text: 我们见过奇滕登夫人。她就是那个穿红白相间裙子的太太。她自己没有孩子，而且一点儿也受不了别人家的孩子。
        - id: ch01-b16
          speaker: martha
          text: 就是她。她把心全放在钱财上，现在你们瞧，她落到什么下场。听说那些钻石珠宝值几千个几千英镑。有一条项链，有一条什么“河流”，我也不知道那究竟是什么，还有数不清的手镯，一顶冠冕和好多好多戒指。好啦，我不能站在这里光顾着聊。你们妈妈回来以前，整座屋子还等着我从头到尾打扫干净呢。
        - id: ch01-b17
          speaker: narrator
          text: 玛莎说完便风风火火地去打扫屋子。安西娅觉得奇滕登夫人很讨厌，不明白她为什么非得有那么多钻石。妈妈一颗钻石也没有，珠宝也只有一串黄玉项链、订婚时爸爸送的蓝宝石戒指、一枚石榴石星形饰物，还有一枚小珍珠胸针，里面装着曾外祖父的头发。差不多就这些了。
        - id: ch01-b18
          speaker: robert
          text: 我长大以后去非洲探险，会赚多得花不完的钱。只要妈妈想要，我就给她买数也数不清的钻石。
        - id: ch01-b19
          speaker: jane
          text: 要是妈妈一回房间，就找到所有漂亮东西，那该多好。项链、钻石河流、冠冕……
        - id: ch01-b20
          speaker: cyril
          text: 是王冠。
        - id: ch01-b21
          speaker: jane
          text: 那就王冠吧。还有戒指，什么都有。我希望她真能找到。
        - id: ch01-b22
          speaker: narrator
          text: 另外三个孩子惊恐地瞪着她。简已经说出了“我希望”，愿望当然也就许下了。如今唯一的机会，是尽快找到赛米阿德。要是它心情够好，也许会把这个愿望收回，再准他们许一个新的。要是不肯，谁也不知道这一回要招来什么。
        - id: ch01-b23
          speaker: robert
          text: 要是赛米阿德心情好，也许肯把这个愿望收回，再给我们一个。要是不肯，天知道这次会招来什么。警察肯定会找上门，接下来还不知道有什么麻烦。简，别哭，别犯傻，我们几个都会跟你站在一起。爸爸说过，只要我们没有做错事，又始终肯说实话，就永远不必害怕。
        - id: ch01-b24
          speaker: narrator
          text: 西里尔和安西娅却交换了一个阴沉的眼神。他们记得，上次把赛米阿德的实话告诉警察，那番真话听起来有多么不可信。这一天真是接连倒霉。赛米阿德怎么找也找不到，珠宝同样没有踪影，尽管四个孩子把妈妈的房间一遍又一遍地搜了个遍。
        - id: ch01-b25
          speaker: robert
          text: 当然得妈妈亲自找到。也许她会以为，那些东西已经在家里放了好多年，根本不知道是赃物。
        - id: ch01-b26
          speaker: cyril
          text: 对呀，然后妈妈就成了窝藏赃物的人。你明明知道，那更糟糕。
        - id: ch01-b27
          speaker: narrator
          text: 孩子们不肯死心，又把沙坑彻彻底底搜了一遍。可不管他们怎样翻找，赛米阿德还是不肯露面。他们什么办法也没找到，只好迈着沉重的步子，垂头丧气、慢吞吞地回家。
        - id: ch01-b28
          speaker: anthea
          text: 我不管，我们就把全部真相告诉妈妈。她知道以后，一定会把珠宝还给失主，也一定能想办法把所有事情都处理好。
        - id: ch01-b29
          speaker: cyril
          text: 你真觉得妈妈会相信吗？没有亲眼见过赛米阿德，谁能相信这种事？她会以为我们在编故事。要不，她就会觉得我们全疯了，把我们送进疯人院。简，你愿意被关进一只铁笼子吗？四周全是栏杆，墙上都包着软垫。一天到晚除了往头发里插稻草，什么也不能做，还得不停听其他疯子又嚎又叫。大家都认命吧，告诉妈妈根本没有用。
        - id: ch01-b30
          speaker: jane
          text: 可这是真的。
        - id: ch01-b31
          speaker: anthea
          text: 当然是真的，可对大人来说，这种真话还不够让人相信。西里尔说得对。我们先把所有花瓶都插满，尽量别再想那些钻石。毕竟前几回，不管中间多么糟糕，到最后事情总会恢复正常。
        - id: ch01-b32
          speaker: narrator
          text: 他们找来紫菀、百日菊，还有马厩院墙上花瓣松散、开得很晚的红玫瑰，把能找到的瓶瓶罐罐全插满了。整座屋子简直成了一座花亭。午饭才收拾完不久，妈妈就到了。八条充满爱意的小胳膊一齐抱住她。孩子们早已习惯把一切都告诉妈妈，这次要忍住不立刻讲出赛米阿德的事，实在难极了，可他们到底忍住了。
        - id: ch01-b33
          speaker: narrator
          text: 妈妈也有许多话。她讲起外婆，讲起外婆的鸽子，还讲起埃玛姨妈那头温驯却跛了腿的驴。她看见屋里处处是花，欢喜极了。妈妈一回到家，一切都显得那么自然，那么舒服，孩子们几乎以为赛米阿德只是场梦。可她一走向楼梯，要回卧室摘帽子，八条胳膊马上又缠了上去。瞧那架势，她好像只生了两个孩子，一个是小羊羔，另一个是只章鱼。
        - id: ch01-b34
          speaker: anthea
          text: 亲爱的妈妈，别上楼。我替你把东西送上去。
        - id: ch01-b35
          speaker: cyril
          text: 我去也行。
        - id: ch01-b36
          speaker: robert
          text: 我们想让你看看那棵玫瑰。
        - id: ch01-b37
          speaker: jane
          text: 啊，别上楼！
        - id: ch01-b38
          speaker: mother
          text: 别胡闹，亲爱的孩子们。我还没老到不能去该去的地方摘帽子。再说，这双黑乎乎的手也该洗洗了。
        - id: ch01-b39
          speaker: narrator
          text: 不管孩子们怎样阻拦，妈妈还是上了楼。孩子们紧紧跟在后面，彼此交换着充满不祥预感的眼色。她摘下帽子。说真的，那顶饰着白玫瑰的帽子漂亮得很。随后她走到梳妆台前，准备打理自己好看的头发。就在戒指架和针垫之间，端端正正放着一只从没见过的绿皮盒。她伸手拿起盒子，打开了它。
        - id: ch01-b40
          speaker: mother
          text: 啊，多漂亮！这么大的珍珠，旁边还有一圈闪亮的钻石。这是哪里来的？戴在我的婚戒手指上正合适。它到底怎么会在这里？
          emotion: surprised
        - id: ch01-b41
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 我不知道。
        - id: ch01-b42
          speaker: mother
          text: 一定是爸爸叫玛莎放的。我下楼问问她。
        - id: ch01-b43
          speaker: anthea
          text: 先让我看看。
        - id: ch01-b44
          speaker: narrator
          text: 安西娅知道，愿望造出的戒指，玛莎根本看不见。果然，玛莎否认自己放过戒指，伊莱扎和厨娘也一样。妈妈回到卧室，对戒指又好奇又高兴。可她拉开梳妆台抽屉，发现一只长盒子，里面装着一条几乎价值连城的钻石项链时，她就更加好奇，却不那么高兴了。她走到衣橱前收起帽子，又找到一顶王冠和好几枚胸针。接下来的半个钟头里，其余珠宝也从房间各处一件件冒出来。孩子们看起来越来越不安，简已经开始抽鼻子。
        - id: ch01-b45
          speaker: mother
          text: 简，我知道你一定明白些什么。先想清楚，再把实话告诉我。
        - id: ch01-b46
          speaker: jane
          text: 我们发现了一个仙子。
        - id: ch01-b47
          speaker: mother
          text: 请别胡说。
        - id: ch01-b48
          speaker: cyril
          text: 简，别犯傻。妈妈，我们以前从没见过这些东西。可皮斯马什庄园的奇滕登夫人昨晚叫强盗偷走了所有珠宝。这些会不会就是她的？
        - id: ch01-b49
          speaker: narrator
          text: 房间里每个人都深深吸了一口气。西里尔终于替他们找到了一个不用提沙仙子、听上去又说得通的解释。他们得救了，至少眼下是这样。
        - id: ch01-b50
          speaker: mother
          text: 可强盗怎么会把珠宝放在这里？为什么要这么做？带着东西逃走，不是更容易、更安全吗？
        - id: ch01-b51
          speaker: cyril
          text: 也许他们想等到日落……我是说，等天黑以后再拿走。除了我们，没人知道你今天回来。
        - id: ch01-b52
          speaker: mother
          text: 我得立刻去叫警察。真希望爸爸在家！
        - id: ch01-b53
          speaker: robert
          text: 不能等爸爸回来再说吗？
        - id: ch01-b54
          speaker: mother
          text: 不行，这件事压在心上，我一分钟也等不了。
        - id: ch01-b55
          speaker: narrator
          text: 妈妈说的“这件事”，就是床上堆着的那一大堆珠宝盒。那些钻石全压在她心上，她自然一分钟也不肯多等。大家只好把盒子一只只收进衣橱。妈妈锁好衣橱，随后把玛莎叫到面前。
        - id: ch01-b56
          speaker: mother
          text: 玛莎，我不在的时候，有没有陌生人进过我的房间？你必须老老实实回答。
        - id: ch01-b57
          speaker: martha
          text: 没有，太太。至少，我的意思是……
        - id: ch01-b58
          speaker: mother
          text: 我看得出确实有人进来。马上告诉我，别害怕。我相信你没做错什么。
          emotion: calm
        - id: ch01-b59
          speaker: narrator
          text: 玛莎放声大哭。
        - id: ch01-b60
          speaker: martha
          text: 我本来今天就要向您辞工，做满这个月便走，真的，太太。因为我要叫一个体面的年轻人过上幸福日子。他是看守猎场的，名叫比尔，我绝不敢骗您。您突然说要回来，事先连个信儿也没有。他一片好心，对我说：“玛莎，我的美人儿。”其实我不是美人儿，从来也没美过，可您知道，男人说起话来就是那个样子。他又说：“我不能眼睁睁看你干这干那，累死累活，却不来搭把手。我这条胳膊结实得很，它就是你的，亲爱的玛莎。”所以他帮我擦了窗户。可他一直在外面，我一直在屋里。我要是有半句假话，就叫我再也说不出一个有气儿的字。这全是福音一样的真话。
        - id: ch01-b61
          speaker: mother
          text: 你一直跟他在一起吗？
        - id: ch01-b62
          speaker: martha
          text: 他在外面，我在里面，一直都是。只有一次，我去拿干净水和擦窗的皮子。那个懒货伊莱扎把皮子藏在轧衣机后面了。
        - id: ch01-b63
          speaker: mother
          text: 够了。玛莎，我不喜欢你这样做，不过你说了实话，这总算是件好事。
        - id: ch01-b64
          speaker: narrator
          text: 玛莎离开以后，孩子们全围上来抱住妈妈。
        - id: ch01-b65
          speaker: anthea
          text: 亲爱的妈妈，这不是比尔的错，真的不是！他是个大好人，光明磊落，像白天一样诚实。别让警察抓他。别抓他，别，别，别！
          emotion: fearful
        - id: ch01-b66
          speaker: narrator
          text: 事情糟糕透了。只因为简许下那个蠢愿望，一个清白无辜的人竟背上了强盗的嫌疑，而把真相说出来又毫无用处。孩子们人人都恨不得告诉妈妈。可他们一想到疯人院，想到四周的铁栏杆和软垫墙，想到插在头发里的稻草，还有别的疯子发出的嚎叫和凄厉尖声，就怎么也开不了口。
        - id: ch01-b67
          speaker: mother
          text: 附近有没有马车？什么车都行。我必须马上去罗切斯特报警。
        - id: ch01-b68
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 农场有车。可是别去，别去！等爸爸回来吧！
          emotion: fearful
        - id: ch01-b69
          speaker: narrator
          text: 孩子们一边哭，一边求她别去，等爸爸回家再说。妈妈却一点儿也不理会这些恳求。她一旦拿定主意，总会认准方向，一路做到底。说起这一点，她的确很像安西娅。
        - id: ch01-b70
          speaker: mother
          text: 西里尔，家里交给你。你要一直待在更衣室，可以假装在浴缸里放小船，或者玩点别的，就说是我准许的。通往楼梯平台的门要开着，另一扇门我已经锁了。千万别让任何人进我的卧室。除了我、你们几个，还有把珠宝放进来的恶贼，谁也不知道它们藏在那里。罗伯特，你留在花园里盯紧窗户。要是有人想闯进去，马上跑去告诉那两个农场伙计。我会叫他们到厨房等着，也会说附近有危险人物，这话一点不假。你们俩要记住，我信任你们。不过，那些人多半要等天黑才动手，所以你们很安全。再见，亲爱的孩子们。
        - id: ch01-b71
          speaker: narrator
          text: 妈妈锁好卧室门，把钥匙放进口袋，马上出发了。孩子们忍不住佩服她那股勇往直前、当机立断的劲儿。他们最近许愿的时机总是不对，已经被愿望逼进过不少绝境。要是妈妈当时也在，她一定很会组织大家从那些困境里逃出去。
        - id: ch01-b72
          speaker: cyril
          text: 她天生就是个将军。可我们这回到底怎么办？就算女孩们再去找那只可恶的赛米阿德，真的找到它，又让它把珠宝弄走，妈妈也只会以为我们没有好好看守，让强盗偷偷溜进房间，把珠宝拿走了。要不，警察会觉得是我们把东西藏起来了。再不然，他们会以为妈妈从头到尾都在戏弄他们。这回真是乱得漂亮，也乱得吓人，一点儿也没说错。
        - id: ch01-b73
          speaker: narrator
          text: 西里尔恶狠狠地折起一只纸船，照妈妈吩咐的那样，放进浴缸里漂。罗伯特走到花园，坐在磨得发黄的草地上，无助地用双手捧住苦恼的脑袋。安西娅和简在楼下过道低声商量。那里铺着椰壳纤维垫子，垫上有个洞，一不小心总会绊住脚。厨房里传来玛莎的声音，她还在没完没了地大声抱怨。
        - id: ch01-b74
          speaker: anthea
          text: 事情简直糟糕得不能再糟糕。谁知道奇滕登夫人的所有钻石是不是都在这里？要是少了一件，警察就会以为爸爸妈妈拿走了缺的那些，只交出一部分珠宝，好拿这些东西作幌子，拼命蒙骗他们。爸爸妈妈会被关进监狱，我们也会被打上烙印，变成罪犯家里遭人唾弃的孩子。当然了，对爸爸妈妈来说，这种结果也一点儿都不舒服。
        - id: ch01-b75
          speaker: jane
          text: 可我们能做什么？
        - id: ch01-b76
          speaker: anthea
          text: 什么也做不了。至少还能再找一次赛米阿德。今天这么热，它也许会出来晒那根胡须。
        - id: ch01-b77
          speaker: jane
          text: 它今天不会再给我们可恶的愿望了。每次见面，它都比上次更生气。我觉得它恨透了替人许愿。
        - id: ch01-b78
          speaker: narrator
          text: 简认定，赛米阿德越来越讨厌替他们实现愿望。安西娅听着这句话，一直阴沉沉地摇头。忽然，她猛地停了下来，动作快得简直像一只突然竖起耳朵的小动物。一个念头终于从绝境里冒了出来。
        - id: ch01-b79
          speaker: jane
          text: 怎么了？你想到办法了？
        - id: ch01-b80
          speaker: anthea
          text: 我们唯一的机会，最后一个孤零零、苦巴巴、没着没落的希望。快走！
        - id: ch01-b81
          speaker: narrator
          text: 安西娅迈着轻快的步子，领着简一路小跑到沙坑。真叫人高兴，赛米阿德果然在那里。它躺在一处金灿灿的沙窝里晒太阳，迎着明亮的午后阳光，快活地梳理胡须。它一看见女孩们，立刻转身往沙里钻。显然，比起她们，它更喜欢自己跟自己待着。可安西娅比它更快，轻轻却牢牢抓住它毛茸茸的肩膀，不让它逃走。
        - id: ch01-b82
          speaker: psammead
          text: 喂，少来这一套！放开我，听见没有？
        - id: ch01-b83
          speaker: narrator
          text: 安西娅一点也没松手。
        - id: ch01-b84
          speaker: anthea
          text: 亲爱的、好心的、最最可爱的赛米阿德。
        - id: ch01-b85
          speaker: psammead
          text: 说得倒好听。你又想要一个愿望吧？我不能从早到晚给你们做苦工，没完没了地实现愿望。我也需要一点自己的时间。难道我每天除了替别人把愿望变成真的，就不该有片刻清静吗？
        - id: ch01-b86
          speaker: anthea
          text: 你讨厌替人实现愿望吗？
        - id: ch01-b87
          speaker: psammead
          text: 当然讨厌。快放开，不然我咬你！我真的会咬，说到做到。好吧，你非要冒险就随你。
          emotion: angry
        - id: ch01-b88
          speaker: narrator
          text: 安西娅还是抓着不放。
        - id: ch01-b89
          speaker: anthea
          text: 别咬我，先听我说。只要今天肯照我们的心愿做，从今以后，我们一辈子也不再向你要愿望。
        - id: ch01-b90
          speaker: narrator
          text: 这份承诺正说中了赛米阿德最大的心愿。它刚才还怒气冲冲，这时却一下子感动极了，连开口时都带上了哭腔。
        - id: ch01-b91
          speaker: psammead
          text: 只要今天以后，你们永远、永远不再来求我，我什么都肯做。我宁可把自己撑破，也会一个接一个替你们实现愿望，只要我还能撑得住。你们根本不知道，我有多讨厌为了别人的愿望把自己吹鼓。我还总是提心吊胆，生怕拉伤一块肌肉，或者弄出别的毛病。每天早晨一醒来，就知道这件苦差事非做不可。你们不知道那是什么滋味，你们不知道，你们就是不知道！
          emotion: sad
        - id: ch01-b92
          speaker: narrator
          text: 它激动得破了音，最后一个“不懂”尖得像吱叫。安西娅轻轻把它放回沙地。
        - id: ch01-b93
          speaker: anthea
          text: 现在都过去了。我们郑重答应，过了今天，再也不求你实现愿望。
          emotion: calm
        - id: ch01-b94
          speaker: psammead
          text: 那就说吧，赶紧把事情做完。
        - id: ch01-b95
          speaker: anthea
          text: 你能实现多少个？
        - id: ch01-b96
          speaker: psammead
          text: 不知道，只要我还能撑得住。
        - id: ch01-b97
          speaker: anthea
          text: 第一个，我希望奇滕登夫人发现，她的珠宝从来没有丢过。
        - id: ch01-b98
          speaker: narrator
          text: 赛米阿德照旧把自己吹得圆鼓鼓的，随后一下子瘪回原样。第一个愿望已经实现。
        - id: ch01-b99
          speaker: psammead
          text: 第一个愿望办好了。
        - id: ch01-b100
          speaker: anthea
          text: 我希望妈妈到不了警察局。
        - id: ch01-b101
          speaker: narrator
          text: 赛米阿德又把自己吹鼓。等过了每个愿望都该有的那一小会儿，它瘪了下去，告诉安西娅，第二个愿望也已经办好。
        - id: ch01-b102
          speaker: jane
          text: 我希望妈妈能把钻石的事全忘掉。
        - id: ch01-b103
          speaker: psammead
          text: 这个愿望也办好了。
        - id: ch01-b104
          speaker: narrator
          text: 赛米阿德第三次瘪回去时，声音明显比刚才虚弱了许多。连续实现这些愿望，已经耗去了它不少力气。
        - id: ch01-b105
          speaker: anthea
          text: 你要不要歇一会儿？
        - id: ch01-b106
          speaker: psammead
          text: 要，谢谢。继续以前，你们能不能替我许个愿？
        - id: ch01-b107
          speaker: anthea
          text: 你不能替自己实现愿望吗？
        - id: ch01-b108
          speaker: psammead
          text: 当然不能。从前总是我们彼此替对方实现愿望。不过在美好的大地懒时代，我们也没什么愿望。现在请你们许愿，希望你们几个永远不能把关于我的一个字告诉任何人。
        - id: ch01-b109
          speaker: jane
          text: 为什么？
        - id: ch01-b110
          speaker: psammead
          text: 这还不明白？你们要是把我的事告诉大人，我这辈子就别想安生。他们会把我抓住，也绝不会像你们这样，只许些傻里傻气的愿望。他们会认真去许真正的大事。那些搞科学的人十有八九还会想出办法，让愿望变出的东西过了日落也不消失。接着，大人们会向我要累进所得税、养老金、男子选举权、免费中等教育，还有一大堆同样无聊的东西。他们不但会得到，还会永远留住。到时候，整个世界都会给翻个底朝天。快点许吧！
        - id: ch01-b111
          speaker: narrator
          text: 安西娅一字不漏地重复了赛米阿德的愿望。从今以后，他们几个再也不能向任何人说出有关它的一个字。赛米阿德把自己吹得比她们从前见过的任何一次都大，过了一会儿，才慢慢瘪了下去。
        - id: ch01-b112
          speaker: psammead
          text: 现在还能替你们做什么？
        - id: ch01-b113
          speaker: anthea
          text: 只剩一件事，这样应该能解决所有麻烦。简，你说对不对？我希望玛莎忘掉钻石戒指，也希望妈妈忘掉看守猎场的人来擦窗户。
        - id: ch01-b114
          speaker: jane
          text: 这就像《黄铜瓶》里的办法。
        - id: ch01-b115
          speaker: anthea
          text: 对，幸亏我们读过，不然我绝对想不到。
        - id: ch01-b116
          speaker: psammead
          text: 我已经快累垮了。你们再仔细想想，还有没有非办不可的事？
        - id: ch01-b117
          speaker: anthea
          text: 没有了。只想认真谢谢你，感谢你为我们做过的一切。希望你接下来能舒舒服服地睡上很久，不再叫任何人打搅。还希望将来有一天，我们能够再见到你。
        - id: ch01-b118
          speaker: psammead
          text: 那是个愿望吗？
        - id: ch01-b119
          speakers: [anthea, jane]
          ensemble: duo
          text: 是的，请替我们实现吧。
        - id: ch01-b120
          speaker: narrator
          text: 于是，这是她们在这个故事里最后一次看见赛米阿德把自己吹鼓，又突然瘪下去。它朝两个女孩点了点头，眨了眨蜗牛触角似的长眼睛，然后转身钻进沙里。直到身影快要消失的最后一刻，它还在拼命抓挠。细沙从四周滑下来，慢慢合拢，最后把它完全盖住了。
        - id: ch01-b121
          speaker: jane
          text: 希望我们做对了？
        - id: ch01-b122
          speaker: anthea
          text: 我肯定做对了。回家告诉男孩子们吧。
        - id: ch01-b123
          speaker: narrator
          text: 安西娅回家找到西里尔。他正对着自己的纸船闷闷不乐，她便把经过都告诉了他。简则去告诉罗伯特。两个故事才刚讲完，妈妈就走进门来，又热又满身尘土。她本来坐车去罗切斯特，想给女孩们买秋天上学穿的裙子，不料半路上车轴断了。要不是小路很窄，两边的树篱又高又软，她准会被甩出车外。现在她虽然没受伤，却只好一路走回来。
        - id: ch01-b124
          speaker: mother
          text: 啊，我最亲爱的宝贝们，我简直渴死了，非喝杯茶不可！快去看看水壶开了没有！
        - id: ch01-b125
          speaker: jane
          text: 你看，事情全好了。妈妈连钻石和报警的事都不记得了。
        - id: ch01-b126
          speaker: anthea
          text: 玛莎也一点儿不记得钻石戒指。我刚才去问水壶烧得怎么样，已经看出来了。
        - id: ch01-b127
          speaker: narrator
          text: 仆人们坐着喝茶时，看守猎场的比尔顺路进来，带来一个人人都欢迎的好消息。奇滕登夫人的钻石根本没有丢。奇滕登勋爵把它们拿去重新镶嵌和清洗了，知道这件事的女仆又恰好休假去了。所以，这件事也彻底恢复了正常。
        - id: ch01-b128
          speaker: narrator
          text: 到了晚上，妈妈去哄小羊羔上床睡觉。四个孩子终于可以放心了。他们一起走进花园，在熟悉的小路上慢慢散步，也说起了那个已经钻回沙里的赛米阿德。
        - id: ch01-b129
          speaker: jane
          text: 不知道以后还能不能见到赛米阿德。
          emotion: sad
        - id: ch01-b130
          speaker: cyril
          text: 只要你真心许了愿，我敢说一定会再见到它。
        - id: ch01-b131
          speaker: anthea
          text: 我们已经郑重答应过它，从今以后，再也不向它要任何愿望了。
        - id: ch01-b132
          speaker: robert
          text: 我也再不想要了。
        - id: ch01-b133
          speaker: narrator
          text: 后来，他们当然又见到了赛米阿德。不过，那已经不是发生在这个故事里的事了。他们再次相遇的地方，也不再是这座铺满金色砂砾的熟悉沙坑，而是一个非常、非常、非常不同的地方。那是在一个……可是到了这里，我必须停下。至于那个地方究竟是什么，我现在一个字也不能再说了。
