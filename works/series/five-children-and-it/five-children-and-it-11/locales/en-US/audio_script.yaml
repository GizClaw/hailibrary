  chapters:
    - id: ch01
      title: Plans for the Last Wish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            You can see that this is the eleventh and last chapter, so you know the day in it must be the last day when Cyril, Anthea, Robert, and Jane could get anything from the Psammead, or Sand-fairy. The children did not know that. They were full of bright plans. On other days, thinking of a really good wish had often been terribly hard. Now their heads were crowded with beautiful, sensible ideas. Jane said afterward that this was always the way things happened.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Everyone got up extra early. Before breakfast, they met in the garden and eagerly discussed their plans. A hundred pounds in modern florins was still the favorite. The closest rival was a pony for each child. That idea had one great advantage. They could wish for the ponies in the morning, ride all day, let them vanish at sunset, and wish them back the next day. It would save all the cost of stables and litter.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Then two things happened at breakfast. First came a letter from Mother. Granny was better, and Mother and Father hoped to be home that very afternoon. The children cheered. At once, all their earlier ideas scattered. Plainly, today's wish had to please Mother instead of themselves.
        - id: ch01-b04
          speaker: cyril
          text: I wonder what she'd really like.
        - id: ch01-b05
          speaker: jane
          text: She'd like every one of us to be good.
        - id: ch01-b06
          speaker: cyril
          text: >-
            Yes, but that would be awfully dull for us. Besides, I should hope we can be good without a Sand-fairy doing it for us. No, it has to be something splendid, something we could never get unless we wished.
        - id: ch01-b07
          speaker: anthea
          text: >-
            Be careful. Don't forget what happened yesterday. Now our wishes come true wherever we are when we say, "I wish." We mustn't land ourselves in anything silly today, of all days.
        - id: ch01-b08
          speaker: cyril
          text: All right. You don't have to lecture me.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Just then Martha came in carrying hot water for the teapot. Her face told the children that she had important news.
        - id: ch01-b10
          speaker: martha
          text: It's a blessing we're all still alive to eat our breakfasts!
        - id: ch01-b11
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Why? What's happened?
        - id: ch01-b12
          speaker: martha
          text: Oh, nothing much. Only it seems no one is safe from being murdered in bed these days.
        - id: ch01-b13
          speaker: narrator
          text: >-
            A pleasant shiver of horror ran down Jane's back, through her legs, and right out at her toes.
        - id: ch01-b14
          speaker: jane
          text: Has somebody been murdered in bed?
        - id: ch01-b15
          speaker: martha
          text: >-
            Well, not exactly, but they might as well have been. Burglars broke into Peasmarsh Place. Beale just told me. They took every one of Lady Chittenden's diamonds and jewels, and now she keeps fainting. She barely has time to cry, "Oh, my diamonds!" before she faints again. Lord Chittenden is away in London too.
        - id: ch01-b16
          speaker: anthea
          text: >-
            We've seen Lady Chittenden. She wears that red-and-white dress. She hasn't any children, and she can't stand anyone else's.
        - id: ch01-b17
          speaker: martha
          text: >-
            That's the lady. She trusted in riches, and now you see what came of it. They say those things were worth thousands and thousands of pounds. There was a necklace and a river, whatever that may be, heaps of bracelets, a tarrer, and ever so many rings. But I can't stand here talking. This whole place must be cleaned before your ma comes home.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Martha hurried away. Anthea could not see why Lady Chittenden had ever needed so many diamonds. She had seemed rather nasty. Mother had no diamonds and hardly any jewels at all, only a topaz necklace, the sapphire ring Father gave her when they were engaged, a garnet star, and a little pearl brooch that held Great-grandpapa's hair.
        - id: ch01-b19
          speaker: robert
          text: >-
            When I'm grown up, I'll buy Mother as many diamonds as she wants. I'll make so much money exploring Africa that I won't know what to do with it.
        - id: ch01-b20
          speaker: jane
          text: >-
            Wouldn't it be lovely if Mother came home and found all those beautiful things in her room? The necklaces, the rivers of diamonds, the tarrers—
        - id: ch01-b21
          speaker: cyril
          text: Ti-AR-as.
        - id: ch01-b22
          speaker: jane
          text: >-
            Ti-ar-as, then. And all the rings and everything. I wish she would.
        - id: ch01-b23
          speaker: narrator
          text: The others stared at Jane in horror.
        - id: ch01-b24
          speaker: robert
          text: >-
            Well, now she will. You've made the wish, Jane. Our only hope is to find the Psammead. If it's in a good temper, it might undo this wish and give us another. If it won't, goodness knows what will happen. There'll be police, of course. Don't cry, silly. We'll stand by you. Father says there's no need to be afraid when you haven't done wrong and you always tell the truth.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Cyril and Anthea gave each other gloomy looks. They remembered how well the police had believed the truth about the Psammead before.
    - id: ch02
      title: The Jewels Appear
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            It was a day of bad luck. They could not find the Psammead. They could not find the jewels either, though every child searched Mother's room again and again.
        - id: ch02-b02
          speaker: robert
          text: >-
            Of course we can't find them. Mother is the one who'll do that. Perhaps she'll think they've always been in the house and never realize they're the stolen jewels.
        - id: ch02-b03
          speaker: cyril
          text: >-
            Oh yes, of course. Then Mother will be receiving stolen goods, and you know perfectly well what that is worse than.
        - id: ch02-b04
          speaker: narrator
          text: >-
            They searched the sandpit once more and searched it thoroughly. Still no Psammead. Slowly and sadly, they returned to the house.
        - id: ch02-b05
          speaker: anthea
          text: >-
            I don't care. We'll tell Mother the truth. She'll give the jewels back, and then she'll make everything right.
        - id: ch02-b06
          speaker: cyril
          text: >-
            Do you really think she'll believe us? Could anybody believe in a Sammyadd without seeing it? She'll think we're making it up. Or she'll decide we're raving mad and send us to Bedlam. How would you like that?
        - id: ch02-b07
          speaker: narrator
          text: Cyril turned suddenly toward miserable Jane.
        - id: ch02-b08
          speaker: cyril
          text: >-
            Think of being locked in an iron cage with bars and padded walls. You'd have nothing to do all day but stick straws in your hair and listen to all the other lunatics howl and rave. You may as well all get used to the idea. Telling Mother is no use.
        - id: ch02-b09
          speaker: jane
          text: But it is true.
        - id: ch02-b10
          speaker: anthea
          text: >-
            Of course it is. It just isn't the sort of truth grown-ups believe. Cyril is right. Let's fill all the vases with flowers and try not to think about diamonds. Everything has come right in the end every other time.
        - id: ch02-b11
          speaker: narrator
          text: >-
            They filled every pot they could find. They used asters and zinnias, and late red roses with loose petals from the stable-yard wall, until the whole house had become a perfect flower bower.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Dinner had barely been cleared away when Mother arrived and eight loving arms closed around her. The children were used to telling her everything that happened, so keeping the whole strange history of the Psammead to themselves was extremely difficult. Again and again, they nearly began the story, but somehow they managed not to tell her. Mother had plenty of news herself, about Granny getting better, Granny's pigeons, and Auntie Emma's tame donkey with the lame leg.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Mother loved the way the flowers had turned the house into a bower. With her home, everything felt so pleasant and ordinary that the children almost believed they had dreamed the Psammead. Then she moved toward the stairs. She meant to go to her bedroom and take off her bonnet. Eight arms seized her again, so tightly that she might have had only two children, the Lamb and an octopus.
        - id: ch02-b14
          speaker: anthea
          text: Mummy darling, don't go upstairs. Let me carry your things up.
        - id: ch02-b15
          speaker: cyril
          text: Or let me do it.
        - id: ch02-b16
          speaker: robert
          text: Come and see the rose tree first.
        - id: ch02-b17
          speaker: jane
          text: Oh, please don't go up!
        - id: ch02-b18
          speaker: mother
          text: >-
            Nonsense, dears. I'm not so old that I can't take off my own bonnet in the proper place. Besides, I need to wash these black hands.
        - id: ch02-b19
          speaker: narrator
          text: >-
            Up she went. The children followed, sharing looks full of dreadful expectation. Mother removed her bonnet. It was really a very pretty hat, with white roses on it. Then she crossed to the dressing table to arrange her pretty hair.
        - id: ch02-b20
          speaker: narrator
          text: >-
            Between the ring stand and the pincushion sat a green leather case. Mother opened it. Inside was a large pearl ring surrounded by diamonds that flashed with many colors.
        - id: ch02-b21
          speaker: mother
          text: >-
            Oh, how beautiful! Where in the world did this come from? And how did it get here?
          emotion: surprised
        - id: ch02-b22
          speaker: narrator
          text: >-
            She tried the ring on her wedding finger. It fitted perfectly, and she admired it with deep, delighted wonder.
        - id: ch02-b23
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: We don't know.
        - id: ch02-b24
          speaker: narrator
          text: Every child had answered truthfully.
        - id: ch02-b25
          speaker: mother
          text: Father must have asked Martha to leave it here. I'll go down and ask her.
        - id: ch02-b26
          speaker: anthea
          text: Let me see it first.
        - id: ch02-b27
          speaker: narrator
          text: >-
            Anthea knew Martha would not be able to see the ring, and she wanted to delay the question. But Mother went downstairs. Martha denied putting the ring there, and Eliza and Cook denied it too. Mother returned to the bedroom. The mystery delighted her, and she was still very pleased with the ring.
        - id: ch02-b28
          speaker: narrator
          text: >-
            Then she opened a dressing-table drawer. It held a long case with a diamond necklace worth almost beyond price. That made her even more curious, but much less pleased. She went to the wardrobe to put away her bonnet and discovered a tiara and several brooches. Over the next half hour, pieces of jewellery kept turning up in different corners of the room. Each new case made the mystery more alarming. The children looked more uncomfortable with every discovery, until Jane began to sniff.
        - id: ch02-b29
          speaker: narrator
          text: Mother looked at her gravely.
        - id: ch02-b30
          speaker: mother
          text: Jane, I'm certain you know something. Think carefully before you answer me, and tell me the truth.
        - id: ch02-b31
          speaker: jane
          text: We found a Fairy.
        - id: ch02-b32
          speaker: mother
          text: I don't want any nonsense, please.
          emotion: angry
        - id: ch02-b33
          speaker: cyril
          text: >-
            Don't be silly, Jane. Listen, Mother. We've never seen any of these things before. But wicked burglars stole all Lady Chittenden's jewellery from Peasmarsh Place last night. Could this be what they took?
        - id: ch02-b34
          speaker: narrator
          text: >-
            Everyone took a deep breath. They were saved.
        - id: ch02-b35
          speaker: mother
          text: >-
            But how could the burglars have brought it here? Why would they? Surely it would have been easier and safer to escape with it.
        - id: ch02-b36
          speaker: cyril
          text: >-
            Perhaps they thought they should wait until sunset—I mean, until nightfall—before they carried it away. No one but us knew you were coming home today.
        - id: ch02-b37
          speaker: mother
          text: I must send for the police at once. Oh, I wish Daddy were here!
        - id: ch02-b38
          speaker: robert
          text: Wouldn't it be better to wait until he comes home?
        - id: ch02-b39
          speaker: narrator
          text: Robert knew Father would not arrive before sunset.
        - id: ch02-b40
          speaker: mother
          text: No, I can't wait another minute with this terrible worry.
        - id: ch02-b41
          speaker: narrator
          text: >-
            The terrible worry was the pile of jewel cases on the bed. They put every case into the wardrobe. Mother locked it and called Martha.
    - id: ch03
      title: Mother Goes for the Police
      blocks:
        - id: ch03-b01
          speaker: mother
          text: >-
            Martha, has any stranger gone into my room while I've been away? Tell me the truth now.
        - id: ch03-b02
          speaker: martha
          text: No, ma'am. Leastways, what I mean is—
        - id: ch03-b03
          speaker: narrator
          text: Martha stopped.
        - id: ch03-b04
          speaker: mother
          text: >-
            Come now. I can see somebody has been here, and you must tell me at once. Don't be afraid. I'm sure you haven't done anything wrong.
          emotion: calm
        - id: ch03-b05
          speaker: narrator
          text: Martha burst into great heavy sobs.
        - id: ch03-b06
          speaker: martha
          text: >-
            I meant to give notice today, ma'am, and leave at the end of my month. I'm going to make a respectable young man happy. He's a gamekeeper by trade, ma'am, and his name is Beale. I wouldn't deceive you. When you came home in such a hurry, with no warning, he offered to help out of the kindness of his heart. "Martha, my beauty," he says—and I'm not beautiful and never was, but you know how men carry on—"I can't watch you work yourself to death and not lend a helping hand. I've a strong arm, and it belongs to you, my dear," he says. So he helped me clean the windows. But he stayed outside the whole time, ma'am, and I stayed inside. That's the gospel truth if I never speak another word.
        - id: ch03-b07
          speaker: mother
          text: Were you with him all the time?
        - id: ch03-b08
          speaker: martha
          text: >-
            He was outside and I was in. Except when I fetched a clean pail and the leather that lazy Eliza had hidden behind the mangle.
        - id: ch03-b09
          speaker: mother
          text: >-
            That will do. I'm not pleased with you, Martha. Still, you told the truth, and that matters.
        - id: ch03-b10
          speaker: narrator
          text: When Martha left, the children crowded around Mother.
        - id: ch03-b11
          speaker: anthea
          text: >-
            Oh, Mummy darling, it wasn't Beale's fault. Truly it wasn't! He's a perfect dear, and he's honest as the day. Please don't let the police take him. Please, please don't!
          emotion: fearful
        - id: ch03-b12
          speaker: narrator
          text: >-
            It was truly dreadful. Jane's foolish wish had made an innocent man look guilty of robbery, and telling the truth was no use at all. Every child longed to tell it. Then they remembered the straws in their hair and the screams of the other raving lunatics, and they could not.
        - id: ch03-b13
          speaker: mother
          text: >-
            Is there a cart anywhere nearby? Any sort of trap? I must drive into Rochester and tell the police right now.
        - id: ch03-b14
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: >-
            There's a cart at the farm, but please don't go! Don't go! Wait until Daddy comes home!
          emotion: fearful
        - id: ch03-b15
          speaker: narrator
          text: >-
            Mother paid no attention. Once she made up her mind, she always went straight ahead. In that way, she was rather like Anthea.
        - id: ch03-b16
          speaker: mother
          text: >-
            Cyril, I'm leaving you in charge. Stay in the dressing room. You may pretend to sail boats in the bath, or something like that, and say I gave you permission. Keep the landing door open, but stay there. I've locked the other door. Don't let anyone enter my room. Remember, no one knows those jewels are there except me, all of you, and the wicked thieves who left them. Robert, you stay in the garden and watch the windows. If anyone tries to climb in, run and tell the two farm men I'll send to wait in the kitchen. I'll warn them that dangerous people are nearby, and that much is true. I trust both of you. I don't think the thieves will try anything before dark, so you'll be safe. Goodbye, darlings.
        - id: ch03-b17
          speaker: narrator
          text: >-
            Mother locked her bedroom door, slipped the key into her pocket, and went away to find the cart. The children could not help admiring how quickly and firmly she had planned everything. Lately, their badly timed wishes had landed them in one tight place after another. They thought how useful Mother would have been at arranging an escape from any of them.
        - id: ch03-b18
          speaker: cyril
          text: >-
            She's a born general, but I can't imagine what will happen to us. Suppose the girls find that beastly Sammyadd and make it take away the jewels. Mother will think we let the burglars sneak in and steal them back. Or the police will think we took them ourselves. Or they'll decide Mother was fooling them. This is a thoroughly ghastly mess, and no mistake.
        - id: ch03-b19
          speaker: narrator
          text: >-
            Cyril angrily folded a paper boat and began floating it in the bath, exactly as Mother had told him. Robert went into the garden. He sat on the worn yellow grass with his miserable head between his helpless hands.
        - id: ch03-b20
          speaker: narrator
          text: >-
            Anthea and Jane whispered in the downstairs passage, beside the coconut matting with the hole that always caught your foot if you forgot to be careful. From the kitchen came Martha's voice, grumbling loudly and without stopping.
        - id: ch03-b21
          speaker: anthea
          text: >-
            This is all too dreadfully awful. How do we know every diamond is here? If some are missing, the police will think Mother and Father kept them and only handed over part of the treasure as a desperate trick. They'll both be sent to prison, and everyone will call us the children of criminals. And it won't be nice for Mother and Father either.
        - id: ch03-b22
          speaker: jane
          text: But what can we do?
        - id: ch03-b23
          speaker: anthea
          text: >-
            Nothing. Unless we search for the Psammead again. It's a very, very hot day. Perhaps it has come out to warm that whisker.
        - id: ch03-b24
          speaker: jane
          text: >-
            It won't give us any more beastly wishes today. It gets crosser every time we visit. I think it hates granting wishes.
        - id: ch03-b25
          speaker: narrator
          text: >-
            Anthea had been shaking her head sadly. Now she stopped so suddenly that she looked as though she had pricked up her ears.
        - id: ch03-b26
          speaker: jane
          text: What is it? Oh, have you thought of something?
        - id: ch03-b27
          speaker: anthea
          text: Our one chance! Our last, lonely, forlorn hope. Come on!
        - id: ch03-b28
          speaker: narrator
          text: Anthea set off for the sandpit at a brisk trot, with Jane behind her.
    - id: ch04
      title: The Last Wishes
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            What joy! The Psammead was there. It lay in a golden hollow of sand, warming itself and happily arranging its whiskers in the glowing afternoon sunshine. As soon as it saw the girls, it spun around and started digging. It plainly preferred being alone. Anthea was too quick. She caught it gently but firmly by its furry shoulders and held on.
        - id: ch04-b02
          speaker: psammead
          text: Here, stop that! Let me go, will you?
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: Anthea did not release it.
        - id: ch04-b04
          speaker: anthea
          text: Dear, kind, darling Sammyadd—
        - id: ch04-b05
          speaker: psammead
          text: >-
            Oh yes, that's all very well. You want another wish, I suppose. I can't slave away from morning to night granting wishes for people. I need some time to myself.
        - id: ch04-b06
          speaker: anthea
          text: Do you hate giving wishes?
        - id: ch04-b07
          speaker: narrator
          text: Her voice shook with excitement.
        - id: ch04-b08
          speaker: psammead
          text: >-
            Of course I hate it. Let me go or I'll bite you. I truly will. I mean it. Well, if you choose to take the risk, that's your affair.
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: Anthea took the risk and kept her grip.
        - id: ch04-b10
          speaker: anthea
          text: >-
            Listen to me, and please don't bite. If you'll only do what we need today, we'll never ask you for another wish as long as we live.
        - id: ch04-b11
          speaker: narrator
          text: The promise moved the Psammead deeply.
        - id: ch04-b12
          speaker: psammead
          text: >-
            I'd do anything for that. I'd almost burst myself giving you wish after wish, for as long as I could manage it, if you'd never, never ask me again after today. You have no idea how I hate swelling myself up for other people's wishes. I'm always afraid I'll pull a muscle or something. Then every morning I wake up knowing I have to do it all over again. You don't know what it's like. You don't know. You don't!
          emotion: sad
        - id: ch04-b13
          speaker: narrator
          text: >-
            Its voice cracked with feeling, and the final word came out as a squeak. Anthea gently placed it back on the sand.
        - id: ch04-b14
          speaker: anthea
          text: >-
            It's all over now. We faithfully promise that after today, we'll never ask you for another wish.
          emotion: calm
        - id: ch04-b15
          speaker: psammead
          text: Well, get on with it. Let's have it over.
        - id: ch04-b16
          speaker: anthea
          text: How many wishes can you manage?
        - id: ch04-b17
          speaker: psammead
          text: I don't know. I'll keep going as long as I can hold out.
        - id: ch04-b18
          speaker: anthea
          text: First, I wish Lady Chittenden would find that she never lost her jewels.
        - id: ch04-b19
          speaker: narrator
          text: The Psammead swelled, then collapsed.
        - id: ch04-b20
          speaker: psammead
          text: Done.
        - id: ch04-b21
          speaker: anthea
          text: I wish Mother wouldn't reach the police.
        - id: ch04-b22
          speaker: narrator
          text: The Psammead went through the proper swelling and shrinking once more.
        - id: ch04-b23
          speaker: psammead
          text: Done.
        - id: ch04-b24
          speaker: jane
          text: I wish Mother could forget everything about the diamonds.
        - id: ch04-b25
          speaker: narrator
          text: Again the Psammead expanded and fell back, but now its voice was weaker.
        - id: ch04-b26
          speaker: psammead
          text: Done.
        - id: ch04-b27
          speaker: anthea
          text: Would you like to rest for a little while?
        - id: ch04-b28
          speaker: psammead
          text: >-
            Yes, please. And before we go on, will you make a wish for me?
        - id: ch04-b29
          speaker: anthea
          text: Can't you grant your own wishes?
        - id: ch04-b30
          speaker: psammead
          text: >-
            Of course not. We were always meant to give wishes to one another. Not that we had many wishes in the good old Megatherium days. Now please wish that none of you will ever be able to tell anyone a single word about me.
        - id: ch04-b31
          speaker: jane
          text: Why?
        - id: ch04-b32
          speaker: psammead
          text: >-
            Can't you see? If you told grown-ups, I'd never have another peaceful moment. They'd capture me. And they wouldn't ask for foolish things like you do. They'd wish for serious things. The scientists would probably discover a way to keep wishes from vanishing at sunset. Then people would demand a graduated income tax, old-age pensions, votes for men, free secondary education, and dreary things like that. They'd get them and keep them, and the whole world would turn upside down. Make the wish. Quickly!
        - id: ch04-b33
          speaker: narrator
          text: >-
            Anthea repeated the Psammead's wish. This time, it grew larger than they had ever seen it grow. At last it collapsed again.
        - id: ch04-b34
          speaker: psammead
          text: Now, is there anything else I can do for you?
        - id: ch04-b35
          speaker: anthea
          text: >-
            Just one thing. This should clear up everything, shouldn't it, Jane? I wish Martha would forget the diamond ring, and Mother would forget that the keeper cleaned the windows.
        - id: ch04-b36
          speaker: jane
          text: That's like what happened in The Brass Bottle.
        - id: ch04-b37
          speaker: anthea
          text: >-
            Yes. If we hadn't read it, I would never have thought of this.
        - id: ch04-b38
          speaker: psammead
          text: >-
            I'm nearly worn out now. Is there anything more?
        - id: ch04-b39
          speaker: anthea
          text: >-
            No. We only want to thank you kindly for all you've done. I hope you have a long, good sleep, and I hope we'll see you again someday.
        - id: ch04-b40
          speaker: psammead
          text: Is that a wish?
        - id: ch04-b41
          speakers: [anthea, jane]
          ensemble: duo
          text: Yes, please.
        - id: ch04-b42
          speaker: narrator
          text: >-
            For the last time in this story, the girls watched the Psammead swell itself for a wish and then suddenly collapse. It gave them a nod and blinked its long snail eyes. Then it turned downward and began to burrow. Its paws scratched fiercely until the final moment. The last bit of fur vanished, and the loose sand slid shut over it.
    - id: ch05
      title: Everything Comes Right
      blocks:
        - id: ch05-b01
          speaker: jane
          text: I hope we did the right thing.
        - id: ch05-b02
          speaker: anthea
          text: I'm sure we did. Come on. We must go home and tell the boys.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Anthea found Cyril brooding over his paper boats and told him what had happened. Jane told Robert. The two stories had only just ended when Mother walked in, hot and dusty.
        - id: ch05-b04
          speaker: narrator
          text: >-
            She explained that she had been riding toward Rochester to buy the girls' autumn school dresses when the cart's axle broke. If the lane had not been narrow, with high soft hedges, she would have been thrown out. She was unhurt, but she had been forced to walk all the way home.
        - id: ch05-b05
          speaker: mother
          text: >-
            Oh, my own dear chicks, I'm simply dying for a cup of tea! Please run and see whether the kettle is boiling.
        - id: ch05-b06
          speaker: jane
          text: You see? It's all right. She doesn't remember.
        - id: ch05-b07
          speaker: anthea
          text: Martha doesn't remember either. I asked her about the kettle.
        - id: ch05-b08
          speaker: narrator
          text: >-
            While the servants sat together at tea, Beale the gamekeeper dropped in. He brought exactly the news everyone needed. Lady Chittenden's diamonds had not been stolen at all. Lord Chittenden had taken them away to have the settings repaired and the stones cleaned. The maid who knew where they had gone was away on holiday, which explained the whole alarm. So that was all right.
        - id: ch05-b09
          speaker: narrator
          text: >-
            Later, the children walked in the garden while Mother put the Lamb to bed.
        - id: ch05-b10
          speaker: jane
          text: I wonder whether we'll ever see the Psammead again.
          emotion: sad
        - id: ch05-b11
          speaker: cyril
          text: I'm sure we will, if you truly wished it.
        - id: ch05-b12
          speaker: anthea
          text: But we've promised never to ask it for another wish.
        - id: ch05-b13
          speaker: robert
          text: I never want to ask for one again.
        - id: ch05-b14
          speaker: narrator
          text: >-
            Of course they did see the Psammead again, but not in this story. It was not in a sandpit either. It was in a very, very, very different place. It was in a— But I must not say any more.
