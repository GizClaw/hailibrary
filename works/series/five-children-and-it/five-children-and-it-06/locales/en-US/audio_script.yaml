  chapters:
    - id: ch01
      title: Kept Indoors
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The other children had to stay indoors as punishment for the troubles of the day before. Martha thought those troubles came from naughtiness, not bad luck, so you must not blame her. She believed she was doing her duty. Grown-ups often say they dislike punishing children, that it is for the children's own good, and that it hurts them just as much. Quite often, they are telling the truth.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Martha certainly hated the punishment as much as the children did. For one thing, she knew exactly how noisy the house would be with all of them shut inside for the whole day. And that was not her only reason for wishing they could go out.
        - id: ch01-b03
          speaker: martha
          text: >-
            I declare, it seems a shame to keep them in on such a lovely day. But they're so bold, they'll come home with their heads knocked off one day if I don't put my foot down. Make them a cake for tomorrow's tea, dear. Once we're ahead with the work, we'll take Baby with us so they can have a good romp without him. Come along, Eliza, get on with those beds. It's nearly ten, and no rabbits caught!
        - id: ch01-b04
          speaker: narrator
          text: >-
            In Kent, people say "no rabbits caught" when they mean no work has been done. So everyone except Robert stayed inside. He was allowed half an hour outdoors to fetch the one thing they all wanted: the day's wish.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Robert found the Sand-fairy easily. The day was so hot that, for the first time, it had come out by itself. It sat in a pool of soft sand, stretching, tidying its whiskers, and rolling its snail eyes around.
        - id: ch01-b06
          speaker: psammead
          text: >-
            Ha! I've been watching for you. Where are the others? Those wings didn't smash them to pieces, I hope.
        - id: ch01-b07
          speaker: robert
          text: >-
            No, but the wings got us into trouble, just as every wish does. The others are being kept indoors. I only have half an hour to get the wish, so please let me make it quickly.
        - id: ch01-b08
          speaker: psammead
          text: Go on, then. Wish.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The Psammead twisted around in the sand, but Robert could not think of a wish. Every idea he had prepared vanished. Only small things for himself came to mind: toffee, a foreign stamp album, or a three-bladed clasp knife with a corkscrew. He sat down and tried harder. It did no good. He thought of a football, a pair of leg guards, or the chance to give young Simpkins a thorough licking when school began again. The others would not care about any of those.
        - id: ch01-b10
          speaker: psammead
          text: You had better make that wish soon. Time is flying.
        - id: ch01-b11
          speaker: robert
          text: >-
            I know. I can't think of anything. I wish you could grant one of the others a wish without making them come here to ask for it. Oh, don't!
          emotion: surprised
        - id: ch01-b12
          speaker: narrator
          text: >-
            Too late. The Psammead swelled to three times its usual size. Then it collapsed like a punctured bubble and fell back against the sandy edge of its pool. The effort had left it faint.
        - id: ch01-b13
          speaker: psammead
          text: >-
            There. That was one of the hardest things I've ever done, but it is done. Run home before they wish for something foolish.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Robert was certain they would. As he ran, his mind filled with all the wishes they might make without him. They might ask for rabbits, white mice, or chocolate. They might waste the magic on fine weather tomorrow. Most likely of all, one of them would say, "I do wish Robert would hurry up." Well, he was hurrying. That careless sentence would come true, and their one wish for the day would be gone.
        - id: ch01-b15
          speaker: narrator
          text: >-
            He tried to decide what they ought to wish for instead. It had to be something entertaining indoors, and that had been his difficulty from the beginning. When the sun is shining outside and you long to be out in it, almost nothing inside seems amusing. Robert kept running at full speed. Then he rounded the corner that should have brought the house into sight, with the ornamental ironwork on its roof that Father called an architect's nightmare. Robert opened his eyes so wide that he had to slow to a walk. You cannot run properly with your eyes stretched wide open.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The house had disappeared. So had the front garden railings. Robert stopped dead, rubbed his eyes, and looked again. The others had certainly made a wish. There could be no doubt about it. They must have wished to live in a castle. A black, stately castle rose where the house had stood. It was immensely tall and broad, with battlements, narrow pointed windows, and eight huge towers. White shapes dotted the places where the garden and orchard had been, looking from a distance like mushrooms. As Robert walked slowly closer, he saw that they were tents. Men in armor moved among them, not one or two, but crowds and crowds.
        - id: ch01-b17
          speaker: robert
          text: >-
            Oh, crikey! They wished for a castle, and now it's under siege. That's just like that Sand-fairy. I wish we'd never found the beastly thing!
          emotion: surprised
    - id: ch02
      title: The Besieging Army
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Above the great gateway was a small window. Beyond it lay a moat, right where the garden had been half an hour earlier. Someone at the window waved a pale, dusty object. Robert thought it was one of Cyril's handkerchiefs. None of them had been white since the day Cyril upset a whole bottle of Combined Toning and Fixing Solution into the drawer where they were kept.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Robert waved back and knew at once that it was a mistake. The besieging army had seen his signal. Two men in steel caps came striding toward him. High brown boots covered their long legs, and every step brought them alarmingly closer. Robert remembered the shortness of his own legs and decided not to run. Escape would be useless, and an attempt might only irritate the enemy. So he stood quite still, and the two men seemed pleased with him for it.
        - id: ch02-b03
          speaker: jakin
          text: By my halidom, this is a brave young rascal!
        - id: ch02-b04
          speaker: narrator
          text: >-
            Being called brave pleased Robert, and somehow it made him feel brave too. He chose to ignore the rascal part. That was simply how people spoke in historical adventures for young readers, so it was clearly not meant as an insult. His only worry was whether he could understand the rest. Even on the printed page, he had not always been able to follow every conversation in those books.
        - id: ch02-b05
          speaker: soldier
          text: His clothing is strange. Some foreign treachery, perhaps.
        - id: ch02-b06
          speaker: jakin
          text: Tell us, boy. Why have you come here?
        - id: ch02-b07
          speaker: narrator
          text: >-
            Robert understood that this meant, "What are you doing here?"
        - id: ch02-b08
          speaker: robert
          text: If you please, I want to go home.
        - id: ch02-b09
          speaker: jakin
          text: >-
            Then go. No one stops you, and nothing stops us from following. Zooks! I suspect he carries news to those inside.
        - id: ch02-b10
          speaker: soldier
          text: Where do you live, young knave?
        - id: ch02-b11
          speaker: robert
          text: Over there.
        - id: ch02-b12
          speaker: narrator
          text: >-
            The instant he said it, Robert knew he should have said "yonder."
        - id: ch02-b13
          speaker: jakin
          text: Is that so? Come here, boy. Our leader must hear of this.
        - id: ch02-b14
          speaker: narrator
          text: >-
            They took Robert to their leader immediately. Robert went forward because one of the men dragged him by an ear that was very unwilling to go.
        - id: ch02-b15
          speaker: narrator
          text: >-
            The leader was the most glorious person Robert had ever seen. He looked exactly like the pictures Robert admired in historical adventures. He had everything a leader could need: armor, a helmet, a horse, a crest, feathers, a shield, a lance, and a sword. Almost every piece belonged to a different age. The shield came from the thirteenth century, while the sword was the kind used in the Peninsular War. His breastplate belonged to the time of Charles the First, and his helmet dated from the Second Crusade. Three grand red lions ran across the blue field of his shield. The tents, meanwhile, were of the latest kind.
        - id: ch02-b16
          speaker: narrator
          text: >-
            This mixture might have shocked someone who knew about old weapons and coats of arms. Robert knew no more than the talented artists who drew his adventure books, so the whole scene looked perfectly correct. It was exactly like a picture. His admiration made him braver still.
        - id: ch02-b17
          speaker: wulfric
          text: Come closer, lad.
        - id: ch02-b18
          speaker: narrator
          text: >-
            The glorious leader removed his helmet, for he could not see Robert properly while he wore it. Underneath was a kind face framed by long fair hair.
        - id: ch02-b19
          speaker: wulfric
          text: >-
            Do not be afraid. You shall come to no harm. Tell your story freely. Where have you come from, and what is your purpose?
        - id: ch02-b20
          speaker: narrator
          text: >-
            Robert was glad to hear that. Sir Wulfric had first called harm "scathe," and Robert wondered what scathe might be. He hoped it was not worse than the senna tea he sometimes had to take.
        - id: ch02-b21
          speaker: robert
          text: My purpose? What do you mean?
        - id: ch02-b22
          speaker: wulfric
          text: >-
            What are you trying to accomplish? What errand brings you here alone among these rough soldiers? Your mother's heart must be aching for you even now, poor child. I would swear it is so.
        - id: ch02-b23
          speaker: robert
          text: I don't think it is. She doesn't know I'm out.
        - id: ch02-b24
          speaker: narrator
          text: >-
            The leader wiped away a manly tear, exactly as a noble leader in a historical adventure would have done. Robert was rather impressed.
        - id: ch02-b25
          speaker: wulfric
          text: >-
            Speak the truth without fear, my child. You have nothing to fear from Wulfric de Talbot.
        - id: ch02-b26
          speaker: narrator
          text: >-
            Robert suddenly felt that this splendid leader, who was part of a wish himself, might understand the truth about the wishes and the Psammead. Surely he would understand better than Martha, the gypsies, the Rochester policeman, or yesterday's clergyman. There was only one difficulty. Robert could never remember enough old-fashioned expressions, such as "quotha" and "beshrew me," to sound like a boy from a historical adventure. Still, he began boldly with a sentence straight from Ralph de Courcy, or, The Boy Crusader.
        - id: ch02-b27
          speaker: robert
          text: >-
            Grammercy for your courtesy, fair sir knight. The fact is, it's like this. I hope you're not in a hurry, because it's a long story. Father and Mother are away. We were playing in the sandpit when we found a Psammead.
        - id: ch02-b28
          speaker: wulfric
          text: I beg your pardon. A Sammy-add?
        - id: ch02-b29
          speaker: robert
          text: >-
            Yes. It's a sort of fairy, or an enchanter. That's it, an enchanter. It promised us one wish every day. First we wished to be beautiful.
        - id: ch02-b30
          speaker: soldier
          text: That wish was hardly granted.
        - id: ch02-b31
          speaker: narrator
          text: >-
            The soldier looked straight at Robert. Robert thought the remark extremely rude, but he pretended not to hear.
        - id: ch02-b32
          speaker: robert
          text: >-
            Then we wished for treasure, but we couldn't spend it. Yesterday we wished for wings. We got them, and everything was ripping at first.
        - id: ch02-b33
          speaker: wulfric
          text: Your speech is strange and rough. Say that again. What did you have?
        - id: ch02-b34
          speaker: robert
          text: >-
            A ripping time. I mean a jolly time. No, I mean we were contented with our lot. That's what I'm trying to say. Afterward, though, we got into an awful fix.
        - id: ch02-b35
          speaker: wulfric
          text: What is a fix? A battle, perhaps?
        - id: ch02-b36
          speaker: robert
          text: No, not a battle. A tight place.
        - id: ch02-b37
          speaker: wulfric
          text: A dungeon, then? Alas for your young, imprisoned limbs!
        - id: ch02-b38
          speaker: robert
          text: >-
            It wasn't a dungeon. We simply encountered undeserved misfortunes. Today we're being punished by not being allowed outdoors. That's where I live.
        - id: ch02-b39
          speaker: narrator
          text: Robert pointed toward the castle.
        - id: ch02-b40
          speaker: robert
          text: >-
            The others are inside, and they're not allowed out. It's all the Psammead's fault. I mean the enchanter's fault. I wish we'd never found him.
        - id: ch02-b41
          speaker: wulfric
          text: Is this enchanter powerful?
        - id: ch02-b42
          speaker: robert
          text: Oh yes. Powerful in might and main. Rather!
        - id: ch02-b43
          speaker: wulfric
          text: >-
            Then you believe the spells of this angry enchanter have strengthened the army around the castle. Know this, boy. Wulfric de Talbot needs no enchanter's help to lead his followers to victory.
        - id: ch02-b44
          speaker: robert
          text: >-
            No, of course you don't. I'm sure you don't. Still, this is partly his fault, though it's mostly ours. You couldn't have done anything if we hadn't started it.
        - id: ch02-b45
          speaker: wulfric
          text: >-
            What do you mean, bold boy? Your words are mysterious and hardly polite. Explain this riddle!
        - id: ch02-b46
          speaker: robert
          text: >-
            You don't know it, of course, but you aren't real at all. You're only here because the others were idiotic enough to wish for a castle. When the sun sets, you'll simply vanish, and everything will be all right again.
        - id: ch02-b47
          speaker: narrator
          text: >-
            The captain and his soldiers exchanged glances. At first they looked sorry for Robert. Then their faces grew stern.
        - id: ch02-b48
          speaker: jakin
          text: >-
            Take care, noble lord. The boy is only pretending to be mad so he can escape us. Should we bind him?
        - id: ch02-b49
          speaker: robert
          text: >-
            I'm no madder than you are. Perhaps I'm not as mad. I was an idiot to think you'd understand. Let me go. I haven't harmed you.
          emotion: angry
        - id: ch02-b50
          speaker: wulfric
          text: Where would you go?
        - id: ch02-b51
          speaker: robert
          text: Home, of course.
        - id: ch02-b52
          speaker: narrator
          text: Robert pointed again at the castle.
        - id: ch02-b53
          speaker: wulfric
          text: To carry news that help is coming? No!
        - id: ch02-b54
          speaker: robert
          text: All right. Then let me go somewhere else.
        - id: ch02-b55
          speaker: narrator
          text: >-
            An idea came to him, and he searched his memory for the right words from a historical adventure.
        - id: ch02-b56
          speaker: robert
          text: >-
            Sir Wulfric de Talbot should think it shameful to keep a chap—I mean, to hold someone who has done him no harm—when that person wishes to depart peacefully and without violence.
        - id: ch02-b57
          speaker: wulfric
          text: >-
            You dare say that to my face? Beshrew you for a knave! Yet your words are true. Go wherever you wish. You are free. Wulfric de Talbot does not wage war against babies, and Jakin shall accompany you.
        - id: ch02-b58
          speaker: robert
          text: >-
            All right. I think Jakin will enjoy himself. Come on, Jakin. Sir Wulfric, I salute you.
        - id: ch02-b59
          speaker: narrator
          text: >-
            Robert gave a modern military salute and ran toward the sandpit. Jakin's long boots easily kept pace. Robert found the Fairy, dug it out, woke it, and begged for one more wish.
        - id: ch02-b60
          speaker: psammead
          text: >-
            I've already done two wishes today, and one was about the hardest piece of work I've ever managed.
        - id: ch02-b61
          speaker: robert
          text: Oh, please, please, please, please, please!
        - id: ch02-b62
          speaker: narrator
          text: >-
            Jakin stared in open-mouthed horror at the strange talking creature and its snail eyes.
        - id: ch02-b63
          speaker: psammead
          text: Well, what is it?
          emotion: angry
        - id: ch02-b64
          speaker: robert
          text: I wish I were with the others.
        - id: ch02-b65
          speaker: narrator
          text: >-
            The Psammead began to swell. Robert never once thought of asking it to remove the castle and the siege. Of course he knew they had both come from a wish. But the swords, daggers, pikes, and lances looked much too solid and dangerous to be wished away by a few words. For one instant, Robert lost consciousness. When he opened his eyes again, the other children were crowding around him inside the castle.
    - id: ch03
      title: Inside the Castle
      blocks:
        - id: ch03-b01
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: >-
            We didn't hear you come in! It was splendid of you to let us have the wish. Of course we knew that's what you'd done. But you should have warned us. We might have wished for something silly.
        - id: ch03-b02
          speaker: robert
          text: >-
            Silly? How could you possibly have been sillier? You nearly finished me off, I can tell you.
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: >-
            Robert told them the whole story. The others admitted that what happened had been very hard on him. Then they praised his courage and cleverness so warmly that his lost temper soon came back. He felt braver than ever and agreed to become captain of the defenders.
        - id: ch03-b04
          speaker: anthea
          text: >-
            We haven't started anything. We waited for you. We'll shoot through these little loopholes with the bow and arrows Uncle gave you, and you can take the first shot.
        - id: ch03-b05
          speaker: robert
          text: >-
            I don't think we should. You haven't seen them close up. They have real bows and arrows, and they're terribly long. They have swords, pikes, daggers, and every sort of sharp weapon. Those men aren't a picture or a vision. They can hurt us, or even kill us. My ear is still sore. Have you explored the castle? We should leave the soldiers alone while they leave us alone. I heard Jakin say they won't attack until just before sunset, so we can prepare. Are there any soldiers here to defend the place?
        - id: ch03-b06
          speaker: cyril
          text: >-
            We don't know. The moment I wished that we were inside a besieged castle, everything seemed to turn upside down. When it came straight again, we looked through the window. We saw the camp and all the rest of it, and then we saw you. Naturally, we went on watching everything. Isn't this room splendid? It feels as real as real can be.
        - id: ch03-b07
          speaker: narrator
          text: >-
            It did. The room was square, with stone walls four feet thick and great wooden beams across the ceiling. In one corner, a low door opened onto a flight of stairs that wound both upward and downward. The children followed the stairs down and found themselves in a huge, arched gatehouse. Its enormous outer doors were tightly shut and barred.
        - id: ch03-b08
          speaker: narrator
          text: >-
            At the foot of the round stair tower was a small room. Its window was a little larger than the other narrow openings. Through it, they saw that the drawbridge was raised and the portcullis was down. The moat beyond looked terribly wide and deep. Across from the great outer doors stood another enormous door with a smaller one cut into it. The children passed through that little door and entered a broad paved courtyard. The castle's great gray walls rose dark and heavy around them on all four sides.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Near the center stood Martha, moving her right hand backward and forward through empty air. The cook was bending down nearby, moving both hands in another very curious way. Yet the oddest and most frightening sight was the Lamb. He sat on nothing at all, about three feet above the paving stones, laughing as happily as ever.
        - id: ch03-b10
          speaker: narrator
          text: >-
            The children ran to him. Just as Anthea reached out to lift him down, Martha spoke sharply.
        - id: ch03-b11
          speaker: martha
          text: Leave him alone, miss, when he's being good.
        - id: ch03-b12
          speaker: anthea
          text: But what is he doing?
        - id: ch03-b13
          speaker: martha
          text: >-
            Doing? Why, he's sitting in his high chair like a little treasure, watching me iron. Off you go. You've made my iron cold again.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Martha walked toward the cook. She bent down and seemed to poke an invisible fire with a poker no one could see. Beside her, the cook appeared to be placing an unseen dish inside an oven that was invisible too.
        - id: ch03-b15
          speaker: martha
          text: >-
            Run along now. I'm behind already. There'll be no dinner if you keep getting in my way. Off you go, or I'll pin a dishcloth to every one of your tails.
        - id: ch03-b16
          speaker: jane
          text: Are you sure the Lamb is all right?
        - id: ch03-b17
          speaker: martha
          text: >-
            Right as ninepence, if you don't upset him. I thought you'd be glad to have him out of your way today. But take him if you want him, for goodness' sake.
        - id: ch03-b18
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: No, no!
        - id: ch03-b19
          speaker: narrator
          text: >-
            They hurried away. Soon they would have to defend the castle, and the Lamb was safer where he was. Even sitting three feet in the air in an invisible kitchen was better than being carried into the guardroom of a besieged castle. The children went through the first doorway they found and sank helplessly onto a wooden bench that ran along the inside wall.
        - id: ch03-b20
          speakers: [anthea, jane]
          ensemble: duo
          text: How awful!
          emotion: fearful
        - id: ch03-b21
          speaker: jane
          text: I feel as if we're in a madhouse.
          emotion: fearful
        - id: ch03-b22
          speaker: anthea
          text: >-
            What does it all mean? It's creepy, and I don't like it. I wish we'd chosen something simple, like a rocking horse or a donkey.
          emotion: fearful
        - id: ch03-b23
          speaker: robert
          text: It's too late to wish now.
          emotion: angry
        - id: ch03-b24
          speaker: cyril
          text: Be quiet for a moment. I need to think.
        - id: ch03-b25
          speaker: narrator
          text: >-
            Cyril buried his face in his hands while the others looked around. The room was long, dim, and dark, with an arched roof overhead. Wooden tables stood along its length. Another table crossed the far end on a sort of raised platform. Dry things like little sticks littered the floor, and whatever they were, they did not smell pleasant.
        - id: ch03-b26
          speaker: narrator
          text: Suddenly, Cyril sat upright.
        - id: ch03-b27
          speaker: cyril
          text: >-
            Listen, I think I understand, and it's all right. Remember, we wished that the servants wouldn't notice any difference when our wishes came true. And nothing ever happens to the Lamb unless we specifically wish for it. Of course Martha and Cook don't notice the castle. But the castle stands exactly where our house stood. I mean where it still stands. The servants must go on being inside the house, or they would notice something. You can't mix a house and a castle together. We see the castle, so we can't see the house. They keep seeing the house, so they can't see the castle. And that means—
        - id: ch03-b28
          speaker: jane
          text: >-
            Oh, stop! You're making my head spin like I'm on a roundabout. It doesn't matter. I only hope we can see our dinner. If it's invisible, we won't be able to feel it either, and then we can't eat it. I tried to feel the Lamb's chair, and there was nothing under him but air. We can't eat air. I feel as if I haven't had breakfast for years and years.
        - id: ch03-b29
          speaker: anthea
          text: There's no use worrying about it. Let's explore some more. We may find something to eat.
    - id: ch04
      title: No Dinner
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            That thought lit hope in every heart, and they searched the castle from end to end. It was the most perfect and delightful castle anyone could imagine. Every room was completely and beautifully furnished. Yet nowhere in all that splendor could they find a scrap of food or a single soldier to defend the walls.
        - id: ch04-b02
          speaker: jane
          text: >-
            If only you'd remembered to wish for a besieged castle with a full garrison and plenty of provisions!
        - id: ch04-b03
          speaker: anthea
          text: You can't remember everything. It must be nearly dinnertime by now.
        - id: ch04-b04
          speaker: narrator
          text: >-
            It was not nearly dinnertime. Still, they stayed near the servants in the courtyard and watched all their strange movements. The children had no way to tell where the dining room of the invisible house might be. At last they saw Martha cross the courtyard, holding her hands as if she carried a tray. By the greatest piece of luck, the house's dining room stood in the very same place as the castle's banqueting hall. Then the children understood that the tray was invisible too, and their hearts sank.
        - id: ch04-b05
          speaker: narrator
          text: >-
            They waited in miserable silence while Martha went through every motion of serving their meal. She carved an unseen leg of mutton. With a spoon that no one could see, she put invisible greens and potatoes onto plates that had vanished with the rest. When she finally left the banqueting hall, the children stared at the bare table. Then they looked at one another.
        - id: ch04-b06
          speaker: robert
          text: This is worse than anything.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Until that moment, Robert had never cared very much about his dinner.
        - id: ch04-b08
          speaker: anthea
          text: I'm not really so hungry.
        - id: ch04-b09
          speaker: narrator
          text: >-
            As usual, Anthea was trying to make the best of things. Cyril said nothing. He only made a great show of pulling his belt tighter around his empty stomach. Jane could bear it no longer and burst into tears.
