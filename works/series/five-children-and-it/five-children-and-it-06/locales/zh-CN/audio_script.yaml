      display_name: 沃尔弗里克爵士
      tts:
        delivery: 威严仁厚，带着传奇英雄的庄重腔调
        timbre: 洪亮温厚
        pace: 中慢速
        pitch: 低音
  chapters:
    - id: ch01
      title: 一座城堡，却没有晚饭
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 头一天的历险明明是一连串不幸，玛莎却把它当成淘气，几个孩子因此得关在屋里受罚。你也别怪她，她只觉得自己在尽本分。大人常说，他们不喜欢惩罚孩子，惩罚只是为了孩子好，孩子难受，他们也一样难受。这话其实常常是真的。玛莎不愿罚他们，的确不亚于孩子们不愿受罚。单说一件吧，她知道这几个孩子会把屋子闹上一整天。此外，她还有别的缘故。
        - id: ch01-b02
          speaker: martha
          text: 说真的，这么好的天，把他们关在屋里简直有点儿可惜。可他们胆子太大，我再不狠下心管一管，保不准哪天回来时连脑袋都撞没了。亲爱的，明天做个蛋糕给他们当茶点吧。等咱们把活儿赶出一点儿，就把小弟弟带在身边，好让他们痛痛快快玩一阵，又不用照看他。伊莱莎，快来铺床。眼看十点了，兔子还一只没逮着呢！
        - id: ch01-b03
          speaker: narrator
          text: 肯特郡的人说“兔子还一只没逮着”，其实是说一点儿活也没干。其他孩子都被留在家里，只有罗伯特获准出去半个钟头，替大家取回一样人人都想要的东西，那当然是当天的愿望。他没费力就找到了沙仙。天气热得厉害，它破天荒头一回自己钻出沙子，坐在一汪似的细沙里伸展身子，修理胡须，一双蜗牛眼转来转去。
        - id: ch01-b04
          speaker: psammead
          text: 哈，我正等你呢。其他人去哪儿了？他们没被翅膀摔坏吧？
        - id: ch01-b05
          speaker: robert
          text: 没有，可翅膀又给我们惹了麻烦，跟每次许愿一样。其他人都被关在屋里，只有我获准出来半个钟头，就是来取愿望的。所以，请让我赶紧许吧。
        - id: ch01-b06
          speaker: psammead
          text: 那就许呀。
        - id: ch01-b07
          speaker: narrator
          text: 可罗伯特偏偏许不出来。刚才盘算过的东西全忘了，脑子里只剩几样自己想要的小玩意儿。比如太妃糖、一本外国邮票簿，还有一把带三片刀刃和开塞钻的折刀。他坐下来，想让自己考虑得更认真些，仍旧毫无用处。他只能想到别人不稀罕的东西，比如足球、一副护胫，或者等回学校以后，能把低年级的辛普金斯狠狠揍一顿。
        - id: ch01-b08
          speaker: psammead
          text: 你的愿望最好快点儿，时间可不等人。
        - id: ch01-b09
          speaker: robert
          text: 我知道时间不等人，可我怎么也想不出该许什么。我要是能让你把愿望交给其他人，让他们不用亲自跑到这里来许就好了。啊，不要，别实现这个——
        - id: ch01-b10
          speaker: narrator
          text: 可是已经晚了。沙仙把身子吹到平常的三倍大，接着又像一只被戳破的气泡，忽然瘪了下去。它深深叹了口气，向后靠在沙窝边缘。这一番努力把它累得几乎昏了过去。
        - id: ch01-b11
          speaker: psammead
          text: 好了！这回可真费劲，不过我还是办到了。赶快回家去，不然你到家以前，他们准会许个傻里傻气的愿望。
        - id: ch01-b12
          speaker: narrator
          text: 罗伯特也觉得他们准会。他飞奔回家，一路猜着那几个人会要兔子、白老鼠、巧克力，还是明天的好天气。最可能的是，有人随口说一句，真希望罗伯特快回来。可他明明已经在赶路。那句话要是成了愿望，一整天就全浪费了。他又替大家想，屋里究竟有什么好玩的？这正是他一开始就答不上来的问题。外面阳光灿烂，你偏偏不能出门，不管多想出去都不行，这时候，屋里好玩的事实在少得可怜。
        - id: ch01-b13
          speaker: narrator
          text: 罗伯特跑得飞快。转过街角以后，他本该看见屋顶上那堆堪称建筑师噩梦的花式铁饰，却忽然把眼睛瞪得太大，只好放慢脚步。人可没法一边瞪圆眼睛，一边继续飞奔。接着，他猛然站住了。房子不见了，前院的栏杆也没了。他揉揉眼睛，又仔细看了一遍。没错，其他人已经许过愿，而且准是希望住进城堡。原处果真立着一座黑沉沉、庄严巍峨的城堡，又高又宽，有雉堞、尖顶窗和八座巨塔。花园和果园里散着蘑菇似的白东西。罗伯特走近才看清，那些全是帐篷，无数披甲士兵正在帐篷间走动。
        - id: ch01-b14
          speaker: robert
          text: 哎呀呀，他们果然许了！要来一座城堡，城堡还正被人围攻！这可太像那只沙仙会干的事了。真希望我们从来没遇见过那讨厌的东西！
        - id: ch01-b15
          speaker: narrator
          text: 半个钟头前还是花园的地方，现在已经成了护城河。河对面那座宏伟城门的上方，有人从小窗里挥着一块灰扑扑的浅色东西。罗伯特猜那是西里尔的手帕。自从西里尔把一瓶调色定影混合液打翻进抽屉，那些手帕就再也没有白过。罗伯特也挥手回应，马上后悔了。围城的士兵看见了信号，两个戴钢盔的人正朝他走来。他们的长腿套着棕色高靴，步子迈得那么大，罗伯特想起自己的腿有多短，便打消了逃跑的念头。他知道跑也没用，还怕这会激怒敌人，只好站着不动。两个兵士看他这样，倒像很满意。
        - id: ch01-b16
          speaker: soldier_1
          text: 凭圣物起誓，好个勇敢的小厮！
        - id: ch01-b17
          speaker: narrator
          text: 别人说自己勇敢，罗伯特听着很高兴。说来也怪，这个称呼还真叫他勇敢了一点儿。至于“小厮”二字，他决定不去计较。儿童历史传奇里的人本来就这样说话，显然不是有意无礼。他只希望自己能听懂对方。那些书里的对白，他向来不能每一句都看明白。
        - id: ch01-b18
          speaker: soldier_2
          text: 此子衣着古怪，想必包藏异邦奸计。
        - id: ch01-b19
          speaker: soldier_1
          text: 小子，你来这里作甚？
        - id: ch01-b20
          speaker: narrator
          text: 罗伯特听懂了。那句古怪的话不过是在问，小家伙跑来干什么。他觉得自己总算能应付，便老老实实回答。
        - id: ch01-b21
          speaker: robert
          text: 劳驾，我想回家。
        - id: ch01-b22
          speaker: soldier_1
          text: 那便去吧！无人阻你，也无物拦我们跟随。咄，我看他是要给城里送信。
        - id: ch01-b23
          speaker: soldier_2
          text: 小无赖，你家住何处？
        - id: ch01-b24
          speaker: robert
          text: 就在那边。
        - id: ch01-b25
          speaker: narrator
          text: 话一出口，他就知道自己答得不够像历史传奇里的人，刚才应该说“在彼处”才对。
        - id: ch01-b26
          speaker: soldier_1
          text: 原来如此。过来，小子，此事须交首领裁断。
        - id: ch01-b27
          speaker: narrator
          text: 他们立刻揪着罗伯特的耳朵，把他拖去见首领。那只耳朵当然很不情愿。首领是罗伯特见过最威风的人，活像他常在历史传奇插图里赞叹的英雄。他有铠甲、头盔、战马、盔饰和羽毛，还有盾牌、长矛和宝剑。不过，我敢说，他身上的甲胄和兵器全出自不同年代。盾牌属于十三世纪，宝剑是半岛战争时期的式样，胸甲来自查理一世时代，头盔则要追溯到第二次十字军东征。盾上的纹章十分华丽，是蓝色底面上三头奔跑的红狮，帐篷却偏偏是最新式的。
        - id: ch01-b28
          speaker: narrator
          text: 整座营地、军队和首领凑在一起，懂纹章和考古的人也许会大吃一惊。罗伯特却赞叹得说不出话。他对这些学问一无所知，恰好跟那些专给历史传奇画图的天才画家一样，所以眼前的一切在他看来都再正确不过。这一幕简直跟画上一模一样。他越看越佩服，也越发觉得自己勇敢。
        - id: ch01-b29
          speaker: narrator
          text: 那两个戴着克伦威尔时代钢盔的人凑到近前，低声而急切地禀报了几句。首领随即叫罗伯特上前。他摘下头盔，因为戴着它根本看不清楚。头盔下面是一张和善的脸，还有一头长长的金发。
        - id: ch01-b30
          speaker: wulfric
          text: 不必害怕，我不会叫你受半点伤害。
        - id: ch01-b31
          speaker: narrator
          text: 罗伯特听了很高兴。他其实不知道首领所说的“伤害”用了哪个古怪词，更不知道那东西究竟是什么，只暗想它会不会比自己有时不得不喝的番泻叶茶更难受。
        - id: ch01-b32
          speaker: wulfric
          text: 莫要惊慌，把你的来历说清楚。你从何处来，意欲何为？
        - id: ch01-b33
          speaker: robert
          text: 我的什么？
        - id: ch01-b34
          speaker: wulfric
          text: 你想办成什么事？为何独自在粗野兵士中游荡？可怜的孩子，我敢断言，你母亲此刻正为你心痛。
        - id: ch01-b35
          speaker: robert
          text: 我想不会，她根本不知道我出来了。
        - id: ch01-b36
          speaker: narrator
          text: 首领听完，像每一位称职的历史传奇首领那样，抬手拭去一滴男子汉的眼泪，然后郑重地安慰罗伯特。
        - id: ch01-b37
          speaker: wulfric
          text: 孩子，只管说实话。在沃尔弗里克·德·塔尔博特面前，你什么都不用怕。
        - id: ch01-b38
          speaker: narrator
          text: 罗伯特忽然冒出一个大胆的念头。这位光辉夺目的围城首领，本身也是愿望造出来的，也许比玛莎、吉卜赛人、罗切斯特的警察，还有昨天那位牧师更能听懂愿望和沙仙的真相。难处只有一个。罗伯特怎么也记不起足够多的“汝言”和“吾诅咒汝”之类的词，没法让自己说起话来像历史传奇里的少年。尽管如此，他开口时还很有胆气，第一句话直接取自《拉尔夫·德·库尔西，又名十字军少年》。
        - id: ch01-b39
          speaker: robert
          text: 多谢您的盛情，美貌的骑士大人。事情是这样的。我希望您不赶时间，因为这个故事讲起来很长。爸爸妈妈不在家，那天我们到砾石坑里玩，结果发现了一只普萨米德。
        - id: ch01-b40
          speaker: wulfric
          text: 请恕我孤陋寡闻，一只普萨米德？
        - id: ch01-b41
          speaker: robert
          text: 对，就是一种仙子，或者魔法师。它说每天能给我们一个愿望，我们头一次许愿变漂亮。
        - id: ch01-b42
          speaker: soldier_1
          text: 看来并没有如愿。
        - id: ch01-b43
          speaker: narrator
          text: 那兵士盯着罗伯特，低声嘀咕了一句。罗伯特把话听得清清楚楚，觉得实在无礼，却装作什么也没听见，接着往下讲。
        - id: ch01-b44
          speaker: robert
          text: 后来我们要了钱，就是财宝，可花不出去。昨天我们又要了翅膀，也真的长了出来。一开始玩得痛快极了——
        - id: ch01-b45
          speaker: wulfric
          text: 你的言语古怪难懂。再说一遍，你们如何了？
        - id: ch01-b46
          speaker: robert
          text: 痛快……我是说快活……也不对。我们对处境很满意。可后来陷进了一个糟透的困境。
        - id: ch01-b47
          speaker: wulfric
          text: 困境为何物？莫非是一场争斗？
        - id: ch01-b48
          speaker: robert
          text: 不是争斗，是……是走投无路。
        - id: ch01-b49
          speaker: wulfric
          text: 一座地牢？你年纪轻轻，双腿竟遭镣铐束缚，实在可叹！
        - id: ch01-b50
          speaker: robert
          text: 不是地牢。我们只是遭逢了无端的不幸，今天才受罚，不能出门。我家就在那座城堡里，其他人也被关在里面。这全怪普萨米德，我是说那位魔法师。真希望我们从来没有见过它。
        - id: ch01-b51
          speaker: wulfric
          text: 那是一位法力高强的魔法师？
        - id: ch01-b52
          speaker: robert
          text: 对，法力无边。真的！
        - id: ch01-b53
          speaker: wulfric
          text: 你以为自己激怒了魔法师，他才用法术增强围城军队的力量。可你须知道，沃尔弗里克·德·塔尔博特不用魔法相助，也能率领部下获胜。
        - id: ch01-b54
          speaker: robert
          text: 您当然不用魔法帮忙，我完全相信。可这件事多少还是怪它，主要却怪我们自己。要不是我们先许了愿，您原本根本不可能在这里做任何事。
        - id: ch01-b55
          speaker: wulfric
          text: 大胆小子，你的话晦涩，又很无礼。快替我解开这道谜！
        - id: ch01-b56
          speaker: robert
          text: 您当然不知道，可您根本不是真的。您会在这里，只因他们蠢得许愿要一座城堡。太阳落山，您就会消失，什么事都没了。
        - id: ch01-b57
          speaker: narrator
          text: 队长和兵士们彼此交换眼色。起初，他们像是在怜悯这个胡言乱语的孩子，接着，目光却一点点严厉起来。那个穿着最长靴子的兵士认定罗伯特在装疯逃跑，终于开口提醒自己的首领。
        - id: ch01-b58
          speaker: soldier_1
          text: 尊贵的大人，当心。这小鬼佯装疯癫，只想逃走。何不把他绑起来？
        - id: ch01-b59
          speaker: robert
          text: 我不比你们疯，也许还更清醒。我真傻，居然以为你们听得懂。放我走，我又没伤害你们。
          emotion: angry
        - id: ch01-b60
          speaker: narrator
          text: 骑士原先似乎相信魔法师和愿望的整个故事，直到故事牵扯到他自己。他没有回答罗伯特的辩解，只追问孩子想往哪里去。
        - id: ch01-b61
          speaker: wulfric
          text: 你欲往何处？
        - id: ch01-b62
          speaker: robert
          text: 当然回家。
        - id: ch01-b63
          speaker: narrator
          text: 罗伯特指向城堡。
        - id: ch01-b64
          speaker: wulfric
          text: 想去送援军的消息？休想！
        - id: ch01-b65
          speaker: robert
          text: 那就让我去别处。
        - id: ch01-b66
          speaker: narrator
          text: 罗伯特忽然有了主意，便说自己可以去别处。他急忙搜寻记忆，想从读过的历史传奇里找出一句能说服骑士的话，终于勉强拼出了一套古腔古调。
        - id: ch01-b67
          speaker: robert
          text: 沃尔弗里克·德·塔尔博特爵士，扣留一个没伤害过您、只想安静离开的人，应该是您不屑做的事。
        - id: ch01-b68
          speaker: wulfric
          text: 竟敢当面如此对我说话！你这无赖，该受诅咒！不过，你说的确是实情。随你去哪里吧，你自由了。沃尔弗里克·德·塔尔博特不与婴孩交战。这里的杰金会陪你同行。
        - id: ch01-b69
          speaker: robert
          text: 好吧，我想杰金会玩得很开心。走吧，杰金。沃尔弗里克爵士，我向您致敬。
        - id: ch01-b70
          speaker: narrator
          text: 罗伯特行了个现代军礼，拔腿跑向砾石坑。杰金穿着长靴，轻轻松松便跟上了他。到了砾石坑，罗伯特找到沙仙，把它从沙里挖出来，又把它叫醒，苦苦求它再给自己一个愿望。
        - id: ch01-b71
          speaker: psammead
          text: 我今天已经办了两个愿望，其中一个还是我有生以来最费劲的活儿。
        - id: ch01-b72
          speaker: robert
          text: 求求你，求求你，求——求——你！
        - id: ch01-b73
          speaker: narrator
          text: 杰金站在一旁，嘴巴张得大大的，满脸惊恐。他看看这头竟然会说话的古怪野兽，又看看那双转向自己、死死盯住他的蜗牛眼，简直不敢相信眼前的情景。
        - id: ch01-b74
          speaker: psammead
          text: 好吧，到底许什么？
        - id: ch01-b75
          speaker: robert
          text: 我希望自己和其他人在一起。
        - id: ch01-b76
          speaker: narrator
          text: 沙仙开始膨胀。罗伯特完全没想到，自己其实可以许愿让城堡和围城军队消失。他当然知道，这一切都是愿望变出来的。可那些宝剑、短刀、长枪和长矛看起来太过真实，仿佛怎么也不可能凭一句愿望消失。他有一瞬间失去了知觉。再睁开眼睛时，其他人已经全围在他身边。
        - id: ch01-b77
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: 我们全都没听见你进来！你让沙仙替我们实现愿望，真是太好了。我们当然一猜就知道是你做的。可你应该先告诉我们呀，万一我们随口许了什么蠢愿望，那可怎么办？
        - id: ch01-b78
          speaker: robert
          text: 蠢愿望？你们还能许得多蠢？差点儿把我害死！
          emotion: angry
        - id: ch01-b79
          speaker: narrator
          text: 罗伯特把外面的遭遇从头讲了一遍，大家都承认，这回他确实吃足了苦头。接着，他们又把他的勇气和聪明夸了又夸。罗伯特听得十分受用，很快找回了刚才丢掉的好脾气。他觉得自己比从前更加勇敢，最后还答应担任守城一方的队长，带着大家准备抵挡围城军队。
        - id: ch01-b80
          speaker: anthea
          text: 我们一直等你，还什么也没做。我们想用叔叔送的弓箭，从射箭孔里向他们放箭。第一箭让你来。
        - id: ch01-b81
          speaker: robert
          text: 我看最好别射。你们没在近处看过他们，不知道他们是什么样。他们有真正的弓箭，长得吓人，还有宝剑、长枪、短刀，各种尖利的兵器。这不是图画，也不是幻影，全都是真的。他们真的会伤人，我看甚至会杀人。我的耳朵现在还疼呢。你们探过城堡吗？只要他们不先动手，我们也别招惹他们。我听杰金说，他们要等太阳快落山才攻城。我们该趁现在准备。城堡里有没有守军？
        - id: ch01-b82
          speaker: cyril
          text: 不知道。我刚许愿让我们待在一座被围攻的城堡里，所有东西就像翻了个底朝天。等它们恢复原样，我们朝窗外一看，就瞧见营地、那些东西，还有你。我们当然只顾看个不停了。这个房间棒不棒？真实得不能再真实！
        - id: ch01-b83
          speaker: narrator
          text: 房间方方正正，石墙足有四英尺厚，头顶横着粗大的木梁。角落有一扇矮门，门后是一段向上又向下的楼梯。孩子们往下走，来到一间巨大的拱顶门楼。两扇巨门关得严严实实，还上了门闩。楼梯绕着一座圆塔盘旋而下，塔底的小房间里有扇稍大的窗户。从那里望出去，吊桥高高升起，铁闸已经落下，护城河又宽又深。通往护城河的巨门对面还有一道大门，门上另开着小门。孩子们穿过去，便到了铺着石板的大院。城堡四面的灰色高墙又暗又厚，沉沉耸立。
        - id: ch01-b84
          speaker: narrator
          text: 玛莎站在院子中间附近，右手在空中来回移动。厨娘弯着腰，两只手也用一种古怪的方式动来动去。最奇怪也最吓人的还是小弟弟。他坐在离地三英尺的半空中，身下什么也没有，却笑得十分开心。孩子们赶紧朝他跑去。安西娅刚刚伸出双臂，想把他抱下来，玛莎便没好气地开口了。
        - id: ch01-b85
          speaker: martha
          text: 小姐，行行好，别碰他。他现在乖得很呢，就让他安安生生坐着吧。
        - id: ch01-b86
          speaker: anthea
          text: 可他到底在做什么？
        - id: ch01-b87
          speaker: martha
          text: 做什么？这宝贝正乖乖坐在高脚椅里，看我熨衣服呢。快走开吧，我的熨斗又凉了。
        - id: ch01-b88
          speaker: narrator
          text: 玛莎说完便朝厨娘走去。孩子们看见她握着一根不存在的拨火棍，去捅一堆看不见的炉火。厨娘的动作也同样古怪，像是双手托着一只看不见的盘子，小心地把它送进一座看不见的烤炉。
        - id: ch01-b89
          speaker: martha
          text: 快走开，我的活儿已经晚了。你们再碍手碍脚，午饭就别想吃。快走，不然我把擦盘布别在你们尾巴上。
        - id: ch01-b90
          speaker: jane
          text: 你肯定小弟弟没事吗？
          emotion: fearful
        - id: ch01-b91
          speaker: martha
          text: 好得不能再好了，只要你们别来把他闹得不安生。我还以为你们今天巴不得不用管他呢。可你们想带走，看在老天分上，就带走吧。
        - id: ch01-b92
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 不，不！
        - id: ch01-b93
          speaker: narrator
          text: 孩子们很快就得守卫城堡。让小弟弟悬在半空，留在一间看不见的厨房里，也比把他带进被围城堡的警卫室安全。他们赶紧离开，穿过遇见的第一道门，在里面一条贴墙摆放的木凳上，无可奈何地坐了下来。
        - id: ch01-b94
          speakers: [anthea, jane]
          ensemble: duo
          text: 太可怕了！
          emotion: fearful
        - id: ch01-b95
          speaker: jane
          text: 我觉得自己进了疯人院。
          emotion: fearful
        - id: ch01-b96
          speaker: anthea
          text: 这到底怎么回事？怪瘆人的，我不喜欢。真该许个简单的东西，比如摇摇马或者驴。
        - id: ch01-b97
          speaker: robert
          text: 现在再许也没用了。
          emotion: angry
        - id: ch01-b98
          speaker: cyril
          text: 先别说话，让我想想。
        - id: ch01-b99
          speaker: narrator
          text: 西里尔把脸埋进双手，其他人只好安静下来，四下打量。这个房间很长，屋顶呈拱形。两侧摆着一张张木桌，尽头还有一张横桌，放在一座像高台的地方。屋里又暗又昏沉，地上散着树枝似的干东西，闻起来也不怎么好。过了一会儿，西里尔忽然抬起了头，像是终于把这一切想通了。
        - id: ch01-b100
          speaker: cyril
          text: 我想明白了。我们许过愿，愿望实现时，仆人不会看出任何变化。除非特地替小弟弟许愿，他身上也不会发生什么。所以，他们当然看不见城堡。可是城堡就在我们房子原来的地方，仆人又必须继续待在房子里，不然就会发现不对劲。你不可能把城堡和房子混在一起。我们看见城堡，就看不见房子。他们一直看见房子，也就看不见城堡。所以——
        - id: ch01-b101
          speaker: jane
          text: 啊，别再说了！你说得我脑袋直打转，像坐旋转木马一样。那根本不重要。我只希望咱们能看得见午饭。午饭要是看不见，肯定也摸不着，那还怎么吃？我刚才试过能不能摸到小弟弟的椅子，可他身下一丁点儿东西也没有，只有空气。我们又不能吃空气。我觉得自己像是好多好多年都没吃过早饭了。
        - id: ch01-b102
          speaker: anthea
          text: 想也没用。继续找吧，也许城堡里有吃的。
        - id: ch01-b103
          speaker: narrator
          text: 这句话让每个人心里都亮起了希望，大家立刻起身，继续探索城堡。他们走过一间又一间屋子，越看越觉得这座城堡完美又迷人，简直胜过你所能想象的一切。里面的陈设样样齐全，每一件都漂亮极了。可是，他们把能找的地方都找过，仍旧没有发现任何食物，也没有找到一个守城的兵士。
        - id: ch01-b104
          speaker: jane
          text: 你要是许愿让我们待在一座守军齐备、粮食充足的城堡里就好了！
        - id: ch01-b105
          speaker: anthea
          text: 谁也不可能什么都想得到。我看快到午饭时间了。
        - id: ch01-b106
          speaker: narrator
          text: 其实还没到午饭时间。可孩子们还是守在院子中间，看仆人们做着那些古怪的动作。他们看不见原来的房子，当然也无法确定饭厅究竟在什么地方，只好守着人来人往的地方耐心等候。过了一会儿，玛莎像是端着一只托盘，穿过院子。真是再幸运不过的巧合，原来房子的饭厅和城堡的宴会厅恰好在同一个地方。孩子们才刚高兴起来，却很快发现托盘也看不见。一颗颗满怀希望的心，顿时全沉了下去。
        - id: ch01-b107
          speaker: narrator
          text: 孩子们悲惨地沉默着，眼看玛莎一本正经地做完一整套动作。她仿佛切开一条看不见的羊腿，又拿起一把谁也看不见的勺子，给他们分出看不见的青菜和土豆。等玛莎离开宴会厅，几个孩子先看看面前空空的桌面，又抬起头，彼此看了看。
        - id: ch01-b108
          speaker: robert
          text: 这回可比先前遇到的任何麻烦都糟。
        - id: ch01-b109
          speaker: narrator
          text: 在此以前，罗伯特从来没有对午饭格外热心过。这一次，看着空空的桌面，他却第一个开口抱怨。
        - id: ch01-b110
          speaker: anthea
          text: 我其实也没有那么饿。
        - id: ch01-b111
          speaker: narrator
          text: 安西娅还是像平常一样，努力从坏事里找出好的一面。西里尔什么也没说，只故意把腰带勒紧了一扣。简再也忍不住，放声哭了起来。
