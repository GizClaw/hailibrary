audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带一点含蓄的幽默
        timbre: 温暖清亮
        pace: 从容而有变化
        pitch: 中音
    cyril:
      display_name: 西里尔
      tts:
        delivery: 自信爽快，像个爱拿主意的大孩子
        timbre: 明亮结实
        pace: 稍快
        pitch: 中高音
    anthea:
      display_name: 安西娅
      tts:
        delivery: 认真体贴，着急时干脆利落
        timbre: 清澈柔韧
        pace: 中速
        pitch: 中高音
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，偶尔一本正经
        timbre: 清亮饱满
        pace: 中速
        pitch: 中音
    jane:
      display_name: 简
      tts:
        delivery: 天真敏感，想象丰富
        timbre: 轻柔明亮
        pace: 中速
        pitch: 高音
    psammead:
      display_name: 沙仙
      tts:
        delivery: 沙哑古怪，骄傲又容易不耐烦
        timbre: 干涩粗哑
        pace: 中慢速
        pitch: 中低音
    plum_grower:
      display_name: 李园主人
      tts:
        delivery: 乡音浓重，受惊后语无伦次
        timbre: 粗厚
        pace: 中慢速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 没寄成的信
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天大雨下个不停，孩子们没法出门，更不能去惊动怕水的沙仙。几千年前，它左边的胡须淋湿过一次，至今还觉得疼。漫长的一天挨到下午，孩子们忽然决定给妈妈写信。偏偏罗伯特拿着一只又深、又装得满满的墨水瓶从安西娅书桌上经过。安西娅恰在这时拉开自己用硬纸板、树胶和印度墨做的“秘密抽屉”。桌子底下，羔羊宝宝也恰在这时弄坏了会叫的小鸟玩具，又把鸟肚里的尖铁丝戳进罗伯特的腿。罗伯特一抖，墨水全灌进秘密抽屉，还流过了安西娅写到一半的信。谁都不是故意的，事情却彻底糟了。
        - id: ch01-b02
          speaker: narrator
          text: 安西娅的信原本写着：“亲爱的妈妈，希望您身体很好，也希望外婆好些了。前几天我们……”写到这里，下面只剩一大片墨迹。墨水把她本来要讲的事全淹没了。她只好在纸张最下方用铅笔补上几句，说墨水不是自己打翻的，可收拾桌子花了太久，眼看就到收信时间，这次只能写到这里。最后，她规规矩矩地落款，写上爱妈妈的女儿安西娅。
        - id: ch01-b03
          speaker: narrator
          text: 罗伯特连一个字都没写。他刚才一边琢磨该跟妈妈说什么，一边只顾在吸墨纸上画船。墨水打翻以后，他当然得帮安西娅清理书桌。那只自制的秘密抽屉已经泡透了，他便答应重新给她做一个，而且保证新抽屉一定比原来的更好。
        - id: ch01-b04
          speaker: anthea
          text: 那就现在做吧。
        - id: ch01-b05
          speaker: narrator
          text: 结果，收信时间到了，罗伯特的信没有写，秘密抽屉也没有做好。西里尔倒是飞快写完一封长信，随后去照《自制园艺家》的办法布置捉蛞蝓的陷阱。可邮差快来时，那封信怎么也找不到，从此再没出现。也许蛞蝓把它吃了。
        - id: ch01-b06
          speaker: narrator
          text: 只有简的信寄了出去。大家本来都想把普萨米德的事告诉妈妈，可简为了弄清“普萨米德”怎么拼，迟迟没法往下写。故事要讲就得好好讲完，否则讲了也没有用。眼看时间不够，她只好先说，大家照妈妈的吩咐，尽量做最乖的孩子。羔羊宝宝有一点儿感冒，玛莎却说没关系，只怪他昨天早晨把金鱼缸打翻到自己身上。她还写到，前几天大家去了砾石坑，特意绕行大车走的那条安全道路，然后发现了一个奇怪的东西。信写到这里便停住了。半个钟头过去，几个孩子才不得不承认，谁也不会拼那个东西的名字。他们查遍词典，也没找到答案。
        - id: ch01-b07
          speaker: narrator
          text: 简匆匆收尾，说马上就要收信，这次不能多写。她又在附言里问妈妈，如果能让一个愿望成真，妈妈会要什么。邮差的号角一响，罗伯特立刻冒雨冲出去拦住邮车。于是，孩子们明明都想告诉妈妈，妈妈却始终不知道沙仙的事。当然，还有别的原因，不过那些以后再说。
        - id: ch01-b08
          speaker: narrator
          text: 次日，理查德舅舅坐着四轮马车来接他们，把羔羊宝宝以外的孩子全带到梅德斯通。他是最叫人喜欢的那种舅舅。进了玩具店，他不限制价钱，也不说玩具非得有教育意义，只让孩子们挑自己真正想要的。让孩子自己挑选，其实非常明智。孩子们又傻，见识又少，有时一不留神，反倒会拿到真正有教育意义的东西，而且拿到手以前还完全不知道。
        - id: ch01-b09
          speaker: narrator
          text: 罗伯特直到最后一刻才匆匆拿了一只盒子。盒面画着长翅膀的人头公牛，还有顶着鹰头的翼人。他以为盒子里面装着和图上一模一样的动物，回家打开才知道，那是一盒关于古代尼尼微的安息日益智玩具。这次，他完全是无意中选到了“有教育意义”的东西。其余人同样选得匆忙，却能慢慢享受。西里尔得到一台模型发动机，两个姑娘各有一只洋娃娃，还共同拥有一套画着勿忘草的瓷茶具。男孩子共同拥有的则是一副弓箭。
        - id: ch01-b10
          speaker: narrator
          text: 买完玩具，舅舅又带他们坐船游览美丽的梅德韦河。上岸以后，大家还去一家漂亮的点心铺，舒舒服服地喝了下午茶。这一整天快活极了，可他们回到家时也实在太晚，已经没有时间赶到砾石坑，那天只好一个愿望也不许。他们从头到尾没向舅舅提起普萨米德。为什么呢？我不知道，他们自己也说不明白，可你也许猜得到。
        - id: ch01-b11
          speaker: narrator
          text: 舅舅慷慨款待他们以后的那一天，热得出奇。负责安排天气、每天在报纸上发号施令的人，后来都说，这是好多年来最热的一天。他们明明写的是“天气转暖，间有阵雨”。天气的确一门心思地转暖，忙得顾不上阵雨那道命令，所以一滴雨也没下。
    - id: ch02
      title: 清晨的主意
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 晴朗的夏日清晨，五点钟的世界美极了。阳光泛着粉红和金黄，草木披满钻石似的露珠，影子全朝着傍晚相反的方向伸展。那景象叫人觉得，自己走进了另一个崭新的世界。安西娅就在五点醒来，因为她事先叫自己非醒不可。
        - id: ch02-b02
          speaker: narrator
          text: 办法是这样的。夜里上床以后仰面躺平，小小的背紧贴着床，两条手臂笔直放在身旁。一边说“我一定要在五点醒来”，一边把下巴压向胸口，再把头向后砸回枕头。你想在几点醒来，就照那个数目做几次。这道算术并不难。六点、七点、八点或者九点都行。不过，你必须真心想起床。要是心里根本不愿意，再怎么做也没有用。你要是真想起，不妨亲自试试看。它跟拉丁文练习和闯祸一样，熟能生巧，而安西娅早就练得炉火纯青。
        - id: ch02-b03
          speaker: narrator
          text: 她睁眼的那一刻，正好听见餐厅那座黑金相间的钟敲了十一下，于是知道离五点还差三分钟。那座钟报时永远报错，不过只要明白它的意思，就一点儿也不妨碍。这很像听一个人说外国语。只要你懂那门语言，理解起来便跟自己的话一样容易，而安西娅恰好懂钟的语言。她困得厉害，还是跳下床，把脸和手浸进一盆冷水。这道仙术能让人不再想钻回被窝。她穿好衣服，又从下摆起沿着衣缝叠好睡衣，没有抓住袖子团成一堆。你看，她就是这样一个教养良好的孩子。
        - id: ch02-b04
          speaker: narrator
          text: 安西娅提着鞋悄悄下楼，从餐厅窗口爬出去。走门其实一样方便，可窗口更加浪漫，也不容易被玛莎发现。
        - id: ch02-b05
          speaker: anthea
          text: 以后我每天都要五点起床。这个时候实在美得叫人受不了。
        - id: ch02-b06
          speaker: narrator
          text: 她的心跳得很快。这个计划完全是她自己的，她不知道计划究竟好不好，却知道告诉别人也不会让它变得更好。不管对错，她宁可独自做到底。她先在铁游廊底下停住，站在闪闪发亮的红黄地砖上穿好鞋，然后一路跑向砾石坑。她找到昨天做过记号的地方，动手刨开沙子，把普萨米德挖了出来。沙仙从睡梦里遭人惊醒，十分恼火，浑身的毛像圣诞节时鸽子蓬起的羽毛一样根根竖起。
        - id: ch02-b07
          speaker: psammead
          text: 太不像话了。天气冷得像北极，现在又是半夜。
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: 安西娅轻声道歉，脱下白围裙替它盖住身体，只露出脑袋、蝙蝠耳朵和一对蜗牛眼睛。
        - id: ch02-b09
          speaker: psammead
          text: 谢谢，这样暖和多了。今天早晨，你想许什么愿？
        - id: ch02-b10
          speaker: anthea
          text: 我还不知道，问题就在这儿。到现在，我们的运气一直不好，我想先跟您商量。能不能等到早饭以后，再替我实现愿望？正说着话，对方忽然拿一个你根本不想要的愿望扑过来，实在让人招架不住。
        - id: ch02-b11
          speaker: psammead
          text: 既然不想要，就不该说自己希望得到。从前的人可清楚得很，晚饭想吃大地懒还是鱼龙，他们从不会弄错。
        - id: ch02-b12
          speaker: anthea
          text: 我会尽量小心，可我真的希望——
        - id: ch02-b13
          speaker: psammead
          text: 当心！
          emotion: fearful
        - id: ch02-b14
          speaker: narrator
          text: 普萨米德警告她，身体已经开始膨胀。
        - id: ch02-b15
          speaker: anthea
          text: 这不是魔法愿望。我只是说，您现在别为了给我东西，胀得快要裂开，我就很高兴了。请等其他人都来了再说。
        - id: ch02-b16
          speaker: psammead
          text: 好吧，好吧。
        - id: ch02-b17
          speaker: narrator
          text: 它虽然答应了，却冷得打了个寒战。安西娅请它坐到自己腿上，说那里比较暖，还能用裙摆把它裹住。她保证会非常小心。本来她没指望沙仙答应，它却真的爬上她的膝头，舒服地偎了下来。安西娅有点儿害怕，双臂抱得轻轻的。
        - id: ch02-b18
          speaker: psammead
          text: 谢谢，你倒真挺体贴。好了，有什么话就说吧。
        - id: ch02-b19
          speaker: anthea
          text: 我们每次许愿，结果都糟糕透了。您活了这么久，一定很聪明，能不能替我们出个主意？
        - id: ch02-b20
          speaker: psammead
          text: 我从小就慷慨。只要醒着，我每个钟头都在给别人东西。可有一样东西我绝不给，那就是主意。
        - id: ch02-b21
          speaker: anthea
          text: 可这件事这么奇妙，是个多么了不起的机会。您肯替我们实现愿望，实在好心极了。要是只因为我们太傻，不知道该要什么，就把机会全糟蹋掉，多可惜呀。
        - id: ch02-b22
          speaker: narrator
          text: 安西娅早想说这番话，却不肯当着其他人说。承认自己傻是一回事，说别人也傻，又是另一回事。
        - id: ch02-b23
          speaker: psammead
          text: 孩子，我只能劝你开口以前先想清楚。
        - id: ch02-b24
          speaker: anthea
          text: 可您不是从来不给主意吗？
        - id: ch02-b25
          speaker: psammead
          text: 这一句不算，你反正不会照办。再说，这话也不是我想出来的，每本习字帖上都有。
        - id: ch02-b26
          speaker: anthea
          text: 那您只告诉我，许愿要翅膀是不是很傻，好吗？
        - id: ch02-b27
          speaker: psammead
          text: 翅膀吗？还有比这更坏的愿望。不过，日落时别飞得太高。我听说从前有个尼尼微男孩，是辛那赫里布国王的儿子。旅行者送给他一只普萨米德，他竟把我们这一族的成员养在宫殿平台的沙箱里。这当然是奇耻大辱，不过他毕竟是亚述国王的儿子。一天，他许愿长出翅膀，也果真得到了。可他忘了，翅膀日落时会变成石头。结果他啪的一声，落在父王大阶梯顶端的翼狮身上。孩子的石翅膀撞上狮子的石翅膀，后面的事可一点儿也不好听。不过在那以前，他大概玩得非常痛快。
        - id: ch02-b28
          speaker: anthea
          text: 为什么我们的愿望现在不变成石头，只会消失呢？
        - id: ch02-b29
          speaker: psammead
          text: 时代变了，风俗也变了。
        - id: ch02-b30
          speaker: anthea
          text: 这是尼尼微话吗？
        - id: ch02-b31
          speaker: narrator
          text: 安西娅在学校里，除了法语没学过别的外国语。
        - id: ch02-b32
          speaker: psammead
          text: 从前的人许愿，都要猛犸、大翼手龙这一类结实又实在的日常用品。把它们变成石头容易得很。如今的人却净要异想天开的东西。像白昼一样美，或者让人人都想要你，这怎么变成石头？规矩不能定两套，于是愿望现在干脆消失。再说，美貌要是真能变成石头，留下的年月会比你们的寿命长得多。看看希腊雕像就知道。如今这样正合适。再见，我困死了。
        - id: ch02-b33
          speaker: narrator
          text: 沙仙跳下她的膝头，拼命刨沙，一眨眼便没了踪影。安西娅赶回去时，早饭已经迟到。罗伯特悄悄往羔羊宝宝的罩衫里倒了一勺糖浆。这样做当然很淘气，却有两样好处。宝宝最爱全身黏糊糊，高兴得不得了。玛莎则忙着在早饭后替他从头到脚彻底洗干净，其他人正好趁她无暇分身，甩掉羔羊宝宝，悄悄溜去砾石坑。
        - id: ch02-b34
          speaker: narrator
          text: 到了小路上，安西娅跑得气喘吁吁，提出大家轮流许愿。不过，一个人的愿望必须得到其余人的赞成。
        - id: ch02-b35
          speaker: robert
          text: 那么，谁先许？
        - id: ch02-b36
          speaker: anthea
          text: 你们不介意的话，让我先来。我已经想过了，我想要翅膀。
        - id: ch02-b37
          speaker: narrator
          text: 大家听完以后沉默了一会儿。其他人原本很想从安西娅的主意里挑点儿毛病，免得显得自己什么想法也没有。可是，“翅膀”两个字一钻进耳朵，每个人心里都扑棱起快乐和兴奋。谁都忍不住想象飞上天空的情形，所以实在找不出可以反对的话。
        - id: ch02-b38
          speaker: cyril
          text: 这个主意还不赖。
        - id: ch02-b39
          speaker: robert
          text: 说真的，豹豹，你可不像看上去那么傻。
        - id: ch02-b40
          speaker: jane
          text: 我觉得一定美妙极了，简直像一场亮闪闪的狂热梦。
        - id: ch02-b41
          speaker: narrator
          text: 他们轻易找到了沙仙。
        - id: ch02-b42
          speaker: anthea
          text: 我希望我们全都长出美丽的翅膀，能够飞翔。
    - id: ch03
      title: 彩虹翅膀
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 沙仙听见愿望，立刻把身体鼓了起来。下一刻，每个孩子的肩头都生出一种说不明白的怪感觉。一方面，那里像压上了沉甸甸的东西。另一方面，整个身体又轻得快要离开地面。谁都不知道接下来会发生什么。普萨米德歪着头，一双蜗牛眼睛从这个孩子转向下一个，挨个打量愿望的结果。
        - id: ch03-b02
          speaker: psammead
          text: 翅膀还不赖。不过罗伯特，说真的，你也不像看上去那么像天使。
        - id: ch03-b03
          speaker: narrator
          text: 罗伯特差点儿红了脸。翅膀巨大无比，美得超乎想象。它们柔软光滑，每根羽毛都服服帖帖。羽毛的色彩交融变化，像彩虹，像虹彩玻璃，也像有时浮在脏水上的美丽油膜。
        - id: ch03-b04
          speaker: jane
          text: 可是，我们真的会飞吗？
        - id: ch03-b05
          speaker: narrator
          text: 简急得一会儿用左脚站，一会儿换成右脚。
        - id: ch03-b06
          speaker: cyril
          text: 小心，你踩着我的翅膀了。
        - id: ch03-b07
          speaker: anthea
          text: 翅膀会疼吗？
        - id: ch03-b08
          speaker: narrator
          text: 没人回答。罗伯特已经展开双翼，纵身一跳，慢慢升进空中。他穿着灯笼裤套装，看起来笨拙极了。尤其那双靴子，无助地垂在脚下，显得比平时大得多。不过谁也不在乎他的样子，更顾不上自己好不好看，因为大家都张开翅膀飞了起来。
        - id: ch03-b09
          speaker: narrator
          text: 每个人都梦见过飞翔，所以你大概知道那是什么感觉。梦里飞起来轻松极了，像是世上再自然不过的事。可是一醒来，你总记不起自己究竟用了什么诀窍。况且梦中的人通常没有翅膀也能飞，那本领更加高明，也更加少见，自然更难记住方法。现在，四个孩子拍着翅膀离开地面，迎面的空气不断掠过脸颊，痛快得无法形容。他们的翅膀展开以后宽得惊人，只能彼此隔开很远，免得挡住同伴的路。不过，这种飞行中的小规矩，他们很快就学会了。
        - id: ch03-b10
          speaker: narrator
          text: 把英语词典和希腊语词典里的词全拿出来，也说不清飞翔究竟有多奇妙。从上空俯瞰田野和森林，跟站在地面平望完全不同，倒像是在看一张美丽的活地图。纸上呆板又可笑的颜色全不见了，换成真正沐浴着阳光、随风活动的树林，还有一片接一片铺开的绿野。西里尔管这叫“痛快到家了”，也不知道他从哪儿学来的古怪说法。这是孩子们经历过的愿望里，最神奇的一次，也最像真正的魔法。他们拍动巨大的彩虹翅膀，在绿色大地与蓝色天空之间飞翔，有时使劲拍动，有时安静滑行。他们径直越过罗切斯特，又转向梅德斯通。不久，大家忽然饿得要命。说来也巧，那时他们正低低飞过一座果园，看见早熟的李子在枝头红亮饱满。
        - id: ch03-b11
          speaker: narrator
          text: 他们悬停在空中，像游泳时踩水一样。老鹰尤其擅长这种本领。虽然谁也没有开口，西里尔却猜到了大家的念头。
        - id: ch03-b12
          speaker: cyril
          text: 我也知道那些李子看起来很好吃。可就算长了翅膀，偷东西还是偷东西。
        - id: ch03-b13
          speaker: jane
          text: 真的吗？长出翅膀，我们就是鸟。鸟违反十诫，也没人管它们。人们也许会介意，可鸟儿照做不误，既不会挨骂，也不会被送进监狱。
        - id: ch03-b14
          speaker: narrator
          text: 彩虹翅膀太大，停在李树上远没有看起来那么容易。羽毛总会碰上枝叶，翅膀也很难找到舒展的位置。不过，不知怎么，他们四个到底都落稳了。树上的李子又甜又多汁，正好安慰他们空空的肚子。幸好等到每个人都吃够了对身体有益的分量，他们才看见一个胖男人拎着粗棍，从果园门口匆匆赶来。那副样子，一看就是李树的主人。四个孩子立刻从枝头起身，齐心协力把宽大的翅膀从累累果枝间抽出来，一齐飞走。
        - id: ch03-b15
          speaker: narrator
          text: 那男人本来远远看见树枝摇晃抽动，便认定村里的小坏蛋又来偷果子。往年收获季里，那些孩子早已教会他，树上的李子一刻也不能放松看守，所以他马上拿起粗棍赶了出来。可是，一双双彩虹翅膀竟从李子树上扑棱棱升起，他张大嘴巴，猛地停住脚步，觉得自己一定彻底疯了。他一点儿也不喜欢这种感觉。安西娅低头一看，只见他的嘴越张越大，再也合不上，脸上还一块发绿、一块发紫，便赶紧飞到他身边盘旋。
        - id: ch03-b16
          speaker: anthea
          text: 请别害怕。我们吃了您的李子，本来以为这不算偷，可现在也拿不准。这枚钱赔给您吧。
        - id: ch03-b17
          speaker: narrator
          text: 她从口袋摸出一枚中间带孔的三便士硬币。本来，她想把硬币穿上缎带，挂在颈上求好运。如今她朝吓坏的李园主人俯冲下去，把钱塞进他的外套口袋，几下便拍着翅膀追上了同伴。农夫沉甸甸地一屁股坐在草地上，掏出硬币咬了咬。
        - id: ch03-b18
          speaker: plum_grower
          text: 老天保佑，这大概就叫幻觉。可这枚三便士倒是真的。从今天起，我得做个更好的人。这种事足够叫人一辈子清醒。幸亏我只看见了翅膀。我宁愿看见不可能存在、还会装着说话的鸟，也不愿看见另外那些说得出名字的东西。
          emotion: fearful
        - id: ch03-b19
          speaker: narrator
          text: 他慢慢地、沉甸甸地站起来，走回屋里。那一天，他对妻子格外温柔。妻子心里十分高兴，却也暗暗纳闷，这个男人究竟出了什么事。她把自己收拾得整齐漂亮，又在衣领扣拢的地方系上一只蓝缎带蝴蝶结。丈夫一看她这么好看，待她便更加和气。这样看来，长翅膀的孩子那天或许真的做了一件好事。不过也只有这一件，因为世上再没有什么比翅膀更容易带你惹麻烦。反过来说，要是你已经陷入麻烦，也没有什么比翅膀更容易带你脱身。
        - id: ch03-b20
          speaker: narrator
          text: 李子没能让他们饱上多久，孩子们很快又饿得跟先前一样。他们尽量把翅膀收得小些，走向一户农舍，打算客客气气地讨一块面包和奶酪。可还没走到门边，一条黑色恶犬便猛扑出来。要是他们只是没有翅膀的普通孩子，它准会从离得最近的罗伯特那条套着棕袜子的腿上，狠狠咬下一块肉。可恶犬才发出第一声低吼，四双翅膀便扑啦一声展开，把孩子们送上空中。它只能留在地面使劲拉扯铁链，两条后腿直立，仿佛自己也想学着飞起来。
        - id: ch03-b21
          speaker: narrator
          text: 他们又去了好几户农庄，希望总有一户肯给他们一点吃的。有狗看门的地方，他们不敢落地。没有狗的人家，里面的人却被这些长着彩虹翅膀的孩子吓坏了。孩子们还没来得及把请求说清楚，屋里的人就放声尖叫，别的什么也做不了。时间慢慢挨到将近四点，他们还是一口饭也没讨到，翅膀却已经又僵又酸，累得几乎拍不动。最后，四个人只好降落在一座教堂的塔顶，围在一起召开作战会议。
        - id: ch03-b22
          speaker: robert
          text: 不吃正餐，也不喝下午茶，我们绝对飞不到家。
        - id: ch03-b23
          speaker: cyril
          text: 可是谁也不肯给我们正餐，连午饭都不给，更别提下午茶。
        - id: ch03-b24
          speaker: anthea
          text: 也许这里的牧师愿意。他一定很懂天使。
        - id: ch03-b25
          speaker: jane
          text: 谁都看得出我们不是天使。瞧罗伯特的靴子，还有松鼠那条格子领带。
        - id: ch03-b26
          speaker: cyril
          text: 如果一个国家不肯卖给你粮食，你就自己拿。打仗时肯定是这么办的。就算在故事里，一个好哥哥也不会让妹妹们守着满地食物活活挨饿。
        - id: ch03-b27
          speaker: robert
          text: 什么叫满地食物？
        - id: ch03-b28
          speakers: [anthea, jane]
          ensemble: duo
          text: 这里哪里有食物？
        - id: ch03-b29
          speaker: narrator
          text: 他们茫然地看着空荡荡的塔顶铅皮。
        - id: ch03-b30
          speaker: cyril
          text: 牧师住宅侧面有一扇储藏室窗户。我看见里面有蛋奶布丁、冷鸡、牛舌、馅饼和果酱。窗户很高，可我们有翅膀。
        - id: ch03-b31
          speaker: jane
          text: 你真聪明！
          emotion: happy
        - id: ch03-b32
          speaker: cyril
          text: 没什么。拿破仑也好，马尔伯勒公爵也好，任何天生的将军都会看见。
        - id: ch03-b33
          speaker: anthea
          text: 可这样做很不对。
        - id: ch03-b34
          speaker: cyril
          text: 哪有。那个士兵不肯请菲利普·西德尼爵士喝一杯时，爵士不是说过“我的需要比他的更大”吗？
        - id: ch03-b35
          speaker: anthea
          text: 那我们把钱凑起来，留下钱付食物，好不好？
        - id: ch03-b36
          speaker: narrator
          text: 安西娅近乎哀求，眼泪都快出来了。又饿得要命，又觉得自己犯了大罪，实在很折磨人。
        - id: ch03-b37
          speaker: cyril
          text: 留下一部分钱。
        - id: ch03-b38
          speaker: narrator
          text: 大家把口袋掏空，钱全倒在塔顶的铅皮屋面上。过去一百五十年里，来这里的游客一直用小刀在柔软的铅皮上刻下自己和心上人的姓名首字母。他们凑起来共有五先令七便士半。连一向正直的安西娅也不得不承认，买四个人的正餐实在用不了这么多钱。罗伯特觉得十八便士已经足够。大家商量来商量去，最后认定，留下半克朗才算体面，也足以表明他们不是存心做贼。
    - id: ch04
      title: 塔顶的晚餐
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 安西娅的口袋里碰巧装着上学期的成绩单。她先把自己的姓名和学校名称撕掉，再翻到背面，郑重地给牧师写信。她说，四个人因为不得不飞上一整天，现在实在饿极了。一个人快要饿死时，为了活命拿些食物，应该不能算偷。他们不敢先去请求，只怕牧师当面说“不行”。牧师虽然一定很懂天使，却也一定看得出，他们几个并不是天使。他们保证只拿维持生命的必需品，绝不碰蛋奶布丁和馅饼，好证明逼着他们向储藏室下手的并非贪吃，而是真正的饥饿。他们还特意声明，自己并不是以拦路抢劫为生。
        - id: ch04-b02
          speakers: [cyril, robert, jane]
          ensemble: chorus
          text: 快写短一点儿吧。
        - id: ch04-b03
          speaker: narrator
          text: 安西娅连忙补上，说他们的用意完全正当，还附上半克朗，证明大家真诚而且感激，最后感谢牧师的款待，由四个人共同署名。她把半克朗包进信里。孩子们都认为，牧师看过以后，能把事情明白到一个没见过翅膀的人所能明白的程度。
        - id: ch04-b04
          speaker: cyril
          text: 这事当然有危险。我们从塔背后直飞下去，贴着墓园飞进灌木丛。附近好像没人，不过很难说。储藏室窗户正对灌木，枝叶遮得像故事里的窗户。我进去拿东西，罗伯特和安西娅在外面接。简负责放哨，她眼睛尖，看见人就吹口哨。罗伯特，你别说话。她的口哨用来示警已经够好了。吹得不太好，反而更像鸟叫。现在出发。
        - id: ch04-b05
          speaker: narrator
          text: 我绝不会说偷东西是对的。不过在这一次，四个饿坏的孩子真不觉得自己是在偷。他们把它看成一桩公平合理的交易。他们还没机会学到，半克朗根本买不到一整条只切过一点儿的牛舌、一只半鸡、一大条面包和一整瓶苏打水。西里尔顺利带大家来到那扇幸福的储藏室窗前，一路没有被人看见，也没碰上任何阻碍。他把这些所谓维持生命的必需品一件件从窗口递了出去。果酱、苹果酥皮饺、蛋糕和什锦蜜饯果皮，他一样也没拿。他觉得自己能忍住这些诱惑，实在是一种英勇行为，我也赞成。
        - id: ch04-b06
          speaker: narrator
          text: 西里尔也为没拿蛋奶布丁而得意，这一点我却不赞成。因为即使他拿了布丁，也会马上遇到一个难题，那就是吃完以后怎样归还盛布丁的盘子。无论一个人多么饥饿，也没有权利偷走一只绘着粉红小花的瓷馅饼盘。苏打水虹吸瓶却不一样。孩子们不能没有饮料，而且瓶身清清楚楚写着制造商的名字，不管把它留在哪里，捡到的人总能把它送还。要是时间足够，他们也打算自己送回去。制造商好像住在罗切斯特，并没有太偏离他们回家的路。
        - id: ch04-b07
          speaker: narrator
          text: 食物全被搬到塔顶，小心摆在一张厨房用纸上。那张纸是西里尔临走时从储藏室最高的一层搁板取来的。他把纸慢慢展开，预备垫在沾过雨水的铅皮上。
        - id: ch04-b08
          speaker: anthea
          text: 我不觉得这张纸也算维持生命的必需品。
        - id: ch04-b09
          speaker: cyril
          text: 当然算。我们得把食物放在干净东西上切。爸爸说过，雨水里的德国人会让人得病。这里雨水不少，水干了，德国人还会留下，钻进食物，让我们全得猩红热。
        - id: ch04-b10
          speaker: jane
          text: 德国人是什么？
        - id: ch04-b11
          speaker: cyril
          text: 是显微镜底下扭来扭去的小东西，什么病都能带来。所以这张纸跟面包、肉和水一样要紧。快吃吧，我真要饿死了！
        - id: ch04-b12
          speaker: narrator
          text: 我不想细说塔顶这顿野餐。你可以想象，用一把只有一片刃、而且那片刀刃从中间断掉的小刀，切开一只鸡和一条牛舌有多困难。不过，他们到底还是做成了。没有餐具，只能用手抓着吃，又油腻，又不方便。临时折成的纸盘也很快布满油渍和斑点，看上去十分可怕。还有一件事，你未必想象得到，那就是直接对着一只装得满满的虹吸瓶喝苏打水，水会怎样横冲直撞地喷出来。想象不出也不要紧，只要请一位大人把虹吸瓶交给你，你就可以自己试。想把这种经验尝个彻底，不妨把管子塞进嘴里，再猛地使劲按下把手。做这种实验最好独自一人，而且最好待在户外，免得别人也分享你的经验。
        - id: ch04-b13
          speaker: narrator
          text: 不管怎么吃，牛舌、鸡肉和新鲜面包都很美味。大热天里，就算被苏打水喷湿一点，也没有谁会介意。于是大家十分享受这顿正餐，每个人都尽自己所能，把肚子装得满满的。第一个原因是他们饿极了。第二个原因是，正如刚才说过的，牛舌、鸡肉和新鲜面包确实非常好吃。
        - id: ch04-b14
          speaker: narrator
          text: 如果正餐迟了很久，你又比平常吃得多，还坐在晒得滚热的教堂塔顶，很快就会莫名其妙地犯困。其实坐在别处也一样。安西娅、简、西里尔和罗伯特在许多地方都跟你相像。吃完所有能吃的，喝光所有能喝的，他们很快便困了。安西娅尤其困，因为她五点钟就起了床。
        - id: ch04-b15
          speaker: narrator
          text: 孩子们一个接一个不再说话，慢慢往后靠去。饭后还不到一刻钟，四个人已经各自蜷起身体，把自己严严实实地裹进宽大、柔软又暖和的翅膀里，沉沉睡熟了。太阳慢慢向西沉落。我非得告诉你它正在西方落下，因为书里总这样写，免得粗心的人误以为太阳会从东方落下。说实在的，这会儿太阳也不在正西，不过已经够接近了，不值得再挑剔。
        - id: ch04-b16
          speaker: narrator
          text: 太阳继续慢慢下沉，孩子们却还睡得温暖香甜。宽大的翅膀柔软又厚实，盖在身上比最舒服的鸭绒被还暖和。塔楼的长影先越过教堂墓园，再越过牧师住宅，一直伸到后面的田野。后来，所有影子都融进暮色。太阳终于落山，彩虹翅膀也在同一刻消失了，孩子们仍旧沉沉睡着。可他们没能再睡多久。暮色虽然很美，夜里的凉意却渐渐透进衣服。无论你有多困，只要哥哥或姐姐先醒来，忽然掀掉你的被子，你很快也会跟着醒。
        - id: ch04-b17
          speaker: narrator
          text: 四个失去翅膀的孩子冷得发抖，一个接一个睁开眼睛。他们这才发现，自己仍在昏暗的教堂塔顶。天已经进入薄暮，蓝色星星正在头顶出现，先是一颗、两颗，接着十颗、二十颗。这里离家好几英里，谁也不能再飞，四个人口袋里的钱加起来只剩三先令三便士半。更糟的是，那只不属于他们的苏打水虹吸瓶还摆在旁边。要是有人发现，他们就得解释那桩有关“维持生命的必需品”、连自己也不敢肯定是否正当的事。四个人你看看我，我看看你，一时谁也没说话。最后，西里尔弯腰捡起虹吸瓶，第一个打破沉默。
        - id: ch04-b18
          speaker: cyril
          text: 我们赶快下去，把这个讨厌东西处理掉。天已经够黑了，可以把它留在牧师家门口。走吧。
        - id: ch04-b19
          speaker: narrator
          text: 塔楼角上有一座小角塔，角塔开着一扇门。他们吃东西时早已看见，却没有过去探查。一个人既然长着翅膀，连整片天空都可以探索，门便显得不值得费心。现在，大家一起朝那扇门走去。
        - id: ch04-b20
          speaker: cyril
          text: 这当然就是下去的路。
        - id: ch04-b21
          speaker: narrator
          text: 的确是。可是，门从里面锁住了。四周越来越黑，他们离家足有好几英里，那只苏打水虹吸瓶也还在。我不会告诉你有没有人哭。要是有人哭，我也不会说哭了几个，更不会告诉你是谁。你还是想一想，假如自己落到他们的处境，会怎么办吧。
