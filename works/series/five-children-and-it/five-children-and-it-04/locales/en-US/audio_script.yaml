  chapters:
    - id: ch01
      title: WINGS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The next day was drenched with rain. It was much too wet to go out, and certainly too wet to wake a Sand-fairy who hated water so much that he still remembered the pain of getting one whisker wet thousands of years ago. The hours dragged on. At last, that afternoon, all the children decided at once to write to Mother.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Robert had the misfortune to be carrying a very deep, very full inkpot across Anthea's desk. At that exact moment, Anthea opened what she had long pretended was a secret drawer. It was really only an arrangement of gum and cardboard painted with Indian ink. Then the Lamb crawled under the table and broke his squeaking bird. A sharp and very convenient wire stuck out of the broken toy, and of course the Lamb promptly drove it into Robert's leg. Nobody had meant for any of it to happen. Even so, Robert spilled the ink straight into the open drawer, flooding it completely, while another stream ran across Anthea's half-written letter.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The letter had begun, "Darling Mother." Anthea asked whether Mother was quite well and Granny was better. She got as far as beginning to tell them what had happened the other day. After that came a flood of ink. At the bottom, Anthea added in pencil that she had not upset it, but cleaning up had taken so long that it was already time for the post. There was no room for anything more. Then she signed herself Mother's loving daughter.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Robert had not even started his letter. He had been drawing a ship on the blotting paper while he tried to think of something to say. After the accident, he helped clear the desk and promised Anthea a better secret drawer. She told him to make it at once. By post-time, neither the letter nor the drawer was finished.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Cyril wrote a long letter very quickly. Then he went to build a slug trap he had read about in The Home-made Gardener. When the post was due, no one could find his letter. No one ever found it. Perhaps the slugs ate it.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Jane's was the only letter that went. She meant to tell Mother about the Psammead, just as they all had meant to do. But she spent so long wondering how to spell its name that she ran out of time. A story is no use unless you tell it properly. She began, "My dear Mother dear," and said they were all being as good as they could, just as Mother had asked. The Lamb had a small cold, though Martha said it was nothing. He had tipped the goldfish bowl over himself the morning before. Jane carefully explained that when they went to the sand-pit, they used the safe road where the carts went. Then she wrote that they had found something and stopped.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Half an hour passed before Jane was sure that none of them could spell Psammead. The dictionary did not help. She hurriedly finished by calling it a strange thing and promising more next time. In a postscript, she asked Mother what she would choose if one wish could come true.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The postman's horn sounded. Robert dashed through the rain to stop the cart and hand over Jane's letter. So although every child meant to tell Mother about the Sand-fairy, she never learned about it. There were other reasons too, but those come later.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The following day, Uncle Richard took everyone but the Lamb to Maidstone in a wagonette. He was the very best sort of uncle. At the toyshop he let them choose anything they liked, with no rules about the price and no talk of buying something instructive.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Letting children choose freely can be very wise. Children are so inexperienced that they sometimes pick something educational by mistake. Robert did exactly that, at the very last moment and in a great hurry. He grabbed a box showing winged bulls with men's heads and winged men with eagles' heads. He expected to find toy animals inside, exactly like the creatures on the lid. Only when he got home did he discover that the box held a Sunday puzzle about ancient Nineveh.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The others chose in a hurry and had plenty of time afterward to be pleased. Cyril got a model engine. The girls shared two dolls and a china tea set painted with forget-me-nots. The boys' shared present was a bow and arrows. After the shopping, Uncle Richard took them out in a boat on the beautiful River Medway. Then they all had tea at a beautiful pastry shop. By the time they reached home, it was far too late to make a wish that day. They never told Uncle Richard anything about the Psammead. I do not know why, and neither did they. Perhaps you can guess.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The day after Uncle Richard's generous visit was hotter than anyone could remember for years. The people who decide what weather everyone will have, and print their orders in the newspaper each morning, later said so themselves. Their order had been for warmer weather with some showers. Warmer it certainly became. In fact, the day worked so hard at growing warmer that it had no time at all to attend to the part about showers. Not a single shower came.
        - id: ch01-b13
          speaker: narrator
          text: >-
            A fine summer morning at five o'clock is beautiful. The sunlight is pink and yellow. Dew shines like diamonds on every tree and blade of grass. The shadows point the opposite way from evening shadows, and the whole world feels new.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Anthea woke at five because she had made herself do it. Here is the trick. At night, lie flat on your back with your hands straight down by your sides. Say, "I must wake at five," or six, or seven, or whatever hour you choose. As you say it, press your chin down against your chest, then bump your head back on the pillow. Do that as many times as there are numbers in the hour. It is quite an easy sum. Of course, everything depends on truly wanting to get up. If you do not mean it, the trick is useless. If you do mean it, you may try and see. Practice helps, whether you are writing Latin exercises or getting into trouble. Anthea had practiced until she was perfect.
        - id: ch01-b15
          speaker: narrator
          text: >-
            At the very moment Anthea opened her eyes, the black-and-gold clock downstairs in the dining room struck eleven. That meant it was three minutes before five. The clock always struck the wrong number, but it told the right time once you knew what the numbers meant. It was like listening to someone speak a foreign language. If you know that language, it is just as easy to understand as English, and Anthea knew the clock's language perfectly. She was very sleepy, yet she jumped up and plunged her face and hands into cold water. That was another sort of fairy charm, one that stopped her longing to climb back into bed. She dressed and even folded her nightgown neatly from the hem along the seams instead of bundling it by the sleeves. That shows what a well-brought-up girl she was.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Carrying her shoes, she crept downstairs. She climbed through the dining-room window. The door would have been just as easy, but the window felt more romantic and Martha was less likely to notice. Under the iron veranda, on the shining red-and-yellow tiles, Anthea put on her shoes.
        - id: ch01-b17
          speaker: anthea
          text: I'm going to get up at five every day. The morning is almost too pretty to be real.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Her heart beat fast because this plan was hers alone. She did not know whether it was good, but telling the others would not improve it. Right or wrong, she wanted to carry it through by herself. She ran to the sand-pit, found the Psammead's place, and dug him out. He was extremely cross.
        - id: ch01-b19
          speaker: psammead
          text: This is outrageous. The weather is arctic, and it's the middle of the night.
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: >-
            Anthea apologized softly. She took off her white pinafore and tucked it around the Sand-fairy, leaving only his head, bat ears, and snail-like eyes uncovered.
        - id: ch01-b21
          speaker: psammead
          text: Thank you. That's better. What do you want this morning?
        - id: ch01-b22
          speaker: anthea
          text: >-
            I don't know. That's the trouble. Our wishes have gone badly so far, and I wanted to talk to you. Could you please wait until after breakfast before granting anything? It's hard to talk when wishes you don't truly mean keep springing out at you.
        - id: ch01-b23
          speaker: psammead
          text: >-
            Then don't say you wish for something unless you mean it. Long ago, people nearly always knew whether they wanted Megatherium or Ichthyosaurus for dinner.
        - id: ch01-b24
          speaker: anthea
          text: I'll try. But I do wish—
        - id: ch01-b25
          speaker: psammead
          text: Careful!
        - id: ch01-b26
          speaker: narrator
          text: The Psammead began to swell.
        - id: ch01-b27
          speaker: anthea
          text: >-
            Oh, that wasn't a magic wish. I only meant I'd be glad if you didn't puff yourself up and nearly burst right now. Please wait until the others come.
        - id: ch01-b28
          speaker: psammead
          text: Very well, very well.
        - id: ch01-b29
          speaker: narrator
          text: He shivered.
        - id: ch01-b30
          speaker: anthea
          text: >-
            Would you like to sit on my lap? You'd be warmer, and I could wrap my skirt around you. I'd be very careful.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Anthea never expected him to agree, but he did. He crept onto her lap and nestled down. She put her arms around him with frightened gentleness.
        - id: ch01-b32
          speaker: psammead
          text: Thank you. You really can be thoughtful. Go on, then.
        - id: ch01-b33
          speaker: anthea
          text: >-
            Every wish we've made has ended horribly. Please tell us what to do. You're so old that you must know what's wise.
        - id: ch01-b34
          speaker: psammead
          text: >-
            I was generous even as a child. I've spent every waking hour giving things away. But there's one thing I refuse to give, and that's advice.
        - id: ch01-b35
          speaker: anthea
          text: >-
            Having wishes is such a wonderful chance. It's kind and lovely of you to grant them. It seems dreadful to waste it all because we're too foolish to choose properly.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Anthea had planned those words before she came, and she had especially waited until the others were away before saying them. Calling yourself foolish is one thing. Looking your brothers and sister in the face and saying that all of you are foolish is quite another.
        - id: ch01-b37
          speaker: psammead
          text: My child, all I can suggest is that you think before you speak.
        - id: ch01-b38
          speaker: anthea
          text: I thought you never gave advice.
        - id: ch01-b39
          speaker: psammead
          text: >-
            That doesn't count. You'll never follow it, and it isn't original. Every copybook says the same thing.
        - id: ch01-b40
          speaker: anthea
          text: Then will you at least tell me if wings would be a foolish wish?
        - id: ch01-b41
          speaker: psammead
          text: >-
            Wings? You could choose much worse. Just make certain you aren't flying high at sunset. I once heard of a little Ninevite boy, one of King Sennacherib's sons. A traveler brought him a Psammead, and the boy kept it in a box of sand on the palace terrace. Being shut in a box was a shocking disgrace for one of us, of course, though the child was an Assyrian king's son. One day the boy wished for wings and got them. But he forgot what happened to wishes at sunset in those days. His wings turned to stone while he was still in the air. He fell straight onto one of the stone winged lions at the top of his father's great staircase. His own wings were stone, the lion's wings were stone, and, well, the rest is not a pleasant story. I believe the boy enjoyed himself very much until then.
        - id: ch01-b42
          speaker: anthea
          text: Why don't our wishes turn to stone? Why do they disappear instead?
        - id: ch01-b43
          speaker: psammead
          text: Autres temps, autres moeurs.
        - id: ch01-b44
          speaker: anthea
          text: Is that the language they spoke in Nineveh?
        - id: ch01-b45
          speaker: narrator
          text: French was the only foreign language Anthea had learned at school.
        - id: ch01-b46
          speaker: psammead
          text: >-
            I mean times and customs have changed. In the old days, people asked for good, solid, everyday gifts like Mammoths and Pterodactyls. You could turn those into stone as easily as anything. Nowadays, people choose high-flying, fanciful things. How could anyone turn being beautiful as the day, or being wanted by everybody, into stone? It cannot be done. And we could never have one rule for one wish and a different rule for another. So now they all simply vanish. If beauty as bright as the day could become stone, it would last an awfully long time, much longer than you would. Just look at the Greek statues. Things are much better as they are. Good-bye. I am terribly sleepy.
        - id: ch01-b47
          speaker: narrator
          text: The Psammead jumped from her lap, dug furiously, and vanished.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Anthea was late for breakfast. Afterward, Robert quietly poured a spoonful of treacle down the Lamb's frock. It was very naughty, but it worked in two ways. The Lamb loved being sticky, and Martha had to carry him off for a thorough wash. While she was busy, the other four slipped away to the sand-pit without him.
        - id: ch01-b49
          speaker: narrator
          text: Anthea was breathless from their hurried escape when she spoke in the lane.
        - id: ch01-b50
          speaker: anthea
          text: >-
            Let's take turns choosing our wishes. But no one gets a wish unless the rest of us agree that it's a good one. What do you think?
        - id: ch01-b51
          speaker: robert
          text: Who goes first?
        - id: ch01-b52
          speaker: anthea
          text: Could I? I've thought carefully, and I choose wings.
        - id: ch01-b53
          speaker: narrator
          text: >-
            For a moment, nobody answered. The others wanted to object, but they could find nothing wrong. The very word "wings" sent a flutter of delight through them.
        - id: ch01-b54
          speaker: cyril
          text: That's not bad at all.
        - id: ch01-b55
          speaker: robert
          text: Panther, you're much cleverer than you look.
        - id: ch01-b56
          speaker: jane
          text: It would be wonderful, like a bright and beautiful dream.
        - id: ch01-b57
          speaker: narrator
          text: They found the Sand-fairy without any trouble.
        - id: ch01-b58
          speaker: anthea
          text: I wish all four of us had beautiful wings that we could fly with.
        - id: ch01-b59
          speaker: narrator
          text: >-
            The Sand-fairy swelled. An instant later, each child felt something on their shoulders that was strangely heavy and light at the same time. The Psammead tilted his head and looked from one child to the next with his long snail eyes.
        - id: ch01-b60
          speaker: psammead
          text: Not bad. Though Robert, you don't look quite as angelic as you might think.
        - id: ch01-b61
          speaker: narrator
          text: Robert nearly blushed.
        - id: ch01-b62
          speaker: narrator
          text: >-
            The wings were enormous and more beautiful than anyone could imagine. They felt soft and smooth, and every feather lay neatly in its proper place. Their colors shifted and mingled whenever they moved. They shone like a rainbow, like iridescent glass, or like the lovely colored film that sometimes floats on water you certainly would not want to drink.
        - id: ch01-b63
          speaker: jane
          text: But do they really work? Can we fly?
        - id: ch01-b64
          speaker: narrator
          text: Jane anxiously shifted from one foot to the other.
        - id: ch01-b65
          speaker: cyril
          text: Watch where you step! You're standing on my wing.
        - id: ch01-b66
          speaker: anthea
          text: Does that hurt?
        - id: ch01-b67
          speaker: narrator
          text: >-
            No one answered Anthea. Robert had already spread his wings and jumped upward. Now he was slowly rising through the air. He looked very awkward in his knickerbocker suit, and his helplessly dangling boots seemed much larger than they ever had while he stood inside them. The others paid very little attention to Robert's appearance. They did not care how they themselves looked either. One after another, they stretched out their wings, beat them against the air, and rose from the ground.
        - id: ch01-b68
          speaker: narrator
          text: >-
            You may know the feeling from dreams, because nearly everyone has dreamed about flying. It seems wonderfully easy while the dream lasts, though afterward you can never remember how you did it. Usually you must fly without wings in dreams. That is cleverer and more unusual, but it makes the rule even harder to remember. The four children beat their wings and climbed from the ground. The air rushing over their faces felt glorious. Their wings stretched tremendously wide when open, so they had to fly far enough apart not to strike one another. Small lessons like that are quickly learned.
        - id: ch01-b69
          speaker: narrator
          text: >-
            No English dictionary, nor any Greek one, has words that truly explain the feeling of flying, so I will not pretend to give you those words. But looking down on woods and fields instead of looking across at them was like seeing a beautiful map come alive. There were no foolish colors printed on paper. Below the children lay real, moving, sunlit woods and true green fields, one after another as far as they could see.
        - id: ch01-b70
          speaker: cyril
          text: This does you a fair treat!
        - id: ch01-b71
          speaker: narrator
          text: >-
            It was wonderful. More than any earlier wish, this felt like true magic. Between the green earth and blue sky, they flapped, glided, and sailed on their great rainbow wings. They flew directly over Rochester, then curved around toward Maidstone. After a while they all became terribly hungry. By a curious chance, hunger struck just as they were flying quite low over an orchard where early plums shone red and ripe among the leaves.
        - id: ch01-b72
          speaker: narrator
          text: >-
            They hovered in one place. It was rather like treading water while swimming, and hawks are very good at it.
        - id: ch01-b73
          speaker: cyril
          text: I know what you're thinking. But stealing is still stealing, even when you have wings.
        - id: ch01-b74
          speaker: jane
          text: >-
            Are you sure? If we have wings, we're birds. Birds break the commandments all the time. People may mind, but nobody scolds the birds or puts them in prison.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Perching in a plum tree was much harder than you might suppose. Their rainbow wings were so large that branches and feathers seemed to be everywhere at once. Somehow all four children found places among the leaves and settled themselves. The early plums were certainly worth the trouble. Each one was wonderfully sweet and full of juice.
        - id: ch01-b76
          speaker: narrator
          text: >-
            They had eaten as many as were good for them before a stout man hurried through the orchard gate, carrying a thick stick and looking every inch the owner. All four children pulled their wings free of the laden branches and flew.
        - id: ch01-b77
          speaker: narrator
          text: >-
            The man stopped short with his mouth open. From a distance, he had seen his branches jerk and shake. He had told himself that the young rascals were stealing his fruit again and hurried out at once. The village boys had taught him in earlier seasons that ripe plums needed watching. But now rainbow wings rose out of the tree instead. He felt certain he had gone quite mad, and he did not enjoy the feeling at all. Anthea looked down. His mouth opened more slowly and stayed that way while green and purple patches spread across his face.
        - id: ch01-b78
          speaker: anthea
          text: Please don't be afraid!
        - id: ch01-b79
          speaker: narrator
          text: >-
            She searched her pocket for a threepenny coin with a hole in it. She had meant to wear it on a ribbon for luck. Hovering around the terrified plum grower, she called to him.
        - id: ch01-b80
          speaker: anthea
          text: >-
            We ate some of your plums. At first we thought it wasn't stealing, but now I'm not certain. Please take this money for them.
        - id: ch01-b81
          speaker: narrator
          text: >-
            Anthea swooped close, slipped the coin into his jacket pocket, and rejoined the others. The farmer dropped heavily onto the grass. He pulled out the coin and bit it.
        - id: ch01-b82
          speaker: farmer
          text: >-
            Well, bless me! This must be what they call a delusion. But this threepenny bit is real enough. From this very day, I'll be a better man. A sight like that could sober a fellow for life. I'm glad it was only wings, though. I'd rather see birds that aren't there and couldn't possibly be there, even if they pretend to talk, than some other things I could mention.
          emotion: surprised
        - id: ch01-b83
          speaker: narrator
          text: >-
            He rose slowly and went indoors. All day he treated his wife so kindly that she felt quite happy.
        - id: ch01-b84
          speaker: farmer_wife
          text: Well now, what can have come over him?
          emotion: surprised
        - id: ch01-b85
          speaker: narrator
          text: >-
            She made herself smart with a blue ribbon at her collar and looked so pretty that he became kinder still. Perhaps the winged children did one good deed that day. If so, it was their only one. Wings are excellent for getting you into trouble. Then again, once trouble finds you, wings are excellent for getting out.
        - id: ch01-b86
          speaker: narrator
          text: >-
            They proved that at the next farm. The children folded their wings as small as they could and approached the door to ask for bread and cheese. The plums had not kept them full for long. A fierce black dog sprang at them.
        - id: ch01-b87
          speaker: narrator
          text: >-
            If the four had been ordinary children without wings, there is no doubt that Robert's brown-stockinged leg would have lost a good mouthful. He was nearest to the dog. But the first growl brought a great flutter from all four pairs of wings, and the children were safely above the yard. The dog could only strain at the end of its chain and stand upright on its hind legs, looking almost as if it were trying to fly after them.
        - id: ch01-b88
          speaker: narrator
          text: >-
            They tried several more farms in search of something to eat. At the farms without dogs, the people took one look at the winged children and were too frightened to do anything except scream. No one offered even a crust. By nearly four o'clock, the children's wings were miserably stiff and aching, and they were desperately hungry. At last they landed on the top of a church tower to rest and decide what to do.
        - id: ch01-b89
          speaker: robert
          text: We can't possibly fly all the way home without dinner or tea.
        - id: ch01-b90
          speaker: cyril
          text: No one will give us dinner. They won't even give us lunch, much less tea.
        - id: ch01-b91
          speaker: anthea
          text: Maybe the clergyman would help. He ought to know all about angels.
        - id: ch01-b92
          speaker: jane
          text: >-
            One look would tell him we aren't angels. Robert has those boots, and Squirrel has that plaid necktie.
        - id: ch01-b93
          speaker: cyril
          text: >-
            If a country refuses to sell you food, you take it. That's what people do in wars. And in any decent story, a good brother would never let his little sisters starve when food was all around them.
        - id: ch01-b94
          speaker: robert
          text: All around us? Where?
        - id: ch01-b95
          speakers: [anthea, jane]
          ensemble: duo
          text: Yes, where is it?
        - id: ch01-b96
          speaker: cyril
          text: >-
            I saw a pantry window on the side of the clergyman's house. Inside there was custard pudding, cold chicken, tongue, pies, and jam. The window is rather high, but we have wings.
        - id: ch01-b97
          speaker: jane
          text: That was clever of you.
        - id: ch01-b98
          speaker: cyril
          text: >-
            Not especially. Any born general, Napoleon or the Duke of Marlborough, would have noticed it.
        - id: ch01-b99
          speaker: anthea
          text: It still feels very wrong.
        - id: ch01-b100
          speaker: cyril
          text: >-
            Nonsense. Sir Philip Sidney said something like, "My need is greater than his," when a soldier wouldn't buy him a drink.
        - id: ch01-b101
          speaker: anthea
          text: We'll put our money together and pay for whatever we take, won't we?
        - id: ch01-b102
          speaker: narrator
          text: >-
            Anthea spoke persuasively and was close to tears. Being terribly hungry and terribly sinful at the same time is very hard to bear.
        - id: ch01-b103
          speaker: cyril
          text: We can leave some of it.
        - id: ch01-b104
          speaker: narrator
          text: >-
            They emptied their pockets onto the lead roof. For a hundred and fifty years, visitors had cut their own initials and their sweethearts' initials into that soft metal with penknives. Altogether, the children found five shillings, sevenpence, and a halfpenny. Even honest Anthea admitted that the whole amount was far too much to pay for four people's dinners. Robert thought eighteen pence ought to do. After discussing it, they agreed that half a crown would be handsome payment.
        - id: ch01-b105
          speaker: narrator
          text: >-
            Anthea happened to have her last school report in her pocket. On its back, she began a letter to the clergyman. First she tore away both her own name and the name of the school. Then she explained that having to fly all day had left them truly starving. They believed taking food could not count as stealing when you were starving to death. They were afraid to knock and ask because he might say no. Of course a clergyman knew all about angels, but one look at the four of them would tell him they were not angels.
        - id: ch01-b106
          speaker: narrator
          text: >-
            Anthea promised they would take only the necessities of life, with no pie or pudding. That would prove starvation, not greed, had made them command his pantry to surrender. They were not highwaymen by profession.
        - id: ch01-b107
          speakers: [cyril, robert, jane]
          ensemble: chorus
          text: Make it shorter!
        - id: ch01-b108
          speaker: narrator
          text: >-
            Anthea quickly added that their intentions were honorable, if only he knew. The half crown proved their sincerity and gratitude. She thanked him for his hospitality and signed the note from all four of them.
        - id: ch01-b109
          speaker: narrator
          text: >-
            They wrapped the coin inside the letter. All four felt certain the clergyman would understand when he read it, or at least as well as anyone without wings could understand.
        - id: ch01-b110
          speaker: cyril
          text: >-
            There is some risk. We'll fly straight down the far side of the tower. Then we'll stay low over the churchyard and slip into the shrubbery. I can't see anyone about, but you never know. The pantry window opens into the bushes and has leaves all around it, just like a window in a story. I'll climb inside and collect the food. Robert and Anthea can take each thing as I pass it out. Jane will keep watch and whistle if she sees anyone coming.
        - id: ch01-b111
          speaker: narrator
          text: Robert started to object.
        - id: ch01-b112
          speaker: cyril
          text: >-
            Be quiet, Robert. Jane can whistle well enough for this. A poor whistle is better anyway. It will sound more like a bird. Come on!
        - id: ch01-b113
          speaker: narrator
          text: >-
            I cannot say that stealing is right. To these four hungry children, however, the plan seemed like a fair business deal. They did not know that half a crown could not buy a barely sliced tongue, a chicken and a half, a loaf of bread, and a soda-water siphon.
        - id: ch01-b114
          speaker: narrator
          text: >-
            No one saw them or got in their way. Cyril led the others safely to the pantry window and handed the necessities out one by one. He believed it was a truly heroic act to leave the jam, apple turnovers, cake, and mixed candied peel. I agree with him. He was also proud of leaving the custard pudding, though there I think he was wrong. Taking the pudding would have meant finding some way to return its china dish with the little pink flowers. No amount of hunger gives anyone the right to steal a pie dish.
        - id: ch01-b115
          speaker: narrator
          text: >-
            The siphon was different. They needed a drink. Its maker's name was printed on it, so they felt sure it would find its way home wherever they left it. If there was time, they would return it themselves. The maker lived in Rochester, which was not far from their route home.
        - id: ch01-b116
          speaker: narrator
          text: >-
            They carried everything back to the tower roof. Cyril had also taken a sheet of kitchen paper from the pantry's top shelf. He spread it beneath the food.
        - id: ch01-b117
          speaker: anthea
          text: I don't believe that paper is necessary for staying alive.
        - id: ch01-b118
          speaker: cyril
          text: >-
            Of course it is. We need somewhere clean to cut the food. Father says people catch diseases from Germans in rainwater. There must be rainwater up here, and when it dries, the Germans stay behind. They'd get into our dinner, and we'd all die of scarlet fever.
        - id: ch01-b119
          speaker: jane
          text: What are Germans?
        - id: ch01-b120
          speaker: cyril
          text: >-
            Tiny wriggling things you see through microscopes. They cause every illness there is. So the paper matters just as much as the bread, meat, and water. Now let's eat. I'm starving!
        - id: ch01-b121
          speaker: narrator
          text: >-
            I do not wish to describe every moment of that picnic on the tower. You can imagine carving a chicken and a tongue with a knife that had only one blade, and even that blade had snapped off halfway down. Somehow, the children managed it. Eating meat with their fingers was greasy and awkward. The pieces of paper they used as plates quickly became spotted, limp, and unpleasant to look at.
        - id: ch01-b122
          speaker: narrator
          text: >-
            The part you may not be able to imagine is the way soda water behaves when someone drinks straight from a completely full siphon. Experience can teach what imagination cannot. If a grown-up ever lends you a siphon, put the tube in your mouth and press the handle very hard and very suddenly. For the fullest possible experience, do the experiment while you are alone. Outdoors is the best place.
        - id: ch01-b123
          speaker: narrator
          text: >-
            However you manage to eat them, tongue, chicken, and fresh bread are very good things. And on a fine hot day, nobody minds being sprayed with a little soda water. So the children enjoyed their dinner enormously. Every one of them ate as much as possible. There were two good reasons. First, they were extremely hungry. Second, tongue, chicken, and new bread really are delicious.
        - id: ch01-b124
          speaker: narrator
          text: >-
            A very late dinner, a larger meal than usual, and hot sunshine on a church tower will soon make anyone sleepy. Anthea, Jane, Cyril, and Robert were no different. When every bite and drop was gone, their eyes grew heavy. Anthea was sleepiest of all because she had risen so early.
        - id: ch01-b125
          speaker: narrator
          text: >-
            One after another, they stopped talking and leaned back. Within fifteen minutes, all four had curled up beneath their wide, soft wings and fallen fast asleep.
        - id: ch01-b126
          speaker: narrator
          text: >-
            The sun sank slowly in the west. I must say it was in the west because books always do, in case a careless person imagines that the sun might set in the east. In truth, it was not exactly west, but that is close enough. So the sun went slowly down while the children slept warmly and happily on. Their great soft wings were folded around them. Wings make cozier blankets than even the finest quilt filled with down.
        - id: ch01-b127
          speaker: narrator
          text: >-
            The long shadow of the church tower stretched across the churchyard. It reached across the vicarage too, and then across the field beyond. Presently there were no shadows left at all. The sun had set, and the wish had ended with the day. Every splendid rainbow wing vanished. Still the four children slept on.
        - id: ch01-b128
          speaker: narrator
          text: >-
            Not for long. Twilight is beautiful, but it is cold. However deeply you sleep, you soon wake if your brother or sister gets up first and pulls away your blankets. The four children shivered and opened their eyes without wings. They were still on top of the church tower in the dim twilight. Blue stars appeared overhead, first one or two, then ten, then twenty. Home was miles away. They had only three shillings and three halfpence in their pockets, and a questionable act involving the necessities of life to explain if anyone caught them holding the soda-water siphon.
        - id: ch01-b129
          speaker: narrator
          text: They stared at one another. Cyril picked up the siphon and spoke first.
        - id: ch01-b130
          speaker: cyril
          text: >-
            We'd better go down and get rid of this horrible thing. It's dark enough to leave it on the clergyman's doorstep. Come on.
        - id: ch01-b131
          speaker: narrator
          text: >-
            A little turret stood at one corner of the tower, with a door in its side. The children had noticed it while they ate, but they had not explored it, though you probably would have done so in their place. When you have wings and can explore the whole sky, doors hardly seem worth exploring. Now that the wings had vanished, the children turned toward that ordinary little door.
        - id: ch01-b132
          speaker: cyril
          text: This must be the way down.
        - id: ch01-b133
          speaker: narrator
          text: >-
            It was. But the door was locked from the inside. The world grew darker and darker. They were miles from home, trapped on the tower, and the soda-water siphon was still with them.
        - id: ch01-b134
          speaker: narrator
          text: >-
            I will not tell you whether anyone cried, or how many, or who. You will be much better occupied deciding what you would have done in their place.
