  chapters:
    - id: ch01
      title: GROWN UP
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Cyril had once pointed out that ordinary life was full of moments when a wish would be useful. That thought filled his mind when he happened to wake early, two mornings after Robert had wished himself bigger than the baker's boy and had truly become bigger. The whole day in between had been taken up with one long task. They had to bring the governess-cart all the way home from Benenhurst.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Cyril dressed in a hurry. He skipped his bath because a tin bath made too much noise, and he did not want to wake Robert. Then he slipped away alone, just as Anthea had once done, and ran through the dewy morning to the sand-pit. He dug the Psammead out with great care and began by asking whether Robert's tears had left any bad effects. The Psammead happened to be in a good temper and answered politely.
        - id: ch01-b03
          speaker: psammead
          text: >-
            Now then, what can I do for you? I suppose you've come this early because you want something all for yourself, without your brothers and sisters knowing. Take my advice for once. Wish for a nice fat Megatherium, and let that settle it.
        - id: ch01-b04
          speaker: cyril
          text: >-
            No, thank you. Not today. What I meant to ask was this. When you're playing at something, you keep thinking of things you wish you had, don't you?
        - id: ch01-b05
          speaker: psammead
          text: I hardly ever play.
        - id: ch01-b06
          speaker: cyril
          text: >-
            You know what I mean. Could we have our wish whenever we think of it, wherever we happen to be? Then we wouldn't have to keep coming here and bothering you.
        - id: ch01-b07
          speaker: narrator
          text: Cyril added that last part rather craftily.
        - id: ch01-b08
          speaker: psammead
          text: >-
            You'll only wish for something you don't really want, just as you did with the castle. People have been like this ever since they stopped eating wholesome food. Still, have it your own way. Good-bye.
        - id: ch01-b09
          speaker: narrator
          text: The Psammead stretched its brown arms and yawned.
        - id: ch01-b10
          speaker: cyril
          text: Good-bye.
        - id: ch01-b11
          speaker: psammead
          text: >-
            Wait, I'll tell you something. I'm getting tired of the lot of you. You have no more sense than a heap of oysters. Off you go!
        - id: ch01-b12
          speaker: narrator
          text: Its long snail eyes shot out as it spoke, and Cyril went.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Later that morning, the Lamb slipped Cyril's watch from his pocket while Cyril was not looking. Cooing and clucking with naughty delight, he opened the case and dug in the garden with it as if it were a spade. Even a soaking in the washbasin could not clean the earth from the works or make the watch tick again. In the heat of the moment, Cyril had said several things he did not mean. By the time they set out for the woods, he was calmer and had even agreed to carry the Lamb for part of the way.
        - id: ch01-b14
          speaker: cyril
          text: Babies take an awfully long time to stop being babies.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Cyril had persuaded the others not to wish again until they truly wanted something. For now, they meant to gather nuts. All five sat on mossy grass beneath a sweet chestnut tree. The Lamb pulled up fat handfuls of moss while Cyril stared gloomily at his ruined watch.
        - id: ch01-b16
          speaker: anthea
          text: You are growing, aren't you, precious?
        - id: ch01-b17
          speaker: lamb
          text: Me grow. Me big boy. Have guns and mouses, and... and...
        - id: ch01-b18
          speaker: narrator
          text: >-
            His imagination, or perhaps his supply of words, stopped there. Still, it was the longest speech he had ever made, and everyone loved it. Even Cyril forgot his watch for a moment. He tipped the Lamb over and rolled him in the moss while the little boy squealed with delight.
        - id: ch01-b19
          speaker: anthea
          text: I suppose he will be grown up one day.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Anthea gazed dreamily at the patches of blue sky showing between the long, straight chestnut leaves. At that very moment, the Lamb was still wrestling happily with Cyril. He pushed one stout, well-shod little foot against his brother's chest. There was a sharp crack. The innocent Lamb had broken the glass of Father's second-best Waterbury watch, which Cyril had borrowed without asking.
        - id: ch01-b21
          speaker: cyril
          text: >-
            Grown up one day! I dare say he will, when nobody wants him to. I wish to goodness he would...
        - id: ch01-b22
          speaker: narrator
          text: Cyril dropped the Lamb sharply onto the grass.
        - id: ch01-b23
          speakers: [anthea, cyril]
          ensemble: duo
          text: Oh, take care! Grow up now!
        - id: ch01-b24
          speaker: narrator
          text: >-
            Anthea's warning and the end of Cyril's wish came out together, but they were too late. The faithful Psammead kept its promise. Before the horrified eyes of the other children, the Lamb began to grow up, suddenly and violently.
        - id: ch01-b25
          speaker: narrator
          text: >-
            This change was slower than their other wishes. The baby's face went first. It grew larger and thinner. Lines appeared on his forehead. His eyes darkened and sank deeper. His mouth became long and narrow. Worst of all, a small dark moustache grew on the lip of a two-year-old who still wore a linen smock and white openwork socks.
        - id: ch01-b26
          speaker: anthea
          text: >-
            Oh, I wish it would stop! I wish it would stop! Boys, wish too!
          emotion: fearful
        - id: ch01-b27
          speaker: narrator
          text: >-
            They all wished as hard as they could. The sight would have frightened even the most heartless person. They wished until they grew dizzy and nearly lost consciousness, but it did no good. The wood seemed to whirl around them. When it grew still and their dazzled eyes could focus again, they stared at a very proper young man in flannels and a straw hat. He had the same little black moustache they had just watched growing on the baby's lip. There could be no doubt about it. This was their own Lamb, grown up. It was a terrible moment.
        - id: ch01-b28
          speaker: narrator
          text: >-
            The grown-up Lamb walked gracefully over the moss, leaned against the chestnut trunk, and tipped his hat over his eyes. He seemed tired and ready to sleep. The small, troublesome, beloved Lamb often fell asleep at odd moments in unlikely places. But did this young man in grey flannel and a pale green tie still have the baby's mind, or had his mind grown with his body?
        - id: ch01-b29
          speaker: narrator
          text: >-
            The four others hurried a few yards away and held a council among the yellowing bracken.
        - id: ch01-b30
          speaker: anthea
          text: >-
            Either way, it will be dreadful. If his mind has grown up, he won't let us look after him. If he's still a baby inside, how will we make him do anything? And it will be dinner-time before we know it.
        - id: ch01-b31
          speaker: jane
          text: And we haven't found any nuts.
        - id: ch01-b32
          speaker: robert
          text: >-
            Never mind the nuts. Dinner matters. I hardly had any yesterday. Couldn't we tie him to the tree, go home for dinner, and come back afterward?
        - id: ch01-b33
          speaker: cyril
          text: >-
            As if we'd get any dinner if we came home without the Lamb! It will be just as bad if we bring him home looking like that. Yes, I know I caused it. Don't keep reminding me. I'm a beast and don't deserve to live. Let that be settled. What are we going to do?
        - id: ch01-b34
          speaker: robert
          text: >-
            Let's wake him and take him to Rochester or Maidstone. We could get something to eat at a pastrycook's.
        - id: ch01-b35
          speaker: cyril
          text: >-
            Take him? You try it. I know this is my fault, but you'll have your hands full if you think you can take that young man anywhere. The Lamb was always spoiled. Now he's grown up, he'll be a perfect demon. I can tell by his mouth.
        - id: ch01-b36
          speaker: robert
          text: >-
            Then wake him and see what he wants to do. Perhaps he'll take us to Maidstone and pay for us. Those wonderful trousers ought to have plenty of money in the pockets. We have to eat somehow.
        - id: ch01-b37
          speaker: narrator
          text: >-
            They drew lots with little pieces of bracken. Jane lost, so she had to wake the grown-up Lamb. She gently tickled his nose with a sprig of wild honeysuckle.
        - id: ch01-b38
          speaker: lamb
          text: Bother these flies! Bother these flies!
        - id: ch01-b39
          speaker: narrator
          text: He opened his eyes.
        - id: ch01-b40
          speaker: lamb
          text: >-
            Hallo, kiddies. Are you still here? What's the time? You'll be late for your food.
        - id: ch01-b41
          speaker: robert
          text: We know we will.
        - id: ch01-b42
          speaker: lamb
          text: Then hurry home.
        - id: ch01-b43
          speaker: jane
          text: But what will you do for food?
        - id: ch01-b44
          speaker: lamb
          text: >-
            How far is the station? I rather think I'll go up to town and have lunch at my club.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Blank misery settled over the other four like a heavy covering. The Lamb meant to go to London alone, with no one to watch him, and eat lunch at a club. He might even stay there for tea. Then sunset could find him surrounded by all the glittering comfort of club-land. In an instant, a helpless, cross, sleepy baby would be alone among unsympathetic waiters. He would sit deep in a club armchair and cry miserably for his Panty. Anthea could see the whole picture in her mind, and it nearly made her cry.
        - id: ch01-b46
          speaker: anthea
          text: Oh no, Lamb dear, you mustn't!
          emotion: fearful
        - id: ch01-b47
          speaker: narrator
          text: The grown-up Lamb frowned.
        - id: ch01-b48
          speaker: lamb
          text: >-
            My dear Anthea, how many times must I tell you? My name is Hilary, or St Maur, or Devereux. You little ones may use any of my baptismal names, but you are not to call me Lamb. That belongs to my foolish childhood, which is long past.
        - id: ch01-b49
          speaker: narrator
          text: >-
            This was dreadful. He considered himself their elder brother now. Of course, since he was grown up and they were not, that was exactly what he seemed to be. Anthea and Robert whispered together and reached that unhappy conclusion. Yet the wishes they dealt with almost every day had made all the children wiser than their years. They knew they would have to manage this new elder brother carefully.
        - id: ch01-b50
          speaker: anthea
          text: >-
            Dear Hilary, Father did not want you to go to London. He wouldn't want us left here alone, with nobody to look after us.
        - id: ch01-b51
          speaker: narrator
          text: >-
            The others nearly choked when she called him Hilary. Inside, Anthea told herself what a deceitful creature she was.
        - id: ch01-b52
          speaker: cyril
          text: >-
            If you're our elder brother, why don't you act like one? Take us to Maidstone, give us a splendid meal, and then we can go on the river.
        - id: ch01-b53
          speaker: lamb
          text: >-
            I am deeply grateful for the suggestion, but I would rather be alone. Go home to your dinner. I may come back around tea-time, or perhaps not until after you're in bed.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Their beds! The four exchanged miserable looks. If they returned without the Lamb, none of them would be going comfortably to bed.
        - id: ch01-b55
          speaker: jane
          text: Mother made us promise not to let you out of our sight when we took you out.
        - id: ch01-b56
          speaker: narrator
          text: Jane spoke before the others could stop her. The grown-up Lamb put his hands in his pockets and looked down at her.
        - id: ch01-b57
          speaker: lamb
          text: >-
            Jane, little girls are meant to be seen, not heard. You children must learn not to be a nuisance. Run home now. If you're good, perhaps I'll give you a penny each tomorrow.
        - id: ch01-b58
          speaker: cyril
          text: >-
            Listen, old man. Where are you going? You could let Bobs and me come along, even if you don't want the girls.
        - id: ch01-b59
          speaker: narrator
          text: >-
            Cyril used his best man-to-man voice. It was rather noble of him, because he never liked being seen in public with the Lamb, and at sunset this grown man would be a baby again. Still, the man-to-man voice worked.
        - id: ch01-b60
          speaker: lamb
          text: >-
            I thought I'd ride over to Maidstone. I'll lunch at the Crown and perhaps take a boat on the river. But I can't carry all of you on one bicycle, can I? Be good children and run home.
        - id: ch01-b61
          speaker: narrator
          text: >-
            He spoke airily and fingered his little black moustache. The situation was desperate. Robert and Cyril exchanged a look of complete despair. Then Anthea pulled a pin from her waistband. Taking it out left a wide, untidy gap between her skirt and bodice, but that could not be helped. She passed the pin secretly to Robert and made the darkest, most meaningful face she could. Robert understood her plan at once.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Robert slipped out to the road. A beautiful new free-wheel bicycle stood there. Naturally, a grown-up Lamb had to own a bicycle. Wanting one had always been one of Robert's own reasons for wishing he were grown up. He quickly drove the pin into the tyres, eleven times at the back and seven at the front. He meant to make twenty-two holes, but rustling hazel leaves warned him that the others were coming. He pressed a hand on each wheel and heard the last air whistle from eighteen neat punctures.
        - id: ch01-b63
          speaker: robert
          text: Your bicycle tyre has gone flat.
        - id: ch01-b64
          speaker: narrator
          text: Robert wondered how he had learned to deceive people so quickly.
        - id: ch01-b65
          speaker: cyril
          text: It certainly has.
        - id: ch01-b66
          speaker: anthea
          text: There's a puncture. See? Here's the thorn.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Anthea bent down and stood up holding a thorn she had prepared. The grown-up Lamb fixed on his pump and filled the tyre, but all those holes soon made themselves known.
        - id: ch01-b68
          speaker: lamb
          text: Is there a cottage nearby where I could get a pail of water?
        - id: ch01-b69
          speaker: narrator
          text: >-
            There was a cottage nearby. They used its pail of water to find the punctures, and soon all eighteen holes made themselves known. It seemed especially fortunate that the cottage also served tea to cyclists. The Lamb and his brothers sat down to a strange little meal of tea and ham. Robert paid with some of the fifteen shillings he had earned while he was a giant, because the grown-up Lamb had no money in his fine pockets after all. That was a great disappointment to the others. Still, even the most grown-up people sometimes find themselves without money. At least Robert got enough to eat, and that counted for something.
        - id: ch01-b70
          speaker: narrator
          text: >-
            The four unhappy children quietly took turns trying to persuade the Lamb, or St Maur, to stay in the woods. By the time he finished repairing the eighteenth puncture, very little of the day remained. He sighed with relief, looked up, and suddenly straightened his tie.
        - id: ch01-b71
          speaker: lamb
          text: >-
            There's a lady coming. For goodness' sake, get out of sight. Go home, hide, disappear somehow! I can't let her see me with a pack of filthy children.
        - id: ch01-b72
          speaker: narrator
          text: >-
            They really were dirty, because the Lamb, while still a baby that morning, had scattered plenty of garden soil over them. His grown-up voice sounded so commanding that they obeyed. They retreated to the back garden and left him in his grey suit and little moustache to meet the young lady wheeling a bicycle up the front path.
        - id: ch01-b73
          speaker: narrator
          text: >-
            The woman of the cottage came out to meet the young lady, who spoke to her. The Lamb lifted his hat as the lady passed him. Hidden in the back garden beside the pig-pail, the children stretched their heads around the corner and listened with all their might. They could not make out what the young lady said. Robert insisted that listening was perfectly fair while the wretched Lamb was in this condition. When the Lamb answered in a lazy voice loaded with politeness, they heard every word clearly.
        - id: ch01-b74
          speaker: lamb
          text: >-
            A puncture? May I help you? If you would allow me...
        - id: ch01-b75
          speaker: narrator
          text: >-
            A burst of laughter was smothered behind the pig-pail. The Lamb glanced angrily toward it.
        - id: ch01-b76
          speaker: young_lady
          text: That's very kind of you.
        - id: ch01-b77
          speaker: narrator
          text: >-
            She looked rather shy, though the boys thought she seemed sensible enough.
        - id: ch01-b78
          speaker: cyril
          text: >-
            You'd think he'd done enough bicycle-mending for one day. If only she knew he's really nothing but a fretful, silly little baby!
        - id: ch01-b79
          speaker: narrator
          text: Cyril whispered from behind the pig-pail.
        - id: ch01-b80
          speaker: anthea
          text: >-
            He isn't! He's a darling when people leave him alone. Whatever foolish people may turn him into, he's still our own precious Lamb. Isn't he, Pussy?
          emotion: angry
        - id: ch01-b81
          speaker: narrator
          text: Jane gave a doubtful sort of agreement.
        - id: ch01-b82
          speaker: narrator
          text: >-
            The Lamb, whom one really ought to call St Maur now, examined the lady's bicycle and talked to her in the most grown-up manner. Nobody watching or listening would have guessed that very morning he had been a round little two-year-old, breaking other people's Waterbury watches. He repaired the puncture, then pulled out a gold watch to look at the time. Every child behind the pig-pail exclaimed at once. It seemed terribly unfair. The baby had ruined two cheap but honest watches that very morning, yet Cyril's foolish wish had given his grown-up self a real gold watch, complete with a chain and seals.
        - id: ch01-b83
          speaker: narrator
          text: >-
            Hilary, as one might now call him, gave his brothers and sisters a withering look. He already seemed quite friendly with the young lady.
        - id: ch01-b84
          speaker: lamb
          text: >-
            If you permit me, I will ride with you as far as the Cross Roads. It's growing late, and there are tramps around.
        - id: ch01-b85
          speaker: narrator
          text: >-
            No one ever learned what answer the young lady meant to give. The moment Anthea heard the offer, she rushed out and knocked against the pig-pail. Murky water poured over the edge. She grabbed the Lamb by the arm. The other three followed, and suddenly all four dirty children stood in full view.
        - id: ch01-b86
          speaker: anthea
          text: Don't let him go with you! He isn't fit to go anywhere with anyone!
        - id: ch01-b87
          speaker: narrator
          text: Anthea spoke with desperate earnestness.
        - id: ch01-b88
          speaker: lamb
          text: >-
            Go away, little girl! Go home this instant!
          emotion: angry
        - id: ch01-b89
          speaker: anthea
          text: >-
            You really shouldn't have anything to do with him. He doesn't know who he is. He isn't at all what you think.
        - id: ch01-b90
          speaker: narrator
          text: >-
            Anthea had become reckless. The grown-up Lamb tried to push her aside, but the others supported her, and she stood like a rock.
        - id: ch01-b91
          speaker: young_lady
          text: What do you mean?
        - id: ch01-b92
          speaker: anthea
          text: >-
            Let him ride with you, and you'll find out soon enough! How would you like it if a helpless little baby suddenly appeared beside you, racing downhill on a bicycle it couldn't control, with its feet in the air?
        - id: ch01-b93
          speaker: narrator
          text: The young lady turned rather pale.
        - id: ch01-b94
          speaker: young_lady
          text: Who are these very dirty children?
        - id: ch01-b95
          speaker: lamb
          text: I have no idea.
        - id: ch01-b96
          speaker: narrator
          text: He lied miserably.
        - id: ch01-b97
          speaker: jane
          text: >-
            Oh, Lamb, how can you say that? You know you're our own little baby brother, and we love you dearly. We're his older brothers and sisters, and we have to look after him. We must get him home before sunset, or I don't know what will happen to us. He's under a kind of spell. He's enchanted, you see!
        - id: ch01-b98
          speaker: narrator
          text: >-
            Jane turned to the young lady as she poured out the explanation. The lady's hands were trembling now, and she slowly turned her bicycle toward the gate. Again and again the Lamb tried to stop Jane from talking. He could not get free. Robert clung to one of his legs and Cyril held the other, so the grown-up Lamb had no chance to offer any proper explanation of his own.
        - id: ch01-b99
          speaker: narrator
          text: >-
            The lady hurried away on her bicycle as fast as she could. That evening, she astonished all her relatives at dinner with the tale of her narrow escape from a dangerous family of lunatics. She said the little girl's eyes had looked quite mad and wondered how such a child could possibly have been allowed to roam free.
        - id: ch01-b100
          speaker: narrator
          text: When the bicycle had flown down the road, Cyril spoke gravely.
        - id: ch01-b101
          speaker: cyril
          text: >-
            Hilary, old chap, you must have had sunstroke or something. Think of what you've been saying to that lady. If we repeated it tomorrow morning, when you're yourself again, you wouldn't understand us, much less believe us. Trust me and come home. If you're no better tomorrow, we'll ask the milkman to send the doctor.
        - id: ch01-b102
          speaker: narrator
          text: >-
            The poor grown-up Lamb seemed too bewildered now to fight them.
        - id: ch01-b103
          speaker: lamb
          text: >-
            Since all of you seem as mad as a whole company of hatters, I suppose I had better take you home. But don't imagine I'll forget this. I will have plenty to say to every one of you tomorrow morning.
        - id: ch01-b104
          speaker: anthea
          text: >-
            Yes, you will, my Lamb, but it won't be anything like what you expect.
        - id: ch01-b105
          speaker: narrator
          text: >-
            Anthea said it under her breath. In her heart she could hear the baby's sweet, soft, loving voice, so different from the affected voice of this dreadful grown-up Lamb. She heard him saying that he loved Panty and wanted to come to his own Panty.
        - id: ch01-b106
          speaker: anthea
          text: >-
            Oh, please, let's go home. You can say anything you like tomorrow morning, if you can.
        - id: ch01-b107
          speaker: narrator
          text: >-
            They made a gloomy procession home through the soft evening. While Anthea had been talking, Robert had quietly put the pin to work on the bicycle tyre again. The Lamb, whom they still had to call St Maur or Devereux or Hilary, finally seemed to have had enough of repairing punctures for one day. He did not try to mend this one. He wheeled the bicycle beside him all the way.
        - id: ch01-b108
          speaker: narrator
          text: >-
            The sun was just about to set when they reached the White House. The four older children longed to wait in the lane for the last of the sun to disappear. Then the grown-up Lamb, with all those grand baptismal names, would become their own dear, troublesome baby brother before anyone saw him. But his grown-up self would not linger. He insisted on going straight ahead, and Martha met the party in the front garden.
        - id: ch01-b109
          speaker: narrator
          text: >-
            You may remember the special favor the Psammead had granted. The servants in the house would never notice any change caused by the children's wishes. So Martha saw the ordinary group coming home. To her, the baby Lamb was trotting beside Anthea on his fat little legs. She had been desperately worried about him all afternoon. The children still saw the grown-up Lamb in his neat clothes and moustache.
        - id: ch01-b110
          speaker: martha
          text: Come to your own Martha, then, my precious little pet!
        - id: ch01-b111
          speaker: narrator
          text: >-
            Martha rushed at him and caught him in her arms. The grown-up Lamb struggled furiously. His face showed the deepest horror and annoyance, but Martha was stronger than he was. The children saw a grown young man fighting to get away while Martha saw only the baby she had worried about all afternoon. She lifted him firmly and carried him toward the house.
        - id: ch01-b112
          speaker: narrator
          text: >-
            None of the children ever forgot that sight. A neat young man in a grey flannel suit, a pale green tie, and a little black moustache fought helplessly in Martha's sturdy arms. Luckily, he was slim and not very tall. She carried him toward the door as easily as if he were the baby she saw. All the while, she begged him to be a good boy now and come and have his nice bread and milk.
        - id: ch01-b113
          speaker: narrator
          text: >-
            Fortunately, just as they reached the doorstep, the sun went down. At that same instant, the bicycle vanished. The young man in flannels and the little black moustache vanished too. Now everyone could see Martha carrying the real, living, darling, sleepy, two-year-old Lamb into the house. The nameless grown-up Lamb was gone forever.
        - id: ch01-b114
          speaker: cyril
          text: >-
            Forever, because the moment he's old enough to be bullied, we'll have to start bullying him for his own good. Then he won't grow up to be like that.
        - id: ch01-b115
          speaker: anthea
          text: You will not bully him. Not if I can prevent it.
        - id: ch01-b116
          speaker: jane
          text: We ought to tame him with kindness.
        - id: ch01-b117
          speaker: robert
          text: >-
            If he grows up at the usual speed, we'll have plenty of time to correct him along the way. Today was dreadful because he grew up all at once. We never had a chance to improve him.
        - id: ch01-b118
          speaker: anthea
          text: He doesn't need improving.
        - id: ch01-b119
          speaker: narrator
          text: >-
            Then the Lamb's voice came cooing through the open door, just as Anthea had heard it in her heart that afternoon.
        - id: ch01-b120
          speaker: lamb
          text: Me loves Panty. Wants to come to own Panty!
