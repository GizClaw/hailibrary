audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带一点含蓄的幽默
        timbre: 温暖清亮
        pace: 从容而有变化
        pitch: 中音
    cyril:
      display_name: 西里尔
      tts:
        delivery: 自信爽快，像个爱拿主意的大孩子
        timbre: 明亮结实
        pace: 稍快
        pitch: 中高音
    anthea:
      display_name: 安西娅
      tts:
        delivery: 认真体贴，着急时干脆利落
        timbre: 清澈柔韧
        pace: 中速
        pitch: 中高音
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，偶尔一本正经
        timbre: 清亮饱满
        pace: 中速
        pitch: 中音
    jane:
      display_name: 简
      tts:
        delivery: 天真敏感，想象丰富
        timbre: 轻柔明亮
        pace: 中速
        pitch: 高音
    martha:
      display_name: 玛莎
      tts:
        delivery: 爽利泼辣，护着孩子时毫不退让
        timbre: 响亮厚实
        pace: 稍快
        pitch: 中音
    psammead:
      display_name: 赛米阿德
      tts:
        delivery: 古怪尖刻，厌烦中带着老资格的傲慢
        timbre: 干涩沙哑
        pace: 中速
        pitch: 中高音
    lamb:
      display_name: 小羊羔
      tts:
        delivery: 成年时懒洋洋又自命不凡，幼小时甜软依恋
        timbre: 清朗偏薄
        pace: 从容
        pitch: 中音
    young_lady:
      display_name: 年轻女士
      tts:
        delivery: 文雅拘谨，受惊后急促不安
        timbre: 柔和清脆
        pace: 中速
        pitch: 中高音
  chapters:
    - id: ch01
      title: 清晨的约定
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 西里尔说过，平常日子里，到处都有非许愿不可的时候。罗伯特许愿长得比面包店伙计还高，事情果真成了。起初说是第二天清早，不对，其实是隔了一天的那个清早。西里尔醒得特别早，满脑子想的就是这句话。至于夹在中间的那一天，孩子们全花在把家庭女教师车从贝嫩赫斯特弄回家上了。
        - id: ch01-b02
          speaker: narrator
          text: 他匆匆穿好衣服，连澡也没洗。铁皮浴盆一响，准会吵醒罗伯特。他独自溜出门，踩着露水跑到沙坑，像安西娅从前那样，小心又客气地挖出赛米阿德。他先问赛米阿德，前天被罗伯特的眼泪沾过以后，身上还有没有不舒服。赛米阿德这天心情不错，回答得也很客气。
        - id: ch01-b03
          speaker: psammead
          text: 那么，你想让我替你做什么？我猜你这么早独自跑来，是想背着兄弟姐妹给自己要点儿东西。听我一句真心为你好的劝吧，要一头肥壮的巨地懒，就这么办。
        - id: ch01-b04
          speaker: cyril
          text: 谢谢，今天就不用了。我其实是想问，你知道大家玩游戏的时候，常会忽然想要这个、想要那个，对吧？
        - id: ch01-b05
          speaker: psammead
          text: 我可很少玩游戏。
        - id: ch01-b06
          speaker: cyril
          text: 你明白我的意思。往后我们一想到愿望，不管人在哪里，你能不能马上让它成真？这样我们也省得再来打搅你。
        - id: ch01-b07
          speaker: narrator
          text: 最后这句话，是狡猾的西里尔特意添上的。赛米阿德伸开棕色胳膊，打了个哈欠。
        - id: ch01-b08
          speaker: psammead
          text: 到头来，你们准会许来根本不想要的东西，就像那座城堡。自从人不再吃真正有益健康的食物，事情总是这样。不过随你们吧。再见。
        - id: ch01-b09
          speaker: cyril
          text: 再见。
        - id: ch01-b10
          speaker: narrator
          text: 赛米阿德忽然又伸出那双蜗牛似的长眼睛。
        - id: ch01-b11
          speaker: psammead
          text: 对了，我已经受够你们所有人了。你们的脑子还不如一群牡蛎。快走吧！
        - id: ch01-b12
          speaker: narrator
          text: 西里尔便走了。
    - id: ch02
      title: 小羊羔一下子长大了
      blocks:
        - id: ch02-b01
          speaker: lamb
          text: 小娃娃怎么要当这么久的小娃娃！
        - id: ch02-b02
          speaker: narrator
          text: 西里尔一没留神，小羊羔就从他口袋里掏出了怀表。他兴奋地咿咿呀呀，打开表盖，把整块表当花园铲子使。后来就算泡进洗脸盆，机芯里的泥也没洗净，更没能叫那块表重新走起来。西里尔一时气急，说了好些话，后来总算平静下来，还答应抱小羊羔走一段去树林的路。他也说服大家接受自己的计划，在真正想要什么以前，谁也不许再许愿。
        - id: ch02-b03
          speaker: narrator
          text: 眼下，去树林捡坚果似乎正合适。五个人坐到一棵甜栗树下，草地上长满青苔。小羊羔用胖乎乎的小手一把把揪青苔，西里尔却阴沉地盯着怀表的残骸。
        - id: ch02-b04
          speaker: anthea
          text: 他真的在长呢，是不是呀，小宝贝？
        - id: ch02-b05
          speaker: lamb
          text: 我长。我长大男孩，有枪枪，还有老鼠鼠，还有……还有……
          emotion: happy
        - id: ch02-b06
          speaker: narrator
          text: 不知道是想不出东西了，还是会说的词用完了，他停在了那里。可这已经是小羊羔有生以来最长的一句话，大家听得心花怒放，连西里尔也不例外。他把小羊羔扑倒，两个人在青苔上滚来滚去，小家伙高兴得尖叫不停。
        - id: ch02-b07
          speaker: anthea
          text: 我想，他总有一天会长大成人。
        - id: ch02-b08
          speaker: narrator
          text: 安西娅出神地望着蓝天。天空正从笔直修长的栗树叶之间露出来。偏偏这时，小羊羔还在快活地跟西里尔扭成一团，一只穿着结实小鞋的脚正好蹬上哥哥胸口。啪的一声，爸爸那块次好的沃特伯里怀表，玻璃也被他踢碎了。西里尔没经许可，就把那块表借了出来。
        - id: ch02-b09
          speaker: cyril
          text: 总有一天才长大！等到谁也不盼着你长大的时候，你大概倒会长了。老天保佑，我真希望你……
          emotion: angry
        - id: ch02-b10
          speaker: anthea
          text: 啊，小心！
          emotion: fearful
        - id: ch02-b11
          speaker: narrator
          text: 太迟了。安西娅的叫声和西里尔的话，像歌词正好配上曲调，同时出了口。
        - id: ch02-b12
          speaker: cyril
          text: 现在就长大！
        - id: ch02-b13
          speaker: narrator
          text: 忠实的赛米阿德兑现了清晨的承诺。哥哥姐姐惊骇地看着小羊羔突然长大，而且这回不是一眨眼就变完。变化来得又猛又可怕。他的脸先瘦下来，又越拉越长。额头添了纹路，眼窝渐渐变深，眼睛的颜色也暗了。嘴巴变得又长又薄。可最吓人的还在后面。那个两岁娃娃身上还穿着亚麻罩衫，脚上还套着白色镂空袜，上唇却冒出了一撮黑黑的小胡子。
        - id: ch02-b14
          speaker: anthea
          text: 啊，别再变了！求你别再变了！你们男孩子也赶快许愿呀！
          emotion: fearful
        - id: ch02-b15
          speaker: narrator
          text: 这样的景象，就算铁石心肠的人看了也会慌。孩子们拼命许愿，用力得头昏眼花，差点儿失去知觉，可什么也没用。等树林不再围着他们打转，几双发晕的眼睛一下子全盯住了眼前的人。
        - id: ch02-b16
          speaker: narrator
          text: 青苔上坐着一个体面的年轻人，穿法兰绒衣裤，戴着草帽。唇上那撮黑胡子，正是他们亲眼看着从宝宝脸上长出来的。这是小羊羔，已经成人的小羊羔，是他们自己的小羊羔。那一刻实在可怕。他姿态优雅地走过青苔，靠着甜栗树坐好，把草帽斜扣到眼睛上。他显然累了，马上就要睡着。
        - id: ch02-b17
          speaker: narrator
          text: 原来那个淘气、麻烦，又惹人疼爱的小羊羔，本来就总是不挑时间、不挑地方地睡着。如今这个穿灰色法兰绒套装、系浅绿色领带的新小羊羔，还是不是从前的他？身体长大以后，他的心思是不是也一起长大了？
    - id: ch03
      title: 午饭和自行车
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 另外四个孩子躲进几码外渐渐发黄的蕨丛，匆匆开了个会。他们争得很热烈，谈的正是这个问题。
        - id: ch03-b02
          speaker: anthea
          text: 不管是哪一种都很可怕。要是他的想法也长大了，他准不肯让我们照管。可要是心里还是个小娃娃，我们怎么才能叫他乖乖听话？再过一会儿就该吃午饭了……
        - id: ch03-b03
          speaker: jane
          text: 可我们连一颗坚果也没捡到。
        - id: ch03-b04
          speaker: robert
          text: 还管什么坚果！午饭可不能不管。昨天我连一半都没吃饱。要不把他绑在树上，我们回家吃完午饭再来？
        - id: ch03-b05
          speaker: cyril
          text: 我们把小羊羔丢在这儿，回家还吃得到午饭吗？就算带他回去，照他现在这个样子，结果也一样。对，祸是我闯的，不用再数落了！我知道自己是个畜生，根本不配活着。就算这事已经说定了，别再提。现在得想想究竟怎么办。
        - id: ch03-b06
          speaker: robert
          text: 把他叫醒，带去罗切斯特或者梅德斯通，在点心铺买些吃的吧。
        - id: ch03-b07
          speaker: cyril
          text: 带他？好啊，你去带！我没否认这是我的错。可你想带那个青年去什么地方，非吃足苦头不可。小羊羔小时候就给宠坏了，现在一长大，简直成了魔鬼。我一看他的嘴就知道。
        - id: ch03-b08
          speaker: robert
          text: 那就叫醒他，问问他自己想做什么。说不定他会带我们去梅德斯通，请我们大吃一顿。那条讲究裤子的口袋里，怎么也该有不少钱。不管怎样，我们非吃午饭不可。
        - id: ch03-b09
          speaker: narrator
          text: 孩子们折下几小段蕨叶抽签。叫醒成年小羊羔的差事，落到了简头上。她拿一根野忍冬枝条，轻轻搔他的鼻子。他接连说了两遍讨厌的苍蝇，这才睁开眼。
        - id: ch03-b10
          speaker: lamb
          text: 嗨，小鬼头们！怎么还在这儿？几点啦？你们回去吃饭可要迟到了。
        - id: ch03-b11
          speaker: robert
          text: 我们知道。
        - id: ch03-b12
          speaker: lamb
          text: 那就赶快回家。
        - id: ch03-b13
          speaker: jane
          text: 可你吃什么呀？
        - id: ch03-b14
          speaker: lamb
          text: 火车站离这里多远？我有点儿想坐车进城，到俱乐部吃午餐。
        - id: ch03-b15
          speaker: narrator
          text: 四个孩子一下子掉进了惨淡的绝望里，仿佛有块黑布兜头罩下来。小羊羔竟想没人照管，独自进城，在俱乐部吃午餐！说不定他还会在那里喝下午茶。说不定到了日落时分，他仍待在俱乐部区那片耀眼奢华的环境里。然后，一个无助、暴躁、困得要命的小娃娃，会孤零零陷在俱乐部的扶手椅深处，身边只有一群毫不同情他的侍者。他会凄凄惨惨地哭喊安西娅。安西娅想到这幅情景，几乎掉下泪来。
        - id: ch03-b16
          speaker: anthea
          text: 不行呀，小羊羔宝贝，你不能去！
          emotion: fearful
        - id: ch03-b17
          speaker: narrator
          text: 成年小羊羔皱起眉头。
        - id: ch03-b18
          speaker: lamb
          text: 亲爱的安西娅，我要说多少遍你才记得？我的名字是希拉里，也可以叫圣莫尔，或者德弗罗。你们这些弟弟妹妹爱叫哪个洗礼名都行，可不准再叫我小羊羔。那是愚蠢又遥远的童年留下的旧称。
        - id: ch03-b19
          speaker: narrator
          text: 这可太糟了。现在他反倒成了他们的哥哥。既然他已经成人，其他孩子还没有，他自然就是哥哥。安西娅和罗伯特低声商量起来。不过，赛米阿德的愿望差不多每天都惹出冒险，孩子们也因此机灵得远远超过了自己的年纪。
        - id: ch03-b20
          speaker: anthea
          text: 亲爱的希拉里，爸爸不许你去伦敦，你是知道的。他也不会愿意让我们没人照管，独自留在这里。
        - id: ch03-b21
          speaker: narrator
          text: 安西娅在心里骂自己，真是个会骗人的坏蛋。
        - id: ch03-b22
          speaker: cyril
          text: 你既然是我们的哥哥，就该拿出哥哥的样子。带我们去梅德斯通好好吃一顿，再一起去河上玩吧。
        - id: ch03-b23
          speaker: lamb
          text: 真是感激不尽，不过我还是喜欢一个人待着。你们回家吃午餐吧，我是说，吃午饭。也许喝下午茶的时候，我会回去看一眼。也许要等你们上床以后才回来。
        - id: ch03-b24
          speaker: narrator
          text: 上床！四个可怜的孩子飞快地互相看了一眼。不把小羊羔带回家，他们哪还有床可上？
        - id: ch03-b25
          speaker: jane
          text: 妈妈答应让我们带你出来时，我们保证过，绝不会让你离开视线。
        - id: ch03-b26
          speaker: narrator
          text: 简没等别人拦住，就把话说出了口。成年小羊羔双手插在口袋里，低头看着她。
        - id: ch03-b27
          speaker: lamb
          text: 简，你听好。小姑娘该让人看见，不该让人听见。你们几个小鬼得学会别惹人讨厌。现在快回家。明天要是表现得好，也许我会给你们一人一个便士。
        - id: ch03-b28
          speaker: cyril
          text: 听我说，老兄。你究竟打算去哪儿？就算你不愿带女孩子，让我和鲍勃斯跟着总行吧？
        - id: ch03-b29
          speaker: narrator
          text: 西里尔摆出了自己最像样的、男人对男人的口吻。这其实很高尚，因为他平常并不愿意在外面跟小羊羔走在一起。而太阳落山以后，小羊羔当然又会变回婴儿。这回，男人对男人的口吻果然奏效了。
        - id: ch03-b30
          speaker: lamb
          text: 我只打算骑车去一趟梅德斯通，在皇冠旅馆吃午餐，也许再去河上划一会儿船。可一辆车载不了你们所有人，对吧？乖乖回家去。
        - id: ch03-b31
          speaker: narrator
          text: 情势万分危急。罗伯特和西里尔绝望地交换了一个眼神。安西娅从裙腰上拔下一枚别针，上衣和裙子之间立刻豁开一道大口子。她暗中把别针递给罗伯特，还做了个意味阴沉又深刻的鬼脸。罗伯特悄悄溜到路边，那里果然停着一辆漂亮崭新的飞轮自行车。
        - id: ch03-b32
          speaker: narrator
          text: 罗伯特立刻明白，小羊羔既然成了大人，就非得有辆自行车不可。这本来也是罗伯特想长大的一个理由。他赶紧动手，在后胎扎了十一孔，前胎扎了七孔。要不是黄色榛树叶沙沙作响，提醒他大家正走过来，他原本会把总数凑到二十二。罗伯特把两只手分别按在两个车轮上，残余的空气从十八个整齐的小针孔里嘶嘶漏出来，算是给他的奖赏。
        - id: ch03-b33
          speaker: robert
          text: 你的车胎瘪了。
        - id: ch03-b34
          speaker: narrator
          text: 罗伯特说完，暗暗惊讶自己怎么这么快就学会了骗人。
        - id: ch03-b35
          speaker: cyril
          text: 确实瘪了。
        - id: ch03-b36
          speaker: anthea
          text: 是扎破了。你看。
        - id: ch03-b37
          speaker: narrator
          text: 安西娅弯腰又站起来，手里拿着一根早就准备好的刺。成年小羊羔，也就是眼下非叫希拉里不可的那个人，装好气筒，开始打气。轮胎上满是窟窿，这件事很快就瞒不住了。
        - id: ch03-b38
          speaker: lamb
          text: 附近大概有农舍吧？能不能借到一桶水？
        - id: ch03-b39
          speaker: narrator
          text: 附近确实有一所农舍。等一桶水把十八个破孔全都显出来，大家发现那所农舍还供应骑车人茶点，简直是老天格外的恩赐。小羊羔和哥哥姐姐们就在那里吃了一顿古怪的茶点兼火腿餐。钱从罗伯特做巨人时挣到的十五先令里出，因为小羊羔身上偏偏一个钱也没有。大家非常失望，可这种事就算落到最成年的大人身上，也一样会发生。
        - id: ch03-b40
          speaker: narrator
          text: 好歹罗伯特终于吃饱了，这也总算是一件很值得庆幸的好事。可怜的四个孩子轮流上阵，劝小羊羔，也可以说是圣莫尔，把当天剩下的时间全留在树林里。他们声音很轻，却一直不懈地劝着，一刻也不肯放弃。等他终于补完第十八个破孔，白天已经没剩多少了。他如释重负地叹了口气，抬起头，忽然扶正领带。
    - id: ch04
      title: 猪食桶后的秘密
      blocks:
        - id: ch04-b01
          speaker: lamb
          text: 有位女士过来了。看在老天的分上，你们快闪开。回家去，躲起来，怎么消失都行！我可不能让人看见我跟一群脏小鬼待在一起。
        - id: ch04-b02
          speaker: narrator
          text: 哥哥姐姐们的确很脏，因为当天早些时候，小羊羔还没长大时，往他们身上撒了不少花园泥土。简后来形容，成年小羊羔的声音活像个暴君。孩子们居然真的退到后花园，留下这个有小胡子、穿法兰绒套装的人，独自迎接推着自行车走进前院的年轻女士。
        - id: ch04-b03
          speaker: narrator
          text: 屋里的女人走出来，年轻女士跟她说了几句话。她经过小羊羔身边时，小羊羔抬帽致意。孩子们躲在猪食桶旁，从墙角伸长脖子，竖着耳朵偷听，却没听清她说什么。罗伯特认为，那个倒霉的小羊羔变成这样以后，他们偷听完全公平。等小羊羔用那种满是客套的懒洋洋声音开口，他们可听得一清二楚。
        - id: ch04-b04
          speaker: lamb
          text: 轮胎破了吗？我能帮上一点儿忙吗？只要您肯让我……
        - id: ch04-b05
          speaker: narrator
          text: 猪食桶后面忽然传来一阵憋不住的爆笑。成年小羊羔，也就是换了名字的德弗罗，愤怒地朝那里斜了一眼。
        - id: ch04-b06
          speaker: young_lady
          text: 您真好。
        - id: ch04-b07
          speaker: narrator
          text: 年轻女士看着小羊羔，显得有些羞涩。不过照男孩子们的说法，她可不像个扭扭捏捏的人。
        - id: ch04-b08
          speaker: cyril
          text: 哎呀，我还以为他今天已经修够自行车了。她要是知道，他其实只是个爱哭鼻子、傻乎乎的小娃娃！
        - id: ch04-b09
          speaker: narrator
          text: 西里尔躲在猪食桶后，把声音压得很低。
        - id: ch04-b10
          speaker: anthea
          text: 他才不是！只要没人招惹他，他可招人疼了。不管一群傻瓜把他变成什么样，他还是我们自己宝贝的小羊羔。对不对，简妮？
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: 简不大肯定，只说大概是吧。这时，小羊羔，或者我该尽量记得叫他圣莫尔，正在检查女士的自行车。他说话做事，完全是成年人的派头。任谁看见他、听见他，都不会猜到当天早晨，他还是个胖乎乎的两岁娃娃，专门摔坏别人的沃特伯里怀表。
        - id: ch04-b12
          speaker: narrator
          text: 德弗罗，也就是往后理应这样称呼的人，修好女士的自行车以后，竟然掏出了一块金表。猪食桶后的四个旁观者忍不住齐声惊叫。这实在太不公平了。宝宝当天早晨才毁掉两块便宜却老实可靠的怀表，如今西里尔的愚蠢把他一下催成大人，竟然还送了他一块真正的金表。那表不但有表链，连印章坠饰也有。
        - id: ch04-b13
          speaker: narrator
          text: 希拉里，现在就先这么叫他吧，只用一个眼神，就叫哥哥姐姐们全蔫了下去。接着，他对那位好像已经跟自己很熟的女士开了口。
        - id: ch04-b14
          speaker: lamb
          text: 要是您允许，我愿意陪您骑到十字路口。天已经晚了，这附近又有流浪汉。
        - id: ch04-b15
          speaker: narrator
          text: 谁也不会知道，年轻女士原本打算怎么回答。安西娅刚听完，便猛冲出去，一下撞上猪食桶。浑浊的脏水顿时漫了出来。她一把抓住小羊羔的胳膊，其余三个也跟着跑了出来。眨眼之间，四个脏兮兮的孩子全暴露在眼前，再也藏不住了。
        - id: ch04-b16
          speaker: anthea
          text: 别让他跟您走。他根本不适合跟任何人走！
        - id: ch04-b17
          speaker: lamb
          text: 走开，小姑娘！立刻回家！
          emotion: angry
        - id: ch04-b18
          speaker: anthea
          text: 您最好别跟他扯上关系。他连自己是谁都不知道。他其实根本不是您以为的那种人。
        - id: ch04-b19
          speaker: young_lady
          text: 你这话是什么意思？
        - id: ch04-b20
          speaker: narrator
          text: 德弗罗想把安西娅推开，却怎么也推不动。其余三个孩子都在她身后撑着，她站得像块磐石。
        - id: ch04-b21
          speaker: anthea
          text: 您只管让他陪您去，很快就明白了！要是骑车下坡时，身边忽然变成一个可怜又无助的小娃娃，两只脚悬在失控的自行车上，一路往前冲，您会喜欢吗？
        - id: ch04-b22
          speaker: narrator
          text: 年轻女士的脸有点儿发白。
        - id: ch04-b23
          speaker: young_lady
          text: 这些脏得要命的孩子是谁？
        - id: ch04-b24
          speaker: narrator
          text: 她问的是成年小羊羔，本书有时称他为圣莫尔。
        - id: ch04-b25
          speaker: lamb
          text: 我不认识他们。
          emotion: sad
        - id: ch04-b26
          speaker: narrator
          text: 他痛苦地撒了谎。
        - id: ch04-b27
          speaker: jane
          text: 啊，小羊羔！你怎么能这么说？你明明就是我们最疼爱的亲生小弟弟。我们是他的哥哥姐姐，必须照管他，也必须在日落前带他回家，不然谁也不知道会出什么事。您瞧，他像是中了魔法，就是被施了魔法。您明白吧？
        - id: ch04-b28
          speaker: narrator
          text: 简转过去向女士解释。女士的双手已经开始发抖，她掉转自行车，朝门口推去。小羊羔，也就是德弗罗，一次又一次想堵住简滔滔不绝的话。可罗伯特和西里尔一人抱住他一条腿，他根本没法好好解释。女士慌忙骑车逃走。到了晚餐时，她告诉亲戚们，自己刚从一家危险的疯子手里逃出来，听得大家目瞪口呆。
        - id: ch04-b29
          speaker: young_lady
          text: 那个小姑娘的眼睛完完全全是疯子的眼睛。我真不明白，怎么会有人放她在外面乱跑。
        - id: ch04-b30
          speaker: narrator
          text: 自行车嗖嗖地沿路远去。西里尔这才严肃地开口。
        - id: ch04-b31
          speaker: cyril
          text: 希拉里，老兄，你准是中了暑，或者得了什么病。还有你刚才对那位女士说的话！等你恢复正常，比如到了明早，我们要是告诉你这些，你连听都听不明白，更别说相信了。听我的，现在回家。明早你要是还没恢复，我们就请送奶人替我们叫医生。
        - id: ch04-b32
          speaker: narrator
          text: 可怜的成年小羊羔，圣莫尔的确是他的一个教名，这会儿好像已经糊涂得没力气反抗了。
        - id: ch04-b33
          speaker: lamb
          text: 既然你们几个看起来全都疯得够资格加入制帽匠公会，我大概还是带你们回家为好。不过，别以为这事就算完了。明天早晨，我会跟你们一个个说清楚。
        - id: ch04-b34
          speaker: anthea
          text: 对，你会说的，我的小羊羔。可绝不会是你现在以为的那些话。
        - id: ch04-b35
          speaker: narrator
          text: 安西娅把声音压得很低。在心里，她仿佛听见了宝宝小羊羔那柔软甜蜜、满是依恋的小嗓音。那声音跟成年小羊羔装腔作势的腔调完全不同。德弗罗，是他许多名字里的一个，正用宝宝的声音说，要到安西娅自己这里来。
        - id: ch04-b36
          speaker: lamb
          text: 我爱安西娅。我要到安西娅自己这里来。
        - id: ch04-b37
          speaker: anthea
          text: 哎呀，看在老天的分上，我们回家吧。明早你想说什么都行，只要到时候你还说得出来。
        - id: ch04-b38
          speaker: narrator
          text: 最后一句，她说得很轻。一行人踏着柔和的暮色往家走，个个闷闷不乐。安西娅说话时，罗伯特又拿别针在车胎上施展了一番。小羊羔，也就是他们非得称作圣莫尔、德弗罗或者希拉里的人，这回似乎终于修够了自行车，于是大家推着车走。
    - id: ch05
      title: 日落以后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 他们走到白屋时，太阳眼看就要落山。四个年长的孩子很想留在小路上磨蹭，等太阳完全沉下去，好让成年小羊羔变回他们那个亲爱又淘气的小弟弟。可他仗着自己已经成人，非要继续往前。于是，他们在前花园里撞见了玛莎。
        - id: ch05-b02
          speaker: narrator
          text: 你还记得，赛米阿德格外开恩，早就安排家里的仆人永远察觉不到孩子们的愿望带来的任何变化。所以在玛莎眼里，站在面前的还是平常那群孩子。那个让她担心了整整一下午的宝宝小羊羔，也正迈着胖乎乎的小腿，在安西娅身边蹒跚走着。可在哥哥姐姐眼里，那里依旧是成年小羊羔，管他受洗时取过什么名字。玛莎一见到他，就猛地扑过去，一把将他抱进怀里。
        - id: ch05-b03
          speaker: martha
          text: 来找你自己的玛莎吧，我的心肝小宝贝！
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: 成年小羊羔拼命挣扎，脸上又恐惧又恼怒。可玛莎力气比他大，一把抱起他，往屋里走。孩子们永远也忘不了那幅景象。一个穿着整整齐齐的灰色法兰绒套装，系着浅绿色领带，留着一撮黑色小胡子的年轻人，幸好身材苗条，个子也不高，正在玛莎结实的臂弯里不停挣扎，却一点儿还手的办法也没有。
        - id: ch05-b05
          speaker: narrator
          text: 玛莎一路把他抱走，还不停哄他乖乖做个好孩子，进屋去吃那碗香喷喷的面包泡牛奶。幸好，他们刚刚走到门阶，太阳就落了下去，自行车也随即消失了。玛莎抱进屋里的，已经是真真实实、惹人疼爱、睡眼蒙眬的两岁小羊羔。成年小羊羔，从此无名无姓，永远消失了。
        - id: ch05-b06
          speaker: cyril
          text: 他永远消失了。以后小羊羔长到可以挨欺负的年纪，我们非得好好欺负他不可。这是为他自己好，免得他长成刚才那副样子。
        - id: ch05-b07
          speaker: anthea
          text: 你们不准欺负他。只要我拦得住，就绝不准。
        - id: ch05-b08
          speaker: jane
          text: 我们要用好意把他驯服。
        - id: ch05-b09
          speaker: robert
          text: 你们想想，要是他照平常的速度慢慢长，我们一路都有足够的时间纠正他。今天最糟的，就是他一下子长大了，根本来不及改善。
        - id: ch05-b10
          speaker: anthea
          text: 他根本不用改善。
        - id: ch05-b11
          speaker: narrator
          text: 这时，敞开的门里飘出了小羊羔咿咿呀呀的声音。正是安西娅下午在心里听见的那句话。
        - id: ch05-b12
          speaker: lamb
          text: 我爱安西娅。要到安西娅自己这里来！
          emotion: happy
