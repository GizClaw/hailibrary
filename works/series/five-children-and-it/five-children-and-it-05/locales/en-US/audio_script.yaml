  chapters:
    - id: ch01
      title: NO WINGS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Whether anyone cried or not, there was certainly a while when none of them felt quite like themselves. Once they had grown calmer, Anthea put away her handkerchief, slipped an arm around Jane, and tried to comfort her.
        - id: ch01-b02
          speaker: anthea
          text: >-
            It can only be for one night. In the morning our handkerchiefs will be dry, and we can signal with them. Someone will come up and let us out.
        - id: ch01-b03
          speaker: cyril
          text: And they'll find the syphon. Then we'll be sent to prison for stealing.
        - id: ch01-b04
          speaker: anthea
          text: You said it wasn't stealing. You said you were certain.
        - id: ch01-b05
          speaker: cyril
          text: I'm not certain now.
        - id: ch01-b06
          speaker: robert
          text: >-
            Let's throw the horrible thing right into the trees. Then no one can do anything to us.
        - id: ch01-b07
          speaker: narrator
          text: Cyril gave a laugh, but there was nothing cheerful about it.
        - id: ch01-b08
          speaker: cyril
          text: >-
            Oh, yes. Then it can hit someone on the head, and we'll be murderers as well as... as the other thing.
        - id: ch01-b09
          speaker: jane
          text: We can't stay up here all night. And I want my tea.
        - id: ch01-b10
          speaker: robert
          text: You can't want tea. You've only just had dinner.
        - id: ch01-b11
          speaker: jane
          text: >-
            But I do want it, especially when you talk about staying here all night. Oh, Panther, I want to go home! I want to go home!
          emotion: sad
        - id: ch01-b12
          speaker: anthea
          text: >-
            Hush, dear. Please don't cry. Somehow, it will be all right. Please don't.
          emotion: calm
        - id: ch01-b13
          speaker: robert
          text: >-
            Let her cry. If she makes enough noise, somebody may hear us and come to open the door.
        - id: ch01-b14
          speaker: anthea
          text: >-
            And then they'll see the soda-water thing. Robert, don't be horrid. Jane, do try to be brave. We're all in the same trouble.
        - id: ch01-b15
          speaker: narrator
          text: Jane did try to be brave, and her howls became sniffs. For a moment, nobody spoke. Then Cyril began slowly.
        - id: ch01-b16
          speaker: cyril
          text: >-
            Listen. We'll have to risk the syphon. I'll button it inside my jacket, and perhaps no one will notice. The rest of you stay well ahead of me. There are lights in the Vicar's house, so they aren't in bed yet. We must yell as loudly as we can. When I count three, everyone scream. Robert, make your railway-engine yell. I'll do Father's coo-ee. You girls make any noise you like. One, two, three!
        - id: ch01-b17
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Help! Coo-ee! Help!
        - id: ch01-b18
          speaker: narrator
          text: >-
            Four voices tore through the quiet evening. At a Vicarage window, Jessie the maid stopped with one hand on the blind cord.
        - id: ch01-b19
          speaker: cyril
          text: One, two, three!
        - id: ch01-b20
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Help! Coo-ee! Help!
        - id: ch01-b21
          speaker: narrator
          text: >-
            This time the sharp, tangled yell sent owls and starlings fluttering around the belfry below. Jessie fled downstairs to the kitchen. After telling Andrew, the cook, and the cook's cousin that she had seen a ghost, she fainted. It was not true, of course. The yelling had simply shaken her nerves.
        - id: ch01-b22
          speaker: cyril
          text: One, two, three!
        - id: ch01-b23
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Help! Coo-ee! Help!
        - id: ch01-b24
          speaker: narrator
          text: >-
            By then the Vicar stood on his doorstep, and there was no mistaking the sound that reached him.
        - id: ch01-b25
          speaker: vicar
          text: >-
            Goodness me! My dear, someone is being murdered in the church. Bring me my hat and a stout stick, and tell Andrew to follow. It must be the lunatic who stole the tongue.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The children saw the light flash when the front door opened. They saw the Vicar's dark shape in the doorway and stopped to catch their breath and watch him. When he turned back for his hat, Cyril spoke in a rush.
        - id: ch01-b27
          speaker: cyril
          text: >-
            He thinks he imagined the noise. You aren't yelling half loudly enough. Now! One, two, three!
        - id: ch01-b28
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Help! Coo-ee! Help!
        - id: ch01-b29
          speaker: narrator
          text: >-
            That was a complete yell. The Vicar's wife flung her arms around her husband and gave a faint little scream of her own.
        - id: ch01-b30
          speaker: vicars_wife
          text: >-
            You are not going alone! Jessie, send Andrew at once. There is a dangerous lunatic in the church, and he must go and catch it immediately.
          emotion: fearful
        - id: ch01-b31
          speaker: narrator
          text: Jessie recovered and came out of the kitchen. As she went back through the kitchen door, she spoke to herself.
        - id: ch01-b32
          speaker: jessie
          text: I expect Andrew will catch it too.
        - id: ch01-b33
          speaker: jessie
          text: >-
            Andrew, somebody is screaming like mad in the church. The mistress says you must go over and catch it.
        - id: ch01-b34
          speaker: andrew
          text: I'm not going alone.
        - id: ch01-b35
          speaker: narrator
          text: But when Andrew answered his master, he said only this.
        - id: ch01-b36
          speaker: andrew
          text: Yes, sir.
        - id: ch01-b37
          speaker: vicar
          text: You heard those screams, didn't you?
        - id: ch01-b38
          speaker: andrew
          text: I thought I noticed some sort of noise.
        - id: ch01-b39
          speaker: vicar
          text: Then come along.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The Vicar insisted that he had to go. He gently pushed his wife into the sitting room, shut the door with a bang, and rushed outside, pulling Andrew by the arm. Another volley of yells met them. When it faded, Andrew called into the dark.
        - id: ch01-b41
          speaker: andrew
          text: Hello, up there! Were you calling?
        - id: ch01-b42
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Yes!
        - id: ch01-b43
          speaker: vicar
          text: Their voices seem to be coming from the air. Most remarkable.
        - id: ch01-b44
          speaker: andrew
          text: Where are you?
        - id: ch01-b45
          speaker: narrator
          text: Cyril made his voice as deep as he could and called each word slowly and loudly.
        - id: ch01-b46
          speaker: cyril
          text: Church! Tower! Top!
        - id: ch01-b47
          speaker: andrew
          text: Then come down!
        - id: ch01-b48
          speaker: cyril
          text: Can't! Door locked!
        - id: ch01-b49
          speaker: vicar
          text: >-
            My goodness! Andrew, fetch the stable lantern. Perhaps you should bring another man from the village as well.
        - id: ch01-b50
          speaker: andrew
          text: >-
            The rest of their gang is probably nearby. No, sir, if this isn't a trap, I don't know what is. The cook's cousin is at the back door now. He's a keeper, sir. He knows how to handle dangerous people, and he has his gun.
        - id: ch01-b51
          speaker: cyril
          text: Hello down there! Come up and let us out!
        - id: ch01-b52
          speaker: andrew
          text: We're coming. I'm going to fetch a policeman and a gun.
        - id: ch01-b53
          speaker: vicar
          text: Andrew, that isn't true.
        - id: ch01-b54
          speaker: andrew
          text: It's near enough for people like them, sir.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Andrew fetched the lantern and the cook's cousin, while the Vicar's wife begged them all to be careful.
        - id: ch01-b56
          speaker: narrator
          text: >-
            It was quite dark as the three men crossed the churchyard, and they talked all the way. The Vicar was sure there was a lunatic on the church tower. It must be the same lunatic who had written the mad letter and stolen the cold tongue and the other things. Andrew was just as sure the whole business was a trap. Only the cook's cousin stayed calm.
        - id: ch01-b57
          speaker: keeper
          text: A great deal of noise usually means very little danger. Dangerous fellows are quieter than that.
        - id: ch01-b58
          speaker: narrator
          text: >-
            He was not afraid at all, but then he had a gun. That was why the others asked him to lead the way up the steep, worn steps inside the tower. He went first with the lantern in one hand and the gun in the other. Andrew came next, and the Vicar followed him. Later, Andrew claimed he had gone ahead of his master because he was braver. The truth was that he kept thinking of traps. He did not want to be behind the other two, in case someone crept softly up the stairs after him in the dark and grabbed his legs.
        - id: ch01-b59
          speaker: narrator
          text: >-
            On and on they climbed, circling around the narrow corkscrew staircase. They passed through the bell-ringers' loft. The soft, furry ends of the bell ropes hung there like giant caterpillars. Another stair brought them into the belfry, among the great, silent bells. They climbed a ladder with broad steps, and after that came one more little stone stair. At its top stood a small door, bolted from the stairway side.
        - id: ch01-b60
          speaker: narrator
          text: The keeper kicked the door.
        - id: ch01-b61
          speaker: keeper
          text: Hello in there!
        - id: ch01-b62
          speaker: narrator
          text: >-
            On the other side, the children clung to one another and trembled with worry. All their yelling had made them very hoarse, but Cyril managed an answer.
        - id: ch01-b63
          speaker: cyril
          text: Hello out there!
        - id: ch01-b64
          speaker: keeper
          text: How did you get up there?
        - id: ch01-b65
          speaker: narrator
          text: Cyril could hardly tell him that they had flown.
        - id: ch01-b66
          speaker: cyril
          text: >-
            We got up here, and then we found the door locked and couldn't get down. Please let us out.
        - id: ch01-b67
          speaker: keeper
          text: How many of you are there?
        - id: ch01-b68
          speaker: cyril
          text: Only four.
        - id: ch01-b69
          speaker: keeper
          text: Are you armed?
        - id: ch01-b70
          speaker: cyril
          text: Are we what?
        - id: ch01-b71
          speaker: keeper
          text: >-
            I have my gun ready, so don't try any tricks. If we open this door, will you come down quietly and behave yourselves?
        - id: ch01-b72
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Yes! Oh, yes!
        - id: ch01-b73
          speaker: vicar
          text: Bless me. Surely one of those voices was a girl's?
        - id: ch01-b74
          speaker: keeper
          text: Shall I open the door, sir?
        - id: ch01-b75
          speaker: narrator
          text: >-
            Andrew moved several steps down the dark stair. He explained afterward that he had only been making room for the others.
        - id: ch01-b76
          speaker: vicar
          text: >-
            Yes, open it. Remember, we have come to release you. Will you keep your promise and do us no violence?
        - id: ch01-b77
          speaker: keeper
          text: >-
            This bolt is stuck fast. Anyone would think it hadn't been drawn for half a year.
        - id: ch01-b78
          speaker: narrator
          text: In fact, it had not.
        - id: ch01-b79
          speaker: keeper
          text: >-
            I won't open the door until you're all against the far side of the tower. If anyone comes at me, I fire. Move now!
        - id: ch01-b80
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: We're all on the other side.
        - id: ch01-b81
          speaker: narrator
          text: >-
            The keeper was very pleased with himself. He felt like a truly bold man when he threw open the door and stepped out onto the leads. He raised the stable lantern and shone its full light across the tower. There stood the whole desperate gang in a tight group against the parapet on the far side. The keeper lowered his gun, and he almost dropped the lantern.
        - id: ch01-b82
          speaker: keeper
          text: Well, help me! They're nothing but a pack of children!
          emotion: surprised
        - id: ch01-b83
          speaker: narrator
          text: The Vicar came forward and spoke sternly.
        - id: ch01-b84
          speaker: vicar
          text: How did you get here? Tell me at once.
        - id: ch01-b85
          speaker: jane
          text: >-
            Oh, please take us down. Then we'll tell you anything you like. You won't believe us, but that doesn't matter. Just take us down!
        - id: ch01-b86
          speaker: narrator
          text: >-
            Jane caught at his coat, and Anthea and Robert crowded around with the same plea. Cyril stayed back in the shadows. The soda-water syphon kept sliding under his jacket, and he needed both hands to hold it in place.
        - id: ch01-b87
          speaker: cyril
          text: Please take us down.
        - id: ch01-b88
          speaker: narrator
          text: >-
            So down they went. It is no joke to descend a strange church tower in the dark. The keeper helped the children over the difficult places. Cyril had to be independent because of the syphon under his jacket. It would not stay still. Halfway down the ladder, it nearly escaped altogether. Cyril caught it by the spout at the last instant, and the sudden grab almost made him lose his footing. By the time they reached the bottom of the winding stair and stepped onto the flat stones of the church porch, he was pale and trembling.
        - id: ch01-b89
          speaker: narrator
          text: Suddenly, the keeper seized Cyril by one arm and Robert by the other.
        - id: ch01-b90
          speaker: keeper
          text: Vicar, you bring the girls. You and Andrew can manage them.
        - id: ch01-b91
          speaker: cyril
          text: >-
            Let go! We aren't trying to run away, and we haven't damaged your old church. Let me go!
          emotion: angry
        - id: ch01-b92
          speaker: keeper
          text: You just come along with me.
        - id: ch01-b93
          speaker: narrator
          text: >-
            Cyril did not dare struggle, because at that very moment the syphon began slipping again. The whole party marched to the Vicarage study, where the Vicar's wife rushed in to meet them.
        - id: ch01-b94
          speaker: vicars_wife
          text: Oh, William! Are you safe?
          emotion: fearful
        - id: ch01-b95
          speaker: robert
          text: >-
            Yes, he's perfectly safe. We haven't hurt him at all. Please, we're very late, and everyone at home will be worried. Could you send us back in your carriage?
        - id: ch01-b96
          speaker: anthea
          text: >-
            Or is there a hotel nearby where we could hire one? Martha must already be very anxious.
        - id: ch01-b97
          speaker: narrator
          text: >-
            The Vicar sank into a chair, overcome with amazement and emotion. Cyril sat too, leaning forward with his elbows on his knees so that he could keep hold of the soda-water syphon.
        - id: ch01-b98
          speaker: vicar
          text: But how did you come to be locked in the church tower?
        - id: ch01-b99
          speaker: robert
          text: >-
            We went up there. We were tired, so we all fell asleep. When we woke, the door was locked. That was why we shouted.
        - id: ch01-b100
          speaker: vicars_wife
          text: >-
            I should think you did shout! You frightened everybody out of their senses. You ought to be ashamed.
          emotion: angry
        - id: ch01-b101
          speaker: jane
          text: We are ashamed.
          emotion: sad
        - id: ch01-b102
          speaker: vicar
          text: But who locked the door?
        - id: ch01-b103
          speaker: robert
          text: >-
            I truly don't know. Please, will you send us home?
        - id: ch01-b104
          speaker: vicar
          text: >-
            Well, I suppose we had better. Andrew, harness the horse and drive them home.
        - id: ch01-b105
          speaker: andrew
          text: I'm not going alone.
        - id: ch01-b106
          speaker: narrator
          text: Andrew said that only to himself.
        - id: ch01-b107
          speaker: vicar
          text: And I hope this will be a lesson to you.
        - id: ch01-b108
          speaker: narrator
          text: >-
            The Vicar continued his lecture, and the children listened unhappily. The keeper did not listen. He watched Cyril instead. A keeper knows about poachers, and he knows the look of someone who is hiding a thing. By then, the Vicar was explaining that children should grow up to be a blessing to their parents. They should never bring them trouble or disgrace. That was when the keeper broke in.
        - id: ch01-b109
          speaker: keeper
          text: Ask that boy what he has under his jacket.
        - id: ch01-b110
          speaker: narrator
          text: >-
            Cyril knew there was no more use in hiding it. He stood, squared his shoulders, and tried to look noble, like one of those boys in books whose brave family history no one could possibly doubt. Then he pulled out the soda-water syphon.
        - id: ch01-b111
          speaker: cyril
          text: Well, there it is.
        - id: ch01-b112
          speaker: narrator
          text: Everyone was silent. There was nothing for Cyril to do but go on.
        - id: ch01-b113
          speaker: cyril
          text: >-
            Yes, we took it from your larder, along with some chicken, tongue, and bread. We were terribly hungry. We didn't touch the custard or the jam. We took only bread, meat, and water, the things people need to live. It wasn't our fault that the water had soda in it. We left half a crown to pay, and we wrote a letter. We are very sorry. Father will pay a fine, or whatever you want, but please don't send us to prison. Mother would be so upset. You told us not to become a disgrace to our parents, so please don't make us one. That's all. We couldn't be sorrier.
        - id: ch01-b114
          speaker: vicars_wife
          text: But how did you ever reach the larder window?
        - id: ch01-b115
          speaker: cyril
          text: I can't tell you that.
        - id: ch01-b116
          speaker: vicar
          text: Have you told me the whole truth?
        - id: ch01-b117
          speaker: jane
          text: >-
            No. Everything we've said is true, but it isn't the whole truth. We can't tell you the rest, so asking won't help. Oh, please forgive us and take us home!
        - id: ch01-b118
          speaker: narrator
          text: >-
            Jane ran to the Vicar's wife and threw her arms around her. The Vicar's wife hugged her back. Behind one hand, the keeper whispered to the Vicar.
        - id: ch01-b119
          speaker: keeper
          text: >-
            They're all right, sir. I expect they're protecting a friend. Someone else put them up to it, and they won't tell on him. Brave little youngsters.
        - id: ch01-b120
          speaker: vicar
          text: >-
            Tell me, are you protecting someone? Did anyone else have anything to do with this?
        - id: ch01-b121
          speaker: narrator
          text: Anthea thought of the Psammead.
        - id: ch01-b122
          speaker: anthea
          text: Yes, but it wasn't their fault.
        - id: ch01-b123
          speaker: vicar
          text: >-
            Very well, my dears. We will say no more about that. Just tell us why you wrote such a peculiar letter.
        - id: ch01-b124
          speaker: cyril
          text: >-
            I don't know. Anthea wrote it in a hurry, and at the time it honestly didn't feel like stealing. But once we were trapped on the tower, it felt exactly like stealing. We are all very sorry.
        - id: ch01-b125
          speaker: vicars_wife
          text: >-
            Say no more. Next time, stop and think before taking other people's tongues. Would you like cake and milk before you leave?
        - id: ch01-b126
          speaker: narrator
          text: >-
            Andrew returned to announce that the horse was ready. He also wanted to know whether he was really expected to be sent alone into the trap that, according to him, he had clearly recognized from the first. Instead, he found the children eating cake and drinking milk. They were laughing at the Vicar's jokes, and Jane was sitting on the Vicar's wife's lap. So, as you see, they escaped much more lightly than they deserved.
        - id: ch01-b127
          speaker: narrator
          text: >-
            The gamekeeper asked permission to ride home with them, and Andrew was delighted to have someone guarding him from the trap he still expected. By the time the wagonette reached the children's house between the chalk quarry and the gravel pit, they were very sleepy. Even so, they felt that they and the keeper would be friends for life.
        - id: ch01-b128
          speaker: narrator
          text: Andrew dropped the children at the iron gate without saying a word.
        - id: ch01-b129
          speaker: keeper
          text: >-
            Off you go home. I'll walk back on my own two legs.
        - id: ch01-b130
          speaker: narrator
          text: >-
            Andrew had to drive away alone, and he did not like that at all. The keeper, who was the Vicarage cook's cousin, walked with the children from the gate to their door. A whirlwind of scolding swept them straight to bed. He stayed behind, though, and told Martha, the cook, and the housemaid exactly what had happened. He explained everything so well that Martha was quite friendly the next morning.
        - id: ch01-b131
          speaker: narrator
          text: >-
            After that, the keeper often came to visit Martha. In the end... but that is another story, as dear Mr. Kipling says.
        - id: ch01-b132
          speaker: narrator
          text: >-
            Martha still had to keep her word from the night before, so the children were punished by staying indoors the next day. She was not cross about it, though. She even let Robert go out for half an hour to fetch something he particularly wanted. That something, of course, was the day's wish.
        - id: ch01-b133
          speaker: narrator
          text: >-
            Robert raced to the gravel pit, found the Psammead, and soon made his wish. But that, too, is another story.
