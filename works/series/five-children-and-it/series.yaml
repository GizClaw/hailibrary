cover_prompt: |-
  A wordless cover scene in an Edwardian English gravel pit shows five children discovering the Psammead beneath warm summer light. Cyril is a sturdy dark-haired boy in a Norfolk jacket, Anthea a practical girl with brown braids and a cream dress, Robert a round-faced boy in suspenders, Jane a smaller girl in a blue pinafore, and the Lamb a toddler in a white smock. Between them rises the Psammead, a small ancient sand creature with a furry round body, long whiskers, snail-like eyes on stalks, and broad bat-like ears, interpreted directly from the text with no modern adaptation likeness. The children lean back in astonishment as the creature puffs itself up to grant a wish, making that strange transformation the focal action. Use a low view from the sandy hollow, ring the figures against grasses and a distant red-roofed house, and leave calm open sky at the top. Keep the magic whimsical, original, and non-frightening, with accurate early-1900s clothing and no modern objects. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
