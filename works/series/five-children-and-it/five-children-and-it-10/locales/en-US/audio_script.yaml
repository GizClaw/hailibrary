  chapters:
    - id: ch01
      title: SCALPS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The day might have gone much better if Cyril had not been reading The Last of the Mohicans. The story was still racing through his mind at breakfast. As he drank his third cup of tea, he spoke without really thinking.
        - id: ch01-b02
          speaker: cyril
          text: >-
            I wish there were Native warriors in England. Not grown men, of course. I mean boys about our own size, so we could fight them.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Everyone objected, but no one thought the remark mattered. Later, the children went to the sand-pit. They meant to ask for a hundred pounds, all in two-shilling pieces stamped with Queen Victoria's head. That seemed wonderfully sensible and quite impossible to misunderstand. Instead, they learned that they had made another mistake. The Psammead was sleepy and very cross.
        - id: ch01-b04
          speaker: psammead
          text: Don't pester me. Your wish has already been granted.
          emotion: angry
        - id: ch01-b05
          speaker: cyril
          text: I didn't know we'd made one.
        - id: ch01-b06
          speaker: psammead
          text: >-
            Have you forgotten yesterday already? You asked to have your wishes granted wherever you happened to be. Well, somebody wished for something this morning, and now you have it.
        - id: ch01-b07
          speaker: robert
          text: We have? What did we wish for?
        - id: ch01-b08
          speaker: psammead
          text: >-
            So you've forgotten. Never mind. You'll find out soon enough, and I hope you enjoy it. You've landed yourselves in a fine mess this time.
        - id: ch01-b09
          speaker: narrator
          text: The Psammead began burrowing into the sand.
        - id: ch01-b10
          speaker: jane
          text: Somehow, we always do.
          emotion: sad
        - id: ch01-b11
          speaker: narrator
          text: >-
            The strange part was that none of them could remember a single wish from breakfast. Cyril's words about the warriors had slipped out of every mind. The whole morning became a misery. Each child searched their memory, and no one found the answer. Every minute, they expected something dreadful to happen. The Psammead had made it clear that this wish was even more unpleasant than usual. For several long hours, the children could do nothing but wonder what was coming and wait in agonizing uncertainty.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Near dinnertime, Jane tripped over The Last of the Mohicans, which had been left face down on the floor. Anthea picked up Jane and then the book. All at once she understood. She sat straight down on the carpet.
        - id: ch01-b13
          speaker: anthea
          text: I know!
          emotion: surprised
        - id: ch01-b14
          speaker: anthea
          text: >-
            Oh, Pussy, this is awful. Cyril wished for those warriors at breakfast. Don't you remember? Now they must be all over England, scalping people wherever they go.
          emotion: fearful
        - id: ch01-b15
          speaker: jane
          text: >-
            Maybe they're only up in Northumberland and Durham.
          emotion: calm
        - id: ch01-b16
          speaker: narrator
          text: Somehow it was hard to believe that scalping could hurt people very much when it happened so far away.
        - id: ch01-b17
          speaker: anthea
          text: >-
            No, it won't be like that. The Psammead said we'd landed ourselves in a fine mess. That means they'll come here. What if they scalp the Lamb?
          emotion: fearful
        - id: ch01-b18
          speaker: jane
          text: Perhaps anyone who gets scalped will be all right again at sunset.
        - id: ch01-b19
          speaker: narrator
          text: Jane did not sound nearly as hopeful as she usually did.
        - id: ch01-b20
          speaker: anthea
          text: >-
            They won't. Things that happen because of wishes don't disappear. Remember those fifteen shillings. Pussy, I'm going to break something, and I need every penny you have. Those warriors are coming here. The Psammead practically told us so. Do you understand my plan? Come on.
        - id: ch01-b21
          speaker: narrator
          text: Jane understood nothing, but she meekly followed her sister into Mother's bedroom.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Anthea lifted down the heavy water jug. It was painted with storks standing among long grasses, and she remembered that pattern for the rest of her life. She carried the jug into the dressing room and carefully emptied every drop of water into the bath. Then she carried the empty jug back to the bedroom and dropped it on the floor.
        - id: ch01-b23
          speaker: narrator
          text: >-
            A jug always seems certain to smash when you happen to drop it by accident. Dropping one on purpose is quite another matter. Anthea dropped this jug three times, and after the third fall it was still as whole as ever. In the end, she fetched Father's boot-tree and deliberately struck the jug with it. Doing such damage in cold blood felt like heartless work.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Next she used the poker to break open the missionary box. Jane naturally told her it was wrong. Anthea pressed her lips tightly together before she answered.
        - id: ch01-b25
          speaker: anthea
          text: Don't be silly. Someone's life may depend on this.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The box held only seven shillings and fourpence. Between them, the girls had nearly four shillings more, bringing the total to a little over eleven. Anthea knotted the money into one corner of her handkerchief.
        - id: ch01-b27
          speaker: anthea
          text: Come on, Jane!
        - id: ch01-b28
          speaker: narrator
          text: >-
            They ran down to the farm. Anthea knew the farmer was driving into Rochester that afternoon. The four children had meant to go with him. They had made that cheerful plan when they still expected the Psammead to give them a hundred pounds in two-shilling pieces, and each child was going to pay two shillings for the ride.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Anthea hurriedly explained that they could not go after all. Would the farmer take Martha and the Baby instead? He agreed, though he was not pleased to receive only half a crown instead of the eight shillings the four children had promised him. With that settled, the girls ran all the way home again.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Anthea was anxious, but she did not lose her head. Looking back later, she had to admit that she had acted with the quick foresight of a born general. She fetched a little box from her own drawer and found Martha laying the table in a bad temper.
        - id: ch01-b31
          speaker: anthea
          text: Martha, I've broken the toilet jug in Mother's room.
        - id: ch01-b32
          speaker: martha
          text: That's just like you. You're always getting into mischief.
          emotion: angry
        - id: ch01-b33
          speaker: narrator
          text: Martha banged down the saltcellar.
        - id: ch01-b34
          speaker: anthea
          text: >-
            Please don't be cross, dear Martha. I have enough money for a new jug, if you'll go and buy one for us. Your cousins own a china shop, don't they? Could you get it today, in case Mother comes home tomorrow? She said she might.
        - id: ch01-b35
          speaker: martha
          text: But you're all going into town yourselves.
        - id: ch01-b36
          speaker: anthea
          text: >-
            We can't afford our own ride if we replace the jug. We'll pay for you, though, if you take the Lamb. And Martha, I'll give you my Liberty box if you go. Look how pretty it is. It's inlaid with real silver and ivory and ebony, like King Solomon's temple.
        - id: ch01-b37
          speaker: martha
          text: >-
            I see what you're after. No, miss, I don't want your box. You only want the precious Lamb out of your way for the afternoon. Don't imagine you can fool me.
        - id: ch01-b38
          speaker: narrator
          text: >-
            That was exactly true, so Anthea immediately wanted to deny it. Martha had no right to understand so much. But Anthea kept quiet. Martha set down the bread so hard that it jumped off its wooden plate.
        - id: ch01-b39
          speaker: anthea
          text: I really do need the jug. You will go, won't you?
        - id: ch01-b40
          speaker: martha
          text: >-
            Oh, very well, just this once. But don't you get into any of your outrageous trouble while I'm gone. Mind that.
        - id: ch01-b41
          speaker: anthea
          text: >-
            The farmer is leaving earlier than he planned, so you'd better dress quickly. Wear your lovely purple frock, and the hat with pink cornflowers, and your yellow lace collar. Jane can finish the table while I wash the Lamb and get him ready.
        - id: ch01-b42
          speaker: narrator
          text: >-
            The Lamb did not want to be washed, but Anthea scrubbed him and hurried him into his best clothes. Again and again she glanced out the window. So far, she could see no warriors. At last Martha and the Lamb rushed away in a great bustle, with Martha's face growing redder by the minute. Anthea drew a deep breath.
        - id: ch01-b43
          speaker: anthea
          text: He's safe!
          emotion: happy
        - id: ch01-b44
          speaker: narrator
          text: >-
            Then, to Jane's horror, Anthea threw herself on the floor and burst into floods of tears. Jane could not understand how anyone could be brave and commanding as a general one moment, then collapse like a balloon the instant someone sticks a pin into it. It is better not to collapse, of course. Still, Anthea had held herself together until the thing she meant to do was safely done.
        - id: ch01-b45
          speaker: narrator
          text: >-
            The dear Lamb was out of danger. Anthea felt sure the warriors would gather at the White House, if they appeared anywhere, and the farmer's cart would not return before sunset. Now she could spare a few tears. Some were tears of joy because she had done what she set out to do.
        - id: ch01-b46
          speaker: narrator
          text: For about three minutes, Jane hugged her miserably and repeated the same plea every five seconds.
        - id: ch01-b47
          speaker: jane
          text: Don't cry, dear Panther!
          emotion: sad
        - id: ch01-b48
          speaker: narrator
          text: >-
            Then Anthea jumped up and rubbed her eyes hard with the corner of her pinafore. They stayed red all day. She was about to tell the boys when cook rang the dinner bell. Nothing could be said until everyone had been served minced beef. Once cook left, Anthea told the whole story.
        - id: ch01-b49
          speaker: narrator
          text: >-
            A thrilling tale should never be told over minced beef and boiled potatoes. Something about that meal made the danger sound dull and impossible. The boys laughed and called Anthea silly.
        - id: ch01-b50
          speaker: cyril
          text: >-
            I'm almost certain Jane wished for fine weather before I said anything about warriors.
        - id: ch01-b51
          speaker: jane
          text: I did not.
        - id: ch01-b52
          speaker: cyril
          text: >-
            If my wish was the one that counted, those warriors would have been swarming around here hours ago. Pass the salt, please, and the mustard. I need something to help me swallow this stuff. I'm sure the wish was for a fine day.
        - id: ch01-b53
          speaker: anthea
          text: >-
            Then why did the Psammead say we'd landed ourselves in a fine mess?
          emotion: angry
        - id: ch01-b54
          speaker: narrator
          text: >-
            Anthea was very cross. She knew she had behaved with nobility, good sense, and proper caution. After all that, being called a silly little girl was especially hard to bear. Worse still, she could not forget the missionary box she had broken open. The seven shillings and fourpence she had taken, most of it in copper coins, lay on her conscience like a lump of lead.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Nobody spoke while cook removed the minced-beef plates and brought treacle pudding. The moment she left, Cyril began again.
        - id: ch01-b56
          speaker: cyril
          text: >-
            I'm not saying it was a bad idea to send Martha and the Lamb away. But the wishes always come true at once. You know that. If warriors were coming, they'd be here already.
        - id: ch01-b57
          speaker: anthea
          text: >-
            I expect they are here. They could be hiding in the bushes for all you know. You really are being horribly unkind.
          emotion: angry
        - id: ch01-b58
          speaker: jane
          text: Warriors in stories do hide a great deal, don't they?
        - id: ch01-b59
          speaker: narrator
          text: Jane was trying to make peace.
        - id: ch01-b60
          speaker: cyril
          text: >-
            No, they don't. And I'm not unkind. I'm telling the truth. Smashing the water jug was complete nonsense. As for breaking into the missionary box, I think that's treason. You might even be hanged for it if one of us told anyone.
          emotion: angry
        - id: ch01-b61
          speaker: robert
          text: Oh, do shut up.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Cyril could not stop. Deep down, he knew that if warriors really had come, it was entirely his fault. That made him desperate not to believe in them. Trying not to believe something that you are almost sure is true can make anyone bad-tempered.
        - id: ch01-b63
          speaker: cyril
          text: >-
            This talk is ridiculous. Anyone can see that Jane got her wish. Just look what a beautiful day it is. Oh!
          emotion: surprised
        - id: ch01-b64
          speaker: narrator
          text: >-
            Cyril had turned toward the window to prove how fine the day was. The others turned with him, and a frozen silence seized them all. There, among the red leaves of the Virginia creeper, a face was peering cautiously around the corner of the window. It was a brown face with a long nose, a tight mouth, and very bright eyes. Colored patches were painted across it. Long black hair hung around the face, and feathers stood in the hair.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Every child sat with their mouth open. Their treacle pudding slowly turned white and cold. No one moved. Then the feathered head slipped cautiously out of sight, and the spell broke.
        - id: ch01-b66
          speaker: anthea
          text: There! I told you!
        - id: ch01-b67
          speaker: narrator
          text: >-
            Treacle pudding had now lost every bit of its charm. The children hastily wrapped their untouched portions in a copy of the Spectator from the week before the week before last. They hid the bundles behind the crinkled paper ornament by the stove, then fled upstairs to find out what was happening. In Mother's bedroom, they searched the grounds from every window and held a hurried council.
        - id: ch01-b68
          speaker: cyril
          text: Peace, Panther. I'm sorry I behaved like a brute.
        - id: ch01-b69
          speaker: anthea
          text: That's all right. But now you see I was right.
        - id: ch01-b70
          speaker: narrator
          text: No sign of the strangers could be seen from any window.
        - id: ch01-b71
          speaker: robert
          text: Well, what do we do now?
        - id: ch01-b72
          speaker: anthea
          text: >-
            I can think of only one plan. We could dress ourselves to look as much like them as possible, then show ourselves at the windows or even go outside. They might take us for mighty chiefs of a large tribe nearby. Perhaps they would leave us alone because they'd fear our tribe's revenge.
        - id: ch01-b73
          speaker: jane
          text: But what about Eliza and cook?
        - id: ch01-b74
          speaker: robert
          text: >-
            They can't notice magical things. They wouldn't notice anything unusual, even if they were scalped or slowly roasted.
        - id: ch01-b75
          speaker: jane
          text: Would they be well again at sunset?
        - id: ch01-b76
          speaker: cyril
          text: >-
            Of course. Nobody could truly be scalped or burned to death without noticing, and they'd certainly notice the next day even if they somehow missed it at the time. Anthea's plan is good, but we'll need an enormous number of feathers.
        - id: ch01-b77
          speaker: robert
          text: >-
            I'll get some from the henhouse. One turkey is ill and doesn't seem to care what happens. I can cut off a few feathers without bothering it much. Give me the dressmaking scissors.
        - id: ch01-b78
          speaker: narrator
          text: >-
            After a careful search from the windows, they felt sure the poultry yard was empty. Robert went down. Five minutes later he returned with plenty of feathers, but his face was pale.
        - id: ch01-b79
          speaker: robert
          text: >-
            This is serious. I cut the feathers, then turned around and saw one of them squinting at me from under the old hen coop. I waved the feathers, yelled, and escaped before he could lift the coop off himself. Panther, get the colored blankets from our beds. Hurry!
          emotion: fearful
        - id: ch01-b80
          speaker: narrator
          text: >-
            Blankets, bright scarves, and feathers can make a surprisingly good disguise. None of the children had long black hair, but they found black calico meant for covering schoolbooks. They cut it into narrow fringes and tied it around their heads with the amber ribbons from the girls' Sunday dresses. Turkey feathers went into the ribbons. Once the calico strips curled a little, they looked very much like long black hair.
        - id: ch01-b81
          speaker: anthea
          text: >-
            Our faces are wrong. We're all too pale. I don't know why, but Cyril looks exactly like putty.
        - id: ch01-b82
          speaker: cyril
          text: I do not.
        - id: ch01-b83
          speaker: robert
          text: >-
            The real ones outside look brown. We ought to be properly red. If you're going to have red skin, red must be the grander color.
        - id: ch01-b84
          speaker: narrator
          text: >-
            The reddest thing in the house was the red ochre cook used on the kitchen bricks. The children put some in a saucer and mixed it with milk, just as they had seen her do for the floor. Then they painted one another's faces and hands until they were as red as anyone could need to be, and perhaps redder.
        - id: ch01-b85
          speaker: narrator
          text: >-
            In the passage they met Eliza. One look at them made her scream aloud. This unasked-for proof that they looked terrifying pleased them very much. They quickly told her not to be a goose because it was only a game. Then all four children, wrapped in blankets, crowned with feathers, and painted truly red, went out to meet the enemy. I say they went boldly because I wish to be polite. At any rate, they did go.
        - id: ch01-b86
          speaker: narrator
          text: Along the hedge between the wilderness and the garden stood a row of dark, feathered heads.
        - id: ch01-b87
          speaker: anthea
          text: >-
            This is our only chance. It's better than waiting for a blood-freezing attack. We have to bluff as hard as we can, like pretending you hold aces in a card game. I think that's called fluffing. Ready? Whoop!
        - id: ch01-b88
          speakers: [anthea, cyril, robert, jane]
          ensemble: chorus
          text: Whoop!
        - id: ch01-b89
          speaker: narrator
          text: >-
            Their four wild cries sounded about as warlike as anyone could expect from English children with no practice. They charged through the gate and struck fierce poses before the waiting line. Every stranger was about Cyril's height.
        - id: ch01-b90
          speaker: cyril
          text: I only hope they speak English.
        - id: ch01-b91
          speaker: narrator
          text: >-
            Cyril managed the words without dropping his pose. Somehow Anthea knew they would understand, though she never knew why. She had tied a white towel to a walking stick. She waved this flag of truce, hoping they would recognize it. They did. One warrior, browner than the rest, stepped forward.
        - id: ch01-b92
          speaker: golden_eagle
          text: Do you seek a council? I am Golden Eagle of the mighty Rock-dweller tribe.
        - id: ch01-b93
          speaker: anthea
          text: >-
            And I am Black Panther, chief of the Mazawattee tribe. My brothers... I mean my tribe, the Mazawattees, wait in ambush below that distant hill.
        - id: ch01-b94
          speaker: golden_eagle
          text: And who are these mighty warriors beside you?
        - id: ch01-b95
          speaker: narrator
          text: >-
            Cyril announced himself as the great chief Squirrel of the Moning Congo tribe. Jane was sucking her thumb and clearly could not invent a name, so Cyril presented her too.
        - id: ch01-b96
          speaker: cyril
          text: >-
            This great warrior is Wild Cat. In this country we call her Pussy Ferox. She leads the vast Phiteezi tribe.
        - id: ch01-b97
          speaker: golden_eagle
          text: And you, valorous warrior?
        - id: ch01-b98
          speaker: narrator
          text: Robert was caught unprepared.
        - id: ch01-b99
          speaker: robert
          text: I'm Bobs, leader of the Cape Mounted Police.
        - id: ch01-b100
          speaker: anthea
          text: >-
            If we whistle, our tribes will come and vastly outnumber your puny force. You cannot resist us. Go back to your own land, brother. Smoke peace pipes in your wampums with your wives and medicine men. Put on your brightest wigwams and feast on fresh, juicy moccasins.
        - id: ch01-b101
          speaker: cyril
          text: You've mixed it all up.
          emotion: angry
        - id: ch01-b102
          speaker: narrator
          text: Cyril kept his voice low. Golden Eagle merely looked at Anthea with interest.
        - id: ch01-b103
          speaker: golden_eagle
          text: >-
            Your customs differ from ours, Black Panther. Bring your tribe here. Great chiefs should hold their council in proper state before their people.
        - id: ch01-b104
          speaker: anthea
          text: >-
            We'll bring them, with bows, arrows, tomahawks, scalping knives, and everything else you can imagine, unless you hurry away now.
        - id: ch01-b105
          speaker: narrator
          text: >-
            Anthea sounded brave, but all four hearts hammered and every breath grew shorter. The real warriors were closing in with angry murmurs. Dark, cruel faces came nearer until the children stood trapped at the center of the crowd.
        - id: ch01-b106
          speaker: robert
          text: >-
            It hasn't worked. I knew it wouldn't. We must run to the Psammead and hope it helps us. If it doesn't, I suppose we'll come alive at sunset. I wonder whether scalping hurts as badly as people say.
          emotion: fearful
        - id: ch01-b107
          speaker: anthea
          text: I'll wave the flag once more. If they move back, run.
        - id: ch01-b108
          speaker: narrator
          text: >-
            Anthea waved the towel again. Golden Eagle commanded his followers to stand back, and for one moment the crowd obeyed him. The children seized their chance. All four charged wildly at the place where the line looked thinnest. Their first rush knocked down about half a dozen warriors. They leaped over the fallen, blanket-covered bodies and ran straight toward the sand-pit without looking back.
        - id: ch01-b109
          speaker: narrator
          text: >-
            There was no time for the gentle cart road. They plunged over the very edge, through yellow and pale purple flowers and dry grass, past the tiny doors of the sand martins. They skipped, clung, bounced, stumbled, sprawled, and finally rolled to the bottom.
        - id: ch01-b110
          speaker: narrator
          text: >-
            Golden Eagle and his followers caught them at the exact spot where they had found the Psammead that morning. The children were breathless, beaten, and helpless. Sharp knives and axes flashed around them. Worse than any blade was the cruel light in their captors' eyes.
        - id: ch01-b111
          speaker: golden_eagle
          text: >-
            You lied to us, Black Panther of the Mazawattees. You lied as well, Squirrel of the Moning Congos. Pussy Ferox of the Phiteezi and Bobs of the Cape Mounted Police also lied, if not by speaking, then by keeping silent. You lied beneath the pale-face flag of truce. You have no followers. Your tribes are far away on the hunting trail. What shall their doom be?
          emotion: angry
        - id: ch01-b112
          speakers: [rock_dweller_1, rock_dweller_2, rock_dweller_3]
          ensemble: chorus
          text: Build the fire!
          emotion: angry
        - id: ch01-b113
          speaker: narrator
          text: >-
            A dozen eager volunteers hurried off to gather fuel. Two strong young warriors held each child. The captives looked around desperately. If only they could see the Psammead.
        - id: ch01-b114
          speaker: anthea
          text: Are you going to scalp us first and roast us afterward?
          emotion: fearful
        - id: ch01-b115
          speaker: rock_dweller_1
          text: Of course. That is always the proper order.
        - id: ch01-b116
          speaker: narrator
          text: >-
            The speaker stared as though Anthea had asked an astonishing question. The others formed a ring, sat down, and watched their prisoners. A threatening silence settled over the sand-pit.
        - id: ch01-b117
          speaker: narrator
          text: >-
            Slowly, in groups of two and three, the warriors who had gone in search of firewood began to return. Every one of them came back empty-handed. However hard they had looked, they had not found one single stick for the fire. As a matter of fact, no one ever can find a stick of firewood in that part of Kent.
        - id: ch01-b118
          speaker: narrator
          text: >-
            The children sighed with relief, but the sigh turned into a terrified moan. Bright knives were waving all around them. Each child was seized. Each shut their eyes and tried not to scream while they waited for the blade's sharp pain.
        - id: ch01-b119
          speaker: narrator
          text: >-
            The children waited for the sharp agony of the knives, but it never came. A moment later their captors released them, and they fell together in a trembling heap. Their heads did not hurt at all. They only felt strangely cool. Wild cries rang in their ears. When they finally dared to open their eyes, four of their enemies were dancing around them with great leaps and screams. Each one brandished a scalp of long, flowing black hair.
        - id: ch01-b120
          speaker: narrator
          text: >-
            The children clutched their heads. Their real hair and scalps were safe. The poor, untaught warriors had indeed scalped them, but only by pulling off their black calico curls. The children fell into one another's arms, laughing and sobbing at once.
        - id: ch01-b121
          speaker: golden_eagle
          text: >-
            Their scalps belong to us! Their unlucky hair had weak roots. It came away in the victors' hands. They did not fight or struggle, but yielded their scalps to the conquering Rock-dwellers. How small a prize is a scalp won so easily!
        - id: ch01-b122
          speaker: robert
          text: >-
            They'll take our real scalps next. Just wait and see.
          emotion: fearful
        - id: ch01-b123
          speaker: narrator
          text: Robert tried to rub some of the red ochre from his face and hands into his hair.
        - id: ch01-b124
          speaker: golden_eagle
          text: >-
            We have been cheated of our rightful, fiery revenge. Yet there are torments besides the scalping knife and the flames, though a slow fire is the proper punishment. What a strange and unnatural country this is, where a warrior cannot find enough wood to burn his enemy. In our own boundless forests, great trees grow for thousands of miles. There a warrior can always gather all the firewood he needs to burn his foes. Ah, if only we stood in our native forest once more! I wish we were back there now!
        - id: ch01-b125
          speaker: narrator
          text: >-
            The change came as suddenly as a flash of lightning. One instant, dark figures crowded around the four children. The next, every single warrior had vanished, and golden gravel shone on all sides. The Psammead must have been hidden nearby through the whole adventure. The moment Golden Eagle spoke his wish, the Sand-fairy granted it.
        - id: ch01-b126
          speaker: narrator
          text: >-
            Later, Martha came home carrying a jug with the same pattern of storks and long grasses. To Anthea's surprise and relief, Martha also brought back every penny of the money she had been given.
        - id: ch01-b127
          speaker: martha
          text: >-
            My cousin gave me the jug for luck. She said it was an odd one because the matching basin had been smashed.
        - id: ch01-b128
          speaker: anthea
          text: Oh, Martha, you are a dear!
          emotion: happy
        - id: ch01-b129
          speaker: narrator
          text: Anthea threw her arms around Martha.
        - id: ch01-b130
          speaker: martha
          text: >-
            Yes, you'd better appreciate me while you still have me. The very minute your mother comes back, I'm giving notice.
          emotion: happy
        - id: ch01-b131
          speaker: anthea
          text: Martha! We haven't been so very horrid to you, have we?
          emotion: surprised
        - id: ch01-b132
          speaker: martha
          text: >-
            Oh, it isn't that, miss. I'm going to be married. It's Beale the gamekeeper. He's been asking me now and then ever since you came home from the clergyman's house, where you were locked on the church tower. Today I finally said yes and made him a happy man.
          emotion: happy
        - id: ch01-b133
          speaker: narrator
          text: >-
            Anthea put the seven shillings and fourpence back into the missionary box. Then she carefully pasted paper over the place where the poker had broken through it. She was deeply glad that the returned money allowed her to put everything right. To this day, she still does not know whether breaking open a missionary box is a hanging offense.
