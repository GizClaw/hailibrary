audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带一点含蓄的幽默
        timbre: 温暖清亮
        pace: 从容而有变化
        pitch: 中音
    cyril:
      display_name: 西里尔
      tts:
        delivery: 自信爽快，像个爱拿主意的大孩子
        timbre: 明亮结实
        pace: 稍快
        pitch: 中高音
    anthea:
      display_name: 安西娅
      tts:
        delivery: 认真体贴，着急时干脆利落
        timbre: 清澈柔韧
        pace: 中速
        pitch: 中高音
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，偶尔一本正经
        timbre: 清亮饱满
        pace: 中速
        pitch: 中音
    jane:
      display_name: 简
      tts:
        delivery: 天真敏感，想象丰富
        timbre: 轻柔明亮
        pace: 中速
        pitch: 高音
    martha:
      display_name: 玛莎
      tts:
        delivery: 爽利泼辣，护着孩子时毫不退让
        timbre: 响亮厚实
        pace: 稍快
        pitch: 中音
    psammead:
      display_name: 赛米阿德
      tts:
        delivery: 古怪尖刻，厌烦中带着老资格的傲慢
        timbre: 干涩沙哑
        pace: 中速
        pitch: 中高音
    golden_eagle:
      display_name: 金鹰
      tts:
        delivery: 威严古朴，讲话像在举行庄严仪式
        timbre: 深沉坚实
        pace: 中慢速
        pitch: 中低音
    rock_dweller_1:
      display_name: 岩居勇士甲
      tts:
        delivery: 凶悍高亢，服从首领号令
        timbre: 粗亮
        pace: 中速
        pitch: 中音
    rock_dweller_2:
      display_name: 岩居勇士乙
      tts:
        delivery: 冷峻有力，服从首领号令
        timbre: 低沉
        pace: 中速
        pitch: 中低音
    rock_dweller_3:
      display_name: 岩居勇士丙
      tts:
        delivery: 尖厉勇猛，服从首领号令
        timbre: 清硬
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十章　剥头皮
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这一天原本也许能过得顺顺当当，只怪西里尔最近在读《最后的莫希干人》。早饭时，那本书里的故事还在他脑子里打转。他喝到第三杯茶，忽然出了神。
        - id: ch01-b02
          speaker: cyril
          text: 真希望英国也有印第安人。别来大人，只来些小个子的，大小刚好能跟我们交战。
        - id: ch01-b03
          speaker: narrator
          text: 大家当时都不同意，可谁也没把这句话当回事。后来，孩子们下到沙坑，准备向赛米阿德要一百英镑，还特意规定全换成印有维多利亚女王头像的两先令硬币，省得再弄错。他们一直以为，这么合理的愿望，结果准不会坏。可一到沙坑，他们便知道自己又闯祸了。赛米阿德困得要命，脾气也坏得很。
        - id: ch01-b04
          speaker: psammead
          text: 别烦我。你们今天的愿望早就实现了。
        - id: ch01-b05
          speaker: cyril
          text: 可我根本不知道自己许过愿。
        - id: ch01-b06
          speaker: psammead
          text: 昨天的事也忘了？你们叫我答应，不管走到哪里，许的愿都能实现。你今早许了愿，现在也已经如愿了。
        - id: ch01-b07
          speaker: robert
          text: 已经实现了？到底是什么？
        - id: ch01-b08
          speaker: psammead
          text: 连自己许了什么都忘了？没关系，很快就会知道。祝你们玩得愉快！这回可真给自己招来了一桩美事。
        - id: ch01-b09
          speaker: jane
          text: 不知道为什么，我们每回都会这样。
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: 奇怪的是，谁都想不起早上有谁许过愿。西里尔那句关于印第安人的话，压根儿没在任何人脑子里留下印象。这个上午可真难熬。每个人都拼命回想，又都想不起来，还总觉得下一刻就会有可怕的事发生。赛米阿德那番话明明是在警告他们，这次的愿望比往常更加糟糕。可是糟糕在哪里，谁也说不出。孩子们只好守着这份不安，好几个钟头都不知道灾祸会从哪儿冒出来。
        - id: ch01-b11
          speaker: narrator
          text: 快到午饭时，简被地上的《最后的莫希干人》绊了一跤。那本书当然又是面朝下扔着。安西娅刚把简和书一起扶起来，忽然大叫一声，整个人坐到了地毯上。
        - id: ch01-b12
          speaker: anthea
          text: 我想起来了！简妮，太可怕了。西里尔早饭时要的是印第安人，你不记得吗？他说希望英国也有印第安人。现在他们真来了，说不定正在全国到处剥人的头皮。
          emotion: fearful
        - id: ch01-b13
          speaker: jane
          text: 也许他们只在诺森伯兰郡和达勒姆郡。
          emotion: calm
        - id: ch01-b14
          speaker: narrator
          text: 简想安慰姐姐。要是事情发生在那么遥远的地方，似乎就很难相信，剥头皮真会叫谁痛得多厉害。
        - id: ch01-b15
          speaker: anthea
          text: 才不是！赛米阿德说，我们给自己招来了好事。那就是告诉我们，他们会到这儿来。要是他们剥了小羊羔的头皮呢？
          emotion: fearful
        - id: ch01-b16
          speaker: jane
          text: 或许太阳落山以后，头皮会重新长好。
        - id: ch01-b17
          speaker: narrator
          text: 可这次，简自己也不大相信这句安慰。
        - id: ch01-b18
          speaker: anthea
          text: 不会的！愿望带来的东西不会跟着愿望一起消失。那十五先令不还在吗？简妮，我得砸坏一样东西。你身上所有的钱也都给我，一个子儿都别留下。印第安人一定会来这里，那个坏心眼的赛米阿德几乎明说了。你明白我的计划吗？快走！
        - id: ch01-b19
          speaker: narrator
          text: 简完全不明白，可还是乖乖跟姐姐进了妈妈的卧室。安西娅取下沉重的水罐。罐上画着鹳鸟和长长的水草，那幅花样她一辈子也没忘。她先把水小心倒进浴缸，再把空罐抱回卧室，往地上一扔。
        - id: ch01-b20
          speaker: narrator
          text: 水罐要是不小心掉下去，总会应声摔碎。可你若是故意往下扔，那就完全不同。安西娅扔了三次，罐子还是好端端的。最后，她只好拿起爸爸的靴楦，硬起心肠把水罐砸碎。这活儿实在残忍。
        - id: ch01-b21
          speaker: narrator
          text: 接着，她又用拨火棍撬开传教募捐箱。简当然说这样做不对。安西娅紧紧抿了一会儿嘴。
        - id: ch01-b22
          speaker: anthea
          text: 别犯傻了，这可是生死攸关的事。
        - id: ch01-b23
          speaker: narrator
          text: 箱里只有七先令四便士。两个女孩自己的钱合起来接近四先令，所以总数超过了十一先令，这笔账很容易算。安西娅把钱包进手绢一角，打了个结。
        - id: ch01-b24
          speaker: anthea
          text: 快来，简！
        - id: ch01-b25
          speaker: narrator
          text: 她们跑到农场。农场主那天下午要进罗切斯特，原本说好把四个孩子都捎上。这个计划是在他们以为能从赛米阿德那里得到一百英镑时定下的。那时他们兴高采烈，还答应每个人付两先令车钱。如今安西娅匆匆解释，他们四个不能去了，请他改带玛莎和宝宝。农场主答应下来，不过本来能收八先令，现在只拿半克朗，他显然不大高兴。
        - id: ch01-b26
          speaker: narrator
          text: 两个女孩又跑回家。安西娅虽然心慌，做起事来却一点儿不乱。后来她回想这番安排，觉得自己眼光长远，行动果断，活像天生的将军。她从角落的抽屉里拿出一只小盒子，去找正在铺桌布的玛莎。玛莎那时的心情可不怎么好。
        - id: ch01-b27
          speaker: anthea
          text: 玛莎，听我说。我把妈妈房里的盥洗水罐打破了。
        - id: ch01-b28
          speaker: martha
          text: 就知道是你。一天到晚总要闯点祸。
        - id: ch01-b29
          speaker: narrator
          text: 玛莎把盐罐砰地墩在桌上。
        - id: ch01-b30
          speaker: anthea
          text: 亲爱的玛莎，别生气。我有钱赔一只新的，只求你疼疼我们，替我们去买。你表亲不是开瓷器店的吗？今天就买回来吧，妈妈说过，她明天也许会回家。
        - id: ch01-b31
          speaker: martha
          text: 可你们几个不是也要进城吗？
        - id: ch01-b32
          speaker: anthea
          text: 买了新水罐，我们就付不起自己的车钱。不过，只要你肯带小羊羔去，我们就替你付。你要是答应，我还把自己的利伯蒂小盒送给你。上面真的嵌着银子、象牙和乌木，漂亮得像所罗门王的圣殿。
        - id: ch01-b33
          speaker: martha
          text: 我算明白了。小姐，我不要你的盒子。你只是想把宝贝小羊羔交给我管一下午。别当我看不穿你！
        - id: ch01-b34
          speaker: narrator
          text: 这话准得叫安西娅恨不得马上否认。玛莎凭什么知道得那么清楚？可她还是忍住没开口。玛莎又砰地放下面包，震得它从木盘上跳了起来。
        - id: ch01-b35
          speaker: anthea
          text: 我确实想把水罐买回来。你会去的，对不对？
        - id: ch01-b36
          speaker: martha
          text: 好吧，就这一回。不过我走了以后，你们可别再闹出那些无法无天的乱子。我只说这一句！
        - id: ch01-b37
          speaker: anthea
          text: 农场主要早点出发，你快去换衣服吧。穿那条好看的紫裙子，再戴缀粉红矢车菊的帽子，配上黄花边领子。简会把桌子铺完，我来给小羊羔洗干净，替他穿好衣服。
        - id: ch01-b38
          speaker: narrator
          text: 安西娅给不情愿的小羊羔洗澡，匆匆套上最体面的衣服，还一趟趟往窗外看。暂时一切平安，没见一个印第安人。经过一阵奔忙，玛莎的脸越来越红，红得像深色锦缎。她总算收拾停当，带着小羊羔赶上农场主的车。等他们真的走远，安西娅才长长地吐出一口气。
        - id: ch01-b39
          speaker: anthea
          text: 他安全了！
          emotion: happy
        - id: ch01-b40
          speaker: narrator
          text: 话刚出口，她便一头扑倒在地，放声大哭。简吓坏了。她不明白，一个人刚才还那么勇敢，像位将军，怎么转眼就会像被针扎破的气球，瘪得贴到地上。当然，不瘪下去更好。不过你得记住，安西娅直到目的达到才松劲。她已经把亲爱的小羊羔送出险境，也认定印第安人只会出现在白屋周围。农场主的马车日落以后才回来，现在她总算可以哭一小会儿。
        - id: ch01-b41
          speaker: narrator
          text: 她的眼泪也有一半是高兴，因为计划真的成功了。她哭了大约三分钟。简难过地抱着她，每隔五秒钟就劝一句。
        - id: ch01-b42
          speaker: jane
          text: 亲爱的豹子，别哭了。
          emotion: calm
        - id: ch01-b43
          speaker: narrator
          text: 三分钟一到，安西娅跳起来，用围裙角使劲擦眼睛。两只眼睛因此红了整整一天。她正准备把事情告诉男孩子们，厨娘却敲响了午饭铃。大家先盛好碎牛肉，等厨娘出去以后，安西娅才讲清事情经过。
        - id: ch01-b44
          speaker: narrator
          text: 可别人正吃碎牛肉和煮土豆时，千万别讲惊心动魄的故事。那些食物不知有什么本事，竟能叫印第安人听起来索然无味，一点儿也不可信。方才还叫人害怕得要命的危险，配上盘里那堆软塌塌的午饭，忽然像是胡思乱想。两个男孩居然笑起来，还说安西娅是个小傻瓜。
        - id: ch01-b45
          speaker: cyril
          text: 我几乎敢肯定，简许愿让天气晴朗，是在我说那句话以前。
        - id: ch01-b46
          speaker: jane
          text: 才不是。
        - id: ch01-b47
          speaker: cyril
          text: 要真是印第安人，他们早就把这附近闹翻了。把盐和芥末递给我，我非得添点味道，才能咽下这摊糊糊。反正我相信，实现的是晴天那个愿望。
        - id: ch01-b48
          speaker: anthea
          text: 那赛米阿德为什么说，我们给自己招来了好事？
          emotion: angry
        - id: ch01-b49
          speaker: narrator
          text: 安西娅觉得自己明明做得又高尚又稳妥，却被叫作小傻瓜，实在太不公平。她费了那么大力气，先砸水罐，又安排车辆，才把小羊羔送到安全的地方。更糟的是，她还擅自撬开了募捐箱。里面那七先令四便士大半是铜币，如今却像一块铅，沉甸甸压在她良心上。
        - id: ch01-b50
          speaker: narrator
          text: 大家一时谁也不说话，只听厨娘走进来，收走盛碎牛肉的盘子，又把糖浆布丁端上桌。等她退出房间，西里尔马上接着说。
        - id: ch01-b51
          speaker: cyril
          text: 我不是说，把玛莎和小羊羔支开一下午有什么不好。可是愿望每次都立刻实现。要是真有印第安人，他们现在早该到了。
        - id: ch01-b52
          speaker: anthea
          text: 我猜他们已经来了，说不定就藏在灌木丛里。你实在太坏了，一点儿也不体谅人。
          emotion: angry
        - id: ch01-b53
          speaker: jane
          text: 可印第安人不是差不多总爱埋伏吗？
        - id: ch01-b54
          speaker: narrator
          text: 简只想叫大家别再吵。
        - id: ch01-b55
          speaker: cyril
          text: 根本不是。我也没有不体谅人，只是在说实话。砸水罐完全是胡闹。至于撬开募捐箱，我看那属于叛国罪。只要我们当中有人去告发，你说不定会被绞死。
        - id: ch01-b56
          speaker: robert
          text: 你就不能闭嘴吗？
          emotion: angry
        - id: ch01-b57
          speaker: narrator
          text: 西里尔偏偏闭不住。其实他心里明白，如果真来了印第安人，那全是自己的错。正因为害怕这件事是真的，他才非要说服自己，那些印第安人根本不存在。他越不愿相信，脾气便越坏。因为心里几乎认定一件事是真的，却硬逼自己不信，再没有什么比这更折磨脾气了。
        - id: ch01-b58
          speaker: cyril
          text: 你们明明看得出，实现的是简的愿望，还谈什么印第安人，简直蠢透了。瞧瞧天气多晴朗。啊！
          emotion: surprised
        - id: ch01-b59
          speaker: narrator
          text: 他转向窗户，本来只是想拿晴朗的天气作证。其他人也跟着看过去。一阵冰冷的沉默立刻封住所有人的嘴。窗角外面，一张脸从弗吉尼亚爬山虎的红叶中探进来。那张棕色的脸有长鼻子、紧抿的嘴，还有一双亮得吓人的眼睛。脸上涂着一块块彩色颜料，长长的黑发里插满羽毛。
        - id: ch01-b60
          speaker: narrator
          text: 四个孩子全都张着嘴。盘里的糖浆布丁慢慢发白变冷，可谁也动不了。忽然，那颗插羽毛的脑袋小心缩了回去，魔咒这才解开。很遗憾，安西娅开口说的第一句话，非常像女孩子会说的话。
        - id: ch01-b61
          speaker: anthea
          text: 这下看见了吧！我早就说过！
        - id: ch01-b62
          speaker: narrator
          text: 糖浆布丁已经再也不能吸引他们。可就这样丢下又太可惜，于是四个人用两周以前的《旁观者》匆匆包好各自那份布丁，塞到壁炉前皱纸饰物的后面藏好。接着，他们一口气逃上楼，一边从高处侦察，一边紧急商量对策。
        - id: ch01-b63
          speaker: cyril
          text: 讲和吧，豹子。刚才我要是太混账了，对不起。
        - id: ch01-b64
          speaker: anthea
          text: 没关系。不过你现在总算看见了。
        - id: ch01-b65
          speaker: narrator
          text: 他们从妈妈卧室的窗户向外找，却再也看不见印第安人的踪影。
        - id: ch01-b66
          speaker: robert
          text: 那我们该怎么办？
        - id: ch01-b67
          speaker: anthea
          text: 我只想得到一个办法。大家尽量打扮成印第安人，再从窗口露面，甚至走出去。他们也许会以为，我们是附近一个强大部落的首领。这样，他们怕我们报复，说不定就不敢伤害我们。
        - id: ch01-b68
          speaker: jane
          text: 可伊莱扎和厨娘怎么办？
        - id: ch01-b69
          speaker: robert
          text: 你忘了，她们看不出愿望造成的怪事。就算让人剥了头皮，或者架在小火上烤，她们也不会发觉不对。
        - id: ch01-b70
          speaker: jane
          text: 那么太阳落山以后，她们真能恢复吗？
          emotion: fearful
        - id: ch01-b71
          speaker: cyril
          text: 当然。真的被剥头皮或者烧死，不可能没感觉。就算当时没注意，第二天也一定会发现。我看安西娅的办法可行，不过我们需要多得吓人的羽毛。
        - id: ch01-b72
          speaker: robert
          text: 我去鸡舍。那里有只火鸡病得很重，好像无论发生什么都不在乎。我剪它几根羽毛，它大概也不会介意。把裁衣服的大剪刀给我。
        - id: ch01-b73
          speaker: narrator
          text: 大家仔细侦察，确定家禽院里没有敌人，罗伯特才动身。五分钟后，他抱着一大把羽毛回来了，脸色却白得吓人。
        - id: ch01-b74
          speaker: robert
          text: 这回真不是闹着玩的。我刚剪完羽毛，转身就看见一个印第安人躲在旧鸡笼下面，斜眼盯着我。我挥起羽毛大叫一声，趁他还没掀开鸡笼，赶紧逃了。豹子，快把床上的彩色毯子都拿来。
          emotion: fearful
        - id: ch01-b75
          speaker: narrator
          text: 有了毯子、羽毛和彩色围巾，人竟能把自己打扮得很像印第安人。孩子们没有长黑发，不过家里有许多原本要拿来包课本的黑棉布。他们把布剪成一条条细流苏，再拆下女孩星期日礼服上的琥珀色丝带，把流苏牢牢绑在头上。最后，他们把火鸡羽毛插进丝带。黑棉布的末端微微卷起来以后，越看越像长长的黑发。
        - id: ch01-b76
          speaker: anthea
          text: 可我们的脸颜色不对。大家都白得厉害，也不知道为什么，西里尔更是白得像油灰。
        - id: ch01-b77
          speaker: cyril
          text: 我才没有。
        - id: ch01-b78
          speaker: robert
          text: 外面那些真正的印第安人好像是棕色的。可我们应该涂成真正的红色。既然是红种人，皮肤更红似乎显得更高等。
        - id: ch01-b79
          speaker: narrator
          text: 厨娘拿来擦厨房砖地的红赭石，是全屋最红的东西。孩子们照她平时的做法，在小碟里把红赭石和牛奶调匀，再仔细涂红彼此的脸和双手。最后，他们比任何红种印第安人都够红，甚至还红过了头。
        - id: ch01-b80
          speaker: narrator
          text: 他们在过道里撞见伊莱扎。她一看见四张红脸，马上放声尖叫。孩子们这才知道，自己现在的模样一定非常吓人。这份没有开口索要、自己送上门来的证明，让他们满意极了。他们赶紧说这只是游戏，叫伊莱扎别犯傻。随后，四个裹着毯子、插着羽毛、货真价实的红种人勇敢地出门迎敌了。我说他们勇敢，只是出于礼貌。反正他们的确走了出去。
        - id: ch01-b81
          speaker: narrator
          text: 荒地和花园之间有一道树篱。树篱那边排着一列深色的脑袋，每一颗都插满羽毛。
        - id: ch01-b82
          speaker: anthea
          text: 这是唯一的机会，总比坐着等他们发动吓死人的袭击强。我们必须拼命装到底。就像打牌，手里没有爱司，也要假装有。我想那叫唬人。准备好。呜哇！
        - id: ch01-b83
          speaker: narrator
          text: 四个孩子发出四声狂野的战吼。他们从没练过，所以英国孩子能喊到这个地步，已经很不错了。他们就这样冲出大门，直奔那一列插满羽毛的脑袋。到了敌人面前，四个人各自摆出一副好战的架势。那些印第安人个头全都一样高，恰好跟西里尔差不多。
        - id: ch01-b84
          speaker: cyril
          text: 但愿他们会说英语。
        - id: ch01-b85
          speaker: narrator
          text: 西里尔一边摆着架势，一边从牙缝里说出这句话。安西娅却知道他们会说英语，尽管她自己也不知道为什么会知道。她在手杖上绑了一条白毛巾，当作休战旗挥起来。那些人果然认得。一个肤色比同伴更深的印第安人走上前来。
        - id: ch01-b86
          speaker: golden_eagle
          text: 你们要来议事吗？我是金鹰，来自强大的岩居部落。
        - id: ch01-b87
          speaker: anthea
          text: 而我是黑豹，马……马……马扎瓦蒂部落的首领。我的兄弟们，不，我是说，对，我就是这个意思，我的部落，那些马扎瓦蒂人，正在那边山头下面埋伏。
        - id: ch01-b88
          speaker: golden_eagle
          text: 那么，这几位强大的勇士是谁？
        - id: ch01-b89
          speaker: narrator
          text: 西里尔自称莫宁刚果部落的大首领松鼠。简还在吮手指，显然一个名号也想不出来，西里尔便替她介绍。
        - id: ch01-b90
          speaker: cyril
          text: 这位伟大的勇士叫野猫。在这片土地上，我们称她为凶猛简妮。她是庞大菲蒂兹部落的首领。
        - id: ch01-b91
          speaker: golden_eagle
          text: 勇敢的红种人，那么你是谁？
        - id: ch01-b92
          speaker: narrator
          text: 罗伯特毫无准备，只能说自己叫鲍勃斯，是开普骑警队的首领。
        - id: ch01-b93
          speaker: anthea
          text: 只要我们吹声口哨，所有部落都会赶来，人数远远多过你们这支小队。反抗毫无用处。兄弟，回你自己的土地去吧。跟你们的女人和巫医坐进贝壳串里，抽和平烟斗。穿上最鲜艳的圆锥帐篷，再快活地吃刚捉来的多汁软皮鞋。
        - id: ch01-b94
          speaker: cyril
          text: 你把所有东西都说乱了。
          emotion: angry
        - id: ch01-b95
          speaker: narrator
          text: 西里尔气恼地低声提醒，金鹰却只是不解地看着安西娅。
        - id: ch01-b96
          speaker: golden_eagle
          text: 黑豹啊，你们的风俗和我们不同。把你的部落带来吧。大首领应当在部下面前郑重议事。
        - id: ch01-b97
          speaker: anthea
          text: 当然可以。可他们会带上弓箭、战斧、剥头刀，还有你想得到的一切。你们要是不赶紧走，很快就会亲眼见到。
        - id: ch01-b98
          speaker: narrator
          text: 安西娅说得够勇敢，四个孩子的心却跳得发狂，气也越喘越短。真正的小印第安人带着愤怒的低语围上来，一步比一步近。阴沉残忍的面孔挤满四周，把孩子们困在中央。
        - id: ch01-b99
          speaker: robert
          text: 不管用了，我早知道骗不过去。快冲到赛米阿德那里，它也许肯帮忙。要是不肯，太阳落山时，我们大概还能活过来。不知道剥头皮是不是真的那么疼。
          emotion: fearful
        - id: ch01-b100
          speaker: anthea
          text: 我再挥一次旗子。他们只要退开，我们马上跑。
        - id: ch01-b101
          speaker: narrator
          text: 安西娅挥起毛巾，金鹰命令手下后退。孩子们立刻猛冲向队伍最薄的地方，一下撞倒五六个敌人。他们跳过那些裹着毯子的身体，直奔沙坑。现在可没时间绕到马车走的那条安全缓坡。四个人直接从沙坑边缘一头冲下去，在黄花、淡紫色小花和枯草之间又跳又攀，掠过一扇扇沙燕的小门。他们先是蹦，接着抓，随后绊倒，摔得四脚朝天，最后索性一路滚了下去。
        - id: ch01-b102
          speaker: narrator
          text: 金鹰和手下追上来时，他们正好到了早晨见过赛米阿德的地方。几个可怜的孩子跑得喘不过气，这场赛跑也彻底输了。他们再没有路可逃，只能站在那里等候命运发落。锋利的刀斧在周围闪着寒光，可比刀斧更吓人的，是金鹰和手下眼中那道残酷的光。
        - id: ch01-b103
          speaker: golden_eagle
          text: 马扎瓦蒂人的黑豹，你欺骗了我们。莫宁刚果人的松鼠，你也一样。菲蒂兹人的凶猛简妮，还有开普骑警队的鲍勃斯，你们即使没有亲口撒谎，也用沉默欺骗了我们。你们躲在白脸人的休战旗下说谎。你们没有手下，那些部落远在别处，正沿猎路追踪野兽。他们该受什么惩罚？
          emotion: angry
        - id: ch01-b104
          speakers: [rock_dweller_1, rock_dweller_2, rock_dweller_3]
          ensemble: chorus
          text: 架起火堆！
          emotion: angry
        - id: ch01-b105
          speaker: narrator
          text: 十来个自告奋勇的人立刻去找柴。每个孩子都被两个强壮的小印第安人夹住，只能绝望地四下张望。要是这会儿能看见赛米阿德，该有多好。
        - id: ch01-b106
          speaker: anthea
          text: 你们要先剥我们的头皮，再把我们烤熟吗？
          emotion: fearful
        - id: ch01-b107
          speaker: rock_dweller_1
          text: 当然！向来都是这么办。
        - id: ch01-b108
          speaker: narrator
          text: 那个红种人惊讶地瞪大眼睛，仿佛安西娅问的是世上最奇怪的问题。印第安人围成一圈，坐在地上盯着俘虏。没有人说话，四周压着一片充满威胁的寂静。过了一阵，找柴的人才两三个一批，慢吞吞地回来。他们全都两手空空，连一根能生火的树枝也没找到。说真的，在肯特郡那一带，谁也别想找到柴火。
        - id: ch01-b109
          speaker: narrator
          text: 孩子们刚松一口气，那口气却立刻变成了恐惧的呻吟。亮闪闪的刀子正在四周挥舞。每个孩子都被一个印第安人抓住。他们闭紧眼睛，拼命忍住尖叫，等着利刃割下头皮时那阵钻心的疼痛。可是疼痛迟迟没来。下一刻，敌人突然放开他们，四个人浑身发抖地瘫在一起。谁的脑袋都不疼，只觉得头顶凉飕飕的，凉得古怪。
        - id: ch01-b110
          speaker: narrator
          text: 狂野的战吼在耳边炸开。他们终于敢睁开眼，只见四个敌人围着他们又跳又叫，每个人手里都挥着一张垂满乌黑长发的头皮。孩子们慌忙去摸自己的脑袋，真正的头皮还好好长着。那些未经教化的可怜人确实剥了他们的头皮，只不过剥走的是一圈圈黑棉布假发。
        - id: ch01-b111
          speaker: narrator
          text: 四个孩子直到这时才敢喘气。他们扑进彼此怀里，紧紧抱成一团，一边哭，一边笑。
        - id: ch01-b112
          speaker: golden_eagle
          text: 他们的头皮已归我们所有！不幸的头发，根扎得那么浅！胜利者一伸手，它们便脱落。没有挣扎，没有抵抗，他们把头皮献给了征服一切的岩居人！这样轻易取得的头皮，价值何其微小！
        - id: ch01-b113
          speaker: robert
          text: 他们马上会来剥真的，你们等着瞧。
          emotion: fearful
        - id: ch01-b114
          speaker: narrator
          text: 罗伯特一边说，一边想把脸上和手上的红赭石擦到自己的头发上。金鹰的吟唱还没有结束。
        - id: ch01-b115
          speaker: golden_eagle
          text: 我们正当而炽烈的复仇遭到了愚弄！可是除了剥头刀和烈火，还有别的酷刑。不过，架在小火上慢慢烤，才是合乎规矩的办法。这个古怪而违反天性的国家啊，人竟找不到木柴来焚烧仇敌！我故乡的森林无边无际，千万英里间，大树生长，只为给我们柴火去烧死敌人。啊，但愿我们能回到故乡的森林！
        - id: ch01-b116
          speaker: narrator
          text: 金鹰最后一句刚说完，四个孩子身边便像有闪电亮了一下。上一刻还挤满四周的深色身影，一个也不剩，眼前只剩金黄的砂砾闪闪发光。赛米阿德一定从头到尾都藏在附近。它听见金鹰盼望重回故乡的森林，便抓住这句话，实现了这位印第安首领的愿望，让整个部落瞬间消失。
        - id: ch01-b117
          speaker: narrator
          text: 玛莎回来时，带着一只画有鹳鸟和长草的水罐，也把安西娅的钱一文不少地带回来了。
        - id: ch01-b118
          speaker: martha
          text: 我表姐把这只水罐送给我添好运。她说这是落单的货，因为原来配套的脸盆早就摔碎了。
        - id: ch01-b119
          speaker: anthea
          text: 啊，玛莎，你真好！
          emotion: happy
        - id: ch01-b120
          speaker: narrator
          text: 安西娅叹息着抱住她。玛莎却咯咯笑了起来。
        - id: ch01-b121
          speaker: martha
          text: 是呀，趁我还在，你最好多稀罕我一会儿。你妈妈一回来，我马上就要辞工啦。
          emotion: happy
        - id: ch01-b122
          speaker: anthea
          text: 玛莎，我们也没有对你坏得那么厉害吧？
          emotion: fearful
        - id: ch01-b123
          speaker: martha
          text: 不是为这个，小姐。我要结婚啦！新郎是看守猎场的比尔。自从你们从牧师家回来，就是你们被锁在教堂塔楼那次，他隔三岔五就向我求婚。今天我终于答应了，叫他成了个快活人。
          emotion: happy
        - id: ch01-b124
          speaker: narrator
          text: 安西娅把七先令四便士放回传教募捐箱，又拿纸糊好被拨火棍撬破的地方。能把钱还回去，她心里轻松极了。可是，撬开传教募捐箱到底会不会被判绞刑，直到今天她也不知道。
