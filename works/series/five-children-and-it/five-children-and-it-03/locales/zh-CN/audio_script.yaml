  chapters:
    - id: ch01
      title: 第三章　人人都想要他
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 孩子们刚刚拥有过无边无际的财富，可真正买到手的，只有两双棉手套、十二只一便士的小圆面包、一只仿鳄鱼皮钱包，还有一趟小马车。除此以外，他们什么真正有用或者有趣的东西也没买成。第二天醒来，他们想到自己有幸发现了普萨米德，也就是沙仙，还得到了它每天实现一个新愿望的承诺，已经不像头一天那么兴奋了。他们许过美貌和财富两个愿望，可两个愿望都没让他们真正快活。不过，稀奇古怪的事就算不大愉快，也比一天到晚除了吃饭什么都不发生有趣。何况吃饭也不见得总叫人愉快，尤其是桌上摆着冷羊肉或者肉末杂烩的时候。
        - id: ch01-b02
          speaker: narrator
          text: 大家碰巧全睡过了头。为了只迟到十分钟，他们费了九牛二虎之力才把衣服穿好，早饭前根本来不及商量。吃饭时，他们想用不偏不倚的态度谈谈沙仙，可一面认真照料小弟弟吃早饭，一面把任何问题讲透，都实在太难。偏偏羔羊宝宝那天格外活泼。他从高脚椅的栏杆里往外钻，脑袋卡在中间，脸都憋紫了。接着又猛地抄起一把大汤匙，重重敲在西里尔头上。勺子一被拿走，他反倒哭起来。他把胖拳头伸进牛奶面包粥，嚷着要下午茶才准吃的酱酱，又唱歌，又把脚搁上桌，还不停吵着要走走。
        - id: ch01-b03
          speaker: cyril
          text: 听我说，那个沙仙……当心！宝宝要把牛奶碰翻了。
        - id: ch01-b04
          speaker: narrator
          text: 牛奶赶紧挪到了安全的地方。
        - id: ch01-b05
          speaker: jane
          text: 对，咱们说那个仙子……不行呀，亲爱的羔羊，把坏勺勺给豹豹。
        - id: ch01-b06
          speaker: cyril
          text: 咱们到现在许的愿望，没有一个有好结果……快看，他刚才差点抓到芥末！
        - id: ch01-b07
          speaker: anthea
          text: 我正想，咱们是不是最好许愿……哎呀，好小子，你可闯祸了！
        - id: ch01-b08
          speaker: narrator
          text: 玻璃一闪，宝宝两只粉红的小手一挥，桌子中央的金鱼缸翻了。水和金鱼一下子全泼进宝宝和其他人的怀里。除了宝宝还镇定得很，别人全都像金鱼一样慌了。他们擦掉地上的水，追着那些乱跳乱喘的金鱼，把它们放回水里。玛莎抱走宝宝，从头到脚替他换衣服，其余的人大半也得换。泡过金鱼水的罩衫和外套全挂出去晾了。
        - id: ch01-b09
          speaker: narrator
          text: 简只剩两个选择，要么补好昨天撕破的连衣裙，要么穿着最好的衬裙过上一整天。那件衬裙雪白又柔软，周围缀着荷叶边和花边，漂亮得简直像连衣裙，说不定比裙子还漂亮。可不管它多好看，衬裙终究不是连衣裙，而玛莎定下的规矩就是规矩。她不准简穿上最好的连衣裙，也根本不肯听罗伯特那个自以为聪明的主意，让简穿着最好的衬裙，只管对别人说那是一条连衣裙。
        - id: ch01-b10
          speaker: martha
          text: 那成什么体统。
        - id: ch01-b11
          speaker: narrator
          text: 一个人只要说出这句话，别人再讲什么也没用了。总有一天，你们自己会明白。于是简只好去补裙子。那道口子是昨天她在罗切斯特大街上摔倒时弄出来的。街上刚有洒水车走过，地面湿漉漉的，闪着银光。简的膝盖被擦破了，长袜可远远不只是擦破。同一块石头先割伤膝盖和长袜，又在裙子上划开一道大口子。其他孩子当然不会卑鄙到丢下一个倒霉的同伴。他们围着草坪上的日晷坐好，简使出全身力气缝补。宝宝还在玛莎手里从头到脚换衣服，他们总算有机会认真说话了。
        - id: ch01-b12
          speaker: cyril
          text: 有话就痛快说，把你们心里想的全说出来。我最烦拐弯抹角，也最烦什么“不知道”，更烦偷偷摸摸的样子。
        - id: ch01-b13
          speaker: robert
          text: 你自己才偷偷摸摸呢。我和安西娅没像你们俩那样浑身泡了金鱼水，衣服换得快，所以有时间把事情想明白。你要问我……
        - id: ch01-b14
          speaker: jane
          text: 我可没问你。
        - id: ch01-b15
          speaker: narrator
          text: 简用牙咬断一针长的线。这件事，大人一向不许她做。
        - id: ch01-b16
          speaker: robert
          text: 问没问都一样。安西娅和我觉得，那个普萨米德心眼坏透了。它能实现咱们的愿望，当然也能实现自己的。我敢说，咱们每许一个愿，它就许愿不让咱们得到一点好处。别管那只讨厌的东西了。咱们去白垩坑，好好打一场堡垒战。
        - id: ch01-b17
          speaker: narrator
          text: 孩子们度假的房子位置好极了，正好在白垩采石场和砾石坑之间。西里尔和简却比较乐观。他们俩通常都是这样。
        - id: ch01-b18
          speaker: cyril
          text: 我不觉得沙仙是故意的。咱们要无边无际的财富，本来就很傻。五十英镑，全换成两先令一枚的钱，不是稳妥多了吗？要美得像白昼，更是蠢驴才会干的事。我不是故意说难听话，可那的确很蠢。咱们得想出一个真正有用的愿望。
        - id: ch01-b19
          speaker: jane
          text: 我也这么想。碰上这么好的机会，却不会好好用，实在太傻了。除了书里的人，我从没听说谁有过这种机会。能许的愿望多得很，总不至于个个都像前两个，变成死海鱼吧。咱们认真想一个美妙的愿望，今天剩下的时间就能真正快活了。
        - id: ch01-b20
          speaker: narrator
          text: 简说完，又像发疯一样拼命缝起来，因为时候的确不早了。四个孩子同时开口，七嘴八舌。你要是当时在场，肯定一句也听不懂。可他们早就习惯像士兵行军那样四人并排说话。每个人都能舒舒服服把自己的意见从头说到尾，顺便欣赏自己悦耳的声音，同时还从两只机灵的耳朵里，各借出四分之三去听别人。这不过是普通分数乘法里一道很容易的题。不过，我敢说你也未必会算，所以不用告诉我四分之三乘二究竟是不是一又二分之一。你只管相信，他们确实借得出这么多耳朵。我们还从莎士比亚那里知道，把耳朵借给别人，在古罗马是一件很平常的事。不过，讲到这里，我恐怕已经说教得太多了。
        - id: ch01-b21
          speaker: narrator
          text: 裙子补好以后，玛莎非让每个人洗手，他们没法马上去砾石坑。这要求真不讲理，因为除了简，谁也什么都没做。什么都不做，手怎么会脏呢？这个难题，我没法写在纸上回答。现实里我倒能很快演给你看，或者更可能，是你演给我看。
        - id: ch01-b22
          speaker: narrator
          text: 方才那场七嘴八舌的谈话里，一共借出了六只耳朵。孩子正好有四个，所以这一回，至少这笔账的确算对了。他们已经认真决定，眼下最合适的愿望就是五十英镑，而且每一枚都要换成两先令的硬币。这几个幸运的孩子，只消开口许愿，就能得到世界上的任何东西。现在，他们怀着这个重大决定，急急忙忙朝砾石坑赶去，要亲口把愿望告诉普萨米德。谁知刚刚走到门口，玛莎便从后面追了上来。她不容商量，硬要他们把羔羊宝宝也一起带出去。
        - id: ch01-b23
          speaker: martha
          text: 还说不带他！谁会不想要这个小乖乖？人人都会一心一意想要他。再说，你们答应过妈妈，每一个老天保佑的日子，都要带他出去走走。
        - id: ch01-b24
          speaker: robert
          text: 我知道答应过。可我真希望宝宝别这么小，也别这么年幼。那样带他出去才好玩些。
        - id: ch01-b25
          speaker: martha
          text: 年纪轻，过些日子自然就长好了。至于个子小，我可不信他再大一点儿，你们就更乐意抱。他已经能走几步啦。老天保佑那两条宝贝胖腿！乡下刚出炉似的新鲜空气，对你多好呀，是不是，小宝贝？
        - id: ch01-b26
          speaker: narrator
          text: 玛莎亲了宝宝，把他结结实实塞进安西娅怀里，转身回去踩缝纫机做新罩衫。她演奏起那件乐器来，快得惊人。
        - id: ch01-b27
          speaker: baby
          text: 跟豹豹走走。
        - id: ch01-b28
          speaker: narrator
          text: 宝宝快活地笑着，骑上罗伯特的背，大喊大叫，还想拿石头喂简吃。他实在可爱，没过多久，谁也不后悔带上了他。
        - id: ch01-b29
          speaker: jane
          text: 咱们该拿出整整一星期的愿望，为宝宝以后打算。就像真正的童话里，善良仙女送给小王子的礼物，咱们也能送他好多天赋。
        - id: ch01-b30
          speaker: anthea
          text: 可沙仙的愿望只到日落。宝宝长大以后，什么好处也留不住。
        - id: ch01-b31
          speaker: narrator
          text: 简听了这番提醒，只得承认她那个为宝宝安排一生的主意行不通。眼下还是许愿要五十英镑，而且全要两先令硬币更好。钱到手以后，他们可以专门拿出三英镑十五先令，照陆海军百货商店那本货物目录上的样子，给羔羊宝宝买一匹十分漂亮的摇摇马。这样，宝宝也能从今天的愿望里得到一件真正的礼物。
        - id: ch01-b32
          speaker: narrator
          text: 大家商量好，一许完愿，一拿到钱，就去请克里斯平先生再驾车送他们到罗切斯特。要是实在甩不掉玛莎，那就连她也带上。动身以前，他们还要列一张清清楚楚的单子，把真正想买的东西一件件写下来，免得又像昨天那样。孩子们心里满是希望，又立下了极好的决心，这才沿着安全却缓慢的大车道绕进砾石坑。
        - id: ch01-b33
          speaker: narrator
          text: 一走进一座座砾石堆中间，他们突然想起一件要紧的事。要是书里的孩子，这时红润的脸颊准会吓得雪白。可他们是真实的、活生生的孩子，只是猛地停住脚，彼此傻乎乎、茫然地望着。昨天，他们许愿得到无边无际的财富时，沙仙正准备拿铸好的明亮基尼金币填满整个坑，足足有几百万枚。它怕那份又沉重又辉煌的财宝把孩子们活埋，催着他们赶紧跑出去。他们的确跑了。也正因为跑得太急，谁也没像头一天那样，用石头围一个圈，标出沙仙藏身的位置。
        - id: ch01-b34
          speaker: jane
          text: 没关系，咱们很快就能找到它。
        - id: ch01-b35
          speaker: narrator
          text: 话说起来容易，做起来可难。他们在一座座砾石堆间找了又找，只找到那把海边玩沙的小铲，沙仙连影子也没有。最后大家只好坐下来休息。当然不是因为累了，也不是因为灰心，是宝宝非要下地。你一边照看一个片刻也不肯安静的宝宝，一边在沙里找碰巧丢掉的东西，怎么可能找得仔细？下次去海边，你可以请人把自己最好的小刀丢进沙里。等你开始寻找，再让小弟弟跟在身边，很快就会明白我说得一点儿不错。
        - id: ch01-b36
          speaker: narrator
          text: 乡下空气让宝宝精神十足，他蹦来跳去，活像一只沙跳虾。大孩子还想商量找到沙仙以后该许什么愿，他却只想玩。瞅准机会，他抓一把沙撒到安西娅脸上，又猛地把脑袋扎进沙里，两条胖腿朝天乱蹬。沙钻进他的眼睛，他马上大哭起来。
        - id: ch01-b37
          speaker: narrator
          text: 细心的罗伯特带了一只结实的棕色瓶子，里面装着姜汁啤酒。他料准自己一定会口渴，而这份口渴从来不会失约。眼下手边只有这一样湿东西，不管合不合适，他们总得把宝宝眼里的沙冲出来。于是大家急忙拔掉瓶塞，把姜汁倒进他的眼睛。姜汁刺得他疼极了，他哭得比刚才更响，痛苦地乱踢乱蹬，一脚踹翻了瓶子。美妙的姜汁啤酒冒着泡沫，全流进沙里，从此一去不返。
        - id: ch01-b38
          speaker: robert
          text: 还说谁都会想要他！根本没人想要他。玛莎也不是真想要，不然干吗不把他留在身边？他就是个小麻烦。真是受够了！我只希望人人都真的一心一意想要他，那样咱们这辈子也许还能清静一会儿。
          emotion: angry
        - id: ch01-b39
          speaker: narrator
          text: 简想起来，要把东西从小孩子眼里弄出来，最稳妥的办法是用柔软湿润的舌头舔。只要你像应该的那样爱宝宝，这件事并不难。宝宝很快不哭了。接着是一阵沉默。罗伯特为自己发那么大的脾气很不自在，其他人也不大满意。一个人说了不该说的话，常会遇上这种沉默。大家闭着嘴，等他自己道歉。
        - id: ch01-b40
          speaker: narrator
          text: 一声突然吐出的叹息打破了安静。四个孩子齐刷刷转过脑袋，仿佛他们鼻子上都拴着线，被人同时一拉。沙仙就在旁边坐着，多毛的脸摆出了它表示微笑的样子。
        - id: ch01-b41
          speaker: psammead
          text: 早安。这个愿望可真容易办！现在人人都想要他了。
        - id: ch01-b42
          speaker: robert
          text: 随便吧。反正这里又没有别人来，谁想要他都行。
        - id: ch01-b43
          speaker: narrator
          text: 罗伯特知道自己刚才活像一头猪，所以口气很不好。
        - id: ch01-b44
          speaker: psammead
          text: 忘恩负义，可是一种可怕的恶习。
        - id: ch01-b45
          speaker: jane
          text: 我们没有忘恩负义。刚才那个愿望不是真心许的，罗伯特只是一时说漏了嘴。您不能把它收回，再给我们一个新愿望吗？
        - id: ch01-b46
          speaker: psammead
          text: 不能。一会儿这样，一会儿那样，生意可不是这么做的。许愿以前就该小心。从前有个小男孩，懒得记那些日常东西的简单名字。他想要鱼龙，却许愿要了一头蛇颈龙。他爸爸气坏了，下午茶以前就把他赶上床，还不准他第二天跟其他孩子坐漂亮的燧石船去参加一年一度的学校郊游。郊游那天早晨，他跑到我附近，扑倒在地，两条史前时代的小腿乱踢，喊着真希望自己死掉。于是他当然死了。
        - id: ch01-b47
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 太可怕了！
          emotion: fearful
        - id: ch01-b48
          speaker: psammead
          text: 当然，他只死到日落。可对他爸爸妈妈来说，那也已经完全够受了。等他重新醒过来，你们放心，他准挨了好一顿打。他没有变成石头。到底为什么没变，我已经忘了，不过当时肯定有个说得通的原因。他的爸爸妈妈不明白，死亡只不过是睡着了，一个人最后总会在某个地方醒来。要么仍在他睡下的地方，要么就在一个更好的地方。可他让父母受了那么大的惊吓，怎么可能不挨打呢？哼，从那以后整整一个月，他连一口大地懒的肉都不准尝，只能吃牡蛎、滨螺一类再普通不过的东西。
        - id: ch01-b49
          speaker: narrator
          text: 这个可怕的故事把孩子们吓蔫了。他们惊恐地望着沙仙。宝宝却刚发现身边有个棕色多毛的东西。
        - id: ch01-b50
          speaker: baby
          text: 咪咪，咪咪，咪咪咪。
        - id: ch01-b51
          speaker: narrator
          text: 他伸手就抓。
        - id: ch01-b52
          speaker: anthea
          text: 那不是猫咪……
        - id: ch01-b53
          speaker: psammead
          text: 哎哟，我左边的胡须！别让他碰我，他身上是湿的！
          emotion: fearful
        - id: ch01-b54
          speaker: narrator
          text: 安西娅的话还没说完，沙仙已经猛地向后跳开。它吓得全身的毛都直竖起来，因为宝宝的蓝罩衫上的确洒了不少姜汁啤酒，摸起来湿乎乎的。沙仙两只手和两只脚一齐飞快地刨动，身边顿时卷起一阵沙。孩子们眨一下眼的工夫，它已经钻进沙里，消失得无影无踪。这一回，他们没有再忘记，立刻搬来石头，在那个地方仔仔细细围了一个圈。
        - id: ch01-b55
          speaker: robert
          text: 咱们还是回家吧。我会道歉的。不过这个愿望就算没好处，至少也没害处。而且现在知道那只沙东西在哪儿了，明天还能找到。
        - id: ch01-b56
          speaker: narrator
          text: 另外几个孩子很宽宏大量，谁也没责怪罗伯特。西里尔抱起已经完全恢复的宝宝，大家沿大车道离开砾石坑。大车道一出去，几乎立刻就接上了公路。
        - id: ch01-b57
          speaker: narrator
          text: 到栅门边，大家停下来，把宝宝从西里尔背上换到罗伯特背上。一辆漂亮极了的敞篷马车正好驶来。车夫和随车男仆坐在前面的高座上，车厢里是一位气派的太太。她满身白花边和红缎带，撑着红白阳伞，膝上卧着一只系红缎带的雪白小狗。她仔细瞧着宝宝，还冲他微笑。所有仆人都说宝宝特别招人喜欢，孩子们早已习惯，只礼貌地挥了挥手，以为她会继续走。谁知她叫车夫停车，又把西里尔招到跟前。
        - id: ch01-b58
          speaker: lady_chittenden
          text: 多么亲爱、多么可爱的小宝贝！我真想收养他。你们说，他妈妈会介意吗？
        - id: ch01-b59
          speaker: anthea
          text: 她会非常介意。
        - id: ch01-b60
          speaker: lady_chittenden
          text: 可我会让他过得非常优裕。你们知道，我是奇滕登夫人。你们一定在画报上见过我的照片。大家都叫我美人，当然全是胡说。不管怎么说……让我抱他一会儿。
        - id: ch01-b61
          speaker: narrator
          text: 她一边说，一边打开车门跳下来。她脚上那双红色高跟鞋奇妙极了，每只鞋的鞋面上还闪着一枚银搭扣。她伸出手，要孩子们把宝宝递给她。接过宝宝的时候，她的动作十分笨拙，抱得一点儿也不自然，仿佛这辈子从来没有抱过婴儿。孩子们还来不及把人要回来，她忽然抱紧宝宝，转身跳回马车，砰的一声关上了车门。
        - id: ch01-b62
          speaker: lady_chittenden
          text: 开车！
        - id: ch01-b63
          speaker: narrator
          text: 宝宝放声大哭，小白狗汪汪乱叫，车夫迟疑了一下。
        - id: ch01-b64
          speaker: lady_chittenden
          text: 我叫你开车！
          emotion: angry
        - id: ch01-b65
          speaker: narrator
          text: 车夫只好扬起鞭子赶车。照他后来的说法，他要是不服从命令，饭碗可就保不住了。四个孩子你看看我，我看看你，下一刻便不约而同地追上马车，紧紧攀住车后的栏杆。漂亮的马车沿着尘土飞扬的公路疾驰，宝宝的哥哥姐姐迈开八条飞快闪动的腿，跟在后面拼命奔跑。宝宝越哭越响，过了一会儿，哭声渐渐变成一阵阵打嗝似的咯咯声，接着完全安静了。孩子们听见这阵安静，就知道他已经睡着。
        - id: ch01-b66
          speaker: narrator
          text: 马车一直往前跑，那八只在尘土里飞闪的脚越来越僵，也越来越疲倦。就在孩子们快要跑不动的时候，马车终于停在一座大庄园的门房前。他们赶紧蜷起身子，藏在车后，不让任何人瞧见。奇滕登夫人从车厢里下来。她回过头，看着安安静静躺在车座上的宝宝，忽然迟疑起来。
        - id: ch01-b67
          speaker: lady_chittenden
          text: 小宝贝……我还是不吵醒他了。
        - id: ch01-b68
          speaker: narrator
          text: 她走进门房，要跟里面的女人谈一窝没孵好的黄奥品顿鸡蛋。车夫和男仆从高座跳下来，俯身看着熟睡的宝宝。
        - id: ch01-b69
          speaker: coachman
          text: 真是个好小子。真希望他是我的。
        - id: ch01-b70
          speaker: footman
          text: 他可不大像你，长得太俊了。
        - id: ch01-b71
          speaker: narrator
          text: 车夫装作没听见。
        - id: ch01-b72
          speaker: coachman
          text: 我真弄不懂她。她最恨孩子，自己一个也没有，别人家的也一个都受不了。
        - id: ch01-b73
          speaker: narrator
          text: 孩子们蹲在马车底下的白尘里，不安地交换眼色。
        - id: ch01-b74
          speaker: coachman
          text: 我跟你说，我非把这个小家伙藏进树篱，再告诉她，他哥哥把人抱走了。过一会儿，我自己回来接他。
        - id: ch01-b75
          speaker: footman
          text: 你休想。我从没这么喜欢过哪个孩子。真要有人带走他，也得是我，就这么定了。
        - id: ch01-b76
          speaker: coachman
          text: 闭上你的臭嘴！你才不想要孩子，就算想要，在你眼里哪个都一样。我可是成了家的男人，最会看品种。一流的一岁小马驹，我一眼就认得出来。这个孩子我要定了。少说几句，事情才好办。
          emotion: angry
        - id: ch01-b77
          speaker: footman
          text: 照我看，你家的孩子已经够多了吧。阿尔弗雷德、阿尔伯特、路易丝、维克托·斯坦利、海伦娜·比阿特丽斯，还有一个……
        - id: ch01-b78
          speaker: narrator
          text: 车夫听到这里，再也忍不住，一拳打在男仆下巴上。男仆也毫不客气，马上回敬一拳，正打中车夫的背心。下一刻，两个人彻底扭打起来。他们东一下，西一下，一会儿滚到里面，一会儿滚到外面，一会儿在上，一会儿在下。放眼看过去，地上简直处处都是他们挥舞的拳头和乱踢的脚。那只雪白小狗也被惊动了，它跳上马车前面的高座，冲着战团发疯似的狂吠。
        - id: ch01-b79
          speaker: narrator
          text: 西里尔仍蹲在尘土里，两条腿屈着，摇摇摆摆地挪到远离战场的车厢另一边。两个男人只顾打架，根本没有工夫留意别的。他打开车门，把熟睡的宝宝抱出来，还是弯着腰，沿公路走出十几码，来到一道通往树林的篱笆梯旁。其他人也赶紧跟了过去。他们钻进榛树、小橡树和甜栗树之间，藏在又高又密、气味浓烈的蕨丛下面。两个男人愤怒的声音响了很久，最后才被红白衣服太太更加愤怒的声音压下去。外面又经过一番漫长而焦急的寻找，马车总算驶走。孩子们一直等到车轮声远去，才敢从藏身的地方出来。
        - id: ch01-b80
          speaker: cyril
          text: 我的天哪！这下人人真的都想要他了，一点儿也不假。普萨米德又坑了咱们一回，那个狡猾的畜生！看在随便什么的分上，快把这个小家伙平平安安带回家吧。
        - id: ch01-b81
          speaker: narrator
          text: 他们小心地探出头，先朝右边张望，只看见一条空荡荡的白色公路。再朝左边看，那里除了一条同样空荡荡的白色公路，也什么都没有。这时大家才鼓起勇气，从树林回到公路上。宝宝还在安安稳稳地睡，由安西娅抱在怀里。可一路上的奇遇紧紧跟着他们，根本不给人喘气的机会。没走多远，一个背着柴捆的男孩看见了宝宝。他立刻把柴扔在路边，跑来要求仔细看看，看过以后，又坚持要替他们抱一段路。
        - id: ch01-b82
          speaker: wood_boy
          text: 让我抱一会儿吧，我会抱得稳稳的。
        - id: ch01-b83
          speaker: narrator
          text: 安西娅可不会第二次上同样的当，怎么也不肯松手。大家继续往前，那个男孩却把自己的柴扔在路边，一直跟着他们。西里尔和罗伯特不止一次请他尝尝拳头的滋味，才终于把他赶走。后来，一个穿蓝白格罩衫的小姑娘又盯上了宝宝。她跟在后面足足走了四分之一英里，一路哭，一路喊。
        - id: ch01-b84
          speaker: pinafore_girl
          text: 我要宝贝宝宝！我要宝宝！
        - id: ch01-b85
          speaker: cyril
          text: 再跟着，我们就拿所有手帕把你绑在树林的树上。等天黑了，熊会来吃你。
        - id: ch01-b86
          speaker: narrator
          text: 小姑娘听见熊，哭着跑开了。宝宝的哥哥姐姐这才渐渐明白，既然人人都想要他，每逢看见有人从路上走来，最聪明的办法就是立刻藏进树篱。他们一路上就照这个办法行事，先后躲开了一个送奶人、一个在路边干活的碎石工，还有一个赶着煤油桶车的男人。这样一来，那三个人根本没有看清宝宝，自然也没有机会对他生出那种麻烦透顶的爱意。
        - id: ch01-b87
          speaker: narrator
          text: 眼看就要到家，最糟糕的事却来了。孩子们拐过一个弯，迎面看见两辆篷车、一顶帐篷，还有一群在路边扎营的吉卜赛人。篷车四周挂得满满当当，有柳条椅、摇篮、花架和羽毛掸子。许多衣衫破旧的孩子蹲在路上，勤勤恳恳地拿尘土做泥饼。两个男人躺在草地上抽烟，三个女人拿着一只顶端早已破掉的红色旧洒水壶，洗全家人的衣服。孩子们还没来得及想出躲避的办法，男女老少就转眼围了上来，把安西娅和宝宝堵在中央。
        - id: ch01-b88
          speaker: amelia
          text: 让我抱抱他吧，小小姐。我连他一根头发丝也不会碰坏。多漂亮的小人儿呀！
        - id: ch01-b89
          speaker: anthea
          text: 我还是不愿意。
        - id: ch01-b90
          speaker: esther
          text: 把他给我吧。我自己足足有十九个呢，真的。
        - id: ch01-b91
          speaker: anthea
          text: 不行。
        - id: ch01-b92
          speaker: narrator
          text: 安西娅勇敢地拒绝，可心跳得厉害，几乎堵住了喉咙。红围巾男人挤上前来。
        - id: ch01-b93
          speaker: red_scarf_man
          text: 老天作证，就是他！这是我失散多年的亲生孩子。他左耳朵上有草莓胎记吗？没有？那就更证明是我的亲宝宝。他还天真无邪的时候就被人偷走了。把他交出来，这回我们就不叫警察抓你们。
        - id: ch01-b94
          speaker: narrator
          text: 男人说完便一把从安西娅怀里抢走宝宝。安西娅的脸一下涨得通红，纯粹是因为愤怒，接着放声大哭。其他孩子全都僵在原地。这是他们有生以来遇见过最可怕的事情，连在罗切斯特被警察抓走，也远远没有眼前这件事可怕。西里尔脸色惨白，两只手微微发抖，却先朝大家打了个手势，叫他们千万别出声。他沉默了一会儿，脑子拼命转动，终于想出了拖延的办法。
        - id: ch01-b95
          speaker: cyril
          text: 他真是你们的，我们当然不留。不过他已经习惯跟我们在一起。既然你们想要，就给你们吧。
        - id: ch01-b96
          speaker: anthea
          text: 不，不行！
          emotion: fearful
        - id: ch01-b97
          speaker: narrator
          text: 西里尔狠狠瞪了她一眼。几个女人争着从男人怀里抢宝宝，宝宝大声哭起来。
        - id: ch01-b98
          speakers: [amelia, esther, zillah]
          ensemble: chorus
          text: 我们当然想要他！
        - id: ch01-b99
          speaker: anthea
          text: 啊，他受伤了！
          emotion: fearful
        - id: ch01-b100
          speaker: cyril
          text: 闭嘴。相信我。
        - id: ch01-b101
          speaker: cyril
          text: 听着，他跟不熟的人在一起，特别难伺候。让我们先留下，等他习惯你们。到了睡觉的时候，我以名誉保证，我们会走，把他留给你们，只要那时你们还想要。等我们走了，你们再商量究竟归谁，反正个个都这么想要他。
        - id: ch01-b102
          speaker: red_scarf_man
          text: 这倒公平。
        - id: ch01-b103
          speaker: narrator
          text: 男人正想松开红围巾，宝宝一把抓紧，把围巾勒在他红木色的喉咙上，险些叫他喘不过气。吉卜赛人凑到一起低声商量。西里尔抓住机会，悄悄提醒大家。
        - id: ch01-b104
          speaker: cyril
          text: 等日落。到那时咱们就能走了。
        - id: ch01-b105
          speaker: narrator
          text: 哥哥姐姐们又惊奇又佩服，没想到他这么机灵，还记得日落。
        - id: ch01-b106
          speaker: jane
          text: 让他回我们这边吧。你们看，我们就坐在这里，替你们照顾他，等他慢慢习惯你们。
        - id: ch01-b107
          speaker: robert
          text: 那午饭怎么办？
        - id: ch01-b108
          speaker: jane
          text: 你的弟……我是说，宝宝都这样了，你居然还惦记那顿讨厌的午饭！
          emotion: angry
        - id: ch01-b109
          speaker: narrator
          text: 罗伯特小心地朝她眨眨眼。哥哥姐姐只觉得自己高尚极了，很瞧不起他，却不知道他暗中打了个周到的主意。
        - id: ch01-b110
          speaker: robert
          text: 我只回家取午饭，你们不会介意吧？我装在篮子里，再带到这里来。
        - id: ch01-b111
          speakers: [red_scarf_man, esther]
          ensemble: duo
          text: 哦，那当然！接着你就会去找警察，编一堆谎话，说这是你们的宝宝，不是我们的！你什么时候见过黄鼠狼睡大觉？
        - id: ch01-b112
          speaker: amelia
          text: 你们要是饿了，就跟我们随便吃点儿。喂，利瓦伊，这个老天保佑的孩子快把衣服扣子全哭掉了。把他还给小小姐，看她们能不能让他慢慢习惯咱们。
        - id: ch01-b113
          speaker: narrator
          text: 宝宝总算回来了，可人群围得太紧，他根本停不下哭声。
        - id: ch01-b114
          speaker: red_scarf_man
          text: 法老，生火去。姑娘们照看锅。给这孩子一个机会。
        - id: ch01-b115
          speaker: narrator
          text: 吉卜赛人很不情愿地散开干活，只留下孩子们和宝宝坐在草地上。
        - id: ch01-b116
          speaker: jane
          text: 日落以后他就没事了。可这也太可怕了！等他们清醒过来，要是气坏了怎么办？说不定会打我们，把我们绑在树上，或者做别的事。
          emotion: fearful
        - id: ch01-b117
          speaker: anthea
          text: 不会的。他们要是坏人，就不会愿意给咱们饭吃。哦，我的小羔羊，别哭啦。没事了，豹豹抱着你呢，小乖乖。
        - id: ch01-b118
          speaker: robert
          text: 饭？我才不吃他们那些恶心东西，非噎死我不可！
          emotion: disgusted
        - id: ch01-b119
          speaker: narrator
          text: 其他人这时也这么想。可饭真正做好时，午饭已经拖成晚饭，从四点到五点之间才吃上，他们个个巴不得有什么就吃什么。锅里是一只加洋葱煮的兔子，还有一只看起来很像鸡的鸟，不过腿上的肉更柴，味道也更重。宝宝吃的是热水泡面包，上面还撒了红糖。他喜欢得不得了，肯安安稳稳坐在安西娅膝上，让两个吉卜赛女人轮流一口一口喂他。
        - id: ch01-b120
          speaker: narrator
          text: 整个炎热又漫长的下午，罗伯特、西里尔、安西娅和简不得不一直逗宝宝，让他保持开心。吉卜赛人则眼巴巴地围在旁边，一刻也舍不得走开。等草地上的影子拉得又长又黑，宝宝已经真正喜欢上浅色头发的阿梅莉娅。他甚至肯朝孩子们飞吻，还肯站起身，一只手按在胸前，对两个男人深深鞠躬，活像个小绅士。整个吉卜赛营地都为他高兴得不得了。哥哥姐姐看见观众这么有兴趣，这么热心，也忍不住有一点得意，很乐意一样样展示宝宝的本领。可无论表面多开心，他们心里始终盼着太阳赶紧下山。
        - id: ch01-b121
          speaker: cyril
          text: 咱们都快养成盼日落的习惯了。真希望哪天能许个聪明又有用的愿望，太阳下山时，咱们会从心里觉得可惜。
        - id: ch01-b122
          speaker: narrator
          text: 影子越拖越长。后来，一条条影子不见了，只剩一片柔和发亮的阴影罩住万物。太阳已经躲到山后，却还不算真正落下。制定自行车车灯点亮法规的人，也是规定太阳几点落山的人。太阳必须一分一秒都照办，不然他们准会叫它好看。
        - id: ch01-b123
          speaker: narrator
          text: 吉卜赛人却越来越不耐烦。
        - id: ch01-b124
          speaker: red_scarf_man
          text: 喂，小家伙们，你们该把脑袋放到枕头上了吧？这孩子跟我们已经好得很。照你们答应的，把他交出来，然后赶紧滚蛋。
        - id: ch01-b125
          speaker: narrator
          text: 女人和孩子们围到宝宝身边，伸出胳膊，打着响指哄他。一张张友善的脸都笑得满是欣赏，可忠心的宝宝一点儿也不动心。正抱着他的简被他手脚并用地紧紧缠住。他发出了一整天里最阴沉的一声怒吼。
        - id: ch01-b126
          speaker: esther
          text: 这样可不行。把小宝贝交过来吧，小姐，我们很快就能哄好他。
        - id: ch01-b127
          speaker: narrator
          text: 可太阳还是不肯下去。
        - id: ch01-b128
          speaker: cyril
          text: 告诉她怎么哄宝宝睡觉。随便说什么，只要拖住时间。等那个老糊涂太阳终于拿定主意落下，大家就准备跑。
        - id: ch01-b129
          speaker: anthea
          text: 好吧，再过一分钟就把他给你们。不过我得先告诉你们，他晚上洗热水澡，早晨洗冷水澡。洗热水澡要放一只陶瓷兔子陪他，洗冷水澡要放一个白瓷做的小塞缪尔，他跪在红垫子上祷告。还有，千万别让肥皂进他的眼睛，不然羔羊宝宝就会……
        - id: ch01-b130
          speaker: baby
          text: 羔羊眼眼疼。
        - id: ch01-b131
          speaker: amelia
          text: 听你说的，好像我从来没给宝宝洗过澡！来，让我抱抱。到梅利娅这儿来，小宝贝。
        - id: ch01-b132
          speaker: baby
          text: 走开，丑丑！
        - id: ch01-b133
          speaker: anthea
          text: 对了，还有吃饭的事，你们真的得听清楚。他每天早晨吃一个苹果，或者一根香蕉。早饭是牛奶面包粥，下午茶有时吃鸡蛋，还有……
        - id: ch01-b134
          speaker: esther
          text: 我已经养大十个了，还不算另外几个。来吧，小姐，把他交给我。我实在忍不住了，非搂搂他不可。
        - id: ch01-b135
          speaker: red_scarf_man
          text: 到底归谁，还没商量好呢，埃丝特。
        - id: ch01-b136
          speaker: amelia_husband
          text: 怎么也轮不到你，埃丝特。你身后已经跟着七个了。
        - id: ch01-b137
          speaker: esther_husband
          text: 那可不一定。
        - id: ch01-b138
          speaker: amelia_husband
          text: 难道我不算个人，连说句话的资格都没有？
        - id: ch01-b139
          speaker: zillah
          text: 那我呢？我还没结婚，除了他，再没有别人要照料。当然应该由我带他。
        - id: ch01-b140
          speaker: red_scarf_man
          text: 闭嘴！
          emotion: angry
        - id: ch01-b141
          speaker: esther
          text: 把嘴合上！
          emotion: angry
        - id: ch01-b142
          speaker: zillah
          text: 少在我面前这么无礼！
          emotion: angry
        - id: ch01-b143
          speaker: narrator
          text: 所有人越来越生气。那些黝黑的吉卜赛面孔一张张皱起来，人人既焦急又恼火，眼看就要大吵一场。就在这时，一阵奇怪的变化掠过每一张脸，仿佛空中有块谁也看不见的海绵，从他们脸上擦过去。刚才的愤怒和焦虑一下全被擦掉了，只留下空空的茫然。孩子们朝天边一看，这才发现太阳终于真正落下去了。
        - id: ch01-b144
          speaker: narrator
          text: 可孩子们还是不敢动。过去几个小时里生出的感情，全被那块看不见的海绵从吉卜赛人心里洗掉了。他们的脑子乱成一团，谁也说不出一句话。孩子们几乎连呼吸都不敢。万一这些人恢复说话以后，想起自己一整天有多么愚蠢，忽然恼羞成怒，那该怎么办？这是个尴尬得叫人难受的时刻。最后，安西娅鼓起了莫大的勇气，把宝宝朝红围巾男人递过去。
        - id: ch01-b145
          speaker: anthea
          text: 给你！
        - id: ch01-b146
          speaker: narrator
          text: 男人向后退了一步。
        - id: ch01-b147
          speaker: red_scarf_man
          text: 我不愿夺走您的孩子，小姐。
        - id: ch01-b148
          speaker: amelia_husband
          text: 谁愿意要，就把我那一份也拿走。
        - id: ch01-b149
          speaker: esther
          text: 再说，我自己的孩子已经够多了。
        - id: ch01-b150
          speaker: amelia
          text: 不过，他真是个挺不错的小家伙。
        - id: ch01-b151
          speaker: narrator
          text: 这时只有阿梅莉娅还深情地看着呜咽的宝宝。
        - id: ch01-b152
          speaker: zillah
          text: 我准是有点儿中暑了。我才不要他。
        - id: ch01-b153
          speaker: anthea
          text: 那么，我们能带他走了吗？
        - id: ch01-b154
          speaker: pharaoh
          text: 嗯，我看你们还是带走吧。这件事，咱们谁也别再提了！
        - id: ch01-b155
          speaker: narrator
          text: 吉卜赛人马上忙着收拾帐篷，准备过夜。只有阿梅莉娅没动。她陪孩子们走到公路拐弯的地方。
        - id: ch01-b156
          speaker: amelia
          text: 让我亲他一下吧，小姐。我真不知道，咱们怎么会做出这么傻的事。不管大人在你们淘气时怎么吓唬你们，我们吉卜赛人并不偷孩子。自己的孩子通常已经够多了。可是，我的孩子们一个也不在了。
          emotion: sad
        - id: ch01-b157
          speaker: narrator
          text: 阿梅莉娅说完，慢慢俯向宝宝。宝宝没有躲，也没有像先前那样发脾气。他静静望着她的眼睛。接着，他做了一件谁也没有料到的事。他举起一只脏乎乎、软绵绵的小手，把手伸到她面前，轻轻抚摸她的脸。
        - id: ch01-b158
          speaker: baby
          text: 可怜，可怜。
          emotion: sad
        - id: ch01-b159
          speaker: narrator
          text: 他乖乖让阿梅莉娅亲了自己。不光这样，他还凑过去，回亲了一下她棕色的脸颊。那是一个很美的吻。宝宝所有的吻都是这样，一点儿也不像有些宝宝的吻，总是湿漉漉的。阿梅莉娅抬起手指，在他的额头上慢慢划动，仿佛正在那里写下什么。接着，她又在他的胸口、两只手和两只脚上，照样划了一遍。
        - id: ch01-b160
          speaker: amelia
          text: 愿他勇敢，愿他有坚强的头脑去思考，有坚强的心去爱，有坚强的双手去劳作，有坚强的双脚去远行。也愿他总能平安回到亲人身边。
        - id: ch01-b161
          speaker: narrator
          text: 她又用一种谁也听不懂的奇怪语言说了几句，然后突然换回大家听得懂的话。
        - id: ch01-b162
          speaker: amelia
          text: 好了，我该说再会了。很高兴认识你们。
        - id: ch01-b163
          speaker: narrator
          text: 她转过身，沿原路回到自己的家。她的家不是砖墙瓦顶的房子，而是路边草地上的那一顶帐篷。孩子们站在原地，一直望着她的背影，看她越走越远，最后在帐篷那边消失不见。谁也没有马上说话。
        - id: ch01-b164
          speaker: robert
          text: 她真傻！连日落也没让她恢复正常。说的全是胡话。
        - id: ch01-b165
          speaker: cyril
          text: 要是你问我，我倒觉得她人很厚道……
        - id: ch01-b166
          speaker: anthea
          text: 只是厚道？她好得不得了，我觉得她真可爱。
        - id: ch01-b167
          speaker: jane
          text: 她简直好得叫人没话说。
        - id: ch01-b168
          speaker: narrator
          text: 等他们终于回到家，下午茶早已经迟了很久，正餐更是迟得简直没法形容。玛莎自然不会轻轻放过这件事，把四个孩子从头到尾狠狠数落了一顿。不过，经历了马车、追赶和吉卜赛营地之后，最要紧的一件事到底没有出差错，羔羊宝宝总算安然无恙地回到了家。
        - id: ch01-b169
          speaker: robert
          text: 我说，到头来，咱们和别人一样，也那么想要羔羊宝宝。
        - id: ch01-b170
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: 那当然。
        - id: ch01-b171
          speaker: robert
          text: 可太阳下山以后，你们的感觉变了吗？
        - id: ch01-b172
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: 没有。
        - id: ch01-b173
          speaker: robert
          text: 那么，这个愿望在咱们身上过了日落也没消失。
        - id: ch01-b174
          speaker: cyril
          text: 不是这么回事。愿望根本没影响咱们。只要还是原来的自己，咱们就一直一心一意想要他。早晨的时候，我们不过全变成了猪，尤其是你，罗伯特。
        - id: ch01-b175
          speaker: narrator
          text: 罗伯特出奇平静地忍下了这句话。
        - id: ch01-b176
          speaker: robert
          text: 早晨我确实以为自己不想要他。也许我真是一头猪。可是，一想到咱们可能会失去他，所有事情看起来就完全不一样了。
