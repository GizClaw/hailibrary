  chapters:
    - id: ch01
      title: BEING WANTED
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The morning after the children had owned boundless wealth, they woke without yesterday's excitement. Their fortune had bought them only two pairs of cotton gloves, twelve penny buns, a false crocodile-skin purse, and a pony-cart ride. There was nothing truly useful or enjoyable among it all. On the day before, merely remembering the Psammead had filled them with delight. Finding a Sand-fairy that promised one new wish every day had seemed astonishingly lucky. But now they had tried Beauty and Wealth, and neither had made them happy. Still, strange and troublesome things were more interesting than days filled with nothing but meals. Meals are not always pleasant either, especially when the food is cold mutton or hash.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Everyone overslept, so getting dressed in time for breakfast took a desperate struggle. Even then they arrived ten minutes late. At the table they tried to discuss the Psammead calmly and fairly, but it is hard to consider anything properly while also feeding your baby brother. The Lamb was unusually lively. He squeezed his body through the bars of his high chair until he hung by his head, purple and choking. Then he seized a tablespoon without warning and struck Cyril hard on the head. When the spoon was taken away, he cried. He plunged a fat fist into his bread and milk and asked for jam, though jam was allowed only at tea. He sang, planted his feet on the table, and loudly demanded a walk.
        - id: ch01-b03
          speaker: cyril
          text: About that Sand-fairy. Look out, he'll spill the milk!
        - id: ch01-b04
          speaker: narrator
          text: The milk was moved out of reach.
        - id: ch01-b05
          speaker: anthea
          text: Yes, about the Fairy. No, Lamb dear, give Panther the naughty spoon.
        - id: ch01-b06
          speaker: cyril
          text: None of our wishes has worked out. Watch him, he nearly got the mustard!
        - id: ch01-b07
          speaker: jane
          text: Perhaps we ought to wish... Oh, look what you've done now!
        - id: ch01-b08
          speaker: narrator
          text: >-
            A flash of glass and pink baby hands sent the goldfish bowl in the middle of the table rolling sideways. Water and shining fish poured into the Lamb's lap and then into everybody else's. Everyone was nearly as distressed as the leaping, gasping fish, except the perfectly calm baby. The pool on the floor had to be mopped up. Each fish had to be caught and put back into water. Martha carried the Lamb away for a complete change, and most of the others found that they needed changing from head to foot as well.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Their pinafores and jackets, soaked in goldfish water, went out to dry. Jane now had to mend yesterday's torn dress or spend the day in her best petticoat. The petticoat was white, soft, frilly, trimmed with lace, and perhaps even prettier than a dress. But it was not a dress, and Martha's word was law. She would not allow Jane to wear her best frock instead, and she would not listen for one moment to Robert's plan of wearing the petticoat and simply calling it a dress.
        - id: ch01-b10
          speaker: martha
          text: It isn't respectable.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Once someone says that, arguing is useless, as you will discover for yourself one day. So Jane had to mend the frock. She had torn it the day before by falling in Rochester High Street, just where a passing water cart had left the road shining silver. Her knee was grazed, her stocking was damaged far beyond a mere graze, and the same stone had cut her dress. The others were not mean enough to desert a companion in trouble. They all sat on the grass around the sundial while Jane darned as fast as she could. With the Lamb still in Martha's hands having his clothes changed, conversation was finally possible.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Anthea and Robert tried to hint that the Psammead could not be trusted. Cyril wanted plain speaking.
        - id: ch01-b13
          speaker: cyril
          text: Just say what you mean. I can't stand hints and people saying they don't know when they do.
        - id: ch01-b14
          speaker: robert
          text: >-
            You're one to talk. Anthea and I weren't covered in quite as much goldfish water, so we changed first and had time to think. If you want my opinion...
        - id: ch01-b15
          speaker: jane
          text: I didn't ask for it.
        - id: ch01-b16
          speaker: narrator
          text: Jane bit through her thread, although she had often been forbidden to do it.
        - id: ch01-b17
          speaker: robert
          text: >-
            I don't care who asked. Anthea and I think the Sammyadd is a spiteful beast. If it can grant our wishes, surely it can make wishes of its own. I believe it wishes every time that ours won't help us. Let's leave it alone and play forts by ourselves in the chalk pit.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The White House stood conveniently between the chalk quarry and the gravel pit. Cyril and Jane, as usual, were more hopeful.
        - id: ch01-b19
          speaker: cyril
          text: >-
            I don't think it spoils things on purpose. Asking for endless money was foolish. Fifty pounds in two-shilling pieces would have made far more sense. And wishing to be beautiful as the day was downright donkeyish. We need to choose something truly useful.
        - id: ch01-b20
          speaker: jane
          text: >-
            Exactly. Nobody outside a book ever gets a chance like ours. There must be heaps of wishes that won't turn into Dead Sea fruit like the last two. Let's think hard and choose something nice, so what's left of today can be really jolly.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Jane dropped her sewing to speak, then stitched furiously again because the morning was slipping away. Soon all four children talked at once. If you had been there, you could not have made head or tail of it. They were used to talking four abreast, the way soldiers march. Each could say everything they wanted, enjoy the agreeable sound of their own voice, and still spare three-quarters of two sharp ears for the other three. That makes one and a half ears apiece, an easy piece of vulgar-fraction multiplication. Lending ears was common in Roman times, according to Shakespeare, but I am becoming far too instructive.
        - id: ch01-b22
          speaker: narrator
          text: >-
            When the dress was mended, Martha delayed their departure by making everyone wash their hands. This was nonsense, because nobody but Jane had done anything at all. Still, it is surprisingly easy to get dirty while doing nothing. I cannot explain how on paper, though in real life you could probably show me. During all the six-ear conversation, they had settled on fifty pounds in two-shilling pieces. These lucky children, who could ask for anything in the world, hurried toward the gravel pit to make that sensible wish. Martha caught them at the gate and insisted that the Lamb go too.
        - id: ch01-b23
          speaker: martha
          text: >-
            Not want him? Everybody would want the little duck with all their hearts. Besides, you promised your mother you'd take him out every blessed day.
        - id: ch01-b24
          speaker: robert
          text: >-
            I know. I only wish he weren't so young and small. Taking him out would be much more fun then.
        - id: ch01-b25
          speaker: martha
          text: >-
            Time will cure his youngness. And if he were bigger, you wouldn't enjoy carrying him. He can walk a little on those precious fat legs. The fresh country air does him good, bless him.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Martha kissed the Lamb, dropped him firmly into Anthea's arms, and returned to making new pinafores on her sewing machine. She played that instrument with remarkable speed. The Lamb laughed with pleasure and announced that he would walk with Panty. Then he rode on Robert's back with delighted shrieks, tried to feed Jane stones, and generally made himself so charming that nobody could remain sorry he had come.
        - id: ch01-b27
          speaker: lamb
          text: Walky with Panty!
          emotion: happy
        - id: ch01-b28
          speaker: narrator
          text: >-
            Enthusiastic Jane proposed spending a whole week's wishes on the Lamb's future. They could ask for all the gifts good fairies give infant princes in proper fairy tales and make sure he grew up fortunate. Anthea soberly reminded her that every Sand-fairy wish lasted only until sunset. No such gift could secure the baby's later years. Jane admitted that fifty pounds in two-shilling pieces would be more useful. They could spend three pounds and fifteen shillings of it on the Lamb, buying one of the splendid rocking horses pictured in the Army and Navy Stores list. The rest could still buy the sensible things on their list.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Once they had the money, Mr. Crispin would drive them into Rochester. They would take Martha if they could not avoid it, and first make a careful list of what they truly wanted. Full of hope and excellent plans, they followed the safe, slow cart road into the gravel pit. Between the gravel heaps, a sudden thought stopped them. Children in a book might have turned pale. These real children only stared at one another with blank, foolish faces. Yesterday the Psammead had been preparing to fill the quarry with millions of newly minted, shining guineas. It had sent them running outside so the heavy treasure would not bury them alive. In their haste, they had never marked its hiding place with a ring of stones.
        - id: ch01-b30
          speaker: jane
          text: Never mind. We'll find him quickly.
        - id: ch01-b31
          speaker: narrator
          text: >-
            That was easier to say than to do. They searched and searched. Their seaside spades were still there, but the Sand-fairy was nowhere. At last they sat down to rest. This was not because they were tired or discouraged, of course. The Lamb insisted on being put down, and searching carefully for anything lost in sand is nearly impossible when you must watch an active baby. Try dropping your best knife at the seaside and taking your baby brother along to help you find it. Then you will see.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Martha had been right about the country air. It had made the Lamb as lively as a sandhopper. The older children longed to go on discussing all the wishes they might make when, or if, they found the Psammead. The Lamb had plans of his own. He waited for the right moment and threw a handful of sand straight into Anthea's face. Then he suddenly burrowed his own head into the sand and waved both fat legs in the air. Naturally, the sand went into his eyes just as it had gone into Anthea's, and he began to howl.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Thoughtful Robert had brought one solid brown bottle of ginger beer. He trusted a thirst that had never failed him yet. Now the bottle had to be opened in a hurry. It held the only wet thing within reach, and somehow the sand had to be washed from the Lamb's eyes. Of course, the ginger stung horribly. The Lamb screamed more loudly than ever and kicked in anguish. In the struggle, the bottle tipped over. The beautiful ginger beer foamed away into the thirsty sand and was lost forever.
        - id: ch01-b34
          speaker: robert
          text: >-
            Everybody would want him? They don't! Martha doesn't really want him, or she'd keep him herself. He's a little nuisance. I wish everybody did want him with all their hearts. Then perhaps we'd get some peace!
          emotion: angry
        - id: ch01-b35
          speaker: narrator
          text: >-
            Jane suddenly remembered the one safe way to remove grit from a small child's eye and used her own soft wet tongue. It is easy enough when you love the baby as much as you ought. The Lamb stopped crying. A small silence followed. Robert was ashamed of losing his temper, and the others were ashamed of him too. You may have noticed that kind of silence. Someone has said what they should not, so everyone else holds their tongue and waits for that person to admit it and apologize.
        - id: ch01-b36
          speaker: narrator
          text: >-
            A sigh broke the silence, like a breath suddenly released. Every child's head turned at exactly the same instant. It was as though a string had been tied to each nose and someone had pulled all four strings together. Sitting very close to them was the Sand-fairy. On its hairy face, it wore the peculiar expression that it used as a smile.
        - id: ch01-b37
          speaker: psammead
          text: Good morning. That was quite easy. Everyone wants him now.
        - id: ch01-b38
          speaker: robert
          text: >-
            It doesn't matter. Whoever wants him, there's nobody here to... Well, never mind.
        - id: ch01-b39
          speaker: psammead
          text: Ingratitude is a dreadful vice.
        - id: ch01-b40
          speaker: jane
          text: >-
            We aren't ungrateful. But Robert didn't truly mean that wish. He only said it. Can't you undo it and let us choose another?
        - id: ch01-b41
          speaker: psammead
          text: >-
            No. Changing wishes back and forth is not business. You must be careful. Once a lazy little boy wished for a Plesiosaurus when he meant an Ichthyosaurus, because he would not remember the simple names of everyday things. His angry father sent him to bed before tea and would not let him join the next day's school treat in the lovely flint boat. On the morning of the treat, the boy threw himself down near me, kicked his little prehistoric legs, and wished he were dead. Naturally, he was.
        - id: ch01-b42
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: How horrible!
          emotion: fearful
        - id: ch01-b43
          speaker: psammead
          text: >-
            Only until sunset, of course, but that was quite enough for his parents. He was severely punished when he woke, I can tell you. He did not turn to stone, though I forget why. There must have been a reason. His parents did not understand that death is only sleep, and you must wake somewhere, either where you fell asleep or in a better place. They had suffered a dreadful shock. For frightening them so badly, he was forbidden to taste Megatherium for a month. He had to live on oysters, periwinkles, and other ordinary food.
        - id: ch01-b44
          speaker: narrator
          text: >-
            The terrible story crushed all four children. They stared at the Psammead in horror, thinking of the prehistoric boy dead until sunset and punished after he woke. At that moment, the Lamb noticed something brown and furry sitting within reach. To him it looked much more interesting than the story. He called it a fluffy pussy and made a sudden grab.
        - id: ch01-b45
          speaker: lamb
          text: Poof, poof, poofy!
        - id: ch01-b46
          speaker: anthea
          text: It isn't a pussy...
        - id: ch01-b47
          speaker: narrator
          text: The Sand-fairy sprang backward.
        - id: ch01-b48
          speaker: psammead
          text: My left whisker! Keep him away from me. He's wet!
          emotion: fearful
        - id: ch01-b49
          speaker: narrator
          text: >-
            Every hair of the Psammead's fur stood up in horror. It had good reason to fear the touch, because a great deal of ginger beer had spilled over the Lamb's blue smock. The Sand-fairy began digging wildly with all its hands and feet. In one instant, amid a spinning whirl of sand, it vanished. The children had learned from yesterday's mistake. Before going anywhere, they marked the exact spot with a ring of stones.
        - id: ch01-b50
          speaker: robert
          text: >-
            We may as well go home. I'll apologize. It may do no good, but it can't hurt, and now we know where the sandy thing is for tomorrow.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Nobody blamed Robert. Cyril picked up the Lamb, who was himself again, and they set off along the safe cart road.
        - id: ch01-b52
          speaker: narrator
          text: >-
            The cart road met the main road almost at once. At the gate, they stopped to move the Lamb from Cyril's back to Robert's. Just then a very smart open carriage appeared. A coachman and groom sat high on the box. Inside was a grand lady in a dress of white lace and red ribbons. She held a red-and-white parasol, and on her lap sat a fluffy white dog with a red ribbon around its neck. She looked at all the children, but most particularly at the baby.
        - id: ch01-b53
          speaker: narrator
          text: >-
            The lady smiled at the Lamb. People often did, because he was what all the servants called a very taking child. The brothers and sisters were used to such admiration. They waved politely and expected the carriage to continue along the road. It did not. The lady ordered the coachman to stop, then leaned out and beckoned Cyril closer.
        - id: ch01-b54
          speaker: lady_chittenden
          text: >-
            What a darling little baby! I should love to adopt him. Would his mother object?
        - id: ch01-b55
          speaker: anthea
          text: She would object very much.
        - id: ch01-b56
          speaker: lady_chittenden
          text: >-
            But I would raise him in luxury. I am Lady Chittenden. Surely you've seen my photograph in the illustrated papers. They call me beautiful, though of course that is nonsense. Anyway...
        - id: ch01-b57
          speaker: narrator
          text: >-
            She sprang from the carriage in marvelous red high-heeled shoes with silver buckles.
        - id: ch01-b58
          speaker: lady_chittenden
          text: Let me hold him for one moment.
        - id: ch01-b59
          speaker: narrator
          text: >-
            She took the Lamb awkwardly, like someone unused to babies. Then she jumped back into the carriage, still holding him, and slammed the door.
        - id: ch01-b60
          speaker: lady_chittenden
          text: Drive on!
        - id: ch01-b61
          speaker: narrator
          text: >-
            The Lamb roared, the white dog barked, and the coachman hesitated.
        - id: ch01-b62
          speaker: lady_chittenden
          text: I said drive on!
          emotion: angry
        - id: ch01-b63
          speaker: narrator
          text: >-
            The coachman obeyed. As he explained afterward, refusing her command might have cost him his position. The four children looked at one another. Then, with one mind, they raced after the carriage and caught hold behind. The smart carriage flew down the dusty road. Behind it, at double speed, the eight legs of the Lamb's brothers and sisters twinkled through the dust.
        - id: ch01-b64
          speaker: narrator
          text: >-
            The Lamb howled louder and louder. Little by little, the howls softened into hiccuping gurgles. Then all was still, and the children knew he had fallen asleep. The carriage went on and on. The eight pursuing legs had grown stiff and desperately tired before it stopped at the lodge of a grand park. The children crouched low behind the carriage. Lady Chittenden climbed out, looked at the baby asleep on the seat, and hesitated.
        - id: ch01-b65
          speaker: lady_chittenden
          text: The darling. I won't wake him.
        - id: ch01-b66
          speaker: narrator
          text: >-
            She went into the lodge to speak to the woman there about a setting of Buff Orpington eggs that had turned out badly. The instant she was gone, the coachman and groom jumped down from the box and bent admiringly over the sleeping Lamb.
        - id: ch01-b67
          speaker: coachman
          text: Fine boy. Wish he belonged to me.
        - id: ch01-b68
          speaker: groom
          text: He wouldn't look much like you. He's far too handsome.
        - id: ch01-b69
          speaker: narrator
          text: The coachman ignored the insult.
        - id: ch01-b70
          speaker: coachman
          text: >-
            I can't understand her. She hates children, has none herself, and can't stand anybody else's.
        - id: ch01-b71
          speaker: narrator
          text: Beneath the carriage, the children traded uneasy looks.
        - id: ch01-b72
          speaker: coachman
          text: >-
            I'll hide the little fellow in the hedge and tell her his brothers carried him off. Then I'll come back for him.
        - id: ch01-b73
          speaker: groom
          text: >-
            No, you won't. I've taken to that child more than anyone ever did. If somebody gets him, it will be me.
        - id: ch01-b74
          speaker: coachman
          text: >-
            Be quiet. You don't want children, and any child would do for you. I'm married, and I know good breeding when I see it. That boy is first-rate. I'm taking him, and that's settled.
        - id: ch01-b75
          speaker: groom
          text: >-
            I should think you have enough already. Alfred, Albert, Louise, Victor Stanley, Helena Beatrice, and the next one...
        - id: ch01-b76
          speaker: narrator
          text: >-
            That was as far as the groom got. The coachman struck him in the chin. The groom struck the coachman in the waistcoat. In another instant they were fighting here and there, in and out, up and down, and all over everywhere. The little white dog sprang onto the carriage box and barked as though it had gone mad.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Still crouching in the white dust, Cyril waddled on bent legs around to the side of the carriage farthest from the battle. The two men were far too busy fighting to notice him. He quietly unfastened the door, lifted out the sleeping Lamb, and carried him a dozen yards along the road. A stile there led into a wood. The others followed. Among hazels, young oaks, and sweet chestnut trees, they lay hidden under tall, strong-smelling bracken.
        - id: ch01-b78
          speaker: narrator
          text: >-
            They stayed hidden until the men's angry voices were suddenly silenced by the still angrier voice of Lady Chittenden. Then came a long and anxious search for the missing baby. At last the carriage drove away, and the children waited until even the sound of its wheels had died in the distance.
        - id: ch01-b79
          speaker: cyril
          text: >-
            My only hat! Everyone truly does want him now. That Sammyadd has tricked us again. Let's get the child safely home as fast as we can.
        - id: ch01-b80
          speaker: narrator
          text: >-
            They peered carefully from the wood. To the right there was nothing but lonely white road. To the left there was also nothing but lonely white road. That gave them courage enough to come out. They took the road home, with Anthea carrying the sleeping Lamb. Yet the wish was still working, and adventures followed every step they took.
        - id: ch01-b81
          speaker: narrator
          text: >-
            A boy carrying a bundle of sticks on his back dropped it beside the road. He asked to see the baby, then offered to carry him. Anthea would not be fooled twice. All four children walked on, but the boy followed stubbornly. Cyril and Robert could not drive him away until they had invited him more than once to come close and smell their fists.
        - id: ch01-b82
          speaker: wood_boy
          text: Let me have a look at that baby. I can carry him for you.
        - id: ch01-b83
          speaker: narrator
          text: >-
            Next, a little girl in a blue-and-white checked pinafore followed them for a quarter of a mile, crying for the precious baby.
        - id: ch01-b84
          speaker: little_girl
          text: Please let me have the precious baby!
        - id: ch01-b85
          speaker: cyril
          text: >-
            Go away, or we'll tie you to a tree with all our handkerchiefs. Then the bears can eat you after dark.
        - id: ch01-b86
          speaker: narrator
          text: >-
            The threat sent her away in tears. By now the brothers and sisters understood that hiding was safest. Whenever they saw anybody coming, they slipped into the hedge and waited. In this way, they kept the wanted Lamb from awakening the inconvenient affection of a milkman, a stone breaker, and a man whose cart carried a paraffin barrel at the back.
        - id: ch01-b87
          speaker: narrator
          text: >-
            They were nearly home when the worst danger of all appeared. Turning a corner, they found two vans, a tent, and a whole camp beside the road. Wicker chairs, cradles, flower stands, and feather brushes hung all around the vans. A crowd of ragged children worked busily at making dust pies in the road. Two men lay smoking on the grass. Three women were washing the family's clothes in an old red watering can with its top broken off.
        - id: ch01-b88
          speaker: narrator
          text: >-
            In a single moment, the peaceful-looking camp changed. Men, women, and children all left what they were doing and crowded around Anthea and the baby. There was no hedge to hide in now and no empty road along which they could run without being followed.
        - id: ch01-b89
          speaker: amelia
          text: >-
            Let me hold him, little lady. I wouldn't harm one hair on that lovely head.
        - id: ch01-b90
          speaker: anthea
          text: I'd rather you didn't.
        - id: ch01-b91
          speaker: esther
          text: Give him to me. I've raised nineteen children of my own.
        - id: ch01-b92
          speaker: anthea
          text: No.
        - id: ch01-b93
          speaker: narrator
          text: Anthea answered bravely, though her pounding heart nearly choked her.
        - id: ch01-b94
          speaker: levi
          text: >-
            Well, if that isn't my long-lost child! Has he a strawberry mark on his left ear? No? Then he must be my own baby, stolen from me in innocent infancy. Hand him over, and this time we won't call the law.
        - id: ch01-b95
          speaker: narrator
          text: >-
            Levi snatched the Lamb straight out of Anthea's arms. Her face turned scarlet, and she burst into tears of pure rage. The other children stood perfectly still. This was the most terrible thing that had ever happened to them. Even being taken up by the police in Rochester was nothing beside it. Cyril's face went white, and his hands trembled a little. Still, he made a sharp sign telling the others to be silent. He waited for one long minute and thought as hard as he could. Then he spoke.
        - id: ch01-b96
          speaker: cyril
          text: >-
            We don't want to keep him if he belongs to you. He's used to us, though. If you truly want him, you may have him.
        - id: ch01-b97
          speaker: anthea
          text: No, no!
          emotion: fearful
        - id: ch01-b98
          speaker: narrator
          text: Cyril glared at her.
        - id: ch01-b99
          speakers: [amelia, esther]
          ensemble: duo
          text: Of course we want him!
        - id: ch01-b100
          speaker: narrator
          text: >-
            Both women tried at once to pull the Lamb from Levi's arms. With hands reaching toward him from every side, the frightened baby howled as loudly as he could.
        - id: ch01-b101
          speaker: anthea
          text: You're hurting him!
          emotion: fearful
        - id: ch01-b102
          speaker: cyril
          text: Stop it!
        - id: ch01-b103
          speaker: narrator
          text: Cyril spoke savagely under his breath, then whispered to Anthea.
        - id: ch01-b104
          speaker: cyril
          text: Trust me.
        - id: ch01-b105
          speaker: cyril
          text: >-
            He's terribly troublesome with strangers. Let us stay until he knows you. At bedtime, I give you my word we'll leave him here if you still want him. Once we've gone, all of you can decide who keeps him.
        - id: ch01-b106
          speaker: levi
          text: >-
            Fair enough.
        - id: ch01-b107
          speaker: narrator
          text: >-
            The Lamb had caught hold of Levi's red neckerchief. He pulled it tighter and tighter around the man's mahogany-colored throat until Levi could barely breathe. The people of the camp drew aside and whispered together about Cyril's proposal. Cyril seized that chance to bend close to his brother and sisters and whisper his real plan.
        - id: ch01-b108
          speaker: cyril
          text: At sunset, we'll escape.
        - id: ch01-b109
          speaker: narrator
          text: The others were amazed that he had remembered.
        - id: ch01-b110
          speaker: jane
          text: >-
            Please let him come back to us. We'll sit here and care for him until he gets used to you.
        - id: ch01-b111
          speaker: robert
          text: What about dinner?
        - id: ch01-b112
          speaker: narrator
          text: The others stared at him with scorn.
        - id: ch01-b113
          speaker: jane
          text: >-
            How can you fuss about your beastly dinner when your bro... when the baby is in danger?
        - id: ch01-b114
          speaker: narrator
          text: Robert winked carefully at Jane and continued.
        - id: ch01-b115
          speaker: robert
          text: >-
            You won't mind if I run home for our food, will you? I can bring it back in a basket.
        - id: ch01-b116
          speaker: narrator
          text: >-
            His brother and sisters felt very noble and despised him for thinking about food. They did not guess his thoughtful secret plan to run home for help. The people in the camp guessed it in a moment.
        - id: ch01-b117
          speakers: [levi, pharaoh]
          ensemble: duo
          text: >-
            Oh yes, and you'll fetch the police with a pack of lies about him being yours. Do you think you can catch us asleep?
        - id: ch01-b118
          speaker: amelia
          text: >-
            If you're hungry, eat with us. Levi, that blessed child will howl every button off. Give him to the little lady so they can settle him.
        - id: ch01-b119
          speaker: narrator
          text: >-
            Levi finally handed the Lamb back to Anthea. The baby was once again with his brothers and sisters, but the people who wanted him remained packed tightly around them. With so many unfamiliar faces close to his own, he could not possibly stop howling.
        - id: ch01-b120
          speaker: levi
          text: >-
            Pharaoh, build up the fire. Girls, see to the pot. Give the child some room.
        - id: ch01-b121
          speaker: narrator
          text: >-
            Much against their wishes, the people of the camp moved away to obey. Pharaoh tended the fire, and the girls went to the cooking pot. At last the children and the Lamb were left sitting together on the grass, though eager eyes still watched them from every part of the camp.
        - id: ch01-b122
          speaker: jane
          text: >-
            He'll be safe at sunset, but this is dreadful. What if they're furious when they come to their senses? They might beat us or tie us to trees.
          emotion: fearful
        - id: ch01-b123
          speaker: anthea
          text: >-
            They won't. Lamb, please don't cry. Panty's holding you. These aren't cruel people, or they wouldn't offer us dinner.
        - id: ch01-b124
          speaker: robert
          text: Their horrible dinner? I won't eat it. It would choke me.
          emotion: disgusted
        - id: ch01-b125
          speaker: narrator
          text: >-
            The others agreed with Robert then. But the meal was finally ready between four and five, late enough to be supper, and by that time they were all glad to eat whatever they could get. There was rabbit boiled with onions. There was also a bird rather like chicken, though the meat around its legs was stringier and the taste was stronger. The Lamb received bread soaked in hot water with brown sugar scattered on top. He liked it very much and allowed Amelia and Esther to feed him while he sat safely on Anthea's lap.
        - id: ch01-b126
          speaker: narrator
          text: >-
            Through that long, hot afternoon, Cyril, Anthea, Robert, and Jane had to keep the Lamb amused and happy while the whole camp watched eagerly. As the shadows stretched long and black across the meadows, he truly grew fond of Amelia. He even let her near him willingly. He kissed his hand to the children, then stood and bowed to the two men with one hand pressed to his chest, like a gentleman. The entire camp went into raptures. His brothers and sisters could not help enjoying the chance to show off his accomplishments to such an interested and enthusiastic audience. All the same, they longed for sunset.
        - id: ch01-b127
          speaker: cyril
          text: >-
            We're making a habit of waiting for sunset. I wish we could choose one sensible wish that helped us, so we'd be sorry to see the day end.
        - id: ch01-b128
          speaker: narrator
          text: >-
            The shadows grew longer and longer. At last there were no separate shadows, only one soft glowing shade spread over everything. The sun was out of sight behind the hill, but it had not truly set. The people who make laws about lighting bicycle lamps are also the people who decide the exact minute of sunset. The sun has to follow their decision, or they would know the reason why. Meanwhile, the people in the camp were growing impatient.
        - id: ch01-b129
          speaker: levi
          text: >-
            Time for you youngsters to put your heads on your pillows. The child likes us now. Hand him over and be off, just as you promised.
        - id: ch01-b130
          speaker: narrator
          text: >-
            The women and children crowded closely around Jane and the Lamb. Arms reached toward him from every direction. Fingers snapped invitingly, and friendly faces shone with admiring smiles. Every person tried to coax him closer, but all of them failed. The Lamb had spent the afternoon learning to like his admirers, yet when they tried to take him away, he stayed loyal to the children. He wrapped both arms and both legs around Jane and let out the deepest, gloomiest roar of the entire day.
        - id: ch01-b131
          speaker: amelia
          text: >-
            It's no use, miss. Pass the little darling here. We'll soon quiet him.
        - id: ch01-b132
          speaker: narrator
          text: Still the sun refused to set.
        - id: ch01-b133
          speaker: cyril
          text: >-
            Tell her how to put him to bed. Say anything that wastes time, and be ready to run the instant the sun finally sets.
        - id: ch01-b134
          speaker: anthea
          text: >-
            I'll hand him over in one minute. First you need to know exactly how to put him to bed. He has a warm bath every night and a cold one each morning. A china rabbit always goes into the warm bath with him. For the cold bath, he has a little white china figure of Samuel saying his prayers on a red cushion. And you must be very careful, because if you let the soap get into the Lamb's eyes...
        - id: ch01-b135
          speaker: lamb
          text: Lamb's eyes.
        - id: ch01-b136
          speaker: amelia
          text: >-
            You talk as though I've never bathed a baby. Come to Amelia, my precious.
        - id: ch01-b137
          speaker: lamb
          text: Go away, ugly!
        - id: ch01-b138
          speaker: anthea
          text: >-
            And you need to know all about his meals too. Every morning he has either an apple or a banana. For breakfast he has bread and milk, and sometimes he has an egg for his tea. There are other things you must remember as well, and...
        - id: ch01-b139
          speaker: esther
          text: >-
            I've brought up ten, besides the others. Hand him over, miss. I can't wait another moment to hug him.
        - id: ch01-b140
          speaker: levi
          text: We haven't decided who gets him, Esther.
        - id: ch01-b141
          speaker: pharaoh
          text: It won't be you. Seven children already trail behind you.
        - id: ch01-b142
          speaker: esther_husband
          text: I wouldn't be too sure about that.
        - id: ch01-b143
          speaker: amelia_husband
          text: Don't I get any say in this?
        - id: ch01-b144
          speaker: zillah
          text: >-
            What about me? I'm unmarried, and I'd have nobody else to mind. I ought to keep him.
        - id: ch01-b145
          speakers: [levi, pharaoh]
          ensemble: duo
          text: Hold your tongue! Stop that impudence!
          emotion: angry
        - id: ch01-b146
          speaker: narrator
          text: >-
            Angry answers flew back and forth. Everyone wanted a voice in deciding who should own the Lamb. The dark faces around the children tightened into anxious frowns. Then a change swept across them all. It was as if an invisible sponge had wiped away every cross and worried expression and left each face empty and blank. The children knew at once that the sun had truly set.
        - id: ch01-b147
          speaker: narrator
          text: >-
            The children were afraid to move or even breathe. The people in the camp felt completely muddled. It was as though the invisible sponge had washed every feeling of the last few hours straight out of their hearts, and for a while nobody could speak. This was an awkward moment. What if they recovered their voices and became furious when they realized how foolishly they had behaved all day? At last Anthea gathered all her courage and held the Lamb out toward Levi.
        - id: ch01-b148
          speaker: anthea
          text: Here he is.
        - id: ch01-b149
          speaker: narrator
          text: Levi drew away.
        - id: ch01-b150
          speaker: levi
          text: I wouldn't want to take him from you, miss.
        - id: ch01-b151
          speaker: pharaoh
          text: Anybody else may have my share of him.
        - id: ch01-b152
          speaker: esther
          text: I have plenty of children already.
        - id: ch01-b153
          speaker: amelia
          text: He is a sweet little fellow, though.
        - id: ch01-b154
          speaker: narrator
          text: Amelia alone still looked fondly at the whimpering Lamb.
        - id: ch01-b155
          speaker: zillah
          text: >-
            I must have been overcome by the sun. I don't want him.
        - id: ch01-b156
          speaker: anthea
          text: Then may we take him home?
        - id: ch01-b157
          speaker: pharaoh
          text: >-
            Yes, you had better. We'll forget the whole business.
        - id: ch01-b158
          speaker: narrator
          text: >-
            Everyone accepted Pharaoh's suggestion with obvious relief. At once, the whole camp became extremely busy with tents, fires, pots, and every other preparation for the night. Nobody wished to discuss the strange afternoon. Only Amelia remained apart. She left the others to their work and walked beside the children as far as the bend in the road.
        - id: ch01-b159
          speaker: amelia
          text: >-
            Let me kiss him, miss. I don't know why we behaved so foolishly. Whatever people tell you when you're naughty, we don't steal babies. Mostly, we have enough of our own. But I've lost all mine.
          emotion: sad
        - id: ch01-b160
          speaker: narrator
          text: >-
            Amelia leaned slowly toward the Lamb, expecting him to draw away. Instead, he looked straight into her eyes. Then he unexpectedly lifted one grubby, soft little hand and stroked her face.
        - id: ch01-b161
          speaker: lamb
          text: Poor, poor.
          emotion: sad
        - id: ch01-b162
          speaker: narrator
          text: >-
            He allowed Amelia to kiss him. More than that, he kissed her brown cheek in return. It was a very nice kiss, as all his kisses were, and not one of the wet kisses some babies give. Amelia moved one finger over his forehead as though she were writing something there. She did the same thing over his chest, then his hands, and finally his feet.
        - id: ch01-b163
          speaker: amelia
          text: >-
            May he be brave. May his head be strong enough to think, his heart strong enough to love, his hands strong enough to work, and his feet strong enough to travel and always bring him safely home to his own.
          emotion: calm
        - id: ch01-b164
          speaker: narrator
          text: She spoke a few more words in a language none of them understood.
        - id: ch01-b165
          speaker: amelia
          text: >-
            Well, I must say goodbye. I'm glad I met you.
        - id: ch01-b166
          speaker: narrator
          text: >-
            Amelia turned away and walked back toward her home, the tent beside the grassy road. The children stood still and watched her go. Nobody spoke until she had passed around the bend and was completely out of sight.
        - id: ch01-b167
          speaker: robert
          text: >-
            How silly. Even sunset didn't set her right. What nonsense she talked.
        - id: ch01-b168
          speaker: cyril
          text: If you ask me, I thought what she did was rather decent of her.
        - id: ch01-b169
          speaker: anthea
          text: Decent? It was much more than that. What she said and did was very kind indeed. I think she's a dear.
        - id: ch01-b170
          speaker: jane
          text: I think she's simply too wonderfully nice for anything.
        - id: ch01-b171
          speaker: narrator
          text: >-
            Then the children went home together. They were very late for tea and unspeakably late for dinner. Martha scolded them, naturally, but that hardly mattered. After every danger and every person who had tried to claim him, the Lamb was safely home with his own brothers and sisters.
        - id: ch01-b172
          speaker: robert
          text: >-
            It turned out that we wanted the Lamb as much as anybody else did.
        - id: ch01-b173
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: Of course we did.
        - id: ch01-b174
          speaker: robert
          text: Do you feel differently now that the sun has set?
        - id: ch01-b175
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: No.
        - id: ch01-b176
          speaker: robert
          text: Then our wanting him lasted beyond sunset.
        - id: ch01-b177
          speaker: cyril
          text: >-
            No, it didn't last beyond sunset. The wish never changed us at all. When we're our proper selves and behaving properly, we always want him with all our hearts. This morning we forgot that and behaved like pigs, especially you, Robert.
        - id: ch01-b178
          speaker: narrator
          text: >-
            Although Cyril had singled him out for blame, Robert accepted the accusation with a strange and surprising calm.
        - id: ch01-b179
          speaker: robert
          text: >-
            This morning I truly believed I didn't want him at all. Perhaps I really was a pig. But the whole world seemed different once we thought somebody might take him away and we could lose him for good.
