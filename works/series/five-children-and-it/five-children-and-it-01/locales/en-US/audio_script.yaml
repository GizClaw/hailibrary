  chapters:
    - id: ch01
      title: BEAUTIFUL AS THE DAY
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The house stood three miles from the station. But the dusty hired carriage had not been rattling along for five minutes before the children began poking their heads out of the window. They wanted to know if they were nearly there. Whenever they passed a house, which did not happen often, they all asked if that was it. It never was. Then they reached the very top of the hill, beyond the chalk quarry and just before the gravel pit. There stood a white house, with a green garden and an orchard behind it.
        - id: ch01-b02
          speaker: mother
          text: Here we are!
        - id: ch01-b03
          speaker: robert
          text: Just look how white the house is.
        - id: ch01-b04
          speaker: anthea
          text: And look at all those roses.
        - id: ch01-b05
          speaker: jane
          text: There are plums too!
        - id: ch01-b06
          speaker: cyril
          text: Well, it does look fairly decent.
        - id: ch01-b07
          speaker: lamb
          text: Want to go walkies.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The carriage stopped with one last rattle and jolt. In the rush to get out that very instant, everybody had a foot trodden on or a leg kicked. Nobody cared. Oddly enough, Mother did not hurry. She climbed down slowly by the step, without jumping at all. Then she stayed to watch the boxes being carried in and even to pay the driver. The children knew better, for once. They were already racing around the garden and orchard, through the broken gate, past the dry fountain, and into the wild ground beyond, where thorns, thistles, briars, and brambles grew everywhere.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The house itself was not truly pretty. It was ordinary and rather inconvenient. Mother disliked the lack of shelves and the fact that there was hardly a cupboard anywhere, and Father said the ironwork along the roof looked like an architect's nightmare. None of that mattered to the children. The house was deep in the country, with no other home in sight. They had spent two whole years in London without even one day at the seaside. To them, the White House was a fairy palace in an earthly paradise. London can feel like a prison to children, especially when their family is not rich.
        - id: ch01-b10
          speaker: narrator
          text: >-
            London does have shops and theatres and entertainments, including Maskelyne and Cook's. But when money is short, you cannot buy the things in the shops, and nobody takes you to the theatre. The city also lacks the things children can play with without harming themselves or the things. There are no woods and waters, no sand and trees. Nearly everything has the wrong shape as well. Streets run flat and straight, and one looks much like another. The country is full of odd shapes. Every tree is different, and no two blades of grass are quite alike. Some tiresome person has probably told you that before. Of course, grass does not grow in the streets. Perhaps that is why town children are so often terribly naughty. They do not know what is troubling them. Neither do their fathers and mothers, their aunts and uncles, their cousins, tutors, governesses, or nurses. But I know, and now you do too. Country children can be naughty as well, though for completely different reasons.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Before anyone caught them and cleaned them for tea, the children explored the gardens and every outbuilding from end to end. They had felt sure from the first that they would be happy at the White House. The discoveries that followed made them surer still. White jasmine covered the whole back wall, blossoming thickly and smelling like the most expensive scent anyone might give you for a birthday. The lawn was green and smooth, nothing like the brown grass in Camden Town. The stable had a loft with some old hay left in it. Then Robert fell out of a broken swing and raised a lump on his head as large as an egg. Cyril caught his finger in the door of an empty rabbit hutch. After that, they had no doubts at all.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Best of all, there were no rules saying where they must not go and what they must not do. In London, almost everything wears an invisible label saying, "You mustn't touch." Even when you cannot see the label, you know it is there. If you do not know, someone soon tells you.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The White House stood on the edge of a hill. A wood rose behind it, with the chalk quarry on one side and the gravel pit on the other. Far below lay a flat plain, strange white buildings where lime was burned, a large red brewery, and other houses. When the tall chimneys smoked at sunset, the valley filled with golden mist. The limekilns and oast houses gleamed like an enchanted city from the Arabian Nights.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Now that I have started describing the place, I could go on and make a long and interesting story out of all the ordinary things the children did. They would be just the things you do yourself, and you would believe every word. If I described the children being tiresome, as you sometimes are, your aunts might take out a pencil. They would write, "How true!" or "Just like real life!" in the margin. Then you would find the words and probably feel annoyed. So I shall tell only the truly astonishing things. You may safely leave this story lying about. No aunt or uncle is likely to write "How true!" along the edge of it.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Grown-ups have great trouble believing wonderful things unless they have what they call proof. Children will believe almost anything, and grown-ups know it. That is why they tell you the earth is round like an orange, although you can see perfectly well that it looks flat and lumpy. They also say the earth travels around the sun. Yet any day, you can watch the sun rise in the morning and go to bed at night, like the good sun it is. The earth knows its place and lies as still as a mouse. I dare say you believe everything they tell you about the earth and sun. If you do, you should have no trouble believing what happened at the White House. Before Anthea, Cyril, and the others had spent a week in the country, they found a fairy. At least, they called it a fairy because it called itself one. It ought to have known what it was. Still, it looked nothing like any fairy they had ever seen, heard of, or read about.
        - id: ch01-b16
          speaker: narrator
          text: >-
            They found it in the gravel pit. Father had suddenly gone away on business, and Mother had left to stay with Granny, who was unwell. Both had departed in a hurry. Once they were gone, the house felt horribly quiet and empty. The children wandered from room to room, staring at scraps of paper and string left from the packing, and wishing for something to do. At last Cyril had an idea.
        - id: ch01-b17
          speaker: cyril
          text: Let's take our Margate spades to the gravel pit. We can dig there and pretend we're at the seaside.
        - id: ch01-b18
          speaker: anthea
          text: Father says it really was the seaside once. There are shells in the ground that are thousands of years old.
        - id: ch01-b19
          speaker: narrator
          text: >-
            So off they went. They had already peered over the edge of the gravel pit, but they had never climbed down. They were afraid Father might forbid them to play there, and they felt the same way about the chalk quarry. The gravel pit is safe enough if you avoid scrambling down its steep sides. You must take the slow road around, just as a cart would.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Each child carried a spade, and they took turns carrying the Lamb. He was the baby. They called him the Lamb because the first thing he ever said was "Baa." Anthea was known as Panther. That nickname looks silly on the page, but when you say it aloud, it sounds a little like Anthea.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The gravel pit spread very wide below them, like a giant's washbasin. Grass grew all around its upper rim, among dry, stringy wildflowers of purple and yellow. Mounds of loose gravel rose from the floor. In other places, the gravel had been dug away, leaving deep hollows in the sloping sides of the basin. Far above the children, in the steepest banks, rows of tiny holes made tiny front doors for the tiny homes of sand martins.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Naturally, the children built a castle. But a castle is poor fun when no rushing tide will ever fill its moat, sweep away its drawbridge, and finally soak everyone at least up to the waist. Cyril suggested digging a smugglers' cave. The others feared the roof might fall in and bury them alive. So they chose a different plan. All four spades went to work on a hole through the castle and all the way to Australia. They believed the earth was round, you see. That meant Australian children must be walking upside down on the other side, like flies on a ceiling, with their heads hanging into the air.
        - id: ch01-b23
          speaker: narrator
          text: >-
            They dug and dug and dug. Their hands grew hot, sandy, and red, while their faces turned damp and shiny. The Lamb had tried eating the sand because he thought it was brown sugar. When it proved not to be, he cried until he wore himself out. Now he slept in a warm, round bundle at the center of the half-built castle. With the baby asleep, the others could work properly. Soon the Australian hole was so deep that Jane, whom they also called Pussy, begged everyone to stop.
        - id: ch01-b24
          speaker: jane
          text: What if the bottom suddenly breaks? You might tumble out among the little Australians, and all this sand would fall into their eyes.
        - id: ch01-b25
          speaker: robert
          text: Then they'd hate us. They'd throw stones and never let us see the kangaroos or opossums or blue gums or Emu Brand birds. We wouldn't see anything.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Cyril and Anthea knew Australia was not quite so close. Even so, they agreed to put down the spades and use their hands instead. The sand at the bottom was soft, fine, and dry, much like beach sand. It even held tiny shells.
        - id: ch01-b27
          speaker: jane
          text: Imagine this place when the sea was here, all wet and shining, with fish and conger eels and coral and mermaids.
        - id: ch01-b28
          speaker: cyril
          text: There'd be ship masts too, and Spanish treasure from wrecks. I wish we could find a gold doubloon or something.
        - id: ch01-b29
          speaker: robert
          text: But how did anyone carry the sea away?
        - id: ch01-b30
          speaker: cyril
          text: >-
            They didn't use a bucket, silly. Father says the earth got too hot underneath, the way you do in bed. It hunched up its shoulders, and the sea slid off like blankets. The shoulder stuck out and became dry land. Let's hunt for shells in that little cave. I can see something like part of a wrecked ship's anchor, and this Australian hole is beastly hot.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The others went with him, but Anthea kept digging. Once she began something, she liked to finish it. Leaving that hole without reaching Australia would have felt disgraceful.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The cave brought nothing but disappointment. There were no shells, and the supposed anchor was only the broken end of a pickaxe handle. The children were deciding that sand made you thirstier when it was not beside the sea. Someone had just proposed going home for lemonade when Anthea screamed.
        - id: ch01-b33
          speaker: anthea
          text: Cyril! Come quickly! It's alive, and it'll get away! Hurry!
          emotion: surprised
        - id: ch01-b34
          speaker: narrator
          text: They all rushed back to her.
        - id: ch01-b35
          speaker: robert
          text: I shouldn't wonder if it's a rat. Father says old places are full of them, and this place must be ancient if the sea was here thousands of years ago.
        - id: ch01-b36
          speaker: jane
          text: Maybe it's a snake.
          emotion: fearful
        - id: ch01-b37
          speaker: cyril
          text: >-
            Let's see. Snakes don't frighten me. I like them. If it is one, I'll tame it. It can follow me everywhere and sleep around my neck at night.
        - id: ch01-b38
          speaker: robert
          text: No, it can't. I sleep in your room. You may do that if it's a rat.
        - id: ch01-b39
          speaker: anthea
          text: >-
            Don't be ridiculous. It isn't a rat. It's much larger, and it isn't a snake either. I saw feet, and fur too! Don't use the spade. You might hurt it. Dig with your hands.
        - id: ch01-b40
          speaker: cyril
          text: So it can hurt me instead? That's very likely, isn't it?
        - id: ch01-b41
          speaker: narrator
          text: Cyril grabbed a spade.
        - id: ch01-b42
          speaker: anthea
          text: >-
            Please don't, Squirrel. I know this sounds silly, but it spoke. It really did.
        - id: ch01-b43
          speaker: cyril
          text: What did it say?
        - id: ch01-b44
          speaker: anthea
          text: It said, "You leave me alone."
        - id: ch01-b45
          speaker: narrator
          text: >-
            Cyril only said Anthea must have gone out of her mind. He and Robert dug with their spades while she sat on the rim, bouncing with heat and worry. They worked carefully. Before long, everyone could see something moving at the bottom of the Australian hole.
        - id: ch01-b46
          speaker: anthea
          text: I'm not frightened. Let me do the digging.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Anthea dropped to her knees and scratched at the sand like a dog that has suddenly remembered where it buried a bone.
        - id: ch01-b48
          speaker: anthea
          text: I touched fur! I really did. I felt it!
          emotion: surprised
        - id: ch01-b49
          speaker: narrator
          text: >-
            She was half laughing and half crying. Then a dry, husky voice spoke from under the sand. Every child jumped backward, and their hearts seemed to jump just as fast.
        - id: ch01-b50
          speaker: psammead
          text: Leave me alone.
        - id: ch01-b51
          speaker: narrator
          text: This time, they all heard it. Each looked around to make sure the others had heard it too.
        - id: ch01-b52
          speaker: robert
          text: But we want to have a look at you.
        - id: ch01-b53
          speaker: anthea
          text: I wish you would come out.
        - id: ch01-b54
          speaker: psammead
          text: Oh, very well. If that is your wish.
        - id: ch01-b55
          speaker: narrator
          text: >-
            The sand stirred, whirled, and flew aside. Something brown, furry, and fat rolled out into the hole. As the sand slipped off it, the creature sat up, yawned, and rubbed the tips of its eyes with its hands.
        - id: ch01-b56
          speaker: psammead
          text: I must have fallen asleep.
        - id: ch01-b57
          speaker: narrator
          text: >-
            It stretched while the children formed a ring around the hole and stared. The creature certainly deserved a stare. Its eyes grew on long horns like a snail's and slid in and out like telescopes. Its ears resembled a bat's. Thick, soft fur covered a plump body shaped rather like a spider's, as well as its arms and legs. Its hands and feet were like a monkey's.
        - id: ch01-b58
          speaker: jane
          text: What in the world can it be? Should we bring it home?
        - id: ch01-b59
          speaker: narrator
          text: The creature swung its long eyes toward Jane.
        - id: ch01-b60
          speaker: psammead
          text: Does she always say such foolish things, or is that rubbish on her head making her silly?
        - id: ch01-b61
          speaker: narrator
          text: It gave Jane's hat a scornful look.
        - id: ch01-b62
          speaker: anthea
          text: >-
            She isn't trying to be silly. None of us is, whatever you may think. Please don't be frightened. We don't mean to hurt you.
        - id: ch01-b63
          speaker: psammead
          text: >-
            Hurt me? You think I am frightened? Upon my word! You speak as though I were no one important.
          emotion: angry
        - id: ch01-b64
          speaker: narrator
          text: Every hair on its body stood out like the fur of a cat ready to fight.
        - id: ch01-b65
          speaker: anthea
          text: >-
            Then perhaps you could tell us exactly who you are. We might find something to say that doesn't make you cross. Everything else has. Who are you? Please don't be angry. We truly don't know.
        - id: ch01-b66
          speaker: psammead
          text: >-
            You don't know? I knew the world had changed, but really! Are you seriously telling me that you cannot recognize a Psammead?
        - id: ch01-b67
          speaker: cyril
          text: A Sammyadd? That sounds like Greek to me.
        - id: ch01-b68
          speaker: psammead
          text: It sounds Greek to everyone. In plain English, I am a Sand-fairy. Surely you recognize one of those.
        - id: ch01-b69
          speaker: narrator
          text: The Sand-fairy looked so wounded that Jane hurried to answer.
        - id: ch01-b70
          speaker: jane
          text: Oh, of course I can see it now. Once you really look, it's perfectly plain.
        - id: ch01-b71
          speaker: psammead
          text: You came to look at me several sentences ago.
        - id: ch01-b72
          speaker: narrator
          text: It spoke crossly and began curling itself back into the sand.
        - id: ch01-b73
          speaker: robert
          text: >-
            Please don't disappear! Stay and talk to us. I didn't know you were a Sand-fairy, but the instant I saw you, I knew you were the most wonderful thing I'd ever seen.
        - id: ch01-b74
          speaker: narrator
          text: That made the Sand-fairy a little less disagreeable.
        - id: ch01-b75
          speaker: psammead
          text: >-
            I don't object to talking when people are reasonably civil. But I won't make polite conversation just to amuse you. Speak nicely, and perhaps I'll answer. Perhaps I won't. Go on, then. Say something.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Naturally, no one could think of a single thing to say. At last Robert found a question.
        - id: ch01-b77
          speaker: robert
          text: How long have you been living here?
        - id: ch01-b78
          speaker: psammead
          text: Oh, for ages. Several thousand years.
        - id: ch01-b79
          speaker: robert
          text: Please tell us all about it.
        - id: ch01-b80
          speaker: psammead
          text: You can find it all in books.
        - id: ch01-b81
          speaker: jane
          text: >-
            You can't be in books! Oh, do tell us everything you can about yourself. We know nothing about you, and you're so nice.
        - id: ch01-b82
          speaker: narrator
          text: The Sand-fairy stroked its long, ratlike whiskers and smiled between them.
        - id: ch01-b83
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Please tell us!
        - id: ch01-b84
          speaker: narrator
          text: >-
            It is amazing how quickly people become used to even the strangest things. Five minutes earlier, the children had no more idea than you that a Sand-fairy could exist anywhere in the world. Now they spoke to this one as if they had known it all their lives. The creature pulled in its eyes and began remembering the old days.
        - id: ch01-b85
          speaker: psammead
          text: This sunshine feels just like the old days. Where do you get your Megatheriums now?
        - id: ch01-b86
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Your what?
          emotion: surprised
        - id: ch01-b87
          speaker: narrator
          text: >-
            It is hard to remember that saying "what" is impolite, especially when you are surprised or excited.
        - id: ch01-b88
          speaker: psammead
          text: Do you still have plenty of Pterodactyls?
        - id: ch01-b89
          speaker: narrator
          text: The children had no answer at all.
        - id: ch01-b90
          speaker: psammead
          text: Then what do you eat for breakfast, and who gives it to you?
        - id: ch01-b91
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: >-
            We have eggs and bacon, bread and milk, porridge, and things like that. Mother gives it to us. But what are Mega-whatever-you-said and Ptero-whatever-they-are? Does anybody eat those for breakfast?
        - id: ch01-b92
          speaker: psammead
          text: >-
            In my time, nearly everyone ate Pterodactyl for breakfast. A Pterodactyl was a little like a crocodile and a little like a bird. I believe it tasted very good grilled. You see, there were crowds of Sand-fairies then. Early each morning, people went out hunting for us. Once they found one, it granted a wish. Families sent their little boys to the shore before breakfast to fetch the day's wishes. The eldest boy was often told to ask for a Megatherium, already cut into joints for cooking. It was as large as an elephant, so it provided plenty of meat.
        - id: ch01-b93
          speaker: psammead
          text: >-
            If a family wanted fish, they asked for an Ichthyosaurus. Those were twenty to forty feet long, which meant there was enough for everyone. A Plesiosaurus served as poultry and had plenty of good pieces on it. After breakfast was settled, the other children could use the remaining wishes. For dinner parties, though, people almost always chose Megatherium and Ichthyosaurus. The fins were a great delicacy, and the tail made soup.
        - id: ch01-b94
          speaker: anthea
          text: They must have had piles and piles of cold meat left afterward.
        - id: ch01-b95
          speaker: narrator
          text: Anthea hoped to become a good housekeeper one day.
        - id: ch01-b96
          speaker: psammead
          text: >-
            Certainly not. That would never have worked. At sunset, every leftover piece turned to stone. Even now, I am told, people find the stone bones of Megatheriums and the others everywhere.
        - id: ch01-b97
          speaker: cyril
          text: Who tells you these things?
        - id: ch01-b98
          speaker: narrator
          text: The Sand-fairy frowned and started digging furiously with its furry hands.
        - id: ch01-b99
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: >-
            Please don't go! Tell us more about the days when people ate Megatheriums for breakfast. Did the world look like this then?
        - id: ch01-b100
          speaker: narrator
          text: The creature stopped digging.
        - id: ch01-b101
          speaker: psammead
          text: >-
            Not at all. Where I lived, almost everything was sand. Coal grew on trees, and periwinkles were as large as tea trays. You can still find them, only now they are stone. Sand-fairies lived along the shore. Children came with little flint spades and flint pails and built castles for us. That was thousands of years ago, though I hear children still make sand castles. Once a habit starts, it is hard to give up.
        - id: ch01-b102
          speaker: robert
          text: Why did you stop living in the castles?
        - id: ch01-b103
          speaker: psammead
          text: >-
            That is a sorrowful story. The children would build moats. The nasty, wet, bubbling sea came pouring into them. The moment a Sand-fairy got wet, it caught cold and usually died. Our numbers grew smaller and smaller. Soon, whenever anyone found a fairy and gained a wish, they asked for a Megatherium and ate twice as much as they needed. They knew it might be weeks before they found another wish.
          emotion: sad
        - id: ch01-b104
          speaker: robert
          text: Did the water ever catch you?
        - id: ch01-b105
          speaker: narrator
          text: The Sand-fairy shuddered.
        - id: ch01-b106
          speaker: psammead
          text: >-
            Once. It touched the tip of the twelfth hair on my upper left whisker. I still feel that spot whenever the weather is damp. One wetting was more than enough. As soon as the sun dried my poor whisker, I hurried to the back of the beach. I dug a home deep in the warm, dry sand and have stayed there ever since. Later, the sea moved somewhere else. And that is the last thing I shall tell you.
        - id: ch01-b107
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Just one more thing, please. Can you still grant wishes?
        - id: ch01-b108
          speaker: psammead
          text: >-
            Of course I can. Didn't I grant one a few minutes ago? You wished that I would come out, so I came out.
        - id: ch01-b109
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Oh, please, can we have another wish?
        - id: ch01-b110
          speaker: psammead
          text: Yes, but choose quickly. I am tired of you.
        - id: ch01-b111
          speaker: narrator
          text: >-
            You have probably imagined what you would do if someone offered you three wishes. Perhaps you have laughed at the old man and woman in the black-pudding story. You felt sure that, given the chance, you could choose three sensible wishes without hesitating. These children had discussed that very question many times. Now the chance stood before them, and not one of them could decide.
        - id: ch01-b112
          speaker: psammead
          text: Hurry up.
        - id: ch01-b113
          speaker: narrator
          text: >-
            Still nobody had an idea. At last Anthea remembered a private wish that she and Jane had shared without telling the boys. She knew the boys would not care for it, but any wish was better than none.
        - id: ch01-b114
          speaker: anthea
          text: I wish that all of us could be as beautiful as the day.
        - id: ch01-b115
          speaker: narrator
          text: >-
            She spoke in a great rush. The children looked at one another, but everyone appeared exactly as plain as before. The Psammead pushed out its long eyes and held its breath. Its body swelled until it looked twice as fat and furry. Then, all at once, its breath escaped in one long sigh.
        - id: ch01-b116
          speaker: psammead
          text: I'm afraid I truly cannot do it. I must have lost the knack.
        - id: ch01-b117
          speaker: narrator
          text: The children were bitterly disappointed.
        - id: ch01-b118
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: Oh, please try once more!
        - id: ch01-b119
          speaker: psammead
          text: >-
            The truth is, I was saving some strength for the rest of your wishes. If all of you can share one wish each day, I may be able to force myself to manage it. Will you agree to that?
        - id: ch01-b120
          speakers: [anthea, jane]
          ensemble: duo
          text: Yes! Oh, yes!
        - id: ch01-b121
          speaker: narrator
          text: >-
            The boys nodded, though they did not believe the Sand-fairy could really do it. It is always easier to persuade girls to believe things than boys. The creature stretched its eyes farther than ever before. It swelled and swelled and kept on swelling.
        - id: ch01-b122
          speaker: anthea
          text: I hope it doesn't hurt itself.
        - id: ch01-b123
          speaker: robert
          text: Or split its skin.
        - id: ch01-b124
          speaker: narrator
          text: >-
            Soon the Sand-fairy was so huge that it almost filled the hole. Everyone felt relieved when it suddenly released its breath and shrank to its usual size.
        - id: ch01-b125
          speaker: psammead
          text: There, it is done. Tomorrow should be easier.
        - id: ch01-b126
          speaker: narrator
          text: It was panting heavily.
        - id: ch01-b127
          speaker: anthea
          text: Did it hurt you very much?
        - id: ch01-b128
          speaker: psammead
          text: >-
            Only my poor whisker, thank you. You are a kind and thoughtful child. Good day.
        - id: ch01-b129
          speaker: narrator
          text: >-
            The Psammead scratched fiercely with all four hands and feet and vanished into the sand. Then the children turned toward one another. Each child found itself standing alone among three complete strangers, all dazzlingly beautiful.
        - id: ch01-b130
          speaker: narrator
          text: >-
            For several moments, nobody spoke. Each believed that the others had wandered away. These lovely strangers must have crept up unnoticed while everyone watched the Sand-fairy swell. Anthea was the first to find her voice. She addressed Jane, who now had enormous blue eyes and a cloud of reddish-brown hair.
        - id: ch01-b131
          speaker: anthea
          text: Excuse me, but have you seen two little boys and a little girl anywhere near here?
        - id: ch01-b132
          speaker: jane
          text: I was about to ask you exactly the same thing.
        - id: ch01-b133
          speaker: cyril
          text: >-
            Why, it is you! I recognize that hole in your pinafore. You really are Jane, aren't you? And you must be Panther. I can see the dirty handkerchief you forgot to change after you cut your thumb. Crikey, the wish worked after all! Am I as handsome as the rest of you?
          emotion: surprised
        - id: ch01-b134
          speaker: anthea
          text: >-
            If you are Cyril, I preferred your old face. With that golden hair, you look like a picture of a young choirboy. I shouldn't be surprised if you die young. And if that is Robert, he looks like an Italian organ grinder. His hair is completely black.
        - id: ch01-b135
          speaker: robert
          text: >-
            Then you two girls look like Christmas cards. Silly Christmas cards, at that. And Jane's hair is nothing but carrots.
          emotion: angry
        - id: ch01-b136
          speaker: narrator
          text: In truth, Jane's hair had the rich red shade that artists admire so much.
        - id: ch01-b137
          speaker: anthea
          text: >-
            There's no sense criticizing one another. Let's fetch the Lamb and haul him home for dinner. Just wait until the servants see us. They'll admire us enormously.
        - id: ch01-b138
          speaker: narrator
          text: >-
            The baby was waking when they reached the castle. Every one of them felt relieved to see that he had not become beautiful as the day. He looked just as he always had.
        - id: ch01-b139
          speaker: jane
          text: >-
            I suppose he's too little for wishes to include him automatically. Next time, we'll have to mention him especially.
        - id: ch01-b140
          speaker: narrator
          text: Anthea ran forward with open arms.
        - id: ch01-b141
          speaker: anthea
          text: Come to your own Panther, ducky.
        - id: ch01-b142
          speaker: narrator
          text: >-
            Anthea was his favorite sister, but the Lamb stared at her with disapproval and pushed one sandy pink thumb into his mouth.
        - id: ch01-b143
          speaker: anthea
          text: Come along, then.
        - id: ch01-b144
          speaker: lamb
          text: Go away!
        - id: ch01-b145
          speaker: jane
          text: Come to your own Pussy.
        - id: ch01-b146
          speaker: lamb
          text: Want my Panty.
          emotion: sad
        - id: ch01-b147
          speaker: narrator
          text: His lower lip began to tremble.
        - id: ch01-b148
          speaker: robert
          text: Here, Veteran, climb onto Yobby's back and have a ride.
        - id: ch01-b149
          speaker: lamb
          text: Nasty, nasty boy!
          emotion: angry
        - id: ch01-b150
          speaker: narrator
          text: >-
            The Lamb burst into a howl, and the children understood the worst. Their own baby did not recognize them. They looked at one another in despair. At such a dreadful moment, each wanted to see the familiar, cheerful, twinkling eyes of brothers and sisters. Instead, each met only the lovely eyes of perfect strangers.
        - id: ch01-b151
          speaker: cyril
          text: >-
            This is absolutely awful. We have to make friends with him! I cannot carry him home while he screams like that. Imagine having to make friends with our own baby. It's too ridiculous.
        - id: ch01-b152
          speaker: narrator
          text: >-
            Ridiculous or not, that was exactly what they did. It took more than an hour to persuade their own baby that they could be trusted. By then, the Lamb was as hungry as a lion and as thirsty as a desert, which made their task no easier. At last he allowed the strangers to carry him home in turns. He still refused to put his arms around such new acquaintances. That left his whole weight in their arms, and carrying him became exhausting work.
        - id: ch01-b153
          speaker: jane
          text: Thank goodness we're finally home! Here, Martha, please take the baby.
        - id: ch01-b154
          speaker: narrator
          text: >-
            Jane staggered through the iron gate. Martha, the nursemaid, stood at the front door, shading her eyes as she searched the road. She snatched the Lamb straight out of Jane's arms.
        - id: ch01-b155
          speaker: martha
          text: Thank goodness he's back safely. But where are the others, and who in goodness gracious are all of you?
        - id: ch01-b156
          speaker: robert
          text: Why, we're us, of course.
        - id: ch01-b157
          speaker: martha
          text: And who is "us," if you please?
        - id: ch01-b158
          speaker: cyril
          text: >-
            I keep telling you, we're us. We're only beautiful as the day now. I'm Cyril, these are the others, and we're jolly hungry. Let us inside, and stop being such a silly idiot.
        - id: ch01-b159
          speaker: narrator
          text: >-
            Martha muttered about Cyril's impudence and tried to shut the door in his face.
        - id: ch01-b160
          speaker: anthea
          text: >-
            I know our faces are different, but I truly am Anthea. We're worn out, and dinner time was ages ago.
        - id: ch01-b161
          speaker: martha
          text: >-
            Then go home and eat your own dinners, whoever you are. If our children told you to put on this performance, you may tell them from me that they'll be punished. They'll know exactly what to expect.
        - id: ch01-b162
          speaker: narrator
          text: >-
            With that, Martha slammed the door. Cyril rang the bell as hard as he could. Nobody came. After a while, Cook leaned out of an upstairs bedroom window.
        - id: ch01-b163
          speaker: cook
          text: >-
            If you lot don't clear off, and quickly too, I'll fetch the police.
        - id: ch01-b164
          speaker: narrator
          text: She banged the window shut.
        - id: ch01-b165
          speaker: anthea
          text: It's hopeless. Please, please come away before they send us to prison.
          emotion: fearful
        - id: ch01-b166
          speaker: narrator
          text: >-
            The boys said that was nonsense. The law of England could not imprison anyone merely for being as beautiful as the day. All the same, they followed the girls back into the lane.
        - id: ch01-b167
          speaker: jane
          text: I suppose we'll look like ourselves again after sunset.
        - id: ch01-b168
          speaker: cyril
          text: >-
            I don't know. It may not work that way anymore. Things have changed a great deal since the time of Megatheriums.
          emotion: sad
        - id: ch01-b169
          speaker: anthea
          text: >-
            Oh! What if we turn into stone at sunset, just as the Megatheriums did? Then none of us would be left over for tomorrow.
          emotion: fearful
        - id: ch01-b170
          speaker: narrator
          text: >-
            Anthea began to cry, and Jane cried too. Even the boys went pale. No one could think of anything worth saying.
        - id: ch01-b171
          speaker: narrator
          text: >-
            It was a horrible afternoon. There was no nearby house where they could beg for a crust of bread or even a glass of water. They dared not enter the village, because Martha had gone there carrying a basket, and a local policeman lived there. Being beautiful as the day gives very little comfort when you are as hungry as a hunter and as thirsty as a sponge.
        - id: ch01-b172
          speaker: narrator
          text: >-
            Three times, the children returned to the White House and tried to make the servants listen. Three times, they failed. Then Robert went by himself. He hoped to climb through a back window and open the door for the others. Every window was beyond his reach. Martha appeared at an upper window, emptied a jug of cold water over him, and called down to him.
        - id: ch01-b173
          speaker: martha
          text: Go away, you nasty little Italian monkey!
          emotion: angry
        - id: ch01-b174
          speaker: narrator
          text: >-
            At last, the four children sat in a row beneath the hedge, with their feet in a dry ditch. They waited for sunset and wondered whether it would turn them to stone or merely restore their old, ordinary faces. Each still felt lonely, as though surrounded by strangers. They tried not to look at one another. Their voices sounded familiar, but those shining, beautiful faces were almost irritating to see.
        - id: ch01-b175
          speaker: robert
          text: >-
            I don't think we will turn to stone. The Sand-fairy promised us another wish tomorrow. It couldn't grant one if we were statues, could it?
        - id: ch01-b176
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: No, I suppose it couldn't.
        - id: ch01-b177
          speaker: narrator
          text: They did not feel any better. Another, longer silence followed.
        - id: ch01-b178
          speaker: cyril
          text: >-
            I don't want to frighten you girls, but I think it's starting already. I cannot feel my foot at all. It must be turning to stone, and yours will begin in a minute.
          emotion: fearful
        - id: ch01-b179
          speaker: robert
          text: >-
            Never mind. Perhaps you'll be the only one who turns to stone. The rest of us might be fine. We'll treasure your statue and hang garlands on it.
        - id: ch01-b180
          speaker: narrator
          text: >-
            In fact, Cyril's foot had only fallen asleep because he had been sitting on it too long. When it woke again in a storm of pins and needles, everyone else became quite cross.
        - id: ch01-b181
          speaker: anthea
          text: You frightened us all, and there was nothing wrong at all!
          emotion: angry
        - id: ch01-b182
          speaker: narrator
          text: >-
            A third silence began, and this one was the most miserable yet. Jane finally broke it.
        - id: ch01-b183
          speaker: jane
          text: >-
            If everything ends safely, we should ask the Sammyadd to make the servants notice no difference in us, whatever we wish for.
        - id: ch01-b184
          speaker: narrator
          text: >-
            The others only grunted. They felt too wretched even to make good resolutions. Then hunger, fear, bad temper, and weariness joined together. Four unpleasant things produced one pleasant thing at last. The children fell asleep. They lay in a row with their beautiful eyes closed and their beautiful mouths open.
        - id: ch01-b185
          speaker: narrator
          text: >-
            Anthea woke first. The sun was down, and twilight was spreading around them. She pinched herself very hard. The pinch hurt, so she decided she could not be stone. Then she pinched the others. They were soft too.
        - id: ch01-b186
          speaker: anthea
          text: >-
            Wake up! Everything is all right. We haven't turned to stone. Oh, Cyril, you look so nicely ugly again, with your old freckles and brown hair and little eyes. All of you look nicely ugly too!
          emotion: happy
        - id: ch01-b187
          speaker: narrator
          text: She added the last part so none of the others would feel jealous.
        - id: ch01-b188
          speaker: narrator
          text: >-
            When they reached home, Martha scolded them severely. She also told them about the strange children who had appeared at the door.
        - id: ch01-b189
          speaker: martha
          text: They were a fine-looking lot, I grant you, but the impudence of them!
        - id: ch01-b190
          speaker: robert
          text: I know.
        - id: ch01-b191
          speaker: narrator
          text: >-
            Robert had learned how useless it was to explain such things to Martha.
        - id: ch01-b192
          speaker: martha
          text: And where in the world have you naughty little things been all this time?
        - id: ch01-b193
          speaker: robert
          text: We were in the lane.
        - id: ch01-b194
          speaker: martha
          text: Then why didn't you come home hours ago?
        - id: ch01-b195
          speaker: anthea
          text: Those other children wouldn't let us.
        - id: ch01-b196
          speaker: martha
          text: What other children?
        - id: ch01-b197
          speaker: anthea
          text: >-
            The ones who were as beautiful as the day. They kept us there until sunset. We couldn't return before they went away. You have no idea how much we hated them! Please, please give us some supper. We're starving.
        - id: ch01-b198
          speaker: martha
          text: >-
            Hungry? Of course you are, after staying out all day. Let this teach you not to make friends with strange children. They've probably come down here after having measles. If you see them again, do not speak one word to them. Do not even look at them. Come straight home and tell me. I'll spoil their beauty for them!
          emotion: angry
        - id: ch01-b199
          speaker: anthea
          text: If we ever see them again, we'll be sure to tell you.
        - id: ch01-b200
          speaker: narrator
          text: >-
            Cook entered with a tray of cold beef. Robert gazed at it lovingly and spoke from the bottom of his heart.
        - id: ch01-b201
          speaker: robert
          text: And we'll take very good care never to see those children again.
        - id: ch01-b202
          speaker: narrator
          text: And they never have.
