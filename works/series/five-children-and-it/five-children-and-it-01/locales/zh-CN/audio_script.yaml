audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带一点含蓄的幽默
        timbre: 温暖清亮
        pace: 从容而有变化
        pitch: 中音
    mother:
      display_name: 妈妈
      tts:
        delivery: 温和自然
        timbre: 柔和清晰
        pace: 舒缓
        pitch: 中音
    cyril:
      display_name: 西里尔
      tts:
        delivery: 自信爽快，像个爱拿主意的大孩子
        timbre: 明亮结实
        pace: 稍快
        pitch: 中高音
    anthea:
      display_name: 安西娅
      tts:
        delivery: 认真体贴，着急时干脆利落
        timbre: 清澈柔韧
        pace: 中速
        pitch: 中高音
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，偶尔一本正经
        timbre: 清亮饱满
        pace: 中速
        pitch: 中音
    jane:
      display_name: 简
      tts:
        delivery: 天真敏感，想象丰富
        timbre: 轻柔明亮
        pace: 中速
        pitch: 高音
    baby:
      display_name: 羔羊宝宝
      tts:
        delivery: 幼小直接，句子短而清楚
        timbre: 稚嫩柔软
        pace: 稍慢
        pitch: 高音
    psammead:
      display_name: 沙仙
      tts:
        delivery: 沙哑古怪，骄傲又容易不耐烦
        timbre: 干涩粗哑
        pace: 中慢速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第一章　美如白昼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那所房子离车站足足有三英里。雇来的马车沿着尘土飞扬的道路往前走，车轮不断颠簸。可出发还不到五分钟，孩子们就已经等不及了。他们一个接一个把头探出车窗，一遍遍追问是不是到了。路旁偶尔出现一幢房子，他们便立刻一齐嚷起来，以为那就是自己的新家，可每一回都猜错了。马车继续向前，慢慢爬上山顶，又经过白垩采石场。还没有走到砾石坑，他们终于看见一所白房子。房子四周围着碧绿的花园，后面还有一整片果园。
        - id: ch01-b02
          speaker: mother
          text: 我们到啦！
        - id: ch01-b03
          speaker: robert
          text: 这房子可真白。
        - id: ch01-b04
          speaker: anthea
          text: 快看，花园里有那么多玫瑰！
        - id: ch01-b05
          speaker: jane
          text: 那边还有李子呢。
        - id: ch01-b06
          speaker: cyril
          text: 嗯，这地方还算不错。
        - id: ch01-b07
          speaker: baby
          text: 要下去走走。
        - id: ch01-b08
          speaker: narrator
          text: 马车终于哐啷一响，猛地颠了一下，停住了。孩子们争先恐后地往下挤，恨不得同时钻出车门。他们不是踢到别人的腿，就是踩了别人的脚，可谁也不在意。奇怪的是，妈妈一点儿也不着急。她慢慢踩着踏板下车，连跳都没跳一下。下车以后，她也没参加孩子们第一次冲向新领地的壮丽行动，反而留下来照看箱子一件件搬进屋，还得付清车钱。孩子们早已跑远了。他们一会儿冲进花园，一会儿奔向果园，接着又闯进屋旁的荒地。那片荒地藏在一道破门和一座干涸的喷泉后面，长满刺木、蓟草、荆棘和野蔷薇。
        - id: ch01-b09
          speaker: narrator
          text: 这回，孩子们看得比大人明白。房子本身其实谈不上漂亮，只是一幢普普通通的屋子。妈妈嫌它住起来不方便，屋里几乎找不到架子，橱柜也少得可怜，这一点尤其叫她恼火。爸爸更是常说，屋顶和墙头那些铁饰，简直是建筑师做的一场噩梦。可是，它深深藏在乡间，朝四周望去，根本看不到别的人家。孩子们已经在伦敦住了整整两年，连一天海边都没去过，也从没搭过游览列车。因此，在他们眼里，这所白房子就是落在尘世乐园里的一座仙宫。对孩子来说，伦敦很像一座监狱，家里不富裕时尤其如此。
        - id: ch01-b10
          speaker: narrator
          text: 伦敦当然有商店，有剧院，有马斯基林与库克的魔术戏，还有许多别的玩意儿。可家里要是没多少钱，大人不会带你去剧院，商店里那些好东西你也买不起。伦敦更没有树木、沙地、树林和溪水那样的好地方，可以让孩子尽情玩，又不用担心弄坏什么，也不容易伤着自己。伦敦几乎什么都长错了样子，到处是笔直的线条和平坦的街道。乡下可不这样，这里的东西全都长得千奇百怪。树木棵棵不同，这个你一定知道。多半还有哪个讨厌的人告诉过你，世上找不到两片完全相同的草叶。可街道上连草叶都不长，于是所有东西看上去都像从一个模子里造出来的。城里那么多孩子淘气得出奇，原因就在这里。他们自己不知道，爸爸妈妈、姑姨叔舅、表亲堂亲、家庭教师和保姆也全都不知道。可我知道，现在你也知道了。乡下的孩子有时也淘气，不过那完全是另一回事。
        - id: ch01-b11
          speaker: narrator
          text: 孩子们把花园和所有附属屋舍彻彻底底探查了一遍，才被大人捉回来，洗干净后吃茶点。他们第一眼看到白房子时，就觉得住在这里准会快活。后来，他们发现屋后爬满了盛开的白茉莉，香气浓得像生日时才能收到的最昂贵香水，于是几乎确信了。再后来，他们看见一片又绿又平的草坪，跟卡姆登镇花园里那块枯黄的草地完全不同。接着，他们又找到一间马厩。马厩上面还有阁楼，里面甚至剩着一点旧干草。他们越看越确信。等罗伯特发现一架坏秋千，从上面摔下来，脑门鼓起一个鸡蛋那么大的包，西里尔又被一扇笼门夹住手指时，他们心里连最后一点疑问也没有了。那扇笼门看起来，简直像是专门给他们以后养兔子预备的。
        - id: ch01-b12
          speaker: narrator
          text: 最妙的是，这里没有规矩拦着他们去这儿、做那事。在伦敦，几乎处处都有看不见的“不得触碰”。即使你没察觉，也会有人马上郑重地提醒你。
        - id: ch01-b13
          speaker: narrator
          text: 白房子正好坐落在山坡边缘，背后紧挨着树林。一边是白垩采石场，另一边就是砾石坑。从房子朝山脚望去，能看见一大片平地。平地上散落着一些形状古怪的白房子，那是人们烧石灰的地方。再远一点，还有一座红砖砌成的大啤酒厂和别的房屋。到了傍晚，大烟囱里升起烟雾，太阳一点点往下沉。那时候，整片山谷仿佛盛满了金色的雾。石灰窑和烘干啤酒花的尖顶屋藏在雾里，一会儿看得清，一会儿又变模糊，到处闪闪发光。远远望去，山谷简直变成了《一千零一夜》里那种受过魔法的城市。
        - id: ch01-b14
          speaker: narrator
          text: 既然已经讲起这个地方，我其实可以一直讲下去，把孩子们做过的每一件寻常小事都讲成一个很有趣的故事。那些事，都是你自己也会做的，所以你一定会相信我说的每一个字。可是，等我讲到孩子们讨人嫌的时候，你的姑妈们说不定会拿起铅笔，在书页边写上“说得太对了”，或者“真是活生生的日子”。你看见以后，多半会气得不得了。所以，我只打算讲那些真正惊人的事。这样一来，你尽管把这本书随手放在任何地方。无论姑妈还是叔叔，大概都不会在故事边上写“说得太对了”。成年人很难相信真正奇妙的事，除非手里握着他们所谓的证据。孩子却差不多什么都信，大人也很清楚这一点。
        - id: ch01-b15
          speaker: narrator
          text: 所以，大人才会告诉你，地球像橙子一样圆。可你亲眼看见的地面，明明又平又凹凸不平。他们还告诉你，地球一直绕着太阳转。可你每天亲眼看见的，分明是太阳早晨起床，晚上睡觉。它规矩得像个好太阳，而地球一直安守本分，静得像一只老鼠。不过我想，关于地球和太阳的那些话，你大概还是相信的。既然这样，你也不难相信，安西娅、西里尔和其他孩子来到乡下还不到一星期，就发现了一个仙子。至少，他们管它叫仙子，因为它自己就是这么说的，而它当然最清楚。只是，这个仙子跟你见过、听过或者从书里读到过的任何仙子，全都一点儿也不像。
        - id: ch01-b16
          speaker: narrator
          text: 真正惊人的事发生在砾石坑。那一天，爸爸忽然遇到一件非出门不可的事。妈妈也走了，因为身体不大好的外婆需要她陪伴。他们两个人都走得很匆忙。门一关上，屋子顿时静得吓人，也空得吓人。孩子们没有事情可做，只好从一间房晃到另一间房。每个房间都刚刚收拾过，地板上还散着打包以后没有扫走的纸片和绳头。他们看来看去，越看越觉得无聊，真希望能找到一件事情做。最后，是西里尔先开了口。
        - id: ch01-b17
          speaker: cyril
          text: 喂，拿上我们在马盖特用的小铲子，去砾石坑挖沙吧。咱们就当自己又到了海边。
        - id: ch01-b18
          speaker: anthea
          text: 爸爸说，那地方从前真的是海边，还能找到几千年前的贝壳。
        - id: ch01-b19
          speaker: narrator
          text: 这个主意立刻得到赞成，于是他们出发了。他们当然早就去过砾石坑边，也从上面朝下面仔细看过。可他们还从没真正走进坑里，因为害怕爸爸知道以后，会明确告诉他们不许在那里玩。白垩采石场也是同样的情形，他们只敢在边上看。不过，砾石坑其实没有想象中那么危险。只要不从陡峭的边坡直接往下爬，而是照运货大车走的路线，沿着公路慢慢绕到坑底，就不会有什么问题。
        - id: ch01-b20
          speaker: narrator
          text: 每个孩子都带上了自己的小铲子。羔羊宝宝还小，不能一路自己走，所以大家轮流抱着他。羔羊宝宝是家里最小的孩子。大家这样叫他，是因为他刚学说话时，说出的第一个字是“咩”。这个称呼从此就留下来了。其他孩子也各有小名。安西娅的小名是“黑豹”。把这两个字写出来，看上去确实很傻，可念出声来，它跟安西娅的名字又有那么一点相像。
        - id: ch01-b21
          speaker: narrator
          text: 砾石坑比他们站在上面看时显得更大，也更宽。坑的上沿长满青草，草丛中还冒出一些干瘦细长的野花，有些是紫色，有些是黄色。整个大坑看起来，就像一个巨人搁在地上的洗脸盆。盆底堆着一座又一座砾石小山。盆壁上到处是洞，那是人们把砾石挖走后留下的。更高、更陡的地方，还有许许多多细小的孔。那些孔不是人挖的，它们是小沙燕的房子，也是小沙燕进进出出的小小前门。
        - id: ch01-b22
          speaker: narrator
          text: 孩子们当然先垒了一座城堡。可这里没有潮水哗哗涌来，先灌满护城河，再冲垮吊桥，最后痛痛快快地把每个人至少淋湿到腰。少了这些，垒沙堡也就没多大意思。西里尔提议挖个山洞，好让大家玩走私犯的游戏。其他人却觉得，洞一定会塌下来，把他们活埋在里面。最后，他们把所有铲子都集中到一起，在城堡下面挖一条通往澳大利亚的地道。你瞧，这几个孩子相信地球是圆的。他们也相信，在地球另一边，澳大利亚的小男孩和小女孩果真全都倒着走路。他们就像天花板上的苍蝇，脑袋朝下，悬在空中。
        - id: ch01-b23
          speaker: narrator
          text: 他们挖呀，挖呀，又挖呀。没过多久，手上就沾满了沙，又热又红。每张脸也都湿漉漉、亮闪闪的。羔羊宝宝尝了一口沙，因为他原本以为那是红糖。等发现沙并不是红糖，他便拼命哭了一场。如今，他终于累坏了，蜷成暖乎乎、肉嘟嘟的一团，睡在那座还没完工的城堡中央。哥哥姐姐这下不用轮流照看他，总算能真正卖力地干活。那条通往澳大利亚的洞很快就深得不得了。简越看越不放心，央求他们别再往下挖。
        - id: ch01-b24
          speaker: jane
          text: 要是洞底忽然塌了，你们就会掉到澳大利亚的小孩中间，沙子还会全落进他们眼睛里。
        - id: ch01-b25
          speaker: robert
          text: 对呀。那他们准会恨死我们，拿石头砸我们，也不让我们看袋鼠、负鼠、蓝桉树和鸸鹋，什么都不肯给我们看。
        - id: ch01-b26
          speaker: narrator
          text: 西里尔和安西娅知道澳大利亚没那么近，不过还是同意放下铲子，改用手挖。洞底的沙又软又细，还很干，像海滩上的沙，里面夹着小贝壳。
        - id: ch01-b27
          speaker: jane
          text: 想想看，这里以前全是湿漉漉、亮晶晶的海水。水里还有鱼、海鳗、珊瑚和美人鱼。
        - id: ch01-b28
          speaker: cyril
          text: 也会有船桅，还有沉船上的西班牙宝藏。要是能挖到一枚金币就好了。
        - id: ch01-b29
          speaker: robert
          text: 那些海水后来是怎么搬走的？
        - id: ch01-b30
          speaker: cyril
          text: 又不是有人拿桶提走的，傻瓜。爸爸说，地底下热得不得了，就像你钻在被窝里太热一样。地球耸了耸肩，海水便像毯子一样滑了下去。露出来的那只肩膀，就变成了陆地。咱们去找贝壳吧。那个小洞看着很有希望，里面还伸出一件东西，像沉船上的半截锚。再说，这个澳大利亚洞热死了。
        - id: ch01-b31
          speaker: narrator
          text: 其他人都赞成，只有安西娅接着挖。她做事一旦开了头，总想把它做完。要是这条洞还没通到澳大利亚就丢下，她会觉得很没面子。
        - id: ch01-b32
          speaker: narrator
          text: 其他人全去查看那个小洞，安西娅却一个人留下继续挖。结果，那个小洞叫人大失所望。里面连一个贝壳也没有，伸出来的东西更不是什么沉船的锚，只是一截断掉的鹤嘴锄木柄。探洞的孩子们渐渐认定，不在海边的时候，沙子反而格外叫人口渴。接着，有人提议回家喝柠檬水。就在这时候，独自留在澳大利亚洞边的安西娅突然尖叫起来。
        - id: ch01-b33
          speaker: anthea
          text: 西里尔，快来！快一点儿！它是活的，还想逃走！快来呀！
          emotion: surprised
        - id: ch01-b34
          speaker: narrator
          text: 大家立刻跑回她身边。
        - id: ch01-b35
          speaker: robert
          text: 说不定是只老鼠。爸爸说，老地方总会闹鼠患。几千年前海水就在这里，这地方肯定够老了。
        - id: ch01-b36
          speaker: jane
          text: 也许是一条蛇。
          emotion: fearful
        - id: ch01-b37
          speaker: narrator
          text: 简害怕得打了个哆嗦。西里尔跳进洞里。
        - id: ch01-b38
          speaker: cyril
          text: 让我看看。我才不怕蛇，我还喜欢蛇呢。真是蛇的话，我就把它驯服，让它到哪儿都跟着我，晚上盘在我脖子上睡觉。
        - id: ch01-b39
          speaker: robert
          text: 那可不行，我跟你住一间屋。不过要是老鼠，倒没关系。
        - id: ch01-b40
          speaker: anthea
          text: 别犯傻了！不是老鼠，它大得多。也不是蛇，它有脚，我看见了，还有毛！别拿铲子，你会伤到它的。用手挖。
        - id: ch01-b41
          speaker: cyril
          text: 那就让它来伤我好了。这主意可真妙，对吧？
        - id: ch01-b42
          speaker: narrator
          text: 西里尔一把抓起铲子。
        - id: ch01-b43
          speaker: anthea
          text: 别这样，松鼠，别挖。我知道这话听起来很傻，可它刚才说话了。真的，我没骗你。
        - id: ch01-b44
          speaker: cyril
          text: 它说了什么？
        - id: ch01-b45
          speaker: anthea
          text: 它说，别来烦我。
        - id: ch01-b46
          speaker: narrator
          text: 西里尔听完，只说妹妹一定是热得发昏了。他没有放下铲子，反而和罗伯特一起挖起来。安西娅坐在洞边，既热又着急，一刻也安静不下来，只能不停地蹦上蹦下。尽管嘴上不相信她，两个男孩子挖的时候倒很小心。他们一点点把沙拨开，生怕真有什么东西藏在下面。没过多久，所有人都看见了。在那条澳大利亚洞的最底下，果然有个东西正在动。
        - id: ch01-b47
          speaker: anthea
          text: 我不怕，让我来挖！
        - id: ch01-b48
          speaker: narrator
          text: 她跪下来，像一只忽然想起骨头埋在哪里的狗，拼命用手扒沙。
        - id: ch01-b49
          speaker: anthea
          text: 我摸到毛了！真的摸到了，真的！
          emotion: surprised
        - id: ch01-b50
          speaker: narrator
          text: 她又笑又哭。忽然，沙里传出一个干涩沙哑的声音。孩子们全都向后一跳，心也几乎跟着跳了起来。
        - id: ch01-b51
          speaker: psammead
          text: 别来烦我。
        - id: ch01-b52
          speaker: narrator
          text: 这回每个人都听见了。他们互相张望，想确认别人是不是也听到了。
        - id: ch01-b53
          speaker: robert
          text: 可是，我们想看看你。
        - id: ch01-b54
          speaker: anthea
          text: 要是你肯出来就好了。
        - id: ch01-b55
          speaker: psammead
          text: 哦，好吧。既然这是你的愿望。
        - id: ch01-b56
          speaker: narrator
          text: 话音刚落，洞底的沙子便搅动起来。沙粒打着旋儿飞向四周，孩子们连忙闪开。接着，一个棕色、有毛、胖乎乎的东西从沙里滚了出来，落进他们挖成的洞里。它身上沾满了沙，刚坐起来，沙粒便从软毛间纷纷落下。这个奇怪的东西似乎还没有完全睡醒。它先大大地打了一个哈欠，又抬起手，揉了揉两只眼睛尖。
        - id: ch01-b57
          speaker: psammead
          text: 我大概是睡着了。
        - id: ch01-b58
          speaker: narrator
          text: 它说着伸了个长长的懒腰。孩子们围着沙洞站成一圈，仔细端详这个刚刚发现的怪物。它确实值得好好看一看。它的眼睛长在两根长柄上，像蜗牛的眼睛，还能像望远镜一样伸出来，再缩回去。它长着一对蝙蝠似的耳朵。圆滚滚的身子像蜘蛛，外面盖着一层厚厚的软毛。胳膊和腿也全都毛茸茸的，可它的手和脚却像猴子的手脚。
        - id: ch01-b59
          speaker: jane
          text: 它到底是什么呀？我们能把它带回家吗？
        - id: ch01-b60
          speaker: psammead
          text: 她平时就总说这种傻话，还是脑袋上顶了那堆破烂以后，才变得这么蠢？
        - id: ch01-b61
          speaker: narrator
          text: 它一边说，一边鄙夷地瞥着简的帽子。
        - id: ch01-b62
          speaker: anthea
          text: 她不是故意犯傻。我们谁都不是，不管你怎么想。别怕，我们真的不会伤害你。
        - id: ch01-b63
          speaker: psammead
          text: 伤害我？我会害怕？亏你说得出口！听你的口气，我好像是什么无名小卒。
        - id: ch01-b64
          speaker: narrator
          text: 它全身的毛都竖了起来，活像一只正准备打架的猫。
        - id: ch01-b65
          speaker: anthea
          text: 那么，等我们知道你是谁，也许就能说一句不会惹你生气的话。到现在为止，我们说什么都让你不高兴。你到底是谁？请别生气，我们真的不知道。
          emotion: calm
        - id: ch01-b66
          speaker: psammead
          text: 你们不知道？我早知道世道变了，可我真没想到，你们看见一个普萨米德，居然认不出来！
          emotion: surprised
        - id: ch01-b67
          speaker: anthea
          text: 普萨米德？听起来像希腊话。
        - id: ch01-b68
          speaker: psammead
          text: 对谁来说都是希腊话。那我就用明白的英语说吧，我是沙仙。你们连沙仙都认不出来？
        - id: ch01-b69
          speaker: narrator
          text: 它看起来又伤心又委屈，简连忙接过话。
        - id: ch01-b70
          speaker: jane
          text: 现在我当然看得出你是沙仙了。仔细一看，实在再明显不过。
        - id: ch01-b71
          speaker: psammead
          text: 你早在好几句话以前，就已经开始仔细看我了。
        - id: ch01-b72
          speaker: narrator
          text: 它没好气地说完，又开始往沙里缩。
        - id: ch01-b73
          speaker: robert
          text: 别走呀，再跟我们说一会儿话吧。我刚才不知道你是沙仙，可我一看见你，就知道你是我这辈子见过最奇妙的东西。
        - id: ch01-b74
          speaker: narrator
          text: 听见这话，沙仙似乎没那么讨厌他们了。
        - id: ch01-b75
          speaker: psammead
          text: 说说话倒没什么，只要你们多少懂点礼貌。可别指望我陪你们说客套话。你们好好问，我也许回答，也许不回答。现在，说点什么吧。
        - id: ch01-b76
          speaker: narrator
          text: 这下谁也想不出该说什么。最后，罗伯特总算找到了一个问题。
        - id: ch01-b77
          speaker: robert
          text: 你在这里住了多久？
        - id: ch01-b78
          speaker: psammead
          text: 好多个时代了，大概有几千年吧。
        - id: ch01-b79
          speaker: robert
          text: 那就把以前的事都讲给我们听吧。求你了。
        - id: ch01-b80
          speaker: psammead
          text: 书里全都写着呢。
        - id: ch01-b81
          speaker: jane
          text: 才没有！求你把自己的事讲给我们听吧，能讲多少就讲多少。我们一点儿也不了解你，可你真的很可爱。
        - id: ch01-b82
          speaker: narrator
          text: 这句恭维显然很合它的心意。沙仙抬起毛茸茸的手，慢慢捋了捋那几根老鼠似的长胡须。它原本板着的脸松开了一点儿，孩子们从胡须中间看见了一丝笑容。看来，它愿意继续留下来跟他们说话了。
        - id: ch01-b83
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 求你讲吧！
        - id: ch01-b84
          speaker: narrator
          text: 人习惯一件事的速度真叫人吃惊，哪怕那件事不可思议。就在五分钟前，孩子们还跟你一样，压根儿不知道世上竟然有沙仙。可现在，他们已经围着它说了好一阵子话，简直像跟它认识了一辈子。沙仙也不再急着躲回沙里。它把两只长眼睛缩了回去，像是准备认真回答他们的问题。
        - id: ch01-b85
          speaker: psammead
          text: 今天阳光真足，简直跟从前一样。你们现在从哪儿弄大地懒吃？
        - id: ch01-b86
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 什么？
          emotion: surprised
        - id: ch01-b87
          speaker: narrator
          text: 吃惊或慌乱的时候，想起来说“什么”不礼貌，可真不容易。
        - id: ch01-b88
          speaker: psammead
          text: 那么，现在翼手龙还多不多？
        - id: ch01-b89
          speaker: narrator
          text: 这又是一个孩子们从没想过的问题。他们互相望着，希望别人能回答，可谁也不知道如今到底还有多少翼手龙。沙仙等了一会儿，见他们还是不出声，脸上越发不耐烦，仿佛这些孩子连最普通的事情都不知道。
        - id: ch01-b90
          speaker: psammead
          text: 你们早饭吃什么？又是谁拿给你们吃的？
        - id: ch01-b91
          speaker: robert
          text: 我们吃鸡蛋、咸肉、牛奶面包粥、燕麦粥，还有别的东西。是妈妈给我们的。那个大什么懒，还有翼什么龙，到底是什么？难道有人拿它们当早饭？
        - id: ch01-b92
          speaker: psammead
          text: 怎么没有？我那时候，几乎人人早饭都吃翼手龙。那东西有点像鳄鱼，又有点像鸟，烤起来大概很香。事情是这样的，那时的沙仙当然多得很，不像现在这么难找。每天一大早，人们就会出门寻找沙仙。只要找到一个，沙仙就会送给那个人一个愿望。家里的大人常常在吃早饭以前，就把小男孩打发到海边去，让他找到沙仙，领回全家当天要用的愿望。这样一来，早饭想吃什么，就可以当场许愿要什么。
        - id: ch01-b93
          speaker: psammead
          text: 家里的长子常会奉命要一头大地懒，还得切成块，拿回去就能下锅。那东西有大象那么大，肉多得很。想吃鱼，人们就要鱼龙，一条足有二十到四十英尺长，够全家吃了。想吃禽肉，就要蛇颈龙，它身上的肉也不少。这样，别的孩子还能许别的愿望。不过请客的时候，人们多半会要大地懒和鱼龙。鱼龙的鳍很难得，尾巴还能熬汤。
        - id: ch01-b94
          speaker: anthea
          text: 那一定会剩下好多冷肉。
        - id: ch01-b95
          speaker: narrator
          text: 安西娅希望自己将来能成为一个善于持家的女人。
        - id: ch01-b96
          speaker: psammead
          text: 哦，不会，那可绝对不行。太阳一下山，剩下的肉自然就变成石头了。听说直到现在，到处还能找到大地懒一类的石头骨头。
        - id: ch01-b97
          speaker: cyril
          text: 这是谁告诉你的？
        - id: ch01-b98
          speaker: narrator
          text: 这个问题似乎立刻惹恼了沙仙。它没有回答，反而皱起眉头，低下身子，用两只毛茸茸的手飞快地刨起沙来。沙子从它手下不断向后飞，它的身体也一点点往沙里缩。孩子们这才明白，它打算结束谈话，回自己的洞里去了。
        - id: ch01-b99
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 别走！再讲讲吃大地懒当早饭的年代吧。那时的世界也跟现在一样吗？
        - id: ch01-b100
          speaker: narrator
          text: 沙仙停了下来。
        - id: ch01-b101
          speaker: psammead
          text: 一点儿也不一样。我住的地方几乎全是沙。煤长在树上，玉黍螺有茶盘那么大。现在也能找到那些东西，不过它们全变成石头了。我们沙仙从前住在海滩上，孩子们拿着小小的燧石铲和燧石桶来给我们垒城堡。那已经是几千年前的事，不过我听说，现在的孩子还是会在沙滩上垒城堡。习惯养成以后，确实很难改。
        - id: ch01-b102
          speaker: robert
          text: 那你们后来为什么不住在城堡里了？
        - id: ch01-b103
          speaker: psammead
          text: 那是个伤心的故事。孩子们给我们垒城堡，本来倒是一件好事。可他们偏偏觉得，城堡四周非得有护城河才算完整。于是，他们一条接一条地挖起沟来。讨厌的海水冒着泡涌进那些沟，又湿淋淋地灌进城堡。沙仙只要沾上一点水，当然就会感冒，而且通常还会送命。就是因为这个，沙仙变得越来越少。到后来，人们找很久才能找到一个沙仙，领到一次愿望。所以每次许愿，他们总会要一头大地懒，还得逼自己吃下平常所需的两倍。因为吃完这一顿，下一次得到愿望，说不定已经是好几个星期以后的事了。
          emotion: sad
        - id: ch01-b104
          speaker: robert
          text: 那你也被水弄湿过吗？
        - id: ch01-b105
          speaker: narrator
          text: 一听到水，沙仙全身便打了个寒战。刚才那副骄傲又不耐烦的样子也消失了一会儿。看得出来，只要想起那次被水沾湿的经历，它到现在还是很难受。
        - id: ch01-b106
          speaker: psammead
          text: 只有一次。我左边最上面那根胡须，你们看见了吧？那根胡须上的第十二根毛，只有最末梢沾到了一点点水。可就算只有那么一点，也已经糟透了。直到现在，每逢天气潮湿，我还能感觉到当时沾水的那个地方。这样的事，我经历一次就完全够了。太阳一把我那根可怜又宝贝的胡须晒干，我马上离开原先的住处。我飞快跑到海滩后面，在温暖又干燥的沙子深处给自己挖了一个家。从那以后，我一直住在那里，再也没有回到湿漉漉的地方。后来，连海也从这里搬走了。好了，我再也不告诉你们任何事了。
        - id: ch01-b107
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 那就只再问一件事，求你了。你现在还能实现愿望吗？
        - id: ch01-b108
          speaker: psammead
          text: 当然能。几分钟前，我不是刚实现了你们的愿望吗？你们说，希望我肯出来，于是我就出来了。
        - id: ch01-b109
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 求求你，我们不能再要一个愿望吗？
        - id: ch01-b110
          speaker: psammead
          text: 能，不过要快。我已经烦透你们了。
        - id: ch01-b111
          speaker: narrator
          text: 我敢说，你一定常常想，要是有人送你三个愿望，你会拿来做什么。你还可能瞧不起黑布丁故事里的老头和老太太，确信这种机会要是落到自己头上，根本不用迟疑，就能说出三个真正有用的愿望。这几个孩子以前也常常讨论，遇到这种事到底该许什么愿。那时，他们每个人都觉得自己一定能选得又快又好。可如今，机会忽然真的摆在眼前，他们却你看看我，我看看你，怎么也拿不定主意。
        - id: ch01-b112
          speaker: psammead
          text: 快一点儿。
        - id: ch01-b113
          speaker: narrator
          text: 沙仙越催，他们越想不出来。谁也不愿意浪费机会，可谁也想不到一个能让所有人满意的愿望。只有安西娅勉强记起一件事。那是她和简私下里共有的愿望，她们从没把它告诉过男孩子。安西娅很清楚，西里尔和罗伯特听了准不会喜欢。可沙仙已经等得不耐烦了，这时候说出一个不太合适的愿望，总比什么也不说，让机会白白溜走强。
        - id: ch01-b114
          speaker: anthea
          text: 我希望我们全都美得像白昼一样。
        - id: ch01-b115
          speaker: narrator
          text: 她急急忙忙把愿望说了出来。孩子们立刻互相打量，可每个人都看得出，其他人没有比平常好看一点儿。沙仙伸出两只长眼睛，像是屏住了呼吸。它的身子不停鼓胀，越来越圆，越来越大，直到比刚才足足胖了一倍，身上的毛也像多了一倍。孩子们盯着它，等着自己身上发生变化。可忽然，沙仙只长长地叹了一口气，把刚才憋住的气全都放了出来。
        - id: ch01-b116
          speaker: psammead
          text: 恐怕我真的做不到。我一定是太久没练，手生了。
        - id: ch01-b117
          speaker: narrator
          text: 孩子们失望极了。
        - id: ch01-b118
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 再试一次吧！
        - id: ch01-b119
          speaker: psammead
          text: 好吧。其实我刚才留了点力气，原想实现你们其他人的愿望。要是你们愿意每天合用一个愿望，我想自己还能咬紧牙关办到。你们同意吗？
        - id: ch01-b120
          speakers: [jane, anthea]
          ensemble: duo
          text: 同意，当然同意！
        - id: ch01-b121
          speaker: narrator
          text: 男孩子们只点了点头。他们其实不相信沙仙真的能办到。要姑娘相信一件事，总比让男孩子相信容易得多。沙仙把眼睛伸了出来，这回比以前任何一次都长。接着，它的身子又开始鼓胀。它胀呀，胀呀，不停地胀，孩子们只能在一旁看着。
        - id: ch01-b122
          speaker: anthea
          text: 真希望它别伤到自己。
        - id: ch01-b123
          speaker: robert
          text: 也别把皮撑破了。
        - id: ch01-b124
          speaker: narrator
          text: 沙仙越胀越大，很快就占满了大半个沙洞。孩子们眼看着它继续变大，几乎把整个洞都塞满了，谁也不知道接下来会怎样。就在它看起来再也不可能变大时，它忽然把憋住的气一口吐了出来。鼓起的身体立刻缩了回去，恢复成原来的大小。孩子们一直替它捏着一把汗，这时候才终于放松下来。
        - id: ch01-b125
          speaker: psammead
          text: 好了。明天就会容易些。
        - id: ch01-b126
          speaker: narrator
          text: 它喘得很厉害。
        - id: ch01-b127
          speaker: anthea
          text: 很疼吗？
        - id: ch01-b128
          speaker: psammead
          text: 只有我那根可怜的胡须疼，谢谢你。不过，你是个体贴又善良的孩子。再会。
        - id: ch01-b129
          speaker: narrator
          text: 它突然用手脚凶猛地刨起沙来。沙子接连飞起，围着它向四周散开。只过了一转眼，它便钻进沙中，彻底消失了，地面上再也看不到一根毛。直到这时，孩子们才转过头，第一次认真互相看了一眼。就在这一眼之间，每个人都突然发现，自己竟然孤零零地站在三个陌生人中间。那三个人个个十全十美，个个光彩照人，可是谁也不像自己的兄弟姐妹。
        - id: ch01-b130
          speaker: narrator
          text: 他们默不作声地站了一会儿。每个人都以为自己的兄弟姐妹不知什么时候走开了。至于眼前这三个陌生孩子，一定是趁自己盯着沙仙不断胀大的身体时，悄无声息地溜过来的。可他们是从哪里来的，原来的孩子又去了哪里，谁也弄不明白。最后，安西娅先开了口。她十分客气地问起简。此刻的简有一双大得惊人的蓝眼睛，还有一头浓密的赤褐色头发，安西娅根本没认出她来。
        - id: ch01-b131
          speaker: anthea
          text: 打扰一下，请问你有没有在附近看见两个小男孩和一个小女孩？
        - id: ch01-b132
          speaker: jane
          text: 我正想问你同一件事呢。
        - id: ch01-b133
          speaker: cyril
          text: 哎呀，原来是你！我认得你围裙上的那个破洞。你真的是简，对不对？那么你一定就是黑豹了，我也认得你那块脏手绢。你割破大拇指以后，就一直忘了换掉它！天哪，愿望到底还是实现了。难怪我们刚才谁也认不出谁。快看看我，我是不是也变了？我是不是跟你们一样漂亮？
          emotion: surprised
        - id: ch01-b134
          speaker: anthea
          text: 如果你真是西里尔，我还是喜欢你原来的样子。你现在一头金发，活像画里的小唱诗班歌手。我看你这样子，会很早就死掉。要是那个人是罗伯特，他简直像个意大利街头的手摇风琴艺人，头发全变黑了。
        - id: ch01-b135
          speaker: robert
          text: 你们两个姑娘也只像圣诞卡片而已，还是傻乎乎的圣诞卡片。简的头发根本就是胡萝卜！
          emotion: angry
        - id: ch01-b136
          speaker: narrator
          text: 其实，那头发是画家们特别欣赏的威尼斯红。
        - id: ch01-b137
          speaker: anthea
          text: 好了，互相挑毛病也没有用。去抱上羔羊宝宝，把他带回家吃午饭吧。你们等着瞧，仆人们一定会把我们夸到天上去。
        - id: ch01-b138
          speaker: narrator
          text: 他们一起走到没盖完的沙堡旁。羔羊宝宝刚刚从睡梦中醒来，正躺在那里望着他们。孩子们先仔细看了看他，立刻发现，至少宝宝没有变得美如白昼。他还是平常的脸，平常的头发，从头到脚都跟刚才一模一样。看到家里还有一个人没有变成陌生模样，大家都不由得松了一口气。
        - id: ch01-b139
          speaker: jane
          text: 我想，他年纪太小，所以没得到这个愿望。下次，我们得特意把他也算进去。
        - id: ch01-b140
          speaker: narrator
          text: 安西娅跑上前，朝他张开双臂。
        - id: ch01-b141
          speaker: anthea
          text: 来，让你的黑豹姐姐抱抱，小宝贝。
        - id: ch01-b142
          speaker: narrator
          text: 宝宝没有像平常那样伸手迎接她，只是不赞成地看着这个漂亮的陌生姑娘。他把那根沾满沙子的粉红大拇指塞进嘴里，一动也不肯动。孩子们还没有立刻明白这是怎么回事。要知道，在几个姐姐当中，安西娅原本是他最喜欢的那一个。
        - id: ch01-b143
          speaker: anthea
          text: 来呀。
        - id: ch01-b144
          speaker: baby
          text: 走开！
        - id: ch01-b145
          speaker: jane
          text: 来，让你的小猫姐姐抱。
        - id: ch01-b146
          speaker: baby
          text: 我要我的豹豹。
          emotion: sad
        - id: ch01-b147
          speaker: narrator
          text: 羔羊宝宝说得凄凄惨惨，嘴唇也颤抖起来。
        - id: ch01-b148
          speaker: robert
          text: 来吧，老伙计，骑到罗比背上来。
        - id: ch01-b149
          speaker: baby
          text: 坏，坏男孩！
          emotion: fearful
        - id: ch01-b150
          speaker: narrator
          text: 这句话让宝宝彻底忍不住了。他张开嘴，放声大哭起来，怎么哄也不肯停。四个孩子站在他周围，这才终于明白，最糟糕的事情已经发生了。愿望不只改变了他们的模样，也让这个最小的弟弟把他们当成了陌生人。
        - id: ch01-b151
          speaker: narrator
          text: 羔羊宝宝不认识他们了！
