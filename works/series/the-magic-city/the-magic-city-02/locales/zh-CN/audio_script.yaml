audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖沉着，带一点机敏的幽默
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中
    philip:
      display_name: 菲利普
      tts:
        delivery: 直率敏感，想象丰富，情绪来得快
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    lucy:
      display_name: 露西
      tts:
        delivery: 开朗友好，坦率好奇
        timbre: 轻盈稚嫩
        pace: 轻快
        pitch: 中高
    red_guard:
      display_name: 红衣卫兵
      tts:
        delivery: 尽职而爽直，带一点粗豪
        timbre: 结实明亮
        pace: 适中
        pitch: 中低
    captain:
      display_name: 卫队队长
      tts:
        delivery: 威严认真，偶尔透出和气与幽默
        timbre: 洪亮厚实
        pace: 稳健
        pitch: 中低
    judge_noah:
      display_name: 诺亚先生
      tts:
        delivery: 一本正经又怕麻烦，古板中带着滑稽
        timbre: 苍老清晰
        pace: 稍慢
        pitch: 中
    jailer:
      display_name: 狱卒
      tts:
        delivery: 彬彬有礼，自命风雅，容易忧虑
        timbre: 细致柔和
        pace: 从容
        pitch: 中
  chapters:
    - id: ch01
      title: 月下的卫兵室
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            菲利普站在幽暗的拱门下，望着外面的大广场。四周的楼房高高低低，中央的喷泉在月光下闪着银光，水声轻轻起伏。拱门旁有一棵高树，树影横过道路，像一道宽宽的黑栏。他听了又听，除了深夜的寂静和喷泉忽高忽低的柔声，什么也没听见。等眼睛习惯了黑暗，他才看清头顶是沉重的穹顶，由粗大的方柱撑着，左右各有一扇紧闭的黑门。
        - id: ch01-b02
          speaker: philip
          text: >-
            等天亮，我要去看看这些门。我要去。至少，我想我会去的。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他不觉得自己害怕，也不敢说自己勇敢。他只是很想勇敢起来。后面那句“我想我会去”，是为了诚实。没过多久，困意忽然压了下来。他先靠着墙，接着坐下，最后觉得还是躺着最舒服。远处的钟敲了十二下，他只数到第九下便睡熟了，暖暖地蜷在海伦去年冬天给他做的夹棉睡袍里。
        - id: ch01-b04
          speaker: narrator
          text: >-
            梦里，一切又回到了从前。“那个男人”没有出现，也没有改变所有的事，更没有把海伦带走。菲利普睡在自家小卧室的小床上。海伦来叫他起床，阳光隔着眼皮照进来。他偏不睁眼，只想听海伦使出各种办法。再过一会儿，他就会告诉她，自己早醒了，然后两个人一起笑。
        - id: ch01-b05
          speaker: red_guard
          text: 喂，我说，醒醒呀。你到底醒不醒？
        - id: ch01-b06
          speaker: narrator
          text: >-
            菲利普真的醒了。身下不是柔软的小床，而是陌生门楼的硬地面。摇他的不是海伦，是个穿红上衣的高个子男人。让他睁不开眼的也不是阳光，是男人举到他脸旁的一盏角灯。
        - id: ch01-b07
          speaker: philip
          text: 出什么事了？
        - id: ch01-b08
          speaker: red_guard
          text: 这话问得好。到卫兵室里去，小家伙，把事情交代清楚。
        - id: ch01-b09
          speaker: narrator
          text: >-
            红衣男人用硬邦邦的手指夹住他的耳朵，没使多大力，却怎么也不肯松开。
        - id: ch01-b10
          speaker: philip
          text: 放手吧，我不会逃跑。
        - id: ch01-b11
          speaker: narrator
          text: >-
            菲利普站起来，觉得自己勇敢极了。男人把手移到他肩上，带他走进那扇本来打算天亮后查看的门。天还黑着。屋子又大又空，两端都有拱门，两侧是窄窗，角灯和白镴烛台上的高蜡烛照亮了满屋士兵。队长从长凳上站起身。他浑身金光闪闪，两撇黑胡子神气极了。
        - id: ch01-b12
          speaker: red_guard
          text: 长官，看看我抓到了谁。
        - id: ch01-b13
          speaker: captain
          text: 哼，这件事到底还是发生了。
        - id: ch01-b14
          speaker: philip
          text: 什么事？
        - id: ch01-b15
          speaker: captain
          text: 就是你呀。别怕，小家伙。
        - id: ch01-b16
          speaker: philip
          text: >-
            我没有害怕。要是您愿意告诉我这是什么意思，我会非常感激。我是初来贵地。
        - id: ch01-b17
          speaker: narrator
          text: >-
            这是菲利普听别人问市场或公共花园的路时说过的话。红衣士兵们全都快活地笑了起来。
        - id: ch01-b18
          speaker: philip
          text: 嘲笑一个陌生人，可不大礼貌。
        - id: ch01-b19
          speaker: captain
          text: >-
            先顾好你自己的礼貌。在我们这个国家，大人问了话，小男孩才能开口。你说你是陌生人？这件事我们早就知道！
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: >-
            菲利普受了训，却又有点得意。他正经历一场冒险，四周还都是成年的士兵。他挺起胸膛，努力摆出男子汉的样子。队长坐到长桌尽头，拖来一本积满灰尘的黑皮簿子，又用一把没生锈的剑去磨一支生锈的笔尖。
        - id: ch01-b21
          speaker: captain
          text: 好了，说说你是怎么来的。记住，要讲实话。
        - id: ch01-b22
          speaker: philip
          text: 我从来都讲实话。
        - id: ch01-b23
          speaker: narrator
          text: >-
            士兵们一齐起立，带着万分惊讶和敬佩向他敬礼。
        - id: ch01-b24
          speaker: philip
          text: 嗯，差不多从来都讲。
        - id: ch01-b25
          speaker: narrator
          text: >-
            菲利普的耳朵一下红得发烫。士兵们又笑起来，硬邦邦地跌坐回长凳。他原以为军队里应该更有纪律。
        - id: ch01-b26
          speaker: captain
          text: 你是怎么到这里的？
        - id: ch01-b27
          speaker: philip
          text: 我从那座大梯桥上爬上来的。
        - id: ch01-b28
          speaker: narrator
          text: 队长赶忙把这句话写进簿子。
        - id: ch01-b29
          speaker: captain
          text: 那你来做什么？
        - id: ch01-b30
          speaker: philip
          text: >-
            我也不知道还能做什么。周围只有一大片望不到头的草原，所以我就爬上来了。
        - id: ch01-b31
          speaker: captain
          text: 你这孩子胆子真大。
        - id: ch01-b32
          speaker: philip
          text: 谢谢。我确实很想让自己大胆一点。
        - id: ch01-b33
          speaker: captain
          text: 你来这里有什么目的？
        - id: ch01-b34
          speaker: philip
          text: 我不是故意来的，只是碰巧到了这里。
        - id: ch01-b35
          speaker: narrator
          text: >-
            队长也记下这句。随后，队长、菲利普和所有士兵互相看着，谁都不说话。
        - id: ch01-b36
          speaker: philip
          text: 那么？
        - id: ch01-b37
          speaker: captain
          text: 那么？
        - id: ch01-b38
          speaker: philip
          text: >-
            我希望您先告诉我，“这件事到底还是发生了”是什么意思。然后，请您再告诉我回家的路。
        - id: ch01-b39
          speaker: captain
          text: 你要去哪里？
        - id: ch01-b40
          speaker: philip
          text: 地址是苏塞克斯郡，拉弗尔舍姆，庄园。
        - id: ch01-b41
          speaker: captain
          text: >-
            没听说过。反正你现在回不去。梯子顶端的告示，你没看见吗？上面写着“擅闯者将受起诉”。不先受审，你哪里也不能去。
        - id: ch01-b42
          speaker: philip
          text: >-
            我宁可受迫害，也不愿意再爬下那架梯子。受迫害应该不会太糟吧？
        - id: ch01-b43
          speaker: narrator
          text: >-
            菲利普只在书里读过“迫害”。他以为那是一种说不清楚的不愉快，人总能乔装逃走，一路惊险，最后每次都能成功。
        - id: ch01-b44
          speaker: captain
          text: >-
            那得由法官决定。擅闯我们的城市可是大事。这支卫队守在这里，就是要拦住擅闯的人。
        - id: ch01-b45
          speaker: philip
          text: 擅闯的人很多吗？
        - id: ch01-b46
          speaker: narrator
          text: >-
            队长看着挺和善。菲利普又有一位当法官的舅公，所以一听“法官”，他想到的是小费和亲切的指点，不是审判和惩罚。
        - id: ch01-b47
          speaker: captain
          text: >-
            很多？麻烦就在这儿。从前一个也没有，你是头一个。许多年以前，城市刚建好，占星师就预言，有一天会来一个擅闯者，带来数不尽的祸患。于是卫队设在了这里。我们波利斯托波利斯卫队的光荣职责，就是守住擅闯者唯一能进城的路。
        - id: ch01-b48
          speaker: philip
          text: 我能坐下吗？
        - id: ch01-b49
          speaker: narrator
          text: 士兵们在长凳上给他让了一个位置。
        - id: ch01-b50
          speaker: captain
          text: >-
            我的父亲、祖父，还有一代又一代的祖先，都在这支卫队里服役。这是极大的荣耀。
        - id: ch01-b51
          speaker: philip
          text: >-
            那你们为什么不把梯子最上面那一截砍掉？这样不就谁也爬不上来了吗？
        - id: ch01-b52
          speaker: captain
          text: 那绝对不行。还有一则预言说，伟大的拯救者也会从那里来。
        - id: ch01-b53
          speaker: philip
          text: >-
            那我能不能不当擅闯者，改当拯救者？要是能选，我宁愿当拯救者。
        - id: ch01-b54
          speaker: captain
          text: >-
            我当然相信你愿意。可一个人不能因为自己想当拯救者，就真的成了拯救者。
        - id: ch01-b55
          speaker: philip
          text: 除了这两种人，再不会有别人从梯桥上来吗？
        - id: ch01-b56
          speaker: captain
          text: 我们不知道。预言就是这样，你总该知道吧。
        - id: ch01-b57
          speaker: philip
          text: 恐怕我还不完全明白。
        - id: ch01-b58
          speaker: captain
          text: >-
            预言总是模模糊糊，绕来绕去。刚才那一则大概是这样。谁从梯阶攀上来？当心，当心，须当心！钢铁眼，赤铜发，争斗、悲伤、苦痛加，尽从梯阶攀上来。你看，我们连它说的是一个人，还是一群长着钢铁眼睛、赤铜头发的人，都弄不清。
        - id: ch01-b59
          speaker: philip
          text: >-
            我的头发就是普通男孩的颜色，姐姐一直这么说。我的眼睛应该是蓝的。
        - id: ch01-b60
          speaker: captain
          text: >-
            这光线下看不清。不，还是看不清。另一则是这样。从下方，下方，极深远的下方，国王将来取回他所有。他将拯救魔法城邦，凡他所造，尽归他掌。当心，留神，当心，准备，国王将从梯阶归来。
        - id: ch01-b61
          speaker: philip
          text: 真带劲！我喜欢诗。您还会别的吗？
        - id: ch01-b62
          speaker: captain
          text: >-
            当然，预言多得很。占星师总得干点事，才对得起薪水。有一首还不错。每夜明亮星星眨眼，卫兵列队饮酒一盏，钟声敲响两点。每夜天空不见星光，卫兵就在自家饭堂，钟声敲响两点。今晚没有星星，所以饮料会送到这里。这样不用穿过广场去饭堂，可道理完全一样。孩子，预言最要紧的就是守住道理。
        - id: ch01-b63
          speaker: philip
          text: 是。
        - id: ch01-b64
          speaker: narrator
          text: >-
            远处的钟又响了，一声，两声。门外传来轻轻的脚步。一个士兵站起敬礼，猛地拉开门。门外静了一会儿。菲利普以为会有人端着杯子和托盘进来，就像舅公家的绅士偶尔不在饭点口渴时一样。
        - id: ch01-b65
          speaker: narrator
          text: >-
            没想到，十二条灵缇迈着猫一样轻的脚步，优雅地走进来。每条狗的颈下都挂着一个圆鼓鼓的东西，像画里圣伯纳犬的小酒桶。那些东西解下来放到桌上，菲利普才惊喜地发现，它们全是椰子。士兵取下白镴杯，用刺刀戳开椰子，倒出椰汁。人人都有一杯，预言果然应验了。菲利普也喝了，味道美极了，而且想喝多少就有多少。我可从没喝到过足量的椰汁。你喝到过吗？
        - id: ch01-b66
          speaker: narrator
          text: >-
            空椰壳又系回狗儿颈下。它们两条一排走出门，长尾巴一路摇着，和善又守规矩。
        - id: ch01-b67
          speaker: captain
          text: >-
            它们会把椰壳送去城里的厨房，做成椰子冰，给军队当早餐。东西可不能糟蹋。我们这里什么都不浪费，孩子。
