audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖沉着，带一点机敏的幽默
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中
    philip:
      display_name: 菲利普
      tts:
        delivery: 直率敏感，想象丰富，情绪来得快
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    lucy:
      display_name: 露西
      tts:
        delivery: 开朗友好，坦率好奇
        timbre: 轻盈稚嫩
        pace: 轻快
        pitch: 中高
    red_guard:
      display_name: 红衣卫兵
      tts:
        delivery: 尽职而爽直，带一点粗豪
        timbre: 结实明亮
        pace: 适中
        pitch: 中低
    captain:
      display_name: 卫队队长
      tts:
        delivery: 威严认真，偶尔透出和气与幽默
        timbre: 洪亮厚实
        pace: 稳健
        pitch: 中低
    judge_noah:
      display_name: 诺亚先生
      tts:
        delivery: 一本正经又怕麻烦，古板中带着滑稽
        timbre: 苍老清晰
        pace: 稍慢
        pitch: 中
    jailer:
      display_name: 狱卒
      tts:
        delivery: 彬彬有礼，自命风雅，容易忧虑
        timbre: 细致柔和
        pace: 从容
        pitch: 中
  chapters:
    - id: ch01
      title: 月下的卫兵室
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            菲利普站在幽暗的拱门下，望着外面的大广场。四周的楼房高高低低，中央的喷泉在月光下闪着银光，水声轻轻起伏。拱门旁有一棵高树，树影横过道路，像一道宽宽的黑栏。他听了又听，除了深夜的寂静和喷泉忽高忽低的柔声，什么也没听见。等眼睛习惯了黑暗，他才看清头顶是沉重的穹顶，由粗大的方柱撑着，左右各有一扇紧闭的黑门。
        - id: ch01-b02
          speaker: philip
          text: >-
            等天亮，我要去看看这些门。我要去。至少，我想我会去的。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他不觉得自己害怕，也不敢说自己勇敢。他只是很想勇敢起来。后面那句“我想我会去”，是为了诚实。没过多久，困意忽然压了下来。他先靠着墙，接着坐下，最后觉得还是躺着最舒服。远处的钟敲了十二下，他只数到第九下便睡熟了，暖暖地蜷在海伦去年冬天给他做的夹棉睡袍里。
        - id: ch01-b04
          speaker: narrator
          text: >-
            梦里，一切又回到了从前。“那个男人”没有出现，也没有改变所有的事，更没有把海伦带走。菲利普睡在自家小卧室的小床上。海伦来叫他起床，阳光隔着眼皮照进来。他偏不睁眼，只想听海伦使出各种办法。再过一会儿，他就会告诉她，自己早醒了，然后两个人一起笑。
        - id: ch01-b05
          speaker: red_guard
          text: 喂，我说，醒醒呀。你到底醒不醒？
        - id: ch01-b06
          speaker: narrator
          text: >-
            菲利普真的醒了。身下不是柔软的小床，而是陌生门楼的硬地面。摇他的不是海伦，是个穿红上衣的高个子男人。让他睁不开眼的也不是阳光，是男人举到他脸旁的一盏角灯。
        - id: ch01-b07
          speaker: philip
          text: 出什么事了？
        - id: ch01-b08
          speaker: red_guard
          text: 这话问得好。到卫兵室里去，小家伙，把事情交代清楚。
        - id: ch01-b09
          speaker: narrator
          text: >-
            红衣男人用硬邦邦的手指夹住他的耳朵，没使多大力，却怎么也不肯松开。
        - id: ch01-b10
          speaker: philip
          text: 放手吧，我不会逃跑。
        - id: ch01-b11
          speaker: narrator
          text: >-
            菲利普站起来，觉得自己勇敢极了。男人把手移到他肩上，带他走进那扇本来打算天亮后查看的门。天还黑着。屋子又大又空，两端都有拱门，两侧是窄窗，角灯和白镴烛台上的高蜡烛照亮了满屋士兵。队长从长凳上站起身。他浑身金光闪闪，两撇黑胡子神气极了。
        - id: ch01-b12
          speaker: red_guard
          text: 长官，看看我抓到了谁。
        - id: ch01-b13
          speaker: captain
          text: 哼，这件事到底还是发生了。
        - id: ch01-b14
          speaker: philip
          text: 什么事？
        - id: ch01-b15
          speaker: captain
          text: 就是你呀。别怕，小家伙。
        - id: ch01-b16
          speaker: philip
          text: >-
            我没有害怕。要是您愿意告诉我这是什么意思，我会非常感激。我是初来贵地。
        - id: ch01-b17
          speaker: narrator
          text: >-
            这是菲利普听别人问市场或公共花园的路时说过的话。红衣士兵们全都快活地笑了起来。
        - id: ch01-b18
          speaker: philip
          text: 嘲笑一个陌生人，可不大礼貌。
        - id: ch01-b19
          speaker: captain
          text: >-
            先顾好你自己的礼貌。在我们这个国家，大人问了话，小男孩才能开口。你说你是陌生人？这件事我们早就知道！
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: >-
            菲利普受了训，却又有点得意。他正经历一场冒险，四周还都是成年的士兵。他挺起胸膛，努力摆出男子汉的样子。队长坐到长桌尽头，拖来一本积满灰尘的黑皮簿子，又用一把没生锈的剑去磨一支生锈的笔尖。
        - id: ch01-b21
          speaker: captain
          text: 好了，说说你是怎么来的。记住，要讲实话。
        - id: ch01-b22
          speaker: philip
          text: 我从来都讲实话。
        - id: ch01-b23
          speaker: narrator
          text: >-
            士兵们一齐起立，带着万分惊讶和敬佩向他敬礼。
        - id: ch01-b24
          speaker: philip
          text: 嗯，差不多从来都讲。
        - id: ch01-b25
          speaker: narrator
          text: >-
            菲利普的耳朵一下红得发烫。士兵们又笑起来，硬邦邦地跌坐回长凳。他原以为军队里应该更有纪律。
        - id: ch01-b26
          speaker: captain
          text: 你是怎么到这里的？
        - id: ch01-b27
          speaker: philip
          text: 我从那座大梯桥上爬上来的。
        - id: ch01-b28
          speaker: narrator
          text: 队长赶忙把这句话写进簿子。
        - id: ch01-b29
          speaker: captain
          text: 那你来做什么？
        - id: ch01-b30
          speaker: philip
          text: >-
            我也不知道还能做什么。周围只有一大片望不到头的草原，所以我就爬上来了。
        - id: ch01-b31
          speaker: captain
          text: 你这孩子胆子真大。
        - id: ch01-b32
          speaker: philip
          text: 谢谢。我确实很想让自己大胆一点。
        - id: ch01-b33
          speaker: captain
          text: 你来这里有什么目的？
        - id: ch01-b34
          speaker: philip
          text: 我不是故意来的，只是碰巧到了这里。
        - id: ch01-b35
          speaker: narrator
          text: >-
            队长也记下这句。随后，队长、菲利普和所有士兵互相看着，谁都不说话。
        - id: ch01-b36
          speaker: philip
          text: 那么？
        - id: ch01-b37
          speaker: captain
          text: 那么？
        - id: ch01-b38
          speaker: philip
          text: >-
            我希望您先告诉我，“这件事到底还是发生了”是什么意思。然后，请您再告诉我回家的路。
        - id: ch01-b39
          speaker: captain
          text: 你要去哪里？
        - id: ch01-b40
          speaker: philip
          text: 地址是苏塞克斯郡，拉弗尔舍姆，庄园。
        - id: ch01-b41
          speaker: captain
          text: >-
            没听说过。反正你现在回不去。梯子顶端的告示，你没看见吗？上面写着“擅闯者将受起诉”。不先受审，你哪里也不能去。
        - id: ch01-b42
          speaker: philip
          text: >-
            我宁可受迫害，也不愿意再爬下那架梯子。受迫害应该不会太糟吧？
        - id: ch01-b43
          speaker: narrator
          text: >-
            菲利普只在书里读过“迫害”。他以为那是一种说不清楚的不愉快，人总能乔装逃走，一路惊险，最后每次都能成功。
        - id: ch01-b44
          speaker: captain
          text: >-
            那得由法官决定。擅闯我们的城市可是大事。这支卫队守在这里，就是要拦住擅闯的人。
        - id: ch01-b45
          speaker: philip
          text: 擅闯的人很多吗？
        - id: ch01-b46
          speaker: narrator
          text: >-
            队长看着挺和善。菲利普又有一位当法官的舅公，所以一听“法官”，他想到的是小费和亲切的指点，不是审判和惩罚。
        - id: ch01-b47
          speaker: captain
          text: >-
            很多？麻烦就在这儿。从前一个也没有，你是头一个。许多年以前，城市刚建好，占星师就预言，有一天会来一个擅闯者，带来数不尽的祸患。于是卫队设在了这里。我们波利斯托波利斯卫队的光荣职责，就是守住擅闯者唯一能进城的路。
        - id: ch01-b48
          speaker: philip
          text: 我能坐下吗？
        - id: ch01-b49
          speaker: narrator
          text: 士兵们在长凳上给他让了一个位置。
        - id: ch01-b50
          speaker: captain
          text: >-
            我的父亲、祖父，还有一代又一代的祖先，都在这支卫队里服役。这是极大的荣耀。
        - id: ch01-b51
          speaker: philip
          text: >-
            那你们为什么不把梯子最上面那一截砍掉？这样不就谁也爬不上来了吗？
        - id: ch01-b52
          speaker: captain
          text: 那绝对不行。还有一则预言说，伟大的拯救者也会从那里来。
        - id: ch01-b53
          speaker: philip
          text: >-
            那我能不能不当擅闯者，改当拯救者？要是能选，我宁愿当拯救者。
        - id: ch01-b54
          speaker: captain
          text: >-
            我当然相信你愿意。可一个人不能因为自己想当拯救者，就真的成了拯救者。
        - id: ch01-b55
          speaker: philip
          text: 除了这两种人，再不会有别人从梯桥上来吗？
        - id: ch01-b56
          speaker: captain
          text: 我们不知道。预言就是这样，你总该知道吧。
        - id: ch01-b57
          speaker: philip
          text: 恐怕我还不完全明白。
        - id: ch01-b58
          speaker: captain
          text: >-
            预言总是模模糊糊，绕来绕去。刚才那一则大概是这样。谁从梯阶攀上来？当心，当心，须当心！钢铁眼，赤铜发，争斗、悲伤、苦痛加，尽从梯阶攀上来。你看，我们连它说的是一个人，还是一群长着钢铁眼睛、赤铜头发的人，都弄不清。
        - id: ch01-b59
          speaker: philip
          text: >-
            我的头发就是普通男孩的颜色，姐姐一直这么说。我的眼睛应该是蓝的。
        - id: ch01-b60
          speaker: captain
          text: >-
            这光线下看不清。不，还是看不清。另一则是这样。从下方，下方，极深远的下方，国王将来取回他所有。他将拯救魔法城邦，凡他所造，尽归他掌。当心，留神，当心，准备，国王将从梯阶归来。
        - id: ch01-b61
          speaker: philip
          text: 真带劲！我喜欢诗。您还会别的吗？
        - id: ch01-b62
          speaker: captain
          text: >-
            当然，预言多得很。占星师总得干点事，才对得起薪水。有一首还不错。每夜明亮星星眨眼，卫兵列队饮酒一盏，钟声敲响两点。每夜天空不见星光，卫兵就在自家饭堂，钟声敲响两点。今晚没有星星，所以饮料会送到这里。这样不用穿过广场去饭堂，可道理完全一样。孩子，预言最要紧的就是守住道理。
        - id: ch01-b63
          speaker: philip
          text: 是。
        - id: ch01-b64
          speaker: narrator
          text: >-
            远处的钟又响了，一声，两声。门外传来轻轻的脚步。一个士兵站起敬礼，猛地拉开门。门外静了一会儿。菲利普以为会有人端着杯子和托盘进来，就像舅公家的绅士偶尔不在饭点口渴时一样。
        - id: ch01-b65
          speaker: narrator
          text: >-
            没想到，十二条灵缇迈着猫一样轻的脚步，优雅地走进来。每条狗的颈下都挂着一个圆鼓鼓的东西，像画里圣伯纳犬的小酒桶。那些东西解下来放到桌上，菲利普才惊喜地发现，它们全是椰子。士兵取下白镴杯，用刺刀戳开椰子，倒出椰汁。人人都有一杯，预言果然应验了。菲利普也喝了，味道美极了，而且想喝多少就有多少。我可从没喝到过足量的椰汁。你喝到过吗？
        - id: ch01-b66
          speaker: narrator
          text: >-
            空椰壳又系回狗儿颈下。它们两条一排走出门，长尾巴一路摇着，和善又守规矩。
        - id: ch01-b67
          speaker: captain
          text: >-
            它们会把椰壳送去城里的厨房，做成椰子冰，给军队当早餐。东西可不能糟蹋。我们这里什么都不浪费，孩子。
        - id: ch01-b68
          speaker: narrator
          text: >-
            菲利普早已不在意刚才挨的训了。现在，队长像对待一个男子汉那样同他讲话，平等地跟他谈论城里的事情。海伦离开了他，好吧，他也能学着过没有海伦的生活。他还逃出了庄园，甩掉了露西和那个保姆。如今，他是男人中的一个男人。偏偏就在他觉得自己最有男子气概、最为重要，仿佛来多少位法官都对付得了时，门上忽然响起轻轻的敲声，一个很小很小的声音从外面传来。
        - id: ch01-b69
          speaker: lucy
          text: 噢，请让我进去吧。
        - id: ch01-b70
          speaker: narrator
          text: 门缓缓打开了。
        - id: ch01-b71
          speaker: captain
          text: 好吧，不管你是谁，进来。
        - id: ch01-b72
          speaker: narrator
          text: >-
            进来的竟然是露西。正是菲利普以为自己已经摆脱的露西。她代表着那个可恨的新生活，也让他想起海伦已经抛下自己。她穿着哔叽裙和套头衫，两条浅色辫子梳得服服帖帖，脸上还是那种忧心忡忡的笑，好像在说，她真希望两个人能做朋友。菲利普一下子勃然大怒。这实在太过分了。
        - id: ch01-b73
          speaker: captain
          text: 这又是谁？
        - id: ch01-b74
          speaker: lucy
          text: 是我，我叫露西。我跟他一起爬上来的。
        - id: ch01-b75
          speaker: narrator
          text: 她伸手指着菲利普。菲利普觉得，这个动作真没礼貌。
        - id: ch01-b76
          speaker: philip
          text: 才没有。
        - id: ch01-b77
          speaker: lucy
          text: >-
            有的。你爬梯桥的时候，我就在后面，离你很近。后来你睡着了，我一直一个人等在外面。我早知道，你发现我跟来，一定会生气。
        - id: ch01-b78
          speaker: philip
          text: 我根本没生气。
          emotion: angry
        - id: ch01-b79
          speaker: narrator
          text: >-
            队长摆手叫他安静，又把露西盘问了一遍，把她的回答全记进黑簿子。
        - id: ch01-b80
          speaker: captain
          text: 这么说，这个小姑娘是你的朋友？
        - id: ch01-b81
          speaker: philip
          text: 她不是！她不是我的朋友，永远都不会是。我只是见过她，以后再也不想见她。
          emotion: angry
        - id: ch01-b82
          speaker: lucy
          text: 你真刻薄。
          emotion: sad
        - id: ch01-b83
          speaker: narrator
          text: >-
            屋里严肃地静了下来，菲利普很不好受。他察觉到，士兵们现在都冷冷看着他，而他认定这全是露西的错。她为什么偏要挤进来，把一切都毁掉？只要不是女孩，谁都知道卫兵室不该让女孩来。他皱着眉，一声不响。露西已经悄悄靠到队长膝边，队长正用手抚摸她的头发。
        - id: ch01-b84
          speaker: captain
          text: 可怜的小姑娘。现在该睡了，养足精神，明早还要去司法厅。
        - id: ch01-b85
          speaker: narrator
          text: >-
            士兵把斗篷铺在长凳上，替露西做了张床，又拿熊皮帽给她当枕头，再合适不过。菲利普也分到一件士兵斗篷、一张长凳和一顶熊皮帽，可这还有什么意思？一切已经毁了。露西没来时，把卫兵室当卧房，几乎跟露宿军营一样有趣。她偏偏来了，这里就跟任何一间旧式育儿室没两样了。她是怎么知道梯桥的？又怎么走到那片无边草原？最后，菲利普带着满身扎人的不满和压住的怒气，缩成一团睡着了。

    - id: ch02
      title: 囚犯受审
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            菲利普醒来时，天已经大亮。一名士兵正在叫着，醒醒，擅闯者，该吃早饭啦。他刚觉得吃军队的早餐一定很带劲，就想起露西也在，立刻又讨厌她待在这里，觉得她把一切都毁掉了。
        - id: ch02-b02
          speaker: narrator
          text: >-
            早餐有椰子冰、薄荷糖、苹果、黄油面包和甜牛奶。这样的早餐，我自己可不想吃，可士兵们吃得津津有味。要不是露西也吃得很香，菲利普一定会觉得这顿饭正合心意。他暗暗说，自己最讨厌嘴馋的女孩。一个人气得眼前发黑时，对方不管做什么、说什么，甚至是个什么样的人，都能惹他讨厌。菲利普现在正是这样。
        - id: ch02-b03
          speaker: narrator
          text: >-
            到了去司法厅的时候，卫队在门外整齐列队。菲利普发现，每个士兵脚下都踩着一块绿色垫子。行军命令一下，他们立刻又快又熟练地卷起垫子，夹在胳膊下。每逢人群堵住道路，队伍不得不停下来，他们便各自铺开垫子，重新站到上面，一直等到队伍再次出发。这一路停了好几回，因为城里的大广场和狭窄街道上，到处都挤满了人。
        - id: ch02-b04
          speaker: narrator
          text: >-
            那人群奇妙极了。男女老少穿着各种各样的衣裳，有意大利式的、西班牙式的，还有俄国式的。法国农民套着蓝罩衫，脚踩木鞋，工人的打扮像一百年前的英国劳动者。还有挪威人、瑞典人、瑞士人、土耳其人、希腊人、印度人、阿拉伯人、中国人和日本人。此外，还有身穿兽皮的美洲印第安人，以及穿褶裙、腰上佩着毛皮腰包的苏格兰人。大多数衣服究竟属于哪个国家，菲利普根本认不出来。在他眼中，那就像一幅用金色和各种鲜艳颜色拼成的灿烂百衲图。
        - id: ch02-b05
          speaker: narrator
          text: >-
            他想起从前和海伦参加过的一场化装舞会。那一次，他穿着丑角皮埃罗的衣服，觉得自己简直傻透了。他又发现，这群人里没有一个男孩像他这样穿衣，而在此以前，他一直认为，男孩本来就只该穿成自己这样。露西一直走在他身旁。刚出发不久，她曾经问过他一句。
        - id: ch02-b06
          speaker: lucy
          text: 菲利普，你害怕吗？
        - id: ch02-b07
          speaker: narrator
          text: >-
            菲利普没有回答。他很想说，当然不怕，只有女孩才会怕。可他觉得，沉默更能让露西难受，于是一路真的没开口。
        - id: ch02-b08
          speaker: narrator
          text: 到了司法厅，露西忽然抓住他的手，又响又急地叫了一声。
        - id: ch02-b09
          speaker: lucy
          text: 噢！这里没让你想起什么吗？
          emotion: surprised
        - id: ch02-b10
          speaker: narrator
          text: >-
            菲利普甩开她的手，脱口说了声没有，这才想起自己已经决定不跟她讲话。何况，这个“没有”根本不是真话。眼前这幢建筑的确让他想起了什么，只是连他自己也说不清，那究竟是什么。
        - id: ch02-b11
          speaker: narrator
          text: >-
            两个囚犯和押送他们的卫队穿过一道巨大的拱门，拱门两旁立着壮丽的银柱。随后，他们又走过一条宽阔的长廊，沿路列队的士兵一个接一个，全都朝他们郑重敬礼。
        - id: ch02-b12
          speaker: philip
          text: 所有士兵都会向您敬礼吗？还是只有您的部下才会？
        - id: ch02-b13
          speaker: captain
          text: 他们敬的是你。我国法律规定，囚犯遭遇不幸，人人都该尊重，所以士兵必须向所有囚犯敬礼。
        - id: ch02-b14
          speaker: narrator
          text: >-
            法官坐在高高的青铜宝座上，两边各盘着一条巨大的青铜龙。宝座前是一道道宽而浅的台阶，颜色黑白相间，全都用象牙做成。两名侍从走到法官面前，在最高一级台阶上铺开一张圆垫。那垫子是黄色的，厚实极了。法官从宝座上站起来，向两个囚犯敬礼。队长贴近菲利普，低声解释，这也是因为他们遭遇了不幸。
        - id: ch02-b15
          speaker: narrator
          text: >-
            法官穿着鲜黄色长袍，腰间系着一条绿带子。他没有戴假发，却顶着一顶形状古怪的帽子，而且从头到尾也没有摘下来。审判并没有持续多久。队长说得很少，法官说得更少，两个囚犯则一句话也不许讲。法官先在一本书里查了些什么，又和王室律师以及一个满脸酸相的黑衣人低声商量了一番，随后才戴上眼镜。
        - id: ch02-b16
          speaker: judge_noah
          text: >-
            栏前的囚犯，你们擅闯的罪名成立。惩罚是这样。法官若不喜欢囚犯，就处死刑。若是谈不上不喜欢，就终身监禁，或者一直关到法官有空重新考虑。把囚犯带走。
        - id: ch02-b17
          speaker: philip
          text: 噢，别这样！
          emotion: fearful
        - id: ch02-b18
          speaker: narrator
          text: 菲利普几乎要哭了。
        - id: ch02-b19
          speaker: lucy
          text: 我还以为你不害怕呢。
        - id: ch02-b20
          speaker: judge_noah
          text: 法庭肃静。
        - id: ch02-b21
          speaker: narrator
          text: >-
            菲利普和露西就这样被带走了。他们没有沿原路返回，而是顺着完全不同的街道穿过城市。走了好一阵，队伍终于来到另一座广场的角落。那里立着一幢漆黑的大房子，看起来正等着接收他们。
        - id: ch02-b22
          speaker: captain
          text: 到了。再见，祝你们下回运气好一点。
        - id: ch02-b23
          speaker: narrator
          text: >-
            狱卒穿着黑丝绒衣服，戴着轮状皱领，留一把尖胡子。他像位绅士一样出来，热情欢迎他们。
        - id: ch02-b24
          speaker: jailer
          text: 你们好啊，亲爱的孩子。希望你们住得舒服。想必是头等轻罪犯吧？
        - id: ch02-b25
          speaker: captain
          text: 当然。
        - id: ch02-b26
          speaker: jailer
          text: 那么请上顶楼。左转，再往上走。
        - id: ch02-b27
          speaker: narrator
          text: >-
            狱卒彬彬有礼地退到一旁，让两个孩子从他面前经过。楼梯昏暗极了，一圈又一圈，一层又一层，没完没了地向上延伸，好像永远也走不到头。最顶上有一间大屋子，陈设十分朴素，里面只有桌子、椅子和一匹摇摆木马。除了这些，一个人还需要什么家具呢？
        - id: ch02-b28
          speaker: jailer
          text: >-
            从这里能看到全城最好的景色，你们也能陪陪我。他们把狱卒的差事交给我，是因为这工作舒服、轻省，适合体面人，还给我留下时间写作。你们知道，我是个文学家。不过，我有时也觉得这里稍微冷清了一点。你们可是我接待的第一批囚犯。请原谅，我得去吩咐人给你们准备午饭。我相信，只要享用理智的盛宴，再来一番灵魂的畅谈，你们就会心满意足。

    - id: ch03
      title: 城市的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 狱卒的黑色背影刚从门后消失，菲利普就转身冲露西发作。
        - id: ch03-b02
          speaker: philip
          text: >-
            这下你满意了吧？全是你害的。你不在，他们准会放过我。你为什么非要来？为什么一直追着我？你明知道我不喜欢你。
          emotion: angry
        - id: ch03-b03
          speaker: lucy
          text: 你是全世界最可恨、最讨厌、最坏的男孩。就是这样！
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: 菲利普没料到她会这样回嘴，只好拼命招架。
        - id: ch03-b05
          speaker: philip
          text: 不管怎么说，我可不是偷偷摸摸的小白鼠，不会硬往没人要我的地方钻。
        - id: ch03-b06
          speaker: narrator
          text: 两个人互相瞪着，呼吸又急又重。最后还是露西先开口。
        - id: ch03-b07
          speaker: lucy
          text: 我宁愿当一只小白鼠，也不愿做凶巴巴的恶霸。
        - id: ch03-b08
          speaker: philip
          text: 我不是恶霸。
        - id: ch03-b09
          speaker: narrator
          text: >-
            房里又安静下来。露西抽了抽鼻子。菲利普环顾四周，看着这间空荡荡的房间，忽然想到，不论他们被关起来究竟是谁的错，现在他和露西总算一起落了难，成了患难伙伴。
        - id: ch03-b10
          speaker: philip
          text: >-
            听着，我不喜欢你，也不装作喜欢你。不过，只要你愿意，我们可以暂时讲和。我们得想办法逃出去。我会帮你，你要是有本事，也可以帮我。
        - id: ch03-b11
          speaker: lucy
          text: 谢谢。
        - id: ch03-b12
          speaker: narrator
          text: 她只说了这两个字，那口气却可能表示任何意思，菲利普根本听不出她是真的道谢，还是在讥讽他。
        - id: ch03-b13
          speaker: philip
          text: >-
            那就算讲和了。先看看能不能从窗户逃走。外面也许长着常春藤，或者有个忠心的侍童会带绳梯来救我们。庄园里有侍童吗？
        - id: ch03-b14
          speaker: lucy
          text: 有两个马童，可我不觉得他们有多忠心。还有，我觉得这里的魔法味儿，比你以为的浓得多。
        - id: ch03-b15
          speaker: philip
          text: 我当然知道这是魔法，可这一切也完全是真的。
        - id: ch03-b16
          speaker: lucy
          text: 噢，当然真得很。
        - id: ch03-b17
          speaker: narrator
          text: >-
            两个人一起探身望出窗外。唉，外墙上连一根常春藤也没有。窗户又高得吓人，他们伸手摸了摸外面的墙，那墙竟然像玻璃一样光滑，根本没有地方可以攀住。
        - id: ch03-b18
          speaker: philip
          text: 这条路走不通。
        - id: ch03-b19
          speaker: narrator
          text: >-
            他们把身子探得更远，低头看着城市。下方有坚固的高塔、秀丽的尖塔和一座座宫殿，还有棕榈树、喷泉与花园。广场对面那幢白色建筑出奇地眼熟。它会不会像菲利普很小时候被带去参观的圣保罗大教堂？那个地方，他一直怎么也想不起来。不，现在还是想不起来。两个囚犯久久没有说话，只管从高处俯瞰。城市远远铺在下方。树木在微风里轻轻摇摆，花朵像一幅鲜艳斑斓的拼图，纵横穿过大广场的运河在阳光下熠熠发亮。城里的人来来往往，穿过广场和街道，各自忙着自己的事。
        - id: ch03-b20
          speaker: lucy
          text: 听我说！你该不会真的不知道吧？
        - id: ch03-b21
          speaker: philip
          text: 不知道什么？
        - id: ch03-b22
          speaker: lucy
          text: 我们在哪里，这究竟是什么地方。你不知道吗？
        - id: ch03-b23
          speaker: philip
          text: 不知道，你也不知道。
        - id: ch03-b24
          speaker: lucy
          text: 你以前没见过这一切吗？
        - id: ch03-b25
          speaker: philip
          text: 当然没有，你也没见过。
        - id: ch03-b26
          speaker: lucy
          text: >-
            可我真的见过，你也见过。除非你肯好好待我，不然我不告诉你这是什么地方。
          emotion: sad
        - id: ch03-b27
          speaker: philip
          text: 我已经好好待你了，不是说过讲和了吗？快告诉我，你觉得这里是什么地方。
        - id: ch03-b28
          speaker: lucy
          text: >-
            我不要那种摆架子、冷冰冰的讲和，我要真正讲和。噢，菲利普，别再这么讨厌了。我都快憋不住了，真想告诉你。可你还这样，我就不说。
        - id: ch03-b29
          speaker: philip
          text: 我这样挺好。快说吧。
        - id: ch03-b30
          speaker: lucy
          text: >-
            不行。你要说，我们真正讲和了。逃出去以前，你会支持我。你永远会像一个高尚的朋友那样待我，也会尽力喜欢我。实在喜欢不了，那也没办法，可你总要试试。跟着我说，好不好？
        - id: ch03-b31
          speaker: narrator
          text: 露西说得又和善，又会劝人，菲利普不知不觉就跟着她念了起来。
        - id: ch03-b32
          speaker: philip
          text: >-
            我，菲利普，答应尽力喜欢你，露西。逃出去以前，我会支持你。我永远会像一个高尚的朋友那样待你。我们真正讲和了。握手吧。
        - id: ch03-b33
          speaker: narrator
          text: 两个人握了手。
        - id: ch03-b34
          speaker: philip
          text: 现在可以说了。
        - id: ch03-b35
          speaker: lucy
          text: >-
            你还没看出来吗？我们就在你自己的城市里，就是你在客厅桌上建的那座城！魔法把它变大了，我们才走得进来。你看，那座巨大的金圆顶，就是黄铜洗指钵。那幢白房子，是我的旧圣保罗大教堂模型。那边是白金汉宫，顶上摆着木雕松鼠，四周还有国际象棋棋子和蓝白瓷胡椒罐。我们脚下这幢楼，就是那只黑色日式柜子。
        - id: ch03-b36
          speaker: narrator
          text: 菲利普照她指的地方一个个看过去，发现露西说得一点不错。眼前这一切，的的确确就是他的城市。
        - id: ch03-b37
          speaker: philip
          text: 可我没有给那些房子造里面呀。还有，你是什么时候看见我造的城市的？
        - id: ch03-b38
          speaker: lucy
          text: >-
            里面大概是魔法变出来的。至于那两座城，是昨晚姨妈带我回家以后，我才看到的。那时你已经被赶去睡觉了。我喜欢得不得了。噢，菲利普，我真高兴我们和好了，因为我觉得你聪明极了，姨妈也这样想。你造出来的东西那么美！我知道保姆打算把它们全拆掉，还特地求她别拆，可她的心硬得很。不管我怎么求，她就是不肯答应。
        - id: ch03-b39
          speaker: lucy
          text: >-
            后来，我起床穿好衣服，偷偷下楼，想再看看月光里的城市。有一两块积木和棋子倒了，我猜是保姆碰倒的，就尽力把它们重新搭好。我越看越喜欢。就在这时，门忽然开了，我赶快藏到桌子底下，接着你就走了进来。
        - id: ch03-b40
          speaker: philip
          text: 原来你当时就在那儿。你看到魔法是怎么开始的吗？
        - id: ch03-b41
          speaker: lucy
          text: >-
            没有。我只看见所有东西都变成草，又看见你在远处往梯子上爬，我就追过去了。我没让你看见，因为知道你会生气。后来我从卫兵室门口往里看，真想喝一点椰汁。
        - id: ch03-b42
          speaker: philip
          text: 你什么时候认出这是我的城市？
        - id: ch03-b43
          speaker: lucy
          text: >-
            一开始，我只觉得那些士兵很像我的铅兵，还不敢肯定。直到看见法官，我才认出来。他就是方舟里的诺亚老先生呀。
        - id: ch03-b44
          speaker: philip
          text: >-
            真的是他！太奇妙了，简直奇妙极了！要是我们不是囚犯就好了。要是能走遍全城，进每一幢房子，看看里面都变成了什么，那该多有趣。还有其他那些人，我可没把他们放进来。
          emotion: surprised
        - id: ch03-b45
          speaker: lucy
          text: 我想，他们也是魔法变出来的。不过时间还长，我们总会把一切弄明白。
          emotion: happy
        - id: ch03-b46
          speaker: narrator
          text: 露西拍起手来。就在这时，房门开了，狱卒出现在门口。

    - id: ch04
      title: 两个逃走的囚犯
      blocks:
        - id: ch04-b01
          speaker: jailer
          text: 有人来看你们。
        - id: ch04-b02
          speaker: narrator
          text: >-
            狱卒退到旁边，让另一个人走进来。那人又高又瘦，披着一件带兜帽的黑斗篷，脸上还戴着一副黑色半面具，就像人们参加狂欢节时戴的那种。狱卒关门离开以后，高个子摘下面具，又脱掉斗篷。两个孩子既惊讶，又觉得这张脸十分眼熟，终于认出站在面前的正是法官，也就是诺亚先生。
        - id: ch04-b03
          speaker: judge_noah
          text: 你们好。这只是一次小小的非正式拜访，希望我没有来错时候。
        - id: ch04-b04
          speaker: lucy
          text: 我们很高兴您来，因为您能告诉我们——
        - id: ch04-b05
          speaker: judge_noah
          text: >-
            我不回答问题。不过，我可以告诉你们一件事。我们不知道你们是谁，可我个人认为，你们也许就是拯救者。
        - id: ch04-b06
          speaker: narrator
          text: 诺亚先生硬邦邦地坐在自己带来的黄垫子上。
        - id: ch04-b07
          speaker: philip
          text: 我们两个都是？
        - id: ch04-b08
          speaker: judge_noah
          text: >-
            一个，或者两个。预言说毁灭者长着红头发，而你们两个的头发都不是红色。可要让全体百姓相信这一点，恐怕我自己的头发早就因为不停思考和争辩变得灰白。有些人的脑袋简直是木头做的。何况我不习惯思考，平常很少需要做这种事。思考让我痛苦极了。
        - id: ch04-b09
          speakers: [philip, lucy]
          ensemble: duo
          text: 我们很抱歉。
        - id: ch04-b10
          speaker: philip
          text: >-
            请给我们讲一点这座城市吧。这不是问题。我们想知道，它是不是魔法变的。这也不是问题。
        - id: ch04-b11
          speaker: judge_noah
          text: >-
            我正要告诉你们，我不回答问题。当然是魔法。世上的一切，在你弄明白以前，都是魔法。至于这座城，我只说一点我们的历史。许多千年以前，我国所有城市都是一位强大无比的巨人建造的。他从四面八方运来各种材料。城里的居民，有些是他亲自挑选的，另一些则是一种很难解释、会自行运转的魔法造出来的。
        - id: ch04-b12
          speaker: judge_noah
          text: >-
            城市建好，居民也都安顿下来以后，城里的生活便开始了。对住在这里的人来说，日子仿佛从来就是这样。工匠每天辛勤做工，乐师演奏乐曲，诗人吟唱诗歌。占星师发现自己身在一座高塔里，那地方显然就是为占星造的，于是他们开始观察星辰，作出一个又一个预言。
        - id: ch04-b13
          speaker: philip
          text: 这一段我知道。
        - id: ch04-b14
          speaker: judge_noah
          text: >-
            很好，那你已经知道得够多了。现在想请你们帮一个小忙。你们介不介意逃走？
        - id: ch04-b15
          speaker: lucy
          text: 只要逃得掉就好了。
          emotion: sad
        - id: ch04-b16
          speaker: judge_noah
          text: >-
            我的神经实在受不了这种压力。亲爱的孩子们，逃走吧，就当是为了我这个身体不太好、心情又低落的老人。
          emotion: sad
        - id: ch04-b17
          speaker: lucy
          text: 可是怎么——
        - id: ch04-b18
          speaker: judge_noah
          text: >-
            噢，只管走出去。孩子，你可以用那件睡袍乔装，它就在那边椅子上。小姑娘，我把斗篷留给你。
        - id: ch04-b19
          speakers: [philip, lucy]
          ensemble: duo
          text: 谢谢您。
        - id: ch04-b20
          speaker: lucy
          text: 可是我们怎么走？
        - id: ch04-b21
          speaker: judge_noah
          text: >-
            从门走。有条规矩，囚犯必须用名誉担保自己不会逃跑。不过我们太久没抓到囚犯了，我想他们大概忘了让你们作这种保证，对吧？没有？那你们只管从门口走出去。城里有许多慈善家，他们会帮忙把你们藏起来。大门的钥匙很好转，我出去时会亲自给它上油。
        - id: ch04-b22
          speaker: judge_noah
          text: >-
            再见。多谢你们赞同我的小主意，请接受一位老人的祝福。只是千万别告诉狱卒，他永远不会原谅我。
        - id: ch04-b23
          speaker: narrator
          text: 诺亚先生站起来，卷好垫子，离开了。
        - id: ch04-b24
          speaker: lucy
          text: 哎呀！
          emotion: surprised
        - id: ch04-b25
          speaker: philip
          text: 哎呀！我想，我们该走了吧？
          emotion: surprised
        - id: ch04-b26
          speaker: lucy
          text: 可狱卒怎么办？我们逃走，他不会受罚吗？
        - id: ch04-b27
          speaker: narrator
          text: >-
            菲利普想了想，觉得露西的话也许没有错。这可真叫人恼火，几乎跟让他们用名誉保证不会逃跑一样糟糕。
        - id: ch04-b28
          speaker: philip
          text: 真讨厌！
        - id: ch04-b29
          speaker: narrator
          text: 狱卒这时走了进来。他脸色苍白，满面忧愁。
        - id: ch04-b30
          speaker: jailer
          text: >-
            我真是万分抱歉。我原以为自己会喜欢你们住在这里，可我的神经已经全乱了。只要听见你们讲话的声音，我就一个字也写不出来，脑子还直发晕。不知道你们肯不肯替我做一件小事？你们介不介意逃走？
        - id: ch04-b31
          speaker: lucy
          text: 可您不会惹上麻烦吗？
        - id: ch04-b32
          speaker: jailer
          text: >-
            没有什么会比现在的情形更糟了。我从来没有想到，孩子的声音竟然会有这么强的穿透力。走吧，走吧，我求你们逃出去。只是千万别告诉法官。我敢肯定，他知道以后，永远也不会原谅我。
        - id: ch04-b33
          speaker: narrator
          text: >-
            话都说到这份上，还有哪个囚犯不马上逃走呢？两个孩子只等狱卒的钥匙声消失在楼梯下面，便轻轻打开房门，跑下那数也数不清的台阶，溜出了监狱大门。他们没有说话，默默往前走了一小段路。四周来来往往的人并不少，可谁也没有特别留意他们。
        - id: ch04-b34
          speaker: lucy
          text: 我们该往哪边走？真希望刚才问过，那些慈善家住在哪里。
        - id: ch04-b35
          speaker: philip
          text: 我想——
        - id: ch04-b36
          speaker: narrator
          text: >-
            可露西注定没有机会听见他在想什么。一声喊叫忽然响起，紧接着又传来一阵急促的马蹄声。广场上所有人的脸同时朝他们转了过来。
        - id: ch04-b37
          speaker: philip
          text: 他们发现我们了！跑，快跑，快跑！
          emotion: fearful
        - id: ch04-b38
          speaker: narrator
          text: >-
            菲利普自己先拔腿跑起来，直奔他们爬梯阶上来时经过的那座门楼。身后的喊声没有停，杂乱的马蹄声也一路紧追，一场不肯放松的追捕开始了。队长独自站在大门口。菲利普刚刚跑到门前，他便转身走进卫兵室，装作什么也没有看见。菲利普从没一口气跑过这么远，也从没有跑得这么快。他大口喘气，声音像在呜咽，可总算赶到了梯子边。他立刻抓住梯阶，飞快向下爬。下梯子毕竟比爬上来容易得多。
        - id: ch04-b39
          speaker: narrator
          text: >-
            快要抵达底端时，整座梯桥突然疯狂地蹦上半空。菲利普从桥上摔了下来，滚进无边草原的厚草丛里。四面八方一下充满了巨大的声响，仿佛一场地震正在摧毁美丽的大宫殿，也摧毁那些庞大却并不美丽的工厂。那声音震耳欲聋，无穷无尽，叫人根本无法忍受。
        - id: ch04-b40
          speaker: narrator
          text: >-
            可他不但得忍受这阵巨响，还要忍受更多事情。先是双手，再是脑袋，然后轮到整个身体，他觉得自己正在古怪地膨胀起来。那感觉痛苦极了。他疼得在地上不停打滚，看见旁边有一只巨大无比的脚。脚上套着一只又大、又扁、又难看的鞋，鞋的上方垂着一片低低的灰色，像一幅不停摇摆的帷幕。灰色背景前还竖着一根醒目的黑色巨柱，被撞倒的梯桥横躺在不远处。
        - id: ch04-b41
          speaker: narrator
          text: >-
            最后，痛苦和恐惧彻底压倒了菲利普。他再也听不见任何声音，感觉不到任何东西，也不知道发生了什么。等他恢复知觉，才发现自己躺在客厅的桌子下面。那种身体不断膨胀的感觉已经消失。看起来，他一点也没有比原来的尺寸更大，还是原来的菲利普。
        - id: ch04-b42
          speaker: narrator
          text: >-
            他看见保姆那双扁平的脚，还有灰裙子的下半截。头顶的桌面上不断传来咯啦咯啦、轰隆轰隆的响声。保姆果然像自己说过的那样，正在摧毁他的城市。她不时走开，把菲利普拿来建城的某样东西放回原处。有一次，她还站到了椅子上。菲利普听见水晶坠饰叮叮作响，知道她正把那些东西重新挂回枝形吊灯。
        - id: ch04-b43
          speaker: philip
          text: >-
            只要我一直躺着，一动不动，她也许就看不见我。不过，我真想知道自己究竟是怎么回来的。等我把这场梦从头到尾讲给海伦听，她准会大吃一惊！
        - id: ch04-b44
          speaker: narrator
          text: >-
            他就这样躺着，一动也不动，保姆果然没有看见他。等她终于下楼吃早饭，菲利普才从桌子下面爬出来。是的，那座城市已经消失得干干净净，连一点痕迹也没有留下。就连用来建城的两张桌子，也都回到了原来的位置。
        - id: ch04-b45
          speaker: narrator
          text: 城市里的东西全回了原位，菲利普也回到自己原来的位置。当然，对他来说，那个位置就是自己的床上。
        - id: ch04-b46
          speaker: philip
          text: 多么精彩的一场梦。现在，一切都结束了！
        - id: ch04-b47
          speaker: narrator
          text: 菲利普钻进被单中间，舒舒服服地蜷起身子，认定那场冒险已经过去。当然，他完全错了。
