  chapters:
    - id: ch01
      title: CHAPTER II. DELIVERER OR DESTROYER
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Philip stood inside the dark arch and looked out at a great square. Tall, uneven buildings rose around it. In the middle, a fountain shone silver in the moonlight, its water rising and falling with a soft splash. Near the arch, a tall tree threw one broad black shadow across the path. Philip listened and listened. There was only the deep silence of night and the changing sound of the fountain.
        - id: ch01-b02
          speaker: narrator
          text: >-
            As his eyes grew used to the dark, he saw that a heavy domed roof hung above him, held up by great square pillars. On either side stood a closed door.
        - id: ch01-b03
          speaker: philip
          text: >-
            I'll explore those doors when it's daylight.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He was not exactly frightened, but he was not exactly brave either. He meant to be brave, though, and he meant to be truthful too.
        - id: ch01-b05
          speaker: philip
          text: >-
            Yes, I'll explore them. At least, I think I will.
        - id: ch01-b06
          speaker: narrator
          text: >-
            All at once he felt terribly sleepy. First he leaned against the wall. Before long, sitting down seemed much less trouble. Then lying down seemed more comfortable still. A bell very, very far away began to strike twelve. Philip counted the strokes until he reached nine. He missed the tenth, the eleventh, and the twelfth because he was already fast asleep. He lay curled up warmly inside the thick quilted dressing gown Helen had made him the winter before.
        - id: ch01-b07
          speaker: narrator
          text: >-
            He dreamed that everything was as it used to be, before That Man came and changed it all and took Helen away. Philip lay in his own little bed, in his own little room, in their own little house. Helen had come to call him. Sunlight shone through his closed eyelids. He was keeping them shut just for the pleasure of hearing her try to wake him. In a moment, he would tell her he had been awake all along, and the two of them would laugh together.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Then he woke. He was lying on the hard floor of the strange gatehouse, not in his soft bed. It was not Helen shaking him. A tall man in a red coat was telling him to wake up, and the bright light in his eyes came from a horn lantern held close to his face.
        - id: ch01-b09
          speaker: philip
          text: >-
            What's happened?
        - id: ch01-b10
          speaker: guard
          text: >-
            That's what we need to find out. Come to the guardroom, young fellow, and explain yourself.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The man caught Philip's ear gently but firmly between a hard finger and thumb.
        - id: ch01-b12
          speaker: philip
          text: >-
            Let go. I won't run away.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Philip stood up feeling very brave. The man moved his grip from Philip's ear to his shoulder and led him through one of the very doors Philip had planned to explore by daylight. Daylight had not come yet. The room was large and bare, with an arch at either end and narrow little windows down the sides. Horn lanterns burned there, along with tall candles set in pewter candlesticks. To Philip, the room seemed full of soldiers.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Their captain had a neat black moustache and a great deal of gold on his uniform. He rose from a bench.
        - id: ch01-b15
          speaker: guard
          text: >-
            Look what I've caught, sir.
        - id: ch01-b16
          speaker: captain
          text: >-
            Hmm. So it has really happened at last.
        - id: ch01-b17
          speaker: philip
          text: >-
            What has happened?
        - id: ch01-b18
          speaker: captain
          text: >-
            You have. Don't be afraid, little man.
        - id: ch01-b19
          speaker: philip
          text: >-
            I'm not afraid. But I'd be very grateful if you'd explain what you mean. I'm a complete stranger here.
        - id: ch01-b20
          speaker: narrator
          text: >-
            All the red-coated soldiers burst into a great, cheerful roar of laughter.
        - id: ch01-b21
          speaker: philip
          text: >-
            It's rude to laugh at strangers.
        - id: ch01-b22
          speaker: captain
          text: >-
            Mind your own manners. In this country, boys speak when they're spoken to. And of course you're a stranger. We already knew that.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Philip felt snubbed by the captain's words, but at the same time he felt grand and important. Here he was, right in the middle of a real adventure, surrounded by grown-up soldiers. He pushed out his chest as far as it would go and did his best to look like a man.
        - id: ch01-b24
          speaker: narrator
          text: >-
            The captain sat at the end of a long table and pulled a dusty black book toward him. He rubbed a rusty pen point along his sword, which was not rusty at all, and opened the book.
        - id: ch01-b25
          speaker: captain
          text: >-
            Now tell me how you came here, and be sure you tell the truth.
        - id: ch01-b26
          speaker: philip
          text: >-
            I always tell the truth.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Every soldier stood and saluted him with astonished respect.
        - id: ch01-b28
          speaker: philip
          text: >-
            Well, nearly always.
        - id: ch01-b29
          speaker: narrator
          text: >-
            His ears burned. The soldiers dropped noisily onto their benches and laughed again. Philip had expected better discipline in an army.
        - id: ch01-b30
          speaker: captain
          text: >-
            How did you get here?
        - id: ch01-b31
          speaker: philip
          text: >-
            I came up the great bridge staircase.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The captain wrote busily in the book.
        - id: ch01-b33
          speaker: captain
          text: >-
            What did you come for?
        - id: ch01-b34
          speaker: philip
          text: >-
            I didn't know what else to do. There was nothing there except an endless prairie, so I came up.
        - id: ch01-b35
          speaker: captain
          text: >-
            You are a very bold boy.
        - id: ch01-b36
          speaker: philip
          text: >-
            Thank you. I do want to be.
        - id: ch01-b37
          speaker: captain
          text: >-
            What purpose brought you here?
        - id: ch01-b38
          speaker: philip
          text: >-
            I didn't plan it. I simply happened to come.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The captain wrote that down too. Then he, Philip, and all the soldiers stared at one another in silence.
        - id: ch01-b40
          speaker: philip
          text: >-
            Well?
        - id: ch01-b41
          speaker: captain
          text: >-
            Well?
        - id: ch01-b42
          speaker: philip
          text: >-
            I wish you'd tell me why you said I'd really happened at last. Then I'd like you to tell me how to get home.
        - id: ch01-b43
          speaker: captain
          text: >-
            Where is home?
        - id: ch01-b44
          speaker: philip
          text: >-
            The address is The Grange, Ravelsham, Sussex.
        - id: ch01-b45
          speaker: captain
          text: >-
            Never heard of it. You can't go back yet anyway. Didn't you read the notice at the top of the ladder? Trespassers will be prosecuted. Before you go anywhere, you must be prosecuted.
        - id: ch01-b46
          speaker: philip
          text: >-
            I'd rather be persecuted than climb down that ladder again. Being persecuted won't be too awful, will it?
        - id: ch01-b47
          speaker: narrator
          text: >-
            Everything Philip knew about persecution came from books. In his mind, it was something unpleasant, though only in a rather hazy way. It was also sure to be adventurous. Best of all, the persecuted person always managed to escape in a disguise, and the escape always succeeded.
        - id: ch01-b48
          speaker: captain
          text: >-
            The judges will decide. Trespassing here is serious. This guard exists to prevent it.
        - id: ch01-b49
          speaker: philip
          text: >-
            Do many trespassers come?
        - id: ch01-b50
          speaker: narrator
          text: >-
            The captain seemed kind enough to ask. Besides, Philip had a great-uncle who was a judge. Because of that, the word “judges” made him think of useful advice and money given as a tip. It did not make him think of stern justice or dreadful punishment.
        - id: ch01-b51
          speaker: captain
          text: >-
            Many? That's exactly the trouble. There has never been one before. You are the first. When this town was built, the astrologers foretold that a trespasser would come one day and cause untold harm. We are the Polistopolitan guards. For years and years, we have watched the only entrance a trespasser could use.
        - id: ch01-b52
          speaker: philip
          text: >-
            May I sit down?
        - id: ch01-b53
          speaker: narrator
          text: >-
            The soldiers made room for him on their bench.
        - id: ch01-b54
          speaker: captain
          text: >-
            My father served in the guards, and so did my grandfather and every one of my ancestors. It is a very great honor.
        - id: ch01-b55
          speaker: philip
          text: >-
            Why not cut off the top of the ladder? Then no one could climb up.
        - id: ch01-b56
          speaker: captain
          text: >-
            We could never do that. Another prophecy says the great Deliverer will come by that same way.
        - id: ch01-b57
          speaker: philip
          text: >-
            Couldn't I be the Deliverer instead of the trespasser? I'd much rather be that.
        - id: ch01-b58
          speaker: captain
          text: >-
            I'm sure you would. But wanting to be a Deliverer doesn't make a person one.
        - id: ch01-b59
          speaker: philip
          text: >-
            Are the trespasser and the Deliverer the only people who can come up the ladder bridge?
        - id: ch01-b60
          speaker: captain
          text: >-
            We don't know. That's the trouble with prophecies. They're so vague and mixed up. One of ours says, “Who comes up the ladder stair? Beware, beware. Steely eyes and copper hair, strife and grief and pain to bear, all come up the ladder stair.” It might mean one person, or a whole crowd with steely eyes and copper hair.
        - id: ch01-b61
          speaker: philip
          text: >-
            My hair is just ordinary boy color. That's what my sister says. And I think my eyes are blue.
        - id: ch01-b62
          speaker: captain
          text: >-
            I can't tell in this light.
        - id: ch01-b63
          speaker: narrator
          text: >-
            The captain leaned across the table and peered seriously into Philip's eyes.
        - id: ch01-b64
          speaker: captain
          text: >-
            No, I still can't tell. But the other prophecy says, “From down and down and very far down, the king shall come to take his own. He shall deliver the Magic Town, and all that he made shall be his own. Beware, take care. Beware, prepare. The king shall come by the ladder stair.”
        - id: ch01-b65
          speaker: philip
          text: >-
            How splendid! I love poetry. Do you know any more?
        - id: ch01-b66
          speaker: captain
          text: >-
            Heaps. The astrologers must do something to earn their pay. Here's a rather nice one. “Every night when the bright stars blink, the guards shall turn out and have a drink as the clock strikes two. And every night when no stars are seen, the guards shall drink in their own canteen when the clock strikes two.” There are no stars tonight, so the drinks come here. It saves us crossing the square, and the principle is the same. With a prophecy, principle is everything.
        - id: ch01-b67
          speaker: philip
          text: >-
            Yes.
        - id: ch01-b68
          speaker: narrator
          text: >-
            The distant bell sounded again. One. Two. Outside came the light patter of feet. A soldier rose, saluted the captain, and threw open the door. For a moment, no one entered. Philip waited for someone carrying a tray and glasses. That was what happened at his great-uncle's house when gentlemen suddenly became thirsty at a time that was not a mealtime.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Instead, twelve greyhounds stepped delicately into the room on soft, catlike feet. Each dog wore a round object at its neck, like the little barrel in pictures of Saint Bernard dogs. The soldiers untied the objects and set them on the table. They were not barrels at all. They were coconuts.
        - id: ch01-b70
          speaker: narrator
          text: >-
            The soldiers reached up for pewter cups on a high shelf. They pierced the coconuts with their bayonets and poured out the milk. Every soldier had a drink, so the prophecy came true. They gave Philip a drink as well. The milk was delicious, and he could have as much as he wanted. Have you ever had as much coconut milk as you wanted? The storyteller never has.
        - id: ch01-b71
          speaker: narrator
          text: >-
            Then they tied the empty coconuts around the dogs' necks again. The beautiful slim dogs trotted out two by two, wagging their narrow tails in the friendliest, most orderly way.
        - id: ch01-b72
          speaker: captain
          text: >-
            They carry the coconuts to the town kitchen. The shells will be made into coconut ice for the army's breakfast. Waste not, want not. We waste nothing here, my boy.
        - id: ch01-b73
          speaker: narrator
          text: >-
            By now Philip had completely forgotten the captain's earlier snub. The captain was speaking to him as one man speaks to another. Helen had gone away and left him, but perhaps he was learning how to do without Helen. He had escaped from the Grange, from Lucy, and from that nurse. Here he was, a man among men. He felt important enough to stand before any number of judges.
        - id: ch01-b74
          speaker: narrator
          text: >-
            At that very moment, a small tap came at the guardroom door, followed by a very small voice.
        - id: ch01-b75
          speaker: lucy
          text: >-
            Oh, please may I come in?
        - id: ch01-b76
          speaker: narrator
          text: >-
            The door slowly opened.
        - id: ch01-b77
          speaker: captain
          text: >-
            Come in, whoever you are.
        - id: ch01-b78
          speaker: narrator
          text: >-
            In came Lucy. Philip had thought he was rid of her. To him, she stood for the new and hateful life Helen had left him to face. There she was in her serge skirt and jersey, with her smooth fair braids and her anxious smile that seemed to ask him to be friends. Philip was furious. It was too bad.
        - id: ch01-b79
          speaker: captain
          text: >-
            And who might you be?
        - id: ch01-b80
          speaker: lucy
          text: >-
            I'm Lucy. I came up with him.
        - id: ch01-b81
          speaker: narrator
          text: >-
            She pointed at Philip. Bitterly, he thought that she had no manners.
        - id: ch01-b82
          speaker: philip
          text: >-
            No, you did not.
        - id: ch01-b83
          speaker: lucy
          text: >-
            I did. I was right behind you on the ladder bridge. I've been waiting by myself ever since, even while you slept. I knew he'd be angry when he found out I'd followed him.
        - id: ch01-b84
          speaker: philip
          text: >-
            I am not angry!
          emotion: angry
        - id: ch01-b85
          speaker: narrator
          text: >-
            He said it very angrily indeed. The captain motioned for silence. Lucy answered his questions, and he wrote each answer in the book.
        - id: ch01-b86
          speaker: captain
          text: >-
            So this little girl is your friend?
        - id: ch01-b87
          speaker: philip
          text: >-
            No! She isn't my friend, and she never will be. I've seen her, that's all. I don't ever want to see her again.
          emotion: angry
        - id: ch01-b88
          speaker: lucy
          text: >-
            You are unkind.
          emotion: sad
        - id: ch01-b89
          speaker: narrator
          text: >-
            A grave silence followed, and Philip found it most unpleasant. He could see that all the soldiers looked coldly at him now. Of course, he blamed Lucy for that. Why had she pushed her way in and spoiled everything? Anyone but a girl would have known that a guardroom was not the right place for a girl. Philip frowned and said nothing. Lucy had edged close against the captain's knee, and the captain was gently stroking her hair.
        - id: ch01-b90
          speaker: captain
          text: >-
            Poor little woman. You must sleep now and rest before you go to the Hall of Justice in the morning.
        - id: ch01-b91
          speaker: narrator
          text: >-
            The soldiers spread their cloaks over a bench to make Lucy a bed, and a bearskin made the very best sort of pillow. Philip received a bench of his own, a soldier's cloak, and a bearskin too. But what good were any of them now? Without Lucy, the guardroom would have been almost as exciting a place to sleep as a tent on a battlefield. Because she had come, it felt no better to him than any ordinary old night nursery.
        - id: ch01-b92
          speaker: narrator
          text: >-
            How had she known where he had gone? How had she reached the endless prairie and found the mysterious ladder bridge? Philip fell asleep curled into a tight knot of anger and prickly discontent.
        - id: ch01-b93
          speaker: guard
          text: >-
            Wake up, trespassers. Breakfast!
        - id: ch01-b94
          speaker: narrator
          text: >-
            It was bright daylight. Philip thought a military breakfast sounded splendid. Then he remembered Lucy and hated having her there all over again.
        - id: ch01-b95
          speaker: narrator
          text: >-
            Breakfast was coconut ice, peppermint creams, apples, bread and butter, and sweet milk. It may not sound like a breakfast everyone would care for, but the soldiers certainly enjoyed it. It would have suited Philip exactly as well. The only thing spoiling it was the sight of Lucy enjoying every bit of it too.
        - id: ch01-b96
          speaker: narrator
          text: >-
            He told himself he hated greedy girls. His rage had grown so black that he hated everything Lucy did, everything she said, and everything she was.
        - id: ch01-b97
          speaker: narrator
          text: >-
            Then it was time to leave for the Hall of Justice. The guard formed up outside, and Philip noticed that every soldier stood upon a green mat. When the command to march was given, the soldiers quickly and expertly rolled up their mats and tucked them under their arms. The streets were crowded, so the procession had to stop several times. At each stop, every soldier unrolled his mat, stood upon it, and waited there until it was time to move again.
        - id: ch01-b98
          speaker: narrator
          text: >-
            The city's broad squares and narrow streets were packed with people. Men, women, and children wore every sort of clothing. Philip saw Italians, Spaniards, and Russians. French peasants wore blue smocks and wooden shoes, while English workmen dressed as working people had a hundred years earlier. There were Norwegians, Swedes, Swiss, Turks, Greeks, Indians, Arabians, Chinese, and Japanese. Native Americans wore clothes made of skins, and Scots wore kilts with sporrans.
        - id: ch01-b99
          speaker: narrator
          text: >-
            Philip could not name most of the clothes. He saw only a bright patchwork of gold and cheerful colors. It reminded him of a fancy-dress party where he had worn a Pierrot costume and felt very foolish. Not one boy in the crowd wore what Philip considered the proper clothes for a boy.
        - id: ch01-b100
          speaker: narrator
          text: >-
            Lucy walked beside him.
        - id: ch01-b101
          speaker: lucy
          text: >-
            Are you frightened, Philip?
        - id: ch01-b102
          speaker: narrator
          text: >-
            Philip wanted to tell her that only girls were afraid. But saying nothing seemed even more disagreeable, so he refused to answer.
        - id: ch01-b103
          speaker: narrator
          text: >-
            At the Hall of Justice, Lucy caught his hand.
        - id: ch01-b104
          speaker: lucy
          text: >-
            Oh! Doesn't this place remind you of something?
          emotion: surprised
        - id: ch01-b105
          speaker: narrator
          text: >-
            Philip pulled his hand away.
        - id: ch01-b106
          speaker: philip
          text: >-
            No.
        - id: ch01-b107
          speaker: narrator
          text: >-
            He had decided not to speak to Lucy, and now he had forgotten his own decision. Worse still, his answer was not true. The building really did remind him of something, though he could not have told anyone exactly what it was.
        - id: ch01-b108
          speaker: narrator
          text: >-
            The prisoners and their guards passed beneath a great arch between magnificent silver pillars. They followed a vast corridor lined with soldiers, every one of whom saluted.
        - id: ch01-b109
          speaker: philip
          text: >-
            Do all kinds of soldiers salute you, or only your own guards?
        - id: ch01-b110
          speaker: captain
          text: >-
            They are saluting you. Our laws say that all prisoners must be saluted out of respect for their misfortunes.
        - id: ch01-b111
          speaker: narrator
          text: >-
            The judge sat high on a bronze throne. A huge bronze dragon stood on either side of him, and broad, shallow steps of black and white ivory led up to his seat. Two attendants spread a round, thick yellow mat on the top step before him. The judge stood upon it and saluted the prisoners. The captain whispered that this salute, too, was given because of their misfortunes.
        - id: ch01-b112
          speaker: narrator
          text: >-
            The judge wore a bright yellow robe with a green sash. He had no wig, only a very oddly shaped hat, and he kept that hat on the entire time. The trial did not last long. The captain said very little. The judge said even less, while the two prisoners were not permitted to speak at all. The judge looked something up in a book. Then he held a quiet discussion with the crown lawyer and a sour-faced person dressed in black. At last he put on his spectacles.
        - id: ch01-b113
          speaker: judge
          text: >-
            Prisoners at the bar, you are guilty of trespass. If the judge dislikes the prisoners, the punishment is death. If he does not dislike them, it is imprisonment for life, or until he has had time to think the matter over. Take them away.
        - id: ch01-b114
          speaker: philip
          text: >-
            Oh, please don't!
          emotion: fearful
        - id: ch01-b115
          speaker: narrator
          text: >-
            Philip was almost crying.
        - id: ch01-b116
          speaker: lucy
          text: >-
            I thought you said you weren't afraid.
        - id: ch01-b117
          speaker: judge
          text: >-
            Silence in court.
        - id: ch01-b118
          speaker: narrator
          text: >-
            Philip and Lucy were taken away from the court. Their guards marched them through streets quite different from the ones they had followed on the way there. At last, in one corner of a square, they came to a large house that was black from top to bottom.
        - id: ch01-b119
          speaker: captain
          text: >-
            Here you are. Goodbye, and better luck next time.
        - id: ch01-b120
          speaker: narrator
          text: >-
            The gaoler came out to greet them. He was a gentleman in black velvet, with a ruff around his neck and a pointed beard.
        - id: ch01-b121
          speaker: gaoler
          text: >-
            How do you do, my dears? I hope you will be comfortable. First-class misdemeanants, I suppose?
        - id: ch01-b122
          speaker: captain
          text: >-
            Of course.
        - id: ch01-b123
          speaker: gaoler
          text: >-
            Top floor, please. Turn left and go up the stairs.
        - id: ch01-b124
          speaker: narrator
          text: >-
            He politely stepped aside to let the children pass. The stairs were dark. They went on and on, winding round and round, climbing up and up. At the very top was a large room, plainly furnished with a table, some chairs, and a rocking horse. And really, what more furniture could anyone need?
        - id: ch01-b125
          speaker: gaoler
          text: >-
            You have the finest view in the city, and you'll keep me company. They made me gaoler because the work is pleasant, respectable, and light, with plenty of time for my writing. I am a literary man. Still, it can be a little lonely. You are my first prisoners. If you'll excuse me, I'll order dinner. I'm sure the feast of reason and the flow of soul will satisfy you.
        - id: ch01-b126
          speaker: narrator
          text: >-
            The instant the gaoler's black back disappeared through the door, Philip turned on Lucy.
        - id: ch01-b127
          speaker: philip
          text: >-
            I hope you're pleased. This is all your fault. They would have let me go if you hadn't come. Why did you have to run after me? You know I don't like you.
          emotion: angry
        - id: ch01-b128
          speaker: lucy
          text: >-
            You are the most hateful, disagreeable, horrible boy in the whole world. There!
          emotion: angry
        - id: ch01-b129
          speaker: narrator
          text: >-
            Philip had not expected that. He answered as well as he could.
        - id: ch01-b130
          speaker: philip
          text: >-
            At least I'm not a sneaking little white mouse that squeezes in where nobody wants it.
          emotion: angry
        - id: ch01-b131
          speaker: narrator
          text: >-
            They stood glaring at each other, both breathing fast.
        - id: ch01-b132
          speaker: lucy
          text: >-
            I'd rather be a white mouse than a cruel bully.
          emotion: angry
        - id: ch01-b133
          speaker: philip
          text: >-
            I am not a bully.
        - id: ch01-b134
          speaker: narrator
          text: >-
            Silence fell between them once more. Lucy sniffed. Philip looked around the bare prison room, and a new thought suddenly came to him. Whatever he felt about Lucy, and no matter whose fault their imprisonment was, the two of them were now companions in the same misfortune.
        - id: ch01-b135
          speaker: philip
          text: >-
            Listen. I don't like you, and I won't pretend I do. But we can call a truce for now. We have to escape somehow. I'll help you, and you can help me if you're able.
        - id: ch01-b136
          speaker: lucy
          text: >-
            Thank you.
        - id: ch01-b137
          speaker: narrator
          text: >-
            Her tone might have meant anything at all.
        - id: ch01-b138
          speaker: philip
          text: >-
            Then it's Pax. Let's see if we can climb out the window. There might be ivy, or a faithful page with a rope ladder. Do you have a page at the Grange?
        - id: ch01-b139
          speaker: lucy
          text: >-
            There are two stable boys, but I don't think either one is faithful. And Philip, I think this is much more magical than you realize.
        - id: ch01-b140
          speaker: philip
          text: >-
            I know it's magic. But it's completely real too.
        - id: ch01-b141
          speaker: lucy
          text: >-
            Oh, it's real enough.
        - id: ch01-b142
          speaker: narrator
          text: >-
            They leaned out of the window. There was no ivy. The window was very high, and the wall felt smooth as glass beneath their hands.
        - id: ch01-b143
          speaker: philip
          text: >-
            That won't work.
        - id: ch01-b144
          speaker: narrator
          text: >-
            They leaned farther out and looked across the town. Strong towers, slender minarets, and fine palaces rose among palm trees, fountains, and gardens. Across the square stood a white building that seemed strangely familiar to Philip. Could it look like Saint Paul's? He had been taken there when he was very small, but he had never managed to remember it. No, he decided. Even now, he could not remember Saint Paul's well enough to tell.
        - id: ch01-b145
          speaker: narrator
          text: >-
            For a long time the two prisoners looked down in silence. Far below them lay the whole city. Its trees moved softly in the breeze. Flowers shone in bright patches of many colors. Canals cut across the great squares and flashed in the sunlight. Everywhere, through the squares and along the streets, the people of the city crossed and recrossed one another as they went about their business.
        - id: ch01-b146
          speaker: lucy
          text: >-
            Philip, do you really mean you don't know?
        - id: ch01-b147
          speaker: philip
          text: >-
            Know what?
        - id: ch01-b148
          speaker: lucy
          text: >-
            Where we are. What this place is. Don't you know?
        - id: ch01-b149
          speaker: philip
          text: >-
            No, and neither do you.
        - id: ch01-b150
          speaker: lucy
          text: >-
            Haven't you ever seen it before?
        - id: ch01-b151
          speaker: philip
          text: >-
            Of course not. You haven't either.
        - id: ch01-b152
          speaker: lucy
          text: >-
            All right. I have seen it, and so have you. But I won't tell you what it is unless you're nice to me.
          emotion: sad
        - id: ch01-b153
          speaker: narrator
          text: >-
            She sounded a little sad, but quite determined.
        - id: ch01-b154
          speaker: philip
          text: >-
            I am being nice. I said it was Pax. Now tell me what you think.
        - id: ch01-b155
          speaker: lucy
          text: >-
            I don't want that grand, standoffish sort of Pax. I mean real Pax. Please don't be so horrid, Philip. I'm longing to tell you, but I won't while you behave like this.
        - id: ch01-b156
          speaker: philip
          text: >-
            There's nothing wrong with me. Go on and tell me.
        - id: ch01-b157
          speaker: lucy
          text: >-
            No. You must promise real Pax. Say, “I will stand by you until we're out of here. I will always be a noble friend to you, and I will do my best to like you.” You may never like me, but you ought to try. Please say it after me.
        - id: ch01-b158
          speaker: narrator
          text: >-
            Lucy spoke so kindly and persuasively that Philip found himself repeating the promise.
        - id: ch01-b159
          speaker: philip
          text: >-
            I, Philip, promise to try to like you, Lucy. I'll stand by you until we get out, and I'll always act like a noble friend. It is real Pax. Shake hands.
        - id: ch01-b160
          speaker: narrator
          text: >-
            They shook hands.
        - id: ch01-b161
          speaker: philip
          text: >-
            Now tell me.
        - id: ch01-b162
          speaker: lucy
          text: >-
            Don't you see? We are inside your own city, the city you built on the drawing-room tables. Magic made it all enormous so we could come in. Look at that great gold dome. It's one of the brass finger bowls. The white building is my old model of Saint Paul's. There's Buckingham Palace, with the carved squirrel on top. And look at the chessmen and the blue-and-white china pepper pots. This prison is the black Japanese cabinet.
        - id: ch01-b163
          speaker: narrator
          text: >-
            Philip looked from one familiar object to another. As soon as Lucy named them, he could see that every word she had spoken was true. This strange and enormous place really was his own city.
        - id: ch01-b164
          speaker: philip
          text: >-
            But I never built anything inside the buildings. And when did you see my city?
        - id: ch01-b165
          speaker: lucy
          text: >-
            I suppose the insides came from the magic. I saw what you built when Auntie brought me home last night, after you were in bed. I loved it all. Oh, Philip, I'm so glad we're truly Pax, because you are frightfully clever. Auntie thought so too. Those cities were beautiful.
        - id: ch01-b166
          speaker: lucy
          text: >-
            I knew Nurse meant to pull everything down. I begged her not to, but she was addymant. So I got dressed, crept downstairs, and looked at the city again by moonlight. A few bricks and chessmen had fallen. Nurse must have knocked them over. I rebuilt them as well as I could, and I was enjoying it so much. Then the door opened. I hid under the table, and you came in.
        - id: ch01-b167
          speaker: philip
          text: >-
            You were there? Did you see how the magic started?
        - id: ch01-b168
          speaker: lucy
          text: >-
            No. Everything suddenly turned to grass. Then I saw you far away, climbing a ladder, so I followed. I stayed out of sight because I knew you'd be cross. Later I peeked through the guardroom door. I wanted some of that coconut milk so badly.
        - id: ch01-b169
          speaker: philip
          text: >-
            When did you know it was my city?
        - id: ch01-b170
          speaker: lucy
          text: >-
            The soldiers somehow looked like my lead ones, but I wasn't certain until I saw the judge. Why, he's old Noah from the Ark!
        - id: ch01-b171
          speaker: philip
          text: >-
            He is! How wonderful. How perfectly wonderful! If only we weren't prisoners. We could explore every building and discover what appeared inside. And all those other people! I never put them there.
          emotion: surprised
        - id: ch01-b172
          speaker: lucy
          text: >-
            I expect that's more of the magic. Oh, we'll discover everything in time.
        - id: ch01-b173
          speaker: narrator
          text: >-
            Lucy clapped her hands. At once the door opened and the gaoler appeared.
        - id: ch01-b174
          speaker: gaoler
          text: >-
            You have a visitor.
        - id: ch01-b175
          speaker: narrator
          text: >-
            He stepped aside, and someone tall and thin entered the room. The visitor wore a black hooded cloak and a black half-mask of the sort people wear at carnival time. The gaoler closed the door and went away. Then the tall figure removed the mask and let the cloak fall. The children stared in surprise, but they recognized the familiar shape before them. Their visitor was Mr. Noah, the judge.
        - id: ch01-b176
          speaker: judge
          text: >-
            How do you do? This is a small unofficial visit. I hope I haven't arrived at an inconvenient moment.
        - id: ch01-b177
          speaker: lucy
          text: >-
            We're glad you're here, because you can tell us—
        - id: ch01-b178
          speaker: judge
          text: >-
            I will not answer questions. But I will tell you something.
        - id: ch01-b179
          speaker: narrator
          text: >-
            Mr. Noah sat stiffly upon his yellow mat.
        - id: ch01-b180
          speaker: judge
          text: >-
            We don't know who you are. I personally believe you may be the Deliverer.
        - id: ch01-b181
          speaker: philip
          text: >-
            Both of us?
        - id: ch01-b182
          speaker: narrator
          text: >-
            He asked jealously.
        - id: ch01-b183
          speaker: judge
          text: >-
            One of you, or both. The prophecy says the Destroyer has red hair, and neither of you does. But convincing the people would turn my own hair grey with thinking and arguing. Some people are terribly wooden-headed. I am not accustomed to thinking. I seldom have to do it, and it upsets me.
        - id: ch01-b184
          speaker: narrator
          text: >-
            The children said they were sorry.
        - id: ch01-b185
          speaker: philip
          text: >-
            Please tell us something about your city. That isn't a question. We want to know whether it's magic, and that isn't a question either.
        - id: ch01-b186
          speaker: judge
          text: >-
            I was just going to tell you, and I will not answer questions. Naturally it is magic. Everything in the world is magic until you understand it.
        - id: ch01-b187
          speaker: judge
          text: >-
            Here is a little of our history. Thousands of years ago, a great and powerful giant built every city in this country. He brought the materials from distant places. Some of the people were chosen by him, while others appeared through a kind of self-working magic that is hard to explain.
        - id: ch01-b188
          speaker: judge
          text: >-
            Once the cities and their people were in place, city life began. To the inhabitants, it felt as if it had always existed. Craftsmen worked, musicians played, and poets sang. The astrologers found themselves in a tall tower that was plainly meant for them, so they began watching the stars and making prophecies.
        - id: ch01-b189
          speaker: philip
          text: >-
            I know that part.
        - id: ch01-b190
          speaker: judge
          text: >-
            Then you know quite enough. Now I have a small favor to ask. Would you mind escaping?
        - id: ch01-b191
          speaker: lucy
          text: >-
            If only we could.
          emotion: sad
        - id: ch01-b192
          speaker: judge
          text: >-
            The strain on my nerves is unbearable. Please escape, dear children, to oblige an old man in poor health and low spirits.
        - id: ch01-b193
          speaker: philip
          text: >-
            But how—
        - id: ch01-b194
          speaker: judge
          text: >-
            Simply walk out. My boy, disguise yourself in the dressing gown on that chair. Little girl, you may have my cloak.
        - id: ch01-b195
          speakers: [philip, lucy]
          ensemble: duo
          text: >-
            Thank you.
        - id: ch01-b196
          speaker: lucy
          text: >-
            But how do we get out?
        - id: ch01-b197
          speaker: judge
          text: >-
            Through the door. There is a rule about making prisoners give their word not to escape. But there have been no prisoners for so long that I doubt anyone asked you. They didn't? Then walk straight out. Many charitable people in the city will hide you. The front-door key turns easily, and I shall oil it on my way out.
        - id: ch01-b198
          speaker: judge
          text: >-
            Goodbye. Thank you for agreeing to my little plan. Accept an old man's blessing. And don't tell the gaoler. He would never forgive me.
        - id: ch01-b199
          speaker: narrator
          text: >-
            He rose from his mat, rolled it up, and left.
        - id: ch01-b200
          speaker: lucy
          text: >-
            Well!
        - id: ch01-b201
          speaker: philip
          text: >-
            Well! I suppose we should go.
        - id: ch01-b202
          speaker: lucy
          text: >-
            What about the gaoler? Won't he be punished if we run away?
        - id: ch01-b203
          speaker: narrator
          text: >-
            Philip saw that she might be right. It was irritating, and nearly as bad as giving their word not to escape.
        - id: ch01-b204
          speaker: philip
          text: >-
            Bother!
        - id: ch01-b205
          speaker: narrator
          text: >-
            Then the gaoler came in, looking pale and troubled.
        - id: ch01-b206
          speaker: gaoler
          text: >-
            I am terribly sorry. I expected to enjoy having you here, but my nerves are in pieces. Just hearing your voices makes my brain spin. I cannot write a single line. Could you possibly do one small thing for me? Would you mind escaping?
        - id: ch01-b207
          speaker: lucy
          text: >-
            But won't you get into trouble?
        - id: ch01-b208
          speaker: gaoler
          text: >-
            Nothing could be worse than this. I never knew children's voices could carry so far. Go, go! I beg you to escape. Only don't tell the judge. He would never forgive me.
        - id: ch01-b209
          speaker: narrator
          text: >-
            After a request like that, what prisoner could possibly refuse to escape? The two children waited until the sound of the gaoler's keys had died away far down the stairs. Then they opened the door, ran down the many winding steps, and slipped quietly out through the prison gate.
        - id: ch01-b210
          speaker: narrator
          text: >-
            They walked a little way without speaking. Plenty of people were nearby, but no one seemed to notice them.
        - id: ch01-b211
          speaker: lucy
          text: >-
            Which way should we go? I wish we'd asked where the charitable people live.
        - id: ch01-b212
          speaker: philip
          text: >-
            I think—
        - id: ch01-b213
          speaker: narrator
          text: >-
            Lucy never heard what he thought. A shout rang out. Horses' hoofs clattered, and every face in the square turned toward them.
        - id: ch01-b214
          speaker: philip
          text: >-
            They've spotted us! Run, run, run!
          emotion: fearful
        - id: ch01-b215
          speaker: narrator
          text: >-
            Philip himself began to run. He headed for the gatehouse at the top of the ladder stairs, the same way they had entered the city. Behind him came the shouting voices and the clattering hoofs of hot pursuit. The captain stood alone in the gateway. Just as Philip reached the gate, the captain turned away into the guardroom and pretended he had seen nothing at all.
        - id: ch01-b216
          speaker: narrator
          text: >-
            Philip had never run so far in his life, and he had certainly never run so fast. His breath came in deep, painful sobs. Even so, he reached the ladder bridge and began to climb down as quickly as he could. At least going down was easier than climbing up had been.
        - id: ch01-b217
          speaker: narrator
          text: >-
            He was nearly at the bottom when the whole ladder bridge sprang wildly into the air. Philip fell and rolled through the thick grass of the endless prairie.
        - id: ch01-b218
          speaker: narrator
          text: >-
            Enormous crashes filled the air all around him. They sounded like earthquakes destroying great, beautiful palaces and factories that were very big but not beautiful at all. The noise was deafening. It seemed endless. It seemed more than anyone could possibly bear.
        - id: ch01-b219
          speaker: narrator
          text: >-
            Yet Philip had to bear the noise, and then something worse besides. A strange swelling feeling began in his hands. Next it reached his head, and then it spread all over him. It was terribly painful. He rolled over in his agony and saw the foot of an enormous giant very close by. The giant wore a broad, flat, ugly shoe. Above it hung what looked like low grey curtains, swaying as they moved. A gigantic column stood there too, black against the grey. Not far away, the ladder bridge lay where it had been thrown down.
        - id: ch01-b220
          speaker: narrator
          text: >-
            Pain and fear overcame Philip. He could no longer hear, feel, or know anything.
        - id: ch01-b221
          speaker: narrator
          text: >-
            When he came to himself, he was under the drawing-room table. The swelling had stopped, and he seemed to be his proper size again.
        - id: ch01-b222
          speaker: narrator
          text: >-
            From beneath the table, he could see Nurse's flat feet and the lower part of her grey skirt. Over his head came a rattling and rumbling from the tabletop. Nurse was doing exactly what she had promised to do. She was pulling his city apart. Beside Philip stood the gigantic black column he had seen on the prairie. Now it was only the leg of the table.
        - id: ch01-b223
          speaker: narrator
          text: >-
            Every now and then, Nurse walked away from the table. Each time, she was carrying some object Philip had borrowed for his buildings, and she put it back in its proper place. Once she stood on a chair. From his hiding place, Philip heard the glass drops of the chandelier tinkle as Nurse hooked them back where they belonged.
        - id: ch01-b224
          speaker: philip
          text: >-
            If I keep perfectly still, perhaps she won't see me. But how did I get back here? And what a dream this will be to tell Helen!
        - id: ch01-b225
          speaker: narrator
          text: >-
            He lay without moving. Nurse did not see him. When she went to breakfast, Philip crawled out.
        - id: ch01-b226
          speaker: narrator
          text: >-
            The city was gone. Not one trace remained. Even the tables had been returned to their proper places.
        - id: ch01-b227
          speaker: narrator
          text: >-
            Philip went back to his own proper place, which was bed.
        - id: ch01-b228
          speaker: philip
          text: >-
            What a splendid dream. And now it's all over.
        - id: ch01-b229
          speaker: narrator
          text: >-
            Of course, he was quite wrong.
