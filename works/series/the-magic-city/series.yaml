cover_prompt: |-
  A wordless cover scene fills the immense Hall of Public Amusement in an enchanted city built from an Edwardian child's toys and household treasures. A long, lean girl with two straight fair braids, a freckled face, bright eyes, a short white dress, and a pearl coronal dances down the newly cleared floor. Nearby, a ten-year-old boy in a white tunic beneath a small coat and hood of chain mail applauds her, surrounded by delighted wooden dolls, toy sailors, and tiny citizens. Behind them, the last thick red strands of the giant unravelled carpet wind around a capstan, while two enormous bronze pillars bear raised figures of flying birds. Make the girl's joyful dance after solving the impossible task the focal action, with the boy and cheering crowd forming a welcoming arc around her. Use a wide, slightly low view through the arched doorway, keeping the figures and red rope in the lower two-thirds and leaving calm architectural space at the top. Keep every figure original, child-friendly, and faithful to the book's early-twentieth-century setting without borrowing from any adaptation. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
