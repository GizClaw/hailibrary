        delivery: 天真随和，对人类的怪事毫不在意
        timbre: 细小柔和
        pace: 适中
        pitch: 高
  chapters:
    - id: ch01
      title: 海边居民
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            人不管碰上什么，慢慢也就习惯了。清早天光明亮，波利用嘴轻轻啄着菲利普的耳朵，把他叫醒。菲利普竟觉得这再自然不过，简直像在自己家里。
        - id: ch01-b02
          speaker: philip
          text: 这么说，你平安回来了。
        - id: ch01-b03
          speaker: polly
          text: >-
            那段路可真远，不过我还是觉得自己飞回来更好。鹰头马身有翼兽本想送我，他又礼貌又温柔，可他也累了。女觊觎者现在关在牢里，只怕还会逃走。我们实在不惯关犯人。让她拿名誉担保也不管用，因为……
        - id: ch01-b04
          speaker: philip
          text: 因为她压根儿没有名誉。
        - id: ch01-b05
          speaker: polly
          text: >-
            我可不会把谁说得这么绝。我最多只会说，我们到现在还没发现她有名誉。早餐怎么解决？
        - id: ch01-b06
          speaker: lucy
          text: >-
            怎么总有下一顿饭呀？感觉晚饭才刚吃完几分钟，可现在我们又饿了！
        - id: ch01-b07
          speaker: polly
          text: 哈！得自己操心饭菜的人，都会有这种感觉！
        - id: ch01-b08
          speaker: narrator
          text: >-
            他们先喂饱骆驼和两只狗，两个孩子才和波利坐下来吃早饭。孩子们问了许多问题，波利有些肯答，有些却不答。
        - id: ch01-b09
          speaker: lucy
          text: >-
            有件事我特别想弄明白。那头鹰头马身有翼兽，到底是怎么从书里出来的？
        - id: ch01-b10
          speaker: polly
          text: >-
            这故事很长，所以我得短点儿讲。有条好规矩，短故事要讲长，长故事要讲短。很多年前，有人修一幢房子。泥瓦匠拆掉一个托架，那架子原本撑着一本砌在建筑里的书。书掉下来摊开，鹰头马身有翼兽就从里面走了出来。大家又看见下一页底下有东西在挣扎，掀开书页一瞧，一头大地懒也钻了出来。他们赶紧合上书，重新把它砌进墙里。
        - id: ch01-b11
          speaker: lucy
          text: 可那个大什么，还有鹰头马身有翼兽，怎么都变成了正合适的大小？
        - id: ch01-b12
          speaker: polly
          text: >-
            啊，那可是十一大谜团之一。有些智者说，这个国家抖了抖身子，于是万物都落到了该有的尺寸。我倒觉得是空气的缘故。只要吸一口这里的魔法空气，身体自然就会变得正合适。你们不也一样吗？
        - id: ch01-b13
          speaker: lucy
          text: 那他们为什么急着把书合上？
        - id: ch01-b14
          speaker: polly
          text: >-
            因为那是本野兽书。谁知道下一头会出来什么？说不定就是只老虎，多半还饿着肚子，到处找东西吃。
        - id: ch01-b15
          speaker: philip
          text: >-
            我明白了。再说，这里已经有诺亚方舟里的动物，也不是真的需要那些野兽。
        - id: ch01-b16
          speaker: polly
          text: 没错，所以他们把书合上了。
        - id: ch01-b17
          speaker: lucy
          text: 那天气也是从书里跑出来的吗？
        - id: ch01-b18
          speaker: polly
          text: >-
            天气来自另一本书，是本诗集。那本书只有一面封皮，最后一页上的东西当然全跑了出来。那页给了我们雨水、阳光、天空、云、山、花园、玫瑰、百合，还有各种被诗里叫作“喜悦的花朵”的花。树木、海洋、沙漠、白银和钢铁也都来自那一页，而且每样都多得用不完。你知道，诗人的想象从来没有边界。
        - id: ch01-b19
          speaker: narrator
          text: 露西咬了一大口蛋糕。
        - id: ch01-b20
          speaker: lucy
          text: 我懂了。那亲爱的波利，你又是从哪儿来的？
        - id: ch01-b21
          speaker: polly
          text: >-
            我跟鹰头马身有翼兽来自同一本书，还在同一页上。我有翅膀，当然够资格跟他来往。不过我有时会想，书里放进我，只是为了和他作对照。我这么小巧，他那么高大。我红绿相间，他却一身雪白。
        - id: ch01-b22
          speaker: lucy
          text: 明白了。那么请你再告诉我们……
        - id: ch01-b23
          speaker: polly
          text: >-
            问到这里为止。先办正事，后找乐子。一天才刚开始，你们已经享受过跟我谈话的乐趣了。为了报答这份荣幸，你们可得卖力干活。
        - id: ch01-b24
          speaker: narrator
          text: >-
            于是，他们用骆驼好心供应的温水洗净早餐餐具。
        - id: ch01-b25
          speaker: polly
          text: 现在收拾行装，上路去消除海边居民的恐惧。
        - id: ch01-b26
          speaker: brenda
          text: >-
            马克斯，我在想，亲爱的小狗们是不是最好迷一回路？我们可以晚点儿再回来。等大家找到我们，我们就装得高兴极了。
        - id: ch01-b27
          speaker: max
          text: 为什么？
        - id: ch01-b28
          speaker: narrator
          text: 布伦达满怀热切的亲昵，贴着马克斯挪了过去。
        - id: ch01-b29
          speaker: brenda
          text: >-
            我发现，只要有恐惧，就一定有值得害怕的东西，哪怕那东西只是自己想出来的。要是亲爱的小狗也害怕，那多糟呀，对不对？多没尊严。
        - id: ch01-b30
          speaker: max
          text: >-
            亲爱的，我能说出七条堂堂正正的理由，证明我们应该忠于主人。不过只说一条就够了，沙漠里没吃的，也没喝的。
        - id: ch01-b31
          speaker: brenda
          text: >-
            亲爱的，你总是这么高尚，跟可怜的小小的我完全不一样。我只有一副多情的性子。我知道自己就是个傻乎乎的小东西。
        - id: ch01-b32
          speaker: narrator
          text: >-
            骆驼摇摇摆摆地出发，波利也振翅飞起。两只狗到底还是紧紧跟了上去。
        - id: ch01-b33
          speaker: lucy
          text: 多忠诚的乖狗狗！布伦达！马克斯！你们真乖！
          emotion: happy
        - id: ch01-b34
          speaker: narrator
          text: >-
            两只狗礼貌地回应，兴冲冲地蹦跳起来。这段路并不远。没多久，他们就在悬崖间找到一道峡谷似的裂口。一条小路穿过裂口，通向铺满细小卵石的海滩。海边居民的家园就在这里，家园另一头便是辽阔、湛蓝而美丽的大海。
        - id: ch01-b35
          speaker: narrator
          text: >-
            那片住处像一座满是圆顶房屋的城镇，一幢幢最像石灰窑。拱门里面黑洞洞的，房屋全用海滩上的小石子砌成。小屋后方高高立着一座庞大粗犷的城堡。那里有塔楼、拱门、扶壁、棱堡、缓坡和桥梁，四周还有一条宽阔的护城河。
        - id: ch01-b36
          speaker: lucy
          text: 我从来没搭过这样的城。你搭过吗？
        - id: ch01-b37
          speaker: philip
          text: >-
            没有。至少……等等，我真觉得这是去年夏天，我和海伦在迪姆彻奇堆的那座沙堡。那些小屋就是我拿桶扣出来的沙模，只是边角已经磨圆了。
        - id: ch01-b38
          speaker: narrator
          text: >-
            大家继续朝城堡走。骆驼左右摇摆，像风浪里的一条船，两只狗却像猫一样轻巧地踏过石滩。他们绕开一大片一大片的水洼，还有盖满海藻的高岩。接着，一条宽得能容十二辆战车并排的大路，把他们一直带到宏伟的城门前。越走近，看见的人就越多。每扇窗里都有人探头，每道城垛和每层露台上也都挤满了人。孩子们使劲把脑袋向后仰，后来脖子都僵了，这才看出那些人似乎都很年轻。他们的衣裳也古怪得有趣，每人只穿一件，从肩头一直垂到膝盖，颜色很深，看着像毛皮做的。
        - id: ch01-b39
          speaker: philip
          text: 这里怎么会有这么多人？他们都是从哪儿来的？
        - id: ch01-b40
          speaker: polly
          text: >-
            从书里来的。那一次，当局下手很快，所以只逃出一行半。“快乐的一群，温和的岛民。”他们就是这群岛民。
        - id: ch01-b41
          speaker: philip
          text: 那他们怎么不住在岛上？
        - id: ch01-b42
          speaker: polly
          text: >-
            这里只剩一座岛。除了两个从来不去那里的人，谁也不许上岛。不过这些岛民不住在岛上也很快活。他们永远快活，只有那份巨大的恐惧除外。
        - id: ch01-b43
          speaker: narrator
          text: >-
            旅人们走上护城河的桥，朝最大的一道拱门过去。那拱门砌得很粗糙，活像洞穴入口。一小群人从里面的黑暗中走了出来。
        - id: ch01-b44
          speaker: lucy
          text: 他们是野蛮人！
          emotion: fearful
        - id: ch01-b45
          speaker: narrator
          text: >-
            露西往后一缩，几乎成了骆驼背上多出来的一座驼峰。那些人的皮肤确实很深，其实只是晒黑了。他们的脸英俊又和善，正友好地挥手，笑容里满是欢迎。最高的那个岛民走到前面，个子差不多和菲利普一样高。
        - id: ch01-b46
          speaker: philip
          text: 别说傻话。他们不是野蛮人，只是一群孩子。
        - id: ch01-b47
          speaker: polly
          text: 嘘！岛民大人要发表正式欢迎辞了！
        - id: ch01-b48
          speaker: billy
          text: >-
            你们来了，真是太棒了！快下骆驼，进屋吃点东西。吉姆，把骆驼牵进马厩，好好擦洗。狗当然可以留在你们身边。那只鹦鹉怎么办？
        - id: ch01-b49
          speaker: narrator
          text: 菲利普从骆驼背上滑下来，露西紧跟着也下来了。
        - id: ch01-b50
          speaker: philip
          text: 太谢谢了。鹦鹉会自己决定，他一向如此。
        - id: ch01-b51
          speaker: narrator
          text: >-
            大家一齐涌进城堡大厅。与其说那是大厅，不如说是一座昏暗的洞穴，因为窗户又小又高。等露西的眼睛适应了光线，她才看清岛民穿的并不是兽皮，而是海藻。
        - id: ch01-b52
          speaker: billy
          text: >-
            请你们进来是应该的，不过老实说，现在还不到饭点。半小时后，猎队就要集合了。所以，除非你们真的很饿……
        - id: ch01-b53
          speakers: [philip, lucy]
          ensemble: duo
          text: 我们一点也不饿！
        - id: ch01-b54
          speaker: billy
          text: >-
            你们当然会打猎吧？除了钓鱼，我们真正的运动就只有打猎，当然也会玩各种游戏。真希望你们不会觉得闷。
        - id: ch01-b55
          speaker: polly
          text: >-
            我们是来办正事的。这两位是菲利普和露西，他们正在争取成为解救者，还得完成一连串伟业。
        - id: ch01-b56
          speaker: narrator
          text: 快乐的岛民全围过来看波利。露西悄悄开口。
        - id: ch01-b57
          speaker: lucy
          text: >-
            其实争取成为解救者的是菲利普，不是我。波利只是太讲礼貌，才把我也算了进去。
        - id: ch01-b58
          speaker: narrator
          text: 岛民大人皱起眉头。
        - id: ch01-b59
          speaker: billy
          text: 那些事以后再说。现在浪费时间太可惜了。
        - id: ch01-b60
          speaker: philip
          text: 你们都猎些什么？
        - id: ch01-b61
          speaker: billy
          text: >-
            各种灰兽、绿白兽，还有蓝斑灰兽，只要找得到。蓝斑灰兽很稀少，粉红兽更常见，个头也大得多。你们马上就能亲眼看看。要是那头骆驼没精神，我可以替你们另找坐骑。你们喜欢骑什么动物？
        - id: ch01-b62
          speaker: philip
          text: 你自己骑什么？
        - id: ch01-b63
          speaker: narrator
          text: >-
            原来岛民大人骑的是长颈鹿。菲利普一听，立刻也想骑一头。露西却客气地道了谢，说自己还是愿意骑那头已经坐惯的骆驼。他们来到城堡庭院，那里挤满了各种动物。动物园里能看到的，这里全都有。要是你小时候那套诺亚方舟玩具原本够贵，而且你没把太多动物弄坏或弄丢，这里也都能找到。每头动物背上都有一位骑手。等所有人各自骑好，整支队伍便穿过城堡大门，一起涌到海滩上。
        - id: ch01-b64
          speaker: philip
          text: 他们到底在猎什么？
        - id: ch01-b65
          speaker: polly
          text: 诺亚方舟里那些没有名字的小动物。那一类全都可以猎。嘿！蓝斑灰兽！
          emotion: surprised
        - id: ch01-b66
          speaker: narrator
          text: >-
            一只带着蓝色斑点的灰色小兽从岩石后蹿出来，直奔巨大的海藻丛。各种小动物也跟着惊跳起来，飞快逃向安全的地方。
        - id: ch01-b67
          speaker: polly
          text: 那边跑的是绿白兽！它胸口和爪子都是白的。那里还有一只灰兽！
        - id: ch01-b68
          speaker: narrator
          text: >-
            那只灰兽有狐狸那么大，长着兔耳朵。它的尾巴偏偏从后背正中间伸出来，离身体两头一样远。不过灰兽有很多种，模样各不相同。制造诺亚方舟的人总是先认真做大象、狮子和老虎这些大动物，颜色也尽量照真的来涂。后来他们厌倦了模仿自然，就把动物涂成粉红、绿色或巧克力色。这样便有了粉红兽、绿白兽和巧克力兽。
        - id: ch01-b69
          speaker: narrator
          text: >-
            再后来，工匠对这件事彻底厌烦了。他们随手把动物做成各种形状，再统统涂成灰色，这就是灰兽。到了最后，他们忽然良心不安，觉得自己一直在偷懒，便给最末那只最小的灰兽点上蓝斑，好叫良心舒服一点。它就是蓝斑灰兽。
        - id: ch01-b70
          speakers: [billy, islander_1, islander_2, islander_3]
          ensemble: chorus
          text: 嗬！嗬！追上去！驾！
          emotion: happy
        - id: ch01-b71
          speaker: narrator
          text: >-
            猎队像一股浪似的席卷向前，蓝斑灰兽远远跑在最前面。狗叫个不停，所有坐骑都撒开蹄子飞奔，骑手们从四面八方放声呼喊。头顶的阳光亮得耀眼，旁边的海面也闪闪发光。很远的前方，蓝斑灰兽使出全身力气逃命，身子绷得笔直，远看就像一条灰色的线。这场精彩的追逐一直跑到离城堡五英里远，蓝斑灰兽才终于被猎杀。猎队没有马上回去。后来，他们又捉到一只粉红兽和六只灰兽，这才放慢速度，调转坐骑回城。
        - id: ch01-b72
          speaker: billy
          text: 我们打猎就是为了杀，杀也是为了吃。
        - id: ch01-b73
          speaker: philip
          text: 可我以为，诺亚方舟里的动物一死就会变回木头？
        - id: ch01-b74
          speaker: billy
          text: >-
            为了吃而杀，它们就不会变成木头。你心里怎么打算，结果就会跟着变。我赶出蓝斑灰兽时，想的是葡萄干蛋糕。碰上粉红兽时，我打算要面包黄油。轮到那些灰兽，我想的是大米布丁、西梅、太妃糖、冰激凌，还有各种好吃的。所以猎物一切开，自然就会变成我事先想好的食物。
        - id: ch01-b75
          speaker: narrator
          text: 菲利普坐在骆驼背上，随着脚步一颠一颠。
        - id: ch01-b76
          speaker: philip
          text: 我还想问一件事，希望你别介意。这里怎么全是孩子？
        - id: ch01-b77
          speaker: billy
          text: >-
            这是古代历史，我猜未必是真的。听说政府当初一定要保证我们永远是“快乐的一群温和的岛民”，就认定只有一个办法，让我们永远做孩子。我们的日子确实快活。打猎、做饭、洗盘子这些事都自己干，重活则交给文学硕士。
        - id: ch01-b78
          speaker: billy
          text: >-
            那些人以前在学院里苦学算术和历史，学得太累，需要休假，所以就来替我们工作。我们想学点什么时，身边正好有文学硕士，也很方便。可怜的人，不管让他们教什么，他们都高兴。他们住在那些小屋里，等着来这里的人还排着长队。他们也穿海藻衣服。每到星期二、星期四和星期六，他们会去猎大型野兽，像灰身黄肚的凶猛龙涎兽，还有更大的灰兽。现在一进城我们就吃饭。吃完以后，该谈谈那件事了。
        - id: ch01-b79
          speaker: narrator
          text: >-
            猎物在庭院里剥皮切开，果然全变成了岛民大人事先打算好的食物。蓝斑灰兽成了葡萄干蛋糕，别的动物也一样没有变错。
        - id: ch01-b80
          speaker: narrator
          text: >-
            饭后，岛民大人带着菲利普和露西登上最高的塔楼。三个人躺在阳光里，吃着太妃糖，望向海面尽头那座隐约发蓝的岛。
        - id: ch01-b81
          speaker: billy
          text: 那就是我们不许去的岛。
          emotion: sad
        - id: ch01-b82
          speaker: lucy
          text: >-
            现在你可以告诉我们了吧？你们究竟怕什么？说出来没关系，我们也会害怕，经常会怕各种各样的东西。
        - id: ch01-b83
          speaker: philip
          text: >-
            那只是你自己。我可没有你说的那么常害怕。请告诉我们吧，岛民大人。
        - id: ch01-b84
          speaker: billy
          text: 你们叫我比利就好，那是我的名字。
        - id: ch01-b85
          speaker: lucy
          text: 好吧，比利。你们到底怕什么？
        - id: ch01-b86
          speaker: billy
          text: >-
            我真讨厌害怕。真正的男孩只该怕自己做错事，别的什么都不该怕。一位文学硕士就是这么教我的。可连文学硕士们也一样害怕。
          emotion: angry
        - id: ch01-b87
          speaker: lucy
          text: >-
            你们怕的是什么？天马上就要黑了，我宁愿趁还有日光时先听明白。
        - id: ch01-b88
          speaker: billy
          text: >-
            我们怕大海。万一突然打来一个巨浪，把城堡、小屋、文学硕士，还有我们所有人都冲走呢？
          emotion: fearful
        - id: ch01-b89
          speaker: lucy
          text: 可这种事从来没发生过，对不对？
        - id: ch01-b90
          speaker: billy
          text: >-
            是没发生过。不过每件事总有第一次。这肯定没错，是另一位文学硕士告诉我的。
        - id: ch01-b91
          speaker: lucy
          text: 那你们为什么不搬到离海远一点的地方？
        - id: ch01-b92
          speaker: billy
          text: >-
            因为离开大海，我们就活不下去。我们是岛民，不住在海边可受不了。我们宁可留着大海，哪怕得一直怕它，也不愿没有海可以怕。可政府很为难。我们本来应该是“快乐的一群温和的岛民”，心里有恐惧，就不可能完全快乐。所以你们的伟业，就是除掉我们的恐惧。
        - id: ch01-b93
          speaker: philip
          text: 这可太难了。我得好好想想。
          emotion: sad
        - id: ch01-b94
          speaker: narrator
          text: >-
            菲利普觉得这件事简直难得叫人绝望。他躺在暖和的塔顶，翻来覆去地苦想。马克斯和布伦达挨在他身边睡觉，波利停在塔楼的胸墙上，一根一根梳理自己鲜艳的羽毛。露西暂时不去打扰他，只和比利拿一根长长的海藻丝玩翻花绳。菲利普想了又想，还是找不到头绪。
        - id: ch01-b95
          speaker: billy
          text: 该吃晚饭了。你想到办法了吗？
        - id: ch01-b96
          speaker: philip
          text: 一点也没想到。
          emotion: sad
        - id: ch01-b97
          speaker: billy
          text: >-
            那就别再拼命想了。安心留在这里，好好玩吧。你总会想出办法的。就算你想不出，露西也会。今晚我们演字谜哑剧。
        - id: ch01-b98
          speaker: narrator
          text: >-
            他们真的演了。岛民们全都快活极了，文学硕士也从小屋里出来看戏。这个夜晚美妙得不得了，最后大家还在整座城堡里玩起了捉迷藏。
        - id: ch01-b99
          speaker: narrator
          text: >-
            第二天早晨，露西从一张柔软、干燥又带着清香的海藻床上醒来。想到今天能和自己见过的最快乐的一群孩子痛痛快快玩上一整天，她心里别提多欢喜了。菲利普也很高兴，可他知道自己迟早非得找出办法不可，所以那份快乐总像缺了一小块。不过这一天依然过得很好。他们一起跳进岩石间的水潭游泳，又去拾贝类，留着做晚饭。下午，大家玩圆场棒球。晚上，他们随着文学硕士奏出的音乐跳舞。大多数文学硕士口袋里都装着长笛。别人一请他们演奏，他们便觉得自己受到了极大的尊重。
        - id: ch01-b100
          speaker: narrator
          text: >-
            快乐的日子一天天过去。每天早晨，菲利普都对自己说，今天无论如何也得找到办法。每天晚上，他又懊恼这一天还是白白过去了。可是，他始终不知道怎样消除温和岛民的恐惧。
        - id: ch01-b101
          speaker: narrator
          text: >-
            到了第六天夜里，暴风雨突然袭来。狂风呼啸，大海咆哮，整座城堡连地基都摇晃起来。菲利普被巨响和震动惊醒，坐起身来。这一刻，他终于明白了，海边居民一直被怎样的恐惧折磨着。
        - id: ch01-b102
          speaker: philip
          text: 要是大海真的把我们全冲走呢？他们连一条船也没有。
          emotion: fearful
        - id: ch01-b103
          speaker: narrator
          text: >-
            就在他毫无准备的时候，一个办法突然冒了出来。他越想越兴奋，再也睡不着了。第二天一早，他去找波利。
        - id: ch01-b104
          speaker: philip
          text: >-
            我想到办法了，不过先不告诉别人。只靠我自己做不成。你能帮我把佩林先生找来吗？
        - id: ch01-b105
          speaker: polly
          text: 我很愿意试试。
        - id: ch01-b106
          speaker: narrator
          text: >-
            这只热心的鸟一句多余的话也没说，马上飞走了。当天下午，大家的野餐茶点刚要结束，一个巨大的影子罩住众人。鹰头马身有翼兽落了下来，背上坐着佩林先生和波利。
        - id: ch01-b107
          speaker: philip
          text: 噢，太谢谢您了！
          emotion: happy
        - id: ch01-b108
          speaker: narrator
          text: 菲利普把佩林先生拉到一边，悄悄说起自己的计划。
        - id: ch01-b109
          speaker: perrin
          text: 不行，少爷。很抱歉，这件事我不能答应。
        - id: ch01-b110
          speaker: philip
          text: 难道您不知道该怎么做？
        - id: ch01-b111
          speaker: perrin
          text: >-
            干我这一行，该会的我都会。可木匠手艺是一回事，规矩礼数又是另一回事。我不是不懂礼数，正因为懂，才不能掺和这件事。
        - id: ch01-b112
          speaker: philip
          text: >-
            可您还没听明白。我想请您在最高的塔顶造一艘诺亚方舟。以后海浪再大、风再猛，所有海边居民只要躲进方舟，不管发生什么都能安全。
        - id: ch01-b113
          speaker: perrin
          text: 这些你刚才已经讲过了。我真没想到你会这么办，实在没想到。
        - id: ch01-b114
          speaker: philip
          text: 我还以为这是个特别好的主意。
          emotion: sad
        - id: ch01-b115
          speaker: perrin
          text: 主意本身没错，谁也挑不出毛病。
        - id: ch01-b116
          speaker: philip
          text: 那到底哪里出了问题？
          emotion: angry
        - id: ch01-b117
          speaker: perrin
          text: >-
            你找错铺子了。我不会抢别人的生意，哪怕那是最卑微的活儿也不抢。何况这么做，简直像当面给政府一巴掌。菲利普少爷，我真没想到你会干这种事。我要是接下这活，连饭碗都保不住。
        - id: ch01-b118
          speaker: philip
          text: 您就直说吧，为什么不肯帮我？
          emotion: sad
        - id: ch01-b119
          speaker: perrin
          text: >-
            我都这么大年纪了，可不能跑来造方舟。要是我越过诺亚先生，接走本该归他的活儿，他老人家一定会伤透心。
        - id: ch01-b120
          speaker: philip
          text: 噢，原来我应该去请诺亚先生？
        - id: ch01-b121
          speaker: perrin
          text: >-
            当然要请他。只要照他的吩咐做，我很愿意像个工头一样把活儿干好。可这份订单一定得交给他。
        - id: ch01-b122
          speaker: narrator
          text: >-
            波利和鹰头马身有翼兽一起去接诺亚先生。第二天中午，他们便到了城堡。
        - id: ch01-b123
          speaker: philip
          text: 要是我没来请您，就叫别人造了方舟，您会介意吗？
        - id: ch01-b124
          speaker: judge_noah
          text: >-
            我大概会有一点伤心。男爵大人，您知道的，这方面我毕竟有些经验。
        - id: ch01-b125
          speaker: philip
          text: 您为什么叫我男爵？
        - id: ch01-b126
          speaker: judge_noah
          text: >-
            因为您已经是男爵了。杀死狮子算一项伟业，凭着这份功劳，您已经获封男爵。恭喜您，狮子男爵大人。
        - id: ch01-b127
          speaker: narrator
          text: >-
            诺亚先生很赞成菲利普的主意，立刻和佩林先生一起画图样、算承重、挑材料。接着，菲利普向岛民发表演说，解释了自己的办法。众人欢呼起来，声音震天响。大家一致认定，把方舟造在最高的塔顶，正好满足他们长久以来的需要。方舟一旦建好，每个温和岛民心里的恐惧就会永远消失。
        - id: ch01-b128
          speaker: narrator
          text: >-
            这项庞大的工程立刻开工。佩林先生好心答应担任工头，调动了一整支文学硕士组成的工人大军。没过多久，锯子来回拉动的声音、锤子一下一下敲击的声音，便和浪花拍岸、海鸟鸣叫的声音混在了一起。一队队健壮的文学硕士穿着海藻短衣，俯下身去削凿一根根巨大的木料。木料处理好以后，他们又齐心协力，把它们高高吊上最高的塔顶。还有一些文学硕士负责竖脚手架。诺亚先生亲自在旁边监督，因为在方舟造好以前，全靠这些脚手架稳稳托住它。
        - id: ch01-b129
          speaker: narrator
          text: >-
            孩子们不许动手，却很喜欢站在旁边看。他们几乎觉得，只要自己看得够认真，就会用某种奇妙又神秘的方式真正帮上忙。你大概也知道这种感觉。
        - id: ch01-b130
          speaker: narrator
          text: >-
            鹰头马身有翼兽住在城堡马厩里。哪里要拖要吊，他就飞去帮忙。诺亚先生只消在他耳边说出那个魔法词，他便会振翅升空。孩子们问了不知多少遍，还是没人告诉他们那个词究竟是什么。
        - id: ch01-b131
          speaker: narrator
          text: >-
            日子一天天过去，方舟终于造好了，四周的脚手架也全部拆掉。巨大的诺亚方舟稳稳坐在最高的塔顶，简直是造方舟手艺最完美的样品。船身漆成暗红色，两侧和两头却是蓝色的，上面还开着一扇扇黑窗。屋顶是鲜亮的猩红色，又画了一道一道的细线，看上去像真的铺着瓦片。造船的人连再小的地方也没有忘记。就连屋顶上那只白色的鸟，他们也照样画了出来。你要是见过自己的诺亚方舟，一定认得那只鸟。
        - id: ch01-b132
          speaker: narrator
          text: >-
            人们为方舟举行了盛大的庆典，还一个接一个发表了许多演说。所有为造方舟出过力的人都得到一顶花冠。哪怕是地位最低的文学硕士，也把新鲜的粉红海藻和绿海藻戴在头上。等演说讲完，大家又唱起歌来。海边居民还有自己的桂冠诗人。他是一位年轻的文学硕士，长着一双淡蓝色的眼睛，却没有下巴。他走到众人面前，朗诵起专门为方舟写的颂诗。开头几行是这样的。
        - id: ch01-b133
          speaker: narrator
          text: >-
            如今我们有了高贵方舟，黑夜里再也不会颤抖。任凭大海怒号，狂风嘶吼，我们安然无恙，不必担忧。哪怕潮水突然涨个不停，我们躲进方舟便得安宁。是谁为我们造起彩绘方舟，愿他们的名字永受祝福。
        - id: ch01-b134
          speaker: narrator
          text: >-
            后面还有三百一十七行，内容都差不多。每个人都夸诗写得妙，夸桂冠诗人是天才，又不停问他怎么想得出来，还说他的头脑实在了不起。
        - id: ch01-b135
          speaker: narrator
          text: >-
            菲利普和露西也各自戴上了花冠。比利站起来，提议大家正式向菲利普致谢。菲利普却很谦虚，只说这件事根本算不了什么，不管换成谁，都会想到一样的办法。快乐的气息在人群里越散越开。人人满脸笑容，碰见谁都要握一握手。就连文学硕士也放松下来，讲起文雅又老派的小笑话。他们拍拍彼此的后背，亲热地叫对方“老伙计”，这可是平常绝不会有的事。整座城堡都挂满粉红和翠绿的海藻花环，和人们头上的花冠一模一样。从塔楼到庭院，到处都喜气洋洋。那真是你能想象到的最喜庆、最快乐的景象。
        - id: ch01-b136
          speaker: narrator
          text: 接着，那件可怕的事发生了。
        - id: ch01-b137
          speaker: narrator
          text: >-
            菲利普和露西穿着海藻短衣，站在庭院的平台上。他们来到这里的第一天，就已经换上了本地衣服。诺亚先生刚刚开口。
        - id: ch01-b138
          speaker: judge_noah
          text: 好吧，今天就让我们快快乐乐地过到底，明天再回城。
        - id: ch01-b139
          speaker: narrator
          text: >-
            一个影子突然落在众人身上。鹰头马身有翼兽飞来了，背上还坐着一个人。谁都没来得及看清那是谁，奇兽已经压低身子。那人一把揪住菲利普的海藻短衣，把他提离地面，甩到奇兽背上。露西尖叫起来，佩林先生高声阻止，诺亚先生也惊叫一声。大家都伸出手想把菲利普拉回来，可已经太迟了。
        - id: ch01-b140
          speaker: perrin
          text: 喂，我说，可不能这样！
          emotion: surprised
        - id: ch01-b141
          speaker: judge_noah
          text: 哎呀！
          emotion: surprised
        - id: ch01-b142
          speaker: philip
          text: 我不去！放我下来！
          emotion: angry
        - id: ch01-b143
          speaker: pretenderette
          text: 噢，您不肯去，是吗，男爵大人？咱们很快就知道了。
        - id: ch01-b144
          speaker: narrator
          text: >-
            在场有三个人认出了这个声音。算上菲利普就是四个，再算上两只狗就是六个。两只狗又吠又吼。
        - id: ch01-b145
          speaker: judge_noah
          text: 把他放下来！
          emotion: angry
        - id: ch01-b146
          speaker: lucy
          text: 噢，不！不要！是女觊觎者！
          emotion: fearful
        - id: ch01-b147
          speaker: narrator
          text: >-
            波利急中生智，飞到空中，直冲女觊觎者的耳朵。正像旧书里常说的，果然就是那个毫无原则的家伙。她不但逃出了监狱，还又一次偷走鹰头马身有翼兽。不过，同一只鹦鹉休想把她抓住两回。这一次，她显然早有准备。波利刚碰到她的耳朵，她便猛地抖开一条汽车面纱，把波利兜在里面。那条面纱想必早就预先松开了。接着，她把挣扎的鹦鹉连同面纱一起塞进一只柳条笼子。那笼子也早就准备妥当，正挂在鞍子旁边。
        - id: ch01-b148
          speaker: narrator
          text: >-
            鹰头马身有翼兽张开宽阔的白翅膀，停在人群仰起的脸上方。露西心里想着，这一回总能看见女觊觎者的脸了。她一直觉得，只要亲眼看见那张脸，自己一定能认出对方。可女觊觎者太狡猾，绝不肯掀起面纱朝下看。她仰起脸，大概低声说出了那个魔法词。奇兽随即升上天空，以惊人的速度越过大海，飞向远方。
        - id: ch01-b149
          speaker: narrator
          text: >-
            露西痛苦地把两只手绞在一起。你一定听过“绞着双手”这个说法，这一回，她当真就是那样做的。
        - id: ch01-b150
          speaker: lucy
          text: >-
            噢，我该怎么办？诺亚先生，她会怎么对菲利普？会把他带到哪儿？我现在怎么办？要怎样才能找到他？
          emotion: fearful
        - id: ch01-b151
          speaker: judge_noah
          text: 亲爱的孩子，我真的很遗憾。可你问的这些，我一个也回答不了。
          emotion: sad
        - id: ch01-b152
          speaker: lucy
          text: 难道我不能去追他吗？
          emotion: fearful
        - id: ch01-b153
          speaker: judge_noah
          text: >-
            恐怕不行。我们没有船，唯一一头鹰头马身有翼兽又被女觊觎者偷走了。至于我们的骆驼，没有一头会飞。
          emotion: sad
        - id: ch01-b154
          speaker: narrator
          text: 露西又焦急又痛苦，再也忍不住了，狠狠跺了一脚。
        - id: ch01-b155
          speaker: lucy
          text: 那我到底能做什么？
          emotion: angry
        - id: ch01-b156
          speaker: judge_noah
          text: >-
            什么也做不了，我的孩子。只能先上床好好睡一夜。明天我们回城，再看能怎么办。我们得请示神谕。
        - id: ch01-b157
          speaker: lucy
          text: 我们就不能现在出发吗？
          emotion: sad
        - id: ch01-b158
          speaker: judge_noah
          text: >-
            神谕要是没睡好一夜，就不值得请示。从这里到城里得走三天。现在出发的话，你瞧，天都快黑了，我们会在半夜到达。还是明早早早动身吧。
        - id: ch01-b159
          speaker: narrator
          text: >-
            可到了第二天清早，并没有任何人从海边居民的城堡出发。不是大家起得太晚，也不是他们改变了主意。说真的，那时已经没有人能够出发，就连原本供他们出发的那座城堡，也已经不在那里了。
        - id: ch01-b160
          speaker: narrator
          text: >-
            一只年幼的蓝斑灰兽刚熬过很不安稳的一夜。天亮以后，它小心地从洞里探出脑袋，想看看人类是不是已经起床活动。要是外面安全，它就可以出去寻找自己最爱吃的黄色玉黍螺。可眼前的景象叫它猛地一惊。它立刻竖起那双带斑点的耳朵，定睛又看了一遍。最后，它觉得根本不必再借岩石遮住身体，索性大大方方地走过海滩。
        - id: ch01-b161
          speaker: narrator
          text: >-
            因为海滩上一个人也没有。诺亚先生不见了，露西不见了，所有温和的岛民也全不见了。那些住在小屋里的文学硕士，同样连一个都找不到。至于用卵石砌成的小屋，还有后面那座带着塔楼和护城河的城堡，更是消失得干干净净。小蓝斑灰兽眼前，只剩下一片平坦、空旷又赤裸的海滩。海水像拿梳子仔细梳过一遍似的，已经把整片地方洗得干干净净。
        - id: ch01-b162
          speaker: narrator
          text: >-
            大海到底还是涨了起来。温和岛民一直害怕的事，真的发生了。是不是大海忽然起了好奇心，也想靠近看一看那艘新造的方舟，谁也不知道，以后更不会有人知道。不管是什么缘故，海水终究越过原来的边界，猛然涌上岸来。它冲过那片海滩，把高大的城堡、圆顶的小屋，还有所有曾经住在那里的人，全都一起席卷而去。等海水退下，那里连一丝痕迹也没有留下。
        - id: ch01-b163
          speaker: narrator
          text: >-
            清澈的天空中，一只羽毛鲜艳的鹦鹉忽然朝小蓝斑灰兽喊起来。他的一只爪子上，还挂着那条汽车面纱。
        - id: ch01-b164
          speaker: polly
          text: 这里出了什么事？所有东西都到哪儿去了？
          emotion: surprised
        - id: ch01-b165
          speaker: blue_gray_beast
          text: >-
            我真不知道。人类的东西总是这样，一会儿来，一会儿又走。要吃点玉黍螺吗？暴风雨过后，今天早上的玉黍螺可鲜美了。
