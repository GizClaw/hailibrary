    billy:
      display_name: 比利
      tts:
        delivery: 热情快活，谈到恐惧时倔强又恼火
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高
    perrin:
      display_name: 佩林先生
      tts:
        delivery: 手艺老到，守规矩，训人时直截了当
        timbre: 粗实清晰
        pace: 适中
        pitch: 中低
    islander_1:
      display_name: 岛民甲
      tts:
        delivery: 快活热情，呼喊时朝气十足
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    islander_2:
      display_name: 岛民乙
      tts:
        delivery: 快活热情，呼喊时朝气十足
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中
    islander_3:
      display_name: 岛民丙
      tts:
        delivery: 快活热情，呼喊时朝气十足
        timbre: 轻柔稚嫩
        pace: 轻快
        pitch: 中高
    blue_gray_beast:
      display_name: 小蓝斑灰兽
