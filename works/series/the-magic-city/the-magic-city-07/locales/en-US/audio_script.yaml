  chapters:
    - id: ch01
      title: CHAPTER VII. THE DWELLERS BY THE SEA
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            You soon grow used to strange things. When Philip woke in the bright outdoor morning, the parrot was gently pecking beside his ear. It felt almost like home.
        - id: ch01-b02
          speaker: philip
          text: >-
            So you made it back safely.
        - id: ch01-b03
          speaker: parrot
          text: >-
            It was a long trip, but I decided to fly back. The Hippogriff offered to carry me. He is courtesy and gentleness itself, but he was tired too. The Pretenderette is locked up for now. I fear she may escape, though. We have so little practice keeping prisoners, and we cannot put her on her honor because—
        - id: ch01-b04
          speaker: philip
          text: >-
            Because she hasn't got any.
        - id: ch01-b05
          speaker: parrot
          text: >-
            I would never say that about anyone. I would only say that we have not found it yet. Now, what about breakfast?
        - id: ch01-b06
          speaker: lucy
          text: >-
            Meals keep coming around so quickly. Supper feels like it was only a minute ago, and now we're hungry again!
        - id: ch01-b07
          speaker: parrot
          text: >-
            That is always how meals seem when you must prepare them yourself.
        - id: ch01-b08
          speaker: narrator
          text: >-
            They fed the camel and the dogs first. Then the children and the parrot ate, while Philip and Lucy poured out questions. The parrot answered some and left others alone.
        - id: ch01-b09
          speaker: lucy
          text: >-
            There is one thing I simply must know. How did the Hippogriff get out of the book?
        - id: ch01-b10
          speaker: parrot
          text: >-
            It is a long story, so I shall make it short. That is an excellent rule. Tell short stories at length and long stories briefly. Years ago, masons were repairing a building. They moved the supports beneath one of the books built into it, and the book fell open. Out came the Hippogriff. Something struggled under the next page, so they lifted it and out came a megatherium. Then they shut the book and built it back into the wall.
        - id: ch01-b11
          speaker: lucy
          text: >-
            But how did the mega-whatever-it-is and the Hippogriff grow to the proper size?
        - id: ch01-b12
          speaker: parrot
          text: >-
            Ah, that is one of the eleven mysteries. Some wise men say the country shook itself and everything settled into its proper size. I believe it is the air. As soon as you breathe this enchanted air, you become the right size. You did, after all.
        - id: ch01-b13
          speaker: lucy
          text: >-
            Why did they close the book again?
        - id: ch01-b14
          speaker: parrot
          text: >-
            It was full of beasts. No one knew what might come out next. Perhaps a tiger, and probably a hungry one.
        - id: ch01-b15
          speaker: philip
          text: >-
            I understand. You didn't need more beasts when you already had all the animals from Noah's ark.
        - id: ch01-b16
          speaker: parrot
          text: >-
            Exactly. So they closed it.
        - id: ch01-b17
          speaker: philip
          text: >-
            But did the weather come out of books too?
        - id: ch01-b18
          speaker: parrot
          text: >-
            That came from a different book, a book of poetry with only one cover. Naturally, everything on the last page escaped. It gave us rain, sun, sky, clouds, mountains, gardens, roses, lilies, trees, the sea, the desert, silver, iron, and all the flowers called “Blossoms of delight.” We received as much as anyone could want. A poet's imagination has no limits.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Lucy took a large bite of cake.
        - id: ch01-b20
          speaker: lucy
          text: >-
            I see. And where did you come from, dear Polly?
        - id: ch01-b21
          speaker: parrot
          text: >-
            I came from the Hippogriff's book. We shared a page. My wings naturally gave me the right to associate with him, though sometimes I think the artist put me there for contrast. I am small, and he is great. I am red and green, and he is white.
        - id: ch01-b22
          speaker: lucy
          text: >-
            I see. And will you please tell us—
        - id: ch01-b23
          speaker: parrot
          text: >-
            That is enough. Business comes before pleasure. You began the day with the pleasure of my conversation. Now you must work very hard to earn it.
        - id: ch01-b24
          speaker: narrator
          text: >-
            They washed the breakfast things in warm water kindly supplied by the camel.
        - id: ch01-b25
          speaker: parrot
          text: >-
            Pack everything. We must go and destroy the fear of the Dwellers by the Sea.
        - id: ch01-b26
          speaker: brenda
          text: >-
            Max, wouldn't it be wiser for two dear little dogs to get lost? We could appear later and be ever so happy when they found us.
        - id: ch01-b27
          speaker: max
          text: >-
            Why would we do that?
        - id: ch01-b28
          speaker: brenda
          text: >-
            Whenever there is fear, there is something to fear, even if it is only in your mind. Imagine dear little dogs being frightened, Max. It would be terribly undignified.
        - id: ch01-b29
          speaker: max
          text: >-
            My dear, I could offer seven noble reasons for staying faithful to our master. I shall give you one. There is no food in the desert and no water.
        - id: ch01-b30
          speaker: brenda
          text: >-
            You have always been so noble, darling. You are quite unlike poor little me. I have nothing but an affectionate nature. I know I am only a foolish little creature.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The camel lurched away, the parrot flew above, and the dogs stayed close behind.
        - id: ch01-b32
          speaker: lucy
          text: >-
            Dear faithful dogs! Brenda! Max! Good dogs!
        - id: ch01-b33
          speaker: narrator
          text: >-
            The dogs answered politely by bounding forward with great enthusiasm.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The journey did not take long. Soon they found a narrow ravine in the cliff, with a path winding through it. The path brought them out on a beach covered in small pebbles. There stood the home of the Dwellers by the Sea. Beyond that home stretched the sea they lived beside, broad and blue and beautiful.
        - id: ch01-b35
          speaker: narrator
          text: >-
            The town was made of rounded little buildings with dark arched doors. They looked rather like lime kilns and were built from beach stones. Above them rose a huge rough castle, crowded with towers, arches, bridges, buttresses, bastions, sloping defenses, and a great moat.
        - id: ch01-b36
          speaker: lucy
          text: >-
            I never built a city like that. Did you?
        - id: ch01-b37
          speaker: philip
          text: >-
            No. Wait, though. I believe it is the sand castle Helen and I made at Dymchurch last summer. Those huts are the shapes I pressed from my pail, only the edges have worn away.
        - id: ch01-b38
          speaker: narrator
          text: >-
            They moved toward the castle. The camel rolled like a boat in rough water, while the dogs stepped over the stones with the care of cats. They went around great pools and tall rocks covered in seaweed. Then they followed a road broad enough for twelve chariots to drive abreast, all the way to the mighty gate. Heads leaned from every window, and figures crowded every terrace and battlement. The children tipped their own heads so far back to see them that their necks stayed stiff for a long time afterward. All those people looked young. Each one wore a single dark, furry-looking garment that reached from shoulder to knee.
        - id: ch01-b39
          speaker: philip
          text: >-
            There are crowds of them. Where did they all come from?
        - id: ch01-b40
          speaker: parrot
          text: >-
            From a book. The authorities acted quickly that time, so only a line and a half escaped. It said, “Happy troops of gentle islanders.” These are those islanders.
        - id: ch01-b41
          speaker: philip
          text: >-
            Then why don't they live on an island?
        - id: ch01-b42
          speaker: parrot
          text: >-
            There is only one island. No one may go there except two people who never do. Still, the islanders are happy without one. They are always happy, apart from the great fear.
        - id: ch01-b43
          speaker: narrator
          text: >-
            They crossed a bridge over the moat toward the largest arch, a rough opening like the mouth of a cave. A small crowd came out of the darkness.
        - id: ch01-b44
          speaker: lucy
          text: >-
            They're savages!
          emotion: fearful
        - id: ch01-b45
          speaker: narrator
          text: >-
            Lucy shrank down until she looked like another hump on the camel. The people were dark from the sun, but their faces were handsome and kind. They smiled, waved, and welcomed the travelers. The tallest stepped forward. He was about Philip's size.
        - id: ch01-b46
          speaker: philip
          text: >-
            They aren't savages. Don't be silly. They're only children.
        - id: ch01-b47
          speaker: parrot
          text: >-
            Quiet! The Lord High Islander is about to deliver the official welcome.
        - id: ch01-b48
          speaker: billy
          text: >-
            How splendid that you've come! Climb down and come inside for something to eat. Jim, please take the camel to the stable and rub him down. You'll want the dogs with you, of course. What shall we do with the parrot?
        - id: ch01-b49
          speaker: philip
          text: >-
            Thank you very much. The parrot will decide for himself. He always does.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Philip slid from the camel, and Lucy came after him. Everyone trooped into the castle hall. It looked more like a cave than a hall and was very dark, because its windows were tiny and high above the floor. At first Lucy could see almost nothing. As her eyes slowly grew used to the dimness, she discovered that the islanders' strange clothes were made of seaweed, not animal skins.
        - id: ch01-b51
          speaker: billy
          text: >-
            I invited you to eat because it was polite, but dinner isn't ready and the hunt meets in half an hour. Unless you are truly hungry?
        - id: ch01-b52
          speakers: [philip, lucy]
          ensemble: duo
          text: >-
            Not at all!
        - id: ch01-b53
          speaker: billy
          text: >-
            You hunt, naturally? Apart from fishing, it is the only sport we have. We play games too. I do hope you won't be bored.
        - id: ch01-b54
          speaker: parrot
          text: >-
            We came on business. These are Philip and Lucy, both seeking the Deliverership. They are carrying out their deeds.
        - id: ch01-b55
          speaker: narrator
          text: >-
            The delighted islanders pressed close to inspect the parrot.
        - id: ch01-b56
          speaker: lucy
          text: >-
            Philip is really the one seeking it, not me. The parrot is only being polite.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Lucy whispered this, but the Lord High Islander frowned.
        - id: ch01-b58
          speaker: billy
          text: >-
            We can discuss that later. There is no reason to waste time now.
        - id: ch01-b59
          speaker: philip
          text: >-
            What do you hunt?
        - id: ch01-b60
          speaker: billy
          text: >-
            Every sort of graibeeste and vertoblanc, and the blugraiwee whenever we find one. Blugraiwees are scarce. Pinkuggers are common and much larger. You will see for yourselves. If your camel needs rest, I can find mounts for both of you. What animals do you like to ride?
        - id: ch01-b61
          speaker: philip
          text: >-
            What do you ride?
        - id: ch01-b62
          speaker: narrator
          text: >-
            The Lord High Islander rode a giraffe, and Philip longed to ride another. Lucy thanked him but said she preferred the animal she already knew. When they entered the courtyard, they found it packed with animals. You might have seen any of them at the zoo, or in a Noah's ark that had been costly to begin with and had not lost too many of its inhabitants. Every animal had a rider waiting. Soon the entire hunting party streamed from the courtyard and out across the beach.
        - id: ch01-b63
          speaker: philip
          text: >-
            What are they actually hunting?
        - id: ch01-b64
          speaker: narrator
          text: >-
            The parrot had settled on Philip's shoulder.
        - id: ch01-b65
          speaker: parrot
          text: >-
            All the little animals from Noah's ark that never received names. Every one of them is fair game. Look, a blugraiwee!
        - id: ch01-b66
          speaker: narrator
          text: >-
            A small grey beast with blue spots sprang from behind a rock and ran for a patch of giant seaweed. Other little animals scattered toward safe hiding places.
        - id: ch01-b67
          speaker: parrot
          text: >-
            That bright green creature with the white chest and paws is a vertoblanc. And there goes a graibeeste.
        - id: ch01-b68
          speaker: narrator
          text: >-
            The graibeeste was about the size of a fox. It had rabbit ears, and its tail grew from the middle of its back instead of either end. Graibeestes, however, come in every possible size and shape. You see, the makers of Noah's ark animals begin with the big beasts. They carefully copy elephants, lions, and tigers and paint them in colors close to nature. After a while, the makers grow tired of copying. They begin painting animals pink, green, and chocolate, colors nature does not often use that way. Those creatures become chockmunks, vertoblancs, and pinkuggers. Soon the makers are thoroughly tired of the job. They carve whatever shapes come to mind and paint them all grey. Those are the graibeestes. At the very end, the makers feel a little guilty for doing such careless work. To ease their consciences, they paint blue spots on the last and smallest graibeeste. That little creature is the blugraiwee.
        - id: ch01-b69
          speakers: [islander_1, islander_2, islander_3]
          ensemble: chorus
          text: >-
            Tally ho! Hark forward! Yoicks!
        - id: ch01-b70
          speaker: narrator
          text: >-
            The whole hunt swept forward behind the blugraiwee. Dogs yapped, animals galloped, and riders shouted on every side. The sun shone and the sea sparkled beside them. Far ahead, the fleeing creature stretched itself to its full length until it looked like one straight grey line. The chase covered five miles before the blugraiwee was killed. It had been a splendid run. The hunters went on until they had also secured a pinkugger and half a dozen graibeestes. Only then did the party turn and ride slowly back to the castle.
        - id: ch01-b71
          speaker: billy
          text: >-
            We hunt only to kill, and we kill only for food.
        - id: ch01-b72
          speaker: philip
          text: >-
            I thought Noah's ark animals became wooden again when they died.
        - id: ch01-b73
          speaker: billy
          text: >-
            Not when you kill them for food. Your intention changes everything. When we found the blugraiwee, I intended plum cake. For the pinkugger I intended bread and butter. I intended the graibeestes to become rice pudding, prunes, toffee, ices, and other things. When we cut them up, that is what they will be.
        - id: ch01-b74
          speaker: philip
          text: >-
            I see. Do you mind telling me why everyone here is a child?
        - id: ch01-b75
          speaker: billy
          text: >-
            The answer is ancient history, so I do not suppose it is true. They say the government had to make certain we always remained “happy troops of gentle islanders.” It decided the only way was to keep us children forever. We do have the most wonderful time. We conduct our own hunts, do our own cooking, and wash our own plates. The M.A.'s take care of the heavy labor. They worked so hard at sums, history, and other things at College that they needed a holiday. Now they come here and work for us instead. If any of us wants to learn, the M.A.'s are always nearby. Teaching anything makes them happy, poor fellows. They live in the huts, and there is a long list of others waiting for a turn here. They wear seaweed clothes just as we do. They hunt on Tuesdays, Thursdays, and Saturdays. Their game is larger, including the fierce ambergris, which is grey with a yellow belly, and the bigger sorts of graibeeste. As soon as we get back, we shall have dinner. After that, we must discuss It.
        - id: ch01-b76
          speaker: narrator
          text: >-
            In the courtyard, the hunters skinned and cut up their catch. Billy's intentions had worked perfectly. The blugraiwee was plum cake, and the rest had become everything else they needed.
        - id: ch01-b77
          speaker: narrator
          text: >-
            After dinner, Billy led Philip and Lucy all the way to the top of the highest tower. The three children stretched out in the warm sunshine with pieces of toffee to eat. From that height, they could see far across the broad sea. At the very edge of sight, the forbidden island showed as a faint blue shape in the distance.
        - id: ch01-b78
          speaker: billy
          text: >-
            That is the island where none of us may go.
          emotion: sad
        - id: ch01-b79
          speaker: lucy
          text: >-
            Will you tell us what frightens you? Please don't be ashamed. We get frightened too. There are all sorts of things we're afraid of.
          emotion: calm
        - id: ch01-b80
          speaker: philip
          text: >-
            Speak for yourself. I'm not afraid nearly as often as you think. Go on, my Lord.
        - id: ch01-b81
          speaker: billy
          text: >-
            You may call me Billy. That is my name.
        - id: ch01-b82
          speaker: philip
          text: >-
            All right, Billy. What scares you?
        - id: ch01-b83
          speaker: billy
          text: >-
            I hate being frightened! I know a true boy fears nothing except doing wrong. One of the M.A.'s told me so. But even the M.A.'s are afraid.
          emotion: angry
        - id: ch01-b84
          speaker: lucy
          text: >-
            Afraid of what? It will be dark soon, and I would much rather hear about it while the sun is up.
        - id: ch01-b85
          speaker: billy
          text: >-
            We fear the sea. What if one enormous wave washed away the castle, the huts, the M.A.'s, and every one of us?
        - id: ch01-b86
          speaker: lucy
          text: >-
            But that has never happened, has it?
        - id: ch01-b87
          speaker: billy
          text: >-
            No, but everything has to begin sometime. Another M.A. told me that, so I know it is true.
        - id: ch01-b88
          speaker: lucy
          text: >-
            Why don't you move farther inland?
        - id: ch01-b89
          speaker: billy
          text: >-
            We could never live far from the sea. We are islanders, even if we do not live on the island, and we could not bear to lose the sight and sound of it. We would rather stay beside it and be afraid than move away and have no sea to fear. The government is troubled, though. The book calls us happy troops of gentle islanders, and no one can be completely happy while fear is always waiting nearby. That is why taking our fear away has become one of the deeds you must perform.
        - id: ch01-b90
          speaker: philip
          text: >-
            That sounds terribly difficult. I shall have to think.
        - id: ch01-b91
          speaker: narrator
          text: >-
            Philip lay thinking desperately. Max and Brenda slept beside him. The parrot smoothed its bright feathers on the parapet, while Lucy and Billy played cat's cradle with a long strand of seaweed.
        - id: ch01-b92
          speaker: billy
          text: >-
            It is supper time. Have you found an answer?
        - id: ch01-b93
          speaker: philip
          text: >-
            Not one.
        - id: ch01-b94
          speaker: billy
          text: >-
            Then stop working at it. Stay and enjoy yourself. The answer will come to you, or perhaps Lucy will find it. Tonight we'll act charades.
        - id: ch01-b95
          speaker: narrator
          text: >-
            They did act charades that night. The other islanders proved to be a wonderfully cheerful company, and every one of the M.A.'s came out of the huts to form an audience. It was a charming evening from beginning to end. When the charades were over, the children played hide-and-seek through the whole castle, searching its dark halls, rough arches, terraces, and towers.
        - id: ch01-b96
          speaker: narrator
          text: >-
            Next morning, Lucy woke on a bed of soft, dry, sweet-smelling seaweed. She knew that a whole day of fun waited with the merriest children she had ever met, and the thought delighted her. Philip enjoyed the day too, but his pleasure was clouded by knowing that sooner or later he had to think of an answer. Still, the hours passed agreeably. Everyone bathed in the rock pools and gathered shellfish for dinner. They played rounders through the afternoon. That evening they danced while the M.A.'s made music. Most of those learned men carried flutes in their pockets, and they were deeply flattered when the children asked them to play.
        - id: ch01-b97
          speaker: narrator
          text: >-
            One pleasant day followed another. Each morning Philip woke and told himself that this was the day when he truly must think of something. Each night he went to bed telling himself that he ought to have found the answer before the day ended. He enjoyed the games and company, but the unfinished deed never quite left his thoughts. Still, he could imagine nothing that would take the fear of the sea from the gentle islanders.
        - id: ch01-b98
          speaker: narrator
          text: >-
            On the sixth night, a storm broke. The wind howled, the sea roared, and the castle shook down to its foundations. Philip woke, sat upright, and finally understood the fear that spoiled the Dwellers' happiness.
        - id: ch01-b99
          speaker: philip
          text: >-
            What if the sea really swept us all away? They do not even have a boat.
        - id: ch01-b100
          speaker: narrator
          text: >-
            Just when he least expected it, an idea came. He thought so hard that sleep never returned.
        - id: ch01-b101
          speaker: philip
          text: >-
            I have a plan. I won't tell the others yet, but I cannot carry it out alone. Could you bring Mr. Perrin here?
        - id: ch01-b102
          speaker: parrot
          text: >-
            I shall be delighted to try.
        - id: ch01-b103
          speaker: narrator
          text: >-
            The bird flew off at once. That afternoon, as a picnic tea was ending, a huge shadow crossed the party. The Hippogriff landed with the parrot and Mr. Perrin on his back. Philip thanked them and hurried Mr. Perrin away for a whispered talk.
        - id: ch01-b104
          speaker: mr_perrin
          text: >-
            No, sir. I am sorry, but I cannot do it.
        - id: ch01-b105
          speaker: philip
          text: >-
            Don't you know how?
        - id: ch01-b106
          speaker: mr_perrin
          text: >-
            I know everything there is to know in my trade. But carpentry is one matter and good manners another. I understand manners too, and that is exactly why I will have no part in this.
        - id: ch01-b107
          speaker: philip
          text: >-
            You haven't understood. I want you to build a Noah's ark on the highest tower. Whenever the wind blows and the sea grows rough, all the Dwellers can climb inside. Then they will be safe, no matter what happens.
        - id: ch01-b108
          speaker: mr_perrin
          text: >-
            You told me that already, and I am astonished at you.
        - id: ch01-b109
          speaker: philip
          text: >-
            I thought it was such a good plan.
          emotion: sad
        - id: ch01-b110
          speaker: mr_perrin
          text: >-
            The plan is fine. I have no complaint about the plan.
        - id: ch01-b111
          speaker: philip
          text: >-
            Then what is the trouble?
        - id: ch01-b112
          speaker: mr_perrin
          text: >-
            You have asked the wrong man. I would not steal another fellow's work, however humble his trade might be. And insulting the government as well! Master Pip, I never expected such a thing from you. It could cost me my position.
        - id: ch01-b113
          speaker: narrator
          text: >-
            Philip stopped walking. He was almost in despair.
        - id: ch01-b114
          speaker: philip
          text: >-
            Please tell me plainly. Why won't you help?
        - id: ch01-b115
          speaker: mr_perrin
          text: >-
            At my age, I will not start building arks behind Mr. Noah's back. It would break his old heart if I took over his proper work.
        - id: ch01-b116
          speaker: philip
          text: >-
            Oh! I should ask him to do it?
        - id: ch01-b117
          speaker: mr_perrin
          text: >-
            Of course. I will gladly help under his orders and serve as foreman so the work is done properly. But you must give the commission to him.
        - id: ch01-b118
          speaker: narrator
          text: >-
            Between them, the parrot and the Hippogriff brought Mr. Noah to the castle by noon the following day.
        - id: ch01-b119
          speaker: philip
          text: >-
            Would it have hurt your feelings if I had ordered an ark without asking you to build it?
        - id: ch01-b120
          speaker: mr_noah
          text: >-
            I might have felt a little hurt, my Lord. I do have some experience.
        - id: ch01-b121
          speaker: philip
          text: >-
            Why are you calling me “my Lord”?
        - id: ch01-b122
          speaker: mr_noah
          text: >-
            Because you are a lord. Slaying the lions counted as one deed. By that deed, you became a Baron. My congratulations, Lord Leo.
        - id: ch01-b123
          speaker: narrator
          text: >-
            Mr. Noah approved the plan. He and Mr. Perrin immediately began choosing materials, measuring stresses, and drawing up the work.
        - id: ch01-b124
          speaker: narrator
          text: >-
            Philip gathered the islanders and made a speech explaining his whole idea. Cheers and shouts broke out as soon as they understood. Every person agreed that an ark on the highest tower would answer a need they had felt for a very long time. When rough weather came, they could climb above the waves and shelter inside it. They were certain that once the ark stood there, fear would become a stranger forever to every gentle island heart.
        - id: ch01-b125
          speaker: narrator
          text: >-
            Then the great work began. Mr. Perrin kindly agreed to serve as foreman, and he put a whole army of M.A.'s to work. The sound of saws and hammers mixed with the splash of waves and the cries of seabirds. Strong M.A.'s bent over the timbers in their seaweed tunics. Some shaped the huge beams, and others hoisted them toward the top of the highest tower. More gangs waited above. Under Mr. Noah's own watchful eye, they raised a scaffold strong enough to support the ark through every stage of its building.
        - id: ch01-b126
          speaker: narrator
          text: >-
            The children were forbidden to help. They watched so earnestly that they almost felt they were somehow helping after all. Perhaps you know that feeling.
        - id: ch01-b127
          speaker: narrator
          text: >-
            The Hippogriff stayed in the castle stable and flew wherever heavy loads had to be lifted. Mr. Noah only whispered the magic word into his ear, and up he went. Philip and Lucy asked again and again, but no one told them what the word was.
        - id: ch01-b128
          speaker: narrator
          text: >-
            At last, the ark was complete and the scaffold came down. There stood the great Noah's ark, planted firmly on the very top of the highest tower. It was a perfect example of the ark-builder's craft. Its boat-shaped lower part was painted a quiet dull red. The sides and both ends were blue, with rows of black windows. The roof shone bright scarlet, with painted lines that made it look tiled. Mr. Noah had neglected no detail, however small. There was even a white bird painted on the roof, the very bird you must have noticed on a Noah's ark of your own.
        - id: ch01-b129
          speaker: narrator
          text: >-
            A grand festival followed the ark's completion. Speakers rose one after another, and songs rang through the castle. Everyone who had taken even the smallest part in the building was honored. The most humble M.A. received the same kind of wreath as the great planners, woven from fresh pink and green seaweed. Then the Sea-Dwellers' official poet stood before the crowd. He was a young M.A. with pale blue eyes and no chin, and he began to recite an ode written for the occasion.
        - id: ch01-b130
          speaker: laureate
          text: >-
            Now our Noble Ark is here, we need not tremble in the dark when roaring wind and sea draw near. If high tides climb on every side, we will be safe in there and bless the builders of our painted Ark.
        - id: ch01-b131
          speaker: narrator
          text: >-
            Three hundred and seventeen more lines followed, all very similar. Everyone declared the poem wonderful. They called the laureate a genius, marveled at his brains, and wondered how he did it.
        - id: ch01-b132
          speaker: narrator
          text: >-
            Philip and Lucy received crowns as well. Billy formally offered Philip the islanders' thanks, and Philip modestly replied that it was really nothing and anyone could have done it. A spirit of gladness moved through the whole company. Everyone smiled and shook hands with everyone else. Even the M.A.'s began telling little polite old jokes. They slapped one another on the back and called each other “old chap,” though that was nothing like their behavior in ordinary life. Garlands of pink and green seaweed, matching the wreaths on every head, hung all over the castle. The entire scene was as gay and happy as anything you could imagine.
        - id: ch01-b133
          speaker: narrator
          text: >-
            And then the dreadful thing happened.
        - id: ch01-b134
          speaker: narrator
          text: >-
            Philip and Lucy stood on a courtyard platform in the seaweed tunics they had worn since their first day there. Mr. Noah had just begun to speak.
        - id: ch01-b135
          speaker: mr_noah
          text: >-
            We shall enjoy this enjoyable day to the very end, and tomorrow we will return to the city.
        - id: ch01-b136
          speaker: narrator
          text: >-
            Before he could finish, a shadow passed over the group. The Hippogriff swooped down, and someone was riding on his back. No one could see who it was at first. The great creature flew low enough for the hidden rider to seize Philip by his seaweed tunic. In one swift movement, Philip was lifted clear off his feet and swung onto the Hippogriff's back. Lucy screamed. Mr. Perrin protested, and Mr. Noah cried out. Every hand reached upward, trying to pull Philip down to safety, but every hand was too late.
        - id: ch01-b137
          speaker: mr_perrin
          text: >-
            Here now! None of that!
          emotion: surprised
        - id: ch01-b138
          speaker: mr_noah
          text: >-
            Dear me!
          emotion: surprised
        - id: ch01-b139
          speaker: philip
          text: >-
            I won't go! Put me down!
          emotion: angry
        - id: ch01-b140
          speaker: pretenderette
          text: >-
            Oh, won't you, my Lord? We shall soon find out.
        - id: ch01-b141
          speaker: narrator
          text: >-
            Philip knew the voice. So did Lucy, Mr. Noah, the parrot, and both dogs. Max and Brenda barked and growled.
        - id: ch01-b142
          speaker: mr_noah
          text: >-
            Drop him!
          emotion: angry
        - id: ch01-b143
          speaker: lucy
          text: >-
            Oh no! It is the Pretenderette!
          emotion: fearful
        - id: ch01-b144
          speaker: narrator
          text: >-
            It truly was that wicked woman. She had broken out of prison and stolen the Hippogriff once again. Without wasting a moment, the parrot shot into the air and attacked her ear. But the Pretenderette was not going to be caught twice by the same bird. This time she was ready. She had loosened her motor veil beforehand, and as the parrot touched her ear, she trapped it in the veil. Then she thrust the struggling bird into a wicker cage that hung prepared beside the saddle. All the while, the Hippogriff hovered on his wide white wings above the crowd of upturned faces.
        - id: ch01-b145
          speaker: narrator
          text: >-
            Lucy thought the Pretenderette's veil must now be loose enough to reveal her face. She could not shake the feeling that one look would tell her who the woman really was. But the Pretenderette was too cunning to glance down without her veil. She kept her face turned upward, away from everyone below. Her lips must have whispered the magic word, because the Hippogriff suddenly climbed into the air. Before anyone could act, he was carrying Philip, the Pretenderette, and the caged parrot across the sea with incredible speed.
        - id: ch01-b146
          speaker: lucy
          text: >-
            What am I going to do? Mr. Noah, what will she do to Philip? Where is she taking him? What can I do? How will I ever find him?
          emotion: fearful
        - id: ch01-b147
          speaker: narrator
          text: >-
            Lucy wrung her hands. People often say that someone wrings her hands, but Lucy truly did it.
        - id: ch01-b148
          speaker: mr_noah
          text: >-
            My dear child, I deeply regret that I cannot answer even one of those questions.
        - id: ch01-b149
          speaker: lucy
          text: >-
            Can't I follow him?
        - id: ch01-b150
          speaker: mr_noah
          text: >-
            I am afraid we have no boats. The Pretenderette has taken our only Hippogriff, and none of the camels can fly.
        - id: ch01-b151
          speaker: narrator
          text: >-
            In her desperate impatience, Lucy stamped her foot.
        - id: ch01-b152
          speaker: lucy
          text: >-
            Then what can I do?
          emotion: fearful
        - id: ch01-b153
          speaker: mr_noah
          text: >-
            Nothing, my child, except go to bed and sleep well. Tomorrow we shall return to the city and decide what can be done. We must ask the oracle.
        - id: ch01-b154
          speaker: lucy
          text: >-
            Can't we leave now?
          emotion: sad
        - id: ch01-b155
          speaker: narrator
          text: >-
            Lucy was crying.
        - id: ch01-b156
          speaker: mr_noah
          text: >-
            An oracle is no use until it has slept through the night. The journey takes three days. It is already dusk, and if we left now, we would arrive in the middle of the night. We shall start early tomorrow.
        - id: ch01-b157
          speaker: narrator
          text: >-
            Early morning came, but there was no departure from the castle of the Dwellers by the Sea. In fact, there was no one left who could begin the journey. And even if there had been someone, there was no castle remaining for anyone to start from.
        - id: ch01-b158
          speaker: narrator
          text: >-
            After a rather disturbed night, a young blugraiwee peeped out of its hole. It wanted to see whether any human beings were stirring yet. If none were awake, it might safely search for yellow periwinkles, which were its favorite food. The blugraiwee gave a start. It pricked up its spotted ears and looked a second time. What it saw made hiding among the rocks seem unnecessary, so the little creature stepped boldly from cover and walked out across the open beach.
        - id: ch01-b159
          speaker: narrator
          text: >-
            The beach was utterly deserted. There was no Mr. Noah and no Lucy. Not one gentle islander remained, and not one M.A. could be seen. More than that, every hut had disappeared, and the enormous castle had disappeared with them. Where towers, bridges, houses, and people had stood, there was only a smooth and empty beach, bare beneath the morning sky and combed flat by the sea.
        - id: ch01-b160
          speaker: narrator
          text: >-
            The sea had risen at last. The fear that had troubled the Dwellers for so long had proved justified. Perhaps the sea had simply grown curious about the new ark high above it. No one knows whether that was the reason, and no one will ever know. Whatever drew it upward, the sea had crossed the beach during the night. It had swept away every last trace of the castle, every hut, and all the people who had lived there.
        - id: ch01-b161
          speaker: narrator
          text: >-
            A bright parrot appeared in the clear air. A strip of motor veil streamed from one claw as it called to the little blugraiwee below.
        - id: ch01-b162
          speaker: parrot
          text: >-
            What has happened? Where has everything gone?
          emotion: surprised
        - id: ch01-b163
          speaker: blugraiwee
          text: >-
            I really don't know. These human things are always coming and going. Would you like some periwinkles? They are especially good this morning after the storm.
