audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖沉着，带一点机敏的幽默
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中
    philip:
      display_name: 菲利普
      tts:
        delivery: 直率敏感，想象丰富，情绪来得快
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    lucy:
      display_name: 露西
      tts:
        delivery: 开朗友好，坦率好奇
        timbre: 轻盈稚嫩
        pace: 轻快
        pitch: 中高
    polly:
      display_name: 波利
      tts:
        delivery: 机灵健谈，爱挖苦也很讲义气
        timbre: 清脆略带沙哑
        pace: 稍快
        pitch: 中高
    max:
      display_name: 马克斯
      tts:
        delivery: 忠诚直爽，逞强时仍透出紧张
        timbre: 明亮结实
        pace: 适中
        pitch: 中
    brenda:
      display_name: 布伦达
      tts:
        delivery: 亲热温柔，害怕时格外殷勤
        timbre: 轻柔明快
        pace: 适中
        pitch: 中高
    companion_1:
      display_name: 同伴甲
      tts:
        delivery: 年轻自然，反应直接
        timbre: 清亮
        pace: 适中
        pitch: 中
    companion_2:
      display_name: 同伴乙
      tts:
        delivery: 年轻自然，反应直接
        timbre: 明快
        pace: 适中
        pitch: 中高
    red_leader:
      display_name: 红衣头领
      tts:
        delivery: 困倦守旧，一心只想避开麻烦
        timbre: 干涩圆钝
        pace: 缓慢
        pitch: 中低
    water_drawer:
      display_name: 打水人
      tts:
        delivery: 睡意蒙眬，迟钝而勉强
        timbre: 轻而黯淡
        pace: 缓慢
        pitch: 中
    somnolentian_woman:
      display_name: 瞌睡国女人
      tts:
        delivery: 恍惚轻柔，低声说话
        timbre: 柔和温润
        pace: 缓慢
        pitch: 中
    key_keeper:
      display_name: 钥匙保管人
      tts:
        delivery: 紧张疲倦，拘泥规矩
        timbre: 细弱低沉
        pace: 缓慢
        pitch: 中高
    great_sloth:
      display_name: 大懒兽
      tts:
        delivery: 傲慢沉重，困倦中带着暴躁
        timbre: 粗大含混
        pace: 拖沓
        pitch: 低
    machine:
      display_name: 抽水机
      tts:
        delivery: 温和自负，精确而不容争辩
        timbre: 平滑，带金属质感
        pace: 平稳
        pitch: 中
    halma_man_1:
      display_name: 哈尔玛棋子甲
      tts:
        delivery: 犹豫不安，刚刚振作起来
        timbre: 粗哑低沉
        pace: 适中
        pitch: 中低
    halma_man_2:
      display_name: 哈尔玛棋子乙
      tts:
        delivery: 犹豫不安，刚刚振作起来
        timbre: 清晰低沉
        pace: 适中
        pitch: 中
    oldest_woman:
      display_name: 最年长的女人
      tts:
        delivery: 朴实惊喜，满怀希望
        timbre: 苍老温暖
        pace: 从容
        pitch: 中低
    woman_2:
      display_name: 女人乙
      tts:
        delivery: 困倦朴实，直截了当
        timbre: 柔和清晰
        pace: 缓慢
        pitch: 中
    woman_3:
      display_name: 女人丙
      tts:
        delivery: 困倦朴实，直截了当
        timbre: 轻柔清晰
        pace: 缓慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 地下瀑布
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            你听说过印第安人驾着桦树皮独木舟冲下急流吧？也许你还在小溪里放过玩具船，筑一道黏土堤坝，等水快漫到堤顶，再挖开一小块，让船漂过小瀑布。它先是慢慢漂，迟疑一下，忽然越冲越快。有时会翻，有时会左右摇晃，颤抖挣扎一阵，终于重新站稳，像拿定主意似的猛冲下去，往往又缠在下一个转弯处的灯心草里。“闪电脱缰号”正是这样。它越过黑暗平滑的地下瀑布，在静止的空气和奔落的水流之间悬了叫人屏息的一瞬，又像闪电一样滑落。船身撞进下面的河流，猛地一颤，左右倾斜，终于稳住，继续飞驰。那滋味，就像从伯爵宫的水滑道上冲下来。
        - id: ch01-b02
          speaker: philip
          text: 没……没事。船还在往前开，开得好好的。
        - id: ch01-b03
          speaker: lucy
          text: 对，一定没事。船还在好好地往前开呢。
        - id: ch01-b04
          speaker: brenda
          text: 我们是不是淹死了？马克斯，我们真的已经淹死了吗？
          emotion: fearful
        - id: ch01-b05
          speaker: max
          text: 我想没有。亲爱的，就算淹死了，尖叫也不能叫我们重新活过来。
        - id: ch01-b06
          speaker: narrator
          text: >-
            那一下把鹦鹉也惊得一时说不出话。你要知道，鹦鹉天生就爱说话，寻常的一点小事绝不会叫它哑口无言。过了一会儿，它总算又开口了。
        - id: ch01-b07
          speaker: polly
          text: 远远没有淹死。所以，大家还是规矩一点吧。
        - id: ch01-b08
          speaker: narrator
          text: >-
            船灯倒一直很规矩，而且表现得漂亮极了。游艇穿过瀑布边疯狂翻腾的空气，又猛撞进下游，激起猛烈的水花，可那些灯始终安安稳稳地亮着，仿佛什么也没发生。
        - id: ch01-b09
          speaker: polly
          text: 这才是大家都该学的榜样。
        - id: ch01-b10
          speaker: lucy
          text: 可是，我们现在要做什么？
        - id: ch01-b11
          speaker: polly
          text: 冒险忽然转向谁也没料到的地方，一个人就只能做自己办得到的事。
        - id: ch01-b12
          speaker: lucy
          text: 那我们办得到什么？
        - id: ch01-b13
          speaker: polly
          text: >-
            什么也不办。菲利普已经替下马克斯，在两岸之间照直掌舵。当然，那两边的东西要是也能算河岸的话。除此以外，没有事可做。
        - id: ch01-b14
          speaker: narrator
          text: >-
            的确没有。“闪电脱缰号”在黑暗中疾驰。露西默默想了一会儿，便动手煮起可可。这可是真正的英勇。那杯柔滑、香甜又寻常的热饮，让每个人都振作起来，连煮可可的露西自己也一样。一个人正在做这种再普通不过的饮料时，实在很难相信可怕的事真会发生。
        - id: ch01-b15
          speaker: philip
          text: >-
            我一直在想，现在总算明白了。这一切都是从书里跑出来的，一定有人把它放了出来。我连是哪本书都知道。只要整篇故事都跑出来了，我们就不会有事。不过，得在地下走上很久，最后才会爬出去，而且出口离的里雅斯特还有三天路程。
        - id: ch01-b16
          speaker: lucy
          text: >-
            明白了，可我讨厌地理。先趁热喝可可吧。对了，那本书叫什么？
        - id: ch01-b17
          speaker: philip
          text: >-
            《水鸭号的最后一次航行》。海伦离开前送给我的，特别好看。我拿它做了正义殿外院的屋顶。书里“水鸭号”上的人把纸浸进煤油，做成了火把，我记得清清楚楚。
        - id: ch01-b18
          speaker: lucy
          text: >-
            我们既没有纸，也没有煤油。不过船灯已经把四周照得够亮了。噢，布伦达又哭起来了。她真是连一点点胆量也没有。
        - id: ch01-b19
          speaker: narrator
          text: >-
            露西赶紧走进船舱。马克斯正在用一番十分实在的道理安慰布伦达，可布伦达根本不听。
        - id: ch01-b20
          speaker: brenda
          text: >-
            我早知道事情会变成这样，一开始就告诉过你们。我真希望我们根本没有来。我要回家！让亲爱又可爱的小狗碰上这种可怕的事，实在太不应该了。
          emotion: fearful
        - id: ch01-b21
          speaker: lucy
          text: 布伦达，你再哼哼，就没有可可喝。
        - id: ch01-b22
          speaker: narrator
          text: 布伦达马上住嘴，还讨好地摇起尾巴。
        - id: ch01-b23
          speaker: brenda
          text: >-
            可可？刚才有人说可可吗？我的神经太纤细了。亲爱的马克斯，我知道自己很叫人操心，你不用假装不是这样。可安抚神经，再没有比可可更好的东西。亲爱的露西，多放点糖。太谢谢你啦！对，这正是我喜欢的味道。
        - id: ch01-b24
          speaker: lucy
          text: 一会儿还有别的东西吃。哼哼的人什么也吃不到。
        - id: ch01-b25
          speaker: brenda
          text: >-
            我敢说，谁也不会想要哼哼。我只是太敏感了。不过，只要对可爱的小狗和气些，你叫它做什么都行。至于哼哼，我从小就没有这个毛病，从来没有。马克斯也会这么说。
        - id: ch01-b26
          speaker: narrator
          text: 马克斯什么也没说，只把漂亮的眼睛满怀希望地盯着可可壶。
        - id: ch01-b27
          speaker: narrator
          text: >-
            游艇一直沿地下河飞驰，头顶是洞窟辽阔的穹顶。马克斯重新掌舵以后，菲利普说出了最让人担心的事。
        - id: ch01-b28
          speaker: philip
          text: 我们也许正在离目的地越来越远。这才是最糟的。
        - id: ch01-b29
          speaker: polly
          text: >-
            条条道路都通往瞌睡国。再说，这艘船正朝着正北方走。至少船上的罗盘是这样说的，而到目前为止，我还没有任何理由怀疑它说了假话。
        - id: ch01-b30
          speakers: [companion_1, companion_2]
          ensemble: duo
          text: 嘿！
          emotion: surprised
        - id: ch01-b31
          speaker: narrator
          text: >-
            船猛地冲出黑暗洞窟，来到白色穹顶下的一片开阔水面。载他们来到这里的地下河，似乎从水池的一侧横穿而过。马克斯按照鹦鹉的指点，把游艇驶离水流，开进平静的水域，最后让它安安稳稳停在这座巨大地下湖的正中央。
        - id: ch01-b32
          speaker: philip
          text: 这可不是从《水鸭号的最后一次航行》里来的。那本书一定已经合上了。
        - id: ch01-b33
          speaker: lucy
          text: >-
            我看这是从一本讲墨西哥、秘鲁、金锭，或者别的什么地理地方的书里跑出来的。那本书是绿色镶金封面，你拿它做了正义殿外院另一头的屋顶，我记得很清楚。要真是那本书，这整座穹顶就是纯银做的，正中央会有一个洞，而穹顶下面还藏着数也数不完的黄金印加。
        - id: ch01-b34
          speaker: philip
          text: 印加是什么？
        - id: ch01-b35
          speaker: lucy
          text: >-
            我想，印加就是金条。墨西哥人会从屋顶的洞里下来，把金条拿走。敌人来了，他们就放水淹没藏宝库。现在这里已经淹了，当然不用我说，你也看得出来。
        - id: ch01-b36
          speaker: brenda
          text: >-
            我真希望谁也没发明过冒险。不，亲爱的露西，我没在哼哼，远远没有。可是，如果可爱的小狗也能提建议，我们大家待在家里不是更好吗？
        - id: ch01-b37
          speaker: narrator
          text: >-
            这时，大家都看见闪亮穹顶中央有个圆圆的黑洞。所有人一齐盯着它。望着望着，黑洞忽然亮了。头顶出现一轮又大又亮的白色圆盘，像一轮格外明亮的满月。可是，那并不是月亮，而是从外面照进来的白昼之光。
        - id: ch01-b38
          speaker: lucy
          text: 有人打开活板门了。金锭人总是用活板门封住藏宝库。
        - id: ch01-b39
          speaker: narrator
          text: >-
            一些模糊的形状遮住了白色圆盘，破开了它圆圆的光。接着，中央又出现一个小小的黑圆，而且越来越大。它正缓慢而平稳地朝他们降下来，先降到穹顶的高度，又悬到穹顶下面。它继续向下，越过大家急切仰起的眼睛，最后扑通一声落进船边的水里。原来是一只空荡荡的大水桶。上面的人猛扯绳子，桶身一歪，灌满了水，又缓慢而平稳地升起，直到消失在洞口。
        - id: ch01-b40
          speaker: polly
          text: 快把船开到洞口正下方。下次水桶再下来，你们就坐着它上去。
    - id: ch02
      title: 水桶升到井口
      blocks:
        - id: ch02-b01
          speaker: lucy
          text: >-
            我看这回是《一千零一夜》里的故事。可谁一直在打开这些书？一定有人正在拆波利斯托波利斯。
        - id: ch02-b02
          speaker: philip
          text: >-
            多半是女觊觎者。她不是解救者，那一定就是毁灭者。除了她，没人能进入波利斯塔基亚。
        - id: ch02-b03
          speaker: lucy
          text: 我也能进去呀。
        - id: ch02-b04
          speaker: philip
          text: 噢，你也是解救者。
        - id: ch02-b05
          speaker: lucy
          text: 谢谢你。可是海伦呢？
        - id: ch02-b06
          speaker: philip
          text: 她只到过小岛，进不了波利斯塔基亚。小心！
        - id: ch02-b07
          speaker: narrator
          text: 水桶又落下来，这次没有掉进水里，而是砰地撞上甲板。
        - id: ch02-b08
          speaker: philip
          text: 露西，你先走。
        - id: ch02-b09
          speaker: max
          text: 布伦达，你先走。
        - id: ch02-b10
          speaker: philip
          text: 要不然，我先走也可以。
        - id: ch02-b11
          speaker: max
          text: 是啊，布伦达，你愿意的话，我可以先走。
        - id: ch02-b12
          speaker: narrator
          text: >-
            菲利普觉得，应该把第一个逃离可怜的“闪电脱缰号”的机会让给露西。可他又不知道露西逃出去以后，究竟会落到什么地方。要是上面藏着危险，当然该由他先去面对。忠厚的马克斯对布伦达也抱着一模一样的心思。露西的想法恰好和他们一样。至于布伦达心里怎么想，我可不知道，她只是轻轻哼了一声。
        - id: ch02-b13
          speaker: narrator
          text: >-
            一时间，露西和菲利普各抓住水桶的一边提手，站在甲板上彼此望着。两只狗望着他们，鹦鹉又挨个望着大家。上面的人不耐烦地又拉又抖绳子，提醒他们不能再耽搁。
        - id: ch02-b14
          speaker: narrator
          text: >-
            露西断定坐水桶上去更加危险，菲利普却在同一刻认定留在船上更加危险。露西一跨进水桶，菲利普便急忙扶她。马克斯和菲利普想得一样，我恐怕布伦达也十分赞成。绳子刚一绷紧，水桶开始上升，她就跳进露西怀里，把长长的身子绕着她蜷成一圈。她发出一声微弱的尖叫，可露西立刻把声音捂住了。
        - id: ch02-b15
          speaker: lucy
          text: 我一上去，就马上把水桶送回来！
        - id: ch02-b16
          speaker: lucy
          text: 这感觉真好玩，像荡秋千一样！
        - id: ch02-b17
          speaker: narrator
          text: >-
            露西说着，越升越高，最后被拉进穹顶屋顶的洞口。随后，一阵杂乱的人声沿竖井传下来。留在“闪电脱缰号”上的一小群伙伴焦急地听着，却连一个完整的字也分辨不出。他们全都站在原地，仰头盯紧洞口，既担心又期待，静静等着那只水桶再次降下来接他们。
        - id: ch02-b18
          speaker: philip
          text: 我真不愿意丢下这艘船。
        - id: ch02-b19
          speaker: polly
          text: >-
            那就让你最后一个走。不过，马克斯要是先进水桶，我们得想个办法，免得你进去以后只能坐在他身上。
        - id: ch02-b20
          speaker: philip
          text: 可是你怎么办？
        - id: ch02-b21
          speaker: narrator
          text: 鹦鹉带着一点骄傲，展开半边鲜艳的翅膀。
        - id: ch02-b22
          speaker: philip
          text: >-
            噢，我明白了！你随时都可以飞走。可你一直没走，始终陪着我们。我说，你可真够朋友。
        - id: ch02-b23
          speaker: polly
          text: 不值一提。
        - id: ch02-b24
          speaker: philip
          text: 才不是。你本来可以……嘿！
          emotion: surprised
        - id: ch02-b25
          speaker: narrator
          text: >-
            水桶以可怕的速度冲了下来。大家屏住呼吸，以为露西会从空中直坠而下。可是没有。空水桶在半空荡了一下，又被匆忙拉起。一声空洞的金属巨响传遍洞窟。
        - id: ch02-b26
          speaker: max
          text: 布伦达！
          emotion: fearful
        - id: ch02-b27
          speaker: polly
          text: 我的翅膀和爪子呀！
          emotion: surprised
        - id: ch02-b28
          speaker: philip
          text: 噢，真麻烦！
        - id: ch02-b29
          speaker: narrator
          text: >-
            难怪他们会说出那些惊慌的话。头顶的白色圆盘忽然消失，上面有人砰地关上了盖子。所有男子汉的心都留在洞窟下面，勇敢的露西和无助的布伦达却到了一个完全陌生的地方。那边究竟藏着什么危险，留在下面的人只能凭空猜想。
        - id: ch02-b30
          speaker: philip
          text: 真希望刚才上去的是我。噢，我真希望是我！
          emotion: sad
        - id: ch02-b31
          speaker: max
          text: 我也真心希望是这样。
          emotion: sad
        - id: ch02-b32
          speaker: polly
          text: 我有点晕。要是有人肯煮杯可可就好了。
        - id: ch02-b33
          speaker: narrator
          text: >-
            灾难刚刚降临，出色的鹦鹉就设法给大家找点事做。船长和水手因此没有陷入绝望，实在是件好事。因为水壶还没有烧开，井盖就忽然打开约莫一英尺。一个不小的、圆滚滚又疙疙瘩瘩的东西从上面重重掉下来，在“闪电脱缰号”的甲板上弹了一下。
        - id: ch02-b34
          speaker: narrator
          text: >-
            那是一只新鲜、熟透、汁水饱满的菠萝。侧面刻着一个大字，笔画歪歪扭扭：“等”。这建议的确很好，他们便照办了。说真的，除此以外，他们也没有别的事可做。大家吃掉菠萝，没过多久，每个人都困得睁不开眼。
        - id: ch02-b35
          speaker: polly
          text: >-
            等待这件事，睡着和醒着一样能做，甚至睡着做得更好。大家打个盹儿，只会有好处。
        - id: ch02-b36
          speaker: narrator
          text: 鹦鹉蹲在罗盘柜上，把脑袋藏进翅膀底下。
        - id: ch02-b37
          speaker: max
          text: 先生，我可以睡在您旁边吗？那样我就不会觉得孤单得那么可怕了。
        - id: ch02-b38
          speaker: narrator
          text: >-
            菲利普和马克斯一起蜷在甲板上，身上暖暖地盖着备用的万国旗帜。鹦鹉所说的那个小盹儿，最后足足睡了舒舒服服的一整夜那么久，其实大约有十个小时。于是，十小时的等待轻轻松松便过去了。可他们醒来以后还得继续等，那一段等待就没这么容易熬了。
        - id: ch02-b39
          speaker: narrator
          text: >-
            再说露西。水桶一离开甲板，在半空摇荡，她差点叫出声来。布伦达倒真的叫了，可露西把叫声捂进裙褶里。她咬住嘴唇，拼命鼓起勇气，还装作十分舒服，喊出了水桶像秋千那句话。那句话说得很勇敢，也帮她继续勇敢下去。
        - id: ch02-b40
          speaker: narrator
          text: >-
            水桶越升越高，穿过银色穹顶，进入黑暗的竖井。顶上的确是日光，绳索正把她拉向那片光亮。可要是绳子断了呢？布伦达这时一动不动，后来还说自己一定昏过去了。
        - id: ch02-b41
          speaker: narrator
          text: >-
            光越来越近，最后把露西整个包围。水桶已经一直升到井口，几只手从外面伸来，要把它拖过看起来像井栏的边缘。就在那一瞬间，露西猛然想到，万一那些手的主人看见她们以后大吃一惊，同时松开水桶和辘轳，会发生什么？她一把抱起布伦达，把小狗用力扔到干地上，自己也纵身扑上井栏。幸亏正是时候。一阵惊呼随即响起，水桶撞着井壁，叮叮当当地掉了下去。那些手果真松开了。
        - id: ch02-b42
          speaker: narrator
          text: >-
            露西慢慢爬过井栏，双脚终于踩上实地。那几只手又在转动辘轳，把水桶轻轻松松地收上来。
        - id: ch02-b43
          speaker: lucy
          text: 别往上拉！让水桶一直降到底，下面还有人呢。
        - id: ch02-b44
          speaker: water_drawer
          text: >-
            对不起，那不合规矩。水桶每天只能下这口井四十次。刚才正好是第四十次。
        - id: ch02-b45
          speaker: narrator
          text: >-
            他们把水桶拉上来，砰地关紧井盖。一个人挂上锁，把钥匙收进口袋，然后和露西面对面站着。他个子矮小，脑袋圆圆，穿着一件奇怪的硬挺红短褂。不知怎么，那人的整个轮廓，还有那件短褂，都让露西觉得眼熟，可她怎么也想不起究竟像什么。后面还站着两个同样圆头、同样穿红短褂的人。
        - id: ch02-b46
          speaker: narrator
          text: 布伦达蹲在露西脚边，轻声呜咽。露西等着陌生人说话。
        - id: ch02-b47
          speaker: red_leader
          text: >-
            你不该那样突然冒出来，真把我们吓坏了。以后只要想起来，我们夜里就会睡不着。
        - id: ch02-b48
          speaker: lucy
          text: 对不起。
        - id: ch02-b49
          speaker: red_leader
          text: 到陌生的城市，总该从正门进来。请你记住。晚安。
        - id: ch02-b50
          speaker: lucy
          text: >-
            你们不能就这么走。让我写一张字条，丢给下面的人。你们有没有一小截铅笔和一张纸？
        - id: ch02-b51
          speaker: water_drawer
          text: 没有。
        - id: ch02-b52
          speaker: lucy
          text: 那有没有别的东西，可以让我写字？
        - id: ch02-b53
          speaker: water_drawer
          text: 这里只有菠萝。
        - id: ch02-b54
          speaker: narrator
          text: >-
            附近的岩石间长着成百上千只菠萝。露西从中割下一只，用自己的小折刀，在菠萝侧面刻下一个大大的“等”字。
        - id: ch02-b55
          speaker: lucy
          text: 现在，把井盖打开。
        - id: ch02-b56
          speaker: red_leader
          text: 那会要我们的命。
        - id: ch02-b57
          speaker: lucy
          text: >-
            才不会。法律没说不许把菠萝扔进井里，你们明明知道。扔菠萝和打水不是一回事。你们要是不肯，我就叫小狗扑上去咬你们。它可凶了。
        - id: ch02-b58
          speaker: narrator
          text: 布伦达受宠若惊，立刻龇出牙齿，低声咆哮。
        - id: ch02-b59
          speaker: red_leader
          text: 那好吧。只要别惹麻烦，怎么都行。
        - id: ch02-b60
          speaker: narrator
          text: >-
            菠萝丢下去，井盖再次锁好。看着四周遍地的菠萝，露西已经猜到自己大概来到了瞌睡国。
    - id: ch03
      title: 哈尔玛之名
      blocks:
        - id: ch03-b01
          speaker: lucy
          text: 这里是什么国家？
        - id: ch03-b02
          speaker: red_leader
          text: 瞌睡国。
        - id: ch03-b03
          speaker: lucy
          text: >-
            那我告诉你们一件事。下次打水时，解救者会从这口井里上来。他会把你们从大懒兽的奴役下救出去。
        - id: ch03-b04
          speaker: red_leader
          text: >-
            我们的确是奴隶。每当我们想睡觉，大懒兽都逼我们唱合唱曲，叫我们疲惫不堪。可是没人能救我们。没有希望，世上只有睡觉是好事，我们却永远睡不够。
          emotion: sad
        - id: ch03-b05
          speaker: lucy
          text: 哎呀，这里就没有女人吗？她们总比男人更有办法。
        - id: ch03-b06
          speaker: red_leader
          text: >-
            这话既无礼，也不真实。不过，为了免去麻烦，我们可以领你和这条恶犬去女人的小屋。然后，你总肯让我们睡觉了吧。
        - id: ch03-b07
          speaker: narrator
          text: >-
            那些小屋又破又寒酸，只是用篱笆围在古城废墟里的一个个小角落。从前，这里有一座宏伟而美丽的城市，到处是花园，也有溪流穿过。如今溪水全都干了，花园里除了杂草和菠萝，什么也不长。
        - id: ch03-b08
          speaker: narrator
          text: >-
            女人们穿着和男人一样硬挺的短褂，不过全是绿色。她们没有丈夫们那么困，送来新鲜菠萝给露西吃，还带着恍恍惚惚的兴趣，打量她衣服的剪裁，看布伦达表演讨食物的本领。露西从她们那里知道了瞌睡国的好几件事。这里人人都穿同样式样的衣服，只用颜色区分身份。女人穿绿衣，打水人穿红衣，大懒兽的侍从穿黑衣，采菠萝的人穿黄衣。
        - id: ch03-b09
          speaker: narrator
          text: >-
            露西坐在小屋门口，看着四种颜色的人懒洋洋地走过废墟。忽然，她明白这些人像什么了。
        - id: ch03-b10
          speaker: lucy
          text: 我知道了！你们都是哈尔玛棋子！
          emotion: surprised
        - id: ch03-b11
          speaker: narrator
          text: 所有听见这句话的男人都急忙逃走。女人们压低声音警告她。
        - id: ch03-b12
          speakers: [somnolentian_woman, woman_2, woman_3]
          ensemble: chorus
          text: 嘘！说出那个名字，会没命的。
          emotion: fearful
        - id: ch03-b13
          speaker: lucy
          text: 为什么？
        - id: ch03-b14
          speaker: somnolentian_woman
          text: >-
            哈尔玛是我们民族伟大的统帅。大懒兽怕我们听见他的名字，会重新振作，挣脱奴役，再次成为自由的人。
        - id: ch03-b15
          speaker: narrator
          text: >-
            露西当场打定主意，从今以后一定要让这些人常常听见哈尔玛这个名字。可是，她还没来得及再说一遍，身边的女人已经深深叹了口气。
        - id: ch03-b16
          speaker: somnolentian_woman
          text: 大懒兽睡着了。
        - id: ch03-b17
          speaker: narrator
          text: >-
            话刚说完，女人就趴在正在削的菠萝上，当场睡去。深沉的寂静笼罩整座城市。下一刻，露西也睡着了，一连睡了好几个小时。
        - id: ch03-b18
          speaker: narrator
          text: >-
            几小时以后，露西终于醒来。她花了好些时间才找到保管挂锁钥匙的人，可那人无论如何也不肯使用钥匙。什么话都打动不了他，连威胁说布伦达十分凶猛也没有用。露西几乎绝望时，忽然想起一个有力量的名字。
        - id: ch03-b19
          speaker: lucy
          text: 把井盖打开，放下水桶！我以伟大的哈尔玛之名命令你。
        - id: ch03-b20
          speaker: key_keeper
          text: 那个名字说出口，会没命的。
          emotion: fearful
        - id: ch03-b21
          speaker: lucy
          text: >-
            说出这个名字，才会有生路。哈尔玛！哈尔玛！哈尔玛！你不打开井盖，我就把这个名字刻在一只菠萝上，放进大懒兽的晚餐，用金盘给它送去。
        - id: ch03-b22
          speaker: key_keeper
          text: 那会害死几百个人！
          emotion: fearful
        - id: ch03-b23
          speaker: lucy
          text: 那你就把井打开。
        - id: ch03-b24
          speaker: narrator
          text: >-
            这道命令终于有了用。井盖打开，水桶被放下去。菲利普和马克斯坐进桶里，平安回到地面。伙伴们一到齐，立刻围在一起商量，露西把自己在这座城里看见、听见的一切都说了出来。
        - id: ch03-b25
          speaker: lucy
          text: >-
            不管要做什么，我们都得快。大懒兽很危险，我敢肯定。它已经叫人传话，要我去它面前，在它睡觉时唱歌。它知道我不是解救者，所以根本不防备我。你们要肯照我说的做，我相信能把事情安排好。可是，它一旦知道菲利普也在这里，事情就难多了。
        - id: ch03-b26
          speaker: narrator
          text: 堕落的哈尔玛棋子站在远处，三三两两聚在一起，悄声议论他们。
        - id: ch03-b27
          speaker: lucy
          text: >-
            我去给大懒兽唱歌。你们到处走，逢人就说出那个有力量的名字，再告诉他们，菲利普就是解救者。要是我的办法不成功，咱们就靠人多制服大懒兽，然后……总之，你们不停地喊“哈尔玛”，明白吗？
        - id: ch03-b28
          speaker: philip
          text: 危险的事让你一个人做？想得美！
        - id: ch03-b29
          speaker: lucy
          text: 不危险。大懒兽从来不会伤害给它唱歌的人，从来不会。我要走了。
        - id: ch03-b30
          speaker: narrator
          text: 菲利普还没拦住她，她已经走远。
        - id: ch03-b31
          speaker: polly
          text: 让她去吧。她是个聪明的孩子。
    - id: ch04
      title: 大懒兽的愿望
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            大懒兽的神殿完全由金子建成。里面有美丽的柱子、门洞、窗户，还有一重套一重、一直通向深处的庭院，每一座院子都铺着金石板。在所有建筑的最中央，有一间很大的屋子，里面从这头到那头，完完全全就是一张羽毛床。大懒兽就在那儿度过毫无用处的一生，不是吃东西，就是睡觉，再不然便躺着听音乐。
        - id: ch04-b02
          speaker: narrator
          text: >-
            露西停在通往内室的摩尔式拱门外，唱了起来。她的童声清清亮亮，先唱《骑手去赶集》，又唱《一天清早》，然后忽然停住。
        - id: ch04-b03
          speaker: narrator
          text: 屋子里传来一个满是睡意、含混黏腻的大嗓门。
        - id: ch04-b04
          speaker: great_sloth
          text: 你唱的歌品味太差了。难道你不会唱催人睡觉的歌吗？
        - id: ch04-b05
          speaker: lucy
          text: >-
            你的臣民会唱催眠曲。真可惜，他们不能从早到晚一直唱给你听。
        - id: ch04-b06
          speaker: narrator
          text: >-
            大懒兽先夸露西天性真会体谅人，随后才从房间里走出来，靠在门边的柱子上，睡眼惺忪却颇有兴味地看着她。它的身躯庞大得吓人，足有一头小象那么大，像大猩猩一样用两条后腿直立行走，而且从头到脚都黑得不得了。
        - id: ch04-b07
          speaker: great_sloth
          text: >-
            的确可惜。可他们说，不喝水就活不了，所以总把时间浪费在井里打水。
        - id: ch04-b08
          speaker: lucy
          text: >-
            要是有一台机器替他们打水，该多好呀。这样一来，他们就能整天唱歌给你听了。只要他们愿意。
        - id: ch04-b09
          speaker: great_sloth
          text: 只要我愿意。我困了。走开！
        - id: ch04-b10
          speaker: narrator
          text: 大懒兽打了一个河马般的大哈欠。
        - id: ch04-b11
          speaker: lucy
          text: 不。
        - id: ch04-b12
          speaker: narrator
          text: >-
            大懒兽已经太久没有听见过“不”字。这一声带来的震惊，几乎把它的睡意全赶跑了。
        - id: ch04-b13
          speaker: great_sloth
          text: 你刚才说什么？
          emotion: surprised
        - id: ch04-b14
          speaker: narrator
          text: 它简直不敢相信自己的大耳朵。
        - id: ch04-b15
          speaker: lucy
          text: >-
            我说“不”。我的意思是，你这么伟大，这么了不起，只要想要什么，就一定能得到什么。
        - id: ch04-b16
          speaker: great_sloth
          text: 真是这样吗？
        - id: ch04-b17
          speaker: narrator
          text: 它懒洋洋地拖着美国人的口音问道。
        - id: ch04-b18
          speaker: lucy
          text: >-
            当然。你只要说：“我希望自己有一台机器，每天打八小时的水。”一天工作八小时正合适，我爸爸说过。
        - id: ch04-b19
          speaker: great_sloth
          text: 从头再说一遍，慢一点。我刚才没听清楚。
        - id: ch04-b20
          speaker: narrator
          text: 露西把整句话重复了一遍。
        - id: ch04-b21
          speaker: great_sloth
          text: 要是只有这么点事……现在再说一次，要说得非常非常慢。
        - id: ch04-b22
          speaker: narrator
          text: 露西照办。大懒兽跟着她，一个字一个字地重复。
        - id: ch04-b23
          speaker: great_sloth
          text: 我希望自己有一台机器，每天打八小时的水。
        - id: ch04-b24
          speaker: great_sloth
          text: >-
            不许推！我说，不许！你挤什么？你是谁？你跑到我的房间里干什么？出来！
          emotion: angry
        - id: ch04-b25
          speaker: narrator
          text: >-
            真有东西从屋里挤了出来，还把大懒兽推离门口。出来的是整张巨大的羽毛床，翻卷成一团团庞大的褶皱、隆起和鼓包。后面有个又大又有力的东西推着它，力气竟比大懒兽本身还大。羽毛床和那东西一起，把大懒兽这座懒散的兽肉山一直推过半个内院。面对不断逼近的庞然大物，还有大懒兽冲天的怒火，露西只得一步步向后退去。
        - id: ch04-b26
          speaker: great_sloth
          text: >-
            竟敢把我推出自己的羽毛卧房！不管里面是什么东西，等我抓到它瞧瞧！
          emotion: angry
        - id: ch04-b27
          speaker: narrator
          text: >-
            这时，它的睡意几乎全没了。整张羽毛床已经被推出庭院。大懒兽慢慢爬过床垫，回到屋里，要找出是谁胆敢冒犯它懒惰的至尊。
        - id: ch04-b28
          speaker: narrator
          text: >-
            露西屏住呼吸，心里又盼望，又害怕。大懒兽跌跌撞撞地进了内室，再也没有出来。片刻寂静以后，里面响起吱吱嘎嘎的声音。
        - id: ch04-b29
          speaker: great_sloth
          text: 不，不，不！我不干。放开我，听见没有？
          emotion: angry
        - id: ch04-b30
          speaker: narrator
          text: 又一阵吱嘎声传出来，还夹着金属撞击金属的声响。露西悄悄走到拱门边，探头朝里看。
        - id: ch04-b31
          speaker: narrator
          text: >-
            刚才还从地面到屋顶都塞满羽毛床的房间，现在到处都是轮子、齿轮、皮带、螺丝和铁杆。原来，一台庞大而复杂的机器已经塞满了整间屋。而那台机器的手柄正在不停转动。牢牢握着手柄、不得不亲自出力的，正是大懒兽自己。
        - id: ch04-b32
          speaker: great_sloth
          text: 放开我！我不干活！
          emotion: angry
        - id: ch04-b33
          speaker: narrator
          text: 大懒兽说着，咬得两排大牙咯咯作响。机器深处传来咕噜咕噜的说话声。
        - id: ch04-b34
          speaker: machine
          text: >-
            你必须干活。是你许愿把我叫来的，现在每天都得让我运转八小时。这就是规矩。
        - id: ch04-b35
          speaker: great_sloth
          text: 我要砸烂你！
          emotion: angry
        - id: ch04-b36
          speaker: machine
          text: 我砸不坏。
        - id: ch04-b37
          speaker: narrator
          text: 机器的声音温和，却带着一丝自豪。
        - id: ch04-b38
          speaker: great_sloth
          text: 都是你干的！等我抓到你瞧瞧！
          emotion: angry
        - id: ch04-b39
          speaker: narrator
          text: >-
            大懒兽愤怒地盯着门口的露西，可手里始终不能停止转动那只手柄。
        - id: ch04-b40
          speaker: lucy
          text: 谢谢。不过，我想我还是不等了。再说，我会比你早走整整八小时。
        - id: ch04-b41
          speaker: narrator
          text: >-
            就在她说话的时候，一股清亮的水已经从抽水机里涌了出来。水流顺着神殿的金色台阶一路淌下，又穿过一重重金色庭院。露西转身跑出神殿，一直冲进城市废墟中的广场，面对那些昏昏欲睡的人高声呼喊。
        - id: ch04-b42
          speaker: lucy
          text: 哈尔玛！哈尔玛！哈尔玛！哈尔玛的棋子，全到我这里来！
        - id: ch04-b43
          speaker: narrator
          text: >-
            男人们从废墟四周围拢过来，很快聚成一大群。他们早已被菲利普鼓动起来。露西走进金色神殿以后，菲利普一直在城里四处奔走，把那个有力量的名字告诉遇见的每个人，一刻也没有停止呼喊。
        - id: ch04-b44
          speaker: lucy
          text: >-
            快！大懒兽正在替你们抽水。以后，它每天都得抽八小时。快挖水渠，让水流进去。解救者已经把你们的河流还给你们了！
        - id: ch04-b45
          speaker: narrator
          text: >-
            说到解救者时，她伸手指向菲利普。有些人立刻跑进废墟，翻找出那些生锈已久、几乎被所有人忘掉的铁锹和十字镐。另一些人仍站在原地，迟迟不敢动手，最后犹豫地说出了心中的担忧。
        - id: ch04-b46
          speakers: [halma_man_1, halma_man_2]
          ensemble: duo
          text: 大懒兽只干八小时。之后它恢复自由，就会回来向我们报仇。
          emotion: fearful
        - id: ch04-b47
          speaker: lucy
          text: >-
            我回去告诉它，要是不肯乖乖听话，你们就全都许愿要机关枪。它已经知道了，人只要许愿得到机器，就得亲自使用。它每天要清醒八小时，你们也每天干八小时，很快就能让城市恢复从前的气派。
        - id: ch04-b48
          speaker: lucy
          text: >-
            还有一条新法律。每次钟声响起，你们所有人都要高喊“哈尔玛”。这样，你们就不会忘记自己命中注定要成就大事，也不会忘记自己再也不是大懒兽的奴隶。
        - id: ch04-b49
          speaker: narrator
          text: >-
            露西说到做到，重新走进神殿，把机关枪是什么、会做什么，仔仔细细讲给已经辛苦干起活来的大懒兽听。等她再次回到广场，所有男人都拿着工具忙碌起来，正在为新河挖掘水渠。女人和孩子们则满怀好奇地拥上前，把露西与菲利普团团围住。
        - id: ch04-b50
          speaker: oldest_woman
          text: >-
            啊，现在我们终于能用水洗东西了。我听祖母说过，用水洗东西可舒服了。我从没想到，自己活着还能用水洗上一回。
          emotion: happy
        - id: ch04-b51
          speaker: lucy
          text: 为什么？你们平常用什么洗？
        - id: ch04-b52
          speakers: [oldest_woman, woman_2, woman_3]
          ensemble: chorus
          text: 菠萝汁。要是我们真的洗的话！
        - id: ch04-b53
          speaker: lucy
          text: 那一定黏得厉害。
        - id: ch04-b54
          speaker: oldest_woman
          text: 是啊，厉害极了！
