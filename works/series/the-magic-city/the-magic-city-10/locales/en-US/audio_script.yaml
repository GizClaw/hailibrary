  chapters:
    - id: ch01
      title: CHAPTER X. THE GREAT SLOTH
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Perhaps you have sailed a toy boat on a stream. You build a little clay dam, wait for the water to rise, then break away one piece and make a waterfall. The boat drifts slowly at first. At the edge it hesitates, then rushes faster and faster. Sometimes it tips over. Sometimes it strains, trembles, and sways from side to side before it rights itself and races downstream, only to catch in the rushes at the next bend. That was what happened to the good yacht Lightning Loose.
        - id: ch01-b02
          speaker: narrator
          text: >-
            She shot over the dark, smooth underground fall and hung for one long, breathless moment between still air and plunging water. Then she flashed down the slope, struck the lower stream with a crash, shuddered, and reeled. At last she came upright and sped on through the dark. It was rather like racing down a water chute.
        - id: ch01-b03
          speaker: philip
          text: >-
            It's all right. I think it is. She's still going.
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: >-
            Philip's whisper shook. Lucy held his arm very tightly.
        - id: ch01-b05
          speaker: lucy
          text: >-
            Yes. Yes, I'm sure she's all right.
          emotion: fearful
        - id: ch01-b06
          speaker: brenda
          text: >-
            Are we drowned? Oh, Max, have we truly drowned?
          emotion: fearful
        - id: ch01-b07
          speaker: max
          text: >-
            I do not think so. And if we have, my dear, screaming will not make us undrowned.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The shock had silenced the parrot for a moment. That showed how dreadful the fall had been, because an ordinary little surprise is never enough to leave a parrot without something to say.
        - id: ch01-b09
          speaker: parrot
          text: >-
            Far from it. We may as well behave ourselves.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The lamps, at least, had behaved beautifully. They shone through the wild rush of air as the yacht fell. They kept shining when she struck the lower stream in a great burst of spray, and afterward their light looked as steady as if nothing had happened.
        - id: ch01-b11
          speaker: parrot
          text: >-
            An example for every one of us.
        - id: ch01-b12
          speaker: lucy
          text: >-
            But what can we do now?
        - id: ch01-b13
          speaker: parrot
          text: >-
            When an adventure turns in a direction nobody expected, one does whatever one can.
        - id: ch01-b14
          speaker: lucy
          text: >-
            And what can we do?
        - id: ch01-b15
          speaker: parrot
          text: >-
            Nothing. Philip has taken the helm from Max and is steering straight between the banks, if those can be called banks. There is nothing else.
        - id: ch01-b16
          speaker: narrator
          text: >-
            There plainly was not. Lightning Loose raced through the darkness between the cavern walls. After thinking for a moment, Lucy went to make cocoa. That was real courage. The familiar work steadied her, and the soft, sweet, ordinary drink cheered everyone, even Lucy herself. While she measured it, stirred it, and carried it around, it was almost impossible to believe that anything dreadful could happen.
        - id: ch01-b17
          speaker: philip
          text: >-
            I've been thinking about all this. The underground river and waterfall came out of a book. Someone must have let the story loose, and I know which book it is. If the entire story escaped, we should be safe. We will sail underground for ages, but in the end we will climb out again, only three days' journey from Trieste.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Lucy brought him a cup at the wheel.
        - id: ch01-b19
          speaker: lucy
          text: >-
            I see. I hate geography. Drink that before it gets cold. What book was it?
        - id: ch01-b20
          speaker: philip
          text: >-
            It was The Last Cruise of the Teal. Helen gave it to me just before she left, and it is a splendid story. I remember it perfectly because I used the book for the roof over the outer court of the Hall of Justice. The men aboard the Teal made torches from paper soaked in paraffin.
        - id: ch01-b21
          speaker: lucy
          text: >-
            We have no paraffin, and our lamps are good enough. Oh, Brenda is crying again. She has no courage at all.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Lucy hurried to the cabin. Max was offering Brenda one sensible comfort after another, but Brenda ignored them all.
        - id: ch01-b23
          speaker: brenda
          text: >-
            I knew something like this would happen. I warned everyone from the very beginning, but nobody listened. I wish we had never come. I want to go home! What a dreadful thing to happen to innocent little dogs!
          emotion: sad
        - id: ch01-b24
          speaker: lucy
          text: >-
            Brenda, stop whining, or you won't get any cocoa.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Brenda stopped at once and wagged her tail hopefully.
        - id: ch01-b26
          speaker: brenda
          text: >-
            Cocoa? Did somebody mention cocoa? My nerves are terribly delicate. I know I am a dreadful trial to everyone, dear Max. There is no use pretending I am not. Still, nothing is quite as good as cocoa for the nerves. Plenty of sugar, please, dear Lucy. Thank you so much. Yes, that is exactly the way I like it.
        - id: ch01-b27
          speaker: lucy
          text: >-
            There will be food later. Anyone who whines will get none.
        - id: ch01-b28
          speaker: brenda
          text: >-
            Why, nobody here would ever dream of whining. I may be too sensitive, but you can do absolutely anything with a dear little dog if you use kindness. And as for whining, that is one fault I have never had, not even as a puppy. Max will tell you the same.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Max did not support Brenda's claim, but he did not contradict her either. He said nothing at all. He only fixed his beautiful eyes hopefully on the cocoa jug and waited. All the while, the yacht sped along the underground stream beneath the vast arch of the cavern.
        - id: ch01-b30
          speaker: philip
          text: >-
            We may be traveling farther and farther from the place we meant to reach.
        - id: ch01-b31
          speaker: parrot
          text: >-
            Every road leads to Somnolentia. Besides, the compass says we are sailing due north, and so far I have no reason to doubt it.
        - id: ch01-b32
          speakers: [philip, lucy]
          ensemble: duo
          text: >-
            Look!
        - id: ch01-b33
          speaker: narrator
          text: >-
            The yacht burst from the dark cavern onto a wide pool beneath a white dome. The stream crossed one side of the water. With the parrot directing him, Max steered into the smooth center, and at last the yacht rested on the great underground lake.
        - id: ch01-b34
          speaker: philip
          text: >-
            This part was not in The Last Cruise of the Teal. Someone must have closed that book.
        - id: ch01-b35
          speaker: lucy
          text: >-
            I think this came from a book about Mexico, or Peru, or Ingots, or some other place in geography. The book had a green-and-gold cover. I think you used it for the roof at the other end of the outer court. If you did, this dome is solid silver. There should be a hole in the top, and beneath the dome there should be untold treasure in gold incas.
        - id: ch01-b36
          speaker: philip
          text: >-
            What are incas?
        - id: ch01-b37
          speaker: lucy
          text: >-
            I believe incas are gold bars. Mexicans come down through the hole in the roof to collect them. When enemies arrive, they fill the whole treasure vault with water. And as you can see, somebody has flooded it now.
        - id: ch01-b38
          speaker: brenda
          text: >-
            I wish nobody had ever invented adventures. No, dear Lucy, this is not whining. Far from it. But surely a dear little dog may offer one sensible suggestion. Wouldn't every one of us be much better off in a comfortable home than floating beneath the earth?
        - id: ch01-b39
          speaker: narrator
          text: >-
            Now they all saw a round dark hole at the center of the shining dome. As they watched, it filled with light. A brilliant white disk appeared above them, as large and bright as a moon. It was daylight.
        - id: ch01-b40
          speaker: lucy
          text: >-
            Someone opened the trapdoor. The Ingots always put trapdoors over their treasure vaults.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Confused shapes crossed the bright opening and broke up its round white light. Then a small black circle appeared in the center. It grew larger and larger as it came slowly and steadily down. First it reached the level of the dome, then hung below it, then passed their eager eyes and splashed beside the yacht. It was a large empty bucket. Someone above jerked the rope, so the bucket dipped under the surface and filled. Then it rose just as slowly until it disappeared through the hole.
        - id: ch01-b42
          speaker: parrot
          text: >-
            Quickly! Put the yacht beneath that hole. When the bucket returns, you can ride up in it.
        - id: ch01-b43
          speaker: lucy
          text: >-
            This seems more like the Arabian Nights. But who keeps opening all these books? Somebody must be taking Polistopolis apart.
        - id: ch01-b44
          speaker: philip
          text: >-
            Probably the Pretenderette. She is not the Deliverer, so she must be the Destroyer. No one else can enter Polistarchia.
        - id: ch01-b45
          speaker: lucy
          text: >-
            I can.
        - id: ch01-b46
          speaker: philip
          text: >-
            Oh. You're a Deliverer too.
        - id: ch01-b47
          speaker: lucy
          text: >-
            Thank you. But Helen can enter too.
        - id: ch01-b48
          speaker: philip
          text: >-
            Helen only reached the Island. She could not enter Polistarchia. Look out!
        - id: ch01-b49
          speaker: narrator
          text: >-
            The bucket came down again. This time it bumped onto the deck.
        - id: ch01-b50
          speaker: philip
          text: >-
            Lucy, you should go first.
        - id: ch01-b51
          speaker: max
          text: >-
            And you should go first, Brenda.
        - id: ch01-b52
          speaker: philip
          text: >-
            Or I can go first, if you want.
        - id: ch01-b53
          speaker: max
          text: >-
            Yes, Brenda. I can go first too, if you prefer.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Philip wanted Lucy to have the first chance to escape from the poor yacht. Yet he could not be sure what she would escape into. If danger waited above, then of course he ought to face it first. Worthy Max felt exactly the same about Brenda, and Lucy felt the same as both of them. No one knew what Brenda felt. She only gave a little whine.
        - id: ch01-b55
          speaker: narrator
          text: >-
            For a moment Lucy and Philip each held one side of the bucket. The dogs watched them, and the parrot looked from face to face. Then the rope jerked impatiently. There was no time left.
        - id: ch01-b56
          speaker: narrator
          text: >-
            At that very moment, Lucy decided that riding up was more dangerous than staying on the yacht. Philip decided just the opposite. Staying below seemed more dangerous to him, so when Lucy stepped into the bucket, he helped her eagerly. Max reached the same conclusion as Philip, and it seems Brenda did too. She sprang into Lucy's lap and curled her long body around the girl. The rope tightened and the bucket began to rise. Brenda gave one faint scream, which Lucy quickly smothered.
        - id: ch01-b57
          speaker: lucy
          text: >-
            I'll send the bucket straight back down! Oh, this is rather fun. It feels like a swing!
        - id: ch01-b58
          speaker: narrator
          text: >-
            Lucy disappeared into the opening. Confused voices echoed down the shaft, but those on the yacht could not understand a word. They stood staring upward and waited for the bucket.
        - id: ch01-b59
          speaker: philip
          text: >-
            I hate abandoning the ship.
        - id: ch01-b60
          speaker: parrot
          text: >-
            You may leave her last. Unless Max climbs into the bucket first and you have to sit on him.
        - id: ch01-b61
          speaker: philip
          text: >-
            What will you do?
        - id: ch01-b62
          speaker: narrator
          text: >-
            The parrot unfolded half a bright wing with a slightly proud air.
        - id: ch01-b63
          speaker: philip
          text: >-
            Oh, of course! You could have flown away whenever you liked, but you stayed with us. That was awfully decent of you.
        - id: ch01-b64
          speaker: parrot
          text: >-
            Not at all.
        - id: ch01-b65
          speaker: philip
          text: >-
            It was. You could have flown away. Wait, look!
        - id: ch01-b66
          speaker: narrator
          text: >-
            The bucket suddenly plunged down at a terrible speed. They held their breath and stared, expecting to see Lucy tumbling through the air with it. But no, the bucket was empty. It swung loose for one moment in the middle of the shaft, then someone hastily hauled it back up. A hollow metal crash rang through the cavern.
        - id: ch01-b67
          speaker: max
          text: >-
            Brenda!
          emotion: fearful
        - id: ch01-b68
          speaker: parrot
          text: >-
            My wings and claws!
          emotion: surprised
        - id: ch01-b69
          speaker: philip
          text: >-
            Oh, bother!
          emotion: fearful
        - id: ch01-b70
          speaker: narrator
          text: >-
            The white opening overhead had suddenly vanished. Someone above had slammed the lid shut. All three anxious, manly hearts were still below in the cavern. Brave Lucy and helpless Brenda were above them in a strange country, facing dangers that Philip, Max, and the parrot could only imagine.
        - id: ch01-b71
          speaker: philip
          text: >-
            I wish I had gone. I do wish I'd gone.
          emotion: sad
        - id: ch01-b72
          speaker: max
          text: >-
            So do I.
          emotion: sad
        - id: ch01-b73
          speaker: parrot
          text: >-
            I feel faint. Perhaps someone might make cocoa.
        - id: ch01-b74
          speaker: narrator
          text: >-
            The excellent bird was trying to keep their minds busy in that first moment of disaster, and the captain and crew were saved from despair. Before the kettle had even boiled, the lid above opened about a foot. Something rather large, round, and lumpy dropped heavily through the gap and bounced on the deck of Lightning Loose.
        - id: ch01-b75
          speaker: narrator
          text: >-
            It was a fresh, ripe pineapple. One word had been carved roughly into its side. It said, “WAIT.”
        - id: ch01-b76
          speaker: narrator
          text: >-
            It was good advice, so they followed it. In truth, they could hardly have done anything else. They cut up the ripe pineapple and ate it while they waited. Before long, a deep sleepiness began to creep over every one of them.
        - id: ch01-b77
          speaker: parrot
          text: >-
            Waiting can be done just as well asleep as awake, perhaps better. Forty winks will do us good.
        - id: ch01-b78
          speaker: narrator
          text: >-
            The parrot tucked his head beneath his wing on the binnacle.
        - id: ch01-b79
          speaker: max
          text: >-
            May I sleep beside you, sir? Then I shall not feel the dreadful loneliness quite so much.
        - id: ch01-b80
          speaker: narrator
          text: >-
            Philip and Max curled up together on the deck. They covered themselves warmly with the yacht's spare flags from every nation. Their forty winks lasted as long as a good night's rest, about ten hours in all. In that way, ten hours of waiting passed without any trouble. But there was still more waiting after they woke, and those waking hours were not nearly so easy.
        - id: ch01-b81
          speaker: narrator
          text: >-
            Meanwhile, Lucy sat in the rising bucket with Brenda in her lap. When it swung free of the yacht, she could barely keep from screaming. Brenda did scream, but Lucy buried the sound in the folds of her dress.
        - id: ch01-b82
          speaker: narrator
          text: >-
            Lucy bit her lip, made a great effort, and called down that the bucket felt like a swing. She forced her voice to sound as though she were perfectly comfortable. Saying it took real courage, but pretending to be brave helped her go on feeling brave as the bucket climbed.
        - id: ch01-b83
          speaker: narrator
          text: >-
            The bucket climbed higher and higher. It passed out of the silver dome and entered the dark shaft above. Lucy looked up and saw that the gleam at the top truly was daylight. The rope kept drawing her toward it. But what if the rope broke? Brenda had gone completely silent by then. Later, she said she must have fainted.
        - id: ch01-b84
          speaker: narrator
          text: >-
            The light came nearer and nearer until Lucy rose right into it. Hands reached out and began pulling the bucket over the stone side of what looked like a well. In one flash, Lucy understood what might happen. The people might be so surprised by their passengers that they would release both bucket and windlass. She grabbed Brenda and threw her onto dry ground, then flung her own body across the stone rim. She was just in time. A shout went up, the hands let go, and the bucket fell away, clanging against the sides of the well.
        - id: ch01-b85
          speaker: narrator
          text: >-
            Lucy climbed slowly over the rim. Once her feet were firm, she saw the strangers winding up the empty bucket with ease.
        - id: ch01-b86
          speaker: lucy
          text: >-
            Please don't pull it up! Send it all the way down. More people are waiting below.
        - id: ch01-b87
          speaker: red_leader
          text: >-
            Sorry. The rules forbid it. This bucket goes down exactly forty times each day, and that was number forty.
        - id: ch01-b88
          speaker: narrator
          text: >-
            They hauled in the empty bucket, slammed the heavy well lid, and fastened it with a padlock. Lucy stood face to face with the man who pocketed the key. He was small and round-headed, dressed in a strange, stiff red tunic. Something about the shape of both the man and his clothing reminded Lucy of a familiar object, but she could not remember what it was. Two more round-headed men in red stood behind him.
        - id: ch01-b89
          speaker: narrator
          text: >-
            Brenda crouched at Lucy's feet and whined softly. Lucy waited for the strangers to speak.
        - id: ch01-b90
          speaker: red_leader
          text: >-
            You really should not have done that. Bobbing out of our well without warning gave all three of us a terrible shock. Merely remembering the sight of you will probably keep us awake tonight, and we dislike being kept awake.
        - id: ch01-b91
          speaker: lucy
          text: >-
            I'm sorry.
        - id: ch01-b92
          speaker: red_leader
          text: >-
            When you visit a strange town, you should always enter through the front gate. That is what front gates are for. Please try to remember the rule next time. And now, good night.
        - id: ch01-b93
          speaker: lucy
          text: >-
            You cannot leave yet. I need to write a message and drop it to my friends. Have you any paper or a pencil?
        - id: ch01-b94
          speaker: red_leader
          text: >-
            No, we have neither one.
        - id: ch01-b95
          speaker: lucy
          text: >-
            Is there anything here that I can write on?
        - id: ch01-b96
          speaker: water_drawer
          text: >-
            Nothing but pineapples.
        - id: ch01-b97
          speaker: narrator
          text: >-
            Hundreds of pineapples grew among the rocks nearby. Since there was no paper, Lucy cut down one of the fruits. She took out her penknife and carved the word “WAIT” in large, uneven letters across its side.
        - id: ch01-b98
          speaker: lucy
          text: >-
            Now open the well.
        - id: ch01-b99
          speaker: red_leader
          text: >-
            Opening it could cost us our lives.
          emotion: fearful
        - id: ch01-b100
          speaker: lucy
          text: >-
            No, it could not. There is no rule against dropping a pineapple down a well. That is not the same as drawing water. If you refuse, I shall set my little dog on you. She is very fierce.
        - id: ch01-b101
          speaker: narrator
          text: >-
            Brenda was so flattered that she bared her teeth and growled.
        - id: ch01-b102
          speaker: red_leader
          text: >-
            Very well. Anything to prevent a fuss.
        - id: ch01-b103
          speaker: narrator
          text: >-
            They dropped the pineapple and locked the lid again.
        - id: ch01-b104
          speaker: lucy
          text: >-
            What country is this?
        - id: ch01-b105
          speaker: narrator
          text: >-
            The pineapples had already made her almost certain of the answer.
        - id: ch01-b106
          speakers: [red_leader, water_drawer]
          ensemble: duo
          text: >-
            Somnolentia.
        - id: ch01-b107
          speaker: lucy
          text: >-
            Then listen. The Deliverer will come up that well the next time you draw water. He is coming to free you from the Great Sloth.
        - id: ch01-b108
          speaker: red_leader
          text: >-
            It is true that we live in bondage. The Great Sloth tires us out by making us sing one choral song after another when all we want is sleep. But no Deliverer can free us. There is no hope left. Nothing is good except sleep, and we are never allowed nearly enough of it.
          emotion: sad
        - id: ch01-b109
          speaker: lucy
          text: >-
            Oh dear. Are there no women here? Women usually have more sense than men.
        - id: ch01-b110
          speaker: red_leader
          text: >-
            What you said about men is both rude and untrue. Still, we wish to avoid an argument. We shall lead you and your fierce little dog to the women's huts. Once you are there, perhaps you will finally allow us to go away and sleep.
        - id: ch01-b111
          speaker: narrator
          text: >-
            The women lived in poor, mean huts. Each was hardly more than a little fenced corner built among the ruins. Once, a great and beautiful city had stood there, filled with gardens and flowing streams. Now every stream was dry. Nothing grew in the abandoned gardens except weeds and pineapples.
        - id: ch01-b112
          speaker: narrator
          text: >-
            The women wore stiff green tunics and were not quite as sleepy as their husbands. They brought Lucy fresh pineapples to eat. With dreamy interest, they examined the cut of her clothes and watched Brenda show off all her clever ways of begging. From them, Lucy learned that every Somnolentian wore the same shape of tunic, though each kind of worker had a different color. Women wore green. The water drawers wore red, the Great Sloth's attendants wore black, and the pineapple gatherers wore yellow.
        - id: ch01-b113
          speaker: narrator
          text: >-
            Lucy sat at a hut door and watched the four colors move lazily through the ruins. Suddenly she knew what these people were.
        - id: ch01-b114
          speaker: lucy
          text: >-
            I know! You are Halma men!
          emotion: surprised
        - id: ch01-b115
          speaker: narrator
          text: >-
            Every man who heard her hurried away.
        - id: ch01-b116
          speakers: [somnolentian_woman, woman_2, woman_3]
          ensemble: chorus
          text: >-
            Hush! Speaking that name means death.
          emotion: fearful
        - id: ch01-b117
          speaker: lucy
          text: >-
            Why does it?
        - id: ch01-b118
          speaker: somnolentian_woman
          text: >-
            Halma was once the great captain of our entire people. The Great Sloth fears that hearing his name may rouse us from our endless sleepiness. If we wake, we may find our courage, break out of bondage, and become a free people once more.
        - id: ch01-b119
          speaker: narrator
          text: >-
            Lucy decided they would hear the name often. Before she could repeat it, the woman sighed over the pineapple she was peeling.
        - id: ch01-b120
          speaker: somnolentian_woman
          text: >-
            The Great Sloth sleeps.
        - id: ch01-b121
          speaker: narrator
          text: >-
            The woman fell asleep exactly where she sat, still leaning over the pineapple she had been peeling. A vast silence settled across the entire ruined city. In the very next moment, Lucy also fell asleep, and she remained asleep for hours.
        - id: ch01-b122
          speaker: narrator
          text: >-
            When Lucy woke, it took her a long time to find the man who kept the padlock key. Even after she found him, he would not use it. She argued and threatened him with Brenda's fierceness, but nothing would make him open the well. Lucy was almost in despair when she suddenly remembered that she knew a word of power.
        - id: ch01-b123
          speaker: lucy
          text: >-
            I order you to open the well and lower the bucket. I command it in the great name of Halma.
        - id: ch01-b124
          speaker: key_keeper
          text: >-
            Anyone who speaks that name dies.
          emotion: fearful
        - id: ch01-b125
          speaker: narrator
          text: >-
            He glanced nervously over his shoulder.
        - id: ch01-b126
          speaker: lucy
          text: >-
            Speaking it brings life. Halma! Halma! Halma! Open the well, or I will carve the name on a pineapple and send it to the Great Sloth on its golden dinner tray.
        - id: ch01-b127
          speaker: key_keeper
          text: >-
            Hundreds would die for that!
          emotion: fearful
        - id: ch01-b128
          speaker: lucy
          text: >-
            Then open the well.
        - id: ch01-b129
          speaker: narrator
          text: >-
            Soon Philip and Max had come safely up in the bucket. Everyone held a council, and Lucy told them what she had learned.
        - id: ch01-b130
          speaker: lucy
          text: >-
            Whatever we decide, we must act quickly. The Great Sloth is dangerous. I am certain of that. It has already ordered me to appear and sing until it falls asleep. It does not worry about me because it knows I am not the Deliverer. If you trust me, I think I can make everything come right. But if it learns you are here, the plan will become much harder.
        - id: ch01-b131
          speaker: narrator
          text: >-
            The fallen Halma men watched from a distance in whispering groups.
        - id: ch01-b132
          speaker: lucy
          text: >-
            I will go to the Great Sloth and sing. While I am there, walk through the city. Say the name of power to everyone you meet, and tell them you are the Deliverer. If my plan fails, we will gather the people and overpower the Sloth by numbers. Until then, keep saying “Halma” wherever you go. Do you see?
        - id: ch01-b133
          speaker: philip
          text: >-
            You expect me to let you take all the danger? Not likely!
        - id: ch01-b134
          speaker: lucy
          text: >-
            It is safe. The Great Sloth never harms its singers. I am going now.
        - id: ch01-b135
          speaker: narrator
          text: >-
            Having settled the matter for herself, Lucy turned and went straight toward the temple. She moved so quickly that she was gone before Philip could stop her or argue any further.
        - id: ch01-b136
          speaker: parrot
          text: >-
            Let her go. She is a wise child.
        - id: ch01-b137
          speaker: narrator
          text: >-
            The Great Sloth's temple was built of solid gold. It had beautiful pillars, doorways, and windows. One courtyard opened inside another, and every one was paved with golden flagstones. At the very center of them all stood a large room that was entirely feather bed. There the Great Sloth passed its useless life doing nothing but eating, sleeping, and listening to music.
        - id: ch01-b138
          speaker: narrator
          text: >-
            Lucy stopped outside the Moorish arch of the inner room. In her clear little voice she sang “Jockey to the Fair,” then “Early One Morning.” After that, she stopped.
        - id: ch01-b139
          speaker: great_sloth
          text: >-
            Those songs are in very poor taste. Do you know nothing sleepy?
        - id: ch01-b140
          speaker: lucy
          text: >-
            Your people sing sleepy songs. What a shame they cannot sing to you all day.
        - id: ch01-b141
          speaker: great_sloth
          text: >-
            You understand me.
        - id: ch01-b142
          speaker: narrator
          text: >-
            The Great Sloth came out of its feather room and leaned its great weight against a pillar by the door. It gazed at Lucy with sleepy interest. The creature was very black and enormous, as large as a young elephant. Instead of walking on four feet, it stood and moved on its hind legs like a gorilla.
        - id: ch01-b143
          speaker: great_sloth
          text: >-
            It is a shame. But they claim they need water to live, so they waste their time hauling it from the wells.
        - id: ch01-b144
          speaker: lucy
          text: >-
            Would it not be better to have a machine draw the water? Then the people could sing all day, if they chose.
        - id: ch01-b145
          speaker: great_sloth
          text: >-
            If I chose. I am sleepy. Go away.
        - id: ch01-b146
          speaker: lucy
          text: >-
            No, I will not go.
        - id: ch01-b147
          speaker: narrator
          text: >-
            The Great Sloth had not heard that word for so long that it nearly woke at once.
        - id: ch01-b148
          speaker: great_sloth
          text: >-
            What did you say?
          emotion: surprised
        - id: ch01-b149
          speaker: lucy
          text: >-
            I said no. What I mean is that you are so great and grand and powerful that you never need to do anything yourself. You only have to wish for what you want, and it appears before you.
        - id: ch01-b150
          speaker: great_sloth
          text: >-
            Is that so?
        - id: ch01-b151
          speaker: lucy
          text: >-
            Yes. Say, “I wish I had a machine that would draw water for eight hours each day.” Father says eight hours is the proper working day.
        - id: ch01-b152
          speaker: great_sloth
          text: >-
            Say that once more, more slowly. I did not quite understand.
        - id: ch01-b153
          speaker: narrator
          text: >-
            Lucy repeated the wish.
        - id: ch01-b154
          speaker: great_sloth
          text: >-
            If that is all, say it again, very slowly.
        - id: ch01-b155
          speaker: narrator
          text: >-
            Lucy did, and the Great Sloth repeated each word after her.
        - id: ch01-b156
          speaker: great_sloth
          text: >-
            I wish I had a machine to draw up water for eight hours a day.
        - id: ch01-b157
          speaker: great_sloth
          text: >-
            Stop! Do not push me! Who are you, and what are you doing in my room? Come out!
          emotion: angry
        - id: ch01-b158
          speaker: narrator
          text: >-
            Something certainly came out of the room. First it shoved the Great Sloth away from the doorway. Then the vast feather bed emerged in enormous rolls, swellings, and bulges. Something so huge and strong was pushing from behind that even the Great Sloth could not resist it. The moving bed drove that mountain of lazy Sloth flesh halfway across its own inner courtyard. Lucy kept retreating before its advancing bulk and terrible rage.
        - id: ch01-b159
          speaker: great_sloth
          text: >-
            It thinks it can throw me out of my own feather bedroom? Wait until I catch it, whatever it is!
          emotion: angry
        - id: ch01-b160
          speaker: narrator
          text: >-
            Once the entire feather bed lay in the courtyard, the Great Sloth climbed over it and went back inside to punish whoever had insulted its Slothful Majesty.
        - id: ch01-b161
          speaker: narrator
          text: >-
            Lucy waited, breathless with hope and fear. The Great Sloth did not return. First came silence, then creaking.
        - id: ch01-b162
          speaker: great_sloth
          text: >-
            No, no, no! I refuse! Let me go!
          emotion: angry
        - id: ch01-b163
          speaker: narrator
          text: >-
            More creaks followed, and then came the sound of metal scraping on metal. Lucy crept back to the arch and peered around it. The room that had been stuffed with feather bed was now crowded with wheels, cogs, belts, screws, and bars. It was filled from side to side with one vast and complicated machine. The handle of that machine was turning, and the Great Sloth itself was being forced to turn it.
        - id: ch01-b164
          speaker: great_sloth
          text: >-
            Release me! I will not work!
          emotion: angry
        - id: ch01-b165
          speaker: machine
          text: >-
            You must work me. You wished for me, so you must turn me eight hours every day. That is the law.
        - id: ch01-b166
          speaker: narrator
          text: >-
            The gentle, purring voice came from inside the machine.
        - id: ch01-b167
          speaker: great_sloth
          text: >-
            I will smash you!
          emotion: angry
        - id: ch01-b168
          speaker: machine
          text: >-
            I cannot be broken.
        - id: ch01-b169
          speaker: great_sloth
          text: >-
            You did this! Wait until I catch you!
          emotion: angry
        - id: ch01-b170
          speaker: narrator
          text: >-
            The Great Sloth glared furiously at Lucy, but its hands had to keep turning the handle.
        - id: ch01-b171
          speaker: lucy
          text: >-
            Thank you, but I shall not wait. I will have an eight-hour start.
        - id: ch01-b172
          speaker: narrator
          text: >-
            Even while Lucy spoke, a stream of clear water began to pour from the pumping machine. It slid down the golden steps, crossed the golden courtyard, and flowed out toward the ruined city. Lucy ran beside it until she reached the open square, calling at the top of her voice.
        - id: ch01-b173
          speaker: lucy
          text: >-
            Halma! Halma! Halma! Halma's men, come to me!
        - id: ch01-b174
          speaker: narrator
          text: >-
            Philip had spent every moment repeating the name of power. The men were already stirring, and now they crowded around Lucy.
        - id: ch01-b175
          speaker: lucy
          text: >-
            Quickly! The Great Sloth is pumping your water and must work for eight hours a day. Dig a channel for the stream. The Deliverer has given your river back to you.
        - id: ch01-b176
          speaker: narrator
          text: >-
            As Lucy spoke, she pointed to Philip so everyone would know the Deliverer. Some of the men hurried away to search for old spades and picks. The tools were rusty and had lain forgotten for years. Other men still hesitated, too frightened of what would happen when the eight hours ended.
        - id: ch01-b177
          speakers: [halma_man_1, halma_man_2]
          ensemble: duo
          text: >-
            After eight hours, the Great Sloth will be free to take revenge on us.
          emotion: fearful
        - id: ch01-b178
          speaker: lucy
          text: >-
            I will explain that if it behaves badly, you will all wish for machine guns. The Great Sloth now knows that people who wish for machinery must operate it themselves. It must stay awake for eight hours every day. If all of you work for eight hours too, you will soon rebuild your city and make it as beautiful as it was before.
        - id: ch01-b179
          speaker: lucy
          text: >-
            And there is a new law. Whenever the clock strikes, every one of you must say “Halma” aloud. It will remind you of your great destiny and that you are no longer slaves of the Great Sloth.
        - id: ch01-b180
          speaker: narrator
          text: >-
            Lucy returned to the golden temple. She explained machine guns very carefully to the Great Sloth, which never stopped working as it listened. When she came back to the square, every man had taken up a tool and was digging a channel for the new river. The women and children crowded close around Lucy and Philip to watch the water come.
        - id: ch01-b181
          speaker: oldest_woman
          text: >-
            At last we can wash ourselves in water. My grandmother said water was very pleasant for washing. I never thought I would live to try it.
        - id: ch01-b182
          speaker: lucy
          text: >-
            Why? What do you wash with now?
        - id: ch01-b183
          speakers: [oldest_woman, woman_2, woman_3]
          ensemble: chorus
          text: >-
            Pineapple juice, when we wash at all!
        - id: ch01-b184
          speaker: lucy
          text: >-
            But that must feel terribly sticky.
        - id: ch01-b185
          speaker: oldest_woman
          text: >-
            It does. Very sticky indeed!
