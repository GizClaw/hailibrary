  chapters:
    - id: ch01
      title: CHAPTER XI. THE NIGHT ATTACK
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Halma men had never been lazy by nature. Before the Great Sloth arrived, they had been energetic, hardworking people. Now the Sloth had to work eight hours each day, so its constant, catching sleepiness no longer weighed on the town. Its sleepiness really was catching, rather like measles. Once that burden lifted, everyone went earnestly to work.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The Halma men became as busy as ants. Some dug a channel for the new stream. Others repaired buildings, cleared the overgrown gardens, or ploughed the empty fields. In the marketplace, the head man painted a large notice on a column. It said that the city had its old name, Briskford, once more. Anyone who called it Somnolentia would lose the right to wash in water for a week.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The head man had plan after plan. Even his smaller ideas included lighting the town with electricity, using power supplied by the Great Sloth.
        - id: ch01-b04
          speaker: head_man
          text: >-
            He can't spend eight hours a day pumping forever. I can adjust that machine to do all sorts of other jobs.
        - id: ch01-b05
          speaker: narrator
          text: >-
            That evening, the people naturally gave the Deliverers a banquet. There had been no time to find or prepare anything else, so the entire feast was pineapple and water. The speeches were full of praise, and Philip and Lucy were delighted by them. Brenda was less pleased. She disliked pineapple and made very little effort to hide her disappointment. Max kept accepting pieces to be polite, but secretly tucked them among the guests' feet so no one's feelings would be hurt.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The next day, the children began wondering how they could return to the island.
        - id: ch01-b07
          speaker: philip
          text: >-
            How can we get back now that the Lightning Loose is gone?
        - id: ch01-b08
          speaker: lucy
          text: >-
            We should go through Polistopolis and find out who has been opening the books. If it keeps happening, anything at all might get out. And if we have no other choice, perhaps someone can help us open the Teal book again. Then we could bring out the Teal and use it to cross to the island.
        - id: ch01-b09
          speaker: philip
          text: >-
            Lu, you really are clever. I'm not teasing. I truly mean it. And I'm sorry I ever said you were only a girl. But how do we reach Polistopolis?
        - id: ch01-b10
          speaker: narrator
          text: >-
            That was a hard problem, and even the head man had no answer. Brenda suggested asking the Great Sloth.
        - id: ch01-b11
          speaker: brenda
          text: >-
            He is such a magnificent animal, so handsome and distinguished. I'm certain he must have a magnificent mind as well. Good looks and great minds always go together, don't you think, dear Lucy?
        - id: ch01-b12
          speaker: philip
          text: >-
            We may as well ask him, unless anyone has a better idea.
        - id: ch01-b13
          speaker: narrator
          text: >-
            No one did, so Brenda's suggestion won. Working every day had made the Sloth much less disagreeable than it had been when all it did was sleep.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The children went to see it during the dinner hour. It heard their whole question patiently, though sleepily. When they had finished, it appeared to think the matter over. Then again, perhaps it had simply fallen asleep. It stayed motionless until the town clock struck one, the signal that work must begin again. At that sound, it rose and slouched towards its machine.
        - id: ch01-b15
          speaker: great_sloth
          text: >-
            Cucumbers.
        - id: ch01-b16
          speaker: narrator
          text: >-
            With that, the Sloth began turning the wheel. The town strictly enforced its rule against talking to whoever was at the wheel, so the children had to wait until tea time to learn what it meant.
        - id: ch01-b17
          speaker: great_sloth
          text: >-
            Cucumbers. Sit on the end of a young cucumber that points where you want to go. By the time it reaches its full length, say sixteen inches, you will have travelled sixteen inches.
        - id: ch01-b18
          speaker: lucy
          text: >-
            But that isn't very far.
        - id: ch01-b19
          speaker: great_sloth
          text: >-
            Every little bit helps, and rushing only slows you down. Wait for that cucumber to make seeds. When the new plants grow, choose the earliest cucumber pointing the right way and sit on it. By the end of the season, you will have travelled another sixteen inches, perhaps seventeen if you are lucky. Altogether, that is thirty-two inches, almost a yard. So you move towards your goal slowly but surely, just as people do in politics.
        - id: ch01-b20
          speaker: philip
          text: >-
            Thank you very much. We'll consider it.
        - id: ch01-b21
          speaker: narrator
          text: >-
            They did not have to consider it for long.
        - id: ch01-b22
          speaker: philip
          text: >-
            If only we could get a motor car! Machines appear when people wish for them, so perhaps...
        - id: ch01-b23
          speaker: lucy
          text: >-
            That's exactly what we need. Let's find the head man. We can't wish for the car ourselves, or we'd be forced to keep using it. But surely someone here would like to earn a living by driving one.
        - id: ch01-b24
          speaker: narrator
          text: >-
            There was such a person. One Halma man had a natural love of machinery and had long wished to leave pineapple gathering to other people. They persuaded him to wish. At once, a sixty-horsepower B.S.A. motor car appeared with a snort where there had been nothing a moment earlier.
        - id: ch01-b25
          speaker: brenda
          text: >-
            Oh, what luxury! This truly feels like home.
          emotion: happy
        - id: ch01-b26
          speaker: narrator
          text: >-
            Brenda curled up on the air cushions. The children also felt a glorious sense of rest. There was nothing they had to do, no need to plan, and no problem to bother about. They only had to sit quietly and let the car carry them swiftly onward. They passed through wonderful city after wonderful city. Philip dimly remembered seeing them all before, when they stood small and close together, built by Helen's hands and his own.
        - id: ch01-b27
          speaker: narrator
          text: >-
            At last, they drew near Polistopolis. Philip could never explain why he stopped the car outside the city. Anyone unused to motor travel would naturally want to sweep right up to their destination and let their friends admire the grand arrival. Yet some certain feeling, for which he had no explanation, told him to stop among the suburban groves of southernwood.
        - id: ch01-b28
          speaker: narrator
          text: >-
            They put on the motor coats, veils, and goggles that had appeared with the car, since no proper motor car could be complete without them. Hidden by this disguise, they meant to creep into town. They warmly said goodbye to the Halma driver and set off quietly. Max and Brenda stayed obediently at heel. Chilled by the long rush through the evening air, the parrot nestled inside Philip's jacket.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Scattered houses and broad gardens gave way to the streets of Polistopolis, the kingdom's capital. Those streets were strangely empty. Again, both children had a strong feeling they could not explain. It warned them not to return to the house where they had slept on their last visit.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Everyone was exhausted. Max's tail drooped as he walked. Brenda whined softly from weariness and weakness of spirit. Only the parrot seemed happy, or at least content, because the parrot was asleep.
        - id: ch01-b31
          speaker: narrator
          text: >-
            At the corner of a small square, where southernwood trees grew in tubs, Philip stopped the party.
        - id: ch01-b32
          speaker: philip
          text: >-
            Where should we go? Let's vote on it.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Even as he spoke, he noticed a dark figure creeping through the shadows beside the houses.
        - id: ch01-b34
          speaker: philip
          text: >-
            Who goes there?
        - id: ch01-b35
          speaker: captain_plumbeus
          text: >-
            I do! Plumbeus, Captain of the old Guard of Polistopolis.
        - id: ch01-b36
          speaker: narrator
          text: >-
            His answer had a desperate kind of courage in it, and it took Philip by surprise.
        - id: ch01-b37
          speaker: philip
          text: >-
            Oh, it's you! I'm so glad. You can tell us what to do. Where can we sleep? I can't explain it, but I don't want to return to the house where we stayed before.
          emotion: happy
        - id: ch01-b38
          speaker: narrator
          text: >-
            The captain did not answer. He seized Lucy's and Philip's hands and pulled them through a low, arched doorway. The moment Brenda and Max had squeezed their long bodies inside, he shut the door.
        - id: ch01-b39
          speaker: captain_plumbeus
          text: >-
            Safe!
        - id: ch01-b40
          speaker: narrator
          text: >-
            He spoke in a breathless way. Somehow, hearing him say they were safe made Philip feel that safety was the very last thing they could count on at that moment.
        - id: ch01-b41
          speaker: captain_plumbeus
          text: >-
            Keep your voices down. Spies may be listening. I am a plain man, and I say what I think. You came from the unknown. You might be the Deliverer, or you might be the Destroyer. But I have judged faces since I was a boy, and I cannot believe that such an innocent, apple-cheeked face belongs to a Destroyer.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Philip was angry, and Lucy was furious. Philip kept quiet, but Lucy did not.
        - id: ch01-b43
          speaker: lucy
          text: >-
            You're apple-cheeked yourself!
          emotion: angry
        - id: ch01-b44
          speaker: captain_plumbeus
          text: >-
            I see I have offended you. I meant apple-cheeked as the finest compliment I could give. There is no fruit in our city, you see, so even our compliments are about fruit. Poets may say someone is sweet as a rose. We say sweet as an orange. Will you allow me to apologize without reservation?
        - id: ch01-b45
          speaker: philip
          text: >-
            Oh, that's all right.
        - id: ch01-b46
          speaker: captain_plumbeus
          text: >-
            Then may I ask whether you truly are the Deliverer?
        - id: ch01-b47
          speaker: philip
          text: >-
            I hope I am.
        - id: ch01-b48
          speaker: parrot
          text: >-
            Of course he is! He has already completed six of the seven deeds.
        - id: ch01-b49
          speaker: narrator
          text: >-
            The parrot poked its head out through the front of Philip's jacket.
        - id: ch01-b50
          speaker: captain_plumbeus
          text: >-
            Then it is time for deeds to be done here. I'll make a light and find you some supper. I'm hiding in this place, but the walls are thick and every shutter is closed.
        - id: ch01-b51
          speaker: narrator
          text: >-
            The captain bolted another door and uncovered the opening of a dark lantern.
        - id: ch01-b52
          speaker: captain_plumbeus
          text: >-
            Some of us have taken shelter in the old prison. No one uses it now, so her spies don't swarm through it the way they do everywhere else in the city.
        - id: ch01-b53
          speaker: lucy
          text: >-
            Whose spies?
        - id: ch01-b54
          speaker: narrator
          text: >-
            The captain took bread and milk from a cupboard.
        - id: ch01-b55
          speaker: captain_plumbeus
          text: >-
            The Destroyer's spies. If you are the Deliverer, then she must be the Destroyer. But she claims the title for herself.
        - id: ch01-b56
          speaker: narrator
          text: >-
            He lit candles and placed them on the table. Lucy questioned him eagerly.
        - id: ch01-b57
          speaker: lucy
          text: >-
            What Destroyer? Is she a horrible woman wearing a motor veil?
        - id: ch01-b58
          speaker: captain_plumbeus
          text: >-
            You have guessed it.
        - id: ch01-b59
          speaker: philip
          text: >-
            It's that Pretenderette. Does Mr. Noah know? What has she done?
        - id: ch01-b60
          speaker: captain_plumbeus
          text: >-
            Nearly everything terrible you could imagine. She says she is Queen and has completed all seven deeds. Mr. Noah knows nothing, because she has guards surrounding the city. No message can pass in or out.
        - id: ch01-b61
          speaker: lucy
          text: >-
            What about the Hippogriff?
        - id: ch01-b62
          speaker: captain_plumbeus
          text: >-
            I thought of that, naturally. So did she. She locked the Hippogriff away and threw the key into one of the city wells.
        - id: ch01-b63
          speaker: philip
          text: >-
            Why would the guards obey her?
        - id: ch01-b64
          speaker: captain_plumbeus
          text: >-
            Because they aren't our guards. They are foreign soldiers she brought out of a book. She told the people there was fruit inside the enormous books that formed the Hall of Justice, and persuaded them to pull it down. When one book opened, the soldiers marched out. They call themselves the Sequani and the Aedui. Once you finish eating, we should hold a council. Many different people are hiding here. When the public is in danger, no one worries about differences in rank.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Before long, twenty or thirty people assembled in the round room. It was the very room from whose windows Philip and Lucy had looked when they were first imprisoned. Every sort of person was there. They saw match servants, domino men, soldiers, china men, Mr. Noah's wife and three sons, a pirate, and two sailors.
        - id: ch01-b66
          speaker: philip
          text: >-
            Lucy, what book did those soldiers come from?
        - id: ch01-b67
          speaker: lucy
          text: >-
            I think it was Caesar, and I'm afraid that may be my fault. When she was my nurse, I told her about barbarians and legions after Father had explained them to me. She's very clever at finding horrible uses for things, isn't she?
        - id: ch01-b68
          speaker: narrator
          text: >-
            The council talked for two hours without anyone saying a single thing worth remembering. At last, everyone became completely tired out and went to bed.
        - id: ch01-b69
          speaker: narrator
          text: >-
            During the night, Philip woke with a sudden idea. Max stirred from his warm bed at Philip's feet.
        - id: ch01-b70
          speaker: max
          text: >-
            What is it?
        - id: ch01-b71
          speaker: philip
          text: >-
            I've thought of a plan. I'm going to make a night attack.
        - id: ch01-b72
          speaker: max
          text: >-
            Would you like me to wake everyone else?
        - id: ch01-b73
          speaker: narrator
          text: >-
            Max was always ready to help. Philip considered the question for a moment.
        - id: ch01-b74
          speaker: philip
          text: >-
            No. It could be dangerous, and I want to do this on my own. Lucy has already done more than her share. Watch out, Max. I'm getting up and going outside.
        - id: ch01-b75
          speaker: narrator
          text: >-
            He got up and went out. Dawn had begun to spread a faint grey light over the great city square. It was the same square he and Lucy had once looked down upon from the prison window, though that time now seemed very far away. In the dim morning light, Philip quickly found the ruins of the Hall of Justice without any trouble at all.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Vast blocks lay scattered across the ground. One looked like grey marble, and enormous golden letters across its back read, “De Bello Gallico.” Philip slipped back into the prison and woke Captain Plumbeus.
        - id: ch01-b77
          speaker: philip
          text: >-
            I need twenty of your best men right now, and they must come without their boots.
        - id: ch01-b78
          speaker: narrator
          text: >-
            The captain gave him the men, and Philip led them to the fallen Hall of Justice.
        - id: ch01-b79
          speaker: philip
          text: >-
            Lift the cover of this book, but only the cover. Don't raise any pages.
        - id: ch01-b80
          speaker: narrator
          text: >-
            The men pressed their shoulders under the marble slab that formed the cover. They heaved, and it rose upon their backs. Philip called softly, but urgently.
        - id: ch01-b81
          speaker: philip
          text: >-
            Caesar! Caesar!
        - id: ch01-b82
          speaker: caesar
          text: >-
            Who calls? Who calls upon Julius Caesar?
        - id: ch01-b83
          speaker: narrator
          text: >-
            The voice came from beneath the slab. Then a thin man stepped out of that dark space as if he were leaving a marble tomb. He wore a toga and cloak, with a crown of bay leaves on his head.
        - id: ch01-b84
          speaker: philip
          text: >-
            I called you. You're the only one who can help us. The barbarians of Gaul have taken this city. Great Caesar, please drive them out. No one else can save us.
        - id: ch01-b85
          speaker: narrator
          text: >-
            Philip's voice trembled a little. Caesar stood silent for a moment in the grey light before dawn.
        - id: ch01-b86
          speaker: caesar
          text: >-
            I will help. You have tried many times to master Caesar, and every time you failed. You need not be ashamed of failing anymore, because now you will witness Caesar's power. Tell your slaves to raise fifteen pages of my book.
        - id: ch01-b87
          speaker: narrator
          text: >-
            The men obeyed. Caesar turned to face the enormous open book.
        - id: ch01-b88
          speaker: caesar
          text: >-
            Come out! Come out, my legions!
        - id: ch01-b89
          speaker: narrator
          text: >-
            Something moved suddenly inside the book. Long lines of silent, armed men emerged as though they too were stepping from an open marble tomb. They formed themselves into ranks. As they passed Caesar, every line saluted him. Still more soldiers came, then more and more after those. Each one bore a round shield, a shining helmet, javelins, and a fearsome short sword. On every back was the heavy pack Roman soldiers used to carry with them into war.
        - id: ch01-b90
          speaker: caesar
          text: >-
            The barbarians of Gaul are loose in this city. Drive them before you once again, just as you did long ago.
        - id: ch01-b91
          speaker: titus_labienus
          text: >-
            Where shall we drive them, Caesar?
        - id: ch01-b92
          speaker: caesar
          text: >-
            Titus Labienus, force them back into the book where I placed them more than nineteen hundred years ago, the book they dared to escape. Who commands them?
        - id: ch01-b93
          speaker: philip
          text: >-
            The Pretenderette. She's a woman in a motor veil.
        - id: ch01-b94
          speaker: caesar
          text: >-
            Caesar does not make war on women. Take her prisoner and bring her before me.
        - id: ch01-b95
          speaker: narrator
          text: >-
            Caesar's generals gave their orders in low voices. With astonishing silence, the army moved away and spread through the city in every direction.
        - id: ch01-b96
          speaker: philip
          text: >-
            She has locked up the Hippogriff, the winged horse. We need him to carry a message.
        - id: ch01-b97
          speaker: caesar
          text: >-
            See that the creature is set free.
        - id: ch01-b98
          speaker: narrator
          text: >-
            Caesar turned to Captain Plumbeus and laid a hand on his shoulder.
        - id: ch01-b99
          speaker: caesar
          text: >-
            We are fellow soldiers. Lead me to the main gate. That is where the battle will be fiercest.
        - id: ch01-b100
          speaker: narrator
          text: >-
            At the head of the final legion, Caesar and the captain of the old Guard marched together towards the main gate.
