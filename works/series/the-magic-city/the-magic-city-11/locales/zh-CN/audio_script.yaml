audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖沉着，带一点机敏的幽默
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中
    philip:
      display_name: 菲利普
      tts:
        delivery: 直率敏感，想象丰富，情绪来得快
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    lucy:
      display_name: 露西
      tts:
        delivery: 开朗友好，坦率好奇
        timbre: 轻盈稚嫩
        pace: 轻快
        pitch: 中高
    polly:
      display_name: 波利
      tts:
        delivery: 机灵健谈，爱挖苦也很讲义气
        timbre: 清脆略带沙哑
        pace: 稍快
        pitch: 中高
    max:
      display_name: 马克斯
      tts:
        delivery: 忠诚直爽，逞强时仍透出紧张
        timbre: 明亮结实
        pace: 适中
        pitch: 中
    brenda:
      display_name: 布伦达
      tts:
        delivery: 亲热温柔，害怕时格外殷勤
        timbre: 轻柔明快
        pace: 适中
        pitch: 中高
    great_sloth:
      display_name: 大懒兽
      tts:
        delivery: 傲慢沉重，困倦中带着暴躁
        timbre: 粗大含混
        pace: 拖沓
        pitch: 低
    red_leader:
      display_name: 红衣头领
      tts:
        delivery: 困倦守旧，一心只想避开麻烦
        timbre: 干涩圆钝
        pace: 缓慢
        pitch: 中低
    plumbeus:
      display_name: 普伦比厄斯队长
      tts:
        delivery: 正直郑重，危急中仍爱一本正经地解释
        timbre: 坚实略沙哑
        pace: 适中
        pitch: 中低
    caesar:
      display_name: 尤利乌斯·凯撒
      tts:
        delivery: 威严克制，命令简洁而不容置疑
        timbre: 深沉洪亮
        pace: 从容
        pitch: 低
    labienus:
      display_name: 提图斯·拉比埃努斯
      tts:
        delivery: 军人式的恭敬果断
        timbre: 清晰有力
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 勤快镇重新忙起来
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            哈尔玛棋子并非生来懒惰。大懒兽到来以前，他们勤快得很。如今，大懒兽每天必须工作八小时，那股笼罩全城、还像麻疹一样会传染的困意终于散去。大家马上认真干起活来，忙得像一群蚂蚁。有人挖新河的水渠，有人修房子，还有人给花园除草，翻耕荒废的田地。
        - id: ch01-b02
          speaker: narrator
          text: 哈尔玛棋子头领在市场的柱子上刷了一条告示。
        - id: ch01-b03
          speaker: red_leader
          text: >-
            这座城从今天起恢复旧名，叫勤快镇。谁再把它叫作瞌睡国，就罚他一星期不许用水洗东西。
        - id: ch01-b04
          speaker: narrator
          text: >-
            头领还有许多计划。就连让全城亮起电灯，在他看来也只是小事一桩。当然，发电需要的力气，要由大懒兽来出。
        - id: ch01-b05
          speaker: red_leader
          text: >-
            总不能叫它每天八小时只管抽水。我改一改机器，就能让它做许多别的事。
        - id: ch01-b06
          speaker: narrator
          text: >-
            晚上，城里当然设宴款待解救者。因为来不及制作或找到别的食物，宴席上从头到尾只有菠萝和水。席间的颂词却十分动听，菲利普和露西听得很高兴。布伦达远没有他们开心。她不爱菠萝，也没怎么掩饰失望。马克斯为了礼貌接过一块又一块，随后悄悄藏到客人们脚边。这样，送食物的人就不会觉得受了冷落。
        - id: ch01-b07
          speaker: philip
          text: >-
            “闪电脱缰号”已经丢了。我们现在怎么回岛上呢？
        - id: ch01-b08
          speaker: lucy
          text: >-
            我们先绕道波利斯托波利斯，查清楚是谁不断打开那些书吧。那个人再开下去，什么都可能放出来。实在没办法，我们就找人重新打开《水鸭号》，让“水鸭号”出来，载我们渡海回岛。
        - id: ch01-b09
          speaker: philip
          text: >-
            露，你真聪明，我是说真的。以前我说你不过是个女孩子，是我不对。可我们怎么去波利斯托波利斯？
        - id: ch01-b10
          speaker: narrator
          text: >-
            这倒难住了所有人，头领也没有办法。最后，布伦达提议去问大懒兽。
        - id: ch01-b11
          speaker: brenda
          text: >-
            它长得那么英俊，又那么气派，一定有颗伟大的头脑。我一直觉得，好相貌总会配上一副好头脑。亲爱的露西，你也这样想吧？
        - id: ch01-b12
          speaker: philip
          text: 大家既然都没有别的主意，那就去问吧。
        - id: ch01-b13
          speaker: narrator
          text: >-
            自从每天开始工作，大懒兽已经没有从前成日睡觉时那么讨厌了。午饭时，孩子们去找它。它困归困，还是耐着性子听完了问题。随后，它像是在仔细思量，也可能早已睡着了。孩子们只能在一旁等。直到城里的钟敲响一点，那是重新开工的时刻，它才站起身，懒洋洋地拖着脚走向自己的机器。
        - id: ch01-b14
          speaker: great_sloth
          text: 我的办法是用黄瓜。
        - id: ch01-b15
          speaker: narrator
          text: >-
            大懒兽说完便转起轮子的手柄。城里有条严格的规矩，谁也不能跟正在转轮子的人说话。因此，孩子们一直等到下午茶时间，才问它究竟是什么意思。
        - id: ch01-b16
          speaker: great_sloth
          text: >-
            黄瓜。你找一根朝目的地生长的小黄瓜，坐在它的末梢。等它长足十六英寸，你也就前进了十六英寸。
        - id: ch01-b17
          speaker: lucy
          text: 可那点路根本不算什么呀。
        - id: ch01-b18
          speaker: great_sloth
          text: >-
            一点一滴都有用，欲速则不达。先等那根黄瓜结籽。新苗长出来后，再挑一根最早朝目的地生长的黄瓜，坐上它的末梢。等到黄瓜季结束，你又能前进十六英寸，运气好就是十七英寸。前后加起来三十二英寸，已经差不多一码。你就这样朝目标慢慢进发，虽然慢，却稳稳当当，跟搞政治一样。
        - id: ch01-b19
          speaker: philip
          text: 多谢。我们会认真想想。
        - id: ch01-b20
          speaker: narrator
          text: >-
            其实，这主意根本不用想多久。既然许愿能得到机器，菲利普马上想到了汽车。
        - id: ch01-b21
          speaker: philip
          text: 要是我们能弄到一辆汽车……
        - id: ch01-b22
          speaker: lucy
          text: >-
            就这么办，去找头领！我们不能亲自许愿，不然以后就得不停地开。可城里一定有人愿意靠开汽车过日子。
        - id: ch01-b23
          speaker: narrator
          text: >-
            果然有个哈尔玛棋子天生喜欢机械。他早就不想采菠萝了，巴不得把那份差事交给别人。大家劝他许愿要一辆汽车。就在片刻前还空无一物的地方，一辆六十马力的伯明翰轻武器公司汽车突然冒出来，发出粗重的喷气声。
        - id: ch01-b24
          speaker: brenda
          text: 噢，多么享受！这才像回到家了。
          emotion: happy
        - id: ch01-b25
          speaker: narrator
          text: >-
            布伦达舒舒服服蜷在充气坐垫上。孩子们也觉得轻松极了，什么都不用做，不用思量，也不用操心，只管坐着，让汽车载他们飞驰过一座座奇妙的城市。菲利普依稀记得，这些城市从前小小的，就摆在眼前，是他和海伦亲手造出来的。
    - id: ch02
      title: 黑暗中的旧卫队长
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            他们终于接近波利斯托波利斯。菲利普后来一直说不清，自己为什么会在城外停下汽车。一个不常坐汽车的人，本该喜欢风风光光地直奔朋友门前，好叫大家看看他一路有多气派，再好好欣赏朋友们的赞叹。可菲利普有种说不出缘由、却十分确定的感觉。他们最好把车留在郊外的青蒿树林里，然后穿上汽车外套，蒙起汽车面纱，戴好风镜，借这些东西遮住模样，悄悄进城。这些衣物许愿时当然也随车出现了。毕竟少了它们，汽车就不能算齐全。
        - id: ch02-b02
          speaker: narrator
          text: >-
            他们亲热地告别哈尔玛棋子司机，悄悄朝城里走。马克斯和布伦达乖乖跟在脚边，半点也不乱跑，表现得值得大大夸奖一番。一路迎着晚风飞驰，鹦鹉早已冻得够呛，这时索性钻进菲利普的外套里，紧贴着他暖和的胸口窝着。
        - id: ch02-b03
          speaker: narrator
          text: >-
            起先，路边还是一栋栋零散的房屋和一座座宽阔的花园。再往前走，王国首都波利斯托波利斯的街道便取代了它们。街上空得出奇，一个人影也难见到。两个孩子又有了那种十分确定、却无法解释的直觉。他们都觉得，这次绝不能回到上次进城时住过的地方。
        - id: ch02-b04
          speaker: narrator
          text: >-
            大家已经累坏了。马克斯走路时垂着尾巴。布伦达又疲倦又没出息，一路低声哼哼给自己听。只有鹦鹉还算快乐，至少还算满足，因为它已经睡着了。走到一座小广场的街角，菲利普终于叫大家停下。广场上没有别人，只摆着几只大盆，盆里种着一棵棵青蒿树。
        - id: ch02-b05
          speaker: philip
          text: 我们去哪儿？还是投票决定吧。
        - id: ch02-b06
          speaker: narrator
          text: >-
            他刚说完，就看见一道黑影贴着房屋的阴影，悄悄向前移动。
        - id: ch02-b07
          speaker: philip
          text: 谁在那里？
        - id: ch02-b08
          speaker: narrator
          text: 对方回答时带着一股走投无路的逞强劲儿，听得菲利普吃了一惊。
        - id: ch02-b09
          speaker: plumbeus
          text: 是我！普伦比厄斯，波利斯托波利斯旧卫队队长。
        - id: ch02-b10
          speaker: philip
          text: >-
            原来是你，见到你太好了！快给我们出个主意，上哪儿才能睡觉？我不想再去上次住的那栋房子，可又说不清为什么。
        - id: ch02-b11
          speaker: narrator
          text: >-
            队长根本没有回答。他一手抓住露西，一手抓住菲利普，不由分说地把两个孩子拖过一道低矮的拱门。马克斯和布伦达紧随其后，两条长长的身子先后从门缝里滑了进来。最后一截尾巴刚刚越过门槛，队长就把门关得严严实实。
        - id: ch02-b12
          speaker: plumbeus
          text: 安全了。
        - id: ch02-b13
          speaker: narrator
          text: >-
            队长说得上气不接下气，反倒叫菲利普觉得，此刻最靠不住的就是安全。
        - id: ch02-b14
          speaker: plumbeus
          text: >-
            现在小声些，谁知道有没有密探躲在外面偷听？我是个直性子，心里想到什么，嘴里就说什么。你们从未知之地而来，可能是解救者，也可能是毁灭者。不过，我最会看人的脸，从小就是这样。这样一张像苹果般红润、又满是天真的面孔，我实在不能相信它会属于毁灭者。
        - id: ch02-b15
          speaker: narrator
          text: 菲利普生了气，露西更是气坏了。菲利普没有开口，露西却忍不住回了一句。
        - id: ch02-b16
          speaker: lucy
          text: 你自己才长着苹果脸呢！
          emotion: angry
        - id: ch02-b17
          speaker: plumbeus
          text: >-
            你生气了。虽然这里黑得什么也看不见，我还是听得出来。可我说你朋友长着苹果脸，只是把自己想得出的最高赞美送给他。城里没有水果，所以我们的夸奖大概才会这么说。诗人会说“像玫瑰一样甜美”，我们却说“像橙子一样甜美”。请允许我毫无保留地向你道歉。
        - id: ch02-b18
          speaker: philip
          text: 噢，没事了。
        - id: ch02-b19
          speaker: plumbeus
          text: 那我能不能再问一句，你真是解救者吗？
        - id: ch02-b20
          speaker: philip
          text: 但愿我是。
        - id: ch02-b21
          speaker: polly
          text: 他当然是。七件大事，他已经完成六件了。
        - id: ch02-b22
          speaker: narrator
          text: 鹦鹉说着，从菲利普的外套前襟里探出脑袋。
        - id: ch02-b23
          speaker: plumbeus
          text: >-
            这里早该有人干点大事了。我先点灯，再给你们拿些晚饭。我正躲在这里，不过墙很厚，百叶窗也关得严严实实。
        - id: ch02-b24
          speaker: narrator
          text: 队长闩好门，推开暗灯的遮片。
        - id: ch02-b25
          speaker: plumbeus
          text: >-
            我们有些人躲进了旧监狱。这里从来不用，所以她的密探不像在城里其他地方那样到处乱钻。
        - id: ch02-b26
          speaker: lucy
          text: 谁的密探？
        - id: ch02-b27
          speaker: plumbeus
          text: >-
            毁灭者的。既然你是解救者，她当然就是毁灭者。可她也说自己才是解救者。
        - id: ch02-b28
          speaker: narrator
          text: 队长从橱柜里拿出面包和牛奶，又点起蜡烛，摆到桌上。
        - id: ch02-b29
          speaker: lucy
          text: 那个毁灭者，是不是一个戴汽车面纱的讨厌女人？
        - id: ch02-b30
          speaker: plumbeus
          text: 你猜中了。
        - id: ch02-b31
          speaker: philip
          text: >-
            是女觊觎者！诺亚先生知道吗？那个女人到底干了些什么？
        - id: ch02-b32
          speaker: plumbeus
          text: >-
            你能想到的坏事，她全干了。她自称女王，还说七件大事都是她完成的。诺亚先生毫不知情，因为她派兵包围全城，消息送不出去，也传不进来。
        - id: ch02-b33
          speaker: lucy
          text: 那鹰头马身有翼兽呢？
        - id: ch02-b34
          speaker: plumbeus
          text: >-
            我当然想到了，它也一样被她想到了。她把那头奇兽锁了起来，又把钥匙扔进城里的一口公用水井。
        - id: ch02-b35
          speaker: philip
          text: 守卫为什么肯听她的话？
        - id: ch02-b36
          speaker: plumbeus
          text: >-
            因为那根本不是我们的守卫。她从一本书里放出了一群陌生士兵。正义殿是用一本本巨书造的。她谎称那些书里藏着水果，骗城里人亲手拆掉正义殿。等其中一本书被打开，那些士兵就列着队从里面走了出来。他们管自己叫塞夸尼人和埃杜维人。
        - id: ch02-b37
          speaker: plumbeus
          text: >-
            吃完晚饭，我们得开个会。这里藏着不少人，各种身份都有。国家有难的时候，谁还顾得上身份高低呢？
    - id: ch03
      title: 菲利普的夜袭
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            不久，二三十个人聚进那间圆屋子。菲利普和露西第一次被关起来时，曾从这里的窗户向外看过整座城市。今晚来到这里的人果真什么身份都有。有服侍人的火柴仆人，有多米诺骨牌人、士兵和瓷人，也有诺亚先生的妻子和三个儿子。一个海盗带着两个水手也来了。危难关头，这些平日很不相同的人全挤在同一间屋里。
        - id: ch03-b02
          speaker: philip
          text: 她是从哪本书里放出那些士兵的？
        - id: ch03-b03
          speaker: narrator
          text: >-
            大家七嘴八舌地准备开会时，菲利普凑近露西，压低声音问起了那些士兵的来历。
        - id: ch03-b04
          speaker: lucy
          text: >-
            我想是讲凯撒的书。而且恐怕还是我的错。她给我当保姆时，爸爸给我讲过蛮族和军团那些事，我后来也讲给她听了。她最会想出这种坏透了的点子，对不对？
        - id: ch03-b05
          speaker: narrator
          text: >-
            会议足足开了两个小时，每个人都说了不少话，可没有一句值得我们在这里再提。等所有人都累得精疲力尽，大家便各自上床睡觉。夜深以后，菲利普的脑子里忽然闪过一个主意。那主意一下抓住了他，他猛地醒来。
        - id: ch03-b06
          speaker: max
          text: 怎么了？
        - id: ch03-b07
          speaker: narrator
          text: 马克斯也从菲利普脚边暖和的小窝里醒了过来。
        - id: ch03-b08
          speaker: philip
          text: 我想到办法了。我要发动一次夜袭。
        - id: ch03-b09
          speaker: max
          text: 要我把其他人叫醒吗？
        - id: ch03-b10
          speaker: narrator
          text: 马克斯一向随时乐意帮忙。菲利普想了一会儿。
        - id: ch03-b11
          speaker: philip
          text: >-
            不用了，这件事挺危险。而且我想自己完成。露西已经做得够多了。留神，马克斯，我现在就起床出去。
        - id: ch03-b12
          speaker: narrator
          text: >-
            菲利普果真起床，独自走了出去。夜色已经有了一点变化，天边透出一线极淡的灰白晨光。借着这点光，他看清了城里的大广场。他和露西从监狱窗口俯瞰这里，仿佛已经是很久很久以前的事。街上依旧安静，菲利普没有费多少力气，很快找到了被拆毁的正义殿。
        - id: ch03-b13
          speaker: narrator
          text: >-
            一块块巨石散落在地。其中有一块像灰色大理石，背面写着几个巨大的金字：《高卢战记》。菲利普看清以后，悄悄回到监狱，叫醒队长。
        - id: ch03-b14
          speaker: philip
          text: 我要二十个精挑细选的人，不许穿靴子。立刻就要。
        - id: ch03-b15
          speaker: narrator
          text: 队长找来了二十个人。菲利普领着他们赶到正义殿废墟。
        - id: ch03-b16
          speaker: philip
          text: >-
            把这本书的封面抬起来。只抬封面，里面的书页一张也别动。
        - id: ch03-b17
          speaker: narrator
          text: >-
            二十个人全都脱了靴子，悄无声息地围住巨书。他们用肩膀顶住那块沉重的大理石板。那不是普通石块，正是这本书的封面。众人一齐用力，封面慢慢从地上升起。石板还压在他们肩头时，菲利普俯向下面，用急切而轻微的声音呼唤起来。
        - id: ch03-b18
          speaker: philip
          text: 凯撒，请听见我的呼唤！凯撒！
        - id: ch03-b19
          speaker: caesar
          text: 是谁在呼唤？是谁在召唤尤利乌斯·凯撒？
        - id: ch03-b20
          speaker: narrator
          text: >-
            回答声从大理石板下面传来。随后，一道瘦削的身影从封面下的空隙里迈出，仿佛刚从一座大理石墓穴中现身。他披着罗马人的托加长袍，外面又罩着斗篷，头上戴着一顶月桂冠。灰白的晨光落在他身上。
        - id: ch03-b21
          speaker: philip
          text: >-
            是我召唤您。只有您能帮我们。高卢蛮族占领了这座城，我恳请伟大的凯撒把他们赶走。再没有别人能救我们了。
        - id: ch03-b22
          speaker: narrator
          text: 菲利普的声音微微发颤。灰色的晨光里，凯撒沉默了片刻。
        - id: ch03-b23
          speaker: caesar
          text: >-
            我会办到。你从前一次又一次想要掌握凯撒，却回回失败。现在不必再为那些失败羞愧了，因为你马上就会亲眼看见凯撒究竟有多大的力量。叫你的奴隶动手，把我的书页一张张抬起，一直数到十五页。
        - id: ch03-b24
          speaker: narrator
          text: 众人照办。凯撒转身面对那本敞开的巨书。
        - id: ch03-b25
          speaker: caesar
          text: 出来！我的军团，出来吧！
    - id: ch04
      title: 凯撒的军团
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            巨书深处忽然有什么动了一下。一列列全副武装的士兵从书页间走出来，就像从一座敞开的大理石墓穴中不断涌出。他们默不作声地排成整齐队伍，经过凯撒身旁时向他举手致敬。后面还有更多人，一队接一队，仿佛永远也走不完。每个人都带着圆盾，戴着闪亮的头盔，手里拿着标枪和可怕的短剑，背上还负着罗马士兵出征时惯常携带的行囊。
        - id: ch04-b02
          speaker: caesar
          text: >-
            高卢蛮族逃进了这座城。像从前一样，再把他们驱赶一次！
        - id: ch04-b03
          speaker: labienus
          text: 凯撒大人，要把他们赶往哪里？
        - id: ch04-b04
          speaker: caesar
          text: >-
            提图斯·拉比埃努斯，把他们赶回那本书里。早在一千九百多年前，我就把他们安置在那里，他们竟敢逃出来。
        - id: ch04-b05
          speaker: caesar
          text: 他们的首领是谁？
        - id: ch04-b06
          speaker: philip
          text: 女觊觎者，一个戴汽车面纱的女人。
        - id: ch04-b07
          speaker: caesar
          text: 凯撒不与女人交战。把她活捉，带到我面前。
        - id: ch04-b08
          speaker: narrator
          text: >-
            凯撒手下的将领们压低声音，把一道道命令传了下去。没有喊叫，也没有喧闹。整支大军安静得不可思议，却立刻动了起来。不同的队伍迅速开拔，沿着城里的道路朝四面八方散去。
        - id: ch04-b09
          speaker: philip
          text: >-
            她还把鹰头马身有翼兽关进了笼子。那是一匹长翅膀的马，我们想派它去送信。
        - id: ch04-b10
          speaker: caesar
          text: 务必放出那头牲畜。
        - id: ch04-b11
          speaker: narrator
          text: 凯撒转向普伦比厄斯队长，把一只手搭在他的肩上。
        - id: ch04-b12
          speaker: caesar
          text: >-
            你我都是军人。带我去正门，那里一定打得最激烈。
        - id: ch04-b13
          speaker: narrator
          text: >-
            最后一个军团已经列好队伍，准备向前。凯撒和旧卫队队长并肩走在军团最前面，身后跟着整支罗马军团，一同朝波利斯托波利斯的正门进发。
