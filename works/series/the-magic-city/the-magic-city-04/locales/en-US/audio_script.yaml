  chapters:
    - id: ch01
      title: CHAPTER IV. THE DRAGON-SLAYER
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Philip went up the domino path and under the enormous arch into the darkness. His heart was full of brave purpose, but his legs felt strangely weak, especially at the knees. The doorway looked vast, everything beyond it was black, and Philip himself was terribly small. When he passed beneath the gateway he had made from three dominoes, with the little silver knight on top, he saw that he stood no taller than a domino. And you know how small that is.
        - id: ch01-b02
          speaker: narrator
          text: >-
            He moved carefully along the path. Every spot in every domino had become a deep hollow, though its blackness made it easy to see. Ahead stood the three arches he had built from pairs of silver candlesticks. Silver inkstands rested on the first two pairs, and a book rested on the third because he had run out of inkstands. Once he had passed all three arches, he stopped.
        - id: ch01-b03
          speaker: narrator
          text: >-
            A darkness like black velvet stretched before him, streaked here and there with white. As his eyes adjusted, he found himself in a huge hall of silver pillars. They were really giant candlesticks, standing in long rows every way he looked. Whichever way he turned, another pillared corridor opened in front of him.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Philip had no idea which corridor to choose. A dark hall full of silver pillars seemed a very unlikely place to find Lucy.
        - id: ch01-b05
          speaker: philip
          text: >-
            Still, it's a great deal lighter than it was.
        - id: ch01-b06
          speaker: narrator
          text: >-
            That was true. The pillars had begun to shine with a dim, soft glow, like the silvery light in seaside pools on a summer night.
        - id: ch01-b07
          speaker: philip
          text: >-
            Good thing, too. Otherwise I'd never see the holes in the floor.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Those holes were the spots in the dominoes that paved the hall.
        - id: ch01-b09
          speaker: philip
          text: >-
            I wonder which part of Lucy's city I'll come out in.
        - id: ch01-b10
          speaker: narrator
          text: >-
            He need not have wondered, because he did not come out anywhere. He walked on and on and on. He believed he was going straight, but without knowing it he turned one way, then another, and then another among rows of identical pillars. By the time he saw anything besides silver columns, velvet darkness beneath invisible roofs, and a floor of tightly laid dominoes, he had been walking a long while and was very tired.
        - id: ch01-b11
          speaker: philip
          text: >-
            Oh, thank goodness!
        - id: ch01-b12
          speaker: narrator
          text: >-
            The pavement had narrowed into one line of dominoes, just like the path where he had entered, and an arch stood ahead. Then Philip understood with a miserable shock. It was the very same arch and the very same path. All that walking had brought him back to where he began. He felt foolish and thoroughly annoyed. He sat on the edge of the path to rest and think.
        - id: ch01-b13
          speaker: philip
          text: >-
            What if I walk out and stop believing in magic? Helen says magic only happens to people who believe in it. If I refuse to believe with all my might, I'll grow back to my proper size, Lucy will come back, and the magic will be gone.
        - id: ch01-b14
          speaker: inner_voice
          text: >-
            Yes, but what if Lucy still believes? The magic will go on for her, no matter what you believe, and she won't come back. Besides, you have to believe it. You know it's true.
        - id: ch01-b15
          speaker: philip
          text: >-
            Oh, bother! I'm tired. I don't want to keep going.
        - id: ch01-b16
          speaker: inner_voice
          text: >-
            If you hadn't left Lucy behind, you wouldn't have to go looking for her now.
        - id: ch01-b17
          speaker: philip
          text: >-
            But I can't find the way. How am I supposed to do it?
        - id: ch01-b18
          speaker: inner_voice
          text: >-
            You know how. Pick a pillar far away and walk straight toward it. Before you reach it, choose another one farther on. You must come out somewhere.
        - id: ch01-b19
          speaker: philip
          text: >-
            But I'm tired, and I'm all alone.
        - id: ch01-b20
          speaker: inner_voice
          text: >-
            Lucy is alone too.
        - id: ch01-b21
          speaker: philip
          text: >-
            Oh, be quiet!
        - id: ch01-b22
          speaker: narrator
          text: >-
            Philip got up and followed the bothersome voice's advice. He fixed his eyes on a distant pillar and started again.
        - id: ch01-b23
          speaker: philip
          text: >-
            Why should I even trouble? This is probably some kind of dream.
        - id: ch01-b24
          speaker: inner_voice
          text: >-
            Dream or not, it has adventures in it. You might as well act like an adventurer.
        - id: ch01-b25
          speaker: philip
          text: >-
            Oh, very well.
        - id: ch01-b26
          speaker: narrator
          text: >-
            On he went. He walked with great care, always choosing a pillar far ahead, and at last he came right through the hall. Past the pillars' pale glow, blue daylight shone very brightly through a tiny door. Philip did not hesitate. He went straight through it and found himself in a great field. It looked rather like an endless prairie, except that broad patches of flowers in different colors spread across the grass. A path crossed the field, and he followed it.
        - id: ch01-b27
          speaker: philip
          text: >-
            I'll have a better chance of meeting Lucy on the path. Girls always stick to paths. They never go exploring.
        - id: ch01-b28
          speaker: narrator
          text: >-
            That only shows how little he understood girls. After a while he looked back, but the hall of pillars was already fading into distant mist. Ahead stood a huge rough building that looked rather like Stonehenge.
        - id: ch01-b29
          speaker: philip
          text: >-
            I wish I'd reached the other city, with all the people and soldiers and greyhounds and coconuts. There isn't anyone here. Not even Lucy.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The empty country felt more unpleasant with every step, but going on made more sense than turning back.
        - id: ch01-b31
          speaker: philip
          text: >-
            I ought to be starving. I must have walked for hours.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Yet he was not hungry. Perhaps it was the magic, or perhaps it was his odd breakfast. There was no way to tell. He spoke aloud because the open country was so quiet and strange. No one else was there, and the only sound was the clump, clump of his boots. Soon the silence felt so deep that he could almost hear his own thoughts.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Real loneliness is a dreadful thing. I hope you never have to feel it. Philip searched the wide plain on every side. Nothing moved. Grass and flowers stood without a breath of wind. Nothing showed that a living person had ever used the path, except that the path itself was there. It led to the Stonehenge-like building, which seemed to be nothing but a ruin.
        - id: ch01-b34
          speaker: philip
          text: >-
            I'll go as far as that. Maybe there'll be a signpost or something.
        - id: ch01-b35
          speaker: narrator
          text: >-
            There was something, and it was the last thing Philip expected. The building truly did resemble Stonehenge, though its pillars were taller and stood closer together, with one solid wall towering above them. Philip rounded a massive upright and ran almost into the arms, and right onto the feet, of a man sitting on a fallen column. The man wore a white apron and a square paper cap. He was eating bread and cheese with a clasp-knife.
        - id: ch01-b36
          speaker: philip
          text: >-
            I beg your pardon!
        - id: ch01-b37
          speaker: mr_perrin
          text: >-
            Granted, I'm sure. But running straight onto a fellow's clasp-knife is dangerous work, Master Philip.
        - id: ch01-b38
          speaker: narrator
          text: >-
            He put Philip back on his feet and waved the knife. It had been sharpened so often that half the blade was worn away.
        - id: ch01-b39
          speaker: mr_perrin
          text: >-
            Sit yourself down and catch your breath.
        - id: ch01-b40
          speaker: philip
          text: >-
            Why, it's you!
        - id: ch01-b41
          speaker: mr_perrin
          text: >-
            Course it is. Who would I be if I wasn't me? There's poetry for you.
        - id: ch01-b42
          speaker: philip
          text: >-
            But how did you come here?
        - id: ch01-b43
          speaker: mr_perrin
          text: >-
            Ah, now. That would be telling.
        - id: ch01-b44
          speaker: philip
          text: >-
            Then tell me.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Philip spoke impatiently, though he did sit down. The man went on eating his bread and cheese and talked in the friendliest way.
        - id: ch01-b46
          speaker: mr_perrin
          text: >-
            You say I'm me. Well, who is me? Give me a name.
        - id: ch01-b47
          speaker: philip
          text: >-
            You're old Perrin. I mean, please excuse me, you're Mr. Perrin the carpenter.
        - id: ch01-b48
          speaker: mr_perrin
          text: >-
            And what do carpenters do?
        - id: ch01-b49
          speaker: philip
          text: >-
            Carp, I suppose. That means making things, doesn't it?
        - id: ch01-b50
          speaker: mr_perrin
          text: >-
            That's right. Now, what things might old Perrin have made for you?
        - id: ch01-b51
          speaker: philip
          text: >-
            You made my wheelbarrow, and you made my bricks.
        - id: ch01-b52
          speaker: mr_perrin
          text: >-
            There you have it. I made your bricks. Seasoned oak they were, and true to a thousandth of an inch. That's how I came here. Now you know.
        - id: ch01-b53
          speaker: philip
          text: >-
            But what are you doing here?
        - id: ch01-b54
          speaker: narrator
          text: >-
            Philip wriggled restlessly on the fallen column.
        - id: ch01-b55
          speaker: mr_perrin
          text: >-
            Waiting for you. The ones who know sent me to meet you and give you a hint about what's wanted from you.
        - id: ch01-b56
          speaker: philip
          text: >-
            What is wanted? I mean, it was very kind of you. But what am I supposed to do?
        - id: ch01-b57
          speaker: mr_perrin
          text: >-
            Plenty of time for that. Nothing's wanted from you till near sundown.
        - id: ch01-b58
          speaker: philip
          text: >-
            I really do think it was awfully kind of you.
        - id: ch01-b59
          speaker: narrator
          text: >-
            Philip had taken a moment to think that over.
        - id: ch01-b60
          speaker: mr_perrin
          text: >-
            You were kind to old Perrin once.
        - id: ch01-b61
          speaker: philip
          text: >-
            Was I?
        - id: ch01-b62
          speaker: narrator
          text: >-
            Philip was honestly surprised.
        - id: ch01-b63
          speaker: mr_perrin
          text: >-
            You were. When my little girl was poorly, you brought her a heap of pears from your own tree. Miss Helen told me you didn't eat a single pear yourself that year. And when our sandy-and-white kitten with the black spots went missing, you brought it home. So when they asked me to meet you, I was glad to come. I used to work beside a boys' school, so I know what happens to young gentlemen's appetites. I took the liberty of bringing you a bite to eat.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Mr. Perrin reached one hand behind the fallen pillar where they sat and pulled out a basket. He offered it to Philip. The moment Philip lifted the lid, he was delighted to discover that he was hungry after all. It was a very pleasant basketful. Inside were meat pasties, red hairy gooseberries, a stone bottle of ginger beer, a blue mug with Philip written on it in gold letters, a slice of soda cake, and two farthing sugar sticks.
        - id: ch01-b65
          speaker: philip
          text: >-
            I'm sure I've seen this basket somewhere before.
        - id: ch01-b66
          speaker: mr_perrin
          text: >-
            Very likely. It's the same one you carried those pears in.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Philip was seven bites into a pasty when he began asking questions again.
        - id: ch01-b68
          speaker: philip
          text: >-
            Now listen. You have to tell me how you got here and what sort of place this is. You can't imagine how confusing it all feels. Tell me everything. Where are we? Why are we here? What must I do, and why, and when? Every single thing.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Then he took his eighth bite.
        - id: ch01-b70
          speaker: mr_perrin
          text: >-
            You truly don't know, sir?
        - id: ch01-b71
          speaker: philip
          text: >-
            No.
        - id: ch01-b72
          speaker: narrator
          text: >-
            He studied the ninth bite, though it was not quite the last. The pasty was a large one.
        - id: ch01-b73
          speaker: mr_perrin
          text: >-
            Well, here goes. Mind you, I was never much of a speaker. Even my friends said so at cricket dinners and such.
        - id: ch01-b74
          speaker: philip
          text: >-
            I don't need a speech. Just tell me.
        - id: ch01-b75
          speaker: mr_perrin
          text: >-
            Then first, how did I come here? I came because I made the bricks you used to build this tumbledown old place.
        - id: ch01-b76
          speaker: philip
          text: >-
            I built this?
        - id: ch01-b77
          speaker: mr_perrin
          text: >-
            You did, with the bricks I made. From what I hear, it was the first building you ever put up. That's why it's the first one on the road to the place you're trying to reach.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Philip looked around. The great Stonehenge building was indeed made from enormous oak bricks.
        - id: ch01-b79
          speaker: philip
          text: >-
            Of course. I've become smaller, that's all.
        - id: ch01-b80
          speaker: mr_perrin
          text: >-
            Or the bricks have become bigger. It comes to the same thing. Now, here's how it is. Every city and every other thing you ever built is here in this country. I don't know how it's managed any more than you do, but that doesn't change the truth of it. Because you made those places, you've a right to enter them, if you can find the way. And now you have found it. I'm told it isn't everyone who has that luck.
        - id: ch01-b81
          speaker: mr_perrin
          text: >-
            Of course, you built your cities from things other people had made. Bricks, chessmen, books, candlesticks, dominoes, brass basins, and every other sort of thing. All the people who helped make those things are here too. Making is what matters. It doesn't matter how small a part someone played. Maybe a craftsman carved a piece of a cabinet. Maybe a lad only turned the grindstone that sharpened the knife used for the carving. Maybe a child picked the teasel used to finish the bit of cloth glued beneath a chessman. Every one of them is here. Together, they're what we call the population of your cities.
        - id: ch01-b82
          speaker: philip
          text: >-
            I understand. They've all grown small, like me.
        - id: ch01-b83
          speaker: mr_perrin
          text: >-
            Or the cities grew large. It amounts to the same thing. Please don't interrupt, Master Philip. You make me lose my place.
        - id: ch01-b84
          speaker: philip
          text: >-
            I won't do it again. Only tell me one thing first. How can you be here and in Amblehurst at the same time?
        - id: ch01-b85
          speaker: mr_perrin
          text: >-
            We come here when we're asleep.
        - id: ch01-b86
          speaker: philip
          text: >-
            Oh. Then it is only a dream.
        - id: ch01-b87
          speaker: narrator
          text: >-
            He sounded deeply disappointed.
        - id: ch01-b88
          speaker: mr_perrin
          text: >-
            Nothing of the kind. We come when we're sleeping too soundly to dream. We pass right through the dreams and out the other side, where everything is real. That's this place.
        - id: ch01-b89
          speaker: philip
          text: >-
            Go on.
        - id: ch01-b90
          speaker: mr_perrin
          text: >-
            Now I've lost my place. You do put me out.
        - id: ch01-b91
          speaker: philip
          text: >-
            You were saying pop-you-something.
        - id: ch01-b92
          speaker: mr_perrin
          text: >-
            Population, yes. The people who made the things in your cities live there now, and they've built the insides of the houses too.
        - id: ch01-b93
          speaker: philip
          text: >-
            What do they do all day?
        - id: ch01-b94
          speaker: mr_perrin
          text: >-
            They simply live here. They buy and sell things, plant their gardens, do their work, and play, just like people in every other city. When they go to sleep here, they pass straight through their dreams and into the other world. Then they work and play there instead. That's how life goes on between the two places. There's a great deal more I might tell you, but you've had enough for one sitting. Get on with your gooseberries.
        - id: ch01-b95
          speaker: philip
          text: >-
            But they can't all be real people. What about Mr. Noah?
        - id: ch01-b96
          speaker: mr_perrin
          text: >-
            Ah, the ones you placed in the cities yourself are the aristocracy. They're our old families, very respected and all of them very high in the world. Came over with the Conker, as folks say. The Noah family is the oldest of all, naturally. Then there are the dolls you put in at different times, and the tin soldiers too. Every animal from Noah's ark is alive as well, except when you used one as part of a building. An animal used that way stays a statue.
        - id: ch01-b97
          speaker: philip
          text: >-
            There's still one thing I can't understand. I know all the cities I built were pulled down at different times. How can they be here together, all going on at once?
        - id: ch01-b98
          speaker: mr_perrin
          text: >-
            I'm no scholar, so I can't properly explain it myself. But I once heard Mr. Noah speak about it in a lecture, and he can make a speech if anyone can. He said it was like taking a photograph of someone. The real person is solid and round. He's so many feet high and so many inches thick. But in the photograph he comes out flat, because everything in a photograph is flat. Even so, it really is the same person. You have managed to get him into the picture. After that, all you need is to bring him out once more into a place where everything is thick and tall and round and solid. I believe it's quite easy, once you know the trick.
        - id: ch01-b99
          speaker: philip
          text: >-
            Stop! I think my head is going to burst.
        - id: ch01-b100
          speaker: mr_perrin
          text: >-
            Ah, I felt the same at first. Lie down and sleep it off. Education goes to your head something cruel. I've noticed that often.
        - id: ch01-b101
          speaker: narrator
          text: >-
            Philip was glad to stretch out in the long grass while Mr. Perrin covered him with his coat. He fell asleep at once.
        - id: ch01-b102
          speaker: narrator
          text: >-
            An hour later he woke, saw Mr. Perrin's face, wrinkled like an apple, and began to remember where he was.
        - id: ch01-b103
          speaker: philip
          text: >-
            At least I'm glad you're here. Before I found you, I was horribly lonely. You can't imagine.
        - id: ch01-b104
          speaker: mr_perrin
          text: >-
            That's just why they sent me to meet you.
        - id: ch01-b105
          speaker: philip
          text: >-
            How did you know I was coming?
        - id: ch01-b106
          speaker: mr_perrin
          text: >-
            Mr. Noah sent for me early this morning. Bless you, he knows about everything. He told me to meet you and explain all I could. And he said if you wanted to be a Deliverer, you should be allowed to try.
        - id: ch01-b107
          speaker: philip
          text: >-
            How do you start being a Deliverer?
        - id: ch01-b108
          speaker: narrator
          text: >-
            Philip sat up feeling suddenly grand and manly. He was also glad Lucy was not there to interfere.
        - id: ch01-b109
          speaker: mr_perrin
          text: >-
            There are all sorts of ways. Yours is simple. You have to kill the dragon.
        - id: ch01-b110
          speaker: philip
          text: >-
            A live dragon?
          emotion: surprised
        - id: ch01-b111
          speaker: mr_perrin
          text: >-
            Alive? Why, he's everywhere, green as grass and lively as a kitten. There's a broken spear sticking from his side, so someone must have tried to bring him down before.
        - id: ch01-b112
          speaker: philip
          text: >-
            Perhaps I ought to find Lucy first. I could become a Deliverer afterward.
        - id: ch01-b113
          speaker: narrator
          text: >-
            The picture Mr. Perrin had painted was a little too vivid for Philip.
        - id: ch01-b114
          speaker: mr_perrin
          text: >-
            If you're afraid, of course.
        - id: ch01-b115
          speaker: philip
          text: >-
            I'm not afraid. At least, I don't think I am.
        - id: ch01-b116
          speaker: mr_perrin
          text: >-
            Here's what you must decide. Are you the hero of this adventure, or aren't you? You can't have it both ways. If you are the hero, make up your mind now, because killing one dragon isn't the end of it. Not at all.
        - id: ch01-b117
          speaker: philip
          text: >-
            Are there more dragons?
        - id: ch01-b118
          speaker: mr_perrin
          text: >-
            Not dragons exactly. No, I don't mean to discourage you. But if you kill this dragon, there will still be six more difficult deeds for you to do. Finish all seven and they'll make you king. You can take the offer or leave it. If you take it, we'd better start now. In fact, either way we should be moving, because at sundown the dragon comes out to drink and take his exercise. On a still night, you can hear him rattling about among these ruins from miles away.
        - id: ch01-b119
          speaker: philip
          text: >-
            Suppose I decide I don't want to be a Deliverer.
        - id: ch01-b120
          speaker: mr_perrin
          text: >-
            Then you'll be a Destroyer. Those are the only two positions open just now. Come, Master Philip. You're going to act like a man and do your duty for England, Home, and Beauty, just as the song says. Shall we start?
        - id: ch01-b121
          speaker: philip
          text: >-
            Do you think I ought to be the Deliverer?
        - id: ch01-b122
          speaker: mr_perrin
          text: >-
            Ought doesn't matter. I think you are going to be the Deliverer. That's what I think. Come along!
        - id: ch01-b123
          speaker: narrator
          text: >-
            As they stood, Philip caught one quick glimpse of a very smart lady in a motor veil vanishing around a pillar.
        - id: ch01-b124
          speaker: philip
          text: >-
            Are there many motorcars here?
        - id: ch01-b125
          speaker: narrator
          text: >-
            He did not want to talk about dragons any longer.
        - id: ch01-b126
          speaker: mr_perrin
          text: >-
            Not one. No phonographs either, nor railways, factory chimneys, or any of those loud, ugly things. No advertisements, newspapers, or barbed wire.
        - id: ch01-b127
          speaker: narrator
          text: >-
            After that, the two of them left the ruin in silence. Philip tried hard to feel as brave and certain as a Deliverer ought to feel. He thought of Saint George. He reminded himself that in a story, the hero never fails to kill the dragon. Even so, he remained a little uneasy. It takes time to grow accustomed to being a hero. He could not help glancing over his shoulder again and again to see whether the dragon was coming after them. So far, it was not.
        - id: ch01-b128
          speaker: mr_perrin
          text: >-
            Well, what do you say?
        - id: ch01-b129
          speaker: narrator
          text: >-
            They were nearing a square tower with a long flight of steps.
        - id: ch01-b130
          speaker: philip
          text: >-
            I wasn't saying anything.
        - id: ch01-b131
          speaker: mr_perrin
          text: >-
            I mean, will you be the Deliverer?
        - id: ch01-b132
          speaker: narrator
          text: >-
            Something swelled inside Philip's heart. His throat tightened, and he felt more frightened than he ever had before. Still, he made himself look as brave as possible.
        - id: ch01-b133
          speaker: philip
          text: >-
            Yes. I will.
        - id: ch01-b134
          speaker: narrator
          text: >-
            Mr. Perrin clapped his hands. At once, dozens of people poured from the tower doors and from behind the building. Mr. Noah came down the long steps alone. He moved with careful dignity and carried his yellow mat neatly rolled beneath his arm. Everyone applauded until he stopped on the third step and raised both hands for silence.
        - id: ch01-b135
          speaker: mr_noah
          text: >-
            Friends and fellow citizens of Polistopolis, here before you stands one who declares himself the Deliverer. Yesterday he was arrested and tried as a trespasser, then sentenced to imprisonment. When he escaped, all of you believed he must be the Destroyer in disguise. But now he has returned. Of his own free will, he has chosen to attempt the seven great deeds that will prove a true Deliverer. The first of those deeds is to kill the great green dragon.
        - id: ch01-b136
          speaker: narrator
          text: >-
            The citizens came from many different nations, and they cheered him loudly.
        - id: ch01-b137
          speaker: mr_noah
          text: >-
            We will now make him our knight. Kneel, as a sign of your loyalty to the Kingdom of Cities.
        - id: ch01-b138
          speaker: narrator
          text: >-
            Philip knelt.
        - id: ch01-b139
          speaker: mr_noah
          text: >-
            You must repeat the words after me. Say exactly what I say.
        - id: ch01-b140
          speaker: narrator
          text: >-
            Mr. Noah whispered the oath, and Philip repeated it.
        - id: ch01-b141
          speaker: philip
          text: >-
            I, Philip, claim to be the Deliverer of this great nation. I promise to complete the seven great deeds that will prove my claim to the Deliverership and the throne. On my honor, I will defend this city and stand against its Destroyer.
        - id: ch01-b142
          speaker: narrator
          text: >-
            When the oath was finished, Mr. Noah brought out a shining sword with a silver hilt and held it over Philip.
        - id: ch01-b143
          speaker: mr_noah
          text: >-
            You must also become a knight. Anyone here who has read history will know that an ordinary commoner cannot be expected to conquer a dragon. We must give our would-be Deliverer every possible chance. Therefore, I shall knight him.
        - id: ch01-b144
          speaker: narrator
          text: >-
            He touched Philip lightly on the shoulder with the sword.
        - id: ch01-b145
          speaker: mr_noah
          text: >-
            Rise, Sir Philip!
        - id: ch01-b146
          speaker: narrator
          text: >-
            It was wonderfully grand. Mr. Noah gave him the silver sword, and as the people cheered, Philip felt his courage rise.
        - id: ch01-b147
          speaker: pretenderette
          text: >-
            But I claim to be the Deliverer too.
        - id: ch01-b148
          speaker: narrator
          text: >-
            The thin, unpleasant voice struck the gathering like a thunderbolt. Every cheer stopped. Everyone stared with open mouths toward the speaker. It was the smart lady in the motor veil whom Philip had glimpsed among the ruins.
        - id: ch01-b149
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: >-
            A trespasser! Take the trespasser to prison!
          emotion: angry
        - id: ch01-b150
          speaker: narrator
          text: >-
            Angry threats rose all around her.
        - id: ch01-b151
          speaker: pretenderette
          text: >-
            I'm no more a trespasser than that boy. If I say I'm the Deliverer, you cannot stop me. I can kill dragons or do anything he can do.
        - id: ch01-b152
          speaker: mr_noah
          text: >-
            Silence, trespasser. You should have spoken sooner. Sir Philip now holds the place of candidate for King-Deliverer. The only position left for you is Destroyer.
        - id: ch01-b153
          speaker: pretenderette
          text: >-
            And what if the boy fails?
        - id: ch01-b154
          speaker: mr_noah
          text: >-
            A fair point. If you choose, you may temporarily hold the position of Pretender-in-Chief to the Claimancy of the Deliverership. I have created that office here and now especially for you. You may also claim the Destroyership, if you prefer.
        - id: ch01-b155
          speaker: pretenderette
          text: >-
            Then if he fails, I can become the Deliverer.
        - id: ch01-b156
          speaker: mr_noah
          text: >-
            You may try. A woman who claims the Deliverership must perform a different set of tasks.
        - id: ch01-b157
          speaker: pretenderette
          text: >-
            What tasks?
        - id: ch01-b158
          speaker: mr_noah
          text: >-
            If Sir Philip fails, you will receive full instructions for the deeds required of a woman Deliverer. Now, friends, we shall withdraw and leave Sir Philip to face the dragon. We will watch him anxiously from the ramparts over there.
        - id: ch01-b159
          speaker: philip
          text: >-
            Isn't anyone going to help me?
        - id: ch01-b160
          speaker: narrator
          text: >-
            Philip was deeply uneasy.
        - id: ch01-b161
          speaker: mr_noah
          text: >-
            Champions do not usually need help with dragons.
        - id: ch01-b162
          speaker: pretenderette
          text: >-
            Of course they don't. But none of you are doing this properly. Where is the princess, I'd like to know?
        - id: ch01-b163
          speaker: mr_noah
          text: >-
            There is no princess.
        - id: ch01-b164
          speaker: pretenderette
          text: >-
            Then it won't be a proper dragon-killing. That's all I have to say.
        - id: ch01-b165
          speaker: narrator
          text: >-
            She shook her skirts angrily.
        - id: ch01-b166
          speaker: mr_noah
          text: >-
            I wish it were all you had to say.
        - id: ch01-b167
          speaker: pretenderette
          text: >-
            Without a princess, it isn't fair. I shall consider the Deliverership mine next.
        - id: ch01-b168
          speaker: mr_noah
          text: >-
            Be silent, woman.
        - id: ch01-b169
          speaker: pretenderette
          text: >-
            Woman, indeed! I deserve a proper title.
        - id: ch01-b170
          speaker: mr_noah
          text: >-
            Your title is Pretender to the—
        - id: ch01-b171
          speaker: pretenderette
          text: >-
            I know what it is, but you forget that you're addressing a lady. Call me the Pretenderette.
        - id: ch01-b172
          speaker: narrator
          text: >-
            Mr. Noah turned away from her with icy dignity. He put two Roman candles and a box of matches into Philip's hands.
        - id: ch01-b173
          speaker: mr_noah
          text: >-
            Once you have arranged your plan and feel quite certain you can kill the dragon, light one of these Roman candles. We will have a princess ready. When we see your signal, we shall take her out and tie her to a tree. Since this is a place where trees are scarce and buildings are plentiful, we can tie her to a pillar instead. If you have planned correctly, she will be perfectly safe. Whatever happens, you must not attempt to deal with the dragon until you have lit the Roman candle.
        - id: ch01-b174
          speaker: philip
          text: >-
            Then the dragon will see the light and run away.
        - id: ch01-b175
          speaker: mr_noah
          text: >-
            Precisely. Or perhaps it will see the light and decide not to go away. Only time will tell us which. A task without difficulties can never truly appeal to a hero. In the vaults beneath this tower, you will find weapons, ropes, nets, shields, and all sorts of useful aids for a young dragon-catcher. Good evening, Sir Philip. We all wish you every possible success.
        - id: ch01-b176
          speaker: narrator
          text: >-
            With that, the entire crowd began to leave.
        - id: ch01-b177
          speaker: pretenderette
          text: >-
            I know exactly who ought to be the princess.
        - id: ch01-b178
          speaker: mr_noah
          text: >-
            Silence in court.
        - id: ch01-b179
          speaker: pretenderette
          text: >-
            This is not a court.
        - id: ch01-b180
          speaker: narrator
          text: >-
            Her voice was as aggravating as ever.
        - id: ch01-b181
          speaker: mr_noah
          text: >-
            Wherever justice is present, there is a court. I charge you with contempt. Guards, arrest this person and take her straight to prison.
        - id: ch01-b182
          speaker: narrator
          text: >-
            A scuffle followed, with plenty of shrieking. Then all the voices moved away. Even the Pretenderette's angry cries grew fainter and fainter until they vanished.
        - id: ch01-b183
          speaker: narrator
          text: >-
            Philip was completely alone.
        - id: ch01-b184
          speaker: narrator
          text: >-
            His first act was to climb all the way to the top of the tower and look for the dragon. He searched east, north, south, and west. From that height he could see the ramparts of the fort, where Mr. Noah and all the others were now safely gathered. Farther away, more towers and cities rose in the distance. He could also make out the ruins where he had met Mr. Perrin.
        - id: ch01-b185
          speaker: narrator
          text: >-
            Something was moving among those ruins. It was long, green, and made of separate joints. It could only be the dragon.
        - id: ch01-b186
          speaker: philip
          text: >-
            Oh, crikey! What am I going to do? I'd better see what weapons they've got.
          emotion: fearful
        - id: ch01-b187
          speaker: narrator
          text: >-
            He hurried down the stairs, then down another flight, and another, until at last he reached the castle vaults. Everything a dragon-killer could possibly need was waiting there. There was even a little red book called “The Young Dragon-Catcher's Vade Mecum, or a Complete Guide to the Good Sport of Dragon-Slaying.” Beside it lay an excellent pair of field glasses.
        - id: ch01-b188
          speaker: narrator
          text: >-
            The tower top still seemed the safest place, so Philip carried the book all the way back up and tried to read it there. The words were very long, and most of them were spelled in the most difficult ways. He could make out very little. Still, after a great effort, he managed to learn one useful fact. Every dragon goes to sleep at sunset and remains asleep for one hour.
        - id: ch01-b189
          speaker: narrator
          text: >-
            Then a loud rattling came from the ruin. Philip knew the dragon was making it. He lifted the field glasses and peered anxiously toward the sound. What he saw made him jump so hard that he nearly dropped them. The worry left his face, and he let out a breath that was half sob and half laugh.
        - id: ch01-b190
          speaker: philip
          text: >-
            That old thing!
          emotion: surprised
        - id: ch01-b191
          speaker: narrator
          text: >-
            He raised the glasses and looked again. An enormous green dragon moved in and out among the ruins. It was terribly long and looked very fierce, and every movement made its body rattle. Again and again, it rubbed itself against the fallen pillars. Yet Philip knew that dragon very well indeed. He had known it long ago. The Christmas before last, someone had given it to him as a clockwork lizard. He remembered putting it into one of the cities he and Helen had built together.
        - id: ch01-b192
          speaker: narrator
          text: >-
            Like all the figures of living creatures that Philip had placed in his cities, the lizard had grown huge and come alive. But he could see that it was still a clockwork creature. Its key stuck out from one side. The dragon was rubbing against the pillars so that the stone would push the key around and wind its clockwork. It was a slow and awkward way to do the job. The key had not turned halfway around before the sun set. The instant sunset came, the dragon lay down and went to sleep.
        - id: ch01-b193
          speaker: philip
          text: >-
            Well, now I have to think.
        - id: ch01-b194
          speaker: narrator
          text: >-
            Philip thought harder than he ever had in his life. When his thinking was done, he went to the vault and fetched a long rope. For a moment he stood still, wondering whether he was brave enough. Then he remembered the words “Rise, Sir Philip.” A knight simply must not be afraid.
        - id: ch01-b195
          speaker: narrator
          text: >-
            He set out through the dusk toward the dragon. He knew it would sleep for a full hour, but even so, the thought of going near it was dreadful. All the while, the twilight grew deeper and deeper. There was still enough light to find the ruins, and enough to find the creature lying among them. Ten or twelve yards of solid, shadowy dragon stretched across the ground. Its metal claws gleamed in the last daylight. Its huge mouth hung open, and each sleeping breath sounded like the sea on a rough night.
        - id: ch01-b196
          speaker: philip
          text: >-
            Rise, Sir Philip.
        - id: ch01-b197
          speaker: narrator
          text: >-
            He walked close beside the dragon until he reached the key in the middle of its body. Mr. Perrin had mistaken that key for the broken end of an old spear left by someone who had tried to kill the monster.
        - id: ch01-b198
          speaker: narrator
          text: >-
            Philip fastened one end of the rope very securely around the key. How thankful he was that Helen had taught him to tie sound knots instead of useless granny knots. The dragon lay perfectly still through it all and went on breathing like a rough sea. Next, Philip carried the loose end of the rope to the ruin's main wall. That wall stood strong and firm, and he tied the rope securely around it. Then the dragon-slayer raced back to his tower as fast as he could, struck a match, and lit one Roman candle.
        - id: ch01-b199
          speaker: narrator
          text: >-
            Perhaps you already see his idea. When the dragon woke, it would discover that the rope held it prisoner. It would become furious and fight to get free. Philip felt certain it would escape eventually, but there was only one way it could do so. It would have to pull its own body away from the key and leave the key behind. Once the key was out, the dragon could never wind itself again. That would make it as good as dead. Of course, if Mr. Noah truly wished it, Sir Philip could still cut off the creature's head with the silver-hilted sword.
        - id: ch01-b200
          speaker: narrator
          text: >-
            It was an excellent plan, as far as it went. Philip sat on the tower roof without a worry and ate several red hairy gooseberries he found loose in his pocket.
        - id: ch01-b201
          speaker: narrator
          text: >-
            Less than three minutes after the Roman candle flared, golden rain shot into the southern sky. Great Catherine wheels appeared in the east, and a long row of rockets in the north looked almost like the northern lights. Red fire flashed, then green fire, then still more rockets. More fireworks than Philip had ever seen, even at the Crystal Palace, lit the entire plain.
        - id: ch01-b202
          speaker: narrator
          text: >-
            In their light, he saw a procession leave the fort and cross to a single pillar standing alone. The people tied a white figure to it.
        - id: ch01-b203
          speaker: philip
          text: >-
            That must be the Princess. Well, she'll be safe enough.
        - id: ch01-b204
          speaker: narrator
          text: >-
            The procession returned to the fort. Then the dragon woke. Philip watched it stretch and shake its enormous head the way a dog shakes itself after coming out of water.
        - id: ch01-b205
          speaker: philip
          text: >-
            I don't think it likes the fireworks.
        - id: ch01-b206
          speaker: narrator
          text: >-
            He was quite right. Now the dragon noticed the Princess. She had been placed at a convenient point about halfway between the ruins and Philip's tower. The creature threw up its long snout and gave a shattering howl. A thrill of horror ran through Philip. In that instant he understood that it did not matter whether the creature ran by clockwork. It was alive, and it was desperately dangerous.
        - id: ch01-b207
          speaker: narrator
          text: >-
            Then the dragon discovered the rope. It heaved and twisted. It snorted, bellowed, scratched with its huge claws, tore at the earth, and lashed its terrible tail. Thousands of fireworks blazed over the struggle as it fought to escape.
        - id: ch01-b208
          speaker: narrator
          text: >-
            Then the thing Philip had expected truly happened. The great wall held firm. The rope held firm. The dragon itself held firm. The key was the one thing that gave way. With a grinding, rusty noise that echoed across the plain, like a goods train shunting on a siding, the key tore free from the keyhole in the dragon's side. It remained fastened to the rope, hanging there like an anchor at the end of its cable.
        - id: ch01-b209
          speaker: narrator
          text: >-
            The key remained behind. And now something happened that Philip had not foreseen. Before the dragon fell asleep, it had managed to wind itself part of the way. Its terrible struggle had not used up all of that winding. There was still some go left in the dragon. With a yell of fury, it set off across the plain. Its long green body wriggled and rattled over the ground, and it was heading straight toward the Princess.
        - id: ch01-b210
          speaker: narrator
          text: >-
            There was no time left to wonder whether he was afraid. Philip flew down the tower stairs faster than he had ever taken stairs in his life, and even in ordinary times he was very good at stairs.
        - id: ch01-b211
          speaker: narrator
          text: >-
            He slung his sword over his shoulder as if it were a gun and ran. Like the dragon, he headed straight for the Princess. Now the two were racing. Philip ran and ran. His heart hammered, and his feet felt heavy as lead, the way they do in a nightmare. He thought he was dying.
        - id: ch01-b212
          speaker: narrator
          text: >-
            Keep going. Faster now. He must not stop. Then his second wind came, and he began to run faster. Was it only his imagination, or was the dragon slowing down?
        - id: ch01-b213
          speaker: narrator
          text: >-
            Philip never knew how he managed it. With one final burst, he reached the pillar where the Princess was tied. The dragon was only twenty yards away and still coming.
        - id: ch01-b214
          speaker: narrator
          text: >-
            Philip stood motionless for a moment, trying to catch his breath. The dragon came more and more slowly, but it showed no sign of stopping. Behind him, beside the pillar, someone was crying softly.
        - id: ch01-b215
          speaker: narrator
          text: >-
            The dragon was very close now. Philip stepped forward three times, aimed his sword, shut his eyes, and struck with all his strength. Something hard and heavy knocked him to the ground. After that, for a while, he knew nothing.
        - id: ch01-b216
          speaker: narrator
          text: >-
            When Philip came to himself again, Mr. Noah was making him swallow something nasty from a medicine glass. Mr. Perrin was patting him on the back. All around them, the people shouted as loudly as they could, while more fireworks than ever burst overhead and filled the sky. Beside Philip lay the dragon. It was silent, motionless, and quite lifeless.
        - id: ch01-b217
          speaker: philip
          text: >-
            Oh! Did I truly kill it?
          emotion: surprised
        - id: ch01-b218
          speaker: mr_noah
          text: >-
            You certainly did. Whatever may happen in your remaining deeds, you are the hero of this one. If you feel well enough, prepare to receive the Reward of Valor and Chivalry.
        - id: ch01-b219
          speaker: philip
          text: >-
            Oh! I didn't know there would be a reward.
          emotion: happy
        - id: ch01-b220
          speaker: mr_noah
          text: >-
            Only the usual reward. The Princess, of course.
        - id: ch01-b221
          speaker: narrator
          text: >-
            Philip now noticed a figure in a white veil standing close beside him. Pieces of cut rope lay around her feet.
        - id: ch01-b222
          speaker: mr_noah
          text: >-
            The Princess belongs to you.
        - id: ch01-b223
          speaker: narrator
          text: >-
            Mr. Noah spoke with generous kindness.
        - id: ch01-b224
          speaker: philip
          text: >-
            But I don't want her. Thank you, though.
        - id: ch01-b225
          speaker: mr_noah
          text: >-
            You should have considered that earlier. You cannot perform deeds of valor and then refuse the reward. Take her. She is yours.
        - id: ch01-b226
          speaker: philip
          text: >-
            Anyone can have her. If she belongs to me, I can give her away, can't I? I have all those other deeds ahead. Surely you can see I haven't time to be bothered with princesses.
        - id: ch01-b227
          speaker: mr_noah
          text: >-
            That is no concern of mine. Perhaps you can arrange for someone to look after her while you perform your deeds. At present, she is waiting for you to take her hand and lift her veil.
        - id: ch01-b228
          speaker: philip
          text: >-
            Do I have to? Oh, very well. Here goes.
        - id: ch01-b229
          speaker: narrator
          text: >-
            Philip took one small, cold hand in his own. Very carefully, he lifted a corner of the veil with his other hand. The Princess used her free hand to pull it all the way back. The Dragon-Slayer and the Princess looked straight at each other.
        - id: ch01-b230
          speaker: philip
          text: >-
            Why, it's only Lucy!
          emotion: surprised
