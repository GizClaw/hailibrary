audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖沉着，带一点机敏的幽默
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中
    philip:
      display_name: 菲利普
      tts:
        delivery: 直率敏感，想象丰富，情绪来得快
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    lucy:
      display_name: 露西
      tts:
        delivery: 开朗友好，坦率好奇
        timbre: 轻盈稚嫩
        pace: 轻快
        pitch: 中高
    judge_noah:
      display_name: 诺亚先生
      tts:
        delivery: 一本正经又怕麻烦，古板中带着滑稽
        timbre: 苍老清晰
        pace: 稍慢
        pitch: 中
    perrin:
      display_name: 佩林先生
      tts:
        delivery: 朴实和善，带着老手艺人的乡土口吻
        timbre: 粗粝温厚
        pace: 从容
        pitch: 中低
    inner_voice:
      display_name: 心里的声音
      tts:
        delivery: 清醒执拗，毫不留情却并不刻薄
        timbre: 清晰轻细
        pace: 适中
        pitch: 中
    pretenderette:
      display_name: 女觊觎者
      tts:
        delivery: 尖刻自负，争强好胜，句句不肯相让
        timbre: 尖细明亮
        pace: 稍快
        pitch: 高
    citizen_1:
      display_name: 市民甲
      tts:
        delivery: 热烈直率，容易随人群激动
        timbre: 洪亮
        pace: 适中
        pitch: 中
    citizen_2:
      display_name: 市民乙
      tts:
        delivery: 热烈直率，反应敏捷
        timbre: 明亮
        pace: 适中
        pitch: 中高
    citizen_3:
      display_name: 市民丙
      tts:
        delivery: 热烈直率，声音坚定
        timbre: 厚实
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 银柱迷宫
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            菲利普沿着多米诺骨牌铺成的小径，走进巨型拱门后的黑暗。他心里的决心很强，两条腿却软得出奇，尤其是膝盖。门洞太高，前面太黑，他自己又小得可怜。经过那座三块骨牌搭成、顶上站着银骑士的小门时，他发现自己只有一块骨牌那么高。
        - id: ch01-b02
          speaker: narrator
          text: >-
            他小心往前挪。骨牌上的黑点，如今都成了深坑。前面有三道银色拱门，柱子是烛台，头两道顶着墨水台，第三道因为墨水台用完了，顶着一本书。走过三道门，他站住了。天鹅绒般的黑暗里浮着白光。等眼睛适应以后，他才看清四面全是巨大的银柱。它们朝每个方向排开，像啤酒花田里密密的支架。无论转向哪里，面前都是一条漫长的柱廊。
        - id: ch01-b03
          speaker: narrator
          text: >-
            菲利普不知道该走哪边。在这样的地方找到露西，实在不像有希望。好在银柱渐渐透出柔和的微光，像夏天海边水洼里的银色磷光，地上的黑坑总算看得清楚。
        - id: ch01-b04
          speaker: philip
          text: 这里比刚进来时亮多了。幸亏如此，不然这些坑可怎么躲？不知道我最后会从露西那座城的什么地方出去。
        - id: ch01-b05
          speaker: narrator
          text: >-
            可他根本没出去。他走了又走，以为自己一直向前，其实总在一模一样的银柱之间转弯。很久以后，他累得双腿发沉，终于看见骨牌地面收成单独一行，前方还有一道熟悉的拱门。他先是一喜，随即难过地认出，那正是入口。他绕了一大圈，又回到了原地。菲利普泄气地坐到小径边，开始想一个逃避的办法。
        - id: ch01-b06
          speaker: philip
          text: >-
            要是我就这么走出去，再也不相信魔法呢？海伦说，魔法只会发生在相信它的人身上。只要我拼命不信，我会恢复原来的大小，露西也会回来，魔法就不存在了。
        - id: ch01-b07
          speaker: inner_voice
          text: >-
            可要是露西仍然相信呢？无论你信不信，她那边的事都会继续，她也回不来。再说，你心里清楚这是真的，怎么可能不信？
        - id: ch01-b08
          speaker: philip
          text: 我累了，不想再走了。
        - id: ch01-b09
          speaker: inner_voice
          text: 谁让你丢下露西？你要是没扔下她，也不用回来找她。
        - id: ch01-b10
          speaker: philip
          text: 可我连路都找不到，要怎么找她？
        - id: ch01-b11
          speaker: inner_voice
          text: >-
            你知道办法。盯着远处一根柱子，笔直走过去。快到时，再挑更远的一根。这样总能走出去。
        - id: ch01-b12
          speaker: philip
          text: 我太累了，而且这里孤单得可怕。
        - id: ch01-b13
          speaker: inner_voice
          text: 露西也一样孤单。
        - id: ch01-b14
          speaker: narrator
          text: >-
            菲利普叫那个声音别说了，却还是站起来照它说的做。他盯住远处的银柱，一段一段笔直地走。中途他又抱怨这大概只是一场梦，心里的声音便提醒他，就算是梦，里面也有冒险，不妨勇敢一次。
        - id: ch01-b15
          speaker: philip
          text: 好吧，我走就是了。
        - id: ch01-b16
          speaker: narrator
          text: >-
            这一次，他终于穿过银柱大厅。柱子微光之外，蓝色的白昼从一扇小门照进来。他毫不犹豫地走出去，来到一片开满各色花朵的大原野。那里有一条路，他便沿路走，认定女孩子总守着道路，从不到处探险。这正说明他一点也不了解女孩子。
        - id: ch01-b17
          speaker: narrator
          text: >-
            回头再看时，银柱大厅早已沉进远方的雾里。前方立着一座粗陋的巨大建筑，很像巨石阵。菲利普宁愿自己回到那座有人、有士兵、有猎犬和椰子的城，可这里一个人也没有，连露西也不见踪影。他越来越怕这种寂静，却觉得继续前进总比回头好。
        - id: ch01-b18
          speaker: philip
          text: 我走了好几个钟头，照理早该饿了。可我一点也不饿。
        - id: ch01-b19
          speaker: narrator
          text: >-
            也许是魔法，也许是那顿古怪早餐的缘故，谁知道呢。他故意出声，因为空旷的原野实在太静。只有靴子落在路上的咚咚声，一声接一声。到后来，他几乎能听见自己的念头。真正的孤单非常可怕，但愿你永远不必尝到。平原上没有东西在动，风也没有吹动花草。除了脚下这条通往废墟的路，看不出任何活人来过。
        - id: ch01-b20
          speaker: philip
          text: 先走到那座废墟再说，也许那里有路牌。
    - id: ch02
      title: 佩林先生的解释
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            废墟真的很像巨石阵，只是柱子更高更密，还有一面高墙。菲利普绕过一根巨柱，差点撞进一个男人怀里，还踩上了他的脚。那人戴方纸帽，系白围裙，坐在倒下的柱子上，用折刀吃面包和奶酪。刀刃磨过太多次，已经只剩一半宽。
        - id: ch02-b02
          speaker: philip
          text: 对不起！怎么，是您！
        - id: ch02-b03
          speaker: perrin
          text: >-
            我当然原谅你。不过菲利普少爷，别人手里拿着刀，你还往人家身上撞，可危险得很。坐下来喘口气吧。不是我还能是谁？这话都成诗了。
        - id: ch02-b04
          speaker: philip
          text: 可您怎么会在这里？
        - id: ch02-b05
          speaker: perrin
          text: 这可说来话长。你既然认得我，先说说我是谁。
        - id: ch02-b06
          speaker: philip
          text: 您是老佩林……对不起，是木匠佩林先生。
        - id: ch02-b07
          speaker: perrin
          text: 木匠干什么活？老佩林又给你做过什么？
        - id: ch02-b08
          speaker: philip
          text: 木匠会造东西。您给我做过独轮车和积木。
        - id: ch02-b09
          speaker: perrin
          text: >-
            这就对了。那些积木用阴干的橡木做成，尺寸一丝不差。我正是靠它们来到这里的。现在我在等你。知道内情的人叫我来接你，还要提醒你，他们盼着你做什么。不过太阳快落山以前，你什么也不用做。
        - id: ch02-b10
          speaker: philip
          text: 您特地来接我，实在太好了。
        - id: ch02-b11
          speaker: perrin
          text: >-
            你从前也对我好。我的小女儿生病那年，你把自己树上的梨全送给她，一个也没留。海伦小姐告诉我的。我家那只姜黄带白、长着黑斑的小猫走丢后，也是你找回来。所以他们叫我来，我乐意得很。我以前的铺子挨着男校，知道小少爷们有多能吃，还给你带了点心。
        - id: ch02-b12
          speaker: narrator
          text: >-
            佩林从倒柱后提起一只篮子。菲利普掀开盖子，立刻发现自己其实很饿。里面有肉馅饼、红毛醋栗、一石瓶姜汁啤酒、一只写着他名字的蓝杯子、一片苏打蛋糕和两根便宜糖棍。篮子也很眼熟，正是当初装梨的那只。
        - id: ch02-b13
          speaker: philip
          text: >-
            您一定要把所有事都告诉我。您怎么来的？这里是什么地方？我为什么会在这里？我该做什么，为什么做，又什么时候做？这一切实在太让人糊涂了。
        - id: ch02-b14
          speaker: perrin
          text: >-
            您当真什么都不知道？那我就讲吧，可我向来不会说话，板球宴会上的朋友也这么评价我。你用我做的积木搭起这座破旧建筑，所以我能来这里。听说这是你最早搭的房子，因此在通往目的地的路上，它也是第一座。
        - id: ch02-b15
          speaker: narrator
          text: >-
            菲利普四下看看，这才认出巨石阵原来由硕大的橡木积木搭成。他觉得是自己变小了，佩林却说，也可能是积木变大了，反正是一回事。
        - id: ch02-b16
          speaker: perrin
          text: >-
            你搭过的城市和其他东西，全都在这个国家里。我不知道这是怎么做到的，可事实如此。既然是你造的，只要找得到路，你就有权进来。不是人人都有这种好运。你搭城用的积木、棋子、书、烛台、骨牌、黄铜盆，全是别人造的。凡是出力做过它们的人也都在这里。关键就在“创造”。哪怕只是替磨刻刀的砂轮摇过把手，或者摘过起绒草球去整理棋子底下的布，也算出了力。这些人就是你城市里的人口。
        - id: ch02-b17
          speaker: philip
          text: 他们都和我一样变小了。那么，您怎么能同时待在这里和安布尔赫斯特？
        - id: ch02-b18
          speaker: perrin
          text: >-
            也可能是城市变大了。还有，别老打岔，你一插嘴我就忘了。我们睡着时会到这里来，但这里不是梦。人睡得太沉，连梦都不做，就会穿过梦境，从另一头来到一个万物都真实的地方。就是这里。
        - id: ch02-b19
          speaker: philip
          text: 那就接着讲人口吧。
        - id: ch02-b20
          speaker: perrin
          text: >-
            造出那些东西的人住在城里，也把屋子里面造好了。他们买卖、种花、做工、玩耍，和别处的人一样。等他们睡着，又会穿过梦境，去另一个世界生活。还有很多道理，不过一次知道这些就够了。快吃你的醋栗。
        - id: ch02-b21
          speaker: philip
          text: 可这里也有不是真人的人物吧？诺亚先生怎么算？
        - id: ch02-b22
          speaker: perrin
          text: >-
            你搭城时放进去的那些人物是贵族，都是人人尊敬的老世家，地位高得很。俗话说，他们跟栗子王一起漂洋过海而来。诺亚一家当然最古老。娃娃和锡兵也是。诺亚方舟里的动物全活着，除非你拿它们盖了房子，那时它们就只是雕像。
        - id: ch02-b23
          speaker: philip
          text: 可我明明拆掉了那些城，它们怎么还能同时留在这里？
        - id: ch02-b24
          speaker: perrin
          text: >-
            我没学问，只听诺亚先生演讲时讲过一个比方。真人有厚度、有高度，又圆又结实，照片里的人却是扁的，可那仍是同一个人。先把人装进照片，再把他取出来，送回一个万物都有厚度、高度，又圆又结实的地方。只要懂窍门，听说很容易。
        - id: ch02-b25
          speaker: philip
          text: 快停下吧，我的脑袋要炸了。
        - id: ch02-b26
          speaker: perrin
          text: >-
            我头一回听也这样。躺下睡一觉吧。教育这东西一钻进脑袋，劲儿可真大。我早就注意到了。
        - id: ch02-b27
          speaker: narrator
          text: >-
            菲利普躺进长草，盖着佩林的外套，立刻睡熟了。一个钟头以后，他望着佩林那张皱苹果似的脸醒来，慢慢记起一切。他很庆幸身边终于有人陪伴，刚才的孤单实在太可怕。
    - id: ch03
      title: 救星的誓言
      blocks:
        - id: ch03-b01
          speaker: perrin
          text: >-
            我就是为这个才被派来。今天一早，诺亚先生叫我过去。他什么都知道。他让我来接你，把能讲的全讲给你听。你想做救星，就让你做。
        - id: ch03-b02
          speaker: philip
          text: 要怎样才算开始做救星？
        - id: ch03-b03
          speaker: narrator
          text: >-
            菲利普坐起身，忽然觉得自己很有男子气概，也庆幸露西不在旁边妨碍。佩林告诉他，办法有许多，他这一回倒简单，只要杀掉巨龙。
        - id: ch03-b04
          speaker: philip
          text: 是一条活龙吗？
        - id: ch03-b05
          speaker: perrin
          text: >-
            当然活着。它浑身和草一样绿，到处乱走，活泼得像小猫，肋边还插着半截断矛。看来以前有人试过杀它。
        - id: ch03-b06
          speaker: philip
          text: 要不我先去找露西，等找到了她，再回来做救星？
        - id: ch03-b07
          speaker: perrin
          text: >-
            要是你害怕，当然可以这么说。可你得想清楚，你究竟要不要做这场冒险里的英雄。两样都占是不成的。杀龙还不是结尾，之后还有六件难事。全做完，他们就会让你当国王。做不做由你。要做就该动身了，龙会在日落时出来喝水、活动。夜里它在废墟里哐啷乱走，天气安静时，几英里外都听得见。
        - id: ch03-b08
          speaker: philip
          text: 我不是害怕。可要是我不想做救星呢？
        - id: ch03-b09
          speaker: perrin
          text: >-
            那你就得做毁灭者，这里眼下只有这两个职位。别说得像你不打算做个男子汉，不肯照歌里唱的，为英格兰、家园与美尽本分。我不谈你应该做什么，我只认定你会成为救星。走吧。
        - id: ch03-b10
          speaker: narrator
          text: >-
            两人起身时，菲利普瞥见一个衣着时髦、蒙着汽车面纱的女人闪进柱后。他暂时不愿再谈龙，便问这里汽车多不多。佩林说一辆也没有，留声机、铁路、工厂烟囱，那些又吵又丑的东西都没有，广告、报纸和带刺铁丝网也没有。
        - id: ch03-b11
          speaker: narrator
          text: >-
            他们默默走向一座方塔。菲利普努力拿出救星该有的勇气，提醒自己圣乔治也屠过龙，而英雄从来不会输给恶龙。可要习惯做英雄，需要一点时间。他仍不时回头看龙有没有追来。走到长阶梯下面，佩林又问了一次他的决定。
        - id: ch03-b12
          speaker: philip
          text: 我决定了。我要做救星。
        - id: ch03-b13
          speaker: narrator
          text: >-
            说这句话时，他心口发胀，喉咙发紧，比从前任何时候都害怕，却尽量显得勇敢。佩林立刻拍手。几十个人从塔里和塔后涌出，诺亚先生则独自走下阶梯，步子庄严，胳膊下夹着卷好的黄席。掌声响成一片，直到他站在第三层台阶上，举手让大家安静。
        - id: ch03-b14
          speaker: judge_noah
          text: >-
            波利斯托波利斯的朋友和市民们，站在你们面前的人宣称自己是救星。昨天，他作为擅闯者被捕受审，又被判入狱。他逃走后，大家认定他是乔装的毁灭者。如今他自愿归来，要尝试完成七项伟业。第一项，就是杀死绿色巨龙。
        - id: ch03-b15
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 欢迎救星！杀死巨龙！
        - id: ch03-b16
          speaker: judge_noah
          text: >-
            现在，我们要封他为骑士。菲利普，跪下，以此表示你效忠城市王国。然后跟我念誓词。
        - id: ch03-b17
          speaker: philip
          text: >-
            我，菲利普，宣称自己是这个伟大国家的救星。我发誓完成七项伟业，证明自己有资格成为救星、登上王位。我以荣誉起誓，捍卫这座城市，与它的毁灭者为敌。
        - id: ch03-b18
          speaker: narrator
          text: >-
            诺亚先生抽出银柄宝剑，举在菲利普头顶。他解释说，读过历史的人都知道，普通平民不能指望打败巨龙。为了让候选救星占尽优势，非得先封他为骑士。他用剑轻点菲利普肩头。
        - id: ch03-b19
          speaker: judge_noah
          text: 起来吧，菲利普爵士！
        - id: ch03-b20
          speaker: narrator
          text: >-
            这仪式气派极了。菲利普接过银剑，在欢呼声中又有了勇气。可掌声刚落，一个尖细难听的声音便从人群里钻出来。
        - id: ch03-b21
          speaker: pretenderette
          text: 可我也宣称自己是救星。
        - id: ch03-b22
          speaker: narrator
          text: >-
            所有人都张着嘴转过头去。说话的正是废墟里那个蒙汽车面纱的时髦女人。
        - id: ch03-b23
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 是擅闯者！把她送进监狱！
          emotion: angry
        - id: ch03-b24
          speaker: pretenderette
          text: >-
            我并不比那男孩更像擅闯者。我要说自己是救星，你们拦不住。他能杀龙，我也能。他会做的事，我样样都会。
        - id: ch03-b25
          speaker: judge_noah
          text: >-
            住口。你早该提出要求。目前菲利普爵士已经担任救星国王的候选人。除去毁灭者，没有职位留给你。
        - id: ch03-b26
          speaker: pretenderette
          text: 要是这个男孩失败呢？
        - id: ch03-b27
          speaker: judge_noah
          text: >-
            那么你可以暂任“救星资格首席觊觎者”。这个职位是眼下专门为你创设的。“毁灭者资格申请人”也仍然空着。女性想成为救星，另有一套任务。菲利普爵士若失败，我们会正式告诉你该完成哪些伟业。
        - id: ch03-b28
          speaker: pretenderette
          text: 那就是说，他办不到，我就能做救星。可我倒想问问，公主在哪里？没有公主，这算什么正经屠龙？一点也不公平。
        - id: ch03-b29
          speaker: judge_noah
          text: >-
            你可以尝试。现在大家退到远处城墙上观看，让菲利普爵士独自对付巨龙。这里没有公主。
        - id: ch03-b30
          speaker: philip
          text: 难道没有人留下帮我？
        - id: ch03-b31
          speaker: judge_noah
          text: 英雄对付巨龙，通常不需要帮手。
        - id: ch03-b32
          speaker: pretenderette
          text: 没有公主就是不合规矩。我应该有个正式头衔。别只叫我女人，请叫我“女觊觎者”。
        - id: ch03-b33
          speaker: judge_noah
          text: >-
            住口。等你计划周全，确信能杀死巨龙，就点燃这两根罗马焰火中的一根。我们看到信号，会准备一位公主，把她绑在树上。这里树少，也可能绑在柱上。计划正确，她就绝对安全。没有先点焰火，绝不能动手。
        - id: ch03-b34
          speaker: philip
          text: 这样龙看见焰火，就会离开？
        - id: ch03-b35
          speaker: judge_noah
          text: >-
            正是。也可能它看见以后并不离开，只能等着瞧。毫无困难的任务吸引不了真正的英雄。塔下地窖里有武器、绳索、网、盾牌，还有年轻捕龙手可能需要的急救用品。晚安，菲利普爵士。祝你成功。
        - id: ch03-b36
          speaker: narrator
          text: >-
            众人开始离去。女觊觎者还说，她知道该让谁来做公主。诺亚先生叫她在法庭上肃静，她偏说这里不是法庭。诺亚先生宣布正义所在便是法庭，又以藐视法庭的罪名命卫兵逮捕她。扭打和尖叫渐渐远去，最后，连她愤怒的声音也消失了。菲利普独自留在塔前。
    - id: ch04
      title: 发条巨龙
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            菲利普先登上塔顶，朝东西南北仔细查看。他看见诺亚先生和众人安稳待着的堡垒城墙，也看见远处的城市、塔楼，以及遇见佩林的废墟。废墟里有一样碧绿、细长又带关节的东西在动。那只能是龙。
        - id: ch04-b02
          speaker: philip
          text: 哎呀，我到底该怎么办？先看看有哪些武器吧。
        - id: ch04-b03
          speaker: narrator
          text: >-
            他一路跑到城堡最下面的地窖。屠龙可能用到的东西那里全有，甚至包括一副上好的望远镜，还有一本红皮小书，书名长得吓人，叫《少年捕龙手袖珍宝典，兼论屠龙佳趣之完全指南》。菲利普觉得塔顶最安全，便回到那里读书。书里的词又长，拼法又难，他好不容易才看懂一个要点：所有的龙都会在日落后睡一个钟头。
        - id: ch04-b04
          speaker: narrator
          text: >-
            废墟忽然传来响亮的哐啷声。菲利普皱紧眉头，用望远镜追着动静望去。才看一眼，他就猛地一震，差点扔掉望远镜。眉头随即松开，他发出一声像哭又像笑的叹息。
        - id: ch04-b05
          speaker: philip
          text: 原来是那个老家伙！
        - id: ch04-b06
          speaker: narrator
          text: >-
            那是一条硕大、细长又凶恶的绿龙，在柱间钻来钻去，移动时浑身哐啷作响，还拿身体磨蹭倒下的石柱。菲利普早就认识它。前年圣诞节，他收到一只发条蜥蜴，还把它放进自己和海伦合搭的城市。如今它像城里其他活物形象一样变大、复活了，却仍是发条玩具。肋边伸出一把钥匙，它蹭柱子正是为了转动钥匙，给自己上发条。可这种办法很慢。太阳落山时，发条还没上到一半，巨龙便立刻伏下睡着了。
        - id: ch04-b07
          speaker: philip
          text: 现在，我得好好想个办法。
        - id: ch04-b08
          speaker: narrator
          text: >-
            他想得比一生中任何一次都用力。主意拿定后，他从地窖取来长绳，又站了一会儿，问自己是否真有足够的勇气。接着他想起诺亚先生那句“起来吧，菲利普爵士”。骑士无论如何也不能害怕。于是他迎着越来越浓的暮色，向龙走去。
        - id: ch04-b09
          speaker: narrator
          text: >-
            他知道龙会沉睡一个钟头，可那毕竟是一条龙。幸好余光还照得见废墟，也照得见那十来码长的沉重身体。金属利爪映着最后的天光，巨嘴敞开，呼吸声像暴风雨夜里的大海。菲利普紧挨着龙身往前走，来到钥匙旁边。那正是佩林误认成断矛的东西。
        - id: ch04-b10
          speaker: philip
          text: 起来吧，菲利普爵士。现在可不能退缩。
        - id: ch04-b11
          speaker: narrator
          text: >-
            他把绳子一头牢牢系上钥匙，暗自庆幸海伦教过他打真正结实的结，而不是外婆结。龙纹丝不动，仍发出海潮般的呼吸声。菲利普再把另一头系上废墟坚固的主墙，然后用最快的速度奔回塔楼，擦亮火柴，点燃罗马焰火。
        - id: ch04-b12
          speaker: narrator
          text: >-
            这个计划相当聪明。龙醒来会发现自己被绳索困住，一定会发怒挣扎，也一定能够挣脱。可它只能把肋边的钥匙扯出来。没有钥匙，龙再也上不了发条，也就和死了差不多。要是诺亚先生坚持，菲利普还可以用银柄宝剑砍下它的头。
        - id: ch04-b13
          speaker: narrator
          text: >-
            计划进行到这里，简直无可挑剔。菲利普安心坐在塔顶，吃着口袋里散落的红毛醋栗。焰火点燃不到三分钟，南边升起金色火雨，东边转起巨大的焰火轮，北边一长列火箭仿佛北极光。红光、绿光和更多火箭照亮平原，数量比他在水晶宫见过的还多。火光里，一支队伍从堡垒走向平原中央的孤柱，把一个白色身影绑了上去。
        - id: ch04-b14
          speaker: philip
          text: 那大概就是公主。反正她现在还很安全。
        - id: ch04-b15
          speaker: narrator
          text: >-
            队伍退回堡垒，巨龙也醒了。它舒展长身，像出水的狗一样猛甩脑袋。菲利普猜它不喜欢焰火，这回他完全猜对了。接着，龙看见了公主。她恰好被绑在废墟和塔楼中间。
        - id: ch04-b16
          speaker: narrator
          text: >-
            巨龙仰起长嘴，发出一声足以摧毁一切的嚎叫。菲利普恐惧得一颤。无论是不是发条玩具，这只野兽此刻确实活着，而且危险得要命。它随即发现绳子绑住了自己，便上下翻滚，喷鼻咆哮，巨爪抓挠撕扯，可怕的尾巴四处抽打。成千上万朵焰火，把这场搏斗照得一清二楚。
        - id: ch04-b17
          speaker: narrator
          text: >-
            菲利普料中的事发生了。高墙没有倒，绳子没有断，巨龙也撑得住。最后松开的果然是钥匙。钥匙从龙肋边磨着锈涩的孔洞拔出，那声音像货车在支线上调车，带着回声传遍平原。钥匙仍系在绳端，像锚连着锚索。
        - id: ch04-b18
          speaker: narrator
          text: >-
            可菲利普漏算了一件事。巨龙睡着前已经上了一部分发条，方才的挣扎没有把动力耗尽。它还能动！龙怒吼一声，拖着碧绿哐啷的长身横穿平原，直冲公主而去。
    - id: ch05
      title: 屠龙勇士与公主
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            现在根本来不及考虑害不害怕。菲利普以生平最快的速度冲下塔梯。他平常下楼已经不慢，这一次更像飞一样。他把宝剑像枪那样扛在肩头，拔腿奔向公主。巨龙也朝同一个地方冲去，一人一龙开始赛跑。
        - id: ch05-b02
          speaker: narrator
          text: >-
            菲利普不停地跑，心脏重重敲打胸口，两只脚像噩梦里那样灌了铅。他觉得自己快死了。继续跑，快一点，再快一点，绝不能停。终于，他缓过第二口气，速度又提了起来。而巨龙似乎慢了一点，也可能只是他的错觉。
        - id: ch05-b03
          speaker: narrator
          text: >-
            菲利普后来再也想不起自己是怎样做到的。最后猛冲一阵，他终于来到公主被绑的柱子旁。巨龙只剩二十码远，还在逼近。他站住喘气。龙越来越慢，却毫无停下的意思。身后柱子旁，有人在轻声哭。
        - id: ch05-b04
          speaker: narrator
          text: >-
            巨龙已经近在眼前。菲利普朝前走了三步，举剑瞄准，闭紧眼睛，用全身力气砍了下去。一个坚硬沉重的东西撞翻了他。接下来的一段时间，他什么都不知道。
        - id: ch05-b05
          speaker: narrator
          text: >-
            再次醒来时，诺亚先生正用药杯给他灌一种难喝的药，佩林在拍他的背，周围所有人都像发疯一样欢呼，焰火放得比先前更多。那条巨龙就躺在他身边，一动不动，已经死了。
        - id: ch05-b06
          speaker: philip
          text: 真的是我杀了它吗？
          emotion: surprised
        - id: ch05-b07
          speaker: judge_noah
          text: >-
            的确是你。不管其余伟业完成得如何，这一项的英雄就是你。要是身体撑得住，请准备接受英勇与骑士精神的奖赏。
        - id: ch05-b08
          speaker: philip
          text: 原来还有奖赏？
        - id: ch05-b09
          speaker: judge_noah
          text: 只是惯常的奖赏，也就是公主。
        - id: ch05-b10
          speaker: narrator
          text: >-
            菲利普这才看见近旁站着一个蒙白面纱的身影。她脚边散着一段段割断的绳索。诺亚先生十分慷慨地宣布，公主从此归菲利普所有。
        - id: ch05-b11
          speaker: philip
          text: 可我不想要她。谢谢。
        - id: ch05-b12
          speaker: judge_noah
          text: >-
            你该早些想到。做完英勇事迹，不能再逃避奖赏。带她走吧，她是你的。
        - id: ch05-b13
          speaker: philip
          text: >-
            谁喜欢都可以带走她。既然她归我，我就能把她送人，对吧？我还有六项伟业，哪有工夫照管公主？
        - id: ch05-b14
          speaker: judge_noah
          text: >-
            那不归我管。你做其他伟业时，也许可以找人寄养她。眼下，她正等你牵住她的手，掀开面纱。
        - id: ch05-b15
          speaker: philip
          text: 非这样不可吗？好吧，那就来吧。
        - id: ch05-b16
          speaker: narrator
          text: >-
            菲利普一只手握住公主冰凉的小手，另一只手小心翼翼地挑起面纱一角。公主自己把面纱拉开。屠龙勇士与公主终于面对着面。
        - id: ch05-b17
          speaker: philip
          text: 怎么是你！原来不过是露西！
          emotion: surprised
