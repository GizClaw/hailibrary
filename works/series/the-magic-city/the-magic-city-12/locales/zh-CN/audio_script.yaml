audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖沉着，带一点机敏的幽默
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中
    philip:
      display_name: 菲利普
      tts:
        delivery: 直率敏感，想象丰富，情绪来得快
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    lucy:
      display_name: 露西
      tts:
        delivery: 开朗友好，坦率好奇
        timbre: 轻盈稚嫩
        pace: 轻快
        pitch: 中高
    polly:
      display_name: 波利
      tts:
        delivery: 机灵健谈，爱挖苦也很讲义气
        timbre: 清脆略带沙哑
        pace: 稍快
        pitch: 中高
    caesar:
      display_name: 尤利乌斯·凯撒
      tts:
        delivery: 威严克制，命令简洁而不容置疑
        timbre: 深沉洪亮
        pace: 从容
        pitch: 低
    pretenderette:
      display_name: 女觊觎者
      tts:
        delivery: 尖刻倔强，怒气之下藏着长期受冷落的委屈
        timbre: 干涩锐利
        pace: 稍快
        pitch: 中
    mr_noah:
      display_name: 诺亚先生
      tts:
        delivery: 一本正经又亲切，郑重中常带温和的幽默
        timbre: 温厚明朗
        pace: 适中
        pitch: 中低
    helen:
      display_name: 海伦
      tts:
        delivery: 温柔体贴，自然亲昵
        timbre: 柔和清亮
        pace: 适中
        pitch: 中
    roman_soldier_1:
      display_name: 罗马士兵甲
      tts:
        delivery: 军人式的庄严敬服
        timbre: 洪亮坚实
        pace: 适中
        pitch: 中低
    roman_soldier_2:
      display_name: 罗马士兵乙
      tts:
        delivery: 军人式的庄严敬服
        timbre: 洪亮坚实
        pace: 适中
        pitch: 中低
    roman_soldier_3:
      display_name: 罗马士兵丙
      tts:
        delivery: 军人式的庄严敬服
        timbre: 洪亮坚实
        pace: 适中
        pitch: 中低
    roman_soldier_4:
      display_name: 罗马士兵丁
      tts:
        delivery: 军人式的庄严敬服
        timbre: 洪亮坚实
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 军团归书
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            菲利普飞奔回监狱，露西已经等在门口。她只说了三个字，菲利普却一下明白了她为什么生气。
        - id: ch01-b02
          speaker: lucy
          text: 我讨厌你。
          emotion: angry
        - id: ch01-b03
          speaker: philip
          text: >-
            我也没办法呀。我只是很想靠自己做成一件事。
        - id: ch01-b04
          speaker: narrator
          text: 露西听了，也明白他的心思。
        - id: ch01-b05
          speaker: philip
          text: >-
            而且我本来就要回来找你。别再生气了，露。我把凯撒本人召了出来，你还能赶在他回到书里以前见见他。我们快去正义殿。我看见废墟里还剩一小段看台，躲在那里就能看清一切。路上你再想想，让鹰头马身有翼兽给诺亚先生捎什么话。
        - id: ch01-b06
          speaker: lucy
          text: >-
            那倒不必麻烦了。我早就把鹦鹉派去送信啦。
        - id: ch01-b07
          speaker: philip
          text: 你也没告诉我呀！这下我们算扯平了，对吧？
        - id: ch01-b08
          speaker: narrator
          text: >-
            露西心里小小地挣扎了一番。那种又别扭又为难的滋味，你一定也懂。最后，她还是答应了。
        - id: ch01-b09
          speaker: lucy
          text: 好吧，我们扯平了！
        - id: ch01-b10
          speaker: narrator
          text: >-
            两个孩子一同跑回正义殿。天越来越亮，城里也渐渐有了动静。女人到公共水泉打水，男孩子清扫小路和门阶。就算蛮族围住了城，这些日常的活也还是要做。雄鸡在啼，狗儿在叫，猫儿细声细气地讨清晨那碟牛奶。可露西和菲利普等的并不是这些声音。
        - id: ch01-b11
          speaker: narrator
          text: >-
            他们隔着这些亲切又熟悉的声息听啊，听啊，不停地听。另一种声音来得太慢了，没有哪一刻能让人断定，战斗就是从这一刻开始的。可是没过多久，那声音已经清清楚楚地压过一切。刀剑铿锵相击，士兵在两次挥剑之间喘着气呐喊。胜利者高声欢呼，失败者凄厉哀号。随后，奔跑的脚步声也响了起来。
        - id: ch01-b12
          speaker: narrator
          text: >-
            一个蛮族猛地从小街里蹿出，穿过广场，直奔正义殿。露西和菲利普就藏在殿内剩下的那段看台上。又来一个，又来一个。那些高大粗野的金发蛮族拼命逃跑，长发在身后飞扬，兽皮短袍上下翻卷。他们就像被追猎的野兽，一心想逃进坍塌的大殿藏身，而凯撒的军团正在后面追赶。
        - id: ch01-b13
          speaker: narrator
          text: >-
            那本大理石封面的巨书仍旧敞开着，像一座打开的墓穴。书的封面和十五张书页斜倚在正义殿门前高耸的断柱上。第一个蛮族纵身跳进书里，转眼就不见了。第二个、第三个紧跟着跳进去。接着，他们两个一伙、三个一群，又六七个挤成一堆，喘着气，叫喊着，一个接一个消失在书中。古罗马军号和喇叭的声音则越来越近。
        - id: ch01-b14
          speaker: narrator
          text: >-
            罗马士兵从全城各处涌来。最后一个蛮族刚一头扎进书里，他们便排成整齐的队伍，静静等了大约让人从一数到十那么久。然后，那个戴着月桂冠、身形清瘦、面庞瘦削的男人从军阵中间走来。
        - id: ch01-b15
          speaker: narrator
          text: >-
            一万两千柄长剑闪着光举向空中，起先像微风里的芦苇轻轻摇动，很快又一齐稳住。一万两千个人同时高呼起来。
        - id: ch01-b16
          speakers: [roman_soldier_1, roman_soldier_2, roman_soldier_3, roman_soldier_4]
          ensemble: chorus
          text: 凯撒万岁！
        - id: ch01-b17
          speaker: narrator
          text: >-
            罗马人不慌不忙，也没有片刻耽搁。他们穿过正义殿的废墟，来到大理石封面的巨书前，两人一排走进去，逐个消失。每名士兵经过这位伟大的征服者身边时，都带着骄傲而无声的敬意向他致敬。最后一名士兵也藏进书里以后，凯撒环顾四周，脸上微微露出眷恋。
        - id: ch01-b18
          speaker: lucy
          text: >-
            我一定要去跟他说话。我非去不可！他多可爱呀！
        - id: ch01-b19
          speaker: narrator
          text: >-
            露西沿着看台的台阶跑下去，径直奔到凯撒面前。凯撒含笑轻轻捏了捏她的耳朵。想想看，此后漫长的一生里，你听见世间所有声音时，用的都是一只曾被凯撒捏过的耳朵！
        - id: ch01-b20
          speaker: philip
          text: >-
            谢谢您，真的谢谢您！您太了不起了。下学期我一定拼命学拉丁文，好好读一读写您的那些书。
          emotion: happy
        - id: ch01-b21
          speaker: lucy
          text: 所有人都回去了吗？但愿谁也没有受伤。
        - id: ch01-b22
          speaker: narrator
          text: 凯撒笑了。
        - id: ch01-b23
          speaker: caesar
          text: >-
            一场大战以后还抱着这样的愿望，实在不合情理，我的孩子。不过这一次，不合情理的事偏偏一定会成真。没有人受伤。每个人都必须和离开书时一模一样地回去，不然学校里的老师们怎么办？现在外面只剩我的近卫军。他们押着那个放出蛮族的冒牌女人。瞧，他们来了。
    - id: ch02
      title: 凯撒的判决
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            女觊觎者缓缓走来，近卫军拔出长剑，把她严严实实地围在中间。凯撒向她致意，她却板着脸，满肚子不高兴。
        - id: ch02-b02
          speaker: caesar
          text: 向你致意，女人！
        - id: ch02-b03
          speaker: pretenderette
          text: 也向你致意吧，管你到底是谁！
        - id: ch02-b04
          speaker: caesar
          text: 我向你的勇气致意。
        - id: ch02-b05
          speaker: narrator
          text: >-
            菲利普和露西对望了一眼。他们以前从没想到，女觊觎者的确很勇敢。她独自来到陌生的国度，还一次又一次设法对付他们。要做这些事，确实需要勇气。接着，凯撒要她交代自己是怎么来到这里的。
        - id: ch02-b06
          speaker: caesar
          text: 现在告诉我，你是怎么来到这里的？
        - id: ch02-b07
          speaker: pretenderette
          text: >-
            我发现那小子又在摆建筑，本来想把它推倒，衣袖却只扫掉一两块砖。我也没留神，顺手又把砖搭了回去。后来我一阵头晕，整座东西竟然开始长大。烛台、砖头、多米诺骨牌，样样东西都越长越大，越长越大。我朝里面一看，那地方已经大得像一座教堂。那小子正在烛台柱子中间迷路，我就跟进去偷听。我想，别人能当解救者，我也能。正好我原本要戴着汽车面纱去赶两点三十七分的火车，拿它乔装再合适不过。
        - id: ch02-b08
          speaker: caesar
          text: 可你想伤害这两个孩子。
        - id: ch02-b09
          speaker: pretenderette
          text: >-
            我不是想说这些好让你饶过我。可刚开始时，我根本不觉得这里是真的，只当自己在做梦。人在梦里尽可以放纵那些邪恶念头，反正伤不着别人。
        - id: ch02-b10
          speaker: caesar
          text: 会伤到你自己。
        - id: ch02-b11
          speaker: pretenderette
          text: 那又有什么要紧？
        - id: ch02-b12
          speaker: caesar
          text: 后来你已经知道一切都是真的，却还是处处伤害孩子，叫他们为难。
        - id: ch02-b13
          speaker: pretenderette
          text: >-
            我看见有机会当女王，就把它抓住了。要是你真是尤利乌斯·凯撒，就是图书室里那尊半身像的本人，那你可没资格说我。说到底，你活着的时候，还不是能拿到什么就拿什么？你自己不也一样吗？
        - id: ch02-b14
          speaker: caesar
          text: 我还是要向你的勇气致意。
        - id: ch02-b15
          speaker: pretenderette
          text: >-
            用不着。如今我已经彻底输了，就算说出真话会送命，我也要把心里话说完。你根本不懂。你从没给别人当过仆人，不知道眼看别人把所有肥肉都吃光、只把骨头留给自己是什么滋味。只要我生在绅士的宅邸，不是生在工人模范住宅里，我也会被当成年轻小姐养大，也能穿镂花丝袜，衬裙上也会有漂亮的花边。你知道天天想着这些是什么滋味吗？
          emotion: angry
        - id: ch02-b16
          speaker: caesar
          text: >-
            你说得太深，我听不明白。现在我要宣判了。不过，生活早已给了你一种比我所能判的任何刑罚都更重的惩罚。没有人爱你。
        - id: ch02-b17
          speaker: pretenderette
          text: >-
            你这个老糊涂！你还看不出来吗？就是因为没人爱我，才会闹出这一切呀！
          emotion: angry
        - id: ch02-b18
          speaker: caesar
          text: >-
            我判你设法让人爱你。你会被带到勤快镇，教会大懒兽喜欢工作，每天八个玩耍钟头都不许它睡着。忙完以后，你还要试着喜欢上别人。哈尔玛棋子善良又温和，要喜欢他们并不难。等大懒兽爱上工作，哈尔玛棋子也喜欢你喜欢得舍不得你离开，你的惩罚就结束了。到那时，你想去哪里都可以。
          emotion: calm
        - id: ch02-b19
          speaker: pretenderette
          text: >-
            你明明知道，要是真到了那一天，我根本不会想去别的地方。
          emotion: angry
        - id: ch02-b20
          speaker: caesar
          text: 是的，我知道。
          emotion: calm
        - id: ch02-b21
          speaker: narrator
          text: >-
            女觊觎者流着泪，依然气得厉害。露西很想亲亲她，再告诉她自己很难过。可事情明明全是别人做错了，那些人又没有丝毫后悔，这时候就没法那么做。何况当着这么多人，那样做看起来还像故意卖弄。你一定完完全全明白露西当时的心情。
        - id: ch02-b22
          speaker: narrator
          text: >-
            女觊觎者被押走。凯撒转身面对两个孩子，伸出双手向他们告别。越来越亮的晨光照在脸上，仿佛让他的面容变了样。菲利普突然觉得，他像极了海伦嫁的“那个人”，彼得·格雷厄姆先生。他正提醒自己不要犯傻，露西却用响亮而嘶哑的声音叫起来，扑向凯撒。
        - id: ch02-b23
          speaker: lucy
          text: 爸爸！啊，爸爸！
          emotion: surprised
        - id: ch02-b24
          speaker: narrator
          text: >-
            就在这一刻，太阳升过城墙，红光照亮凯撒的头盔、胸甲、盾牌和长剑。强光像一记重击打在孩子们眼睛上。他们眼前一片眩白，只得闭紧双眼。等两个人迷迷糊糊地眨着眼睛重新睁开时，凯撒已经不见了。那本大理石巨书也已经合拢，而且永远不会再打开。
    - id: ch03
      title: 国王必须离开
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            三天以后，诺亚先生骑着大象来了。他和孩子们见面时有多激动、有多少话要说，还是像人们常讲的那样，留给各位自己想象吧。那样一定比我描述得更好。毕竟，故事讲到这里，已经没有多少时间再慢慢描写这些了。
        - id: ch03-b02
          speaker: narrator
          text: >-
            诺亚先生解释说，从女觊觎者和蛮族手里救出波利斯托波利斯，正好算作第七件大事。菲利普已经完成全部伟业，正式升到了国王的等级。先前降服大懒兽，也让他得到“菠萝王子”的称号。诺亚先生对他又感谢又钦佩，热情极了。菲利普知道这时说下面的话似乎不大知恩，可还是忍不住开口。
        - id: ch03-b03
          speaker: philip
          text: 现在七件大事都完成了，我可以回到海伦身边了吗？
        - id: ch03-b04
          speaker: mr_noah
          text: >-
            等时候到了，自然可以。不过眼下，我要立刻着手安排你的加冕礼。
        - id: ch03-b05
          speaker: narrator
          text: >-
            那场加冕礼辉煌得前所未见。宴会当然少不了，还有焰火。所有大炮都鸣放礼炮，士兵举枪致敬，女士们献上花束。最后，诺亚先生说了几句精心准备的话，所有人听得热泪盈眶。他把波利斯塔基亚的金冠戴到菲利普额头上，冠上的钻石和红宝石耀眼极了。露西也另外得到一顶王冠，由白银、珍珠和淡银色的月长石制成。波利斯塔基亚人的欢呼有多响，你绝对想象不到。
        - id: ch03-b06
          speaker: mr_noah
          text: >-
            现在，我很遗憾地告诉你们，我们必须分别了。波利斯塔基亚是共和国，共和国里当然不能有国王和王后。分别总是令人痛苦。你们最好立刻出发。
          emotion: sad
        - id: ch03-b07
          speaker: narrator
          text: 诺亚先生显然难过极了，谁都看得出这场分别让他十分不好受。
        - id: ch03-b08
          speaker: philip
          text: 这也太突然了。
        - id: ch03-b09
          speaker: lucy
          text: >-
            我觉得这真傻。事情这么急，我们到底该怎么回家？
        - id: ch03-b10
          speaker: mr_noah
          text: 你们当初怎么来的？
        - id: ch03-b11
          speaker: lucy
          text: 我们搭了一栋房子，然后走进去。
        - id: ch03-b12
          speaker: mr_noah
          text: >-
            那就把自己的房子再搭起来。你们住过的每一栋房子，我们都有模型，所有零件也编了号。你们只管照着号码拼好。
        - id: ch03-b13
          speaker: narrator
          text: >-
            诺亚先生领他们来到公共游乐厅后面的一间大屋子。他从架上取下一只结实的箱子，上面写着“庄园”。旁边另一只箱子标着“金链花小屋”。诺亚先生跪在自己的黄色垫子上，哗啦一下把箱里的东西全倒在地板上。菲利普和露西便动手搭房子。他们用的是制作精美的小砖、小石头、小梁木，还有小窗户和小烟囱。
        - id: ch03-b14
          speaker: mr_noah
          text: >-
            我真受不了眼看你们离开。再见，再见。以后偶尔想想我吧！
          emotion: sad
        - id: ch03-b15
          speakers: [philip, lucy]
          ensemble: duo
          text: 我们永远不会忘记您！
        - id: ch03-b16
          speaker: narrator
          text: 两个孩子跳起来，紧紧抱住诺亚先生。一路跟来的鹦鹉也开了口。
        - id: ch03-b17
          speaker: polly
          text: 再见！
        - id: ch03-b18
          speakers: [philip, lucy, polly, mr_noah]
          ensemble: chorus
          text: 再见，再见！
        - id: ch03-b19
          speaker: narrator
          text: 即使到了依依惜别的时候，菲利普仍没忘记那艘游艇。
        - id: ch03-b20
          speaker: philip
          text: 要是“闪电脱缰号”没有丢就好了。
        - id: ch03-b21
          speaker: mr_noah
          text: >-
            它没丢。你们一下船，它就直接飞回岛上了。船帆不也叫作翼吗？永不疲倦的白色双翼。少了你们的重量，那艘忠诚的游艇就像鸽子一样飞回了家。
        - id: ch03-b22
          speaker: philip
          text: 太好了！一想到它会留在洞穴里慢慢腐烂，我就难受。
          emotion: happy
        - id: ch03-b23
          speaker: lucy
          text: 真希望马克斯和布伦达也来跟我们道别。
        - id: ch03-b24
          speaker: mr_noah
          text: 没有这个必要。
        - id: ch03-b25
          speaker: narrator
          text: >-
            诺亚先生说得十分神秘。随后，屋里的每一个人又道了一遍再见。他卷起自己的黄色垫子，重新夹在腋下，转身走了。这一走，就再也没有回来。
    - id: ch04
      title: 回到庄园
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            孩子们继续搭建庄园。那栋漂亮房屋的模型终于完完整整地立在面前，每个细小的地方都搭好了。他们停下手，一动不动地站在那里，默默看了一会儿。
        - id: ch04-b02
          speaker: lucy
          text: >-
            要是我们每个人都能变成两个就好了。一个菲利普和一个露西回家，另一个菲利普和另一个露西留下。啊！
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: >-
            露西突然抓住菲利普的胳膊，一阵轻微而奇怪的眩晕攫住了她。菲利普也脚步不稳地晃了一下，站在那里用手按住额头。两个孩子茫然地环顾四周，脑袋仍有些发晕。屋子不见了，庄园模型也不见了。头顶是蓝天，脚下是绿草。真正的庄园就在眼前，大门敞开，海伦和彼得·格雷厄姆先生站在门前台阶上。
        - id: ch04-b04
          speaker: narrator
          text: 那封电报把他们带回了家。
        - id: ch04-b05
          speaker: narrator
          text: >-
            你也许会问，露西后来怎样解释自己走失以后去了哪里。她从没有解释。你也知道，有些事本来就没法解释。更奇怪的是，也从没有人追问。大人们一定以为自己早就知道全部经过。可他们所知道的，当然离真相远着呢。
        - id: ch04-b06
          speaker: narrator
          text: >-
            门前台阶上的四个人终于说完重逢有多么令人高兴。菲利普和露西从波利斯塔基亚回来的这一天，正好也是海伦和彼得·格雷厄姆先生从比利时归来的日子。海伦告诉孩子们，他们还带了礼物。
        - id: ch04-b07
          speaker: helen
          text: >-
            我们给你们每人都带了一份最可爱的礼物。彼得，劳驾去把它们带来吧。
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: >-
            彼得·格雷厄姆先生走进马厩院子。再回来时，两条棕黄色、身子长长的腊肠犬紧跟在他身后。它们一看见孩子们就飞奔过来，又蹦又跳，亲热地围着他们撒欢。这副模样，孩子们实在熟悉极了。
        - id: ch04-b09
          speaker: philip
          text: >-
            是马克斯！是布伦达！海伦，它们是送给我们的吗？
          emotion: surprised
        - id: ch04-b10
          speaker: helen
          text: >-
            当然是呀，亲爱的。不过，你怎么会知道它们的名字？
        - id: ch04-b11
          speaker: narrator
          text: >-
            这也是菲利普当时不能说出来的事情之一。后来，他把整个故事都告诉了海伦。海伦说，这个故事太神奇了，菲利普竟然能把它全编出来，实在聪明。等他长大成人，一定能当一名作家，写出一本本书。
        - id: ch04-b12
          speaker: helen
          text: >-
            你知道吗，我真的梦见过那座岛。那个梦很长，可醒来后，我只记得自己去过那里，还见到了你。诺亚先生和其他所有事，我一定也梦见了，只是后来全忘了。
    - id: ch05
      title: 故事的结局
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            马克斯和布伦达当然爱每一个人，它们的性情一点也没有变。只是孩子们已经忘记了动物的语言，从此再也不可能和两条狗交谈。不过，你说出口的每一个字，马克斯和布伦达其实全都听得懂。这件事任谁都看得出来。
        - id: ch05-b02
          speaker: narrator
          text: >-
            你还想知道，那个红头发、长着一双钢铁般眼睛的保姆，那个惹出无数是非和麻烦的女觊觎者，后来怎么样了吗？我想，她依然和哈尔玛棋子住在一起。她教大懒兽喜欢工作，也学习着去喜欢别人，而这正是获得幸福的唯一办法。不管怎样，我认识的人当中，谁也没有在别的地方见过她。
        - id: ch05-b03
          speaker: narrator
          text: 故事到这里，就全部讲完了。
