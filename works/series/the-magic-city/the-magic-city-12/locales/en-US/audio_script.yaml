  chapters:
    - id: ch01
      title: CHAPTER XII. THE END
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Philip raced back to the prison. Lucy was waiting at the door.
        - id: ch01-b02
          speaker: lucy
          text: >-
            I hate you.
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: >-
            She did not need to say why. Philip understood.
        - id: ch01-b04
          speaker: philip
          text: >-
            I couldn't help it. I wanted to do one thing on my own.
        - id: ch01-b05
          speaker: narrator
          text: >-
            And Lucy understood that.
        - id: ch01-b06
          speaker: philip
          text: >-
            Besides, I came back for you. Don't be snarky, Lu. I called up Caesar himself! You can see him before he returns to the book. If we're quick, we can hide in what's left of the Justice Hall gallery and watch everything. Come on. We also need to decide what the Hippogriff should tell Mr. Noah.
        - id: ch01-b07
          speaker: lucy
          text: >-
            No need. I sent the parrot ages ago.
        - id: ch01-b08
          speaker: philip
          text: >-
            And you never told me! So now we're even, aren't we?
        - id: ch01-b09
          speaker: narrator
          text: >-
            Lucy wrestled briefly with herself. You know how unpleasant those little struggles can be.
        - id: ch01-b10
          speaker: lucy
          text: >-
            Right-o!
        - id: ch01-b11
          speaker: narrator
          text: >-
            Together they ran back to the Justice Hall and hid in the part of the gallery still standing. The sky grew lighter by the moment, and the city began to stir. Women came down to draw water at the public fountains. Boys swept the paths and doorsteps. Even with barbarians surrounding the town, everyday work still had to be done. All the usual sounds of a waking city reached Philip and Lucy as they waited. They heard cocks crowing, dogs barking, and cats giving faint mews for their morning milk. But those were not the sounds the children were waiting for.
        - id: ch01-b12
          speaker: narrator
          text: >-
            They listened through all those familiar morning noises. They listened and listened. The other sound grew so gradually that neither child could have said exactly when it began. Soon there was no mistaking it. Steel rang against steel. Men shouted in the breathless pauses between sword strokes. Victory cries rose beside the wails of defeat.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Then came the sound of running feet.
        - id: ch01-b14
          speaker: narrator
          text: >-
            A man burst from a side street and dashed across the square toward the ruined hall where the children hid in the gallery. Another followed, then another. Each one ran for the ruins as a hunted creature runs for shelter. They were the barbarians, big, rough, and fair-haired, with long hair flying behind them and animal-skin tunics flapping as they ran. Caesar's legions were driving them on. The great marble-covered book still stood open like a marble tomb. Its cover and fifteen leaves leaned against the tall, broken columns at the gateway.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The first barbarian leaped into the open book and vanished. The next went after him, and then another. Soon they were jumping in by twos and threes, then sixes and sevens. One after another, they disappeared between those waiting pages. All the while they gasped and shouted, and the sound of Rome's curved war horn and trumpets swept closer.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Roman soldiers poured in from every part of the city. The last barbarian plunged headfirst into the book. Then the Romans formed neat lines and waited for the space of ten counts. Between those lines came a spare man with a thin face and a laurel crown.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Twelve thousand swords flashed overhead. For a moment they swayed like reeds in a breeze. Then they held still, and twelve thousand voices gave one shout.
        - id: ch01-b18
          speakers: [roman_soldier_1, roman_soldier_2, roman_soldier_3]
          ensemble: chorus
          text: >-
            Ave Caesar!
        - id: ch01-b19
          speaker: narrator
          text: >-
            Without hurrying and without delay, the Romans marched through the ruins toward the marble-covered book. They entered it two by two, and every pair disappeared. As each soldier passed the mighty conqueror, he gave Caesar a proud, silent salute. The long procession continued until not one soldier remained outside.
        - id: ch01-b20
          speaker: narrator
          text: >-
            When the final soldier had gone into the book, Caesar looked around with a touch of sadness.
        - id: ch01-b21
          speaker: lucy
          text: >-
            I must talk to him. I simply must! Oh, he's a darling!
          emotion: happy
        - id: ch01-b22
          speaker: narrator
          text: >-
            Lucy ran down the gallery steps and straight to Caesar. He smiled and gently pinched her ear. Just imagine going through life knowing that the ear which heard every voice in the world had once been pinched by Caesar!
        - id: ch01-b23
          speaker: philip
          text: >-
            Thank you! That was splendid. Next term I'll work at my Latin as hard as I can, so I can read all about you.
          emotion: happy
        - id: ch01-b24
          speaker: lucy
          text: >-
            Did everyone get into the book? I hope no one was hurt.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Caesar smiled.
        - id: ch01-b26
          speaker: caesar
          text: >-
            That is a most unreasonable hope after a great battle, my child. But this once, the unreasonable had to happen. Nobody was hurt. Every man had to go back into the book exactly as he came out. Otherwise, what would the schoolmasters do? Only my own guard remains. They are bringing the false woman who released the barbarians. Here they come now.
        - id: ch01-b27
          speaker: narrator
          text: >-
            The Pretenderette walked slowly toward them, surrounded by guards with drawn swords.
        - id: ch01-b28
          speaker: caesar
          text: >-
            Hail, woman!
        - id: ch01-b29
          speaker: pretenderette
          text: >-
            Hail, whoever you are!
          emotion: angry
        - id: ch01-b30
          speaker: narrator
          text: >-
            She spoke very sulkily.
        - id: ch01-b31
          speaker: caesar
          text: >-
            I salute your courage.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Philip and Lucy exchanged a look. The Pretenderette really did have courage. They had never thought of that before. She had faced them alone in a strange country and made attempt after attempt against them. Yes, that had taken courage.
        - id: ch01-b33
          speaker: caesar
          text: >-
            Now tell me how you came here.
        - id: ch01-b34
          speaker: pretenderette
          text: >-
            I found him building again and meant to pull it down. My sleeve knocked over a brick or two, and without thinking, I put them back. Then I felt dizzy. The whole thing started growing. The candlesticks, bricks, dominoes, everything got bigger and bigger. By the time I looked inside, it was as large as a church. I saw that boy lose his way among the candlestick pillars, so I followed him and listened. I decided I could be as good a Deliverer as anyone. And the motor veil I meant to wear for the two thirty-seven train made a fine disguise.
        - id: ch01-b35
          speaker: caesar
          text: >-
            You tried to harm the children.
        - id: ch01-b36
          speaker: pretenderette
          text: >-
            I'm not saying this so you'll let me off, but at first I thought none of it was real. I thought I was dreaming. You can let your wicked feelings loose in a dream, and no one gets hurt.
        - id: ch01-b37
          speaker: caesar
          text: >-
            You get hurt.
        - id: ch01-b38
          speaker: pretenderette
          text: >-
            Oh, that doesn't matter.
        - id: ch01-b39
          speaker: caesar
          text: >-
            Even after you knew it was real, you kept trying to harm and confuse these children.
        - id: ch01-b40
          speaker: pretenderette
          text: >-
            I saw my chance to be Queen, and I took it. If you really are Julius Caesar, like that bust in the library, you have no right to lecture me. You took everything you could get in your day too.
        - id: ch01-b41
          speaker: caesar
          text: >-
            Again, I salute your courage.
        - id: ch01-b42
          speaker: pretenderette
          text: >-
            Don't bother. My game's over, and I'll speak my mind even if I die for it. You don't understand. You've never been a servant, watching other people get all the fat while you get the bones. If I'd only been born in a gentleman's mansion instead of a model worker's house, I'd have grown up a young lady. I'd have openwork silk stockings and lace on my petticoats.
          emotion: angry
        - id: ch01-b43
          speaker: caesar
          text: >-
            That goes too deep for me.
        - id: ch01-b44
          speaker: narrator
          text: >-
            A ghost of a smile crossed Caesar's face.
        - id: ch01-b45
          speaker: caesar
          text: >-
            I will give you your sentence now. But life has already sentenced you more harshly than I ever could. Nobody loves you.
        - id: ch01-b46
          speaker: narrator
          text: >-
            The Pretenderette burst into angry tears.
        - id: ch01-b47
          speaker: pretenderette
          text: >-
            You silly old man! Can't you see that's why all of this happened?
          emotion: angry
        - id: ch01-b48
          speaker: caesar
          text: >-
            Your punishment is to make yourself loved. You will go to Briskford. There you must teach the Great Sloth to enjoy his work and keep him awake through eight play-hours every day. Between those tasks, you must try to care for someone. The Halma people are kind and gentle, so they will not be hard to love. Your penance will end when the Great Sloth loves his work and the Halma people are so fond of you that they cannot bear to lose you. Then you may go wherever you wish.
        - id: ch01-b49
          speaker: pretenderette
          text: >-
            You know perfectly well that if all that happened, I wouldn't want to go anywhere else.
          emotion: angry
        - id: ch01-b50
          speaker: caesar
          text: >-
            Yes. I know.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Lucy wanted to kiss the Pretenderette and tell her she was sorry. But you cannot do that when the trouble is someone else's fault and that person is not sorry. Besides, with everyone watching, it would have looked like showing off. You know exactly how Lucy felt.
        - id: ch01-b52
          speaker: narrator
          text: >-
            The guards led the Pretenderette away. Caesar faced the children and held out his hands in farewell. Early morning light transformed his face. Suddenly, Philip thought it looked remarkably like the face of that man, Mr. Peter Graham, whom Helen had married. Philip was just telling himself not to be a duffer when Lucy cried out in a loud, cracking voice.
        - id: ch01-b53
          speaker: lucy
          text: >-
            Daddy! Oh, Daddy!
          emotion: surprised
        - id: ch01-b54
          speaker: narrator
          text: >-
            She sprang forward. At that instant, the sun rose above the city wall. Red light gleamed on Caesar's helmet, breastplate, shield, and sword. It struck the children's eyes like a blow. They shut their eyes against the glare. When they opened them again, blinking and bewildered, Caesar had vanished. The marble book was closed forever.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Three days later, Mr. Noah arrived on an elephant. You can imagine his meeting with the children better than it can be described, which is fortunate, because there is not much time left for descriptions now. He explained that freeing Polistopolis from the Pretenderette and the barbarians counted as Philip's seventh deed. Philip had now earned the rank of King. His deed with the Great Sloth had already given him the title Prince of Pineapples. Mr. Noah thanked him warmly and praised him with the greatest admiration. That made Philip feel rather ungrateful for asking the one question he could not hold back.
        - id: ch01-b56
          speaker: philip
          text: >-
            Now that I've finished all the deeds, may I go back to Helen?
        - id: ch01-b57
          speaker: mr_noah
          text: >-
            Everything in its proper time. I shall begin arranging your coronation at once.
        - id: ch01-b58
          speaker: narrator
          text: >-
            The coronation was more splendid than any other. Naturally, there was a banquet. Fireworks burst overhead. Every gun fired a salute, the soldiers presented arms, and the ladies presented bouquets. At the end, Mr. Noah spoke a few carefully chosen words that brought tears to every eye. Then he set the golden crown of Polistarchia on Philip's head. Its diamonds and rubies shone dazzlingly. There was another crown for Lucy, made of silver, pearls, and pale, silvery moonstones. You cannot imagine how loudly the people of Polistarchia cheered.
        - id: ch01-b59
          speaker: mr_noah
          text: >-
            And now, I am sorry to tell you that we must part. Polistarchia is a republic, and republics cannot allow kings and queens to remain. Parting is painful. You had better leave at once.
          emotion: sad
        - id: ch01-b60
          speaker: narrator
          text: >-
            Mr. Noah was plainly very upset.
        - id: ch01-b61
          speaker: philip
          text: >-
            But this is so sudden.
          emotion: surprised
        - id: ch01-b62
          speaker: lucy
          text: >-
            I think it's silly. How are we supposed to get home in such a hurry?
        - id: ch01-b63
          speaker: mr_noah
          text: >-
            How did you come here?
        - id: ch01-b64
          speaker: philip
          text: >-
            We built a house and went inside it.
        - id: ch01-b65
          speaker: mr_noah
          text: >-
            Then build your own house. We have models of every house you have ever entered. All the pieces are numbered. You need only fit them together.
        - id: ch01-b66
          speaker: narrator
          text: >-
            Mr. Noah led them to a large room behind the hall of Public Amusements. The shelves there held models of houses they had known. He lifted down a sturdy box marked "The Grange." On another box nearby, Philip saw the words "Laburnum Cottage."
        - id: ch01-b67
          speaker: narrator
          text: >-
            Mr. Noah knelt on his yellow mat and emptied the box onto the floor. Philip and Lucy began building with beautifully made little blocks, stones, beams, windows, and chimneys.
        - id: ch01-b68
          speaker: mr_noah
          text: >-
            I cannot bear to watch you leave. Good-bye, good-bye. Please remember me sometimes!
          emotion: sad
        - id: ch01-b69
          speakers: [philip, lucy]
          ensemble: duo
          text: >-
            We'll never forget you!
          emotion: sad
        - id: ch01-b70
          speaker: narrator
          text: >-
            The children jumped up and hugged him.
        - id: ch01-b71
          speaker: parrot
          text: >-
            Good-bye!
        - id: ch01-b72
          speakers: [philip, lucy, mr_noah, parrot]
          ensemble: chorus
          text: >-
            Good-bye, good-bye!
        - id: ch01-b73
          speaker: philip
          text: >-
            I still wish the Lightning Loose hadn't been lost.
          emotion: sad
        - id: ch01-b74
          speaker: narrator
          text: >-
            Even during that sad farewell, he remembered the yacht.
        - id: ch01-b75
          speaker: mr_noah
          text: >-
            She was not lost. As soon as you left her, she flew back to the island. Sails are called wings, are they not? White wings that never tire. Once your weight was gone, that faithful yacht flew home like a pigeon.
        - id: ch01-b76
          speaker: philip
          text: >-
            Hooray! I couldn't stand thinking of her rotting in a cavern.
          emotion: happy
        - id: ch01-b77
          speaker: lucy
          text: >-
            I wish Max and Brenda had come to say good-bye.
          emotion: sad
        - id: ch01-b78
          speaker: mr_noah
          text: >-
            There is no need.
        - id: ch01-b79
          speaker: narrator
          text: >-
            He said it mysteriously. Everyone exchanged good-byes once more. Then Mr. Noah rolled up his yellow mat, tucked it under his arm, and went away forever.
        - id: ch01-b80
          speaker: narrator
          text: >-
            The children finished building the Grange. When the perfect little model stood before them, they stopped and looked at it.
        - id: ch01-b81
          speaker: lucy
          text: >-
            I wish there could be two of each of us, so one Philip and one Lucy could go home while the others stayed here. Oh!
          emotion: surprised
        - id: ch01-b82
          speaker: narrator
          text: >-
            Lucy suddenly grabbed Philip's arm. A strange, slight dizziness had come over her. Philip swayed too and pressed a hand to his head. For a moment, neither of them stood quite steadily. Still dizzy and confused, they stared around them. The room had disappeared, and the little model of the Grange was gone with it. Blue sky stretched overhead. Green grass lay under their feet. In front of them stood the real Grange, with its front door wide open. Helen and Mr. Peter Graham were waiting on the steps.
        - id: ch01-b83
          speaker: narrator
          text: >-
            The telegram had brought them home.
        - id: ch01-b84
          speaker: narrator
          text: >-
            You may wonder how Lucy explained where she had been while she was lost. She never explained it at all. Some things, as you know, simply cannot be explained. The strange part is that nobody ever asked her for an explanation. The grown-ups must have believed they already knew all about it, though of course they were very far from the truth.
        - id: ch01-b85
          speaker: narrator
          text: >-
            That same day, Philip and Lucy came home from Polistarchia while Helen and Mr. Peter Graham came home from Belgium. When all four had finished saying how glad they were to see each other, Helen spoke.
        - id: ch01-b86
          speaker: helen
          text: >-
            We brought each of you the loveliest present. Peter, dear, would you fetch them?
          emotion: happy
        - id: ch01-b87
          speaker: narrator
          text: >-
            Mr. Peter Graham went to the stable yard. He returned with two long, tan dachshunds behind him. They rushed at the children, frisking and fawning in a way Philip and Lucy knew very well.
        - id: ch01-b88
          speaker: philip
          text: >-
            Why, it's Max and Brenda! Oh, Helen, are they really ours?
          emotion: surprised
        - id: ch01-b89
          speaker: helen
          text: >-
            Yes, dear, of course they are. But how did you know their names?
        - id: ch01-b90
          speaker: narrator
          text: >-
            That was one of the things Philip could not tell her then. Later, he did tell Helen the whole story from beginning to end. She said it was wonderful. She also thought he had been very clever to make it all up. When he was a man, she told him, he might become an author and write books of his own.
        - id: ch01-b91
          speaker: helen
          text: >-
            And do you know, I dreamed about the island. It was quite a long dream, but when I woke up, I could only remember being there and seeing you. I probably dreamed about Mr. Noah and everything else too, then forgot it.
        - id: ch01-b92
          speaker: narrator
          text: >-
            Max and Brenda loved everyone, of course. Their natures had not changed at all. Only the children had forgotten the language of animals, so they could never talk with the dogs again. But Max and Brenda understand every word you say. Anyone can see that.
        - id: ch01-b93
          speaker: narrator
          text: >-
            And what became of the redheaded, steely-eyed nurse, the Pretenderette, who caused so much trouble? I suppose she still lives with the Halma people. She is teaching the Great Sloth to enjoy his work and learning to care for people, which is the only way to be happy. At any rate, no one I know has ever seen her anywhere else again.
        - id: ch01-b94
          speaker: narrator
          text: >-
            And that is the end.
