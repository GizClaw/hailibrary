  chapters:
    - id: ch01
      title: CHAPTER VI. THE LIONS IN THE DESERT
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Dinner was no painted wooden make-believe. Philip and Lucy had real roast guinea-fowl and angel pudding. As they ate, Philip asked Mr. Noah a question.
        - id: ch01-b02
          speaker: philip
          text: >-
            Why do you serve wooden food at your banquets?
        - id: ch01-b03
          speaker: mr_noah
          text: >-
            A banquet is a very important occasion. Real food, the sort you can eat and enjoy, distracts people from the serious business of life. Many successful caterers in your world understand that perfectly.
        - id: ch01-b04
          speaker: lucy
          text: >-
            Then why do you put out those big silver bowls when there's nothing inside them?
        - id: ch01-b05
          speaker: narrator
          text: >-
            Mr. Noah sighed.
        - id: ch01-b06
          speaker: mr_noah
          text: >-
            Those bowls are meant for dessert.
        - id: ch01-b07
          speaker: lucy
          text: >-
            But they don't have any dessert in them.
        - id: ch01-b08
          speaker: mr_noah
          text: >-
            No. That is the trouble. There is no dessert, and there never has been. Would you care for some more angel pudding?
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: >-
            The children could tell that this subject made him sad and that he wanted to leave it alone. They were too polite to press him. Though they had already eaten quite enough, they both said yes to more angel pudding and let the matter rest.
        - id: ch01-b10
          speaker: narrator
          text: >-
            After dinner Mr. Noah took them through the town to visit the factories. This surprised Philip. He had been taught not to make factories with his bricks because factories were ugly. These were nothing like the ones he knew. They were pleasant, long, low houses, with tall French windows opening onto rose gardens. Inside, people from every nation made things that were both beautiful and useful. They loved their work, and every one of them looked clean and happy.
        - id: ch01-b11
          speaker: philip
          text: >-
            I wish our factories were like these. Ours are terribly ugly. Helen says so too.
        - id: ch01-b12
          speaker: mr_noah
          text: >-
            That is because yours are all money factories, whatever names people give them. Here, everyone must make something useful and beautiful, not merely money or something sold for money.
        - id: ch01-b13
          speaker: lucy
          text: >-
            Does that rule include you?
        - id: ch01-b14
          speaker: mr_noah
          text: >-
            It certainly does.
        - id: ch01-b15
          speaker: lucy
          text: >-
            What do you make, then?
        - id: ch01-b16
          speaker: mr_noah
          text: >-
            Laws, of course. Surely you knew I was the Chief Judge?
        - id: ch01-b17
          speaker: lucy
          text: >-
            Can a law really be useful and beautiful?
        - id: ch01-b18
          speaker: mr_noah
          text: >-
            It can certainly be useful, and my laws are beautiful too. Here is one. Everyone must try to be kind to everyone else. Anyone who has been unkind must be sorry and say so.
        - id: ch01-b19
          speaker: philip
          text: >-
            It sounds sensible, but I wouldn't call it beautiful.
        - id: ch01-b20
          speaker: mr_noah
          text: >-
            Perhaps it does not sound beautiful. I never could write poetry. But when people obey that law, it is beautiful.
          emotion: sad
        - id: ch01-b21
          speaker: philip
          text: >-
            Oh, you mean the law becomes beautiful when people keep it.
        - id: ch01-b22
          speaker: mr_noah
          text: >-
            A beautiful thing cannot stay beautiful when it is broken. That goes for laws as well. Of course, an ugly law is different. An ugly law becomes beautiful only when someone breaks it. Very odd, isn't it? Laws are tricky things.
        - id: ch01-b23
          speaker: narrator
          text: >-
            They were climbing steep steps between trees in pots when Philip suddenly asked about his next deed.
        - id: ch01-b24
          speaker: philip
          text: >-
            Couldn't we begin another deed now? I don't feel that I've done anything today. Lucy was the one who managed the carpet. Please tell us what comes next.
        - id: ch01-b25
          speaker: mr_noah
          text: >-
            The next deed may take quite a while, but you may begin today. It is especially suited to a baronet. I cannot say why. It may be the only thing baronets are good for. Thoughtful people have always found their existence rather hard to explain. Perhaps this deed is the wise purpose for which baronets were designed.
        - id: ch01-b26
          speaker: philip
          text: >-
            Maybe so, but what is that purpose?
        - id: ch01-b27
          speaker: mr_noah
          text: >-
            I do not know the purpose. I do know the deed. You must travel to the land of the Dwellers by the Sea and use whatever means seem best to slay their fear.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Philip asked what the Dwellers feared.
        - id: ch01-b29
          speaker: mr_noah
          text: >-
            They will tell you. I can only say that their fear is very great.
        - id: ch01-b30
          speaker: lucy
          text: >-
            Will it frighten us as well?
        - id: ch01-b31
          speaker: philip
          text: >-
            So you really mean to come? You weren't supposed to come if you were afraid. Girls aren't expected to be brave.
        - id: ch01-b32
          speaker: mr_noah
          text: >-
            Here they are. Girls are expected to be brave, and boys are expected to be kind.
        - id: ch01-b33
          speaker: philip
          text: >-
            Oh.
        - id: ch01-b34
          speaker: lucy
          text: >-
            Of course I'm coming. You know you promised.
        - id: ch01-b35
          speaker: narrator
          text: >-
            That settled it. Mr. Noah rubbed his hands, delighted by all the work ahead.
        - id: ch01-b36
          speaker: mr_noah
          text: >-
            We must equip you properly. The Dwellers by the Sea live a very long way from here. What would you like to ride?
        - id: ch01-b37
          speaker: philip
          text: >-
            A horse!
          emotion: happy
        - id: ch01-b38
          speaker: narrator
          text: >-
            Philip was truly pleased by the question. He chose a horse because he certainly did not want a donkey. Besides, he had never seen anyone ride anything except those two animals, so no other answer occurred to him.
        - id: ch01-b39
          speaker: mr_noah
          text: >-
            Good. I was afraid you might ask for a bicycle. By a dreadful law that was made by mistake, anyone who asks for machinery must accept it and keep using it. But a horse may not do either. You have a three-day journey across the Pebbly Waste. Come and see the stables.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The stables looked like the long toy shed you might once have kept for wooden horses and carts. Stall after stall ran down its length. But these stalls held more than horses. Every sort of animal that anyone had ever ridden stood there. There were elephants, camels, donkeys, mules, bulls, goats, zebras, tortoises, ostriches, bisons, and pigs.
        - id: ch01-b41
          speaker: narrator
          text: >-
            The final stall was not ordinary wood. It was made of beaten silver. Inside stood the Hippogriff himself, with a long white mane, a long white tail, and gentle, beautiful eyes. His white wings lay neatly folded across his satin-smooth back. Philip could not imagine how either Hippogriff or silver stall had arrived. The other creatures were living Noah's Ark animals and plainly looked it. The Hippogriff did not belong to the Ark at all.
        - id: ch01-b42
          speaker: mr_noah
          text: >-
            He came out of one of the books you used when you built your city.
        - id: ch01-b43
          speaker: lucy
          text: >-
            May we ride him? He looks like such a darling.
        - id: ch01-b44
          speaker: narrator
          text: >-
            The Hippogriff turned his soft white nose toward Lucy and nuzzled her, as if thanking her for the compliment.
        - id: ch01-b45
          speaker: mr_noah
          text: >-
            Not when both of you are going. He can carry only one person unless one of his riders is an Earl. I recommend a camel.
        - id: ch01-b46
          speaker: lucy
          text: >-
            Can one camel carry us both?
        - id: ch01-b47
          speaker: mr_noah
          text: >-
            Naturally. A camel is the ship of the desert, and a ship that carried only one person would be quite absurd.
        - id: ch01-b48
          speaker: narrator
          text: >-
            That decided the matter. They chose a very large camel, and Mr. Noah saddled and bridled it with his own hands. When the camel was ready, Mr. Noah stood thoughtfully beside it, holding the lead rope and considering every other thing a proper expedition ought to carry.
        - id: ch01-b49
          speaker: mr_noah
          text: >-
            You will need dogs for emergencies.
        - id: ch01-b50
          speaker: philip
          text: >-
            I always want dogs.
          emotion: happy
        - id: ch01-b51
          speaker: narrator
          text: >-
            Mr. Noah whistled. Two Noah's Ark dachshunds sprang to the ends of their chains. Both were very long and low. One was a little larger and browner than the other.
        - id: ch01-b52
          speaker: mr_noah
          text: >-
            This boy is your master, and this girl is your mistress.
        - id: ch01-b53
          speaker: narrator
          text: >-
            The dogs crowded fondly around the children. Mr. Noah began listing everything else they would need. There must be food and drink, tents, and umbrellas in case the weather turned bad. Then he broke off and led everyone to a shop around the corner. Its sign promised that the Universal Provider could equip an expedition at a moment's notice, with punctuality and dispatch.
        - id: ch01-b54
          speaker: narrator
          text: >-
            The shopkeeper came forward. He looked so exactly like Mr. Noah that the children knew at once who he must be.
        - id: ch01-b55
          speaker: provider
          text: >-
            Well, Father?
        - id: ch01-b56
          speaker: mr_noah
          text: >-
            Children, this is my son. He has some experience in preparing outfits.
        - id: ch01-b57
          speaker: provider
          text: >-
            What are you starting with?
        - id: ch01-b58
          speaker: mr_noah
          text: >-
            Two dogs, two children, and one camel. I know two of everything is customary, but one camel is quite as much as Sir Philip can manage.
        - id: ch01-b59
          speaker: narrator
          text: >-
            His son dutifully supposed that Father knew best. He willingly promised to supply every single thing the expedition required. The outfit would even include one best-quality talking parrot. All the goods would be carefully packed, and every parcel would arrive within half an hour.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Soon Philip and Lucy, who still wore her fairy dress, sat among all their belongings on top of the huge, swaying camel. The usual grand procession led them out of the city. Seven bands marched with them, all playing “See the Conquering Hero Goes.” It was not the tune you know, but quite another tune whose name happens to sound a little like it.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Camel, children, and baggage were a very tight fit for the gateway they happened to use. Philip and Lucy had to stoop low or scrape their heads against the top of the arch. They made it safely through. Outside, the road was hardly more than a field path crossing the flowering meadows where the dragon had died. Stonehenge and the great tower stood far to their left. Straight ahead stretched the vast and fascinating Absolutely Unknown.
        - id: ch01-b62
          speaker: narrator
          text: >-
            The sun shone overhead. There truly was a sun in this country. Mr. Noah had explained that it came from the poetry books, along with rain, flowers, and the changing seasons. The camel walked as though it might tumble at every step, then somehow decided all was well, though everyone had better be careful. Even so, the children were very happy. The dogs bounded beside them in the best of spirits. Even Humpty seemed less troubled than usual by the proud sadness you may have noticed in camels at the Zoo.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Riding a camel felt very grand, though Lucy tried not to wonder how she would ever climb down or get back up. The parrot was interesting too, and it spoke extremely well. If you can make a parrot understand you, it can explain what other animals say, since it knows their language naturally. This particular parrot refused ordinary conversation. Whenever anyone questioned it, it answered by reciting long, rather dull poetry.
        - id: ch01-b64
          speaker: polly
          text: >-
            Arms and the man I sing...
        - id: ch01-b65
          speaker: narrator
          text: >-
            The poem began with arms and a man, then went on to say something about haughty Juno. The parrot's voice was soothing. Riding Humpty felt rather like being rocked in a cradle, though an unusually bumpy one. The children sat securely inside padded baskets, and they had already lived through a very exciting day. Before long, both of them fell asleep. The sun set quite soon afterward, and Polly spoke to the nearest dog.
        - id: ch01-b66
          speaker: polly
          text: >-
            Max, they've both gone to sleep.
        - id: ch01-b67
          speaker: max
          text: >-
            No wonder. We'll be all right. Humpty knows the road.
        - id: ch01-b68
          speaker: humpty
          text: >-
            Mind your manners, young dog. Keep a civil tongue in your head.
        - id: ch01-b69
          speaker: brenda
          text: >-
            Don't be cross, darling. Just make sure you stop at a truly excellent oasis tonight. We know we can trust you, dear.
        - id: ch01-b70
          speaker: narrator
          text: >-
            The camel muttered that it was all very well, though he sounded less cross than before. The expedition continued silently into the deepening twilight.
        - id: ch01-b71
          speaker: narrator
          text: >-
            A tumbling, jolting, thumping motion woke the children. It felt rather like a soft railway accident. The camel was kneeling down.
        - id: ch01-b72
          speaker: polly
          text: >-
            Down you come. Make the fire and boil the kettle.
        - id: ch01-b73
          speaker: lucy
          text: >-
            Polly, put the kettle on.
        - id: ch01-b74
          speaker: polly
          text: >-
            Certainly not. Please stop bringing up that old tale. It was completely false. I never put a kettle on, and I never shall.
        - id: ch01-b75
          speaker: narrator
          text: >-
            There is little need to explain the adventure of camping at a desert oasis. You must have done it many times, or at least read about it. You know all about the well, the palm trees, the dates, and the other proper things. The travelers made their camp and drank cocoa for supper. They thought it wonderful fun, slept soundly, and woke in the morning with hearts ready for any fate, as a respectable poet once put it.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Their second day passed much like the first. The only great change was the country around them. Instead of fresh green fields, their way now crossed dry yellow desert. Again the children slept while Humpty carried them onward. Again the camel showed remarkable taste and judgment when he selected their oasis. But although the day had repeated itself, the second night was nothing like the first.
        - id: ch01-b77
          speaker: narrator
          text: >-
            In the middle of the night, Polly woke Philip by biting his ear. The bird hopped safely beyond the reach of Philip's waking fists and called to him.
        - id: ch01-b78
          speaker: polly
          text: >-
            Build up the fire, quickly! There are lions.
          emotion: fearful
        - id: ch01-b79
          speaker: narrator
          text: >-
            The dogs whined and barked. Brenda was trying with all her might to climb a palm tree. Max did face the danger, though he showed no true love of the sport. Philip sprang up and piled dry palm scales and leaves onto the dying fire. It blazed again. Something moved beyond the bushes. In the darkness, pairs of bright points shone like stars that had somehow strayed from the sky. Philip wondered if those lights could truly be lions' eyes.
        - id: ch01-b80
          speaker: polly
          text: >-
            These lions are a dreadful nuisance. They will stay back while the fire burns, but really, the law ought to put a stop to them.
        - id: ch01-b81
          speaker: lucy
          text: >-
            Why hasn't anyone killed them?
        - id: ch01-b82
          speaker: narrator
          text: >-
            Lucy had awakened with Philip. After thinking for a moment, she helped feed the fire.
        - id: ch01-b83
          speaker: polly
          text: >-
            Because no one knows how. How would you kill a lion?
        - id: ch01-b84
          speaker: philip
          text: >-
            I haven't the least idea.
        - id: ch01-b85
          speaker: lucy
          text: >-
            Are these Noah's Ark lions?
        - id: ch01-b86
          speaker: polly
          text: >-
            Of course. All the books containing lions are kept shut.
        - id: ch01-b87
          speaker: lucy
          text: >-
            If you could catch Noah's Ark lions, I know how you could kill them.
        - id: ch01-b88
          speaker: polly
          text: >-
            Catching them is easy. They fall asleep an hour after sunrise. But killing sleeping game is not sporting.
        - id: ch01-b89
          speaker: lucy
          text: >-
            Please be quiet while I think.
        - id: ch01-b90
          speaker: narrator
          text: >-
            Lucy sat close to the fire. After a minute, she said this problem was just the opposite of the dragon. Polly nodded. A long silence followed. Then Lucy leaped up.
        - id: ch01-b91
          speaker: lucy
          text: >-
            I have it! I truly know what to do, and it won't hurt them. I don't mind killing things, but I hate hurting them. We have plenty of rope, don't we?
          emotion: happy
        - id: ch01-b92
          speaker: narrator
          text: >-
            They had plenty.
        - id: ch01-b93
          speaker: lucy
          text: >-
            At dawn, we'll tie them up. Then you'll see the rest.
        - id: ch01-b94
          speaker: philip
          text: >-
            You could at least tell me the plan.
        - id: ch01-b95
          speaker: lucy
          text: >-
            No. The lions might understand us. Polly understands everything we say.
        - id: ch01-b96
          speaker: narrator
          text: >-
            Philip suggested whispering, but Lucy said whispering was rude, and Polly strongly agreed.
        - id: ch01-b97
          speaker: narrator
          text: >-
            The expedition sat around the fire and waited for sunrise. Every face turned toward the strange pairs of stars beyond the light. Hidden creatures moved and rustled in the darkness. Brenda gave up trying to climb and pressed as close to Lucy as she could. Humpty had trembled with fear all along. Now he tried to cuddle against Philip. That would have been easier if he had been a smaller sort of creature instead of what the Universal Provider called an outsize camel.
        - id: ch01-b98
          speaker: narrator
          text: >-
            At last dawn arrived. It did not come slowly and silver as dawn comes here. It burst over the desert suddenly and red. Strong, level light spread across the sand, and the long shadows of the palm trees stretched from the oasis all the way across the desert.
        - id: ch01-b99
          speaker: narrator
          text: >-
            In broad daylight, going out to look for lions no longer seemed quite so difficult. The entire expedition went together through the bright morning light. Even Humpty pulled himself together enough to join the lion hunt, and Brenda herself decided that facing the search with her friends was better than staying behind alone at the oasis.
        - id: ch01-b100
          speaker: narrator
          text: >-
            They found the lions easily. There were only two, of course. They lay close together on their tawny sides in the sandy desert at the very edge of the oasis. The travelers moved gently. First they fitted ropes with slipknots over the lions' heads. They passed the other ends around palm trees. Then they looped more ropes around the places that would have been the lions' waists, if lions had such things as waists, and passed those ropes around trees as well.
        - id: ch01-b101
          speaker: lucy
          text: >-
            Now!
        - id: ch01-b102
          speaker: narrator
          text: >-
            All four ropes tightened at once. The lions struggled, but they struggled only in their sleep. Soon they grew still. Then the expedition brought more and more rope and made every leg and tail secure. At last the lions could not move, and Lucy was breathing hard from the work.
        - id: ch01-b103
          speaker: lucy
          text: >-
            There. That part is finished. Where is Polly?
        - id: ch01-b104
          speaker: polly
          text: >-
            Over here, in this bush. I feared I would only get in your way if I stayed close. I did long to lend a claw to such fine work. May I help now?
        - id: ch01-b105
          speaker: lucy
          text: >-
            Please explain the next part to the dogs. The only way I know to kill Noah's Ark lions is to lick off their paint and break their legs. If the dogs remove all the paint from the legs first, the lions won't feel anything when we break them.
        - id: ch01-b106
          speaker: narrator
          text: >-
            Polly hurried to explain. Then the parrot returned to Lucy.
        - id: ch01-b107
          speaker: polly
          text: >-
            They want to know whether the ropes will hold. I assured them they would. They are ready to begin. I only hope the paint does not make them ill.
        - id: ch01-b108
          speaker: lucy
          text: >-
            It never made me ill. One Sunday I sucked all the paint from a wooden dove. It wasn't bad. It tasted a little like sugar and a little like the eucalyptus oil you get for a cold. Tell them that.
        - id: ch01-b109
          speaker: polly
          text: >-
            I shall. I will also recite poetry to strengthen their spirits while they work.
        - id: ch01-b110
          speaker: philip
          text: >-
            Please do. It may make them work faster. You might also warn them that we'll pinch their tails if they fall asleep.
        - id: ch01-b111
          speaker: narrator
          text: >-
            The children sat down to a breakfast of cocoa and dates. Expeditions seem to live mostly on cocoa. When explorers return, they often write to the cocoa makers and tell them how excellent it was and how they could never have managed without it. Meanwhile, the noble and devoted dogs licked and licked. The paint began coming off the lions' legs at a great rate.
        - id: ch01-b112
          speaker: narrator
          text: >-
            Turning the lions over so the dogs could reach each unlicked side was heavy work. Still, the whole expedition joined in willingly. The lions resisted only feebly. They were still asleep, and the loss of paint was making them weak. Max and Brenda were given drinks, praised, patted, and set to work again. They licked and licked for hours and hours.
        - id: ch01-b113
          speaker: narrator
          text: >-
            At last, no paint remained on any lion's leg. The experienced Universal Provider had thoughtfully packed an explorer's axe, and Philip used it to chop off the legs. Chips flew with every blow. Lucy picked one up. It was wood, only wood and nothing else. Yet a short time before, it had been part of a real lion's leg that twisted and struggled against the ropes.
        - id: ch01-b114
          speaker: narrator
          text: >-
            When all the legs were gone, Philip touched one lion's body. That was wooden too. The lions were truly dead.
        - id: ch01-b115
          speaker: philip
          text: >-
            It seems rather a shame. Lions are splendid creatures when they're alive.
          emotion: sad
        - id: ch01-b116
          speaker: polly
          text: >-
            I have never liked lions myself.
        - id: ch01-b117
          speaker: lucy
          text: >-
            Never mind, Phil. We didn't hurt them.
        - id: ch01-b118
          speaker: narrator
          text: >-
            That was the first time Lucy ever called him Phil.
        - id: ch01-b119
          speaker: philip
          text: >-
            All right, Lu. It was awfully clever of you to think of that plan.
        - id: ch01-b120
          speaker: narrator
          text: >-
            And that was the first time Philip ever called her Lu.
        - id: ch01-b121
          speaker: narrator
          text: >-
            Long before the travelers reached the Dwellers by the Sea, they could see the sea itself as a straight, pale line. The Dwellers had built their castle at the water's very edge. Between the travelers and that castle, the Pebbly Waste rose higher and higher until it formed a mountain. That ridge hid the castle from Philip and Lucy as they approached on the camel.
        - id: ch01-b122
          speaker: narrator
          text: >-
            The whole Pebbly Waste was made of small, slippery stones. Now the children understood how miserable a horse would have been on such ground. Even sure-footed Humpty moved very slowly as the path climbed. Max and Brenda no longer frisked or bounded beside him. They too went at a foot's pace, with ears and tails drooping.
        - id: ch01-b123
          speaker: polly
          text: >-
            If I were you, I would call a halt here. Every one of us will feel better after a cup of cocoa. And besides...
        - id: ch01-b124
          speaker: narrator
          text: >-
            Polly would not explain that dark hint.
        - id: ch01-b125
          speaker: polly
          text: >-
            Be ready for surprises.
        - id: ch01-b126
          speaker: narrator
          text: >-
            Philip drank every drop from his second mug of cocoa. Then he looked up and noticed something in the distance.
        - id: ch01-b127
          speaker: philip
          text: >-
            I thought there were no desert birds except you, and you're almost more person than bird. But what's that over there?
        - id: ch01-b128
          speaker: narrator
          text: >-
            Far across the desert, a speck moved high in the blue sky. It was plainly flying toward the camp. As it drew nearer, it grew from the size of a moth to the size of a teacup, and then from a teacup to an eagle. Still it came on.
        - id: ch01-b129
          speaker: lucy
          text: >-
            It has four legs!
          emotion: surprised
        - id: ch01-b130
          speaker: polly
          text: >-
            Naturally. It is the Hippogriff.
        - id: ch01-b131
          speaker: narrator
          text: >-
            The magnificent creature swept closer on his broad white wings. Something rode on his back.
        - id: ch01-b132
          speaker: lucy
          text: >-
            It's the Pretenderette!
          emotion: surprised
        - id: ch01-b133
          speaker: philip
          text: >-
            It's that horrible motor woman!
          emotion: angry
        - id: ch01-b134
          speaker: narrator
          text: >-
            They were both right. The Hippogriff swept down from the sky and settled on the desert as softly as a butterfly landing on a flower. There he stood in all his graceful whiteness. On his back sat the motor lady, her face hidden behind her veil.
        - id: ch01-b135
          speaker: nurse
          text: >-
            How fortunate that I caught you. Now we can travel together.
        - id: ch01-b136
          speaker: philip
          text: >-
            I don't understand why you came at all.
        - id: ch01-b137
          speaker: nurse
          text: >-
            Don't you? I have every right to attend these experiments. A responsible grown-up must be there to make sure you actually do all the things you'll claim you did.
        - id: ch01-b138
          speaker: philip
          text: >-
            Are you calling us liars?
          emotion: angry
        - id: ch01-b139
          speaker: nurse
          text: >-
            I am not choosing to say anything about that. I merely say that a grown-up ought to be present and watch what happens.
        - id: ch01-b140
          speaker: narrator
          text: >-
            She giggled unpleasantly and muttered something about a parcel of birds and children. Polly's feathers rose until the parrot looked twice as large. Philip said he still saw no reason for her to come.
        - id: ch01-b141
          speaker: nurse
          text: >-
            I see one. If you fail, my turn begins, and I may succeed one minute later. So we shall all go along together in comfort. Won't that be delightful?
        - id: ch01-b142
          speaker: narrator
          text: >-
            Speechless despair seemed to fall over the whole expedition. No one answered her. The children stared blankly. The dogs whined. Humpty drew himself up and wore his proudest sneer, while Polly fidgeted inside a great puffed-out coat of feathers.
        - id: ch01-b143
          speaker: nurse
          text: >-
            We should start. Go on, pony!
        - id: ch01-b144
          speaker: narrator
          text: >-
            A shiver passed through every member of the expedition. It was dreadful that a Pretenderette should dare to speak to a Hippogriff as if he were an ordinary pony. Then Polly suddenly spread both wings, flew across to Philip, settled on his shoulder, and whispered directly into his ear.
        - id: ch01-b145
          speaker: polly
          text: >-
            I know whispering is rude, but your generous heart will forgive me. A parcel of birds and children, indeed! Doesn't that make your blood boil?
        - id: ch01-b146
          speaker: narrator
          text: >-
            Philip considered the insult and decided that his blood certainly did boil.
        - id: ch01-b147
          speaker: polly
          text: >-
            Then why are we waiting? Say the word, and I will take her back by the ear.
        - id: ch01-b148
          speaker: philip
          text: >-
            I truly wish you would.
        - id: ch01-b149
          speaker: polly
          text: >-
            Easily done. What a miserable outsider, forcing herself into our expedition! Wait for me here. If I have not returned by morning, you may visit the Dwellers around noon, and I will meet you there. Good-bye.
        - id: ch01-b150
          speaker: narrator
          text: >-
            Polly said good-bye and gently stroked Philip's ear with a kind beak. Then the parrot launched into the air, flew toward the hated motor lady, and circled exactly three times around her veiled head.
        - id: ch01-b151
          speaker: nurse
          text: >-
            Go away! Call off your ridiculous parrot! Oh! It has my ear!
          emotion: angry
        - id: ch01-b152
          speaker: lucy
          text: >-
            Please don't hurt her.
          emotion: fearful
        - id: ch01-b153
          speaker: polly
          text: >-
            I will not hurt her.
        - id: ch01-b154
          speaker: narrator
          text: >-
            Polly released the ear to say this. The Pretenderette clapped both hands over her ears.
        - id: ch01-b155
          speaker: polly
          text: >-
            You there in the veil, I shall take hold again in a moment. It will hurt much less if the Hippogriff and I happen to fly the same way. Tell him, “Go back the way you came, please,” and you will hardly feel it. Do not think of climbing down. If you do, the dogs will have you. Keep both hands over your ears if you like. I know you can hear me perfectly well. Now I am going to take hold again, so leave your hands where they are. I am not particular about finding an ear. A nose will serve equally well.
        - id: ch01-b156
          speaker: narrator
          text: >-
            The woman covered her nose with both hands. At once Polly seized her ear again.
        - id: ch01-b157
          speaker: nurse
          text: >-
            Go back the way you came! I'll get even with you children yet!
          emotion: angry
        - id: ch01-b158
          speaker: narrator
          text: >-
            The Hippogriff did not move.
        - id: ch01-b159
          speaker: nurse
          text: >-
            Let go of my ear!
          emotion: angry
        - id: ch01-b160
          speaker: philip
          text: >-
            You have to say please. Not to Polly, because that won't help. Say it to the Hippogriff.
        - id: ch01-b161
          speaker: nurse
          text: >-
            Please, then!
          emotion: angry
        - id: ch01-b162
          speaker: narrator
          text: >-
            At once the Hippogriff spread his white wings and rose into the air. Polly freed the ear for one moment.
        - id: ch01-b163
          speaker: polly
          text: >-
            As long as she behaves, I shall not hurt her.
        - id: ch01-b164
          speaker: narrator
          text: >-
            The parrot took hold of the ear once more. Then the little gray wings of Polly and the great white wings of the Hippogriff went sailing together across the desert, carrying the Pretenderette farther and farther away.
        - id: ch01-b165
          speaker: philip
          text: >-
            That parrot is a treasure!
          emotion: happy
        - id: ch01-b166
          speaker: lucy
          text: >-
            Who is the Pretenderette? Why is she so nasty to us when everyone else is kind?
        - id: ch01-b167
          speaker: philip
          text: >-
            I don't know. She's a hateful old thing.
        - id: ch01-b168
          speaker: lucy
          text: >-
            I can't help feeling that I know her quite well. I think I could place her if only I could remember who she is.
        - id: ch01-b169
          speaker: philip
          text: >-
            Do you? Let's play noughts and crosses. I have a notebook and a piece of pencil. We can play until bedtime.
        - id: ch01-b170
          speaker: narrator
          text: >-
            So Philip and Lucy sat on the Pebbly Waste and played noughts and crosses. Behind them, Polly and the Hippogriff carried the tiresome woman away across the sky. Before them rose the high ridge of pebbles, as steep and large as a mountain. Beyond that ridge lay the unknown, the adventure, the Dwellers by the Sea, and the deed they still had to do.
