audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖沉着，带一点机敏的幽默
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中
    philip:
      display_name: 菲利普
      tts:
        delivery: 直率敏感，想象丰富，情绪来得快
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    lucy:
      display_name: 露西
      tts:
        delivery: 开朗友好，坦率好奇
        timbre: 轻盈稚嫩
        pace: 轻快
        pitch: 中高
    judge_noah:
      display_name: 诺亚先生
      tts:
        delivery: 一本正经又怕麻烦，古板中带着滑稽
        timbre: 苍老清晰
        pace: 稍慢
        pitch: 中
    pretenderette:
      display_name: 女觊觎者
      tts:
        delivery: 尖刻自负，争强好胜，句句不肯相让
        timbre: 尖细明亮
        pace: 稍快
        pitch: 高
    provider:
      display_name: 万能供应商
      tts:
        delivery: 殷勤能干，谈起行装干脆利落
        timbre: 苍老清晰
        pace: 适中
        pitch: 中
    polly:
      display_name: 波利
      tts:
        delivery: 机灵健谈，爱挖苦也很讲义气
        timbre: 清脆略带沙哑
        pace: 稍快
        pitch: 中高
    humpty:
      display_name: 汉普蒂
      tts:
        delivery: 高傲多愁，抱怨里藏着可靠
        timbre: 低沉粗哑
        pace: 稍慢
        pitch: 低
    max:
      display_name: 马克斯
      tts:
        delivery: 忠诚直爽，逞强时仍透出紧张
        timbre: 明亮结实
        pace: 适中
        pitch: 中
    brenda:
      display_name: 布伦达
      tts:
        delivery: 亲热温柔，害怕时格外殷勤
        timbre: 轻柔明快
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 美丽的法律与新的伟业
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            这顿饭可不是上一回那种彩绘木头做成的假宴席。桌上摆着真正的烤珍珠鸡，还有真正能入口的天使布丁。菲利普终于能一边吃，一边问出憋了许久的问题。
        - id: ch01-b02
          speaker: philip
          text: 为什么你们正式设宴时，偏偏只摆木头食物？
        - id: ch01-b03
          speaker: judge_noah
          text: >-
            宴会是极重要的场合。真正能吃、又叫人享受的食物，只会妨碍大家专心处理人生大事。你们世界里最成功的宴席承办人，有不少已经懂得这个道理。
        - id: ch01-b04
          speaker: lucy
          text: 那些大银碗为什么空着？
        - id: ch01-b05
          speaker: judge_noah
          text: 那是盛甜点的碗。
          emotion: sad
        - id: ch01-b06
          speaker: lucy
          text: 可碗里根本没有甜点呀。
        - id: ch01-b07
          speaker: judge_noah
          text: >-
            问题正是这个。没有甜点，从来都没有。你还要一点天使布丁吗？
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: >-
            两个孩子一听便明白，这个话题不知为什么叫诺亚先生难过，他很想马上岔开不谈。两个孩子都懂得真正的礼貌。虽然已经吃下了自己真正需要的全部分量，听见他又一次拿天使布丁来问，还是一起答应再来一点。
        - id: ch01-b09
          speakers: [philip, lucy]
          ensemble: duo
          text: 好的，请再来一点。
        - id: ch01-b10
          speaker: narrator
          text: >-
            饭后，诺亚先生带他们在城里散步，说要去看看工厂。菲利普很惊讶，因为从前有人教过他，工厂太难看，绝不能拿积木去搭。可这里的工厂完全不同。它们是一排排舒适的低矮长屋，高高的落地窗一直开向玫瑰园。各个国家的人都在屋里制造又美又有用的东西，而且真心喜欢自己手里的工作。每一个做东西的人，看起来都干干净净、快快乐乐。菲利普越看越羡慕，忍不住拿这里的工厂和自己世界里的相比。诺亚先生告诉他，那些厂子虽然挂着各种名称，归根结底只顾制造钱。这里的规矩却不一样，每个人的劳动必须留下真正有用、也真正美丽的东西。
        - id: ch01-b11
          speaker: philip
          text: 真希望我们也有这样的工厂。海伦也说，我们那里的工厂太难看了。
        - id: ch01-b12
          speaker: judge_noah
          text: >-
            因为你们那些都是造钱的工厂，只是名字各不相同。这里人人都要造出真正有用、又真正美丽的东西，不能光为了钱忙活。
        - id: ch01-b13
          speaker: lucy
          text: 您也得造东西吗？
        - id: ch01-b14
          speaker: judge_noah
          text: 我当然也得造。我造的是法律。难道你们不知道，我是首席法官？
        - id: ch01-b15
          speaker: philip
          text: 法律也能又有用、又美丽吗？
        - id: ch01-b16
          speaker: judge_noah
          text: >-
            当然有用，而且我的法律很美。比如这一条，人人都要努力善待别人。谁待人不好，就得真心后悔，再亲口道歉。你觉得怎么样？
        - id: ch01-b17
          speaker: philip
          text: 还不错，可也说不上美。
        - id: ch01-b18
          speaker: judge_noah
          text: >-
            你真的不觉得美吗？它听起来也许不美，我毕竟从来不会写诗。可大家照着去做的时候，事情就美极了。美丽的东西一旦破掉，当然也就不美，法律也一样。不过，丑陋的法律倒只有遭到破坏时才会变美。这不是很古怪吗？法律真是很难琢磨。
        - id: ch01-b19
          speaker: narrator
          text: >-
            他们沿着盆栽树木之间一段陡峭的台阶往上走。菲利普忽然想起，自己这一天根本没有完成新的伟业，解开地毯的是露西。他不觉得今天真正做成了什么，便再也忍不住，催诺亚先生立刻告诉他们下一项任务。
        - id: ch01-b20
          speaker: philip
          text: 我们现在不能开始下一项伟业吗？今天真正出力的是露西。快告诉我们该做什么吧。
        - id: ch01-b21
          speaker: judge_noah
          text: >-
            下一项会花不少时间，不过你若愿意，今天就能出发。这件事尤其适合男爵。为什么会这样，我可不知道。也许男爵除了这件事，再没有别的用处，这并不奇怪。凡是肯动脑筋的人，一直都觉得世上为何需要男爵这件事缺少解释。说不定，你今天要开始的伟业，就是设立男爵时真正高明的用意。
        - id: ch01-b22
          speaker: philip
          text: 那么，男爵到底该做什么？
        - id: ch01-b23
          speaker: judge_noah
          text: >-
            前往海边居民的国度。到了那里，不管用什么合适的办法，都要消灭他们的恐惧。
        - id: ch01-b24
          speaker: narrator
          text: >-
            菲利普自然追问，海边居民究竟在害怕什么。诺亚先生不肯预先透露，只说到了那里，居民自己会告诉他们，而且那份恐惧非常巨大。露西想知道，那东西会不会也叫他们害怕。菲利普这才意识到，她真打算同行。
        - id: ch01-b25
          speaker: philip
          text: 她要是害怕，就不该去。谁也没指望女孩子勇敢。
        - id: ch01-b26
          speaker: judge_noah
          text: 在这里，女孩子要勇敢，男孩子要善良。
        - id: ch01-b27
          speaker: lucy
          text: 我当然要去。你已经答应过我了。
    - id: ch02
      title: 沙漠远征队
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            事情就这样定了。诺亚先生快活地搓着手，准备为这趟漫长旅程置办一支正式的远征队。他先问两个孩子想骑什么。
        - id: ch02-b02
          speaker: philip
          text: 骑马。
        - id: ch02-b03
          speaker: narrator
          text: >-
            菲利普只见过人骑马和驴，又不愿选驴，自然说了马。诺亚先生听完拍拍他的背，倒很庆幸他没要自行车。这里误订过一条可怕的法律，虽然当初只是个错误，既然已经成为法律也没办法。谁开口索要机器，就非得把它收下，还要一直使用。可他们得横穿砾石荒原，那是一段足足三天的路，马也未必合适。诺亚先生想了又想，便领他们去马厩亲自挑选。
        - id: ch02-b04
          speaker: narrator
          text: >-
            那是一间长长的棚屋，里面隔成一格一格，很像你小时候用来摆放小木马和小车的玩具马厩。只是这里凡有人骑过的动物，全都找得到。大象、骆驼、驴、骡子、公牛、山羊、斑马、乌龟、鸵鸟、野牛和猪，样样都有。最末一格不是普通木头造的，而是用银片锤成。鹰头马身有翼兽本尊就站在里面。长长的白鬃和白尾垂在身后，温柔美丽的眼睛望着他们，两扇长长的白色翅膀整整齐齐收在光滑如缎的背上。菲利普怎么也猜不到，这头奇兽连同银马厩究竟怎样来到了这里。
        - id: ch02-b05
          speaker: narrator
          text: >-
            其他动物当然也全是活的，可它们仍旧带着诺亚方舟玩具的模样，任谁看了都绝不会认错。唯独这头奇兽压根儿不是方舟里的动物，他来自菲利普搭城时用过的一本书。露西一见便喜欢上了。他也转过天鹅绒似的白鼻子，亲昵地蹭她，像是在认真接受那句赞美。
        - id: ch02-b06
          speaker: lucy
          text: 我们不能骑他吗？他真招人疼。
        - id: ch02-b07
          speaker: judge_noah
          text: >-
            两个人一起骑不行。除非其中一位是伯爵，否则他一次只能驮一个。我建议你们骑骆驼。
        - id: ch02-b08
          speaker: lucy
          text: 骆驼能驮我们两个？
        - id: ch02-b09
          speaker: judge_noah
          text: 当然。骆驼叫沙漠之舟，一艘船若只能载一个人，岂不是蠢透了？
        - id: ch02-b10
          speaker: narrator
          text: >-
            事情就这样定了。诺亚先生亲手给一头很高大的骆驼装好鞍辔，牵着缰绳站在那里，仔细想还有什么遗漏。他说，紧急关头还需要狗。菲利普一听立刻表示，自己不管什么时候都需要狗。诺亚先生吹了声口哨，两只诺亚方舟里的腊肠犬便从窝里扑出来，一直冲到铁链尽头。它们身子很长，腿却很短，模样几乎一样，只是一只略大、颜色略深。诺亚先生告诉它们，菲利普是男主人，露西是女主人。两只狗马上围住孩子，亲热得不得了。
        - id: ch02-b11
          speaker: narrator
          text: >-
            接下来还得预备食物、饮水、帐篷，以及坏天气时用的雨伞，还有许多别的东西。转过街角，正好有家店能把一切办妥。门外招牌写着：“万能供应商。远征装备，顷刻配齐。准时迅速。”店主彬彬有礼地迎上来，长得和诺亚先生一模一样。孩子们还没等他叫出“爸爸”，便已经知道他是谁。诺亚先生介绍说，这是他的儿子，在置办行装方面很有经验。
        - id: ch02-b12
          speaker: provider
          text: 你们现在已经有什么？
        - id: ch02-b13
          speaker: judge_noah
          text: >-
            两只狗，两个孩子，一头骆驼。我知道照规矩每样该有两个，可一头骆驼已经够菲利普爵士应付了。
        - id: ch02-b14
          speaker: narrator
          text: >-
            诺亚先生的儿子很孝顺，认为父亲一定最明白。他痛快地答应把远征所需的一切全部配齐，其中还包括一只头等会说话的鹦鹉。所有东西都会仔细打包，半小时内准时送到。
        - id: ch02-b15
          speaker: narrator
          text: >-
            半小时以后，你就能看见菲利普和仍穿仙女裙的露西了。他们连同远征所需的全部行李，都装上了那头高大而摇晃的骆驼。城里照例派出盛大的队伍送行，七支乐队一齐演奏一首名字很像《看，凯旋的英雄来了》的曲子。只是那旋律和你熟悉的同名曲子完全不同。骆驼连人带货，和他们碰巧选中的城门挤得严严实实。孩子们只好俯下身子，免得脑袋擦上拱顶，连骆驼也得小心挪动。好在所有人和所有行李最后都平安穿过了门洞。
        - id: ch02-b16
          speaker: narrator
          text: >-
            城外所谓的道路，其实只是一条田间小径，穿过从前屠龙的花草地。左边很远的地方，是巨石阵遗迹和那座高塔。正前方，则铺展着辽阔又诱人的“绝对未知之地”。太阳当空照着。这里的太阳是从诗集里来的，诺亚先生说，雨水、花朵和四季变化也都从诗集里来。骆驼走路的方式非常古怪，每一步都像快要翻倒，转眼却又安然无事，不过骑在上面的人最好仍旧小心。两个孩子依然很快活，两只狗兴高采烈地一路蹦跳，连骆驼那股动物园里常见的高傲忧郁也淡了些。
        - id: ch02-b17
          speaker: narrator
          text: >-
            骑在骆驼背上当然气派极了，只是露西竭力不去细想，到时候该怎样爬上爬下。鹦鹉也很有意思，而且话说得很好。只要能让它真正听懂一个问题，它就可以把其他动物的一切告诉你。因为人话需要它听明白，动物的语言却是它天生就懂的，根本不用别人教。偏偏眼前这只鹦鹉不肯和人闲聊，别人一问，它便没完没了背诵相当乏味的诗。从“我歌唱武器和英雄”一直念到傲慢的朱诺。那首诗似乎永远也念不完。它的声音很催眠，骆驼背又像一只颠得厉害的摇篮。孩子们安稳坐在带软垫的驮篮里，又刚刚度过兴奋的一整天。太阳没多久便落下去，他们也很快睡着了。
        - id: ch02-b18
          speaker: polly
          text: 马克斯，他们睡着了。
        - id: ch02-b19
          speaker: max
          text: 这也难怪。没事，汉普蒂认得路。
        - id: ch02-b20
          speaker: humpty
          text: 小狗崽子，说话就不能放尊重点？
        - id: ch02-b21
          speaker: brenda
          text: >-
            亲爱的，别生气。晚上记得挑一片真正一流的绿洲。不过，我们当然信得过你。
          emotion: calm
        - id: ch02-b22
          speaker: narrator
          text: >-
            汉普蒂嘴里还在咕哝，说别人讲得倒轻巧，口气却已经没有刚才那么暴躁。此后，远征队一声不响地走进越来越深的暮色。后来，一阵翻滚、摇晃和猛颠惊醒了孩子。要形容那种滋味，最像一场软绵绵的火车事故。他们睁开眼睛，才发现骆驼正在跪下来。
        - id: ch02-b23
          speaker: polly
          text: 下来吧。生火，把水烧上。
        - id: ch02-b24
          speaker: lucy
          text: 波利，把水壶坐上。
        - id: ch02-b25
          speaker: polly
          text: >-
            我才不干。别再提那桩陈年旧案，那故事全是假的。我从没把水壶坐上过，以后也绝不会。
        - id: ch02-b26
          speaker: narrator
          text: >-
            在沙漠绿洲扎营的事，谁没亲身经历过几次呢？就算没有，也早在书里读熟了。水井、棕榈树、椰枣，还有在它们旁边扎营的种种事情，你当然全都明白。晚饭他们喝了热可可，整个晚上有趣极了。随后大家在绿洲安顿下来，两个孩子睡得又沉又香。早晨醒来时，他们只觉得无论命运送来什么，自己都有勇气迎上去。一位体面的诗人正是这样说的。第二天和第一天几乎一样，只是他们离开了新鲜青翠的田野，眼前的道路伸进干燥的黄色沙漠。白天走了很久，孩子们又在颠簸的骆驼背上睡着。到了晚上，汉普蒂又凭着出色的品味和判断，替大家挑中另一片绿洲。可是第二夜即将发生的事情，和第一夜一点也不相同。
    - id: ch03
      title: 狮子与油漆
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            可第二夜和第一夜完全不同。到了半夜，波利忽然咬住菲利普的耳朵。它把人惊醒以后，赶紧跳到挥舞的拳头够不着的安全地方。两只狗一边叫，一边害怕得呜呜直响。布伦达正拼命想爬上一棵棕榈树。马克斯倒的确站在那里面对危险，只是看不出他对这种冒险有什么真正的爱好。
        - id: ch03-b02
          speaker: polly
          text: 快把篝火烧旺！动作快，狮子来了！
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: >-
            菲利普一跃而起，把干枯的棕榈皮和树叶一把把堆上快要熄灭的火。火焰呼地蹿起来，灌木外边立刻有什么东西动了一下。黑暗里，他看见一对又一对亮晶晶的东西，像从天上迷路落下来的星星。那会不会真是狮子的眼睛？
        - id: ch03-b04
          speaker: polly
          text: >-
            这些狮子真麻烦。只要火还烧着，它们就不敢靠近。可法律早该下令把它们消灭了。
        - id: ch03-b05
          speaker: lucy
          text: 为什么从来没人杀死它们？
        - id: ch03-b06
          speaker: polly
          text: 因为谁也不知道办法。要是换成你，你会怎么杀一头狮子？
        - id: ch03-b07
          speaker: philip
          text: 我不知道。
        - id: ch03-b08
          speaker: lucy
          text: 它们是诺亚方舟里的狮子吗？
        - id: ch03-b09
          speaker: polly
          text: >-
            当然。写到狮子的书全被锁起来了。天亮一小时以后，它们就会睡着，想捉并不难。可趁猎物睡觉时杀它，不合狩猎规矩。
        - id: ch03-b10
          speaker: lucy
          text: >-
            只要能捉住，我知道怎样杀死诺亚方舟里的狮子。先让我好好想一想。这件事恰好和那条巨龙相反。
        - id: ch03-b11
          speaker: narrator
          text: >-
            露西紧挨篝火坐下。波利点点头，大家沉默了很久。突然，她一跃而起。
        - id: ch03-b12
          speaker: lucy
          text: >-
            我真的想到了！而且不会弄疼它们。我不怕杀死东西，可我最讨厌把它们弄疼。我们的绳子一定够多。
          emotion: happy
        - id: ch03-b13
          speaker: narrator
          text: >-
            远征行装里的绳子果然很多。露西说，等天一亮，大家先把狮子统统捆起来，余下的到时候自然会明白。她仍旧不肯把完整计划说出来。
        - id: ch03-b14
          speaker: philip
          text: 你也该先告诉我呀。
        - id: ch03-b15
          speaker: lucy
          text: 不行。它们也许听得懂，波利不就听得懂吗？
        - id: ch03-b16
          speaker: narrator
          text: >-
            菲利普自然想到了交头接耳，可露西说那不礼貌，波利也马上表示完全赞成。于是远征队围坐在火旁，每一张脸都朝着黑暗里那些奇怪的双星。他们听见星光后面传来隐秘的动作和窸窣声，就这样一直等着天亮。布伦达终于放弃爬树，尽可能紧地偎着露西。一直吓得发抖的汉普蒂也想偎住菲利普。可这头骆驼偏偏是供应商亲口所说的“特大号”，要是他个头小些，这件事才容易办。
        - id: ch03-b17
          speaker: narrator
          text: >-
            没过多久，黎明来了。这里的黎明来得突然又鲜红，不像我们这儿那样缓慢而银白。太阳一露面，强烈的光线便贴着地面射来，一棵棵棕榈树的长影一直横过整片沙漠。昨夜藏在黑暗里的东西，现在全都能看清了。到了大白天，出发寻找狮子便没那么可怕。远征队的所有成员都去了。就连一直发抖的汉普蒂也努力振作精神，跟在大家身后加入猎狮队。布伦达则仔细想了想，最后宁肯冒险跟着大家一起去，也不愿独自留在空荡荡的绿洲营地。
        - id: ch03-b18
          speaker: narrator
          text: >-
            狮子很快就找到了，一共当然只有两头。它们躺在绿洲边缘的沙地上，黄褐色的身体侧向一边，彼此挨得很近，果然睡得正沉。大家放轻脚步，慢慢靠近。谁也不愿在绳索套好以前惊醒它们。带活结的绳圈被轻轻套过两颗狮头，再将绳子的另一端绕上棕榈树。另外几根绳子也绕过树干，捆在狮子本该称作腰的地方，假如狮子身上真有一种部位可以叫作腰的话。等所有绳子都安放妥当，大家才互相看了一眼，等着露西发出信号。
        - id: ch03-b19
          speaker: lucy
          text: 动手！
        - id: ch03-b20
          speaker: narrator
          text: >-
            露西一声令下，四根绳子立刻一起绷紧。两头狮子挣扎起来，可那只是在睡梦中的挣扎。没过多久，它们终于不动了。大家又拿来更多绳子，把每一条腿和两条尾巴都牢牢捆好。露西累得直喘气，这才发现波利一直不在旁边。
        - id: ch03-b21
          speaker: lucy
          text: 波利在哪儿？
        - id: ch03-b22
          speaker: polly
          text: >-
            我在近旁的灌木里。刚才凑得太近，只会碍事。不过我一直很想伸出一只爪子，为这样的善举出力。现在需要帮忙吗？
        - id: ch03-b23
          speaker: lucy
          text: >-
            请你告诉两只狗，现在轮到它们了。我只知道一种杀死诺亚方舟狮子的办法，就是先把油漆舔掉，再折断它们的腿。要是狗把狮子腿上的漆全舔干净，我们折腿的时候，它们就不会觉得疼。
        - id: ch03-b24
          speaker: polly
          text: >-
            它们问绳子能不能捆住，我说当然能。现在它们就开工。我只怕油漆会叫它们生病。
        - id: ch03-b25
          speaker: lucy
          text: >-
            我吃过，从没生病。有个星期天，我把一只鸽子舔得干干净净，味道还不坏。有点像糖，也有点像伤风时用的桉树油。把这话告诉它们。
        - id: ch03-b26
          speaker: polly
          text: 我还可以给它们朗诵诗歌，鼓舞它们完成任务。
        - id: ch03-b27
          speaker: philip
          text: >-
            念吧，说不定它们能快一点。再告诉它们，要是碰巧睡着，我们就掐它们的尾巴。
        - id: ch03-b28
          speaker: narrator
          text: >-
            孩子们吃起可可配椰枣的早餐。所有远征队似乎大半都靠可可活着，回来以后还常给制造商写信，说可可实在太好，没有它真不知该怎么办。吃早餐的同时，两只高尚又忠诚的狗正认真完成自己的任务。它们舔呀，舔呀，不停地舔，狮子腿上的油漆果真飞快脱落。为了舔到另一边还带漆的地方，大家得停下手里的事，合力把沉重的狮子翻过来。那份重量可不轻，不过整支远征队齐心协力，没有一个偷懒。狮子仍旧睡着，又因失去油漆而浑身虚弱，只能稍微抵抗。两只狗累了，大家便让它们喝水，又拍拍它们，好好夸奖一番。休息以后，它们重新开始工作，一舔就是许多个钟头，直到再也看不见一点油漆。
        - id: ch03-b29
          speaker: narrator
          text: >-
            终于，四条狮腿上的油漆全都没了。菲利普拿起探险斧，一条条砍下来。那把斧头是经验丰富的供应商特意放进行装里的，直到这时才显出他的周到。斧头每次落下，木屑便四处飞溅。露西弯腰捡起一片，翻来覆去地看。它只是木头，完完全全的木头，别的什么也不是。可他们刚才用绳子捆住那些腿时，那分明还是真正在扭动、抵抗的狮腿，绝不会有错。等所有腿都砍断，菲利普伸手摸了摸一头狮子的身体，那里也变成了硬邦邦的木头。这样一来，两头狮子的确已经死了。菲利普却没有为胜利欢呼，反而觉得活着的狮子原本是很有趣的动物，死掉实在有些可惜。
        - id: ch03-b30
          speaker: philip
          text: 真有点可惜。活着的狮子其实很有趣。
          emotion: sad
        - id: ch03-b31
          speaker: polly
          text: 我反正从来不喜欢狮子。
        - id: ch03-b32
          speaker: lucy
          text: 别难过，菲尔。它们一点也没疼。
          emotion: calm
        - id: ch03-b33
          speaker: narrator
          text: >-
            这是露西第一次不再叫他菲利普，而是亲亲热热地叫他“菲尔”。
        - id: ch03-b34
          speaker: philip
          text: 好吧，露。不管怎样，这个办法想得真聪明。
        - id: ch03-b35
          speaker: narrator
          text: >-
            这也是菲利普第一次不叫她露西，而是亲亲热热地叫她“露”。
    - id: ch04
      title: 女觊觎者追上来了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            远征队还没到海边居民那里，就已经望了很久很久。远处的海只显出一道苍白而笔直的边线。那些居民把城堡造在海岸最边缘，砾石荒原却一路升高，最后隆起得像一座山，把城堡严严实实遮在后面。骑骆驼的人越走越近，却仍看不到下一项伟业真正发生的地方。荒原地上全是细小、光滑又容易滚动的石头，孩子们终于懂了，若是骑马来，一匹马走在这里会多么痛苦。就连最适合沙漠的汉普蒂也越走越慢。两只狗不再欢蹦乱跳，只垂着耳朵和尾巴，按着步行的速度一点点向前挪。
        - id: ch04-b02
          speaker: polly
          text: >-
            换成我，就会叫大家停下来。喝杯可可，谁都会舒服些。再说……
        - id: ch04-b03
          speaker: narrator
          text: >-
            波利说到这里偏偏停住，不肯解释那个阴森森的暗示，只又提醒大家当心意外。菲利普喝完第二杯可可的最后一口，忽然抬手指向远处。他原以为沙漠里除了波利没有别的鸟，而波利与其说是一只鸟，倒不如说更像一个人。可是现在，远方沙漠上空的蓝天里，分明有一个移动的小点。
        - id: ch04-b04
          speaker: polly
          text: 小心意外。
        - id: ch04-b05
          speaker: narrator
          text: >-
            那个小点越来越大，显然正朝他们的营地飞来。起初它只有飞蛾那么大，接着变得像一只茶杯，转眼又有一只鹰那么大，而且还在不停靠近。
        - id: ch04-b06
          speaker: lucy
          text: 可它有四条腿！
        - id: ch04-b07
          speaker: polly
          text: 那当然，它本来就该有四条腿。是鹰头马身有翼兽。
        - id: ch04-b08
          speaker: narrator
          text: >-
            果真是那头洁白壮丽的奇兽。他舒展巨大的白色翅膀，一下一下掠过天空，越飞越近。可他的背上分明还驮着什么。究竟是什么呢？
        - id: ch04-b09
          speaker: lucy
          text: 是女觊觎者！
          emotion: surprised
        - id: ch04-b10
          speaker: philip
          text: 是那个讨厌的汽车女人！
          emotion: disgusted
        - id: ch04-b11
          speaker: narrator
          text: >-
            两个孩子果然完全没有看错。奇兽从天空落向下方的沙漠，轻得像一只蝴蝶停在花朵上，几乎没扬起一点沙尘。他稳稳站在那里，通体洁白，姿态优雅得令人赞叹。那个蒙着讨厌的汽车面纱的女人，正高高坐在他的背上。海已经藏到山后，从那边吹来的风仍把她的面纱吹得飘个不停。
        - id: ch04-b12
          speaker: pretenderette
          text: 真高兴终于追上你们了。现在我们可以一道走。
        - id: ch04-b13
          speaker: philip
          text: 我根本不懂你来做什么。
        - id: ch04-b14
          speaker: pretenderette
          text: >-
            你当然不会懂。我有权在所有试验中到场。总得有一个负责任的大人亲眼看着，确认你们真的完成了那些自己准会声称已经做过的事情。
        - id: ch04-b15
          speaker: philip
          text: 你是说我们撒谎？
          emotion: angry
        - id: ch04-b16
          speaker: pretenderette
          text: >-
            我可没打算明说什么，不过总该有大人在场。要是你们失败，接着就该轮到我了。很可能你们刚刚失败一分钟，我立刻便能成功。所以，我们大家一起舒舒服服地往前走吧。那不是很好吗？
        - id: ch04-b17
          speaker: narrator
          text: >-
            她还说了句把他们叫作“一包鸟儿和孩子”的刻薄话，气得波利浑身羽毛竖起，看起来足足大了一倍。一阵说不出话的绝望仿佛落在整支队伍身上。谁也不出声。两个孩子神色茫然，两只狗低声呜咽，汉普蒂摆出自己最傲慢的冷笑，波利缩在蓬松的羽毛衣裳里，烦躁得动个不停。
        - id: ch04-b18
          speaker: pretenderette
          text: 我们出发吧。驾，小马儿！
        - id: ch04-b19
          speaker: narrator
          text: >-
            在场的每一个都打了个寒战。一个女觊觎者竟敢这样使唤尊贵的鹰头马身有翼兽！波利突然展开双翅，飞到菲利普肩上，贴近他的耳朵说起悄悄话。
        - id: ch04-b20
          speaker: polly
          text: >-
            我知道交头接耳不礼貌，可你一定会原谅我。“一包鸟儿和孩子”！这话难道没叫你的血沸腾起来？
        - id: ch04-b21
          speaker: philip
          text: 的确气得我血都沸腾了。
        - id: ch04-b22
          speaker: polly
          text: >-
            那还等什么？你只要说一声，我就揪着她的耳朵，把她送回去。
        - id: ch04-b23
          speaker: philip
          text: 我真希望你这么做。
        - id: ch04-b24
          speaker: polly
          text: >-
            再容易不过。这个局外人竟敢闯进我们的远征队！你们留在这里等我。要是明早还不见我，中午前后就去拜访海边居民，我会到那里会合。再见。
        - id: ch04-b25
          speaker: narrator
          text: >-
            波利用温柔又亲切的嘴轻轻蹭过菲利普的耳朵，随后飞上天空，围着那个人人讨厌的汽车女人的脑袋，整整盘旋了三圈。
        - id: ch04-b26
          speaker: pretenderette
          text: 走开！把你的傻鹦鹉叫走！啊，它咬住我的耳朵了！
          emotion: angry
        - id: ch04-b27
          speaker: lucy
          text: 别弄疼她。
        - id: ch04-b28
          speaker: polly
          text: >-
            我不会弄疼她。蒙面纱的那个人，马上我还会再咬住你。要是鹰头马身有翼兽和我往同一个方向飞，你就不会太疼。听明白了吗？换成我，就会请他照原路飞回去。这样一来，我几乎一点也不会弄疼你。千万别想下来，你只要落地，两只狗就会扑过去。愿意捂着耳朵就捂吧，我知道你听得清清楚楚。现在我要再咬住你了，双手别动。我不一定非挑耳朵，鼻子也一样合用。
        - id: ch04-b29
          speaker: narrator
          text: >-
            鹰头马身有翼兽背上的女人听完，连忙把原本捂住耳朵的双手全移到鼻子上。就在这一瞬间，波利扑过去，又牢牢咬住了她的耳朵。
        - id: ch04-b30
          speaker: pretenderette
          text: 照原路飞回去！你们这些孩子等着，我早晚要跟你们算账！
          emotion: angry
        - id: ch04-b31
          speaker: narrator
          text: 鹰头马身有翼兽一动不动。女人只好尖叫着命令波利松口。
        - id: ch04-b32
          speaker: philip
          text: >-
            你得说“请”。不是对波利说，那没用。你要对鹰头马身有翼兽说。
        - id: ch04-b33
          speaker: pretenderette
          text: 那就请吧！
          emotion: angry
        - id: ch04-b34
          speaker: narrator
          text: >-
            她气急败坏地挤出那个“请”字。白色双翼立刻分开，又完全展开，鹰头马身有翼兽从沙地升上天空。波利暂时松开女人的耳朵，特意向孩子们保证，只要她一路规规矩矩，自己就不会弄疼她。说完，它又稳稳咬住那只耳朵。鹦鹉的灰色小翅膀和奇兽的白色大翅膀一起掠过辽阔沙漠，越飞越远，很快只剩下远方的影子。
    - id: ch05
      title: 山脊以外
      blocks:
        - id: ch05-b01
          speaker: philip
          text: 波利可真是个宝贝！
        - id: ch05-b02
          speaker: lucy
          text: >-
            那个女觊觎者究竟是谁？别人都对我们那么好，她为什么偏偏这么可恶？
        - id: ch05-b03
          speaker: philip
          text: 我不知道。真是个讨厌的老东西。
        - id: ch05-b04
          speaker: lucy
          text: 我总觉得和她很熟。只要能想起来她是谁就好了。
        - id: ch05-b05
          speaker: philip
          text: >-
            是吗？我们来玩井字棋吧。我口袋里有小笔记簿和一截铅笔，可以一直玩到睡觉的时候。
        - id: ch05-b06
          speaker: narrator
          text: >-
            两个孩子就在砾石荒原上摊开小笔记簿，用那一小截铅笔玩起了井字棋，一直玩到该睡觉的时候。他们坐在广阔的碎石地上，眼前和身后各有一段尚未结束的旅程。身后，波利和鹰头马身有翼兽已经带走了那个讨厌的女人。前方，高高的砾石山脊横在那里，像一座真正的大山，把海边的城堡和未来的一切全都挡住。山脊另一边，是他们还看不见的未知，是下一场冒险，是等待他们到访的海边居民，也是他们尚待完成的伟业。
