audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖沉着，带一点机敏的幽默
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中
    philip:
      display_name: 菲利普
      tts:
        delivery: 直率敏感，想象丰富，情绪来得快
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    lucy:
      display_name: 露西
      tts:
        delivery: 开朗友好，坦率好奇
        timbre: 轻盈稚嫩
        pace: 轻快
        pitch: 中高
    judge_noah:
      display_name: 诺亚先生
      tts:
        delivery: 一本正经又怕麻烦，古板中带着滑稽
        timbre: 苍老清晰
        pace: 稍慢
        pitch: 中
    pretenderette:
      display_name: 女觊觎者
      tts:
        delivery: 尖刻自负，争强好胜，句句不肯相让
        timbre: 尖细明亮
        pace: 稍快
        pitch: 高
    polly:
      display_name: 波利
      tts:
        delivery: 机灵健谈，爱挖苦也很讲义气
        timbre: 清脆略带沙哑
        pace: 稍快
        pitch: 中高
    billy:
      display_name: 比利
      tts:
        delivery: 热情快活，谈到恐惧时倔强又恼火
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高
    perrin:
      display_name: 佩林先生
      tts:
        delivery: 手艺老到，守规矩，训人时直截了当
        timbre: 粗实清晰
        pace: 适中
        pitch: 中低
    islander_1:
      display_name: 岛民甲
      tts:
        delivery: 快活热情，呼喊时朝气十足
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    islander_2:
      display_name: 岛民乙
      tts:
        delivery: 快活热情，呼喊时朝气十足
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中
    islander_3:
      display_name: 岛民丙
      tts:
        delivery: 快活热情，呼喊时朝气十足
        timbre: 轻柔稚嫩
        pace: 轻快
        pitch: 中高
    gull_master:
      display_name: 海鸥首领
      tts:
        delivery: 豪爽高贵，答话爽快而有风度
        timbre: 清亮开阔
        pace: 适中
        pitch: 中
    gull_1:
      display_name: 海鸥甲
      tts:
        delivery: 爽朗友善
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高
    gull_2:
      display_name: 海鸥乙
      tts:
        delivery: 爽朗友善
        timbre: 清澈轻盈
        pace: 轻快
        pitch: 高
    helen:
      display_name: 海伦
      tts:
        delivery: 亲切能干，温柔中带着活泼
        timbre: 温暖明亮
        pace: 从容
        pitch: 中
  chapters:
    - id: ch01
      title: 方舟漂起来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            上回说到，露西还在流泪，菲利普却已经落到女觊觎者手里。她骑着鹰头马身有翼兽，带他飞过平滑碧蓝的大海。露西抽噎着问诺亚先生，那奇兽不是只能驮一个人吗？
        - id: ch01-b02
          speaker: lucy
          text: 她怎么能把菲利普带走？您明明说过，它只能驮一个人的！
          emotion: sad
        - id: ch01-b03
          speaker: judge_noah
          text: 我说的是一个普通人。亲爱的露西，你忘了，菲利普现在已经是伯爵。
        - id: ch01-b04
          speaker: lucy
          text: 那他真的不会出事吗？
        - id: ch01-b05
          speaker: judge_noah
          text: >-
            不会。好了，别再发问了。你来到这里以后，我虽然渐渐习惯了别人问我问题，还是觉得这件事又累人，又叫人不快。求你停下来吧。
        - id: ch01-b06
          speaker: narrator
          text: >-
            露西只好不问了。大家都上床睡觉，她躺在柔软干燥的海藻床上。哭泣本来就很耗力气，她很快也睡着。可这一觉没有睡多久，城堡的警钟、震耳的号角和许多人的呼喊就把她惊醒了。一片亮光照进房间，她跳下床，奔到窗前探出身去。城堡的大院就在下面，人群像一片不停翻动的海，几百支火把仿佛漂在海面上。呼喊声升到空中，像狂风卷起的浪花。城堡四周压着浓黑的夜色，海浪在黑暗中狂吼，混乱的暴风发出尖厉长啸。
        - id: ch01-b07
          speakers: [islander_1, islander_2, islander_3]
          ensemble: chorus
          text: 恐惧来了！快上方舟！快上方舟！
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: >-
            露西冲到房门口，又突然停住，想起了自己的衣服。海藻做的衣裳哪有她自己的衬裙和鞋子耐穿？既然所有人都要去方舟避难，她还是情愿穿好自己的衣服。她很明智地告诉自己，诺亚先生一定会来接她，所以她有时间尽量多套几件。平常穿的连衣裙留在波利斯托波利斯了，她就换上芭蕾舞裙，总比海藻短衫强。穿好以后，她又跑进菲利普的房间，把他的衣服卷成一个小包，夹在臂弯里冲下楼梯。走到楼梯中间，她正好遇见上楼来找她的诺亚先生。
        - id: ch01-b09
          speaker: judge_noah
          text: >-
            你已经准备好了，很好。别害怕。潮水涨得不快，人人都来得及逃走。动物正在登舟，只是把它们配成一对一对，稍微耽误了些时间。岛民大人很能干，大动物都已经上船。我上来时，他们正在哄猪进去，食蚁兽还在吃夜宵。总之，别害怕。
        - id: ch01-b10
          speaker: lucy
          text: 我还是会怕，可我不会哭，也不会胡闹。真希望菲利普也在。
        - id: ch01-b11
          speaker: judge_noah
          text: 你这女孩子太不讲道理。我们正有危险，你却盼他过来跟我们一起受险？
        - id: ch01-b12
          speaker: lucy
          text: 原来我们真的有危险？我还以为您说不用怕呢。
        - id: ch01-b13
          speaker: judge_noah
          text: 你当然不用怕，也当然身处险境。可这里有我，还有方舟。你还想要什么？
        - id: ch01-b14
          speaker: lucy
          text: 什么也不要了。
        - id: ch01-b15
          speaker: narrator
          text: >-
            她用很小的声音说自己什么也不要了，然后牵着诺亚先生的手，来到一座高台。通往塔楼的长坡就在下面，方舟正建在塔顶。成双成对的动物排成长队，吃力而缓慢地往上走。文学硕士们听从岛民大人的指挥，在后面又催又赶。狂风把火把的烈焰吹成长长的金色飘带，海浪撞岸，响得像雷。另一些文学硕士搬着海藻捆成的大包，从高处看去，活像蚁穴挨了一脚以后，东奔西跑、各忙各事的小蚂蚁。岛民大人脸色苍白，神情严肃，却像危急关头的拿破仑一样镇定能干。他特地赶来请教诺亚先生，熊该吃干草还是肉。
        - id: ch01-b16
          speaker: lucy
          text: 熊吃小圆面包。对不起，诺亚先生，我本该等您先说。
        - id: ch01-b17
          speaker: judge_noah
          text: >-
            我的方舟上没有小圆面包，熊只吃蜂蜜。为了供它们吃，我们那对蜜蜂可忙坏了。不过既然你肯定熊爱吃面包，我们就该顺着动物天生的口味，好好照顾它们。
        - id: ch01-b18
          speaker: lucy
          text: 它们特别爱吃。
        - id: ch01-b19
          speaker: billy
          text: 那就给熊吃面包和蜂蜜。蝙蝠又吃什么？
        - id: ch01-b20
          speaker: judge_noah
          text: >-
            这我可不知道。大家讨论以后，只确定蝙蝠不吃猫。至于它们到底吃什么，那是十一桩奥秘之一。让它们先饿着吧。下面一切顺利吗？要不要我亲自去看？
        - id: ch01-b21
          speaker: billy
          text: >-
            它们已经在饿着了，先生。其余事情我应付得来。这可是极大的荣誉。文学硕士搬给养，男孩子一边装货，一边照管牲口，他们都很卖力。
        - id: ch01-b22
          speaker: lucy
          text: 你怕不怕？
        - id: ch01-b23
          speaker: billy
          text: >-
            我才不怕。我已经升任波利斯塔基亚的诺亚副大人，诺亚副大人的心当然不认识恐惧。可要不是你和菲利普替我们造了方舟，想不认识恐惧可真难啊。
        - id: ch01-b24
          speaker: lucy
          text: 方舟是菲利普想出来的。你觉得他真的没事吗？
        - id: ch01-b25
          speaker: billy
          text: 他的心天生就不认识恐惧，所以他一定没事。
        - id: ch01-b26
          speaker: narrator
          text: >-
            最后一只动物抽着鼻子、哼哼唧唧地走进去，原来是一只伤风的豪猪。岛民、文学硕士、露西和诺亚先生随后登舟。等人人都进来，一个格外聪明的文学硕士操纵精巧的机关，从里面关上大门。这里可不像你那只玩具方舟，把所有动物随便塞在一起，混作一团，还常常弄得颠三倒四。活人和活兽若这样挤着，当然不会舒服。诺亚先生和佩林先生督造的方舟，倒更像一艘大型远洋客轮。每种动物都有合适的畜栏，该住舱房的人也都有舒服的房间。岛民和文学硕士井然有序地回舱休息，露西、诺亚先生、佩林先生和岛民大人则聚在宽敞的大厅里。墙和门镶着珍珠母与粉红珊瑚。玻璃球里装满了磷，把四周照得通亮，收集这些磷的巧妙方法，是另一个文学硕士发明的。
        - id: ch01-b27
          speaker: judge_noah
          text: >-
            请各位把忧虑统统赶出脑海。水若退下去，我们留在这里，安然无恙。水若像我深信的那样继续上涨，方舟便会浮起来，我们仍旧安然无恙。明早我来测量水深，再开始掌舵航行。我们会在海岸上挑一处合适的地方登陆，然后前往隐秘之地，请示那里的神谕。现在，离天亮还剩一点时间，各位休息以前要不要吃些点心？我看，来一块船长饼干正合适。
        - id: ch01-b28
          speaker: billy
          text: 这主意再好不过。先生，您可真会挑时候。
        - id: ch01-b29
          speaker: judge_noah
          text: 不过是熟能生巧。
        - id: ch01-b30
          speaker: lucy
          text: 谢谢。我希望……
        - id: ch01-b31
          speaker: narrator
          text: >-
            她没能说完。地板猛地从脚下向上一拱，突如其来的晃动叫人一阵恶心。轰鸣、奔涌、撞击的海水从四面包围过来，大厅歪向一边，众人全被甩到长榻的粉红丝垫上。方舟仿佛从头到尾打了个寒战，紧接着又倒向另一边，那群倒霉的乘客全滚到对面的软垫上。这回，里面真的很像你想象中的玩具方舟了。诺亚先生一家和几只匆忙挑来的动物全塞在里面，又被人抓起来一通猛摇。
        - id: ch01-b32
          speaker: lucy
          text: 是什么？到底是什么？
          emotion: fearful
        - id: ch01-b33
          speaker: billy
          text: 是大海！巨大的恐惧扑过来了，可我一点也不怕！
        - id: ch01-b34
          speaker: narrator
          text: >-
            诺亚先生的胳膊肘压着他的肩，佩林先生的靴子踩着他的耳朵，他还是竭力挺起胸膛。方舟又摇又颤，终于摆正，大厅的地面重新平了。
        - id: ch01-b35
          speaker: perrin
          text: 没事啦。手艺好不好，这时候就看出来了。方舟连一滴水也没进，诺亚先生。
        - id: ch01-b36
          speaker: narrator
          text: >-
            佩林先生收回靴子，诺亚先生收回胳膊肘，双腿微颤地站回黄色地垫。他说没事了，接着唱起来：“漂起来啦，漂起来啦，黑浪滚滚在脚下；方舟滴水也不漏，全体船员都在家。快快升起旗一面，让它迎风飘海涯；漂起来啦，漂起来啦，方舟不漂还能做啥？”
        - id: ch01-b37
          speaker: lucy
          text: 我不知道还能做什么。可我们没有旗呀，对不对？
        - id: ch01-b38
          speaker: judge_noah
          text: 道理是一样的。不过我们恐怕真的忘了预备旗。
        - id: ch01-b39
          speaker: perrin
          text: >-
            我没忘。虽然只是一条庆典纪念手帕，也照样能飘。我带着一面棉布英国国旗呢。不过还是等天亮吧。谨慎总是……您说呢，诺亚先生？这个时辰可不该打开方舟。
        - id: ch01-b40
          speaker: judge_noah
          text: 正是。一、二、三，睡觉！
        - id: ch01-b41
          speaker: narrator
          text: 方舟在不算汹涌的海面上轻轻摇着。大厅里的乘客踉跄着走回舱房，整艘方舟安静下来。
    - id: ch02
      title: 波利与海鸥
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            下面这件事很叫人遗憾。女觊觎者为了残忍地报复，竟把装着波利的柳条笼扔进海里。这本来是不可饶恕的行为，不过她其实根本不懂得怎样做才好，想到这一点，也许还能原谅她。鹰头马身有翼兽拍着白色翅膀继续飞去。菲利普这时正横趴在女觊觎者膝头，这姿势对任何男孩子都实在很不体面，我真心希望你们谁也不会落到同样的境地。笼子撞上水面时，他看得清清楚楚，立刻尖叫起来。
        - id: ch02-b02
          speaker: philip
          text: 波利！
          emotion: fearful
        - id: ch02-b03
          speaker: polly
          text: 我没事，你也别泄气！
        - id: ch02-b04
          speaker: pretenderette
          text: 它说什么？
        - id: ch02-b05
          speaker: philip
          text: 说了句别泄气什么的。
        - id: ch02-b06
          speaker: pretenderette
          text: 很好，它有一阵子别想再啄东西了。
        - id: ch02-b07
          speaker: narrator
          text: >-
            鹰头马身有翼兽的宽大白翼继续掠过辽阔的海面，笼子却独自在水上漂了一整夜。等到黎明，初生的阳光照亮海水，海鸥从远近各处飞来。它们一面盘旋，一面乘风滑翔，还发出阵阵叫声，都想看看这个在它们的海里上下颠簸的陌生东西究竟是什么。波利倒挂在笼顶，牢牢抓紧栏杆，用鸟语向它们打招呼。
        - id: ch02-b08
          speaker: polly
          text: 喂！
        - id: ch02-b09
          speaker: gull_master
          text: >-
            你自己才喂呢。出了什么事？你是谁？怎么待在这个古怪的捕虾笼里？
        - id: ch02-b10
          speaker: polly
          text: 凭我们同为鸟类的情分，请你们救我脱离困境。
        - id: ch02-b11
          speaker: gull_master
          text: 真正的海鸥绝不会拒绝这种请求。鸟兄弟，我们能帮什么忙？
        - id: ch02-b12
          speaker: polly
          text: >-
            事情很急，不过我还镇定得住。我越来越湿，又很讨厌海水，盐水会伤我的羽毛。鸟兄弟，我能不能吩咐你的伙伴做件事？
          emotion: calm
        - id: ch02-b13
          speaker: gull_master
          text: 尽管说。
        - id: ch02-b14
          speaker: polly
          text: >-
            请四位兄弟把这个可恶的笼子抬到浪尖上方，再请其余兄弟用你们结实的长嘴啄断栏杆，放我出去。
        - id: ch02-b15
          speaker: gull_master
          text: 乐意效劳，这不过是一件小事。
        - id: ch02-b16
          speaker: narrator
          text: >-
            海鸥首领第一个用高贵的长嘴衔住笼子。大家合力把笼子举到空中，又啄开栏杆，放出波利。波利抖开湿翅膀，当然也要回报它们。
        - id: ch02-b17
          speaker: polly
          text: 谢谢各位鸟兄弟。有来有往才是情谊。昨天，那边的海滩还是白茫茫的，满地全是蛤蜊。
        - id: ch02-b18
          speakers: [gull_master, gull_1, gull_2]
          ensemble: chorus
          text: 谢谢你，鸟兄弟！
          emotion: happy
        - id: ch02-b19
          speaker: narrator
          text: >-
            海鸥们飞快地奔向蛤蜊滩。波利就这样逃出笼子，飞回岸边，去找布尔格莱威说了那几句悄悄话。这件事，你们在上一章已经听说过了。
    - id: ch03
      title: 神谕的两种声音
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            天亮以后，阳光从窗口照进方舟，里面看起来舒服极了。外面当然也阳光灿烂，佩林先生的英国国旗在风中欢快地飘扬。早餐摆在方舟末端那座露台上，也就是船身向上翘起的那一头。早餐十分可口，海面也平滑得不能再平滑，简直是一片完美的海。幸好海很平，因为四周除了海，什么也没有。方舟的前后左右全是海，连一点陆地的影子都看不见。
        - id: ch03-b02
          speaker: lucy
          text: 到处都是海，我们怎么找得到路？
        - id: ch03-b03
          speaker: billy
          text: 这样反倒更好。看不见陆地时，诺亚先生掌舵更拿手。还是那句话，熟能生巧。
        - id: ch03-b04
          speaker: lucy
          text: 那么，一看见陆地，他反而不会掌舵了？
        - id: ch03-b05
          speaker: billy
          text: 看见陆地以后，谁都能掌。你想掌也行。
        - id: ch03-b06
          speaker: narrator
          text: >-
            于是，方舟最后真由露西掌舵，在诺亚先生指点下驶入港口。只要认得路，方舟特别好开。它和别的船不一样，不用帆，不用蒸汽机，也不用桨来推动。方舟身上那股地地道道的“方舟劲儿”，会让它完全照舵手的意思前进。你只要喊左舵、右舵、一直向前、慢行，它就马上照办。这一点，可比我认识的许多人强。掌舵既轻松又有趣，露西只需一直把船头对准几英里外的城镇。岸边闪耀着圆顶和尖塔，城镇越来越近。聚在岸上的人起初只像一道黑线，后来黑线上冒出一颗颗白点，那正是人们的脸。方舟终于靠上码头，友善的百姓大声欢呼。诺亚先生踏上坚实的陆地，总督和一批精心挑选的显要人物立刻上前迎接。
        - id: ch03-b07
          speaker: perrin
          text: >-
            这对他们可是件大事。这里平常没什么事情，一帮人懒得出奇，几乎赶得上瞌睡国。
        - id: ch03-b08
          speaker: lucy
          text: 他们为什么这么懒？
        - id: ch03-b09
          speaker: billy
          text: >-
            这一带的洋葱和土豆都是野生的，不干活也有足够的东西吃。而且，洋葱会叫人犯困。
        - id: ch03-b10
          speaker: narrator
          text: >-
            诺亚先生和总督商量事情时，其他人站到一旁说话。总督穿着一件毛茸茸的长袍，赶到港口时既匆忙又慌乱。诺亚先生同他把一切商量妥当，终于回到大家身边。他告诉众人，岛民、文学硕士和所有动物都可以暂住在公共公园里。他们先去请示神谕，再决定这些岛民和动物往后该怎么办。
        - id: ch03-b11
          speaker: judge_noah
          text: >-
            他们总得住在什么地方。我的日子最近实在太热闹了。不过，方舟伯爵只剩三项伟业，也许完成以后，我们就能清静一点。现在，你和我得骑上骆驼出发。
        - id: ch03-b12
          speaker: lucy
          text: 方舟伯爵？
        - id: ch03-b13
          speaker: judge_noah
          text: >-
            就是菲利普。请你努力记住，他已经是伯爵了。好了，我们该走了。
        - id: ch03-b14
          speaker: narrator
          text: >-
            他们骑着骆驼走了整整七天，穿过沙漠和森林，翻过山丘，又越过谷地，终于来到神谕所在的隐秘之地。那里究竟在哪里，我不能告诉你，因为这是十一桩奥秘之一。神谕究竟是什么，我也不能说，那又是另一桩奥秘。我只能告诉你，想去请示它，就要沿着一排排圆柱走很远，那些圆柱很像埃及陵墓里的石柱。越往前走，四周越暗。等一切完全黑下来，极远处会露出一丁点小小的光。美妙的乐声也从很远的地方传来，还有世上任何树林、田野和花园里都没有的花香。花香中混着焚香的气息，也混着古老挂毯房间的气味，那些房间已经很久很久没人住过。你会想起一生中见过、听过的一切悲伤而美丽的事，然后伏倒在地，双手掩住自己的脸，呼唤神谕。只要你是合适的那种人，它便会回答你。
        - id: ch03-b15
          speaker: narrator
          text: >-
            露西和诺亚先生在黑暗中等着，神谕终于开口。露西没听见任何词句，只听见世间最美的声音轻轻说话。它那么甜美，那么高贵，又那么勇敢，让她顿时觉得自己也敢面对所有危险，也有力量完成所有需要完成的伟业，把菲利普从卑鄙的女觊觎者手中救出来。七天长途旅行的疲惫全都消失了。若不是想到菲利普还需要她，她简直愿意永远留在那里听下去。世上的其余一切都慢慢退远，显得毫无价值，也毫无意义。留下来的，只有那柔和的金色声音，还有一个灰暗、坚硬的声音提醒她，她必须照顾菲利普。两道声音合在一起，成了一支比贝多芬任何一首奏鸣曲都美的和声。露西知道，自己应该听从灰色的声音，也会一生记得金色的声音。
        - id: ch03-b16
          speaker: narrator
          text: >-
            偏偏有个讨厌的东西扯住她的袖子，硬把她从美妙的金色声音旁拉开。原来是诺亚先生，他一面拉她，一面催她赶快离开。他们转过身，背对那一点微光、远处的乐声和迷人的香气，神谕的声音立刻停了。两个人重新穿过昏暗的柱廊，向远处灰白的一小点阳光走去。直到走出隐秘之地，重新站在空旷的天空下面，露西才开口问起神谕究竟说了什么。
        - id: ch03-b17
          speaker: lucy
          text: 它到底说了什么？
        - id: ch03-b18
          speaker: judge_noah
          text: 你一定听见了。
        - id: ch03-b19
          speaker: lucy
          text: >-
            我听见了声音，也明白它的意思，可我没听懂那些话。那声音像梦，也像我想到过的所有美好事物。
        - id: ch03-b20
          speaker: judge_noah
          text: >-
            我倒觉得它办事干脆，直截了当。声音清清楚楚，每个字我都记得。
        - id: ch03-b21
          speaker: narrator
          text: >-
            可见同一件事落到两个人心里，感受能有多么不同。露西一路在诺亚先生身边小跑，仍紧紧抱着菲利普的衣服包。这么多天过去了，她一次也没有放下。她又问了一遍，诺亚先生便神情庄重地吟诵起神谕给他的几句话。不得不赞成他的看法，对于神谕来说，它们的确直白得出奇：“快把方舟再登上，离开陆地去远航，一路驶向那海岛，半点也别转方向。”
        - id: ch03-b22
          speaker: lucy
          text: 它真的这样说？
        - id: ch03-b23
          speaker: judge_noah
          text: >-
            当然。这是专门给我的指示。你听见的肯定不同，神谕不会对每个人说同样的话。它没给你什么特别的指示吗？
        - id: ch03-b24
          speaker: lucy
          text: 它只叫我尽力勇敢，尽力做个好人。
        - id: ch03-b25
          speaker: judge_noah
          text: 那你照你的指示办，我照我的办。
        - id: ch03-b26
          speaker: lucy
          text: >-
            可到了那座岛又不能登陆，去那里有什么用？只有两个人能上岛，我们又不是那两个人。
        - id: ch03-b27
          speaker: judge_noah
          text: >-
            你要是一开口就问有什么用，我们哪里也去不了。况且，你说的十句话里总有六句是问题。
    - id: ch04
      title: 不可登临之岛
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            很抱歉，这一章总被一排排星号切成好几段。许多地方同时发生许多件事时，星号实在很难避免。所以，只要做得到，最好让同行的人始终待在一起。我偏偏任由自己笔下的人物分散开来，害得菲利普、鹦鹉和其他伙伴同时经历着三路完全不同的冒险。对讲故事的人来说，这件事实在为难，前面那些星号全是这么来的。希望你们能够原谅。好了，现在我们就踩着星号铺成的路，回到菲利普身边。他还头朝下，落在女觊觎者手里。
        - id: ch04-b02
          speaker: narrator
          text: >-
            女觊觎者贴着鹰头马身有翼兽的耳朵说了魔法词，却没有再告诉它该去什么地方。因此，该往哪里飞，这头奇兽完全可以自己做主。它在天地之间盘旋三圈，甩动白色长鬃，径直奔向不可登临之岛。女觊觎者不知道那是什么地方。等飞得近了，她才看见彩虹色的沙滩、棕榈树和瀑布，还有碧绿清凉的树丛、五颜六色的花朵和鲜亮诱人的果实。她觉得在那里落脚，稍微歇一会儿也不错。讨厌的人毕竟有时也会疲倦，而她这一天过得实在不轻松。她没有阻拦奇兽，也没有命令它转向。等它悬停在全岛最美的林间草地上方，离地只有几英寸，她一把将菲利普掀下膝头。菲利普摔作一团，却马上爬起来，一头钻进灌木，比任何一只兔子逃得都快。这份临危不乱，足以叫他成为英雄。如果现在还不是英雄，他以后也永远不会是了。
        - id: ch04-b03
          speaker: pretenderette
          text: 看我怎么教训你！
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: >-
            女觊觎者准备从奇兽背上跳下去，先低头找一处柔软的落脚地，却发现每片草叶都变成了小小的钢矛，所有矛尖都笔直朝着她。她只好让鹰头马身有翼兽飞到另一片草地，那里依然满地都是钢矛。她又飞向彩虹般的沙滩，低头一看，沙子正在不停颤动，原来全是危险的流沙。岛上凡是长草的地方都布满钢矛，凡是有沙的地方都藏着可怕的陷阱。她还想直接落进一个小水潭，好在及时看清，潭里那片银光闪闪的东西根本不是水，而是烧得发白的金属熔液。
        - id: ch04-b05
          speaker: pretenderette
          text: >-
            这地方真讨厌。要丢下那个坏孩子，我恐怕再也挑不到比这里更糟的地方。等我派人把他抓回牢里，他自然会明白谁才是主人。喂，你，赶快回波利斯托波利斯。听懂了吧？请你，我是说。
        - id: ch04-b06
          speaker: narrator
          text: >-
            她接着念出那个魔法词。菲利普躲在附近的灌木丛里，透过枝叶悄悄偷看。他不但听见了那个词——我可不敢告诉你们它是什么——也第一次清清楚楚地看见了女觊觎者的脸。他藏在树丛中，又是哆嗦，又是发抖。原来，她根本不是陌生人，而是露西的保姆。就是那个穿灰色裙子、长着一双肥大脚板的女人。她曾经对菲利普那么凶，还亲手推倒了他辛苦搭出的城。女觊觎者是菲利普来到世上以后，遇见过的唯一一个真正叫人不舒服的人。
        - id: ch04-b07
          speaker: philip
          text: 她究竟怎么会来到这里？我又怎么才能逃开她？
          emotion: fearful
        - id: ch04-b08
          speaker: narrator
          text: >-
            菲利普没有看见那些钢矛、流沙和熔化的金属。他忧心忡忡地等着女觊觎者落地，以为她马上就会下来，跟他玩一场他一点也不想玩的捉迷藏。谁知就在他疑惑的时候，鹰头马身有翼兽忽然展开双翼，带着她飞走了。菲利普独自留在岛上。可一个人又有什么不好？独自待着，怎么也比跟女觊觎者待在一起强。对菲利普来说，岛上没有烧得白亮的金属，没有钢矛，也没有流沙陷阱，只有沾着露水的青草、芬芳的花朵、繁茂的树木，还有安全和快乐。
        - id: ch04-b09
          speaker: philip
          text: 要是露西也在这里就好了。
        - id: ch04-b10
          speaker: narrator
          text: >-
            等他确信女觊觎者真的走远了，便从灌木里钻出来，开始探索小岛。岛上有你能想到的每一种花和每一种果实，而且它们全都生长在一起。金黄的橙子挨着洁白的橙花，粉红的苹果花伴着鲜红的苹果，樱桃和樱花、草莓和草莓花也都同时长着。它们无拘无束地生长，又香又甜。菲利普心里隐约觉得，自己以前好像听说过一座花果同时生长的岛，可除此以外什么也想不起来。他穿过美丽的果园，看见一座湖，湖面竟然结着冰。他又记起，在那座听说过的岛上，即使花果满树，也总有一座结冰的湖，随时可以滑冰。再往前，他看见一座小凉亭，全部用豪猪刺搭成，模样就像海伦的笔盒。
        - id: ch04-b11
          speaker: narrator
          text: >-
            这一下，菲利普终于全明白了。眼前所有奇妙的景物，都在很久以前由他和海伦一起想象出来，全都属于他们共同创造的那座岛。那时候，海伦还常常拿起笔，替这座岛绘制一张又一张地图。
        - id: ch04-b12
          speaker: philip
          text: >-
            这就是我们自己的岛！我们说过，别人谁也不能来。所以女觊觎者落不下来，所以大家才叫它不可登临之岛。我要找小圆面包树吃点东西，再去船屋开出闪电脱缰号，回去接露西。真希望能带她到这里来，可没有海伦同意，我当然不能这样做。
          emotion: happy
        - id: ch04-b13
          speaker: narrator
          text: >-
            闪电脱缰号正是海伦替这座岛想出来的魔法游艇。菲利普很快找到一丛奇妙的灌木，枝头结出的果实正是小圆面包，附近还长着一棵果酱馅饼树。除非亲手从树上摘下过刚刚长熟、新鲜又黏软的果酱馅饼，你根本不会知道它能有多好吃。那些馅饼摸起来黏糊糊的，像七叶树春天刚冒出的芽，可要说吃起来的滋味，那就比树芽好得太多了。
        - id: ch04-b14
          speaker: narrator
          text: >-
            他朝船屋走去，一路上越来越快乐。自己和海伦曾经共同规划、画在地图上的地方，一处接着一处出现，他也一处接着一处认了出来。他经过一座用黄金和大理石砌成的房子，门上写着国王的宫殿。他非常想进去探险，可一想到还在等他的露西，只好继续赶路。通向船屋的林间小径又窄又绿，浓密的树叶遮在头顶。路旁有一座亲切可爱的茅草小屋，门上标着女王的宫殿。海伦曾坚持说，她最喜欢这栋房子，一定要把它留给自己。
        - id: ch04-b15
          speaker: philip
          text: >-
            它真漂亮。要是海伦在这里就好了。她也创造了这座岛，没有她，我一个人绝对想不出这一切。她应该在这里。
          emotion: sad
        - id: ch04-b16
          speaker: narrator
          text: >-
            说完这些话，菲利普忽然感到说不出的孤独和难过。他沿着林间小径继续向前走，一面走，一面想，这个奇妙的世界里既然到处都有魔法，会不会也有一种足够强大的魔法，可以把海伦带到这里？那样，她就能亲眼看看这座真正属于他们两人的岛，也可以亲口答应，让他把露西带来。他心里还在想着这个愿望，脚下转过林间小径的一处弯，竟迎面撞进一个人的怀抱。那个抱住他的人，不是别人，正是海伦。
