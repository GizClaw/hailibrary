  chapters:
    - id: ch01
      title: CHAPTER VIII. UPS AND DOWNS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            We left Lucy crying, while the hateful Pretenderette carried Philip away over the smooth blue sea. She sat on the Hippogriff, and Philip was held tightly in her grasp.
        - id: ch01-b02
          speaker: lucy
          text: >-
            Oh, Mr. Noah, how could she do it? You said the Hippogriff could only carry one person!
          emotion: sad
        - id: ch01-b03
          speaker: mr_noah
          text: >-
            One ordinary human being, my dear. You are forgetting that Philip is an earl now.
          emotion: calm
        - id: ch01-b04
          speaker: lucy
          text: >-
            But do you truly think he will be safe?
        - id: ch01-b05
          speaker: mr_noah
          text: >-
            Yes. And now, Lucy, please ask no more questions. Since you came to our shores, I have slowly grown more used to being questioned. Even so, I still find it tiring and unpleasant. I beg you to stop.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Lucy stopped. Everyone went to bed, and because crying is tiring, everyone fell asleep. They did not sleep for long.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Lucy woke on her bed of soft, dry seaweed. The castle alarm bell was ringing. Trumpets blared, voices shouted, and a fierce light shone through her window. She sprang up and leaned outside. Far below, the great courtyard heaved like a sea of people. Hundreds of torches seemed to float above them, and the shouting rose like foam in the wind.
        - id: ch01-b08
          speakers: [townsman_1, townsman_2, townsman_3]
          ensemble: chorus
          text: >-
            The Fear! The Fear! Get to the ark! Get to the ark!
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: >-
            Black night pressed against the castle. Beyond it, waves roared wildly and a violent wind shrieked. Lucy ran toward her door, then stopped short.
        - id: ch01-b10
          speaker: lucy
          text: >-
            My clothes!
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: >-
            She dressed as fast as she could. Her own petticoats and shoes would last much better than clothes made of seaweed. If everyone had to shelter in the ark, she wanted proper clothes on. Her everyday dress was still in Polistopolis, but her ballet dress was better than the seaweed tunic.
        - id: ch01-b12
          speaker: lucy
          text: >-
            Mr. Noah is sure to come for me. I will put on as many clothes as I can before he gets here.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Once dressed, she hurried into Philip's room, rolled his clothes into a small bundle, tucked it under her arm, and ran downstairs. Halfway down, she met Mr. Noah coming up.
        - id: ch01-b14
          speaker: mr_noah
          text: >-
            Ah, you are ready. Excellent. Do not be frightened, my Lucy. The tide is coming in slowly, so everyone will have time to escape. Everything is prepared, and the animals are boarding now. Sorting them into pairs caused a small delay, but we are making progress. The Lord High Islander is doing remarkably well. All the large animals are aboard. They were persuading the pigs to enter when I came up, and the anteaters were having a late supper. There is no need for alarm.
          emotion: calm
        - id: ch01-b15
          speaker: lucy
          text: >-
            I cannot help being frightened. But I will not cry or behave foolishly. Oh, I wish Philip were here.
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: >-
            She slipped her free hand into Mr. Noah's.
        - id: ch01-b17
          speaker: mr_noah
          text: >-
            What an unreasonable child you are. We are in danger, and you wish Philip could be here to share it?
        - id: ch01-b18
          speaker: lucy
          text: >-
            Then we are in danger! I thought you said I should not be alarmed.
          emotion: surprised
        - id: ch01-b19
          speaker: mr_noah
          text: >-
            And you should not be. Of course there is danger. But I am here, and the ark is here. What else could you possibly need?
        - id: ch01-b20
          speaker: lucy
          text: >-
            Nothing.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Her voice was very small. Together they reached a raised platform above the long sloping road to the tower where the ark had been built. A procession of animals climbed slowly in pairs. The M.A.s urged them onward under the Lord High Islander's orders. Wind pulled the torch flames into long golden streamers, while the waves thundered against the shore. Other M.A.s carried bales wrapped in seaweed. From above, they looked like ants rushing in every direction after someone has kicked their hill.
        - id: ch01-b22
          speaker: narrator
          text: >-
            The Lord High Islander arrived looking pale and serious, but as calmly capable as Napoleon in a crisis.
        - id: ch01-b23
          speaker: lord_high_islander
          text: >-
            Sorry to trouble you, sir, but we badly need your experience. I cannot remember what bears eat. Should we give them hay or meat?
        - id: ch01-b24
          speaker: lucy
          text: >-
            They eat buns. I beg your pardon, Mr. Noah. I know I should have waited for you to answer.
        - id: ch01-b25
          speaker: mr_noah
          text: >-
            There were no buns in my ark. Our bears ate nothing but honey, which kept our pair of bees very busy. Still, if you are certain bears enjoy buns, then we must be humane and respect the animals' natural tastes.
        - id: ch01-b26
          speaker: lucy
          text: >-
            They adore them.
        - id: ch01-b27
          speaker: lord_high_islander
          text: >-
            Buns and honey, then. What shall we feed the bats?
        - id: ch01-b28
          speaker: mr_noah
          text: >-
            I do not know. After some discussion, I believe we decided that bats do not eat cats. What they do eat is one of the eleven mysteries. The bats had better go without food.
        - id: ch01-b29
          speaker: lord_high_islander
          text: >-
            They already are, sir.
        - id: ch01-b30
          speaker: mr_noah
          text: >-
            Is everything else going well? Should I come down and keep a personal eye on matters?
        - id: ch01-b31
          speaker: lord_high_islander
          text: >-
            I think I have it under control, sir. It is a great honor. The M.A.s are bringing in supplies, and the boys are storing them and herding the animals. They work very well.
        - id: ch01-b32
          speaker: narrator
          text: >-
            As he turned back to his work, Lucy whispered to him.
        - id: ch01-b33
          speaker: lucy
          text: >-
            Are you frightened?
        - id: ch01-b34
          speaker: lord_high_islander
          text: >-
            Not at all. I have been promoted to Lord Vice-Noah of Polistarchia, and fear is a stranger to every Vice-Noah's heart. But think how hard it would have been to keep Fear a stranger if you and Philip had not found us the ark!
        - id: ch01-b35
          speaker: lucy
          text: >-
            Philip was the one who did it. Do you think he is all right?
        - id: ch01-b36
          speaker: lord_high_islander
          text: >-
            Fear is naturally a stranger to his heart too, so I am certain he is all right.
        - id: ch01-b37
          speaker: narrator
          text: >-
            The last animal to board was a porcupine with a cold, sniffling and snuffling all the way. Then the islanders, the M.A.s, Lucy, and Mr. Noah went in. An unusually clever M.A. worked an ingenious machine that shut the ark's door from inside.
        - id: ch01-b38
          speaker: narrator
          text: >-
            This was nothing like the toy ark you may have at home. In a toy, all the animals are dropped in any way they fit, mixed together and quite possibly upside down. With living animals and living people, that would be most uncomfortable. The ark designed by Mr. Noah and Mr. Perrin was more like a great Atlantic liner. Every beast had a suitable stall, and everyone suited to sleeping in a cabin had a delightful cabin. The islanders and M.A.s retired to theirs in perfect order. Lucy, Mr. Noah, Mr. Perrin, and the Lord High Islander gathered in a large saloon. Its walls and doors were richly set with mother-of-pearl and pink coral. Glass globes lit the room. They were filled with phosphorus collected by an ingenious process that another M.A. had invented.
        - id: ch01-b39
          speaker: mr_noah
          text: >-
            Now everyone may put anxiety aside. If the water falls, we stay safe. If it rises, as I fully expect, the ark will float and we shall still be safe. In the morning I will take soundings and set our course. We will land at a suitable place, travel to the Hidden Places, and ask the oracle what to do. Before we sleep again, would anyone care for a little refreshment? A captain's biscuit seems most suitable.
        - id: ch01-b40
          speaker: narrator
          text: >-
            He opened a tin from a locker and passed it around.
        - id: ch01-b41
          speaker: lord_high_islander
          text: >-
            That is first-rate, sir. You always know exactly what is wanted.
        - id: ch01-b42
          speaker: mr_noah
          text: >-
            It comes from practice.
        - id: ch01-b43
          speaker: lucy
          text: >-
            Thank you. I only wish...
        - id: ch01-b44
          speaker: narrator
          text: >-
            She never finished. With a sickening suddenness, the floor surged beneath their feet. Roaring, rushing water battered all around them. The saloon tipped sharply sideways, and the entire party tumbled onto the pink silk cushions of the long settee. A shudder ran from one end of the ark to the other. Then the vessel rolled the opposite way and flung its unfortunate passengers onto the cushions across the room. By then it truly was like the inside of a toy ark after you have pushed in Mr. Noah, his family, and a few animals chosen in a hurry, and shaken them all together.
        - id: ch01-b45
          speaker: lucy
          text: >-
            What is it? Oh, what is happening?
          emotion: fearful
        - id: ch01-b46
          speaker: lord_high_islander
          text: >-
            It is the sea! The great Fear has come upon us, and I am not afraid!
        - id: ch01-b47
          speaker: narrator
          text: >-
            He tried to stand proudly, though Mr. Noah's elbow pinned his shoulder and Mr. Perrin's boot pressed against his ear. The ark shook, shivered, and came upright. The saloon floor was flat again.
        - id: ch01-b48
          speaker: mr_perrin
          text: >-
            She's all right, sir. Good workmanship shows at a time like this. She hasn't taken in one drop.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Mr. Perrin reclaimed his boot. Mr. Noah reclaimed his elbow and rose, a little unsteadily, onto his yellow mat.
        - id: ch01-b50
          speaker: mr_noah
          text: >-
            All is well. We're afloat on the dark rolling tide. The ark is watertight, and the crew is inside. Raise the flag and let it wave over the sea! We are afloat, and what else should we be?
        - id: ch01-b51
          speaker: lucy
          text: >-
            I do not know. But we have not got a flag, have we?
        - id: ch01-b52
          speaker: mr_noah
          text: >-
            The principle remains the same. I am afraid we forgot the flag.
        - id: ch01-b53
          speaker: mr_perrin
          text: >-
            I didn't, sir. Mine is only a Jubilee handkerchief, but it will wave properly. Not until daylight, though. Better to be careful, don't you think? We ought not to open the ark outside working hours.
        - id: ch01-b54
          speaker: narrator
          text: >-
            He slowly drew a cotton Union Jack from his breast pocket.
        - id: ch01-b55
          speaker: mr_noah
          text: >-
            Precisely. One, two, three. Bed!
        - id: ch01-b56
          speaker: narrator
          text: >-
            The ark rocked gently now on a sea that was not too rough. The saloon passengers staggered to their cabins, and silence settled over the ark.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Meanwhile, the Pretenderette dropped Polly's wicker cage into the sea. It was a cruel act of revenge, though perhaps she truly knew no better. The Hippogriff's white wings swept onward. Philip lay across her knees in a very undignified position. When the cage struck the water, he screamed.
        - id: ch01-b58
          speaker: philip
          text: >-
            Oh, Polly!
          emotion: fearful
        - id: ch01-b59
          speaker: parrot
          text: >-
            I am all right! Keep your spirits up!
        - id: ch01-b60
          speaker: nurse
          text: >-
            What did that bird say?
        - id: ch01-b61
          speaker: philip
          text: >-
            Something about keeping his pecker up.
        - id: ch01-b62
          speaker: nurse
          text: >-
            Ah, well. He will not be pecking anything for a long while.
        - id: ch01-b63
          speaker: narrator
          text: >-
            She sounded very satisfied with that thought. The Hippogriff's broad white wings kept sweeping onward over the wide sea, carrying Philip farther away. Polly's wicker cage fell, struck the water, and floated. It drifted alone through the night until dawn. Then, with circling wings, light gliding movements, and sharp cries, gulls came from near and far. They all wanted to inspect this strange new object that bobbed up and down in their waters under the light of the newborn day.
        - id: ch01-b64
          speaker: parrot
          text: >-
            Hello there!
        - id: ch01-b65
          speaker: narrator
          text: >-
            Polly spoke in bird language while clinging upside down to the cage roof.
        - id: ch01-b66
          speaker: master_gull
          text: >-
            Hello yourself. What has happened? Who are you, and why are you sitting in that unnatural lobster pot?
        - id: ch01-b67
          speaker: parrot
          text: >-
            By the birdhood we share, I beg you to help me in my trouble.
        - id: ch01-b68
          speaker: master_gull
          text: >-
            No true gull could refuse such an appeal. Tell us what we can do, brother bird.
        - id: ch01-b69
          speaker: parrot
          text: >-
            The matter is urgent, though I remain calm. I am becoming very wet. Salt water is unpleasant and bad for my feathers. May I give your followers an order?
          emotion: calm
        - id: ch01-b70
          speaker: master_gull
          text: >-
            Go ahead.
        - id: ch01-b71
          speaker: parrot
          text: >-
            Let four brave birds lift this hateful trap above the waves. Then use your strong beaks to break the bars and free me.
        - id: ch01-b72
          speaker: master_gull
          text: >-
            Delighted. It is only a small favor.
        - id: ch01-b73
          speaker: narrator
          text: >-
            With a graceful sweep of his splendid wings, the master gull seized the cage first. The others joined him. They lifted it into the air, broke through its bars, and set Polly free.
        - id: ch01-b74
          speaker: parrot
          text: >-
            Thank you, brother birds. One good turn deserves another. Yesterday, the beach over there was white with cockles.
        - id: ch01-b75
          speakers: [master_gull, gull_2, gull_3]
          ensemble: chorus
          text: >-
            Thank you, brother bird!
          emotion: happy
        - id: ch01-b76
          speaker: narrator
          text: >-
            They flew swiftly toward the cockles. That was how Polly escaped and returned to shore for the little talk with the blugraiwee that you heard about in the last chapter.
        - id: ch01-b77
          speaker: narrator
          text: >-
            By daylight, the ark was a very pleasant place. Sunlight streamed through all its windows. The sun shone just as brightly outside, of course, and Mr. Perrin's Union Jack fluttered cheerfully in the wind. Breakfast was served on the terrace at the ark's stern, on the part where the boat-shaped end curves upward. It was an excellent breakfast, and the water lay perfectly smooth around them. The smoothness was fortunate, because water was all there was. On every side of the ark stretched the same unbroken sea. Not one scrap of land could be seen.
        - id: ch01-b78
          speaker: lucy
          text: >-
            How can we possibly find the way when there is nothing around us but sea?
        - id: ch01-b79
          speaker: lord_high_islander
          text: >-
            That actually makes things easier. Mr. Noah steers much better when he cannot see land. It comes from practice.
        - id: ch01-b80
          speaker: lucy
          text: >-
            Will he steer badly once land comes into sight?
        - id: ch01-b81
          speaker: lord_high_islander
          text: >-
            Once you can see land, anyone can steer. You may do it yourself if you like.
        - id: ch01-b82
          speaker: narrator
          text: >-
            So Lucy was the one who steered the ark into harbor, following Mr. Noah's directions. Arks are very easy to steer once you know the way. They are not like ordinary ships. An ark needs no sails, no steam engine, and no banks of oars to drive it forward. Its very arkishness makes it move exactly as the steersman wishes. The person at the helm only has to call port, starboard, straight ahead, slow, or any other clear order. Unlike many people you may know, the ark immediately does precisely what it is told.
        - id: ch01-b83
          speaker: narrator
          text: >-
            Lucy kept the ark's nose pointed at the domes and pinnacles of a town that glittered on the shore several miles away. Little by little, the town grew closer. A black streak at the water's edge separated into the people of the town. Then small white dots within that streak became their faces. At last the ark was moored securely against the quay. The friendly people cheered while Mr. Noah stepped onto firm ground. The governor came forward to welcome him, accompanied by a specially chosen group of the town's most important citizens.
        - id: ch01-b84
          speaker: mr_perrin
          text: >-
            This is a great event for them. Nothing much happens here. They're terribly lazy, nearly as bad as the people of Somnolentia.
        - id: ch01-b85
          speaker: lucy
          text: >-
            Why are they so lazy?
        - id: ch01-b86
          speaker: lord_high_islander
          text: >-
            I believe it is because onions and potatoes grow wild here. People can eat without working, and the onions make them sleepy.
        - id: ch01-b87
          speaker: narrator
          text: >-
            They spoke apart while Mr. Noah settled matters with the governor, who had rushed to the harbor in a great hurry, a great flurry, and a furry robe.
        - id: ch01-b88
          speaker: mr_noah
          text: >-
            Everything is arranged. The islanders, M.A.s, and animals may camp in the public park until we consult the oracle and decide their future. They must live somewhere, I suppose. Life has become far too eventful for me. Still, the Earl of Ark has only three deeds left to perform. Perhaps then we may enjoy a little peace.
        - id: ch01-b89
          speaker: lucy
          text: >-
            The Earl of Ark?
        - id: ch01-b90
          speaker: mr_noah
          text: >-
            Philip, of course. I wish you would remember that he is an earl now. You and I must take a camel and leave at once.
        - id: ch01-b91
          speaker: narrator
          text: >-
            Then came seven long days of traveling by camel. Lucy and Mr. Noah crossed open desert and deep forest. They climbed over hills, descended into valleys, and continued onward until at last they reached the Hidden Place where the oracle is. I may not tell you where that place lies, because its location is one of the eleven mysteries. And I must not tell you what the oracle itself is, because that is yet another of those mysteries.
        - id: ch01-b92
          speaker: narrator
          text: >-
            To consult the oracle, they had to walk a very long way between rows of round pillars. The pillars looked rather like those inside Egyptian tombs. With each step the passage grew darker and darker. When the darkness became complete, they saw a tiny point of light a very long way off. From equally far away came beautiful music. The air carried the perfume of flowers that grow in no earthly wood, field, or garden. Mingled with it were the scents of incense and ancient rooms hung with tapestries, rooms where no one had lived for a very long time.
        - id: ch01-b93
          speaker: narrator
          text: >-
            All the sad and beautiful things they had ever known came back to them. They fell to the ground, covered their faces, and called upon the oracle. If a person is the right kind of person, the oracle answers.
        - id: ch01-b94
          speaker: narrator
          text: >-
            Lucy and Mr. Noah waited. At last the oracle spoke. Lucy heard no words. She heard only the loveliest voice in the world, soft, sweet, fine, and brave. At once she felt brave enough to face any danger and strong enough to do whatever must be done to rescue Philip from the Pretenderette. The weariness of the seven-day journey vanished. If Philip had not needed her, she could have listened forever.
        - id: ch01-b95
          speaker: narrator
          text: >-
            Everything else in the world faded until it seemed worthless and without meaning. Only that soft golden voice remained. Alongside it Lucy heard the hard grey voice saying that she had to look after Philip. Golden and grey sounded together in a harmony more beautiful than anything in Beethoven's sonatas. Lucy understood that she must follow what the grey voice told her to do. She also knew she would carry the memory of the golden voice with her for as long as she lived.
        - id: ch01-b96
          speaker: narrator
          text: >-
            Then something tugged annoyingly at her sleeve. Mr. Noah was pulling her away and telling her to come. They turned from the light, the music, and the wonderful scents. The voice stopped at once. Soon they were walking between shadowy pillars toward a grey dot of daylight.
        - id: ch01-b97
          speaker: lucy
          text: >-
            What did the oracle say?
        - id: ch01-b98
          speaker: mr_noah
          text: >-
            You must have heard it.
        - id: ch01-b99
          speaker: lucy
          text: >-
            I heard the voice and understood what it meant, but I could not make out any words. It sounded like dreams and every beautiful thing I have ever imagined.
        - id: ch01-b100
          speaker: mr_noah
          text: >-
            I thought it was wonderfully direct and businesslike. The words were perfectly clear, and I remember every one.
        - id: ch01-b101
          speaker: narrator
          text: >-
            That shows how differently the same thing can seem to two people. They stepped under the bare sky. Lucy trotted beside Mr. Noah, still holding Philip's bundle. She had not let it go once during all those days.
        - id: ch01-b102
          speaker: lucy
          text: >-
            Then please tell me what it said.
        - id: ch01-b103
          speaker: mr_noah
          text: >-
            You had better embark once again in the ark. Then sail away from dry land and make straight for the island.
        - id: ch01-b104
          speaker: narrator
          text: >-
            For an oracle, those instructions were remarkably straightforward.
        - id: ch01-b105
          speaker: lucy
          text: >-
            Did it truly say that?
        - id: ch01-b106
          speaker: mr_noah
          text: >-
            Certainly. That instruction was meant especially for me. You probably heard something quite different. An oracle does not tell everyone the same thing. Did it give you no instruction of your own?
        - id: ch01-b107
          speaker: lucy
          text: >-
            Only that I should try to be brave and good.
        - id: ch01-b108
          speaker: mr_noah
          text: >-
            Then you follow your instruction, and I shall follow mine.
        - id: ch01-b109
          speaker: lucy
          text: >-
            But what good will it do to reach the island if we cannot go ashore? Only two people are allowed to land there, and we are not those two, are we?
        - id: ch01-b110
          speaker: mr_noah
          text: >-
            If you start asking what good it will do, we shall never get anywhere. More than half the things you say are questions.
        - id: ch01-b111
          speaker: narrator
          text: >-
            I am sorry this chapter keeps breaking into pieces. The trouble is that several things are happening at once. It is always easier for a storyteller when a party stays together, but I have allowed this one to separate. Philip, Polly, and everyone aboard the ark are having three adventures at the same time. That is why we need all these breaks. I hope you will forgive them.
        - id: ch01-b112
          speaker: narrator
          text: >-
            Now we return to Philip, still upside down in the Pretenderette's grasp. She had whispered the magic word into the Hippogriff's ear, but she had given it no order. The creature could choose its own destination. It circled three times between sea and sky, tossed its white mane, and flew straight toward the Island-where-you-mayn't-go.
        - id: ch01-b113
          speaker: narrator
          text: >-
            The Pretenderette did not know that this was the Island-where-you-mayn't-go. As they drew closer, she began to see it clearly. There were beaches made of rainbow-colored sand, graceful palms, falling water, cool green thickets, flowers in many colors, and fruit that seemed to glow. She decided she could do much worse than land in such a place and rest for a while. Even the most disagreeable people become tired sometimes, and the Pretenderette had endured a hard day. She did nothing to check the Hippogriff or turn it from the course it had chosen.
        - id: ch01-b114
          speaker: narrator
          text: >-
            The Hippogriff hovered just above the grass in a beautiful glade. The Pretenderette jerked Philip roughly from her knee and dropped him in a heap. Philip sprang up and raced into the bushes. No rabbit could have moved more quickly.
        - id: ch01-b115
          speaker: nurse
          text: >-
            I will teach you to run away from me!
          emotion: angry
        - id: ch01-b116
          speaker: narrator
          text: >-
            Furious, she prepared to climb down. First she looked for a soft place where she could jump. Then she saw that every blade of grass below her had become a tiny spear made of steel, and every sharp point aimed directly at her. She made the Hippogriff carry her to another glade, but that grass had turned into little steel spears as well. Next she tried the rainbow-colored beach. When she looked closely, all that beautiful sand was trembling quicksand. Wherever green grass had grown, spears now grew. Wherever sand had lain, a terrible sinking trap waited. She tried to dismount in a little pool instead, but fortunately for her, she noticed the truth in time. The silvery substance shining below was not water. It was white-hot molten metal.
        - id: ch01-b117
          speaker: nurse
          text: >-
            What a horrible island. I could hardly have chosen a worse place to leave that naughty child. By the time I send someone to drag him back to prison, he will have learned who is master. You there, take me back to Polistopolis as quickly as possible. Do you understand? Please.
          emotion: disgusted
        - id: ch01-b118
          speaker: narrator
          text: >-
            Then she spoke the magic word. Philip watched from a nearby bush. He heard the word, though I dare not tell it to you, and for the first time he saw the Pretenderette's face clearly. He shook all over. She was the one truly unpleasant person he had ever met. She was Lucy's nurse, with the grey dress and the great heavy feet. She had been cruel to him, and she had knocked down his city.
        - id: ch01-b119
          speaker: philip
          text: >-
            How in the world did she get here? And how am I ever going to escape her?
          emotion: fearful
        - id: ch01-b120
          speaker: narrator
          text: >-
            Philip had seen none of the steel spears, the quivering quicksand, or the white-hot molten metal. Hidden among the leaves, he waited miserably for the Pretenderette to climb down. He expected a game of hide-and-seek to begin at any moment, and it was a game he was not at all eager to play. Yet even while he wondered how he might escape, the Hippogriff spread its great wings. It rose from the glade and flew away with the Pretenderette. Philip was left completely alone on the island.
        - id: ch01-b121
          speaker: narrator
          text: >-
            Being alone was much better than being with the Pretenderette. The island showed Philip no spears, traps, or white-hot metal. Around him lay only grass wet with dew, sweet flowers, green trees, safety, and delight.
        - id: ch01-b122
          speaker: philip
          text: >-
            If only Lucy could be here.
          emotion: sad
        - id: ch01-b123
          speaker: narrator
          text: >-
            When he was quite certain the Pretenderette had truly gone, Philip crept out of the bushes and began to explore. The island held every kind of flower and fruit he could imagine, and they were all growing together. Golden oranges hung among white orange blossoms. Pink apple flowers shared their branches with ripe red apples. Cherries grew beside cherry blossoms, while strawberry flowers and sweet red strawberries covered the same ground. Everywhere he looked, fruit and flowers grew at once, wild and sweet.
        - id: ch01-b124
          speaker: narrator
          text: >-
            At the back of Philip's mind stirred a memory. At some earlier time, he had heard about an island where fruit and blossoms grew together in the same season. He could remember nothing more about it. He continued through the lovely orchards and came upon a lake, frozen hard and ready for skates. That brought another piece of the memory back. The island he had once heard about possessed a skating lake even while flowers bloomed and ripe fruit hung on the trees. Then he found a small summerhouse built entirely from porcupine quills. It looked just like Helen's pen box.
        - id: ch01-b125
          speaker: narrator
          text: >-
            Suddenly he understood. Every wonder around him belonged to the island that he and Helen had invented long ago, the island she used to draw on their maps.
        - id: ch01-b126
          speaker: philip
          text: >-
            This is our own island! We said no one else could come here. That is why the Pretenderette could not land, and why everyone calls it the Island-where-you-mayn't-go. I will find the bun tree and eat something. Then I will go to the boathouse, take the Lightning Loose, and sail back for Lucy. I wish I could bring her here, but I cannot do that unless Helen says yes.
          emotion: happy
        - id: ch01-b127
          speaker: narrator
          text: >-
            The Lightning Loose was the magic yacht Helen had invented for their island. Philip soon discovered a bush that grew buns, with a jam-tart tree close beside it. You cannot know how delicious jam tarts can be until you pick them fresh and sticky from a tree. They are as sticky as horse-chestnut buds and far better to eat.
        - id: ch01-b128
          speaker: narrator
          text: >-
            As Philip walked toward the boathouse, he became happier and happier. One after another, familiar places appeared. He and Helen had planned every one of them and marked each spot on the maps they used to draw. He passed a splendid house made of marble and gold. The words King's Palace were painted on its door. Philip wanted very much to stop and explore every room, but each time he thought of Lucy, he hurried onward instead.
        - id: ch01-b129
          speaker: narrator
          text: >-
            A narrow path led through the leafy wood. Beside it stood the dear little thatched cottage marked Queen's Palace. Helen had always insisted that this was the home she wanted for herself.
        - id: ch01-b130
          speaker: philip
          text: >-
            It is so pretty. I wish Helen were here. She helped create all this. I could never have imagined it without her. She ought to be here.
          emotion: sad
        - id: ch01-b131
          speaker: narrator
          text: >-
            All at once, Philip felt terribly lonely and sad. Still following the woodland path, he wondered whether this whole magical world might contain some magic powerful enough to bring Helen there. She could finally see the island that belonged to both of them, the place they had invented together. And once she had seen it, she could give her permission for Philip to bring Lucy there as well. He kept thinking about Helen and wishing for that impossible magic as he went around the bend.
        - id: ch01-b132
          speaker: narrator
          text: >-
            Then Philip turned the next corner in the narrow woodland path and walked straight into Helen's open and waiting arms.
