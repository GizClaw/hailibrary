  chapters:
    - id: ch01
      title: CHAPTER IX. ON THE 'LIGHTNING LOOSE'
      blocks:
        - id: ch01-b01
          speaker: philip
          text: >-
            But how did you get here?
        - id: ch01-b02
          speaker: narrator
          text: >-
            Philip was in Helen's arms on their island.
        - id: ch01-b03
          speaker: helen
          text: >-
            I walked out through the other side of a dream. The door was open, and you wanted me so much. How could I stay away?
        - id: ch01-b04
          speaker: philip
          text: >-
            Oh, Helen!
        - id: ch01-b05
          speaker: narrator
          text: >-
            Those were the only words he could find. Helen understood them. She always understood Philip.
        - id: ch01-b06
          speaker: helen
          text: >-
            Come along. Shall we go to your palace or mine? I want some supper, with our little blue-and-white tea set. I know you've eaten already, but making mine will be fun. You may even be hungry again by the time it's ready.
        - id: ch01-b07
          speaker: narrator
          text: >-
            They chose Helen's palace, the thatched cottage. Philip had seen enough of great buildings for a while. The cottage had a broad chimney and an open hearth, so they sat by the fire and made toast. Blue wood smoke curled among the enchanted treetops. Yet Philip was so happy with Helen that he nearly forgot the magic island and every adventure that had brought him there.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Before bedtime, he told her the whole story.
        - id: ch01-b09
          speaker: philip
          text: >-
            I'm so glad you came. It's easy to tell you everything here, with magic all around us. I don't think I could ever have done it at the Grange, with servants everywhere, and Mr. Graham, and everything being as unmagical as it possibly could be. But where is Mr. Graham? Won't he hate it when he finds you've left him?
        - id: ch01-b10
          speaker: helen
          text: >-
            He went through a dream door too, so he could see Lucy. He doesn't know he truly went. He'll think he dreamed it, and when we both wake up, he'll tell me all about it.
        - id: ch01-b11
          speaker: philip
          text: >-
            When did you fall asleep?
        - id: ch01-b12
          speaker: helen
          text: >-
            At Brussels. That telegram hasn't arrived yet.
        - id: ch01-b13
          speaker: philip
          text: >-
            I don't understand time, and I never will. I was looking for the Lightning Loose. I meant to sail away in her, explore the sea, and find Lucy.
        - id: ch01-b14
          speaker: helen
          text: >-
            I don't think you'll need to. Just before I found you, I met a parrot on the island. It was reciting poetry to itself.
        - id: ch01-b15
          speaker: philip
          text: >-
            Of course it was, if it was alive. Still, I'm glad it is alive. What did it say?
        - id: ch01-b16
          speaker: narrator
          text: >-
            Helen put another log on the fire and repeated the parrot's poem.
        - id: ch01-b17
          speaker: helen
          text: >-
            Philip and Helen have the island to dwell in. Hooray! They said of the island, “It's your land and my land!” Hooray, hooray, hooray! Until the ark comes out of the dark, those two may stay for a happy while and enjoy their island until the Giving Day. Hooray! Then they'll hear the giving voice. They'll hear and obey. When people come who need a home, they'll give the island away. Hooray! The island has flowers and fruit and bowers, a forest, a river, and a bay. Though it's their very own island, they'll sigh and smile, and they'll give their island away.
        - id: ch01-b18
          speaker: philip
          text: >-
            What nonsense! I won't ever give it away.
        - id: ch01-b19
          speaker: helen
          text: >-
            All right, my Pipkin. I only told you because it shows you're meant to stay here. Philip and Helen have the island to dwell in. Now, what do you say to bed?
        - id: ch01-b20
          speaker: narrator
          text: >-
            They stayed on the island for a whole week. It was everything they could want an island to be. Of course it was, because they had made it themselves and knew exactly what they liked. No one could describe all they did during that week, and no one needed to. Think of everything you would do on a magic island with the person dearest to you, and you will understand how Philip spent his time.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Philip enjoyed every minute of every hour of every day. Best of all, the week taught him something nothing else could have made him understand. Helen still belonged to him. Her marriage to Mr. Graham had not taken her away or made her any less Philip's very own Helen.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Then one day Philip was swinging in a magnolia tree when he saw something out at sea.
        - id: ch01-b23
          speaker: philip
          text: >-
            A sail! Helen, it's the ark! Now our week is over. Let's invite Lucy to stay and send everyone else away.
        - id: ch01-b24
          speaker: narrator
          text: >-
            He slid down the trunk, and his face had grown very serious.
        - id: ch01-b25
          speaker: helen
          text: >-
            We can't do that, dear. The island belongs to us, and while it does, no one else is allowed to land. We made that rule ourselves.
        - id: ch01-b26
          speaker: philip
          text: >-
            So they can't come ashore?
        - id: ch01-b27
          speaker: helen
          text: >-
            No.
        - id: ch01-b28
          speaker: philip
          text: >-
            Couldn't we change the rule and let them come?
        - id: ch01-b29
          speaker: helen
          text: >-
            No.
        - id: ch01-b30
          speaker: philip
          text: >-
            What a pity. The island is just the right home for islanders, isn't it?
        - id: ch01-b31
          speaker: helen
          text: >-
            Yes. And no one needs to fear the sea here. Remember? We made the island that way.
        - id: ch01-b32
          speaker: philip
          text: >-
            I remember. Oh, Helen, I don't want to do it.
        - id: ch01-b33
          speaker: helen
          text: >-
            Then don't.
        - id: ch01-b34
          speaker: philip
          text: >-
            But I want to as well.
        - id: ch01-b35
          speaker: helen
          text: >-
            Then do it.
        - id: ch01-b36
          speaker: philip
          text: >-
            But when you want to do something and don't want to do it at the same time, how can you choose? There are too many things to think about.
        - id: ch01-b37
          speaker: helen
          text: >-
            When that happens, there's one thing you must leave out of your thoughts.
        - id: ch01-b38
          speaker: philip
          text: >-
            What's that?
        - id: ch01-b39
          speaker: helen
          text: >-
            Yourself.
        - id: ch01-b40
          speaker: narrator
          text: >-
            For a moment, neither of them spoke. Then Philip suddenly threw his arms around Helen, and she hugged him back.
        - id: ch01-b41
          speaker: philip
          text: >-
            I'll give the island to them. There's no use fighting it. I know I ought to, and if I don't, I'll only feel miserable.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Helen laughed.
        - id: ch01-b43
          speaker: helen
          text: >-
            My boy of boys!
        - id: ch01-b44
          speaker: narrator
          text: >-
            Then sadness came over her face.
        - id: ch01-b45
          speaker: helen
          text: >-
            Boy of my heart, giving away the island isn't all. Once we give it away, I must leave. This is the only place with a door leading out of my dreams.
          emotion: sad
        - id: ch01-b46
          speaker: philip
          text: >-
            I can't let you go.
          emotion: sad
        - id: ch01-b47
          speaker: helen
          text: >-
            You still have deeds to do, and I can't help with those. Lucy can. You do like Lucy now, don't you?
        - id: ch01-b48
          speaker: philip
          text: >-
            I don't mind Lucy. But you're the one I want, Helen.
        - id: ch01-b49
          speaker: helen
          text: >-
            Don't think of that. Think of the islanders. Think what this place will mean to them. They can live here forever and never fear the sea again.
        - id: ch01-b50
          speaker: philip
          text: >-
            I still have three deeds left. When they're over, I don't think I'll ever want another adventure.
          emotion: sad
        - id: ch01-b51
          speaker: helen
          text: >-
            You'll always want adventures. Always. Now let's give the island handsomely and welcome everyone properly. Kiss me, and then we'll gather armfuls of roses.
        - id: ch01-b52
          speaker: narrator
          text: >-
            They kissed. Philip was deeply unhappy, though it comforted him to feel that he was doing something noble and that Helen knew it too.
        - id: ch01-b53
          speaker: narrator
          text: >-
            They talked much longer than this. In fact, they talked so long that there was hardly time to finish the welcome. They hung garlands of pink roses along the quay where the perfect yacht Lightning Loose lay at anchor. Before they could place the last flowers, the ark was already upon them. Its blunt prow struck the quay with a heavy bump. Philip and Helen dropped the roses they still held, then smiled and waved to the figures gathered on the ark's terrace.
        - id: ch01-b54
          speaker: mr_perrin
          text: >-
            Here we are again!
        - id: ch01-b55
          speaker: narrator
          text: >-
            Mr. Perrin shouted it like a clown.
        - id: ch01-b56
          speaker: lucy
          text: >-
            We know we're not allowed to land, but the oracle told us to come, so here we are.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Lucy leaned over the side and lowered her voice.
        - id: ch01-b58
          speaker: lucy
          text: >-
            Who's that absolute darling with you?
        - id: ch01-b59
          speaker: philip
          text: >-
            This is my sister, Helen. Helen, this is Lucy.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Helen and Lucy looked at one another. Then Helen held out both hands, and they kissed.
        - id: ch01-b61
          speaker: lucy
          text: >-
            I knew I'd like you. I just didn't know I'd like you this much.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Mr. Noah and Mr. Perrin bowed to Helen. Their bows were a little stiff but warmly meant, and, strangely enough, neither man seemed surprised. The Lord High Islander watched her with his friendly schoolboy grin.
        - id: ch01-b63
          speaker: mr_noah
          text: >-
            If you will both come aboard, we can return to the mainland. On the way, I shall explain the deeds that remain for you.
        - id: ch01-b64
          speaker: helen
          text: >-
            Tell them, Pip.
        - id: ch01-b65
          speaker: philip
          text: >-
            We don't want to come aboard. Not yet. We want all of you to land.
        - id: ch01-b66
          speaker: mr_noah
          text: >-
            Only two people may set foot on this island. I am glad you are those two. I was afraid the Pretenderette might be one of them.
        - id: ch01-b67
          speaker: philip
          text: >-
            Not likely! The island belongs to Helen and me. We made it, and we want the islanders to have it for their very own.
        - id: ch01-b68
          speaker: narrator
          text: >-
            Philip knew such a glorious gift might be hard for anyone to believe. Yet there he was, giving it away just like that, without a fine speech or a grand ceremony. He might have been offering a small present, such as a pencil sharpener or a peg top, instead of a whole enchanted island.
        - id: ch01-b69
          speaker: lord_high_islander
          text: >-
            Ours to keep? Our very own, forever?
        - id: ch01-b70
          speaker: philip
          text: >-
            Yes. There's no fear here, either. Now you'll truly be happy troops.
        - id: ch01-b71
          speaker: narrator
          text: >-
            No one spoke for a moment, though every face showed what its owner felt. At last, the Lord High Islander tried to answer.
        - id: ch01-b72
          speaker: lord_high_islander
          text: >-
            Well! Of all the brickish bricks, you are the most—
        - id: ch01-b73
          speaker: narrator
          text: >-
            That was as far as he could get.
        - id: ch01-b74
          speaker: philip
          text: >-
            There are plenty of houses, and space for every animal. The island is thirty miles around, so there's room for everything and everyone.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Philip felt happier than he ever had in his life. Giving presents was always enjoyable, but this was no ordinary present. It was enormous and beautiful, and it was a place he dearly loved. Giving it made his happiness greater still.
        - id: ch01-b76
          speaker: mr_perrin
          text: >-
            I've always said Master Pip was a gentleman, and I'll go on saying it.
        - id: ch01-b77
          speaker: mr_noah
          text: >-
            I congratulate you. I am also happy to announce that you have now completed your fifth deed. You remember the empty silver fruit dishes, I trust. Your fifth deed was to supply Polistarchia with fruit. This island is the only part of the entire kingdom where fruit will grow. The ark can carry the harvest safely from here to the mainland. The performance of this deed raises you to the rank of Duke.
        - id: ch01-b78
          speaker: lucy
          text: >-
            Philip, you are a dear.
        - id: ch01-b79
          speaker: philip
          text: >-
            Shut up!
          emotion: angry
        - id: ch01-b80
          speaker: parrot
          text: >-
            Three cheers for the Duke of Donors!
        - id: ch01-b81
          speaker: lord_high_islander
          text: >-
            Three cheers for the Duke of Donors!
        - id: ch01-b82
          speakers: [lord_high_islander, lucy, mr_perrin, mr_noah]
          ensemble: chorus
          text: >-
            Hooray! Hooray! Hooray!
          emotion: happy
        - id: ch01-b83
          speaker: narrator
          text: >-
            What a cheer it was! Every islander joined in, along with the M.A.'s, Lucy, Mr. Perrin, and Mr. Noah. From deep inside the ark came a great answer of eager barking, grunting, roaring, and squeaking. Every animal was cheering in the best way it could. Thousands of gulls circled overhead on white wings in the sunshine, adding their sharp cries to the chorus. When the final sound died away, a small, familiar voice spoke nearby.
        - id: ch01-b84
          speaker: parrot
          text: >-
            Well done, Philip! I'm proud of you.
        - id: ch01-b85
          speaker: narrator
          text: >-
            The parrot had begun the cheering from its perch in the rigging of the Lightning Loose. Now it fluttered down to Philip's shoulder.
        - id: ch01-b86
          speaker: parrot
          text: >-
            So that has worked out nicely. I heard you calling me all week, but I needed a rest. I've been talking far too much. What with the Pretenderette, and that cage, and all my adventures, I needed time to recover.
        - id: ch01-b87
          speaker: mr_noah
          text: >-
            We have all had adventures.
        - id: ch01-b88
          speaker: helen
          text: >-
            Won't you come ashore and take possession of your island? I'm sure we all want to hear one another's adventures.
        - id: ch01-b89
          speaker: mr_noah
          text: >-
            You first.
        - id: ch01-b90
          speaker: narrator
          text: >-
            The Lord High Islander stepped ashore with great solemnity. As he came forward, Helen suddenly kissed Philip. The instant the islander's foot touched the enchanted ground, Helen vanished.
        - id: ch01-b91
          speaker: philip
          text: >-
            Oh! I wish I hadn't done it.
          emotion: sad
        - id: ch01-b92
          speaker: narrator
          text: >-
            His mouth trembled the way a girl's does when she is about to cry.
        - id: ch01-b93
          speaker: mr_noah
          text: >-
            The more a gift costs you, the more it is worth. This one has cost you so much that it is the most splendid gift in the world.
        - id: ch01-b94
          speaker: philip
          text: >-
            I know. Please, make yourselves at home.
          emotion: sad
        - id: ch01-b95
          speaker: narrator
          text: >-
            That was all Philip could manage before words failed him. He turned away from everyone and walked deep into the forest. When he reached a green clearing and was finally alone, he threw himself facedown upon the ground. He lay there for a long time without moving. That week with Helen had been so happy, and now it was over. He was so very tired of adventures.
        - id: ch01-b96
          speaker: narrator
          text: >-
            At last, he gave one final sniff and lifted his head. Lucy was sitting nearby with her back toward him, perfectly still.
        - id: ch01-b97
          speaker: philip
          text: >-
            Hullo! What are you doing here?
        - id: ch01-b98
          speaker: narrator
          text: >-
            He sounded rather cross.
        - id: ch01-b99
          speaker: lucy
          text: >-
            Saying the multiplication table, so I won't even think about you. I haven't turned around once. I knew you wanted to be alone, but I wanted to be here when you were finished being alone. You see, there's something I need to tell you.
        - id: ch01-b100
          speaker: philip
          text: >-
            Go on, then.
        - id: ch01-b101
          speaker: lucy
          text: >-
            I think you're perfectly splendid. I want us to have real peace between us forever. I'll help with all the adventures that are left, and when you're cross, I'll try not to mind. Napoleon was cross sometimes, I think. Julius Caesar too.
        - id: ch01-b102
          speaker: philip
          text: >-
            Oh, that's all right.
        - id: ch01-b103
          speaker: narrator
          text: >-
            He said it very awkwardly.
        - id: ch01-b104
          speaker: lucy
          text: >-
            Then we'll be true chums?
        - id: ch01-b105
          speaker: philip
          text: >-
            Yes, if you like. And I don't mind this once. It was decent of you to sit with your back to me. But I hate gush.
        - id: ch01-b106
          speaker: lucy
          text: >-
            I know. But sometimes, if you admire someone enough, you have to gush a little or you'll burst. And look, I brought your proper clothes in a bundle. I've carried them ever since the islanders' castle washed away. Here they are.
        - id: ch01-b107
          speaker: narrator
          text: >-
            Lucy held out the bundle, and this time Philip was truly touched.
        - id: ch01-b108
          speaker: philip
          text: >-
            Now that really is something! A seaweed suit is all right on this island, but you never know what an adventure may bring. There could be thorns, or snakes, or anything. I'm jolly glad to have my boots again. Come on. We'll go to Helen's palace and prepare a banquet. There'll have to be one. There always is here. I know a first-rate bun tree nearby.
        - id: ch01-b109
          speaker: lucy
          text: >-
            I saw the coconut-ice plants on my way. They looked beautiful. What a lovely island this is, and you made it!
        - id: ch01-b110
          speaker: philip
          text: >-
            No gush. Helen and I made it.
        - id: ch01-b111
          speaker: lucy
          text: >-
            Helen is the dearest darling.
        - id: ch01-b112
          speaker: philip
          text: >-
            Oh, well. If you must gush, you may gush about her.
        - id: ch01-b113
          speaker: narrator
          text: >-
            The banquet was as grand and fascinating as anyone could imagine, and Philip was, of course, the hero of the hour. When it ended, the guests went away one by one to their own houses. Every house on the island was ready for its new owner. Each one was furnished with every possible comfort, right down to a pincushion full of pins in every room.
        - id: ch01-b114
          speaker: narrator
          text: >-
            Mr. Noah, Lucy, and Philip stayed behind. They sat on the terrace steps among the pink roses for one final talk.
        - id: ch01-b115
          speaker: philip
          text: >-
            We mean to leave first thing tomorrow morning. Please tell me now what my next deed will be.
        - id: ch01-b116
          speaker: mr_noah
          text: >-
            Will you travel in the ark? I should be delighted to take you.
        - id: ch01-b117
          speaker: narrator
          text: >-
            He rolled up his yellow mat for an elbow rest and leaned upon it.
        - id: ch01-b118
          speaker: philip
          text: >-
            I thought we might take the Lightning Loose. I've never sailed her. Do you think I can manage it?
        - id: ch01-b119
          speaker: mr_noah
          text: >-
            Of course. If you need help, Lucy can show you. Your charming yacht is steered in exactly the same way as the ark, and every wind in this country blows in your favor. You will find provisions aboard. Most of the journey to your next deed can be made by water, first across the sea and then along a river.
        - id: ch01-b120
          speaker: philip
          text: >-
            And what is the deed?
        - id: ch01-b121
          speaker: mr_noah
          text: >-
            In the farthest north of Polistarchia stands a town called Somnolentia. In happier times, its name was Briskford. Back then, a swift river ran straight through the town. It carried so much gold down from the mountains that the people had to work hard at clearing away the lumps. Otherwise, the gold would have blocked the channel. The river watered their fields, the land produced good crops, and the townspeople were cheerful and happy.
        - id: ch01-b122
          speaker: mr_noah
          text: >-
            But when the Hippogriff escaped from the book, a Great Sloth escaped as well. Every attempt to capture him failed, and he made his way north. He is an enormous and remarkable creature. Perhaps the townspeople feared him, or perhaps they admired him. By one means or the other, he gained complete power over everyone in Briskford. He persuaded them to build a temple for him out of solid gold. While all their labor went into the temple, the riverbed choked up. At last, the water turned aside and found a new channel far from the town.
        - id: ch01-b123
          speaker: mr_noah
          text: >-
            Since then, the town has crumbled. The fields are dry and lie uncultivated. The people must draw every drop of drinking water from a well, which takes great effort. As for washing, it has become shockingly rare.
        - id: ch01-b124
          speaker: philip
          text: >-
            Is our deed to teach those dirty fellows to wash?
          emotion: disgusted
        - id: ch01-b125
          speaker: mr_noah
          text: >-
            Do not interrupt. You make me lose the thread of my account. Where was I?
        - id: ch01-b126
          speaker: lucy
          text: >-
            You said they hardly ever wash. But if all the fields are dry, what do they eat?
        - id: ch01-b127
          speaker: mr_noah
          text: >-
            Pineapples. They grow easily and need little water. Gathering them is the only work these fallen people still do. Pineapples count as vegetables, not fruit.
        - id: ch01-b128
          speaker: narrator
          text: >-
            Mr. Noah added that last point quickly, for he saw another question waiting on Philip's lips.
        - id: ch01-b129
          speaker: mr_noah
          text: >-
            Any waking time left after gathering and eating pineapples is spent singing choral songs in honor of the Great Sloth. Even that time is short. His influence over the people of Somnolentia is so complete that when he falls asleep, every one of them falls asleep too. And I must impress this upon you. The Great Sloth sleeps almost all the time.
        - id: ch01-b130
          speaker: mr_noah
          text: >-
            Your deed is to devise some way of keeping the Great Sloth awake and busy. I think you have your work cut out for you. Once you have disposed of the problem of the Great Sloth, return to this island and report to me. I shall remain here for some little time, because I need a holiday. The parrot will accompany you. It knows its way about as well as any bird in the land. Good night, and good luck. Please excuse me from coming down to breakfast tomorrow.
        - id: ch01-b131
          speaker: narrator
          text: >-
            Early the next morning, while the dew still lay fresh, Philip, Lucy, and the parrot boarded the yacht and cast off. Lucy taught Philip to steer while the parrot sat on the mast and called down instructions.
        - id: ch01-b132
          speaker: narrator
          text: >-
            They headed for the mouth of a river.
        - id: ch01-b133
          speaker: philip
          text: >-
            I never built a river.
        - id: ch01-b134
          speaker: parrot
          text: >-
            No. This one came out of the poetry book.
        - id: ch01-b135
          speaker: narrator
          text: >-
            When hunger came, they dropped anchor and went below for breakfast. Two creatures sprang at them and nearly knocked Lucy over in their eagerness. They were Max and Brenda.
        - id: ch01-b136
          speaker: lucy
          text: >-
            Oh, you dear dogs!
        - id: ch01-b137
          speaker: narrator
          text: >-
            Philip patted them both, one with each hand.
        - id: ch01-b138
          speaker: philip
          text: >-
            How did you two get aboard?
        - id: ch01-b139
          speaker: parrot
          text: >-
            Mr. Noah arranged a little surprise for you.
        - id: ch01-b140
          speaker: narrator
          text: >-
            Max and Brenda whined, barked, and poured out their welcome.
        - id: ch01-b141
          speaker: lucy
          text: >-
            If only we knew what they were saying.
        - id: ch01-b142
          speaker: parrot
          text: >-
            If you knew the magic word the Hippogriff obeys, you could speak it and understand every animal. Naturally, I am not allowed to tell you. It is one of the eleven mysteries.
        - id: ch01-b143
          speaker: philip
          text: >-
            But I already know the word.
        - id: ch01-b144
          speaker: narrator
          text: >-
            He breathed it first into Brenda's tiny silky ear, then into Max's longer, silkier one. At once, the children could understand the dogs.
        - id: ch01-b145
          speaker: brenda
          text: >-
            Oh, my dears, my dearie dears! We are so happy to see you! I'm only a poor little faithful dog. I'm not clever, you know, but my loving nature makes me almost wild with joy at seeing my dear master and mistress again.
          emotion: happy
        - id: ch01-b146
          speaker: max
          text: >-
            Very glad to see you, sir. I hope you will be comfortable aboard. A dog can have no greater comfort than being beside his master.
        - id: ch01-b147
          speaker: narrator
          text: >-
            Max sat down and promptly went to sleep. The others began breakfast. Cooking aboard a yacht was great fun. Brenda sat up with delicate politeness to beg.
        - id: ch01-b148
          speaker: brenda
          text: >-
            I do hate troubling my darling master and mistress. But if you could spare one more tiny piece of bacon—oh, thank you! How very good and generous you are!
          emotion: happy
        - id: ch01-b149
          speaker: narrator
          text: >-
            They sailed safely into the river, and soon it entered the shade of a tropical forest. The forest had come out of a book too.
        - id: ch01-b150
          speaker: parrot
          text: >-
            We could keep moving tonight if the dogs steered while I directed them. Tie one end of a rope to their collars and the other to the helm. It will be easier than turning roasting spits.
        - id: ch01-b151
          speaker: max
          text: >-
            Delighted. It is understood, of course, that we sleep all day?
        - id: ch01-b152
          speakers: [philip, lucy, parrot, brenda]
          ensemble: chorus
          text: >-
            Of course!
        - id: ch01-b153
          speaker: narrator
          text: >-
            That settled the matter, and the children went to bed.
        - id: ch01-b154
          speaker: narrator
          text: >-
            In the middle of the night, Philip woke to the parrot's usual gentle touch of its beak.
        - id: ch01-b155
          speaker: parrot
          text: >-
            Wake up! This is the wrong river. We're going the wrong way. Nothing is right, and the ship is all wrong. I'm very much afraid someone opened a book and let this river escape.
          emotion: fearful
        - id: ch01-b156
          speaker: narrator
          text: >-
            Philip rushed onto the deck and peered out by the light of the lamps shining from the cabin. He searched for the banks of the river, but there were no banks to be seen. Steep, broken cliffs rose close on both sides of the yacht. Overhead, the starry night sky had disappeared as well. In its place was the great curving roof of a cavern, glistening with damp and black as a raven's feathers.
        - id: ch01-b157
          speaker: philip
          text: >-
            We must go back. I don't like this at all.
        - id: ch01-b158
          speaker: parrot
          text: >-
            Unfortunately, there is no space to turn around. The Lightning Loose was not built to travel backward.
        - id: ch01-b159
          speaker: brenda
          text: >-
            Oh, dear! I wish we had stayed behind. Dear little dogs should be kept safe and comfortable, not sent onto horrible ships that cannot turn back from danger.
          emotion: fearful
        - id: ch01-b160
          speaker: max
          text: >-
            My dear, the dear little dogs cannot help themselves now. They had better watch for a chance to help their masters.
        - id: ch01-b161
          speaker: philip
          text: >-
            Then what can we do?
        - id: ch01-b162
          speaker: parrot
          text: >-
            I am afraid we can only continue straight ahead. If this river came from a book, it must lead somewhere. No river in any book runs underground forever.
        - id: ch01-b163
          speaker: philip
          text: >-
            I won't wake Lucy. She might be frightened.
        - id: ch01-b164
          speaker: lucy
          text: >-
            You don't need to wake her. She's already awake, and she isn't any more frightened than you are.
        - id: ch01-b165
          speaker: max
          text: >-
            Did you hear that, Brenda? Follow her example, my dear.
        - id: ch01-b166
          speaker: lucy
          text: >-
            But if we're going the wrong way, we won't reach the Great Sloth.
        - id: ch01-b167
          speaker: parrot
          text: >-
            Sooner or later, by one route or another, we will reach him. Time means nothing to a Great Sloth.
        - id: ch01-b168
          speaker: narrator
          text: >-
            The air had turned bitterly cold, and the travelers were glad to wrap themselves in the flags of every nation. The yacht had been handsomely provided with plenty of them. Philip arranged the Union Jack and the old Royal Arms of England into a sort of tunic, complicated with crosses, lilies, lions, and leopards. Lucy chose the Japanese flag for a shawl. She said that seeing the sun pictured upon it made her feel warmer.
        - id: ch01-b169
          speaker: narrator
          text: >-
            Philip still shivered beneath his tangle of crosses and lions. The Lightning Loose swept onward over the black water, between black walls, beneath the black cavern roof.
        - id: ch01-b170
          speaker: parrot
          text: >-
            Cheer up! Think of all these adventures that no one else has ever had. When you go to school, imagine how much you will have to tell the other boys.
        - id: ch01-b171
          speaker: philip
          text: >-
            They wouldn't believe one word. I wouldn't believe it myself if I didn't know it was true.
          emotion: sad
        - id: ch01-b172
          speaker: lucy
          text: >-
            I don't think we'll want to tell anyone. It will be enough that we know. We can talk about it together, just you and me.
        - id: ch01-b173
          speaker: narrator
          text: >-
            Lucy watched the cabin lamps cast yellow light racing along the roof.
        - id: ch01-b174
          speaker: parrot
          text: >-
            Well, as for that—do my claws deceive me, or can you feel a curious trembling and a noticeable increase in our speed?
        - id: ch01-b175
          speaker: philip
          text: >-
            Eh?
        - id: ch01-b176
          speaker: narrator
          text: >-
            Philip knew that was not good manners.
        - id: ch01-b177
          speaker: max
          text: >-
            He means, aren't we moving rather fast and wobbling rather badly?
        - id: ch01-b178
          speaker: narrator
          text: >-
            They certainly were. The yacht rushed faster and faster through the underground channel. Again and again, it lurched and shuddered.
        - id: ch01-b179
          speaker: brenda
          text: >-
            Oh! This is a dreadful place for dear little dogs!
          emotion: fearful
        - id: ch01-b180
          speaker: lucy
          text: >-
            Philip, I know something is about to happen. Something terrible. We are friends, aren't we?
          emotion: fearful
        - id: ch01-b181
          speaker: philip
          text: >-
            Yes.
        - id: ch01-b182
          speaker: lucy
          text: >-
            Then I wish you would kiss me.
        - id: ch01-b183
          speaker: philip
          text: >-
            I can like you just as much without doing that. Kissing people is silly, don't you think?
        - id: ch01-b184
          speaker: lucy
          text: >-
            No one has kissed me since Daddy went away, except Helen. You don't mind kissing her. And Helen said you were going to adopt me as your sister.
          emotion: sad
        - id: ch01-b185
          speaker: philip
          text: >-
            Oh, all right.
        - id: ch01-b186
          speaker: narrator
          text: >-
            Philip put an arm around Lucy and kissed her. She felt so small, helpless, and bony that pity came over him. He kissed her once more, this time more kindly. Then he drew back and gave her an encouraging thump between the shoulders.
        - id: ch01-b187
          speaker: philip
          text: >-
            Be a man. I'm certain nothing is going to happen. This is only a tunnel. Soon we'll sail out into the open air, and the sky and stars will still be there, just as usual.
        - id: ch01-b188
          speaker: narrator
          text: >-
            Philip stood beside Lucy at the prow as he spoke. Suddenly, she gripped his arm.
        - id: ch01-b189
          speaker: lucy
          text: >-
            Oh, look! Listen!
          emotion: fearful
        - id: ch01-b190
          speaker: narrator
          text: >-
            Philip listened and heard a low, echoing roar. It grew louder and louder as the yacht raced on. He looked ahead. At first, the lamps shone across the dark, gleaming water. Then, all at once, their light no longer touched the river, because there was no river there to touch. There was only an enormous black emptiness. The whole stream was pouring down into a great hole.
        - id: ch01-b191
          speaker: narrator
          text: >-
            Now the yacht reached the very edge of the gulf. The Lightning Loose gave a shudder and a bound, then seemed to hang there for one long moment. Beneath its prow, the underground river poured over a precipice in a smooth, sleek sheet. It looked like treacle being poured down past the edge of everything firm and solid in the world.
        - id: ch01-b192
          speaker: narrator
          text: >-
            At last, that hanging moment ended. The little yacht tipped over the brink and plunged headlong down the precipice. Philip and Lucy fell with it, along with the parrot and the two dogs. The Lightning Loose carried every one of them straight into the dark, unknown abyss below.
        - id: ch01-b193
          speaker: philip
          text: >-
            It's all right, Lu. I'll take care of you.
        - id: ch01-b194
          speaker: narrator
          text: >-
            Then the cavern fell silent. Only the great waterfall went on roaring beneath the rocky arch.
