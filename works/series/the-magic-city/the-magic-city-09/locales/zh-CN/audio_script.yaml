audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖沉着，带一点机敏的幽默
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中
    philip:
      display_name: 菲利普
      tts:
        delivery: 直率敏感，想象丰富，情绪来得快
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    lucy:
      display_name: 露西
      tts:
        delivery: 开朗友好，坦率好奇
        timbre: 轻盈稚嫩
        pace: 轻快
        pitch: 中高
    judge_noah:
      display_name: 诺亚先生
      tts:
        delivery: 一本正经又怕麻烦，古板中带着滑稽
        timbre: 苍老清晰
        pace: 稍慢
        pitch: 中
    polly:
      display_name: 波利
      tts:
        delivery: 机灵健谈，爱挖苦也很讲义气
        timbre: 清脆略带沙哑
        pace: 稍快
        pitch: 中高
    max:
      display_name: 马克斯
      tts:
        delivery: 忠诚直爽，逞强时仍透出紧张
        timbre: 明亮结实
        pace: 适中
        pitch: 中
    brenda:
      display_name: 布伦达
      tts:
        delivery: 亲热温柔，害怕时格外殷勤
        timbre: 轻柔明快
        pace: 适中
        pitch: 中高
    billy:
      display_name: 比利
      tts:
        delivery: 热情快活，谈到恐惧时倔强又恼火
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高
    perrin:
      display_name: 佩林先生
      tts:
        delivery: 手艺老到，守规矩，训人时直截了当
        timbre: 粗实清晰
        pace: 适中
        pitch: 中低
    helen:
      display_name: 海伦
      tts:
        delivery: 亲切能干，温柔中带着活泼
        timbre: 温暖明亮
        pace: 从容
        pitch: 中
  chapters:
    - id: ch01
      title: 海伦从梦里来
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 菲利普依偎在海伦怀里，急着问她怎么会来到岛上。
        - id: ch01-b02
          speaker: helen
          text: 我从梦的另一头走出来了呀。门开着，你又那么想我，我怎么能不来呢？
        - id: ch01-b03
          speaker: philip
          text: 噢，海伦！
        - id: ch01-b04
          speaker: narrator
          text: 他再也找不到别的话，可海伦全都明白。她一向明白。
        - id: ch01-b05
          speaker: helen
          text: >-
            走吧，去你的宫殿，还是我的？我想吃晚饭了，咱们用自己那套蓝白小茶具。你虽然吃过了，替我张罗一顿也很好玩。等弄好饭，你说不定又饿了。
        - id: ch01-b06
          speaker: narrator
          text: >-
            他们去了海伦那间茅草小屋。菲利普近来见过的大房子已经够多，一时不想再见。小屋有宽大的烟囱，还有敞开的壁炉。他们坐在炉边烤面包，蓝色木烟袅袅升起，飘进魔法岛迷人的树梢。菲利普几乎忘了自己经历过种种冒险，也忘了手里的面包，正是在一座魔法岛的壁炉上烤出来的。上床以前，他已经把所有事情都告诉了海伦。
        - id: ch01-b07
          speaker: philip
          text: >-
            你来了真好！这里到处是魔法，什么话都说得出口。要是在庄园里，仆人们总在身边，还有……我是说格雷厄姆先生，还有那些再不可能跟魔法沾边的东西，我想自己永远也说不出来。可是格雷厄姆先生在哪儿？你离开他，他不会难过吗？
        - id: ch01-b08
          speaker: helen
          text: >-
            他也穿过一道梦里的门，去看露西了。不过他不知道自己真的去过，只会以为做了一场梦。等我们都醒来，他会讲给我听。
        - id: ch01-b09
          speaker: philip
          text: 你什么时候睡着的？
        - id: ch01-b10
          speaker: helen
          text: 在布鲁塞尔。那封电报还没送到呢。
        - id: ch01-b11
          speaker: philip
          text: >-
            时间这回事我不懂，以后也不会懂。我刚才正找“闪电脱缰号”，想驾着它去探险，把露西找回来。
        - id: ch01-b12
          speaker: helen
          text: 我看不用了。遇见你以前，我碰到一只鹦鹉，它正自己念诗呢。
        - id: ch01-b13
          speaker: philip
          text: 它活过来了，自然会念诗。不过它真的活着，我还是很高兴。它念了什么？
        - id: ch01-b14
          speaker: narrator
          text: 海伦往火里添了一根木柴，把那首诗念给他听。
        - id: ch01-b15
          speaker: helen
          text: >-
            菲利普和海伦，小岛安家最称心，万岁！他们把小岛称作，这是你的土地，也是我的土地，万岁，万岁，万岁！直到方舟驶出黑暗，两个人都可以快活地住下，享受他们的小岛，一直等到赠予日到达，万岁！那时赠予之声会响起，他们听见便会服从。需要家园的人来到，他们就把小岛送给大家，万岁！岛上有花朵、果实和凉棚，有森林、河流和海湾。这本是他们自己的小岛，可他们会叹息，也会微笑，最后把自己的小岛送掉。
        - id: ch01-b16
          speaker: philip
          text: 胡说！我才不会送。
        - id: ch01-b17
          speaker: helen
          text: >-
            好吧，我的小菲菲。我只是想告诉你，大家都盼着你留在这里。诗里说，菲利普和海伦要在小岛安家。现在该睡觉了吧？
        - id: ch01-b18
          speaker: narrator
          text: >-
            他们在岛上住了整整一星期。这儿正好拥有他们希望一座岛拥有的一切。当然啦，小岛原本就是两个人创造的，他们自然最清楚自己喜欢什么。那一星期，我实在没法描述，只知道菲利普一辈子都不会忘。你只消想一想，若是跟世上最亲爱的人一起住在魔法岛上，你会做些什么，也就知道菲利普怎样度过那些日子了。
        - id: ch01-b19
          speaker: narrator
          text: >-
            每一天、每一小时、每一分钟，菲利普都过得无比快乐。最好的是，没有别的事能像这一星期这样，让他真正明白海伦依然属于他。她嫁给格雷厄姆先生以后，一点也没有少爱菲利普，仍旧是菲利普自己的海伦。
        - id: ch01-b20
          speaker: narrator
          text: >-
            后来有一天，菲利普正吊在一棵木兰树上荡来荡去。他向大海望去，忽然看见远处出现一张帆。他立刻大叫起来，告诉海伦方舟到了。接着，他沿着树干滑下来，方才还兴奋的脸已经变得十分严肃。
        - id: ch01-b21
          speaker: philip
          text: >-
            方舟来了！这下全完了。让露西留下，把其他人都打发走吧。
        - id: ch01-b22
          speaker: helen
          text: >-
            可我们不能这样，亲爱的。小岛属于我们，只要还是我们的，别人就不能上岸。当初咱们就是这样创造它的。
        - id: ch01-b23
          speaker: philip
          text: 那他们不能登岛？也不能改掉规矩，放他们上来？
        - id: ch01-b24
          speaker: helen
          text: 不能。
        - id: ch01-b25
          speaker: philip
          text: >-
            真可惜。小岛本来就该让岛民住，对不对？这里也不用害怕大海，那是当初咱们特意安排的。海伦，我不愿意把岛送掉。
        - id: ch01-b26
          speaker: helen
          text: 那就别送。
        - id: ch01-b27
          speaker: philip
          text: 可我又愿意。一个人同时愿意又不愿意，到底该怎么办？要想的事太多了。
        - id: ch01-b28
          speaker: helen
          text: 遇到这种时候，有一件事千万不能想。
        - id: ch01-b29
          speaker: philip
          text: 什么？
        - id: ch01-b30
          speaker: helen
          text: 你自己。
          emotion: calm
        - id: ch01-b31
          speaker: narrator
          text: 两人沉默了一会儿。菲利普忽然抱紧姐姐，海伦也抱紧了他。
        - id: ch01-b32
          speaker: philip
          text: >-
            我把岛送给他们。我知道自己应该送，要是不送，我心里反而不会好受。
        - id: ch01-b33
          speaker: helen
          text: >-
            我的好男孩，我最心爱的孩子！可你要知道，我们失去的不只是自己的小岛。只要把它送出去，我也必须离开。因为在我的梦里，只有这一处地方有一扇门，可以让我从梦那头走到你身边。
          emotion: sad
        - id: ch01-b34
          speaker: philip
          text: 我不能让你走。
          emotion: sad
        - id: ch01-b35
          speaker: helen
          text: >-
            你还有伟业要完成，那些事我帮不了你，露西却能帮你。你现在喜欢她了，对不对？
        - id: ch01-b36
          speaker: philip
          text: 我不讨厌她，可我要的是你呀，海伦。
        - id: ch01-b37
          speaker: helen
          text: >-
            别想自己。想想岛民多么需要这座岛。他们可以永远住在这里，再也不用害怕恐惧。
        - id: ch01-b38
          speaker: philip
          text: 还剩三项伟业。我这一辈子再也不想冒险了。
        - id: ch01-b39
          speaker: helen
          text: >-
            你永远都会想冒险的。现在咱们把事情办漂亮，好好欢迎他们。先亲我一下，再一起去采好多玫瑰。
        - id: ch01-b40
          speaker: narrator
          text: >-
            他们亲了彼此。菲利普心里实在难过，却也觉得自己颇有几分高尚，海伦显然也这样看，这自然给了他很大安慰。其实，他们说过的话比我写下来的多得多。完美的游艇“闪电脱缰号”停泊在码头边，两人才刚把粉红玫瑰编成的花环挂好，方舟钝重的船头便砰地撞上码头。他们丢下还没用完的玫瑰，向方舟露台上的众人挥手微笑。
    - id: ch02
      title: 最珍贵的礼物
      blocks:
        - id: ch02-b01
          speaker: perrin
          text: 你们瞧，我们这一大群人又回来啦！
          emotion: happy
        - id: ch02-b02
          speaker: lucy
          text: >-
            我们知道不能登岛，可神谕让我们来，我们就来了。菲利普，你身边那位可爱的美人是谁？
        - id: ch02-b03
          speaker: philip
          text: 我来介绍。这是我姐姐海伦。海伦，站在方舟上的这位就是露西。
        - id: ch02-b04
          speaker: narrator
          text: 海伦和露西先静静地互相望了望。两个人谁也没有急着开口。随后，海伦朝露西伸出双手，露西也迎上前去，她们便亲吻了彼此。
        - id: ch02-b05
          speaker: lucy
          text: 我早知道会喜欢你，可没想到会这么喜欢。
        - id: ch02-b06
          speaker: narrator
          text: >-
            诺亚先生和佩林先生都向海伦鞠躬。两个人的动作略显僵硬，态度却非常热诚。更叫人吃惊的是，他们居然一点也不惊讶。岛民大人也望着海伦，脸上仍是那种属于他自己的、友善快活、像个学生似的笑容。
        - id: ch02-b07
          speaker: judge_noah
          text: 二位要是愿意登舟，我们就可以回大陆去，我也好说明剩下的伟业。
        - id: ch02-b08
          speaker: helen
          text: 告诉他们吧，小菲。
        - id: ch02-b09
          speaker: philip
          text: 我们现在还不想登上方舟回大陆。正好相反，我们想请你们大家离开方舟，到这座小岛上来。
        - id: ch02-b10
          speaker: judge_noah
          text: >-
            除了两个人，谁也不能上岛。原来你们就是那两位，我很高兴。我先前还怕其中一个会是女觊觎者。
        - id: ch02-b11
          speaker: philip
          text: >-
            才不是。小岛是海伦和我的，是我们创造的。现在，我们要把它送给岛民，让它真正属于他们，永远属于他们。
        - id: ch02-b12
          speaker: narrator
          text: >-
            菲利普觉得，大家一定很难相信。这么辉煌的一份礼物，就这样送了出去，没有演讲，没有仪式，仿佛只是把一只卷笔刀或一只抽陀螺当作小礼物送给别人。他猜得一点不错。
        - id: ch02-b13
          speaker: billy
          text: 让我们永远拥有？真正属于我们？永远？
          emotion: surprised
        - id: ch02-b14
          speaker: philip
          text: 对。这里没有恐惧。今后，你们可真是快活的队伍了。
        - id: ch02-b15
          speaker: narrator
          text: 一时间，没有一个人说话，也没有人回答菲利普。可每一张脸上的神情都十分丰富，仿佛藏着千言万语。大家就这样沉默了一会儿。最后，还是岛民大人先开了口。
        - id: ch02-b16
          speaker: billy
          text: 我见过那么多够朋友的朋友，可真没见过……
        - id: ch02-b17
          speaker: philip
          text: >-
            这里已经有很多房子，也有足够的地方安顿所有动物。整座小岛绕上一圈，足足有三十英里，所以地方大得很。不光岛民能住下来，方舟里的动物，还有其他所有东西，也全都住得下。
        - id: ch02-b18
          speaker: narrator
          text: >-
            说着这些话，菲利普从来没有像这一刻这样幸福。送礼物总是一件快乐的事，何况这份礼物如此广大，如此美丽，又是他如此深爱的小岛。
        - id: ch02-b19
          speaker: perrin
          text: 我一向说小菲少爷是位真正的绅士，以后也永远这样说。
        - id: ch02-b20
          speaker: judge_noah
          text: >-
            我要向你道贺，也很高兴地宣布，你的第五项伟业已经完成。还记得我们那些空空的银果盘吗？你的第五项伟业，就是为波利斯塔基亚带来水果，而这座岛是整个王国里唯一出产水果的地方。方舟正好可以把水果运往大陆。完成这项伟业以后，你便晋升为公爵了。
        - id: ch02-b21
          speaker: lucy
          text: 菲利普，你真好。
        - id: ch02-b22
          speaker: philip
          text: 别说了。
        - id: ch02-b23
          speaker: polly
          text: 为赠予公爵欢呼三声！
        - id: ch02-b24
          speaker: billy
          text: 为赠予公爵欢呼三声！
        - id: ch02-b25
          speaker: narrator
          text: >-
            那欢呼声可真不得了。岛民、文学硕士、露西、佩林先生和诺亚先生全都欢呼起来。方舟里面也传出热烈的狗叫、猪哼、兽吼和吱吱声，动物们当然也使出自己的本领加入进来。成千上万只海鸥展开白色翅膀，在阳光下盘旋，用尖叫声汇入这场大合唱。最后一阵欢呼渐渐消散，一个近在耳边的熟悉小声音响了起来。
        - id: ch02-b26
          speaker: polly
          text: 干得好，菲利普！我真为你骄傲。
          emotion: happy
        - id: ch02-b27
          speaker: narrator
          text: 带头欢呼的正是鹦鹉。它停在“闪电脱缰号”的索具上，又飞到菲利普肩头。
        - id: ch02-b28
          speaker: polly
          text: >-
            这下可好啦。这一星期，我听见你在岛上到处叫我。可我觉得自己该歇一歇。我说的话实在太多。又是女觊觎者，又是那只笼子。我向你保证，那些冒险可把我折腾得够呛，我真得花点时间才能缓过来。
        - id: ch02-b29
          speaker: judge_noah
          text: 我们大家都有过自己的冒险。
        - id: ch02-b30
          speaker: helen
          text: >-
            你们不上岸接收小岛吗？我想，大家一定都急着听彼此经历过什么。
        - id: ch02-b31
          speaker: judge_noah
          text: 岛民大人，您先请。
        - id: ch02-b32
          speaker: narrator
          text: >-
            诺亚先生让岛民大人先走。岛民大人神情格外庄重，一步步向岸上走来。海伦看见他走近，忽然转身亲了菲利普一下。就在岛民大人的脚碰到那座魔法岛海岸的一刻，她没有留下一个字，也没有留下影子，就这样毫无征兆地消失了。
        - id: ch02-b33
          speaker: philip
          text: 噢！真希望我没有把岛送出去。
          emotion: sad
        - id: ch02-b34
          speaker: narrator
          text: 他的嘴唇颤抖起来，就像快要哭了。
        - id: ch02-b35
          speaker: judge_noah
          text: >-
            一件礼物让你付出的越多，它就越珍贵。这份礼物让你付出了这么多，所以它是世上最了不起的礼物。
        - id: ch02-b36
          speaker: philip
          text: 我知道。你们就当在自己家里，好吗？
          emotion: sad
        - id: ch02-b37
          speaker: narrator
          text: >-
            这句话，他好不容易才说出来，随后便再也说不下去了。他转身走进森林，独自来到一片碧绿的林间空地，一头扑倒在草地上，趴了很久，一动也不动。那一星期原本多么快乐啊，而他已经厌倦了冒险。最后，他像是下定决心不再哭了，郑重地吸了吸鼻子，抬起头来。第一眼便看见露西背对着他，一动不动地坐在那里。
        - id: ch02-b38
          speaker: philip
          text: 喂，你在这里做什么？
        - id: ch02-b39
          speaker: lucy
          text: >-
            背乘法表，这样我连想也不会想到你。我一次都没回头。我知道你想独自待着，可等你不想独处了，我希望自己就在这里。我有话对你说。
        - id: ch02-b40
          speaker: philip
          text: 那就说吧。
        - id: ch02-b41
          speaker: lucy
          text: >-
            我觉得你棒极了。我希望咱们永远真正讲和。剩下的冒险，我也会帮你。你要是发脾气，我尽量不放在心上。我想，拿破仑有时也发脾气，尤利乌斯·凯撒也是。
        - id: ch02-b42
          speaker: philip
          text: 噢，那好吧。
        - id: ch02-b43
          speaker: lucy
          text: 那我们要做真正的好朋友了？
        - id: ch02-b44
          speaker: philip
          text: >-
            噢，好吧，只要你愿意，我们就是好朋友。不过，只是这一次我不介意你夸我。你明明知道我想独自待一会儿，还肯背对着我坐在这里等我，这件事确实做得很够朋友。只是我讨厌别人不停地说好听话，夸个没完。
        - id: ch02-b45
          speaker: lucy
          text: >-
            是，我知道。可有时候，你就是非得夸上几句，否则满肚子的佩服会把自己撑破。还有，你原来的衣服都在这个包袱里。岛民的城堡被海水冲走以后，我一直替你带着，从来没有丢下。现在给你。
        - id: ch02-b46
          speaker: narrator
          text: 露西说完，从身边拿出那个一直带着的衣服包袱，郑重地交给菲利普。这一回，菲利普真的被她感动了。
        - id: ch02-b47
          speaker: philip
          text: >-
            这才叫办了件漂亮事。海藻衣服在这里穿着倒没什么，可出去冒险，谁知道要经历什么？可能有荆棘，也可能有蛇，什么都有。我能把靴子拿回来，也实在太高兴了。走吧，去海伦的宫殿准备一场宴会。我知道一定得办宴会，这地方向来如此。附近正好有一棵顶呱呱的小圆面包树。
        - id: ch02-b48
          speaker: lucy
          text: 我来时看见椰蓉糖植物，长得真漂亮。这座岛多美呀，而且是你创造的！
        - id: ch02-b49
          speaker: philip
          text: 别夸个没完。是海伦和我一起创造的。
        - id: ch02-b50
          speaker: lucy
          text: 她是世上最最可爱的人。
        - id: ch02-b51
          speaker: philip
          text: 好吧，你非夸不可，就夸她吧。
    - id: ch03
      title: 前往瞌睡城
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            那场宴会多么有趣，多么盛大，你尽可以随意想象。菲利普自然成了众人心里的英雄。宴会结束，最后一位客人也回到了自己的房子。岛上的房屋早已准备妥当，家具一应俱全，舒适到了极点，每个房间甚至都放着一只插满针的针垫。最后，诺亚先生、露西和菲利普坐在粉红玫瑰环绕的露台台阶上，又谈了一会儿。
        - id: ch03-b02
          speaker: philip
          text: 我们明早就出发。请您现在告诉我，下一项伟业是什么？
        - id: ch03-b03
          speaker: judge_noah
          text: 你们愿意乘方舟去吗？我很乐意送你们。
        - id: ch03-b04
          speaker: narrator
          text: 诺亚先生卷起黄色地垫，垫在肘下，舒舒服服地靠了上去。
        - id: ch03-b05
          speaker: philip
          text: >-
            我想乘“闪电脱缰号”去。我还从没驾过它。您觉得我能行吗？
        - id: ch03-b06
          speaker: judge_noah
          text: >-
            你当然能。就算一开始不会，露西也可以在旁边教你。这艘迷人的游艇，操纵方法和方舟完全一样。在这个国度里，无论你们往哪里去，风也永远会顺着你们。船上已经备好了充足的食物。另外，下一项伟业的大半路程都能走水路，你们先穿过大海，然后再沿河而上。
        - id: ch03-b07
          speaker: philip
          text: 下一项伟业到底是什么？
        - id: ch03-b08
          speaker: judge_noah
          text: >-
            波利斯塔基亚最北端有座瞌睡城。在日子好过的时候，它从前叫勤快渡。那时，一条湍急的河流穿城而过，从山里带来许多黄金。大块的黄金不断威胁着要堵住河道，居民们必须辛勤劳作，才能把河道疏通。那时，田地水源充足，庄稼丰饶，人人快活又幸福。
        - id: ch03-b09
          speaker: judge_noah
          text: >-
            鹰头马身有翼兽从书里逃走时，大懒兽也跟着跑了出来。人们想尽办法也抓不住它，它便一路来到北方。它身躯庞大，模样也十分惹眼。也不知居民是害怕它，还是崇拜它，反正勤快渡所有人渐渐都听命于它。它叫大家用纯金替它造一座神殿。人们忙着建造神殿，河床再也没人疏通。最后河道彻底堵死，水流改了方向，从离镇子很远的地方流走了。
        - id: ch03-b10
          speaker: judge_noah
          text: >-
            从那以后，镇子便一天比一天衰败。田野晒得干裂，再也没有人耕种。居民需要的那一点饮用水，也得费尽力气，才能从一口井里打上来。至于洗澡，次数已经少得简直不像话了。
        - id: ch03-b11
          speaker: philip
          text: 我们是去教那些脏家伙洗澡吗？
          emotion: disgusted
        - id: ch03-b12
          speaker: judge_noah
          text: 别打岔，你把我的思路全弄断了。我说到哪儿了？
        - id: ch03-b13
          speaker: lucy
          text: 很少洗澡。可田地都干了，他们吃什么呢？
        - id: ch03-b14
          speaker: judge_noah
          text: >-
            菠萝。那里遍地都长菠萝，而且不需要多少水。采菠萝，是这群堕落居民唯一的营生。菠萝在那儿不算水果，只算蔬菜。只要还醒着，他们除了采菠萝、吃菠萝，其余时间全拿来齐声唱歌，赞美大懒兽。
        - id: ch03-b15
          speaker: judge_noah
          text: >-
            可他们醒着的时间很短。大懒兽对瞌睡城人的影响太深，它一睡，所有人也跟着睡，而它几乎时时刻刻都在睡。你的任务，是想办法让大懒兽一直醒着，还得让它有事可忙。我看，这回可有你忙的了。等你处置好它，就回岛上向我报告。我会在这里住上一阵，我需要休假。鹦鹉陪你们去，它对这个国度的道路了如指掌，不输给任何一只鸟。晚安，祝你们好运。明早我不下楼陪你们吃饭，请别见怪。
        - id: ch03-b16
          speaker: narrator
          text: >-
            第二天一早，时间早得连露水都还没有干，菲利普、露西和鹦鹉便登上游艇，解开系在码头上的缆绳。露西站在菲利普身旁，教他怎样掌舵。鹦鹉坐在高高的桅杆上，不断向下面大声指点。他们就这样离开小岛，朝一条河的河口驶去。
        - id: ch03-b17
          speaker: philip
          text: 我可没造过一条河。
        - id: ch03-b18
          speaker: polly
          text: 没有，它是从诗集里跑出来的。
        - id: ch03-b19
          speaker: narrator
          text: >-
            等到大家肚子饿了，他们便把锚放下，走进船舱准备吃早饭。刚一进去，两个家伙突然冲出来迎接他们。那股欢迎的热烈劲儿太大，几乎把露西撞倒在地。大家定睛一看，原来是两只熟悉的狗，马克斯和布伦达。
        - id: ch03-b20
          speaker: lucy
          text: 亲爱的家伙！你们怎么来的？
          emotion: happy
        - id: ch03-b21
          speaker: polly
          text: 诺亚先生给你们准备了一点小惊喜。
        - id: ch03-b22
          speaker: narrator
          text: 马克斯和布伦达围着两个孩子，又是呜咽，又是吠叫，摇头摆尾，满腔亲热简直要从身上涌出来。
        - id: ch03-b23
          speaker: lucy
          text: 真希望我们能听懂它们的话。
        - id: ch03-b24
          speaker: polly
          text: >-
            只要知道鹰头马身有翼兽服从的魔法词，念出来就能听懂所有动物说话。不过我不能告诉你们，那是十一桩奥秘之一。
        - id: ch03-b25
          speaker: philip
          text: 可我知道。
        - id: ch03-b26
          speaker: narrator
          text: >-
            菲利普立刻贴近布伦达小巧柔软的耳朵，轻轻念出那个词，又凑近马克斯那只更长、更柔软的耳朵，再念一遍。就在那一瞬间，两只狗的话忽然全都能听懂了。
        - id: ch03-b27
          speaker: brenda
          text: >-
            噢，我最最亲爱的主人！见到你们，我们真是太高兴啦。我只是一只又可怜又忠心的小狗狗，也不聪明。可是我天生感情丰富，再见到亲爱的男主人和女主人，简直高兴得要发疯啦！
          emotion: happy
        - id: ch03-b28
          speaker: max
          text: >-
            见到您很高兴，先生。希望您在这里一切舒适。对狗来说，没有什么比陪着主人更舒服。
        - id: ch03-b29
          speaker: narrator
          text: >-
            马克斯说完这些客气话，就坐下来睡着了。其他人开始吃早饭，在游艇上亲手做饭还真有几分好玩。还有一件新鲜可爱的事，那就是看布伦达文雅地坐直身子，一边向主人讨一点吃的，一边用它那副殷勤口气说话。
        - id: ch03-b30
          speaker: brenda
          text: >-
            我实在不愿打扰亲爱的主人。可要是能再分给我一丁点儿培根……噢，谢谢，你们真是又善良又大方！
        - id: ch03-b31
          speaker: narrator
          text: >-
            他们顺利驾着游艇驶进河中。不久，河流钻进一片热带森林投下的阴影。那片森林，同样也是从一本书里跑出来的。
        - id: ch03-b32
          speaker: polly
          text: >-
            夜里也可以赶路。让两只狗照我的指点掌舵，用绳子一头系项圈，一头系船舵。这比转烤肉叉容易。
        - id: ch03-b33
          speaker: max
          text: 非常乐意。不过，白天让我们睡觉，这一点说定了吧？
        - id: ch03-b34
          speakers: [philip, lucy, polly, brenda]
          ensemble: chorus
          text: 当然，白天一定让你们好好睡觉！
        - id: ch03-b35
          speaker: narrator
          text: 大家都答应了两只狗的条件，夜里由它们掌舵，白天就让它们好好睡觉。事情就这样说定，菲利普和露西也放心回到船舱，上床睡觉去了。
    - id: ch04
      title: 地下河
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 半夜，鹦鹉照旧用鸟喙轻轻一碰，把菲利普叫醒。
        - id: ch04-b02
          speaker: polly
          text: >-
            醒醒。这条河不对，方向不对，什么都不对，整艘船全错了。恐怕有人打开一本书，这条河从里面跑出来了。
        - id: ch04-b03
          speaker: narrator
          text: >-
            菲利普急忙冲上甲板，借着船舱里的灯火，向河岸望去。至少，他原本想找找河岸，可这里根本没有岸。只有陡峭嶙峋的悬崖拔地而起，立在水流两边。头顶也不是繁星点点的夜空，而是一座巨大的洞窟穹顶。湿润的岩石闪着微光，却像乌鸦的羽毛一样漆黑。
        - id: ch04-b04
          speaker: philip
          text: 我们得回头。我一点也不喜欢这里。
        - id: ch04-b05
          speaker: polly
          text: 可惜没有地方掉头，“闪电脱缰号”造出来也不是为了倒着开的。
        - id: ch04-b06
          speaker: brenda
          text: >-
            真希望我们没来。亲爱的小狗狗应该舒舒服服地让人照顾，不该被送上这种讨厌的船，遇到危险还不能回头。
          emotion: fearful
        - id: ch04-b07
          speaker: max
          text: >-
            亲爱的，小狗狗眼下也无能为力。它们最好留心找机会，帮一帮自己的主人。
        - id: ch04-b08
          speaker: philip
          text: 那我们究竟能怎么办？
        - id: ch04-b09
          speaker: polly
          text: >-
            恐怕除了径直向前，什么也做不了。如果这条河来自一本书，它总会从什么地方流出去。书里的河绝不会一路流到地下，然后永远留在那里，再也不出来。
        - id: ch04-b10
          speaker: philip
          text: 我不叫醒露西，她可能会害怕。
        - id: ch04-b11
          speaker: lucy
          text: 用不着。她已经醒了，而且她并不比你更害怕。
        - id: ch04-b12
          speaker: max
          text: 布伦达，听见了吗？亲爱的，你该学学她。
        - id: ch04-b13
          speaker: lucy
          text: 可我们走错了路，就到不了大懒兽那里。
        - id: ch04-b14
          speaker: polly
          text: >-
            放心吧，早一点也好，晚一点也好，走这条路也好，换另一条路也好，我们总会来到它面前。何况，对于一只大懒兽来说，时间根本没有什么重要的。
        - id: ch04-b15
          speaker: narrator
          text: >-
            此刻天气冷极了。好在游艇周到地备有世界各国的旗帜，旅伴们纷纷把旗子裹在身上。菲利普拿英国国旗，还有绘着百合花与豹子的古英国王室旗，给自己围成一件罩袍。露西披上日本国旗当披肩，说旗上的太阳图案让她觉得暖和。可是“闪电脱缰号”沿着黑沉沉的水流疾驰，两边是黑沉沉的石壁，头顶是黑沉沉的洞顶。菲利普裹在繁复的十字与狮子图案里，还是冷得发抖。
        - id: ch04-b16
          speaker: polly
          text: >-
            振作点。想想你们经历了多少别人从没经历过的冒险。等回学校，你能讲给其他男孩子听的故事可多着呢。
        - id: ch04-b17
          speaker: philip
          text: 那些男孩子一个字也不会信。要不是我知道是真的，换成我也不会信。
        - id: ch04-b18
          speaker: lucy
          text: >-
            我倒觉得，我们根本不会想把这些事告诉别人。只要我们自己知道，往后再由我和菲利普两个人一起谈起这些事，就已经足够了。
        - id: ch04-b19
          speaker: polly
          text: 这个嘛……是我的爪子骗了我，还是船身有一种奇怪的震动，速度也明显加快了？
        - id: ch04-b20
          speaker: philip
          text: 啊？
        - id: ch04-b21
          speaker: narrator
          text: 菲利普知道，这样答话不太礼貌。
        - id: ch04-b22
          speaker: max
          text: 它是说，我们是不是越来越快，船也晃得越来越厉害？
        - id: ch04-b23
          speaker: narrator
          text: >-
            它说得一点不错。“闪电脱缰号”正在那条地下水道里越驶越快。黑暗的水流飞快地从船底滑过，游艇还时不时猛地歪向一边，从船头到船尾颤抖一下。
        - id: ch04-b24
          speaker: brenda
          text: 对亲爱的小狗狗来说，这地方太可怕啦！
          emotion: fearful
        - id: ch04-b25
          speaker: lucy
          text: >-
            菲利普，我知道会发生什么事，一件可怕的事。我们是朋友，对不对？
          emotion: fearful
        - id: ch04-b26
          speaker: philip
          text: 对。
        - id: ch04-b27
          speaker: lucy
          text: 那我希望你亲我一下。
        - id: ch04-b28
          speaker: philip
          text: 我不亲你，也可以一样喜欢你。亲别人，不是很傻吗？
        - id: ch04-b29
          speaker: lucy
          text: >-
            爸爸走后，再没有人亲过我，除了海伦。可你愿意亲海伦。她说过，你会收我做妹妹。
          emotion: sad
        - id: ch04-b30
          speaker: philip
          text: 噢，那好吧。
        - id: ch04-b31
          speaker: narrator
          text: >-
            菲利普伸手搂住露西，亲了她一下。她在他的臂弯里显得那么幼小，那么无助，身子又那么单薄，菲利普忽然很可怜她，于是更温柔地又亲了一下。随后，他收回手臂，像是在给伙伴鼓劲那样，用力拍了拍她的背。
        - id: ch04-b32
          speaker: philip
          text: >-
            勇敢一点。我完全肯定，什么可怕的事也不会发生。我们只是在穿过一条隧道。再过一会儿，游艇就会驶回露天底下，天空还在，星星也还在，一切都会像平常那样继续下去。
          emotion: calm
        - id: ch04-b33
          speaker: narrator
          text: 菲利普说这番话时，正和露西并肩站在游艇的船头。他还没说完最后一句，露西忽然用力抓紧了他的手臂。
        - id: ch04-b34
          speaker: lucy
          text: 快看……快听！
          emotion: fearful
        - id: ch04-b35
          speaker: narrator
          text: >-
            菲利普侧耳倾听，听见一阵低沉的轰鸣在洞里回荡。起初声音还远，随后越来越近，也越来越响。他又抬眼望去。灯光原先照着前方幽暗发亮的水面，忽然再也照不到水，因为前方已经没有水面了。那里只剩一片巨大、空洞、漆黑的虚无。一个大洞横在前方，河水不停向里面倾泻。转眼间，他们已经到了深渊边缘。
        - id: ch04-b36
          speaker: narrator
          text: >-
            “闪电脱缰号”先是全身颤抖一下，随后猛地向前一跃。它仿佛有漫长的一刻，正正悬在悬崖边上。地下河从那道悬崖倾泻下去，水流平滑油亮，像一股刚刚倒出的糖浆，越过了脚下的边缘，落向仿佛一切坚实之物都已经到了尽头的地方。
        - id: ch04-b37
          speaker: narrator
          text: >-
            那仿佛漫长的一刻终于结束。小小的游艇再也没有任何东西托住，船头猛然向下一栽。它载着菲利普、露西、鹦鹉，还有马克斯和布伦达两只狗，一头冲下悬崖边缘，直直坠进下方黑暗而未知的深渊。
        - id: ch04-b38
          speaker: philip
          text: 没事的，露。我会照顾你。
          emotion: calm
        - id: ch04-b39
          speaker: narrator
          text: 游艇和船上的伙伴全都坠入黑暗。随后，整个洞窟里一片寂静，再也听不见人的声音。只有那道巨大瀑布不停奔流，轰隆隆的水声独自在岩石穹顶下面回荡。
