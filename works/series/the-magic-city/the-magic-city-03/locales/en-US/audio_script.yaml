  chapters:
    - id: ch01
      title: CHAPTER III. LOST
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Philip fell asleep and dreamed he was home again. Helen came to wake him, leading a clever white pony that was to be all his own. Philip was not at all surprised when the pony shook hands with him. Then it began pulling on his shoes and stockings.
        - id: ch01-b02
          speaker: dream_pony
          text: >-
            Well, we ought to get moving.
        - id: ch01-b03
          speaker: philip
          text: >-
            Here, stop that!
        - id: ch01-b04
          speaker: narrator
          text: >-
            He woke in a room full of sunshine and quite empty of ponies.
        - id: ch01-b05
          speaker: philip
          text: >-
            Oh, well. I suppose I'd better get up.
        - id: ch01-b06
          speaker: narrator
          text: >-
            His new silver watch, one of Helen's goodbye presents, said ten o'clock.
        - id: ch01-b07
          speaker: philip
          text: >-
            Look here, you can't possibly be right.
        - id: ch01-b08
          speaker: narrator
          text: >-
            He shook the watch, hoping it might reconsider. It still said ten, clearly and unmistakably. Breakfast at the Grange was at eight, and no one had called him.
        - id: ch01-b09
          speaker: philip
          text: >-
            This is very odd. The watch must have stopped.
        - id: ch01-b10
          speaker: narrator
          text: >-
            But it had not. So breakfast had been over for two hours. As soon as Philip understood that, he became terribly hungry and jumped out of bed.
        - id: ch01-b11
          speaker: narrator
          text: >-
            No one was about. Philip went to the bathroom and spent a delightful hour investigating everything he had never been allowed to enjoy properly. There were hot and cold taps, brown Windsor soap and shaving soap, brushes, loofahs, three sponges, and the shower. With nobody to stop him, he forgot all about not being called.
        - id: ch01-b12
          speaker: narrator
          text: >-
            At last he lay in very hot water and tried to remember a poem Helen had made for him about the bath. By the time he had recalled every bit of “Dreams of a Giant Life,” the water was nearly cold.
        - id: ch01-b13
          speaker: narrator
          text: >-
            In the poem, Philip looked back across the long ages. People changed so much as the years passed that he could hardly believe the person he remembered had once been him. Yet there he stood, glorious and strong and as tall as a giant, on top of a white cliff. A dark wood crowned the cliff behind him. Far below, a bright bay sparkled in the light. More white cliffs circled its smooth, equal waters, and the whole bay seemed asleep in the warm, silent air.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The giant stood there alone, naked and upright, with his arms and legs shining in clear golden light. He gazed down at all that water. It seemed to expect something, and the thing it expected was him. So he bent forward and plunged from the cliff. The waves burst over him. Then he floated on his back, a giant lying in a little sea.
        - id: ch01-b15
          speaker: narrator
          text: >-
            White cliffs rose on every side, each one topped with woods. The dying day spread its glory over everything. No wind stirred his sea. Sunlight poured across it as if it shone through windows made of golden glass. The clear water lay pure, deep, and perfect within the cliffs. The giant was master of the cliffs, the sea, and all the golden light above him. Miles away, his enormous feet rose from the quiet water like two rocks. They were so large that a lighthouse could have stood on them to warn wandering ships where not to sail.
        - id: ch01-b16
          speaker: narrator
          text: >-
            He splashed both hands and sent waves washing over himself. In the little hollows of his giant body, the water made tiny rock pools where small sea creatures could have played. Then he found a boat. Its deck was pierced with holes, and its woolen sail rose against the sky from a mast of ivory. The giant launched it onto the water, where it bravely faced every storm that fate could send.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Another proud ship floated into his hand. A thousand spears stood upright across its deck. He launched that ship as well, and it raced fiercely over the water toward the first boat, the one with the woolen sail, the ivory mast, and the deck full of holes. The two vessels struck. In one tremendous wreck, they both plunged beneath the waves.
        - id: ch01-b18
          speaker: narrator
          text: >-
            His hand darted joyfully under the water after a slippery brown sea mouse. He chased it over a seabed of imaginary sand. Again and again, it escaped him by slipping into the deep cave formed beneath his bent knee. At last the giant caught the creature. He carried it to the shallows over his chest and kept it safely caged there.
        - id: ch01-b19
          speaker: narrator
          text: >-
            He lay in the soft, sweet world of warm water, and it seemed to wrap around him like a pair of kind arms. Then a great voice rang out from a faraway shore that he could not see. The voice broke the spell. In that instant, he was not a giant anymore.
        - id: ch01-b20
          speaker: nurse
          text: >-
            Come out now, Master Pip. You've been in there a quarter of an hour. The water is cold, your hair is wet, and it's time for bed.
        - id: ch01-b21
          speaker: narrator
          text: >-
            He rose dripping from the magic sea and left behind the ships and creatures that had served him. Now their true shapes could be seen. The boat with holes in its deck was the soap dish. The other ship was the nailbrush. Its sail was only a flannel, and the ivory mast was a toothbrush. The sleek brown sea mouse was a wet cake of soap. Philip left them all. He cried because the time had come to be rubbed dry. He had to give up the splendor and joy of being a giant and go to bed as one small, thoroughly washed boy.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Once Philip had remembered the whole poem, he took another shower. Then he rubbed himself with rough towels from the hot cupboard and hurried away to dress. He was desperately hungry now. He dressed so fast that he left his bootlaces loose and dropped his collar stud.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Bending to pick it up reminded him of his dream. Oddly enough, he had not thought of the dream once since waking. It was certainly worth thinking about, but breakfast mattered more.
        - id: ch01-b24
          speaker: philip
          text: >-
            As soon as I get downstairs, I'll ask the first person I see for breakfast.
        - id: ch01-b25
          speaker: narrator
          text: >-
            He did not meet a single person. No one was on the stairs or in the hall. The dining room and drawing room were empty. There was not a living soul in the library or billiard room, and the nursery door had been locked. So Philip pushed through the green baize door into the hidden part of the house where the servants worked. He searched the kitchen, the servants' hall, and the butler's pantry. He looked in the scullery, the washhouse, and the larder. Every room was empty.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The Grange was much larger than anyone would guess from the front. Two long wings reached away at the back, one on either side. Yet nowhere in that enormous house could Philip find another person. To make completely sure, he ran upstairs again and searched all the bedrooms. He went through the little picture gallery and the music room. Then he searched the servants' bedrooms and climbed right up into the attics. There were many interesting things hidden there, though Philip was too worried to notice them properly. He only remembered them afterward.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Now he tore downstairs, taking three steps at a time. All the doors stood open exactly as he had left them. Somehow, the sight of one empty room after another through those open doors frightened him more than anything else. He ran along corridor after corridor and down still more stairs. He dashed through the back kitchen and out of the house, then followed the moss-grown path beside the brick wall. He rounded the three yew trees, passed the mounting block, and burst into the stable yard.
        - id: ch01-b28
          speaker: narrator
          text: >-
            No one stood in the yard. The coachman, the groom, and all the stable boys were gone. Philip searched inside the stables and then the coach house, the harness room, and the loft. Those places were empty too. By then he could not bear the thought of going back into the silent house. Something terrible must have happened. Could someone have wanted the Grange servants so badly that they kidnapped every one of them? Philip considered the nurse. No, he thought. At least where she was concerned, that explanation was impossible.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Perhaps it was magic. Perhaps it was something like Sleeping Beauty, except that everyone had vanished instead of sleeping for a hundred years. Then another thought came to him as he stood alone in the stable yard.
        - id: ch01-b30
          speaker: philip
          text: >-
            Maybe they're only invisible. They could all be standing here, watching me and laughing.
        - id: ch01-b31
          speaker: narrator
          text: >-
            He stood very still. He did not like that thought at all. Then he straightened his back and lifted his head.
        - id: ch01-b32
          speaker: philip
          text: >-
            Well, they aren't going to see me frightened.
        - id: ch01-b33
          speaker: narrator
          text: >-
            He remembered the larder and spoke loudly, in case invisible people were listening.
        - id: ch01-b34
          speaker: philip
          text: >-
            I haven't had breakfast, and I ought to have it. If nobody brings me any, I'll take it myself.
        - id: ch01-b35
          speaker: narrator
          text: >-
            No answer came. The stable yard was very quiet. A halter ring rattled against a manger, a hoof struck the stones, pigeons cooed, and straw rustled in a loose box.
        - id: ch01-b36
          speaker: philip
          text: >-
            Very well. Since I don't know what you think I should eat, I'll choose what I think.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Philip took a long breath and tried to draw courage into himself along with the air. He pushed back his shoulders until they looked more soldierly than ever, marched through the back door, and went straight to the larder. There he chose exactly what he believed a proper breakfast should contain. He took one cherry pie, two custards in cups, one cold sausage, two pieces of cold toast, and one piece of cheese. He added two lemon cheesecakes, the last small jam tart, and a pat of butter.
        - id: ch01-b38
          speaker: philip
          text: >-
            The servants get awfully good things to eat. I thought this house only grew mutton and rice.
        - id: ch01-b39
          speaker: narrator
          text: >-
            He arranged all the food on a silver tray and carried it outside to the terrace that lay between the two wings at the back of the house. Then he returned to find some milk. There was none in sight, so he filled a white jug with water instead. He searched for spoons and failed to find those too. At last he armed himself with a carving fork and a fish slice. Perhaps you have never tried eating cherry pie with a fish slice. If you have, you know what a difficult business it is.
        - id: ch01-b40
          speaker: philip
          text: >-
            Whatever has happened, and whatever happens next, it's better to have eaten breakfast.
        - id: ch01-b41
          speaker: narrator
          text: >-
            He spoke through a mouthful of cherry pie. Then he stabbed the cold sausage with his carving fork and bit off a generous inch. Philip sat in the good sunshine, working steadily with his strange pair of utensils and growing less hungry with every bite. As his stomach became more comfortable, his mind returned to the dream. The longer he thought about it, the more real it seemed. Perhaps the adventure truly had happened. Magic things did happen, apparently. After all, every person had vanished from the house. They might have vanished from the whole world.
        - id: ch01-b42
          speaker: philip
          text: >-
            Suppose everybody has vanished, and I'm the only person left. Then everything would belong to me. I could have every single thing in every toy shop.
        - id: ch01-b43
          speaker: narrator
          text: >-
            For a moment, he enjoyed that beautiful idea.
        - id: ch01-b44
          speaker: philip
          text: >-
            But what if I vanished too? Maybe then I could see everyone else who vanished. I wonder how you do it.
        - id: ch01-b45
          speaker: narrator
          text: >-
            He held his breath and tried as hard as he possibly could to disappear. Have you ever tried to vanish that way? It is not easy at all. Philip tried and tried, but he did not grow transparent or fade from sight. Instead, he felt fatter and fatter. In another moment, he was sure he would burst. He could hold the breath no longer and let it rush out.
        - id: ch01-b46
          speaker: philip
          text: >-
            No. I'm no more invisible than before. Maybe I'm even less invisible now.
        - id: ch01-b47
          speaker: narrator
          text: >-
            He looked thoughtfully at what remained of the pie.
        - id: ch01-b48
          speaker: philip
          text: >-
            Still, that dream...
        - id: ch01-b49
          speaker: narrator
          text: >-
            He plunged deep into the memory. To Philip, remembering felt like swimming far below the surface of a fairy lake. Then voices hooked him out of that lake as suddenly as waking from sleep. He looked across the wide green park. Beyond the sunken fence, a group of people was coming toward the house.
        - id: ch01-b50
          speaker: philip
          text: >-
            So not everyone has vanished.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Philip snatched up the tray, hurried indoors, and pushed it out of sight beneath a pantry shelf. He did not know who those people were, and you cannot be too careful when strangers are coming. Outside again, he pressed himself into the shadow of a red brick buttress and made his body as small as he could. Their footsteps and voices came nearer and nearer. Everyone was speaking at once in that quick, interested way that tells you something very unusual has happened.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Philip could not hear whole sentences from his hiding place. Only a few scraps reached him. First came a sharp “No.” Then one person insisted that of course they had asked. Philip heard the word “police,” and after that, “telegram.” Someone said, “Yes, of course,” and another voice answered that they had better make quite sure. Then all the voices rose together again, and nobody's words could be separated from anyone else's.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Philip stayed behind the buttress, too busy hiding to see who was talking. He was glad that something had happened. At least there was something new to think about besides the nurse and the beautiful city she had pulled down. Then he wondered what the trouble might be. He hoped no one had been hurt, and he hoped no one had done anything wrong. The word “police” always made him uneasy. Once he had seen an enormous policeman pulling a boy no bigger than Philip along the road. Someone said the boy had stolen a loaf of bread. Philip could never forget his face. In church, that was the face he saw when the prayers mentioned prisoners and captives. He saw it even more clearly when they spoke of people who were desolate and oppressed.
        - id: ch01-b54
          speaker: philip
          text: >-
            I do hope it isn't anything like that.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Slowly, he left the shelter of the buttress and followed the voices into the house.
        - id: ch01-b56
          speaker: narrator
          text: >-
            They led him to the kitchen. The cook sat crying in a Windsor chair. The kitchen maid wept down very dirty cheeks, with her cap tipped sideways. The coachman was red in the face, and the groom had forgotten his gaiters. The nurse looked neat at first, as always. Philip was delighted to notice mud on her large shoes and skirt, and a great three-cornered tear in her dress.
        - id: ch01-b57
          speaker: coachman
          text: >-
            I wouldn't have let this happen for twenty pounds.
        - id: ch01-b58
          speaker: nurse
          text: >-
            George, saddle a horse. I must write a telegram.
        - id: ch01-b59
          speaker: coachman
          text: >-
            Take Peppermint. She's our fastest.
        - id: ch01-b60
          speaker: narrator
          text: >-
            As the groom went out, he muttered something about teaching your grandmother. Philip thought it both rude and meaningless. Still unnoticed by the door, he felt the strange thrill that comes when something real has happened. If it was not pleasure, it felt very close to pleasure. But what had happened?
        - id: ch01-b61
          speaker: nurse
          text: >-
            I wish I'd never come back. Then no one could claim this was my fault.
        - id: ch01-b62
          speaker: cook
          text: >-
            Never mind what anyone claims. What matters is what's happened. Oh, goodness! I'd sooner lose my position without a reference than have this happen.
        - id: ch01-b63
          speaker: nurse
          text: >-
            I'd sooner have anything happen. Oh, why was I ever born?
          emotion: sad
        - id: ch01-b64
          speaker: narrator
          text: >-
            Then, before Philip's astonished eyes, the nurse did what any pleasant person might do. She began to cry.
        - id: ch01-b65
          speaker: cook
          text: >-
            It never would have happened if the master were home. He's a Justice of the Peace, and gypsies are terrified of him. If he'd been here—
        - id: ch01-b66
          speaker: philip
          text: >-
            What wouldn't have happened?
        - id: ch01-b67
          speaker: narrator
          text: >-
            Everyone jumped. The nurse stopped crying and stared at him.
        - id: ch01-b68
          speaker: nurse
          text: >-
            Oh, it's you. I had forgotten all about you. I suppose you want breakfast, whatever else has happened.
        - id: ch01-b69
          speaker: philip
          text: >-
            No, I don't. I want you to tell me what happened.
        - id: ch01-b70
          speaker: cook
          text: >-
            Miss Lucy is lost. There, now you know. Run along and play like a good boy. We're in enough trouble without you making more.
        - id: ch01-b71
          speaker: philip
          text: >-
            Lost?
          emotion: surprised
        - id: ch01-b72
          speaker: nurse
          text: >-
            Yes, lost. I daresay you're pleased, after the way you treated her. Be silent. I don't want to hear so much as one breath from you for the next twenty-four hours. I'm going to write that telegram.
          emotion: angry
        - id: ch01-b73
          speaker: narrator
          text: >-
            Philip decided no one had better hear him breathe. That was how he heard the nurse read her telegram to the cook.
        - id: ch01-b74
          speaker: nurse
          text: >-
            Peter Graham, Esquire, Hotel Wagram, Brussels. Miss Lucy is lost. Please come home at once. Philkins. Does that sound right?
        - id: ch01-b75
          speaker: cook
          text: >-
            Why should you sign it Philkins? You're only the nurse. I'm in charge while the family is away, and my name is Bobson.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Paper tore.
        - id: ch01-b77
          speaker: nurse
          text: >-
            There, I've torn it. Your name may go on the next one. I don't want to be the person who sends news like this.
        - id: ch01-b78
          speaker: cook
          text: >-
            Oh, what a dreadful thing! Poor little darling!
          emotion: sad
        - id: ch01-b79
          speaker: narrator
          text: >-
            Someone wrote the telegram again. The nurse carried it to the stable yard, where Peppermint was waiting under a saddle.
        - id: ch01-b80
          speaker: philip
          text: >-
            I thought Lucy was staying with her aunt.
        - id: ch01-b81
          speaker: cook
          text: >-
            She came home last night, after you were in bed. This morning the nurse went into the night nursery, and Lucy was gone. Her bed was empty and cold, and her clothes had disappeared. How gypsies got in without waking the nurse will always be a mystery to me. She must sleep like a pig.
        - id: ch01-b82
          speaker: coachman
          text: >-
            Or like the Seven Sleepers.
        - id: ch01-b83
          speaker: philip
          text: >-
            But why would gypsies want Lucy?
        - id: ch01-b84
          speaker: cook
          text: >-
            Why do they ever steal anyone? Think of all the heirs who've been carried off. I doubt there's a titled family in England that hasn't lost an heir that way, sooner or later.
        - id: ch01-b85
          speaker: philip
          text: >-
            You did search the whole house, didn't you?
        - id: ch01-b86
          speaker: cook
          text: >-
            We're not deaf, dumb, blind, and foolish. Here comes the nurse. Off you go, Master Philip, unless you want a sharp scolding.
        - id: ch01-b87
          speaker: narrator
          text: >-
            At that warning, Philip went at once. He escaped into the long drawing room and closed the door behind him. From the Buhl cabinet, he brought out the ivory chessmen and arranged them on the beautiful chess table, whose squares were made of mother-of-pearl and ivory. He tried to play a game with his right hand against his left. Unfortunately, his right hand controlled the white pieces and therefore moved first. The right hand won every time.
        - id: ch01-b88
          speaker: narrator
          text: >-
            After a while he gave up and returned every chessman to its proper place. Next he opened the large book filled with photographs of famous pictures, but none of them seemed interesting. Then he took out the ivory spellicans. That game demands a perfectly steady hand, and Philip's hand would not stop trembling. All the while, behind the chess game, behind the pictures, and behind the spellicans, he was trying not to think about his dream. He did not want to remember climbing the ladder that was really a yardstick. He did not want to remember entering the cities he had built across the tables. The very thought of remembering made him wretched and guilty.
        - id: ch01-b89
          speaker: narrator
          text: >-
            He crossed to the window and looked outside. The harder he tried not to remember, the more restless his boots became. They shifted and scraped until his right boot struck something hard hidden among the folds of the blue brocade curtain. Philip looked down, bent over, and picked up little Mr. Noah. The nurse must have dropped the wooden figure there while she was clearing away the city.
        - id: ch01-b90
          speaker: narrator
          text: >-
            The moment Philip looked into those wooden features, refusing to remember became impossible. The whole dream rushed back in a flood, and with it came the memory of what he had done. He had promised to be Lucy's noble friend. When the soldiers galloped after them, they had started running together. Philip had run faster. At the top of the ladder, the ladder that led to safety, he had climbed down without waiting for Lucy.
        - id: ch01-b91
          speaker: philip
          text: >-
            Any proper hero would have waited and let her climb down first. Any gentleman would. Even any ordinary man would. But I rushed down and forgot her. I left her there.
        - id: ch01-b92
          speaker: narrator
          text: >-
            Remorse made his boots shuffle harder.
        - id: ch01-b93
          speaker: philip
          text: >-
            Still, it was only a dream.
        - id: ch01-b94
          speaker: narrator
          text: >-
            Yet the remorse he had kept pushed down seemed to answer him. What if it had been real? What if he truly had abandoned Lucy, his noble friend, and that was why she was lost?
        - id: ch01-b95
          speaker: narrator
          text: >-
            All at once, Philip felt very small and forlorn, as if he were the loneliest person in the whole world. Then he remembered Helen. The telegram would bring her home. That should have comforted him, but another thought followed it. When she came, Philip would have to face her and explain that Lucy might be lost because of what he had done.
        - id: ch01-b96
          speaker: narrator
          text: >-
            It did no good to tell himself that Helen would never believe a story about a magic city. Deep inside, he knew she would believe him. Why shouldn't she? Helen knew all about fairy tales and the Arabian Nights. She, of all people, would know that impossible things sometimes truly happened.
        - id: ch01-b97
          speaker: philip
          text: >-
            Oh, what am I going to do? What can I do?
          emotion: fearful
        - id: ch01-b98
          speaker: narrator
          text: >-
            No one was there to answer.
        - id: ch01-b99
          speaker: philip
          text: >-
            If only I could get into the city again. But that hateful nurse pulled it apart and locked the nursery. I can't even rebuild it. What am I going to do?
          emotion: sad
        - id: ch01-b100
          speaker: narrator
          text: >-
            He began to cry. Now he was sure the dream had not been a dream. He had entered the magic city, promised to stand by Lucy, and then betrayed both Lucy and his promise.
        - id: ch01-b101
          speaker: narrator
          text: >-
            Still holding Mr. Noah, Philip rubbed his eyes with his knuckles and, rather painfully, with the wooden figure too.
        - id: ch01-b102
          speaker: philip
          text: >-
            What shall I do?
          emotion: sad
        - id: ch01-b103
          speaker: mr_noah
          text: >-
            Put me down.
        - id: ch01-b104
          speaker: philip
          text: >-
            What was that?
        - id: ch01-b105
          speaker: mr_noah
          text: >-
            Put me down.
        - id: ch01-b106
          speaker: narrator
          text: >-
            The voice was so tiny that Philip could barely hear it. Mr. Noah could hardly have spoken, but who else was there? Since stranger things had happened, Philip set him on the chess table. He stood there looking as wooden as ever.
        - id: ch01-b107
          speaker: philip
          text: >-
            Put who down?
        - id: ch01-b108
          speaker: narrator
          text: >-
            Before Philip's eyes, the little figure came alive. Mr. Noah bent down, lifted the yellow wooden disc beneath his feet, rolled it like a mat, tucked it under one arm, and walked toward Philip's side of the table. Philip knelt to bring his ear closer.
        - id: ch01-b109
          speaker: philip
          text: >-
            What did you say?
        - id: ch01-b110
          speaker: mr_noah
          text: >-
            I asked what's wrong.
        - id: ch01-b111
          speaker: philip
          text: >-
            Lucy is lost, and it's my fault. I can hardly hear you. Trying to listen hurts my ears.
          emotion: sad
        - id: ch01-b112
          speaker: mr_noah
          text: >-
            There's an ear trumpet in a box at the center of the cabinet. It belonged to a great-aunt. Fetch it and listen through that.
        - id: ch01-b113
          speaker: narrator
          text: >-
            Philip found the odd, curling thing. At first he did not know which end belonged at his ear. He tried both. On the second attempt, a large, strong voice came through.
        - id: ch01-b114
          speaker: mr_noah
          text: >-
            Much better.
        - id: ch01-b115
          speaker: philip
          text: >-
            Then last night wasn't a dream?
        - id: ch01-b116
          speaker: mr_noah
          text: >-
            Certainly not.
        - id: ch01-b117
          speaker: philip
          text: >-
            Where is Lucy, then?
        - id: ch01-b118
          speaker: mr_noah
          text: >-
            In the city, where you left her.
        - id: ch01-b119
          speaker: philip
          text: >-
            She can't be! The city was pulled apart. It's gone forever.
        - id: ch01-b120
          speaker: mr_noah
          text: >-
            The city you made in this room was pulled apart. The city you visited was not in this room. How could it have been?
        - id: ch01-b121
          speaker: philip
          text: >-
            It must have been here. Otherwise, how did I get inside it?
        - id: ch01-b122
          speaker: mr_noah
          text: >-
            That is a little difficult, I admit. You built those cities in two worlds. The city is gone in this world, but it continues in the other one.
        - id: ch01-b123
          speaker: philip
          text: >-
            I don't understand.
        - id: ch01-b124
          speaker: mr_noah
          text: >-
            I didn't expect you to. It is true all the same. Whatever people make in that other world lasts forever.
        - id: ch01-b125
          speaker: philip
          text: >-
            But how did I get there?
        - id: ch01-b126
          speaker: mr_noah
          text: >-
            You belong to both worlds, and you built the cities. That made them yours.
        - id: ch01-b127
          speaker: philip
          text: >-
            Lucy got in too.
        - id: ch01-b128
          speaker: mr_noah
          text: >-
            She rebuilt a corner of your city after the nurse knocked it down.
        - id: ch01-b129
          speaker: philip
          text: >-
            But you're standing here. You can't be in the city as well.
        - id: ch01-b130
          speaker: mr_noah
          text: >-
            Yet I am there.
        - id: ch01-b131
          speaker: philip
          text: >-
            You're alive here. What brought you to life?
        - id: ch01-b132
          speaker: mr_noah
          text: >-
            Your tears. Tears are powerful magic. No, don't start crying again. What's wrong now?
        - id: ch01-b133
          speaker: philip
          text: >-
            I want to go back to the city.
        - id: ch01-b134
          speaker: mr_noah
          text: >-
            It is dangerous.
        - id: ch01-b135
          speaker: philip
          text: >-
            I don't care.
        - id: ch01-b136
          speaker: mr_noah
          text: >-
            You seemed very glad to escape.
        - id: ch01-b137
          speaker: philip
          text: >-
            I know. That's the worst part. Isn't there any way back? Could I climb through the nursery window, get the bricks, and rebuild—
        - id: ch01-b138
          speaker: mr_noah
          text: >-
            You needn't do any of that. The city has a thousand doors.
        - id: ch01-b139
          speaker: philip
          text: >-
            I wish I could find just one. And I thought time worked differently there. If time doesn't count, how can Lucy have been lost so long?
        - id: ch01-b140
          speaker: mr_noah
          text: >-
            Time counts now. When you ran away and left Lucy, you set the city's clocks to the time of this world.
        - id: ch01-b141
          speaker: philip
          text: >-
            I still don't understand, but never mind. Show me a door. I'll go back and find her.
        - id: ch01-b142
          speaker: mr_noah
          text: >-
            Build something and pass through it. That's all. Your tears have dried on me now. Goodbye.
        - id: ch01-b143
          speaker: narrator
          text: >-
            Mr. Noah took the rolled yellow disc from beneath his arm and spread it flat on the table like a little mat. The moment he stepped onto it, all life left him. Once again, he was nothing but a small wooden figure from Noah's Ark. Philip let the ear trumpet fall and stood staring down at him.
        - id: ch01-b144
          speaker: philip
          text: >-
            I don't understand.
        - id: ch01-b145
          speaker: narrator
          text: >-
            He understood one thing. The telegram would bring Helen home, and before she arrived, he had to enter the other world and find Lucy.
        - id: ch01-b146
          speaker: philip
          text: >-
            But what if I can't find her? Why did I build the cities so big? Time will keep passing. Helen may come home and find me lost as well as Lucy.
          emotion: fearful
        - id: ch01-b147
          speaker: narrator
          text: >-
            Philip wiped his eyes and reminded himself that heroes did not behave this way. Whether he was afraid or not, he must build another entrance. No matter how he considered it, there was not a moment to waste. And at any moment the nurse might come into the room and catch him.
        - id: ch01-b148
          speaker: narrator
          text: >-
            Philip looked around the drawing room for anything he could build with. The chess table seemed promising. Its long, narrow legs were set around it in a way that made them look almost like arches. He could add books from the shelves, the tall candlesticks, and the Japanese vases. Together they might make the kind of building he needed.
        - id: ch01-b149
          speaker: narrator
          text: >-
            Philip set to work. He placed every piece with serious care, but his hands moved as quickly as he could make them. If the nurse came in before he had made a door and passed through it, she would be quite capable of sending him straight to bed. Building from bed, of course, would be impossible. Before long, the new structure was finished. Philip had made a building and a doorway. There was only one problem. He was much too large to go through it.
        - id: ch01-b150
          speaker: narrator
          text: >-
            He stood helplessly before the tiny entrance. Tears pricked behind his eyelids and began to swell. One tear escaped and landed on the back of his hand. Then Mr. Noah's words returned to him. Tears were powerful magic. The thought stopped the rest before they could fall. Still, he had that single tear shining on his hand. Very carefully, Philip rubbed it against one of the pillars of the little porch.
        - id: ch01-b151
          speaker: narrator
          text: >-
            At once, a strange, thin tightness swept through him. He grew dizzy and closed his eyes. His boots shuffled on the carpet. Yet was it still carpet? It felt very thick.
        - id: ch01-b152
          speaker: narrator
          text: >-
            Philip opened his eyes. Once again, his feet stood in the long grass of the endless prairie. Before him towered the enormous porch of a vast building, with a domino path leading to it.
        - id: ch01-b153
          speaker: philip
          text: >-
            Oh, I'm so glad! I couldn't have borne it if Lucy had been lost forever because of me.
          emotion: happy
        - id: ch01-b154
          speaker: narrator
          text: >-
            The gigantic porch frowned above him. What waited on its other side?
        - id: ch01-b155
          speaker: philip
          text: >-
            I don't care. I have to go. If I can't be a hero, I'll try to act like one.
        - id: ch01-b156
          speaker: narrator
          text: >-
            He stepped forward bravely, stumbling a little in the thick grass, and the dark shadow of the porch took him in.
        - id: ch01-b157
          speaker: narrator
          text: >-
            A little later, back in the ordinary world, the nurse entered the drawing room and found Philip's new building.
        - id: ch01-b158
          speaker: nurse
          text: >-
            Bother that child! He's been at his precious building game again. I'll teach him a lesson for this, and one he won't soon forget.
          emotion: angry
        - id: ch01-b159
          speaker: narrator
          text: >-
            She searched the house for the bold builder. Then she searched the garden. Half an hour later, she rushed into the servants' hall and dropped into a chair.
        - id: ch01-b160
          speaker: nurse
          text: >-
            I don't care what happens now. This house must be bewitched. The moment I've eaten dinner, I'm leaving.
        - id: ch01-b161
          speaker: cook
          text: >-
            What's happened this time?
        - id: ch01-b162
          speaker: nurse
          text: >-
            Happened? Why, nothing at all. Everything is lovely and exactly as it ought to be.
        - id: ch01-b163
          speaker: cook
          text: >-
            Lucy still hasn't been found, of course. But that's all, isn't it?
        - id: ch01-b164
          speaker: nurse
          text: >-
            All? That ought to be enough. But no, it isn't all. The boy is lost now. I am not joking. He's disappeared just like Lucy, and I am taking the two thirty-seven train. I don't care who knows it.
        - id: ch01-b165
          speaker: cook
          text: >-
            Lord above!
          emotion: surprised
        - id: ch01-b166
          speaker: narrator
          text: >-
            Before leaving for the two thirty-seven train, the nurse returned to the drawing room. She meant to destroy Philip's building and put its books, candlesticks, vases, and chessmen back where they belonged.
        - id: ch01-b167
          speaker: narrator
          text: >-
            And there we will leave her.
