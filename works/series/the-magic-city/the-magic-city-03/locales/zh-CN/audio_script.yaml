audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖沉着，带一点机敏的幽默
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中
    philip:
      display_name: 菲利普
      tts:
        delivery: 直率敏感，想象丰富，情绪来得快
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    judge_noah:
      display_name: 诺亚先生
      tts:
        delivery: 一本正经又怕麻烦，古板中带着滑稽
        timbre: 苍老清晰
        pace: 稍慢
        pitch: 中
    nurse:
      display_name: 保姆
      tts:
        delivery: 严厉刻板，遇事容易焦躁抱怨
        timbre: 尖亮结实
        pace: 偏快
        pitch: 中高
    cook:
      display_name: 厨娘
      tts:
        delivery: 直爽多话，关切中带着夸张
        timbre: 浑厚明亮
        pace: 适中
        pitch: 中
    coachman:
      display_name: 车夫
      tts:
        delivery: 实在爽直，说话简短有力
        timbre: 粗厚响亮
        pace: 适中
        pitch: 中低
    groom:
      display_name: 马夫乔治
      tts:
        delivery: 干练随便，偶尔不耐烦地嘟囔
        timbre: 年轻低沉
        pace: 稍快
        pitch: 中低
  chapters:
    - id: ch01
      title: 迷失
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            菲利普睡着后，梦见自己又回了家。海伦来到床边叫他起床，手里还牵着一匹专门送给他的白色小马。那匹马一看就聪明得什么都会，所以它伸出蹄子跟菲利普握手时，他一点也不吃惊。可小马忽然开口，说他们该动身了。接着，它竟想把菲利普的鞋和袜子套到自己的腿上。
        - id: ch01-b02
          speaker: philip
          text: 喂，别这么干！
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: >-
            他这一叫，便醒了。阳光已经照满房间，白色小马却一匹也没有。
        - id: ch01-b04
          speaker: philip
          text: 唉，那就起来吧。
        - id: ch01-b05
          speaker: narrator
          text: >-
            他拿起新银表。这是海伦临走前送他的礼物之一。表上已经十点钟了。
        - id: ch01-b06
          speaker: philip
          text: 你说得不对吧？再好好想想。
        - id: ch01-b07
          speaker: narrator
          text: >-
            菲利普摇了摇表，可银表还是清清楚楚地指着十点。庄园八点吃早饭，他敢肯定没有人来叫过自己。
        - id: ch01-b08
          speaker: philip
          text: 真奇怪。一定是表坏了，也许停了。
        - id: ch01-b09
          speaker: narrator
          text: >-
            可表还在走。早饭真的已经过去两个钟头了。菲利普一想到这件事，立刻觉得饿极了，赶忙下床。
        - id: ch01-b10
          speaker: narrator
          text: >-
            四周一个人也没有，他便独自去了浴室，痛痛快快地玩了整整一个钟头。热水、冷水、棕色温莎香皂、剃须皂、指甲刷、沐浴刷、丝瓜络、淋浴，还有三块海绵，他一样也没放过。平时他从没来得及把这些东西研究透，今天没人管，他玩得太快活，连没人叫醒他的怪事都忘了。
        - id: ch01-b11
          speaker: narrator
          text: >-
            菲利普想起海伦写过一首洗澡诗。他仰面躺进烫得要命的水里，一点一点回想。等他终于把诗全想起来，水也差不多凉了。诗的名字叫《巨人一生的梦》。
        - id: ch01-b12
          speaker: narrator
          text: >-
            很久以前，我是什么模样？回头望去，我看见从前的自己。岁月过去，我们变了这么多，眼前那个人真的是我吗？至于这里的语法，就别管了。
        - id: ch01-b13
          speaker: narrator
          text: >-
            那时我像巨人一样高大威风，站在白色峭壁上，头顶是幽暗的树林。脚下有一片可爱的海湾，平展、明亮，闪着水光。白崖围住海湾，温暖的空气里没有风，它就那样安静地睡着。
        - id: ch01-b14
          speaker: narrator
          text: >-
            我独自站在那里，赤裸、强壮又挺拔，手脚在纯净的金光里闪亮。脚下整片水域都在等待，等的正是我。这一句的语法没有错，不过也别去管它。
        - id: ch01-b15
          speaker: narrator
          text: >-
            我俯下身，纵身跳进水里，浪花泼了满身。小小的一片海中，躺着一个巨人。白崖从四面围拢过来，崖顶的树林像一顶王冠。我躺在那里，看遍落日的灿烂光辉。没有一丝风来搅动我的海，阳光照下来，像是穿过一扇金色的玻璃窗。
        - id: ch01-b16
          speaker: narrator
          text: >-
            白崖高高耸立在身旁，海水清澈、纯净、深广。白崖、海水，还有落在身上的金光，全由我这个主人掌管。几英里外，我的两只巨脚像礁石一样伸出平静的海面。脚上尽可以修一座灯塔，好告诉过往的船只，这条航路可不能走。
        - id: ch01-b17
          speaker: narrator
          text: >-
            峭壁围住的海都属于我。我两手一拍，浪花就越过身边，在身体的小窝里积成一汪汪岩池，正好给小海兽游玩。我找到一条甲板有孔的船，把它放进水里，让它去迎战命运的风浪。羊毛做的船帆映着天空，象牙桅杆把它高高撑起。
        - id: ch01-b18
          speaker: narrator
          text: >-
            又有一条威风凛凛的船驶来，甲板上竖着一千支长枪。我把它也放下去，它凶猛又飞快地冲向那条象牙桅杆的船。羊毛船帆，带孔的甲板，两条船轰然相撞，一起沉进海底。
        - id: ch01-b19
          speaker: narrator
          text: >-
            波浪下面，我快活地伸手追赶。一只棕色海鼠从幻想出来的沙底飞快溜走。每一次，它都逃进我膝弯下面那座幽深的洞穴。最后，我总算把它捉住，让它乖乖待在我没入水中的胸膛浅滩上。
        - id: ch01-b20
          speaker: narrator
          text: >-
            我躺在又暖又软的甜美水中，仿佛被温柔的手臂抱着。忽然，遥远而看不见的岸上传来一声大喊，我立刻不再是巨人了。
        - id: ch01-b21
          speaker: nurse
          text: >-
            出来，快出来！你已经泡了整整一刻钟，水都凉了。快点，菲普少爷。脑袋湿淋淋的，也该上床睡觉了。
        - id: ch01-b22
          speaker: narrator
          text: >-
            我湿淋淋地离开魔法海洋，把听命于我的船只全都抛下。带孔甲板原来是肥皂碟，冲过去撞船的是指甲刷，绒布成了帆，牙刷成了桅杆，滑溜溜的肥皂则是那只海鼠。
        - id: ch01-b23
          speaker: narrator
          text: >-
            我哭着走出魔法海洋，因为擦干身体的时候到了。我得告别做巨人的壮丽欢喜，上床去，重新变成一个洗得干干净净的小男孩。
        - id: ch01-b24
          speaker: narrator
          text: >-
            一字不漏地想完这首诗，菲利普又冲了一次淋浴。他从暖柜里拿出一条又热又粗糙的毛巾，舒舒服服地擦干身体，回房穿衣。这时，他深深感到自己有多需要一顿早饭，便用最快的速度穿戴起来，连靴带也忘了系。他忙乱中把领扣掉到地上，弯腰去捡时，才第一次想起刚才那个梦。那梦的确值得停下来好好琢磨。
        - id: ch01-b25
          speaker: narrator
          text: >-
            可眼下还是早饭最要紧。他实在太饿了，马上下楼。
        - id: ch01-b26
          speaker: philip
          text: 我一下楼就要早饭。碰见谁，就问谁要。
        - id: ch01-b27
          speaker: narrator
          text: >-
            然而，他一个人也没碰见。楼梯、大厅、饭厅、客厅、书房和台球室里全都没人，育儿室的门还锁着。他穿过呢绒门去找佣人。厨房、佣人饭厅、配膳室、洗碗间、洗衣房、食品储藏室，也处处空着。
        - id: ch01-b28
          speaker: narrator
          text: >-
            庄园从正面看不出多大，后面却伸着两条长长的侧翼，里面大得很。可这么大的宅子里，除了菲利普，一个人也没有。他明明已经知道答案，还是跑上楼，把所有卧室、小画廊、音乐室、佣人卧室，连最高的阁楼都仔细找了一遍。阁楼里的东西其实很有趣，不过那是他后来才想起来的。眼下，他根本顾不上多看一眼。
        - id: ch01-b29
          speaker: narrator
          text: >-
            此刻，他一步跨过三级台阶，飞奔下楼。一路上的房门都跟他离开时一样敞开着。不知为什么，那些敞开的门比什么都吓人。他沿着走廊飞跑，又冲下几段楼梯，掠过一扇又一扇敞开的门，从后厨房跑到屋外。随后，他沿着砖墙旁长满青苔的小径，绕过三棵紫杉和上马石，一路来到马厩院子。
        - id: ch01-b30
          speaker: narrator
          text: >-
            那里仍然没人。车夫、马夫、马厩小厮一个都不见，马厩、车房、马具房和草料阁楼也是空的。菲利普不敢再回屋。他觉得一定出了可怕的事。会不会有人需要庄园里的佣人，便把他们全绑走了？可他一想到保姆，又觉得至少没人能绑走她。
        - id: ch01-b31
          speaker: narrator
          text: >-
            也许是魔法，就像睡美人的故事。只是这一次，大家没有沉睡一百年，而是全都消失了。想到这里时，菲利普正独自站在马厩院子中央。
        - id: ch01-b32
          speaker: philip
          text: >-
            也许他们只是变得看不见了。说不定所有人都在这里，看着我，拿我取笑。
        - id: ch01-b33
          speaker: narrator
          text: >-
            他一动不动地想了一会儿。这个念头可不舒服。忽然，他挺直小小的脊背，昂起头来。
        - id: ch01-b34
          speaker: philip
          text: 不管怎么说，不能让他们看出我害怕。
        - id: ch01-b35
          speaker: narrator
          text: 菲利普随即想起了食品储藏室，故意放大声音，让周围那些看不见的人都听清。
        - id: ch01-b36
          speaker: philip
          text: >-
            我还没吃早饭。我应该吃早饭。既然没人给我，那我只好自己拿。
        - id: ch01-b37
          speaker: narrator
          text: >-
            他等了等，没有任何回答。院子里静得很，只有缰绳环撞上食槽的哐啷声、马蹄踏石地的声音、鸽子的咕咕声，还有散养马厩里干草的窸窣声。
        - id: ch01-b38
          speaker: philip
          text: >-
            很好。既然不知道你们觉得我该吃什么，我就挑自己觉得该吃的。
        - id: ch01-b39
          speaker: narrator
          text: >-
            他深吸一口气，像是要把勇气也吸进胸口，又把肩膀挺得比刚才更像军人，大步走回屋里，直奔食品储藏室。他认真挑出自己认为早饭应该有的东西。那是一只樱桃派、两份杯装蛋奶冻、一根冷香肠、两片冷烤面包、一块奶酪、两只柠檬乳酪小饼、仅剩的一只果酱小馅饼，还有一小块黄油。
        - id: ch01-b40
          speaker: philip
          text: >-
            原来佣人吃得这么好！我以前还以为这里除了羊肉和米饭，什么也不长呢。
        - id: ch01-b41
          speaker: narrator
          text: >-
            菲利普把食物全放进银托盘，端到宅邸两翼之间的露台上。他回去找牛奶，却怎么也找不到，只好拿白瓷壶装了清水。勺子也没有，他只找到一把切肉叉和一把分鱼铲。你用分鱼铲吃过樱桃派吗？
        - id: ch01-b42
          speaker: philip
          text: >-
            不管出了什么事，也不管接下来还会怎样，先吃早饭总不会错。
        - id: ch01-b43
          speaker: narrator
          text: >-
            他嘴里嚼着樱桃派，用切肉叉扎起冷香肠，一口咬下足足一英寸。明亮的阳光照着露台，他一会儿挥舞分鱼铲，一会儿挥舞切肉叉。肚子慢慢不饿了，他的心思也重新转回那个梦。梦里的事情越来越像真的。或许那一切的确发生过。毕竟，魔法显然会发生。瞧，整幢宅子里的人都不见了，说不定全世界的人也已经不见了。
        - id: ch01-b44
          speaker: philip
          text: >-
            要是全世界只剩下我，所有东西就都归我了。每家玩具店里的东西，我想拿什么都可以。
        - id: ch01-b45
          speaker: narrator
          text: 这个美妙的想法让他出神了一会儿。接着，他又想到另一件事。
        - id: ch01-b46
          speaker: philip
          text: >-
            可要是我也消失呢？也许我消失以后，就能看见那些已经消失的人。要怎样才能让自己消失？
        - id: ch01-b47
          speaker: narrator
          text: >-
            他屏住呼吸，拼命想把自己变没。你试过吗？这可一点也不容易。菲利普试了又试，仍然一点儿也没消失。他憋住的气越来越多，身体也越来越胀，简直再过一刻就要爆开了。没有别的办法，他只得把气全呼出来。
        - id: ch01-b48
          speaker: philip
          text: >-
            不行。我还是看得见自己，甚至比刚才更看得见。可是那个梦……
        - id: ch01-b49
          speaker: narrator
          text: >-
            他望了望剩下的樱桃派，一头潜进回忆深处，仿佛正在仙境的湖水里游泳。忽然，一阵人声把他从湖里钓了出来。低墙外那片碧绿的庄园草地上，一群人正从远处走来。
        - id: ch01-b50
          speaker: philip
          text: 原来不是所有人都消失了。
        - id: ch01-b51
          speaker: narrator
          text: >-
            菲利普抓起托盘端进屋，把它藏到配膳室的搁板下面。他还不知道来的是些什么人，凡事总得小心。随后，他走出去，把整个身子缩进红砖扶壁的阴影里。那些人的脚步和声音越来越近。大家都在抢着讲话，语气又急切又起劲，只要一听就知道，准是出了不同寻常的事。
        - id: ch01-b52
          speaker: narrator
          text: 他先听见一个人说：“没有。”
        - id: ch01-b53
          speaker: narrator
          text: 接着，另一个声音说：“我当然问过了。”
        - id: ch01-b54
          speaker: narrator
          text: 随后，他只听清了“警察”这个词。
        - id: ch01-b55
          speaker: narrator
          text: 又有人提到了“电报”。
        - id: ch01-b56
          speaker: narrator
          text: 一个声音急忙回答：“对，当然。”
        - id: ch01-b57
          speaker: narrator
          text: 最后，他听见一句：“最好弄个确实。”
        - id: ch01-b58
          speaker: narrator
          text: >-
            接着，所有声音又混到了一起，菲利普什么也听不明白。他忙着躲藏，根本没看到刚才是谁在说话。不过，他倒有些高兴。现在总算真的出了事。
        - id: ch01-b59
          speaker: philip
          text: >-
            这下能想点别的了，不必一直想着保姆，还有那座被她拆掉的美丽城市。
        - id: ch01-b60
          speaker: narrator
          text: >-
            可到底出了什么事？他希望没有人受伤，也没有人干坏事。菲利普曾见过一个跟自己差不多大的男孩，被一个高大得多的警察沿路拖走。别人说，那男孩偷了一条面包。从此，“警察”这个词总让他难受。他忘不了那张脸。教堂祷告提到囚徒和被俘者时，他会想到那个男孩，提到孤苦无依和受压迫的人时，就更会想起他。
        - id: ch01-b61
          speaker: philip
          text: 希望不是那样的事。
        - id: ch01-b62
          speaker: narrator
          text: >-
            菲利普慢慢逼着自己离开扶壁，跟着已经走过身边的声音和脚步进了屋。
        - id: ch01-b63
          speaker: narrator
          text: >-
            声音把他领到厨房。厨娘坐在温莎扶手椅上流泪。厨房女仆帽子歪着，泪水沿脏兮兮的脸颊往下淌。车夫的脸涨得通红，马夫连绑腿也没穿。保姆看着依旧整整齐齐，可菲利普仔细一看，她的大鞋和裙摆沾了泥，衣服还撕开一道三角形的大口子。他看了十分高兴。
        - id: ch01-b64
          speaker: coachman
          text: 就算给我二十镑，我也不愿碰上这种事。
        - id: ch01-b65
          speaker: nurse
          text: 乔治，去备一匹马。我来写电报。
        - id: ch01-b66
          speaker: coachman
          text: 骑薄荷糖最好，它跑得最快。
        - id: ch01-b67
          speaker: groom
          text: 这还用你说。
        - id: ch01-b68
          speaker: narrator
          text: >-
            马夫低声嘟囔着走了。菲利普觉得这话既没有礼貌，也莫名其妙。他站在门边，屋里没有一个人留意他。一阵激动从心里冒出来。那还不能真正叫作快活，却已经比别的任何感觉都更接近快活。每逢真有事情发生，我们常常都会有这样的感觉。可究竟出了什么事？到底是什么事？
        - id: ch01-b69
          speaker: nurse
          text: >-
            我真希望自己根本没回来。那样就没人能硬说是我的错了。
          emotion: sad
        - id: ch01-b70
          speaker: cook
          text: >-
            别人说什么不是要紧的，要紧的是事情已经发生了。老天爷，我宁愿被辞退，连品行证明都拿不到，也不愿出这种事。
          emotion: sad
        - id: ch01-b71
          speaker: nurse
          text: >-
            我现在什么都宁愿。哎哟，我真希望自己从来没出生过。
          emotion: sad
        - id: ch01-b72
          speaker: narrator
          text: >-
            就在菲利普惊讶地看着她时，保姆忽然像所有讨人喜欢的人那样哭了起来。
        - id: ch01-b73
          speaker: cook
          text: >-
            要是老爷没有出门，这件事绝不会发生。他是治安法官，吉卜赛人最怕他。只要他在家，这事就绝不会……
        - id: ch01-b74
          speaker: narrator
          text: 菲利普再也忍不住，忽然开口，把所有人都吓得一跳。
        - id: ch01-b75
          speaker: philip
          text: 只要怎样，就绝不会发生什么？
        - id: ch01-b76
          speaker: narrator
          text: 保姆止住眼泪，转身看他。
        - id: ch01-b77
          speaker: nurse
          text: >-
            噢，原来是你。我把你忘了。不管发生什么，你还是只惦记着早饭，对不对？
        - id: ch01-b78
          speaker: philip
          text: 我不想吃早饭。我只想知道到底出了什么事。
        - id: ch01-b79
          speaker: cook
          text: >-
            露西小姐走丢了，就是这么回事。现在你知道了。乖孩子，自己去玩吧。我们的麻烦已经够多，别再来添乱。
          emotion: sad
        - id: ch01-b80
          speaker: philip
          text: 走丢了？
          emotion: surprised
        - id: ch01-b81
          speaker: nurse
          text: >-
            对，她走丢了。照你以前对她的样子，我猜你现在一定很高兴。把嘴闭上，接下来二十四小时里，连呼吸声也别让我听见。我要去写电报。
          emotion: angry
        - id: ch01-b82
          speaker: narrator
          text: >-
            菲利普觉得，现在最好真的别让任何人听见自己呼吸。也正因为他屏息静气地站在那里，保姆把电报念给厨娘听时，每个字他都听得清清楚楚。
        - id: ch01-b83
          speaker: nurse
          text: >-
            彼得·格雷厄姆先生，布鲁塞尔，瓦格拉姆饭店。露西小姐失踪，请立即回家。菲尔金斯。这样写行吗？
        - id: ch01-b84
          speaker: cook
          text: >-
            你为什么要签菲尔金斯？你只是保姆。主人不在家，这里由我管事，我姓鲍勃森。
        - id: ch01-b85
          speaker: narrator
          text: 纸被刺啦一声撕了。
        - id: ch01-b86
          speaker: nurse
          text: >-
            好吧，已经撕掉了。签你的名字，我一样乐意。我才不想由自己来报这个坏消息。
        - id: ch01-b87
          speaker: cook
          text: 天哪，怎么会出这么可怕的事。可怜的小宝贝！
          emotion: sad
        - id: ch01-b88
          speaker: narrator
          text: >-
            于是，她们重新写了一封电报。保姆把电报拿到马厩院子里，薄荷糖已经备好鞍，在那里等着。
        - id: ch01-b89
          speaker: philip
          text: 我还以为露西跟姑妈在一起。
        - id: ch01-b90
          speaker: cook
          text: >-
            她昨天就回来了，在你上床以后。今天早上，那个保姆走进儿童卧室，露西已经不在了。床又空又冷，衣服也不见了。吉卜赛人进屋时怎么没惊醒那个保姆，我这一辈子也想不通。她一定睡得像头猪。
        - id: ch01-b91
          speaker: coachman
          text: 或者像那七个沉睡者。
        - id: ch01-b92
          speaker: philip
          text: 可吉卜赛人为什么要抓她？
        - id: ch01-b93
          speaker: cook
          text: >-
            吉卜赛人抓人，还能为了什么？看看那些被偷走的继承人吧。英国有爵位的人家，哪一家没在什么时候丢过继承人？
        - id: ch01-b94
          speaker: philip
          text: 你们一定已经把整幢房子都找遍了吧？
        - id: ch01-b95
          speaker: cook
          text: >-
            你当我们又聋又哑，又瞎又傻吗？保姆回来了。菲利普少爷，快走吧，除非你想挨她一顿臭骂。
        - id: ch01-b96
          speaker: narrator
          text: >-
            厨娘刚说完，菲利普就真的走了。他进了长长的客厅，随手关上门，从布勒镶嵌柜里取出一枚枚象牙棋子，摆到那张漂亮的棋桌上。棋盘上的方格由珍珠母和象牙拼成。他试着自己跟自己下一盘，让右手跟左手较量。可右手执白棋，能够先走一步，所以获胜的总是右手。
        - id: ch01-b97
          speaker: narrator
          text: >-
            过了一会儿，他不下了，把棋子逐一收回去。接着，他翻开一本收集名画照片的大书，却觉得每幅画都没意思。他又拿出象牙挑棒，可双手一直发抖。手一抖，当然玩不了挑棒。
        - id: ch01-b98
          speaker: narrator
          text: >-
            在棋子、图画和挑棒后面，菲利普始终竭力躲着那个梦。他不肯去想自己怎样爬上其实是码尺的梯阶，怎样走进桌面上的城市。只要一开始回想，他就又内疚，又难受。
        - id: ch01-b99
          speaker: narrator
          text: >-
            菲利普走到窗前。那股不肯被想起的念头让他的靴子也焦躁起来。两只脚不停挪动，右靴忽然踢到窗帘褶皱里的一个硬东西。他弯腰捡起来，原来是小小的诺亚先生。保姆收拾城市时，一定把他掉在了这里。
        - id: ch01-b100
          speaker: narrator
          text: >-
            菲利普看着那张木头脸，再也没法不去想那个梦。他索性任由回忆涌来，回忆便像洪水一样淹没了他。连同回忆一起涌来的，还有他做过的事。他答应过要做露西高尚的朋友。他们一起奔逃，躲避飞驰而来的士兵，可他跑得比露西快。到了那座梯子，那条逃生梯的顶端，他没有停下来等她。
        - id: ch01-b101
          speaker: philip
          text: >-
            老故事里的英雄一定会等她，让她先下去。绅士会等，普通人也会等，更别说英雄了。可我只顾着往下冲，把她忘得干干净净。我把她丢在那里了。
          emotion: sad
        - id: ch01-b102
          speaker: narrator
          text: 悔恨让他的靴子比刚才动得更厉害。
        - id: ch01-b103
          speaker: philip
          text: 可那不过是一场梦。
        - id: ch01-b104
          speaker: narrator
          text: 可悔恨终于有机会说出菲利普一直知道它迟早会说的话。
        - id: ch01-b105
          speaker: philip
          text: >-
            要是那不是梦呢？要是那一切都是真的呢？如果我真的把这位高尚的朋友丢在那里，她会不会正因为这样才失踪？
          emotion: fearful
        - id: ch01-b106
          speaker: narrator
          text: >-
            菲利普忽然觉得自己又小又凄凉，孤零零地留在世上。不过，电报会把海伦叫回来。可海伦回来以后，他必须告诉她，这件事也许是自己的错。他白费力气地告诉自己，海伦不会相信魔法城。心里却知道，她会相信。她懂童话，也读过《一千零一夜》，会知道这些事的确会发生。
        - id: ch01-b107
          speaker: philip
          text: 噢，我该怎么办？到底该怎么办？
          emotion: sad
        - id: ch01-b108
          speaker: narrator
          text: 没有人能回答他。
        - id: ch01-b109
          speaker: philip
          text: >-
            要是能回到城里就好了。可那个可恶的保姆拆掉了整座城，还锁上育儿室。我连重新搭都办不到。噢，我该怎么办？
          emotion: sad
        - id: ch01-b110
          speaker: narrator
          text: >-
            菲利普哭了。他现在确信那并不是梦。他真的去过魔法城，真的答应帮助露西，也真的背叛了诺言，辜负了她。他用指关节擦眼睛，手里还握着诺亚先生，于是也拿木头小人擦了一下。这一下擦得挺疼。
        - id: ch01-b111
          speaker: philip
          text: 我该怎么办？
          emotion: sad
        - id: ch01-b112
          speaker: judge_noah
          text: 把我放下。
        - id: ch01-b113
          speaker: philip
          text: 咦？
          emotion: surprised
        - id: ch01-b114
          speaker: judge_noah
          text: 把我放下。
        - id: ch01-b115
          speaker: narrator
          text: >-
            那声音极小，细得不能再细，菲利普勉强才能听见。声音似乎不大可能属于诺亚先生，可除了他，还能是谁？也许真是他在说话。尽管不大可能，可更不可能的事以前也发生过。菲利普抱着这一点点希望，把木头小人放到棋桌上。他站在那里，仍旧是一副十足的木头模样。
        - id: ch01-b116
          speaker: philip
          text: 把谁放下？
        - id: ch01-b117
          speaker: narrator
          text: >-
            就在菲利普眼前，小木头人活了过来。他弯腰捡起脚下的黄色木圆盘。诺亚方舟里的小人都站在这样的圆盘上。他把圆盘像席子一样卷起，夹到胳膊下，朝桌边的菲利普走来。菲利普跪下，把耳朵凑近这个会动的小活物。
        - id: ch01-b118
          speaker: philip
          text: 您刚才说什么？
        - id: ch01-b119
          speaker: judge_noah
          text: 我问你出了什么事。
        - id: ch01-b120
          speaker: philip
          text: >-
            是露西。她失踪了，都是我的错。还有，您的声音实在太小。我勉强才能听见，耳朵都听疼了。
          emotion: sad
        - id: ch01-b121
          speaker: judge_noah
          text: >-
            柜子中间有个盒子，里面装着一只姑婆留下来的助听号筒。把它拿出来，隔着号筒听。
        - id: ch01-b122
          speaker: narrator
          text: >-
            菲利普从柜子里取出号筒。那东西弯弯曲曲，样子十分古怪，他一开始拿不准究竟哪一头该放在耳边。他把两头都认真试了一遍。试到第二次时，一个相当响亮、结实、洪大的声音传进了耳朵。
        - id: ch01-b123
          speaker: judge_noah
          text: 这样好多了。
        - id: ch01-b124
          speaker: philip
          text: 那么，昨晚发生的事不是梦？
        - id: ch01-b125
          speaker: judge_noah
          text: 当然不是。
        - id: ch01-b126
          speaker: philip
          text: 露西在哪里？
        - id: ch01-b127
          speaker: judge_noah
          text: 当然还在城里，就在你丢下她的地方。
        - id: ch01-b128
          speaker: philip
          text: >-
            她不可能还在那里。那座城已经被全部拆掉，永远不见了。
          emotion: sad
        - id: ch01-b129
          speaker: judge_noah
          text: >-
            被拆掉的是你在这间屋里搭的城。你去过的城并不在这间屋里。想一想，它怎么可能装在这里？
        - id: ch01-b130
          speaker: philip
          text: 可那座城明明就在这里。不然我怎么进去？
        - id: ch01-b131
          speaker: judge_noah
          text: >-
            我承认，这事不太好懂。你搭那些城市时，其实把它们搭在了两个世界里。这个世界里的城拆掉了，另一个世界里的城还在。
        - id: ch01-b132
          speaker: philip
          text: 我还是不明白。
        - id: ch01-b133
          speaker: judge_noah
          text: >-
            我早就猜到了。但事情就是这样。人们在那个世界创造出来的东西，会一直存在下去。
        - id: ch01-b134
          speaker: philip
          text: 那我怎么能进去？
        - id: ch01-b135
          speaker: judge_noah
          text: >-
            因为你属于两个世界。再说，城市是你搭的，所以那些城市属于你。
        - id: ch01-b136
          speaker: philip
          text: 可露西也进去了。
        - id: ch01-b137
          speaker: judge_noah
          text: 保姆撞坏了城市的一角，是露西重新搭好的。
        - id: ch01-b138
          speaker: philip
          text: >-
            那您呢？您现在在这里，就不能同时也在那里呀。
        - id: ch01-b139
          speaker: judge_noah
          text: 可我的确也在那里。
        - id: ch01-b140
          speaker: philip
          text: >-
            但您现在在这里，还活过来了。到底是什么让您活过来的？
        - id: ch01-b141
          speaker: judge_noah
          text: >-
            是你的眼泪。眼泪是一种很强的魔法。不，别再哭了。你又怎么了？
        - id: ch01-b142
          speaker: philip
          text: 我想回到城里去。
        - id: ch01-b143
          speaker: judge_noah
          text: 那会很危险。
        - id: ch01-b144
          speaker: philip
          text: 我不在乎。
        - id: ch01-b145
          speaker: judge_noah
          text: 你逃出来的时候，倒是挺高兴。
        - id: ch01-b146
          speaker: philip
          text: >-
            我知道，这正是最糟糕的事。难道真的没有办法回去？要是我从育儿室窗户爬进去，找到砖块，把城重新搭起来，再……
          emotion: sad
        - id: ch01-b147
          speaker: judge_noah
          text: >-
            根本不必这样，我可以保证。通往那座城的门足足有一千扇。
        - id: ch01-b148
          speaker: philip
          text: >-
            我只要找到其中一扇就够了。可是，请您听我说。城里的时间明明跟这里不同，既然时间不作数，露西为什么会一直失踪到现在？
        - id: ch01-b149
          speaker: judge_noah
          text: >-
            时间现在作数了。你逃走，把露西丢在那里时，时间就开始走了。是你把城里的钟拨到了这个世界的时间。
        - id: ch01-b150
          speaker: philip
          text: >-
            我听不懂，不过这不重要。请告诉我门在哪里，我要回去找露西。
        - id: ch01-b151
          speaker: judge_noah
          text: >-
            搭出一样东西，再从它中间穿过去，就是这么简单。你滴在我身上的眼泪已经干了。再见。
        - id: ch01-b152
          speaker: narrator
          text: >-
            诺亚先生铺开黄色小席，站回上面，又变成一个小小的木头人。菲利普丢下助听号筒，望着他。
        - id: ch01-b153
          speaker: philip
          text: 我还是没明白。
        - id: ch01-b154
          speaker: narrator
          text: >-
            不过，他至少明白了一件事。海伦收到电报就会回来。在她回来以前，他必须进入另一个世界，把失踪的露西找回来。
        - id: ch01-b155
          speaker: philip
          text: >-
            可要是我找不到她呢？真希望当初没把那些城搭得那么大。时间一直往前走，也许海伦回来时，会发现我也跟露西一样失踪了。
          emotion: fearful
        - id: ch01-b156
          speaker: narrator
          text: >-
            菲利普擦干眼睛，告诉自己，英雄不会因为这件事停下来。他必须重新搭建，一点时间也不能浪费，保姆随时都可能进来。
        - id: ch01-b157
          speaker: narrator
          text: >-
            他环顾客厅，寻找能用的材料。棋桌的桌面由一根根细长的腿围着，看起来很像拱门。要是再加上书本、烛台和日本花瓶，也许真能搭出点名堂。
        - id: ch01-b158
          speaker: narrator
          text: >-
            他果然搭出了名堂。菲利普搭得专心又仔细，动作也相当快。他担心保姆会在自己造好门、从门里穿过去以前闯进来。要是她发现他又开始搭东西，她完全干得出把他塞到床里的事。可一个人只要躺在床上，当然就什么东西也搭不了了。
        - id: ch01-b159
          speaker: narrator
          text: >-
            不久，一座建筑就搭好了。可菲利普怎么进去呢？他的大小根本不对。他束手无策地站着，泪水又刺痛眼睛，一点点聚在眼皮后面。终于，一滴眼泪落到手上。
        - id: ch01-b160
          speaker: narrator
          text: >-
            诺亚先生说过，眼泪是很强的魔法。这个念头让菲利普止住眼泪，可手上的那一滴已经落下来了。他把它抹到门廊的一根柱子上。
        - id: ch01-b161
          speaker: narrator
          text: >-
            一刹那，一种又紧又薄的古怪感觉席卷全身。菲利普一阵头晕目眩，只好闭上眼睛。那双总跟他一条心的靴子在地毯上挪了挪。可脚下真的是地毯吗？那里厚厚的，而且还有些奇怪。菲利普睁开眼睛。他的双脚又一次踩进无边草原的长草里。眼前，一座庞大建筑的巨型门廊高耸入云，多米诺骨牌铺成的小路一直通向门下。
        - id: ch01-b162
          speaker: philip
          text: >-
            噢，我太高兴了！要是露西永远找不回来，而且全是我的错，我可受不了。
          emotion: happy
        - id: ch01-b163
          speaker: narrator
          text: >-
            巨大的门廊阴沉沉地悬在他头顶。门的另一边，会有什么等着他？
        - id: ch01-b164
          speaker: philip
          text: >-
            我不在乎，非去不可。就算我成不了英雄，也要试着做出英雄会做的事。
        - id: ch01-b165
          speaker: narrator
          text: >-
            菲利普勇敢地向前走去。他在浓密的草丛里轻轻绊了一下，随后便被门廊幽暗的阴影吞没了。
        - id: ch01-b166
          speaker: narrator
          text: 过了一会儿，保姆走进客厅。
        - id: ch01-b167
          speaker: nurse
          text: >-
            这个讨厌的孩子，又玩起那套宝贝搭建游戏了！这次我非得好好教训他，让他短时间里怎么也忘不了。
          emotion: angry
        - id: ch01-b168
          speaker: narrator
          text: >-
            她把整幢宅子找了一遍，一心要抓到那个胆大妄为的小建筑师，好给他一顿教训。接着，她又找遍了花园，目的还是一模一样。可是菲利普哪儿也不在。半小时后，保姆冲进佣人饭厅，一屁股跌坐在一把椅子上。
        - id: ch01-b169
          speaker: nurse
          text: >-
            现在不管再发生什么，我都不在乎。这房子一定中了邪。吃过午饭，我马上就走。
        - id: ch01-b170
          speaker: cook
          text: 现在又出了什么事？
        - id: ch01-b171
          speaker: nurse
          text: >-
            什么事？噢，什么事也没有。怎么可能有事呢？当然一切都好极了，美极了，就跟本来该有的一模一样。
        - id: ch01-b172
          speaker: cook
          text: 当然，只是露西小姐还没找到。只有这一件事，对吧？
        - id: ch01-b173
          speaker: nurse
          text: >-
            只有一件？一件已经够多了，可现在偏偏不只一件。那个男孩也不见了。我没有开玩笑。他跟露西一样失踪了。我要坐两点三十七分的火车离开，谁知道呢，反正我不在乎。
          emotion: angry
        - id: ch01-b174
          speaker: cook
          text: 老天爷！
          emotion: surprised
        - id: ch01-b175
          speaker: narrator
          text: >-
            出发去赶两点三十七分的火车以前，保姆又回到客厅。她拆掉菲利普的新建筑，把书本、烛台、花瓶和棋子一一放回原处。
        - id: ch01-b176
          speaker: narrator
          text: 我们就在这里同她告别吧。
