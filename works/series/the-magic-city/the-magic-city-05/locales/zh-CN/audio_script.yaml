  chapters:
    - id: ch01
      title: 木头宴席
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            白面纱揭开以后，公主原来就是露西。菲利普很不痛快，话说到一半便板起脸。诺亚先生却立刻宣布，公主和屠龙勇士该去用茶点了。他请所有人向后转，齐步出发。
        - id: ch01-b02
          speaker: philip
          text: 真是太糟了。我实在觉得……算了。
        - id: ch01-b03
          speaker: judge_noah
          text: 公主和勇士现在要去用茶点。诸位向后转，马上齐步走。
        - id: ch01-b04
          speaker: narrator
          text: >-
            菲利普和露西肩并肩走进队伍。连绵的焰火一刻不停，把整片黑夜照成金黄色。队伍脚下是一望无际的草原，草丛里开满粉红、蓝、黄、白各色花朵。菲利普在家里搭城时，许多建筑都放在客厅那张绿底彩花地毯上。如今，地毯的绿底成了真正的草，织在上面的花纹也长成了迎风开放的鲜花。这里有一条奇异的法则，总能把一样东西变成和它相似、却更大也真正活在这个世界里的东西。
        - id: ch01-b05
          speaker: narrator
          text: >-
            一路上谁也不开口。菲利普正在生闷气，而人在气头上，说什么都不会好听。他好不容易设法智取巨龙，又亲手杀了它，这样一场了不起的冒险，结尾却只是陪露西去喝茶，实在让他受不了。他还有别的理由不说话。露西心里有太多话，不知该从哪一句讲起，也清楚感觉得到菲利普正在生气。参加正式游行时交谈不合礼仪，所以整个人群也保持沉默。诺亚先生则没法一边走路一边讲话，否则很快就会喘不上气。毕竟，走路和说话这两件事，原本都不在他的设计用途里，更别说同时做了。
        - id: ch01-b06
          speaker: narrator
          text: >-
            这支安静的队伍终于穿过城门，走上灯火通明的街道。时间看着已经到了半夜，喝茶未免太晚，可每扇窗前和每条街道上方都挂满旗帜与花饰。菲利普猜着茶点会摆在哪里，反正不会还在监狱里。走进一座大广场后，他们看见一幢高楼。门前的彩灯比别处更多，照亮敞开的大门和铺着红毯的台阶。诺亚先生匆匆走上去，又转过身迎接两个孩子。
        - id: ch01-b07
          speaker: judge_noah
          text: >-
            我以波利斯托波利斯城不成器的代表身份，向最高贵的菲利普爵士、骑士兼屠龙勇士致意，也向他救出的公主致意。二位请进。
        - id: ch01-b08
          speaker: narrator
          text: >-
            他们走进一座以白银和象牙装饰的华丽大厅。诺亚先生弯下腰，问他们要不要先洗一洗，再稍微打扮一下，好去参加宴会。
        - id: ch01-b09
          speaker: philip
          text: 宴会？我还以为我们要喝茶。
        - id: ch01-b10
          speaker: judge_noah
          text: 先办正事，再享清福。先赴宴，后喝茶。更衣室在这边。门上的油漆还没干，当心些，我们来不及等它晾透。
        - id: ch01-b11
          speaker: narrator
          text: >-
            并排的两扇门上，一边新写着“骑士更衣室”，一边写着“公主更衣室”。油漆湿漉漉的，显然刚赶着写好。菲利普那间屋子的四面墙全是镜子，中央几张桌上放着各色奇装异服。鞋、长袜、帽子、王冠、铠甲、宝剑、斗篷、马裤、背心、短上衣，还有鼓囊囊的短裤，什么都有。隔壁敞开的门通往大理石浴室，浴池凹在地里，像古罗马皇后用的，也像如今有些模范住宅里的浴池。听说有人拿浴池装煤，可那实在没用，因为煤不管洗多少遍，也绝不会变白。
        - id: ch01-b12
          speaker: narrator
          text: >-
            菲利普脱掉衣服，泡进温暖清澈的水里。水隔着空气和白色大理石，泛出一层淡绿。他不明白，为什么泡澡这样舒服，用脸盆洗手洗脸却那么烦人。洗好以后，他穿回自己的衬衫和灯笼裤，绕着房间一圈圈地看。骑士去赴宴，该穿哪一套才真正合适呢？他犹豫了好一阵，最后选中一件柔软的小锁子甲。那一粒粒细钢环捧起来不过装满两只手，可新的难题马上来了，他根本不知道怎么把它套到身上。
        - id: ch01-b13
          speaker: philip
          text: 我不会穿这件锁子甲。宴会大概在等我，等久了准会发脾气。
        - id: ch01-b14
          speaker: narrator
          text: >-
            他正拿不定主意，忽然看到写着“男仆”的铃铛拉手。铃一响，门外便有人轻轻敲门。来人前后各挂着一块扁长方形，菲利普起初以为那是街头广告牌，再看才发现是两块多米诺骨牌。
        - id: ch01-b15
          speaker: philip
          text: 咦，我叫的是男仆。
        - id: ch01-b16
          speaker: double_six
          text: >-
            我不是男仆，是专门服侍真正贵客的司衣官。六六骨牌听候差遣，爵士。您选好衣服了吗？
        - id: ch01-b17
          speaker: philip
          text: 我想穿这件铠甲。骑士去赴宴，就该穿这个。
        - id: ch01-b18
          speaker: double_six
          text: >-
            完全正确，我赞同您的高见。先穿一件白色短袍，再把锁子甲扣在外面就行。我在这方面经验很丰富，您不可能选得更好了。您瞧，我是服装这门学问的行家，可以把全部心思都用在上面。至于我自己的衣服，法律已经规定好，永远不会随着时尚改变，所以我正好能腾出心来替别人琢磨。不过，您显然也很有自己的主见。
        - id: ch01-b19
          speaker: narrator
          text: >-
            六六骨牌给他穿上白色短袍，再扣好锁子甲。菲利普戴上锁子头巾，神气得活像十字军骑士。他走到门口，正遇见穿白色短裙、头戴珍珠冠的露西。
        - id: ch01-b20
          speaker: lucy
          text: 我一直都想当仙女。
        - id: ch01-b21
          speaker: philip
          text: 有人帮你穿衣服吗？
        - id: ch01-b22
          speaker: lucy
          text: 当然没有，我向来自己穿。
        - id: ch01-b23
          speaker: double_six
          text: 这一点上，女士们占了便宜。宴席已经摆好了。
        - id: ch01-b24
          speaker: narrator
          text: >-
            宴会厅里摆着三张长桌，两张贴着左右两边，一张横在前方高台上，就像学院餐厅里导师和尊贵来客坐的高桌。诺亚先生已经坐在正中，菲利普和露西分别坐到他两旁。桌上尽是看起来可口的食物，盛菜的盘子绘着菲利普熟悉的粉白花纹。他仔细一看，终于认出那正是姐姐旧玩偶屋里的彩绘木盘。奇怪的是，两个孩子面前都没有菜，只有一只空荡荡的大银碗。
        - id: ch01-b25
          speaker: narrator
          text: >-
            菲利普摸着刀叉，又认出了玩偶屋绿色银丝花纹餐具篮里的那套铅制小东西。他饿着肚子等候。穿笔直黄衣、戴红面具和红帽的仆人送来一盘漂亮的果冻。他刚拿铅勺去切，诺亚先生就急忙拦住他，问他难道从没吃过一顿靠假装的宴席。可勺子已经碰上果冻，硬得根本压不进去。菲利普只好做出盛取的动作，放到自己盘里的其实什么也没有。四周的客人全在做同样的事。第二道菜送来了，盘子根本没换。那是一只没切开的肥鹅，竟用胶牢牢粘在盘上。他终于明白，这整桌宴席都是玩具。
        - id: ch01-b26
          speaker: narrator
          text: >-
            你也许见过那种装在白纸盒里的玩具宴席。盒边是蓝的，碟子之间塞着细刨花，免得十二道木头菜互相碰坏。有形状漂亮的棕色火腿、两只身体模样比火腿逼真得多的烤鸡、真正做成舌头形状的亮汁牛舌，而不是罐头里圆滚滚的怪东西。还有一盘香肠、两条略带蓝色的鱼、红瘦白肥的牛肋排，以及晒得像中非旅行家一样古铜色的猪肉馅饼。甜品有模样漂亮的果冻、奶油冻、瑞士卷和葡萄干布丁，旁边还有芦笋、花椰菜，以及这个灰色世界里最绿的一盘豌豆。
        - id: ch01-b27
          speaker: narrator
          text: >-
            我小时候也有这么一盒全套宴席。可所有食物全是木头，菜和盘子又牢牢连成一块，实在让人沮丧，连假装都进行不下去。我们用保姆剪刀的尖头把一道道菜从盘上撬下来，可木头的本性始终无法征服。整只烤鸡卸下来以后，还是没法假装一口口吃掉，香肠也依旧是结实的一整块。舔一舔果冻，只能尝到胶水和油漆。我们又把两只鸡放到育儿室壁炉前，想把它们重新烤熟，结果木鸡一下烧起来，臭得像煤气厂和印度橡胶。好啦，我扯远了。人只要想起小时候发生的事情，真能没完没了地一直讲下去。这一大段本来放在括号里，你若不爱听，就当没听见吧。
        - id: ch01-b28
          speaker: narrator
          text: >-
            菲利普和露西眼前的正是这种牢牢粘在盘上的彩绘木头宴席，只是菜比我当年的更多。还有一只火鸡、八只覆盆子果酱馅饼、一个菠萝、一个甜瓜、一盘带壳牡蛎、一块煮咸肉和一条羊腿。每一道同样都是木头，同样不能入口。两个孩子越来越饿，只能垂头丧气地做足全套动作，还得装出吃得津津有味的样子。饮料盛在他们熟悉的小高脚杯里，两层玻璃之间封着红色液体，看着很像酒。他们倒不想喝酒，可如今不但饿，喉咙也渴得厉害。
        - id: ch01-b29
          speaker: narrator
          text: >-
            这顿宴会长得很，菲利普有足够的时间猜侍者究竟是什么东西。那些人穿着笔直的衣服，动作也直挺挺的，可他一时怎么也认不出来。直到看见一群侍者僵硬地并排站在大厅一端，他才猛然想起，有一回手边找不到别的居民，自己曾拿一根根火柴给一座城添过人口。所有木头菜终于传完以后，宴会又进入了演说的部分。
        - id: ch01-b30
          speaker: judge_noah
          text: >-
            朋友们，市民同胞们，菲利普爵士既勇敢又聪明，而且很可能果真就是我们的救星。
        - id: ch01-b31
          speaker: narrator
          text: >-
            后面的话，菲利普没怎么听。他只想着真正能吃的东西。全厅的人忽然起立欢呼，他才发现轮到自己演说了。他又发抖又难受，只得站起来。
        - id: ch01-b32
          speaker: philip
          text: 朋友们，市民同胞们，谢谢大家。我很想做救星，可我不知道自己能不能做到。
        - id: ch01-b33
          speaker: narrator
          text: >-
            他刚坐下，掌声便轰然响起。格栅楼座上传来音乐。随后诺亚先生俯过身，悄悄告诉两个孩子一个天大的好消息。
        - id: ch01-b34
          speaker: judge_noah
          text: 打起精神，宴会结束了。现在才是真的喝茶。
        - id: ch01-b35
          speaker: narrator
          text: >-
            真正的茶点原来是面包泡牛奶，摆在宴会厅旁一间铺着蓝绸的舒适小屋里。屋里只有他们三个人。即使用玩偶屋餐具篮里的铅勺，面包泡牛奶也还是很好吃。又过了很久，诺亚先生突然道了晚安。两个孩子吃得饱饱的，也困得迷迷糊糊。那种感觉叫什么，你可以去词典里查一查。菲利普睡进一张挂黄缎帘的金床，露西睡进一张挂白绸帘的银床。不过床是金是银，帘子是黄是白，都没妨碍他们沉沉睡去，一夜无梦。
    - id: ch02
      title: 早餐时的和解
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天早上，他们又在蓝房间里吃面包泡牛奶，这一次诺亚先生没来。露西从漂着白面包块的碗上抬起头。
        - id: ch02-b02
          speaker: lucy
          text: 你现在有没有比以前多喜欢我一点？
        - id: ch02-b03
          speaker: philip
          text: 没有。
        - id: ch02-b04
          speaker: narrator
          text: 菲利普答得又短又严厉，活像歌里那位船长。
        - id: ch02-b05
          speaker: lucy
          text: 真希望你会喜欢我。
        - id: ch02-b06
          speaker: philip
          text: >-
            可我就是喜欢不起来。不过我得说一件事。那时我溜走，把你一个人丢下，是我不对。后来我的确回去找你了。
        - id: ch02-b07
          speaker: lucy
          text: 我知道你回来了。
        - id: ch02-b08
          speaker: philip
          text: 我回来就是为了接你。现在我们最好一起回家。
        - id: ch02-b09
          speaker: lucy
          text: >-
            可你得完成七项伟业才能回去，这会花掉好久好久。除非成为救星国王，否则没人能从这个地方出去两次。你已经出去过一次了，而且那次没有带上我。现在你若想再出去，就非得先做完七件高贵的事不可，七项伟业缺一项都不行。
        - id: ch02-b10
          speaker: philip
          text: 对了，佩林先生说过。可我已经杀了一条龙。
        - id: ch02-b11
          speaker: lucy
          text: 那只算一项，还有六项呢。
        - id: ch02-b12
          speaker: narrator
          text: 露西坚定地吃着早餐。菲利普忽然问她喜不喜欢这场冒险。
        - id: ch02-b13
          speaker: lucy
          text: >-
            这场冒险比我从前遇到过的任何事情都有趣。要是你肯对我好一点，我一定会喜欢得不得了。可是现在这个样子，就很难说了……
        - id: ch02-b14
          speaker: philip
          text: 很遗憾，你觉得我这个人不好。
        - id: ch02-b15
          speaker: lucy
          text: 那么，你自己觉得呢？
        - id: ch02-b16
          speaker: narrator
          text: >-
            菲利普认真想了想。他不愿做个不好的人。我们谁都不愿意，尽管看有些人的行为，实在猜不出来。他想起别人教过的话，真正的礼貌，是对别人的事情表示关心。于是他很努力地客气起来。
        - id: ch02-b17
          speaker: philip
          text: >-
            告诉我吧。那时候我……我是说，你没有跟我一起从梯子下去，后来到底怎么了？
        - id: ch02-b18
          speaker: lucy
          text: >-
            我孤苦伶仃，遭人遗弃。发过誓的朋友脚底抹油，把我扔下了。我摔了一跤，两只手里全是碎石子，接着凶猛的士兵把我团团围住。
        - id: ch02-b19
          speaker: philip
          text: 我以为你就在我后面。
        - id: ch02-b20
          speaker: lucy
          text: 可我不在。
        - id: ch02-b21
          speaker: philip
          text: 然后呢？
        - id: ch02-b22
          speaker: lucy
          text: >-
            然后嘛，你没留下来，真是傻透了。那些士兵把我围住，队长要我说实话，问我到底是毁灭者还是救星。我当然回答，不管我是什么，反正绝不是毁灭者。他们就把我带进宫殿，说在救星国王出现以前，我可以先做公主。他们还说，我长的是救星的头发，不是毁灭者的头发。从那以后我一直快活极了。你这一路快活吗？
        - id: ch02-b23
          speaker: philip
          text: 我可不能说自己快活。
        - id: ch02-b24
          speaker: narrator
          text: >-
            菲利普记起自己独自逃命，把露西一个人留在陌生而危险的世界以后，那种难受的滋味又回来了。那时候，他明白自己只顾保住了自己的安全，却把露西抛在后面。他觉得自己既胆小又卑鄙，所以无论如何也不能把那段经历叫作快活。
        - id: ch02-b25
          speaker: lucy
          text: 当公主可美了。真想知道你的下一项伟业是什么。也许我能帮你呢？
        - id: ch02-b26
          speaker: philip
          text: >-
            要做伟业，我自己会做。谢谢，我不需要帮忙，尤其不需要女孩子帮忙。
        - id: ch02-b27
          speaker: lucy
          text: 真希望你需要。
        - id: ch02-b28
          speaker: narrator
          text: >-
            露西吃完最后一口面包泡牛奶，菲利普的碗也已经空了。他伸直两条胳膊，又伸伸腿和脖子，让坐了许久的身体松快一些。他越想越觉得这一切古怪。冒险开始以前，他从没想过世上竟会发生这种事，更没想过它真的会从某一天、某一刻突然开始。
        - id: ch02-b29
          speaker: philip
          text: 你以前想过，这样的事真的会开始吗？
        - id: ch02-b30
          speaker: lucy
          text: >-
            我不知道。所有事情都奇妙极了。我总盼着世界能比从前更加奇妙。有时候，人会得到一点暗示，就像谁在身边碰你一下，再轻轻推你一把。童话，还有梦，总让人忍不住觉得，它们一定藏着某种意思。你姐姐和我爸爸小时候是那么好的朋友，后来分开了，如今又重新要好，这不就像梦里的故事吗？还有你搭起城市，我来帮你。我的爸爸那么亲爱可爱，你的姐姐又那么可爱亲爱。这些事情凑在一起，总让我觉得，美好的事情很可能真的发生。你从来没有这样想过吗？
        - id: ch02-b31
          speaker: philip
          text: 没有。我的意思是，有。所有事情都奇妙极了，对不对？
        - id: ch02-b32
          speaker: narrator
          text: >-
            菲利普先说没有，随即又改口说有。就在这一刻，他对露西的喜欢比从前任何时候都多了一点。两个人正觉得这个世界奇妙，身后忽然传来一声恭恭敬敬的轻咳。他们转过头，正好对上六六骨牌平静的目光。
        - id: ch02-b33
          speaker: double_six
          text: 菲利普爵士，如果您吃完了早餐，诺亚先生请您去办公室。
        - id: ch02-b34
          speaker: lucy
          text: 我也能去吗？
        - id: ch02-b35
          speaker: double_six
          text: 殿下若愿意，自然可以同行。
    - id: ch03
      title: 迷结地毯
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            两个孩子跟着六六骨牌来到一间小屋。里面到处堆着文件，桌上也铺满了纸。诺亚先生坐在那堆纸后面不停地写字，忙得不可开交。看见公主和菲利普爵士进来，他只抬头道了早安，便告诉他们，自己正在设法安排菲利普的下一项任务。
        - id: ch03-b02
          speaker: philip
          text: 是我的下一项英勇伟业吗？
        - id: ch03-b03
          speaker: judge_noah
          text: >-
            我们决定，伟业不必每一项都靠勇敢。你还记得赫拉克勒斯那些奇异任务吧，有些非常危险，有些只是困难，所以够难的事情也能算数。这里确实有几件事急需解决，像水果供应，还有住在海边的居民问题，以及另外一些事。不过那些可以等等。我们要让你的任务尽量多些花样。昨天是户外冒险，今天改成室内消遣。只是我正要交给救星国王候选人的这项任务，很可能会花掉你几天，甚至几个星期的宝贵时间。
        - id: ch03-b04
          speaker: philip
          text: >-
            可家里的人怎么办？我真的不是害怕。他们不知道我们在哪里，一定会急疯的。诺亚先生，请让我们回去吧。
        - id: ch03-b05
          speaker: judge_noah
          text: >-
            放心吧。你们在这里不管待多久，家里那边的时间都不会向前走。我以为早就解释清楚了。你丢下小伙伴时，曾把我们的钟拨到你们世界的时间。可你回来找她，又从巨龙那里救出她以后，这里的钟就重新照自己的时间走了。如今家里真正少掉的，只有你第二次进入这里到杀死巨龙之间的那一小段时间。
        - id: ch03-b06
          speaker: philip
          text: 我懂了。
        - id: ch03-b07
          speaker: narrator
          text: 其实菲利普一点也没懂。我只希望你听明白了。
        - id: ch03-b08
          speaker: judge_noah
          text: >-
            新任务可以慢慢做，也可以请任何人帮助。做满三个月以前，我不会判你失败。三个月以后，女觊觎者便有权得到她的机会。
        - id: ch03-b09
          speaker: philip
          text: 只要这里的时间不算进家里的时间，请告诉我，我们到底要做什么？
        - id: ch03-b10
          speaker: judge_noah
          text: >-
            许多个时代以来，我国最杰出的智者始终在研究这个如今交给你的难题。你的前任狱卒培根—莎士比亚先生，光为这个题目就写了不少于二十七卷书，而且每一卷都用了密码。可惜他自己忘了用的是哪一套密码，世上又从来没有第二个人知道。因此，那二十七卷书对我们几乎毫无用处。
        - id: ch03-b11
          speaker: philip
          text: 这回我也懂了。
        - id: ch03-b12
          speaker: narrator
          text: 其实这回他还是没懂。诺亚先生站直身子，两个孩子在他旁边显得小极了。
        - id: ch03-b13
          speaker: judge_noah
          text: >-
            现在我来说明任务。我原想下令，把收拾这间办公室定为第二项伟业。你瞧，这些散乱的纸全是关于救星的预言。可我们的法律不许法官借公共事务为自己谋取私利，所以我只好另选一件。你的下一项任务，是解开迷结地毯。它铺在公共娱乐柱厅里。等我拿上帽子，我们马上过去，路上再把事情讲完。
        - id: ch03-b14
          speaker: narrator
          text: >-
            他们走过一条条街，经过一幢幢房屋和宫殿。菲利普渐渐模糊地记起，这些建筑全是自己在不同时候搭过的。诺亚先生告诉他，公共娱乐柱厅非常漂亮，却从来不能拿来供人娱乐，甚至没法做任何别的事。最初建城的那个巨人在大厅里铺了一张地毯。它厚得一直没到人的膝盖，织法又错综复杂，从来没有人能解开。整张地毯厚得过不了任何一扇门，而菲利普的任务，就是把它从大厅里搬出去。
        - id: ch03-b15
          speaker: philip
          text: 这太容易了。我把地毯割成小块，一块一块搬出去。
        - id: ch03-b16
          speaker: judge_noah
          text: >-
            那会让你倒大霉。就在今天早上，我刚刚归档了一则非常古老的预言。它说，无论拿火去烧，拿石头去割，还是动用钢铁刀刃，谁敢把这张地毯弄断，从此以后就只能靠橙籽填肚子，还得用橙皮把全身裹起来。你不会愿意过那种日子吧？
        - id: ch03-b17
          speaker: philip
          text: 我当然不喜欢。
        - id: ch03-b18
          speaker: judge_noah
          text: 地毯只能拆开原来的编织，一根线也不能断。我们到了。
        - id: ch03-b19
          speaker: narrator
          text: >-
            他们又走上一段台阶。菲利普有时真后悔自己从前那么爱搭台阶。穿过昏暗的前厅，他们来到一道拱门前。从门口望进去，是一座又深又宽的大厅。大厅尽头有一片抬高的地面，前面又是几层台阶。高台上立着两根巨大的青铜柱，柱身浮雕着一群正在飞翔的鸟。
        - id: ch03-b20
          speaker: lucy
          text: 那是爸爸的日本花瓶。
        - id: ch03-b21
          speaker: narrator
          text: >-
            整座大厅的地面都被地毯盖住。它由红色的粗软绳织成，针脚看着很松，织法却复杂得要命。那些绳线不是简简单单地直来直去，而是一下压在上面，一下钻到下面，又绕过来，再从别处穿过去，几乎分不清哪一根先来，哪一根后到。它们仿佛故意缠得那么固执，那么让人眼花。菲利普站在边缘看了很久，越看越不知道从哪里下手。他宁可去拆一百个世上最难解的包裹绳结，也不想碰这张地毯。
        - id: ch03-b22
          speaker: judge_noah
          text: >-
            好了，这张地毯就交给你们。食宿都由昨晚你们住过的临时王宫供应。凡是城里的市民，只要受到召唤，都有义务前来协助。还有一件事，午饭在一点钟开。现在，二位早安。
        - id: ch03-b23
          speaker: narrator
          text: >-
            菲利普坐在昏暗的拱门里，茫然看着纠缠的粗绳。露西迟疑了一会儿，也坐下来，双臂抱紧膝盖，和他一起盯着地毯。他们活像两个海难后漂流荒岛的水手，望着茫茫大海，眼巴巴等一片船帆出现。身后很近的地方忽然响起一阵讨厌的笑声。那个蒙汽车面纱的女觊觎者，不知什么时候悄悄摸了过来，正隔着面纱低头瞧着他们。
        - id: ch03-b24
          speaker: pretenderette
          text: 哈哈，嘻嘻！我就是来看你们笑话的。你们和这张地毯，永远也别想成功。你们不知道办法，我可知道。
        - id: ch03-b25
          speaker: philip
          text: 那你去别处笑。
        - id: ch03-b26
          speaker: lucy
          text: 别理她，我们走。
        - id: ch03-b27
          speaker: narrator
          text: >-
            两个孩子转身离开，女觊觎者仍旧慢悠悠地跟在后面。大厅外面，两个穿格子衣服的荷兰娃娃正挽着胳膊走过。露西忽然大喊一声，请他们帮忙。两个娃娃马上停住脚步，一起摘下帽子。高个子的那一个摸了摸漆在脸上的黑胡子，客气地询问出了什么事。
        - id: ch03-b28
          speaker: dutch_tall
          text: 请问出了什么事？
        - id: ch03-b29
          speaker: lucy
          text: 诺亚先生说，全体市民都有义务帮助我们。
        - id: ch03-b30
          speaker: dutch_short
          text: 那当然。
        - id: ch03-b31
          speaker: lucy
          text: >-
            那么请你们把那个蒙汽车面纱的人带走，关到不会来打扰我们的地方，等我们解完地毯再放她出来，好吗？
        - id: ch03-b32
          speaker: dutch_short
          text: 十分乐意。
        - id: ch03-b33
          speaker: narrator
          text: >-
            两个和气的荷兰娃娃一听便冲上台阶。转眼间，他们再次从大厅出来，把女觊觎者牢牢夹在两人中间。她一路踢腾扭动，拼尽全力挣扎，可那挣扎始终毫无用处。
        - id: ch03-b34
          speaker: dutch_tall
          text: >-
            你们再也不必有丝毫担心，把这件事彻底忘掉吧。我们会把她送到正义厅。她的罪名，是在别人认真履行职责时从旁妨碍。按照判决，受她打扰的人愿意让她关多久，她就必须在牢里待多久。二位早安。
        - id: ch03-b35
          speakers: [philip, lucy]
          ensemble: duo
          text: 太谢谢你们了！
        - id: ch03-b36
          speaker: narrator
          text: 只剩两个人以后，菲利普说出了一句很不容易说出口的话。
        - id: ch03-b37
          speaker: philip
          text: 露西，你这个主意真聪明。我怎么也想不到。
        - id: ch03-b38
          speaker: lucy
          text: 这不算什么。我还能做得更多。
        - id: ch03-b39
          speaker: philip
          text: 你还能做什么？
        - id: ch03-b40
          speaker: lucy
          text: 我能解开地毯。
        - id: ch03-b41
          speaker: philip
          text: 可这项任务应该由我完成。
        - id: ch03-b42
          speaker: lucy
          text: >-
            任何市民只要被召唤，都有义务帮忙。公主也该算市民吧。
        - id: ch03-b43
          speaker: philip
          text: 也许我自己就能办到。
        - id: ch03-b44
          speaker: lucy
          text: 那你去试试。
        - id: ch03-b45
          speaker: narrator
          text: >-
            露西坐到台阶上，仙女般的白裙在身边铺开，像一朵重瓣白蜀葵。菲利普回到大厅，对着那些像缆绳一样的粗线试了又试。他从这边走到那边，又弯腰翻看一个个交错的绳圈，可他看不见任何一根绳子的末端，也找不到这项任务可以着手的开头。露西仍像白蜀葵一样坐在外面，一动不动。时间一点点过去，午饭时刻也越来越紧迫地逼近了。菲利普又饿又泄气，只好回到她面前。
        - id: ch03-b46
          speaker: philip
          text: 好吧。你愿意的话，就告诉我该怎么做。
        - id: ch03-b47
          speaker: lucy
          text: >-
            这样可不行。你要我帮这一次，就得答应以后每项任务都让我帮忙。还得亲口请我，而且要请得有礼貌。
        - id: ch03-b48
          speaker: narrator
          text: >-
            菲利普赌气说，那他就不请。可肚子越来越饿，他又确实毫无办法，最后还是不得不开口，而且照露西的要求，请得十分有礼貌。露西一听完便立刻答应。菲利普看得出来，刚才他忙着下决心时，她也一直在心里准备自己的答案。
        - id: ch03-b49
          speaker: lucy
          text: 我非常乐意在这件事和以后所有任务中帮助你。现在请你说，你答应。
        - id: ch03-b50
          speaker: philip
          text: 我答应。
        - id: ch03-b51
          speaker: lucy
          text: 要说完整，在这件事和以后所有任务中。
        - id: ch03-b52
          speaker: philip
          text: >-
            好，我答应你在这件事和以后所有任务中帮忙。现在快告诉我，我们该怎么做。
        - id: ch03-b53
          speaker: lucy
          text: >-
            因为这根本不是普通地毯，是钩针编出来的。那天晚上，我把自己用红毛线钩的一张小垫子放进了大厅。它变大以后看着才这么吓人。其实只要找到最末端的线头，用力往外一拉，整张垫子就会从那里开始，一针一针地全部散开。我们只缺那根线头。
        - id: ch03-b54
          speaker: philip
          text: 可现在它太重了，我们根本拉不动。
        - id: ch03-b55
          speaker: lucy
          text: >-
            你去找那种圆滚滚、转起来能把船拖出海面的东西。我去找线头。
        - id: ch03-b56
          speaker: narrator
          text: >-
            露西跑上台阶去找线头。菲利普留在广场上，朝另外三面的一幢幢建筑张望，想看哪一处像是专卖绞盘的店铺。你当然也和他一样，已经听懂露西所说那种圆滚滚、会把船拖出海面的东西就是绞盘。几乎正对面的一幢楼上写着“海军事务用品公司”，菲利普看清招牌，马上穿过广场跑了进去。
        - id: ch03-b57
          speaker: naval_secretary
          text: >-
            当然可以，完全没问题。我马上派十二个人和一架绞盘过去。能帮助菲利普爵士，我们荣幸之至。只要勇武与美貌需要援手，海军向来最热心，绝不会落在别人后面。
        - id: ch03-b58
          speaker: philip
          text: 我想勇敢，可不想美貌。
        - id: ch03-b59
          speaker: naval_secretary
          text: 那当然。我说的美貌是露西小姐。
        - id: ch03-b60
          speaker: philip
          text: 噢，原来是她。
    - id: ch04
      title: 露西的舞蹈
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            很快，公共娱乐厅外便出现了十二名蓝衣水兵和一架绞盘，四周围满欢呼的人。露西已经找到了线头，两名水兵把沉重的红绳拖出大厅，牢牢系到绞盘上。大家使足力气，一圈又一圈地转动绞盘，一边唱着让人喘不过气来的水手号子。几十个热心市民站在还没有拆开的地毯上，用全身重量把其余部分压稳。绞盘越转越快，粗绳也不停地涌出大厅。红色地毯一层层散开，宽阔的地面终于重新露了出来。
        - id: ch04-b02
          speaker: narrator
          text: >-
            菲利普成功的消息像野火一样传遍整座城市。街上不断有人赶来，围观的人越聚越多，也挤得越来越密。飞鸟铜柱后面的两扇大门完全敞开，诺亚先生和城里的主要人物都站在那里，等着亲眼看见最后一段地毯被拆完。绞盘仍在一圈圈转，水手的号子也没有停。当最后的绳结终于松开，最后一段红绳离开大厅时，四周顿时爆发出巨大的喝彩声。
        - id: ch04-b03
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 好啊！菲利普爵士万岁！
        - id: ch04-b04
          speaker: philip
          text: 这不是我的功劳。办法是露西想出来的。
        - id: ch04-b05
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 为露西小姐喝彩！也为诚实谦逊的菲利普爵士喝彩！
        - id: ch04-b06
          speaker: judge_noah
          text: 好极了，亲爱的露西！
        - id: ch04-b07
          speaker: narrator
          text: 诺亚先生兴高采烈地挥舞帽子，又走到露西身边，重重拍了拍她的背，向她表示祝贺。
        - id: ch04-b08
          speaker: lucy
          text: >-
            我真高兴自己想到了这个办法。这么一来，菲利普爵士已经完成两项伟业了，对不对？一共要做七项，现在已经有两项了。
        - id: ch04-b09
          speaker: judge_noah
          text: >-
            一点不错，这的确是第二项伟业。现在我得封菲利普做从男爵。此后每完成一项任务，他的头衔都要变得更加显赫。还有一则古老的预言。它规定，谁找出了拆散这张地毯的方法，谁就必须成为第一个在公共娱乐厅里起舞的人。
        - id: ch04-b10
          speaker: judge_noah
          text: >-
            聪慧的人，高贵的人，解开地毯万千结痕。她要第一个起舞翩翩，踏遍这座欢乐大厅。
        - id: ch04-b11
          speaker: judge_noah
          text: >-
            大概连我国这些本领高强的占星诗人，也觉得“公共娱乐”太难押韵，才换了说法。孩子，你挑这身衣服很有先见。跳吧，露西小姐，让预言应验。
        - id: ch04-b12
          speaker: narrator
          text: >-
            于是，露西真的跳起舞来。她穿着仙女般的白裙，从公共娱乐厅这一端一路跳向另一端。那张厚重的红地毯已经完全不见了，刚刚清空的地面显得又宽阔又平坦。露西的白裙随着脚步轻轻展开，正适合这支应验预言的舞。全城百姓站在两旁观看，不停为她鼓掌。菲利普也站在人群中，和大家一起认真拍起手来，直到露西跳过整座大厅。
