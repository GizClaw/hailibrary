  chapters:
    - id: ch01
      title: CHAPTER V. ON THE CARPET
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Princess turned out to be Lucy.
        - id: ch01-b02
          speaker: philip
          text: >-
            Well, that's too bad. It really is.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Philip stopped there and looked thoroughly cross.
        - id: ch01-b04
          speaker: mr_noah
          text: >-
            The Princess and the Champion will now have tea. Everyone, turn around, please. Quick march!
        - id: ch01-b05
          speaker: narrator
          text: >-
            Philip and Lucy found themselves marching side by side beneath a night sky glowing yellow with one firework after another. Picture them crossing a wide grassy plain filled with flowers of pink, blue, yellow, and white. Many of Philip's buildings had once stood on the green flowered carpet in his drawing room at home. Now that carpet had become real grass and living flowers. It followed the strange law of this world, where familiar things changed into larger versions of themselves that truly belonged in a living land.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The whole procession was silent. Philip was too bad-tempered to speak, and when you are in a bad temper, there is hardly anything good to say. After outwitting a dragon and killing it, he thought it was too much to have the adventure end with tea beside Lucy. He had other reasons for keeping quiet as well. Lucy had so much to tell that she could not choose where to start, and she knew how cross he was. The crowd kept silent because people did not talk in processions. Mr. Noah kept silent because walking and talking together left him breathless, and he had not been designed to do either one.
        - id: ch01-b07
          speaker: narrator
          text: >-
            At last, the quiet party passed through the city gate and along the streets. Philip wondered where tea would be served. Surely not in the prison. It seemed to be the middle of the night, but every street shone with lights. Flags and garlands of flowers hung from the windows and stretched overhead.
        - id: ch01-b08
          speaker: narrator
          text: >-
            In a great city square, colored lamps blazed around the open doors of a large building. Red-carpeted steps led up to it. Mr. Noah hurried to the top and turned to welcome the children.
        - id: ch01-b09
          speaker: mr_noah
          text: >-
            I speak for the City of Polistopolis. We welcome the noble Sir Philip, Knight and Dragon Slayer, and the Princess he rescued. Please come in.
        - id: ch01-b10
          speaker: narrator
          text: >-
            They climbed the red-covered steps and entered a splendid hall of silver and ivory. Mr. Noah bent down and spoke confidentially.
        - id: ch01-b11
          speaker: mr_noah
          text: >-
            Would you and your Princess like to wash? Perhaps you'd also like to dress up before the banquet.
        - id: ch01-b12
          speaker: philip
          text: >-
            A banquet? I thought we were having tea.
        - id: ch01-b13
          speaker: mr_noah
          text: >-
            Business comes before pleasure. First the banquet, then tea. The dressing rooms are this way.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Two doors stood side by side. One said Knight's Dressing Room, and the other said Princess's Dressing Room.
        - id: ch01-b15
          speaker: mr_noah
          text: >-
            Mind the wet paint. We had very little time to get ready.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Philip's dressing room was fascinating. Looking glass covered every wall, so reflections surrounded him wherever he turned. Tables in the center held clothes in beautiful colors and every sort of odd shape. There were shoes and stockings, hats and crowns, armor and swords, cloaks, breeches, waistcoats, jerkins, and trunk hose. Through an open door he could see a marble bathroom. The bath lay down in the floor, like the baths of rich Roman empresses or those in some modern model homes. I am told that some people keep coal in baths like that. It is no use at all, because however much you wash coal, it stays black.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Philip undressed and slipped into the warm, clear water. Between the pale marble below and the air above, the water looked greenish. Why does a bath feel so pleasant when washing your face and hands in a basin feels so tiresome? Afterward, he put his shirt and knickerbockers back on and wandered around the room, studying every costume. He could not decide what a knight ought to wear at a banquet. After a great deal of hesitation, he chose a soft little chain-mail shirt. When he held it up, all its tiny steel links fitted into two handfuls. Then he discovered a problem.
        - id: ch01-b18
          speaker: philip
          text: >-
            I don't know how this goes on, and the banquet is probably waiting. It won't like that at all.
        - id: ch01-b19
          speaker: narrator
          text: >-
            As he stood holding the mail, he noticed a bell handle beneath an ivory plate marked Valet. He rang. A soft knock came at once, and a strange person entered. At first Philip thought he was a walking advertisement board. Then he saw that the two flat oblongs around the man's body were giant dominoes. The man, dressed in tight black clothes between them, bowed low.
        - id: ch01-b20
          speaker: philip
          text: >-
            Oh! I rang for a valet.
        - id: ch01-b21
          speaker: double_six
          text: >-
            I am not the valet, sir. I am the Master of the Robes, and I attend only truly important people. I am Double-six, at your service. Have you selected your clothes?
        - id: ch01-b22
          speaker: philip
          text: >-
            I'd like the armor. It seems right for a knight.
        - id: ch01-b23
          speaker: double_six
          text: >-
            Exactly, sir. I agree completely.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Double-six put Philip into a white tunic and fastened the coat of mail over it.
        - id: ch01-b25
          speaker: double_six
          text: >-
            I have a great deal of experience, and you could not have chosen better. Clothes are my special subject. The law fixes my own costume, so fashions never distract me. That leaves me free to think deeply about what other people should wear. Still, I see you can think for yourself.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Philip looked splendid in his coat and hood of mail, just like a Crusader. At the doorway he met Lucy. She wore a short white dress and a little crown of pearls.
        - id: ch01-b27
          speaker: lucy
          text: >-
            I've always wanted to be a fairy.
        - id: ch01-b28
          speaker: philip
          text: >-
            Did someone help you dress?
        - id: ch01-b29
          speaker: lucy
          text: >-
            Of course not. I always dress myself.
        - id: ch01-b30
          speaker: double_six
          text: >-
            Ladies do have the advantage there. The banquet is ready.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Bowing as he walked backward, Double-six led them to a great room where the banquet lay on three long tables. One ran along each side. The third crossed the far end on a raised platform. It was like the high table in an old college hall, where the learned teachers and their important guests sit above everyone else.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Mr. Noah was already seated in the middle of that high table. Lucy and Philip took the places on either side of him. Tempting dishes covered the table, along with pink-and-white patterned plates that looked strangely familiar to Philip. He soon realized they were the painted wooden plates from his sister's old dollhouse. Yet directly in front of the children there was no food at all. Between them stood only one great, empty silver bowl.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Hungry Philip handled his knife and fork. He knew those too. They were the tiny lead ones from the dollhouse basket of green and silver wire. Servants in straight yellow dresses, red masks, and red caps began passing the dishes. A lovely jelly reached Philip. He raised his spoon to serve himself.
        - id: ch01-b34
          speaker: mr_noah
          text: >-
            Don't! Just pretend. Haven't you ever been to a make-believe banquet?
        - id: ch01-b35
          speaker: narrator
          text: >-
            Mr. Noah whispered urgently, but Philip had not caught the warning in time. He had already pushed the edge of his lead spoon against the jelly and found it completely hard. So he went through the motions of serving himself, though nothing at all landed on his plate. Mr. Noah, Lucy, and every other guest did exactly the same. Soon another dish arrived, and nobody changed the plates between courses. Of course they didn't need to, Philip thought bitterly. This dish held a fat, uncarved goose, and now he could see that the goose was glued firmly to its platter. At last he understood what sort of banquet this was.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Perhaps you know those beautiful but uneatable toy feasts that come in a white cardboard box bound with blue, with fine wood shavings tucked around every plate to keep it safe. When I was little, I owned one with twelve dishes. There was a shapely brown ham and two brown roast chickens, whose shape showed rather more of their bones. There was a glazed tongue shaped like a real tongue, not one of those mysterious round things from a tin. I had sausages, two handsome fish with just a touch of blue, and a rib of beef with bright red meat and very white fat. There was a pork pie too, delicately browned as though it had traveled under a hot sun. For sweets, there were lovely shapes of jelly and cream, a Swiss roll, and a plum pudding. Asparagus, cauliflower, and the greenest peas in this grey world completed the feast.
        - id: ch01-b37
          speaker: narrator
          text: >-
            The wooden food made us terribly gloomy. Dish and dinner were all one piece, and that defeated even our best efforts at make-believe. With the point of Nurse's scissors, we pried the food away from the plates. Nothing could conquer its wooden nature. A whole chicken was no easier to imagine eating after it came loose, and the sausages remained one solid lump. When we licked the jelly, it tasted only of glue and paint. We even tried roasting the chickens again at the nursery fire. They caught alight, and the smell was like gasworks and India rubber. But once a storyteller starts remembering childhood, the memories can go on forever. I am wandering, so let us return to Philip and Lucy.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Their banquet was made of that same painted wooden food, though it offered even more dishes. They had turkey, eight raspberry jam tarts, a pineapple, a melon, oysters in their shells, boiled bacon, and a leg of mutton. Every bit was wooden, fixed to its plate, and impossible to eat.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Philip and Lucy grew hungrier and hungrier. With sinking hearts, they went through every motion of eating and enjoying the feast, though there was nothing to eat. Wine was served in little goblets they knew very well. Each had a second glass sealed inside it, holding red liquid between the two layers so the cup always looked full. The children did not want wine, but by then they were thirsty as well as hungry.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The long banquet went on and on, giving Philip plenty of time to wonder what the waiters had once been in his own world. He watched their straight yellow bodies, their red masks, and the way they moved among the dishes. He could not solve the puzzle at first. Then he saw a group of them standing stiffly together at the far end of the hall. Suddenly he knew. They were the matches he had once used to fill a toy city with people when no other inhabitants were close at hand.
        - id: ch01-b41
          speaker: narrator
          text: >-
            After every dish had gone around, the speeches began. Mr. Noah addressed his friends and fellow citizens. He praised Sir Philip's bravery and cleverness and said the boy might truly become the Deliverer. Philip missed most of it because he was thinking about food. Then everyone rose with a shout. It was Philip's turn to speak. Trembling and miserable, he stood.
        - id: ch01-b42
          speaker: philip
          text: >-
            Friends and fellow citizens, thank you. I want to become the Deliverer, but I don't know whether I can.
        - id: ch01-b43
          speaker: narrator
          text: >-
            He sat down to a roar of applause. Music followed from a gallery behind a grating. Then Mr. Noah leaned close, and Lucy and Philip could hardly have been more relieved by what he whispered.
        - id: ch01-b44
          speaker: mr_noah
          text: >-
            Cheer up! The banquet is finished. Now we can have tea.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Tea turned out to mean bread and milk in a cozy little room lined with blue silk, just beyond the banquet hall. Only Lucy, Philip, and Mr. Noah were there. Bread and milk tastes very good when you are truly hungry, even when you must eat it with a lead spoon from a dollhouse basket. The meal went on until it was much later. Then Mr. Noah suddenly wished them good night. Full, warm, and almost too sleepy to understand anything, the children went to bed. Philip's bed was made of gold and hung with yellow satin curtains. Lucy's was silver, with curtains of white silk. Neither the precious metals nor the beautiful colors mattered once their eyes closed. Both children slept deeply and dreamed of nothing.
        - id: ch01-b46
          speaker: narrator
          text: >-
            In the morning, bread and milk appeared again. This time the children ate alone in the blue room. Lucy looked up from the white cubes floating in her bowl.
        - id: ch01-b47
          speaker: lucy
          text: >-
            Well? Are you beginning to like me any better?
        - id: ch01-b48
          speaker: philip
          text: >-
            No.
        - id: ch01-b49
          speaker: narrator
          text: >-
            He answered as briefly and sternly as a sea captain in a song.
        - id: ch01-b50
          speaker: lucy
          text: >-
            I wish you were.
        - id: ch01-b51
          speaker: philip
          text: >-
            I can't. But I do need to tell you something. I'm sorry I ran off and left you. I came back, though.
        - id: ch01-b52
          speaker: lucy
          text: >-
            I know you did.
        - id: ch01-b53
          speaker: philip
          text: >-
            I came back to get you. Now we should go home.
        - id: ch01-b54
          speaker: lucy
          text: >-
            You can't go home until you've done seven deeds of power.
        - id: ch01-b55
          speaker: philip
          text: >-
            Oh, yes. Perrin told me that.
        - id: ch01-b56
          speaker: lucy
          text: >-
            It will take ages. Nobody can leave this place twice unless he's a King-Deliverer. You went out once without me. Now you have to finish seven noble deeds before you can leave again.
        - id: ch01-b57
          speaker: philip
          text: >-
            I killed the dragon.
        - id: ch01-b58
          speaker: narrator
          text: >-
            He said it with modest pride.
        - id: ch01-b59
          speaker: lucy
          text: >-
            That only makes one. There are six to go.
        - id: ch01-b60
          speaker: narrator
          text: >-
            She went firmly on with her breakfast.
        - id: ch01-b61
          speaker: philip
          text: >-
            Do you like having this adventure?
        - id: ch01-b62
          speaker: lucy
          text: >-
            It's more interesting than anything that's ever happened to me. If you were nice to me, I'd love it. But the way things are now...
        - id: ch01-b63
          speaker: philip
          text: >-
            I'm sorry you don't think I'm nice.
        - id: ch01-b64
          speaker: lucy
          text: >-
            Do you think you are?
        - id: ch01-b65
          speaker: narrator
          text: >-
            Philip thought about that. He did not want to be unpleasant. None of us do, though our behavior sometimes suggests otherwise. He remembered being told that true politeness meant taking an interest in what happened to other people.
        - id: ch01-b66
          speaker: philip
          text: >-
            Tell me what happened after I... after you didn't come down the ladder behind me.
        - id: ch01-b67
          speaker: lucy
          text: >-
            There I was, abandoned by my sworn friend, who had run away and left me. I fell down, filled both hands with gravel, and found myself surrounded by fierce soldiers.
        - id: ch01-b68
          speaker: philip
          text: >-
            I thought you were right behind me.
        - id: ch01-b69
          speaker: lucy
          text: >-
            Well, I wasn't.
        - id: ch01-b70
          speaker: philip
          text: >-
            What happened next?
        - id: ch01-b71
          speaker: lucy
          text: >-
            You really should have stayed. The soldiers surrounded me, and their captain demanded the truth. Was I a Destroyer or a Deliverer? Of course I told him I wasn't a Destroyer, whatever else I might be. So they took me to the palace. They said I could be a Princess until the Deliverer King arrived. They even said my hair was the hair of a Deliverer and not the hair of a Destroyer. I've been wonderfully happy ever since. Have you been happy too?
          emotion: happy
        - id: ch01-b72
          speaker: philip
          text: >-
            No. I wouldn't exactly call it happy.
        - id: ch01-b73
          speaker: narrator
          text: >-
            He remembered the miserable moment when he realized he had saved himself and left Lucy alone in a strange, dangerous world. He had felt like a coward and a sneak.
        - id: ch01-b74
          speaker: lucy
          text: >-
            Being a Princess is beautiful. I wonder what your next noble deed will be. Could I help you do it?
        - id: ch01-b75
          speaker: narrator
          text: >-
            She looked at him wistfully.
        - id: ch01-b76
          speaker: philip
          text: >-
            If I have noble deeds to do, I'll do them myself. I don't need help, especially from girls.
        - id: ch01-b77
          speaker: lucy
          text: >-
            I wish you did.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Lucy finished her bread and milk. Philip's bowl was empty too, and he stretched his arms, legs, and neck.
        - id: ch01-b79
          speaker: philip
          text: >-
            It's strange. Before all this started, I never imagined anything like it could start. Did you?
        - id: ch01-b80
          speaker: lucy
          text: >-
            I don't know. Everything is so wonderful. I've always expected the world to be more wonderful than it ever seemed. You get little hints and nudges, don't you? Fairy tales give them to you, and dreams do too. You can't help feeling that they must mean something. Your sister and my father were such friends when they were young. Then they were separated, and at last they found each other and became friends again. That's like a story inside a dream. Then you built the city, and I helped you. My daddy is such a dear darling, and your sister is such a darling dear. All those things made beautiful adventures seem likely to happen. Didn't they make you feel that way too?
        - id: ch01-b81
          speaker: philip
          text: >-
            No. I mean, yes. Everything really is wonderful, isn't it?
        - id: ch01-b82
          speaker: narrator
          text: >-
            At that moment, Philip came closer to liking Lucy than ever before. A respectful cough sounded behind them. They turned and met Double-six's calm gaze.
        - id: ch01-b83
          speaker: double_six
          text: >-
            If you have finished breakfast, Sir Philip, Mr. Noah would like to see you in his office.
        - id: ch01-b84
          speaker: lucy
          text: >-
            May I come too?
        - id: ch01-b85
          speaker: double_six
          text: >-
            You may, if you wish, Your Highness.
        - id: ch01-b86
          speaker: narrator
          text: >-
            Double-six bowed stiffly. The children found Mr. Noah writing at a table in a little office cluttered with papers.
        - id: ch01-b87
          speaker: mr_noah
          text: >-
            Good morning, Princess. Good morning, Sir Philip. As you can see, I am very busy arranging your next labor.
        - id: ch01-b88
          speaker: philip
          text: >-
            Do you mean my next brave deed?
        - id: ch01-b89
          speaker: mr_noah
          text: >-
            We have decided that not every deed must be a brave one. Think of the strange labors of Hercules. Some were dangerous, while others were simply difficult. Difficult tasks will count for you too. Several things badly need doing. There is the fruit supply, and the Dwellers by the Sea, and... but those can wait. We try to give you as much variety as possible. Yesterday brought an outdoor adventure. Today you shall have an indoor amusement. I say “today,” but the task I am about to set the candidate for King-Deliverer may take several days. It might even occupy weeks of your valuable time.
        - id: ch01-b90
          speaker: philip
          text: >-
            But what about our people at home? I'm not frightened, truly I'm not. They'll go out of their minds when they can't find us. Please, Mr. Noah, let us go back.
        - id: ch01-b91
          speaker: mr_noah
          text: >-
            There is no need to worry. However long you stay here, time will not move for them. I thought I had explained that.
        - id: ch01-b92
          speaker: philip
          text: >-
            But you said...
        - id: ch01-b93
          speaker: mr_noah
          text: >-
            I said you set our clocks to your world's time when you abandoned your little friend. But once you returned for her and rescued her from the dragon, our clocks began running on their own time again. Back in your world, only one small piece of time will be missing. It is the time that passed between your second arrival here and the moment you killed the dragon. All the time you spend on your tasks now will not pass at home.
        - id: ch01-b94
          speaker: philip
          text: >-
            I see.
        - id: ch01-b95
          speaker: narrator
          text: >-
            He did not see at all. I only hope you do.
        - id: ch01-b96
          speaker: mr_noah
          text: >-
            Take as long as you need with this new task, and get any help you like. I will not say you have failed until three months have passed. After that, the Pretenderette will have her chance.
        - id: ch01-b97
          speaker: philip
          text: >-
            If time here truly doesn't count at home, then what do we have to do?
        - id: ch01-b98
          speaker: mr_noah
          text: >-
            The finest minds in our country have studied this problem for ages. Your former jailer, Mr. Bacon-Shakespeare, wrote twenty-seven whole volumes about it in code. Unfortunately, he forgot which code he used, and nobody else ever knew. His books are not much help.
        - id: ch01-b99
          speaker: philip
          text: >-
            I see.
        - id: ch01-b100
          speaker: narrator
          text: >-
            Once again, he did not.
        - id: ch01-b101
          speaker: narrator
          text: >-
            Mr. Noah rose to his full height, making the children look very small beside him.
        - id: ch01-b102
          speaker: mr_noah
          text: >-
            Now I will tell you exactly what you must do. I would very much like to declare that your second labor is tidying this room. Every one of these papers is a prophecy about the Deliverer, and you can see what a disorder they are in. But our laws say a judge must never use a public matter for his own private benefit. So instead, your second labor is to disentangle the Mazy Carpet. It lies in the Pillared Hall of Public Amusements. I will fetch my hat, and we shall go there at once. I can tell you the rest as we walk.
        - id: ch01-b103
          speaker: narrator
          text: >-
            They walked through streets lined with houses and palaces. Philip dimly remembered building every one of them at some time or another. As they went, Mr. Noah described the problem.
        - id: ch01-b104
          speaker: mr_noah
          text: >-
            It is a very beautiful hall, but we have never been able to use it for public amusements or for anything else. The giant who first built this city put a carpet there so thick it reaches your knees. He wove it in such a tangled, intricate fashion that nobody has ever managed to undo it. The whole carpet is much too thick to pass through any of the doors. Your task is to remove it from the hall.
        - id: ch01-b105
          speaker: philip
          text: >-
            That's easy! I'll cut it up and carry it out piece by piece.
        - id: ch01-b106
          speaker: mr_noah
          text: >-
            That would end very badly for you. Only this morning, I filed a very ancient prophecy. It says, “He who shall the carpet sever, by fire or flint or steel, shall be fed on orange pips forever, and dressed in orange peel.” I don't think you would enjoy eating nothing but orange seeds or wearing nothing but orange peel.
        - id: ch01-b107
          speaker: philip
          text: >-
            No. I certainly wouldn't.
        - id: ch01-b108
          speaker: mr_noah
          text: >-
            You must unravel the carpet completely without breaking a single thread. Here we are.
        - id: ch01-b109
          speaker: narrator
          text: >-
            They climbed more steps. Philip sometimes wished he had not enjoyed building steps quite so much. Beyond a dark entrance stood an arched doorway. Through it, they saw a vast hall. At the far end, more steps led to a raised floor between two enormous bronze pillars covered with flying birds.
        - id: ch01-b110
          speaker: lucy
          text: >-
            Those are Father's Japanese vases.
        - id: ch01-b111
          speaker: narrator
          text: >-
            The carpet covered the entire floor. It had been made from very thick, soft red rope. The weaving was loose, but terribly complicated. No strand went straight for long. The ropes passed over one another, ducked underneath, circled around, and seemed determined to bewilder anyone who looked at them. Philip studied the confusion and declared that he would rather untie the string on a hundred of the most difficult parcels than tackle this one carpet.
        - id: ch01-b112
          speaker: mr_noah
          text: >-
            I shall leave you to it. You may eat and sleep at the Provisional Palace, where you stayed last night. Every citizen must help if you ask. Dinner is at one. Good morning!
        - id: ch01-b113
          speaker: narrator
          text: >-
            Philip sat in the dark archway and stared helplessly at the knotted strands. After a moment, Lucy sat beside him with her arms around her knees. Together they gazed across the carpet like shipwrecked sailors watching a great empty sea and longing to see a sail.
        - id: ch01-b114
          speaker: pretenderette
          text: >-
            Ha, ha! Tee-hee!
        - id: ch01-b115
          speaker: narrator
          text: >-
            The laugh came from just behind them. They turned. The hateful Pretenderette had crept close in her motoring veil and now looked down at them through it.
        - id: ch01-b116
          speaker: philip
          text: >-
            What do you want?
        - id: ch01-b117
          speaker: pretenderette
          text: >-
            I came to laugh at you, and that is exactly what I'm going to do.
        - id: ch01-b118
          speaker: philip
          text: >-
            Then go somewhere else and laugh.
        - id: ch01-b119
          speaker: pretenderette
          text: >-
            But I want to laugh here. Look at you and your carpet! You'll never finish it. You haven't the faintest idea how. I do, though.
        - id: ch01-b120
          speaker: lucy
          text: >-
            Come away.
        - id: ch01-b121
          speaker: narrator
          text: >-
            The children left the hall, and the Pretenderette followed slowly. Outside, two Dutch dolls in checked suits came along arm in arm.
        - id: ch01-b122
          speaker: lucy
          text: >-
            Help!
        - id: ch01-b123
          speaker: narrator
          text: >-
            The dolls stopped and removed their hats. The taller one stroked his painted black mustache.
        - id: ch01-b124
          speaker: tall_dutchman
          text: >-
            How may we help?
        - id: ch01-b125
          speaker: lucy
          text: >-
            Mr. Noah said every citizen had to help us when we asked.
        - id: ch01-b126
          speaker: short_dutchman
          text: >-
            Why, of course.
        - id: ch01-b127
          speaker: lucy
          text: >-
            Then please take that woman in the motoring veil somewhere she can't bother us until the carpet is finished.
        - id: ch01-b128
          speaker: short_dutchman
          text: >-
            Delighted!
        - id: ch01-b129
          speaker: narrator
          text: >-
            The two agreeable strangers raced up the steps. A moment later, they came out with the Pretenderette between them. She struggled hard, but could not escape.
        - id: ch01-b130
          speaker: tall_dutchman
          text: >-
            You need not feel the slightest anxiety about her again. Dismiss the whole incident from your mind. We will take her straight to the Hall of Justice. Her offense is bothering people while they are trying to perform their duty. The sentence for that offense is imprisonment for as long as the person being bothered chooses. Good morning to you both.
        - id: ch01-b131
          speakers: [philip, lucy]
          ensemble: duo
          text: >-
            Oh, thank you!
        - id: ch01-b132
          speaker: narrator
          text: >-
            When they were alone, Philip managed to say something that was not easy for him.
        - id: ch01-b133
          speaker: philip
          text: >-
            That was very clever, Lucy. I never would have thought of it.
        - id: ch01-b134
          speaker: lucy
          text: >-
            That was nothing. I could do something much bigger.
        - id: ch01-b135
          speaker: philip
          text: >-
            What could you do?
        - id: ch01-b136
          speaker: lucy
          text: >-
            I could unravel the carpet.
        - id: ch01-b137
          speaker: narrator
          text: >-
            She spoke with deep seriousness.
        - id: ch01-b138
          speaker: philip
          text: >-
            But I'm the one who has to do it.
        - id: ch01-b139
          speaker: lucy
          text: >-
            Every citizen has to help when called, and I suppose a Princess counts as a citizen.
        - id: ch01-b140
          speaker: philip
          text: >-
            Maybe I can manage it alone.
        - id: ch01-b141
          speaker: lucy
          text: >-
            Go ahead and try.
        - id: ch01-b142
          speaker: narrator
          text: >-
            Lucy sat on the steps with her white fairy skirts spread around her like a double hollyhock. Philip went back to the great rough ropes. He could find no loose end and no place to begin. Lucy stayed where she was, as still as a white flower. Time passed, until dinner was getting urgently close. At last Philip returned to her.
        - id: ch01-b143
          speaker: philip
          text: >-
            All right. You can show me how, if you want to.
        - id: ch01-b144
          speaker: lucy
          text: >-
            No, thank you! If you want my help with this task, you must promise to let me help with every other one. And you have to ask me properly. Politely, too.
        - id: ch01-b145
          speaker: philip
          text: >-
            Then I won't.
        - id: ch01-b146
          speaker: narrator
          text: >-
            In the end, hunger made him ask, and he asked politely.
        - id: ch01-b147
          speaker: lucy
          text: >-
            With pleasure. I shall be delighted to help with this task and all the others. Now say yes.
        - id: ch01-b148
          speaker: narrator
          text: >-
            She answered at once. While Philip was deciding whether to ask, she had clearly been planning her reply.
        - id: ch01-b149
          speaker: philip
          text: >-
            Yes.
        - id: ch01-b150
          speaker: lucy
          text: >-
            Say, “With this task and all the others.”
        - id: ch01-b151
          speaker: philip
          text: >-
            With this task and all the others. Now tell me how we do it.
        - id: ch01-b152
          speaker: lucy
          text: >-
            It's crochet! I made a little mat from red wool and left it in the hall that night. We only need to find the end and pull. Then the whole thing will come undone.
          emotion: happy
        - id: ch01-b153
          speaker: philip
          text: >-
            It's much too heavy for us to pull.
        - id: ch01-b154
          speaker: lucy
          text: >-
            Then get one of those round turning machines people use to pull boats out of the sea. I'll find the end while you fetch it.
        - id: ch01-b155
          speaker: narrator
          text: >-
            Lucy ran up the steps. Philip searched the buildings on the other three sides of the square for something that looked like a shop selling capstans. He understood, as of course you have by now, that a capstan was the machine Lucy meant. Across the square, a sign read Naval Necessaries Supply Company. Philip hurried inside and explained what he needed to the plump sailor doll who served as secretary.
        - id: ch01-b156
          speaker: naval_secretary
          text: >-
            Certainly! I'll send twelve sailors over at once. We are proud to help you, Sir Philip. The navy is always eager to serve bravery and beauty.
        - id: ch01-b157
          speaker: philip
          text: >-
            I want to be brave, but I don't want to be beautiful.
        - id: ch01-b158
          speaker: naval_secretary
          text: >-
            Naturally not. I meant Lady Lucy.
        - id: ch01-b159
          speaker: philip
          text: >-
            Oh.
        - id: ch01-b160
          speaker: narrator
          text: >-
            Soon twelve blue-jacketed sailors arrived with a capstan outside the Hall of Public Amusements. They quickly became the center of a cheering crowd. Lucy had found the end of the rope inside the hall. Two sailors dragged it out and fastened it securely to the capstan. Then everyone set to work. The sailors pushed round and round with all their strength, singing a breathless sea song as they went, and the enormous carpet swiftly unraveled. Dozens of eager helpers stood on every part that was not yet undone. Their weight kept the woven mass steady while the capstan pulled the long red rope free.
        - id: ch01-b161
          speaker: narrator
          text: >-
            News of Philip's success raced through the city like wildfire. More and more people hurried toward the hall, until the crowd around the sailors grew thicker by the minute. At the far end of the building, beyond the bronze pillars decorated with flying birds, the great doors were thrown wide open. Mr. Noah appeared there with the city's leading citizens. Together they stood on the raised floor and watched the final lengths of red rope unwind.
        - id: ch01-b162
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: >-
            Bravo! Bravo, Sir Philip!
          emotion: happy
        - id: ch01-b163
          speaker: philip
          text: >-
            It wasn't my idea. Lucy worked it out.
        - id: ch01-b164
          speaker: narrator
          text: >-
            It was difficult for him to say, but when the crowd paused for breath, he said it. The cheering came back louder than before.
        - id: ch01-b165
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: >-
            Bravo for Lady Lucy! Bravo for Sir Philip, who modestly told the truth!
          emotion: happy
        - id: ch01-b166
          speaker: mr_noah
          text: >-
            Bravo, my dear!
        - id: ch01-b167
          speaker: narrator
          text: >-
            Mr. Noah waved his hat and thumped Lucy on the back.
        - id: ch01-b168
          speaker: lucy
          text: >-
            I'm so glad I thought of it. That means Sir Philip has completed two deeds now, doesn't it? Two out of seven.
          emotion: happy
        - id: ch01-b169
          speaker: mr_noah
          text: >-
            Indeed it does! I must make him a baronet now. His title will become grander with every deed he completes. There is an old prophecy that says whoever discovers how to unravel the carpet must be the first person to dance in the Hall of Public Amusements. “The clever one, the noble one, who makes the carpet come undone, shall be the first to dance a measure within the Hall of Public Pleasure.” I suppose even our highly skilled astrologers found “amusement” too difficult to rhyme. My child, you seem to have been wonderfully inspired when you chose that costume. Dance, Lady Lucy, and let the prophecy be fulfilled.
          emotion: happy
        - id: ch01-b170
          speaker: narrator
          text: >-
            Lucy danced the whole length of the wide, clear floor in the Hall of Public Amusements. All the people of the city watched and applauded. Philip applauded with them.
