  chapters:
    - id: ch01
      title: CHAPTER I. THE BEGINNING
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Philip Haldane and his sister lived in a little red-roofed house in a little red-roofed town. They had a little garden, a little balcony, and a little stable where a little pony stood ready to pull its little cart. A canary hung in a cage at the bow-window, and the neat little servant kept everything shining like a new pin.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Philip had no one but his sister, and she had no one but Philip. Their parents were dead. Helen was twenty years older than he was and only his half-sister, but she was the only mother he had ever known. He never envied other boys their mothers, because Helen was kind and clever and dear.
        - id: ch01-b03
          speaker: narrator
          text: >-
            She gave nearly all her time to him. She taught him his lessons, played with him, and invented wonderful games and adventures. Each morning Philip woke expecting a new day full of happy, interesting things. This went on until he was ten, and he never doubted it would go on forever.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The change began after a picnic in the wood by the waterfall. Helen and Philip were driving home behind their stout old pony. The pony was so quiet that Philip was allowed to hold the reins. As they came up the last lane before their turning, Helen spoke.
        - id: ch01-b05
          speaker: helen
          text: >-
            Tomorrow we'll weed the asters, and then we'll have tea in the garden.
        - id: ch01-b06
          speaker: philip
          text: >-
            That sounds jolly!
        - id: ch01-b07
          speaker: narrator
          text: >-
            They turned the corner and saw their little white garden gate. A man was coming through it, and he was not one of the friends they both knew. He came to meet them. Helen put her hand on the reins, though she had always taught Philip never to do such a thing, and the pony stopped.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The man was what Philip privately called tall and tweedy. He crossed in front of the pony and stood beside Helen's wheel. She shook his hand and greeted him in her usual way. Then the two of them whispered. Helen had often told Philip how rude whispering was. He caught only a few words: at last, over now, and this evening, then.
        - id: ch01-b09
          speaker: helen
          text: >-
            This is my brother, Philip.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The man reached across Helen to shake Philip's hand. Philip knew that was bad manners too.
        - id: ch01-b11
          speaker: peter
          text: >-
            I hope you and I will become the best of friends.
        - id: ch01-b12
          speaker: philip
          text: >-
            How do you do?
        - id: ch01-b13
          speaker: narrator
          text: >-
            That was the polite answer. Inside, Philip was saying that he did not want to be the man's friend at all.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The man took off his hat and walked away. Philip and Helen went home, but somehow Helen seemed different. Philip was sent to bed earlier than usual. For a long time he lay awake, listening to the front-door bell and then to a man's voice and Helen's voice going on and on in the drawing-room below.
        - id: ch01-b15
          speaker: narrator
          text: >-
            At last he slept. When he woke, rain was falling under a grey, miserable sky. He lost his collar stud, tore a stocking as he pulled it on, pinched his finger in the door, and dropped his tooth mug. It still had water in it. The mug broke, and the water ran into his boots. Some mornings are like that. This was one of them.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Breakfast did not taste as good as usual. Philip was late, of course. Helen cheerfully told him the bacon fat had gone grey while it waited, in the same voice that had always said everything he most liked to hear. But he did not smile. It was not a morning for smiling, with grey rain beating on the window.
        - id: ch01-b17
          speaker: helen
          text: >-
            Tea in the garden will have to wait, and it's much too wet for lessons.
        - id: ch01-b18
          speaker: narrator
          text: >-
            That was one of Helen's delightful ideas. She never made a wet day worse by adding lessons.
        - id: ch01-b19
          speaker: helen
          text: >-
            What shall we do instead? We could talk about the island. Shall I draw another map and put in all the gardens and fountains and swings?
        - id: ch01-b20
          speaker: narrator
          text: >-
            The island was their favorite game. It lay somewhere in warm seas among palm trees and rainbow-colored sands. In their fancy, they filled their own island with everything they liked and wanted. Philip never tired of it. Sometimes he almost believed it was real. He was king, Helen was queen, and no one else could come there. Only those two.
        - id: ch01-b21
          speaker: narrator
          text: >-
            But even the island could not charm him that morning. He wandered to the window and stared miserably at the soaked lawn, the dripping laburnum trees, and the fat drops hanging from the iron gate.
        - id: ch01-b22
          speaker: helen
          text: >-
            What's wrong, Pippin? You're not coming down with horrible measles, fiery scarlet fever, or a loud case of whooping cough, are you?
        - id: ch01-b23
          speaker: narrator
          text: >-
            She crossed the room and put a hand on his forehead.
        - id: ch01-b24
          speaker: helen
          text: >-
            Why, you're quite hot, boy of my heart. Tell your sister what's troubling you.
        - id: ch01-b25
          speaker: philip
          text: >-
            You tell me.
        - id: ch01-b26
          speaker: helen
          text: >-
            Tell you what, Pip?
        - id: ch01-b27
          speaker: philip
          text: >-
            You think you ought to bear it alone, like people do in books, and be noble about it. But you have to tell me. You promised you would never keep secrets from me, Helen. You know you did.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Helen put her arm around him and said nothing. Her silence led Philip straight to the most terrible conclusions. The rain gurgled in the pipe and dripped on the ivy. The canary tilted its head, flicked a seed husk into Philip's face, and chirped defiantly. Still Helen said nothing.
        - id: ch01-b29
          speaker: philip
          text: >-
            Don't try to break it gently. Just tell me straight out.
        - id: ch01-b30
          speaker: helen
          text: >-
            Tell you what?
        - id: ch01-b31
          speaker: philip
          text: >-
            What is it? I know how unexpected disasters happen. Someone always arrives, and then the family gets the awful news.
        - id: ch01-b32
          speaker: helen
          text: >-
            What awful news?
        - id: ch01-b33
          speaker: philip
          text: >-
            The disaster! Oh, Helen, I'm not a baby. Have we lost all our money because a bank failed? Is the landlord sending men to seize our furniture? Or are we going to be falsely accused of forgery, or burglary?
        - id: ch01-b34
          speaker: narrator
          text: >-
            Every book Philip had ever read helped him invent these gloomy possibilities. Helen laughed, and at once she felt him pull stiffly away from her arm.
        - id: ch01-b35
          speaker: helen
          text: >-
            No, no, my dear Pippin. Nothing dreadful like that has happened.
        - id: ch01-b36
          speaker: philip
          text: >-
            Then what has happened?
        - id: ch01-b37
          speaker: narrator
          text: >-
            His impatience was growing until it felt like a wolf gnawing inside him.
        - id: ch01-b38
          speaker: helen
          text: >-
            I didn't mean to tell you in a rush like this. Please don't worry, my boy of boys. It makes me very happy, and I hope it will make you happy too.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Philip swung around within her arm and looked at her in sudden delight.
        - id: ch01-b40
          speaker: philip
          text: >-
            Oh, Helen, I know! Someone you once helped into a railway carriage has left you a hundred thousand pounds a year. Now I can have a pony of my own to ride, can't I?
        - id: ch01-b41
          speaker: helen
          text: >-
            Yes, you can have a pony. But no one has left me any money. Listen, Pippin, and don't ask more questions. When I was little, like you, I had a dear friend. We played together all day, and we stayed friends when we grew up. He lived close by. Then he married someone else, and later she died. Now he wants me to marry him. He has plenty of horses, and a beautiful house and park too.
        - id: ch01-b42
          speaker: philip
          text: >-
            Where will I be?
        - id: ch01-b43
          speaker: helen
          text: >-
            With me, of course, wherever I am.
        - id: ch01-b44
          speaker: philip
          text: >-
            But it won't be only us two anymore. You said it always would be.
        - id: ch01-b45
          speaker: helen
          text: >-
            I didn't know then, dear Pip. He has wanted me for such a long time.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Philip thought that he wanted her too.
        - id: ch01-b47
          speaker: helen
          text: >-
            And he has a little girl for you to play with. Her name is Lucy, and she's only a year younger than you. You'll become the greatest friends. You can both have ponies to ride, and there will be so much for you to do.
        - id: ch01-b48
          speaker: philip
          text: >-
            I hate her! I hate him, and I hate their beastly ponies. And I hate you!
          emotion: angry
        - id: ch01-b49
          speaker: narrator
          text: >-
            With those dreadful words, Philip tore himself from her arm, rushed out, and slammed the door on purpose.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Helen found him in the boot cupboard among gaiters, rubber overshoes, cricket stumps, and old rackets. They kissed and cried and held each other. Philip said he was sorry for being naughty. But deep down, that was all he regretted. He was sorry he had hurt Helen. He still hated the man, and he hated Lucy most of all.
        - id: ch01-b51
          speaker: narrator
          text: >-
            He had to be polite to the man. Helen was very fond of him, which made Philip hate him even more and also made him hide it carefully. He knew that hating the man was not quite fair to the sister he loved. Nothing stood in the way of hating Lucy.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Helen had said Lucy was fair-haired and wore two braids. Philip imagined a fat, stumpy child exactly like the girl in “The Sugar Bread,” from Helen's old copy of “Shock-Headed Peter.”
        - id: ch01-b53
          speaker: narrator
          text: >-
            Helen was perfectly happy. She divided her love between the boy she adored and the man she would marry, believing they were as happy as she was. The man, Peter Graham, was happy enough. Philip was often amused, because Helen made sure of that, but beneath it he was miserable.
        - id: ch01-b54
          speaker: narrator
          text: >-
            The wedding day came and went. On a very hot afternoon, strange trains and a strange carriage carried Philip to a strange house. A strange nurse welcomed him there, and so did Lucy.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Before he went, Helen had asked whether he minded staying at Peter's beautiful house without her. Everyone would be kind, she had said, and Lucy would be there to play with him. Philip said he did not mind. What else could he say without being naughty and making Helen cry again?
        - id: ch01-b56
          speaker: narrator
          text: >-
            Lucy was nothing like the Sugar-Bread child. Her fair hair was indeed parted into two braids, but they were long and straight. Lucy herself was tall and thin, with freckles and bright, merry eyes.
        - id: ch01-b57
          speaker: lucy
          text: >-
            I'm so glad you're here! Now we can play all the games that one person can't play alone. I'm an only child.
        - id: ch01-b58
          speaker: narrator
          text: >-
            She said this with a kind of melancholy pride, and then she laughed.
        - id: ch01-b59
          speaker: lucy
          text: >-
            “Only” rhymes with “lonely,” doesn't it?
        - id: ch01-b60
          speaker: philip
          text: >-
            I don't know.
        - id: ch01-b61
          speaker: narrator
          text: >-
            That was deliberately false. Philip knew very well, but he said nothing else. Lucy tried two or three more ways to begin talking, and he contradicted every single thing she said.
        - id: ch01-b62
          speaker: lucy
          text: >-
            I'm afraid he's very, very stupid.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Her extremely well-trained nurse agreed firmly. The next day, Lucy's young and affectionate aunt came to see her. Lucy reported that the new boy was not only stupid but disagreeable too. Philip went on behaving so badly that he proved her point completely. The aunt had Lucy's clothes packed at once and carried her away for a visit of several days.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Philip and the nurse were left at the Grange. Apart from the servants, no one else was there. Now Philip began to understand what loneliness meant. Helen sent a letter and a picture postcard every day from the strange European towns she visited on her honeymoon. They did not comfort him. They only made him angry, because they reminded him of the days when Helen had been his alone and close enough not to need letters.
        - id: ch01-b65
          speaker: narrator
          text: >-
            The nurse wore a grey uniform with a white cap and apron. Deep within her well-disciplined nature, she thoroughly disapproved of Philip. To herself, she called him a bad-tempered little pig.
        - id: ch01-b66
          speaker: nurse
          text: >-
            He is an unusually difficult and unpleasant child. I should think his education has been badly neglected. What he needs is a firm hand.
        - id: ch01-b67
          speaker: narrator
          text: >-
            She said this to the housekeeper, though she never used a firm hand on Philip. Instead, she treated him with an indifference that annoyed him even more than strictness would have done. He had enormous freedom, but it was empty and lonely freedom.
        - id: ch01-b68
          speaker: narrator
          text: >-
            The whole great house was open for him to wander through, but he was not allowed to touch a thing. The whole garden was open too, but he could pick neither flowers nor fruit. It was true that he had no lessons. Then again, he had no games either. No one shut him in the nursery, or even suggested that he spend his time there. They simply sent him out to walk alone, since the park was large and considered safe.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Yet the nursery drew him more than any other room in that great house. It was full of the most wonderful toys. A rocking horse stood there, almost as big as a real pony, beside the finest dollhouse Philip had ever seen. There were boxes of toy tea things and boxes of bricks, both wooden ones and terra-cotta ones. There were puzzle maps, dominoes, chessmen, checkers, and nearly every kind of toy or game a child had ever owned or wished to own.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Philip was forbidden to play with any of them.
        - id: ch01-b71
          speaker: nurse
          text: >-
            You must not touch anything, if you please. The toys belong to Miss Lucy. No, I cannot take responsibility for letting you play with them. I will not trouble Miss Lucy by writing to ask her. And no, I cannot give you her address.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Boredom and longing had humbled Philip enough to ask, but the nurse would not help him.
        - id: ch01-b73
          speaker: narrator
          text: >-
            For two whole days he lived at the Grange, hating the place and everyone in it. The servants took their cue from the nurse, and Philip felt that there was not one friend for him in the entire house. Somehow he had fixed it in his mind that Helen must not be troubled about anything just then. So he wrote to say he was quite well, thank you, the park was very pretty, and Lucy had many nice toys.
        - id: ch01-b74
          speaker: narrator
          text: >-
            He felt brave and noble, like a martyr, and set his teeth to endure it all. Staying there was like spending several days at the dentist's.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Then everything changed at once. The nurse received a telegram. Her brother, long believed drowned at sea, had suddenly come home. She had to go and see him.
        - id: ch01-b76
          speaker: nurse
          text: >-
            I am going, even if it costs me my position.
        - id: ch01-b77
          speaker: housekeeper
          text: >-
            Oh, very well, go. I'll take responsibility for the boy, the sulky little brat.
        - id: ch01-b78
          speaker: narrator
          text: >-
            The nurse packed her boxes in a joyful rush. As she climbed into the dogcart, Philip watched from the doorstep. Then he suddenly darted forward and almost stumbled into the moving wheel. It was the first time he had ever called her by any name.
        - id: ch01-b79
          speaker: philip
          text: >-
            Oh, Nurse! Please say I may take Lucy's toys to play with. It is so lonely here. I may, mayn't I? May I take them?
        - id: ch01-b80
          speaker: narrator
          text: >-
            Perhaps her happiness, and the thought of her brother alive after all, had softened the nurse's heart. Or perhaps she was in such a hurry that she hardly knew what she was saying. Philip asked a third time.
        - id: ch01-b81
          speaker: philip
          text: >-
            May I take them?
        - id: ch01-b82
          speaker: nurse
          text: >-
            Bless the child! Take anything you like. Keep away from that wheel, for goodness' sake. Goodbye, everyone!
          emotion: happy
        - id: ch01-b83
          speaker: narrator
          text: >-
            She waved to the servants gathered at the top of the broad steps and was carried away toward her joyful reunion with the brother who had not drowned.
        - id: ch01-b84
          speaker: narrator
          text: >-
            Philip took a deep, satisfied breath. He went straight to the nursery, brought out all the toys, and inspected every one. That occupied the whole afternoon.
        - id: ch01-b85
          speaker: narrator
          text: >-
            The next day he looked through all the toys again, and this time he longed to make something with them. Philip knew the special delight that came from making things. At home, he and Helen had built many cities for their dream island. They used his own two boxes of bricks, but they never stopped there. They also built with her Japanese cabinet, dominoes, chessmen, cardboard boxes, books, and the lids of kettles and teapots. The one trouble had always been that they never had enough bricks. Here, Lucy had enough bricks for anything Philip could imagine.
        - id: ch01-b86
          speaker: narrator
          text: >-
            He began a city on the nursery table. But plain bricks were disappointing when you were used to building with every sort of object.
        - id: ch01-b87
          speaker: philip
          text: >-
            It looks like a factory.
        - id: ch01-b88
          speaker: narrator
          text: >-
            Discontented, he swept the building down and returned the bricks to their boxes.
        - id: ch01-b89
          speaker: philip
          text: >-
            There must be something useful downstairs. And she did say I could take anything I liked.
        - id: ch01-b90
          speaker: narrator
          text: >-
            He carried everything downstairs by the armful, taking two or three boxes on each trip. Down came the bricks and wooden blocks, followed by the checkers, chessmen, and dominoes. He took it all into the long drawing-room. Crystal chandeliers hung overhead, the chairs were protected by brown covers, and a row of tall windows filled the room with light. Best of all, the cabinets and tables were crowded with fascinating objects.
        - id: ch01-b91
          speaker: narrator
          text: >-
            Philip cleared a large writing table. He removed such useless, unimportant things as the blotting pad, silver inkstand, and red-backed books. At last he had an open space for his city, and he began to build.
        - id: ch01-b92
          speaker: narrator
          text: >-
            From a black-and-gold cabinet across the room, a bronze Egyptian god seemed to watch him.
        - id: ch01-b93
          speaker: philip
          text: >-
            All right. I'll make a temple for you. Just wait.
        - id: ch01-b94
          speaker: narrator
          text: >-
            The bronze god waited while the temple slowly rose. Philip used two silver candlesticks as pillars for the entrance and crowned each one with a chessman. Then he went all the way back to the nursery to fetch the animals from Noah's Ark. He stood each of the two elephants on a brick and placed one on either side of the doorway.
        - id: ch01-b95
          speaker: narrator
          text: >-
            The temple looked magnificent, like the Assyrian temples Helen had shown him in pictures. But wherever he used bricks alone, they looked mean and dreary, like factories or workhouses. Bricks by themselves always did.
        - id: ch01-b96
          speaker: narrator
          text: >-
            Philip explored again and found the library. After several trips, he had brought back twenty-seven books bound in white vellum with marbled covers, a set of Shakespeare, and ten green leather volumes. With them he made pillars and shadowy cloisters. More animals from the ark gave the building an Egyptian look.
        - id: ch01-b97
          speaker: susan
          text: >-
            Lor', isn't it pretty! You are clever with your hands, Master Philip, I'll say that for you. But you'll catch it for taking all those things.
        - id: ch01-b98
          speaker: narrator
          text: >-
            The parlor maid had come to call him to tea.
        - id: ch01-b99
          speaker: philip
          text: >-
            That grey nurse said I could. Building with things doesn't hurt them. My sister and I always built this way at home.
        - id: ch01-b100
          speaker: narrator
          text: >-
            Philip looked trustingly at the maid. She had admired his work, and she was the first person in that house to whom he had spoken about Helen.
        - id: ch01-b101
          speaker: susan
          text: >-
            Well, it's as good as a peep show. It looks just like the picture postcards my brother sends from India, with all those pillars and domes and animals. I don't know how you ever think up such things.
        - id: ch01-b102
          speaker: narrator
          text: >-
            Praise was sweet. Philip slipped his hand into Susan's as they walked down the broad staircase. His tea waited in the hall, a tiny tray set on a huge dark table.
        - id: ch01-b103
          speaker: susan
          text: >-
            He's not half a bad child. That nurse scared him out of his wits with her prim ways, you can depend on it. Speak civilly to him, and he's civil enough to you.
        - id: ch01-b104
          speaker: cook
          text: >-
            Miss Lucy didn't scare him, did she? Just remember how he treated her.
        - id: ch01-b105
          speaker: upper_housemaid
          text: >-
            At least he's quiet. You never hear a sound from him all day. He seems rather silly to me.
        - id: ch01-b106
          speaker: susan
          text: >-
            Just go in and see what he's built. You won't call him silly after that. India and all its pagodas can't beat it.
        - id: ch01-b107
          speaker: narrator
          text: >-
            Once Philip was in bed, every servant slipped into the drawing-room to look. The building had grown, though it was not finished.
        - id: ch01-b108
          speaker: susan
          text: >-
            I won't touch one thing. Let him play with it tomorrow. We'll put it all away before that nurse comes back with her caps and collars and her stuck-up ways.
        - id: ch01-b109
          speaker: narrator
          text: >-
            So Philip continued building the next day, and he put in everything he could think of. He used the dominoes and their box, bricks and books, and cotton reels that he begged from Susan. The cook contributed a collar box and several cake tins. Philip turned the dominoes into steps and made a broad terrace from the domino box.
        - id: ch01-b110
          speaker: narrator
          text: >-
            He brought southernwood from the garden and fixed little pieces into cotton reels. They looked like bay trees growing in tubs. Brass finger bowls became domes. The lids of brass kettles and coffee pots from the oak dresser became dazzling minarets, and chessmen made useful minarets too.
        - id: ch01-b111
          speaker: philip
          text: >-
            Now I need paved paths and a fountain.
        - id: ch01-b112
          speaker: narrator
          text: >-
            He paved the paths with shining mother-of-pearl counters from a card game. For the fountain, he chose an ashtray made of silver and glass. In its center he stood a needle case made of delicate silverwork. Then he took the silver paper from the chocolate Helen had given him when they parted. He cut it into narrow strips, and those strips made the falling water.
        - id: ch01-b113
          speaker: narrator
          text: >-
            Helen had taught him how to make palm trees. He fastened pieces of larch to elder stems with modeling clay. Lucy's toys supplied plenty of clay. In fact, they supplied plenty of everything.
        - id: ch01-b114
          speaker: narrator
          text: >-
            The city kept growing until it covered the whole table. Philip was not tired. He immediately began another city on a second table. Its grandest feature was a huge water tower, with a fountain circling its base. By now he would stop at nothing when he needed building material. He even unhooked the hanging crystal drops from the great chandeliers and used them to make his fountains sparkle.
        - id: ch01-b115
          speaker: narrator
          text: >-
            This city was grander than the first. A wastepaper basket became a mighty tower, and a machine for enlarging photographs became an astrologer's tower.
        - id: ch01-b116
          speaker: narrator
          text: >-
            The two cities were truly beautiful. To describe them completely would take pages and pages. Besides all the things already mentioned, there were towers and turrets, great staircases, pagodas, and pavilions. Canals crossed the cities, their water made from strips of shining silver paper. There was even a lake with a boat floating on it.
        - id: ch01-b117
          speaker: narrator
          text: >-
            Philip borrowed everything useful from the dollhouse, including the wooden food and dishes and the little lead cups and goblets. Dominoes and pawns became citizens. The handsome chessmen served as minarets. He built forts and filled them with lead soldiers.
        - id: ch01-b118
          speaker: narrator
          text: >-
            He worked hard and cleverly. As the cities became more beautiful and more interesting, he loved them more and more. Philip was happy now. He had no time left for unhappiness.
        - id: ch01-b119
          speaker: philip
          text: >-
            I'll leave everything just like this until Helen comes. Oh, how she will love it!
          emotion: happy
        - id: ch01-b120
          speaker: narrator
          text: >-
            He joined the two cities with a bridge made from a yardstick found in the servants' sewing room. No one tried to stop him, because by then all the servants were his friends. Susan had simply been the first.
        - id: ch01-b121
          speaker: narrator
          text: >-
            Philip laid the bridge in place and put Mr. and Mrs. Noah in the main square to stand for the inhabitants. He was gazing at his work in delight when a hard hand seized each shoulder. He started and screamed.
        - id: ch01-b122
          speaker: narrator
          text: >-
            The nurse had returned a day earlier than anyone expected. Her brother had come home with a wife, and the wife and the nurse had taken an instant dislike to each other. So the nurse came back in a very bad temper. She gripped Philip by both shoulders and shook him. In all his life, no one had ever treated him that way before.
        - id: ch01-b123
          speaker: nurse
          text: >-
            You wicked, disobedient boy!
          emotion: angry
        - id: ch01-b124
          speaker: philip
          text: >-
            But I haven't damaged anything. I'll put it all back.
          emotion: fearful
        - id: ch01-b125
          speaker: narrator
          text: >-
            Philip was trembling, and his face had gone very pale.
        - id: ch01-b126
          speaker: nurse
          text: >-
            You will never touch any of it again. I'll put everything away myself tomorrow. How dare you take what isn't yours?
          emotion: angry
        - id: ch01-b127
          speaker: philip
          text: >-
            You told me I could take anything I liked. If it was wrong, then it was your fault.
        - id: ch01-b128
          speaker: nurse
          text: >-
            What a lying child you are!
          emotion: angry
        - id: ch01-b129
          speaker: narrator
          text: >-
            She snatched up the yardstick and struck his knuckles. No one had ever hit Philip before. His face grew even paler, but he did not cry, though his hands hurt badly. The yardstick was hard, with sharp corners.
        - id: ch01-b130
          speaker: philip
          text: >-
            You're a coward. You're the one who is lying, not me.
          emotion: angry
        - id: ch01-b131
          speaker: nurse
          text: >-
            Be quiet!
          emotion: angry
        - id: ch01-b132
          speaker: narrator
          text: >-
            She swept him away to bed and tucked him in angrily.
        - id: ch01-b133
          speaker: nurse
          text: >-
            And you will have no supper. There!
          emotion: angry
        - id: ch01-b134
          speaker: philip
          text: >-
            I don't want any. And I must forgive you before the sun goes down.
        - id: ch01-b135
          speaker: nurse
          text: >-
            Forgive me, indeed!
          emotion: angry
        - id: ch01-b136
          speaker: narrator
          text: >-
            She flounced out of the room.
        - id: ch01-b137
          speaker: philip
          text: >-
            When you become sorry, you'll find out that I've already forgiven you!
        - id: ch01-b138
          speaker: narrator
          text: >-
            Calling after her only made the nurse angrier. Whether Philip cried once he was alone is no concern of ours. Susan had watched the shaking and striking without daring to interfere. Later she crept upstairs with milk and sponge cakes, but Philip was asleep. She said his eyelashes were wet.
        - id: ch01-b139
          speaker: narrator
          text: >-
            When Philip woke, the room was so bright that he first thought morning had come. Then he saw it was not yellow sunlight. White moonlight filled the room with its beautiful brightness.
        - id: ch01-b140
          speaker: narrator
          text: >-
            At first he could not remember why he felt so unhappy. Then it all returned to him. Helen had gone away, and the nurse had treated him hatefully. In the morning she would pull down the city before Helen could ever see it. Philip felt certain that he would never manage to build another city so beautiful. Once this one was gone, he would not even be able to remember how he had put it together.
        - id: ch01-b141
          speaker: narrator
          text: >-
            The moonlight was very bright.
        - id: ch01-b142
          speaker: philip
          text: >-
            I wonder what my city looks like in the moonlight.
        - id: ch01-b143
          speaker: narrator
          text: >-
            In one thrilling instant, he decided to go downstairs and see.
        - id: ch01-b144
          speaker: narrator
          text: >-
            Philip put on his dressing gown, softly opened his door, and crept along the corridor. He went down the broad staircase, through the gallery, and into the drawing-room. It was very dark. Feeling his way to a window, he opened the shutter. There was his city, covered in moonlight, exactly as he had imagined.
        - id: ch01-b145
          speaker: narrator
          text: >-
            For a moment he gazed at it in delight. Then he turned to close the door. A strange little dizziness came over him, and he stood with one hand pressed to his head.
        - id: ch01-b146
          speaker: narrator
          text: >-
            He turned back toward the city. As he drew near, he gave a small cry and quickly smothered it, afraid someone would hear and send him back to bed. Bewildered and dizzy again, he stared around him.
        - id: ch01-b147
          speaker: narrator
          text: >-
            There had been one quick flash of light, and then darkness. Now the city had disappeared. The drawing-room was gone too, and so was the chair that had stood close to the table. Far away, mountainous shapes rose to enormous heights, and moonlight shone across their tops. Philip himself seemed to be standing in the middle of a vast, level plain.
        - id: ch01-b148
          speaker: narrator
          text: >-
            Long grass felt soft around his feet. No trees, houses, hedges, or fences broke the wide stretch of land. Some parts were darker than others, but that was all. It reminded him of the endless prairies in his adventure books.
        - id: ch01-b149
          speaker: philip
          text: >-
            I suppose I'm dreaming, though I can't see how I fell asleep while I was turning the door handle. Still, it must be a dream.
        - id: ch01-b150
          speaker: narrator
          text: >-
            Philip stood still and waited for something to happen. Something always happens in dreams, even if it is only that the dream ends. Nothing happened now. He simply stood there, feeling the warm, soft grass around his ankles.
        - id: ch01-b151
          speaker: narrator
          text: >-
            As his eyes grew used to the dark, he saw a very steep bridge some distance away. It climbed toward a dark height with moonlight shining white at the top. Philip walked toward it and found that it was more like a ladder than a bridge. It rose dizzyingly high above him.
        - id: ch01-b152
          speaker: narrator
          text: >-
            The ladder seemed to rest against a rock far overhead, black against the sky. Inside that rock was a vast, hollow cave. At the foot of the ladder, Philip saw that it had no rungs. Instead, narrow ledges gave his hands and feet something to hold.
        - id: ch01-b153
          speaker: narrator
          text: >-
            He remembered Jack and the Beanstalk and looked upward with longing. But the ladder was very, very long. Still, it was the only thing that led anywhere. Philip had stood alone on the grassy plain long enough. He put his hands and feet on the ladder and started climbing.
        - id: ch01-b154
          speaker: narrator
          text: >-
            It was a terribly long climb. Philip counted three hundred and eight steps. They ran along only one side of the ladder, so he had to move with great care. Up he went, then farther up, until his feet ached and his hands felt ready to fall off from weariness.
        - id: ch01-b155
          speaker: narrator
          text: >-
            He could not look very far upward, and he dared not look down at all. There was nothing to do but climb, climb, and climb. At last he saw the ground where the ladder ended. It was a terrace cut in straight lines from what seemed to be solid rock.
        - id: ch01-b156
          speaker: narrator
          text: >-
            First his head rose level with the terrace, then his hands, and finally his feet. He sprang sideways off the ladder and dropped facedown on ground as cold and smooth as marble. He lay there, taking deep breaths of exhaustion and relief.
        - id: ch01-b157
          speaker: narrator
          text: >-
            A great silence rested all around him, and it soothed him. After a while Philip stood and looked about. Nearby was an archway supported by very thick pillars. He moved closer and peered cautiously through.
        - id: ch01-b158
          speaker: narrator
          text: >-
            The arch seemed to be a great gate opening into a wide space. Beyond it, dim shapes stood like churches and houses. Everything was deserted. Whatever this place might be, only Philip and the moonlight seemed to be awake.
        - id: ch01-b159
          speaker: philip
          text: >-
            I suppose everyone has gone to bed.
        - id: ch01-b160
          speaker: narrator
          text: >-
            He remained in the black shadow of the strange arch, trembling a little, but filled with curiosity.
