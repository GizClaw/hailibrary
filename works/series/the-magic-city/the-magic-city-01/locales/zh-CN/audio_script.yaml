audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖沉着，带一点机敏的幽默
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中
    philip:
      display_name: 菲利普
      tts:
        delivery: 直率敏感，想象丰富，情绪来得快
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    helen:
      display_name: 海伦
      tts:
        delivery: 亲切能干，温柔中带着活泼
        timbre: 温暖明亮
        pace: 从容
        pitch: 中
    peter:
      display_name: 彼得·格雷厄姆
      tts:
        delivery: 礼貌自信
        timbre: 稳定浑厚
        pace: 适中
        pitch: 中低
    lucy:
      display_name: 露西
      tts:
        delivery: 开朗友好，坦率好奇
        timbre: 轻盈稚嫩
        pace: 轻快
        pitch: 中高
    nurse:
      display_name: 保姆
      tts:
        delivery: 一板一眼，克制严厉
        timbre: 冷硬清楚
        pace: 稍慢
        pitch: 中
    housekeeper:
      display_name: 管家太太
      tts:
        delivery: 干脆冷淡
        timbre: 干涩结实
        pace: 适中
        pitch: 中低
    susan:
      display_name: 苏珊
      tts:
        delivery: 朴实热心，容易为好东西惊叹
        timbre: 亲切质朴
        pace: 自然
        pitch: 中
    cook:
      display_name: 厨娘
      tts:
        delivery: 实际而多疑
        timbre: 饱满直白
        pace: 适中
        pitch: 中低
    upper_housemaid:
      display_name: 楼上女仆
      tts:
        delivery: 随意，略带怀疑
        timbre: 轻淡朴素
        pace: 平稳
        pitch: 中
  chapters:
    - id: ch01
      title: 第一章　开端
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            菲利普·霍尔丹和姐姐住在一座红屋顶的小房子里，那房子又在一个尽是红屋顶的小镇上。他们有小花园、小阳台、小马厩，马厩里有匹小马，还有一辆让小马拉的小车。凸窗前挂着金丝雀，干净利落的小女仆把样样东西都收拾得闪闪发亮，像刚出盒的新针。
        - id: ch01-b02
          speaker: narrator
          text: >-
            菲利普只有姐姐，姐姐也只有菲利普。父母去世后，比他大二十岁的海伦虽说只是同父异母的姐姐，却成了他唯一知道的母亲。菲利普从不羡慕别的男孩，因为海伦善良、聪明，又可亲。她几乎把时间都给了他，教他功课，陪他玩，还会想出最奇妙的游戏和冒险。每天醒来，菲利普都知道，快乐又有趣的新一天开始了。一直到十岁，他都认定日子会永远这样过下去。
        - id: ch01-b03
          speaker: narrator
          text: >-
            变化从一次野餐以后开始。那天，姐弟俩去了有瀑布的树林。回家时，敦实的老马拉着车。它又乖又稳，所以缰绳交在菲利普手里。快到自家路口时，海伦开口了。
        - id: ch01-b04
          speaker: helen
          text: 明天我们给紫菀花圃除除草，再到花园里喝茶吧。
        - id: ch01-b05
          speaker: philip
          text: 好极了！
        - id: ch01-b06
          speaker: narrator
          text: >-
            转过街角，他们看见了自家的白色小门，也看见一个陌生男人正从门里出来。男人朝他们走来。海伦把手按到缰绳上，可她一向教菲利普，赶车时绝对不该这样做。小马停下了。那男人用菲利普心里的话说，就是“个子高高，满身花呢”。他从马鼻子前横穿过去，站在海伦一边的车轮旁。海伦照常跟他问好，接着，两个人竟说起了悄悄话。海伦明明教过他，当面耳语很无礼。菲利普只听见“终于”“如今结束了”，还有“那么，就今晚”。
        - id: ch01-b07
          speaker: helen
          text: 这是我弟弟菲利普。
        - id: ch01-b08
          speaker: narrator
          text: 男人隔着海伦跟菲利普握手。菲利普知道，这也不合礼数。
        - id: ch01-b09
          speaker: peter
          text: 希望我们以后能成为最要好的朋友。
        - id: ch01-b10
          speaker: philip
          text: 您好。
        - id: ch01-b11
          speaker: narrator
          text: 礼貌上就该这么答。可菲利普心里想的是，我才不要跟你做朋友。
        - id: ch01-b12
          speaker: narrator
          text: >-
            男人脱帽走了。回到家，菲利普总觉得海伦哪里不一样了。他比平常早上床，却久久睡不着。先是前门铃响，后来楼下的小客厅里传来男人和海伦的声音，一直说个没完。他好不容易睡着，醒来时却看见一个灰暗、下着雨的早晨。他找不到领扣，穿袜子时扯破了一只，关门又夹了手指，最后还摔碎了盛着水的刷牙杯，水全灌进靴子里。有些早晨就是这样。这天正是一个。
        - id: ch01-b13
          speaker: narrator
          text: >-
            早饭也没有平时好吃。菲利普当然迟到了。海伦还是用那种欢快的声音告诉他，咸肉等得连油都发灰了。以前，这个声音说出的总是他最爱听的话，可这回他笑不出来。窗外灰雨不停敲打玻璃，这不是一个适合微笑的早晨。
        - id: ch01-b14
          speaker: helen
          text: 花园茶会得一直往后推了。雨这么大，功课也没法上。
        - id: ch01-b15
          speaker: narrator
          text: 这是海伦那些可爱主意中的一个。她一向就是这么想的，下雨天已经够糟了，可不能再让一堂堂功课把它弄得更糟。
        - id: ch01-b16
          speaker: helen
          text: 那我们玩什么？聊聊那座岛，好不好？我再画张地图，把花园、喷泉和秋千都添进去？
        - id: ch01-b17
          speaker: narrator
          text: >-
            那座岛是他们最爱的游戏。它在温暖的大海上，那里有棕榈树，还有彩虹颜色的沙滩。他们把一切喜爱和想要的东西都放到自己的岛上。菲利普怎么谈也不厌，有时几乎相信它真的存在。他是国王，海伦是王后，别人谁也不能来。岛上只有他们两个。
        - id: ch01-b18
          speaker: narrator
          text: >-
            可这天，就连岛也不能让菲利普高兴。他走到窗边，闷闷地看着泡透的草地、滴水的金链花树，还有铁门上一排饱满的雨珠。
        - id: ch01-b19
          speaker: helen
          text: 小菲，你怎么啦？不会是要出讨厌的麻疹，或是发滚烫的猩红热，又或者要得咳个不停的百日咳吧？
        - id: ch01-b20
          speaker: narrator
          text: 海伦走过来，把手贴到他的额头上。
        - id: ch01-b21
          speaker: helen
          text: 哎呀，还真有点烫。我的心肝宝贝，告诉姐姐，怎么了？
        - id: ch01-b22
          speaker: philip
          text: 该是你告诉我。
        - id: ch01-b23
          speaker: helen
          text: 告诉你什么呀，小菲？
        - id: ch01-b24
          speaker: philip
          text: >-
            你觉得应该像书里的人那样，自己一个人忍住，显得很高尚。可你一定得告诉我。海伦，你答应过永远不会瞒着我。你明明答应过。
        - id: ch01-b25
          speaker: narrator
          text: >-
            海伦搂住他，却没有说话。菲利普从这沉默里猜出了最可怕的结局。雨水在落水管里咕噜响，又滴到常春藤上。绿笼里的金丝雀歪着头，啄出一片种子壳，正甩到菲利普脸上，又挑衅似的叫了几声。海伦还是不说话。
        - id: ch01-b26
          speaker: philip
          text: 别慢慢说，让我一点点难受。你干脆直接告诉我吧。
        - id: ch01-b27
          speaker: helen
          text: 你到底要我说什么？
        - id: ch01-b28
          speaker: philip
          text: >-
            究竟出了什么事？我知道，突如其来的灾祸都是这样来的。总会先来一个人，然后家里人才听到那个消息。
        - id: ch01-b29
          speaker: helen
          text: 什么消息？
        - id: ch01-b30
          speaker: philip
          text: >-
            灾祸呀！海伦，我已经不是小婴儿了，快告诉我吧！我们的钱是不是全被倒闭的银行吞了？还是房东要叫法警来扣押家具？或者有人诬告我们伪造文书，说我们是窃贼？
        - id: ch01-b31
          speaker: narrator
          text: 菲利普读过的书一起在脑子里开动，替他想出了这些悲惨的可能。海伦一笑，马上感觉弟弟僵起身子，从她怀里挣开了一点。
        - id: ch01-b32
          speaker: helen
          text: 不是，不是，亲爱的小菲。根本没有发生那种可怕的事。
        - id: ch01-b33
          speaker: narrator
          text: 菲利普心里的焦躁越来越厉害，像有只狼正在里面啃咬。
        - id: ch01-b34
          speaker: philip
          text: 那到底是什么？
        - id: ch01-b35
          speaker: helen
          text: >-
            我本来不想这么急着全告诉你。可别担心，我最最亲爱的男孩。这件事让我非常幸福，我希望也会让你幸福。
        - id: ch01-b36
          speaker: narrator
          text: 菲利普猛地在她臂弯里转过身，满脸惊喜地望着她。
        - id: ch01-b37
          speaker: philip
          text: >-
            噢，海伦，我知道了！有人每年留给你十万英镑，一定是因为你从前替他开过火车车厢门。现在我可以有一匹真正属于自己的骑乘小马了，对不对？
          emotion: happy
        - id: ch01-b38
          speaker: helen
          text: >-
            对，你会有一匹小马。可没人留给我钱。听我说，小菲，先别问，我来告诉你。我像你这么小时，有一个很要好的朋友，我们整天一起玩。长大以后，我们还是朋友，他就住在附近。后来他娶了别人，再后来，那个人去世了。现在他想娶我。他有许多马，还有一幢漂亮的房子和一座庄园。
        - id: ch01-b39
          speaker: philip
          text: 那我会在哪里？
        - id: ch01-b40
          speaker: helen
          text: 当然跟我在一起。我到哪儿，你就到哪儿。
        - id: ch01-b41
          speaker: philip
          text: 可那就不再只有我们两个了。你说过，永远永远都只会有我们两个。
        - id: ch01-b42
          speaker: helen
          text: 可我那时候不知道呀，亲爱的小菲。他已经等了我那么久——
        - id: ch01-b43
          speaker: narrator
          text: 菲利普心里在问，难道我不盼着你吗？
        - id: ch01-b44
          speaker: helen
          text: >-
            他还有个小女儿，你一定很喜欢跟她玩。她叫露西，只比你小一岁。你们准会成为最好的朋友。你们俩都会有小马骑，而且——
        - id: ch01-b45
          speaker: philip
          text: 我恨她！我恨他，也恨他们那些讨厌的小马。我还恨你！
          emotion: angry
        - id: ch01-b46
          speaker: narrator
          text: >-
            喊出这些吓人的话，菲利普挣开海伦，冲出房间，还故意把门摔得震天响。后来，海伦在放靴子的壁橱里找到他。马裤、橡胶套鞋、板球桩和旧球拍堆在旁边。他们亲吻、哭泣，紧紧拥抱。菲利普承认自己那样不乖，很对不起海伦。可在心底，他只为惹海伦伤心这一件事抱歉，并不觉得自己的恨意错了。他仍旧恨“那个男人”，而他最恨的还是从未见过的露西。
        - id: ch01-b47
          speaker: narrator
          text: >-
            对那个男人，他不能不讲礼貌。姐姐越喜欢那男人，菲利普就越恨他，却也越小心，不肯露出恨意。他还觉得，恨那男人好像有点对不住自己深爱的姐姐。可一想到露西，就没有这种感情来碍事了。海伦说，露西头发浅，梳着两条辫子。菲利普便把她想成一个又矮又胖的小姑娘，活像海伦小时候那本旧《蓬头彼得》里《糖面包》故事中的女孩。
        - id: ch01-b48
          speaker: narrator
          text: >-
            海伦快乐极了。她把爱分给疼爱的男孩和即将嫁给的男人，还以为他们都跟自己一样幸福。彼得·格雷厄姆确实相当幸福。菲利普呢，海伦总有办法逗他开心，所以他也常觉得有趣，可在那一层乐趣底下，他一直痛苦不堪。
        - id: ch01-b49
          speaker: narrator
          text: >-
            婚礼那天终于来了，又过去了。一个炎热的下午，菲利普坐着一列列从未坐过的火车，又换乘一辆陌生的马车，来到一幢完全陌生的房子。那里没有海伦。迎接他的是一位陌生的保姆，还有露西。
        - id: ch01-b50
          speaker: helen
          text: 你不会介意不跟我在一起，自己去彼得的漂亮房子住吧？人人都会好好待你，还有露西陪你玩。
        - id: ch01-b51
          speaker: narrator
          text: 菲利普说不介意。他还能怎么回答呢？难道又要不乖，再惹海伦哭一次吗？
        - id: ch01-b52
          speaker: narrator
          text: >-
            露西一点也不像《糖面包》里的女孩。她的头发的确是浅色的，也编成两条辫子，可那辫子又长又直。她本人又瘦又高，脸上长着雀斑，一双眼睛明亮又快活。
        - id: ch01-b53
          speaker: lucy
          text: >-
            你来了，我真高兴！现在我们可以玩各种一个人玩不成的游戏啦。我是家里唯一的孩子。“唯一”听着很像“孤零零”，是不是？
          emotion: happy
        - id: ch01-b54
          speaker: philip
          text: 我不知道。
        - id: ch01-b55
          speaker: narrator
          text: >-
            他明明知道，却故意撒谎，说完就不肯再开口。露西又试着找了两三次话题，可她说什么，菲利普都要反驳。
        - id: ch01-b56
          speaker: lucy
          text: 我看，他真的、真的很笨。
        - id: ch01-b57
          speaker: narrator
          text: >-
            那位训练极其有素的保姆坚定地赞同露西。第二天姨妈来探望时，露西又说，新来的男孩不但笨，还很讨厌。菲利普故意把自己的行为弄得更加讨厌，彻底证实了她的评价。那位姨妈年轻又疼爱露西，马上叫人把露西的衣服收拾起来，带她离开庄园，去小住几天。
        - id: ch01-b58
          speaker: narrator
          text: >-
            庄园里只留下菲利普和保姆，房子里除了仆人再没有别人。菲利普这才开始明白，孤独到底是什么意思。海伦正在欧洲大陆度蜜月，每到一座稀奇古怪的小城，都会给他寄来信和风景明信片，而且每天都寄。可这些东西一点也不能安慰男孩，只让他越来越恼火。每一张明信片都在提醒他，从前姐姐完完全全属于他，两个人天天在一起，近得根本不需要靠信件来说话。
        - id: ch01-b59
          speaker: narrator
          text: >-
            保姆穿着灰制服，戴白帽子，系白围裙。她那颗管教得同样有素的心，对菲利普厌恶到了最深处。她暗地里叫他“执拗的小猪猡”。
        - id: ch01-b60
          speaker: nurse
          text: 这孩子格外难管，性情也很讨厌。我看，他的教养一定疏忽得厉害，非得有人严加管束不可。
        - id: ch01-b61
          speaker: narrator
          text: >-
            可她并没有真的严厉管他。她只是不理不睬，这比专横地管他更叫人难受。菲利普拥有极大的自由，却是一种空荡荡的自由。偌大的宅子任他来来去去，可里面什么都不能碰。花园任他闲逛，可一朵花、一个果子也不能摘。他的确不用上课，却也没有游戏可玩。他没有被关在游戏室里，甚至没人劝他到那里消磨时间。大家只把他独自打发出去散步，因为庄园又大又安全。偏偏整座宅子里，他最喜欢的就是那间不欢迎他的游戏室。
        - id: ch01-b62
          speaker: narrator
          text: >-
            那里摆满迷人的玩具。有跟真小马一样大的摇摆木马，有你见过的最精美的玩偶屋，还有一盒盒茶具和积木。积木有木制的，也有赤陶的。拼图地图、多米诺骨牌、国际象棋、英国跳棋，凡是你有过或想要的玩具和游戏，那里都有。
        - id: ch01-b63
          speaker: narrator
          text: 可是，小菲一件也不能玩。
        - id: ch01-b64
          speaker: nurse
          text: >-
            劳驾，什么都不要碰。玩具是露西小姐的。不行，我不能担责任，准许你玩。不行，我不会为了问你能不能玩，写信去打扰露西小姐。不行，我也不能擅自把露西小姐的地址给你。
        - id: ch01-b65
          speaker: narrator
          text: 菲利普实在无聊，也实在想玩，竟低声下气地求到了这个地步。
        - id: ch01-b66
          speaker: narrator
          text: >-
            整整两天，他住在庄园里，恨这里，也恨这里每一个人。仆人都看保姆的脸色，他觉得整幢房子里没有一个朋友。不知怎么，他认定这阵子无论出什么事，都不该去烦海伦。所以他写信说，自己很好，谢谢挂念，庄园很漂亮，露西有许多好玩的玩具。他觉得自己勇敢又高尚，像个殉难者。他咬紧牙关，准备忍受一切。这就像在牙医那里一连住上好几天。
        - id: ch01-b67
          speaker: narrator
          text: >-
            忽然，一切都变了。保姆收到电报。她有个哥哥，大家以为他早已在海上溺死，如今竟突然回来了。她非去看他不可。
        - id: ch01-b68
          speaker: nurse
          text: 就算因此丢掉差事，我也得去。
        - id: ch01-b69
          speaker: housekeeper
          text: 哦，好吧，那就去。这男孩由我负责，这个阴沉的小坏蛋。
        - id: ch01-b70
          speaker: narrator
          text: >-
            保姆满心欢喜，忙着收拾箱子，终于要走了。最后一刻，菲利普站在门阶上，看她爬上双轮马车，忽然向前扑去，一头撞向几乎已经转动的车轮。这是他第一次用任何称呼叫她。
        - id: ch01-b71
          speaker: philip
          text: >-
            保姆！请你说我可以拿露西的玩具来玩吧。这里实在太孤单了。我可以，对不对？我可以拿来玩吗？
        - id: ch01-b72
          speaker: narrator
          text: >-
            也许保姆自己太幸福了，又想到哥哥并没有淹死，心肠便软下来。也许她只是急得不知道自己在说什么。不管怎样，菲利普第三次问“我可以拿吗”时，她匆匆回答了。
        - id: ch01-b73
          speaker: nurse
          text: 天哪，孩子！你爱拿什么就拿什么。看着车轮，我的老天！大家再见！
        - id: ch01-b74
          speaker: narrator
          text: >-
            她朝聚在宽阔台阶顶上的仆人挥挥手，马车载着她飞驰而去，去跟那位没有淹死的哥哥欢喜团聚。菲利普终于得到了明确的允许。他心满意足地深吸一口气，径直跑上楼，把游戏室里所有玩具都取出来，一件接一件地看，绝不漏掉任何一件。这件事花了他整整一个下午。
        - id: ch01-b75
          speaker: narrator
          text: >-
            第二天，他把所有东西又看了一遍，越看越想拿它们造点什么。他早就懂得亲手建造带来的快乐。以前，他和海伦常为梦中小岛建城。除了自己的两盒积木，他们还会搬来海伦的日式小柜子，拿多米诺骨牌和棋子做建筑，再加上硬纸盒、书本，甚至水壶盖和茶壶盖。可不管怎样，他们总嫌积木不够。露西这里却不一样。她的积木多得很，好像什么都造得出来。
        - id: ch01-b76
          speaker: narrator
          text: >-
            菲利普开始在游戏室的桌上建城。不过，若是习惯了用各种东西搭建，只用积木就太没意思了。
        - id: ch01-b77
          speaker: philip
          text: 这看着就像一座工厂。
        - id: ch01-b78
          speaker: narrator
          text: 他不满地推倒建筑，把积木一一放回盒子。
        - id: ch01-b79
          speaker: philip
          text: 楼下一定有能用的东西。而且她说过，我爱拿什么就拿什么。
        - id: ch01-b80
          speaker: narrator
          text: >-
            他一趟抱上两三盒，把积木、木块、英国跳棋、国际象棋和多米诺骨牌搬下楼，送进长长的客厅。那里悬着水晶吊灯，椅子罩着棕色防尘布。一排明亮的长窗前，柜子和桌子上摆满了有趣的东西。
        - id: ch01-b81
          speaker: narrator
          text: >-
            菲利普把大写字桌上的吸墨垫、银墨水台和红书脊的书清开。在他看来，这些东西既没用，也不重要。桌上腾出一大片地方，他开始建城。
        - id: ch01-b82
          speaker: narrator
          text: 黑金两色的柜子上，一尊青铜埃及神像仿佛正从房间那头看着他。
        - id: ch01-b83
          speaker: philip
          text: 好吧，我给你造座神庙。你等一会儿。
        - id: ch01-b84
          speaker: narrator
          text: >-
            青铜神像果真等着，神庙也一点点升起来。两支银烛台顶上各放一枚棋子，正好做门廊的高柱。菲利普又跑回游戏室，把诺亚方舟里的动物取来。两头大象各站在一块积木上，一左一右守住入口。整座神庙壮丽极了，像海伦给他看过的图画中的亚述神庙。可只用积木砌出来的地方还是显得寒酸，看上去不是工厂，就是济贫院。单用积木盖房子，总会变成这样。
        - id: ch01-b85
          speaker: narrator
          text: >-
            菲利普又去探险。这次他找到了图书室，接连跑了好几趟。他搬来二十七本白色犊皮封面、带大理石纹封板的书，又搬来一整套莎士比亚作品，还有十本绿摩洛哥皮封面的书。他把一本本书竖起来、排开来，书本便成了高大的柱子和幽深的回廊。那些地方看上去黑暗、神秘，又格外吸引人。最后，他再添上几只诺亚方舟里的动物，整座建筑便有了十足的埃及味道。
        - id: ch01-b86
          speaker: susan
          text: >-
            哎哟，可真漂亮！菲利普少爷，您的手真巧，这一点我非夸不可。不过，您拿了这么多东西，可是要挨骂的。
        - id: ch01-b87
          speaker: philip
          text: >-
            那个灰衣保姆说我可以拿。用这些盖房子又不会弄坏。我姐姐和我在家里总这么玩。
        - id: ch01-b88
          speaker: narrator
          text: >-
            他信赖地看着苏珊。她夸了他的建筑，而这也是他来到这幢房子后，第一次对别人提起姐姐。
        - id: ch01-b89
          speaker: susan
          text: >-
            嗯，这跟西洋镜一样好看，简直像我哥哥从印度寄来的风景明信片。瞧这些柱子、圆顶，还有动物呢。我可弄不懂，您怎么想得出这些，换成我绝对想不出来。
        - id: ch01-b90
          speaker: narrator
          text: >-
            赞美是甜美的。两人沿宽楼梯下楼时，菲利普把手塞进苏珊手里。大厅中，一只小得可怜的茶盘正在一张又大又暗的桌子上等他。
        - id: ch01-b91
          speaker: susan
          text: >-
            那孩子一点也不坏。我敢说，是那个保姆装模作样，把小家伙吓得魂都没了。只要你客客气气跟他说话，他也客气得很。
        - id: ch01-b92
          speaker: cook
          text: 露西小姐总没吓他吧？瞧瞧他是怎么对她的。
        - id: ch01-b93
          speaker: upper_housemaid
          text: >-
            不管怎么说，他可安静得很。从早到晚，一点声响也听不见。我倒觉得他看着有点傻。
        - id: ch01-b94
          speaker: susan
          text: >-
            你们只管溜进去，看看他盖了什么。看完就不会再说他傻。什么印度呀，宝塔呀，跟他的城一比都不值一提。
        - id: ch01-b95
          speaker: narrator
          text: 菲利普上床以后，她们果然一个个溜进去。建筑已经扩展了不少，只是还没有完工。
        - id: ch01-b96
          speaker: susan
          text: >-
            我一件也不碰，留着让他明天接着玩。等那个戴帽子、竖领子、神气活现的保姆回来以前，我们再全收掉。
        - id: ch01-b97
          speaker: narrator
          text: >-
            第二天，菲利普继续搭建。他把能想到的一切都放进城里。多米诺骨牌、骨牌盒、积木和书本都用上了。他还向苏珊讨来线轴，厨娘则送给他一个领盒和几只蛋糕烤模。他用一块块骨牌铺出长长的台阶，又让骨牌盒变成平台。他到花园里折来几枝青蒿，把它们插进线轴，做成一盆盆漂亮的植物，看着就像木桶里栽的月桂树。黄铜洗指钵倒过来便成了圆顶，大厅橡木柜上的水壶盖和咖啡壶盖，则成了光彩夺目的尖塔。国际象棋棋子也很适合做尖塔。
        - id: ch01-b98
          speaker: philip
          text: 还得有铺好的路和一座喷泉。
        - id: ch01-b99
          speaker: narrator
          text: >-
            他用珍珠母的纸牌筹码铺路，用银玻璃烟灰缸做喷泉，中央竖起银丝镂花针盒。海伦分别时送的巧克力包着银纸，他把银纸剪成窄条，就做出了落下的水流。棕榈树也好做，海伦教过他。把落叶松小枝用橡皮泥固定在接骨木枝干上就行。露西的玩具里有的是橡皮泥，那里什么都有的是。
        - id: ch01-b100
          speaker: narrator
          text: >-
            城市一直扩展，铺满整张桌子。菲利普一点也不累，又在另一张桌上建第二座城。那座城最显眼的是巨大水塔，塔脚围着喷泉。如今他什么都敢用了。他把吊灯上的水晶坠饰摘下来做喷泉。第二座城比第一座更宏伟，里面有一座废纸篓做的高塔，还有用照片放大机做成的占星师之塔。
        - id: ch01-b101
          speaker: narrator
          text: >-
            那两座城市确实美极了。我真希望能把每一个地方都详详细细讲给你听，可那要讲上好多好多页。除了刚才说过的，城里还有一座座高塔和角楼，有宏伟的阶梯、宝塔和亭阁。银纸铺成一道道运河，亮得真像有水在流。还有一座湖，湖上甚至停着一条船。玩偶屋里看着合适的东西也全搬来了，有木制的食物和盘子，还有铅制的茶杯和高脚杯。多米诺骨牌和兵卒棋子成了城里的居民，那些更漂亮的国际象棋棋子用来做尖塔。他还建起堡垒，在里面安置铅制士兵，让他们守卫城市。
        - id: ch01-b102
          speaker: narrator
          text: >-
            菲利普做得用心，也做得灵巧。城市越美，越有意思，他就越爱它们。如今，他快乐了，已经没有时间再不快乐。
        - id: ch01-b103
          speaker: philip
          text: 我要一直留着这个样子，等海伦回来。她一定会喜欢得不得了！
          emotion: happy
        - id: ch01-b104
          speaker: narrator
          text: >-
            两座城之间还需要一座桥。菲利普从仆人的缝纫室找到一根码尺，把它横跨在两张桌子之间。现在，仆人们都成了他的朋友，谁也没有阻拦他。苏珊只是最先和他交朋友的那一个。他刚把桥安放好，又把诺亚先生和诺亚太太放到主广场，让他们代表城里的居民。菲利普站在那里，完全沉浸在对作品的欣赏中。就在这时，两只有力的手突然一边一只按住他的肩膀。他吓得浑身一颤，尖叫起来。
        - id: ch01-b105
          speaker: narrator
          text: >-
            是保姆。她比大家预料的早回来一天。原来，哥哥带回了一位妻子，那位妻子和保姆互相看不顺眼，所以保姆气坏了。她抓住菲利普的肩膀用力摇晃。从来没有人这样对过他。
        - id: ch01-b106
          speaker: nurse
          text: 你这个淘气的坏孩子！
          emotion: angry
        - id: ch01-b107
          speaker: philip
          text: 可我什么也没弄坏。我会把所有东西都放回去。
          emotion: fearful
        - id: ch01-b108
          speaker: nurse
          text: >-
            你再也别想碰这些东西，我保证你碰不到。明天早晨，我会亲自把样样东西收好。竟敢拿不属于你的东西！
          emotion: angry
        - id: ch01-b109
          speaker: philip
          text: 可你说过，我想拿什么都可以。所以这要是错的，也是你的错。
        - id: ch01-b110
          speaker: narrator
          text: >-
            保姆大叫菲利普撒谎，还打了他的指关节。从来没有人打过他。他的脸更白了，可双手虽然痛得厉害，他却没有哭。保姆抄起那根又硬又有棱角的码尺打他。
        - id: ch01-b111
          speaker: philip
          text: 你是胆小鬼。撒谎的是你，不是我。
          emotion: angry
        - id: ch01-b112
          speaker: nurse
          text: 闭嘴！
          emotion: angry
        - id: ch01-b113
          speaker: narrator
          text: 保姆把他一路拽回房间，狠狠塞进被窝。
        - id: ch01-b114
          speaker: nurse
          text: 不给你晚饭吃，就是这样！
          emotion: angry
        - id: ch01-b115
          speaker: philip
          text: 我才不想吃。而且太阳落山以前，我必须原谅你。
        - id: ch01-b116
          speaker: nurse
          text: 还原谅我呢！
          emotion: angry
        - id: ch01-b117
          speaker: philip
          text: 等你知道后悔了，就会明白我已经原谅你啦。
        - id: ch01-b118
          speaker: narrator
          text: >-
            这话当然让保姆更生气。菲利普独自一人时哭没哭，不关我们的事。苏珊看见保姆摇他、打他，却不敢阻拦。后来，她悄悄端着牛奶和松糕上楼，却发现他已经睡了。苏珊说，他的睫毛还是湿的。
        - id: ch01-b119
          speaker: narrator
          text: >-
            菲利普醒来时，房里亮极了，他起先以为已是早晨。过了一会儿才看出，那片漂亮的光不是金黄的阳光，而是雪白的月光。他先奇怪自己为什么这么难过，随后一切都想起来了。海伦离开了，保姆又那样可恨。等到早晨，保姆会把城市全部拆掉，海伦永远也看不到它。他知道，自己再也造不出同样美丽的一座城。明天它不但会消失，连每座塔、每条路是怎样搭出来的，他也没法全记住。
        - id: ch01-b120
          speaker: narrator
          text: 月光亮极了。
        - id: ch01-b121
          speaker: philip
          text: 不知道我的城市在月光下是什么样子？
        - id: ch01-b122
          speaker: narrator
          text: >-
            就在一个叫人心跳加快的瞬间，他拿定主意，要亲自下楼去看。他披上睡袍，轻轻开门，蹑手蹑脚穿过走廊，走下宽楼梯，再沿长廊来到客厅。里面漆黑一片。他摸到窗前，打开百叶窗。城市就在那里，浸在月光里，和想象中一模一样。
        - id: ch01-b123
          speaker: narrator
          text: >-
            他欣喜若狂地看了一会儿，随后转身去关门。就在转身时，一阵轻微而古怪的眩晕突然袭来，他只得把手按在头上，站了片刻。等那感觉过去，他再次朝城市走去。快走到时，他忍不住低呼一声，又赶紧把声音压住，唯恐有人听见，跑下楼来把他赶回床上。他茫然地四下张望，又一次感到头晕。
        - id: ch01-b124
          speaker: narrator
          text: >-
            一阵亮光倏地闪过，随即陷入黑暗，城市消失了。客厅也不见了，连原本靠近桌子的那把椅子都没留下。远处只有一片山一样的轮廓，高高耸起，月光照亮了那些山峰的顶端。菲利普自己仿佛站在一片广阔平坦的原野上。脚边围着柔软的长草，却没有一棵树、一幢房屋，也没有树篱或栅栏来截断一望无际的草地。只有一些地方看着比别处更暗，除此以外，什么也没有。这让他想起冒险故事里那种没有边际的大草原。
        - id: ch01-b125
          speaker: philip
          text: 我大概是在做梦。可我实在想不通，自己怎么会在转门把手的时候睡着。不过——
        - id: ch01-b126
          speaker: narrator
          text: >-
            他站着不动，等候什么事情发生。梦里总会发生点什么，哪怕只是梦突然结束。可现在什么也没发生。菲利普只是安静地站在那里，感受温暖柔软的草围着脚踝。
        - id: ch01-b127
          speaker: narrator
          text: >-
            眼睛慢慢适应草原的黑暗后，他看见不远处有座很陡的桥，斜斜向上通往一片暗沉沉的高地，月光把那片高地的顶端照得雪白。他朝那里走去，越接近越觉得那东西不像桥，更像一架梯子。它高高地悬在头顶，光是抬头看一眼，就叫人头晕目眩。梯子仿佛一直搭到远处的一块岩石上，岩石背后是漆黑的天空。再仔细看，那块岩石内部像被整个掏空了，成了一座巨大而幽暗的洞穴。
        - id: ch01-b128
          speaker: narrator
          text: >-
            来到梯子脚下，菲利普发现它根本没有横档，只有一道道狭窄的突缘，勉强能让手和脚攀住。他抬头望着这架直上高处的梯子，想起了《杰克与魔豆》，心里很想爬上去，可梯子实在太长太长了。话说回来，四周只有它像是能通往什么地方。菲利普已经受够了独自站在长草覆盖的大草原上，而且不知为什么，他觉得自己已经在那里待了很久很久。
        - id: ch01-b129
          speaker: narrator
          text: >-
            他把双手双脚都搭上梯子，开始向上爬。这一程实在太长了。他一路认真数着，共有三百零八级。梯级偏偏只在梯子的一面，他每挪动一步都得格外小心。他就这样向上又向上，不停地爬，直到双脚酸痛，两只手也累得像要从身上掉下来。他抬头看不了多远，更完全不敢向脚下看。眼前没有第二条路，除了继续爬呀爬呀，一直向上，什么办法也没有。
        - id: ch01-b130
          speaker: narrator
          text: >-
            终于，他看见梯子倚靠的地面。那是一座线条凿得整整齐齐的平台，像从一整块坚硬的岩石里直接开出来。菲利普继续向上，先是脑袋与地面齐平，接着双手攀上平台，最后连双脚也离开了梯子。他从侧面一跃而下，脸朝下扑倒在地。地面像大理石一样冰冷光滑。他一动不动地趴在那里，因为疲惫，也因为终于松了一口气，一声接一声地深深喘息。
        - id: ch01-b131
          speaker: narrator
          text: >-
            四周笼罩着一片深沉的寂静。那寂静让他疲倦的身体得到休息，也让心慢慢安定下来。过了一会儿，他才站起身，环顾四周。附近有一道拱门，支撑它的柱子粗得惊人。他走过去，小心地向里面窥望。那似乎是一扇通往空旷场地的大门，更远处隐约耸着一堆堆高低不同的影子，看起来像教堂和房屋。可这里完全没有人。不管这是什么地方，眼下只有他和月光占据着它。
        - id: ch01-b132
          speaker: philip
          text: 我想，大家都睡觉去了。
        - id: ch01-b133
          speaker: narrator
          text: 菲利普站在奇异拱门投下的黑影里，身子微微发抖，却又满心好奇，兴味盎然。
