audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机敏，带着克制的幽默与讲故事的悬念
        timbre: 温暖清亮
        pace: 舒展而有变化
        pitch: 中音
    dickie:
      display_name: 迪基
      tts:
        delivery: 聪明敏感，街头口吻直率，学书中人物说话时郑重夸张
        timbre: 清脆稚嫩
        pace: 稍快，受委屈时断续
        pitch: 中高音
    mr_rosenberg:
      display_name: 罗森伯格先生
      tts:
        delivery: 精明务实，咬字略含混，生气时仍有分寸
        timbre: 浑厚偏暗
        pace: 偏慢
        pitch: 低音
    loafer:
      display_name: 闲汉
      tts:
        delivery: 起初粗鲁多疑，后来爽直友善
        timbre: 沙哑松散
        pace: 适中
        pitch: 中低音
    soft_voice_1:
      display_name: 细小声音甲
      tts:
        delivery: 轻柔灵动，带着神秘的商量口吻
        timbre: 纤细清亮
        pace: 轻快
        pitch: 高音
    soft_voice_2:
      display_name: 细小声音乙
      tts:
        delivery: 柔软机敏，像催眠的乐声
        timbre: 清澈轻盈
        pace: 轻快
        pitch: 高音
    nurse:
      display_name: 老奶妈
      tts:
        delivery: 慈爱爽朗，照料孩子时坚定又耐心
        timbre: 丰满温暖
        pace: 从容
        pitch: 中低音
    doctor:
      display_name: 凯里医生
      tts:
        delivery: 自信健谈，医嘱说得郑重而利落
        timbre: 圆润沉稳
        pace: 适中
        pitch: 中低音
    sebastian:
      display_name: 塞巴斯蒂安
      tts:
        delivery: 豪爽快活，谈起航海往事时骄傲昂扬
        timbre: 粗犷明亮
        pace: 适中
        pitch: 中低音
    cousin_girl:
      display_name: 小表妹
      tts:
        delivery: 亲切活泼，真心欢迎久病初愈的表亲
        timbre: 清甜明亮
        pace: 稍快
        pitch: 中高音
    cousin_boy:
      display_name: 小表兄
      tts:
        delivery: 快活直爽，满心想着游戏和船只
        timbre: 清脆稚嫩
        pace: 稍快
        pitch: 中高音
    aunt:
      display_name: 姨母
      tts:
        delivery: 优雅亲切，吩咐孩子时从容清楚
        timbre: 柔和端庄
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 哪一个才是梦？
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            两只白种子排成的三角形交在一起，成了一颗星。叮当儿和白印章就放在星中央。空屋里的这一切在迪基眼前慢慢暗下去，越来越模糊。他的眼睛又涩又倦，只想马上闭起来。奇怪的是，隔着眼皮，他还觉得星中央有什么在动。可闭上眼哪能看见东西呢？准是自己乱想。他连近旁有声音响起也懒得睁眼，只当警察来抓他了。
        - id: ch01-b02
          speaker: dickie
          text: 要抓就抓吧。
        - id: ch01-b03
          speaker: narrator
          text: 他困得连害怕的力气都没了。可这声音一点也不像大块头警察，反倒又轻又细，精神十足。
        - id: ch01-b04
          speaker: soft_voice_1
          text: 喂，你想去哪儿？
        - id: ch01-b05
          speaker: dickie
          text: 哪儿都行。
        - id: ch01-b06
          speaker: narrator
          text: 迪基还以为对方让他挑一间警察局。随后，两个柔软的小声音窃窃私语，听着像催人睡觉的乐声。
        - id: ch01-b07
          speaker: soft_voice_1
          text: 他跟你亲些，跟我可没那么亲。
        - id: ch01-b08
          speaker: soft_voice_2
          text: 明明是你跟他亲，我才没那么亲。
        - id: ch01-b09
          speaker: soft_voice_1
          text: 可你年纪比我大。
        - id: ch01-b10
          speaker: soft_voice_2
          text: 你还比我强壮呢。
        - id: ch01-b11
          speaker: soft_voice_1
          text: 那就转一回，让它来定。
        - id: ch01-b12
          speaker: narrator
          text: 一阵嗡嗡的旋转声响起来，最后叮铃一声，轻轻落定。
        - id: ch01-b13
          speaker: soft_voice_2
          text: 好，定下了。就在这儿？
        - id: ch01-b14
          speaker: soft_voice_1
          text: 那什么时候？
        - id: ch01-b15
          speaker: soft_voice_2
          text: 三这个数正合适。
        - id: ch01-b16
          speaker: narrator
          text: 四下安静了。睡意像柔软的斗篷，把迪基整个裹住。再醒来时，他的眼皮已经轻快了。他在明亮的日光里眨着眼睛。
        - id: ch01-b17
          speaker: dickie
          text: 这梦可真够怪的。
        - id: ch01-b18
          speaker: narrator
          text: >-
            他躺在一张又大又陌生的四柱床上，模样很像塔尔博特宅邸的那一张。低矮的长窗嵌着一格格小玻璃，直立的石棂把阳光切成几片。深色木地板上竟撒满鲜花和绿草。绿色床帘织着白花纹，很像叮当儿和印章上的图案。床罩放着薰衣草和别的香草，墙上挂着针线绣成的画。其实那叫挂毯，只是迪基还不知道。屋里的家具全是厚重的木头，雕花也一样厚重。阴暗的大衣柜靠墙森然耸着，另一面墙前整齐摆着蒙织锦的高背椅。第三面墙几乎全是窗，第四面墙上砌着壁炉，高高的烟囱罩拢着宽阔明亮的炉膛。
        - id: ch01-b19
          speaker: narrator
          text: >-
            床边的小桌放着杯子和瓶子，瓶颈上系的羊皮纸标签硬挺挺地翘着。床脚的大扶手椅里坐着一个丰满的女人。她穿着宽裙，戴着迪基没见过的白帽，脖子上的轮状皱领，让他想起新十字路肉铺里的剪纸花边。
        - id: ch01-b20
          speaker: dickie
          text: 这梦也太稀奇了！
        - id: ch01-b21
          speaker: nurse
          text: >-
            你总算会好好说话了。害瘟热的人做怪梦不稀奇。幸好你找回了自己的舌头，不再像前些天那样胡言乱语，动个不停。
        - id: ch01-b22
          speaker: dickie
          text: 可我刚才明明还在前屋，在……
        - id: ch01-b23
          speaker: nurse
          text: >-
            你一直就在这里。那边才是梦，忘了它，也别再提。说这种梦会招祸。来，该喝热饮了。
        - id: ch01-b24
          speaker: narrator
          text: >-
            壁炉里生着小火，窗外却是夏日阳光，绿树梢正随风摇。奶妈从炉边的小陶锅里盛出粥，倒进錾着玫瑰的银碗。碗沿刻着一行奇怪的字，意思是饮我一口，再饮一口，只是迪基后来才留意。她往粥里添了白葡萄酒，用银匙搅匀，像喂婴儿一样，一匙匙吹凉了再喂他。粥又甜又香，迪基在软床上舒展开，觉得舒服极了，很快又睡着了。
        - id: ch01-b25
          speaker: narrator
          text: 下一次醒来，他肚子里塞满了问题。
        - id: ch01-b26
          speaker: dickie
          text: 我怎么来的？难道又被车撞了？这是医院吗？你是谁？
        - id: ch01-b27
          speaker: nurse
          text: >-
            别又说胡话。你在自己家里，躺的是德特福德你父亲宅子里最好的床。你害过瘟疫热，现在该好了。可你怎么连老奶妈都不认得？
        - id: ch01-b28
          speaker: dickie
          text: >-
            我压根儿没有奶妈，老的新的都没有。你把我错当成别人了。你们是从哪儿把我弄来的？我从没来过这里。
        - id: ch01-b29
          speaker: nurse
          text: >-
            又胡说。安静躺着，好好想想，你会记起我的。如今连老奶妈都忘了，再等一会儿，怕是连自己的名字也要忘。
        - id: ch01-b30
          speaker: dickie
          text: 我的名字才没忘。
        - id: ch01-b31
          speaker: nurse
          text: 那你说，你叫什么？
        - id: ch01-b32
          speaker: dickie
          text: 迪基·哈丁。
        - id: ch01-b33
          speaker: nurse
          text: >-
            哎哟，你果然忘了！都说高热会伤记性，可哪有这么厉害的？难道热病把你的脑子烧糊涂了，连自己叫理查德都不知道？
          emotion: surprised
        - id: ch01-b34
          speaker: narrator
          text: 她接着说出的姓，听起来一点也不像哈丁。
        - id: ch01-b35
          speaker: dickie
          text: 那真是我的名字？
        - id: ch01-b36
          speaker: nurse
          text: 当然是。
        - id: ch01-b37
          speaker: narrator
          text: >-
            迪基忽然觉得脚下有了实地。他原以为睡醒以后，这场梦就会结束，自己会独自在新十字的空屋里醒来。可他醒过一次，还是回到了这里。也许他本来就属于这个地方，这才是真日子。也许新十字那些卑微、肮脏的生活，才是高热带来的噩梦。他望着舒适华丽的房间、奶妈善良明朗的脸、窗外发亮的绿枝，还有挂毯和满地灯心草，终于开了口。
        - id: ch01-b38
          speaker: dickie
          text: 奶妈。
        - id: ch01-b39
          speaker: nurse
          text: 啊，我就知道你会清醒。怎么了，我的小心肝？
          emotion: happy
        - id: ch01-b40
          speaker: dickie
          text: >-
            要是我真叫你说的那个名字，那我已经全忘了。奶妈，你把我的事情都讲给我听，好不好？
        - id: ch01-b41
          speaker: nurse
          text: 我就猜到是这样。
        - id: ch01-b42
          speaker: narrator
          text: >-
            奶妈接着讲起许多不可思议的事。她说，迪基的父亲是理查德爵士，国王去年才封了他。这里是父亲在乡间的宅子，坐落在德特福德宜人的田野和果园间。迪基害过一场厉害的瘟疫热，病得非常重。多亏上天赐福，也多亏好心的凯里医生日夜细心照料，如今他终于走上康复的路了。
        - id: ch01-b43
          speaker: nurse
          text: >-
            等你再结实些，宅子里的瘟疫也清干净，住在苏塞克斯的表兄妹就来陪你。以后你们再去城里的宅子看伦敦。瞧，好医生来了。打起精神，别让他又给你放血灌药。你还弱着呢，可医生哪懂孩子，他们的药都是给壮汉吃的。
        - id: ch01-b44
          speaker: narrator
          text: >-
            迪基不知道放血是什么，却觉得听着就不好受。他坐起身，发现自己并没有想象中那么累。奇事接连发生，他兴奋得脸颊发红。医生穿着宽大的黑袍和黑袜，头戴尖帽，在床边号过脉，只好承认迪基差不多痊愈了。
        - id: ch01-b45
          speaker: doctor
          text: >-
            嬷嬷，我们把他治好了，你和我一起治好的。如今该用厨房里的药。给他好肉汤、粥、面包糊，再来葡萄酒，莱茵的、法兰西的都成。还要橙汁、柠檬汁。没有的话，就捣碎鲜苹果，把汁挤出来。怎么样，这药方合你的心意吧？孩子，闻闻这个。你好些天都没精神闻它了。
        - id: ch01-b46
          speaker: narrator
          text: >-
            医生把手杖的金圆头伸到迪基鼻子前。迪基惊讶地闻到一股浓郁芬芳的气味，有一点像装满香料的杂货铺，又有一点像摆满药瓶的药房。金圆头上布满了小孔，模样跟胡椒罐的盖子一样，香气似乎正从那些细孔里一点点透出来。
        - id: ch01-b47
          speaker: dickie
          text: 这是什么？
        - id: ch01-b48
          speaker: nurse
          text: 他什么都忘了。这是医生的香丸，里头的香料和香精能赶走瘟气。
        - id: ch01-b49
          speaker: doctor
          text: >-
            握在手里一暖，香味就出来了。热病既然退了，屋里也该熏一遍。嬷嬷，熬上琥珀、硝石、苦艾、醋、榅桲、没药、樟脑和新鲜甘菊花。麝香千万不能忘，那可是赶瘟气的猛药。把蒸汽抬着熏遍屋子，地上的旧香草和扫出的杂物都烧掉，再撒新鲜香草和花。收拾清爽些，也感谢上天，你不是在为葬礼收拾屋子。
        - id: ch01-b50
          speaker: narrator
          text: 黑袍医生说完这番叫人愉快的话，对小病人点头一笑，走了。
        - id: ch01-b51
          speaker: narrator
          text: >-
            迪基彻底分不清自己身在何处了。他究竟是那个住过新十字、播过鹦鹉饲料、跟比尔先生一起走上大路的迪基·哈丁，还是另一个姓氏的男孩？那个男孩的父亲是骑士，家在有绿树的德特福德。可他记得的德特福德哪有花园里的绿树？奶妈还说这里有宜人的田野和果园，他熟悉的德特福德更没有这些。也许世上有两个德特福德，就像布朗普顿也有两个，里士满也有两个，其中一个还在约克郡。这里发生事情的方式，又总让他想起塔尔博特夫人。她也曾想把他留下，做自己的小男孩。或许这个新男孩真有一位母亲，而且像那位好心夫人一样温柔可爱。
        - id: ch01-b52
          speaker: narrator
          text: >-
            奶妈照着医嘱，把各样东西投进一只三条腿的铁锅，再把锅埋到滚烫的灰烬里煮。锅烧开以后，两个女仆一人一边抬起它，在屋里来来回回地走。她们每把锅晃一下，就有一大团香甜、浓烈又辛辣的蒸汽冒出来，慢慢散进房间每一个角落。
        - id: ch01-b53
          speaker: dickie
          text: 奶妈，我有母亲吗？
        - id: ch01-b54
          speaker: narrator
          text: 奶妈一下把他抱进怀里。
        - id: ch01-b55
          speaker: nurse
          text: >-
            当然有。她在你父亲另一座宅子里病倒了。你还有个小弟弟，也叫理查德。
        - id: ch01-b56
          speaker: dickie
          text: >-
            那我想留在这里，努力记起这个我是谁。我不再想办法梦见新十字和比尔先生了。就算这里是梦，也比另一场好。让我留下吧，奶妈，我想见母亲和弟弟。
        - id: ch01-b57
          speaker: nurse
          text: 当然让你留下，我的小羊羔，当然让。
        - id: ch01-b58
          speaker: narrator
          text: >-
            此后，迪基吃了睡，睡了吃。黑夜过去，白日又来。有时有人陪他说话，有时四下静悄悄。日子仿佛走得很慢，又快得出奇。他一点点认识了那个既是自己、又不像自己的新男孩。那个孩子占着他现在的位置，名字却不是迪基·哈丁。迪基坦白说，过去的事全不记得了。奶妈便常在床边坐上几个钟头，把那孩子短短一生里的事一件件讲给他听。奇怪的是，每听完一件，迪基就发现自己记起来了。他看得见当时的地方，认得当时的人，也知道那件事曾怎样发生。那不是听过一个故事后留下的印象，而是只有亲身经历过的真事才会留下的记忆。
        - id: ch01-b59
          speaker: narrator
          text: >-
            一天天过去，他越来越相信自己原本就是另一个理查德。跟姨妈住在新十字，后来随比尔先生走过宜人的乡间小路，那些才是一场梦。那场梦曾经那么清楚，如今却一天比一天遥远。迪基甚至开始想不通，自己怎么会梦出那样卑微、肮脏又辛苦的生活来。
        - id: ch01-b60
          speaker: narrator
          text: >-
            不久，奶妈给他穿上从没见过却异常舒服、精美的衣裳，抱他到窗边。他坐在宽大的橡木椅里，看见绿色田野一路斜斜伸向河岸。河上来往着船只，帆索和桅杆在远处交错。那些帆索看着有些眼熟，船的形状却完全不同。它们比迪基·哈丁平日见惯的船更短、更宽，大多数也高高耸出水面。
        - id: ch01-b61
          speaker: dickie
          text: 我真想走近一点看看。
        - id: ch01-b62
          speaker: nurse
          text: >-
            等你全好了，准又整天往船坞跑。你以前就是这样，爱听船长讲故事，还一心想着将来有自己的大帆船，开到黄金遍地的南美洲。
        - id: ch01-b63
          speaker: dickie
          text: 大帆船是什么？
        - id: ch01-b64
          speaker: narrator
          text: 奶妈耐心讲给他听，从不怪他忘掉这些事。
        - id: ch01-b65
          speaker: narrator
          text: >-
            迪基很快活。不知为什么，新生活里的地方仿佛更宽，时间也更充裕。这里没有人匆匆忙忙，四分之一英里以内也没有别的房屋，只有一片片绿野。而且，他还是个重要人物。仆人们都叫他理查德少爷。每听见这个称呼，他都觉得，它不只是说仆人敬重主人家的儿子，还表示人人都在等他将来做出大事。他既然是少爷，就有责任善待并保护这些人。大家盼着他长成勇敢、高尚、慷慨而无私的人，照料每一个仆役和劳工，照料手下所有男人和女人。他们将来能不能幸福安康，会由他负责。
        - id: ch01-b66
          speaker: narrator
          text: >-
            想到这里，他的心激动得发涨，仿佛生来就背着一项伟大的使命。德特福德那个跛脚小男孩迪基·哈丁，竟然会把这么多人的生活托在手里。在塔尔博特宅邸时，他也曾隐约有过这种感觉，如今却感受得明明白白。像他这样的人不能做卑鄙丢脸的事，不能去当窃贼，从人家食品储藏室的窗户爬进去。将来大家会指望他照顾他们。幸好他懂穷人需要什么，因为他曾经穷过，或者梦见自己穷过。这两件事其实差不多，原来梦和真日子那么相像。
        - id: ch01-b67
          speaker: narrator
          text: >-
            就这样，每一天的每个时辰，每个时辰里的每一刻，迪基都在变化。他不再是那个住在新十字黄色房屋和丑陋景物间、沿白色大路长途跋涉、睡在银月客栈的男孩。他渐渐成了另一个姓氏的理查德，吃得饱，睡得安稳，也明白自己命中注定会拥有力量，用仁爱帮助别人。奶妈说，父亲很富有，那些财富有一天会由他支配。他要用钱让手下的人过得幸福，也让上帝得到荣光。迪基珍爱这个又伟大又美丽的念头。他也爱新生活里的一切，爱家具和帷幔的形状颜色，爱慈祥的奶妈、爱笑的女仆和健谈的老医生。医生每回说起话来长篇大论，笑容却只有短短一下。他还爱床铺、房间、船、河流、树木与花园。连这片天空都比从前德特福德上空更清亮。
        - id: ch01-b68
          speaker: narrator
          text: 后来有一天，奶妈像往常一样替他穿好衣服，却没有伸手抱他到窗边。她站在那里，仿佛这是再平常不过的事，只叫迪基自己从床边走到窗前。
        - id: ch01-b69
          speaker: dickie
          text: 我的……我的拐杖呢？你放到哪儿了？
        - id: ch01-b70
          speaker: nurse
          text: >-
            拐杖？你这个傻孩子，快从梦里醒醒。你有两条又直又结实的腿，哪儿需要拐杖？来，自己走过来。
        - id: ch01-b71
          speaker: narrator
          text: >-
            迪基低头看着双脚。过去在新十字，他从来不喜欢看它们，来到这些新日子里以后，也一次都没低头细看。他迟疑着，奶妈却像是认定他一定能走，又催他过去。迪基想，不妨试一试。他从高高的床沿慢慢滑下，两只脚同时落到地面。他清楚地感觉到，木地板在那只脚下和另一只脚下一样坚实，也一样平整。他挺直身子，先迈出惯常能动的脚，再迈出那只从来不能动的脚。一步、两步、三步、四步。他忽然转身扑到床边，把脸深深埋进交叠的胳膊里。
        - id: ch01-b72
          speaker: nurse
          text: 怎么哭了，我的小羊羔？
        - id: ch01-b73
          speaker: dickie
          text: >-
            奶妈，我梦见自己是个瘸子！我一直以为那是真的。可那不是真的，不是真的，真的不是真的！
          emotion: happy
        - id: ch01-b74
          speaker: narrator
          text: >-
            没过多久，迪基已经能下楼进花园。他走过青草小径和长长的林荫道，果树沿棚架伸展，投下舒服的绿荫。他还在宅子后那片长草地上学玩滚木球。这座宅子是他见过最美的房子，花园甚至比塔尔博特宅邸的还好。可真正让生活变得又新又充实的，并不只是房屋和花园。哪怕他仍只能一瘸一拐地走过绿荫小路，或在雕花楼梯上慢慢爬，也会比从前快乐。如今他却能一次跨下三级台阶，能蹦跳着上下楼，也能在拱形林荫道里放开腿奔跑。他跟见过的其他孩子一样会跑会跳，这是过去做梦也想不到的。
        - id: ch01-b75
          speaker: narrator
          text: >-
            想一想，如果一个人生来没有翅膀，却一辈子住在会飞的人中间，那会是什么感觉？跛脚的人活在我们这些能跑能走的人中间，就是这样。如今，迪基不再跛了。他那双腿不但强健灵活，简直还有自己的聪明。它们一次也没带错路。它们领他去山上村庄的铁匠铺，领他钻进修剪整齐的树篱迷宫，一直走到花园正中央。最好的一次，它们还把他带到了船坞。
        - id: ch01-b76
          speaker: narrator
          text: >-
            迪基一向爱看东西怎么造出来，事情怎么做完。孩子拿到最新最亮的玩具，也常会把它丢在一旁，反倒跟着木匠或水管工满屋转，摆弄工具，问上千百个问题，看他怎样干活。在新十字，迪基就花过许多时间看那些有趣的工人。他们打开人行道上的方活门，从里面拉出一长段又一长段电线。迪基不知道他们为什么这样做，可伦敦的孩子也许知道。到了船坞，他看见一个系着宽大皮围裙的男人，正在摆弄粗木梁和他从没见过的工具。那人像迎老朋友一样招呼他，还亲了亲他的两边脸颊。迪基很意外，觉得自己早就大得不该这样挨亲了。男人又铺开麻袋，请他坐在阳光下的大方木上。
        - id: ch01-b77
          speaker: sebastian
          text: >-
            理查德少爷，看见你，我这双眼睛都舒坦了。你好久没来拿那些问题折腾我。如今全结实了吧？骨头都好好的吧？来，我照答应的教你造大帆船。
        - id: ch01-b78
          speaker: dickie
          text: 您真肯教我？
          emotion: happy
        - id: ch01-b79
          speaker: sebastian
          text: >-
            当然。你在床上偷懒的时候，我替你造了件东西。瞧吧，一艘真正的英格兰战船。
          emotion: happy
        - id: ch01-b80
          speaker: narrator
          text: >-
            塞巴斯蒂安放下螺旋钻，走进低矮的棚屋。转眼，他托出一艘小船，正是河上那种高高耸起的古怪船只，模型做得样样齐全。
        - id: ch01-b81
          speaker: sebastian
          text: >-
            这是照我的老船造的，就是《黄金奇遇号》。当年我跟罗利大人乘它出海，击沉那支该受诅咒的无敌舰队，剪了西班牙国王的翅膀，还烧焦了他的胡子。
        - id: ch01-b82
          speaker: dickie
          text: 无敌舰队？西班牙无敌舰队？
          emotion: surprised
        - id: ch01-b83
          speaker: sebastian
          text: 还能是哪一支？这故事你都听过上千遍了。
        - id: ch01-b84
          speaker: dickie
          text: 我还想再听一次。
        - id: ch01-b85
          speaker: narrator
          text: >-
            于是，塞巴斯蒂安又讲起英格兰怎样面对巨大的危险，又怎样奇迹般逃过一劫。事情跟历史书里写的一样，可从这个人嘴里听来，感觉完全不同。他当时就在海上，亲身尝过那份危险，也亲眼看着自己的国家死里逃生。迪基听得一动不动，连呼吸都屏住了。
        - id: ch01-b86
          speaker: sebastian
          text: >-
            最后，主呼出一口气，风暴应声扑向西班牙舰队，把船全打散了。兵器、财宝、大炮、炮手、水手和战舰，都沉进我们的海里。剩下的船被赶向北方，有的撞上礁石，有的让我们的战船迎头收拾。只有可怜的几艘越过大海，像受伤的野鸭拖着翅膀逃回去，告诉主人，主为英格兰做了什么。
        - id: ch01-b87
          speaker: dickie
          text: 那是多久以前的事？
        - id: ch01-b88
          speaker: narrator
          text: >-
            按迪基的记忆，那应该是几百年前的事，可究竟是三百年还是五百年，他怎么也想不起来。无论是哪一个数字，总归隔着好几百年。难道眼前这个头发才刚刚泛起一点灰白、脸上还很有精神的人，竟已经活了几百岁？
        - id: ch01-b89
          speaker: sebastian
          text: >-
            大概二十年吧。先看看这艘漂亮的小船。它全归你，是我特意给你造的。
        - id: ch01-b90
          speaker: narrator
          text: >-
            这真是一艘漂亮的小船，是伊丽莎白时代战船的完美模型。船头船尾高高筑起，塞巴斯蒂安说那是为了显出威严，震住敌人。上层甲板、下层甲板、中腰甲板、艉楼和船舱，一样不少。艏楼、住舱、桅杆、帆桁、炮眼、大炮、船帆、船锚和雕花船首像，也全都做得齐齐整整。船身涂成白、绿、红三色，船头船尾的雕饰繁丽极了，上面还镀了金。
        - id: ch01-b91
          speaker: dickie
          text: 真的给我？这全是您亲手造的？
          emotion: surprised
        - id: ch01-b92
          speaker: sebastian
          text: >-
            说实话，我早就动手了，一个个长冬夜慢慢做。现在它完工了，就是你的。来，我给你系上围裙。你做我的学徒，再学着造一艘同样漂亮的船。以后两艘一起放进你父亲花园的池塘。
        - id: ch01-b93
          speaker: narrator
          text: >-
            迪基的眼睛仍贪婪地盯着小小的《黄金奇遇号》，怎么也舍不得移开。他任塞巴斯蒂安替自己围上皮围裙，又接过对方递来的工具。光滑的木柄贴在掌心，让这一切显得比梦还真。
        - id: ch01-b94
          speaker: dickie
          text: >-
            可我还是不懂。您记得二十年前的无敌舰队，我怎么觉得那是几百几百年前？
        - id: ch01-b95
          speaker: sebastian
          text: >-
            还不到二十年，差不多十八年。你要做我的学徒，算术可得再好些。那是一五八八年，如今是一六〇六年，正好十八年。
        - id: ch01-b96
          speaker: dickie
          text: 可我的梦里是一九〇六年。我是说，发热时的梦。
        - id: ch01-b97
          speaker: sebastian
          text: 人一发热，心神就会跑到很远的地方。来，木头这样握，刀子这样拿。
        - id: ch01-b98
          speaker: narrator
          text: >-
            从此，迪基每天上完功课就去船坞。如今他也有正式的功课了。一位穿黑袍、总是不高兴的老师负责教书，迪基非常讨厌他，那位老师似乎也不喜欢迪基。老师向奶妈抱怨，说孩子一场热病，把从他那里学过的东西全忘光了。奶妈只是心领神会地点点头，说迪基很快会重新学会。她果然没说错。迪基飞快地学回许多东西，每一次与其说是在学习，不如说是把埋在心里的旧知识重新想起来。
        - id: ch01-b99
          speaker: narrator
          text: >-
            早晨还有第二位老师来。这位亨利老师衣着神气，性情快活透顶。他穿红天鹅绒镶金衣裳，裤子鼓得像气球，外面披短斗篷，脖子上也戴着轮状皱领。他教迪基击剑和跳舞，也教他奔跑、跳跃和滚木球。他还答应，等时候一到，就教迪基摔跤、接球、射箭、铁圈球、墙网球、骑马和网球，把出身高贵的少年理当会的运动和游戏一样样全教会。
        - id: ch01-b100
          speaker: narrator
          text: >-
            几个星期过去，父亲和母亲仍没回来。可迪基的日子塞得很满。他学会了一点希腊文和更多拉丁文，会在一只盒盖上雕出自家的纹章，也能亲手把盒盖做得严丝合缝。他会像宫廷里的贵人一样鞠躬，也会像绅士一样说话。他甚至能用客厅里的维奥尔琴拉一首简单的曲子。那把琴平时放在那里，是给主人和主母的客人等待时解闷用的。
        - id: ch01-b101
          speaker: narrator
          text: >-
            一天，奶妈替他穿上最体面的镂花天鹅绒礼服。紫色衣料下露着金衬里，腰间佩着一把小剑，头上戴着扁帽。亨利老师带他坐上一条小船，又登上一艘金碧辉煌的大画舫。满船都是衣饰华美的绅士淑女，人人都来亲吻他，围着他问长问短，还说他病后长高了许多。一位衣着格外华贵的绅士，看来是他的姨父。穿蓝银衣裙的夫人迷人极了，似乎是他的姨母。一对快活的小表兄妹坐在他身旁，一路陪他说说笑笑。
        - id: ch01-b102
          speaker: narrator
          text: >-
            银盘送来水果和糕饼，也送来一杯杯葡萄酒。画舫装满鲜花，旁边另一条船上传来乐声。阳光照在头顶，清亮的河面闪闪发光。水上的船越来越多，全都镀着金，绕着花环。欢呼声忽然响起，拔出的刀剑映得河面寒光闪闪，淑女们像一群蝴蝶，挥动发亮的围巾和手帕。一艘巨大的金色御船缓缓顺流而下，后面跟着一列较小的船。画舫上人人站起，绅士拔剑致敬，淑女高高扬起围巾。
        - id: ch01-b103
          speakers: [cousin_girl, cousin_boy]
          ensemble: duo
          text: 是国王陛下和王后。
        - id: ch01-b104
          speaker: narrator
          text: >-
            所有画舫一艘接一艘排到御船后，组成美丽的长队，缓缓顺流而下。表兄妹又有趣又亲切，大人们也和善，周围的一切美丽而洁净。迪基快活得不得了。这一天简直没有一处不好。河流本身也美极了，两岸长满柳树和桤木。千屈菜、绣线菊、柳兰和蓍草长得又高又密，背阴的回水湾里漂着睡莲。一座座美丽的花园沿着斜坡，一直伸到水边。
        - id: ch01-b105
          speaker: narrator
          text: 船队终于来到一座藏在树木间的秀丽小镇。
        - id: ch01-b106
          speaker: cousin_girl
          text: >-
            我们在这里下船。国王今晚住在托马斯·布拉德伯里爵士家，我们住外祖父家。明天托马斯爵士的花园要演假面剧，我们也能看。理查德，你的热病好了真好。要是你没来，这场热闹连现在一半有趣都没有。
          emotion: happy
        - id: ch01-b107
          speaker: cousin_boy
          text: >-
            过后我们跟你回德特福德，住上一个月。我要看你的大帆船，还要叫老塞巴斯蒂安也替我造一艘。
        - id: ch01-b108
          speaker: dickie
          text: 好。可这里到底叫什么地方？
        - id: ch01-b109
          speakers: [cousin_girl, cousin_boy]
          ensemble: duo
          text: 格雷夫森德呀。难道热病让你连这个也忘了？
        - id: ch01-b110
          speaker: dickie
          text: 格雷夫森德？
          emotion: surprised
        - id: ch01-b111
          speaker: aunt
          text: >-
            来吧，孩子们。你们两个男孩还记得我教过的吧，要怎样替我托住裙摆。我的姑娘也别忘了，等国王和王后从台阶上走下来，要从镀金花篮里把花撒出去。
        - id: ch01-b112
          speaker: narrator
          text: >-
            外祖父的宅子和花园、那位庄重的白发老人，全像梦一样。人们称那位老人为大人，看来他就是姨母的父亲。宅里摆开宴席，长长的画廊灯火通明。花园里，一盏盏彩色小油灯从这棵树连到那棵树，像彩带一样挂成灯串。火炬熊熊燃烧，音乐在夜色里回荡。假面剧原来是一种没有台词的戏，人人都穿着最奇异、最华美的服装。就连王后本人也参加了，她身上全是轻纱、珠宝和白天鹅羽毛。
        - id: ch01-b113
          speaker: narrator
          text: >-
            可从头到尾，一串话一直在迪基心里轻轻反复，从不停止。格雷夫森德。比尔就在那里的客栈等他。那个被他叫作爸爸的人还在等。他答应过，只要能办到就马上回去，为什么还不去？比尔等候的客栈就在这里。那些话一遍又一遍，没有尽头。它们钻进迪基看到、听到、感觉和想到的一切下面，又浮到一切上面，还从每件事中间穿过去。心里有这样的声音说个不停，谁还能享受眼前的欢乐呢？
        - id: ch01-b114
          speaker: narrator
          text: >-
            最糟的是，自从发现双腿不瘸以后，他第一次不只是隐约觉得，而是清清楚楚地知道，新十字的生活根本不是热病里的梦。比尔一直善待他，推着婴儿车带他走过美好的乡野，还跟他一起睡在绿帷幕围住的床上。那个让他叫作爸爸的人不是梦影。此时此刻，比尔真的就在格雷夫森德等他回去。
        - id: ch01-b115
          speaker: dickie
          text: 这里才是梦。我非醒来不可。
        - id: ch01-b116
          speaker: narrator
          text: >-
            可他醒不过来。树木、草地、灯火和一切美好的东西，穿华服的亲切人们，国王、王后、姨父姨母和小表兄妹，全都不肯像梦里的景物那样淡去，也不肯搅成模糊的一团。它们还是那么坚实，那么真切。迪基知道比尔、格雷夫森德、新十字和那段跛脚生活才是真的，可他偏偏醒不了。尽管如此，眼前所有东西的光彩都已经熄灭。等他终于回到德特福德父亲的宅子，早就疲惫不堪。奶妈替他脱下衣服时，他再也忍不住，忽然放声大哭。
        - id: ch01-b117
          speaker: nurse
          text: 我的小羊羔，你这是怎么了？
        - id: ch01-b118
          speaker: dickie
          text: 我说不清，你不会懂的。
          emotion: sad
        - id: ch01-b119
          speaker: nurse
          text: 你试着告诉我。
        - id: ch01-b120
          speaker: narrator
          text: 迪基望着房里的挂毯和厚重家具。
        - id: ch01-b121
          speaker: dickie
          text: 我真的说不出来。
        - id: ch01-b122
          speaker: nurse
          text: 试试看。
        - id: ch01-b123
          speaker: dickie
          text: >-
            那是……奶妈，你别笑。我做过一个梦，可它像真的一样。梦里有个很可怕的地方，跟这里完全不同。那里有个人在等我。我还不是现在这个我的时候，他一直对我很好。现在他仍在梦里等，可我想回去，却怎么也回不去。
          emotion: sad
        - id: ch01-b124
          speaker: nurse
          text: 留在这里，不是比待在那个可怕的地方好吗？
        - id: ch01-b125
          speaker: dickie
          text: >-
            是好。可比尔还在那里等我。要是我能把他带到这边来，那该多好。
          emotion: sad
        - id: ch01-b126
          speaker: nurse
          text: 现在还不成。要把我们爱的人从一场梦带进另一场梦，可不容易。
        - id: ch01-b127
          speaker: dickie
          text: 从一场梦，带进另一场梦？
        - id: ch01-b128
          speaker: nurse
          text: >-
            你没听人说过，整个生命都是一场梦吗？不过你会回去的。愿上天不让你们家任何人辜负朋友。瞧，床单已经换干净了。你躺好别动，只想着那个善待你的人。
        - id: ch01-b129
          speaker: narrator
          text: >-
            迪基直直躺着，一动不动。他已经决定，要醒回从前艰苦、残酷的生活，醒回贫穷、乏味和跛脚。他没有别的选择，必须回去守住对比尔的承诺。可这太难了，太难了，实在太难了。那些美丽的房屋与花园，那些游戏，亲手造船的时光，柔软舒服的衣裳，还有每一个待他和善的人，他都得离开。最舍不得的，还有那种叫人振奋的感觉。他在这里是一个重要人物，长大后要承担许多责任，能够照料很多人。然而他必须放下这一切。是的，只要办得到，他一定离开。
        - id: ch01-b130
          speaker: narrator
          text: 奶妈从壁炉夹出一块燃烧的木头，放到银盘里，又在红亮的余烬间撒了些东西。
        - id: ch01-b131
          speaker: nurse
          text: >-
            身子躺直，一点也别动。只管想着你离开那场梦时，自己待着的地方。
        - id: ch01-b132
          speaker: narrator
          text: >-
            迪基照做了。浓郁香甜的烟从银盘升起来，奶妈用极低的声音吟唱。
        - id: ch01-b133
          speaker: nurse
          text: |-
            人会死，
            人却不灭。
            岁月飞逝，
            时间不歇。
        - id: ch01-b134
          speaker: narrator
          text: >-
            他只听清这几句，也隐约知道后面还有。他像沉进柔软的睡眠之海，随着潮水轻轻摇荡。忽然，海浪猛地把他抛起，粗暴地摔上一片坚硬的清醒海岸。
        - id: ch01-b135
          speaker: narrator
          text: >-
            他睁开眼睛，发现自己仍在新十字那间光秃秃的小前屋。叮当儿和白印章还躺在地板上，白色月亮花种子乱纷纷散在四周。街边煤气灯的光穿过肮脏的窗玻璃，照着用来铺盖的旧报纸和粗麻布。美丽宅邸、花园和绿野全都不见了。
        - id: ch01-b136
          speaker: dickie
          text: 好一场梦！啊，真是好一场梦！
          emotion: surprised
        - id: ch01-b137
          speaker: narrator
          text: >-
            迪基浑身发抖，困意也沉沉压着他。他先把叮当儿和白印章塞进一个口袋，又用手把散乱的月亮花种子一颗颗拢起来，装进另一个口袋。随后，他拉过地上的旧报纸盖住自己，在这间空屋里又睡着了。
        - id: ch01-b138
          speaker: narrator
          text: 清晨，阳光把他唤醒。
        - id: ch01-b139
          speaker: dickie
          text: >-
            真怪。我梦见了那么多事，一星期接一星期，结果只占一夜里的一小会儿！要是真的该多好。
        - id: ch01-b140
          speaker: narrator
          text: >-
            他急着赶去格雷夫森德，一跃而起。既然特意从那场奇妙的梦里醒来，就是为了去格雷夫森德，那还不如马上动身。可这一跃没有让他站稳。恶心的疼痛猛地袭来，他整个人侧着摔倒，脑袋重重撞在护墙板上。
        - id: ch01-b141
          speaker: dickie
          text: 我忘了。没想到一场梦，竟让我把这只脚忘得干干净净。
        - id: ch01-b142
          speaker: narrator
          text: >-
            他真的忘了那只脚。他像一个双腿健全的孩子那样，带着十足的急切和自信跳起来。可那只跛脚立刻背叛了他，把他整个人掀翻在地。迪基只得趴下来，慢慢爬向放拐杖的地方。那根拐杖原是一把截短的旧扫帚，塔尔博特夫人曾亲手替他包上黑天鹅绒。
        - id: ch01-b143
          speaker: dickie
          text: >-
            好了，现在得去格雷夫森德。不知道以前的德特福德是不是真像梦里那样，有花园、清亮的河水，还有田野。
        - id: ch01-b144
          speaker: narrator
          text: >-
            他趁人不注意溜出房子，沿街走去。拐杖敲着人行道的尘土，笃嗒，笃嗒。背在痛，跛脚也痛，那条好腿又累又僵，连心都疲倦了。在那场由他为了比尔亲自放弃的梦里，此刻本该有一碗热气腾腾的粥，摆在长长的橡木桌尽头。也该有一把雕花大椅子，端端正正放在那里，等着那个没有回去的小男孩。可迪基只能继续走在阴沉肮脏的街道上。
        - id: ch01-b145
          speaker: narrator
          text: 迪基勇敢地向前走，可背上的疼一阵阵叫他恶心。
        - id: ch01-b146
          speaker: dickie
          text: 我不知道自己能不能走到。
        - id: ch01-b147
          speaker: narrator
          text: >-
            就在他怀疑自己能不能走到的时候，三只金球出现在眼前，正悬在那位友善的当铺老板门上。迪基看看那扇门，迟疑了一下。他实在没有别的办法，只好耸耸肩，拄着扫帚柄走了进去。
        - id: ch01-b148
          speaker: mr_rosenberg
          text: 嘿，又来了。想把拨浪鼓当掉，是不是？
        - id: ch01-b149
          speaker: dickie
          text: 不是。可你送我的印章，要是拿来当，能给我多少钱？
        - id: ch01-b150
          speaker: narrator
          text: 罗森伯格先生先瞪眼，再皱眉，最后大笑起来。
        - id: ch01-b151
          speaker: mr_rosenberg
          text: >-
            你真是天下第一号人物！我送你的礼物，你倒拿回来当给我。你真该是我们族里的人！好吧，你想当掉印章，是不是？
          emotion: surprised
        - id: ch01-b152
          speaker: dickie
          text: >-
            要不是实在没办法，我一点也不想当掉它，因为我非常喜欢这个印章。可我非得凑出去格雷夫森德的车钱。我的爸爸正在那里等我，我也不能再耽搁了。叮当儿我又舍不得留下，所以只能拿印章来问问。
        - id: ch01-b153
          speaker: narrator
          text: 他拿出拨浪鼓给老板看。
        - id: ch01-b154
          speaker: dickie
          text: 去格雷夫森德要多少车钱？
        - id: ch01-b155
          speaker: mr_rosenberg
          text: 你问我？
        - id: ch01-b156
          speaker: dickie
          text: 我不知道，还以为你知道。这个印章够不够车钱？
        - id: ch01-b157
          speaker: narrator
          text: 当铺老板迟疑着，紧紧盯住他。
        - id: ch01-b158
          speaker: mr_rosenberg
          text: 不够，印章不值那么多。不过它确实是个好印章，好得很。
        - id: ch01-b159
          speaker: dickie
          text: >-
            你听我说。我现在明白什么叫荣誉，也明白绅士说话要算数。既然你不肯收印章，就让我把诺言抵押给你，把我的名誉抵押给你。请借我去格雷夫森德的钱。我以一个绅士的名誉起誓，一个月内一定还清。
        - id: ch01-b160
          speaker: narrator
          text: >-
            他的声音很坚定。口音虽然有些奇怪，却已经不再像德特福德街头的孩子。这是另一个男孩在说话。那个男孩受过两位老师教导，拥有过一座大花园，参加过国王的水上巡游，也明白出身高贵的家族子弟意味着什么。他从梦里带回来的那些日子，此刻全在这番话里。
        - id: ch01-b161
          speaker: narrator
          text: >-
            罗森伯格先生一直望着他。凭着从不出错的直觉，他看出这孩子不是在演戏，那番话后面藏着某种真实的东西。人生的平凡琐事四周，也存在浪漫和伟大的事物。他的民族受过几百年的折磨、羞辱、残酷与压迫，却一直保留着看见它们的本领。他们不只看得见灰色由黑与白混在一起，也看得见黑色可以黑得多么深，还能相信世上也许有一种白，超过一切最洁白的梦。此刻，这种从血脉中传下来的浪漫情怀一下跃起来，回应了迪基的恳求。
        - id: ch01-b162
          speaker: mr_rosenberg
          text: >-
            你这小家伙真古怪。不过我喜欢你的胆量。每个男人一辈子总得犯一回傻。
        - id: ch01-b163
          speaker: dickie
          text: 你是说，肯借给我？
        - id: ch01-b164
          speaker: mr_rosenberg
          text: 我可真是个傻瓜。
        - id: ch01-b165
          speaker: narrator
          text: 罗森伯格先生伸手进衣袋，把几枚钱币放到红木柜台上。
        - id: ch01-b166
          speaker: dickie
          text: >-
            你不会后悔的，最后一定不会。这些真是借给我的？你愿意相信我？
        - id: ch01-b167
          speaker: mr_rosenberg
          text: 看来是这样。
        - id: ch01-b168
          speaker: dickie
          text: >-
            那么总有一天，我会替你做一件事。我还不知道是什么，但一定会做。我们从不忘记，我们……
        - id: ch01-b169
          speaker: narrator
          text: >-
            迪基说到一半停住了。刚才那句我们，本来要指梦里的那个家族。可他忽然想起，自己只是贫穷、跛脚的小迪基·哈丁，没有资格再用另一个姓氏，也没有资格借那个家族的口气许诺。他拿起柜台上的钱币，一枚枚放进口袋，手指正好碰到了装在里面的月亮花种子。
        - id: ch01-b170
          speaker: dickie
          text: >-
            你的好意，我现在没法报答，可总有一天我会还钱。至于这些月亮花种子，你喜欢这种花吗？
        - id: ch01-b171
          speaker: narrator
          text: 迪基从口袋里抓出一把白种子，隔着擦得光亮的红棕色木柜台，慷慨地递给罗森伯格先生。那一把足足有二十颗。
        - id: ch01-b172
          speaker: mr_rosenberg
          text: 谢谢你，小伙子。我会把它们种在暖和的温室里。
        - id: ch01-b173
          speaker: dickie
          text: 我觉得，它们在月光下长得最好。
        - id: ch01-b174
          speaker: narrator
          text: >-
            于是，迪基终于来到了格雷夫森德那家普通客栈。拐杖笃嗒笃嗒地敲过门槛。炉边坐着一个男人，看上去疲惫、悲伤，又焦急万分。一听见响动，他立刻站起来，飞快赶到门口，一把搂住迪基的肩膀。
        - id: ch01-b175
          speaker: loafer
          text: >-
            是小不点儿！真是你，不是别人！我还以为你让人逮住了。不，我没那么想。我知道你机灵，我知道你一定会回来。
          emotion: happy
        - id: ch01-b176
          speaker: narrator
          text: 迪基站在门口，环顾这间挤挤挨挨的流浪汉厨房。眼前普通又粗糙的一切，让他想起梦里那间洁净修长、四壁挂着织锦的餐厅，也想起那里为他摆好的长橡木桌和雕花椅子。
        - id: ch01-b177
          speaker: dickie
          text: 是，我当然会来。你希望我来，对不对？
        - id: ch01-b178
          speaker: narrator
          text: >-
            比尔紧紧抱着他，低头望着他。那神情就像一个人吃尽千辛万苦，长久寻找，几乎已经绝望，最后终于寻回一件世上再没有第二件的稀世珍宝。
        - id: ch01-b179
          speaker: loafer
          text: 希望你来？那还用说！我才不信你不来呢。
          emotion: happy
        - id: ch01-b180
          speaker: narrator
          text: 比尔说完，仍舍不得松开手。他把迪基拉进屋里，让这个终于归来的小不点儿站到温暖的炉火旁，然后转身关紧了客栈房门。
        - id: ch01-b181
          speaker: dickie
          text: 那我很高兴自己来了。
        - id: ch01-b182
          speaker: narrator
          text: >-
            可他的心并不高兴。心底深处，他渴望回到那座宜人的宅子。在那里，他是年轻的小主人，双腿再也不瘸。但他的灵魂是高兴的，因为灵魂比内心更伟大，也懂得更伟大的事。如今，迪基比过去更爱比尔，因为他为了比尔牺牲了自己的梦。所以，他终究还是得到了东西。爱一个人，是世上最美好的事，甚至比被人爱还要好。你也可以好好想一想，看看这句话到底对不对。
        - id: ch01-b183
          speaker: narrator
          text: 晚茶吃的是鲱鱼。夜里，迪基又躺到那张硬床上，把衣服和靴子照旧塞进枕垫下面。他走了那么远的路，也经历了那么多事，很快便沉沉睡去。可是这一夜，他没有做梦。
        - id: ch01-b184
          speaker: narrator
          text: 第二天早晨，他醒来想起许多事，问自己。
        - id: ch01-b185
          speaker: dickie
          text: 这个才是梦吗？还是另一个才是梦？
        - id: ch01-b186
          speaker: narrator
          text: >-
            这问题听起来仿佛很傻。粗糙的床单实实在在贴着他的皮肤，拥挤屋子里的气味钻进鼻孔，比尔先生的声音也清清楚楚响在耳边。可梦里的一切同样留在他的记忆里，叫他没法轻易分清。
        - id: ch01-b187
          speaker: loafer
          text: 起来啦，小不点儿，早饭有香肠吃。
