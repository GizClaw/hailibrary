  chapters:
    - id: ch01
      title: Which Was the Dream?
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The two white triangles of seeds lay crossed on the floor of the empty house. Tinkler and the white seal rested in the middle. As Dickie watched, everything grew faint. His eyes smarted with tiredness, and he gladly closed them. For one strange moment, he fancied he could see something moving inside the star, right through his eyelids. Of course that was nonsense. Nobody can see through closed eyes. But his eyelids had grown too heavy to lift, even when a voice spoke close beside him. Dickie was sure a policeman had come to take him away for being inside somebody else's house.
        - id: ch01-b02
          speaker: dickie
          text: "Let him."
        - id: ch01-b03
          speaker: narrator
          text: >-
            He was too sleepy to be frightened. Yet the voice was far softer and smaller than any policeman's voice.
        - id: ch01-b04
          speaker: soft_voice_1
          text: "Well, then, where do you want to go?"
        - id: ch01-b05
          speaker: dickie
          text: "Anywhere. I don't mind."
        - id: ch01-b06
          speaker: narrator
          text: >-
            Dickie thought he was being offered a choice of police stations. Then the two small voices whispered together, making a sleepy sort of music.
        - id: ch01-b07
          speaker: soft_voice_1
          text: "He belongs more to you than to me."
        - id: ch01-b08
          speaker: soft_voice_2
          text: "But you belong more to him than I do."
        - id: ch01-b09
          speaker: soft_voice_1
          text: "You're older."
        - id: ch01-b10
          speaker: soft_voice_2
          text: "And you're stronger."
        - id: ch01-b11
          speaker: soft_voice_1
          text: "Let's spin for it."
        - id: ch01-b12
          speaker: narrator
          text: >-
            Something hummed, then ended with a tiny tinkling fall.
        - id: ch01-b13
          speaker: soft_voice_2
          text: "That decides it. Here?"
        - id: ch01-b14
          speaker: soft_voice_1
          text: "And when?"
        - id: ch01-b15
          speaker: soft_voice_2
          text: "Three is a good number."
        - id: ch01-b16
          speaker: narrator
          text: >-
            Quiet settled around Dickie, and sleep wrapped him like a soft cloak. When he woke, his eyelids felt light again. He opened them and blinked into broad daylight.
        - id: ch01-b17
          speaker: dickie
          text: "That was a funny dream."
        - id: ch01-b18
          speaker: narrator
          text: >-
            He was lying in a huge, unfamiliar bed. The room around it was unlike any room he knew. Low, long windows were divided by upright strips of stone. Flowers and green herbs covered the dark wooden floor. The bed had four posts like the one at Talbot House, but its green curtains were woven with a white design like the marks on Tinkler and the seal. Lavender and other herbs lay across the coverlet. Needlework pictures hung on the walls. Massive wooden furniture, deeply carved, filled the room. A dark wardrobe towered against one wall, high-backed chairs stood against another, and a wide open hearth sat beneath a tall hooded chimney.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Cups and labelled bottles stood on a small table near the bed. At its foot sat a stout woman in full skirts, a strange white cap, and a stiff ruff that reminded Dickie of the paper frills in the ham-and-beef shops on New Cross Road.
        - id: ch01-b20
          speaker: dickie
          text: "What a very curious dream!"
        - id: ch01-b21
          speaker: nurse
          text: >-
            So you've found your tongue at last. Anyone sick with fever may expect curious dreams. But this is your own tongue now, not the wandering one that has rattled on for days.
        - id: ch01-b22
          speaker: dickie
          text: "But I thought I was in the front room at—"
        - id: ch01-b23
          speaker: nurse
          text: >-
            You're here. The other place was the dream. Forget it, and don't speak of it. Talking about such dreams brings bad luck. Now it is time for your posset.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Though it was summer outside, a little fire burned on the hearth. The nurse fetched a small pot, poured gruel into a silver bowl, and added white wine. Roses were worked into the bowl, with strange letters around its rim that Dickie only noticed later. She stirred the gruel with a silver spoon and fed him like a baby, cooling every spoonful with her breath. It tasted sweet and pleasant. Dickie stretched in the soft bed, perfectly comfortable, and fell asleep again.
        - id: ch01-b25
          speaker: narrator
          text: >-
            The next time he woke, his mind was crowded with questions.
        - id: ch01-b26
          speaker: dickie
          text: >-
            How did I get here? Was I run over again? Is this a hospital? And who are you?
        - id: ch01-b27
          speaker: nurse
          text: >-
            Don't start wandering again. You're at home, in the best bed in your father's house at Deptford. You have been ill with the plague fever, and now you're better. At least, you should be. Surely you know your own old nurse.
        - id: ch01-b28
          speaker: dickie
          text: >-
            I never had any nurse, old or new. You've mistaken me for another boy. Where did you find me? I've never been here before.
        - id: ch01-b29
          speaker: nurse
          text: >-
            Lie still and think. You'll remember me soon enough. Next you'll tell me you've forgotten your own name.
        - id: ch01-b30
          speaker: dickie
          text: "I haven't forgotten it."
        - id: ch01-b31
          speaker: nurse
          text: "Then what is your name?"
        - id: ch01-b32
          speaker: dickie
          text: "Dickie Harding."
        - id: ch01-b33
          speaker: nurse
          text: >-
            Why, you have forgotten! They say fever can harm the memory, but this is beyond anything. Has it muddled your poor head so badly that you don't know your name is Richard?
          emotion: surprised
        - id: ch01-b34
          speaker: narrator
          text: >-
            The surname she gave him sounded nothing at all like Harding.
        - id: ch01-b35
          speaker: dickie
          text: "Is that truly my name?"
        - id: ch01-b36
          speaker: nurse
          text: "Indeed it is."
        - id: ch01-b37
          speaker: narrator
          text: >-
            A strange certainty began to settle over Dickie. He had expected sleep to end this dream and return him to the empty house at New Cross. Instead, he had awakened inside the same dream. Perhaps he truly belonged here. Perhaps this rich, comfortable room was real, while the dirty, wretched life at New Cross had only been a fever dream. He studied the nurse's kind face, the green branches beyond the window, the tapestry, and the herbs scattered on the floor. At last he spoke.
        - id: ch01-b38
          speaker: dickie
          text: "Nurse?"
        - id: ch01-b39
          speaker: nurse
          text: "Ah, I knew you'd come back to yourself. What is it, dear heart?"
        - id: ch01-b40
          speaker: dickie
          text: >-
            If I really am the person you named, then I've forgotten everything. Will you tell me all about myself?
        - id: ch01-b41
          speaker: narrator
          text: >-
            The nurse said she had expected as much, and began telling him wonders. His father was Sir Richard, knighted by the King only the year before. This was his country house among the fields and orchards of Deptford. Dickie had nearly died of the plague fever, but with God's blessing and Doctor Carey's care, he was recovering.
        - id: ch01-b42
          speaker: nurse
          text: >-
            When you're strong and the sickness has been cleared from the house, your cousins will come from Sussex. Later you can visit their London home and see the sights. Ah, here comes the doctor now. Look your best, dear heart, or he may bleed you and drench you again. You're far too weak for that, whatever doctors think.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Dickie did not know what bleeding meant, but he disliked the sound of it. He sat up and discovered that he was stronger than he had thought. Excitement brought color to his cheeks. When Doctor Carey arrived in a long black robe, black stockings, and a pointed hat, he felt Dickie's pulse and admitted that the boy was almost well.
        - id: ch01-b44
          speaker: doctor_carey
          text: >-
            We have cured him, Goody, you and I. Now he needs kitchen medicine. Give him broth, gruel, panada, wine from France and the Rhine, and the juice of oranges and lemons. If you have none, crush fresh apples in a mortar and give him their juice. Ah, does my cure please you, boy? Then smell it. It has been many days since you cared to.
        - id: ch01-b45
          speaker: narrator
          text: >-
            He held the gold knob of his cane beneath Dickie's nose. Tiny holes pierced it like the lid of a pepper caster. A powerful sweet smell came through them, rather like a grocer's shop mixed with a chemist's.
        - id: ch01-b46
          speaker: dickie
          text: "What is that?"
        - id: ch01-b47
          speaker: nurse
          text: >-
            He has forgotten everything. That is the doctor's pomander. It holds spices and perfumes to keep infection away.
        - id: ch01-b48
          speaker: doctor_carey
          text: >-
            The warmth of my hand releases the scent. Now that the fever has gone, fumigate the room. Brew amber, nitre, wormwood, vinegar, quinces, myrrh, camphor, fresh camomile flowers, and musk. Do not forget the musk. Carry the steam through the chamber. Burn the old floor herbs and every sweeping on the hearth, spread fresh herbs and flowers, put everything in order, and give thanks that you are not preparing for a burial.
        - id: ch01-b49
          speaker: narrator
          text: >-
            With those cheerful words, the doctor smiled, nodded to his patient, and left. Dickie no longer knew what to believe. Was he Dickie Harding, who had lived at New Cross, planted Artistic Parrot Seed, and taken the road with Mr. Beale? Or was he this other boy, the son of a knight, living among green trees in Deptford? There had been no fields or orchards in the Deptford he knew. Perhaps there were two Deptfords, as there were two Bromptons and two Richmonds. And perhaps this boy had a real mother as kind as Lady Talbot.
        - id: ch01-b50
          speaker: narrator
          text: >-
            The nurse boiled the doctor's ingredients in a three-legged iron pot. Two maids carried it around the room while strong, sweet, spicy steam puffed from it.
        - id: ch01-b51
          speaker: dickie
          text: "Nurse, have I got a mother?"
        - id: ch01-b52
          speaker: narrator
          text: "The nurse gathered him into her arms."
        - id: ch01-b53
          speaker: nurse
          text: >-
            Indeed you have, though she is ill at your father's other house. And you have a baby brother, Richard.
        - id: ch01-b54
          speaker: dickie
          text: >-
            Then I think I'll stay here and try to remember who I am. I mean, who you say I am. I won't try to dream about New Cross or Mr. Beale anymore. If this is a dream, it is the better one. Please let me stay and see my mother and little brother.
        - id: ch01-b55
          speaker: nurse
          text: "You shall, my lamb. You shall."
        - id: ch01-b56
          speaker: narrator
          text: >-
            More food and sleep followed, more nights and days, talks and silences. Slowly and yet very quickly, Dickie learned about the boy who both was and was not himself. He admitted that he remembered nothing, so the nurse spent hours telling him about this other Richard's short life. The moment she told him something, he seemed to remember it, not like a story he had heard, but like an event that had truly happened to him. Day by day, he grew more certain that he was this Richard and had only dreamed the old life with his aunt and Mr. Beale.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Before long, the nurse dressed him in fine clothes that felt strange and yet comfortable, then carried him to the window. From a great oak chair he saw green fields sloping toward the river and ships passing under forests of masts and rigging. The rigging looked familiar, but these ships were shorter, broader, and much higher above the water than the vessels he remembered.
        - id: ch01-b58
          speaker: dickie
          text: "I'd like to see those ships close up."
        - id: ch01-b59
          speaker: nurse
          text: >-
            When you're well, you'll always be running to the dockyard again. I know your old ways. You'll listen to the master mariners and plan a galleon of your own, bound for the golden lands of South America.
        - id: ch01-b60
          speaker: dickie
          text: "What is a galleon?"
        - id: ch01-b61
          speaker: narrator
          text: >-
            The patient nurse explained it. Dickie was happy. This life seemed to hold more room and more time than the old one. Nobody hurried, and the nearest house was a quarter of a mile away across the fields. The servants called him Master Richard. Their respect made him feel that great things were expected of him. One day he must be brave, generous, honorable, and kind. He would be responsible for the servants and laborers under his care. He knew what poor people needed, because he had been poor, or had dreamed he was. The thought filled his heart. His father's wealth would one day be his, and he could use it for their happiness and for God's glory.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Hour by hour he changed from little Dickie Harding of the ugly yellow streets into Richard, the young master who slept softly and dreamed of using power kindly. He loved everything here: the carved furniture and rich hangings, his nurse and the laughing maids, the doctor with long speeches and quick smiles, the river and ships, the gardens and trees. Even the sky seemed cleaner than the sky above the Deptford he had known.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Then one morning the nurse dressed him and told him to walk to the window instead of waiting to be carried.
        - id: ch01-b64
          speaker: dickie
          text: "Where is my... where did you put my crutch?"
        - id: ch01-b65
          speaker: nurse
          text: >-
            Your crutch? Wake out of that dream, silly boy. You need no crutch with two straight, strong legs. Come, use them. Walk.
        - id: ch01-b66
          speaker: narrator
          text: >-
            Dickie looked down. In his New Cross days, he had hated looking at his feet, and in this new life he had avoided it. Now he hesitated over them.
        - id: ch01-b67
          speaker: nurse
          text: "Come along."
          emotion: calm
        - id: ch01-b68
          speaker: narrator
          text: >-
            He slid from the tall bed and tried. Both feet met the floor firmly and evenly. He stood straight. First he moved the foot he had always used. Then he moved the foot that had never moved. Two steps, three, four. Suddenly he turned, flung himself against the bed, and buried his face in his arms.
        - id: ch01-b69
          speaker: nurse
          text: "Are you crying, my lamb?"
        - id: ch01-b70
          speaker: narrator
          text: "She came close, and Dickie clung to her with all his strength."
        - id: ch01-b71
          speaker: dickie
          text: >-
            Oh, Nurse, I dreamed I was lame! I thought it was true, but it isn't. It isn't! It isn't!
          emotion: happy
        - id: ch01-b72
          speaker: narrator
          text: >-
            Soon Dickie could go downstairs and out into the garden. He followed grassy walks beneath fruit trees trained over trellises and even tried bowls on the long green. The house was finer than any he had known, and its garden surpassed Talbot Court. Yet their beauty was not his greatest joy. He could race through the arched paths, jump, and take the carved stairs three at a time. Once he had lived wingless among people who could fly. Now Dickie was lame no more.
        - id: ch01-b73
          speaker: narrator
          text: >-
            His strong feet seemed clever in their own right. They found the hilltop blacksmith, the center of the garden maze, and, best of all, the dockyard. Dickie loved watching people make things. At New Cross he had often watched workmen open square doors in the pavement and pull out yard after yard of wire. Here his feet took him to a man in a huge leather apron, working on great timbers with unfamiliar tools.
        - id: ch01-b74
          speaker: narrator
          text: >-
            The man welcomed Dickie like an old friend and kissed both his cheeks, which surprised him and made him feel far too grown-up for such treatment. Then the man spread a sack on a great beam so Dickie could sit in the sun.
        - id: ch01-b75
          speaker: sebastian
          text: >-
            Master Richard, you're a sight for sore eyes. It has been many a day since you came to plague me with questions. Are you strong again, with no bones broken? Good. Now I'll teach you to build a galleon, just as I promised.
        - id: ch01-b76
          speaker: dickie
          text: "Will you really?"
          emotion: happy
        - id: ch01-b77
          speaker: sebastian
          text: >-
            That I will. And look what I made while you were lazing in bed. Here is a true English ship of war.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Sebastian set down his auger, disappeared into a rough low shed, and returned carrying a little ship. It was a perfect model of the strange tall vessels Dickie had seen on the river.
        - id: ch01-b79
          speaker: sebastian
          text: >-
            She is the very image of my old ship, the Golden Venture. I sailed in her with Master Raleigh. We helped sink the cursed Armada, clipped the King of Spain's wings, and singed his beard.
        - id: ch01-b80
          speaker: dickie
          text: "The Armada? The Spanish Armada?"
          emotion: surprised
        - id: ch01-b81
          speaker: sebastian
          text: "What other Armada could I mean? You've heard the tale a thousand times."
        - id: ch01-b82
          speaker: dickie
          text: "I want to hear it once more."
        - id: ch01-b83
          speaker: narrator
          text: >-
            So Sebastian told him how England had faced terrible danger and escaped it. It was the same account found in history books, but it sounded entirely different from a sailor who had felt the danger himself. Dickie listened without breathing.
        - id: ch01-b84
          speaker: sebastian
          text: >-
            Then the Lord's breath went out as a storm. It struck Spain's fleet and scattered it. Ships sank in our waters with their weapons, treasure, guns, gunners, sailors, and fighting men. The rest were driven north. Some broke on the rocks, some met our ships, and a poor few limped home across the sea like wounded wild ducks. They carried word to their king of what God had done for England.
        - id: ch01-b85
          speaker: dickie
          text: "How long ago did that happen?"
        - id: ch01-b86
          speaker: narrator
          text: >-
            Dickie thought the Armada belonged hundreds of years in the past. Could this sailor, whose hair had only begun to gray, truly be centuries old?
        - id: ch01-b87
          speaker: sebastian
          text: >-
            How long? About twenty years. Look at this pretty ship. She is yours, because I made her for you.
        - id: ch01-b88
          speaker: narrator
          text: >-
            The model was built high at bow and stern, as Sebastian said, to show majesty and frighten the enemy. It had decks, hold, masts and spars, cabin and forecastle, gun ports, sails, anchor, and a carved figurehead. Its woodwork shone white, green, and red, with rich carving and gold at either end.
        - id: ch01-b89
          speaker: dickie
          text: "For me? Truly mine? And you made it yourself!"
          emotion: happy
        - id: ch01-b90
          speaker: sebastian
          text: >-
            To tell the truth, I began it many winter evenings ago. Now it is finished, and it belongs to you. Put on this apron and become my apprentice. You can learn to build her a companion, and we will sail them together on your father's pond.
        - id: ch01-b91
          speaker: narrator
          text: >-
            Dickie could hardly stop staring at the Golden Venture. He let Sebastian tie on the leather apron and took the smooth-handled tool the shipwright offered.
        - id: ch01-b92
          speaker: dickie
          text: >-
            But I don't understand. You remember the Armada only twenty years ago. I thought it happened hundreds and hundreds of years ago.
        - id: ch01-b93
          speaker: sebastian
          text: >-
            Twenty years, or closer to eighteen. You'll need better arithmetic if you mean to be my apprentice. The Armada came in 1588, and this is 1606. By my count, that makes eighteen years.
        - id: ch01-b94
          speaker: dickie
          text: "It was 1906 in my dream. I mean, in my fever."
        - id: ch01-b95
          speaker: sebastian
          text: >-
            Fever carries people a long way. Now hold the wood here, and take the knife like this.
        - id: ch01-b96
          speaker: narrator
          text: >-
            After lessons each day, Dickie returned to the dockyard. His sour-faced tutor wore a black gown, and neither he nor Dickie liked the other much.
        - id: ch01-b97
          speaker: tutor
          text: "The fever has made this child forget every lesson I ever taught him."
        - id: ch01-b98
          speaker: narrator
          text: >-
            The nurse answered that it would all come back, and it did. Learning felt more like remembering. Another tutor arrived each morning dressed in red velvet and gold, with round breeches, a short cloak, and a ruff. He was a cheerful man who taught Dickie fencing, dancing, running, jumping, and bowls. Later, he promised, there would be wrestling, catching, archery, pall-mall, rackets, riding, tennis, and every game fit for a gentleman's son.
        - id: ch01-b99
          speaker: narrator
          text: >-
            Weeks passed without his father or mother returning. Dickie learned some Greek and more Latin. He carved a box bearing his family's arms and made its lid fit. He learned to bow like a courtier, speak like a gentleman, and play a simple tune on the viol in the parlor.
        - id: ch01-b100
          speaker: narrator
          text: >-
            At last the nurse dressed him in his finest clothes: purple velvet cut over gold-colored cloth, a belt with a little sword, and a flat cap. His games-master took him by boat to a gilded galley crowded with beautifully dressed ladies and gentlemen. They kissed him, fussed over him, and exclaimed at how he had grown since the fever. One splendid gentleman seemed to be his uncle, a charming lady in blue and silver was his aunt, and the lively boy and girl beside him were his cousins.
        - id: ch01-b101
          speaker: narrator
          text: >-
            Servants passed wine, fruit, and cakes in silver dishes. Fresh flowers covered the galley, and music drifted from a nearby boat. Sunshine glittered on the river as more gilded, flower-wreathed boats gathered. Then shouting rose. Swords flashed all along the water, ladies waved scarves and handkerchiefs like bright butterflies, and a magnificent golden barge moved downstream with smaller vessels behind it. Everyone stood. The gentlemen saluted with drawn swords, and the ladies fluttered their scarves.
        - id: ch01-b102
          speakers: [girl_cousin, boy_cousin]
          ensemble: duo
          text: "The King and Queen!"
        - id: ch01-b103
          speaker: narrator
          text: >-
            The royal barge passed, and every galley joined the long procession. Dickie was perfectly happy among friendly cousins, kind grown-ups, and so much beauty and cleanliness. Willows and alders lined the riverbanks. Tall flowers crowded the water's edge, lilies floated in quiet backwaters, and lovely gardens sloped down toward the stream. At last the boats reached a little town among trees.
        - id: ch01-b104
          speaker: girl_cousin
          text: >-
            We leave the boats here. The King will stay tonight with Sir Thomas Bradbury, and we'll stay at our grandfather's house. Tomorrow we can watch the masque in Sir Thomas's park. I'm so glad you're better, Richard. It would not have been half as pleasant without you.
          emotion: happy
        - id: ch01-b105
          speaker: boy_cousin
          text: >-
            Then we'll all go home to Deptford with you for a whole month. We'll see your galleon, and old Sebastian can make one for me too.
        - id: ch01-b106
          speaker: dickie
          text: "What place is this?"
        - id: ch01-b107
          speakers: [girl_cousin, boy_cousin]
          ensemble: duo
          text: "Why, Gravesend. You knew that. Did the fever make you forget this too?"
        - id: ch01-b108
          speaker: dickie
          text: "Gravesend?"
          emotion: surprised
        - id: ch01-b109
          speaker: aunt
          text: >-
            Come, children. Boys, remember how I taught you to carry my train. And you, my girl, must scatter flowers from the golden basket when the King and Queen descend the steps.
        - id: ch01-b110
          speaker: narrator
          text: >-
            Everything afterward felt like a dream: his white-haired grandfather, whom everyone called My Lord, the great house and garden, the banquet and picture gallery, colored lamps hanging in chains between the trees, blazing torches, music, and the masque. It was a wordless play filled with marvelous costumes. The Queen herself appeared in gauze, jewels, and white swan feathers. Yet one thought kept whispering beneath everything Dickie saw and heard. Gravesend was where Beale waited in the lodging house. Beale was the man Dickie had called father. Dickie had promised to come as soon as he could. Why had he not gone?
        - id: ch01-b111
          speaker: narrator
          text: >-
            No pleasure could survive that thought. For the first time since discovering his strong legs, Dickie knew the New Cross life had not been a fever dream. Beale had been kind to him. They had walked the country roads and slept beneath green curtains, and Beale was truly waiting here in Gravesend.
        - id: ch01-b112
          speaker: dickie
          text: "This is the dream. I have to wake up."
        - id: ch01-b113
          speaker: narrator
          text: >-
            But he could not wake. The trees, lights, grass, beautiful clothes, royal couple, gentle relatives, and cheerful cousins would not blur or vanish like dream things. They stayed firm and real. Even so, Dickie knew Beale, New Cross, Gravesend, and his old lame body belonged to his true life. All brightness went out of the evening. When he finally returned to the Deptford house, exhausted, he burst into tears while the nurse undressed him.
        - id: ch01-b114
          speaker: nurse
          text: "What troubles my lamb?"
        - id: ch01-b115
          speaker: dickie
          text: "I can't explain. You wouldn't understand."
          emotion: sad
        - id: ch01-b116
          speaker: nurse
          text: "Try to tell me."
        - id: ch01-b117
          speaker: narrator
          text: "Dickie looked around at the tapestry and massive furniture."
        - id: ch01-b118
          speaker: dickie
          text: "I can't."
          emotion: sad
        - id: ch01-b119
          speaker: nurse
          text: "Please try."
        - id: ch01-b120
          speaker: dickie
          text: >-
            Don't laugh, Nurse. I have a dream that feels real. It is about a dreadful place, nothing like this. But a man is waiting there. He was good to me when I wasn't... when I was someone else. He's waiting in that dream, and I need to go back to him. But I can't.
          emotion: sad
        - id: ch01-b121
          speaker: nurse
          text: "You're better off here than in that dreadful place."
        - id: ch01-b122
          speaker: dickie
          text: "Yes, but Beale is waiting. I wish I could bring him here."
        - id: ch01-b123
          speaker: nurse
          text: >-
            Not yet. It is not easy to bring those we love from one dream into another.
        - id: ch01-b124
          speaker: dickie
          text: "From one dream into another?"
        - id: ch01-b125
          speaker: nurse
          text: >-
            Haven't you heard that all life is a dream? But you shall go. Heaven forbid anyone of your family should fail a friend. Your bed has fresh sheets. Lie still and think of the man who was kind to you.
          emotion: calm
        - id: ch01-b126
          speaker: narrator
          text: >-
            Dickie lay perfectly still. He had chosen to wake into hardness, poverty, dullness, and lameness because he must keep his promise. Giving up the lovely house and garden, the games, shipbuilding, soft clothes, kind people, and the feeling that he was somebody important was terribly hard. Still, if he could go, he would.
        - id: ch01-b127
          speaker: narrator
          text: >-
            The nurse placed burning wood on a silver plate and scattered something over the glowing embers.
        - id: ch01-b128
          speaker: nurse
          text: >-
            Lie straight and still. Wish yourself back where you were when you left that dream. Men die, but man does not. Times fly, but time does not.
        - id: ch01-b129
          speaker: narrator
          text: >-
            Sweet, heavy smoke rose as the nurse continued chanting too softly for him to understand. Dickie sank into a deep sea of sleep and rocked upon its tide. Then its waves suddenly threw him onto the hard shore of waking.
        - id: ch01-b130
          speaker: narrator
          text: >-
            He opened his eyes in the bare front room at New Cross. Tinkler and the white seal lay among scattered moonflower seeds. Streetlight shone through grimy glass onto old newspapers and sacking.
        - id: ch01-b131
          speaker: dickie
          text: "Oh, what a dream! What a dream!"
        - id: ch01-b132
          speaker: narrator
          text: >-
            Shivering with sleepiness, he put Tinkler and the seal in one pocket, gathered the seeds into the other, pulled newspapers over himself, and slept.
        - id: ch01-b133
          speaker: narrator
          text: "Morning sunlight woke him."
        - id: ch01-b134
          speaker: dickie
          text: >-
            How strange to dream weeks and weeks in one little part of a night. If only it had been true!
        - id: ch01-b135
          speaker: narrator
          text: >-
            He jumped up, eager to begin the journey to Gravesend. He had left that wonderful dream for Beale, so he meant to start at once. But the jump ended in a sickening sideways fall, and his head struck the wooden wall.
        - id: ch01-b136
          speaker: dickie
          text: >-
            I forgot. I never thought a dream could make me forget my bad foot.
        - id: ch01-b137
          speaker: narrator
          text: >-
            He had leaped with the confidence of a sound child, and his lame foot had betrayed him. Dickie crawled to the old cut-down broom that served as his crutch, now covered in black velvet by Lady Talbot.
        - id: ch01-b138
          speaker: dickie
          text: >-
            Now I must get to Gravesend. I wonder if Deptford was ever truly like my dream, with gardens, fields, and a clean river.
        - id: ch01-b139
          speaker: narrator
          text: >-
            He slipped from the house unseen and set off. Clickety-clack went the crutch along the dusty pavement. His back ached, his lame foot hurt, his good leg grew stiff and tired, and his heart was tired too. In the life he had abandoned, hot porridge would now be waiting at a long oak table, beside a carved chair set for a boy who was not there. Dickie struggled bravely onward until the pain made him feel ill.
        - id: ch01-b140
          speaker: dickie
          text: "I don't know if I can manage it."
        - id: ch01-b141
          speaker: narrator
          text: >-
            Then he noticed three golden balls over the friendly pawnbroker's door. He paused, shrugged, and went inside.
        - id: ch01-b142
          speaker: pawnbroker
          text: "Here you are again. Have you come to pawn the rattle?"
        - id: ch01-b143
          speaker: dickie
          text: "No. What would you lend me on the seal you gave me?"
        - id: ch01-b144
          speaker: narrator
          text: "The pawnbroker stared, frowned, and then roared with laughter."
        - id: ch01-b145
          speaker: pawnbroker
          text: >-
            You are a wonder! I give you a present, and you bring it back to pledge with me. You should have been one of our people. So you really want to pawn the seal?
        - id: ch01-b146
          speaker: dickie
          text: >-
            I'd much rather keep it because I love it. But I need the fare to Gravesend. My father is waiting there, and I won't leave Tinkler behind.
        - id: ch01-b147
          speaker: narrator
          text: "Dickie showed him the old rattle."
        - id: ch01-b148
          speaker: dickie
          text: >-
            How much is the fare? I thought you would know. Will you lend me enough for the seal?
        - id: ch01-b149
          speaker: narrator
          text: "The pawnbroker studied him for a moment."
        - id: ch01-b150
          speaker: pawnbroker
          text: >-
            No. The seal isn't worth the fare. Mind you, it is an excellent seal. A very good one indeed.
        - id: ch01-b151
          speaker: dickie
          text: >-
            Then listen. I know what honor means now, and what a gentleman's word means. If you won't take the seal, let me pledge my word of honor. Lend me the fare to Gravesend, and I promise as a gentleman to repay you within a month.
        - id: ch01-b152
          speaker: narrator
          text: >-
            Dickie's voice was firm. He no longer sounded like a Deptford street boy. He sounded like the child who had studied with tutors, walked in a royal water procession, and learned the duties of a noble family. The pawnbroker understood that this was not playacting. Something true stood behind those words. His people's ancient sense of romance had survived centuries of cruelty and oppression, and now it rose to meet Dickie's appeal. He could see the great and beautiful things beyond ordinary life.
        - id: ch01-b153
          speaker: pawnbroker
          text: >-
            You're an odd little fellow, but I admire your courage. Every man has to make a fool of himself once, I suppose.
        - id: ch01-b154
          speaker: dickie
          text: "You mean you'll lend it?"
          emotion: happy
        - id: ch01-b155
          speaker: pawnbroker
          text: "More fool me."
        - id: ch01-b156
          speaker: narrator
          text: "He reached into his pocket and placed coins on the polished mahogany counter."
        - id: ch01-b157
          speaker: dickie
          text: >-
            You won't regret it in the end. You'll really trust me with this money?
        - id: ch01-b158
          speaker: pawnbroker
          text: "It certainly looks that way."
        - id: ch01-b159
          speaker: dickie
          text: >-
            Then one day I'll do something for you. I don't know what yet, but we never forget, we—
        - id: ch01-b160
          speaker: narrator
          text: >-
            He stopped. That noble family name belonged only to the dream. Here he was poor, lame Dickie Harding. He gathered the coins, put them in his pocket, and felt the moonflower seeds there.
        - id: ch01-b161
          speaker: dickie
          text: >-
            I can't repay your kindness now, though someday I will repay the money. But you liked the moonflowers, didn't you? Please take some of the seeds.
        - id: ch01-b162
          speaker: narrator
          text: "He spread a generous handful across the reddish-brown counter."
        - id: ch01-b163
          speaker: pawnbroker
          text: "Thank you, my boy. I'll start them somewhere warm."
        - id: ch01-b164
          speaker: dickie
          text: "I think they grow best by moonlight."
        - id: ch01-b165
          speaker: narrator
          text: >-
            And so Dickie reached Gravesend and the common lodging house. Beside the fire sat a weary, sad, anxious man. At the clickety-clack of Dickie's crutch, the man sprang up.
        - id: ch01-b166
          speaker: mr_beale
          text: >-
            It's the nipper! It really is! I thought they'd caught you. No, I didn't. I knew you were clever. I knew you'd turn up.
          emotion: happy
        - id: ch01-b167
          speaker: narrator
          text: >-
            Beale hurried to the door and wrapped an arm around Dickie's shoulders.
        - id: ch01-b168
          speaker: dickie
          text: >-
            Yes, I had to come. You did want me to, didn't you?
        - id: ch01-b169
          speaker: narrator
          text: >-
            He looked around the tramps' kitchen and remembered the long, spotless dining hall hung with tapestries.
        - id: ch01-b170
          speaker: mr_beale
          text: >-
            Want you? I should say I did!
          emotion: happy
        - id: ch01-b171
          speaker: narrator
          text: >-
            Beale held him close and looked at him like a rare treasure won after a long and costly search. Then he drew Dickie inside and shut the door.
        - id: ch01-b172
          speaker: dickie
          text: "Then I'm glad I came."
        - id: ch01-b173
          speaker: narrator
          text: >-
            In his heart, Dickie was not glad. He longed for the gracious house where he had been the young master and could run on two strong legs. But deeper than his heart, he was glad, because he had given up the dream for Beale. That sacrifice made him love Beale more than ever. He had lost something beautiful, but he had gained love, and loving someone is better even than being loved.
        - id: ch01-b174
          speaker: narrator
          text: >-
            They ate herrings for tea. That night Dickie slept soundly in a hard bed, with his clothes and boots beneath his pillow. He did not dream.
        - id: ch01-b175
          speaker: narrator
          text: "In the morning, many memories returned, and Dickie wondered aloud."
        - id: ch01-b176
          speaker: dickie
          text: "Is this the dream, or was the other one the dream?"
        - id: ch01-b177
          speaker: narrator
          text: >-
            It seemed a foolish question with the coarse sheets beneath him, the close smell of the room around him, and Mr. Beale calling from nearby.
        - id: ch01-b178
          speaker: mr_beale
          text: "Wake up, nipper. There's sausages for breakfast."
