  chapters:
    - id: ch01
      title: Tinkler and the Moonflower
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Dickie lived at New Cross. That was the address, anyway. His home was one of a row of horrid little houses on a slope that had once been green fields running down toward the river. Long ago, the grand houses of Deptford merchants had stood there, stately and quiet among pleasant gardens and orchards full of fruit. Now every field and garden had been built over. It looked as if a wicked giant had taken one great brush loaded with yellow ochre and another loaded with mud-colored paint, then brushed out all the green. The yellow was houses, and the brown was roads, mile after mile after mile. From the street, there was not a living green thing to see except cabbages in shop windows and an occasional poor trail of creeping-jenny drooping from a dirty sill.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Each house did have a little yard at the back, and people called it a garden. Some of those yards were green, though only the back windows could see them. Green rests and delights people's eyes. You may shut people between rows of yellow and brown, work them hard, and pay them very little, but someone among them will still work longer for no pay at all, simply to have living green things nearby.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Nothing green grew in the yard behind the house where Dickie lived with his aunt. It held stones, bones, broken bricks, greasy dishcloths matted with mud, worn broom heads, broken shovels, and a pail without a bottom. There was also the mouldering wreck of a rabbit hutch. Rabbits had lived there once, long before Dickie's time, and he had never seen them. He knew what rabbits felt like only because a boy had once smuggled a brown one into school, buttoned inside his jacket. The boy let Dickie cradle it in his own hands for several precious minutes. Then the teacher discovered it and shut it in a locker until lessons ended. That was why Dickie loved the ruined hutch. It mattered to him because of the soft, living creatures that had once called it home.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Then his aunt sold the poor remains of the hutch to a man who pushed a barrow and would buy almost anything anyone offered him. The man took the old pails and broken shovels as well, paying only threepence for the whole miserable lot. Dickie felt almost as miserable as if a furry friend had truly lived inside the hutch until that very day. He hated the buyer even more when the barrow rolled away, because empty rabbit skins hung sadly over its back.
        - id: ch01-b05
          speaker: narrator
          text: >-
            And that is where this story really begins. Dickie called his aunt a beast and struck at her with one small, dirty fist. She slapped him soundly and sent him into the yard to come to himself. He flung himself onto the ground, crying and twisting with pain and misery, and wished for ever so many things.
        - id: ch01-b06
          speaker: man_next_door
          text: "What's all this noise about? Has somebody been hitting you?"
        - id: ch01-b07
          speaker: dickie
          text: "They took away the hutch."
        - id: ch01-b08
          speaker: man_next_door
          text: "There wasn't anything living in it."
        - id: ch01-b09
          speaker: dickie
          text: "But I didn't want them to take it!"
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: >-
            The Man Next Door leaned on his spade and said it left more room. It was Saturday afternoon, and his garden was one of the green ones. Small grubby daffodils and dirty-faced primroses grew there. Beside the water butt stood a real arbor, bare just then. There was an elder tree whose summer flowers spread as wide and flat as tea plates, and a lilac tree covered in brown buds. To Dickie, it was beautiful.
        - id: ch01-b11
          speaker: man_next_door
          text: >-
            Come on, mate, stop that crying. How am I meant to dig with you howling your head off? Get up and ask your aunt if she'll let me tidy her garden. I can do a bit when I have time. You'd like that, wouldn't you?
        - id: ch01-b12
          speaker: dickie
          text: "Wouldn't I just!"
          emotion: happy
        - id: ch01-b13
          speaker: aunt_maud
          text: "So you've come to yourself, have you? Mind this is the last time you try one of your tantrums with me, my beauty."
        - id: ch01-b14
          speaker: narrator
          text: "Dickie said what he had to say, then hurried back to the yard."
        - id: ch01-b15
          speaker: dickie
          text: "She says she hasn't any time to waste, but if you have, she doesn't care what you do with it."
        - id: ch01-b16
          speaker: man_next_door
          text: >-
            Your face is a proper dirty sight. Here, let me rub it. Now I'll climb over and make a start. You keep busy picking up all these fine treasures. Next time your aunt spends the day at Buckingham Palace, we'll burn the lot.
        - id: ch01-b17
          speaker: narrator
          text: >-
            His handkerchief was scarcely cleaner than Dickie's face. After wiping the boy, he swung one leg across the fence.
        - id: ch01-b18
          speaker: dickie
          text: "Will we wait till the fifth of November?"
        - id: ch01-b19
          speaker: man_next_door
          text: >-
            The fifth of any month you please, as long as she isn't here. This ground's hard as an old doorstep. Never mind. We'll turn it, plant a few seeds and little plants, and soon we won't know the place.
        - id: ch01-b20
          speaker: dickie
          text: "I've got a halfpenny."
        - id: ch01-b21
          speaker: man_next_door
          text: "Then I'll add another. Off you go and buy us some seeds."
        - id: ch01-b22
          speaker: narrator
          text: >-
            Dickie went slowly because he was lame. The woman he called Aunt Maud had dropped him when he was a baby. She was not a nice woman, and happily she soon leaves this story. Still, she had kept Dickie after his father died, though she was not really his aunt at all. She was only the woman who owned the house where his father had lodged. She might have sent him to the workhouse instead of taking care of him. It was good of her not to do that, even though she seldom treated him kindly. That is the one good thing there is to say for her, so we shall say no more. Dickie managed well enough in spite of his lame foot. His little crutch was nothing more than a worn broom handle cut down to fit his height.
        - id: ch01-b23
          speaker: narrator
          text: >-
            He found the corn-chandler's, a wonderful shop smelling of stables. Deep dusty bins stood ready to be played in, or so Dickie thought. Above them were delightful little square-fronted drawers labelled Rape, Hemp, Canary, Millet, Mustard, and many more. Higher still hung pictures showing the animals that ate the things the shop sold. There were fat oblong cattle raised on Burley's Cattle Food and great woolly sheep like stuffed pillows, fed on Ovis's Sheep Spice. Brightest and best of all was a rainbow-colored parrot. Its feathers were impossibly smooth, and it cocked one black eye that seemed to shine with all the splendid promise of Perrokett's Artistic Bird Seed.
        - id: ch01-b24
          speaker: dickie
          text: "Give me a pennyworth of that one there!"
        - id: ch01-b25
          speaker: shopman
          text: "Have you got the penny?"
        - id: ch01-b26
          speaker: narrator
          text: >-
            Dickie showed it, handed it over, and carried home a paper bag full of soft, rustling promises.
        - id: ch01-b27
          speaker: man_next_door
          text: "Why, these aren't garden seeds. This is parrot food."
        - id: ch01-b28
          speaker: dickie
          text: >-
            It said it was Artistic Bird Seed. I thought the seeds would grow into flowers like birds, all the same colors as that parrot.
          emotion: sad
        - id: ch01-b29
          speaker: man_next_door
          text: >-
            Maybe they will, for all we know. Once I've turned the soil, I'll sow them along this end. I bet something pretty comes up.
          emotion: calm
        - id: ch01-b30
          speaker: narrator
          text: >-
            So they sowed the seed. The Man Next Door promised another twopence later for real seeds, and moved two primroses whose grubby faces looked as if they needed washing.
        - id: ch01-b31
          speaker: narrator
          text: >-
            It was a magnificent day for Dickie. That night in bed he told the whole tale to the only friend from whom he hid nothing. His friend did not answer, but Dickie felt certain that silence did not mean a lack of interest. The friend was a blackened stick about five inches long. Little dark bells hung from it, rather like the bells on a dog's collar, and they made a pretty jangle. Attached to the stick was a crooked piece of something whitish, smooth, and very hard. It was good for sucking, stroking with his fingers, or digging holes in soap. Dickie had no idea what either part truly was.
        - id: ch01-b32
          speaker: narrator
          text: >-
            His father had given it to him in the hospital when Dickie went to say goodbye. His father had fallen from the scaffolding where he worked, and he was not going to recover. In the strange bed among rows of other clean beds, he had looked terribly clean himself.
        - id: ch01-b33
          speaker: dickies_father
          text: >-
            Hold on to this. It's yours, your very own. My father gave it to me, and it belonged to his father before him. Don't let anybody take it. An old lady once told your grandfather it would bring our family luck. Goodbye, old chap.
          emotion: sad
        - id: ch01-b34
          speaker: narrator
          text: >-
            Dickie remembered every word and guarded the treasure. Another object had once been tied to it with string, something brassy with a white stone and a pattern. Aunt Maud had taken that away to keep it safe, and Dickie never saw it again. He still had the blackened stick, the tinkling bells, and the hard white spike, though he did not know what they were. But I do. It was an old-fashioned baby's rattle, sometimes called a coral and bells.
        - id: ch01-b35
          speaker: dickie
          text: >-
            We shall have the fairest flowers of hill and dale, Tinkler dear, and a green lawn too. What a lovely sight it will be! All the brightest colors of the rainbow among the agreeable green of fresh leaves. I do love the Man Next Door. He truly has a heart of gold.
          emotion: happy
        - id: ch01-b36
          speaker: narrator
          text: >-
            That was how Dickie spoke to Tinkler. You have heard how he spoke to his aunt and the Man Next Door. Perhaps you think you are the only child who can speak two languages without ever having a foreign nurse or travelling abroad. You are not. Parents and guardians might be startled to hear dear little Charlie use one language with them, another with the cook and housemaid, and yet another, with the proper accent, among the boot-boy and grooms.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Dickie had learned his second language from books. His teacher had given him six paper-covered stories, including Children of the New Forest, Quentin Durward, and Hereward the Wake. They opened a new world to him. People in books spoke in that fine, strange fashion, so he saw no reason not to do the same with a friend he trusted.
        - id: ch01-b38
          speaker: narrator
          text: >-
            I hope all this has not bored you. I must tell you what kind of boy Dickie was and how he lived, or you will not understand what happens to him. And adventures were coming. There would be no end of them.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Dickie woke as cheerful as the spring sunshine trying to peer through his grimy window.
        - id: ch01-b40
          speaker: dickie
          text: "Maybe he'll do some more work in the garden today!"
          emotion: happy
        - id: ch01-b41
          speaker: narrator
          text: >-
            He sprang up, dressed himself in the dirty, comfortless room, and set off for school. By evening, kind clean hands were undressing him and washing him in a large bath half full of hot, silvery water. The soap had a clean woody smell, just like the timber yard at the end of his street. This sudden change had come about on the road to school. Dickie's foolish little head had been so full of Artistic Bird Seed and flowers bright as rainbows that he failed to watch the pavement. His crutch slid away on a banana skin. Dickie tumbled down, and a butcher's cart passed over his poor lame foot.
        - id: ch01-b42
          speaker: narrator
          text: >-
            The injured foot had to go to the hospital, and naturally Dickie went with it. The hospital was closer to the heaven in his books than anywhere he had ever known. Doctors and nurses used the words he met in stories, speaking in a voice unlike any he heard at home. On his second day, a round-faced lady in a white cap smiled down at him.
        - id: ch01-b43
          speaker: nurse
          text: "Well, Tommy, how are we feeling today?"
        - id: ch01-b44
          speaker: dickie
          text: "My name is very far from Tommy, and I am living in luxury and affluence, thank you, gracious lady."
        - id: ch01-b45
          speaker: narrator
          text: >-
            The nurse laughed and pinched his cheek. Once she knew him better and discovered where his grand way of speaking came from, she brought him more books. From those, Dickie gathered still more wonderful words. Everyone at the hospital treated him kindly. When the time came to send him home, though, they fitted his lame foot with a thick boot. It had a horrible heavy sole and iron supports running up his leg.
        - id: ch01-b46
          speaker: narrator
          text: >-
            His aunt and her friends called the boot kind. Dickie hated it. The boys at school had grown used to his crutch, but now they mocked the boot. That felt worse than being called Old Dot-and-go-one, a name he had heard so often that it almost sounded affectionate.
        - id: ch01-b47
          speaker: narrator
          text: >-
            On the very first night after he came home, Dickie found that someone had robbed him. Tinkler was gone from the safe hollow in his mattress, where a torn patch of ticking made a soft nest of flock for a boy's dearest friend.
        - id: ch01-b48
          speaker: narrator
          text: >-
            He knew better than to ask where it was. He searched all five rooms instead, looking and looking, but he could not find Tinkler. The next day, while Aunt Maud was out shopping, he found a small square of cardboard behind a dresser drawer. It lay among dirty dusters, clothes pegs, string, corks, and cheap novels. It was a pawn ticket. On it were the words, “Rattle. One shilling.”
        - id: ch01-b49
          speaker: narrator
          text: >-
            Dickie understood pawn tickets very well. You probably do not, so ask a grown-up to explain. We have a story to get on with.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Until he found the ticket, he could think of nothing but his missing friend. The garden had slipped from his mind completely. He had not even wondered whether the Artistic Bird Seed had grown into parrot-colored flowers. He had spent a very long time in hospital, and by now spring had turned into August. The nurses had assured him that the seeds must have sprouted ages ago. They told him he would find the whole patch in flower, and he could wait and see if they were not right.
        - id: ch01-b51
          speaker: narrator
          text: >-
            So Dickie went outside to look. A green tangle filled the far end of his yard, while the next garden had run wild with weeds. The Man Next Door had gone to seek work near Ashford in the hop fields, and his house stood empty, waiting to be let.
        - id: ch01-b52
          speaker: narrator
          text: >-
            A few stunted pink and yellow blossoms struggled through the patch where the bird seed had been scattered. Above them all towered one enormous flower, three times as tall as Dickie. It had the shape of a sunflower, but it was white.
        - id: ch01-b53
          speaker: dickie
          text: "Why, it's as large as a dinner plate!"
          emotion: surprised
        - id: ch01-b54
          speaker: narrator
          text: >-
            And it was. The flower stood stately and beautiful, turning its creamy white face toward the sun.
        - id: ch01-b55
          speaker: dickie
          text: "Its stalk is just like a little tree."
        - id: ch01-b56
          speaker: narrator
          text: >-
            That was true as well. Huge leaves drooped from it, and below the great bloom, twelve smaller white flowers reached out on slender stems.
        - id: ch01-b57
          speaker: dickie
          text: "It must be a moonflower, if the other kind are sunflowers. Oh, I love it! I love it! I love it!"
          emotion: happy
        - id: ch01-b58
          speaker: narrator
          text: >-
            But Dickie had no time to stand admiring it. He needed to find a shilling somehow. A shilling would let him trade that square ticket marked “Rattle” for his one friend, Tinkler. Without the money, he could not. That is part of the dreary magic of pawn tickets, which a grown-up may explain to you.
        - id: ch01-b59
          speaker: dickie
          text: >-
            I can't earn it by working. Nobody would send me on errands when they could choose a boy with two sound legs. I wish I owned something I could sell.
          emotion: sad
        - id: ch01-b60
          speaker: narrator
          text: >-
            He studied the yard. Everywhere the Man Next Door had not dug, it looked filthier than before. Nothing there was worth buying, especially with the rabbit hutch gone. Nothing except, of course, the moonflowers.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Dickie fetched an old, worn-down knife from the bowl by the kitchen sink. It lay among potato peelings like a flower among leaves. Very carefully, he cut six of the smaller blooms. Then he limped all the way to New Cross Station and waited outside. He leaned on his crutch and held the flowers toward every crowd that poured from an arriving train. The people came in thick, dark streams, tired after their work and in too much of a hurry to get home for tea. Everyone glanced at the flowers, because the blooms were extraordinary. They were white as water lilies but flat in the true sunflower shape, with centers of the purest golden yellow. People spoke about them as they hurried past, yet nobody cared enough to stop and buy.
        - id: ch01-b62
          speaker: commuter_1
          text: "They're pretty, aren't they?"
        - id: ch01-b63
          speaker: commuter_2
          text: "No. Yes. I don't know. Will you hurry up?"
        - id: ch01-b64
          speaker: narrator
          text: >-
            It was hopeless. Dickie was tired, and the flowers had begun to droop. He turned toward home. Then a thought rushed into his mind and brought the blood to his face. He swung around and went straight to the pawnbroker's. You may be sure he had memorized the address on the ticket.
        - id: ch01-b65
          speaker: narrator
          text: >-
            He marched boldly into the shop. Three fine gold balls hung above the door, and the window glittered with rings, chains, brooches, watches, china, silk handkerchiefs, and concertinas. A stout gentleman stood behind the counter.
        - id: ch01-b66
          speaker: pawnbroker
          text: "Well, young man, what may we do for you?"
        - id: ch01-b67
          speaker: dickie
          text: "I'd like to pawn my moonflowers."
        - id: ch01-b68
          speaker: narrator
          text: >-
            The stout gentleman burst into a roar of laughter and slapped his broad leg with one broad hand.
        - id: ch01-b69
          speaker: pawnbroker
          text: >-
            That's the best one I've heard in ages! You little noodle, those flowers would be dead long before you came back to redeem them.
        - id: ch01-b70
          speaker: dickie
          text: "You would have them while they were alive."
        - id: ch01-b71
          speaker: pawnbroker
          text: >-
            What are they, anyway? They don't look like much. Though now I study them, I can't say I've ever seen a flower quite like these.
        - id: ch01-b72
          speaker: narrator
          text: >-
            The pawnbroker lived in a neat villa at Brockley and gardened in the manner of a gentleman who could, if he chose, afford a real gardener.
        - id: ch01-b73
          speaker: dickie
          text: >-
            They're moonflowers. I want to pawn them, then use the money to get something else back.
        - id: ch01-b74
          speaker: pawnbroker
          text: "Have you brought the ticket?"
        - id: ch01-b75
          speaker: dickie
          text: >-
            Yes. It's for my own Tinkler. My daddy gave him to me before he died, and my aunt misappropriated him while I was in hospital.
        - id: ch01-b76
          speaker: narrator
          text: "The man examined the ticket with care."
        - id: ch01-b77
          speaker: pawnbroker
          text: >-
            Very well. Give me the flowers. They're not so bad, after all. Humphreys, keep these in a jug of water until I go home, and fetch the item on this ticket.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Now that the flowers belonged to him, he valued them more. Things often look different once they are yours. A pale young man in spectacles appeared from a dark cave at the rear of the shop. He took the flowers and the ticket, then vanished into the darkness again.
        - id: ch01-b79
          speaker: dickie
          text: "Oh, thank you! I shall live only to repay your abundant generosity."
          emotion: happy
        - id: ch01-b80
          speaker: pawnbroker
          text: "That will do. No impudence from you."
          emotion: angry
        - id: ch01-b81
          speaker: narrator
          text: "The pawnbroker reddened, and an uncomfortable silence followed."
        - id: ch01-b82
          speaker: dickie
          text: >-
            I wasn't being impudent. I meant every word. You'll see one day. I read an instructive narrative about a lion, the king of beasts, and a mouse, that small and timorous animal. If you don't know it, I can proceed to relate it now.
        - id: ch01-b83
          speaker: pawnbroker
          text: "You're a very odd little fellow. Where did you learn to speak like that?"
        - id: ch01-b84
          speaker: dickie
          text: "That's how people talk in books. You're a toff, so I thought you'd understand. My mistake. No offense."
        - id: ch01-b85
          speaker: pawnbroker
          text: "You mean you can talk like a book whenever you choose, then stop it just as quickly?"
        - id: ch01-b86
          speaker: dickie
          text: >-
            I can converse like lords and ladies. Your noble beneficence made me wish to express my feelings with the finest words at my command.
        - id: ch01-b87
          speaker: pawnbroker
          text: "Do you like books?"
        - id: ch01-b88
          speaker: dickie
          text: "Don't I just!"
          emotion: happy
        - id: ch01-b89
          speaker: narrator
          text: >-
            After that, there were no more awkward silences. The pale young man returned carrying something wrapped in clean cloth. He whispered a few words to his employer. The pawnbroker opened the cloth and inspected the rattle.
        - id: ch01-b90
          speaker: pawnbroker
          text: "So it is. And it's a beauty, quite apart from anything else."
        - id: ch01-b91
          speaker: dickie
          text: "Isn't he?"
        - id: ch01-b92
          speaker: narrator
          text: "Praise for his precious Tinkler touched Dickie's heart."
        - id: ch01-b93
          speaker: pawnbroker
          text: "I have another object here bearing the same crest as your rattle."
        - id: ch01-b94
          speaker: dickie
          text: "A crest? Isn't that the thing you wear on your helmet in the heat and press of a tournament?"
        - id: ch01-b95
          speaker: narrator
          text: >-
            The pawnbroker explained that crests no longer belonged only on helmets. They appeared on all sorts of objects. The strange little animal scratched finely into the rattle's side was a crest too.
        - id: ch01-b96
          speaker: pawnbroker
          text: "Humphreys, polish this and bring me that seal."
        - id: ch01-b97
          speaker: narrator
          text: >-
            The young man cleaned Tinkler with pink powder, a brush, and soft leather. Meanwhile, the pawnbroker fitted together two broken halves of white cornelian.
        - id: ch01-b98
          speaker: pawnbroker
          text: "This came from a seal, and I'd be happy to give it to you."
        - id: ch01-b99
          speaker: dickie
          text: "Oh! You are a true and noble knight!"
          emotion: happy
        - id: ch01-b100
          speaker: narrator
          text: >-
            Dickie propped his crutch against the counter so that he could clasp both hands in delight, exactly as boys did in books.
        - id: ch01-b101
          speaker: pawnbroker
          text: >-
            My assistant will join it with cement and put it in a small box. Leave it there until tomorrow, so it can set. And don't try stamping sealing wax with it, because the heat will melt the cement. It may bring you luck.
        - id: ch01-b102
          speaker: narrator
          text: >-
            It did bring luck, and of a kind the generous pawnbroker could never have imagined. But that belongs later in the story.
        - id: ch01-b103
          speaker: narrator
          text: >-
            Dickie left the shop without his moonflowers, it was true, but he had Tinkler again. His old friend now shone white and clean. The pawnbroker declared the rattle to be genuine silver and warned Dickie to take proper care of it. The repaired white cornelian seal rested safely in a sturdy little cardboard box with metal corners. And that was not all. Tucked under Dickie's arm were a broken-backed copy of Ingoldsby Legends and a copy of Mrs. Markham's English History that had no back at all.
        - id: ch01-b104
          speaker: pawnbroker
          text: >-
            You must keep trying to improve your mind. Come and visit me again, say, next month.
        - id: ch01-b105
          speaker: narrator
          text: "The pawnbroker fussed over him, quite pleased with his own kindness."
        - id: ch01-b106
          speaker: dickie
          text: >-
            I will. A thousand blessings from a grateful heart! You truly are good. Thank you, thank you. Next month I'll return and tell you everything I've learned from the perusal of your books.
          emotion: happy
        - id: ch01-b107
          speaker: pawnbroker
          text: "Perusal. That's how you pronounce it. Goodbye, my man. Until next month."
        - id: ch01-b108
          speaker: narrator
          text: >-
            By the next month, however, Dickie would be in a place very different from that shop, with someone very different from the pawnbroker who gardened so grandly at his Brockley villa.
        - id: ch01-b109
          speaker: narrator
          text: >-
            Dickie went home while his aunt was still away. His books said treasure should be hidden beneath loose floorboards, unless the house had a secret panel. His house had no panel, secret or otherwise. But one floorboard in his room had been left loose so that a workman could get at the gas pipe. Dickie pried it up. Then he pushed Tinkler, the boxed seal, and both battered books as far as his arm could reach across the rough, crumbling surface of the lath and plaster beneath the floor.
        - id: ch01-b110
          speaker: narrator
          text: "He had barely worked the board back into place when Aunt Maud shrieked from below."
        - id: ch01-b111
          speaker: aunt_maud
          text: >-
            Come down here! I can hear you thumping around. Get down and fetch me a halfpenny's worth of wood. How can I boil the kettle if there's no fire?
          emotion: angry
        - id: ch01-b112
          speaker: narrator
          text: >-
            When Dickie came downstairs, she gave him a light slap. He took the halfpenny and limped away obediently.
        - id: ch01-b113
          speaker: narrator
          text: >-
            A very long time passed before he returned. Before he reached the open-fronted shop where coal and firewood were sold, he saw a Punch and Judy show being carried along. Dickie had never seen one. He badly wanted to watch it unpack and reveal its wonders, so he followed it through street after unfamiliar street. At last he discovered it would not perform at all. It was only going home to sleep in an old coach house. Then he remembered the firewood. The halfpenny squeezed tight in his fist seemed to burn him with reproach.
        - id: ch01-b114
          speaker: narrator
          text: >-
            Dickie looked around and realized he had no idea where he was. In the yard where Punch and Judy lived, a tall, thin, ragged man lounged beside a stable door. He removed a clay pipe from his mouth.
        - id: ch01-b115
          speaker: mr_beale
          text: "What's the trouble, mate? Have you lost your way?"
        - id: ch01-b116
          speaker: narrator
          text: "Dickie explained what had happened and finished by giving his address."
        - id: ch01-b117
          speaker: dickie
          text: "I live at Lavender Terrace, Rosemary Street, Deptford."
        - id: ch01-b118
          speaker: mr_beale
          text: "I'm heading that way myself. We can take the boat back, if you like. Have you ever ridden on the boat?"
        - id: ch01-b119
          speaker: dickie
          text: "No."
        - id: ch01-b120
          speaker: mr_beale
          text: "Would you like to?"
        - id: ch01-b121
          speaker: dickie
          text: "I don't mind if I do."
        - id: ch01-b122
          speaker: narrator
          text: >-
            The steamboat was delightful. It hurried along as if it had somewhere important to be, pushing the water out of its path. It puffed and blew, while something deep inside beat steadily like the heart of a giant. A fresh, strong wind swept the deck. The ragged man found them a sheltered corner behind the funnel, out of the worst of it. The stillness there, after all that wind, made Dickie sleepy. He closed his eyes without meaning to. By the time he woke and asked whether he had slept, the steamer was slowing beside a pier in a strange place full of trees.
        - id: ch01-b123
          speaker: dickie
          text: "Have I been asleep?"
        - id: ch01-b124
          speaker: mr_beale
          text: "Here we are! Have you been asleep? You certainly have. Up you get, my lad. This is our stop."
        - id: ch01-b125
          speaker: dickie
          text: "Is this Deptford?"
        - id: ch01-b126
          speaker: narrator
          text: "The people pushing toward the gangway laughed when they heard him."
        - id: ch01-b127
          speaker: mr_beale
          text: "Not exactly, but it's all right. This is where we leave the boat. You haven't had your tea yet, my boy."
        - id: ch01-b128
          speaker: narrator
          text: >-
            Dickie could never have imagined a finer tea. There were fried eggs and bacon. He had one egg, while the man ate three. There was bread and butter, and though the bread was cut thick, the butter was every bit as thick. Best of all, he could drink as many cups of tea as he cared to say thank you for. When at last the meal ended, the man asked whether Dickie could manage a little walking. Dickie said he could, and the two set out side by side in the friendliest fashion.
        - id: ch01-b129
          speaker: dickie
          text: >-
            I have enjoyed it ever so much, and thank you kindly. Thank you for the tea and the egg too. This is the prettiest place I've ever seen. But I ought to go home. I'm in for a terrible hiding already. She was waiting for the wood so she could boil the kettle when I left.
        - id: ch01-b130
          speaker: mr_beale
          text: "Your mother?"
        - id: ch01-b131
          speaker: dickie
          text: "My aunt. She isn't really my aunt. I only call her that."
        - id: ch01-b132
          speaker: mr_beale
          text: "Is she good to you?"
        - id: ch01-b133
          speaker: dickie
          text: "She isn't too bad when she's in a good temper."
        - id: ch01-b134
          speaker: mr_beale
          text: >-
            She won't be in one when you get back. You've landed yourself in it, mate. You and I met hours ago. Look there. The sun's going down.
        - id: ch01-b135
          speaker: narrator
          text: >-
            The sun was sinking beyond trees more beautiful than any Dickie had known. They had reached a country road edged by green hedges and grass. Small round-faced flowers dotted the verge. Even Dickie knew they were daisies.
        - id: ch01-b136
          speaker: dickie
          text: "I'll have to bear it. I'd better start for home."
          emotion: sad
        - id: ch01-b137
          speaker: mr_beale
          text: "I wouldn't go home if I were you. I'd set out and see something of the world."
        - id: ch01-b138
          speaker: dickie
          text: "You mean me?"
          emotion: surprised
        - id: ch01-b139
          speaker: mr_beale
          text: >-
            Why not? I'll make you a fair offer. Come with me and see life. I'm walking to Brighton and back, right along by the sea. Have you ever seen the sea?
        - id: ch01-b140
          speaker: dickie
          text: "No. Oh, no, never."
        - id: ch01-b141
          speaker: mr_beale
          text: >-
            Then come with me. We'll take it easily all around the coast, where gentlemen go for their holidays.
        - id: ch01-b142
          speaker: dickie
          text: "Will we be in the country where you're going?"
        - id: ch01-b143
          speaker: mr_beale
          text: >-
            Nearly all the way. We'll walk beside the sea, where people always have a little money to spare. I reckon we'll put some color into those cheeks. They're pale as putty. Come with me and be my little lad. I'll be your daddy, and a better one than many a man who was born to the job. I haven't hit you the way your aunt does. I took you on a pleasure boat, though you slept through it, and bought you a tea fit for an emperor. That shows what sort of man I am. Well, what do you say? Have we got a bargain?
        - id: ch01-b144
          speaker: dickie
          text: >-
            It is very kind of you, but why would you do all that? Feeding me will cost money. What reason have you got?
        - id: ch01-b145
          speaker: narrator
          text: >-
            The man scratched his head. He hesitated, looked up at the sky, and then down at the road. They had stopped to rest on a heap of stones.
        - id: ch01-b146
          speaker: mr_beale
          text: >-
            You're a sharp little fellow. Very sharp. Well, I won't trick you. I want company. Walking the roads alone is no pleasure to me. And since I live on what charitable ladies and gentlemen give, having a small boy beside me does no harm. People give more when there's a child. Besides, I like children. Some men don't. I do.
        - id: ch01-b147
          speaker: narrator
          text: "Dickie believed that last part. Still, he had to ask."
        - id: ch01-b148
          speaker: dickie
          text: "You mean we'd be beggars?"
        - id: ch01-b149
          speaker: mr_beale
          text: >-
            No need for ugly names. We'll take to the road. If kind people choose to lend us a hand, so much the better for everybody, if my Sunday-school lessons meant anything. That's my offer. Take it or leave it.
        - id: ch01-b150
          speaker: narrator
          text: >-
            Long gold rays from the sinking sun streamed through gaps in the hedge. A bird paused in its flight and settled on a nearby branch, clinging there as the twig rocked beneath it. A real, free, living bird. Dickie pictured the kitchen at home. He saw the smoking lamp, the filthy table, and the fireplace choked with ashes and scraps of dirty paper. He remembered dry bread that tasted of mice and water drunk from a broken earthenware cup. That would be his breakfast after going to bed in tears because Aunt Maud had slapped him.
        - id: ch01-b151
          speaker: dickie
          text: "I'll come with you. And thank you kindly."
        - id: ch01-b152
          speaker: mr_beale
          text: >-
            Understand this. I'm not kidnapping you, and I haven't tempted you away. You're coming because you freely choose to, aren't you?
        - id: ch01-b153
          speaker: dickie
          text: "Oh yes, I want to come."
        - id: ch01-b154
          speaker: mr_beale
          text: "Can you write?"
        - id: ch01-b155
          speaker: dickie
          text: "Yes, if I had a pen."
        - id: ch01-b156
          speaker: mr_beale
          text: "I've got a pencil. Wait here."
        - id: ch01-b157
          speaker: narrator
          text: >-
            From his pocket, Mr. Beale drew a new envelope, a clean sheet of paper, and a new pencil sharpened by a machine. To Dickie, they looked almost as if the man had brought them for this particular purpose. Perhaps he had.
        - id: ch01-b158
          speaker: mr_beale
          text: >-
            Write down what I tell you. Rest the paper flat against the sole of my boot.
        - id: ch01-b159
          speaker: narrator
          text: >-
            Mr. Beale lay face down on the road and raised one boot behind him, as though boots made perfectly ordinary writing desks.
        - id: ch01-b160
          speaker: mr_beale
          text: >-
            Begin like this. “Mr. Beale. Dear Sir, please take me travelling with you. I have no father or mother who will worry.” Can you spell “worry”? Good. You are a scholar. Now write, “I ask you to let me come. If you take me, I promise to give you everything I earn or receive, to behave well, and to do what you tell me. I shall be very glad if you agree. Your obedient servant.” What is your name?
        - id: ch01-b161
          speaker: dickie
          text: "My name is Dickie Harding."
        - id: ch01-b162
          speaker: mr_beale
          text: >-
            Put that at the end, then. Finished? I'm glad I wasn't born a table for people to write on. It makes your legs stiff, I can tell you.
        - id: ch01-b163
          speaker: narrator
          text: >-
            He rolled over, took the page, and read it slowly, with some difficulty. Then he folded it and slipped it into his pocket.
        - id: ch01-b164
          speaker: mr_beale
          text: >-
            Now everything is fair between us. That letter will stand as true and legal in any police court in England. Remember that.
        - id: ch01-b165
          speaker: narrator
          text: >-
            People who lived in Rosemary Terrace found the words “police court” deeply frightening. Dickie's face grew a little paler.
        - id: ch01-b166
          speaker: dickie
          text: "Why are you talking about the police? I didn't do anything wrong by writing what you told me, did I?"
          emotion: fearful
        - id: ch01-b167
          speaker: mr_beale
          text: >-
            No, my boy. You did right. But there are bad people in this world, police and the like, who might claim I carried you off against your wishes. A man could be sent away for less.
        - id: ch01-b168
          speaker: dickie
          text: "But it isn't against my wishes. I want to go!"
        - id: ch01-b169
          speaker: mr_beale
          text: >-
            Exactly what I say. Now that's settled, start walking and we'll find somewhere to sleep tonight. Tomorrow we'll sleep in a bed with green curtains.
        - id: ch01-b170
          speaker: dickie
          text: >-
            I read that in Hereward the Wake, the Last of the English. I always wondered what it meant.
          emotion: happy
        - id: ch01-b171
          speaker: mr_beale
          text: >-
            It means sleeping outdoors. You lie under a hedge or haystack and watch the stars until you drift off. Fine business in good weather. Then you walk awhile and rest awhile. Someone gives you a little help along the road, and at night you drink a glass of ale at the public house and find another green-curtained bed. On Saturday you gather extra food, and on Sunday you stay put and wash your shirt.
        - id: ch01-b172
          speaker: narrator
          text: >-
            That is indeed one meaning of sleeping out, though it was not at all what the author of Hereward had meant.
        - id: ch01-b173
          speaker: dickie
          text: "Do you have adventures?"
        - id: ch01-b174
          speaker: narrator
          text: >-
            Dickie had recognized, in Mr. Beale's account, the rough outline of a modern knight-errant's life.
        - id: ch01-b175
          speaker: mr_beale
          text: >-
            Adventures? Plenty! Only last month, a vicious dog bit my leg at a back door near Sutton. And once I saw an elephant.
        - id: ch01-b176
          speaker: dickie
          text: "A wild one?"
          emotion: surprised
        - id: ch01-b177
          speaker: mr_beale
          text: >-
            Not exactly wild. It belonged to a circus. But it was enormous! Wild elephants aren't half so big, I'll wager. You meet soldiers too, and people in red coats riding horses with spotted dogs. Then there are motorcars that will knock you down and take your head off before you know you're dead, unless you keep your eyes open. Adventures? Of course there are!
        - id: ch01-b178
          speaker: dickie
          text: "Ah, those truly are adventures!"
        - id: ch01-b179
          speaker: narrator
          text: "A deep silence settled between them. After a while, Mr. Beale looked at Dickie."
        - id: ch01-b180
          speaker: mr_beale
          text: "Are you tired?"
        - id: ch01-b181
          speaker: dickie
          text: "Just a tiny bit, perhaps. But I can keep going."
        - id: ch01-b182
          speaker: mr_beale
          text: >-
            Tomorrow we'll find something with wheels for you, even if it's only a sugar box. I can tie up that leg and make it look as though it's been cut off.
        - id: ch01-b183
          speaker: dickie
          text: "It's this horrible boot that makes me tired."
        - id: ch01-b184
          speaker: mr_beale
          text: >-
            Take it off, then. Sit on those stones and pull it off. Take the other one off too, if you like. You can walk on the grass.
        - id: ch01-b185
          speaker: narrator
          text: >-
            The damp grass felt cool and clean against Dickie's weary little foot. Where a water cart had dripped across the road, cool mud pressed deliciously between his toes. That was delightful, and washing the mud away in wet grass was pleasant too. Dickie remembered that moment all his life. It was the first time he had truly enjoyed being clean. In hospital, other people had made him almost too clean. Doing it himself made all the difference. Still, the hospital memory gave him an idea.
        - id: ch01-b186
          speaker: dickie
          text: "I wish I could have a bath."
        - id: ch01-b187
          speaker: mr_beale
          text: >-
            You shall. A proper wash all over, this very night. I like being clean myself. Some men think dirt helps them, but it doesn't. When you're clean, people say, “Honest poverty.” When you're filthy, they say, “It serves you right.” We'll find a pail or something tonight.
        - id: ch01-b188
          speaker: dickie
          text: "You really are good. I like you very much."
          emotion: happy
        - id: ch01-b189
          speaker: narrator
          text: >-
            Mr. Beale studied him through the gathering dusk. Dickie thought his look rather strange. Then the man gave a heavy sigh.
        - id: ch01-b190
          speaker: mr_beale
          text: >-
            Well, what's done is done, and things don't always... What I mean is, you behave yourself, and I'll treat you right.
        - id: ch01-b191
          speaker: dickie
          text: "I know you will. I know how good you are!"
          emotion: happy
        - id: ch01-b192
          speaker: mr_beale
          text: "Bless me, that's enough. Keep moving, sonny, or we won't arrive before Christmas."
        - id: ch01-b193
          speaker: narrator
          text: >-
            Now, Mr. Beale might be a cruel and wicked man who wanted Dickie only for the money the boy could bring him. Once he had Dickie alone in the country, he might treat him very badly. That new paper, envelope, and sharpened pencil certainly looked suspicious, did they not? Or perhaps he was truly kind. You will find out soon enough.
        - id: ch01-b194
          speaker: mr_beale
          text: >-
            Here we are. Now listen. Don't contradict anything I tell people. Remember, you're my little lad, and you must call me Daddy.
        - id: ch01-b195
          speaker: narrator
          text: >-
            Mr. Beale had stopped in a side street before an open doorway. A welcoming yellow light poured out into the dusk.
        - id: ch01-b196
          speaker: dickie
          text: "I'll call you Father. I already have a daddy of my own."
        - id: ch01-b197
          speaker: mr_beale
          text: "But you told me he was dead."
          emotion: surprised
        - id: ch01-b198
          speaker: dickie
          text: "He is. He's still my daddy, all the same."
        - id: ch01-b199
          speaker: mr_beale
          text: "Oh, come along."
        - id: ch01-b200
          speaker: narrator
          text: "Mr. Beale spoke impatiently, and the two of them went inside."
