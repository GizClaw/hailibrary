audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机敏，带着克制的幽默与讲故事的悬念
        timbre: 温暖清亮
        pace: 舒展而有变化
        pitch: 中音
    dickie:
      display_name: 迪基
      tts:
        delivery: 聪明敏感，街头口吻直率，学书中人物说话时郑重夸张
        timbre: 清脆稚嫩
        pace: 稍快，受委屈时断续
        pitch: 中高音
    man_next_door:
      display_name: 隔壁男人
      tts:
        delivery: 粗声粗气却不失善意，口吻随便
        timbre: 沙哑厚实
        pace: 从容
        pitch: 中低音
    aunt_maud:
      display_name: 莫德姨妈
      tts:
        delivery: 尖刻不耐烦，话里常带讥讽
        timbre: 干涩尖亮
        pace: 偏快
        pitch: 中高音
    shopman:
      display_name: 饲料店店员
      tts:
        delivery: 谨慎平淡，公事公办
        timbre: 普通清楚
        pace: 适中
        pitch: 中音
    nurse:
      display_name: 护士
      tts:
        delivery: 开朗温柔，亲切自然
        timbre: 柔和明亮
        pace: 适中
        pitch: 中音
    passerby_1:
      display_name: 黑衣路人甲
      tts:
        delivery: 疲惫中随口一问
        timbre: 低沉普通
        pace: 偏快
        pitch: 中低音
    passerby_2:
      display_name: 黑衣路人乙
      tts:
        delivery: 心不在焉，只顾赶路
        timbre: 紧促清楚
        pace: 快
        pitch: 中音
    pawnbroker:
      display_name: 当铺老板
      tts:
        delivery: 圆滑自得，遇到迪基时逐渐流露善意
        timbre: 洪亮饱满
        pace: 适中
        pitch: 中低音
    mr_beale:
      display_name: 比尔先生
      tts:
        delivery: 爽朗随和，热情背后藏着迟疑与盘算
        timbre: 粗粝有力
        pace: 不紧不慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 丁当儿与月亮花
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 迪基住在新十字。至少地址是这样写的。其实，他的家只是山坡上一排难看小屋中的一间。那片山坡从前铺着绿野，一直伸向河边。德特福德商人的老宅立在舒适的花园和果实累累的果园里，又庄重，又气派。如今，好田地和快乐的花园全被房屋压住了。仿佛有个邪恶的巨人，一手拿蘸满黄赭色的大刷子，一手拿蘸满泥浆色的大刷子，一道道涂掉了绿色。褐色变成马路，黄色变成房屋。它们一英里接一英里，一眼望不到头，走也怎么都走不完。街上唯一的绿色，是蔬菜铺里的卷心菜，还有偶尔从脏窗台垂下来的几绺可怜金钱草。每栋房后都有个小院，人们称它为花园。有些院子里确实有绿色，可它只给屋后的窗户看，街上的人完全看不到。人们喜欢绿色，眼睛看见它便会欢喜，也会安宁。所以，哪怕有人把他们困在一道道黄泥色的栅栏中间，叫他们拼命干活，只付一点点工钱，也总会有人情愿再多干一阵。他们不要一文工钱，只为让身边长出几株绿东西。
        - id: ch01-b02
          speaker: narrator
          text: 可迪基和姨妈同住的屋后，一点绿色也没有。院里尽是石头、骨头、碎砖，还有沾满油泥、黏成一团的旧洗碗布。用秃的扫帚头、断掉的铲子和一只没底的水桶也扔在那里。角落里还有一座发霉的破兔笼，很久很久以前，里头住过兔子。那实在太久了，迪基从没见过那些兔子。不过有个同学曾把一只棕兔藏在扣紧的外套里带到学校，还让他用两只手捧了好几分钟。后来老师发现兔子，把它锁进柜子，准备等放学以后再处理。因此，迪基知道兔子看起来、摸起来是什么样。想到这座笼子里曾住过那样可爱的动物，他就一直很喜欢它。
        - id: ch01-b03
          speaker: narrator
          text: 后来，姨妈把兔笼、水桶和铲子一股脑卖给了一个推小车收破烂的男人。那个人什么都肯买，这一堆东西却总共只换回三便士。迪基伤心得仿佛笼里当真还有个毛茸茸的朋友。他尤其恨那个把笼子搬走的男人，因为那辆小车后面，还凄凄凉凉地挂着几张空瘪的兔皮。其实，我们的故事正从兔笼被搬走时开始。迪基骂姨妈是野兽，还挥起脏兮兮的小拳头打她。他挨了结结实实几巴掌，被赶进失去兔笼的院子里。姨妈说，让他待在那里醒醒脑子。他扑倒在地，又哭又扭。身上的疼痛和心里的苦楚搅在一起，他一面哭，一面盼着好多好多事情。
        - id: ch01-b04
          speaker: man_next_door
          text: 这会儿又闹什么鬼？挨揍啦？
        - id: ch01-b05
          speaker: dickie
          text: 他们把兔笼搬走了。
          emotion: sad
        - id: ch01-b06
          speaker: man_next_door
          text: 可里头什么也没有啊。
        - id: ch01-b07
          speaker: dickie
          text: 我就是不想让人搬走嘛。
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: 隔壁男人拄着铁锹，说兔笼搬走还能宽敞些。那天是星期六下午，隔壁恰好有一个绿色的花园。里头有几株沾泥的小水仙、几朵脸蛋脏兮兮的小报春，还有水桶旁的一座凉棚。凉棚这时虽光秃秃的，却是真正的凉棚。园里还有一棵接骨木。天气一热，它便开出茶盘那么大的扁平白花。另一棵丁香树上，已经鼓起棕色花苞。对迪基来说，这些全都美极了。
        - id: ch01-b09
          speaker: man_next_door
          text: 得了，小家伙，别哭啦！你嚎个没完，我怎么挖地？快去问你姨妈，肯不肯让我替她收拾园子。我有空就来干。你肯定喜欢。
        - id: ch01-b10
          speaker: dickie
          text: 那还用说！
          emotion: happy
        - id: ch01-b11
          speaker: aunt_maud
          text: 脑子醒啦？给我记着，这是最后一次。以后少跟我耍花招，小祖宗！瞧你那臭脾气！
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: 迪基说了非说不可的话，又回到所谓的花园。
        - id: ch01-b13
          speaker: dickie
          text: 她说她没工夫瞎耽搁。您要有工夫，爱怎么弄就怎么弄，她不管。
        - id: ch01-b14
          speaker: man_next_door
          text: 你这张脸可真脏。来，我现在就过去开工。你把地上那些宝贝都捡起来。下回你姨妈进白金汉宫做客，咱们就烧一堆篝火。
        - id: ch01-b15
          speaker: narrator
          text: 他用一块没比迪基的脸干净多少的手帕替孩子擦了擦，抬腿跨过篱笆。迪基坐下来，把满地垃圾一件件扒到身边。
        - id: ch01-b16
          speaker: dickie
          text: 要等十一月五号吗？
        - id: ch01-b17
          speaker: man_next_door
          text: 几月几号都行，只要她不在。瞧这地，硬得像旧门阶！没事，咱们翻开土，再弄些小种子、小花苗。等收拾好，咱俩准认不出这里。
        - id: ch01-b18
          speaker: dickie
          text: 我有半便士。
        - id: ch01-b19
          speaker: man_next_door
          text: 我也添半便士。你去买种子，就这么办。
        - id: ch01-b20
          speaker: narrator
          text: 迪基去了。他走得慢，因为腿瘸。小时候，姨妈失手摔过他，从此他便成了这样。她并不讨人喜欢，好在她马上就要从故事里消失了。不过，迪基的父亲死后，她确实收留了孩子，本来也可以把他送去济贫院。她其实不是亲姨妈，只是父亲借住那户人家的女主人。她待迪基虽不亲切，肯留下他总算做了件好事。这也是我能替她找到的唯一一句好话，所以就不再说她了。迪基拄着一根截短的旧扫帚柄。那柄扫帚原已用旧，截到适合孩子的高度，就成了一根小拐杖。靠着它，他虽然瘸，走路还过得去。
        - id: ch01-b21
          speaker: narrator
          text: 他找到了粮食饲料店。那可真是一家迷人的铺子。店里闻着像马厩，深深的料槽落满灰尘，迪基真想钻进去玩。料槽上方有一排可爱的方脸小抽屉，标着油菜籽、大麻籽、金丝雀草籽、黍子、芥菜籽等等。再往上挂着吃这些饲料的动物画像。有吃伯利牌牛饲料、胖成长方形的母牛，有靠奥维斯牌绵羊香料喂成的羊毛枕头。最鲜艳、也最好看的一幅画上，是只羽毛光滑得出奇的鹦鹉。它浑身披着彩虹色，歪着脑袋，黑眼睛闪闪发亮。那眼神简直能让人相信，这一切迷人的光彩，全是佩罗凯特牌艺术鸟食的功劳。
        - id: ch01-b22
          speaker: dickie
          text: 给我来一便士那个！
        - id: ch01-b23
          speaker: shopman
          text: 钱带了吗？
        - id: ch01-b24
          speaker: narrator
          text: 迪基亮出钱，交了出去，抱着一个沙沙作响的纸袋回家。那袋子里装满了承诺。
        - id: ch01-b25
          speaker: man_next_door
          text: 嘿，这不是花种子，是鹦鹉吃的鸟食。
        - id: ch01-b26
          speaker: dickie
          text: 可上面写着什么“艺术鸟食”。我还以为能长出小鸟一样的花，颜色也跟那只鹦鹉一样呢。
          emotion: sad
        - id: ch01-b27
          speaker: man_next_door
          text: 说不定真能长出来。等我把这头的土翻好，就替你种下去。我敢说，准会长出漂亮东西。
        - id: ch01-b28
          speaker: narrator
          text: 种子就这样播下了。隔壁男人答应以后再拿两个便士，买真正的花种，还从自己园里移来两株脸蛋需要洗洗的小报春。那一天对迪基来说，实在好极了。晚上钻进被窝，他把白天发生的事从头到尾讲给唯一的知己听。他对这位知己什么也不隐瞒。知己一句话也没回答，但迪基很肯定，它的沉默绝不是因为不关心这个故事。
        - id: ch01-b29
          speaker: narrator
          text: 这位知己是一根约五英寸长、熏得发黑的小棒，上面缀着几只同样发黑的小铃铛，像狗项圈上的铃铛。小棒还连着一截微弯的白色硬物。它可以含在嘴里，可以拿手指来回摩挲，也可以在肥皂上戳洞。无论怎么用，都很合适。迪基不知道它究竟是什么。父亲是在医院里交给他的。那时父亲从干活的脚手架摔下来，再也好不起来了。迪基被带去医院，专为跟他告别。父亲躺在一张陌生病床上，周围是一大片同样干净的床。他自己也显得干净得吓人。
        - id: ch01-b30
          speaker: narrator
          text: 父亲叫迪基牢牢收好，说那东西完完全全属于他。父亲自己的爸爸把它传给了他，而那一位又是从自己的爸爸手里得来的。从前有个老太太告诉家里的老人，它会给他们带来好运。父亲最后说了声再见，又叫迪基小伙子。那番话，迪基一个字都没忘。他也一直守着这件宝贝。原本另有一样黄铜色的东西用绳系在上面，镶着一块白石头，上面还有图案。莫德姨妈发现后拿走了，说要替他保管，从此再没让他看见。迪基不认识带铃的黑棒，也不认识那根又硬又滑的白尖角，我却认识。那是一只老式的婴儿拨浪鼓，也可以叫它珊瑚铃。
        - id: ch01-b31
          speaker: dickie
          text: 咱们会有山野间最美的鲜花，还有绿茵茵的草地。啊，亲爱的丁当儿，那一定是一片绝美风光！新叶那令人愉悦的绿色中间，会开遍彩虹最鲜艳的颜色。我真喜欢隔壁先生。他确实有一颗金子般的心。
          emotion: happy
        - id: ch01-b32
          speaker: narrator
          text: 迪基只对朋友丁当儿这样讲话。你们已经听过他跟姨妈和隔壁男人怎样说话。其实，大多数孩子至少会说两种语言，哪怕没有外国保姆，也从没去过外国。你可千万别以为只有自己有这种本事。相信我，你绝不是唯一的一个。父母和监护人若听见亲爱的小查理跟厨娘、女仆说话的语言，准会吃一大惊，因为那跟孩子对他们说的话完全不同。等小查理跟擦靴小厮和马夫们聊天，他还会换上第三种语言，连真正的口音也学得像极了。
        - id: ch01-b33
          speaker: narrator
          text: 迪基的第二种语言来自书本。学校老师送过他六本平装书，其中有《新森林的孩子们》《昆丁·达沃德》和《觉醒者赫里沃德》，另外还有三本。它们为迪基打开一个全新的世界。书里的人既然都用那种好听又有点古怪的方式讲话，他看不出自己为什么不能学一学。当然，这种话只说给信得过的朋友听。希望这些事还没叫你听烦。我非得先让你知道，迪基是怎样的男孩，过着怎样的日子。否则，等奇遇真正开始，你就不会明白。而他的奇遇可多着呢，多得没边儿，你马上就会看见。
        - id: ch01-b34
          speaker: narrator
          text: 第二天，迪基醒来时，快活得像春日的太阳。那太阳正费劲地透过脏窗户看他。
        - id: ch01-b35
          speaker: dickie
          text: 也许他今天还会来收拾花园！
          emotion: happy
        - id: ch01-b36
          speaker: narrator
          text: 迪基飞快起床，在肮脏冷清、毫无舒适可言的屋里自己穿好衣服。可到了晚上，却是亲切而干净的手替他脱衣服，又把他放进大浴盆。盆里半满着银亮的热水，肥皂闻起来像街尾的木料场。原来，他拄着小拐杖去上学时，傻乎乎的脑袋里尽是艺术鸟食和彩虹颜色的花。他没有留神脚下，拐杖在一块香蕉皮上一滑，整个人摔倒了。紧接着，肉铺的马车从那只可怜的瘸脚上轧过。人们把受伤的脚送进医院，当然也只好带上迪基。那所医院，比他从前遇见的任何地方，都更像书里写的天堂。
        - id: ch01-b37
          speaker: narrator
          text: 医生护士用的词，跟书里人用的很像，声音却是迪基从没听过的。第二天，一位圆脸爱笑、戴白帽子的女士来问他。
        - id: ch01-b38
          speaker: nurse
          text: 好啦，汤米，我们今天觉得怎么样？
        - id: ch01-b39
          speaker: dickie
          text: 在下之名与汤米相去甚远。承蒙高贵的女士垂询，在下如今身处奢华富贵之中。
        - id: ch01-b40
          speaker: narrator
          text: 女士哈哈大笑，捏了捏他的脸。后来她渐渐熟悉迪基，知道了这套说法从何而来，便给他拿来更多书。迪基又从书里学会许多新词。医院里人人都待他很好。可是出院时，他们把他的瘸脚塞进一只厚重靴子。靴底笨重得吓人，几根铁条还从靴边一直箍到腿上。姨妈和她的朋友都说医院的人真好，迪基却恨透这靴子。学校里的男孩已经看惯他的拐杖，如今又拿这只怪靴子取笑他。这比叫他“老点一下、挪一步”还糟。那个旧绰号，他早已听惯，听起来差不多都像昵称了。
        - id: ch01-b41
          speaker: narrator
          text: 回家第一晚，迪基发现自己遭了贼。床铺一角的线破了，里头露出柔软的棉絮窝，最适合藏男孩最好的朋友。可丁当儿已经不见了。他很明白，开口问姨妈没有用。因此，他把家里五间屋子一间间找遍，却始终不见丁当儿。第二天，趁姨妈出门买东西，他又来到餐具柜前。在抽屉最深处，脏抹布、衣夹、绳头、软木塞和廉价小说中间，他发现一张小方纸板。那是一张当票，上面写着：“拨浪鼓，一先令。”迪基很懂当票。你们当然不懂，那就请一位大人解释吧。我没空细说，还要接着讲故事。
        - id: ch01-b42
          speaker: narrator
          text: 找到当票以前，迪基什么也想不进去，连花园都顾不上，更没心思猜艺术鸟食是否长出了鹦鹉般的颜色。他在医院住了很久，如今已经八月。护士们一口咬定，种子早该发芽，回去准能看见花。现在他终于走进院子。花园尽头的绿叶乱蓬蓬缠成一团，隔壁却满是杂草。原来隔壁男人去了阿什福德一带找活儿，那边有许多啤酒花田。他住过的房屋也正在招租。播过艺术鸟食的地方，只长出几朵瘦小的粉花和黄花。可是所有花草上方，耸立着一朵大花。它足足有迪基三倍高，形状像向日葵，却洁白无瑕。
        - id: ch01-b43
          speaker: dickie
          text: 哎呀，它有餐盘那么大！
          emotion: surprised
        - id: ch01-b44
          speaker: narrator
          text: 的确如此。它美丽庄严地挺立，把乳白色的脸朝向太阳。
        - id: ch01-b45
          speaker: dickie
          text: 花茎简直像棵小树。
        - id: ch01-b46
          speaker: narrator
          text: 的确像。硕大的叶片向下垂着，巨花下面又伸出十来朵小白花。托住它们的长茎，比月亮花的主茎细得多。
        - id: ch01-b47
          speaker: dickie
          text: 既然另一种叫向日葵，它当然就是月亮花。我爱它！我爱它！我爱它！
          emotion: happy
        - id: ch01-b48
          speaker: narrator
          text: 可迪基没让自己爱上多久。他还有正事，非弄到一先令不可。有这一先令，他就能拿写着拨浪鼓的方纸片，换回唯一的朋友丁当儿。没有这一先令，哪怕握着当票，他也什么都换不回来。这就是当票那种阴沉魔法的一部分，哪位好心大人自会向你解释。
        - id: ch01-b49
          speaker: dickie
          text: 我没法靠流汗挣钱。别人要找跑腿的，当然会找两条好腿的男孩，哪会找我。我真希望自己有什么东西能卖。
          emotion: sad
        - id: ch01-b50
          speaker: narrator
          text: 他四下打量。隔壁男人没来得及翻过的地方，比从前更脏、更讨厌了。肯定没有任何人愿意买院里的东西，尤其是兔笼已经卖掉。除非……对了，月亮花！后厨水槽上有只碗，磨秃的旧刀躺在土豆皮里，活像绿叶丛中的花。迪基拿起刀，小心割下六朵较小的月亮花，一瘸一拐来到新十字车站。他拄着拐杖，站在出口外，把花举向每趟火车送出的人潮。疲倦的人们黑压压涌出来，只想快点回家喝茶，谁也不肯多理会他或他的花。可人人都免不了看上一眼，因为那些花实在奇妙。它们白得像睡莲，却长着扁平的向日葵形状，花心则是最纯净的金黄色。
        - id: ch01-b51
          speaker: passerby_1
          text: 挺漂亮，是不是？
        - id: ch01-b52
          speaker: passerby_2
          text: 不漂亮。漂亮。谁知道！你就不能快点吗？
        - id: ch01-b53
          speaker: narrator
          text: 花一朵也没卖掉。迪基累了，花也渐渐垂下脑袋。他转身准备回家，忽然想到一个办法，脸上顿时涌起血色。他赶紧又转过身，直奔当铺。那张当票上的地址，他早已背得滚瓜烂熟。铺子门上吊着三只气派的金球，橱窗里摆满漂亮东西，有戒指、链子、胸针、手表、瓷器、丝手帕，还有六角手风琴。迪基把花抱好，壮着胆走了进去。
        - id: ch01-b54
          speaker: pawnbroker
          text: 怎么样，年轻人，有什么能为你效劳？
        - id: ch01-b55
          speaker: dickie
          text: 我想把月亮花当掉。
        - id: ch01-b56
          speaker: narrator
          text: 胖先生放声大笑，用胖手拍着胖腿。
        - id: ch01-b57
          speaker: pawnbroker
          text: 这可真绝！我这辈子听过的笑话里，它也数一数二。小傻瓜，等你回来赎花，它们早就死透了！
        - id: ch01-b58
          speaker: dickie
          text: 可它们活着的时候归您呀。
        - id: ch01-b59
          speaker: pawnbroker
          text: 这是什么花？看着不怎么稀罕。不过想一想，我还真没见过这样的。
        - id: ch01-b60
          speaker: narrator
          text: 当铺老板住在布罗克利一幢整洁的小别墅里。他平日也爱摆弄园艺，而且摆弄得很有绅士派头。他不是靠园艺吃饭的人，每回修剪、栽种，都带着一种郑重的自得。那副派头仿佛时时在对旁人说，你们可别以为我请不起真正的园丁。我若高兴，随时都请得起，只是今天愿意亲自动手罢了。
        - id: ch01-b61
          speaker: dickie
          text: 这是月亮花。我想当掉它们，再拿钱赎出别的东西。
        - id: ch01-b62
          speaker: pawnbroker
          text: 带当票了吗？
        - id: ch01-b63
          speaker: dickie
          text: 带了。丁当儿本来就是我的，是爸爸临死前给我的。我住院时，姨妈把它“繁殖”进当铺了。
        - id: ch01-b64
          speaker: narrator
          text: 男人接过那张小小的当票，从头到尾仔细看了一遍。他又抬头看看迪基，再看看孩子手里的白花，仿佛正在心里衡量这桩前所未有的买卖。
        - id: ch01-b65
          speaker: pawnbroker
          text: 好吧，把花交过来。其实也不坏。汉弗莱斯，把花插进水壶，等我带回家。再把当票上的东西取出来。
        - id: ch01-b66
          speaker: narrator
          text: 花一到自己手里，当铺老板便更赏识它们了。东西成了自己的，看起来总不一样，对吧？一个脸色苍白、戴着眼镜的年轻人，从店后洞穴似的黑暗里钻出来。他接过那六朵月亮花，也接过当票，随后又退回铺子后面。转眼之间，那片洞穴似的黑暗便把他整个吞没了。
        - id: ch01-b67
          speaker: dickie
          text: 啊，多谢您！在下此生惟愿报答您丰厚慷慨之恩德。
          emotion: happy
        - id: ch01-b68
          speaker: pawnbroker
          text: 少跟我油嘴滑舌。
          emotion: angry
        - id: ch01-b69
          speaker: narrator
          text: 当铺老板涨红了脸。两人尴尬地沉默了一会儿。
        - id: ch01-b70
          speaker: dickie
          text: 我不是油嘴滑舌，是真心的。总有一天您会明白。在下曾读过一篇有趣的叙事，讲百兽之王狮子与一只体形微小、生性胆怯的老鼠。倘若阁下没听过，在下现在便可转述。
        - id: ch01-b71
          speaker: pawnbroker
          text: 你这小鬼真怪。哪儿学来这套话？
        - id: ch01-b72
          speaker: dickie
          text: 书里的人就这么说。您是位大人物，我还以为您听得懂。是我弄错了，没想冒犯。
        - id: ch01-b73
          speaker: pawnbroker
          text: 这么说，你想像书里那样讲话就能讲，想停就能马上停？
        - id: ch01-b74
          speaker: dickie
          text: 在下可以像贵族老爷和贵妇那般交谈。尊贵恩公的善行，使在下竭力从胸中调遣最美妙的词句，表达感激之情。
        - id: ch01-b75
          speaker: pawnbroker
          text: 喜欢看书？
        - id: ch01-b76
          speaker: dickie
          text: 那还用问。
        - id: ch01-b77
          speaker: narrator
          text: 此后便不再有尴尬的沉默。苍白的年轻人拿着一件用干净碎布包好的东西回来，又对老板耳语几句。当铺老板展开布，细看那只拨浪鼓。
        - id: ch01-b78
          speaker: pawnbroker
          text: 果然是。而且是件好东西，别的先不说。
        - id: ch01-b79
          speaker: dickie
          text: 可不是吗？
          emotion: happy
        - id: ch01-b80
          speaker: pawnbroker
          text: 我这里还有一样东西，上面的纹章跟你的拨浪鼓相同。
        - id: ch01-b81
          speaker: dickie
          text: 纹章？那不是锦标比武激战时，戴在头盔顶上的东西吗？
        - id: ch01-b82
          speaker: narrator
          text: 当铺老板耐心解释，纹章如今已经不只住在头盔上。许多稀奇古怪的东西上面，也会带着家族纹章。他让迪基去看拨浪鼓的侧面。那里有一只怪模怪样的小动物，是用一道道极细的划痕刻出来的。原来，这只小动物正是一枚纹章。
        - id: ch01-b83
          speaker: pawnbroker
          text: 汉弗莱斯，把它擦亮，再把那枚印章拿来。
        - id: ch01-b84
          speaker: narrator
          text: 苍白的年轻人把丁当儿拿到一旁，用粉红色粉末、刷子和麂皮仔细擦拭。黑色的污垢一点点退去，下面的银光渐渐显出来。与此同时，当铺老板拿起一块断成两半的白玉髓，把两片断口小心拼到一起。
        - id: ch01-b85
          speaker: pawnbroker
          text: 这是从一枚印章上掉下来的。我可以把它送给你。
        - id: ch01-b86
          speaker: dickie
          text: 啊，您真是一位义薄云天的侠士！
          emotion: happy
        - id: ch01-b87
          speaker: narrator
          text: 迪基特意把拐杖靠在柜台上，学书中男孩欣喜若狂时的样子，双手紧握。
        - id: ch01-b88
          speaker: pawnbroker
          text: 我让伙计用胶粘好，装进小盒子。明天以前别拿出来，要让它粘牢。也别真用它盖印，火漆会把胶融掉。说不定它会给你带来好运。
        - id: ch01-b89
          speaker: narrator
          text: 它后来果真带来了好运，而且是好心的当铺老板做梦也想不到的好运。不过，那是后面的故事。迪基离开时固然失去了月亮花，却换回了擦得银白发亮的丁当儿。老板认定它是真银，还特意叮嘱小伙子一定小心保管。白玉髓印章也粘好了，仔细装进一个结实的小纸盒，盒子四角包着金属。他还得到两本书。一本是书脊断裂的《英戈尔兹比传奇》，另一本是连书脊都完全没有的《马卡姆夫人英国史》。
        - id: ch01-b90
          speaker: pawnbroker
          text: 要继续努力，增长见识。下个月左右，再来看看我。
        - id: ch01-b91
          speaker: narrator
          text: 当铺老板为自己的善心十分得意。
        - id: ch01-b92
          speaker: dickie
          text: 我会来的。一颗感恩的心向您献上千万声祝福。您真好！谢谢，谢谢！下个月我一定回来，把我从细细品读这些书里学到的一切全告诉您。
          emotion: happy
        - id: ch01-b93
          speaker: pawnbroker
          text: 对，是“品读”，这个词该这样念。再见吧，小伙子，下个月见。
        - id: ch01-b94
          speaker: narrator
          text: 然而等到下个月，迪基已经身在与当铺完全不同的地方，身边也是一个与当铺老板完全不同的人。那时，那位老板正在布罗克利乡野般的住处，很有绅士派头地摆弄自己的花园。眼下，迪基先回到了家，姨妈还没回来。他从书上读到过，宝物最好藏在松动的地板下。除非家中有秘密壁板，那就另当别论，可他家没有。他房里恰好有块松地板，煤气工人会从那里下手，照料下面的管道。迪基费劲撬开木板，沿着粗糙松脆的板条和灰泥，把丁当儿、印章和两本书尽量往深处推。它们在黑暗中越远，他才越安心。
        - id: ch01-b95
          speaker: narrator
          text: 他刚把地板哄回原位，姨妈便在楼下尖叫起来。
        - id: ch01-b96
          speaker: aunt_maud
          text: 还不下来？我听见你在上头咚咚乱踩啦。快给我买半便士柴火！没有火，我怎么烧开水？
          emotion: angry
        - id: ch01-b97
          speaker: narrator
          text: 迪基下楼挨了不轻不重一巴掌，接过半便士，乖乖一瘸一拐地出了门。可他很久很久都没回来。还没走到那家卖柴和煤的铺子，他便看见一台潘趣与朱迪木偶戏。那家铺子没有玻璃窗，只有一到夜里便关起来的木板门。迪基从未见过这种木偶戏，一下就入了迷。他很想看戏台打开包裹，把藏在里面的奇妙玩意儿全亮出来，于是跟着它走过一条又一条不认识的街道。最后，他才发现木偶戏根本不打算演，只是要回一间旧马车房睡觉。迪基这才想起柴火。那枚始终攥得紧紧的半便士，在手心里热乎乎的，仿佛正在责备他。
        - id: ch01-b98
          speaker: narrator
          text: 他环顾四周，完全不知道自己在哪里。木偶戏住的院子里，一个又高又瘦、衣衫褴褛的男人靠着马厩门。他取下嘴里的陶土烟斗。
        - id: ch01-b99
          speaker: mr_beale
          text: 怎么了，小家伙？迷路啦？
        - id: ch01-b100
          speaker: narrator
          text: 迪基把自己怎样跟着木偶戏走到这里、又怎样迷了路，仔细解释了一番，最后报出住址。
        - id: ch01-b101
          speaker: dickie
          text: 我住薰衣草台地，德特福德迷迭香街的薰衣草台地。
        - id: ch01-b102
          speaker: mr_beale
          text: 我也去那边。你愿意的话，咱们坐船回去。坐过船吗？
        - id: ch01-b103
          speaker: dickie
          text: 没有。
        - id: ch01-b104
          speaker: mr_beale
          text: 想坐吗？
        - id: ch01-b105
          speaker: dickie
          text: 坐坐也行。
        - id: ch01-b106
          speaker: narrator
          text: 汽船飞快前进，一路把河水推向两旁。它呼哧呼哧喘着气，肚里还有什么东西咚咚跳着，像一颗巨人的心。坐船实在惬意。清新的风迎面吹来，褴褛男人在烟囱后面找到一处避风角落。那里挡风挡得太好，方才吹来的风又太猛，迪基很快就困了。等他睁眼问自己刚才是不是睡着了，汽船正在陌生码头停靠，岸上居然生着树。
        - id: ch01-b107
          speaker: mr_beale
          text: 到啦！你问有没有睡着？你可睡得够沉！醒醒，小伙子，咱们在这儿下船。
        - id: ch01-b108
          speaker: dickie
          text: 这是德特福德吗？
        - id: ch01-b109
          speaker: narrator
          text: 推推搡搡下船的人听见了，都笑起来。
        - id: ch01-b110
          speaker: mr_beale
          text: 不完全是，不过没关系。咱们就在这里下。孩子，你还没喝下午茶吧？
        - id: ch01-b111
          speaker: narrator
          text: 那是迪基想象得到最丰盛的下午茶。有煎蛋和培根，迪基吃一个蛋，男人吃三个。还有面包黄油。面包切得厚厚的，黄油也抹得厚厚的。至于茶，只要喝完肯说一声谢谢，想要多少杯都行。吃完以后，男人问他还能不能再走一小段。迪基说自己能走，于是两个人便亲亲热热地肩并着肩，一同上路。
        - id: ch01-b112
          speaker: dickie
          text: 我特别喜欢，谢谢您的好意。茶和鸡蛋也谢谢您。这里是我见过最美的地方。可是我该回家了。哪怕现在回去，也免不了狠挨一顿。我出门时，她正等柴火烧水呢。
        - id: ch01-b113
          speaker: mr_beale
          text: 你妈妈？
        - id: ch01-b114
          speaker: dickie
          text: 姨妈。不是亲的，我只这样叫她。
        - id: ch01-b115
          speaker: mr_beale
          text: 她待你好吗？
        - id: ch01-b116
          speaker: dickie
          text: 脾气好的时候还不坏。
        - id: ch01-b117
          speaker: mr_beale
          text: 等你回去，她的脾气肯定好不了。你这回闯大祸啦。咱俩认识已经好几个钟头。瞧，太阳快落山了。
        - id: ch01-b118
          speaker: narrator
          text: 太阳果真快落了。长长的金光掠过迪基生平见过最美的树梢。他们走在乡间道路上，两旁有绿色树篱、绿色青草，还有圆脸小花。那是雏菊，连迪基也认得。
        - id: ch01-b119
          speaker: dickie
          text: 我只能受着，还是回家吧。
          emotion: sad
        - id: ch01-b120
          speaker: mr_beale
          text: 换了我就不回去。我要出去见见世面。
        - id: ch01-b121
          speaker: dickie
          text: 谁？我吗？
          emotion: surprised
        - id: ch01-b122
          speaker: mr_beale
          text: 为什么不？我给你一个公平的提议。跟我去见世面吧！我要一路流浪到布赖顿，再沿着海边回来。见过大海吗？
        - id: ch01-b123
          speaker: dickie
          text: 没有。啊，没有，我从来没见过。
        - id: ch01-b124
          speaker: mr_beale
          text: 那就跟我走。我没像你姨妈那样揍你，对吧？我请你坐船，只是你睡着了。我还请你吃了一顿皇帝才配吃的下午茶。是不是？
        - id: ch01-b125
          speaker: dickie
          text: 一点没错。
        - id: ch01-b126
          speaker: mr_beale
          text: 这就说明我是怎样的人。现在我跟你做个公平交易。你跟着我，做我的小家伙。我来做你爸爸。我敢说，就算我天生是你爸爸，也不会做得更好。怎么样？
        - id: ch01-b127
          speaker: narrator
          text: 男人说话时，神情又亲切，又爽朗。坐船、下午茶、乡间道路，还有眼前这个邀他去看大海的人，整场奇遇都那样奇妙、那样新鲜。迪基看看男人，又看看身边的绿色树篱。
        - id: ch01-b128
          speaker: dickie
          text: 您要去的地方，都是乡下吗？
        - id: ch01-b129
          speaker: narrator
          text: 他望着绿色树篱。
        - id: ch01-b130
          speaker: mr_beale
          text: 差不多一路都是。咱们慢慢走，沿海岸绕一圈。绅士们喜欢去那里度假，度假时手头总有余钱。我敢说，你这两颊也会有点血色。现在简直像油灰。怎么样，成交吗？
        - id: ch01-b131
          speaker: dickie
          text: 您待我这么好，可为什么呢？管我吃饭得花不少钱。您图什么？
        - id: ch01-b132
          speaker: narrator
          text: 男人挠着头，迟迟没有回答。他们这时坐在路旁一堆石头上歇脚。男人先抬起脸看看天空，又低下头看看脚边的道路。迪基安静地等着。过了好一会儿，男人终于拿定主意，开口说了实话。
        - id: ch01-b133
          speaker: mr_beale
          text: 你这孩子真精，精得要命。好吧，我不骗你。我想找个伴，一个人流浪一点也不好玩。再说，我靠善心的先生太太们过日子，身边有个小不点，他们会多给一些。况且我喜欢孩子。有些人不喜欢，我喜欢。
        - id: ch01-b134
          speaker: narrator
          text: 迪基觉得他说的是真话，但还是有点迟疑。
        - id: ch01-b135
          speaker: dickie
          text: 您是说，我们要当叫花子？
        - id: ch01-b136
          speaker: mr_beale
          text: 别给人乱扣名号。咱们只管上路。好心人若肯搭把手，对大家都有好处，只要主日学校教我的那套话算数。就是这么回事，答应不答应，随你。
        - id: ch01-b137
          speaker: narrator
          text: 夕阳射出长长的金光，穿过树篱间的缺口。一只鸟正在飞，忽然停到近旁的树枝上。它紧紧抓住枝条，随着风轻轻摇晃。那是一只真正的活鸟。迪基却想起家里的厨房，想起冒烟的油灯、肮脏的桌子，还有塞满灰烬和脏纸的壁炉挡板。他也想起带着耗子味的干面包，和破陶杯里的水。若是现在回去，他会挨姨妈的巴掌，哭着睡上一夜。等到天亮，那些东西就是他的早饭。
        - id: ch01-b138
          speaker: dickie
          text: 我跟您走。谢谢您的好意。
        - id: ch01-b139
          speaker: mr_beale
          text: 你记住，这可不是拐骗。我没诱你离家，是你自愿跟来的，对吧？
        - id: ch01-b140
          speaker: dickie
          text: 对，当然。
        - id: ch01-b141
          speaker: mr_beale
          text: 会写字吗？
        - id: ch01-b142
          speaker: dickie
          text: 会，只要有笔。
        - id: ch01-b143
          speaker: narrator
          text: 男人说自己有铅笔，叫迪基稍等。接着，他从口袋里一件件掏出一个新信封、一张从没写过字的新信纸，还有一支由机器削得整整齐齐的新铅笔。三样东西都准备得妥妥当当。迪基越看越觉得，它们像是为某个特殊目的特意带来的。或许真是如此。
        - id: ch01-b144
          speaker: mr_beale
          text: 照我说的写。把纸平铺在我的鞋底上。
        - id: ch01-b145
          speaker: narrator
          text: 他面朝下趴在路上，抬起一只靴子，仿佛靴底本来就是最合适的写字台。
        - id: ch01-b146
          speaker: mr_beale
          text: 写吧。“比尔先生，尊敬的先生，请您允许我跟随您一道流浪。我既没有父亲，也没有母亲会为我忧心。”忧心会写吗？对啦，你果然有学问！接着写，“我请求您准许我随您同行。”写完了吗？我等你一会儿。再写，“倘若您带我同行，我保证把无论做工挣来的，还是用别的办法得到的一切，全都交给您。我会做个好孩子，听从您的吩咐。若您肯答应，我将不胜欣喜。您恭顺的仆人……”你叫什么名字？
        - id: ch01-b147
          speaker: dickie
          text: 迪基·哈丁。
        - id: ch01-b148
          speaker: mr_beale
          text: 写上去。写完啦？幸亏我生来不是供人写字的桌子。这样抬腿，怎么会不僵！
        - id: ch01-b149
          speaker: narrator
          text: 他翻过身，接过纸，吃力地慢慢读完，折好收进口袋。
        - id: ch01-b150
          speaker: mr_beale
          text: 这下咱们两清了。这张纸拿到英格兰任何治安法庭都是真凭实据。你别忘了。
        - id: ch01-b151
          speaker: narrator
          text: 对迷迭香台地的居民来说，治安法庭几个字吓人极了。迪基脸色白了一点。
        - id: ch01-b152
          speaker: dickie
          text: 为什么要找警察？照您说的写，我没做错事呀？
          emotion: fearful
        - id: ch01-b153
          speaker: mr_beale
          text: 没有，孩子，你做得对。可世上有警察之类的坏人，可能诬赖我违背你的意愿把你带走。他们能为了更小的事把人关起来。
        - id: ch01-b154
          speaker: dickie
          text: 可这没违背我的意愿，是我自己想走！
        - id: ch01-b155
          speaker: mr_beale
          text: 我说的就是这个。现在讲定了，你就加把劲。咱们找找今晚睡哪儿，明天就睡绿帘子的床。
        - id: ch01-b156
          speaker: dickie
          text: 我在《觉醒者赫里沃德》里见过这个，最后一个英格兰人。我一直纳闷，那句话是什么意思。
          emotion: happy
        - id: ch01-b157
          speaker: mr_beale
          text: 意思就是露宿。躺在树篱或干草垛底下，抬头看星星，一直看到自己睡着。天气好时，这事快活极了。第二天起来，走上一阵，歇上一阵。有人送你点东西，帮你继续赶路。到了晚上，就去酒馆喝一杯麦酒，再找一张绿帘子的床。星期六要多弄一些吃的，星期天就留在原地，还可以洗洗衬衫。
        - id: ch01-b158
          speaker: narrator
          text: 露宿确实是这个意思，不过《赫里沃德》的作者绝不是这样用那句话的。迪基听着，觉得这正是现代游侠的生活。
        - id: ch01-b159
          speaker: dickie
          text: 你们会遇到奇遇吗？
        - id: ch01-b160
          speaker: mr_beale
          text: 奇遇？那还用说！上个月，在萨顿那边一户人家的后门，一条恶狗咬了我的腿。我还见过大象。
        - id: ch01-b161
          speaker: dickie
          text: 野生的吗？
          emotion: surprised
        - id: ch01-b162
          speaker: mr_beale
          text: 不算野生，它跟着马戏团。可真大！我敢说，野生的都没它一半大。路上还能碰见士兵、骑马的红衣人和花斑狗。还有汽车，你若不机灵，它会从身上轧过去，等脑袋掉了都不知道自己死了。奇遇？当然有！
        - id: ch01-b163
          speaker: dickie
          text: 啊，原来真有这样的奇遇！
          emotion: happy
        - id: ch01-b164
          speaker: narrator
          text: 一阵满满的沉默落在两人中间。迪基想着恶狗、大象、骑马的红衣人和飞驰的汽车，什么也没有再说。他们继续向前走了一阵。过了一会儿，比尔先生才转头问他，是不是已经累了。
        - id: ch01-b165
          speaker: dickie
          text: 也许只有一丁点儿。我撑得住。
        - id: ch01-b166
          speaker: mr_beale
          text: 明天给你弄个带轮子的东西，哪怕只是糖箱。我还能把你那条腿绑起来，叫它看着像截掉了。
        - id: ch01-b167
          speaker: dickie
          text: 是这只讨厌的靴子害我累。
        - id: ch01-b168
          speaker: mr_beale
          text: 脱掉。坐在石头上脱！另一只想脱也脱。你可以踩草走。
        - id: ch01-b169
          speaker: narrator
          text: 带露水的青草贴着迪基疲惫的小脚，又凉爽，又干净。走过一处被洒水车滴湿的路面时，冰凉的泥从脚趾缝里挤上来，妙极了。等走回草地，再用湿草把泥擦掉，也一样舒服。迪基永远记得这一刻。这是他一生中第一次真正享受到干净的乐趣。在医院里，他几乎干净过头，而且那些干净都不是自己动手得来的。这一点让感觉完全不同。不过，正是医院的记忆又使他想到另一件事。
        - id: ch01-b170
          speaker: dickie
          text: 我真想洗个澡。
        - id: ch01-b171
          speaker: mr_beale
          text: 当然可以。今晚就从头到脚洗一遍。我自己也喜欢干净。有些家伙以为脏着讨饭更划算，其实不对。你干净，人家说你是清白的穷人。你脏，人家就说你活该受穷。今晚咱们弄只水桶来。
        - id: ch01-b172
          speaker: dickie
          text: 您真好。我真喜欢您。
          emotion: happy
        - id: ch01-b173
          speaker: narrator
          text: 暮色渐深。比尔先生隔着暮色看他，迪基觉得那眼神很古怪。男人还重重叹了一口气。
        - id: ch01-b174
          speaker: mr_beale
          text: 唉，好吧……没转弯的事都算好事，事情也不总是……我是说，你做个好孩子，我会好好待你。
        - id: ch01-b175
          speaker: dickie
          text: 我知道您会。我知道您有多好！
          emotion: happy
        - id: ch01-b176
          speaker: mr_beale
          text: 天哪！好了，走吧，孩子。不然到圣诞节也走不到。
        - id: ch01-b177
          speaker: narrator
          text: 现在你们看，比尔先生也许是个残忍邪恶的人。他可能只想把迪基弄到手，好靠这个孩子挣钱。等他把迪基远远带到乡下，四周再没有别人，也许还会狠狠欺负他。再说，那张纸、信封和铅笔，他偏偏都事先准备好了。这件事确实很古怪，对不对？不过，他也可能真是个仁慈的人。究竟是哪一种，别急，你们很快就会知道。
        - id: ch01-b178
          speaker: mr_beale
          text: 这就到啦。记住，不管我对别人说什么，你都不许反驳。还有，你是我家小子，得叫我爸爸。
        - id: ch01-b179
          speaker: narrator
          text: 比尔先生说话时，已经停在一条小街上。两人面前有一扇敞开的门，温暖的黄色灯光从里面流到街面，仿佛正在热情欢迎他们。迪基站在门口，却仍牢牢记着自己真正的父亲。
        - id: ch01-b180
          speaker: dickie
          text: 我叫您父亲吧。我有自己的爸爸。
        - id: ch01-b181
          speaker: mr_beale
          text: 咦？你不是说他死了吗？
          emotion: surprised
        - id: ch01-b182
          speaker: dickie
          text: 是死了，可他还是我爸爸呀。
        - id: ch01-b183
          speaker: mr_beale
          text: 哎，快走吧。
        - id: ch01-b184
          speaker: narrator
          text: 比尔先生不耐烦起来。两个人走了进去。
