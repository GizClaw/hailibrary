audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机敏，带着克制的幽默与讲故事的悬念
        timbre: 温暖清亮
        pace: 舒展而有变化
        pitch: 中音
    dickie:
      display_name: 迪基
      tts:
        delivery: 聪明敏感，街头口吻直率，学书中人物说话时郑重夸张
        timbre: 清脆稚嫩
        pace: 稍快，受委屈时断续
        pitch: 中高音
    mr_beale:
      display_name: 比尔先生
      tts:
        delivery: 爽朗随和，热情背后藏着迟疑与盘算
        timbre: 粗粝有力
        pace: 不紧不慢
        pitch: 低音
    lady:
      display_name: 路上的太太
      tts:
        delivery: 端庄谨慎，心肠柔软
        timbre: 清澈文雅
        pace: 从容
        pitch: 中音
    little_girl:
      display_name: 小姑娘
      tts:
        delivery: 好奇坦率，天真友善
        timbre: 轻柔稚嫩
        pace: 适中
        pitch: 高音
    jim:
      display_name: 吉姆
      tts:
        delivery: 粗暴警觉，语气冷硬不耐烦
        timbre: 沙哑紧涩
        pace: 偏慢
        pitch: 中低音
    eleanor:
      display_name: 埃莉诺
      tts:
        delivery: 温柔镇定，怜悯中带着坚定
        timbre: 柔和文雅
        pace: 从容
        pitch: 中音
    sir_edward:
      display_name: 爱德华爵士
      tts:
        delivery: 威严警醒，处事干脆实际
        timbre: 坚定浑厚
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 窃贼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            迪基睡在一张又硬又窄的床上，身下的粗布床单倒很干净。这张床花了四便士。临睡前，新朋友兼“父亲”比尔先生还叮嘱他，要把衣裳和靴子全塞到枕垫底下。那天晚上，他在火边用一只水桶洗了澡，至少也算好好擦洗过一番。衣衫褴褛却十分和气的旅人围着火，用随身包袱里的小烤架和煎锅烹调鲱鱼、香肠，还有种种美味。一个没有烤架的男人，干脆用厨房火钳烤牛排。迪基佩服得不得了。他还替一位很胖的女人用木片烤好一条鲱鱼，得了两个青苹果作报酬。
        - id: ch01-b02
          speaker: narrator
          text: >-
            躺下以后，他听着楼下厨房里的谈笑和歌声，觉得做流浪汉真是快活，流浪汉也全是有趣的好伙伴。这些人都在赶路。这所屋子有厨房、有好伙伴，还有四便士一张的干净床铺，简直就是流浪汉的客店。全国各地都有这样的地方，大人们叫它普通客栈。歌声和笑声一直响到迪基睡熟。后来楼下也许有人高声争论，甚至吵了起来，可他什么也没听见。
        - id: ch01-b03
          speaker: narrator
          text: >-
            第二天一早，比尔先生不知从哪里弄来一辆旧式双座婴儿车。车子宽得出奇，迪基猜它原先准是给一对大胖双胞胎坐的。车前绑满了各种形状的疙瘩包袱，里面装着露宿旅人用得上的全部家当。比尔把露天睡觉的地方叫作银月客栈，还说那里的床都有绿色帷幕。
        - id: ch01-b04
          speaker: dickie
          text: 车前那些大大小小的包袱，装的都是什么？座位上那个软绵绵的呢？
        - id: ch01-b05
          speaker: mr_beale
          text: >-
            全是咱们路上要用的家当。座位上的是衣裳。我还给你买了件小外套，晚上冷了、下雨了都能穿。你走累的时候，这辆车就是你的马车。你坐在上头，神气得像伦敦市长，我来给你当马。包袱搁在你膝头，就像抱着个胖娃娃。说真的，伙计，我好像越来越喜欢你啦。
        - id: ch01-b06
          speaker: dickie
          text: 我也越来越喜欢您，这我知道。
        - id: ch01-b07
          speaker: narrator
          text: >-
            迪基撑稳拐杖，把手放进比尔先生手里。比尔低头看看那只小手，一下不知该说什么才好。
        - id: ch01-b08
          speaker: mr_beale
          text: 老天作证！你走路的时候，腿疼不疼？
        - id: ch01-b09
          speaker: dickie
          text: 没去医院以前更疼。他们说，穿着那只讨厌的靴子就能走好，可那东西疼起来比什么都厉害。
        - id: ch01-b10
          speaker: mr_beale
          text: 那就累了告诉我，我让你坐车。
        - id: ch01-b11
          speaker: dickie
          text: 啊，您看那些花！
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: >-
            比尔说那只是野草。其实，那些花是旋花。粉红的小花贴着干燥的路边生长，水草地里的白花则缠在茂密的柳条和柳树间。迪基采了满满两手，比尔也没拦他。
        - id: ch01-b13
          speaker: mr_beale
          text: 它们一会儿就谢了。
        - id: ch01-b14
          speaker: dickie
          text: 可只要它们还活着，我就能拥有它们。
        - id: ch01-b15
          speaker: narrator
          text: >-
            这话，他从前也曾对当铺老板说过。那一天，对德特福德来的小男孩来说，乡间的一切都是魔法。你从小年年看见的景物，也许早就习以为常，根本不会停下来多看一眼，可迪基却处处看得出神。他看见绿树篱，看见母牛把头伸过篱笆，静静望着路上的人。他听见羊铃叮当，绵羊咩咩地叫。路边的猪圈里，黑猪一面喘气，一面用鼻子拱土，还不停哼哼。它们圆滚滚的身体像涂过黑铅，油亮油亮的。收割后的田野里，短短的麦茬间立着一捆捆真正的大麦，正是隔着三户人家的邻居拿来喂母鸡的那种。他看见林中的浓荫，又看见一道水面突然闪出亮光。远处，棕色高地像把宽阔的肩膀抵在无遮无拦的天空下。云雀的歌声尖细颤动，仿佛一群金丝雀逃出了笼。那辽阔的远方本身也壮丽极了，因为在德特福德，你根本看不见什么远方。一只喜鹊落在树桩上，偏过脑袋，用一只明亮的眼睛打量两位旅人。榉树矮林的枯叶间，又有个长长的东西沙沙游过，最后他们才看清，那竟是一条活生生的蛇。
        - id: ch01-b16
          speaker: narrator
          text: >-
            这一趟路，对迪基来说简直像王家的巡游。他忘了自己的腿瘸，也忘了自己已经逃出家门。早晨想起逃家时，恐惧和良心还轻轻刺过他几下，现在却全没了。他快乐得像一位刚继承领地的王子。最后，反倒是比尔先生先记起，走累的孩子还有马车可坐。
        - id: ch01-b17
          speaker: mr_beale
          text: >-
            进去坐着，你准累坏了。坐着也一样能四处看。我还没见过这么爱东瞧西看的小家伙。嘿，兔子！看见了吗？刚从路上跑过去！
        - id: ch01-b18
          speaker: narrator
          text: >-
            迪基看见了，心里的快乐终于圆满了。那是一只真兔子，正像他幻想中住在自家破兔笼里的兔子。
        - id: ch01-b19
          speaker: dickie
          text: 它逃出来了！咱们快捉住它，带着一起走。
        - id: ch01-b20
          speaker: mr_beale
          text: >-
            它没逃，它本来就是野兔，从没让人捉住过。它和小伙伴住在这儿，住在地洞里。饭自己找，想去哪儿玩也都随它。
        - id: ch01-b21
          speaker: narrator
          text: >-
            迪基听得欢喜极了。比尔说的野兔生活，让他头一次看见了自由是什么模样。
        - id: ch01-b22
          speaker: dickie
          text: 真美啊！我也想做只兔子。
          emotion: happy
        - id: ch01-b23
          speaker: mr_beale
          text: >-
            你还是做我的小家伙好。稳当点儿，伙计！你扭得像一口袋鳗鱼，我还怎么推车？
        - id: ch01-b24
          speaker: narrator
          text: >-
            中午，他们在小树林旁停下，坐在草地上，用树枝生起火，又从包袱里取出煎锅煎鲱鱼。
        - id: ch01-b25
          speaker: dickie
          text: 这比十一月五号还好玩。我真喜欢您。除了我亲爸爸和隔壁的巴克斯特先生，我最喜欢的就是您。
          emotion: happy
        - id: ch01-b26
          speaker: mr_beale
          text: 那就好。
        - id: ch01-b27
          speaker: narrator
          text: >-
            比尔回答得有些不自在。下午，他们走到半山腰，迎面来了一个太太和一个小姑娘。
        - id: ch01-b28
          speaker: mr_beale
          text: >-
            快下车。走得能有多瘸就多瘸。她们要问，你就说从昨晚起什么也没吃，昨晚也只吃了一小块干面包。还有，记得叫我爸爸。
        - id: ch01-b29
          speaker: dickie
          text: 明白！
        - id: ch01-b30
          speaker: narrator
          text: >-
            迪基很喜欢这个游戏，兴致勃勃地把自己的瘸腿夸张了好几分。孩子都爱演戏。比尔越走越慢，等两个人走近，干脆停下，摸了摸帽檐。迪基立刻照着做。
        - id: ch01-b31
          speaker: mr_beale
          text: >-
            太太，能不能赏一点钱，帮我们父子走完这段路？您看，我这小家伙腿是瘸的。这样的孩子，要过日子可真难啊。
        - id: ch01-b32
          speaker: lady
          text: 他应该在家里陪着母亲。
        - id: ch01-b33
          speaker: narrator
          text: 比尔拿衣袖擦了擦眼睛。
        - id: ch01-b34
          speaker: mr_beale
          text: >-
            他没有母亲了。她忽然受了寒，寒气进了肚子，后来死在济贫医院里。那是三个月前。我们穷得连一小块黑布都买不起，没法替她戴孝。
        - id: ch01-b35
          speaker: narrator
          text: 迪基吸了吸鼻子。
        - id: ch01-b36
          speaker: lady
          text: 可怜的小家伙！你很想母亲，是不是？
        - id: ch01-b37
          speaker: dickie
          text: 是的。可爸爸对我很好。没有爸爸，我根本活不下去。
          emotion: sad
        - id: ch01-b38
          speaker: narrator
          text: 比尔在心里夸了一句：说得漂亮，小家伙！
        - id: ch01-b39
          speaker: mr_beale
          text: >-
            昨晚我们睡在干草垛下面。今晚能睡在哪里，只有仁慈的上天知道，除非哪位好心人肯帮我们一把。
        - id: ch01-b40
          speaker: narrator
          text: 太太伸手去摸钱袋，小姑娘却先问迪基。
        - id: ch01-b41
          speaker: little_girl
          text: 你的玩具都在哪里？
        - id: ch01-b42
          speaker: dickie
          text: 我只有两件，全在家里。有一件是真银的，我爷爷小时候就有了。
        - id: ch01-b43
          speaker: lady
          text: 既然你们有银东西，就不该出来讨钱。
        - id: ch01-b44
          speaker: narrator
          text: 太太合上钱袋，比尔皱起眉头。
        - id: ch01-b45
          speaker: dickie
          text: 那东西拿去当也只值一先令。爸爸知道我有多宝贝它。
        - id: ch01-b46
          speaker: mr_beale
          text: >-
            一先令的确不少。可不管怎么说，我都不能为了那点儿钱，把孩子唯一的快乐夺走。
        - id: ch01-b47
          speaker: narrator
          text: 他说得十分高尚，还慈爱地望了迪基一眼。
        - id: ch01-b48
          speaker: lady
          text: 你真是位慈爱的父亲。
        - id: ch01-b49
          speaker: little_girl
          text: 是啊，妈妈。那我可以把自己的一便士送给他吗？
        - id: ch01-b50
          speaker: narrator
          text: >-
            等那母女俩走远，两位旅人面对面站着，手里多了一便士，还多了整整半克朗。他们互相看看，那眼神就像两个演员演完一出好戏，幕布落下时彼此交换的目光。
        - id: ch01-b51
          speaker: mr_beale
          text: 你那段演得真漂亮。以前做过这个，是不是？
          emotion: happy
        - id: ch01-b52
          speaker: dickie
          text: 从来没有。给，钱在这里。
        - id: ch01-b53
          speaker: mr_beale
          text: >-
            往后就照这样干。你简直是件杰作！要说哪个孩子堂堂正正挣到了钱，那就是你。她拍了拍你的脑袋，啪地就掏出半块银元。这买卖可真不赖！
          emotion: happy
        - id: ch01-b54
          speaker: narrator
          text: >-
            他们继续往山上走，两个人都快活得不能再快活。你已经看见了，他们刚才说的全是假话，又靠这些谎话从好心人手中弄到半克朗外加一便士。可是，他们不但没有为自己的行为害臊，反而觉得那场表演成功极了，正为自己的聪明高兴得浑身冒泡。请你不要因此过分震惊。要记得，他们两个都没有学过更好的活法。对年长的流浪汉来说，乞讨本就是谋生的手段，编谎话也跟走路吃饭一样平常。对年幼的流浪汉来说，刚才发生的一切，不过是一场新鲜、迷人，又令人兴奋的扮演游戏。这样的游戏一路玩下去，到了晚上，他们已经挣到了七先令六便士。
        - id: ch01-b55
          speaker: mr_beale
          text: 咱们花四便士找张床。鲍勃作证，照这样下去，用不了多久，咱们就能坐自己的汽车了。
        - id: ch01-b56
          speaker: dickie
          text: 可您答应过，要睡那张挂着绿色帷幕的床。
        - id: ch01-b57
          speaker: mr_beale
          text: >-
            也许你说得对。钱得留到下雨天再花，今天可半点不像要下雨。我记得镇外不远有个干草垛。走吧，伙计。
        - id: ch01-b58
          speaker: narrator
          text: >-
            迪基头一回睡在了露天。你有没有试过？夜里有许多有趣的小声音，起初会叫人睡不着。树篱里的小野兽在枝叶下窸窣穿行，远处农场的狗一声声叫着，草边有蟋蟀鸣唱，湿地里还有青蛙咕咕回应。周围的黑暗并不空，耳朵总能发现一件新鲜事。清晨，鸟儿又把你唤醒。你把身体暖暖地蜷进干草，抬头看天色一点一点变亮，呼吸那股清冷香甜的空气。看了一阵，你又舒舒服服睡过去，心里还在奇怪，自己从前怎么能夜夜躺在那种封闭的盒子里。那种盒子只在墙上挖几个窟窿，我们却把它叫作房屋。
        - id: ch01-b59
          speaker: narrator
          text: >-
            他们继续乞讨，还编出各种故事，去打动那些值得开口求助的人。一天又一天，一个星期又一个星期，迪基越演越熟练，比尔先生佩服得目瞪口呆，总说自己从没见过这么能干的小家伙。
        - id: ch01-b60
          speaker: narrator
          text: >-
            等他们快走到海斯，一个红胡子男人突然从树篱中站起身。他说，自己这一个星期一直时来时去，专等他们露面。比尔不愿让迪基听接下来的话，便叫孩子去田里找蘑菇。那片田里其实根本不长蘑菇。迪基走开以后，比尔才跟红胡子男人单独谈起来。
        - id: ch01-b61
          speaker: mr_beale
          text: 以前来不了，我找不到小孩。
        - id: ch01-b62
          speaker: jim
          text: 他腿瘸，派不上用场。
        - id: ch01-b63
          speaker: mr_beale
          text: >-
            派不上用场？你懂什么！他是个奇才，哄那些太太就像翻手掌一样容易。他聪明得像条训练过的狗，还全是自己琢磨出来的。路上听他说话，比看一场戏还值。说真的，我也许该继续赶路，离你这种老手远一点儿，吉姆。
        - id: ch01-b64
          speaker: jim
          text: 看来混得不错？
        - id: ch01-b65
          speaker: mr_beale
          text: >-
            还过得去，总能混到饭吃。只是他脸越来越红，人也越来越胖。再这么下去，人家很快就不肯给钱了。
        - id: ch01-b66
          speaker: jim
          text: 那就饿他几顿。
        - id: ch01-b67
          speaker: narrator
          text: 比尔笑了笑，又若有所思地吐了口唾沫。
        - id: ch01-b68
          speaker: mr_beale
          text: >-
            说来也怪，虽说会坏了买卖，我还是喜欢看这小鬼吃饱。他胖一点不要紧，聪明能补回来。你真该听听他说话！
        - id: ch01-b69
          speaker: narrator
          text: 比尔翻来覆去说个不停，终于惹恼了吉姆。
        - id: ch01-b70
          speaker: jim
          text: 我看你是迷上这个小瘸子了。以前可没见你对谁这样。
        - id: ch01-b71
          speaker: mr_beale
          text: >-
            我只是喜欢他聪明，可不是糊里糊涂疼上他。他的确太聪明了。
        - id: ch01-b72
          speaker: jim
          text: 但愿他聪明得懂得听话。最要紧的，是把嘴闭严。
        - id: ch01-b73
          speaker: mr_beale
          text: >-
            什么事都难不倒他，嘴也严得像封了蜡。他把一件银玩具藏在什么地方，那东西当了也只值一先令。我们好得不能再好，他整天说个不停，可你猜他肯不肯告诉我藏在哪儿？半个字也没漏过。
        - id: ch01-b74
          speaker: jim
          text: >-
            行了，我不想再听你说他。他靠得住，我就用他。靠不住，我就收拾他。现在说正事，把这桩活定下来。我把图画好了，这活再容易不过，星期二动手正合适。爱德华·塔尔博特爵士出国养病了，下个月底才回家。咱们正好送他一个惊喜。你得把小孩教会。艾布拉姆斯星期一到。还有一件事……
        - id: ch01-b75
          speaker: narrator
          text: >-
            吉姆把声音压成耳语。迪基空手回来时，红胡子男人已经走了。
        - id: ch01-b76
          speaker: mr_beale
          text: >-
            刚才那个人，你看见了吧？不，你没看见。要是有人问起来，你这辈子从没见过他。也许在人堆里擦肩而过，可你根本记不住。明白吗？
        - id: ch01-b77
          speaker: dickie
          text: 明白。
        - id: ch01-b78
          speaker: mr_beale
          text: >-
            咱们一路走来，简直像演了大半出哑剧。现在，咱们要像公爵一样去坐火车，接着还要痛痛快快玩一场。我拿自己的名誉担保！
        - id: ch01-b79
          speaker: dickie
          text: 可不是！
        - id: ch01-b80
          speaker: narrator
          text: >-
            迪基满肚子问题，一个接一个地问。比尔却始终不给正面答案。他一会儿说“等着瞧吧”，一会儿说“再耐心等等”，末了又搬出一句“活得越久，见得越多”。第二天是星期六，他们并没有像公爵一样去坐火车。星期日也没有，因为按照比尔先生给自己定下的生活规矩，这一天必须休息，还得把两个人的衬衫洗干净。
        - id: ch01-b81
          speaker: narrator
          text: >-
            星期一，他们终于乘火车来到一座明亮的海滨小城。人行道铺着红砖，房屋用白石砌成，凸肚窗和阳台都漆成绿色。迪基觉得，那是世上最漂亮的城。他们没有停留，径直走过云雀歌唱的丘陵草地。在一处洼地里，高大坚固的灰色石墙和塔楼忽然出现在眼前。
        - id: ch01-b82
          speaker: dickie
          text: 那是什么？住在里面的是国王吗？
        - id: ch01-b83
          speaker: mr_beale
          text: >-
            那是城堡，跟国王在温莎的城堡一样。不过这里没人住，已经成了废墟。废墟里只有猫头鹰和老鼠。
        - id: ch01-b84
          speaker: dickie
          text: 以前有人住过吗？
        - id: ch01-b85
          speaker: mr_beale
          text: >-
            说不准。仔细想想，当然住过。可你在学校应该学过这些，人们管它叫历史。
        - id: ch01-b86
          speaker: dickie
          text: 您听说过觉醒者赫里沃德吗？他不是您会认识的人，他在历史里。您要听，我可以讲给您。
        - id: ch01-b87
          speaker: mr_beale
          text: 我从前倒认识一个杰克·沃德。
        - id: ch01-b88
          speaker: narrator
          text: >-
            迪基一路讲着觉醒者赫里沃德的故事。婴儿车在路面上颠簸前行，一直等它停进长满浓密荆豆的洼地，故事才算讲完。那里的荆豆枝干又粗又光秃，在两个人头顶交错，像撑起了一片真正的屋顶。他们坐在下面，四周都有枝条遮挡，仿佛住进了一座小小的荆豆房子。第二天早晨，比尔刮了胡子，这是离开伦敦后头一回。迪基替他拿杯子和肥皂，觉得好玩极了。胡子刮净以后，比尔简直像变了个人，这也好玩。接着，他又从包袱里翻出一套完全不同的衣服，穿到身上。这件事最好玩。
        - id: ch01-b89
          speaker: mr_beale
          text: >-
            今天咱们一整天都藏在这里。天黑以后，那个你从没见过的红头发家伙会把你托到一扇装铁栏杆的窗前。你个子小，从栏杆中间钻进去，再像老鼠一样悄悄爬到我教你的地方，把侧门打开。门上有钥匙、链子和底闩。上面的门闩已经锯断，别的地方也上过油。你不会害怕吧？
        - id: ch01-b90
          speaker: dickie
          text: 不会。有什么好怕的？
        - id: ch01-b91
          speaker: mr_beale
          text: 可要是你让人逮住了呢？
        - id: ch01-b92
          speaker: dickie
          text: 什么会逮我？狗吗？
        - id: ch01-b93
          speaker: mr_beale
          text: >-
            没有狗。可能是屋里的男人、女人，或者别的什么人。要是他们抓到你，你怎么说？
        - id: ch01-b94
          speaker: narrator
          text: 迪基认真看着他的脸。
        - id: ch01-b95
          speaker: dickie
          text: 您教我怎么说，我就怎么说。
        - id: ch01-b96
          speaker: narrator
          text: 比尔轻轻一拍大腿。
        - id: ch01-b97
          speaker: mr_beale
          text: >-
            这才是我的小家伙！要是他们抓住你，就照我教的话讲。一有机会，你就溜去火车站。他们要追来，你就说自己要去多佛找父亲。再找机会脱身，回格雷夫森德那所咱们住过的房子。我把车票钱包进腰带里，给你系上。可别告诉任何人你要去格雷夫森德。
        - id: ch01-b98
          speaker: dickie
          text: 要是我没被逮住呢？
        - id: ch01-b99
          speaker: mr_beale
          text: 那你就开门，我和红头发家伙会进去。
        - id: ch01-b100
          speaker: dickie
          text: 进去干什么？
        - id: ch01-b101
          speaker: mr_beale
          text: >-
            他一年前来修水管，落下了几件工具。屋里的人不肯还给他，好说歹说都没用。我们进去就是为了拿回那些工具。
        - id: ch01-b102
          speaker: dickie
          text: 胡扯！我又不是小婴儿。这明明就是入室偷盗。
        - id: ch01-b103
          speaker: mr_beale
          text: >-
            你太爱给事情取难听名字了。别管它是什么，只管做个好孩子，照吩咐办。被抓了，你知道该怎么编。没被抓，就安静躲着，等我们拿着那些水管工的工具出来。
        - id: ch01-b104
          speaker: dickie
          text: 那我被抓时，到底要说些什么？
        - id: ch01-b105
          speaker: mr_beale
          text: >-
            你就说，一个长黑胡子、围红手帕的陌生人在路上抓住你，逼你从窗户爬进去，不答应就揍你。还说你在镇里跟父亲走散了，那个人知道父亲在哪里。看见我，你要装作不认识，那个从没见过的红头发家伙也一样。
        - id: ch01-b106
          speaker: narrator
          text: 比尔低头看着迪基仰起的认真小脸，忽然发现他实在很小。
        - id: ch01-b107
          speaker: mr_beale
          text: >-
            我从前都没留意，你竟是这么小的一个孩子。真能撑得住吗？你要是不想去，就不用去。真的，伙计。
        - id: ch01-b108
          speaker: dickie
          text: >-
            这太了不起了！只有勇敢的骑士才配经历这样的冒险。我要像赫里沃德一样。他穿上陶工的衣服，去见威廉国王。
          emotion: happy
        - id: ch01-b109
          speaker: narrator
          text: 迪基又用上了书本里的腔调。
        - id: ch01-b110
          speaker: mr_beale
          text: >-
            你又来啦。可要是他们逮住你，千万别这么说话，不然绝不会放你走。他们准以为抓到了一个乔装的侯爵。
        - id: ch01-b111
          speaker: narrator
          text: >-
            迪基整天都想着这场大冒险。他没有告诉比尔，自己因为受到信任而多么自豪。仔细一想，做窃贼一定刺激极了。他完全不知道这是坏事，只觉得那是一项快乐又冒险的消遣。迪基钻进浓密的草茎间，查看狐狸走出的小路。比尔则平躺在地上，独自思量。
        - id: ch01-b112
          speaker: mr_beale
          text: >-
            我心里真不大乐意。没错，我找他来就是为了干这个。可他实在是个招人喜欢的小家伙。我不愿他遇上什么事，一点也不愿。
        - id: ch01-b113
          speaker: narrator
          text: >-
            迪基像平常一样脱下靴子睡觉。半夜，比尔把他摇醒，只说时候到了。那夜一丝月光也没有，四周黑得厉害。比尔背起迪基，沿着一条条黑沉沉的道路走了很久。他们从幽暗的树下经过，又穿过看不清边际的草地。一丛黑灌木忽然裂成两半，其中一半竟朝他们走来。迪基吃了一惊，等那影子靠近，才认出是红胡子吉姆。没过多久，另一个男人也从路边沟里钻了出来。四个人爬过一道冰冷潮湿的庄园围栏，贴着高高的围墙内侧，在树木和灌木之间潜行。迪基始终伏在比尔肩头。他怎么也没想到，这个看起来又高大又笨重的男人，竟能把每一步都落得这样轻，几乎没有一点声音。
        - id: ch01-b114
          speaker: narrator
          text: >-
            透过树木和灌丛之间一道道狭窄的缝隙，迪基看见了宽阔的庄园。整片土地像一幅铺展开来的巨大阴影，里面散落着一棵棵树，那些树也只是深浅不一的影子。庄园另一头，一座大宅露出苍白的正面。它只比周围的树稍稍浅一点，所有窗户都是黑的，屋里没有一盏灯。一片小树林正好横在围墙和大宅之间，他们一路借着枝叶的掩护，直到离房子很近，才不得不走出树荫。迪基心跳得飞快。再过一会儿，就该轮到他扮演自己在这场冒险里的角色了。
        - id: ch01-b115
          speaker: mr_beale
          text: 来，接住他。
        - id: ch01-b116
          speaker: narrator
          text: >-
            吉姆伸手把迪基接进怀里，抱着他向大宅走去，另外两个男人则蹲在树林中等待。到了窗边，吉姆将孩子高高举起。迪基赶紧伸手扣住窗台。夜里湿漉漉的，空气中全是泥土和枯叶气味。窗台由石头砌成，摸上去冷得刺手。比尔白天已经把每一步讲过许多遍，迪基清清楚楚知道该做什么。他在宽阔的窗台上坐稳，双手紧握铁栏杆。吉姆拿出糖浆和手帕，悄悄取下一块玻璃。糖浆黏住玻璃，手帕又把它包住，所以没有打碎的声音，也没有碎片落地。迪基从缺口伸手进去，解开窗扣。那扇窗像橱柜门一样向外转开。他先把两只脚穿过栏杆间的窄缝，再将身体一点点滑进屋里。双手仍攀着铁栏，他在黑暗中试探，直到一只脚踩中比尔事先说过的那张桌子，这才从桌面挪到地板。
        - id: ch01-b117
          speaker: dickie
          text: 现在一定得记准该往哪边走。
        - id: ch01-b118
          speaker: narrator
          text: >-
            可是，迪基根本不用回想。他莫名其妙地知道第一扇门在哪里。打开它以后，他又清楚该在哪儿转弯，该穿过哪些走廊，才能到达那扇要替三个男人打开的小侧门。仿佛从前曾在梦里来过。他用双手和一边膝盖爬行，瘸腿拖在身后，安静得像只老鼠。
        - id: ch01-b119
          speaker: narrator
          text: >-
            别以为迪基一点都不怕。他怕得厉害，只是心里的勇敢比害怕还要多，而这才叫真正的勇敢。他努力把呼吸放轻，可心脏跳得又急又响。他几乎相信，屋里只要有人还醒着，就连楼上床铺中的人也会听见。尽管这样，他还是摸到了小侧门。那双灵敏的小手很快找到上足油的门闩，把它无声地推开。接下来是门链。他用手托住松垂的链圈，不让铁链碰撞，再小心地把链头的圆球滑出锁扣。最后只剩一把很大的钥匙。迪基用完好的那边膝盖跪在地上，双手一起握住钥匙，使足力气，终于把它转开。然后，他极轻地压下门把，慢慢往后一拉。门开了。迪基从门板后面爬出去，清凉香甜的夜风立刻扑上他的脸。
        - id: ch01-b120
          speaker: narrator
          text: >-
            直到这时，他才像是第一次知道什么叫寂静，什么叫黑暗。门外是一座封闭的黄杨凉亭，看不见天，也看不清任何形状。他自豪得胸膛快要炸开。这次冒险多么了不起！自己的任务完成得完美无缺，每一步都照吩咐做了，还做得很好。他单脚站着，抓紧门边。直到一道身影擦过，他才知道比尔和另外两个男人已经从门里溜了进去。
        - id: ch01-b121
          speaker: narrator
          text: >-
            就在那一刻，一种最意想不到的感觉忽然涌上来。自豪里面，竟掺进了羞耻。他为自己如此聪明、如此能干而得意，可心底还有另一种自尊，偏偏让这份聪明显得肮脏可耻。迪基强烈又莫名地觉得，他，迪基，根本不该是那种替窃贼开门、放他们进屋的人。那感觉就像你忽然低下头，看见双手沾满了污秽。那不是挖土、赶路留下的老老实实的泥，而是黏糊糊、叫人恶心的脏东西。你怎么也想不通，自己怎么会任由那东西沾到手上，又怎么一直没有察觉。
        - id: ch01-b122
          speaker: narrator
          text: 第三道身影从旁边擦过时，迪基一把抓住了他。
        - id: ch01-b123
          speaker: dickie
          text: 爸爸，别干了。回去吧，我再把门关好。求您了，别干了。
          emotion: fearful
        - id: ch01-b124
          speaker: jim
          text: 闭嘴！再不闭嘴，我就叫你好看！
          emotion: angry
        - id: ch01-b125
          speaker: dickie
          text: 爸爸，别干了。
          emotion: fearful
        - id: ch01-b126
          speaker: narrator
          text: 吉姆的威胁反倒叫迪基更加坚持。
        - id: ch01-b127
          speaker: mr_beale
          text: 我不能丢下伙伴回头。这个道理你明白，对吧？
        - id: ch01-b128
          speaker: narrator
          text: >-
            迪基明白。冒险既然已经开始，就停不下来了。按诺福克人的说法，东西已经盛到盘里，只能把它吃掉。他缩在门后，听着三个男人的脚步沿石板走廊渐渐远去。他们在靴子外套着羊毛袜，走起来轻得像软绵绵的猫爪。细微的沙沙声终于消失，四下又黑又静。迪基早过了平日睡觉的钟点，刚才那番行动又耗尽精神，几乎就要睡着。
        - id: ch01-b129
          speaker: narrator
          text: >-
            突然，一声雷鸣般的炸响惊得他睁大眼睛。楼梯上响起靴子的脚步，有人跌跌撞撞地飞奔下来，从他身边冲过去。第二声尖响过后，亮光一闪，像一道很小的闪电。有人绊倒了，一阵水桶翻落似的哐啷声中，一件又硬又滑的东西撞上迪基的膝头。又一个人冲进夜色。接着还有一个。不，这回传来的是女人的声音。
        - id: ch01-b130
          speaker: eleanor
          text: 爱德华，不许去！让他们走！你不能追。不行！
          emotion: fearful
        - id: ch01-b131
          speaker: narrator
          text: >-
            刺眼的灯光忽然亮起。一个身穿白衣、手提油灯的高个儿太太飞奔下楼，抓住一个从黑暗中跃进灯光的男人。
        - id: ch01-b132
          speaker: eleanor
          text: 拿着灯。
        - id: ch01-b133
          speaker: narrator
          text: >-
            她把灯塞给他，以惊人的速度插上门闩，扣紧链子，锁好门。转过身时，她发现了迪基。
        - id: ch01-b134
          speaker: eleanor
          text: 这是什么？爱德华，快来，这里还有一个！怎么会……是个孩子！
          emotion: surprised
        - id: ch01-b135
          speaker: narrator
          text: >-
            更多人举着蜡烛从楼上赶下来，兴奋的说话声也随着他们一起涌进走廊。那些人身上穿着颜色鲜亮的古怪衣裳。迪基从来没见过晨衣，自然不知道那是什么。眼前的人影忽然以一种奇怪的方式摇晃起来，接着一个个绕着圈子转，像一群陀螺。后面的事，他便不记得了。等记忆重新接上，他已经身处另一个房间。屋里似乎挤满了人，点满了灯，四周还摆着他从未见过的漂亮家具。有人托着一只小玻璃杯，正往他嘴边送。杯里的东西散发出一股酒馆才有的气味，实在难闻。
        - id: ch01-b136
          speaker: dickie
          text: 不要！
        - id: ch01-b137
          speaker: eleanor
          text: 好些了吗？
        - id: ch01-b138
          speaker: narrator
          text: >-
            迪基惊讶地发现，自己正坐在太太膝上。他想挺身坐起，却又躺了回去。这样实在舒服，他从不知道人的膝头也能这么舒服。
        - id: ch01-b139
          speaker: dickie
          text: 好多了，谢谢您。
        - id: ch01-b140
          speaker: sir_edward
          text: 现在，年轻人，老实告诉我们。你是怎么进来的？是谁让你来的？
        - id: ch01-b141
          speaker: dickie
          text: 我从男管家的餐具室窗户爬进来。
        - id: ch01-b142
          speaker: narrator
          text: >-
            迪基自己也奇怪，怎么会知道那是男管家的餐具室。肯定没人告诉过他。严厉声音的主人头发蓬乱，穿着一套宽松得出奇的粉红法兰绒衣服，上面还有军服似的绳饰。
        - id: ch01-b143
          speaker: sir_edward
          text: 进来干什么？
        - id: ch01-b144
          speaker: dickie
          text: 为了放……
        - id: ch01-b145
          speaker: narrator
          text: >-
            迪基停住了。别人仔细教过他怎样应付这一刻，他得先想清楚该说什么。
        - id: ch01-b146
          speaker: eleanor
          text: 没事的。可怜的小家伙，别害怕，没人会伤害你。
          emotion: calm
        - id: ch01-b147
          speaker: dickie
          text: 我不害怕，现在已经不怕了。
        - id: ch01-b148
          speaker: eleanor
          text: 你说，为了放谁进来？
        - id: ch01-b149
          speaker: dickie
          text: 为了放那个人进来。
        - id: ch01-b150
          speaker: eleanor
          text: 什么人？
        - id: ch01-b151
          speaker: dickie
          text: 我不知道。
        - id: ch01-b152
          speaker: sir_edward
          text: 他们有三四个。不，四五个……
        - id: ch01-b153
          speaker: eleanor
          text: 到底是什么人，孩子？
        - id: ch01-b154
          speaker: dickie
          text: >-
            那个人说，他知道我爸爸在哪里，所以我跟他走了。到了树林里，他威胁我，说不从窗户爬进来开门，就狠狠揍我。他还说，有些工具落在这里，你们不肯还给他。
        - id: ch01-b155
          speaker: eleanor
          text: 你看，这孩子根本不知情。他完全是无辜的。
        - id: ch01-b156
          speaker: narrator
          text: >-
            埃莉诺无比温柔地吻了吻迪基的头发。迪基忽然觉得喉咙像被什么堵住，脑袋胀得快要炸开，耳朵滚烫，手脚却冰凉。他当时还不明白这是为什么。
        - id: ch01-b157
          speaker: dickie
          text: 我明明知道。要不是自己愿意，我根本不用来。
        - id: ch01-b158
          speaker: eleanor
          text: 他发烧了，自己说什么都不知道。你看，他的脸多红。
        - id: ch01-b159
          speaker: dickie
          text: 我就是愿意来的。我以为会很好玩，其实也的确很好玩。
        - id: ch01-b160
          speaker: narrator
          text: >-
            迪基等着挨一顿摇晃，再让人放到地上。他还想着自己的拐杖。比尔一直把它夹在腋下，没有拐杖，他怎么回格雷夫森德？可埃莉诺没有摇晃他，也没有把他放下。她把孩子紧紧抱进怀里，站了起来。
        - id: ch01-b161
          speaker: eleanor
          text: 我要带他去睡觉。今晚不许再问了，明早有的是时间。
        - id: ch01-b162
          speaker: narrator
          text: >-
            她抱着迪基走出客厅，离开满屋的人，来到一间宽敞的卧室。墙壁是蓝色的，窗帘和床幔蓝灰相间，屋里的每件家具都美得出奇。一张高大的四柱床挂着蓝色绸帷，床上的枕头多得数不清，比迪基一辈子见过的枕头全加起来还多。埃莉诺在一只大脸盆里盛来香气甜美的水，替他擦洗干净。脸盆上绘着蓝色和金色的花。然后，她给孩子套上一件镶花边的睡袍。那睡袍准是她自己的，因为它实在太宽大了，不可能是给任何小男孩穿的。
        - id: ch01-b163
          speaker: narrator
          text: >-
            她把迪基放进温暖柔软的大床，那床像巨人的枕头。她替他掖好被子，又亲亲他。迪基伸出细瘦的胳膊，搂住她的脖子。
        - id: ch01-b164
          speaker: dickie
          text: 我真喜欢您，可是我想要爸爸。
          emotion: sad
        - id: ch01-b165
          speaker: eleanor
          text: >-
            他在哪里？不，留到明早再告诉我。先把这杯牛奶喝掉，然后安安稳稳睡一觉。一切都会好起来的，亲爱的。
          emotion: calm
        - id: ch01-b166
          speaker: narrator
          text: 牛奶盛在一只带闪亮花纹的玻璃杯中，埃莉诺早已准备好了。
        - id: ch01-b167
          speaker: dickie
          text: 愿上天保佑您，慷慨的恩人女士！
        - id: ch01-b168
          speaker: narrator
          text: 迪基困得迷迷糊糊，又说起了书本里的话。
        - id: ch01-b169
          speaker: eleanor
          text: >-
            真是个非同寻常的孩子。我怎么也想不起他究竟像谁。其他人呢？
        - id: ch01-b170
          speaker: narrator
          text: 她回到丈夫身边，爱德华爵士回答她。
        - id: ch01-b171
          speaker: sir_edward
          text: >-
            我让他们全去睡了。现在也没什么可做。我们刚才本该追上那些人。
        - id: ch01-b172
          speaker: eleanor
          text: 可他们什么也没拿走。
        - id: ch01-b173
          speaker: sir_edward
          text: >-
            是没拿走。我开枪以后，他们把东西全丢下了。来吧，咱们也去睡。可怜的埃莉诺，你准累坏了。
        - id: ch01-b174
          speaker: eleanor
          text: >-
            爱德华，我真希望我们能收养那个小男孩。我敢肯定，他出身体面人家。也许是被人拐走了，或者遇上了别的事。
        - id: ch01-b175
          speaker: sir_edward
          text: 别做可爱的傻姑娘啦！
        - id: ch01-b176
          speaker: narrator
          text: >-
            那一夜，迪基睡在最上等的细麻床单里，床单还带着薰衣草的香气。他的身体深深陷进一大堆柔软的枕头，仿佛陷进了轻暖的羽绒。身上盖着的也是鸭绒被，被面由缎子做成，上面开满蓝色花朵。那张大床连床尾板都十分气派，木板中央雕着一面盾牌，盾牌上又雕着一条高大的狗。
        - id: ch01-b177
          speaker: narrator
          text: >-
            再看看迪基自己的衣服吧。那一小堆衣裤满是一路带来的尘土，又破又旧，此刻凄凄凉凉地躺在一把高大庄严的椅子上。椅面和椅背都蒙着华美的挂毯，那堆衣服落在上面，越发显得孤零零的。迪基本人却什么也不知道。他沉沉地睡着了。梦里的景象一个接一个。他回到比尔先生身边，回到那座由粗壮枝条遮成的荆豆小屋，也回到银月客栈那张挂着绿色帷幕的床。
