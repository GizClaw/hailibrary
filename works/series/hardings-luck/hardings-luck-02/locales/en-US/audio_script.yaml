  chapters:
    - id: ch01
      title: Burglars
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Dickie fell asleep between clean, coarse sheets in a hard, narrow bed that had cost fourpence. Mr. Beale's last bit of fatherly advice was to tuck his clothes beneath the pillow, and put his boots there too. Before bed, there had been a bath, or at least something that cleaned him just as well. He washed in a pail close to the fire. All around it, friendly ragged travelers cooked herrings, sausages, and other wonderful things. They used little pans and gridirons that unrolled from the strange bundles they carried as luggage. One man owned no gridiron at all, so he cooked his steak with the kitchen tongs. Dickie thought that wonderfully clever. A very fat woman asked him to toast her herring on a piece of wood. When he finished, she paid him with two green apples.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Lying in bed, Dickie listened to cheerful voices talking and singing in the kitchen below. Being a tramp seemed very pleasant, and the tramps seemed the jolliest company in the world. All of these agreeable people were on the road. This place, with its warm kitchen, friendly crowd, and clean fourpenny beds, was a travelers' hotel. There were many like it scattered around the country, though grown-ups called them common lodging houses. The singing and laughter continued long after Dickie fell asleep. Later, some voices rose in arguments, and perhaps there were even quarrels. Dickie heard none of them.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Early the next morning, he and Mr. Beale took to the road. From some mysterious source, Mr. Beale had found an old double baby carriage. It must once have belonged to a pair of very fat twins, Dickie thought, because it was so wide and roomy. Mr. Beale had arranged strange, knobbly bundles of every shape across its front. The pile looked artfully planned. It held all the furniture needed by travelers who meant to sleep each night at the Inn of the Silver Moon. That was Mr. Beale's name for sleeping outdoors, where the beds all had green curtains.
        - id: ch01-b04
          speaker: dickie
          text: "What's in all those bundles tied on the front?"
        - id: ch01-b05
          speaker: mr_beale
          text: "All the gear we'll need along the road."
        - id: ch01-b06
          speaker: dickie
          text: "What about that soft bundle on the seat?"
        - id: ch01-b07
          speaker: mr_beale
          text: >-
            That's our clothes. I bought you a little jacket for cold or wet nights. And when your leg gets tired, here's your own carriage. You can ride like the Lord Mayor while I play horse, with the bundles on your knees like a fat baby. Tell you what, mate. Seems I've taken a fancy to you.
        - id: ch01-b08
          speaker: dickie
          text: "I know I've taken a fancy to you."
        - id: ch01-b09
          speaker: narrator
          text: >-
            Dickie planted his crutch firmly and slipped his hand into Mr. Beale's. Mr. Beale looked down at that small hand and seemed to have no idea what to say.
        - id: ch01-b10
          speaker: mr_beale
          text: "Well, strike me! Does walking hurt you?"
        - id: ch01-b11
          speaker: dickie
          text: >-
            Not like before the hospital. They said I'd walk properly if I wore that horrible boot, but the boot hurts worse than anything.
        - id: ch01-b12
          speaker: mr_beale
          text: "Then call out when you're tired, and I'll give you a ride."
        - id: ch01-b13
          speaker: dickie
          text: "Oh, look at the flowers!"
          emotion: happy
        - id: ch01-b14
          speaker: mr_beale
          text: "Those are only weeds."
        - id: ch01-b15
          speaker: narrator
          text: >-
            They were little pink convolvuluses, their leaves and curling stems pressed against the dry roadside. Down in a water meadow, large white ones climbed among the thick willows and osiers. Dickie filled both hands with pink flowers, and Mr. Beale let him.
        - id: ch01-b16
          speaker: mr_beale
          text: "They'll be dead in no time."
        - id: ch01-b17
          speaker: dickie
          text: "But I'll have them while they're alive."
        - id: ch01-b18
          speaker: narrator
          text: >-
            Everything that day seemed like magic to the little boy from Deptford. There were green hedges, with cows leaning over as if they wanted to watch the road. Sheep bells tinkled, sheep called, and black pigs rooted and grunted in a pen close by. Their round shining bodies looked as though someone had polished them. Across the stubbly fields, barley stood gathered in sheaves. This was real barley, the very thing the people three doors away gave their hens. He passed through cool woodland shadows and caught sudden flashes of water. Brown hills pushed their shoulders against the open sky. High above, a skylark sang with a sharp thrill, like a canary that had escaped its cage. There was distance everywhere, and in Deptford you never saw distance at all. A magpie perched on a stump and watched the travelers with one bright eye. Then something rustled for a long way beneath dead leaves in a beech wood. It was a real living snake.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Every sight and sound made the journey feel like a royal procession to Dickie of Deptford. These were ordinary country things, the sort you might hardly notice after seeing them every year of your life. Dickie had never known them, so every one was marvelous. He forgot his lame foot completely. He even forgot that he had run away. Earlier that morning, remembering it had given him one or two sharp twinges of fear or conscience, but now those were gone. He was as happy as a prince arriving at his inheritance. In the end, Mr. Beale was the first to remember that a tired little boy had a carriage waiting for him.
        - id: ch01-b20
          speaker: mr_beale
          text: >-
            In you get. You'll wear yourself out. You can see just as well sitting down. Never knew a youngster who noticed so much. Look there! A rabbit crossed the road. Did you see him?
        - id: ch01-b21
          speaker: narrator
          text: >-
            Dickie saw it, and that crowned his happiness. It was a real rabbit, like the rabbits he had imagined in the ruined hutch at home.
        - id: ch01-b22
          speaker: dickie
          text: "It's escaped! Let's catch it and bring it with us."
        - id: ch01-b23
          speaker: mr_beale
          text: >-
            He hasn't escaped. He's wild and has never been caught. He lives out here with his little friends in holes under the ground. Finds his own dinner and amuses himself however he likes.
        - id: ch01-b24
          speaker: dickie
          text: "How beautiful! I wish I were a rabbit."
          emotion: happy
        - id: ch01-b25
          speaker: mr_beale
          text: >-
            You're better off as my little lad. Hold still, mate. How can I push this blessed carriage when you're wriggling like a sack of eels?
        - id: ch01-b26
          speaker: narrator
          text: >-
            At midday they camped beside a small wood. They sat on the grass, built a fire from sticks, and fried herrings in a pan from one of the knobbly bundles.
        - id: ch01-b27
          speaker: dickie
          text: >-
            This is better than the fifth of November. And I do like you. I like you next after my own daddy and Mr. Baxter next door.
          emotion: happy
        - id: ch01-b28
          speaker: mr_beale
          text: "That's all right."
        - id: ch01-b29
          speaker: narrator
          text: >-
            Mr. Beale answered awkwardly. Later that afternoon, when they were halfway up a hill, a lady and a little girl appeared over the crest.
        - id: ch01-b30
          speaker: mr_beale
          text: >-
            Out you get, quick. Limp as hard as you can. If they ask, say you've eaten nothing since last night, and that was only dry bread. And mind you call me Father.
        - id: ch01-b31
          speaker: dickie
          text: "Right you are."
        - id: ch01-b32
          speaker: narrator
          text: >-
            Dickie made his limp much worse with great enthusiasm. It was acting, and children love to act. Mr. Beale slowed down more and more. When the lady and girl came near, he stopped and touched his cap. Dickie copied him at once.
        - id: ch01-b33
          speaker: mr_beale
          text: >-
            Could you spare us a little something, ma'am, to help us along? My boy is lame, as you can see. The road is a hard life for a child like him.
        - id: ch01-b34
          speaker: lady
          text: "He ought to be home with his mother."
        - id: ch01-b35
          speaker: narrator
          text: "Mr. Beale wiped his coat sleeve across his eyes."
        - id: ch01-b36
          speaker: mr_beale
          text: >-
            He has no mother. She took ill very suddenly. A chill struck her inside, and she died in the infirmary three months ago. We couldn't even afford a scrap of mourning black for her.
        - id: ch01-b37
          speaker: narrator
          text: "Dickie sniffed."
        - id: ch01-b38
          speaker: lady
          text: "Poor little fellow. You miss your mother, don't you?"
        - id: ch01-b39
          speaker: dickie
          text: "Yes, but Father is very good to me. I couldn't manage without him."
          emotion: sad
        - id: ch01-b40
          speaker: narrator
          text: >-
            Mr. Beale privately admired that performance. Then he told the lady they had slept beneath a haystack and had no idea where they would sleep that night unless some kind person helped them. The lady reached into her pocket. Meanwhile, the little girl looked at Dickie.
        - id: ch01-b41
          speaker: little_girl
          text: "Where are all your toys?"
        - id: ch01-b42
          speaker: dickie
          text: >-
            I've only got two, and they're at home. One is real silver. My grandfather had it when he was a boy.
        - id: ch01-b43
          speaker: lady
          text: "If you own silver, you shouldn't be begging."
        - id: ch01-b44
          speaker: narrator
          text: "She began to close her purse, and Mr. Beale frowned."
        - id: ch01-b45
          speaker: dickie
          text: "It only brings a shilling at the pawnshop, and Father knows how much I treasure it."
        - id: ch01-b46
          speaker: mr_beale
          text: >-
            A shilling is plenty, I grant you. But I wouldn't take away the boy's one little pleasure. No, not even for a shilling.
        - id: ch01-b47
          speaker: narrator
          text: "He finished grandly and gave Dickie a loving look."
        - id: ch01-b48
          speaker: lady
          text: "You are a kind father."
        - id: ch01-b49
          speaker: little_girl
          text: "Isn't he, Mother? May I give the little boy my penny?"
        - id: ch01-b50
          speaker: narrator
          text: >-
            At last, the lady and girl continued down the hill. The two travelers stood facing one another. They were richer by the little girl's penny and, what wonderful good fortune, a whole half-crown from her mother. Neither spoke for a moment. They only exchanged the look two actors might share when the curtain falls and they know the play has been a complete success.
        - id: ch01-b51
          speaker: mr_beale
          text: "You played that beautifully. You've done this before, haven't you?"
        - id: ch01-b52
          speaker: dickie
          text: "Never. Here's the penny."
        - id: ch01-b53
          speaker: mr_beale
          text: >-
            Keep it. You're a real masterpiece, you are. You earned every bit honestly. She pats you on the head, then out comes half a crown! That's what I call first-rate.
          emotion: happy
        - id: ch01-b54
          speaker: narrator
          text: >-
            They climbed the hill as happy as anyone could wish to be. Now, they had told lies. Those lies had taken half a crown and a penny from people who meant to be charitable. Yet neither traveler felt ashamed. They bubbled over with delight at how clever they had been. Try not to be too shocked with them. Neither one knew any better. To the older tramp, begging and lying were simply the ordinary tools of his trade. To the little tramp, the whole performance was new, exciting, and no more wicked than a wonderful game of make-believe.
        - id: ch01-b55
          speaker: narrator
          text: "By evening, they had seven shillings and sixpence."
        - id: ch01-b56
          speaker: mr_beale
          text: >-
            We'll spend fourpence on a bed. At this rate, we'll own a motorcar before we know it.
        - id: ch01-b57
          speaker: dickie
          text: "But you promised the bed with green curtains."
        - id: ch01-b58
          speaker: mr_beale
          text: >-
            Maybe you're right. Better save for a rainy day, and this certainly isn't one. I remember a haystack just outside town. Come on, mate.
        - id: ch01-b59
          speaker: narrator
          text: >-
            So Dickie slept outdoors for the first time. Have you ever tried it? The night is full of small, interesting sounds, and at first they will not let you sleep. Little wild creatures rustle in the hedges. Dogs bark from farms far away. Crickets chirp, and frogs answer with their croaking. Then morning comes, and the birds wake you. You curl deeper into the warm hay and look up while the sky grows lighter and lighter. You breathe the cold, sweet air and drift to sleep again, wondering how you ever managed to spend your nights shut inside one of those boxes with holes that people call houses.
        - id: ch01-b60
          speaker: narrator
          text: >-
            The new game continued merrily from one day to the next, and then from week to week. Dickie and Mr. Beale begged from people who looked worth asking. For each one, they invented the sort of story most likely to touch the listener. Every performance gave Dickie more practice. Before long, he could take his part so cleverly that Mr. Beale was left staring at him in admiration.
        - id: ch01-b61
          speaker: mr_beale
          text: "Bless me if I ever saw another youngster like you."
        - id: ch01-b62
          speaker: narrator
          text: >-
            This went on until they were nearly at Hythe. There, a red-whiskered man suddenly rose from behind a hedge and announced that he had been waiting for them, now and then, for almost a week. Mr. Beale immediately sent Dickie into a field to search for mushrooms. No mushrooms grew in that field, but finding them was not the point. Mr. Beale wanted Dickie far enough away for a private talk with the red-whiskered man.
        - id: ch01-b63
          speaker: jim
          text: "I couldn't get here sooner. I couldn't find a youngster."
        - id: ch01-b64
          speaker: mr_beale
          text: "This one limps. He won't be any use."
        - id: ch01-b65
          speaker: narrator
          text: "That was what Jim thought, but Mr. Beale quickly set him right."
        - id: ch01-b66
          speaker: mr_beale
          text: >-
            No use? Shows what you know. He's a wonder, and that's the truth. He can twist the ladies around his finger as easy as anything. Clever as a trained dog, all out of his own head. You should hear his talk on the road. Sometimes I think I'd better stay there with him and keep away from old hands like you, Jim.
        - id: ch01-b67
          speaker: jim
          text: "Doing well, are you?"
        - id: ch01-b68
          speaker: mr_beale
          text: >-
            We manage. He's getting red in the face and filling out, though. Soon people will say he doesn't need their money.
        - id: ch01-b69
          speaker: jim
          text: "Then starve him a little."
        - id: ch01-b70
          speaker: narrator
          text: "Mr. Beale laughed, spat, and then grew thoughtful."
        - id: ch01-b71
          speaker: mr_beale
          text: >-
            Funny thing is, I like seeing the little rascal eat, even if it hurts business. If he gets plump, his cleverness makes up for it. You ought to hear him.
        - id: ch01-b72
          speaker: narrator
          text: "Mr. Beale went on so long that Jim lost his patience."
        - id: ch01-b73
          speaker: jim
          text: "Sounds to me as if you've gone soft over this extra youngster. Never knew you to do that before."
        - id: ch01-b74
          speaker: mr_beale
          text: >-
            It's his cleverness I like. I'm not being foolish over him. He's just so clever.
        - id: ch01-b75
          speaker: jim
          text: "I hope he's clever enough to obey orders and keep his mouth shut. That's all."
        - id: ch01-b76
          speaker: mr_beale
          text: >-
            He's clever enough for anything and close as wax. He's hidden a silver toy somewhere. It would pawn for a shilling, but do you think he'll tell me where it is? Not him. We're the best of pals and he talks all day, but he's never let that secret slip.
        - id: ch01-b77
          speaker: jim
          text: >-
            Enough about him. If he's loyal, he'll suit me. If he isn't, I'll deal with him. Now let's settle this job. I've drawn the plan, and it's as easy as they come. Tuesday should do. Sir Edward Talbot is abroad for his health and won't return until the end of next month. We'll leave him a surprise. You'll come by train. Abrams will be there Monday. Now listen.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Jim dropped his voice to a whisper. When Dickie came back without mushrooms, the red-whiskered man had gone.
        - id: ch01-b79
          speaker: mr_beale
          text: >-
            See that fellow just now? Well, you never saw him. If anybody asks, you've never laid eyes on him in your life. Maybe you passed him in a crowd, but you don't remember. Understand?
        - id: ch01-b80
          speaker: dickie
          text: "Yes, I understand."
        - id: ch01-b81
          speaker: mr_beale
          text: >-
            You and me on the road haven't had half a fine show. Now we'll ride the train like dukes. After that, we'll have a grand old time. I give you my word.
        - id: ch01-b82
          speaker: dickie
          text: "Haven't we just!"
        - id: ch01-b83
          speaker: narrator
          text: >-
            Dickie was full of questions, but Mr. Beale would answer none of them. He told the boy to wait a little, hold on, and remember that those who lived longest saw the most. They did not take the train the next day, because that was Saturday. They did not take it on Sunday either. Sunday was for resting and washing their shirts, according to Mr. Beale's rule of life. On Monday at last, they rode the train like dukes. It carried them to a bright town beside the sea. Red bricks paved the streets. The houses were white stone, with green bow windows and balconies. Dickie decided it was the prettiest town in all the world. They did not stay there, though. They walked away across the rolling downs while skylarks sang above them.
        - id: ch01-b84
          speaker: narrator
          text: >-
            They walked out over downs where skylarks sang. In a hollow ahead stood strong gray walls and towers.
        - id: ch01-b85
          speaker: dickie
          text: "What's that?"
        - id: ch01-b86
          speaker: mr_beale
          text: "A castle, like the King's castle at Windsor."
        - id: ch01-b87
          speaker: dickie
          text: "Does a king live here?"
        - id: ch01-b88
          speaker: mr_beale
          text: "Nobody lives there. It's a ruin. Only owls and rats live in ruins."
        - id: ch01-b89
          speaker: dickie
          text: "Did people ever live there?"
        - id: ch01-b90
          speaker: mr_beale
          text: >-
            I shouldn't wonder. Of course they must have, now I think of it. You learned all that at school. They call it history.
        - id: ch01-b91
          speaker: dickie
          text: "Did you ever hear of Hereward?"
        - id: ch01-b92
          speaker: mr_beale
          text: "I knew a Jake Ward once."
        - id: ch01-b93
          speaker: dickie
          text: "Hereward the Wake. He's in history, not someone you'd know. I can tell you about him."
        - id: ch01-b94
          speaker: narrator
          text: >-
            Dickie began telling the story of Hereward the Wake, and kept going as the carriage jolted onward. The tale lasted until Mr. Beale steered them into a hollow among thick furze bushes. Beneath the bushes, the bare heavy stems crossed one another and held the green growth above their heads like a roof. When Dickie and Mr. Beale sat underneath, it felt as though they had found a little house made entirely of furze.
        - id: ch01-b95
          speaker: narrator
          text: >-
            The next morning, Mr. Beale shaved for the first time since leaving London. Dickie held the mug and soap, and thought it great fun to watch him become a different-looking man. Then Mr. Beale pulled a different suit of clothes from the bundles. That was even better fun.
        - id: ch01-b96
          speaker: mr_beale
          text: >-
            We'll stay hidden here all day. This evening, we'll have our adventure. That redheaded fellow you never saw will lift you to a barred window. You're small enough to creep through. Move as quietly as a mouse, follow the way I show you, and open the side door. There's a key, a chain, and one bolt at the bottom. The top bolt has been cut, and everything else is oiled. That doesn't frighten you, does it?
        - id: ch01-b97
          speaker: dickie
          text: "No. Why should it?"
        - id: ch01-b98
          speaker: mr_beale
          text: "Well, suppose you got caught?"
        - id: ch01-b99
          speaker: dickie
          text: "Caught by what? A dog?"
        - id: ch01-b100
          speaker: mr_beale
          text: >-
            There won't be a dog. I mean a man or lady in the house. If somebody grabbed you, what would you say?
        - id: ch01-b101
          speaker: narrator
          text: "Dickie studied Mr. Beale's face carefully."
        - id: ch01-b102
          speaker: dickie
          text: "Whatever you tell me to say."
        - id: ch01-b103
          speaker: narrator
          text: "Mr. Beale gave his leg a pleased little slap."
        - id: ch01-b104
          speaker: mr_beale
          text: >-
            That's you all over. If they catch you, tell them what I say. Slip away at the first chance and go to the station. If anyone follows, say you're going to your father in Dover. Then get away and meet me at the house where we slept in Gravesend. Your ticket money will be in this belt around you. Don't tell a soul you're bound for Gravesend.
        - id: ch01-b105
          speaker: dickie
          text: "And if nobody catches me?"
        - id: ch01-b106
          speaker: mr_beale
          text: "Open the door, and the redheaded man and I will come inside."
        - id: ch01-b107
          speaker: dickie
          text: "What for?"
        - id: ch01-b108
          speaker: mr_beale
          text: >-
            He left some tools there when he did a plumbing job last year. They won't give them back fairly, so we're fetching them.
        - id: ch01-b109
          speaker: dickie
          text: "Nonsense. I'm not a baby. You're going burgling."
        - id: ch01-b110
          speaker: mr_beale
          text: >-
            You do like putting names on things. Never mind what it is. Be a good lad and do as you're told. If you're caught, use the story. If not, stay quiet until we come out with the plumber's tools.
        - id: ch01-b111
          speaker: dickie
          text: "Tell me again what I say if they catch me."
        - id: ch01-b112
          speaker: mr_beale
          text: >-
            Say a strange man stopped you on the road. He had a black beard and a red neckerchief. He beat you when you refused to climb through the window. Tell them you lost your father in town, and the stranger promised to show you where he was. If you see me, you don't know me. Same for that redheaded fellow you never saw.
        - id: ch01-b113
          speaker: narrator
          text: >-
            Mr. Beale looked down into the small, serious face turned toward him. For the first time, he seemed to notice how very little Dickie was.
        - id: ch01-b114
          speaker: mr_beale
          text: >-
            Think you can manage it? You don't have to go unless you want to, mate. I mean that.
        - id: ch01-b115
          speaker: dickie
          text: >-
            It's splendid! This is an adventure for a bold knight. I shall feel like Hereward when he put on the potter's clothes and went to visit King William.
          emotion: happy
        - id: ch01-b116
          speaker: narrator
          text: "Dickie had slipped into his grand book voice."
        - id: ch01-b117
          speaker: mr_beale
          text: >-
            There you go again. Don't talk that way if they catch you. They'll think you're a marquis in disguise and never let you leave.
        - id: ch01-b118
          speaker: narrator
          text: >-
            All through that day, Dickie thought about the great adventure ahead. He did not tell Mr. Beale, but he was very proud that grown men trusted him with such an important part. When he considered it, burgling sounded like the most exciting of professions. No one had taught him that it was wrong. He saw nothing ugly in the plan at all. It seemed to him a delightful, daring sort of amusement, exactly the thing for a brave boy from one of his books.
        - id: ch01-b119
          speaker: narrator
          text: >-
            While Dickie explored the little tracks beneath the thick grass, Mr. Beale lay stretched on the ground and thought.
        - id: ch01-b120
          speaker: mr_beale
          text: >-
            I don't more than half like this. Yes, I know this is why I got him. But he's such a fine little lad. I wouldn't want anything to happen to him.
        - id: ch01-b121
          speaker: narrator
          text: >-
            Dickie took off his boots and went to sleep as usual. In the middle of the night, Mr. Beale woke him.
        - id: ch01-b122
          speaker: mr_beale
          text: "It's time."
        - id: ch01-b123
          speaker: narrator
          text: >-
            There was no moon, and the night was very, very dark. Mr. Beale carried Dickie on his back for what felt like a very long way. They followed roads lost in darkness, passed beneath dark trees, and crossed meadows that were darker still. Ahead, a black bush divided into two pieces. One piece came toward them, and Dickie realized it was Jim. Before long, another man rose from a ditch. The four of them climbed a park fence that felt cold and wet beneath their hands. On the other side, they crept among trees and bushes, keeping close to a high park wall. Dickie stayed on Mr. Beale's shoulders. He could hardly believe that a man so large and clumsy-looking could step so softly.
        - id: ch01-b124
          speaker: narrator
          text: >-
            Through openings between the trees and bushes, Dickie could see the wide park spread out like one enormous shadow. Trees stood here and there across it, each of them another shadow. On the far side rose a great house. Its white face showed only a little paler than the trees around it. There were no lights anywhere inside. A little wood lay between the wall and the house, so its shelter carried them almost all the way there. At the edge of the trees, Dickie's heart began beating very fast. His own part in the adventure would start at any moment.
        - id: ch01-b125
          speaker: mr_beale
          text: "Here, take hold of him."
        - id: ch01-b126
          speaker: narrator
          text: >-
            Jim took Dickie in his arms and carried him forward while Mr. Beale and the other man crouched in the wood. At the wall, Jim raised the boy toward the window. Dickie caught the sill with both hands and pulled himself onto its broad stone ledge. The stone was bitterly cold. The night was damp and smelled of earth and dead leaves. Dickie held tightly to the iron window bars. Below him, Jim pressed treacle and a handkerchief against one pane and drew the glass away. He did it so carefully that nothing broke, nothing fell, and not a sound escaped.
        - id: ch01-b127
          speaker: narrator
          text: >-
            Dickie knew exactly what came next, because Mr. Beale had explained every movement again and again through the day. He reached through the empty pane and undid the window fastening. The window swung inward like the door of a cupboard. Dickie slipped his feet through the narrow gap between two bars, then eased the rest of his small body after them. For a moment, he hung inside by both hands. His foot searched the darkness until it found the table Mr. Beale had told him to expect below. He lowered himself onto it, then climbed carefully down to the floor.
        - id: ch01-b128
          speaker: dickie
          text: "Now I must remember the way exactly."
        - id: ch01-b129
          speaker: narrator
          text: >-
            Yet he did not have to remember. In the strangest way, he knew where the door was. Once he opened it, he knew which turn and which passages would lead to the little side door. It felt as though he had walked there before in a dream. He moved on his hands and sound knee, quiet as a mouse, dragging his lame foot softly behind him.
        - id: ch01-b130
          speaker: narrator
          text: >-
            He was frightened, very frightened. But he was braver than he was afraid, and that is what bravery means. He could barely keep his breathing quiet. His heart seemed so loud that anyone awake upstairs must surely hear it. Still, he reached the side door. His quick fingers found the oiled bolt and slid it back. He held the loose chain so it could not rattle and lifted its ball from the socket. Only the lock remained. Kneeling on his sound knee, he turned the large key with both hands.
        - id: ch01-b131
          speaker: narrator
          text: >-
            Very gently, Dickie turned the handle and pulled. The door opened. He slipped behind it, and cool, sweet night air touched his face. The doorway stood inside a thick enclosed arbor, where he could see neither sky nor any shape at all. He had never understood such darkness or silence before.
        - id: ch01-b132
          speaker: narrator
          text: >-
            Dickie nearly burst with pride. What an adventure this was! He had done his part exactly as he had been told, and done it perfectly. Balancing on his sound foot, he clung to the door until something brushed against him. Only then did he realize that Mr. Beale and the other men were creeping inside.
        - id: ch01-b133
          speaker: narrator
          text: >-
            At that touch, a strange new feeling came over him. It was pride mixed with shame. He was proud of being clever, yet another kind of pride made that cleverness seem shameful. Dickie suddenly knew he was not the sort of person who opened doors for burglars. It felt as though he had found his hands covered not with honest dirt, but with something slimy and foul, and could not understand how he had allowed it there.
        - id: ch01-b134
          speaker: narrator
          text: "He grabbed at the third shadow passing him."
        - id: ch01-b135
          speaker: dickie
          text: >-
            Father, don't do it. Go back, and I'll lock everything again. Oh, please don't.
          emotion: fearful
        - id: ch01-b136
          speaker: jim
          text: "Keep your mouth shut, or I'll give you something to remember!"
          emotion: angry
        - id: ch01-b137
          speaker: narrator
          text: "Dickie knew Jim's voice even in that velvet-black darkness. The threat only made him try again."
        - id: ch01-b138
          speaker: dickie
          text: "Please don't, Father."
          emotion: fearful
        - id: ch01-b139
          speaker: mr_beale
          text: "I can't turn against my mates now. You understand that, don't you?"
        - id: ch01-b140
          speaker: narrator
          text: >-
            Dickie did understand. The adventure had begun, and now it seemed impossible to stop. As people said in Norfolk, the food had been helped onto the plate and must now be eaten. Dickie crouched behind the open door and listened. The three men padded farther down the stone passage. Each had pulled woolen socks over his boots, so their footsteps sounded no louder than a cat's soft paws. He heard a faint rustle, then another padded step, then less and less. At last, every sound died away. The house was perfectly quiet, and the darkness around him was complete.
        - id: ch01-b141
          speaker: narrator
          text: >-
            It was far past Dickie's bedtime. Being so unusually clever had tired him out, and he was almost asleep when a crack like thunder snapped him awake. Boots blundered down the stairs. People rushed past. Another sharp crack came with a small flash like lightning. Someone stumbled and fell. There was a clatter like falling pails, and something hard and smooth struck Dickie's knee. One person dashed through the door into the night, then another.
        - id: ch01-b142
          speaker: eleanor
          text: "Edward, no! You must let them go. You must!"
          emotion: fearful
        - id: ch01-b143
          speaker: narrator
          text: >-
            A sudden light made Dickie blink. A tall lady in white swept downstairs with a lamp and caught at a man who sprang from the darkness into its glow.
        - id: ch01-b144
          speaker: eleanor
          text: "Take the lamp."
        - id: ch01-b145
          speaker: narrator
          text: >-
            She thrust it at him, then moved with astonishing speed. She shut the door, slid the bolt, fastened the chain, and turned the key. When she turned around, she saw Dickie.
        - id: ch01-b146
          speaker: eleanor
          text: "What's this? Edward, quickly! Here's one of them. Why, it's a child."
          emotion: surprised
        - id: ch01-b147
          speaker: narrator
          text: >-
            More people hurried down the stairs, carrying candles and calling to one another in excited voices. Their clothes were strangely loose and bright. Dickie had never seen dressing gowns before and could make no sense of them. Then the people themselves seemed to move in a very odd way. The candles, the colored clothes, and all the faces began going around and around before his eyes like spinning tops.
        - id: ch01-b148
          speaker: narrator
          text: >-
            The next thing Dickie remembered, he was in a room crowded with lights, people, and marvelous furniture. Someone held a tiny glass to his lips. It smelled nastily of public houses.
        - id: ch01-b149
          speaker: dickie
          text: "No, I won't drink it!"
        - id: ch01-b150
          speaker: narrator
          text: "He turned his head away."
        - id: ch01-b151
          speaker: eleanor
          text: "Do you feel better?"
        - id: ch01-b152
          speaker: narrator
          text: >-
            Dickie was amazed to discover that he lay on the lady's lap.
        - id: ch01-b153
          speaker: dickie
          text: "Yes, thank you."
        - id: ch01-b154
          speaker: narrator
          text: >-
            He tried to sit up, then settled back because her lap was so comfortable. He had never known anyone's lap could feel like that.
        - id: ch01-b155
          speaker: sir_edward
          text: "Now, young man, tell us how you got here and who sent you."
        - id: ch01-b156
          speaker: dickie
          text: "I climbed through the butler's pantry window."
        - id: ch01-b157
          speaker: narrator
          text: >-
            As soon as he said it, Dickie wondered how he had known it was the butler's pantry. No one had told him.
        - id: ch01-b158
          speaker: sir_edward
          text: "What did you climb in for?"
        - id: ch01-b159
          speaker: narrator
          text: >-
            Sir Edward's hair was rumpled, and he wore a loose pink flannel suit trimmed with cords like a soldier's uniform.
        - id: ch01-b160
          speaker: dickie
          text: "I came in to let someone through the door."
        - id: ch01-b161
          speaker: narrator
          text: >-
            Dickie stopped before saying who that someone was. This was the moment Mr. Beale had prepared him for so carefully. He had to think before he said anything more.
        - id: ch01-b162
          speaker: eleanor
          text: "It's all right, poor little fellow. Don't be frightened. Nobody is going to hurt you."
          emotion: calm
        - id: ch01-b163
          speaker: dickie
          text: "I'm not frightened now."
        - id: ch01-b164
          speaker: eleanor
          text: "You came in to let someone inside?"
        - id: ch01-b165
          speaker: dickie
          text: "To let the man in."
        - id: ch01-b166
          speaker: eleanor
          text: "Which man?"
        - id: ch01-b167
          speaker: dickie
          text: "I don't know."
        - id: ch01-b168
          speaker: sir_edward
          text: "There were three or four of them. Perhaps four or five."
        - id: ch01-b169
          speaker: eleanor
          text: "Which man was it, dear?"
        - id: ch01-b170
          speaker: dickie
          text: >-
            The man who said he knew where my father was. I went with him. In the wood, he said he'd beat me if I didn't climb through the window and open the door. He said he'd left tools here and you wouldn't return them.
        - id: ch01-b171
          speaker: eleanor
          text: "You see? The child didn't know. He's completely innocent."
        - id: ch01-b172
          speaker: narrator
          text: >-
            She kissed Dickie's hair, softly and kindly. He did not understand why he suddenly felt as if he might choke. His head seemed ready to burst. His ears burned, while his hands and feet went cold.
        - id: ch01-b173
          speaker: dickie
          text: "I did know. And I didn't have to go. I went because I wanted to."
        - id: ch01-b174
          speaker: eleanor
          text: "He has a fever. He doesn't know what he's saying. Look how red his face is."
        - id: ch01-b175
          speaker: dickie
          text: "I did want to. I thought it would be fun, and it was."
        - id: ch01-b176
          speaker: narrator
          text: >-
            Dickie expected them to shake him and put him down. He wondered where his crutch had gone. Mr. Beale had carried it beneath his arm. Without it, how could Dickie ever reach Gravesend? But no one shook him. Instead, Eleanor gathered him into her arms and stood.
        - id: ch01-b177
          speaker: eleanor
          text: >-
            I'm putting him to bed. You will ask him no more questions tonight. Morning will be soon enough.
        - id: ch01-b178
          speaker: narrator
          text: >-
            She carried Dickie out of the crowded drawing room, away from the lights and all the curious people. His new room was large and beautiful. The walls were blue, the curtains were blue and gray, and every piece of furniture looked finer than anything he knew. A high four-poster bed stood in the middle, hung with blue silk and piled with more pillows than Dickie had ever imagined could belong to one bed. Eleanor poured sweet-smelling water into a large basin painted with blue and gold flowers, and gently washed him. Then she dressed him in a nightgown edged with lace. It must have been her own, because no little boy could ever have filled such a large garment.
        - id: ch01-b179
          speaker: narrator
          text: >-
            Then she tucked him into the soft warm bed, which felt like one enormous pillow, and kissed him. Dickie put his thin arms around her neck.
        - id: ch01-b180
          speaker: dickie
          text: "I do like you, but I want Father."
        - id: ch01-b181
          speaker: eleanor
          text: >-
            Where is he? No, you can tell me in the morning. Drink this milk, then sleep soundly. Everything will be all right, dear.
          emotion: calm
        - id: ch01-b182
          speaker: dickie
          text: "May Heaven bless you, generous benefactress."
        - id: ch01-b183
          speaker: narrator
          text: "Dickie's grand words faded sleepily away."
        - id: ch01-b184
          speaker: eleanor
          text: >-
            What an extraordinary child. I cannot think who he reminds me of. Where did everyone else go?
        - id: ch01-b185
          speaker: sir_edward
          text: >-
            I sent them to bed. There's nothing more to do. We ought to have chased those men.
        - id: ch01-b186
          speaker: eleanor
          text: "They didn't take anything."
        - id: ch01-b187
          speaker: sir_edward
          text: >-
            No. They dropped it all when I fired. Come, let's go to bed. Poor Eleanor, you must be exhausted.
        - id: ch01-b188
          speaker: eleanor
          text: >-
            Edward, I wish we could adopt that little boy. I'm certain he comes from good people. Perhaps he was kidnapped.
        - id: ch01-b189
          speaker: sir_edward
          text: "Don't be a dear, foolish woman."
        - id: ch01-b190
          speaker: narrator
          text: >-
            That night, Dickie slept between sheets of the finest linen, and every fold carried the scent of lavender. He sank deep among pillows as soft as down. Over him lay a warm down quilt covered in blue-flowered satin. At the foot of the towering bed, someone long ago had carved a shield into the wood. Upon the shield stood the figure of a great dog.
        - id: ch01-b191
          speaker: narrator
          text: >-
            Across the room, Dickie's dusty clothes lay in a small, sad heap. They looked especially poor and lonely on the stately chair with its rich tapestry covering. But Dickie saw none of that. He slept on in the lavender-scented bed and dreamed of Mr. Beale, the little house hidden beneath the furze, and the outdoor bed with green curtains.
