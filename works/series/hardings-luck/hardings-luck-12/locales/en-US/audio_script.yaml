  chapters:
    - id: ch01
      title: The End
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            What a triumph it was for little lame Dickie of Deptford! He was proud, and no wonder. He had done his best to help Beale and the dogs. The man who had believed himself Lord Arden had declared before everyone that he was proud to see Dickie at the head of their house. Then all the Arden people had cheered. It was a moment worth living for.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Surely, you might think, he must have been happy too. The man whose place he had taken showed him nothing but generous love. His young cousins loved him, and Beale was devoted to him. Dickie was Lord Arden, and before long all the ancient lands would be his. He could learn whatever he wished. One day, the lives of the loyal village people would be in his hands. Think of all he might become, and all the good he might do.
        - id: ch01-b03
          speaker: narrator
          text: >-
            All of it would have made him happy, except for one thing. He had gained it at the cost of the people he loved best. Edred and Elfrida were his dear cousins and playmates. Their father had moved heaven and earth to prove Dickie's right to the title. Then, without complaint, he had stepped aside and surrendered the title, the Castle, the land, and the treasure to a lame little boy from Deptford.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Through the days that followed, Dickie could think of almost nothing else. His old life in the dream-world, when James the First was King, seemed small beside the glory of being head of the house of Arden now. Here he could watch over the good village people, who loved the Arden name.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Yet the memory of that other life kept eating into his joy. Then, he had been plain Richard Arden, the son of Sir Richard Arden, living in the beautiful house at Deptford. And he could not forget how much he owed the man who had been Lord Arden before him. When Dickie was only a tramp boy, these people had welcomed him. They had loved him and treated him kindly. Now he was repaying them by taking away what he believed was beyond price: the lordship, the old lands, and the old Castle.
        - id: ch01-b06
          speaker: narrator
          text: >-
            What if he gave it all back? He still had one sure refuge. He could return to the past. That would mean giving up the bright, real life around him for one that now seemed distant and almost forgotten. Once, that other life had been everything he wanted. He had chosen to leave it so he could help Beale, a helpless, middle-aged tramp. And he had helped him. Beale was a new man now, a man Dickie had made.
        - id: ch01-b07
          speaker: narrator
          text: >-
            If he had traded one beautiful life for Beale's sake, surely he could trade this beautiful life for another. He would do it for his own flesh and blood, who had so kindly and freely given him the place that used to be theirs.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Little by little, Dickie understood what he must do. He would go back to the days of King James and never return. The thought was bitter. It felt like leaving home forever. It was exile. But could Richard Lord Arden be afraid of exile, or of anything else?
        - id: ch01-b09
          speaker: narrator
          text: >-
            He could not simply vanish. They would search for him and never know he was gone for good. He must slip away and make Edred and Elfrida's father Lord Arden again. Everyone would have to believe that Richard Lord Arden was dead.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Dickie thought it through with great care. If he seemed dead, Edred and Elfrida would grieve. He could not allow that. He would tell them the truth first, so they would know he had acted properly, as an Arden should. Do not judge him too harshly for wanting that small bit of human praise. Few of us can bear to do something decent without letting someone dear to us know.
        - id: ch01-b11
          speaker: narrator
          text: >-
            It took him a long time to make the whole plan clear in his mind, with no mistakes. At last, his decision was made.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Dickie asked Edred and Elfrida to go with him to the cave, because he had something to tell them. When all three were seated on the smooth sand beside the underground stream, he began.
        - id: ch01-b13
          speaker: dickie
          text: "Listen. I'm not going to stay Lord Arden."
        - id: ch01-b14
          speaker: edred
          text: "You don't have any choice. You are Lord Arden."
        - id: ch01-b15
          speaker: dickie
          text: >-
            I do have a choice. You know I went to live in the time of King James. Well, I'm going back there, and this time I'll stay forever.
        - id: ch01-b16
          speaker: elfrida
          text: "No, you won't! I'll tell Father."
          emotion: angry
        - id: ch01-b17
          speaker: dickie
          text: >-
            I've already thought about that. I'll ask the Mouldiwarps to stop you from telling anyone. I can't stay here when it feels as if I'm forcing you and your father out. And remember what Edred did for me, right here in this cave. No, I've decided.
        - id: ch01-b18
          speaker: narrator
          text: "He had decided, and nothing they said could change his mind."
        - id: ch01-b19
          speaker: edred
          text: "But we'll never see you again."
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: "Dickie admitted that they would not."
        - id: ch01-b21
          speaker: elfrida
          text: >-
            Oh, Dickie, you won't see us again either. Have you thought about that? How can you possibly manage without us?
          emotion: sad
        - id: ch01-b22
          speaker: dickie
          text: >-
            It won't be quite as bad as you think. The Edred and Elfrida in that time are as like you as two pins. No, that isn't really true. Please don't make this harder. I have to go.
          emotion: sad
        - id: ch01-b23
          speaker: narrator
          text: >-
            Something in his voice quieted them and made them understand. He truly did have to go.
        - id: ch01-b24
          speaker: dickie
          text: >-
            I could never be happy if I stayed here. Never. But I can be happy there. You won't forget me, though there are one or two other things I need you to forget. And I'm leaving now.
          emotion: sad
        - id: ch01-b25
          speaker: elfrida
          text: "Oh, not this minute. Please wait and think about it some more."
          emotion: sad
        - id: ch01-b26
          speaker: dickie
          text: "I've thought about nothing else for a whole month."
        - id: ch01-b27
          speaker: narrator
          text: "Then he began arranging the moon-seeds on the smooth sand."
        - id: ch01-b28
          speaker: dickie
          text: >-
            There. The pattern is finished. I'll hold Tinkler and the white seal and carry them with me. After I'm gone, put the moon-seeds in your pocket and go home. When they ask where I am, tell them I'm in the cave. They'll find my clothes here and think I went swimming and drowned.
        - id: ch01-b29
          speaker: elfrida
          text: "I can't bear it! I can't do that, and I won't!"
          emotion: sad
        - id: ch01-b30
          speaker: narrator
          text: "She burst into sobs."
        - id: ch01-b31
          speaker: dickie
          text: >-
            But I won't truly be dead, silly. We are certain to meet again someday. People who love each other always find one another again. Old Nurse told me that, and she knows everything. Good-bye, Elfrida.
        - id: ch01-b32
          speaker: narrator
          text: "He kissed her."
        - id: ch01-b33
          speaker: dickie
          text: >-
            Good-bye, Edred, old fellow. I'd like to kiss you too, if you don't mind. I know boys don't usually do it, but men kiss each other in the time I'm going to. Raleigh and Drake did, you know.
        - id: ch01-b34
          speaker: narrator
          text: "The two boys kissed, both shy and awkward."
        - id: ch01-b35
          speaker: dickie
          text: "And now, good-bye."
        - id: ch01-b36
          speaker: narrator
          text: "Richard stepped inside the crossed triangles of moon-seeds."
        - id: ch01-b37
          speaker: dickie
          text: >-
            Dear Mouldiwarps of Arden, please grant these last wishes. I wish that Edred and Elfrida will never be able to tell anyone what I've done. In one year, let them forget what I've done too. Don't let them be unhappy about me, because I shall be very happy.
        - id: ch01-b38
          speaker: narrator
          text: "He added the last words uncertainly, then stopped."
        - id: ch01-b39
          speakers: [edred, elfrida]
          ensemble: duo
          text: "Oh, Dickie, don't do it!"
          emotion: sad
        - id: ch01-b40
          speaker: narrator
          text: "But Dickie went on."
        - id: ch01-b41
          speaker: dickie
          text: >-
            I wish my uncle will rebuild the Castle. Let him care for the poor people until no one is poor and everyone lives comfortably, just as I planned to do.
        - id: ch01-b42
          speaker: narrator
          text: "He took off his cap, his coat, and his boots, and threw them beyond the circle."
        - id: ch01-b43
          speaker: dickie
          text: >-
            I wish to return to the time of James the First. Let me live out my life there, and bring honor in life and death to the house of Arden.
        - id: ch01-b44
          speaker: narrator
          text: >-
            The children blinked. Dickie was gone. Tinkler and the white seal had vanished with him. On the sand, only the empty ring of moon-seeds remained.
        - id: ch01-b45
          speaker: narrator
          text: >-
            The newspapers called it a shocking bathing accident. Lord Arden had drowned, they reported, and his body had not been found.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Of course, no body ever was found. Edred and Elfrida said nothing. Their elders thought the shock had come too suddenly and had been too terrible for them to speak.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Edred and Elfrida's father is Lord Arden now, and he has done everything Dickie meant to do. He has made Arden the happiest and most prosperous village in England. The stream where Dickie said good-bye to his cousins now runs as a broad moat around the Castle, which stands restored in all its old splendor.
        - id: ch01-b48
          speaker: narrator
          text: >-
            In the church, a tablet says that Richard, the sixteenth Lord Arden, died by drowning. Every Sunday for a year, the children read those words and knew they were untrue. Then the moon-seeds in the Castle garden grew, flowered, and scattered seeds of their own. By that time, Edred and Elfrida no longer knew the truth. They spoke sadly and lovingly of dear Cousin Dickie, who had drowned.
        - id: ch01-b49
          speaker: narrator
          text: >-
            At the same time, they forgot that they had ever traveled out of their own age and into the past. If they read this very story, they would call it nonsense and make-believe. They would never recognize it as their own.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Yet whatever else may be forgotten, Dickie is remembered. He gave up his life here for the people he loved, and he will live as long as life beats in the hearts of those who loved him.
        - id: ch01-b51
          speaker: narrator
          text: >-
            And what of Dickie himself? I see him in his ruff and cloak, a little sword hanging at his side. He is living the life he chose in the old England of King James. As he grows, he wins grace and favor. He becomes learned in books and skilled in every noble sport and exercise. For Dickie is not lame now.
        - id: ch01-b52
          speaker: narrator
          text: >-
            I see the roots of his heart taking firm hold in that chosen life. The life he gave up drifts farther and farther away, until he can barely see it.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Then I see him as a tall young man, straight and strong. In the neat and beautiful garden at Deptford, he offers Old Nurse his arm as they walk.
        - id: ch01-b54
          speaker: dickie
          text: >-
            Nurse, when I was a little boy, I had the strangest dreams. I dreamed of a completely different life.
        - id: ch01-b55
          speaker: old_nurse
          text: >-
            Forget those dreams. Dreams help to make every proper man. But you are a man now, so leave your childhood dreams behind. Be a man for the glory of God and the house of Arden. Let your dreams turn instead to the life that is still to come. Beside that life, every life on earth is only a dream. There, all who have loved one another will meet and remain together forever. There, at last, every dear and noble dream of our earthly life will become more than a dream.
        - id: ch01-b56
          speaker: narrator
          text: "And there, they will be together forevermore."
