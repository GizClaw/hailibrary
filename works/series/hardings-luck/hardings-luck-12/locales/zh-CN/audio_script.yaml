audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机敏，带着克制的幽默与讲故事的悬念
        timbre: 温暖清亮
        pace: 舒展而有变化
        pitch: 中音
    dickie:
      display_name: 迪基
      tts:
        delivery: 聪明敏感，街头口吻直率，学书中人物说话时郑重夸张
        timbre: 清脆稚嫩
        pace: 稍快，受委屈时断续
        pitch: 中高音
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 坦率好奇，闹别扭时固执又认真
        timbre: 明净的少年音
        pace: 中等，着急时稍快
        pitch: 中高音
    elfrida:
      display_name: 埃尔弗里达
      tts:
        delivery: 热情果断，好奇心强，说话爽快有主见
        timbre: 清亮灵动
        pace: 稍快
        pitch: 高音
    nurse:
      display_name: 老奶妈
      tts:
        delivery: 慈爱爽朗，照料孩子时坚定又耐心
        timbre: 丰满温暖
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 终章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            德特福德那个跛脚小迪基，赢得了一场多么辉煌的胜利！那些赞许的话和欢呼声还响在耳边，他当然自豪。其实，他并没想过要赢得什么，只是尽了自己最大的力气，想帮助比尔和那些狗。可原先的阿登勋爵却当众说，迪基能成为一家之主，叫他深感骄傲。阿登的乡亲也全为迪基欢呼。单为这一刻，这一生也值得了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            迪基取代的那个人无私地疼爱他，两个小表亲也爱他，比尔对他更是一片忠心。如今他是阿登勋爵，不久就会拥有阿登家从前的全部土地。他想学什么就能学什么，将来还会照管这些忠于阿登之名的村民。想到自己可以成为怎样的人，又能做多少事，照理说，他该非常快活。
        - id: ch01-b03
          speaker: narrator
          text: >-
            可他偏偏快活不起来。因为这一切，是拿他最爱的人拥有的东西换来的。埃德雷德和埃尔弗里达既是他亲爱的表亲，也是朝夕相伴的玩伴。他们的父亲为了替迪基查明身世，几乎想尽了世间一切办法。真相一出来，他又毫无怨言地退到一旁，把爵位、城堡、土地和宝藏，全让给这个来自德特福德的跛脚孩子。
        - id: ch01-b04
          speaker: narrator
          text: 往后的日子里，迪基想着这件事，几乎也只想着这件事。
        - id: ch01-b05
          speaker: narrator
          text: >-
            他曾在詹姆斯一世的时代生活。可是和眼前的荣耀相比，那段梦境般的日子似乎已经很轻很淡。现在，他是阿登的一家之主，是那些善良农人的庇护者，而他们都爱着阿登这个姓氏。
        - id: ch01-b06
          speaker: narrator
          text: >-
            可他忘不了自己还是理查德·阿登时的生活。那时，他是理查德·阿登爵士的儿子，住在德特福德的美丽宅子里。这个念头一直啃噬着他的欢喜，就像铁锈一点点侵蚀钢铁。他也忘不了自己欠了原先那位阿登勋爵多少。迪基还只是流浪儿时，这一家人接纳他，爱他，对他好。可他如今给他们的回报，竟是从他们手中拿走阿登的爵位、古老的土地和城堡。在他眼里，那些全是无价之宝。
        - id: ch01-b07
          speaker: narrator
          text: >-
            那么，把这些无价之宝还给他们呢？他还可以退到另一个稳妥的去处，那就是过去。可这是一种牺牲。他要舍下此时此地，回到遥远得几乎被遗忘的从前。那段快活的生活曾装着他在意的一切，如今却比眼前鲜明灿烂的日子更像一场梦。眼前的一切太真切了，真切得让过去显得淡薄。
        - id: ch01-b08
          speaker: narrator
          text: >-
            迪基记得，詹姆斯国王时代的生活也曾是世上最美好的东西。可他当初还是选择回来，只为了帮助一个无依无靠、年过半百、一事无成的流浪汉。那个人就是比尔。现在，他已经做成了自己要做的事，也帮比尔变成了一个全新的人。为了比尔，他能舍下美好的生活，回到寒酸肮脏的日子。现在，为了这些和他骨肉相连，又毫不迟疑、满怀善意地让出原有位置的人，他当然也能舍下一种美好的生活，去换另一种美好的生活。
        - id: ch01-b09
          speaker: narrator
          text: >-
            迪基越来越明白，这件事非做不可。他要回到詹姆斯一世的时代，再也不回到眼前的年月。这一定苦极了，就像永远离开家，再也不能回来。这是一种放逐。可理查德·阿登勋爵难道会害怕放逐，或是害怕任何别的事吗？他绝不能害怕。
        - id: ch01-b10
          speaker: narrator
          text: >-
            他也不能凭空消失。要不然，大家会不停地找他，永远不知道他已经一去不返。他得悄悄离开，让埃德雷德和埃尔弗里达的父亲仍像从前那样做阿登勋爵，还得叫人以为理查德·阿登勋爵已经死了。可是两个孩子会伤心，他们不该这样伤心。所以，他要先把真相告诉他们，让他们知道，他做得很好，做得像个真正的阿登。
        - id: ch01-b11
          speaker: narrator
          text: >-
            请别怪他渴望这一点点人间的赞许。我们当中，很少有人能完全不要它。我们偶尔真的做了一件体面的事，又有几个人能忍住，不让身边至亲至爱的人知道呢？迪基花了很长时间，把这一切想得清清楚楚，不留一点疏漏。最后，他终于拿定主意。
        - id: ch01-b12
          speaker: narrator
          text: >-
            他请埃德雷德和埃尔弗里达跟自己去洞里，说有话要讲。三个人坐在地下溪流旁平滑的沙地上，迪基开了口。
        - id: ch01-b13
          speaker: dickie
          text: 你们听着，我不打算继续当阿登勋爵了。
        - id: ch01-b14
          speaker: edred
          text: 可这事又不由你决定。
        - id: ch01-b15
          speaker: dickie
          text: >-
            我有办法。你们知道，我以前去詹姆斯国王的时代生活过。现在我要再回去，这一回永远不回来了。
        - id: ch01-b16
          speaker: elfrida
          text: 不许去！我要告诉爸爸。
          emotion: fearful
        - id: ch01-b17
          speaker: dickie
          text: >-
            我全想过了。我会请鼹鼠精施魔法，叫你们没法说出去。我不能留在这里，总觉得是自己赶走了你们和你们的父亲。别忘了，埃德雷德就在这座洞里救过我。不，我已经决定了。
        - id: ch01-b18
          speaker: narrator
          text: 他的确已经决定。不管他们怎么劝，都动摇不了他。
        - id: ch01-b19
          speaker: edred
          text: 可这样一来，我们就永远见不到你了。
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: 迪基承认，的确如此。
        - id: ch01-b21
          speaker: elfrida
          text: >-
            还有你呢，迪基。你也再见不到我们了。好好想想，没有我们，你以后怎么办呀？
          emotion: sad
        - id: ch01-b22
          speaker: dickie
          text: >-
            没你想得那么糟。那个时代也有埃尔弗里达和埃德雷德，他们跟你们简直一模一样。不，其实也不是！唉，别再叫我更难受了，我非这样做不可。
        - id: ch01-b23
          speaker: narrator
          text: 他声音里的某种东西使两个孩子安静下来。他们听得出，迪基真的非走不可。
        - id: ch01-b24
          speaker: dickie
          text: >-
            留在这里，我永远不会快活。可回到那里，我会快活的。你们永远不会忘记我，只是有一两件事，我希望你们能忘掉。现在我就要走了。
        - id: ch01-b25
          speaker: elfrida
          text: 别现在就走！再等等，再想一想吧。
          emotion: sad
        - id: ch01-b26
          speaker: dickie
          text: 整整一个月，我什么也没想，只想这件事。
        - id: ch01-b27
          speaker: narrator
          text: 他说着，开始在平滑的沙地上摆放月亮种子。等图案摆好，他又把接下来的安排告诉他们。
        - id: ch01-b28
          speaker: dickie
          text: >-
            我要把廷克勒和白海豹握在手里，一起带走。等我不见了，你们就收起月亮种子回家。别人问我在哪儿，你们只说我在洞里。他们会在这里发现我的衣服，以为我游泳时淹死了。
        - id: ch01-b29
          speaker: elfrida
          text: 我受不了！我受不了，也绝不答应！
          emotion: sad
        - id: ch01-b30
          speaker: narrator
          text: 埃尔弗里达一下哭了出来。理查德只好安慰她。
        - id: ch01-b31
          speaker: dickie
          text: >-
            小傻瓜，我又不是真的死了。我们总有一天会再见。彼此相爱的人一定会重逢，老奶妈告诉过我，她什么都知道。再见了，埃尔弗里达。
        - id: ch01-b32
          speaker: narrator
          text: 他吻了吻她，又转向埃德雷德。
        - id: ch01-b33
          speaker: dickie
          text: >-
            再见了，老伙计。你要是不介意，我也想吻吻你。我知道男孩子平时不这样，可在我要去的时代，男人也会亲吻。罗利和德雷克就这样做过。
        - id: ch01-b34
          speaker: narrator
          text: 两个男孩羞怯又笨拙地吻别。随后，理查德跨进月亮种子交叠成的三角形。
        - id: ch01-b35
          speaker: dickie
          text: >-
            那么，再见了。亲爱的阿登鼹鼠精，请实现我最后这些愿望。我希望埃德雷德和埃尔弗里达永远不能说出我做的事。我还希望一年以后，他们会忘掉这一切。别让他们为我伤心，因为我会很快活。我知道，我一定会的。
        - id: ch01-b36
          speaker: narrator
          text: 最后几个字，他说得有些迟疑。两个孩子齐声喊了出来。
        - id: ch01-b37
          speakers: [edred, elfrida]
          ensemble: duo
          text: 迪基，不要走！
          emotion: sad
        - id: ch01-b38
          speaker: dickie
          text: >-
            我希望叔父修复城堡，好好照顾穷人，让这里再没有穷人，人人都能过得舒舒服服。那正是我原本想做的事。
        - id: ch01-b39
          speaker: narrator
          text: 迪基把帽子、外套和靴子都脱下来，扔到圆圈外面。
        - id: ch01-b40
          speaker: dickie
          text: >-
            我希望回到詹姆斯一世的时代，在那里度过一生。无论活着还是死去，都不辱阿登一门。
        - id: ch01-b41
          speaker: narrator
          text: >-
            两个孩子眨了眨眼睛。迪基、廷克勒和白海豹已经不见了。平滑的沙地上，只剩下一圈空荡荡的月亮种子。
        - id: ch01-b42
          speaker: narrator
          text: >-
            报纸把这件事称作一场骇人的游泳惨剧。上面写着，阿登勋爵溺水身亡，遗体还没有找到。当然，那具遗体永远也不会找到。迪基留下的衣服，使所有人都相信他是在洞里下水游泳时出了事。
        - id: ch01-b43
          speaker: narrator
          text: >-
            埃尔弗里达和埃德雷德什么也没说。大人们觉得毫不奇怪，只当突如其来的变故给了他们太大的打击。
        - id: ch01-b44
          speaker: narrator
          text: >-
            他们的父亲如今是阿登勋爵。迪基想做的一切，他全都做到了。他使阿登成为全英格兰最幸福、最富足的村庄。迪基在那条溪边告别了表亲。如今，溪水已经汇成宽阔的护城河，环绕着阿登城堡，而那座城堡也恢复了昔日全部的荣光。
        - id: ch01-b45
          speaker: narrator
          text: >-
            教堂里立了一块碑，记载第十六代阿登勋爵理查德溺水身亡。整整一年，两个孩子每个星期日都会读到它，也知道碑文并不是真的。
        - id: ch01-b46
          speaker: narrator
          text: >-
            后来，月亮种子在城堡花园里长大、开花，又撒下新的种子。到了这时，他们便不再知道真相，只会常常伤感而深情地谈起溺水身亡的表兄迪基。与此同时，他们也忘了自己曾离开这个时代，到过去生活过。即使有一天读到这本书，也只会当成凭空编出的胡话，完全认不出书里讲的正是自己的故事。
        - id: ch01-b47
          speaker: narrator
          text: >-
            可无论别的事怎样被遗忘，迪基始终都有人记得。他为了自己深爱的那些人，舍下了在这个时代的一生。只要爱他的人心中还有生命在跳动，他就会一直活下去。
        - id: ch01-b48
          speaker: narrator
          text: >-
            再说迪基自己。我看见他戴着轮状皱领，披着斗篷，小剑佩在身边，在詹姆斯一世统治的古老英格兰，度过自己选择的人生。
        - id: ch01-b49
          speaker: narrator
          text: >-
            我看着他一天天长大，日益受到上帝和众人的喜爱。他熟习书本里的学问，也精通所有高贵的运动与技艺。因为迪基如今已经不跛了。
        - id: ch01-b50
          speaker: narrator
          text: >-
            我看见他的根牢牢扎进自己选择的生活。他舍弃的那段人生渐渐远去，越来越远，最后几乎再也看不见。
        - id: ch01-b51
          speaker: narrator
          text: >-
            我看见他长成高大挺拔、强健有力的青年。在德特福德那座整洁美丽的花园里，他伸出手臂，让年迈的奶妈扶着，一步步陪她散步。我也听见他对奶妈说起童年，说起那些已经远去的梦。
        - id: ch01-b52
          speaker: dickie
          text: 奶妈，我小时候做过很奇怪的梦，梦见自己过着另一种完全不同的生活。
        - id: ch01-b53
          speaker: nurse
          text: >-
            把那些梦忘了吧。每个堂堂正正的男子，都是由梦一点点塑成的。可你已经长大成人，该忘掉童年的梦，拿出男子汉的气概，为上帝，也为阿登一门增添荣耀。往后，要梦就梦来生吧。和来生相比，人世的一切生活都只是梦。到了那里，彼此相爱的人都会重逢，从此永远相伴。人世间那些亲爱而高尚的梦，也终于不再只是梦。
