  chapters:
    - id: ch01
      title: Going Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            In Deptford, the seven months were nearly over. Dickie had worked hard, learned a great deal, and earned good money. Mr. Beale had changed too. His habits were clean now, and he grew steadier all the time. He was like a plant reaching quickly toward the sunshine of respectability, or a bright and important lighthouse rising out of a tossing sea of dogs.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The dog business was thriving beyond anything they had expected. Beale now knew purebred dogs and understood what happened at prize shows. He had learned all about distemper and the fits that dogs could suffer. He knew when a sick dog needed sal volatile as medicine, and when it merely needed less food. Their savings grew so large that the bankbook seemed ready to burst. The extra had to flow into a great sea of government funds called Consols.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The dogs grew too, both in size and in number. The neighbors had been patient, but now, as Beale put it, they had begun to pass remarks.
        - id: ch01-b04
          speaker: mr_beale
          text: >-
            They don't mind the little dogs so much, though their yapping is worse to my ears. It's the cocker spaniel and the Great Danes that upset them.
        - id: ch01-b05
          speaker: dickie
          text: "That cocker spaniel does keep barking once he starts."
        - id: ch01-b06
          speaker: narrator
          text: >-
            Dickie looked up at the creeping jenny in the window boxes. The garden itself had been trampled hard by rubber-soled paws, and no flowers would grow there now. But every window had a bright stripe beneath it. Dickie had bought creeping jenny, Brompton stocks, stonecrop, and late tulips from the High Street barrows, and they made a brave show.
        - id: ch01-b07
          speaker: mr_beale
          text: >-
            I won't call the neighbors unfriendly for talking about the police, so long as talking is all they do. Still, I wish we had more room. The books say every dog needs exercise each day, but how can one pair of hands manage that? Or one pair of legs? And you've got your own work now, so you can't spend all day helping.
        - id: ch01-b08
          speaker: dickie
          text: >-
            I wish we had a bigger place too. We can afford it now. Still, I'd be sorry to leave this one. We've had some good times here, haven't we, Father?
        - id: ch01-b09
          speaker: narrator
          text: "He sighed like an old man remembering his far-off youth."
        - id: ch01-b10
          speaker: mr_beale
          text: >-
            We certainly have. But you can't truly call this backyard a place for dogs to exercise, can you?
        - id: ch01-b11
          speaker: dickie
          text: "Then let's get moving."
        - id: ch01-b12
          speaker: mr_beale
          text: >-
            Now you're talking! Remember last winter, when Mr. Fuller came for the rent? I told you my legs were getting restless and asked why we couldn't take to the road now and then. You said we'd see when summer came, and here summer is. What if we went roaming, mate? Out there, a fellow can stretch his legs without kicking a dog or knocking over the dishes. The old pram is waiting upstairs in the back room, as lively as ever. A little paint would make her fit for a duke. Here am I, here are you, and here are the best of the dogs. Just think of it. We'd sleep in the bed with green curtains, toast our own herrings, and smell them cooking over a fire we made from sticks. The little stars would come out and wink at us. It would be so quiet that I could smoke till the pipe dropped from my sleepy mouth, without any fear of setting the bedspread on fire. What do you say?
        - id: ch01-b13
          speaker: narrator
          text: >-
            Dickie looked fondly at the neat back of the little house. He saw its crisp white muslin blinds, glimpses of pretty curtains, and the flowers he had tended. Then another picture came into his mind. He saw the last misty light fading beyond the great shoulders of the downs. The little stars shone bright and new through fir branches woven together overhead. Beneath them waited a sweet-smelling bed of soft, fallen brown pine needles.
        - id: ch01-b14
          speaker: mr_beale
          text: "Well, mate?"
        - id: ch01-b15
          speaker: dickie
          text: "We can go as soon as you like. The sooner, the better."
        - id: ch01-b16
          speaker: narrator
          text: >-
            Once Beale had decided to go, he immediately found a dozen reasons to stay. Every reason had four feet and wagged a loving tail. Could he truly trust Amelia with the dogs?
        - id: ch01-b17
          speaker: amelia
          text: "If you can't trust me, I don't know who you can trust. Anyone would think those dogs were babies."
        - id: ch01-b18
          speaker: mr_beale
          text: >-
            They are babies to me, or just as precious. Come and live here while we're gone, Amelia. We'll pay you five shillings a week. The boy will write down what each dog eats, what medicine it needs, and which one gets what.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Settling that arrangement took time, and writing all the feeding and medicine instructions took even more. At last the fresh coat of paint on the pram was nearly dry. All their shirts and socks had been washed and mended, and they lay on the kitchen window ledge ready to pack. At that very point, Beale went out one morning and came home with a completely unfamiliar dachshund.
        - id: ch01-b20
          speaker: mr_beale
          text: >-
            I can't leave the little creature until he knows his new home. He might bolt off anywhere, get stolen, or be carried to the Dogs' Home. I can't risk that, can I?
        - id: ch01-b21
          speaker: narrator
          text: >-
            The new dog was very long, very brown, friendly, and charming. After supper he wagged his tail, looked at Dickie with a clear, gentle eye, and suddenly stood on his head.
        - id: ch01-b22
          speaker: mr_beale
          text: >-
            There's money in this dog! He's a trick dog, and worth every penny I paid. I'll wager he knows more tricks than that.
        - id: ch01-b23
          speaker: narrator
          text: >-
            He did know more tricks. The dachshund was remarkably well educated. Next morning Beale came downstairs just in time to slam the front door in Amelia's face. She was coming in with her pail after cleaning the front steps, and without that quick slam the new dog would have escaped. One of the dog-room doors stood open, and a whole fringe of curious dogs decorated the passage.
        - id: ch01-b24
          speaker: mr_beale
          text: "Why did you open that door?"
        - id: ch01-b25
          speaker: amelia
          text: "I didn't."
        - id: ch01-b26
          speaker: narrator
          text: >-
            She would not change her answer. That afternoon Beale was smoking in the garden. As he often did, he got up to look at the dogs through the window. After one glance, he muttered something and sprang toward the back door. It was shut. Amelia was giving the scullery floor a thorough scrubbing, and she had locked the door so no one could suddenly fling it into her steaming pail or against her crouching back.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Beale finally managed to get in through the back door and race out through the front. But he was too late to catch the dachshund. He saw the dog disappearing at full speed around the end of the street, as straight and brown as a stick of toffee. That was the last glimpse either of them ever had of him.
        - id: ch01-b28
          speaker: mr_beale
          text: >-
            He was trained for it from a puppy, you can stake your life on that. I can see him as plainly as I see you. He listens and looks while pretending not to hear or see a soul. Then up he goes on his hind legs, turns the handle with those little crooked front paws, clever as a monkey, and shoots out through the door and around the corner. His master must have taught him to open doors, escape, and run home. Then the man could sell him again and again, making a good sum every time. He was as handsome a dog as I've ever seen. Clever, that's what I call it.
        - id: ch01-b29
          speaker: dickie
          text: "I call it a mean trick. I'm sorry you lost him."
        - id: ch01-b30
          speaker: mr_beale
          text: >-
            I'm not pleased myself, but there's no use crying over broken glass. What strikes me is the cleverness. I could live a hundred years and never think up such a thing. You might have done, but I never would.
        - id: ch01-b31
          speaker: dickie
          text: "We earn our living. We don't have to cheat for it."
        - id: ch01-b32
          speaker: mr_beale
          text: >-
            No, dear boy, of course we don't. That's exactly what I mean. We'd never think of doing it because we don't need to. But it was clever.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Hearing Beale admire the trick that had cheated him made Dickie thoughtful. After a pause, he spoke very gently.
        - id: ch01-b34
          speaker: dickie
          text: "On this walking tour, we'll pay our own way, won't we? No begging?"
        - id: ch01-b35
          speaker: mr_beale
          text: >-
            You ought to know me better than that. I haven't done any begging patter since the Rally, when I started in the dog trade.
        - id: ch01-b36
          speaker: dickie
          text: "And no business with that redheaded man I've never seen?"
        - id: ch01-b37
          speaker: mr_beale
          text: >-
            Is that likely? We're above a low fellow like him. The pram is dry as a bone and shiny as your hat. We'll leave first thing tomorrow.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Early next morning, when even Deptford felt fresh and sweet, they said goodbye to Amelia and the dogs and set off.
        - id: ch01-b39
          speaker: amelia
          text: >-
            It'll be rather lonely here. Still, with all these dogs in the house, no burglar will trouble me.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Amelia stood watching as they went down the street, and she waved goodbye when they turned the corner. Then she went back into the house and closed the door. At once the dogs raised their many voices. They seemed to promise that, whatever else happened, Amelia would not be very lonely after all.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Now they were truly on the road, bound for Arden. By the sea stood the castle that belonged to Dickie's uncle in his other life. There, after seven months of waiting, Dickie was to meet his cousins.
        - id: ch01-b42
          speaker: narrator
          text: >-
            You might suppose that the thought of meeting his dream-world companions here in the everyday world would make Dickie far too excited to notice the small happenings of the road. It did not. The present was the real thing, after all. The dreams could wait, and simply knowing they were waiting made ordinary things lovelier and more interesting. Dickie delighted in the feel of soft dust beneath his feet. He noticed the wet, shining grass and clover beside the road, the houses growing fewer, and the fields and pastures spreading wider around them. He shared every bit of Beale's joy in traveling on foot.
        - id: ch01-b43
          speaker: narrator
          text: >-
            As the sun was sinking, they caught up with a bent woman who moved slowly along the road. Dickie felt a thrill of real pleasure when he recognized her. This was the woman who had once given True his blue ribbon. True himself was large now, and his coat had grown thick. He seemed to recognize an old friend too. He frisked around her dreadful boots and sniffed eagerly at her withered hand.
        - id: ch01-b44
          speaker: dickie
          text: >-
            Shall we carry her basket for her? I can get out of the pram and manage this last part on foot.
        - id: ch01-b45
          speaker: narrator
          text: >-
            The three traveled on together without needing to talk. Near Orpington, the woman stopped.
        - id: ch01-b46
          speaker: old_woman
          text: "Our roads part here. Thank you kindly. They say a kindness is never wasted."
        - id: ch01-b47
          speaker: mr_beale
          text: "It was nothing. Besides, you gave us the blue ribbon."
        - id: ch01-b48
          speaker: old_woman
          text: "Is that the same dog?"
        - id: ch01-b49
          speaker: mr_beale
          text: "The very same old dog."
        - id: ch01-b50
          speaker: old_woman
          text: "A handsome creature. Well, goodbye."
        - id: ch01-b51
          speaker: narrator
          text: >-
            She took her basket and turned right, then looked back to smile and nod. Dickie's whole body suddenly went rigid, like a pointer spotting a partridge.
        - id: ch01-b52
          speaker: dickie
          text: "Wait! You're the nurse!"
          emotion: surprised
        - id: ch01-b53
          speaker: old_woman
          text: "I've nursed plenty of people in my time."
        - id: ch01-b54
          speaker: dickie
          text: "But you were in the dream. You know you were."
        - id: ch01-b55
          speaker: old_woman
          text: "Dreams are strange things, and the less said, the sooner mended."
        - id: ch01-b56
          speaker: dickie
          text: "But—"
        - id: ch01-b57
          speaker: old_woman
          text: "Keep your eyes open and your mouth shut. That's a sound rule."
        - id: ch01-b58
          speaker: narrator
          text: "She nodded once more and firmly walked away."
        - id: ch01-b59
          speaker: mr_beale
          text: "That wasn't very civil of her, considering—"
        - id: ch01-b60
          speaker: dickie
          text: >-
            Oh, she's all right. May I ride in the pram, Father? I think my foot has a blister. We haven't walked this much lately, have we?
        - id: ch01-b61
          speaker: narrator
          text: >-
            Dickie was full of wonder, but he was even more anxious to stop Beale from wondering too.
        - id: ch01-b62
          speaker: mr_beale
          text: >-
            You're not tired all over, are you? There's a place called Chevering Park that's pretty as a picture, and I thought we might sleep there. My own feet are rather hot, but I can keep going if you can.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Dickie could keep going. That evening they made camp in a deep hollow cushioned with beech leaves. Keeping a careful watch for gamekeepers, he peered over the ridge. A huge smooth slope stretched away, green-gray in the dusk, and rabbits frisked and played across it. Dickie was glad he had not given in to his tiredness and made them stop for the night anywhere else.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Chevering Park was a very beautiful place, and the travelers were fortunate. The dogs stayed good and quiet. No keeper came to disturb their rest, or their masters' rest either. Dickie slept with True in his arms. To lie once again in the cool, still night, looking up at the stars through the branches, felt like taking a deep drink of soft magic.
        - id: ch01-b65
          speaker: dickie
          text: "I can't imagine why anyone invented houses."
        - id: ch01-b66
          speaker: narrator
          text: >-
            Then he fell asleep. Day by day they went slowly through the garden country of Kent, taking short stages and enjoying every step. There was no need to hurry, and they traveled entirely at their ease. Dickie loved every minute of it. He loved every leaf in every hedge and every blade of grass beside the road. Most of all, he loved the quiet nights when he slept beneath the stars with True held safely in his arms.
        - id: ch01-b67
          speaker: narrator
          text: >-
            It was all good. Seven months of work and waiting seemed worth it when they reached the crest of the great South Downs.
        - id: ch01-b68
          speaker: mr_beale
          text: "There's the sea."
        - id: ch01-b69
          speaker: narrator
          text: "A dozen yards farther on, Beale pointed again."
        - id: ch01-b70
          speaker: mr_beale
          text: "And there's Arden Castle."
        - id: ch01-b71
          speaker: narrator
          text: >-
            Gray stone and green ivy lay below them. It was the same castle Dickie had seen on the day when he and Beale hid among the gorse bushes, waiting to burgle Talbot Court. Along one side, red roofs showed where a house had been built among the ruins. As they drew nearer and looked down, Dickie saw two small figures in the green courtyard. Could they possibly be Edred and Elfrida, the cousins he had known in King James the First's time? The nurse had said those children truly belonged to King Edward the Seventh's time, to Nowadays, just as Dickie did.
        - id: ch01-b72
          speaker: narrator
          text: >-
            It hardly seemed possible that they could truly be there. Yet if it was true, how splendid it would be. Think of all the games the three of them could play together. And what a play-place stretched before him. It was green and glorious, with the sea on one side, the broad downs on the other, and the old ruins of Arden Castle standing in the middle.
        - id: ch01-b73
          speaker: narrator
          text: >-
            As they moved through the gorse, though, Beale became quieter and more uneasy.
        - id: ch01-b74
          speaker: dickie
          text: "What's wrong, Father? Tell me."
        - id: ch01-b75
          speaker: mr_beale
          text: "Nothing's wrong."
        - id: ch01-b76
          speaker: dickie
          text: "You're not afraid the Talbots will recognize you, are you?"
        - id: ch01-b77
          speaker: mr_beale
          text: >-
            Not at all. They never saw my face, and I didn't have this beard then.
        - id: ch01-b78
          speaker: dickie
          text: "Then what is it?"
        - id: ch01-b79
          speaker: mr_beale
          text: "We're close to my old father's place, and I can't decide what to do."
        - id: ch01-b80
          speaker: dickie
          text: "I thought we'd agreed to visit him."
        - id: ch01-b81
          speaker: mr_beale
          text: >-
            I don't know. If he's dead and buried, I won't like finding out. I'll tell you that plainly. Still, our family lives a long time, so perhaps he's well. I just don't know.
        - id: ch01-b82
          speaker: dickie
          text: "Shall I go to his house alone and find out whether he's well?"
        - id: ch01-b83
          speaker: mr_beale
          text: >-
            No. If I go, I go myself. If I stay away, I stay away. I simply can't make up my mind.
        - id: ch01-b84
          speaker: dickie
          text: "If he's there, don't you think you ought to visit, in case he wants to see you?"
        - id: ch01-b85
          speaker: mr_beale
          text: >-
            If we're talking about what I ought to do, I ought to have gone home sometime in the last twenty years. But I didn't.
        - id: ch01-b86
          speaker: dickie
          text: "It's your choice. I know what I'd do in your place."
        - id: ch01-b87
          speaker: narrator
          text: >-
            Dickie remembered his own father in old Deptford, leaning on his shoulder as they walked through the winding garden paths. That father had given him the little horse and insisted that Dickie spend his twenty gold pieces however he wished.
        - id: ch01-b88
          speaker: mr_beale
          text: "I don't know, mate. What do you think?"
        - id: ch01-b89
          speaker: dickie
          text: >-
            I think we should go. If he's alive, seeing you would be as good as having three Sundays every week. You were his little boy once, weren't you?
        - id: ch01-b90
          speaker: mr_beale
          text: >-
            Yes. He was wagoner's mate to one of Lord Arden's men. He used to put me up on the great cart horses. He was a fine, strong-looking man.
        - id: ch01-b91
          speaker: narrator
          text: >-
            Hearing the name Arden from Beale gave Dickie a strange feeling, half pleasant and half frightened. It made certain things seem very close.
        - id: ch01-b92
          speaker: dickie
          text: "Let's go."
        - id: ch01-b93
          speaker: mr_beale
          text: >-
            All right, but if it goes badly, don't blame me. There used to be a footpath just ahead. We cut through the woods, cross the eleven-acre meadow on the slant, then keep left along the hedge. That brings us out below Arden Knoll, where my old man lives.
        - id: ch01-b94
          speaker: narrator
          text: >-
            They cut through the woods, crossed the meadow, and followed the hedge until they came out beneath Arden Knoll. A cottage stood there, with a very tidy garden full of bright flowers. A brick walk led from the wooden gate to the front door. Beside that door, an old man sat nodding in a Windsor chair. A brown spaniel lay at his feet, and above his head hung a bird in a wicker cage. It was a hot day. The man was old and tired, and he had fallen asleep in the warmth.
        - id: ch01-b95
          speaker: mr_beale
          text: >-
            I can't do it, mate. I'll walk on a little. Ask him for some water and see how matters stand. Seeing me without warning might upset him. Good old Dad!
        - id: ch01-b96
          speaker: narrator
          text: >-
            Beale hurried away, leaving Dickie by the gate. The brown spaniel noticed True and barked.
        - id: ch01-b97
          speaker: old_beale
          text: "Down, Trusty!"
        - id: ch01-b98
          speaker: narrator
          text: >-
            The old man spoke in his sleep, then woke. His clear eyes, surrounded by wrinkles, fixed on Dickie.
        - id: ch01-b99
          speaker: dickie
          text: "May I have a drink of water?"
        - id: ch01-b100
          speaker: old_beale
          text: "Come in."
        - id: ch01-b101
          speaker: narrator
          text: >-
            Dickie lifted the smooth latch, warm and brown from the sun, and walked up the bricks while the old man slowly turned in his chair.
        - id: ch01-b102
          speaker: old_beale
          text: "The well is over there. Draw a bucket if that poor leg will let you."
        - id: ch01-b103
          speaker: dickie
          text: "I draw water with my arms, not my legs."
        - id: ch01-b104
          speaker: narrator
          text: "Dickie said it cheerfully."
        - id: ch01-b105
          speaker: old_beale
          text: >-
            There's a blue mug on the washhouse window ledge. Bring me a little water after you've had yours, lad.
        - id: ch01-b106
          speaker: narrator
          text: >-
            Dickie's manners were much too good for him to drink first. He pulled the dripping oak bucket up from the cool darkness of the well, found the blue mug, and carried it to the old man filled to the brim. Only after the old man had drunk did Dickie take his own drink. Then he looked around. The whole garden blazed with flowers. There were blush roses and damask roses, sweet william and candytuft, white lilies and yellow lilies, pansies, larkspur, poppies, bergamot, and sage.
        - id: ch01-b107
          speaker: narrator
          text: >-
            The scene looked exactly like something from a play at the Greenwich Theatre. Dickie had seen an old man sit in the sunshine just so, while the wandering son came home. He would not have been surprised if Beale had rushed up the brick path, thrown himself to his knees, and cried, "Father, it is I, your wandering but repentant son! Can you forgive me?" There would have been more about a whole lifetime of repentance making up for the past. If Dickie had been Beale, he would certainly have begun with, "Father, it is I." But he was only Dickie.
        - id: ch01-b108
          speaker: dickie
          text: "Your name is Beale, isn't it?"
        - id: ch01-b109
          speaker: old_beale
          text: "It might be."
        - id: ch01-b110
          speaker: dickie
          text: "I saw your son in London. He told me about your garden."
        - id: ch01-b111
          speaker: old_beale
          text: "I'd have thought he'd forgotten the garden, just as he's forgotten me."
        - id: ch01-b112
          speaker: dickie
          text: >-
            He hasn't forgotten you. He's come to visit, and he's waiting outside to hear whether you want to see him.
        - id: ch01-b113
          speaker: old_beale
          text: "Then he ought to know better. Jim! Jim, come in here this minute!"
        - id: ch01-b114
          speaker: narrator
          text: >-
            Even then Beale did nothing like the prodigal son in the play. He opened the gate without looking. After all those years, his hand still remembered the latch. He walked slowly and heavily up the path.
        - id: ch01-b115
          speaker: mr_beale
          text: "Hello, Dad. How are you?"
        - id: ch01-b116
          speaker: old_beale
          text: "Why, it really is James."
        - id: ch01-b117
          speaker: narrator
          text: >-
            The old man narrowed his eyes as if he had expected someone quite different. They shook hands.
        - id: ch01-b118
          speaker: mr_beale
          text: "The garden looks well."
        - id: ch01-b119
          speaker: old_beale
          text: "It would do well enough if the snails left it alone."
        - id: ch01-b120
          speaker: narrator
          text: >-
            That was all Dickie heard, because he thought it polite to leave them alone. Of course, father and son could not be truly affectionate while a stranger stood there watching. He called from the gate that he would return soon, then followed the cart track toward Arden Castle. This time he went near enough to examine it closely. It was the most beautiful and interesting thing he had ever seen. But however carefully he looked, he did not see the two children.
        - id: ch01-b121
          speaker: narrator
          text: >-
            When Dickie returned, the old man was cooking steak over the kitchen fire. Beale stood at the sink draining summer cabbage through a colander. He worked as naturally as if he had lived in that cottage all his life and had never lived anywhere else. He was in his shirtsleeves already, and his coat and hat hung behind the back door.
        - id: ch01-b122
          speaker: narrator
          text: >-
            Before dinner, the old man put down the frying pan especially to shake Dickie's hand.
        - id: ch01-b123
          speaker: old_beale
          text: "So this is the boy you told me about. Yes, yes."
        - id: ch01-b124
          speaker: narrator
          text: >-
            It was an excellent dinner. Besides the steak and vegetables, there was cold gooseberry pastry. The kitchen felt pleasant and snug, though the white climbing rose around the window made it rather dark. After dinner, the two men sat together in the sunshine and smoked. Dickie busied himself with Trusty and True. Each dog had to learn that the other was not the sort of dog who deserved to be growled at.
        - id: ch01-b125
          speaker: narrator
          text: >-
            True looked especially sulky, with all four paws planted stiffly on the ground. Dickie threw back his head and laughed at him. While he was still laughing, he felt the old man's dry, wrinkled hand slide beneath his chin and tilt his face toward the light.
        - id: ch01-b126
          speaker: old_beale
          text: "Let me look at you. Where did you get that face? What did you say your name was?"
        - id: ch01-b127
          speaker: mr_beale
          text: "His name is Harding. Dickie Harding."
        - id: ch01-b128
          speaker: old_beale
          text: >-
            I'd have called him Dickie Arden. He has a proper Arden face, if you ask me, though my eyes aren't what they were. How would you like to stay here awhile, boy? There's room in the cottage for all five of us. My son James says you've been as good as a son to him.
        - id: ch01-b129
          speaker: dickie
          text: "I'd love to stay."
          emotion: happy
        - id: ch01-b130
          speaker: narrator
          text: >-
            So it was settled. The cottage had two proper bedrooms, one for Beale and one for his father. Dickie slept in a narrow, whitewashed little room that had once been a pantry. Downstairs, the brown spaniel and True slept together on the rag rug beside the kitchen hearth. With all five of them under one roof, everything was as cozy as cozy could be.
        - id: ch01-b131
          speaker: mr_beale
          text: "If we miss any of the other dogs too badly, we can send for them whenever we like."
        - id: ch01-b132
          speaker: narrator
          text: "He sat smoking his pipe in the front garden."
        - id: ch01-b133
          speaker: dickie
          text: "Then you mean to stay for a long time?"
        - id: ch01-b134
          speaker: mr_beale
          text: >-
            I don't know. I was born and raised here. The air tastes good, doesn't it? So does the water. Didn't you notice how different the tea tasted? That's the soft water. And there's the old fellow too. Yes, and one or two other things. I reckon we'll stay awhile.
        - id: ch01-b135
          speaker: narrator
          text: >-
            Dickie was very glad indeed that they meant to stay. Now Arden Castle was close enough for him to see whenever he chose. He had only to walk a couple of hundred yards and look down. Before long, surely, he would see Edred and Elfrida. But one question stayed with him. Would they know him? Would they remember that he and they had once been cousins and friends, long ago when James the First was King?
