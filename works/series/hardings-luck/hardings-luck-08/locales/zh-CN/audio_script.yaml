audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机敏，带着克制的幽默与讲故事的悬念
        timbre: 温暖清亮
        pace: 舒展而有变化
        pitch: 中音
    dickie:
      display_name: 迪基
      tts:
        delivery: 聪明敏感，街头口吻直率，学书中人物说话时郑重夸张
        timbre: 清脆稚嫩
        pace: 稍快，受委屈时断续
        pitch: 中高音
    mr_beale:
      display_name: 比尔先生
      tts:
        delivery: 爽朗随和，热情背后藏着迟疑与盘算
        timbre: 粗粝有力
        pace: 不紧不慢
        pitch: 低音
    amelia:
      display_name: 阿米莉亚
      tts:
        delivery: 麻利爽直，说话干脆，偶尔带点不服气
        timbre: 明亮厚实
        pace: 稍快
        pitch: 中音
    nurse:
      display_name: 老奶妈
      tts:
        delivery: 慈爱爽朗，照料孩子时坚定又耐心
        timbre: 丰满温暖
        pace: 从容
        pitch: 中低音
    old_beale:
      display_name: 老比尔
      tts:
        delivery: 年迈质朴，嘴硬心软，乡间口吻自然
        timbre: 苍老清瘦
        pace: 缓慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 回家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            德特福德的七个月快过完了。迪基做了不少活，学了不少事，也挣了不少钱。比尔先生越来越爱干净，做人也越来越稳当。他就像一株朝着体面阳光使劲生长的草木，又像一座从翻腾的狗海里升起来的灯塔，明亮又神气。
        - id: ch01-b02
          speaker: narrator
          text: >-
            狗生意好得不得了。比尔懂得了纯种犬，也懂得比赛领奖台上的门道。他知道怎么对付犬瘟和狗抽风，什么时候该给病狗服芳香氨酒，什么时候只要少喂一点。银行里的钱越存越多，仿佛把存折都撑破了，只好流进一片叫“统一公债”的大海。与此同时，狗的数目和个头也一起往上长。邻居们耐着性子忍了许多日子，终于开始说闲话。
        - id: ch01-b03
          speaker: mr_beale
          text: >-
            他们倒不是顶嫌那些小狗，虽说小家伙叫起来才更烦人。真正惹他们生气的，是那只可卡犬，还有几只大丹犬。
        - id: ch01-b04
          speaker: dickie
          text: 可卡犬一叫起来，确实很有长劲儿。
        - id: ch01-b05
          speaker: narrator
          text: >-
            迪基抬头看看窗箱里的匍匐珍珠菜。院里的土早让无数只带着橡皮肉掌的狗踩得硬邦邦，再也养不活花。可他把每只窗箱都照料得很好，让每扇窗下面都添上一道明亮的颜色。匍匐珍珠菜、布朗普顿紫罗兰、景天和晚开的郁金香排在窗下，全是从大街的小车摊买来的，长得鲜艳又精神。
        - id: ch01-b06
          speaker: mr_beale
          text: >-
            邻居只要嘴上说找警察，不真去找，我也不能怪他们不讲情面。我就是希望咱们地方大一点。书上说狗每天都该出去活动，可我只有一双手，两条腿，怎么把它们全遛完？你又忙着别的营生，抽不出空。
        - id: ch01-b07
          speaker: dickie
          text: >-
            我也想换个大地方，咱们如今租得起。不过离开这间老屋，我真会舍不得。爸爸，咱们在这儿过过不少好日子，对吧？
        - id: ch01-b08
          speaker: narrator
          text: 他说完叹了口气，像个老人正在回忆遥远的青春。
        - id: ch01-b09
          speaker: mr_beale
          text: >-
            那还用说。可这后院根本不能算让狗活动的地方，怎么都算不上。你说是不是？
        - id: ch01-b10
          speaker: dickie
          text: 那咱们就动身吧。
        - id: ch01-b11
          speaker: narrator
          text: 比尔把烟斗放在膝头，立刻来了精神。
        - id: ch01-b12
          speaker: mr_beale
          text: >-
            这才说到点子上了！我就等你这句话。冬天富勒先生来收房租那晚，我不是说过腿脚发痒，想偶尔上路走走吗？你说等夏天再谈，现在夏天到了。咱们出去走一阵吧，伙计。外头能伸开腿，不会踢着狗，也不会碰倒碗碟。楼上那辆旧童车还好好的，刷点漆就配给公爵坐。咱们两个，再挑几只最好的狗。想想看，绿帘子围着床，自己烤的鲱鱼香喷喷，捡树枝生火，小星星出来朝你眨眼。四下一点声音也没有。你抽烟斗抽到睡着，它从嘴里掉下来，也不用怕烧着床罩。怎么样？
        - id: ch01-b13
          speaker: narrator
          text: >-
            迪基依恋地望着小屋整洁的后墙。窗上挂着雪白挺括的细布帘，帘后还露出收拾齐整的帷幔，窗下开着他亲手照料的花。可另一幅景象也浮上心头。丘陵宽阔的肩膀外，最后的暮光正在雾里淡去。松枝在头顶交错，新亮的星星从枝叶间眨着眼，身下铺满柔软清香的褐色松针。
        - id: ch01-b14
          speaker: mr_beale
          text: 怎么样，伙计？
        - id: ch01-b15
          speaker: dickie
          text: 你想什么时候走，我就什么时候走。要我说，越早越好。
        - id: ch01-b16
          speaker: narrator
          text: >-
            决定一走，比尔马上又找出十来个不能离家的理由。每个理由都有四条腿，还亲热地朝他摇尾巴。他嘴上说着要出发，心里其实全惦记着狗。他实在放心不下这些宝贝，不知道能不能把它们托给阿米莉亚照管。
        - id: ch01-b17
          speaker: amelia
          text: >-
            要是连我都不能信，我可不知道你还能信谁。听你说话，别人准以为这些狗全是小娃娃。
        - id: ch01-b18
          speaker: mr_beale
          text: >-
            对我来说，它们跟娃娃一样宝贝。你搬来住吧，阿米莉亚，我们每星期给你五先令。小家伙会拿铅笔写清楚，每只吃什么，药怎么喂，谁该吃哪一种。
        - id: ch01-b19
          speaker: narrator
          text: >-
            要把事情商量妥当，花了不少工夫。迪基再把每只狗吃什么、用什么药一条条写下来，又花了好一阵。童车的新漆快干了，所有衬衣和袜子也已经洗净补好，摆在厨房窗台上，只等装包。眼看一切就绪，偏偏比尔一天早晨出了门，回来竟牵着一只谁也不认识的腊肠犬。
        - id: ch01-b20
          speaker: mr_beale
          text: >-
            它还没认熟新家，我不能丢下它就走。万一它跑出去，天知道会跑到哪儿，叫人偷走，或者送进流浪狗收容所，那可怎么办？
        - id: ch01-b21
          speaker: narrator
          text: >-
            新狗身子长长的，一身棕毛，亲切又讨人喜欢。吃饱以后，它摇摇尾巴，用清澈温和的眼睛看看迪基，忽然倒立起来。
        - id: ch01-b22
          speaker: mr_beale
          text: >-
            嘿，这小家伙准能挣钱！原来它会表演。我买它的钱花得真值。它肯定还会别的把戏。
        - id: ch01-b23
          speaker: narrator
          text: >-
            它确实会。这只狗受过非凡的教育。第二天早晨，比尔下楼时，阿米莉亚刚擦完门前台阶，正提着水桶进门。他赶紧砰地关上大门，差点撞到她脸上，总算没让新狗逃走。一间狗屋的门开着，过道两边全是伸头张望的狗。
        - id: ch01-b24
          speaker: mr_beale
          text: 你为什么要开那扇门？
        - id: ch01-b25
          speaker: amelia
          text: 不是我开的。
        - id: ch01-b26
          speaker: narrator
          text: >-
            她怎么也不改口。当天下午，比尔在院里抽烟，又像平常那样起身隔窗看狗。他盯着屋里看了一会儿，嘴里嘟囔一句，接着一步蹿向后门，可门闩上了。阿米莉亚正在给洗涤间的地板来一次“彻底刷洗”。她怕有人突然开门，撞上热气腾腾的水桶，也怕门板撞到蹲在地上的自己，所以把门关得严严的。
        - id: ch01-b27
          speaker: narrator
          text: >-
            比尔还是设法从后门进了屋，穿过屋子，又一口气冲出前门。他只来得及看见腊肠犬全速飞奔的背影。用他后来的话说，那东西活像一截棕色太妃糖棍，眨眼便在街角消失了。他们从此再也没见过它。
        - id: ch01-b28
          speaker: mr_beale
          text: >-
            那是打小训练出来的，拿命担保也错不了。我看得清清楚楚，就跟现在看你一样。它先听，再看，见周围没人听见，也没人瞧见，就用后腿站起来，拿两只弯弯的小前爪转动门把手。聪明得像猴子，接着嗖一下就跑了，快得像弓里射出的耙子。它原来的主人准把它卖过好多次，每回都大赚一笔。这么漂亮的狗，教会它开门逃回家，再拿去卖。你明白了吧？这才叫聪明！
        - id: ch01-b29
          speaker: dickie
          text: 这把戏真缺德。你丢了那只狗，我很难过。
        - id: ch01-b30
          speaker: mr_beale
          text: >-
            我当然也不高兴，可玻璃碎了，哭也没用。我最佩服的是这个主意。我就算活到一百岁也想不出来。你也许想得出来，我反正不行。
        - id: ch01-b31
          speaker: dickie
          text: 咱们用不着想。咱们自己挣钱过日子，不必靠骗人吃饭。
        - id: ch01-b32
          speaker: mr_beale
          text: >-
            对，对，好孩子，当然不必。我说的就是这个。咱们绝不会想那种事，也没那个必要。我只是说，那办法真够聪明。
        - id: ch01-b33
          speaker: narrator
          text: 比尔自己受了骗，却还这样佩服骗人的巧计。迪基想了一会儿，轻声问他。
        - id: ch01-b34
          speaker: dickie
          text: 咱们这次徒步旅行，一路都自己付钱吧？不会伸手讨要吧？
        - id: ch01-b35
          speaker: mr_beale
          text: >-
            你还不了解我吗？自从干完集会那一票，做起狗生意，我再也没用顺口溜讨过钱。
        - id: ch01-b36
          speaker: dickie
          text: 也没再跟那个我从没见过的红头发家伙来往？
        - id: ch01-b37
          speaker: mr_beale
          text: >-
            怎么可能？那种下等家伙，咱们可比他强多了。童车已经干透，亮得像你的帽子。明天一早就出发。
        - id: ch01-b38
          speaker: narrator
          text: >-
            第二天清早，他们告别阿米莉亚和狗群，上路了。清晨的空气清新甜美，连德特福德也不例外。阿米莉亚站在门口，望着两人沿街越走越远。等他们来到街角，她还在挥手道别。
        - id: ch01-b39
          speaker: amelia
          text: >-
            往后是会有点冷清。不过屋里有这么多狗，贼肯定不敢进来。
        - id: ch01-b40
          speaker: narrator
          text: >-
            她走进屋，关上大门，屋里的狗叫声立刻此起彼伏，仿佛在向她保证，她连太冷清的滋味都不会尝到。这下迪基和比尔真的走在大路上了。他们要去海边的阿登。另一次人生里，迪基的叔父在那里有一座城堡。等了整整七个月以后，他终于要在那里见到自己的表兄妹。
        - id: ch01-b41
          speaker: narrator
          text: >-
            你也许以为，想到能在这个忙忙碌碌的现代世界，见到梦境世界里一同经历奇妙冒险的伙伴，迪基一定兴奋得顾不上旅途中的小事。其实不会。眼前的日子才是真日子，梦可以等。知道孩子们正在前面等他，反而让平常的一切都更美、更有意思。脚下柔软的尘土，路边沾着露水的青草和苜蓿，身后越来越少的房屋，眼前越来越宽的田野和牧场，全让他心满意足。他也完全懂得比尔靠双腿赶路时有多快活。
        - id: ch01-b42
          speaker: narrator
          text: >-
            太阳渐渐落下时，他们追上一个佝偻着身子、走得很慢的人影。迪基心头涌起真正的欢喜，认出那正是把特鲁的蓝缎带交给他的女人。特鲁如今已经长得高大，皮毛也又厚又密。它似乎同样认出了朋友，绕着女人那双吓人的大靴子蹦来蹦去，又凑过去闻她枯瘦的手。
        - id: ch01-b43
          speaker: dickie
          text: >-
            咱们替她拿一程篮子吧？最后这段路，我自己凑合着能走。
        - id: ch01-b44
          speaker: narrator
          text: 三个人就这样友好而安静地一同赶路。快到奥尔平顿时，女人停了下来。
        - id: ch01-b45
          speaker: nurse
          text: 咱们得在这里分路了。谢谢你们。俗话说，好意总不会白费。
        - id: ch01-b46
          speaker: mr_beale
          text: 不算什么，再说还有那条蓝缎带的情分。
        - id: ch01-b47
          speaker: nurse
          text: 就是这只狗？
        - id: ch01-b48
          speaker: mr_beale
          text: 对，还是原来那只老狗。
        - id: ch01-b49
          speaker: nurse
          text: 真漂亮。好啦，再会。
        - id: ch01-b50
          speaker: narrator
          text: >-
            她拿回篮子，走上右边的岔路，又回头微笑着点点头。迪基忽然全身绷紧，像猎犬看见了鹧鸪。
        - id: ch01-b51
          speaker: dickie
          text: 喂！你就是梦里的老奶妈！
          emotion: surprised
        - id: ch01-b52
          speaker: nurse
          text: 我这辈子照料过的人多着呢。
        - id: ch01-b53
          speaker: dickie
          text: 可是在梦里……你知道的。
        - id: ch01-b54
          speaker: nurse
          text: 梦是怪东西。少说一句，就少惹一点是非。
        - id: ch01-b55
          speaker: dickie
          text: 可是我还有话想问你……
        - id: ch01-b56
          speaker: nurse
          text: 睁大眼睛，闭紧嘴巴，这才是好准则。
        - id: ch01-b57
          speaker: narrator
          text: 她又点点头，坚决转身走了。
        - id: ch01-b58
          speaker: mr_beale
          text: 她可不大客气，亏咱们还替她拿了篮子。
        - id: ch01-b59
          speaker: dickie
          text: >-
            没事，她人挺好。爸爸，我能坐回童车吗？脚上好像磨了个泡。咱们近来没走过这么多路，对吧？
        - id: ch01-b60
          speaker: mr_beale
          text: >-
            你不是浑身都累了吧？前头的契弗灵公园美得像幅画，我本想今晚睡在那里。我的脚掌也有点热，不过你能撑住，我也能。
        - id: ch01-b61
          speaker: narrator
          text: >-
            迪基能撑住。晚上，他们在一道深沟里扎营，地上铺满柔软的山毛榉叶。他小心探头越过沟沿，免得让猎场看守发现。暮色中，一面巨大的缓坡平滑地伸展开来，泛着灰绿色，野兔正在上面追逐嬉戏。迪基庆幸自己没有向疲倦低头，也没有随便停在别处过夜。你可要知道，契弗灵公园确实很美。他们的运气也好，同行的狗儿安安静静，没有一个看守来打扰它们和主人。迪基把特鲁抱在怀里，重新躺进清凉寂静的夜色，隔着树梢仰望星星。这感觉就像喝下了一杯温柔的魔法仙露。
        - id: ch01-b62
          speaker: dickie
          text: 真想不通，人们为什么要发明房子。
        - id: ch01-b63
          speaker: narrator
          text: >-
            说完，他便睡着了。此后他们每天只走一小段，慢悠悠地穿过肯特郡花园般的土地，一点也不赶时间，一路享受每一个脚步。迪基爱旅途的每一刻，爱树篱上的每一片叶子，也爱路边的每一根草。最爱的还是那些宁静夜晚。他把特鲁抱在怀里，在群星下面慢慢睡去。
        - id: ch01-b64
          speaker: narrator
          text: >-
            一切都好极了，一切都是……为了接下来那一阵突然涌上心头的激动，七个月漫长的等待和辛苦劳作完全值得。他们终于登上一道南部丘陵的山脊。就在两人翻过山脊最高处时，比尔突然开了口。
        - id: ch01-b65
          speaker: mr_beale
          text: 看，大海。再往前看，那就是阿登城堡。
        - id: ch01-b66
          speaker: narrator
          text: >-
            城堡静静卧在那里，颜色灰中带绿，古老的石墙爬满常春藤。迪基曾和比尔躺在金雀花丛里，等着去偷塔尔博特庄园，那天看到的正是它。废墟一侧露出几片红屋顶，那里后来在残墙之间盖起了住宅。他们越走越近，迪基从高处看见绿色庭院里有两个小小的人影。会是埃德雷德和埃尔弗里达吗？他曾在詹姆斯一世的时代见过这两个小表亲。老奶妈说，他们其实和他一样，属于爱德华七世的时代，也就是现代。
        - id: ch01-b67
          speaker: narrator
          text: >-
            这件事好得让人不敢相信。要是真的，该有多妙！他们能一起玩多少游戏！眼前简直是一座壮丽的游戏天地，绿色的土地一直铺展开去，一边是大海，一边是宽阔丘陵，中间正是阿登城堡的遗迹。可是他们继续穿过金雀花丛时，迪基发现比尔越来越沉默，也越来越不安。
        - id: ch01-b68
          speaker: dickie
          text: 怎么了？说出来吧，爸爸。
        - id: ch01-b69
          speaker: mr_beale
          text: 没什么。
        - id: ch01-b70
          speaker: dickie
          text: 你怕塔尔博特家的人认出你？
        - id: ch01-b71
          speaker: mr_beale
          text: >-
            才不怕。他们没看见我的脸。再说，那时候我还没留现在这样的胡子。
        - id: ch01-b72
          speaker: dickie
          text: 那到底怎么了？
        - id: ch01-b73
          speaker: mr_beale
          text: >-
            你非要问，那我就说。咱们越来越靠近我老爹住的地方，我却拿不定主意。
        - id: ch01-b74
          speaker: dickie
          text: 咱们不是早说好要去看他吗？
        - id: ch01-b75
          speaker: mr_beale
          text: >-
            我不知道。要是他已经埋在雏菊底下，我真受不了。不过我们家的人都长寿，也许他还好好的。我就是不知道。
        - id: ch01-b76
          speaker: dickie
          text: 要不要我自己去他家，看看他是不是好好的？
        - id: ch01-b77
          speaker: mr_beale
          text: >-
            不行。我去，就得自己去。我不去，就离得远远的。难的就是拿不定主意。
        - id: ch01-b78
          speaker: dickie
          text: >-
            要是他还在呢？只要想到他也许正想见你，你不觉得自己应该去吗？
        - id: ch01-b79
          speaker: mr_beale
          text: 要说应该，这二十年里，我哪一天都该回家。可我一直没回。明白吗？
        - id: ch01-b80
          speaker: dickie
          text: 好吧，这是你自己的事。换成我，我知道自己会怎么做。
        - id: ch01-b81
          speaker: narrator
          text: >-
            这时，记忆把迪基带回另一段人生。他看见自己的父亲靠着他的肩膀，两个人一同走在古老德特福德那座美丽花园里弯弯曲曲的小路上。父亲曾送他一匹小马，也曾坚持让那二十枚金币完全照他自己的心意去花。
        - id: ch01-b82
          speaker: mr_beale
          text: 我真不知道。你觉得该怎么办，伙计？
        - id: ch01-b83
          speaker: dickie
          text: >-
            我觉得咱们去吧。我敢说，只要他还活着，见到你会像一星期过三个礼拜天那么高兴。你从前也是他的小男孩，对不对？
        - id: ch01-b84
          speaker: mr_beale
          text: >-
            对。他从前给阿登勋爵手下的车夫当帮手，常让我骑那些高头拉车马。那时候，他是个挺拔结实的汉子。
        - id: ch01-b85
          speaker: narrator
          text: >-
            从比尔嘴里听见阿登这个名字，迪基心里顿时生出一种非常奇怪的感觉。那感觉一半叫人欢喜，一半又叫人害怕，仿佛过去与现在突然贴在了一起，原先还隔得很远的某些事情，也一下来到了近旁。
        - id: ch01-b86
          speaker: dickie
          text: 咱们去吧。
        - id: ch01-b87
          speaker: mr_beale
          text: >-
            好。不过事情要是全弄坏了，不能怪我。前面不远以前有条小路。穿过矮树林，斜着走过十一英亩草场，再沿树篱往左，就会走到阿登丘下面。我老爹的家就在那里。
        - id: ch01-b88
          speaker: narrator
          text: >-
            他们照着走过矮树林，斜穿草场，再沿树篱来到阿登丘下。那里有间小屋，花园收拾得非常整洁，开满鲜艳的花。一道砖铺小路从木门一直通向前门。门边坐着一位老人，脚下伏着棕色猎犬，头顶挂着一只柳条鸟笼。天气很热，老人年纪大了，也累了，正在温莎椅里一点一点打瞌睡。
        - id: ch01-b89
          speaker: mr_beale
          text: >-
            老天作证，我办不到！我先往前走一点。你去讨口水，顺便看看情形。突然见到我，没准会让他受不住。我的好老爹！
        - id: ch01-b90
          speaker: narrator
          text: >-
            比尔快步走开，留下迪基站在门边。棕色猎犬发现了特鲁，马上叫起来。老人睡梦中说了声“趴下，忠实”，随即睁开眼。那双清亮的老眼嵌在许多皱纹里，直直望向迪基。
        - id: ch01-b91
          speaker: dickie
          text: 能给我一口水喝吗？
        - id: ch01-b92
          speaker: old_beale
          text: 进来吧。井在那边。可怜的小家伙，你的腿要是使得上劲，就打一桶上来。
        - id: ch01-b93
          speaker: dickie
          text: 我打水用胳膊，不用腿。
        - id: ch01-b94
          speaker: old_beale
          text: 洗涤间窗台上有只蓝杯子。你喝完，也给我带一点来，孩子。
        - id: ch01-b95
          speaker: narrator
          text: >-
            迪基很懂礼貌，当然不会自己先喝。他从井下清凉的黑暗里提起那只滴水的橡木桶，又从洗涤间窗台拿来蓝杯，斟得满满的，先送到老人手里。等老人喝过，他才给自己也倒了一杯。随后，他望向满园盛开的花。淡红玫瑰、大马士革玫瑰、须苞石竹、屈曲花、白百合、黄百合、三色堇、翠雀、罂粟、香蜂草和鼠尾草，鲜艳得像在燃烧。
        - id: ch01-b96
          speaker: narrator
          text: >-
            迪基觉得这里像格林尼治剧院的一出戏。他见过一模一样的场面，老人坐在阳光下，浪子回家了。就算比尔沿砖路飞奔而来，扑通跪在老人面前，高喊“父亲，是我，是您误入歧途、如今悔改的儿子。您能原谅我吗？倘若用一生悔恨可以赎罪……”然后再照戏里的样子滔滔不绝，他也不会吃惊。换成迪基，他一定会发表这篇以“父亲，是我”开头的演说。可现在他只是迪基，只能按自己的办法开口。
        - id: ch01-b97
          speaker: dickie
          text: 您姓比尔，对不对？
        - id: ch01-b98
          speaker: old_beale
          text: 也许吧。
        - id: ch01-b99
          speaker: dickie
          text: 我在伦敦见过您儿子。他跟我提过您的花园。
        - id: ch01-b100
          speaker: old_beale
          text: 我还以为，他忘记我，也跟忘记这座花园一样干净。
        - id: ch01-b101
          speaker: dickie
          text: >-
            他没有忘记您。他就是来看您的，现在正在外头等着，想知道您愿不愿意见他。
        - id: ch01-b102
          speaker: old_beale
          text: 那他就该懂点事。吉姆！吉姆！马上给我进来！
        - id: ch01-b103
          speaker: narrator
          text: >-
            即便到了这时候，比尔还是一点不像戏里的浪子。他径直走到门前，连看也不用看就拉开门闩。虽然那么多年没有跨进这扇门，他的手却始终没忘记开门的办法。他没有奔跑，也没有跪下，只是缓慢而沉重地沿砖路走向父亲。
        - id: ch01-b104
          speaker: mr_beale
          text: 你好啊，爸爸。近来怎么样？
        - id: ch01-b105
          speaker: old_beale
          text: 哎呀，真是詹姆斯。还真是你。
        - id: ch01-b106
          speaker: narrator
          text: >-
            老人的语气像是原以为来的会是别人。他们握了手。比尔说花园长得不错，老人承认，要不是有蜗牛，花园确实还过得去。迪基只听到这里便觉得自己应该走开。毕竟有个陌生人站在旁边，父子俩一定没法真正亲热。他在门边高喊一声，说自己待会儿回来，便沿着大车道走向阿登城堡，凑近细细看了一番。那是他有生以来见过最美、最有意思的东西，可他始终没有看见那两个孩子。
        - id: ch01-b107
          speaker: narrator
          text: >-
            迪基回来时，老人正在厨房炉火上煎牛排。比尔站在水槽边，用漏盆沥刚煮好的夏甘蓝。他做起这些事自然极了，就像一辈子都住在这里，从来没有去过别处。他已经脱下外套，只穿着衬衫，外套和帽子一起挂在后门后面。老人看见迪基回来，还特意放下手里的煎锅，同他握手。
        - id: ch01-b108
          speaker: old_beale
          text: 原来这就是你提过的孩子。好，好。
        - id: ch01-b109
          speaker: narrator
          text: >-
            午饭很好吃，除了牛排和蔬菜，还有一道凉醋栗馅饼。白蔷薇绕着窗子攀爬，把厨房遮得有点暗，可屋里仍旧舒适又温馨。饭后，父子俩坐在阳光里抽烟。迪基则忙着教棕色猎犬和特鲁明白，它们谁也不是一条应该挨对方低吼的狗。特鲁闹别扭地板着脸，四只脚僵僵地撑在地上，逗得迪基仰头大笑。就在这时，老人干燥多皱的手伸过来，托住了他的下巴。
        - id: ch01-b110
          speaker: old_beale
          text: 让我看看你。你这张脸是从哪儿来的？你说自己叫什么？
        - id: ch01-b111
          speaker: mr_beale
          text: 他姓哈丁，叫迪基·哈丁。
        - id: ch01-b112
          speaker: old_beale
          text: >-
            要是问我，我准说他叫迪基·阿登。依我看，这分明是一张阿登家的脸。不过我的眼睛不如从前了。孩子，你们愿不愿意留下陪我住一阵？屋里住得下咱们五个。詹姆斯告诉我，你对他就像亲儿子一样好。
        - id: ch01-b113
          speaker: dickie
          text: 我很愿意。
          emotion: happy
        - id: ch01-b114
          speaker: narrator
          text: >-
            事情就这么定了。屋里共有两间卧室，分别给比尔和他的父亲住。迪基睡在一条狭窄、刷得雪白的小屋里，那里从前是存放食物的储藏室。棕色猎犬和特鲁就在厨房过夜，一同睡在那张碎布拼成的炉毯上。屋里的一切都舒适极了，简直不能再舒适。
        - id: ch01-b115
          speaker: mr_beale
          text: >-
            要是没有那些狗实在熬不住，咱们随时可以叫人送几只过来。
        - id: ch01-b116
          speaker: dickie
          text: 这么说，你打算住很久？
        - id: ch01-b117
          speaker: mr_beale
          text: >-
            不知道。我在这里出生，也在这里长大。这里的空气尝起来很舒服，对不对？水也好。你没发现这里泡的茶，喝起来和别处完全不同吗？那就是软水的味道。还有老爷子……对，也还有一两件别的事。嗯，我估摸着，咱们会在这里住上一阵。
        - id: ch01-b118
          speaker: narrator
          text: >-
            迪基高兴极了。如今他就在阿登城堡近旁，什么时候想看，只要走上两百码，就能从高处望见它。不久，他还会真正见到埃德雷德和埃尔弗里达。可他们会认出他吗？这才是此刻最大的问题。他们会不会记得，在詹姆斯一世做国王的年代，自己和迪基曾经是表亲，也是一起冒险的朋友？
