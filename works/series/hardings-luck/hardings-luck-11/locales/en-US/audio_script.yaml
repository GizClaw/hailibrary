  chapters:
    - id: ch01
      title: Lord Arden
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            There was plenty of talking and letter-writing before anyone could say for certain who Lord Arden was. If Edred and Elfrida's father had chosen to fight the claim, the lawyers might have stayed busy for years. They could have spilled seas of ink and thundered out endless speeches over the question. But the man everyone called Lord Arden was honest. He was more anxious for Dickie to receive everything that belonged to him than he was to keep the title himself. With no quarrel to feed on, even the lawyers had to finish sooner than they might have liked.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Edred watched his father do everything he could to discover the truth about Dickie's birth. He saw that his father was willing to surrender what he had always thought was his own, if the evidence proved otherwise. That made Edred deeply glad he had done his duty. He had rescued his cousin without meanness or hesitation, and had brought no dishonor on the Arden name. When Elfrida heard the whole story of that night's rescue, she admired her brother until he was almost uncomfortable. From then on she looked up to him and asked his advice about everything. A sister's respect is pleasant, especially when people have rather got into the habit of saying that she is better and cleverer than you are.
        - id: ch01-b03
          speaker: lord_arden
          text: >-
            If anything proves that I am Lord Arden after all, you won't leave us, Dickie. You shall attend school with Edred, and I will bring you up as my own son.
        - id: ch01-b04
          speaker: narrator
          text: >-
            So Dickie lived at Arden Castle like Lord Arden's own son, and loved the place more each day. He no longer wanted to escape into the time of James the First. Your own time feels most like home when you are happy in it. At miserable Deptford, Dickie had longed for the past as an unhappy man longs for a distant country. At Arden, he was happy.
        - id: ch01-b05
          speaker: narrator
          text: >-
            His life in the old world had taught him how to take his place among the Ardens and their friends. He felt no more awkward with them than he did with the Beales and their friends. People called him a little shy, but praised his beautiful manners. They remembered that he had once been a tramp and declared that Lord Arden had done wonders with him. So Lord Arden received all the credit for the lessons Dickie's tutors had given him during the reign of James the First.
        - id: ch01-b06
          speaker: narrator
          text: >-
            It is not natural for a child to spend every moment brooding over yesterday or tomorrow. A child lives in the present, and Dickie lived fully in his present at Arden. Lord Arden bought him a pony, so his lame foot hardly hindered him at all. Edred and Elfrida had a donkey-cart. Between the pony and the cart, the three children could set off together on all sorts of interesting expeditions.
        - id: ch01-b07
          speaker: narrator
          text: >-
            One day they drove over to Talbot Court. They saw the secret place where Edward Talbot had hidden his confession after stealing the Arden baby three generations earlier. They also studied the portrait of the Lady Talbot who had been born Miss Arden. She wore rose-colored brocade over a green silk petticoat. Her powdered hair was dressed high above a great cushion. Yet beneath all that finery, her eyes and mouth were the eyes and mouth of Dickie from Deptford.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Lady Talbot played hide-and-seek with the children and served a splendid tea in the yew arbor. Then she sent Edred and Elfrida to gather peaches for the journey home.
        - id: ch01-b09
          speaker: lady_talbot
          text: >-
            I'm glad you refused to let me adopt you, Richard. Just when I had grown completely attached to you, you would have discovered your real family. What would your poor foster mother have done then?
        - id: ch01-b10
          speaker: dickie
          text: >-
            I would have stayed if I could. I liked you ever so much, even then. You look very like the Lady Arden whose husband was imprisoned in the Tower because of the Gunpowder Plot.
        - id: ch01-b11
          speaker: lady_talbot
          text: >-
            So people tell me. But how could you know that?
        - id: ch01-b12
          speaker: dickie
          text: >-
            I don't know. You simply do look like her.
        - id: ch01-b13
          speaker: lady_talbot
          text: >-
            You must have seen her portrait in the National Portrait Gallery. She was a Delamere, and that was my name before I married. We belong to the same family, you see.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Dickie put his arms around Lady Talbot's waist and rested his head on her shoulder. He was remembering the mother from the old days, the one who wore a ruff and hoop.
        - id: ch01-b15
          speaker: dickie
          text: "I wish you truly had been my mother."
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: "Lady Talbot held him tenderly."
        - id: ch01-b17
          speaker: lady_talbot
          text: "My dear little Dickie, I wish it even more than you do."
          emotion: sad
        - id: ch01-b18
          speaker: dickie
          text: >-
            There are things a fellow can't be sure about, and honorable secrets he mustn't tell. You could tell your own mother, though. When you haven't one, you have to decide everything alone.
        - id: ch01-b19
          speaker: lady_talbot
          text: "Will you let me help?"
        - id: ch01-b20
          speaker: narrator
          text: >-
            With his head still on her shoulder, Dickie was tempted for one wild moment to tell Lady Talbot everything from beginning to end. Then he knew she could not understand it or even believe it. No grown-up person could. A fellow's own mother might perhaps have believed such a secret, though even she might not.
        - id: ch01-b21
          speaker: dickie
          text: >-
            I can't tell you. I don't think I want to be Lord Arden. Well, part of me wants it frightfully, because the things the Ardens did in history are splendid. But I don't want to turn anyone out. Edred saved me from those people. It feels hateful to think they may lose their home just because I appeared. Sometimes I feel I cannot bear it.
          emotion: sad
        - id: ch01-b22
          speaker: lady_talbot
          text: >-
            Dear child, of course you feel that way. But don't keep thinking about it. You are still a little boy. Be cheerful and happy, and leave grown-up troubles to the grown-ups.
          emotion: calm
        - id: ch01-b23
          speaker: dickie
          text: >-
            Somehow I've always had grown-up troubles to think about. There was Beale, and then everything else.
        - id: ch01-b24
          speaker: lady_talbot
          text: "Was Beale the man you ran away from me to find?"
        - id: ch01-b25
          speaker: dickie
          text: "Yes. I was responsible for him."
        - id: ch01-b26
          speaker: lady_talbot
          text: "And you aren't responsible for him now?"
        - id: ch01-b27
          speaker: dickie
          text: >-
            No. I've settled Beale in life. Married people are responsible for each other, so now I only have my own affairs to manage, and the Ardens. I don't know what I should do.
        - id: ch01-b28
          speaker: lady_talbot
          text: >-
            There is nothing for you to do but enjoy yourself, learn your lessons, and be happy. Don't trouble your head. Forget that you ever had responsibilities.
          emotion: calm
        - id: ch01-b29
          speaker: dickie
          text: "I'll try."
        - id: ch01-b30
          speaker: narrator
          text: >-
            Then Edred and Elfrida returned with their peaches. There was nothing left to say except thank you and goodbye.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Exploring the old smugglers' caves was as exciting and delightful as cave exploring always is. It turned out that several old men in the village had heard their fathers speak of those caves and of the smuggling done in that part of the country long ago. They had never thought it their place to mention such matters. Deep down, perhaps they did not more than half believe the old stories themselves.
        - id: ch01-b32
          speaker: mr_beale
          text: >-
            Why didn't you ask me? I could've told you where the caves were. Not that I would have, mind. You might've broken your precious necks.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Of course the children desperately wanted the brickwork opened so the stream could run out into daylight. Their father thought the work would cost too much. Edred and Elfrida kept worrying and bothering him, though always in the gentlest and politest way. At last a cheerful gentleman in spectacles came down to stay for two days and took their side. The moment he admitted he was an engineer, the children gave him no peace. He seemed quite pleased when they led him away to inspect the caves.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The engineer explained that removing the simple dam would send the water back toward its old channel. Knocking out the brickwork would be easy. Once it was gone, the stream could find its former path if that channel was still open. From there it ought to run beneath the arch that Edred and Elfrida insisted was buried under a mound below the Castle.
        - id: ch01-b35
          speaker: engineer
          text: "You two know a great deal about this, don't you?"
        - id: ch01-b36
          speaker: boy_cousin
          text: "Yes."
        - id: ch01-b37
          speaker: narrator
          text: >-
            They all went down to the mound, where the engineer poked it and prodded it from different sides. At last he said the children might not be far wrong. Beale and another man arrived with spades and began to dig. Before long, the old arch appeared, as sound as ever. Everyone exclaimed over it and admired it before climbing back to the caves.
        - id: ch01-b38
          speaker: narrator
          text: >-
            It was a grand moment when the last bricks came away and daylight poured inside the cave. Only the dam remained between the imprisoned water and the sunshine. The children could hardly choose where to stand. Should they stay inside and watch the dam come down, or wait outdoors to see the stream burst from the hillside? In the end, the boys remained in the cave. Elfrida and her father sat outside on a hillock among slender harebells, wild thyme, and sweet, lavender-colored wild roses. Their eyes never left the dark opening. They waited, and waited, and waited for what seemed a very long time.
        - id: ch01-b39
          speaker: girl_cousin
          text: >-
            Daddy, if it turns out that you aren't Lord Arden, will you mind terribly?
        - id: ch01-b40
          speaker: narrator
          text: "He paused, then chose to answer her honestly."
        - id: ch01-b41
          speaker: lord_arden
          text: >-
            Yes, I shall mind terribly. That is exactly why we must do everything possible to prove whether Dickie is the true heir. Then, whichever of us holds the title, we will never blame ourselves for leaving anything undone to secure his rights, whatever they may be.
        - id: ch01-b42
          speaker: girl_cousin
          text: "And yours too, Daddy."
        - id: ch01-b43
          speaker: lord_arden
          text: >-
            Mine too. If Dickie is Lord Arden, I shall probably become his guardian, and we can all live here together just as before. I will simply be plain Arden again.
        - id: ch01-b44
          speaker: girl_cousin
          text: "I believe Dickie really is Lord Arden."
        - id: ch01-b45
          speaker: narrator
          text: >-
            Elfrida might have gone on to explain all her reasons, including the whole story the Mouldiwarp had told Dickie. Before she could, a roaring, rushing sound came from deep inside the cave. A streak of shining silver flashed across the black opening. Then imprisoned splendor burst free. The stream leaped into the daylight and raced both ways across the dry grass until tiny waves began to lap against their hillock.
        - id: ch01-b46
          speaker: girl_cousin
          text: "They look like waves around sand castles!"
          emotion: surprised
        - id: ch01-b47
          speaker: narrator
          text: >-
            The water spread into a lake that grew wider and wider. After a while, it seemed to gather itself together and remember what a stream ought to do. It began creeping down the slope, winding in and out among the hillocks and deepening as it went.
        - id: ch01-b48
          speaker: lord_arden
          text: >-
            Come along, childie. Let's run for the moat. If we go as fast as we can, we'll arrive first.
        - id: ch01-b49
          speaker: narrator
          text: >-
            He caught his little daughter's hand, and they ran as hard as they could. They did arrive first. The stream seemed to know its own mind better with every yard as it recognized the old road. By dinner-time, water covered all the grass around the Castle. At tea-time, the moat stood more than a foot deep. When they rose next morning, a splendid moat fifty feet wide surrounded the Castle. A stream ran away from it in a rather crooked zigzag, but it truly ran. It entered the lower arch beneath the mound, vanished from sight, and continued underground to the sea.
        - id: ch01-b50
          speaker: narrator
          text: >-
            They enjoyed their new moat for one whole day. Then the stream was dammed again and condemned to flow underground until the following spring. Before they could release it safely, the Castle walls had to be examined. Concrete would need to be laid along the base, or the water might creep through the stone and slowly undermine the foundations.
        - id: ch01-b51
          speaker: lord_arden
          text: >-
            It seems this will be very expensive, and perhaps I ought not to do it. But I cannot resist. I shall have to save money elsewhere.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Elfrida overheard him speaking to the engineer. She hurried to the cave, where Dickie and Edred were fishing, and told them what she had heard.
        - id: ch01-b53
          speaker: girl_cousin
          text: >-
            We must try once more for the treasure. Whoever owns the Castle will want to restore it, and there are pictures showing how it used to look. All the cottages need rebuilding too. Dickie, you're so clever. Please think of a way to find it.
        - id: ch01-b54
          speaker: narrator
          text: "Dickie thought for a while."
        - id: ch01-b55
          speaker: dickie
          text: >-
            You saw a picture of the treasure being carried into the secret room once, didn't you?
        - id: ch01-b56
          speakers: [boy_cousin, girl_cousin]
          ensemble: duo
          text: "Yes, we did."
        - id: ch01-b57
          speaker: dickie
          text: "Then why didn't you travel to that time and watch it happen?"
        - id: ch01-b58
          speaker: boy_cousin
          text: >-
            We didn't have the right clothes. All our magic depended on clothes.
        - id: ch01-b59
          speaker: dickie
          text: "Mine doesn't. Shall we go?"
        - id: ch01-b60
          speaker: boy_cousin
          text: "The picture had soldiers in it, and there was fighting."
        - id: ch01-b61
          speaker: girl_cousin
          text: >-
            I'm not afraid of soldiers. And you aren't afraid of anything, Edred. You know you aren't.
        - id: ch01-b62
          speaker: dickie
          text: >-
            You couldn't be afraid after coming into the cave at midnight to save me. Come close together. I'll spread out the moon-seeds.
        - id: ch01-b63
          speaker: narrator
          text: >-
            The three stood close. Before Dickie scattered the seeds, he gripped several other things tightly in his left hand. Then he wished them beside the men who were hiding the treasure, and in an instant they were there.
        - id: ch01-b64
          speaker: narrator
          text: >-
            All three found themselves pressed close together inside a niche in a dark, narrow passage. Men kept passing them with heavy chests, great leather sacks, and bundles tied in straw or knotted handkerchiefs. The men wore their hair long, and their clothes belonged to the reign of Charles the First. The children's clothes had changed to match that time as well. Small swords now hung at the boys' sides.
        - id: ch01-b65
          speaker: narrator
          text: >-
            At last the final bundle went by and the last chest landed with a heavy thump on the stone floor of a room beyond. The children heard a door close and a key turn. Then all the men came back together, and the children followed them along the passage. Torchlight slowly gave way to daylight. Near the end, the path climbed so steeply and the opening became so low that everyone had to crawl on hands and knees. No one could possibly have carried the chests through that space. They must have been pushed from behind or dragged ahead.
        - id: ch01-b66
          speaker: narrator
          text: >-
            The opening came out through the courtyard wall. The children turned to study it. In this time the courtyard was a smooth lawn, not the rough, daisy-covered patch they knew, with broken stone and masonry scattered everywhere. Two men lifted a great stone and staggered under its weight. They laid it across the passage floor where the opening met the grass. A second stone followed, and then another. Each fitted into place like a piece in a Chinese puzzle. Mortar or cement showed at the edges. Once the last stone was replaced, no one could distinguish that patch from the rest of the wall. Only the trampled, broken grass in front suggested that anyone had worked there.
        - id: ch01-b67
          speaker: captain
          text: >-
            Bring food and scatter pieces here, so it looks as though the men ate on this spot. Trample the grass in other places too. I give those Roundhead dogs one more hour before they break our last defense. Children, find your mother. You must not stay here.
        - id: ch01-b68
          speaker: narrator
          text: >-
            Edred and Elfrida knew the way from the picture and started off.
        - id: ch01-b69
          speaker: dickie
          text: "Don't wait for me. I still have something to do."
        - id: ch01-b70
          speaker: narrator
          text: >-
            The soldiers went to fetch food. Dickie crept to the stones he had watched so carefully, knelt, and scratched one of them with a large nail he had brought. When the nail grew blunt, he took another. He hid in the chapel doorway as the soldiers returned.
        - id: ch01-b71
          speaker: captain
          text: "Every man to his post, and God save us all!"
        - id: ch01-b72
          speaker: narrator
          text: >-
            Once the food was scattered, the men hurried to their posts, armor clattering as they went. Dickie knelt and scratched again. The air was full of shouting, gunfire, and the clash of armor. Above it all came the cries of wounded men. Every five minutes, a shattering blow struck the defenses. It sounded like a giant mallet beating against a giant drum, and it came again and again. Dickie finished his mark as quickly as he could. It lay so low that it was almost underground. He pressed the grass back over it until the roots hid the scratches, brushed the pale stone dust from his hands, and stood.
        - id: ch01-b73
          speaker: narrator
          text: >-
            He had found the treasure and marked its hiding place. Whether or not he was Lord Arden, he had restored the fallen fortunes of the house. Now he needed to find his cousins and carry them home.
        - id: ch01-b74
          speaker: narrator
          text: >-
            He turned toward the way they had gone. Arden men crowded beneath the great gate tower. At a window to his right, a lady leaned out, pale with terror. Edred and Elfrida's white faces were beside hers. Dickie ran for the door below them, but he was too late.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Another heavy blow landed. This one ended in a tremendous crash and a roar of voices. Blue sky showed through the arch where the high gates had stood. Beneath it, men screamed and struggled. Steel flashed, and brave blood shone scarlet.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Dickie forgot the door, his cousins, the treasure, and the need to return home. He saw only the house he loved invaded by men he hated, while men he loved poured out their blood to defend it.
        - id: ch01-b77
          speaker: narrator
          text: >-
            He drew his little sword and rushed toward the swaying fight.
        - id: ch01-b78
          speaker: dickie
          text: "An Arden! An Arden!"
          emotion: angry
        - id: ch01-b79
          speaker: narrator
          text: >-
            The enemy leader had just cut through the Arden men and placed one foot on the courtyard path. That first step was his last. He was a large, heavy man in a leather coat and steel cap. He stared at the small figure racing toward him, with the courage of the Ardens burning in his blue eyes, and laughed.
        - id: ch01-b80
          speaker: narrator
          text: >-
            Dickie lunged exactly as his tutor had taught him. His small sword was no tailor's ornament made to complete a court costume. It was true steel. The point went straight and sure into the rebel's heart. The large man fell, wrenching the blade from Dickie's hand as he dropped. The enemy answered with a roar of fury. The Arden men shouted back in pride and triumph. Men struggled all around the little boy as the fight swayed across the courtyard. In the next moment, someone seized him and tied his hands with a handkerchief. Dickie stood there breathless, trembling, and fiercely proud.
        - id: ch01-b81
          speaker: dickie
          text: >-
            I killed a man. I killed him for the King and for Arden.
        - id: ch01-b82
          speaker: narrator
          text: >-
            They locked him in the fuel shed. Pride and anger filled him, and at first he could think only of that one good thrust for the cause he believed was right. Then he remembered his cousins. He had brought them here, and he must take them safely home.
        - id: ch01-b83
          speaker: narrator
          text: >-
            On a quiet evening beside the road, Beale had shown him how to loosen hands tied behind his back. Dickie remembered that lesson now and worked at the knot, though it went very slowly. All the while he kept thinking about how he might escape. He knew the fuel shed well. Its door was strong, with a beech bar across the outside. But unlike the rest of the Castle, the roof was neither tile nor lead. It was thatched. Dickie knew something about that kind of roof. He had watched the men thatching the oast-house beside the Medway, and he remembered how they fastened it. When his hands finally came free, he stood and reached upward, feeling for the pins that held the thatch in place.
        - id: ch01-b84
          speaker: narrator
          text: >-
            Then his hands fell to his sides. Even if he escaped through the roof, how could he find Edred and Elfrida? The rebels would only catch him and lock him somewhere stronger. He stretched out on the floor and lay perfectly still in despair. This was the end of all his cleverness. He had brought two trusting children into deadly danger, then forgotten them because his anger had driven him to defy the Roundheads. By giving way to his hatred, he might have sacrificed them both. He lay alone in the dark fuel house for a long while. If he cried a little, the darkness kept anyone from seeing.
        - id: ch01-b85
          speaker: narrator
          text: >-
            Yet he kept thinking and searching for a way out. Then something began scratching at the corner of the shed. Dickie sat up and held his breath. Was someone digging in to help him? No, it must be a rat. A voice spoke so close that he almost cried out.
        - id: ch01-b86
          speaker: mouldiwarp
          text: >-
            Stay where you are, lad. Stay still. It's only me, old Mouldiwarp of Arden. You're a bold lad, by my faith. There was never a better Arden among them all.
        - id: ch01-b87
          speaker: dickie
          text: >-
            Oh, dear Mouldiwarp, please help me! I led them into this danger. Help me take them home safely. Please, please!
          emotion: fearful
        - id: ch01-b88
          speaker: mouldiwarp
          text: >-
            So I will. There's no sense getting in a fluster, not for a lad who's faced death as you have. I've dug a little tunnel in this corner. Crawl across the floor like a cat and you'll feel it. Follow it, and you'll come out safely.
          emotion: calm
        - id: ch01-b89
          speaker: narrator
          text: >-
            Dickie moved toward the voice and found a hole just large enough for him to enter on hands and knees.
        - id: ch01-b90
          speaker: mouldiwarp
          text: >-
            I'll go first, and you follow. There's nothing to fear, Lord Arden.
        - id: ch01-b91
          speaker: dickie
          text: "Am I truly Lord Arden?"
          emotion: surprised
        - id: ch01-b92
          speaker: mouldiwarp
          text: >-
            As sure as I'm alive. Tomorrow morning your uncle will give you all the lawyers' reasons. Come now. There's no time to waste.
        - id: ch01-b93
          speaker: narrator
          text: >-
            Dickie went down on his hands and knees behind the Mouldiwarp. He crept downward through soft earth that smelled sweet and fresh, then crawled along the narrow tunnel before climbing upward again. When he came out, he was back in the courtyard. Edred and Elfrida were already there. The three children hugged one another with relief, then turned together to the Mouldiwarp.
        - id: ch01-b94
          speakers: [dickie, boy_cousin, girl_cousin]
          ensemble: chorus
          text: "How can we get home?"
        - id: ch01-b95
          speaker: mouldiwarp
          text: >-
            By the old way. Get in, all of you. Swan carriages travel between times as easily as they travel between places. We seldom use them because those contrary swans refuse to turn invisible, no matter what magic we try. Everyone can see them. But in danger like this, we cannot be choosy. Hurry. This is the last you'll see of me. Go before the soldiers notice you.
        - id: ch01-b96
          speaker: narrator
          text: >-
            A swan carriage swept down from the sky. All three children squeezed inside, and the white wings lifted them into the air. Only one Roundhead sentry saw them. He sensibly raised the alarm, but when the guard found nothing in the sky, they kicked him for his trouble.
        - id: ch01-b97
          speaker: narrator
          text: >-
            The swans flew too quickly for the children to see their course. When they slowed, there was still nothing to see because darkness surrounded them, and the air was bitterly cold. At last a light appeared ahead. The carriage settled inside the cave on the very spot where Dickie had arranged the moon-seeds, Tinkler, and the white seal.
        - id: ch01-b98
          speaker: narrator
          text: >-
            With a rush of wings, the carriage vanished back into the cave. The children hurried downhill, though Dickie's lame foot made their pace slow. The boy who had killed a Cromwell soldier with his sword had not been lame.
        - id: ch01-b99
          speaker: narrator
          text: >-
            In the courtyard, Dickie proudly led them to the stones beside the ruined arch that had once been the chapel door. He bent to search, but there was no sign of the letters he had scratched while the Roundheads battered the Castle gates.
        - id: ch01-b100
          speaker: boy_cousin
          text: "Aha! I noticed the place too."
        - id: ch01-b101
          speaker: boy_cousin
          text: >-
            It's the fifth stone from the chapel door, beneath the little window with the Arden arms carved over it. No other window has those arms. I'll fetch the cold chisel.
        - id: ch01-b102
          speaker: narrator
          text: >-
            When Edred returned, Dickie was kneeling beside the wall. He had dug with his bare hands until he uncovered the marked stone. There it was: 19, R.D., 08. But the nail had slipped while he made the nine, so it looked more like 15, R.D., 08.
        - id: ch01-b103
          speaker: dickie
          text: "There. Those are the marks I scratched."
        - id: ch01-b104
          speaker: boy_cousin
          text: >-
            Those marks? They've always been there. We found them when we first dug around looking for the treasure. Didn't we, Elf?
        - id: ch01-b105
          speaker: girl_cousin
          text: "Yes, we did."
        - id: ch01-b106
          speaker: dickie
          text: "Well, I scratched them anyway. Now let me use the chisel."
        - id: ch01-b107
          speaker: narrator
          text: >-
            Edred agreed. He knew how skillful Dickie was with tools. Dickie had made Elfrida a workbox and Edred a tool chest, each with a perfectly fitted lid. Now he worked the chisel between the stones. He pried at one point, then another, until the stone edged forward. Together they gripped it and dragged it free. Darkness opened behind it. Dickie thrust in his arm.
        - id: ch01-b108
          speaker: dickie
          text: "I can touch the door. We found it."
          emotion: happy
        - id: ch01-b109
          speaker: girl_cousin
          text: "Let's bring Father. He'll enjoy this so much."
        - id: ch01-b110
          speaker: narrator
          text: >-
            Elfrida burst into the library. Her father sat among lawyers' letters and papers with the lawyer himself, a stout, cheerful gentleman in tweed. He looked nothing like the thin, gloomy lawyers dressed in black whom stories usually describe.
        - id: ch01-b111
          speaker: girl_cousin
          text: "Daddy, please come. We've found the treasure."
        - id: ch01-b112
          speaker: lord_arden
          text: "What treasure? How often must I ask you not to interrupt while I'm busy?"
        - id: ch01-b113
          speaker: girl_cousin
          text: >-
            I only thought it would amuse you. We found a place that was bricked up, and there's a door behind it. I'm almost sure that is where they hid the treasure when Cromwell's wicked men captured the Castle.
        - id: ch01-b114
          speaker: lord_arden
          text: >-
            There is a legend about such a treasure. You must forgive us, Mr. Roscoe. Family excitement sometimes makes us forget our manners. Elfrida, you haven't even said good morning.
        - id: ch01-b115
          speaker: girl_cousin
          text: >-
            Good morning, Mr. Roscoe. I thought this was the engineer's day, not the lawyer's. Please forgive me. You wouldn't mind me rushing in if you knew how much the treasure matters to our family's fortunes.
        - id: ch01-b116
          speaker: narrator
          text: "The lawyer laughed."
        - id: ch01-b117
          speaker: mr_roscoe
          text: >-
            Buried treasure interests me greatly. If Lord Arden permits it, helping with the search would be a real treat.
        - id: ch01-b118
          speaker: girl_cousin
          text: >-
            We aren't searching now because we've found it. We searched for ages. Oh, Daddy, please come. You'll be sorry later if you don't.
        - id: ch01-b119
          speaker: lord_arden
          text: "Very well, if Mr. Roscoe doesn't mind."
        - id: ch01-b120
          speaker: narrator
          text: >-
            The two men followed Elfrida, believing they were only being kind by joining a childish game of make-believe. Their feelings changed the moment they reached the wall. Dickie and Edred had removed two more stones, and through the opening everyone could see the dusty gray surface of a wooden door. The men no longer smiled at an imaginary treasure hunt. They helped until every stone was out and the whole hidden door stood revealed. The lock plate carried the Arden arms. They pulled and shook the door, but it would not move.
        - id: ch01-b121
          speaker: lord_arden
          text: "We shall need a locksmith."
        - id: ch01-b122
          speaker: girl_cousin
          text: >-
            What about the large key with the Arden arms, the one in the iron box? Mightn't that key fit?
        - id: ch01-b123
          speaker: narrator
          text: >-
            Someone flew to fetch the key. The old lock needed plenty of oil and even more patience before it would consent to move, but at last the key turned. Beyond the door lay a passage so low and choked with dust that it hardly looked like a passage at all. Cobwebs hung across it in a thick curtain. The party brought brooms and lanterns and slowly forced a way through. There was plenty of coughing, choking, and sneezing before they reached the treasure-room door. The other old key fitted that lock, and it opened too.
        - id: ch01-b124
          speaker: narrator
          text: >-
            The treasure was truly there, exactly as the children had seen it. Chests and boxes filled the room beside leather sacks and bundles wrapped in straw and handkerchiefs.
        - id: ch01-b125
          speaker: narrator
          text: >-
            Mr. Roscoe had come by bicycle. Now he mounted it again and raced away at top speed. He meant to alert the bank at Cliffville, have its officers come and collect the treasure, and bring policemen to watch over everything until it could be secured inside the bank vaults.
        - id: ch01-b126
          speaker: mr_roscoe
          text: >-
            I am enough of a child to be excited, and enough of a cautious lawyer to ask you not to bring out a single thing until I return. Someone must guard this entrance until the police arrive.
        - id: ch01-b127
          speaker: narrator
          text: >-
            So when the treasure finally saw daylight, it did so beneath the eyes of policemen and bank managers. All the servants and all the family gathered to watch it being carried out. The Beales were there, and so was True. News of the strange events at the Castle had already spread. Half the village crowded in through the gate, which no one was guarding now that every eye had turned toward the treasure.
        - id: ch01-b128
          speaker: narrator
          text: >-
            It was a glorious treasure. Gold and silver plate shone among jewels and beautifully made suits of armor. Beside them lay a heap of old parchments that did not look nearly so splendid. Yet Mr. Roscoe said those papers were worth more than all the glittering objects put together. They were the title deeds to great estates that had once belonged to Arden.
        - id: ch01-b129
          speaker: mr_beale
          text: >-
            Now let's give Lord Arden a cheer! Long may he enjoy what he's found, says I. Hip, hip, hooray!
          emotion: happy
        - id: ch01-b130
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: "Hooray!"
          emotion: happy
        - id: ch01-b131
          speaker: narrator
          text: "The crowd cheered with all its heart."
        - id: ch01-b132
          speaker: lord_arden
          text: >-
            Thank you, all of you. I thank you from my heart. You will share this good fortune. The old lands are for sale, and we shall buy them back. Every house on Arden land will be made sound, dry, and comfortable. The Castle will almost certainly be restored. When the Castle prospers, its tenants will prosper too.
        - id: ch01-b133
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: "Hooray!"
          emotion: happy
        - id: ch01-b134
          speaker: narrator
          text: >-
            Another cheer rose. Lord Arden lifted one hand, and the crowd fell silent.
        - id: ch01-b135
          speaker: lord_arden
          text: >-
            There is something else you should hear, and you may as well hear it now. Mr. Roscoe, my solicitor, brought me news this morning. I am not Lord Arden.
        - id: ch01-b136
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: "No!"
          emotion: surprised
        - id: ch01-b137
          speaker: narrator
          text: "Displeased voices rumbled through the crowd."
        - id: ch01-b138
          speaker: lord_arden
          text: >-
            I have no right to the title. My father was a younger son. The true heir was kidnapped and believed dead, so the title came to me. But the kidnapped heir has a grandson, and that grandson is Lord Arden. I know his whole story and the good he has done for himself and for others.
        - id: ch01-b139
          speaker: mr_beale
          text: "Hear, hear!"
        - id: ch01-b140
          speaker: lord_arden
          text: >-
            I know his life, and I am proud that he leads our house. When he comes of age, he will do everything for you that I would have done. Until then, I am his guardian.
        - id: ch01-b141
          speaker: narrator
          text: >-
            He placed an arm around little lame Dickie's shoulders. Dickie stood leaning on his crutch, pale as death.
        - id: ch01-b142
          speaker: lord_arden
          text: >-
            This is Lord Arden, restored to his own. Cheer for him as you have never cheered before. Three cheers for Richard, Lord Arden!
        - id: ch01-b143
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: "Hip, hip, hooray! Hip, hip, hooray! Hip, hip, hooray!"
          emotion: happy
