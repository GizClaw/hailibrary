audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机敏，带着克制的幽默与讲故事的悬念
        timbre: 温暖清亮
        pace: 舒展而有变化
        pitch: 中音
    dickie:
      display_name: 迪基
      tts:
        delivery: 聪明敏感，街头口吻直率，学书中人物说话时郑重夸张
        timbre: 清脆稚嫩
        pace: 稍快，受委屈时断续
        pitch: 中高音
    mr_beale:
      display_name: 比尔先生
      tts:
        delivery: 爽朗随和，热情背后藏着迟疑与盘算
        timbre: 粗粝有力
        pace: 不紧不慢
        pitch: 低音
    old_beale:
      display_name: 老比尔
      tts:
        delivery: 年迈质朴，嘴硬心软，乡间口吻自然
        timbre: 苍老清瘦
        pace: 缓慢
        pitch: 中低音
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 坦率好奇，闹别扭时固执又认真
        timbre: 明净的少年音
        pace: 中等，着急时稍快
        pitch: 中高音
    elfrida:
      display_name: 埃尔弗里达
      tts:
        delivery: 热情果断，好奇心强，说话爽快有主见
        timbre: 清亮灵动
        pace: 稍快
        pitch: 高音
    lord_arden:
      display_name: 阿登勋爵
      tts:
        delivery: 亲切快活，待人真诚而有分寸
        timbre: 温厚清朗
        pace: 从容
        pitch: 中低音
    lady_talbot:
      display_name: 塔尔博特夫人
      tts:
        delivery: 热情爽朗，善解人意，说话干脆而体贴
        timbre: 明亮柔和
        pace: 中等
        pitch: 中音
    crest_mouldiwarp:
      display_name: 冠饰莫尔迪沃普
      tts:
        delivery: 文雅神秘，客气中带着智者的疏离
        timbre: 细润沉静
        pace: 缓慢
        pitch: 中低音
    engineer:
      display_name: 工程师
      tts:
        delivery: 快活随和，讲解时清楚而务实
        timbre: 明朗温厚
        pace: 中等
        pitch: 中音
    captain:
      display_name: 守军首领
      tts:
        delivery: 威严果断，战事当前命令简短有力
        timbre: 浑厚坚实
        pace: 稍快
        pitch: 低音
    mr_roscoe:
      display_name: 罗斯科先生
      tts:
        delivery: 快活亲切，谨慎中带着幽默
        timbre: 圆润清晰
        pace: 中等
        pitch: 中低音
  chapters:
    - id: ch01
      title: 阿登勋爵
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            究竟谁才是阿登勋爵，这件事让人议论了很久，信也写了许多封。起初，谁都说不准。要是埃德雷德和埃尔弗里达的父亲有心争一争，律师们准能为它忙上好几年。那会耗掉不知多少墨水，也不知要为这件事说上多少雷霆万钧的雄辩。可眼前这位阿登勋爵为人正直，只想把属于迪基的一切还给他，律师们也只好早早收了工。
        - id: ch01-b02
          speaker: narrator
          text: >-
            埃德雷德看见父亲用尽心力查清迪基的身世，也看见他一旦证实原以为属于自己的东西其实不属于自己，就肯放手。他越发庆幸自己尽了责任，救出表兄，没有因为卑劣或犹豫，给阿登这个姓氏蒙羞。埃尔弗里达听完那夜营救从头到尾的经过，更是佩服哥哥，佩服得弄得他都有点不自在了。从此，她事事敬重他，遇到什么都来同他商量。这感觉当然很好，尤其是从前人人都爱暗示，她不但比他聪明，也比他能干。
        - id: ch01-b03
          speaker: lord_arden
          text: >-
            迪基，当然啦，要是以后真有证据说明我才是阿登勋爵，你也不会丢下我们吧？你会和埃德雷德一起上学，我会像养自己的儿子那样养大你。
        - id: ch01-b04
          speaker: narrator
          text: >-
            迪基果真像他的亲生儿子一样，住进了阿登城堡的宅子，而且一天比一天更爱这里。他不再想逃离现代，回到詹姆斯一世做国王的古老年代。人生在哪个时代，哪个时代总更像家。以前他在德特福德过得苦，才总盼着回到过去。这就像一个人在家里不快活，总会想远游异国。可一个人在家里过得幸福，就不会想离开。如今迪基在阿登很幸福，自然不想走了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            古老年代的生活教会了迪基怎样待人接物。他在阿登一家和他们的朋友面前很自在，就像在比尔一家和他们的朋友中间一样。他知道该怎样站，怎样说话，也不会因为进了漂亮宅子就手足无措。阿登家的朋友私下里夸他有点害羞，举止却漂亮极了。谁能想到，他从前只是个流浪儿呢？人人都说，阿登勋爵真把他教得太好了。
        - id: ch01-b06
          speaker: narrator
          text: 于是，迪基在詹姆斯一世时代从老师那里学来的一切，全都算成了阿登勋爵的功劳。
        - id: ch01-b07
          speaker: narrator
          text: >-
            孩子天生不会总惦记过去和将来，他们活在眼前。迪基住在阿登，爱着阿登，也尽情玩耍。阿登勋爵送了他一匹小马。只要骑上马，他那只跛脚便几乎再也不碍事了。埃德雷德和埃尔弗里达还有一辆驴车，三个人常坐着它出门，到不少有趣的地方探险。
        - id: ch01-b08
          speaker: narrator
          text: >-
            有一次，他们去了塔尔博特庄园，看见三代以前爱德华·塔尔博特藏供词的暗处。那份供词承认，阿登家的婴儿正是他偷走的。他们还看见塔尔博特夫人的画像，她婚前也姓阿登。画中人穿着玫瑰色锦缎长裙，裙下露出绿色丝绸衬裙。她扑过粉的头发高高堆在一只大垫子上。衣裳和发式都属于很久以前，可她的眼睛和嘴，分明就是德特福德的迪基的眼睛和嘴。
        - id: ch01-b09
          speaker: narrator
          text: >-
            塔尔博特夫人待孩子们十分亲切，陪他们玩捉迷藏，还在紫杉凉亭里摆了满桌好吃的茶点。后来，她让埃德雷德和埃尔弗里达到花园里摘一篮桃子，好带回家去。两个孩子一走，她便对迪基说起了心里话。
        - id: ch01-b10
          speaker: lady_talbot
          text: >-
            理查德，我真庆幸你当初没答应让我收养你。不然，我一心一意疼上了你，你又忽然找到真正的亲人，我这个可怜的养母可怎么办呢？
        - id: ch01-b11
          speaker: dickie
          text: >-
            要是我能留下，我一定会留下。那时候我就特别喜欢您。您很像那位阿登夫人，就是丈夫因为火药阴谋案被关进伦敦塔的那一位。
        - id: ch01-b12
          speaker: lady_talbot
          text: 大家也这么说。可你怎么会知道？
        - id: ch01-b13
          speaker: dickie
          text: 我也说不清。可您就是像她。
        - id: ch01-b14
          speaker: lady_talbot
          text: >-
            你一定见过她的画像，国家肖像馆里就有一幅。她娘家姓德拉米尔，我出嫁以前也姓德拉米尔。你看，亲爱的，她本来就和我是一家人。
        - id: ch01-b15
          speaker: narrator
          text: >-
            塔尔博特夫人在迪基身边坐下。迪基伸手搂住她的腰，把头靠在她肩上。
        - id: ch01-b16
          speaker: dickie
          text: 我真希望您就是我的妈妈。
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: >-
            他的心却回到了另一个时代，回到那位戴轮状皱领、穿着裙撑的母亲身边。塔尔博特夫人温柔地抱紧了他。
        - id: ch01-b18
          speaker: lady_talbot
          text: 我亲爱的小迪基，你再怎么盼，也不会比我更盼。
          emotion: sad
        - id: ch01-b19
          speaker: dickie
          text: >-
            有许多事，自己怎么也拿不准，又不能告诉别人。您知道，是为了守信用必须保守的秘密。要是有妈妈，就不一样了。可一个人没有妈妈，什么都只能自己拿主意。
        - id: ch01-b20
          speaker: lady_talbot
          text: 你不肯让我帮你吗？
        - id: ch01-b21
          speaker: narrator
          text: >-
            迪基靠着她。有那么疯狂的一瞬间，他真想从头到尾，把一切全说出来。可他知道，她不会明白，甚至不会相信。大人都不会。自己的妈妈或许能明白，也或许一样不能。
        - id: ch01-b22
          speaker: dickie
          text: >-
            我不能告诉您。我只觉得，我不想当阿登勋爵，可我又想得要命。阿登家在历史里做过那么多了不起的事，可我不愿意把别人赶出去。是埃德雷德跑来救我，才把我从那些人手里救出来。现在只因为我碰巧出现，他们也许就得搬走。我一想到这件事就恨得不得了。有时候，我简直受不了。
          emotion: sad
        - id: ch01-b23
          speaker: lady_talbot
          text: >-
            亲爱的孩子，你当然会这么想。可别再反复琢磨了。你还是个小男孩，只管快快活活地过日子。大人的事，让大人去办。
          emotion: calm
        - id: ch01-b24
          speaker: dickie
          text: >-
            可我也不知道为什么，我一直都要操心大人的事。比尔的事，还有这一件、那一件。
        - id: ch01-b25
          speaker: lady_talbot
          text: 比尔就是那个让你从我这里逃走的人？
        - id: ch01-b26
          speaker: dickie
          text: 是的。您瞧，我得对比尔负责。
        - id: ch01-b27
          speaker: lady_talbot
          text: 那现在呢？你不再觉得自己要对他负责了吗？
        - id: ch01-b28
          speaker: dickie
          text: >-
            不用了。我已经把比尔的一辈子安排好了。结了婚的人不需要别人负责，他们会彼此负责。所以现在，我只要操心自己和阿登一家。可我不知道该怎么办。
        - id: ch01-b29
          speaker: lady_talbot
          text: >-
            你哪有什么事非办不可？好好玩，好好念书，快快乐乐的，这就够了。别再让小脑袋瓜操心。只管过好日子，把从前担过的责任都忘了吧。
          emotion: calm
        - id: ch01-b30
          speaker: dickie
          text: 我会试试。
        - id: ch01-b31
          speaker: narrator
          text: >-
            这时，另外两个孩子带着桃子回来了。于是大家没再谈别的，只道了谢，便告辞回家。
        - id: ch01-b32
          speaker: narrator
          text: >-
            探查古代走私客的洞穴，又刺激，又好玩。后来大家才知道，村里不止一个老人听父亲讲过这些洞，也听过从前这一带走私的事。只是他们觉得不该由自己说，而且心里多半也只信一半。
        - id: ch01-b33
          speaker: old_beale
          text: >-
            你们怎么不来问我？我早能告诉你们洞在哪儿。可我不敢说，怕你们把宝贝脖子摔断喽。
        - id: ch01-b34
          speaker: narrator
          text: >-
            孩子们急得要命，恨不得马上拆开砖墙，好让溪水重见天日。可他们的父亲觉得花费太大。埃德雷德和埃尔弗里达便客客气气地软磨硬泡，终于等来一位肯替他们说话的人。那是一位戴眼镜、脾气快活的先生，到城堡来住两天。他刚承认自己是工程师，就被两个孩子紧紧缠住了。
        - id: ch01-b35
          speaker: narrator
          text: >-
            工程师倒很乐意去看洞穴。他说，只要拆掉那道简陋的堤坝，溪水就会回到旧河道。砖墙也不难敲开。水一放出去，自会努力流回原路，再从拱顶水道淌下去。孩子们告诉他，那条水道准在城堡下面的一座土丘底下。
        - id: ch01-b36
          speaker: engineer
          text: 你们知道得可真不少，是不是？
        - id: ch01-b37
          speaker: edred
          text: 是的。
        - id: ch01-b38
          speaker: narrator
          text: >-
            大家一起来到土丘。工程师在这里戳一戳，又到那里探一探，最后说，孩子们的猜想也许真和事实差不了多少。比尔和另一个人拿着铁锹赶来。没过多久，他们就挖出了那座拱顶。过了这么多年，它还是和从前一样完好。众人又惊叹又赞赏，随后才回到洞里。
        - id: ch01-b39
          speaker: narrator
          text: >-
            砖一块块拆下，日光泻进洞穴，那一刻庄严极了。眼下只剩最后一件事，只要挖开堤坝，溪水就能从黑暗里奔向阳光。孩子们可为难了，两样都舍不得错过。到底留在洞里，亲眼看人拆掉堤坝，还是守在外面，看溪水第一次冲出来呢？最后，他们只好分开。两个男孩留在洞里，只有埃尔弗里达和父亲等在外面。
        - id: ch01-b40
          speaker: narrator
          text: >-
            父女俩坐在一座小土丘上。四周长着纤细的圆叶风铃草和野百里香，还有散发香气的淡紫色野蔷薇。他们一刻也不挪开目光，只盯着山坡上黑黑的洞口。溪水一直没有出现，他们就这样等啊，等啊，等了很久很久。
        - id: ch01-b41
          speaker: elfrida
          text: 爸爸，要是最后发现您不是阿登勋爵，您会不会特别难受？
        - id: ch01-b42
          speaker: narrator
          text: 他停了一会儿，决定一点也不瞒她。
        - id: ch01-b43
          speaker: lord_arden
          text: >-
            会，我会特别难受。正因为这样，我们才更得尽全力查明，迪基到底是不是合法继承人。最后无论爵位归他还是归我，你和我都不会怪自己没想尽办法，把属于他的权利交还给他，不管那究竟是什么。
          emotion: sad
        - id: ch01-b44
          speaker: elfrida
          text: 也要把属于您的交给您，爸爸。
        - id: ch01-b45
          speaker: lord_arden
          text: >-
            对，也把属于我的交给我。就算迪基真是阿登勋爵，我大概也会成为他的监护人。我们还会像现在一样住在一起，只是我会重新变回普通的阿登先生。
        - id: ch01-b46
          speaker: elfrida
          text: 我相信迪基就是阿登勋爵。
        - id: ch01-b47
          speaker: narrator
          text: >-
            她也许正要说出理由，连鼹鼠精告诉迪基的整个故事也讲出来。可就在这时，洞里传来轰鸣和奔涌声。一道银亮的闪光跃过山坡上黑黢黢的洞口。那道被囚禁了许久的光彩突然迸发，溪水一下跃了出来。它向左右漫过干草地，一直流到父女俩坐的小丘旁。细小的波浪轻轻拍着土坡，照埃尔弗里达的话说，就像水拍着沙堡。
        - id: ch01-b48
          speaker: narrator
          text: >-
            水面越铺越宽，成了一片湖。没过多久，它又聚在一起，沿山坡慢慢淌下，在小丘之间蜿蜒前进，也越流越深。
        - id: ch01-b49
          speaker: lord_arden
          text: 小乖乖，快走，咱们到护城河去。只要拼命跑，一定能抢在溪水前头。
          emotion: happy
        - id: ch01-b50
          speaker: narrator
          text: >-
            他牵起女儿的手跑了起来，他们果真先到了。溪水像是认出了从前的道路，一路越流越明白自己该去哪里。它来到城堡旁。午饭时，城堡四周的草地已经全泡在水下。下午茶时，护城河里的水有了一英尺多深。第二天早晨，大家起床一看，城堡已被一条足足五十英尺宽的壮丽护城河围住。
        - id: ch01-b51
          speaker: narrator
          text: >-
            溪水从护城河流出去，路线虽有些弯弯扭扭，却还是一路钻进土丘下较低的拱顶。它在那里消失，又从地下继续奔向大海。大家痛痛快快享受了一整天的护城河，随后又拦住溪水，让它暂时仍从地下走。要等到来年春天，检查过城墙、给墙基铺好混凝土，免得水渗进去掏坏地基，才能再放水回来。
        - id: ch01-b52
          speaker: lord_arden
          text: >-
            看来要花一大笔钱。我也不知道该不该做，可这诱惑实在挡不住。只好从别处省些钱了。
        - id: ch01-b53
          speaker: narrator
          text: >-
            埃尔弗里达听见父亲对工程师这样说，便去洞里找正在钓鱼的迪基和埃德雷德，把这番话告诉他们。
        - id: ch01-b54
          speaker: elfrida
          text: >-
            所以我们非再找一次宝藏不可。不管以后谁拥有城堡，都一定想修复它。我们有城堡原来模样的画，那些农舍也全要重建。亲爱的迪基，你这么聪明，快想想怎么找到宝藏吧。
        - id: ch01-b55
          speaker: narrator
          text: 于是迪基认真想了想，很快便有了主意。
        - id: ch01-b56
          speaker: dickie
          text: 你们以前在画里看见过，有人把宝藏搬进密室，对吧？
        - id: ch01-b57
          speakers: [edred, elfrida]
          ensemble: duo
          text: 对。
        - id: ch01-b58
          speaker: dickie
          text: 那为什么不回到那个时代，亲眼看看呢？
        - id: ch01-b59
          speaker: elfrida
          text: 可我们没有衣裳。我们的魔法全靠衣裳。
        - id: ch01-b60
          speaker: dickie
          text: 我的不用。咱们去吗？
        - id: ch01-b61
          speaker: edred
          text: 画里有好多士兵，他们还在打仗呢。
        - id: ch01-b62
          speaker: elfrida
          text: 我不怕士兵。埃德雷德，你自己明明知道，你什么都不怕。
        - id: ch01-b63
          speaker: dickie
          text: >-
            你当然不怕，不然那天半夜也不会一直追进洞里救我。来，大家站近一点。我要把月亮种子摊开了。
        - id: ch01-b64
          speaker: narrator
          text: >-
            三个孩子挨在一起。迪基先把另外几样东西放进左手，牢牢攥住，再摊开月亮种子，一心想着去找那些正在藏宝的人。转眼间，他们已经到了。
        - id: ch01-b65
          speaker: narrator
          text: >-
            三个孩子紧贴着站在一条狭窄黑暗的过道凹处。男人们一个接一个从面前走过，抬着沉重的箱子、硕大的皮口袋，还有拿稻草和手帕捆起的包裹。那些人留着长发，穿的是查理一世做国王时流行的衣服。孩子们低头一看，自己也是那个时代的打扮，两个男孩腰间还各自佩着一柄小剑。
        - id: ch01-b66
          speaker: narrator
          text: >-
            最后一个包裹搬了过去，最后一只箱子也咚的一声落在前方某个房间的石地上。孩子们听见门关了，钥匙也在锁里转过。男人们一起沿过道往回走，孩子们便悄悄跟在后面。火把的光很快变成日光，他们爬到了户外。路又陡，出口又低，三个人只能手脚并用。那些沉重箱子准是推出来或拖出来的，绝不可能有人抬着通过。
        - id: ch01-b67
          speaker: narrator
          text: >-
            孩子们回头细看，出口正开在庭院围墙上。那时的庭院还不是他们熟悉的平整草坪，只是一块雏菊丛生的崎岖草地，到处散着碎石和砖瓦。两个男人抬来一块巨石，摇摇晃晃地把它放在密道尽头和草地相接的石面上。接着是第二块、第三块。每块石头都像智巧拼板一样，严丝合缝地嵌回原位，边缘还抹上灰浆或水泥。最后一块放好，就再也看不出它们和墙上别的石头有什么不同，只剩前面的草被踩倒、踏烂了。
        - id: ch01-b68
          speaker: captain
          text: >-
            拿些吃的来，掰碎了撒在这儿，让人以为士兵刚在这里吃过东西。别处的草也踩乱一点。那些圆颅党恶狗再过一个钟头，准会攻破最后一道防线。孩子们，去找你们的母亲。这里不是你们该待的地方。
        - id: ch01-b69
          speaker: narrator
          text: >-
            埃德雷德和埃尔弗里达在画里见过这里，认得路，转身便要走。迪基却压低了声音。
        - id: ch01-b70
          speaker: dickie
          text: 别等我，我还有件事得办。
        - id: ch01-b71
          speaker: narrator
          text: >-
            士兵们去取食物，迪基便悄悄爬到那些石块前。他一直盯着它们，一眼也没挪开。现在，他跪下来，用随身带着的大铁钉在其中一块石头上刻记号。一根钝了，就换另一根。士兵们回来时，他躲进礼拜堂的门洞里。
        - id: ch01-b72
          speaker: captain
          text: 所有人回岗位！愿上帝保佑我们！
        - id: ch01-b73
          speaker: narrator
          text: >-
            披甲的士兵铿铿锵锵地跑远了。迪基又跪下去接着刻。四周全是呐喊、枪炮、铠甲碰撞和伤兵惨叫。每隔五分钟，还有一声崩裂般的巨响，像一柄巨锤正砸向一面巨鼓。刻好以后，迪基把草往上拨，遮住石头上的痕迹。那记号刻得极低，几乎埋进土里，这样便被草根藏得严严实实。
        - id: ch01-b74
          speaker: narrator
          text: >-
            他掸掉手上的石屑，站起身。宝藏已经找到，藏处也做了记号。现在，他该找回表兄妹，带他们回家了。不管他是不是阿登勋爵，让这个高贵家族重新兴旺的人，终究是他。
        - id: ch01-b75
          speaker: narrator
          text: >-
            他转过身，朝表兄妹离开的方向走去。披甲士兵挤在高大门楼的拱门里。右边一扇窗前，有位夫人探出身来，吓得脸色惨白。埃德雷德和埃尔弗里达也和她待在一起，迪基勉强看得见两张白白的小脸。他赶紧奔向那扇窗下的门，可已经太迟了。
        - id: ch01-b76
          speaker: narrator
          text: >-
            沉闷的撞击声再次传来，紧跟着是巨响和震天的呼喊。原来立着城门的拱洞里透进了蓝天。拱门下人群翻涌，喊叫、尖叫、挣扎混在一起。钢铁闪着寒光，勇士的血一片殷红。
        - id: ch01-b77
          speaker: narrator
          text: >-
            迪基忘了窗下的门，忘了表兄妹，连已经找到宝藏也忘了。他只看见自己深爱的家园被仇敌闯入，看见自己热爱的人为了守住这里，像泼水一样洒出鲜血。
        - id: ch01-b78
          speaker: dickie
          text: 为了阿登！为了阿登！
          emotion: angry
        - id: ch01-b79
          speaker: narrator
          text: >-
            他拔出小剑，冲进摇晃碰撞的混战。敌军首领刚从阿登士兵中杀出一条路，第一只脚才踏上庭院石路，迪基就冲到了。他迈出的第一步，也成了最后一步。
        - id: ch01-b80
          speaker: narrator
          text: >-
            那人高大强壮，穿着皮上衣，戴着圆顶钢盔。他停下脚步，困惑地望着迎面冲来的小小身影。阿登家全部的热血和勇气，都在那双蓝眼睛里燃烧。大汉笑了。就在他发笑时，迪基照老师教过的方法一剑向前刺去。那不是裁缝缀在宫廷礼服上的装饰，而是真正的精钢利刃。剑锋又直又准，向上刺进叛军的心脏。那人倒下时，也把剑从迪基手里拧脱了。
        - id: ch01-b81
          speaker: narrator
          text: >-
            敌军愤怒叫喊，阿登士兵却发出骄傲的欢呼。人们在迪基四周拼杀。转眼间，他的双手就被一条手帕反绑起来。他喘不过气，浑身因自豪而颤抖。
        - id: ch01-b82
          speaker: dickie
          text: 我杀了一个人。我为了国王，也为了阿登，杀了一个人。
        - id: ch01-b83
          speaker: narrator
          text: >-
            敌军把迪基锁进柴房。他满心都是骄傲和愤怒，只想着自己为正义刺出的那一剑。过了一会儿，他终于记起，是自己把表兄妹带来这里，也必须把他们安全送回去。
        - id: ch01-b84
          speaker: narrator
          text: >-
            从前有个宁静的傍晚，比尔在路上教过他，怎样解开反绑在身后的双手。迪基想起那堂课，马上动手解绳子，只是进展很慢。他一边挣，一边不停地想该怎样出去。他很熟悉这间柴房。门很结实，外面还横着一根山毛榉木门闩。可这间屋不像城堡别处那样盖瓦或铺铅皮，它的屋顶是茅草。梅德韦河边的工人给烘啤酒花的小屋铺茅草时，他可没白看。等手一松开，他便能站起来，去摸那些固定茅草的木钉。
        - id: ch01-b85
          speaker: narrator
          text: >-
            可他的手忽然垂了下来。就算逃出去，又去哪里找表兄妹？到头来只会被叛军发现，再锁得更牢。他躺在地板上，一动不动。这就是绝望。他的聪明才智已经走到尽头。他把信任自己的两个孩子带进危险，只为发泄对圆颅党的仇恨，竟把他们牺牲了。
        - id: ch01-b86
          speaker: narrator
          text: >-
            他躺了很久，也许哭了一小会儿。柴房太黑，谁也看不见。不过，他并不是一味哭。他还在想，想，想，拼命寻找逃走的办法。这时，棚屋一角传来轻轻的抓挠声。他坐起来屏住呼吸。难道有人挖洞来救他？当然不会，多半只是一只耗子。可紧接着，一个声音就在身旁响起，吓得他差点叫出来。
        - id: ch01-b87
          speaker: crest_mouldiwarp
          text: >-
            待在那里，小子，别动。是我，阿登的老鼹鼠精。你真是个勇敢的小子，我凭信仰起誓，阿登家从没出过比你更勇敢的人，一个也没有。
        - id: ch01-b88
          speaker: dickie
          text: >-
            啊，鼹鼠精，亲爱的鼹鼠精，快帮帮我！是我把他们带进危险的。求你帮我把他们平安送回去。求求你，求求你，求求你！
          emotion: fearful
        - id: ch01-b89
          speaker: crest_mouldiwarp
          text: >-
            我当然会帮。别慌成这样。你都面对过死亡了，可不该这时候乱了阵脚。我在墙角替你挖了条小地道。你像猫一样横着过去，就能摸到。顺着它爬下去，准能到外面。
          emotion: calm
        - id: ch01-b90
          speaker: narrator
          text: >-
            迪基走到声音传来的地方。地上果真有个洞，刚好够他手脚并用地钻进去。
        - id: ch01-b91
          speaker: crest_mouldiwarp
          text: 我在前面走，你跟着。没什么可怕的，阿登勋爵。
        - id: ch01-b92
          speaker: dickie
          text: 我真的是阿登勋爵吗？
          emotion: surprised
        - id: ch01-b93
          speaker: crest_mouldiwarp
          text: >-
            只要我还活着，你就千真万确是。明天一早，你叔父会用律师的全部道理告诉你，准得不能再准。快走，没时间耽搁了。
        - id: ch01-b94
          speaker: narrator
          text: >-
            迪基伏到地上，手脚并用地爬进鼹鼠洞。洞里的泥土松软，还带着香气。他先往下爬，再朝前爬，最后又往上爬，这才钻到庭院里。埃德雷德和埃尔弗里达也在那里。三个孩子一见彼此，马上紧紧抱在一起，然后一同转向鼹鼠精。
        - id: ch01-b95
          speakers: [dickie, edred, elfrida]
          ensemble: chorus
          text: 我们怎么回家？
        - id: ch01-b96
          speaker: crest_mouldiwarp
          text: >-
            还是老办法。进去吧。天鹅车能把你们从一个地方送去另一个地方，也能从一个时代送去另一个时代。只是我们不常这样用。天鹅的脾气太拧，再强的魔法也不肯隐身，谁都看得见。可现在顾不得挑了。进去，快走。这是你们最后一次见到我。趁士兵还没发现，赶紧走。
        - id: ch01-b97
          speaker: narrator
          text: >-
            一辆天鹅车从头顶的天空俯冲下来，三个孩子一起挤了进去。白色翅膀一下伸展开来，整辆车随即升上天空。别人谁也没有看见，只有一个十分机警的圆颅党哨兵看到了，立刻发出警报。可等卫兵全体赶来时，天上已经什么都没有，他反而白白挨了一脚。
        - id: ch01-b98
          speaker: narrator
          text: >-
            天鹅飞得太快，孩子们看不清去向。后来翅膀终于慢下来，可四周一片漆黑，仍旧什么也看不见，空气还冷得刺骨。不久，前方出现一点亮光。下一刻，他们已经回到洞穴，正落在迪基摊开月亮种子、叮当儿和白印章的地方。
        - id: ch01-b99
          speaker: narrator
          text: >-
            三个孩子一下车，天鹅车便拍着翅膀，簌簌飞回洞穴深处。他们尽可能快地走下山，其实也快不到哪儿去，因为迪基那只可怜的脚又跛了。方才那个拔出小剑，杀死一个克伦威尔党人的男孩，在旧时代可一点也不跛。
        - id: ch01-b100
          speaker: narrator
          text: >-
            到了庭院，迪基骄傲地走在前面，弯腰查看残破拱门附近的石块。那道拱门从前是礼拜堂的门。可圆颅党炮轰城堡大门时，他明明在石头上刻过字，如今却连一点痕迹也找不到。
        - id: ch01-b101
          speaker: narrator
          text: 这时，埃德雷德得意地哈了一声。
        - id: ch01-b102
          speaker: edred
          text: >-
            我也留心了。是礼拜堂门口数来第五块石头，就在那扇刻着阿登纹章的小窗下面。没有别的窗子刻那种纹章。我去拿冷凿。
        - id: ch01-b103
          speaker: narrator
          text: >-
            等他拿着冷凿回来，迪基已经跪在墙边，用双手一点点挖开泥土，露出了自己用铁钉刻过的那块石头。记号果然还在那里，是十九，R.D.，零八。只是当初刻数字九的时候，铁钉滑脱了一两次，所以现在看起来更像十五，R.D.，零八。
        - id: ch01-b104
          speaker: dickie
          text: 看，这就是我刻的记号！
          emotion: happy
        - id: ch01-b105
          speaker: edred
          text: >-
            这个吗？它一直都在呀。我们最早四处挖宝藏的时候就见过了。对不对，埃尔弗里达？
        - id: ch01-b106
          speaker: elfrida
          text: 对，早就见过。
        - id: ch01-b107
          speaker: dickie
          text: 不管怎样，它就是我刻的。好了，先让我用凿子。
        - id: ch01-b108
          speaker: narrator
          text: >-
            埃德雷德把凿子让给了他。他知道迪基的手有多巧。迪基给埃尔弗里达做过针线盒，也给他做过工具箱，两只盒子的盖子都合得严丝合缝。
        - id: ch01-b109
          speaker: narrator
          text: >-
            迪基把凿尖塞进石缝，一会儿撬，一会儿压，又换到另一端使劲。石块慢慢向外挪，终于能用手抓住了。孩子们把它拖出来，后面露出一个黑洞。迪基伸进手臂摸了摸。
        - id: ch01-b110
          speaker: dickie
          text: 我摸到门了。没错。
        - id: ch01-b111
          speaker: elfrida
          text: 咱们去叫爸爸吧。他一定会高兴极了。
        - id: ch01-b112
          speaker: narrator
          text: >-
            埃尔弗里达冲进书房。父亲正埋头处理律师寄来的信件和文书，律师本人也在。那位罗斯科先生穿着花呢套装，胖胖的，看起来快活亲切，半点不像书里那种又瘦又高、穿黑外套的讨厌律师。
        - id: ch01-b113
          speaker: elfrida
          text: 求您啦，爸爸，我们找到宝藏了。快去看看！
          emotion: happy
        - id: ch01-b114
          speaker: lord_arden
          text: 什么宝藏？我说过多少次，我忙的时候不许闯进来打扰？
        - id: ch01-b115
          speaker: elfrida
          text: >-
            好吧，我只是觉得您会开心。我们找到一个用砖封死的地方，后面还有一扇门。我差不多敢肯定，克伦威尔手下的坏人攻下城堡时，宝藏就藏在那里。
        - id: ch01-b116
          speaker: lord_arden
          text: >-
            家里的确有这个传说。罗斯科先生，请原谅。我们一家说起家里的事，就会忘记礼貌。埃尔弗里达，你还没向罗斯科先生问早安呢。
        - id: ch01-b117
          speaker: elfrida
          text: >-
            早安，罗斯科先生。我还以为今天该来的是工程师，不是律师。对不起。只要您知道这批宝藏对我们家有多要紧，就不会怪我突然闯进来了。
        - id: ch01-b118
          speaker: mr_roscoe
          text: >-
            我对埋起来的宝物很有兴趣。要是阿登勋爵肯让我帮忙寻找，那一定很有趣。
        - id: ch01-b119
          speaker: elfrida
          text: >-
            已经不用找了，因为我们找到了。我们找了好久好久。爸爸，快来吧。现在不去，您以后一定会后悔。
        - id: ch01-b120
          speaker: lord_arden
          text: 既然罗斯科先生不介意，那我们就去吧。
        - id: ch01-b121
          speaker: narrator
          text: >-
            两个大人跟着埃尔弗里达走了。他们本以为，只是好心陪孩子玩一场假装寻宝的游戏。可到了墙边，透过黑洞看见木门蒙着尘土的灰色，心情马上不同了。迪基和埃德雷德又搬开两块石头。大家接着动手，很快，挡在前面的石块全被移开，整扇门都露了出来。锁板上清清楚楚刻着阿登家的纹章，可房门怎么摇也纹丝不动。
        - id: ch01-b122
          speaker: lord_arden
          text: 得找个锁匠来。
        - id: ch01-b123
          speaker: elfrida
          text: >-
            那把带纹章的大钥匙！铁盒子里那些钥匙，说不定有一把能开。
        - id: ch01-b124
          speaker: narrator
          text: >-
            有人飞跑着取来了钥匙。大家用了不少油，更用了许多耐心，那把钥匙终于肯在锁眼里转动。门一开，后面是条低矮的通道。积满灰尘的厚蛛网垂下来，像一道帘子，让那里简直不像是路。
        - id: ch01-b125
          speaker: narrator
          text: >-
            大家拿来扫帚和提灯，把低垂的蛛网一点点扫开。他们弯着腰往前走，一路打喷嚏、呛灰尘，总算全都到了宝藏室门前。另一把钥匙打开那扇门，真正的宝藏就在里面，和孩子们亲眼见过的一模一样。有大箱、小箱、沉重的皮口袋，还有用稻草和手帕捆起的包裹，一件也没有错。
        - id: ch01-b126
          speaker: narrator
          text: >-
            罗斯科先生来时骑的是自行车，这时便跨上车，飞快地骑走了。他要赶去通知克利夫维尔的银行，请银行派人到城堡搬运宝藏。他还要带警察一起回来，在旁边认真守卫，直到所有东西都平安送走，存进银行的地下金库。
        - id: ch01-b127
          speaker: mr_roscoe
          text: >-
            我既还有童心，也足够谨慎。所以请各位等我回来以后，再把东西搬出来。警察没到以前，也请一定留人守住入口。
        - id: ch01-b128
          speaker: narrator
          text: >-
            宝藏终于重见天日时，警察和银行经理都到了。所有仆人、全家人、比尔一家和特鲁也全在场。此外还有半个村庄的人。他们听说城堡里发生了怪事，便从如今无人把守的大门一拥而入。大家都想亲眼看看，城堡里究竟找出了什么。
        - id: ch01-b129
          speaker: narrator
          text: >-
            这批宝藏壮丽极了。里面有闪闪发光的金银器皿，有珠宝，有制作精美的铠甲，还有一大摞古老的羊皮纸。在别人眼里，那些旧纸也许并不起眼，可罗斯科先生说，它们比其余宝物加在一起还值钱，因为那是大片庄园的地契。
        - id: ch01-b130
          speaker: mr_beale
          text: >-
            好啦，咱们为阿登勋爵欢呼！愿他长长久久享用自己找到的宝贝！嗨，嗨，万岁！
          emotion: happy
        - id: ch01-b131
          speaker: narrator
          text: 人群真心实意地欢呼起来。
        - id: ch01-b132
          speaker: lord_arden
          text: >-
            谢谢大家，我从心底感谢你们。请放心，这份好运也会分给你们。从前属于阿登家的土地，如今正在出售，我们会一块一块把它们买回来。阿登领地上每一座房子，都会重新修得牢固、不漏风雨、让人住得舒服。城堡几乎肯定也会修复。从今以后，阿登佃户的命运，就是阿登城堡的命运。
        - id: ch01-b133
          speaker: narrator
          text: >-
            人群又一次欢呼。他抬起一只手，大家便静下来，等他继续说。
        - id: ch01-b134
          speaker: lord_arden
          text: >-
            我还有一件事要告诉大家，早说晚说都一样。今天早晨，我的律师罗斯科先生带来消息，我并不是阿登勋爵。
        - id: ch01-b135
          speaker: narrator
          text: 人群里响起一片不满的议论。他神色严肃，继续说了下去。
        - id: ch01-b136
          speaker: lord_arden
          text: >-
            我没有继承这个爵位的权利。我的父亲是家中的幼子。真正的继承人在小时候被人绑架，大家一直以为他已经死了，爵位这才传到我这里。那位遭到绑架的继承人的孙子，才是真正的阿登勋爵。我知道他的全部身世，也知道他做过什么。他不但凭自己的作为赢得了荣誉，也曾经帮助过别人。
        - id: ch01-b137
          speaker: mr_beale
          text: 说得好！
          emotion: happy
        - id: ch01-b138
          speaker: lord_arden
          text: >-
            我知道他的一生，也为他能够成为阿登一家之主而骄傲。等他成年以后，他会为大家做我原本想做的一切。在那以前，我会担任他的监护人。这一位，才是阿登勋爵。
        - id: ch01-b139
          speaker: narrator
          text: >-
            他用手臂搂住迪基的肩。跛脚的小迪基拄着拐杖站在那里，脸白得像死人一样。
        - id: ch01-b140
          speaker: lord_arden
          text: >-
            这就是阿登勋爵，他终于取回了属于自己的一切。大家为他欢呼吧，要比以前每一次都更响亮。为理查德·阿登勋爵三呼万岁！
          emotion: happy
