audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机敏，带着克制的幽默与讲故事的悬念
        timbre: 温暖清亮
        pace: 舒展而有变化
        pitch: 中音
    dickie:
      display_name: 迪基
      tts:
        delivery: 聪明敏感，街头口吻直率，学书中人物说话时郑重夸张
        timbre: 清脆稚嫩
        pace: 稍快，受委屈时断续
        pitch: 中高音
    mr_beale:
      display_name: 比尔先生
      tts:
        delivery: 爽朗随和，热情背后藏着迟疑与盘算
        timbre: 粗粝有力
        pace: 不紧不慢
        pitch: 低音
    amelia:
      display_name: 阿米莉亚
      tts:
        delivery: 麻利爽直，说话干脆，偶尔带点不服气
        timbre: 明亮厚实
        pace: 稍快
        pitch: 中音
    old_beale:
      display_name: 老比尔
      tts:
        delivery: 年迈质朴，嘴硬心软，乡间口吻自然
        timbre: 苍老清瘦
        pace: 缓慢
        pitch: 中低音
    lord_arden:
      display_name: 阿登勋爵
      tts:
        delivery: 正直威严，关切时真挚温和
        timbre: 深沉清晰
        pace: 稳健
        pitch: 中低音
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 认真好强，少年口吻坦率，紧张时仍竭力镇定
        timbre: 清亮结实
        pace: 中等，犹豫时稍慢
        pitch: 中高音
    elfrida:
      display_name: 埃尔弗里达
      tts:
        delivery: 敏感善良，直爽活泼，伤心时带着克制的抽噎
        timbre: 清澈柔和
        pace: 自然而有起伏
        pitch: 高音
    mrs_beale:
      display_name: 比尔太太
      tts:
        delivery: 朴实利落，关切中带着责备
        timbre: 温暖厚实
        pace: 稍快
        pitch: 中音
    mrs_honeysett:
      display_name: 霍尼塞特太太
      tts:
        delivery: 能干慈爱，遇事果断，照料孩子时温柔坚定
        timbre: 丰满沉稳
        pace: 从容
        pitch: 中低音
    mouldiwarp:
      display_name: 鼹鼠精
      tts:
        delivery: 古老庄重，问话简短而威严
        timbre: 低沉柔和
        pace: 缓慢
        pitch: 低音
    greater_mouldiwarp:
      display_name: 更伟大的鼹鼠精
      tts:
        delivery: 肃穆克制，言语带着审视的力量
        timbre: 深厚清晰
        pace: 徐缓
        pitch: 低音
    greatest_mouldiwarp:
      display_name: 最伟大的鼹鼠精
      tts:
        delivery: 威严仁厚，低声教诲时深沉而有感召力
        timbre: 低沉宏亮
        pace: 庄重舒缓
        pitch: 低音
    matador:
      display_name: 斗牛士
      tts:
        delivery: 彬彬有礼，低声提醒时略带诙谐
        timbre: 明亮圆润
        pace: 中等
        pitch: 中音
    hero_1:
      display_name: 白衣英雄甲
      tts:
        delivery: 庄严热切，带着鼓舞人心的力量
        timbre: 清朗坚定
        pace: 中等
        pitch: 中音
    hero_2:
      display_name: 白衣英雄乙
      tts:
        delivery: 庄严热切，带着鼓舞人心的力量
        timbre: 浑厚坚定
        pace: 中等
        pitch: 中低音
    hero_3:
      display_name: 白衣英雄丙
      tts:
        delivery: 庄严热切，带着鼓舞人心的力量
        timbre: 温暖坚定
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 高尚的行为
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            阿登勋爵带着埃尔弗里达和埃德雷德回到城堡，却不见迪基。两个孩子猜，一定是比尔留他在小屋过夜，阿登勋爵起初也这样想。他很生气。比尔不该自作主张，迪基也不该一声不响地留下。
        - id: ch01-b02
          speaker: lord_arden
          text: >-
            比尔实在太放肆，迪基也太不懂事。明天一早，我得跟他们两个好好谈一谈。
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: >-
            可两个孩子上床以后，阿登勋爵越想越不安。要是迪基根本不在比尔家呢？他走到小屋外，只见里面漆黑一片。迟疑片刻，他还是敲了门。敲到第三次，比尔才睡眼惺忪地探出窗口。
        - id: ch01-b04
          speaker: mr_beale
          text: 谁在那儿？
        - id: ch01-b05
          speaker: lord_arden
          text: 是我。理查德已经睡下了吧？
        - id: ch01-b06
          speaker: mr_beale
          text: 应该睡了吧，勋爵。
        - id: ch01-b07
          speaker: narrator
          text: 比尔还迷迷糊糊，完全没听明白。
        - id: ch01-b08
          speaker: lord_arden
          text: 你们害我担心得亲自跑来，只为看看他到底在不在。
        - id: ch01-b09
          speaker: mr_beale
          text: 可他没在我这儿。您不是答应坐马车接他回去吗？
        - id: ch01-b10
          speaker: lord_arden
          text: 我没有！快下来，比尔，带上灯。一定出事了。
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: >-
            卧室窗口亮了起来。阿登勋爵站在星光下，听着比尔在楼上跌跌撞撞地忙活。
        - id: ch01-b12
          speaker: mrs_beale
          text: 外套给你。靴带别系了，你本来就该送他一程。
        - id: ch01-b13
          speaker: mr_beale
          text: 我不是说了要送他吗？
        - id: ch01-b14
          speaker: narrator
          text: >-
            比尔嘟囔着冲下楼，穿过洗衣房，从屋角绕出来，手里提着马厩灯。他走近星光下那个高大黝黑的人影，声音已经发颤。
        - id: ch01-b15
          speaker: mr_beale
          text: >-
            那小家伙……要是他真出了什么事！老天作证，老板，不，勋爵，我是说，他要是出了事可怎么办？他是个顶好的孩子啊！
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: 两人快步走向大门。沿着寂静而满是尘土的路赶去时，比尔又说了起来。
        - id: ch01-b17
          speaker: mr_beale
          text: >-
            我从前真不是个东西，老板。我是个没用的废物，老天作证。是小家伙把我变得像个人。他给我讲故事，叫我走正道。我能和阿米莉亚在一起，还有那些狗和小宝宝，全是他的功劳。他劝我别讨钱，也别再干更坏的事。他不知道，我刚遇见他时是什么样。我那时还想把他教成个该死的飞贼呢，您肯定不信！
        - id: ch01-b18
          speaker: narrator
          text: >-
            两人沿着灰白的道路赶路，不停向两边张望。平缓起伏的丘陵上没有灌木，也没有石头，一眼就能看出哪儿都没有小男孩。一路上，比尔把整个故事都交代了。
        - id: ch01-b19
          speaker: narrator
          text: >-
            他们东找西找，趴下查看灌木底下，仔细寻找每一扇栅门旁边和每一道篱笆脚下，又提心吊胆地搜遍那座废弃的小白垩坑。夜已经很深了，白月亮才升起来，替他们照亮四周。村里有十来个人被叫醒，披衣出门，加入了搜寻。老比尔也牵着那条西班牙猎犬赶来。老人熟悉方圆五英里的每一码土地，那条狗更熟悉十英里内的每一寸地方。人和狗搜了又搜，仍旧找不到迪基。特鲁在屋里屋外乱窜，哀哀呜咽，又一声声吠叫，听起来实在可怜。阿米莉亚没有别的办法，只好把它拴起来。于是，大家在外面寻找时，它始终被拴在那里。
        - id: ch01-b20
          speaker: narrator
          text: >-
            第二天早晨，埃德雷德和埃尔弗里达下楼吃饭，霍尼塞特太太迎面告诉他们，迪基失踪了，父亲还在外面寻找。
        - id: ch01-b21
          speaker: narrator
          text: 两个孩子一单独待在一起，埃德雷德便说出了自己的猜测。
        - id: ch01-b22
          speaker: edred
          text: 准是那讨厌的魔法。他又多用了一回，结果困在历史里的某个年代，回不来了。
        - id: ch01-b23
          speaker: elfrida
          text: >-
            可我们什么也做不了，根本去不到他身边。要是还有从前的白魔法，还有鼹鼠精帮忙，我们就能知道他出了什么事。
          emotion: sad
        - id: ch01-b24
          speaker: edred
          text: >-
            也许他掉进废矿井了，正躺在下面，渴得直喘气。他那条忠心的狗也跳了下去，四条可爱的腿全摔断了。
        - id: ch01-b25
          speaker: narrator
          text: 这幅可怕的景象让埃尔弗里达泪如雨下，连话也说不出来。
        - id: ch01-b26
          speaker: edred
          text: >-
            我们又帮不上忙。看在老天分上，别抽抽搭搭了，埃尔弗里达。这是男人该办的事。快擦干眼泪，你这样哭，我根本没法想事情。
        - id: ch01-b27
          speaker: elfrida
          text: 我没有哭。
          emotion: sad
        - id: ch01-b28
          speaker: narrator
          text: 她说了句假话，又狠狠吸了一下鼻子。
        - id: ch01-b29
          speaker: edred
          text: 要是你现在编一首诗，会不会有用？
        - id: ch01-b30
          speaker: elfrida
          text: >-
            只有诗也不行，还要有衣裳。你知道，我们施魔法几乎每次都要穿死去之人的衣裳，而且只能去他们穿着那些衣裳生活的年代。啊，亲爱的迪基！要是他真掉进矿井，或者出了那样的事，我们做什么还有用呢？
        - id: ch01-b31
          speaker: edred
          text: 不管怎样，我要试试。至少你也得试，因为我不会作诗。
        - id: ch01-b32
          speaker: elfrida
          text: 我这么难过，怎么可能作出诗？一个人苦恼透顶时，最想不到的就是诗。
        - id: ch01-b33
          speaker: edred
          text: >-
            那我们先把衣裳穿起来。大厅里有零散的铠甲，还有爸爸从印度带回来的羽毛头饰。我有爸爸的射击绑腿，可以用棕纸做靴筒。你就系伊迪丝姑妈的罗马式腰带，在右边墙角的抽屉里。婚礼那天我去拿她的祈祷书，看见它了。
        - id: ch01-b34
          speaker: elfrida
          text: 我不想打扮。我只想找到迪基。
        - id: ch01-b35
          speaker: edred
          text: >-
            我也不想，可我们总要做点什么。也许，我只说也许，打扮起来真的会有用。试一试吧。
        - id: ch01-b36
          speaker: narrator
          text: >-
            埃尔弗里达伤心得没有心思争辩。不久，两个愁苦万分的孩子站在埃德雷德卧室里，彼此打量。他们头上戴着美洲印第安人的羽毛，背后也披着印第安装束，胸前和胳膊却又套满一片片钢甲。埃尔弗里达还穿着衬裙，腰间系上罗马式腰带，脚蹬日本编织鞋，又套着父亲的射击绑腿。绑腿顶端围了一圈棕纸，看起来就像一双靴子。埃德雷德两条腿都包在铠甲里，仿佛戴着板球护腿，脚上还扣着分节护具，活像两只蛹。有人告诉我，“蛹”的复数该用另一个词。不过，一个人若永远只用正确的复数，生活一定乏味透顶。现在，印第安人的羽毛、罗马式腰带、钢片和棕纸靴筒全凑在了一起，两张凄凉的小脸从这身古怪行头中露出来，彼此望着。
        - id: ch01-b37
          speaker: edred
          text: 现在，作诗吧。
        - id: ch01-b38
          speaker: elfrida
          text: >-
            我不会，我就是不会！别逼我。刚才穿衣服时，我一直在想，可只想出了这个。唤我亲爱的迪基归来，独自一人我玩不起来。夏天带着花儿蜜蜂来到，亲爱的迪基去了哪里？我知道，它一点用也没有。
          emotion: sad
        - id: ch01-b39
          speaker: edred
          text: 当然没用，这不是你作的，是费利西亚·M·赫曼斯的诗。让我来试试。
        - id: ch01-b40
          speaker: narrator
          text: >-
            他拿来纸笔，真的使出了全身力气。可有些事，就连最好、最勇敢的人也做不到。埃德雷德就是作不出诗，哪怕很坏的诗也不行。他身体里没有作诗的本领，正如你身上没有翅膀，不能飞一样。
        - id: ch01-b41
          speaker: edred
          text: >-
            啊，鼹鼠精，你说我们必须再也不能使用魔法。可我们相信你不会对我们狠心，因为迪基不见了，我们不知道怎样才能找到他。
        - id: ch01-b42
          speaker: narrator
          text: >-
            这已经是他能作出的最好一首。他自己也怀疑，那些慢吞吞、仔仔细细写下来的话到底算不算诗，这一点倒值得称赞。所以埃尔弗里达一再央求，他也不肯给她看。等她差不多说到第三十遍“求求你嘛，埃德雷德，给我看看”，他才交出那张纸。埃尔弗里达一向懂礼貌，不愿伤人，可她也很诚实。埃德雷德又羞又窘，含混地问她。
        - id: ch01-b43
          speaker: edred
          text: 你觉得写得行吗？
        - id: ch01-b44
          speaker: elfrida
          text: 我不大懂诗。我们试试吧。
        - id: ch01-b45
          speaker: narrator
          text: 他们试了，什么也没有发生。
        - id: ch01-b46
          speaker: edred
          text: 我早知道没用，白白把自己弄成了傻瓜。
          emotion: angry
        - id: ch01-b47
          speaker: elfrida
          text: >-
            哦，我常常把自己弄成傻瓜。你愿意的话，我可以再试一次。不过，我想也不会比你的更有用。
        - id: ch01-b48
          speaker: narrator
          text: 埃尔弗里达恶狠狠地皱起眉，用力苦想，头饰上的羽毛也跟着颤动。
        - id: ch01-b49
          speaker: edred
          text: 想出来了吗？
        - id: ch01-b50
          speaker: narrator
          text: 她心不在焉地点了点头。
        - id: ch01-b51
          speaker: elfrida
          text: >-
            最伟大的鼹鼠精，我们把你呼唤，请施展世上最伟大的魔幻。告诉我们该怎样寻找亲爱的迪基，他跛脚又善良。请为我们办成这件事，我们凭心发过誓，往后再也不求你做任何事。
        - id: ch01-b52
          speaker: edred
          text: 我没看出这比我的好多少。而且“发过誓”不对，应该说“发誓”。
        - id: ch01-b53
          speaker: elfrida
          text: >-
            我也没说它多好，可你的诗根本没写完呀。再说，换成“发誓”就不押韵了。我敢肯定，最伟大的鼹鼠精就算听见，也不会在意“发誓”还是“发过誓”。他那么伟大，才不受语法管束呢。
        - id: ch01-b54
          speaker: edred
          text: 真希望人人都不用受语法管束。
        - id: ch01-b55
          speaker: narrator
          text: 他叹了口气。我敢说，你也常有同感。
        - id: ch01-b56
          speaker: edred
          text: >-
            好了，念吧，反正也不会有用。你忘了吗？只有做出高尚的行为，才能见到最伟大的鼹鼠精。想找迪基又算不上高尚。
        - id: ch01-b57
          speaker: elfrida
          text: >-
            是不算。可要是做一件高尚的事就能救回迪基，我们一定会马上去做，对不对？
        - id: ch01-b58
          speaker: edred
          text: 大概会吧。你快念不行吗？
        - id: ch01-b59
          speaker: narrator
          text: >-
            埃尔弗里达念了起来。下一刻，谁都能看出，她的诗比埃德雷德的灵验得多。那一点小小的语法错误，在法力无边的鼹鼠精眼里，果然不值一提。
        - id: ch01-b60
          speaker: narrator
          text: >-
            埃德雷德卧室的四面墙越退越远，远到最后完全消失。两个孩子发现自己站在一座巨大的白色厅堂里。高柱一排接一排，向四面八方伸出去，直到目光再也追不上。厅中挤满了来自各个国家、各个时代的人。有中国人和印度人，有披甲的十字军，有扑了粉的贵妇和穿紧身上衣的绅士，有鬈发的王党骑士、戴头巾的土耳其人和阿拉伯人，也有修士、女修道院长、弄臣、领口围着轮状皱褶的大人物，还有腰间只围着茅草裙的野人。无论你能想到什么装束，这里全都找得到。可是，每一件衣裳都是白色。这里就像一场盛大的化装舞会，客人尽可以随意挑选服装，只有一条规矩，所有衣裳必须是同一种颜色。
        - id: ch01-b61
          speaker: narrator
          text: >-
            埃尔弗里达望着满眼雪白，担心地低头看自己和埃德雷德。他们原本颜色古怪的衣裳也全白了。罗马式腰带上蓝、红、绿、黑、黄的条纹，如今成了五种深浅不同的白。你若不信白色有这么多种，不妨用白纸糊一间屋子，再分别去五家店买纸试试。
        - id: ch01-b62
          speaker: narrator
          text: >-
            四周的人轻轻推着两个孩子，让他们不得不向前走。这时，他们才看见大厅中央摆着一张银王座，上面铺着银绿方格的布，四周还垂着穗子。最伟大的鼹鼠精威严地坐在王座上，鼹鼠精站在一边，更伟大的鼹鼠精站在另一边。最伟大的鼹鼠精比另外两只大得多，全身皮毛闪着银光，像天鹅的羽毛一样。满厅的人全都转过脸，望着两个孩子。他们似乎非往前走不可，只好又慢又害羞地穿过人群，一直走到王座前。到了那里，两人觉得自己理应深深鞠一个躬，于是便一起照做了。
        - id: ch01-b63
          speaker: mouldiwarp
          text: 是什么把你们带到这里？
        - id: ch01-b64
          speaker: elfrida
          text: 善良的魔法。
        - id: ch01-b65
          speaker: greater_mouldiwarp
          text: 你们想要什么？
        - id: ch01-b66
          speaker: edred
          text: 我们想把迪基找回来。请帮助我们。
        - id: ch01-b67
          speaker: greatest_mouldiwarp
          text: >-
            迪基落在一伙人手里。除非你独自去救他，他们会让他离开你们很久很久。这件事很难，也很危险。你愿意去吗？
        - id: ch01-b68
          speaker: edred
          text: 我？一个人？埃尔弗里达不去吗？
          emotion: surprised
        - id: ch01-b69
          speaker: greatest_mouldiwarp
          text: >-
            要赎回迪基，必须付出极大的代价，而且只能由你来付。因为埃尔弗里达比你勇敢，所以你付出的会比她更多。
        - id: ch01-b70
          speaker: narrator
          text: >-
            当着这么多人，请一个男孩做高尚的事，却又在同一句话里说他胆小，这滋味可真不错！埃德雷德的脸顿时涨得绯红，满厅的人都打了个寒战。
        - id: ch01-b71
          speaker: matador
          text: 别变成那种吓人的颜色。这里是白色世界，不许有绯红。
        - id: ch01-b72
          speaker: narrator
          text: 埃尔弗里达一把握住哥哥的手。
        - id: ch01-b73
          speaker: elfrida
          text: 埃德雷德和我一样勇敢。他会去的，对不对？
        - id: ch01-b74
          speaker: edred
          text: 我当然会去。
          emotion: angry
        - id: ch01-b75
          speaker: greatest_mouldiwarp
          text: 那就走上王座的台阶，坐到我身边来。
          emotion: calm
        - id: ch01-b76
          speaker: narrator
          text: >-
            埃德雷德照做了。最伟大的鼹鼠精俯身贴近他耳边。埃尔弗里达和白色大厅里的人，一个字也听不见，只有埃德雷德听得见。
        - id: ch01-b77
          speaker: greatest_mouldiwarp
          text: >-
            你若去救理查德·阿登，就要作出一生中最大的牺牲。从前名叫理查德·哈丁的人，其实就是理查德·阿登。真正的阿登勋爵是他，不是你，也不是你父亲。救了他，就等于从你父亲手中拿走爵位和城堡，也放弃你继承阿登家业的位置，把一切交给合法继承人，也就是你的表兄理查德。
        - id: ch01-b78
          speaker: edred
          text: 可他为什么是合法继承人？
        - id: ch01-b79
          speaker: greatest_mouldiwarp
          text: >-
            三代以前，阿登家的一个小婴儿被人偷走。后来家族里的人接连去世，那个失踪的孩子便成了阿登姓氏和整片领地的继承人。偷走他的男人把孩子带到德特福德，交给一个女人照料。那个女人不知道孩子的来历，只知道他衣服上标着“阿登”，腰间还系着一只珊瑚银铃，银铃上刻着纹章。男人说一个月以后就会回来，可他再也没有出现，因为他在一场决斗里丧了命。不过，决斗前一晚，他写下一封信，把自己做过的事全都说明白了。他又把信藏进塔尔博特府一幅画像背后的暗柜里。画像上画着一位出生在阿登家的夫人。直到今天，那封信还藏在那里。
        - id: ch01-b80
          speaker: edred
          text: 但愿我不会把这些全忘掉。
        - id: ch01-b81
          speaker: greatest_mouldiwarp
          text: >-
            我说过的话，从来没人忘记。德特福德的女人等不到那个男人，就把孩子当作自己的儿子养大。他长大后学了手艺，娶了做工的姑娘。阿登这个姓和许多姓一样，慢慢变成了哈丁。他们的儿子，就是你认识的理查德的父亲。所以，理查德才是真正的阿登勋爵。
        - id: ch01-b82
          speaker: edred
          text: 是。
        - id: ch01-b83
          speaker: narrator
          text: 那低沉而美妙的声音继续说下去。
        - id: ch01-b84
          speaker: greatest_mouldiwarp
          text: >-
            在救出迪基、真正作出牺牲以前，你不能把这件事告诉父亲，连妹妹也不能告诉。这是你一生中唯一一次最重大的机会。每一个灵魂都会遇见一次这样的机会，让他可以做到完全无私，做到绝对高尚而真诚。你可以抓住它，可必须独自抓住。没有人能帮助你，也没有人能替你拿主意。在高尚的想法真正变成高尚的行为以前，你必须把它藏在自己的心里，不能借别人的赞许给自己勇气。等你真正做到了，才可以怀着谦卑和感激，把真相告诉最爱你的人，也就是你的妹妹埃尔弗里达。你应当感激自己得到了这样的机会，可以做成一件美好而勇敢的事，也可以走近历代那些曾遇见同样选择，并且确实做到了的不朽之人。
        - id: ch01-b85
          speaker: edred
          text: 难道埃尔弗里达没有机会做高尚的事吗？
        - id: ch01-b86
          speaker: greatest_mouldiwarp
          text: >-
            她会有一千次机会去做善良而高尚的事，每一次都会抓住，可她永远不会知道自己做到了。现在，你准备好去做必须做的事了吗？
        - id: ch01-b87
          speaker: edred
          text: 这对爸爸好像太残忍了。他会失去阿登勋爵的身份，也会失去其他一切。
        - id: ch01-b88
          speaker: greatest_mouldiwarp
          text: >-
            做正确的事，常常看起来会伤害某个人。可是你想想，如果你父亲知道房屋和城堡属于别人，他会愿意多留它们一天吗？
        - id: ch01-b89
          speaker: edred
          text: 我明白了。他当然不会。好吧，我该做什么？
        - id: ch01-b90
          speaker: greatest_mouldiwarp
          text: >-
            迪基的父亲去世后，德特福德有个女人收留了他。那个女人和他母亲有亲戚关系，却待他很坏，于是迪基离开了她。后来，她遇到一个从前做过窃贼的男人。那男人闯进塔尔博特府，打开一块暗板，找到那封说明迪基身世的旧信。他和那个女人绑架了迪基，想逼他签下一份字据，答应拿钱换回这封能够证明他是阿登继承人的信。可是，他们已经发现，小孩子签的字据根本没有用，也不具备法律效力。两人又害怕受到惩罚，不敢把理查德放走。所以，如果你决定什么也不做，迪基就会继续落在他们手里。你父亲的地位却会安稳下来，将来，你也会顺顺当当地继承阿登的一切。
        - id: ch01-b91
          speaker: edred
          text: 我到底该怎么救迪基？
        - id: ch01-b92
          speaker: greatest_mouldiwarp
          text: >-
            夜里独自去比尔的小屋，打开房门。理查德的狗睡在炉火前。解开它的链子，把它带到十字路口的里程碑旁，再跟着它走。你要带一把刀割绳子，也要拿出全部勇气。现在，看着我的眼睛。
        - id: ch01-b93
          speaker: narrator
          text: >-
            埃德雷德望进那双眼睛。它们不再像鼹鼠的眼睛，反而像他认识的每一个亲爱之人的眼睛。透过它们，他读过的所有勇士都在望着他。
        - id: ch01-b94
          speakers: [hero_1, hero_2, hero_3]
          ensemble: chorus
          text: 勇敢些，埃德雷德。加入我们吧。
        - id: ch01-b95
          speaker: greatest_mouldiwarp
          text: 现在，看看大厅里的人。
        - id: ch01-b96
          speaker: narrator
          text: >-
            埃德雷德抬起头。看啊，他们已不再是陌生人，他认得这里的每一个人。他看见圣女贞德、隐士彼得、赫里沃德和德雷克，也看见兄弟化作天鹅的埃尔莎、杀死恶龙的圣乔治、对着监狱中王者歌唱的布隆代尔，还有把丈夫从可怕的伦敦塔平安救出的尼斯代尔夫人。这里还有选择与船一同沉没的船长，为了一点渺茫希望坚持奋战、直到死去的将军。有爱国者，也有国王，有修女和修士，有男人、女人和孩子。每个人眼里都闪着同一种光，正是那道光辉照亮了人类的梦想。埃德雷德慢慢走下王座，那些伟大的人纷纷从四周围拢过来，一个接一个握住他的手。
        - id: ch01-b97
          speakers: [hero_1, hero_2, hero_3]
          ensemble: chorus
          text: 加入我们吧，埃德雷德。加入我们吧。
        - id: ch01-b98
          speaker: narrator
          text: 一道强烈的白光骤然亮起，孩子们什么也看不见了。紧接着，他们又回到埃德雷德卧室狭窄的四壁之间。
        - id: ch01-b99
          speaker: elfrida
          text: 好了，他对你说了什么？嘿，你的样子真古怪。
        - id: ch01-b100
          speaker: edred
          text: 别说了！来，帮我脱掉这些东西。
          emotion: angry
        - id: ch01-b101
          speaker: narrator
          text: 他一边说，一边扯掉身上的铠甲。埃尔弗里达动手帮忙，却还追问。
        - id: ch01-b102
          speaker: elfrida
          text: 可他到底跟你说了什么？
        - id: ch01-b103
          speaker: edred
          text: 我不能告诉你。事情结束以前，我谁也不告诉。
        - id: ch01-b104
          speaker: elfrida
          text: 随你的便。守着你那些破秘密吧。
          emotion: angry
        - id: ch01-b105
          speaker: narrator
          text: 她说完就走了。这可真难受，对不对？
        - id: ch01-b106
          speaker: edred
          text: >-
            我也没办法，已经告诉你了。埃尔弗里达，要是连你也来烦我，就实在太过分了。事情就是这样。
        - id: ch01-b107
          speaker: elfrida
          text: 你真的不能告诉我吗？
        - id: ch01-b108
          speaker: edred
          text: 我都告诉你五十遍了。
        - id: ch01-b109
          speaker: narrator
          text: 这可不是真的。你知道，他其实只说过两遍。
        - id: ch01-b110
          speaker: elfrida
          text: >-
            那好吧，我一个字也不问。可一到能说的时候，你马上告诉我，好吗？你也会让我帮忙吧？
        - id: ch01-b111
          speaker: edred
          text: >-
            没人能帮忙，也没人能给我主意。要做就只能靠我自己。现在别说话，我得想一想。
        - id: ch01-b112
          speaker: narrator
          text: 这异乎寻常的要求镇住了埃尔弗里达，也惹恼了她。
        - id: ch01-b113
          speaker: elfrida
          text: 看来你是想让我走开了。
        - id: ch01-b114
          speaker: edred
          text: 是的，请你出去吧。
        - id: ch01-b115
          speaker: narrator
          text: >-
            她真的走了。埃德雷德独自坐到床尾的箱子上，拼命想把事情想清楚，可这并不容易。他对自己说，“我应该去。”紧接着，另一个声音便回答，“可是想想你父亲。”那也是他自己的声音。他继续用力想，结果每一个念头都撞上另一个念头，脑子很快乱成一团。渐渐地，他的脑袋越来越烫，手和脚却越来越冷。霍尼塞特太太走进房间，看见他脸色苍白，惊叫了一声。她摸摸他的手，又试了试他的额头，说他发了高烧，赶紧让他躺下，把湿布敷在额头上，又拿来热水袋焐住双脚。
        - id: ch01-b116
          speaker: narrator
          text: >-
            也许他确实发烧了。后来，他始终不能肯定，那一整天里，是否真有一只彬彬有礼、能说会道的黑鼹鼠坐在枕头上，把他心里最不愿听的那些话，一遍遍说给他听。
        - id: ch01-b117
          speaker: narrator
          text: >-
            想想你父亲。永远不会有人知道。迪基总会平安无事。也许你只是梦见他被关起来，那根本不是真的。再说，这也不关你的事。你知道，就是这一类话。
        - id: ch01-b118
          speaker: narrator
          text: >-
            大家怕这病会传染，不许埃尔弗里达进房间。埃德雷德整天在床上辗转反侧，听着黑鼹鼠，或者别的什么东西不停劝说。他却一次次回答自己。
        - id: ch01-b119
          speaker: edred
          text: 我一定得去。可怜的迪基。我答应过要去。对，我会去。
        - id: ch01-b120
          speaker: narrator
          text: >-
            那天深夜，阿登勋爵结束了一整天毫无结果的搜寻，拖着疲惫的身体回到家，终于上床睡下。等屋里所有人都入睡以后，埃德雷德悄悄爬起来穿好衣服。他把卧室里的蜡烛和火柴塞进口袋，蹑手蹑脚地下楼，溜出屋子，一个人朝比尔家走去。这一路走得很慢，也很提心吊胆。在楼梯上，他不止一次觉得身后有一级台阶吱呀响了一声。到了路上，他又一遍遍听见后方仿佛有轻柔的脚步，啪嗒啪嗒地跟着自己。可他每次猛然回头，身后当然都没有人。过了一会儿，他认定老是回头实在很胆小，而且只会让自己更加害怕，便稳稳向前，再也不理会身后的声音。他也完全没有留意，比尔家门边的甜蔷薇丛下有一块黑影，看起来仿佛有人正蹲在阴影里。
        - id: ch01-b121
          speaker: narrator
          text: >-
            他按下门闩，轻轻推门。屋里有东西动了一下，铁链随即哗啦作响。他的心猛地一跳，原来只是特鲁站起来迎接他。他摸到狗链，从墙上铁环解下来，关好门走出去。特鲁高高兴兴地跟着。他又疑心地看看甜蔷薇的阴影，可狗丝毫不安也没有，他便知道那里没什么可怕的。特鲁给了他莫大的安慰。后来他告诉埃尔弗里达，这全是特鲁的功劳。没有这个伙伴，他一定走不下去。
        - id: ch01-b122
          speaker: narrator
          text: >-
            到里程碑以前，特鲁一直松松地拖着链子跟在后面。到了那里，它突然冲到前头，链子绷得笔直，埃德雷德使出全力才追得上。他们登上山坡，走进丘陵，在金雀花间穿行。男孩的眼睛适应了柔和的星光，夜色也不再黑暗。他跟着狗穿过金雀花与荆棘，没有绊倒，也没让数不清的尖刺扎伤。
        - id: ch01-b123
          speaker: narrator
          text: >-
            特鲁忽然停下，闻了闻，打个喷嚏，又呼呼吹气，接着刨起土来。
        - id: ch01-b124
          speaker: edred
          text: 走吧，好狗。快走啊，特鲁。
        - id: ch01-b125
          speaker: narrator
          text: >-
            他想象迪基被锁在孤零零的小屋里，只想赶快找到他，放他出来，平安带回家，便使劲拉链子。可特鲁抖抖身子，继续在一大丛金雀花下挖。那花丛比一路上的任何一丛都大。尖刺扎着它的鼻子和爪子，它却只偶尔停下来打喷嚏、呼呼吹鼻子，然后接着挖。
        - id: ch01-b126
          speaker: narrator
          text: >-
            埃德雷德想起带来的大厅修枝刀，抽刀准备割掉花枝。说不定迪基被捆在花丛中央。
        - id: ch01-b127
          speaker: edred
          text: 迪基，迪基。
        - id: ch01-b128
          speaker: narrator
          text: >-
            没人回答，只有特鲁不停挖土。埃德雷德抓住一根花枝，没想到枝条是松的，不用刀便落在手里。另一根也是如此。他脱下外套裹住双手，抱住一大捆枝条用力一扯，整个人仰面摔倒，那堆尖刺也压到身上。特鲁发疯似的扯着链子。他挣扎起来，看见花枝下面露出一个洞，狗正往里钻。洞很大，只是没完全露出来。他俯身查看，脚下一滑，整个人掉了进去，狗还在往前拖。
        - id: ch01-b129
          speaker: edred
          text: 停下，特鲁！趴下！
        - id: ch01-b130
          speaker: narrator
          text: >-
            狗停住，链子依旧绷得笔直。埃德雷德庆幸带了蜡烛。他点亮蜡烛，眨眨眼，马上看出自己站在地下通道入口。头顶金雀花枝织成网，星星清清楚楚地露在网后。他站起来，跟着特鲁往前，忽然明白，这就是他和埃尔弗里达找了许多次却始终没找到的走私者洞穴。
        - id: ch01-b131
          speaker: narrator
          text: >-
            狗和男孩继续向前，先穿过长长的通道，又走下凿在岩石里的台阶，再穿过一扇粗糙而沉重的门，终于来到走私者的洞穴。那是一座巨大无比的洞窟，足有一座教堂那么大。洞窟上方的尽头有一股水从洞口落下来，又流过整座洞窟。清澈的溪水两岸，全是平滑的沙地。就在溪边的沙地上，躺着一团黑乎乎的东西。特鲁猛然一跃，铁链从埃德雷德手中挣脱。它扑到那团黑影上，又舔又呜咽，喉咙里发出小狗只有在充满爱与狂喜时才会有的低鸣。因为那团黑影正是迪基。他睡得很沉，身上紧紧捆着绳子。可怜的跛脚和另一只脚牢牢缚在一起，两条胳膊也同样被绑住。就在这时，他醒了。
        - id: ch01-b132
          speaker: dickie
          text: 下去，特鲁！安静，嘘！
        - id: ch01-b133
          speaker: edred
          text: 那个男人和女人在哪儿？
        - id: ch01-b134
          speaker: dickie
          text: >-
            埃德雷德，是你！你真是个了不起的好伙伴。他们在更里面的洞里。我睡着以前还听见他们打鼾。
          emotion: surprised
        - id: ch01-b135
          speaker: edred
          text: 躺着别动。我带了刀，这就割断绳子。
        - id: ch01-b136
          speaker: narrator
          text: >-
            绳索割开了。迪基想站起来，可手脚僵得动不了。埃德雷德替他揉腿，他自己伸展手指，等胳膊上针扎似的麻木退去。蜡烛插在沙里，只照亮身边一小圈地方。他们谁也没看见，一个黑影正爬过沙地，悄悄逼近。直到那人很近，埃德雷德才抬头。
        - id: ch01-b137
          speaker: edred
          text: 啊！
          emotion: fearful
        - id: ch01-b138
          speaker: dickie
          text: 完了。快跑，别管我，我总能自己逃出去。
          emotion: fearful
        - id: ch01-b139
          speaker: edred
          text: 不。
        - id: ch01-b140
          speaker: narrator
          text: >-
            下一刻，他的心欢喜得猛跳起来。那黑影原来是埃尔弗里达，她身上裹着父亲的长大衣。后来她解释，自己没时间穿长袜，要是不披这件大衣，隔着一英里也会让人凭两条白腿认出来。
        - id: ch01-b141
          speakers: [edred, dickie]
          ensemble: duo
          text: 埃尔弗里达！
          emotion: surprised
        - id: ch01-b142
          speaker: elfrida
          text: >-
            怎么，你们真以为能把我撇在外面？埃德雷德，我一路都跟在你后头。什么也不用告诉我，我一个问题也不问。我们只管离开这里。迪基，靠在我身上。
        - id: ch01-b143
          speaker: narrator
          text: >-
            埃德雷德和埃尔弗里达一边一个扶着迪基，慢慢把他带进通道。到了那里时，迪基的腿已经能活动，也可以重新使用拐杖了。三个孩子一路回到家，叫醒阿登勋爵，告诉他迪基已经找到，又把发生的事情原原本本讲了一遍。阿登勋爵立刻叫醒全家，又叫上比尔和村里六个男人，一同赶往洞穴。他们到达时，那一男一女竟然还在洞穴深处昏昏沉沉地睡着。众人抓住两人，牢牢绑起他们的双手，再把他们一路押到镇上，交进警察局。
        - id: ch01-b144
          speaker: narrator
          text: >-
            警察搜查那个男人，从他身上找到了那封信。他正是你听说过的红头发家伙，信则是他从塔尔博特府偷来的。
        - id: ch01-b145
          speaker: lord_arden
          text: >-
            孩子，恭喜你交了好运。当然，我们还得查清楚，可我一点也不怀疑，你就是阿登勋爵。
        - id: ch01-b146
          speaker: dickie
          text: 我不想做阿登勋爵。
        - id: ch01-b147
          speaker: narrator
          text: >-
            这话是真的，可与此同时，他的确又想做阿登勋爵。他想起自己从前不过是德特福德跛脚的小迪基，如今却会成为理查德·阿登勋爵。他又想起，这座壮丽的城堡将会属于自己，自己会成为一个古老姓氏和一片古老土地的主人。每想到一件，心里便有一个声音唱起来。所有声音合在一起，成了一支无比美妙的歌。可是，他刚才说不想做阿登勋爵，那句话也是真的。我们的心里往往容得下两支曲子，让它们在同一时刻一起奏响。
        - id: ch01-b148
          speaker: dickie
          text: 我真的不想。您才该是阿登勋爵，先生。您待我这么好。
        - id: ch01-b149
          speaker: lord_arden
          text: >-
            亲爱的孩子，从前没有爵位和城堡，我也过得很好。如果它们属于你，我失去以后照样能过得很好。该属于你的权利，一定会交给你。这不会伤害我，千万别这样想。
          emotion: calm
        - id: ch01-b150
          speaker: narrator
          text: 迪基心里闪过许多念头，用力握了握他的手。
        - id: ch01-b151
          speaker: narrator
          text: >-
            迪基从洞穴里获救的故事，很快传遍附近乡野。特鲁受了许多称赞，人人都说它聪明又忠心，可埃德雷德得到的称赞更多。人们议论着，别人怎么就没想到让狗循着气味找人呢？埃德雷德却一遍遍说，这件事主要是特鲁的功劳。于是，大家又开始夸他谦逊。除了埃尔弗里达，也许从来没有谁真正明白，那一夜独自摸黑走出家门，再跟着狗钻进地下洞穴救回表兄，究竟让埃德雷德付出了多少。
        - id: ch01-b152
          speaker: narrator
          text: >-
            埃德雷德的父亲和霍尼塞特太太仔细谈过这件事，最后两人的看法完全一样。他们认为，埃德雷德是因为太挂念自己的朋友和玩伴，才突然发起高烧。他那一夜做出的所有事，也都是神志不清时做出来的。你知道，人发烧的时候，的确可能做出一些平时绝不会做，也绝不会想到去做的怪事。
        - id: ch01-b153
          speaker: narrator
          text: >-
            后来，红头发男人和那个女人被送上巡回审判的法庭。他们做过的事受到了审问，两个人也都受到了应得的惩罚。也许你会问，这两个人怎么会知道那座洞穴？那是一个连附近乡下人似乎都不知道的地方，他们又是从哪儿找到入口的？对这个问题，我只能老老实实地回答，我不知道。我只知道一件事。你认识的每一个人，心里都装着许多你不知道的事情。你不知道他们知道，可他们确实知道。
        - id: ch01-b154
          speaker: narrator
          text: >-
            一个星期以后，大家一起回到那里，仔细探查那座洞穴。他们在深处发现一处奇怪的构造，是用砖块、水泥和黏土砌成的，严严实实堵住了一个洞口。那条穿过洞窟的小溪，显然曾经从这个洞口流出去，流到露天的地方。可如今，溪水却被迫转了方向，朝另一边的黑暗深处流去。阿登勋爵看了一阵，指出水流原来的路线已经被人改过。正因为这道堵塞，溪水才会转入地下，从看不见的地方一路流进大海。
        - id: ch01-b155
          speaker: edred
          text: 也许可以让它重新流回护城河。以前它就是那样流的，《阿登史》里写着呢。
        - id: ch01-b156
          speaker: lord_arden
          text: 这件事以后再决定。
        - id: ch01-b157
          speaker: narrator
          text: 他的口袋里，装着律师寄来的一封蓝色长信。
