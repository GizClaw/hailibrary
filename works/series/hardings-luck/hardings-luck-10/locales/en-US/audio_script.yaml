  chapters:
    - id: ch01
      title: The Noble Deed
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Lord Arden, Elfrida, and Edred reached the castle without Dickie. The children supposed Mr. Beale had talked him into spending the night at the cottage, and their father agreed. He was very annoyed that neither Beale nor Dickie had asked him first.
        - id: ch01-b02
          speaker: lord_arden
          text: >-
            Beale has been impertinent, and the boy has been thoughtless. I shall have words with both of them in the morning.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Once Edred and Elfrida were in bed, however, Lord Arden could not settle. What if Dickie was not at Beale's after all? He walked up to the cottage. It was dark and still. After a moment's hesitation, he knocked. At the third knock, a very sleepy Beale put his head out of an upstairs window.
        - id: ch01-b04
          speaker: mr_beale
          text: "Who is it?"
        - id: ch01-b05
          speaker: lord_arden
          text: "It is Lord Arden. Richard is asleep there, I suppose?"
        - id: ch01-b06
          speaker: mr_beale
          text: "I suppose so, my lord."
        - id: ch01-b07
          speaker: lord_arden
          text: >-
            You have made me anxious. I came all this way to make certain he was here.
        - id: ch01-b08
          speaker: mr_beale
          text: >-
            But he ain't here! Didn't you collect him in the dogcart, like you said you would?
          emotion: surprised
        - id: ch01-b09
          speaker: lord_arden
          text: >-
            No! Come down at once, Beale, and bring a lantern. There must have been an accident.
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: >-
            A square of light appeared at the bedroom window. Below it, Lord Arden heard Beale stumbling around.
        - id: ch01-b11
          speaker: mrs_beale
          text: >-
            Here's your coat. Never mind your bootlaces. You ought to have walked part of the way with him.
        - id: ch01-b12
          speaker: mr_beale
          text: "Well, I offered, didn't I?"
        - id: ch01-b13
          speaker: narrator
          text: >-
            Beale blundered downstairs and came around the cottage with a stable lantern. He drew close to Lord Arden's tall, dark shape in the starlight. His voice shook.
        - id: ch01-b14
          speaker: mr_beale
          text: >-
            The little nipper. If anything's happened to him! I mean it, guv'nor—my lord. If anything has happened to that boy! He's one of the best.
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: >-
            The two men hurried toward the gate. On the quiet, dusty road, Beale began talking again.
        - id: ch01-b16
          speaker: mr_beale
          text: >-
            I was no good when he found me, guv'nor. I won't deceive you. That little lad cleaned me up, told me stories, and kept me straight. He's the reason me and 'Melia came together, and the dogs too, and the little one. He got me to give up begging and worse. He don't know what I was like. Why, when I met him, I meant to turn him into a burglar. You'd never believe it.
        - id: ch01-b17
          speaker: narrator
          text: >-
            As they followed the gray road, the whole story came out. They looked to either side, but there were no bushes or stones to hide a child, only the smooth slopes of the downs. Dickie was nowhere in sight.
        - id: ch01-b18
          speaker: narrator
          text: >-
            They searched to the right and left, under bushes, beside stiles and hedges, and through the little old chalk quarry, both of them sick with fear. The white moon rose very late to help them. They woke a dozen village men and brought them into the search. Old Beale came too. He knew every yard of ground for five miles around, and his spaniel knew every inch for ten. Still they found nothing. True rushed around the house and garden, whining and yelping so miserably that 'Melia finally tied him up. There he remained while the search went on without him.
        - id: ch01-b19
          speaker: narrator
          text: >-
            At breakfast, Mrs. Honeysett told Edred and Elfrida that Dickie was lost and their father was still searching. As soon as the children were alone, Edred spoke.
        - id: ch01-b20
          speaker: edred
          text: >-
            It's that beastly magic. He's tried it once too often. Now he's stuck somewhere in history and can't get back.
        - id: ch01-b21
          speaker: elfrida
          text: >-
            And we can't reach him. Oh, if we only had the old white magic and the Mouldiwarp, we could learn what has happened to him.
          emotion: sad
        - id: ch01-b22
          speaker: edred
          text: >-
            Perhaps he's fallen into an abandoned mine. Perhaps he's lying there desperate for water, while his faithful dog has jumped in after him and broken every one of its poor legs.
        - id: ch01-b23
          speaker: narrator
          text: >-
            That dreadful picture reduced Elfrida to helpless tears.
        - id: ch01-b24
          speaker: edred
          text: >-
            We can't do anything. And please stop sniveling, Elfrida. This is a man's job. I can't think while you're crying like that.
        - id: ch01-b25
          speaker: elfrida
          text: "I'm not crying."
        - id: ch01-b26
          speaker: narrator
          text: >-
            This was not true, and she sniffed very hard.
        - id: ch01-b27
          speaker: edred
          text: "Would it help if you made up some poetry?"
        - id: ch01-b28
          speaker: elfrida
          text: >-
            Not without costumes. We nearly always wore costumes for our magic, and they have to belong to dead-and-gone people. Then you can only reach the time when those clothes were worn. Oh, dear Dickie! If he really is down a mine or somewhere like that, what good will any of it do?
        - id: ch01-b29
          speaker: edred
          text: >-
            I'm going to try anyway, and you must try too. I can't make poetry myself.
        - id: ch01-b30
          speaker: elfrida
          text: >-
            Neither can I when I'm this miserable. Poetry is the very last thing you think of when you're unhappy.
        - id: ch01-b31
          speaker: edred
          text: >-
            We can dress up, at least. We'll use the armor from the hall and the Indian feather headdresses Father brought home. I can wear Father's shooting gaiters with brown-paper tops. You can wear Aunt Edith's Roman sash. It's in the right corner drawer. I saw it there when I fetched her prayer book on the wedding day.
        - id: ch01-b32
          speaker: elfrida
          text: "I don't want to dress up. I want to find Dickie."
        - id: ch01-b33
          speaker: edred
          text: >-
            I don't want to either. But we have to do something. It may help if we put the costumes on. Only may, mind you. Let's try.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Elfrida was too miserable to argue. Before long, two equally miserable children faced each other in Edred's room. From the head and the back, each looked like a Red Indian beneath a feathered headdress. After that came a great deal of plate armor over chest and arms. Elfrida wore petticoats and the Roman sash, along with Japanese wicker shoes. Father's shooting gaiters covered her legs, and brown-paper tops made them look like boots. Edred's legs were cased in armor like enormous cricket pads. Jointed coverings enclosed his feet and made them look like chrysalises. The correct plural may be chrysalides, but life would be dull if we always used the correct plural. Through all that splendid confusion, two utterly forlorn faces looked at one another.
        - id: ch01-b35
          speaker: edred
          text: "Now for the poetry."
        - id: ch01-b36
          speaker: elfrida
          text: >-
            I can't! I truly can't. I've tried the whole time we were dressing, and this is all I can think of. Oh, call dear Dickie back to me, I cannot play alone. The summer comes with flower and bee. Where is dear Dickie gone? And I know that won't help.
          emotion: sad
        - id: ch01-b37
          speaker: edred
          text: >-
            Of course it won't. It isn't even yours. It's by Felicia M. Hemans. I'll have a try.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Edred took pencil and paper and tried as hard as he possibly could. You may be sure he held nothing back. But there are things that even the best and bravest cannot do, and Edred simply could not make poetry, not even bad poetry. He could no more do it than you can fly. Poetry was not in him, just as wings are not on you.
        - id: ch01-b39
          speaker: edred
          text: >-
            Oh, Mouldiwarp, you told us we must not have any more magic. But we hope you won't be hard on us, because Dickie is lost and we don't know how to find him.
        - id: ch01-b40
          speaker: narrator
          text: >-
            That was the best Edred could do. To his credit, he seriously doubted whether the words he had written so slowly and carefully counted as real poetry. He would not show them to Elfrida, no matter how she asked. She begged again and again. At about the thirtieth “Please, Edred, do,” he finally handed over the paper. No little girl could have been more polite or less eager to hurt someone's feelings. But Elfrida was truthful too. When Edred asked for her opinion, his voice was muffled with embarrassment.
        - id: ch01-b41
          speaker: edred
          text: "Do you think it's all right?"
        - id: ch01-b42
          speaker: elfrida
          text: "I don't know much about poetry. We can try it."
        - id: ch01-b43
          speaker: narrator
          text: >-
            They tried it. Nothing happened.
        - id: ch01-b44
          speaker: edred
          text: >-
            I knew it was useless. Now I've made a fool of myself for nothing.
          emotion: angry
        - id: ch01-b45
          speaker: elfrida
          text: >-
            I've made a fool of myself plenty of times. I'll do it again if you like, though mine probably won't work any better.
          emotion: calm
        - id: ch01-b46
          speaker: narrator
          text: >-
            Elfrida frowned with all her might. The feathers on her headdress quivered with the effort.
        - id: ch01-b47
          speaker: edred
          text: "Is anything coming?"
        - id: ch01-b48
          speaker: narrator
          text: >-
            She gave a distracted nod.
        - id: ch01-b49
          speaker: elfrida
          text: >-
            Great Mouldiestwarp, on you we call, to do the greatest magic of all. Show us how we are to find dear Dickie, who is lame and kind. Do this for us, and on our hearts we swore, we'll never ask you for anything more.
        - id: ch01-b50
          speaker: edred
          text: >-
            I don't see why that's better than mine. And it should be “swear,” not “swore.”
        - id: ch01-b51
          speaker: elfrida
          text: >-
            I don't think it is better, but you never finished yours. And “swear” wouldn't rhyme. If the Mouldiestwarp hears me, he won't care tuppence about swear or swore. He's far too great to worry about grammar.
        - id: ch01-b52
          speaker: edred
          text: "I wish everyone were."
        - id: ch01-b53
          speaker: narrator
          text: >-
            Perhaps you have often wished the same.
        - id: ch01-b54
          speaker: edred
          text: >-
            Go on, then, though it won't work. Have you forgotten that we can only reach the Mouldiestwarp through a noble deed? Wanting to find Dickie isn't noble.
        - id: ch01-b55
          speaker: elfrida
          text: >-
            No, but if doing a noble deed would bring Dickie back, we'd do it at once, wouldn't we?
        - id: ch01-b56
          speaker: edred
          text: "Oh, I suppose so. Go on, then."
        - id: ch01-b57
          speaker: narrator
          text: >-
            Elfrida recited her verse, and in the next moment it was plain that her poetry had more power than Edred's. It was also plain that a little bad grammar meant nothing to a mighty Mouldiwarp. The bedroom walls drew farther and farther away until they vanished. The children stood in a vast white hall, where avenues of high pillars stretched in every direction, farther than the eye could follow. People in the clothing of every country and every age crowded around them. There were Chinese robes and Indian dress, armored Crusaders, powdered ladies, gentlemen in doublets, Cavaliers with long curls, Turks in turbans, Arabs, monks, abbesses, jesters, grandees with ruffs around their necks, and people dressed in thatched kilts. Every kind of costume you could imagine was there, but every single one was white.
        - id: ch01-b58
          speaker: narrator
          text: >-
            It was like a fancy-dress ball where everyone may choose any costume, so long as it is one color. Elfrida looked down anxiously, remembering how oddly colored their clothes had been. Now every piece was white. Even the Roman sash held five different shades of white. If you doubt there can be so many, try buying white wallpaper from five different shops.
        - id: ch01-b59
          speaker: narrator
          text: >-
            The crowd gently urged the children forward. In the center stood a silver throne covered by a fringed cloth checked in silver and green. The Mouldiestwarp sat there in splendor, with the Mouldiwarp on one side and the Mouldierwarp on the other. He was much larger than either of them, and his fur shone as silver as a swan's feathers.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Everyone watched Edred and Elfrida. They could do nothing but walk slowly and shyly to the throne. Once there, a deep bow seemed the only proper thing, so they bowed.
        - id: ch01-b61
          speaker: mouldiwarp
          text: "What has brought you here?"
        - id: ch01-b62
          speaker: elfrida
          text: "Kind magic."
        - id: ch01-b63
          speaker: mouldierwarp
          text: "What do you desire?"
        - id: ch01-b64
          speaker: edred
          text: "We want Dickie back, please."
        - id: ch01-b65
          speaker: mouldiestwarp
          text: >-
            Dickie is held by people who will keep him from you for many days, unless you go alone and rescue him. It will be hard and dangerous. Will you go?
        - id: ch01-b66
          speaker: edred
          text: "Me? By myself? Not Elfrida?"
        - id: ch01-b67
          speaker: mouldiestwarp
          text: >-
            Dickie can only be ransomed at a great price, and you must pay it. The cost is greater for you than it would be for Elfrida, because she is braver than you.
        - id: ch01-b68
          speaker: narrator
          text: >-
            What a thing for a boy to hear before that whole company! The Mouldiestwarp had asked Edred to perform a noble deed and had told him, in the very same breath, that he was less brave than his sister. Edred flushed a brilliant crimson. The color looked so shocking in that white world that a shudder passed through the entire company.
        - id: ch01-b69
          speaker: white_toreador
          text: >-
            Please don't turn that dreadful color. This is the white world. Crimson is not allowed.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Elfrida took Edred's hand.
        - id: ch01-b71
          speaker: elfrida
          text: "Edred is every bit as brave as I am. He'll go. Won't you, Edred?"
        - id: ch01-b72
          speaker: edred
          text: "Of course I will."
        - id: ch01-b73
          speaker: mouldiestwarp
          text: "Then climb the throne steps and sit beside me."
        - id: ch01-b74
          speaker: narrator
          text: >-
            His voice had become very kind. Edred obeyed. The Mouldiestwarp leaned close and spoke into his ear, so softly that neither Elfrida nor anyone else in the White Hall could hear.
        - id: ch01-b75
          speaker: mouldiestwarp
          text: >-
            If you rescue Richard Arden, you will make the greatest sacrifice of your life. The boy once called Richard Harding is truly Richard Arden. He, not you or your father, is Lord Arden. By saving him, you take the title and castle from your father, and you surrender your own place as heir to your cousin Richard, the rightful heir.
        - id: ch01-b76
          speaker: edred
          text: "But how can Dickie be the rightful heir?"
        - id: ch01-b77
          speaker: mouldiestwarp
          text: >-
            Three generations ago, a baby was stolen from Arden. Death came among the family, and that child became heir to Arden's name and lands. The kidnapper left the baby with a woman in Deptford. She knew only that his clothes bore the name Arden and that a coral and bells, engraved with a coat of arms, was tied around his waist. The man promised to return in a month, but he was killed in a duel. On the night before that duel, he wrote down what he had done. He hid the letter in a secret cupboard behind a portrait of a woman born an Arden at Talbot Court. The letter is still there today.
        - id: ch01-b78
          speaker: edred
          text: "I hope I can remember all of that."
        - id: ch01-b79
          speaker: mouldiestwarp
          text: >-
            No one ever forgets what I tell them. When the man failed to return, the Deptford woman raised the child as her own. He learned a trade and married a working girl. As names sometimes do, Arden changed into Harding. Their child became the father of the Richard you know. That is why Dickie is Lord Arden.
        - id: ch01-b80
          speaker: edred
          text: "Yes."
        - id: ch01-b81
          speaker: mouldiestwarp
          text: >-
            You must never tell your father what I have told you. You must not even tell your sister until you have rescued Dickie and made the sacrifice. This is the one supreme chance of your whole life. Every soul receives one such chance, a chance to be perfectly unselfish, absolutely noble, and true. You may take this chance, but you must take it alone. No one can help you, and no one can advise you. You must keep the nobler thought locked in your own heart until thought has become deed. Only then may you speak. Be humble and thankful that you were allowed to do so fine and brave a thing. Be thankful that your deed has drawn you near to the immortals of every age, those who were given such deeds to do and did them. Then you may tell the truth to the person who loves you best, your sister Elfrida.
        - id: ch01-b82
          speaker: edred
          text: "Doesn't Elfrida get a chance to be noble too?"
        - id: ch01-b83
          speaker: mouldiestwarp
          text: >-
            She will have a thousand chances to be good and noble, and she will take every one. But she will never know that she has done so. Now, are you ready to do what must be done?
        - id: ch01-b84
          speaker: edred
          text: >-
            It feels terribly unkind to Father. He would stop being Lord Arden and lose everything.
        - id: ch01-b85
          speaker: mouldiestwarp
          text: >-
            Doing right can feel unkind to someone. But think. If your father knew his house and castle belonged to another person, how long would he wish to keep them?
        - id: ch01-b86
          speaker: edred
          text: "I see. No, of course he wouldn't. Then what must I do?"
        - id: ch01-b87
          speaker: mouldiestwarp
          text: >-
            After Dickie's father died, a Deptford woman related to his mother took the boy. She treated him badly, and he ran away. Later, she met a former burglar. He had broken into Talbot Court, opened the hidden panel, and found the old letter about Dickie's birth. Those two kidnapped Dickie. They hoped he would sign a promise to pay them for the letter proving he is heir to Arden. Now they know a child's promise is worthless in law, but they fear punishment if they release him. If you do nothing, your father keeps Arden and you inherit it.
        - id: ch01-b88
          speaker: edred
          text: "But what do I do to bring Dickie home?"
        - id: ch01-b89
          speaker: mouldiestwarp
          text: >-
            Go alone, at night, to Beale's cottage. Open the door. Richard's dog will be asleep by the fire. Unchain him and lead him to the milestone at the crossroads. Then follow wherever he goes. Bring a knife to cut cords, and bring all your courage. Now look into my eyes.
        - id: ch01-b90
          speaker: narrator
          text: >-
            Edred looked. The Mouldiestwarp's eyes no longer seemed like a mole's. They became the eyes of everyone Edred had ever loved. Through them shone the souls of all the brave people he had read about.
        - id: ch01-b91
          speakers: [heroic_voice_1, heroic_voice_2, heroic_voice_3, heroic_voice_4]
          ensemble: chorus
          text: "Courage, Edred. Be one of us."
        - id: ch01-b92
          speaker: mouldiestwarp
          text: "Now look at the people in the hall."
        - id: ch01-b93
          speaker: narrator
          text: >-
            Edred looked, and none of them were strangers now. He knew Joan of Arc and Peter the Hermit, Hereward and Drake. He saw Elsa, whose brothers had been turned into swans, and Saint George, who killed the dragon. There was Blondel, who sang until he found his imprisoned king, and Lady Nithsdale, who brought her husband safely out of the cruel Tower. Around them stood captains who had gone down with their ships and generals who had died while fighting for desperate hopes. There were patriots and kings, nuns and monks, men and women and children. Every one of them carried the same light in their eyes, the light that shines so splendidly through the dreams of humankind.
        - id: ch01-b94
          speaker: narrator
          text: >-
            As Edred came down from the throne, those great souls crowded around and clasped his hand.
        - id: ch01-b95
          speakers: [heroic_voice_1, heroic_voice_2, heroic_voice_3, heroic_voice_4]
          ensemble: chorus
          text: "Be one of us, Edred. Be one of us."
        - id: ch01-b96
          speaker: narrator
          text: >-
            A fierce white light filled everything. An instant later, the children were back between the narrow walls of Edred's bedroom.
        - id: ch01-b97
          speaker: elfrida
          text: "Well, what did it tell you? And goodness, you do look strange."
        - id: ch01-b98
          speaker: edred
          text: "Don't! Help me get this armor off."
          emotion: angry
        - id: ch01-b99
          speaker: elfrida
          text: "But what did it say?"
        - id: ch01-b100
          speaker: edred
          text: "I can't tell you. I won't tell anyone until it is over."
        - id: ch01-b101
          speaker: elfrida
          text: "Fine. Keep your old secrets."
        - id: ch01-b102
          speaker: narrator
          text: >-
            Elfrida left him. That was hard for Edred.
        - id: ch01-b103
          speaker: edred
          text: >-
            I can't help it! Oh, Elfrida, if you're going to pester me too, it is more than I can bear.
        - id: ch01-b104
          speaker: elfrida
          text: "You truly aren't allowed to tell me?"
        - id: ch01-b105
          speaker: edred
          text: "I've told you fifty times."
        - id: ch01-b106
          speaker: narrator
          text: >-
            That was not true. He had told her only twice.
        - id: ch01-b107
          speaker: elfrida
          text: >-
            All right. I won't ask one more question. But you'll tell me the moment you can, won't you? And you'll let me help?
        - id: ch01-b108
          speaker: edred
          text: >-
            No one can help or advise me. If I do this, I must do it on my own. Now please be quiet. I need to think.
        - id: ch01-b109
          speaker: narrator
          text: >-
            Elfrida was awed by this unusual wish, though it annoyed her too.
        - id: ch01-b110
          speaker: elfrida
          text: "Perhaps you would like me to leave."
        - id: ch01-b111
          speaker: edred
          text: "Yes, please."
        - id: ch01-b112
          speaker: narrator
          text: >-
            So she went. Edred sat on the box at the foot of his bed and tried to think. It was not easy.
        - id: ch01-b113
          speaker: edred
          text: "I ought to go."
        - id: ch01-b114
          speaker: black_mole
          text: "But think about your father."
        - id: ch01-b115
          speaker: narrator
          text: >-
            That other voice was part of Edred too. He thought so hard that every thought became tangled with the next. His head grew terribly hot, while his hands and feet turned cold. Mrs. Honeysett came in and cried out when she saw his white face. She felt his hands, declared that he was in a high fever, and put him straight to bed. Wet cloths went onto his forehead and hot-water bottles against his feet. Perhaps he truly was feverish. At any rate, he could never be certain afterward whether a very polite and reasonable black mole had really sat on his pillow for most of that day. It spoke in a persuasive voice, saying everything that the part of Edred he liked least was only too ready to believe.
        - id: ch01-b116
          speaker: black_mole
          text: >-
            Think of your father. Nobody will ever know. Dickie will be all right somehow. Perhaps you only dreamed he was imprisoned. It may not be true. And anyway, this is not your business, is it?
        - id: ch01-b117
          speaker: narrator
          text: >-
            You know the sort of thing. Elfrida was kept out in case his illness was catching. Edred tossed all day, hearing the black mole, or something like it, while his better self answered.
        - id: ch01-b118
          speaker: edred
          text: >-
            I must go. Poor Dickie! I promised I would go. Yes. I will go.
        - id: ch01-b119
          speaker: narrator
          text: >-
            Late that night, Lord Arden returned from a long, fruitless search and went exhausted to bed. When the house was asleep, Edred rose and dressed. He put his bedroom candle and matches in his pocket, crept downstairs, slipped outside, and started toward Beale's cottage.
        - id: ch01-b120
          speaker: narrator
          text: >-
            The journey was slow and full of nerves. More than once on the staircase, Edred thought he heard a stair creak behind him. Again and again on the road, he imagined a soft footstep padding after him. Each time he turned, he could see that nobody was there. At last he decided it was cowardly to keep looking around. Besides, every glance over his shoulder only made him more frightened. From then on, he kept steadily forward and refused to notice anything behind him. When he reached Beale's cottage, a black patch beside the sweetbrier looked exactly like a person crouching in the shadow. Edred walked past as though it were nothing at all.
        - id: ch01-b121
          speaker: narrator
          text: >-
            He pressed the latch and opened the door very gently. Something moved, and a chain rattled. His heart gave an unpleasant jump. It was only True, rising to greet a visitor. Edred found the white dog in the darkness, unhooked his chain from the wall, closed the door, and set out with True following willingly.
        - id: ch01-b122
          speaker: narrator
          text: >-
            Edred eyed the shadow under the sweetbrier again. True showed no fear, so there could be nothing dangerous there. The dog was a tremendous comfort. Edred later told Elfrida that it had all been True's doing. Without that good companion, he was sure he could never have gone on.
        - id: ch01-b123
          speaker: narrator
          text: >-
            True followed on a loose chain until they reached the milestone. Then he sprang forward. The chain pulled tight, and Edred had to work hard to keep up. They climbed onto the downs and wound between the furze bushes. Edred's eyes had grown used to the mild starlight. He passed through gorse and brambles without stumbling or meeting their countless sharp thorns.
        - id: ch01-b124
          speaker: narrator
          text: >-
            Suddenly True stopped. He sniffed, sneezed, blew through his nose, and began digging.
        - id: ch01-b125
          speaker: edred
          text: "Come along, True. Come on, good dog."
        - id: ch01-b126
          speaker: narrator
          text: >-
            Edred imagined Dickie held in some lonely cottage. He longed to free him and get them both safely home, so he tugged the chain. True shook himself and kept digging beneath the largest clump of furze they had seen. Spikes stabbed his nose and paws, but small troubles could not stop True. He paused only to sneeze and blow, then dug again.
        - id: ch01-b127
          speaker: narrator
          text: >-
            Edred remembered the large pruning knife he had taken from the hall drawer. Perhaps Dickie lay bound inside the bush. He drew the knife to cut the branches away.
        - id: ch01-b128
          speaker: edred
          text: "Dickie? Dickie?"
        - id: ch01-b129
          speaker: narrator
          text: >-
            No answer came. True only snuffled, sneezed, and dug. Edred grasped a furze branch, but it came loose before he could cut it. A second did the same. He wrapped his jacket around his hands, seized an armful, and pulled. He fell backward beneath a great prickly bundle.
        - id: ch01-b130
          speaker: narrator
          text: >-
            True strained wildly at the chain. Edred scrambled up and saw that the furze had hidden a hole. The dog was vanishing into it. The opening was large, though only partly uncovered. Edred leaned over to look, slipped at the edge, and fell straight in as True dragged ahead.
        - id: ch01-b131
          speaker: edred
          text: "Stop, True. Lie down, sir."
        - id: ch01-b132
          speaker: narrator
          text: >-
            True stopped, though the chain stayed stretched tight. Edred was grateful now that he had remembered his bedroom candle. He pulled it from his pocket, struck a match, and lit it. As he blinked in the small flame, he saw almost at once that he had fallen into the beginning of an underground passage. When he looked upward, the stars shone plainly through a net of furze branches. He stood, and True immediately moved forward again. In the next moment, Edred knew where they were. This was the old smugglers' cave that he and Elfrida had searched for so often and had never been able to find.
        - id: ch01-b133
          speaker: narrator
          text: >-
            Boy and dog followed the passage together. It led them down a flight of steps cut straight into the rock, then through a rough and heavy door. Beyond that door lay the smugglers' cave itself, an enormous cavern as large as a church. At its upper end, a stream of water poured from an opening in the rock. The clear water crossed the whole cave between two shores of smooth sand. On the sand beside that stream, Edred saw something dark lying perfectly still.
        - id: ch01-b134
          speaker: narrator
          text: >-
            True bounded forward so sharply that the chain flew from Edred's hand. He leaped onto the dark shape, licking, whining, and making little dog sounds of pure love and joy. It was Dickie, fast asleep. Cords bound his arms and tied his poor lame foot tightly to the other. Now he woke.
        - id: ch01-b135
          speaker: dickie
          text: "Down, True! Quiet. Shh!"
        - id: ch01-b136
          speaker: edred
          text: "Where are the man and woman?"
        - id: ch01-b137
          speaker: dickie
          text: >-
            Edred! You absolute brick! They're in the cave beyond this one. I heard them snoring before I fell asleep.
          emotion: surprised
        - id: ch01-b138
          speaker: edred
          text: "Keep still. I brought a knife. I'll cut you free."
        - id: ch01-b139
          speaker: narrator
          text: >-
            He cut the cords. Dickie tried to rise, but his limbs were stiff. Edred rubbed his legs while Dickie stretched his fingers until the pins and needles left his arms. The candle stood upright in the sand, casting a small circle of light. That was why they failed to see a dark figure creeping silently toward them. It was very close when Edred finally looked up.
        - id: ch01-b140
          speaker: edred
          text: "Oh!"
          emotion: fearful
        - id: ch01-b141
          speaker: dickie
          text: >-
            It's all over. Run! Don't mind me. I'll find a way out somehow.
          emotion: fearful
        - id: ch01-b142
          speaker: edred
          text: "No."
        - id: ch01-b143
          speaker: narrator
          text: >-
            Then his heart leaped with joy. The figure was Elfrida, wrapped in her father's long coat. She explained later that she had not had time to put on stockings. Her white legs would have given her away from a mile off if the coat had not covered them.
        - id: ch01-b144
          speakers: [edred, dickie]
          ensemble: duo
          text: "Elfrida!"
          emotion: surprised
        - id: ch01-b145
          speaker: elfrida
          text: >-
            You didn't really think I would stay out of this. I've followed you the whole way, Edred. Don't explain anything. I won't ask questions. We only need to get away. Dickie, lean on me.
        - id: ch01-b146
          speaker: narrator
          text: >-
            Edred and Elfrida raised Dickie and supported him between them until they reached the passage. One walked on either side. By then, feeling had returned enough for him to use his legs and his crutch. The three children made it safely home and woke Lord Arden. They told him Dickie had been found and explained everything that had happened in the cave. Lord Arden roused the whole house. He, Beale, and half a dozen men from the village went back up to the cavern. The wicked man and woman were still sunk in a stupid sleep. The men bound the prisoners' hands, marched them into town, and handed them over at the police station.
        - id: ch01-b147
          speaker: narrator
          text: >-
            When they searched the redheaded man, they found the letter he had stolen from Talbot Court. Lord Arden read it.
        - id: ch01-b148
          speaker: lord_arden
          text: >-
            My boy, I congratulate you on your good fortune. We must investigate properly, of course, but I have no doubt that you really are Lord Arden.
        - id: ch01-b149
          speaker: dickie
          text: "I don't want to be."
        - id: ch01-b150
          speaker: narrator
          text: >-
            That was true, though another truth lived beside it. Part of Dickie did want to be Richard, Lord Arden. Until now, he had been only little lame Dickie from Deptford. Now this glorious castle might belong to him. He might become the master of an ancient name and an ancient home, with all their long history behind them. That thought sang a beautiful tune inside his heart. Yet the words he had spoken were true as well. He did not want to take those things from the man who had shown him such kindness. There is often room inside one heart for two tunes at the very same time.
        - id: ch01-b151
          speaker: dickie
          text: >-
            I truly don't want it. You should be Lord Arden, sir. You've been so kind to me.
        - id: ch01-b152
          speaker: lord_arden
          text: >-
            My dear boy, I lived perfectly well before I had the title and castle. If they belong to you, I shall live perfectly well without them again. You will have everything that is rightfully yours, and it will not hurt me. You mustn't think it will.
          emotion: calm
        - id: ch01-b153
          speaker: narrator
          text: >-
            Dickie thought many things and gripped Lord Arden's hand very hard.
        - id: ch01-b154
          speaker: narrator
          text: >-
            The story of Dickie's rescue became the talk of the whole countryside. True received a great deal of praise, but Edred received even more. Everyone wondered why no one else had thought of putting the dog on Dickie's scent. Edred always answered that the rescue had mostly been True's doing. That only made people praise the boy for his modesty. Yet nobody, except perhaps Elfrida, ever understood what the journey had truly cost him. They knew he had crossed the dark and saved his cousin, but they did not know what else he had chosen to give up when he went.
        - id: ch01-b155
          speaker: narrator
          text: >-
            Lord Arden and Mrs. Honeysett decided that anxiety for his friend had caused Edred's fever, and that he had performed the rescue while delirious. People in fevers can do very strange things that they would never do otherwise.
        - id: ch01-b156
          speaker: narrator
          text: >-
            The redheaded man and the woman were brought to trial at the assizes, and both were punished. You may wonder how those two knew about the caves when none of the country people seemed even to know they existed. If you ask me, I can only answer that I do not know. I know just one thing about it. Every person you know carries around a great many pieces of knowledge that you have no idea they possess.
        - id: ch01-b157
          speaker: narrator
          text: >-
            One week later, they all returned to explore the caves properly. There they discovered a curious arrangement made of brickwork, cement, and clay. It sealed a hole through which the stream had plainly flowed out into the open air long ago. Now, instead of passing through that old opening, the water ran away into darkness. Lord Arden pointed out the marks of what had been done. Someone had diverted the stream from its former course and forced it to travel underground all the way to the sea.
        - id: ch01-b158
          speaker: edred
          text: >-
            We could let the stream flow into the moat again. That was its old course. The History of Arden plainly says it used to run that way.
        - id: ch01-b159
          speaker: lord_arden
          text: "We shall have to decide that later."
        - id: ch01-b160
          speaker: narrator
          text: >-
            In his pocket was a long blue letter from the lawyers.
