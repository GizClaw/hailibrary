cover_prompt: |-
  A wordless cover scene in a poor South London back garden around 1909 shows a small lame boy discovering a single enormous white moonflower rising above a tangle of green growth. The boy has pale, putty-colored cheeks, a grimy face, worn clothes, one heavy iron-braced boot, and a little crutch made from a cut-down broom, while an old blackened bell rattle hangs safely from his free hand. He reaches toward the cream-white flower as its tree-like stalk catches the last golden sunlight, making wonder and recognition the focal action. Beyond the low fence, rows of soot-stained yellow houses fade into evening while the renewed garden offers a glimpse of another, greener world. Use a wide child-height view with the boy and flower low in the frame, a clear visual path from the cramped yard toward the luminous sky, and broad calm room at the top. Keep the setting, clothing, mobility aid, flower, and period details grounded in the original Edwardian story and independent of screen adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
