  chapters:
    - id: ch01
      title: Buried Treasure
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Then, standing in the sunshine, Dickie suddenly understood. He had longed to dream again of the old house above Deptford, and now he had succeeded. From the window of that dream-house he looked into the dream-garden. Clipped yew trees stood beside avenues edged with box, and beyond them lay the bowling greens. Yet this was no dream. It was real, every bit as real as the other Deptford. In that life he had planted Artistic Bird Seed, gathered moonflowers, and harvested the silver seeds of magic. That had been magic, and this was magic too. Dickie knew it at last without the least doubt. He had lived in the time of the first King James long enough to hear plenty of talk about magic. If what had happened to him was not magic, then there never had been magic and never would be any magic for anyone. He turned from the window and studied the tapestry-hung room. He saw the great bed and the pleasant wrinkles in his nurse's face. All of it was as solid and real as anything in his other life, where he was a lame little boy who took to the road with a dirty tramp for a father and slept in a bed with green curtains.
        - id: ch01-b02
          speaker: nurse
          text: "Was your friend well in that dream?"
        - id: ch01-b03
          speaker: dickie
          text: >-
            Yes, very well. I carved boxes there and sold them. I want to learn many more things, so when I go back—when I dream that dream again—I can earn more money.
        - id: ch01-b04
          speaker: nurse
          text: "It is a shame for someone of your name to work for money."
        - id: ch01-b05
          speaker: dickie
          text: >-
            But that isn't my name there. Old Sebastian says everyone should do some duty for his country, or he isn't worth his meat and ale. And money feels so good when you've earned it yourself.
        - id: ch01-b06
          speaker: nurse
          text: >-
            I should know. I've earned mine for long enough. Now hurry and dress. Breakfast first, and then your fencing lesson.
        - id: ch01-b07
          speaker: narrator
          text: >-
            After fencing, Dickie paused over what to do next. Of course he wanted to race down to Sebastian and learn more about building their little galleon. But another wish pulled at him too. He wanted to learn a trade he could teach Beale in the other Deptford. Dickie knew as surely as any master craftsman that Beale would never manage work that called for delicate fingers. Woodcarving and the making of toy boats were both beyond him. Beale was certainly fond of dogs, though, and that might lead somewhere useful. Dickie remembered little True curling close against him and nestling inside his coat when they lay down to sleep in Lavender Terrace, with only newspapers and scraps of sacking for a bed.
        - id: ch01-b08
          speaker: narrator
          text: >-
            So Dickie went to the kennels. He had visited before with Master Roger Fry, his fencing master, but he had never spoken to the kennelman. He knocked at the man's door and called out in the grand manner people used in old plays.
        - id: ch01-b09
          speaker: dickie
          text: "What ho! Is anyone within?"
        - id: ch01-b10
          speaker: narrator
          text: >-
            The door flew open. A man dressed from head to foot in leather stood there. His face was the very face of Dickie's neighbor in Lavender Terrace, the man who had dug up the garden for the parrot seed.
        - id: ch01-b11
          speaker: dickie
          text: "Why, it's you!"
          emotion: surprised
        - id: ch01-b12
          speaker: kennelman
          text: "Who else would it be, little master?"
        - id: ch01-b13
          speaker: narrator
          text: >-
            He saluted respectfully. Dickie saw at once that although this man had the neighbor's face, he had none of the neighbor's memories.
        - id: ch01-b14
          speaker: dickie
          text: "Do you live here? I mean, have you always lived here?"
        - id: ch01-b15
          speaker: kennelman
          text: >-
            Where else would I live? I've served your father all my life, from boyhood onward. I know every hair on every dog he owns.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Dickie thought that was a great deal to know, and so it was. He stayed at the kennels for a whole hour and left knowing far more about dogs than he had known when he arrived. Some of the lessons would astonish a modern animal doctor. The dogs were given herb tea instead of medicine from a chemist, and charms were spoken over them to make them swift and strong. Yet the dogs themselves looked healthy and happy. Whatever a modern doctor might have said about the treatment, neither the herb tea nor the charms seemed to make the animals any less strong or swift.
        - id: ch01-b17
          speaker: narrator
          text: >-
            When Dickie had absorbed all the dog learning he could bear for one day, he felt free to visit the dockyard. Sebastian was shaping a great tree trunk into a mast with his axe. At the sound of Dickie's voice, he stopped his blows and smiled back at him.
        - id: ch01-b18
          speaker: dickie
          text: "Oh, I haven't seen you for such a long time!"
        - id: ch01-b19
          speaker: sebastian
          text: >-
            A very long time indeed. Two whole days, both spent enjoying the King's water pageant. Two days! A great, great while.
        - id: ch01-b20
          speaker: dickie
          text: "I want you to teach me everything you know."
        - id: ch01-b21
          speaker: narrator
          text: "Dickie picked up an awl and tested its point. Sebastian laughed."
        - id: ch01-b22
          speaker: sebastian
          text: >-
            Be patient with me. I'll teach you everything you can learn, but not all at once. We will go little by little, slowly and surely.
        - id: ch01-b23
          speaker: dickie
          text: >-
            You mustn't think this is only play, or that I needn't learn because I'm my father's son.
        - id: ch01-b24
          speaker: sebastian
          text: >-
            Would I ever think that? I sailed with Captain Drake and Captain Raleigh. I saw how a gentleman adventurer must be ready to try any craft. If you're as eager to learn as I am to teach, I'll teach as quickly as you can learn. Now, to work!
        - id: ch01-b25
          speaker: narrator
          text: >-
            Sebastian brought out the ribs of the little galleon they had begun together, and they set to work. The whole day was happy. Yet one happiness shone above all the others as the sun shines above small stars. Dickie was once more a little boy who had no need of a crutch.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The wide, beautiful life opened around him again. Dickie learned one thing after another, and every day seemed good and happy. His nights were white and peaceful in the great house and the lovely garden that lay along the slopes above Deptford. No dreams disturbed them. By day he lived gladly and honorably as the son of a great and noble house. For a while he had worried about Beale, left alone in the little house in the other Deptford. Now those pricks of conscience had stopped, because one day Dickie had asked his nurse how time passed between the two lives.
        - id: ch01-b27
          speaker: dickie
          text: >-
            How long did I spend dreaming about the ugly place where I made boxes and earned money?
        - id: ch01-b28
          speaker: nurse
          text: >-
            Dreams of that place take none of our time here. And when you dream of this place, it takes none of the time in that other place.
        - id: ch01-b29
          speaker: dickie
          text: "But my dream lasted all night."
        - id: ch01-b30
          speaker: nurse
          text: >-
            No, it didn't. You slept a whole good night only after the dream was over.
        - id: ch01-b31
          speaker: narrator
          text: >-
            She smiled between the white frills of her cap. Dickie understood that no time at all had passed for Beale. Whenever he returned, he would reach Deptford at the very instant he had left it. That is the heart of this particular kind of white magic. So when Dickie did return to Mr. Beale, it would be because his heart called him back, and for no other reason.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Days became weeks, and weeks became months. Autumn arrived. Apples ripened on the trees, and grapes grew ripe along the garden walls and over the trellises. Then came a day when every servant in the house seemed suddenly to go mad. It was a great rushing madness of mops and brooms, dusters and pails. Every room that was already perfectly clean had to be cleaned again. Every surface that already shone had to be freshly polished. Dickie tried to keep out of the way, but he was turned out of three rooms, one after another. Then he tumbled over a pail. Soon afterward an angry cook pinned a dishcloth to his doublet. At last he escaped to the linen room, where Nurse was very busy, and asked what all the commotion meant.
        - id: ch01-b33
          speaker: dickie
          text: "It can't be spring cleaning. This is the wrong time of year."
        - id: ch01-b34
          speaker: nurse
          text: >-
            Don't say I never told you. Your father and mother come home tomorrow, with your baby brother. A week from today, your little cousins will come to visit.
        - id: ch01-b35
          speaker: narrator
          text: "She unfolded a great embroidered cupboard cloth and held it up to inspect it."
        - id: ch01-b36
          speaker: dickie
          text: "How perfectly glorious! But you never told me."
          emotion: happy
        - id: ch01-b37
          speaker: nurse
          text: "If I didn't, it was because you never asked."
        - id: ch01-b38
          speaker: dickie
          text: >-
            I didn't dare. I was afraid. You see, I've never seen them.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Dickie spoke as though in a dream. Nurse folded the cloth, laid it away in the deep oak press with its smooth brown iron hinges, and took out another.
        - id: ch01-b40
          speaker: nurse
          text: "Afraid? Never seen your own father and mother?"
          emotion: surprised
        - id: ch01-b41
          speaker: dickie
          text: >-
            Perhaps the fever made me forget. You said it made me lose things from my memory. I don't remember them at all.
        - id: ch01-b42
          speaker: nurse
          text: "Don't tell them that."
        - id: ch01-b43
          speaker: narrator
          text: "She looked at him very gravely."
        - id: ch01-b44
          speaker: dickie
          text: >-
            I won't, unless they ask. Oh, Nurse, please let me help. What can I do?
        - id: ch01-b45
          speaker: nurse
          text: >-
            Gather whatever flowers remain in the garden and make a nosegay for your mother's room. Put them neatly in fresh water. Then ask your tutor to teach you a welcome song to say when they arrive.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Gathering the last flowers from the garden was pleasant work, and so was arranging them in clean water for his mother's room. Asking such a personal favor of the sour-faced tutor Dickie disliked was another matter. It was neither easy nor pleasant, but Dickie made himself do it. The tutor seemed delighted by the chance to set him an especially difficult and uninteresting poem. Its opening praised the man who retired happily to his own home, turned away from admired glory, and lived there free. Then it warned that a proud man who struggled to climb the skies would fall in disgrace before he died.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Dickie could not help thinking that the father and mother who would be his in this beautiful world might prefer something simpler and more loving from their little boy. The poem seemed to care far more about fame and trees and burdens than about welcoming one's parents home. Only the last verse meant anything very definite to Dickie. In that verse, he was required to hope that people would someday say of him, “He died a good old man.” Dickie did not hope for that at all. Indeed, until the poem told him to, he had never so much as thought of dying as a good old man.
        - id: ch01-b48
          speaker: narrator
          text: >-
            He felt so strongly about it that he tried to write a poem of his own. He managed four lines. They said no one could take a mother's place, and there was no one he would rather see than his father. Then he could think of nothing more. Worse still, he had a nagging suspicion that the first two lines, which were by far the best, were not truly his. He gave up poetry as something he was not made for and painfully learned the tutor's gloomy verses instead.
        - id: ch01-b49
          speaker: narrator
          text: >-
            He never finished reciting them. Once the rush of the arrival had quieted, Dickie's heart began beating terribly fast. His tutor led him before the finest gentleman and the dearest lady Dickie had ever seen. A little shove sent him two steps forward, alone upon the best carpet laid out in their honor. The tutor hissed fiercely in his ear.
        - id: ch01-b50
          speaker: tutor
          text: "Recite your welcome song."
        - id: ch01-b51
          speaker: dickie
          text: "Happy the man who—"
        - id: ch01-b52
          speaker: narrator
          text: >-
            He began in miserable tones and trembled through the opening lines. Before he reached the part about striving with pride, the dear lady swept him into her arms.
        - id: ch01-b53
          speaker: mother
          text: "Bless my dear son! How you've grown!"
          emotion: happy
        - id: ch01-b54
          speaker: narrator
          text: "The fine gentleman thumped Dickie warmly on the back."
        - id: ch01-b55
          speaker: father
          text: "Carry yourself like a gentleman's son, boy, not like some sickly old pedant."
        - id: ch01-b56
          speaker: narrator
          text: >-
            Both parents laughed, and Dickie cried a little. In all the warmth and noise, the tutor seemed to be blotted right out of the picture. Suddenly Dickie and his parents were as merry together as if they had known one another all their lives. There was no need for a stiff poem to bring them close. Then a stout young nurse carried in the baby. Dickie loved his little brother at once and felt perfectly certain that the baby loved him in return, though the child had no proper words to prove it. He only made the same soft nonsense sounds that any baby brother might make today.
        - id: ch01-b57
          speaker: baby_brother
          text: "Goo ga goo!"
        - id: ch01-b58
          speaker: narrator
          text: "Then the baby seized Dickie's hair, pulled hard, and refused to let go."
        - id: ch01-b59
          speaker: narrator
          text: >-
            A magnificent dinner followed. Dickie had the honor of waiting upon this new father of his. He changed his father's plate and poured wine from a silver jug into the silver cup from which his lordship drank. After dinner, Mother wanted to walk through the entire house and see everything, for she had been away from it a long time. Dickie went outdoors instead with Father. They walked through the garden among ripe apples and grapes, with Father's hand resting on Dickie's shoulder. At that moment Dickie felt sure he was the proudest and happiest boy in all Deptford, or, for that matter, in all Kent.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Father asked what Dickie had learned. Dickie told him, lingering rather longer over riding, fencing, bowls, and music than over the studies set by his sour-faced tutor.
        - id: ch01-b61
          speaker: dickie
          text: "I've learned plenty of Greek and Latin too, and poetry, and things like that."
        - id: ch01-b62
          speaker: father
          text: "I fear you don't care much for your books."
        - id: ch01-b63
          speaker: dickie
          text: "I do, sir. I only like my sports better."
        - id: ch01-b64
          speaker: narrator
          text: >-
            He looked up into eyes as blue as his own and found them full of pride and love. By their third turn around the garden, his father spoke again.
        - id: ch01-b65
          speaker: father
          text: >-
            You're a good, modest boy. You haven't once asked me for the thing I promised you.
        - id: ch01-b66
          speaker: narrator
          text: "Dickie could not let that pass. After a moment, he answered."
        - id: ch01-b67
          speaker: dickie
          text: >-
            I might have asked, but I've forgotten what you promised. It was the fever.
        - id: ch01-b68
          speaker: father
          text: >-
            Yes, yes, poor lad. And you honestly owned that you'd forgotten! Come now, give that tired memory a little shake.
        - id: ch01-b69
          speaker: narrator
          text: "A beautiful hope whispered to Dickie, though he could scarcely believe it."
        - id: ch01-b70
          speaker: dickie
          text: "I almost remember. Father, did you promise—?"
        - id: ch01-b71
          speaker: father
          text: >-
            I promised that if you were good and obedient, and kept steadily to your books and your manly exercises, then as soon as you learned to ride him—
        - id: ch01-b72
          speaker: dickie
          text: "A little horse? Oh, Father, you don't mean a little horse?"
          emotion: surprised
        - id: ch01-b73
          speaker: narrator
          text: >-
            How good it was to hear his father's great, joyful laugh and feel that strong arm laid across his shoulders. Together they went to the large stables. From his stall, the promised little horse turned his head to look at them. He was called little, though in truth he was quite a large horse for Dickie. Now, if a horse were yours simply for the choosing, what color would you choose? Dickie knew his answer. He would have chosen a gray before every other color in the world, and the horse waiting for him was gray.
        - id: ch01-b74
          speaker: narrator
          text: >-
            Dickie admired every part of him, had him saddled, and proudly rode him around the pasture while his father watched.
        - id: ch01-b75
          speaker: dickie
          text: "What is his name?"
        - id: ch01-b76
          speaker: father
          text: "We call him Rosinante because he's so fat."
        - id: ch01-b77
          speaker: narrator
          text: >-
            Father laughed, but Dickie did not understand the joke. He had never read Don Quixote.
        - id: ch01-b78
          speaker: dickie
          text: "I'd like to call him Crutch. May I?"
        - id: ch01-b79
          speaker: father
          text: "Crutch?"
          emotion: surprised
        - id: ch01-b80
          speaker: dickie
          text: >-
            His paces are so easy. I mean, even a lame boy could ride him.
        - id: ch01-b81
          speaker: narrator
          text: "Dickie slipped quickly from the saddle and ran to his father."
        - id: ch01-b82
          speaker: dickie
          text: "Oh, Father, I'm so happy! I'm so glad I'm not lame."
          emotion: happy
        - id: ch01-b83
          speaker: narrator
          text: "He buried his nose in the velvet doublet and may have sniffled a little."
        - id: ch01-b84
          speaker: father
          text: >-
            As fanciful as ever! Come, you're still weak from the fever. Be a man and remember the blood you come from. Your mother has a gift for you too, sent by your grandfather. Have you forgotten that? It's a reward for your book learning, and you've earned it.
        - id: ch01-b85
          speaker: dickie
          text: "I've forgotten that as well. You aren't angry with me, are you? I can't help forgetting, Father."
        - id: ch01-b86
          speaker: father
          text: >-
            I'm sure you can't. Come to your mother now, my little son. The Earl of Scilly scolded me only this summer for sparing the rod and spoiling you. But the way you've grown proves my answer right. I told him, “The boys of our house take such pride in their name that they freely learn what many an earl's son must be beaten into learning.” That silenced him. His own son is little better than an idiot, and I truly believe the rod is to blame.
        - id: ch01-b87
          speaker: narrator
          text: >-
            They found Mother and the baby beside a small fire in a broad hearth.
        - id: ch01-b88
          speaker: father
          text: "Our son has come to claim his reward for learning."
        - id: ch01-b89
          speaker: narrator
          text: "Mother rose with the baby in her arms."
        - id: ch01-b90
          speaker: mother
          text: "Call his nurse to take him."
        - id: ch01-b91
          speaker: narrator
          text: "Dickie held out his own arms."
        - id: ch01-b92
          speaker: dickie
          text: "Oh, Mother, please let me hold him."
        - id: ch01-b93
          speaker: narrator
          text: >-
            It was the first time in his life he had ever called anyone “Mother.” A warm, stiff little bundle was placed carefully in his arms, and his brother at once grabbed his hair. It hurt, but Dickie liked it. Mother crossed to one of the carved cabinets. From a shining bunch she chose a bright key and unlocked a heavy paneled door. Out of the darkness she drew a dull leather bag embroidered with crimson silk and gold thread.
        - id: ch01-b94
          speaker: father
          text: >-
            He has forgotten what his grandfather promised him, though he has earned every bit of it. The fever took the memory.
        - id: ch01-b95
          speaker: narrator
          text: "Mother put the bag into Dickie's hands."
        - id: ch01-b96
          speaker: mother
          text: "Count it out."
        - id: ch01-b97
          speaker: narrator
          text: >-
            She took the baby while Dickie loosened the leather cord. Onto the long polished table tumbled twenty gold pieces.
        - id: ch01-b98
          speaker: mother
          text: >-
            Every coin bears the image of our dear late Queen, that incomparable virgin Majesty whose example will guide virtuous ladies for all time.
        - id: ch01-b99
          speaker: father
          text: "Quite so. Put them back in the bag, boy. They're yours to spend however you choose."
        - id: ch01-b100
          speaker: mother
          text: "But not foolishly."
        - id: ch01-b101
          speaker: father
          text: >-
            However he chooses, wisely or foolishly. And no one shall demand to know how he spends them.
        - id: ch01-b102
          speaker: narrator
          text: >-
            Mother frowned. She managed her household carefully, and twenty gold pieces made a very large sum.
        - id: ch01-b103
          speaker: dickie
          text: "I won't waste them. Mother, you can trust me."
        - id: ch01-b104
          speaker: narrator
          text: >-
            This was the happiest moment Dickie had ever known. There was the little horse, and there were the gold pieces. Yet something mattered far more than either gift. It was the sudden, good, safe certainty of having a father, a mother, and a baby brother. Here was a place where he belonged, where he could love and be loved in return. These people were his own people and his equals, as nearly as a child can be the equal of grown-ups. Beale was not his equal, either in the graces of the body or in the inner treasures of mind and heart. Until now, though, Beale was the only person Dickie could remember loving. Only Beale and that dim, shadowy father he called Daddy had ever loved him. Daddy had died in a hospital. As he lay dying, he had left Dickie the rattle called Tinkler, the thing that was Harding's Luck.
        - id: ch01-b105
          speaker: narrator
          text: >-
            Right in the heart of that perfect happiness, the thought of Beale stabbed like the sharp prick of a dagger. What wonders could be done for Beale with twenty-five gold sovereigns? Dickie thought of the coins in exactly those terms, as modern sovereigns, and that was truly what they were. His new family loved him and belonged to him. As father, mother, and little brother drew nearer and nearer to his heart, their love made that heart quicker and more generous. And so it reached more strongly than ever toward Mr. Beale. Beale was a tramp, and Beale was a housebreaker. But he was also the man who had shown kindness to Dickie when no one else was there to be kind.
        - id: ch01-b106
          speaker: narrator
          text: >-
            That night, Nurse brought Dickie to his beautiful tapestry-hung room. Though he was tired and soft with new happiness, he forced himself awake to ask her something.
        - id: ch01-b107
          speaker: dickie
          text: "Nurse, you know a great many things, don't you?"
        - id: ch01-b108
          speaker: nurse
          text: "I know what I know."
        - id: ch01-b109
          speaker: narrator
          text: "Her quick, commanding fingers undid his buttons."
        - id: ch01-b110
          speaker: dickie
          text: >-
            You know my other dream, the dream about that dreadful place. Could I carry anything from this dream—I mean, from this time—into the other one?
        - id: ch01-b111
          speaker: nurse
          text: >-
            You could, but you'd have to bring it back when you returned. And some things can come from there to here. Your rattle can. So can your moon-seeds and your seal.
        - id: ch01-b112
          speaker: narrator
          text: "Dickie stared at her."
        - id: ch01-b113
          speaker: dickie
          text: "You really do know things. But I want to take something there and leave it there."
        - id: ch01-b114
          speaker: narrator
          text: "Nurse drew her brows together and thought."
        - id: ch01-b115
          speaker: nurse
          text: >-
            Three hundred heavy years lie between this time and that one. Yes, I know. If you held the thing in your hand, you'd probably lose it during one of those years as you passed through. Money is terribly heavy, and it travels more slowly than your soul, my lamb. Someone would have time to see it, snatch it, and keep hold of it.
        - id: ch01-b116
          speaker: dickie
          text: "Isn't there any way at all?"
        - id: ch01-b117
          speaker: nurse
          text: >-
            There's the earth. That's the way for everything. Bury it, then lie down over the place. When you return to the other dream, the kind, thick earth will have kept your secret. You can dig it up again—unless some other hands find it during those three hundred years. You'll have to take that chance.
        - id: ch01-b118
          speaker: dickie
          text: >-
            Will you help me? I'll have to dig very deep to outwit three hundred years. But suppose someone builds a house on that spot. I'd get mixed up with the house. My tutor says two things can't be in the same place at the same time. A house would be much stronger than I am, so it would win. Where would that leave me?
        - id: ch01-b119
          speaker: nurse
          text: >-
            I'll ask where it would leave you. I'll ask someone who knows, though it will take time. Put your money in the great press, and I'll keep the key. Your little cousins arrive next Friday.
        - id: ch01-b120
          speaker: narrator
          text: >-
            The cousins arrived when Friday came. With them, it was more difficult than it had been with the grown-ups to hide the strange truth that Dickie had not always been the Dickie he was now. Even so, it was not nearly as difficult as you might suppose. He did not have to invent a new story every minute. He simply kept from speaking about his other life, much as anyone can keep from talking about the dreams they had the night before.
        - id: ch01-b121
          speaker: narrator
          text: >-
            His life was full now in every way. There was hard work for his mind and exercise for his body. There was useful work to do, the warmth of family life, and hour after hour of joyful play. His two cousins understood how to play in a way the poor, dirty children of the other Deptford did not and could not understand. Dickie lived and learned among them. With every passing day, he felt more strongly that this was the life to which he truly belonged. Days went by, then weeks, then whole months, and nothing happened to disturb them. When someone is already happy, nothing happening may be the happiest thing that can happen at all.
        - id: ch01-b122
          speaker: narrator
          text: "Then, one night, Nurse finally gave him her answer."
        - id: ch01-b123
          speaker: nurse
          text: >-
            I asked. Bury your treasure beneath the window of the solar parlor, then lie down and sleep over it. You won't be harmed. Once you're asleep, I'll say the proper words. You'll wake beneath the same sky instead of underneath a house, just as you feared.
        - id: ch01-b124
          speaker: narrator
          text: >-
            After the whole household slept that night, Nurse lifted Dickie from his bed. She put his shoes on his feet and wrapped him warmly in a cloth mantle of her own. Then she led him outside to the place beneath the parlor window. Without anyone knowing, she had already dug a deep hole there. They had prepared the treasure with equal care. Dickie's embroidered leather bag of gold lay inside a small coffer of worked iron, a gift from Sebastian. Nurse had fastened the join between the coffer and its lid with wax and resin until it was tight. They wrapped that box in a silk scarf. The whole packet went inside a large earthenware jar with a lid. Resin was smeared all around that join as well, and clay covered the resin. Nurse had shown Dickie how every layer must be done.
        - id: ch01-b125
          speaker: nurse
          text: "That should keep out the earth spirits and the three hundred years."
        - id: ch01-b126
          speaker: narrator
          text: >-
            She lowered the jar into the hole. Together, she and Dickie filled the earth back in and stamped it firm beneath their feet.
        - id: ch01-b127
          speaker: nurse
          text: "And when you wish to return, you know the way."
        - id: ch01-b128
          speaker: dickie
          text: "Do I?"
        - id: ch01-b129
          speaker: nurse
          text: "Set out the rattle, the seal, and the moon-seeds as you did before. Then listen for the voices."
        - id: ch01-b130
          speaker: narrator
          text: >-
            Dickie lay down on the ground wrapped warmly in the cloth cloak. Nurse sat beside him and held his hand until sleep came. By now it was June. The scent of roses was very sweet, and the nightingales kept him awake for some time. Above him stretched the sky, an old friend he knew in both his lives. From where he lay, he could see dew shining among the separate blades of grass across the lawn. With the darkness overhead and the green earth rising around him, it was pleasant to lie once more in the bed with green curtains.
        - id: ch01-b131
          speaker: narrator
          text: >-
            When he opened his eyes, his old friend the starry sky was still above him. For one moment he wondered where he was and why he lay outdoors. Then memory returned. He pushed himself up on one elbow and looked around. Small houses hemmed him in on every side, with lights burning in a few of their windows. A broken wooden fence stood very close. The soft lawn had vanished. There was no grass anywhere near him, only rough earth beaten hard by many feet. Instead of roses, the air smelled of dustbins. No nightingale sang here. Far away sounded the restless, never-ending roar that was the voice of London. Much nearer, he heard the foolish song and uncertain footsteps of a man going home from the Cat and Whistle.
        - id: ch01-b132
          speaker: narrator
          text: >-
            Dickie found a broken piece of plate and used its edge to scratch a cross into the hard ground. That mark showed exactly where the treasure waited below. Then he got onto his hands and knees, for this was his lame body once again, and crept across to the house. He climbed in through the opening, made his way from room to room, and found Beale asleep inside. The crossing between the two lives had taken none of Beale's time. Dickie settled near him and waited for the cold daylight of morning.
        - id: ch01-b133
          speaker: dickie
          text: >-
            Father, you have to rent this house. That's what you're supposed to do. You remember, don't you?
        - id: ch01-b134
          speaker: narrator
          text: >-
            Cold daylight filled the front room at number fifteen, Lavender Terrace, Rosemary Lane. Beale stretched, grunted, and rubbed his sleepy eyes with unwashed fists.
        - id: ch01-b135
          speaker: mr_beale
          text: >-
            Can't say I remember. But if the nipper says it's so, then it's so. Let's get a mug of tea and a doorstep of bread, and after that we'll see.
        - id: ch01-b136
          speaker: dickie
          text: >-
            You get breakfast if you're hungry. I'd rather stay here in case someone else rents the house. Go see the landlord now. If you're up this early, he'll think you're a man with regular work.
        - id: ch01-b137
          speaker: mr_beale
          text: >-
            Maybe I'd better wash and brush myself first, eh? Could pay off in the end. I have to go to the lodging house for our pram and our things anyway.
        - id: ch01-b138
          speaker: narrator
          text: >-
            Beale thoughtfully ran one hand over the rustling stubble of his two-day beard. A wash and brush did seem worth the trouble. His effort worked exactly as Dickie had hoped. When Beale called on the landlord early, the man took him for a perfectly respectable working fellow. Asked why they had no furniture to bring into the house, Beale explained that he and his boy had only just come up from Gravesend. They had walked to save money and picked up little jobs along the road. Every word of that part was true. Then Beale offered to prove his respectability with something that was not true at all.
        - id: ch01-b139
          speaker: mr_beale
          text: >-
            I could give you the gentleman I worked for as a reference. Talbott is his name—a bald fellow with a squint and red ears. But perhaps this will do just as well.
        - id: ch01-b140
          speaker: narrator
          text: >-
            From one pocket he drew all their money, two pounds and eighteen shillings. He had kept six pennies in the other pocket so he could make them rattle, and now he rattled them.
        - id: ch01-b141
          speaker: mr_beale
          text: >-
            Between you and me, I'm eager to get settled for the boy's sake. I won't deceive you. We walked all the way so we wouldn't waste our little bit of money, and he's lame.
        - id: ch01-b142
          speaker: landlord
          text: >-
            That's strange. A lame boy lived in that house with the last family. Seems it ought to be a cripple's home by right.
        - id: ch01-b143
          speaker: narrator
          text: >-
            Beale had not expected this problem and had no story ready. So he tried the truth.
        - id: ch01-b144
          speaker: mr_beale
          text: >-
            It's the same boy, mister. That's why I've set my heart on this house. It's home to him, you see.
        - id: ch01-b145
          speaker: landlord
          text: "Are you his father?"
        - id: ch01-b146
          speaker: narrator
          text: "Again, truth inspired Beale, and this time quite a lot of it."
        - id: ch01-b147
          speaker: mr_beale
          text: >-
            No. I wish I were. Truth is, the little chap's aunt wasn't much good. I found him wandering about, and since I had no children of my own, I more or less adopted him.
        - id: ch01-b148
          speaker: landlord
          text: "Like one of those wandering heirs at the theater. I see."
        - id: ch01-b149
          speaker: narrator
          text: >-
            Dickie's aunt had told the landlord that the ungrateful little creature had run away. Beale grew warmer as he spoke of Dickie and forgot to be cautious.
        - id: ch01-b150
          speaker: mr_beale
          text: >-
            He's a fine little chap, sharp as a ferret-dog. The things he says would make a cat laugh sometimes. I'll pay a week in advance if you like, mister, and we'll bring in our few bits of furniture today.
        - id: ch01-b151
          speaker: landlord
          text: "Well, let's go down and look at the house. Where is the boy?"
        - id: ch01-b152
          speaker: narrator
          text: "The landlord took a key from a nail on the wall."
        - id: ch01-b153
          speaker: mr_beale
          text: "He's there waiting for me. Couldn't pull him away."
        - id: ch01-b154
          speaker: narrator
          text: >-
            The landlord found Dickie waiting at the empty house, just as Beale had said. Dickie treated him with great politeness, although in less happy days he had sometimes made faces at this very man. The landlord saw a quiet boy who would not be drawn away from the place he remembered as home. By the time the visit ended, six of Dickie and Beale's shillings had gone into the landlord's pocket. In exchange, the key remained in their hands. For the first time, they could unlock the door themselves and walk together through every room of a home that belonged to them.
        - id: ch01-b155
          speaker: mr_beale
          text: >-
            Now we've got a home of our own. An Englishman's home is his castle. Between the boxes you'll carve and the dogs I'll find, Buckingham Palace will look small beside us. Eh, matey?
        - id: ch01-b156
          speaker: narrator
          text: >-
            Beale rubbed his hands. They locked the door and went out for breakfast. Beale was as merry as a lark, but Dickie sat rather silently. A new difficulty had occurred to him. It was all very well to bury twenty sovereigns and know exactly where they lay. Getting them out was another matter. The coins were his beyond any doubt, but if anyone saw him digging them up, that person would certainly have the money taken away. No one in this Deptford would believe that twenty buried gold pieces honestly belonged to a lame boy. The earthenware jar was large as well. So many windows looked down into the little garden that no one could hope to lift such a thing from the earth unnoticed. Besides, Dickie doubted whether he was strong enough to dig it up by himself even if the neighbors looked away. He had forgotten that problem when he buried the treasure in his other life, because his body had been so much stronger there. The thought made him sigh.
        - id: ch01-b157
          speaker: mr_beale
          text: "Feeling down, mate?"
        - id: ch01-b158
          speaker: narrator
          text: "Beale's mouth was full."
        - id: ch01-b159
          speaker: dickie
          text: "No. I was only thinking."
        - id: ch01-b160
          speaker: mr_beale
          text: >-
            We'd better buy our furniture first thing. It's a cruel world. No furniture, no trust—that's every landlord's motto.
        - id: ch01-b161
          speaker: narrator
          text: >-
            Would you like to know exactly what furniture they bought? First came a rusty old bedstead, a very large one. Its loose laths hung down in the middle like a hammock. Every knob had disappeared, leaving bare screws that stuck up in sharp little points. To put on this bed, they bought a flock mattress and pillows the dull color of dust. The blankets and sheets matched that color almost perfectly. Next came a table and two chairs. They also found a kitchen fender with a round steel moon set into it, though both the fender and its moon were very rusty.
        - id: ch01-b162
          speaker: narrator
          text: >-
            They added a hand bowl to use at the sink and a small zinc bath, which Beale said would do for washing Dickie's shirt. Then came four plates and two cups with their saucers. They bought two of everything needed for a meal: two knives, two forks, and two spoons. There was a tin teapot, a quart jug, and a pail. They chose a small piece of Kidderminster carpet, half a pound of yellow soap, a scrubbing brush, and a broom. Last came two towels, a kettle, a saucepan, a baking dish, and a pint of paraffin for the lamp.
        - id: ch01-b163
          speaker: narrator
          text: >-
            One thing alone was new. It was a tin lamp to hang on the wall, backed by a dazzling reflector of crinkled metal. It cost tenpence halfpenny. Everything else together cost twenty-six shillings and sevenpence halfpenny, which was very cheap indeed. Yet when the purchases were dumped in the front room, they looked both poor and few. The bed looked worst of all. It was hardly a bed yet, only a heap of loose iron.
        - id: ch01-b164
          speaker: mr_beale
          text: >-
            And our drawing-room suite hasn't arrived either. Easy chairs for a lady and gentleman, four occasional tables, a piano, and a fumed-oak bureau.
        - id: ch01-b165
          speaker: dickie
          text: >-
            Curtains. We need white ones in the parlor and short blinds everywhere else. I'll buy them while you clean the windows. Use my old shirt. It won't survive another washing anyway.
        - id: ch01-b166
          speaker: mr_beale
          text: "You don't give orders at all, do you?"
        - id: ch01-b167
          speaker: narrator
          text: >-
            Beale sounded perfectly content. Dickie returned with curtains and a penny's worth of tacks. A neighbor lent them a hammer. One cheerful hour of work was enough to defend the Englishman's castle from every curious passerby. The landlord frowned anxiously when he walked past.
        - id: ch01-b168
          speaker: landlord
          text: >-
            I don't like all that white curtain. Bet there isn't much behind it. People don't put up that much Nottingham lace unless they've something to hide—most likely a whole house full of emptiness.
        - id: ch01-b169
          speaker: narrator
          text: >-
            Inside, Dickie was astonishing Mr. Beale with the news that money lay buried in the garden.
        - id: ch01-b170
          speaker: dickie
          text: >-
            It was given to me because I learned something. We have to dig it up without anyone seeing. The only plan I can think of is building a chicken house and digging inside it. I wish I were cleverer. Hereward would have known what to do straightaway.
        - id: ch01-b171
          speaker: mr_beale
          text: >-
            Don't worry. You're clever enough for this poor world. Come outside and show me the place. Just put your foot on it and stare carelessly up at the sky.
        - id: ch01-b172
          speaker: narrator
          text: >-
            They went into the garden. Dickie placed one foot over the cross he had scratched with the broken plate. It lay close beside the dead stalk of the moonflower.
        - id: ch01-b173
          speaker: mr_beale
          text: >-
            This garden's in a sorry state. Needs turning over before winter, that's what I think. I'll fetch a spade and start today. This old artichoke looks to have plenty of roots.
        - id: ch01-b174
          speaker: narrator
          text: >-
            Beale spoke loudly enough for the neighbors to hear. He began digging beside the fence and worked toward the moonflower. Its roots really did go deep. He had made quite a hole before the tall dead stalk leaned over and fell with the slow dignity of a forest tree beneath an axe.
        - id: ch01-b175
          speaker: narrator
          text: >-
            Then the man and boy went indoors and carried out the kitchen table and chairs. They spread their blankets over the furniture, as though the cloth needed airing in the autumn sunlight. Dickie crawled under the covered table and played at houses. It was not at all the sort of game he usually chose, but the watching neighbors could not know that. And the table just happened to have been placed directly above the deep hole that had held the moonflower's roots. Safe inside his little blanket house, hidden from every overlooking window, Dickie began to dig with a small trowel.
        - id: ch01-b176
          speaker: narrator
          text: >-
            They waited until darkness had fallen before carrying the blankets, table, and chairs indoors. Then they took the treasure upstairs where no passerby could see. One blanket was nailed over the top-floor window to shut out every curious eye. The dingy mattress on the iron bed became their worktable. Beale set the great earthenware jar upon it, and they melted away the resin that sealed the lid. Inside lay the silk-wrapped iron coffer. They opened that in the same careful way, melting the resin from the crack around its lid. At last the embroidered leather bag appeared. Beale had always had rather prominent eyes, but now they bulged until they looked almost like the eyes of a lobster or a snail.
        - id: ch01-b177
          speaker: narrator
          text: >-
            Dickie loosened the string and opened the leather bag. Twenty bright gold coins poured out in a shower and settled in a hollow in the dull mattress ticking. Beale stared at them, shut his eyes, and gave a long sigh. After a moment, he opened his eyes and looked again. The coins were still there.
        - id: ch01-b178
          speaker: mr_beale
          text: "Given to you? Someone gave you all that? I don't believe it."
          emotion: surprised
        - id: ch01-b179
          speaker: dickie
          text: "You have to believe me. Have I ever told you a lie?"
        - id: ch01-b180
          speaker: mr_beale
          text: "Come to think of it, I don't believe you ever have."
        - id: ch01-b181
          speaker: dickie
          text: "Well, then. They were given to me. Understand?"
        - id: ch01-b182
          speaker: mr_beale
          text: >-
            We'll never be able to change them into money we can use. We'd be arrested for certain. Everyone would say we'd stolen them.
        - id: ch01-b183
          speaker: dickie
          text: >-
            No, they won't. I have a friend who can change them for me. Then we'll buy new clothes and more furniture. We'll get a carpet, and a proper china washbasin instead of that old tin thing. We'll have a bath too. You can buy more puppies, and I'll get proper carving tools. Our fortune is made. See?
        - id: ch01-b184
          speaker: mr_beale
          text: >-
            You little nipper. The best day's work I ever did was the day I took up with you. You're straight, you are—one of the best. Many a boy would have run off with the gold. But you stayed with old Beale, and old Beale will stay with you.
        - id: ch01-b185
          speaker: dickie
          text: "That's all right."
        - id: ch01-b186
          speaker: narrator
          text: "He began returning the shining coins to their bag, but Beale stubbornly went on."
        - id: ch01-b187
          speaker: mr_beale
          text: >-
            No, it isn't all right. It's no use. I have to tell you everything or burst. I didn't take you with me because I liked you, the way I claimed. I only wanted a little boy I could push through windows, to help me and that redheaded fellow you never met.
        - id: ch01-b188
          speaker: dickie
          text: "I've known that for a long time."
        - id: ch01-b189
          speaker: narrator
          text: "Dickie watched the candle flicker on the bare mantelpiece."
        - id: ch01-b190
          speaker: mr_beale
          text: >-
            I meant you no good at first. That time you wrote on the sole of my boot, I'd bought the paper and pencil on purpose. There, now you know.
        - id: ch01-b191
          speaker: dickie
          text: "You haven't done me any harm, anyway."
        - id: ch01-b192
          speaker: mr_beale
          text: >-
            No, I know I haven't. And why not? Because I took to you that very first day. I've always treated you kindly. You can't say I haven't.
        - id: ch01-b193
          speaker: narrator
          text: >-
            Two wishes pulled Beale in opposite directions and made his confession difficult. He wanted to tell the very worst about himself without hiding a thing. At the same time, he wanted to do himself full justice and make sure Dickie remembered the kindness that came later. That is why telling the whole truth about oneself can be so hard. When people confess, they are tempted either to blacken the blackness until it looks worse than it was, or to whiten the whiteness until it looks better. Beale struggled not to do either, but the words still left him confused and helpless.
        - id: ch01-b194
          speaker: mr_beale
          text: "But I was a beast all the same."
          emotion: sad
        - id: ch01-b195
          speaker: narrator
          text: "He sounded helpless."
        - id: ch01-b196
          speaker: dickie
          text: "Oh, stop it. You've told me now, so we're square."
        - id: ch01-b197
          speaker: mr_beale
          text: "You won't hold it against me?"
        - id: ch01-b198
          speaker: dickie
          text: >-
            Why should I? Now everything is open as the day, and we may pursue our career as honorable men and comrades in every noble adventure.
        - id: ch01-b199
          speaker: narrator
          text: >-
            Dickie was tired enough to be cross. When he saw Beale's mouth fall open and those eyes bulge more lobster-like than ever, he translated himself.
        - id: ch01-b200
          speaker: dickie
          text: >-
            I mean, it's all right, Father. It doesn't change anything for me. I know you're honest now, even if you didn't start that way. Let's go to bed, shall we?
        - id: ch01-b201
          speaker: narrator
          text: >-
            Mr. Beale dreamed that he was trying to drown Dickie in a pond full of stewed eels.
        - id: ch01-b202
          speaker: narrator
          text: "Dickie did not dream at all."
