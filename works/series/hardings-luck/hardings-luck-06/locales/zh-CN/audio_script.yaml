audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机敏，带着克制的幽默与讲故事的悬念
        timbre: 温暖清亮
        pace: 舒展而有变化
        pitch: 中音
    dickie:
      display_name: 迪基
      tts:
        delivery: 聪明敏感，街头口吻直率，学书中人物说话时郑重夸张
        timbre: 清脆稚嫩
        pace: 稍快，受委屈时断续
        pitch: 中高音
    nurse:
      display_name: 老奶妈
      tts:
        delivery: 慈爱爽朗，照料孩子时坚定又耐心
        timbre: 丰满温暖
        pace: 从容
        pitch: 中低音
    loafer:
      display_name: 闲汉
      tts:
        delivery: 起初粗鲁多疑，后来爽直友善
        timbre: 沙哑松散
        pace: 适中
        pitch: 中低音
    mr_rosenberg:
      display_name: 罗森伯格先生
      tts:
        delivery: 精明务实，咬字略含混，生气时仍有分寸
        timbre: 浑厚偏暗
        pace: 偏慢
        pitch: 低音
    kennel_keeper:
      display_name: 养狗人
      tts:
        delivery: 恭敬爽快，谈起猎犬时熟练自信
        timbre: 粗厚结实
        pace: 适中
        pitch: 中低音
    sebastian:
      display_name: 塞巴斯蒂安
      tts:
        delivery: 温和豪爽，教手艺时耐心而笃定
        timbre: 醇厚开阔
        pace: 从容
        pitch: 低音
    tutor:
      display_name: 家庭教师
      tts:
        delivery: 古板严厉，咬字讲究而不容违抗
        timbre: 干瘦清晰
        pace: 偏慢
        pitch: 中音
    father:
      display_name: 理查德爵士
      tts:
        delivery: 爽朗威严，对儿子亲热而充满自豪
        timbre: 洪亮饱满
        pace: 适中
        pitch: 中低音
    mother:
      display_name: 母亲
      tts:
        delivery: 温柔端庄，持家时细致谨慎
        timbre: 柔和明亮
        pace: 从容
        pitch: 中音
    landlord:
      display_name: 房东
      tts:
        delivery: 精明警觉，盘问时严厉直接
        timbre: 干涩厚实
        pace: 适中
        pitch: 中低音
    pawnbroker:
      display_name: 当铺老板
      tts:
        delivery: 老练公道，谈生意时谨慎又亲切
        timbre: 浑厚温和
        pace: 偏慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 埋藏的宝藏
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            站在阳光里的那一刻，迪基忽然全明白了。他终于又回到盼望已久的梦中。他从德特福德宅邸的窗前望出去，看见花园里的紫杉修得整整齐齐，小径两旁种着黄杨，还有玩滚木球的草坪。他心里再没有半点怀疑。可这不是一个虚假的梦，它跟另一个德特福德一样真实。他在那里播下过艺术牌鸟食，收获过月光花，也得到过魔法结出的银色种子。眼前的一切，同样确确实实是魔法。迪基毕竟在詹姆斯一世的时代生活过，当然听人谈过魔法。要是发生在他身上的事还不能算魔法，那么这世上从前没有，以后也绝不会有魔法了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            他离开窗前，回头看看挂满壁毯的房间、那张宽大的床，还有老奶妈那张和善的皱纹脸。这一切是真的，跟他在另一种生活里经历的事情一样真实。另一种生活也不是假的。在那里，他是个拄着拐杖的瘸腿小男孩，认了一个脏兮兮的流浪汉做爸爸，睡在一张挂着绿帷幕的床上。两边都是他的生活，只是隔着三百年的魔法。
        - id: ch01-b03
          speaker: nurse
          text: 梦里的那位朋友，他还好吗？
        - id: ch01-b04
          speaker: dickie
          text: >-
            好着呢，真的好着呢。我还在那边刻了盒子，卖到了钱。我得再多学些本事，等下次回去，我是说，等下次再做那个梦，就能挣更多钱了。
        - id: ch01-b05
          speaker: nurse
          text: 你有这样的姓氏，还得靠干活挣钱，真叫人难为情。
        - id: ch01-b06
          speaker: dickie
          text: >-
            我在那边又不姓哈丁。老塞巴斯蒂安说过，人人都该替自己的国家出一份力，不然就不配吃肉喝酒。再说，钱是自己亲手挣来的，那滋味有多痛快，你根本不知道。
        - id: ch01-b07
          speaker: nurse
          text: >-
            我怎么会不知道？我自己挣钱的年头可久了。快穿衣裳，吃过早饭还得上击剑课呢。
        - id: ch01-b08
          speaker: narrator
          text: >-
            击剑课后，迪基有些拿不定主意。他当然想马上去找塞巴斯蒂安，继续学造大帆船。可他又想学一门手艺，将来好教给德特福德的比尔。迪基心里明白得就像任何手艺大师一样，凡是需要一双巧手的活儿，不管木雕还是造玩具船，比尔都肯定学不来。不过比尔确实喜欢狗。迪基想起在薰衣草台时，他们睡在报纸和破麻袋下面，小真真总爱贴着比尔，钻进他的外套，紧紧偎着他。
        - id: ch01-b09
          speaker: narrator
          text: >-
            于是迪基去了狗舍，想跟养狗人好好谈一谈。他从前跟击剑老师罗杰·弗赖先生来过这里，却从没有单独跟养狗人说过话。到了那间小屋门前，他抬手敲门，还学着古戏里的人高声叫道，屋里有人吗。门猛地打开了。走出来的人从头到脚穿着皮衣，脸却跟薰衣草台的隔壁邻居一模一样，就是那个替他们翻土、播下鹦鹉饲料的人。
        - id: ch01-b10
          speaker: dickie
          text: 咦，是你！
          emotion: surprised
        - id: ch01-b11
          speaker: kennel_keeper
          text: 不是我，还能是谁呢，小少爷？
        - id: ch01-b12
          speaker: narrator
          text: 养狗人恭恭敬敬地行了礼。迪基这才懂了，他只有邻居的脸，并没有邻居的记忆。
        - id: ch01-b13
          speaker: dickie
          text: 你住在这儿吗？我是说，你一直都住在这儿？
        - id: ch01-b14
          speaker: kennel_keeper
          text: >-
            我不住这儿，还能住哪儿？打小起我就服侍老爷，也就是您的父亲。他养的每一条狗，我连它身上每根毛都认得。
        - id: ch01-b15
          speaker: narrator
          text: >-
            迪基觉得，这话听来像是知道得真不少，而事实也确实如此。他在狗舍整整待了一个钟头。离开时，他懂得的养狗知识已经比来时多了许多。有些说法要是让现代兽医听见，准会大吃一惊。不过狗舍里的狗看起来又健康又快活。它们生病时喝的是药草茶，不是药房里的药。人们还会对着它们念咒，保佑它们跑得又快又壮。那些咒语就算没帮上忙，显然也没有让它们少一分强壮，慢一分脚程。
        - id: ch01-b16
          speaker: narrator
          text: >-
            等迪基觉得这一天学到的养狗知识已经够他慢慢消受，他才放下心来，去了船坞继续学造船。塞巴斯蒂安正在挥动斧头，把一根准备用来做桅杆的大树干一点点削平。听见迪基的声音，他抬起头，停下手里的斧头，也朝孩子笑了起来。
        - id: ch01-b17
          speaker: dickie
          text: 哎呀，我可有好久没见到你了！
          emotion: happy
        - id: ch01-b18
          speaker: sebastian
          text: >-
            可不是吗，足足两天呢。何况这两天，你还在国王的水上盛会里玩得痛快。两天啊，真是好久，好久好久。
        - id: ch01-b19
          speaker: dickie
          text: 你会的本事，我全都要学。
        - id: ch01-b20
          speaker: narrator
          text: 他说着拿起一把锥子，摸了摸尖头。
        - id: ch01-b21
          speaker: sebastian
          text: >-
            那你得对我有点耐心。凡是你能学会的，我都会教，可不能一下全塞给你。一样一样慢慢来，才学得牢。
        - id: ch01-b22
          speaker: dickie
          text: >-
            你别以为我只是来玩，也别因为我是父亲的儿子，就觉得我不用认真学。
        - id: ch01-b23
          speaker: sebastian
          text: >-
            我哪会那么想？我跟德雷克船长和雷利船长出过海，亲眼见过冒险的绅士什么活儿都得搭得上手。只要你肯学，我就肯教。来吧，干活！
        - id: ch01-b24
          speaker: narrator
          text: >-
            塞巴斯蒂安从工棚里搬出那艘小帆船的肋骨架，那是他们先前一起动手拼起来的。两个人继续做了下去。那一天过得真快活。所有的快乐里，有一种像太阳照着小星星，把其余的全照暗了。那就是迪基又成了一个不用拄拐杖的小男孩。他可以用两条好腿站着，可以跑，也可以全心全意学手艺。
        - id: ch01-b25
          speaker: narrator
          text: >-
            从此，那种宽广而美好的生活重新铺在迪基面前。他学会了许多事，觉得每个白天都美好快活，每个夜晚都洁白安宁。他住在德特福德高坡上的大宅和美丽花园里，夜里不再做梦，白天则欢欢喜喜、堂堂正正地过着名门之子的生活。他原本总为独自留在德特福德小屋里的比尔觉得良心不安，后来却不再担心了。因为有一天，他特意问了老奶妈。
        - id: ch01-b26
          speaker: dickie
          text: >-
            我在那个难看的地方刻盒子、挣钱，做了这么一场梦。这里过去了多久？
        - id: ch01-b27
          speaker: nurse
          text: >-
            你梦见那边，不会占掉这里半点时间。你梦见这里，也不会占掉那边半点时间。
        - id: ch01-b28
          speaker: dickie
          text: 可我明明做了一整夜的梦。
        - id: ch01-b29
          speaker: nurse
          text: >-
            才没有呢。梦做完了，你才真正睡着，结结实实睡了整整一夜。
        - id: ch01-b30
          speaker: narrator
          text: >-
            于是迪基相信，比尔那边根本没有时间过去。等他回去，他本来就打算回去，就会正好落在离开德特福德的那一瞬间。比尔不会多等一夜，甚至不会多等一刻。这就是这种白魔法最奇妙的地方。所以后来迪基真的回到比尔先生身边时，只是因为自己的心在叫他回去，再没有别的缘故。
        - id: ch01-b31
          speaker: narrator
          text: >-
            日子一天天、一星期星期、一月月地过去，秋天来了。树上的苹果熟了，花园墙边和棚架上的葡萄也熟了。忽然有一天，仆人们像一齐发了疯。拖把、扫帚、抹布和水桶满屋飞。已经干干净净的东西，又被洗了一遍。已经擦得锃亮的东西，又被重新擦亮。迪基一连从三个房间里被赶出来，还绊翻了一只水桶。恼火的厨娘索性把一块洗碗布别到了他的紧身上衣上。最后，他只好去布草间寻找老奶妈，发现她也忙得不可开交。
        - id: ch01-b32
          speaker: narrator
          text: 他总算在布草间找到了忙得团团转的老奶妈。
        - id: ch01-b33
          speaker: dickie
          text: 总不会是在春季大扫除吧？现在也不是春天呀。
        - id: ch01-b34
          speaker: nurse
          text: >-
            往后可别说我没告诉你。明天，你父亲、母亲和小弟弟就回来了。再过整整七天，你的小表亲们也要来做客。
        - id: ch01-b35
          speaker: dickie
          text: 那太好了！可你明明就没告诉过我。
          emotion: happy
        - id: ch01-b36
          speaker: nurse
          text: 我要是没说，那也是因为你从来没问。
        - id: ch01-b37
          speaker: dickie
          text: >-
            我不敢问。我太害怕了。你看，我从来没见过他们。
          emotion: fearful
        - id: ch01-b38
          speaker: nurse
          text: 害怕？你竟然说，自己从没见过亲生父母！
          emotion: surprised
        - id: ch01-b39
          speaker: dickie
          text: >-
            也许是那场热病害的。你说过，病会让我忘掉事情。我一点儿也不记得他们了。
        - id: ch01-b40
          speaker: nurse
          text: 可千万别把这话告诉他们。
        - id: ch01-b41
          speaker: dickie
          text: >-
            他们不问，我就不说。老奶妈，也给我找点事做吧。我能帮什么忙？
        - id: ch01-b42
          speaker: nurse
          text: >-
            去花园采些剩下的花，给你母亲的房间扎一束，插进清水里摆好。你还可以请家庭教师教你一首迎宾诗，等他们进门时念。
        - id: ch01-b43
          speaker: narrator
          text: >-
            采花、插花又容易又快活。可向苦瓜脸的家庭教师求一首贴心的诗，迪基一点也不觉得容易，更不觉得快活。不过他还是去了。教师听完倒是兴致十足，偏偏给他挑了一首特别艰深、特别乏味的诗，仿佛迎接久别归来的父母，就该说些谁也听不明白的话。
        - id: ch01-b44
          speaker: tutor
          text: >-
            幸福的人啊，退隐甜美的家，避开众人艳羡的荣华，自由自在，只为自己活着。骄傲地攀登云霄的人，未到死时，便蒙羞坠下。
        - id: ch01-b45
          speaker: narrator
          text: >-
            迪基心想，在这个美丽世界里即将成为他父母的两个人，也许更爱听小儿子说些简单亲热的话。整首诗只有最后一节多少还有点具体的意思，可那一节又硬要他盼着别人将来说，他寿终时是个善良的老人。迪基从没这样盼过，甚至根本没想过这件事。那首诗净是名声、树木和重担。他认定，诗里要是多写些父亲母亲，准会好得多。越想越觉得有道理，他便试着自己作了几句。
        - id: ch01-b46
          speaker: dickie
          text: >-
            人们说世上没有别人，能把母亲的位置替换。我说，父亲若来到眼前，我愿意见他胜过所有人。
        - id: ch01-b47
          speaker: narrator
          text: >-
            写完这四行，他再也想不出下一句了。况且，他心里总隐隐觉得，头两行也是写得最好的两行，恐怕并不是自己想出来的。于是他放弃了作诗，认定这绝不是自己的长处。到头来，他还是只能苦着一张脸，把家庭教师指定的那几节沉闷诗句一字一句背熟。
        - id: ch01-b48
          speaker: narrator
          text: >-
            然而，迪基到底没能把那首诗念完。主人归来的忙乱刚刚平息，他的心便跳得厉害。家庭教师领他去见一位自己从未见过的、最神气的绅士，还有一位最可爱的夫人。教师从背后轻轻推了他一下，他不得不向前走出两步，独自站在为了迎接他们而铺开的最好地毯上。
        - id: ch01-b49
          speaker: tutor
          text: 背你的迎宾诗。
        - id: ch01-b50
          speaker: dickie
          text: 幸福的人啊……退隐甜美的家……
          emotion: fearful
        - id: ch01-b51
          speaker: narrator
          text: 迪基阴沉着脸，浑身发抖。可他还没念到“骄傲地攀登”，那位夫人便一把搂住了他。
        - id: ch01-b52
          speaker: mother
          text: 上天保佑我的宝贝儿子！他都长得这么大了！
          emotion: happy
        - id: ch01-b53
          speaker: father
          text: >-
            拿出绅士之子的样子来，别缩得像个胆小的老学究！
        - id: ch01-b54
          speaker: narrator
          text: >-
            父亲重重拍了拍他的背。父亲母亲都笑了，迪基落下几滴眼泪。家庭教师仿佛被谁从眼前一下抹掉了，只剩他们三个快活地待在一起，像是一辈子都彼此熟悉。随后，一个胖乎乎的年轻奶妈把婴儿抱了进来。迪基立刻爱上了小弟弟，也深信弟弟同样爱他。其实，小家伙只会像所有小婴儿那样咕呀咕地叫，还一把揪住迪基的头发，紧紧扯着不肯松手。
        - id: ch01-b55
          speaker: narrator
          text: >-
            接着是一顿无比丰盛的晚餐。迪基守在新父亲身边服侍，替他换盘子，还从银壶里倒出酒，斟进老爷用的银杯。饭后，亲爱的母亲一定要把整座久别的宅子从头到尾走一遍，每一样东西都亲眼看看。迪基则陪父亲在花园里散步，从成熟的苹果间走过，又从沉甸甸的葡萄旁经过。父亲一直把手搭在他肩头。那时候，整个德特福德，甚至整个肯特郡，都找不出比他更幸福、更骄傲的男孩。
        - id: ch01-b56
          speaker: narrator
          text: >-
            父亲问他学过什么。迪基一件件说了，讲骑马、击剑、滚木球和音乐时，比讲家庭教师的功课详细得多。
        - id: ch01-b57
          speaker: dickie
          text: 不过希腊文和拉丁文，我也学了不少。还有诗歌那些东西。
        - id: ch01-b58
          speaker: father
          text: 我看你是不大爱读书吧。
        - id: ch01-b59
          speaker: dickie
          text: 我爱读书，父亲。不过那些运动，我更喜欢。
        - id: ch01-b60
          speaker: narrator
          text: >-
            迪基抬头看见一双跟自己一样湛蓝的眼睛，里面全是慈爱和骄傲。绕花园走到第三圈时，父亲终于开口了。
        - id: ch01-b61
          speaker: father
          text: 你这孩子真谦逊，竟然一次都没问，我答应送你的东西呢？
        - id: ch01-b62
          speaker: narrator
          text: 这下迪基撑不住了。过了一会儿，他才回答。
        - id: ch01-b63
          speaker: dickie
          text: >-
            我本来也许会问，可我把您答应的东西忘了。都是那场热病害的。
        - id: ch01-b64
          speaker: father
          text: >-
            是啊，可怜的孩子。你倒老实，肯承认自己忘了。来，好好催催那病得干瘪的记性。
        - id: ch01-b65
          speaker: narrator
          text: 一个美妙的希望在迪基耳边轻声说话，他简直不敢相信。
        - id: ch01-b66
          speaker: dickie
          text: 我好像要想起来了。父亲，您是不是答应过我……
        - id: ch01-b67
          speaker: father
          text: >-
            我答应过，只要你听话，认真读书，也坚持练习男子汉该会的本领，等你学会骑它，我就送你……
        - id: ch01-b68
          speaker: dickie
          text: 一匹小马？父亲，不会真的是小马吧？
          emotion: surprised
        - id: ch01-b69
          speaker: narrator
          text: >-
            父亲爽朗地放声大笑，手臂仍横在迪基肩上。能听见这样的笑声，能感觉父亲这样搂着自己，真好。到了大马厩，那匹小马从自己的栏位里转头看他们。说是小马，其实它的个头相当大。要是任你挑一匹完全属于自己的马，你会选什么颜色？迪基一定会选灰色，而眼前这匹恰好就是灰色的。
        - id: ch01-b70
          speaker: narrator
          text: >-
            迪基从头到脚赞赏了一番，叫人备好鞍，当着父亲的面神气地绕牧场骑了一圈，这才问起它的名字。
        - id: ch01-b71
          speaker: dickie
          text: 它叫什么？
        - id: ch01-b72
          speaker: father
          text: 我们叫它罗西南特，因为它长得这么胖。
        - id: ch01-b73
          speaker: narrator
          text: >-
            父亲笑了，迪基却没读过《堂吉诃德》，一点也不懂笑点。你当然读过。
        - id: ch01-b74
          speaker: dickie
          text: 我想叫它“拐杖”，可以吗？
        - id: ch01-b75
          speaker: father
          text: “拐杖”？
        - id: ch01-b76
          speaker: dickie
          text: >-
            因为它走得特别稳，连瘸腿的孩子也能骑。啊，父亲，我太快活了！我真高兴自己不是瘸子。
          emotion: happy
        - id: ch01-b77
          speaker: narrator
          text: >-
            他飞快下马，跑过去把鼻子埋进父亲的天鹅绒紧身上衣里，大概还抽了几下鼻子。
        - id: ch01-b78
          speaker: father
          text: >-
            又在胡思乱想了。好啦，你那场热病还没养好。拿出男子汉的样子，别忘了自己是哪家的儿子。你母亲也有礼物给你，是你外祖父送的。你连这个也忘了吗？那是奖赏你认真读书的，而你已经挣到了。
        - id: ch01-b79
          speaker: dickie
          text: 那个我也忘了。父亲，您不会因为这个生气吧？我也没办法。
        - id: ch01-b80
          speaker: father
          text: >-
            我担保你确实没办法。走吧，现在去找你母亲。我的小儿子啊，锡利伯爵今年夏天还责备我，说我舍不得用棍子，早晚会把孩子惯坏。可你样样都有长进，正好证明我的回答没有错。我当时对他说，哈丁家的男儿都以自己的门第为荣，许多伯爵的儿子非得挨棍子才肯学的东西，他们自己就愿意学。我把他说服了。他自己的儿子比傻瓜也强不了多少，我敢说，除了棍子，没什么能把那孩子害成这样。
        - id: ch01-b81
          speaker: narrator
          text: 他们在宽阔壁炉前的一小堆火边找到了母亲，她怀里抱着婴儿。
        - id: ch01-b82
          speaker: father
          text: 我们的儿子来领读书的奖赏了。
        - id: ch01-b83
          speaker: mother
          text: 我叫奶妈来抱孩子吧。
        - id: ch01-b84
          speaker: narrator
          text: 母亲抱着婴儿站起来，迪基却伸出了双臂。
        - id: ch01-b85
          speaker: dickie
          text: 母亲，让我抱抱他吧。
        - id: ch01-b86
          speaker: narrator
          text: >-
            这是迪基一生中第一次叫出“母亲”。温暖结实的小包裹落进他小心的臂弯，小弟弟马上伸手揪他的头发。虽然很疼，迪基却喜欢。
        - id: ch01-b87
          speaker: narrator
          text: >-
            母亲走到一只雕花柜前，从一大串亮闪闪的钥匙里仔细挑出一把同样闪亮的钥匙，打开一扇厚重的镶板柜门。柜子里面黑沉沉的，她从最深处取出一只颜色暗淡的皮袋。袋子上用金线和深红色丝线绣着精细的花纹，看上去既古老又贵重。
        - id: ch01-b88
          speaker: father
          text: >-
            他全忘了，连外祖父答应的东西也忘了。不过这份奖赏，他的确挣到了。都是那场热病。
        - id: ch01-b89
          speaker: mother
          text: 倒出来，数一数吧。
        - id: ch01-b90
          speaker: narrator
          text: >-
            母亲接回婴儿。迪基解开皮绳，把袋里的东西倒在擦得发亮的长桌上。一共二十枚金币。
        - id: ch01-b91
          speaker: mother
          text: >-
            每一枚上面都有我们已故女王的头像。那位举世无双的童贞女王陛下，是天下所有贞淑女子永远的典范。
        - id: ch01-b92
          speaker: father
          text: >-
            是啊，的确如此。孩子，把钱装回去。这些全是你的，想怎么花都由你。
        - id: ch01-b93
          speaker: mother
          text: 只要别把它胡乱花掉。
        - id: ch01-b94
          speaker: father
          text: >-
            随他自己的心意。明智也好，不明智也好，都由他。谁也不许追问这些钱花到哪里去了。
        - id: ch01-b95
          speaker: narrator
          text: 母亲皱了眉。她是个精打细算的主妇，二十枚金币可是一大笔钱。
        - id: ch01-b96
          speaker: dickie
          text: 母亲，您相信我。我绝不会浪费这些钱。
        - id: ch01-b97
          speaker: narrator
          text: >-
            这是迪基一生最幸福的时刻。小马和金币固然好，可比这两样更要紧的，是他忽然有了父亲、母亲和小弟弟。那是一种美好而安稳的感觉。他终于有了归属，有了自己爱着、也爱着自己的人。而且，他们是跟他相称的人。就一个孩子能跟大人平等到什么程度来说，迪基觉得自己和他们是平等的。比尔却不是。无论身体的风度，还是头脑和心灵里的珍宝，比尔都不能跟他们相比。
        - id: ch01-b98
          speaker: narrator
          text: >-
            可直到如今，迪基只爱过比尔。在他记得起来的那些日子里，也只有比尔和那个模模糊糊的亲生爸爸爱过他。爸爸死在医院里，临终时把拨浪鼓留给他。那就是他的叮当儿，也是哈丁的好运。偏偏就在这一生最幸福的时刻，对比尔的牵挂像一把锋利的匕首，猛地刺进他的心。那些金币在迪基眼里就是索维林金币，事实也的确如此。这么一大笔钱，能替比尔办成多少了不起的事啊。
        - id: ch01-b99
          speaker: narrator
          text: >-
            身边这些亲人越贴近他的心，这颗被爱唤醒的心就越惦记比尔。那个流浪、撬屋行窃，却在没人对迪基好时善待过他的比尔先生。
        - id: ch01-b100
          speaker: narrator
          text: >-
            晚些时候，一重新鲜的幸福把迪基累坏了。老奶妈领着他回到那间美丽的壁毯房，替他准备睡觉。迪基已经舒服得昏昏欲睡，眼睛都快睁不开了，却还是努力打起精神。他心里装着比尔和那些金币，非得先问明白一件事不可。
        - id: ch01-b101
          speaker: dickie
          text: 老奶妈，你知道好多事情，对不对？
        - id: ch01-b102
          speaker: nurse
          text: 该知道的事，我自然知道。
        - id: ch01-b103
          speaker: dickie
          text: >-
            你知道我的另一个梦吧，就是我说过的那个可怕地方？我能从这个时代带东西去另一个时代吗？
        - id: ch01-b104
          speaker: nurse
          text: >-
            能，不过下次回来时必须带回来。那边也有几样东西能带到这里，比如你的拨浪鼓、月光花种子和印章。
        - id: ch01-b105
          speaker: narrator
          text: 迪基瞪大了眼睛。
        - id: ch01-b106
          speaker: dickie
          text: 原来你真的知道。可我想把东西带过去，就留在那边。
        - id: ch01-b107
          speaker: narrator
          text: 老奶妈皱着眉，认真想了一阵。
        - id: ch01-b108
          speaker: nurse
          text: >-
            这里和那里隔着厚厚的三百年。东西握在手里穿过那些年月，多半会丢。钱太重了，走得也太慢，赶不上你这小羊羔的魂儿。路上会有人来得及看见它，把它抢走。
        - id: ch01-b109
          speaker: dickie
          text: 那就没有别的法子了吗？
        - id: ch01-b110
          speaker: nurse
          text: >-
            万事万物都有一条路，那条路就是土地。把东西埋进土里，你再躺到埋它的地方睡着。等你回到另一个梦里时，厚实又慈爱的泥土早已替你守住秘密。你只要在那里重新把它挖出来。它会好好待在那里，除非这三百年间，有别人的手抢先把它挖走。这个险，没有办法躲开，你必须自己去冒。
        - id: ch01-b111
          speaker: dickie
          text: >-
            你肯帮我吗？要骗过三百年，一定得埋得很深。可要是那儿盖了房子呢？我会不会跟房子挤在一起？两样东西不能待在同一个地方，家庭教师说过。房子比我结实，肯定是它占上风，那我会去哪里？
        - id: ch01-b112
          speaker: nurse
          text: >-
            我替你问问，看看你会到哪里。我去问一个知道的人，不过这得花些时间。你先把钱锁进大柜子，钥匙交给我。眼下嘛，下星期五，你的小表亲们就要来了。
        - id: ch01-b113
          speaker: narrator
          text: >-
            表亲们果然来了。在这些孩子面前隐瞒自己并非一直都是如今这个迪基，比在大人面前更难一些，不过也没有想象中那么难。那就像忍住不把昨夜的梦说出口。如今，他的生活充实极了。他要用脑筋读书，要锻炼身体，要做事，也要过一家人在一起的日子。除此以外，他还能跟两个真正懂得怎样玩耍的孩子，度过一段又一段快活时光。那些可怜又肮脏的德特福德孩子既不懂，也不可能懂得怎样这样玩耍。
        - id: ch01-b114
          speaker: narrator
          text: >-
            迪基就这样生活着，学习着，越来越觉得这才是自己真正属于的日子。一天又一天，一星期又一星期，一个月又一个月地过去，什么特别的事情也没有发生。可对一个本来就已经幸福的人来说，没有事情发生，并不无聊，也不可惜。日子安安稳稳地向前走，正是世上最幸福的事。
        - id: ch01-b115
          speaker: nurse
          text: >-
            我已经问过了。你得把宝藏埋在楼上起居室的窗下，再躺在上面睡着。你不会受伤。等你睡熟，我会念对的咒语。你醒来时还在同一片天空下面，不会像你担心的那样，被压在后来盖起的房子底下。
        - id: ch01-b116
          speaker: narrator
          text: >-
            那天夜里，等全家人都睡下后，老奶妈把迪基从床上抱起来，用自己一件暖和的呢斗篷裹住他，又替他穿好鞋，领他来到楼上起居室窗下一个秘密挖好的洞边。他们已经把绣花钱袋装进塞巴斯蒂安送给迪基的小铁艺箱。老奶妈又用蜡和树脂，把箱盖的接缝封得严严实实。铁箱先裹上一条丝巾，整个包裹再装进一只带盖的大陶罐。罐盖的接缝同样抹上树脂，外面还糊了一层黏土。这每一步，都是老奶妈教他做的。
        - id: ch01-b117
          speaker: nurse
          text: 这样才能挡住泥土里的精灵，还有那三百年。
        - id: ch01-b118
          speaker: narrator
          text: 她把陶罐放进洞里，两人填回泥土，再用脚踩紧。
        - id: ch01-b119
          speaker: nurse
          text: 等你想回来时，你知道该怎么做。
        - id: ch01-b120
          speaker: dickie
          text: 我知道吗？
        - id: ch01-b121
          speaker: nurse
          text: 像上次那样，摆好拨浪鼓、印章和月光花种子，再听那些声音。
        - id: ch01-b122
          speaker: narrator
          text: >-
            迪基躺进暖和的呢斗篷，老奶妈坐在旁边，一直握着他的手，等他慢慢睡着。如今正是六月，四周的玫瑰香得醉人，夜莺一声接一声地歌唱，让他好一阵子睡不着。不过头顶的天空是他的老朋友。躺在那里，他还能看见草坪的叶片之间闪着一颗颗露珠。这张挂着绿帷幕的床，睡起来依旧那么舒服。
        - id: ch01-b123
          speaker: narrator
          text: >-
            醒来时，星光灿烂的天空仍是他的老朋友。有那么一会儿，迪基不知道自己身在何处，随后全想起来了。他用一只胳膊肘撑起身体，发现四周尽是一幢幢小屋，有几扇窗还亮着灯，离他很近的地方立着一道破栅栏。附近连一棵草也没有，只有踩得坑坑洼洼的硬土。空气里闻不到玫瑰香，只有垃圾箱的臭味。夜莺也不见了。远处传来躁动不休的隆隆声，那是伦敦的嗓音。近处还有个从“猫与口哨”酒馆回家的人，正摇摇晃晃地唱着一首傻里傻气的歌。
        - id: ch01-b124
          speaker: narrator
          text: >-
            迪基捡起破盘子，在硬地上划了个十字，牢牢记住位置。接着他站起来，手脚并用爬到房前，翻进屋里，找到了比尔睡觉的房间。
        - id: ch01-b125
          speaker: narrator
          text: 第二天一早，冰冷的日光灌满薰衣草台十五号的前屋。比尔伸着懒腰，用没洗的拳头揉眼睛。
        - id: ch01-b126
          speaker: dickie
          text: 爸爸，你一定得把这房子租下来。一定得租。还记得吗？
        - id: ch01-b127
          speaker: loafer
          text: >-
            我可不记得。不过小不点儿既然这么说，那就照办。咱们先去喝一杯，再来块厚得像门阶砖的面包，然后再想办法。
        - id: ch01-b128
          speaker: dickie
          text: >-
            你饿了就自己去吃。我宁可守在这儿，免得房子被别人租走。你现在就去见房东。起得这么早，他准会当你是个有正经活儿的人。
        - id: ch01-b129
          speaker: loafer
          text: >-
            兴许吧。兴许我该先洗把脸，收拾收拾。说不定真值得这么做。反正我还得去便宜旅店，把童车和咱们的东西拿回来。
        - id: ch01-b130
          speaker: narrator
          text: >-
            比尔摸着两天没刮、沙沙作响的胡茬。房东后来果然把他当成了挺体面的工人。比尔解释说，他们从格雷夫森德一路走来，沿途做过零活，所以没有家具。这一段完全是真话。
        - id: ch01-b131
          speaker: loafer
          text: >-
            雇过我的那位先生也能替我作保。他姓塔尔博特，秃顶、斜眼、红耳朵。不过这些钱大概就够了。为了小不点儿，我急着安顿下来。我们一路走来，就是不舍得花掉这点钱。他的腿脚不方便。
        - id: ch01-b132
          speaker: narrator
          text: >-
            作保的话一句也不真。比尔掏出他们全部的两镑十八先令，只预先留下六便士放在另一个口袋里，此刻还特意摇得叮当响。
        - id: ch01-b133
          speaker: landlord
          text: >-
            那倒巧了。上一家也有个瘸腿男孩住在这儿。看来这房子天生就是给跛脚孩子住的。
        - id: ch01-b134
          speaker: narrator
          text: 比尔没料到这一问，一时编不出故事，只好试试实话。
        - id: ch01-b135
          speaker: loafer
          text: >-
            就是同一个孩子，先生。所以我才一定要租这里。您看，这地方对他来说就跟家一样。
        - id: ch01-b136
          speaker: landlord
          text: 你是他父亲？
        - id: ch01-b137
          speaker: loafer
          text: >-
            不是。我倒希望自己是。实话说，这孩子的姨妈不是好人。我看见他一个人在外头流浪，我又没有孩子，就把他收养了。
        - id: ch01-b138
          speaker: landlord
          text: 跟戏院里的《流浪继承人》一样。我懂了。
        - id: ch01-b139
          speaker: narrator
          text: 迪基的姨妈曾告诉房东，那个忘恩负义的小坏种逃走了。比尔越说越起劲，也渐渐忘了谨慎。
        - id: ch01-b140
          speaker: loafer
          text: >-
            他是个顶快活的小家伙，精得像捕鼠梗。有时候一开口，连猫都能逗笑。我可以先付一星期房租，今天就把那几件破家具搬进来。
        - id: ch01-b141
          speaker: landlord
          text: 好吧。咱们现在就去看房。孩子在哪儿？
        - id: ch01-b142
          speaker: loafer
          text: 就在那儿等我，怎么也不肯走。
        - id: ch01-b143
          speaker: narrator
          text: >-
            迪基对房东彬彬有礼，虽然从前日子不好过时，他还常冲这人做鬼脸。房东拿着六先令走了，他们得到了钥匙。
        - id: ch01-b144
          speaker: loafer
          text: >-
            这下咱们有自己的家了。英国人的家就是他的城堡。等你刻起盒子，我再弄来一群狗，白金汉宫摆在旁边也显得寒酸。对吧，伙计？
          emotion: happy
        - id: ch01-b145
          speaker: narrator
          text: >-
            他们锁上房门，出去吃早饭。比尔快活得像只云雀，迪基却有些沉默。他正琢磨一个新难题。二十枚索维林金币埋在土里，他清清楚楚知道位置，那当然很好。那些钱也确确实实属于他。可要是有人看见他把金币挖出来，钱一定会被没收，谁也不会相信金币属于他。再说，那个陶罐那么大，花园四周又有那么多窗户。要从自家后院挖出这么大一件东西，还不引起任何人的注意，谁也办不到。就算没人看见，他也怀疑自己有没有力气把陶罐挖出来。当初把金币放进另一种生活的土里时，他根本没想到这一点。那时的他强壮得多。他忍不住叹了口气。
        - id: ch01-b146
          speaker: loafer
          text: 怎么，不痛快吗，伙计？
        - id: ch01-b147
          speaker: dickie
          text: 没有，我只是在想事情。
        - id: ch01-b148
          speaker: loafer
          text: >-
            咱们最好先买几件破家具。这世道狠着呢。房东的规矩就是，屋里没东西，赊账别想提。
        - id: ch01-b149
          speaker: narrator
          text: >-
            你想知道他们到底买了哪些破家具吗？我来告诉你。他们买了一张锈迹斑斑的大铁床，床板松松垮垮地垂着，活像一张吊床。四根床柱顶端的圆球全没了，只剩光秃秃的螺杆，尖扎扎地戳出来。又买了一张塞毛褥垫，几个暗灰尘色的枕头，还有几条毯子和几张床单，颜色全跟褥垫一样。他们还买了一张桌子、两把椅子，以及一道厨房炉栏。炉栏上嵌着一轮圆圆的钢月亮，不过也已经锈得厉害。
        - id: ch01-b150
          speaker: narrator
          text: >-
            他们还买了一只放在水槽里的洗手盆，一只小锌皮澡盆。比尔说，那是给迪基洗衬衫用的。除此以外，还有四个盘子、两只带碟的杯子、两副刀叉和勺子、一把锡茶壶、一个一夸脱的水罐、一只水桶、一小块基德明斯特地毯、半磅黄肥皂、一把板刷、一把扫帚、两条毛巾、一只水壶、一口炖锅、一个烤盘，再加一品脱煤油。墙上那盏带着皱纹锡反光板的锡灯，是所有东西里唯一的新品，花了十便士半。其余东西加起来，一共二十六先令七便士半。我觉得这价钱确实便宜。
        - id: ch01-b151
          speaker: narrator
          text: 可它们堆在前屋里，又少又寒酸。尤其那张床，简直不像床，只像一堆散乱的废铁。
        - id: ch01-b152
          speaker: loafer
          text: >-
            咱们还缺客厅的全套家具呢。太太和老爷的安乐椅，四张小几，一架钢琴，再来一只烟熏橡木写字柜。
        - id: ch01-b153
          speaker: dickie
          text: >-
            先买窗帘。客厅挂白的，其他窗户挂短帘。拿我的旧衬衫擦玻璃吧，那件也经不起再洗了。
        - id: ch01-b154
          speaker: loafer
          text: 你可真没有在发号施令。
        - id: ch01-b155
          speaker: narrator
          text: >-
            比尔这句挖苦说得心满意足。他们买来窗帘和一便士的平头钉，又向邻居借了一把锤子。两个人快快活活干了整整一个钟头，终于把一个英国人的城堡守得严严实实，再也不让路过的人从窗外窥探。可是房东经过门前时，抬头看见那一片白窗帘，却忧心忡忡地皱起眉头。
        - id: ch01-b156
          speaker: landlord
          text: >-
            那片白窗帘我可不喜欢。后头准没多少东西。一般人不会把诺丁汉花边遮得这么严，除非想藏什么。十有八九，是想藏住一屋子的空荡荡。
        - id: ch01-b157
          speaker: narrator
          text: 屋里，迪基正告诉目瞪口呆的比尔，花园里埋着钱。
        - id: ch01-b158
          speaker: dickie
          text: >-
            那是别人送我的，因为我学会了一样东西。咱们必须挖出来，又不能让人看见。我只想到先搭个鸡舍，再从鸡舍里面挖。真希望我再聪明一点。赫里沃德要是在，一定马上就有办法。
        - id: ch01-b159
          speaker: loafer
          text: >-
            别发愁。对这个可怜的世界来说，你已经够聪明了。带我出去，指给我看。你装作随便抬头看天，再用脚点点埋钱的地方。
        - id: ch01-b160
          speaker: narrator
          text: 两人来到外面，迪基把脚放在破盘片划出的十字上。旁边就是枯萎的月光花茎。
        - id: ch01-b161
          speaker: loafer
          text: >-
            这花园可真够糟。入冬前得把土全翻一遍。我今天就弄把铲子，好好挖挖。瞧这棵老洋蓟，根肯定扎得深。
        - id: ch01-b162
          speaker: narrator
          text: >-
            比尔故意说得很响。他从篱笆边一路挖到月光花。花根果然很深，等坑挖得够大，高高的花茎才像斧头下的大树，庄严又缓慢地倒了。
        - id: ch01-b163
          speaker: narrator
          text: >-
            随后，一大一小走进屋里，把厨房桌椅搬出来，又把毯子搭在上面，借着秋天的阳光晒一晒。迪基钻到桌子下面玩过家家。他平时根本不玩这种游戏，可四周的邻居并不知道。那张桌子摆得正好，严严实实罩在挖出月光花根的土坑上面。迪基藏在毯子搭成的小房子里，拿着一把小铲子，一点一点继续往下挖。
        - id: ch01-b164
          speaker: narrator
          text: >-
            天黑以后，他们把毯子和那些东西全搬回屋里，又拿出一条毯子，牢牢钉住顶楼的窗户。比尔把陶罐同花园里的其他东西一起搬进来，搁在大铁床暗沉沉的褥垫上。他们先把罐盖接缝处的树脂烤化，又接着烤化铁箱接缝处的树脂。比尔本来就有一双略微凸出的眼睛。此刻他死死盯着那只绣花皮袋，眼珠几乎像龙虾或蜗牛的眼睛一样突出来。
        - id: ch01-b165
          speaker: narrator
          text: 迪基打开钱袋，二十枚金币哗啦啦落进暗灰褥套的一处凹陷。比尔闭眼叹了口气，又睁开眼。
        - id: ch01-b166
          speaker: loafer
          text: 送给你的？他们真把这些钱送给你？我不信。
          emotion: surprised
        - id: ch01-b167
          speaker: dickie
          text: 你必须信。我从来没对你撒过谎，对不对？
        - id: ch01-b168
          speaker: loafer
          text: 仔细一想，我还真不记得你撒过谎。
        - id: ch01-b169
          speaker: dickie
          text: 那不就得了？这些就是别人送我的，明白了吧？
        - id: ch01-b170
          speaker: loafer
          text: >-
            可咱们永远也换不了这些钱。拿去兑换准会被抓，人家会说是偷来的。
          emotion: sad
        - id: ch01-b171
          speaker: dickie
          text: >-
            不会，我有个朋友能替我换。换完咱们买新衣服，再添家具、地毯和陶瓷洗脸盆，不用那只破锡盆洗脸了。还得买个澡盆。你多买几只小狗，我去买一套正经雕刻工具。好日子就要来了，懂吗？
        - id: ch01-b172
          speaker: loafer
          text: >-
            你这个小不点儿。我这辈子做得最对的一件事，就是跟你搭伙。你是个正派人，顶顶好的人。换了别的孩子，早带着亮闪闪的金币跑了。你没扔下老比尔，老比尔也绝不会扔下你。
        - id: ch01-b173
          speaker: dickie
          text: 这就对啦。
        - id: ch01-b174
          speaker: narrator
          text: 迪基开始把金币装回袋子，比尔却固执地拦住他。
        - id: ch01-b175
          speaker: loafer
          text: >-
            不，还没说完。我非得全告诉你，不然会把自己憋炸。当初带你走，不是因为我像后来所说的那样喜欢你。我是想找个孩子钻窗户，好跟那个你没见过的红头发家伙一起干活。懂了吗？
        - id: ch01-b176
          speaker: dickie
          text: 这件事，我早就知道了。
        - id: ch01-b177
          speaker: narrator
          text: 迪基严肃地望着壁炉台上摇动的烛光。
        - id: ch01-b178
          speaker: loafer
          text: >-
            我开头真没安好心。你那回在我鞋底写字，我还特意买了纸和铅笔。就是这么回事！
        - id: ch01-b179
          speaker: dickie
          text: 可你又没有害过我。
        - id: ch01-b180
          speaker: loafer
          text: >-
            是啊，我知道没害你。因为第一天我就喜欢上你了。我一直待你不错，这一点你不能不认。可我到底还是个畜生。
          emotion: sad
        - id: ch01-b181
          speaker: narrator
          text: >-
            比尔心里有两股愿望在打架，弄得他不知该怎么办。人在坦白一件事时，往往既想把自己最坏的一面全说出来，又忍不住想把自己的好处也一样样讲清楚。两个愿望凑在一起，实话就变得很难说了。想把真实的自己说明白，既不故意把黑处说得更黑，也不偷偷把白处涂得更白，实在是一件太难的事。
        - id: ch01-b182
          speaker: dickie
          text: 哎，别再说了。你既然告诉了我，这件事就两清。
        - id: ch01-b183
          speaker: loafer
          text: 你以后不会一直记恨我吧？
        - id: ch01-b184
          speaker: dickie
          text: >-
            我为什么要记恨？如今一切已昭然若揭，我们便可作为正直之士与忠诚伙伴，共同追求高尚的伟业。我是说，没事了，爸爸。这对我没有分别。我知道你现在是个正派人，就算开头不是。咱们睡觉，好不好？
        - id: ch01-b185
          speaker: narrator
          text: >-
            迪基又困又烦，比尔却张大嘴巴，眼睛比刚才更像龙虾。那晚，比尔梦见自己想把迪基淹死在一池炖鳗鱼里。迪基什么梦也没做。
        - id: ch01-b186
          speaker: narrator
          text: >-
            你也许会觉得奇怪。既然去另一个美丽世界既不花掉这里的时间，又那么容易，迪基为什么不夜夜都去，甚至不在白天随便找个时候去？其实，他不敢。他实在太爱另一种生活，害怕自己一旦回去，就再也拿不出勇气回到比尔先生和德特福德身边。他必须重新忍受脏衣服贴在身上的感觉，也必须重新闻垃圾箱的气味。从那边回到这里，绝不是一件轻松的小事。
        - id: ch01-b187
          speaker: narrator
          text: >-
            他已经下定决心。在帮比尔找到一门正当营生，让比尔过上一种能够幸福的生活以前，他绝不摆出叮当儿、印章和月光花种子组成的符咒，也绝不借着它逃回另一种生活。让一个孩子承担这样的事业，或许实在太大，也太重了。是的，的确如此。可迪基本来就不是一个普通孩子，不然这些奇异的遭遇根本不会落到他身上。
        - id: ch01-b188
          speaker: narrator
          text: >-
            当铺老板一直是迪基的好朋友，也是个很有眼力的人。听迪基说盒子、钱袋和金币全是别人送的，他一眼就看出这个孩子并没有撒谎。他替迪基把刻着伊丽莎白女王头像的旧金币，换成刻着维多利亚女王头像、可以放心使用的钱币。那只小铁艺箱，他又另外出五镑买了下来。他还坦白承认，自己能从这笔买卖里赚上一点，不过只是一点很小很小的利润。
        - id: ch01-b189
          speaker: pawnbroker
          text: >-
            往后你那些上流朋友再送你什么宝贝，只管拿到我这里来。不是我自夸，这可是同行里最公道的一家。
        - id: ch01-b190
          speaker: dickie
          text: >-
            非常感谢。您一直是我的好朋友。您从盒子和这些东西上只赚一点小钱，我希望将来能好好报答您，帮您一个更大的忙。
        - id: ch01-b191
          speaker: narrator
          text: >-
            那位商人就在那个星期，以二十一个几尼卖掉了铁艺箱。于是，迪基和比尔如今一共有二十七镑。他们买了新衣服，又添置了一些家具，还把其中二十二镑存进储蓄银行。迪基给自己买来一套雕刻工具，又进金匠学院学习怎样使用。前面的卧室里替他装上了一张工作台，后面那间起居室则变成了狗舍。比尔马上开始四处搜罗狗，一心要把自己真正喜欢的营生做起来。
        - id: ch01-b192
          speaker: narrator
          text: >-
            前屋变成了一间真正的客厅。他们还雇了一个叫阿米莉亚的体面年轻女人，每天过来替他们料理家务。从此，他们穿的衣服干干净净，吃的饭菜也像模像样。迪基懂得大宅里井然有序的生活是什么样，也用这份本事把小屋里的日子安排得井井有条。他们不再靠骗人或偷窃，而是一天一天靠劳动养活自己。新生活已经稳稳当当地开始了。到了这时，迪基觉得自己终于可以大胆穿过三百年，回到那边等待他的一切中去了。
        - id: ch01-b193
          speaker: dickie
          text: >-
            不过我只待一个月。这边一个月，那边也一个月，日子才扯得平。要是在那边待得更久，这边的我就不会长得一样快。万一我在一种生活里成了大人，却还得回来做小男孩，那可太傻了。
        - id: ch01-b194
          speaker: narrator
          text: >-
            我并不是说，迪基心里从来没有闪过这样的念头。如今比尔已经安顿好了，就算没有他，也可以把日子过得不错。可迪基心里其实更明白。他每次一想到这里，便立刻把这个念头赶走，不肯让它留下。何况，比尔一直待他很好，他也真心爱着比尔。
        - id: ch01-b195
          speaker: narrator
          text: >-
            那些白窗帘如今不必再遮掩寒酸的秘密。房东来收租时，比尔已经能大大方方请他进屋，走进一间舒舒服服的真正客厅。里头有一张马毛沙发、一把宽大却磨旧的安乐椅、一块地毯、四把旧红木椅子，还有一张铺着干净红蓝格布的桌子。壁炉台上摆着一只亮闪闪的钟，花瓶里插着菊花。白花边窗帘外面，又添上了一层暖和的红羊毛布帘。
        - id: ch01-b196
          speaker: landlord
          text: 你们这儿可真舒服，再不能更舒服了。
        - id: ch01-b197
          speaker: loafer
          text: 还不赖。想不想看看我的狗？
        - id: ch01-b198
          speaker: narrator
          text: >-
            比尔已经洗得干干净净，整张脸看起来亮堂堂的。他兴致勃勃地把房东带去看狗，还成功用十先令卖给他一只小狗。做完这笔正当买卖以后，比尔回到迪基身边。迪基正安安稳稳坐在怡人的炉火旁，屋里的一切都显得舒服而气派。
        - id: ch01-b199
          speaker: loafer
          text: >-
            样样都挺气派，可你的两条腿就从来不会发痒，非想走出去不可吗？我现在已经老老实实安顿下来了，以后也会一直老实。可等春天到了，天气暖和些，咱们把小屋锁起来，再出去走一段路怎么样？就连绅士们也会这样做。他们还给这件事取了个气派名字，叫徒步游历。
        - id: ch01-b200
          speaker: dickie
          text: 我愿意。可这些狗怎么办？
        - id: ch01-b201
          speaker: loafer
          text: >-
            阿米莉亚会把它们照料得舒舒服服，只有范妮和弗莱跟咱们走。我也不知道这是怎么回事，我就是那么想念在路上的日子。从小我就这样，谁也没法把我送进学校。我老往外跑，不是掏鸟窝，就是逮兔子。不过我长大的那个地方，我倒一直挺喜欢。我没跟你说过吧？上回咱们睡在金雀花丛里时，正好从我的老家附近走过。我猜我父亲如今已经不在了。不过他从前是个硬朗的老头儿，说不定一直挺到了现在。
        - id: ch01-b202
          speaker: dickie
          text: 那咱们哪天去看看他吧。
        - id: ch01-b203
          speaker: loafer
          text: >-
            我不知道。我以前总叫他操心，也不愿发现他已经走了。最好什么都别知道，我是这么想的。
        - id: ch01-b204
          speaker: narrator
          text: >-
            话虽这么说，比尔还是忍不住叹了口气。他没有再往下讲，也没有立刻决定究竟要不要回去看看父亲。屋里安静下来，他默默拿出烟斗，一点一点把烟丝装进去。比尔坐在炉火旁，久久没有开口，只是若有所思地想着那个他既想回去、又害怕回去的老家。
