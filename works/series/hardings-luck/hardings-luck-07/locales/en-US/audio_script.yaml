  chapters:
    - id: ch01
      title: Dickie Learns Many Things
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            That night Dickie could not sleep. As he lay awake, one purpose grew stronger and stronger. He would try the moon-seeds, the rattle, and the white seal once more. He would find his way back to the other world. So he crept downstairs to the parlor, where a thin bed of clear red fire still glowed.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Then the moon-seeds, the whispering voices, and the magic were over. Dickie woke with a thrill of pride at how cleverly he had managed everything. He moved both legs beneath the bedclothes and rejoiced that he was no longer lame. Then he opened his eyes, ready to feast them on the great bright room with its beautiful tapestries. But this room had no tapestries at all. Dark wooden panels covered the walls. Very little daylight reached him, and the whole chamber was so small that it was hardly better than a cupboard.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Nothing had ever surprised him more, and he was frightened too. If the spell could not be trusted to take him where he wished, then what in the world could he trust? He might have landed anywhere. He might even have become someone he had never meant to be.
        - id: ch01-b04
          speaker: dickie
          text: >-
            I'll never try that again. If I get out of here, I'll keep to wood-carving. No more wandering through dreams and such things for me.
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: >-
            He climbed out of bed and looked through a narrow window. Below was a strange garden with marble seats and stone railings. Cold autumn dew clung to trees that had almost lost their leaves.
        - id: ch01-b06
          speaker: dickie
          text: >-
            It could be worse. It could be a prison yard. Come on, keep your courage. Wherever you are, this is an adventure.
        - id: ch01-b07
          speaker: narrator
          text: >-
            He turned back from the window and searched the cramped room for his clothes. There were no clothes anywhere. The only reassuring thing was the shirt he had slept in. It looked exactly like the shirt from the beautiful house. Dickie went to open the door, only to discover that there was no door. Wherever he looked, he saw the same dark, unbroken panelling. Was this not a room at all, but a box? No, that was nonsense. Boxes did not have beds inside them, and they certainly did not have windows.
        - id: ch01-b08
          speaker: narrator
          text: >-
            All at once he stopped feeling like the clever boy who could manage two lives and guide a grown man for that man's own good. He was simply a small boy, badly scared. His familiar shirt gave him just enough courage to pound on the panels and shout.
        - id: ch01-b09
          speaker: dickie
          text: "Nurse! Nurse! Nurse!"
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: >-
            A bright crack appeared between two panels. They slid apart, and in came the nurse with the ruff, the frilled cap, and the kind, wrinkled face. Dickie threw his arms around her broad, comfortable waist. His doublet, round breeches, stockings, and rosetted shoes hung over her arm.
        - id: ch01-b11
          speaker: nurse
          text: "There now, my lamb. You're safe."
          emotion: calm
        - id: ch01-b12
          speaker: dickie
          text: >-
            Oh, I am here! I'm so glad. I thought the magic had sent me somewhere else.
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: >-
            The nurse sat on the bed and dressed him. Her gentle hands and pet names slowly brought his courage back. When she reached the doublet's silver buttons, shaped like little sugar loaves, her manner grew serious.
        - id: ch01-b14
          speaker: nurse
          text: >-
            Listen carefully. You have been gone for a month.
        - id: ch01-b15
          speaker: dickie
          text: "But I thought time stayed still. I thought..."
          emotion: surprised
        - id: ch01-b16
          speaker: nurse
          text: >-
            The money upset everything. Money always does, and I should have known it. No one here knows you went away. To them, you have spent the month learning, playing, and behaving just as usual. You are visiting your cousins at your uncle's London house. You share their lessons with your tutor, whom they dislike as much as you do. Forget your dream and step back into this life. Speak slowly for a day or two, until you know your place again. Today you will study alone. One cousin is going with his mother to carry her train at the King's revels in Whitehall. The other must stay home and sew her sampler, because her mother says she has run wild long enough.
        - id: ch01-b17
          speaker: narrator
          text: >-
            So Dickie faced his hated tutor alone. Relief after the morning's terror made him wildly high-spirited, and for Dickie that meant unusually bad behavior. He drew a comic portrait of the tutor. It was rather a good likeness. From the drawn mouth came a scroll saying that being ugly was no excuse for being hateful. Unfortunately, the tutor had a nasty habit of creeping up behind people, and this time he arrived at exactly the wrong moment.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Dickie was caned on both hands and kept indoors. His dinner was bread and water. Then he had to write two hundred times that he was a bad boy and begged his good tutor's pardon. Every copy ended with the date, the fifth of November, 1608. Because of the punishment, he missed seeing his aunt and cousin in their splendid Whitehall clothes. Late afternoon had come before the final line was done. He felt certain he would have refused to finish, except that he kept thinking of his girl cousin and longing to see her again. She was the only little girl friend he had.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The instant he finished, he ran to her room. Though he could not remember visiting this house, he somehow knew every turn. His cousin was still sitting over her sewing frame.
        - id: ch01-b20
          speaker: dickie
          text: >-
            Is your task finished? Mine is. Old Parrot-nose worked me hard, but I thought about you and obeyed him this once. Now we're free. Come and play ball in the garden.
        - id: ch01-b21
          speaker: narrator
          text: >-
            His cousin dropped the frame and sprang up.
        - id: ch01-b22
          speaker: girl_cousin
          text: "I'm so glad. I hate this awful sampler."
        - id: ch01-b23
          speaker: narrator
          text: >-
            At her words, Dickie felt something strange, like a clock striking once and then stopping. There was no time to puzzle over it. His cousin was waiting.
        - id: ch01-b24
          speaker: dickie
          text: "Come on, Elfrida."
        - id: ch01-b25
          speaker: narrator
          text: >-
            He held out his hand. Elfrida took it, and together they went into the garden. Dickie's cousins were named Edred and Elfrida. Their father, Lord Arden, had a beautiful castle beside the sea as well as this London house. Lord and Lady Arden were great favorites at the court of King James the First. Arden was Dickie's name in this old life too. He was Richard Arden, son of Sir Richard Arden of Deptford and Aylesbury. The sour tutor's true name was Mr. Parados. His pupils had shortened it, with no respect at all, to Parrot-nose.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Dickie and Elfrida played ball, then hide-and-seek, and then ran races through the garden. Just then Dickie preferred playing to talking. He did not want to betray the fact that he remembered absolutely nothing about anything he was supposed to have done during the missing month. Elfrida did not appear eager for conversation either. There was plenty in the garden to hold their attention. The only stain on the pleasant scene was the tutor. Dressed all in black, he paced up and down with a sour face and both thumbs tucked into one of his dull-looking books.
        - id: ch01-b27
          speaker: narrator
          text: >-
            At last the children sat on the step of a stone seat. Dickie was still wondering about that stopped-clock feeling when Elfrida began to recite a rhyme. She told him to remember the fifth of November, the gunpowder treason and plot, and said there was no reason it should ever be forgot.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Dickie had not known the rhyme was so old. Then he remembered his father warning him that treason was a dangerous word in these times.
        - id: ch01-b29
          speaker: dickie
          text: >-
            That isn't a cheerful song, cousin, and singing about treason may not be safe.
        - id: ch01-b30
          speaker: girl_cousin
          text: >-
            But the plot failed, you know, and they always burn Guy Fawkes in the end.
        - id: ch01-b31
          speaker: narrator
          text: >-
            So people already burned Guy Fawkes. Perhaps there would be a bonfire that night. Dickie knew it was November fifth because he had copied the date two hundred times. But he could not remember the year of the Gunpowder Plot, and he feared saying either too much or too little.
        - id: ch01-b32
          speaker: dickie
          text: "Does the rhyme have any more verses?"
        - id: ch01-b33
          speaker: girl_cousin
          text: "No."
        - id: ch01-b34
          speaker: dickie
          text: "Then what treason is the song about?"
        - id: ch01-b35
          speaker: narrator
          text: >-
            Elfrida looked amazed, and Dickie knew at once that he had asked the wrong question.
        - id: ch01-b36
          speaker: girl_cousin
          text: >-
            Don't you know? I do. I know some of the plotters' names, who they meant to kill, and all sorts of things.
        - id: ch01-b37
          speaker: dickie
          text: "Then tell me."
        - id: ch01-b38
          speaker: girl_cousin
          text: >-
            The King had not treated the Catholics fairly, so a number of them decided to kill him and the members of Parliament. Ever so many people joined the plot. They accused Lord Arden of taking part, but he was innocent. Some of the plotters were to pretend they were out hunting. Then they would seize Princess Elizabeth and proclaim her Queen. The rest planned to blow up the Houses of Parliament while the King was there to open them.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Again came the stopped-clock feeling. The Elfrida he knew from the barge journey to Gravesend had never spoken of a great many people as "ever so many." Dickie laughed because he felt uneasy.
        - id: ch01-b40
          speaker: dickie
          text: "My tutor never taught me that story. Go on, cousin."
        - id: ch01-b41
          speaker: narrator
          text: >-
            Elfrida continued, but Dickie scarcely listened. The strange pressure inside him kept growing. Then she said that Mr. Tresham had warned his relative Lord Monteagle that the King would be blown up.
        - id: ch01-b42
          speaker: dickie
          text: "Which king?"
        - id: ch01-b43
          speaker: girl_cousin
          text: "King James the First, of course."
        - id: ch01-b44
          speaker: narrator
          text: >-
            Suddenly the horrible tutor sprang upon them and caught Elfrida by the wrist. In the same instant, everything became confused. Mr. Parados demanded answer after answer while the little girl struggled to speak. Through the confusion, Dickie finally understood the terrible fact. Here and now, the Gunpowder Plot had not happened yet. Elfrida had revealed the entire scheme before the conspirators could carry it out. But how had she known what they planned? How had she learned the old rhyme before there was any old event for it to remember?
        - id: ch01-b45
          speaker: tutor
          text: >-
            Tell me every name and every detail, or both you and your father will suffer for it.
          emotion: angry
        - id: ch01-b46
          speaker: narrator
          text: >-
            Elfrida's face went green with fear, and she appealed silently to Dickie.
        - id: ch01-b47
          speaker: dickie
          text: >-
            Sir, you're frightening my cousin. It was only a story. She is always merry, and she invents things.
        - id: ch01-b48
          speaker: narrator
          text: >-
            The tutor would not be quieted or persuaded. Through the confusion Dickie heard Elfrida insist that it was written in history. After that came a blur of questions, frightened answers, accusations, and dreadful consequences. When the blur finally cleared, Dickie was left in the house with Mr. Parados, the nurse, and the servants. The Earl and Countess of Arden had been taken away. Edred and Elfrida had gone with them. All four were imprisoned in the Tower of London under a charge of high treason.
        - id: ch01-b49
          speaker: narrator
          text: >-
            This really was the fifth of November, the very day the Gunpowder Plot was meant to happen. Instead of Mr. Tresham warning Lord Monteagle, Elfrida had exposed everything. Perhaps she had dreams like Dickie's. Perhaps in those dreams she visited later years, when the plot belonged to history. Dickie's brain felt swollen and ready to burst. He was glad to go to bed, even in the cramped panelled closet, though he begged the nurse to leave the sliding panel open.
        - id: ch01-b50
          speaker: narrator
          text: >-
            When Dickie woke the next morning, none of it had vanished. His aunt and uncle and both cousins were still in the Tower. Gloom hung above Arden House in Soho like a black thundercloud above a mountain. The days dragged on. Every lesson with Mr. Parados became an Inquisition in miniature. Not one day passed without the tutor probing and trapping, trying to learn whether Dickie had shared Elfrida's guilty foreknowledge. According to Parados, her knowledge had overthrown the wicked Catholic plot and preserved His Most Gracious Majesty, James the First, for his loyal people.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Then one day, as though it were the most ordinary event imaginable, Lady Arden and Edred were released from the Tower and came home. The King had suddenly decided that those two, at least, had known nothing of the plot. Lady Arden cried without stopping, and Dickie admitted to himself that she had more than enough reason. Edred responded quite differently. His head was full of half-formed plans and schemes for paying back old Parrot-nose.
        - id: ch01-b52
          speaker: narrator
          text: >-
            At last Edred formed a complete plan for getting Elfrida out of the Tower. It was daring but workable, and it succeeded. Edred and Richard first went inside to visit Lord Arden. Elfrida changed into boy's clothes and came out pretending to be Edred. Then the guard at the Tower gate changed. With a new guard on duty, the real Edred could walk out as well. They hurried into a waiting coach. Elfrida squeezed beneath the seat among straw and the passengers' feet. As the coach jolted through the snowy London streets toward Arden House in Soho, the children reached down into the darkness and hugged one another.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Dickie felt very small and confused in the middle of such dangerous affairs. Then the nurse caught him firmly by the arm.
        - id: ch01-b54
          speaker: nurse
          text: "Now Master Richard will go and change out of his fine suit."
        - id: ch01-b55
          speaker: narrator
          text: >-
            She pushed him from the room before he heard the rest. Grumbling, he returned to his panelled bed-closet, took off the velvet and fur he had worn to the Tower, and put on his everyday clothes. He hurried back, eager to discuss the rescue. He found his cousins whispering in a corner.
        - id: ch01-b56
          speaker: dickie
          text: "What are you two planning?"
        - id: ch01-b57
          speaker: boy_cousin
          text: >-
            We're going to get even with old Parrot-nose. But you can't join us. We're leaving, and if you're involved, you'll be blamed for whatever we do.
        - id: ch01-b58
          speaker: dickie
          text: >-
            Why shouldn't I help with something I've wanted to do for four years?
        - id: ch01-b59
          speaker: narrator
          text: >-
            Until the words left his mouth, he had not known he had known the tutor for four years. Yet the memory felt true.
        - id: ch01-b60
          speaker: boy_cousin
          text: "There is a reason. Go to bed, Richard."
        - id: ch01-b61
          speaker: dickie
          text: "I won't."
        - id: ch01-b62
          speaker: girl_cousin
          text: >-
            If we explain, you won't believe us.
        - id: ch01-b63
          speaker: dickie
          text: >-
            You might at least give me the chance.
        - id: ch01-b64
          speaker: girl_cousin
          text: >-
            Very well. No, Edred, he deserves to know. He's one of us, and he won't betray us. Will you, Dickie?
        - id: ch01-b65
          speaker: dickie
          text: "You know I won't."
        - id: ch01-b66
          speaker: girl_cousin
          text: >-
            Then listen as hard as you can. Believe with both hands and with all your strength, or you may not be able to believe at all. Edred and I are not what we seem. We do not truly belong in this time. I have no idea what has happened to the real Edred and Elfrida, the ones who were born here. Haven't we seemed odd to you? Haven't we seemed different from the cousins you knew at Deptford?
        - id: ch01-b67
          speaker: narrator
          text: >-
            The stopped-clock feeling returned with full force, and Dickie nodded.
        - id: ch01-b68
          speaker: girl_cousin
          text: >-
            That's because we aren't those cousins. We come from three hundred years later. In our own time Edred is Lord Arden, and a white mole helps us. We have a charm that lets us visit different times in history.
        - id: ch01-b69
          speaker: boy_cousin
          text: "Not every time."
        - id: ch01-b70
          speaker: girl_cousin
          text: >-
            No, not every one. There are chests filled with clothes from different ages, and whichever clothes we put on carry us into that part of history. I know it sounds like a silly untruth. I knew before I began that you would not believe me, but it really is true. Now we're going back to our own time. That means Queen Alexandra and King Edward the Seventh, electric lights and motorcars, and the year 1908. Don't try to force yourself to believe if believing hurts you, Dickie dear. I know it sounds most awfully strange, but it is the real, honest truth.
        - id: ch01-b71
          speaker: narrator
          text: >-
            Richard could not speak. He had never imagined these impossible changes could happen to anyone but him.
        - id: ch01-b72
          speaker: boy_cousin
          text: "You don't believe us. I knew you wouldn't."
        - id: ch01-b73
          speaker: narrator
          text: >-
            Dickie felt dizzy. Surely the same miracle could not happen to someone else. That must mean this entire old life was only a dream.
        - id: ch01-b74
          speaker: girl_cousin
          text: >-
            Never mind. Don't struggle with it. Forget what we said, or pretend we were only teasing you.
          emotion: calm
        - id: ch01-b75
          speaker: boy_cousin
          text: "It doesn't matter now. How shall we punish old Parrot-nose?"
        - id: ch01-b76
          speaker: dickie
          text: >-
            I don't like this. Nothing has ever happened this way before. It makes everything here feel unreal. I suppose it truly is a dream, and I had finally begun to believe it was real.
          emotion: sad
        - id: ch01-b77
          speaker: boy_cousin
          text: >-
            I don't understand any of that. Look at this. You've never seen one of these. It comes from our time.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Edred darted to a corner and brought out a Brownie camera. Dickie knew it at once. A schoolboy had owned one and let him borrow it, and an assistant master had a larger camera of the same kind. The sight was hateful. Here was a piece of the ugly, scientific age where he had been born, pushing into the beautiful time he had learned to love.
        - id: ch01-b79
          speaker: dickie
          text: >-
            Oh, stop it. Now I know this is a silly dream. There's no point pretending I don't recognize a Kodak. That's a Brownie.
        - id: ch01-b80
          speaker: girl_cousin
          text: >-
            Then when you dreamed about our time, did you see carriages driven by fire, and fire-boats, and...?
        - id: ch01-b81
          speaker: narrator
          text: >-
            Richard told them he was not a baby. Of course he knew railways, steamboats, and the triumphs of civilization. He even told them that Kent had scored 615 against Derbyshire the previous Thursday. Both cousins showered him with questions, but his own questions were too loud in his mind for him to answer.
        - id: ch01-b82
          speaker: dickie
          text: >-
            I won't tell you anything else. But I will help you settle matters with old Parrot-nose. We can shovel snow from the roof through the skylight into his room.
        - id: ch01-b83
          speaker: narrator
          text: >-
            Before they did anything to the tutor, Edred insisted that Dickie write down the Kent and Derbyshire score. Then the cousins could check whether it was true when they returned to their own time. Dickie discovered a scrap of paper tucked inside his doublet. It was the bill he had been holding when he laid out the magic moon-seed pattern, and it had somehow crossed the years with him. The bill listed three guns for a little ship, along with compasses and six flags. Mr. Beale had bought them in London to fit out a model ship Dickie had ordered for the pawnbroker's small son. Dickie scribbled the cricket news across the back and gave the paper to Edred.
        - id: ch01-b84
          speaker: narrator
          text: >-
            Then all three children climbed out onto the roof. They shoveled the fallen snow through the skylight that opened conveniently into Mr. Parados's room. It was not long before the furious tutor came scrambling onto the roof to catch them. The children darted around the chimney stacks, reached the trapdoor ahead of him, and slipped through it. They slammed the door and dropped the fastening into place. Mr. Parados was left alone above them, shut out on the roof in the snow.
        - id: ch01-b85
          speaker: narrator
          text: >-
            Soon afterward the nurse caught them, and Richard was ordered to bed. But he did not obey. There was no real sleep in Arden House that night, even though sleepiness filled every room like a thick fog. Dickie put out his rushlight and sat quietly for a while. Before long, staying still became impossible. Something strange was happening in the house, and he felt that he must know what it was. Moving softly and carefully, he slipped into the passage and hid behind a tall wooden press at its far end.
        - id: ch01-b86
          speaker: narrator
          text: >-
            Voices rose from below. He heard the nurse, his cousins, and someone else. That last voice was familiar. The stopped-clock feeling pressed around him as he remembered it from the night of his first magic. It was the voice that had said he belonged more to one power than the other.
        - id: ch01-b87
          speaker: narrator
          text: >-
            The nurse's candle gleamed on the stairs and vanished up the next flight. Dickie followed. He could not remain outside the most mysterious thing that had ever happened to him. On the upper landing, the others stood beside an open window. A sharp wind poured in, whirling snowflakes through a dark square filled with stars. Amid the whispers, he heard the strange voice give an order.
        - id: ch01-b88
          speaker: soft_voice_1
          text: "There. That's right. Jump."
        - id: ch01-b89
          speaker: narrator
          text: >-
            A small figure climbed onto the sill. Dickie thought it was Edred, then saw it was Elfrida. She jumped straight from the third-floor window. Edred followed.
        - id: ch01-b90
          speaker: dickie
          text: >-
            It is a dream. But if they're being forced to jump as punishment for Parrot-nose, then I'll jump too.
        - id: ch01-b91
          speaker: narrator
          text: >-
            He dashed past the nurse and the two voices, sprang onto the sill, and jumped. As his knee touched the icy stone, the strange voice spoke again.
        - id: ch01-b92
          speaker: soft_voice_1
          text: "Another one."
        - id: ch01-b93
          speaker: narrator
          text: >-
            Dickie fell through the air.
        - id: ch01-b94
          speaker: dickie
          text: >-
            I'll wake when I hit the ground. Then I'll know the whole thing was only a foolish dream.
        - id: ch01-b95
          speaker: narrator
          text: >-
            But Dickie never reached the ground. He had not fallen more than a couple of yards when something caught him, something as soft as a heap of feathers or a bank of drifted snow. The softness moved under his body and slowly took a shape. First it seemed to be a chair, then a carriage. Reins appeared in his hands, and the reins were white. He looked for the horse and saw that there was none. In its place, a great swan with broad white wings pulled the carriage through the snowy air.
        - id: ch01-b96
          speaker: narrator
          text: >-
            Dickie grasped the reins. He guided the strange white steed into a low swoop toward the torchlight in the street, just outside the house's great front door. The swan stretched its long neck into the downward flight. Below and beyond it, Dickie saw his cousins in a carriage like his own. Their swan rose into the sky and carried them away toward the south. Dickie had not decided what to do, yet his hands pulled the reins. His own swan climbed. He pulled once more, and the flying carriage stopped level with the open landing window.
        - id: ch01-b97
          speaker: narrator
          text: >-
            Hands dragged him inside. They were the nurse's hands. The swan glided away between snow and stars while the nurse held Dickie tightly just inside the window.
        - id: ch01-b98
          speaker: nurse
          text: "My lamb! My dear, foolish, brave lamb!"
          emotion: fearful
        - id: ch01-b99
          speaker: narrator
          text: >-
            Dickie steadied himself before he answered.
        - id: ch01-b100
          speaker: dickie
          text: >-
            If this is a dream, I've had enough. I want to wake up. If it's real, with real magic in it, then you must explain every bit of it. I can't keep living like this. It isn't fair.
        - id: ch01-b101
          speaker: soft_voice_1
          text: "Oh, tell him and be done with it."
        - id: ch01-b102
          speaker: narrator
          text: >-
            Something small and white seemed to slip along the wooden wall and vanish as suddenly as a candle flame blown out.
        - id: ch01-b103
          speaker: nurse
          text: "I will. Come with me, love. I will tell you everything."
          emotion: calm
        - id: ch01-b104
          speaker: narrator
          text: >-
            She led him to a warm room hung with curtains, blew the gray hearth ashes into flame, and gave him hot elder wine flavored with spices. Then she knelt before him, rubbed his cold bare feet, and began.
        - id: ch01-b105
          speaker: nurse
          text: >-
            Now and then, a child is born who is not bound by time in the way other people are. It does not happen often, but it does happen. When the right piece of magic comes to such children, they gain the power to travel backward and forward in time. It becomes as possible for them as walking backward and forward through space, across a room, a playing field, or a garden path. Often the power is lost while the child is still very young. Sometimes it arrives little by little, so the child hardly knows when it began. Then it leaves just as gently, like a dream fading when you wake and stretch. Sometimes the gift comes through the speaking of a charm. That was how Edred and Elfrida found theirs. They came from the same age in which you were born. They have been living here in this time with you, and now they have returned to their own. Did you truly notice no difference between them and the cousins you knew at Deptford?
        - id: ch01-b106
          speaker: dickie
          text: >-
            I certainly did. I didn't exactly see a difference, but I felt something strange. Everything seemed close and stuffy, as though it might burst.
        - id: ch01-b107
          speaker: nurse
          text: "That was because they were not your Deptford cousins."
        - id: ch01-b108
          speaker: dickie
          text: >-
            Then where were my real cousins while these two were here pretending to be them?
        - id: ch01-b109
          speaker: nurse
          text: >-
            They were in another place, in the time of Julius Caesar. They do not know it and never will. They have no charm, so to them it will seem like a dream they forgot.
        - id: ch01-b110
          speaker: dickie
          text: "But what about the swans, the flying carriages, the voice, and that jump?"
        - id: ch01-b111
          speaker: nurse
          text: >-
            That was white magic. The white Mouldiwarp of Arden sent the swans.
        - id: ch01-b112
          speaker: narrator
          text: >-
            The nurse told him the story of the white Mouldiwarp of Arden. It was the badge belonging to the house of Arden, and its little image was engraved upon Tinkler. That same white creature had worked all sorts of magic for Edred and Elfrida during their travels. Its work was not finished, either. It would perform still greater wonders for them before their adventures came to an end.
        - id: ch01-b113
          speaker: narrator
          text: >-
            Dickie and the nurse talked beside the replenished fire for most of the night. The story seemed endless. He learned that the Edred and Elfrida from his own age had a father whom everyone believed dead.
        - id: ch01-b114
          speaker: nurse
          text: >-
            I am forbidden to tell them the truth. But you can help them, and you shall.
        - id: ch01-b115
          speaker: dickie
          text: "I'd like to help. But may I see the white Mouldiwarp?"
        - id: ch01-b116
          speaker: nurse
          text: >-
            I dare not call it again tonight. Perhaps another day I can teach you a little spell that will bring it. The creature can be cross, but it is kind and works hard.
        - id: ch01-b117
          speaker: narrator
          text: >-
            Dickie told her how his own magic had begun and how he had heard two voices, including the Mouldiwarp's.
        - id: ch01-b118
          speaker: nurse
          text: >-
            Three white Mouldiwarps serve your house. One is the badge, another the crest, and the Great Mouldiwarp sits on the green-and-white checked field of the Arden shield. The first two were the ones talking about you.
        - id: ch01-b119
          speaker: dickie
          text: "How can I find my cousins and help them find their father?"
        - id: ch01-b120
          speaker: nurse
          text: >-
            Arrange the moon-seeds and the other charms, then wish to go where they are going. You will be able to speak with them. Ask to arrive a week before them, so you can learn the place and its people.
        - id: ch01-b121
          speaker: dickie
          text: "Shall I do it now?"
        - id: ch01-b122
          speaker: narrator
          text: >-
            He did not sound eager. He was very tired.
        - id: ch01-b123
          speaker: nurse
          text: "Not now, my lamb."
          emotion: calm
        - id: ch01-b124
          speaker: narrator
          text: >-
            At last Dickie went to bed with his weary head crowded by truths more dreamlike than any dream.
        - id: ch01-b125
          speaker: narrator
          text: >-
            After that night, Dickie spoke with the nurse every day and learned wonder after wonder. There is not enough time here to tell them all. In time, he left the reign of James the First and traveled farther back, into the days of Henry the Eighth. He shared the merry country life of that age. There he found the old nurse herself, as well as Edred and Elfrida, and helped them recover their father from a faraway country. He encountered the marvel of the white clock and the cliff that no one could climb. He saw children who had become white cats, and a Mouldiwarp that grew as large as a polar bear, along with still more wonders.
        - id: ch01-b126
          speaker: narrator
          text: >-
            When all those adventures were finished, Edred and Elfrida wanted Dickie to return with them to the time where all three had been born. But Dickie would not go. Instead, he returned to the age he loved, when James the First was King. He woke once more inside the little panelled room. Looking back from there, everything that had happened during the other adventure seemed no more substantial than a collection of dreams and fancies.
        - id: ch01-b127
          speaker: narrator
          text: >-
            During the adventure he had met the white Mouldiwarp, which proved to be a funny, rather self-important white mole. He had not yet met the second one. Those wonders never seemed as solid to Dickie as the two lives he had been living.
        - id: ch01-b128
          speaker: nurse
          text: >-
            That is what happens when you wander into someone else's magic. It never feels quite real. Bring other people into your own magic, and it is an entirely different matter. Your cousins have used up their magic, but yours could carry them. To do that, you must meet them in the age where you were born. You will have to wait until summer, because summer is where they are now. In your own time, they are seven months ahead of you.
        - id: ch01-b129
          speaker: narrator
          text: >-
            Dickie was thoroughly confused.
        - id: ch01-b130
          speaker: dickie
          text: "If they're seven months ahead, won't they stay seven months ahead forever?"
        - id: ch01-b131
          speaker: nurse
          text: >-
            Odds bodikins, how many times must I tell you that time does not exist? Seasons do. They left their age in summer, and you will return to autumn. So you must live through seven months in their age. Then summer will come, and you will meet them.
        - id: ch01-b132
          speaker: dickie
          text: "What about Lord Arden in the Tower? Will they cut off his head for treason?"
        - id: ch01-b133
          speaker: nurse
          text: >-
            That belongs to their magic, not yours. Lord Arden will be safe. I have more to tell you, but we must go into your panelled room. Otherwise your tutor may listen, betray us, hand you entirely over to him, and have me burned as a witch.
        - id: ch01-b134
          speaker: narrator
          text: >-
            Those dreadful words silenced Dickie until they were safely inside his room.
        - id: ch01-b135
          speaker: dickie
          text: >-
            Come back to my time with me, Nurse. People don't burn witches there.
        - id: ch01-b136
          speaker: nurse
          text: >-
            No, they do not burn witches there. But they allow people to live such miserable lives in their ugly towns that my life here, with all its dangers, is far better worth living. You know how people live in the Deptford of your time. All the green trees have disappeared, and honest, good work has disappeared with them. People do bad work for wages that barely keep their worn-out bodies and desolate souls together. Sometimes even that fails, and they starve to death. No one here will burn me if you only keep your tongue still. Now listen closely.
        - id: ch01-b137
          speaker: narrator
          text: >-
            She sat on the bed, and Dickie nestled against her stiff bodice.
        - id: ch01-b138
          speaker: nurse
          text: >-
            Edred and Elfrida first traveled into the past because they were looking for treasure. It lies buried in Arden Castle beside the sea, the place they call home. In the age where you were born, that once-splendid castle has fallen into ruin and decay. They want the treasure so they can restore the castle, mend the houses where their tenants live, and help the poor and needy. But now they have spent their own magic bringing back their father, and they cannot use it again to seek the treasure. Your magic will endure. Lay the moon-seeds around your cousins in the old shape. Stand in the middle with them, holding Tinkler and your white seal. Then all three of you will go wherever you choose.
        - id: ch01-b139
          speaker: dickie
          text: "Then I'll choose to go straight to the treasure."
        - id: ch01-b140
          speaker: nurse
          text: >-
            You cannot. You may choose any year in the past, but once you reach it, you must search for the treasure there.
        - id: ch01-b141
          speaker: dickie
          text: "I'll do it. And afterward I may come back to you, mayn't I?"
        - id: ch01-b142
          speaker: nurse
          text: >-
            If you are not needed somewhere else. The Ardens remain where duty holds them and go wherever duty calls.
        - id: ch01-b143
          speaker: dickie
          text: "But in my own time, I'm not an Arden."
          emotion: sad
        - id: ch01-b144
          speaker: nurse
          text: >-
            You are Richard Arden there as well as here. Your grandfather's name changed from Arden to Harden, then from Harden to Harding. Names change in such ways. Dickie of Deptford must uphold the honor of Arden in his own time just as Richard does here.
        - id: ch01-b145
          speaker: dickie
          text: "Then I'll call myself Arden when I go back."
        - id: ch01-b146
          speaker: nurse
          text: "Not yet. You must wait."
        - id: ch01-b147
          speaker: dickie
          text: "If you say so."
        - id: ch01-b148
          speaker: nurse
          text: >-
            The right time has not come for you to claim all your honors there. Now go quickly, dear lamb. Your tutor is already imagining punishments. Set out the moon-seeds, and when you hear the voices, say that you wish to see both Mouldiwarps. Then you will see them.
        - id: ch01-b149
          speaker: dickie
          text: "Thank you. I truly want to meet them both."
        - id: ch01-b150
          speaker: narrator
          text: >-
            And he did see them. The world became a blue-gray mist. Dickie could not feel one solid thing. There was no ground beneath his feet. Even when he clenched his hands, he could not feel his fingers pressing into his palms. Against that gray-blue emptiness stood the two Mouldiwarps. Their white shapes were outlined with perfect clearness.
        - id: ch01-b151
          speaker: narrator
          text: >-
            The Mouldiwarp Dickie had met during his far-country adventure smiled as well as any mole can smile. When it spoke, it used the broad country speech Dickie remembered from the people around Talbot House.
        - id: ch01-b152
          speaker: soft_voice_1
          text: >-
            You're a fine young branch of the old tree, Master Dickie. That you are.
        - id: ch01-b153
          speaker: mouldierwarp
          text: >-
            He is a worthy son of the great house we serve. As Mouldierwarp to the Ardens, I gladly confess that I am proud of him.
        - id: ch01-b154
          speaker: narrator
          text: >-
            The Mouldierwarp had a gentler voice, a finer nose, smoother fur, and sharper claws than the first mole.
        - id: ch01-b155
          speaker: soft_voice_1
          text: >-
            Ah, you're a gentleman, and so is he. Two gentlemen together, sure enough.
        - id: ch01-b156
          speaker: narrator
          text: >-
            It was very odd to watch two white moles talk exactly like real people while their bodies looked like bright figures on the screen of a magic lantern. Yet Dickie did not enjoy the sight as much as you or I might have done. It was not the kind of magic he loved best. He preferred good, straightforward, old-fashioned magic, the sort that lifted him out of one life and set him down in another, while leaving both lives equally real. Even so, good manners still mattered.
        - id: ch01-b157
          speaker: dickie
          text: "I am very glad to see you both."
        - id: ch01-b158
          speaker: soft_voice_1
          text: "Now, those are pretty manners."
        - id: ch01-b159
          speaker: mouldierwarp
          text: "The pleasure belongs to us."
        - id: ch01-b160
          speaker: narrator
          text: >-
            Both old creatures were plainly delighted with him.
        - id: ch01-b161
          speaker: dickie
          text: "When shall I meet the Mouldiwarp shown on our shield?"
        - id: ch01-b162
          speaker: mouldierwarp
          text: >-
            You mean the Mouldiestwarp. You will not meet him until the magic ends. He is very great. I govern the magic of space, and my brother governs the magic of time. The Great Mouldiestwarp rules us and much more besides. Call him only when you mean to end our magics and work a magic greater than either of ours.
        - id: ch01-b163
          speaker: dickie
          text: "What magic could possibly be greater?"
        - id: ch01-b164
          speaker: narrator
          text: >-
            The question pleased both moles immensely.
        - id: ch01-b165
          speaker: mouldierwarp
          text: >-
            He is a worthier Arden than those little black-and-white children of yours.
        - id: ch01-b166
          speaker: soft_voice_1
          text: >-
            And so he should be. Everything is moving toward the best ending. Where do you wish to go, my lord?
        - id: ch01-b167
          speaker: dickie
          text: >-
            I'm not a lord. I'm only Richard Arden. I want to return to Mr. Beale, stay with him for seven months, and then find my cousins.
        - id: ch01-b168
          speaker: soft_voice_1
          text: "Back you go, then. That part is easy."
        - id: ch01-b169
          speaker: mouldierwarp
          text: >-
            For the second part, you need no magic except a steadfast heart and patient purpose. You already possess both, without any gift from us.
        - id: ch01-b170
          speaker: narrator
          text: >-
            The two moles waved their white paws against the blue-gray curtain of mist. In an instant, they were gone. The mist itself changed into the darkness of night slowly yielding to dawn. Once again Dickie could feel solid things around him. The floor held his feet. His hand rested against the sharp edge of an armchair. Beside his knee lay the soft, comfortable, breathing weight of True, fast asleep. Dickie shifted. The dog woke at once and nuzzled its soft nose into his hand.
        - id: ch01-b171
          speaker: dickie
          text: "Now for seven months of work, without one good dream."
        - id: ch01-b172
          speaker: narrator
          text: >-
            He rose, hid Tinkler, the seal, and the moon-seeds in a very safe place, and crept back to bed.
        - id: ch01-b173
          speaker: narrator
          text: >-
            Dickie felt rather heroic, and there was reason for it. He did not want the treasure. It would not belong to him. He was choosing the work so that Edred and Elfrida could find it. He did not want the life waiting at Lavender Terrace either. He was choosing that life so he could help Mr. Beale live it. Let Dickie enjoy his small heroic feeling, then, because a hero was exactly what he was at that moment. Of course, every properly minded child remains modest and understands his own tremendous unimportance, no matter how heroically he happens to behave.
