audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机敏，带着克制的幽默与讲故事的悬念
        timbre: 温暖清亮
        pace: 舒展而有变化
        pitch: 中音
    dickie:
      display_name: 迪基
      tts:
        delivery: 聪明敏感，街头口吻直率，学书中人物说话时郑重夸张
        timbre: 清脆稚嫩
        pace: 稍快，受委屈时断续
        pitch: 中高音
    nurse:
      display_name: 老奶妈
      tts:
        delivery: 慈爱爽朗，照料孩子时坚定又耐心
        timbre: 丰满温暖
        pace: 从容
        pitch: 中低音
    elfrida:
      display_name: 埃尔弗里达
      tts:
        delivery: 聪慧活泼，说秘密时认真又体贴
        timbre: 清亮稚嫩
        pace: 轻快，紧张时急促
        pitch: 高音
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 自信爽快，淘气时带着得意
        timbre: 明亮清脆
        pace: 稍快
        pitch: 中高音
    parados:
      display_name: 帕拉多斯先生
      tts:
        delivery: 阴沉严厉，盘问时步步紧逼
        timbre: 干冷尖刻
        pace: 偏慢
        pitch: 中低音
    mouldy:
      display_name: 徽徽
      tts:
        delivery: 乡音浓重，直率粗朴，略带自得
        timbre: 细哑而滑稽
        pace: 适中
        pitch: 中高音
    mouldier:
      display_name: 冠冠
      tts:
        delivery: 彬彬有礼，吐字讲究，庄重而温和
        timbre: 细柔清晰
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 迪基学到许多事情
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            那天夜里，迪基怎么也睡不着。一个大主意在心里越来越坚定。他要再试一次月光花种子、拨浪鼓和白印章的魔法，回到另一个世界。于是他悄悄溜进客厅，炉膛里还剩薄薄一层清亮的红火。等种子、声音与魔法过去，他睁开眼，先动了动双腿。腿不瘸了，他高兴极了，还以为自己会看见那间宽敞明亮、挂满壁毯的房间。可四周只有深色木板，光线昏暗，地方小得像只柜子。
        - id: ch01-b02
          speaker: narrator
          text: >-
            这比他经历过的任何事都更叫人吃惊，也让他害怕。若那道符咒不能把他送到想去的地方，世上还有什么靠得住？他也许到了最不愿去的地方，甚至变成了最不愿做的人。
        - id: ch01-b03
          speaker: dickie
          text: >-
            我再也不试了。只要能出去，我就老老实实做木雕，再也不往梦和魔法里乱闯。
        - id: ch01-b04
          speaker: narrator
          text: >-
            他站起身，走到一扇窄窗前向外望去。窗外确实有一座花园，却不是他从前见过的任何一座。园中摆着大理石长椅，四周围着一道道石栏。秋天湿冷的露水笼在树木周围，而那些树上的叶子已经差不多落光了。整座花园都浸在深秋清冷而潮湿的空气里。
        - id: ch01-b05
          speaker: dickie
          text: >-
            还不算最坏，也可能是监狱的院子呢。打起精神。不管到了哪里，总算一场冒险。
        - id: ch01-b06
          speaker: narrator
          text: >-
            他转回房里寻找衣服，却一件也没找到。不过身上那件衬衣，正像他在美丽宅子里睡觉时穿的那件。他转身想开门，却根本找不到门。四周全是平整的深色壁板。他不是被关在一间屋里，简直是被装进了一只箱子。可这念头又说不通，箱子里哪会放着床，还会开着窗？就在这时，他忽然不再是那个把一切安排得妥妥当当的聪明人了。他不再是那个能同时过好两种生活，两边都过得体面，还能管着一个大人、叫那大人学好的人。他只是个吓得不轻的小男孩。那件小衬衣是唯一能安慰他的东西，可这点安慰也只够逼出最后一股绝望的勇气。他举起拳头捶打壁板，放声大喊。
        - id: ch01-b07
          speaker: dickie
          text: 老奶妈！老奶妈！老奶妈——！
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: >-
            两块壁板间裂开一道光缝，随即滑向两边。戴着轮状皱领和荷叶边软帽的老奶妈走进来，那张皱纹满面的脸依旧慈祥。迪基一把搂住她温暖宽厚的腰。她胳膊上搭着他的紧身上衣、鼓短裤、长袜和缀花结的鞋。
        - id: ch01-b09
          speaker: nurse
          text: 好啦，好啦，我的小羊羔！
          emotion: calm
        - id: ch01-b10
          speaker: dickie
          text: >-
            啊，我真的在这里。太好了！我还以为自己去了别的地方。
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: >-
            老奶妈坐在床边替他穿衣，一面轻轻哄着他。扣到紧身上衣那些银制尖顶纽扣时，她让迪基仔细听。
        - id: ch01-b12
          speaker: nurse
          text: 你离开这里，已经一个月了。
        - id: ch01-b13
          speaker: dickie
          text: 可我以为时间不会走。我以为……
          emotion: surprised
        - id: ch01-b14
          speaker: nurse
          text: >-
            是那些钱把一切搅乱了，钱总会把事情搅乱，我早该想到。没人知道你离开过。别人眼里，你一直照常读书、玩耍。如今你在叔父的伦敦宅邸做客，和表兄妹一起跟你的家庭教师上课。他们也不喜欢他。忘掉那个梦，接着过这里的日子。这一两天少说话，等你重新熟悉自己的身份。今天你要单独上课。一个表亲陪母亲去怀特霍尔参加国王的宴会，替她提裙裾；另一个得留下绣花样，因为她母亲说她野得太久了。
        - id: ch01-b15
          speaker: narrator
          text: >-
            迪基只好单独跟可恨的家庭教师上课。早晨的恐慌一过去，他忽然轻松了，精神也好得过了头。结果这股精神全用在淘气上，而且对迪基来说，已经算淘气到极点。他画了一幅教师的滑稽像。说真的，画像还挺像，嘴里伸出一卷纸，上面写着：“我长得丑，也不必惹人讨厌呀！”偏偏帕拉多斯先生有个坏习惯，总爱悄无声息地摸到别人背后，这次正赶上最糟的时机。迪基两只手都挨了藤条，还被罚不准出去。午饭只给面包和水，另外还得抄两百遍：“我是个坏孩子，请求善良的家庭教师原谅。一六〇八年十一月五日。”因此，他没能看见姨母和表亲穿着去怀特霍尔的华服。直到下午很晚，他才见到另一个一直绣花样的表亲。迪基敢肯定，若不是惦记着她，想再见到她，他绝不会乖乖抄完。她毕竟是他唯一的小姑娘朋友。
        - id: ch01-b16
          speaker: narrator
          text: >-
            最后一遍写完，他冲进表妹的房间，惊讶地发现自己很熟悉宅中的道路，尽管根本不记得来过。
        - id: ch01-b17
          speaker: dickie
          text: >-
            你的功课完了吗？我的也完了。老鹦鹉鼻逼着我一直写，可我想着你，这一回他说什么我都照办。现在咱们自由啦，走，到花园里玩球！
        - id: ch01-b18
          speaker: narrator
          text: 埃尔弗里达放下绣架，一跃而起。
        - id: ch01-b19
          speaker: elfrida
          text: 太好啦，我真恨死这讨厌的花样了！
        - id: ch01-b20
          speaker: narrator
          text: >-
            迪基心里猛地一动，像钟刚敲响又突然停住，四周一下有了变化。可表妹正等着，他来不及细想。
        - id: ch01-b21
          speaker: dickie
          text: 走吧，埃尔弗里达。
        - id: ch01-b22
          speaker: narrator
          text: >-
            他们牵着手，一起去了花园。若你读过一本名叫《阿登庄园》的书，早就知道迪基的表兄妹叫埃德雷德和埃尔弗里达。他们的父亲阿登勋爵不但在海边有一座美丽的城堡，在伦敦也有一座宅邸。他和妻子都是詹姆斯一世宫廷里的红人。你若没有读过那本书，先前不知道这些，也不要紧，现在你已经知道了。在这段古老的生活里，迪基自己的姓氏也是阿登。他的父亲是德特福德与艾尔斯伯里的理查德·阿登爵士。至于家庭教师，他叫帕拉多斯先生。那些不大尊敬他的学生为了“简便”，全都管他叫鹦鹉鼻。
        - id: ch01-b23
          speaker: narrator
          text: >-
            迪基和埃尔弗里达先玩球，又玩捉迷藏，随后比赛赛跑。眼下他一心只想玩，不愿意说话，因为他绝不能泄露自己对过去一个月发生的事毫无记忆。埃尔弗里达似乎也不大想聊天。花园本身有趣极了，处处值得看，唯一煞风景的，是家庭教师那道黑乎乎的身影。他板着一张酸脸来回踱步，两只拇指插在一本光看模样就乏味透顶的书里。两个孩子后来在一张石椅的台阶上坐下。迪基还在反复琢磨，埃尔弗里达方才说话时，那种仿佛钟声忽然停住的感觉究竟从何而来。就在这时，她开口念起一首歌谣。
        - id: ch01-b24
          speaker: elfrida
          text: >-
            请你牢牢记心间，十一月五日这一天。火药叛乱与阴谋，没有半点好缘由，能叫火药叛乱案，从此被人忘一边。
        - id: ch01-b25
          speaker: narrator
          text: >-
            迪基很奇怪，没想到这歌已经这么古老。他记起父亲说过，如今把“叛乱”挂在嘴上很危险。
        - id: ch01-b26
          speaker: dickie
          text: 表妹，这歌既不快活，也不安全。最好别唱什么叛乱。
        - id: ch01-b27
          speaker: elfrida
          text: 可阴谋又没成功，而且最后总要把他烧掉呀。
        - id: ch01-b28
          speaker: narrator
          text: >-
            原来在那个年代，人们已经会焚烧盖伊·福克斯的草人了。迪基心想，不知道今晚会不会也点起一堆篝火。今天确实是十一月五日，这个日期他刚刚抄过两百遍，绝不会弄错。他既怕自己说得太多，又怕说得太少。偏偏无论怎样用力回想，他也记不起火药阴谋究竟发生在哪一年。不过他总得说点什么，不能一直沉默下去。
        - id: ch01-b29
          speaker: dickie
          text: 后面还有吗？
        - id: ch01-b30
          speaker: elfrida
          text: 没有了。
        - id: ch01-b31
          speaker: dickie
          text: 那这首歌说的是哪一桩叛乱？
        - id: ch01-b32
          speaker: elfrida
          text: >-
            你不知道吗？我知道。我还知道好几个谋反者的名字，知道他们要杀谁，什么都知道。
          emotion: surprised
        - id: ch01-b33
          speaker: dickie
          text: 那就说给我听听。
        - id: ch01-b34
          speaker: elfrida
          text: >-
            国王对天主教徒不公平，所以他们当中有一大群人决定杀掉国王，还要炸掉议会大厦。他们定了一个阴谋，好多人都掺和进去了。他们还说阿登勋爵也有份，其实他没有。有些人要装作打猎，抓住伊丽莎白公主，宣布她做女王；其余的人等国王主持议会开幕，就把议会大厦炸掉。
        - id: ch01-b35
          speaker: narrator
          text: >-
            那种钟声突然停住的感觉又来了。埃尔弗里达不知哪里变得不一样了。曾经同迪基坐驳船去格雷夫森德，又在德特福德宅子里陪他玩耍的埃尔弗里达，绝不会说出“好多人都掺和进去了”这种话。他抬眼看着她，她却若无其事地继续讲。迪基越听越不安。他自己也说不清为什么不安，只因那份不安压在心头，才勉强笑了一声。
        - id: ch01-b36
          speaker: dickie
          text: 家庭教师从没讲过这个故事。表妹，请继续吧。
        - id: ch01-b37
          speaker: narrator
          text: >-
            埃尔弗里达继续讲，迪基却几乎没听进去。只听见她说，特里舍姆先生写信告诉亲戚蒙蒂格尔勋爵，他们要炸死国王。迪基明知答案，还是问了出来。
        - id: ch01-b38
          speaker: dickie
          text: 哪位国王？
        - id: ch01-b39
          speaker: elfrida
          text: 当然是詹姆斯一世呀。
        - id: ch01-b40
          speaker: narrator
          text: >-
            可恶的帕拉多斯先生突然扑了过来，一把攥住埃尔弗里达的手腕。转眼之间，一切都乱了。家庭教师连珠炮似的追问，小埃尔弗里达则竭力回答。迪基从这片混乱中终于明白，火药阴谋根本还没有发生，埃尔弗里达却已经把整件事全泄露了出去。可是她怎么会知道尚未发生的事？她刚才念的那首歌，又究竟是从哪里学来的？
        - id: ch01-b41
          speaker: parados
          text: 把一切说出来。每一个名字，每一处细节。否则你和你父亲都不会有好下场。
          emotion: angry
        - id: ch01-b42
          speaker: narrator
          text: 埃尔弗里达吓得脸都发青了，求助似的望着迪基。
        - id: ch01-b43
          speaker: dickie
          text: >-
            先生，够了。你吓着我表妹了。她不过讲了个故事。她向来快活，满脑子新鲜编法。
        - id: ch01-b44
          speaker: narrator
          text: 帕拉多斯仍不肯住口，迪基听见埃尔弗里达又说了一句。
        - id: ch01-b45
          speaker: elfrida
          text: 历史书上就是这么写的。
        - id: ch01-b46
          speaker: narrator
          text: >-
            接下来的事，全笼在一片可怕的迷雾里。等迷雾终于散开，迪基才发现，宅子里只剩下自己、帕拉多斯先生、老奶妈和仆人。阿登伯爵夫妇、埃德雷德与埃尔弗里达，全都被控叛国，关进了伦敦塔。原来这天正是十一月五日，也就是火药阴谋本该实施的日子。把整件事泄露出去的人不再是蒙蒂格尔勋爵的表弟特里舍姆先生，反而成了埃尔弗里达。她究竟怎么会知道？难道她也像迪基一样做梦，在梦里去过后来的时代，看见这一切早已成为历史？他的脑子又沉又胀，仿佛随时会撑破。这时他甚至很愿意上床睡觉，哪怕那张床放在镶木板的柜子似的小地方里也行。他只央求老奶妈把壁板敞着，千万别合上。
        - id: ch01-b47
          speaker: narrator
          text: >-
            第二天醒来，一切仍是真的。姨父、姨母和两个表兄妹全都在伦敦塔里。愁云笼罩着苏豪区的阿登宅邸，仿佛一片黑压压的雷雨云罩在山头。日子一天天过去，帕拉多斯先生的课对迪基来说，简直成了宗教裁判所的酷刑。家庭教师没有一天不设法盘问他，想弄清他是否也知道一点埃尔弗里达那份有罪的先见。照帕拉多斯先生的说法，正是那番先见之明推翻了天主教徒的邪恶阴谋，为忠诚的百姓保全了仁慈无比的詹姆斯一世陛下。
        - id: ch01-b48
          speaker: narrator
          text: >-
            后来有一天，埃德雷德与阿登夫人忽然从伦敦塔获释回家，仿佛这件事再自然不过。国王突然认定，至少他们两人同阴谋没有关系。阿登夫人一直哭个不停，迪基在心里承认，她实在有足够的理由哭。埃德雷德却满脑子都是没想周全的计划，一心要报复老鹦鹉鼻。到最后，他竟真的安排出一套营救埃尔弗里达的办法。这套办法完全行得通，而且果真成功了。你若想知道具体怎么办，可以请一位大人讲讲尼斯代尔夫人怎样从伦敦塔救出丈夫。当时她的丈夫被关在那里，眼看就要被砍头。听过那故事，你便很容易懂了。这项计划必不可少的一步，是让埃尔弗里达换上男装，假扮成埃德雷德走出伦敦塔。真的埃德雷德此前已经同理查德一起进去探望阿登勋爵。等塔门口的卫兵换了班，另一个埃德雷德也走了出来。大家一起登上马车，埃尔弗里达藏在车座底下，挤在稻草和众人的脚中间。马车颠过积雪的街道，驶向苏豪区的阿登宅邸。黑暗的车厢里，大家紧紧拥抱在一起。
        - id: ch01-b49
          speaker: narrator
          text: >-
            卷进这些危险事情，迪基又渺小又迷糊。老奶妈忽然抓住他的胳膊。
        - id: ch01-b50
          speaker: nurse
          text: 理查德少爷该去脱下这套漂亮衣裳，然后……
        - id: ch01-b51
          speaker: narrator
          text: >-
            后半句话迪基根本没听见，因为人已经被推出房门。他满心不情愿地找到那间镶木板的睡眠小间，脱下探访伦敦塔时穿的华丽天鹅绒与毛皮衣裳，重新换上日常穿的东西。你尽可以相信，他用最快的速度赶回表兄妹身边。他迫不及待地想同他们好好谈谈这场惊险又奇妙的冒险，却发现两个人正躲在角落里，神神秘秘地说着悄悄话。
        - id: ch01-b52
          speaker: dickie
          text: 什么事？
        - id: ch01-b53
          speaker: edred
          text: >-
            我们要报复老鹦鹉鼻，可你不能参加。我们就要走了，你却得留下。不管我们做什么，最后挨罚的都会是你。
        - id: ch01-b54
          speaker: dickie
          text: >-
            我惦记了四年的事，为什么自己不能插手？
        - id: ch01-b55
          speaker: narrator
          text: >-
            迪基原先根本不知道自己认识家庭教师已有四年，可话一出口，便感觉那是真的。
        - id: ch01-b56
          speaker: edred
          text: 自然有原因。你去睡吧，理查德。
        - id: ch01-b57
          speaker: dickie
          text: 我才不去。
        - id: ch01-b58
          speaker: elfrida
          text: 我们要是把真相告诉你，你不会相信的。
        - id: ch01-b59
          speaker: dickie
          text: 你们至少可以试试看。至少应该试一试。
        - id: ch01-b60
          speaker: elfrida
          text: >-
            好，我来说。埃德雷德，他有权知道。他跟我们是一家人，不会出卖我们。你不会的，对吧，亲爱的迪基？
        - id: ch01-b61
          speaker: dickie
          text: 你知道我不会。
        - id: ch01-b62
          speaker: elfrida
          text: >-
            那么，我们是……你得用心听，再用两只手和全身力气去相信，不然一点也信不了。埃德雷德和我并不是看起来的那两个人，我们根本不属于这里。我也不知道真正属于这个时代的埃尔弗里达和埃德雷德去了哪里。你从没觉得我们古怪吗？跟你熟悉的那两个人不一样？
        - id: ch01-b63
          speaker: narrator
          text: 迪基又强烈地感觉钟声停住了。他点点头。
        - id: ch01-b64
          speaker: elfrida
          text: >-
            因为我们不是他们。我们来自三百年后。在我们的时代，埃德雷德是阿登勋爵，还有一只白鼹鼠帮助我们。有一道魔法能让我们去历史上的任何时代。
        - id: ch01-b65
          speaker: edred
          text: 也不是什么时代都行。
        - id: ch01-b66
          speaker: elfrida
          text: >-
            对，不是。不过那里有装着不同时代衣服的箱子，穿上哪套，就会来到哪段历史。我知道这听着像一堆傻谎话，也知道你不会信，可它是真的。现在我们要回自己的时代，那里有亚历山德拉王后、爱德华七世、电灯、汽车，还有一九〇八年。若相信这件事让你难受，就别勉强。它怪得不得了，可它就是千真万确的真话。
        - id: ch01-b67
          speaker: narrator
          text: >-
            理查德没有说话。他从未想过，除自己以外还有人会遇见这种事。
        - id: ch01-b68
          speaker: edred
          text: 你不相信。我就知道你不会。
        - id: ch01-b69
          speaker: narrator
          text: >-
            迪基一阵眩晕。这种奇妙转变不可能也发生在别人身上，只能说明整件事都是一场梦。
        - id: ch01-b70
          speaker: elfrida
          text: >-
            不要紧，别逼自己相信。我知道你做不到。忘了它吧，或者只当我们在逗你。
          emotion: calm
        - id: ch01-b71
          speaker: edred
          text: 反正不要紧。咱们怎么收拾老鹦鹉鼻？
        - id: ch01-b72
          speaker: dickie
          text: >-
            我不喜欢这样。以前从来不是这样的。现在一切都不真实了。我想，归根到底，这只是一场梦。可我本来已经相信它确实是真的。
        - id: ch01-b73
          speaker: narrator
          text: >-
            埃德雷德说自己一句也听不懂，接着冲到角落，拿出一架名叫“布朗尼”的照相机。
        - id: ch01-b74
          speaker: edred
          text: 你以前绝没见过这个。它是从我们的时代带来的。
        - id: ch01-b75
          speaker: narrator
          text: >-
            理查德却把那东西认得清清楚楚。学校里有个男孩就有一架，他还曾经借来用过一次。助理教师也有一架同样式样、只是更大的。迪基出生在那个丑陋的时代，那里引以为豪的科学成就，如今竟这样硬生生闯进他渐渐爱上的美丽年代。看着眼前的照相机，他只觉得这场侵入可怕极了。
        - id: ch01-b76
          speaker: dickie
          text: >-
            得了，收起来吧。现在我知道全是场傻梦了。可看见柯达还装不认识，也没意思。那是一架布朗尼。
        - id: ch01-b77
          speaker: elfrida
          text: 那你梦见过喷火的车、喷火的船，还有……
        - id: ch01-b78
          speaker: narrator
          text: >-
            理查德说自己又不是婴儿，铁路、蒸汽船和文明的种种胜利，他全知道；还说上星期四肯特队对德比郡队得了六百一十五分。两个孩子立刻追问，可迪基满脑子是自己的疑问，无心作答。
        - id: ch01-b79
          speaker: dickie
          text: >-
            我什么也不再告诉你们。不过我会帮你们报复老鹦鹉鼻。咱们把屋顶的雪铲下来，从他房里的天窗倒进去。
        - id: ch01-b80
          speaker: narrator
          text: >-
            埃德雷德坚持要他写下肯特队和德比郡队的板球比分，这样回到自己的时代以后，就能查一查他说的是不是真话。迪基在紧身上衣里摸到一张纸，正好可以写。原来那是一张账单。比尔先生曾在伦敦替他买过三门船炮、一个罗盘和六面旗子，用来装备他替那位和气的当铺老板的小儿子订造的小船，账单开的就是这些东西。迪基摆出月光花种子的魔法图形时，手里恰好拿着它，不知怎么，它也跟着穿过时间来到了这里。他在账单背面匆匆写下比分，交给埃德雷德。接着三个孩子一同登上屋顶，把积雪铲进帕拉多斯先生的房间。那间屋恰好开着天窗，实在方便得很。家庭教师很快怒气冲冲地追到屋顶，三个孩子立刻绕过一排烟囱，从活板门溜了下去。他们把帕拉多斯独自留在屋顶的雪地里，关上活板门，还牢牢扣紧了搭钩。
        - id: ch01-b81
          speaker: narrator
          text: >-
            后来老奶妈抓住了他们，命理查德上床睡觉，他却根本没去。那一夜，整座宅子里没有睡眠，浓雾一样的困意倒塞满了每一处。迪基吹灭灯芯草蜡烛，先安安静静待了一会儿。可没过多久，他就觉得自己再也坐不住了。于是他极轻、极小心地溜出房间，藏在走廊尽头的一只高柜后面。他感觉宅子里正在发生怪事，而自己一定得弄清那是什么。过了一会儿，楼下传来人声，一点点沿楼梯上来。有老奶妈的声音，有两个表兄妹的声音，还有另一个声音。那个声音究竟在哪里听过？钟声忽然停住的感觉沉沉压住他，他终于认了出来。第一次施展魔法的夜里，他曾听过这个声音。它说的是：“他属于你，比属于我更多。”
        - id: ch01-b82
          speaker: narrator
          text: >-
            老奶妈提着的灯闪了一下，随即消失在第二段楼梯上方。迪基跟了上去。他非跟不可，不能被撇在这件事外面，因为这是降临在他身上的所有奇遇中最神秘的一件。来到楼上平台，他看见其他人全站在窗边，窗户敞开着。凛冽的风猛灌进来，烛火被吹得摇摆不定。借着那点忽明忽暗的光，他看见雪花穿过嵌满星星的黑色窗口，一阵阵卷进屋内。大家正在低声交谈。
        - id: ch01-b83
          speaker: nurse
          text: 到这儿来。对。跳！
        - id: ch01-b84
          speaker: narrator
          text: >-
            一个小小的身影爬上窗台。起先迪基以为是埃德雷德，随即看出是埃尔弗里达。她毫不含糊地从三楼跳了出去，接着埃德雷德也跳了。
        - id: ch01-b85
          speaker: dickie
          text: >-
            果然是梦。可他们若是因为收拾老鹦鹉鼻，或为了别的什么，被逼着跳窗受罚，那我也跳。
        - id: ch01-b86
          speaker: narrator
          text: >-
            他一下冲过老奶妈，也冲过她同另一个声音交谈的地方，纵身跃到窗前。他把膝盖抵上冰冷的窗台，撑起身体站了起来，毫不犹豫地跳出去。就在膝盖碰到结冰窗台的那一刻，他听见那个陌生的声音说：“又来一个。”接着，他便落进了空中。不停地落，不停地往下坠。
        - id: ch01-b87
          speaker: dickie
          text: >-
            落到地面时我就会醒。那时我便知道，这全是一场傻梦。
        - id: ch01-b88
          speaker: narrator
          text: >-
            可他始终没有落到地面。下坠还不到两码，一团柔软的东西便托住了他，摸起来像堆起的羽毛，也像被风吹积的雪。那东西在身下移动、变换，渐渐有了形状。起先像一把椅子，不，原来是一辆马车。他手里竟握着缰绳，而且是雪白的缰绳。前面拉车的是匹马吗？也不是。那是一只展开宽阔白翼的天鹅。迪基抓紧缰绳，驾着这头奇异的坐骑低低俯冲，朝街上大门外明亮的火把飞去。天鹅伸长脖子向下滑翔时，他看见表兄妹坐着一辆同样的马车升上天空，朝南方航去。他原本没想做什么，手上却扯了一下缰绳，天鹅立刻向上飞升。他又拉了一下，马车便稳稳停在楼梯平台的窗口。
        - id: ch01-b89
          speaker: narrator
          text: >-
            一双手从窗口伸来，把迪基用力拽了进去。那是老奶妈的双手。白天鹅拖着马车，从纷飞的白雪与满天星光之间无声滑走。楼梯平台上，敞开的窗户里面，老奶妈把刚刚从空中回来的迪基紧紧搂在怀里，仿佛再也不肯放开。
        - id: ch01-b90
          speaker: nurse
          text: 我的小羊羔！我亲爱的、傻乎乎的、勇敢的小羊羔！
        - id: ch01-b91
          speaker: narrator
          text: 迪基竭力定下神来。
        - id: ch01-b92
          speaker: dickie
          text: >-
            如果这是梦，我已经受够了，我想醒过来。如果这是真的，真的有魔法，你就得把一切解释给我听，一点不漏。我不能再这样下去，这不公平。
        - id: ch01-b93
          speaker: mouldy
          text: 哎，把真相告诉他，赶紧了结吧。
        - id: ch01-b94
          speaker: narrator
          text: >-
            迪基仿佛看见一个白色小东西沿护墙板滑过，像被吹灭的烛火一样突然消失。
        - id: ch01-b95
          speaker: nurse
          text: 我会说的。来吧，心肝，我会把一切都告诉你。
        - id: ch01-b96
          speaker: narrator
          text: >-
            她带着迪基下楼，走进一间温暖、四周挂着帷幔的屋子。敞开的壁炉里只余灰烬，她俯身吹了几口，火苗便重新亮起来。她又倒来热腾腾、加过香料的接骨木果酒，让迪基喝下去。随后，老奶妈跪在他面前，一面用双手揉着他冰冷的赤脚，一面把藏了许久的真相慢慢讲给他听。
        - id: ch01-b97
          speaker: nurse
          text: >-
            世上偶尔会生出某些孩子。这种事并不常见，可有时候确实会发生。他们不像其他人那样受时间束缚。若恰当的一点魔法来到身边，这些孩子就能在时间里来回穿行，正像别的孩子可以在空间里来回走动一样。他们能从房间这头走到那头，从运动场一边跑到另一边，也能沿着花园小径来来回回。很多孩子还很小，就失去了这种能力。有时候，能力慢慢来到他们身上，他们几乎觉察不到它从哪一天开始。离开时也一样缓慢，像一个人从梦中醒来，伸了伸懒腰，梦也随之散了。有时候，只要念出一道咒语，就能把这种力量唤来。埃德雷德和埃尔弗里达正是这样发现它的。他们来自你出生的那个时代，却来到这里同你一起生活。现在，他们又回到自己的时代去了。你难道没有发现他们跟从前不一样吗？我是说，跟他们在德特福德时相比？
        - id: ch01-b98
          speaker: dickie
          text: >-
            我当然发现了。不过不是看出了什么，更像是感觉到一种怪异。我不明白，只觉得闷得慌，好像什么东西快胀破了。
        - id: ch01-b99
          speaker: nurse
          text: 因为他们不是你在德特福德认识的那对表兄妹。
        - id: ch01-b100
          speaker: dickie
          text: >-
            那么真正的表兄妹这段时间去了哪里？另外两个孩子一直在这里冒充他们呀。
        - id: ch01-b101
          speaker: nurse
          text: >-
            他们去了别处，准确说，是尤利乌斯·恺撒的时代。不过他们不知道，也永远不会知道，因为他们没有咒语。对他们来说，这只像一场忘掉的梦。
        - id: ch01-b102
          speaker: dickie
          text: 可是天鹅、马车、那个声音，还有从窗户往外跳呢？
        - id: ch01-b103
          speaker: nurse
          text: 天鹅是白魔法。全是阿登家的白莫尔迪沃普做的。
        - id: ch01-b104
          speaker: narrator
          text: >-
            老奶妈把阿登家的白莫尔迪沃普从头讲给迪基听。它是阿登家族的徽记，叮当儿上便刻着它的图样。它已经为埃德雷德和埃尔弗里达施展过种种魔法，将来还会做更多。迪基和老奶妈守着不断添柴的炉火，谈了大半夜，故事仿佛永远讲不完。他还知道，属于他那个时代的埃德雷德与埃尔弗里达有一位父亲，人人都以为那个人已经死了。
        - id: ch01-b105
          speaker: nurse
          text: 我不能把真相告诉他们，可你能帮助他们，也一定要帮。
        - id: ch01-b106
          speaker: dickie
          text: 我很愿意。可是我不能见见白莫尔迪沃普吗？
        - id: ch01-b107
          speaker: nurse
          text: >-
            我不敢，今晚连我也不敢再召唤它。不过改天我也许会教你一道小咒语。那小家伙有时脾气坏，可心地善良，也很勤快。
        - id: ch01-b108
          speaker: narrator
          text: >-
            迪基说起最初的魔法，还说自己听见过两个声音，其中一个就是莫尔迪沃普。
        - id: ch01-b109
          speaker: nurse
          text: >-
            有三只白莫尔迪沃普是你们家的朋友。一只是家族徽记上的，一只是冠饰上的，还有一只伟大的莫尔迪沃普，坐在阿登家族盾徽绿白相间的方格底纹上。那天谈论你的，就是前两只。
        - id: ch01-b110
          speaker: dickie
          text: 我要怎样找到表兄妹，帮助他们寻找父亲？
        - id: ch01-b111
          speaker: nurse
          text: >-
            摆好月光花种子和其他法物，一心想着他们要去的地方。这样你就能同他们说话。许愿早他们一个星期到那里，好让你先熟悉地方和人。
        - id: ch01-b112
          speaker: dickie
          text: 现在吗？
        - id: ch01-b113
          speaker: narrator
          text: 迪基问得并不热切，他实在太累了。
        - id: ch01-b114
          speaker: nurse
          text: 不是现在，我的小羊羔。
        - id: ch01-b115
          speaker: narrator
          text: >-
            迪基终于上床睡觉，疲倦的脑袋里塞满了新鲜事物，比他做过的任何梦还像梦。从此以后，他每天都同老奶妈谈话，知道的奇事越来越多。如今我没有时间把它们一一讲给你听，不过那些故事全写在《阿登庄园》里。书中说，迪基怎样从詹姆斯一世的时代回到亨利八世时期，参与当年快乐的乡村生活；又怎样在那里找到老奶妈本人、埃德雷德和埃尔弗里达，帮助他们从遥远国度救回父亲。书里还写着白钟的奇迹、无人能够攀上的峭壁、变成白猫的孩子、长得像北极熊一样大的莫尔迪沃普，以及许多别的奇事。等一切结束，埃尔弗里达和埃德雷德希望迪基同他们一起回到自己的时代，他却不肯。他反而回到自己所爱的年代，那时詹姆斯一世还是国王。等他在镶木板的小房间里醒来，刚才的一切全像梦与幻想。
        - id: ch01-b116
          speaker: narrator
          text: >-
            在那场冒险中，迪基见到了白莫尔迪沃普。原来它不过是一只白鼹鼠，模样十分滑稽，性子又颇有些自命不凡。至于第二只莫尔迪沃普，那时他还没有见过。我之所以把这一大串事情讲得如此简略，是因为它们在迪基心里太像一场梦。跟他一直过着的那种双重生活相比，这些奇遇一点也不显得真实。
        - id: ch01-b117
          speaker: nurse
          text: >-
            事情总是这样。你若是不小心跌进别人的魔法，它给你的感觉就永远不够真实。可要是由你把别人带进自己的魔法，那就是完全不同的两回事了。那两个孩子如今再也不能施展自己的魔法，可你却能够把他们带进你的魔法里。只是要做到这一点，你得在自己出生的那个时代同他们见面，而且必须等到夏天，因为他们现在正停留在那个季节。在你自己的时代里，他们比你向前走了整整七个月。
        - id: ch01-b118
          speaker: dickie
          text: 可他们若领先七个月，不就永远都会领先七个月吗？
        - id: ch01-b119
          speaker: narrator
          text: 迪基听糊涂了，我也一样，恐怕你也免不了。
        - id: ch01-b120
          speaker: nurse
          text: >-
            老天在上，我要告诉你多少遍，世上根本没有时间这种东西？可季节是有的。他们离开时是夏天，你回去时却是秋天。所以你非得在他们的时代过完七个月。等夏天到了，你便能遇见他们。
        - id: ch01-b121
          speaker: dickie
          text: 那伦敦塔里的阿登勋爵怎么办？他会因为叛国罪被砍头吗？
        - id: ch01-b122
          speaker: nurse
          text: >-
            那是他们的魔法里发生的事，不在你的魔法中。阿登勋爵安全得很。我还有更多话要说，可咱们得到你的镶板小房间去，免得家庭教师偷听后出卖我们，把你完全交给他处置，再把我当女巫烧死。
        - id: ch01-b123
          speaker: narrator
          text: 这些可怕的话让迪基一路沉默。等安全回到房里，他才开口。
        - id: ch01-b124
          speaker: dickie
          text: 跟我去我的时代吧，老奶妈。那里不会把人当女巫烧死。
        - id: ch01-b125
          speaker: nurse
          text: >-
            是不会，可他们让人在丑陋的城镇里过那样的日子。跟那种日子相比，我宁愿留在这里，冒尽所有风险。你知道你那个时代的人在德特福德怎样生活。青翠的树木全都不见了，能叫人自豪的好手艺也没有了。人们只好做着粗劣的活儿，挣到的钱勉强够维系磨损疲惫的身体，勉强拢住荒凉的灵魂。有些时候，他们甚至会活活饿死。至于我，只要你管住自己的舌头，他们便不会把我烧死。现在仔细听好。
        - id: ch01-b126
          speaker: narrator
          text: 老奶妈坐在床沿，迪基依偎到她硬挺的胸衣旁。
        - id: ch01-b127
          speaker: nurse
          text: >-
            埃德雷德和埃尔弗里达最初回到过去，是为了寻找一份宝藏。那宝藏埋在海边的阿登城堡里，而那座城堡正是他们的家。他们想用宝藏恢复古堡往日的荣光。在你的时代里，城堡已经破败荒凉。他们还想修好佃户们的房屋，帮助贫穷的人与需要救济的人。可你也知道，他们已经用自己的魔法找回父亲，因此不能再靠它寻找宝藏。你的魔法却依然有效。只要你按照原来的形状，把月光花种子摆在他们周围，再同他们一起站在图形中央，手里拿着叮当儿和白印章，你们无论想去哪里，都会一起去到那里。
        - id: ch01-b128
          speaker: dickie
          text: 那我当然直接去宝藏那里。
        - id: ch01-b129
          speaker: narrator
          text: 讲求实际的迪基晃了晃穿花结鞋的双脚。
        - id: ch01-b130
          speaker: nurse
          text: >-
            那可不行。你只能挑选过去的某一年，哪一年都可以。先去到那里，再在那个时间寻找宝藏。
        - id: ch01-b131
          speaker: dickie
          text: 我会去的。然后还可以回到你身边，对不对？
        - id: ch01-b132
          speaker: nurse
          text: >-
            只要别处不需要你。阿登家的人总要留在职责所在之处，也要去往职责召唤之地。
        - id: ch01-b133
          speaker: dickie
          text: 可我在那里不姓阿登。
          emotion: sad
        - id: ch01-b134
          speaker: nurse
          text: >-
            你在那里也同这里一样，是理查德·阿登。你祖父的姓叫人重重喘了一口气，便从阿登变成哈登，又从哈登变成哈丁。姓名总会这样改变。德特福德的迪基，无论在那里还是这里，从前还是现在，都得维护阿登家族的荣誉。
        - id: ch01-b135
          speaker: dickie
          text: 我回去以后，就说自己姓阿登。
          emotion: happy
        - id: ch01-b136
          speaker: nurse
          text: 还不到时候。等一等。
        - id: ch01-b137
          speaker: dickie
          text: 既然你这么说。
        - id: ch01-b138
          speaker: narrator
          text: 迪基答应得很不情愿。
        - id: ch01-b139
          speaker: nurse
          text: >-
            你在那里承继全部荣誉的时机还没成熟。现在，你的家庭教师正在琢磨怎么刁难你，快走吧。摆好月光花种子，听见那些声音时，就说“我要见两只莫尔迪沃普”，这样你便能同时见到它们。
        - id: ch01-b140
          speaker: dickie
          text: 谢谢你。我确实想见见它们两个。
        - id: ch01-b141
          speaker: narrator
          text: >-
            他果然见到了两只莫尔迪沃普。四周是一片蓝灰色的雾，里面没有任何坚实的触感。脚下仿佛没有地面，就连他攥紧手指时，指尖抵住掌心的感觉也消失了。两只莫尔迪沃普白得耀眼，轮廓在灰蓝雾气中清清楚楚。迪基在遥远国度那场奇妙冒险里见过的那一只，露出一副鼹鼠所能露出的最好笑容。它说话带着塔尔博特宅邸附近乡下人的浓重口音，迪基从前曾在那里做过一个小窃贼。
        - id: ch01-b142
          speaker: mouldy
          text: 迪基少爷，你是老树上长出来的一根好枝条，确实是哩。
        - id: ch01-b143
          speaker: mouldier
          text: >-
            他的确无愧于我们侍奉的伟大家族，是一位出色的后裔。身为阿登家的冠饰莫尔迪沃普，我只能承认，我为他骄傲。
        - id: ch01-b144
          speaker: narrator
          text: >-
            冠饰莫尔迪沃普不但嗓音斯文，鼻子也更秀气，毛更平整，爪子更尖利。
        - id: ch01-b145
          speaker: mouldy
          text: 嗨，你是位绅士，你是。他也是。这下确确实实有两位绅士啦。
        - id: ch01-b146
          speaker: narrator
          text: >-
            看着这些白鼹鼠像真人一样开口说话，模样却像魔灯银幕上的影子，实在古怪得很。可迪基并没有像你我也许会觉得的那样喜欢。他不中意这种魔法，这不是他偏爱的那一种。他喜欢自己早已习惯的、干脆利落的老式魔法。那种魔法会直接把人从一种生活带进另一种生活，又让两种生活同样真实。尽管如此，人无论在什么时候都得有礼貌，于是他规规矩矩地回答。
        - id: ch01-b147
          speaker: dickie
          text: 见到二位，我非常高兴。
        - id: ch01-b148
          speaker: mouldy
          text: 多俊的礼数。
        - id: ch01-b149
          speaker: mouldier
          text: 这份荣幸属于我们。
        - id: ch01-b150
          speaker: narrator
          text: 两个古老的小家伙显然都对他满意极了。迪基只好继续谈话。
        - id: ch01-b151
          speaker: dickie
          text: 我什么时候能见到盾徽上的另一只莫尔迪沃普？
        - id: ch01-b152
          speaker: mouldier
          text: >-
            你说至尊莫尔迪沃普吗？直到魔法结束，你才会见到它。它十分伟大。我掌管空间的魔法，我这位兄弟掌管时间；至尊莫尔迪沃普统御我们，还掌管许多别的事。只有当你想结束我们的魔法，施展一种比我们的魔法更伟大的魔法时，才能召唤它。
        - id: ch01-b153
          speaker: dickie
          text: 什么魔法会比这些更伟大？
        - id: ch01-b154
          speaker: narrator
          text: 两个小家伙听了都很高兴。为了简便，我们从此管冠饰莫尔迪沃普叫冠冠，另一只叫徽徽。
        - id: ch01-b155
          speaker: mouldier
          text: 他比你家那两个黑白小不点儿更配做阿登家的人。
        - id: ch01-b156
          speaker: mouldy
          text: >-
            本来就该是，本来就该是。样样都往好处走，结局也快来了。爵爷想去哪儿？
        - id: ch01-b157
          speaker: dickie
          text: >-
            我不是什么爵爷，只是理查德·阿登。我想回到比尔先生身边，同他待上七个月，然后去找表兄妹。
        - id: ch01-b158
          speaker: mouldy
          text: 那你就回去吧。这一半容易得很。
        - id: ch01-b159
          speaker: mouldier
          text: >-
            至于愿望的后一半，并不需要别的魔法，只需要坚定的心和耐心不改的志向。这两样你本来就有，用不着我们赐予，也用不着我们相助。
        - id: ch01-b160
          speaker: narrator
          text: >-
            两只鼹鼠在灰蓝色的雾幕上挥了挥白爪子。瞧，它们立刻不见了。那片蓝灰色的雾也不过是渐渐转成晨曦的夜色。迪基又能感觉到坚实的东西了。他能感觉脚下的地板，也能感觉手掌按住的扶手椅尖角。膝旁还靠着熟睡的真真，那是一团柔软、温暖、舒舒服服的重量，正随着呼吸微微起伏。迪基动了一下，狗便醒了过来，把柔软的鼻子亲昵地拱进他的手心。
        - id: ch01-b161
          speaker: dickie
          text: 现在该干七个月的活儿，一个好梦也不做。
        - id: ch01-b162
          speaker: narrator
          text: >-
            他站起来，把叮当儿、印章和月光花种子藏到一个十分稳妥的地方，又悄悄爬回床上。迪基觉得自己颇有几分英雄气概。他并不想要那份宝藏，因为宝藏不是给他的。他要做的，是帮助埃德雷德和埃尔弗里达找到它。他也不想要薰衣草台那种生活。他留在那里，是为了帮助比尔先生过上那种生活。所以，就让迪基稍稍觉得自己是个英雄吧，因为他确实是一个英雄。当然了，所有心地端正的孩子全都谦虚又谦逊。不管他们偶尔做出了多么英勇的事，也会彻底明白，自己其实一点都不重要。
