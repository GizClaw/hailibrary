audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机敏，带着克制的幽默与讲故事的悬念
        timbre: 温暖清亮
        pace: 舒展而有变化
        pitch: 中音
    dickie:
      display_name: 迪基
      tts:
        delivery: 聪明敏感，街头口吻直率，学书中人物说话时郑重夸张
        timbre: 清脆稚嫩
        pace: 稍快，受委屈时断续
        pitch: 中高音
    mr_rosenberg:
      display_name: 罗森伯格先生
      tts:
        delivery: 精明务实，咬字略含混，生气时仍有分寸
        timbre: 浑厚偏暗
        pace: 偏慢
        pitch: 低音
    loafer:
      display_name: 闲汉
      tts:
        delivery: 起初粗鲁多疑，后来爽直友善
        timbre: 沙哑松散
        pace: 适中
        pitch: 中低音
    black_browed_woman:
      display_name: 黑眉毛女人
      tts:
        delivery: 直截了当，带着市井人的好奇
        timbre: 略粗而明亮
        pace: 适中
        pitch: 中音
    red_scarf_man:
      display_name: 红手帕男人
      tts:
        delivery: 随口讥讽，满不在乎
        timbre: 粗哑
        pace: 适中
        pitch: 中低音
    inn_patron:
      display_name: 客栈住客
      tts:
        delivery: 多疑刻薄，语气短促
        timbre: 干涩
        pace: 稍快
        pitch: 中音
    old_cabinetmaker:
      display_name: 老细木匠
      tts:
        delivery: 阅历深，评说手艺时笃定内行
        timbre: 苍老低沉
        pace: 偏慢
        pitch: 低音
    ribbon_seller:
      display_name: 卖针线的老妇人
      tts:
        delivery: 朴实健谈，带着对旧日生活的留恋
        timbre: 苍老柔和
        pace: 从容
        pitch: 中低音
    red_haired_man:
      display_name: 红头发男人
      tts:
        delivery: 油滑神秘，谈买卖时刻意压低声音
        timbre: 沙哑偏尖
        pace: 适中
        pitch: 中音
    nurse:
      display_name: 老奶妈
      tts:
        delivery: 慈爱爽朗，照料孩子时坚定又耐心
        timbre: 丰满温暖
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: “自己谋生”
      blocks:
        - id: ch01-b01
          speaker: loafer
          text: >-
            不，咱们以后不撬人家的屋子了。那种事下作，的确下作。看来咱们只能重新上路。
        - id: ch01-b02
          speaker: narrator
          text: >-
            比尔和迪基坐在斜坡田野的阳光下，整整坐了一上午。迪基把自己的遭遇从头讲起，从红头发男人托他爬进塔尔博特宅邸的窗户，一直讲到他走进那家敞着门的公共客栈。
        - id: ch01-b03
          speaker: loafer
          text: >-
            你干撬屋这行，真是块难得的好料子。机灵，聪明，谁也比不上。不过我也不喜欢干这个。撬屋总会惹麻烦，不是这桩就是那桩。怪就怪在这儿，它回回都要惹出麻烦。
        - id: ch01-b04
          speaker: narrator
          text: >-
            迪基从收割后的麦茬里捡起七根草秆，随手编了起来。这是他在梦里病后虚弱时，奶妈教给他的。
        - id: ch01-b05
          speaker: loafer
          text: 你这双手可真巧。谁教你的？
        - id: ch01-b06
          speaker: dickie
          text: >-
            我在梦里学的。我梦见自己发了一场热病。你要愿意听，我就讲给你，真是个好故事，差不多赶得上赫里沃德。
        - id: ch01-b07
          speaker: narrator
          text: 比尔叼着烟斗，仰面躺到干麦茬上。
        - id: ch01-b08
          speaker: loafer
          text: 那就讲吧。
        - id: ch01-b09
          speaker: narrator
          text: >-
            迪基从头讲到尾。等这个长故事讲完，太阳已经往西边沉下去了。两个人静静坐了一会儿。
        - id: ch01-b10
          speaker: loafer
          text: >-
            你去杂耍戏院说故事，准能挣大钱。亏你想得出这么一大套！你是什么时候编出来的？
        - id: ch01-b11
          speaker: dickie
          text: 我没编，我说过了，那是我梦见的。
        - id: ch01-b12
          speaker: loafer
          text: 你从小就会编瞎话。
        - id: ch01-b13
          speaker: dickie
          text: >-
            我以后不编了。在我待过的地方，我是说在梦里，他们把编瞎话叫作撒谎骗人。
        - id: ch01-b14
          speaker: loafer
          text: >-
            小不点儿才离开我几天，就变成这样了！“二号”居然不肯编瞎话。那咱们怎么老老实实弄到饭吃？你说呀，小家伙。
        - id: ch01-b15
          speaker: dickie
          text: 我也不知道。不过咱们一定得想出办法。
        - id: ch01-b16
          speaker: loafer
          text: >-
            哪有什么办法。外头没活儿干的人多得是。再说，编故事就是你的本事，你偏要把它丢掉。可咱们总得活呀。
        - id: ch01-b17
          speaker: dickie
          text: >-
            梦里的人好像都有活儿。他们人人都拜师，学一门手艺。要是这里也能这样就好了。
        - id: ch01-b18
          speaker: loafer
          text: 可这里不是梦里。我从没拜师学过手艺，你也学不成。
        - id: ch01-b19
          speaker: dickie
          text: >-
            那真倒霉。不过我已经学会不少东西了，都是梦里学的，大半是玩耍的本事。我还亲手造过一条船，他们叫它大帆船。那里的东西连名字都不一样。我也刻过一只很漂亮的小盒子，上面有我父亲家的纹章。
        - id: ch01-b20
          speaker: loafer
          text: 你父亲家的什么？
        - id: ch01-b21
          speaker: dickie
          text: >-
            家族纹章。那里的绅士，每一家都有自己的图样。他们把那图样叫纹章，还会刻在银器、马车和家具上。
        - id: ch01-b22
          speaker: loafer
          text: 他们把什么刻上去？
        - id: ch01-b23
          speaker: dickie
          text: 就是纹章。上等人家都有。
        - id: ch01-b24
          speaker: loafer
          text: >-
            别在我跟前摆阔少爷的臭架子，我可不吃这套。听清没有？准是塔尔博特家那些该死的家伙，把这些胡话塞进了你脑袋。
          emotion: angry
        - id: ch01-b25
          speaker: dickie
          text: >-
            塔尔博特家？他们成为体面人还不到两百年呢。我们家从阿尔弗雷德大王那时候就有了。
        - id: ch01-b26
          speaker: loafer
          text: >-
            我叫你闭嘴！你打什么主意，我全明白。你想离开我，是不是？那你走啊，回老塔尔博特家去。给那位好心太太当小宝贝，穿上天鹅绒小裤子，每星期领一块干净手绢。你就过那种日子去吧。
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: 迪基凄凉地望着河面。
        - id: ch01-b28
          speaker: dickie
          text: >-
            我又管不住自己梦见什么，对不对？梦里我有舅舅、姨母，还有个没见过的小弟弟。我有爸爸，也有妈妈，什么都有。可在这里，除了你，我谁也没有，爸爸。
          emotion: sad
        - id: ch01-b29
          speaker: loafer
          text: 那你为什么还总跟我对着干？
        - id: ch01-b30
          speaker: dickie
          text: 我没有。我以为你喜欢听我把什么都告诉你。
        - id: ch01-b31
          speaker: narrator
          text: >-
            两个人都沉默了。迪基看见朋友的衬衫和脸都脏兮兮的，胡子三天没刮，衣服也满是污垢。他又想起船坞里的塞巴斯蒂安。比尔那双浅蓝眼睛从脏污的脸上望着他，眼神里全是责备。迪基没留神，把心里话说了出来。
        - id: ch01-b32
          speaker: dickie
          text: 那些都没关系。
        - id: ch01-b33
          speaker: loafer
          text: 什么没关系？
        - id: ch01-b34
          speaker: dickie
          text: >-
            你看，我拿给你。这就是我说过的叮当儿，拿去当掉能换一先令。除了你，我不会给别人看。我发誓，谁也不给。
        - id: ch01-b35
          speaker: narrator
          text: 迪基把拨浪鼓递给比尔。比尔接过去仔细看了看。
        - id: ch01-b36
          speaker: loafer
          text: 这东西的确做得精巧。
        - id: ch01-b37
          speaker: dickie
          text: 你听我说，我其实是想……
        - id: ch01-b38
          speaker: narrator
          text: >-
            他停了下来。就算告诉比尔，自己特意离开梦境回来找他，又能怎么样？比尔不相信那个梦，也不明白，还很讨厌它。
        - id: ch01-b39
          speaker: dickie
          text: >-
            别跟我闹翻。不管那是不是梦，你总得和我站在一边。我绝不再做那些下作的坏事了。可就算不做，咱们也一定活得下去。要是随你挑，你最想靠什么过日子？
        - id: ch01-b40
          speaker: loafer
          text: >-
            我没正经学过手艺，只会照料马。小时候我给赶大车的人当过帮手。我喜欢马，也喜欢狗。可我这双手不会做什么，我是说，不会做正经活儿。
        - id: ch01-b41
          speaker: narrator
          text: >-
            迪基脑中冒出一个狂想。要是再进梦里学一门有用的手艺，醒来后也许能教给比尔。他赶紧把这个念头压了下去。
        - id: ch01-b42
          speaker: dickie
          text: 再没有别的事，是你真正想做的吗？
        - id: ch01-b43
          speaker: loafer
          text: 我想没有。除非养鸽子。
        - id: ch01-b44
          speaker: narrator
          text: >-
            迪基忽然想到，梦里学会的手上功夫，也许真的还留在身上。希腊文和拉丁文就没有消失，此刻还在他脑子里快活地唱着歌。
        - id: ch01-b45
          speaker: dickie
          text: >-
            我说到梦的时候，你别生气。你不知道那梦有多真。我没有骗你，凭良心说，我真的梦见了。我在那里会刻木头，也会做盒子。要是有块纹理细密的木头，我真想试试看。火车上有人给我割篮绳，那把刀我还留着，锋利得很。
        - id: ch01-b46
          speaker: loafer
          text: 要什么木头？
        - id: ch01-b47
          speaker: dickie
          text: 梦里的盒子是红木做的。我真想再试一次。
        - id: ch01-b48
          speaker: narrator
          text: 比尔痛苦地低声埋怨自己。
        - id: ch01-b49
          speaker: loafer
          text: >-
            这可怜的小脑袋真是坏掉了，都怪我让他去干塔尔博特宅邸那一票，才把小不点儿害成这样。
        - id: ch01-b50
          speaker: narrator
          text: 他伸伸身子，站了起来，又用格外温柔的声音对迪基说。
        - id: ch01-b51
          speaker: loafer
          text: >-
            我去给你找块红木。老伙计，我没别的意思。你想讲梦就接着讲，我不介意，我喜欢听。咱们再买两条熏鲱鱼，今晚好好过。
          emotion: calm
        - id: ch01-b52
          speaker: narrator
          text: 两个人回到了格雷夫森德的客栈。
        - id: ch01-b53
          speaker: narrator
          text: >-
            第二天，比尔拿来一条孤零零的红木沙发腿。它又圆又胖，车过花纹，木料又老又干。
        - id: ch01-b54
          speaker: loafer
          text: 是你想要的东西吗？
        - id: ch01-b55
          speaker: narrator
          text: 迪基急切地把沙发腿接了过去。
        - id: ch01-b56
          speaker: dickie
          text: >-
            我不知道自己到底还会不会，可感觉就像真的会。爸爸，咱们带些吃的，到树林里找个清静地方吧。那里没人追问我在干什么，也不会有人笑话我。
        - id: ch01-b57
          speaker: narrator
          text: >-
            他们在绿林深处找到一个温暖的小窝，正是迪基想要的地方，阳光洒得到处都是。漫长而温暖的秋日里，比尔懒洋洋地躺在太阳下。迪基脸色苍白，神情却很坚决。他拿着园丁送给他的刀，对着那条圆胖的老沙发腿，一片片削，一点点凿，再一小块一小块剔下干硬的木头。
        - id: ch01-b58
          speaker: narrator
          text: >-
            到了午饭时，他都舍不得停手。他们吃的是新鲜面包、德国香肠，还有扁瓶里的啤酒，简直又丰盛又奢侈。刀锋才碰上木头，迪基就知道自己没有忘。以前在德特福德船坞里，他曾当着塞巴斯蒂安的面做过这些。如今在格雷夫森德外的树林里，他照样做得出来。
        - id: ch01-b59
          speaker: narrator
          text: 午饭过后，比尔终于来了兴趣。
        - id: ch01-b60
          speaker: loafer
          text: 我的老天，你还真摸到门道了。你做的是盒子吧？
          emotion: surprised
        - id: ch01-b61
          speaker: dickie
          text: >-
            是盒子。我要给它配个严丝合缝的盖子，顶上再刻咱家的纹章。你瞧，我特意把那一块留得高一些。
        - id: ch01-b62
          speaker: narrator
          text: >-
            这是迪基有生以来最辛苦的一天。他做了又做，一直做到天色暗得快要看不清。最后一点光还没消失时，盒子终于完整地做好了。上面刻着家族纹章，盖子也扣得正合适。
        - id: ch01-b63
          speaker: narrator
          text: 比尔划亮一根火柴，借着火光看盒子。
        - id: ch01-b64
          speaker: loafer
          text: >-
            嘿，这要不算漂亮，世上就没有漂亮东西了！多少有钱人愿意花半块钱买它装烟草。儿子，你真有手艺，这下可错不了。以前怎么没听你说过？该死的火柴，烧到我手指了！
          emotion: surprised
        - id: ch01-b65
          speaker: narrator
          text: >-
            火柴灭了。他们回到煤气灯照亮的拥挤屋子，吃了一顿奢侈的晚饭，有牛肚、洋葱和煎土豆。吃完以后，比尔走到炉火前，站起来向满屋人宣布。
        - id: ch01-b66
          speaker: loafer
          text: >-
            我要拍卖东西啦！这儿有一件顶漂亮的宝贝。它能当烟草盒，也能当鼻烟盒，还能装金币，甚至装钻石。谁来出价？
        - id: ch01-b67
          speaker: black_browed_woman
          text: 拿过来，让大家传着看看。
        - id: ch01-b68
          speaker: narrator
          text: 女人提着一只盖油布的篮子，那油布也没有她的眼睛黑。
        - id: ch01-b69
          speaker: loafer
          text: >-
            当然能看。不过盒子得由我亲手拿着，再一个个递到你们眼前。
        - id: ch01-b70
          speaker: narrator
          text: >-
            比尔把盒子依次拿给众人看，让他们瞧整齐的边角、细密的雕纹，还有方盒盖严实的接缝。
        - id: ch01-b71
          speaker: red_scarf_man
          text: 这东西是从哪儿顺来的？
        - id: ch01-b72
          speaker: loafer
          text: 是小不点儿做的。
        - id: ch01-b73
          speaker: inn_patron
          text: 八成还是偷来的。
        - id: ch01-b74
          speaker: loafer
          text: 我亲眼看着他做出来的。
        - id: ch01-b75
          speaker: narrator
          text: 比尔微微皱起了眉。一个独自坐在旁边、满身灰暗的老头开了口。
        - id: ch01-b76
          speaker: old_cabinetmaker
          text: 让我看看。
        - id: ch01-b77
          speaker: narrator
          text: >-
            不知为什么，比尔真让老人把盒子拿在手里，不过他紧挨着对方，眼睛始终没有离开盒子。
        - id: ch01-b78
          speaker: old_cabinetmaker
          text: >-
            这是从整块木头里掏出来的。我不知道是谁做的，也不在乎，可做盒子的人是个懂行的手艺人。我从前干细木工，只看我现在这样，你们准猜不到。这里没人出得起它真正的价。先抹些冷榨亚麻仁油，放上一夜。早晨用裤腿擦亮，再丢进泥里弄脏。然后再抹油，再弄脏。把它装成真正的老古董去卖，能卖到半镑。就该这么办。
        - id: ch01-b79
          speaker: loafer
          text: 多谢您，老爷子。我就照您说的做。
        - id: ch01-b80
          speaker: narrator
          text: >-
            比尔把盒子滑进口袋。迪基下次看到它时，盒子已经照老人的办法抹过油，也在泥里弄脏又擦亮，看上去老得不能再老了。两人动身向伦敦走，比尔说，现在该找一家专卖这种老古董的店。他们在路上走着，比尔看出迪基的脸又瘦又白，精神也不大好。
        - id: ch01-b81
          speaker: loafer
          text: 你脸色不大好。昨晚那张床睡得不舒服吗？
        - id: ch01-b82
          speaker: dickie
          text: 床没有问题，我只是没怎么睡着。
        - id: ch01-b83
          speaker: narrator
          text: 他说着，心里想的却是梦中的那张床。
        - id: ch01-b84
          speaker: loafer
          text: 又做梦了？
        - id: ch01-b85
          speaker: dickie
          text: >-
            没有。也许就是因为太想再做那个梦，我才一直睡不着。
        - id: ch01-b86
          speaker: loafer
          text: 多半就是这样。
        - id: ch01-b87
          speaker: narrator
          text: >-
            比尔捡起一根草秆，放在嘴里嚼。迪基拖着跛脚走在尘土里。世界显得那么大，又那么冷酷。伦敦还远着呢，他却没能再进那个梦，也许以后永远都进不去了。他被一块大石头绊得要摔倒，比尔赶紧抓住他的胳膊。迪基被拉得转过身，比尔看见他眼里全是泪。这么久以来，比尔还是第一次看见他哭。
        - id: ch01-b88
          speaker: loafer
          text: 没摔伤吧？
        - id: ch01-b89
          speaker: dickie
          text: 没有。只是……
          emotion: sad
        - id: ch01-b90
          speaker: narrator
          text: 迪基把脸藏进比尔的外套袖子。比尔用一种许久没有用过的温柔声音问他。
        - id: ch01-b91
          speaker: loafer
          text: 到底怎么了？告诉你的老爸爸。
          emotion: calm
        - id: ch01-b92
          speaker: dickie
          text: 这事挺傻的。
          emotion: sad
        - id: ch01-b93
          speaker: loafer
          text: 傻不傻都不要紧，只管说出来。
          emotion: calm
        - id: ch01-b94
          speaker: dickie
          text: 在那个梦里，我的腿不瘸。
          emotion: sad
        - id: ch01-b95
          speaker: loafer
          text: >-
            想想看，你最好每天夜里都做这个梦。这样白天就不会太难受了。
        - id: ch01-b96
          speaker: dickie
          text: 可这样反倒更难受，难受得多，多得多。
          emotion: sad
        - id: ch01-b97
          speaker: narrator
          text: >-
            比尔没再说话，只在拥挤的童车里给他腾出地方。两个人继续赶路，迪基渐渐不再吸鼻子。沉默了一阵，他又开口了。
        - id: ch01-b98
          speaker: dickie
          text: >-
            爸爸，对不起，我刚才太傻了。你以前没见我哭过，以后也不会再见到了。
        - id: ch01-b99
          speaker: loafer
          text: 没事，伙计。
        - id: ch01-b100
          speaker: dickie
          text: 你手头的钱还宽裕吗？
        - id: ch01-b101
          speaker: loafer
          text: 还不算太糟。
        - id: ch01-b102
          speaker: dickie
          text: >-
            我想把那个盒子送给一个人。是他借钱给我坐火车，我才能去格雷夫森德找你。
        - id: ch01-b103
          speaker: loafer
          text: 等咱们宽裕些，改天再还他。
        - id: ch01-b104
          speaker: dickie
          text: >-
            我想现在就还。我能再做一个，反正那条沙发腿还剩下一截，对不对？
        - id: ch01-b105
          speaker: narrator
          text: >-
            沙发腿的确还剩一截。此后，迪基把所有零碎时间都用上。饭前做一会儿，饭后接着做，睡觉以前还要做，清早出发前的半个钟头也不肯浪费，就这样一点点做第二只盒子。比尔碰见看着会给钱的路人，还是会上去乞讨，可他发现“小不点儿”再也不肯替他“编故事”了。迪基一路上大多沉默，只有比尔叫他帮腔时，他才肯说一句。
        - id: ch01-b106
          speaker: dickie
          text: 爸爸一直待我很好。没有他，我真不知道该怎么办。
        - id: ch01-b107
          speaker: narrator
          text: >-
            他们终于回到新十字。比尔进铁路旅馆喝半品脱酒，迪基的拐杖一路笃嗒笃嗒敲过人行道，把他带到当铺老板那里。
        - id: ch01-b108
          speaker: mr_rosenberg
          text: 又见面啦。你是来当拨浪鼓的吗？
        - id: ch01-b109
          speaker: narrator
          text: 迪基笑了。这句话忽然像是他们两人之间一个说了很久的玩笑。
        - id: ch01-b110
          speaker: dickie
          text: >-
            先生，您还记得借给我去格雷夫森德的钱吗？您对我真是太好了。
        - id: ch01-b111
          speaker: mr_rosenberg
          text: 你要是还想借钱，我可不会再借。
        - id: ch01-b112
          speaker: narrator
          text: 罗森伯格先生早就责备过自己，不该那么轻信别人，还慷慨得过了头。
        - id: ch01-b113
          speaker: dickie
          text: 我不是来借钱，是来还钱的。
        - id: ch01-b114
          speaker: mr_rosenberg
          text: 你有钱？
        - id: ch01-b115
          speaker: narrator
          text: 当铺老板笑了，不过笑里没有恶意。
        - id: ch01-b116
          speaker: dickie
          text: 我没有钱，不过我有这个。
        - id: ch01-b117
          speaker: narrator
          text: 迪基把小盒子递过柜台。
        - id: ch01-b118
          speaker: mr_rosenberg
          text: 这是从哪儿弄来的？
        - id: ch01-b119
          speaker: dickie
          text: 是我做的。
        - id: ch01-b120
          speaker: mr_rosenberg
          text: >-
            好吧，好吧。我不追问，你也别拿谎话哄我，行不行？
        - id: ch01-b121
          speaker: dickie
          text: >-
            我当然不会对您撒谎。您肯收下这只盒子，抵掉我欠的钱吗？
        - id: ch01-b122
          speaker: narrator
          text: >-
            迪基说话时，带着梦里那个男孩的尊严。那个孩子双腿健全，还是一个古老高贵姓氏的继承人。当铺老板把盒子拿在手里翻来覆去地看。善良和诚实在他心里，正与多年经商养成的习惯较量。迪基望着店里的瓷花瓶、六角手风琴，还有扎成扇形的一束束茶匙，安静地等着。
        - id: ch01-b123
          speaker: mr_rosenberg
          text: >-
            这盒子比我借你的钱更值钱。你可记住，不是每个人都会承认这一点。
        - id: ch01-b124
          speaker: dickie
          text: >-
            我知道。请您收下，把我的债抵清。如果它还多值一些钱，就把多出来的当成一份感谢您的礼物，是一个直到现在还欠着您人情的人送的。
        - id: ch01-b125
          speaker: mr_rosenberg
          text: >-
            你去杂耍戏院准能发大财，说起话来真有一套。好吧，盒子我收下，你的债也清了。不过你还是可以告诉我，它究竟是哪儿来的。
        - id: ch01-b126
          speaker: dickie
          text: 就是我做的。
        - id: ch01-b127
          speaker: narrator
          text: 迪基说完，紧紧抿住嘴唇。
        - id: ch01-b128
          speaker: mr_rosenberg
          text: >-
            真是你做的，对吧？那我告诉你，以后每做一个拿来，我都付你四先令。纹章可以换些不同的，你明白吗？
        - id: ch01-b129
          speaker: dickie
          text: 可我只学过这一种纹章。
        - id: ch01-b130
          speaker: narrator
          text: >-
            就在这时，一个女人进来，要典当自己的礼拜日衣裳和一对床单。她的男人没有工作，孩子们正在挨饿。
        - id: ch01-b131
          speaker: mr_rosenberg
          text: 快走吧，今天没有你的事了。
        - id: ch01-b132
          speaker: narrator
          text: >-
            迪基红着脸离开了。三天后，他的拐杖又咔嗒咔嗒敲进当铺。他把两只小盒子放到柜台上。
        - id: ch01-b133
          speaker: dickie
          text: 给您。
        - id: ch01-b134
          speaker: narrator
          text: >-
            罗森伯格先生看看盒子，又是惊叹，又是盘问，又是称奇，怎么也不敢相信。迪基离开时，口袋里装着八枚亮闪闪的先令。这是他一生中第一次拥有自己挣来的钱。那些银币简直像从仙境的铸币厂里刚造出来，明亮、稀奇，和他以前经手过的任何钱都不一样。
        - id: ch01-b135
          speaker: narrator
          text: >-
            比尔在新十字车站旁等他。看见迪基过来，他把空烟斗塞进口袋，慢悠悠迎上去。迪基把他拉进一条小街，摊开手里的银币。
        - id: ch01-b136
          speaker: dickie
          text: >-
            这是两天的工钱。以后咱们不用再上路了，除非是出去玩。我有手艺，一天能挣四先令。一个星期是多少？我算出来是二十四先令。
          emotion: happy
        - id: ch01-b137
          speaker: loafer
          text: 老天啊！
          emotion: surprised
        - id: ch01-b138
          speaker: dickie
          text: >-
            现在你再去弄几条旧沙发腿，还得买磨刀石和磨刀皮带。这样东西就齐了。一个人带着他的小不点儿，每星期有二十四先令，日子不会太差吧，爸爸？我都想好，也安排好了。天暖时，咱们睡挂绿帷幕的床，我把绿树林当工场。夜里冷了，咱们就租一间自己的屋子，像阔佬一样过日子，好不好？
          emotion: happy
        - id: ch01-b139
          speaker: narrator
          text: 孩子的眼睛兴奋得闪闪发亮。
        - id: ch01-b140
          speaker: loafer
          text: 凭我的老天，你还真喜欢干活呀。
          emotion: surprised
        - id: ch01-b141
          speaker: dickie
          text: 干活总比讨钱强。
        - id: ch01-b142
          speaker: narrator
          text: >-
            他们照迪基的计划做了。头两天，比尔很满足。他吃了睡，睡醒了看迪基灵活的手指，再吃，再睡。到了第三天，他说两条腿闲得发痒。
        - id: ch01-b143
          speaker: loafer
          text: >-
            我得出去转一圈，太阳落山前回来。等太阳和那棵高树的树梢一样高，你可别忘了吃午饭。回头见，伙计。
        - id: ch01-b144
          speaker: narrator
          text: >-
            比尔穿着又脏又破的衣裳，在阳光下拖着步子走远了。迪基一个人留在金绿相间的树林里做活。四周安静极了。他几乎一动不动，手下飘落的木屑，比高枝偶尔掉下的细枝和橡子还轻。
        - id: ch01-b145
          speaker: narrator
          text: >-
            一只金翅雀站在摇晃的榛树枝上，用明亮而毫不害怕的眼睛看他。一条草蛇飞快滑过，忙着自己的要紧事。他们谁也不怕谁。一只斑鸠扇着沙沙作响的翅膀，掠过林间空地。还有一次，一只松鼠径直跑上树枝，低头冲他吱吱叫，尾巴蓬得老粗，像发怒的猫。
        - id: ch01-b146
          speaker: narrator
          text: >-
            这一天又长又美好，也是迪基有生以来第一次独自度过的一天。他比平常干得更卖力，手里的刀几乎没有停过。渐暗的天光终于再也容不得他继续做下去，他才靠上一条树根，让疲倦的背歇一歇。他得意地反复想着，自己一天做了两个盒子，也就是八先令。只用一天，就挣了整整八枚了不起的先令。
        - id: ch01-b147
          speaker: narrator
          text: >-
            太阳完全落山以后，比尔才回来。他看上去胖得不大自然。一屁股坐到苔藓上时，外套前襟里有东西动了动，还呜咽了一声。
        - id: ch01-b148
          speaker: dickie
          text: >-
            啊，那是什么？不会是狗吧？爸爸，你根本不知道，我一直有多想要一条狗。
          emotion: surprised
        - id: ch01-b149
          speaker: loafer
          text: 好吧，你想要的东西现在有了，而且一来就是三份。
        - id: ch01-b150
          speaker: narrator
          text: >-
            比尔解开外套，掏出满满两捧柔软蓬松、乱扭乱蹬的胳膊、腿、脑袋和尾巴。原来是三只白白胖胖的小狗。
        - id: ch01-b151
          speaker: dickie
          text: 这些小家伙真快活，也真漂亮！你从哪儿弄来的？
          emotion: happy
        - id: ch01-b152
          speaker: loafer
          text: 是乡下一位太太送给我的。
        - id: ch01-b153
          speaker: narrator
          text: 比尔重新系好围巾，眼睛却望着暮色渐深的柔蓝天空。
        - id: ch01-b154
          speaker: dickie
          text: 再编一个试试。
        - id: ch01-b155
          speaker: loafer
          text: >-
            唉，想骗过小不点儿根本没用，他就是这么精。好吧，不骗你了，伙计。狗是我买的。
        - id: ch01-b156
          speaker: dickie
          text: 你拿什么买的？
        - id: ch01-b157
          speaker: loafer
          text: 当然是拿钱买的，伙计。
        - id: ch01-b158
          speaker: dickie
          text: 钱是从哪儿来的？
        - id: ch01-b159
          speaker: narrator
          text: 比尔没有回答。
        - id: ch01-b160
          speaker: dickie
          text: 你没有偷吧？
        - id: ch01-b161
          speaker: loafer
          text: >-
            没有，凭我神圣的老天，真的没有。偷东西会惹麻烦，我早就得到教训了。
        - id: ch01-b162
          speaker: dickie
          text: 那钱就是讨来的？
        - id: ch01-b163
          speaker: loafer
          text: 嗯，是讨来的。可那又怎么样？
        - id: ch01-b164
          speaker: dickie
          text: 你把一切都毁了！
          emotion: angry
        - id: ch01-b165
          speaker: narrator
          text: >-
            迪基怒不可遏，把刚做好的两个盒子狠狠摔在地上，然后低着眼睛坐在那里生闷气。比尔趴下去，把盒子捡了回来。
        - id: ch01-b166
          speaker: loafer
          text: 两个！天底下从没见过这样的小不点儿！
          emotion: surprised
        - id: ch01-b167
          speaker: dickie
          text: >-
            做两个又有什么用？你把事情全毁了，还对我撒谎。全毁了。我真希望自己从来没有离开那个梦。
          emotion: sad
        - id: ch01-b168
          speaker: loafer
          text: >-
            你给我听着，别跟我来这一套，我可受不了。到底谁当家，是我还是你？你以为我会让一个小不点儿欺负我，赶着我走？我一只手就能把你打趴下，就像收拾这几只小狗一样。
          emotion: angry
        - id: ch01-b169
          speaker: narrator
          text: >-
            比尔把脚伸到那几团柔软结实的小东西中间。小狗们发出奶声奶气的低吼，用小白牙咬住他的破靴子。
        - id: ch01-b170
          speaker: dickie
          text: 那你就打呀。想打就把我打趴下，我不在乎。
          emotion: angry
        - id: ch01-b171
          speaker: loafer
          text: >-
            好啦，伙计，好啦。我只是逗你玩，别这么往心里去。你知道，我连你头上一根头发都舍不得伤。
          emotion: calm
        - id: ch01-b172
          speaker: dickie
          text: >-
            我想让咱们靠干活，老老实实过日子，咱们明明已经做到了。可你又把咱们拖回讨钱的日子。我就是受不了。
          emotion: sad
        - id: ch01-b173
          speaker: loafer
          text: >-
            不是你想的那样。我一个字也没开口讨。那里正办婚礼，我停下看热闹。一辆洒水车也像停下看婚礼似的，在路上弄出一个茶盘那么大的水坑，把整条人行道都打湿了。穿白衣的新娘看看路，新郎又看看她的白靴子。我马上脱下外套，学你故事里的拉雷先生，啪的一声铺在水坑正中，正好挡在新娘面前。她像天使一样冲我笑，还伸出一只戴白手套的手。可我这双手是什么样，你也知道，伙计。
        - id: ch01-b174
          speaker: dickie
          text: 我知道。你接着说。
        - id: ch01-b175
          speaker: loafer
          text: >-
            她轻轻碰了一下我的手，就从外套上走过去。周围那些人又笑又拍手，像一群傻猴子。新郎给了我一镑。一个月前我就见过这些小狗，知道五先令能买下来，所以我才买了。我以后能把它们卖到三倍价钱，你等着看吧。我还以为你准会高兴，因为我做了件傻气事，活像你讲的故事里那些人。谁知道我才回来，你就冲我发作。事情总是这样。
        - id: ch01-b176
          speaker: dickie
          text: >-
            爸爸，请你原谅我，真的对不起。你做得很好，我也很高兴。我真的喜欢这些小狗。咱们别把三只全卖掉，好不好？我想留下一只，给它取名叫“忠诚”。我梦里也有一条叫“忠诚”的狗。你会原谅我吧，爸爸？
          emotion: sad
        - id: ch01-b177
          speaker: loafer
          text: 啊，没事了。
          emotion: calm
        - id: ch01-b178
          speaker: narrator
          text: >-
            第二天，树林里又有一个小男孩独自做活，可他不再孤单。一只小狗在他身边翻滚、吠叫、打闹，还哼哼唧唧。这天没有松鼠和小鸟来替迪基解闷，不过在他心里，一个忠诚抵得过许多小鸟和松鼠。
        - id: ch01-b179
          speaker: narrator
          text: >-
            他们在路上赶上一位女人，比尔用童车替她捎了一程篮子。她送给迪基一小段蓝丝带，系在狗崽脖子上。她挨家挨户卖丝带、棉线和针，还说这种生意挣不到几个钱。
        - id: ch01-b180
          speaker: ribbon_seller
          text: 我爷爷从前在萨塞克斯也有自己的农场呢。
        - id: ch01-b181
          speaker: narrator
          text: >-
            老妇人说着，用昏花的眼睛望过田野。那一天，迪基只做完一只盒子，另一只才做了一半。就在他坐在林中，低头对付手里的木头时，远在伦敦，一个外表体面的男人正抱着两只毛茸茸的小白狗，在摄政街上来回穿行。四周有逛街的顾客，有汽车，也有一辆辆马车。等他回来时，两只狗已经全卖掉了。比尔把卖狗的经过得意地讲给迪基听。
        - id: ch01-b182
          speaker: loafer
          text: >-
            第一只卖给了马车里的太太。我开口就要两镑，眼睛都没眨。她根本不在乎价钱，老天保佑她。她说那是个漂亮的小宝贝，非买不可。旁边的先生说能找来许多更好的，可她偏只要这一只，最后还真买了。要我说，傻瓜的钱最好赚。另一只便宜些，十四先令卖给一个黑人牧师。他黑得跟你的帽子一样，是外国来的。咱们现在真成阔佬了。今晚我就去买套现成衣服。你说的那间屋子，现在要租吗？
        - id: ch01-b183
          speaker: narrator
          text: >-
            一种新生活就这样开始了。迪基拿着别人送的一小截台球巧粉，在“跳棋”酒馆旁边、饮马槽附近的一块大石板上，一笔一笔写下他们的账。收入是四只盒子，每只四先令，再加两只小狗，一只四十先令，一只十四先令，总共七十先令。支出是买狗四先令，吃食十九先令，车钱四先令，红木家具腿两先令，总共二十九先令。
        - id: ch01-b184
          speaker: narrator
          text: >-
            擦掉石板上的字以前，迪基算出七十减二十九以后，大约还剩两镑。这么大一笔钱，他一生中从没拥有过，比尔也已经许多年没有见过了。
        - id: ch01-b185
          speaker: narrator
          text: >-
            随后，比尔来了，一边擦着嘴，两个人一起懒洋洋地沿路走。他们开始琢磨住处，或者更准确地说，是一个住处，一间属于自己的屋子。可一个人在所谓的“大街钥匙”底下，也就是露宿街头，过了许多年后，几乎已经忘了该到哪里去找一把真正的房门钥匙，更不知道租屋要从哪儿问起。
        - id: ch01-b186
          speaker: loafer
          text: 你想住在哪儿？你最喜欢乡下，对吧？
        - id: ch01-b187
          speaker: dickie
          text: 对。
        - id: ch01-b188
          speaker: loafer
          text: 可冬天怎么办？
        - id: ch01-b189
          speaker: dickie
          text: 冬天就住城里。
        - id: ch01-b190
          speaker: narrator
          text: 迪基心里正想着，明天要刻一只形状新奇、跟以前都不同的盒子。
        - id: ch01-b191
          speaker: loafer
          text: >-
            我可以四处留意哪儿有合适的小狗，你也能继续做盒子。咱们也许付得起每星期三先令的房租。
        - id: ch01-b192
          speaker: dickie
          text: 我想要一座带花园的房子。
        - id: ch01-b193
          speaker: loafer
          text: 那你就回塔尔博特家去。
        - id: ch01-b194
          speaker: dickie
          text: >-
            不，你先听我说。咱们要是租一小座房子，再把一半转租给别人呢？
        - id: ch01-b195
          speaker: loafer
          text: 咱们连一件能摆进去的家具都没有。
        - id: ch01-b196
          speaker: dickie
          text: 有没有办法，可以先不付钱就拿到家具？
        - id: ch01-b197
          speaker: loafer
          text: >-
            家具可以租购，可那是给每星期稳稳当当挣三镑的阔佬准备的。人家根本不会搭理咱们。
        - id: ch01-b198
          speaker: dickie
          text: >-
            早晚有一天，咱们一定能挣到三镑。你想住伦敦，我想要咱们从前那座老房子，因为我在花园里种过种子。我敢说它们每年都会再长出来，永远不停。隔壁那个人告诉我，这就是一年生花卉的意思。咱们走过去吧，我带你看看，就是以前住的地方。
        - id: ch01-b199
          speaker: narrator
          text: >-
            他们一路走到那座愁眉苦脸的小房子前。迪基指给比尔看，比尔也承认，这地方很适合他们。
        - id: ch01-b200
          speaker: loafer
          text: 可咱们总得先有几件家具，不然谁肯把房子租给咱们？
        - id: ch01-b201
          speaker: narrator
          text: >-
            他们走到临街的窗前，把鼻子紧紧贴在玻璃上，往那间空荡荡的小屋里看。地板上还是散着旧报纸和肮脏的粗麻布。迪基在那场梦后的第二天早晨爬起来时，它们就是这个样子。如今每一张纸、每一块麻布仍旧原封不动，仿佛根本没有人来过。
        - id: ch01-b202
          speaker: narrator
          text: >-
            眼前的景象一下扯紧了迪基的心，连那些破报纸都让他怀念。他仿佛是一个漂泊许久的人，又望见了从前那座海港。在古老而美好的岁月里，他曾从那里扬帆出海，越过遥远的水面，驶向充满传奇的海岸，也驶向金光灿烂的幸福岛。
        - id: ch01-b203
          speaker: dickie
          text: >-
            我可以再睡在这里，还能省下四便士。两边的房子也都空着，不会有人知道。
          emotion: sad
        - id: ch01-b204
          speaker: loafer
          text: 咱们还没穷到连四便士都非省不可。
        - id: ch01-b205
          speaker: dickie
          text: 可我想住在这里。
        - id: ch01-b206
          speaker: loafer
          text: 真奇怪，你居然不害怕。
        - id: ch01-b207
          speaker: dickie
          text: 我早就住惯了。你看，这本来就是咱们自己的房子。
        - id: ch01-b208
          speaker: loafer
          text: >-
            走吧，先去吃晚饭。别再拿你自己的房子摆阔了。
        - id: ch01-b209
          speaker: narrator
          text: 他们去了百老汇的一家咖啡馆。比尔开口点菜。
        - id: ch01-b210
          speaker: loafer
          text: 两只杯子，四个台球，半打门槛。
        - id: ch01-b211
          speaker: narrator
          text: >-
            你和我大概会说，两杯茶、四个鸡蛋，再来半打抹着黄油的厚面包片。这样说也许更有礼貌，却没有比尔说得那么生动。这顿饭本来吃得很愉快。茶是热的，面包也足够厚。可就在快吃完时，情形突然全变了。这是一家老式铺子，每一处座位都用高隔板分开，看上去就像马厩里一格格的栏位。忽然，一颗脑袋从隔板顶上冒了出来。
        - id: ch01-b212
          speaker: narrator
          text: 迪基的杯子停在嘴边，嘴还张着。
        - id: ch01-b213
          speaker: loafer
          text: 怎么了？
        - id: ch01-b214
          speaker: narrator
          text: 比尔想在狭窄的座位上转身抬头，怎么也转不过去。
        - id: ch01-b215
          speaker: dickie
          text: 是他。就是那个我从没见过的红头发家伙。
        - id: ch01-b216
          speaker: narrator
          text: >-
            红头发男人绕过隔板，坐到比尔身旁，低声跟他说起话。迪基真希望他不要说。谈话内容，迪基没有听清多少。
        - id: ch01-b217
          speaker: red_haired_man
          text: 下次运气会好些。
        - id: ch01-b218
          speaker: loafer
          text: 我可没说过要入伙。
        - id: ch01-b219
          speaker: red_haired_man
          text: 我跟你睡同一家店。
        - id: ch01-b220
          speaker: narrator
          text: 比尔把客栈的名字告诉了他。来咖啡馆以前，比尔把童车留在那里，还订好了两张床。
        - id: ch01-b221
          speaker: red_haired_man
          text: 明早我把事情全告诉你。
        - id: ch01-b222
          speaker: narrator
          text: >-
            红头发男人拖着步子走了。迪基和比尔把剩下的“门槛”吃完，又喝掉溅进茶碟、已经凉透的茶。出了门，迪基马上问比尔。
        - id: ch01-b223
          speaker: dickie
          text: 爸爸，那个红头发家伙想干什么？
        - id: ch01-b224
          speaker: narrator
          text: 比尔没有立刻回答。
        - id: ch01-b225
          speaker: dickie
          text: 我要是你，就不会答应。
        - id: ch01-b226
          speaker: loafer
          text: 不答应什么？
        - id: ch01-b227
          speaker: dickie
          text: 不管他要你做什么，都不要答应。
        - id: ch01-b228
          speaker: loafer
          text: 可我还没告诉你，他到底想做什么。
        - id: ch01-b229
          speaker: dickie
          text: 他准没安好心，我知道。
        - id: ch01-b230
          speaker: loafer
          text: >-
            他就是脑子里主意多。只要有几个主意能成，说不定转眼他就坐上自己的马车了，咱们却只能跟在后面吃灰。
        - id: ch01-b231
          speaker: dickie
          text: 他坐上囚车还差不多。
        - id: ch01-b232
          speaker: loafer
          text: 可我又没叫你做什么，对不对？
        - id: ch01-b233
          speaker: dickie
          text: >-
            你没有叫我。可你卷进什么事，我也一定会被卷进去，就是这样。
        - id: ch01-b234
          speaker: loafer
          text: >-
            别着急。我还没答应卷进任何事呢。明早先听听他怎么说。要是那买卖不稳妥，老比尔才不会参加。这个你尽管放心。
        - id: ch01-b235
          speaker: dickie
          text: >-
            别听他说了。爸爸，你听我的，咱们两个现在就走，去那座老房子睡。我不要那个红头发家伙。他会毁掉一切，我知道他会。咱们好不容易才走上正道，现在又过得这么快活。别回客栈了，今晚睡老房子吧。
          emotion: fearful
        - id: ch01-b236
          speaker: loafer
          text: 难道除了你，我以后不能和别人说一句话了？
        - id: ch01-b237
          speaker: narrator
          text: 比尔并没有生气。
        - id: ch01-b238
          speaker: dickie
          text: >-
            不能跟他。他不是好人。再说，爸爸，我真的特别想睡在那座房子里。你知道，我就是在那里做了那场梦。
        - id: ch01-b239
          speaker: loafer
          text: 啊，好吧，那就走。幸亏咱们穿了厚外套。
        - id: ch01-b240
          speaker: narrator
          text: >-
            迪基像上次一样，轻易进了房子。他沿着黑暗的过道走到前门，从里面替比尔开门，比尔便大模大样地走进来。他们把地上的粗麻布和旧报纸拢到一起，尽量铺成两个舒服的睡铺。可两个人里至少有一个，躺在这又硬又脏的铺位上，想念野外清洁的空气、柔软的苔藓，还有缀满星辰的床顶。
        - id: ch01-b241
          speaker: narrator
          text: >-
            比尔很快睡着了。迪基却一动不动地躺着，听着自己的心跳。每一下心跳都在反复敲着同一个希望。如今他终于回到这个地方，那场梦第一次就是在这里降临的，所以它也该再次降临。可是他等了又等，梦始终没有来，连平常那种安稳、无梦的睡眠也不肯来。
        - id: ch01-b242
          speaker: narrator
          text: >-
            到最后，迪基再也躺不住。他悄悄从报纸底下钻出来，纸张发出一阵沙沙声，却没有惊醒熟睡的比尔。他走进街灯透过窗户投在地上的方形光块，摸遍自己的口袋，拿出叮当儿和白印章，小心放到地板上。那场伟大梦境第一次降临时的记忆推着他。他又掏出白色的月亮花种子，照着那天夜里的图案，一颗颗摆在两件东西四周。
        - id: ch01-b243
          speaker: narrator
          text: >-
            最后一颗种子放好，两个交叠的三角形完整了，魔法再次开始。一切都和从前一样。疲倦的眼睛非合上不可，可隔着紧闭的眼皮，他仍觉得星形中央有什么东西正在移动。
        - id: ch01-b244
          speaker: narrator
          text: 上次那个轻柔细小的声音问他，想到哪里去。这一回，迪基没有再说去哪儿都成。
        - id: ch01-b245
          speaker: dickie
          text: 啊，去那里！我想去那里！
        - id: ch01-b246
          speaker: narrator
          text: >-
            他深信声音的主人和自己一样清楚，甚至比自己更清楚，“那里”是什么地方，又该怎么去。四周像上次一样万籁俱寂。睡意像一件柔软的衣裳，把迪基裹了起来。
        - id: ch01-b247
          speaker: narrator
          text: >-
            醒来时，他已经躺在那张四柱大床上，床边垂着熟悉的绿白床帘。四周又是那间挂毯蒙墙的屋子。阴影里的大衣柜、蒙着织锦的高背椅，还有梦里那些厚重的家具，全都回来了。
        - id: ch01-b248
          speaker: dickie
          text: 啊！我又找到它了！找到了！我找到啦！
          emotion: happy
        - id: ch01-b249
          speaker: narrator
          text: >-
            随后，那位穿鲸骨裙、戴古怪帽子、脖子上围着白色轮状皱领的老奶妈俯身来看他。她还是迪基记得的样子。那张布满皱纹的脸，被爱和温柔照得明亮起来。
        - id: ch01-b250
          speaker: nurse
          text: 你总算醒啦。在梦里找到你的朋友了吗？
        - id: ch01-b251
          speaker: narrator
          text: 迪基一把抱住了她。
        - id: ch01-b252
          speaker: dickie
          text: >-
            我找到回来的路了。我不知道哪一个是梦，哪一个才是真的，可你知道。
          emotion: happy
        - id: ch01-b253
          speaker: nurse
          text: 是的，我知道。一个和另一个同样真实。
        - id: ch01-b254
          speaker: narrator
          text: >-
            迪基跳下床，在屋里蹦来蹦去。他跳上椅子，再跳下来，又跑又舞。
        - id: ch01-b255
          speaker: nurse
          text: >-
            这孩子是怎么了？快把长袜穿上，真不像话。这样闹下去，多半要受凉。你究竟为什么这么高兴？
        - id: ch01-b256
          speaker: dickie
          text: >-
            因为我的腿不瘸了。你不知道，刚开始的时候，能不跛脚是一件多么奇妙的事。
          emotion: happy
        - id: ch01-b257
          speaker: narrator
          text: 迪基说完，在窗前停下。窗外正对着那座美好的绿色花园。
