  chapters:
    - id: ch01
      title: To Get Your Own Living
      blocks:
        - id: ch01-b01
          speaker: mr_beale
          text: >-
            No. We ain't cracking any more cribs. It's low, that's what it is, and I admit it. Looks like we'll have to take to the road again.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Mr. Beale and Dickie sat together in the sunshine on the slope of a field. They had been there all morning, with the dry stubble around them, while Dickie told him everything that had happened. He began with the redheaded man lifting him through the window at Talbot Court. Then he went through every one of his strange adventures, right up to the moment when he came back through the open door of the common lodging-house and found Beale again.
        - id: ch01-b03
          speaker: mr_beale
          text: >-
            You're a rare sharp nipper, though. For burgling, I mean. Clever as they come. Not that I care for burgling myself. You're always getting into trouble over it, one way or another. Somehow it always ends in trouble.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Dickie picked seven straws from the stubble and began plaiting them. The nurse had taught him how in the dream, while he was still weak from fever.
        - id: ch01-b05
          speaker: mr_beale
          text: "That's a fancy trick. Who taught you that?"
        - id: ch01-b06
          speaker: dickie
          text: >-
            I learned it in a dream. I dreamed I had a fever. I'll tell you the whole thing if you like. It's nearly as good a yarn as Hereward.
        - id: ch01-b07
          speaker: narrator
          text: "Beale lay back on the dry stubble with his pipe between his teeth."
        - id: ch01-b08
          speaker: mr_beale
          text: "Go on, then."
        - id: ch01-b09
          speaker: narrator
          text: >-
            Dickie began, and once he had started, he told the whole long story. Beale stayed stretched out on the stubble and listened. The tale went on through the afternoon. By the time Dickie reached its end, the sun was beginning to sink toward its bed in the west. Then there was a pause. After so much telling, neither of them spoke for a moment.
        - id: ch01-b10
          speaker: mr_beale
          text: >-
            You could earn a tidy bit on the music-hall stage. The things you come up with! When did you make all that up?
        - id: ch01-b11
          speaker: dickie
          text: "I told you. I dreamed it."
        - id: ch01-b12
          speaker: mr_beale
          text: "You always were good at putting on a tale."
        - id: ch01-b13
          speaker: dickie
          text: >-
            Well, I ain't doing that ever again. Where I was in the dream, they called it lying and cheating.
        - id: ch01-b14
          speaker: mr_beale
          text: >-
            That's what comes of letting a nipper out of your sight. Number Two won't spin tales any more! So how are we meant to earn an honest living? You tell me that.
        - id: ch01-b15
          speaker: dickie
          text: "I don't know. But we've got to find a way somehow."
        - id: ch01-b16
          speaker: mr_beale
          text: >-
            There ain't a way, not with all the unemployed about. Besides, you've got a real gift for tales. A talent, that's what it is, and now you mean to waste it. But you can't. We've got to live.
        - id: ch01-b17
          speaker: dickie
          text: >-
            In the dream there didn't seem to be any unemployed. Everyone was apprenticed to a trade. I wish things were like that here.
        - id: ch01-b18
          speaker: mr_beale
          text: "Well, they ain't. I never learned a trade, and you won't either."
        - id: ch01-b19
          speaker: dickie
          text: >-
            More's the pity. I started learning all kinds of things in the dream. Mostly games, but I began making a boat too. They called it a galleon. All the names are different there. And I carved a little box out of wood, with my father's arms on it. It was a beauty.
        - id: ch01-b20
          speaker: mr_beale
          text: "Your father's what?"
        - id: ch01-b21
          speaker: dickie
          text: >-
            His coat of arms. All the gentlemen there have their own patterns. They call them coats of arms, and put them on their silver, carriages, and furniture.
        - id: ch01-b22
          speaker: mr_beale
          text: "Put what on them?"
        - id: ch01-b23
          speaker: dickie
          text: "The blazon. All gentlepeople have one."
        - id: ch01-b24
          speaker: mr_beale
          text: >-
            Don't you play the fine gentleman with me, because I won't stand it. Those blooming Talbots filled your head with all this rubbish.
          emotion: angry
        - id: ch01-b25
          speaker: dickie
          text: >-
            The Talbots? They haven't been gentry above two hundred years. Our family goes back as far as King Alfred.
        - id: ch01-b26
          speaker: mr_beale
          text: >-
            Shut it, I said! I know what you're after. You want us to split up. Well, go on, then. Go back to your Talbots. Be the nice lady's little boy, with velvet trousers and a clean handkerchief every week.
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: "Dickie stared sadly across the river."
        - id: ch01-b28
          speaker: dickie
          text: >-
            I can't help what I dream, can I? In the dream I had all sorts of people. Uncles and aunts, and a little brother, though I never saw him. I had a father and mother too. But here, I haven't got anybody except you, Father.
          emotion: sad
        - id: ch01-b29
          speaker: mr_beale
          text: "Then why do you keep setting yourself against me?"
        - id: ch01-b30
          speaker: dickie
          text: "I don't. I thought you liked me telling you everything."
        - id: ch01-b31
          speaker: narrator
          text: >-
            They fell silent. Dickie could not help seeing Beale as he truly looked just then. His shirt was dirty. His face was dirty too, and a beard of three days covered his chin. Every piece of clothing on him was filthy. At once Dickie remembered his other friend, Sebastian of the Docks, and all the difference between them. But then he looked into the pale blue eyes that watched him from Beale's grimy face. Those eyes were hurt, reproachful, and angry. Dickie had not meant to say anything, yet the words came out aloud.
        - id: ch01-b32
          speaker: dickie
          text: "None of that makes any difference."
        - id: ch01-b33
          speaker: mr_beale
          text: "What do you mean by that?"
        - id: ch01-b34
          speaker: dickie
          text: >-
            Look, I'll prove it. Here's my Tinkler, the one I told you about, the one I can pawn for a shilling. I wouldn't show it to anyone but you. I swear I wouldn't.
        - id: ch01-b35
          speaker: narrator
          text: "He held out the rattle, and Beale took it."
        - id: ch01-b36
          speaker: mr_beale
          text: "It is a fancy piece. I'll give you that."
        - id: ch01-b37
          speaker: dickie
          text: "Look, what I'm trying to say is..."
        - id: ch01-b38
          speaker: narrator
          text: >-
            Dickie stopped in the middle of what he meant to say. What good would it do to tell Beale the truth? Dickie had left the dream and come back into this hard world for Beale's sake. But Beale did not believe the dream had been real. He could not understand what it had meant to Dickie, and now he seemed to hate the very sound of it. So Dickie left that part unsaid.
        - id: ch01-b39
          speaker: dickie
          text: >-
            Don't turn against me. Dream or no dream, you and me will stick together. I won't do things that are wrong, or play low, dirty tricks. But I know we can manage without them. If you could choose any honest work, what would you like to do?
        - id: ch01-b40
          speaker: mr_beale
          text: >-
            I never learned a trade. I can handle a horse, though. I was a wagoner's mate when I was a boy, and I like horses. Dogs too. But I'm no good with my hands. Not for proper work.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Dickie pushed away a wild idea. He had imagined returning to the dream, learning a useful trade, then waking and teaching it to Beale.
        - id: ch01-b42
          speaker: dickie
          text: "Isn't there anything else you'd care to do?"
        - id: ch01-b43
          speaker: mr_beale
          text: "Can't think of anything. Unless it was pigeons."
        - id: ch01-b44
          speaker: narrator
          text: >-
            A new thought came to Dickie. Perhaps a thing learned in a dream might stay learned after waking. He did not mean facts alone. He meant something his hands had learned to do. The Greek and Latin from the dream had certainly stayed with him. The words were still there in his mind, almost singing to him, and they seemed to encourage him to make the test.
        - id: ch01-b45
          speaker: dickie
          text: >-
            Don't get cross when I talk about the dream. You don't know what it was like. I wasn't fooling you. I really dreamed I could carve wood and make boxes. I wish I had some fine-grained wood so I could try. I've still got the sharp knife they gave me to cut the basket string on the train.
        - id: ch01-b46
          speaker: mr_beale
          text: "What kind of wood?"
        - id: ch01-b47
          speaker: dickie
          text: "The box in my dream was mahogany. I would like to try that."
        - id: ch01-b48
          speaker: mr_beale
          text: >-
            Poor little chap's gone queer in the head, and it's my doing for sending him on that Talbot Court job.
          emotion: sad
        - id: ch01-b49
          speaker: narrator
          text: "Beale stretched himself and stood up."
        - id: ch01-b50
          speaker: mr_beale
          text: >-
            I'll find you a bit of mahogany somewhere. I didn't mean anything, old chap. Tell me all you like about your dreams. I don't mind. I like hearing them. Now let's buy two kippers and make a night of it.
        - id: ch01-b51
          speaker: narrator
          text: "They went back to the lodging-house at Gravesend."
        - id: ch01-b52
          speaker: narrator
          text: >-
            The next day, Mr. Beale produced one lonely leg from an old sofa. It was mahogany, fat and round and turned, with well-seasoned wood.
        - id: ch01-b53
          speaker: mr_beale
          text: "Is this what you wanted?"
        - id: ch01-b54
          speaker: narrator
          text: "Dickie seized it eagerly."
        - id: ch01-b55
          speaker: dickie
          text: >-
            I wonder if I truly can. It feels exactly as if I can. Father, let's take our food into some quiet woods. Somewhere nobody can ask what I'm doing or laugh at me.
        - id: ch01-b56
          speaker: narrator
          text: >-
            They found exactly the place Dickie wanted. It was hidden in the heart of a green wood, a warm little nest filled with sunshine where no one would stop to question him or make fun of his work. Through all the long, warm hours of that autumn day, Beale lay at ease in the sun. Beside him, Dickie bent over the old sofa leg. His face looked very pale, but he was utterly determined. With the knife the gardener had given him, he sliced away the wood, chipped at it, and carefully picked out the smaller pieces.
        - id: ch01-b57
          speaker: narrator
          text: >-
            It was difficult to make Dickie put the work down even when dinner was ready. To him, that dinner was both delicious and extravagant. They had fresh new bread, German sausage, and beer carried in a flat bottle. But the food could hardly compete with the joy of the work. From the first instant when his knife touched the mahogany, Dickie knew the answer to his question. He had not forgotten. Back in the dream, he had worked in the Deptford dockyard under the watchful eyes of Sebastian, the shipwright who had helped to sink the Armada. Now every movement his hands had learned there belonged to him here as well. Alone in a wood beyond Gravesend, he could do the work again.
        - id: ch01-b58
          speaker: narrator
          text: "After dinner, Beale began to pay attention."
        - id: ch01-b59
          speaker: mr_beale
          text: "Well, I'll be! You know how to do it somehow. That's a box, ain't it?"
          emotion: surprised
        - id: ch01-b60
          speaker: dickie
          text: >-
            A box, with a lid that fits. I'll carve our arms on top. See that raised bit? I left it there on purpose.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Dickie had never worked so hard in his life. His back grew tired and his hands had been busy for hour after hour, but he would not give in. He kept at the wood, then kept at it still longer. The light faded until he could scarcely see the edge of his knife or the shape beneath his fingers. Yet before the daylight had entirely gone, the work was done. The round sofa leg had become a finished box. The coat of arms stood carved upon its top, and the lid fitted properly into place.
        - id: ch01-b62
          speaker: mr_beale
          text: >-
            Well, if that ain't a beauty! Plenty of grand fellows would pay half a dollar for a tobacco box like this. You've got yourself a trade, my son. That's certain. Why didn't you tell me before? Blast this match! I've burned my finger.
          emotion: surprised
        - id: ch01-b63
          speaker: narrator
          text: >-
            Beale's match went out, leaving the new box hidden in the dusk again. He and Dickie made their way back to the lodging-house and its crowded room shining with gaslight. Supper that night seemed very luxurious. There was tripe with onions, and fried potatoes as well. When the meal was over and the people of the lodging-house were still gathered together, Beale got to his feet and took his place in front of the fire. He meant to show them what Dickie's hands had made.
        - id: ch01-b64
          speaker: mr_beale
          text: >-
            I'm holding an auction! Here is a very pretty little box. Use it for tobacco or snuff, or shut your gold and diamonds inside. Who'll make an offer?
        - id: ch01-b65
          speaker: black_browed_woman
          text: "Pass it around, then."
        - id: ch01-b66
          speaker: narrator
          text: >-
            The woman had black brows and eyes as dark as the American cloth covering her basket.
        - id: ch01-b67
          speaker: mr_beale
          text: >-
            I'll carry it around in my own hand, and nobody else will do the carrying.
        - id: ch01-b68
          speaker: narrator
          text: >-
            Beale carried the box around the room himself. He took it from one person to the next, but he did not let it leave his own hand. To each lodger he showed the workmanship with growing pride. The corners were neat. The carving on top was neat as well. Most impressive of all was the square lid, which sat so closely and fitted exactly where it should.
        - id: ch01-b69
          speaker: red_handkerchief_man
          text: "Where did you steal that?"
        - id: ch01-b70
          speaker: mr_beale
          text: "The nipper made it."
        - id: ch01-b71
          speaker: skeptical_lodger
          text: "More likely he stole it."
        - id: ch01-b72
          speaker: mr_beale
          text: "I watched him make it."
        - id: ch01-b73
          speaker: old_cabinetmaker
          text: "Let me have a look."
        - id: ch01-b74
          speaker: narrator
          text: >-
            The voice belonged to a dingy old man dressed in gray, who sat a little way apart from everyone else. Beale had refused to let any of the others handle the box, but for some reason of his own, he trusted this man enough to place it in his hands. Even then, Beale moved close beside him. He watched every turn of the old man's fingers and never once took his eyes from Dickie's box.
        - id: ch01-b75
          speaker: old_cabinetmaker
          text: >-
            Look here, the whole thing is cut from one piece of wood. I don't know who made it, and I don't care who it was. But I know good workmanship when I hold it. This was made by someone who understood his trade. I used to be a cabinetmaker myself, though you might never guess that from the look of me now. The trouble is, nobody in this room has enough money to pay what this little object is really worth. Do as I tell you. Work a drop of cold linseed oil into the wood and leave it alone all night. In the morning, rub it hard against your trouser leg until it shines. After that, rub mud into it so the new shine looks old. Oil it once more, dirty it once more, and there you are. Sell it as a genuine old antique, and someone will give you half a crown for it.
        - id: ch01-b76
          speaker: mr_beale
          text: "Thank you, old fellow. That's exactly what I'll do."
        - id: ch01-b77
          speaker: narrator
          text: >-
            With that settled, Beale slipped the box safely into his pocket. Dickie did not see what he did with it that night. But when the box appeared again, the oil, rubbing, mud, and second oiling had worked their trick. It no longer looked newly cut from an old sofa leg. It looked as old as any dealer could possibly wish an antique box to look.
        - id: ch01-b78
          speaker: mr_beale
          text: >-
            Now we'll find a shop that sells these old antiques.
        - id: ch01-b79
          speaker: narrator
          text: >-
            They were back on the road with their faces turned toward London. Dickie's face was pale and pinched, and Beale noticed.
        - id: ch01-b80
          speaker: mr_beale
          text: "You don't look too good. Wasn't your bed comfortable?"
        - id: ch01-b81
          speaker: dickie
          text: "The bed was all right. I didn't sleep much, though."
        - id: ch01-b82
          speaker: narrator
          text: "He was thinking of the bed in the dream."
        - id: ch01-b83
          speaker: mr_beale
          text: "Did you have any more dreams?"
        - id: ch01-b84
          speaker: dickie
          text: >-
            No. Maybe wanting the dream to come back so badly was what kept me awake.
        - id: ch01-b85
          speaker: mr_beale
          text: "I dare say."
        - id: ch01-b86
          speaker: narrator
          text: >-
            Beale picked up a straw and chewed it as they walked. Dickie limped beside him through the dust of the road. To the boy, the whole world seemed terribly large and hard that day. London still lay a long way ahead, and the dream he wanted had not returned. The more he thought about it, the more he feared that it might never return at all. Then his bad foot caught against a large stone. He would have fallen if Beale had not seized him by the arm. The catch swung Dickie around, and Beale saw that the boy's eyes were thick with tears. Through every mile of all their wandering, these were the first tears Dickie had ever shed.
        - id: ch01-b87
          speaker: mr_beale
          text: "You haven't hurt yourself, have you?"
        - id: ch01-b88
          speaker: dickie
          text: "No. It's only..."
        - id: ch01-b89
          speaker: narrator
          text: "He hid his face against Beale's coat sleeve."
        - id: ch01-b90
          speaker: mr_beale
          text: "What is it, then? Tell your old father."
        - id: ch01-b91
          speaker: dickie
          text: "It's silly."
          emotion: sad
        - id: ch01-b92
          speaker: mr_beale
          text: "Never mind whether it's silly. Out with it."
        - id: ch01-b93
          speaker: dickie
          text: "In that dream, I wasn't lame."
          emotion: sad
        - id: ch01-b94
          speaker: mr_beale
          text: >-
            Well, think of that! You ought to dream it every night. Then you won't mind your leg so much in the daytime.
        - id: ch01-b95
          speaker: dickie
          text: "But it makes me mind more. Much, much more."
          emotion: sad
        - id: ch01-b96
          speaker: narrator
          text: >-
            Beale did not try to answer that. Without another word, he shifted the things piled in the perambulator and found enough room for Dickie among them. The boy climbed in, and Beale pushed him onward along the road. Little by little, Dickie's sobs and sniffs became quieter. Then there was only the sound of their journey and a long silence between them. After some time had passed, Dickie spoke again.
        - id: ch01-b97
          speaker: dickie
          text: >-
            Father, I'm sorry I was so silly. You've never seen me cry before, and you won't again.
        - id: ch01-b98
          speaker: mr_beale
          text: "That's all right, mate."
        - id: ch01-b99
          speaker: dickie
          text: "Have you got much money left?"
        - id: ch01-b100
          speaker: mr_beale
          text: "We're not doing too badly."
        - id: ch01-b101
          speaker: dickie
          text: >-
            I want to give that little box to the man who lent me the train fare to reach you in Gravesend.
        - id: ch01-b102
          speaker: mr_beale
          text: "Pay him another day, when we've got more."
        - id: ch01-b103
          speaker: dickie
          text: >-
            I'd rather pay him now. I can make another box. There's some of the sofa leg left, isn't there?
        - id: ch01-b104
          speaker: narrator
          text: >-
            There was still enough wood for another box. Dickie used every odd moment he could find to work on it. He carved in the loose half-hours around their meals, in the short time before they went to bed, and again while they waited to start each morning. As they traveled, Beale begged from any passerby who looked likely to give. He soon noticed that his nipper no longer joined in with some clever story meant to soften a stranger's heart. Dickie stayed almost entirely silent. Only when Beale directly appealed to him would the boy offer one simple line.
        - id: ch01-b105
          speaker: dickie
          text: "Father is very good to me. I don't know what I'd do without him."
        - id: ch01-b106
          speaker: narrator
          text: >-
            At last the road brought them back to New Cross. Beale stopped at the Railway Hotel and stepped inside for half a pint. Dickie went on alone toward the pawnbroker who had helped him. His crutch struck the pavement with its familiar clickety-clack at every step, announcing his progress along the street before he reached the shop.
        - id: ch01-b107
          speaker: pawnbroker
          text: "Here you are again. Have you come to pawn the rattle?"
        - id: ch01-b108
          speaker: narrator
          text: >-
            Dickie laughed. Pawning the rattle had somehow become an old joke between them.
        - id: ch01-b109
          speaker: dickie
          text: >-
            Look, mister. You remember the money you lent me to get to Gravesend? It was very good of you, sir.
        - id: ch01-b110
          speaker: pawnbroker
          text: "If you've come for another loan, you aren't getting one."
        - id: ch01-b111
          speaker: narrator
          text: "The pawnbroker had already blamed himself for being so trusting and generous."
        - id: ch01-b112
          speaker: dickie
          text: "I haven't come to borrow. I want to repay you."
        - id: ch01-b113
          speaker: pawnbroker
          text: "Have you got the money?"
        - id: ch01-b114
          speaker: narrator
          text: "He laughed, but not unkindly."
        - id: ch01-b115
          speaker: dickie
          text: "No, but I have this."
        - id: ch01-b116
          speaker: narrator
          text: "Dickie passed the little box across the counter."
        - id: ch01-b117
          speaker: pawnbroker
          text: "Where did you get it?"
        - id: ch01-b118
          speaker: dickie
          text: "I made it."
        - id: ch01-b119
          speaker: pawnbroker
          text: "Well, well. I won't ask questions, and you won't tell lies. Is that the bargain?"
        - id: ch01-b120
          speaker: dickie
          text: >-
            I shall certainly tell you no lies. Will you take the box instead of the money?
        - id: ch01-b121
          speaker: narrator
          text: >-
            Dickie spoke with the dignity of the boy he had been in his dream, the boy who was not lame and who stood heir to an old and gentle name. The pawnbroker did not answer at once. He turned the little box over in his hands and examined it from every side. Inside him, kindness and honesty struggled fiercely against the habits he had learned through a lifetime of business. Dickie did not hurry him. He waited in complete silence, letting his eyes travel over the shop. There were china vases, concertinas, and teaspoons tied together so that they spread out in the shape of fans.
        - id: ch01-b122
          speaker: pawnbroker
          text: >-
            This is worth more than I lent you, and not everyone would admit that.
        - id: ch01-b123
          speaker: dickie
          text: >-
            I know they wouldn't. Please take it for my debt. If it's worth more, then accept the rest as a grateful gift from someone who is still in your debt.
        - id: ch01-b124
          speaker: pawnbroker
          text: >-
            You could make your fortune on the music-hall stage. The way you talk is astonishing. Very well. I'll take the box as full payment. But you may as well tell me where you got it.
        - id: ch01-b125
          speaker: dickie
          text: "I made it."
        - id: ch01-b126
          speaker: narrator
          text: "He pressed his lips tightly together."
        - id: ch01-b127
          speaker: pawnbroker
          text: >-
            You did, did you? Then here's an offer. I'll pay you four shillings for every box you make and bring me. You could carve different coats of arms on them.
        - id: ch01-b128
          speaker: dickie
          text: "I only learned how to make one."
        - id: ch01-b129
          speaker: narrator
          text: >-
            Before they could say more, another customer entered the shop. She was a woman carrying the things she had been forced to part with. Her husband had no work, and there was no food for the children. She had brought her best Sunday dress and a pair of sheets to pawn so that the family could eat.
        - id: ch01-b130
          speaker: pawnbroker
          text: "Run along now. I've nothing more for you today."
        - id: ch01-b131
          speaker: narrator
          text: "Dickie flushed and left."
        - id: ch01-b132
          speaker: narrator
          text: >-
            Three days later, Dickie's crutch clattered through the pawnbroker's door again. He set two more little boxes on the counter.
        - id: ch01-b133
          speaker: dickie
          text: "Here they are."
        - id: ch01-b134
          speaker: narrator
          text: >-
            The pawnbroker looked at the two boxes and could hardly believe what he saw. He exclaimed over them, questioned Dickie, and wondered again at the work. In the end, Dickie walked out with eight silver shillings in his pocket. Never before in his life had he carried coins that were truly his own. As he felt their weight, they seemed almost magical, as if some fairy mint had struck them especially for him. They were utterly different from every bit of money that had passed through his hands before.
        - id: ch01-b135
          speaker: narrator
          text: >-
            Beale waited for him near New Cross Station with an empty pipe between his lips. When he saw Dickie coming, he slipped the pipe into his pocket and strolled down the road to meet him. Dickie did not display the money there in the open street. He drew Beale around the corner into a side street. Only then did he open his hand and hold out all that wonderful silver.
        - id: ch01-b136
          speaker: dickie
          text: >-
            That's two days' work. We don't have to take the road unless we fancy a trip. I've got a trade now. Four shillings a day makes twenty-four shillings a week, doesn't it?
        - id: ch01-b137
          speaker: mr_beale
          text: "Good Lord, look at all that!"
          emotion: surprised
        - id: ch01-b138
          speaker: narrator
          text: "His mouth fell open."
        - id: ch01-b139
          speaker: dickie
          text: >-
            Now here's what we need to do. You find some more old sofa legs for me to carve. Get me a sharpening stone too, and one of those leather straps for putting a good edge on my knife. Once we have those, we're set. Just think of it, Father. Twenty-four shillings every week for a man and his nipper. That ain't bad at all, is it? I've thought through every part and settled the whole plan. As long as the warm weather lasts, we can keep sleeping outdoors in the bed with green curtains. Every day, I'll have a green wood like this for my workshop. Then, when the nights turn cold, we'll take some of our money and rent a room that belongs to us. We'll have a place of our very own, and we'll live like grand gentlemen together.
        - id: ch01-b140
          speaker: narrator
          text: "Dickie's eyes shone with excitement."
        - id: ch01-b141
          speaker: mr_beale
          text: "Upon my word, I believe you actually like working."
          emotion: surprised
        - id: ch01-b142
          speaker: dickie
          text: "I like it better than begging."
        - id: ch01-b143
          speaker: narrator
          text: >-
            They did exactly as Dickie had planned. Beale found wood and the things needed to keep the knife sharp, while Dickie settled into his new trade. For the first two days, Beale was perfectly content with the arrangement. He ate, lay back, and dozed in the warmth. Then he woke and watched Dickie's quick fingers turn old wood into something worth money. After that, he ate and dozed again. By the third day, however, all that idleness no longer suited him. He announced that the fidgets had got into his legs and he could not stay still.
        - id: ch01-b144
          speaker: mr_beale
          text: >-
            I need a prowl. I'll be back before sundown. Eat your dinner when the sun reaches the top of that tall tree. So long, mate.
        - id: ch01-b145
          speaker: narrator
          text: >-
            Beale slouched away through the sunshine, still dressed in his filthy old clothes, and Dickie remained behind to work alone. The wood around him was green and gold with autumn light. It was so still that Dickie hardly seemed to move at all. Each chip that dropped from his carving fell more softly than the occasional twig or acorn tumbling from a high branch. A goldfinch balanced on a swaying hazel twig and studied the quiet boy with bright, fearless eyes. A grass snake slid swiftly past. It had particular business of its own, so it was not afraid of Dickie, and Dickie was not afraid of it. A wood pigeon crossed the glade, its broad wings rustling through the air. Once, a squirrel ran to the end of a bough just to look down at him. It chattered and made its tail thick, exactly as a cat does when it is angry.
        - id: ch01-b146
          speaker: narrator
          text: >-
            The day was long and very beautiful. It was also the first whole day Dickie had ever spent alone. He gave himself completely to his carving and worked harder than he had worked before. At last the light began to lessen. When it grew too dim for him to see the knife safely, he had to stop. Dickie leaned his tired back against the root of a tree and rested there. As he looked at the day's work, he allowed himself to glory in it. He had finished two boxes since morning. At the pawnbroker's price, those two boxes meant eight shillings. In one single day, his own hands had earned eight splendid shillings.
        - id: ch01-b147
          speaker: narrator
          text: >-
            The sun had completely set when Beale returned. He looked strangely fat. As he lowered himself onto the moss, something beneath the front of his jacket moved and whimpered.
        - id: ch01-b148
          speaker: dickie
          text: >-
            Oh, what is it? Is it a dog? Father, you don't know how long I've wanted a dog!
          emotion: surprised
        - id: ch01-b149
          speaker: mr_beale
          text: "You've got your wish three times over."
        - id: ch01-b150
          speaker: narrator
          text: >-
            Beale unbuttoned the front of his jacket. From inside it, he drew out a double handful of soft, fluffy creatures. For a moment, Dickie could make out nothing but sprawling legs, round heads, waving tails, and small warm bodies all mixed together. Then Beale set them free, and there they were. He had brought home three fat little puppies, every one of them white.
        - id: ch01-b151
          speaker: dickie
          text: "Oh, the jolly little beasts! Aren't they fine? Where did you get them?"
          emotion: happy
        - id: ch01-b152
          speaker: mr_beale
          text: "A country lady gave them to me."
        - id: ch01-b153
          speaker: narrator
          text: "He retied his handkerchief and gazed up at the soft blue evening sky."
        - id: ch01-b154
          speaker: dickie
          text: "Try another story."
        - id: ch01-b155
          speaker: mr_beale
          text: >-
            No use trying to fool a nipper as sharp as you. All right, then. Truth is, I bought them.
        - id: ch01-b156
          speaker: dickie
          text: "With what?"
        - id: ch01-b157
          speaker: mr_beale
          text: "With money, mate. Money, of course."
        - id: ch01-b158
          speaker: dickie
          text: "Where did you get it?"
        - id: ch01-b159
          speaker: narrator
          text: "Beale gave no answer."
        - id: ch01-b160
          speaker: dickie
          text: "You didn't steal it?"
        - id: ch01-b161
          speaker: mr_beale
          text: >-
            No, I swear I didn't! Stealing leads to trouble. I've learned that lesson.
        - id: ch01-b162
          speaker: dickie
          text: "Then you begged for it?"
        - id: ch01-b163
          speaker: mr_beale
          text: "Well, what if I did?"
        - id: ch01-b164
          speaker: dickie
          text: "You've ruined everything!"
          emotion: angry
        - id: ch01-b165
          speaker: narrator
          text: >-
            Dickie was suddenly furious. All the hope and pride he had felt in their honest new life seemed to fall apart at once. He snatched up the two boxes he had just finished and flung them violently onto the ground. Then he sat with his eyes lowered, frowning at the earth. Beale at once went down on his hands and knees. Whatever else had happened, he was not going to leave eight shillings' worth of boxes lying there. He gathered up both of them and inspected Dickie's work in wonder.
        - id: ch01-b166
          speaker: mr_beale
          text: "Two boxes! There never was another nipper like you."
          emotion: surprised
        - id: ch01-b167
          speaker: dickie
          text: >-
            It doesn't matter. You've spoiled it all, and you lied to me too. Everything's ruined. I wish I'd never come back from the dream.
          emotion: sad
        - id: ch01-b168
          speaker: mr_beale
          text: >-
            Now you listen to me. I won't stand for this. Who's the master, you or me? You think I'll let a little nipper bully and drive me about? I could knock you down with one hand, as easy as I could knock over one of those pups.
          emotion: angry
        - id: ch01-b169
          speaker: narrator
          text: >-
            As Beale spoke, he moved one foot among the puppies, comparing Dickie to the little creatures. They were soft but strong, and they had no idea that a quarrel was taking place above them. They crowded around Beale's broken boot, making fierce little baby growls. Then they attacked the old leather with their tiny white teeth and tugged at it as though it were their greatest enemy.
        - id: ch01-b170
          speaker: dickie
          text: "Go on, then. Knock me down if you want. I don't care."
          emotion: sad
        - id: ch01-b171
          speaker: mr_beale
          text: >-
            Now, now, mate. I was only joking. Don't take it that way. You know I'd never hurt a hair on your head.
        - id: ch01-b172
          speaker: dickie
          text: >-
            I wanted us to live honestly by our own work, and we were doing it. Now you've dragged us back to begging. That's what I can't bear.
          emotion: angry
        - id: ch01-b173
          speaker: mr_beale
          text: >-
            It wasn't begging, not the way you mean. I didn't have to say one word of begging talk. I came upon a wedding and stopped for a look. A water cart had stopped for a look too, and it had made a puddle as broad as a tea tray. The water spread right across the path. The lady stood there in all her white wedding clothes and looked down at the wet ground. Then the gentleman beside her looked at her spotless white boots and wondered how she was to cross. That's when I pulled off my coat, quick as you like. I did it just like that Raleigh gentleman you told me about in one of your stories. I flung the coat flat in the middle of the puddle, right there in front of the lady. She looked at me and gave me a smile like an angel. Then she held out her hand to thank me. It had a white glove on it and everything. And you know the state my hands are in, mate.
        - id: ch01-b174
          speaker: dickie
          text: "Yes. Go on."
        - id: ch01-b175
          speaker: mr_beale
          text: >-
            She did not draw back from me. She touched my hand with that clean white glove, and then she stepped onto my coat and walked safely across the puddle. All the people around the wedding began laughing and clapping as though it were a show. Silly apes, the lot of them. The gentleman rewarded me with half a crown. Now, I'd first spotted these pups a month ago, and I already knew I could have all three for five shillings. So that's what I spent the money on. It was business, mate. I'll sell those pups for three times what they cost, you see if I don't. And I thought you'd be pleased as anything. There was me behaving like a gentleman out of one of your own fine tales, and there were the pups waiting here to surprise you. But the very first minute I get back, you turn on me as though I've ruined us. That's always how it goes.
        - id: ch01-b176
          speaker: dickie
          text: >-
            Please forgive me, Father. I'm so sorry. It was kind of you, and I am pleased. I love the pups. We won't sell all three, will we? I'd so like to keep one. I'll call it True, after one of the dogs in my dream. You do forgive me, don't you?
          emotion: sad
        - id: ch01-b177
          speaker: mr_beale
          text: "That's all right."
        - id: ch01-b178
          speaker: narrator
          text: >-
            The next day once again found a little boy at work by himself in a wood. Yet this time Dickie was not truly alone. Close around him, a small puppy sprawled in the leaves, gave sharp little yaps, tumbled into scraps with things that moved, and grunted over its important puppy affairs. With such a busy companion, Dickie had to divide his attention between the mahogany and the dog. No squirrels came near him that day, and no birds visited to brighten the solitude. He did not miss them. True was more to him than any number of birds or squirrels could have been.
        - id: ch01-b179
          speaker: narrator
          text: >-
            Around True's neck was a piece of blue ribbon. It had come from a woman Dickie and Beale overtook on the road. Beale had given her basket a lift by setting it on the perambulator, and in return she cut off a bit of ribbon for the puppy. The woman traveled from door to door selling ribbons, reels of cotton, and needles. It was a hard way to earn a living, and she told them plainly that she made a poor thing of it. Then, looking across the fields through tired, bleary eyes, she remembered how different her family fortunes had once been.
        - id: ch01-b180
          speaker: ribbon_seller
          text: "And my grandfather once farmed land of his own in Sussex."
        - id: ch01-b181
          speaker: narrator
          text: >-
            The memory seemed to stay with her as her bleary eyes looked out over the fields. Dickie remembered her words while he worked. But True kept tumbling close, asking for play and attention in all the ways a puppy can. By the end of that day, Dickie had not matched his earlier record. He had completed one whole box and only part of a second.
        - id: ch01-b182
          speaker: narrator
          text: >-
            While Dickie sat carving in the distant wood, another part of their new business was taking place far away in London. A respectable-looking man walked up and down Regent Street. Shoppers moved around him, motorcars passed, and carriages rolled along the busy road. Beneath each of the man's arms was a fluffy little white dog. By the time his work in Regent Street was finished, Beale had sold both puppies.
        - id: ch01-b183
          speaker: mr_beale
          text: >-
            One went to a lady in a carriage. I asked her two half-crowns and never blinked. She didn't care about the price. Called it a dear little darling and said she wanted it. Her gentleman offered to find her a better one, but no, she wanted that pup, and she got it. A fool and his money soon part company, that's what I say. The other went cheap, just fourteen shillings, to a black clergyman from foreign parts. So now we're grand gentlemen. I'll buy myself a ready-made suit tonight. And what do you say to that room you wanted?
        - id: ch01-b184
          speaker: narrator
          text: >-
            This was the beginning of a new life for both of them. Dickie meant to know exactly where their money came from and where it went. Near the horse trough by the Chequers, he found a broad paving stone that would serve as his account book. A man gave him a piece of billiard chalk, and Dickie carefully wrote down every amount. On the money-coming-in side, he listed four boxes at four shillings each. Then came the dogs, forty shillings for one and fourteen for the other. Altogether, the money received came to seventy shillings. Next he made the spending side. The dogs had cost four shillings. Their food had cost nineteen, tram fares had taken four, and another sofa leg had cost two. All their spending together came to twenty-nine shillings.
        - id: ch01-b185
          speaker: narrator
          text: >-
            Dickie studied the two totals before he rubbed the chalk from the stone. He checked his figures and worked through the difference for himself. Seventy shillings had come in, and twenty-nine had gone out. What remained came to about two whole pounds. Dickie had never owned anything like that much money in his life. To him, the sum was almost beyond imagining. Beale had not had so much at one time for many a long year either. Their work with the boxes and the puppies had truly changed their fortunes. At last Beale came back to the horse trough, wiping his mouth as he approached. Dickie erased the chalk figures only after he was satisfied that the reckoning was right. The accounts were finished, their earnings were safe, and the two of them set off together. With no need to hurry, they walked idly up the road toward their new life.
