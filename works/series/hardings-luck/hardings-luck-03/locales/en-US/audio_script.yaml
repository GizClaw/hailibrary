  chapters:
    - id: ch01
      title: The Escape
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Lady Talbot leaned over the great bed to wake Dickie Harding. As she looked at him, she wished with all her heart that she had a little boy just like him. Dickie opened his eyes and met her kind gaze. If he had ever had a mother, he felt sure she would have looked like this lady.
        - id: ch01-b02
          speaker: dickie
          text: >-
            Only her face, mind. Not her clothes or her hair or any of that.
        - id: ch01-b03
          speaker: lady_talbot
          text: "Did you sleep well?"
        - id: ch01-b04
          speaker: narrator
          text: "She stroked his hair with extraordinary gentleness."
        - id: ch01-b05
          speaker: dickie
          text: "Like a proper treat."
        - id: ch01-b06
          speaker: lady_talbot
          text: "And was the bed comfortable?"
        - id: ch01-b07
          speaker: dickie
          text: >-
            Wasn't it soft! I never felt anything so soft, except maybe the geese hanging up along Broadway at Christmas.
        - id: ch01-b08
          speaker: lady_talbot
          text: "Why, the bed is stuffed with goose feathers."
        - id: ch01-b09
          speaker: narrator
          text: "That delightful coincidence pleased Dickie very much."
        - id: ch01-b10
          speaker: dickie
          text: "Have you got a little boy of your own?"
        - id: ch01-b11
          speaker: lady_talbot
          text: >-
            No, dear. If I had, you could borrow some of his clothes. I'm afraid we'll have to put you back into your own.
        - id: ch01-b12
          speaker: narrator
          text: "Lady Talbot sounded sorry, though Dickie could see nothing to be sorry about."
        - id: ch01-b13
          speaker: dickie
          text: "My father bought me a little coat for cold nights when we sleep out."
        - id: ch01-b14
          speaker: lady_talbot
          text: "Sleep out? Where?"
        - id: ch01-b15
          speaker: dickie
          text: "In the bed with the green curtains."
        - id: ch01-b16
          speaker: narrator
          text: >-
            That brought him to Hereward, and Dickie would gladly have told the hero's whole history. Lady Talbot promised they could talk after breakfast. First came his bath. A maid in a pink print dress, white cap, and apron had quietly brought a bath and cans of steaming water to the fireplace at the far end of the room.
        - id: ch01-b17
          speaker: lady_talbot
          text: "Come along, then."
        - id: ch01-b18
          speaker: narrator
          text: >-
            She turned back the bedclothes. Without his crutch, Dickie had to crawl clumsily across the floor. He could not bear to let her see him do it. Not because she might laugh at him, but perhaps because he knew she would not. There was no other way to reach the bath, and suddenly, for no reason he could explain, he began to cry. Lady Talbot had her arms around him at once.
        - id: ch01-b19
          speaker: lady_talbot
          text: "What is it, dear? Whatever is the matter?"
        - id: ch01-b20
          speaker: dickie
          text: >-
            I haven't got my crutch, and I can't get to that bath without it. Anything would do, even an old broom cut down to my height. I'm a cripple, you see. I can't walk the way you can.
          emotion: sad
        - id: ch01-b21
          speaker: narrator
          text: >-
            She carried him to the warm water. There was scented soap, a sponge, and a soft, fluffy towel.
        - id: ch01-b22
          speaker: dickie
          text: "I haven't had a bath since Gravesend."
        - id: ch01-b23
          speaker: narrator
          text: "He flushed as soon as the secret slipped out."
        - id: ch01-b24
          speaker: lady_talbot
          text: "Since when, dear?"
        - id: ch01-b25
          speaker: dickie
          text: "Since Wednesday."
        - id: ch01-b26
          speaker: narrator
          text: >-
            Dickie and Lady Talbot breakfasted in a large room with long windows. Sunlight streamed through them, and outside lay a green garden. All kinds of food waited in silver dishes. Even the eggs sat in silver cups. Dogs like the one carved on the foot of the bed appeared on every spoon and fork. Only the little slender spoon Dickie used for his egg was different. Instead of a dog, it bore another mark.
        - id: ch01-b27
          speaker: dickie
          text: "Why, Tinkler has that very same mark on him!"
          emotion: surprised
        - id: ch01-b28
          speaker: lord_talbot
          text: "And how are we this morning, Dickie?"
        - id: ch01-b29
          speaker: narrator
          text: >-
            Lord Talbot had just come in and kissed his wife. Dickie had already told Lady Talbot all about Tinkler, and now he told the whole story again. Lady Talbot quickly began with, “I told you so, Edward,” and ended by saying she had known Dickie was no common child. Dickie missed everything in between. His egg had burst down one side and was running into the salt. It had to be stopped at any cost, and his tongue was the easiest tool.
        - id: ch01-b30
          speaker: lord_talbot
          text: "Whoa! Don't eat the egg cup. We shall need it again. Have another egg."
        - id: ch01-b31
          speaker: narrator
          text: >-
            Lord Talbot laughed, but Dickie's pride was hurt. Surely the man knew the difference between licking and eating. Besides, no one could eat an egg cup. Dickie refused another egg and felt glad when Lord Talbot left.
        - id: ch01-b32
          speaker: narrator
          text: >-
            After breakfast, they measured Dickie for a crutch by holding a broom beside him and cutting its handle to length. Lady Talbot wrapped flannel around the bristly end, then sewed black velvet over it. Dickie thought the finished crutch beautiful and told her so. To show his gratitude, he invited her to see how lively he could be on his feet. She watched only briefly. Then she turned away and gazed through the window.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Dickie looked around instead and studied the room and its furniture. Everything seemed different from anything he remembered, yet strangely familiar. There were tall-backed chairs covered in flowers like the flowers on carpets. Carved bookcases held row after row of books decorated with gold. A polished sideboard curved outward, its handles shining like gold, and a corner cupboard behind glass displayed china in red, blue, and golden colors. The feeling was very odd. Dickie had the pleasure of seeing beautiful new things and, at the same time, the pleasure of meeting beautiful old things he had not seen for a very long while.
        - id: ch01-b34
          speaker: narrator
          text: >-
            His limping tour ended by the windows. Lady Talbot suddenly knelt, put a hand beneath his chin, and looked into his eyes.
        - id: ch01-b35
          speaker: lady_talbot
          text: "Dickie, would you like to stay here and be my little boy?"
        - id: ch01-b36
          speaker: dickie
          text: "I'd like it well enough, only I have to go back to Father."
        - id: ch01-b37
          speaker: lady_talbot
          text: "What if your father says you may stay?"
        - id: ch01-b38
          speaker: dickie
          text: "He won't. And there's Tinkler besides."
        - id: ch01-b39
          speaker: lady_talbot
          text: >-
            Then you shall be my little boy until we discover where your father is. We'll tell the police. They'll be sure to find him.
        - id: ch01-b40
          speaker: dickie
          text: "The police? But Father hasn't done anything!"
          emotion: fearful
        - id: ch01-b41
          speaker: lady_talbot
          text: >-
            No, no, of course he hasn't. The police know where people are and what they're doing, even when they haven't done anything wrong.
        - id: ch01-b42
          speaker: dickie
          text: "The police know a good deal too much."
        - id: ch01-b43
          speaker: narrator
          text: >-
            One longing now filled Dickie's whole mind, and one thought kept his brain wide awake. The police meant to track Beale, the man he called Father. Beale had been kind to him. He had pushed Dickie for mile after mile in a perambulator through enchanted country. He had bought him a little coat to wear outdoors when the nights turned cold or wet. And he had shown Dickie the wonderful world that opens before anyone who has slept in the bed with green curtains.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Lady Talbot's house was lovelier than anything Dickie had imagined. Yet it was not lovelier than certain other things he almost seemed to remember, though he could not quite reach those memories. And the lady herself was more than lovely. She was dear. Hers were the eyes a child wanted to laugh with, and hers were the arms a child wanted around him when he cried. Outside, the broad parkland spread among scattered trees. To Dickie, it was the Land of Heart's Desire.
        - id: ch01-b45
          speaker: narrator
          text: "But Beale had been kind, and Dickie loved him."
        - id: ch01-b46
          speaker: narrator
          text: >-
            Lady Talbot left Dickie with the most beautiful book he had ever seen. There were three great volumes, filled with pictures of people and events from the days of Hereward onward. The author had the charming name of Green. To Dickie, that name brought back green curtains and nights beneath the stars. Yet even those marvelous pictures could not turn his thoughts from Beale. What if the police began asking where Father was and what he was doing? Somehow Dickie must reach the Gravesend lodging house. He remembered the kindly tramp folk there, the herrings they had toasted, and the apples they had given to little boys who helped.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Dickie had helped them then. By every rule of fair play, someone ought to help him now. He stopped seeing the beautiful book before him. He wanted only a friend who would help him, and the friend he found was an enemy.
        - id: ch01-b48
          speaker: narrator
          text: >-
            The maid in the pink dress, white cap, and apron came in carrying a duster. Her name was Markham. She had brought the bath without Dickie noticing, and now she looked at him with open dislike.
        - id: ch01-b49
          speaker: markham
          text: "Pushing yourself in here, aren't you?"
        - id: ch01-b50
          speaker: dickie
          text: "I'm not."
        - id: ch01-b51
          speaker: markham
          text: >-
            If she wants a child to make a fuss over, I've got clever brothers and sisters. Why not choose one of them?
        - id: ch01-b52
          speaker: dickie
          text: "Nobody said they weren't clever, and nobody's making a fool of me."
        - id: ch01-b53
          speaker: markham
          text: >-
            Oh, of course not. People come here without even a shirt and make fools of their betters instead. Hasn't she asked you to stay and be her little boy?
        - id: ch01-b54
          speaker: dickie
          text: "Yes."
        - id: ch01-b55
          speaker: markham
          text: >-
            I knew it. You'll stay, too. But if anyone expects me to call you Master Whatever-your-silly-name-is, I'll give a month's notice. That's plain enough.
        - id: ch01-b56
          speaker: dickie
          text: "I don't want to stay. At least..."
        - id: ch01-b57
          speaker: markham
          text: "Go on, tell me another one."
        - id: ch01-b58
          speaker: narrator
          text: >-
            Markham left without once using her duster. Later, Lady Talbot took Dickie driving in a little carriage behind a cream-colored pony with a long tail. To Dickie, that pony was a perfect dream, and Lady Talbot even let him hold the reins. But not even that delight made him forget Beale. He asked whether she had sent the police after Father yet, and felt deeply relieved when she said she had not.
        - id: ch01-b59
          speaker: narrator
          text: >-
            When they returned, Markham was ordered to wash his hands. She was the enemy with the clever brothers and sisters.
        - id: ch01-b60
          speaker: markham
          text: "Wash them yourself. That's not my work."
        - id: ch01-b61
          speaker: dickie
          text: >-
            You'd better do it, or the lady will see the difference. It isn't my work either. I'm not as used to washing as you are, and that's the truth.
        - id: ch01-b62
          speaker: narrator
          text: "So Markham washed him, though none too gently."
        - id: ch01-b63
          speaker: dickie
          text: "There's no use taking it out on me. I never asked to come here."
        - id: ch01-b64
          speaker: markham
          text: "No, you little thief!"
          emotion: angry
        - id: ch01-b65
          speaker: dickie
          text: "Stop that!"
          emotion: angry
        - id: ch01-b66
          speaker: narrator
          text: "Markham glanced at his tightly set lips."
        - id: ch01-b67
          speaker: markham
          text: >-
            Well, you're near enough to one. After last night, I'd be ashamed to show my face here. You're dry now. Off you go to the dining room. The servants' hall is good enough for honest people who don't break into houses.
        - id: ch01-b68
          speaker: narrator
          text: >-
            The rest of that wonderful day brought real roses Dickie could pick and smell and real gooseberries he could gather and eat. There were picture books, a clockwork bear, a musical box, and a dollhouse nearly as large as a small villa. Through every wonder, an idea kept hammering on the far side of a locked door in Dickie's mind. At last, when he was in bed, the door opened. The idea came out and stood before him, and Dickie recognized it at once as something truly useful.
        - id: ch01-b69
          speaker: lady_talbot
          text: "Markham will bring warm milk. Drink it all and sleep well, darling."
        - id: ch01-b70
          speaker: narrator
          text: "With his idea clear before him, Dickie put his arms around her neck."
        - id: ch01-b71
          speaker: dickie
          text: "Goodbye. You are good, and I do love you."
        - id: ch01-b72
          speaker: narrator
          text: "Lady Talbot went away very pleased. When Markham brought the milk, Dickie spoke at once."
        - id: ch01-b73
          speaker: dickie
          text: "You want me gone, don't you?"
        - id: ch01-b74
          speaker: markham
          text: "I don't care one way or the other."
        - id: ch01-b75
          speaker: dickie
          text: "But how can I get away with my crutch?"
        - id: ch01-b76
          speaker: markham
          text: "You mean you'd run off if your legs were like mine?"
        - id: ch01-b77
          speaker: dickie
          text: "Yes."
        - id: ch01-b78
          speaker: markham
          text: "And you wouldn't steal anything?"
        - id: ch01-b79
          speaker: dickie
          text: "Not one blooming thing."
        - id: ch01-b80
          speaker: markham
          text: "Well, you have got spirit. I'll say that for you."
        - id: ch01-b81
          speaker: dickie
          text: "I want to get back to Father, you see."
        - id: ch01-b82
          speaker: markham
          text: "Bless the child."
        - id: ch01-b83
          speaker: narrator
          text: "That touched Markham in spite of herself."
        - id: ch01-b84
          speaker: dickie
          text: "Why not help me out? Once I'm beyond the park, I'll manage."
        - id: ch01-b85
          speaker: markham
          text: "It could cost me my place. Don't say another word and land me in trouble."
        - id: ch01-b86
          speaker: narrator
          text: >-
            Dickie said many more words. Still, he fell asleep satisfied, because Markham's last two words were, “We'll see.”
        - id: ch01-b87
          speaker: narrator
          text: >-
            Markham woke him when daylight had barely begun. She dressed him quickly and carried him, with his crutch, down the back stairs. They entered the very butler's pantry whose window Dickie had climbed through at the red-haired man's command. No one else seemed to be stirring.
        - id: ch01-b88
          speaker: markham
          text: >-
            Listen. The gardener has hampers of fruit and flowers ready, and he drives them to the station before anyone is up. They'd only go to waste if he didn't sell them. He's a particular friend of mine, and one extra hamper won't bother him. Out you go. Joe, are you there?
        - id: ch01-b89
          speaker: joe
          text: "I'm here."
        - id: ch01-b90
          speaker: narrator
          text: "Markham lifted Dickie to the window and kissed him as she did it."
        - id: ch01-b91
          speaker: markham
          text: "Cheer up, old chap. I'm sorry I was so sharp. You truly want to leave, don't you?"
        - id: ch01-b92
          speaker: dickie
          text: "No mistake. And I'll never tell about him selling the vegetables and things."
        - id: ch01-b93
          speaker: markham
          text: "You're too sharp to live."
        - id: ch01-b94
          speaker: narrator
          text: "A moment later, Dickie was through the window. Joe laid him in a long hamper half full of straw."
        - id: ch01-b95
          speaker: joe
          text: >-
            I'll load you with the other hampers. Once you're on the train, cut the string with this little knife. It's yours. The guard knows me, so I'll settle things with him, and he'll put you off wherever you say.
        - id: ch01-b96
          speaker: markham
          text: "Here, don't forget his breakfast."
        - id: ch01-b97
          speaker: narrator
          text: >-
            It was a splendid breakfast: five cold rissoles, plenty of bread and butter, two slices of cake, and a bottle of milk. Dickie found it great fun to eat such agreeable and unusual things while lying down in the roomy hamper among smooth straw. The cart jolted along, but that did not trouble a boy accustomed to riding in a perambulator. He ate all he wanted, tucked the rest into his pocket, and curled up comfortably in the straw.
        - id: ch01-b98
          speaker: narrator
          text: >-
            Much of what ordinary people call night remained, and so did the sleepiness Dickie had carried to bed at the end of his wonderful day. This was not only the tiredness of the body, like the feeling after a long walk or a whole day of play. His mind was sleepy too. So much had happened during the past thirty-six hours that his poor little brain felt completely worn out. He fell asleep among the straw with his fingers resting on the clasp knife in his pocket, imagining how smartly he would cut the string when the proper moment came.
        - id: ch01-b99
          speaker: narrator
          text: >-
            Dickie slept for a very long time. When he woke, there was no need to cut the string. Someone else had already done it. The hamper stood open, and three or four faces peered down at him.
        - id: ch01-b100
          speaker: flower_girl_1
          text: "Why, it's a little boy! And he has a crutch. Oh, dear!"
          emotion: surprised
        - id: ch01-b101
          speaker: narrator
          text: >-
            Dickie sat up, knocking the crutch that lay across the hamper. It fell and clattered on the floor.
        - id: ch01-b102
          speaker: flower_girl_2
          text: "Well, I never! Come out, dear. There's no need to be frightened."
          emotion: surprised
        - id: ch01-b103
          speaker: narrator
          text: >-
            How kind people were, Dickie thought. He reached for the slender white hands held out to him. Their owner was a lady in black, and her figure was as slender as her hands. She put her arms around him, lifted him free of the hamper, and settled him on a black bentwood chair. Dickie's eyes moved quickly here and there. One swift look told him he had landed in a shop full of flowers and fruit.
        - id: ch01-b104
          speaker: flower_girl_2
          text: "Mr. Rosenberg, please come here! It's this extra hamper..."
        - id: ch01-b105
          speaker: narrator
          text: "A dark, handsome man with a large nose came toward them."
        - id: ch01-b106
          speaker: flower_girl_2
          text: "There's a dear little boy inside it."
        - id: ch01-b107
          speaker: narrator
          text: "She had a pale, kind face, dark eyes, and very red lips."
        - id: ch01-b108
          speaker: mr_rosenberg
          text: >-
            I suppose this is a practical joke. Our gardening friend needs a lesson, and I shall see that he gets one.
        - id: ch01-b109
          speaker: dickie
          text: "It wasn't his fault. It was mine. I fell asleep."
        - id: ch01-b110
          speaker: narrator
          text: "The girls gathered around Dickie with questions and caresses."
        - id: ch01-b111
          speaker: dickie
          text: >-
            I was meant to cut the string on the train and tell the guard. He's the gardener's friend. But I slept so soundly. It was almost like the sleepy stuff they gave me at the hospital.
        - id: ch01-b112
          speaker: narrator
          text: >-
            I would rather not believe Markham went so far as to put sleepy stuff in that bottle of milk. Still, she was not very particular about such things. She may have decided that sending Dickie sound asleep on his journey was safest. Then he could not betray either Markham or her gardener friend until he was very far away from them both.
        - id: ch01-b113
          speaker: mr_rosenberg
          text: "But why put boys in baskets? It upsets everyone."
          emotion: angry
        - id: ch01-b114
          speaker: dickie
          text: >-
            It was a sort of joke. I don't want to upset anybody. If you'll lift me down and give me my crutch, I'll be off.
        - id: ch01-b115
          speaker: narrator
          text: "The young ladies refused to hear of his leaving."
        - id: ch01-b116
          speakers: [flower_girl_1, flower_girl_2, flower_girl_3]
          ensemble: chorus
          text: >-
            May we keep him, Mr. Rosenberg? Let him stay until closing time, and one of us can take him home. He says he lives in London.
        - id: ch01-b117
          speaker: narrator
          text: >-
            Dickie had murmured something to that effect, as policemen say when they are unsure of the exact words. He guessed Mr. Rosenberg must be kind, or the girls would never have dared ask him.
        - id: ch01-b118
          speaker: mr_rosenberg
          text: "As you like. Just don't let him interfere with business."
        - id: ch01-b119
          speaker: narrator
          text: >-
            They carried Dickie into the back of the shop. The dear girls were very kind to him there. They gave him grapes, a banana, and Marie biscuits to eat. Then they carefully folded sacks so he would have a soft place to lie down.
        - id: ch01-b120
          speaker: narrator
          text: >-
            Dickie liked the girls and felt truly grateful to them. All the same, he kept watching for a chance to leave. However kind people might be, he still had one thing he must do. Father had told him to return to the Gravesend lodging house, and back to that house he meant to go.
        - id: ch01-b121
          speaker: narrator
          text: >-
            No chance came until late afternoon. One girl was boiling a kettle over a spirit lamp. Another had gone out to buy cakes especially in Dickie's honor. That made him uncomfortable, but duty was duty. Above the Gravesend lodging house, the star of duty seemed to shine and beckon him onward. Meanwhile, the third girl and Mr. Rosenberg were deep in a lively explanation with a fair-haired young gentleman. He had ordered a basket of roses, and the basket had never been delivered.
        - id: ch01-b122
          speaker: mr_rosenberg
          text: "Cash paid at once ensures speedy delivery."
        - id: ch01-b123
          speaker: flower_girl_3
          text: "I am terribly sorry, sir. There was a misunderstanding."
        - id: ch01-b124
          speaker: narrator
          text: >-
            Their two voices made the music for Dickie's escape. He edged beside the grapes and melons, gripping the shelf that held them so his crutch would not tap against the floor and betray him. Slowly and silently, he passed between the window full of roses and the heap of bananas decorating the other side of the doorway. Then he turned the corner, threw one arm over his crutch, and hurried for his life down a covered arcade.
        - id: ch01-b125
          speaker: narrator
          text: >-
            Around the next corner lay a wilderness of baskets, carts, and vegetables. Dickie threaded his way in and out among the baskets, over fallen cabbage leaves, and beneath the noses of horses. At last he reached a quiet street, then found an even quieter archway. He took out his new knife. However the adventure ended, at least he would have that knife to show for it. Now he could cut the money out of the belt Mr. Beale had buckled around him.
        - id: ch01-b126
          speaker: narrator
          text: >-
            The belt was not there. Had it fallen off somewhere along the way? Or had Dickie and Markham simply forgotten to put it on during that hurried dressing in the half-light? He could not tell. He knew only that the belt was gone, that he stood alone in London with no money, and that Father was in Gravesend waiting for him. Waiting and waiting. Dickie knew very well what it meant to wait.
        - id: ch01-b127
          speaker: narrator
          text: "He returned to the street and asked the first friendly-looking idler how to reach Gravesend."
        - id: ch01-b128
          speaker: loafer
          text: "Gravesend, your grandmother! Don't come giving me cheek."
        - id: ch01-b129
          speaker: dickie
          text: "But which way is it?"
        - id: ch01-b130
          speaker: narrator
          text: "The man studied him, then jabbed a dirty thumb over his shoulder."
        - id: ch01-b131
          speaker: loafer
          text: "It's thirty miles if it's a yard. Got any money?"
        - id: ch01-b132
          speaker: dickie
          text: "I lost it. My father's in Gravesend waiting for me."
        - id: ch01-b133
          speaker: loafer
          text: "Go on! You won't fool me that easily."
        - id: ch01-b134
          speaker: dickie
          text: "I'm not asking you for anything but the way."
        - id: ch01-b135
          speaker: loafer
          text: "No, you're not. Are you telling the truth? Your father's really there? Swear on the Bible?"
        - id: ch01-b136
          speaker: dickie
          text: "Yes."
        - id: ch01-b137
          speaker: narrator
          text: "The man hesitated, then drew a hand from his pocket."
        - id: ch01-b138
          speaker: loafer
          text: >-
            Take the first right, then the first left. A blue bus there will carry you to the Elephant. That's part of the way. Ask again when you arrive. Here, these coppers will pay your fare.
        - id: ch01-b139
          speaker: narrator
          text: >-
            That useful kindness touched Dickie more deeply than all the flower-shop girls' kisses. Tears rose in his eyes.
        - id: ch01-b140
          speaker: dickie
          text: "You really are a pal. I'll do the same for you one day."
        - id: ch01-b141
          speaker: loafer
          text: >-
            I'll hold you to that, mate. When you're riding in your carriage and pair, perhaps you'll hire me as your footman.
        - id: ch01-b142
          speaker: dickie
          text: "When I am, I will."
        - id: ch01-b143
          speaker: narrator
          text: "Dickie meant it quite seriously, and then they both laughed."
        - id: ch01-b144
          speaker: narrator
          text: >-
            The Elephant and Castle marked only a very short stage on the weary road between London and Gravesend. When Dickie climbed down from the tram, he had to ask the way again. This time he chose a woman sitting in the gutter and selling matches. She lifted the blue box in her hand and pointed out the road with it.
        - id: ch01-b145
          speaker: match_seller
          text: "It's a long road. Close to thirty miles."
        - id: ch01-b146
          speaker: dickie
          text: "Thank you, missus."
        - id: ch01-b147
          speaker: narrator
          text: >-
            Quite simply, Dickie set off to walk those nearly thirty miles. His route followed the Old Kent Road, and before long the streets around him became familiar. The Old Kent Road led into New Cross Road, which ran straight through the yellow-brick wilderness where his aunt lived. Dickie dared not follow the road through all those well-known places. At any moment he might meet his aunt. What would happen if he did? He preferred not to let himself think about it.
        - id: ch01-b148
          speaker: narrator
          text: >-
            Outside the Marquis of Granby stood a van whose horses faced away from London. Could Dickie get a lift? He looked anxiously to his right and left, then in front and behind. The van held a great many wooden boxes, but their tops stopped two feet below the canvas cover. There was room for him above them. Across the canvas, fat white letters advertised Fry's Tonic and called it the only cure.
        - id: ch01-b149
          speaker: narrator
          text: >-
            Dickie wondered what to do. Should he wait until the carter came out of the Marquis and ask the man directly for a lift? Or, if he could manage the climb, should he hide on top of the boxes and take his chance of being discovered after the van was moving? He looked around once more, then laid one hand on the tailboard.
        - id: ch01-b150
          speaker: schoolboy
          text: "Hey, Dickie! Is that you?"
        - id: ch01-b151
          speaker: narrator
          text: >-
            Feeling like a trapped wild creature, Dickie admitted it was. The speaker was a schoolmate his own age, the very boy who had named him Dot-and-go-one.
        - id: ch01-b152
          speaker: dickie
          text: "You gave me a turn. I thought you were my aunt. Don't tell anyone you saw me."
        - id: ch01-b153
          speaker: schoolboy
          text: "Where have you been?"
        - id: ch01-b154
          speaker: dickie
          text: "Oh, here and there. Just don't tell my aunt."
        - id: ch01-b155
          speaker: schoolboy
          text: "Your aunt? Don't you know?"
        - id: ch01-b156
          speaker: narrator
          text: "He sounded scornful that Dickie knew nothing."
        - id: ch01-b157
          speaker: dickie
          text: "Know what?"
        - id: ch01-b158
          speaker: schoolboy
          text: >-
            She's cleared out. Old Hurle moved her, but he claims he can't remember where. I say she bought him a pint so he'd forget.
        - id: ch01-b159
          speaker: dickie
          text: "Who's living in the house now?"
        - id: ch01-b160
          speaker: narrator
          text: "Sudden desperate worry swallowed every thought of his aunt's new address."
        - id: ch01-b161
          speaker: schoolboy
          text: >-
            Nobody. It's shut up with a sign saying, “To let. Apply Roberts, 796 Broadway.” What are you going to do?
        - id: ch01-b162
          speaker: dickie
          text: "I don't know. Which way are you going?"
        - id: ch01-b163
          speaker: schoolboy
          text: "Home. I pass your old shop. Coming along?"
        - id: ch01-b164
          speaker: dickie
          text: "No. So long. Maybe I'll see you again one day. I have to go this way."
        - id: ch01-b165
          speaker: narrator
          text: >-
            And he went that way. The van and the hoped-for lift no longer mattered. Even so, twilight found Dickie creeping down the old road toward the house whose backyard had held the rabbit hutch. There was the garden where he had sown the parrot food, and where the moonflowers had come up so white and beautiful. How long ago it all seemed! In truth, it had been only a month, yet to Dickie it felt like a very long time indeed.
        - id: ch01-b166
          speaker: narrator
          text: >-
            News of his aunt's departure changed everything. For the moment, his steady wish to reach Father in Gravesend gave way to a burning fear for Tinkler and the white stone. Had his aunt discovered them and carried them off? But if she had not, and they were still hidden in the house, Dickie ought to fetch them at once. Someone else might rent the place, find his treasures, and take them. Yes, the wise thing was to go in that very night through the front window. Its catch had always been broken. He would recover Tinkler and the stone, or at least make quite certain they were gone.
        - id: ch01-b167
          speaker: narrator
          text: >-
            No one noticed Dickie keeping close to the railings. There were so many boys in those streets. The front window opened easily. He climbed through and dragged his crutch behind him.
        - id: ch01-b168
          speaker: narrator
          text: >-
            On hands and knees, he went upstairs as quickly as he could. He made straight for the loose floorboard, worked it free, and felt inside the hollow beneath it. Oh, joy! His searching hands closed around the familiar soft bundle of rags. Tinkler and the seal were still wrapped safely inside. Dickie tucked the bundle into the front of his shirt and shuffled back downstairs. It was not too late to cover a mile or two on the Gravesend road. Before he left, though, he wanted one last look at the moonflower.
        - id: ch01-b169
          speaker: narrator
          text: >-
            The tall flower stalk still stood in the garden as the dusk deepened around it. Dickie reached out and touched it. The stalk that had once been green was dry and hard beneath his hand. At his touch, three or four small dry objects fell from somewhere above and rattled against his head.
        - id: ch01-b170
          speaker: dickie
          text: "Seeds, of course."
        - id: ch01-b171
          speaker: narrator
          text: >-
            Dickie knew much more about seeds now than when he had saved the parrot food. A boy his age could hardly tramp about the country for a month without learning something about them. He took out the knife that should have cut the hamper's string on the train. Then he opened it and cut through the moonflower stalk with great care. Only a few seeds fell and were lost. Dickie held the stalk upright and steady as he crept back into the house, like someone carrying a cross at the head of a procession.
        - id: ch01-b172
          speaker: narrator
          text: >-
            By then the house was quite dark, but a streetlamp cast its light into the bare, empty, dusty front room. A torn newspaper lay on the floor. Dickie spread one sheet flat, knelt beside it, and shook the moonflower head over the paper. Dozens upon dozens of seeds came rattling out. They were larger than sunflower seeds, but flatter and rounder. In the lamplight they shone like silver, or like the shining pods of the plant people call honesty.
        - id: ch01-b173
          speaker: dickie
          text: "Oh, beautiful, beautiful!"
          emotion: happy
        - id: ch01-b174
          speaker: narrator
          text: >-
            He let the smooth, shining shapes slide through his fingers. If you have ever played with mother-of-pearl counters from a card game, you know what the moonflower seeds looked like. Dickie drew Tinkler and the seal from his shirt and laid them on top of the silvery heap. Then, all at once, he understood just how tired he was. He could not travel another step toward Gravesend that night.
        - id: ch01-b175
          speaker: dickie
          text: >-
            I'll sleep here. There are plenty of newspapers, and I'll start in the morning before anyone is up.
        - id: ch01-b176
          speaker: narrator
          text: >-
            Dickie knew from experience that newspapers made warm bedding, though they were noisy. He gathered every scrap of paper and straw scattered around the house and built himself a pile in a corner away from the window. Sleeping alone in an empty house did not frighten him. Instead, having a whole house to himself made him feel grand, lordly, and magnificent. The food left in his pockets served as supper. When he wanted a drink, he went to the washhouse tap, put his head beneath it, and turned the water on very slowly.
        - id: ch01-b177
          speaker: narrator
          text: >-
            For one final pleasure, Dickie laid all his treasures out on the newspaper. Tinkler and the seal went in the middle. Around them he arranged the pearly counters in patterns, first circles, then squares and oblongs. The seeds lay very flat and fitted closely together, which made them excellent for building shapes. At last Dickie formed a six-pointed star in three shining rows of silvery seeds. The rattle and seal rested in its center, and the light from the streetlamp gleamed brightly over it all.
        - id: ch01-b178
          speaker: dickie
          text: "That's the prettiest one of all."
        - id: ch01-b179
          speaker: narrator
          text: "Dickie Harding was alone in the empty house. And then the magic began."
