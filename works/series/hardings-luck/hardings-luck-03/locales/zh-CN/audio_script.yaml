audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机敏，带着克制的幽默与讲故事的悬念
        timbre: 温暖清亮
        pace: 舒展而有变化
        pitch: 中音
    dickie:
      display_name: 迪基
      tts:
        delivery: 聪明敏感，街头口吻直率，学书中人物说话时郑重夸张
        timbre: 清脆稚嫩
        pace: 稍快，受委屈时断续
        pitch: 中高音
    eleanor:
      display_name: 埃莉诺
      tts:
        delivery: 温柔镇定，怜悯中带着坚定
        timbre: 柔和文雅
        pace: 从容
        pitch: 中音
    sir_edward:
      display_name: 爱德华爵士
      tts:
        delivery: 威严警醒，处事干脆实际
        timbre: 坚定浑厚
        pace: 适中
        pitch: 中低音
    markham:
      display_name: 马卡姆
      tts:
        delivery: 尖刻好强，粗声里偶尔透出心软
        timbre: 清亮偏硬
        pace: 偏快
        pitch: 中高音
    joe:
      display_name: 乔
      tts:
        delivery: 压低声音，爽快而务实
        timbre: 粗实温厚
        pace: 适中
        pitch: 中低音
    flower_girl_1:
      display_name: 花店姑娘甲
      tts:
        delivery: 温柔热心，说话轻快
        timbre: 纤细柔和
        pace: 适中
        pitch: 中高音
    flower_girl_2:
      display_name: 花店姑娘乙
      tts:
        delivery: 惊喜亲切，富有年轻人的活力
        timbre: 明亮清脆
        pace: 稍快
        pitch: 中高音
    flower_girl_3:
      display_name: 花店姑娘丙
      tts:
        delivery: 礼貌周到，忙碌时仍很耐心
        timbre: 清澈柔和
        pace: 适中
        pitch: 中音
    mr_rosenberg:
      display_name: 罗森伯格先生
      tts:
        delivery: 精明务实，咬字略含混，生气时仍有分寸
        timbre: 浑厚偏暗
        pace: 偏慢
        pitch: 低音
    loafer:
      display_name: 闲汉
      tts:
        delivery: 起初粗鲁多疑，后来爽直友善
        timbre: 沙哑松散
        pace: 适中
        pitch: 中低音
    matchwoman:
      display_name: 卖火柴的女人
      tts:
        delivery: 疲惫平淡，言语简短
        timbre: 干涩低哑
        pace: 偏慢
        pitch: 中低音
    schoolboy:
      display_name: 同学
      tts:
        delivery: 好奇嘴快，带着孩子气的取笑
        timbre: 清亮稚嫩
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 逃走
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            塔尔博特夫人俯身越过大床，叫醒迪基·哈丁。她望着这个孩子，真希望自己也有一个这样的小男孩。迪基睁眼看见她慈爱的目光，也认定了，要是自己曾有母亲，那张脸一定就像她。
        - id: ch01-b02
          speaker: dickie
          text: 不过也只是脸像。衣裳不会是这样的，头发也不会。
        - id: ch01-b03
          speaker: eleanor
          text: 昨晚睡得好吗？
        - id: ch01-b04
          speaker: narrator
          text: 她轻轻抚摸着迪基的头发，温柔得叫人惊讶。
        - id: ch01-b05
          speaker: dickie
          text: 好得不得了。
        - id: ch01-b06
          speaker: eleanor
          text: 那张床舒服吗？
        - id: ch01-b07
          speaker: dickie
          text: >-
            软得没话说。我这辈子摸过的东西，恐怕没有比它更软的了。除非是圣诞节挂在百老汇街边的那些鹅。
        - id: ch01-b08
          speaker: eleanor
          text: 原来这张床正是鹅毛做的呀。
        - id: ch01-b09
          speaker: narrator
          text: 这个巧合让迪基快活极了。他还惦记着醒来时冒出的第一个念头。
        - id: ch01-b10
          speaker: dickie
          text: 您有自己的小男孩吗？
        - id: ch01-b11
          speaker: eleanor
          text: >-
            没有，亲爱的。要是有，我就能借他的衣裳给你穿了。现在只好还让你穿自己的。
        - id: ch01-b12
          speaker: narrator
          text: 夫人说得很遗憾，迪基却不懂这有什么可遗憾的。
        - id: ch01-b13
          speaker: dickie
          text: 我爸爸给我买了件小外套。我们睡在外头，天冷的时候我就穿它。
        - id: ch01-b14
          speaker: eleanor
          text: 睡在外头？睡在哪儿呢？
        - id: ch01-b15
          speaker: dickie
          text: 睡在挂绿帷幕的床上。
        - id: ch01-b16
          speaker: narrator
          text: >-
            这话牵出了赫里沃德。迪基很愿意把英雄的故事从头讲到尾，夫人却让他留到早饭后再讲，因为眼下该洗澡了。壁炉前已经放着一盆热水。迪基先前根本没留意，那个穿粉红印花裙、戴白帽、系白围裙的女仆提着水罐进来过。
        - id: ch01-b17
          speaker: eleanor
          text: 来吧。
        - id: ch01-b18
          speaker: narrator
          text: >-
            夫人掀开被子。迪基忽然受不了让她看见自己趴在地板上笨拙地爬。没有拐杖，他只能这么挪动。他不是怕夫人笑话，也许正因为知道她绝不会笑，他才更难受。可他又没法走到澡盆边。迪基说不清这是怎么回事，眼泪一下掉了下来。夫人赶紧把他搂住。
        - id: ch01-b19
          speaker: eleanor
          text: 亲爱的，怎么了？究竟出了什么事？
        - id: ch01-b20
          speaker: dickie
          text: >-
            我的拐杖不见了。我没有拐杖，就到不了澡盆那里。什么都能用，哪怕把旧扫帚截得跟我一样高也行。大家都说我是瘸子。我不能像您那样走路。
          emotion: sad
        - id: ch01-b21
          speaker: narrator
          text: >-
            夫人把他抱到澡盆边。那里备着香皂、海绵，还有一条暖和又蓬松的毛巾。
        - id: ch01-b22
          speaker: dickie
          text: 我从格雷夫森德以后就没洗过澡了。
        - id: ch01-b23
          speaker: narrator
          text: 话一出口，迪基才知道自己说漏了嘴，脸立刻红了。
        - id: ch01-b24
          speaker: eleanor
          text: 亲爱的，你说从什么时候以后？
        - id: ch01-b25
          speaker: dickie
          text: 从星期三以后。
        - id: ch01-b26
          speaker: narrator
          text: >-
            早饭摆在一间大屋子里。阳光穿过长窗，外面是一片碧绿的花园。各样食物放在银盘上，连每一只鸡蛋都有自己的银蛋杯。刀、叉、匙子上全刻着小狗，模样跟楼上床尾板上的小狗一模一样。只有迪基吃鸡蛋用的细柄小匙不同，上面刻着另一个完全不同的图案。
        - id: ch01-b27
          speaker: dickie
          text: 咦，我的叮当儿上也有这个！真的，一模一样。
          emotion: happy
        - id: ch01-b28
          speaker: narrator
          text: >-
            他只好把叮当儿的故事全讲了一遍。夫人听得又认真又入神。后来爱德华爵士进来，亲了亲夫人，又问迪基今早觉得怎么样，于是迪基把故事再讲了一遍。夫人随即飞快地说了一大串话。开头是“爱德华，我早就告诉过你”，结尾是“我早知道他不是普通孩子”。中间那一段，迪基一句也没听见。他的鸡蛋突然从一边裂开，蛋黄流进盐里。这样的灾难非拦住不可，而舌头用起来最方便。
        - id: ch01-b29
          speaker: sir_edward
          text: 喂，别连蛋杯也吃了，我们还要用呢。再给你拿一个鸡蛋吧。
        - id: ch01-b30
          speaker: narrator
          text: >-
            迪基的自尊心受了伤，怎么也不肯再要。他心想，这位绅士真够笨的，竟然分不清舔和吃。何况蛋杯怎么可能吃得下去。爱德华爵士离开时，迪基别提多高兴了。
        - id: ch01-b31
          speaker: narrator
          text: >-
            早饭后，人们照着迪基的身量做了一根拐杖。他们把扫帚立在他身边比好高矮，截下一段扫帚柄。夫人用法兰绒裹住扫帚毛，外面又缝上黑天鹅绒。迪基觉得它漂亮极了，还请夫人看看他的两条腿有多利索。夫人只看了一会儿，便转头望向窗外。
        - id: ch01-b32
          speaker: narrator
          text: >-
            迪基正好仔细看看这间屋子。高背椅铺着花卉织物，花纹跟地毯上的相同。雕花书柜里一排排全是书，书脊上有一粒粒金色凸点。弧形餐具柜擦得锃亮，拉手也像金子一样闪光。墙角的玻璃门橱柜里，瓷器有红的、蓝的，也有金灿灿的。每样东西明明都和他记忆中的不同，他却忍不住觉得，自己从前好像见过这一切。这感觉古怪极了。他看着每一样东西，都能得到两份快乐。一份来自头一次见到美丽的新东西，另一份又像久别以后，重新见到古老的美物。
        - id: ch01-b33
          speaker: narrator
          text: >-
            他一瘸一拐地巡视完屋子，最后来到窗边。夫人忽然转过身，跪下来，一手托住他的下巴，直望进他的眼睛。
        - id: ch01-b34
          speaker: eleanor
          text: 迪基，你愿意留在这里，做我的小男孩吗？
        - id: ch01-b35
          speaker: dickie
          text: 我倒很愿意，可我得回爸爸那里去。
        - id: ch01-b36
          speaker: eleanor
          text: 要是你爸爸答应呢？
        - id: ch01-b37
          speaker: dickie
          text: 他不会答应的。再说，还有叮当儿呢。
        - id: ch01-b38
          speaker: eleanor
          text: >-
            那么，在我们查清爸爸在哪里以前，你先留在这里，做我的小男孩吧。我们会通知警察，他们一定能找到他。
        - id: ch01-b39
          speaker: dickie
          text: 警察！爸爸又没做坏事！
          emotion: fearful
        - id: ch01-b40
          speaker: eleanor
          text: >-
            没有，当然没有。可警察知道许多事情。他们知道一个人在哪里、正在做什么，就算那个人什么坏事也没做，他们也知道。
        - id: ch01-b41
          speaker: dickie
          text: 警察知道这么多东西，真叫人讨厌。
        - id: ch01-b42
          speaker: narrator
          text: >-
            现在，迪基小小的心里只剩一个愿望，小小的脑袋也只能想一件事。他们要让警察去追查比尔。比尔就是他叫作爸爸的人。那个人一直待他很好，推着婴儿车，载他走过一英里又一英里的魔法国土。那个人还给他买了小外套，让他夜里天冷或下雨时穿。只要在挂绿帷幕的床上睡过一晚，迪基醒来就会看见比尔带给他的奇妙世界。
        - id: ch01-b43
          speaker: narrator
          text: >-
            夫人的宅邸比他想象过的一切都美，可又比不上某些他仿佛记得的东西。夫人比美丽还要好，她可亲又可爱。看着她的眼睛，人就想笑。偎进她怀里，人又能放心地哭。园地上点缀着树木，在迪基眼里，那正是心愿中的地方。可是还有爸爸，还有比尔。那个善待他，也让他爱着的人。
        - id: ch01-b44
          speaker: narrator
          text: >-
            夫人让他独自看一本美得超乎梦想的书。全书有三大卷，画着从赫里沃德的时代起，世上发生过、存在过的种种事物。作者姓格林，这个悦耳的名字叫迪基想起绿色帷幕，也想起星空下的夜晚。可再美的图画，也不能让他不去想比尔先生。比尔因为收养他、爱他，成了他的爸爸。要是警察真去查比尔在哪里、在做什么，那可怎么办？他无论如何都得回格雷夫森德，回到那所用水桶给他洗过澡，或者说差不多算洗过澡的客栈。那里有善良的流浪汉烤鲱鱼，还有人把苹果送给帮忙的小男孩。
        - id: ch01-b45
          speaker: narrator
          text: >-
            那时候，迪基帮过别人。照公平办事的规矩，现在也该有人帮他了。摊在桌上的书，他已经看不见，也不在乎。他只想找个愿意帮忙的朋友。这个朋友果然来了，偏偏还是他的敌人。
        - id: ch01-b46
          speaker: narrator
          text: >-
            那个利落的女仆拿着掸子走进来。她穿着粉红裙，戴着白帽，系着白围裙。先前正是她趁迪基没留意时送来了澡盆和热水。现在，她恶狠狠地瞪着迪基。
        - id: ch01-b47
          speaker: markham
          text: 你倒真会往人家家里钻。
        - id: ch01-b48
          speaker: dickie
          text: 我才没有。
        - id: ch01-b49
          speaker: markham
          text: >-
            她非要找个孩子来犯傻，难道我家就没有聪明的弟弟妹妹？
        - id: ch01-b50
          speaker: dickie
          text: 没人说你家没有，也没人拿我来犯傻。
        - id: ch01-b51
          speaker: markham
          text: >-
            哟，当然没有。有人连件像样的衬衫都没有，就跑进来，把比自己体面的人哄得团团转。难道不是这样？她是不是叫你留下，做她的小男孩？
        - id: ch01-b52
          speaker: dickie
          text: 是。
        - id: ch01-b53
          speaker: markham
          text: >-
            啊，我就知道。你也一定会留下。可你以后要我管你叫少爷，不管你那个傻名字是什么，我都提前一个月辞工。这话我先说明白。
        - id: ch01-b54
          speaker: dickie
          text: 我不想留下。至少……
        - id: ch01-b55
          speaker: markham
          text: 哟，接着编吧。
        - id: ch01-b56
          speaker: narrator
          text: >-
            马卡姆不耐烦地走了，手里的掸子从头到尾一下也没用。后来，迪基坐着小马车出去兜风。乳白色的小马拖着长尾巴，简直像梦里才会出现的马，夫人甚至让迪基亲手握住缰绳。可他再快活，也没忘记问她有没有叫警察去找爸爸。听说还没有，他这才真正放下心来。
        - id: ch01-b57
          speaker: narrator
          text: >-
            兜风回来，马卡姆奉命替迪基洗手。她正是那个夸自己弟弟妹妹聪明的敌人。她站在肥皂、银器、大理石和海绵中间，冷冷看着他。
        - id: ch01-b58
          speaker: markham
          text: 自己洗。这可不是我的活儿。
        - id: ch01-b59
          speaker: dickie
          text: >-
            你最好还是替我洗，不然夫人一看就知道不一样。这也不是我的活儿。我可不像你那样常洗手，实话就是这样。
        - id: ch01-b60
          speaker: narrator
          text: 马卡姆只好替他洗，动作可一点也不轻。
        - id: ch01-b61
          speaker: dickie
          text: 你不用这么恨我。我又没求着来这里，对不对？
        - id: ch01-b62
          speaker: markham
          text: 对，你这个小贼！
          emotion: angry
        - id: ch01-b63
          speaker: dickie
          text: 住嘴！
          emotion: angry
        - id: ch01-b64
          speaker: narrator
          text: 马卡姆瞥见他紧紧抿住的嘴唇，立刻改了口。
        - id: ch01-b65
          speaker: markham
          text: >-
            好吧，反正也差不了多少。出了昨晚那种事，要是换成我，早就没脸待下去了。行啦，手擦干了，快下楼去餐厅吧。我们这些不闯进别人家的老实人，只配在仆人厅吃饭。
        - id: ch01-b66
          speaker: narrator
          text: >-
            这神奇的一天里，迪基闻了真正的玫瑰，吃了真正的醋栗，还看了画册、上发条的熊、音乐盒，以及一座几乎有小别墅那么大的玩具屋。可他脑袋里一直有扇锁住的门，一个念头就在门后砰砰敲。等他躺上床，那个念头终于撞开门，站到了他面前。迪基一眼就认出来，这是个再有用不过的主意。
        - id: ch01-b67
          speaker: eleanor
          text: >-
            马卡姆会送热牛奶来。把它全喝掉，好好睡吧，宝贝。
        - id: ch01-b68
          speaker: narrator
          text: 那个主意就在近旁，清清楚楚。迪基伸出双臂，紧紧抱了一下夫人的脖子。
        - id: ch01-b69
          speaker: dickie
          text: 再见。您真好，我真的爱您。
        - id: ch01-b70
          speaker: narrator
          text: 夫人听了十分欣慰，随后离开了。等马卡姆送来牛奶，迪基便问她。
        - id: ch01-b71
          speaker: dickie
          text: 你巴不得我走，是不是？
        - id: ch01-b72
          speaker: markham
          text: 我才不在乎。
        - id: ch01-b73
          speaker: dickie
          text: 可我带着拐杖，怎么逃得出去？
        - id: ch01-b74
          speaker: markham
          text: 你是说，就算腿跟你一样，你也会溜走？
        - id: ch01-b75
          speaker: dickie
          text: 会。
        - id: ch01-b76
          speaker: markham
          text: 而且什么也不偷？
        - id: ch01-b77
          speaker: dickie
          text: 一丁点儿也不偷。
        - id: ch01-b78
          speaker: markham
          text: 好吧，我承认，你还挺有骨气。
        - id: ch01-b79
          speaker: dickie
          text: 你瞧，我只想回到爸爸身边。
        - id: ch01-b80
          speaker: narrator
          text: 这句话大大感动了马卡姆。
        - id: ch01-b81
          speaker: markham
          text: 可怜的孩子！
        - id: ch01-b82
          speaker: dickie
          text: 你为什么不帮我出去？只要出了这座园子，我自己就没事了。
        - id: ch01-b83
          speaker: markham
          text: 那会让我丢饭碗的。别说了，也别拖我下水。
        - id: ch01-b84
          speaker: narrator
          text: 可迪基又说了许多。最后，他安安心心地睡着了，因为马卡姆临走时留下了一句话。
        - id: ch01-b85
          speaker: markham
          text: 再看看吧。
        - id: ch01-b86
          speaker: narrator
          text: >-
            天才蒙蒙亮，马卡姆便把迪基叫醒。她匆匆替他穿好衣裳，抱着他和拐杖走下后楼梯，来到男管家的餐具室。红头发男人曾叫迪基从这里的窗户爬进屋。四下似乎没有别人。
        - id: ch01-b87
          speaker: markham
          text: >-
            听着，园丁备好了几只大篮子，里面装着水果和鲜花。每天别人还没起床，他就送去车站。这些东西卖不掉也只会坏掉，明白吗？我跟他要好得很，多一只少一只篮子，他不会介意。快出去。乔，你在吗？
        - id: ch01-b88
          speaker: joe
          text: 我在。
        - id: ch01-b89
          speaker: narrator
          text: 马卡姆把迪基托上窗台，趁这工夫亲了亲他。
        - id: ch01-b90
          speaker: markham
          text: >-
            再会啦，小伙计。对不起，我刚才脾气太坏。你是真的想离开，对不对？
        - id: ch01-b91
          speaker: dickie
          text: 一点儿不假。园丁卖蔬菜和别的东西，我也绝不会告密。
        - id: ch01-b92
          speaker: markham
          text: 你机灵得简直活不长。
        - id: ch01-b93
          speaker: narrator
          text: >-
            转眼间，迪基已经穿过窗户。乔把他放进一只铺了半篮稻草的长篮子里。
        - id: ch01-b94
          speaker: joe
          text: >-
            我会把你跟别的篮子一起放进货车。上了火车，你就用这把送你的小刀割断绳子，自己爬出来。我会跟列车员说好，他是我的熟人。你想在哪站下，他都会放你下去。
        - id: ch01-b95
          speaker: markham
          text: 喂，别忘了他的早饭。
        - id: ch01-b96
          speaker: narrator
          text: >-
            这份早饭丰盛极了，有五只凉肉丸、一大堆黄油面包、两片蛋糕，还有一瓶牛奶。迪基躺在宽敞的篮子里，四周全是光滑的稻草，一面吃着这些可口又少见的东西，一面觉得这件事实在好玩。马车一路颠簸，他却一点也不难受。毕竟坐了那么久的婴儿车，他早就习惯这种摇摇晃晃的路了。
        - id: ch01-b97
          speaker: narrator
          text: >-
            吃饱以后，迪基把剩下的食物塞进口袋，舒舒服服地蜷进稻草里。离寻常人所说的天亮还早，昨晚那场神奇的一天结束时留下的困意，也还多得很。那不只是走了一天或玩了一天以后，身体发出的疲倦。三十六小时里发生了这么多事，连他的心神也累了，可怜的小脑袋简直筋疲力尽。他在稻草中睡着，一只手还摸着口袋里的折刀，心里想着，时候一到，自己会多么利落地割断绳子。
        - id: ch01-b98
          speaker: narrator
          text: >-
            他这一觉睡了很久，久得不得了。终于醒来时，篮子上的绳早被别人割开，盖子也敞开了。三四张脸正从上面望着他。
        - id: ch01-b99
          speaker: flower_girl_1
          text: 呀，是个小男孩！还有一根拐杖。哎呀！
          emotion: surprised
        - id: ch01-b100
          speaker: narrator
          text: >-
            迪基坐起身，小拐杖原本斜搁在他上方，被他一碰，猛地滑出去，哗啦一声落在地板上。
        - id: ch01-b101
          speaker: flower_girl_2
          text: 我可从没见过这种事！出来吧，宝贝，别害怕。
          emotion: surprised
        - id: ch01-b102
          speaker: narrator
          text: >-
            迪基心想，人们真是好心。他伸出双手，握住一双朝他递来的纤细白手。一个穿黑衣的姑娘把他拉起来。她身形纤细，双手也是一样。她抱起迪基，把他放到一把黑色曲木椅上。迪基飞快地看看四周，这才知道自己在一间摆满鲜花和水果的铺子里。
        - id: ch01-b103
          speaker: flower_girl_1
          text: 罗森伯格先生，请您快过来看看！这只多出来的篮子……
        - id: ch01-b104
          speaker: narrator
          text: >-
            一个肤色黝黑、相貌英俊、鼻子很大的男人从店里走了过来。穿黑衣的姑娘脸色苍白而和善，有一双黑亮的眼睛，嘴唇红得十分鲜艳。这个男人就是罗森伯格先生，他说话时咬字有些含混。
        - id: ch01-b105
          speaker: flower_girl_1
          text: 篮子里有个很可爱的小男孩。
        - id: ch01-b106
          speaker: mr_rosenberg
          text: >-
            我看，这多半是谁的恶作剧。我们那位种花的朋友该受点教训了，我一定叫他吃到教训。
        - id: ch01-b107
          speaker: dickie
          text: 不是他的错，是我的错。我睡着了。
        - id: ch01-b108
          speaker: narrator
          text: 姑娘们全围过来，又问又哄，疼爱得不得了。迪基坐在高椅上，认真地扭了扭身子。
        - id: ch01-b109
          speaker: dickie
          text: >-
            我本来应该在火车上割断绳子，再告诉列车员。列车员是园丁的朋友。可我睡着了。我从没睡得这么沉过，简直像吃了医院里给我的那种催眠药。
        - id: ch01-b110
          speaker: narrator
          text: >-
            我不愿相信马卡姆真会做到这一步，在那瓶牛奶里放进催眠药。可我又担心，她做事未必有这么多顾忌。也许她觉得，还是让迪基睡着最好。这样，在他离开她和园丁朋友足够远以前，就不会醒来泄露这个秘密。
        - id: ch01-b111
          speaker: mr_rosenberg
          text: >-
            可为什么要把男孩装进篮子？这样闹得大家不得安宁。
          emotion: angry
        - id: ch01-b112
          speaker: dickie
          text: >-
            那是一个玩笑。我不想叫大家不得安宁。您把我抱下来，再把拐杖给我，我马上就走。
        - id: ch01-b113
          speaker: narrator
          text: 可年轻姑娘们说什么也不肯让他马上离开。
        - id: ch01-b114
          speakers: [flower_girl_1, flower_girl_2, flower_girl_3]
          ensemble: chorus
          text: >-
            罗森伯格先生，让他留下吧。等打烊以后，我们找个人送他回家。他自己说，他住在伦敦。
        - id: ch01-b115
          speaker: narrator
          text: >-
            迪基断定罗森伯格先生心地和善，不然姑娘们绝不敢这样跟他说话。至于住在伦敦，迪基确实含含糊糊说过大意如此的话。警察弄不准别人到底说过什么时，就爱用“大意如此”这几个字。
        - id: ch01-b116
          speaker: mr_rosenberg
          text: 随你们。只要别让他妨碍生意，就这么办吧。
        - id: ch01-b117
          speaker: narrator
          text: >-
            姑娘们把迪基带到店堂后面。她们可爱极了，对他也好极了，拿葡萄、香蕉和玛丽饼干给他吃，还把几只麻袋叠起来，让他躺在上面。迪基喜欢她们，也十分感激，却始终在等机会。无论这些人多么好心，他总有一件非做不可的事。他得照爸爸的吩咐，回到格雷夫森德的那家客栈。
        - id: ch01-b118
          speaker: narrator
          text: >-
            机会直到下午很晚才来。一个姑娘用酒精炉烧水，一个姑娘出去给迪基买蛋糕，这让他有点过意不去。可责任终究是责任。格雷夫森德客栈的上空，责任之星正闪闪发亮，召唤着他。第三个姑娘和罗森伯格先生正在跟一位金发的年轻绅士争辩。那位客人订了一篮玫瑰，店里却没送到。
        - id: ch01-b119
          speaker: mr_rosenberg
          text: 付现钱。付了现钱，我们才能保证马上送到。
        - id: ch01-b120
          speaker: flower_girl_3
          text: 实在对不起，先生，这是个误会。
        - id: ch01-b121
          speaker: narrator
          text: >-
            趁他们两个人说话，迪基沿着葡萄和甜瓜一点点挪过去。他一直扶着摆水果的架子，免得拐杖笃笃敲地，引起别人注意。他悄无声息地慢慢穿过堆满玫瑰的橱窗，又从装点门口另一边的香蕉堆旁经过。拐过街角，他把一条胳膊搭在拐杖上，拼命沿着一条有顶棚的拱廊逃走。
        - id: ch01-b122
          speaker: narrator
          text: >-
            又拐一个弯，眼前全是篮子、大车和蔬菜，简直像一片荒野。迪基在里面曲曲折折地穿行，绕过一只只篮子，踩过掉落的卷心菜叶，还从马鼻子底下钻过去。最后，他找到一条清静的街，又找到一个更加清静的门洞。他拿出小刀。不管这场冒险最后怎样，至少这把小刀已经归他了。他准备割开比尔先生系在他身上的腰带，拿出藏在里面的钱。
        - id: ch01-b123
          speaker: narrator
          text: >-
            可是腰带不见了。它是掉在什么地方了，还是清晨光线昏暗，匆忙穿衣时，他和马卡姆都忘了系上？迪基一点也不知道。他只知道腰带不在自己身上，自己孤零零困在伦敦，身上一分钱也没有。爸爸却在格雷夫森德等他，等着，又等着。迪基自己知道，等待到底是什么滋味。
        - id: ch01-b124
          speaker: narrator
          text: 迪基走到街上，拦住第一个看起来还算和气的闲汉，问他去格雷夫森德该走哪条路。
        - id: ch01-b125
          speaker: loafer
          text: 走你外婆那条路。少跟我耍嘴皮子。
        - id: ch01-b126
          speaker: dickie
          text: 可到底该走哪条路？
        - id: ch01-b127
          speaker: narrator
          text: 闲汉仔细打量他，用一根脏兮兮的大拇指往肩后指了指。
        - id: ch01-b128
          speaker: loafer
          text: 少说也有三十英里。你身上有钱吗？
        - id: ch01-b129
          speaker: dickie
          text: 弄丢了。我爸爸正在那儿等我。
        - id: ch01-b130
          speaker: loafer
          text: 去你的！想拿这套话哄我？没那么容易。
        - id: ch01-b131
          speaker: dickie
          text: 我又没问你要东西，只是问路。
        - id: ch01-b132
          speaker: loafer
          text: >-
            这倒没错。你真没哄人？确定？你爸爸在格雷夫森德？敢对《圣经》发誓吗？
        - id: ch01-b133
          speaker: dickie
          text: 敢。
        - id: ch01-b134
          speaker: loafer
          text: >-
            那就到第一个路口右转，再到第一个路口左转。你会看见一辆蓝色公共马车，坐它能到“大象”。这样就走过一小段了，到了那儿再问。还有，这几个铜板够你付车钱。
        - id: ch01-b135
          speaker: narrator
          text: >-
            闲汉把手伸到迪基面前。这份实实在在、真正帮得上忙的好意，比花店姑娘们给他的所有亲吻更能打动他。迪基的眼睛一下涌出了泪水。
        - id: ch01-b136
          speaker: dickie
          text: 你真是个好朋友，一点儿不假。以后我也会替你做同样的事。
        - id: ch01-b137
          speaker: loafer
          text: >-
            这话我记住了，伙计。等你坐上双马大车，也许能雇我给你当跟车仆人。
        - id: ch01-b138
          speaker: dickie
          text: 等我坐上，一定雇你。
        - id: ch01-b139
          speaker: narrator
          text: 迪基说得一本正经。接着，两个人都笑了。
        - id: ch01-b140
          speaker: narrator
          text: >-
            从伦敦到格雷夫森德路途漫长，“大象堡”只是短短的一站。迪基下了有轨马车，又去问路。这回，他问的是坐在路沟里卖火柴的女人。女人用手里的蓝纸盒指了指方向。
        - id: ch01-b141
          speaker: matchwoman
          text: 远得很，差不多还有三十英里。
        - id: ch01-b142
          speaker: dickie
          text: 谢谢您，大婶。
        - id: ch01-b143
          speaker: narrator
          text: >-
            迪基就这样简简单单地出发了，打算步行走完将近三十英里的路。他沿着老肯特路往前，不久便进了熟悉的地方。老肯特路连着新十字路，新十字路又正好穿过姨妈居住的那片黄砖荒野。迪基不敢沿着大路走过那些熟悉的街景，因为每往前一步，都可能迎面撞见姨妈。真要撞见她，会发生什么？他宁愿连想都不去想。
        - id: ch01-b144
          speaker: narrator
          text: >-
            “格兰比侯爵”酒馆外停着一辆货车，马头朝着远离伦敦的方向。迪基焦急地前后左右看了又看，心想也许能搭上一程。车里装着许多木箱，帆布车篷上用粗大的白字写着“弗莱氏补药，唯一良药”。木箱离车篷足有两英尺，上面还坐得下人。
        - id: ch01-b145
          speaker: narrator
          text: >-
            等车夫从酒馆出来，他该开口求搭车，还是趁现在先爬上木箱藏好，再赌一赌被发现以后能不能留下？迪基把一只手搭上车后的挡板。一个声音冷不防在耳边响起。
        - id: ch01-b146
          speaker: schoolboy
          text: 嗨，迪基！真的是你吗？
        - id: ch01-b147
          speaker: narrator
          text: >-
            迪基只好承认，心里却像只落进圈套的小野兽。他转过身，看见一个跟自己同龄的男孩。那是他的同学，也是给他取“点一下，跳一步”这个绰号的人。
        - id: ch01-b148
          speaker: dickie
          text: 哎呀，你差点吓死我！我还以为是姨妈。别告诉别人你见过我。
        - id: ch01-b149
          speaker: schoolboy
          text: 你跑哪儿去了？
        - id: ch01-b150
          speaker: dickie
          text: 哦，到处走了走。别告诉我姨妈。
        - id: ch01-b151
          speaker: schoolboy
          text: 你姨妈？你还不知道吗？
        - id: ch01-b152
          speaker: narrator
          text: 那男孩鄙夷地看着迪基，仿佛连这件事都不知道，实在太不像话。
        - id: ch01-b153
          speaker: dickie
          text: 不知道。知道什么？
        - id: ch01-b154
          speaker: schoolboy
          text: >-
            她连夜溜了。老赫尔替她搬的家，却说不记得搬去哪儿了。要我说，她准是送了他一品脱酒，叫他故意忘掉。
        - id: ch01-b155
          speaker: dickie
          text: 那现在谁住在那里？
        - id: ch01-b156
          speaker: narrator
          text: 迪基忽然焦急得不得了。至于姨妈搬去了哪里，他反倒一点也不关心。
        - id: ch01-b157
          speaker: schoolboy
          text: >-
            谁也没住。房子锁着，等人来租。有事就找百老汇街七百九十六号的罗伯茨。我说，你以后怎么办？
        - id: ch01-b158
          speaker: dickie
          text: 我不知道。你上哪儿去？
        - id: ch01-b159
          speaker: schoolboy
          text: 回家。正好经过你从前那家铺子。一起走吗？
        - id: ch01-b160
          speaker: dickie
          text: >-
            不了，再会，哪天再见。我得往这边走。
        - id: ch01-b161
          speaker: narrator
          text: >-
            迪基离开货车，那辆车忽然变得一点也不重要了。尽管他嘴上说要往别处走，暮色降临时，他还是沿着旧路，悄悄走向从前的房子。后院里曾经摆着那只兔笼。花园里，他曾亲手播下鹦鹉饲料，月亮花也曾开得洁白又美丽。这些事仿佛都已经过去很久很久，其实才不过一个月。可对迪基来说，它们仍像隔了很长的一段岁月。
        - id: ch01-b162
          speaker: narrator
          text: >-
            姨妈搬走的消息改变了一切。至少在这一刻，去格雷夫森德找爸爸的坚定愿望，已经让位给了对叮当儿和白石头的灼热担忧。姨妈发现它们了吗？她把它们带走了吗？要是她没发现，东西还藏在原处，现在取回来才最明智。否则，迟早会有别人租下房子，找到这些宝贝。对，今晚去最稳妥。迪基要从前窗进去，那扇窗的搭扣一直是坏的。他要找回宝贝，或者至少弄清它们是不是已经永远失去了。
        - id: ch01-b163
          speaker: narrator
          text: >-
            他贴着栏杆走进街里，没有人注意。在这一带，街上的男孩实在太多。前窗轻轻一推便升了起来。迪基爬进去，又把拐杖拖进屋。他用手和膝盖飞快爬上楼，直奔那块松动的地板。木板一掀开，他把手伸进下面的空洞。
        - id: ch01-b164
          speaker: narrator
          text: >-
            太好了。双手摸到一包熟悉的软布，里面裹着叮当儿和印章。迪基把东西塞进衬衫胸前，拖着身子下楼。现在上路还不算太晚，今晚至少能走完去格雷夫森德的一两英里。可是那株月亮花，他还想再看一眼。
        - id: ch01-b165
          speaker: narrator
          text: >-
            花园的暮色越来越浓，花茎仍高高立着。迪基伸手一摸，茎秆已经干硬，三四粒干巴巴的小东西从上面落下，在他头顶沙沙作响。
        - id: ch01-b166
          speaker: dickie
          text: 当然是种子。
        - id: ch01-b167
          speaker: narrator
          text: >-
            如今迪基已经懂得不少种子的事，不再是那个把鹦鹉饲料收起来、什么也不知道的孩子。像他这么大的孩子，在乡间走上一个月，怎么会一点也没学会呢？他取出本该在火车上割篮绳的小刀，小心割断月亮花的茎，尽量不让种子掉落。大部分种子果然留住了，只掉下几颗。
        - id: ch01-b168
          speaker: narrator
          text: >-
            迪基举着花茎，笔直又稳当地爬回屋里，像教堂侍童举着游行的十字架。这时屋里已经一片漆黑，只有街灯把光投进前屋。房间空空荡荡，到处是灰，地上扔着一张破报纸。迪基摊开其中一页，跪在旁边，把月亮花的花头放到纸上抖了抖。几十又几十颗种子哗啦啦落出来。它们比葵花籽还大，扁扁圆圆，闪着银光，就像人们叫作银扇草的那种植物结出的果荚。
        - id: ch01-b169
          speaker: dickie
          text: 啊，真美，真美！
          emotion: happy
        - id: ch01-b170
          speaker: narrator
          text: >-
            一片片光滑的种子从迪基指间滑过，像珍珠母做成的纸牌筹码。要是你玩过那种筹码，就知道它们有多么相像。迪基拿出叮当儿和印章，把两件宝贝放在种子堆上。就在这一刻，他忽然明白，自己今晚实在太累了，再也走不动了。
        - id: ch01-b171
          speaker: dickie
          text: 我就在这儿睡吧。这里有的是报纸，拿来当被褥很暖和，只是声音大一点。明早大家还没起床，我就上路。
        - id: ch01-b172
          speaker: narrator
          text: >-
            迪基把屋里散落的报纸和稻草全收拢起来，在避开窗户的墙角堆成一张床。他一点也不怕独自在空屋里睡觉。整座房子都由他一个人享用，这反而让他觉得威风又阔气。口袋里剩下的食物正好拿来当晚饭。想喝水，只要把头伸到洗衣房的水龙头下，再慢慢拧开，就能喝得很痛快。
        - id: ch01-b173
          speaker: narrator
          text: >-
            最后，他又享受了一桩乐事。他把宝贝全摆在报纸上，叮当儿和印章放在中央，珍珠般的筹码围在四周，排成圆形、正方形和长方形。那些种子又扁又平，彼此能挨得很紧，最适合拿来拼图案。不一会儿，他用三重银亮的种子排出一颗六角星。叮当儿和印章摆在正中，街灯的光落在这一切上面，亮晶晶的。
        - id: ch01-b174
          speaker: dickie
          text: 这个最好看。
          emotion: happy
        - id: ch01-b175
          speaker: narrator
          text: 随后，魔法开始了。
