  chapters:
    - id: ch01
      title: Kidnapped
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            New Cross now seemed very far behind Dickie. Its grimy streets, its daily scrambles, and all its worried people who never had enough of anything faded from his life. His home was a pleasant cottage now. From its windows he could see wide green downs and the smooth blue and silver sea. Outside its door, a tidy brick path ran between bright flower beds instead of filthy pavement.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Best of all, he was near Arden after seven months of trying to reach it. He would see Edred and Elfrida again. He would help them find the hidden treasure, just as he had once helped them find their father. That thought made his happiness complete.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Yet being close to Arden Castle did not make it easy to reach the Arden children. How could he walk into the courtyard of a ruined castle, ring the bell of a strange house, and ask for people he had met only in dreams, or something very like dreams? Dickie might never have managed it on his own. Luckily, Destiny helped him. As he turned a corner on the lane toward the village, there stood Edred and Elfrida. They looked exactly like the children he had played and quarrelled with in that other world.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Dickie stopped and leaned on his crutch, waiting for them to speak. They stared hard at him, came right up to him, and walked past without one word. He could hear them talking eagerly together as they went on.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Dickie watched them go, miserable for a moment. Then he pulled himself together. Elfrida had half turned to look back. Perhaps his shabby clothes had made them unsure. If they failed to know him, it would not be because he had stayed quiet. He balanced on one foot, struck his crutch against the ground, and shouted as loudly as he could.
        - id: ch01-b06
          speaker: dickie
          text: "Please stop and wait for me!"
        - id: ch01-b07
          speaker: narrator
          text: >-
            The two children turned, hesitated, and came back. Elfrida hurried close and looked at him with kind eyes.
        - id: ch01-b08
          speaker: girl_cousin
          text: "What is it? Have you hurt yourself?"
        - id: ch01-b09
          speaker: dickie
          text: "No. I only wanted to ask you something."
        - id: ch01-b10
          speaker: narrator
          text: >-
            Edred looked from Dickie to Elfrida.
        - id: ch01-b11
          speaker: boy_cousin
          text: "All right."
        - id: ch01-b12
          speaker: dickie
          text: "You live at the Castle, don't you? Would you let me come down and see it?"
        - id: ch01-b13
          speaker: girl_cousin
          text: "Of course. Come along."
        - id: ch01-b14
          speaker: dickie
          text: "Wait a moment."
        - id: ch01-b15
          speaker: narrator
          text: >-
            Dickie gathered his courage. If they did not remember him, they would think him mad and never take him to the Castle. Still, he had to try.
        - id: ch01-b16
          speaker: dickie
          text: >-
            Did you ever have a tutor named Mr. Parados? We called him Parrot-nose. And did you once shovel snow onto his head, then ride away in a carriage pulled by swans?
        - id: ch01-b17
          speaker: narrator
          text: >-
            Elfrida cried out and threw her arms around him.
        - id: ch01-b18
          speaker: girl_cousin
          text: >-
            It really is you! Edred, this is Dickie! We kept wondering if it could be. Oh, Dickie, dear, what happened to your foot?
          emotion: surprised
        - id: ch01-b19
          speaker: narrator
          text: >-
            Dickie went red.
        - id: ch01-b20
          speaker: dickie
          text: >-
            My foot has always been like this in Nowadays time. When we met in the magic time, I could walk like everyone else, couldn't I?
        - id: ch01-b21
          speaker: narrator
          text: >-
            Elfrida hugged him once more and did not mention his foot again.
        - id: ch01-b22
          speaker: girl_cousin
          text: >-
            I can't believe we've truly found you here! We thought you might not be real. We wrote to the address on that bill you gave us, but the letter came back marked “not known.”
        - id: ch01-b23
          speaker: dickie
          text: "What address did it have?"
        - id: ch01-b24
          speaker: boy_cousin
          text: "It was Laurie Grove, New Cross."
        - id: ch01-b25
          speaker: dickie
          text: >-
            Oh, Mr. Beale made that address up to make the bill look grand. I remember him telling me. He's the man I live with. I call him father because he's been good to me, but my real daddy is dead.
        - id: ch01-b26
          speaker: girl_cousin
          text: "Come up on the downs with us. You can sit down and tell us everything from the very beginning."
        - id: ch01-b27
          speaker: narrator
          text: >-
            They climbed onto the downs and sat among the furze bushes. There Dickie told them his whole story, as much of it as you have heard, and the telling took a long while. Then the three of them remembered aloud how they had first met in the dream world of magic. They remembered how Dickie had helped Edred and Elfrida save their father. That adventure belongs to another story, The House of Arden.
        - id: ch01-b28
          speaker: boy_cousin
          text: >-
            Our magic is finished now. We had to give it up forever to get Father back. So we'll never find the treasure, buy back the old lands, restore the Castle, fill the moat with water again, or build warm, dry cottages for the tenants. But at least we have Father.
          emotion: sad
        - id: ch01-b29
          speaker: dickie
          text: >-
            But my magic still works. Old nurse told me I could use it for you. That's really why I've come, so we can hunt for the treasure together.
        - id: ch01-b30
          speaker: girl_cousin
          text: "That's awfully good of you."
        - id: ch01-b31
          speaker: boy_cousin
          text: "What sort of magic do you have?"
        - id: ch01-b32
          speaker: narrator
          text: >-
            Dickie took out Tinkler, the white seal, and the moon-seeds. He spread them on the grass and began to explain.
        - id: ch01-b33
          speaker: narrator
          text: >-
            In the middle of it, a shadow fell across the children and the magical things. A tall, handsome gentleman stood over them.
        - id: ch01-b34
          speaker: lord_arden
          text: "Edred, won't you introduce your friend?"
        - id: ch01-b35
          speaker: boy_cousin
          text: "Dickie, this is my father!"
        - id: ch01-b36
          speaker: narrator
          text: >-
            Edred scrambled to his feet. Dickie quickly gave his name, but getting up took him longer because of his crutch. Lord Arden reached down and helped him. He must have been a little surprised. Here was a lame child in shabby clothes who did not touch his forehead, as poor children were taught to do when greeting a gentleman. Instead, Dickie stood straight and offered Lord Arden his hand.
        - id: ch01-b37
          speaker: dickie
          text: "My name is Dick Harding. How do you do, Lord Arden?"
        - id: ch01-b38
          speaker: lord_arden
          text: >-
            Very well, thank you. Now, where have you appeared from? I don't think you belong to this part of the country.
        - id: ch01-b39
          speaker: dickie
          text: >-
            No, but my adopted father does. We came from London to visit his father, old Mr. Beale, and we're staying in his cottage.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Lord Arden settled on the turf beside the children and asked Dickie question after question. He wanted to know where Dickie had been born and all the people he had lived with. He asked what Dickie had seen, what he had done, and what he had been through.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Dickie answered every question plainly and honestly. Of course, he left out the magic. He did not explain that, in the magic world, he and Lord Arden's children had already been friends and cousins. Lord Arden kept his eyes on Dickie's face throughout the talk. Only now and then did his gaze move toward Tinkler and the white seal on the grass. At last he picked up both objects and carefully examined the crest on them.
        - id: ch01-b42
          speaker: lord_arden
          text: "Where did these come from?"
        - id: ch01-b43
          speaker: narrator
          text: >-
            Dickie told him. Lord Arden returned Tinkler and the seal and continued his questions. At last Elfrida put her arms around her father's neck.
        - id: ch01-b44
          speaker: girl_cousin
          text: "I know whispering isn't polite, but Dickie won't mind."
        - id: ch01-b45
          speaker: narrator
          text: >-
            She whispered in her father's ear.
        - id: ch01-b46
          speaker: lord_arden
          text: "Yes, certainly. It is teatime. Dickie, will you come home and have tea with us?"
        - id: ch01-b47
          speaker: dickie
          text: "I must let Mr. Beale know. He'll worry if I don't."
        - id: ch01-b48
          speaker: lord_arden
          text: "Would it hurt if I carried you on my back?"
        - id: ch01-b49
          speaker: narrator
          text: >-
            A moment later Lord Arden had Dickie on his back and was carrying him down the slope toward Arden Castle. Edred turned the other way and hurried to the Beales' cottage to explain where Dickie had gone. By the time Edred reached the Castle again, tea had been set out in the parlor. Dickie was already resting in a comfortable chair.
        - id: ch01-b50
          speaker: boy_cousin
          text: >-
            Old Mr. Beale is a funny man. He said Arden Castle was the proper place for Dickie, with a face like his. What did he mean? Ow! Why did you do that?
        - id: ch01-b51
          speaker: narrator
          text: >-
            Elfrida had kicked his hand under the table. Before tea ended, hoofbeats and carriage wheels sounded in the courtyard. The maid opened the parlor door.
        - id: ch01-b52
          speaker: maid
          text: "Lady Talbot has arrived."
        - id: ch01-b53
          speaker: narrator
          text: >-
            Dickie remembered how kind Lady Talbot had been, but now he wanted to hide under the table. She was certain to know him. Then Edred, Elfrida, and their kind, cheerful father would hear that Dickie had once been a burglar. They would hear that Lady Talbot had offered to adopt him and that he had run away. He shook all over.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Lady Talbot greeted everyone, then turned toward Dickie.
        - id: ch01-b55
          speaker: lady_talbot
          text: "And who is this little friend of yours? Why, it's my young runaway!"
          emotion: surprised
        - id: ch01-b56
          speaker: dickie
          text: "I wasn't ungrateful. Truly I wasn't. I had to go."
          emotion: fearful
        - id: ch01-b57
          speaker: narrator
          text: >-
            His eyes begged her to understand, and she did. Dickie would always love her for it. She said nothing at all about burglars.
        - id: ch01-b58
          speaker: lady_talbot
          text: "I once wanted to adopt Dickie, Lord Arden, but he wouldn't stay with me."
        - id: ch01-b59
          speaker: dickie
          text: "I had to go back to Father."
        - id: ch01-b60
          speaker: lady_talbot
          text: >-
            Well, I'm glad we have met again. I always hoped we would. No sugar for me, thank you, Elfrida.
        - id: ch01-b61
          speaker: narrator
          text: >-
            She sat down and made herself as cheerful as anyone could wish. Only one thing troubled Dickie. She suddenly turned to Lord Arden.
        - id: ch01-b62
          speaker: lady_talbot
          text: "Doesn't he remind you of someone?"
        - id: ch01-b63
          speaker: lord_arden
          text: "Perhaps he does."
        - id: ch01-b64
          speaker: narrator
          text: >-
            His look said plainly, “Not in front of the children. We can discuss it afterward.” Soon the three children were sent out to play, and Edred and Elfrida showed Dickie all around the castle ruins. Meanwhile, Lord Arden and Lady Talbot walked back and forth over the grass among the daisies. Their private talk lasted a long time. Dickie knew they were discussing him, but he did not mind. Sometimes you can feel that grown-ups truly understand and can be trusted, and that was how he felt about those two.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Later, a smart little pony cart carried Dickie back to the cottage.
        - id: ch01-b66
          speaker: mr_beale
          text: >-
            You'll soon be too grand to speak to people like us, young fellow. Look at you and your fine friends. Lord Arden, indeed!
        - id: ch01-b67
          speaker: dickie
          text: >-
            They was ever so jolly. Nobody was never kinder to me than Lord Arden and Lady Talbot, excepting you, farver.
        - id: ch01-b68
          speaker: mr_beale
          text: "Hear that, Dad? He knows how to win his old father round, don't he?"
        - id: ch01-b69
          speaker: old_mr_beale
          text: "Why does the boy talk like that? We heard him speak like a proper little gentleman when he chose."
        - id: ch01-b70
          speaker: dickie
          text: "That's how us London folk talks. I only learned the fine way out of books."
        - id: ch01-b71
          speaker: narrator
          text: >-
            Mr. Beale had no answer to that. Yet something in Dickie's words must have stayed with him. That very night he opened a bound volume of the Wesleyan Magazine and actually read for almost ten minutes. By the following afternoon, the same entertaining book lay open before him again. This time he was asleep over it when Lord Arden arrived at the cottage.
        - id: ch01-b72
          speaker: narrator
          text: >-
            You can probably guess why Lord Arden had come. Dickie already wondered whether Lord Arden, like old Mr. Beale, had seen from his face that he belonged to the Arden family. Neither Dickie nor you need be very surprised. Mr. Beale was the one who could hardly believe it.
        - id: ch01-b73
          speaker: mr_beale
          text: >-
            You could've knocked me flat with a pickaxe. His lordship says some woman has been writing to him for ages. She claims she's got his long-lost nephew, or cousin, or something, and she keeps trying to get money from him. Goodness knows what for. Then he says you're an Arden by rights, young fellow. He wants to take you in and bring you up with his children.
        - id: ch01-b74
          speaker: mr_beale
          text: >-
            So that's the finish of you and me, Dickie, old boy. I didn't follow half of what he said, but I understood that much. It's all over for you and me and Amelia and the dogs and our little home. You'll be made a gentleman, and I'll have to take to the road alone and turn into a poor old beggar again. I know that's how it'll end.
          emotion: sad
        - id: ch01-b75
          speaker: dickie
          text: >-
            Don't upset yourself. I ain't leaving you. Lady Talbot asked me to be her boy, didn't she? And didn't I come straight back? I'll play with those children if Lord Arden lets me, but I ain't leaving you. Not yet. So don't start snivelling before anyone's hurt you, farver. See?
          emotion: calm
        - id: ch01-b76
          speaker: narrator
          text: >-
            Dickie meant every word. He had no intention of letting comfort or a grand name separate him from Beale. But that was before Lord Arden came back and spoke to Mr. Beale a second time. After that longer talk, Beale had a very different future to describe.
        - id: ch01-b77
          speaker: mr_beale
          text: >-
            Listen, young fellow. I won't stand in your way. You're going up in the world, but you ain't the only one. Lord Arden has bought Dad's cottage and means to make it bigger. All the dogs can come down here, and I'm to sell them by putting notices in the papers. You'll come and see us sometimes.
        - id: ch01-b78
          speaker: dickie
          text: "What about Amelia and the little ones?"
        - id: ch01-b79
          speaker: mr_beale
          text: >-
            Well, I've been thinking I might ask Amelia to come down here with the dogs. Seems a shame to part them somehow. Lord Arden put the idea in my head. He says to me, friendly as one man to another, “You ought to marry. Isn't there some young woman I could give a little money to, so the two of you could set up house?”
        - id: ch01-b80
          speaker: mr_beale
          text: >-
            So I thought things over, and I thought of Amelia. She'll do as well as anyone, and she knows the dogs. And that little bit of money is a hundred pounds. That's all. A hundred pounds! I'm writing to her today. Marriage is a dreadful gamble, but Amelia ain't a stranger. Besides, after all we've been through, things could never be quite the same with just you and me. What do you say?
        - id: ch01-b81
          speaker: narrator
          text: >-
            We do not know what Dickie said aloud. We do know what he felt. He had tried so hard to stand by Beale and help him along. He had left the old, long-ago world and come back for Beale's sake. Since then, Dickie had kept at jobs and endured things he disliked, all because he meant to get Beale safely settled. Beale had been Dickie's own piece of work. Now someone else had stepped in, lifted the work from his hands, and finished it for him. Beale was provided for, just as Dickie had wanted, but Dickie had meant to do the providing himself. At first, he did not like it at all.
        - id: ch01-b82
          speaker: narrator
          text: >-
            After a while, Dickie had to admit that it was wonderfully lucky for Beale. It proved lucky for Dickie too. He spent whole days at Arden Castle, sharing lessons and games with Edred and Elfrida. It was almost as good as living beside them in the beautiful old dream-life. In this modern world, when he had been Dickie of Deptford, there had been so many things he hated and feared. Those same troubles no longer reached him once he became Richard Arden. The difference between being rich and being poor was as great as the difference between being warm and being cold.
        - id: ch01-b83
          speaker: narrator
          text: >-
            After that first day, the three children grew shy about their strange adventures. They said no more about them and played ordinary games instead. Before long they almost forgot that magic existed, or ever had. Their real life was so happy that they needed no magic to make them content. Only after Amelia and Mr. Beale were married did Dickie remember another reason he had returned to the Nowadays world. He had promised himself he would find the Arden treasure for his cousins.
        - id: ch01-b84
          speaker: narrator
          text: >-
            The wedding itself could fill a whole book. Amelia came from London and married Mr. Beale in Arden Church. She wore a white dress, a huge hat crowned with orange blossoms, a delicate veil, and real kid gloves. Miss Edith Arden, Lord Arden's sister, gave her every one of those things.
        - id: ch01-b85
          speaker: narrator
          text: >-
            Lord Arden supplied an enormous wedding cake and a splendid wedding breakfast. He gave away the bride himself. Then he made a speech, saying that he owed a great debt to Mr. Beale for all the kindness Beale had shown his nephew, Richard Arden. Everyone was astonished to hear Dickie called by that new name. Even the dogs joined the celebration. Each one wore a white wedding favor, and each one was given a crumb of wedding cake.
        - id: ch01-b86
          speaker: narrator
          text: >-
            When the feast ended and the guests had gone, the bride tucked her white dress beneath a large apron. Then she began arranging the few pieces of furniture Dickie and Beale had gathered for their little Deptford home. A van had carried it all the way to their new rooms at Arden.
        - id: ch01-b87
          speaker: narrator
          text: >-
            The Ardens had gone back to the Castle with Dickie. Old Beale sat smoking in his usual chair outside the cottage, so nobody heard the compliment he paid his bride. He came up behind her as she dusted the mantelpiece and put an arm around her.
        - id: ch01-b88
          speaker: amelia
          text: "Oh, go on with you. Anyone would think we were courting."
        - id: ch01-b89
          speaker: mr_beale
          text: >-
            We are courting. We've got all our courting to do now, see? I could've picked and chosen, mind you. Still, I dare say I might've done worse.
        - id: ch01-b90
          speaker: narrator
          text: >-
            He kissed Amelia for the first time. She blushed with pleasure at his compliment and went on dusting.
        - id: ch01-b91
          speaker: narrator
          text: >-
            As the Ardens walked home across the short grass, Lord Arden spoke to his sister.
        - id: ch01-b92
          speaker: lord_arden
          text: >-
            I wish every cottage around here were like Beale's. Fixing it did not cost very much. If only I could buy back the rest of the land, I would show certain people what a model village ought to be. But I cannot buy it. The man wants far more than we could ever manage.
        - id: ch01-b93
          speaker: narrator
          text: >-
            Dickie heard him. The next time he was alone with his cousins, he brought up the treasure.
        - id: ch01-b94
          speaker: dickie
          text: >-
            Listen. You aren't allowed to use your magic to hunt for the treasure anymore, but I can use mine. I say we look for it. Then your father could buy back the old land, put up the new cottages, repair Arden Castle, and make it what it used to be.
        - id: ch01-b95
          speaker: girl_cousin
          text: "Yes, let's do it!"
          emotion: happy
        - id: ch01-b96
          speaker: boy_cousin
          text: "I don't know."
        - id: ch01-b97
          speaker: narrator
          text: >-
            His answer was not what the others expected. The three children sat in a gate-tower window above the green turf of the castle yard.
        - id: ch01-b98
          speaker: girl_cousin
          text: "What do you mean, you don't know?"
        - id: ch01-b99
          speaker: boy_cousin
          text: >-
            I mean exactly that. I think we're quite happy as we are. I used to believe I liked magic and adventures, but something dreadful happened every time we went into the past. We were chased, or locked up, or troubled somehow.
        - id: ch01-b100
          speaker: boy_cousin
          text: >-
            The only really pleasant part was seeing the treasure hidden. That was like watching a picture, and we did not have to do anything. We don't know where it is now, anyway. I don't like adventures half as much as I thought I did. Everything is fine as it is, so I say we should leave it alone.
        - id: ch01-b101
          speaker: narrator
          text: >-
            Edred's cold answer discouraged the other two, but only for a few minutes.
        - id: ch01-b102
          speaker: girl_cousin
          text: >-
            Our magic carried us into the past to search for the treasure. Once, a photographic film we'd fastened up started working like a moving picture, and we watched the treasure being hidden.
        - id: ch01-b103
          speaker: dickie
          text: "Then we can go to that same place, mark the spot, come home, and dig there."
        - id: ch01-b104
          speaker: girl_cousin
          text: >-
            It wasn't buried. They put it in a kind of cellar with doors. We've searched every part of the Castle that's still standing, and we haven't found even the tiniest silver ring.
        - id: ch01-b105
          speaker: dickie
          text: "I see. What if I used my magic and wished to go straight to wherever the treasure is?"
        - id: ch01-b106
          speaker: narrator
          text: >-
            Edred kicked hard against the tower stones. He hated the idea.
        - id: ch01-b107
          speaker: boy_cousin
          text: >-
            I won't go! I expect the treasure is sealed behind bricks. A fine sight we'd be, shut inside a vault like a wicked nun, with no one remembering how to let us out. No, thank you!
          emotion: fearful
        - id: ch01-b108
          speaker: girl_cousin
          text: "You don't have to make such a fuss. Nobody is going to be sealed inside a vault."
        - id: ch01-b109
          speaker: dickie
          text: "You're right, old fellow. I hadn't thought of that."
        - id: ch01-b110
          speaker: girl_cousin
          text: "But we have to do something."
        - id: ch01-b111
          speaker: narrator
          text: >-
            Elfrida sounded impatient. Dickie answered slowly as a new idea came to him.
        - id: ch01-b112
          speaker: dickie
          text: >-
            What if I tried to see the Mouldierwarp? He's stronger than the Mouldiwarp, and he might tell us what to do. We could use the magic only to ask to see him.
        - id: ch01-b113
          speaker: boy_cousin
          text: "I don't want to be carried away from here."
        - id: ch01-b114
          speaker: dickie
          text: "You won't be. I'll arrange the moon-seeds and the other things right here on the floor. You'll see."
        - id: ch01-b115
          speaker: narrator
          text: >-
            Dickie carefully arranged the moon-seeds in two crossed triangles on the tower floor. He and both cousins stood within the shape, close together among the magical things. Then Dickie made his request in the ordinary, polite way you might ask to see Mr. So-and-so after knocking at Mr. So-and-so's front door and waiting for someone to answer.
        - id: ch01-b116
          speaker: dickie
          text: "Please, may we see the Mouldierwarp?"
        - id: ch01-b117
          speaker: narrator
          text: >-
            Darkness swallowed everything at once. Before the children could wish for light, a shining circle appeared against the blackness. Inside it sat the Mouldierwarp, exactly as Dickie had seen him before. He bowed with great ceremony.
        - id: ch01-b118
          speaker: mouldierwarp
          text: "What service may I do for you today, Richard Lord Arden?"
        - id: ch01-b119
          speaker: boy_cousin
          text: "He isn't Lord Arden. I used to be, but I'm not anymore either. My father is Lord Arden now."
        - id: ch01-b120
          speaker: mouldierwarp
          text: "Indeed? That is deeply interesting. Yet you still have not answered my question."
        - id: ch01-b121
          speaker: dickie
          text: >-
            I want to find Arden's lost treasure. Then the old Castle can be restored, the old lands can be bought back, and the old cottages can be made pleasant and fit to live in. Will you please tell me what to do?
        - id: ch01-b122
          speaker: narrator
          text: >-
            In the bright circle, the Mouldierwarp seemed to scratch his nose with one front paw while he thought.
        - id: ch01-b123
          speaker: mouldierwarp
          text: >-
            It can be done, but the task will be hard. It is almost impossible to find the treasure without waking the Mouldiestwarp. He sits upon the green-and-white checkered field in the Arden coat of arms, and only a noble deed can wake him. Still, a noble deed may happen at any moment. If you set out in search of treasure of one kind, you may discover treasure of another kind instead. I have spoken.
        - id: ch01-b124
          speaker: narrator
          text: >-
            His image began to fade.
        - id: ch01-b125
          speaker: girl_cousin
          text: "Oh, please don't go! You're as bad as the Greek oracles. Can't you tell us something clear and direct?"
        - id: ch01-b126
          speaker: mouldierwarp
          text: "I can. Great Arden's Lord no treasure shall regain, till Arden's Lord is lost and found again."
        - id: ch01-b127
          speaker: boy_cousin
          text: "Father was lost and found again, so that part is settled."
        - id: ch01-b128
          speaker: mouldierwarp
          text: "Set forth to seek it with courageous face, and seek it in the most unlikely place."
        - id: ch01-b129
          speaker: narrator
          text: >-
            Then the Mouldierwarp vanished completely, and the darkness vanished with him. The three children stood in the sunny tower room beside Tinkler, the white seal, and the moon-seeds.
        - id: ch01-b130
          speaker: boy_cousin
          text: "Very helpful. How are we supposed to know which places are unlikely and which are likely? That's just as difficult."
        - id: ch01-b131
          speaker: dickie
          text: "I've got an idea."
        - id: ch01-b132
          speaker: narrator
          text: >-
            The dinner bell cut him off. They had to eat roast mutton and plum pie, behaving like three ordinary children who had never known magic. There was no real chance to talk again that day. Edred and Elfrida were going to Cliffville after dinner to be measured for new shoes. Dickie would spend the afternoon with Beale, Amelia, and the dogs.
        - id: ch01-b133
          speaker: narrator
          text: >-
            While the children waited in their outdoor clothes for the dogcart, Dickie found a moment to whisper to Elfrida.
        - id: ch01-b134
          speaker: dickie
          text: >-
            Let's both think as hard as we can about unlikely places. Tomorrow we'll choose the unlikeliest one and go there. Edred can stay behind if he wants. You're eager to do it, aren't you?
        - id: ch01-b135
          speaker: girl_cousin
          text: "Of course I am!"
          emotion: happy
        - id: ch01-b136
          speaker: narrator
          text: >-
            That was all she had time to say before they left. At the cottage, Beale and Amelia gave Dickie a joyful welcome, and the dogs were more delighted than either of them. It was enough to drive every thought of unlikely places from anyone's mind. Besides, there were always interesting jobs waiting at the cottage. Dickie helped to wash True. He cleaned the knives and rinsed the lettuce for tea. Later he dried the tea things, then helped fold the clean washing when Mrs. Beale carried it in from the yard in dry, sweet-smelling armfuls of white cloth.
        - id: ch01-b137
          speaker: narrator
          text: >-
            Dusk had fallen when Dickie said good night. He hugged each dog in turn, then walked the short distance to the crossroads. The dogcart returning from Cliffville was meant to collect him there. But the pony had lost a shoe and needed a visit to the blacksmith, so the cart was late.
        - id: ch01-b138
          speaker: narrator
          text: >-
            Dickie sat on the milestone and waited. After a little while, he began thinking the thoughts that always come when people fail to arrive at the promised time. Perhaps he himself had mistaken the hour. Perhaps the cottage clock had been running slow. He waited longer, but then sitting there began to seem simply foolish. Dickie picked up his crutch, pushed himself upright from the milestone, and set off down the road toward the Castle.
        - id: ch01-b139
          speaker: narrator
          text: >-
            Many thoughts came as he walked. His memories of King James's time had become faint and far away. He looked down at Arden Castle and loved it. He wanted nothing better than to live there always with his cousins and their father. After all, who needed the magic of a dream-life when real life had become so good and happy?
        - id: ch01-b140
          speaker: narrator
          text: >-
            At that very moment, a twig snapped sharply in the hedge. A dozen more twigs rustled and broke. Something like a huge black bird flew at Dickie and wrapped its wings around him.
        - id: ch01-b141
          speaker: narrator
          text: >-
            The next instant he knew it was no bird. Someone had thrown a large dark cloak over his head and shoulders. Strong hands gripped him through the cloth.
        - id: ch01-b142
          speaker: kidnapper_1
          text: "Keep quiet! Make one sound and you'll be sorry."
          emotion: angry
        - id: ch01-b143
          speaker: dickie
          text: "Will somebody help me?"
          emotion: fearful
        - id: ch01-b144
          speaker: narrator
          text: >-
            They threw Dickie onto the ground. Hands fumbled around his head and pulled the cloak away from his face. Then someone forced a handkerchief into his mouth. A round pebble had been tied inside it, and the hard gag stopped him from speaking. The men dragged him out of the road and behind the hedge, where they pinned him down. Once more the cloak covered his head. Dickie could see nothing at all now, but he could still hear the two men whispering over him.
        - id: ch01-b145
          speaker: kidnapper_1
          text: "Quiet. They're coming."
        - id: ch01-b146
          speaker: narrator
          text: >-
            Hooves and wheels approached along the road. Then Dickie heard Lord Arden's cheerful voice.
        - id: ch01-b147
          speaker: lord_arden
          text: "He must have started walking. We'll catch up with him easily enough."
        - id: ch01-b148
          speaker: narrator
          text: >-
            The hoofbeats and wheels passed on and faded. Rough hands hauled Dickie upright and pushed his crutch under his arm.
        - id: ch01-b149
          speaker: kidnapper_1
          text: "Get moving, and be quick about it, or I'll teach you a lesson. There's a carriage waiting."
          emotion: angry
        - id: ch01-b150
          speaker: narrator
          text: >-
            Dickie obeyed because he had no choice. The men uncovered his eyes. Before long, he saw that the “carriage” was a costermonger's handcart.
        - id: ch01-b151
          speaker: narrator
          text: >-
            They put him into the cart, covered him with the cloak, and piled cabbages and vegetable marrows over him. They left only a narrow space for air.
        - id: ch01-b152
          speaker: kidnapper_2
          text: "Now lie still if you value your life. Move one inch and I'll beat you till you can't stand. Remember that."
          emotion: angry
        - id: ch01-b153
          speaker: narrator
          text: >-
            Dickie lay rigid beneath the vegetables, full of misery and despair. Neither voice was strange to him. He knew them both far too well.
