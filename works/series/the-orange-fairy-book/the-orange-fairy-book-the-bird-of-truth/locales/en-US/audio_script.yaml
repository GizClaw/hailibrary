  chapters:
    - id: ch01
      title: The Children from the River
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Once upon a time, a poor fisher built his hut beside a stream. The water slipped quietly under bushes and past trees, far from the bright sun and the noise of towns, while birds sang overhead. One day, as the fisher cast his nets, he saw a crystal cradle floating toward him. He quickly slid his net beneath it and drew it ashore. Under a silk coverlet, two babies lay on soft cotton, a boy and a girl. They opened their eyes and smiled at him. His heart went out to them, so he left his lines and carried the cradle home."
        - id: ch01-b02
          speaker: narrator
          text: "When his wife saw what the cradle held, she threw up her hands."
        - id: ch01-b03
          speaker: fisher_wife
          text: "Aren't eight children enough? Now you've brought us two more. How can we possibly feed them?"
        - id: ch01-b04
          speaker: fisher
          text: "Would you have had me leave them to starve, or let the sea swallow them? If we have enough for eight, we have enough for ten."
        - id: ch01-b05
          speaker: narrator
          text: "His wife said nothing more. The little creatures had already touched her heart. Somehow, there was always food enough in the hut. The twins grew into children so good and gentle that their foster parents came to love them as much as their own children, and perhaps even more. The fisher's own sons were quarrelsome and jealous. They played cruel tricks on the twins, who soon learned to keep away from them."
        - id: ch01-b06
          speaker: narrator
          text: "The boy and girl spent long hours beside the river. They saved bits of bread from breakfast and crumbled them for the birds. In return, the birds taught them many things. They learned to rise early, to sing, and even to speak the language of birds, which very few people understand. Still, however hard the twins tried to avoid trouble, peace in the hut became harder to keep. One morning, the eldest foster brother turned on them."
        - id: ch01-b07
          speaker: eldest_foster_brother
          text: "You can pretend to be so polite and so much better than us. At least we have a father and mother. All you have is the river, just like the frogs and toads."
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: "The children did not answer, but the insult made them miserable. In whispers, they agreed that they could stay no longer. They would go out into the world and seek their fortunes. The next day, they rose as early as the birds and slipped downstairs without a sound. An open window let them creep outside. They ran to the river and began following its bank, comforted by the water beside them and hoping they would meet someone who might care for them."
        - id: ch01-b09
          speaker: narrator
          text: "They walked all day without seeing another living creature. By evening, their feet ached and they could hardly go on. Then they found a small hut. Their spirits lifted, only to sink again when they saw its closed door and empty windows. The girl was nearly in tears, but her brother held back his own."
        - id: ch01-b10
          speaker: prince
          text: "At least there's a bench. We can rest here, and when we feel better, we'll decide what to do."
        - id: ch01-b11
          speaker: narrator
          text: "They sat down, too weary at first to notice anything. After a while, they saw swallows gathered beneath the roof tiles, chattering happily. The birds had no idea that the children understood every word. If they had known, they might not have spoken so freely."
    - id: ch02
      title: What the Swallows Knew
      blocks:
        - id: ch02-b01
          speaker: country_swallow
          text: "Well, good evening, my fine city lady! What a sight for country eyes. After years in a palace, you've finally remembered your old friends."
        - id: ch02-b02
          speaker: city_swallow
          text: "My parents left me this nest, so I mean to make it my home. But tell me, are you and your family well?"
        - id: ch02-b03
          speaker: country_swallow
          text: "Very well, thank you. Though my poor daughter nearly went blind when her eyes became badly inflamed. Luckily, I found the magic herb, and it cured her at once."
        - id: ch02-b04
          speaker: city_swallow
          text: "And how are the others? Does the nightingale still sing? Does the lark fly as high as ever? Is the linnet still so smartly dressed?"
        - id: ch02-b05
          speaker: narrator
          text: "The country swallow drew herself up."
        - id: ch02-b06
          speaker: country_swallow
          text: "I never gossip. Birds used to be innocent and well behaved, but people have set them a terrible example. It's a great pity."
        - id: ch02-b07
          speaker: city_swallow
          text: "What do you mean? No innocence or good behavior among country birds? My dear friend, how can you say that?"
        - id: ch02-b08
          speaker: country_swallow
          text: "Because it's true. We met some linnets just as spring brought flowers and long days. Would you believe they were leaving for the cold north? We kindly tried to stop such foolishness, and they answered us with dreadful insolence."
        - id: ch02-b09
          speaker: city_swallow
          text: "How shocking!"
          emotion: surprised
        - id: ch02-b10
          speaker: country_swallow
          text: "It gets worse. The crested lark used to be shy. Now she's a thief who steals maize and corn wherever she finds it."
        - id: ch02-b11
          speaker: city_swallow
          text: "I can hardly believe it."
          emotion: surprised
        - id: ch02-b12
          speaker: country_swallow
          text: "Then listen to this. When I came back for the summer, a shameless sparrow had taken my nest. I told him it was mine. He laughed and claimed it as his own. I said my ancestors were born there, and my sons would be born there too. So my husband attacked him and threw him out. Surely nothing like that happens in town."
        - id: ch02-b13
          speaker: city_swallow
          text: "Not quite like that, perhaps. But I've seen plenty. If only you knew!"
        - id: ch02-b14
          speakers: [country_swallow, swallow_two, swallow_three]
          ensemble: chorus
          text: "Oh, tell us! Please tell us!"
        - id: ch02-b15
          speaker: narrator
          text: "When all the swallows had settled comfortably, the city swallow began her story."
        - id: ch02-b16
          speaker: city_swallow
          text: "Our king fell in love with a tailor's youngest daughter. She was as kind and gentle as she was beautiful. The nobles wanted him to choose one of their daughters, and they tried to stop the wedding. The king refused to listen, and he married her. A few months later, war began. The king rode away with his army, leaving the queen grieving behind him."
        - id: ch02-b17
          speaker: city_swallow
          text: "When peace came and the king returned, he was told that the queen had borne two babies while he was away, but both had died. They also told him grief had driven her mad. She had been locked in a mountain tower, where the fresh air might cure her in time."
        - id: ch02-b18
          speaker: swallow_two
          text: "But was that really true?"
        - id: ch02-b19
          speaker: city_swallow
          text: "Of course not. The babies were alive in the gardener's cottage. That night, the chamberlain carried them to the river in a crystal cradle. They floated safely for a whole day. The stream was deep but quiet, so they came to no harm. The next morning, a fisherman near the river rescued them. A kingfisher friend told me so."
        - id: ch02-b20
          speaker: narrator
          text: "Until then, the children had listened lazily from the bench. At the mention of the crystal cradle their foster mother often described, they sat straight up and stared at each other. Their eyes seemed to say how glad they were that they had learned the birds' language."
        - id: ch02-b21
          speakers: [country_swallow, swallow_two, swallow_three]
          ensemble: chorus
          text: "What wonderful luck!"
        - id: ch02-b22
          speaker: swallow_three
          text: "When the children grow up, they can return to their father and free their mother."
        - id: ch02-b23
          speaker: city_swallow
          text: "It won't be that simple. They must prove they are the king's children and that their mother was never mad. There is only one way to make the king believe them."
        - id: ch02-b24
          speakers: [country_swallow, swallow_two, swallow_three]
          ensemble: chorus
          text: "What is it? And how do you know?"
        - id: ch02-b25
          speaker: city_swallow
          text: "One day in the palace garden, I met a cuckoo who always claims he can see the future. We spoke about the palace and what had happened there years ago. He said only the Bird of Truth could expose the ministers' wickedness and show the king his mistake, because that bird can speak the language of people."
        - id: ch02-b26
          speaker: city_swallow
          text: "I asked where the bird could be found. The cuckoo said it was imprisoned in a castle guarded by a fierce giant. That giant sleeps for only one quarter of an hour in every day."
        - id: ch02-b27
          speaker: country_swallow
          text: "Where is the castle?"
        - id: ch02-b28
          speaker: city_swallow
          text: "That's what I don't know. There is a tower nearby where an old witch lives. She knows the way, but she will tell only someone who promises to bring her water from the fountain of many colors in the castle courtyard. She would never reveal that the Bird of Truth is hidden there, because she hates the bird and would kill her if she could. But the bird is immortal. So the witch keeps her locked away while the Birds of Bad Faith guard her day and night and try to silence her voice."
        - id: ch02-b29
          speaker: country_swallow
          text: "If the poor prince reaches the tower, is there anyone else who can guide him?"
        - id: ch02-b30
          speaker: city_swallow
          text: "Only an owl who lives alone in that desert. He knows just one word of human speech, and that word is 'cross.' Even if the prince found him, he couldn't understand. But the sun is sinking into its nest beneath the sea, and I must go to mine. Good night, friends!"
        - id: ch02-b31
          speaker: narrator
          text: "The city swallow flew away. The children had forgotten both hunger and weariness in the joy of this strange news. At once, they rose from the bench and followed the direction of her flight. They walked for another two hours before a great city appeared ahead of them. They felt certain it must be the capital of their father's kingdom. Near one house, a kind-looking woman stood at the door. The children asked if she could give them a place to sleep for the night. Their pleasant faces and good manners pleased her so much that she welcomed them warmly into her home."
    - id: ch03
      title: The Tower in the Waste
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "The next morning, the children were at work before it was fully light. The girl swept out all the rooms, and her brother watered the garden. By the time the good woman came downstairs, they had done everything that needed doing. Nothing was left for her. Their helpfulness delighted her so much that she begged both children to stay and make their home with her."
        - id: ch03-b02
          speaker: prince
          text: "I would gladly leave my sister with you, but I have serious work to do. I can't delay it."
        - id: ch03-b03
          speaker: narrator
          text: "He gladly entrusted his sister to the woman, said farewell to them both, and set out alone. For three whole days, he wandered along the most out-of-the-way paths he could find, yet nowhere did he see the least sign of a tower. The fourth morning was exactly the same. At last, despair overcame him. He threw himself on the ground beneath a tree and hid his face in his hands. After a little while, he heard a rustling above his head. He looked up and saw a turtle dove watching him with her bright eyes. Remembering what the birds had taught him beside the river, he spoke to her in her own language."
        - id: ch03-b04
          speaker: prince
          text: "Dear dove, please tell me where to find the castle of Come-and-never-go."
        - id: ch03-b05
          speaker: turtle_dove
          text: "Poor child, who sent you on such a hopeless search?"
        - id: ch03-b06
          speaker: prince
          text: "My fortune sent me, though I don't know whether it is good or bad."
        - id: ch03-b07
          speaker: turtle_dove
          text: "Then follow the wind. Today it is blowing toward the castle."
        - id: ch03-b08
          speaker: narrator
          text: "The boy thanked the dove and set off in the direction of the wind. All the way, he feared it might change and carry him somewhere else. But the wind seemed to feel pity for the lonely child. It blew steadily toward the same place and never led him astray. With every step, the country around him grew more dreary. When night began to fall, he looked beyond the dark, bare rocks and saw something darker than all of them. It was the tower where the witch lived. He hurried forward, caught hold of the knocker, and struck the door three loud blows. Each knock echoed through the empty hollows among the rocks."
        - id: ch03-b09
          speaker: narrator
          text: "The door slowly opened. An old woman stood there, holding a candle near a face so hideous that the boy stepped back. Around her crawled lizards, beetles, and other creatures almost as frightening as she was."
        - id: ch03-b10
          speaker: witch
          text: "Who dares knock on my door and wake me? Tell me what you want, quickly, or you'll regret it."
          emotion: angry
        - id: ch03-b11
          speaker: prince
          text: "Madam, I believe only you know the way to the castle of Come-and-never-go. Please show it to me."
        - id: ch03-b12
          speaker: witch
          text: "Very well. It's late today, so you may go tomorrow. Come inside now, and sleep among my lizards."
        - id: ch03-b13
          speaker: prince
          text: "I can't stay. I must return to the road where I began before dawn."
        - id: ch03-b14
          speaker: witch
          text: "Then promise to bring this jar back full of many-colored water from the fountain in the castle courtyard. Break your word, and I'll turn you into a lizard forever."
        - id: ch03-b15
          speaker: prince
          text: "I promise."
        - id: ch03-b16
          speaker: narrator
          text: "The witch called a very thin dog."
        - id: ch03-b17
          speaker: witch
          text: "Take this little pig to the castle of Come-and-never-go, and be sure to warn my friend that he's coming."
        - id: ch03-b18
          speaker: narrator
          text: "The thin dog rose, shook itself from head to tail, and started away. The boy followed. After two hours, they stopped before a great castle. It was huge, black, and gloomy, and its doors stood wide open. Yet no light shone from within, and no sound suggested that anyone was there. The dog seemed to know what waited inside. It gave a wild howl and went on through the doors. The boy stayed behind. He could not tell whether this was the one quarter of an hour when the giant slept. For a moment, he hesitated beneath a wild olive growing nearby. It was the only tree he had seen since he parted from the dove."
        - id: ch03-b19
          speaker: prince
          text: "Oh, heaven, help me!"
          emotion: fearful
        - id: ch03-b20
          speaker: owl
          text: "Cross! Cross!"
    - id: ch04
      title: The Bird of Truth
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "The boy leaped for joy. This was the owl the swallow had described. Softly, he answered in the bird's own language."
        - id: ch04-b02
          speaker: prince
          text: "Wise owl, please protect me and show me what to do. I came to find the Bird of Truth, but first I must fill this jar with many-colored water from the castle courtyard."
        - id: ch04-b03
          speaker: owl
          text: "Don't take that water. Beside the many-colored fountain, another spring bubbles up. Fill your jar there instead. Then enter the aviary opposite the great door. Bright birds will all cry that they are the Bird of Truth. Do not touch any of them."
        - id: ch04-b04
          speaker: owl
          text: "Look in a corner for a small white bird. The others are always trying to kill her, because they do not know she cannot die. Hurry! The giant has just fallen asleep, and you have only a quarter of an hour."
        - id: ch04-b05
          speaker: narrator
          text: "The boy ran into the courtyard as fast as he could. Two springs stood close together. He passed the many-colored water without even looking at it and filled the jar with water that was clear and pure. Then he rushed into the aviary. The moment the door closed behind him, a terrible clamor nearly deafened him. Peacocks, ravens, and magpies all shouted that they were the Bird of Truth."
        - id: ch04-b06
          speakers: [bad_faith_bird_one, bad_faith_bird_two, bad_faith_bird_three]
          ensemble: chorus
          text: "I am the Bird of Truth! Choose me!"
        - id: ch04-b07
          speaker: narrator
          text: "The boy kept his face steady. He did not reach toward a peacock, raven, or magpie, no matter how loudly each one claimed to be the bird he wanted. He walked past every bright feather until he reached the far corner. There, a band of savage crows had hemmed in one small white bird. They crowded around her and tried without rest to kill her. The boy pushed through them, lifted the white bird, and tucked her safely against his chest. Then he hurried out of the aviary and left the castle, while the Birds of Bad Faith screamed behind him. Once he was outside, he ran without stopping all the way back to the witch's tower. As soon as he arrived, he handed the old woman the jar she had given him."
        - id: ch04-b08
          speaker: witch
          text: "Become a parrot!"
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: "With that cry, she flung the jar's water over him. The witch expected him to lose his shape, just as so many people before him had. But he did not become a parrot. Instead, he grew ten times more handsome, because the clear water was enchanted for good and not for evil. The lizards, beetles, and other creatures crawling around the witch saw what had happened. They rushed to the spilled water and rolled themselves in it. As soon as it touched them, they stood upright as human beings once more. The witch watched her spell break before her eyes. Then she seized a broomstick, mounted it, and flew away."
        - id: ch04-b10
          speaker: narrator
          text: "No one could measure the sister's delight when her brother returned with the Bird of Truth. Yet his hardest task remained. He had to bring the bird before the king without letting the wicked courtiers seize her, for the truth would expose their plot and ruin them."
    - id: ch05
      title: The Bird Enters the Palace
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "Soon, though no one knew who had carried the news, people everywhere began saying that the Bird of Truth was hovering near the palace. The wicked courtiers heard it too, and they made every sort of preparation to stop her from reaching the king. Some weapons were sharpened, and others were covered with poison. Eagles and falcons were brought in to hunt the white bird down. The courtiers built cages and boxes where they could shut her away if they failed to kill her. They spread lies as well. They declared that her white plumage was only something she had put on to hide the black feathers beneath it. In fact, there was nothing they would not do to prevent the king from seeing the bird, or to make him ignore her words if she reached him."
        - id: ch05-b02
          speaker: narrator
          text: "As so often happens, the courtiers brought about the very thing they feared. They talked so much about the Bird of Truth that their words finally reached the king. He immediately wished to see this remarkable bird. His courtiers placed one difficulty after another in his way, but each obstacle only made his desire stronger. In the end, the king issued a public proclamation. Anyone who found the Bird of Truth was commanded to bring her before him without delay."
        - id: ch05-b03
          speaker: narrator
          text: "As soon as the boy saw the proclamation, he called his sister, and together they hurried to the palace. He kept the Bird of Truth hidden and safe, buttoned inside his tunic. But when the children reached the palace doors, the courtiers barred their way. They told the boy that he was not allowed to enter. Again and again, he explained that he had brought the bird and was only obeying the king's own command. It did no good. The courtiers simply answered that His Majesty had not yet risen from bed and that no one was permitted to wake him."
        - id: ch05-b04
          speaker: narrator
          text: "While they argued, the Bird of Truth settled the matter herself. She flew from the boy's tunic, rose through an open window, and entered the king's own room. She landed on his pillow, close beside his head, and bowed respectfully."
        - id: ch05-b05
          speaker: bird_of_truth
          text: "My lord, I am the Bird of Truth you wished to see. I had to come through your window because your courtiers are keeping the boy who brought me outside the palace."
        - id: ch05-b06
          speaker: king
          text: "They will answer for such insolence."
          emotion: angry
        - id: ch05-b07
          speaker: narrator
          text: "The king immediately ordered an attendant to bring the boy to his rooms. A moment later, the prince entered with his sister's hand in his."
        - id: ch05-b08
          speaker: king
          text: "Who are you? And what connects you with the Bird of Truth?"
        - id: ch05-b09
          speaker: prince
          text: "If it pleases Your Majesty, the Bird of Truth can explain that better than I can."
        - id: ch05-b10
          speaker: narrator
          text: "The Bird of Truth did explain. She revealed how the wicked plot had been carried out and how it had succeeded for so many years. For the first time, the king understood that his babies had lived and that his wife had never lost her mind. Tears filled his eyes as he gathered both children into his arms. There was no time to lose. Taking his son and daughter with him, he hurried from the palace and traveled to the tower in the mountains where the queen had been shut away."
    - id: ch06
      title: Truth Restored
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "The poor queen had lived for years with almost no light. Her face had grown as white as marble. Then her husband entered the tower, and beside him stood the two children she had believed lost. At the sight of all three, color flowed back into her cheeks. She became as beautiful as she had ever been."
        - id: ch06-b02
          speaker: narrator
          text: "The king, queen, prince, and princess all returned to the city in state. Great rejoicing filled the capital. The wicked courtiers who had planned the crime were beheaded, and everything they owned was taken away. The king did not forget the good old fisher and his wife, who had rescued the babies and raised them with love. He gave them riches and honor. The prince and princess loved and cherished their foster parents until the end of their lives."
