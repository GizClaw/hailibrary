        delivery: 善良朴实，遇事坚定
        timbre: 粗粝温暖
        pace: 从容
        pitch: 中低
    fisher_wife:
      display_name: 渔夫妻子
      tts:
        delivery: 直率勤劳，忧虑中带着慈爱
        timbre: 成熟温暖
        pace: 自然
        pitch: 中
    eldest_foster_brother:
      display_name: 大养兄
      tts:
        delivery: 嫉妒刻薄，故意出言伤人
        timbre: 年轻粗硬
        pace: 稍快
        pitch: 中
    prince:
      display_name: 王子
      tts:
        delivery: 善良勇敢，说话诚恳坚定
        timbre: 年轻清朗
        pace: 稳健
        pitch: 中
