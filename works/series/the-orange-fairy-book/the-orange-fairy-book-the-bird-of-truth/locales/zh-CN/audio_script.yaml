      display_name: 乡下燕子
      tts:
        delivery: 直爽健谈，带一点自以为是
        timbre: 明亮朴实
        pace: 轻快
        pitch: 高
    city_swallow:
      display_name: 城里燕子
      tts:
        delivery: 见多识广，文雅中略带矜持
        timbre: 清亮细润
        pace: 从容
        pitch: 中高
    swallow_two:
      display_name: 燕子甲
      tts:
        delivery: 好奇热心，反应爽快
        timbre: 轻盈清脆
        pace: 轻快
        pitch: 高
    swallow_three:
      display_name: 燕子乙
      tts:
        delivery: 好奇热心，语气活泼
        timbre: 明快清脆
