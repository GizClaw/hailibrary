        pace: 适中
        pitch: 低
    bird_of_truth:
      display_name: 真理之鸟
      tts:
        delivery: 无畏庄重，字字清楚可信
        timbre: 纯净嘹亮
        pace: 从容
        pitch: 中高
    king:
      display_name: 国王
      tts:
        delivery: 厚道沉着，动情时深切有力
        timbre: 浑厚温暖
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 水晶摇篮里的孩子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一个穷渔夫在小河边盖了间茅屋。那条河躲开烈日和城镇的喧闹，静静流过树木和灌丛，听着头顶的鸟儿歌唱。一天，渔夫撒网时，看见一只水晶摇篮顺流漂来。他赶忙捞起摇篮，掀开丝被。柔软的棉絮上躺着两个婴儿，一男一女，正睁眼朝他微笑。渔夫心生怜爱，立刻把他们抱回了家。
        - id: ch01-b02
          speaker: fisher_wife
          text: 八个孩子还不够吗？你怎么又带回来两个？咱们拿什么养活他们？
        - id: ch01-b03
          speaker: fisher
          text: 难道让我把他们留在那里饿死，或是让海浪吞掉？够八个孩子吃的，也就够十个吃。
        - id: ch01-b04
          speaker: narrator
          text: 妻子不再说话，其实她也疼爱这两个小生命。说来也怪，茅屋里的食物从来没有短缺。孪生兄妹一天天长大，性情善良又温顺。养父母渐渐爱他们爱得不亚于亲生孩子，甚至还要更多几分。渔夫自己的几个儿子却爱争吵，又满怀妒意。他们不喜欢这对孤儿，三天两头就要捉弄他们。兄妹俩很快明白过来，只好常常躲开众人，独自在河岸边一待就是几个钟头。他们把早饭省下的一小块一小块面包掏出来，揉碎了喂给鸟儿。鸟儿也没有白吃他们的东西，教他们一大早起床，教他们歌唱，还教会了他们世上很少有人懂的鸟语。
        - id: ch01-b05
          speaker: narrator
          text: 兄妹俩尽量不和养兄争执，可日子还是越来越难过。一天早晨，大养兄终于说出了最伤人的话。
        - id: ch01-b06
          speaker: eldest_foster_brother
          text: 你们装得规规矩矩，好像比我们都强。可我们至少有爹有娘。你们只有一条河，跟癞蛤蟆和青蛙没两样！
        - id: ch01-b07
          speaker: narrator
          text: 两个孩子受了这样的羞辱，却一句也没有回嘴，心里只是难过极了。他们低声商量，觉得再也不能留在这个家里，必须到外面的世界去闯一闯，为自己寻找出路。第二天，他们和鸟儿起得一样早，谁也没有惊动，悄悄溜下楼。一扇窗户正开着，他们轻轻爬出去，径直跑到河边。望见河水，两人就像重新找到了朋友。他们沿着河岸一直向前走，盼望走着走着，能遇见一个愿意收留他们、照料他们的人。
        - id: ch01-b08
          speaker: narrator
          text: 兄妹走了一整天，一个活物也没看见。傍晚，他们又累又脚疼，终于望见一间小屋。可屋门紧闭，里面似乎没人，两人失望得快哭了。哥哥忍住眼泪，指着门外的长凳。
        - id: ch01-b09
          speaker: prince
          text: 至少这里还能坐一坐。等我们歇过来，再想接下来怎么办。
        - id: ch01-b10
          speaker: narrator
          text: 两人坐下以后，好一阵子都累得什么也看不见，什么也顾不上。慢慢缓过气来，他们才发现屋顶的瓦片下面栖着一大群燕子，彼此说说笑笑，聊得热闹极了。燕子们做梦也想不到，这两个孩子能听懂自己的语言。要是知道，它们准不会这样口无遮拦。可眼下，它们想到什么便说什么，半点也不避讳。
    - id: ch02
      title: 燕子说出的秘密
      blocks:
        - id: ch02-b01
          speaker: country_swallow
          text: 晚上好啊，城里的贵夫人！您在王宫住了这么多年，居然还肯回来看看早被忘掉的乡下朋友，真叫我们荣幸！
        - id: ch02-b02
          speaker: city_swallow
          text: 这只窝是父母留给我的，我当然要把它当家。你和家里人都好吗？
        - id: ch02-b03
          speaker: country_swallow
          text: 都好，谢天谢地。只是我女儿前阵子眼睛发炎，差点瞎了。幸好我找到神奇的药草，一下就把她治好了。
        - id: ch02-b04
          speaker: city_swallow
          text: 夜莺还唱得好吗？云雀还飞得那么高吗？红雀还打扮得那么漂亮吗？
        - id: ch02-b05
          speaker: country_swallow
          text: 我从来不搬弄闲话。我们鸟儿原本那么纯真，又那么守规矩，如今却让人类的坏榜样带坏了，实在可惜透顶。你想想，我们回来时，春天刚到，花开了，白昼也长了，偏有几只红雀要动身往寒冷的北方飞。我们完全是可怜它们，才劝它们别干这种傻事，它们却回了些无礼至极的话。还有那只冠羽云雀，从前多么胆小害羞，如今简直成了贼，哪里看见玉米和谷粒，哪里就有她去偷。
        - id: ch02-b06
          speaker: city_swallow
          text: 这可真让我吃惊。
        - id: ch02-b07
          speaker: country_swallow
          text: 更可气的还在后头。今年夏天我回来时，竟有一只不要脸的麻雀占了我的窝。我说：“这是我的窝。”他粗声大笑，反问：“你的？”接着又说，那明明是他的窝，他的祖先都生在那里，将来他的儿子也要生在那里。我丈夫听见，立刻扑上去，把他从窝里扔了出去。这种无法无天的事，城里总不会有吧？
        - id: ch02-b08
          speaker: city_swallow
          text: 倒不完全是这样。不过，我见过的事情多着呢。
        - id: ch02-b09
          speakers: [country_swallow, swallow_two, swallow_three]
          ensemble: chorus
          text: 快讲给我们听！快讲呀！
        - id: ch02-b10
          speaker: city_swallow
          text: 你们得先知道，我们的国王爱上了一个裁缝最小的女儿。那姑娘有多美，就有多善良温柔。贵族们原本都盼着国王从他们的女儿当中选一位王后，因此千方百计想拦住这门婚事。可国王一句也不肯听，照样同她结了婚。没过几个月，战争突然爆发，国王亲自率领军队出征。王后只得留在宫里，为两人的分离伤心不已。等战事平息，国王回来时，却有人告诉他，王后在他离开以后生下两个孩子，可两个孩子都死了。那些人还说，王后自己也发了疯，只得关进山中的高塔，也许住得久了，清新的空气能治好她。
        - id: ch02-b11
          speakers: [country_swallow, swallow_two, swallow_three]
          ensemble: chorus
          text: 难道这些都不是真的？
        - id: ch02-b12
          speaker: city_swallow
          text: 当然不是真的。亏你们还信！孩子那时活得好好的，就藏在园丁的小屋里。到了夜里，宫廷总管悄悄下来，把他们放进水晶摇篮，抱到河边，让水把他们带走。他们在河上平平安安漂了一整天。河水虽然很深，水流却非常平静，所以孩子一点也没受伤。第二天早晨，一个住在河岸附近的渔夫把他们救了起来。这件事，是我的翠鸟朋友亲口告诉我的。
        - id: ch02-b13
          speaker: narrator
          text: 两个孩子原本懒洋洋地躺在长凳上。听到养母常说的水晶摇篮，他们猛地坐起，彼此对望。两双眼睛都在说，幸好我们学会了鸟语。燕子们听说孩子获救，都庆幸他们运气好，以为等他们长大，就能回去认父亲、救母亲。
        - id: ch02-b14
          speaker: city_swallow
          text: 哪有那么容易。他们得证明自己是国王的孩子，还得证明王后从没发疯。只有真理之鸟能揭穿大臣的恶行，让国王知道自己错了，因为他会说人的语言。
        - id: ch02-b15
          speakers: [country_swallow, swallow_two, swallow_three]
          ensemble: chorus
          text: 真理之鸟在哪里？你又怎么知道？
        - id: ch02-b16
          speaker: city_swallow
          text: 有一天，我飞过王宫花园，碰见一只杜鹃。你们也知道，他总爱装作自己看得见未来。我们先说起宫里正在发生的事，又谈到多年前的旧事。杜鹃告诉我，只有会说人话的真理之鸟，才能揭穿大臣们的恶行，让国王明白自己错得有多厉害。我问他上哪儿能找到真理之鸟。他说，那只鸟关在一座城堡里，由一个凶猛的巨人把守。整整二十四个小时里，那巨人只睡一刻钟。
        - id: ch02-b17
          speaker: country_swallow
          text: 那座城堡在哪里？
        - id: ch02-b18
          speaker: city_swallow
          text: 那个地方，我偏偏不知道。我只能告诉你们，附近有座高塔，里面住着一个认得路的老巫婆。谁想请她指路，就得先答应从多彩泉取水回来，因为她施魔法时要用。可她绝不会亲口泄露真理之鸟究竟藏在哪里。她恨透了真理之鸟，要是杀得死他，早就下手了。偏偏那只鸟永远不会死，她只好把他严严实实地关着，再派背信之鸟日夜看守。这些坏鸟总想堵住他的嘴，不让任何人听见真理的声音。
        - id: ch02-b19
          speaker: country_swallow
          text: 王子到了高塔，就没有别人能帮他找到真理之鸟吗？
        - id: ch02-b20
          speaker: city_swallow
          text: 只有荒原上的一只猫头鹰知道。可他在人话里只会说“十字架”，王子哪能听懂？你们瞧，太阳快沉进海底的巢了。我也该回家啦。朋友们，晚安！
    - id: ch03
      title: 有来无回堡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 城里燕子飞走后，两个孩子因为听见这桩奇异的消息，欢喜得忘了饥饿和疲倦。他们起身朝她飞去的方向追赶。走了两个钟头，终于来到一座大城。他们猜想，这里一定就是父亲王国的都城。兄妹看见一个面相和善的女人站在家门口，便问她能不能留他们住一夜。女人见他们模样漂亮、举止有礼，十分喜欢，热情地迎他们进门。第二天天还没亮，妹妹已经扫净了各个房间，哥哥也给花园浇完了水。好心女人下楼时，家里什么活都不必做了。她高兴得不得了，求两个孩子永远留下来陪她。
        - id: ch03-b02
          speaker: prince
          text: 我很愿意让妹妹留在您身边，可我还有一件要紧事，不能耽搁。我要先告辞了。
        - id: ch03-b03
          speaker: narrator
          text: 王子独自上路，专挑最偏僻、最少人走的小径寻找高塔。三天过去，四面八方都没有高塔的影子。第四天早晨，情形依旧没有一点变化。他彻底绝望了，扑倒在一棵树下，把脸埋进双手。过了一会儿，头顶忽然传来枝叶摩擦的沙沙声。他抬起头，看见一只斑鸠停在上面，正用一双明亮的眼睛注视着他。
        - id: ch03-b04
          speaker: prince
          text: 斑鸠啊，求你告诉我，“有来无回堡”到底在哪儿？
        - id: ch03-b05
          speaker: turtle_dove
          text: 可怜的孩子，是谁叫你去做这种徒劳的事？
        - id: ch03-b06
          speaker: prince
          text: 也许是好运，也许是厄运。我自己也说不清。
        - id: ch03-b07
          speaker: turtle_dove
          text: 你跟着风走吧。今天的风正吹向那座城堡。
        - id: ch03-b08
          speaker: narrator
          text: 王子谢过斑鸠，顺着风一路向前。他一面走，一面害怕风会突然转向，把自己领错了路。可风仿佛也在怜悯这个孩子，始终稳稳地朝一个方向吹。每往前迈一步，四周就更荒凉一分。到了黄昏，他终于看见光秃秃的黑岩后面，立着一个比岩石还黑的影子。那正是巫婆的高塔。王子走上前，抓起门环重重敲了三下。三声巨响传进岩石间的凹谷，又一阵阵回荡回来。
        - id: ch03-b09
          speaker: narrator
          text: 门缓缓打开。一个老妇人站在门槛上，用蜡烛照着自己丑陋的脸。她身边爬满蜥蜴、甲虫和其他虫豸，吓得王子后退了一步。
        - id: ch03-b10
          speaker: witch
          text: 谁敢敲我的门，把我吵醒？快说你想要什么，不然有你好受！
        - id: ch03-b11
          speaker: prince
          text: 夫人，我相信只有您认得去“有来无回堡”的路。求您告诉我怎么走。
        - id: ch03-b12
          speaker: witch
          text: 很好，可今天太晚了。明天再去。你现在进来，跟我的蜥蜴睡在一起。
        - id: ch03-b13
          speaker: prince
          text: 我不能留下。我必须立刻回去，好在天亮前赶到出发的那条路。
        - id: ch03-b14
          speaker: witch
          text: 那你先答应我，把这个罐子装满城堡院里多彩泉的水，再送回来。你要是失信，我就让你永远变成蜥蜴。
        - id: ch03-b15
          speaker: prince
          text: 我答应您。
        - id: ch03-b16
          speaker: narrator
          text: 巫婆叫来一条瘦得皮包骨头的狗，命它把这个“猪崽子似的小鬼”领到“有来无回堡”，还要把他的到来告诉自己的巨人朋友。狗站起来抖抖身子，便领着王子上路。两个钟头后，一座又大、又黑、又阴森的城堡出现在眼前。大门敞得洞开，里面却既没有声响，也不见一点灯光，根本看不出有人住。狗像是早知道接下来会怎样，发出一声狂吠，径自走了进去。王子却不知道，此刻是不是巨人每天睡觉的那一刻钟，不敢贸然跟上。他停在附近的一棵野橄榄树下。这也是他同斑鸠分别以后，一路见到的唯一一棵树。
        - id: ch03-b17
          speaker: prince
          text: 上天啊，救救我吧！
        - id: ch03-b18
          speaker: owl
          text: 十字架！十字架！
        - id: ch03-b19
          speaker: narrator
          text: 王子认出燕子提过的猫头鹰，欢喜得跳起来，连忙改用鸟语。
        - id: ch03-b20
          speaker: prince
          text: 聪明的猫头鹰，求你保护我、指点我。我来找真理之鸟，可还得先把罐子装满院里的多彩泉水。
        - id: ch03-b21
          speaker: owl
          text: 别装多彩泉的水。旁边还有一眼清泉，你要装那里的水。然后进正对大门的鸟房。那些羽毛鲜艳的鸟都会说自己是真理之鸟，你一只也别碰。只找角落里那只白色小鸟。别的鸟一直想杀死他，却不知道他永远不死。快去！巨人刚睡着，你只有一刻钟。
    - id: ch04
      title: 真理之鸟重获自由
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王子用最快的速度飞奔进院子，果然看见两眼泉紧紧挨着。他从多彩泉旁边跑过，连看也没看一眼，只用另一眼清澈纯净的泉水装满罐子。接着，他赶到正对大门的鸟房。门刚在身后关上，铺天盖地的喧叫便震得他耳朵发麻。有孔雀的声音，有乌鸦的声音，也有喜鹊的声音。每一只鸟都大声宣称，自己才是真理之鸟。王子神色不变，从它们面前一一走过，直奔最里面的角落。一群凶恶的乌鸦正把一只白色小鸟团团围住。王子小心地把白鸟藏进怀里，安全带出鸟房，只留下背信之鸟在身后愤怒地尖叫。
        - id: ch04-b02
          speaker: narrator
          text: 他一口气跑回高塔，把罐子交给巫婆。
        - id: ch04-b03
          speaker: witch
          text: 给我变成鹦鹉吧！
        - id: ch04-b04
          speaker: narrator
          text: 巫婆抓过罐子，把泉水迎面泼到王子身上，等着看他失去人的模样。可王子并没有像从前那些受害者一样变成动物，反而一下子俊美了十倍。原来这眼泉里的水施的是善咒，并不是恶咒。簇拥在巫婆四周的蜥蜴、甲虫和爬虫见了，争先恐后地滚进洒落的泉水里。等它们重新站起身，竟一个个恢复了人的形貌。巫婆眼看自己的魔法被破，再也不敢停留，抓起扫帚骑上去，转眼便飞得无影无踪。
        - id: ch04-b05
          speaker: narrator
          text: 妹妹看见哥哥平安归来，怀里还带着真理之鸟，那份欢喜简直说不尽。王子虽然已经完成了这样了不起的事，却还有一道极难的关口要过。他得把真理之鸟送到国王面前，又不能让那些邪恶廷臣半路夺走。廷臣们很清楚，只要多年前的阴谋被揭穿，自己就会彻底完蛋。他们绝不会让真理之鸟轻易见到国王。
        - id: ch04-b06
          speaker: narrator
          text: 不知怎么，真理之鸟来到王宫附近的消息很快传开了。廷臣们立刻做足准备，磨快一批兵器，又给另一批兵刃涂上毒药。他们找来鹰和隼，要从空中追捕猎杀他，还打造了笼子和箱子。要是实在杀不死，就把他永远关住。他们甚至到处声称，真理之鸟那身白羽毛是后来披上去的，不过是为了遮住下面真正的黑羽毛。总之，只要能阻止国王见到这只鸟，或者让国王不相信他说的话，就没有什么卑劣的事是他们不肯做的。
        - id: ch04-b07
          speaker: narrator
          text: 事情往往就是这样，廷臣们最害怕发生什么，偏偏亲手促成了什么。他们越谈论真理之鸟，消息就传得越远，终于连国王也听说了。国王表示自己很想见他。廷臣们设置的阻碍越多，国王的愿望就越强烈。最后，国王正式颁下告示，无论是谁找到真理之鸟，都必须毫不耽搁地带来见他。
    - id: ch05
      title: 真相大白
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 王子看到告示，马上叫上妹妹，两人匆匆赶往王宫。他把真理之鸟藏在短上衣里面，将扣子扣得严严实实。果然不出所料，廷臣们在宫门前挡住兄妹俩，说什么也不准他们进去。王子反复解释，自己只是听从告示，照国王的命令把真理之鸟送来。廷臣们却一口咬定，陛下还没有起床，宫中有严令，任何人都不许把他惊醒。
        - id: ch05-b02
          speaker: narrator
          text: 双方还在宫门前争执不下，真理之鸟忽然替他们解决了难题。他从王子怀里飞出来，升到高处，穿过一扇敞开的窗户，径直进了国王自己的寝宫。真理之鸟轻轻落在国王头边的枕头上，面对国王，恭恭敬敬地行了一礼。
        - id: ch05-b03
          speaker: bird_of_truth
          text: 陛下，我就是您想见的真理之鸟。带我来的男孩被您的廷臣挡在宫外，我只好自己从窗户进来见您。
        - id: ch05-b04
          speaker: king
          text: 他们竟敢如此无礼，一定要为此付出代价！
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: 国王立刻命侍从把男孩领进寝宫。不一会儿，王子牵着妹妹的手走了进来。
        - id: ch05-b06
          speaker: king
          text: 你们是谁？你们和真理之鸟有什么关系？
        - id: ch05-b07
          speaker: prince
          text: 启禀陛下，请让真理之鸟亲自向您说明吧。
        - id: ch05-b08
          speaker: narrator
          text: 真理之鸟当着国王的面，把多年前那场邪恶阴谋从头到尾说得清清楚楚。直到这一刻，国王才第一次知道，坏人的计谋竟然得逞了这么多年，自己也被蒙骗了这么多年。他望着失而复得的一双儿女，眼泪一下涌上眼眶。他伸开双臂，把两个孩子紧紧搂进怀里。紧接着，他一刻也不肯耽搁，带着他们赶往山中的高塔，去接被无辜囚禁在那里的王后。
        - id: ch05-b09
          speaker: narrator
          text: 可怜的王后几乎一直生活在黑暗里，脸色已经白得像大理石。可是，当她亲眼看见失散多年的丈夫和孩子，血色立刻回到了脸上。她重新变得像从前一样美丽。一家人在隆重的仪仗中回到都城，城里举行了盛大的庆典，到处都是欢笑。那些策划阴谋的邪恶廷臣全被砍了头，财产也一概没收。至于当年从河里救起孩子、又含辛茹苦把他们养大的善良老夫妇，国王赐给他们财富和荣誉。从此，他们一直受到人们的敬爱和悉心照料，直到生命的尽头。
