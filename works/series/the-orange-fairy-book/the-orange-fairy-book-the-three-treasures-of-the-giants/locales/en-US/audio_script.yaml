  chapters:
    - id: ch01
      title: The Three Brothers Set Out
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Long, long ago, an old man and his wife lived with their three sons. Martin was the eldest, Michael came next, and Jack was the youngest. One evening, the family sat around the table eating bread and milk for supper. The old man suddenly spoke to Martin."
        - id: ch01-b02
          speaker: father
          text: "Martin, I do not think I have much longer to live. As my eldest son, you will inherit this hut. If you care for my blessing, treat your mother and your brothers well."
        - id: ch01-b03
          speaker: martin
          text: "Of course I will, Father. How could you think I might wrong them?"
        - id: ch01-b04
          speaker: narrator
          text: "Martin sounded offended, but as he answered, he helped himself to every choice piece in the dish. His father noticed nothing. Michael stared in surprise, and Jack was so astonished that he forgot to eat his own supper. Not long afterward, the father fell ill. He called his sons home from hunting to say farewell. After advising the two older boys, he turned to Jack."
        - id: ch01-b05
          speaker: father
          text: "My boy, you may not have as much sense as other people, but Heaven has given you a kind heart. Always listen to it. And follow your mother and brothers as well as you can."
        - id: ch01-b06
          speaker: narrator
          text: "The old man sank back on his pillows and died. Martin and Michael's cries filled the house. Jack stayed beside the bed, still and silent, almost as if he too were dead. At last he went into the garden, hid among the trees, and wept like a child while his brothers prepared the funeral. Once their father was buried, Martin and Michael decided to seek their fortunes together and leave Jack with their mother. Jack would gladly have sat dreaming by the fire. But his mother was old, and she said there was no work for him at home. He must go with his brothers and find some."
        - id: ch01-b07
          speaker: narrator
          text: "So one fine morning, all three set out. Martin and Michael carried two great bags packed with food, while Jack carried nothing. The day was hot, the bags were heavy, and his brothers grew angry with him. At noon they sat beneath a tree and began to eat from their store. Jack was just as hungry, but he knew asking them for a share would do no good. He lay down under another tree and cried bitterly."
        - id: ch01-b08
          speaker: martin
          text: "Maybe next time you won't be so lazy. You can bring your own food."
        - id: ch01-b09
          speaker: jack
          text: "What a fine pair you are! You say you're leaving so Mother won't have to support you, but first you take every bit of food she had in the house."
        - id: ch01-b10
          speaker: narrator
          text: "The answer stopped both brothers. For a while, neither spoke. Then they offered Jack some food, and after he had eaten, they continued on their way. Near evening they came to a little hut. A woodcutter let them in and invited them to supper. Proud Martin thanked him but said they needed only a place to sleep, since they had plenty to eat. He and Michael opened their bags while Jack hid in a corner. The woodcutter's wife pitied Jack and called him to share their meal. He gladly came, and the savory soup tasted very good. Martin smelled it and deeply regretted his proud refusal. His own bread and cheese seemed hard and poor beside Jack's supper."
        - id: ch01-b11
          speaker: martin
          text: "He won't get another chance like that."
        - id: ch01-b12
          speaker: narrator
          text: "The next morning, Martin led them deep into a thick forest where they were unlikely to meet anyone. With no path to follow, they wandered for a long time. At last they reached a broad clearing, and a castle stood in its center. Jack shouted with delight. Martin was already in a foul temper."
        - id: ch01-b13
          speaker: martin
          text: "We've gone the wrong way. Let's turn back."
        - id: ch01-b14
          speaker: michael
          text: "You fool! We set out to travel the world. What difference does it make whether we turn right or left?"
        - id: ch01-b15
          speaker: narrator
          text: "Michael was hungry too, and hunger had made him cross. He started down the path toward the castle without another word. Jack followed close behind. Martin stood there for a moment, then followed them as well."
    - id: ch02
      title: The Castle of the Giants
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The castle door stood open. The brothers entered a great hall and looked around, but not a living creature was there. Martin suddenly felt frightened, though he could not say why. He was ready to leave when Jack boldly opened a door in the wall. Martin was ashamed to let his youngest brother outdo him, so he followed Jack into a splendid hall. Great copper coins filled it from floor to ceiling. Martin and Michael were dazzled. They dumped the last of their provisions out of their bags and filled them with copper instead."
        - id: ch02-b02
          speaker: narrator
          text: "Then Jack opened another door and found a hall full of silver. His brothers immediately tipped out the copper and shoveled silver into their bags. Jack opened a third door before they had scarcely finished. All three drew back in wonder. The room was one bright mass of gold, so brilliant that looking at it hurt their eyes. They soon recovered and poured out the silver. This time, they packed their bags with gold until not another piece would fit."
        - id: ch02-b03
          speaker: martin
          text: "We should hurry away before somebody comes. If anyone finds us here, we won't know what to do."
        - id: ch02-b04
          speaker: narrator
          text: "Martin rushed from the castle, with Michael behind him. Jack stayed long enough to put a little gold, silver, and copper in his pockets. Then he ate the food his brothers had thrown onto the floor of the first room. He found them resting in the forest near sunset. Martin was hungry by then and ordered Jack to go back for the abandoned bread and cheese."
        - id: ch02-b05
          speaker: jack
          text: "There isn't much point. I picked up the food and ate it."
        - id: ch02-b06
          speaker: narrator
          text: "Both brothers flew into a rage. They fell upon Jack, beating him and calling him names until they had tired themselves out."
        - id: ch02-b07
          speaker: martin
          text: "Go anywhere you please, but never come near us again!"
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: "Martin gave him one last kick, and poor Jack ran crying into the woods. The next morning, Martin and Michael went home. With their gold, they bought a beautiful house and lived there with their mother like great lords. Jack stayed hidden for several hours, grateful that his tormentors were gone. When no one came after him and his back hurt less, he began to consider what to do. He decided to return to the castle and carry away enough money to live comfortably for the rest of his life."
        - id: ch02-b09
          speaker: narrator
          text: "Jack followed the path back. The castle door was open as before, and he made his way to the hall of gold. He took off his jacket and tied the sleeves together to make a bag. As he poured gold into it by the handful, a sound like thunder shook the castle. Then a voice as rough as a bull's roared through the room."
        - id: ch02-b10
          speaker: first_giant
          text: "I smell a man!"
        - id: ch02-b11
          speaker: narrator
          text: "Two giants entered. The larger one glared at Jack."
        - id: ch02-b12
          speaker: first_giant
          text: "So you're the little worm stealing our treasure! We have you now, and we'll cook you for supper."
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: "The other giant pulled his companion aside, and they whispered together for a moment. Then the first giant addressed Jack again."
        - id: ch02-b14
          speaker: first_giant
          text: "My friend wants me to spare you, so I will, on one condition. From now on, you must guard our treasure. Whenever you're hungry, rap on this little table and say, 'The dinner of an emperor!' It will give you all the food you want."
        - id: ch02-b15
          speaker: narrator
          text: "Jack happily promised to do everything the giants asked. For several days, he enjoyed himself greatly. He had all the food he could want, everything else he wished for, and no work to do from morning until night. Before long, however, he grew thoroughly tired of that life."
        - id: ch02-b16
          speaker: jack
          text: "The giants can guard their own treasure. I'm leaving. I'll take none of their gold or silver, only you, my good little table."
        - id: ch02-b17
          speaker: narrator
          text: "He tucked the table under his arm, crossed the forest without delay, and soon reached the fields beyond it."
    - id: ch03
      title: The Three Magic Treasures
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "In the fields, Jack met an old man who begged him for something to eat."
        - id: ch03-b02
          speaker: jack
          text: "You couldn't have asked anyone better. Come and sit with me under this tree."
        - id: ch03-b03
          speaker: narrator
          text: "Jack placed the table before them and struck it three times."
        - id: ch03-b04
          speaker: jack
          text: "The dinner of an emperor!"
        - id: ch03-b05
          speaker: narrator
          text: "The words were hardly out of his mouth when every kind of fish and meat appeared. The old man ate until he wanted no more."
        - id: ch03-b06
          speaker: first_old_man
          text: "That's a very clever trick. Give me your table, and I'll trade you an even better treasure. See this cornet? Ask it for an army, and it will give you as many soldiers as you need."
        - id: ch03-b07
          speaker: narrator
          text: "Since being left on his own, Jack had grown ambitious. He hesitated only a moment before exchanging the table for the cornet. The old man said farewell and took one path, while Jack chose another. For a long time, Jack was delighted with his new possession. Then hunger came upon him. There was no house in sight, and he badly wanted supper. He wished he had his table again. Suddenly he remembered the cornet, and a wicked thought came to him."
        - id: ch03-b08
          speaker: jack
          text: "Two hundred hussars, forward!"
        - id: ch03-b09
          speaker: narrator
          text: "At once, horses neighed and swords clanked close by. The officer leading the hussars rode up to Jack."
        - id: ch03-b10
          speaker: officer
          text: "What are your orders?"
        - id: ch03-b11
          speaker: jack
          text: "A mile or two down that road, you'll find an old man with a table. Take it from him and bring it to me."
        - id: ch03-b12
          speaker: narrator
          text: "The officer saluted and returned to his men. They galloped away to carry out the order. Within ten minutes, they were back with the table."
        - id: ch03-b13
          speaker: jack
          text: "That's all. Thank you."
        - id: ch03-b14
          speaker: narrator
          text: "The soldiers vanished into the cornet. Jack ate an excellent supper that night and quite forgot that he owed it to a mean trick. He breakfasted early the next morning and walked toward the nearest town. On the road, he met another old man who also begged for food."
        - id: ch03-b15
          speaker: jack
          text: "Certainly. I'll give you something to eat. The dinner of an emperor!"
        - id: ch03-b16
          speaker: narrator
          text: "Jack set the table on the ground, and dishes of every kind appeared. At first, the old man ate greedily without speaking. When his hunger was satisfied, he turned to Jack."
        - id: ch03-b17
          speaker: second_old_man
          text: "Your table has a remarkable trick. Give it to me, and I'll give you something better."
        - id: ch03-b18
          speaker: jack
          text: "I don't believe anything could be better."
        - id: ch03-b19
          speaker: second_old_man
          text: "There is. Take this bag. It will give you as many castles as you could ever want."
        - id: ch03-b20
          speaker: narrator
          text: "Jack considered the offer."
        - id: ch03-b21
          speaker: jack
          text: "Very well. I'll make the exchange."
        - id: ch03-b22
          speaker: narrator
          text: "He handed over the table and hung the bag on his arm. Five minutes later, he called five hundred lancers from the cornet. He ordered them to pursue the old man and bring the table back, just as the hussars had done before. By this cunning, Jack now possessed all three magic objects: the table that supplied food, the cornet that supplied soldiers, and the bag that supplied castles. With all three in his hands, he decided to return to the place where he had been born."
    - id: ch04
      title: Jack Comes Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Jack smeared dirt over his face and tore his clothes until he looked like a beggar. He stopped people passing on the road. Pretending to ask for food or money, he questioned them about news from the village. In this way, he learned that his brothers had become important men and were respected throughout the countryside. He went straight to their fine house and begged them for food and shelter. They answered with harsh words and told him to beg somewhere else. Only when their mother pleaded for him did they allow him to sleep in the stable."
        - id: ch04-b02
          speaker: narrator
          text: "Jack waited in the stable until everyone in the house was sound asleep. Then he pulled the bag from beneath his cloak and commanded a castle to rise in that very place. The cornet supplied soldiers to stand guard around the castle, while the table served him a good supper inside. When morning came, Jack caused the castle, the guards, and the feast to vanish. His brothers entered the stable and found no sign of any of it. Jack was lying on the straw just as a penniless beggar might."
        - id: ch04-b03
          speaker: narrator
          text: "He remained in the stable for many days, doing nothing and, as far as anyone could tell, eating nothing. His brothers could not understand how he lived that way. They questioned him so constantly that he finally revealed the secret of the table. To prove it, he served them a dinner more magnificent than anything they had ever seen or even heard described. Martin and Michael solemnly promised to tell no one. Somehow, though, the story escaped from the house. It spread until it reached the king himself. That same evening, the king's chamberlain arrived at Jack's dwelling. He carried a request from His Majesty, who wished to borrow the table for three days."
        - id: ch04-b04
          speaker: jack
          text: "Very well. Take it with you. But tell His Majesty that if it isn't returned after three days, I will go to war with him."
        - id: ch04-b05
          speaker: narrator
          text: "The chamberlain carried the table straight to the king and repeated Jack's threat. The two men laughed until their sides hurt."
    - id: ch05
      title: The King and the Magic Table
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "The king was delighted with the table and every dinner it provided. When the three days ended, he could not make himself give it up. Instead, he summoned his carpenter and ordered him to copy the little table exactly. Once the copy was ready, the king gave it to his chamberlain to return to Jack, along with His Majesty's best thanks. The chamberlain knew nothing of the trick. He arrived at dinner time, and Jack invited him to stay. During the past three days, the man had enjoyed several excellent meals supplied by the true table. He gladly accepted the invitation, even though this time he would be dining in a stable. He sat down beside Jack on the straw and waited eagerly for the food."
        - id: ch05-b02
          speaker: jack
          text: "The dinner of an emperor!"
        - id: ch05-b03
          speaker: narrator
          text: "Not even a crumb of cheese appeared."
        - id: ch05-b04
          speaker: jack
          text: "The dinner of an emperor!"
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: "Jack's second command rang out like thunder. Then he understood what had happened. He crushed the false table between his hands and faced the chamberlain. The bewildered, half-frightened man was already wondering how he might escape."
        - id: ch05-b06
          speaker: jack
          text: "Tell your lying king that tomorrow I'll destroy his castle as easily as I broke this table."
          emotion: angry
        - id: ch05-b07
          speaker: narrator
          text: "The chamberlain hurried back to the palace with the message. The king laughed harder than before and called all his courtiers to hear the tale. They were far less cheerful when they awoke the next morning. Ten thousand horsemen and ten thousand archers surrounded the palace. The king knew resistance was useless. Carrying a white flag in one hand and the true table in the other, he went out to find Jack."
        - id: ch05-b08
          speaker: king
          text: "I have committed a crime, and I will do all I can to repair it. Here is your table. I confess with shame that I tried to steal it. And I will also give you my daughter as your wife."
        - id: ch05-b09
          speaker: narrator
          text: "There was no reason to delay the wedding when the table could provide the finest banquet anyone had ever seen. The marriage took place, and the magic table covered the feast with food and drink. When every guest had eaten and drunk as much as they wished, Jack took out the bag. He commanded a castle filled with every kind of treasure to rise in the park for himself and his bride. It appeared at his command. At this fresh display of Jack's power, the king's heart failed him."
        - id: ch05-b10
          speaker: king
          text: "Your magic is stronger than mine. You are young and powerful, while I am old and tired. Take the scepter from my hand and the crown from my head. Rule my people better than I did."
        - id: ch05-b11
          speaker: narrator
          text: "At last, Jack's ambition was satisfied. He could rise no higher than king, and with the cornet to summon soldiers, no enemy could threaten him."
    - id: ch06
      title: The Fate of the Treasures
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "Jack never forgave his brothers for their cruelty. But he gave his mother a beautiful castle and everything she could possibly desire. In the center of his own palace stood a treasure chamber. There he kept the table, the cornet, and the bag as his most precious possessions. Not one week passed without King John visiting the room to make certain they were safe."
        - id: ch06-b02
          speaker: narrator
          text: "He ruled long and well. When he finally died as a very old man, his people loved him. His sons and grandsons did not follow his good example. They became so proud that they were ashamed to remember how the founder of their royal family had once been a poor boy. Yet while the table, the cornet, and the bag were shown in the treasure chamber, neither the kings nor the rest of the world could forget Jack's beginnings. At last, one king, more foolish than all the others, ordered the three treasures removed. They were pushed out of sight into a dark, damp cellar."
        - id: ch06-b03
          speaker: narrator
          text: "For a time, the kingdom survived, though each passing year left it weaker than before. Then one day, a rumor reached the king that a mighty army was marching against him. He dimly remembered old tales of a magic cornet that could provide enough soldiers to conquer the whole earth. He also recalled that his grandfather had removed it to a cellar. The king hurried down into that black and slimy place. If he could find the cornet and make it work again, he hoped to restore his power before the enemy arrived."
        - id: ch06-b04
          speaker: narrator
          text: "He found the three treasures, but their magic was gone. The table crumbled when he touched it. Inside the cornet were only scraps of leather belts, gnawed by rats. The bag held nothing but broken pieces of stone."
        - id: ch06-b05
          speaker: narrator
          text: "The king bowed his head before the doom awaiting him. In his heart, he cursed the ruin caused by his own pride and foolishness, and by the pride and foolishness of those who came before him."
