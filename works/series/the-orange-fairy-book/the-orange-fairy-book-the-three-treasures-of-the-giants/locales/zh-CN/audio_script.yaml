audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    father:
      display_name: 父亲
      tts:
        delivery: 年迈慈爱，临终叮嘱时语气郑重
        timbre: 苍老温厚
        pace: 缓慢
        pitch: 低
    martin:
      display_name: 马丁
      tts:
        delivery: 骄傲自私，发怒时尖刻强硬
        timbre: 粗实响亮
        pace: 稍快
        pitch: 中低
    michael:
      display_name: 迈克尔
      tts:
        delivery: 急躁直接，说话干脆
        timbre: 清晰结实
        pace: 稍快
        pitch: 中
    jack:
      display_name: 杰克
      tts:
        delivery: 质朴坦率，后来逐渐自信而威严
        timbre: 明亮温和
        pace: 适中
        pitch: 中
    giant_1:
      display_name: 大巨人
      tts:
        delivery: 凶猛威严，声音具有压迫感
        timbre: 粗哑浑厚
        pace: 稍慢
        pitch: 低
    old_man_1:
      display_name: 第一个老人
      tts:
        delivery: 老练从容，提出交换时颇有把握
        timbre: 苍老清楚
        pace: 适中
        pitch: 中低
    officer:
      display_name: 骑兵军官
      tts:
        delivery: 恭敬利落，军人气质鲜明
        timbre: 洪亮坚实
        pace: 适中
        pitch: 中低
    old_man_2:
      display_name: 第二个老人
      tts:
        delivery: 精明沉着，语气笃定
        timbre: 苍老柔和
        pace: 适中
        pitch: 中低
    chamberlain:
      display_name: 侍从长
      tts:
        delivery: 彬彬有礼，受惊时略显慌乱
        timbre: 圆润清晰
        pace: 适中
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 起初傲慢轻慢，认输后惭愧疲惫
        timbre: 深沉饱满
        pace: 稍慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 三兄弟离家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，一对老夫妻有三个儿子。老大叫马丁，老二叫迈克尔，最小的叫杰克。一家人住在一间简陋的小屋里。一天傍晚，全家围着桌子吃面包泡牛奶，父亲忽然开了口。
        - id: ch01-b02
          speaker: father
          text: 马丁，我恐怕活不了多久了。你是长子，这间小屋以后归你。你若还看重父亲的祝福，就要好好照顾母亲和两个弟弟。
        - id: ch01-b03
          speaker: martin
          text: 那当然了，父亲。您怎么会觉得我会亏待他们？
        - id: ch01-b04
          speaker: narrator
          text: 马丁说得气愤，手上却把盘里最好吃的东西全夹给自己。父亲没看见，迈克尔惊讶地盯着他，杰克更吃惊得连饭都忘了吃。不久，父亲病倒了。他把正在打猎的三个儿子叫回床前，先叮嘱两个哥哥，最后望向杰克。
        - id: ch01-b05
          speaker: father
          text: 孩子，你不如别人聪明。上天少给了你一些才智，却给了你一颗善良的心。往后要听这颗心的话，也要尽力听母亲和哥哥们的劝告。
        - id: ch01-b06
          speaker: narrator
          text: 老人说完，倒在枕上去世了。马丁和迈克尔放声大哭，杰克却默默守在床边，仿佛也没了气息。很久以后，他才走进花园，藏在树丛里，像孩子一样哭。哥哥们则忙着准备葬礼。
        - id: ch01-b07
          speaker: narrator
          text: 父亲刚下葬，马丁和迈克尔就商量好，要一同出去闯荡，寻找各自的前程，把杰克留在家里陪母亲。杰克最喜欢守着炉火坐下做梦，巴不得永远留在家中。可母亲也已经老了。她坚持说，家里没有活儿给杰克做，他必须跟哥哥们一起出去找事做。
        - id: ch01-b08
          speaker: narrator
          text: 一个晴朗的早晨，三兄弟上路了。两个哥哥各背一大袋食物，杰克却空着手。天很热，口袋很沉，哥哥们越走越恼火。中午，他们在树下吃东西。杰克也饿，却知道讨不到，只能躲到另一棵树下哭。
        - id: ch01-b09
          speaker: martin
          text: 下次别再这么懒了，记得给自己带吃的。
        - id: ch01-b10
          speaker: jack
          text: 你们这对哥哥真有意思！说是出去谋生，不再拖累母亲，结果一出门就把她家里的食物全拿走了！
        - id: ch01-b11
          speaker: narrator
          text: 两个哥哥没想到杰克会这样回答，一时都说不出话。后来，他们分了食物给他。杰克吃饱后，三个人继续赶路。
        - id: ch01-b12
          speaker: narrator
          text: 傍晚，他们来到一间小屋，敲门询问能否借宿。屋主人是个樵夫，他请三兄弟进来，还招呼他们坐下一起吃晚饭。马丁道了谢，却摆出骄傲的样子，说他们带足了食物，只需要一个睡觉的地方。他和迈克尔马上打开口袋，吃起干硬的面包和奶酪，杰克则躲进角落。樵夫的妻子看见后很可怜他，叫他过来同吃。杰克高高兴兴地喝着香喷喷的汤，觉得美味极了。马丁闻着汤香，再嚼嚼自己的干粮，后悔得不得了。
        - id: ch01-b13
          speaker: narrator
          text: 他暗下决心，再也不给杰克碰上这种好事。第二天，他硬要大家钻进一片浓密的森林，因为那里遇不到人。
    - id: ch02
      title: 森林里的城堡
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 林中没有道路，他们来回绕了很久，才走到一片宽阔的空地。空地中央有一座城堡。杰克欢喜地叫起来，马丁却烦躁地说他们走错了。
        - id: ch02-b02
          speaker: martin
          text: 这条路不对，我们回去！
        - id: ch02-b03
          speaker: michael
          text: 蠢货！我们本来就是出来闯荡的，向左还是向右有什么要紧？
        - id: ch02-b04
          speaker: narrator
          text: 迈克尔也饿了，而人一饿，脾气常常就坏起来。他说完便踏上通往城堡的小路。杰克紧跟在后，马丁迟疑片刻，也只好同行。城堡大门敞开着，三个人走进一座宽阔大厅，四下望去，连一个活物都没有。马丁自己也说不清为什么，心里忽然有些害怕，恨不得马上离开。可杰克已经大胆地走到墙边，推开一扇门。马丁想到自己若连弟弟都比不过，实在太丢脸，只得跟进去。
        - id: ch02-b05
          speaker: narrator
          text: 门后又是一座富丽堂皇的大厅，从地板一直到天花板，堆满一大块一大块的铜币。马丁和迈克尔看得眼花缭乱，马上把口袋里剩下的食物全倒在地上，改成一把把装铜币。他们才装满，杰克又推开一扇门，后面是一整座银子大厅。两个哥哥立刻把口袋翻过来，铜币哗啦啦滚了一地。他们蹲下身，又把银子一把把铲进口袋。
        - id: ch02-b06
          speaker: narrator
          text: 他们才刚装完，杰克又打开第三扇门。三个人惊得一齐向后退去。这间屋子简直是一片黄金，耀眼的金光刺得他们看久了眼睛发痛。他们很快从惊讶中醒过来，哥哥们又把银子全倒掉，换成一把把的黄金。直到袋口再也塞不进一块，马丁才催大家赶快离开。他怕有人突然来到，而他们不知道该怎样应付。
        - id: ch02-b07
          speaker: narrator
          text: 马丁和迈克尔匆匆走了。杰克多留了一会儿，在衣袋里各装几块金银铜币，又吃掉哥哥们扔下的食物。他追进森林时，哥哥们正在休息。太阳快落山，马丁饿了，就叫杰克回城堡拿面包和奶酪。
        - id: ch02-b08
          speaker: jack
          text: 不用再跑一趟了。我已经把那些食物捡起来吃掉了。
        - id: ch02-b09
          speaker: narrator
          text: 两个哥哥气疯了，一齐扑上来，又打又骂，直到自己累得动不了。
        - id: ch02-b10
          speaker: martin
          text: 随你滚到哪儿去，再也不许靠近我们！
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: 马丁最后又踢了他一脚。杰克哭着逃进树林。第二天，两个哥哥带着黄金回家，买下漂亮的大房子，和母亲过起了阔人的生活。
        - id: ch02-b12
          speaker: narrator
          text: 杰克躲了几个钟头，庆幸那两个折磨他的人没有找来。等背上不那么疼，也确定无人再来为难，他开始思量下一步该怎么办。最后，他决定重返城堡，带走足够自己安稳生活一辈子的钱。主意一定，他马上沿原路走回去。城堡大门仍然敞开。他一路来到黄金大厅，脱下外衣，把两只袖子扎在一起，当成一只口袋。杰克正一把把往里装金子，整座城堡忽然被雷鸣般的巨响震动了。
        - id: ch02-b13
          speaker: giant_1
          text: 我闻见了人的气味。
        - id: ch02-b14
          speaker: narrator
          text: 两个巨人走进大厅。最大的那个一眼看见了杰克。
        - id: ch02-b15
          speaker: giant_1
          text: 好哇，小虫子！原来是你偷我们的财宝！这回抓住你了，我们要把你煮来当晚饭！
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: 另一个巨人把同伴拉开，两人低声商量了一阵。大巨人回来后，改变了主意。
        - id: ch02-b17
          speaker: giant_1
          text: 看在我朋友的面上，我饶你一命。不过，从今以后，你得替我们看守财宝。饿了就敲一敲这张小桌，说“皇帝的宴席”，桌上自然会有你想吃的东西。
        - id: ch02-b18
          speaker: narrator
          text: 杰克心里一松，高高兴兴地答应了巨人提出的所有条件。头几天，他过得快活极了。想要什么，桌子就给他什么。从早到晚，他连一件事也不必做。每天都是这样，无所事事，也什么都不缺。可日子一天天过去，他渐渐觉得无聊，最后彻底厌倦了。
        - id: ch02-b19
          speaker: jack
          text: 让巨人自己守财宝吧，我要走了。金银我都不拿，只带你走，我的好桌子。
    - id: ch03
      title: 桌子与号角
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 杰克把桌子夹在腋下，穿过森林，来到另一边的田野。一个老人向他讨东西吃。
        - id: ch03-b02
          speaker: jack
          text: 您可真找对人了。来，坐到树下吧。
        - id: ch03-b03
          speaker: narrator
          text: 杰克招手请老人和自己一同坐在树下。他把小桌摆在两人面前，伸手在桌面上敲了三下，然后高声喊出那句命令。
        - id: ch03-b04
          speaker: jack
          text: 皇帝的宴席！
        - id: ch03-b05
          speaker: narrator
          text: 各式各样的鱼和肉立刻摆满桌面。老人吃饱以后，很想得到这件宝物。
        - id: ch03-b06
          speaker: old_man_1
          text: 你这一手真了不起。把桌子给我，我拿一件更好的宝物交换。看见这只号角了吗？你只要告诉它需要一支军队，想要多少士兵，就会来多少士兵。
        - id: ch03-b07
          speaker: narrator
          text: 自从独自生活以来，杰克的野心渐渐大了。他迟疑片刻，还是接过号角，把桌子交给老人。两人互相告别，老人走上一条路，杰克选了另一条。很长一段时间里，他都对这件新宝物十分满意。后来，他饿得厉害，四周又看不见一户人家，便想把那张能变出晚饭的桌子要回来。就在这时，他记起了手中的号角，一个坏念头钻进心里。
        - id: ch03-b08
          speaker: jack
          text: 两百名轻骑兵，前进！
        - id: ch03-b09
          speaker: narrator
          text: 战马嘶鸣，刀剑铿锵，两百名骑兵出现在近旁。领头的军官来到杰克面前，恭敬地等待命令。
        - id: ch03-b10
          speaker: officer
          text: 请问您要我们做什么？
        - id: ch03-b11
          speaker: jack
          text: 沿这条路走一两英里，有个老人带着一张桌子。把桌子夺回来，交给我。
        - id: ch03-b12
          speaker: narrator
          text: 军官敬礼后带兵飞驰而去。十分钟后，他们把桌子带回来了。
        - id: ch03-b13
          speaker: jack
          text: 没事了，多谢你们。
        - id: ch03-b14
          speaker: narrator
          text: 士兵们随即消失在号角里。杰克当晚吃了一顿多么丰盛的晚餐啊，他完全忘记这顿饭是靠卑劣的手段弄来的。第二天，他一早便吃过早餐，继续朝最近的城镇走去。路上，他又遇见一个老人。那老人和先前的人一样，也请求杰克给自己一点吃的。
        - id: ch03-b15
          speaker: jack
          text: 当然可以，我这就给您吃的。
        - id: ch03-b16
          speaker: narrator
          text: 杰克把桌子放在地上，再次唤来皇帝的宴席。老人狼吞虎咽，吃饱以后才开口。
        - id: ch03-b17
          speaker: old_man_2
          text: 你这张桌子真有本事。把它给我，我送你一件更好的东西。
        - id: ch03-b18
          speaker: jack
          text: 我可不信还有什么东西比它更好。
        - id: ch03-b19
          speaker: old_man_2
          text: 真有。瞧这只口袋，它能给你变出城堡。你想要多少座，就能有多少座。
        - id: ch03-b20
          speaker: jack
          text: 好吧，我跟您换。
        - id: ch03-b21
          speaker: narrator
          text: 杰克交出桌子，把口袋挎到胳膊上。五分钟后，他又从号角里召出五百名长矛骑兵，命令他们追上老人，取回桌子。就这样，他用计把三件魔法宝物全弄到了手。
    - id: ch04
      title: 马厩里的秘密
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 杰克用计得到三件魔法宝物以后，决定返回故乡。他往脸上抹满泥，又把衣服撕破，装成一个乞丐。一路上，他拦住过路人，假装讨钱讨饭，趁机打听村里的消息。就这样，他知道两个哥哥已经成了大人物，在方圆一带很受敬重。杰克听完便赶到他们的漂亮房子门前，苦苦请求哥哥们给他一点食物，再给他一个过夜的地方。
        - id: ch04-b02
          speaker: narrator
          text: 哥哥们只用恶言赶他走。母亲再三求情，他们才准杰克睡在马厩里。夜深后，杰克拿出口袋，命令原地出现一座城堡，又召来士兵守卫，让桌子摆出丰盛的晚餐。清晨，他把一切收走。哥哥们来到马厩，只见杰克躺在稻草上。
        - id: ch04-b03
          speaker: narrator
          text: 杰克在马厩一连住了许多天。他什么事也不做，而且在旁人眼里，连东西也不吃。哥哥们越看越疑惑，不停向他追问。杰克终于说出了桌子的秘密，还摆出一顿宴席请他们品尝。那顿饭的丰盛，远远超过他们从前见过或听说过的任何宴席。两位哥哥郑重保证守口如瓶，可不知怎么，消息还是泄露了，没过多久便传进国王耳朵。当天晚上，侍从长来到杰克的住处，说国王想借桌子用三天。
        - id: ch04-b04
          speaker: jack
          text: 可以，你带走吧。不过请转告国王，三天后若不归还，我就向他开战。
        - id: ch04-b05
          speaker: narrator
          text: 侍从长把桌子径直送到王宫，也把杰克的威胁一字不漏地告诉国王。两个人听完，笑得肚子都疼。国王喜欢极了这张桌子，更舍不得它变出的美味宴席。三天期满，他怎么也下不了决心归还，便召来木匠，命他照原样仿造一张。假桌做好后，国王让侍从长送回杰克那里，还请他带上自己最诚挚的谢意。
        - id: ch04-b06
          speaker: narrator
          text: 侍从长并不知道骗局。正赶上饭点，杰克留他同吃。他这三天享用过不少桌子变出的美餐，便欣然坐到马厩的稻草上。
        - id: ch04-b07
          speaker: jack
          text: 皇帝的宴席！
        - id: ch04-b08
          speaker: narrator
          text: 桌上连一小块奶酪也没有。杰克用雷鸣般的声音再喊一次，还是毫无动静。他终于明白发生了什么，双手一压，把假桌压得粉碎。侍从长又怕又迷惑，正想着怎样逃走。
        - id: ch04-b09
          speaker: jack
          text: 告诉你那个不守信的国王，明天我毁掉他的城堡，会像毁掉这张桌子一样容易。
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: 侍从长赶回王宫，把杰克的话转告国王。国王笑得比上次更响，还召来所有朝臣一起听这个笑话。可是第二天早晨，他们从睡梦中醒来，看见一万名骑兵和同样多的弓箭手把王宫围得水泄不通，就再也笑不出来了。国王明白继续抵抗毫无用处，只好一手举着求和的白旗，一手拿着真正的桌子，亲自出门寻找杰克。
    - id: ch05
      title: 杰克成为国王
      blocks:
        - id: ch05-b01
          speaker: king
          text: 我犯了罪，也会尽力补偿。这是你的桌子。我羞愧地承认，我曾想把它偷走。除此以外，我还要把女儿嫁给你。
        - id: ch05-b02
          speaker: narrator
          text: 有了这张神奇的桌子，婚事根本不必拖延。它为婚礼摆出一场从未有人见过的盛大宴席，所有宾客都尽情吃喝，直到心满意足。宴席过后，杰克拿出口袋，命令一座装满各种珍宝的城堡出现在王家园林里，供自己和新娘居住。国王亲眼看见杰克的力量，吓得心都凉了。
        - id: ch05-b03
          speaker: king
          text: 你的魔法比我的力量更强。你年轻健壮，我已经又老又累。拿走我手里的权杖和头上的王冠吧。请你接替我统治百姓，也要比我统治得更好。
        - id: ch05-b04
          speaker: narrator
          text: 杰克的野心终于满足了。他已经当上国王，不可能再有更高的地位。只要号角还在，随时能为他召来士兵，他也不怕任何敌人。可是，他始终没有原谅两位哥哥从前怎样对待自己。对母亲却不同，他送给她一座美丽的城堡，还把她能想到的一切都送到她身边。
        - id: ch05-b05
          speaker: narrator
          text: 杰克自己的宫殿中央有一间藏宝室。桌子、号角和口袋珍藏在里面，是他最心爱的宝物。约翰国王每个星期都亲自查看，确认它们安然无恙。他在位很久，把国家治理得很好，直到年纪很大才去世，百姓都爱戴他。
        - id: ch05-b06
          speaker: narrator
          text: 可他的儿孙没有学到这个好榜样。他们越来越骄傲，一想到王族的始祖曾经是个穷孩子，便觉得羞耻。只要桌子、号角和口袋还陈列在藏宝室，他们自己和全天下的人就都忘不了这段往事。后来，有一位国王比其他人更加愚蠢。他索性把三件宝物从藏宝室搬走，扔进一间阴暗潮湿的地窖。
    - id: ch06
      title: 地窖中的宝物
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 三件宝物被扔进地窖以后，王国又延续了一些年，却一年比一年衰弱。一天，有消息传到国王耳中，说一支庞大的军队正朝这个国家进发。国王这才模模糊糊记起旧日听过的传说。祖父扔进地窖的那只魔法号角，曾经能召来足以征服天下的士兵。只要找到它，也许王国就能重新强大起来。
        - id: ch06-b02
          speaker: narrator
          text: 国王匆匆赶到地窖，想靠这些宝物重新取得昔日的力量。在那又黑又湿滑的地方，桌子、号角和口袋果然还在。可他的手才碰到桌子，桌子便散成碎片。号角里已经没有军队，只剩几截被老鼠咬坏的皮带。那只曾能变出城堡的口袋里，也只剩下一堆破碎的石块。
        - id: ch06-b03
          speaker: narrator
          text: 国王低下头，接受了即将降临的厄运。他在心里诅咒自己和祖先的骄傲与愚蠢，因为正是这些毁掉了整个王国。
        - id: ch06-b04
          speaker: narrator
          text: 这个故事选自路易·莱热的《斯拉夫民间故事集》。
