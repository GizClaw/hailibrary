cover_prompt: |-
  A wordless cover scene in a timeless enchanted woodland shows a dark-haired young princess in a flowing orange-and-cream gown opening a small magic book beneath an ancient fruit tree heavy with glowing oranges. A white doe steps gently from silver birches beside her, while a broad-winged owl and a bright blue falcon circle above and a clever russet fox watches from the fern-covered path. Golden sparks rise from the open pages and become tiny distant castles, ships, and mountain silhouettes among the branches, making the unfolding wonder the focal action. Set the figures and clothing in an old European fairy-tale world with no modern objects, while the varied animals suggest the book's many traditions without forming separate panels. Use a wide, gently elevated composition with the princess and book in the lower center, layered woodland depth around them, and calm open twilight sky across the top. Keep every figure original, welcoming, and child-friendly, with no frightening violence and no resemblance to film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
