  chapters:
    - id: ch01
      title: The Queen Loses Her Way
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Once upon a time, there lived a good and kind king who was always at war with his neighbors. This was strange, for he was content with his own country and wanted no one else's land. Perhaps he tried too hard to please everyone. Whatever the reason, after a bitter struggle he lost a battle and had to retreat behind the walls of his capital. He prepared for a long siege, and his first concern was sending his wife somewhere safe."
        - id: ch01-b02
          speaker: narrator
          text: "The queen loved him dearly and wished to share every danger, but the king would not allow it. They parted in tears. With a strong guard, she traveled two hundred miles to a fortified castle beside a great forest. She wept almost all the way, and more tears came when she arrived. The castle was old and dusty. Outside it had only a gravel courtyard, and the king had forbidden her to leave the walls unless two soldiers went with her."
        - id: ch01-b03
          speaker: narrator
          text: "The queen was only sixteen and had been married for a few months. At home she had always walked and ridden freely over the hills, so this confinement felt dreadful. She endured it because the king had asked her to. But as time passed and the war came no nearer, she grew bolder and sometimes wandered toward the forest. Then, suddenly, all news from the king stopped."
        - id: ch01-b04
          speaker: queen
          text: "He must be ill, or even dead. I cannot bear this any longer. If no letter comes soon, I will leave this horrible place and find out what has happened. Oh, I wish I had never come away!"
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: "Without telling anyone her true plan, she had a low little carriage built. It looked like a sledge on two wheels and held only one person."
        - id: ch01-b06
          speaker: queen
          text: "I am tired of staying inside the castle. I mean to do a little hunting, quite close by, of course. And all of you may hunt too."
        - id: ch01-b07
          speaker: narrator
          text: "Her attendants brightened, for they were almost as bored as she was. Two beautiful horses were harnessed to the little chariot. At first the queen stayed near the hunt, but each time she ventured farther away. One morning a wild boar appeared, and the whole court galloped after it. The queen seized her chance and turned down a path in the opposite direction."
        - id: ch01-b08
          speaker: narrator
          text: "The queen meant to take the road toward her husband's palace. Unluckily, this path led elsewhere. She was so afraid the hunters would notice her flight that she kept urging the horses faster. Soon they were beyond her control. When she understood what was happening, terror seized her. She dropped the reins and gripped the side of the little chariot with both hands. With no one guiding them, the frightened horses dashed blindly onward until they struck a tree. The chariot stopped with a crash, and the young queen was flung hard onto the ground. For several minutes she lay there without moving or knowing anything."
        - id: ch01-b09
          speaker: narrator
          text: "A rustling sound woke her. A huge woman, almost a giantess, stood nearby. A lion skin covered her shoulders, and a dried snakeskin was braided into her hair. She leaned on a club and carried a quiver full of arrows. The queen thought she had died and was looking at some creature from another world."
        - id: ch01-b10
          speaker: queen
          text: "No wonder people are unwilling to die, if this is the sort of horrible creature they must meet."
        - id: ch01-b11
          speaker: narrator
          text: "She spoke softly, but the giantess heard and laughed."
        - id: ch01-b12
          speaker: lion_fairy
          text: "Do not be frightened. You are still alive, though you may soon wish you weren't. I am the Lion Fairy. You will spend the rest of your days with me in my palace nearby. Come along."
        - id: ch01-b13
          speaker: narrator
          text: "The queen shrank from her in horror."
        - id: ch01-b14
          speaker: queen
          text: "Madam Lion, please take me back to my castle. Name any ransom you wish. My husband will pay it, whatever the price."
        - id: ch01-b15
          speaker: narrator
          text: "The giantess shook her head."
        - id: ch01-b16
          speaker: lion_fairy
          text: "I am rich enough. But I am often bored, and perhaps you can amuse me."
        - id: ch01-b17
          speaker: narrator
          text: "As soon as she had spoken, the giantess changed herself into a lion. She tossed the helpless queen across her back and carried her down ten thousand steps toward her palace. They did not stop until they had reached the center of the earth. There, lamps burned in a house built at the very edge of a lake of quicksilver. Great monsters moved through the lake, though the queen could not tell whether they were playing or fighting. Rooks and ravens wheeled around them and filled the air with dismal croaks. In the distance stood a mountain with water creeping slowly down its sides. Those streams were the tears of unhappy lovers. Closer to the gate, the trees bore neither flowers nor fruit. Nettles and thorny brambles covered the ground. The old castle had seemed gloomy enough, but the queen now knew a place far more terrible."
        - id: ch01-b18
          speaker: narrator
          text: "Everything she had suffered left the queen so shaken that for several days she lay with her eyes shut. She could neither move nor speak. When at last she grew a little stronger, the Lion Fairy came to her. Since the queen was to spend the rest of her life in that dreadful kingdom, she might build herself a cabin if she wished. Those words broke the queen's remaining courage. She burst into tears and begged her jailer to put her to death instead of condemning her to such a life. The Lion Fairy laughed at her grief. She advised the queen to become a pleasant companion, because many things worse than death might still befall her."
        - id: ch01-b19
          speaker: queen
          text: "Is there nothing I can do to soften your heart?"
          emotion: sad
        - id: ch01-b20
          speaker: lion_fairy
          text: "If you truly want to please me, make me a pasty filled with bee stings. And make sure it tastes good."
        - id: ch01-b21
          speaker: queen
          text: "But there are no bees here."
        - id: ch01-b22
          speaker: lion_fairy
          text: "No, there aren't. You will have to find them anyway."
        - id: ch01-b23
          speaker: narrator
          text: "The Lion Fairy went away. The queen thought that she had only one life to lose. In despair, she sat beneath a yew tree and poured out her grief."
        - id: ch01-b24
          speaker: queen
          text: "My dear husband, what will you think when you come for me and find me gone? I would rather have you believe me dead than think I forgot you. The broken chariot is still in the wood, so perhaps you will believe wild beasts devoured me. And if someone else takes my place in your heart, at least I will never know."
          emotion: sad
    - id: ch02
      title: The Frog Fairy's Help
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The queen might have mourned beneath the yew tree for hours, but a crow called directly above her. She looked up through the dim light and saw a fat frog caught in its claws. The crow plainly meant to make the frog its supper. The queen sprang from her seat. A fan hung at her side, and she struck the bird sharply across the claws with it. The blow forced the crow to let go. The frog fell to the ground and lay there more dead than alive, while the disappointed bird flew away in a fury. The queen returned to her place beneath the tree and waited for the small creature to stir."
        - id: ch02-b02
          speaker: narrator
          text: "When the frog recovered, she hopped to the queen, stood on her hind legs, and bowed."
        - id: ch02-b03
          speaker: frog
          text: "Beautiful lady, what misfortune brought you here? Since curiosity lured me into this place, you are the first creature I have seen perform a kind deed."
        - id: ch02-b04
          speaker: queen
          text: "What sort of frog speaks the language of people? If you can understand me, please tell me whether I am the only prisoner. So far I have seen no one but the monsters in the lake."
        - id: ch02-b05
          speaker: frog
          text: "Those monsters were once men and women like you. They had power and used it for their own pleasure, so fate sent them here to be punished for a time."
        - id: ch02-b06
          speaker: queen
          text: "But you are not one of those wicked people, are you, my friend?"
        - id: ch02-b07
          speaker: frog
          text: "I am half a fairy. I have some magic, though I cannot do everything I wish. If the Lion Fairy knew I was in her kingdom, she would hurry to kill me."
        - id: ch02-b08
          speaker: queen
          text: "Then how did the crow nearly kill you?"
        - id: ch02-b09
          speaker: frog
          text: "My power lies in a little cap made of rose leaves. I had taken it off when that horrible crow seized me. With the cap on my head, I fear nothing. You saved my life. If I can ease your cruel fate in any way, you need only ask."
        - id: ch02-b10
          speaker: queen
          text: "The Lion Fairy ordered me to make a pasty from bee stings. There are no bees here because there are no flowers, and even if there were, how could I catch them?"
          emotion: sad
        - id: ch02-b11
          speaker: frog
          text: "Leave that to me. I will arrange it."
        - id: ch02-b12
          speaker: narrator
          text: "The frog made a strange sound and struck the ground three times. At once, six thousand frogs appeared. One carried a tiny cap in her mouth. The Frog Fairy put it on."
        - id: ch02-b13
          speaker: frog
          text: "Cover yourselves in honey, then hop around the beehives. The Lion Fairy keeps bees hidden near the foot of the ten thousand steps. She uses them to punish her victims. This time, we will use them to outwit her."
        - id: ch02-b14
          speaker: narrator
          text: "The six thousand servants hurried away to obey. Before long they came hopping back, and bees clung to every part of their honey-covered bodies. The sight was so strange that the queen, sad as she was, could not keep from laughing. All the honey the bees had eaten left them too dazed to struggle. The queen and the Frog Fairy did not have to chase a single one. Together they drew out the stings, prepared the filling, and baked the pasty. When it was ready, the queen carried it to her tormentor and waited anxiously while the Lion Fairy tasted it."
        - id: ch02-b15
          speaker: lion_fairy
          text: "It needs more pepper. Still, you have escaped this time. I am glad my new companion is cleverer than the others. Now go and build yourself a house."
        - id: ch02-b16
          speaker: narrator
          text: "The Lion Fairy swallowed one great mouthful after another, pretending to care only about the pepper so the queen would not see her surprise. Once dismissed, the queen wandered from the palace and found a small axe lying near the door. She and the Frog Fairy began cutting cypress trees for a house. The six thousand froggy servants joined them, and so many helpers made quick work of it. Soon the prettiest little cabin in the world stood ready. In one corner they made a bed from dry ferns fetched all the way from the top of the ten thousand steps. It looked wonderfully soft and comfortable. After everything that had happened since morning, the queen was so tired that she lay down with relief and quickly fell asleep."
        - id: ch02-b17
          speaker: narrator
          text: "She had barely fallen asleep when the lake monsters began making horrible noises outside. A small dragon crept into the cabin and frightened her away, exactly as it meant to do. The queen spent the rest of the night crouched beneath a rock. After troubled dreams, she woke to find the Frog Fairy watching over her."
        - id: ch02-b18
          speaker: frog
          text: "It seems we must build you another palace. This time we will not put it so near the lake."
        - id: ch02-b19
          speaker: narrator
          text: "The frog smiled with her funny wide mouth until the queen took heart. Together they gathered more wood. Soon another tiny palace stood ready, with a fresh bed of sweet-smelling wild thyme. Neither friend spoke of it, but somehow the Lion Fairy heard. She sent a raven to bring the queen before her."
        - id: ch02-b20
          speaker: lion_fairy
          text: "What gods or mortals are protecting you? Nothing grows in this earth under its endless rain of sulfur and fire, yet your bed is made of fragrant herbs. Since you can find flowers for yourself, you can find them for me. Bring the rarest flowers to my room within one hour, or else. Now go."
          emotion: angry
        - id: ch02-b21
          speaker: narrator
          text: "The queen returned to her cabin looking so miserable that the waiting frog noticed at once."
        - id: ch02-b22
          speaker: frog
          text: "What has happened?"
        - id: ch02-b23
          speaker: queen
          text: "How can you smile? I must bring her the rarest flowers within an hour. Where can I find them? If I fail, she will kill me."
          emotion: fearful
        - id: ch02-b24
          speaker: frog
          text: "Let me see what I can do. I have one friend here, a good bat who always helps me. I will lend her my cap. With its power she can fly into the world and bring back what we need. She will be much faster than I could be."
        - id: ch02-b25
          speaker: narrator
          text: "The queen dried her eyes and waited. Long before the hour ended, the bat returned with the loveliest and sweetest flowers on earth. The queen leaped up in joy and hurried them to the Lion Fairy, who was so astonished that she had nothing to say."
    - id: ch03
      title: Muffette and the Message
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "The scent and touch of those flowers made the queen ache for home. She told the Frog Fairy she would surely die unless she found some way to escape."
        - id: ch03-b02
          speaker: frog
          text: "Let me ask my cap."
        - id: ch03-b03
          speaker: narrator
          text: "She took off the rose-leaf cap, placed it in a box, and added sprigs of juniper, some capers, and two peas she carried beneath her right leg. Then she closed the lid and murmured words the queen could not hear. A voice soon came from inside the box."
        - id: ch03-b04
          speaker: cap_voice
          text: "Fate rules us all, and fate forbids you to leave until certain things have come to pass. But you will receive a gift to comfort you through every trouble."
        - id: ch03-b05
          speaker: narrator
          text: "The voice spoke truly. A few days later, the Frog Fairy peeped through the door and found the most beautiful baby in the world beside the queen."
        - id: ch03-b06
          speaker: frog
          text: "The cap has kept its promise! Look at those soft cheeks and tiny feet. What shall we call her?"
          emotion: happy
        - id: ch03-b07
          speaker: narrator
          text: "That important question required a great discussion. They offered and rejected a thousand names for a thousand silly reasons. One was too long, another too short. One sounded harsh, while another reminded the queen of someone she disliked. At last, an idea came to her."
        - id: ch03-b08
          speaker: queen
          text: "I know. We will call her Muffette!"
          emotion: happy
        - id: ch03-b09
          speaker: frog
          text: "That is exactly right!"
          emotion: happy
        - id: ch03-b10
          speaker: narrator
          text: "The Frog Fairy jumped high in the air, and the matter was settled. About six months later, she saw sadness returning to the queen's face."
        - id: ch03-b11
          speaker: frog
          text: "Why do you look so unhappy?"
        - id: ch03-b12
          speaker: narrator
          text: "She had come to play with Muffette, who could now crawl. Their favorite game was to let the baby creep close, then have the frog leap onto her head, back, or legs. Muffette always cried out with pleasure. No playmate is quite like a frog, though it had better be a fairy frog, or someone might get hurt. The Frog Fairy stopped the game and asked again."
        - id: ch03-b13
          speaker: frog
          text: "Muffette is healthy and happy. Even the Lion Fairy treats her kindly when they meet. What is troubling you?"
        - id: ch03-b14
          speaker: queen
          text: "If only her father could see her, or I could tell him all that has happened! He must have heard about the broken carriage and thought me dead or eaten by wild beasts. He will mourn for a long time, I know. But one day they may persuade him to marry a young and beautiful woman, and then he will forget me."
          emotion: sad
        - id: ch03-b15
          speaker: narrator
          text: "The queen was right about everything except one thing. Nine long years would pass before the king agreed to put another wife in her place. The frog said nothing then. She stopped playing and hopped among the cypress trees to think. The next morning she returned."
        - id: ch03-b16
          speaker: frog
          text: "Madam, I have an offer. Shall I go to the king for you? I can tell him of your suffering and of the charming baby who is his daughter. The road is long, and I travel slowly, but sooner or later I will arrive. Still, will you be safe without my protection? Think carefully. You must decide."
        - id: ch03-b17
          speaker: queen
          text: "There is nothing to consider. Please go! I will send a letter so he knows you truly come from me."
          emotion: happy
        - id: ch03-b18
          speaker: narrator
          text: "The queen needed no time to decide. Joyfully, she clasped her own hands and made little Muffette lift hers in the same way, so that mother and baby could thank their friend together. But the king would need proof that this remarkable messenger truly came from his wife. The queen took a sharp point and pricked her arm. With her own blood, she wrote a few words on one corner of her handkerchief. Then she tore the corner away and placed it carefully in the frog's keeping. The friends said farewell, knowing the road would be long and that the queen must face the Lion Fairy without her protector."
    - id: ch04
      title: The Frog at Court
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "The Frog Fairy began the climb alone. It took her a full year and four days to mount the ten thousand steps into the upper world, because the spell of a wicked fairy still weighed upon her. By the time she reached the final step, she was completely exhausted. She settled beside a stream and needed another whole year to recover. Rest was not her only concern. She also had to arrange a proper procession for her arrival before the king. The frog understood exactly what was due to herself and her relations. Nothing could have persuaded her to appear at court as though she were some ordinary creature of no importance. She consulted her cap again and again about every part of the embassy. At last all the details were settled. At the end of the second year after her farewell to the queen, the remarkable company was ready to set out."
        - id: ch04-b02
          speaker: narrator
          text: "Grasshoppers marched first as her bodyguard. Then came tiny green frogs serving as maids of honor, each riding a snail with a velvet saddle. Water rats followed, dressed as pages. Last came the Frog Fairy herself in a roomy tortoiseshell litter carried by eight toads. She rested inside with her cap upon her head."
        - id: ch04-b03
          speaker: narrator
          text: "The grand little procession traveled for seven years. Down in the Lion Fairy's kingdom, every one of those years brought the queen fresh torments of hope. She knew her messenger was slow, but she could not know where the frog had reached or whether she would ever stand before the king. Muffette did everything a loving child could do to comfort her mother. Even so, the queen might have died if the Lion Fairy had not taken a fancy to having mother and daughter join her hunts in the upper world. Whatever sorrow lay in her heart, the queen always felt joy when she saw the sun again. Muffette grew up during those hunting trips. She learned to ride and shoot while following the Lion Fairy. By the age of seven, she handled her bow so skillfully that her arrows seldom missed their mark. Between her daughter's company, the excitement of the hunt, and those precious glimpses of daylight, the long years passed more quickly than the queen had dared to expect."
        - id: ch04-b04
          speaker: narrator
          text: "Meanwhile, the Frog Fairy guarded her dignity. She avoided towns and even high roads where someone might see her. Yet whenever her procession crossed a stream or marsh, everyone halted. Fine clothes and bridles came off, and the grasshoppers, water rats, and even the Frog Fairy spent a delightful hour or two playing in the mud."
        - id: ch04-b05
          speaker: narrator
          text: "At last the king's palace towers rose ahead. One bright morning the procession entered the gates with all the ceremony of a royal embassy. No ambassador had ever caused such excitement. People crowded doors, windows, and rooftops, and their cheers reached the king. But he was busy. After nine years, he had finally yielded to his courtiers and was preparing to marry again."
        - id: ch04-b06
          speaker: narrator
          text: "The frog's heart beat fast when her litter stopped at the palace steps. She leaned forward and beckoned to a guard."
        - id: ch04-b07
          speaker: frog
          text: "I wish to see His Majesty."
        - id: ch04-b08
          speaker: palace_guard
          text: "His Majesty is occupied and cannot receive anyone."
        - id: ch04-b09
          speaker: frog
          text: "His Majesty will receive me."
        - id: ch04-b10
          speaker: narrator
          text: "She fixed her eyes on him, and somehow the guard found himself leading the entire procession through the gallery. In the Hall of Audience, the king sat among his nobles, choosing what everyone would wear at his wedding. All stared as the strange embassy approached. The frog sprang from her litter to the floor, then onto the arm of the king's chair."
        - id: ch04-b11
          speaker: frog
          text: "I have arrived just in time, sire. One day later, and you would have broken the promise you made to the queen nine years ago."
        - id: ch04-b12
          speaker: king
          text: "Her memory will always be dear to me, Lady Frog. But a king cannot often do as he wishes. He must answer to his people. I resisted them for nine years. Now I can resist no longer, and I have chosen the lovely young woman playing ball over there."
        - id: ch04-b13
          speaker: frog
          text: "You cannot marry her, however lovely she is. Your queen is alive. She sends you this letter, written in her own blood. And you have a daughter nearly nine years old, more beautiful than all the other children in the world together."
        - id: ch04-b14
          speaker: narrator
          text: "The king turned pale. His hand shook so badly that he could scarcely read the queen's words. He kissed the scrap of handkerchief again and again, then burst into tears. When he could speak, he told his council that the writing was truly hers. Now that he knew she lived, his second marriage could not continue."
        - id: ch04-b15
          speaker: narrator
          text: "The bride's ambassadors were deeply offended. One of them demanded to know whether the king would insult their princess merely on the word of a frog."
        - id: ch04-b16
          speaker: ambassador
          text: "Will Your Majesty cast aside our princess because a mere frog tells you a tale?"
          emotion: angry
        - id: ch04-b17
          speaker: frog
          text: "I am not a mere frog, and I will prove it. Fairies who are my friends, come to me!"
          emotion: angry
        - id: ch04-b18
          speaker: narrator
          text: "The angry little frog put on her rose-leaf cap and called her fairy friends. In an instant, a crowd of beautiful beings appeared, each wearing a crown. No one looking at them could have guessed that they were the same snails, water rats, and grasshoppers she had chosen for her attendants. At a sign from the frog, the fairies began a ballet. The whole court watched in delight and begged them to perform it again. The second dance was stranger still. Instead of young men and women, flowers moved across the hall. Then the flowers melted into fountains. Their streams crossed and twined together, rushed down the sides of the great room, and poured in a shining cascade over the palace steps. Outside, the water formed a river all around the castle. Beautiful little boats, painted in bright colors and covered with gold, waited on its surface."
        - id: ch04-b19
          speaker: ambassador
          text: "The princess wishes to sail, and we must go with her."
        - id: ch04-b20
          speaker: narrator
          text: "The young princess who was to have married the king had long since abandoned her ball game to watch these wonders. Delighted by the little painted boats, she declared that she wanted to sail in one. Once she had made up her mind, her ambassadors could not stop her. They had been commanded never to let her out of their sight, so they had to go too, although they avoided boats whenever they possibly could. Princess and ambassadors chose their places and settled onto the boats' soft cushions. The moment everyone was seated, the enchantment changed. River and boats vanished without leaving so much as a drop of water. The princess disappeared, and all her ambassadors disappeared with her. Instead of crowned fairies, the ordinary snails, grasshoppers, and water rats of the frog's procession once more stood around their mistress."
        - id: ch04-b21
          speaker: frog
          text: "Perhaps Your Majesty now believes that I am a fairy and that I speak the truth. Set your kingdom in order at once, then seek your wife. This ring will bring you into the queen's presence. It will also let you speak safely to the Lion Fairy, though she is the most terrible creature alive."
        - id: ch04-b22
          speaker: narrator
          text: "The king had chosen the other princess only to satisfy his people, and by now he had forgotten her. He was as eager to begin as the frog was to send him. He appointed a minister to rule in his absence, gave the Frog Fairy everything her heart desired, placed her ring on his finger, and rode to the edge of the forest. There he sent his horse home and continued on foot."
    - id: ch05
      title: The Crystal Palace
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "The king had no clue where the path into the underworld began. He wandered for a long time. One day, while he rested beneath a tree, a voice spoke."
        - id: ch05-b02
          speaker: ring_voice
          text: "Why struggle for nothing when you have only to ask? By yourself, you will never find the road to your wife."
        - id: ch05-b03
          speaker: narrator
          text: "Startled, the king looked around but saw no one. The voice had almost seemed to come from inside him. Then he noticed the ring and understood."
        - id: ch05-b04
          speaker: king
          text: "What a fool I have been, wasting such precious time! Dear ring, please show me my wife and daughter."
        - id: ch05-b05
          speaker: narrator
          text: "At once, a huge lioness flashed past him. Behind her rode a lady and a beautiful young girl on fairy horses. Nearly fainting with joy, he watched them disappear, then sank trembling to the ground."
        - id: ch05-b06
          speaker: king
          text: "Lead me to them. Oh, please lead me to them!"
        - id: ch05-b07
          speaker: narrator
          text: "The ring told him to be brave and guided him safely to the dreadful place where his wife had lived for ten years. But the Lion Fairy knew he was coming. In the middle of the quicksilver lake, she built a crystal palace that floated wherever it pleased. After the hunt in which the king had seen them, she locked the queen and Muffette inside it."
        - id: ch05-b08
          speaker: narrator
          text: "The lake monsters guarded the palace. Every one of them had fallen in love with Muffette, and their jealousy was so fierce that they were ready to devour one another. Some circled the palace in the lake, others watched the door, and the smallest and lightest perched on the roof."
        - id: ch05-b09
          speaker: narrator
          text: "Knowing none of this, the king boldly entered the Lion Fairy's home. She waited in the shape of a lion, lashing her tail in fury. With a roar that shook the walls, she sprang. The king was ready. His sword cut off the paw she thrust out to kill him. She fell back, and he kept his helmet on, raised his shield, and set one foot upon her throat."
        - id: ch05-b10
          speaker: king
          text: "Return the wife and child you stole from me, or you will not live another moment!"
          emotion: angry
        - id: ch05-b11
          speaker: lion_fairy
          text: "Look through the window at the lake. Then tell me whether I have the power to return them."
        - id: ch05-b12
          speaker: narrator
          text: "The king went to the window and looked across the lake. Through the clear walls of the floating palace, he saw his wife and daughter surrounded by quicksilver. The sight drove the Lion Fairy and all her wickedness from his mind. He flung off his helmet and shouted with all the strength in his body. The queen recognized her husband's voice at once. She and Muffette ran to the crystal window, pressed close to it, and reached their hands toward him. He could see them but could not cross the deadly lake. Still, he swore a solemn oath that he would never leave that place without taking them home, even if the attempt cost him his life. He truly meant it, though he had no idea what such a promise would demand."
        - id: ch05-b13
          speaker: narrator
          text: "Three entire years passed, and the king came no closer to the wife and daughter he could see across the lake. He endured every hardship anyone could imagine. Nettles served as his bed, and the only food he found was wild fruit more bitter than gall. His days brought no rest. Again and again he fought the hideous monsters guarding the floating palace, while they fought just as fiercely to keep him from Muffette. All his courage and labor won him nothing. He did not advance one step toward the palace or gain one advantage over its guards. Hope finally began to fail him. He was almost ready to defy every danger at once and throw himself straight into the lake of quicksilver, though it might mean his death."
        - id: ch05-b14
          speaker: narrator
          text: "On the darkest night of his misery, a dragon that had long watched from the roof crept to his side."
        - id: ch05-b15
          speaker: dragon
          text: "You believed love would overcome every obstacle. Now you know it cannot. But swear by your crown and scepter that whenever I ask, you will give me a dinner made from the one food I never tire of. Then I will carry you to your wife and daughter."
        - id: ch05-b16
          speaker: narrator
          text: "The king was overjoyed. What promise would he not make to hold his wife and child again? He eagerly swore the oath and climbed onto the dragon's back. Its great wings were about to bear him to the palace when the nearest monsters woke. Hearing voices, they swam ashore and attacked."
        - id: ch05-b17
          speaker: narrator
          text: "The monsters swarmed from the lake, and the fight was long and hard. Only after a bitter struggle did the king beat them back. Then another battle waited at the palace entrance. Gigantic bats, owls, and crows rushed upon him from every direction. The dragon tore at them with teeth and claws while the king fought beside him. From within the palace, the queen tried desperately to help her husband. She broke sharp splinters from the crystal walls and used them to stab and cut at every creature that came near. At last the horrible attackers could bear no more and flew away. A noise like thunder shook the palace. In that same instant, the crystal building and all the monsters vanished. No one ever knew how the change happened. The king simply found himself standing in the hall of his own home, with the queen he had sought for so long and their daughter safely beside him."
    - id: ch06
      title: The Dragon Claims His Dinner
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "The dragon vanished with the crystal palace and its monsters. For several years no one heard from him, and before long no one even thought about him. Safe at home, Muffette grew lovelier with every passing day. When she reached the age of fourteen, kings and emperors from neighboring countries sent messages asking her to marry them or one of their sons. For a long while she would listen to none of their prayers. At last, one young prince, blessed with rare gifts, touched her heart. The king had always told his daughter she could choose her own husband. Secretly, however, he had hoped that among all those royal suitors, this particular prince would become his son-in-law. Muffette's choice therefore pleased both father and daughter."
        - id: ch06-b02
          speaker: narrator
          text: "They were betrothed with great ceremony. After a tearful farewell, the prince returned to his father's court carrying Muffette's portrait. The days dragged for her, though she kept busy and tried not to burden anyone with her sadness. One morning, as she played her harp in the queen's room, the king rushed in and held her so fiercely that he frightened her."
        - id: ch06-b03
          speaker: king
          text: "Oh, my child, my dear child! Why were you ever born?"
          emotion: sad
        - id: ch06-b04
          speaker: muffette
          text: "Is the prince dead?"
          emotion: fearful
        - id: ch06-b05
          speaker: king
          text: "No, no. But how can I tell you what has happened?"
          emotion: sad
        - id: ch06-b06
          speaker: narrator
          text: "He collapsed onto a pile of cushions, while the queen and Muffette knelt beside him. At last he told them the terrible news. A huge giant had just arrived as ambassador from the dragon who had helped rescue them. The dragon had been busy and had forgotten Muffette until he heard of her betrothal. Then he remembered the king's bargain. The more he heard about the princess, the more certain he became that she would make a delicious dinner. He had sent his giant servant to fetch her at once."
        - id: ch06-b07
          speaker: narrator
          text: "Horror seized both mother and daughter. They hurried to the hall, threw themselves at the giant's feet, and begged him to take the whole kingdom instead. The giant looked kindly upon them, for he was not hardhearted, but he said he had no power to change the command. If Muffette did not go quietly, the dragon would come himself."
        - id: ch06-b08
          speaker: queen
          text: "Please take our kingdom, all of it. Only spare our daughter."
          emotion: fearful
        - id: ch06-b09
          speaker: giant
          text: "I am sorry, but I cannot alter my master's order. If the princess will not come peacefully, the dragon will come for her himself."
        - id: ch06-b10
          speaker: narrator
          text: "For several days, the king and queen continued begging. At last the giant grew tired of waiting."
        - id: ch06-b11
          speaker: giant
          text: "There is only one way I can help. Let the princess marry my nephew. He is young and handsome, and he has studied magic. He will know how to protect her from the dragon."
        - id: ch06-b12
          speakers: [king, queen]
          ensemble: duo
          text: "Thank you! You have lifted a terrible burden from us. She shall have half the kingdom as her dowry."
          emotion: happy
        - id: ch06-b13
          speaker: narrator
          text: "But Muffette rose and pushed her parents aside."
        - id: ch06-b14
          speaker: muffette
          text: "I will not save my life by betraying my promise. I will go with you to the dragon now."
        - id: ch06-b15
          speaker: narrator
          text: "Her father and mother wept and pleaded, but neither tears nor prayers could move Muffette from her decision. The following morning, servants placed the princess in a litter. The giant took charge of his prisoner and walked beside her. Behind them came the king and queen, unwilling to leave their daughter while one more step remained. Muffette's maids of honor followed too, all of them weeping as they went. The sad procession traveled toward the foot of the mountain where the dragon had made his castle. Stones covered the rough road, but to the grieving parents it seemed much too easy and much too short. Soon they reached the exact place the dragon had named. The giant looked toward the sky and ordered the men carrying Muffette's litter to stand still."
        - id: ch06-b16
          speaker: giant
          text: "Now you must say farewell to your daughter. I can see the dragon coming."
        - id: ch06-b17
          speaker: narrator
          text: "A cloud seemed to cover the sun. Between them and its light, they saw a vast body half a mile long drawing nearer. At first the king could not believe this was the small creature that had befriended him beside the quicksilver lake. But he knew little of magic and nothing of making a body expand or shrink. It was indeed the dragon. Six wings carried his enormous weight, and his long tail curled in fifty twists and a half."
    - id: ch07
      title: The Prince and the Dragon
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: "The dragon flew quickly, but the Frog Fairy went quicker still. Wearing her magic cap and riding a greyhound, she raced to the prince's court. She found him sitting before the portrait of his promised bride."
        - id: ch07-b02
          speaker: frog
          text: "Why are you sitting here when the princess has only moments left to live? In the courtyard stands a green horse with three heads and twelve feet. Beside it lies a sword eighteen yards long. Hurry, or you will be too late!"
        - id: ch07-b03
          speaker: narrator
          text: "The prince wasted no time. He hurried into the courtyard, found the strange green horse and the enormous sword exactly where the Frog Fairy had promised, and raced to save Muffette. His battle with the dragon lasted the whole day. Again and again they attacked each other, until at last the prince's strength was almost spent. The dragon saw his weariness and believed the victory won. He opened his vast jaws to give a roar of triumph. That boast gave the prince his one chance. Before the monster could close its mouth, he raised the eighteen-yard sword and plunged it far down his enemy's throat. The dragon's claws tore desperately at the earth. His six great wings beat more slowly, then slower still. At last the enormous body rolled onto one side and moved no more. The king's old promise could never harm Muffette now. She was delivered."
        - id: ch07-b04
          speaker: narrator
          text: "The great danger was over, and everyone returned together to the palace. There was no longer any dragon to claim the king's dreadful debt, and nothing stood between Muffette and the prince she had promised to marry. Their wedding took place the following day. After all the queen's years of captivity, the king's years of struggle, and Muffette's brave refusal to break her word, the family could at last rejoice. Princess Muffette and her husband lived happily ever after."
