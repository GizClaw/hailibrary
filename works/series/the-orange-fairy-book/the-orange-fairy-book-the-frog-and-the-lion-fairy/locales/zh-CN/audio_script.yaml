audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    frog:
      display_name: 青蛙男孩
      tts:
        delivery: 年幼任性，说话直来直去
        timbre: 细小沙哑
        pace: 稍快
        pitch: 高
    ogress:
      display_name: 女妖
      tts:
        delivery: 凶狠阴沉，威胁时如雷轰鸣
        timbre: 粗粝沉重
        pace: 缓慢而逼人
        pitch: 低
    queen:
      display_name: 王后
      tts:
        delivery: 温柔真挚，受苦时仍不失坚韧
        timbre: 柔和清亮
        pace: 自然
        pitch: 中高
    king:
      display_name: 国王
      tts:
        delivery: 厚道沉着，动情时深切有力
        timbre: 浑厚温暖
        pace: 稳健
        pitch: 中低
    hat_voice:
      display_name: 帽中之声
      tts:
        delivery: 神秘平静，像从远处传来
        timbre: 空灵清晰
        pace: 缓慢
        pitch: 中
    guard:
      display_name: 宫门卫兵
      tts:
        delivery: 恪守职责，回答简短
        timbre: 坚实清楚
        pace: 适中
        pitch: 中低
    envoy:
      display_name: 使臣
      tts:
        delivery: 骄傲严厉，受辱时怒气逼人
        timbre: 洪亮锐利
        pace: 稍快
        pitch: 中
    princess:
      display_name: 邻国公主
      tts:
        delivery: 年轻活泼，见到奇景便兴奋
        timbre: 明亮甜润
        pace: 轻快
        pitch: 中高
    ring:
      display_name: 魔法戒指
      tts:
        delivery: 冷静睿智，提醒时直截了当
        timbre: 清澈悠远
        pace: 从容
        pitch: 中
    lion_fairy:
      display_name: 狮仙女
      tts:
        delivery: 冷酷强横，威吓时咆哮般逼人
        timbre: 低沉粗粝
        pace: 缓慢而有压迫感
        pitch: 低
    dragon:
      display_name: 龙
      tts:
        delivery: 狡猾自负，谈条件时笃定从容
        timbre: 深沉沙哑
        pace: 缓慢
        pitch: 低
    muffette:
      display_name: 穆费特公主
      tts:
        delivery: 高贵坦率，危难中坚定勇敢
        timbre: 清亮柔韧
        pace: 自然
        pitch: 中高
    giant:
      display_name: 巨人
      tts:
        delivery: 直率克制，虽和善却不容商量
        timbre: 厚重低沉
        pace: 稳重
        pitch: 低
  chapters:
    - id: ch01
      title: 王后落入地心
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一位国王，善良又厚道，对自己的国土也很知足，却总在同邻国打仗。也许他太想让所有人满意，结果反而谁也没讨好。一场苦战过后，他败退到都城，准备长久守下去。首先要做的，就是把妻子送到安全的地方。
        - id: ch01-b02
          speaker: narrator
          text: 王后才十六岁，深爱着丈夫，一心想留下来陪他受苦。国王怎么也不答应。两人流着泪分别，精兵护送王后去了两百英里外的一座坚固城堡。她几乎哭了一路，到了以后反而哭得更厉害。城堡靠着大森林，里面陈旧蒙尘，外边除了铺着碎石的院子，什么也没有。国王还下过严令，没有至少两名士兵保护，王后绝不能走出城墙。
        - id: ch01-b03
          speaker: narrator
          text: 王后成婚才几个月。从前在娘家，不论走路还是骑马，她都能独自在山野里来去。现在整日困在堡中，实在难熬。她忍耐了很久，见战火一直没有靠近，胆子渐渐大起来，偶尔会偷偷走到森林边。
        - id: ch01-b04
          speaker: narrator
          text: 后来，可怕的日子到了。国王的消息完全断了。
        - id: ch01-b05
          speaker: queen
          text: 他一定病了，也许已经死了。我再也等不下去了。要是还收不到信，我就离开这里，亲自回去看看。唉，我当初真不该离开他！
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: 王后没把打算告诉任何人，只叫人造了一辆低矮的小车，像装了两个轮子的雪橇，刚好坐得下她一个。
        - id: ch01-b07
          speaker: queen
          text: 我天天困在城堡里，早就厌烦了。我想去附近打打猎，绝不会走远。你们也都一起去吧。
        - id: ch01-b08
          speaker: narrator
          text: 侍从们也闷坏了，听完个个高兴。两匹骏马很快套上小车。起初王后很小心，不肯离狩猎队太远，后来在外面待得越来越久。终于有一天，一头野猪忽然冲出来，所有侍从都骑马追了上去。王后看准时机，拐进相反方向的一条小路。
        - id: ch01-b09
          speaker: narrator
          text: 那条路根本不通向王宫。王后怕人发现她逃跑，还是不停挥鞭。两匹马越跑越快，终于失去了控制。她吓得丢开缰绳，紧紧抓住车沿。马直冲向一棵大树，王后被甩到地上，昏了过去。
        - id: ch01-b10
          speaker: narrator
          text: 过了好一阵，一阵窸窣声惊醒了她。面前站着一个女巨人般的女人，身上只披着狮皮，头发里编着一条晒干的蛇皮，一手拄木棒，一手提箭囊。王后以为自己已经死了，眼前是另一个世界的居民。
        - id: ch01-b11
          speaker: queen
          text: 怪不得人人都怕死。要是早知道死后会见到这么可怕的怪物，谁能不怕呢？
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: 她声音很轻，女巨人却听见了，顿时大笑。
        - id: ch01-b13
          speaker: lion_fairy
          text: 别怕，你还活着。不过以后，你说不定会后悔自己没有死。我是狮仙女。跟我到附近的宫殿去，从今往后，你一辈子都得陪着我。走吧。
        - id: ch01-b14
          speaker: narrator
          text: 王后惊恐地往后缩。
        - id: ch01-b15
          speaker: queen
          text: 狮夫人，求您送我回城堡吧！您想要多少赎金都行，我丈夫一定会付。
          emotion: fearful
        - id: ch01-b16
          speaker: lion_fairy
          text: 我已经够富了。我只是常常无聊，或许你能替我解解闷。
        - id: ch01-b17
          speaker: narrator
          text: 她说完就变成一头狮子，把王后横放在背上，沿一万级台阶一直走到地心，直到一所灯火通明的屋子前才停下。屋子建在水银湖边。湖里的种种怪物像在玩耍，又像在厮杀，王后根本分不清。白嘴鸦和乌鸦在四周盘旋，叫声凄厉。远处山上的水缓缓流下，那全是不幸恋人的眼泪。大门旁边，树木既不开花，也不结果，地上只长着荨麻和荆棘。先前那座城堡已经够阴森了，这里却还要可怕得多。
        - id: ch01-b18
          speaker: narrator
          text: 王后吓得心都碎了，几天里只能闭眼躺着，不能动，也说不出话。等她稍微恢复，狮仙女叫她自己盖间小屋，因为余生都要住在这里。王后放声痛哭，宁可现在死去。狮仙女却笑她，还警告她最好识趣些，设法讨自己欢心，否则苦头更大。
        - id: ch01-b19
          speaker: queen
          text: 难道不管我怎么做，都不能让您动一点恻隐之心吗？
          emotion: sad
        - id: ch01-b20
          speaker: lion_fairy
          text: 你真想讨我欢心，就拿蜜蜂的刺烤一个馅饼给我，还得好吃。
        - id: ch01-b21
          speaker: queen
          text: 可这附近连一只蜜蜂也没有呀。
        - id: ch01-b22
          speaker: lion_fairy
          text: 对，一只也没有。可你还是得把蜂刺找来。
        - id: ch01-b23
          speaker: narrator
          text: 狮仙女走了。王后觉得自己反正只有一条命，最坏也不过丢掉它。她来到一棵紫杉树下，把心里的苦全哭了出来。
        - id: ch01-b24
          speaker: queen
          text: 亲爱的丈夫，你去城堡接我，发现我不见了，会怎么想？我宁愿你认定我死了一千次，也不愿你怀疑我忘了你。幸好撞坏的车留在林中，你大概会以为我被野兽吃掉。以后若有另一个女人取代我，也罢，至少我永远不会知道。
          emotion: sad
    - id: ch02
      title: 仙女青蛙
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 王后正哭着，忽然听见头顶有乌鸦叫。昏暗中，一只乌鸦抓着一只肥青蛙，正要拿它当晚餐。王后赶紧站起来，用扇子狠狠打中乌鸦的爪子。乌鸦只好松开青蛙，气冲冲地飞走了。青蛙落在地上，只剩半条命。
        - id: ch02-b02
          speaker: narrator
          text: 青蛙醒来以后，跳到紫杉树下，用后腿站直，向王后深深鞠躬。
        - id: ch02-b03
          speaker: frog
          text: 美丽的夫人，您遭了什么难，怎么会来到这里？好奇心害我落进这个地方以后，您是我见过的第一个好人。
        - id: ch02-b04
          speaker: queen
          text: 你是什么青蛙，怎么会说人的话？既然你懂，就请告诉我，这里只关着我一个人吗？除了湖里的怪物，我谁也没见过。
        - id: ch02-b05
          speaker: frog
          text: 那些怪物以前也和您一样，是凡间的男女。他们有权力的时候，只顾自己享乐，所以命运把他们送来，暂时为恶行受罚。
        - id: ch02-b06
          speaker: queen
          text: 青蛙朋友，你一定不是他们那样的恶人，对不对？
        - id: ch02-b07
          speaker: frog
          text: 我算半个仙女，会几样魔法，可还不能想做什么就做什么。要是狮仙女知道我来了她的国度，一定会杀掉我。
        - id: ch02-b08
          speaker: queen
          text: 既然你是仙女，刚才怎么差点让乌鸦吃了？
        - id: ch02-b09
          speaker: frog
          text: 我的法力都藏在一顶玫瑰花瓣做的小帽子里。刚才我把帽子摘了一会儿，那只乌鸦就扑了下来。戴上帽子，我什么也不怕。要不是您，我已经没命了。只要我能帮您，让您的日子好过一点，您尽管说。
        - id: ch02-b10
          speaker: queen
          text: 狮仙女逼我用蜜蜂的刺做馅饼。可这里没有花，哪会有蜜蜂？就算真有，我又怎么捉得住呢？
          emotion: sad
        - id: ch02-b11
          speaker: frog
          text: 这事交给我，我替您办好。
        - id: ch02-b12
          speaker: narrator
          text: 青蛙怪叫一声，又用脚跺了三下。六千只青蛙立刻出现在面前，其中一只嘴里衔着小帽子。
        - id: ch02-b13
          speaker: frog
          text: 你们把蜂蜜涂满全身，再到蜂巢旁边跳来跳去。
        - id: ch02-b14
          speaker: narrator
          text: 她戴好帽子，又告诉王后，一万级台阶底下有狮仙女偷偷养的蜜蜂。狮仙女偶尔拿它们惩罚囚徒，这一次，她们偏要胜过她。
        - id: ch02-b15
          speaker: narrator
          text: 没过多久，六千只青蛙全回来了，身上粘满蜜蜂，怪模怪样。王后再伤心也忍不住笑了。蜜蜂吃了蜂蜜，个个昏昏沉沉，蜂刺一拔就下来了。王后靠大家帮忙，很快做好馅饼，送给狮仙女。
        - id: ch02-b16
          speaker: lion_fairy
          text: 胡椒放少了。好吧，这次饶过你。新来的伴儿总算比以前那些聪明些。现在去给自己盖间屋子吧。
        - id: ch02-b17
          speaker: narrator
          text: 狮仙女一边大口吞着馅饼，一边掩饰心里的惊讶。王后出门时在门边捡到一柄小斧，便和青蛙一起砍柏树。她们嫌人手不够，又叫六千只青蛙全来帮忙。世上最漂亮的小屋没多久就盖好了。青蛙们还从一万级台阶顶端运来干蕨草，在墙角铺成一张柔软的床。王后从早晨起经历了那么多事，早已筋疲力尽，能躺下不知有多高兴。可她刚睡着，湖中怪物就在屋外发出最骇人的声响。一条小龙又钻进屋里，把她吓得逃了出去，而这正是小龙想要的结果。
        - id: ch02-b18
          speaker: narrator
          text: 王后在岩石下缩了一夜。第二天早晨，她从乱梦中醒来，看见青蛙守在身边，心里才安定些。
        - id: ch02-b19
          speaker: frog
          text: 听说我们得替您再盖一座宫殿。好吧，这回可不能离湖这么近了。
        - id: ch02-b20
          speaker: narrator
          text: 青蛙咧开阔嘴笑了，王后也打起精神。两人找来木料，很快造好一座小宫殿，床上铺着芬芳的野百里香。她们谁也没说，可消息还是传进了狮仙女耳中。狮仙女派渡鸦把王后叫去。
        - id: ch02-b21
          speaker: lion_fairy
          text: 到底是哪位神仙或凡人在护着你？这里常年落下硫磺和烈火，土地早烧焦了，什么也长不出。可我听说，你睡的床竟铺着香草。既然你能给自己找来花，就也能给我找。一小时之内，我房里必须有一束世上最珍奇的花。不然的话……现在走吧！
          emotion: angry
        - id: ch02-b22
          speaker: narrator
          text: 王后愁容满面地回到住处，青蛙一眼就看了出来。
        - id: ch02-b23
          speaker: frog
          text: 出什么事了？
        - id: ch02-b24
          speaker: queen
          text: 你怎么还笑得出来！她要我在一小时内送去世上最珍奇的花。这里哪儿能找到？做不到，她一定会杀我。
          emotion: fearful
        - id: ch02-b25
          speaker: frog
          text: 好吧，我想想怎么帮您。我在这里交到的朋友只有一只蝙蝠，她心地好，也肯听我的话。我把帽子借给她，她戴着飞回地上，就能把花带回来。我也能去，可她飞得更快。
        - id: ch02-b26
          speaker: narrator
          text: 王后擦干眼泪，耐心等着。还没到一个小时，蝙蝠已经带回世上最美、最香的各种花。王后一看，高兴得跳起来，连忙捧去给狮仙女。狮仙女惊讶极了，生平第一次一句话也说不出。
        - id: ch02-b27
          speaker: narrator
          text: 花的香气和触感，让王后更想念故乡。她告诉青蛙，再逃不出去，自己一定会死。
        - id: ch02-b28
          speaker: frog
          text: 让我问问帽子。
        - id: ch02-b29
          speaker: narrator
          text: 青蛙把帽子放进盒中，又投入几枝藏在右腿下的刺柏、几粒酸豆和两颗豌豆。她盖紧盒子，低声念了几句话。过了一会儿，盒中传来声音。
        - id: ch02-b30
          speaker: hat_voice
          text: 掌管众生命运的力量不许你现在离开。几件事情必须先后应验，时机才会来到。不过你会得到一件礼物，在所有苦难中安慰你。
          emotion: calm
        - id: ch02-b31
          speaker: narrator
          text: 这话果然成真。几天后，青蛙从门边探头，看见世上最美丽的婴儿正躺在王后身边。
        - id: ch02-b32
          speaker: frog
          text: 帽子真的兑现诺言了！她的脸蛋多软，脚丫多小呀！我们给她取什么名字？
          emotion: happy
        - id: ch02-b33
          speaker: narrator
          text: 这可是大事。她们想出一千个名字，又为一千个傻理由全部否决。有的太长，有的太短，有的太生硬，还有的让王后想起讨厌的人。最后，王后忽然有了主意。
        - id: ch02-b34
          speaker: queen
          text: 我知道了！就叫她穆费特。
          emotion: happy
        - id: ch02-b35
          speaker: frog
          text: 再没有比这更好的名字了！
          emotion: happy
        - id: ch02-b36
          speaker: narrator
          text: 青蛙高高跳进空中，名字就这样定了下来。
    - id: ch03
      title: 九年的报信之路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 穆费特大约六个月大时，青蛙发现王后又一天比一天忧伤。有一回，她来陪已经会爬的孩子玩，便问王后为什么这样愁。
        - id: ch03-b02
          speaker: narrator
          text: 她们先让穆费特爬向青蛙，青蛙再高高跳起，落到孩子头上、背上或腿上，每回都逗得她欢叫。世上再没有比仙女青蛙更好的玩伴。普通青蛙可不能这样玩，免得伤了它，给自己惹来可怕的事。
        - id: ch03-b03
          speaker: frog
          text: 我真不明白，您现在还在烦恼什么。穆费特身体好，又快活，连狮仙女见了她也很和气。到底怎么了？
        - id: ch03-b04
          speaker: queen
          text: 要是她父亲能看她一眼，该多好！哪怕让我告诉他，我们分别以后出了什么事也好。他一定见到了那辆破车，以为我死了，或是让野兽吃了。他会哀悼很久，我知道。可时间一长，别人总会劝他再娶。新王后年轻又美丽，他就会忘了我。
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: 王后猜得几乎全对，只有一点不同。国王苦等了整整九年，才答应让另一个女人代替她。
        - id: ch03-b06
          speaker: narrator
          text: 青蛙听完没有回答。她停下同孩子的游戏，独自跳进柏树林，在里面坐着，一遍又一遍地想这件事。她整整想了一天。直到第二天早晨，她才回到王后身边，带来了一个主意。
        - id: ch03-b07
          speaker: frog
          text: 夫人，让我替您去见国王吧。我会告诉他您受过的苦，也告诉他，他有一个世上最可爱的小女儿。路很远，我又走得慢，可总有一天能到。只是我走后没人保护您，您会不会害怕？请仔细想想，得由您自己决定。
        - id: ch03-b08
          speaker: queen
          text: 这还用想吗！不过，我得写封信，让他知道你真是我派去的。
          emotion: happy
        - id: ch03-b09
          speaker: narrator
          text: 王后举起自己的手，又托起穆费特的小手，让孩子也这样感谢青蛙。接着她刺破手臂，用鲜血在手帕一角写了几句话，撕下来交给青蛙。两位朋友就此告别。
        - id: ch03-b10
          speaker: narrator
          text: 青蛙花了一年零四天，才爬完通向地面的一万级台阶，因为她身上还带着邪恶仙女的魔咒。到了顶端，她累得在小溪边整整休息一年，同时筹备觐见国王的仪仗。她很清楚自己和亲眷该得到什么礼遇，绝不能像无名小卒一样走进宫廷。她一次次同帽子商量，终于安排妥当。告别王后满两年时，整支队伍出发了。
        - id: ch03-b11
          speaker: narrator
          text: 最前面是蝗虫卫队。后面跟着绿色小青蛙宫女，每只都骑着蜗牛，坐天鹅绒鞍垫。水鼠装成侍童，再后面才是青蛙自己。她躺在八只蟾蜍抬的龟甲轿子里，戴着帽子，舒舒服服。那轿子看着小，可青蛙不在里面时，光是她的帽子就能装下两枚鸡蛋。
        - id: ch03-b12
          speaker: narrator
          text: 这趟路又走了七年。七年里，王后一直被希望折磨，不知道青蛙什么时候才能到，也不知道国王会怎样回答。穆费特竭尽所能地安慰母亲。幸好狮仙女有时忽然来了兴致，会带母女俩到地上打猎，不然王后或许早已死去。她心里无论多苦，每次重新看见阳光，还是会满心欢喜。穆费特也渐渐长大。到了七岁，她射出的箭已经很少落空。有女儿陪在身边，苦候的年月总算比王后原先敢想的过得快一点。
        - id: ch03-b13
          speaker: narrator
          text: 青蛙一路都很讲究体面。谁来劝也没用，她绝不在公共场所露面，连大路都不走，免得碰见旁人。可队伍偶尔要过小溪或沼泽，就会停下来。大家脱掉华服，扔开缰绳，蝗虫、水鼠和青蛙全在泥里痛快玩上一两个钟头。
        - id: ch03-b14
          speaker: narrator
          text: 终于，王宫的塔楼出现在远处。一个晴朗的早晨，仪仗队带着皇家使团的威风走进城门。门口、窗口，连屋顶都挤满了人，欢呼声一直传进王宫。可国王顾不上这些。九年过去，他刚向群臣的恳求让步，第二次婚礼马上就要举行。
        - id: ch03-b15
          speaker: narrator
          text: 龟甲轿停在宫殿台阶前，青蛙心跳得厉害。她探出身，叫来门口的卫兵。
        - id: ch03-b16
          speaker: frog
          text: 我要见国王陛下。
        - id: ch03-b17
          speaker: guard
          text: 陛下正忙，现在谁也不见。
        - id: ch03-b18
          speaker: frog
          text: 他会见我的。
        - id: ch03-b19
          speaker: narrator
          text: 青蛙盯着卫兵。不知为什么，他竟带着整支队伍穿过长廊，来到觐见大厅。国王坐在贵族中间，正在商量婚礼服装。青蛙从轿中跳到地面，又一下跳上御座扶手，满殿的人都惊呆了。
        - id: ch03-b20
          speaker: frog
          text: 陛下，我总算没有来迟。再晚一天，您就要违背九年前向王后许下的誓言了。
        - id: ch03-b21
          speaker: king
          text: 我永远珍爱她留下的回忆。可是青蛙夫人，国王很少能只照自己的心意做事，还得听从臣民。我已经抵抗了九年，再也撑不下去，只好选择那边玩球的美丽姑娘。
          emotion: sad
        - id: ch03-b22
          speaker: frog
          text: 她再美，您也不能娶。您的王后还活着。这封信是她托我带来的，用她自己的鲜血写成。您还有一个快满九岁的女儿。世上其他孩子的美貌全加起来，也比不上她。
        - id: ch03-b23
          speaker: narrator
          text: 青蛙递上那块方手帕。国王的脸一下变得惨白，双手抖得几乎看不清信。他把手帕亲了两三遍，失声痛哭，好久才说得出话。他告诉群臣，这确实是王后的笔迹。既然她还活着，第二次婚礼当然作罢。
        - id: ch03-b24
          speaker: narrator
          text: 护送新娘来的使臣十分不满，其中一人气愤地站出来质问。
        - id: ch03-b25
          speaker: envoy
          text: 陛下难道只凭一只青蛙的话，就要这样羞辱我们的公主吗？
          emotion: angry
        - id: ch03-b26
          speaker: frog
          text: 我可不是什么“一只青蛙”。现在就让你们看看证据！我的仙女朋友们，都到这里来！
          emotion: angry
        - id: ch03-b27
          speaker: narrator
          text: 青蛙戴上帽子。一眨眼，一群头戴王冠的美丽仙女出现在她面前。谁也想不到，她们原来是青蛙从蜗牛、水鼠和蝗虫随从中挑出来的。青蛙打了个手势，仙女们便跳起芭蕾舞。满殿的人看得心醉神迷，谁也舍不得停，纷纷请求她们再演一回。
        - id: ch03-b28
          speaker: narrator
          text: 第二支舞开始时，舞者变成一朵朵鲜花。花又化作喷泉，水柱交错着流过大厅两边，冲下台阶，汇成环绕城堡的河。河上漂着彩绘和描金的小船。
        - id: ch03-b29
          speaker: princess
          text: 我们坐船去玩吧！
          emotion: happy
        - id: ch03-b30
          speaker: narrator
          text: 公主早已扔下球，跑来看奇景。她非去不可，奉命寸步不离的使臣只好跟上，虽然他们平时能不坐船就绝不坐。公主和使臣刚在软垫上坐稳，河与船便一同消失，他们也不见了。青蛙身边又只剩恢复原形的蜗牛、蝗虫和水鼠。
        - id: ch03-b31
          speaker: frog
          text: 陛下现在该相信，我是一位仙女，说的也都是真话了吧？请别耽搁，安排好国事，马上去找您的妻子。这枚戒指能让您看见王后，也能保您平安地同狮仙女说话，虽说她是世上最可怕的生灵。
        - id: ch03-b32
          speaker: narrator
          text: 国王早把那位公主忘得干干净净。他选择她，本就是为了顺从臣民。如今他急着启程，和青蛙催得一样急。他任命一位大臣摄政，又把青蛙想要的一切都赏给她，戴上戒指，骑马赶到森林边。他让马自行回家，一个人步行向前。
    - id: ch04
      title: 水晶宫前的誓言
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 国王不知道地下世界的入口在哪儿，也没有东西给他带路，只能到处徘徊。一天，他正在树下休息，忽然听见一个声音。
        - id: ch04-b02
          speaker: ring
          text: 你开口问我，想知道的事就能知道，何必白费力气？只靠你自己，永远找不到妻子所在的地方。
        - id: ch04-b03
          speaker: narrator
          text: 国王吃了一惊，四下张望，却什么也没看到。那声音仿佛从他身上发出。他低头看见戒指，这才明白。
        - id: ch04-b04
          speaker: king
          text: 我真傻，白白浪费了这么多宝贵时间！亲爱的戒指，求你让我看看妻子和女儿吧！
        - id: ch04-b05
          speaker: narrator
          text: 话音才落，一头巨大的母狮从眼前奔过，后面跟着一位夫人和一名美丽少女，两人都骑着仙马。国王欢喜得几乎昏过去。他望着她们远去，浑身发抖，倒在地上。
        - id: ch04-b06
          speaker: king
          text: 带我去找她们！快带我去！
        - id: ch04-b07
          speaker: narrator
          text: 戒指劝他拿出勇气，随后把他平安带到妻子被囚十年的阴惨地方。
        - id: ch04-b08
          speaker: narrator
          text: 狮仙女早知道国王会来到自己的领地，便叫人在水银湖中央造起一座水晶宫。为了让人更难靠近，她还施法让宫殿随水漂流，一刻也不停。打猎回来以后，也就是国王刚才看见的那次狩猎，她马上把王后和穆费特关进水晶宫，交给湖中怪物看守。每一只怪物都爱上了公主，彼此嫉妒得要命，为了她恨不得互相吞吃，所以都很乐意接下差事。有的环绕漂浮的宫殿驻守，有的坐在门前，最小最轻的那些则蹲在屋顶。
        - id: ch04-b09
          speaker: narrator
          text: 国王对此一无所知。他勇敢地走进狮仙女的宫殿。狮仙女仍是狮子模样，正等在那里，尾巴气得猛抽。她发出震动墙壁的咆哮，迎面扑来。国王早有防备，一剑砍下她伸来杀人的前爪。狮仙女向后倒下，国王戴着头盔，举盾护身，一脚踩住她的咽喉。
        - id: ch04-b10
          speaker: king
          text: 把你从我身边偷走的妻子和孩子还回来，不然你一刻也别想活！
          emotion: angry
        - id: ch04-b11
          speaker: lion_fairy
          text: 先从窗户看看那片湖，再说我有没有本事把她们交给你。
        - id: ch04-b12
          speaker: narrator
          text: 国王望出去，隔着水晶墙，看见妻子和女儿正在水银湖上漂流。他一见她们，立刻忘了脚下的狮仙女和她做过的一切恶事。他摘下头盔，用尽力气呼喊。王后听出丈夫的声音，带着穆费特跑到窗边，向他伸出双手。
        - id: ch04-b13
          speaker: king
          text: 我在这里起誓，哪怕赔上性命，只要不能带你们母女离开，我就绝不走！
        - id: ch04-b14
          speaker: narrator
          text: 这句誓言发自真心。只是那时，国王还不知道自己揽下了多大的艰险。
        - id: ch04-b15
          speaker: narrator
          text: 三年过去，他还是没能接近水晶宫。能想象到的苦，他几乎全吃遍了。夜里只能睡在荨麻上，饿了只能吃比胆汁还苦的野果。每天，他都得同阻挡自己靠近宫殿的丑恶怪物搏斗。可三年下来，他连一步也没前进，一点优势也没争到。到了这时，国王几乎完全绝望，准备什么都不管了，直接纵身跳进湖中。
        - id: ch04-b16
          speaker: narrator
          text: 就在这时，一个夜里，那条一直从屋顶窥视他的小龙爬到他身边。
        - id: ch04-b17
          speaker: dragon
          text: 你以为爱情能打败所有阻碍，现在总算知道它不能了吧？不过，只要你用王冠和权杖发誓，以后无论什么时候，只要我开口，你都得请我吃一顿永远不会厌的美食，我就能带你到妻子和女儿身边。
        - id: ch04-b18
          speaker: narrator
          text: 国王欢喜极了。只要能抱住妻女，还有什么誓言是他不肯立的？他答应龙的全部条件，立刻跳上龙背。龙刚要振翼飞向水晶宫，最近的怪物却醒了。它们听见谈话，纷纷游到岸边迎战。
        - id: ch04-b19
          speaker: narrator
          text: 战斗又长又苦。国王才击退湖边的敌人，宫门口又有巨大的蝙蝠、猫头鹰和乌鸦从四面扑来。幸好龙牙尖爪利，王后也急着帮助丈夫，不断从墙上折下锋利的玻璃，拿来刺割怪物。可怕的敌人终于飞走。
        - id: ch04-b20
          speaker: narrator
          text: 一声雷鸣般的巨响过后，水晶宫和所有怪物全消失了。谁也不知道事情是怎么发生的。国王回过神来，发现自己已经和妻子、女儿站在自家宫殿的大厅里。
    - id: ch05
      title: 龙来索取旧债
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 龙和其他一切全都不见了。此后好几年，再没有人听说过它，也没有人想起它。穆费特一天天长大，也一天比一天美丽。十四岁时，邻国的国王和皇帝纷纷派来使者，有的替自己求婚，有的想让她嫁给自己的儿子。很长一段时间，不管来的是谁，也不管提出怎样的请求，她都无动于衷。后来，一位才华非凡的年轻王子终于打动了她。
        - id: ch05-b02
          speaker: narrator
          text: 国王让女儿自己选择丈夫，心里却早盼着这位王子成为女婿。两人在一个盛大的日子订了婚。王子带上穆费特的画像，含泪告别，回到父王的宫廷。
        - id: ch05-b03
          speaker: narrator
          text: 王子走后，日子变得很慢。穆费特总找事情消磨时间，又忍住不抱怨，免得旁人也难过。一天早晨，她正在王后房里弹竖琴，国王忽然冲进来，一把抱紧女儿，几乎把她吓着。
        - id: ch05-b04
          speaker: king
          text: 我的孩子！我亲爱的孩子！你为什么偏偏要来到这个世上？
          emotion: sad
        - id: ch05-b05
          speaker: muffette
          text: 是王子死了吗？
          emotion: fearful
        - id: ch05-b06
          speaker: king
          text: 不，不是。可是……唉，我怎么说得出口！
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: 国王倒在软垫上，王后和穆费特跪在身边。过了很久，他才讲出那个可怕的消息。刚才有个巨人来到宫廷，自称是龙派来的使者。国王当年正是靠那条龙，才从水晶宫里救出妻女。
        - id: ch05-b08
          speaker: narrator
          text: 龙这些年忙个不停，早把公主忘了。直到穆费特订婚的消息传来，它才想起同国王做过的交易。听人越多谈起她，龙越觉得她一定是一道美味，于是命巨人立刻把她带走。
        - id: ch05-b09
          speaker: narrator
          text: 王后和公主听见这样可怕的命运，心里的恐惧根本没法用话说明。她们马上奔到大厅，巨人正在那里等候。母女俩扑倒在他脚边，苦苦哀求。整个王国都可以拿走，只求他饶过公主。巨人并不是铁石心肠，神情也很和善，可他说自己没有权力改变任何事。如果公主不肯安安静静跟他离开，龙便会亲自到宫廷来接她。
        - id: ch05-b10
          speaker: narrator
          text: 一连几天，国王和王后几乎不停地求巨人帮忙。巨人终于等得不耐烦了。
        - id: ch05-b11
          speaker: giant
          text: 只有一个办法能救你们。把公主嫁给我的侄子。他年轻英俊，还学过魔法，懂得怎样护住她，不让龙伤害。
        - id: ch05-b12
          speakers: [king, queen]
          ensemble: duo
          text: 谢谢您，太谢谢您了！您真替我们卸下了一副千斤重担。我们愿意拿半个王国给她做嫁妆。
          emotion: happy
        - id: ch05-b13
          speaker: narrator
          text: 他们紧紧把巨人的大手按在胸前。穆费特却站起来，把父母推到一边。
        - id: ch05-b14
          speaker: muffette
          text: 我绝不会为了活命，就背弃自己的承诺。我现在便跟你去龙的住处。
        - id: ch05-b15
          speaker: narrator
          text: 父母怎样流泪哀求，也不能让她改变主意。
    - id: ch06
      title: 青蛙带来的救星
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 第二天早晨，穆费特坐进轿子，由巨人护送。国王和王后跟在后面，宫女们一路哭泣。众人向龙的城堡所在的山脚走去。路上到处是石头，十分难走，他们却只嫌这段路结束得太快。
        - id: ch06-b02
          speaker: narrator
          text: 到了龙指定的地方，巨人叫抬轿的人停住。
        - id: ch06-b03
          speaker: giant
          text: 该向你们的女儿告别了。我已经看见龙朝这里飞来。
        - id: ch06-b04
          speaker: narrator
          text: 果然，一片乌云似乎遮住了太阳。在人群和太阳之间，一个足有半英里长的巨大身躯越来越近。国王起初不敢相信，那就是水银湖边曾经友善的小兽。他不懂巫术，也没学过把身体变大变小的法门，可来的确实是那条龙。
        - id: ch06-b05
          speaker: narrator
          text: 它有六只翅膀，身体沉重，尾巴很长，还足足打了五十个半的卷儿，却仍用自己最快的速度飞来。
        - id: ch06-b06
          speaker: narrator
          text: 龙很快，可戴着小帽、骑着猎犬的青蛙更快。她闯进一间屋子，王子正坐在那里，望着未婚妻的画像。
        - id: ch06-b07
          speaker: frog
          text: 公主的性命马上就到最后一刻了，你还坐在这里做什么？院里有一匹绿色的马，三个脑袋，十二只脚。马旁放着一柄十八码长的宝剑。快走，再晚就来不及了！
        - id: ch06-b08
          speaker: narrator
          text: 王子骑上绿马，带着长剑及时赶到。恶战打了整整一天。龙有六只翅膀和可怕的利爪，王子的力气渐渐快用光了。龙以为自己已经赢定，便张开巨口，想发出胜利的咆哮。王子看准这一刻，没等那张大嘴重新合上，就把十八码长的宝剑深深刺进它的喉咙。
        - id: ch06-b09
          speaker: narrator
          text: 龙的利爪绝望地抓着地面，六只巨翼慢慢垂下。最后，它倒在一旁，再也不动。穆费特得救了。
        - id: ch06-b10
          speaker: narrator
          text: 众人一起回到王宫。第二天，穆费特和王子举行婚礼。从此以后，他们永远幸福地生活在一起。
