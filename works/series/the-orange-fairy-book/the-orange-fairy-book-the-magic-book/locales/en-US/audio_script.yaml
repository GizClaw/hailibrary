  chapters:
    - id: ch01
      title: The Door in the Mountain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Peder and Kirsten were an old couple with one son, Hans. All through his childhood, Hans knew what would happen when he turned sixteen. He would leave home, go out into the world, and serve as an apprentice. So one fine summer morning, he set off to seek his fortune with nothing but the clothes on his back."
        - id: ch01-b02
          speaker: narrator
          text: "Hans walked cheerfully for hours. He drank from clear springs, picked ripe fruit from the trees, and wished the little wild creatures good morning when they peeped from the bushes. At last he met an old man with a white beard coming along the same narrow path. Hans would not move aside. Neither would the old man. They struck each other with a bump."
        - id: ch01-b03
          speaker: hill_man
          text: "A boy ought to make way for an old man, don't you think?"
        - id: ch01-b04
          speaker: hans
          text: "This path belongs to me just as much as it belongs to you."
        - id: ch01-b05
          speaker: narrator
          text: "Hans spoke rudely because no one had taught him manners. The old man answered without losing his temper."
        - id: ch01-b06
          speaker: hill_man
          text: "That's true enough. Where are you going?"
        - id: ch01-b07
          speaker: hans
          text: "I'm going to find a place in service."
        - id: ch01-b08
          speaker: hill_man
          text: "Then come and work for me."
        - id: ch01-b09
          speaker: narrator
          text: "Hans was willing, but first he wanted to know his wages."
        - id: ch01-b10
          speaker: hill_man
          text: "Two pounds a year. All you have to do is keep a few rooms clean."
        - id: ch01-b11
          speaker: narrator
          text: "That sounded easy, so Hans agreed to enter the old man's service, and they continued together. They crossed a deep valley and reached a mountain. There the old man opened a trapdoor and told Hans to follow. He crawled inside and started down a long flight of steps, with Hans behind him. At the bottom, Hans found room after room, all bright with many lamps and filled with beautiful things. He was still gazing around when the old man explained his duties."
        - id: ch01-b12
          speaker: hill_man
          text: "Here is your work. Clean these rooms and scatter fresh sand on every floor each day. Food and drink will always be waiting on this table, and that is your bed. You may wear any of the suits hanging on the wall. But never open that locked door. If you do, trouble will come to you. Now farewell. I am leaving, and I cannot say when I will return."
        - id: ch01-b13
          speaker: narrator
          text: "As soon as the old man vanished, Hans sat down to a good meal. Afterward, he went to bed and slept until morning. When he woke, he could not remember at first what had happened or where he was. Little by little it came back to him. Then he jumped up, went through all the rooms, and examined each one carefully."
        - id: ch01-b14
          speaker: hans
          text: "Why should I scatter sand on all these floors when no one is here but me? I won't do it."
        - id: ch01-b15
          speaker: narrator
          text: "He shut the other rooms quickly and cleaned only his own. After the first few days, even that began to seem pointless. No one ever came to see whether the rooms were clean or dirty. Soon Hans did no work at all. He only sat there wondering what could be hidden behind the locked door. At last, his curiosity grew so strong that he decided to look for himself."
        - id: ch01-b16
          speaker: narrator
          text: "The key turned easily. Hans went in, uneasy now, and saw a heap of bones. He was ready to flee when he noticed books on a shelf. He loved reading, and a book would help pass the time. He took one down. It taught magic, including how to change yourself into anything in the world. Hans thought nothing could be more exciting or useful. He slipped the book into his pocket and escaped through a small door that had been left open."
    - id: ch02
      title: The Dog and the Giant Cow
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "When Hans reached home, his parents asked where he had been and how he had gotten such fine clothes."
        - id: ch02-b02
          speaker: hans
          text: "I earned them."
        - id: ch02-b03
          speaker: peder
          text: "You could never have earned clothes like those so quickly. Get out! I won't have a thief in my house."
          emotion: angry
        - id: ch02-b04
          speaker: hans
          text: "I only came back to help you. But if you want me gone, I'll go. Tomorrow morning, a great dog will be waiting at the door. Don't chase it away. Take it to the castle and sell it to the duke for ten dollars. Just be sure to bring home the strap you lead it with."
        - id: ch02-b05
          speaker: narrator
          text: "The next morning, the dog stood at the door exactly as Hans had said, waiting to be let in. Peder was afraid that selling it might get him into trouble. Kirsten, however, urged him to do exactly what their son had told them. So Peder took the dog up to the castle and sold it to the duke for ten dollars. He did not forget Hans's warning. Before leaving, he removed the strap he had used to lead the animal and carried it home. Kirsten was waiting for him at the door."
        - id: ch02-b06
          speaker: kirsten
          text: "Well, Peder? Did you sell the dog?"
        - id: ch02-b07
          speaker: peder
          text: "Yes, Kirsten. I brought back the ten dollars, just as the boy promised."
        - id: ch02-b08
          speaker: kirsten
          text: "Wonderful! That's what comes of doing as you're told. If I hadn't stopped you, you would have chased the dog away and lost the money. I always know what's best in the end."
          emotion: happy
        - id: ch02-b09
          speaker: peder
          text: "Nonsense. Women always think they know best. I would have sold that dog no matter what you said. Put the money somewhere safe, and stop talking."
        - id: ch02-b10
          speaker: narrator
          text: "Hans returned the following day. Even after everything had happened just as he said, Peder still did not trust him."
        - id: ch02-b11
          speaker: peder
          text: "Go away! You'll bring trouble on us."
        - id: ch02-b12
          speaker: hans
          text: "I haven't done enough for you yet. Tomorrow, an enormous fat cow will come, almost as big as this house. Take it to the king's palace and sell it for a thousand dollars. Bring back the halter, and come home through the forest instead of using the high road."
        - id: ch02-b13
          speaker: narrator
          text: "In the morning, an enormous head filled their bedroom window. Behind it stood a cow nearly as large as their hut. Kirsten could hardly contain her joy when she thought of the money it would bring."
        - id: ch02-b14
          speaker: kirsten
          text: "But how will you ever get the rope over her head?"
        - id: ch02-b15
          speaker: peder
          text: "Just wait, and I'll show you."
        - id: ch02-b16
          speaker: narrator
          text: "Peder leaned the hayloft ladder against the cow's neck. He climbed up, slipped the rope over her head, and made the noose secure. Then he led her to the palace. There he met the king walking in the grounds."
        - id: ch02-b17
          speaker: peder
          text: "Your Majesty, I heard the princess is to be married. I've brought you a cow larger than any cow ever seen. Would you care to buy her?"
        - id: ch02-b18
          speaker: narrator
          text: "The king had never seen such a beast. He gladly paid Peder's price of one thousand dollars. Peder removed the halter and left. Then the king called for the butcher and ordered him to kill the cow for the wedding feast."
        - id: ch02-b19
          speaker: narrator
          text: "The butcher made ready with his pole-axe and lifted it to strike. Before the blow could fall, the cow became a dove and flew away. The butcher stood staring after it as though he had turned to stone. He searched, but the dove was nowhere to be found, so he had to report what had happened. The king immediately sent messengers to capture Peder and bring him back. But Peder had followed Hans's warning. He was hidden safely in the woods, and the messengers could not find him. Only when he felt sure the danger had passed did he go home. Kirsten saw the money he carried and nearly fainted with joy."
        - id: ch02-b20
          speaker: kirsten
          text: "We're rich now! We must build a bigger house."
          emotion: happy
        - id: ch02-b21
          speaker: narrator
          text: "Peder shook his head, and Kirsten was annoyed."
        - id: ch02-b22
          speaker: peder
          text: "No. If we do that, people will talk. They'll say we got our money dishonestly."
    - id: ch03
      title: The Horse and the Hawk
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "A few mornings later, Hans came back once more."
        - id: ch03-b02
          speaker: peder
          text: "Leave before you get us into trouble. The money has been real so far, but I still don't trust any of this."
        - id: ch03-b03
          speaker: hans
          text: "Don't worry, Father. Tomorrow, you'll find a horse by the gate. Ride it to market and sell it for a thousand dollars. Only remember to take off the bridle."
        - id: ch03-b04
          speaker: narrator
          text: "The horse was there in the morning, and Kirsten had never seen a finer animal."
        - id: ch03-b05
          speaker: kirsten
          text: "Be careful, Peder. Don't let it hurt you."
        - id: ch03-b06
          speaker: peder
          text: "Don't be foolish. When I was young, I lived among horses. I could ride anything for twenty miles around."
        - id: ch03-b07
          speaker: narrator
          text: "That was not true. Peder had never ridden a horse in his life. Still, this one was gentle, and it carried him safely to market. A man offered nine hundred and ninety-nine dollars, but Peder refused to take less than a thousand. At last, a grey-bearded old man agreed to his price. The instant the buyer touched the horse, it kicked and plunged."
        - id: ch03-b08
          speaker: peder
          text: "I have to remove the bridle. It isn't being sold with the horse."
        - id: ch03-b09
          speaker: hill_man
          text: "I'll pay you one hundred dollars for the bridle."
        - id: ch03-b10
          speaker: peder
          text: "No, I can't sell it."
        - id: ch03-b11
          speaker: hill_man
          text: "Five hundred dollars."
        - id: ch03-b12
          speaker: peder
          text: "No."
        - id: ch03-b13
          speaker: hill_man
          text: "One thousand dollars."
        - id: ch03-b14
          speaker: narrator
          text: "That splendid offer overcame Peder's caution. It seemed shameful to let so much money slip away, despite Hans's warning. He agreed to sell the bridle. By then the horse was kicking and struggling so violently that Peder could barely hold it. He put the animal into the old man's charge and walked home carrying two thousand dollars, one thousand for the horse and another thousand for the bridle."
        - id: ch03-b15
          speaker: narrator
          text: "Kirsten was delighted. Again she demanded a new house and land, and this time Peder agreed. Before long, they owned a fine farm."
        - id: ch03-b16
          speaker: narrator
          text: "Meanwhile, the old man rode to a smithy and asked for shoes to be forged for the horse. The smith suggested a drink first. They tied the horse beside the spring and went indoors. The day was hot, both men were thirsty, and they had plenty to discuss. Hours passed while they talked."
        - id: ch03-b17
          speaker: narrator
          text: "A servant girl came to the spring for water. She was kindhearted, so she offered some to the horse. Then the animal spoke."
        - id: ch03-b18
          speaker: hans
          text: "Take off my bridle, and you'll save my life."
        - id: ch03-b19
          speaker: servant_girl
          text: "I don't dare. Your master will be furious with me."
        - id: ch03-b20
          speaker: hans
          text: "He can't harm you, and you really will save my life."
        - id: ch03-b21
          speaker: narrator
          text: "The girl removed the bridle. She nearly fainted with astonishment when the horse changed into a dove and flew away. At that very moment, the old man came out of the house. One glance told him what had happened. He changed himself into a hawk and flew after the dove. The two birds sped on over woods and fields. At last they came to a king's palace, with beautiful gardens all around it."
        - id: ch03-b22
          speaker: narrator
          text: "The princess was walking among the roses with her attendants. The dove became a gold ring and dropped at her feet. The dove, like the dog, the cow, and the horse before it, had been Hans."
        - id: ch03-b23
          speaker: princess
          text: "Oh, a ring! Where could it have come from?"
          emotion: surprised
        - id: ch03-b24
          speaker: narrator
          text: "She picked it up and slipped it onto her finger. At once, the hill-man lost his power over Hans."
        - id: ch03-b25
          speaker: princess
          text: "How strange. It fits as if someone made it especially for me."
          emotion: surprised
        - id: ch03-b26
          speaker: narrator
          text: "Just then, the king approached."
        - id: ch03-b27
          speaker: princess
          text: "Look what I found!"
        - id: ch03-b28
          speaker: king
          text: "It doesn't look very valuable, my dear. And surely you have enough rings already."
        - id: ch03-b29
          speaker: princess
          text: "That doesn't matter. I like this one."
    - id: ch04
      title: The Ring and the Summer-House
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "When the princess was alone, the ring suddenly left her finger and became a man. She was as frightened as anyone would have been. In an instant, the man became a ring again. Then the ring turned back into a man. It went on that way for some time, first man, then ring, then man again. Slowly, the princess grew used to these sudden changes. At last, Hans thought he could speak to her without making her scream."
        - id: ch04-b02
          speaker: hans
          text: "I'm sorry I frightened you. I hid with you because the old hill-man was trying to kill me. I offended him, but while I am here, I am safe."
        - id: ch04-b03
          speaker: princess
          text: "Then you had better stay here."
        - id: ch04-b04
          speaker: narrator
          text: "So Hans stayed, and he and the princess became good friends. He took human form only when nobody else was there. For a while, all went well. Then one day, while they were talking, the king entered the room. Hans changed himself into a ring, but he was too late. The king had seen him, and his anger was terrible."
        - id: ch04-b05
          speaker: king
          text: "So this is why you've refused every king and prince who asked to marry you!"
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: "The king would not even wait for his daughter to answer. He ordered that she and her lover be walled up inside the summer-house and left there to starve to death. That evening, the poor princess was taken away. She still wore Hans in the shape of a ring on her finger. The servants put enough food for three days into the summer-house with her. Then they laid brick after brick across the doorway until she and Hans were sealed inside."
        - id: ch04-b07
          speaker: narrator
          text: "A week or two later, the king decided that despite her behavior, his daughter should have a grand funeral. He ordered the summer-house opened. He could scarcely believe what he saw. Neither the princess nor Hans was inside. At his feet was a hole wide enough for two people to pass through."
        - id: ch04-b08
          speaker: narrator
          text: "This was what had happened. When Hans and the princess lost all hope, they lay down on the ground to die. The earth opened beneath them. They fell into the hole and passed right through the world, until at last they landed in a castle made of pure gold on the other side. There they lived happily, though the king knew nothing about it."
        - id: ch04-b09
          speaker: king
          text: "Will anyone go down and discover where this passage leads? Whoever is brave enough to explore it will be richly rewarded."
        - id: ch04-b10
          speaker: narrator
          text: "No one answered for a long time. The guards and courtiers looked into the hole, but it was dark and terribly deep. If there was a bottom, no one could see it. Finally, a soldier who was rather careless by nature volunteered for the task. He lowered himself cautiously into the darkness. A moment later, he lost his hold and fell. Down, down, down he tumbled. As he dropped through the earth, he wondered whether he would go on falling forever."
        - id: ch04-b11
          speaker: narrator
          text: "At last, to his great relief, the soldier reached the golden castle. There stood the princess and Hans, both healthy and showing no sign that they had nearly starved. They talked together, and the soldier brought them news from above."
        - id: ch04-b12
          speaker: soldier
          text: "The king is deeply sorry for what he did to you. Day and night, he wishes he could have his daughter back."
    - id: ch05
      title: The King Gives Judgment
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "Hans, the princess, and the soldier took a ship and sailed home. When they reached the princess's country, Hans disguised himself as the ruler of a neighboring kingdom. He left the others behind and went alone to the palace."
        - id: ch05-b02
          speaker: narrator
          text: "The king prided himself on welcoming guests, so he received the supposed sovereign warmly and ordered a banquet in his honor. That evening, as the two men sat drinking wine, Hans asked the king for advice."
        - id: ch05-b03
          speaker: hans
          text: "Your Majesty's wisdom is famous, and I have traveled a long way to seek your counsel. In my country, a father buried his daughter alive because she loved a young man born to a peasant family. I must pass judgment. What punishment should I give such an unnatural father?"
        - id: ch05-b04
          speaker: narrator
          text: "The king still truly mourned his daughter, and he answered at once."
        - id: ch05-b05
          speaker: king
          text: "Burn him alive, then scatter his ashes throughout the kingdom."
        - id: ch05-b06
          speaker: narrator
          text: "Hans looked steadily at the king. Then he cast off his disguise."
        - id: ch05-b07
          speaker: hans
          text: "You are that father. I am the young man who loved your daughter and became the gold ring on her finger. She is safe and waiting nearby. But the judgment you have just spoken is judgment on yourself."
        - id: ch05-b08
          speaker: narrator
          text: "The king fell to his knees and begged Hans to spare him. In every other way, he had been a good father, so Hans and the princess forgave him."
    - id: ch06
      title: A Month of Wedding Feasts
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "Hans and the princess were married, and the celebrations lasted for a whole month. The hill-man meant to attend the wedding too. But as he walked along a street toward the palace, a loose stone fell on his head and killed him."
        - id: ch06-b02
          speaker: narrator
          text: "After that, Hans and the princess lived together in peace and happiness for all their days. When the old king died, they took his place and ruled the kingdom."
