audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    hans:
      display_name: 汉斯
      tts:
        delivery: 年轻机敏，起初任性无礼，历险后沉着坚定
        timbre: 清朗明亮
        pace: 明快
        pitch: 中
    peder:
      display_name: 彼得
      tts:
        delivery: 固执谨慎，逞强时带几分粗声粗气
        timbre: 苍老浑厚
        pace: 适中
        pitch: 中低
    kirsten:
      display_name: 基尔斯滕
      tts:
        delivery: 直率健谈，谈到家中好运时格外兴奋
        timbre: 明亮饱满
        pace: 稍快
        pitch: 中高
    hill_man:
      display_name: 山中老人
      tts:
        delivery: 表面温和从容，追索猎物时冷硬执着
        timbre: 低沉干涩
        pace: 缓慢
        pitch: 低
    king:
      display_name: 国王
      tts:
        delivery: 威严好客，震怒时凌厉，悔恨时急切真诚
        timbre: 洪亮厚重
        pace: 适中
        pitch: 中低
    princess:
      display_name: 公主
      tts:
        delivery: 端庄好奇，待人温柔而有主见
        timbre: 清澈柔和
        pace: 从容
        pitch: 中高
    servant_girl:
      display_name: 女仆
      tts:
        delivery: 善良朴实，面对危险时有些迟疑
        timbre: 清亮自然
        pace: 适中
        pitch: 中高
    soldier:
      display_name: 士兵
      tts:
        delivery: 冒失却勇敢，讲述消息时坦率恭敬
        timbre: 粗犷清楚
        pace: 明快
        pitch: 中
  chapters:
    - id: ch01
      title: 山中的魔法书
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一对上了年纪的夫妇，丈夫叫彼得，妻子叫基尔斯滕。他们只有一个儿子，名叫汉斯。汉斯从小就知道，等他过完十六岁生日，便得离开家，到外面的世界去当学徒。
        - id: ch01-b02
          speaker: narrator
          text: 一个晴朗的夏日清晨，他只穿着身上的衣服，就出门寻找前程去了。他快活地走了好几个钟头，渴了便喝几口清泉，饿了便从树上摘熟果子。灌木下的小野兽探头看他，他也笑着点头，向它们道一声早安。
        - id: ch01-b03
          speaker: narrator
          text: 走了一阵，汉斯迎面碰上一位白胡子老人。少年不肯让路，老人也不肯。两个人谁都没停，砰的一声撞在了一起。
        - id: ch01-b04
          speaker: hill_man
          text: 依我看，年轻人遇见老人，应该让一让路。
        - id: ch01-b05
          speaker: hans
          text: 这条路你能走，我也能走。
        - id: ch01-b06
          speaker: narrator
          text: 汉斯从没学过礼貌，说起话来十分无礼。老人倒没有发火，只温和地问他要去哪里。
        - id: ch01-b07
          speaker: hans
          text: 我要去找一份差事。
        - id: ch01-b08
          speaker: hill_man
          text: 那你就来替我做事吧。
        - id: ch01-b09
          speaker: narrator
          text: 汉斯觉得替老人做事也没什么不行，不过得先问清工钱。老人答应一年给他两镑，活儿只有一样，就是把几间屋子收拾干净。汉斯一听，觉得这份差事再轻松不过，便答应下来，跟老人一同上路。
        - id: ch01-b10
          speaker: narrator
          text: 两人一路穿过一道深谷，来到一座山前。老人掀开活板门，叫汉斯紧跟着自己，随后钻进山里，沿着长长的石阶一直往下走。到了最底下，汉斯看见山腹里灯火通明，一间接一间的屋子里，全是美丽的东西，简直叫人看不过来。
        - id: ch01-b11
          speaker: hill_man
          text: 每天把这些屋子打扫干净，再往地板上撒一层沙。桌上随时都有吃的喝的，那边是你的床。墙上的衣服，你爱穿哪套都行。不过，那扇锁着的门绝不能开。你若开了，灾祸就会落到你头上。我还要出门，什么时候回来可说不准。
        - id: ch01-b12
          speaker: narrator
          text: 老人一走，汉斯便坐到那张永远不缺食物的桌边，舒舒服服地饱餐一顿，接着上床，一直睡到第二天早晨。他醒来时一度忘了自己在哪里，想起来以后，赶忙跳下床，走遍所有房间，把每一间都仔细看了个够。
        - id: ch01-b13
          speaker: hans
          text: 这里只有我一个人，还要天天往地板上撒沙，实在太蠢了。我才不干。
        - id: ch01-b14
          speaker: narrator
          text: 他关上那些房门，只收拾自己的屋子。几天以后，他连自己的屋子也懒得打扫了，反正没人来查看。渐渐地，他什么活儿都不做，整天只想着那扇锁住的门，最后终于决定亲眼看看门后有什么。
        - id: ch01-b15
          speaker: narrator
          text: 钥匙轻轻一转，门便开了。汉斯有些害怕，可还是走了进去。第一眼看见的，竟是一堆白骨。他正要退出去，又发现墙边有一只书架。
        - id: ch01-b16
          speaker: narrator
          text: 汉斯喜欢读书，便取下一本，想用它消磨时间。书中全是魔法，教人怎样随心所欲，变成世上的任何东西。还有什么能比这更刺激，又更有用呢？汉斯赶紧把书塞进口袋，从一扇恰好敞开的小门逃出了山。
    - id: ch02
      title: 三次变形
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 汉斯回到家，父母立刻追问他去了哪里，又从哪儿弄来身上的漂亮衣服。
        - id: ch02-b02
          speaker: hans
          text: 这些衣服当然是我自己挣来的。
        - id: ch02-b03
          speaker: peder
          text: 才过了这么短的时间，你绝不可能挣到这些东西。快滚，我不能留你在家。我这里不要贼！
          emotion: angry
        - id: ch02-b04
          speaker: hans
          text: 我回来本想帮你们。既然你要我走，我走就是了。明天早晨，门口会有一条大狗。别赶它，把它牵到城堡卖给公爵，能得十块钱。只是牵狗的皮带一定得带回来。
        - id: ch02-b05
          speaker: narrator
          text: 第二天，大狗果然站在门外，等着人放它进去。彼得怕这件怪事会惹来麻烦，基尔斯滕却催他照儿子说的办。他只好把狗牵到城堡，卖给公爵，收下十块钱，又牢记汉斯的嘱咐，解下牵狗的皮带带回了家。
        - id: ch02-b06
          speaker: kirsten
          text: 彼得，狗卖掉了吗？
        - id: ch02-b07
          speaker: peder
          text: 卖掉了。我照孩子说的，带回了十块钱。
        - id: ch02-b08
          speaker: kirsten
          text: 这可太好了！你现在明白听吩咐的好处了吧？要不是我，你准会把狗赶跑，咱们也拿不到钱。说到底，还是我最知道该怎么办。
          emotion: happy
        - id: ch02-b09
          speaker: peder
          text: 别胡说了。女人总觉得自己最懂。不管你怎么说，我都会卖掉那条狗。快把钱收好，少唠叨几句。
        - id: ch02-b10
          speaker: narrator
          text: 第二天，汉斯又回来了。明明一切都应验了，父亲还是不放心。他对儿子说，钱虽然收到了，可汉斯若继续留下，迟早会给全家招来祸事，还是赶快走的好。
        - id: ch02-b11
          speaker: hans
          text: 我帮你们帮得还不够。明天会来一头肥壮的母牛，差不多和房子一样大。把它牵到王宫，能卖一千块钱。记住把笼头带回来，回家时别走大路，要穿过森林。
        - id: ch02-b12
          speaker: narrator
          text: 第二天一早，一颗硕大的牛头正从卧室窗外往里看。后面那头母牛，几乎和小屋一样大。基尔斯滕想到它能换来的钱，欢喜得不得了，却又发愁该怎样把绳子套到那么高的牛头上。
        - id: ch02-b13
          speaker: peder
          text: 你等着瞧吧。
        - id: ch02-b14
          speaker: narrator
          text: 彼得把通往干草阁楼的梯子搬来，架在牛颈上，再爬上去，把绳圈套在牛头上。确认绳子牢牢套住以后，他才牵着母牛直奔王宫。他恰好遇见国王在花园散步，便说自己听说公主要结婚，特意送来一头世上最大的牛，问国王肯不肯买下，供婚宴使用。
        - id: ch02-b15
          speaker: narrator
          text: 国王从没见过这么大的牲口，痛快地付了彼得开出的价钱，整整一千块。彼得带走笼头以后，国王叫来屠夫，要他宰牛办婚宴。屠夫准备好长柄斧，正要劈下去，母牛忽然化作鸽子飞走了。屠夫望着它消失的方向，呆得像一块石头。
        - id: ch02-b16
          speaker: narrator
          text: 鸽子怎么也找不到，屠夫只得禀告国王。国王马上派出使者，要把卖牛的老头抓回来。可彼得听从儿子的嘱咐，正躲在森林里，谁也找不着。等他觉得危险已经过去，才带着钱回家。基尔斯滕看见这么一大笔钱，高兴得几乎昏过去，立刻提出盖一所更大的房子。
        - id: ch02-b17
          speaker: peder
          text: 不能盖。别人看见了会说闲话，说咱们的钱来路不正。
        - id: ch02-b18
          speaker: narrator
          text: 几天后，汉斯又来帮父母。彼得一见他，仍旧催他快走，还说钱到现在虽然没出岔子，自己心里却始终不踏实。汉斯叫父亲别担心，又说第二天门外会有一匹马，骑去集市能卖一千块，只是卖马以前一定要取下缰辔。
        - id: ch02-b19
          speaker: narrator
          text: 那匹马果然漂亮得出奇。基尔斯滕怕它伤到丈夫，彼得却吹嘘自己年轻时整天同马打交道，方圆二十英里内没有他骑不了的马。其实，他一辈子也没上过马背。
        - id: ch02-b20
          speaker: narrator
          text: 好在马很温顺，平安把彼得驮到集市。有人愿意出九百九十九块，他却坚持非一千不可，少一个子儿也不卖。最后，一位灰胡子老人走来，看过马以后答应出这个价。可老人的手刚碰到马，它便又踢又跳，拼命挣扎起来。
        - id: ch02-b21
          speaker: peder
          text: 我得先解下缰辔。这东西不跟马一起卖，虽然平常都是一起卖的。
        - id: ch02-b22
          speaker: hill_man
          text: 缰辔也给我吧，我另外出一百块。
        - id: ch02-b23
          speaker: peder
          text: 不成，这个不能卖。
        - id: ch02-b24
          speaker: narrator
          text: 老人把价钱加到五百，彼得仍旧说不卖。等老人喊出一千块，他的谨慎终于没了。白白放走这么多钱，实在太可惜。马越闹越凶，彼得几乎拉不住，只好把牲口连同缰辔交给老人，自己揣着卖马和卖缰辔所得的两千块回了家。
        - id: ch02-b25
          speaker: narrator
          text: 基尔斯滕当然又为这份好运欢喜不已。她坚持要盖新房，还要买田地。这一次彼得没再摇头，终于答应了。没过多久，老两口就有了一座美丽的农庄。
    - id: ch03
      title: 金戒指与公主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 灰胡子老人骑着新买的马离开集市，来到一家铁匠铺，要铁匠给马钉掌。铁匠却提议先一同喝杯酒，两人便把马拴在泉边，进屋去了。天气很热，他们都渴得厉害，又有说不完的话。时间一点点过去，他们还是坐在那里聊个不停。
        - id: ch03-b02
          speaker: narrator
          text: 女仆出来打水，看那匹马口渴，好心舀水给它喝。谁知马忽然开口，请她解下缰辔，救自己一命。
        - id: ch03-b03
          speaker: servant_girl
          text: 我不敢这么做，你的主人一定会大发脾气。
        - id: ch03-b04
          speaker: hans
          text: 他伤不了你。只要解开缰辔，你就能救我一命。
        - id: ch03-b05
          speaker: narrator
          text: 姑娘解下缰辔。老人恰好走出屋门，眼睁睁看着马变成鸽子飞上天空。姑娘惊得几乎昏倒，老人却马上化作一只鹰，紧追不舍。
        - id: ch03-b06
          speaker: narrator
          text: 鸽子在前，鹰在后，一路飞过树林和田野，最后来到一座花园环绕的王宫。公主正带着侍女在玫瑰园里散步。眼看鹰就要追上来，鸽子忽然变成一枚金戒指，从空中落在公主脚边。
        - id: ch03-b07
          speaker: princess
          text: 咦，这里有一枚戒指！它是从哪儿来的？
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: 公主捡起戒指，戴上手指。就在那一刻，山中老人再也不能控制汉斯。现在你当然已经明白了，那条卖给公爵的狗、那头险些被宰的牛、集市上的马，还有被鹰追赶的鸽子，全是汉斯用魔法变成的。
        - id: ch03-b09
          speaker: princess
          text: 真奇怪，它戴起来正合适，简直像是特意为我做的。
        - id: ch03-b10
          speaker: narrator
          text: 国王正好走来。公主欢喜地给父亲看自己的发现。
        - id: ch03-b11
          speaker: king
          text: 亲爱的，这戒指不怎么值钱。再说，你的戒指已经够多了。
        - id: ch03-b12
          speaker: princess
          text: 没关系，我就是喜欢它。
        - id: ch03-b13
          speaker: narrator
          text: 等公主独自一人，戒指忽然脱离她的手指，变成一个男子。公主吓坏了，换了任何人也难免害怕。可男子转眼又变回戒指，接着再次变成人形。戒指和男子就这样来回变化了好一阵，她才渐渐习惯，不再一看见汉斯出现便要尖叫。
        - id: ch03-b14
          speaker: hans
          text: 对不起，我吓着您了。我得罪了山中老人，他一直想杀我，所以我才逃来向您避难。只要留在这里，他就不能伤害我。
        - id: ch03-b15
          speaker: princess
          text: 那你就留在这里吧。
        - id: ch03-b16
          speaker: narrator
          text: 汉斯就这样留下来，同公主成了很好的朋友。当然，只有旁人都不在时，他才敢变成人形。本来这样相安无事，可有一天两人正在房里交谈，国王碰巧走了进来。汉斯赶紧变回戒指，却已经迟了，国王看见了他。
        - id: ch03-b17
          speaker: narrator
          text: 国王怒不可遏。
        - id: ch03-b18
          speaker: king
          text: 原来你拒绝所有来求婚的国王和王子，都是为了这个人？
          emotion: angry
        - id: ch03-b19
          speaker: narrator
          text: 他不等女儿回答，便下令把公主和她的情人封死在避暑亭里，让他们活活饿死。
        - id: ch03-b20
          speaker: narrator
          text: 当天晚上，可怜的公主仍旧戴着那枚戒指，被关进避暑亭。里面只留下够吃三天的食物，门随即用砖一层层砌死。过了一两个星期，国王估摸女儿和她的情人早已饿死。他想，女儿即使行为不端，终究还是自己的孩子，也该有一场隆重的葬礼，便叫人拆开门墙。
        - id: ch03-b21
          speaker: narrator
          text: 可避暑亭里既没有公主，也没有汉斯。国王脚边只剩一个大洞，宽得足够两个人通过。
    - id: ch04
      title: 世界另一面的城堡
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 原来，公主和汉斯断了所有希望，倒在地上等死时，双双掉进了这个洞。他们一路向下坠落，竟穿过整片大地，最后跌进世界另一面的城堡。那座城堡全由纯金建成，两人便在那里幸福地生活下来。至于这一切，留在避暑亭外的国王当然一点也不知道。
        - id: ch04-b02
          speaker: king
          text: 谁愿意下去看看这条通道通向哪里？只要有胆量探个明白，我一定重重奖赏他。
        - id: ch04-b03
          speaker: narrator
          text: 卫兵和群臣沉默了很久。洞里又黑又深，就算真有底，也没人能看见。最后，一个生性冒失的士兵自告奋勇。他来到洞口，小心地把身体一点点降进黑暗。
        - id: ch04-b04
          speaker: narrator
          text: 可才过一瞬间，他也掉了下去。他不断往下坠，坠啊，坠啊，仿佛永远也到不了底。士兵心里直想，难道自己要永远这样掉下去吗？最后终于落进金城堡，他不知有多庆幸。
        - id: ch04-b05
          speaker: narrator
          text: 士兵在那里见到了公主和汉斯。两人气色很好，根本不像挨过饿。三个人谈起避暑亭打开以后发生的事，他便把国王如今的心情告诉了他们。
        - id: ch04-b06
          speaker: soldier
          text: 国王非常后悔那样对待自己的女儿。他日夜盼着公主能够回来。
        - id: ch04-b07
          speaker: narrator
          text: 于是三个人一同乘船回国。到达公主的国土以后，汉斯乔装成邻国君主，独自前往王宫。国王一向以殷勤待客自豪，一见这位远来的君主，便热烈地欢迎他，还立刻吩咐人设宴款待贵客。
        - id: ch04-b08
          speaker: narrator
          text: 当天晚上，宴席已经摆好，两人坐在一起饮酒。汉斯端起酒杯，说自己久闻国王智慧过人，这才从遥远的邻国赶来，请他为一桩难办的案子指点裁决的办法。
        - id: ch04-b09
          speaker: hans
          text: 我国有个男人，只因女儿爱上一个农家出身的青年，便把女儿活埋了。这件案子要由我裁决。陛下认为，我该怎样惩罚这个狠心的父亲？
        - id: ch04-b10
          speaker: narrator
          text: 国王仍在真心为失去女儿而悲痛，听完立刻作出回答。
        - id: ch04-b11
          speaker: king
          text: 把他活活烧死，再把他的骨灰撒遍全国。
        - id: ch04-b12
          speaker: narrator
          text: 汉斯定定看了他片刻，随即脱下伪装。
        - id: ch04-b13
          speaker: hans
          text: 那个父亲就是你。我就是爱上你女儿，又化作金戒指戴在她手上的青年。公主平安无事，就在离这里不远的地方等着。可是，你已经亲口判了自己的罪。
        - id: ch04-b14
          speaker: narrator
          text: 国王马上双膝跪地，苦苦请求汉斯饶他一命。想到他除了这件事以外，一直还算是位好父亲，公主和汉斯便宽恕了他，没有照他亲口说出的判决惩罚他。
    - id: ch05
      title: 一个月的婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 汉斯和公主举行了一场盛大的婚礼，整个国家欢庆了整整一个月。山中老人本来也打算到场参加，可他沿着一条通往王宫的街道走来时，一块松动的石头忽然从高处落下，正砸中他的脑袋，当场要了他的命。
        - id: ch05-b02
          speaker: narrator
          text: 从此，汉斯和公主一生平安幸福。老国王去世以后，他们继承了王位，统治这个国家。
