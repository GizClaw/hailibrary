        pace: 稍快
        pitch: 高
    fish_1:
      display_name: 鱼儿甲
      tts:
        delivery: 朴实谨慎，回答时干脆
        timbre: 清润柔和
        pace: 适中
        pitch: 中
    fish_2:
      display_name: 鱼儿乙
      tts:
        delivery: 朴实谨慎，语气温和
        timbre: 轻柔清楚
        pace: 适中
        pitch: 中高
    fish_3:
      display_name: 鱼儿丙
      tts:
        delivery: 朴实谨慎，说话沉着
        timbre: 略低而清晰
        pace: 稍缓
        pitch: 中低
    tunny:
      display_name: 金枪鱼
      tts:
