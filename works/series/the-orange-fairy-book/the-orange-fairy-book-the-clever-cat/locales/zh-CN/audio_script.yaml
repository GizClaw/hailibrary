        timbre: 清亮
        pace: 适中
        pitch: 中高
    attendant_2:
      display_name: 侍女乙
      tts:
        delivery: 恭敬柔和，慌乱时语速加快
        timbre: 柔和清晰
        pace: 适中
        pitch: 高
    attendant_3:
      display_name: 侍女丙
      tts:
        delivery: 恭敬沉静，惊惧时语气发颤
        timbre: 轻柔略低
        pace: 稍缓
        pitch: 中
  chapters:
    - id: ch01
      title: 老人的遗产
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位老人和儿子住在平原边的一间小屋里。老人辛苦劳作了一辈子，年纪已经很大。后来，他终于病倒在床，而且病得很重。他心里明白，自己恐怕再也起不来了。一天，儿子走了很远的路，到附近城里买面包。等儿子回来，老人便让妻子把他叫到床前。
        - id: ch01-b02
          speaker: old_man
          text: 过来吧，儿子。我知道自己快要死了，能留给你的，只有猎鹰、猫和灵缇犬。只要你善用它们，就永远不会缺少食物。往后要像从前孝敬我那样，好好照顾母亲。现在，永别了。
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 老人说完，把脸转向墙壁，离开了人世。小屋里的人哀伤了许多天。后来，儿子终于振作起来，唤来灵缇犬、猫和猎鹰。他告诉母亲，自己要带些晚饭回来，随后便领着三个伙伴出了门。他在平原上走了许久，看见一群羚羊，就用手势命令灵缇犬追赶。狗飞奔过去，很快扑倒了一只肥壮的羚羊。年轻人把猎物扛上肩头，转身回家。途中经过一片池塘时，他刚走近，一大群鸟便扑棱棱地飞上天空。他抖动手腕，腕上的猎鹰立刻腾空而起，朝早已盯准的猎物俯冲下去。那只鸟当场落地死了。年轻人把它拾起来，装进随身的袋子，这才再次踏上归途。
        - id: ch01-b04
          speaker: narrator
          text: 小屋旁有座小谷仓，存着花园附近那一小块麦地里的收成。年轻人走到那里，一只老鼠几乎贴着他的脚窜出来，紧跟着又是一只，再一只。猫的动作却快得像一道闪念，猛扑过去，一只也没放跑。等所有老鼠都被咬死，年轻人才离开谷仓，沿着小路走向屋门。可他忽然感觉一只手搭上肩头，便停下脚步。回头一看，站在身后的陌生人竟是一个食人魔。
        - id: ch01-b05
          speaker: ogre
          text: 年轻人，你是个孝顺的儿子，配得上今天降临的好运。跟我到那边发亮的湖去，别害怕。
        - id: ch01-b06
          speaker: narrator
          text: 年轻人不知道将会发生什么，还是照着食人魔的话来到湖边。
        - id: ch01-b07
          speaker: ogre
          text: 走进水里，再闭上眼睛。你会慢慢沉到湖底，不过不用慌，一切都会平安。到了下面，能带多少银子就带多少。回来以后，我们一人一半。
        - id: ch01-b08
          speaker: narrator
          text: 年轻人勇敢地踏入湖中，只觉得身体慢慢往下沉，一直往下沉，最后双脚终于落上坚实的地面。他睁眼望去，面前整整齐齐摆着四堆银子。银堆正中央有一块奇异的白石，闪烁着光芒，上面刻满他从来没有见过的符号。他拾起石头，凑到眼前，正想看个清楚，那石头竟在他手中开口说话了。
        - id: ch01-b09
          speaker: magic_stone
          text: 只要把我握在手里，你许下的愿望都会实现。现在把我藏进头巾，再叫食人魔拉你上去。
        - id: ch01-b10
          speaker: narrator
          text: 没过多久，年轻人重新站到岸上。食人魔一直等在那里。
        - id: ch01-b11
          speaker: ogre
          text: 怎么样？银子在哪里？
        - id: ch01-b12
          speaker: young_man
          text: 老伯，我真不知道怎么说。下面的一切太耀眼了，我看得晕头转向，像石像一样站着，根本动不了。后来又听见脚步声，我一害怕，只好赶紧叫您拉我上来。
        - id: ch01-b13
          speaker: ogre
          text: 你和先前那些人一样，半点用处也没有！
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: 食人魔怒冲冲地走了。等他不见踪影，年轻人取出藏在头巾里的石头。
        - id: ch01-b15
          speaker: young_man
          text: 我要世上最好的骆驼，还要最华美的衣裳。
        - id: ch01-b16
          speaker: magic_stone
          text: 那就闭上眼睛。
        - id: ch01-b17
          speaker: narrator
          text: 年轻人闭上眼睛，再睁开时，自己想要的骆驼已经站在面前，肩头也披上了沙漠王子庆祝节日时才穿的盛装。他跨上骆驼，吹一声口哨，猎鹰便飞落到手腕上。灵缇犬和猫跟在后面，他们一同往家赶去。母亲正坐在屋门口缝衣服，忽然看见一位如此华贵气派的陌生人骑着骆驼来到跟前。她又吃惊，又觉得对方身份尊贵，连忙站起来，向他深深行礼。
        - id: ch01-b18
          speaker: young_man
          text: 母亲，您真的认不出我了吗？
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: 母亲听见儿子的声音，惊得差点跌倒。
        - id: ch01-b20
          speaker: mother
          text: 这骆驼和衣裳是从哪儿来的？我的儿子难道为了抢到这些东西，竟然杀了人？
          emotion: fearful
        - id: ch01-b21
          speaker: young_man
          text: 您放心，这些东西来得光明正大，详情以后再说。现在请您去见国王，告诉他，我想娶公主。
        - id: ch01-b22
          speaker: narrator
          text: 母亲认定儿子疯了，只能愣愣地望着他。年轻人看懂了她的心思。
        - id: ch01-b23
          speaker: young_man
          text: 别担心。国王不论提出什么条件，您全都答应，总会有办法做到。
    - id: ch02
      title: 炉火映红的冰宫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 母亲来到王宫。国王正坐在议事大厅里，听百姓陈情。她等到所有事情都处理完，厅里再没有别人，才走到王座前跪下。
        - id: ch02-b02
          speaker: mother
          text: 我的儿子托我来，请求迎娶公主。
        - id: ch02-b03
          speaker: narrator
          text: 国王觉得她大概疯了，却没有叫卫兵赶人，反而郑重地提出条件。
        - id: ch02-b04
          speaker: king
          text: 他想娶公主，就先为我造一座冰宫。宫里要能生火取暖，还要暖得足以让世上最娇贵、最稀有的鸣禽住进去。
        - id: ch02-b05
          speaker: mother
          text: 陛下，一定照办。
        - id: ch02-b06
          speaker: narrator
          text: 她离开大厅，儿子穿着平日的衣服，正在宫门外焦急等候。他把母亲拉到无人偷听的地方。
        - id: ch02-b07
          speaker: young_man
          text: 国王究竟要我做什么？
        - id: ch02-b08
          speaker: mother
          text: 是一件绝不可能办到的事。我真希望你别再想着公主了。
        - id: ch02-b09
          speaker: young_man
          text: 到底是什么事？您快告诉我。
        - id: ch02-b10
          speaker: mother
          text: 他要你造一座冰宫，里面还得生火，暖到连最娇弱的鸣禽都能生活。
        - id: ch02-b11
          speaker: young_man
          text: 我还当是什么更难的条件呢。这件事，我马上就办。
        - id: ch02-b12
          speaker: narrator
          text: 年轻人独自来到郊外，取出头巾里的石头。
        - id: ch02-b13
          speaker: young_man
          text: 我要一座能够生火取暖的冰宫，里面还要住满最稀有的鸣禽。
        - id: ch02-b14
          speaker: magic_stone
          text: 闭上眼睛吧。
        - id: ch02-b15
          speaker: narrator
          text: 他闭眼再睁眼，一座冰宫已在面前拔地而起，比他能想象的还要美。炉火透过冰墙，映出柔和的粉红色光辉。
        - id: ch02-b16
          speaker: young_man
          text: 这样的宫殿，就连公主也配得上了。
        - id: ch02-b17
          speaker: narrator
          text: 次日清晨，国王一从睡梦中醒来，就连忙奔到窗边。隔着广阔的平原望去，那座不可思议的冰宫果然矗立在那里，在晨光中闪闪发亮。
        - id: ch02-b18
          speaker: king
          text: 这个年轻人一定是位了不起的魔法师。往后，他也许能为我所用。
        - id: ch02-b19
          speaker: narrator
          text: 母亲再次进宫，禀报说国王交代的事已经办妥。国王这次用极高的礼节接待她，还让她转告儿子，婚礼就在第二天举行。公主十分喜爱自己的新家，也十分喜爱新婚丈夫。接连好些天，两人都过得快快乐乐，只顾一件件赏玩宫中数不尽的美丽珍宝。可日子一久，年轻人厌倦了整天待在高墙之内。他告诉妻子，第二天必须暂时离开她，出去打几个钟头的猎。
        - id: ch02-b20
          speaker: young_man
          text: 我只离开几个钟头，你不会介意吧？
        - id: ch02-b21
          speaker: princess
          text: 我当然舍不得你。不过，我会用这一天琢磨几件新衣裳。等你回来，我一定会格外高兴呀！
        - id: ch02-b22
          speaker: narrator
          text: 丈夫出门时，猎鹰停在他的手腕上，灵缇犬和猫跟在后面。冰宫暖融融的，连猫也乐意住在这里。年轻人刚走，守候机会多日的食人魔就敲响了宫门。
        - id: ch02-b23
          speaker: ogre
          text: 我刚从遥远的国度回来，带着世上最大、最亮的一些宝石。听说公主喜欢美丽的东西，也许愿意买几颗？
        - id: ch02-b24
          speaker: narrator
          text: 这些天，公主一直为新衣服的装饰犯愁。她想让自己的衣裙在宫廷舞会上胜过所有贵妇，可不管想到什么，都觉得还不够好。一听说食人魔带着货物等在楼下，她马上叫人把他领进自己的房间。食人魔把宝石一件件摆到她面前。那些红宝石鲜艳夺目，珍珠又罕见又美丽。公主越看越确信，别的贵妇绝不会拥有这样的首饰。她心里渴望极了，表面上却垂着眼睛，不肯让食人魔看出来。
        - id: ch02-b25
          speaker: princess
          text: 恐怕这些珠宝太昂贵，我买不起。何况，我眼下也不怎么缺首饰。
        - id: ch02-b26
          speaker: ogre
          text: 我也没有非卖不可的意思。只是父亲留给我的宝石项链少了一颗最大的石头，那上面刻着奇怪的符号。我听说，它在你丈夫手里。你若替我拿来，这些珠宝随你挑。你得装成是自己想要，千万不要提我。他太看重那块石头，绝不会交给陌生人。明天，我会带来比这些更好的珠宝。夫人，告辞。
        - id: ch02-b27
          speaker: narrator
          text: 食人魔走后，公主独自想了很多。最叫她放不下的，还是该不该说服丈夫，把石头送给自己。丈夫已经给她那么多东西，如果还要开口讨走他唯一保留的宝物，实在可耻，也实在卑鄙。她一度下定决心，绝不能这样做。可没过多久，那些钻石和一串串珍珠又浮现在眼前。她转念一想，两人才成婚一个星期。对丈夫来说，把石头送给妻子的快乐，理应远远胜过自己留下它的快乐。公主越想越觉得，这个道理准不会错。
    - id: ch03
      title: 消融的宫殿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 当天晚上，公主特意让人做了丈夫最喜欢的菜。等年轻人吃过晚饭，她紧挨着他坐下，轻轻抚摸他的头，先不提自己的心事，只专心听他讲当天打猎的经历。故事讲完，年轻人才说起一路上的牵挂。
        - id: ch03-b02
          speaker: young_man
          text: 我整天都想着你，还盼望带回一件你喜欢的礼物。可你已经什么都有了，我还能送你什么呢？
        - id: ch03-b03
          speaker: princess
          text: 你经历那么多危险和辛苦，还一直惦记我，真好。我的确有许多漂亮东西。不过，既然你想送我礼物，明天又正好是我的生日，我还真有一件很想要的东西。
        - id: ch03-b04
          speaker: young_man
          text: 是什么？只要你说出来，我马上给你！
        - id: ch03-b05
          speaker: princess
          text: 就是前几天从你头巾褶子里掉下来的亮石头。那块小石头刻着好多奇怪符号，我从没见过这样的东西。
        - id: ch03-b06
          speaker: narrator
          text: 公主拨弄着丈夫的手指。年轻人沉默片刻，才慢慢回答。
        - id: ch03-b07
          speaker: young_man
          text: 我已经答应送你，就一定会做到。可是你要发誓，永远不把它交给别人，还要时时刻刻带在身边，好好保管。我不能告诉你更多，只求你务必记住。
        - id: ch03-b08
          speaker: narrator
          text: 丈夫说得这样郑重，公主不由得吃了一惊，也开始后悔自己听信食人魔的话。可是，话已经说到这里，她又不愿退缩。于是，她装出对新玩意儿欢喜得不得了的样子，亲吻丈夫，再三向他道谢。夜里，她渐渐沉入梦乡。临睡着以前，还在心里安慰自己，就算已经拿到石头，也不一定非得把它交给食人魔。
        - id: ch03-b09
          speaker: narrator
          text: 偏偏第二天早晨，年轻人又出去打猎。暗中监视的食人魔知道他离开了，这一次却比上回晚了许多才现身。他敲响宫门时，公主已经玩腻了所有消遣，侍女们急得束手无策，怎么也想不出还有什么能让她开心。就在这时，一个身穿猩红衣服的高个子黑人走来禀报，说食人魔正在楼下，想知道公主是否肯见他。
        - id: ch03-b10
          speaker: princess
          text: 快把他带上来！
        - id: ch03-b11
          speaker: narrator
          text: 公主从软垫上一跃而起，把昨夜的决心全忘了。转眼间，她又痴迷地俯看着璀璨的宝石。侍女们也尽量靠近，都想瞧个清楚。
        - id: ch03-b12
          speaker: ogre
          text: 那块石头，你拿到了吗？
        - id: ch03-b13
          speaker: princess
          text: 拿到了，就在这里。
        - id: ch03-b14
          speaker: narrator
          text: 她从腰带里抽出石头，放进其余宝石中。随后故意抬高声音，飞快谈起金链和项链的价格。为了骗过侍女，她还讨价还价了一番，最后说自己只喜欢那串珍珠，其余东西根本不及食人魔声称的一半值钱。
        - id: ch03-b15
          speaker: ogre
          text: 一切听从您的意思，夫人。
        - id: ch03-b16
          speaker: narrator
          text: 食人魔一路鞠着躬，退出了宫殿。没过多久，一件怪事发生了。公主漫不经心地碰了碰房间的墙，手掌竟然全湿了。过去，那面冰墙总会映出壁炉里温暖的红光。她回头看去，不知道是不是错觉，炉火似乎也比从前暗淡许多。公主急急忙忙走进画廊，只见地板上东一处、西一处，已经积起了水洼。一阵寒意顿时传遍全身。就在这时，受惊的侍女们从楼梯上飞奔下来。
        - id: ch03-b17
          speakers: [attendant_1, attendant_2, attendant_3]
          ensemble: chorus
          text: 公主！公主！究竟出了什么事？这座宫殿正在我们眼前消失！
          emotion: fearful
        - id: ch03-b18
          speaker: princess
          text: 我的丈夫很快就会回来。大家先等一等，他回来以后，会告诉我们该怎么办。
          emotion: calm
        - id: ch03-b19
          speaker: narrator
          text: 公主自己几乎和侍女们一样害怕，却知道必须做出镇定的样子。她们找来宫里最高的椅子，全都坐上去，又裹紧最厚的衣裳，在脚下垫起一摞摞软垫，就这样等待年轻人回家。那些可怜的鸣禽冻得翅膀发僵，仍在宫里一处又一处地乱飞。幸好，它们终于在一个被遗忘的角落发现了敞开的窗户，便争先恐后地飞了出去，从此再也没有出现。
        - id: ch03-b20
          speaker: narrator
          text: 上层房间的墙壁和地板渐渐融化，公主和侍女再也待不下去，只好退到大厅避难。年轻人这时终于回来了。他沿着一条弯弯曲曲的道路骑马赶回，因为一路被转弯遮挡，直到离家很近，才看见冰宫正在消失。他望着眼前的惨状，惊恐地停在那里。只消一眼，他就明白妻子背弃了自己的信任。不过，他想到妻子已经受尽折磨，不肯再责备她。他催马赶上前，纵身越过冰宫仅存的墙壁。公主一看见他，立刻如释重负地叫出声来。
        - id: ch03-b21
          speaker: young_man
          text: 快走！再不离开，你们会冻死的！
          emotion: fearful
        - id: ch03-b22
          speaker: narrator
          text: 一支凄惨的小队朝国王的宫殿走去，灵缇犬和猫跟在最后。到了宫门，年轻人把她们留下。妻子苦苦请求他让自己进去，他却不答应。
        - id: ch03-b23
          speaker: young_man
          text: 你辜负了我的信任，也毁掉了我的一切。我要独自去寻找新的出路。
          emotion: angry
        - id: ch03-b24
          speaker: narrator
          text: 他没有再说一个字，转身离开了公主。
    - id: ch04
      title: 猫和猎鹰的远行
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 年轻人腕上停着猎鹰，身后跟着灵缇犬和猫，就这样走了很远很远。一路上，他逢人便问，有没有见过他的仇敌食人魔，可谁也没有见过。于是，他命猎鹰飞上天空，再往高处飞，越高越好，好用那双锐利的眼睛寻找老贼。猎鹰飞得实在太高，过了几个钟头才落回主人身边。它说，食人魔正在一个遥远国度的海岸边，躺在一座华丽宫殿里睡觉。年轻人听到这个消息，喜出望外，马上买来一块肉，让辛苦的猎鹰好好吃上一顿。
        - id: ch04-b02
          speaker: young_man
          text: 明天，你飞到食人魔的宫殿去。趁他睡着，在他身边找一块刻着古怪符号的石头，再把它带给我。三天以后，我在这里等你回来。
        - id: ch04-b03
          speaker: falcon
          text: 好，不过我得带上猫一起去。
        - id: ch04-b04
          speaker: narrator
          text: 太阳还没升起，猎鹰就飞上高空。猫坐在它背上，两只前爪紧紧抱着它的脖子。
        - id: ch04-b05
          speaker: falcon
          text: 最好把眼睛闭上，不然你会头晕。
        - id: ch04-b06
          speaker: narrator
          text: 除了爬树，猫从没离开过地面，便听话地闭起眼睛。猎鹰载着它飞了一整天，夜里也没有停下。等第二天早晨来临，它们终于看见食人魔的宫殿躺在脚下的大地上。猫直到这时，才第一次把眼睛睁开。
        - id: ch04-b07
          speaker: cat
          text: 哎呀，下面看着真像一座老鼠城。咱们下去吧，它们也许能帮忙。
        - id: ch04-b08
          speaker: narrator
          text: 它们落在老鼠城中心的灌木丛里。猎鹰留在那里，猫则躺到城堡正门外，引得老鼠们一片恐慌。过了许久，猫还是一动不动。一只胆大的老鼠终于从楼上窗口探出头，声音直发抖。
        - id: ch04-b09
          speaker: bold_rat
          text: 你来这里做什么？你想要什么？只要我们办得到，你说出来，我们一定照办。
          emotion: fearful
        - id: ch04-b10
          speaker: cat
          text: 你们要是早肯让我说话，就会知道我是来交朋友的。请派四只最强壮、最机灵的老鼠出来，替我办件事，我会很感激。
        - id: ch04-b11
          speaker: bold_rat
          text: 我们很乐意！不过，请先告诉我是什么差事。这样我才知道，该派谁去最合适。
        - id: ch04-b12
          speaker: cat
          text: 今天夜里，它们要从城墙下面挖洞进去，再爬到食人魔睡觉的房间。食人魔把一块石头藏在身边，那上面刻着古怪符号。四只老鼠要找到它，别惊醒食人魔，悄悄把石头带给我。
        - id: ch04-b13
          speaker: bold_rat
          text: 我们一定照办。
        - id: ch04-b14
          speaker: narrator
          text: 那只老鼠马上出去，把猫的命令传达下去。到了午夜前后，猫仍旧睡在城门外。老鼠首领带着找回的石头来到门后，可它怎么也不敢打开大门，只好隔着高处，朝猫身上泼下一些水。猫受惊以后，大叫一声，从地上跳了起来。
        - id: ch04-b15
          speaker: head_rat
          text: 这是你要的石头。把爪子举起来，我从上面扔给你。好了，再会吧。你还有很远的路要赶，最好在天亮以前出发。
        - id: ch04-b16
          speaker: narrator
          text: 老鼠首领把石头扔了下去。
        - id: ch04-b17
          speaker: cat
          text: 你的主意很好。
        - id: ch04-b18
          speaker: narrator
          text: 猫暗自笑了笑，把石头牢牢衔在嘴里，离开老鼠城去找猎鹰。这一路上，它和猎鹰一直没有吃到任何东西。重新起飞以后，猎鹰又要驮着沉重的猫，很快便累得难以支撑。夜幕降临时，它终于宣布，自己再也飞不动了，今晚只能停在河岸边过夜。
        - id: ch04-b19
          speaker: falcon
          text: 现在应该轮到我保管石头。否则，看起来什么都是你做的，我一点功劳也没有。
        - id: ch04-b20
          speaker: cat
          text: 不行！石头是我拿到的，就得由我保管。
          emotion: angry
        - id: ch04-b21
          speaker: narrator
          text: 猫已经又疲惫又烦躁，猎鹰也不肯让步，它们很快大吵起来。争吵到一半，猫抬高声音，一张开嘴，石头便掉进河里，恰好落入一条游过的大鱼耳中。猫和猎鹰同时扑进水里追赶，可一切都已经太迟了。两个忠心的仆从几乎淹死，呛进的水更是多得厉害，好不容易才挣扎着爬回岸边。猎鹰飞到一棵树上，在阳光下展开湿透的翅膀晾晒。猫先把身上的水使劲抖掉，接着开始刨挖沙岸，把挖下的一块块泥沙全抛进河中。
    - id: ch05
      title: 魔石失而复得
      blocks:
        - id: ch05-b01
          speaker: little_fish
          text: 你为什么把沙子扔进来？河水都让你搅浑了，你不知道吗？
        - id: ch05-b02
          speaker: cat
          text: 我才不在乎。我要把这条河整个填满，让里面的鱼全都死掉。
        - id: ch05-b03
          speaker: little_fish
          text: 我们从没伤害过你，这样对我们太狠心了。你为什么生我们的气？
        - id: ch05-b04
          speaker: cat
          text: 因为你们当中有一条鱼拿了我的石头。那块石头刻着奇怪符号，刚刚掉进水里。你们答应把它找回来，我也许就会放过这条河。
        - id: ch05-b05
          speaker: little_fish
          text: 我一定尽力！不过请耐心等一等，这件事可能不好办。
        - id: ch05-b06
          speaker: narrator
          text: 话音刚落，小鱼身上的鳞片一闪，便飞快地游走了。它使出全身力气，直奔离这里不远的大海。到了那里，它把住在附近的亲戚全召集起来，告诉它们那块失踪的石头，也告诉它们，猫正准备填平河流，河里的居民眼下正面临一场可怕的灾难。
        - id: ch05-b07
          speakers: [fish_1, fish_2, fish_3]
          ensemble: chorus
          text: 那块石头不在我们这里。不过，海湾里住着一条金枪鱼。它虽然年纪很大，却到处都去。要是有谁知道石头在哪儿，一定就是它。
        - id: ch05-b08
          speaker: narrator
          text: 小鱼马上游去找金枪鱼，又把整件事讲了一遍。
        - id: ch05-b09
          speaker: tunny
          text: 咦，几个钟头以前，我刚去过那条河！回来路上，有件东西掉进了我的耳朵，到现在还在那里。我回家后睡了一觉，竟把它忘了。也许那就是你找的石头。
          emotion: surprised
        - id: ch05-b10
          speaker: narrator
          text: 金枪鱼翘起尾巴一甩，石头便掉了出来。
        - id: ch05-b11
          speaker: little_fish
          text: 对，我想一定就是这块！
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: 小鱼把石头衔回河边，放到猫面前的沙地上。
        - id: ch05-b13
          speaker: cat
          text: 多谢你。作为报答，我不会再为难你们的河了。
        - id: ch05-b14
          speaker: narrator
          text: 猫重新爬到猎鹰背上，它们带着来之不易的石头，一同飞回主人身边。年轻人再次见到两个忠心的伙伴，又看见魔石安然无恙，心里的欢喜真是说不尽。他握住石头，立刻许愿要一座宫殿。不过这一回，他没有再要一座冰宫，而是要它用绿色大理石建成。宫殿出现以后，他又许下一个愿望，让公主和她的侍女们全都搬进来。此后，他们在绿色宫殿里共同生活了许多年。等到老国王去世，公主的丈夫便继承他的王位，成了这个国家的新国王。
        - id: ch05-b15
          speaker: narrator
          text: 这个故事，是根据《柏柏尔故事集》改编的。
