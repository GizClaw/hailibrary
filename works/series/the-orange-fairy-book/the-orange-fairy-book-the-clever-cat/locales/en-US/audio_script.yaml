  chapters:
    - id: ch01
      title: The Old Man's Gifts
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Once an old man and his son lived in a small hut at the edge of a wide plain. The old man had worked hard all his life. When illness laid him in bed, he knew he would never rise again. One day, while his son was away in the nearest town buying bread, he asked his wife to bring the young man to him as soon as he returned."
        - id: ch01-b02
          speaker: father
          text: "Come close, my son. I know I am dying. All I can leave you is my falcon, my cat, and my greyhound. Use them well, and you will never go hungry. Be as good to your mother as you have always been to me. Now, farewell."
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: "The old man turned his face to the wall and died. For many days, there was deep mourning in the hut. At last, the son rose and called his greyhound, cat, and falcon. He told his mother he would bring something home for dinner, then set off across the plain. Before long, he spotted a herd of gazelles and motioned for the greyhound to give chase. The dog soon brought down a fine, fat gazelle. The young man slung it across his shoulders and started home."
        - id: ch01-b04
          speaker: narrator
          text: "His path passed a pond. As he drew near, a whole cloud of birds rose into the air. The young man shook the wrist where his falcon sat. The falcon darted upward, chose its quarry, and swept down. The bird it struck fell dead to the ground. The young man picked it up, tucked it into his pouch, and once more turned toward home."
        - id: ch01-b05
          speaker: narrator
          text: "Close to the hut stood a little barn where the family stored the harvest from their small patch of corn. The corn grew near the garden, and the young man passed the barn on his way to the door. A rat darted out almost under his feet. Another followed, and then another. Quick as thought, the cat sprang on them. She caught every one, and not a single rat escaped."
        - id: ch01-b06
          speaker: narrator
          text: "When the last rat was dead, the young man left the barn and took the path to the hut. Then a hand touched his shoulder, and he stopped. The stranger behind him was an ogre."
        - id: ch01-b07
          speaker: ogre
          text: "Young man, you have been a good son. You deserve the good fortune that has come to you today. Follow me to that shining lake, and don't be afraid."
        - id: ch01-b08
          speaker: narrator
          text: "The young man wondered what was about to happen, but he obeyed. At the lake, the ogre turned to him."
        - id: ch01-b09
          speaker: ogre
          text: "Walk into the water and close your eyes. You will sink slowly to the bottom, but be brave. Nothing will harm you. Gather as much silver as you can carry, and when you return, we will share it."
        - id: ch01-b10
          speaker: narrator
          text: "The young man stepped boldly into the lake. Down he sank, and down again, until his feet touched firm ground. Four heaps of silver lay before him. In their midst was a strange white stone, shining with marks he had never seen. He picked it up for a closer look, and the stone spoke."
        - id: ch01-b11
          speaker: magic_stone
          text: "While you hold me, every wish you make will come true. Hide me in your turban. Then tell the ogre you are ready to go up."
        - id: ch01-b12
          speaker: narrator
          text: "A few minutes later, the young man stood once more beside the lake. The ogre was waiting."
        - id: ch01-b13
          speaker: ogre
          text: "Well? Where is the silver?"
        - id: ch01-b14
          speaker: young_man
          text: "Father, I hardly know how to explain it. Everything below was so splendid that I stood there dazzled, like a statue. Then I heard footsteps coming. I lost my courage and called for you, just as you heard."
        - id: ch01-b15
          speaker: ogre
          text: "You're no better than any of the others!"
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: "The ogre strode off in a rage. Once he was out of sight, the young man took the stone from his turban."
        - id: ch01-b17
          speaker: young_man
          text: "Give me the finest camel in the land and the most splendid clothes."
        - id: ch01-b18
          speaker: magic_stone
          text: "Then close your eyes."
        - id: ch01-b19
          speaker: narrator
          text: "He closed them. When he looked again, the camel stood before him, and the festive robes of a desert prince hung from his shoulders. He mounted, whistled the falcon onto his wrist, and rode home with the greyhound and cat behind him."
    - id: ch02
      title: The Palace of Ice
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "His mother sat sewing outside the hut. When the magnificent rider approached, she took him for a stranger and bowed low."
        - id: ch02-b02
          speaker: young_man
          text: "Mother, don't you know me?"
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: "He laughed, and at the sound of his voice, his mother nearly fell over in astonishment."
        - id: ch02-b04
          speaker: mother
          text: "Where did you get this camel and these clothes? Surely my own son hasn't murdered someone to take them!"
          emotion: fearful
        - id: ch02-b05
          speaker: young_man
          text: "Don't be frightened. I came by them honestly, and I'll tell you how later. For now, go to the palace. Tell the king that I want to marry his daughter."
        - id: ch02-b06
          speaker: narrator
          text: "His mother stared at him. She was certain he had gone mad. The young man saw what she was thinking and smiled."
        - id: ch02-b07
          speaker: young_man
          text: "There is nothing to fear. Agree to whatever the king asks. Somehow, it will be done."
        - id: ch02-b08
          speaker: narrator
          text: "The mother went to the palace. The king sat in the Hall of Justice, hearing his people's requests. She waited until the last person had gone. Then she approached the throne and knelt."
        - id: ch02-b09
          speaker: mother
          text: "My son has sent me to ask if he may marry the princess."
        - id: ch02-b10
          speaker: narrator
          text: "The king thought the woman must be mad. Still, he did not have his guards throw her out. He answered her with a solemn face."
        - id: ch02-b11
          speaker: king
          text: "Before your son can marry my daughter, he must build me a palace made of ice. Fires must warm it without melting it, and the rarest singing birds must be able to live inside."
        - id: ch02-b12
          speaker: mother
          text: "It will be done, Your Majesty."
        - id: ch02-b13
          speaker: narrator
          text: "She left the hall. Outside the palace gates, her son waited anxiously in his everyday clothes. He pulled her aside where no one could hear."
        - id: ch02-b14
          speaker: young_man
          text: "Well? What must I do?"
        - id: ch02-b15
          speaker: mother
          text: "He asked for something impossible. Please, forget about the princess."
        - id: ch02-b16
          speaker: young_man
          text: "But what did he ask for?"
        - id: ch02-b17
          speaker: mother
          text: "Only a palace of ice where fires can burn and keep it warm enough for the most delicate singing birds!"
        - id: ch02-b18
          speaker: young_man
          text: "I expected something much harder. I'll see to it now."
        - id: ch02-b19
          speaker: narrator
          text: "He left his mother, walked into the country, and drew the stone from his turban."
        - id: ch02-b20
          speaker: young_man
          text: "I wish for a palace of ice, warmed by fires and filled with the rarest singing birds."
        - id: ch02-b21
          speaker: magic_stone
          text: "Then close your eyes."
        - id: ch02-b22
          speaker: narrator
          text: "The young man obeyed. When he opened his eyes, the palace stood there, more beautiful than anything he had imagined. Firelight cast a gentle pink glow through the ice. He thought it was fit even for the princess."
        - id: ch02-b23
          speaker: narrator
          text: "The next morning, the king woke and hurried to his window. Across the plain stood the shining palace."
        - id: ch02-b24
          speaker: king
          text: "That young man must be a powerful wizard. He could be useful to me."
        - id: ch02-b25
          speaker: narrator
          text: "When the mother returned to say that his command had been carried out, the king received her with great honor. He told her the wedding would take place the next day. The princess was delighted with the husband chosen for her, and with the marvelous palace that would be her home."
    - id: ch03
      title: The Ogre's Bargain
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "The princess was delighted with her husband and her new home. Several happy days passed while they looked through all the beautiful things in the palace. Then the young man grew tired of staying within its walls. He told his wife he meant to spend a few hours hunting the next day."
        - id: ch03-b02
          speaker: young_man
          text: "You won't mind, will you?"
        - id: ch03-b03
          speaker: princess
          text: "Of course I'll mind. But I'll spend the day planning some new dresses. Then it will be all the more wonderful when you come home."
        - id: ch03-b04
          speaker: narrator
          text: "The next day, her husband rode away with the falcon on his wrist and the greyhound and cat behind him. The palace was so warm that even the cat had been content to live there."
        - id: ch03-b05
          speaker: narrator
          text: "The ogre had watched for his chance for many days. As soon as the young man was gone, he knocked at the palace door and spoke to an attendant."
        - id: ch03-b06
          speaker: ogre
          text: "I've just returned from a distant country with some of the largest, brightest jewels in the world. The princess is known to love beautiful things. Perhaps she would care to buy a few."
        - id: ch03-b07
          speaker: narrator
          text: "For days, the princess had been trying to choose trimmings that would make her dresses outshine every other lady's at the court balls. Nothing seemed fine enough. When she heard about the ogre's wares, she ordered that he be brought straight to her chamber."
        - id: ch03-b08
          speaker: narrator
          text: "He spread wonderful stones before her. There were glowing rubies and rare pearls, finer than anything she had imagined. The princess felt certain that no other lady owned jewels like these. She longed to have them for her dresses, but she lowered her eyes so the ogre would not see how much she wanted them."
        - id: ch03-b09
          speaker: princess
          text: "I'm afraid these are too expensive for me. Besides, I scarcely need any more jewels just now."
        - id: ch03-b10
          speaker: ogre
          text: "I'm in no great hurry to sell them. But my father left me a necklace of shining stones, and the largest one is missing. It was carved with strange marks. I hear your husband has it. Get me that stone, and you may choose any jewels here. You must pretend you want the stone for yourself. Above all, don't speak of me. Your husband values it too much to give it to a stranger. Tomorrow, I'll return with jewels finer than any you see today. Until then, madam."
        - id: ch03-b11
          speaker: narrator
          text: "After he left, the princess could think of little except whether to ask her husband for the stone. One moment, she remembered how much he had already given her. Asking for the only thing he had kept seemed shameful and mean. No, she decided, she could not do it. The next moment, she saw the diamonds and strings of pearls in her mind. They had been married only a week, she told herself. Surely the pleasure of giving her the stone would be far greater than the pleasure of keeping it."
        - id: ch03-b12
          speaker: narrator
          text: "That evening, the princess made sure her husband's favorite dishes were served for supper. Afterward, she sat close beside him and stroked his head. She listened carefully as he told her about the day's adventures. At last, he finished."
        - id: ch03-b13
          speaker: young_man
          text: "All day, I thought of you. I wished I could bring home something you would love. But what can I give you when you already have everything?"
        - id: ch03-b14
          speaker: princess
          text: "How kind you are to remember me in the middle of all those dangers. I do have many beautiful things. Still, tomorrow is my birthday, and there is one present I want very much."
        - id: ch03-b15
          speaker: young_man
          text: "What is it? Tell me, and you shall have it at once."
        - id: ch03-b16
          speaker: princess
          text: "A few days ago, a bright little stone fell from the folds of your turban. It had such curious marks on it. I've never seen another stone like it. That's what I want."
        - id: ch03-b17
          speaker: narrator
          text: "The young man was silent at first. Then he answered slowly."
        - id: ch03-b18
          speaker: young_man
          text: "I gave my word, so I must keep it. But swear that you will never give the stone away. Keep it safely with you at all times. I cannot tell you more, but I beg you to remember my warning."
        - id: ch03-b19
          speaker: narrator
          text: "His grave manner startled the princess. She began to regret listening to the ogre. Yet she did not want to take back her request. She acted overjoyed with her new toy, kissing and thanking her husband. As she fell asleep, she thought that she did not have to give it to the ogre after all."
        - id: ch03-b20
          speaker: narrator
          text: "Unfortunately, the young man went hunting again the next morning. The ogre was watching and knew when he had gone, but this time he waited until much later to return. By then, the princess had grown tired of every occupation she could think of. Her attendants were at their wits' end, unable to find anything that might amuse her. Then a tall attendant dressed in scarlet came to make an announcement."
        - id: ch03-b21
          speaker: attendant
          text: "Madam, the jewel merchant is below. He asks whether you will receive him."
        - id: ch03-b22
          speaker: princess
          text: "Bring him here at once!"
        - id: ch03-b23
          speaker: narrator
          text: "She sprang from her cushions, forgetting every promise she had made to herself the night before. A moment later, she bent in delight over the glittering gems. Her ladies stood as near as they dared, hoping for a glimpse. The ogre leaned close and whispered."
        - id: ch03-b24
          speaker: ogre
          text: "Did you get the stone?"
        - id: ch03-b25
          speaker: princess
          text: "Yes. Here it is."
        - id: ch03-b26
          speaker: narrator
          text: "She slipped it from her sash and set it among the jewels. Then she spoke loudly and quickly about the prices of the chains and necklaces. To deceive her attendants, she bargained for a while before making her choice."
        - id: ch03-b27
          speaker: princess
          text: "I like this string of pearls better than all the rest. Take the other things away. They aren't worth half as much as you claim."
        - id: ch03-b28
          speaker: ogre
          text: "As you wish, madam."
        - id: ch03-b29
          speaker: narrator
          text: "The ogre bowed his way out of the palace, taking the magic stone with him."
    - id: ch04
      title: The Melting Palace
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Soon after the ogre left, something strange began to happen. The princess touched the wall of her room. Usually it reflected the warm red light from the fire, but now her hand came away wet. She looked back. Was it only her fancy, or had the fire grown dimmer?"
        - id: ch04-b02
          speaker: narrator
          text: "She hurried into the picture gallery. Pools of water had formed across the floor, and a cold shiver ran through her. Just then, her terrified ladies rushed down the stairs."
        - id: ch04-b03
          speakers: [lady_1, lady_2]
          ensemble: duo
          text: "Madam! What has happened? The palace is vanishing before our eyes!"
          emotion: fearful
        - id: ch04-b04
          speaker: princess
          text: "My husband will be home soon. We must wait for him. He will know what to do."
          emotion: calm
        - id: ch04-b05
          speaker: narrator
          text: "The princess was almost as frightened as her ladies, but she knew she must set them an example. They sat on the tallest chairs they could find, wrapped in their warmest clothes, with cushions piled beneath their feet to keep them out of the icy water. All around them, the poor singing birds fluttered here and there on numbed wings. At last, the birds discovered an open window in some forgotten corner. One after another, they escaped through it and were seen no more."
        - id: ch04-b06
          speaker: narrator
          text: "The walls and floors of the upper rooms kept melting until the princess and her ladies had to abandon them and seek shelter in the hall. At last, the young man came home. He had ridden back along a winding road, so the palace remained hidden until he was almost upon it. Then he stopped, horrified by the sight before him. He understood in an instant that his wife had betrayed his trust. Yet she must be suffering enough already, and he would not reproach her there. He urged his mount forward and leaped over what remained of the palace walls. The princess cried out with relief when she saw him."
        - id: ch04-b07
          speaker: young_man
          text: "Come quickly, or you will freeze to death!"
          emotion: fearful
        - id: ch04-b08
          speaker: narrator
          text: "A dreary little procession set off toward the king's palace, with the greyhound and cat at the rear. At the gates, the young man left the others. His wife begged him to let her go in with him."
        - id: ch04-b09
          speaker: young_man
          text: "You betrayed me and brought me to ruin. I must go and seek my fortune alone."
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: "Without another word, he turned away. The falcon sat on his wrist, and the greyhound and cat followed as he walked a great distance. He asked everyone he met whether they had seen his enemy, the ogre, but no one had. At last, he sent the falcon high into the sky to search with his sharp eyes."
        - id: ch04-b11
          speaker: narrator
          text: "Up flew the falcon, higher and higher, until he had to search from so far above the earth that hours passed before he returned. At last, he brought the news his master longed to hear. The ogre lay asleep in a magnificent palace in a distant country on the shore of the sea. The young man was delighted. He immediately bought meat for the tired falcon and told him to eat his fill."
        - id: ch04-b12
          speaker: young_man
          text: "Tomorrow, fly to the palace where the ogre is sleeping. Search all around him for a stone carved with strange signs, and bring it back to me. I will expect you here in three days."
        - id: ch04-b13
          speaker: falcon
          text: "Then I must take the cat with me."
    - id: ch05
      title: The Cat and the Rat City
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "Before sunrise, the falcon rose into the air with the cat on his back. She wrapped her paws tightly around his neck."
        - id: ch05-b02
          speaker: falcon
          text: "You should close your eyes. Otherwise, you may grow dizzy."
        - id: ch05-b03
          speaker: narrator
          text: "The cat had never been higher than the top of a tree, so she took his advice. They flew all day and all night. The next morning, the ogre's palace appeared below them. For the first time, the cat opened her eyes."
        - id: ch05-b04
          speaker: cat
          text: "Well, look at that. I believe there's a city of rats down there. Let's visit them. They may be able to help us."
        - id: ch05-b05
          speaker: narrator
          text: "They landed among bushes at the heart of the rat city. The falcon remained there, hidden from sight, while the cat walked to the main gate and lay down outside it. Her arrival caused terrible excitement. The rats watched from behind their walls, too frightened to come near. At last, when the cat still had not moved, one rat proved bolder than the rest. He put his head through an upper window of the castle, though his voice trembled when he called down."
        - id: ch05-b06
          speaker: head_rat
          text: "Why are you here? What do you want from us? If we can give it to you, tell us, and we'll do it."
          emotion: fearful
        - id: ch05-b07
          speaker: cat
          text: "If you had let me speak sooner, I would have told you I came as a friend. Please send me four of your strongest and cleverest rats. I need them to do me a service."
        - id: ch05-b08
          speaker: head_rat
          text: "We would be delighted to help. But tell me what the task is, so I can choose the rats best suited to it."
        - id: ch05-b09
          speaker: cat
          text: "Thank you. Tonight, they must tunnel under the castle walls and find the room where an ogre sleeps. Somewhere near him is a stone carved with strange signs. They must find it, take it without waking him, and bring it to me."
        - id: ch05-b10
          speaker: head_rat
          text: "Your orders will be carried out."
        - id: ch05-b11
          speaker: narrator
          text: "The head rat went away to give his instructions to the four chosen rats. The cat remained outside the gate and eventually fell asleep. Around midnight, the head rat returned with news of their success. Even then, he could not bring himself to open the doors while a cat lay so close. Instead, he threw water down on her from above. The cat sprang up with a loud mew."
        - id: ch05-b12
          speaker: head_rat
          text: "Here is the stone you asked for. Hold up your paws, and I'll drop it to you."
        - id: ch05-b13
          speaker: narrator
          text: "The cat raised her paws, and the rat dropped the stone into them."
        - id: ch05-b14
          speaker: head_rat
          text: "Now farewell. You have a long journey ahead, and you should leave before daybreak."
        - id: ch05-b15
          speaker: cat
          text: "That's good advice."
        - id: ch05-b16
          speaker: narrator
          text: "The cat smiled to herself, put the stone in her mouth, and went to find the falcon."
    - id: ch06
      title: The Stone in the River
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "Neither the cat nor the falcon had eaten during their journey. Before long, the falcon grew tired beneath his heavy load. When night came, he said he could fly no farther. They would have to rest beside a river."
        - id: ch06-b02
          speaker: falcon
          text: "Now I should guard the stone. If you keep it all the way home, it will look as though you did everything and I did nothing."
        - id: ch06-b03
          speaker: cat
          text: "No. I found it, so I will carry it."
        - id: ch06-b04
          speaker: narrator
          text: "The cat was tired and cross, and neither animal would give way. Soon the two faithful friends were in the middle of a fine quarrel. The cat forgot the stone between her teeth and raised her voice. Out it slipped, falling straight into the ear of a large fish that happened to be swimming past. Both cat and falcon plunged into the water after it, but the fish was gone before they could reach it."
        - id: ch06-b05
          speaker: narrator
          text: "Half drowned and more than half choked, the two faithful animals struggled back onto the bank. The falcon flew into a tree and spread his wet wings in the sun to dry them. The cat gave herself a thorough shake. Then, without resting, she began clawing up the sandy bank and flinging handful after handful of sand into the stream. A little fish noticed what she was doing."
        - id: ch06-b06
          speaker: little_fish
          text: "What are you doing? You're making all the water muddy."
        - id: ch06-b07
          speaker: cat
          text: "I don't care. I mean to fill this whole river with sand so every fish in it will die."
        - id: ch06-b08
          speaker: little_fish
          text: "But that's cruel! We have never harmed you. Why are you so angry with us?"
        - id: ch06-b09
          speaker: cat
          text: "One of your fish has my stone, the one carved with strange signs. It fell into the water. Promise to bring it back, and perhaps I'll leave your river alone."
        - id: ch06-b10
          speaker: little_fish
          text: "I'll certainly try. You must be patient, though. Finding it may not be easy."
        - id: ch06-b11
          speaker: narrator
          text: "His scales flashed as he darted away. He swam as fast as he could toward the sea, which lay not far from the river. There, he called together all his relations who lived in the nearby waters. He told them about the cat, the missing stone, and the terrible danger now facing every creature that lived in the river."
        - id: ch06-b12
          speakers: [fish_1, fish_2, fish_3]
          ensemble: chorus
          text: "None of us has your stone. But an old tunny lives in the bay. He travels everywhere, even at his age. If anyone knows about it, he will."
        - id: ch06-b13
          speaker: narrator
          text: "The little fish hurried to the tunny and told the whole story again."
        - id: ch06-b14
          speaker: tunny
          text: "Why, I was in that river only a few hours ago! As I swam home, something dropped into my ear. It is still there. I fell asleep when I arrived and forgot all about it. Perhaps it is the thing you need."
          emotion: surprised
        - id: ch06-b15
          speaker: narrator
          text: "The tunny lifted his tail and whisked out the stone."
        - id: ch06-b16
          speaker: little_fish
          text: "Yes! I think this must be it."
          emotion: happy
        - id: ch06-b17
          speaker: narrator
          text: "He took the stone in his mouth and carried it back to the place where the cat was waiting. He laid it on the sand."
        - id: ch06-b18
          speaker: cat
          text: "Thank you. As your reward, I will leave your river alone."
        - id: ch06-b19
          speaker: narrator
          text: "The cat climbed onto the falcon's back, holding the stone safely once more, and the two animals flew to their master. How glad the young man was when his faithful servants returned with the magic stone in their possession! In a moment, he had made his first wish. A new palace appeared, but this time its walls were built of green marble. Then he wished for the princess and all her ladies to come and live there."
        - id: ch06-b20
          speaker: narrator
          text: "They lived in the green palace for many years. When the old king died, the princess's husband ruled in his place."
