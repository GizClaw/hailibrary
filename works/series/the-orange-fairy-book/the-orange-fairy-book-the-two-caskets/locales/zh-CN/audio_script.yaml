audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    stepmother:
      display_name: 继母
      tts:
        delivery: 偏心刻薄，发怒时凶狠急促
        timbre: 粗厉苍老
        pace: 适中偏快
        pitch: 中低
    kind_girl:
      display_name: 善良的姑娘
      tts:
        delivery: 温柔勤快，待人真诚而有礼
        timbre: 清澈柔和
        pace: 适中
        pitch: 中高
    cruel_girl:
      display_name: 骄横的姑娘
      tts:
        delivery: 傲慢任性，言语急躁而无礼
        timbre: 尖亮偏硬
        pace: 稍快
        pitch: 高
    fence:
      display_name: 老篱笆
      tts:
        delivery: 年迈恳切，说话带着微弱的颤音
        timbre: 干涩低沉
        pace: 缓慢
        pitch: 低
    oven:
      display_name: 烤炉
      tts:
        delivery: 朴实热情，语气宽厚
        timbre: 温暖浑圆
        pace: 从容
        pitch: 中低
    cow:
      display_name: 母牛
      tts:
        delivery: 温顺坦诚，叮嘱时认真
        timbre: 醇厚柔和
        pace: 缓慢
        pitch: 低
    gate_woman:
      display_name: 守门老妇
      tts:
        delivery: 苍老睿智，待有礼者亲切，受冒犯时严肃
        timbre: 苍老清楚
        pace: 从容
        pitch: 中低
    mistress:
      display_name: 农庄女主人
      tts:
        delivery: 威严审慎，试探别人时不动声色
        timbre: 沉稳苍老
        pace: 适中偏慢
        pitch: 中低
    cat_1:
      display_name: 黑猫
      tts:
        delivery: 机灵友善，说话轻快
        timbre: 柔滑清亮
        pace: 稍快
        pitch: 中
    cat_2:
      display_name: 白猫
      tts:
        delivery: 温柔热心，与同伴配合默契
        timbre: 轻柔明亮
        pace: 适中
        pitch: 中高
    cat_3:
      display_name: 虎斑猫
      tts:
        delivery: 爽快能干，答话干脆
        timbre: 清脆结实
        pace: 稍快
        pitch: 中
    cat_4:
      display_name: 玳瑁猫
      tts:
        delivery: 亲切活泼，语气带笑
        timbre: 柔和清晰
        pace: 适中偏快
        pitch: 中高
    sparrow_1:
      display_name: 麻雀甲
      tts:
        delivery: 机敏热心，提醒时又快又清楚
        timbre: 清脆
        pace: 快
        pitch: 高
    sparrow_2:
      display_name: 麻雀乙
      tts:
        delivery: 活泼友善，与同伴齐声应和
        timbre: 明亮
        pace: 快
        pitch: 高
    sparrow_3:
      display_name: 麻雀丙
      tts:
        delivery: 轻快热诚，唱答时节奏分明
        timbre: 细亮
        pace: 快
        pitch: 高
    sparrow_4:
      display_name: 麻雀丁
      tts:
        delivery: 伶俐亲切，语尾轻盈
        timbre: 清细
        pace: 快
        pitch: 高
  chapters:
    - id: ch01
      title: 井底的花野
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很远很远的松林里，住着一个女人、她的亲生女儿和继女。亲生女儿从小一哭闹，母亲便把她要的东西全送到手里，结果她越长越蛮横，越长越讨人嫌，相貌也同脾气一样难看。继女却从小辛勤操持家务，照料父亲。父亲第二次结婚不久便去世了。她美丽、善良又能干，邻人个个喜欢她。
        - id: ch01-b02
          speaker: narrator
          text: 两个姑娘越长越大，差别也越来越明显。继母待继女越发狠毒，时时盯着她，总想找个借口打一顿，或是不让她吃饭。借口有多荒唐，她根本不在乎。一天，她实在想不出新花样，便叫两个姑娘一同坐到井边的矮墙上纺线。
        - id: ch01-b03
          speaker: stepmother
          text: 都给我仔细些。谁先把线纺断，我就把谁扔到井底！
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 继母早有安排。她给亲生女儿的是又细又结实的亚麻，给继女的却是一团粗劣得根本没人肯用的东西。没过多久，继女的线果然断了。继母一直躲在门后窥看，这时立刻冲出来，抓住她的双肩，把她推进井里。
        - id: ch01-b05
          speaker: stepmother
          text: 这下你算完了！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 可她错了。这不是结束，只是开头。姑娘向下落啊，落啊，仿佛这口井一直通到大地正中央。双脚终于触地时，她发现自己站在一片花野里。这里比故乡山间的夏牧场还美。树木在柔风中摇曳，颜色最鲜艳的花朵在草间起舞。姑娘虽然孤零零一个人，心也跟着花朵舞动。自从父亲去世，她还从未感到这样快活。于是，她穿过草地向前走去。
        - id: ch01-b07
          speaker: narrator
          text: 她走到一道摇摇欲坠的老篱笆前。那篱笆老得还能站住，简直是个奇迹。爬满篱笆的铁线莲像老人的胡子，仿佛全靠它撑着，篱笆才没有倒。姑娘停下来四处察看，想找一处能安稳跨过去的地方。她还没挪步，篱笆里面便传来了声音。
        - id: ch01-b08
          speaker: fence
          text: 小姑娘，别伤害我。我太老了，剩下的日子已经不多啦。
        - id: ch01-b09
          speaker: kind_girl
          text: 放心吧，我不会伤害你的。
          emotion: calm
        - id: ch01-b10
          speaker: narrator
          text: 她从铁线莲稀疏的地方轻轻跳了过去。
        - id: ch01-b11
          speaker: fence
          text: 愿你一路顺顺利利。
        - id: ch01-b12
          speaker: narrator
          text: 姑娘很快离开草地，转上一条小路。小路两旁各有一道开满花的树篱。正前方立着一座烤炉，从敞开的炉门望进去，里面堆着许多雪白的面包。
        - id: ch01-b13
          speaker: oven
          text: 小姑娘，面包随你吃，只求你别伤害我。
        - id: ch01-b14
          speaker: kind_girl
          text: 你别怕，我从不伤害任何东西。谢谢你给我这么好的白面包。
        - id: ch01-b15
          speaker: narrator
          text: 姑娘叫烤炉不要害怕，说自己从来不伤害任何东西。她十分感激烤炉送给自己这么漂亮的白面包，把面包一直吃到一屑不剩。吃完以后，她仔细关好炉门，又向烤炉道了早安。
        - id: ch01-b16
          speaker: oven
          text: 愿你一路顺顺利利。
        - id: ch01-b17
          speaker: narrator
          text: 后来姑娘口渴了。她看见一头母牛，牛角上挂着挤奶桶，便朝它走去。
        - id: ch01-b18
          speaker: cow
          text: 挤我的奶吧，想喝多少都行。可别把奶洒在地上，也别伤害我。我从没伤害过谁。
        - id: ch01-b19
          speaker: kind_girl
          text: 我也从没伤害过谁。你放心。
          emotion: calm
        - id: ch01-b20
          speaker: narrator
          text: 姑娘坐下来挤奶，一直挤到木桶快满了。接着，她把香甜的牛奶全喝了，只在桶底剩下一小滴。
        - id: ch01-b21
          speaker: cow
          text: 把剩下的奶倒在我的蹄子上，再把桶挂回牛角吧。
        - id: ch01-b22
          speaker: narrator
          text: 姑娘照母牛说的，把最后一滴奶倒在它的蹄子上，再把桶挂回牛角。她亲了亲母牛的额头，又继续赶路。从掉进井里算起，已经过去许多个钟头，太阳渐渐西沉。姑娘正发愁今晚在哪里过夜，忽然看见一道先前没有留意到的大门，门边倚着一位老妇人。
        - id: ch01-b23
          speaker: kind_girl
          text: 晚上好。
        - id: ch01-b24
          speaker: gate_woman
          text: 晚上好，孩子。人人要是都像你这样懂礼貌就好了。你在找什么？
        - id: ch01-b25
          speaker: kind_girl
          text: 我想找个做工的地方。
        - id: ch01-b26
          speaker: gate_woman
          text: 那就先替我梳梳头，再告诉我你会做什么。
        - id: ch01-b27
          speaker: kind_girl
          text: 我很乐意，妈妈。
        - id: ch01-b28
          speaker: narrator
          text: 姑娘拿起梳子，耐心梳理老妇人又长又白的头发。这样过了整整半个钟头。
        - id: ch01-b29
          speaker: gate_woman
          text: 你没有嫌替我梳头有失身份，我就指给你一个去处。做事谨慎些，也耐心些，一切都会顺利。
        - id: ch01-b30
          speaker: narrator
          text: 姑娘谢过老妇人，按照她指的方向赶路。她来到不远处的一座农庄，在那里受了雇，每天负责给母牛挤奶，再把谷子筛好。
    - id: ch02
      title: 善意换来的帮助
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天天一亮，姑娘便来到牛棚。
        - id: ch02-b02
          speaker: kind_girl
          text: 你们一定都饿了吧。
        - id: ch02-b03
          speaker: narrator
          text: 她挨个拍拍母牛，又到谷仓搬来干草。趁母牛吃草，她把牛棚扫得干干净净，再在地上铺好清洁的稻草。母牛喜欢她这样细心，挤奶时全都安静站着，不像从前对待那些粗暴无礼的挤奶女工一样捣乱。她刚要从小凳上起身，便发现黑猫、白猫、虎斑猫和玳瑁猫围成一圈坐在身边。
        - id: ch02-b04
          speakers: [cat_1, cat_2, cat_3, cat_4]
          ensemble: chorus
          text: 我们好渴，请给我们一点奶喝吧！
        - id: ch02-b05
          speaker: kind_girl
          text: 可怜的小猫咪，当然有你们的份。
        - id: ch02-b06
          speaker: narrator
          text: 姑娘走进奶房，所有的猫都排着队跟在后面。她给每只猫盛了满满一小碟奶，碟子全是红色的。猫儿们没有马上喝，先一个个蹭过她的膝头，喉咙里咕噜咕噜地响，算是道谢。接着，姑娘去储藏室筛谷子。她正在筛子里揉搓谷粒，忽听一阵翅膀呼啦作响，四只麻雀带着一群伙伴飞进窗口。
        - id: ch02-b07
          speakers: [sparrow_1, sparrow_2, sparrow_3, sparrow_4]
          ensemble: chorus
          text: 我们饿啦！请给我们一点谷子吧！
        - id: ch02-b08
          speaker: kind_girl
          text: 可怜的小鸟儿，当然有你们的份。
        - id: ch02-b09
          speaker: narrator
          text: 她抓起一大把好谷子撒在地板上。麻雀吃完，又飞到她的肩头，拍着翅膀向她道谢。日子一天天过去，方圆再没有哪家的牛像她照料的这样肥壮，也没有哪座奶房的牛奶这样多。女主人满意极了，不但给她加了工钱，还待她如同亲生女儿。可有一天，女主人把她叫进厨房，说要看看她还有什么本领。
        - id: ch02-b10
          speaker: mistress
          text: 你会养牛，也会管奶房。现在让我瞧瞧别的本领。把筛子拿去盛满井水，带回来时一滴也不许漏。
        - id: ch02-b11
          speaker: narrator
          text: 姑娘心里一沉。用满是孔眼的筛子，怎么可能带回一滴不漏的水呢？可她没有争辩，只拿起筛子来到井边。她俯身把筛子盛到最满，可刚一提起来，水就从孔眼里漏得精光。她试了一遍又一遍，仍然一滴也留不住。她绝望地转身要走时，麻雀忽然从天上落了下来。
        - id: ch02-b12
          speakers: [sparrow_1, sparrow_2, sparrow_3, sparrow_4]
          ensemble: chorus
          text: 往筛子里装炉灰！快装满炉灰！
        - id: ch02-b13
          speaker: kind_girl
          text: 反正不能比现在更糟了，我就听你们的。
        - id: ch02-b14
          speaker: narrator
          text: 她跑回厨房，把筛子装满炉灰，再回到井边，把筛子浸进水里。说来也怪，这回提起来，筛中的水竟一滴也没有漏。
        - id: ch02-b15
          speaker: kind_girl
          text: 女主人，筛子拿来了！
          emotion: happy
        - id: ch02-b16
          speaker: mistress
          text: 你比我想的聪明。要不然，就是有个精通魔法的人在帮你。
        - id: ch02-b17
          speaker: narrator
          text: 姑娘知道小鸟帮助了自己，却一声不响。女主人盯了她一会儿，也没有再追问。此后许多天，姑娘仍像平常一样认真做活。终于，女主人又把她叫到面前。
        - id: ch02-b18
          speaker: mistress
          text: 这里有一绞黑纱和一绞白纱。拿到河里洗，让黑的变白，白的变黑。
        - id: ch02-b19
          speaker: narrator
          text: 姑娘把两绞纱拿到河边，用力洗了好几个钟头。可无论怎么搓洗，黑纱还是黑纱，白纱还是白纱，颜色一点也没变。她觉得这件事比筛水更难，眼泪也掉了下来，正要绝望地放弃。忽然，空中传来急促的振翅声，河岸边每根白桦树枝上都落了一只麻雀。
        - id: ch02-b20
          speakers: [sparrow_1, sparrow_2, sparrow_3, sparrow_4]
          ensemble: chorus
          text: 黑的朝东，白的朝西！
        - id: ch02-b21
          speaker: narrator
          text: 姑娘擦掉眼泪，又鼓起勇气。她拿起黑纱，面朝东方站好，把纱浸进水里。转眼间，黑纱白得像雪。她再转向西方，把白纱浸入河中，纱立刻黑得像乌鸦的翅膀。她回头朝麻雀微笑点头，麻雀也拍着翅膀回应，随后飞快地离开了。
        - id: ch02-b22
          speaker: narrator
          text: 女主人看见两绞变了颜色的纱，惊得一句话也说不出来。她好不容易找回声音，追问是哪位魔法师相助，竟能做成从来没人做成的事。姑娘怕给小小的朋友们惹来麻烦，仍旧没有回答。接连几个星期，女主人把自己关在房里，姑娘则照常做活。她以为难题总算结束了，可一天，女主人忽然走进厨房。
        - id: ch02-b23
          speaker: mistress
          text: 还有最后一关。把你洗过的纱织成布，要像国王的衣袍一样光滑，太阳落山前就得织完。只要成功，以后我就不再难为你。
        - id: ch02-b24
          speaker: narrator
          text: 姑娘心想，这一定是所有差事里最容易的一件，因为她本来很会纺织。可真正坐到织机前，她才发现纱线不断打结，手指每碰一下，线就会断开。
        - id: ch02-b25
          speaker: kind_girl
          text: 我怎么也做不成了！
          emotion: sad
        - id: ch02-b26
          speaker: narrator
          text: 她伏在织机上哭起来。门忽然开了，猫儿排着队走进来。
        - id: ch02-b27
          speakers: [cat_1, cat_2, cat_3, cat_4]
          ensemble: chorus
          text: 美丽的姑娘，你怎么了？
        - id: ch02-b28
          speaker: kind_girl
          text: 女主人要我日落前把这些纱织成布。可纱线一碰就断，我连开头都没织成。
          emotion: sad
        - id: ch02-b29
          speakers: [cat_1, cat_2, cat_3, cat_4]
          ensemble: chorus
          text: 只是这件事吗？擦干眼泪吧，我们来替你织。
          emotion: calm
        - id: ch02-b30
          speaker: narrator
          text: 猫儿一齐跳上织机，又快又巧地织起来。没过多久，整匹布就织好了，细腻光滑，不输任何一位国王穿过的衣料。姑娘看见它，欢喜极了。猫儿像来时一样排队离开，她在每只猫的额头上都亲了一下。女主人拿到布，用手来回摸了两三遍，竟找不到一点粗糙的地方。
        - id: ch02-b31
          speaker: mistress
          text: 是谁教给你这样的智慧？
        - id: ch02-b32
          speaker: narrator
          text: 姑娘只笑了笑。她很早就懂得沉默的用处。
    - id: ch03
      title: 小黑匣里的光
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 又过了几个星期，一年的工期满了。女主人叫来姑娘，告诉她现在已经自由，可以回家。不过姑娘这一年服侍得实在太好，女主人也舍不得她，很希望她能留下。听见这番话，姑娘轻轻摇了摇头。
        - id: ch03-b02
          speaker: kind_girl
          text: 太太，我在这里过得很快乐，谢谢您一直善待我。可是家里还有继母和她的女儿，我想回去同她们生活。
        - id: ch03-b03
          speaker: mistress
          text: 那就照你的心意吧。你忠心为我做事，我也该给你酬劳。阁楼里有许多匣子，挑一只最喜欢的。记住，放到你想让它长久安放的地方以后，才能打开。
        - id: ch03-b04
          speaker: narrator
          text: 姑娘刚走出房间，猫儿们便已经在外面等她。它们照例排成一队，陪她进了阁楼。那里摆满了大匣子、小匣子，有的朴素，有的华丽。姑娘拿起一只看了看，又放下它，去端详另一只更美的。黄的、蓝的、红的、绿的、金的、银的，看得她迟迟拿不定主意，从这一只走到那一只。
        - id: ch03-b05
          speakers: [cat_1, cat_2, cat_3, cat_4]
          ensemble: chorus
          text: 拿黑的！拿黑的！
        - id: ch03-b06
          speaker: narrator
          text: 姑娘四下寻找，终于在被忽略的角落里发现一只又小又黑的匣子。
        - id: ch03-b07
          speaker: kind_girl
          text: 女主人，这只最合我的心意。
        - id: ch03-b08
          speaker: narrator
          text: 女主人笑着点头，让她带着匣子上路。姑娘先去向母牛、猫儿和麻雀一一道别。大家说再见时都流下了眼泪。她走啊，走啊，不停地走，一直回到鲜花盛开的草地。忽然间，不知发生了什么，连她自己也说不清，等她回过神来，人已经坐在继母家院子的井沿上。
        - id: ch03-b09
          speaker: narrator
          text: 她走进屋里，继母和亲生女儿看得像石头一样僵住了。过了好一会儿，继母才喘过气来。
        - id: ch03-b10
          speaker: stepmother
          text: 原来你还活着！我的运气怎么总是这么坏？这一年你去了哪里？
          emotion: surprised
        - id: ch03-b11
          speaker: narrator
          text: 姑娘便把这一年的经历告诉她们。她说自己在地下世界做工，工期满了，不但领到工钱，还带回了一只小匣子。她希望把匣子摆在自己的房间里。
        - id: ch03-b12
          speaker: stepmother
          text: 钱给我！那只难看的小盒子，拿到外屋去！
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: 姑娘被继母凶狠的样子吓坏了。她把珍贵的匣子紧紧抱在胸前，连忙离开。自从她掉进井里，外屋便再没人进去，里面脏得不成样子。姑娘一处一处刷洗，又把地面彻底扫净。等一切重新变得整洁，她才把小匣子放到角落的一块小搁板上。
        - id: ch03-b14
          speaker: kind_girl
          text: 现在可以打开了。
        - id: ch03-b15
          speaker: narrator
          text: 她取下挂在提手上的钥匙，打开了锁。盖子一掀，耀眼的光芒猛然迸出，几乎晃瞎她的眼睛，惊得她退了一步。谁能想到，小小的黑匣里竟装着那么多珍宝！戒指、王冠、腰带、项链，全都镶满奇异的宝石，闪耀得叫人无法直视。继母、她的女儿和四邻全都闻声跑来，还以为房子着了火。
        - id: ch03-b16
          speaker: narrator
          text: 继母眼看着满匣珠宝，又贪婪又嫉妒，难受得几乎病倒。她恨不得立刻把所有珠宝全抢来据为己有。可是邻人有多喜爱她的继女，就有多厌恶她。她害怕激怒众人，只能把贪念暂时忍住。既然不能明抢，她便打算照样再弄来一匣，说不定还会比这只更加值钱。
    - id: ch04
      title: 同一条路
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 继母叫亲生女儿坐上井沿，照扔继女时的样子，也把她推了下去。井底仍是那片鲜花盛开的田野。亲生女儿沿另一个姑娘走过的路一步步前行，看见了同样的一切，可两人的相同之处也到这里为止。
        - id: ch04-b02
          speaker: narrator
          text: 老篱笆求她别伤害自己，她却粗鲁地大笑，还拔掉几根木桩，好让自己更容易跨过去。烤炉请她吃面包，她不但不领情，反把白面包撒了一地，用脚一只只踩烂。她挤了母牛的奶，喝到满足以后，把剩下的全泼在草上，还一脚将奶桶踢得粉碎。
        - id: ch04-b03
          speakers: [fence, oven, cow]
          ensemble: chorus
          text: 你这样对待我们，绝不会没有报应！
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: 姑娘一句也没听见。傍晚，她来到守门老妇身边，连招呼也不打就往前走。
        - id: ch04-b05
          speaker: gate_woman
          text: 你们那里的人都不懂礼貌吗？
        - id: ch04-b06
          speaker: cruel_girl
          text: 我忙得很，没空跟你说话。天快黑了，我还得找个做工的地方。
        - id: ch04-b07
          speaker: gate_woman
          text: 留下替我梳一会儿头吧，我会帮你找个去处。
        - id: ch04-b08
          speaker: cruel_girl
          text: 还替你梳头？我有的是比这要紧的事！
          emotion: disgusted
        - id: ch04-b09
          speaker: narrator
          text: 她猛地关上大门，差点撞到老妇人的脸，然后扬长而去。
        - id: ch04-b10
          speaker: gate_woman
          text: 你这样对待我，绝不会没有报应！
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: 姑娘到了农庄，也受雇照料母牛、筛选谷粒。可她只在有人盯着时才肯干活。没人看着，牛棚便又脏又乱。母牛吃不饱，还常挨她的打，于是不是踢翻奶桶，就是用角顶她。农庄里人人都说，从没见过这样瘦的牛，也没见过这样差的奶。
        - id: ch04-b12
          speaker: narrator
          text: 她看见猫儿就赶，还动手欺负它们，害得猫连追赶老鼠的精神也没有了。耗子从此到处乱窜。麻雀飞来讨一点谷子，待遇也没有比牛和猫更好。姑娘脱下鞋，一只接一只砸过去，把小鸟吓得飞进树林，躲到树木之间。
        - id: ch04-b13
          speaker: narrator
          text: 几个月过去，女主人把她叫来。
        - id: ch04-b14
          speaker: mistress
          text: 我交给你的活儿，你没有一样做好。不过我再给你一次机会。你不会养牛，也不会筛谷子，兴许别的事能做好。拿筛子去盛满井水，回来时一滴也不许漏。
        - id: ch04-b15
          speaker: narrator
          text: 姑娘把筛子浸进井里两三次，可没有小鸟来帮助她。最后，她只得拿着空筛子回来。
        - id: ch04-b16
          speaker: mistress
          text: 我早就猜到了。一件事做不好，件件事都做不好。
          emotion: angry
        - id: ch04-b17
          speaker: narrator
          text: 女主人或许以为她会吸取教训，可她完全想错了，姑娘做活还是一样糟。后来，女主人把黑白两绞纱交给她，命她拿到河里洗，要让黑纱变白、白纱变黑。可这次没有谁告诉她其中的秘密，她只好把两绞纱原样带回。女主人阴沉地看着她，她却还在自鸣得意，根本不在乎别人怎样看待自己。
        - id: ch04-b18
          speaker: narrator
          text: 几个星期后，第三道考验来了。女主人把那些纱交给她，命她像先前那个姑娘一样，把纱织成细布。可这次没有一队猫儿走进房间，也没有谁跳上织机帮忙。太阳落山时，她交给女主人的，只是一大团肮脏纠结的毛线。
        - id: ch04-b19
          speaker: mistress
          text: 看来，这世上没有一件事是你会做的。
        - id: ch04-b20
          speaker: narrator
          text: 女主人说完便离开了，只把姑娘一个人留在那里。
    - id: ch05
      title: 大红匣里的火
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 这样的日子又过了一阵。一年工期一满，姑娘便主动去见女主人，告诉她自己不愿再待下去，想要回家。
        - id: ch05-b02
          speaker: mistress
          text: 我一点也不想留你，因为你没有一件事做得合规矩。不过我还是给你一点报酬。去阁楼挑一只匣子。记住，放到想让它长久安放的地方以后，才能打开。
        - id: ch05-b03
          speaker: narrator
          text: 姑娘等的正是这句话。她高兴得连停下来道谢也顾不上，飞快跑进阁楼。蓝的、红的、绿的、黄的、银的、金的匣子摆满四周。角落里，还站着一只小黑匣，和另一个姑娘带回家的那只一模一样。
        - id: ch05-b04
          speaker: cruel_girl
          text: 那么小的黑匣都装了许多珠宝，这只大红匣装的一定有两倍多。
        - id: ch05-b05
          speaker: narrator
          text: 她一把抓起那只大红匣，抱在怀里便踏上回家的路。她满心想着匣子里的珠宝，甚至没有回去向女主人告别。
        - id: ch05-b06
          speaker: cruel_girl
          text: 妈妈，快看我带回了什么！
          emotion: happy
        - id: ch05-b07
          speaker: stepmother
          text: 啊，这可比那只小黑盒气派多了！
          emotion: happy
        - id: ch05-b08
          speaker: narrator
          text: 姑娘顾不上理会母亲，忙着给匣子寻找最合适的位置。她一会儿把它放在这里，一会儿又挪到那里。
        - id: ch05-b09
          speaker: cruel_girl
          text: 这里最好看。不，还是放那边。不行，这么漂亮的匣子不该待在厨房里，我们把它摆进客房吧。
        - id: ch05-b10
          speaker: narrator
          text: 母女俩得意扬扬地把匣子抬上楼，放到客房壁炉上方的搁板。她们取下拴在提手上的钥匙，迫不及待地打开匣子。和先前一样，盖子刚一掀开，一道强光便跃了出来。可那不是珠宝的光，而是灼热的火焰。烈火沿着墙壁四处飞窜，很快把小屋和屋里的一切全烧光了，母女俩也葬身其中。
        - id: ch05-b11
          speaker: narrator
          text: 邻人们看见火光，像继女回家那天一样，全都赶来看个究竟。可这一次，他们来得太迟了。整座家园只剩鸡舍还立在那里。善良的继女虽然已经有了满匣财富，却仍住在那座鸡舍里，从此幸福地度过余生。
