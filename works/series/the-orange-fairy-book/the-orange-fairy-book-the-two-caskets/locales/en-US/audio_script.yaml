  chapters:
    - id: ch01
      title: Down the Well
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Far away, in the heart of a pine forest, lived a woman with her daughter and stepdaughter. From the day her own child was born, the mother gave her everything she cried for. The girl grew up as cross and unpleasant as she was ugly. The stepdaughter's childhood was very different. She worked hard and kept house for her father, who died soon after his second marriage. She was beautiful, kind, and hardworking, and all the neighbors loved her for it."
        - id: ch01-b02
          speaker: narrator
          text: "As the girls grew older, the difference between them became clearer and clearer. The woman treated her stepdaughter worse each year. She was always watching for an excuse to beat the girl or take away her food, and even the silliest reason would do. One day, when she could think of nothing better, she made both girls sit on the low wall of the well and spin."
        - id: ch01-b03
          speaker: stepmother
          text: "Mind what you're doing. Whichever one of you breaks her thread first will be thrown straight to the bottom."
        - id: ch01-b04
          speaker: narrator
          text: "The mother had made sure her own daughter's flax was fine and strong. She gave her stepdaughter coarse stuff that no one would normally use. Before long, the poor girl's thread snapped. The woman had been watching from behind a door. She rushed out, seized the girl by the shoulders, and threw her into the well."
        - id: ch01-b05
          speaker: stepmother
          text: "There. That's the end of you!"
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: "But the woman was wrong. It was only the beginning. Down and down the girl fell. It seemed that the well must reach to the very middle of the earth. At last, her feet touched ground. She found herself in a field more beautiful than even the summer pastures of her own mountains. Trees stirred in a soft breeze, and flowers of the brightest colors danced in the grass. Though she was quite alone, the girl's heart danced too. She had not felt so happy since her father died."
        - id: ch01-b07
          speaker: narrator
          text: "She walked on through the meadow until she came to a broken old fence. It was so ancient that she wondered how it managed to stand at all. A climbing plant called old man's beard grew over it, as though the plant itself were holding the fence up. The girl paused and looked for a place where she could cross without causing damage. Before she could move, the fence spoke."
        - id: ch01-b08
          speaker: fence
          text: "Please don't hurt me, little maiden. I'm so very old, and I haven't much longer to live."
        - id: ch01-b09
          speaker: kind_girl
          text: "I won't hurt you. You don't need to be afraid."
        - id: ch01-b10
          speaker: narrator
          text: "She saw one place where the clematis grew less thickly than elsewhere. There she jumped lightly over without disturbing the fence."
        - id: ch01-b11
          speaker: fence
          text: "May everything go well with you."
        - id: ch01-b12
          speaker: narrator
          text: "Beyond the meadow, a path ran between two flowering hedges. An oven stood beside it with its door open and a pile of white loaves inside."
        - id: ch01-b13
          speaker: oven
          text: "Eat as many loaves as you like, little maiden. Only please don't harm me."
        - id: ch01-b14
          speaker: kind_girl
          text: "Don't be afraid. I never hurt anything. And thank you for giving me such a lovely white loaf."
        - id: ch01-b15
          speaker: narrator
          text: "The girl ate the beautiful white loaf right down to the final crumb. Then she carefully shut the oven door and wished the oven good morning before walking on."
        - id: ch01-b16
          speaker: oven
          text: "May everything go well with you."
        - id: ch01-b17
          speaker: narrator
          text: "Later, the girl grew very thirsty. She saw a cow with a milk pail hanging from one horn and went toward her."
        - id: ch01-b18
          speaker: cow
          text: "Milk me and drink all you want, little maiden. But don't spill any on the ground, and please don't harm me. I've never harmed anyone."
        - id: ch01-b19
          speaker: kind_girl
          text: "Neither have I. You have nothing to fear from me."
        - id: ch01-b20
          speaker: narrator
          text: "The girl sat down beside the cow and milked until the pail was nearly full. Then she drank the fresh milk and left only one little drop at the bottom."
        - id: ch01-b21
          speaker: cow
          text: "Pour what remains over my hoofs, then hang the pail back on my horn."
        - id: ch01-b22
          speaker: narrator
          text: "The girl did exactly that. She kissed the cow on the forehead and continued on her way."
    - id: ch02
      title: A Place at the Farm
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Many hours had passed since the girl fell into the well, and now the sun was setting. She began to wonder where she could spend the night. Just then, she saw a gate ahead that she had not noticed before. A very old woman was leaning against it."
        - id: ch02-b02
          speaker: kind_girl
          text: "Good evening."
        - id: ch02-b03
          speaker: old_woman
          text: "Good evening, child. I wish everyone were as polite as you. Are you looking for something?"
        - id: ch02-b04
          speaker: kind_girl
          text: "I'm looking for a place to work."
        - id: ch02-b05
          speaker: old_woman
          text: "Then stay a while and comb my hair. While you do, you can tell me everything you know how to do."
        - id: ch02-b06
          speaker: kind_girl
          text: "Gladly, mother."
        - id: ch02-b07
          speaker: narrator
          text: "The girl began to comb out the old woman's hair, which was long and white. She worked patiently for half an hour. Then the woman spoke again."
        - id: ch02-b08
          speaker: old_woman
          text: "You didn't think yourself too important to comb my hair, so I'll show you where you can find work. Be patient and sensible, and all will go well."
        - id: ch02-b09
          speaker: narrator
          text: "The girl thanked her and went to a nearby farm, where she was hired to milk the cows and sift the corn. At first light the next morning, she entered the cow house and patted every cow in turn."
        - id: ch02-b10
          speaker: kind_girl
          text: "You must all be hungry."
        - id: ch02-b11
          speaker: narrator
          text: "She brought hay from the barn. While the cows ate, she swept the cow house and spread clean straw on the floor. The cows liked her gentle care. They stood quietly for milking and played none of the tricks they had played on rough, rude dairymaids. When she finished, she found a whole circle of cats around her, black and white, tabby and tortoiseshell. They all called together."
        - id: ch02-b12
          speakers: [cat_1, cat_2, cat_3, cat_4]
          ensemble: chorus
          text: "We're very thirsty. Please give us some milk!"
        - id: ch02-b13
          speaker: kind_girl
          text: "You poor little pussies. Of course you may have some."
        - id: ch02-b14
          speaker: narrator
          text: "All the cats followed her into the dairy. She set out a little red saucer for each one and filled every saucer with milk. Before they drank, the cats rubbed themselves against her knees and purred to thank her."
        - id: ch02-b15
          speaker: narrator
          text: "Next she went to the storehouse to sift corn. As she rubbed the grain through the sieve, wings whirred at the window. A flock of sparrows flew inside."
        - id: ch02-b16
          speakers: [sparrow_1, sparrow_2, sparrow_3]
          ensemble: chorus
          text: "We're hungry! Please give us some corn!"
        - id: ch02-b17
          speaker: kind_girl
          text: "You poor little birds. Of course you may have some."
        - id: ch02-b18
          speaker: narrator
          text: "She took a fine handful of corn and scattered it across the storehouse floor. The sparrows ate every grain. When they had finished, they flew onto her shoulders and fluttered their wings to thank her."
    - id: ch03
      title: Three Impossible Tasks
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Time passed, and the results of the girl's good work showed everywhere. No cows in the whole countryside were as fat or as well cared for as hers. No other dairy had so much milk to show. The farmer's wife was delighted. She raised the girl's wages and began treating her like her own daughter. At last, one day, she called the girl into the kitchen."
        - id: ch03-b02
          speaker: old_woman
          text: "I know you can tend cows and keep a dairy. Now I want to see what else you can do. Take this sieve to the well. Fill it with water, and bring it home without spilling one drop."
        - id: ch03-b03
          speaker: narrator
          text: "The girl's heart sank when she heard that order. How could anyone possibly carry water in a sieve? Still, she did not complain. She took the sieve down to the well, leaned over the side, and filled it to the brim. The moment she lifted it, all the water streamed through the holes. She filled it again and again, but not one drop would remain. At last, she was turning away in despair when a flock of sparrows flew down from the sky."
        - id: ch03-b04
          speakers: [sparrow_1, sparrow_2, sparrow_3]
          ensemble: chorus
          text: "Ashes! Use ashes!"
        - id: ch03-b05
          speaker: kind_girl
          text: "Things can't get any worse, so I'll take your advice."
        - id: ch03-b06
          speaker: narrator
          text: "She hurried back to the kitchen and packed the sieve with ashes. Then she returned to the well and dipped it into the water once more. To her wonder, the ashes had stopped the holes. This time, not one drop disappeared. She lifted the full sieve and carried it to the room where the old woman sat."
        - id: ch03-b07
          speaker: kind_girl
          text: "Here is the sieve, mistress."
        - id: ch03-b08
          speaker: old_woman
          text: "You're cleverer than I expected. Unless, of course, someone skilled in magic helped you."
        - id: ch03-b09
          speaker: narrator
          text: "The girl kept silent, and the old woman asked nothing more. Many days went by. Then the mistress called her again and showed her two skeins of yarn, one white and one black."
        - id: ch03-b10
          speaker: old_woman
          text: "Wash these in the river until the black yarn turns white and the white yarn turns black."
        - id: ch03-b11
          speaker: narrator
          text: "The girl carried both skeins to the river. For several hours, she washed and rubbed as hard as she could, but neither one changed in the least. She thought this task was even worse than the sieve. She was ready to give up in despair when she heard a rush of wings through the air. Sparrows filled the birch trees along the bank, with a bird perched on every twig."
        - id: ch03-b12
          speakers: [sparrow_1, sparrow_2, sparrow_3]
          ensemble: chorus
          text: "Hold the black to the east! Hold the white to the west!"
        - id: ch03-b13
          speaker: narrator
          text: "The girl dried her tears and found her courage again. She picked up the black yarn, turned to face the east, and dipped it into the river. In an instant, it became white as snow. Then she turned to the west and held the white yarn beneath the water. It changed at once, becoming black as a crow's wing. She looked back at the sparrows with a smile and a nod. They fluttered their wings in answer and flew swiftly away."
        - id: ch03-b14
          speaker: narrator
          text: "The old woman was speechless when she saw the yarn. At last, she demanded to know what magician had done what no one else could do. The girl gave no answer. She was afraid her little friends might suffer if she told."
        - id: ch03-b15
          speaker: narrator
          text: "For many weeks after that, the mistress shut herself away in her room. The girl went on with her usual work and hoped she had seen the end of these impossible tasks. But she was mistaken. One day, the old woman suddenly appeared in the kitchen. She had brought the two skeins the girl had washed."
        - id: ch03-b16
          speaker: old_woman
          text: "I have one last test for you. Pass it, and I'll leave you in peace forever. Weave this yarn into cloth as smooth as a king's robe, and finish it before sunset."
        - id: ch03-b17
          speaker: narrator
          text: "The girl knew she was a good spinner, so at first she thought this would be the easiest task of all. But when she sat down at the loom and began to work, the yarn tangled and snapped at every touch. She tried and tried, while the hours passed and sunset came closer. At last, she rested her head against the loom and wept."
        - id: ch03-b18
          speaker: kind_girl
          text: "Oh, I'll never finish it!"
          emotion: sad
        - id: ch03-b19
          speaker: narrator
          text: "At that moment, the door opened. The cats entered in a procession, one behind another."
        - id: ch03-b20
          speakers: [cat_1, cat_2, cat_3, cat_4]
          ensemble: chorus
          text: "What's troubling you, fair maiden?"
        - id: ch03-b21
          speaker: kind_girl
          text: "My mistress says I must weave this yarn into cloth before sunset. I haven't even started because it breaks every time I touch it."
        - id: ch03-b22
          speakers: [cat_1, cat_2, cat_3, cat_4]
          ensemble: chorus
          text: "Then dry your eyes. We'll take care of it for you."
        - id: ch03-b23
          speaker: narrator
          text: "The cats sprang onto the loom and set to work. Their paws moved so quickly and so skillfully that in a very short time the whole piece of cloth was finished. It was smooth and fine enough for any king to wear. The girl could hardly contain her delight. She kissed every cat on the forehead, and they filed out one behind another, just as they had entered."
        - id: ch03-b24
          speaker: old_woman
          text: "Who taught you to do this?"
        - id: ch03-b25
          speaker: narrator
          text: "The old woman passed her hands over the cloth two or three times. She searched everywhere but could not find a single rough place. The girl only smiled and would not tell her who had helped. She had learned when she was young how valuable silence could be."
    - id: ch04
      title: The Little Black Casket
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "A few weeks later, the old woman sent for her maid. The girl's year of service was over, so she was free to go home. The old woman said she had served so well that she hoped the girl would stay. But the girl gently shook her head."
        - id: ch04-b02
          speaker: kind_girl
          text: "I've been happy here, madam, and I'm grateful for your kindness. But my stepmother and stepsister are still at home, and I want to be with them again."
        - id: ch04-b03
          speaker: narrator
          text: "The old woman studied her for a moment before answering."
        - id: ch04-b04
          speaker: old_woman
          text: "Then you must do as you wish. You have worked faithfully, so I will reward you. In the loft above the storehouse, you'll find many caskets. Choose whichever one pleases you. But don't open it until you've put it where you want it to remain."
        - id: ch04-b05
          speaker: narrator
          text: "As soon as she stepped outside, she found all the cats waiting for her. They formed their usual procession and followed her into the loft. The room was filled with caskets, large and small, plain and splendid. The girl lifted one and looked it over, then set it down to examine another that was even more beautiful. Should she choose yellow or blue? Red or green? Gold or silver? She hesitated for a long time, walking from one box to another. Then the cats began to call."
        - id: ch04-b06
          speakers: [cat_1, cat_2, cat_3, cat_4]
          ensemble: chorus
          text: "Take the black one! Take the black one!"
        - id: ch04-b07
          speaker: narrator
          text: "Their words made the girl look all around. She had not seen any black casket among the splendid boxes. But the cats kept calling, so she bent down and searched the dark corners she had overlooked. At last, she discovered a little black box. It was so small and so black that anyone could easily have passed it by. She picked it up and carried it into the house."
        - id: ch04-b08
          speaker: kind_girl
          text: "This is the casket I like best, mistress."
        - id: ch04-b09
          speaker: narrator
          text: "The old woman smiled, nodded, and sent her on her way. The girl said farewell to the cows, cats, and sparrows. They all wept as they said goodbye. Then she walked on and on until she reached the flowered meadow. Something happened there, though she never knew what. Suddenly, she was sitting on the well wall in her stepmother's yard. She rose and went inside."
        - id: ch04-b10
          speaker: narrator
          text: "The woman and her daughter stared as if they had turned to stone. At last, the stepmother managed to speak."
        - id: ch04-b11
          speaker: stepmother
          text: "So you're alive after all! Luck never favors me. Where have you been for this whole year?"
          emotion: surprised
        - id: ch04-b12
          speaker: narrator
          text: "The girl told them she had worked in the world beneath the well. Besides her wages, she had brought home a little casket, and she wanted to place it in her room."
        - id: ch04-b13
          speaker: stepmother
          text: "Give me the money, and take that ugly little box out to the shed!"
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: "The stepmother's fury frightened the girl. Holding the precious box tightly against her chest, she hurried out to the shed. No one had gone near the place since the day she fell down the well, and dirt lay everywhere. The girl set to work as she always did. She scrubbed and swept until the whole room was clean again. Only then did she place the little casket on a small shelf in the corner."
        - id: ch04-b15
          speaker: kind_girl
          text: "Now I can open it."
        - id: ch04-b16
          speaker: narrator
          text: "She untied the key from the handle and raised the lid. A burst of light almost blinded her. Who could have guessed that such a little black box held so many beautiful things? It was filled with rings, crowns, belts, and necklaces, all set with marvelous stones. They shone so brightly that the stepmother, her daughter, and everyone nearby came running because they thought the house was burning."
        - id: ch04-b17
          speaker: narrator
          text: "The woman grew sick with greed and envy at the sight of so much treasure. She would certainly have taken the casket and every jewel inside it, but she feared the neighbors. They loved her stepdaughter as much as they hated her. If she could not steal this box, though, she could get another one for herself, and perhaps the next would be richer still. So she made her own daughter sit on the edge of the well. Then she threw the girl into the water exactly as she had thrown the other one. And exactly as before, the flowered meadow waited at the bottom."
    - id: ch05
      title: The Same Road, a Different Heart
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "The second girl followed every step of her stepsister's path through the meadow. She saw the very same things her stepsister had seen, in the very same places. But that was where the likeness ended. When the old fence begged her not to cause harm, she laughed rudely. Instead of searching for a safe crossing, she tore out several stakes so she could climb through more easily."
        - id: ch05-b02
          speaker: fence
          text: "You won't do this to me without paying for it."
        - id: ch05-b03
          speaker: narrator
          text: "The girl never heard. When the oven offered her bread, she scattered the loaves on the ground and stamped on them."
        - id: ch05-b04
          speaker: oven
          text: "You won't do this to me without paying for it."
        - id: ch05-b05
          speaker: narrator
          text: "She did not hear that warning either. She milked the cow and drank as much as she wanted. Then she poured the rest onto the grass, kicked the pail to pieces, and walked away."
        - id: ch05-b06
          speaker: cow
          text: "You won't do this to me without paying for it."
        - id: ch05-b07
          speaker: narrator
          text: "Toward evening, she reached the gate where the old woman leaned against a post. She walked straight past without a word."
        - id: ch05-b08
          speaker: old_woman
          text: "Does no one in your country have manners?"
        - id: ch05-b09
          speaker: bad_girl
          text: "I don't have time to talk. It's getting late, and I need to find work."
        - id: ch05-b10
          speaker: old_woman
          text: "Stop and comb my hair for a while. Then I'll help you find a place."
        - id: ch05-b11
          speaker: bad_girl
          text: "Comb your hair? I have far better things to do!"
        - id: ch05-b12
          speaker: narrator
          text: "She slammed the gate in the old woman's face and went on. She never heard the words that followed her."
        - id: ch05-b13
          speaker: old_woman
          text: "You won't do this to me without paying for it."
        - id: ch05-b14
          speaker: narrator
          text: "In time, the girl reached the farm. Like her stepsister, she was hired to care for the cows and sift the corn. But she worked only when someone watched. At other times, the cow house stayed dirty. She left the cows hungry and beat them, so they kicked over the pail and tried to butt her. Everyone said they had never seen cows so thin or milk so poor."
        - id: ch05-b15
          speaker: narrator
          text: "She chased and mistreated the cats until they had no spirit left to hunt. Rats and mice now ran everywhere. When the sparrows begged for corn, she threw her shoes at them. The frightened birds flew into the woods and hid among the trees."
        - id: ch05-b16
          speaker: narrator
          text: "Months passed this way. One day, the mistress summoned the girl."
        - id: ch05-b17
          speaker: old_woman
          text: "You've done every task badly. Even so, I'll give you another chance. You may be better at something besides tending cows and separating grain from chaff. Take this sieve to the well, fill it with water, and bring it back without losing a drop."
        - id: ch05-b18
          speaker: narrator
          text: "The girl carried the sieve to the well. No birds came to help her. She dipped it into the water two or three times, then returned with it empty."
        - id: ch05-b19
          speaker: old_woman
          text: "Just as I thought. If you're useless at one thing, you're useless at another."
          emotion: angry
        - id: ch05-b20
          speaker: narrator
          text: "Perhaps the mistress thought the girl would learn from this, but her work did not improve. Later, the old woman gave her the black and white yarn to wash in the river. No one told her how to make the black turn white and the white turn black, so she brought them back unchanged. The old woman gave her a grim look. The girl was far too pleased with herself to care."
        - id: ch05-b21
          speaker: narrator
          text: "Several weeks later came the third trial. Once again, the girl went to the loom. The mistress gave her the yarn to weave, just as she had done with the stepsister. But no procession of cats entered the room to help her. At sunset, the girl carried back only an armful of dirty, tangled wool."
        - id: ch05-b22
          speaker: old_woman
          text: "It seems there is nothing in the world you can do."
        - id: ch05-b23
          speaker: narrator
          text: "Then the old woman left her alone."
    - id: ch06
      title: The Great Red Casket
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "Soon the year ended, and the girl told her mistress that she wanted to go home."
        - id: ch06-b02
          speaker: old_woman
          text: "I have little wish to keep you. You haven't done one thing properly. Still, I'll give you some payment. Go to the loft and choose one of the caskets. But don't open it until you've placed it where you want it to stay."
        - id: ch06-b03
          speaker: narrator
          text: "This was exactly what the girl had hoped for. She was so delighted that she did not even thank the old woman. She ran to the loft. There stood caskets of blue, red, green, and yellow, of silver and gold. In the corner was a little black one just like her stepsister's."
        - id: ch06-b04
          speaker: bad_girl
          text: "If that tiny black box held so many jewels, this big red one must hold twice as many."
        - id: ch06-b05
          speaker: narrator
          text: "She snatched up the large red casket and started home without even saying farewell to her mistress. When she entered the cottage, she held the box in both hands and cried out to her mother."
        - id: ch06-b06
          speaker: bad_girl
          text: "Look, Mother! Look what I've brought home!"
          emotion: happy
        - id: ch06-b07
          speaker: stepmother
          text: "Ah, you've brought back something very different from that miserable little black box!"
          emotion: happy
        - id: ch06-b08
          speaker: narrator
          text: "But the girl was too busy choosing a place for the casket to pay much attention. She set it on one piece of furniture, then another."
        - id: ch06-b09
          speaker: bad_girl
          text: "It will look best here. No, over here. No, it's much too fine for the kitchen. Let's put it in the guest room."
        - id: ch06-b10
          speaker: narrator
          text: "Mother and daughter proudly carried the casket upstairs and placed it on a shelf above the fireplace. They untied the key from the handle and opened the box. Just as before, a bright light leaped out. But this light did not come from shining jewels. Hot flames burst from the casket, raced along the walls, and burned the cottage and everything inside it. The mother and daughter burned with it."
        - id: ch06-b11
          speaker: narrator
          text: "The neighbors came running, just as they had when the stepdaughter opened her box. This time, they were too late. Only the henhouse remained. And despite all her riches, the stepdaughter lived there happily for the rest of her days."
        - id: ch06-b12
          speaker: narrator
          text: "This story comes from Thorpe's Yule-Tide Stories."
