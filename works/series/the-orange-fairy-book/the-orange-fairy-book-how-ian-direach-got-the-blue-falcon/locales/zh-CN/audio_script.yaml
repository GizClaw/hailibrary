audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    ian_direach:
      display_name: 伊恩·迪里奇
      tts:
        delivery: 勇敢坦率，历险中带着少年的执着
        timbre: 清朗坚实
        pace: 适中明快
        pitch: 中
    stepmother:
      display_name: 继母
      tts:
        delivery: 冷酷阴沉，下咒时尖厉狠毒
        timbre: 冷硬锐利
        pace: 缓慢而逼迫
        pitch: 中高
    fox:
      display_name: 狐狸吉勒·马尔坦
      tts:
        delivery: 机敏圆滑，遇险时从容周旋
        timbre: 清亮柔和
        pace: 轻快灵活
        pitch: 中高
    giant:
      display_name: 五头巨人
      tts:
        delivery: 威严粗暴，说话简短直接
        timbre: 浑厚低沉
        pace: 沉缓
        pitch: 低
    big_woman_1:
      display_name: 大巨女
      tts:
        delivery: 强横响亮，兴奋时毫不收敛
        timbre: 粗壮洪亮
        pace: 适中
        pitch: 中低
    big_woman_2:
      display_name: 二巨女
      tts:
        delivery: 粗豪直率，随姐妹一同发号施令
        timbre: 厚实响亮
        pace: 适中
        pitch: 中
    big_woman_3:
      display_name: 三巨女
      tts:
        delivery: 强势爽快，合声时节奏鲜明
        timbre: 明亮有力
        pace: 稍快
        pitch: 中
    big_woman_4:
      display_name: 小巨女
      tts:
        delivery: 爽利强硬，带年轻而响亮的声气
        timbre: 清脆有力
        pace: 稍快
        pitch: 中高
    king_of_erin:
      display_name: 爱尔兰国王
      tts:
        delivery: 自负威严，见到公主时殷勤热切
        timbre: 饱满庄重
        pace: 适中
        pitch: 中低
    princess:
      display_name: 法兰西公主
      tts:
        delivery: 高贵清醒，受骗后冷峻坚定
        timbre: 清澈端正
        pace: 从容
        pitch: 中高
  chapters:
    - id: ch01
      title: 蓝隼的羽毛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，一位国王和王后统治着西方的群岛。他们只有一个儿子，名叫伊恩·迪里奇，夫妻俩把他看得比什么都珍贵。伊恩渐渐长得高大、强健又英俊，跑步、射箭、游泳、潜水，都胜过国内的同龄少年。他还会驾船，会弹着竖琴唱歌。到了冬夜，众人围在大厅熊熊燃烧的炉火旁，有人削制弓箭，有人纺织布匹，伊恩便给他们讲祖先立下的英勇功业。
        - id: ch01-b02
          speaker: narrator
          text: 岁月就这样过去。照当时的说法，伊恩快要长成男子汉了，母亲却在这时去世。群岛上下无不哀悼，他和父亲更是悲痛万分。可是新年还没到，国王就另娶了一位妻子，仿佛已经忘了故去的王后。只有伊恩没有忘记。
        - id: ch01-b03
          speaker: narrator
          text: 山谷里的树叶泛黄了。一天早晨，伊恩带上弓箭去山里打猎，却连一只鸟也没见到。后来，一只蓝隼从面前飞过。他举弓瞄准，目光很准，手也很稳，可蓝隼飞得太快，箭只射落她翅上的一根羽毛。太阳已经低垂在海面上，伊恩收好羽毛，转身回家。
        - id: ch01-b04
          speaker: stepmother
          text: 今天带回来多少猎物？
        - id: ch01-b05
          speaker: ian_direach
          text: 什么也没有，只有这个。
        - id: ch01-b06
          speaker: narrator
          text: 伊恩递过蓝隼的羽毛。继母捏住羽尖，默默看了一阵，转身对他说话。
        - id: ch01-b07
          speaker: stepmother
          text: 我以十字架、咒语和岁暮的名义诅咒你！从今以后，你会受冻，会浑身湿透、满身污泥，鞋里永远积着水。除非你把长出这根羽毛的蓝隼带回来！
          emotion: angry
        - id: ch01-b08
          speaker: ian_direach
          text: 你会下咒，我也会。你要一只脚踏在大宅上，另一只脚踏在城堡上，一直站到我回来。风从哪里刮来，你的脸就得朝向哪里。
        - id: ch01-b09
          speaker: narrator
          text: 伊恩依照继母的命令，出发寻找蓝隼。他从山坡回头望去，王后果然一脚踩着大宅，一脚踩着城堡。暴风从哪边袭来，她的脸便转向哪边。
        - id: ch01-b10
          speaker: narrator
          text: 伊恩继续赶路，翻过一座座山，又涉过一条条河，最后走到辽阔的平原，却始终没看见蓝隼。天越来越黑，小鸟都在寻找归巢。他再也看不清路，只好躺在灌木下面，很快沉入梦乡。梦里，一只柔软的鼻子碰了碰他，一团暖和的身子蜷在身边，一个低低的声音贴着耳旁响起。
        - id: ch01-b11
          speaker: fox
          text: 你的运气不大好啊，伊恩·迪里奇。我只有一块羊腮肉和一只羊蹄给你，你就将就着吃吧。
        - id: ch01-b12
          speaker: narrator
          text: 话音刚落，伊恩便醒了过来，眼前正是狐狸吉勒·马尔坦。他们一起生起火，把那块羊腮肉和羊蹄当作晚饭。吃完以后，狐狸叫伊恩仍旧躺下，一觉睡到天明。第二天早晨，伊恩醒来，狐狸才告诉他蓝隼的下落。
        - id: ch01-b13
          speaker: fox
          text: 蓝隼养在五头、五颈、五驼峰巨人手里。我会告诉你怎么去。到了巨人家，他吩咐什么，你都要麻利、欢喜地做好，尤其要善待鸟儿。等他放心把蓝隼交给你照料，就趁他不在，用布蒙住蓝隼，把她抱走。千万别让一根羽毛碰到屋里的东西，不然就会遭殃。
        - id: ch01-b14
          speaker: ian_direach
          text: 谢谢你指点我。我一定照你的话做，处处小心。
        - id: ch01-b15
          speaker: narrator
          text: 伊恩来到巨人的屋前，重重敲门。
        - id: ch01-b16
          speaker: giant
          text: 谁在外面？
        - id: ch01-b17
          speaker: ian_direach
          text: 我想来做工，当你的仆人。
        - id: ch01-b18
          speaker: giant
          text: 你会干些什么？
        - id: ch01-b19
          speaker: ian_direach
          text: 我会喂鸟、养猪，会喂牛、挤牛奶。山羊和绵羊，我也会照料。
        - id: ch01-b20
          speaker: giant
          text: 那就进来吧。我正缺你这样的人。
        - id: ch01-b21
          speaker: narrator
          text: 伊恩住进巨人的屋子，把所有飞禽走兽都照顾得周周到到，巨人从来没有这样满意过。过了一阵，巨人觉得连蓝隼也可以放心交给他。伊恩心中欢喜，更加用心地喂养她，直到蓝隼的一身羽毛亮得像天空。巨人看了十分高兴。一天，他对伊恩说起出门的打算。
        - id: ch01-b22
          speaker: giant
          text: 山那边的兄弟们请我很久了。我一直放心不下蓝隼，才没去看他们。现在我能把她托给你一天，我会在天黑以前回来。
        - id: ch01-b23
          speaker: narrator
          text: 第二天早晨，巨人的身影刚消失，伊恩就抓住蓝隼，用布蒙住她的头，抱着她匆匆奔向门外。可阳光穿透了厚布，蓝隼经过门柱时猛地一挣，一根羽毛的尖端碰到了柱子。门柱立刻尖叫起来，把巨人引了回来。他只跨三步就站到伊恩面前。伊恩一见他便吓得发抖，巨人却没有立刻惩罚他，只开出一个条件。
        - id: ch01-b24
          speaker: giant
          text: 想要我的蓝隼，就先把迪乌拉岛七巨女家里的光明白剑带来。
        - id: ch01-b25
          speaker: ian_direach
          text: 她们住在哪里？
        - id: ch01-b26
          speaker: giant
          text: 那就要靠你自己去找了。
    - id: ch02
      title: 光明白剑
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 伊恩不敢多问，赶到荒野上去。狐狸果然在那里等他，叫他先吃过晚饭，再躺下睡觉。第二天早晨，狐狸领他来到海边。茫茫大海横在眼前，迪乌拉岛坐落在海水中央，伊恩的心顿时沉了下去。他问狐狸为什么把自己带到这里。巨人明明知道，没有一条船，他根本不可能找到岛上的巨女。
        - id: ch02-b02
          speaker: fox
          text: 别灰心，这很容易！我会变成一条船，载你渡海。你对七巨女说，自己很会擦亮金银。她们会收你做仆人。只要让她们满意，她们就会把光明白剑交给你擦。等你偷走宝剑时，千万别让剑鞘碰到屋里的东西。
        - id: ch02-b03
          speaker: narrator
          text: 伊恩事事照狐狸说的去做。迪乌拉岛的七巨女果然收下他做仆人。整整六个星期，他每天辛勤干活，把屋里的金银和其他东西全都擦得闪闪发亮。七个女主人凑在一起，都说从来没有见过这么能干的仆人。
        - id: ch02-b04
          speakers: [big_woman_1, big_woman_2, big_woman_3, big_woman_4]
          ensemble: chorus
          text: 从来没有哪个仆人有这样的本领。把光明白剑也交给他擦吧！
        - id: ch02-b05
          speaker: narrator
          text: 她们从铁柜中取出挂在里面的光明白剑，命伊恩把剑身擦亮，直到能从上面照见自己的脸。伊恩照办了。一天，七巨女都出去了，他觉得带走宝剑的机会终于来了，便把剑插回鞘中，扛到肩上。可他经过门口时，剑鞘尖端擦到了门。那扇门发出刺耳的尖叫，巨女们听见声音，立刻跑回来，夺下宝剑。
        - id: ch02-b06
          speakers: [big_woman_1, big_woman_2, big_woman_3, big_woman_4]
          ensemble: chorus
          text: 想要我们的宝剑，就先把爱尔兰国王的枣红马驹带来。
        - id: ch02-b07
          speaker: narrator
          text: 伊恩没能守住狐狸的告诫，心中又羞又愧。他低着头离开巨女们的屋子，独自走到海边坐下。不久，狐狸吉勒·马尔坦又来到他面前。
        - id: ch02-b08
          speaker: fox
          text: 我一看就知道，你没把我的话放在心上，伊恩·迪里奇。不过先吃饭吧，我再帮你一次。
        - id: ch02-b09
          speaker: narrator
          text: 听见狐狸还肯帮忙，伊恩心里又有了希望。他拾来树枝，生起火，和狐狸一起吃过晚饭，随后睡在沙滩上。第二天黎明，吉勒·马尔坦把新的计划告诉了他。
        - id: ch02-b10
          speaker: fox
          text: 我会变成一艘船，载你去爱尔兰。你到国王的马厩做工，把马匹照料好。等他把枣红马驹交给你，你就带她逃走。经过宫门时，除了四只蹄子的底面，千万别让她碰到任何东西。
        - id: ch02-b11
          speaker: narrator
          text: 狐狸化作一艘船，扬帆把伊恩送到爱尔兰。那里的国王把所有马匹都交给他照管。伊恩照料得十分用心，那些马的皮毛从来没有这样光亮，奔跑起来也从来没有这样迅捷。国王十分满意。整整一个月以后，他才把伊恩召到面前。
        - id: ch02-b12
          speaker: king_of_erin
          text: 你一直尽心为我做事。现在，我要把王国里最珍贵的东西托付给你。
        - id: ch02-b13
          speaker: narrator
          text: 说完，国王领他走进枣红马驹所在的马厩。伊恩替马驹擦洗，给她喂食，又骑着她跑遍全国。他们跑得越来越快，到后来，马驹能把身后的一阵风远远甩下，再追上前面的另一阵风。
        - id: ch02-b14
          speaker: king_of_erin
          text: 我要去打猎。鹿群已经从山上下来了，该去追赶它们了。
        - id: ch02-b15
          speaker: narrator
          text: 国王一走远，伊恩便牵出马驹，跃上她的背。可他们经过宫门时，马驹的尾巴扫到了门柱。门柱大声尖叫。国王转眼就奔回来，抓住了缰绳。
        - id: ch02-b16
          speaker: king_of_erin
          text: 想要我的枣红马驹，就先把法兰西国王的女儿带给我。
    - id: ch03
      title: 法兰西公主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 伊恩脚步沉重地走到海岸，狐狸正在那里等他。
        - id: ch03-b02
          speaker: fox
          text: 我一看就知道，你还是没照我的话做，恐怕以后也做不到。不过我再帮你一次。我第三次变成船，咱们去法兰西。
        - id: ch03-b03
          speaker: narrator
          text: 他们扬帆驶到法兰西。狐狸既然就是那艘船，自然想往哪里走就往哪里走。他把自己冲进岩石的裂缝，高高搁在岸上，随后让伊恩去王宫谎称遭遇海难。伊恩要说船卡在岩石里，满船的人只有他一个活了下来。
        - id: ch03-b04
          speaker: narrator
          text: 伊恩听从狐狸的安排，把海难讲得凄惨万分。国王、王后和他们的女儿公主都出来听他诉说。听完以后，他们什么也顾不得，一心要到海边亲眼看看那艘船。此时潮水已经上涨，船重新浮了起来。她处处破损，遍体伤痕，像是真的闯过重重险难，船舱里却不断传出无比美妙的音乐。
        - id: ch03-b05
          speaker: princess
          text: 把小船划来。我要亲眼看看，究竟是哪张竖琴奏出了这样的音乐。
        - id: ch03-b06
          speaker: narrator
          text: 小船送来后，伊恩登上去，划到大船旁边。他特意绕到远离岸边的一侧，让岸上的人全都看不见。扶公主登上大船时，他把小船往外一推，让她再也回不到船上。音乐听起来越来越甜美，两人从船头找到船尾，却始终找不到声音从哪里传来。等他们终于走上甲板，陆地早已消失，四周只有奔腾的海水。
        - id: ch03-b07
          speaker: narrator
          text: 公主站在甲板上，一句话也没有说。她望着四周无边的海水，脸色越来越阴沉。沉默了许久，她才转向伊恩，开口质问。
        - id: ch03-b08
          speaker: princess
          text: 你好狠的手段！你究竟做了什么？要带我去哪里？
          emotion: angry
        - id: ch03-b09
          speaker: ian_direach
          text: 你会成为王后。爱尔兰国王派我来接你，他会用枣红马驹作为回报。我得拿马驹向七巨女换光明白剑，再用宝剑向五头巨人换蓝隼。我答应把蓝隼交给继母，好让她解除我的诅咒。
        - id: ch03-b10
          speaker: princess
          text: 我倒宁愿做你的妻子。
        - id: ch03-b11
          speaker: narrator
          text: 过了一阵，船驶进爱尔兰海岸的一处港湾，在那里抛下锚。狐狸让伊恩告诉公主，请她暂时待在礁石间的洞穴里，因为他们到岸上还有事情要办，办完就会回来。两人随后划着小船靠近礁石。刚一登岸，狐狸立刻变成一位美丽的女子，笑着对伊恩说话。
        - id: ch03-b12
          speaker: fox
          text: 我会送给国王一位好妻子。
        - id: ch03-b13
          speaker: narrator
          text: 爱尔兰国王原本正在山上打猎。他看见一艘陌生的船驶进港口，猜到也许是伊恩回来了，便丢下狩猎，飞快跑进马厩。他匆匆把枣红马驹牵出栏位，在她背上放好金鞍，头上套好银辔，手里牵着缰绳，赶去迎接公主。
        - id: ch03-b14
          speaker: ian_direach
          text: 我把法兰西国王的女儿带来了。
        - id: ch03-b15
          speaker: narrator
          text: 国王打量着那位姑娘，心里满意极了，完全不知道她是狐狸吉勒·马尔坦变的。他深深鞠了一躬，恳请她赏光进入王宫。狐狸走进去时，又回头看了伊恩一眼，笑了起来。来到宽阔的大厅，国王停下脚步，指向角落里的一只铁箱。
        - id: ch03-b16
          speaker: king_of_erin
          text: 箱子里有一顶等候你多年的王冠。如今你终于来取它了。
        - id: ch03-b17
          speaker: narrator
          text: 国王俯身去开铁箱的锁。就在这一瞬，狐狸猛地扑到他背上，狠狠咬了一口。国王当场昏倒在地。狐狸立刻恢复原形，冲出王宫，一路飞奔回到海岸。伊恩、公主和枣红马驹都在那里等他。
    - id: ch04
      title: 狐狸的妙计
      blocks:
        - id: ch04-b01
          speaker: fox
          text: 我会变成一艘船，你们全都上来。
        - id: ch04-b02
          speaker: narrator
          text: 狐狸果然化作船。伊恩把枣红马驹牵上去，公主跟在他们后面登船。船扬帆驶向迪乌拉岛，海风一直从身后推着他们前行。没过多久，岛上的一片片岩石便出现在眼前。
        - id: ch04-b03
          speaker: fox
          text: 让马驹和公主藏在岩石间。我会变成马驹，跟你去七巨女的屋子。
        - id: ch04-b04
          speaker: narrator
          text: 七巨女看见伊恩牵着枣红马驹来到门前，个个满心欢喜。最小的巨女立刻取来光明白剑，亲手交给伊恩。伊恩从假马驹身上卸下金鞍，又摘下银辔，带着宝剑走下山坡，回到公主和真正的枣红马驹等候的地方。
        - id: ch04-b05
          speakers: [big_woman_1, big_woman_2, big_woman_3, big_woman_4]
          ensemble: chorus
          text: 这下可以痛痛快快骑一回了！
          emotion: happy
        - id: ch04-b06
          speaker: narrator
          text: 七巨女给假马驹装好金鞍和银辔。大姐先跨上马鞍，二妹坐在大姐背上，三妹又坐到二妹背上。其余姐妹一个接一个，七个人就这样一层层叠坐起来。等大家坐稳，大姐挥鞭抽向马驹身侧。马驹猛地冲向前方，飞过荒原，又绕着群山一圈圈疾驰。巨女们紧紧抓住彼此，兴奋得直哼哼。
        - id: ch04-b07
          speaker: narrator
          text: 最后，马驹高高跃到空中，落在高山莫纳的山顶，那里正有一道悬崖。她把两只前蹄抵住岩石，后腿猛地向上一扬。七巨女全被甩下悬崖，落到底下时已经死了。马驹哈哈一笑，重新变成狐狸，飞奔回到海边。伊恩、公主、真正的枣红马驹和光明白剑都在那里等他。
        - id: ch04-b08
          speaker: fox
          text: 我再变成一艘船，把你们和马驹、宝剑一起送回大陆。
        - id: ch04-b09
          speaker: narrator
          text: 船抵达岸边，狐狸恢复原形，又告诉伊恩下一步该怎么做。
        - id: ch04-b10
          speaker: fox
          text: 让公主、马驹和真正的光明白剑留在岩石间。我会变成那把宝剑，你带我去见巨人，他就会拿蓝隼来换。
        - id: ch04-b11
          speaker: narrator
          text: 伊恩照狐狸的吩咐，把同伴变成的白剑带往巨人的城堡。巨人远远看见光明白剑灿烂的光辉，心中大喜。他把蓝隼放进一只篮子，交给伊恩。伊恩提着篮子，飞快离开城堡，回到公主、枣红马驹和真正的光明白剑等候的地方。
        - id: ch04-b12
          speaker: narrator
          text: 巨人终于得到渴望多年的宝剑，高兴得不得了，立刻挥舞起来，在空中又劈又砍。起初，狐狸由着巨人拿自己这样玩耍。过了一会儿，他忽然在巨人手中一转，利刃割断五条脖颈，五颗脑袋全滚落到地上。狐狸随后恢复原形，回到伊恩身边。
        - id: ch04-b13
          speaker: fox
          text: 给马驹装上金鞍和银辔，把装着蓝隼的篮子背在肩头，再握住光明白剑，让剑背贴紧鼻子。你骑上马驹，叫公主坐在身后，就这样回父亲的王宫。剑背一刻也不能离开鼻子，否则继母一见你，就会把你变成一捆干柴。照我的话做，变成柴捆的就会是她。
    - id: ch05
      title: 伊恩的归来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 伊恩完全听从狐狸的指点。他给马驹装好鞍辔，背着蓝隼，握住剑背贴在鼻尖的光明白剑，让公主坐在身后，就这样回到父亲的王宫。继母一见他，便在他面前倒下，变成一捆木柴。伊恩点火把她烧掉，从此永远摆脱了她的诅咒。
        - id: ch05-b02
          speaker: narrator
          text: 后来，伊恩和公主成了婚。她是西方群岛上最贤惠的妻子。从此再没有什么能伤害伊恩。他有一匹枣红马驹，能把身后的一阵风甩下，再追上前面的另一阵风。他有一只蓝隼，会替他捕来充饥的猎物。他还有光明白剑，能刺穿迎面的仇敌。
        - id: ch05-b03
          speaker: narrator
          text: 伊恩知道，这一切都要归功于狐狸吉勒·马尔坦。他和狐狸立下约定。狐狸饿了，随时可以从他的牲畜中挑选一头。从今往后，也绝不会有人向狐狸或狐狸的同类射箭。
        - id: ch05-b04
          speaker: narrator
          text: 可吉勒·马尔坦并不肯收下任何酬劳。他帮助伊恩做了这么多，到头来只愿要伊恩的友谊。此后伊恩事事顺遂，直到离开人世。
        - id: ch05-b05
          speaker: narrator
          text: 这个故事选自《西部高地故事集》。
