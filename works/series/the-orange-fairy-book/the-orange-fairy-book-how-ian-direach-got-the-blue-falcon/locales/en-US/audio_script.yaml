        pace: "measured"
        pitch: "medium-low"
    big_woman_2:
      display_name: Second Big Woman
      tts:
        delivery: "brisk and self-assured"
        timbre: "full and clear"
        pace: "lively"
        pitch: "medium"
    big_woman_3:
      display_name: Third Big Woman
      tts:
        delivery: "bold and eager"
        timbre: "bright and sturdy"
        pace: "lively"
        pitch: "medium-high"
    big_woman_4:
      display_name: Fourth Big Woman
      tts:
        delivery: "blunt and exuberant"
        timbre: "husky and strong"
        pace: "measured"
        pitch: "medium-low"
