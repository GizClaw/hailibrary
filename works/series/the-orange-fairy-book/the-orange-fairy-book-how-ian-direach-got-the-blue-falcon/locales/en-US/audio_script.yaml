      display_name: King of Erin
      tts:
        delivery: "regal, satisfied, and possessive"
        timbre: "rich and mature"
        pace: "measured"
        pitch: "medium-low"
    princess:
      display_name: Princess of France
      tts:
        delivery: "clear-minded, dignified, and direct"
        timbre: "bright and poised"
        pace: "measured"
        pitch: "medium-high"
  chapters:
    - id: ch01
      title: The Feather and the Spell
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Long ago, a king and queen ruled the islands of the west. Their only son was Ian Direach, and they loved him dearly. He grew tall, strong, and handsome. No lad his age could match him at running, shooting, swimming, or diving. He could sail a boat and sing to the harp. On winter evenings, while the household gathered around the great hall fire to shape bows and weave cloth, Ian told stories of his forefathers' deeds."
        - id: ch01-b02
          speaker: narrator
          text: "The years passed until Ian was nearly a man, as people reckoned manhood in those days. Then his mother died. All the islands mourned, and Ian and his father grieved bitterly. Yet before the new year, the king married again and seemed to forget his first wife. Ian alone remembered her."
        - id: ch01-b03
          speaker: narrator
          text: "One autumn morning, when the leaves in the glen had turned yellow, Ian took his bow and filled his quiver. He climbed the hill to hunt, but he saw no game anywhere. At last a blue falcon swept past him. Ian drew his bow and aimed. His eye was true and his hand was steady, but the bird flew too swiftly. His arrow struck only one feather from her wing. The sun was already sinking over the sea, so Ian slipped the feather into his game bag and started home."
        - id: ch01-b04
          speaker: stepmother
          text: "Did you bring me plenty of game today?"
        - id: ch01-b05
          speaker: ian_direach
          text: "Nothing but this feather."
        - id: ch01-b06
          speaker: narrator
          text: "His stepmother held the blue feather by its tip and stared at it without a word. Then she turned upon Ian."
        - id: ch01-b07
          speaker: stepmother
          text: "I lay crosses and spells upon you, as surely as the year must fall. You will stay cold, wet, and filthy, with pools forever standing in your shoes, until you bring me the blue falcon that wore this feather."
          emotion: angry
        - id: ch01-b08
          speaker: ian_direach
          text: "If you can lay spells, then so can I. Until I return, you shall stand with one foot on the great house and one on the castle. Your face must turn into the wind, no matter where the storm blows from."
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: "Ian left to find the bird, as his stepmother had commanded. When he looked back from the hill, the queen was already standing with one foot on the great house and the other on the castle. Her face turned toward every tempest that blew."
        - id: ch01-b10
          speaker: narrator
          text: "He crossed hills and waded through rivers, but never saw the falcon. Darkness gathered. The little birds settled into their nests, and soon Ian could see nothing at all. He lay beneath some bushes and fell asleep. In his dream, a soft nose touched him. A warm body curled beside him, and a low voice spoke."
        - id: ch01-b11
          speaker: gille_mairtean
          text: "Fortune has turned against you, Ian Direach. I have only a sheep's cheek and hoof to offer, so we must be content with those."
        - id: ch01-b12
          speaker: narrator
          text: "Ian woke and saw Gille Mairtean the fox. Together they lit a fire and ate their supper. Then the fox told Ian to lie down again and sleep until morning."
        - id: ch01-b13
          speaker: gille_mairtean
          text: "The falcon you seek belongs to the Giant of the Five Heads, the Five Necks, and the Five Humps. I will show you his house. Do whatever he asks, quickly and cheerfully. Most of all, be kind to his birds. Then he may trust you to care for the falcon. When he leaves the house, cover her with a cloth and carry her away. But not one feather must touch anything inside that house, or trouble will follow."
        - id: ch01-b14
          speaker: ian_direach
          text: "Thank you for warning me. I will follow every word carefully."
        - id: ch01-b15
          speaker: narrator
          text: "With that, Ian took the path to the giant's house."
    - id: ch02
      title: The Giant's Blue Falcon
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Ian knocked hard on the giant's door. A great voice thundered from within."
        - id: ch02-b02
          speaker: giant
          text: "Who is out there?"
        - id: ch02-b03
          speaker: ian_direach
          text: "A man looking for work as a servant."
        - id: ch02-b04
          speaker: giant
          text: "And what work can you do?"
        - id: ch02-b05
          speaker: ian_direach
          text: "I can feed birds and tend pigs. I can milk and feed cows, goats, and sheep too, if you keep them."
        - id: ch02-b06
          speaker: giant
          text: "Come in, then. I badly need a servant like you."
        - id: ch02-b07
          speaker: narrator
          text: "Ian entered the house and set to work. He fed the birds, tended the pigs, and cared for every other animal the giant owned. He did it all so faithfully that the giant was more pleased than he had ever been with a servant. In time, he decided Ian could even be trusted with the falcon. Ian's heart leaped. He watched over her with special care until her feathers shone as blue as the sky, and the giant was delighted."
        - id: ch02-b08
          speaker: giant
          text: "My brothers beyond the mountain have begged me to visit them for years. I could never go because I feared for my falcon. Now I can leave her with you for one day. I shall be home before night."
        - id: ch02-b09
          speaker: narrator
          text: "The next morning, the giant had hardly vanished from sight before Ian seized the falcon. He covered her head with a cloth and hurried toward the door. But the sun's rays pierced even that thick covering as he passed the doorpost. The falcon gave a sudden spring, and the tip of one feather brushed the post. The post screamed. The giant heard it and came back in three enormous strides. Ian trembled when he saw him, but the giant said only this."
        - id: ch02-b10
          speaker: giant
          text: "If you want my falcon, first bring me the White Sword of Light from the house of the Big Women of Dhiurradh."
        - id: ch02-b11
          speaker: ian_direach
          text: "Where do the Big Women live?"
        - id: ch02-b12
          speaker: giant
          text: "That is yours to find out."
        - id: ch02-b13
          speaker: narrator
          text: "Ian dared ask nothing more. He hurried down into the empty waste and found Gille Mairtean there, just as he had hoped. The fox gave him supper and told him to sleep. In the morning, they went down to the seashore. Across the water lay the island of Dhiurradh. Ian's courage sank when he saw it. The giant had known very well that he had no boat and could never reach the Big Women."
        - id: ch02-b14
          speaker: gille_mairtean
          text: "Do not lose heart. This is easy enough. I will turn myself into a boat and carry you across the sea to the Seven Big Women of Dhiurradh. Tell them you know how to brighten gold and silver. They will take you as a servant, and if your work pleases them, they will give you the White Sword of Light to polish. When you steal it, be sure the sheath touches nothing inside their house, or trouble will follow."
        - id: ch02-b15
          speaker: narrator
          text: "The fox carried Ian over the sea, and Ian did exactly as he had been told. He offered his skill at polishing silver and gold, and the Seven Big Women hired him. For six weeks, he worked with all his strength. Every piece they gave him came back bright and shining. At last, his seven mistresses spoke together."
        - id: ch02-b16
          speakers: [big_woman_1, big_woman_2, big_woman_3, big_woman_4]
          ensemble: chorus
          text: "No servant has ever made our treasures shine like this. Let him polish the White Sword of Light as well."
        - id: ch02-b17
          speaker: narrator
          text: "They opened the iron closet where the White Sword of Light hung and brought it out to him. They ordered Ian to rub the blade until he could see his own face shining in it, and he did. Then one day, while all seven women were out of the way, Ian knew his chance had come. He slid the sword back into its sheath, hoisted it onto his shoulder, and made for the door. Just as he passed through, the tip of the sheath touched it. The door shrieked aloud. The Big Women heard it, came running back, and snatched the sword away from him."
        - id: ch02-b18
          speakers: [big_woman_1, big_woman_2, big_woman_3, big_woman_4]
          ensemble: chorus
          text: "If you want our sword, first bring us the bay colt that belongs to the King of Erin."
        - id: ch02-b19
          speaker: narrator
          text: "Ian left the house ashamed and humbled. He sat beside the sea until Gille Mairtean came to him."
        - id: ch02-b20
          speaker: gille_mairtean
          text: "I can plainly see that you ignored my warning, Ian Direach. But eat first. I will help you once again."
        - id: ch02-b21
          speaker: narrator
          text: "Hope returned to Ian's heart. He gathered sticks, made a fire, shared supper with the fox, and slept upon the sand."
    - id: ch03
      title: The Bay Colt of Erin
      blocks:
        - id: ch03-b01
          speaker: gille_mairtean
          text: "At dawn, I will become a ship and carry you across the sea to Erin, where the king lives. Offer to work in his stable. Tend his horses until he trusts you to wash and brush the bay colt. When you ride away on her, nothing but the soles of her hoofs must touch anything inside the palace gates, or it will go badly for you."
        - id: ch03-b02
          speaker: narrator
          text: "After giving this warning, the fox changed himself into a ship. Ian went aboard, and Gille Mairtean carried him over the sea to Erin. There Ian offered his service in the royal stable, and the king placed all his horses in Ian's care. Never before had their coats gleamed so brightly. Never before had their pace been so swift. The king was thoroughly pleased, and at the end of a month, he summoned Ian."
        - id: ch03-b03
          speaker: king_of_erin
          text: "You have served me faithfully. Now I will trust you with the most precious thing in my whole kingdom."
        - id: ch03-b04
          speaker: narrator
          text: "When he had spoken, the king led Ian to the stable where the bay colt stood. From then on, Ian rubbed her coat, brought her food, and cared for her as closely as he had cared for the falcon. He galloped her all around the country until she could leave one wind behind and catch the wind ahead."
        - id: ch03-b05
          speaker: narrator
          text: "One morning, the king watched Ian caring for the colt in her stall."
        - id: ch03-b06
          speaker: king_of_erin
          text: "I am leaving to hunt. The deer have come down from the hill, and it is time to chase them."
        - id: ch03-b07
          speaker: narrator
          text: "Once the king was out of sight, Ian led the colt from the stable and sprang onto her back. They rode through the gate between the palace and the world outside. But the colt flicked her tail against the gatepost, and the post gave a piercing shriek. The king came running at once and seized the bridle."
        - id: ch03-b08
          speaker: king_of_erin
          text: "If you want my bay colt, first bring me the daughter of the King of France."
        - id: ch03-b09
          speaker: narrator
          text: "Ian walked slowly down to the shore. Gille Mairtean was waiting for him there."
        - id: ch03-b10
          speaker: gille_mairtean
          text: "I can plainly see that you disobeyed me again, and I doubt you will ever learn. Still, I will help you once more. For the third time, I shall become a ship, and we will sail to France."
        - id: ch03-b11
          speaker: narrator
          text: "For the third time, Gille Mairtean changed himself into a ship, and Ian went aboard. They sailed over the sea to France. Since the fox himself was the vessel, he could steer wherever he pleased. He ran the ship deep into a cleft in the rocks and lodged her high upon the land. Then he told Ian what to do."
        - id: ch03-b12
          speaker: gille_mairtean
          text: "Go to the king's palace. Say that you were shipwrecked, that your vessel is trapped in the rocks, and that you alone survived."
        - id: ch03-b13
          speaker: narrator
          text: "Ian followed the fox's advice and told such a sorrowful tale that the king, the queen, and their daughter all came out to hear him. Once they had listened, nothing would satisfy them but a visit to the ship. The tide had risen by then, and the vessel floated on the water. She looked torn and battered, as though she had passed through many dangers. Yet from somewhere inside came music of marvelous sweetness."
        - id: ch03-b14
          speaker: princess
          text: "Bring me a boat. I want to see the harp that makes such beautiful music."
        - id: ch03-b15
          speaker: narrator
          text: "A boat was brought, and Ian rowed the princess toward the ship. He took her around to the far side, where no one on shore could see them. When he had helped her aboard, he pushed the little boat away so she could not return to it. The music grew sweeter and sweeter. They searched every part of the vessel, but never found where it came from. At last they reached the deck and looked around. The land had vanished. Nothing surrounded them but rushing water."
        - id: ch03-b16
          speaker: narrator
          text: "The princess stood without speaking, and her face hardened. At last, she turned to Ian."
        - id: ch03-b17
          speaker: princess
          text: "You have played a cruel trick on me. What have you done, and where are you taking me?"
          emotion: angry
        - id: ch03-b18
          speaker: ian_direach
          text: "You are to become a queen. The King of Erin sent me to bring you to him, and he will give me his bay colt in return. I must trade that colt to the Seven Big Women of Dhiurradh for the White Sword of Light. Then I must carry the sword to the Giant of the Five Heads, the Five Necks, and the Five Humps. He will give me the blue falcon I promised my stepmother, and she must then release me from her spell."
        - id: ch03-b19
          speaker: princess
          text: "I would rather become your wife."
    - id: ch04
      title: The Princess and the Fox's Trick
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "After a while, the ship entered a harbour on the coast of Erin and dropped anchor. Gille Mairtean told Ian that the princess must wait in a cave among the rocks while they attended to their business on land. They would come back for her later. Ian and the fox rowed ashore. The moment they touched land, Gille Mairtean changed himself into a beautiful woman and laughed."
        - id: ch04-b02
          speaker: gille_mairtean
          text: "I shall make a splendid wife for the king."
        - id: ch04-b03
          speaker: narrator
          text: "The King of Erin had been hunting on the hill. When he saw a strange ship entering the harbour, he guessed Ian might have returned. He abandoned the hunt and hurried down to the stable. He led out the bay colt, placed the golden saddle on her back, and slipped the silver bridle over her head. Holding the bridle, he rushed to meet the princess."
        - id: ch04-b04
          speaker: ian_direach
          text: "I have brought you the daughter of the King of France."
        - id: ch04-b05
          speaker: narrator
          text: "The King of Erin looked at the lovely maiden and was delighted. He had no idea she was Gille Mairtean the fox. The king bowed deeply and begged her to honour him by entering the palace. As Gille Mairtean went inside, he glanced back at Ian and laughed."
        - id: ch04-b06
          speaker: narrator
          text: "In the great hall, the king stopped beside an iron chest in one corner."
        - id: ch04-b07
          speaker: king_of_erin
          text: "Inside this chest is the crown that has waited many years for you. At last, you have come to claim it."
        - id: ch04-b08
          speaker: narrator
          text: "The king bent to unlock the chest. In that instant, Gille Mairtean sprang onto his back and bit him so fiercely that he fell senseless. The fox quickly took his true shape and raced to the shore. Ian, the princess, and the bay colt were waiting there."
        - id: ch04-b09
          speaker: gille_mairtean
          text: "I will turn into a ship. All of you, come aboard."
        - id: ch04-b10
          speaker: narrator
          text: "The fox became a ship. Ian led the bay colt aboard, the princess followed, and they sailed for Dhiurradh. The wind drove them swiftly from behind, and soon the rocks of the island rose ahead."
        - id: ch04-b11
          speaker: gille_mairtean
          text: "Hide the bay colt and the princess among these rocks. I will take the colt's shape, and you shall lead me to the house of the Seven Big Women."
        - id: ch04-b12
          speaker: narrator
          text: "Ian led the false bay colt up to the house of the Seven Big Women. The sight of her at their door filled them with joy. The youngest sister hurried away, fetched the White Sword of Light, and placed it in Ian's hands. The bargain was made. Ian removed the golden saddle and silver bridle from the false colt and took them with him. Then he carried the sword down the hill to the rocks where the princess and the real colt waited."
        - id: ch04-b13
          speakers: [big_woman_1, big_woman_2, big_woman_3, big_woman_4]
          ensemble: chorus
          text: "At last, we can have the ride we have wanted for so long!"
          emotion: happy
        - id: ch04-b14
          speaker: narrator
          text: "They saddled and bridled the colt. The eldest sister climbed into the saddle. The second sat on the first sister's back, the third sat on the second, and the others piled up in the same way until all seven were mounted. The eldest struck the colt's side with a whip, and away she bounded."
        - id: ch04-b15
          speaker: narrator
          text: "The colt flew over the moors and raced around and around the mountains. Still the seven sisters clung to one another, snorting with pleasure at the speed. At last, she leaped high into the air and came down on top of Monadh, the high hill where the crag stood. She rested her front hoofs against the crag, then threw her hind legs high. All seven women tumbled over the edge. They were dead when they reached the bottom."
        - id: ch04-b16
          speaker: narrator
          text: "The colt laughed, changed back into a fox, and galloped to the shore. Ian, the princess, the real bay colt, and the White Sword of Light were waiting for him."
    - id: ch05
      title: The Sword and the Falcon
      blocks:
        - id: ch05-b01
          speaker: gille_mairtean
          text: "I will become a ship and carry you, the princess, the bay colt, and the White Sword of Light back across the sea."
        - id: ch05-b02
          speaker: narrator
          text: "When they reached the opposite shore, Gille Mairtean returned to his own shape and gave Ian his next instructions."
        - id: ch05-b03
          speaker: gille_mairtean
          text: "Leave the princess, the bay colt, and the White Sword of Light here among the rocks. I will take the sword's likeness. Carry me to the giant, and he will give you the blue falcon in exchange."
        - id: ch05-b04
          speaker: narrator
          text: "Ian obeyed the fox. He left his companions hidden among the rocks, lifted the false sword, and set off alone for the giant's castle. From far away, the giant saw the blaze of what seemed to be the White Sword of Light, and his heart rejoiced. He brought out the blue falcon, placed her safely in a basket, and handed the basket to Ian in exchange for the sword. Ian bore the bird swiftly away, back to the place where the princess, the bay colt, and the real White Sword of Light waited."
        - id: ch05-b05
          speaker: narrator
          text: "The giant had coveted the White Sword of Light for many years, and he was perfectly content with his bargain. The moment Ian was gone, he began to whirl the sword through the air. He cut and slashed with it, trying its edge in every direction. For a little while, Gille Mairtean allowed the giant to play with him this way. Then the false sword turned in the giant's hand and sliced straight through all five necks. One after another, the five heads rolled onto the ground."
        - id: ch05-b06
          speaker: narrator
          text: "Afterward, Gille Mairtean returned to Ian."
        - id: ch05-b07
          speaker: gille_mairtean
          text: "Put the golden saddle on the colt and the silver bridle on her head. Sling the falcon's basket over your shoulders. Hold the White Sword of Light with its back pressed against your nose. Then mount the colt, let the princess sit behind you, and ride to your father's palace. Never let the sword's back leave your nose. If your stepmother sees you without it there, she will turn you into a dry bundle of sticks. But if you do exactly as I say, she will become the bundle instead."
    - id: ch06
      title: Ian Direach Comes Home
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "Ian listened closely to Gille Mairtean. He saddled and bridled the colt, hung the falcon's basket over his shoulders, and kept the back of the sword against his nose. The princess mounted behind him, and they rode to his father's palace."
        - id: ch06-b02
          speaker: narrator
          text: "Ian kept the sword exactly where the fox had told him to hold it. When his stepmother saw him coming, her own spell turned against her. She fell before him as a dry bundle of sticks. Ian set fire to the bundle, and at last he was free. None of her spells could ever trouble him again."
        - id: ch06-b03
          speaker: narrator
          text: "Then Ian married the princess, who became the best wife in all the islands of the west. From that time on, he was safe from harm. He had the bay colt, who could leave one wind behind and catch the next. He had the blue falcon to bring him game. And he had the White Sword of Light to pierce his enemies."
        - id: ch06-b04
          speaker: narrator
          text: "Ian knew that he owed every one of these gifts to Gille Mairtean. He made a pact with the fox. Whenever hunger came upon Gille Mairtean, he might choose any animal from Ian's herds. No arrow would ever again be shot at him or any fox of his race."
        - id: ch06-b05
          speaker: narrator
          text: "But Gille Mairtean would accept no reward for all the help he had given. He wanted only Ian's friendship. And so all things prospered with Ian Direach for the rest of his life."
        - id: ch06-b06
          speaker: narrator
          text: "This tale comes from Tales of the West Highlands."
