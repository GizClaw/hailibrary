audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "steady, vivid folktale storytelling"
        timbre: "warm and resonant"
        pace: "measured"
        pitch: "medium"
    jose:
      display_name: Jose
      tts:
        delivery: "kindhearted, earnest, and quietly brave"
        timbre: "clear and warm"
        pace: "steady"
        pitch: "medium"
    younger_brother:
      display_name: Younger Brother
      tts:
        delivery: "haughty, spiteful, and envious"
        timbre: "thin and sharp"
        pace: "brisk"
        pitch: "medium-high"
    poor_woman:
      display_name: Poor Woman
      tts:
        delivery: "distressed, humble, and sincere"
        timbre: "soft and strained"
        pace: "uneven"
        pitch: "medium"
    king:
      display_name: King
      tts:
        delivery: "grand, calculating, and finally humbled"
        timbre: "rich and weighty"
        pace: "deliberate"
        pitch: "low"
    white_horse:
      display_name: White Horse
      tts:
        delivery: "gentle, wise, and quietly certain"
        timbre: "mellow and airy"
        pace: "unhurried"
        pitch: "medium-low"
    princess_bella_flor:
      display_name: Princess Bella-Flor
      tts:
        delivery: "self-possessed, clever, and resolute"
        timbre: "bright and poised"
        pace: "measured"
        pitch: "medium-high"
  chapters:
    - id: ch01
      title: The Old Wooden Chest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Once upon a time, a man had two sons. When they were grown, the elder son went away to seek his fortune in a distant country. Years passed, and no word came from him. The younger son stayed with their father until the old man died at a great age and left behind a rich estate."
        - id: ch01-b02
          speaker: narrator
          text: "The son at home thought he was the only heir, so he spent his father's money freely. Then one day, as he came downstairs, a stranger walked into the hall and looked around as though he belonged there."
        - id: ch01-b03
          speaker: jose
          text: "Don't you remember me?"
        - id: ch01-b04
          speaker: younger_brother
          text: "How could I remember someone I've never met?"
        - id: ch01-b05
          speaker: jose
          text: "I'm your brother. I came home without the fortune I hoped to make, and now the villagers tell me Father is dead. The lost money means nothing beside losing my last chance to see him."
        - id: ch01-b06
          speaker: younger_brother
          text: "He died six months ago. Your share is the old wooden chest in the loft. Go and find it yourself. I have no more time for you."
        - id: ch01-b07
          speaker: narrator
          text: "With that rude answer, the younger brother went away. The traveler climbed to the loft at the top of the storehouse. There he found a wooden chest so ancient that it looked ready to fall apart."
        - id: ch01-b08
          speaker: jose
          text: "What good is this wreck to me? Well, I can chop it up and make a fire to warm myself. That's better than nothing."
        - id: ch01-b09
          speaker: narrator
          text: "The traveler's name was Jose. He carried the chest back to his inn, borrowed a hatchet, and began chopping. Hidden inside the wood was a secret drawer, and inside the drawer lay a paper. Jose unfolded it. To his amazement, it was a written acknowledgment of a large debt owed to his father. He slipped the precious paper into his pocket, asked the landlord where the debtor lived, and hurried off to find him."
        - id: ch01-b10
          speaker: narrator
          text: "The debtor was an old miser at the far end of the village. For months he had hoped that his written promise had been lost or destroyed. The moment he saw it in Jose's hand, he tried his best to avoid paying. Jose warned that he would take the matter before the king. The miser saw there was no escape. Very unwillingly, he counted out every coin, one by one. Jose gathered them up and returned to the inn, feeling rich at last."
        - id: ch01-b11
          speaker: narrator
          text: "A few weeks later, Jose was walking through the nearest town when he saw a poor woman weeping bitterly. He stopped to ask what troubled her."
        - id: ch01-b12
          speaker: poor_woman
          text: "My husband is dying. And as if that weren't enough, a creditor he can't repay wants to have him sent to prison."
          emotion: sad
        - id: ch01-b13
          speaker: jose
          text: "Take heart. No one will send your husband to prison or sell your belongings. I'll pay what he owes. If he dies, I'll pay for his burial too. Now go home and care for him as well as you can."
        - id: ch01-b14
          speaker: narrator
          text: "The woman did everything she could, but her husband died in spite of her care, and Jose paid to have him buried. All of it cost far more than he expected. When every debt and expense had been settled, only three gold pieces remained."
        - id: ch01-b15
          speaker: jose
          text: "What shall I do now? I think I'll go to court and enter the king's service."
        - id: ch01-b16
          speaker: narrator
          text: "At first, Jose was only a servant. He carried water for the king's bath and made sure the royal bed was arranged exactly as the king liked it. He did every duty so well that the king soon noticed him. Before long, Jose had risen to become a gentleman of the bedchamber."
    - id: ch02
      title: The Jealous Brother's Plot
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "By then, Jose's younger brother had spent every bit of the wealth he inherited. He had no idea how to earn more. Remembering that Jose was now a favorite of the king, he went whining to the palace. He begged the brother he had treated so badly to protect him and find him a position. Jose was always willing to help anyone. He spoke for his brother, and the very next day the young man began work at court."
        - id: ch02-b02
          speaker: narrator
          text: "But the newcomer was spiteful and envious by nature. He could not bear to see anyone luckier than himself. He peered through keyholes and listened behind doors until he discovered the king's secret. Though the king was old and ugly, he had fallen in love with Princess Bella-Flor. She wanted nothing to do with him and had hidden in a mountain castle whose location no one knew."
        - id: ch02-b03
          speaker: younger_brother
          text: "This suits me perfectly. I'll persuade the king that my brother can find her. If Jose comes back without the princess, he'll lose his head. One way or another, he'll be out of my path."
        - id: ch02-b04
          speaker: narrator
          text: "The scoundrel rubbed his hands and hurried to the Lord High Chamberlain. He asked for an audience, saying that he had news of the greatest importance. The king admitted him at once and ordered him to speak quickly."
        - id: ch02-b05
          speaker: younger_brother
          text: "Your Majesty, it's about Princess Bella-Flor..."
        - id: ch02-b06
          speaker: narrator
          text: "He stopped, pretending to be afraid."
        - id: ch02-b07
          speaker: king
          text: "What about Princess Bella-Flor?"
        - id: ch02-b08
          speaker: younger_brother
          text: "People at court are whispering that Your Majesty wishes to learn where she is hiding."
        - id: ch02-b09
          speaker: king
          text: "I would give half my kingdom to whoever brings her to me! Go on, you knave. Did some bird in the sky tell you her secret?"
        - id: ch02-b10
          speaker: younger_brother
          text: "I don't know it, sire, but my brother does. If Your Majesty would only question him..."
        - id: ch02-b11
          speaker: narrator
          text: "Before he could finish, the king struck his scepter against a golden plate hanging on the wall. The crash brought a servant running."
        - id: ch02-b12
          speaker: king
          text: "Bring Jose before me at once!"
        - id: ch02-b13
          speaker: narrator
          text: "Jose entered the hall, wondering what could possibly have happened. By then the king could barely speak for rage and excitement."
        - id: ch02-b14
          speaker: king
          text: "Bring me Princess Bella-Flor this instant! If you come back without her, I will have you drowned!"
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: "The king marched out without another word, leaving Jose frozen with surprise and horror."
        - id: ch02-b16
          speaker: jose
          text: "How can I find Princess Bella-Flor when I've never even seen her? Still, I can't remain here. If I do, they'll only put me to death."
        - id: ch02-b17
          speaker: narrator
          text: "He walked slowly to the stables to choose a horse. Fine animals stood in row after row, with each name written in gold above its stall. Jose looked uncertainly from one to another. Then an old white horse turned its head and beckoned him closer."
        - id: ch02-b18
          speaker: white_horse
          text: "Choose me, and everything will turn out well."
        - id: ch02-b19
          speaker: narrator
          text: "The king's impossible command had left Jose so bewildered that he forgot to be amazed by a talking horse. Almost without thinking, he took the bridle and led the white horse from its stall. Just as he prepared to mount, the horse spoke again."
        - id: ch02-b20
          speaker: white_horse
          text: "Pick up those three loaves you see and put them in your pocket."
        - id: ch02-b21
          speaker: narrator
          text: "Jose obeyed. He was in too great a hurry to ask questions, so he swung into the saddle, and they rode away."
        - id: ch02-b22
          speaker: narrator
          text: "They traveled far without adventure. At last they reached an anthill, and the horse stopped."
        - id: ch02-b23
          speaker: white_horse
          text: "Crumble all three loaves and give them to the ants."
        - id: ch02-b24
          speaker: jose
          text: "But what if we need that bread ourselves?"
        - id: ch02-b25
          speaker: white_horse
          text: "Give it to the ants anyway. Never let a chance to help others pass you by."
        - id: ch02-b26
          speaker: narrator
          text: "Jose scattered the bread in crumbs across the road. Then the horse galloped on."
        - id: ch02-b27
          speaker: narrator
          text: "After a while, they entered a rocky pass between two mountains. An eagle lay there, trapped in a hunter's net."
        - id: ch02-b28
          speaker: white_horse
          text: "Climb down, cut through the net, and free that poor bird."
        - id: ch02-b29
          speaker: jose
          text: "That will take so much time. We may miss the princess."
        - id: ch02-b30
          speaker: white_horse
          text: "Never mind. Don't let a chance to help others pass you by."
        - id: ch02-b31
          speaker: narrator
          text: "Jose cut the meshes and released the eagle. As soon as it was free, the horse galloped on."
        - id: ch02-b32
          speaker: narrator
          text: "Many miles later, they came to a river. A little fish lay on the sand, gasping for water."
        - id: ch02-b33
          speaker: white_horse
          text: "Do you see that little fish? Put it back in the river, or it will die."
        - id: ch02-b34
          speaker: jose
          text: "At this rate, we'll never find Princess Bella-Flor!"
        - id: ch02-b35
          speaker: white_horse
          text: "Time is never wasted when we are helping others."
        - id: ch02-b36
          speaker: narrator
          text: "Jose returned the fish to the river, and soon it was swimming happily away."
    - id: ch03
      title: Princess Bella-Flor
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Not long afterward, they reached a castle in the heart of a very thick wood. Right in front of it stood Princess Bella-Flor, feeding her hens."
        - id: ch03-b02
          speaker: white_horse
          text: "Listen carefully. I'll hop and skip about until the princess is amused. She'll say she'd like a short ride, and you must help her mount. Once she's in the saddle, I'll neigh and kick. Tell her I've never carried a woman and that you need to sit behind her to control me. The moment you're on my back, we'll fly like the wind to the king's palace."
        - id: ch03-b03
          speaker: narrator
          text: "Jose followed every instruction. The horse began its little hops and skips, and the princess was delighted. She asked to ride for a while, just as the horse had said she would. Jose helped her into the saddle. Then the horse neighed and kicked, and Jose explained that it had never carried a woman. He climbed up behind the princess so that he could manage it. At once, the white horse raced away."
        - id: ch03-b04
          speaker: narrator
          text: "Everything happened exactly as the horse had foretold. Princess Bella-Flor did not realize she had been captured until they were galloping breathlessly toward the palace. She said nothing. Instead, she quietly opened the apron that held the bran for her chickens and let it scatter across the ground."
        - id: ch03-b05
          speaker: princess_bella_flor
          text: "Oh, I've dropped all my bran! Please get down and gather it for me."
        - id: ch03-b06
          speaker: jose
          text: "There will be plenty of bran where we're going."
        - id: ch03-b07
          speaker: narrator
          text: "The horse kept galloping. Soon they were passing through a forest. The princess pulled out her handkerchief and tossed it upward. It caught on one of the highest branches of a tree."
        - id: ch03-b08
          speaker: princess_bella_flor
          text: "Oh dear, how foolish of me! My handkerchief has blown away. Would you climb up and fetch it?"
        - id: ch03-b09
          speaker: jose
          text: "There will be plenty of handkerchiefs where we're going."
        - id: ch03-b10
          speaker: narrator
          text: "Still the horse galloped on. Beyond the forest, they came to a river. The princess slipped a ring from her finger and let it roll into the water."
        - id: ch03-b11
          speaker: princess_bella_flor
          text: "How careless I've been! I've lost my favorite ring. Please, please stop for one moment and see if you can find it."
          emotion: sad
        - id: ch03-b12
          speaker: jose
          text: "There will be plenty of rings where we're going."
        - id: ch03-b13
          speaker: narrator
          text: "The horse did not slow down. At last, they passed through the palace gates. The king's heart leaped when he saw his beloved Princess Bella-Flor. But she brushed him aside as though he were a fly. She locked herself in the nearest room and refused to open the door, no matter how much he pleaded."
        - id: ch03-b14
          speaker: princess_bella_flor
          text: "Bring back the three things I lost along the road. Then perhaps I may consider opening this door."
        - id: ch03-b15
          speaker: narrator
          text: "That was all she would say. The king was desperate, so once again he turned to Jose for help."
        - id: ch03-b16
          speaker: king
          text: "I see only one answer. You know where the three things were lost, so you must go and bring them back. If you return without them, I will have you drowned."
        - id: ch03-b17
          speaker: narrator
          text: "Poor Jose was deeply troubled. He had believed that once he brought back the princess, he had done everything the king demanded and his life was safe. There was nothing he could say. He bowed low and went to the stable to seek advice from his friend."
        - id: ch03-b18
          speaker: white_horse
          text: "Don't upset yourself. Climb on, and we'll go search for all three things."
        - id: ch03-b19
          speaker: narrator
          text: "Jose mounted at once, and they set off together."
    - id: ch04
      title: The Three Lost Things
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "They rode until they came to the anthill. There the horse stopped and turned to Jose."
        - id: ch04-b02
          speaker: white_horse
          text: "Would you like to have the bran now?"
        - id: ch04-b03
          speaker: jose
          text: "What good does it do to want it?"
        - id: ch04-b04
          speaker: white_horse
          text: "Call the ants and ask them to gather it for you. If the wind carried some away, tell them to replace it with grains from the bread you gave them."
        - id: ch04-b05
          speaker: narrator
          text: "Jose listened in surprise. He did not have much faith in the plan, but he had no better one. He called to the ants and asked them to collect the bran as quickly as they could. Then he sat beneath a tree to wait while the horse grazed on the green grass."
        - id: ch04-b06
          speaker: white_horse
          text: "Look over there!"
        - id: ch04-b07
          speaker: narrator
          text: "The horse suddenly lifted its head. Jose turned and saw a little mountain of bran. He gathered it into a bag that hung from his saddle."
        - id: ch04-b08
          speaker: white_horse
          text: "Good deeds bear fruit sooner or later. Now mount again. We still have far to go."
        - id: ch04-b09
          speaker: narrator
          text: "When they reached the tree in the forest, the handkerchief still fluttered from its highest branch like a flag. Jose's hopes sank."
        - id: ch04-b10
          speaker: jose
          text: "How can I ever reach that handkerchief? I'd need a ladder all the way to the sky!"
        - id: ch04-b11
          speaker: white_horse
          text: "Don't be afraid. Call the eagle you freed from the net, and he will bring it down."
        - id: ch04-b12
          speaker: narrator
          text: "Jose called. The eagle flew to the top of the tree, took the handkerchief in its beak, and carried it back to him. Jose thanked the bird, vaulted onto the white horse, and rode on toward the river."
        - id: ch04-b13
          speaker: narrator
          text: "Heavy rain had fallen during the night. The river that had been clear before was now dark and churning."
        - id: ch04-b14
          speaker: jose
          text: "How can I bring up a ring from the bottom? I don't know exactly where it fell, and now I can't see into the water at all."
        - id: ch04-b15
          speaker: white_horse
          text: "Don't be afraid. Call the little fish whose life you saved, and she will find it for you."
        - id: ch04-b16
          speaker: narrator
          text: "Jose called to the fish. She dived to the riverbed, slipped behind the large stones, and pushed the smaller ones aside with her tail. At last she found the ring and brought it to Jose in her mouth."
        - id: ch04-b17
          speaker: narrator
          text: "Jose was very pleased with what they had accomplished. With the bran, the handkerchief, and the ring safely in his keeping, he returned to the palace. The king carried all three precious objects to Bella-Flor. Even then, the princess refused to open her door."
        - id: ch04-b18
          speaker: princess_bella_flor
          text: "I will never come out until the bandit who carried me away has been fried in oil."
          emotion: angry
        - id: ch04-b19
          speaker: narrator
          text: "The king went back to Jose."
        - id: ch04-b20
          speaker: king
          text: "I am truly sorry. I would much rather not do this, but you can see that I have no choice."
    - id: ch05
      title: Good Deeds Bear Their Own Fruit
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "A great cauldron of oil was set over the fire to heat. While it grew hotter, Jose hurried to the stables. He asked the white horse whether there was any way to escape the terrible death waiting for him."
        - id: ch05-b02
          speaker: white_horse
          text: "Don't be afraid. Get on my back. I'll gallop until my whole body is wet with sweat. Rub it over your skin, and then, no matter how hot the oil becomes, you won't feel it."
        - id: ch05-b03
          speaker: narrator
          text: "Jose asked no more questions. He mounted and did exactly as the horse told him. When the men came to lower him into the boiling oil, they wondered to see how cheerful he looked. Jose remained in the cauldron until Bella-Flor declared that he must surely be cooked enough."
        - id: ch05-b04
          speaker: princess_bella_flor
          text: "He has been in there long enough. Take him out."
        - id: ch05-b05
          speaker: narrator
          text: "They lifted him from the oil, but he was not burned. Instead, out stepped a youth so young and handsome that everyone who saw him fell in love with him. Princess Bella-Flor loved him most of all."
        - id: ch05-b06
          speaker: narrator
          text: "The old king understood that he had lost. In despair, he threw himself into the cauldron and was fried in Jose's place. Jose was proclaimed king, on the condition that he marry Bella-Flor. He promised that the wedding would take place the very next day."
        - id: ch05-b07
          speaker: narrator
          text: "But before anything else, Jose went to the stables and found the white horse."
        - id: ch05-b08
          speaker: jose
          text: "I owe you my life and my crown. Why have you done so much for me?"
        - id: ch05-b09
          speaker: white_horse
          text: "I am the soul of the unhappy man for whom you spent your whole fortune. When I saw that your life was in danger, I begged to help you, just as you once helped me. Good deeds bear their own fruit."
