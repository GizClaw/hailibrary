audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    young_hunter:
      display_name: 年轻猎人
      tts:
        delivery: 骄傲果断，说话干脆利落
        timbre: 年轻有力
        pace: 明快
        pitch: 中
    old_father:
      display_name: 老父亲
      tts:
        delivery: 饱经风霜，沉着中藏着威严
        timbre: 低沉粗粝
        pace: 舒缓
        pitch: 低
    tired_hunter:
      display_name: 疲惫的猎人
      tts:
        delivery: 朴实直率，带着疲惫
        timbre: 坚实微哑
        pace: 适中
        pitch: 中低
    washerwoman:
      display_name: 洗衣妇人
      tts:
        delivery: 勤劳爽直，心地温厚
        timbre: 成熟清亮
        pace: 从容
        pitch: 中
    first_blind_woman:
      display_name: 先开口的老妇人
      tts:
        delivery: 敏锐果断，语气有主见
        timbre: 苍老清瘦
        pace: 适中
        pitch: 中高
    second_blind_woman:
      display_name: 另一位老妇人
      tts:
        delivery: 直来直去，不肯轻易服软
        timbre: 苍老沙哑
        pace: 适中
        pitch: 中低
    little_son:
      display_name: 小儿子
      tts:
        delivery: 天真雀跃，语气笃定
        timbre: 稚嫩清亮
        pace: 明快
        pitch: 高
  chapters:
    - id: ch01
      title: 大河岸边的肉包
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，美洲西部住着一位老人和他的独生子。那一带到处是森林，林里有数不清的野兽。年轻人常跟伙伴整天打猎，整个部族里，没有谁的猎术比他更好。
        - id: ch01-b02
          speaker: narrator
          text: 冬天将到的一天早晨，年轻人又带着伙伴进了森林。他们要赶在暴风雪以前猎到山羊和鹿，把肉带回去腌好。要是风雪封了森林，几个星期都未必能走得进去。老父亲和年轻人的妻子留在圆锥帐篷里，继续制作弓箭。
        - id: ch01-b03
          speaker: narrator
          text: 林中越来越冷。终于，一个猎人冻得再也迈不开腿。
        - id: ch01-b04
          speaker: tired_hunter
          text: 再不找个法子暖暖身子，我们可走不动了。
        - id: ch01-b05
          speaker: young_hunter
          text: 这有什么难的。
        - id: ch01-b06
          speaker: narrator
          text: 年轻人抬脚踢中一棵大树，树干里立刻冒出了火。大家围着火取暖，等树烧完，身上已经像夏天一样暖和。他们接着赶到猎物最多的地方，很快便猎够了山羊和鹿。年轻人箭法最准，打到的自然最多。
        - id: ch01-b07
          speaker: young_hunter
          text: 来，把猎物割开，各人拿上自己的一份。
        - id: ch01-b08
          speaker: narrator
          text: 大家割开猎物，各人背上自己的一份，排成一列往村子走。到了大河边，年轻人嫌背着沉重的肉包继续赶路太麻烦，索性把它留在岸上。
        - id: ch01-b09
          speaker: young_hunter
          text: 我换条路回去，你们先走吧。
        - id: ch01-b10
          speaker: narrator
          text: 他从另一条路抄近道，很早就回到了村里。老父亲抬头一看，儿子竟然两手空空地进了门。
        - id: ch01-b11
          speaker: old_father
          text: 你今天什么也没猎到吗？
        - id: ch01-b12
          speaker: young_hunter
          text: 我哪次空手回来过？我打到的肉，够咱们吃好多个月亮。肉包太沉，我留在大河边了。箭给我吧，我替你做完，你去把肉背回来。
        - id: ch01-b13
          speaker: narrator
          text: 老人来到河边，把肉捆在肩上。走到浅滩中间，背带突然断了，肉包一下落进水里。他弯腰去捞，水流却把肉包卷了过去。他又伸手一抓，脚下失去平衡，整个人被冲进险滩。急流把他接连撞向岩石，他沉下水底，淹死了。
        - id: ch01-b14
          speaker: narrator
          text: 尸身被水冲到平缓之处，终于又浮出水面。这时，它已经不再像一个人，而是变成了一块木头。
    - id: ch02
      title: 从木板变回来的老人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 木头顺流漂了很远。河道越变越宽，一直流进另一个国度。一名妇人正在岸边洗衣，见木头从身旁经过，便伸手把它拖了上来。她收好洗净的衣物，准备把木板一起带回小屋。
        - id: ch02-b02
          speaker: washerwoman
          text: 这块木板又平又光滑，正好拿来摆饭菜。
        - id: ch02-b03
          speaker: narrator
          text: 她收好衣物，把木板带回小屋。到了晚饭时，她将木板架在屋顶垂下的两根绳子上，再把一锅香喷喷的炖肉摆上去。她忙了一整天，早就饿坏了，拿起最大的一把勺子便往锅里舀。谁知勺子刚伸进去，锅和食物竟全都不见了。
        - id: ch02-b04
          speaker: washerwoman
          text: 可恶的木板！你把晦气带到我家里来了！
          emotion: disgusted
        - id: ch02-b05
          speaker: narrator
          text: 妇人抓起木板，远远扔了出去。食物消失已经叫她吃惊，可接下来发生的事更加奇怪。木板原来待着的地方，现在竟躺着一个婴儿。妇人自己没有孩子，却很喜欢孩子，便决定留下他，好好照料。这个孩子长得快极了，是当地从未有过的奇事。只过四天，他就成了一个高大强壮的男人，丝毫不输部族里的勇士。
        - id: ch02-b06
          speaker: old_father
          text: 你一直好好照顾我，往后你家绝不会缺肉。可我还有许多事情要做，现在该走了。
        - id: ch02-b07
          speaker: narrator
          text: 老人走了许多天，终于回到从前的家。他看见儿子正坐在自己的位置上，心里的怒火一下烧了起来。他想要复仇，便快步走进森林，流下眼泪。每一滴眼泪落地，都变成一只鸟。
        - id: ch02-b08
          speaker: old_father
          text: 先留在这儿，等我来叫你们。
        - id: ch02-b09
          speaker: narrator
          text: 老人回到帐篷，装作什么也没发生。
        - id: ch02-b10
          speaker: old_father
          text: 我刚才看见几只漂亮的新鸟，就停在那边一棵大树的高处。
        - id: ch02-b11
          speaker: young_hunter
          text: 带我去看看。我把它们捉下来，正好做晚饭。
        - id: ch02-b12
          speaker: narrator
          text: 父子俩走了大约半个钟头，老人停在一棵树下。
        - id: ch02-b13
          speaker: old_father
          text: 就是这棵。
        - id: ch02-b14
          speaker: narrator
          text: 儿子开始爬树。可他爬得越高，那些鸟似乎也升得越高。他低头一看，脚下的大地已经只有星星那么大。他还是试着往回爬，却根本下不去。后来连鸟也看不见了，可仍有一股看不见的力量拉着他不断上升。
        - id: ch02-b15
          speaker: narrator
          text: 他仿佛一连爬了好几天，也许真的爬了那么久。忽然，一片美丽的国土出现在树顶之外，金黄的玉米铺满大地。年轻人高兴地跨下树梢，走了进去。
    - id: ch03
      title: 没有黑夜的国度
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 年轻人在玉米地里漫无目的地走着，自己也不知道要往哪里去。这时，耳边传来一阵捶打声。两个失明的老妇人正把食物夹在两块石头之间碾碎。他踮着脚悄悄靠近。一个老妇人把饭递给另一个时，他抢先伸手接过，自己吃掉了。
        - id: ch03-b02
          speaker: first_blind_woman
          text: 那块饼怎么还没揉好？你也太慢了。
        - id: ch03-b03
          speaker: second_blind_woman
          text: 饭早就递给你了，你还等什么？
        - id: ch03-b04
          speaker: first_blind_woman
          text: 哪有？我根本没拿到饭。
        - id: ch03-b05
          speaker: second_blind_woman
          text: 我明明觉得你接过去了。好吧，再给你一些。
        - id: ch03-b06
          speaker: narrator
          text: 年轻人又伸出手，把第二份饭也拿走了。两个老妇人重新争吵起来。等到同样的事发生第三回，她们便起了疑心，明白有人在暗中捣鬼。
        - id: ch03-b07
          speaker: first_blind_woman
          text: 这里一定有个男人。你是不是我的孙子？
        - id: ch03-b08
          speaker: young_hunter
          text: 对，我就是。你请我吃了一顿好饭，我也来试试，能不能治好你们的眼睛。部族里最好的巫医教过我治病。
        - id: ch03-b09
          speaker: narrator
          text: 年轻人想讨她欢心，便出去寻找草药。找到以后，他赶回来，请老妇人烧开一锅水，再把草药丢进去。水一咕嘟作响，他就揭开锅盖，将药水洒在两人的眼睛上。她们马上又能看见了。
        - id: ch03-b10
          speaker: narrator
          text: 这个国度没有黑夜，年轻人不用像在家里那样早早睡觉，便又出去走走。一阵哗啦啦的水声把他引到山谷里。宽阔的河流穿谷而过，鲑鱼正逆着瀑布向上跳，银亮的身体在光中一闪一闪。他真想抓几条那样的大鱼，可该怎么办呢？这里除了两个老妇人，连个人影也没有，她们恐怕也帮不上忙。
        - id: ch03-b11
          speaker: narrator
          text: 他叹着气往回走，忽然想到一个办法。他的头发几乎垂到腰间。他拔下一根，那根头发立刻变成一条结实的长线，足有一英里长。
        - id: ch03-b12
          speaker: young_hunter
          text: 请把这条线织成网吧，我想用它捕鲑鱼。
        - id: ch03-b13
          speaker: narrator
          text: 两个老妇人替他织好网。接下来的许多个星期，他一直守在河边捕鱼，只有想请她们烹鱼时才回来。
    - id: ch04
      title: 穿过天空的篮子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 终于有一天，年轻人正在吃饭。那位总是先开口的老妇人，告诉了他回家的办法。
        - id: ch04-b02
          speaker: first_blind_woman
          text: 孙子，你能来陪我们，我们很高兴。可如今，你该回家了。
        - id: ch04-b03
          speaker: narrator
          text: 她推开一块岩石，下面露出一个深洞，根本望不见底。两个老妇人又拖出一只篮子，在上面牢牢系好绳子。
        - id: ch04-b04
          speakers: [first_blind_woman, second_blind_woman]
          ensemble: duo
          text: 坐进篮子，用这条毯子把头裹好。不管发生什么，没到底以前都不许掀开。
        - id: ch04-b05
          speaker: narrator
          text: 两人向他道别。年轻人蜷起身子坐进篮中，老妇人慢慢放下绳子。篮子一路向下，向下，再向下，仿佛永远也到不了尽头。
        - id: ch04-b06
          speaker: narrator
          text: 篮子终于停下时，他忘了老妇人的嘱咐，探出头想看看怎么回事。篮子顿时又动了起来。更可怕的是，它没有继续向下，反而升了上去。没过多久，两张老妇人的脸又出现在他眼前。
        - id: ch04-b07
          speaker: first_blind_woman
          text: 你再不听话，就永远见不到妻子和儿子了。回到篮子里，听见乌鸦叫以前，一动也别动。
        - id: ch04-b08
          speaker: narrator
          text: 这回年轻人记住了。篮子一次次停下，还有些奇怪的东西像是落在他身上，拉扯那条毯子。他始终抓紧毯子，没有偷看。直到乌鸦的叫声响起，他才掀开毯子，跳出篮子。再抬头时，篮子已经消失在天空里。
    - id: ch05
      title: 从太阳之国回家
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 年轻人沿着通往帐篷的小路快步前行。走着走着，他看见妻子就在前面，背上还背着他们的小儿子。
        - id: ch05-b02
          speaker: little_son
          text: 妈妈快看！爸爸终于回来啦！
          emotion: happy
        - id: ch05-b03
          speaker: narrator
          text: 母亲听了，只叫孩子别说傻话。
        - id: ch05-b04
          speaker: little_son
          text: 我没说傻话，真的是爸爸，他正朝我们走来！
        - id: ch05-b05
          speaker: narrator
          text: 女人为了让孩子死心，终于转过身去。站在面前的，果然是她的丈夫。一家人重新团聚，个个欢喜极了。
        - id: ch05-b06
          speaker: narrator
          text: 从那以后，每当寒风吹过森林，门边堆起厚厚的雪，父亲就把小男孩抱到膝上，讲起自己在太阳之国捕捉鲑鱼的故事。
