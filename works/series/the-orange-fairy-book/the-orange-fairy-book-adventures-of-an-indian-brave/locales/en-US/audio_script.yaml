audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "steady, vivid folktale storytelling"
        timbre: "warm and resonant"
        pace: "measured"
        pitch: "medium"
    young_hunter:
      display_name: Young Hunter
      tts:
        delivery: "bold, proud, and quick-spoken"
        timbre: "strong and youthful"
        pace: "brisk"
        pitch: "medium"
    old_father:
      display_name: Old Father
      tts:
        delivery: "weathered, deliberate, and quietly forceful"
        timbre: "deep and rough"
        pace: "unhurried"
        pitch: "low"
    tired_hunter:
      display_name: Tired Hunter
      tts:
        delivery: "plainspoken and weary"
        timbre: "firm and breathy"
        pace: "measured"
        pitch: "medium-low"
    washerwoman:
      display_name: Washerwoman
      tts:
        delivery: "practical, warmhearted, and expressive"
        timbre: "mature and clear"
        pace: "measured"
        pitch: "medium"
    first_blind_woman:
      display_name: First Blind Woman
      tts:
        delivery: "sharp, suspicious, and commanding"
        timbre: "aged and wiry"
        pace: "measured"
        pitch: "medium-high"
    second_blind_woman:
      display_name: Second Blind Woman
      tts:
        delivery: "sturdy, defensive, and direct"
        timbre: "aged and husky"
        pace: "measured"
        pitch: "medium-low"
    little_son:
      display_name: Little Son
      tts:
        delivery: "bright, eager, and certain"
        timbre: "small and clear"
        pace: "brisk"
        pitch: "high"
  chapters:
    - id: ch01
      title: The Pack by the Great River
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Far away in the west of America, an old man once lived with his only son. Forest covered the country around them, and every kind of wild beast lived among the trees. The young man hunted there all day with his companions. No one in the tribe was a finer hunter."
        - id: ch01-b02
          speaker: narrator
          text: "One morning, with winter drawing near, the young man and his companions went out as usual. They meant to bring home mountain goats and deer and salt the meat before a snowstorm came. Once the wind began to blow and the snow began to drift, the forest might be closed for weeks. The old father and the young man's wife stayed in the wigwam, making bows and arrows."
        - id: ch01-b03
          speaker: narrator
          text: "The cold in the forest grew bitter. At last, one of the hunters could bear it no longer."
        - id: ch01-b04
          speaker: tired_hunter
          text: "We can't keep walking unless we find some way to get warm."
        - id: ch01-b05
          speaker: young_hunter
          text: "That's easy enough."
        - id: ch01-b06
          speaker: narrator
          text: "The young leader kicked a great tree. Flames burst from its trunk. Before the tree had burned away, the hunters felt as warm as they would in summer. Then they went where goats and deer were most plentiful. They soon killed all they needed, and the young leader killed more than anyone because his shot was the surest."
        - id: ch01-b07
          speaker: young_hunter
          text: "Now let's cut up the game and divide the meat."
        - id: ch01-b08
          speaker: narrator
          text: "Each hunter took his share, and they started toward the village in a single line. When they reached a great river, the young man decided he would carry his heavy pack no farther. He left it on the bank."
        - id: ch01-b09
          speaker: young_hunter
          text: "I'm taking another way home."
        - id: ch01-b10
          speaker: narrator
          text: "He followed a different path and reached the village long before the others. His father saw him come through the door with nothing in his hands."
        - id: ch01-b11
          speaker: old_father
          text: "Did you come back empty-handed?"
        - id: ch01-b12
          speaker: young_hunter
          text: "Have I ever done that? Why would you even ask? I killed enough meat to feed us for many moons. The load was too heavy, so I left it beside the great river. Give me those arrows. I'll finish them while you go and bring the pack home."
        - id: ch01-b13
          speaker: narrator
          text: "The old man rose and went to the river. He strapped the meat across his shoulder and stepped into the ford. Halfway over, the strap broke, and the pack dropped into the water. He bent to catch it, but the current swept it past. He reached again, lost his balance, and was dragged into the rapids. The water dashed him against the rocks. He sank and drowned."
        - id: ch01-b14
          speaker: narrator
          text: "The stream carried his body into quieter water, where it rose again. By then, it no longer looked like a man. It had become a piece of wood."
    - id: ch02
      title: The Plank That Became a Man
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The wood floated on. The river widened and widened until it entered another country. The current bore the wood close to shore, where a woman was washing clothes. She caught it as it passed and pulled it from the water."
        - id: ch02-b02
          speaker: washerwoman
          text: "What a fine, smooth plank! I'll use it as a table for my food."
        - id: ch02-b03
          speaker: narrator
          text: "She gathered her washing and carried the plank back to her hut. At suppertime, she laid it across two cords hanging from the roof. Then she placed a pot of delicious-smelling stew on top. She had worked hard all day and was very hungry. She took her largest spoon and plunged it into the pot. At that very instant, the pot and every bit of food vanished. The woman stared in astonishment and disgust."
        - id: ch02-b04
          speaker: washerwoman
          text: "You horrible plank! You've brought bad luck into my home!"
          emotion: disgusted
        - id: ch02-b05
          speaker: narrator
          text: "She picked up the plank and flung it away. Then came an even greater surprise. Where the plank had been, she saw a baby. The woman loved children and had none of her own, so she decided to keep the baby and care for him. He grew as no baby in that country had ever grown. In only four days, he became a man as tall and strong as any brave in the tribe."
        - id: ch02-b06
          speaker: old_father
          text: "You have cared for me well, and your home will never be without meat. But I have much to do, so now I must leave."
        - id: ch02-b07
          speaker: narrator
          text: "He set out for his old home. The journey took many days. When he arrived, he saw his son sitting in his place. Anger blazed inside him, and he longed to take revenge. He hurried into the forest and wept. Every tear that fell became a bird."
        - id: ch02-b08
          speaker: old_father
          text: "Wait here until I need you."
        - id: ch02-b09
          speaker: narrator
          text: "He returned to the hut and spoke as if nothing had happened."
        - id: ch02-b10
          speaker: old_father
          text: "I noticed some pretty new birds high in a tree nearby."
        - id: ch02-b11
          speaker: young_hunter
          text: "Show me where they are. I'll bring them down for our dinner."
        - id: ch02-b12
          speaker: narrator
          text: "Father and son walked into the forest together. After about half an hour, the old man stopped beneath a tree."
        - id: ch02-b13
          speaker: old_father
          text: "That's the one."
        - id: ch02-b14
          speaker: narrator
          text: "The son began to climb. Yet the higher he went, the higher the birds seemed to rise. When he looked below, the whole earth appeared no larger than a star. He tried to climb down, but he could not. Soon the birds were out of sight, though something still seemed to pull him higher and higher."
        - id: ch02-b15
          speaker: narrator
          text: "He felt as if he had been climbing for days, and perhaps he had. Then, all at once, a beautiful country spread before him. Its fields were yellow with maize. Gladly, he stepped off the top of the tree and entered that land."
    - id: ch03
      title: The Land Without Night
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "The young man wandered through the maize without knowing where he was going. Presently, he heard a steady knocking. Two old blind women were crushing their food between stones. He crept toward them on tiptoe. When one woman handed her dinner to the other, he reached out, took it, and ate it himself."
        - id: ch03-b02
          speaker: first_blind_woman
          text: "Why are you taking so long to knead that cake?"
        - id: ch03-b03
          speaker: second_blind_woman
          text: "I already gave you your dinner. What else do you want?"
        - id: ch03-b04
          speaker: first_blind_woman
          text: "No, you didn't. At least, no dinner ever reached me."
        - id: ch03-b05
          speaker: second_blind_woman
          text: "I was sure you took it from my hand. Well, here's another helping."
        - id: ch03-b06
          speaker: narrator
          text: "Again, the young man put out his hand and stole the food. The two women began to quarrel all over again. When the same thing happened a third time, they knew someone must be tricking them."
        - id: ch03-b07
          speaker: first_blind_woman
          text: "There's a man here, I'm certain of it. Tell me, are you my grandson?"
        - id: ch03-b08
          speaker: young_hunter
          text: "Yes, I am. And since you've fed me so well, I'll try to give you back your sight. The finest medicine man in my tribe taught me how to heal."
        - id: ch03-b09
          speaker: narrator
          text: "He wanted to please her, so he left the women and searched until he found the herb he needed. Then he hurried back and asked them to boil water. He dropped the herb into the pot. As soon as the water began to sing, he lifted the lid and sprinkled the women's eyes. At once, they could see again."
        - id: ch03-b10
          speaker: narrator
          text: "Night never came in that country. Instead of going early to bed, as he would have done at home, the young man went walking again. A splashing sound led him into a valley. A broad river ran through it, and salmon were leaping up a waterfall. Their silver sides flashed in the light. He badly wanted to catch some of the great fish, but he could not see how. The blind women were the only people he had met, and he did not think they could help him."
        - id: ch03-b11
          speaker: narrator
          text: "He sighed and turned back. As he walked, an idea came to him. His hair hung almost to his waist. He pulled out one strand, and it instantly became a strong line nearly a mile long."
        - id: ch03-b12
          speaker: young_hunter
          text: "Please weave this into a net so I can catch salmon."
        - id: ch03-b13
          speaker: narrator
          text: "The women wove the net he asked for. For many weeks, he stayed beside the river and watched for salmon. He returned to the women only when he needed them to cook a fish."
    - id: ch04
      title: The Basket Through the Sky
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "At last, while the young man was eating his dinner one day, the woman who usually spoke first addressed him."
        - id: ch04-b02
          speaker: first_blind_woman
          text: "Grandson, we've been very glad to have you with us. But the time has come for you to go home."
        - id: ch04-b03
          speaker: narrator
          text: "She pushed a rock aside. Beneath it was a hole so deep that he could not see the bottom. The women brought a basket out of the house and tied a rope to it."
        - id: ch04-b04
          speakers: [first_blind_woman, second_blind_woman]
          ensemble: duo
          text: "Climb in and wrap this blanket around your head. No matter what happens, don't uncover yourself until you reach the bottom."
        - id: ch04-b05
          speaker: narrator
          text: "They said farewell. The young man curled up inside the basket, and the women began to lower him. Down he went, farther and farther. He wondered if he would ever stop falling."
        - id: ch04-b06
          speaker: narrator
          text: "When the basket finally stopped, he forgot their warning. He poked out his head to see what had happened. At once, the basket moved. To his horror, it was not going down. The women were pulling it back up. Before long, their faces appeared above him."
        - id: ch04-b07
          speaker: first_blind_woman
          text: "If you refuse to do what you're told, you'll never see your wife and son again. Get back in now, and don't move until you hear a crow call."
        - id: ch04-b08
          speaker: narrator
          text: "This time, the young man knew better. The basket stopped again and again. Strange creatures seemed to settle on top of him and tug at his blanket, but he gripped it tightly and did not look. At last, he heard a crow calling. He threw off the blanket and leaped from the basket. Above him, the basket disappeared into the sky."
    - id: ch05
      title: Home from the Land of the Sun
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "The young man hurried along the path toward his hut. Ahead of him, he saw his wife with their little son riding on her back."
        - id: ch05-b02
          speaker: little_son
          text: "Look! Father is finally coming home!"
          emotion: happy
        - id: ch05-b03
          speaker: narrator
          text: "His mother told him to stop talking nonsense."
        - id: ch05-b04
          speaker: little_son
          text: "But Mother, it's true! Father is coming!"
        - id: ch05-b05
          speaker: narrator
          text: "To satisfy the child, the woman turned around. There stood her husband. They were all overjoyed to be together again."
        - id: ch05-b06
          speaker: narrator
          text: "Later, when the wind whistled through the forest and snow rose in deep banks around the door, the father would take his little boy onto his knee. Then he would tell him how he had caught salmon in the Land of the Sun."
