audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "steady, vivid folktale storytelling"
        timbre: "warm and resonant"
        pace: "measured"
        pitch: "medium"
    pinkel:
      display_name: Pinkel
      tts:
        delivery: "quick-witted, bold, and lightly teasing"
        timbre: "young and clear"
        pace: "brisk"
        pitch: "medium-high"
    eldest_brother:
      display_name: Eldest Brother
      tts:
        delivery: "self-important, lazy, and sly"
        timbre: "broad and dry"
        pace: "steady"
        pitch: "medium-low"
    second_brother:
      display_name: Second Brother
      tts:
        delivery: "resentful, calculating, and smug"
        timbre: "thin and nasal"
        pace: "measured"
        pitch: "medium"
    widow:
      display_name: Mother
      tts:
        delivery: "careworn, loving, and firm"
        timbre: "soft and mature"
        pace: "unhurried"
        pitch: "medium-low"
    witch:
      display_name: Witch
      tts:
        delivery: "harsh, suspicious, and commanding"
        timbre: "rough and aged"
        pace: "deliberate"
        pitch: "low"
    witch_daughter:
      display_name: Witch's Daughter
      tts:
        delivery: "obedient, wary, and plainspoken"
        timbre: "clear and restrained"
        pace: "steady"
        pitch: "medium"
    king:
      display_name: King
      tts:
        delivery: "grand, eager, and easily dazzled"
        timbre: "full and commanding"
        pace: "measured"
        pitch: "medium-low"
  chapters:
    - id: ch01
      title: Pinkel Goes Out into the World
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Long ago, a widow lived with her three sons. The two older sons were grown men. They were known for being idle, but their neighbors respected their mother, so some of them had still offered the young men work. Then both sons became so careless that their masters refused to keep them any longer."
        - id: ch01-b02
          speaker: narrator
          text: "They went home to their mother and their youngest brother. The older two thought very little of the boy because he made himself useful around the house. He cared for the hens, milked the cow, and did the tasks that needed doing. They called him Pinkel to mock him. After they had used the nickname for a while, everyone in the village began calling him Pinkel too."
        - id: ch01-b03
          speaker: narrator
          text: "The older brothers liked sitting idly at home much better than doing work they found unpleasant. They might have stayed beside the fire forever, but at last their mother lost patience."
        - id: ch01-b04
          speaker: widow
          text: "If you won't look for work here, you must go and seek it somewhere else. I won't keep you under my roof any longer."
        - id: ch01-b05
          speaker: narrator
          text: "She soon regretted those words. Pinkel said he was old enough to go into the world as well."
        - id: ch01-b06
          speaker: pinkel
          text: "I'll go with my brothers. When I've made my fortune, I'll send for you, Mother, and you can keep house for me."
        - id: ch01-b07
          speaker: narrator
          text: "The widow cried bitterly at the thought of parting from her youngest son. Still, she saw that his heart was set on going, so she did not hold him back. One morning, all three brothers set out in high spirits. They were sure that once their little store of money was gone, they could find whatever sort of work they felt willing to do."
        - id: ch01-b08
          speaker: narrator
          text: "A few days on the road taught them otherwise. No one seemed to want them. Whenever someone did need help, the older brothers said they could not manage everything the farmers, millers, or woodcutters required. Pinkel understood matters better. He would gladly have done some of the work his brothers refused. But he was small and slight, so no one thought of offering a job to him. The three went from one place to the next with nothing but the fruit and nuts they could find in the woods to eat. Every day, they grew hungrier."
        - id: ch01-b09
          speaker: narrator
          text: "One night, after many weary hours of walking, they reached a great lake. An island lay in the middle. A powerful light streamed from it, bright enough for them to see almost as clearly as they could in sunshine. Half hidden among the rushes, they noticed a boat."
        - id: ch01-b10
          speaker: eldest_brother
          text: "Let's take the boat and row to that island. There must be a house where the light is. Perhaps whoever lives there will give us food and a place to sleep."
        - id: ch01-b11
          speaker: narrator
          text: "They climbed in and rowed toward the light. Near the island, they saw a golden lantern hanging above the door of a hut. A goat grazed nearby. It had golden horns, with bells fastened to them, and the bells made sweet, tinkling music. The brothers were glad. At last, they thought, they could rest their tired bodies."
        - id: ch01-b12
          speaker: narrator
          text: "The brothers entered the hut, but what they saw amazed them. An ugly old woman stood inside, wrapped in a cloak of gold. The cloak itself lit the whole room. She came forward with her daughter, and the brothers exchanged uneasy looks. They had heard of the famous witch who wore such a cloak, and now they knew she stood before them. As she approached, she motioned for her daughter to keep stirring the large pot over the fire."
        - id: ch01-b13
          speaker: witch
          text: "What do you want?"
        - id: ch01-b14
          speaker: eldest_brother
          text: "We're tired and hungry. We need shelter for the night."
        - id: ch01-b15
          speaker: witch
          text: "You won't find it here. There is a palace across the lake where you can get food and shelter. Take your boat and go. But leave the boy with me. I can give him work, though something tells me he is quick and cunning enough to do me harm."
        - id: ch01-b16
          speaker: pinkel
          text: "What harm could a poor boy like me do to a great Troll like you? Please let me go with my brothers. I promise I will never hurt you."
        - id: ch01-b17
          speaker: narrator
          text: "At last, the witch let him leave. Pinkel followed his brothers back to the boat. The crossing took much longer than they expected, and morning had come before they reached the palace."
        - id: ch01-b18
          speaker: narrator
          text: "Now their luck seemed to change. The two older brothers received places in the king's stables, while Pinkel became page to the little prince. He was clever and amusing, and he noticed everything that happened around him. The king saw this and often called Pinkel into his own service. Pinkel rose higher in the king's favor each day, and his brothers grew jealous."
        - id: ch01-b19
          speaker: narrator
          text: "After some time, their envy became more than they could bear. They began planning how to ruin Pinkel's good name with the king. They did not mean to kill him, though they might not have minded hearing that he was dead. They only wanted to remind him that he was still a child, not nearly as old or wise as they were."
    - id: ch02
      title: The Golden Lantern
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Their chance soon came. Once every week, the king visited his stables to make sure his horses were properly cared for. On his next visit, the two brothers placed themselves where he could not miss them. The king praised the horses' beautiful satin coats and remarked on how different they looked from the day his grooms had first crossed the lake. The brothers immediately began talking about the marvelous light from the lantern above the witch's hut. The king loved collecting the rarest things he could find, and he fell straight into their trap. He asked where he might obtain such a lantern."
        - id: ch02-b02
          speaker: eldest_brother
          text: "Send Pinkel to fetch it, Sire. It belongs to an old witch, and she probably got it by some wicked means. Pinkel has such a smooth tongue that he can outwit any woman, young or old."
        - id: ch02-b03
          speaker: king
          text: "Then he must go tonight! If he brings me that lantern, I will make him one of the chief men in my service."
        - id: ch02-b04
          speaker: narrator
          text: "Pinkel was pleased by the thought of an adventure. He made no fuss and wasted no time. He borrowed a small boat that lay moored at the shore and rowed straight toward the island. It was late and almost dark when he arrived. Before he even reached the hut, a savory smell drifted toward him and told him that the witch was cooking her supper."
        - id: ch02-b05
          speaker: narrator
          text: "He climbed quietly onto the roof and peered inside. When the old woman's back was turned, he pulled a handful of salt from his pocket and dropped it into the pot. Soon afterward, the witch called to her daughter."
        - id: ch02-b06
          speaker: witch
          text: "Take the pot off the fire and put the stew in a dish. It has cooked long enough, and I am hungry."
        - id: ch02-b07
          speaker: narrator
          text: "The witch tasted one spoonful and put the spoon down at once. She declared that her daughter must have meddled with the stew, because no one could eat food that tasted entirely of salt."
        - id: ch02-b08
          speaker: witch
          text: "Go to the spring in the valley and bring back fresh water. I must cook another supper. I feel half starved!"
          emotion: angry
        - id: ch02-b09
          speaker: witch_daughter
          text: "But Mother, how can I find the spring in the dark? You know the lantern's light doesn't reach down there."
        - id: ch02-b10
          speaker: witch
          text: "Then take the lantern with you. I must have my supper, and there is no nearer water."
        - id: ch02-b11
          speaker: narrator
          text: "The girl hurried toward the spring with her pail in one hand and the golden lantern in the other. Pinkel followed, staying beyond the reach of its rays. When she bent over the spring to fill the pail, he pushed her in. He snatched up the lantern, ran to his boat, and rowed away from shore."
        - id: ch02-b12
          speaker: narrator
          text: "Pinkel was already far across the lake when the witch wondered what had become of her daughter. She stepped outside to look. Thick darkness surrounded the hut, but a bobbing light shone across the water. In that instant, she understood what had happened, and her heart sank."
        - id: ch02-b13
          speaker: witch
          text: "Is that you, Pinkel?"
        - id: ch02-b14
          speaker: pinkel
          text: "Yes, dear mother, it is I!"
        - id: ch02-b15
          speaker: witch
          text: "And aren't you a knave for robbing me?"
          emotion: angry
        - id: ch02-b16
          speaker: pinkel
          text: "Truly, dear mother, I am."
        - id: ch02-b17
          speaker: narrator
          text: "Pinkel rowed faster than ever. He was half afraid the witch might come after him. But whatever power she had on her island, she had none over the water. She could only watch him carry the lantern farther away. At last, she turned angrily back into the hut, muttering to herself all the while."
        - id: ch02-b18
          speaker: witch
          text: "Take care, Pinkel! You won't escape so easily the second time!"
          emotion: angry
        - id: ch02-b19
          speaker: narrator
          text: "The sun was not yet up when Pinkel returned to the palace. He entered the king's chamber and held the lantern so its rays fell across the bed. The king woke at once. When he saw the golden lantern shining over him, he sprang up and embraced Pinkel joyfully."
        - id: ch02-b20
          speaker: king
          text: "Oh, you cunning boy! What a treasure you have brought me!"
          emotion: happy
        - id: ch02-b21
          speaker: narrator
          text: "The king called for his attendants immediately. He ordered them to prepare rooms beside his own for Pinkel. From then on, the boy was allowed to enter the king's presence at any hour, and he was even given a seat on the royal council. Every new honor showed how high Pinkel had risen in the king's favor."
    - id: ch03
      title: The Goat with Golden Horns
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "All these honors made Pinkel's brothers more envious than before. Once again, they searched their minds for the best way to destroy him. Then they remembered the goat beside the witch's cottage, with its golden horns and musical bells. The thought delighted them, because the very thing that made the goat wonderful might also betray Pinkel."
        - id: ch03-b02
          speaker: second_brother
          text: "This time, the old woman will be watching for him. Pinkel may be clever, but those bells are certain to warn her."
        - id: ch03-b03
          speaker: narrator
          text: "When the king next came to the stables and praised Pinkel's cleverness, the brothers told him about the witch's other wonder, the goat with golden horns. From that moment on, the king could not sleep at night because he longed for the marvelous creature. He knew it would be dangerous to steal now that the witch was suspicious, and he spent hours trying to devise a plan. Nothing he thought of seemed good enough. At last, just as the brothers had expected, he sent for Pinkel."
        - id: ch03-b04
          speaker: king
          text: "I hear the old witch owns a goat with golden horns, and bells hang from them that make the sweetest music. I must have that goat! Tell me, how can I get it? I would give one-third of my kingdom to whoever brings it to me."
        - id: ch03-b05
          speaker: pinkel
          text: "I will fetch it for you myself."
        - id: ch03-b06
          speaker: narrator
          text: "This time, Pinkel could approach the island unseen because the golden lantern no longer cast its beams across the water. That made the journey easier. Yet another difficulty had taken its place. The goat now slept inside the hut, so he would have to lead it away from under the old woman's very eyes. How could he possibly do that without making the bells ring? All the way across the lake, he thought and thought. At last, a plan came to him. It might work, though he knew it would be very hard to carry out."
        - id: ch03-b07
          speaker: narrator
          text: "When he reached the shore, he first searched for a piece of wood. Then he hid near the hut until it was quite dark and nearly time for the witch and her daughter to go to bed. He crept up and wedged the wood beneath the door, which opened outward. The more anyone tried to close it, the more firmly it would stick. That was exactly what happened when the girl went to bolt the door for the night."
        - id: ch03-b08
          speaker: witch
          text: "What are you doing there?"
        - id: ch03-b09
          speaker: witch_daughter
          text: "Something is wrong with the door. It won't close."
        - id: ch03-b10
          speaker: witch
          text: "Leave it alone. There is no one here to harm us."
        - id: ch03-b11
          speaker: narrator
          text: "The witch was very sleepy, so her daughter obeyed and went to bed. Soon they were both snoring. Pinkel knew his moment had come. He slipped off his shoes and tiptoed into the hut. From his pocket, he took some food the goat especially liked and placed it beneath the animal's nose."
        - id: ch03-b12
          speaker: narrator
          text: "While the goat ate, Pinkel stuffed wool into every golden bell. He paused again and again to listen. If the witch woke, she might turn him into some dreadful bird or beast. But the snoring went on, so he worked as quickly as he could. When the final bell was silent, he took out another handful of food and held it toward the goat. It rose at once and followed him."
        - id: ch03-b13
          speaker: narrator
          text: "Pinkel backed slowly toward the door. The moment he was outside, he caught the goat in his arms and ran down to his boat. When they reached the middle of the lake, he pulled the wool from the bells. Their loud, sweet tinkling woke the witch."
        - id: ch03-b14
          speaker: witch
          text: "Is that you, Pinkel?"
        - id: ch03-b15
          speaker: pinkel
          text: "Yes, dear mother, it is I."
        - id: ch03-b16
          speaker: witch
          text: "Have you stolen my golden goat?"
        - id: ch03-b17
          speaker: pinkel
          text: "Yes, dear mother, I have."
        - id: ch03-b18
          speaker: witch
          text: "Aren't you a knave, Pinkel?"
          emotion: angry
        - id: ch03-b19
          speaker: pinkel
          text: "Yes, dear mother, I am."
        - id: ch03-b20
          speaker: witch
          text: "Beware if you ever come here again! Next time, you will not escape me!"
          emotion: angry
        - id: ch03-b21
          speaker: narrator
          text: "Pinkel only laughed and rowed on, taking the golden goat safely back to the palace. The king was so delighted with the creature that he kept it beside him both day and night. Just as he had promised, he made Pinkel ruler over one-third of the kingdom. Such a reward was more than the brothers could bear. They became more furious than ever, and their constant rage made them grow quite thin."
    - id: ch04
      title: The Golden Cloak
      blocks:
        - id: ch04-b01
          speaker: eldest_brother
          text: "How can we get rid of him?"
        - id: ch04-b02
          speaker: narrator
          text: "The brothers considered the question together. At last, they remembered the golden cloak and chuckled over their new plan."
        - id: ch04-b03
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: "He will have to be very clever if he means to steal that!"
        - id: ch04-b04
          speaker: narrator
          text: "When the king next visited his horses, they began praising Pinkel's marvelous cunning. They told how he had managed to steal the lantern and the goat when no one else could have done it."
        - id: ch04-b05
          speaker: eldest_brother
          text: "Since he was already there, Sire, it is a pity he didn't bring away the golden cloak as well."
        - id: ch04-b06
          speaker: king
          text: "The golden cloak? What is that?"
        - id: ch04-b07
          speaker: narrator
          text: "The brothers described its beauty in such glowing words that the king declared he could never be happy for another day until the cloak was around his own shoulders."
        - id: ch04-b08
          speaker: king
          text: "The man who brings it to me shall marry my daughter and inherit my throne."
        - id: ch04-b09
          speaker: second_brother
          text: "No one but Pinkel can get it."
        - id: ch04-b10
          speaker: narrator
          text: "The brothers could not imagine that the witch would let Pinkel escape a third time after warning him twice. They felt sure they had finally sent him into a danger his cleverness could not overcome. The king summoned Pinkel, and the young man set off with a glad heart. For many hours, he considered one plan and then another, rejecting each in turn. At last, he found a scheme that seemed as though it might succeed."
        - id: ch04-b11
          speaker: narrator
          text: "Pinkel pushed a large bag inside his coat and rowed from the shore. This time, he made sure to reach the island in daylight. He tied his boat to a tree, then walked toward the hut with his head hanging down. He made himself look sorrowful and ashamed."
        - id: ch04-b12
          speaker: witch
          text: "Is that you, Pinkel?"
        - id: ch04-b13
          speaker: narrator
          text: "Her eyes gleamed savagely as she looked at him."
        - id: ch04-b14
          speaker: pinkel
          text: "Yes, dear mother, it is I."
        - id: ch04-b15
          speaker: witch
          text: "After everything you have done, you dare put yourself in my power? Well, you will not escape me this time!"
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: "She took down a large knife and began sharpening it."
        - id: ch04-b17
          speaker: pinkel
          text: "Oh, dear mother, please spare me!"
          emotion: fearful
        - id: ch04-b18
          speaker: narrator
          text: "Pinkel fell to his knees and looked wildly around him."
        - id: ch04-b19
          speaker: witch
          text: "Spare you? You thief! Where are my lantern and my goat? No, there is only one fate for robbers!"
          emotion: angry
        - id: ch04-b20
          speaker: narrator
          text: "She waved the knife through the air, and it glittered in the firelight. By now, Pinkel was truly growing rather frightened."
        - id: ch04-b21
          speaker: pinkel
          text: "If I must die, at least let me choose how it happens. I am very hungry, and I have eaten nothing all day. Put poison in the porridge if you wish, but please let me have a good meal before I die."
        - id: ch04-b22
          speaker: witch
          text: "That is not a bad idea. As long as you die, the manner makes no difference to me."
        - id: ch04-b23
          speaker: narrator
          text: "She filled a large bowl with porridge, stirred poisonous herbs into it, and set it before him. Then she turned to some work that needed doing. Pinkel quickly poured the entire bowl into the bag beneath his coat. He scraped his spoon noisily around the empty bowl as though he were gathering up the last bite."
        - id: ch04-b24
          speaker: pinkel
          text: "Poisoned or not, that porridge was excellent. I ate every scrap. Please give me some more."
        - id: ch04-b25
          speaker: witch
          text: "You certainly have a fine appetite, young man. Still, this is the last meal you will ever eat, so I will give you another bowl."
        - id: ch04-b26
          speaker: narrator
          text: "The witch rubbed more poisonous herbs into the porridge and poured out half of what remained. Then she went to the window to call her cat. At once, Pinkel emptied the second bowl into his bag. A moment later, he rolled across the floor, twisting as if he were in agony and groaning loudly. Suddenly, he fell silent and lay still."
        - id: ch04-b27
          speaker: witch
          text: "Ah, I thought a second dose of poison would be too much for you. I warned you what would happen if you returned. I wish every thief were as dead as you!"
        - id: ch04-b28
          speaker: narrator
          text: "Then she wondered why her lazy daughter had not come back with the wood she had been sent to gather. Soon it would be too dark for the girl to find her way."
        - id: ch04-b29
          speaker: witch
          text: "I suppose I must go and look for her. What a trouble girls are!"
        - id: ch04-b30
          speaker: narrator
          text: "The witch went to the door and looked for any sign of her daughter. She saw nothing, and heavy rain was falling."
        - id: ch04-b31
          speaker: witch
          text: "This is no weather for my cloak. It would be covered in mud before I came back."
        - id: ch04-b32
          speaker: narrator
          text: "She removed the golden cloak and hung it carefully inside a cupboard. Then she put on her clogs and went to search for her daughter. As soon as the final clop of the wooden shoes faded away, Pinkel sprang up. He took the cloak from the cupboard, hurried to his boat, and rowed away as fast as he could."
        - id: ch04-b33
          speaker: narrator
          text: "He had not gone far when a puff of wind spread the cloak open. Golden light flashed across the water. At that very moment, the witch was entering the forest. She turned, saw the gleaming rays, and forgot all about her daughter. For the third time, Pinkel had outwitted her. She ran to the shore, screaming with rage."
        - id: ch04-b34
          speaker: witch
          text: "Is that you, Pinkel?"
        - id: ch04-b35
          speaker: pinkel
          text: "Yes, dear mother, it is I."
        - id: ch04-b36
          speaker: witch
          text: "Have you taken my golden cloak?"
        - id: ch04-b37
          speaker: pinkel
          text: "Yes, dear mother, I have."
        - id: ch04-b38
          speaker: witch
          text: "Aren't you a great knave?"
          emotion: angry
        - id: ch04-b39
          speaker: pinkel
          text: "Yes, truly, dear mother, I am."
    - id: ch05
      title: Pinkel Becomes King
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "And so indeed he was a great knave. All the same, Pinkel carried the golden cloak safely back to the king's palace. The king kept his promise, and Pinkel received the king's daughter as his bride. At the wedding feast, people said that such a splendid cloak ought to be worn by the bride. The king, however, was so pleased with his new treasure that he refused to part with it even for the celebration. From that day until the end of his life, no one ever saw him without the golden cloak around his shoulders."
        - id: ch05-b02
          speaker: narrator
          text: "After the king died, Pinkel inherited the throne. Let us hope that he gave up his thieving ways and ruled his people well. As for his brothers, Pinkel did not punish them. He left them in the stables, where they spent every day grumbling."
