audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    pinkel:
      display_name: 平克尔
      tts:
        delivery: 机灵大胆，遇险时善于装乖，答话带一点顽皮
        timbre: 年轻清亮
        pace: 轻快
        pitch: 中高
    elder_brother:
      display_name: 大哥
      tts:
        delivery: 懒散自负，奉承时故作殷勤
        timbre: 略粗而松懈
        pace: 适中
        pitch: 中低
    second_brother:
      display_name: 二哥
      tts:
        delivery: 狭隘阴沉，附和兄长时透着幸灾乐祸
        timbre: 干涩清楚
        pace: 适中
        pitch: 中
    witch:
      display_name: 女妖
      tts:
        delivery: 粗暴多疑，发怒时凶狠尖厉
        timbre: 苍老沙哑
        pace: 稍缓
        pitch: 中低
    witch_daughter:
      display_name: 女妖的女儿
      tts:
        delivery: 顺从迟钝，说话直白
        timbre: 年轻朴实
        pace: 适中
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 威严中带着贪求珍宝的急切，奖赏时兴奋慷慨
        timbre: 洪亮饱满
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 三兄弟出门谋生
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，有个寡妇，养着三个儿子。两个大儿子早已成人，却出了名的游手好闲。邻里敬重他们的母亲，才肯给他们活儿做。可兄弟俩又懒又马虎，故事开始的时候，雇主都不肯再留下他们了。
        - id: ch01-b02
          speaker: narrator
          text: 两人只好回家投奔母亲和小弟弟。这个弟弟会帮着料理家务，喂鸡挤奶，样样都肯做，两个哥哥反倒瞧不起他，轻蔑地叫他“平克尔”。叫得久了，全村都跟着这样叫，“平克尔”竟成了他的名字。
        - id: ch01-b03
          speaker: narrator
          text: 两个哥哥觉得，待在炉火边闲坐，可比做那些讨厌的活儿舒服多了。要不是母亲终于发火，他们真能这样坐上一辈子。寡妇说，既然他们不肯在家乡找活儿，就到外面谋生去，她再也不许他们住在自己的屋檐下。
        - id: ch01-b04
          speaker: narrator
          text: 可平克尔也说，自己已经大了，要跟哥哥们一起出去闯荡。等他挣下家业，就接母亲过去，让母亲替他照管家务。寡妇听了，立刻后悔刚才说过的话。她舍不得小儿子，流了许多眼泪。可平克尔已经拿定主意，她也没有强留。
        - id: ch01-b05
          speaker: narrator
          text: 一天早晨，三兄弟兴高采烈地上了路。他们一点也不怀疑，等那点盘缠花完，只要开口一问，就能找到自己愿意做的差事。可是才流浪几天，他们就知道错了。没有谁想雇他们。偶尔有人肯雇，两个哥哥又嫌农夫、磨坊主或樵夫交代的活儿太多，推说自己承担不了。
        - id: ch01-b06
          speaker: narrator
          text: 平克尔比哥哥们懂事，很愿意接下那些活儿。可他又矮又单薄，谁也没想过要雇他。兄弟三人只能到处流浪，靠树林里的野果和坚果过活，一天比一天饿。
        - id: ch01-b07
          speaker: narrator
          text: 一天夜里，他们走了许多个钟头，累得再也走不动，来到一片大湖边。湖中央有座小岛，岛上射出强烈的光，四周照得几乎像白天一样。芦苇丛里还藏着一条小船。
        - id: ch01-b08
          speaker: elder_brother
          text: 咱们划到岛上去吧。那边一定有房子，说不定人家肯给咱们一口饭吃，再留咱们住一夜。
        - id: ch01-b09
          speaker: narrator
          text: 三个人上了船，顺着亮光划去。靠近小岛以后，他们才看清，那是一盏挂在小屋门上的金灯笼。屋旁有只山羊在吃草，它长着一对金角，角上的铃铛叮叮咚咚，奏出悦耳的音乐。兄弟们想到疲惫的腿脚终于有地方歇一歇，心里别提多高兴了，便一起走进小屋。
        - id: ch01-b10
          speaker: narrator
          text: 谁知屋里坐着一个丑陋的老婆子，身披金斗篷，斗篷发出的光把整间屋子照得通明。她领着女儿迎上前来。三兄弟认出了那件斗篷，知道眼前正是一个大名鼎鼎的女妖，顿时不安地互相看了看。
        - id: ch01-b11
          speaker: witch
          text: 你们到这里来干什么？
        - id: ch01-b12
          speaker: narrator
          text: 她一边问，一边示意女儿搅动火上的大锅。
        - id: ch01-b13
          speaker: elder_brother
          text: 我们又饿又累，想在这里借宿一晚。
        - id: ch01-b14
          speaker: witch
          text: 我这里不留客。湖对岸的宫殿里有吃的，也有住处。你们坐船走吧，不过这个孩子要留下。我有活儿给他干，虽说我总觉得，他又机灵又狡猾，将来会害我。
        - id: ch01-b15
          speaker: pinkel
          text: 我这么一个穷孩子，怎么害得了您这样厉害的女妖？求您让我跟哥哥们走吧。我答应您，绝不会伤害您。
        - id: ch01-b16
          speaker: narrator
          text: 女妖最后放了他。三兄弟回到船上，继续赶路。路程比想象中远得多，等他们划到宫殿，天已经亮了。
        - id: ch01-b17
          speaker: narrator
          text: 这一下，他们似乎终于交了好运。两个哥哥进了国王的马厩，平克尔却被选去给小王子当侍童。他聪明风趣，眼前发生的事，样样都逃不过他的眼睛。国王发现了他的本事，经常叫他到身边办事。两个哥哥看在眼里，妒忌得要命。
        - id: ch01-b18
          speaker: narrator
          text: 日子就这样一天天过去，平克尔在国王面前越来越受宠。两个哥哥心里的妒火也越烧越旺，终于再也忍不住了。他们凑在一起，商量怎样败坏弟弟在国王心里的名声。他们倒不想亲手杀他，不过，要是听说他死了，恐怕也不会难过。他们只是想提醒平克尔，说到底，他不过是个孩子，年龄还没有哥哥们一半大，见识当然也远不如他们。
    - id: ch02
      title: 金灯笼
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 机会很快来了。国王每星期都要巡视一次马厩，看看自己的马有没有照料好。下一次他走进马厩时，两个哥哥故意凑到跟前。国王夸他们手下的马皮毛像缎子一样光滑，还说他们刚从湖那边来时，这些马可没有现在漂亮。
        - id: ch02-b02
          speaker: narrator
          text: 兄弟俩马上说起湖中小屋，说门上的金灯笼能发出神奇的亮光。国王最爱搜罗世上的珍宝，立刻中了他们的圈套，追问怎样才能得到那盏灯笼。
        - id: ch02-b03
          speakers: [elder_brother, second_brother]
          ensemble: duo
          text: 陛下，派平克尔去取吧。灯笼属于一个老女妖，准是她用邪门手段弄来的。不过平克尔嘴甜，不管老女人还是年轻姑娘，他都有办法对付。
        - id: ch02-b04
          speaker: king
          text: 那就叫他今天夜里去！只要把灯笼带回来，我便让他做我身边的一位要人。
        - id: ch02-b05
          speaker: narrator
          text: 平克尔一听要去冒险，十分高兴，二话没说便借来一条系在岸边的小船，立刻划向小岛。等他抵达，时间已经很晚，天几乎全黑了。饭菜的香味从小屋里飘来，他知道女妖正在做晚饭，便轻手轻脚地爬上屋顶，探头朝里面窥看，耐心等着老婆子转身。
        - id: ch02-b06
          speaker: narrator
          text: 趁老婆子背过身去，平克尔从口袋里抓出一把盐，飞快地扔进锅里。刚做完，女妖就叫女儿把锅端下火，将炖菜盛进盘里。她说菜已经煮得够久，自己也饿了。可是她才尝一口，就把勺子放下，一口咬定女儿动了手脚，不然好好一锅菜，怎么会咸得根本吃不下。
        - id: ch02-b07
          speaker: witch
          text: 去山谷的泉边打些清水来，我得重新做晚饭。我已经快饿死了。
        - id: ch02-b08
          speaker: witch_daughter
          text: 妈妈，这么黑，我怎么找得到泉眼？灯笼的光根本照不到山谷里呀。
        - id: ch02-b09
          speaker: witch
          text: 那就把灯笼带上。晚饭我非吃不可，附近又没有别的水。
        - id: ch02-b10
          speaker: narrator
          text: 姑娘一手提着水桶，一手举着金灯笼，匆匆赶往泉边。平克尔一路跟在后面，小心躲开灯光。等姑娘弯腰打水，他猛地将她推进泉里，抢起灯笼跑回小船，飞快地划走了。
        - id: ch02-b11
          speaker: narrator
          text: 平克尔已经离开小岛很远，女妖还在纳闷女儿怎么不回来，便走到门口张望。小屋四周黑得浓稠，什么也看不见。可是水面上那一点上下起伏、一路流泻的亮光是什么？她心里一沉，猛然明白发生了什么事。
        - id: ch02-b12
          speaker: witch
          text: 是你吗，平克尔？
        - id: ch02-b13
          speaker: pinkel
          text: 是我呀，亲爱的妈妈！
        - id: ch02-b14
          speaker: witch
          text: 你抢走我的东西，不是个无赖吗？
        - id: ch02-b15
          speaker: pinkel
          text: 一点不错，亲爱的妈妈，我就是个无赖。
        - id: ch02-b16
          speaker: narrator
          text: 平克尔嘴里答着，手上却越划越快。他也有点担心女妖追来。可女妖到了水上便使不出法力，只能怒气冲冲地回到屋里，一路还在自言自语。
        - id: ch02-b17
          speaker: witch
          text: 你等着！再敢来一次，我绝不会让你这么容易逃掉！
          emotion: angry
        - id: ch02-b18
          speaker: narrator
          text: 太阳还没升起，平克尔已经回到宫殿。他走进国王寝室，举起灯笼，让金光照到床上。国王一下醒来，看见金灯笼就在眼前，立刻跳下床，欢天喜地地抱住平克尔。
        - id: ch02-b19
          speaker: king
          text: 好个机灵鬼！你给我带回来一件多么了不起的宝贝！
          emotion: happy
        - id: ch02-b20
          speaker: narrator
          text: 国王马上召来侍从，叫人在自己寝室旁给平克尔安排房间，还准许这个年轻人无论什么时辰都可以进见。除此以外，他又让平克尔在议事会里有了一个席位。
    - id: ch03
      title: 金角山羊
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两个哥哥比从前更加妒忌，又开始琢磨怎样毁掉弟弟。最后，他们想起了那只长着金角、角上挂着铃铛的山羊，顿时高兴起来。他们认定这回老婆子一定有了防备，就算平克尔再聪明，金铃铛也会向她报警。
        - id: ch03-b02
          speaker: narrator
          text: 国王下一次来到马厩，又夸起平克尔聪明时，兄弟俩便把女妖手里另一件奇宝告诉了他，也就是那只长着金角的山羊。从那一刻起，国王日夜惦记着这头神奇的动物，夜里连眼睛也合不上。他知道女妖已经起了疑心，这回想偷走山羊十分危险，便花了许多个钟头盘算怎样骗过她。可他怎么也想不出可行的计策，最后果然召来了平克尔。
        - id: ch03-b03
          speaker: king
          text: 我听说岛上的老女妖有一只山羊，长着一对金角，角上的铃铛能奏出世上最美的音乐。那只山羊我非要不可！可是怎样才能得到它？谁把它带来，我愿意把三分之一的王国赐给他。
        - id: ch03-b04
          speaker: pinkel
          text: 我亲自去取。
        - id: ch03-b05
          speaker: narrator
          text: 这一次没有金灯笼照亮水面，平克尔更容易偷偷靠近小岛。可是山羊睡在屋里，他非得当着老婆子的面把它带走不可。渡湖的时候，他想了又想，终于有了一个办法，虽说办起来并不容易。
        - id: ch03-b06
          speaker: narrator
          text: 一到岸边，他先四处寻找一块木头。找到以后，他藏在小屋附近，一直等到天完全黑下来，差不多到了女妖母女上床的时刻，才悄悄爬过去，把木头卡在向外开的门底下。这样一来，门越是用力关，反而卡得越紧。姑娘像往常一样去闩门，想把屋子关严过夜，事情果然如平克尔所料。
        - id: ch03-b07
          speaker: witch
          text: 你在干什么？
        - id: ch03-b08
          speaker: witch_daughter
          text: 这扇门有点不对劲，我怎么也关不上。
        - id: ch03-b09
          speaker: witch
          text: 那就别管了，反正没人会来害咱们。
        - id: ch03-b10
          speaker: narrator
          text: 女妖困得厉害，说完便让女儿上床。不一会儿，母女俩鼾声大作。平克尔知道机会来了。他脱下鞋，踮脚溜进小屋，从口袋里拿出山羊最爱吃的食物，放在它鼻子下面。
        - id: ch03-b11
          speaker: narrator
          text: 山羊低头吃着，平克尔便用带来的羊毛，把每一只金铃铛都塞得严严实实。他每过一会儿就停手听听，生怕女妖突然醒来，让自己变成什么可怕的飞禽走兽。可鼾声一直没停，他便赶紧做下去。塞完最后一只铃铛，他又从口袋里抓出一把食物，伸到山羊面前，引得它立刻站了起来。
        - id: ch03-b12
          speaker: narrator
          text: 平克尔把食物举在前面，自己倒退着慢慢走，山羊就一路跟着他来到门口。他刚走出小屋，便把山羊一把抱进怀里，朝停船的地方飞奔。一直划到湖中央，他才掏出每只铃铛里的羊毛。金铃铛立刻叮叮当当地大响起来，女妖也被这阵声音惊醒了。
        - id: ch03-b13
          speaker: witch
          text: 是你吗，平克尔？
        - id: ch03-b14
          speaker: pinkel
          text: 是我呀，亲爱的妈妈。
        - id: ch03-b15
          speaker: witch
          text: 你偷了我的金角山羊吗？
        - id: ch03-b16
          speaker: pinkel
          text: 是的，亲爱的妈妈，是我偷的。
        - id: ch03-b17
          speaker: witch
          text: 平克尔，你不是个无赖吗？
        - id: ch03-b18
          speaker: pinkel
          text: 是的，亲爱的妈妈，我就是。
        - id: ch03-b19
          speaker: witch
          text: 你胆敢再来，就给我小心！下一次，我绝不会让你逃掉！
          emotion: angry
        - id: ch03-b20
          speaker: narrator
          text: 平克尔只管笑着继续划船。国王见到山羊，喜欢得不得了，从此不论白天黑夜，总把它带在自己身边。他也遵守承诺，让平克尔统管三分之一的王国。两个哥哥得知这些事，比从前更加愤怒。他们每天眼看着弟弟飞黄腾达，自己却还在马厩里干活，气得身子都一天天瘦了下去。
    - id: ch04
      title: 女妖的金斗篷
      blocks:
        - id: ch04-b01
          speaker: elder_brother
          text: 到底怎样才能除掉他？
        - id: ch04-b02
          speaker: narrator
          text: 兄弟俩终于想起了女妖的金斗篷，忍不住咯咯发笑。他们认定，平克尔若想偷到那件宝贝，可真得有天大的本事。国王下一次来看马时，他们便谈起平克尔，夸他聪明绝顶，说他竟能偷到灯笼和山羊，这些事换作别人谁也办不到。夸奖完了，他们才装作惋惜地提起另一件宝物。
        - id: ch04-b03
          speakers: [elder_brother, second_brother]
          ensemble: duo
          text: 不过，平克尔既然已经去了两次，竟没把金斗篷一起带回来，实在太可惜了。
        - id: ch04-b04
          speaker: king
          text: 金斗篷？那是什么东西？
        - id: ch04-b05
          speaker: narrator
          text: 两个哥哥把斗篷说得美妙极了，仿佛每一个字都闪着光。国王听完便宣称，不把金斗篷披到自己肩上，他这辈子再也不会有一天快活。
        - id: ch04-b06
          speaker: king
          text: 谁把斗篷带回来，我就把女儿嫁给他。等我死后，他还会继承我的王位。
        - id: ch04-b07
          speakers: [elder_brother, second_brother]
          ensemble: duo
          text: 除了平克尔，谁也拿不到。
        - id: ch04-b08
          speaker: narrator
          text: 两个哥哥相信，女妖接连吃了两次亏，第三次绝不可能再让弟弟逃走。国王召来平克尔，平克尔却满心欢喜地出发了。他一路反复琢磨，想出一个计策又推翻一个，花了好几个钟头，才终于谋划妥当。
        - id: ch04-b09
          speaker: narrator
          text: 他把一只大口袋塞进外衣，特意赶在白天登上小岛。系好船，他便低着头，装出又难过又羞愧的样子，朝小屋走去。
        - id: ch04-b10
          speaker: witch
          text: 是你吗，平克尔？
        - id: ch04-b11
          speaker: narrator
          text: 女妖的眼睛里闪着凶光。
        - id: ch04-b12
          speaker: pinkel
          text: 是我呀，亲爱的妈妈。
        - id: ch04-b13
          speaker: witch
          text: 你干了那么多好事，居然还敢自己送到我手里！好啊，这一回你休想再逃！
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: 她取下一把大刀，磨了起来。平克尔尖叫一声，跪倒在地，还惊慌地四下张望。
        - id: ch04-b15
          speaker: pinkel
          text: 亲爱的妈妈，求您饶了我吧！
          emotion: fearful
        - id: ch04-b16
          speaker: witch
          text: 饶了你？你这个小偷！我的灯笼和山羊都到哪里去了？不，我绝不会饶你。强盗只有一个下场！
          emotion: angry
        - id: ch04-b17
          speaker: narrator
          text: 她把刀挥来挥去，刀刃在火光中直闪。平克尔这时也真的有些害怕了。
        - id: ch04-b18
          speaker: pinkel
          text: 既然我非死不可，至少让我自己挑个死法吧。我饿坏了，一整天什么也没吃。您尽管在粥里下毒，只求让我死前吃顿饱饭。
        - id: ch04-b19
          speaker: witch
          text: 这主意倒不坏。反正你会死，怎么死我都不在乎。
        - id: ch04-b20
          speaker: narrator
          text: 女妖舀出满满一大碗粥，把几种毒草搅了进去，然后转身去做手头的活儿。平克尔赶紧把整碗粥全倒进藏在衣服里的大口袋，又故意拿勺子刮得山响，仿佛正在吃下最后一点，连一小口也不肯剩。
        - id: ch04-b21
          speaker: pinkel
          text: 不管有毒没毒，这粥真好吃。我一口都没剩。再给我来一些吧。
        - id: ch04-b22
          speaker: witch
          text: 年轻人，你的胃口倒真不小。不过这是你最后一次吃东西了，我就再给你一碗。
        - id: ch04-b23
          speaker: narrator
          text: 女妖又把毒草揉进粥里，倒给他一半，接着走到窗边去叫自己的猫。平克尔转眼又把粥倒进袋子。接着，他倒在地上来回翻滚，装作痛苦不堪，嘴里发出响亮的呻吟。忽然，他不出声了，一动不动地躺着。
        - id: ch04-b24
          speaker: witch
          text: 我就知道，第二剂毒药你肯定受不了。我早警告过你，再回来就是这个下场。真希望世上的小偷都像你一样死个干净！可我叫那个懒丫头去捡柴，她怎么还不回来？天马上就黑了，再晚她就看不清路了。看来还得我亲自去找。养个女儿真叫人操心！
        - id: ch04-b25
          speaker: narrator
          text: 女妖走到门边张望。外面没有女儿的影子，雨却下得很大。
        - id: ch04-b26
          speaker: witch
          text: 这种天气可不能穿我的斗篷。等我回来，它准会沾满泥。
        - id: ch04-b27
          speaker: narrator
          text: 她从肩上脱下金斗篷，小心地挂进屋里的柜子，又套上木鞋，出门寻找女儿。等木鞋的最后一声响也消失了，平克尔马上从地上跳起来，取下斗篷，飞奔回船上，使出全身力气划离小岛。
    - id: ch05
      title: 平克尔继承王位
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 平克尔还没走远，一阵风便把斗篷吹开，灿烂的金光一道道越过水面。女妖正要走进树林，恰好在这时回过头，看见了那些金色光芒。她一下把女儿忘得干干净净，转身奔回岸边，为自己第三次受骗而气得尖声大叫。
        - id: ch05-b02
          speaker: witch
          text: 是你吗，平克尔？
        - id: ch05-b03
          speaker: pinkel
          text: 是我呀，亲爱的妈妈。
        - id: ch05-b04
          speaker: witch
          text: 你拿走了我的金斗篷吗？
        - id: ch05-b05
          speaker: pinkel
          text: 是的，亲爱的妈妈，是我拿的。
        - id: ch05-b06
          speaker: witch
          text: 你不是个天大的无赖吗？
        - id: ch05-b07
          speaker: pinkel
          text: 一点不错，亲爱的妈妈，我就是。
        - id: ch05-b08
          speaker: narrator
          text: 他的确是个天大的无赖！可无论怎样，他还是把金斗篷带回了国王的宫殿，也因此娶到了国王的女儿。
        - id: ch05-b09
          speaker: narrator
          text: 人们都说，婚宴那天本该由新娘披上金斗篷。可国王实在太喜欢它，一刻也舍不得放手。直到生命尽头，人们从没见他哪一天不披着那件斗篷。
        - id: ch05-b10
          speaker: narrator
          text: 国王死后，平克尔继承了王位。我们但愿他从此改掉偷盗的恶习，好好治理臣民。至于他的两个哥哥，平克尔没有惩罚他们，只让他们继续待在马厩里，终日抱怨个不停。
