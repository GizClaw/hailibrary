audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    young_wolf:
      display_name: 小狼
      tts:
        delivery: 活泼贪嘴，央求时直截了当
        timbre: 年轻清亮
        pace: 轻快
        pitch: 中高
    mink_chief:
      display_name: 水貂首领
      tts:
        delivery: 精明沉着，话里常藏着算计
        timbre: 清冷利落
        pace: 从容
        pitch: 中
    wolf_grandmother:
      display_name: 狼祖母
      tts:
        delivery: 年迈慈爱，悲恸时声音颤抖
        timbre: 苍老柔和
        pace: 稍慢
        pitch: 中高
    old_wolf:
      display_name: 狼祖父
      tts:
        delivery: 老成威严，拿主意时干脆坚定
        timbre: 浑厚苍老
        pace: 稳健
        pitch: 低
    mouse:
      display_name: 老鼠
      tts:
        delivery: 机敏殷勤，答话爽快
        timbre: 细小清脆
        pace: 稍快
        pitch: 高
    young_wolf_two:
      display_name: 另一头小狼
      tts:
        delivery: 急切好胜，喊话响亮
        timbre: 年轻明亮
        pace: 快
        pitch: 中高
    wolf_one:
      display_name: 狼甲
      tts:
        delivery: 粗直强硬，兴奋时毫不掩饰
        timbre: 粗厚
        pace: 稍快
        pitch: 中低
    wolf_two:
      display_name: 狼乙
      tts:
        delivery: 凶悍急躁，附和时干脆响亮
        timbre: 沙哑有力
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 河口的独木舟
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 北美洲北部有一片大森林，住着许许多多、各式各样的野兽。它们见了面，一个比一个有礼貌，心里却时时防着对方。谁都怕哪天一不留神，就让别的野兽杀来吃掉。只是它们礼数周全，光看表面，谁也猜不到这些心思。
        - id: ch01-b02
          speaker: narrator
          text: 一天，一头精明的小狼出门打猎。他答应祖父祖母，睡觉前一定回来。小狼快活地跑过森林，直奔自己最喜欢的地方，也就是河流入海的河口。到了那里，他果然看见水貂首领坐在独木舟里捕鱼。
        - id: ch01-b03
          speaker: young_wolf
          text: 我也想捕鱼！
        - id: ch01-b04
          speaker: narrator
          text: 水貂不出声，只装作没听见。
        - id: ch01-b05
          speaker: young_wolf
          text: 让我上船，带我一起去吧！
        - id: ch01-b06
          speaker: narrator
          text: 小狼越喊越响，还一个劲儿地央求。水貂听得不耐烦了，只好把船划到岸边。小狼纵身一跳，上了船。
        - id: ch01-b07
          speaker: mink_chief
          text: 到船那头坐好，别乱动，不然船会翻。篮子里有很多海胆卵，你想吃就吃。可要记住，只能吃白的，红的吃了会没命。
        - id: ch01-b08
          speaker: narrator
          text: 小狼本来就嘴馋，马上抓起海胆卵，狼吞虎咽地吃了个够。吃完以后，他觉得困了。
        - id: ch01-b09
          speaker: young_wolf
          text: 我想睡一会儿。
        - id: ch01-b10
          speaker: mink_chief
          text: 那就躺直，把头枕在那块木头上，好好歇一歇。
        - id: ch01-b11
          speaker: narrator
          text: 小狼照着他说的躺下来，很快就睡沉了。水貂悄悄爬到他身边，抽出刀，一刀刺进他的心口。小狼一动也没动，就这样死了。水貂随后上了沙滩，剥下狼皮，拿回小屋，挂在火前烘干。
    - id: ch02
      title: 狼群的宴席
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 几天以后，狼祖母来到水貂的小屋，想买些海胆卵。孙子失踪以后，她一直请亲族到处寻找。如今一眼看见火前的狼皮，她立刻猜到，那就是孙子的皮。
        - id: ch02-b02
          speaker: wolf_grandmother
          text: 我早就知道他死了！我早就知道！我早就知道！
          emotion: sad
        - id: ch02-b03
          speaker: narrator
          text: 狼祖母悲痛得放声大哭。水貂却粗声叫她闭嘴。她要哭，就出去哭，他只想清清静静待着。老妇人眼里全是泪，只得沿原路回家。她刚进门，就扑倒在火堆前。老狼和几个朋友已经在那里坐了一下午。
        - id: ch02-b04
          speaker: old_wolf
          text: 你这是怎么了？为什么哭？
        - id: ch02-b05
          speaker: wolf_grandmother
          text: 我的孙子再也回不来了！是水貂杀了他，呜……呜……
          emotion: sad
        - id: ch02-b06
          speaker: narrator
          text: 她垂下头，又哭了起来。老狼把一只爪子搭在她肩上。
        - id: ch02-b07
          speaker: old_wolf
          text: 好了，别再哭了。他要是真死了，我们一定替他报仇。
        - id: ch02-b08
          speaker: narrator
          text: 老狼把其余的狼都叫来，商量怎样对付水貂。这个说该这样，那个又说该那样，大家谈了很久才拿定主意。他们要在老狼家大摆宴席，再把水貂请来。为了赶快办好，每头狼都负责邀请离自己最近的客人。
        - id: ch02-b09
          speaker: narrator
          text: 狼群自以为这个计策十分狡猾，哪知道水貂比它们更狡猾。一只白兔正好从附近经过，水貂便托他带话，说自己非常乐意赴宴。可水貂心里早有防备，已经打定主意，要先下手保护自己。
    - id: ch03
      title: 老鼠暗中相助
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 水貂去找一只老鼠。那只老鼠从前帮过他不少忙。见了面，水貂先深深行了一礼。
        - id: ch03-b02
          speaker: mink_chief
          text: 老鼠朋友，我想请你再帮我一次。你要是肯答应，接下来一星期，我每天晚上都背你上山，到山顶的玉米地去。
        - id: ch03-b03
          speaker: mouse
          text: 能帮上你的忙，我很荣幸。说吧，你想让我做什么？
        - id: ch03-b04
          speaker: mink_chief
          text: 事情很简单。从今天起，到下次月圆以前，把狼族的弓和船桨全咬坏。要让它们一用就断，可外表一点也看不出来。
        - id: ch03-b05
          speaker: mouse
          text: 这个容易。只是明晚就是月圆，时间可不多了。我最好现在就去办。
        - id: ch03-b06
          speaker: narrator
          text: 水貂谢过老鼠，转身离开。走出没多远，他忽然又折了回来。
        - id: ch03-b07
          speaker: mink_chief
          text: 你去狼家咬弓的时候，顺便把墙上的木节孔啃大一点。别弄得太大，免得它们发现。这个洞也许能派上用场。
        - id: ch03-b08
          speaker: narrator
          text: 水貂朝老鼠点点头，这才走了。
        - id: ch03-b09
          speaker: narrator
          text: 第二天傍晚，水貂洗得干干净净，又把皮毛仔细梳好，这才动身赴宴。尘土飞扬的小路上到处都是狼的脚印，却连一个客人也看不见。水貂暗暗发笑。他知道出了什么事，也早已做好准备，心里一点都不怕。
        - id: ch03-b10
          speaker: narrator
          text: 屋门开着一道缝。水貂往里一看，群狼全挤在门后的角落。他还是大大方方走了进去。才一进门，屋门就砰地关上。整群狼吐着鲜红的舌头，一起猛扑过来。可它们还是慢了一步。水貂已经钻过木节孔，飞快地朝自己的独木舟奔去。
    - id: ch04
      title: 折断的弓与桨
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 木节孔太小，狼群一头也钻不过去。屋里的狼又太多，互相挤来挤去，好一会儿才把门打开。它们抓起墙上的弓箭，冲出屋子，对准逃跑的水貂。可是弓弦刚一拉，弓就在爪子里断了。
        - id: ch04-b02
          speaker: narrator
          text: 狼群扔掉断弓，用尽力气奔向岸边。它们的独木舟全拖在那里。水貂虽然跑不过狼，好在早已领先一大段。最快的几头狼跳上最近的船时，他已经把自己的船划到了水面。狼群把船推下水，刚把桨插进去，所有船桨也跟弓一样，一下全断了。
        - id: ch04-b03
          speaker: young_wolf_two
          text: 我知道哪里还藏着几支新桨！
        - id: ch04-b04
          speaker: narrator
          text: 那头小狼跳回岸上，朝沙滩后面的一个小洞飞奔。水貂听见这声喊，心里猛地一沉。他根本不知道，狼群还藏着另一批船桨。
        - id: ch04-b05
          speaker: narrator
          text: 一场漫长的追逐过后，狼群终于把水貂围得严严实实。水貂知道再抵抗也没有用，只好让它们抓住。几头年长的狼解下缠在身上的雪松皮带。它们平时总把这种带子带在身边。水貂一看，却轻蔑地笑了。
        - id: ch04-b06
          speaker: mink_chief
          text: 嗨，这种带子，我一下就能挣断。你们真想让我逃不掉，就该拿海带搓根绳子来捆我。
        - id: ch04-b07
          speaker: old_wolf
          text: 说得对。到底还是你见识多。
        - id: ch04-b08
          speaker: narrator
          text: 狼群没有带海带。老狼便吩咐手下去岩石间采上一大堆，好搓出一根绳子。
    - id: ch05
      title: 水貂最后的舞
      blocks:
        - id: ch05-b01
          speaker: mink_chief
          text: 你们搓绳子的时候，让我最后跳一支舞，怎么样？
        - id: ch05-b02
          speakers: [old_wolf, wolf_one, wolf_two]
          ensemble: chorus
          text: 好吧，你跳。也许你跳得快活，我们看着也快活。
        - id: ch05-b03
          speaker: narrator
          text: 狼群搬来两只独木舟，并排放好。水貂用后腿站起来，开始跳舞。他一会儿跃上这只船，一会儿又跃上那只船，舞姿漂亮极了。狼群看得大声喝彩，竟把处死水貂的事忘在了脑后。
        - id: ch05-b04
          speaker: narrator
          text: 水貂停下来，歇了一小会儿。
        - id: ch05-b05
          speaker: mink_chief
          text: 把两只船拉开一点。挨得这么近，我没法跳那支新舞。
        - id: ch05-b06
          speaker: narrator
          text: 狼群把船分开。水貂轻巧地连跳了几下，有时两边船头各踩一只脚，就站在那里飞快旋转。
        - id: ch05-b07
          speaker: mink_chief
          text: 现在拉近一点，再拉远一点。不，还得更远！
        - id: ch05-b08
          speaker: narrator
          text: 狼群的喝彩声从四面响起。水貂纵身跃到半空，忽然头朝下落进水里，一口气潜到了水底。狼群的喝彩立刻变成愤怒的嚎叫。它们四处寻找，却怎么也找不到水貂。
        - id: ch05-b09
          speaker: narrator
          text: 水貂躲在一块岩石后面。等狼群走得无影无踪，他才出来，去另一片森林安了家。
