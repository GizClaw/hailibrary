audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "steady, vivid folktale storytelling"
        timbre: "warm and resonant"
        pace: "measured"
        pitch: "medium"
    young_wolf:
      display_name: Young Wolf
      tts:
        delivery: "eager, confident, and impulsive"
        timbre: "young and bright"
        pace: "brisk"
        pitch: "medium"
    mink:
      display_name: Mink
      tts:
        delivery: "smooth, clever, and coolly self-possessed"
        timbre: "sleek and clear"
        pace: "measured"
        pitch: "medium-high"
    grandmother_wolf:
      display_name: Grandmother Wolf
      tts:
        delivery: "aged, loving, and deeply emotional"
        timbre: "soft and weathered"
        pace: "slow"
        pitch: "medium-low"
    grandfather_wolf:
      display_name: Grandfather Wolf
      tts:
        delivery: "grave, commanding, and deliberate"
        timbre: "aged and sturdy"
        pace: "measured"
        pitch: "low"
    mouse:
      display_name: Mouse
      tts:
        delivery: "courteous, nimble, and practical"
        timbre: "small and crisp"
        pace: "brisk"
        pitch: "high"
    young_wolf_chaser:
      display_name: Young Wolf Chaser
      tts:
        delivery: "quick-thinking, excited, and energetic"
        timbre: "young and clear"
        pace: "fast"
        pitch: "medium-high"
    wolf_friend:
      display_name: Wolf Friend
      tts:
        delivery: "rough, watchful, and eager"
        timbre: "firm and husky"
        pace: "brisk"
        pitch: "medium-low"
  chapters:
    - id: ch01
      title: The Young Wolf Goes Fishing
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "A great forest in the north of America was home to wild animals of every kind. Whenever they met, they treated one another with perfect politeness. All the same, each kept a close eye on the others. Any one of them might be killed and eaten by somebody else. Their fine manners hid that fear so well that no one would have guessed it."
        - id: ch01-b02
          speaker: narrator
          text: "One day, a clever young wolf set off to hunt. He promised his grandfather and grandmother that he would return before bedtime. He trotted happily through the trees until he reached one of his favorite places, where the river flowed into the sea. Just as he had hoped, the chief mink was there, fishing from a canoe."
        - id: ch01-b03
          speaker: young_wolf
          text: "I want to go fishing too!"
        - id: ch01-b04
          speaker: narrator
          text: "Mink said nothing. He acted as though he had not heard."
        - id: ch01-b05
          speaker: young_wolf
          text: "Please bring your canoe over and let me come with you!"
        - id: ch01-b06
          speaker: narrator
          text: "This time Wolf shouted louder. He kept begging until Mink grew tired of hearing him and paddled close enough to shore for him to jump aboard."
        - id: ch01-b07
          speaker: mink
          text: "Sit still at that end, or you'll tip us over. If you like sea urchin eggs, there are plenty in the basket. Eat only the white ones. The red ones will kill you."
        - id: ch01-b08
          speaker: narrator
          text: "Wolf was always hungry. He ate the eggs greedily, and when they were gone, he told Mink that he wanted a nap."
        - id: ch01-b09
          speaker: mink
          text: "Then stretch out and put your head on that piece of wood. You can rest there."
        - id: ch01-b10
          speaker: narrator
          text: "Wolf did as he was told and soon fell fast asleep. Mink crept toward him and drove a knife into his heart. Wolf died without moving. Mink went ashore, skinned him, and carried the skin home to his cottage. There he hung it in front of the fire to dry."
        - id: ch01-b11
          speaker: narrator
          text: "Not many days passed before Wolf's grandmother came to the cottage. She and her relatives had searched everywhere for him. Now she wanted to buy sea urchin eggs, but as soon as she entered, she saw the skin. At once she knew it belonged to her grandson."
        - id: ch01-b12
          speaker: grandmother_wolf
          text: "I knew he was dead! I knew it, I knew it!"
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: "She wept bitterly. Mink spoke to her with no kindness at all."
        - id: ch01-b14
          speaker: mink
          text: "If you're going to make that much noise, do it outside. I like quiet in my house."
        - id: ch01-b15
          speaker: narrator
          text: "Half-blinded by tears, the old wolf went back the way she had come. She ran through her own door and threw herself down before the fire. Her husband was there with several friends who had spent the afternoon with him."
        - id: ch01-b16
          speaker: grandfather_wolf
          text: "Why are you crying?"
        - id: ch01-b17
          speaker: grandmother_wolf
          text: "I'll never see my grandson again! Mink killed him. Oh, oh!"
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: "She lowered her head and began to wail as loudly as before. Her husband laid one paw on her shoulder."
        - id: ch01-b19
          speaker: grandfather_wolf
          text: "There, there. Take comfort. If our grandson truly is dead, we'll avenge him."
          emotion: calm
        - id: ch01-b20
          speaker: narrator
          text: "He called the others closer, and the wolves began to discuss the best plan. It took them a long time to decide. One wolf suggested one thing, and another had a different idea. At last they agreed that Grandfather Wolf would hold a grand feast in his house and invite Mink. To waste no time, each wolf would carry invitations to the guests who lived nearest to him."
    - id: ch02
      title: Mink Takes Precautions
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The wolves believed they were very cunning. Mink was more cunning still. A white hare happened to be traveling their way, so Mink sent word with the hare that he would be delighted to attend. But he had already decided to protect himself. He went to visit a mouse who had often helped him, and greeted her with his finest bow."
        - id: ch02-b02
          speaker: mink
          text: "Friend Mouse, I need a favor. If you do it for me, I'll carry you on my back to the patch of corn at the top of the hill every night for a week."
        - id: ch02-b03
          speaker: mouse
          text: "Then the favor will be mine. Tell me what I can do for you."
        - id: ch02-b04
          speaker: mink
          text: "It's easy enough. Between today and the next full moon, gnaw through the wolves' bows and paddles. Make sure they'll break the moment the wolves use them. But you must leave them looking untouched."
        - id: ch02-b05
          speaker: mouse
          text: "Of course. Nothing could be easier. The full moon is tomorrow night, though, so I'd better begin at once."
        - id: ch02-b06
          speaker: narrator
          text: "Mink thanked her and went on his way. He had not gone far when another thought brought him back."
        - id: ch02-b07
          speaker: mink
          text: "While you're at the wolves' house taking care of the bows, you might make the knothole in the wall a little larger. Don't make it big enough for anyone to notice. It may come in useful."
        - id: ch02-b08
          speaker: narrator
          text: "He gave Mouse another nod and left her. The next evening, Mink washed himself, brushed his coat with care, and set out for the feast. Along the dusty trail, he saw many wolf tracks. Yet not one guest was in sight. He knew exactly what that meant. He had taken his precautions, so he felt no fear."
        - id: ch02-b09
          speaker: narrator
          text: "The door of the house stood open. Through a crack, Mink could see the wolves crowded into the corner behind it. Even so, he walked boldly inside. The instant he had fully entered, the door slammed shut. The whole pack leaped at him, their red tongues hanging from their mouths."
        - id: ch02-b10
          speaker: narrator
          text: "The wolves were quick, but they were too late. Mink had already slipped through the knothole and was racing toward his canoe. The opening was much too small for any wolf. So many wolves had packed themselves into the house that it took them some time to get the door open again."
        - id: ch02-b11
          speaker: narrator
          text: "At last they burst outside. They snatched the bows and arrows from the walls and aimed at the fleeing Mink. But the moment they pulled, every bow broke between their paws. They flung the useless pieces away and bounded at full speed toward the shore, where their canoes lay on the beach."
    - id: ch03
      title: The Chase Across the Water
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Mink could not run as fast as the wolves, but his head start had carried him to the water. His canoe was already afloat when the fastest wolves hurled themselves into the nearest boat. They shoved away from the beach and plunged their paddles into the water. Every paddle snapped, just as the bows had done, and not one was any use."
        - id: ch03-b02
          speaker: young_wolf_chaser
          text: "I know where we keep some new paddles!"
        - id: ch03-b03
          speaker: narrator
          text: "The young wolf sprang ashore and raced toward a small cave behind the beach. When Mink heard him, his heart sank. He had known nothing about this hidden supply."
        - id: ch03-b04
          speaker: narrator
          text: "The chase went on for a long time. At last the wolves managed to surround Mink. He saw that fighting them would do no good, so he gave himself up. Some of the older wolves unwound the cedar bands they always carried around their bodies. At the sight of those bands, Mink laughed scornfully."
        - id: ch03-b05
          speaker: mink
          text: "Why, I could snap those in a moment. If you truly want to stop me from escaping, take a strand of kelp and tie me with that."
        - id: ch03-b06
          speaker: grandfather_wolf
          text: "You're right. You are wiser than we are."
        - id: ch03-b07
          speaker: narrator
          text: "Grandfather Wolf ordered his servants to gather enough kelp from the rocks to make a rope, since the wolves had brought none with them. While they set to work, Mink made another request."
        - id: ch03-b08
          speaker: mink
          text: "Since the rope isn't ready yet, you may as well let me have one last dance."
        - id: ch03-b09
          speakers: [grandfather_wolf, young_wolf_chaser, wolf_friend]
          ensemble: chorus
          text: "Very well. Have your dance. It may entertain us too."
        - id: ch03-b10
          speaker: narrator
          text: "The wolves brought two canoes and set them side by side. Mink rose onto his hind legs and began to dance. First he stepped through one canoe, then through the other. He moved so gracefully that the wolves forgot they meant to put him to death. They threw back their heads and howled with pleasure."
    - id: ch04
      title: Mink's Last Dance
      blocks:
        - id: ch04-b01
          speaker: mink
          text: "Pull the canoes a little farther apart. They're too close together for my new dance."
        - id: ch04-b02
          speaker: narrator
          text: "Mink paused while the wolves separated the boats. Then he danced on with a chain of light little leaps. Now and then he spun with one foot on the prow of each canoe."
        - id: ch04-b03
          speaker: mink
          text: "Bring them closer. Now move them apart. No, move them farther still!"
        - id: ch04-b04
          speaker: narrator
          text: "The dance continued, and the canoes drifted farther apart. With the wolves howling their applause, Mink suddenly sprang high into the air. He came down headfirst and dived all the way to the bottom."
        - id: ch04-b05
          speaker: narrator
          text: "The wolves' delighted howls turned to howls of rage. They searched everywhere, but they never found him. Mink had hidden behind a rock and stayed there until every wolf was out of sight. Then he left that country and made his home in another forest."
