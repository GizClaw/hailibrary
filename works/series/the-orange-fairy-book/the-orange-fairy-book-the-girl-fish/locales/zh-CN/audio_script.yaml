audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    girl_fish:
      display_name: 鱼姑娘
      tts:
        delivery: 活泼任性，历险中逐渐勇敢坚定
        timbre: 清亮柔和
        pace: 适中偏快
        pitch: 中高
    mother:
      display_name: 母亲
      tts:
        delivery: 慈爱操劳，劝告时忧心急切
        timbre: 温柔圆润
        pace: 适中
        pitch: 中
    magic_fish:
      display_name: 会魔法的鱼
      tts:
        delivery: 冷静严肃，警告时不容轻视
        timbre: 清澈沉着
        pace: 稍慢
        pitch: 中低
    old_tunny:
      display_name: 老金枪鱼
      tts:
        delivery: 老练亲切，安慰人时从容坦率
        timbre: 苍老浑厚
        pace: 舒缓
        pitch: 低
    big_fish:
      display_name: 大鱼
      tts:
        delivery: 热情自豪，语气爽朗
        timbre: 厚实明亮
        pace: 适中
        pitch: 中低
    fish_queen:
      display_name: 鱼女王
      tts:
        delivery: 高贵沉静，悲伤中保持威严
        timbre: 成熟温润
        pace: 舒缓
        pitch: 中
    prince:
      display_name: 王子
      tts:
        delivery: 温和真挚，面对爱情时羞怯深情
        timbre: 清朗柔和
        pace: 适中
        pitch: 中
    giant:
      display_name: 巨人
      tts:
        delivery: 粗暴迟钝，讨价还价时狡猾贪婪
        timbre: 粗重低沉
        pace: 稍慢
        pitch: 低
    fish_1:
      display_name: 变色小鱼
      tts:
        delivery: 好动急躁，抱怨时直来直去
        timbre: 轻快清脆
        pace: 偏快
        pitch: 高
    fish_2:
      display_name: 鱼儿乙
      tts:
        delivery: 悲观直率，说话笃定
        timbre: 清楚沉稳
        pace: 适中
        pitch: 中
    fish_3:
      display_name: 鱼儿丙
      tts:
        delivery: 爱操心，惦念陆地上的生活
        timbre: 柔和纤细
        pace: 稍慢
        pitch: 中高
    fish_4:
      display_name: 鱼儿丁
      tts:
        delivery: 机敏活泼，发现异状时兴奋响亮
        timbre: 明亮清晰
        pace: 偏快
        pitch: 中高
    shore_watcher_1:
      display_name: 岸上人甲
      tts:
        delivery: 朴实爽朗，见到奇景时兴致勃勃
        timbre: 清晰厚实
        pace: 适中
        pitch: 中
    shore_watcher_2:
      display_name: 岸上人乙
      tts:
        delivery: 朴实明快，随同伴惊叹应和
        timbre: 明亮自然
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 从姑娘变成鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一条小河边住着一对夫妻，只有一个女儿。姑娘既是独生女，又长得漂亮，父母便舍不得责罚她的过错，也没有教她好好待人。母亲叫她帮忙烧饭、洗盘子，她反倒当面取笑母亲。她每天只顾着和朋友跳舞玩耍，家里的事一点也不肯做。父母有这个女儿，简直和没有一样。
        - id: ch01-b02
          speaker: narrator
          text: 有天早晨，母亲看上去实在太累，连这个自私的女儿都不能装作没看见。姑娘破天荒地问，有没有什么事能让她来做，好叫母亲歇一会儿。母亲又惊讶又感激。姑娘见了，心里也有点惭愧，那一刻就算叫她刷洗整间屋子，她大概都会答应。可母亲只求她把渔网拿到河边，补好上面的破洞，因为父亲打算当天夜里去捕鱼。
        - id: ch01-b03
          speaker: narrator
          text: 姑娘这回倒很卖力，很快补完了所有破洞。她对自己颇为满意。路过的人都停下来同她聊几句，所以她一点也不觉得闷。等太阳升到头顶，她正要叠好渔网回家，背后忽然传来一声水响。回头一看，一条大鱼跃出了水面。她双手抓起渔网，朝一圈圈荡开的水纹撒过去。与其说凭本领，不如说全靠运气，她真把那条鱼拖上了岸。
        - id: ch01-b04
          speaker: girl_fish
          text: 哟，你可真漂亮！
        - id: ch01-b05
          speaker: magic_fish
          text: 你最好别杀我。你要是杀了我，我就把你也变成一条鱼！
        - id: ch01-b06
          speaker: narrator
          text: 姑娘只轻蔑地一笑，提着鱼跑去找母亲。
        - id: ch01-b07
          speaker: girl_fish
          text: 妈妈，瞧我捉到了什么！把它吃掉还有点可惜呢。它居然会说话，还说我要是杀了它，它就把我变成鱼。
        - id: ch01-b08
          speaker: mother
          text: 快把它放回去！它也许懂魔法。你要是出了事，我和你父亲都会活不下去的。
          emotion: fearful
        - id: ch01-b09
          speaker: girl_fish
          text: 妈妈，别说傻话了。这样的东西能把我怎么样？再说我饿了，要是还吃不上饭，我可要发脾气了。
        - id: ch01-b10
          speaker: narrator
          text: 她说完就跑去采花，准备把花插在头发上。大约一个钟头以后，远处传来号角声。那是在告诉她，午饭已经摆上桌了。
        - id: ch01-b11
          speaker: girl_fish
          text: 我早就说了，这条鱼一定很好吃！
        - id: ch01-b12
          speaker: narrator
          text: 她把勺子伸进盘中，一下舀起一大块鱼肉。鱼肉刚碰到嘴唇，一阵寒意立刻透过全身。她的脑袋好像变扁了，眼睛古怪地转向两边，胳膊和腿紧贴在身侧，再也动不了。她张着嘴，拼命想喘一口气，随后猛地一跃，穿过窗户落进河里。进了水，她才舒服起来，也终于能游动了。她顺着河一直游进了近在不远处的大海。
        - id: ch01-b13
          speaker: narrator
          text: 她刚游进大海，别的鱼儿就留意到了那张愁苦的脸。它们纷纷挤到她身边，求她把自己的遭遇讲出来。
        - id: ch01-b14
          speaker: girl_fish
          text: 我不是鱼，真的不是！我是个姑娘，至少几分钟前还是，只是……
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: 她边说边吞了好几大口咸咸的海水。毕竟谁也不能一下子就学会怎样当一条像样的鱼。说到这里，她再也说不下去了，只得把头埋进波浪，不想让大家看见她在哭。
        - id: ch01-b16
          speaker: old_tunny
          text: 只是你不信那条鱼真能做到它说的事。别难过，我们全都遇到过这种事，做鱼的日子其实也不坏。跟我们去见女王吧。她的宫殿比你们陆地上任何女王的都漂亮。
        - id: ch01-b17
          speaker: narrator
          text: 小鱼有点怕走这么远，可她更怕独自留下，便摆摆尾巴，表示自己愿意同行。几百条鱼浩浩荡荡地出发了。礁石上和船上的人看见它们游过，立刻彼此招呼起来。
        - id: ch01-b18
          speakers: [shore_watcher_1, shore_watcher_2]
          ensemble: duo
          text: 快看，好壮观的一大群鱼！
        - id: ch01-b19
          speaker: narrator
          text: 他们哪里想得到，这些鱼正赶往女王的宫殿呢？话说回来，陆地上的人，对海底的事知道得实在太少。新来的小鱼自然也一样。
        - id: ch01-b20
          speaker: narrator
          text: 姑娘过去只见过水母和鹦鹉螺在水面下游动，也见过彩色海草随水漂荡。除此以外，她对海底一无所知。如今越潜越深，她才看见那里散落着金锭、巨锚、成堆的珍珠，还有价值无法估量的宝石和无人问津的珠宝。海底也有死人的白骨，以及躲在岩缝里、从没见过阳光的细长白色生物。起先她眼前一片昏暗，仿佛也瞎了。后来，她在幽绿的水光里一样样辨出了东西。游了几个钟头，一切终于都清楚了。
        - id: ch01-b21
          speaker: big_fish
          text: 总算到了！海底也有山峦和谷地。你看，那就是鱼女王的宫殿。就算皇帝本人，也没有这么好的宫殿吧？
        - id: ch01-b22
          speaker: girl_fish
          text: 真的好美。
        - id: ch01-b23
          speaker: narrator
          text: 小鱼一路拼命追赶大家，已经累得直喘气。可眼前的宫殿确实美得无法形容。墙壁用淡粉色的珊瑚砌成，被海水长年冲刷得光洁平滑，窗户四周镶着一排排珍珠。高大的宫门敞开着，整群鱼一同游进觐见厅。女王终究还有半身是女人，正坐在一张蓝绿贝壳做成的宝座上。
    - id: ch02
      title: 鱼女王的王冠
      blocks:
        - id: ch02-b01
          speaker: fish_queen
          text: 你是谁？从哪里来？
        - id: ch02-b02
          speaker: narrator
          text: 别的鱼把小鱼推到最前面。她声音低低的，微微发抖，从自己在河边补网讲起，把变成鱼的经过全都告诉了女王。
        - id: ch02-b03
          speaker: fish_queen
          text: 我从前也是个姑娘，父亲是一个大国的国王。父母替我找了丈夫。成婚那天，母亲为我戴上王冠，说只要我还戴着它，就一直是王后。那几个月，我幸福极了，尤其是有了一个小儿子陪伴以后。
        - id: ch02-b04
          speaker: fish_queen
          text: 可有天早晨，我正在花园散步，一个巨人突然出现，抢走王冠，还紧紧抓住我。他说要把王冠送给自己的女儿，再对我的丈夫施魔法，让王子分不清我和她。从此，巨人的女儿占了我的位置，代替我做了王后。
          emotion: sad
        - id: ch02-b05
          speaker: fish_queen
          text: 我绝望得投进大海。爱我的女官们也要跟我一起死。可我们没有死，一位同情我的巫师把我们都变成了鱼，只让我保留女人的面容和身子。除非有人替我拿回王冠，否则我们永远都得做鱼！
          emotion: sad
        - id: ch02-b06
          speaker: girl_fish
          text: 您告诉我怎么做，我一定替您把王冠拿回来！
        - id: ch02-b07
          speaker: narrator
          text: 小鱼之所以答应得这样快，是因为只要有一线希望能让她重回陆地，那时的她无论什么都会答应。
        - id: ch02-b08
          speaker: fish_queen
          text: 好，我告诉你该怎么做。
        - id: ch02-b09
          speaker: narrator
          text: 女王默默想了一会儿，才继续说下去。
        - id: ch02-b10
          speaker: fish_queen
          text: 只要照我的话去做，你就不会有危险。先回到陆地，爬上那座高山。巨人的城堡就在山顶。你会看见他坐在台阶上，为女儿哀哭。那个冒牌王后刚在王子外出打猎时死去，临终前让忠心的仆人把我的王冠送还给父亲。
        - id: ch02-b11
          speaker: fish_queen
          text: 不过千万小心，巨人见到你，也许会杀了你。我赐给你一种本领，让你能变成任何对你有帮助的生灵。只要敲一下额头，喊出它的名字就行。
        - id: ch02-b12
          speaker: narrator
          text: 这一次，回陆地的路好像短了很多。小鱼来到岸边，用尾巴重重敲了敲额头。
        - id: ch02-b13
          speaker: girl_fish
          text: 鹿儿，来吧！
        - id: ch02-b14
          speaker: narrator
          text: 黏滑的小鱼身转眼消失，原地站着一头美丽的鹿。她头顶长着枝杈般的角，四条腿细而修长，满身都因为急着奔跑而轻轻发颤。她仰起头，嗅了嗅空气，立刻飞奔出去。无论河流还是围墙，都被她轻盈地一跃而过。
        - id: ch02-b15
          speaker: narrator
          text: 国王的儿子从天亮起就一直打猎，却什么也没猎到。他正在一棵树下休息，那头鹿忽然从眼前跑过。王子一见便决心捉住她，立刻翻身上马。那匹马跑起来像风一样快，王子又常在这片森林打猎，熟悉每一条近路，终于追上了已经气喘吁吁的鹿。
        - id: ch02-b16
          speaker: girl_fish
          text: 请您开恩，让我走吧，别杀我。我还得跑很远的路，还有许多事要做。
        - id: ch02-b17
          speaker: narrator
          text: 鹿含着泪回头望他。王子惊得一句话也说不出来。她一跃翻过前面的围墙，很快没了踪影。
        - id: ch02-b18
          speaker: prince
          text: 那不可能真是一头鹿。哪有鹿长着那样的眼睛？她一定是个中了魔法的姑娘。除了她，我谁也不娶。
        - id: ch02-b19
          speaker: narrator
          text: 王子没有再追。他勒住马，掉头慢慢回了王宫。
    - id: ch03
      title: 巨人的两道难题
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 鹿终于跑到巨人的城堡，已经累得上气不接下气。她抬头望着围住城堡的高墙。墙面又高又光滑，连一处落脚的地方也没有。她心里顿时一沉，但马上又鼓起勇气。
        - id: ch03-b02
          speaker: girl_fish
          text: 蚂蚁，来吧！
        - id: ch03-b03
          speaker: narrator
          text: 枝杈般的鹿角和美丽的身形一同消失了。一只棕色小蚂蚁沿墙向上爬去，不仔细看，谁也发现不了她。这个小东西爬得快得出奇。那堵墙和她小小的身体相比，简直有几英里高。可还没过多久，她已经翻过墙顶，又爬下另一面，进了城堡的庭院。
        - id: ch03-b04
          speaker: narrator
          text: 她停下来想了想，看见墙边有棵高树，墙角的一扇窗几乎与树梢齐平。
        - id: ch03-b05
          speaker: girl_fish
          text: 猴子，来吧！
        - id: ch03-b06
          speaker: narrator
          text: 眨眼之间，她已经变成猴子，从最高的树枝荡进房间。巨人正躺在那里打鼾。
        - id: ch03-b07
          speaker: girl_fish
          text: 他看见猴子，说不定会活活吓死。那样我就再也拿不到王冠了。还是换个模样吧。鹦鹉，来吧！
        - id: ch03-b08
          speaker: narrator
          text: 一只粉红夹灰的鹦鹉跳到巨人面前。巨人正在伸懒腰，哈欠震得城堡直发抖。鹦鹉耐心等了一会儿，直到他完全醒来，才大胆告诉他，自己奉命来取走那顶王冠。既然他的女儿、那个冒牌王后已经死了，王冠便不再属于他。
        - id: ch03-b09
          speaker: narrator
          text: 巨人怒吼一声，跳下床朝鹦鹉扑去，伸出大手要扭断她的脖子。鹦鹉飞快地绕到他背后，叫他耐心一点，因为杀了她，对他也没有好处。
        - id: ch03-b10
          speaker: giant
          text: 这倒是真的。可我没蠢到白白把王冠给你。让我想想，你该拿什么来换！
        - id: ch03-b11
          speaker: narrator
          text: 巨人抓着硕大的脑袋，想了好几分钟。巨人的脑筋，向来转得很慢。
        - id: ch03-b12
          speaker: giant
          text: 有了！你到大城的圣马丁拱门上，给我取来一串蓝宝石项链。我就拿王冠跟你交换。
        - id: ch03-b13
          speaker: narrator
          text: 姑娘从前常听人说起那座奇妙的拱门。宝石和大理石全都牢牢嵌在上面，要取下来一定很难。可她一路还算顺利，总得试一试。她向巨人鞠了一躬，回到他看不见的窗边。
        - id: ch03-b14
          speaker: girl_fish
          text: 老鹰，来吧！
        - id: ch03-b15
          speaker: narrator
          text: 强健的翅膀托起她的身体，仿佛随时都能飞上云端。从地面望去，她只是天空中的一个小点。她一路飞到圣马丁拱门上方，看见阳光照着门顶，便猛冲下去，藏在一道扶壁后面，免得被下面的人发现。
        - id: ch03-b16
          speaker: narrator
          text: 她用鸟喙去凿离自己最近的蓝宝石。这活儿比想象中更难，不过最后总算完成了，她心里重新有了希望。她取出一段在树上找到的细绳，坐下来休息，一面把宝石一颗颗串起来。项链做好以后，她把它挂在颈上，叫来鹦鹉的形体。没过多久，那只粉红夹灰的鹦鹉又站到了巨人面前。
        - id: ch03-b17
          speaker: girl_fish
          text: 这是你要的项链。
        - id: ch03-b18
          speaker: narrator
          text: 巨人伸手接过那一大串蓝宝石，两眼高兴得直发亮。可宝石已经到了手，他还是不打算履行诺言，交出王冠。
        - id: ch03-b19
          speaker: giant
          text: 这些石头可没有我想的那么蓝。你那么想要王冠，就再拿一件东西来换。办不到的话，不但没有王冠，你连命也得留下。
        - id: ch03-b20
          speaker: girl_fish
          text: 这回你又想要什么？
        - id: ch03-b21
          speaker: giant
          text: 我把这顶王冠给了你，总得另有一顶更漂亮的。给我带一顶星星编成的王冠来。
        - id: ch03-b22
          speaker: narrator
          text: 鹦鹉一走出门，便低声呼唤起另一种生灵。
        - id: ch03-b23
          speaker: girl_fish
          text: 蟾蜍，来吧！
        - id: ch03-b24
          speaker: narrator
          text: 她果然变成蟾蜍，出发去找星光王冠。没走多远，眼前出现一潭清水。星星映在水里，亮得好像真能伸手摸到，再捧进掌心。她低下头，把随身的袋子装满闪亮的潭水。回到城堡，她用水中倒映的星星编成一顶王冠。随后，她像先前一样叫来鹦鹉的形体，走进巨人的房间。
        - id: ch03-b25
          speaker: girl_fish
          text: 这是你要的王冠。
        - id: ch03-b26
          speaker: narrator
          text: 巨人看见它，也忍不住大声赞叹。他知道自己输了，手里捧着星星花冠，转向姑娘。
        - id: ch03-b27
          speaker: giant
          text: 你的本领比我大。把王冠拿走吧，这是你堂堂正正赢来的！
        - id: ch03-b28
          speaker: narrator
          text: 鹦鹉当然不用等巨人再说第二遍。她立刻抓住王冠，跃上窗台，叫来猴子的形体。对猴子来说，顺着树爬进庭院连半分钟都用不了。落到地上，她又变成小蚂蚁，开始爬那堵高墙。王冠也随着她的身体缩小，几乎看不见了。她紧紧抱住王冠，终于逃出城堡，心里别提多高兴了。
        - id: ch03-b29
          speaker: girl_fish
          text: 鹿儿，来吧！
        - id: ch03-b30
          speaker: narrator
          text: 王冠和蚂蚁一同变大。世上大概没有鹿跑得像她这样快。她不停地向前奔去，飞跃一道道河流，撞开一丛丛纠缠的灌木，直到海水终于出现在眼前。
        - id: ch03-b31
          speaker: girl_fish
          text: 鱼儿，来吧！
        - id: ch03-b32
          speaker: narrator
          text: 她纵身跃进海里，又恢复了鱼的模样。她贴着海底一路游向宫殿。女王和所有鱼儿都聚在那里，眼巴巴地盼着她回来。
    - id: ch04
      title: 海底的等待
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 小鱼离开以后，一个钟头仿佛也有一天那么长。大家都焦急地等着。等候中的人总觉得时间过得特别慢，许多同伴已经完全不抱希望了。
        - id: ch04-b02
          speaker: fish_1
          text: 我在这儿待腻了，真想看看上面的世界出了什么事。那条鱼走了怕有好几个月了吧。
        - id: ch04-b03
          speaker: fish_2
          text: 那件事太难了。巨人一定已经杀了她，不然她早就回来了。
        - id: ch04-b04
          speaker: fish_3
          text: 陆地上的小飞虫该孵出来了。它们肯定会被河里的鱼全吃光，真叫人着急！
        - id: ch04-b05
          speaker: fish_4
          text: 瞧，快瞧！那个亮闪闪的东西是什么？它正飞快地朝我们过来！
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: 女王激动得猛然起身，直立在尾巴上。鱼群顿时安静下来，连几个不停抱怨的也闭上了嘴，和大家一样凝神望去。那个亮点越来越近，原来正是小鱼。她嘴里紧紧衔着王冠，一刻不停地朝宫殿游来。别的鱼纷纷退到两边，为她让出一条路。
        - id: ch04-b07
          speaker: narrator
          text: 小鱼一直游到女王面前。女王弯下身，从她嘴里接过王冠，戴在自己头上。奇妙的事立刻发生了。她的鱼尾脱落了。不，与其说是脱落，不如说它从中分开，慢慢长成两条腿，还有世上最秀美的一双脚。围在她身边的女官们也纷纷褪去鳞片，重新变回了姑娘。
        - id: ch04-b08
          speaker: narrator
          text: 大家先彼此打量，又一起望向那条小鱼。她也恢复了姑娘的模样，而且比她们任何一个都美丽。
        - id: ch04-b09
          speakers: [fish_1, fish_2, fish_3]
          ensemble: chorus
          text: 是你还给了我们人生，是你，是你！
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: 她们欢喜得全都哭了。随后，众人一起回到陆地，又回到女王从前居住的王宫。高兴之下，谁也没再想起那座孤零零留在海底的宫殿。
        - id: ch04-b11
          speaker: narrator
          text: 她们离开得实在太久，回去以后才发现，世间已经有了许多变化。女王的丈夫，那位王子，几年前便去世了。如今坐在王位上的，是已经长大成人的儿子。母亲失而复得，他心里当然充满喜悦，可他的脸上始终带着一层散不去的忧愁。
    - id: ch05
      title: 森林里的那双眼睛
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 女王终于再也忍不住，便请儿子陪她到花园里走走。母子俩一同坐进一座茉莉花亭。女王初为新娘时，曾在这里度过许多漫长的时光。她握着儿子的手，恳求他讲出忧愁的缘故。
        - id: ch05-b02
          speaker: fish_queen
          text: 只要我能让你幸福，不管是什么，我都会给你。
        - id: ch05-b03
          speaker: prince
          text: 没有用，谁也帮不了我。我只能一个人忍着。
          emotion: sad
        - id: ch05-b04
          speaker: fish_queen
          text: 那也让我替你分担一点吧。
        - id: ch05-b05
          speaker: prince
          text: 谁也分担不了。我爱上了一个永远娶不到的对象，只能这样把日子过下去。
          emotion: sad
        - id: ch05-b06
          speaker: fish_queen
          text: 也许没有你想得那么不可能。先告诉我，你爱上了谁？
        - id: ch05-b07
          speaker: narrator
          text: 两人沉默了片刻。王子把头转向一旁，轻声说出了秘密。
        - id: ch05-b08
          speaker: prince
          text: 我爱上了一头美丽的鹿！
        - id: ch05-b09
          speaker: fish_queen
          text: 原来只是这件事！
          emotion: happy
        - id: ch05-b10
          speaker: narrator
          text: 女王高兴极了，断断续续地告诉儿子，他当时猜得没错。森林里的那头鹿并不是真正的鹿，而是个中了魔法的姑娘。正是她历尽艰险取回王冠，让女王和女官们恢复人形，又把她们送回亲人身边。
        - id: ch05-b11
          speaker: fish_queen
          text: 她就在这里，就在我的王宫里。我带你去见她。
        - id: ch05-b12
          speaker: narrator
          text: 可当王子真的站在姑娘面前，看见她比自己梦见过的一切都美丽，忽然失去了所有勇气，只会低着头站在那里。
        - id: ch05-b13
          speaker: narrator
          text: 姑娘走近王子，抬眼望着他。那双眼睛，正是那天森林里鹿的眼睛。她轻轻开口。
        - id: ch05-b14
          speaker: girl_fish
          text: 请您开恩，让我走吧，别杀我。
        - id: ch05-b15
          speaker: narrator
          text: 王子想起了那天的话，心里盛满幸福。他的母亲女王站在一旁，望着两人微笑。
