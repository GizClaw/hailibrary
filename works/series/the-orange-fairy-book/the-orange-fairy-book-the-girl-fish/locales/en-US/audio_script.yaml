  chapters:
    - id: ch01
      title: The Fish's Warning
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Once, beside a stream, a man and woman lived with their only daughter. She was so pretty, and so dearly loved, that her parents could never bring themselves to punish her when she behaved badly. They did not even teach her good manners. If her mother asked for help cooking dinner or washing the plates, the girl laughed in her face. She spent every day dancing and playing with friends. As far as helping her parents went, they might just as well have had no daughter at all."
        - id: ch01-b02
          speaker: narrator
          text: "One morning, though, her mother looked so tired that even this selfish girl noticed. She asked whether there was something she could do so her mother might rest. The poor woman was surprised and grateful. Her daughter felt ashamed and would gladly have scrubbed the whole house just then. But Mother asked only one thing. The fishing net had holes in it, and Father meant to fish that night. Would she take it to the riverbank and mend it?"
        - id: ch01-b03
          speaker: narrator
          text: "The girl worked hard until every hole was closed. She enjoyed herself too, because everyone passing by stopped to chat. By the time the sun stood high overhead, she was folding the net to take it home. Then came a splash behind her. A large fish leaped from the water. She grabbed the net with both hands, cast it over the widening rings, and pulled the fish out more by luck than skill."
        - id: ch01-b04
          speaker: girl
          text: "Well, aren't you a beauty!"
        - id: ch01-b05
          speaker: magic_fish
          text: "You had better let me live. Kill me, and I will turn you into a fish too."
        - id: ch01-b06
          speaker: narrator
          text: "The girl only laughed at the warning. She ran straight home to her mother."
        - id: ch01-b07
          speaker: girl
          text: "Look what I caught! It almost seems a shame to eat this one. It can talk, and it says that if I kill it, I'll become a fish too."
        - id: ch01-b08
          speaker: mother
          text: "Oh, take it back! Please take it back! It may know magic. Your father and I would both die if anything happened to you."
          emotion: fearful
        - id: ch01-b09
          speaker: girl
          text: "Don't be silly, Mother. How could a creature like that have any power over me? Besides, I'm hungry. If dinner isn't ready soon, I'll be cross."
        - id: ch01-b10
          speaker: narrator
          text: "She went off to gather flowers for her hair. About an hour later, a horn sounded to announce dinner."
        - id: ch01-b11
          speaker: girl
          text: "Didn't I tell you that fish would taste delicious?"
        - id: ch01-b12
          speaker: narrator
          text: "She plunged her spoon into the dish and took a large piece. The instant it touched her mouth, a cold shiver ran through her. Her head grew flat, and her eyes seemed to turn toward the corners. Her arms and legs stuck fast against her sides. She gasped wildly for air. Then, with one mighty bound, she flew through the window and fell into the river. At once she felt better. She swam downstream and soon reached the nearby sea."
        - id: ch01-b13
          speaker: narrator
          text: "The other fishes noticed her sad face as soon as she arrived. They crowded around the newcomer and begged her to tell them what had happened."
        - id: ch01-b14
          speaker: girl
          text: "I'm not a fish at all. I'm a girl, or at least I was one only a few minutes ago. I only..."
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: "She swallowed mouthfuls of salt water as she spoke. No one learns to be a proper fish in a moment. Then she dipped her head beneath the waves so the others would not see her cry."
        - id: ch01-b16
          speaker: old_tunny
          text: "You didn't believe the fish you caught could carry out its threat. Never mind. The same thing happened to all of us, and life here is not so bad. Come with us to meet our queen. Her palace is finer than anything the queens on land possess."
        - id: ch01-b17
          speaker: narrator
          text: "The newcomer feared the journey, but she feared being left alone even more. She waved her tail to show that she agreed, and hundreds of fishes set out together."
    - id: ch02
      title: The Queen Beneath the Sea
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "People on the rocks and aboard ships watched the fishes pass. They pointed out the splendid shoal to one another, but they never guessed it was hurrying toward a queen's palace. People on land know very little about what happens at the bottom of the sea. Until that day, the girl had known no more than they did. She had watched jellyfish and nautiluses swimming just below the surface, with beautifully colored seaweed drifting around them. That was all. Now she followed the shoal down into deeper water, and strange sights opened before her."
        - id: ch02-b02
          speaker: narrator
          text: "Wedges of gold lay below. Great anchors, heaps of pearls, priceless stones, and forgotten jewels were scattered across the seabed as if they meant nothing. There were dead men's bones too, and long white creatures that had never seen daylight. Most of them lived deep inside cracks in the rocks, where no ray of sun could reach. At first the green dimness made the little fish feel blind as well. Slowly, one shape after another came into view. By the time she had been swimming for several hours, everything around her looked clear."
        - id: ch02-b03
          speaker: big_fish
          text: "At last, we're here! Down in that deep valley is the queen's palace. Even the emperor has nothing so grand."
        - id: ch02-b04
          speaker: girl
          text: "It truly is beautiful."
        - id: ch02-b05
          speaker: narrator
          text: "She could barely speak, for she was exhausted from trying to swim as fast as the others. And the palace truly was more beautiful than words could say. Its walls were made of pale pink coral, polished smooth by the moving water. Row upon row of pearls framed every window. The great doors stood open, and the whole shoal floated through them into the audience chamber. There sat their queen on a throne made from a green-and-blue shell. She had a fish's tail, but above it she still had the face and body of a woman."
        - id: ch02-b06
          speaker: fish_queen
          text: "Who are you, and where have you come from?"
        - id: ch02-b07
          speaker: narrator
          text: "The other fishes pushed the newcomer forward. In a low, trembling voice, she told the queen everything that had happened. When the tale was over, the queen answered her."
        - id: ch02-b08
          speaker: fish_queen
          text: "I too was once a girl. My father ruled a great country. When a husband was chosen for me, my mother set her crown on my head on my wedding day. She told me that while I wore it, I would remain a queen. For many months I was completely happy, especially after I had a little son to play with."
        - id: ch02-b09
          speaker: fish_queen
          text: "Then one morning, as I walked in my gardens, a giant came and tore the crown from my head. He held me fast and said he would give it to his daughter. He would enchant my husband, the prince, so that he could not tell her from me. His daughter has taken my place ever since."
        - id: ch02-b10
          speaker: fish_queen
          text: "I was so wretched that I threw myself into the sea. My ladies loved me and said they would die with me. Instead, a wizard took pity on us and changed us all into fishes. He allowed me to keep a woman's face and body, but we must remain this way until someone brings my crown back."
          emotion: sad
        - id: ch02-b11
          speaker: girl
          text: "Tell me what to do, and I'll bring it back!"
        - id: ch02-b12
          speaker: narrator
          text: "The little fish would have promised anything if it might carry her back to the world above."
        - id: ch02-b13
          speaker: fish_queen
          text: "Yes. I will tell you."
        - id: ch02-b14
          speaker: narrator
          text: "The queen sat silent for a moment before she continued."
        - id: ch02-b15
          speaker: fish_queen
          text: "You will be safe if you follow my advice. Return to land and climb a high mountain. The giant has built his castle at the top. You will find him on the steps, mourning his daughter. She died while the prince was away hunting, and before her death she sent my crown back to her father with a faithful servant."
        - id: ch02-b16
          speaker: fish_queen
          text: "Be careful. If the giant sees you, he may kill you. I will give you the power to become any creature that can help you. Strike your forehead and call out the creature's name."
    - id: ch03
      title: The Deer on the Mountain
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "The journey back to land seemed much shorter than the first journey beneath the sea. Once she reached the shore, the fish remembered the queen's instructions and struck her forehead sharply with her tail."
        - id: ch03-b02
          speaker: girl
          text: "Deer, come to me!"
        - id: ch03-b03
          speaker: narrator
          text: "The small, slippery body vanished. In its place stood a beautiful deer with branching antlers and long, slender legs. Her whole body quivered with the longing to be off. She threw back her head, breathed in the air, and broke into a run. Rivers and walls lay between her and the mountain, but she cleared each one with an easy leap."
        - id: ch03-b04
          speaker: narrator
          text: "The king's son had been hunting since daybreak without killing a thing. He was resting beneath a tree when the deer crossed his path, and at once he decided he must have her. He flung himself onto his horse, and the horse flew after her like the wind. The prince had often hunted in that forest. He knew all its shortcuts, and by using them he finally drew alongside the panting deer."
        - id: ch03-b05
          speaker: girl
          text: "Please let me go. Do not kill me. I still have a long way to run and an important task ahead."
        - id: ch03-b06
          speaker: narrator
          text: "Tears stood in her eyes. The prince was too astonished to answer. The deer cleared the next wall and soon disappeared. He drew rein and made no attempt to follow."
        - id: ch03-b07
          speaker: prince
          text: "That cannot truly be a deer. No deer ever had eyes like hers. She must be an enchanted maiden, and I will marry her or no one."
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: "He turned his horse and rode slowly back to the palace. The deer reached the giant's castle quite breathless. Her heart sank when she saw the tall, smooth walls surrounding it. Then she gathered her courage."
        - id: ch03-b09
          speaker: girl
          text: "Ant, come to me!"
        - id: ch03-b10
          speaker: narrator
          text: "The antlers and graceful body disappeared. A tiny brown ant, almost impossible to see, began climbing the wall. To her, it must have seemed miles high. Even so, she reached the top in an astonishingly short time and descended into the courtyard."
        - id: ch03-b11
          speaker: narrator
          text: "She paused in the courtyard to decide what she should do next and looked carefully around. A tall tree grew close beside one of the walls. In the corner above it was a window, almost level with the tree's highest branches. That gave her a way inside."
        - id: ch03-b12
          speaker: girl
          text: "Monkey, come to me!"
        - id: ch03-b13
          speaker: narrator
          text: "In an instant, a monkey swung from the topmost branches through the window. The giant lay inside, snoring."
        - id: ch03-b14
          speaker: girl
          text: "If he wakes and sees me like this, he may be frightened to death. Then I'll never get the crown. I had better become something else. Parrot, come to me!"
        - id: ch03-b15
          speaker: narrator
          text: "A pink-and-gray parrot hopped toward the giant. He began to stretch and yawn so mightily that the whole castle shook. The parrot waited until he was fully awake. Then she spoke boldly."
        - id: ch03-b16
          speaker: girl
          text: "I have come for the crown. It is no longer yours, now that your daughter the queen is dead."
        - id: ch03-b17
          speaker: narrator
          text: "At those words, the giant sprang out of bed with an angry roar. He lunged at the parrot, meaning to wring her neck between his enormous hands. The bird was much too quick for him. She darted behind his back before he could close his fingers around her."
        - id: ch03-b18
          speaker: girl
          text: "Wait! Killing me will do you no good."
        - id: ch03-b19
          speaker: giant
          text: "True enough. But I am not fool enough to hand over that crown for nothing. Let me decide what you must give me for it."
        - id: ch03-b20
          speaker: narrator
          text: "He scratched his huge head for several minutes. A giant's thoughts move slowly. At last, his face brightened."
        - id: ch03-b21
          speaker: giant
          text: "Yes, this will do! Bring me a necklace of blue stones from the Arch of Saint Martin in the Great City, and the crown is yours."
    - id: ch04
      title: The Necklace of Blue Stones
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "When she was a girl, the parrot had often heard of that marvelous arch in the Great City. Precious stones and beautiful marbles had been set right into it. Removing the blue stones from the building itself sounded like very difficult work. Still, everything had gone well with her so far. She could do no more than try. She bowed to the giant and made her way back to the window, where he could no longer see her."
        - id: ch04-b02
          speaker: girl
          text: "Eagle, come to me!"
        - id: ch04-b03
          speaker: narrator
          text: "Before she reached the tree, strong wings lifted her. They could have carried her to the clouds. She became a speck in the sky and swept onward until the Arch of Saint Martin appeared far below, shining in the sun."
        - id: ch04-b04
          speaker: narrator
          text: "The eagle swooped down toward the arch. She hid behind one of its great supporting walls, where nobody below could detect her. Then she set to work with her beak, digging out the nearest blue stones one by one. The work was even harder than she had expected. She kept at it until the last stone came free, and then hope rose in her heart."
        - id: ch04-b05
          speaker: narrator
          text: "She took a piece of string she had found hanging from a tree. While she rested, she threaded the stones onto it. When the necklace was complete, she hung it around her neck."
        - id: ch04-b06
          speaker: girl
          text: "Parrot, come to me!"
        - id: ch04-b07
          speaker: narrator
          text: "A little later, the pink-and-gray parrot stood before the giant once more."
        - id: ch04-b08
          speaker: girl
          text: "Here is the necklace you demanded."
        - id: ch04-b09
          speaker: narrator
          text: "The giant's eyes gleamed as he took the heap of blue stones. Even then, he had no intention of surrendering the crown."
        - id: ch04-b10
          speaker: giant
          text: "These stones are not nearly as blue as I expected. You must bring me something else for the crown you want so badly. Fail this time, and you will lose not only the crown but your life."
        - id: ch04-b11
          speaker: narrator
          text: "The parrot knew perfectly well that he was lying about the stones."
        - id: ch04-b12
          speaker: girl
          text: "What do you want me to bring now?"
        - id: ch04-b13
          speaker: giant
          text: "If I give away my crown, I must receive one even finer. This time, bring me a crown made of stars."
    - id: ch05
      title: The Crown of Stars
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "The parrot turned away. As soon as she was outside, she spoke under her breath."
        - id: ch05-b02
          speaker: girl
          text: "Toad, come to me!"
        - id: ch05-b03
          speaker: narrator
          text: "She became a toad and set off in search of the starry crown. She had not gone far before she found a clear pool. The stars were reflected there so brightly that they looked real enough to touch and hold. The toad bent down and filled a bag she was carrying with the shining water. Then she returned to the castle and wove a crown from those reflected stars."
        - id: ch05-b04
          speaker: girl
          text: "Parrot, come to me!"
        - id: ch05-b05
          speaker: narrator
          text: "Once again in the form of a parrot, she entered the giant's room."
        - id: ch05-b06
          speaker: girl
          text: "Here is the crown you asked me to bring."
        - id: ch05-b07
          speaker: narrator
          text: "This time, the giant cried out in admiration. He knew she had beaten him. Still holding the circlet of stars, he faced her."
        - id: ch05-b08
          speaker: giant
          text: "Your magic is stronger than mine. Take the crown. You have earned it fairly!"
          emotion: surprised
        - id: ch05-b09
          speaker: narrator
          text: "The parrot needed no second invitation. She seized the true crown and sprang onto the window ledge."
        - id: ch05-b10
          speaker: girl
          text: "Monkey, come to me!"
        - id: ch05-b11
          speaker: narrator
          text: "As a monkey, she climbed down the tree and reached the courtyard in less than half a minute."
        - id: ch05-b12
          speaker: girl
          text: "Ant, come to me!"
        - id: ch05-b13
          speaker: narrator
          text: "A tiny ant began crawling up the towering wall. How glad she was to reach the top and leave the giant's castle behind! All the while, she held tightly to the crown. It had shrunk until it was almost nothing when she became an ant. As soon as she called for her next shape, it grew large again with her."
        - id: ch05-b14
          speaker: girl
          text: "Deer, come to me!"
        - id: ch05-b15
          speaker: narrator
          text: "No deer had ever run faster. On and on she bounded, crossing rivers and crashing through tangled growth until she came to the sea."
        - id: ch05-b16
          speaker: girl
          text: "Fish, come to me!"
        - id: ch05-b17
          speaker: narrator
          text: "She plunged into the water and swam along the seabed toward the palace. There, the queen and all the fishes had gathered to wait for her."
    - id: ch06
      title: The Crown Restored
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "The hours had passed very slowly, as they always do for those who wait. Many of the fishes had already lost hope."
        - id: ch06-b02
          speaker: fish_one
          text: "I'm tired of waiting here. I want to know what's happening in the world above. That fish must have been gone for months by now."
        - id: ch06-b03
          speaker: narrator
          text: "The beautiful little speaker changed color with every movement. Another fish was just as gloomy."
        - id: ch06-b04
          speaker: fish_two
          text: "The task was terribly hard. The giant must have killed her. Otherwise, she would have returned long ago."
        - id: ch06-b05
          speaker: fish_three
          text: "The young flies must be coming out now, and the river fish will eat every one of them. It really is too bad!"
        - id: ch06-b06
          speaker: fish_four
          text: "Look! Look over there! What is that bright thing rushing toward us?"
          emotion: surprised
        - id: ch06-b07
          speaker: narrator
          text: "The queen sprang up and stood upright on her tail, so great was her excitement. Silence fell across the whole crowd. Even the grumblers held their peace and stared with everyone else. Nearer and nearer came the girl-fish, gripping the crown tightly in her mouth. The others drew back on either side to let her pass."
        - id: ch06-b08
          speaker: narrator
          text: "She swam straight to the queen. The queen bent down, took the crown, and placed it on her own head. Then a wonder happened. Her tail fell away, or rather, it divided and became two legs with the prettiest pair of feet in the world. Around her, the maidens shed their scales and became girls once more."
        - id: ch06-b09
          speaker: narrator
          text: "First they all stared at one another. Then they turned to the little fish. She too had regained her human form, and she was more beautiful than any of them."
        - id: ch06-b10
          speakers: [maiden_one, maiden_two, maiden_three]
          ensemble: chorus
          text: "You gave us our lives back. You did it!"
          emotion: happy
        - id: ch06-b11
          speaker: narrator
          text: "They wept for sheer joy. Then everyone returned to the world above and to the queen's home, forgetting the palace beneath the sea where they had lived for so long. They had been away from their own country for so many years that much had changed in their absence. The queen's husband, the prince, had died years before. Their little son had grown all the way to manhood, and now he was king in his father's place."
    - id: ch07
      title: The Enchanted Maiden
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: "The young king rejoiced when he saw his mother again, yet even in his happiness, sadness still hung over him. At last, the queen could bear the sight of it no longer. She asked him to walk with her in the garden. They sat together in a jasmine bower where she herself had spent many hours when she was a bride. She took her son's hand and begged him to tell her what caused his sorrow."
        - id: ch07-b02
          speaker: fish_queen
          text: "If there is any way for me to give you happiness, I will do it."
        - id: ch07-b03
          speaker: prince
          text: "It is no use. No one can help me. I must carry this sorrow alone."
          emotion: sad
        - id: ch07-b04
          speaker: fish_queen
          text: "Then at least allow me to share your grief."
        - id: ch07-b05
          speaker: prince
          text: "No one can share it. I love someone I can never marry, and somehow I must live with that."
          emotion: sad
        - id: ch07-b06
          speaker: fish_queen
          text: "Perhaps it is not as hopeless as you believe. Tell me who it is."
        - id: ch07-b07
          speaker: narrator
          text: "For a moment, neither spoke. Then the young king turned his head away and answered softly."
        - id: ch07-b08
          speaker: prince
          text: "I have fallen in love with a beautiful deer."
        - id: ch07-b09
          speaker: fish_queen
          text: "Oh, if that is all!"
          emotion: happy
        - id: ch07-b10
          speaker: narrator
          text: "In broken, joyful words, she explained that he had guessed correctly. The deer was an enchanted maiden. She was the one who had recovered the stolen crown and brought the queen home."
        - id: ch07-b11
          speaker: fish_queen
          text: "She is here in my palace. Come, and I will take you to her."
        - id: ch07-b12
          speaker: narrator
          text: "But when the young king stood before the girl, she was lovelier than anything he had ever imagined. All his courage left him, and he stood with his head bowed."
        - id: ch07-b13
          speaker: narrator
          text: "The maiden came closer. As she looked at him, he saw the same eyes that had met his in the forest. She whispered to him."
        - id: ch07-b14
          speaker: girl
          text: "Please let me go. Do not kill me."
        - id: ch07-b15
          speaker: narrator
          text: "The young king remembered those words. Happiness filled his heart, and his mother watched them with a smile."
