audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "steady, vivid folktale storytelling"
        timbre: "warm and resonant"
        pace: "measured"
        pitch: "medium"
    jackal:
      display_name: Jackal's Eldest Son
      tts:
        delivery: "smooth, sociable, and slyly self-assured"
        timbre: "bright and agile"
        pace: "lively"
        pitch: "medium"
    first_hyena:
      display_name: Jackal's Hyena Friend
      tts:
        delivery: "blunt, wary, and easily provoked"
        timbre: "rough and nasal"
        pace: "steady"
        pitch: "medium-low"
    judge_lion:
      display_name: Lion Judge
      tts:
        delivery: "commanding, ceremonial, and shrewd"
        timbre: "deep and resonant"
        pace: "deliberate"
        pitch: "low"
    hunting_lion:
      display_name: Hunting Lion
      tts:
        delivery: "proud, forceful, and quick-tempered"
        timbre: "powerful and gravelly"
        pace: "measured"
        pitch: "low"
    second_hyena:
      display_name: Hunting Hyena
      tts:
        delivery: "eager, practical, and unwisely confident"
        timbre: "coarse and dry"
        pace: "brisk"
        pitch: "medium-low"
    hedgehog:
      display_name: Hedgehog
      tts:
        delivery: "small, cautious, and quietly calculating"
        timbre: "light and textured"
        pace: "measured"
        pitch: "medium-high"
  chapters:
    - id: ch01
      title: The Green Cloak
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "The old jackal was dead, but he had left two sons behind, and both were every bit as cunning and tricky as their father. The elder son was a fine, handsome creature. His pleasant ways won him many friends, and he spent more time with a certain hyena than with anyone else."
        - id: ch01-b02
          speaker: narrator
          text: "One day, as the jackal and the hyena walked together, they found a beautiful green cloak. Someone riding a camel across the plain must have dropped it. Each wanted the cloak for himself, and neither was willing to give it up. They came close to quarreling. In the end, they agreed that the hyena would wear it by day and the jackal by night."
        - id: ch01-b03
          speaker: narrator
          text: "Before long, that bargain no longer pleased the jackal. His friends were not the same as the hyena's friends, he said, so none of them ever saw how splendid he looked in the cloak. It was only fair that he should sometimes wear it during the day. The hyena refused, and another quarrel was about to begin. Then the hyena suggested that the lion should settle the matter. The jackal agreed. The hyena wrapped himself in the cloak, and together they trotted to the lion's den."
        - id: ch01-b04
          speaker: narrator
          text: "The talkative jackal told the whole story at once. When he had finished, the lion turned to the hyena."
        - id: ch01-b05
          speaker: judge_lion
          text: "Is everything he says true?"
        - id: ch01-b06
          speaker: first_hyena
          text: "Yes, Your Majesty. Every word of it."
        - id: ch01-b07
          speaker: judge_lion
          text: "Then spread the cloak on the ground before me, and I will decide who gets it."
        - id: ch01-b08
          speaker: narrator
          text: "The hyena laid the green cloak on the red earth. He and the jackal stood on either side while the lion sat silent for a few moments. At last, the lion straightened himself and looked very grand and wise."
        - id: ch01-b09
          speaker: judge_lion
          text: "Here is my judgment. The cloak will belong entirely to whichever of you first rings the bell of the nearest mosque at dawn tomorrow. Now go. I have a great deal of business waiting for me."
        - id: ch01-b10
          speaker: narrator
          text: "The mosque stood close by. All night, the hyena stayed awake, afraid that the jackal might reach its bell first. At the first pale streak of dawn, he bounded away toward it. The jackal, who had slept soundly through the night, was only just getting to his feet."
        - id: ch01-b11
          speaker: jackal
          text: "Good luck!"
        - id: ch01-b12
          speaker: narrator
          text: "The moment the hyena was gone, the jackal tossed the cloak over his own back and raced across the plain. His friend never saw him again."
    - id: ch02
      title: The Lion's Dinner
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "After several miles, the jackal decided he was safe from pursuit. Then he saw another lion and another hyena deep in conversation, and he wandered over to join them."
        - id: ch02-b02
          speaker: jackal
          text: "Good morning. What has made you both look so serious?"
        - id: ch02-b03
          speaker: hunting_lion
          text: "Sit down with us. We are trying to choose the best place to find our dinner. The hyena wants to search the forest, but I say we should go to the mountains. What do you think?"
        - id: ch02-b04
          speaker: jackal
          text: "Well, while I was crossing the plain, I saw a flock of sheep at pasture. A few have strayed into a little valley where the shepherd cannot see them. If you stay among the rocks, no one will notice you. Perhaps I might come and show you the way."
        - id: ch02-b05
          speaker: hunting_lion
          text: "That is very kind of you."
        - id: ch02-b06
          speaker: narrator
          text: "They crept carefully onward until they reached the valley mouth. There, on the rich grass, a ram, a sheep, and a lamb grazed without knowing the danger was near. The lion whispered to the hyena."
        - id: ch02-b07
          speaker: hunting_lion
          text: "How should we divide the three?"
        - id: ch02-b08
          speaker: second_hyena
          text: "That's simple. I'll take the lamb, the jackal can have the sheep, and the ram is yours."
        - id: ch02-b09
          speaker: hunting_lion
          text: "So you mean to give me that lean animal made of little but horns? I'll teach you to divide a meal like that!"
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: "The furious lion struck the hyena twice with his great paws. In a moment, the hyena lay dead. Then the lion faced the jackal."
        - id: ch02-b11
          speaker: hunting_lion
          text: "And how would you divide them?"
        - id: ch02-b12
          speaker: jackal
          text: "Not as the hyena did. You can eat the lamb for breakfast, the sheep for dinner, and the ram for supper."
        - id: ch02-b13
          speaker: hunting_lion
          text: "Why, you are wonderfully clever! Who taught you to be so wise?"
          emotion: surprised
        - id: ch02-b14
          speaker: jackal
          text: "The hyena's fate taught me."
        - id: ch02-b15
          speaker: narrator
          text: "The jackal laughed and fled as fast as he could, for he had spotted two men with spears coming up close behind the lion."
    - id: ch03
      title: The Pots of Butter
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "He kept running until his legs would carry him no farther. Panting for breath, he threw himself down beneath a tree. A rustle came from the grass, and out stepped the hedgehog, an old friend of his father's."
        - id: ch03-b02
          speaker: hedgehog
          text: "Oh, it's you! How strange to meet so far from home."
          emotion: surprised
        - id: ch03-b03
          speaker: jackal
          text: "I have only just escaped with my life, and I need to sleep. After that, we must find something amusing to do."
        - id: ch03-b04
          speaker: narrator
          text: "The jackal lay down again and slept deeply for two hours. When he awoke, he was ready for adventure."
        - id: ch03-b05
          speaker: jackal
          text: "Well, have you thought of anything?"
        - id: ch03-b06
          speaker: hedgehog
          text: "Beyond those trees, there is a little farmhouse where they make the finest butter in the world. In an hour, the farmer's wife will leave to milk the cows, which she keeps some distance away. I know exactly how things are done there. We can climb through the window of the butter shed. First I will keep watch while you eat, and then you can watch while I have my share."
        - id: ch03-b07
          speaker: jackal
          text: "That sounds like a fine plan."
        - id: ch03-b08
          speaker: narrator
          text: "They set off together. But when they arrived at the farmhouse, the jackal changed the plan."
        - id: ch03-b09
          speaker: jackal
          text: "You go inside and bring out the butter pots. I'll hide them somewhere safe."
        - id: ch03-b10
          speaker: hedgehog
          text: "Oh, no, I couldn't do that! They would discover the theft at once. Besides, carrying off whole pots is nothing like slipping in for a little taste now and then."
        - id: ch03-b11
          speaker: jackal
          text: "Do exactly what I told you, and do it now."
        - id: ch03-b12
          speaker: narrator
          text: "The jackal looked at him so sternly that the little hedgehog did not dare argue. He rolled the jars to the window, and the jackal lifted them out one after another. Soon every pot stood in a row outside. Then the jackal suddenly started."
        - id: ch03-b13
          speaker: jackal
          text: "Run for your life! The woman is coming over the hill!"
          emotion: fearful
        - id: ch03-b14
          speaker: narrator
          text: "With his heart pounding, the hedgehog hurried away as fast as he could. The jackal stayed behind, trembling with laughter. There was no woman anywhere in sight. He had frightened the hedgehog away so that his companion would never learn where the butter was buried. After that, the jackal visited the hiding place every day and feasted on the butter alone."
    - id: ch04
      title: The Hedgehog Grows Suspicious
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "At last, one morning, the hedgehog asked the question he had been holding back."
        - id: ch04-b02
          speaker: hedgehog
          text: "You never told me what you did with all those jars."
        - id: ch04-b03
          speaker: jackal
          text: "I hid them safely until the people at the farm forget about them. They're still searching, so we must wait a little longer. Then I'll bring the jars home, and we'll share everything between us."
        - id: ch04-b04
          speaker: narrator
          text: "The hedgehog waited, and then he waited some more. Whenever he asked whether they could fetch the butter yet, the jackal found another excuse. Before long, the hedgehog began to suspect the truth."
        - id: ch04-b05
          speaker: hedgehog
          text: "I want to know where you put those jars. Tonight, when it is completely dark, you must show me the hiding place."
        - id: ch04-b06
          speaker: jackal
          text: "I can't possibly tell you. You talk so much that you would share the secret with someone. Then all our work would be wasted, and the farmer might break our necks as well. I can see that he is losing heart. Soon he will stop looking. Just be patient a little longer."
        - id: ch04-b07
          speaker: narrator
          text: "The hedgehog said nothing more and acted as if that answer satisfied him. Several days later, the jackal came home from a hunt that had lasted for hours. He fell into a deep sleep. The hedgehog shook him awake."
        - id: ch04-b08
          speaker: hedgehog
          text: "I have just received word from my family. They are giving a banquet tomorrow, and they want you to come. Will you join us?"
        - id: ch04-b09
          speaker: jackal
          text: "Of course. I'd be delighted. I have to go out in the morning, though, so meet me on the road."
        - id: ch04-b10
          speaker: hedgehog
          text: "That will suit me very well."
        - id: ch04-b11
          speaker: narrator
          text: "The jackal went straight back to sleep, for he had to rise early."
    - id: ch05
      title: The Banquet Trap
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "The next day, the hedgehog reached their meeting place at exactly the appointed time. The jackal was nowhere to be seen, so he sat down to wait. At last, the jackal's dusky yellow shape appeared around the corner."
        - id: ch05-b02
          speaker: hedgehog
          text: "There you are! I had almost stopped waiting for you. In fact, I nearly wish you hadn't come, because I don't know where I can hide you."
        - id: ch05-b03
          speaker: jackal
          text: "Why would you need to hide me? What is wrong?"
        - id: ch05-b04
          speaker: hedgehog
          text: "So many guests have brought dogs and mules that it may not be safe for you among them. No, don't run that way! Another band of guests is coming over the hill. Lie down here, and I'll cover you with these sacks. Whatever happens, keep perfectly still if you want to live."
        - id: ch05-b05
          speaker: narrator
          text: "The jackal lay beneath the sacks at the foot of a little hill. Then the hedgehog sent a great stone rolling down the slope. It struck the jackal and crushed him to death."
