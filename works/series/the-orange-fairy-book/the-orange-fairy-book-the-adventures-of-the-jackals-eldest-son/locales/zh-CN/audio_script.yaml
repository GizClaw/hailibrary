audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    jackal:
      display_name: 豺
      tts:
        delivery: 狡黠自信，得意时轻快，受质疑时固执
        timbre: 灵活清亮
        pace: 稍快
        pitch: 中高
    hedgehog:
      display_name: 刺猬
      tts:
        delivery: 谨慎机敏，说话朴实直接
        timbre: 温和细亮
        pace: 适中
        pitch: 中
    hyena:
      display_name: 鬣狗
      tts:
        delivery: 直率自信，遇到利益时寸步不让
        timbre: 粗哑厚实
        pace: 适中
        pitch: 中低
    lion:
      display_name: 狮子
      tts:
        delivery: 威严傲慢，发怒时凌厉有力
        timbre: 低沉洪亮
        pace: 稍慢
        pitch: 低
  chapters:
    - id: ch01
      title: 绿斗篷的裁决
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老豺虽然已经死了，却留下两个儿子。兄弟俩的狡猾诡诈，和父亲相比丝毫不差。长子生得俊美出众，待人又十分和气，因此交了许多朋友。其中和他来往最密切的，是一只鬣狗。
        - id: ch01-b02
          speaker: narrator
          text: 一天，它们一同出去散步，在路上捡到一件漂亮的绿斗篷。看样子，是哪个骑着骆驼穿过平原的人不小心掉下的。两个伙伴当然都想把它据为己有，差点为此吵起来。争了半天，它们总算说定，白天归鬣狗穿，夜里归豺穿。
        - id: ch01-b03
          speaker: narrator
          text: 没过多久，豺就不满意了。他说，两人的朋友根本不是同一群。斗篷到了他手里时已经入夜，他的朋友谁也看不见这件衣裳有多漂亮。所以照公平来说，白天也该偶尔轮到他穿。鬣狗无论如何都不肯。眼看又要争吵，鬣狗提议请狮子评理。豺答应了，鬣狗把斗篷裹到身上，它们一同小跑着去了狮子的洞穴。
        - id: ch01-b04
          speaker: narrator
          text: 豺向来爱说话，一到洞里便抢先把事情从头到尾讲了一遍。狮子耐心听完，转过头去问鬣狗，豺刚才说的是不是真的。
        - id: ch01-b05
          speaker: hyena
          text: 陛下，他说的全是真的。
        - id: ch01-b06
          speaker: lion
          text: 那就把斗篷铺在我脚前。我现在为你们裁决。
        - id: ch01-b07
          speaker: narrator
          text: 鬣狗把斗篷解下来，平平铺在狮子脚前的红土地上。豺和鬣狗站到斗篷两边，谁也没有开口。过了片刻，狮子才直起身来，显得又威严又睿智。
        - id: ch01-b08
          speaker: lion
          text: 明天黎明，谁先敲响最近那座清真寺的钟，斗篷就全归谁。走吧，我还有许多要事！
        - id: ch01-b09
          speaker: narrator
          text: 清真寺就在附近。鬣狗生怕豺先赶到钟前，一整夜都守着没合眼。天边刚露出第一线曙光，他就猛地跳起来，朝那口钟飞奔过去。这时，安安稳稳睡足一夜的豺才慢悠悠地站起身。
        - id: ch01-b10
          speaker: jackal
          text: 祝你好运！
        - id: ch01-b11
          speaker: narrator
          text: 豺把斗篷往背上一披，趁鬣狗忙着敲钟，飞快穿过平原逃走了。从那以后，那位鬣狗朋友再也没有见过他。
    - id: ch02
      title: 狮子的三顿饭
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 豺披着斗篷跑了好几英里，回头不见追兵，这才觉得自己安全了。前面有一只狮子正同另一只鬣狗谈话，他便放慢脚步，若无其事地走过去，凑到它们身边。
        - id: ch02-b02
          speaker: jackal
          text: 早安。你们神情这么认真，是在商量什么事吗？
        - id: ch02-b03
          speaker: lion
          text: 坐下说吧。我们正愁上哪儿才能吃到最好的晚餐。鬣狗想去森林，我想上山。你有什么主意？
        - id: ch02-b04
          speaker: jackal
          text: 我刚才走过平原，看见一群羊在吃草。有几只进了小山谷，牧羊人根本看不见。你们只要贴着岩石走，就不会被发现。我可以带路。
        - id: ch02-b05
          speaker: lion
          text: 你可真热心。
        - id: ch02-b06
          speaker: narrator
          text: 三个伙伴贴着岩石，一路小心地往前潜行，终于来到山谷口。肥美的草地上，一只公羊、一只母羊和一只羊羔还在安静吃草，丝毫不知道危险就在眼前。狮子压低声音，问鬣狗这三只羊该怎么分。
        - id: ch02-b07
          speaker: hyena
          text: 很容易。羊羔给我，母羊给豺，公羊给您。
        - id: ch02-b08
          speaker: lion
          text: 你把那只瘦得只剩一对角的家伙分给我？我来教教你该怎么分！
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: 狮子说完便抡起巨掌，重重打了鬣狗两下。只这两下，鬣狗就倒在地上，当场死去。狮子这才转向豺，问他会怎么分这三只羊。
        - id: ch02-b10
          speaker: jackal
          text: 我的分法可不一样。羊羔给您当早餐，母羊给您当午餐，公羊给您当晚餐。
        - id: ch02-b11
          speaker: lion
          text: 真聪明！是谁教会你这番智慧的？
          emotion: surprised
        - id: ch02-b12
          speaker: jackal
          text: 鬣狗的下场。
        - id: ch02-b13
          speaker: narrator
          text: 豺笑着说完，转身使出全身力气逃走。原来，他说话时已经看见两个手持长矛的男人，正悄悄逼近狮子的身后。
    - id: ch03
      title: 偷来的黄油
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 豺一路不停地狂奔，直到腿再也迈不动，才一头倒在树下，张着嘴直喘气。这时草丛里忽然传来一阵窸窣声，他父亲从前的老朋友刺猬，从草叶间走了出来。
        - id: ch03-b02
          speaker: hedgehog
          text: 原来是你！离家这么远，咱们居然还能遇见。
          emotion: surprised
        - id: ch03-b03
          speaker: jackal
          text: 我刚才差点丢了命，现在得先睡一觉。等我醒来，咱们再想点好玩的事。
        - id: ch03-b04
          speaker: narrator
          text: 豺说完又躺下，沉沉睡了两个钟头。醒来以后，他觉得精神已经恢复，便问刺猬有没有什么好玩的主意。
        - id: ch03-b05
          speaker: hedgehog
          text: 树后那道山谷里有座小农舍，做的黄油是世上最好的。我熟悉他们每天怎么做事。再过一个钟头，农妇就要去挤牛奶，她家的牛养得很远。咱们可以轻轻松松从窗口钻进存黄油的棚屋。你先吃，我替你望风，免得有人突然过来。然后换你望风，让我也好好吃一顿。
        - id: ch03-b06
          speaker: jackal
          text: 这个办法不错，咱们走。
        - id: ch03-b07
          speaker: narrator
          text: 可到了农舍，豺却改了主意。
        - id: ch03-b08
          speaker: jackal
          text: 你进去把黄油罐全搬出来，我来找个安全的地方藏好。
        - id: ch03-b09
          speaker: hedgehog
          text: 这可不行！他们马上就会发现。偶尔吃一点，跟把黄油全搬走，根本不是一回事。
        - id: ch03-b10
          speaker: jackal
          text: 别再说了，立刻照我的话做。
        - id: ch03-b11
          speaker: narrator
          text: 豺严厉地盯着刺猬。小家伙不敢再反对，只好把一罐罐黄油滚到窗前，让豺逐一接出去。等所有罐子排成一行，豺突然装出吃惊的样子。
        - id: ch03-b12
          speaker: jackal
          text: 快逃命！那个女人已经翻过山坡来了！
        - id: ch03-b13
          speaker: narrator
          text: 刺猬吓得心怦怦直跳，头也不回地拼命逃走。豺却留在原地，笑得浑身发抖，因为山坡上根本没有农妇的影子。他只是想独吞黄油，不愿让刺猬知道那些罐子埋在哪里。此后每一天，他都会偷偷溜到藏罐子的地方，独自享用一顿美餐。
        - id: ch03-b14
          speaker: narrator
          text: 一天早晨，刺猬终于问起那些罐子的下落。
        - id: ch03-b15
          speaker: hedgehog
          text: 你还没告诉我，那些黄油后来怎么样了？
        - id: ch03-b16
          speaker: jackal
          text: 我把它们藏得很安全，原想等农舍里的人把这事彻底忘掉。可他们现在还到处找呢，咱们只得多等几天。等风头过去，我就把罐子全带回家，跟你一人一半。
        - id: ch03-b17
          speaker: narrator
          text: 刺猬只好继续等。可他每次问起什么时候能拿到黄油，豺总会找个新借口搪塞。日子一久，刺猬起了疑心。他告诉豺，今天晚上等天全黑了，非得领他去看藏黄油的地方。
        - id: ch03-b18
          speaker: jackal
          text: 我实在不能告诉你。你话太多，准会把秘密告诉别人。那样咱们不但白忙一场，还冒着被农夫打断脖子的危险。我看他已经越来越灰心，很快就会放弃寻找。你再耐心等一小阵吧。
        - id: ch03-b19
          speaker: narrator
          text: 刺猬不再追问，只装出满意的样子。又过了几天，豺在外面打了好几个钟头的猎，回来以后睡得正香。刺猬走到他身边，把他摇醒了。
        - id: ch03-b20
          speaker: hedgehog
          text: 我刚刚得到消息，我家里人明天要办一场宴会。他们也邀请了你。你愿意来吗？
        - id: ch03-b21
          speaker: jackal
          text: 当然愿意。不过我早晨要出门，咱们在路上碰面吧。
        - id: ch03-b22
          speaker: hedgehog
          text: 好，就这么说定了。
        - id: ch03-b23
          speaker: narrator
          text: 豺明早必须早起。和刺猬约好以后，他翻了个身，又沉沉睡了过去。
    - id: ch04
      title: 刺猬的宴会
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天，约定的时刻一到，刺猬便准时来到见面的地方。豺还没到，他只好坐下来等候。过了好一阵，那道暗黄色的身影才终于转过街角。
        - id: ch04-b02
          speaker: hedgehog
          text: 你总算来了！我差点以为你不来了。其实，我现在倒希望你没来，因为我不知道该把你藏在哪儿。
        - id: ch04-b03
          speaker: jackal
          text: 为什么要藏我？究竟出了什么事？
        - id: ch04-b04
          speaker: hedgehog
          text: 许多客人都带了猎犬和骡子，你混在它们中间恐怕不安全。不，别往那边跑，山坡后面还有一队客人正赶过来。你快躺在这里，我拿这些袋子盖住你。无论发生什么，你都千万别动，这样才能保住性命。
        - id: ch04-b05
          speaker: narrator
          text: 豺果然躺到小山包下面，让刺猬把袋子盖满全身。等他一动不动地藏好，刺猬走到高处，推动了一块巨石。石头一路滚下山来，正好压在豺的身上，把他活活压死了。
        - id: ch04-b06
          speaker: narrator
          text: 这个故事出自《柏柏尔故事集》。
