audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    gola:
      display_name: 戈拉
      tts:
        delivery: 慈爱持重，告诫儿子时严肃恳切
        timbre: 苍老浑厚
        pace: 缓慢
        pitch: 低
    mother:
      display_name: 母亲
      tts:
        delivery: 温柔忧伤，话语朴实而坚定
        timbre: 柔和温暖
        pace: 舒缓
        pitch: 中
    adan:
      display_name: 阿丹
      tts:
        delivery: 年轻急躁，自负时直率粗鲁
        timbre: 清亮有力
        pace: 稍快
        pitch: 中
    raven:
      display_name: 科里南克雷格黑乌鸦
      tts:
        delivery: 机敏爽快，报恩时真诚可靠
        timbre: 沙哑清楚
        pace: 轻快
        pitch: 中高
    old_man:
      display_name: 老人
      tts:
        delivery: 神秘睿智，言语温和而有分量
        timbre: 深沉温厚
        pace: 从容
        pitch: 低
    golden_haired_girl:
      display_name: 金发姑娘
      tts:
        delivery: 谨慎善良，劝告时急切真诚
        timbre: 清澈柔和
        pace: 自然
        pitch: 中高
    ruais:
      display_name: 鲁艾斯
      tts:
        delivery: 忧郁急切，决意出发时固执
        timbre: 清朗
        pace: 自然
        pitch: 中
    covan:
      display_name: 褐发科万
      tts:
        delivery: 谦和坚定，遇险时沉着勇敢
        timbre: 年轻清朗
        pace: 稳健
        pitch: 中
    young_man:
      display_name: 陌生年轻人
      tts:
        delivery: 急促狡黠，催促时故作惊慌
        timbre: 尖亮
        pace: 快
        pitch: 中高
    molmor_hound:
      display_name: 莫尔莫尔猎犬
      tts:
        delivery: 豪爽忠诚，承诺时笃定有力
        timbre: 粗厚低沉
        pace: 稳重
        pitch: 低
    duran_otter:
      display_name: 棕水獭多兰
      tts:
        delivery: 亲切灵活，帮助朋友时爽朗可靠
        timbre: 明快圆润
        pace: 轻快
        pitch: 中
  chapters:
    - id: ch01
      title: 浓雾中的失踪
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 西方海岸边，巍峨的群山一直伸进海里。山脚下住着牧羊人戈拉和妻子。他们有三个儿子，还有一个女儿。儿子们常到海上捕鱼，也进山打猎。女儿有时带小山羊上山吃草，有时留在家里帮母亲干活，补一补渔网。
        - id: ch01-b02
          speaker: narrator
          text: 一家人和美地过了好些年。一天，姑娘照常赶着小山羊上山，太阳却突然暗了。一股像浓白雾一样的寒气从海上悄悄爬来，越来越近。姑娘冷得一颤，站起来想叫回羊群，喉咙里却发不出声音，好像有一双强壮的手臂把她死死箍住了。
        - id: ch01-b03
          speaker: narrator
          text: 天色越来越晚，姑娘始终没有回家，海边的小屋里哭声一片。父亲和三个哥哥一次次猛然站起，都以为听见了她的脚步。可四周的黑暗又浓又重，他们连自己的手也看不见，更分不清哪边是河，哪边是山。小山羊一只只回来了。每听见一声咩叫，就有人赶紧跑去开门，可门外总是一片死寂。全家一夜没合眼。第二天清晨，浓雾终于退去，他们先沿着海岸寻找，又登上山野，到处呼唤姑娘，却连她的一点踪迹也没发现。
        - id: ch01-b04
          speaker: narrator
          text: 就这样，一年零一天过去了。戈拉和妻子仿佛一下老了许多，三个儿子也再没有从前那样快活。他们深爱妹妹，从没停止为她伤心，也始终盼着她会回来。终于，长子阿丹开了口。
        - id: ch01-b05
          speaker: adan
          text: 妹妹失踪已经一年零一天了。我们一边难过，一边等她回来。她要是平安，怎么也该捎件东西报个信。我已经发誓了，不管她是生是死，只要一天没找到她，我就一天不睡觉。
        - id: ch01-b06
          speaker: gola
          text: 既然发了誓，你就得守住。可你要是先来问过父亲，再起誓就更好了。如今也只能这样了。你母亲会给你烤一只饼带在路上，谁知道你要走多久呢？
        - id: ch01-b07
          speaker: narrator
          text: 母亲起身烤了两只饼，一只大，一只小。
        - id: ch01-b08
          speaker: mother
          text: 儿子，你自己选吧。小饼有母亲的祝福，大饼没有。你没把父亲放在眼里，自己先发了誓，所以那只大饼不能带着我们的祝福。
        - id: ch01-b09
          speaker: adan
          text: 我要大的。真要饿死的时候，母亲的祝福又能拿来填肚子吗？
        - id: ch01-b10
          speaker: narrator
          text: 阿丹拿起大饼出发了。他一路大步向前，山岭和河流都拦不住他。他快得像从山上刮下来的风，鹰和海鸥从巢里看着他经过，连鹿也被远远甩在身后。后来，饥饿终于抓住了他。他累得浑身发抖，只好坐到一块岩石上，掰下一块饼。
        - id: ch01-b11
          speaker: raven
          text: 戈拉之子阿丹，分一小口给我吧。
        - id: ch01-b12
          speaker: adan
          text: 你这只带来凶讯的鸟，到别处找吃的去。我自己也只剩这么一点。
        - id: ch01-b13
          speaker: narrator
          text: 阿丹伸开四肢歇了一会儿，又站起来赶路。他不停地走，一直走到小鸟归巢，天光消失，黑暗盖住大地。后来，他终于看见一所屋里亮着灯，赶紧朝那里奔去。门开了，他走进屋，又停住脚步。壁炉边的长凳上躺着一位老人，对面坐着一个姑娘，正用银梳梳着满头金发。
        - id: ch01-b14
          speaker: old_man
          text: 欢迎你，俊俏的年轻人。坐下暖暖身子，再跟我说说外面的世界最近怎么样。我已经很久没见过它了。
        - id: ch01-b15
          speaker: adan
          text: 我没什么消息，只想找份差事。从太阳升起，我已经走了很远。黑夜里看见您家的灯，我可真高兴。
        - id: ch01-b16
          speaker: old_man
          text: 我有三头暗褐色的无角母牛，正需要人放牧。你要是能整整一年，每天都在日落前把它们带回来，我给你的报酬一定让你满意。
        - id: ch01-b17
          speaker: golden_haired_girl
          text: 你要是答应他，一定会惹来祸事。
        - id: ch01-b18
          speaker: adan
          text: 没人问你的主意，它一文不值。不就是三头牛吗？赶它们吃草，再护着它们不受野狼伤害。连这点事都做不到，我还有什么用？老伯，天亮我就替您干活。不到新年，我一分报酬也不要。
        - id: ch01-b19
          speaker: narrator
          text: 第二天一早，蕨丛里还听不见鹿铃，金发姑娘已经挤完奶，把三头母牛领到屋前。老人和阿丹正在那里等着。
        - id: ch01-b20
          speaker: old_man
          text: 它们想往哪儿走，就让它们往哪儿走。千万别逼它们转向，它们知道哪里有肥美的草。你只管一直跟在后面。不论看见什么，听见什么，都不能丢下它们。去吧，愿智慧与你同行。
        - id: ch01-b21
          speaker: narrator
          text: 老人在一头牛的额头上轻轻一点。它走上小路，另两头牛一左一右跟着，阿丹也照吩咐走在后面。他心里暗暗庆幸，觉得自己找到的差事实在轻松。一年以后，口袋里的钱一定够他远走异国，继续寻找妹妹。说不定这一年里，还会碰上一个过路的人，正好带来妹妹的消息。
        - id: ch01-b22
          speaker: narrator
          text: 正想着，一只金公鸡和一只银母鸡从前面的草地上飞快跑过。阿丹立刻把老人刚才的告诫忘得一干二净，拔腿便追。两只鸡看着近得只要一伸手，就能抓住它们的尾巴。可每次他认定这回一定能得手，手指都只攥住一把空气。等他实在跑不动了，鸡还像先前一样向前飞奔。他这才想起母牛，心里有些害怕，赶忙转身回去寻找。幸好它们没走远，还在安安静静地吃着浓密的青草。
        - id: ch01-b23
          speaker: narrator
          text: 阿丹坐到树下，又看见一根金手杖和一根银手杖在前方草地上扭动翻腾。他跳起来追，一直追到筋疲力尽，也没碰到它们。两根手杖明明总在手边，却怎么也抓不住。阿丹放弃时，双膝直发抖。附近一棵树结满各种果子，他欢喜极了，马上狼吞虎咽地吃起来。
        - id: ch01-b24
          speaker: narrator
          text: 太阳低下去，母牛不再吃草，转身回家。阿丹跟在后面。金发姑娘在牛棚门口等着，一句话也没说，只坐下挤奶。可流进桶里的不是奶，而是一股稀薄的清水。她刚从最后一头牛旁站起来，老人就出现在门外。
        - id: ch01-b25
          speaker: old_man
          text: 你背弃了诺言，也辜负了我的托付！你连一天都没能守信。好吧，我现在就付给你报酬，也让别人看见你的模样，知道该拿什么引以为戒。
          emotion: angry
        - id: ch01-b26
          speaker: narrator
          text: 老人挥起魔杖，在阿丹胸口点了一下。年轻人立刻变成一根石柱。
        - id: ch01-b27
          speaker: narrator
          text: 戈拉夫妇失去了女儿，如今长子也一直没有音讯，两人悲痛极了。姑娘上山后一去不返，已经整整两年零两天。一天早晨，次子鲁艾斯站起身来。
        - id: ch01-b28
          speaker: ruais
          text: 妹妹和阿丹哥哥都不在，家里的日子太难熬了。我已经发誓，不论他们在哪儿，我都要去找。
        - id: ch01-b29
          speaker: gola
          text: 你若先得到我和母亲的同意，那会更好。不过既然已经发誓，就照着做吧。
        - id: ch01-b30
          speaker: narrator
          text: 母亲又烤了一大一小两只饼。鲁艾斯和阿丹一样，拿走了没有祝福的大饼。他不知道自己正一步步重走哥哥走过的路，所以也不必再细说他的遭遇。最后，他同样化成一根石柱，立在小屋后面的山坡上，让所有人都看清背弃承诺会有什么下场。
    - id: ch02
      title: 科万守住诺言
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 又过了一年零一天。一天早晨，戈拉最小的儿子褐发科万对父母说起了自己的心愿。
        - id: ch02-b02
          speaker: covan
          text: 妹妹离开我们已经三年多了。两个哥哥也先后出走，谁也不知道他们在哪里。我们兄妹四个，如今只剩我在家。我也想去寻找他们，只求您和母亲别拦着我。
        - id: ch02-b03
          speaker: gola
          text: 那你就去吧，带上我们的祝福。
        - id: ch02-b04
          speaker: narrator
          text: 母亲仍旧烤了一大一小两只饼。科万拿起有祝福的小饼，踏上了寻找亲人的路。他走了很远，在林子里饿了，便坐下来吃饼。身后忽然传来喊声。
        - id: ch02-b05
          speaker: raven
          text: 分我一块！分我一块！
        - id: ch02-b06
          speaker: narrator
          text: 科万回头，看见那是荒野里的黑乌鸦。
        - id: ch02-b07
          speaker: covan
          text: 好，我分给你。
        - id: ch02-b08
          speaker: narrator
          text: 他掰下一块饼，举起来递给乌鸦。乌鸦贪婪地吃完了。科万继续赶路，直到前方亮起小屋的灯光。夜色将近，他心里十分欢喜。
        - id: ch02-b09
          speaker: covan
          text: 也许那里有活儿给我做，至少能挣些钱，接着寻找亲人。谁知道妹妹和哥哥们已经流落到多远的地方了？
        - id: ch02-b10
          speaker: narrator
          text: 门敞开着，科万走了进去。老人欢迎他，金发姑娘也欢迎他。老人像从前一样，请他替自己放牛。姑娘也像劝他两个哥哥那样，劝他不要接下这份差事。科万虽然没打算听她的话，却没有出言冒犯。他客气地道了谢，又仔细听完新主人的每一句告诫。
        - id: ch02-b11
          speaker: narrator
          text: 第二天破晓，科万赶着三头暗褐色母牛出发。无论它们去哪里，他都耐心跟在后面。金公鸡和银母鸡从路上跑过，离他比当初离两个哥哥还近。诱惑实在太强，他真想拔腿追上去，却及时记起主人不许他左顾右盼，只好拼命把目光移开。接着，金银手杖仿佛猛地从地里钻出来，在眼前扭动翻腾，他还是抵住了诱惑。魔树上的果子几乎碰到嘴唇，他也抬手拨开，坚定地向前走。
        - id: ch02-b12
          speaker: narrator
          text: 那天，母牛走得比任何时候都远，来到一片燃烧着石南的荒原才停下。火烧得很猛，三头牛却毫不在意，稳稳地从火里穿了过去。科万没有丢下它们，也紧紧跟进火中。接着，母牛又一头扎进白浪翻滚的河里。科万同样跳下去。河水已经高过腰间，他还是一步步跟着，始终没有回头。
        - id: ch02-b13
          speaker: narrator
          text: 河对岸是一片辽阔的平原。母牛卧了下来。科万四下张望，看见附近有一所黄石屋子，优美的歌声正从里面传来。他静静听着，心也跟着轻快起来。忽然，一个年轻人飞奔到他面前，喘得几乎说不出话。
        - id: ch02-b14
          speaker: young_man
          text: 快去啊，褐发科万！你的牛闯进麦田了，赶紧把它们赶出来！
        - id: ch02-b15
          speaker: covan
          text: 用不着。你既然特地跑来告诉我，不如顺手把它们赶出去，还更省事。
        - id: ch02-b16
          speaker: narrator
          text: 科万微笑着，继续听歌。没过多久，那个年轻人又跑了回来，还是上气不接下气。
        - id: ch02-b17
          speaker: young_man
          text: 真有你的，戈拉之子科万！你还站在这里发呆。我们的狗正在追你的牛，快去把狗赶开！
        - id: ch02-b18
          speaker: covan
          text: 还是用不着。你有工夫跑来报信，不如自己把狗叫回来，那不是更省事吗？
        - id: ch02-b19
          speaker: narrator
          text: 科万留在原地，直到歌声停下。他回头去找母牛，只见它们还躺在原处。三头牛一看见他，就站起来踏上归途，不过走的是另一条路。
        - id: ch02-b20
          speaker: narrator
          text: 它们先走过一片荒凉的平原。那里空空荡荡，地上就算掉一根针，也能一眼看见。可科万惊讶地发现，一匹母马和一匹小马正在那里吃草，两匹都肥壮得像是一直养在最丰美的草场。再往前，是另一片青草浓密、处处碧绿的平原。那里也有一匹母马和一匹小马，却瘦得每一根肋骨都数得清。
        - id: ch02-b21
          speaker: narrator
          text: 后来，小路把他们带到湖边。湖上漂着两条船。一条船坐满欢欣快活的年轻人，正驶向太阳之国。另一条船载着身披黑衣、面容阴沉的人影，正驶向黑夜之国。科万跟着母牛，心里一直在问，这些景象究竟是什么意思。
    - id: ch03
      title: 三位荒野朋友
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 黑夜降临，狂风呼号，大雨迎头浇下。科万不知道还有多远，甚至不知道方向对不对。他连母牛都看不见了。一想到自己也许没能平安带回它们，心便沉了下去。可他既不能向前，也不能后退，只能站在原地等待。忽然，一只亲切的巨爪搭上了他的肩头。来的是莫尔莫尔猎犬，科万早就听过它的许多传闻。
        - id: ch03-b02
          speaker: molmor_hound
          text: 我的洞穴就在旁边。到我那里住一夜吧。我请你吃羊肉，让你身上的三份疲惫全都散去。
        - id: ch03-b03
          speaker: narrator
          text: 科万跟进洞穴，吃了晚饭，安稳睡了一夜。第二天早晨醒来，他已经精神一新。
        - id: ch03-b04
          speaker: molmor_hound
          text: 再会了，科万。我把能给的东西都献给你，你都肯接受，也没有嘲笑我。愿成功与你同行。以后若有危险，只要想起我，我绝不会让你失望。
        - id: ch03-b05
          speaker: narrator
          text: 莫尔莫尔猎犬说完，便消失在树林里。科万去找母牛，看见它们还站在昨夜黑暗降临时的洼地中，哪里也没有去。母牛一见他便继续前行。科万紧跟其后，不朝左看，也不朝右看，更没有离开它们半步。它们走了整整一天，入夜时来到荒原。四周除了岩石，什么也不能遮身。
        - id: ch03-b06
          speaker: covan
          text: 看来我们只能在这里尽量歇一夜了。
        - id: ch03-b07
          speaker: narrator
          text: 三头牛低下头，就地卧倒。这时，从不闭眼、双翼从不疲倦的科里南克雷格黑乌鸦飞来了。它在科万面前扇着翅膀，说岩石里有一道裂缝，里面有足够的食物，还有柔软的苔藓可以铺床。
        - id: ch03-b08
          speaker: raven
          text: 跟我来吧。你身上的三份疲惫都会散去，明天一早就能精神十足地赶路。
        - id: ch03-b09
          speaker: narrator
          text: 科万满怀感激地跟它去了。黎明时，他起身寻找母牛。
        - id: ch03-b10
          speaker: raven
          text: 再会！你信任我，也肯接受我献出的一切，这正好报答你当初分给我的食物。以后需要朋友，只管想起我，我绝不会让你失望。
        - id: ch03-b11
          speaker: narrator
          text: 母牛还站在原处，已经准备上路。它们又走了一整天，科万始终跟在后面，直到夜幕落下，他们来到河岸。
        - id: ch03-b12
          speaker: covan
          text: 我们不能再往前走了。
        - id: ch03-b13
          speaker: narrator
          text: 母牛低头吃起溪边的青草。科万听着它们一下下啃草，自己也盼着能有一顿晚饭。他们已经走过很远的路，科万的两条腿虚弱得快要撑不住身体。就在这时，脚边忽然传来哗啦一声水响。著名的棕水獭多兰从溪水里探出了脑袋。
        - id: ch03-b14
          speaker: duran_otter
          text: 相信我。我会替你找个温暖的住处，也有吃的，鱼儿管够。
        - id: ch03-b15
          speaker: narrator
          text: 科万感激地跟它去了。他吃饱歇好，身上三份疲惫全都消散。日出时，他从潮水冲来的干海藻床上起身，向棕水獭多兰告别。
        - id: ch03-b16
          speaker: duran_otter
          text: 你信任我，也接受了我能献出的一切，所以你已经是我的朋友了。以后遇上危险，要是需要一个能渡河、能潜到浪底的帮手，只管叫我，我一定来。
        - id: ch03-b17
          speaker: narrator
          text: 多兰说完，一头扎进溪水，再也看不见了。三头母牛仍站在科万留下它们的地方，也已经准备好继续赶路。他们又不停地走了一整天。夜幕降临时，终于回到小屋。母牛走进牛棚，金发姑娘先用银梳梳过头发，随后坐下来挤奶。这次，流进桶里的全是浓浓的牛奶。老人看见了，实在欢喜。
        - id: ch03-b18
          speaker: old_man
          text: 你做得确实很好。现在说吧，你想要什么报酬？
        - id: ch03-b19
          speaker: covan
          text: 我什么也不要，只求您把失踪三年的两个哥哥和妹妹还给我。您有深广的智慧，也懂仙女和女巫的秘术。请告诉我到哪里能找到他们，又怎样才能让他们重新活过来。
        - id: ch03-b20
          speaker: narrator
          text: 老人听完，神情变得凝重。
        - id: ch03-b21
          speaker: old_man
          text: 不错，我知道他们在哪里，也不是说他们绝不能复生。可这件事太过凶险，恐怕不是你能办到的。
        - id: ch03-b22
          speaker: covan
          text: 请把那些凶险告诉我。听完以后，我才知道自己到底能不能克服。
        - id: ch03-b23
          speaker: old_man
          text: 那你仔细听，再自己判断。山中有一头狍子，四只蹄子雪白，头上的角像鹿角一样分叉。通往太阳之国的湖上，有一只绿羽金颈的鸭子。科里布伊水潭里，还有一条银鳞红鳃的鲑鱼。把它们全带到我面前，你自然会知道哥哥和妹妹在哪里。
        - id: ch03-b24
          speaker: covan
          text: 明天雄鸡一叫，我就出发！
    - id: ch04
      title: 三项艰难的捕猎
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 通往高山的路笔直伸向前方。科万爬到高处，一眼就看见那头四蹄雪白、身上带斑的狍子，正站在前面的山峰上。他满怀希望地追过去，可等他登上峰顶，狍子已经离开，又出现在另一座峰上。他再追，狍子便再换一座山峰，每次都是如此。眼看科万的勇气快要耗尽，莫尔莫尔猎犬的身影忽然闪过他的脑海。
        - id: ch04-b02
          speaker: covan
          text: 莫尔莫尔猎犬要是在这里，该有多好！
        - id: ch04-b03
          speaker: narrator
          text: 科万抬头一看，猎犬果然出现了。
        - id: ch04-b04
          speaker: molmor_hound
          text: 你为什么叫我来？
        - id: ch04-b05
          speaker: narrator
          text: 科万把困境告诉它，说狍子总把自己越引越远。
        - id: ch04-b06
          speaker: molmor_hound
          text: 什么都别怕。我很快就替你抓住它。
        - id: ch04-b07
          speaker: narrator
          text: 没过多久，猎犬果然把毫发无伤的狍子放在科万脚边。
        - id: ch04-b08
          speaker: molmor_hound
          text: 你想让我怎么处置它？
        - id: ch04-b09
          speaker: covan
          text: 老人要我把这头狍子、金颈鸭和银鳞鲑鱼都带回小屋。我还不知道能不能全捉到。请你先把狍子送到屋后，牢牢拴住，别让它跑了。
        - id: ch04-b10
          speaker: molmor_hound
          text: 我一定替你办妥。
        - id: ch04-b11
          speaker: narrator
          text: 科万随即奔向通往太阳之国的湖。那只绿身金颈的鸭子正在睡莲中游动。
        - id: ch04-b12
          speaker: covan
          text: 我很会游泳，一定能抓到它。
        - id: ch04-b13
          speaker: narrator
          text: 可科万游得快，鸭子游得更快。后来，他耗尽力气，只得回到岸上。
        - id: ch04-b14
          speaker: covan
          text: 黑乌鸦要是在这里帮我就好了！
        - id: ch04-b15
          speaker: narrator
          text: 转眼之间，黑乌鸦已经落在他的肩头。
        - id: ch04-b16
          speaker: raven
          text: 要我怎么帮你？
        - id: ch04-b17
          speaker: covan
          text: 请替我抓住水上那只绿鸭子。
        - id: ch04-b18
          speaker: narrator
          text: 乌鸦扇动有力的翅膀飞去，用那又长又有力的尖喙叼起鸭子，一转眼就把它放在科万脚边。有了朋友相助，这一次科万很容易就带走了猎物。他认真谢过乌鸦，随后继续向河边走去。
        - id: ch04-b19
          speaker: narrator
          text: 老人说的水潭幽深昏暗，那条银鳞鲑鱼正躲在岩石下面。
        - id: ch04-b20
          speaker: covan
          text: 我是捕鱼的好手，这条鱼一定捉得到。
        - id: ch04-b21
          speaker: narrator
          text: 科万从灌木上削下一根细长枝条，在末端仔细系好鱼线。他站在昏暗的水潭边，一次又一次把鱼线抛向岩石下面，可不论动作多么灵巧都没有用，那条鲑鱼始终躲在那里，连鱼饵也不肯看上一眼。
        - id: ch04-b22
          speaker: covan
          text: 这回我真没办法了，除非棕水獭多兰来救我。
        - id: ch04-b23
          speaker: narrator
          text: 话刚说完，水面哗啦一响，多兰的脸从水里抬起来，望着科万。
        - id: ch04-b24
          speaker: covan
          text: 请帮我捉住岩石下面那条鲑鱼！
        - id: ch04-b25
          speaker: narrator
          text: 多兰潜进水中，咬住鲑鱼的尾巴，把它带回科万站着的地方。
    - id: ch05
      title: 岁月之灵的报酬
      blocks:
        - id: ch05-b01
          speaker: covan
          text: 狍子、鸭子和鲑鱼，全都带回来了。
        - id: ch05-b02
          speaker: narrator
          text: 科万回到小屋，把结果告诉老人。老人看着三样猎物，朝他微笑起来。他没有立刻谈报酬，而是叫科万先吃些东西，再喝个痛快。等年轻人不再饥饿，两人才坐下来谈话。
        - id: ch05-b03
          speaker: old_man
          text: 我的孩子，你第一步走得好，后面的路才会顺利。你珍惜母亲的祝福，自己也得到了福佑。乌鸦饿了，你肯分给它食物。你守住对我的承诺，没有让那些虚幻的景象把你带离正路。那个年轻人想骗你离开，你有智慧看出他说的是假话。那些一无所有的朋友献出一切，你也都满怀感激地收下。最后，一重又一重的困难没有叫你绝望，反而给了你勇气。
        - id: ch05-b04
          speaker: old_man
          text: 现在说你的报酬。你确实能带妹妹回家，我也会让两个哥哥重新活过来。不过，他们懒惰，又不守信用，注定要永远在外流浪。再会吧，愿智慧与你同行。
        - id: ch05-b05
          speaker: covan
          text: 请先告诉我，您叫什么名字？
        - id: ch05-b06
          speaker: old_man
          text: 我是岁月之灵。
