  chapters:
    - id: ch01
      title: The Maiden in the Mist
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "On the western shore, where great hills stood with their feet in the sea, a goatherd lived with his wife, three sons, and one daughter. The young men spent their days fishing in the waters below the hills and hunting over the land. Their sister had work of her own. Some days, she led the young goats onto the mountain and watched them graze. On other days, she remained in the hut, helped her mother, and mended the family's fishing nets. For several years, they all lived happily together."
        - id: ch01-b02
          speaker: narrator
          text: "Then one day, while the girl watched the kids on the hill, the sun went dark. Air as cold as thick white mist crept up from the sea. She shivered and tried to call the animals, but her voice died in her throat. It felt as though strong arms held her fast."
        - id: ch01-b03
          speaker: narrator
          text: "Hours passed, and the maiden did not return. Wailing filled the hut beside the sea. Again and again, her father and brothers sprang up, thinking they heard her footsteps. But the darkness was so deep that they could hardly see their own hands. They could not tell where the river lay or where the mountain rose. One by one, the kids came home. At every bleat, someone hurried to the door, yet the stillness brought no word of the girl."
        - id: ch01-b04
          speaker: narrator
          text: "No one slept that night. When morning finally broke, the white mist drew back from the shore. The family began their search at once. They looked along the sea and over the land. They searched the river and the mountain, but found no footprint, no message, and no trace of the maiden anywhere. A year and a day went by with no word. By the end of it, Gorla of the Flocks and his wife seemed to have grown old all at once. Their three sons were sadder than they had been before. They dearly loved their sister, and not one of them had stopped mourning her. At last, the eldest son, Ardan, could bear waiting no longer. He stood before his parents and spoke."
        - id: ch01-b05
          speaker: ardan
          text: "Our sister has been gone for a year and a day. We have waited in grief, hoping she would return. Some evil must have met her, or she would have sent us a sign to ease our hearts. I have made a vow. My eyes will know no sleep until I find her, alive or dead."
        - id: ch01-b06
          speaker: gorla
          text: "Once you make a vow, you must keep it. Still, you should have asked your father's leave before you bound yourself. Since it is done, your mother will bake a cake for your journey. No one knows how long it may last."
        - id: ch01-b07
          speaker: narrator
          text: "Ardan's mother rose and baked two cakes, one large and one small."
        - id: ch01-b08
          speaker: mother
          text: "Choose, my son. Will you take the small cake with your mother's blessing, or the large one without it? You made your vow without your father's counsel."
        - id: ch01-b09
          speaker: ardan
          text: "Give me the large cake. What use would my mother's blessing be if I were starving?"
        - id: ch01-b10
          speaker: narrator
          text: "He took the larger cake and set off alone. He kept straight ahead, and neither hill nor river made him turn from his course. He moved as swiftly as the wind that swept down from the mountain. Eagles watched him from their high nests, and gulls watched from the cliffs. Even the deer fell behind him. But strength like that could not last without food. Hunger finally seized him so sharply that he could walk no farther. Trembling with weariness, he lowered himself onto a rock, opened the cake his mother had baked, and broke off a piece."
        - id: ch01-b11
          speaker: raven
          text: "Ardan, son of Gorla, spare me a morsel."
        - id: ch01-b12
          speaker: ardan
          text: "Find food somewhere else, bearer of bad news. I scarcely have enough for myself."
        - id: ch01-b13
          speaker: narrator
          text: "Ardan stretched out for a short rest, then rose and walked on. The little birds returned to their nests, the light faded, and darkness covered the earth. Still he went on. At last, he saw a beam shining from a house and hurried toward it."
    - id: ch02
      title: The Broken Trust
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Ardan entered through the open door, then stopped. An old man lay on a bench beside the fire. Across from him sat a maiden, combing her golden hair with a silver comb."
        - id: ch02-b02
          speaker: spirit_of_age
          text: "Welcome, fair young man. Sit by the fire and warm yourself. Tell me how the world outside is faring. It has been a long time since I saw it."
        - id: ch02-b03
          speaker: ardan
          text: "My only news is that I am looking for work. I have come a long way since sunrise, and I was glad to see your lamp shining through the dark."
        - id: ch02-b04
          speaker: spirit_of_age
          text: "I need someone to herd my three hornless dun cows. Bring them home before sunset every evening for one year, and I will pay you enough to satisfy your heart."
        - id: ch02-b05
          speaker: golden_haired_maiden
          text: "If you accept his offer, harm will come to you."
        - id: ch02-b06
          speaker: ardan
          text: "Advice no one asked for is worth nothing. I would be good for very little if I could not pasture three cows and guard them from mountain wolves. Good father, I will begin at dawn. I ask no payment until the new year comes."
        - id: ch02-b07
          speaker: narrator
          text: "Early the next morning, before the deer's bell sounded among the ferns, the golden-haired maiden milked the cows. She led them before the cottage, where the old man and Ardan waited."
        - id: ch02-b08
          speaker: spirit_of_age
          text: "Let the cows go wherever they choose. They know where the good pasture lies, so never turn them aside. Follow behind them, and do not let anything you see or hear draw you away. Go now, and may wisdom walk with you."
        - id: ch02-b09
          speaker: narrator
          text: "When the old man finished speaking, he touched one cow on the forehead. She stepped onto the path, and the other two took their places on either side of her. Ardan followed behind, exactly as he had been told. His heart was light. He could hardly believe that such easy work had fallen to him. At the end of the year, he thought, his pockets would hold enough money to carry him into far countries where his sister might be. Until then, perhaps someone would pass through these fields with news of her. With those pleasant hopes in his mind, he walked on behind the cows."
        - id: ch02-b10
          speaker: narrator
          text: "Just then, he saw a golden cock and a silver hen racing over the grass. The old man's warning vanished from his mind, and Ardan chased them. Again and again, they seemed close enough to seize, but his fingers closed on empty air. When he could run no farther, the birds kept going. Frightened now, Ardan remembered the cows and turned back. Luckily, they were nearby, grazing quietly on thick green grass."
        - id: ch02-b11
          speaker: narrator
          text: "Later, as he sat beneath a tree, a golden staff and a silver staff appeared in the meadow. They bent and doubled in strange ways. Ardan sprang up and hurried after them. They always seemed within reach, but he could not catch them. When he finally gave up, his knees shook with weariness. A tree stood close by, heavy with many kinds of fruit, and he ate greedily."
        - id: ch02-b12
          speaker: narrator
          text: "The sun was low when the cows stopped feeding and turned home. At the stable door, the maiden waited. Without speaking to Ardan, she sat down to milk. But no milk entered her pail. Only a thin stream of water flowed from the cows. As she rose from the last one, the old man came outside."
        - id: ch02-b13
          speaker: spirit_of_age
          text: "Faithless boy, you betrayed my trust! You could not stay true for even one day. You shall have your reward now, and others will see the warning."
          emotion: angry
        - id: ch02-b14
          speaker: narrator
          text: "He waved his wand and touched Ardan's chest. In that instant, the young man became a pillar of stone."
        - id: ch02-b15
          speaker: narrator
          text: "Gorla and his wife grieved that they had lost a son as well as a daughter, for no news of Ardan ever came. Two years and two days after the maiden vanished, Gorla's second son, Ruais, rose one morning and spoke."
        - id: ch02-b16
          speaker: ruais
          text: "The days are long without my sister and my brother Ardan. I have vowed to search for them wherever they may be."
        - id: ch02-b17
          speaker: gorla
          text: "You should have asked your mother and me before making that vow. But now that you have made it, you must keep it."
        - id: ch02-b18
          speaker: narrator
          text: "Gorla told his wife to bake a cake for Ruais's journey. Once again, she baked two, one large and one small. She offered her second son the same choice she had once offered Ardan. Ruais could take the little cake with her blessing, or the large cake without it. Like his older brother, Ruais chose the large, unblessed cake and set out alone. He did not know Ardan's road, yet step by step he did everything Ardan had done. He refused the raven, reached the cottage, accepted the work, and let the strange sights lure him from the cows. There is no need to tell every part of his failure again. It ended as Ardan's had ended. Ruais too became a pillar of stone on the hill behind the cottage. There he stood for every passerby to see, a warning of the fate that waited for those who broke their faith."
    - id: ch03
      title: Covan Follows the Cows
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Another year and a day passed. Then Covan the Brown-Haired, Gorla's youngest son, spoke to his parents one morning."
        - id: ch03-b02
          speaker: covan
          text: "My sister has been gone for more than three years. My brothers have gone too, and no one knows where. Of the four of us, only I remain. I want to search for them, so I beg you both not to stand in my way."
        - id: ch03-b03
          speaker: gorla
          text: "Then go, and carry our blessing with you."
        - id: ch03-b04
          speaker: narrator
          text: "Covan's mother baked one large cake and one small one. Covan chose the small cake and began his quest. After walking far through the wood, he grew hungry and sat down to eat. A voice suddenly called from behind him."
        - id: ch03-b05
          speaker: raven
          text: "A bit for me! Give me a bit!"
        - id: ch03-b06
          speaker: narrator
          text: "Covan turned and saw the black raven of the wilderness."
        - id: ch03-b07
          speaker: covan
          text: "Yes, you may have some."
        - id: ch03-b08
          speaker: narrator
          text: "He broke off a piece and held it up. The raven ate greedily. Covan then walked on until the light of a cottage shone ahead. Night was near, and he was glad to see it. He thought he might find work there and earn money for his search, however far his sister and brothers had wandered."
        - id: ch03-b09
          speaker: narrator
          text: "The cottage door stood open, and Covan stepped inside. The old man welcomed him, and so did the maiden with the golden hair and silver comb. As before, the old man said he needed a servant to herd his three dun, hornless cows for a year. The maiden quickly warned Covan to leave such work alone. Covan had already decided to accept, so he did not follow her advice. Yet he did not insult her as both his brothers had done. He thanked her with courtesy for trying to help him. Then he turned to his new master and listened closely to every warning about the cows and the things that might draw him away."
        - id: ch03-b10
          speaker: narrator
          text: "At dawn, Covan set out behind the dun cows and patiently followed wherever they led. The golden cock and silver hen ran even closer to him than they had to his brothers. Covan badly wanted to chase them. Then he remembered that he must look neither right nor left, and with a great effort he turned his eyes away. The gold and silver staffs sprang from the ground before him, but he mastered that temptation too. When fruit from the magic tree almost touched his mouth, he brushed it aside and kept steadily on."
        - id: ch03-b11
          speaker: narrator
          text: "That day, the cows wandered farther than they had ever wandered before. Covan stayed close behind them through every turn. At last, they reached a moor where the heather was burning. Flames ran through the dry plants, and the fire was fierce, but the cows paid no attention. They walked steadily through it. Covan did not turn away or try to call them back. He followed them through the burning ground. Next, the cows plunged into a foaming river. Again, Covan went wherever they went. He waded in after them, though the current pressed around him and the water rose high above his waist. On the other side stretched a wide plain. There the three cows finally lay down, and Covan waited beside them, looking over this strange country."
        - id: ch03-b12
          speaker: narrator
          text: "Nearby stood a house of yellow stone. Sweet songs came from inside, and as Covan listened, his heart grew light. A youth came running up, so breathless that he could scarcely speak."
        - id: ch03-b13
          speaker: messenger_youth
          text: "Hurry, Covan the Brown-Haired! Your cows are in the corn. You must drive them out!"
        - id: ch03-b14
          speaker: covan
          text: "No. It would have been easier for you to drive them out than to run here and tell me."
        - id: ch03-b15
          speaker: narrator
          text: "Covan smiled and kept listening to the music. Soon, the same youth came racing back, panting for breath."
        - id: ch03-b16
          speaker: messenger_youth
          text: "Shame on you, Covan, son of Gorla, standing there with your mouth open! Our dogs are chasing your cows. Go and drive them away!"
        - id: ch03-b17
          speaker: covan
          text: "No. It would have been easier for you to call off your dogs than to come all this way to tell me."
        - id: ch03-b18
          speaker: narrator
          text: "Covan stayed until the music ended. Then he looked for the cows and found them lying exactly where he had left them. When they saw him, they rose and started home by a different path."
    - id: ch04
      title: Three Friends on the Road
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "The cows first crossed a plain so bare that even a pin could not have lain there unnoticed. There was no pasture that Covan could see. Yet a mare and her foal were feeding on that empty ground, and both were as sleek and fat as if they had spent their lives on the richest grass. Covan followed the cows onward, still wondering at what he had seen. Farther along, they entered another plain. Here the grass grew thick, high, and green. It looked like pasture enough for any animal. But the mare and foal feeding there were so lean that Covan could have counted every rib beneath their skin."
        - id: ch04-b02
          speaker: narrator
          text: "Next, the path ran beside a lake where two boats floated. One carried bright, happy youths toward the land of the Sun. The other held grim figures dressed in black, traveling to the land of Night. Covan wondered what all these strange sights could mean, but he continued behind the cows."
        - id: ch04-b03
          speaker: narrator
          text: "Darkness fell while they were still on the road. The wind began to howl, and rain poured over them in torrents. Covan could not tell how much farther the cows meant to travel. He did not even know whether this strange path would lead them toward the cottage. Soon, the darkness and rain hid the animals completely. Covan could no longer see a single one of them. His heart sank. After resisting every temptation, he feared he might still fail to bring the herd safely back. But in that black storm, he could find no way forward and no way back. He could do nothing but stand where he was and wait. As he waited, he felt a great, friendly paw settle on his shoulder."
        - id: ch04-b04
          speaker: dog_of_maol_mor
          text: "My cave is close by. Spend the night there. You shall eat lamb and lay aside three-thirds of your weariness."
        - id: ch04-b05
          speaker: narrator
          text: "It was the Dog of Maol-mor, whose fame Covan had often heard. Covan entered the cave, ate his supper, and slept. By morning, he felt like a new man."
        - id: ch04-b06
          speaker: dog_of_maol_mor
          text: "Farewell, Covan. May success go with you. You accepted what I could give and did not mock me. If danger ever walks beside you, wish for me, and I will come."
        - id: ch04-b07
          speaker: narrator
          text: "The Dog of Maol-mor disappeared into the forest. Covan found the cows waiting in the hollow where darkness had overtaken them. At the sight of him, they started on. He followed, looking neither right nor left. They walked all day. When night fell, they reached a barren plain with nothing but rocks for shelter."
        - id: ch04-b08
          speaker: covan
          text: "We must rest here as well as we can."
        - id: ch04-b09
          speaker: narrator
          text: "The cows bowed their heads and lay where they stood. Then the black raven of Corri-nan-creag came fluttering before Covan. Its eyes never closed, and its wings never tired."
        - id: ch04-b10
          speaker: raven
          text: "I know a crack in the rocks with plenty of food and soft moss for a bed. Come with me. You will lay aside three-thirds of your weariness and leave refreshed in the morning."
        - id: ch04-b11
          speaker: narrator
          text: "Covan gratefully followed. At dawn, he rose to find his cows."
        - id: ch04-b12
          speaker: raven
          text: "Farewell! You trusted me and accepted all I could offer in return for the food you once shared. If you ever need a friend, wish for me, and I will come."
        - id: ch04-b13
          speaker: narrator
          text: "The cows stood ready where Covan had left them. Once again, they traveled all day with Covan behind. Night found them on the bank of a river."
        - id: ch04-b14
          speaker: covan
          text: "We can go no farther tonight."
        - id: ch04-b15
          speaker: narrator
          text: "The cows ate the grass beside the stream. Covan listened to them and wished for supper of his own. They had come a long way, and his legs were weak beneath him. Water swished at his feet, and the famous otter Doran-donn of the stream lifted his head above the surface."
        - id: ch04-b16
          speaker: doran_donn
          text: "Trust me, and I will find you warmth and shelter, with plenty of fish to eat."
        - id: ch04-b17
          speaker: narrator
          text: "Covan went with him gladly. He ate, rested, and laid aside three-thirds of his weariness. At sunrise, he rose from a bed of dried seaweed that the tide had carried in, and thanked Doran-donn before saying farewell."
        - id: ch04-b18
          speaker: doran_donn
          text: "You trusted me and accepted what I had to give, so you have made me your friend. If danger comes and you need one who can swim a river or dive beneath a wave, call me. I will come to you."
        - id: ch04-b19
          speaker: narrator
          text: "Doran-donn plunged into the stream and vanished. The cows were waiting where Covan had left them. They traveled all that day, and at nightfall they reached the cottage."
    - id: ch05
      title: The Three Impossible Beasts
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "The old man rejoiced when the cows entered their stable. The golden-haired maiden began to milk them, and rich milk streamed into her pail."
        - id: ch05-b02
          speaker: spirit_of_age
          text: "You have done very well, Covan, son of Gorla. What reward would you like?"
        - id: ch05-b03
          speaker: covan
          text: "I want nothing for myself. Give me back my brothers and my sister, who have been lost to us for three years. You know the ways of fairies and witches. Tell me where to find them and how to bring them to life again."
        - id: ch05-b04
          speaker: narrator
          text: "Covan asked for no gold and no comfort of his own. At the mention of the missing children, the old man's face grew grave. He knew what Covan was asking, and he did not answer lightly."
        - id: ch05-b05
          speaker: spirit_of_age
          text: "I do know where they are. They may yet be brought back to life, but the dangers are great. They may be too great for you."
        - id: ch05-b06
          speaker: covan
          text: "Tell me what they are. Then I can judge whether I can overcome them."
        - id: ch05-b07
          speaker: spirit_of_age
          text: "Listen, then. On the mountain lives a roe with white feet and horns branching like a deer's antlers. On the lake that leads to the land of the Sun swims a duck with a green body and a golden neck. In the pool of Corri-Bui is a salmon with shining silver skin and red gills. Bring all three to me. Then you shall learn where your brothers and sister are."
        - id: ch05-b08
          speaker: covan
          text: "At cockcrow tomorrow, I will set out."
        - id: ch05-b09
          speaker: narrator
          text: "The next morning, the road to the mountain lay straight before Covan. He climbed until he was high above the country below. Then he caught sight of the roe on the peak ahead. Her feet were white, her sides were spotted, and her branching horns rose like the antlers of a deer. Covan set off after her, full of hope. But when he struggled to the top of that peak, the roe had already left it. She stood watching from another height. Covan climbed down and began again. Each time he drew near, she escaped to yet another peak. The chase carried him on and on through the mountains. At last, his courage nearly failed. Then the thought of the Dog of Maol-mor flashed into his mind."
        - id: ch05-b10
          speaker: covan
          text: "Oh, if only the Dog of Maol-mor were here!"
        - id: ch05-b11
          speaker: narrator
          text: "Covan looked up, and there stood the Dog."
        - id: ch05-b12
          speaker: dog_of_maol_mor
          text: "Why did you call me?"
        - id: ch05-b13
          speaker: narrator
          text: "Covan explained how the roe kept leading him farther from peak to peak."
        - id: ch05-b14
          speaker: dog_of_maol_mor
          text: "Do not fear. I will soon catch her for you."
        - id: ch05-b15
          speaker: narrator
          text: "Before long, the Dog laid the roe unharmed at Covan's feet."
        - id: ch05-b16
          speaker: dog_of_maol_mor
          text: "What would you have me do with her?"
        - id: ch05-b17
          speaker: covan
          text: "The old man told me to bring him this roe, a golden-necked duck, and a silver-sided salmon. I do not know whether I can catch the other two. Please carry the roe behind the cottage and tether her securely."
        - id: ch05-b18
          speaker: dog_of_maol_mor
          text: "It shall be done."
        - id: ch05-b19
          speaker: narrator
          text: "Covan hurried to the lake that led to the land of the Sun. Among the water lilies swam the duck with the green body and golden neck. Covan believed he could catch it because he was a good swimmer. But the duck swam better. At last, Covan's strength gave out, and he had to return to shore."
        - id: ch05-b20
          speaker: covan
          text: "Oh, if only the black raven were here to help me!"
        - id: ch05-b21
          speaker: narrator
          text: "In a moment, the raven perched on his shoulder."
        - id: ch05-b22
          speaker: raven
          text: "How can I help you?"
        - id: ch05-b23
          speaker: covan
          text: "Catch the green duck swimming on the lake."
        - id: ch05-b24
          speaker: narrator
          text: "The raven beat its powerful wings, seized the duck in its strong beak, and laid it at Covan's feet. This prize was easy for Covan to carry. He thanked the raven and went on toward the river."
        - id: ch05-b25
          speaker: narrator
          text: "At the river, Covan found the deep, dark pool the old man had named. Beneath a rock lay the salmon. Its sides shone like silver in the water, and its gills were red. Covan had fished since he was young, so he believed this was one creature he could catch without help. He cut a long, slender pole from a bush and fastened a line to its end. Then he cast his bait over the pool. He tried one place and then another. He cast with all the skill he had, but it made no difference. The salmon stayed beneath its rock and would not even turn to look at the bait."
        - id: ch05-b26
          speaker: covan
          text: "I am beaten at last, unless Doran-donn can save me."
        - id: ch05-b27
          speaker: narrator
          text: "Water swished, and Doran-donn's face appeared."
        - id: ch05-b28
          speaker: covan
          text: "Please catch the salmon beneath that rock for me."
        - id: ch05-b29
          speaker: narrator
          text: "Doran-donn dived into the pool, caught the salmon by its tail, and carried it back to where Covan stood."
    - id: ch06
      title: The Reward of Wisdom
      blocks:
        - id: ch06-b01
          speaker: covan
          text: "The roe, the duck, and the salmon are all here."
        - id: ch06-b02
          speaker: narrator
          text: "The old man smiled. He told Covan to eat and drink first. When Covan was no longer hungry, the old man spoke."
        - id: ch06-b03
          speaker: spirit_of_age
          text: "You began well, my son, and so things have gone well for you. You valued your mother's blessing, and you were blessed. You fed the hungry raven. You kept your promise to me and would not let empty wonders turn you aside. You understood that the boy who tried to lure you from the temple was telling lies. You gratefully accepted what the poor had to offer. And when trouble came, it gave you courage instead of despair."
        - id: ch06-b04
          speaker: spirit_of_age
          text: "Now for your reward. You shall take your sister home, and I will restore your brothers to life. But they were idle and unfaithful, so they must wander forever. Farewell, Covan, and may wisdom go with you."
        - id: ch06-b05
          speaker: covan
          text: "Before I go, please tell me your name."
        - id: ch06-b06
          speaker: spirit_of_age
          text: "I am the Spirit of Age."
