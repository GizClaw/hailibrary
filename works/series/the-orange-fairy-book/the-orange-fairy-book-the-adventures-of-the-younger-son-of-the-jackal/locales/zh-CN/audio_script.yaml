audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    jackal:
      display_name: 豺
      tts:
        delivery: 狡黠自信，得意时轻快，受质疑时固执
        timbre: 灵活清亮
        pace: 稍快
        pitch: 中高
    sheep:
      display_name: 母羊
      tts:
        delivery: 温顺诚恳，受欺负时克制而坚定
        timbre: 柔和清润
        pace: 适中
        pitch: 中
    greyhound:
      display_name: 灵缇犬
      tts:
        delivery: 寡言沉着，开口时干脆果断
        timbre: 低沉稳健
        pace: 稍慢
        pitch: 中低
    digger_1:
      display_name: 挖地人甲
      tts:
        delivery: 朴实直爽，回答响亮
        timbre: 粗厚明朗
        pace: 适中
        pitch: 中
    digger_2:
      display_name: 挖地人乙
      tts:
        delivery: 随和爽快，说话不假思索
        timbre: 清亮结实
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 豺请母羊同住
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老豺和他的长子都死了，家里只剩下这个小儿子。他的狡猾一点也不输给父亲和哥哥。他也不肯在同一个地方久住，今天在这里，明天又不知道跑到了这片国土的什么角落。
        - id: ch01-b02
          speaker: narrator
          text: 有一天，他在路上看见一只肥美的母羊。母羊安安静静地吃着草，对自己的生活似乎很满意。豺马上走上前去搭话。
        - id: ch01-b03
          speaker: jackal
          text: 早安！可算找到你了，见到你真叫我高兴。
        - id: ch01-b04
          speaker: sheep
          text: 找我？我们以前根本没见过呀！
          emotion: surprised
        - id: ch01-b05
          speaker: jackal
          text: 我们是没见过，可我早就听别人说过你。哎呀，你可不知道，大家提起你时，说了多少好话！唉，有些人的运气就是这么好。
        - id: ch01-b06
          speaker: narrator
          text: 母羊听得很不好意思，连眼睛该往哪儿看都不知道。
        - id: ch01-b07
          speaker: sheep
          text: 您太客气了。我能替您做点什么吗？
        - id: ch01-b08
          speaker: jackal
          text: 有件事我一直盼着办成。咱们才刚认识，我本来不大好意思开口。不过大家把你说得那么好，我就想，只要你肯试一试，咱俩一定能舒舒服服地一起过日子。我有好几块田，只要水浇得勤，就能长出好得不得了的庄稼。你愿不愿意来？
        - id: ch01-b09
          speaker: sheep
          text: 那我先住一阵吧。要是咱们合不来，再各走各的路。
        - id: ch01-b10
          speaker: jackal
          text: 太好了，谢谢你！咱们这就走，一刻也别耽搁。
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: 豺热情地伸出爪子。母羊站起来，跟着他一路小跑，来到了他家。
    - id: ch02
      title: 八份粮食
      blocks:
        - id: ch02-b01
          speaker: jackal
          text: 你到井边把水打上来，我负责把水灌进麦田的沟里。
        - id: ch02-b02
          speaker: narrator
          text: 豺把水倒进一畦畦麦田之间的沟里，干活时还一直放声唱歌。母羊担着打水的重活，却从来没有一句怨言。后来，嫩绿的小芽终于钻出了泥土，她看在眼里，觉得自己的辛苦总算有了回报。接着，火热的太阳很快催熟庄稼，转眼便到了收获的时候。两人割下粮食，磨好以后，一切都已经可以拿去卖了。
        - id: ch02-b03
          speaker: narrator
          text: 全部收拾妥当以后，豺对母羊说，该把粮食分开了。各人拿到自己的那一份，就可以想怎么处置都行。
        - id: ch02-b04
          speaker: sheep
          text: 你来分吧，秤就在这里。可得称仔细了。
        - id: ch02-b05
          speaker: narrator
          text: 豺拿起秤称了又称，最后大声数起来。
        - id: ch02-b06
          speaker: jackal
          text: 一、二、三、四、五、六、七份给豺，剩下一份给母羊。她想拿就拿，不想拿就算了。
        - id: ch02-b07
          speaker: narrator
          text: 母羊没有说话，只看着那两堆粮食。一堆高高的，另一堆小得可怜。她想了一会儿，终于开口。
        - id: ch02-b08
          speaker: sheep
          text: 你等一会儿，我去找几只口袋，把我的粮食装走。
        - id: ch02-b09
          speaker: narrator
          text: 母羊嘴上说要找口袋，心里想的却是另一回事。一离开豺的视线，她马上使出自己最快的脚程，直奔灵缇犬的家。一路跑得太急，等她赶到那里，已经累得上气不接下气。
        - id: ch02-b10
          speaker: sheep
          text: 好叔叔，求您帮帮我！
        - id: ch02-b11
          speaker: greyhound
          text: 怎么回事？出了什么事？
          emotion: surprised
        - id: ch02-b12
          speaker: sheep
          text: 求您跟我回去，吓一吓那只豺，让他把欠我的粮食还给我。我们一同住了好几个月，每天两次，都是我从井里把水打上来，他不过把水倒进田沟。庄稼是我们一起收下来的，可到了分粮食的时候，他自己拿走七份，只给我留下一份。
        - id: ch02-b13
          speaker: narrator
          text: 母羊说完，扭了扭身子，把毛茸茸的尾巴从眼睛上擦过去。灵缇犬一直静静看着她，没有马上开口。过了一会儿，他才告诉母羊该怎么做。
        - id: ch02-b14
          speaker: greyhound
          text: 去拿一只口袋来。
        - id: ch02-b15
          speaker: narrator
          text: 母羊很快取来口袋，放到他面前。
        - id: ch02-b16
          speaker: greyhound
          text: 把口袋撑开，让我进去。
        - id: ch02-b17
          speaker: narrator
          text: 灵缇犬钻进口袋，在里面舒舒服服地蜷好身子。接着，他叫母羊把口袋驮到背上，赶快回到她刚才离开豺的地方。
    - id: ch03
      title: 谁在干活
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 豺果然还在原地等着。他装出已经睡着的样子，却悄悄睁开一只眼睛偷看。母羊明明瞧见了，也不去理会，只把背上的口袋重重扔到地上，叫他继续分粮。
        - id: ch03-b02
          speaker: sheep
          text: 好了，重新称吧！
        - id: ch03-b03
          speaker: narrator
          text: 豺爬起来走到粮堆旁，又分出八份。七份拨给自己，一份留给母羊，跟先前一模一样。
        - id: ch03-b04
          speaker: sheep
          text: 你怎么还这样分？从井里打水的人明明是我，你不过把水灌进沟里！
          emotion: angry
        - id: ch03-b05
          speaker: jackal
          text: 是你记错了。每天打水的是我，往沟里倒水的才是你。问谁都是这个答案。不信的话，我现在就问那边几个挖地的人。
        - id: ch03-b06
          speaker: sheep
          text: 好，你问吧。
        - id: ch03-b07
          speaker: jackal
          text: 喂，那边挖地的！你们说说，干活的时候，是谁一直在唱歌？
        - id: ch03-b08
          speakers: [digger_1, digger_2]
          ensemble: duo
          text: 当然是你啊，豺！你的歌声那么响，简直全世界都能听见！
        - id: ch03-b09
          speaker: jackal
          text: 那你们再说，干活时会唱歌的，是从井里打水的那个，还是往沟里倒水的那个？
        - id: ch03-b10
          speakers: [digger_1, digger_2]
          ensemble: duo
          text: 那还用问，当然是打水的那个！
        - id: ch03-b11
          speaker: jackal
          text: 你都听见了。快把你那一份搬走，不然连这一份也归我。
        - id: ch03-b12
          speaker: sheep
          text: 好吧，这回算你赢，我只好认输。可我不记你的仇。我带来一袋椰枣，你过去吃一些吧。
        - id: ch03-b13
          speaker: narrator
          text: 豺最爱吃椰枣，一听这话，马上跑到袋子旁，撕开了袋口。他正要一头把鼻子探进去，却发现两只棕色的眼睛正从袋子里静静望着自己。豺吓得立刻放下袋口，一个纵身跳回母羊身边。
    - id: ch04
      title: 灵缇犬袋中的眼睛
      blocks:
        - id: ch04-b01
          speaker: jackal
          text: 我刚才只是开玩笑。原来你把我的灵缇犬叔叔也请来了。快把口袋搬开，粮食咱们重新分！
        - id: ch04-b02
          speaker: narrator
          text: 豺赶忙重新摆起那几堆粮食。这一回，他把大份一一推向母羊，一边数，一边胆怯地朝那只口袋偷看。
        - id: ch04-b03
          speaker: jackal
          text: 一、二、三、四、五、六、七份，全给我的母亲母羊。最后这一份，才归豺。
        - id: ch04-b04
          speaker: sheep
          text: 拿上你自己的那份，走吧。
        - id: ch04-b05
          speaker: narrator
          text: 豺根本不用母羊再说第二遍，拿上自己那一小份就拔腿逃走。此后，母羊每一次抬起头来，还能看见他跑啊，跑啊，飞快地穿过平原。至于后来呢？据讲故事的人所知，说不定直到今天，他还在那片平原上不停地跑。
        - id: ch04-b06
          speaker: narrator
          text: 这个故事出自勒内·巴塞的《柏柏尔故事集》。
