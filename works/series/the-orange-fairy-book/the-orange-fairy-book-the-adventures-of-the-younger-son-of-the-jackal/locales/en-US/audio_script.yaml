audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "steady, vivid folktale storytelling"
        timbre: "warm and resonant"
        pace: "measured"
        pitch: "medium"
    jackal:
      display_name: The Jackal
      tts:
        delivery: "smooth, clever, and quick to change his tone"
        timbre: "lean and bright"
        pace: "lively"
        pitch: "medium"
    sheep:
      display_name: The Sheep
      tts:
        delivery: "gentle, earnest, and firm when wronged"
        timbre: "soft and clear"
        pace: "measured"
        pitch: "medium-high"
    greyhound:
      display_name: The Greyhound
      tts:
        delivery: "quiet, watchful, and decisive"
        timbre: "deep and smooth"
        pace: "unhurried"
        pitch: "low"
    digger_1:
      display_name: First Digger
      tts:
        delivery: "plainspoken and matter-of-fact"
        timbre: "earthy and clear"
        pace: "steady"
        pitch: "medium-low"
    digger_2:
      display_name: Second Digger
      tts:
        delivery: "plainspoken and matter-of-fact"
        timbre: "dry and light"
        pace: "steady"
        pitch: "medium"
    digger_3:
      display_name: Third Digger
      tts:
        delivery: "plainspoken and matter-of-fact"
        timbre: "rough and warm"
        pace: "steady"
        pitch: "low"
  chapters:
    - id: ch01
      title: A New Partner
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "The jackal's father and elder brother were dead, so only the younger son remained. He was every bit as cunning as they had been. Like them, he never cared to stay long in one place. No one could tell where in the country he might turn up next."
        - id: ch01-b02
          speaker: narrator
          text: "One day, as he wandered about the country, he spotted a fine fat sheep cropping the grass. She looked perfectly content with her life and had no idea why the jackal had come to see her."
        - id: ch01-b03
          speaker: jackal
          text: "Good morning! I'm so glad I've found you. I've been searching everywhere."
        - id: ch01-b04
          speaker: sheep
          text: "Searching for me? But we've never even met!"
          emotion: surprised
        - id: ch01-b05
          speaker: jackal
          text: "No, we haven't, but I've heard all about you. Such wonderful things, too! Some creatures really do have all the luck."
        - id: ch01-b06
          speaker: sheep
          text: "That's very kind of you. Is there something I can do to help?"
        - id: ch01-b07
          speaker: narrator
          text: "The sheep was not used to hearing such praise. She felt so shy that she did not know where to look, but she wanted to answer him kindly."
        - id: ch01-b08
          speaker: jackal
          text: "Well, there is one thing I dearly want, though it may be too soon to ask. From everything I've heard, I think you and I could make a comfortable home together. I own several fields, and they grow marvelous crops when they're watered properly. Would you be willing to try?"
        - id: ch01-b09
          speaker: sheep
          text: "I could come for a little while. If we don't get along, we can always go our separate ways."
        - id: ch01-b10
          speaker: jackal
          text: "Thank you! Then let's not waste another moment."
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: "He held out his paw in such a welcoming way that the sheep rose at once. Then she trotted beside him until they reached the home they were to share."
        - id: ch01-b12
          speaker: jackal
          text: "You fetch the water from the well. I'll pour it into the trenches between the patches of corn."
        - id: ch01-b13
          speaker: narrator
          text: "Day after day, the sheep hauled water up from the well. The jackal took it from her and poured it along the trenches, singing at the top of his voice as he worked. Carrying the water was hard, but the sheep never complained. Before long, she had the reward of seeing little green shoots push through the earth. The hot sun ripened the crop quickly, and soon harvest time arrived. Together they cut the grain. Then it was ground and made ready to sell."
    - id: ch02
      title: Seven Parts and One
      blocks:
        - id: ch02-b01
          speaker: jackal
          text: "Everything is finished. Now let's divide the grain, and then each of us can do whatever he likes with his share."
        - id: ch02-b02
          speaker: sheep
          text: "You divide it. Here are the scales, so weigh it carefully."
        - id: ch02-b03
          speaker: narrator
          text: "The sheep trusted him with the scales. The jackal began to weigh the whole crop, making one portion after another. When he was done, he counted them aloud."
        - id: ch02-b04
          speaker: jackal
          text: "One, two, three, four, five, six, seven parts for the jackal, and one part for the sheep. She may take it if she wants it. If she doesn't, she may leave it."
        - id: ch02-b05
          speaker: narrator
          text: "The sheep stared silently at the two heaps. The jackal's seven portions made an enormous pile. Her single portion looked tiny beside it. She did not argue with him yet."
        - id: ch02-b06
          speaker: sheep
          text: "Wait here a moment while I fetch some sacks for my share."
        - id: ch02-b07
          speaker: narrator
          text: "But the sheep was not going after sacks. The moment the jackal could no longer see her, she ran as fast as she could to the greyhound's home. By the time she arrived, she was panting for breath."
        - id: ch02-b08
          speaker: sheep
          text: "Oh, dear uncle, please help me!"
        - id: ch02-b09
          speaker: greyhound
          text: "Why, what's happened?"
          emotion: surprised
        - id: ch02-b10
          speaker: sheep
          text: "Please come back with me and frighten the jackal into giving me what he owes. We've lived together for months. Twice a day, I drew all the water while he merely poured it into the trenches. We harvested the crop together. Now it's time to divide it, and he has kept seven parts for himself and left only one for me."
        - id: ch02-b11
          speaker: narrator
          text: "When she had told the whole story, the sheep gave herself a twist and drew her woolly tail across her eyes. The greyhound watched her closely, but for a while he said nothing. Then he spoke."
        - id: ch02-b12
          speaker: greyhound
          text: "Bring me a sack."
        - id: ch02-b13
          speaker: narrator
          text: "The sheep hurried away and soon returned. She laid a sack in front of him."
        - id: ch02-b14
          speaker: greyhound
          text: "Hold it wide open so I can climb inside."
        - id: ch02-b15
          speaker: narrator
          text: "Once the greyhound was curled comfortably in the sack, he told the sheep to carry him on her back and hurry to the place where she had left the jackal."
    - id: ch03
      title: The Jackal's Witnesses
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "The sheep carried the hidden greyhound all the way back. The jackal was still waiting where she had left him. He pretended to be asleep, though she plainly saw him wink one eye. She gave no sign that she had noticed. Instead, she swung the sack off her back and flung it roughly onto the ground."
        - id: ch03-b02
          speaker: sheep
          text: "Now measure the grain!"
        - id: ch03-b03
          speaker: narrator
          text: "The jackal got up and went to the heap beside them. Once again, he divided the grain into eight portions. Seven were for himself, and one was for the sheep."
        - id: ch03-b04
          speaker: sheep
          text: "Why are you dividing it that way? You know I drew the water. All you did was pour it into the trenches."
          emotion: angry
        - id: ch03-b05
          speaker: jackal
          text: "No, you've got it wrong. I drew the water, and you poured it out. Anyone will tell you so. I'll ask those people digging over there, if you like."
        - id: ch03-b06
          speaker: sheep
          text: "Very well. Ask them."
        - id: ch03-b07
          speaker: jackal
          text: "Ho there, diggers! Which one of us did you hear singing while we worked?"
        - id: ch03-b08
          speakers: [digger_1, digger_2, digger_3]
          ensemble: chorus
          text: "Why, you did, Jackal! You sang so loudly that the whole world could have heard you."
        - id: ch03-b09
          speaker: jackal
          text: "And which worker sings? The one who draws the water, or the one who pours it out?"
        - id: ch03-b10
          speakers: [digger_1, digger_2, digger_3]
          ensemble: chorus
          text: "The one who draws the water, of course!"
        - id: ch03-b11
          speaker: jackal
          text: "You heard them. Come and carry off your portion now, or I'll take that for myself as well."
        - id: ch03-b12
          speaker: sheep
          text: "You've beaten me, and I suppose I must admit it. Still, I hold no grudge. Go and eat some of the dates I brought in that sack."
        - id: ch03-b13
          speaker: narrator
          text: "The jackal loved dates. He raced to the sack at once and tore open its mouth. Just as he was about to thrust in his nose, he saw two calm brown eyes looking straight at him from inside. In an instant, he dropped the flap, bounded away from the sack, and sprang back to where the sheep stood."
    - id: ch04
      title: A Fairer Division
      blocks:
        - id: ch04-b01
          speaker: jackal
          text: "I was only joking! And I see you've brought my uncle the greyhound. Take that sack away, and we'll divide the grain again."
        - id: ch04-b02
          speaker: narrator
          text: "The jackal quickly set to work rearranging the heaps. This time, he made the sheep's share larger with every count."
        - id: ch04-b03
          speaker: jackal
          text: "One, two, three, four, five, six, seven parts for my mother the sheep, and one for the jackal."
        - id: ch04-b04
          speaker: narrator
          text: "All the while, he kept casting nervous glances at the sack."
        - id: ch04-b05
          speaker: sheep
          text: "Now take your share and go."
        - id: ch04-b06
          speaker: narrator
          text: "The jackal did not need to be told twice. Whenever the sheep looked up, she could still see him running and running across the plain. For all I know, he may be running across it still."
