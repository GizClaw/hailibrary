audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "steady, vivid folktale storytelling"
        timbre: "warm and resonant"
        pace: "measured"
        pitch: "medium"
    king_balancin:
      display_name: King Balancin
      tts:
        delivery: "warmhearted, impulsive, and openly emotional"
        timbre: "mature and full"
        pace: "measured"
        pitch: "medium-low"
    diamantina:
      display_name: Princess Diamantina
      tts:
        delivery: "gracious, thoughtful, and tender"
        timbre: "young and luminous"
        pace: "measured"
        pitch: "medium-high"
    physician:
      display_name: Physician
      tts:
        delivery: "assured, precise, and courteous"
        timbre: "clear and mature"
        pace: "unhurried"
        pitch: "medium"
    attendant:
      display_name: Royal Attendant
      tts:
        delivery: "formal, dutiful, and slightly haughty"
        timbre: "crisp and polished"
        pace: "measured"
        pitch: "medium"
    gilguerillo:
      display_name: Gilguerillo
      tts:
        delivery: "modest, intelligent, and quietly hopeful"
        timbre: "young and clear"
        pace: "measured"
        pitch: "medium"
  chapters:
    - id: ch01
      title: The King and the White Slipper
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Once there was a king named Balancin, whose daughter was fifteen years old. Princess Diamantina was so beautiful and graceful that even mothers with daughters of their own admitted they had never seen her equal. Any father who happened to catch sight of her could speak of nothing else for the rest of the day."
        - id: ch01-b02
          speaker: narrator
          text: "From the moment Balancin took the baby princess from her dead mother's arms, he loved her more than anyone in the world. Suitors came from every country before she was fifteen, but the king refused every one of them."
        - id: ch01-b03
          speaker: narrator
          text: "Behind the palace was a great garden. It reached all the way to the hills, with several rivers running through it. Near sunset each day, Diamantina went there with her ladies. She chose flowers for her rooms, clipped away the dead blooms, and carried them off in a basket. That way, when the sun rose, it would find nothing ugly in the garden."
        - id: ch01-b04
          speaker: narrator
          text: "Afterward she walked through the town and listened to the poor people tell her their troubles. Then she found her father, and the two of them decided how best to help. You may wonder what any of this has to do with a white slipper. Be patient, and you will soon see."
        - id: ch01-b05
          speaker: narrator
          text: "Next to his daughter, the king loved hunting best. Several mornings each week, he chased the wild boars in the mountains outside the city. One day he was racing downhill when his foot plunged into a hole. He fell and rolled into a rocky pit filled with brambles."
        - id: ch01-b06
          speaker: narrator
          text: "His wounds were not deep, but the thorns cut and tore his face and hands. His feet suffered most because he hunted in sandals instead of proper boots, so that he could run faster. Within days, the king was almost as well as ever. Nearly every mark on his face and hands had faded. One foot, though, stayed painfully sore. A thorn had gone deep into it, and the wound had become infected."
        - id: ch01-b07
          speaker: narrator
          text: "The finest doctors in the kingdom tried everything they knew. Each one had a special cure of his own. They washed the foot, covered it with poultices, and wrapped it in bandages. Nothing helped. Each day it grew more swollen and more painful. At last every doctor had tried and failed."
        - id: ch01-b08
          speaker: narrator
          text: "Then word came of a marvelous physician in a distant land. People said he had cured astonishing illnesses. He never left his own city, and every patient had to go to him. But the king offered so much money that at last the famous man agreed to travel to Balancin's court."
        - id: ch01-b09
          speaker: narrator
          text: "As soon as the physician arrived, he examined the injured foot with great care."
        - id: ch01-b10
          speaker: physician
          text: "I am sorry, Your Majesty. No human skill can heal this wound. I can ease the pain, though, and help you walk without suffering so badly."
          emotion: sad
        - id: ch01-b11
          speaker: king_balancin
          text: "If you can do that much, I will be grateful all my life! Tell me what you need, and it shall be done."
        - id: ch01-b12
          speaker: physician
          text: "Have the royal shoemaker make a loose, comfortable shoe from goatskin. While he works, I will prepare a secret varnish to cover it."
        - id: ch01-b13
          speaker: narrator
          text: "The physician bowed and left. For the first time in many days, the king felt hopeful. Still, the waiting seemed endless. The shoe and varnish took eight days to prepare. On the eighth morning, the physician returned with a shoe in a case. Its goatskin had been polished so brilliantly white that even snow could not have looked brighter."
        - id: ch01-b14
          speaker: physician
          text: "As long as you wear this shoe, you will feel no pain. The balsam inside and out has a healing power, and it also makes whatever it touches last. Even if Your Majesty lived for a thousand years, this slipper would remain as fresh as it is today."
        - id: ch01-b15
          speaker: narrator
          text: "Balancin could hardly wait for him to finish. He snatched up the slipper and pushed his foot into it. Then he walked. He ran. He could move as easily as a barefoot boy, and tears of joy filled his eyes."
        - id: ch01-b16
          speaker: king_balancin
          text: "What can I give you for this? Stay here, and I will make you richer than you ever dreamed!"
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: "The physician would accept only the payment they had agreed upon. Sick people were waiting for him at home, and he meant to return to them at once. Balancin had to accept his decision. He ordered that the physician be treated with royal honors, then sent an escort to guard him all the way home."
    - id: ch02
      title: The Slipper Goes Down the River
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "For two years, all went happily at court. To Balancin and his daughter, each day seemed to pass from sunrise to sunset in a moment. Then the king's birthday came around in June. The weather was unusually fine, so he told Diamantina she could arrange any celebration she pleased."
        - id: ch02-b02
          speaker: narrator
          text: "The princess loved being on the river, and the chance to choose the celebration delighted her. She planned the grandest festival anyone had ever seen. Everyone would spend the day sailing and rowing. In the evening, when they had tired of the water, there would be music, dancing, plays, and fireworks. At the very end, before the guests went home, every poor person would receive a loaf of bread, and every girl who expected to marry that year would receive a new dress."
        - id: ch02-b03
          speaker: narrator
          text: "At last the great day came. Diamantina was too excited to remain in the palace. Before the sun had climbed high, she was walking through the streets in jewels so bright that people had to shade their eyes. A trumpet called her home. Moments later, she appeared beside her father, and together they walked down to the river."
        - id: ch02-b04
          speaker: narrator
          text: "A splendid barge waited there. From its deck they watched every kind of race, along with feats of swimming and diving. Then the barge carried them upriver to the field where the concerts and dancing would begin. When the festivities ended, Diamantina presented the prizes to the winners. She gave loaves to the poor and new dresses to the young women who would soon be married. Only after every gift had been handed out did the king and princess say farewell and turn toward the barge that would take them home."
        - id: ch02-b05
          speaker: narrator
          text: "That was when disaster struck. As Balancin stepped aboard, one loose strap of the white slipper caught on a nail. He stumbled in sudden pain and shook his foot without thinking. The strap broke, and the precious slipper dropped straight into the river."
        - id: ch02-b06
          speaker: narrator
          text: "It happened so quickly that no one saw the slipper fall. Even Diamantina noticed only her father's cries and hurried to him."
        - id: ch02-b07
          speaker: diamantina
          text: "Dear Father, what happened?"
        - id: ch02-b08
          speaker: narrator
          text: "The king could barely answer."
        - id: ch02-b09
          speaker: king_balancin
          text: "My shoe! My shoe!"
          emotion: fearful
        - id: ch02-b10
          speaker: narrator
          text: "The sailors stared at him, wondering if their king had suddenly lost his mind. Diamantina followed his gaze to the water. Farther and farther down the current, she saw the white tip of something bobbing away."
        - id: ch02-b11
          speaker: narrator
          text: "Balancin could not bear to watch it go. Without the balsam, the old pain had returned as fiercely as before. He cried out, staggered, and toppled over the side of the barge."
        - id: ch02-b12
          speaker: narrator
          text: "At once the river filled with bobbing heads. Swimmers struck out as fast as they could after the king, but the swift current had already carried him far downstream. One by one they fought their way after him. At last the strongest swimmer reached Balancin, caught hold of his tunic, and dragged him toward the shore. A thousand eager hands were waiting there to haul the king out of the water."
        - id: ch02-b13
          speaker: narrator
          text: "The king was unconscious. He was carried back to Diamantina, who had fainted in terror when she saw him vanish beneath the water. They were placed together in a coach and rushed to the palace. The best doctors in the city were waiting there."
        - id: ch02-b14
          speaker: narrator
          text: "Within a few hours, the princess had recovered as fully as before. The king was not so fortunate. The pain, the cold soaking, and the shock of the accident all weighed heavily on him. For three days he lay in a high fever. Meanwhile, Diamantina was nearly wild with grief. She ordered people to search far and wide for the white slipper. They searched everywhere they could, but even the cleverest divers found no trace of it on the riverbed."
        - id: ch02-b15
          speaker: narrator
          text: "At last it was clear that the current must have carried the slipper all the way out to sea. Diamantina turned to the only other hope she could think of. She sent messengers to find the physician and begged him to make another slipper as quickly as he could to replace the lost one. But the messengers returned with sorrowful news. The physician had died several weeks earlier. Worse still, he had never shared the secret of the balsam, so the secret had died with him."
        - id: ch02-b16
          speaker: narrator
          text: "The news struck the weakened king so hard that his doctors feared he would become as ill as before. He could scarcely be persuaded to eat. All night he lay awake, groaning partly from pain and partly from regret. He scolded himself for not asking the physician to make several dozen white slippers. If only he had done that, he thought, an accident would never have left him without one."
        - id: ch02-b17
          speaker: narrator
          text: "In time, Balancin understood that weeping and wailing would not bring the slipper back. He ordered an even greater search. For days the riverbanks were an astonishing sight. People covered them so thickly that it seemed the entire country had gathered beside the water. Still, this second search went no better than the first. Finally the king proclaimed that whoever recovered his missing slipper would become heir to the crown and marry the princess."
        - id: ch02-b18
          speaker: narrator
          text: "Many daughters would have rebelled at such a promise. Diamantina's heart sank when she heard it. Yet she loved her father more than anything and wanted him free from pain. She said nothing. She only bowed her head."
    - id: ch03
      title: The Young Man at the Palace
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "After the proclamation, the riverbanks grew more crowded than ever. The princess's many suitors poured in from distant countries, each hoping he would be the lucky man to find the slipper. Again and again, someone spotted a shining stone on the bottom and plunged into the water, certain the treasure was there. Every evening, bands of wet and disappointed men trudged home. One young man always searched longer than the rest. Night after night he remained beside the river, though his soaked clothes clung to his skin and his teeth chattered with cold."
        - id: ch03-b02
          speaker: narrator
          text: "One day, while the king lay in bed tormented by pain, he heard a struggle in the room outside. He rang the golden bell beside him, and a servant came in."
        - id: ch03-b03
          speaker: king_balancin
          text: "What is that noise?"
        - id: ch03-b04
          speaker: attendant
          text: "A young man from town caused it, Sire. He had the insolence to ask if he might measure your foot and make another slipper to replace the lost one."
        - id: ch03-b05
          speaker: king_balancin
          text: "And what did you do with him?"
        - id: ch03-b06
          speaker: attendant
          text: "The servants shoved him out of the palace. They gave him a few blows as well, to teach him better manners."
        - id: ch03-b07
          speaker: king_balancin
          text: "Then they behaved badly. He came because he wished to help me. There was no reason to beat him."
          emotion: angry
        - id: ch03-b08
          speaker: attendant
          text: "But, my lord, he wanted to touch Your Majesty's sacred person! He is a worthless boy, perhaps no more than a shoemaker's apprentice. Even if he made perfect shoes, they would do nothing without the soothing balsam."
        - id: ch03-b09
          speaker: narrator
          text: "The king thought in silence for a moment."
        - id: ch03-b10
          speaker: king_balancin
          text: "Never mind that. Bring the young man to me. I will try anything that might ease this pain."
        - id: ch03-b11
          speaker: narrator
          text: "The youth had not gone far. Soon the servants caught him and led him before the king. He was tall and handsome. Though he claimed to make shoes, his manners were modest and refined. He bowed low, showing no anger over the treatment he had received. Then he asked the king not only to let him measure the injured foot, but also to let him place a healing plaster over the wound."
        - id: ch03-b12
          speaker: narrator
          text: "Balancin liked the young man's voice and appearance. The boy seemed to know his business, so the king held out his injured foot. The youth studied it closely, then laid the plaster on with a gentle hand. Very soon, its ointment began to quiet the stabbing pain. The king's trust in him grew by the moment."
        - id: ch03-b13
          speaker: king_balancin
          text: "Tell me your name."
        - id: ch03-b14
          speaker: gilguerillo
          text: "My parents died when I was six, Sire. Everyone in town calls me Gilguerillo, because even as a little boy I went singing through the world in spite of my troubles. I was fortunate enough to be born happy."
        - id: ch03-b15
          speaker: king_balancin
          text: "Do you truly believe you can cure me?"
        - id: ch03-b16
          speaker: gilguerillo
          text: "Yes, my lord. I believe I can cure you completely."
        - id: ch03-b17
          speaker: king_balancin
          text: "How long will you need?"
        - id: ch03-b18
          speaker: gilguerillo
          text: "The task will not be easy, but I will try to finish it within a fortnight."
        - id: ch03-b19
          speaker: narrator
          text: "To the king, two weeks seemed a very long time for making one slipper. Still, he asked only one more question."
        - id: ch03-b20
          speaker: king_balancin
          text: "Is there anything you need from me?"
        - id: ch03-b21
          speaker: gilguerillo
          text: "Only a good horse, if Your Majesty will give me one."
        - id: ch03-b22
          speaker: narrator
          text: "The answer was so unexpected that the courtiers could barely hide their smiles. The king stared at Gilguerillo before replying."
        - id: ch03-b23
          speaker: king_balancin
          text: "You shall have your horse, and I expect you back in a fortnight. Keep your promise, and you know the reward. Fail, and you will be flogged for your boldness."
        - id: ch03-b24
          speaker: narrator
          text: "Gilguerillo bowed and walked out through the palace. Everyone he passed mocked and jeered at him, but he paid no attention. He had obtained exactly what he needed. He waited before the gates until an attendant led out a magnificent horse. The youth sprang into the saddle with such ease that the attendant looked at him in surprise. Then he rode swiftly out of town while the gathered crowd laughed at his daring promise."
        - id: ch03-b25
          speaker: narrator
          text: "Now let us pause while he rides and learn who Gilguerillo really was. His parents had both died before he turned six. For years he lived with an uncle who devoted his life to chemistry. The uncle had a son of his own and could leave Gilguerillo no money, but he taught the boy everything he knew."
        - id: ch03-b26
          speaker: narrator
          text: "When his uncle died, Gilguerillo took a job in an office and worked long hours each day. While other boys played, he spent every free hour bent over books. He was shy and preferred being alone, so everyone decided he was a little mad. Now he had promised to heal the king and ridden away without telling anyone where he meant to go. Laughter and ridicule swept through town, and mocking words followed him down the road. If the people had known what he was thinking, they would have called him madder still."
        - id: ch03-b27
          speaker: narrator
          text: "On the morning of the river festival, Gilguerillo had looked from his window and seen Diamantina walking through the streets. He fell in love with her at once. Of course, he believed there was no hope. It was absurd to imagine that an apothecary's nephew could ever marry the king's daughter. He did his best to forget her and forced himself to study harder than before. Then the royal proclamation suddenly gave him hope."
        - id: ch03-b28
          speaker: narrator
          text: "After the proclamation, he no longer spent all his spare time over books. He searched like everyone else. Whenever he was free, he wandered along the riverbanks or dived after something shining beneath the clear water. Each hopeful gleam proved to be only a white stone or a piece of glass. At last he understood that searching the river would never win him the princess. He turned to his books for comfort and studied harder than ever."
    - id: ch04
      title: The Plant in the Distant Country
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "An old proverb says that everything comes to the person who knows how to wait. Few people truly know how, or learn well from experience. Gilguerillo was one of those few. He did not decide his life was wasted because he could not have what he wanted most. He kept his mind busy with other things, and one day, when he least expected it, his chance appeared."
        - id: ch04-b02
          speaker: narrator
          text: "He was reading a book that was hundreds of years old. It described cures for all kinds of sickness. Gilguerillo knew that most were only inventions passed down by old women who wished to seem wiser than their neighbors. Then one remedy made him sit straight up, his eyes shining."
        - id: ch04-b03
          speaker: narrator
          text: "The book told of a balsam that could cure nearly every kind of sore and wound. It had to be distilled from a plant that grew in only one distant country. A man traveling on foot would need two months to go there and return. The remedy did have limits. There were a few wounds it could not heal, and the book carefully described the signs by which those wounds could be recognized."
        - id: ch04-b04
          speaker: narrator
          text: "That was why Gilguerillo had insisted on seeing the king's foot before making any promise. Calling himself a shoemaker was the only way he could get inside the palace. The dangerous signs were not there. His heart leaped. Perhaps the princess really was within his reach."
        - id: ch04-b05
          speaker: narrator
          text: "But perhaps was not enough. Much still had to be done before the princess could truly be his, and Gilguerillo had allowed himself very little time. He rode hour after hour. He spared the horse only as much as he needed to keep it going. Even with a fine mount beneath him, reaching the place where the plant grew took six days."
        - id: ch04-b06
          speaker: narrator
          text: "A thick wood stood before him. He fastened the horse's bridle securely to a tree, dropped to his hands and knees, and began searching the ground. Many times he thought he had found his treasure. Each time, the leaves belonged to something else. The daylight slowly faded, and he began to fear he would have to stop. Then, just as he was almost ready to lose hope, he discovered a great bed of the plant directly beneath his feet."
        - id: ch04-b07
          speaker: narrator
          text: "Trembling with joy, he gathered every piece he could find and packed the plants into his wallet. Then he mounted and galloped back toward the city."
        - id: ch04-b08
          speaker: narrator
          text: "Night had fallen when Gilguerillo rode through the city gates. The fifteen days allowed him would not end until the following day, but he still had to prepare the medicine. His eyes felt heavy with sleep, and every part of his body ached from the long strain. He did not pause to rest. At home, he lit a fire on the hearth, filled a pot with water, threw in the herbs, and left them boiling. Only then did he lie down and fall into a deep sleep."
        - id: ch04-b09
          speaker: narrator
          text: "Sunlight filled the room when he woke. He sprang up and ran straight to the pot. Every trace of the plant had vanished into the water. In its place was a thick syrup, exactly as the old book had promised. Gilguerillo lifted the syrup out by the spoonful. He spread it in the sun and waited until it had partly dried, then carefully poured the medicine into a small crystal flask."
        - id: ch04-b10
          speaker: narrator
          text: "Gilguerillo washed carefully, put on his best clothes, slipped the flask into his pocket, and hurried to the palace. He asked to see the king at once."
    - id: ch05
      title: The Cure and the Wedding
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "Since Gilguerillo had applied the plaster, Balancin's foot had hurt much less. The king had been counting the days until the young man's return. As soon as he heard that Gilguerillo was waiting, he ordered the servants to admit him. Balancin pushed himself up eagerly against his pillows, but his face fell when he saw that the youth carried no slipper."
        - id: ch05-b02
          speaker: king_balancin
          text: "Then you have failed?"
          emotion: sad
        - id: ch05-b03
          speaker: gilguerillo
          text: "I hope I have not, Your Majesty. I believe this will work."
        - id: ch05-b04
          speaker: narrator
          text: "He drew the crystal flask from his pocket and let two or three drops fall onto the wound."
        - id: ch05-b05
          speaker: gilguerillo
          text: "Do this again each night for three nights. After that, you should be cured."
        - id: ch05-b06
          speaker: narrator
          text: "Before the king had time to thank him, Gilguerillo bowed and left. Of course, news of the strange remedy soon traveled through the city. Men and women never tired of calling the young man a fraud. They predicted that when the three days ended, he would be thrown into prison, if he was not sent straight to the scaffold. Gilguerillo paid no attention to their cruel words. Neither did the king. Each night Balancin made sure that no hand but his own applied the healing balsam."
        - id: ch05-b07
          speaker: narrator
          text: "On the fourth morning, Balancin woke and at once stretched out the wounded foot. Now he would learn whether Gilguerillo had told the truth. He examined one side. The wound there was healed. He turned the foot over. That side was healed too. Not even a scar remained."
        - id: ch05-b08
          speaker: narrator
          text: "No king could have been happier than Balancin when he knew the cure was real. He sprang lightly from bed, as nimble as a deer. He turned head over heels and tried every kind of antic he could think of, just to make sure his foot felt as sound as it looked. Only when he had tired himself out did he stop. Then he sent for his daughter and ordered the courtiers to bring the fortunate young man to his room."
        - id: ch05-b09
          speaker: diamantina
          text: "He really is young and handsome."
          emotion: happy
        - id: ch05-b10
          speaker: narrator
          text: "Diamantina sighed with relief. The man who had healed her father was not some dreadful old suitor. While the king told his courtiers about the marvelous cure, she wondered how fine Gilguerillo would look in the splendid clothes of a king's son. She said nothing and watched with amusement as the courtiers, knowing they could not avoid it, bowed and paid honor to the chemist's boy."
        - id: ch05-b11
          speaker: narrator
          text: "They dressed Gilguerillo in a magnificent green velvet tunic edged with gold. On his head they placed a cap with three white plumes. The moment Diamantina saw him dressed that way, she fell in love with him."
        - id: ch05-b12
          speaker: narrator
          text: "The wedding was set for eight days later. At the ball that followed, no one danced longer or more lightly than King Balancin."
