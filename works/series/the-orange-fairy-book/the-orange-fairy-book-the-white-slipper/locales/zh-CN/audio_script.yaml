audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    king_balancin:
      display_name: 巴兰辛国王
      tts:
        delivery: 慈爱率直，受伤时虚弱急切，康复后轻快开朗
        timbre: 浑厚温暖
        pace: 适中
        pitch: 中低
    princess_diamantina:
      display_name: 迪亚曼蒂娜公主
      tts:
        delivery: 温柔端庄，关切亲人时真挚急切
        timbre: 清澈柔和
        pace: 从容
        pitch: 中高
    physician:
      display_name: 名医
      tts:
        delivery: 专注稳重，说话审慎而有把握
        timbre: 清晰沉静
        pace: 舒缓
        pitch: 中
    attendant:
      display_name: 侍从
      tts:
        delivery: 恭敬拘谨，对身份等级十分看重
        timbre: 平直清楚
        pace: 适中
        pitch: 中
    gilguerillo:
      display_name: 吉尔格里略
      tts:
        delivery: 谦逊坚定，年轻而沉着，心中始终怀着希望
        timbre: 清朗温和
        pace: 明快
        pitch: 中
  chapters:
    - id: ch01
      title: 国王的白鞋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一位名叫巴兰辛的国王。他有一个刚满十五岁的女儿，名叫迪亚曼蒂娜。那是怎样的一位公主啊！就连那些自己也有女儿的母亲，也不得不承认，自己的孩子远不如她美丽优雅。至于父亲们，谁若偶然见她一面，接下来一整天便再也谈不成别的事。
        - id: ch01-b02
          speaker: narrator
          text: 王后去世时，巴兰辛亲手从她怀里抱起年幼的女儿。从那一刻起，他便事事顺着这个小姑娘，心里仿佛再也容不下别人。各国的求婚者早早找上门来，可公主还不到十五岁，无论对方是谁，国王一概不答应。
        - id: ch01-b03
          speaker: narrator
          text: 王宫后有一座大花园，一直伸到群山脚下，还有不止一条河从园中穿过。每天临近日落，公主都带着侍女来到这里，亲手采花，装点自己的房间。她还随身带着剪刀和篮子，把每一朵枯花剪下收好。这样，第二天早晨太阳升起时，便照不见一处难看的景象。
        - id: ch01-b04
          speaker: narrator
          text: 忙完花园里的事，公主便进城去。穷苦百姓可以当面向她诉说难处。听完以后，她再回去找父亲，两人一起想办法帮助他们。你也许会问，这一切和白鞋有什么关系。别急，很快就知道了。
        - id: ch01-b05
          speaker: narrator
          text: 巴兰辛除了女儿，最爱的就是打猎。每个星期，他总有几个早晨要去离城几英里的山中追野猪，那里到处都是这种野兽。有一天，他飞快地冲下山坡，一脚踩进坑里，整个人翻滚着掉进布满荆棘的石坑。伤势本不算重，脸和双手却被划得伤痕累累，两只脚更是糟糕。为了跑得快些，他那天穿的是凉鞋，不是结实的猎靴。
        - id: ch01-b06
          speaker: narrator
          text: 几天后，国王身上的抓痕几乎全好了，只有一只脚还疼得厉害。原来，一根刺深深扎进肉里，伤口已经化脓。全国最好的医生轮番医治，清洗、敷药、包扎，什么办法都试了。那只脚却越来越肿，也越来越痛。
        - id: ch01-b07
          speaker: narrator
          text: 人人都试过自己的独门办法，也都失败了。这时，远方传来消息，说某座城里住着一位神医，连最古怪的病也能治。派去打听的人却说，此人从不走出自己居住的城墙，只等病人上门。巴兰辛只得许下一大笔酬金，才终于请动他远道进宫。医生一到，立刻被领到国王面前，仔细查看那只伤脚。
        - id: ch01-b08
          speaker: physician
          text: 陛下，这伤已经不是人力能够治好的了。不过，我虽不能让伤口痊愈，却能止住疼痛，让您走路时不再这样受苦。
        - id: ch01-b09
          speaker: king_balancin
          text: 只要你能让我少受疼痛，我这一生都会感激你！需要什么尽管吩咐，所有人都听你的。
        - id: ch01-b10
          speaker: physician
          text: 请王室鞋匠用山羊皮为您做一只宽松舒适的鞋。我也会准备一种涂在鞋上的药漆，它的配方只有我知道。
        - id: ch01-b11
          speaker: narrator
          text: 医生说完便鞠躬告退。国王已经许久不曾这样欢喜，这样满怀希望。可等待鞋匠做鞋、等待医生调制药漆的日子慢得出奇。直到第八天早晨，医生才带着一只鞋匣回来。他把鞋取出来，要亲自替国王穿上。山羊皮表面已经涂好一层洁白的光漆，白得耀眼，连雪也比不上。
        - id: ch01-b12
          speaker: physician
          text: 只要穿着它，您连一丝疼痛也不会感觉到。我已经用香膏把鞋里鞋外都涂遍了。这种药除了能够疗伤，还有一个奇妙的用处。凡是碰到它的材料，都会变得格外坚固。就算陛下活到一千岁，再看这只鞋，它依然会像今天一样崭新。
        - id: ch01-b13
          speaker: narrator
          text: 国王急得几乎不等医生说完，便夺过白鞋套在脚上。他走了几步，又跑了起来，竟像街头的穷孩子一样轻快，欢喜得差点掉下眼泪。
        - id: ch01-b14
          speaker: king_balancin
          text: 我要怎样才能报答你？留下来吧，我会赐给你连做梦也想不到的财富！
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: 医生却说，除了事先约定的酬金，他什么也不肯多收。故乡还有许多病人正在等他，他必须立刻回去。巴兰辛无法挽留，只好下令用王者之礼款待这位医生，再派出一支卫队，一路护送他踏上归乡的旅程。
    - id: ch02
      title: 消失在河中的白鞋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 此后两年，宫中事事顺心。国王和女儿只觉得日子过得飞快，太阳刚升起来，仿佛转眼又落了下去。巴兰辛的生日在六月。那一年天气特别好，他便让女儿随心安排庆典。
        - id: ch02-b02
          speaker: narrator
          text: 迪亚曼蒂娜最爱在河上游玩，便筹备了一场前所未有的盛会。白天有划船、赛舟和水上表演，晚上还有音乐、舞蹈、戏剧和烟火。散场以前，每个穷人都能得到一条面包，每个将在一年内出嫁的姑娘都能领到一件新衣裳。
        - id: ch02-b03
          speaker: narrator
          text: 公主盼了又盼，盛会这天终于到了。太阳还没完全升起，她已经兴奋得在宫里待不住，独自走上街头。她从头到脚缀满珠宝，闪出的光芒叫人非得遮住眼睛，才能看她。过了一阵，号角终于响起。公主赶回王宫，没过多久又出现在大家眼前，陪着父亲一同走向河边。
        - id: ch02-b04
          speaker: narrator
          text: 一艘华丽的游船正等着他们。父女俩站在船上，观看各种竞赛，还有游泳和潜水的精彩表演。等这些节目结束，游船继续向上游驶去，把他们送到举办舞会和音乐会的场地。公主亲手为优胜者颁奖，又把面包和新衣裳分发完毕，这才向宾客告别，陪父亲转身登上回宫的船。
        - id: ch02-b05
          speaker: narrator
          text: 可怕的事情就在这时发生了。国王一脚踏上船，白鞋上松开的鞋带被一根钉子勾住，害他绊了一跤。剧痛袭来，他下意识地甩了甩脚。鞋带一下崩断，那只珍贵的白鞋转眼掉进河里。
        - id: ch02-b06
          speaker: narrator
          text: 事情发生得太快，谁都没看见白鞋丢失。就连听见父亲叫喊、匆忙赶来的公主也没有察觉。
        - id: ch02-b07
          speaker: princess_diamantina
          text: 亲爱的父王，您怎么了？
        - id: ch02-b08
          speaker: king_balancin
          text: 我的鞋！我的鞋！
        - id: ch02-b09
          speaker: narrator
          text: 国王痛得说不出别的话。水手们呆站在一旁，还以为陛下突然疯了。公主见父亲盯住河面，也赶忙望过去。水流中有一小点白色的东西起起伏伏，离他们越来越远。
        - id: ch02-b10
          speaker: narrator
          text: 国王不忍再看。白鞋离开脚以后，疼痛也全部回来了。他突然惨叫一声，身子摇晃起来，翻过船舷栽进河中。
        - id: ch02-b11
          speaker: narrator
          text: 刹那间，河面上布满一起一伏的人头。人人都使出最快的速度，拼命追赶国王，可他已经被湍急的水流冲出很远。最后，一名比别人更强壮的泳者追上去，抓住他的短袍，一点点把他拖到岸边。那里早有上千只焦急的手伸出来，等着将国王拉上岸。
        - id: ch02-b12
          speaker: narrator
          text: 公主看见父亲沉入水下，也吓得失去了知觉。人们把父女俩一同放进马车，送回王宫。全城最好的医生都在那里等候。几个小时后，公主恢复如常，国王却因疼痛、受寒和惊吓发起高烧，一连三天卧床不起。
        - id: ch02-b13
          speaker: narrator
          text: 迪亚曼蒂娜悲痛得几乎发狂，仍然下令到处寻找白鞋。最好的潜水者潜遍河底，也没找到一点踪影。人们只得认定，鞋已经被水流带进了大海。
        - id: ch02-b14
          speaker: narrator
          text: 公主只好另想办法。她派使者去寻找那位曾让父亲摆脱疼痛的名医，请他尽快再做一只白鞋，替代丢失的那只。使者带回的却是噩耗。医生几个星期前已经去世。更糟的是，那份无人知晓的秘密也随他一同消失了。
        - id: ch02-b15
          speaker: narrator
          text: 国王本就虚弱，听见消息后受到极大打击，宫里的医生都怕他会像从前一样重病一场。他几乎不肯吃东西，整夜躺在床上呻吟。一半是脚痛，一半是后悔当初没有请医生做上几十只白鞋。那样就算出了意外，也总有一只可以穿。过了一阵，他终于明白，哭泣哀叹没有用，便下令比从前更加卖力地搜寻失去的宝物。
        - id: ch02-b16
          speaker: narrator
          text: 那些日子的河岸，真是一番了不得的景象，仿佛全国的人全都聚集到了那里。可是第二次搜寻并不比第一次幸运，大家仍旧一无所获。到了最后，国王终于颁下诏令。谁能找回那只失踪的白鞋，谁就会成为王位继承人，还能迎娶公主。
        - id: ch02-b17
          speaker: narrator
          text: 许多女儿若被父亲这样许配，早就反抗了。迪亚曼蒂娜听见消息，心也沉了下去。可她爱父亲胜过世上的一切，只盼他不再受苦，所以一句话也没有说，只默默低下了头。
        - id: ch02-b18
          speaker: narrator
          text: 诏令一出，河岸比从前更加拥挤。公主那些来自远方各国的求婚者全涌到这里，每个人都盼着自己成为幸运的发现者。河底闪光的石头一次次被错认成白鞋。每天傍晚，总有一群浑身滴水的人垂头丧气地回家。只有一个年轻人总比别人留得更久。衣服湿透了，紧贴在身上，牙齿也冷得格格打战，可天黑以后，他仍不肯停手。
    - id: ch03
      title: 自称鞋匠的年轻人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天，国王躺在床上忍受剧痛，忽然听见前厅有人扭打。他摇响床边的金铃，叫来一名侍从，询问出了什么事。
        - id: ch03-b02
          speaker: attendant
          text: 陛下，是城里的一个年轻人在闹。他竟敢跑进王宫，要求量一量您的脚，说要另做一只鞋，代替丢失的那只。
        - id: ch03-b03
          speaker: king_balancin
          text: 你们把他怎么样了？
        - id: ch03-b04
          speaker: attendant
          text: 仆人们把他推出宫门，又打了他几下，好让他以后不敢这样无礼。
        - id: ch03-b05
          speaker: king_balancin
          text: 他们做错了。年轻人是一片好意才来，你们不该这样对待他。
          emotion: angry
        - id: ch03-b06
          speaker: attendant
          text: 可他竟想碰陛下尊贵的身体！他也许只是个没用的鞋匠学徒。就算鞋做得再好，没有那种止痛香膏，又能有什么用？
        - id: ch03-b07
          speaker: narrator
          text: 国王沉默了一会儿。他实在太痛了，任何法子都愿意尝试。
        - id: ch03-b08
          speaker: king_balancin
          text: 算了。去把他找回来，带到这里。只要能减轻疼痛，我都愿意试。
        - id: ch03-b09
          speaker: narrator
          text: 年轻人还没走远，很快便被人追上，重新带到国王面前。他身材高挑，相貌英俊。虽然自称是做鞋的，举止却文雅而谦逊。他先深深鞠了一躬，随后请求国王准许他量一量伤脚，还请国王让他在伤口上贴一剂能够疗伤的膏药。
        - id: ch03-b10
          speaker: narrator
          text: 巴兰辛喜欢他的声音和相貌，也觉得他似乎知道该怎么做，便伸出了伤脚。年轻人仔细检查，轻轻贴好膏药。没多久，尖锐的疼痛真的缓和下来。国王对他有了信心，便问他叫什么名字。
        - id: ch03-b11
          speaker: gilguerillo
          text: 我的父母在我六岁时就去世了，陛下。城里人都叫我吉尔格里略。我小时候无论遭遇什么不幸，总是一路唱着歌。幸好，我生来就是个快活的人。
        - id: ch03-b12
          speaker: king_balancin
          text: 你真的能把我的脚治好吗？
        - id: ch03-b13
          speaker: gilguerillo
          text: 我能让它彻底痊愈，陛下。
        - id: ch03-b14
          speaker: king_balancin
          text: 那要花多长时间？
        - id: ch03-b15
          speaker: gilguerillo
          text: 这件事不容易，不过我会尽力在十五天内办成。
        - id: ch03-b16
          speaker: narrator
          text: 国王以为他要做一只鞋，觉得十五天未免太久。不过，他没有抱怨，只问年轻人需要什么帮助。
        - id: ch03-b17
          speaker: gilguerillo
          text: 只要一匹好马。如果陛下愿意赐给我一匹，那就足够了。
        - id: ch03-b18
          speaker: narrator
          text: 这个答案谁也没有料到。群臣强忍住笑，国王盯着吉尔格里略，半晌没有说话。
        - id: ch03-b19
          speaker: king_balancin
          text: 你会得到一匹马。十五天后，我要看见你回来。若你兑现诺言，自然知道奖赏是什么。若是失败，我就要为你的狂妄狠狠鞭打你。
        - id: ch03-b20
          speaker: narrator
          text: 吉尔格里略鞠躬退出王宫。沿途人人都讥笑他，他却根本不在意，因为已经得到了想要的东西。他在宫门外等来一匹雄壮的骏马，轻轻一跃便坐上马鞍。侍从也被这利落的动作惊了一下。
        - id: ch03-b21
          speaker: narrator
          text: 人群早已听说他的大胆许诺，纷纷拿他取笑。吉尔格里略就在笑声中策马出城。趁他还在路上，我们也停一停，说说这个年轻人的来历。
    - id: ch04
      title: 古书里的药方
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 吉尔格里略还不满六岁，父母便双双去世了。此后的许多年，他一直跟着叔父生活。叔父一辈子都在钻研化学，因为自己还有一个儿子，没法把钱财留给侄儿。不过，他没有藏起自己的知识，而是将毕生所学全都教给了吉尔格里略。
        - id: ch04-b02
          speaker: narrator
          text: 叔父去世后，吉尔格里略进了一间办事处，每天都要工作许多个小时。难得有了空闲，他也不和别的孩子玩，而是独自坐下来，一连几个小时埋头读书。他性情羞怯，又喜欢独处，于是人人都说他有点疯。如今大家听说他许诺治好国王，还骑马去了谁也不知道的地方，哄笑和嘲弄声更是响遍全城，一路追在他身后。
        - id: ch04-b03
          speaker: narrator
          text: 可人们要是知道他心里的秘密，只会觉得他疯得更厉害。河上庆典那天早晨，吉尔格里略从窗口望见了公主，当场爱上了她。他明白，药剂师的侄儿不可能娶到国王的女儿，只好拼命读书，想把她忘掉。
        - id: ch04-b04
          speaker: narrator
          text: 国王的诏令又给了他希望。他和别人一样，沿河岸来回寻找，还潜入水中追逐闪光的东西。一次次捞上来的却只是白石子和碎玻璃。终于，他明白自己无法从河中赢得公主，便重新回到书本旁，比从前更加用功。
        - id: ch04-b05
          speaker: narrator
          text: 有句古老的谚语说，懂得等待的人，终会等来一切。不是人人都会等待，也不是人人都能从经历中学到教训。吉尔格里略却懂得。他没有因为得不到最渴望的东西，便认定一生已经白费，而是让自己忙着做别的事。于是，酬报在最意外的时候找上门来。
        - id: ch04-b06
          speaker: narrator
          text: 一天，他偶然读到一本有几百年历史的古书。书里收着医治各种疾病的药方。他知道，其中大多数不过是些老妇人编出来的东西，为的是让旁人觉得她们比谁都聪明。可是，他终于读到一段与众不同的记载。吉尔格里略猛地在椅子里坐直了，双眼也亮了起来。
        - id: ch04-b07
          speaker: narrator
          text: 那是一种香膏，能够治好几乎所有疮痛和伤口。炼药的植物只长在极远的国度，徒步往返要整整两个月。书上也说，有少数伤势连这种香膏也治不了，还列出了辨认的征兆。
        - id: ch04-b08
          speaker: narrator
          text: 所以，吉尔格里略必须先查看国王的脚，才能答应医治。为了进宫，他才假称自己会做鞋。幸好，伤口上没有任何可怕的征兆。想到自己或许真的能够娶到公主，他的心欢喜得怦怦直跳。
        - id: ch04-b09
          speaker: narrator
          text: 可这时离成功还远，他又只给自己留下十五天。一路上，除了非歇不可的时候，他绝不让马放慢脚步。即便这样，赶到草药生长的地方也用了六天。
        - id: ch04-b10
          speaker: narrator
          text: 一片密林挡在面前。吉尔格里略把马的缰绳牢牢系在树上，随即跪到地面，手脚并用地寻找那件宝物。好多次，他以为东西已经近在眼前，满怀希望地凑过去，仔细一看，却又是别的植物。这样的失望一次次重来。直到天色渐暗，他几乎要放弃希望时，才忽然发现脚下长着一大片要找的草药。
        - id: ch04-b11
          speaker: narrator
          text: 吉尔格里略欢喜得发抖，把看得见的草药全采下来，装满皮囊。随后，他上马向城中疾驰。进城时已是夜晚，离十五天的期限只剩下最后一夜。
        - id: ch04-b12
          speaker: narrator
          text: 他困得睁不开眼，浑身也因长途奔波而酸痛，却顾不上休息。他生起炉火，在锅里盛满水，投入草药慢慢熬煮。做完这些，他才躺下来沉沉睡去。
        - id: ch04-b13
          speaker: narrator
          text: 醒来时，阳光已经照进屋里。吉尔格里略一跃而起，赶紧跑向锅边。草药全都消失了，锅里只剩浓稠的糖浆，和古书所说的一模一样。他用勺子把糖浆舀出来，小心摊在阳光下。等它晒到半干，他又把制好的药收拢起来，装进一只小小的水晶瓶。
        - id: ch04-b14
          speaker: narrator
          text: 接着，他洗净一路的尘土，穿上最体面的衣裳，把小瓶装进口袋，立刻赶往王宫，请人通报国王。
    - id: ch05
      title: 真正的奖赏
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 自从贴上吉尔格里略的膏药，巴兰辛的脚已经没有先前那么痛了。他天天计算年轻人回来的日子。一听说人已经到了，马上命令侍从放行。吉尔格里略走进房间，国王急忙从枕上撑起身子，却没有看见白鞋，脸上的希望顿时消失了。
        - id: ch05-b02
          speaker: king_balancin
          text: 这么说，你还是失败了？
          emotion: sad
        - id: ch05-b03
          speaker: gilguerillo
          text: 但愿没有，陛下。我想，我并没有失败。
        - id: ch05-b04
          speaker: narrator
          text: 吉尔格里略从口袋中取出水晶瓶，将两三滴药液倒在国王的伤口上。
        - id: ch05-b05
          speaker: gilguerillo
          text: 连续三个晚上都这样用药，您的脚就会痊愈。
        - id: ch05-b06
          speaker: narrator
          text: 国王还来不及道谢，吉尔格里略已经鞠躬离开。消息很快传遍全城。男男女女都骂他是骗子，还断言三天一过，他不是被关进监狱，就是被送上断头台。
        - id: ch05-b07
          speaker: narrator
          text: 吉尔格里略不理会这些刻薄话，国王也不理会。每晚，巴兰辛都坚持亲手涂药，绝不让别人碰那只瓶子。
        - id: ch05-b08
          speaker: narrator
          text: 第四天早晨，国王睁开眼，立刻伸出伤脚，要看看药究竟是真是假。伤口这一面已经好了。他翻过来再看，另一面也好了。原来受伤的地方，连一道疤痕都没留下。
        - id: ch05-b09
          speaker: narrator
          text: 等巴兰辛确信伤口真的消失了，世上还会有比他更快乐的国王吗？他像鹿一样轻盈地跳下床，一会儿翻筋斗，一会儿又做出各种滑稽动作，只为确定自己的脚不但看起来无恙，实际上也真的恢复如初。一直折腾到筋疲力尽，他才派人叫来女儿，又命群臣把那位幸运的年轻人带到房间。
        - id: ch05-b10
          speaker: princess_diamantina
          text: 他果真又年轻又英俊。幸好，治好父王的不是什么可怕的老头。
          emotion: happy
        - id: ch05-b11
          speaker: narrator
          text: 公主在心里悄悄松了口气。国王正向群臣宣布这场奇妙的治愈，她却看着身穿平常衣服的吉尔格里略，想象他换上王子华服的模样。群臣知道再也无法阻拦，只得向这个学化学的年轻人行礼致敬。公主看着他们，忍不住觉得好笑。
        - id: ch05-b12
          speaker: narrator
          text: 人们送来一件镶着金边的绿天鹅绒短袍，又送来一顶插着三根白羽毛的帽子。吉尔格里略换上这身华服，公主一见，也立刻爱上了他。
        - id: ch05-b13
          speaker: narrator
          text: 婚礼定在八天以后。婚后的舞会上，没有谁像巴兰辛国王那样，跳得那么久，脚步又那么轻快。
        - id: ch05-b14
          speaker: narrator
          text: 这个故事录自D. 恩里克·塞瓦略斯·金塔纳的《玫瑰花蕾》。吉尔格里略这个名字的意思是红雀。
