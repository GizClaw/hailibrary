audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    fox:
      display_name: 狐狸
      tts:
        delivery: 机敏圆滑，遇险时从容周旋
        timbre: 清亮柔和
        pace: 轻快灵活
        pitch: 中高
    wolf:
      display_name: 狼
      tts:
        delivery: 贪婪自负，发怒时粗暴凶狠
        timbre: 粗厚沙哑
        pace: 适中，威胁时稍慢
        pitch: 低
  chapters:
    - id: ch01
      title: 月夜相逢
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，几座高山脚下有个小村庄。离村子不远，两条路交会在一起，一条向东，一条向西。村民安分勤劳，白天在田里干活，傍晚听见小教堂的钟声，就收工回家。夏日清晨，他们赶着畜群去吃草，从日出到日落，日子过得快活又知足。
        - id: ch01-b02
          speaker: narrator
          text: 一个夏夜，浑圆的满月把道路照得雪白。一头大狼从拐角后小跑着出来。
        - id: ch01-b03
          speaker: wolf
          text: 回洞穴以前，我非好好吃一顿不可。快一个星期了，我吃到的全是残羹剩屑，光看身材，别人倒未必看得出！山里的兔子和野兔是不少，可要捉住它们，非得跑得像灵缇犬一样快。我又不如从前年轻了。两个星期前，我看见一只狐狸蜷成毛茸茸的一团，真够可口的。可惜她丈夫就在旁边，我不敢下手。狐狸无论大小，都跑得像风。如今除了狼，似乎再没有活物留给我吃了，可俗话说，狼不咬狼。算了，还是去村里碰碰运气吧。我已经饿得像个教书先生了。
        - id: ch01-b04
          speaker: narrator
          text: 狼正这样盘算着，他惦记的那只狐狸恰好沿另一条路飞奔而来，脚爪轻得像没有沾地。
        - id: ch01-b05
          speaker: fox
          text: 今天听了一整天母鸡咯咯叫，我实在忍不住了。爱吃鸡和鸡蛋的人听来，那可是世上最悦耳的音乐。只要天上还有太阳，今晚我就一定要吃到几只。我瘦得骨头都在响，可怜的孩子们也饿得直哭呢。
        - id: ch01-b06
          speaker: narrator
          text: 狐狸说着来到两条路交会的草地，往树下一躺，想歇歇脚，再把今晚的行动盘算清楚。就在这时，狼到了。看见狐狸近在爪下，他馋得直流口水，可等瞧清她瘦成什么模样，心里的欢喜便淡了几分。狼的脚掌虽像天鹅绒一样柔软，狐狸那双灵敏的耳朵还是听见了。她转过头，客客气气地开口。
        - id: ch01-b07
          speaker: fox
          text: 是你吗，邻居？真没想到会在这里碰见你。近来身体可好？
        - id: ch01-b08
          speaker: wolf
          text: 只说身体，倒还好。一个饿得厉害的人能有多好，我就有多好。你这是怎么了？两个星期前，你还胖得叫人看着就称心呢！
        - id: ch01-b09
          speaker: fox
          text: 我病了，病得很重。你说得不错，如今连虫子也比我肥。
        - id: ch01-b10
          speaker: wolf
          text: 的确。不过拿你填肚子也够了，饿肚子的人可不嫌面包硬。
        - id: ch01-b11
          speaker: fox
          text: 你又在说笑了！我敢说，你连我一半那么饿都没有。
        - id: ch01-b12
          speaker: narrator
          text: 狼张开血盆大口，伏低身子，准备朝她扑去。
        - id: ch01-b13
          speaker: wolf
          text: 谁更饿，马上就知道了！
        - id: ch01-b14
          speaker: fox
          text: 你这是要做什么？
        - id: ch01-b15
          speaker: narrator
          text: 狐狸惊叫着退了一步。
        - id: ch01-b16
          speaker: wolf
          text: 我要做什么？公鸡还来不及叫上一声，我就会把你吃掉，当作晚饭。
        - id: ch01-b17
          speaker: fox
          text: 好吧，看来你非要开这个玩笑不可。
        - id: ch01-b18
          speaker: narrator
          text: 狐狸说得轻松，眼睛却一刻也没离开狼。狼露出满口牙齿，低声咆哮。
        - id: ch01-b19
          speaker: wolf
          text: 我不要说笑，我要吃东西！
        - id: ch01-b20
          speaker: fox
          text: 可你这么有本领，总该看得出来吧？就算把我吃得一点不剩，你也不会觉得自己吞下过什么东西。
        - id: ch01-b21
          speaker: wolf
          text: 世上越聪明的人，肚子越容易饿。
        - id: ch01-b22
          speaker: fox
          text: 这话真有道理，不过请听我把话说完。
        - id: ch01-b23
          speaker: wolf
          text: 我没工夫听你的“可是”和“但是”。咱们说要紧的，我想吃你，不想跟你聊天。
    - id: ch02
      title: 最后的请求
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 狐狸把尾巴掩到眼前，装出可怜的模样，却还从尾毛间偷偷看着狼。
        - id: ch02-b02
          speaker: fox
          text: 难道你就不可怜一个苦命的母亲吗？
        - id: ch02-b03
          speaker: wolf
          text: 我都快饿死了。再说，行善总得先顾自家。
        - id: ch02-b04
          speaker: fox
          text: 说得不错。你要拿我填饱肚子，我若反对，倒显得不通情理了。狐狸甘愿献出性命，不过身为一个母亲，我还有最后一个请求。
        - id: ch02-b05
          speaker: wolf
          text: 那就快说，别再浪费时间。我等不了多久了。你到底想要什么？
        - id: ch02-b06
          speaker: fox
          text: 村里有个财主，每年夏天都做下足够吃一整年的奶酪，藏在院子里一口干涸的老井中。井边的横杆上还挂着从前打水用的两只吊桶。好多夜里，我都偷偷溜进那座宅院，坐吊桶下到井底，再带些奶酪回家喂孩子。我只求你跟我走一趟。与其去捉鸡，不如让我临死前吃一顿奶酪。
        - id: ch02-b07
          speaker: wolf
          text: 可奶酪说不定早就吃完了。
        - id: ch02-b08
          speaker: fox
          text: 你要是见过那里有多少，就不会这么说了！即便真的吃完，不也还有我可以吃吗？
        - id: ch02-b09
          speaker: wolf
          text: 好，我跟你去。你带路。不过我先警告你，要是想逃，或是玩什么花样，那就打错算盘了。别忘了我的腿，它们和你的一样长！
        - id: ch02-b10
          speaker: narrator
          text: 村里寂静无声，除了高悬在清朗夜空中的月亮，看不见一星灯火。狼和狐狸一路蹑手蹑脚，忽然同时停住，彼此望了一眼。一阵煎熏肉的香味飘进他们鼻中，也钻进那些熟睡的狗鼻子里。狗儿闻见香味，馋得一声接一声叫了起来。
        - id: ch02-b11
          speaker: wolf
          text: 你看，再往前走安全吗？
        - id: ch02-b12
          speaker: narrator
          text: 狼压低了声音。狐狸摇摇头。
        - id: ch02-b13
          speaker: fox
          text: 狗还叫着，咱们就不能走。说不定有人会出来看看出了什么事。
        - id: ch02-b14
          speaker: narrator
          text: 她示意狼蜷起身子，和自己躲进阴影里。过了大约半小时，狗叫累了。也可能熏肉已经吃光，再没有香味撩拨它们。狼和狐狸这才跳起来，赶到围墙脚下。
        - id: ch02-b15
          speaker: fox
          text: 我比他轻。只要快一点，也许能抢先跳过对面的墙，在他越过这边以前逃掉。
        - id: ch02-b16
          speaker: narrator
          text: 狐狸一边暗想，一边加快了脚步。狼虽然跑不快，却很会跳。他只纵身一跃，就落到了狐狸身边。
        - id: ch02-b17
          speaker: wolf
          text: 伙计，你刚才想干什么？
        - id: ch02-b18
          speaker: fox
          text: 我没想干什么。
        - id: ch02-b19
          speaker: narrator
          text: 狐狸的计划落了空，心里十分懊恼。
        - id: ch02-b20
          speaker: wolf
          text: 依我看，从你后腿上咬下一块肉，你会跳得更快。
        - id: ch02-b21
          speaker: narrator
          text: 狼说着便猛咬过去，狐狸不安地向后退开。
        - id: ch02-b22
          speaker: fox
          text: 小心点，不然我可要尖叫了。
        - id: ch02-b23
          speaker: narrator
          text: 狐狸龇牙低吼。狼知道她要是真的尖叫起来，一定会惊动村里的人，只得示意她先跳上围墙，自己也紧跟着跳了上去。
    - id: ch03
      title: 井中的奶酪
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们伏在墙头，仔细察看。院里一个活物也没有。离房屋最远的角落立着一口井，横杆上果然悬着两只吊桶，和狐狸说的一模一样。两个窃贼拖着身子，悄无声息地沿墙爬过去，直到正对着水井。狐狸把脖子伸到不能再长，看见井底只剩浅浅一点水，却恰好够映出月亮。那轮月影又大又圆，黄澄澄的。
        - id: ch03-b02
          speaker: fox
          text: 运气真好！井里有块大奶酪，足足有磨盘那么大。快看，快看！你见过这么美的东西吗？
        - id: ch03-b03
          speaker: narrator
          text: 狼也探头望下去，眼里闪起贪婪的光。他真的把水中的月影当成了奶酪。
        - id: ch03-b04
          speaker: wolf
          text: 从来没有！
        - id: ch03-b05
          speaker: fox
          text: 怎么样，不肯信人的家伙，现在还有什么话说？
        - id: ch03-b06
          speaker: narrator
          text: 狐狸轻轻笑了。
        - id: ch03-b07
          speaker: wolf
          text: 我要说，你是个说话算数的女人——我是说，一只说话算数的狐狸。
        - id: ch03-b08
          speaker: fox
          text: 那就坐进这只吊桶，下去吃个痛快吧。
        - id: ch03-b09
          speaker: wolf
          text: 哦，原来你打的是这个主意？不行！坐吊桶下去的得是你。你若不下去，脑袋就得离开身子！
        - id: ch03-b10
          speaker: fox
          text: 我当然下去，乐意之至。
        - id: ch03-b11
          speaker: narrator
          text: 狐狸早料到狼会这样说。
        - id: ch03-b12
          speaker: wolf
          text: 千万别把奶酪吃光，不然有你好受的。
        - id: ch03-b13
          speaker: narrator
          text: 狐狸抬起泪汪汪的眼睛望着他。
        - id: ch03-b14
          speaker: fox
          text: 再会吧，多疑的家伙！
        - id: ch03-b15
          speaker: narrator
          text: 她说得十分伤心，随后爬进吊桶。转眼间，她已经落到井底，发现水很浅，连腿也淹不住。
        - id: ch03-b16
          speaker: fox
          text: 哎呀，它比我想的还要大，还要肥美！
        - id: ch03-b17
          speaker: narrator
          text: 狐狸抬头朝伏在井沿上的狼喊道。
        - id: ch03-b18
          speaker: wolf
          text: 那就快点把它弄上来。
        - id: ch03-b19
          speaker: fox
          text: 它比我还重，我怎么弄得动？
        - id: ch03-b20
          speaker: wolf
          text: 既然这么重，那就分成两块再带上来。
        - id: ch03-b21
          speaker: fox
          text: 可我没有刀。你只好亲自下来，咱们一起把它抬上去。
        - id: ch03-b22
          speaker: wolf
          text: 我要怎么下去？
        - id: ch03-b23
          speaker: fox
          text: 哎呀，你真够笨的！坐进另一只吊桶呀，它差不多就在你头顶上。
    - id: ch04
      title: 两只吊桶
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 狼抬头一看，果然有只吊桶悬在那里，差不多就在自己头顶。他费了好些力气，终于爬了进去。狼的重量至少是狐狸的四倍，那只吊桶猛地向下一坠。与此同时，狐狸坐着的另一只吊桶被拉了上去，一直升到井口。
        - id: ch04-b02
          speaker: narrator
          text: 狼一明白发生了什么，立刻用发怒的狼才有的口气骂起来。不过转念一想，那块大奶酪毕竟还留在井底，正好归自己享用，他心里又稍稍得了些安慰。
        - id: ch04-b03
          speaker: wolf
          text: 可是，奶酪在哪里？
        - id: ch04-b04
          speaker: narrator
          text: 这回轮到狐狸伏在井栏上了。她含着笑，低头看狼在井底折腾。
        - id: ch04-b05
          speaker: fox
          text: 奶酪？我当然要把它带回家，给我的孩子们吃。他们还太小，不能自己找食物呢。
        - id: ch04-b06
          speaker: wolf
          text: 啊，你这个叛徒！
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 狼气得号啕起来，可狐狸早已听不见这句辱骂。她已经跑到附近一间鸡舍去了。前一天，她在那里留意到几只肥嫩的小鸡，此刻正好去找它们。
    - id: ch05
      title: 狐狸的安慰
      blocks:
        - id: ch05-b01
          speaker: fox
          text: 我这样待他，也许是过分了一点。可是天好像要阴了。要是下一场大雨，另一只吊桶就会装满雨水，沉到井底，他的吊桶便会升上来——至少有这个可能！
        - id: ch05-b02
          speaker: narrator
          text: 这个故事选自安东尼奥·德·特鲁埃瓦的《民间故事集》。
