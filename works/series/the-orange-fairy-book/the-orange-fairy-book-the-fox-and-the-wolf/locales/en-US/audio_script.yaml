audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "steady, vivid folktale storytelling"
        timbre: "warm and resonant"
        pace: "measured"
        pitch: "medium"
    fox:
      display_name: Fox
      tts:
        delivery: "quick-witted, courteous, and sly"
        timbre: "light and nimble"
        pace: "lively"
        pitch: "medium-high"
    wolf:
      display_name: Wolf
      tts:
        delivery: "gruff, boastful, and impatient"
        timbre: "deep and rough"
        pace: "deliberate"
        pitch: "low"
  chapters:
    - id: ch01
      title: Two Hungry Travelers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Once upon a time, a small village stood at the foot of some high mountains. A little way beyond it, two roads met. One ran east and the other west. The villagers were quiet, hardworking people. They spent their days in the fields, then headed home when the little church bell rang in the evening. On summer mornings, they led their flocks out to pasture. From sunrise until sunset, they were happy and content."
        - id: ch01-b02
          speaker: narrator
          text: "One summer night, a round full moon shone over the white road. A great wolf came trotting around the corner."
        - id: ch01-b03
          speaker: wolf
          text: "I simply must find a good meal before I go back to my den. For nearly a week, I've eaten nothing but scraps, though you might not guess it from my figure! There are rabbits and hares all over the mountains, of course. But you'd need to be a greyhound to catch them, and I'm not as young as I used to be. Now, if I could dine on that fox I saw two weeks ago, curled into a lovely hairy ball, I'd want nothing more. I would have eaten her then, but her husband was beside her, and foxes of every size run like the wind. It almost seems there's nothing left for me to hunt but another wolf, and everyone knows one wolf doesn't bite another. Well, let's see what this village has to offer. I'm as hungry as a schoolmaster."
        - id: ch01-b04
          speaker: narrator
          text: "While the wolf was thinking all this, the very fox he remembered came racing along the other road. Her paws seemed hardly to touch the ground."
        - id: ch01-b05
          speaker: fox
          text: "All day long, I've heard those village hens clucking, and I can't bear it any longer. When you love chickens and eggs, no music could sound sweeter. As surely as the sun is in the sky, I'll have some tonight. I've grown so thin that my bones rattle, and my poor babies are crying for food."
        - id: ch01-b06
          speaker: narrator
          text: "She reached the patch of grass where the roads joined. There she lay beneath a tree to rest and work out her plan. Just then, the wolf arrived. The sight of the fox so close at hand made his mouth water. Then he noticed how thin she was, and his delight faded a little. His paws were soft as velvet, but the fox's sharp ears heard them. She turned her head and greeted him politely."
        - id: ch01-b07
          speaker: fox
          text: "Why, is that you, neighbor? What an odd place for us to meet! I hope you're well."
        - id: ch01-b08
          speaker: wolf
          text: "There's nothing wrong with my health. At least, nothing except being terribly hungry. But look at you! What happened? When I saw you two weeks ago, you were wonderfully plump."
        - id: ch01-b09
          speaker: fox
          text: "I've been ill. Very ill. And you're right about how thin I am. Beside me, even a worm looks fat."
        - id: ch01-b10
          speaker: wolf
          text: "Yes, the worm would be fatter. But you'll do for my supper. A hungry creature can't afford to be particular."
        - id: ch01-b11
          speaker: fox
          text: "Oh, you're always teasing! Surely you aren't half as hungry as I am."
        - id: ch01-b12
          speaker: narrator
          text: "The wolf opened his enormous mouth and crouched, ready to spring."
        - id: ch01-b13
          speaker: wolf
          text: "We'll soon find out."
        - id: ch01-b14
          speaker: narrator
          text: "The fox stepped backward."
        - id: ch01-b15
          speaker: fox
          text: "What are you doing?"
        - id: ch01-b16
          speaker: wolf
          text: "What am I doing? I'm going to eat you for supper, faster than a rooster can crow."
        - id: ch01-b17
          speaker: fox
          text: "Well, you must be joking."
        - id: ch01-b18
          speaker: narrator
          text: "She spoke lightly, but never took her eyes off him. The wolf snarled and showed every tooth."
        - id: ch01-b19
          speaker: wolf
          text: "I'm not here to joke. I'm here to eat!"
        - id: ch01-b20
          speaker: fox
          text: "But someone as clever as you must see that you could eat every last bit of me and never even notice you'd swallowed anything."
        - id: ch01-b21
          speaker: wolf
          text: "That's the trouble with being clever. The cleverest creatures always seem to be the hungriest."
        - id: ch01-b22
          speaker: fox
          text: "Ah, how true. But—"
        - id: ch01-b23
          speaker: wolf
          text: "I have no time for your buts and yets. Let's come to the point. I want to eat you, not talk to you."
        - id: ch01-b24
          speaker: narrator
          text: "The fox raised her tail to her eyes as though she were weeping, but all the while she peeped slyly past it."
        - id: ch01-b25
          speaker: fox
          text: "Won't you spare a poor mother?"
        - id: ch01-b26
          speaker: wolf
          text: "I'm dying of hunger. And when it comes to charity, one must begin with oneself."
        - id: ch01-b27
          speaker: fox
          text: "Quite right. It would be unreasonable to stop you from satisfying your hunger at my expense. As a fox, I accept the sacrifice. As a mother, I ask you for one last favor."
        - id: ch01-b28
          speaker: wolf
          text: "Then hurry. I can't wait much longer. What do you want?"
    - id: ch02
      title: The Promise of Cheese
      blocks:
        - id: ch02-b01
          speaker: fox
          text: "There's a rich man in this village who makes enough cheese each summer to last him all year. He keeps every cheese in an old well in his courtyard. The well is dry now, but two buckets still hang from a pole above it, just as they did when people drew water there. For many nights, I've slipped into the courtyard and lowered myself in one of those buckets. Each time, I brought home enough cheese for my children. So this is all I ask. Come with me. Before I die, let me eat one good meal of cheese instead of chasing chickens and such things."
        - id: ch02-b02
          speaker: wolf
          text: "What if all the cheese is gone by now?"
        - id: ch02-b03
          speaker: fox
          text: "You should see how much cheese he keeps down there! Besides, if every last piece is gone, you'll still have me to eat afterward."
        - id: ch02-b04
          speaker: wolf
          text: "All right, I'll come. You lead the way. But don't try to run off or play tricks. If you do, remember that my legs are just as long as yours."
        - id: ch02-b05
          speaker: narrator
          text: "The village lay silent. Not one light showed except the moon, bright and clear overhead. The wolf and fox crept softly onward. Then both stopped and looked at each other. The rich smell of frying bacon had reached their noses. It had also reached the sleeping dogs, and the dogs began barking eagerly."
        - id: ch02-b06
          speaker: wolf
          text: "Do you think it's safe to keep going?"
        - id: ch02-b07
          speaker: narrator
          text: "He spoke in a whisper, and the fox shook her head."
        - id: ch02-b08
          speaker: fox
          text: "Not while the dogs are barking. Someone may come outside to see what's wrong."
        - id: ch02-b09
          speaker: narrator
          text: "She motioned for the wolf to curl up beside her in the shadows, and they waited there together. About half an hour passed. At last, the dogs grew tired of barking. Or perhaps the bacon had all been eaten, so there was no smell left to excite them. Whatever the reason, the courtyard became quiet again. The fox and wolf sprang up and hurried to the foot of the wall."
        - id: ch02-b10
          speaker: fox
          text: "I'm lighter than he is. If I'm quick, perhaps I can get ahead and jump over the far wall before he gets over this one."
        - id: ch02-b11
          speaker: narrator
          text: "So the fox quickened her pace. The wolf might not have been much of a runner, but he could jump. With one bound, he landed beside her."
        - id: ch02-b12
          speaker: wolf
          text: "Where did you think you were going, comrade?"
        - id: ch02-b13
          speaker: fox
          text: "Oh, nothing."
        - id: ch02-b14
          speaker: narrator
          text: "She was deeply annoyed that her plan had failed."
        - id: ch02-b15
          speaker: wolf
          text: "Perhaps if I took a bite from your haunch, you'd jump better."
        - id: ch02-b16
          speaker: narrator
          text: "He snapped at her as he spoke, and she drew back uneasily."
        - id: ch02-b17
          speaker: fox
          text: "Be careful, or I'll scream."
        - id: ch02-b18
          speaker: narrator
          text: "She snarled the warning. A scream could wake the people and set the dogs barking again. The wolf understood the danger. He signaled for her to leap onto the wall, then immediately followed her up."
    - id: ch03
      title: The Cheese in the Well
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "They crouched on top of the wall and searched the courtyard with their eyes. Not a creature was in sight. In the corner farthest from the house stood the old well, with two buckets hanging from a pole exactly as the fox had promised. The two thieves eased themselves along the wall without making a sound. When they were opposite the well, the fox stretched her neck as far as she could and looked down. The well was not quite dry. A little water remained at the bottom, just enough to hold the moon's reflection, large and round and yellow."
        - id: ch03-b02
          speaker: fox
          text: "What luck! There's an enormous cheese down there, as big as a mill wheel. Look at it! Have you ever seen anything so beautiful?"
        - id: ch03-b03
          speaker: wolf
          text: "Never!"
        - id: ch03-b04
          speaker: narrator
          text: "He leaned over for a better look. His eyes shone with greed, for he truly believed the moon's reflection was a cheese."
        - id: ch03-b05
          speaker: fox
          text: "Well, doubter, what do you say now?"
        - id: ch03-b06
          speaker: narrator
          text: "The fox gave a quiet laugh."
        - id: ch03-b07
          speaker: wolf
          text: "You kept your word like an honest woman. An honest fox, I mean."
        - id: ch03-b08
          speaker: fox
          text: "Then climb into that bucket, go down, and eat all you want."
        - id: ch03-b09
          speaker: wolf
          text: "Ah, now I see your little game. No, no, my friend. You will go down in the bucket. And if you refuse, I'll send your head down without the rest of you!"
        - id: ch03-b10
          speaker: fox
          text: "Why, of course I'll go down. It will be my greatest pleasure."
        - id: ch03-b11
          speaker: narrator
          text: "She had expected that answer all along."
        - id: ch03-b12
          speaker: wolf
          text: "And don't eat all the cheese, or you'll be sorry."
        - id: ch03-b13
          speaker: narrator
          text: "The fox looked up at him with tears in her eyes."
        - id: ch03-b14
          speaker: fox
          text: "Farewell, you suspicious creature!"
          emotion: sad
        - id: ch03-b15
          speaker: narrator
          text: "Then she climbed into the bucket. It dropped swiftly, and in a moment she was at the bottom of the well. When she stepped out, she found the water so shallow that it did not even cover her legs."
        - id: ch03-b16
          speaker: fox
          text: "Why, the cheese is bigger and richer than I thought!"
        - id: ch03-b17
          speaker: narrator
          text: "She turned toward the wolf, who was leaning over the well wall."
        - id: ch03-b18
          speaker: wolf
          text: "Then hurry and bring it up!"
        - id: ch03-b19
          speaker: fox
          text: "How can I? It weighs more than I do."
        - id: ch03-b20
          speaker: wolf
          text: "If it's that heavy, bring it up in two pieces."
        - id: ch03-b21
          speaker: fox
          text: "But I don't have a knife. You'll have to come down. Then we can carry it up together."
        - id: ch03-b22
          speaker: wolf
          text: "And how am I supposed to get down there?"
        - id: ch03-b23
          speaker: fox
          text: "Oh, you really are stupid! Climb into the other bucket. It's hanging almost over your head."
    - id: ch04
      title: The Wolf Goes Down
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "The wolf tipped back his head. Sure enough, the other bucket was hanging there. He struggled to reach it, but at last he managed to climb inside. The wolf weighed at least four times as much as the fox. His bucket plunged down with a jerk. At the same moment, the other bucket, with the fox sitting inside it, shot up to the top of the well."
        - id: ch04-b02
          speaker: narrator
          text: "As soon as the wolf understood the trick, angry words came pouring out of him. Still, one thought comforted him a little. He was at the bottom now, but the wonderful cheese must be there too."
        - id: ch04-b03
          speaker: wolf
          text: "But where is the cheese?"
        - id: ch04-b04
          speaker: narrator
          text: "Now it was the fox who leaned over the well wall. She watched him with a smile."
        - id: ch04-b05
          speaker: fox
          text: "The cheese? Why, I'm taking it home to my babies. They're too young to find food for themselves."
        - id: ch04-b06
          speaker: wolf
          text: "You traitor!"
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: "The wolf howled the insult in a rage. But the fox was no longer there to hear it. She had already slipped away to a nearby henhouse, where she had noticed some fat young chickens the day before."
        - id: ch04-b08
          speaker: fox
          text: "Perhaps I did treat him rather badly. But the sky is turning cloudy. If heavy rain comes, the other bucket will fill with water and sink to the bottom. Then his bucket will rise. At least, it might."
