audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    gopani_kufa:
      display_name: 戈帕尼－库法
      tts:
        delivery: 谨慎坚决，成为首领后庄重威严
        timbre: 厚实成熟
        pace: 稳健
        pitch: 中低
    antelope:
      display_name: 羚羊
      tts:
        delivery: 惊惧急切，临终时带警告意味
        timbre: 清亮虚弱
        pace: 稍快
        pitch: 中高
    insato:
      display_name: 因萨托
      tts:
        delivery: 王者般从容守信，失去珍宝时沉痛不舍
        timbre: 深沉洪亮
        pace: 舒缓
        pitch: 低
    zengi_mizi:
      display_name: 曾吉－米兹
      tts:
        delivery: 智慧笃定，话音带轻微蜂鸣般的延宕
        timbre: 细锐苍老
        pace: 从容
        pitch: 高
    shasasa:
      display_name: 莎萨萨
      tts:
        delivery: 年轻坦率，悔恨时悲痛颤抖
        timbre: 柔亮年轻
        pace: 适中
        pitch: 中高
    rei:
      display_name: 雷伊
      tts:
        delivery: 冷静狡猾，命令简短明确
        timbre: 冷硬成熟
        pace: 稳健
        pitch: 中低
    butou:
      display_name: 布托
      tts:
        delivery: 表面卑微恳切，暗藏欺骗
        timbre: 沙哑克制
        pace: 稍慢
        pitch: 中
  chapters:
    - id: ch01
      title: 羚羊的警告
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，白人还没有来到塞纳。那里住着一个男人，名叫戈帕尼－库法。有一天，他出门打猎，看见一条巨蟒缠住了羚羊。羚羊拼命用角反击，竟把巨蟒的脖子钉在树上。角扎进树干太深，巨蟒和羚羊谁也逃不掉。
        - id: ch01-b02
          speaker: antelope
          text: 救救我！我什么坏事也没做，它却要吃我。要不是我拼命抵抗，我早就没命了！
          emotion: fearful
        - id: ch01-b03
          speaker: insato
          text: 请救我。我是因萨托，是所有爬行者的王。只要你放我出来，我一定重重酬谢你！
        - id: ch01-b04
          speaker: narrator
          text: 戈帕尼－库法想了一会儿，最后用长矛刺死羚羊，救出了巨蟒。
        - id: ch01-b05
          speaker: insato
          text: 多谢你。新月升起的时候，请再到这里来。等我吃完羚羊，一定照约定酬谢你。
        - id: ch01-b06
          speaker: antelope
          text: 对，它会酬谢你的！可是你等着瞧，那份酬劳最后会毁掉你自己！
        - id: ch01-b07
          speaker: narrator
          text: 羚羊说完便死去了。戈帕尼－库法先回到自己的村寨，等新月升起，又来到那棵树下。因萨托吃下整只羚羊，到现在还有些昏昏欲睡。它看见救命恩人，再次向他道谢。
        - id: ch01-b08
          speaker: insato
          text: 跟我到皮塔去吧。那是我的国土。我的财宝随你挑选，你想要什么，我就给你什么。
        - id: ch01-b09
          speaker: narrator
          text: 戈帕尼－库法想起羚羊的警告，心里有些害怕。可他最后还是答应了，跟着因萨托走进森林。他们走了好几天，来到一个直通地底的洞口。洞不算宽，却容得下一个人。
        - id: ch01-b10
          speaker: insato
          text: 抓住我的尾巴。我先下去，再拉着你一起走。
        - id: ch01-b11
          speaker: narrator
          text: 戈帕尼－库法紧紧抓住蛇尾，跟着因萨托钻进洞里。他们向下，向下，一直向下，一连几天越走越深。终于，黑暗到了尽头，他们从洞底落进了一个美丽的国度。
    - id: ch02
      title: 地底的皮塔国
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 皮塔遍地都是低矮的青草，一群群牛、绵羊和山羊悠闲地吃着草。远处有一座大城，城里的方形石屋又高又大，屋顶闪着金光和锃亮的铁光。戈帕尼－库法回头寻找巨蟒，却只看见一个强壮英俊的男人。他把巨大的蛇皮裹在身上当衣服，手臂和脖颈戴满纯金圆环。
        - id: ch02-b02
          speaker: insato
          text: 我就是因萨托。在自己的国土里，我会变成人的模样。这里是皮塔，也是我统治的地方。
        - id: ch02-b03
          speaker: narrator
          text: 因萨托牵着戈帕尼－库法往城里走。他们经过河流，看到男人和女人在水里沐浴、捕鱼、划船。再往前，是结满稻谷、玉米和各种粮食的田园，其中有些作物，戈帕尼－库法连名字都没听过。田里劳作的人原本一边干活一边唱歌，一见国王归来，纷纷放下活计，欢喜地上前问候。他们还送来棕榈酒和青椰子为国王解渴，就像迎接一个长途归来的人。
        - id: ch02-b04
          speaker: insato
          text: 看，这些都是我的子民！
        - id: ch02-b05
          speaker: narrator
          text: 戈帕尼－库法一路惊叹，却始终没有开口。城里同样处处美丽，一个人想要什么，都能在这里得到，连街上的粒粒尘土也是金银化成的。因萨托带他进入王宫，让他看过自己住的房间，又把服侍他的少女指给他看。国王告诉他，今晚会举行一场盛宴。等到明天，他可以从皮塔所有的财富中任意挑选一样，国王一定会送给他。
        - id: ch02-b06
          speaker: narrator
          text: 戈帕尼－库法随身带着一个小芦苇篮，里面住着黄蜂曾吉－米兹。它并不是普通黄蜂。戈帕尼－库法父亲的灵魂进入了它体内，所以它智慧非凡。每逢难以决定的事，戈帕尼－库法都会问它。这一次，他把黄蜂放了出来。
        - id: ch02-b07
          speaker: gopani_kufa
          text: 曾吉－米兹，因萨托明天要酬谢我救命之恩。你说，我该向他要什么礼物？
        - id: ch02-b08
          speaker: zengi_mizi
          text: 嗡——向他要希帕奥魔镜。
        - id: ch02-b09
          speaker: narrator
          text: 黄蜂说完便飞回篮中。戈帕尼－库法虽然惊讶，却知道它从不说错，于是决定照办。那晚，他们尽情欢宴。第二天，因萨托高高兴兴地来见他。
        - id: ch02-b10
          speaker: insato
          text: 我的朋友，现在说吧。我的财宝当中，你选中的那一样就是你的！
        - id: ch02-b11
          speaker: gopani_kufa
          text: 大王，你所有的宝物里，我只想要那面镜子——希帕奥。
        - id: ch02-b12
          speaker: narrator
          text: 国王听了，猛然一惊。
        - id: ch02-b13
          speaker: insato
          text: 我的朋友，除了它，你要什么都可以！我真没想到，你会挑中我最珍贵的宝物。
          emotion: surprised
        - id: ch02-b14
          speaker: gopani_kufa
          text: 那就让我再想一天吧，大王。明天我再告诉你，我有没有改变主意。
        - id: ch02-b15
          speaker: narrator
          text: 因萨托离开后，仍在担心失去希帕奥。那是一面具有魔力的如愿镜。主人只要说出心愿，镜子便会让它成真。因萨托的一切，全是这面魔镜赐予的。戈帕尼－库法又取出曾吉－米兹。
        - id: ch02-b16
          speaker: gopani_kufa
          text: 国王不愿意把魔镜给我。难道没有另一件宝物，能和它同样珍贵吗？
        - id: ch02-b17
          speaker: zengi_mizi
          text: 戈帕尼－库法，世上没有任何宝物比得上它。谁拥有这面如愿镜，谁的心愿就能实现。国王要是犹豫，你明天再去，后天还去。你救过他的命，他最后一定会把镜子给你。
        - id: ch02-b18
          speaker: narrator
          text: 黄蜂说得没错。连续三天，戈帕尼－库法给国王的都是同一个答案。最后，因萨托含着眼泪，把磨得锃亮的铁镜交到他手中。
        - id: ch02-b19
          speaker: insato
          text: 戈帕尼－库法，拿走希帕奥吧。愿你的心愿都能成真。回自己的国土去吧，希帕奥会告诉你该走哪条路。
          emotion: sad
    - id: ch03
      title: 魔镜的心愿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 戈帕尼－库法欢喜极了。他向国王告别，立刻对镜子说出了第一个心愿。
        - id: ch03-b02
          speaker: gopani_kufa
          text: 希帕奥，希帕奥，我要回到地面上去！
        - id: ch03-b03
          speaker: narrator
          text: 转眼之间，他已经离开地底的皮塔，重新站在上方的大地上。可这里十分陌生，他不知道自己身在何处，更不知道家在什么方向，只好再次请求魔镜。
        - id: ch03-b04
          speaker: gopani_kufa
          text: 希帕奥，希帕奥，我要找到回自己村寨的路！
        - id: ch03-b05
          speaker: narrator
          text: 话音一落，一条道路就清清楚楚地出现在眼前。戈帕尼－库法沿路回到家，发现妻子和女儿正在哀悼他。她们以为他失踪了那么久，早已被狮子吃掉。戈帕尼－库法安慰她们，只说自己追赶受伤的羚羊时迷了路，在外漂泊许久，才重新找回归途。
        - id: ch03-b06
          speaker: narrator
          text: 当天晚上，他又问寄居着父亲灵魂的曾吉－米兹，接下来该向魔镜要些什么。
        - id: ch03-b07
          speaker: zengi_mizi
          text: 嗡——你不想成为因萨托那样伟大的首领吗？
        - id: ch03-b08
          speaker: narrator
          text: 戈帕尼－库法笑了，拿起希帕奥。
        - id: ch03-b09
          speaker: gopani_kufa
          text: 希帕奥，希帕奥，我要一座和皮塔国王因萨托的都城同样宏伟的城市。我还要做这座城的首领！
        - id: ch03-b10
          speaker: narrator
          text: 一眨眼，附近的赞比西河两岸便出现了整齐的街道和高大的石屋。屋顶像皮塔的屋顶一样，闪着黄金和锃亮的铁光。男人和女人走在街上，少年把绵羊和牛群赶到城外吃草。年轻的男女驾着独木舟在河上捕鱼，呼喊和笑声传遍水面。新城的百姓见到戈帕尼－库法，全都欢喜地拥戴他做首领。
        - id: ch03-b11
          speaker: narrator
          text: 戈帕尼－库法变得和爬行者之王同样强大。他和家人搬进城中央的王宫。那座宫殿高高耸立在所有房屋之上。妻子被接连出现的奇迹惊得连问题也问不出来，女儿莎萨萨却不断央求父亲，要他说清自己怎么忽然成了这样伟大的人。戈帕尼－库法最后告诉她全部秘密，还把希帕奥魔镜交给她保管。
        - id: ch03-b12
          speaker: gopani_kufa
          text: 女儿，镜子放在你那里更稳妥。你独自住在一边，我这里总有人来商量国事。留在我身边，它可能会被偷走。
        - id: ch03-b13
          speaker: narrator
          text: 莎萨萨接过魔镜，把它藏在自己的枕头下面。许多年过去了，戈帕尼－库法始终英明仁厚地治理百姓，让城中的每一个人都爱戴他。尽管魔镜就在身边，他也再没有求希帕奥实现过任何心愿。
    - id: ch04
      title: 布托的骗局
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 许多年过去，戈帕尼－库法渐渐老了，头发也开始变白。这时，白人来到了他的国家。他们沿赞比西河而上，和戈帕尼－库法打了一场漫长而激烈的战争。依靠魔镜的力量，戈帕尼－库法终于打败他们，把他们赶回遥远的海岸。白人的首领雷伊非常狡猾，一心想查出戈帕尼－库法的力量究竟从哪里来。一天，他叫来自己最信任的仆人布托。
        - id: ch04-b02
          speaker: rei
          text: 你到那座城里去，替我查清它为什么这样强大。
        - id: ch04-b03
          speaker: narrator
          text: 布托换上破衣烂衫，来到戈帕尼－库法的城市，开口求见首领。城里的百姓便把他带到戈帕尼－库法面前，他立刻把自己装得十分卑微。
        - id: ch04-b04
          speaker: butou
          text: 首领，请可怜可怜我吧，我已经无家可归了！雷伊攻打您的时候，只有我没有动手。我知道整个赞比西的力量都在您手里，不肯跟您作战。他就把我赶进森林，想让我活活饿死！
        - id: ch04-b05
          speaker: narrator
          text: 戈帕尼－库法相信了这个白人的故事。他收留布托，摆下宴席招待他，还送给他一所房屋。末日也就这样来临了。莎萨萨爱上了这个叛徒，布托也从她口中探听到魔镜的秘密。一天深夜，全城的人都睡熟以后，布托把手伸到她的枕头下面。摸到希帕奥以后，他立刻偷走魔镜，连夜逃回白人的首领雷伊那里。
    - id: ch05
      title: 预言应验
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 后来有一天，戈帕尼－库法站在王宫的一扇窗前，朝河流上游眺望。他又一次看见白人的战船沿河而来，心里立刻有了不祥的预感。
        - id: ch05-b02
          speaker: gopani_kufa
          text: 莎萨萨，我的女儿！快把魔镜拿来，白人已经逼近了！
          emotion: fearful
        - id: ch05-b03
          speaker: shasasa
          text: 父亲，我害了您！魔镜不见了！我爱上了叛徒布托，是他从我这里偷走了希帕奥！
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: 戈帕尼－库法强迫自己镇定下来，从芦苇篮里取出曾吉－米兹。
        - id: ch05-b05
          speaker: gopani_kufa
          text: 父亲的灵魂啊，现在我该怎么办？
        - id: ch05-b06
          speaker: zengi_mizi
          text: 戈帕尼－库法，如今已经什么都做不了了。你杀死的那只羚羊，它说过的话正在应验。
        - id: ch05-b07
          speaker: gopani_kufa
          text: 唉！我老了，竟把它的警告忘了！羚羊说的是真的。我的酬劳终会毁掉我，如今这句话终于应验了！
          emotion: sad
        - id: ch05-b08
          speaker: narrator
          text: 白人向戈帕尼－库法的百姓扑去，把城中的人连同首领和他的女儿莎萨萨一起杀死。从那以后，世上的一切权力便落入白人手中，因为那面能够实现一切心愿的希帕奥魔镜，已经归他们所有。
