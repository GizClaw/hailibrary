  chapters:
    - id: ch01
      title: The King of the Reptiles
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Long, long ago, before White Men had ever been seen in Senna, there lived a man named Gopani-Kufa. One day, while he was hunting, he came upon a strange sight. A huge python had wound itself around an antelope. The antelope had fought back with its horns and pinned the python's neck to a tree. Its horns had gone so deep into the soft wood that neither animal could escape."
        - id: ch01-b02
          speaker: antelope
          text: "Help me! I was doing no harm when this creature caught me. It would have eaten me if I hadn't fought back."
          emotion: fearful
        - id: ch01-b03
          speaker: insato
          text: "Free me! I am Insato, king of all the reptiles, and I will reward you richly."
        - id: ch01-b04
          speaker: narrator
          text: "Gopani-Kufa stopped to think. Then he drove his assegai into the antelope and set the python free."
        - id: ch01-b05
          speaker: insato
          text: "You have my thanks. Return when the new moon comes. By then I will have eaten the antelope, and I will give you the reward I promised."
        - id: ch01-b06
          speaker: antelope
          text: "Yes, he will reward you. And look! That reward will bring about your own ruin."
        - id: ch01-b07
          speaker: narrator
          text: "The antelope died, and Gopani-Kufa went home to his kraal. When the new moon came, he returned to the place where he had rescued Insato. The python lay on the ground, still drowsy after his enormous meal. He thanked Gopani-Kufa once more."
        - id: ch01-b08
          speaker: insato
          text: "Come with me now to my own country, Pita. You may choose whatever you wish from all that I possess."
        - id: ch01-b09
          speaker: narrator
          text: "At first Gopani-Kufa was afraid, for he remembered the antelope's warning. In the end, he agreed and followed Insato into the forest. They traveled for several days before reaching a hole that led deep beneath the earth. It was narrow, but wide enough for a man to enter."
        - id: ch01-b10
          speaker: insato
          text: "Take hold of my tail. I will go first and pull you down behind me."
        - id: ch01-b11
          speaker: narrator
          text: "Gopani-Kufa did as he was told, and Insato slipped into the hole, drawing the man after him. Down they went, day after day, farther and farther into the earth. It seemed the darkness would never end. At last it opened, and they dropped into a beautiful land. Short green grass spread around them, and herds of cattle, sheep, and goats grazed there. Far away stood a great gathering of tall, square houses built of stone. Their roofs gleamed with gold and polished iron."
        - id: ch01-b12
          speaker: narrator
          text: "Gopani-Kufa turned toward Insato. The python was gone. In his place stood a strong, handsome man, dressed in the great snake skin and wearing rings of pure gold on his arms and neck. The man smiled at him."
        - id: ch01-b13
          speaker: insato
          text: "I am Insato. Here in my own country, I take the shape of a man, just as you see. This is Pita, and I am its king."
        - id: ch01-b14
          speaker: narrator
          text: "Insato took Gopani-Kufa by the hand and led him toward the town. They passed rivers where people bathed, fished, and went boating. Beyond them were gardens heavy with rice, maize, and grains Gopani-Kufa could not name. The people had been singing as they worked. When they saw Insato, they left their fields and welcomed him joyfully with palm wine and green coconuts, as though he had returned from a long journey."
        - id: ch01-b15
          speaker: insato
          text: "These people are my children."
        - id: ch01-b16
          speaker: narrator
          text: "Gopani-Kufa was amazed by everything he saw, but he kept silent. The town itself was just as beautiful as the country around it. Anything a man might desire could be found there. Even the grains of dust in its streets were gold and silver. Insato brought his guest into the palace. He showed Gopani-Kufa the rooms prepared for him and the maidens who would wait upon him. There would be a great feast that night. In the morning, Gopani-Kufa could name whichever of Pita's riches he desired, and it would be given to him. Then the king went away."
    - id: ch02
      title: Sipao the Wishing Mirror
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Gopani-Kufa carried a wasp named Zengi-mizi in a little rush basket. This was no ordinary wasp. The spirit of Gopani-Kufa's father lived inside it, and that made it exceedingly wise. Whenever Gopani-Kufa was unsure what to do, he asked Zengi-mizi for advice. Now he took the wasp from its basket."
        - id: ch02-b02
          speaker: gopani_kufa
          text: "Zengi-mizi, what should I ask from Insato tomorrow as my reward for saving his life?"
        - id: ch02-b03
          speaker: zengi_mizi
          text: "Biz-z-z. Ask him for Sipao, the Mirror."
        - id: ch02-b04
          speaker: narrator
          text: "The wasp flew back into the basket. Its answer surprised Gopani-Kufa, but he knew Zengi-mizi always spoke the truth. He decided to ask for the Mirror. That night came the feast. The next morning, Insato greeted his guest with joy."
        - id: ch02-b05
          speaker: insato
          text: "My friend, choose anything I own, and it shall be yours."
        - id: ch02-b06
          speaker: gopani_kufa
          text: "O king, of everything you possess, I choose Sipao, the Mirror."
        - id: ch02-b07
          speaker: narrator
          text: "The king started at those words."
        - id: ch02-b08
          speaker: insato
          text: "My friend Gopani-Kufa, ask me for anything except that! I never thought you would choose the thing I value most."
        - id: ch02-b09
          speaker: gopani_kufa
          text: "Then let me consider it once more, O king. Tomorrow I will tell you whether I have changed my mind."
        - id: ch02-b10
          speaker: narrator
          text: "Insato went away deeply troubled, afraid that he might lose Sipao. The Mirror had magic power. Its owner had only to ask, and a wish would come true. Everything Insato possessed, all the wealth and wonder of Pita, had come to him through that Mirror. As soon as the king had gone, Gopani-Kufa brought Zengi-mizi out of the little basket again."
        - id: ch02-b11
          speaker: gopani_kufa
          text: "Zengi-mizi, the king does not want to give me the Mirror. Is there something else just as valuable that I could ask for?"
        - id: ch02-b12
          speaker: zengi_mizi
          text: "Nothing in the world is worth as much as that Mirror, Gopani-Kufa. Sipao is a Wishing Mirror. It grants the desires of whoever owns it. If the king delays, ask again tomorrow, and again the day after. In the end, he will give it to you, because you saved his life."
        - id: ch02-b13
          speaker: narrator
          text: "And so it happened. For three days, the king asked Gopani-Kufa to choose, and each time he gave the same answer. At last Insato came with tears in his eyes and handed him a mirror of polished iron."
        - id: ch02-b14
          speaker: insato
          text: "Then take Sipao, Gopani-Kufa, and may your wishes come true. Go back to your own country now. The Mirror will show you the way."
          emotion: sad
        - id: ch02-b15
          speaker: narrator
          text: "Gopani-Kufa rejoiced. He said farewell to the king and turned to his new treasure."
        - id: ch02-b16
          speaker: gopani_kufa
          text: "Sipao, Sipao, I wish to stand upon the Earth once more!"
          emotion: happy
        - id: ch02-b17
          speaker: narrator
          text: "In an instant, he was standing on the upper earth. He did not know the place, so he spoke to the Mirror again."
        - id: ch02-b18
          speaker: gopani_kufa
          text: "Sipao, Sipao, show me the path to my own kraal!"
        - id: ch02-b19
          speaker: narrator
          text: "At once, the path lay before him. When he reached home, he found his wife and daughter mourning. They believed lions had eaten him. Gopani-Kufa comforted them, but he did not tell them the truth. He said he had followed a wounded antelope, lost his way, and wandered for a long time before finding the path home."
    - id: ch03
      title: The City by the Zambesi
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "That night, Gopani-Kufa asked Zengi-mizi what he should request from Sipao next."
        - id: ch03-b02
          speaker: zengi_mizi
          text: "Biz-z-z. Wouldn't you like to be as great a chief as Insato?"
        - id: ch03-b03
          speaker: narrator
          text: "Gopani-Kufa smiled and raised the Mirror."
        - id: ch03-b04
          speaker: gopani_kufa
          text: "Sipao, Sipao, give me a town as great as the city of Insato, king of Pita, and make me its chief!"
        - id: ch03-b05
          speaker: narrator
          text: "All along the banks of the nearby Zambesi, streets of stone buildings sprang up. Their roofs shone with gold and polished iron, just like the roofs in Pita. The town was alive at once. Men and women walked through the streets. Young boys drove flocks of sheep and herds of cattle out to pasture. From the river came laughter and shouts as young men and maidens launched their canoes and began to fish. When the people of the new town saw Gopani-Kufa, they rejoiced greatly and hailed him as their chief."
        - id: ch03-b06
          speaker: narrator
          text: "Now Gopani-Kufa was as powerful as Insato, king of the reptiles. He and his family moved into the palace that rose above all the other buildings in the center of town. His wife was too astonished by these wonders to ask him anything. But his daughter, Shasasa, kept begging to know how he had suddenly become so great. At last he told her the entire secret and placed Sipao in her care."
        - id: ch03-b07
          speaker: gopani_kufa
          text: "The Mirror will be safer with you, my daughter, because you live apart. Men come to me every day with the affairs of the kingdom, and one of them might steal it."
        - id: ch03-b08
          speaker: narrator
          text: "Shasasa hid the Magic Mirror beneath her pillow. Many years passed. Gopani-Kufa ruled his people well and wisely, and every man loved him. Not once in all that time did he need to ask Sipao for another wish."
    - id: ch04
      title: Butou the Traitor
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "After many years, when Gopani-Kufa's hair was turning gray with age, White Men came to his country. They traveled up the Zambesi in their war canoes and fought long and fiercely against him. But the power of the Magic Mirror allowed Gopani-Kufa to defeat them, and they fled all the way back toward the seacoast. Their chief was Rei, a cunning man. He could not understand where Gopani-Kufa's great power came from, and he was determined to uncover its source. One day, he summoned a trusted servant named Butou."
        - id: ch04-b02
          speaker: rei
          text: "Go into that town and discover the secret behind its greatness."
        - id: ch04-b03
          speaker: narrator
          text: "Butou dressed himself in rags and set out. When he reached Gopani-Kufa's town, he asked to see the chief. The people brought him into Gopani-Kufa's presence. There, Butou bowed low before him."
        - id: ch04-b04
          speaker: butou
          text: "O Chief, have mercy on me. I have no home. When Rei marched against you, I was the only man who refused to join him. I knew all the strength of the Zambesi was in your hands. Because I would not fight you, Rei drove me into the forest and left me there to starve."
        - id: ch04-b05
          speaker: narrator
          text: "Gopani-Kufa believed the story. He welcomed the stranger, gave him a feast, and provided him with a house. And that was how the end began. Shasasa gave her heart to Butou, the traitor, and from her he learned the secret of the Magic Mirror. One night, while the whole town slept, he reached beneath her pillow. He found Sipao, stole it, and fled back to Rei, chief of the White Men."
    - id: ch05
      title: The Antelope's Warning
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "One day, Gopani-Kufa stood at a palace window and looked out over the river. Once again, he saw the war canoes of the White Men. At that sight, dread filled his heart."
        - id: ch05-b02
          speaker: gopani_kufa
          text: "Shasasa! My daughter! Bring me the Mirror. The White Men are coming!"
          emotion: fearful
        - id: ch05-b03
          speaker: shasasa
          text: "Oh, Father, the Mirror is gone! I loved Butou, the traitor, and he stole Sipao from me!"
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: "Gopani-Kufa mastered himself. He took Zengi-mizi from the little rush basket and appealed to the spirit within the wasp."
        - id: ch05-b05
          speaker: gopani_kufa
          text: "O spirit of my father, tell me what I can do now."
        - id: ch05-b06
          speaker: zengi_mizi
          text: "O Gopani-Kufa, nothing can be done now. The words of the antelope you killed are coming true."
        - id: ch05-b07
          speaker: gopani_kufa
          text: "Alas! I am an old man, and I had forgotten. The antelope spoke truly. My reward would bring my undoing, and now it has."
          emotion: sad
        - id: ch05-b08
          speaker: narrator
          text: "Then the White Men fell upon Gopani-Kufa's people. They killed them, along with the chief and his daughter Shasasa."
        - id: ch05-b09
          speaker: narrator
          text: "And from that time on, all the power of the Earth has rested in the hands of the White Men, because Sipao, the Magic Mirror, is in their possession."
