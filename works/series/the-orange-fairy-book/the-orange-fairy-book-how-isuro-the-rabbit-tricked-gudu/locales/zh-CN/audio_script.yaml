audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    isuro:
      display_name: 伊苏罗
      tts:
        delivery: 起初温顺谨慎，后来机敏大胆
        timbre: 清亮灵活
        pace: 轻快
        pitch: 中高
    gudu:
      display_name: 古杜
      tts:
        delivery: 狡猾自负，受挫时急躁慌乱
        timbre: 粗厚有力
        pace: 适中
        pitch: 中低
    old_man:
      display_name: 老人
      tts:
        delivery: 直率严肃，判断时果断
        timbre: 苍老清晰
        pace: 稳健
        pitch: 低
    villager:
      display_name: 村民
      tts:
        delivery: 朴实坚决，面对争执时审慎
        timbre: 成熟清晰
        pace: 适中
        pitch: 中
    villager_2:
      display_name: 村民甲
      tts:
        delivery: 激动而愤慨
        timbre: 明亮有力
        pace: 稍快
        pitch: 中
    villager_3:
      display_name: 村民乙
      tts:
        delivery: 激动而愤慨
        timbre: 厚实清晰
        pace: 稍快
        pitch: 中低
  chapters:
    - id: ch01
      title: 河边的骗局
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 在一个遥远炎热的国度，森林又密又暗，河水又急又猛。那里住着一对形影不离的朋友，一个是大白兔伊苏罗，一个是高个子狒狒古杜。
        - id: ch01-b02
          speaker: narrator
          text: 一天中午，太阳晒得格外厉害。伊苏罗刚睡醒，就看见古杜站在身边。
        - id: ch01-b03
          speaker: gudu
          text: 快起来，我要去向姑娘求婚，你得陪我去。带一袋吃的挂在脖子上，路上可能很久找不到食物。
        - id: ch01-b04
          speaker: narrator
          text: 伊苏罗揉揉眼睛，从灌木下采了许多鲜嫩绿叶，便和古杜上路了。他们走到一条河边，水面散落着一块块岩石。
        - id: ch01-b05
          speaker: gudu
          text: 背着食物，哪能跳过那么宽的缺口？要是不想掉进河里，只能把袋子扔掉。
        - id: ch01-b06
          speaker: narrator
          text: 伊苏罗走在前面，没有留意身后的动静。古杜趁他看不见，弯腰捡起一块大石头，用力扔进河水，激起响亮的“扑通”一声，装得就像自己已经扔掉了食物。
        - id: ch01-b07
          speaker: gudu
          text: 该你扔了！
        - id: ch01-b08
          speaker: narrator
          text: 伊苏罗听信了他的话，重重叹了口气，解下装满食物的袋子，让它落进河里。两人跳过岩石，走上对岸的林荫道。没走多远，古杜却从颈间浓密的毛里取出藏好的袋子，津津有味地吃起那些看上去十分可口的果子。
        - id: ch01-b09
          speaker: isuro
          text: 你的果子是从哪儿来的？
        - id: ch01-b10
          speaker: gudu
          text: 我后来发现，带着袋子也能轻松跳过来。既然这样，何必丢掉呢？
        - id: ch01-b11
          speaker: isuro
          text: 你骗我扔了食物，至少该分我一点儿吧。
        - id: ch01-b12
          speaker: narrator
          text: 古杜装作没听见，只顾迈开长腿沿小路往前走。不久，他们进入一片树林，看见正前方有一棵果实累累的树。树枝被果子压得一直垂到地上，果子有些还是青的，有些已经黄了。伊苏罗早已饿坏，一看见它们，便欢喜地跳过去。
        - id: ch01-b13
          speaker: gudu
          text: 你吃青果子，那才最好吃。你没吃午饭，青的全给你，我只拿黄的。
        - id: ch01-b14
          speaker: narrator
          text: 伊苏罗咬了一枚青橙子，硬皮几乎连牙也咬不穿。
        - id: ch01-b15
          speaker: isuro
          text: 这根本不好吃。我想吃一枚黄的。
        - id: ch01-b16
          speaker: gudu
          text: 不行！黄果子会让你生病。你就吃青的吧。
        - id: ch01-b17
          speaker: narrator
          text: 古杜不肯让步，伊苏罗又没有别的可吃，只好忍着吞下青果。类似的事接连发生了两三回，他终于看明白了这位朋友的把戏，也暗暗拿定主意，往后不管古杜叫他做什么，自己都要反着做。
    - id: ch02
      title: 空盘子与真果仁
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 到了古杜未婚妻居住的村子，古杜指着路旁一丛灌木，先叮嘱伊苏罗。
        - id: ch02-b02
          speaker: gudu
          text: 等我吃东西时，要是我喊嘴被烫伤了，你就赶快来摘这种叶子替我治伤。
        - id: ch02-b03
          speaker: narrator
          text: 伊苏罗想问他为什么明知会烫还要吃，却因为害怕，只点点头。走了一段，他忽然停下。
        - id: ch02-b04
          speaker: isuro
          text: 我的针掉了。你等等，我回去找。
        - id: ch02-b05
          speaker: gudu
          text: 那你快点儿。
        - id: ch02-b06
          speaker: narrator
          text: 古杜一边催促，一边爬上了一棵树。伊苏罗赶紧跑回那片灌木，摘下足够多的叶子，仔细藏进自己的毛里。他想着，现在先准备好，待会儿古杜喊嘴被烫伤，自己就不必再走一趟。摘够以后，他才回到古杜身边，两人继续赶路。
        - id: ch02-b07
          speaker: narrator
          text: 等他们终于抵达旅程的终点，太阳已经快要落山。两人走得筋疲力尽，都高高兴兴地在井边坐下。古杜的未婚妻一直等着他们，这时拿出一只水罐，把水浇在两人身上，替他们洗掉沿途的尘土，又端来两份食物。伊苏罗正满怀希望，古杜却抢先开口。
        - id: ch02-b08
          speaker: gudu
          text: 村里有规矩，我没吃完以前，你不能吃。
        - id: ch02-b09
          speaker: narrator
          text: 伊苏罗不知道这是谎话，只能饿着肚子等。过了一会儿，古杜突然大叫起来，其实他一点儿也没被烫伤。
        - id: ch02-b10
          speaker: gudu
          text: 烫死我了！烫死我了！
        - id: ch02-b11
          speaker: narrator
          text: 伊苏罗不敢立刻拿出藏好的叶子，怕古杜猜出他刚才回去做了什么。他绕到墙角，等了一会儿，才匆忙跳回来。可古杜已经把食物吃光，只剩几滴水。
        - id: ch02-b12
          speaker: gudu
          text: 你运气真坏。你一走就来了许多人，他们洗过手，还吃掉了你那一份。
        - id: ch02-b13
          speaker: narrator
          text: 伊苏罗当然知道古杜在撒谎，也知道根本没有什么人来吃掉那份食物。可他没有揭穿古杜，只是一句话也没说。那一夜，他饿着肚子上床，觉得自己这一辈子从来没有这么饿过。
        - id: ch02-b14
          speaker: narrator
          text: 第二天一早，两人前往另一个村子，途中经过一座园子。人们正忙着收花生。古杜指向一堆空壳，以为伊苏罗还会乖乖受骗。
        - id: ch02-b15
          speaker: gudu
          text: 这回你总算能吃一顿好早饭了。
        - id: ch02-b16
          speaker: isuro
          text: 谢谢，可我更想吃这些果仁。
        - id: ch02-b17
          speaker: narrator
          text: 伊苏罗没有理会那堆空壳，转身吃起真正的花生仁，一直吃到一颗也不剩。古杜又惊又恼，可四周到处都是忙碌的人。他就算想从伊苏罗手里抢走果仁，也不敢当着大家的面动手。
    - id: ch03
      title: 黑暗中的较量
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 天黑时，他们到了古杜未婚妻母亲的村子。主人端来肉和小米粥。
        - id: ch03-b02
          speaker: gudu
          text: 我记得你说过，你最爱喝粥。
        - id: ch03-b03
          speaker: isuro
          text: 你把我认成别人了。只要有肉，我从来都选肉。
        - id: ch03-b04
          speaker: narrator
          text: 这一回，古杜只好勉强吃自己最讨厌的小米粥。可他一边吃，一边又想出了坏主意。他瞅准机会，故意撞翻挂在火堆前的一大罐水。水全泼在火上，把火彻底浇灭，屋里也随之暗了下来。
        - id: ch03-b05
          speaker: narrator
          text: 古杜暗自得意，想趁黑偷走伊苏罗的肉。可兔子已经和他一样机灵，早就站到角落，把肉藏在身后。古杜摸遍四周，也没找到。
        - id: ch03-b06
          speaker: isuro
          text: 古杜，是你教会了我怎么变聪明！
        - id: ch03-b07
          speaker: narrator
          text: 伊苏罗大笑着叫屋里人重新生火。他说古杜要睡在火边，自己则到另一间茅屋和朋友们过夜。
        - id: ch03-b08
          speaker: narrator
          text: 天还没亮，伊苏罗听见有人轻声唤他。睁眼一看，古杜正把手指按在鼻子上，示意他别出声，再招手叫他跟来。离开茅屋一段路后，古杜才开口。
        - id: ch03-b09
          speaker: gudu
          text: 我还饿着，想吃点儿比昨晚那碗粥更好的。我要杀一只山羊，你会做饭，就替我把肉煮熟。
        - id: ch03-b10
          speaker: narrator
          text: 伊苏罗点了点头。古杜绕到一块岩石后面，很快便拖着一只死山羊回来。两人一起剥下羊皮，再往皮里塞满干树叶，直到谁也看不出这只羊已经死了。随后，他们把假羊立在一丛茂密的灌木中间。四周枝叶牢牢撑住羊皮，让它稳稳站在自己的四条腿上。
        - id: ch03-b11
          speaker: narrator
          text: 古杜摆弄羊皮的时候，伊苏罗在四周收集树枝，生起一堆火。古杜又赶到另一间茅屋，偷来一口锅，到河边把锅装满水。他们把两根树枝插进地里，将羊肉放进锅中，再把锅吊在树枝之间，架到火上慢慢煮。
        - id: ch03-b12
          speaker: gudu
          text: 至少还得煮两个钟头。我们都睡一会儿吧。
        - id: ch03-b13
          speaker: narrator
          text: 古杜躺下装睡，只等伊苏罗睡熟，好独吞那锅肉。他以为听见了鼾声，便偷偷走到木柴堆旁，却看见兔子的眼睛睁得滚圆。
        - id: ch03-b14
          speaker: gudu
          text: 真烦人。
        - id: ch03-b15
          speaker: narrator
          text: 古杜嘟囔着回到原处，又耐着性子等了一阵。他再次起身窥看，可兔子那双粉红色的眼睛还是瞪得大大的。古杜哪里知道，伊苏罗其实从头到尾都睡得很香。兔子天生睁着眼睛也能睡觉。古杜怎么也猜不到，守到后来，自己反而疲惫不堪，沉沉睡着了。
        - id: ch03-b16
          speaker: narrator
          text: 不久伊苏罗醒来，也觉得饿。他悄悄爬到锅边，把肉吃得精光，又把骨头串起来，挂进古杜的毛里，然后回到木柴堆继续睡觉。
    - id: ch04
      title: 谁是杀羊贼
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 早晨，古杜未婚妻的母亲出来挤羊奶。她走到灌木边，以为最大的一只羊被缠住了，这才发现那只剩塞满干叶的羊皮。她放声哭号，村民纷纷赶来。
        - id: ch04-b02
          speaker: narrator
          text: 村里人听见哭声，全都跑了过来。古杜和伊苏罗也从睡梦中跳起来，混进人群，装出和大家一样惊讶、一样关切的样子。可他们脸上终究还是露出了心虚的神色。一位老人盯着他们看了一会儿，忽然伸手指住两人。
        - id: ch04-b03
          speaker: old_man
          text: 他们两个就是贼！
        - id: ch04-b04
          speaker: narrator
          text: 高大的古杜听见这话，吓得浑身发抖。伊苏罗却毫不畏缩。
        - id: ch04-b05
          speaker: isuro
          text: 你凭什么这么说？拿出证据来！
        - id: ch04-b06
          speaker: narrator
          text: 他跳到众人面前，翻了个跟头，又抖了抖全身。
        - id: ch04-b07
          speaker: old_man
          text: 是我说得太急，你没有偷羊。现在让狒狒也照着做。
        - id: ch04-b08
          speaker: narrator
          text: 古杜刚一跳，藏在毛里的羊骨便咔啦作响。村民们立刻喊了起来。
        - id: ch04-b09
          speakers: [villager, villager_2, villager_3]
          ensemble: chorus
          text: 古杜就是杀羊贼！
          emotion: angry
        - id: ch04-b10
          speaker: gudu
          text: 不！你们的羊不是我杀的。是伊苏罗杀了羊，吃了肉，又把骨头挂到我脖子上。该死的是他！
        - id: ch04-b11
          speaker: narrator
          text: 古杜一口气把罪名全推给伊苏罗。村民们听了他的话，又看看毫不畏缩的兔子，彼此面面相觑。他们不知道究竟该相信哪一个。争执不下时，终于有一个人开口，替大家作出了决定。
        - id: ch04-b12
          speaker: villager
          text: 那就让你们两个都死，不过死法可以自己选。
    - id: ch05
      title: 木柴堆下的洞
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 伊苏罗马上回答了。
        - id: ch05-b02
          speaker: isuro
          text: 既然非死不可，就把我们放到砍柴的地方，四周堆满木柴，让谁也逃不掉，然后放火。一个烧死，一个没烧死，那么烧死的就是杀羊贼。
        - id: ch05-b03
          speaker: narrator
          text: 村民依照伊苏罗所说，把两人带到砍柴的地方，又在他们周围堆满木柴，堵住所有逃路，随后点起了火。可是伊苏罗早就知道，这堆木柴底下藏着一个洞。火焰一起，他立刻钻进洞中躲了起来，古杜却无处可逃，死在了烈火里。
        - id: ch05-b04
          speaker: narrator
          text: 大火终于自行熄灭。原来堆着木柴的地方，只剩一片灰烬。伊苏罗从洞里钻出来，对村民们说道。
        - id: ch05-b05
          speaker: isuro
          text: 瞧，我说得没错吧？杀死你们山羊的家伙，就在那堆灰里。
        - id: ch05-b06
          speaker: narrator
          text: 这是一则马绍纳人的故事。
