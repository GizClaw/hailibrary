audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "steady, vivid folktale storytelling"
        timbre: "warm and resonant"
        pace: "measured"
        pitch: "medium"
    isuro:
      display_name: Isuro
      tts:
        delivery: "quick-witted, lively, and increasingly bold"
        timbre: "light and clear"
        pace: "brisk"
        pitch: "medium-high"
    gudu:
      display_name: Gudu
      tts:
        delivery: "confident, crafty, and self-satisfied"
        timbre: "deep and rough"
        pace: "measured"
        pitch: "low"
    old_man:
      display_name: Old Man
      tts:
        delivery: "watchful, firm, and decisive"
        timbre: "dry and aged"
        pace: "measured"
        pitch: "medium-low"
    villager_one:
      display_name: First Villager
      tts:
        delivery: "plainspoken and resolute"
        timbre: "clear and sturdy"
        pace: "measured"
        pitch: "medium"
    villager_two:
      display_name: Second Villager
      tts:
        delivery: "direct and emphatic"
        timbre: "bright and firm"
        pace: "measured"
        pitch: "medium-high"
    villager_three:
      display_name: Third Villager
      tts:
        delivery: "serious and forceful"
        timbre: "full and steady"
        pace: "measured"
        pitch: "medium-low"
  chapters:
    - id: ch01
      title: The Journey Begins
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Far away, in a hot country of thick, dark forests and swift, strong rivers, there lived an odd pair of friends. One was Isuro, a big white rabbit. The other was Gudu, a tall baboon. They were so fond of each other that people hardly ever saw one without the other."
        - id: ch01-b02
          speaker: narrator
          text: "One day, when the sun was hotter than usual, Isuro woke from his midday sleep. Gudu was standing beside him."
        - id: ch01-b03
          speaker: gudu
          text: "Get up, Isuro. I am going courting, and you must come along. Fill a bag with food and hang it around your neck. We may not find anything else to eat for a long time."
        - id: ch01-b04
          speaker: narrator
          text: "Isuro rubbed his eyes. He gathered plenty of fresh green food from beneath the bushes, packed it in a bag, and told Gudu he was ready."
        - id: ch01-b05
          speaker: narrator
          text: "For a while, the two friends traveled happily. Then they reached a river. Rocks lay scattered across the rushing water, with wide gaps between them."
        - id: ch01-b06
          speaker: gudu
          text: "We will never jump those gaps while we are carrying food. We must throw our bags into the river, or we may fall in ourselves."
        - id: ch01-b07
          speaker: narrator
          text: "Isuro stood ahead of him and could not see what Gudu did next. The baboon bent down, picked up a large stone, and threw it into the river. It struck the water with a great splash."
        - id: ch01-b08
          speaker: gudu
          text: "There. Now it is your turn."
        - id: ch01-b09
          speaker: narrator
          text: "With a heavy sigh, Isuro untied his own bag. It dropped into the river and was swept away."
        - id: ch01-b10
          speaker: narrator
          text: "Beyond the river, the road ran between rows of trees. They had not gone far when Gudu pulled a bag from the thick hair around his neck. He opened it and began eating fruit that looked delicious."
        - id: ch01-b11
          speaker: isuro
          text: "Where did you get that fruit?"
        - id: ch01-b12
          speaker: gudu
          text: "Oh, I discovered I could cross the rocks easily enough after all. It seemed a shame to throw away a perfectly good bag."
        - id: ch01-b13
          speaker: isuro
          text: "But you fooled me into throwing mine away. You should share yours with me."
        - id: ch01-b14
          speaker: narrator
          text: "Gudu acted as though he had heard nothing. He simply strode on down the path."
        - id: ch01-b15
          speaker: narrator
          text: "After a while, they entered a wood. Just ahead stood a tree so heavy with fruit that its branches brushed the ground. Some of the fruit was green, and some was yellow. Isuro hopped toward it with delight. By now he was very hungry."
        - id: ch01-b16
          speaker: gudu
          text: "Pick the green fruit. That is the best kind. Since you missed your dinner, I will leave every green one for you and take only the yellow ones myself."
        - id: ch01-b17
          speaker: narrator
          text: "Isuro chose a green orange and tried to bite it. The skin was so hard that his teeth could scarcely break through the rind. He twisted his face at the taste."
        - id: ch01-b18
          speaker: isuro
          text: "This is not nice at all. I would much rather eat one of the yellow oranges."
        - id: ch01-b19
          speaker: gudu
          text: "No, no, I cannot let you do that. Yellow fruit would only make you ill. You must be satisfied with the green kind."
        - id: ch01-b20
          speaker: narrator
          text: "The green oranges were all Gudu allowed him, so Isuro had to endure them. The same sort of trick happened two or three times. At last, Isuro understood. From then on, whatever Gudu told him to do, he meant to do exactly the opposite."
    - id: ch02
      title: Hungry at the Well
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "By then, they had reached the village where Gudu's future wife lived. As they entered, Gudu pointed toward a clump of bushes."
        - id: ch02-b02
          speaker: gudu
          text: "Whenever I am eating, listen carefully. If I cry out that my food has burned me, run to those bushes as fast as you can. Gather some of those leaves and bring them back to heal my mouth."
        - id: ch02-b03
          speaker: narrator
          text: "Isuro wanted to ask why Gudu would eat food he knew could burn him. But the rabbit was afraid, so he only nodded. A little farther on, Isuro stopped."
        - id: ch02-b04
          speaker: isuro
          text: "I dropped my needle. Wait here while I go back for it."
        - id: ch02-b05
          speaker: gudu
          text: "Then be quick about it."
        - id: ch02-b06
          speaker: narrator
          text: "Gudu climbed into a tree. Isuro hurried back to the bushes and gathered a great many of the leaves. He tucked them into his fur. If he collected them now, he thought, he would not have to make the walk later. Once he had enough, he returned to Gudu, and they continued together."
        - id: ch02-b07
          speaker: narrator
          text: "The sun was nearly down when the travelers finally arrived. Tired from the road, they gladly sat beside a well. Gudu's betrothed had been watching for him. She came out with a pitcher and poured water over them, washing away the dust. Then she brought two portions of food."
        - id: ch02-b08
          speaker: narrator
          text: "Once again, Isuro's hopes fell. Gudu spoke before the rabbit could begin eating."
        - id: ch02-b09
          speaker: gudu
          text: "The custom in this village says you may not eat until I have finished."
        - id: ch02-b10
          speaker: narrator
          text: "Isuro did not know Gudu was lying simply because he wanted more food. The hungry rabbit sat and watched while his friend ate his fill."
        - id: ch02-b11
          speaker: gudu
          text: "I am burned! I am burned!"
        - id: ch02-b12
          speaker: narrator
          text: "Gudu was not burned at all. Isuro already had the leaves with him, but he did not dare bring them out at once. Gudu might guess why he had gone back earlier. So Isuro slipped around a corner, waited a short while, and came hopping back as fast as he could."
        - id: ch02-b13
          speaker: narrator
          text: "Quick as Isuro was, Gudu had been quicker. All the food was gone. Only a few drops of water remained. Gudu snatched the leaves from him."
        - id: ch02-b14
          speaker: gudu
          text: "What terrible luck you have! The moment you left, a great many people came. They washed their hands, as you can see, and then they ate your portion."
        - id: ch02-b15
          speaker: narrator
          text: "Isuro knew better than to believe that tale, but he said nothing. He went to bed hungrier than he had ever been before."
    - id: ch03
      title: Isuro Does the Opposite
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Early the next morning, Isuro and Gudu set out for another village. Along the way, they passed a large garden. Many people were busy there, gathering monkey nuts."
        - id: ch03-b02
          speaker: gudu
          text: "At last, you can have a good breakfast."
        - id: ch03-b03
          speaker: narrator
          text: "Gudu pointed to a heap of empty shells. He had no doubt that Isuro would obediently eat those and leave the real nuts for him. But the rabbit gave him quite a surprise."
        - id: ch03-b04
          speaker: isuro
          text: "Thank you, but I believe I would rather have these."
        - id: ch03-b05
          speaker: narrator
          text: "Isuro turned to the kernels and ate without stopping until not one was left. With so many people nearby, Gudu could not take the nuts away from him."
        - id: ch03-b06
          speaker: narrator
          text: "Night had fallen when they reached the village of Gudu's future mother-in-law. She set meat and millet porridge before the travelers."
        - id: ch03-b07
          speaker: gudu
          text: "As I remember it, you told me you were very fond of porridge."
        - id: ch03-b08
          speaker: isuro
          text: "You must be thinking of someone else. Whenever meat is available, that is what I eat."
        - id: ch03-b09
          speaker: narrator
          text: "Once again, Gudu had no choice. He had to make do with the porridge, which he hated. But as he ate, an idea flashed into his mind. He knocked over a large pot of water that hung in front of the fire. The water put the flames completely out."
        - id: ch03-b10
          speaker: gudu
          text: "Now it is dark enough for me to steal Isuro's meat."
        - id: ch03-b11
          speaker: narrator
          text: "But Isuro had grown just as cunning as Gudu. He stood in a corner with the meat hidden behind him, and the baboon could not find it. Isuro laughed aloud."
        - id: ch03-b12
          speaker: isuro
          text: "Oh, Gudu! You are the one who taught me how to be clever."
        - id: ch03-b13
          speaker: narrator
          text: "Isuro called to the people in the house. He asked them to light the fire again because Gudu would sleep beside it. As for Isuro, he would spend the night with friends in another hut."
    - id: ch04
      title: The Goat and the Bones
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "It was still completely dark when Isuro heard someone calling his name very softly. He opened his eyes and saw Gudu beside him. The baboon put a finger to his nose as a sign to keep quiet, then motioned for Isuro to get up and follow. Only when they were well away from the hut did Gudu speak."
        - id: ch04-b02
          speaker: gudu
          text: "I am hungry. I want something better than that nasty porridge I had for supper. I am going to kill one of those goats. You are a good cook, so you must boil the meat for me."
        - id: ch04-b03
          speaker: narrator
          text: "Isuro nodded. Gudu vanished behind a rock and soon came back dragging a dead goat. Together they skinned it. Then they packed the empty skin with dried leaves until no one would have guessed the goat was dead. They stood it among a thick clump of bushes, which held it upright."
        - id: ch04-b04
          speaker: narrator
          text: "While they worked, Isuro gathered sticks for a fire. Once it was burning, Gudu hurried to another hut and stole a pot. He filled it with water from the river. They planted two branches in the ground, hung the pot between them, and put the meat inside to cook over the flames."
        - id: ch04-b05
          speaker: gudu
          text: "This will need at least two hours before it is ready. We may as well both take a nap."
        - id: ch04-b06
          speaker: narrator
          text: "Gudu stretched out on the ground and pretended to fall fast asleep. In truth, he was waiting for a chance to take all the meat. After a while, he thought he could hear Isuro snoring. He crept over to the pile of wood where the rabbit lay, but Isuro's eyes were wide open."
        - id: ch04-b07
          speaker: gudu
          text: "This is tiresome."
        - id: ch04-b08
          speaker: narrator
          text: "Gudu returned to his place. He waited a little longer, then rose and peeked again. Isuro's pink eyes were still staring wide. What Gudu did not know was that Isuro had been asleep the whole time. At last, the baboon grew so weary from watching that he truly fell asleep."
        - id: ch04-b09
          speaker: narrator
          text: "Soon afterward, Isuro woke. He was hungry too. He crept quietly to the pot and ate every piece of meat. Then he tied the bones together and hung them in Gudu's fur. When that was done, he went back to the woodpile and fell asleep again."
        - id: ch04-b10
          speaker: narrator
          text: "In the morning, Gudu's future mother-in-law came out to milk her goats. The largest goat seemed to be caught in the bushes. When she went closer, she discovered the trick and began to wail. People came running from all through the village. Gudu and Isuro jumped up too, pretending to be as astonished and concerned as everyone else."
        - id: ch04-b11
          speaker: narrator
          text: "Even so, the pair must have looked guilty. An old man suddenly pointed at them."
        - id: ch04-b12
          speaker: old_man
          text: "Those two are the thieves!"
        - id: ch04-b13
          speaker: narrator
          text: "At the sound of that accusation, big Gudu trembled from head to foot. Isuro answered boldly."
        - id: ch04-b14
          speaker: isuro
          text: "How dare you accuse us? Go on, then. Prove what you have said."
        - id: ch04-b15
          speaker: narrator
          text: "Isuro danced forward. In front of everyone, he turned head over heels and shook his whole body."
        - id: ch04-b16
          speaker: old_man
          text: "I spoke too quickly. You are innocent. Now the baboon must do the same."
        - id: ch04-b17
          speaker: narrator
          text: "Gudu began to jump. At once, the goat's bones rattled in his fur, and the villagers cried out together."
        - id: ch04-b18
          speakers: [villager_one, villager_two, villager_three]
          ensemble: chorus
          text: "Gudu is the one who killed the goat!"
    - id: ch05
      title: The Trial by Fire
      blocks:
        - id: ch05-b01
          speaker: gudu
          text: "No, I did not kill your goat. Isuro killed it. He ate the meat and hung the bones around my neck. He is the one who ought to die!"
        - id: ch05-b02
          speaker: narrator
          text: "The villagers looked at one another. They did not know which of the two to believe. At last, one man gave his judgment."
        - id: ch05-b03
          speaker: villager_one
          text: "Then they shall both die, but each may choose the way he dies."
        - id: ch05-b04
          speaker: isuro
          text: "If we must die, take us to the place where you cut wood. Pile the wood all around us so we cannot escape, and set it alight. If one of us burns and the other does not, the one who burns is the goat-slayer."
        - id: ch05-b05
          speaker: narrator
          text: "The people did exactly as Isuro had asked. But Isuro knew there was a hole beneath the woodpile. When the fire was lit, the rabbit slipped into that hole, while Gudu died in the flames."
        - id: ch05-b06
          speaker: narrator
          text: "The fire burned itself out. At last, nothing remained where the wood had stood but ashes. Then Isuro climbed from his hiding place and faced the people."
        - id: ch05-b07
          speaker: isuro
          text: "Look! Did I not choose wisely? The one who killed your goat is there among the ashes."
        - id: ch05-b08
          speaker: narrator
          text: "This was a Mashona story."
