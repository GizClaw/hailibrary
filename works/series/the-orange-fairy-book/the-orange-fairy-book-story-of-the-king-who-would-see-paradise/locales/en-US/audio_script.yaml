audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "steady, vivid folktale storytelling"
        timbre: "warm and resonant"
        pace: "measured"
        pitch: "medium"
    king:
      display_name: King
      tts:
        delivery: "commanding, curious, and increasingly humbled"
        timbre: "full and mature"
        pace: "measured"
        pitch: "medium-low"
    fakeer:
      display_name: Fakeer
      tts:
        delivery: "quiet, solemn, and gently cautioning"
        timbre: "soft and weathered"
        pace: "unhurried"
        pitch: "low"
    chamberlain:
      display_name: Chamberlain
      tts:
        delivery: "formal and watchful"
        timbre: "clear and restrained"
        pace: "measured"
        pitch: "medium"
    new_king:
      display_name: King on the Throne
      tts:
        delivery: "dignified and compassionate"
        timbre: "calm and authoritative"
        pace: "measured"
        pitch: "medium-low"
  chapters:
    - id: ch01
      title: The King's Request
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Once upon a time, a king was hunting in a lonely part of the mountains. There he came upon a fakeer. The holy man sat on a little old bedstead, reading the Koran, with a patched cloak around his shoulders."
        - id: ch01-b02
          speaker: king
          text: "What are you reading?"
        - id: ch01-b03
          speaker: fakeer
          text: "I am reading about Paradise. I am also praying that I may be worthy to enter it."
        - id: ch01-b04
          speaker: narrator
          text: "They talked for a while. Then the king made a strange request. He found it hard to believe in anything he could not see."
        - id: ch01-b05
          speaker: king
          text: "Can you let me see even one glimpse of Paradise?"
        - id: ch01-b06
          speaker: fakeer
          text: "You ask for something very difficult, and it may be dangerous. I will pray for you, and perhaps I can do it. But your unbelief is dangerous, and so is the curiosity that makes you ask."
        - id: ch01-b07
          speaker: narrator
          text: "The warning did not change the king's mind. He promised to provide the fakeer with food from then on, if the holy man would pray for him. The fakeer agreed, and they parted."
        - id: ch01-b08
          speaker: narrator
          text: "Time passed. The king always sent the food he had promised. Again and again, he also sent to ask when the fakeer would show him Paradise. The answer was always the same."
        - id: ch01-b09
          speaker: fakeer
          text: "The time has not come yet. It has not come yet."
    - id: ch02
      title: The Grave Opens
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "A year or two went by. Then word reached the king that the fakeer was very ill and might be dying. The king hurried to him at once. He found the report was true. The old man was already breathing his last."
        - id: ch02-b02
          speaker: king
          text: "Before you die, remember your promise. Please show me a glimpse of Paradise."
        - id: ch02-b03
          speaker: fakeer
          text: "Come to my funeral. When my grave has been filled and everyone else has gone, place your hand upon it. Then I will keep my word and show you a glimpse of Paradise. But I beg you not to do it. Be content to see Paradise when God calls you there."
        - id: ch02-b04
          speaker: narrator
          text: "Even then, the king would not give up. His curiosity had grown too strong."
        - id: ch02-b05
          speaker: narrator
          text: "The fakeer died and was buried. After the funeral, the king stayed behind while everyone else went away. When he was completely alone, he stepped up to the grave and laid his hand upon it."
        - id: ch02-b06
          speaker: narrator
          text: "At once, the ground opened. The astonished king peered down and saw a rough flight of steps. At the bottom sat the fakeer, just as he had sat before, on his rickety bedstead, reading the Koran."
        - id: ch02-b07
          speaker: narrator
          text: "The king could only stare. He was both amazed and afraid. Then the fakeer beckoned him to come down. The king gathered his courage and stepped boldly into the grave."
    - id: ch03
      title: Beyond the Veil
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "The fakeer rose and motioned for the king to follow. They walked a few steps along a dark passage. Then the holy man stopped. He turned solemnly to the king and moved one hand as if he were drawing aside a heavy curtain."
        - id: ch03-b02
          speaker: narrator
          text: "What did the king see beyond it? No one knows. He never told anyone. But when the fakeer let the curtain fall again, the king had seen his glimpse of Paradise."
        - id: ch03-b03
          speaker: narrator
          text: "Every limb was trembling. The king staggered back through the passage, stumbled up the rough steps, and came out of the tomb into the fresh air."
        - id: ch03-b04
          speaker: narrator
          text: "Dawn was breaking. That seemed strange to him. He thought he had gone down only a few minutes before. He had walked a short way, looked beyond the veil for perhaps five minutes, and returned."
        - id: ch03-b05
          speaker: narrator
          text: "And what had he seen there? He searched his memory, but he could not recall a single thing."
    - id: ch04
      title: Another King
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Everything around him looked odd as well. When he entered his own city, its streets seemed changed and unfamiliar. The sun was already up by the time he passed through the palace gate and entered the public durbar hall."
        - id: ch04-b02
          speaker: narrator
          text: "The hall was full of people, and another king sat upon the throne. Bewildered, the returning king sat down and stared around him. Before long, a chamberlain crossed the hall and spoke to him."
        - id: ch04-b03
          speaker: chamberlain
          text: "Why are you sitting here without permission in the king's presence?"
        - id: ch04-b04
          speaker: king
          text: "But I am the king!"
          emotion: surprised
        - id: ch04-b05
          speaker: chamberlain
          text: "What king do you mean?"
        - id: ch04-b06
          speaker: king
          text: "I am the rightful king of this country."
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: "The chamberlain went to speak with the man on the throne. The old king caught only a few words. He heard them speaking of madness, great age, and compassion."
        - id: ch04-b08
          speaker: narrator
          text: "The king on the throne called him forward. As the old king approached, he saw his own reflection in the polished steel shield of a bodyguard. He drew back in horror."
        - id: ch04-b09
          speaker: narrator
          text: "He had become old and weak. He was dirty and dressed in rags. A long white beard and long white hair hung in tangled strands across his chest and shoulders. Only one mark of royalty remained. The signet ring was still on his right hand."
        - id: ch04-b10
          speaker: narrator
          text: "His fingers shook as he pulled off the ring and held it up."
        - id: ch04-b11
          speaker: king
          text: "Tell me who I am! Here is my signet. I sat where you are sitting only yesterday."
        - id: ch04-b12
          speaker: narrator
          text: "The king on the throne looked at the old man with pity and examined the ring with great interest. Then he gave an order. The kingdom's dusty records and archives were brought out, along with old coins from earlier reigns. They were all compared with care."
    - id: ch05
      title: Seven Hundred Years
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "At last, the king on the throne turned to the old man."
        - id: ch05-b02
          speaker: new_king
          text: "Old man, a king with this signet did once rule here. But that was seven hundred years ago. The records say he disappeared, and no one ever knew where he went. How did you come by his ring?"
        - id: ch05-b03
          speaker: narrator
          text: "The old man struck his breast and cried out in grief. Now he understood. He had refused to wait patiently until he might see the Paradise of the faithful, and his judgment had already come upon him."
        - id: ch05-b04
          speaker: narrator
          text: "Without another word, he turned and left the hall. He went into the jungle and spent twenty-five years there in prayer and meditation."
        - id: ch05-b05
          speaker: narrator
          text: "At last, the Angel of Death came to him. His punishment had cleansed and purified him, and the angel mercifully set him free."
        - id: ch05-b06
          speaker: narrator
          text: "This was a Pathan story told to Major Campbell."
