audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    king:
      display_name: 国王
      tts:
        delivery: 执着而威严，衰老后惊惶悲怆
        timbre: 浑厚成熟
        pace: 稳健
        pitch: 中低
    fakeer:
      display_name: 苦行僧
      tts:
        delivery: 克制庄重，劝诫时恳切坚定
        timbre: 苍老平和
        pace: 舒缓
        pitch: 低
    chamberlain:
      display_name: 宫廷侍从
      tts:
        delivery: 谨慎守礼，面对陌生人时带着戒备
        timbre: 清晰成熟
        pace: 适中
        pitch: 中
    new_king:
      display_name: 王座上的国王
      tts:
        delivery: 威严而仁厚，询问时审慎从容
        timbre: 深沉清晰
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 国王的请求
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，有位国王进山打猎。在一处荒僻的地方，他遇见一位苦行僧。老人披着补丁斗篷，坐在一张又小又旧的床榻上，正诵读《古兰经》。国王走过去，问他在读什么。
        - id: ch01-b02
          speaker: fakeer
          text: 我在读天堂的事，也在祈祷，希望自己有资格进入那里。
        - id: ch01-b03
          speaker: narrator
          text: 两人就这样谈了起来。过了一会儿，国王说，自己很难相信从没亲眼见过的东西，便向苦行僧提出一个请求。
        - id: ch01-b04
          speaker: king
          text: 你能不能让我亲眼看一看天堂？哪怕只看一眼也好。
        - id: ch01-b05
          speaker: fakeer
          text: 这件事极难办到，恐怕还会给你带来危险。我会替你祈祷，也许能让你如愿。可你要当心。不信天堂很危险，非要窥看天堂的好奇心也一样危险。
        - id: ch01-b06
          speaker: narrator
          text: 苦行僧一再告诫，国王却不肯改变主意。他答应从此供给老人食物，请老人继续为他祈祷。苦行僧答应了，两人便各自离去。
        - id: ch01-b07
          speaker: narrator
          text: 后来的日子里，国王一直照约定派人送去食物。他也一次次派人询问，什么时候才能看见天堂。苦行僧每回都只有同一个回答。
        - id: ch01-b08
          speaker: fakeer
          text: 还不到时候，还不到时候！
    - id: ch02
      title: 坟墓里的帷幕
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一两年过去了。一天，国王听说苦行僧病得很重，恐怕就要死了。他立刻亲自赶去，果然看见老人已经奄奄一息。国王守在病榻前，又提起那个尚未兑现的诺言。
        - id: ch02-b02
          speaker: king
          text: 请你别忘了答应过我的事。让我看一眼天堂吧。
        - id: ch02-b03
          speaker: fakeer
          text: 你来参加我的葬礼吧。等坟墓填好，所有人都走了，你把手按在我的墓上。那时，我会履行诺言，让你看一眼天堂。
        - id: ch02-b04
          speaker: narrator
          text: 可老人说完办法，又恳求国王放弃。他劝国王耐心等待，等真主召他前去时，自然会见到天堂。偏偏国王的好奇心已经烧得更旺，怎么也听不进劝。
        - id: ch02-b05
          speaker: narrator
          text: 苦行僧死后，人们把他埋葬了。国王等众人走远，独自来到墓前，把手按了上去。大地顿时裂开！国王探头一看，只见粗陋的石阶一路伸向地底。石阶尽头，苦行僧还和从前一样，坐在摇摇晃晃的床榻上诵读《古兰经》。
        - id: ch02-b06
          speaker: narrator
          text: 国王吓得只会站在那里发愣。苦行僧向他招了招手，他这才鼓足勇气，踏进坟墓。老人起身示意他跟上，带他沿昏暗的甬道走了几步，随后庄严地停下，转过身来。
        - id: ch02-b07
          speaker: narrator
          text: 苦行僧抬起手，仿佛揭开了一幅沉重的帷幕。帷幕后面是什么呢？没有人知道。国王后来也从未告诉过任何人。过了许久，老人重新放下帷幕。就在那段无人知晓的时间里，国王确实已经看过一眼天堂。
        - id: ch02-b08
          speaker: narrator
          text: 国王浑身发抖，踉跄着穿过甬道，又跌跌撞撞地爬上石阶，终于回到墓外的新鲜空气中。
    - id: ch03
      title: 七百年以后
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 天刚刚亮。国王觉得很奇怪，自己怎么在墓里待了这么久？在他看来，走下石阶、来到帷幕前，再看过那五分钟左右的奇景，前后不过片刻。可他再怎么苦想，也记不起自己究竟看见了什么。
        - id: ch03-b02
          speaker: narrator
          text: 外面的世界也说不出的古怪。他走进自己的都城，却觉得城里变了模样，到处都很陌生。等太阳升起，他穿过王宫大门，来到公开议事的大殿。殿里坐满了人，王座上竟然坐着另一个国王。
        - id: ch03-b03
          speaker: narrator
          text: 可怜的国王彻底糊涂了。他找地方坐下，茫然望着四周。不久，一名宫廷侍从走过来盘问他。
        - id: ch03-b04
          speaker: chamberlain
          text: 没有人传你进殿。你为什么擅自坐在国王面前？
        - id: ch03-b05
          speaker: king
          text: 可我就是国王！
        - id: ch03-b06
          speaker: chamberlain
          text: 你说的是哪一位国王？
        - id: ch03-b07
          speaker: king
          text: 我当然是这个国家真正的国王！
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 侍从听完，转身向王座上的国王禀报。老国王只隐约听见几句话，其中有“疯子”“年纪”和“怜悯”。王座上的国王随即叫他上前。
        - id: ch03-b09
          speaker: narrator
          text: 老国王往前走时，在一名卫士锃亮的钢盾上看见了自己。他吓得连忙后退。盾中的人又老又衰弱，浑身肮脏，衣衫破烂。白发和长长的白胡须乱作一团，散在胸前和肩头。只有右手上的御玺戒指，还能证明他曾是国王。
        - id: ch03-b10
          speaker: narrator
          text: 他颤抖着摘下戒指，把它举到王座前。
        - id: ch03-b11
          speaker: king
          text: 你告诉我，我究竟是谁！这是我的御玺。就在昨天，坐在你那个位子上的人还是我！
    - id: ch04
      title: 迟来的审判
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王座上的国王怜悯地望着老人，又仔细查看那枚戒指。他吩咐人取来积满灰尘的王国史册、档案，还有历代君王留下的古钱币。众人把这些旧物一件件认真比对，终于查出了御玺的来历。
        - id: ch04-b02
          speaker: new_king
          text: 老人家，你手上这枚御玺确实属于一位国王。可他是七百年前的人。传说那位国王忽然失踪，从此没人知道他的去向。这枚戒指，你是从哪里得到的？
        - id: ch04-b03
          speaker: narrator
          text: 老人听懂了。他猛捶胸膛，放声哀号。自己不肯耐心等待，非要提前窥看忠信者的天堂，如今竟已经受到了审判。
        - id: ch04-b04
          speaker: narrator
          text: 他没再说一句话，只是转身离开大殿，独自走进荒野。此后二十五年，他一直在那里祈祷和冥思。终于，死亡天使来到他身边，慈悲地让他得到解脱。多年惩罚已经洗清了他的罪过。
        - id: ch04-b05
          speaker: narrator
          text: 这是一则普什图人的故事，由坎贝尔少校讲述。
