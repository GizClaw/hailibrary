audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    andras:
      display_name: 安德拉斯·拜韦
      tts:
        delivery: 豪爽机敏，调侃对手时从容大胆
        timbre: 清朗坚实
        pace: 明快
        pitch: 中
    bailiff:
      display_name: 执达吏
      tts:
        delivery: 骄傲强硬，受人挑衅时容易暴怒
        timbre: 低沉有力
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 瓦德瑟的好手
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，拉普兰有一个力大无穷、跑得飞快的人。他住在瓦德瑟。每到夏日傍晚，城里人举行赛跑，谁也追不上他。大家都以这位执达吏为荣，认定全世界再找不出第二个这样的好手。
        - id: ch01-b02
          speaker: narrator
          text: 后来，山里传来了另一个人的名声。他叫安德拉斯·拜韦，也是拉普人。朋友们说，他比执达吏力气更大，脚下更快。瓦德瑟人一个字也不信。他们说，山里人爱讲这种傻话，就随他们讲去吧。
        - id: ch01-b03
          speaker: narrator
          text: 漫长的寒冬来了。村民忙着防狼，很快把安德拉斯忘在脑后。谁知一个严寒的日子，安德拉斯忽然进了瓦德瑟小城。执达吏见到他，心里别提多高兴。他总算有机会和这个外乡人较量了。
        - id: ch01-b04
          speaker: narrator
          text: 执达吏出去寻找安德拉斯，打算哄他显一显本领。走到岸边，他看见一条八桨大船，脸上立刻有了笑容。
        - id: ch01-b05
          speaker: bailiff
          text: 这个正合适。我要让他从船上跳过去。
        - id: ch01-b06
          speaker: narrator
          text: 安德拉斯马上接下挑战。两人约定，谁能越过大船，连脚后跟都不碰到船身，谁就拿走一大笔赌金。许多村民跟着他们来到海边。一位老渔夫替他们保管钱，也负责看比赛是否公平。
        - id: ch01-b07
          speaker: narrator
          text: 安德拉斯是外乡人，得先跳。他退到插在沙地上的旗子旁，那正是起跑的标记。接着，他仰起头飞奔向前，一跃便越过了大船。人群大声喝彩，他确实当得起这阵喝彩。不过，大家还是紧张地等着自家的好手上场。
        - id: ch01-b08
          speaker: narrator
          text: 执达吏一路冲向大船。他比安德拉斯高出好几英寸，身子却也重得多。这一跳同样又高又远，可他落地时，脚后跟正好擦过船沿。城里人一下子全没了声音。安德拉斯却满不在乎地笑了。
        - id: ch01-b09
          speaker: andras
          text: 还差一点，执达吏。下一回，你得拿出更大的本事才行。
        - id: ch01-b10
          speaker: narrator
          text: 这番嘲弄叫执达吏涨红了脸。
        - id: ch01-b11
          speaker: bailiff
          text: 下一回，我会给你一件更难办的事。
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: 他背过朋友们，气冲冲地回了家。安德拉斯把赢来的钱往口袋里一装，也回家去了。
    - id: ch02
      title: 海边的残骸
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二年春天，安德拉斯赶着驯鹿，来到瓦德瑟西边一座大峡湾旁。一个男孩碰见他，急忙去向执达吏报信，说仇人就在几英里外。执达吏变成斯塔洛食人魔的模样，带上儿子和狗，划船渡过峡湾。
        - id: ch02-b02
          speaker: narrator
          text: 安德拉斯正沿着沙滩慢慢走。他用跳船赢来的钱盖了一间新屋，此刻满脑子想的都是这间屋。他一直低头看路，没有发现执达吏把船藏到岩石后面，又变成一堆船只残骸，随着海浪漂来。
        - id: ch02-b03
          speaker: narrator
          text: 一块石头把安德拉斯绊醒了。他抬起头，正好望见那堆残骸。
        - id: ch02-b04
          speaker: andras
          text: 咦，这些东西也许还能派上用场。
        - id: ch02-b05
          speaker: narrator
          text: 他赶到水边，等着哪根散落的绳索漂到手边，好伸手抓住。可就在这时，一阵说不清缘由的恐惧突然攫住了他。安德拉斯转身飞逃，像是在逃命。奔跑中，身后响起了笛声，那是斯塔洛一类的食人魔才会吹的笛子。他马上想起跳船比赛后，执达吏说过的话。下一回，会有更难办的事。水里的根本不是残骸，正是执达吏本人。
    - id: ch03
      title: 追来的笛声
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 山中的夏夜，太阳从不落下，人很难睡着。安德拉斯曾用许多个不眠之夜钻研魔法，如今终于有了用处。他听见笛声，马上许愿把自己变成驯鹿的双脚，像风一样跑过好几英里。
        - id: ch03-b02
          speaker: narrator
          text: 他停下来喘气，也想看看敌人到了哪里。眼前什么都没有，笛声却越过平原传来，而且越来越近。
        - id: ch03-b03
          speaker: narrator
          text: 安德拉斯打了个寒战，又把自己变成一头小驯鹿的双脚。小驯鹿刚开始脱毛时，连走兽和飞鸟都追不上，是世上跑得最快的活物。可是，它依旧没有斯塔洛快。安德拉斯再次歇脚，身后仍有笛声。
        - id: ch03-b04
          speaker: narrator
          text: 他一时心灰意冷，只当自己必死无疑。随后，他想起附近有两座小湖，由一条很短、很宽的河相连。河心藏着一块石头，平日总没在水下，只有旱季才露出来。冬季雨水下得很足，安德拉斯断定，现在连石头尖也看不见。
        - id: ch03-b05
          speaker: narrator
          text: 一头小驯鹿向北疾驰，来到河边便奋力跃起，落在水流中央。它没有下沉，而是在那块看不见的石头上站稳了。紧接着，它又是一跃，落到了对岸。
        - id: ch03-b06
          speaker: narrator
          text: 小驯鹿跑上一座矮山，坐下来高声嘶鸣。安德拉斯故意要让斯塔洛知道，自己究竟在哪里。
    - id: ch04
      title: 河心的石头
      blocks:
        - id: ch04-b01
          speaker: bailiff
          text: 啊，原来你在这里！刚才我还真以为把你追丢了。
        - id: ch04-b02
          speaker: narrator
          text: 斯塔洛出现在对岸。这时，安德拉斯已经变回原样，故意伤心地摇了摇头。
        - id: ch04-b03
          speaker: andras
          text: 可惜你没有这么走运。
        - id: ch04-b04
          speaker: bailiff
          text: 我到底该怎么到你那边去？
        - id: ch04-b05
          speaker: narrator
          text: 斯塔洛沿着河流来回张望。
        - id: ch04-b06
          speaker: andras
          text: 像我刚才那样跳过来呀，一点也不难。
        - id: ch04-b07
          speaker: bailiff
          text: 这么宽的河，我跳不过去。我真不知道你是怎么过去的。
        - id: ch04-b08
          speaker: andras
          text: 这种话也说得出口？连最弱小的拉普男孩都能轻松跳过去，你竟然没有这个本事？
        - id: ch04-b09
          speaker: narrator
          text: 安德拉斯就是要激怒他。斯塔洛果然气红了脸，腾空一跃，直直掉进河里。他水性很好，本来不会有事。可是拉普人总随身带着弓箭，安德拉斯已经拉开了弓。
        - id: ch04-b10
          speaker: narrator
          text: 安德拉斯仔细瞄准，放出第一箭。斯塔洛高高跃出水面，箭从他两脚之间飞了过去。第二箭直奔他的前额，斯塔洛又往旁边猛地一跃。这一回，箭竟从他的拇指和食指之间穿过。
        - id: ch04-b11
          speaker: narrator
          text: 第三次，安德拉斯把箭瞄在斯塔洛头顶稍高的地方。斯塔洛早了一瞬向上跃起，这一箭正中他的肋骨之间。
        - id: ch04-b12
          speaker: narrator
          text: 伤口足以致命，斯塔洛却还没有死。他挣扎着游上岸，直挺挺躺在沙地上，慢慢开了口。
        - id: ch04-b13
          speaker: bailiff
          text: 你答应我，要把我好好安葬。等尸身入土，就坐我的船渡过峡湾，把屋里属于我的东西全拿走。杀掉我的狗，但请你饶过我的儿子，安德拉斯。
        - id: ch04-b14
          speaker: narrator
          text: 说完这些话，他便死了。
    - id: ch05
      title: 斯塔洛的财宝
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 安德拉斯坐上死者的船，渡过峡湾，找到了那个男孩和那条狗。狗的模样又凶又恶。他挥出一拳，便把它打死了。
        - id: ch05-b02
          speaker: narrator
          text: 这条狗非死不可，因为拉普兰人人都知道一个秘密。斯塔洛的狗若舔到死去主人伤口里流出的血，主人就会重新活过来。所以，真正的斯塔洛身边从来少不了一条狗。执达吏只算半个斯塔洛。他去两座小湖追赶安德拉斯时，竟把自己的狗忘在了后面。
        - id: ch05-b03
          speaker: narrator
          text: 安德拉斯又把船上的金子和珠宝全装进口袋，叫男孩坐进船里。他把小船推离岸边，任它随水漂走，自己则跑回了家。
        - id: ch05-b04
          speaker: narrator
          text: 有了这些财宝，安德拉斯买下一大群驯鹿。不久，他娶了一位富有的妻子。早先他还穷困时，女方父母根本不肯接受这个女婿。此后，安德拉斯和妻子永远幸福地生活在一起。
        - id: ch05-b05
          speaker: narrator
          text: 这个故事，录自J. C. 波斯蒂翁的《拉普兰童话》。
