audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "steady, vivid folktale storytelling"
        timbre: "warm and resonant"
        pace: "measured"
        pitch: "medium"
    andras:
      display_name: Andras Baive
      tts:
        delivery: "bold, quick-witted, and lightly teasing"
        timbre: "clear and sturdy"
        pace: "brisk"
        pitch: "medium"
    bailiff:
      display_name: Bailiff
      tts:
        delivery: "proud, forceful, and easily provoked"
        timbre: "deep and powerful"
        pace: "measured"
        pitch: "medium-low"
  chapters:
    - id: ch01
      title: The Champion of Vadso
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Long ago in Lapland, there lived a man whose strength and speed were famous throughout his hometown of Vadso. In the summer evening races, no one could come close to him. The people were proud of their champion, who was also their bailiff, and believed no man in the world could match him."
        - id: ch01-b02
          speaker: narrator
          text: "Then they began to hear stories from the mountains. A Lapp named Andras Baive lived there, and his friends claimed he was even stronger and faster than the bailiff. Nobody in Vadso believed a word of it. If such nonsense made the mountain people happy, the townsfolk said, they could go on talking."
        - id: ch01-b03
          speaker: narrator
          text: "Winter came, long and bitterly cold. The villagers had wolves to think about, and they soon forgot Andras Baive. But one frosty day, Andras himself appeared in the little town. The bailiff was delighted. Here was his chance to test the stranger's strength. He set out at once to find him and persuade him to prove what he could do."
        - id: ch01-b04
          speaker: narrator
          text: "On the shore lay a great boat with eight oars. The moment the bailiff saw it, his face lit up."
        - id: ch01-b05
          speaker: bailiff
          text: "That's just what we need. I'll have him jump over that boat."
        - id: ch01-b06
          speaker: narrator
          text: "Andras readily accepted the challenge, and the two men agreed on the wager. The winner would be the man who could leap clear across the boat without even brushing it with his heel. His prize would be a large sum of money. With a crowd of villagers following, they walked down to the sea."
        - id: ch01-b07
          speaker: narrator
          text: "An old fisherman was chosen to hold the money and make sure the contest was fair. Since Andras was the stranger, he had to go first. He stepped back to a flag planted in the sand, ran toward the boat with his head held high, and cleared it in one tremendous bound. The watchers cheered. He deserved their cheers, but they were still anxious to see what their own champion would do."
        - id: ch01-b08
          speaker: narrator
          text: "The bailiff came running. He stood several inches taller than Andras, though he was more heavily built. He sprang high and traveled far, but as he landed, his heel barely scraped the edge of the boat. The townspeople fell completely silent. Andras only laughed."
        - id: ch01-b09
          speaker: andras
          text: "A little too short, bailiff. You'll have to do better next time."
        - id: ch01-b10
          speaker: narrator
          text: "The mocking words made the bailiff's face burn red with anger."
        - id: ch01-b11
          speaker: bailiff
          text: "Next time, I'll give you something harder to do."
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: "He turned his back on his friends and went home in a sulk. Andras slipped his winnings into his pocket and went home too."
    - id: ch02
      title: The Wreckage on the Shore
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The following spring, Andras was driving his reindeer beside a great fiord west of Vadso. A boy met him there and hurried off to tell the bailiff that his enemy was only a few miles away. The bailiff disguised himself as a Stalo, one of the ogres of Lapland. Then he called his son and his dog, and the three of them rowed across the fiord to the place where the boy had seen Andras."
        - id: ch02-b02
          speaker: narrator
          text: "Andras, meanwhile, strolled lazily over the sand. He was thinking about the new hut he was building with the money from his lucky jump. His eyes stayed on the ground, so he never saw the bailiff steer his boat behind a rock. Nor did he see the bailiff change himself into a heap of wreckage and float toward shore on the waves."
        - id: ch02-b03
          speaker: narrator
          text: "Andras stumbled over a stone and looked up. There was the wreckage before him."
        - id: ch02-b04
          speaker: andras
          text: "Well, now. I might be able to use some of that."
        - id: ch02-b05
          speaker: narrator
          text: "He hurried to the water and waited for a loose rope to drift within reach. Then, for no reason he could name, fear swept over him. He turned and fled from the shore as if his life depended on it. Behind him came the sound of a pipe, the kind played only by Stalo ogres. At once he remembered the bailiff's warning after the jumping match. Next time, he had said, the task would be harder. The thing in the water had never been wreckage. It was the bailiff."
    - id: ch03
      title: The Stalo's Pipe
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Up in the mountains, summer nights were so bright that the sun never set, and sleep was hard to find. Andras had used many of those wakeful hours to study magic. Now that magic served him well. The instant he heard the Stalo's pipe, he wished himself into the feet of a reindeer. In that shape, he galloped like the wind for mile after mile."
        - id: ch03-b02
          speaker: narrator
          text: "At last he stopped to catch his breath and discover what his enemy was doing. He could see nothing. Yet the music of the pipe came floating across the plain, and while he listened, it drew steadily closer."
        - id: ch03-b03
          speaker: narrator
          text: "A cold shiver passed through Andras. This time he wished himself into the feet of a reindeer calf. When a calf first begins to shed its hair, it runs so swiftly that no bird or beast can catch it. Nothing alive is faster. Nothing, that is, except a Stalo. Andras learned that when he paused again and heard the pipe still playing behind him."
        - id: ch03-b04
          speaker: narrator
          text: "For a moment, his courage failed. He thought he was sure to die. Then he remembered two small lakes nearby. A short, very broad river joined them, and a stone lay in the middle of that river. In dry weather the stone rose above the water. But the winter rains had been heavy, so Andras knew even its top must now be hidden."
        - id: ch03-b05
          speaker: narrator
          text: "A little reindeer calf went racing north. When it reached the river, it launched itself in a great leap and came down in the middle of the stream. It did not sink. For one moment, it balanced on the unseen stone. Then it sprang again and landed on the farther bank."
        - id: ch03-b06
          speaker: narrator
          text: "The calf ran up a small hill, sat down, and neighed as loudly as it could. Andras wanted the Stalo to know exactly where he was."
    - id: ch04
      title: The Hidden Stone
      blocks:
        - id: ch04-b01
          speaker: bailiff
          text: "Ah, there you are! For a moment, I truly thought I'd lost you."
        - id: ch04-b02
          speaker: narrator
          text: "The Stalo had appeared on the opposite bank. By then, Andras had changed back into his own shape. He shook his head sadly."
        - id: ch04-b03
          speaker: andras
          text: "You won't be that lucky."
        - id: ch04-b04
          speaker: bailiff
          text: "But how am I supposed to reach you?"
        - id: ch04-b05
          speaker: narrator
          text: "The Stalo looked up and down the river."
        - id: ch04-b06
          speaker: andras
          text: "Jump across, the way I did. It's easy."
        - id: ch04-b07
          speaker: bailiff
          text: "I can't jump a river that wide. I don't understand how you managed it."
        - id: ch04-b08
          speaker: andras
          text: "I'd be ashamed to admit that. Are you saying a jump that even the weakest Lapp boy could make is too much for you?"
        - id: ch04-b09
          speaker: narrator
          text: "That was exactly the taunt Andras meant to give him. The Stalo reddened with anger, sprang into the air, and dropped straight into the river. He was a good swimmer, so the fall itself would not have harmed him. But every Lapp carried a bow and arrows, and Andras drew his."
        - id: ch04-b10
          speaker: narrator
          text: "Andras aimed carefully and loosed his first arrow. The Stalo leaped so high that it flew between his feet. Andras sent the second toward his forehead. Again the Stalo jumped, this time so far to one side that the arrow passed between his finger and thumb."
        - id: ch04-b11
          speaker: narrator
          text: "For his third shot, Andras aimed a little above the Stalo's head. The Stalo sprang upward an instant too soon, and the arrow struck him between the ribs."
        - id: ch04-b12
          speaker: narrator
          text: "The wound was mortal, but the Stalo was not dead yet. He managed to swim ashore and stretched himself out on the sand. Slowly, he spoke to Andras."
        - id: ch04-b13
          speaker: bailiff
          text: "Promise me an honorable burial. After you put my body in the grave, take my boat across the fiord and keep whatever belongs to me in my house. Kill my dog, but spare my son, Andras."
        - id: ch04-b14
          speaker: narrator
          text: "With those words, he died."
    - id: ch05
      title: The Stalo's Treasure
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "Andras sailed away in the dead man's boat and crossed the fiord. There he found the boy and the dog. The dog looked fierce and wicked. Andras killed it with a single blow of his fist."
        - id: ch05-b02
          speaker: narrator
          text: "There was a reason the dog had to die. If a Stalo's dog licked the blood from its dead master's wounds, the Stalo would return to life. That is why a true Stalo is never seen without his dog. The bailiff was only half a Stalo, and when he went after Andras at the two lakes, he had forgotten to bring the animal with him."
        - id: ch05-b03
          speaker: narrator
          text: "Next, Andras gathered all the gold and jewels he found in the boat and filled his pockets with them. He told the boy to climb aboard, pushed the boat away from shore, and left the little craft to drift wherever it would. Then Andras ran home."
        - id: ch05-b04
          speaker: narrator
          text: "With his treasure, Andras could buy a great herd of reindeer. Before long, he married a rich young woman whose parents had refused to accept him as a son-in-law when he was poor. And Andras and his wife lived happily ever after."
