audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    queen:
      display_name: 王后
      tts:
        delivery: 温柔端庄，忧伤与喜悦都真挚克制
        timbre: 成熟柔和
        pace: 适中
        pitch: 中
    crab_fairy:
      display_name: 螃蟹仙女
      tts:
        delivery: 自负多变，发怒时尖厉而有压迫感
        timbre: 清亮锐利
        pace: 适中
        pitch: 中高
    fairy_1:
      display_name: 仙女甲
      tts:
        delivery: 亲切典雅，与姐妹同声时明朗和悦
        timbre: 清澈柔美
        pace: 适中
        pitch: 中高
    fairy_2:
      display_name: 仙女乙
      tts:
        delivery: 温婉从容，与姐妹同声时柔和坚定
        timbre: 圆润明亮
        pace: 适中
        pitch: 中
    fairy_3:
      display_name: 仙女丙
      tts:
        delivery: 轻盈亲切，与姐妹同声时自然和谐
        timbre: 清脆柔和
        pace: 适中
        pitch: 中高
    tulip_fairy:
      display_name: 郁金香仙女
      tts:
        delivery: 慈爱明智，劝告时郑重，安慰时温暖
        timbre: 温润清澈
        pace: 舒缓
        pitch: 中
    prince:
      display_name: 王子
      tts:
        delivery: 热烈任性，受挫时脆弱，真情流露时恳切
        timbre: 清朗而略显虚弱
        pace: 适中偏快
        pitch: 中
    prince_king:
      display_name: 王子的父王
      tts:
        delivery: 威严审慎，爱子心切，发怒时刚硬有力
        timbre: 浑厚低沉
        pace: 稍慢
        pitch: 低
    becasigue:
      display_name: 贝卡西格
      tts:
        delivery: 忠诚机敏，进言时恭敬，私下交谈时坦率
        timbre: 清晰稳健
        pace: 适中
        pitch: 中低
    desiree:
      display_name: 德西蕾
      tts:
        delivery: 天真聪慧，受难时哀切，坚定中保有温柔
        timbre: 明亮柔美
        pace: 适中
        pitch: 中高
    eglantine:
      display_name: 埃格兰蒂娜
      tts:
        delivery: 忠诚勇敢，安慰时温柔，维护公主时坚定
        timbre: 清澈温暖
        pace: 适中
        pitch: 中
    cerisette:
      display_name: 塞里塞特
      tts:
        delivery: 虚伪做作，得意时尖刻，受质问时夸张
        timbre: 偏薄清亮
        pace: 适中偏快
        pitch: 中高
    chief_steward:
      display_name: 宫廷大总管
      tts:
        delivery: 谨慎圆滑，措辞恭敬而有所保留
        timbre: 成熟清晰
        pace: 稍慢
        pitch: 中低
    royal_steward:
      display_name: 御前总管
      tts:
        delivery: 守礼克制，应答简洁恭谨
        timbre: 平稳清楚
        pace: 适中
        pitch: 中
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 朴实慈祥，待客热诚而沉着
        timbre: 苍老温暖
        pace: 稍慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 仙宫与诅咒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位国王和一位王后。他们夫妻恩爱，日子本来已经很好，只盼能有一个小王子或小公主陪在身边，那就再圆满不过了。两人从来不把这桩心愿说出口，总装作世上没有别的可盼望。可每当看见别人的孩子，他们脸上总会露出愁容，朝臣和侍从全都明白其中的缘故。
        - id: ch01-b02
          speaker: narrator
          text: 一天，王后独自坐在一道瀑布旁。瀑布从岩石间涌出，落进城堡旁边的大花园。那天她格外伤心，早早遣走随身的女官，不愿让人看见自己的痛苦。忽然，瀑布下面的水潭里传来窸窣声。她抬眼一看，一只大螃蟹正爬上岩石，来到她面前。
        - id: ch01-b03
          speaker: crab_fairy
          text: 尊贵的王后，您的心愿很快就会实现。在那以前，请让我带您去仙女的宫殿。它就在附近，却藏在浓云后面，从没有凡人见过。只要您信任我，到了那里就会知道更多。
        - id: ch01-b04
          speaker: narrator
          text: 王后第一次听见动物开口，惊得说不出话。可这个消息又让她满心欢喜。她微笑着伸出手，握住她的却不再是螃蟹，而是一位打扮俏丽的小老太太。她穿着白色和深红色的衣裳，灰发间系着绿丝带，身上连一滴水也没有。
        - id: ch01-b05
          speaker: narrator
          text: 老太太轻快地跑上一条小路，王后紧紧跟着。王后过去走过这里不下百次，此刻却完全认不出来。她们不必再拨开荨麻和荆棘，玫瑰与茉莉从头顶垂落，脚下的紫罗兰散发着芬芳。橙树长得又高又密，就算到了正午，阳光也不灼热。路尽头有东西闪闪发亮，耀眼得让王后不得不抬手遮住眼睛，从指缝里偷偷看。
        - id: ch01-b06
          speaker: queen
          text: 那是什么？
        - id: ch01-b07
          speaker: crab_fairy
          text: 那就是仙女们的宫殿。您看，已经有人出来迎接我们了。
        - id: ch01-b08
          speaker: narrator
          text: 大门立刻敞开，六位仙女迎面走来。她们各自捧着一朵宝石花，那花逼真得非要亲手摸过才能分辨。
        - id: ch01-b09
          speakers: [fairy_1, fairy_2, fairy_3]
          ensemble: chorus
          text: 夫人，您这样信任我们，我们实在感激。我们带来一个好消息，您很快就会有一个小女儿。
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: 王后欢喜得险些晕倒。她好不容易开口，把心里的感激全说了出来，谢仙女们送她这份礼物。
        - id: ch01-b11
          speaker: queen
          text: 我不能再耽搁啦。不然我的丈夫一定会以为，我不是逃走了，就是被野兽吃掉了。
        - id: ch01-b12
          speaker: narrator
          text: 不久，宫中果然生下一个女婴。国王和王后给她取名德西蕾，意思是盼望得来的，因为他们足足等了五年。
        - id: ch01-b13
          speaker: narrator
          text: 王后起初满心只有这个新得来的小宝贝，过了好一阵，才想起那些送来孩子的仙女。她吩咐女官取来仙宫赠送的那束宝石花，自己一朵一朵拿在手里，逐个叫出仙女的名字。每叫一个名字，就有一位仙女现身。可惜，王后偏偏漏掉了最不该忘的那位。恩情最大的螃蟹仙女，没有得到邀请。这一次疏忽，很快惹来了无穷的祸患。
        - id: ch01-b14
          speaker: narrator
          text: 宫里眼下仍旧喜气洋洋。人人都跑到窗前，争着看仙女的车驾，因为没有两辆相同。一位仙女坐在乌木车里，由白鸽牵引。另一位斜倚在象牙车中，驾车的是十只乌鸦。其余车子有的用珍稀木材制成，有的用五彩贝壳制成。拉车的鸟也各不相同，有红蓝相间的金刚鹦鹉、拖着长尾的孔雀，还有绿色牡丹鹦鹉。只有隆重场合才用这些美丽的鸟。若是仙女出征，拉车的就会换成飞龙、火蛇、狮子或豹子。
        - id: ch01-b15
          speaker: narrator
          text: 仙女们走进王后的寝宫，身后跟着一群捧礼物的小矮人。小矮人个个神气十足，看上去简直比自己的女主人还骄傲。他们把礼物一件接一件铺在地上，那些东西可爱得世上从未有人见过。婴儿能穿的、能玩的，应有尽有。除此以外，仙女们还要赐给孩子更加珍贵的天赋。只有认仙女作教母的孩子，才有福得到这样的礼物。
        - id: ch01-b16
          speaker: narrator
          text: 大家围着粉红软垫上熟睡的婴儿。忽然，阴影遮住日光，冷风刮过房间。螃蟹仙女出现了，怒火让她一直长到天花板。
        - id: ch01-b17
          speaker: crab_fairy
          text: 你们竟然忘了我！你伤心时是谁安慰你？是谁带你去仙宫，又平安送你回来？偏偏是我被漏掉了！她们做的哪一件比得上我，却得到了全部宠爱和感谢！
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 王后吓得几乎说不出话，浑身不停发抖。她苦苦思索，却找不到半句能解释或辩白的话，只好承认是自己错了，一再恳求宽恕。其余仙女也竭力平息姐妹的怒火。她们知道，这位仙女和许多相貌平常的凡人一样，很爱听人赞美，于是不断夸奖她，请她脱下难看的螃蟹外壳，重新变回大家熟悉的迷人女子。她起初怎么也不肯听，过了许久，奉承终于有了作用。蟹壳从身上脱落，她缩回原来的身量，脸色也不再那么凶恶。
        - id: ch01-b19
          speaker: crab_fairy
          text: 好吧，我原想取走公主的性命，现在可以饶她不死。不过，她仍要替母亲受罚。在她十五岁生日以前，哪怕只有一线日光照到她，她也一定会后悔，甚至可能送命。
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: 她说完，便从来时的窗户飞走了。其余仙女一边安慰哭泣的王后，一边商议怎样才能让公主平安长大。半个钟头后，她们终于有了主意。仙女一声令下，一座美丽的宫殿拔地而起，紧挨着国王和王后的宫殿。它和世上一切宫殿都不一样，没有一扇窗，唯一的门深藏在地下。不过走进去以后，一点也不觉得缺少日光，因为墙上燃着无数蜡烛，到处一片通明。
    - id: ch02
      title: 画像与婚约
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 就这样，将近十五年过去了。仙女们照料德西蕾，陪她玩耍，教她各种本领。等她走进人世以后，凡是能让一位公主显得迷人而有教养的才艺，她都不会输给别的国王的女儿。仙女们全都爱她，郁金香仙女尤其疼爱她。十五岁生日一天天接近，郁金香仙女也越来越不安，总怕会发生某种意想不到的可怕意外。
        - id: ch02-b02
          speaker: tulip_fairy
          text: 一刻也别让她离开您的视线。再请人给她画像，送到邻国的宫廷去。这是惯例，也能让那些国王亲眼看看她的美貌，好替儿子来求婚。
        - id: ch02-b03
          speaker: narrator
          text: 画像送出去以后，年轻王子们纷纷倾心。最后看到它的那位王子尤其着迷。他不许别人把画像拿走，整天站在那里凝望。父王发现儿子不再狩猎放鹰，又听见朝臣担心他发疯，立刻赶去探望。王子一见父亲，就扑倒在他脚下。
        - id: ch02-b04
          speaker: prince
          text: 您替我订下的那位未婚妻，我永远不会爱！请您解除婚约，替我向德西蕾公主求婚。要是您不肯，我会忧郁而死，死了反倒轻松！
          emotion: sad
        - id: ch02-b05
          speaker: narrator
          text: 父王听见这番话，非常不悦。他很清楚，一旦毁掉早已定下的婚约，几乎一定会给自己的臣民招来一场漫长而血腥的战争。因此，他没有回答儿子，转身离开了房间，只盼王子过几天就能恢复理智。谁知王子的病情非但没有好转，反而一天比一天严重。父王终于走投无路，只得答应立刻派使团去见德西蕾的父亲，替儿子请求这门婚事。
        - id: ch02-b06
          speaker: narrator
          text: 这个消息一下治好了王子所有的病痛。他亲自安排使团的衣饰、马匹和车驾，每一样细节都不肯放过，只求让贝卡西格带出一支尽可能华丽的队伍。他恨不得把自己扮成侍童偷偷同行，父王却坚决不准。王子只好搜遍全国，把所有珍奇美丽的东西找来送给公主。使团就要出发时，他又匆匆赶来，送上一幅自己的肖像。那是他吩咐宫廷画师暗中画成的。
        - id: ch02-b07
          speaker: narrator
          text: 德西蕾的父母热烈迎接使臣，很愿意接受这门婚事。他们原本肯让贝卡西格见公主，却被郁金香仙女拦下。
        - id: ch02-b08
          speaker: tulip_fairy
          text: 还要清楚告诉他，婚礼只能等公主满十五岁以后再办。否则，这孩子会遭遇可怕的不幸。
        - id: ch02-b09
          speaker: narrator
          text: 贝卡西格在随员簇拥下正式求婚。国王说，这门婚事让他深感荣幸，他很愿意答应。不过，公主十五岁以前，任何人都不能见她。她还在襁褓中时，一位恶毒仙女就施下诅咒，要过了那一天才会失效。贝卡西格既惊讶又失望，可他知道仙女有多厉害，不敢违逆，只好把王子的画像献给王后。王后马上送去给女儿。德西蕾双手接住画像，画中人忽然开口，用极其动人的话赞美她。原来这幅画像早已学会说话。公主听得满脸通红。
        - id: ch02-b10
          speaker: queen
          text: 你愿意让这样的人做你的丈夫吗？
        - id: ch02-b11
          speaker: desiree
          text: 我哪知道丈夫该是什么样呀！
        - id: ch02-b12
          speaker: queen
          text: 那么再过三个月，他就是你的丈夫了。
        - id: ch02-b13
          speaker: narrator
          text: 王后命人送来王子的礼物。德西蕾件件都喜欢，可她的目光总从柔软的绸缎和灿烂的珠宝上移开，重新落回画像。
        - id: ch02-b14
          speaker: narrator
          text: 贝卡西格见不到公主，只能告辞回国。王子听说德西蕾果真会嫁给自己，当然欣喜若狂。可公主没有像他愚蠢地期盼的那样跟着使臣回来，他又失望透顶。从小没人教他克制愿望和情绪，他便像先前一样病倒了。他什么也不肯吃，对什么都提不起兴趣，只终日躺在一堆软垫上，望着公主的画像。
        - id: ch02-b15
          speaker: prince
          text: 还要等三个月才能娶她，我一定活不下去！
          emotion: sad
        - id: ch02-b16
          speaker: narrator
          text: 父王彻底绝望，只得再次派出贝卡西格，请求立刻举行婚礼。他在信中说，自己年老体弱，不能亲自前来，但对方提出任何安排，使臣都能代他答应。
        - id: ch02-b17
          speaker: narrator
          text: 贝卡西格抵达宫殿以后，替年轻的主人苦苦求情。他说得那样恳切，简直像王子的父亲亲自到了这里。他一再请求，希望公主本人也能参与商议。王后听后，急忙赶往大理石塔，把王子的悲惨情形全告诉女儿。德西蕾听完，当场昏倒在地。好在她很快醒来，随即努力想起办法。她既想去到王子身边，又不能让恶仙女判下的厄运落到自己头上。
        - id: ch02-b18
          speaker: desiree
          text: 我想到了！造一辆完全不透光的马车，直接抬进我的房间。我坐进去，连夜赶路，黎明以前就能到王子的宫殿。到了那里，我再住进没有日光的地下房间。
          emotion: happy
        - id: ch02-b19
          speaker: queen
          text: 啊，你真聪明！
          emotion: happy
        - id: ch02-b20
          speaker: narrator
          text: 王后紧紧抱住女儿，马上去告诉国王。贝卡西格也深深鞠了一躬。
        - id: ch02-b21
          speaker: becasigue
          text: 我们的王子会娶到一位多么出色的妻子！我得立刻回去报喜，也好替公主准备地下寝宫。
    - id: ch03
      title: 马车里的阴谋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 几天后，密闭马车造好了。车外蒙着绿天鹅绒，缀满金色大蓟花。车内是绣着粉红玫瑰的银锦缎，没有一扇窗。郁金香仙女还让车厢泛出柔光，谁也不知道光从哪里来。
        - id: ch03-b02
          speaker: narrator
          text: 马车被抬进塔楼大厅。德西蕾、忠心的女傧相埃格兰蒂娜和女侍塞里塞特依次上车，最后一个位置属于塞里塞特的母亲。塞里塞特也爱上了画像中的王子，对公主嫉妒得要命。
        - id: ch03-b03
          speaker: narrator
          text: 王子原本和内拉公主订有婚约。内拉的教母泉水仙女因为这场变心怒不可遏，一直监视着德西蕾。现在机会来了。她隐去身形，坐到塞里塞特身旁，不断把恶念送进这对母女心里。
        - id: ch03-b04
          speaker: narrator
          text: 前往王子都城的道路，大多穿过茂密的森林。车厢里不能透进日光，可里面的人也需要呼吸。所以，每到没有月亮、树梢之间连一颗星星都看不见的夜晚，护送公主的卫兵才会打开车厢，让她们透透气。这样走了好几天，离王子的宫殿只剩十二个小时路程。塞里塞特终于说动母亲，取出特意带来的锋利小刀，在车壁上一点点割开一个大洞。周围的森林黑得伸手不见五指，谁也没有发觉她们做了什么。
        - id: ch03-b05
          speaker: narrator
          text: 马车驶出最后一片树林，来到空旷的原野，太阳已经升起。德西蕾自从还在襁褓中，就再也没有见过日光。如今她惊讶地抬起头，望着从破洞里倾泻进来的耀眼光辉，发出一声仿佛从心底涌出的叹息。车门像中了魔法一样猛然弹开，一头白鹿从车里跃出去，转眼就消失在树林里。她的动作虽然飞快，埃格兰蒂娜还是看清了她逃走的方向。忠心的女傧相立刻跳下马车追赶，卫兵们只能远远跟在后面。
        - id: ch03-b06
          speaker: narrator
          text: 塞里塞特和母亲惊喜地对望，简直不敢相信自己会有这样的好运。事情分毫不差，全照着她们的心愿发生了。眼下第一件事，是把车壁上的破洞遮起来。她们设法动手修补，愤怒的泉水仙女又在暗中帮忙，母女俩却毫不知情。洞口遮好以后，塞里塞特马上脱掉自己的衣裳，换上公主的华丽裙子，又把钻石王冠戴在头顶。那顶王冠比她预想的沉重得多，她过去从来没有戴惯这样的东西。
        - id: ch03-b07
          speaker: narrator
          text: 马车抵达都城，人群在街道两旁欢呼。它最后停进贝卡西格准备的地下大厅。宫廷大总管和御前总管向假新娘行礼，说马上就去禀报王子。王子受礼法约束，不能到地下迎接，此刻正在寝宫里急得发狂。
        - id: ch03-b08
          speaker: prince
          text: 她真的到了！怎么样，我没有说错吧？她是不是美貌又优雅，世上根本没人能同她相比？
          emotion: happy
        - id: ch03-b09
          speaker: narrator
          text: 两位大臣互相看了一眼，谁也不肯回答。最后，大总管鼓起勇气开口。
        - id: ch03-b10
          speaker: chief_steward
          text: 殿下，她究竟有多美，还是请您亲自判断吧。想来一定像您说的那样，只是长途奔波，眼下多少损伤了她的容貌。
        - id: ch03-b11
          speaker: narrator
          text: 王子最不想听见的就是这种话。难道画像把她画美了？他听说过这样的事，一阵寒意顿时掠过全身，却强忍着没有追问。
        - id: ch03-b12
          speaker: prince
          text: 国王知道公主进宫了吗？
        - id: ch03-b13
          speaker: royal_steward
          text: 知道了，殿下。他现在大概已经去见公主了。
        - id: ch03-b14
          speaker: prince
          text: 那我也去。
        - id: ch03-b15
          speaker: narrator
          text: 王子久病体弱，由两位大臣扶着下楼。他才进大厅，就听见父王看到塞里塞特后，震惊又厌恶地叫了起来。
        - id: ch03-b16
          speaker: prince_king
          text: 这里面一定有阴谋！
          emotion: angry
        - id: ch03-b17
          speaker: narrator
          text: 王子惊得靠住门柱。塞里塞特的母亲早料到会有这一幕，只当没听见，捧着德西蕾父母的书信走上前。
        - id: ch03-b18
          speaker: cerisette
          text: 这位就是德西蕾公主。我奉两位君主之命，呈上他们的信，还有装着公主珠宝的匣子。
        - id: ch03-b19
          speaker: narrator
          text: 国王一动不动，也不作回答。王子扶着贝卡西格的手臂，向假公主走近几步。他还在绝望地盼望，也许只是自己的眼睛出了错。可是看得越清楚，他越赞同父王，这里面一定藏着背叛，因为眼前的女人没有一点像画像。塞里塞特高得出奇，公主的裙子连她的脚踝也遮不住。她又瘦得皮包骨头，隔着衣料都看得清每一处骨节。她还生着一只鹰钩鼻，满口牙齿又黑又难看。
        - id: ch03-b20
          speaker: prince
          text: 父王，我们受骗了。这会要了我的命。
          emotion: sad
        - id: ch03-b21
          speaker: narrator
          text: 王子瘫在贝卡西格身上，使臣赶紧把他平放在地。众人忙着救他。等他刚一醒来，女侍便放声哭喊。
        - id: ch03-b22
          speaker: cerisette
          text: 我美丽的公主啊，我们为什么要离开故乡？父王要是知道您受了这种侮辱，一定会替您报仇！
        - id: ch03-b23
          speaker: prince_king
          text: 我会亲自告诉他！他答应送来绝世美人，来的却是一副骷髅。难怪十五年里，他一直把她藏着不让人看。卫兵，把这两个女人关进国家监狱！这里还有内情，我一定要查清楚。
          emotion: angry
        - id: ch03-b24
          speaker: narrator
          text: 卫兵立刻带走了母女俩。王子一路为自己的悲惨命运大声哀号，被人送回床上，此后高烧了许多天。体力虽然慢慢恢复，他的悲伤却没有减轻。他再也不能忍受陌生人的面孔，只要一想到必须照规矩参加宫廷仪式，就会浑身发抖。于是，他打定主意，等身体能够支持，就悄悄离开宫廷，到某个荒无人烟的地方独自度过余生。除了父王和贝卡西格，他没有把这个计划告诉任何人。
        - id: ch03-b25
          speaker: narrator
          text: 几个星期以后，王子终于恢复到足以实行计划。一个星光灿烂的美丽夜晚，他和贝卡西格悄悄离开了宫廷。第二天早晨，父王在儿子的床边发现一封信。信上说，王子已经走了，连他自己也不知道会去往什么地方。父王深爱儿子，读完以后泪流不止。可他又觉得，年轻人离开宫廷也许是个明智的选择，只盼时间能慢慢治好他的痛苦，也盼贝卡西格一路劝导，终有一天把这位游子带回家。
    - id: ch04
      title: 白鹿与忠实的朋友
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 再说那头逃进树林的白鹿。她知道恶意的命运把自己变成了动物，却不知道变成了什么，直到她在溪水里看见倒影。
        - id: ch04-b02
          speaker: desiree
          text: 水里的真是我吗，德西蕾？是哪位恶毒仙女这样害我？难道我再也变不回去了？森林里到处都是狮子和毒蛇。想到自己活不了多久，竟是我唯一的安慰。
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: 郁金香仙女得知消息，心里的悲伤一点不比王后少。不过，她也忍不住想到，当初国王和王后要是肯听自己的劝，德西蕾这时早已平安住进新家。可仙女实在太疼爱公主，不忍让她再受那些原本可以避免的痛苦。于是，她亲自引导埃格兰蒂娜来到白鹿身边。那时白鹿正低着头，把青草当作自己的晚餐。
        - id: ch04-b04
          speaker: narrator
          text: 白鹿听见脚步声，抬起了头。一看见忠实的朋友，她就纵身迎上去，把头贴在埃格兰蒂娜的肩膀上轻轻摩挲。女傧相十分惊讶，可她一向喜欢动物，便温柔地抚摸白鹿，不住低声哄她。忽然，这只美丽的小兽仰起头，久久凝望着姑娘的脸，泪水从眼睛里一颗颗滚落。一个念头闪过埃格兰蒂娜心中。她立刻跪下，捧起白鹿的蹄子，一只接一只地亲吻。
        - id: ch04-b05
          speaker: eglantine
          text: 我的公主！啊，我亲爱的公主！
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: 白鹿又用头蹭她。恶仙女夺走了公主说话的能力，却没有夺走她的理智。她们就这样相伴了一整天。埃格兰蒂娜饿了，白鹿便领着她走进树林深处，找到一个梨子和桃子遍地生长的地方，让朋友填饱肚子。可是夜色渐渐降临以后，女傧相忽然想起，公主独自在林中过第一夜时，一直害怕会遇上凶猛的野兽。如今，她自己也要和白鹿留在这里。这个念头让埃格兰蒂娜吓得魂不附体。
        - id: ch04-b07
          speaker: eglantine
          text: 这里难道没有小屋或山洞，让我们躲一躲吗？
          emotion: fearful
        - id: ch04-b08
          speaker: narrator
          text: 白鹿只能摇头。她们坐在地上，一起害怕地哭了。郁金香仙女虽然还在生气，心肠却很柔软。她见两人这样痛苦，立刻飞来相助。
        - id: ch04-b09
          speaker: tulip_fairy
          text: 泉水仙女的法力比我强，我没法完全解除魔咒。不过，我能缩短期限，也能让你少受些苦。从现在起，只要黑夜降临，你就会恢复人形。
        - id: ch04-b10
          speaker: narrator
          text: 想到当天夜里就能暂时摆脱鹿身，德西蕾已经心满意足，在草地上轻快地蹦跳。
        - id: ch04-b11
          speaker: tulip_fairy
          text: 沿着眼前的小路一直走，很快就会看见一间能栖身的小屋。
        - id: ch04-b12
          speaker: narrator
          text: 仙女微笑着消失了。两个人心里的欢喜，远远超过了刚才敢想的程度。她们来到小屋前，看见一位老妇人站在门口。
        - id: ch04-b13
          speaker: eglantine
          text: 晚上好！我和我的白鹿能在这里借住一夜吗？
        - id: ch04-b14
          speaker: old_woman
          text: 当然可以。
        - id: ch04-b15
          speaker: narrator
          text: 老妇人领她们进了一个房间。里面有两张洁白舒适的小床，看一眼就让人犯困。房门刚刚关上，太阳便落到地平线下，德西蕾重新变成少女。
        - id: ch04-b16
          speaker: desiree
          text: 埃格兰蒂娜！要不是你追来，我真不知道该怎么办！
          emotion: happy
        - id: ch04-b17
          speaker: narrator
          text: 她欣喜若狂地扑进朋友怀里。第二天清晨，埃格兰蒂娜被抓门声惊醒。门外的白鹿急着出去。姑娘拉开门闩，白鹿向她点点头，便跃入树林，转眼不见了。
        - id: ch04-b18
          speaker: narrator
          text: 这时，王子和贝卡西格也在森林里漫游。王子累得走不动，躺在一棵树下，请朋友去找食物和过夜的地方。贝卡西格转过小路，正遇见老妇人在屋前喂鸽子。
        - id: ch04-b19
          speaker: becasigue
          text: 您能给我一些牛奶和水果吗？我饿极了，后面还有一位大病初愈的朋友，他的身体仍很虚弱。
        - id: ch04-b20
          speaker: old_woman
          text: 当然。你先去厨房坐坐，我去牵山羊来挤奶。
        - id: ch04-b21
          speaker: narrator
          text: 没过多久，老妇人提来一篮满得快溢出的橙子和葡萄。
        - id: ch04-b22
          speaker: old_woman
          text: 你的朋友病才好，不该睡在森林里。我这里还有地方，虽然很小，也总比没有好。你们尽管住下，我真心欢迎。
        - id: ch04-b23
          speaker: narrator
          text: 贝卡西格听了非常高兴，热诚地向老妇人道谢。此时太阳快要落山，他便动身回去接王子。就在他离开小屋的这段时间里，埃格兰蒂娜和白鹿也走了进来。老妇人把她们安顿在一间屋里，又把王子和朋友安顿在紧邻的房间。两位姑娘自然完全不知道，那个因为孩子气的急躁而引出这场灾难的男人，离她们只有一墙之隔。
    - id: ch05
      title: 林中的三次相遇
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 王子明明已经筋疲力尽，夜里却睡得很差。天刚亮，他就起了床，让贝卡西格留在屋里，说自己想独处一会儿。随后，他漫步走进森林，走到哪里算哪里。不知不觉间，他来到一片宽阔的空地，白鹿正在空地中央安静地吃早餐。她一看见有人，立刻纵身逃跑。王子几乎没有思索，下意识地取下弓，接连射出几支箭。幸好郁金香仙女一直在暗中照看，没有一支箭伤到她。
        - id: ch05-b02
          speaker: narrator
          text: 白鹿虽然跑得很快，体力却很快支撑不住。她在高塔里生活了十五年，从来没有机会舒展四肢，学习怎样长久奔跑。幸好王子的身体也十分虚弱，没法追出太远。白鹿转过一条小路，绕到小屋附近。埃格兰蒂娜正在那里焦急地等她。她气喘吁吁地冲进房间，立刻瘫倒在地板上，再也跑不动了。
        - id: ch05-b03
          speaker: narrator
          text: 夜幕降临，德西蕾恢复人形，把白天的遭遇告诉朋友。
        - id: ch05-b04
          speaker: desiree
          text: 我一直怕泉水仙女，也怕森林里的猛兽，却从没想到人也会伤害我。直到现在，我都不知道是谁救了我。
          emotion: fearful
        - id: ch05-b05
          speaker: eglantine
          text: 在惩罚结束以前，你一定要安安静静留在这里。
        - id: ch05-b06
          speaker: narrator
          text: 可第二天破晓，德西蕾又变成白鹿。森林的召唤压过了劝告，她再次飞奔出去。王子急忙赶到昨天的空地，白鹿却去了相反的方向。他找遍一条条绿荫小径，最后累得倒地睡着。
        - id: ch05-b07
          speaker: narrator
          text: 就在这时，白鹿恰好从附近的灌木丛中跃出来。她看见敌人躺在地上，吓得浑身发抖，猛然停住了脚步。可是，她没有转身逃跑。心里反倒有个声音不停催促她，悄悄走近一点，好好看一看这个人。白鹿凝神端详，整个身子不禁一震。尽管疾病已经把这个人折磨得憔悴消瘦，她还是认了出来。这分明就是画像上的王子，也是她命中注定的丈夫。她轻轻俯下身，在他的额头上吻了一下。
        - id: ch05-b08
          speaker: narrator
          text: 王子被吻醒，两人彼此凝望。王子认出这是昨天逃走的白鹿。白鹿忽然意识到危险，拼命往森林深处跑。王子紧追在后，却不再想杀她，甚至不愿伤她分毫。
        - id: ch05-b09
          speaker: prince
          text: 漂亮的小鹿，停下来！我不会伤害你！
        - id: ch05-b10
          speaker: narrator
          text: 可惜风把他的喊声全都卷走了。白鹿终于再也跑不动，只能伸展四肢躺在草地上，等着致命的一击落下来。王子追到以后，却没有伤她。他跪在白鹿身边，轻轻抚摸她，叫她不要害怕，还说自己会好好照料她。他先用角制的猎杯从溪里取来一点水，送到她嘴边。接着，他砍下几根树枝，动手编成一副担架，又在上面铺满柔软的青苔，这才把白鹿轻轻放上去。
        - id: ch05-b11
          speaker: narrator
          text: 他们待了很久。德西蕾从阳光照在树上的角度看出，太阳快要落山了。她害怕王子在这里看见自己恢复人形。
        - id: ch05-b12
          speaker: desiree
          text: 不行。他第一次见到真正的我，绝不能是在这里。
        - id: ch05-b13
          speaker: narrator
          text: 她张开嘴，垂下舌头，装作渴得快死了。王子果然赶去溪边取水。等他回来，白鹿已经逃走。
        - id: ch05-b14
          speaker: narrator
          text: 那天夜里，德西蕾告诉埃格兰蒂娜，追她的人就是王子。他本人比画像还要英俊。
        - id: ch05-b15
          speaker: desiree
          text: 我们明明彼此相爱，我却只能用这副模样见他。还有比这更残酷的事吗？
          emotion: sad
        - id: ch05-b16
          speaker: narrator
          text: 埃格兰蒂娜安慰她，说苦难很快就会过去。另一边，王子为白鹿逃走十分恼火。他回到小屋，把整段经历和怒气都告诉贝卡西格，惹得使臣笑了起来。
        - id: ch05-b17
          speaker: prince
          text: 她别想再逃！就算每天都去追，整整追上一年，我也一定要得到她。
          emotion: angry
        - id: ch05-b18
          speaker: narrator
          text: 第三天早晨，白鹿走进森林，心里仍旧拿不定主意。她不知道该去见王子，还是躲开他，藏进一片他永远找不到的密林深处。最后，她认定躲藏才是最好的办法。这个主意原本的确不错，只可惜王子也正在寻找她，偏偏走上了同一个方向。他偶然看见灌木间闪过雪白的皮毛。就在同一刻，白鹿听见一根细枝在他脚下折断。她一跃而起，转身飞逃。王子想不出别的办法可以捉住她，只好朝她的腿射出一箭，把她射倒在地。
        - id: ch05-b19
          speaker: narrator
          text: 年轻人急忙奔到白鹿身边，看到她倒在那里，觉得自己简直成了一个杀人凶手。他竭力安抚她的痛苦，却不知道这一箭正是泉水仙女所降惩罚的最后一部分。王子先从附近取来一些水，让白鹿喝下。接着，他又在林间找来几味能够疗伤的草药，放在掌心仔细揉碎，再轻轻敷到她腿上的伤口。
        - id: ch05-b20
          speaker: prince
          text: 我竟然伤了你，我真是个恶人！你现在一定恨我，以后再也不会让我找到你了！
          emotion: sad
        - id: ch05-b21
          speaker: narrator
          text: 白鹿安静地躺了一会儿，又像上次那样，忽然想起变身的时刻已经临近。她挣扎着站起来，王子却不肯让她带伤走路。他心想，小屋里的老妇人也许更会包扎伤口，便把白鹿抱在怀中，准备带回去。白鹿身子明明很小，却故意让自己变得重得惊人。王子抱着她踉踉跄跄走了几步，实在支持不住，只好将她放下。他解下帽子上的几根丝带，把她牢牢绑在树上，然后离开去找人帮忙。
        - id: ch05-b22
          speaker: narrator
          text: 埃格兰蒂娜等了很久，仍不见女主人回来，早已焦急万分，只好亲自出门寻找。王子刚刚走远，几根飘动的丝带就在她眼前闪了一下。她顺着丝带看去，立刻发现美丽的公主被牢牢绑在树上。埃格兰蒂娜赶紧上前，用尽全身力气去解那些绳结。每个结看起来都十分简单，可她越是着急，越是一个也解不开。她还在忙乱，身后忽然响起一个男人的声音。
        - id: ch05-b23
          speaker: prince
          text: 请原谅，美丽的姑娘，可你正在偷走我的白鹿！
        - id: ch05-b24
          speaker: eglantine
          text: 也请您原谅，尊贵的骑士。被绑住的分明是我的白鹿。要证据并不难，看她认不认得我。小宝贝，把蹄子放在我心口上。
        - id: ch05-b25
          speaker: narrator
          text: 埃格兰蒂娜跪下来，白鹿把一只前蹄放在她胸前。
        - id: ch05-b26
          speaker: eglantine
          text: 现在搂住我的脖子，再叹一口气。
        - id: ch05-b27
          speaker: narrator
          text: 白鹿又照着做了。
        - id: ch05-b28
          speaker: prince
          text: 你说得对，我只能把她还给你，虽然实在舍不得。我伤了她，却也已经深深爱上她。
        - id: ch05-b29
          speaker: narrator
          text: 埃格兰蒂娜没有回答。她小心扶起白鹿，领着她慢慢回到小屋。
    - id: ch06
      title: 真相与婚礼
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 王子和贝卡西格一直不知道，屋里还有别的客人。他们远远跟着，看见埃格兰蒂娜把白鹿带进小屋，惊讶极了，立刻去盘问老妇人。老妇人说，她不认识那个姑娘和白鹿，只知道她们住在隔壁，平日安静，付钱也很大方，说完便回厨房去了。
        - id: ch06-b02
          speaker: becasigue
          text: 我敢肯定，刚才那位姑娘就是德西蕾公主的女傧相埃格兰蒂娜。我在宫里见过她。既然她住在隔壁，只要在木板上凿个小孔，就能看清我猜得对不对。
        - id: ch06-b03
          speaker: narrator
          text: 贝卡西格从口袋里取出小刀，一下一下锯起木板。隔壁的姑娘们听见刮擦声，还以为只是老鼠，没有放在心上。于是他安安稳稳地继续动手。小孔终于大到可以窥视，他把眼睛凑过去，眼前的景象让他惊得目瞪口呆。自己的猜测果然没错，那个高挑的姑娘就是埃格兰蒂娜。可是另一个女子，他究竟在哪里见过？贝卡西格看了又看，终于想起来了，她正是画像上的人。
        - id: ch06-b04
          speaker: narrator
          text: 德西蕾穿着飘逸的绿绸长裙，斜靠在软垫上。埃格兰蒂娜正俯身替她清洗腿上的伤口。
        - id: ch06-b05
          speaker: desiree
          text: 让我死去吧，我不愿再这样活下去。你不知道，白天变成野兽有多痛苦。我没法同深爱的人说话，这场残酷的命运又是他的急躁引来的。可即便这样，我还是恨不了他。
          emotion: sad
        - id: ch06-b06
          speaker: narrator
          text: 她声音很低，贝卡西格却听得一清二楚，简直不敢相信。他沉默了一会儿，走到窗边，把正在向外看的王子领到小孔前。王子只看一眼，就认出真正的德西蕾。另一个女人为什么冒用她的名字，他此刻既不知道，也毫不在意。
        - id: ch06-b07
          speaker: narrator
          text: 王子踮着脚，悄悄走出自己的房间，来到隔壁门前，轻轻敲响了门。埃格兰蒂娜以为是老妇人来送晚饭，没有多想便打开门。她一看见王子，猛地向后退去。这一次，她也认出了面前的人。可是王子根本顾不上解释。他从埃格兰蒂娜身旁挤过去，径直来到德西蕾面前，扑倒在公主脚下，把这些日子压在心里的全部深情都倾诉了出来。
        - id: ch06-b08
          speaker: narrator
          text: 他们说了很久很久。黎明到来的时候，两个人仍在交谈。太阳渐渐升高，德西蕾这才猛然发现，自己依然保持着人的模样，没有再次变成白鹿。惩罚的日子终于结束了！她心中的幸福简直无法形容。德西蕾欢欢喜喜地坐在王子身边，把自己怎样遇到日光，怎样受到魔法变成白鹿，又怎样只能在夜间恢复人形，从头到尾全告诉了他。
        - id: ch06-b09
          speaker: narrator
          text: 故事终于有了美满结局。直到这时，大家才知道，小屋里的老妇人原来就是郁金香仙女。她亲自为这对年轻恋人举行了一场婚宴。那场筵席盛大得不可思议，自开天辟地以来，从未有人见过同样的场面。婚宴上的每个人都欢喜不尽，王子与德西蕾也终于可以相守。只有塞里塞特和她母亲不能分享这份快乐。
        - id: ch06-b10
          speaker: narrator
          text: 她们被人装上一条船，送往远处的一座小岛，从此再也永远不能回到过去的生活。没有了宫廷的华服和安逸日子，母女俩只能每天辛勤劳作，靠自己的双手养活自己。
