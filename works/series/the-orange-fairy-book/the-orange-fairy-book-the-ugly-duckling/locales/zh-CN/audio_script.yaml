audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    mother_duck:
      display_name: 鸭妈妈
      tts:
        delivery: 爱体面也护孩子，疲惫时会直率抱怨
        timbre: 温暖明亮
        pace: 适中
        pitch: 中高
    old_neighbor:
      display_name: 老邻居
      tts:
        delivery: 阅历丰富，爱发表见解，话里带一点挑剔
        timbre: 略显沙哑
        pace: 从容
        pitch: 中
    rude_duck:
      display_name: 粗鲁的鸭子
      tts:
        delivery: 刻薄急躁，说话咄咄逼人
        timbre: 尖亮
        pace: 稍快
        pitch: 高
    spanish_duck:
      display_name: 西班牙老母鸭
      tts:
        delivery: 自负而讲究身份，评价别人时慢条斯理
        timbre: 苍老厚实
        pace: 缓慢
        pitch: 中低
    ugly_duckling:
      display_name: 丑小鸭
      tts:
        delivery: 年幼敏感，始终礼貌，历经磨难后仍真诚
        timbre: 清软稚嫩
        pace: 适中偏慢
        pitch: 中高
    wild_duck_1:
      display_name: 野鸭甲
      tts:
        delivery: 疏离直接，打量陌生人时毫不客气
        timbre: 清脆
        pace: 适中
        pitch: 中
    wild_duck_2:
      display_name: 野鸭乙
      tts:
        delivery: 冷淡随意，语气与同伴配合利落
        timbre: 略低而清楚
        pace: 适中
        pitch: 中低
    gander_1:
      display_name: 年轻公雁甲
      tts:
        delivery: 年轻爽快，向往新的水域
        timbre: 明朗
        pace: 稍快
        pitch: 中
    gander_2:
      display_name: 年轻公雁乙
      tts:
        delivery: 活泼随和，说话带着邀伴同行的热情
        timbre: 清亮
        pace: 稍快
        pitch: 中高
    hen:
      display_name: 母鸡
      tts:
        delivery: 实用而自以为是，只看重自己熟悉的本领
        timbre: 干脆明亮
        pace: 适中偏快
        pitch: 中高
    cat:
      display_name: 猫
      tts:
        delivery: 矜持傲慢，对自己的本领十分得意
        timbre: 柔滑偏冷
        pace: 从容
        pitch: 中
    old_woman:
      display_name: 老太太
      tts:
        delivery: 爽快慈爱，却有几分想当然
        timbre: 苍老温和
        pace: 适中
        pitch: 中低
    child_1:
      display_name: 孩子甲
      tts:
        delivery: 天真热心，见到天鹅时惊喜直率
        timbre: 清亮童声
        pace: 明快
        pitch: 高
    child_2:
      display_name: 孩子乙
      tts:
        delivery: 活泼善良，赞叹时真挚热烈
        timbre: 柔和童声
        pace: 明快
        pitch: 高
    child_3:
      display_name: 孩子丙
      tts:
        delivery: 好奇开朗，跟伙伴说话自然合拍
        timbre: 稚嫩清晰
        pace: 稍快
        pitch: 高
  chapters:
    - id: ch01
      title: 牛蒡叶下的巢
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 丹麦的夏天来了。这个国家平日看着又平又单调，这时却美极了。麦子黄了，燕麦还是青的，晒干的草又香又暖，叫人真想躺上去打个滚。从一座废弃的老屋到运河边，长满了高大的牛蒡。那片叶子密得像森林，就算一家孩子藏在里面，也未必有人找得到。
        - id: ch01-b02
          speaker: narrator
          text: 一只母鸭把窝筑在牛蒡下面，整天守着六只蛋。五只是白的，剩下那只比别的蛋大，又是难看的灰色。母鸭总是想不通，它怎么会跟其余的蛋差这么多。每天早晚，她都会下水痛快游一圈，活动活动双腿。换作聪明一点的鸟，也许会猜到，就在她离开时，有个懒惰的母亲躲在旁边，趁机把自己的蛋偷偷塞进了窝。可鸭子不聪明，数数又不利落。母鸭没有多想，只管让大蛋也跟别的蛋一样暖和。
        - id: ch01-b03
          speaker: narrator
          text: 这是她第一次孵蛋。起初，她得意极了，还取笑别的母鸭不尽责任，只顾闲聊，或者找借口多游几趟水。日子一长，她自己也坐腻了。
        - id: ch01-b04
          speaker: mother_duck
          text: 怪了，现在孵蛋怎么要等这么久？
        - id: ch01-b05
          speaker: narrator
          text: 她也想出去找点乐子。可她明白，要是把蛋扔下，让里面的小鸭死掉，朋友们以后谁也不会理她。于是她继续坐着，只是每天起身好几次，看看蛋壳裂了没有。也许正因为她总去查看，蛋才迟迟不肯裂开。
        - id: ch01-b06
          speaker: narrator
          text: 母鸭至少看了一百五十回，终于有两只蛋裂开了一道细缝。她欢喜得赶紧爬回窝里，把蛋一只只拢紧，一整天都没有挪动。第二天早上，五只白蛋全有了裂缝。到了中午，两颗黄色的小脑袋已经探出壳来。母鸭大受鼓舞，用嘴帮小家伙们啄开蛋壳，让他们顺利钻出去，然后又稳稳坐了一整夜。太阳还没升起，五只蛋已经空了，十只小眼睛一起望着外面的绿色世界。
        - id: ch01-b07
          speaker: narrator
          text: 母鸭爱干净，碎蛋壳又硌脚，便把它们全推到窝外。如今有孩子陪她说话，她很高兴，只等那只大蛋孵出来。可是一天接着一天，大蛋一点动静也没有。她越来越心烦，想找丈夫商量，可丈夫始终不见踪影。
        - id: ch01-b08
          speaker: mother_duck
          text: 这只蛋到底怎么了？等它孵出来的工夫，够我孵两窝小鸭啦！
        - id: ch01-b09
          speaker: narrator
          text: 来串门的老邻居凑近看了看。
        - id: ch01-b10
          speaker: old_neighbor
          text: 让我瞧瞧。啊，我就知道，这是火鸡蛋！我年轻时也受过骗，替人孵了一窝火鸡。那些小东西笨得很，怎么教也学不会游水。我一想起来就生气。
        - id: ch01-b11
          speaker: mother_duck
          text: 那我再等一天。二十四小时以后，它还不出壳，我就不管它了。我得教别的孩子游水、自己找食物，总不能两头一起忙呀。
        - id: ch01-b12
          speaker: narrator
          text: 她叹着气抖开羽毛，把大蛋推到窝中央。第二天，她始终坐在上面，连早晨的澡也没洗，生怕一阵冷风吹坏那只蛋。傍晚，她壮着胆子偷看，果然在蛋壳顶上发现了一条细缝。母鸭满怀希望地重新坐好，激动得整夜几乎没睡。第一线晨光刚露出来，她觉得身下有东西在动。没错，终于孵开了。她才挪动一下，一只笨手笨脚的大鸟就头朝下栽在地上。
        - id: ch01-b13
          speaker: narrator
          text: 这孩子确实很丑，连母亲心里也不能否认。可她嘴上只说他个头大、身体壮。她看看那身暗褐色的羽毛，又看看那条光秃秃的长脖子。
        - id: ch01-b14
          speaker: mother_duck
          text: 等你下了水，一定不用我教。
        - id: ch01-b15
          speaker: narrator
          text: 她说对了。大孩子天生会游，只是模样远远比不上跟在母鸭身后的几个黄色小绒球。
    - id: ch02
      title: 养鸭场里的异类
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他们游完水回来，老邻居已经等在岸边，要领他们去养鸭场。她悄悄对母鸭说话。
        - id: ch02-b02
          speaker: old_neighbor
          text: 他肯定不是小火鸡。虽然瘦得只剩一把骨头，颜色也不好看，可那股气派还真不一般。你瞧，他的头昂得多端正。
        - id: ch02-b03
          speaker: mother_duck
          text: 你这样说，真是太客气了。单独看，他其实也过得去，就是跟别的孩子不太一样。不过，哪能个个都长得漂亮呢？
        - id: ch02-b04
          speaker: narrator
          text: 母鸭嘴上这样说，心里已经有些怀疑了。他们来到场院中央，一只年纪很大的母鸭坐在那里，所有家禽都很敬重她。鸭妈妈朝她点了点头，小声教孩子们规矩。
        - id: ch02-b05
          speaker: mother_duck
          text: 走到她面前，要深深鞠躬。两条腿像我这样分开站。脚尖朝里的小鸭一看就没教养，只有出身低贱的孩子才那样。
        - id: ch02-b06
          speaker: narrator
          text: 小鸭们扭着胖乎乎的身子，努力模仿母亲，老母鸭看了很满意。其他鸭子却满脸不高兴。其中一只越说越刻薄。
        - id: ch02-b07
          speaker: rude_duck
          text: 怎么又来这么多？场院早就挤满了！你们见过那个高个子吗？世上还有比他更丑的吗？一窝里出了这种孩子，真够丢脸的。我要把他赶走！
          emotion: disgusted
        - id: ch02-b08
          speaker: narrator
          text: 她竖起羽毛，冲过去咬住大鸭宝宝的脖子。小鸭疼得大叫。这是他第一次知道疼是什么滋味，母亲一听便猛地转身。
        - id: ch02-b09
          speaker: mother_duck
          text: 放开他！他根本没惹你。你再碰他，我就去叫他父亲！
          emotion: angry
        - id: ch02-b10
          speaker: rude_duck
          text: 他是没惹我，可他又丑又笨，谁能受得了？
        - id: ch02-b11
          speaker: narrator
          text: 小鸭不明白这些话的意思，却知道大家在责怪他。掌管养禽场的西班牙老母鸭也开了口，他更加难受了。
        - id: ch02-b12
          speaker: spanish_duck
          text: 这些小宝贝都这么漂亮，偏偏他长得完全不同，实在可惜。要是能把他重新孵一遍就好了。
        - id: ch02-b13
          speaker: narrator
          text: 可怜的小家伙垂着脑袋，不知道眼睛该往哪儿放。直到母亲替他辩解，他才觉得好受一点。
        - id: ch02-b14
          speaker: mother_duck
          text: 他也许没那么好看，可他游得更好，身体也强壮。我相信，他以后照样能活出自己的样子，不会比谁差。
        - id: ch02-b15
          speaker: spanish_duck
          text: 好吧，你们就把这里当自己家。
        - id: ch02-b16
          speaker: narrator
          text: 老母鸭摇摇摆摆地走了。其余的小鸭果真像在自己家一样安顿下来，只有丑小鸭没有好日子过。只要大家以为母亲没有看见，谁都会啄他一口。就连个头很大的公火鸡，每次路过也少不了几句嘲笑。他的兄弟姐妹原本根本没留意他有什么不同，可别人把这个念头塞进了他们脑子里。没过多久，他们也变得跟大家一样粗暴无情。
        - id: ch02-b17
          speaker: narrator
          text: 小鸭终于忍不下去了。有一天，他仿佛看见连母亲也开始嫌弃自己。当天夜里，鸭子和母鸡都睡着了，他从一扇敞开的门里偷偷溜走，借牛蒡叶遮住身体，沿着运河岸跌跌撞撞地一直赶路。他终于来到一片宽阔的草泽，到处是长着芦苇的湿软沼地。小鸭在那里躺下来，身体已经累坏了，心里又怕得厉害，怎么也睡不着。
        - id: ch02-b18
          speaker: narrator
          text: 太阳刚露头，芦苇沙沙响了起来。他这才发现，自己闯进了野鸭的住处。小鸭已经没力气再逃，只好站起来，客客气气地鞠躬。两只野鸭把他仔细打量一遍。
        - id: ch02-b19
          speakers: [wild_duck_1, wild_duck_2]
          ensemble: duo
          text: 你长得真丑。不过，只要你不想娶我们的女儿，这就不关我们的事。你要真有这个念头，我们可绝不会答应。
        - id: ch02-b20
          speaker: ugly_duckling
          text: 我没有想娶谁。我走了很远，只想请你们让我安静地待着。
        - id: ch02-b21
          speaker: narrator
          text: 接下来的整整两天，他都安安静静地躺在芦苇间。附近找到什么，他便吃什么，渴了就喝草泽水潭里的水，身体终于重新有了力气。这里没有谁来咬他，也没有谁追在身后说他丑。他远离了所有人，觉得又自在又快活，真希望自己能永远留在这里。
    - id: ch03
      title: 枪声与破旧小屋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天傍晚，两只年轻的公雁在芦苇间玩水找食物，瞧见了丑小鸭。
        - id: ch03-b02
          speakers: [gander_1, gander_2]
          ensemble: duo
          text: 我们在这片草泽待腻了，明天要换个地方。那里的湖更大，食物也更多。你跟我们一起走吗？
        - id: ch03-b03
          speaker: ugly_duckling
          text: 那里比这里还好吗？
        - id: ch03-b04
          speaker: narrator
          text: 他的话才出口，只听砰、啪两声，两只公雁已经死在他身边。枪声惊得灯心草里的野鸭全飞上天，接下来几分钟，射击一直没有停。
        - id: ch03-b05
          speaker: narrator
          text: 幸好丑小鸭不会飞。他在水中拼命扑腾，想躲进低洼处的高蕨草里。还没到那里，一头长着四条腿的庞然大物挡住了路。后来他才知道，那是一条狗。狗吐着长长的红舌头，站在那里盯着他。小鸭吓得浑身冰凉，只想把脑袋藏到小翅膀下面。狗闻了闻，却从他身旁走开了。
        - id: ch03-b06
          speaker: ugly_duckling
          text: 我丑得连狗都不愿意吃。还好，总算逃过了一劫。
        - id: ch03-b07
          speaker: narrator
          text: 他逃进蕨草，把身子蜷在柔软的草里，直到枪声消失在远处。四周安静了很久，只剩天上的星星还望着他，他才爬出来看看。他再也不想靠近水潭了，于是朝来路相反的方向勇敢走去。
        - id: ch03-b08
          speaker: narrator
          text: 前面有一间小屋，破败得仿佛再过几个钟头，连砌墙的石块都会散架。就连门也只靠一只铰链吊着。屋里唯一的亮光来自一簇小小的炉火。小鸭沿着门缝小心挤进去，躺在破门旁的一把椅子下面。这样一有危险，他马上就能逃走。没有谁看见他，也没有谁闻到他的气味，他总算平安睡了一夜。
        - id: ch03-b09
          speaker: narrator
          text: 屋里住着一位老太太、一只猫和一只母鸡。可真正做主的是猫和母鸡。老太太整天纺线，再拿到附近城里去卖。她把这两个伙伴当作亲生孩子，从来不反对他们。所以小鸭得讨好的，是猫和母鸡。
        - id: ch03-b10
          speaker: narrator
          text: 第二天天亮，他们才发现来客。小鸭浑身发抖，一只眼睛始终盯着门，随时准备逃跑。猫和母鸡走近时倒不显得凶，他也慢慢没那么害怕了。
        - id: ch03-b11
          speaker: hen
          text: 你会下蛋吗？
        - id: ch03-b12
          speaker: ugly_duckling
          text: 不会，我不知道该怎么下。
        - id: ch03-b13
          speaker: narrator
          text: 母鸡立刻转过身，用背对着他。猫走上前来。
        - id: ch03-b14
          speaker: cat
          text: 那你生气时会把毛竖起来吗？高兴时会咕噜咕噜叫吗？
        - id: ch03-b15
          speaker: ugly_duckling
          text: 我只会游水。
        - id: ch03-b16
          speaker: narrator
          text: 这本领在猫和母鸡看来，根本没有用。他们马上去找还躺在床上的老太太。
        - id: ch03-b17
          speakers: [hen, cat]
          ensemble: duo
          text: 有个一点用也没有的东西躲进来了。他说自己是小鸭，却不会下蛋，也不会咕噜叫！你说该怎么办？
        - id: ch03-b18
          speaker: old_woman
          text: 当然留下他！说他不会下蛋，都是胡说。先让他住一阵吧，看看以后怎么样。
        - id: ch03-b19
          speaker: narrator
          text: 丑小鸭就这样住了三个星期，每天跟猫和母鸡一起吃东西，可他们盼着的鸡蛋始终连影子也没有。后来太阳出来了，空气变得柔和。小鸭越来越厌倦关在小屋里的日子，一心一意只想下水游一游。一天早晨，他想得坐立不安，连猫和母鸡都看出了不对劲。
        - id: ch03-b20
          speaker: hen
          text: 你这是怎么了？
        - id: ch03-b21
          speaker: ugly_duckling
          text: 我太想回到水里了。把脑袋钻进水中，一口气潜到底，那种痛快，你根本想不到。
        - id: ch03-b22
          speaker: hen
          text: 我可不觉得有什么好。猫肯定也不喜欢。
        - id: ch03-b23
          speaker: cat
          text: 我最讨厌的就是这种事。
        - id: ch03-b24
          speaker: ugly_duckling
          text: 我不能再留在这里了，我一定得回到水里。
        - id: ch03-b25
          speakers: [hen, cat]
          ensemble: duo
          text: 那好，你走吧。
        - id: ch03-b26
          speaker: narrator
          text: 猫和母鸡觉得受了冒犯，冷冰冰地让他走，随后都转过身去。小鸭天生懂礼貌，原想好好道别，再谢谢他们曾经收留自己，可他们根本不肯理他。他只好穿过那扇摇摇欲坠的门，心里很难过。可是重新回到空气和水里时，他还是忍不住浑身一阵欢喜。路上遇到的动物再朝他投来无礼的目光，他也不太在乎了。
    - id: ch04
      title: 漫长的冬天
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 有一阵子，丑小鸭过得很快活。很快，冬天到了，雪落下来，四处又湿又冷。小鸭这才知道，喜欢在水里游是一回事，喜欢在陆地上浑身湿透，却是完全不同的另一回事。
        - id: ch04-b02
          speaker: narrator
          text: 一天，太阳像一个巨大的猩红圆球，正慢慢沉下去。河面忽然变得又硬又滑，丑小鸭看得十分惊奇。这时，头顶传来翅膀扇动的呼呼声。一群天鹅从高空飞过。他们白得像夜里刚落的雪，长长的脖颈伸向南方，金色的嘴也朝着那里。
        - id: ch04-b03
          speaker: narrator
          text: 天鹅正向南方飞去。他们自己也不十分清楚要去哪里，只知道那个地方整天都有阳光。丑小鸭多想跟他们一起飞！可那当然不可能。像他这么丑的东西，怎么配跟那些美丽的鸟儿做伴呢？他只能伤心地走到一处避风的水潭，一口气潜到最深处，努力说服自己，能够这样游水，就是他所能梦想的最大幸福。可不管怎样骗自己，他心里明明知道，根本不是这样的。
        - id: ch04-b04
          speaker: narrator
          text: 每个清晨都比前一天更冷，小鸭得拼尽力气，才能让身体不被冻僵。其实，他从来就没有真正暖和过。终于，一个酷寒的夜晚过去，他的双腿越动越慢，四周的冰一点点合拢。晨光出现时，他已经被牢牢冻在冰里，像掉进了一座逃不出的陷阱，很快便失去了知觉。
        - id: ch04-b05
          speaker: narrator
          text: 再过几个钟头，他就会死去。幸好，一个男人正要过河去干活，一眼看见了他。男人穿着厚木鞋，用力把冰跺碎，然后抱起小鸭，塞进自己的羊皮袄。小鸭冻僵的身体总算渐渐有了一点温度。
        - id: ch04-b06
          speaker: narrator
          text: 男人没有去干活，而是把小鸭带回家交给孩子们。孩子们喂他吃热糊，又把他放进炉边的箱子。等他们放学回来，小鸭已经舒服多了。自从离开老太太的小屋，他还从没这样暖和过。
        - id: ch04-b07
          speaker: narrator
          text: 孩子们都是善良的小家伙，只想跟他一起玩。可怜的小鸭一生从没玩过，还以为他们又要捉弄自己。他吓得先飞进牛奶盆，又从那里蹦进黄油碟，接着一头栽进面粉桶。屋里顿时响成一片，也乱成一团。小鸭被这些声音和混乱吓坏了，径直冲出门去，藏到屋后灌木丛间的积雪里。
        - id: ch04-b08
          speaker: narrator
          text: 后来，小鸭自己也说不清究竟是怎么熬过冬天剩下的日子。他只记得那段日子非常悲惨，每天都找不到足够的食物，肚子从来没有真正吃饱。可是光景终于一点点好起来。冻硬的大地变软了，太阳一天比一天温暖，鸟儿又开始歌唱，花朵也重新出现在草地上。
        - id: ch04-b09
          speaker: narrator
          text: 从农夫家逃出来后，小鸭流浪到一片芦苇中，在那里睡了很久。如今他站起身，觉得自己跟睡着以前不一样了。身体好像长大了，翅膀也更有力。山坡一侧有一团粉红色的东西，仿佛正望着他。小鸭决定飞过去看看。
    - id: ch05
      title: 水中的白天鹅
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 小鸭冲进天空，一会儿转向这边，一会儿盘旋到那边。飞翔竟是这样畅快，他以前从来不知道！等他接近那片粉红色的云，才发现那是满树苹果花。花树长在一间小屋旁，屋前的花园沿着缓坡一直伸展到运河岸边。小鸭甚至有些舍不得结束这趟飞行。他缓缓拍动翅膀，最后才落到地面。
        - id: ch05-b02
          speaker: narrator
          text: 他慢慢落到地上，在一丛丁香树下停了一会儿。正四处张望时，一群美丽的鸟儿从面前缓缓走过。那就是许多个月前飞过天空的鸟。小鸭看得入了迷，目光一刻也舍不得移开。天鹅们一个接一个踏进运河，随后安安静静地浮在水面上，仿佛他们本来就是这片水的一部分。
        - id: ch05-b03
          speaker: ugly_duckling
          text: 我要跟上他们。我虽然丑，却宁愿被他们杀死，也不愿再挨饿受冻，再让那些本该善待我的鸭子和家禽欺负。
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: 他飞快落到水面，拼尽力气向天鹅游去。天鹅们正在一片碧绿的水潭里休息，岸边的树枝低低垂着，轻拂水面。小鸭很快便追上了他们。
        - id: ch05-b05
          speaker: narrator
          text: 几只年轻的天鹅一见他过来，便发出欢迎的叫声，迎面游去。丑小鸭又一次听不懂这些声音是什么意思。他心里欢喜，身体却还在发抖。他慢慢游到天鹅中间，转向一只刚从浓密树荫下游出来的年长天鹅，鼓起勇气开了口。
        - id: ch05-b06
          speaker: ugly_duckling
          text: 如果我一定要死，我宁愿让你们杀死我。我不知道自己为什么会孵出来。我丑得不配活着。
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: 说完，他低下头，看着水面。平静的水里倒映着许多白色身影，都有修长的脖颈和金黄的嘴。小鸭本能地寻找那副暗灰色的身体，还有那条瘦削又笨拙的脖子。可水里根本没有那样的影子。
        - id: ch05-b08
          speaker: narrator
          text: 他看见的，竟是一只美丽的白天鹅。
        - id: ch05-b09
          speaker: narrator
          text: 睡觉以前，孩子们拿着饼干和蛋糕来喂天鹅。他们一眼就看见了新来的那一只。
        - id: ch05-b10
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: 新来的最漂亮！他的羽毛比别的天鹅更白，嘴也更加金黄！
          emotion: happy
        - id: ch05-b11
          speaker: narrator
          text: 听见这番话，他想，过去受过的所有欺凌，还有独自熬过的漫长孤独，如今全都有了意义。要不是亲身经历过那些苦难，他永远也不会知道，原来真正的幸福会是这样的滋味。
