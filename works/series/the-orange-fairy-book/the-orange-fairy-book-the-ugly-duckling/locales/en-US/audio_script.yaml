  chapters:
    - id: ch01
      title: The Egg Beneath the Burdocks
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Summer had come to Denmark. For most of the year the land looked flat and plain, but now it was beautiful. The wheat stood yellow, the oats were green, and the dry hay was delightful to roll in. Great burdocks grew from an old ruined house all the way down to the canal. They were so tall that a whole family of children could have hidden among them and never been found."
        - id: ch01-b02
          speaker: narrator
          text: "Under those burdocks, a duck had made a warm nest. She sat there all day on six eggs. Five were white and pretty. The sixth was larger than the rest and an ugly gray. She often wondered why it looked so different. Each morning and evening she left the nest just long enough to stretch her legs with a healthy swim. Another bird might have guessed that some lazy mother watched for one of those moments and slipped her own egg into the nest. But ducks are not clever at counting. This mother did not trouble herself over the mystery. She simply made sure the big egg stayed as warm as the others."
        - id: ch01-b03
          speaker: narrator
          text: "These were the first eggs she had ever laid. At first she felt proud of how faithfully she sat. She even laughed at the other mothers for leaving their nests to gossip or take extra swims. Before long, though, she became tired of sitting there all day."
        - id: ch01-b04
          speaker: mother_duck
          text: "Eggs surely didn't take this long to hatch before. I wish I could have a little fun."
        - id: ch01-b05
          speaker: narrator
          text: "Still, she knew her friends would never speak to her again if she left the ducklings inside the eggs to die. So she stayed. Several times a day she climbed off to see whether the shells were cracking. That may have been the very reason they took so long."
        - id: ch01-b06
          speaker: narrator
          text: "She must have checked a hundred and fifty times before she finally saw tiny cracks in two eggs. Delighted, she scrambled back, drew all the eggs close together, and did not move again for the whole day. By the next morning, all five white shells were cracked. At midday, two small yellow heads poked out and looked around."
        - id: ch01-b07
          speaker: narrator
          text: "That gave her courage. She broke the shells with her bill to help the little creatures escape, then sat steadily through the night. Before sunrise, the five white eggs lay empty, and ten bright eyes were looking out at the green world."
        - id: ch01-b08
          speaker: narrator
          text: "The mother duck had been carefully raised and disliked dirt. Broken shells were uncomfortable underfoot as well, so she pushed them over the edge of the nest. She was glad to have five ducklings for company while she waited for the large egg. Yet day followed day, and it showed no crack. She grew impatient and wished she could ask her husband, but he never came."
        - id: ch01-b09
          speaker: mother_duck
          text: "I can't imagine what's wrong with this egg. I could have hatched two whole broods in the time this one has taken!"
        - id: ch01-b10
          speaker: narrator
          text: "An old neighbor had stopped by to visit. She bent over the egg and studied it."
        - id: ch01-b11
          speaker: old_neighbor
          text: "Let me see. Ah, just as I thought. That's a turkey's egg. Someone once tricked me into sitting on turkey eggs. When they hatched, those silly creatures would not learn to swim, no matter what I did. It still makes me cross to remember it."
        - id: ch01-b12
          speaker: mother_duck
          text: "Well, I'll give this one one more chance. If it hasn't hatched in another day, I'll leave it and teach the others to swim and find food. I can't do both things at once."
        - id: ch01-b13
          speaker: narrator
          text: "With a fluff of her feathers, she rolled the egg into the middle of the nest. She stayed on it through the next day and even gave up her morning bath, afraid that cold air might reach it. That evening she thought she saw a little crack near the top. Hopeful again, she settled down, though excitement hardly let her sleep."
        - id: ch01-b14
          speaker: narrator
          text: "At the first streaks of daylight, something moved beneath her. The egg had hatched at last. As she lifted herself, a large, awkward bird tumbled headfirst onto the ground. Even his mother had to admit to herself that he was ugly, though aloud she called him large and strong."
        - id: ch01-b15
          speaker: mother_duck
          text: "Once you're in the water, you won't need me to teach you anything."
        - id: ch01-b16
          speaker: narrator
          text: "She looked in surprise at his dull brown back and long bare neck. He was nowhere near as pretty as the little yellow balls that followed her. But once the whole family entered the water, he truly needed no lesson. He swam as naturally as the rest and held his own among them."
        - id: ch01-b17
          speaker: narrator
          text: "When the family came back, the old neighbor waited on the bank to lead them into the duckyard. She leaned close to the mother and whispered."
        - id: ch01-b18
          speaker: old_neighbor
          text: "He certainly isn't a young turkey. He may be lean and colorless, but there's something rather fine about him. And see how well he holds up his head."
        - id: ch01-b19
          speaker: mother_duck
          text: "That's kind of you to say. He looks all right by himself, of course, though somehow he is different from the others. But no mother can expect every child to be beautiful."
        - id: ch01-b20
          speaker: narrator
          text: "At the center of the yard sat a very old Spanish duck. Every fowl there treated her with great respect. The mother nodded toward her and quietly instructed her children."
        - id: ch01-b21
          speaker: mother_duck
          text: "Go up and bow very low. Keep your legs wide apart, just as I do. A well-bred duckling never turns in its toes. That would make people think your parents were common."
        - id: ch01-b22
          speaker: narrator
          text: "The little ducks tried hard to make their small round bodies move like their mother's. The old Spanish duck seemed pleased. The other ducks were not. They stared at the newcomers and complained among themselves."
        - id: ch01-b23
          speakers: [yard_duck_1, yard_duck_2]
          ensemble: duo
          text: "Oh no, even more of them! This yard is full already. And look at that great tall creature. Have you ever seen anything so ugly?"
        - id: ch01-b24
          speaker: yard_duck_1
          text: "He disgraces the whole brood. I'll chase him away!"
        - id: ch01-b25
          speaker: narrator
          text: "She raised her feathers, rushed at the big duckling, and bit him on the neck. He gave a loud quack. He had never felt pain before. His mother heard him and spun around."
        - id: ch01-b26
          speaker: mother_duck
          text: "Leave him alone, or I'll send for his father! He wasn't bothering you."
          emotion: angry
        - id: ch01-b27
          speaker: yard_duck_1
          text: "No, but he's so ugly and clumsy that no one can stand having him here."
        - id: ch01-b28
          speaker: narrator
          text: "The duckling did not understand the words, but he knew he was being blamed. Then the old Spanish duck joined in, and he felt worse still."
        - id: ch01-b29
          speaker: spanish_duck
          text: "What a pity he looks so different from these lovely little ones. If only he could be hatched all over again."
        - id: ch01-b30
          speaker: narrator
          text: "The poor little fellow let his head droop and did not know where to look. His mother came to his defense."
        - id: ch01-b31
          speaker: mother_duck
          text: "He may not be as handsome as the others, but he swims better, and he's very strong. I'm certain he'll make his way in the world as well as anyone."
        - id: ch01-b32
          speaker: spanish_duck
          text: "Well, make yourselves at home."
        - id: ch01-b33
          speaker: narrator
          text: "The old duck waddled away. The family did make itself at home, except for the ugly duckling. Everyone snapped at him whenever his mother was not looking. Even the great turkey-cock never passed without mocking him. His own brothers and sisters had noticed nothing wrong until the others pointed it out. Soon they became just as rude and cruel."
    - id: ch02
      title: Alone on the Moor
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "At last the duckling could bear no more. One day he even imagined that his mother was beginning to turn against him. That night, while the ducks and hens slept, he slipped through an open door. Hidden beneath the burdock leaves, he struggled along the canal bank until he reached a broad grassy moor. Soft marshy ground lay all around him, thick with reeds."
        - id: ch02-b02
          speaker: narrator
          text: "He lay down there, but he was too tired and frightened to sleep. At the first hint of sunrise, the reeds rustled. The duckling realized he had wandered into a colony of wild ducks. He could not run away again, so he stood and bowed politely. The wild ducks looked him over from bill to tail."
        - id: ch02-b03
          speakers: [wild_duck_1, wild_duck_2]
          ensemble: duo
          text: "You certainly are ugly. Still, that's none of our concern, unless you mean to marry one of our daughters. We would never allow that."
        - id: ch02-b04
          speaker: duckling
          text: "I don't want to marry anyone. I've come a long way, and all I ask is to be left alone."
        - id: ch02-b05
          speaker: narrator
          text: "For two full days he rested quietly among the reeds. He ate whatever food he could find and drank from the moorland pool until his strength returned. The stillness felt wonderful after his long journey. He wished he might stay there forever. Away from everyone else, no one bit him or told him how ugly he was. For the first time in a long while, he felt safe and happy."
        - id: ch02-b06
          speaker: narrator
          text: "One evening, two young ganders noticed him while splashing among the reeds and searching for supper."
        - id: ch02-b07
          speaker: gander_1
          text: "We're tired of this moor. Tomorrow we're going to try another place, with bigger lakes and better food."
        - id: ch02-b08
          speaker: gander_2
          text: "Would you like to come along with us?"
        - id: ch02-b09
          speaker: duckling
          text: "Is it better there than it is here?"
        - id: ch02-b10
          speaker: narrator
          text: "The last word had barely left his bill when two shots cracked through the air. The two friendly young ganders fell dead beside him. At once the wild ducks burst from their hiding places in the rushes and flew upward. For several minutes, guns kept firing across the moor while the startled birds scattered."
        - id: ch02-b11
          speaker: narrator
          text: "The duckling could not fly, and that saved him. He floundered through the water toward a hollow where tall ferns could hide him. Before he reached it, a huge four-legged creature stood in his path. Later he learned it was a dog. The animal stared at him with a long red tongue hanging from its mouth."
        - id: ch02-b12
          speaker: narrator
          text: "Terror turned the duckling cold. He tried to tuck his head beneath his little wings. The dog sniffed him, then walked on. The duckling hurried into the ferns and curled up in the soft grass."
        - id: ch02-b13
          speaker: duckling
          text: "I'm too ugly even for a dog to eat. Thank goodness for that."
        - id: ch02-b14
          speaker: narrator
          text: "He stayed hidden until the shots faded far into the distance. Long afterward, when everything was quiet and only the stars could see him, he crept out and looked around."
        - id: ch02-b15
          speaker: narrator
          text: "He decided he would never go near a pool again. The moor stretched far away in the direction opposite the duckyard, so he bravely marched onward. At last he came to a little cottage. It was so tumbledown that the stones seemed ready to fall apart. The door hung by a single hinge, and the only light came from a tiny fire inside."
        - id: ch02-b16
          speaker: narrator
          text: "The duckling edged carefully through the doorway. He settled beneath a chair beside the broken door, where he could escape if he had to. No one seemed to see or smell him, and he spent the rest of the night in peace."
    - id: ch03
      title: The Cottage of the Cat and the Hen
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "An old woman lived in that cottage with her cat and her hen. In truth, the cat and hen ruled the house, not the woman. She spent her days spinning yarn to sell in the nearest town. She loved them like children and never went against them. If the duckling hoped to stay, he would need their approval, not hers."
        - id: ch03-b02
          speaker: narrator
          text: "Morning light revealed the visitor. He stood trembling before the two animals, keeping one eye on the door in case he had to flee. They did not look very fierce, and as they came closer, he grew a little less afraid. The hen questioned him first."
        - id: ch03-b03
          speaker: hen
          text: "Can you lay eggs?"
        - id: ch03-b04
          speaker: duckling
          text: "No. I don't know how."
        - id: ch03-b05
          speaker: narrator
          text: "The hen turned her back. Then the cat stepped forward."
        - id: ch03-b06
          speaker: cat
          text: "Can you make your fur stand up when you're angry? Can you purr when you're pleased?"
        - id: ch03-b07
          speaker: duckling
          text: "No. All I can do is swim."
        - id: ch03-b08
          speaker: narrator
          text: "That did not seem useful to either of them. They went straight to the old woman, who was still in bed."
        - id: ch03-b09
          speakers: [hen, cat]
          ensemble: duo
          text: "A useless creature has taken shelter here. It says it's a duckling, but it can't lay eggs or even purr. What should we do with it?"
        - id: ch03-b10
          speaker: old_woman
          text: "Keep it, of course! This talk about never laying eggs is nonsense. Let it stay for a while, and we'll see what happens."
        - id: ch03-b11
          speaker: narrator
          text: "So the duckling remained for three weeks and shared the cat's and hen's food. Not one egg appeared. Then the sun came out and the air grew mild. The duckling became weary of the hut. More than anything, he wanted to swim. One morning he was so restless that the others noticed."
        - id: ch03-b12
          speaker: hen
          text: "What's the matter with you?"
        - id: ch03-b13
          speaker: duckling
          text: "I want to be in the water again so badly. You can't imagine how wonderful it feels to put your head under and dive straight down to the bottom."
        - id: ch03-b14
          speaker: hen
          text: "I don't think I'd enjoy that. I doubt the cat would like it, either."
        - id: ch03-b15
          speaker: narrator
          text: "When they asked the cat, she agreed that she would hate nothing more. But the duckling could not give up his longing."
        - id: ch03-b16
          speaker: duckling
          text: "I can't stay in this cottage any longer. I have to reach the water."
        - id: ch03-b17
          speaker: narrator
          text: "The cat and hen felt offended and hurt. Their answer was short."
        - id: ch03-b18
          speakers: [cat, hen]
          ensemble: duo
          text: "Very well. Then go."
        - id: ch03-b19
          speaker: narrator
          text: "The duckling was polite by nature. He wanted to say goodbye and thank them for their kindness, but they had both turned their backs. He went sadly through the rickety door. Yet when he found himself in the open air and the water again, a thrill of joy ran through him. He hardly cared about the rude looks of the creatures he met. For a while, he was content."
    - id: ch04
      title: The Long Winter
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Soon winter came. Snow began to fall, and everything turned wet and miserable. The duckling discovered that enjoying the water was one thing. Being damp whenever he stood on land was another."
        - id: ch04-b02
          speaker: narrator
          text: "One evening the sun went down like a huge scarlet globe. To the duckling's amazement, the river was becoming hard and slippery. Then he heard the whir of wings. High overhead flew a flock of swans. They were as white as newly fallen snow. With their long necks and yellow bills stretched forward, they were heading south. They did not know exactly where, only that they were going to a land where the sun shone all day."
        - id: ch04-b03
          speaker: narrator
          text: "How the duckling wished he could rise into the air and follow them! But of course he could not. Besides, what kind of companion could a creature as ugly as he was ever be to such beautiful birds? Sadly he walked down to a sheltered pool. He dived all the way to the bottom and tried to persuade himself that this was the greatest happiness he could dream of. In his heart, he knew it was not true."
        - id: ch04-b04
          speaker: narrator
          text: "Each morning was colder than the last. The duckling worked hard just to keep himself warm. In truth, he was never warm at all. After one bitter night, his legs moved more and more slowly. The ice crept closer around his body until, in the morning light, it held him fast like a trap. Soon his senses left him, and he knew nothing."
        - id: ch04-b05
          speaker: narrator
          text: "A few more hours would have ended his life. By good fortune, a man crossed the river on his way to work and understood at once what had happened. He wore thick wooden shoes. Stamping hard, he broke the ice, lifted out the duckling, and tucked him beneath his sheepskin coat. There, the frozen little body began to thaw."
        - id: ch04-b06
          speaker: narrator
          text: "The man turned back instead of going to work and carried the bird home to his children. They gave the duckling warm food and set him in a box beside the fire. By the time they returned from school, he felt better than he had since leaving the old woman's cottage."
        - id: ch04-b07
          speaker: narrator
          text: "The children were kind and only wanted to play with him. But the poor duckling had never played in his life. He did not understand their kindness and thought they meant to tease him. In a panic, he flew straight into the milk pan, then flapped into the butter dish, and from there tumbled into the meal barrel. The noise and confusion terrified him more and more. At last he shot out through the open door and hid in the snow beneath the bushes at the back of the house."
        - id: ch04-b08
          speaker: narrator
          text: "Afterward, he could never explain just how he survived the rest of that winter. He remembered only misery and hunger. But in time the world began to change. The ground softened. The sun grew warmer. Birds sang, and flowers appeared once more among the grass."
        - id: ch04-b09
          speaker: narrator
          text: "The duckling had wandered back to the reeds after escaping from the man's cottage, and there he had slept. When he rose, something about him felt different. His body seemed larger, and his wings were stronger. On the side of a hill, something pink caught his eye. He decided to fly toward it and discover what it was."
    - id: ch05
      title: The Swan in the Water
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "What glory there was in rushing through the air! He wheeled one way, then the other. He had never dreamed that flying could feel like this. He was almost sorry when he reached the pink cloud and saw that it was really apple blossom beside a cottage. Its garden sloped down to the canal."
        - id: ch05-b02
          speaker: narrator
          text: "He drifted to the ground and rested beneath a thicket of syringas. As he looked around, a flock of beautiful birds walked slowly past. They were the same kind he had seen months before. One after another, they stepped into the canal and floated so quietly that they seemed part of the water. He could not look away."
        - id: ch05-b03
          speaker: duckling
          text: "I'll follow them. I know I'm ugly, but I'd rather let them kill me than suffer any more cold and hunger. Even the ducks and fowls who should have been kind to me have only hurt me."
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: "He flew swiftly down to the water and swam after the swans with all his strength. They had stopped to rest in a green pool beneath a tree whose low branches brushed the surface. It did not take him long to reach them. As soon as they saw him coming, some of the younger swans swam out to meet him with welcoming cries. Once again, the duckling could not understand what their welcome meant. He was still certain that the beautiful birds would reject him."
        - id: ch05-b05
          speaker: narrator
          text: "He came closer, glad and trembling at the same time. One of the older birds had left the shade of the tree. The duckling turned to that swan and spoke."
        - id: ch05-b06
          speaker: duckling
          text: "If I must die, I'd rather you killed me. I don't know why I was ever hatched. I'm too ugly to live."
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: "As he finished speaking, he bowed his head and gazed into the still pool. Many white shapes looked back at him, each with a long neck and a golden bill. Without thinking, he searched among them for the dull gray body and the thin, awkward neck he knew as his own. No such creature was anywhere in the water. In its place, directly beneath him, he saw a beautiful white swan."
        - id: ch05-b08
          speaker: narrator
          text: "Before bedtime, the children from the cottage came down to feed the swans biscuit and cake. When they saw the newcomer, they called out together."
        - id: ch05-b09
          speakers: [child_1, child_2]
          ensemble: duo
          text: "The new swan is the finest one! His feathers are whiter, and his beak is more golden than all the others."
        - id: ch05-b10
          speaker: narrator
          text: "When he heard them, the young swan understood that all the persecution and loneliness he had endured had been worth it. Without those hard days, he would never have known what it meant to be truly happy."
        - id: ch05-b11
          speaker: narrator
          text: "This story was told by Hans Andersen."
