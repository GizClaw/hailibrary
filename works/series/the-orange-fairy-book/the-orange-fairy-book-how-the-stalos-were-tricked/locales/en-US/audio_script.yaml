audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "steady, vivid folktale storytelling"
        timbre: "warm and resonant"
        pace: "measured"
        pitch: "medium"
    little_boy:
      display_name: Little Boy
      tts:
        delivery: "earnest, lively, and full of wonder"
        timbre: "young and clear"
        pace: "brisk"
        pitch: "high"
    mother:
      display_name: Mother
      tts:
        delivery: "caring, watchful, and grave when frightened"
        timbre: "gentle and warm"
        pace: "measured"
        pitch: "medium"
    patto:
      display_name: Patto
      tts:
        delivery: "resolute, cunning, and controlled"
        timbre: "weathered and firm"
        pace: "measured"
        pitch: "low"
    father_stalo:
      display_name: Father Stalo
      tts:
        delivery: "booming, cruel, and impatient"
        timbre: "rough and heavy"
        pace: "deliberate"
        pitch: "low"
    eldest_stalo:
      display_name: Eldest Stalo
      tts:
        delivery: "commanding, dull-witted, and irritable"
        timbre: "deep and coarse"
        pace: "slow"
        pitch: "low"
    stalo_mother:
      display_name: Mother of the Stalos
      tts:
        delivery: "shrewd, stern, and easily provoked"
        timbre: "aged and hard"
        pace: "measured"
        pitch: "medium-low"
    elder_sodno:
      display_name: Elder Sodno Brother
      tts:
        delivery: "quietly decisive, clever, and protective"
        timbre: "clear and sturdy"
        pace: "measured"
        pitch: "medium-low"
    younger_sodno:
      display_name: Younger Sodno Brother
      tts:
        delivery: "alert, resourceful, and softly persuasive"
        timbre: "young and firm"
        pace: "measured"
        pitch: "medium"
    lyma:
      display_name: Lyma
