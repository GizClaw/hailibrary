        pitch: "medium-high"
  chapters:
    - id: ch01
      title: The Stalo by the Well
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "One day, a little boy came into a hut in Lapland with the bundle of sticks he had been sent to gather. He had something wonderful to tell his mother."
        - id: ch01-b02
          speaker: little_boy
          text: "Mother, I saw the most amazing man!"
          emotion: surprised
        - id: ch01-b03
          speaker: mother
          text: "Did you, my son? What did he look like?"
        - id: ch01-b04
          speaker: narrator
          text: "She took off his sheepskin coat and shook it at the door while he told her what had happened."
        - id: ch01-b05
          speaker: little_boy
          text: "I was tired from bending down for sticks, so I leaned against a tree. Then I heard something going sh-sh through the dead leaves. I thought it might be a wolf, and I kept very still. But a tall man came by instead. Oh, he was twice as tall as Father! He had a long red beard and a red tunic with a silver belt. A knife with a silver handle hung from it. A huge dog followed him, stronger-looking than any wolf, or even a bear. Mother, why have you gone so pale?"
        - id: ch01-b06
          speaker: mother
          text: "That was the Stalo, the man-eater! You were lucky you hid, or you might never have come home. Remember, though, he may be tall and strong, but he is very stupid. Many a Lapp has escaped him with a clever trick."
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: "Not long afterward, whispers passed through the forest. The children of an old man named Patto had vanished, one after another, and no one knew where they had gone. Their unhappy father searched for miles in every direction. He could not find so much as a shoe or a handkerchief to show where they had passed. At last, another little boy brought news. He had seen the Stalo hiding behind a well where the children often played. The boy stayed hidden behind a clump of bushes to see what would happen. After a while, he noticed that the Stalo had stretched a cunning trap across the steepest part of the path. Anyone who caught a foot in it would tumble into the well and drown."
        - id: ch01-b08
          speaker: narrator
          text: "Then Patto's youngest daughter came running happily down the path. Her foot caught in the strings. She slipped, rolled into the water, and fell within the Stalo's reach."
        - id: ch01-b09
          speaker: narrator
          text: "When Patto heard the tale, rage filled his heart, and he vowed revenge. He put on an old fur coat and went straight into the forest. At the path by the well, he glanced around to make sure no one was watching. Then he lay down as if the snare had caught him and rolled him into the water. But he kept his head safely above the surface."
        - id: ch01-b10
          speaker: narrator
          text: "Soon the leaves went sh-sh. The Stalo pushed through the undergrowth, looking to see whether dinner waited in his trap. The moment he saw Patto's head, he burst out laughing."
        - id: ch01-b11
          speaker: father_stalo
          text: "Ha, ha! This time I've caught the old fool. I wonder what he'll taste like."
        - id: ch01-b12
          speaker: narrator
          text: "He hauled Patto from the well, threw him across his shoulders, and carried him home. There he tied a cord around Patto and hung him above the fire to roast. Then the Stalo sat outside the hut and went on making a box. He meant to store Patto's flesh in it once the cooking was done. Before long, the box was nearly finished. It only needed a little more wood chipped out with an axe. That part would be easier to do indoors, so he called to one of his sons, who were lounging inside, and told him to bring the tool."
        - id: ch01-b13
          speaker: narrator
          text: "The young man searched everywhere. He could not find it, because Patto had managed to pick it up and hide it under his clothes."
        - id: ch01-b14
          speaker: father_stalo
          text: "You useless fool! What good are you?"
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: "The Stalo sent one son after another to look, but none did any better."
        - id: ch01-b16
          speaker: father_stalo
          text: "I suppose I'll have to come and find it myself!"
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: "The Stalo put the box aside and came to look for the axe himself. Meanwhile, Patto had slipped down from the hook and hidden behind the door. The Stalo stepped inside. His prisoner raised the axe and struck one blow. The ogre's head went rolling across the ground. His sons were so frightened by the sight that they all ran away. That was how Patto avenged his dead children."
    - id: ch02
      title: Lyma Leaves a Trail
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The Stalo was dead, but his three sons were still alive, and they had not gone far. They fled to their mother, who was tending reindeer out on the pastures. They told her that some kind of magic had made their father's head roll away from his body. They had no idea what the magic could have been. They were so afraid that something dreadful would happen to them too that they had come to hide with her."
        - id: ch02-b02
          speaker: narrator
          text: "The ogress said nothing. She had learned long ago how stupid her sons were. She sent them to milk the reindeer and returned to the other house to bury her husband."
        - id: ch02-b03
          speaker: narrator
          text: "A small cottage stood three days' journey from the hut on the pastures. Two brothers named Sodno lived there with their sister, Lyma. While the brothers were away hunting, Lyma stayed behind and cared for their large herd of reindeer. Lately, people had passed a warning from one to another. The three young Stalos had been seen on the pastures. But the Sodno brothers did not let it trouble them. The danger seemed far too distant."
        - id: ch02-b04
          speaker: narrator
          text: "Then one day, when Lyma was alone in the hut, the three Stalos came down. They carried her away to their cottage and took the reindeer with them. The country was so lonely that no one might have known which way they went. But Lyma tied a ball of thread to the handle of the back door and let the thread trail behind her. The thread did not reach all the way. It ended beside a snowy track that led straight toward the Stalos' house."
        - id: ch02-b05
          speaker: narrator
          text: "When the brothers returned from hunting, the hut and sheds were empty."
        - id: ch02-b06
          speakers: [elder_sodno, younger_sodno]
          ensemble: duo
          text: "Lyma! Lyma!"
        - id: ch02-b07
          speaker: narrator
          text: "No voice answered. The brothers searched all around the cottage and the empty sheds. Perhaps their sister had dropped some clue that would guide them. At last, their eyes fell on the thread lying across the snow. They set off at once and followed it."
        - id: ch02-b08
          speaker: narrator
          text: "They traveled on and on through the lonely country. When the thread finally ended, the brothers could tell that one more day's journey would bring them to the Stalos' home. They did not dare walk up to it openly. There were three Stalos, and each had the strength of a giant. Instead, the two Sodnos climbed into a large, bushy tree whose branches hung over a well."
        - id: ch02-b09
          speaker: elder_sodno
          text: "Perhaps they'll send our sister here for water."
        - id: ch02-b10
          speaker: narrator
          text: "They waited until the moon had risen. At last Lyma came. As she lowered her bucket, the leaves above her seemed to whisper her name."
        - id: ch02-b11
          speakers: [elder_sodno, younger_sodno]
          ensemble: duo
          text: "Lyma! Lyma!"
        - id: ch02-b12
          speaker: narrator
          text: "She started and looked up, but she could see nothing. Then the voice came once more."
        - id: ch02-b13
          speaker: elder_sodno
          text: "Be careful. Don't look at us. Fill your buckets and keep listening. We'll tell you how to escape and set the reindeer free."
        - id: ch02-b14
          speaker: narrator
          text: "Lyma bent lower over the well and made herself look busier than ever."
        - id: ch02-b15
          speaker: elder_sodno
          text: "You know a Stalo won't eat food if anything has fallen into it. He gives it to his dogs instead. Wait until the pot has been over the fire for a while and the broth is nearly ready. Then rake the log so ashes fly into the pot. The Stalo will see them and tell you to feed the dogs. Bring the food to us instead. We haven't eaten or drunk for three days. That's all you need to do for now."
        - id: ch02-b16
          speaker: narrator
          text: "Lyma carried the buckets into the house and followed her brothers' instructions. The Sodnos were so hungry that they ate every bit without a word. When the pot was empty, the elder brother spoke again."
        - id: ch02-b17
          speaker: elder_sodno
          text: "Listen closely. After the eldest Stalo cooks another supper and eats it, he'll sleep so deeply that even a witch couldn't wake him. His snoring can be heard a mile away. Go into his room, take off the iron mantle that covers him, and heat it over the fire until it's nearly red. Then come back to us, and we'll tell you what to do next."
        - id: ch02-b18
          speaker: lyma
          text: "Dear brothers, I'll do everything you say."
        - id: ch02-b19
          speaker: narrator
          text: "And she did."
    - id: ch03
      title: The Reindeer at Midnight
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "That same evening, the Stalos had driven some reindeer in from the pasture. They tied the animals against the wall of the house, close at hand to be killed for dinner the next day. From their hiding place, the Sodno brothers saw what the Stalos were doing and exactly where the animals were secured. At midnight, when the whole place had gone still, they crept down from the tree. Then they seized the reindeer by their horns, which were locked together."
        - id: ch03-b02
          speaker: narrator
          text: "The frightened reindeer began to neigh and kick as if they were fighting. The noise grew so loud that it woke the eldest Stalo. That had never happened before. He sat up in bed and called to his youngest brother."
        - id: ch03-b03
          speaker: eldest_stalo
          text: "Go out and pull those reindeer apart, or they'll kill each other."
        - id: ch03-b04
          speaker: narrator
          text: "The youngest Stalo did as he was told and left the house. But the instant he came through the door, one of the Sodnos stabbed him through the heart. He dropped without a groan. The brothers went back to worrying the reindeer. Once again the animals struggled, and their horns made just as much noise as before. For the second time, the eldest Stalo woke from his sleep."
        - id: ch03-b05
          speaker: eldest_stalo
          text: "That boy can't seem to separate them. Go help him, or I'll never get any sleep."
        - id: ch03-b06
          speaker: narrator
          text: "The second Stalo went out to help. The instant he stepped from the house, the elder Sodno struck him dead with his sword. The eldest Stalo remained in bed a little longer. He waited for his brothers to quiet the animals so he could sleep. But the clatter of the reindeer's horns was as bad as ever. At last, he climbed angrily from his bed, muttering to himself."
        - id: ch03-b07
          speaker: eldest_stalo
          text: "How can they still be tangled? No one else can manage it, so I'll have to go myself."
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: "He rubbed his eyes, stood up, and stretched his great arms. His yawn shook the walls. Below, the Sodnos heard it. One took his place at the large door and the other at the small back door, since they did not know which way their enemy would come."
        - id: ch03-b09
          speaker: narrator
          text: "The Stalo reached for the iron mantle that always lay on his bed, but it was not there. He wondered where it could be and who might have moved it. He searched from room to room until he found the mantle hanging over the kitchen fire. It had grown so hot that the first touch burned him badly. He let it go and left it where it was. With no protection and nothing but a stick in his hand, he went out through the back door."
        - id: ch03-b10
          speaker: narrator
          text: "The younger Sodno was waiting. As the Stalo crossed the threshold, the young man struck him on the head. The giant crashed to the ground and never moved again."
        - id: ch03-b11
          speaker: narrator
          text: "The brothers wasted no time over him. They stripped the two younger Stalos and put on their clothes. Then they sat quietly until dawn, when they could learn from the Stalos' mother where the treasure was hidden."
    - id: ch04
      title: The Stalos' Treasure
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "At the first light of sunrise, the younger Sodno went upstairs to the old woman's room. She was already dressed and knitting beside the window. He slipped in quietly, crouched on the floor, and rested his head in her lap. For a while, he said nothing. Then he spoke in a gentle whisper."
        - id: ch04-b02
          speaker: younger_sodno
          text: "Dear Mother, where did my eldest brother hide his riches?"
        - id: ch04-b03
          speaker: stalo_mother
          text: "What a strange thing to ask. Surely you know."
        - id: ch04-b04
          speaker: younger_sodno
          text: "No, I've forgotten. My memory is terrible."
        - id: ch04-b05
          speaker: stalo_mother
          text: "He dug a hole under the doorstep and put everything there."
        - id: ch04-b06
          speaker: narrator
          text: "Silence fell again. After a while, the Sodno asked another question."
        - id: ch04-b07
          speaker: younger_sodno
          text: "And where did my second brother put his money?"
        - id: ch04-b08
          speaker: stalo_mother
          text: "You don't know that either?"
          emotion: surprised
        - id: ch04-b09
          speaker: younger_sodno
          text: "I used to know. But ever since I fell on my head, I can't remember a thing."
        - id: ch04-b10
          speaker: stalo_mother
          text: "It's behind the oven."
        - id: ch04-b11
          speaker: narrator
          text: "Once more, neither spoke for a time. At last, the young man tried again."
        - id: ch04-b12
          speaker: younger_sodno
          text: "Mother, dear Mother, I'm almost afraid to ask. I've grown so stupid lately. Where did I hide my own money?"
        - id: ch04-b13
          speaker: narrator
          text: "At that question, the old woman flew into a rage. She swore that if she could only find a rod, she would use it to bring his memory back. Luckily for the Sodno, there was no rod within her reach. He kept coaxing her, and after a while he brought her back into a better humor. At last, she told him that the youngest Stalo had buried his treasure beneath the very place where she was sitting."
        - id: ch04-b14
          speaker: narrator
          text: "Lyma had entered without being seen and was kneeling before the fire. Now she spoke."
        - id: ch04-b15
          speaker: lyma
          text: "Dear Mother, do you know who you've really been talking to?"
        - id: ch04-b16
          speaker: narrator
          text: "The old woman started, but her answer was quiet."
        - id: ch04-b17
          speaker: stalo_mother
          text: "A Sodno, I suppose?"
        - id: ch04-b18
          speaker: lyma
          text: "That's right. You guessed it."
        - id: ch04-b19
          speaker: narrator
          text: "The mother of the Stalos looked for the iron cane she always used to kill her victims. It was gone. Lyma had put it in the fire."
        - id: ch04-b20
          speaker: stalo_mother
          text: "Where is my iron cane?"
        - id: ch04-b21
          speaker: lyma
          text: "There, in the flames."
        - id: ch04-b22
          speaker: narrator
          text: "The old woman sprang forward and seized it. Her clothes caught fire, and within minutes she had burned to ashes."
        - id: ch04-b23
          speaker: narrator
          text: "The Sodno brothers found all the treasure. They carried it home, along with their sister and the reindeer. From then on, they were the richest men in all Lapland."
