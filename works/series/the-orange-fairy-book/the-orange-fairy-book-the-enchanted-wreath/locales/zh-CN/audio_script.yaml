audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    father:
      display_name: 父亲
      tts:
        delivery: 老实隐忍，话语里常带疲惫
        timbre: 朴厚微哑
        pace: 舒缓
        pitch: 中低
    stepmother:
      display_name: 继母
      tts:
        delivery: 偏私刻薄，算计时假意温和
        timbre: 尖利干涩
        pace: 适中偏快
        pitch: 中高
    princess:
      display_name: 姑娘
      tts:
        delivery: 善良真诚，受苦时坚忍克制
        timbre: 清澈柔和
        pace: 适中
        pitch: 中高
    stepsister:
      display_name: 继母的女儿
      tts:
        delivery: 任性粗鲁，受咒后急躁无奈
        timbre: 粗涩偏尖
        pace: 稍快
        pitch: 中高
    dove_1:
      display_name: 第一只鸽子
      tts:
        delivery: 温和感恩，说话轻巧明快
        timbre: 轻柔清亮
        pace: 适中偏快
        pitch: 高
    dove_2:
      display_name: 第二只鸽子
      tts:
        delivery: 活泼热心，想到主意便十分兴奋
        timbre: 明亮圆润
        pace: 快
        pitch: 高
    dove_3:
      display_name: 第三只鸽子
      tts:
        delivery: 聪敏果断，语气俏皮而坚定
        timbre: 纤细清脆
        pace: 适中偏快
        pitch: 高
    bird_1:
      display_name: 林中鸟甲
      tts:
        delivery: 睡意未消，迷迷糊糊
        timbre: 轻细
        pace: 舒缓
        pitch: 高
    bird_2:
      display_name: 林中鸟乙
      tts:
        delivery: 睡意未消，带着好奇
        timbre: 清脆
        pace: 舒缓
        pitch: 高
    bird_3:
      display_name: 林中鸟丙
      tts:
        delivery: 睡意未消，含混柔软
        timbre: 轻柔
        pace: 舒缓
        pitch: 中高
    prince:
      display_name: 王子
      tts:
        delivery: 真挚果决，焦急时语速加快
        timbre: 清朗坚定
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 雨夜里的三只鸽子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，森林边住着一对夫妻和两个姑娘。一个是男人的女儿，一个是妻子的女儿。男人的女儿善良又美丽，妻子的女儿却相貌丑陋，脾气也坏。可那位母亲一点也看不出来，只觉得自己的女儿举世无双。一天，父亲带着女儿进森林砍柴。父女俩忙了一整天，斧头没有停过。可大雨始终不停，他们越干越冷，回家时早已浑身湿透。父亲进门以后才发现，斧头落在林中的泥水里了。他又懊恼又着急，因为铁斧若在泥里泡上一夜，准会生锈，再也不能用了。
        - id: ch01-b02
          speaker: father
          text: 我的斧头忘在森林里了。让你女儿跑一趟吧，我女儿已经干了一天重活，又湿又累。
        - id: ch01-b03
          speaker: stepmother
          text: 她既然已经淋湿了，更该由她去。她那么壮，几滴雨伤不了她。我的女儿可不一样，出去一定会得重感冒。
        - id: ch01-b04
          speaker: narrator
          text: 这样的争执，父亲经历过太多次。他知道再多说一句也没有用，只能叹着气，叫可怜的女儿返回森林。天黑得看不清路，姑娘走了很久，鞋子一次次陷进泥里。前方既难走，又湿冷难耐，可她很勇敢，从没想过掉头回家。等她终于来到白天砍柴的地方，衣裙已被暗处的荆棘扯破，脸也让树枝划伤了。斧头仍在原处，斧柄上却蹲着三只小鸽子。它们全都垂头丧气，任凭冷雨把羽毛淋透。
        - id: ch01-b05
          speaker: princess
          text: 可怜的小家伙，别在这里挨冻了，快回暖和的窝里去吧。先吃点面包，这是我从午饭里省下的。我要把父亲的斧头带走，不然回去又要挨继母的骂。
        - id: ch01-b06
          speaker: narrator
          text: 她把面包捏成碎屑，一点点撒到地上。鸽子们立刻快活地扑过去，姑娘看着它们吃东西，心里也跟着欢喜起来。随后，她向三只鸽子道别，拿起斧头，赶紧踏上回家的路。等所有面包屑都吃完，鸽子们的精神好了许多。它们终于有力气张开翅膀，飞回高高树梢上的窝里。
        - id: ch01-b07
          speaker: dove_1
          text: 她真好。刚才我虚弱得连翅膀都抬不起来。我们该送她一件礼物，好好谢谢她。
        - id: ch01-b08
          speaker: dove_2
          text: 送她一顶花环吧！只要还戴在她头上，花儿就永远不会凋谢。
        - id: ch01-b09
          speaker: dove_3
          text: 花丛里再住上世间最小的歌鸟，让它们为她歌唱。
        - id: ch01-b10
          speaker: dove_1
          text: 这个主意再好不过了！
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: 三只鸽子刚把话说定，姑娘也正好踏进自家小屋。一顶玫瑰花苞编成的花环忽然出现在她头上，许多小得几乎看不见的鸟儿藏在花间，一同唱起婉转的歌。父亲坐在炉火旁，抬头看见女儿。她的衣服虽然沾满泥水，他却觉得她比任何时候都美。继母和另一个姑娘看着那顶花环，嫉妒得几乎发了狂。
        - id: ch01-b12
          speaker: stepmother
          text: 这么大的雨，还戴着花环四处招摇，真可笑！
        - id: ch01-b13
          speaker: narrator
          text: 继母一把扯下花环，要给自己的女儿戴上。玫瑰马上枯萎发黄，小鸟也飞出了窗口。
        - id: ch01-b14
          speaker: stepmother
          text: 原来是个不中用的破东西！吃完晚饭就去睡觉，都快半夜了。
        - id: ch01-b15
          speaker: narrator
          text: 她嘴上这样说，心里却一心想让女儿也得到同样的花环。
    - id: ch02
      title: 只能说出的那句话
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天傍晚，父亲独自从森林回来，又把斧头落在了那里。继母暗暗欢喜，故意换上一副温和口气。
        - id: ch02-b02
          speaker: stepmother
          text: 你怎么又忘了斧头？这回让你女儿待在家里，我女儿去取。
        - id: ch02-b03
          speaker: narrator
          text: 她给女儿披上斗篷，催她快些出门。那姑娘极不情愿，只得一边走一边抱怨。她的确想要姐姐那样的花环，却不愿为它受一点累。等她来到继父砍柴的地方，已经气得满肚子火。斧头就在眼前，三只鸽子也像昨夜一样蹲在斧柄上。它们垂着脑袋，羽毛又湿又脏，样子十分狼狈。
        - id: ch02-b04
          speaker: stepsister
          text: 你们这些脏东西，立刻滚开！再不走，我就用石头砸你们！
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: 鸽子们吓得飞上最高的树梢，又气得浑身发抖。
        - id: ch02-b06
          speaker: dove_3
          text: 我们从没受过这样的欺负。该怎样报复她？
          emotion: angry
        - id: ch02-b07
          speaker: dove_1
          text: 从来没有。一定得让她尝尝同样的滋味！
          emotion: angry
        - id: ch02-b08
          speaker: dove_2
          text: 有了！从今以后，她一辈子只能说“脏东西”。
        - id: ch02-b09
          speakers: [dove_1, dove_3]
          ensemble: duo
          text: 真聪明！这样最好！
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: 三只鸽子拍着翅膀，高兴得咕咕直叫，惊醒了附近树上的鸟。
        - id: ch02-b11
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: 到底发生什么事了？
        - id: ch02-b12
          speakers: [dove_1, dove_2, dove_3]
          ensemble: chorus
          text: 这是我们的秘密。
        - id: ch02-b13
          speaker: narrator
          text: 姑娘回到家时更加恼火。母亲一听门闩响，马上跑去迎她。
        - id: ch02-b14
          speaker: stepmother
          text: 怎么样？花环拿到了吗？
        - id: ch02-b15
          speaker: stepsister
          text: 脏东西！
        - id: ch02-b16
          speaker: stepmother
          text: 不许这样跟我讲话！你到底是什么意思？
          emotion: angry
        - id: ch02-b17
          speaker: stepsister
          text: 脏东西！
        - id: ch02-b18
          speaker: narrator
          text: 无论母亲再问什么，女儿都只能重复这三个字。继母知道女儿遭了祸，却认定一切都是继女在背后捣鬼。她趁父亲不在，拿起棍子狠狠打那无辜的姑娘，直到姑娘疼得放声尖叫，抽泣着躺上床。她本来已经过得很苦，从此更是苦上十倍。只要父亲转过身，那母女便从早到晚戏弄她、折磨她。三只鸽子重新把花环送回她头上，鲜艳的玫瑰和清脆的歌声，又让那母女的妒火烧得更旺了。
    - id: ch03
      title: 花环里的歌声
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这样的日子又过了几个星期。一天，王子骑马穿过森林，忽然听见一种奇异的鸟鸣。那歌声比他从前听过的任何鸟儿都要甜美。他立刻下马，把缰绳系在一棵树上，循着声音往林中走去。眼前的景象让他十分惊讶。一个美丽的姑娘正在挥斧砍柴，头上戴着粉红玫瑰花苞编成的花环，动人的歌声正从花丛中飘出来。王子站在树木的遮蔽下看了很久，最后才摘下帽子拿在手中，走到姑娘面前。
        - id: ch03-b02
          speaker: prince
          text: 美丽的姑娘，你是谁？是谁送给你这顶会唱歌的玫瑰花环？
        - id: ch03-b03
          speaker: princess
          text: 我住在森林边的小屋里。花环是怎么来的，我也说不清。也许是几只快饿死的鸽子送给我的，我曾经喂过它们。
        - id: ch03-b04
          speaker: narrator
          text: 姑娘从未同王子说过话，回答时脸都红了。王子仔细看去，才发现唱歌的鸟儿小得藏在花间，远看根本瞧不见。他从姑娘的回答里听出一颗善良的心，又早已爱上她的美貌。除非她答应一同回宫，成为自己的新娘，否则王子怎么也不肯离开。老国王原想让儿子迎娶邻国公主，听见这个选择，自然非常失望。可王子从出生起就只照自己的意思行事，谁也没有多说什么。一场盛大的婚宴很快准备好了。
        - id: ch03-b05
          speaker: narrator
          text: 婚后第二天，新娘便派出使者，给父亲送去许多贵重礼物，也把自己的好运告诉他。继母和女儿听见消息，嫉妒得病倒在床。即便她们永远不起身，也不会有人难过，可她们偏偏又好转了。继母一恢复力气，立刻想出一条毒计，要向那个从未伤害过她的姑娘报仇。她从前住过的镇上有个老巫婆，法术比她认识的所有巫婆都高强。她要请巫婆做一副面具，面孔与继女一模一样。有了它，后面的事便容易了。女儿听见这个计划，只能说“脏东西”，却笑着连连点头。
        - id: ch03-b06
          speaker: narrator
          text: 老巫婆拿出魔镜，看见新王妃穿着一身绿绸衣裙，正在宫廷花园中散步。只过了几分钟，她便做出一副与王妃容貌完全相同的面具，几乎没有人能辨出真假。巫婆知道继母打算让自己的女儿戴上它，便叮嘱她们，第一次冒充王妃时最好假装牙疼，再用蕾丝面纱蒙住头脸。继母连声道谢，付给巫婆一大笔钱，把面具藏在斗篷下带回了小屋。
        - id: ch03-b07
          speaker: narrator
          text: 几天后，继母听说宫里安排了一场盛大狩猎。王子会在清晨离开，妻子整天都将独自留在宫中。这样的机会不能错过，她马上带着女儿来到两人从未踏足的王宫。王妃在新家过得太幸福，早已不再记恨从前吃过的苦。她热情招待母女俩，还送给她们许多漂亮东西，让她们带回家去。最后，她领着两人来到海岸，参观王子为她打造的游船。继母终于等到机会。她悄悄绕到王妃身后，趁她站在岩石边，猛地伸手一推。王妃跌进深水，转眼沉到了海底。
        - id: ch03-b08
          speaker: narrator
          text: 继母看着继女沉没，这才转身替自己的女儿系紧面具。她又捡起王妃掉落的天鹅绒斗篷，披到女儿肩上，最后细细整理好蕾丝面纱。从外表看去，岩石边仿佛仍站着刚才那位王妃。
        - id: ch03-b09
          speaker: stepmother
          text: 王子回来以后，你就托着脸，装作牙疼。不论发生什么都别开口。我回去找巫婆，看她能不能解除鸽子的咒。我怎么早没想到这件事！
        - id: ch03-b10
          speaker: narrator
          text: 王子一踏进宫门，便匆匆赶到妻子的房间，看见假王妃躺在长榻上，脸颊托在手中，仿佛正忍受着剧烈的疼痛。
        - id: ch03-b11
          speaker: prince
          text: 你怎么了？哪里不舒服？让我看看你的手。
        - id: ch03-b12
          speaker: narrator
          text: 假王妃猛地抽回手，只指指面颊，含混地嘟囔了一声。
        - id: ch03-b13
          speaker: prince
          text: 是牙疼吗？什么时候开始的？疼得很厉害？要不要让侍女替你敷一敷？
        - id: ch03-b14
          speaker: narrator
          text: 王子一连问了许多问题，问疼痛究竟有多厉害，问是什么时候发作的，又问她还需要什么。假王妃一句也不敢回答，只能对着每个问题摇头。
        - id: ch03-b15
          speaker: prince
          text: 我不能看着你受苦。我去把所有御医都叫来，请他们给你敷上止痛药。
        - id: ch03-b16
          speaker: narrator
          text: 假王妃怕御医识破面具，慌得忘了母亲的警告，也忘了自己身上的咒。她抓住王子的衣服，脱口喊了出来。
        - id: ch03-b17
          speaker: stepsister
          text: 脏东西！
          emotion: fearful
        - id: ch03-b18
          speaker: narrator
          text: 年轻的王子停住脚步，几乎不敢相信自己的耳朵。可他转念一想，疼痛有时的确会叫人脾气暴躁，妻子大概也是如此。他又莫名觉得，她是在求自己别再打扰，只想独自休息，便不再坚持去请御医。
        - id: ch03-b19
          speaker: prince
          text: 那你睡一会儿吧。也许明早醒来，身子就好了。
    - id: ch04
      title: 月光下的身影
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 那晚闷热无风，王子睡不着，起身来到窗前。他忽然看见月光下有个戴玫瑰花环的身影从海里升起，踏上海滩，向王宫张开双臂。
        - id: ch04-b02
          speaker: prince
          text: 她为什么这样像我的妻子？我要走近看看。
        - id: ch04-b03
          speaker: narrator
          text: 他急忙跑向海边，可等他赶到，那个身影已经彻底消失。王子不知道刚才所见是真是假，只能怀疑自己看花了眼。第二天早晨，他又来到妻子的房间。侍女告诉他，王妃既不说话也不起床，送到面前的食物却样样吃光。王子怎么也猜不到原因。假王妃其实一直等母亲回来，好替自己解除鸽子的咒。在母亲回来以前，她又怕开口暴露身份。王子不知道这些，只能决定召见宫中所有御医。他怕事先告诉妻子会让她更加难受，便亲自去请四位专为国王诊病的博学御医。
        - id: ch04-b04
          speaker: narrator
          text: 御医们刚进房间，假王妃便气得忘了身上的咒。
        - id: ch04-b05
          speaker: stepsister
          text: 脏东西！脏东西！
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 四位御医听见这声辱骂，全都气坏了，当场转身离开房间。王子跟在后面百般解释，怎样挽留也没能让他们停步。他只好回来劝妻子，请她捎句话向御医们赔礼，承认自己刚才太过无礼。可假王妃知道说什么都会变成那句咒语，仍然一个字也不肯开口。
        - id: ch04-b07
          speaker: narrator
          text: 深夜，王子终于办完每位王子都逃不开的那些烦人事务。他倚在窗口，让海上吹来的凉风替自己解解乏，脑中却一直想着早晨的事。他开始怀疑，自己是不是不该娶一个出身低微的妻子，无论她有多美。婚后头几天，她明明温柔安静，是那样可爱的伴侣，怎么一夜之间就变成粗鲁阴沉、连为了自己也控制不住脾气的女人？有一点已经很清楚。若她仍不改变，他只能把她赶出宫去。就在这时，海里再次出现那个与妻子极像的身影。她双脚浸在水中，正朝他伸出手臂。
        - id: ch04-b08
          speaker: prince
          text: 等等我！别走！请等一等！
        - id: ch04-b09
          speaker: narrator
          text: 王子不知不觉喊出了声，可等他跑到岸边，那里只有月光下的影子。第二天，邻城举行国家典礼，他天亮就骑马离宫，没有再见妻子。
        - id: ch04-b10
          speaker: prince
          text: 也许明天她会清醒些。若我真要送她回父亲身边，现在不见面反倒更好。
        - id: ch04-b11
          speaker: narrator
          text: 王子把这件事暂时放下，专心完成典礼。回宫时已近午夜，他没有进门，而是先来到海边，藏在一块岩石后面。才刚藏好，那姑娘果然又从海中走出，朝他的窗口张开双臂。王子立刻冲上去，紧紧抓住她的手。姑娘自己也中了魔咒。她受了惊，拼命挣扎着想退回水中，王子却牢牢抓住，任凭她怎样挣脱也不肯松手。
        - id: ch04-b12
          speaker: prince
          text: 你才是我真正的妻子。我绝不会放开你！
        - id: ch04-b13
          speaker: narrator
          text: 话音刚落，他便发现，手里抓着的不再是姑娘，而是一只野兔的脚爪。紧接着，野兔化成一条鱼，鱼变成一只鸟，鸟又变成一条黏滑扭动的蛇。王子的手指几乎不由自主地张开，可他用尽力气，仍旧死死抓住。他腾出另一只手拔剑，挥剑砍下蛇头。魔咒终于破了。真正的王妃恢复成两人初见时的模样，站在他面前。头上的玫瑰花环依旧鲜艳，藏在花间的鸟儿正为重逢欢喜地歌唱。
    - id: ch05
      title: 真正的新娘
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天清早，继母也赶到了王宫。老巫婆交给她一种药膏，只要真正的新娘确已死在海里，把药涂在女儿舌头上，鸽子的咒便会解除。新娘若还活着，药就毫无用处。继母坚称自己亲眼看见继女沉入海底，绝不可能再浮上来。为了万无一失，她又求老巫婆施一道法术困住继女，巫婆也照做了。继母随即连夜赶路，只想尽快回到王宫。她进宫以后，便直奔女儿的房间。
        - id: ch05-b02
          speaker: stepmother
          text: 我拿到解药了！这回一定行！
          emotion: happy
        - id: ch05-b03
          speaker: narrator
          text: 她把药膏涂在女儿舌头上，得意地等着。
        - id: ch05-b04
          speaker: stepmother
          text: 好了，现在你能说什么？
        - id: ch05-b05
          speaker: stepsister
          text: 脏东西！脏东西！
        - id: ch05-b06
          speaker: narrator
          text: 继母绞着双手哭了起来。她终于明白，所有计谋都已失败。就在这时，王子带着真正的妻子走进房间。
        - id: ch05-b07
          speaker: prince
          text: 你们两个都该处死。若由我决定，我绝不会饶你们。可是王妃替你们求情，所以你们能保住性命。你们会被送到一座荒岛，在那里度过余生。
          emotion: angry
        - id: ch05-b08
          speaker: narrator
          text: 一艘船很快准备妥当，恶毒的继母和她的女儿被押了上去。船离开海岸，将她们送往遥远的荒岛。她们会一直留在那里，直到死去。从此，再也没人听到母女俩的消息。王子与妻子长久幸福地生活在一起，两人也把自己的臣民治理得很好。这个故事，是根据索普的《圣诞故事集》改写的。
