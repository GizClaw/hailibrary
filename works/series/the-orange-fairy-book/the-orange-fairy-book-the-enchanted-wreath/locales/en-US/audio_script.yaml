  chapters:
    - id: ch01
      title: The Doves in the Rain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Once upon a time, a man and his wife lived near a forest with two girls. One was his daughter, and the other was hers. The man's daughter was beautiful and good. His wife's daughter was ugly and cross, though her mother thought no girl could be more charming."
        - id: ch01-b02
          speaker: narrator
          text: "One day, the man took his daughter into the forest to cut wood. They worked hard until evening. Rain poured down, and they came home soaked and shivering. Then the man discovered that he had left his axe behind. If it stayed in the mud all night, it would rust and be ruined."
        - id: ch01-b03
          speaker: father
          text: "I dropped my axe in the forest. Please send your daughter to fetch it. Mine has worked hard all day, and she is wet and tired."
        - id: ch01-b04
          speaker: stepmother
          text: "Your daughter is wet already, so she may as well go. She is big and strong. A little more rain will not hurt her. My daughter would catch a dreadful cold."
        - id: ch01-b05
          speaker: narrator
          text: "The man had learned from long experience that arguing with his wife did no good. She would not change her mind, however much he said. So he sighed and told his poor daughter that she must go back into the forest for the axe."
        - id: ch01-b06
          speaker: narrator
          text: "The forest was dark, and the walk took a long time. Her shoes kept sinking into the mud. Brambles tore her dress, and unseen twigs scratched her face. Still, she was brave. She never thought of turning back because the path was hard and unpleasant. At last she reached the place where she and her father had worked. The axe lay just where he had left it. Three little doves sat sadly on its handle."
        - id: ch01-b07
          speaker: princess
          text: "You poor little things. Why are you sitting out here in the rain? Fly home to your nest, where it is warm. First, have the bread I saved from dinner. It may cheer you up. You are sitting on my father's axe, and I must hurry it home or my stepmother will scold me terribly."
        - id: ch01-b08
          speaker: narrator
          text: "She gently stroked the three wet doves. Then she took out the bread she had saved, crumbled it onto the ground, and watched them flutter toward it. Seeing them grow cheerful over the food pleased her."
        - id: ch01-b09
          speaker: princess
          text: "Good-bye, little doves."
        - id: ch01-b10
          speaker: narrator
          text: "She picked up the axe and set off toward home as quickly as the muddy path allowed. The doves stayed until they had eaten every crumb. By then they felt much stronger, and they were able to spread their wings and fly back to their nest high in the top of a tree."
        - id: ch01-b11
          speaker: dove_1
          text: "She is a good girl. I was too weak to lift a wing before she came. I wish we could thank her somehow."
        - id: ch01-b12
          speaker: dove_2
          text: "Then let us give her a wreath of flowers. As long as she wears it, the flowers will never fade."
        - id: ch01-b13
          speaker: dove_3
          text: "And we can place the tiniest singing birds in the world among the flowers."
        - id: ch01-b14
          speaker: dove_1
          text: "Yes. That will be beautiful."
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: "The moment the girl entered the cottage, a wreath of rosebuds appeared on her head. Hidden among the flowers, a crowd of tiny birds began to sing. Her father sat by the fire. Even in her muddy clothes, he had never seen her look so lovely. But her stepmother and stepsister burned with envy."
        - id: ch01-b16
          speaker: stepmother
          text: "How ridiculous, dressing yourself up on a night like this!"
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: "She tore the wreath from the girl's head and put it on her own daughter. At once, the roses turned brown and withered, and the little birds flew out through the window."
        - id: ch01-b18
          speaker: stepmother
          text: "Look at that worthless thing! Now eat your supper and go to bed. It is almost midnight."
        - id: ch01-b19
          speaker: narrator
          text: "She pretended the wreath was worthless, but she longed for her own daughter to have one just like it."
    - id: ch02
      title: The Doves' Answer
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The next evening, the father came home from the forest without his axe again. This time, he had been working alone. The stepmother was delighted."
        - id: ch02-b02
          speaker: stepmother
          text: "Why, you careless man, you forgot your axe again! Tonight your daughter may stay home. Mine will fetch it."
        - id: ch02-b03
          speaker: narrator
          text: "She threw a cloak over her daughter's shoulders and ordered her to hurry into the forest. The girl set out with very bad grace. She grumbled to herself at every step. She wanted a lovely wreath of her own, but she did not want any of the trouble that might be needed to get one. By the time she reached the place where her stepfather had cut wood, her temper was worse than ever. The axe was there, and the same three little doves sat on its handle. Their heads drooped, and their wet feathers were dirty and bedraggled."
        - id: ch02-b04
          speaker: stepsister
          text: "Get away, you dirty creatures, or I will throw stones at you!"
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: "The frightened doves flew to the very top of a tree. Their bodies shook with anger."
        - id: ch02-b06
          speaker: dove_3
          text: "How shall we punish her? No one has ever treated us like that before."
          emotion: angry
        - id: ch02-b07
          speaker: dove_1
          text: "Never. We must repay her in the same spirit."
          emotion: angry
        - id: ch02-b08
          speaker: dove_2
          text: "I know what to do. For the rest of her life, she will never be able to say anything except, 'Dirty creatures.'"
        - id: ch02-b09
          speakers: [dove_1, dove_3]
          ensemble: duo
          text: "How clever! That will work beautifully."
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: "They flapped and clucked so loudly with delight that they woke every bird in the nearby trees."
        - id: ch02-b11
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: "What in the world is happening?"
          emotion: surprised
        - id: ch02-b12
          speakers: [dove_1, dove_2, dove_3]
          ensemble: chorus
          text: "That is our secret."
        - id: ch02-b13
          speaker: narrator
          text: "Meanwhile, the girl reached home crosser than ever. Her mother heard the latch lift and ran to meet her."
        - id: ch02-b14
          speaker: stepmother
          text: "Well? Did you get the wreath?"
        - id: ch02-b15
          speaker: stepsister
          text: "Dirty creatures!"
        - id: ch02-b16
          speaker: stepmother
          text: "Do not speak to me that way! What do you mean?"
          emotion: angry
        - id: ch02-b17
          speaker: stepsister
          text: "Dirty creatures!"
        - id: ch02-b18
          speaker: narrator
          text: "Those were the only words she could say. Her mother saw that something evil had happened and flew into a rage against her stepdaughter."
        - id: ch02-b19
          speaker: stepmother
          text: "You did this. I know you did!"
          emotion: angry
        - id: ch02-b20
          speaker: narrator
          text: "The father was away, so there was no one to protect the innocent girl. The woman seized a stick and beat her until she screamed with pain. At last the poor girl escaped to bed, where she lay sobbing. Her life had been miserable before, but from that night it became ten times worse. The moment her father's back was turned, her stepmother and stepsister teased and tormented her from morning until night. The doves placed the unfading wreath on her head once more, and every glimpse of it made the other two even more furious."
    - id: ch03
      title: The Prince in the Forest
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Several weeks passed. One day, the king's son rode through the forest and heard strange birds singing more sweetly than any birds he had ever known. He tied his horse to a tree and followed the music. There before him was a beautiful girl chopping wood. A wreath of pink rosebuds rested on her head, and the singing came from inside it."
        - id: ch03-b02
          speaker: narrator
          text: "The prince stood beneath a tree and watched for a long time. Then he took off his hat, stepped forward, and spoke to her."
        - id: ch03-b03
          speaker: prince
          text: "Fair maiden, who are you? And who gave you that wreath of singing roses?"
        - id: ch03-b04
          speaker: narrator
          text: "The birds were so tiny that no one could see them without looking closely. The girl blushed, for she had never spoken to a prince before."
        - id: ch03-b05
          speaker: princess
          text: "I live in a hut at the edge of the forest. I do not truly know where the wreath came from. Perhaps it was a gift from three doves I fed when they were starving."
        - id: ch03-b06
          speaker: narrator
          text: "The prince was delighted by her answer, because it showed him how good her heart was. He had already fallen in love with her beauty. Now he would not be satisfied until she promised to go with him to the palace and become his bride. The old king was disappointed when he heard whom his son meant to marry. He had wanted the young man to choose a princess from a neighboring country. Yet the prince had done exactly as he pleased from the day he was born. No one dared object, and preparations began for a splendid wedding feast."
        - id: ch03-b07
          speaker: narrator
          text: "On the day after her wedding, the bride sent a messenger to her father. The messenger carried handsome presents and told him about the wonderful fortune that had come to his daughter. The stepmother and stepsister were filled with such bitter envy that they became ill and had to take to their beds. No one would have been sorry if they had never risen again, but that was not what happened. Little by little, they began to feel better. Then the mother invented a plan to take revenge on the girl, though the girl had never done her any harm."
        - id: ch03-b08
          speaker: narrator
          text: "In the town where the woman had once lived, there was an old witch with greater magical skill than any other witch she knew. She decided to ask this witch for a mask bearing her stepdaughter's face. Once she had that, she believed the rest would be easy. She explained the plan to her daughter. The girl could answer only with her two enchanted words, but she nodded, smiled, and looked pleased."
        - id: ch03-b09
          speaker: stepsister
          text: "Dirty creatures!"
        - id: ch03-b10
          speaker: narrator
          text: "Everything happened just as the woman hoped. The old witch looked into her magic mirror and saw the new princess walking through the palace gardens in a green silk dress. The mirror showed her the young woman's face clearly. Within a few minutes, the witch had made a mask in that exact likeness. It was so like the princess that only a very few people would have been able to tell the two faces apart."
        - id: ch03-b11
          speaker: witch
          text: "When your daughter wears the mask, have her pretend she has a toothache. She should cover her head with a lace veil."
        - id: ch03-b12
          speaker: narrator
          text: "The stepmother thanked the witch, paid her well, and carried the mask home beneath her cloak."
    - id: ch04
      title: The False Bride
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "A few days later, the stepmother learned that a great hunt was planned. The prince would leave the palace early, and his wife would be alone all day. She could not miss such a chance. She took her daughter to the palace, where neither of them had ever been before."
        - id: ch04-b02
          speaker: narrator
          text: "The princess was so happy in her new home that she no longer remembered all she had suffered in the old one. She welcomed her stepmother and stepsister gladly, never suspecting why they had come. She showed them kindness and gave them many beautiful things to carry home. At last, she led them down to the shore. She wanted them to see a pleasure boat that her husband had ordered specially for her."
        - id: ch04-b03
          speaker: narrator
          text: "When the princess stood on a rock above the deep water, the stepmother saw her chance. She crept softly up behind the girl and gave her a sudden push. The princess fell from the rock into the sea and sank straight to the bottom. The woman lost no time. She fastened the magic mask over her own daughter's face, wrapped her in a velvet cloak that the princess had let fall, and carefully arranged the lace veil over her head."
        - id: ch04-b04
          speaker: stepmother
          text: "When the prince returns, hold your cheek as if it hurts. Above all, do not speak. I am going back to the witch. Perhaps she can remove the spell those horrible birds put on you. Why did I not think of that sooner?"
        - id: ch04-b05
          speaker: narrator
          text: "As soon as the prince returned, he hurried to his wife's rooms. The false bride lay on a sofa and seemed to be in terrible pain."
        - id: ch04-b06
          speaker: prince
          text: "My dearest wife, what has happened?"
        - id: ch04-b07
          speaker: narrator
          text: "He knelt beside her and reached for her hand, but she pulled it away. She pointed to her cheek and muttered something he could not hear."
        - id: ch04-b08
          speaker: prince
          text: "What is wrong? Is the pain very bad? When did it start? Shall I call your ladies to bathe your cheek?"
        - id: ch04-b09
          speaker: narrator
          text: "He asked question after question. The girl answered each one by shaking her head."
        - id: ch04-b10
          speaker: prince
          text: "I cannot leave you suffering like this. I will call every physician at court and have them put soothing medicine on the sore place."
        - id: ch04-b11
          speaker: narrator
          text: "He sprang up to fetch them. The false bride knew the physicians would discover the trick as soon as they came near her. Fear made her forget both her mother's warning and the doves' spell. She caught the prince by his tunic and pleaded with him."
        - id: ch04-b12
          speaker: stepsister
          text: "Dirty creatures!"
          emotion: fearful
        - id: ch04-b13
          speaker: narrator
          text: "The prince stopped in disbelief. Then he decided the pain must have made his wife cross. He guessed that she wanted to be alone."
        - id: ch04-b14
          speaker: prince
          text: "Perhaps you can sleep. If you do, I hope you will feel better tomorrow."
        - id: ch04-b15
          speaker: narrator
          text: "That night was hot and airless. The prince tried to rest, but at last he rose and went to the window. In the moonlight, a figure with a wreath of roses rose from the sea below. She stepped onto the sand and reached both arms toward the palace."
        - id: ch04-b16
          speaker: prince
          text: "That maiden looks strangely like my wife. I must see her more closely."
        - id: ch04-b17
          speaker: narrator
          text: "He hurried down to the water. But by the time he reached it, the princess had vanished. He began to wonder whether his eyes had deceived him."
    - id: ch05
      title: The Figure from the Sea
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "The next morning, the prince went to the false bride's room. Her ladies told him that she would neither speak nor get out of bed, although she ate everything they set before her. The prince was deeply puzzled and could not imagine what was wrong. Of course, he could not know what she was waiting for. She expected her mother to return at any moment with a way to remove the doves' spell. Until then, she was afraid that if she spoke, her two enchanted words would betray her."
        - id: ch05-b02
          speaker: narrator
          text: "At last, he decided to call the court physicians without warning her. He personally asked the four learned doctors who served the king to follow him to the princess's room. The moment they entered, the false bride flew into a rage. She forgot the spell again and shrieked at them."
        - id: ch05-b03
          speaker: stepsister
          text: "Dirty creatures! Dirty creatures!"
          emotion: angry
        - id: ch05-b04
          speaker: narrator
          text: "The four physicians believed she had called them dirty creatures. They were so deeply offended that they turned around and left the room at once. The prince hurried after them and tried every argument he could think of, but nothing would persuade them to stay. Then he asked his wife to send a message saying she was sorry for her rudeness. She would not answer him with a single word."
        - id: ch05-b05
          speaker: narrator
          text: "Late that evening, the prince finished the tiresome duties that came with his rank. He leaned from his window and enjoyed the cool wind from the sea. His thoughts returned to the morning. Had he made a terrible mistake by marrying a girl of humble birth, however beautiful she was? The quiet, gentle companion of his first married days had suddenly become rude and sulky. She could not even control her temper when her own health was at stake. If she did not change soon, he would have to send her away from court."
        - id: ch05-b06
          speaker: narrator
          text: "As he thought, he looked down at the sea. The figure who resembled his wife stood there again, her feet in the water and her arms reaching toward him."
        - id: ch05-b07
          speaker: prince
          text: "Wait for me! Please, wait for me!"
        - id: ch05-b08
          speaker: narrator
          text: "The words escaped him before he knew he was speaking. He raced to the shore, but found nothing there except shadows in the moonlight."
        - id: ch05-b09
          speaker: narrator
          text: "At daybreak, a state ceremony called him to a distant city. He rode away without seeing his wife again."
        - id: ch05-b10
          speaker: prince
          text: "Perhaps she will come to her senses by tomorrow. If I must send her back to her father, it may be better if we do not meet before then."
        - id: ch05-b11
          speaker: narrator
          text: "He forced the troubling matter from his mind and kept his thoughts on the ceremony before him. It was nearly midnight when he finally returned to the palace. This time, he did not go inside. He walked straight down to the shore and hid himself behind a rock to wait. He had scarcely settled there when the mysterious girl rose from the sea. Once again, she stretched out both arms toward his window. In an instant, the prince leaped from his hiding place and seized her hand."
        - id: ch05-b12
          speaker: narrator
          text: "She struggled in terror to reach the water, because a spell had been laid upon her too. But he held her firmly."
        - id: ch05-b13
          speaker: prince
          text: "You are truly my wife, and I will never let you go."
        - id: ch05-b14
          speaker: narrator
          text: "Before he finished speaking, the hand in his grasp became a hare's paw. The hare changed into a fish. The fish became a bird, and the bird turned into a slippery, writhing snake. The prince's fingers nearly opened by themselves. With a great effort, he kept his grip. He drew his sword and cut off the snake's head."
        - id: ch05-b15
          speaker: narrator
          text: "At once, the spell was broken. The snake vanished, and his real wife stood before him. She looked exactly as she had on the day he first saw her in the forest. The enchanted wreath rested on her head, and the tiny birds among its flowers sang out for joy."
    - id: ch06
      title: The Broken Scheme
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "The very next morning, the stepmother reached the palace. The witch had given her an ointment to place on her daughter's tongue. It would break the doves' spell only if the true bride had drowned. If the princess still lived, it would do nothing."
        - id: ch06-b02
          speaker: narrator
          text: "The stepmother had assured the witch that she had seen her stepdaughter sink beneath the sea. There could be no danger, she said, of the princess ever coming up again. Even so, she wanted to make everything quite safe, so she asked the old woman to cast another spell on the girl. The witch agreed. Afterward, the stepmother traveled through the entire night so that she could reach the palace as soon as possible. The moment she arrived, she made her way straight into her daughter's room."
        - id: ch06-b03
          speaker: stepmother
          text: "I have it! I have it!"
          emotion: happy
        - id: ch06-b04
          speaker: narrator
          text: "She triumphantly spread the ointment on her daughter's tongue."
        - id: ch06-b05
          speaker: stepmother
          text: "Now, what can you say?"
        - id: ch06-b06
          speaker: stepsister
          text: "Dirty creatures! Dirty creatures!"
        - id: ch06-b07
          speaker: narrator
          text: "The mother wrung her hands and wept. She knew every part of her plan had failed. At that moment, the prince entered with his true wife."
        - id: ch06-b08
          speaker: prince
          text: "You both deserve to die, and if the choice were mine, that would be your punishment. But the princess begged me to spare you. You will be placed on a ship and carried to a desert island. There you will remain for the rest of your lives."
          emotion: angry
        - id: ch06-b09
          speaker: narrator
          text: "The prince's order was carried out. A ship was made ready, and the wicked woman and her daughter were placed aboard it. The vessel sailed away toward the desert island where they were to remain. It passed out of sight, and no one ever heard anything of either woman again."
        - id: ch06-b10
          speaker: narrator
          text: "The prince and his wife lived together for many happy years, and they ruled their people well."
        - id: ch06-b11
          speaker: narrator
          text: "This story was adapted from Thorpe's Yule-Tide Stories."
