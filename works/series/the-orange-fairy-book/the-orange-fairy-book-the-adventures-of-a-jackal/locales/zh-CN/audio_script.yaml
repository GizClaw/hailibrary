audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    jackal:
      display_name: 豺
      tts:
        delivery: 狡黠自信，得意时轻快，受质疑时固执
        timbre: 灵活清亮
        pace: 稍快
        pitch: 中高
    hedgehog:
      display_name: 刺猬
      tts:
        delivery: 谨慎机敏，说话朴实直接
        timbre: 温和细亮
        pace: 适中
        pitch: 中
    panther:
      display_name: 黑豹
      tts:
        delivery: 彬彬有礼却容易轻信，发怒时低沉有力
        timbre: 浑厚宽阔
        pace: 适中
        pitch: 低
    partridge:
      display_name: 小鹧鸪
      tts:
        delivery: 热心善良，语气轻柔而爽快
        timbre: 清脆明亮
        pace: 轻快
        pitch: 高
    old_man:
      display_name: 老人
      tts:
        delivery: 阅历丰富，出主意时从容笃定
        timbre: 苍老温厚
        pace: 舒缓
        pitch: 低
    shepherd:
      display_name: 牧羊人
      tts:
        delivery: 表面随和，暗中精明，答话不紧不慢
        timbre: 粗朴沉稳
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 谷仓与牛皮鞋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一个野兽遍地的地方。那里住着一只豺和一只刺猬。它们模样不同，性情也不同，却成了极要好的朋友，总爱结伴出门。
        - id: ch01-b02
          speaker: narrator
          text: 一天下午，它们沿着大路散步。个子较高的豺远远看见一座谷仓，忽然叫了起来。
        - id: ch01-b03
          speaker: jackal
          text: 哎，那座谷仓里全是粮食！咱们进去吃一点吧。
        - id: ch01-b04
          speaker: hedgehog
          text: 好啊，快走！
        - id: ch01-b05
          speaker: narrator
          text: 两个伙伴溜进谷仓，一直吃到肚子再也装不下。为了不出声，豺进去前脱掉了鞋。这时他重新穿好鞋，和刺猬回到大路上。
        - id: ch01-b06
          speaker: narrator
          text: 走了一程，它们遇到一只黑豹。黑豹停下脚步，客客气气地鞠了一躬。
        - id: ch01-b07
          speaker: panther
          text: 对不住，冒昧打扰一下。你这双鞋真漂亮，我越看越喜欢。能告诉我是谁做的吗？
        - id: ch01-b08
          speaker: jackal
          text: 我也觉得挺漂亮。实话告诉你吧，是我亲手做的。
        - id: ch01-b09
          speaker: panther
          text: 那你能给我也做一双吗？
        - id: ch01-b10
          speaker: jackal
          text: 我当然可以试试。不过，你得替我杀一头牛。等咱们吃完牛肉，我就拿那张牛皮给你做鞋。
        - id: ch01-b11
          speaker: narrator
          text: 黑豹在附近四处潜行，终于看见一头肥壮的牛离开牛群，独自在一旁吃草。他立刻把牛咬死，高声叫来豺和刺猬。它们很快剥下牛皮，摊开来晒干，接着痛痛快快地吃了一顿。吃饱以后，三个伙伴蜷起身子，安稳地睡了一夜。
        - id: ch01-b12
          speaker: narrator
          text: 第二天一早，豺动手做鞋，黑豹满心欢喜地坐在旁边看。鞋做好以后，豺站起来伸了个懒腰。
        - id: ch01-b13
          speaker: jackal
          text: 把鞋拿到那边晒太阳吧。两个钟头以后才能穿，早一刻穿上都会难受。太阳已经这么高了，我和朋友也该继续赶路啦。
        - id: ch01-b14
          speaker: narrator
          text: 黑豹向来别人说什么就信什么，所以完全照豺的吩咐去做。他把鞋晒了整整两个钟头，才往脚上系。那双鞋衬得他的爪子格外神气，他伸直两条前腿，得意地看了又看。可等他站起来迈步，事情就完全不同了。鞋子又僵又硬，每走一步都疼得他几乎叫出声。最后，他瘫坐在原地，竟然呜呜地哭了起来。
        - id: ch01-b15
          speaker: narrator
          text: 几只小鹧鸪听见他的呻吟，蹦跳着过来查看。黑豹从没想过拿它们当晚餐，彼此一直很友好。一只鹧鸪扑扇着翅膀靠近他。
        - id: ch01-b16
          speaker: partridge
          text: 你疼得很厉害吧？我们能帮上忙吗？
        - id: ch01-b17
          speaker: panther
          text: 都怪那只豺！他做的鞋又硬又紧，把我的脚勒得生疼，我怎么踢也踢不下来。
        - id: ch01-b18
          speaker: partridge
          text: 你躺好别动，我们来把鞋泡软。
        - id: ch01-b19
          speaker: narrator
          text: 小鹧鸪叫来兄弟们，一同飞到最近的泉边。它们用嘴衔水，一趟趟浇在鞋上。坚硬的牛皮渐渐软了，黑豹总算抽出了四只脚。
        - id: ch01-b20
          speaker: panther
          text: 谢谢，太谢谢你们了！我简直像换了个身子。现在我要追上那只豺，跟他好好算账！
          emotion: happy
        - id: ch01-b21
          speaker: narrator
          text: 黑豹一跃而起，奔进树林。
    - id: ch02
      title: 黑豹的两条计策
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 豺早有防备。他一会儿往前跑，一会儿倒着走，又在林中绕进绕出，把足迹搅得乱七八糟，谁也辨不出他究竟往哪边逃了。黑豹追了很久，总算看见了仇敌。就在同一刻，豺也发现了他。黑豹大吼一声，猛扑过去，豺却抢先钻进浓密的灌木。黑豹身子太大，怎么也跟不进去，只能停在外面。
        - id: ch02-b02
          speaker: narrator
          text: 黑豹失手以后，比先前更加恼火。他趴下来盘算下一步，正好有一位老人从路上经过。
        - id: ch02-b03
          speaker: panther
          text: 老伯，快教教我！那只豺这样害我，我怎样才能叫他付出代价？
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: 黑豹把经过一五一十地说给老人听。
        - id: ch02-b05
          speaker: old_man
          text: 你若肯听我的，就杀一头牛，把林子里所有的豺都请来吃席。它们吃肉时，你仔细看。别的豺都会盯着食物，只有害你的那只，心里有鬼，会偷偷看你。
        - id: ch02-b06
          speaker: narrator
          text: 黑豹一向有礼貌，认真谢过老人，便依照他的办法杀了一头牛。鹧鸪们飞遍树林，向豺群传递邀请。许许多多的豺赶来赴宴，那个使坏的家伙也混在其中。可是黑豹从前只见过他一面，放眼望去，还是没法从别的豺中把他认出来。
        - id: ch02-b07
          speaker: narrator
          text: 死牛横架在一棵倒下的树的枝杈间，四周摆着一圈木座。豺群各自坐好，开始享用大餐。每只豺都贪婪地盯着面前那块肉，只有一只坐立不安，隔一会儿便朝主人偷瞧一眼。黑豹把这一切看在眼里，冷不防纵身扑去，一把抓住了他的尾巴。
        - id: ch02-b08
          speaker: narrator
          text: 可豺还是比他快。豺抄起一把刀，割断被黑豹抓住的尾巴，转身冲进森林。席上其余的豺也全跟着跑了。黑豹还没从这变故中回过神来，四周已经空空荡荡，只剩他孤零零一个。
        - id: ch02-b09
          speaker: narrator
          text: 老人不久回来查看结果。
        - id: ch02-b10
          speaker: panther
          text: 这下我又该怎么办？
        - id: ch02-b11
          speaker: old_man
          text: 的确不走运。不过，我想我知道他在哪儿。离这里两英里左右有座甜瓜园，豺都爱吃甜瓜，它们多半去了那里。你只管找没有尾巴的那一只。
        - id: ch02-b12
          speaker: narrator
          text: 黑豹又道了谢，便朝甜瓜园出发。可是豺早猜到老人会给仇敌出什么主意。他的同伴们正在园子里阳光最足的角落，贪婪地大吃最熟的甜瓜，谁也没有留意身后。豺悄悄绕过去，把那些尾巴一条条系在了一起。
        - id: ch02-b13
          speaker: narrator
          text: 他刚刚系完，便听见树枝折断的声音。
        - id: ch02-b14
          speaker: jackal
          text: 快跑！园主人来啦！
        - id: ch02-b15
          speaker: narrator
          text: 豺群猛地跳起，向四面八方奔逃，尾巴全都扯断，留在原地。现在每只豺都没有尾巴，黑豹哪里还分得出仇敌？
        - id: ch02-b16
          speaker: panther
          text: 它们没有一只有尾巴。我已经追累了，再也不管它们啦。还是去捉点东西当晚饭吧。
          emotion: sad
    - id: ch03
      title: 牧羊人的买卖
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这些追逐和计策，刺猬当然一样也没能参加。等所有危险都过去以后，豺才出门寻找朋友。幸好他很快便找到了，刺猬正安安稳稳地待在家里。
        - id: ch03-b02
          speaker: jackal
          text: 哈，你在这儿！上次分手以后，我把尾巴弄丢了，别的家伙也丢了。不过，这没什么。我肚子饿了，那边坐着一个牧羊人。咱们去请他卖只羊吧。
        - id: ch03-b03
          speaker: hedgehog
          text: 好，这主意不错。
        - id: ch03-b04
          speaker: narrator
          text: 刺猬迈开小短腿，尽量跟上豺。来到牧羊人面前，豺从前腿下面掏出钱袋，谈好了一桩买卖。
        - id: ch03-b05
          speaker: shepherd
          text: 你们等到明天，我就把你们见过的最大的一只羊交出来。那只羊总爱离开羊群，到远处吃草。我现在去捉，可得花不少时间。
        - id: ch03-b06
          speaker: jackal
          text: 真麻烦。好吧，看来只能等到明天了。
        - id: ch03-b07
          speaker: narrator
          text: 豺和刺猬四下寻找，找到一处干燥舒服的洞穴，准备在那里过夜。等它们走远，牧羊人杀掉自己的一只羊，剥下整张羊皮。他把羊皮严严实实地缝在随身的猎犬身上，又拿绳子套住猎犬的脖子。做完这些，他才躺下来睡觉。
        - id: ch03-b08
          speaker: narrator
          text: 第二天，太阳还没升好，豺和刺猬就来到牧羊人身边，扯他的斗篷。
        - id: ch03-b09
          speakers: [jackal, hedgehog]
          ensemble: duo
          text: 快醒醒，把那只羊交给我们吧！我们整夜没吃东西，肚子都饿坏了。
        - id: ch03-b10
          speaker: narrator
          text: 牧羊人打个哈欠，揉了揉眼睛。
        - id: ch03-b11
          speaker: shepherd
          text: 它就拴在那棵树上，你们自己牵走吧。
        - id: ch03-b12
          speaker: narrator
          text: 它们走到树下，解开绳子，拖着披了羊皮的猎犬往昨夜的洞穴走。到了洞口，豺说要先看看这只羊是肥是瘦。他往后退开几步，好看得更清楚，又歪着脑袋，把那头牲口仔细端详了一两分钟，最后郑重地点了点头。
        - id: ch03-b13
          speaker: jackal
          text: 先让我看看他是肥是瘦。嗯，够肥，是只好羊。
        - id: ch03-b14
          speaker: narrator
          text: 刺猬有时显出的聪明，任谁也想不到。
        - id: ch03-b15
          speaker: hedgehog
          text: 朋友，你这话可糊涂。外面的毛确实是羊毛，可我猎犬叔叔的爪子都从下面露出来啦。
        - id: ch03-b16
          speaker: jackal
          text: 他就是一只羊。
        - id: ch03-b17
          speaker: narrator
          text: 豺最不肯承认别人比自己聪明。
        - id: ch03-b18
          speaker: hedgehog
          text: 那你牵住绳子，让我再仔细看看。
        - id: ch03-b19
          speaker: narrator
          text: 豺很不情愿地攥住绳子。刺猬绕着猎犬慢慢走了一圈，又回到他身旁。那双爪子和那条尾巴已经说明了一切。牧羊人卖给它们的不是羊，而是一条猎犬。刺猬猜不到接下来会发生什么，决定赶快躲开。
        - id: ch03-b20
          speaker: hedgehog
          text: 对，你说得没错。不过我不先喝水，什么也吃不下。我去树林边的泉眼喝几口，回来就吃早饭。
        - id: ch03-b21
          speaker: jackal
          text: 那你可别去太久！
        - id: ch03-b22
          speaker: narrator
          text: 刺猬用最快的速度跑开，豺伏在一块岩石下等他。一个多钟头过去，哪怕到泉边打个来回，刺猬也早该回来了，可还是不见影子。那当然啦，他正藏在一棵树下的深草丛里呢！
    - id: ch04
      title: 猎犬露出真面目
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 豺终于明白，朋友不知为什么逃走了。他不愿再等这顿早饭，便走到猎犬拴过的地方，解开绳子。
        - id: ch04-b02
          speaker: narrator
          text: 豺走到猎犬跟前，刚刚解开绳子，正准备跳上他的背，照准要害狠狠咬下去，耳边忽然响起一声低吼。羊的喉咙里，绝不会发出这种声音。
        - id: ch04-b03
          speaker: narrator
          text: 豺丢下绳子，像闪电一样拔腿逃跑，飞奔过开阔的平原。他的腿已经很长，可猎犬的腿比他的更长，没过多久便赶上了猎物。豺只好回身迎战，却根本不是猎犬的对手。
        - id: ch04-b04
          speaker: narrator
          text: 几分钟后，豺已经一动不动地躺在地上。猎犬不慌不忙地转过身，小跑着回牧羊人身边去了。
