  chapters:
    - id: ch01
      title: The Panther's Shoes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "In a land full of wild beasts, a jackal and a hedgehog became great friends, different though they were. The two were often seen together. One afternoon, they were walking along a road when the taller of the pair, the jackal, spotted a barn full of corn."
        - id: ch01-b02
          speaker: jackal
          text: "Oh, look at all that corn! Let's go in and eat some."
        - id: ch01-b03
          speaker: hedgehog
          text: "Yes, let's!"
        - id: ch01-b04
          speaker: narrator
          text: "They went into the barn and ate until they could manage no more. The jackal had taken off his shoes so he could move without a sound. He put them on again, and the friends returned to the high road. Before long, they met a panther. He stopped and gave them a polite bow."
        - id: ch01-b05
          speaker: panther
          text: "Excuse me for asking, but those shoes are splendid. Who made them for you?"
        - id: ch01-b06
          speaker: jackal
          text: "They are rather fine, aren't they? I made them myself."
        - id: ch01-b07
          speaker: panther
          text: "Would you make a pair like that for me?"
        - id: ch01-b08
          speaker: jackal
          text: "I'll do my best. First you must kill a cow. Once we've eaten the meat, I'll use the hide to make your shoes."
        - id: ch01-b09
          speaker: narrator
          text: "The panther prowled around until he found a fine cow grazing away from the herd. He killed it at once, then called the jackal and hedgehog over. Together they skinned the cow and spread the hide out to dry. After a grand feast, they curled up for the night and slept soundly. Early the next morning, the jackal began making the shoes. The panther sat beside him, watching with delight. At last, the work was done, and the jackal stood and stretched."
        - id: ch01-b10
          speaker: jackal
          text: "Set them out there in the sun. In two hours they'll be ready. Don't put them on any sooner, or they'll be terribly uncomfortable. The sun is already high, so my friend and I must continue our journey."
        - id: ch01-b11
          speaker: narrator
          text: "The panther always believed what people told him. He did exactly as the jackal had said and laid the shoes in the sun. Two hours later, he began fastening them onto his paws. They certainly showed off his paws beautifully. He stretched out his forelegs and gazed at them with pride. Then he tried to walk, and that was quite another matter. The shoes were so stiff and hard that every step nearly made him shriek. At last, he sank down right where he was and began to cry."
    - id: ch02
      title: The Panther Gives Chase
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "After a while, some little partridges heard the poor panther groaning and hopped over to see what was wrong. He had never tried to eat them, so they had always been friendly with him. One partridge fluttered close."
        - id: ch02-b02
          speaker: partridge
          text: "You look as if you're in pain. Is there anything we can do?"
        - id: ch02-b03
          speaker: panther
          text: "It was that jackal! He made these shoes, and they're so hard and tight that my feet are aching. I can't even kick them off."
        - id: ch02-b04
          speaker: partridge
          text: "Keep still. We'll make them soft for you."
        - id: ch02-b05
          speaker: narrator
          text: "The kind little partridge called his brothers. They all flew to the nearest spring, carried water back in their beaks, and poured it over the shoes. They kept making the journey until the hard leather grew soft and the panther could slip his paws free."
        - id: ch02-b06
          speaker: panther
          text: "Thank you! Oh, thank you! I feel like a different creature. Now I'm going after that jackal, and I'll make him pay for this."
          emotion: happy
        - id: ch02-b07
          speaker: narrator
          text: "He skipped around for joy, then bounded into the forest. But the cunning jackal had trotted backward and forward, then in and out, making it very hard to tell which track he had truly followed. At last, the panther caught sight of his enemy. At that very moment, the jackal caught sight of him too. The panther gave a loud roar and sprang forward. The jackal was quicker. He plunged into a dense thicket where the panther could not follow. Disgusted by his failure and angrier than ever, the panther lay down for a while to consider what he should do next. As he was thinking, an old man came along."
        - id: ch02-b08
          speaker: panther
          text: "Father, please tell me how to repay the jackal for what he did to me!"
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: "Without waiting, the panther told the old man the whole story."
        - id: ch02-b10
          speaker: old_man
          text: "Take my advice. Kill a cow and invite every jackal in the forest to the feast. Watch them while they eat. Most will stare at their food, but the traitor will keep glancing at you. That's how you'll know him."
        - id: ch02-b11
          speaker: narrator
          text: "The well-mannered panther thanked the old man and followed his advice. He killed a cow, and the partridges flew through the forest inviting the jackals. A great many came, including the wicked one. The panther had seen him only once and could not pick him out. All the guests sat on wooden seats around the cow, which lay across the branches of a fallen tree. Then they began to eat. Every jackal stared greedily at the meat before him except one. That jackal looked uneasy and kept glancing toward his host. The panther noticed. He leaped at the culprit and caught him by the tail. Once again, the jackal was too quick. He snatched up a knife, cut off his own tail, and dashed into the forest. All the other jackals ran after him. Before the astonished panther could recover, he was alone."
    - id: ch03
      title: The Tailless Jackals
      blocks:
        - id: ch03-b01
          speaker: panther
          text: "What can I do now?"
        - id: ch03-b02
          speaker: narrator
          text: "The panther asked the old man when he returned to see how the plan had worked."
        - id: ch03-b03
          speaker: old_man
          text: "That was certainly unfortunate. Still, I think I know where to find him. About two miles from here, there's a melon garden. Jackals love melons, so they have probably gone there to feed. Look for the one without a tail. He'll be the jackal you want."
        - id: ch03-b04
          speaker: narrator
          text: "The panther thanked him and went on his way. But the jackal had already guessed what advice the old man would give his enemy. His friends were greedily eating the ripest melons in the sunniest corner of the garden. While they ate, the jackal stole behind them and tied all their tails together. He had only just finished when his sharp ears caught the sound of branches breaking nearby."
        - id: ch03-b05
          speaker: jackal
          text: "Quick! Run! The owner of the garden is coming!"
        - id: ch03-b06
          speaker: narrator
          text: "The jackals sprang up and scattered in every direction, leaving their tails behind. Now there was no way for the panther to know which tailless jackal was his enemy. He went back to the old man, sad and weary."
        - id: ch03-b07
          speaker: panther
          text: "Not one of them had a tail. I'm tired of hunting those jackals. I'll leave them alone and catch something for my supper instead."
          emotion: sad
    - id: ch04
      title: A Sheep for Breakfast
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "The hedgehog had been unable to share in any of these adventures. Once the danger had passed, the jackal went looking for his friend and was lucky enough to find him at home."
        - id: ch04-b02
          speaker: jackal
          text: "Ah, here you are! Since we last met, I've lost my tail. Some other people lost theirs too, but never mind that. I'm hungry. Come with me to that shepherd over there, and we'll ask him to sell us a sheep."
        - id: ch04-b03
          speaker: hedgehog
          text: "Yes, that's a good plan."
        - id: ch04-b04
          speaker: narrator
          text: "The hedgehog moved his little legs as fast as he could to keep up. When they reached the shepherd, the jackal drew a purse from beneath his foreleg and struck a bargain with him."
        - id: ch04-b05
          speaker: shepherd
          text: "Wait until tomorrow, and I'll give you the biggest sheep you've ever seen. He always feeds far from the rest of the flock, so it would take me a long time to catch him now."
        - id: ch04-b06
          speaker: jackal
          text: "Waiting is a nuisance, but I suppose I'll have to."
        - id: ch04-b07
          speaker: narrator
          text: "The jackal and hedgehog looked around until they found a pleasant dry cave, then made themselves comfortable there for the night. After they had gone, the shepherd killed one of his sheep and stripped off its skin. He sewed that skin tightly around a greyhound he had with him, tied a cord around the dog's neck, and then lay down to sleep. Very, very early the next morning, before the sun was properly up, the hungry jackal and hedgehog were already tugging at the shepherd's cloak."
        - id: ch04-b08
          speakers: [jackal, hedgehog]
          ensemble: duo
          text: "Wake up and give us our sheep! We haven't eaten all night, and we're very hungry."
        - id: ch04-b09
          speaker: narrator
          text: "The shepherd yawned and rubbed his eyes."
        - id: ch04-b10
          speaker: shepherd
          text: "He's tied to that tree. Go and take him."
        - id: ch04-b11
          speaker: narrator
          text: "They went to the tree, untied the cord, and turned back toward the cave where they had slept, dragging the greyhound behind them. When they arrived, the jackal said he meant to judge the animal before killing it. He stopped a little way off so he could get a better look."
        - id: ch04-b12
          speaker: jackal
          text: "Before I kill this sheep, I want to see whether he's fat or thin."
        - id: ch04-b13
          speaker: narrator
          text: "For a minute or two, he studied the animal with his head tilted to one side. Then he nodded gravely."
        - id: ch04-b14
          speaker: jackal
          text: "He's certainly fat enough. This is a good sheep."
    - id: ch05
      title: The Hedgehog Knows Better
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "The hedgehog could sometimes be far more cunning than anyone expected. He took one look at the supposed sheep and knew better."
        - id: ch05-b02
          speaker: hedgehog
          text: "My friend, that's nonsense. The wool may come from a sheep, but I can see my uncle the greyhound's paws underneath it."
        - id: ch05-b03
          speaker: jackal
          text: "It is a sheep."
        - id: ch05-b04
          speaker: narrator
          text: "The jackal did not like anyone seeming cleverer than he was."
        - id: ch05-b05
          speaker: hedgehog
          text: "Then hold the cord while I take a closer look."
        - id: ch05-b06
          speaker: narrator
          text: "Very unwillingly, the jackal took hold of the rope. The hedgehog walked slowly all the way around the greyhound until he came back to his friend. The paws and tail left no doubt in his mind. The shepherd had sold them a greyhound, not a sheep. The hedgehog could not tell what turn things might take once the dog was loose, so he decided to get safely out of the way."
        - id: ch05-b07
          speaker: hedgehog
          text: "Oh, yes, you were right after all. But I can never eat before I've had a drink. I'll run to the spring at the edge of the wood and quench my thirst. Then I'll be ready for breakfast."
        - id: ch05-b08
          speaker: jackal
          text: "Don't take too long!"
        - id: ch05-b09
          speaker: narrator
          text: "The hedgehog hurried away at his best speed, while the jackal lay beneath a rock to wait. More than an hour went by. There had been plenty of time to reach the spring and return, but the hedgehog never appeared. That was only natural. He was hiding in long grass beneath a tree. At last, the jackal guessed that his friend had run away for some reason. He decided he would wait for breakfast no longer. He walked over to the place where the greyhound was tethered and untied the rope. Just as the jackal prepared to leap onto the animal's back and give it a deadly bite, he heard a low growl. No sheep had ever made a sound like that."
        - id: ch05-b10
          speaker: narrator
          text: "In a flash, the jackal dropped the cord and raced across the plain. His legs were long, but the greyhound's were longer. The dog soon overtook him. The jackal turned to fight, but he was no match for the greyhound. A few minutes later, the jackal lay dead on the ground, and the greyhound trotted peacefully back to the shepherd."
