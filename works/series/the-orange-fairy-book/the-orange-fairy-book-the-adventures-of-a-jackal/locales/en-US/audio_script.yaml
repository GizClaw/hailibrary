audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "steady, vivid folktale storytelling"
        timbre: "warm and resonant"
        pace: "measured"
        pitch: "medium"
    jackal:
      display_name: Jackal
      tts:
        delivery: "clever, confident, and lightly boastful"
        timbre: "quick and bright"
        pace: "brisk"
        pitch: "medium-high"
    hedgehog:
      display_name: Hedgehog
      tts:
        delivery: "careful, plainspoken, and quietly shrewd"
        timbre: "small and mellow"
        pace: "measured"
        pitch: "medium"
    panther:
      display_name: Panther
      tts:
        delivery: "courteous, trusting, and forceful when angered"
        timbre: "deep and smooth"
        pace: "steady"
