audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    owl:
      display_name: 猫头鹰
      tts:
        delivery: 彬彬有礼，思虑周全，说话温和
        timbre: 低沉圆润
        pace: 舒缓
        pitch: 中低
    eagle:
      display_name: 老鹰
      tts:
        delivery: 爽直能干，待人热诚
        timbre: 强健清亮
        pace: 稳健
        pitch: 中低
    elder_sister:
      display_name: 姐姐
      tts:
        delivery: 果敢机敏，遇事沉着利落
        timbre: 温暖坚定
        pace: 适中
        pitch: 中
    younger_sister:
      display_name: 妹妹
      tts:
        delivery: 坦率敏锐，危急时勇敢坚决
        timbre: 明亮清澈
        pace: 自然
        pitch: 中高
    frog:
      display_name: 青蛙男孩
      tts:
        delivery: 年幼任性，说话直来直去
        timbre: 细小沙哑
        pace: 稍快
        pitch: 高
    ogress:
      display_name: 女妖
      tts:
        delivery: 凶狠阴沉，威胁时如雷轰鸣
        timbre: 粗粝沉重
        pace: 缓慢而逼人
        pitch: 低
  chapters:
    - id: ch01
      title: 两位朋友与两位妻子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一片蛮荒之地，一年里好几个月都压着深雪。那里住着猫头鹰和老鹰。他们处处不同，却成了最要好的朋友，后来索性住进同一间屋子。老鹰白天打猎，猫头鹰夜里出门，两位朋友很少碰面。也许正因如此，他们反倒相处得格外和睦。日子本来很称心，只是他们还各自想要一位妻子。
        - id: ch01-b02
          speaker: eagle
          text: 我每天傍晚回来，累得连屋子都收拾不动了。
        - id: ch01-b03
          speaker: owl
          text: 我整夜在外打猎，天一亮就困得睁不开眼，哪里还有力气扫地掸灰？
        - id: ch01-b04
          speaker: narrator
          text: 两只鸟就这样拿定主意，非得娶妻不可。他们一有空，便去拜访认识的年轻姑娘。可姑娘们谁也不肯同时嫁给两个丈夫。他们正渐渐绝望，一天傍晚却发生了奇事。那天，他们难得结伴打猎，回来一看，两姐妹竟一人一张床，正在屋里熟睡。老鹰看看猫头鹰，猫头鹰也回望着老鹰。
        - id: ch01-b05
          speakers: [eagle, owl]
          ensemble: duo
          text: 要是她们肯留下，一定是再好不过的妻子。
        - id: ch01-b06
          speaker: narrator
          text: 两只鸟赶紧飞出去洗澡，又把自己打扮得精神些，好在姑娘醒来前收拾体面。姐妹俩睡了许久。她们从很远的一座城镇走来，那里几乎没有食物，两人早已饿得虚弱，又累得厉害。过了好些时候，她们睁开眼，看见猫头鹰和老鹰守在床边。
        - id: ch01-b07
          speaker: owl
          text: 二位这会儿歇过来了吗？
        - id: ch01-b08
          speakers: [elder_sister, younger_sister]
          ensemble: duo
          text: 歇过来了，谢谢你们。可是我们饿得很，能给我们找点吃的吗？
        - id: ch01-b09
          speaker: eagle
          text: 当然可以！
        - id: ch01-b10
          speaker: narrator
          text: 老鹰立刻飞向一两英里外的农庄，用强壮的鸟喙衔回一窝鸡蛋。猫头鹰则拿上一只锡罐，飞到一位老妇人的小屋。老妇人养着一头奶牛，牛棚里正放着一桶刚挤好的牛奶。猫头鹰从窗户钻进去，把罐子伸进桶里，舀得满满的。姐妹俩见主人这样善良，又这样能干，高兴极了。两只鸟问她们愿不愿意嫁过来，从此留在这里，她们连想都没多想就答应了。妹妹嫁给老鹰，姐姐嫁给猫头鹰。再也没有比这个家更安宁的地方了。
    - id: ch02
      title: 失踪的丈夫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 几个月平安过去。后来就在同一天，老鹰的妻子生下一个儿子，猫头鹰的妻子却生下一只青蛙。青蛙似乎不喜欢待在屋里，母亲马上把他安置在附近的小河边。两个孩子很快长大，天天玩在一起，从来不会玩腻。他们只喜欢彼此作伴，也从不想再找任何别的伙伴。
        - id: ch02-b02
          speaker: narrator
          text: 到了春天，冰雪都化了。一天夜里，姐妹俩坐在屋中纺线，等丈夫回家。可她们等了一夜，猫头鹰和老鹰没有回来。第二天没有，第三天没有，再下一天仍旧没有。妻子们终于不再指望他们自行归来。她们都是明白事理的人，没有坐着哭，而是叫来孩子，动身去寻找丈夫。哪怕走遍全世界，她们也一定要把人找到。
        - id: ch02-b03
          speaker: narrator
          text: 两人不知道丈夫去了哪个方向，只想到远处有一片茂密的森林，那里猎物很多。鸟儿兴许就在森林里，就算不在，也可能有人听过他们的消息。姐妹俩想到自己总算能做点什么，脚步也轻快起来。妹妹走在稍前面，忽然惊叫一声。
        - id: ch02-b04
          speaker: younger_sister
          text: 快看，这么大一座湖！我们怎么可能过得去？
          emotion: surprised
        - id: ch02-b05
          speaker: elder_sister
          text: 一定过得去，我有办法。
        - id: ch02-b06
          speaker: narrator
          text: 姐姐从口袋里取出一根长绳，把绳头系进青蛙嘴里，像套马嚼子一样。她弯下腰，把青蛙放到水中。
        - id: ch02-b07
          speaker: elder_sister
          text: 你游到湖对岸去，我们就踩着你身后的绳子走。
        - id: ch02-b08
          speaker: narrator
          text: 青蛙向前游，姐妹俩和男孩果然沿着绳子走上湖面。可他们刚到湖心附近，青蛙男孩忽然停住了。
        - id: ch02-b09
          speaker: frog
          text: 我不喜欢这样！我再也不往前游了！
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: 母亲答应给他各种各样的好东西，他这才肯继续游。大家总算抵达对岸。猫头鹰的妻子解下绳子，叫青蛙留在湖边休息玩耍，等他们从森林回来。接着，姐妹俩带上老鹰的儿子，朝黑压压的大森林走去。森林耸立在前方，他们却已经赶了很远的路，全都筋疲力尽。这时，前面一间小屋升起了袅袅炊烟，他们见了别提多高兴了。
        - id: ch02-b11
          speaker: younger_sister
          text: 我们进去讨点水喝吧。
        - id: ch02-b12
          speaker: narrator
          text: 三个人走进小屋。里面黑得什么也看不清。过了一会儿，角落里传来一声微弱的嘶哑叫声。姐妹俩转头望去，那里竟是她们苦苦寻找的丈夫。猫头鹰和老鹰的翅膀、双脚全被鹿皮绳绑住，眼睛也深深陷了下去。妻子们快如闪电，立刻冲过去割断绳索。疼痛和饥饿把两只鸟折磨得太虚弱，他们只能轻轻叫上几声，诉说重逢的欢喜。
        - id: ch02-b13
          speaker: narrator
          text: 绳子刚解开，一声雷鸣般的怒吼突然震响。姐妹俩吓得一跳，小男孩紧紧搂住母亲的脖子。
        - id: ch02-b14
          speaker: ogress
          text: 你们跑进我的屋子做什么？
          emotion: angry
        - id: ch02-b15
          speakers: [elder_sister, younger_sister]
          ensemble: duo
          text: 我们已经找到丈夫了，现在就要把他们从你这个恶毒女巫手里救走。
    - id: ch03
      title: 悬崖上的考验
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 妻子们答得毫不畏惧。女妖听完，脸上露出狰狞的笑。
        - id: ch03-b02
          speaker: ogress
          text: 好，我给你们一个机会。你们从这座山上滑下去，要是能到洞穴底部，我就把丈夫还给你们。
        - id: ch03-b03
          speaker: narrator
          text: 女妖一面说，一面把众人赶出门，逼到一道悬崖边。那悬崖笔直落下，足有几百英尺深，下面便是洞穴。趁女巫没有留意，青蛙的母亲把魔法绳的一头系在自己身上，又低声叫小男孩牢牢握住另一头。她才刚刚系好，女巫便转过身来。
        - id: ch03-b04
          speaker: ogress
          text: 怎么，你好像不喜欢这桩约定？
        - id: ch03-b05
          speaker: elder_sister
          text: 我当然准备好了，只是在等你开口。
        - id: ch03-b06
          speaker: narrator
          text: 姐姐坐下来，沿着峭壁一路往下滑。她越滑越深，最后连女巫也看不见了。女巫认定她已经摔死，便命令妹妹接着来。谁知就在这时，姐姐的脑袋重新冒过岩石，是魔法绳把她拉回了崖顶。女巫厌恶地嚎叫起来，双手掩住脸。妹妹抓住这个空当，赶紧把绳子系在自己腰上。
        - id: ch03-b07
          speaker: ogress
          text: 这样的好运，不会落到你们头上两次。
        - id: ch03-b08
          speaker: narrator
          text: 妹妹也从崖边滑了下去。没过几分钟，她同样安然返回。女巫知道自己又输了，还担心法力正在消失。她明明气得浑身发抖，却不敢让人看出来，只能发出一阵可怕的笑声。
    - id: ch04
      title: 女妖的黑发
      blocks:
        - id: ch04-b01
          speaker: ogress
          text: 别以为这样就能轻易带走我的俘虏！把我的头发变得和你们一样又黑又浓，不然你们的丈夫再也见不到天日！
          emotion: angry
        - id: ch04-b02
          speaker: elder_sister
          text: 这并不难。不过你得照我们的方法来治，恐怕不太好受。
        - id: ch04-b03
          speaker: ogress
          text: 你们都受得住，我当然也能受得住。
        - id: ch04-b04
          speaker: narrator
          text: 姐妹俩告诉女巫，她们先把沥青涂满头顶，再把烧热的石头压上去。
        - id: ch04-b05
          speakers: [elder_sister, younger_sister]
          ensemble: duo
          text: 这法子疼得很，可我们不知道别的办法。为了不出差错，一个人要把你按住，另一个人往你头上浇沥青。
        - id: ch04-b06
          speaker: narrator
          text: 姐妹俩说做就做，一个把女巫牢牢按住，另一个把沥青浇了上去。姐姐又解开长发，让头发垂到女巫眼前。女巫还以为那是自己的黑发正在长出来。随后，妹妹搬来一块巨石。总而言之，女巫的性命就此结束。姐妹俩原是未曾见过传教士的蛮荒人。
    - id: ch05
      title: 湖对岸的新家
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 姐妹俩确认女巫已经死了，便回到小屋，悉心照顾猫头鹰和老鹰，直到两位丈夫重新恢复力气。随后，她们回到湖边接上一直等在那里的青蛙。最后，所有人一同越过大湖，在湖的另一边重新安了家。
