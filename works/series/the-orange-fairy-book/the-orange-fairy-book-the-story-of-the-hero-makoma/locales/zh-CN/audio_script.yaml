audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    makoma:
      display_name: 马科马
      tts:
        delivery: 坚定果敢，话语简洁有英雄气概
        timbre: 洪亮年轻
        pace: 稳健
        pitch: 中低
    mother:
      display_name: 母亲
