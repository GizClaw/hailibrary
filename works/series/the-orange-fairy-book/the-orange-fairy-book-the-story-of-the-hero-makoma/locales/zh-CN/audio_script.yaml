        delivery: 温和慈爱
        timbre: 柔润成熟
        pace: 从容
        pitch: 中
    chi_eswa_mapiri:
      display_name: 奇埃斯瓦马皮里
      tts:
        delivery: 粗犷直率，臣服后恭敬
        timbre: 厚重低沉
        pace: 稍慢
        pitch: 低
    chi_dubula_taka:
      display_name: 奇杜布拉塔卡
      tts:
        delivery: 强硬响亮
        timbre: 沙哑浑厚
        pace: 稳健
        pitch: 低
    chi_gwisa_miti:
      display_name: 奇格维萨米蒂
      tts:
        delivery: 威严沉着
        timbre: 宽厚深沉
        pace: 舒缓
        pitch: 低
    chi_idea_moto:
      display_name: 奇伊迪亚莫托
      tts:
        delivery: 傲慢而带讥笑
        timbre: 干燥锐利
        pace: 略快
        pitch: 中
    chin_debou_mau_giri:
      display_name: 钦德布·毛吉里
      tts:
        delivery: 阴冷凶狠，如远处轰鸣
        timbre: 湿冷低沉
        pace: 缓慢
        pitch: 低
    wife_1:
      display_name: 萨卡蒂里纳的妻子甲
      tts:
        delivery: 礼貌庄重
        timbre: 清亮成熟
        pace: 从容
        pitch: 中
    wife_2:
      display_name: 萨卡蒂里纳的妻子乙
      tts:
        delivery: 礼貌庄重
        timbre: 柔和成熟
        pace: 从容
        pitch: 中
    ancestor_1:
      display_name: 祖灵甲
      tts:
        delivery: 遥远肃穆
        timbre: 空灵低沉
        pace: 缓慢
        pitch: 低
    ancestor_2:
      display_name: 祖灵乙
      tts:
        delivery: 遥远肃穆
        timbre: 空灵浑厚
        pace: 缓慢
        pitch: 中低
    ancestor_3:
      display_name: 祖灵丙
      tts:
        delivery: 遥远肃穆
        timbre: 空灵苍老
        pace: 缓慢
        pitch: 中
    sakatirina:
      display_name: 萨卡蒂里纳
      tts:
        delivery: 威严宏大，疲倦中仍有力量
        timbre: 如云中雷鸣般深沉
        pace: 缓慢
        pitch: 极低
    mulimo:
      display_name: 大神穆利莫
      tts:
        delivery: 神圣庄严，不容置疑
        timbre: 明亮浑厚
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 更伟大的人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，赞比西河畔有一座塞纳城。城里有个孩子降生了。他跟别的孩子全不一样，一出生就身材高大，力气惊人。肩上背着一只大口袋，手里还握着一柄铁锤。他甚至会像成年人那样说话，只是平日里总沉默寡言。
        - id: ch01-b02
          speaker: mother
          text: 孩子，我们该用什么名字来叫你呢？
        - id: ch01-b03
          speaker: makoma
          text: 请把塞纳所有的首领都召到河岸上来。
        - id: ch01-b04
          speaker: narrator
          text: 母亲依言请来众位首领。孩子带他们走到河中一汪幽黑的深潭边。那是凶猛鳄鱼的巢穴。
        - id: ch01-b05
          speaker: makoma
          text: 尊贵的首领们，你们当中，谁敢跳下深潭，制服这些鳄鱼？
        - id: ch01-b06
          speaker: narrator
          text: 没有一个人肯走上前。孩子见状，转过身，纵身跃进深潭，很快消失在水下。岸上的人屏住呼吸，心想，这孩子一定中了邪，竟白白把命送给鳄鱼。忽然，大地震动起来。潭水翻滚旋转，渐渐染成一片血红。过了一会儿，孩子重新浮出水面，安然游回岸边。
        - id: ch01-b07
          speaker: narrator
          text: 可是，从水中归来的已经不再只是一个孩子。他比任何成年人都强壮，身材高大，相貌英俊。岸上的人亲眼看见这番变化，都欢喜得高声呼喊起来。
        - id: ch01-b08
          speaker: makoma
          text: 我的族人们，现在你们知道我的名字了。我叫马科马，就是“更伟大的人”。你们谁也不敢下去的深潭，我已经杀尽了里面的鳄鱼！
        - id: ch01-b09
          speaker: makoma
          text: 母亲，请安心休息。我要去寻找自己的家园，成为一名英雄。
        - id: ch01-b10
          speaker: narrator
          text: 他说完便走进自己的茅屋，拿起那柄名叫努恩多的铁锤，又把大口袋甩到肩后，就这样离开母亲和故乡，独自上路了。
    - id: ch02
      title: 四位巨人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 马科马先渡过赞比西河，然后朝北方和西方走去。一个月又一个月，他始终没有停下脚步。后来，他来到一片山峦起伏的地方，远远看见一个身形庞大的巨人，而那个巨人正在亲手造山。
        - id: ch02-b02
          speaker: makoma
          text: 你好！你是什么人？
        - id: ch02-b03
          speaker: chi_eswa_mapiri
          text: 我是造山的奇埃斯瓦马皮里。你又是谁？
        - id: ch02-b04
          speaker: makoma
          text: 我是马科马，我的名字就是“更伟大的人”。
        - id: ch02-b05
          speaker: chi_eswa_mapiri
          text: 你比谁更伟大？
        - id: ch02-b06
          speaker: makoma
          text: 我比你更伟大！
        - id: ch02-b07
          speaker: narrator
          text: 巨人怒吼着扑来。马科马不发一言，抡起努恩多砸中他的头。巨人立刻缩成小矮人，跪倒在地。
        - id: ch02-b08
          speaker: chi_eswa_mapiri
          text: 马科马，你确实比我伟大。带我走吧，让我做你的奴仆！
        - id: ch02-b09
          speaker: narrator
          text: 马科马弯腰把缩小的巨人提起来，随手丢进背后的口袋。奇埃斯瓦马皮里的全部力量随即进入马科马体内，使他比从前更加强大。虽然袋中多了一个巨人，他背起来仍旧毫不费力，就像鹰叼起一只野兔。
        - id: ch02-b10
          speaker: narrator
          text: 前方遍地都是巨石和大土块。马科马越过土堆，看见另一个巨人浑身尘土，正把大地掘开，将泥土一把把抛到两旁。
        - id: ch02-b11
          speaker: makoma
          text: 你是谁？为什么这样挖开大地？
        - id: ch02-b12
          speaker: chi_dubula_taka
          text: 我是奇杜布拉塔卡，正在开辟河床。
        - id: ch02-b13
          speaker: makoma
          text: 你可知道我是谁？我就是人称“更伟大的人”！
        - id: ch02-b14
          speaker: chi_dubula_taka
          text: 比谁更伟大？
        - id: ch02-b15
          speaker: makoma
          text: 我比你更伟大！
        - id: ch02-b16
          speaker: narrator
          text: 奇杜布拉塔卡大喝一声，抓起一大块泥土，猛地朝马科马掷去。马科马早把口袋架在左臂上，落下的石头和泥块全砸在袋上，没能伤到他。他紧握铁锤冲近，一锤便将巨人击倒。奇杜布拉塔卡趴在地上求饶，身体不停地缩小。等他缩到正好装得下，马科马就把他放进袋里，让他跟造山者待在一起。
        - id: ch02-b17
          speaker: narrator
          text: 开辟河流的力量也进入了马科马体内。他变得比刚才更伟大，又继续向前赶路。终于，前方出现一片猴面包树和荆棘树组成的森林。那里的树全都长成了，每一棵都比马科马过去见过的树更加高大。附近还有一位巨人，正在一棵棵栽种这片森林。他就是奇格维萨米蒂。
        - id: ch02-b18
          speaker: makoma
          text: 大个子，你是谁？
        - id: ch02-b19
          speaker: chi_gwisa_miti
          text: 我是奇格维萨米蒂。我种这些猴面包树和荆棘树，是给我的孩子大象做食物。
        - id: ch02-b20
          speaker: makoma
          text: 那就停手吧！我是马科马，来跟你较量一番！
        - id: ch02-b21
          speaker: narrator
          text: 巨人伸手连根拔起一棵庞大的猴面包树，把它当成武器，朝马科马狠狠打来。马科马纵身闪到一旁。那棵大树没打中他，却深深陷进松软的泥土里。就在这时，马科马抡圆努恩多，一锤击中巨人，将他打倒在地。
        - id: ch02-b22
          speaker: narrator
          text: 奇格维萨米蒂也缩小了。等他喘过气来，便低头请求。
        - id: ch02-b23
          speaker: chi_gwisa_miti
          text: 请收我做仆人吧。能服侍你这样伟大的人，是我的光荣。
        - id: ch02-b24
          speaker: narrator
          text: 马科马把第三位巨人也装进口袋，继续赶路。许多天以后，他走进一个荒凉多石的国度。那里没有一棵草，也没有任何活物，阴森的死寂统治着整片土地。就在这片死去的荒原中央，马科马看见一个男人，正把火焰吞进嘴里。
        - id: ch02-b25
          speaker: makoma
          text: 你在做什么？
        - id: ch02-b26
          speaker: chi_idea_moto
          text: 我在吃火。我叫奇伊迪亚莫托，是火焰之灵。只要我愿意，什么都能烧光毁尽。
        - id: ch02-b27
          speaker: makoma
          text: 你说错了。我是马科马，比你更伟大。你毁不了我！
        - id: ch02-b28
          speaker: narrator
          text: 吞火者再次大笑，张口向马科马喷出一道烈焰。马科马赶在火焰袭来前跃到岩石后面，险险躲过。那股热气落在他刚才站立的地方，把地面烧化了，变成烧过头的陶罐那样的熔融玻璃。马科马随即掷出铁锤，正中火焰之灵，把他打得再也无力抵抗。于是，奇伊迪亚莫托也被装进了口袋沃罗诺乌，和其他三位巨人待在一起。
        - id: ch02-b29
          speaker: narrator
          text: 如今，马科马有造山的力气，有引河越过荒原的勤勉，有植树的远见和智慧，还能随意生出火焰。他已是一位真正伟大的英雄。
    - id: ch03
      title: 河中的瘴雾之灵
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 马科马继续漫游。有一天，他来到一片辽阔的平原。这里水源丰沛，野兽成群。平原中央流过一条大河，河边恰好有一小片长满青草的土地，看起来十分宜居。马科马越看越喜欢，就在一棵大树下坐下，卸下肩头的口袋，把四位巨人一一放到面前。
        - id: ch03-b02
          speaker: makoma
          text: 朋友们，我走了这么远，已经累了。这里很适合英雄安家。明天我们去取木料，筑起围栏吧。
        - id: ch03-b03
          speaker: narrator
          text: 第二天，马科马和几位巨人一起出发，去寻找修筑围栏的木桩。他们只留下奇埃斯瓦马皮里看守营地，还让他烤好大家猎来的鹿肉。到了傍晚，众人扛着木桩回来，却发现造山者被一根粗大得惊人的毛发牢牢捆在树上，浑身动弹不得。
        - id: ch03-b04
          speaker: makoma
          text: 这是怎么回事？谁把你捆成了这样？
        - id: ch03-b05
          speaker: chi_eswa_mapiri
          text: 首领啊，正午有个身躯庞大的男人从河里出来。他的灰白胡须长得看不到尽头。他问我的主人是谁，我说是最伟大的英雄马科马。他就从胡须上拔下一根毛，把我绑在了这棵树上。
        - id: ch03-b06
          speaker: narrator
          text: 马科马听完怒火中烧，却什么也没说。他只用指甲在那根毛发上一划。那东西明明像棕榈绳一样又粗又韧，还是应声断开了。造山者终于重获自由。接下来的三天，同样的事每天都发生一次，只是每回被长须捆住的，都是另一个伙伴。到了第四天，马科马让众人照常去砍木桩，自己留守营地。他要亲眼看看，河里那个胡须长得望不到头的人到底是谁。
        - id: ch03-b07
          speaker: narrator
          text: 伙伴们走后，马科马把营地打扫收拾干净，又架起鹿肉慢慢烧烤。正午，太阳升到头顶，河中忽然传来轰隆隆的响声。马科马抬眼望去，一个巨人的头颅和双肩正从水里缓缓冒出。再看他的灰白长须，一边沿着河床伸向上游，一边铺向下游，直到两头都消失在远方的蓝雾中。
        - id: ch03-b08
          speaker: chin_debou_mau_giri
          text: 你是谁？
        - id: ch03-b09
          speaker: makoma
          text: 我就是马科马。你先告诉我姓名，还要说清楚你在河中做什么，然后我再杀你。
        - id: ch03-b10
          speaker: chin_debou_mau_giri
          text: 我叫钦德布·毛吉里，河流就是我的家。我的胡须是水面上的灰色瘴雾。我用它捆住靠近的人，让他们死去。
        - id: ch03-b11
          speaker: makoma
          text: 你捆不住我！
        - id: ch03-b12
          speaker: narrator
          text: 马科马喊着冲上前去，举起铁锤猛砸。可这河中巨人的绿色胸膛湿滑无比，锤头擦着胸口滑开，一点也没伤到他。马科马被带得脚下踉跄，正想重新站稳，巨人已经甩出一根长须，绕住他的身体，把他绊倒在地。
        - id: ch03-b13
          speaker: narrator
          text: 马科马一时被缠得无法动弹。这时，他想起了进入自己体内的火焰之灵的力量。他对准长须喷出一口烈焰，烧断束缚，脱身站起。钦德布·毛吉里正俯下身体，伸手来抓。马科马迎面把干燥的口袋沃罗诺乌套住他湿滑的脑袋，握紧铁锤，再次重重砸下。这一回，锤头没有滑开，河中巨人倒在地上，死去了。
        - id: ch03-b14
          speaker: narrator
          text: 黄昏时，四个巨人扛着木桩回来，见马科马战胜瘴雾之灵，都十分欢喜。他们吃着烤鹿肉，欢宴到深夜。第二天一早，伙伴们醒来，只见马科马坐在火边暖手，神色阴郁。
        - id: ch03-b15
          speaker: makoma
          text: 朋友们，昨夜，祖先的白色灵魂从黑暗中来到我面前。他们给我留下了这样的命令。
        - id: ch03-b16
          speakers: [ancestor_1, ancestor_2, ancestor_3]
          ensemble: chorus
          text: 离开这里吧，马科马。你若不找到五头的萨卡蒂里纳，同他一战，就永远得不到安宁。他伟岸而强壮。向朋友们告别，你必须独自前去。
        - id: ch03-b17
          speaker: narrator
          text: 巨人们听说英雄要走，悲伤哀哭。马科马安慰他们，把从每个人那里取得的天赋一一归还。
        - id: ch03-b18
          speaker: makoma
          text: 朋友们，再会了。
        - id: ch03-b19
          speaker: narrator
          text: 说完，他独自踏上了西去的路。
    - id: ch04
      title: 云中的五头巨人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 马科马一路向遥远的西方走去。他翻过崎岖的山岭，穿过积水的沼泽，涉过一道又一道深河，还在干旱的沙漠里连续跋涉了许多天。若是普通人，早已死在路上。终于，他来到几座高大山峰附近。那里孤零零地立着一间茅屋，屋里住着两个美丽的女人。
        - id: ch04-b02
          speaker: makoma
          text: 你们好。这里可是五头萨卡蒂里纳的国土？我正在找他。
        - id: ch04-b03
          speakers: [wife_1, wife_2]
          ensemble: duo
          text: 伟大的人，向你问好。我们是萨卡蒂里纳的妻子。你要找的人就站在那里。那两座山峰其实是他的双腿，他的身体藏在云里，你看不见。
        - id: ch04-b04
          speaker: narrator
          text: 马科马抬头仰望，这才明白巨人究竟有多么高大。他虽然万分震惊，心里却毫不畏惧。他继续往前，一直走到萨卡蒂里纳的一条腿旁，抡起努恩多狠狠砸去。什么也没发生。他又打了一下，还是没有动静，于是再打第三下。过了一会儿，极高极远的地方终于飘下来一个疲倦的声音。
        - id: ch04-b05
          speaker: sakatirina
          text: 是谁在挠我的脚？
        - id: ch04-b06
          speaker: makoma
          text: 是我，马科马，人称“更伟大的人”！
        - id: ch04-b07
          speaker: narrator
          text: 他等了等，没有回应。于是，他收集所有能找到的枯枝和死树，围着巨人的双腿堆起巨大柴堆，一把火点燃。
        - id: ch04-b08
          speaker: narrator
          text: 这一次，云中滚起雷霆般的声音。
        - id: ch04-b09
          speaker: sakatirina
          text: 是谁在我脚边生火，弄得烟雾四起？
        - id: ch04-b10
          speaker: makoma
          text: 是我，马科马！萨卡蒂里纳，我从很远的地方来见你。祖先的灵魂命我寻找你，跟你交战，免得我养得又肥又懒，最后连自己都厌倦！
        - id: ch04-b11
          speaker: narrator
          text: 四周静了一阵。巨人再开口时，声音却很轻。
        - id: ch04-b12
          speaker: sakatirina
          text: 很好，马科马。我也厌倦了。世上没有谁像我一样伟大，所以我始终孤身一人。小心！
        - id: ch04-b13
          speaker: narrator
          text: 话音未落，萨卡蒂里纳忽然弯下身体，一把将英雄抓在两只手中，再重重掼向地面。可奇异的是，马科马非但没有死，反而从这一摔中得到了更旺盛的生命。他立刻从地上一跃而起，身躯比刚才更加高大，力气也比刚才更强。他迎着萨卡蒂里纳冲上前去，双臂牢牢抱住巨人的腰，同他角力起来。
    - id: ch05
      title: 两位英雄
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 两位英雄一小时接一小时地恶战，始终不肯退让。群山在他们脚下滚动，就像洪水里的小石子。有时，马科马会从纠缠中挣脱，聚起全身的力量，再挥动铁锤努恩多重击对手。萨卡蒂里纳则伸手拔起一座座山峰，把它们当作石块掷向马科马。可是无论怎样猛攻，马科马杀不死萨卡蒂里纳，萨卡蒂里纳也杀不死马科马。
        - id: ch05-b02
          speaker: narrator
          text: 战斗一直持续到第二天。最后，他们死死扭在一起，谁也无法把对方推开，谁也无法抽身。两位英雄的力量一点点耗尽，却仍不肯松手。就在太阳快要沉下地平线时，他们终于支撑不住，一同倒在大地上，双双失去了知觉。
        - id: ch05-b03
          speaker: narrator
          text: 清晨醒来，他们看见大神穆利莫站在身旁。
        - id: ch05-b04
          speaker: mulimo
          text: 马科马，萨卡蒂里纳，你们是如此伟大的英雄，世上没有人能与你们对抗。离开人间吧，随我到云端居住。
        - id: ch05-b05
          speaker: narrator
          text: 大神的话音落下，两位英雄便从世人眼前隐去。从此以后，再也没有人在人间见过他们。
        - id: ch05-b06
          speaker: narrator
          text: 这是一个来自罗得西亚的本土故事。
