  chapters:
    - id: ch01
      title: Makoma the Greater
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Long ago, a child was born in Senna, a town on the banks of the Zambesi. He was unlike any other child. He was already tall and strong, with a great sack over his shoulder and an iron hammer in his hand. He could speak like a grown man, though he seldom chose to speak."
        - id: ch01-b02
          speaker: mother
          text: "My child, what name shall we call you?"
        - id: ch01-b03
          speaker: makoma
          text: "Bring all the head men of Senna to the riverbank."
        - id: ch01-b04
          speaker: narrator
          text: "His mother called them, and the child led them to a deep black pool where fierce crocodiles lived."
        - id: ch01-b05
          speaker: makoma
          text: "Great men, which one of you will jump into this pool and defeat the crocodiles?"
        - id: ch01-b06
          speaker: narrator
          text: "Not one man stepped forward. The child turned, leaped into the water, and vanished. Everyone held their breath. They thought the boy must be bewitched. Surely he had thrown his life away, and the crocodiles would devour him. Then the earth began to shake beneath them. The black pool heaved and spun, and its water turned red with blood. At last the child rose to the surface and swam safely ashore."
        - id: ch01-b07
          speaker: narrator
          text: "He was no longer merely a boy. He stood taller and stronger than any man, and he was handsome too. The people shouted for joy at the sight of him."
        - id: ch01-b08
          speaker: makoma
          text: "Now you know my name. I am Makoma, the Greater. I killed the crocodiles in the pool where none of you dared to go."
        - id: ch01-b09
          speaker: makoma
          text: "Rest peacefully, Mother. I am leaving to build a home of my own and become a hero."
        - id: ch01-b10
          speaker: narrator
          text: "Makoma entered his hut and took up his iron hammer, Nu-endo. He swung the great sack across his shoulder and left Senna behind. After crossing the Zambesi, he wandered north and west for many moons. At last, he reached a country covered in hills. There he found an enormous giant at work, making mountains with his own strength."
        - id: ch01-b11
          speaker: makoma
          text: "Greetings! Who are you?"
        - id: ch01-b12
          speaker: chi_eswa_mapiri
          text: "I am Chi-eswa-mapiri, maker of mountains. And who are you?"
        - id: ch01-b13
          speaker: makoma
          text: "I am Makoma. My name means Greater."
        - id: ch01-b14
          speaker: chi_eswa_mapiri
          text: "Greater than whom?"
        - id: ch01-b15
          speaker: makoma
          text: "Greater than you."
        - id: ch01-b16
          speaker: narrator
          text: "With a roar, the giant charged. Makoma did not speak. He swung Nu-endo and brought it down upon the giant's head. The blow was so mighty that the giant shrank into a very small man and dropped to his knees."
        - id: ch01-b17
          speaker: chi_eswa_mapiri
          text: "You truly are greater than I am, Makoma. Take me with you, and I will serve you."
        - id: ch01-b18
          speaker: narrator
          text: "Makoma picked up the little man and dropped him into the sack on his back. The mountain-maker's strength passed into Makoma, making the hero greater than before. Then Makoma continued his journey with the giant inside Woronowu, carrying that burden as easily as an eagle carries a hare."
    - id: ch02
      title: The Makers of Rivers, Forests, and Fire
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Soon Makoma entered a country torn apart by huge stones and clods of earth. Beyond one heap, he saw a dust-covered giant ripping up the ground and flinging great handfuls to either side."
        - id: ch02-b02
          speaker: makoma
          text: "Who are you, pulling up the earth like that?"
        - id: ch02-b03
          speaker: chi_dubula_taka
          text: "I am Chi-dubula-taka. I am making the riverbeds."
        - id: ch02-b04
          speaker: makoma
          text: "Then you should know me. I am the one they call Greater."
        - id: ch02-b05
          speaker: chi_dubula_taka
          text: "Greater than whom?"
        - id: ch02-b06
          speaker: makoma
          text: "Greater than you."
        - id: ch02-b07
          speaker: narrator
          text: "Chi-dubula-taka gave a thunderous shout. He tore up a massive clod of earth and hurled it straight at Makoma. But Makoma held the sack across his left arm like a shield. The stones and soil struck it and fell away without harming him. With his other hand gripping Nu-endo, he rushed forward and struck the giant to the ground. Chi-dubula-taka groveled before him, shrinking smaller and smaller all the while. Once the river-maker was a size Makoma could carry, he put him into the sack beside the mountain-maker."
        - id: ch02-b08
          speaker: narrator
          text: "Now the river-maker's power belonged to Makoma as well. He went on until he reached a forest of baobabs and thorn trees. Every tree was fully grown, and all were larger than any he had ever seen. Nearby stood Chi-gwisa-miti, the giant planting the forest. He was taller than either of his brothers, but Makoma showed no fear."
        - id: ch02-b09
          speaker: makoma
          text: "Who are you, great giant?"
        - id: ch02-b10
          speaker: chi_gwisa_miti
          text: "I am Chi-gwisa-miti. I plant these baobabs and thorns to feed my children, the elephants."
        - id: ch02-b11
          speaker: makoma
          text: "Stop your work! I am Makoma, and I have come to trade blows with you."
        - id: ch02-b12
          speaker: narrator
          text: "The giant ripped an enormous baobab out by its roots and swung it heavily at Makoma. Makoma sprang out of its path. The uprooted tree plunged deep into the soft ground, leaving the giant open. Makoma whirled Nu-endo around his head and felled him with a single blow. The terrible stroke shriveled Chi-gwisa-miti just as the other giants had shriveled. When he had caught his breath again, the forest-planter begged Makoma to take him along as a servant."
        - id: ch02-b13
          speaker: chi_gwisa_miti
          text: "There is honor in serving a man as great as you. Please take me with you."
        - id: ch02-b14
          speaker: narrator
          text: "Makoma placed him in the sack and traveled onward for many days. At last, he entered a barren land of rock where not one living thing grew. In the middle of that dead country, he found a man eating fire."
        - id: ch02-b15
          speaker: makoma
          text: "What are you doing?"
        - id: ch02-b16
          speaker: chi_idea_moto
          text: "I am eating fire. My name is Chi-idea-moto. I am the spirit of flame, and I can burn and destroy anything I please."
        - id: ch02-b17
          speaker: makoma
          text: "You are mistaken. I am Makoma, and I am greater than you. You cannot destroy me."
        - id: ch02-b18
          speaker: narrator
          text: "The fire-eater only laughed again, then blew a sheet of flame at Makoma. The hero sprang behind a rock just in time. Such was the heat of the spirit's breath that the ground where Makoma had stood melted into glass, like a clay pot baked too long in the fire. Makoma rose and hurled Nu-endo at Chi-idea-moto. The iron hammer struck the flame-spirit and knocked him helpless. Then Makoma put him into Woronowu, his sack, beside the other great men he had overcome."
        - id: ch02-b19
          speaker: narrator
          text: "Makoma had become a truly great hero. He held the strength to raise hills, the industry to guide rivers across dry land, the wisdom to plant trees, and the power to make fire whenever he wished."
    - id: ch03
      title: The Spirit in the River
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "One day Makoma came to a broad plain rich with game and water. Beside a large river, right in the middle of the plain, lay a pleasant patch of grass where a home might stand. Delighted, Makoma sat beneath a great tree. He took the sack from his shoulder and set all four giants before him."
        - id: ch03-b02
          speaker: makoma
          text: "My friends, I have traveled a long way, and I am tired. Would this not be a fine place for a hero's home? Tomorrow, let us gather timber and build a kraal."
        - id: ch03-b03
          speaker: narrator
          text: "The next morning, Makoma and three giants went out to cut poles for the kraal. They left Chi-eswa-mapiri behind to guard the place and cook some venison they had killed. The party worked until evening. When they returned carrying the poles, they found the mountain-maker helpless. A single enormous hair had been wound around him and held him fast against a tree."
        - id: ch03-b04
          speaker: makoma
          text: "How did you come to be tied up like this?"
          emotion: surprised
        - id: ch03-b05
          speaker: chi_eswa_mapiri
          text: "Chief, at midday an enormous man rose from the river. His gray mustaches were so long that I could not see where they ended. He asked who my master was, and I told him it was Makoma, the greatest of heroes. Then he pulled one hair from his mustache and used it to tie me to this tree."
        - id: ch03-b06
          speaker: narrator
          text: "Makoma was furious, though he said nothing. The hair was as thick and strong as palm rope, but one stroke of his fingernail cut through it and freed the mountain-maker. For the next three days, exactly the same thing happened. Each day, a different member of the party stayed behind, and each evening the others returned to find him bound. On the fourth day, Makoma remained in camp while all four giants went for poles. He meant to see for himself what kind of man lived in the river with mustaches that reached beyond anyone's sight."
        - id: ch03-b07
          speaker: narrator
          text: "Makoma swept the camp, put it in order, and set venison over the fire. At midday, with the sun directly overhead, a rumbling came from the river. An enormous head and shoulders rose out of the water. The giant's gray mustaches ran down the riverbed in both directions until they disappeared into the blue distance."
        - id: ch03-b08
          speaker: chin_debou_mau_giri
          text: "Who are you?"
        - id: ch03-b09
          speaker: makoma
          text: "I am called Makoma. Before I kill you, tell me your name and what you do in this river."
        - id: ch03-b10
          speaker: chin_debou_mau_giri
          text: "I am Chin-debou Mau-giri. The river is my home. My mustache is the gray fever mist that lies above the water. I bind anyone who comes near me with that mist, and they die."
        - id: ch03-b11
          speaker: makoma
          text: "You will never bind me!"
        - id: ch03-b12
          speaker: narrator
          text: "Makoma rushed at him and struck with Nu-endo. But the river giant's green chest was so slippery that the hammer slid away without hurting him. Makoma stumbled, and as he fought for balance, one long mustache hair curled around him and swept his feet away."
        - id: ch03-b13
          speaker: narrator
          text: "For a moment, Makoma lay helpless in the giant's binding hair. Then he remembered the flame-spirit's power that had entered him. He breathed fire onto the hair and burned through it, cutting himself free. Chin-debou Mau-giri leaned forward to seize him again, but Makoma flung Woronowu over the giant's wet, slippery head. He gripped Nu-endo and struck once more. This time the hammer landed upon the dry sack instead of sliding away, and Chin-debou Mau-giri fell dead."
        - id: ch03-b14
          speaker: narrator
          text: "The four giants came back with the poles at sunset. They rejoiced when they saw that Makoma had defeated the fever-spirit. Together they feasted on roast venison far into the night. Yet when the giants woke in the morning, Makoma was already warming his hands over the fire, and his face was dark with trouble."
        - id: ch03-b15
          speaker: makoma
          text: "My friends, the white spirits of my fathers came to me in the night. They told me I would find no rest until I sought out Sakatirina, the mighty giant with five heads, and fought him. They said I must leave you and go alone."
        - id: ch03-b16
          speaker: narrator
          text: "The four giants were deeply saddened. They cried out over the loss of the hero they had followed. Makoma comforted his friends, and before leaving, he gave back to each giant the gift of power he had taken from him. Then he spoke his farewell and set off alone to find Sakatirina."
    - id: ch04
      title: The Giant in the Clouds
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Makoma traveled far toward the west. He crossed rough mountains and waterlogged marshes, forded deep rivers, and walked for days across deserts where most men would have died. At last, near a range of high peaks, he came to a hut. Two beautiful women were inside."
        - id: ch04-b02
          speaker: makoma
          text: "Greetings. Is this the land of Sakatirina, the five-headed giant I am seeking?"
        - id: ch04-b03
          speakers: [first_wife, second_wife]
          ensemble: duo
          text: "Greetings, Great One. We are Sakatirina's wives, and your search is over. There stands the one you seek."
        - id: ch04-b04
          speaker: narrator
          text: "They pointed toward what Makoma had taken for two tall mountain peaks."
        - id: ch04-b05
          speakers: [first_wife, second_wife]
          ensemble: duo
          text: "Those are his legs. You cannot see his body because the clouds hide it."
        - id: ch04-b06
          speaker: narrator
          text: "Makoma stared in wonder when he understood how tall the five-headed giant truly was, but the sight did not rob him of courage. He walked on until he reached one of Sakatirina's immense legs. Makoma lifted Nu-endo and struck it hard. Nothing happened. He struck a second time, then a third. At last, from somewhere high above the clouds, a tired and distant voice came down to him."
        - id: ch04-b07
          speaker: sakatirina
          text: "Who is scratching my feet?"
        - id: ch04-b08
          speaker: makoma
          text: "It is Makoma, the one called Greater!"
        - id: ch04-b09
          speaker: narrator
          text: "Makoma listened, but no answer came. So he gathered every dead tree and piece of brushwood he could find. He piled them around Sakatirina's legs and set them on fire."
        - id: ch04-b10
          speaker: narrator
          text: "Now the giant answered. His terrible voice rolled through the clouds like thunder."
        - id: ch04-b11
          speaker: sakatirina
          text: "Who is making that fire smoke around my feet?"
        - id: ch04-b12
          speaker: makoma
          text: "It is Makoma! I have come a long way to find you, Sakatirina. The spirits of my fathers ordered me to seek you out and fight you, before I grew fat and tired of myself."
        - id: ch04-b13
          speaker: narrator
          text: "For a while, all was silent. Then Sakatirina spoke in a softer voice."
        - id: ch04-b14
          speaker: sakatirina
          text: "Good, Makoma. I too have grown weary. No man is as great as I am, and so I am always alone. Defend yourself!"
        - id: ch04-b15
          speaker: narrator
          text: "Sakatirina bent without warning, snatched Makoma into his hands, and dashed him against the earth. Yet Makoma did not die. He found new life instead. He sprang up taller and stronger than ever, charged in, seized the giant around the waist, and began to wrestle."
    - id: ch05
      title: Heroes of the Clouds
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "They fought hour after hour, each straining to overcome the other. Mountains rolled beneath their feet like pebbles in a flooded river. Again and again, Makoma would tear himself free, gather all his strength, and strike the giant with Nu-endo, his iron hammer. Sakatirina answered by wrenching whole mountains from the earth and hurling them down upon the hero. Still, neither one could wound the other badly enough to end the fight."
        - id: ch05-b02
          speaker: narrator
          text: "On the second day, they locked their arms around each other so tightly that neither could break away. Their strength began to fail. Just as the sun went down, both heroes fell to the ground, senseless."
        - id: ch05-b03
          speaker: narrator
          text: "When they awoke the next morning, Mulimo, the Great Spirit, stood beside them."
        - id: ch05-b04
          speaker: mulimo
          text: "Makoma and Sakatirina, you are such great heroes that no man can stand against you. You will leave this world now and make your home with me in the clouds."
        - id: ch05-b05
          speaker: narrator
          text: "As Mulimo spoke, the two heroes vanished from the sight of all people on Earth. They were never seen among them again."
