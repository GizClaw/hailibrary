  chapters:
    - id: ch01
      title: The Two Kingdoms
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Far across the western sea, a king ruled a land called Lochlann. He had two sons, Oireal and Iarlaid. While they were still children, both their father and mother died. The people called a great council and chose a man to govern until the boys were old enough to rule for themselves."
        - id: ch01-b02
          speaker: narrator
          text: "Years went by. At last, another council decided that the king's sons had come of age and should receive the power that belonged to them. The two young men were summoned. Oireal, the elder brother, was smaller and weaker than Iarlaid. He listened to the council chief, but he did not want the crown."
        - id: ch01-b03
          speaker: oireal
          text: "I don't want to leave the deer on the hills and the fish in the rivers just to sit and judge my people."
        - id: ch01-b04
          speaker: narrator
          text: "The chief flew into a rage."
        - id: ch01-b05
          speaker: council_chief
          text: "If you refuse today to take the vows your father took as king, you will never own so much as one clod of this land!"
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: "Then the younger brother spoke."
        - id: ch01-b07
          speaker: iarlaid
          text: "Give one half of the kingdom to Oireal and the other half to me. Then he won't have so many people to rule."
        - id: ch01-b08
          speaker: oireal
          text: "Yes. I'll agree to that."
        - id: ch01-b09
          speaker: narrator
          text: "So half the men of Lochlann gave their loyalty to Oireal, and half gave theirs to Iarlaid. Each brother governed his own kingdom as he wished. In time, both grew into bearded men. Iarlaid married the daughter of the king of Greece, while Oireal married the daughter of the king of Orkney. The following year, each couple had a son. Oireal's boy, Manus, was big and strong. Iarlaid's son was small and weak. Both young princes had six foster brothers who went everywhere with them."
    - id: ch02
      title: The Queen's Revenge
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "One day, Manus and his cousin called their foster brothers to play shinny in the broad field beside their school, where they learned everything princes and nobles ought to know. They played a long time, sending the ball swiftly from boy to boy. Then Manus struck it toward his cousin. Iarlaid's son was not used to rough treatment, even in play. He cried that he was badly hurt, went home with his foster brothers, and told his mother what had happened. She turned white with anger. Pushing her son aside, she hurried to the council hall where Iarlaid sat."
        - id: ch02-b02
          speaker: wife_of_iarlaid
          text: "Manus drove the ball at my son and meant to kill him. Put an end to Manus and all his wickedness!"
          emotion: angry
        - id: ch02-b03
          speaker: iarlaid
          text: "No. I will not kill my brother's son."
        - id: ch02-b04
          speaker: wife_of_iarlaid
          text: "And he will not kill my son."
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: "She called her chamberlain and ordered him to lead the young prince all the way to the four brown boundaries of the world. There he was to leave the boy with a wise man who would care for him and keep all harm away. The chamberlain obeyed. The wise man placed the prince on top of a hill where the sun always shone. From that high place, the boy could see every man, though no man anywhere could see him."
        - id: ch02-b06
          speaker: narrator
          text: "Next, the queen summoned Manus to the castle and locked him away for a whole year. Even his own mother was not allowed to speak with him. At last, Oireal's wife fell ill. Manus escaped from the prison tower and slipped back to his own home. For several years, he lived there in peace. Then his uncle's wife sent for him."
    - id: ch03
      title: A Bride and a Warning
      blocks:
        - id: ch03-b01
          speaker: wife_of_iarlaid
          text: "It is time for you to marry. You have grown tall and strong like Iarlaid, and you are handsome too. The mighty earl of Finghaidh has a daughter who will suit you well. He holds his lands from me. I shall go to his house with a great company, and you will come along."
        - id: ch03-b02
          speaker: narrator
          text: "And so it was done. The queen traveled to the earl's house with a great following, and Manus went beside her. The earl's wife dearly wanted to keep her daughter at home a little longer. But the queen swore that the earl would lose every rood of his land unless he obeyed her command. If he gave his daughter to Manus, however, she promised him one third of her own kingdom and a great store of treasure besides. She offered all this not because she loved Manus, but because she meant to destroy him. The wedding took place, and the newly married pair rode back with the queen to her own palace."
        - id: ch03-b03
          speaker: narrator
          text: "That night, while Manus slept, a wise man who had been his father's friend came and woke him."
        - id: ch03-b04
          speaker: wise_man
          text: "Danger is very near you, Manus, son of Oireal. You think yourself fortunate because your bride is a mighty earl's daughter. But do you know what bride Iarlaid's wife found for her own son? She found him no mortal woman. She gave him the swift March wind, and you can never defeat her."
        - id: ch03-b05
          speaker: manus
          text: "So that is how it stands."
        - id: ch03-b06
          speaker: narrator
          text: "At the first light of dawn, Manus entered the room where the queen lay among her maidens."
        - id: ch03-b07
          speaker: manus
          text: "I have come for the third of the kingdom and the treasure you promised me."
        - id: ch03-b08
          speaker: narrator
          text: "The queen laughed."
        - id: ch03-b09
          speaker: wife_of_iarlaid
          text: "You will not get one clod of land here. Go to Old Bergen for your reward. Perhaps you'll find treasure under its stones and rugged mountains!"
        - id: ch03-b10
          speaker: manus
          text: "Then give me your son's six foster brothers as well as my own six."
        - id: ch03-b11
          speaker: narrator
          text: "The queen handed all twelve over to him, and they left for Old Bergen. A full year found them still in that wild country. They hunted reindeer and dug pits to catch mountain sheep. At first, Manus and his companions lived happily enough. In time, though, Manus tired of the strange land, and they all boarded a ship for Lochlann. The voyage was long, and the wind blew fierce and cold. One spring day, their ship entered the harbor below Iarlaid's castle. From her window, the queen saw Manus climbing the hill with the twelve foster brothers behind him."
        - id: ch03-b12
          speaker: wife_of_iarlaid
          text: "Manus has come back with all twelve foster brothers. If only I could put an end to him and his killing!"
          emotion: angry
        - id: ch03-b13
          speaker: iarlaid
          text: "That would be a great pity. I will have no part in it."
        - id: ch03-b14
          speaker: wife_of_iarlaid
          text: "Then I will do it myself."
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: "She summoned every one of the twelve foster brothers and made them swear loyalty to her instead of Manus. He was left without a single man. Heavy with sorrow, he returned alone to Old Bergen. It was late when his foot touched the shore, and he took the path that led toward the forest. Along the way, he met a man dressed in a red tunic."
    - id: ch04
      title: The Armourer's Gifts
      blocks:
        - id: ch04-b01
          speaker: armourer
          text: "Is that you, Manus? Have you come back?"
        - id: ch04-b02
          speaker: manus
          text: "It is me. I have returned alone from Lochlann."
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: "The man studied him in silence for a moment."
        - id: ch04-b04
          speaker: armourer
          text: "I dreamed that you wore a sword at your side and became king of Lochlann."
        - id: ch04-b05
          speaker: manus
          text: "But I have no sword, and my bow is broken."
        - id: ch04-b06
          speaker: armourer
          text: "I will give you a new sword if you make me one promise."
        - id: ch04-b07
          speaker: manus
          text: "Of course I'll promise, if I ever become king. Tell me what you want me to do."
        - id: ch04-b08
          speaker: armourer
          text: "I served as your grandfather's armourer. I want to serve as yours too."
        - id: ch04-b09
          speaker: manus
          text: "I gladly promise you that."
        - id: ch04-b10
          speaker: narrator
          text: "Manus followed the man to a house nearby. It was unlike any other house. Weapons covered the walls of every room so thickly that the wooden boards could not be seen."
        - id: ch04-b11
          speaker: armourer
          text: "Choose anything you like."
        - id: ch04-b12
          speaker: narrator
          text: "Manus took down a sword and bent it across his knee. It snapped. The next sword broke too, and so did the one after that."
        - id: ch04-b13
          speaker: armourer
          text: "Stop breaking my swords! Look at this old sword, helmet, and tunic. I wore them in your grandfather's wars. You may find their steel a little stronger."
        - id: ch04-b14
          speaker: narrator
          text: "Three times Manus bent the old sword over his knee, but he could not break it. He buckled it at his side and put on the helmet. As he fastened its strap, he noticed a piece of cloth fluttering outside the window."
        - id: ch04-b15
          speaker: manus
          text: "What is that cloth?"
        - id: ch04-b16
          speaker: armourer
          text: "The Little People of the forest wove it. When you are hungry, it will provide food and drink. If you meet an enemy, he will do you no harm. He will bow and kiss the back of your hand to show that he submits. Take the cloth, and use it wisely."
        - id: ch04-b17
          speaker: narrator
          text: "Gladly, Manus wrapped the cloth around his arm. He was about to leave when he heard a chain rattling in the wind."
        - id: ch04-b18
          speaker: manus
          text: "And what is that chain?"
        - id: ch04-b19
          speaker: armourer
          text: "Any creature that wears that chain around its neck need not fear a hundred enemies."
        - id: ch04-b20
          speaker: narrator
          text: "Manus wound the chain around himself and walked on into the forest."
    - id: ch05
      title: The Lion Cub
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "Without warning, two lions and their cub sprang from the bushes. Roaring loudly, the fierce beasts bounded toward Manus and would have devoured him. He quickly bent down and spread the enchanted cloth over the ground before them. At once, the two great lions stopped. They lowered their heads, kissed the back of his wrist to show their submission, and went on their way. But the little cub rolled himself up inside the cloth and stayed there. Manus picked up the cloth with the cub inside it and carried them both back to Old Bergen."
        - id: ch05-b02
          speaker: narrator
          text: "Another year passed. Then Manus took the lion cub and journeyed to Lochlann. Iarlaid's wife came out to meet him, and with her came a small brown dog, brave despite its size. When the dog saw the lion cub, it rushed forward to eat him. The cub seized the dog by the neck and shook him dead. The queen grieved bitterly for her dog, and her anger blazed. Again and again, she tried to kill Manus and the cub, but every attempt failed. At last, the two returned to Old Bergen, and this time all twelve foster brothers went with them."
        - id: ch05-b03
          speaker: wife_of_iarlaid
          text: "Let them go. My brother, the Red Gruagach, can cut off Manus's head in Old Bergen just as easily as anywhere else."
        - id: ch05-b04
          speaker: narrator
          text: "A messenger carried those words to Oireal's wife. She hurried to send a ship to Old Bergen, hoping to bring her son away before the Red Gruagach could behead him. A pilot sailed aboard the ship. But Iarlaid's wife spread a dense fog over the sea. The rowers did not dare pull at their oars, for they might drive the vessel onto a rock."
    - id: ch06
      title: King of Lochlann
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "Night fell. The lion cub, whose eyes were keen and bright, crept up to Manus. Manus climbed onto his back, and the cub leaped ashore."
        - id: ch06-b02
          speaker: lion_cub
          text: "Rest here on this rock and wait for me."
        - id: ch06-b03
          speaker: narrator
          text: "Manus lay down and slept. After a while, a voice rang in his ears."
        - id: ch06-b04
          speaker: lion_cub
          text: "Get up!"
        - id: ch06-b05
          speaker: narrator
          text: "Below him, Manus saw a ship on the water. Inside it sat the lion cub, now wearing the pilot's shape. Together they sailed unseen through the fog and reached Lochlann. The lion cub, with the chain around his neck, sprang out of the ship, and Manus followed. The cub killed every man guarding the castle. He killed Iarlaid and Iarlaid's wife as well. And in the end, Manus, son of Oireal, was crowned king of Lochlann."
