audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳有力，带古老传说的庄重感
        timbre: 温厚清晰
        pace: 舒缓而富有张力
        pitch: 中低
    oireal:
      display_name: 奥里尔
      tts:
        delivery: 温和率直，不喜权势，面对威胁时仍守信
        timbre: 清朗柔和
        pace: 适中
        pitch: 中
    council_chief:
      display_name: 议事会首领
      tts:
        delivery: 威严强硬，言语果断
        timbre: 苍劲洪亮
        pace: 稍缓
        pitch: 低
    iarlaid:
      display_name: 伊阿莱德
      tts:
        delivery: 稳重克制，对兄长之子留有亲情
        timbre: 浑厚沉着
        pace: 适中
        pitch: 中低
    queen:
      display_name: 伊阿莱德的妻子
      tts:
        delivery: 冷厉专横，怒意深藏，嘲弄时尖刻
        timbre: 冷峻清晰
        pace: 适中
        pitch: 中
    manus:
      display_name: 马努斯
      tts:
        delivery: 年轻勇毅，受挫时忧郁却不失果断
        timbre: 明亮有力
        pace: 适中
        pitch: 中
    wise_man:
      display_name: 智者
      tts:
        delivery: 神秘郑重，警告时简洁笃定
        timbre: 苍老低沉
        pace: 缓慢
        pitch: 低
    red_armourer:
      display_name: 红衣铸甲师
      tts:
        delivery: 古朴豪爽，对旧主忠诚，话语直截了当
        timbre: 粗粝温厚
        pace: 稍缓
        pitch: 低
    lion_cub:
      display_name: 幼狮
      tts:
        delivery: 忠诚敏锐，开口时简短沉着
        timbre: 年轻而浑厚
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 两位王子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 遥远的西方大海彼岸，有个国王生了两个儿子，哥哥叫奥里尔，弟弟叫伊阿莱德。兄弟俩还很小，父母就相继去世了。国中召开大会，选出一人暂掌王权，等两位王子长大，再把国家交还给他们。
        - id: ch01-b02
          speaker: narrator
          text: 许多年过去，众人再次聚到一起，认定兄弟俩已经能够接掌自己的权力，便召他们来到议事会前。哥哥奥里尔身材不高，体格也比弟弟弱些。听完首领的话，他却不愿坐上王位。
        - id: ch01-b03
          speaker: oireal
          text: 我舍不得离开山上的鹿和河里的鱼。我不想整天坐着，替百姓裁断事情。
        - id: ch01-b04
          speaker: narrator
          text: 议事会首领顿时发了火。
        - id: ch01-b05
          speaker: council_chief
          text: 你今天若不立下你父王立过的誓言，以后休想得到一寸土地！
          emotion: angry
        - id: ch01-b06
          speaker: iarlaid
          text: 哥哥，不如国土一人一半。另一半交给我，你要治理的百姓就少了。
        - id: ch01-b07
          speaker: oireal
          text: 好，那就这么办。
        - id: ch01-b08
          speaker: narrator
          text: 于是，洛克兰一半臣民向奥里尔宣誓效忠，另一半向伊阿莱德宣誓效忠。兄弟俩照各自的心意治理领地。几年以后，他们都长成了下巴生着胡须的男子。伊阿莱德娶了希腊国王的女儿，奥里尔娶了奥克尼国王的女儿。第二年，两家各添一个男孩。奥里尔的儿子高大结实，伊阿莱德的儿子却瘦小孱弱。两个孩子身边又各有六名义兄弟，无论走到哪里，都有这些伙伴陪伴左右。
        - id: ch01-b09
          speaker: narrator
          text: 一天，奥里尔的儿子马努斯与堂弟带着十二名义兄弟，在学堂旁的大场地打曲棍球。那所学堂教给他们王子和贵族应当懂得的一切。众人玩了很久，球飞快地来回穿梭。马努斯一挥球杆，把球打向堂弟。那孩子从没受过这种冲撞，哪怕玩笑也受不了，马上哭喊着说自己伤得很重。他带着六名义兄弟回家，向母亲告状。母亲越听脸色越白，怒气却越来越盛。她推开儿子，径直闯进丈夫所在的议事厅。
        - id: ch01-b10
          speaker: queen
          text: 马努斯把球打向我儿子，分明想要他的命！必须除掉他，也除掉他那些恶行。
          emotion: angry
        - id: ch01-b11
          speaker: iarlaid
          text: 不行。我不能杀死哥哥的儿子。
        - id: ch01-b12
          speaker: queen
          text: 那他也别想杀死我的儿子。
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: 王后叫来宫廷总管，让他把小王子送到世界尽头四方褐色的边界，交给一位智者保护，绝不能让孩子受到伤害。智者将小王子安置在一座永远洒满阳光的山顶。从那里，他能看见世上每一个人，却没有谁能看见他。安排好自己的儿子，王后接着召来马努斯，将他关在城堡高塔中。整整一年，连马努斯的亲生母亲也无法同他说上一句话。后来，奥里尔的妻子病倒，马努斯才逃出囚禁自己的高塔，偷偷回到家中。
    - id: ch02
      title: 王后的圈套
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 马努斯平静地过了几年，伯母忽然派人召他。她发现侄儿已经长得像伊阿莱德一样高大强健，便装出一副为他打算的模样。
        - id: ch02-b02
          speaker: queen
          text: 你已经该成亲了。你长得强壮，相貌也好，我知道谁最适合做你的新娘。她是芬盖伯爵的女儿。那伯爵的封地归我管辖，我会带着大队随从亲自登门，你也跟我一起去。
        - id: ch02-b03
          speaker: narrator
          text: 众人果然来到伯爵家。伯爵夫人还想把女儿多留在身边一阵，可王后逼她让步。她威胁说，伯爵若不听命，就休想保住一寸土地。若肯把女儿嫁给马努斯，她倒愿意把自己王国的三分之一赐给伯爵，另外还会送上许多财宝。王后并不是疼爱马努斯，她只想借这桩婚事害死他。婚礼办成后，新婚夫妇随她骑马回到宫殿。当天夜里，一位智者来到熟睡的马努斯床前。这人是他父亲的朋友，特意唤醒他示警。
        - id: ch02-b04
          speaker: wise_man
          text: 奥里尔之子马努斯，危险就在身边。你娶到大伯爵的女儿，或许以为自己走了好运。可你知道王后替自己儿子找了怎样的新娘吗？那不是凡间女子，而是迅疾的三月风。你永远斗不过她。
        - id: ch02-b05
          speaker: manus
          text: 原来是这样吗？
          emotion: surprised
        - id: ch02-b06
          speaker: narrator
          text: 天边刚透出第一线晨光，马努斯便走进王后寝殿。王后正躺在侍女们中间。
        - id: ch02-b07
          speaker: manus
          text: 我来领取你许诺的王国三分之一，还有那些财宝。
        - id: ch02-b08
          speaker: narrator
          text: 王后听罢大笑起来。
        - id: ch02-b09
          speaker: queen
          text: 这里连一寸土地也不会给你。去老卑尔根找吧，也许那里的乱石和荒山下面，真有财宝等着你！
        - id: ch02-b10
          speaker: manus
          text: 那么，把你儿子的六名义兄弟交给我，让他们同我的六名义兄弟一起走。
        - id: ch02-b11
          speaker: narrator
          text: 王后答应了。马努斯带着十二人来到老卑尔根，在荒野中猎驯鹿，又挖下陷阱，等山羊掉进去。最初，他们生活得十分欢快。一年以后，马努斯渐渐厌倦了这个陌生地方，便与伙伴们乘船返回洛克兰。一路寒风猛烈，航程又格外漫长。到了一个春日，他们终于驶进伊阿莱德城堡下的港湾。王后站在窗口，亲眼看见马努斯沿山坡上来，十二名义兄弟紧随其后。
        - id: ch02-b12
          speaker: queen
          text: 马努斯带着十二个人回来了。我真想除掉他，让他再也不能行凶杀人。
        - id: ch02-b13
          speaker: iarlaid
          text: 那实在太可惜。无论如何，我不会动手。
        - id: ch02-b14
          speaker: queen
          text: 你不肯动手，那就由我来。
        - id: ch02-b15
          speaker: narrator
          text: 王后召来十二名义兄弟，逼他们向自己立誓效忠。马努斯身边转眼一个人也不剩，只得孤零零返回老卑尔根，心中满是悲伤。等他的脚踏上岸，天色已经很晚。他沿着小路向森林走去，途中迎面来了一个身穿红色短衣的男子。
    - id: ch03
      title: 铸甲师的礼物
      blocks:
        - id: ch03-b01
          speaker: red_armourer
          text: 马努斯，是你吗？你又回来了？
        - id: ch03-b02
          speaker: manus
          text: 是我。我独自从洛克兰回来了。
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: 红衣男子默默看了他一会儿，才说出自己的梦。
        - id: ch03-b04
          speaker: red_armourer
          text: 我梦见你腰间佩着剑，后来当上了洛克兰的国王。
        - id: ch03-b05
          speaker: manus
          text: 可我没有剑，连弓也断了。
        - id: ch03-b06
          speaker: red_armourer
          text: 你若答应我一件事，我就送你一柄新剑。
        - id: ch03-b07
          speaker: manus
          text: 假如我真能成为国王，我当然愿意答应。告诉我，你要什么承诺？
        - id: ch03-b08
          speaker: red_armourer
          text: 我从前替你祖父铸造甲胄。将来，我也想做你的铸甲师。
        - id: ch03-b09
          speaker: manus
          text: 这件事，我很乐意答应。
        - id: ch03-b10
          speaker: narrator
          text: 马努斯跟着他走进附近的房子。这里同普通人家大不相同，每间屋子的墙上都挂满兵器，密得连墙板也露不出来。男子让马努斯随意挑选。马努斯取下一柄剑，横在膝头一折，剑断了。第二柄和第三柄也是如此。
        - id: ch03-b11
          speaker: red_armourer
          text: 别再折我的剑了！试试这柄旧剑，还有这顶头盔和这件战袍。你祖父出征时，我穿的就是它们。它们的钢也许更结实。
        - id: ch03-b12
          speaker: narrator
          text: 马努斯把旧剑放在膝上，接连折了三次，剑身纹丝不动。他将剑佩在腰间，又戴好头盔。扣系带时，他忽然望见窗外有一块布迎风飘动。
        - id: ch03-b13
          speaker: manus
          text: 那是一块什么布？
        - id: ch03-b14
          speaker: red_armourer
          text: 那是森林里的小仙民亲手织成的布。你饿了，它会送来食物和饮品。要是碰见敌人，他们不但伤不了你，还会弯下身，亲吻你的手背，向你表示臣服。把它带走，好好使用。
        - id: ch03-b15
          speaker: narrator
          text: 马努斯高兴地把布缠在手臂上。刚要出门，又听见风吹得一条锁链哗啦作响。
        - id: ch03-b16
          speaker: manus
          text: 那条锁链又有什么用？
        - id: ch03-b17
          speaker: red_armourer
          text: 不管什么生灵，只要把它戴在脖子上，就不必害怕一百个敌人。
        - id: ch03-b18
          speaker: narrator
          text: 马努斯把锁链绕在身上，继续向森林深处走。两头狮子忽然带着一只幼狮从灌木间蹿出。三头猛兽高声咆哮，飞快地向他扑来，恨不得当场将他吞掉。马努斯立刻俯身，把小仙民织的布铺在地上。两头大狮子顿时停住脚步，垂下巨大的头颅，亲吻马努斯的手背，随后转身离开。那只幼狮却没有跟去，反而把身子蜷进布里。马努斯索性把布和幼狮一起抱起来，一路带回了老卑尔根。
    - id: ch04
      title: 幼狮与浓雾
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 又是一年过去。马努斯带着幼狮从老卑尔根出发，再次来到洛克兰。王后亲自出来迎接，身边跟着一条棕色小狗。小狗个头虽小，胆子却大。它一看见幼狮，便以为自己能吃掉对方，猛冲上前。幼狮一口咬住它的脖子，用力一甩，小狗当场死去。王后为它悲痛万分，心里的怒火也烧得更旺。此后，她屡次想杀死马努斯和幼狮，却一次也没能得手。最后，马努斯带着幼狮回了老卑尔根，十二名义兄弟也一同跟随而去。
        - id: ch04-b02
          speaker: queen
          text: 让他们走。我哥哥红发格鲁阿加赫无论在老卑尔根还是别处，都能砍下马努斯的脑袋。
        - id: ch04-b03
          speaker: narrator
          text: 信使将这番话送到奥里尔的妻子耳中。她一刻也不敢耽搁，赶紧派船去老卑尔根接儿子，想抢在红发格鲁阿加赫砍下马努斯的头以前，把他带走。船上还特意安排了一名领航人。可王后施法唤来浓雾，把整片海面遮得严严实实。桨手害怕把船划上礁石，谁也不敢动桨。入夜以后，眼睛锐利明亮的幼狮悄悄来到马努斯身边。马努斯骑上它的背，幼狮纵身跳到岸上，又让他留在礁石上等候。
        - id: ch04-b04
          speaker: lion_cub
          text: 你在礁石上歇一会儿，等我回来。
        - id: ch04-b05
          speaker: narrator
          text: 马努斯躺下睡着了。不知过了多久，一个声音在他耳边响起。
        - id: ch04-b06
          speaker: lion_cub
          text: 起来！
        - id: ch04-b07
          speaker: narrator
          text: 马努斯睁开眼，看见下方水面停着一艘船。幼狮已经化成领航人的样子，正坐在船中等他。他们驶入浓雾，一路没有被任何人发现，最后终于抵达洛克兰。幼狮把铸甲师送的锁链套在脖子上，率先跳下船，马努斯紧跟在后。幼狮杀死了城堡里的所有守卫，也杀死了伊阿莱德和他的妻子。到头来，奥里尔之子马努斯戴上王冠，成了洛克兰的国王。
