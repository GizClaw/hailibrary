  chapters:
    - id: ch01
      title: 魔镜与冰雪女王
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个坏透了的小妖怪。他造出一面魔镜，得意得不得了。善良美好的东西照进去，会缩得几乎看不见。丑陋邪恶的东西却格外清楚，还会变得更难看。最美的风景像一盘煮烂的菠菜，最好的人也会面目可憎，甚至头朝下倒立，连身子都不见了。脸上一粒小雀斑，也能铺满整个鼻子和嘴。
        - id: ch01-b02
          speaker: imp
          text: 这才是这面镜子最妙的地方！
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: 有一天，镜子掉下来，摔成了亿万片，还不止亿万片。这才招来了最大的灾祸。每块碎片都小得像沙粒，随风飞遍全世界。谁的眼睛里落进一片，它就永远留在那里，让那个人把一切看颠倒，或者只看得见事情坏的一面。因为再小的碎屑，也有整面魔镜的力量。有些碎片扎进人的心里，那就更可怕了，那颗心会慢慢冻成一块冰。小妖怪笑得肚子都疼了，可细小的镜片还在四处飘飞。
        - id: ch01-b04
          speaker: narrator
          text: 后来的事，发生在一座拥挤的大城里。那里人多，房屋也多，不是家家都有地方造花园。两个穷孩子住在隔街相对的阁楼中。他们不是兄妹，却像亲兄妹一样相爱。男孩叫凯，女孩叫格尔达。两家的父母各住一边，屋顶的铅皮平台上各摆着一只花箱。箱里长着香豌豆和两株茂盛的玫瑰。夏天，两个孩子搬出小椅子，坐在玫瑰花下，玩许多有趣的游戏。冬天不能在外面玩，他们就把烧热的铜板贴上结冰的窗玻璃，化出一个个圆洞，再隔着街从洞里看见对方。
        - id: ch01-b05
          speaker: narrator
          text: 一个下雪的日子，老祖母望着窗外纷飞的雪片，给孩子们讲起了故事。
        - id: ch01-b06
          speaker: grandmother
          text: 瞧，那是成群的白蜜蜂在飞呢。
        - id: ch01-b07
          speaker: kay
          text: 白蜜蜂也有蜂王吗？
        - id: ch01-b08
          speaker: grandmother
          text: 当然有。雪片最密的地方，就是她飞过的地方。她比所有雪片都大，从不落到地面，总会飞回黑云里。半夜，她常常沿街飞过，一扇窗一扇窗地往里看。窗玻璃这才结出花一样的冰纹。
        - id: ch01-b09
          speakers: [kay, gerda]
          ensemble: duo
          text: 对呀，我们见过那些冰花。
        - id: ch01-b10
          speaker: gerda
          text: 冰雪女王会进到我们这里吗？
        - id: ch01-b11
          speaker: kay
          text: 她尽管来！我就把她放到炉子上融掉！
        - id: ch01-b12
          speaker: narrator
          text: 祖母只摸了摸他的头发，接着讲别的故事。当天夜里，凯临睡前跳上窗边的椅子，从冰洞往外看。外面零零落落飘着几片雪花，最大的一片落在花箱边。它越长越大，最后成了一位披着最轻最细白纱的姑娘。她美丽又纤巧，全身却都是坚硬晶亮的冰。她是活的，双眼像两颗清亮的星星那样闪耀，眼里却没有安宁，也没有温情。她朝窗口点了点头，又招了招手。凯吓得从椅子上跳下来。再看窗外时，他只觉得一只巨大的白鸟从眼前飞了过去。
        - id: ch01-b13
          speaker: narrator
          text: 冬去春来，夏天的玫瑰开得比往年更美。一天，凯和格尔达正看图画书，教堂钟声刚敲过五下，他突然叫了起来。
        - id: ch01-b14
          speaker: kay
          text: 哎哟！有东西扎进我的心了，眼睛里也进了东西！
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: 格尔达连忙搂住他。凯使劲眨眼，可她什么也没找到。
        - id: ch01-b16
          speaker: kay
          text: 我想，已经掉出来了。
        - id: ch01-b17
          speaker: narrator
          text: 其实没有。魔镜的碎片留在了他的眼里，另一片扎进心中，正把他的心慢慢冻成冰。凯并不觉得疼。
        - id: ch01-b18
          speaker: kay
          text: 你哭什么？哭起来真难看。我一点事也没有。再看看这些玫瑰，一朵被鼻涕虫啃坏了，一朵长得又矮又小，难看死了！
        - id: ch01-b19
          speaker: narrator
          text: 他把花一朵朵扯碎。
        - id: ch01-b20
          speaker: gerda
          text: 凯，你这是在做什么？
          emotion: surprised
        - id: ch01-b21
          speaker: narrator
          text: 见她吓成这样，凯偏偏又揪下一朵玫瑰，然后钻回自家窗口，把亲爱的格尔达丢在外面。从此，他整个人都变了。格尔达带图画书来找他，他嫌那是小娃娃才看的东西。祖母讲故事，他总要插嘴说一句“可是”，再躲到祖母身后，戴上她的眼镜，学她说话。他模仿得惟妙惟肖，大家全被逗笑了。没过多久，街上每个人走路、说话的模样，他都能学得像模像样。就连他的游戏，也和过去完全不同。
        - id: ch01-b22
          speaker: narrator
          text: 到了冬天，他用聚光镜接住雪花，叫格尔达来看。
        - id: ch01-b23
          speaker: kay
          text: 快看镜子里的雪花！它们多整齐，比真的花有意思多了。每一片都完美，全按规矩长。要是永远不融化就好了！
        - id: ch01-b24
          speaker: narrator
          text: 一天早晨，凯戴上手套，把小雪橇挂在肩头，跑出了门。
        - id: ch01-b25
          speaker: kay
          text: 我去广场，跟别的男孩子玩雪橇！
        - id: ch01-b26
          speaker: narrator
          text: 广场上的男孩常把雪橇拴在乡下人的马车后，跟着滑上一程。玩得正起劲时，一辆巨大的白雪橇来了。驾车人穿着厚厚的白毛皮大衣，戴着白毛皮帽。大雪橇绕了两圈，凯便把自己的小雪橇系在后面。
        - id: ch01-b27
          speaker: narrator
          text: 大雪橇越跑越快，先拐进另一条街，又一直驶出城门。驾车人回头亲切地向凯点头，仿佛早就认识他。凯每次想解开绳子，那人就再点一次头，他便又乖乖坐好。城外的雪越下越密，凯连眼前的手也看不见，可雪橇还在不停飞驰。他终于慌忙去解绳子，想甩开前面的大雪橇，却一点用也没有。小雪橇像牢牢粘住了，仍然迎着风向前冲。他放声呼救，没有人听见，心里怕极了。
        - id: ch01-b28
          speaker: narrator
          text: 雪花变成一群巨大的白鸟，忽然又一齐飞开。大雪橇停下，驾车人站了起来。她的帽子和大衣全是雪做的。她正是冰雪女王，高挑纤细，浑身闪耀。
        - id: ch01-b29
          speaker: snow_queen
          text: 我们走了很远。你快冻僵了，到我的斗篷里来吧。
        - id: ch01-b30
          speaker: narrator
          text: 她让凯坐到身边，用斗篷裹住他。凯仿佛正往雪堆深处沉。
        - id: ch01-b31
          speaker: snow_queen
          text: 现在还冷吗？
        - id: ch01-b32
          speaker: narrator
          text: 她吻了吻凯的额头。那个吻冷得像冰，一直寒进心底，而他的心早已冻了一半。
        - id: ch01-b33
          speaker: kay
          text: 我的雪橇！别把我的雪橇忘了！
        - id: ch01-b34
          speaker: narrator
          text: 这竟是他先想到的事。一只巨大的白鸟驮着小雪橇，跟在他们后面。冰雪女王又吻了他一下。格尔达、老祖母和家里每一个人，立刻从他的记忆中消失了。
        - id: ch01-b35
          speaker: snow_queen
          text: 我不能再吻你了。再吻一次，你会死的。
        - id: ch01-b36
          speaker: narrator
          text: 他们飞过森林、湖泊、海洋和陆地。寒风呼啸，狼群长嗥，乌鸦尖叫着掠过头顶。大而明亮的月亮挂在高空。凯就这样度过漫长的冬夜，白天便睡在冰雪女王脚边。
    - id: ch02
      title: 被遗忘的花园
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 凯再也没有回来。别的男孩只知道，他把小雪橇拴到一辆大雪橇后面，跟着出了城。格尔达哭了很久。那个冬天，对她又漫长，又黑暗。等温暖的春光终于到来，她下定了决心。
        - id: ch02-b02
          speaker: gerda
          text: 我要去找凯。
        - id: ch02-b03
          speaker: narrator
          text: 她来到河边，登上一只小船，水流很快把船带向下游。
        - id: ch02-b04
          speaker: gerda
          text: 也许这条河能带我找到凯。
        - id: ch02-b05
          speaker: narrator
          text: 小船穿过树林和田野，漂到一座大樱桃园前。园里有一间草顶小屋，窗户漆成红色和蓝色。门前两个木头士兵扛着枪。格尔达朝他们喊，他们当然不回答。船被水推到岸边，屋里走出一位拄着拐杖的老婆婆，宽大的遮阳帽上画满鲜花。
        - id: ch02-b06
          speaker: old_witch
          text: 可怜的小姑娘！
        - id: ch02-b07
          speaker: narrator
          text: 她踏进水里，用拐杖钩住小船，把格尔达抱了出来。
        - id: ch02-b08
          speaker: old_witch
          text: 跟我来吧。告诉我，你是谁，怎么会漂到这里？
        - id: ch02-b09
          speaker: narrator
          text: 格尔达讲完自己的经历，问她见没见过凯。老婆婆说凯还没来，不过很快就会经过。她让格尔达放心住下，吃樱桃，看会讲故事的花。说完便牵她进屋，关上了门。
        - id: ch02-b10
          speaker: narrator
          text: 小屋的窗户开得很高，玻璃有红、蓝、黄三种颜色。阳光穿过玻璃，屋里也染上了缤纷的色彩。桌上摆满美味的樱桃，老婆婆让格尔达想吃多少就吃多少。格尔达吃樱桃的时候，她便拿一把金梳子替小姑娘梳头。美丽的金发在那张柔软甜美的小脸四周泛起波浪，亮晶晶地闪着光。
        - id: ch02-b11
          speaker: old_witch
          text: 我一直盼着有个你这样可爱的小姑娘。等着看吧，我们在一起会多么快活。
        - id: ch02-b12
          speaker: narrator
          text: 金梳子一下下梳过头发，格尔达想起凯的次数也越来越少。老婆婆原来是个女巫，却不是坏女巫。她只是偶尔施点魔法，给自己解闷，也实在太想把这个可爱的小姑娘留下。于是，她独自走进花园，对着所有玫瑰花丛挥了挥手杖。无论花朵还是叶子，全都沉进黑土里，再也看不出原来长在哪里。老婆婆怕格尔达看见玫瑰，就会想起自己家的玫瑰。她一旦想起玫瑰，便会记起凯，随后一定会逃走。
        - id: ch02-b13
          speaker: narrator
          text: 老婆婆领格尔达走进花园。那里绚丽极了，空气里到处飘着醉人的花香。凡是能想到的花，这里都有，而且一年四季开个不停。格尔达高兴得跳起来，一直玩到太阳落在高高的樱桃树后。夜里，她睡在美丽的小床上，枕着塞满紫罗兰的红绸枕头，睡得又香又沉，还做着女王新婚之夜才会做的梦。第二天，她又在温暖的阳光下和花儿玩。许多天就这样过去了。格尔达认识了每一朵花，可花明明那么多，她却总觉得少了一种，怎么也想不起少的是什么。
        - id: ch02-b14
          speaker: narrator
          text: 一天，她望着老婆婆的花帽，忽然看见上面画着一朵玫瑰。女巫变走花园的玫瑰时，偏偏忘了帽子上的这一朵。
        - id: ch02-b15
          speaker: gerda
          text: 咦，园子里怎么一朵玫瑰也没有？
          emotion: surprised
        - id: ch02-b16
          speaker: narrator
          text: 她在百花中找了一遍又一遍，真的一朵玫瑰也没有。她伤心地坐下来哭泣，眼泪恰好落在一株沉入地下的玫瑰上。温热的泪水润湿泥土，玫瑰丛便从土里钻了出来，花开得跟从前一样繁盛。格尔达一朵朵亲吻它们。她想起家中那些可爱的玫瑰，而玫瑰一回到记忆里，她也终于想起了亲爱的小凯。
        - id: ch02-b17
          speaker: gerda
          text: 哎呀，我都做了什么！我明明是来找凯的！
          emotion: sad
        - id: ch02-b18
          speaker: narrator
          text: 她跑到花园尽头，用力推开锈住的门锁，赤着脚逃了出去。没有人追她。等她累得坐上大石头，才发现夏天早已过去，外面已是深秋。魔法花园终年有阳光和鲜花，她根本看不出季节变了。
        - id: ch02-b19
          speaker: gerda
          text: 天哪，我耽搁得太久了！都到秋天了，我不能休息！
          emotion: surprised
        - id: ch02-b20
          speaker: narrator
          text: 她跳起来继续赶路。小脚越来越酸，越来越痛，天气也越来越冷。她只得再次停下，而前方的雪地上，正站着一只大乌鸦。
    - id: ch03
      title: 王宫里的陌生王子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 乌鸦站在雪地上，已经打量格尔达好一会儿。它点了点头，先嘎嘎叫了两声，又向她问好。接着，它问这个小女孩为什么孤零零地流落在外。格尔达从头讲起自己的故事，告诉它凯怎样不见了，也问它一路上有没有见过凯。
        - id: ch03-b02
          speaker: raven
          text: 嘎，嘎！也许见过，也许见过！
        - id: ch03-b03
          speaker: gerda
          text: 什么？你真的觉得见过他？
          emotion: surprised
        - id: ch03-b04
          speaker: narrator
          text: 她搂住乌鸦又亲又抱，差点把它勒死。
        - id: ch03-b05
          speaker: raven
          text: 轻点儿，轻点儿！我想，我知道的那个人也许就是凯。不过他为了公主，已经把你忘了！
        - id: ch03-b06
          speaker: gerda
          text: 他跟一位公主住在一起？
        - id: ch03-b07
          speaker: raven
          text: 对，你听我说。这个王国有位聪明绝顶的公主。全世界的报纸她都读过，又全忘了，她就是这么聪明。她登上王位以后，觉得做女王也没有人们说的那么快活，于是想找个丈夫。那人得会好好回答她的问题，不能光站得笔直，装出体面的样子。那多无聊呀！
        - id: ch03-b08
          speaker: raven
          text: 公主把主意告诉宫廷女官，她们高兴极了。我说的全是真的。我的心上人在宫里，是只家养的乌鸦，什么事都会告诉我。
        - id: ch03-b09
          speaker: narrator
          text: 第二天一早，报纸便登出一张告示。告示四周围着心形花边，上面还印着公主名字的花押。告示说，凡是相貌端正的年轻男子，都可以进宫跟公主交谈。说话响亮清楚的人，会得到好饭好菜，也会受到周全招待。所有人中谈吐最出色的那个，便能成为公主的丈夫。
        - id: ch03-b10
          speaker: raven
          text: 年轻人像潮水一样涌来。头两天，谁也没成功。他们在街上能说会道，一进宫，看见银衣卫兵、金衣仆从和灯火通明的大厅，马上没了主意。到了公主面前，他们只会重复公主刚说的最后一个词。公主当然不愿再听一遍。他们出宫时像在梦游，走到街上才又会说话。等候的队伍从王宫一直排到城门！
        - id: ch03-b11
          speaker: raven
          text: 那些人又饿又渴，宫里连水也不给。几个聪明人带了黄油面包，却不肯分给旁人。他们巴不得别人饿着，好让公主看不上对方。
        - id: ch03-b12
          speaker: gerda
          text: 那凯呢？他什么时候来的？也排在队伍里吗？
        - id: ch03-b13
          speaker: raven
          text: 别急，这就说到他了。第三天来了个小小的人影。他没骑马，也没坐车，轻快地直奔王宫。他的眼睛跟你一样明亮，头发卷曲得很好看，衣服却很寒酸。
        - id: ch03-b14
          speaker: gerda
          text: 就是凯！我找到他了！
          emotion: happy
        - id: ch03-b15
          speaker: narrator
          text: 她欢喜地拍起手来。
        - id: ch03-b16
          speaker: raven
          text: 他背上还背着一个小包袱。
        - id: ch03-b17
          speaker: gerda
          text: 那一定是他的冰鞋。他离开时带着冰鞋呢！
        - id: ch03-b18
          speaker: raven
          text: 很可能，我没看清。我的心上人说，他看见宫门的银衣卫兵和楼梯上的金衣仆从，一点也不慌。他还朝他们点头，说站在楼梯上太无聊，自己还是进去好。大厅里，大臣和使节穿着无声的鞋，捧着金盘走来走去。可他的靴子吱呀乱响，他照样不怕。
        - id: ch03-b19
          speaker: gerda
          text: 一定是凯！他有双新靴子，我在他祖母屋里听过那吱呀声！
        - id: ch03-b20
          speaker: raven
          text: 响得可厉害了！他径直走到公主面前。公主坐在一颗纺车那么圆的大珍珠上。女官和男官带着各自的侍从站在四周，离门越近的人，神气越傲慢。
        - id: ch03-b21
          speaker: gerda
          text: 听着真吓人！凯娶到公主了吗？
        - id: ch03-b22
          speaker: raven
          text: 我的心上人说，他又快活又机灵。他并不是来求婚的，只想听听公主有多聪明。结果两个人彼此相爱了。
        - id: ch03-b23
          speaker: gerda
          text: 那肯定是凯！他聪明得连分数都会算。求你带我去王宫吧！
        - id: ch03-b24
          speaker: raven
          text: 说着容易，可怎么进去呢？我得跟心上人商量。也许她有办法。不过，宫里绝不会准许你这样的小姑娘进去。
        - id: ch03-b25
          speaker: gerda
          text: 我一定进得去！凯听说我来了，会马上出来接我！
        - id: ch03-b26
          speaker: raven
          text: 那就在栏杆旁等我。
        - id: ch03-b27
          speaker: narrator
          text: 乌鸦飞走了，直到深夜才回来。
        - id: ch03-b28
          speaker: raven
          text: 嘎，嘎！她向你问好，还从厨房拿来一个小面包卷。你一定饿了。正门进不去，卫兵和仆从不会放行。不过别哭，你还是能进去。我的心上人知道通往寝宫的后楼梯，也知道钥匙在哪儿。
        - id: ch03-b29
          speaker: narrator
          text: 他们走进王宫花园，等里面的灯一盏接一盏熄灭，乌鸦才把格尔达领到一扇后门前。格尔达的心又急切又期待，怦怦跳得厉害。她觉得自己仿佛要去做一件不该做的事，可她只是想弄清那人到底是不是小凯。一定是他，她这样想着。她清清楚楚记得凯聪明的眼睛和卷曲的头发，仿佛又看见他坐在自家玫瑰花下，像从前那样朝她微笑。凯见到她，再听她说起家里每个人的近况，一定会非常高兴。
        - id: ch03-b30
          speaker: narrator
          text: 楼梯平台上点着一盏小灯，那只家养的乌鸦正在等候。她歪头看着格尔达。格尔达照祖母教的样子向她行礼。
        - id: ch03-b31
          speaker: tame_raven
          text: 亲爱的小小姐，我未婚夫说了你许多好话。请你提灯走在我后面。走这条路，我们不会碰见任何人。
        - id: ch03-b32
          speaker: narrator
          text: 他们走过一间又一间华美的屋子，四周安静极了，最后终于来到寝宫。屋子中央有一根粗大的金杆，上面悬着两张百合花形的床。一张雪白，公主睡在里面。另一张火红，格尔达满心盼望能在那里找到凯。她轻轻掀开帷幔，看见一段棕色的脖颈。啊，一定是凯！她把灯高高举起，大声呼喊他的名字。
        - id: ch03-b33
          speaker: narrator
          text: 那人醒来转过头，却不是凯。他只是脖颈很像凯，是一位年轻英俊的王子。公主也从白色花床上坐起，询问来人。格尔达哭着讲了自己的故事，也说出两只乌鸦怎样帮她。
        - id: ch03-b34
          speakers: [prince, princess]
          ensemble: duo
          text: 可怜的孩子！
          emotion: sad
        - id: ch03-b35
          speaker: narrator
          text: 王子和公主称赞两只乌鸦，说这次并不生气，不过以后不能再这样。现在，该奖赏它们了。
        - id: ch03-b36
          speaker: princess
          text: 你们愿意自由飞走，还是留在宫里做宫廷乌鸦，一辈子吃厨房里的东西？
        - id: ch03-b37
          speaker: narrator
          text: 两只乌鸦一齐鞠躬，请求长久留在宫廷，因为它们想到了晚年。大家让格尔达上床休息。她合起双手，想着人和动物待她真好，便睡着了。
        - id: ch03-b38
          speaker: narrator
          text: 第二天，宫里的人从头到脚给格尔达换上绫罗绸缎。王子和公主想请她留在宫中，她却请求他们送自己一辆小马车、一匹马和一双鞋。她还要重新出发，到广阔的世界去寻找凯。他们答应了，还送给她一只暖手筒。等她穿得暖暖和和，准备妥当，门前已经停着一辆纯金马车。车夫、仆从和骑着前导马的驭手，头上全都戴着金王冠。
        - id: ch03-b39
          speaker: narrator
          text: 王子和公主扶她上车，祝她一路顺利。已经结婚的野乌鸦陪她走了三英里，宫廷乌鸦却头痛得来不了。
        - id: ch03-b40
          speakers: [prince, princess]
          ensemble: duo
          text: 再见，一路平安！
        - id: ch03-b41
          speaker: narrator
          text: 格尔达哭了，乌鸦也哭了。分别时，乌鸦飞上一棵树，挥着黑翅膀，直到太阳般明亮的马车消失在远方。
    - id: ch04
      title: 强盗营地
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 走了很久以后，马车来到一片幽暗的森林。四周黑沉沉的，金马车却把树木之间照得明亮，如同有人点起一支巨大的火把。藏在林中的强盗一看见这片金光，便从四面八方冲了出来，贪婪地大声叫喊。
        - id: ch04-b02
          speakers: [robber_1, robber_2, robber_3]
          ensemble: chorus
          text: 金子！金子！
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: 强盗们一拥而上，抓住拉车的马。他们杀死车夫、仆从和骑着前导马的驭手，又把小格尔达从金马车里拖了出来。年老的强盗女王看见这个白白胖胖的小姑娘，马上拔出一把长刀。锋利的刀刃闪出一道骇人的寒光。
        - id: ch04-b04
          speaker: old_robber_woman
          text: 她白白胖胖，肉一定很嫩！我要吃了她！
        - id: ch04-b05
          speaker: robber_girl
          text: 不许杀她！她要陪我玩。她的暖手筒和漂亮衣服也都归我，还要让她睡在我床上。
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 小强盗姑娘跟格尔达一般高，却更强壮，肩膀也更宽。她头发深黑，眼睛乌亮，一把搂住格尔达。
        - id: ch04-b07
          speaker: robber_girl
          text: 只要你听话，他们就不会杀你。你是公主吗？
        - id: ch04-b08
          speaker: gerda
          text: 我不是公主。
        - id: ch04-b09
          speaker: narrator
          text: 格尔达把自己的经历和对凯的爱全说了出来。强盗姑娘严肃地望着她，点了点头。
        - id: ch04-b10
          speaker: robber_girl
          text: 就算你不听话，他们也不能杀你。到时候，我会亲手杀你！
        - id: ch04-b11
          speaker: narrator
          text: 强盗姑娘替格尔达擦干眼泪，又把自己的两只手都塞进那只漂亮暖和的暖手筒。接着，她把格尔达带到营地一角，那就是她睡觉的地方。四周栖息着一百多只野鸽子。它们看上去像睡着了，可两个女孩一走近，鸽子们还是轻轻动了动。附近还拴着一头驯鹿。强盗姑娘用又长又尖的刀子搔它，故意拿它取乐。格尔达躺下以后，过了很久也没能睡着。
        - id: ch04-b12
          speakers: [wild_dove_1, wild_dove_2]
          ensemble: duo
          text: 咕咕！我们见过小凯。白鸟驮着他的雪橇，他坐在冰雪女王的车里，从森林上空飞过去。那时小鸽子还在巢里。女王朝它们吹了一口气，除了我们两个，别的全死了。咕咕！
          emotion: fearful
        - id: ch04-b13
          speaker: gerda
          text: 你们说什么？冰雪女王要去哪里？你们知道吗？
          emotion: surprised
        - id: ch04-b14
          speaker: wild_dove_1
          text: 她大概去了拉普兰，那里一年到头都是冰雪。你问驯鹿吧。
        - id: ch04-b15
          speaker: reindeer
          text: 那里有最好的冰雪，可以在闪亮的大山谷里尽情跳跃。冰雪女王的夏宫就在拉普兰，她最好的宫殿却在北极附近一个叫斯匹次卑尔根的岛上。
        - id: ch04-b16
          speaker: gerda
          text: 凯啊，我的小凯！
          emotion: sad
        - id: ch04-b17
          speaker: robber_girl
          text: 躺好，不许动！不然我拿刀扎你！
        - id: ch04-b18
          speaker: narrator
          text: 第二天早晨，格尔达把鸽子的话告诉强盗姑娘。强盗姑娘转头问驯鹿。
        - id: ch04-b19
          speaker: robber_girl
          text: 你知道拉普兰在哪里吗？
        - id: ch04-b20
          speaker: reindeer
          text: 当然知道！我就是在那里的雪原上长大的。
          emotion: happy
        - id: ch04-b21
          speaker: robber_girl
          text: 听好。强盗们已经出去了，只剩我母亲。下午她会睡着，到时候我替你办一件事。
        - id: ch04-b22
          speaker: narrator
          text: 母亲睡着后，强盗姑娘来到驯鹿跟前。
        - id: ch04-b23
          speaker: robber_girl
          text: 我放你回拉普兰。不过你得跑快点，把这个小姑娘驮到冰雪女王的宫殿。她的玩伴就在那里。她说得那么响，你肯定都听见了！
        - id: ch04-b24
          speaker: narrator
          text: 驯鹿欢喜得高高跳了起来。强盗姑娘把小格尔达抱上鹿背，仔细把她绑牢，免得她在飞奔时跌下去。她甚至拿来一只小枕头，垫在格尔达身下，给她当作鞍子。
        - id: ch04-b25
          speaker: robber_girl
          text: 穿上毛皮靴，那里冷得很。暖手筒我要留下，它太舒服了！可我不会让你冻坏。拿着我母亲的大手套，戴上一直能包到胳膊肘。快把手伸进去！
        - id: ch04-b26
          speaker: narrator
          text: 格尔达高兴得哭了。
        - id: ch04-b27
          speaker: robber_girl
          text: 别哭丧着脸，你该高兴才对。再拿两条面包和一根香肠，这样就不会挨饿了！
        - id: ch04-b28
          speaker: narrator
          text: 她把食物绑好，打开门，赶开大狗，再用刀割断缰绳。
        - id: ch04-b29
          speaker: robber_girl
          text: 快跑！一定要照顾好这个小姑娘。
        - id: ch04-b30
          speaker: gerda
          text: 再见！
        - id: ch04-b31
          speaker: narrator
          text: 格尔达伸出戴着大手套的双手告别。驯鹿飞一样掠过地面，拼尽全力奔进茫茫森林。狼群长嗥，乌鸦尖叫，天空像燃烧起来。
        - id: ch04-b32
          speaker: reindeer
          text: 那是我的老朋友，北极光。看，它们多亮！
          emotion: happy
        - id: ch04-b33
          speaker: narrator
          text: 它跑得更快，日夜不停。面包吃完了，香肠也吃完了，他们终于来到拉普兰。
    - id: ch05
      title: 冰雪宫殿
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 他们在一间破破烂烂的小屋前停下来。那里的屋顶低得几乎贴住地面，门更是矮小，无论进去还是出来，都得趴下身子爬过去。屋里只住着一位拉普兰老太太，她正借着油灯那一点火焰煮鱼。驯鹿把格尔达的经历全告诉她，不过，它先从头讲了自己的故事，因为在它看来，自己的故事当然重要得多。格尔达一路上已经冻透了，这时连一句话也说不出来。
        - id: ch05-b02
          speaker: lapland_woman
          text: 唉，可怜的孩子！你们还要赶很远的路。再走一百多英里，到芬兰去。冰雪女王住在那里，每晚都会放孟加拉焰火。我没有纸，就在鳕鱼干上写几句话。把它交给芬兰老太太，她会告诉你们该怎么办。
        - id: ch05-b03
          speaker: narrator
          text: 格尔达在小屋里渐渐暖和过来，又吃了些东西，喝了些热饮。拉普兰老太太真的在晒干的鳕鱼上写好字，反复叮嘱格尔达一定要收好。随后，她把小姑娘牢牢绑回驯鹿背上，他们再次出发。整整一夜，北极光把天空照得像火一样明亮。他们不停赶路，终于来到芬兰。那里的小屋连门也没有，他们只好爬上屋顶，敲了敲芬兰老太太家的烟囱。
        - id: ch05-b04
          speaker: narrator
          text: 芬兰老太太的屋里热得厉害，她身上只穿了很少的衣服。她解开捆着格尔达的带子，脱下小姑娘的毛皮手套和靴子，免得她热坏。接着，她在驯鹿头顶放上一块冰，又拿起那条鳕鱼干读字。她一连读了三遍，直到把所有话都牢牢记住，才把鱼扔进锅里。她从来不浪费任何东西。驯鹿照旧先讲自己的故事，然后才讲格尔达的故事。芬兰老太太听完只是眨了眨眼，一句话也没有说。
        - id: ch05-b05
          speaker: reindeer
          text: 我知道你非常聪明。能不能给小姑娘喝点什么，让她有十二个人的力气，好打败冰雪女王？
        - id: ch05-b06
          speaker: finnish_woman
          text: 十二个人的力气也没有多大用。凯很喜欢冰雪女王那里，以为那是世上最好的地方。因为他的心里和眼睛里都扎着玻璃。碎片不出来，他就得不到自由，女王也会一直控制他。
        - id: ch05-b07
          speaker: reindeer
          text: 那你能不能给格尔达一点力量，让她制服冰雪女王？
        - id: ch05-b08
          speaker: finnish_woman
          text: 她已经有世上最大的力量，我再也给不了更多。她光着脚走进这么大的世界，人和野兽都来帮助她，这力量还不够大吗？她的力量，就在她善良又纯真的心里。如果她不能靠自己救出凯，我们也帮不了她。女王的花园离这里两英里。你把她送到雪地里那株结满红浆果的大灌木旁，再赶紧回来。
        - id: ch05-b09
          speaker: narrator
          text: 芬兰老太太把格尔达抱上鹿背，驯鹿飞奔而去。
        - id: ch05-b10
          speaker: gerda
          text: 哎呀，我的手套和靴子忘在那里了！
          emotion: surprised
        - id: ch05-b11
          speaker: narrator
          text: 刺骨寒风让她马上发现少了它们，可驯鹿不敢停。它一直跑到红浆果灌木旁，放下格尔达，吻了吻她。大颗眼泪滚过驯鹿的脸，它随即转身离开。格尔达没有鞋，也没有手套，独自站在芬兰彻骨的寒冷里。
        - id: ch05-b12
          speaker: narrator
          text: 她拼命向前跑。一队巨大的雪花迎面扑来，却在碰到她时一片片融化。格尔达又有了勇气，顶着严寒继续向前。此时的凯没有想起她，更不会梦到，她已经孤零零地站在冰雪女王的宫殿外面。
        - id: ch05-b13
          speaker: narrator
          text: 冰雪宫殿的墙，是狂风吹积起来的雪。它的门和窗，则是刺骨的寒风。里面足有一百多座大厅，全用冻雪垒成。最大的一座绵延好几英里，明亮的北极光照在里面。那些大厅宽阔得没有边际，却也空空荡荡，寒冷得没有一丝暖意，到处闪着冰冷的光。最大的大殿中央是一座冰封的湖。湖面裂成了上千块，每一块的形状都分毫不差。冰雪女王在家时，总是坐在这座湖的中央。
        - id: ch05-b14
          speaker: narrator
          text: 小凯已经冻得身上青一块、黑一块，可他一点也感觉不到冷。冰雪女王的吻夺走了他的知觉，他那颗心也早就变成一块冰。他拨弄着一些又尖又扁的冰片，试着把它们拼在一起。因为眼中还扎着魔镜的碎片，在他看来，每一片冰都美得不得了。他用冰片拼出一个又一个形状，却始终想拼出一个特别的字。那个字就是“爱”，可他怎么摆也摆不出来。
        - id: ch05-b15
          speaker: snow_queen
          text: 只要你拼出这个字，就能做自己的主人。我会把整个世界和一双新冰鞋都送给你。
        - id: ch05-b16
          speaker: narrator
          text: 可凯怎么也拼不成。这时，冰雪女王准备出门。
        - id: ch05-b17
          speaker: snow_queen
          text: 我要飞到温暖的国家，给我的黑锅撒些粉。这样对柠檬和葡萄都有好处。
        - id: ch05-b18
          speaker: narrator
          text: 她说的黑锅，就是埃特纳火山和维苏威火山。女王飞走后，凯独自留在大殿，继续摆冰片。他一动不动，看上去像已经冻僵了。
        - id: ch05-b19
          speaker: narrator
          text: 就在这时，格尔达走进大殿。她刚踏进这座巨大空旷的冰厅，刺骨的风就安静下来，仿佛全睡着了。她一眼认出凯，跑过去搂住他的脖子。
        - id: ch05-b20
          speaker: gerda
          text: 凯！亲爱的小凯！我终于找到你了！
          emotion: happy
        - id: ch05-b21
          speaker: narrator
          text: 凯还是冷冰冰地坐在那里，没有回应。格尔达抱着他流泪，滚烫的泪珠滴在他的脖子上，又一直流进他的心里。泪水融化了冻住心脏的冰块，也冲走了扎在里面的魔镜碎屑。凯终于抬起眼睛看她，忽然失声痛哭。他哭得那么厉害，藏在眼睛里的玻璃碎片也随着泪水流了出来。眼前的一切不再颠倒，他终于认出了格尔达。
        - id: ch05-b22
          speaker: kay
          text: 格尔达！亲爱的小格尔达！这么久，你去了哪里？我自己又到了什么地方？
          emotion: surprised
        - id: ch05-b23
          speaker: narrator
          text: 他望向四周。
        - id: ch05-b24
          speaker: kay
          text: 这里好冷，又大又空！
        - id: ch05-b25
          speaker: narrator
          text: 凯一头扑进格尔达怀中。格尔达高兴得又哭又笑，这一刻实在太幸福了。就连四周那些冰片也欢喜起来，在地面上跳起舞。它们跳了很久，等到终于跳累，重新一片片落回冰面时，竟恰好拼成了冰雪女王要求的那个字。凯终于能够做自己的主人，也可以得到女王许诺的整个世界和一双新冰鞋。
        - id: ch05-b26
          speaker: narrator
          text: 格尔达亲吻凯的双颊，脸颊重新红润。她吻他的眼睛，眼睛又明亮起来。她再吻他的手脚，凯全身都恢复了温暖和活力。现在冰雪女王尽管回来吧。凯获得自由的凭证，那个“爱”字，正清清楚楚地写在闪亮的冰面上。
    - id: ch06
      title: 温暖灿烂的夏天
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 凯和格尔达手拉着手，走出巨大的宫殿。一路上，他们说起老祖母，也说起屋顶平台的玫瑰。他们走到哪里，哪里的风便安静，太阳也露出脸来。到了红浆果灌木旁，驯鹿正在等候。
        - id: ch06-b02
          speaker: narrator
          text: 驯鹿先驮他们去芬兰老太太那里。她在炎热的小屋中替两个孩子暖身，又告诉他们回家的路。接着，他们去找拉普兰老太太。她给两人换上新衣服，还修好了雪橇。驯鹿继续驮着他们，直到来到一片刚被春天染绿的草地，才向他们告别。
        - id: ch06-b03
          speaker: narrator
          text: 他们走进正在抽芽的森林。一匹神气的马从林中出来，格尔达认出，那正是从前拉金马车的马。马背上坐着一个戴红帽、腰间插着手枪的年轻女孩。原来小强盗姑娘在家待腻了，也出来闯荡。她和格尔达立刻认出了彼此。
        - id: ch06-b04
          speaker: robber_girl
          text: 你这家伙看着还不错！我倒想知道，你到底值不值得别人为你跑遍全世界！
        - id: ch06-b05
          speaker: narrator
          text: 格尔达轻轻拍了拍她的脸，问起王子和公主。
        - id: ch06-b06
          speaker: robber_girl
          text: 他们出门旅行去了。
        - id: ch06-b07
          speaker: gerda
          text: 那只野乌鸦呢？
        - id: ch06-b08
          speaker: robber_girl
          text: 唉，它死了！那只家养的乌鸦成了寡妇，腿上缠着一小块黑纱，整天一蹦一跳。她闹得伤心极了，不过全是胡闹。快告诉我，你后来遇见了什么，又是怎么找到凯的。
          emotion: sad
        - id: ch06-b09
          speaker: narrator
          text: 凯和格尔达把后来的一切都讲给她听。
        - id: ch06-b10
          speaker: robber_girl
          text: 哎呀，哎呀！
          emotion: surprised
        - id: ch06-b11
          speaker: narrator
          text: 她握了握两人的手，答应以后若去他们的城市，一定会上门看望，然后骑马离开了。
        - id: ch06-b12
          speaker: narrator
          text: 格尔达和凯手拉着手回到家。老祖母还在那里，一切都和从前一样。可跨过家门的那一刻，他们才发现，自己已经长大成人。
        - id: ch06-b13
          speaker: narrator
          text: 屋顶平台上的玫瑰依然盛开。那时正是夏天，温暖而灿烂的夏天。
