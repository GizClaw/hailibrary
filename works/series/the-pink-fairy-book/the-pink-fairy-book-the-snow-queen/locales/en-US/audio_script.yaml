  chapters:
    - id: ch01
      title: The Mirror and the White Bees
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There once lived a dreadfully wicked hobgoblin. One day he was delighted with himself. He had made a looking-glass that shrank everything good and beautiful until it seemed like nothing. But anything bad or ugly stood out and looked worse than ever. Beautiful country looked like boiled spinach. Good people looked hideous, or seemed to stand on their heads without bodies. Their faces twisted beyond recognition, and the smallest freckle spread across the nose and mouth.
        - id: ch01-b02
          speaker: hobgoblin
          text: That is the very best part!
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: Then someone dropped the looking-glass. It shattered into a million-billion pieces and more. That brought the greatest misfortune of all. The pieces were scarcely bigger than grains of sand, and they blew across the whole world. If a splinter entered someone's eye, it stayed there. That person saw everything crookedly, or saw only what was bad. Every speck of glass held the same power as the whole mirror.
        - id: ch01-b04
          speaker: narrator
          text: Some splinters entered people's hearts. Then the heart began turning into a lump of ice. The hobgoblin laughed until his sides hurt, while the tiny pieces kept flying. Now you shall hear what came of them.
        - id: ch01-b05
          speaker: narrator
          text: In a great town, houses and people filled every bit of space, so most families had no gardens. Two poor children lived there. They were not brother and sister, but they loved each other as dearly as if they were. Their parents had attic rooms in neighboring houses, with the roofs running between their windows. Each family put a flower box outside. Sweet peas twined through them, and two rose trees grew beautifully. In summer, the children carried out their little chairs, sat beneath the roses, and made splendid games together.
        - id: ch01-b06
          speaker: narrator
          text: In winter they warmed pennies and pressed them against the frozen windowpanes. The coins melted round peepholes so they could look across at each other. The boy was Kay, and the girl was Gerda. One day, snow fell thickly outside.
        - id: ch01-b07
          speaker: grandmother
          text: Look at all the white bees swarming.
        - id: ch01-b08
          speaker: kay
          text: Do those bees have a queen too? Real bees do.
        - id: ch01-b09
          speaker: grandmother
          text: Of course they do. She flies wherever the swarm is thickest. She is bigger than all the others. She never rests on the earth, but rises again into the black clouds. At midnight she often flies through the streets and looks in at the windows. Then the glass freezes into pretty patterns like flowers.
        - id: ch01-b10
          speakers: [kay, gerda]
          ensemble: duo
          text: We have seen those flowers!
        - id: ch01-b11
          speaker: gerda
          text: Could the Snow Queen come in here?
        - id: ch01-b12
          speaker: kay
          text: Let her try! I would put her on the stove and melt her.
        - id: ch01-b13
          speaker: narrator
          text: Grandmother only stroked Kay's hair and went on with her stories. That evening, when he was going to bed, Kay climbed onto the chair beside the window and looked through the little round hole. Only a few flakes were falling now. The largest landed on the edge of a flower box. As Kay watched, it grew larger and larger until it took the shape of a maiden dressed in the finest white gauze.
        - id: ch01-b14
          speaker: narrator
          text: She was delicate and beautiful, but she was made of hard, shining ice. She was alive. Her eyes glittered like two clear stars, though there was no peace in them. She nodded and beckoned to Kay. He sprang down in fright. Something like a great white bird swept past the window.
        - id: ch01-b15
          speaker: narrator
          text: The next day brought a harder frost. Then spring came, followed by summer. The roses grew and smelled sweeter than ever.
    - id: ch02
      title: Kay Rides Away
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Kay and Gerda were looking through a picture book when the great church clock struck five. All at once, Kay cried out.
        - id: ch02-b02
          speaker: kay
          text: Oh! Something stung my heart, and there is something in my eye!
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: Gerda threw her arms around his neck. Kay blinked hard, but she could see nothing in either eye.
        - id: ch02-b04
          speaker: kay
          text: I think it is gone now.
        - id: ch02-b05
          speaker: narrator
          text: It was not gone. A splinter from the magic mirror had entered his eye, making everything great and good seem small and ugly. Another splinter had entered his heart, which was already turning to ice. It did not hurt, but it was there.
        - id: ch02-b06
          speaker: kay
          text: Why are you crying? It makes you look ugly. Nothing is wrong with me. Look at that rose. Slugs have eaten it. And this one has hardly grown. They are horrible roses!
        - id: ch02-b07
          speaker: narrator
          text: He tore the roses apart.
        - id: ch02-b08
          speaker: gerda
          text: Kay, what are you doing?
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: When Kay saw how frightened she was, he deliberately tore off one more rose. Then he climbed through his own window and left dear little Gerda behind. Later, when she brought their picture book, he said it was only fit for babies. Whenever Grandmother told a story, he kept breaking in with objections. Then he slipped behind her, put on her spectacles, and copied the way she spoke. He did it so well that everyone laughed. Before long, he could mimic the walk and voice of every person in the street, even their oddest habits.
        - id: ch02-b10
          speaker: narrator
          text: His games changed too. On a winter day, he held a magnifying glass over his blue coat and caught snowflakes beneath it.
        - id: ch02-b11
          speaker: kay
          text: Look through the glass, Gerda. See how exact they are? They are much more interesting than real flowers. Every one is perfect and follows a rule. If only they would not melt.
        - id: ch02-b12
          speaker: narrator
          text: One morning, Kay came out wearing warm gloves with his little sledge over one shoulder.
        - id: ch02-b13
          speaker: kay
          text: I am going to the marketplace to play with the other boys.
        - id: ch02-b14
          speaker: narrator
          text: Off he went. The boldest boys in the square tied their sledges to farmers' carts for a fast ride. While they played, a large white sledge drove in. Its driver wore a rough white fur coat and a white fur cap. The sledge circled the square twice. Kay tied his little sledge behind it, and away they went.
        - id: ch02-b15
          speaker: narrator
          text: They sped from the square and into the next street. The driver looked back and nodded as warmly as if they had known each other for years. Whenever Kay reached for the rope to free himself, that figure nodded again. Each time, Kay settled back onto his seat. Soon the sledge passed beyond the town. Snow fell so thickly that the boy could not see his own hand, yet they went on and on. At last he managed to untie the cord. It made no difference. His little sledge clung fast behind the large one and flew onward like the wind.
        - id: ch02-b16
          speaker: narrator
          text: Kay shouted, but no one heard. He was terribly afraid. The snowflakes swelled into great white birds. Suddenly they flew aside, and the large sledge stopped. The driver rose. Her cloak and cap were snow. She was tall, slender, and glittering. It was the Snow Queen.
        - id: ch02-b17
          speaker: snow_queen
          text: We have traveled quickly, but you are almost frozen. Come under my cloak.
        - id: ch02-b18
          speaker: narrator
          text: She drew Kay close and wrapped the cloak around him. He felt as if he were sinking into a snowdrift.
        - id: ch02-b19
          speaker: snow_queen
          text: Are you cold now?
        - id: ch02-b20
          speaker: narrator
          text: She kissed his forehead. The kiss was cold as ice and reached his heart, which was already half frozen.
        - id: ch02-b21
          speaker: kay
          text: My sledge! Please do not leave my sledge!
        - id: ch02-b22
          speaker: narrator
          text: That was his first thought. One of the great white birds carried it behind them. The Snow Queen kissed him again. At once, he forgot Gerda, Grandmother, and everyone at home.
        - id: ch02-b23
          speaker: snow_queen
          text: I must not kiss you again. Another kiss would kill you.
        - id: ch02-b24
          speaker: narrator
          text: Away they flew, first over forests and lakes, then over sea and land. The cold wind whistled around them. Wolves howled below, snow hissed across the air, and black crows flew overhead with piercing cries. High above all that darkness, the moon remained large and bright. Kay watched it through the whole long winter night. When daylight came, he slept at the Snow Queen's feet.
    - id: ch03
      title: Gerda and the Enchanted Garden
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: But what happened when Kay did not come home? No one knew where he had gone. The other boys had only seen him tie his sledge to a large one that drove through the town gate. Gerda cried often, and the winter felt long and dark. At last, spring returned with warm sunshine.
        - id: ch03-b02
          speaker: gerda
          text: I will go and find Kay.
        - id: ch03-b03
          speaker: narrator
          text: She went to the river and climbed into a small boat. Soon the current carried it away.
        - id: ch03-b04
          speaker: gerda
          text: Maybe the river will carry me to Kay.
        - id: ch03-b05
          speaker: narrator
          text: The boat glided past trees and fields until it reached a large cherry garden. A little house stood there with a straw roof and strange red and blue windows. Two wooden soldiers guarded the door. Gerda called to them, but wooden soldiers cannot answer. The river pushed her boat onto the bank.
        - id: ch03-b06
          speaker: narrator
          text: Gerda called more loudly. A very old woman came from the house, leaning on a crutch. Her broad sun hat was painted with beautiful flowers.
        - id: ch03-b07
          speaker: old_woman
          text: I do feel sorry for you, little girl.
        - id: ch03-b08
          speaker: narrator
          text: The old woman waded out, hooked the boat with her crutch, and lifted Gerda onto land.
        - id: ch03-b09
          speaker: old_woman
          text: Come inside and tell me who you are and how you reached this place.
        - id: ch03-b10
          speaker: narrator
          text: Gerda told the whole story of Kay and asked whether he had passed that way. The old woman said she had not seen him yet, but she was sure he would come soon. Until then, Gerda must not be sad. She should stay in the little house, eat cherries, and enjoy the flowers. Those flowers were finer than any picture book, the woman said, because every one of them could tell its own story. Then she took Gerda by the hand, led her into the house, and closed the door behind them.
        - id: ch03-b11
          speaker: narrator
          text: The windows were high, and their red, blue, and yellow panes filled the room with curious colors. Delicious cherries covered the table. Gerda ate as many as she liked while the old woman combed her sunny hair with a golden comb.
        - id: ch03-b12
          speaker: old_woman
          text: I have always wanted a sweet little girl like you. You will see how happy we can be together.
        - id: ch03-b13
          speaker: narrator
          text: With every stroke of the comb, Gerda thought less about Kay. The old woman was a witch, though not a wicked one. She used magic now and then for her own amusement, and she very much wanted to keep Gerda. She went into the garden and waved her stick over every rosebush. Each one sank into the black earth and vanished.
        - id: ch03-b14
          speaker: narrator
          text: The witch knew the roses might remind Gerda of home and of Kay. Then the child would run away. Once the roses were hidden, she led Gerda into the garden. It smelled glorious. Every flower anyone could imagine bloomed there throughout the year.
        - id: ch03-b15
          speaker: narrator
          text: Gerda jumped for joy and played in the garden until the sun went down behind the tall cherry trees. That night she slept in a lovely bed. Its red silk pillows were filled with violets, and she slept so deeply that she dreamed the way a queen dreams on her wedding day. In the morning she returned to the warm sunshine and played among the flowers once more. The same thing happened the next day, and the next, until many days had slipped away.
        - id: ch03-b16
          speaker: narrator
          text: Gerda came to know every flower, yet she felt that one kind was missing. She could not remember which. Then she noticed the flowers painted on the old woman's hat. Among them was a rose. The witch had forgotten to remove that painted rose. Even magic cannot remember everything.
        - id: ch03-b17
          speaker: gerda
          text: There are no roses here!
          emotion: surprised
        - id: ch03-b18
          speaker: narrator
          text: Gerda hurried from bed to bed and searched among all the flowers, but she could not find a single rose. At last she sat on the ground and cried. Her tears fell on the very place where one rosebush had vanished. The warm drops sank into the black earth. Suddenly the bush pushed upward and stood before her in full bloom, exactly as it had been. Gerda kissed the roses. They brought back the roses outside her attic window, and with that memory came the thought of little Kay.
        - id: ch03-b19
          speaker: gerda
          text: Oh, what have I been doing? I was supposed to be looking for Kay!
          emotion: surprised
        - id: ch03-b20
          speaker: narrator
          text: Gerda ran to the far end of the garden. The gate was shut, but she pushed hard against its rusty lock until it broke open. She rushed outside on her bare feet. No one came after her. She ran until her strength gave out, then rested on a large stone and looked around. Summer had ended while she was under the spell. It was already late autumn. Inside the garden, nothing had changed. Magic had kept it warm and sunny, with flowers blooming through every season.
        - id: ch03-b21
          speaker: gerda
          text: Oh, I have lost so much time! It is autumn already. I cannot stop now!
          emotion: fearful
        - id: ch03-b22
          speaker: narrator
          text: Gerda sprang up and hurried on. Her bare feet grew sore and tired, while the air became colder. When she stopped to rest again, a large crow stood before her on the snow. It had been watching her. It nodded.
        - id: ch03-b23
          speaker: crow
          text: Caw, caw! Good day. Why are you all alone in the world?
        - id: ch03-b24
          speaker: narrator
          text: Gerda told him her story and asked if he had seen Kay. The crow nodded thoughtfully.
        - id: ch03-b25
          speaker: crow
          text: Perhaps I have. Yes, perhaps.
        - id: ch03-b26
          speaker: gerda
          text: What? Do you really think you saw him?
          emotion: surprised
        - id: ch03-b27
          speaker: narrator
          text: She kissed the crow and nearly squeezed him to death.
        - id: ch03-b28
          speaker: crow
          text: Gently, gently! I think it may have been little Kay. But if it was, he has forgotten you for a princess.
        - id: ch03-b29
          speaker: gerda
          text: Does he live with a princess?
        - id: ch03-b30
          speaker: crow
          text: Yes. Listen, and I will tell you what I know.
    - id: ch04
      title: The Palace and the Golden Coach
      blocks:
        - id: ch04-b01
          speaker: crow
          text: The princess of this kingdom is terribly clever. She has read every newspaper in the world and forgotten them all again. That is how clever she is. Not long ago, she came to the throne, which is not as pleasant as people imagine. Then she wondered why she should not marry. She wanted a husband who could answer when she spoke to him. A man who only stood stiffly and looked respectable would be much too dull.
        - id: ch04-b02
          speaker: crow
          text: All the court ladies were delighted. And you may believe me, because my sweetheart is a tame crow in the palace. She tells me everything.
        - id: ch04-b03
          speaker: narrator
          text: His sweetheart was, of course, another crow.
        - id: ch04-b04
          speaker: crow
          text: The next morning, every newspaper had a border of hearts and the princess's monogram. The notice invited every good-looking young man to come and speak with her. Anyone who spoke loudly enough to be heard would receive food and care. The best speaker would become her husband. It is all as true as the branch beneath my feet.
        - id: ch04-b05
          speaker: crow
          text: Young men poured into the town. There was endless pushing, jostling, and confusion, but nothing came of the first day or the second. Out in the street, every one of them could talk perfectly well. The trouble began when they crossed the palace door. First they saw guards dressed in silver. Then they climbed past footmen in gold and entered the great hall blazing with light. By that point, every sensible thought had flown from their heads.
        - id: ch04-b06
          speaker: crow
          text: When they finally stood before the princess on her throne, they could think of nothing to say. Each man merely repeated the last word she had spoken, and she had no wish to hear her own word twice. They stumbled away as if they were walking in their sleep. The moment they reached the street, their voices returned. All the while, a line of hopeful young men stretched from the town gate to the palace. They grew hungry and thirsty, yet no one inside offered even a glass of water. A few of the cleverest had brought bread and butter. They refused to share it, hoping the princess would reject any neighbor who looked hungry.
        - id: ch04-b07
          speaker: gerda
          text: But where was Kay? When did he arrive? Was he one of them?
        - id: ch04-b08
          speaker: crow
          text: Wait a moment. I am coming to him. On the third day, a small figure walked briskly up to the palace without a horse or carriage. His eyes shone like yours. He had beautiful curling hair and very poor clothes.
        - id: ch04-b09
          speaker: gerda
          text: That was Kay! I have found him at last!
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: Gerda clapped her hands.
        - id: ch04-b11
          speaker: crow
          text: He carried a small bundle on his back.
        - id: ch04-b12
          speaker: gerda
          text: Those must have been his skates. He took them when he left.
        - id: ch04-b13
          speaker: crow
          text: Very likely. I could not see clearly. But my sweetheart says the silver guards and golden footmen did not trouble him at all. He nodded to them and said, “Standing on these stairs must be dull. I would rather go inside.”
        - id: ch04-b14
          speaker: crow
          text: The halls shone with lights. Councillors and ambassadors moved about in silent shoes, carrying golden dishes. Anyone might have grown nervous. His boots creaked terribly, but he was not afraid.
        - id: ch04-b15
          speaker: gerda
          text: Then it must be Kay. His new boots creaked. I heard them in his grandmother's room.
        - id: ch04-b16
          speaker: crow
          text: They certainly did creak. He walked straight to the princess, who sat on a pearl as large and round as a spinning wheel. Ladies and lords stood all around with their attendants. The ones nearest the door looked the proudest.
        - id: ch04-b17
          speaker: gerda
          text: How frightening! Did Kay win the princess?
        - id: ch04-b18
          speaker: crow
          text: My tame sweetheart heard every word. She says he was merry and quick-witted. He told the princess he had not come to ask for her hand at all. He had only come because he wanted to listen to her wisdom. The two of them talked, and by the end of it, they had fallen in love with each other.
        - id: ch04-b19
          speaker: gerda
          text: It was Kay. He was so clever that he could work with fractions. Please take me to the palace!
        - id: ch04-b20
          speaker: crow
          text: That is easy to ask, but how could we do it? I must speak with my sweetheart. She may know a way. A little girl like you would never receive permission to enter.
        - id: ch04-b21
          speaker: gerda
          text: I will get in. When Kay hears I am there, he will come and fetch me at once.
        - id: ch04-b22
          speaker: crow
          text: Wait for me beside the railings.
        - id: ch04-b23
          speaker: narrator
          text: The crow nodded and flew away. He did not return until late evening.
        - id: ch04-b24
          speaker: crow
          text: Caw, caw! My sweetheart sends her love. She also sent this little roll from the kitchen. There is plenty of food there, and you must be hungry. You cannot enter by the palace doors. The silver guards and golden footmen would stop you. But do not cry. We can still get you in. My sweetheart knows a back stair to the bedroom, and she knows where the key is kept.
        - id: ch04-b25
          speaker: narrator
          text: Together they crossed the palace garden. The windows went dark one after another, and when the last lights were nearly gone, the crow guided Gerda to a hidden back door. Her heart pounded with both fear and longing. It seemed wrong to creep into a palace at night, yet she meant no harm. She only wanted to know whether the boy inside was little Kay. Surely it had to be him. She could picture his clever eyes, his curling hair, and the smile he once gave her beneath the rose trees. How glad he would be to see her and hear how everyone was doing at home.
        - id: ch04-b26
          speaker: narrator
          text: A small lamp burned on the stairs. The tame palace crow waited on the landing with her head tilted to one side. Gerda bowed as Grandmother had taught her.
        - id: ch04-b27
          speaker: palace_crow
          text: My promised husband has told me many kind things about you, young lady. Please carry the lamp while I lead the way. No one will see us on this route.
        - id: ch04-b28
          speaker: narrator
          text: The two crows led Gerda through room after beautiful room until they reached the royal bedroom. In its center stood two beds shaped like lilies, hanging from a thick rod of gold. One lily was white, and the princess slept inside it. The other was red. Gerda's breath caught, because she hoped Kay lay behind its curtain. She pushed the cloth aside and saw the back of a brown neck. For one joyful moment, she was certain it belonged to Kay. She held the lamp toward him and called his name aloud.
        - id: ch04-b29
          speaker: narrator
          text: The sleeper woke and turned. It was not Kay. Only his neck looked the same. He was a young and handsome prince. The princess sat up and asked who had entered. Gerda wept as she told her story and explained how the crows had helped her.
        - id: ch04-b30
          speakers: [prince, princess]
          ensemble: duo
          text: You have suffered so much, poor child.
        - id: ch04-b31
          speaker: narrator
          text: The prince and princess praised the crows. They were not angry, though they warned them never to do such a thing again. Then they offered a reward.
        - id: ch04-b32
          speaker: princess
          text: Would you rather fly free, or become court crows and eat what you can get from the kitchen?
        - id: ch04-b33
          speaker: narrator
          text: Both crows bowed and chose court positions, thinking sensibly of their old age. Gerda was put to bed. As she folded her hands and fell asleep, one thought stayed with her.
        - id: ch04-b34
          speaker: gerda
          text: People and animals have been so good to me.
        - id: ch04-b35
          speaker: narrator
          text: The next morning, attendants dressed Gerda from head to foot in silk and satin. The prince and princess begged her to remain in their palace, where she would be safe and comfortable. Gerda would not give up her search. She asked instead for a small carriage, a horse, and a pair of shoes so she could travel into the world again. They gave her the shoes, a warm muff, and everything she needed. When she reached the palace door, she found a coach made of pure gold. A coachman waited with footmen and postilions, all wearing golden crowns.
        - id: ch04-b36
          speaker: narrator
          text: The prince and princess helped her inside and wished her well. The wild crow, now married, rode with her for the first three miles. His wife stayed behind with a bad headache.
        - id: ch04-b37
          speakers: [prince, princess]
          ensemble: duo
          text: Good-bye! Good-bye!
        - id: ch04-b38
          speaker: narrator
          text: Gerda cried, and the crow cried too. When they parted, he flew to a tree and waved his black wings until the sun-bright coach vanished from sight.
    - id: ch05
      title: The Robber Girl
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At last, the coach entered a dark forest and glowed there like a torch. Robbers saw the light and rushed from the trees.
        - id: ch05-b02
          speakers: [robber_1, robber_2]
          ensemble: duo
          text: Look at all that gold!
        - id: ch05-b03
          speaker: narrator
          text: The robbers surrounded the shining coach before it could escape. They seized the horses, killed the coachman, the footmen, and the postilions, then pulled little Gerda out of the carriage and carried her into the dark wood.
        - id: ch05-b04
          speaker: robber_queen
          text: She is plump and tender. I will eat her!
        - id: ch05-b05
          speaker: narrator
          text: The old robber queen drew a long knife, and its blade flashed horribly.
        - id: ch05-b06
          speaker: robber_girl
          text: You will not kill her! She can play with me. I want her muff and her beautiful dress, and she will sleep in my bed.
          emotion: angry
        - id: ch05-b07
          speaker: narrator
          text: The robber girl's dark hair and black eyes made her look fierce. She was about Gerda's size, but broader and stronger. She flung her arms around Gerda.
        - id: ch05-b08
          speaker: robber_girl
          text: They will not kill you if you behave yourself. Are you a princess?
        - id: ch05-b09
          speaker: gerda
          text: No, I am not.
        - id: ch05-b10
          speaker: narrator
          text: Gerda told her everything that had happened and how dearly she loved Kay. The robber girl studied her and gave a solemn nod.
        - id: ch05-b11
          speaker: robber_girl
          text: They will not kill you even if you are naughty. If that happens, I will kill you myself.
        - id: ch05-b12
          speaker: narrator
          text: Then the robber girl dried Gerda's eyes and thrust both her own hands deep into the beautiful warm muff. She led Gerda to the corner of the robbers' camp where she slept. More than a hundred wood pigeons perched all around the sleeping place. At first they looked asleep, but they shifted and murmured when the two girls came near. A reindeer was tied close by. The robber girl often teased him, running the point of her long, sharp knife across his skin and making him tremble.
        - id: ch05-b13
          speaker: narrator
          text: Gerda lay awake for a long time. Then two wood pigeons began to coo.
        - id: ch05-b14
          speakers: [wood_pigeon_1, wood_pigeon_2]
          ensemble: duo
          text: Coo, coo! We have seen little Kay. A white bird carried his sledge while he sat in the Snow Queen's carriage. It passed over this forest when our little ones were still in the nest. She breathed on them, and all but the two of us died. Coo, coo!
          emotion: sad
        - id: ch05-b15
          speaker: gerda
          text: What did you say? Where was the Snow Queen going? Do you know?
          emotion: surprised
        - id: ch05-b16
          speakers: [wood_pigeon_1, wood_pigeon_2]
          ensemble: duo
          text: She was probably bound for Lapland, where there is always ice and snow. Ask the reindeer.
        - id: ch05-b17
          speaker: reindeer
          text: Lapland has wonderful ice and snow! You can leap across great sparkling valleys. The Snow Queen keeps her summer palace there. But her finest palace is near the North Pole, on the island called Spitzbergen.
          emotion: happy
        - id: ch05-b18
          speaker: gerda
          text: Oh, Kay, I still have not found you!
          emotion: sad
        - id: ch05-b19
          speaker: robber_girl
          text: Lie still, or I will stick my knife into you.
          emotion: angry
        - id: ch05-b20
          speaker: narrator
          text: In the morning, Gerda repeated what the pigeons had said. The robber girl nodded, then turned to the reindeer.
        - id: ch05-b21
          speaker: robber_girl
          text: Do you know the way to Lapland?
        - id: ch05-b22
          speaker: reindeer
          text: Who could know it better than I do? I was born and raised on those snowfields.
        - id: ch05-b23
          speaker: robber_girl
          text: Listen, Gerda. All the robbers have left except my mother, and this afternoon she will fall asleep. Then I will do something for you.
        - id: ch05-b24
          speaker: narrator
          text: When her mother slept, the robber girl went to the reindeer.
        - id: ch05-b25
          speaker: robber_girl
          text: I am setting you free to run home to Lapland. You must be quick, and you must carry this girl to the Snow Queen's palace, where her friend is. You heard her story. She spoke loudly enough.
        - id: ch05-b26
          speaker: narrator
          text: The reindeer leaped for joy. The robber girl lifted Gerda onto his back and tied her securely. She even gave her a small pillow for a saddle.
        - id: ch05-b27
          speaker: robber_girl
          text: You need your fur boots because it will be cold. I am keeping your muff because it is so comfortable. But take my mother's great fur gloves. They will reach your elbows. Put your hands inside.
        - id: ch05-b28
          speaker: narrator
          text: Gerda cried with joy.
        - id: ch05-b29
          speaker: robber_girl
          text: Do not make that face. You should look happy. Here are two loaves and a sausage, so you will not go hungry.
        - id: ch05-b30
          speaker: narrator
          text: The robber girl fastened the two loaves and the sausage securely to the reindeer's back. Then she opened the door and ordered all the great dogs away from it. When the path was clear, she drew her sharp knife one more time and sliced straight through the reindeer's halter.
        - id: ch05-b31
          speaker: robber_girl
          text: Run now, and take very good care of the little girl.
        - id: ch05-b32
          speaker: gerda
          text: I must say good-bye now!
          emotion: happy
        - id: ch05-b33
          speaker: narrator
          text: Gerda reached toward her with the enormous fur gloves. Then the reindeer raced away through the vast forest. Wolves howled, ravens screamed, and the sky seemed to burn.
        - id: ch05-b34
          speaker: reindeer
          text: Those are my dear old northern lights. See how brightly they shine!
          emotion: happy
        - id: ch05-b35
          speaker: narrator
          text: He ran still faster, all day and all night. They ate both loaves and the sausage. Then at last they reached Lapland.
    - id: ch06
      title: Across Lapland and Finland
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At last they stopped beside a miserable little house. Its roof sloped so low that it almost touched the ground, and the doorway was too small for anyone to enter upright. Inside, an old Lapland woman sat cooking fish over an oil lamp. The reindeer began talking the moment they arrived. He told Gerda's whole history, though he insisted on telling his own story first because it seemed far more important to him. Poor Gerda could add nothing. The cold had taken away her voice.
        - id: ch06-b02
          speaker: lapland_woman
          text: Ah, you poor creatures! You still have a long way to go. The Snow Queen lives more than a hundred miles away in Finland, where she burns Bengal lights every night. I have no paper, so I will write a message on a dried stockfish. Give it to the Finland woman. She can advise you better than I can.
        - id: ch06-b03
          speaker: narrator
          text: The Lapland woman warmed Gerda beside the lamp and gave her enough food and drink to continue. She wrote her message across a dried stockfish and made Gerda promise to guard it carefully. Then she tied the girl firmly onto the reindeer's back. Away they went once more. Northern lights blazed across the sky throughout the night. At last they reached Finland. The Finland woman's house had no door at all, so the travelers climbed up and knocked at the chimney.
        - id: ch06-b04
          speaker: narrator
          text: Inside, the heat was so fierce that the Finland woman wore hardly any clothes. She loosened Gerda's warm things at once and removed the huge fur gloves and boots. The reindeer was suffering too, so she laid a piece of ice on his head. Only then did she take the stockfish and read its message. She read it once, then twice, then a third time, until every word was fixed in her memory. After that, she dropped the fish into her cooking pot. She was not a woman who wasted anything.
        - id: ch06-b05
          speaker: narrator
          text: The reindeer told his own story and then Gerda's. The Finland woman only blinked and said nothing.
        - id: ch06-b06
          speaker: reindeer
          text: I know you are very clever. Could you give Gerda a drink that would make her as strong as twelve men? Then she could defeat the Snow Queen.
        - id: ch06-b07
          speaker: finland_woman
          text: The strength of twelve men would not help much. Little Kay is with the Snow Queen. He loves everything there and believes it is the finest place in the world. That is because a glass splinter is lodged in his heart and another in his eye. Until they come out, he cannot be free, and the Snow Queen will keep her power over him.
        - id: ch06-b08
          speaker: reindeer
          text: Then can you give Gerda something that will grant her power over the Snow Queen?
        - id: ch06-b09
          speaker: finland_woman
          text: I cannot give her any power greater than the power she already has. Can you not see how great it is? Men and animals help her as she crosses the wide world in bare feet. Her strength comes from being an innocent, loving child. If she cannot free Kay herself and draw out the glass, no one can help her.
        - id: ch06-b10
          speaker: finland_woman
          text: The Snow Queen's garden begins two miles from here. Carry Gerda to the large bush where red berries grow in the snow. Leave her there, then return to me as quickly as you can.
        - id: ch06-b11
          speaker: narrator
          text: The Finland woman lifted Gerda onto the reindeer, and he sped away.
        - id: ch06-b12
          speaker: gerda
          text: Oh! I left my boots and gloves behind!
          emotion: surprised
        - id: ch06-b13
          speaker: narrator
          text: Gerda felt the loss of her boots and gloves at once in the piercing cold, but the reindeer did not dare turn back. He raced onward until a large bush with red berries appeared against the snow. There he lowered Gerda to the ground and kissed her mouth. Great tears rolled down his cheeks, for he hated leaving her alone. Then he obeyed the Finland woman and ran back as fast as he could. Poor Gerda remained without shoes or gloves, standing by herself in the bitter cold of Finland.
        - id: ch06-b14
          speaker: narrator
          text: She ran forward as fast as she could. A whole regiment of enormous snowflakes charged at her. The moment they touched her, they melted. Gerda took courage and went on.
    - id: ch07
      title: The Ice Palace and the Road Home
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Now let us see what Kay was doing. He was not thinking of Gerda at all, and he never dreamed that she stood just outside the palace. The palace walls were built from driven snow. Piercing winds formed every door and window. Inside were more than a hundred halls, all made of frozen snow, and the largest stretched for several miles. Bright northern lights shone across them. The halls glittered under that strange light, but they were vast, cold, and utterly empty.
        - id: ch07-b02
          speaker: narrator
          text: In the center of the greatest hall lay a frozen lake, cracked into a thousand identical pieces. The Snow Queen sat there whenever she was home. Kay had turned blue-black with cold, though he felt nothing. Her kisses had taken away his feelings, and his heart was a lump of ice.
        - id: ch07-b03
          speaker: narrator
          text: Kay sat beside the frozen lake, picking up sharp, flat pieces of ice and trying to fit one against another. To him, each fragment seemed more beautiful than anything in the world, though that was only the glass splinter in his eye. He arranged the ice into one pattern, broke it apart, and made another. He could form many shapes, but one task always defeated him. He could not make the pieces spell the word “Love.” The Snow Queen had promised him a great reward if he succeeded.
        - id: ch07-b04
          speaker: snow_queen
          text: Spell that word, and you will be your own master. I will give you the whole world and a new pair of skates.
        - id: ch07-b05
          speaker: narrator
          text: Still, Kay could not make the word.
        - id: ch07-b06
          speaker: snow_queen
          text: I must fly to the warmer countries and powder my black kettles. That is what I call Mount Etna and Mount Vesuvius. It helps the lemons and grapes.
        - id: ch07-b07
          speaker: narrator
          text: She flew away. Kay remained alone with his puzzle, sitting so still that anyone might have thought him frozen.
        - id: ch07-b08
          speaker: narrator
          text: Then Gerda stepped into the hall. At her coming, the biting winds fell quiet as if they had gone to sleep. She saw Kay, knew him at once, and ran to put her arms around his neck.
        - id: ch07-b09
          speaker: gerda
          text: Kay! Dear little Kay! I have found you at last!
          emotion: happy
        - id: ch07-b10
          speaker: narrator
          text: Kay stayed cold and still. Gerda's hot tears fell onto his neck. They thawed his heart and washed away the mirror splinter inside it. He looked at her and began to weep. He cried until the other splinter floated out of his eye. Then he knew her.
        - id: ch07-b11
          speaker: kay
          text: Gerda! Dear little Gerda! Where have you been all this time? And where have I been?
          emotion: surprised
        - id: ch07-b12
          speaker: narrator
          text: Kay looked around the hall.
        - id: ch07-b13
          speaker: kay
          text: It is so cold here, and so wide and empty!
          emotion: fearful
        - id: ch07-b14
          speaker: narrator
          text: He threw himself into Gerda's arms. She laughed and wept at once because her joy was too great for only one of them. The sharp pieces of ice began dancing around the children as if they shared that joy. They whirled and leaped until they too seemed tired. Then the pieces dropped back onto the lake. Without Kay touching them, they arranged themselves into the very letters he had been ordered to make. There lay the word that would make him his own master and bring him the whole world, along with a new pair of skates.
        - id: ch07-b15
          speaker: narrator
          text: Gerda kissed Kay's cheeks until they grew rosy. She kissed his eyes until they sparkled like hers. She kissed his hands and feet until warmth returned to him. The Snow Queen could come home now. Kay's freedom, the word “Love,” shone in the ice.
        - id: ch07-b16
          speaker: narrator
          text: The children took each other's hands and walked out of the great ice palace. As they traveled, they spoke of Grandmother and the rose trees growing outside their attic windows. Wherever Kay and Gerda went, the fierce winds fell silent and the sun came out above them. When they reached the large bush whose red berries showed against the snow, the faithful reindeer stood waiting for them.
        - id: ch07-b17
          speaker: narrator
          text: The reindeer carried both children back to the Finland woman. She welcomed them into her hot room, warmed them through, and gave them the advice they needed for the long journey home. After that, they returned to the little Lapland house. The Lapland woman found them new clothes and repaired their sledge. The reindeer ran beside them and carried them onward until the white land gave way to green fields, fresh with the first growth of spring. Only then did he stop and say good-bye.
        - id: ch07-b18
          speaker: narrator
          text: Kay and Gerda came next to a forest where new leaves were bursting from every branch. A splendid horse emerged between the trees. Gerda recognized it as one of the horses that had drawn her golden coach. In the saddle sat a girl wearing a red cap, with pistols tucked into her belt. It was the little robber girl. She had grown tired of staying at home and had ridden away to see the world for herself. The moment the two girls saw each other, each knew the other.
        - id: ch07-b19
          speaker: robber_girl
          text: So this is the fine fellow! I wonder whether you deserve to have someone run all over the world for you.
        - id: ch07-b20
          speaker: narrator
          text: Gerda patted her cheeks and asked about the prince and princess.
        - id: ch07-b21
          speaker: robber_girl
          text: They have gone traveling.
        - id: ch07-b22
          speaker: gerda
          text: And what about the crow?
        - id: ch07-b23
          speaker: robber_girl
          text: Oh, the crow is dead. His tame sweetheart is a widow now. She hops about with a scrap of black cloth tied around her leg and makes a great fuss. It is all nonsense. But tell me what happened to you. How did you get him back?
        - id: ch07-b24
          speaker: narrator
          text: Kay and Gerda told her everything.
        - id: ch07-b25
          speaker: robber_girl
          text: What a tale that is!
          emotion: surprised
        - id: ch07-b26
          speaker: narrator
          text: She shook hands with them both and promised to visit if she ever came to their town. Then she rode away.
        - id: ch07-b27
          speaker: narrator
          text: Kay and Gerda continued toward home, still walking hand in hand. After all their wandering, they reached the crowded town and climbed to the two attic rooms. Grandmother was there waiting, and everything around them looked just as it had before. Yet as Kay and Gerda passed through the doorway, they discovered that they themselves had changed. The two children had grown up.
        - id: ch07-b28
          speaker: narrator
          text: The roses bloomed outside the attic windows. It was summer, warm, glorious summer.
