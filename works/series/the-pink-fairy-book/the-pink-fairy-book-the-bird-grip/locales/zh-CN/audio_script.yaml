audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    youngest_prince:
      display_name: 小王子
      tts:
        delivery: 善良坚定，偶尔会因诱惑而迟疑
        timbre: 年轻清朗
        pace: 明快
        pitch: 中音
    maid:
      display_name: 女仆
      tts:
        delivery: 小心压低声音，危急中仍保持清楚
        timbre: 轻柔清晰
        pace: 稍快
        pitch: 中高音
    fox:
      display_name: 狐狸
      tts:
        delivery: 机敏沉着，劝告时严肃而真诚
        timbre: 清亮稳健
        pace: 从容
        pitch: 中音
    judge:
      display_name: 法官
      tts:
        delivery: 严肃审慎，问话简洁有力
        timbre: 浑厚清楚
        pace: 平稳
        pitch: 中低音
    bird_king:
      display_name: 格里普鸟的主人
      tts:
        delivery: 威严冷峻，说出条件时不容置疑
        timbre: 洪亮厚实
        pace: 平稳
        pitch: 低音
    princess_king:
      display_name: 公主的父王
      tts:
        delivery: 庄重严厉，言辞果断
        timbre: 沉稳清晰
        pace: 平稳
        pitch: 中低音
  chapters:
    - id: ch01
      title: 三位王子出发
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王统治着辽阔的王国，膝下还有三个儿子。可他忽然瞎了眼。人们用尽世间的医术和本领，也不能让他重见光明。最后，一位老妇人来到王宫，告诉国王，天下只有一样东西能治好他的眼睛，那就是格里普鸟。只要听到它歌唱，国王的双眼便会睁开。
        - id: ch01-b02
          speaker: narrator
          text: 格里普鸟被邻国的国王关在笼中，当作最珍贵的宝物严加看守。大王子听说后自告奋勇，要把它取回来。父亲听见儿子的决心，十分欢喜，竭尽所能替他备好行装，送他上路。王子骑了一程，来到一家热闹的客店。店里宾客众多，人人喝酒、唱歌、掷骰子，玩得兴高采烈。王子太喜欢这种快活日子了，就住下来跟着他们赌钱饮酒，把盲眼的父亲和格里普鸟忘得一干二净。
        - id: ch01-b03
          speaker: narrator
          text: 国王怀着希望，也怀着忧虑，焦急地等了许久。日子一天天过去，却始终没有大儿子的消息。二王子便请求父亲准许他出发，既去寻找哥哥，也去取回格里普鸟。父亲答应了，还给他置办了极其华美的行装。谁知二王子到了同一家客店，看见哥哥正和一群快活的伙伴厮混，也跟着留了下来。他同样忘记了格里普鸟，也忘记了盲眼的父亲。
        - id: ch01-b04
          speaker: narrator
          text: 二王子走后又过了很久，两个儿子还是都不回来，国王悲痛极了。他不但失去了复明的希望，连两个年长的儿子也失去了。这时，小王子请父亲让自己去寻找哥哥，再把格里普鸟带回家。他深信自己一定能成功。国王不愿让第三个儿子也去冒险，可经不住他长久央求，终于只得答应。他也像两个哥哥一样，带着最上等的行装，骑马出发。
        - id: ch01-b05
          speaker: narrator
          text: 小王子也来到那家客店。两个哥哥一再劝他留下来，和他们一起过快活日子。
        - id: ch01-b06
          speaker: youngest_prince
          text: 我既然已经找到你们，接下来就得去取父亲盼望的格里普鸟。我连一个时辰也不能耽搁。
        - id: ch01-b07
          speaker: narrator
          text: 他辞别哥哥，继续骑了很远，想另找地方过夜。天色渐暗，他终于在森林深处看见一所房子。店主人热情接待了他，把马牵进马厩，又领他到客房，叫女仆铺好桌布，端上晚饭。外面已经黑透。女仆还在摆放碗碟，王子刚开始充饥，隔壁便传来凄惨的尖叫和哭号。他猛地离开饭桌，问女仆那是什么声音，自己是不是闯进了强盗窝。
        - id: ch01-b08
          speaker: maid
          text: 这种惨叫每晚都有，可发出声音的不是活人。那个人付不起在店里的饭钱，店主人便杀了他。他又说死者没留下安葬费，不肯埋葬遗体，每晚还要去鞭打尸体。
        - id: ch01-b09
          speaker: narrator
          text: 女仆说完，揭开一只盘子的盖子，里面竟放着一把刀和一柄斧头。王子顿时明白，店主人是在问他想选择哪种死法，除非他肯拿钱赎回自己的性命。他马上叫来店主人，交出一大笔钱，又替那个死者还清欠债，连安葬遗体的费用也一并付了。这个杀人凶手这才答应料理后事。
        - id: ch01-b10
          speaker: narrator
          text: 王子知道留在这里仍不安全，便请女仆帮他连夜逃走。
        - id: ch01-b11
          speaker: maid
          text: 马厩钥匙就在店主人的枕头底下。帮你逃跑，也许会害我丢掉性命。可我也是被关在这里的。你若肯带我走，我就帮你。
        - id: ch01-b12
          speaker: narrator
          text: 王子答应一定带她同行。两人设法取到钥匙，顺利逃出客店，骑马赶了很远，直到来到另一家离那里很远的客店。王子替女仆找到一个好去处，这才独自继续赶路。
    - id: ch02
      title: 三次警告
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 王子骑马穿过森林，迎面遇见一只狐狸。狐狸亲切地问他要去哪里，又要办什么事。王子说，事情太要紧，不能随便告诉路上遇见的生灵。
        - id: ch02-b02
          speaker: fox
          text: 你谨慎得对。你是要取格里普鸟，带回去救你双目失明的父亲。我能帮你，但你必须听我的劝告。
        - id: ch02-b03
          speaker: narrator
          text: 这个提议正合王子的心意。狐狸不但愿意同行，还会带他找到关着格里普鸟的城堡，王子便答应事事听从吩咐。他们穿过森林，远远望见城堡时，狐狸拿出三粒金子。王子要把第一粒扔进卫兵室，第二粒扔进格里普鸟所在的房间，最后一粒扔进鸟笼。这样便能带走鸟儿，只是绝不能抚摸它，否则一定会招来灾祸。
        - id: ch02-b04
          speaker: narrator
          text: 王子答应忠实地照做。他走进城堡，把第一粒金子扔进卫兵室，卫兵立刻睡着；第二粒让房里的看守也闭上了眼睛；第三粒落进鸟笼，格里普鸟同样沉沉睡去。王子把这只美丽的鸟捧在手里，却没能抵挡诱惑，还是伸手摸了摸它。鸟儿立刻惊醒，放声尖叫。整座城堡的人都被惊动，王子也被抓进牢里。
        - id: ch02-b05
          speaker: narrator
          text: 他坐在牢中痛苦后悔。是自己不听劝告，才落到这一步，还害父亲失去了复明的机会。狐狸忽然站在他面前。王子重见狐狸，喜出望外。他温顺地听完所有责备，答应以后一定更加听话，只求狐狸帮他摆脱眼前的麻烦。
        - id: ch02-b06
          speaker: fox
          text: 我只能告诉你一件事。受审时，无论法官问什么，你都回答“是”。这样就会有转机。
        - id: ch02-b07
          speaker: judge
          text: 你是不是有意偷走格里普鸟？
        - id: ch02-b08
          speaker: youngest_prince
          text: 是。
        - id: ch02-b09
          speaker: judge
          text: 你是个偷盗高手吗？
        - id: ch02-b10
          speaker: youngest_prince
          text: 是。
        - id: ch02-b11
          speaker: bird_king
          text: 既然你是偷盗高手，就去邻国把世上最美丽的公主劫来给我。办成这件事，我便赦免你偷鸟的罪。
        - id: ch02-b12
          speaker: youngest_prince
          text: 是。
        - id: ch02-b13
          speaker: narrator
          text: 王子离开城堡，又遇见狐狸。狐狸陪他来到邻国。走近那里的城堡时，它交给王子三粒金子，叫他分别扔进卫兵室、公主的寝宫和她的床上，还再三严厉警告，绝不能亲吻公主。王子进入城堡，照着狐狸的话去做，所有人很快都沉沉睡去。可他把公主抱进怀里，一见她如此美丽，竟把警告忘得干干净净，低头吻了她。公主和整座城堡的人随即醒来。王子又被抓住，关进一座坚固的地牢。
        - id: ch02-b14
          speaker: narrator
          text: 狐狸再次来到牢里。它责备王子又一次不听话，却仍答应救他脱离困境，条件是受审时，无论别人问什么都要回答“是”。王子欣然同意。到了法官面前，他承认自己本想劫走公主，也承认自己是个偷盗高手。
        - id: ch02-b15
          speaker: princess_king
          text: 去下一个王国，把那匹四只蹄子都套着金蹄铁的马偷来。只要办到，我就赦免你的罪。
        - id: ch02-b16
          speaker: youngest_prince
          text: 是。
        - id: ch02-b17
          speaker: narrator
          text: 王子离开城堡没走多远，又遇见狐狸。他们结伴走完下一段旅程。来到目的地后，狐狸第三次给他三粒金子，叫他分别扔进卫兵室、马厩和金蹄马的栏圈。马栏上方挂着一副美丽的金马鞍，但王子绝不能去碰。否则，这次惹出的祸会比前两次更加可怕，狐狸也再没有办法救他。
        - id: ch02-b18
          speaker: narrator
          text: 王子答应这回一定意志坚定。他把三粒金子扔到指定的地方，让所有人和马都睡着，然后解开缰绳。可就在这时，他又看见了金马鞍。他想，这样一匹美丽的马，四只蹄子还套着金蹄铁，只有那副马鞍才配得上它。王子刚伸出手，一个看不见的东西便狠狠打中他的胳膊，整条手臂顿时麻木。他立刻想起自己的诺言和眼前的危险，牵着马离开，再也没有回头看那副马鞍。
        - id: ch02-b19
          speaker: narrator
          text: 狐狸在城堡外等着。王子承认，自己刚才又差一点屈服于诱惑。
        - id: ch02-b20
          speaker: fox
          text: 我知道。打你胳膊的就是我。
    - id: ch03
      title: 珍宝与背叛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们继续结伴赶路。王子说自己始终忘不了那位美丽的公主，又问狐狸，让她骑着这匹金蹄马，一同回到父亲的王宫，不是正好吗？狐狸也觉得这个主意妙极了。只要王子愿意现在回去带走她，它就再给他三粒金子。
        - id: ch03-b02
          speaker: youngest_prince
          text: 我这一次一定管住自己，绝不亲吻她。
        - id: ch03-b03
          speaker: narrator
          text: 王子拿到金子，重新进入城堡。这回他没有亲吻公主，而是顺利将她带了出来，让她骑上那匹美丽的金蹄马，随后继续赶路。到了关着格里普鸟的城堡附近，他又向狐狸要了三粒金子，也没有再抚摸鸟儿。这一回，他顺利把格里普鸟带走了。
        - id: ch03-b04
          speaker: narrator
          text: 王子满心欢喜。盲眼的父亲终于能够恢复视力，而他自己也得到了世上最美丽的公主和那匹四蹄闪着金光的马。他和公主一路欢欢喜喜地同行，狐狸始终跟在他们身后，直到三人来到最初相遇的那片森林。
        - id: ch03-b05
          speaker: fox
          text: 我们要在这里分道扬镳了。你已经得到心中渴望的一切。只要别拿钱替任何人赎命，接下来的路就会顺顺利利，你也能平安回到父亲的王宫。
        - id: ch03-b06
          speaker: narrator
          text: 王子为狐狸一路上的帮助向它道谢，答应牢记最后这句警告。两人告别以后，王子继续骑马赶路。公主陪在他身边，格里普鸟则停在他的手腕上。
        - id: ch03-b07
          speaker: narrator
          text: 不久，他们来到两个哥哥忘记使命、沉迷享乐的客店。这里已经没有欢歌笑语，也听不到任何欢乐的喧闹。王子走近时，看见门外竖着两座绞刑架。他与公主走进客店，又发现房间里挂满黑布，处处预示着悲伤和死亡。王子问起缘故，才知道两位王子把所有钱都花在宴饮和赌博上，欠了店主人一大笔债。没人愿意拿钱替他们赎命，依照当地的法律，他们当天就要被绞死。
        - id: ch03-b08
          speaker: narrator
          text: 小王子认出即将丧命的正是自己的两个哥哥。一想到堂堂王子要受这样可耻的死刑，他便心如刀割。虽然狐狸刚刚发出警告，可他身上正好带着足够的钱，还是替两人还清所有债务，赎回了他们的性命。
        - id: ch03-b09
          speaker: narrator
          text: 两个哥哥刚刚重获自由时，对弟弟十分感激。可一看到他带回的种种珍宝，他们很快妒火中烧，暗中商量怎样把弟弟置于死地，再夺走格里普鸟、公主和金蹄马，一起献给盲眼的父亲。计策商量妥当，两人把小王子骗到一座狮子洞旁，猛地推了下去，随后让公主骑上马，带着鸟踏上归途。公主一路伤心痛哭，他们却威胁她，若不说珍宝都是兄弟俩赢来的，就要她的命。
        - id: ch03-b10
          speaker: narrator
          text: 两位王子回到父亲的王宫，宫中一片欢腾，人人都称赞他们勇敢无畏。父亲问小儿子去了哪里，他们谎称弟弟在客店里过着荒唐日子，最后因为欠债被绞死。小王子是老国王最疼爱的儿子，听见这个消息，他悲痛万分。宫中见到珍宝时的喜悦也很快消散。格里普鸟怎么都不肯唱歌，国王仍旧失明；公主从早到晚哭泣；至于金蹄马，谁也不敢靠得足够近，连它的金蹄铁都看不上一眼。
    - id: ch04
      title: 狐狸的请求
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 小王子跌进狮子洞，却发现狐狸正坐在那里。狮群非但没有把他撕成碎片，反而对他亲热极了。狐狸也没有因为他忘掉最后那次警告而生气，只是点明了两个哥哥的本性。
        - id: ch04-b02
          speaker: fox
          text: 你的哥哥能忘掉年迈的父亲，玷污王室的身份，当然也不会迟疑着放过自己的兄弟。
        - id: ch04-b03
          speaker: narrator
          text: 狐狸把王子从狮子洞里救出来，又仔细告诉他接下来该怎么做，才能讨回属于自己的一切。王子从心底感谢这位朋友对自己的真诚情谊。狐狸却说，既然自己帮上了忙，如今也想请他做一件事。王子答应，只要力所能及，无论什么事都愿意做。
        - id: ch04-b04
          speaker: fox
          text: 我只求你一件事。请用剑砍下我的头。
        - id: ch04-b05
          speaker: narrator
          text: 王子大吃一惊。他说，自己怎么也下不了手，绝不能砍下最忠实的朋友的头。狐狸一再声明，这是王子能够为它做的最大恩惠，可他始终不肯答应。狐狸因此变得万分悲伤。
        - id: ch04-b06
          speaker: fox
          text: 你不肯答应，就逼得我去做一件最不愿意做的事。你若不砍下我的头，我只好杀死你。
        - id: ch04-b07
          speaker: narrator
          text: 王子终于拔出利剑，砍下狐狸的头。下一刻，一个年轻人站在他面前。
        - id: ch04-b08
          speaker: fox
          text: 谢谢你。你使我摆脱了连死亡也解不开的魔咒。我就是强盗客店里那个无人安葬的死者。你替我清偿欠债，让我体面下葬，所以我才一路帮助你。
        - id: ch04-b09
          speaker: narrator
          text: 说完这些，年轻人便与王子分手。王子按照狐狸先前教给他的办法，把自己装扮成一个钉马掌匠，来到父亲的王宫，请求在那里做工。
    - id: ch05
      title: 格里普鸟歌唱
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 国王的侍从告诉他，王宫的确需要钉马掌匠，可那人必须抬得起金蹄马的脚，至今还没人办得到。王子请求亲眼去看那匹马。他才走进马厩，骏马便亲热地嘶鸣起来，随后像一只羔羊那样安安静静地站好。王子把它的四只脚一一抬起，让国王的侍从看清那些赫赫有名的金蹄铁。
        - id: ch05-b02
          speaker: narrator
          text: 侍从们又说起格里普鸟，觉得这事实在奇怪。无论他们怎样细心照料，它就是不肯唱歌。钉马掌匠说，自己很了解这只鸟，曾在另一个国王的宫殿里见过它关在笼中的模样。鸟儿现在不唱，一定是因为还缺少什么。他很清楚格里普鸟的习性，只要让他亲眼看一看，马上就能说出它究竟缺了什么。
        - id: ch05-b03
          speaker: narrator
          text: 侍从们聚在一起商量，心里有些犹豫。格里普鸟和哭泣的公主都在国王的寝宫里，他们该不该把这个来历不明的陌生人带进去？众人最后决定冒一次险，于是把钉马掌匠领到国王面前。
        - id: ch05-b04
          speaker: narrator
          text: 王子刚叫出格里普鸟的名字，鸟儿便放声歌唱，公主也终于露出了笑容。老国王眼前的黑暗随即渐渐散开。鸟儿唱得越久，他看得越清楚。到了最后，他终于从这个陌生的钉马掌匠身上，认出了自己最疼爱的小儿子。
        - id: ch05-b05
          speaker: narrator
          text: 公主把两个哥哥怎样背信弃义、谋害小王子的经过，全都告诉了国王。国王将两个大儿子逐出王国，让小王子迎娶公主，又把金蹄马和半个王国都交给了他。老国王自己留下格里普鸟，只要还活着，就让它陪在身边。从此，那只鸟总是尽情地为国王和满朝臣子歌唱。
