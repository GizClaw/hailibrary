  chapters:
    - id: ch01
      title: The Three Princes Set Out
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king who ruled a great kingdom and had three sons. One day he became blind. No doctor and no human art could give him back his sight.
        - id: ch01-b02
          speaker: narrator
          text: At last, an old woman came to the palace. She knew of just one thing in all the world that could cure him.
        - id: ch01-b03
          speaker: old_woman
          text: You must find the bird called Grip. When he sings, your eyes will open again.
        - id: ch01-b04
          speaker: narrator
          text: The eldest prince offered to fetch the bird. Grip belonged to a king in another country, who kept him caged and guarded him as his greatest treasure. The blind king was overjoyed that his son was willing to attempt such a journey. He equipped the prince as well as he possibly could and sent him on his way.
        - id: ch01-b05
          speaker: narrator
          text: After riding for some distance, the prince reached a crowded inn. It was full of merry guests who drank, sang, and threw dice together. Their joyful life pleased him so much that he stayed at the inn and joined their drinking and games. Soon he had forgotten both his blind father and the bird Grip.
        - id: ch01-b06
          speaker: narrator
          text: Back at the palace, the king waited in hope and fear for his son to return. Time passed, but no word came. Then the second prince asked for permission to search for his brother and bring home the bird as well. The king granted his request, fitted him out in the finest fashion, and let him go.
        - id: ch01-b07
          speaker: narrator
          text: The second prince reached the same inn and found his brother among the revelers. He stayed too, and before long he had also forgotten the bird Grip and their blind father.
        - id: ch01-b08
          speaker: narrator
          text: A long time passed. Neither son returned. The king was deeply troubled. Now he had lost not only his hope of seeing again, but his two eldest sons as well.
        - id: ch01-b09
          speaker: youngest_brother
          text: Father, let me look for my brothers and bring you the bird Grip. I know I can succeed.
        - id: ch01-b10
          speaker: narrator
          text: The king could not bear to risk his third and last son on the same dangerous errand. But the youngest prince pleaded for so long that his father finally had to consent. He too received the finest equipment, just as his brothers had, and then he rode away.
        - id: ch01-b11
          speaker: narrator
          text: He stopped at the same inn. His brothers crowded around him and begged him to stay and enjoy their merry life.
        - id: ch01-b12
          speaker: youngest_brother
          text: I have found both of you. Now I must find the bird Grip, because our blind father is waiting for it. I cannot waste even one hour here.
        - id: ch01-b13
          speaker: narrator
          text: He said farewell and rode on, hoping to find another inn before nightfall.
    - id: ch02
      title: The House in the Forest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The prince rode a long way, and darkness was falling when he came to a lonely house deep in the forest. The host welcomed him in the friendliest manner, put his horse in the stable, and showed the prince into a guest room. There he ordered a maid to lay the table and serve supper.
        - id: ch02-b02
          speaker: narrator
          text: The prince had just begun to eat when dreadful screams and cries came from the next room. He leaped up from the table.
        - id: ch02-b03
          speaker: youngest_brother
          text: What is making those terrible cries? Have I walked into a robbers' den?
          emotion: fearful
        - id: ch02-b04
          speaker: maid
          text: We hear them every night, but they do not come from anyone living. The master killed a guest because the man could not pay for the food he had eaten here. The dead man left nothing to cover his funeral, so the master refuses to bury him. Every night, he goes into that room and lashes the dead body.
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: Then the maid lifted the cover from one of the dishes. A knife and an axe lay there. The prince understood the message. Unless he paid for his life, the host meant to make him choose how he would die.
        - id: ch02-b06
          speaker: narrator
          text: He called for the host and paid him a large sum to spare his own life. Then he paid everything the dead man had owed, along with the cost of a proper burial. In return, the murderer promised that the body would finally be buried.
        - id: ch02-b07
          speaker: narrator
          text: Even then, the prince knew he was not safe. He asked the maid to help him escape that night.
        - id: ch02-b08
          speaker: maid
          text: It may cost me my life. The stable key is under the master's pillow. But I am a prisoner here too. If you will take me with you, I will help you get away.
        - id: ch02-b09
          speaker: youngest_brother
          text: Come with me, then. I promise I will take you away from this place.
        - id: ch02-b10
          speaker: narrator
          text: Together they escaped from the house and rode until they reached another inn far away. There the prince found the maid a good position. Then he continued his journey alone.
    - id: ch03
      title: The Bird Grip
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: As the prince rode alone through a forest, a fox met him. The fox greeted him kindly and asked where he was going and what task had brought him there.
        - id: ch03-b02
          speaker: youngest_brother
          text: My errand is too important to tell everyone I happen to meet.
        - id: ch03-b03
          speaker: fox
          text: You are right to be careful. You are looking for the bird Grip, so you can take him home to your blind father. I can help you, but you must do exactly as I advise.
        - id: ch03-b04
          speaker: narrator
          text: The prince thought this was a very good offer. The fox was ready to travel beside him and show him the road to the castle where Grip sat in his cage. So the prince promised that he would obey the fox's instructions.
        - id: ch03-b05
          speaker: narrator
          text: They crossed the forest together until they saw the castle in the distance. The fox gave the prince three grains of gold.
        - id: ch03-b06
          speaker: fox
          text: Throw one grain into the guardroom, one into the room where Grip is kept, and the last one into his cage. Then you can take him. But do not stroke the bird, or things will go badly for you.
        - id: ch03-b07
          speaker: youngest_brother
          text: I will follow every word of your advice.
        - id: ch03-b08
          speaker: narrator
          text: At the castle, the prince tossed the first grain into the guardroom, and all the guards fell asleep at once. He threw the second grain into the room beside Grip, and everyone keeping watch there sank into sleep as well. When the third grain landed inside the cage, the bird himself closed his eyes.
        - id: ch03-b09
          speaker: narrator
          text: The prince took the beautiful bird in his hand. But he could not resist stroking him. Grip woke and screamed. The whole castle sprang awake, and the prince was seized.
        - id: ch03-b10
          speaker: narrator
          text: In prison, he grieved bitterly. His own disobedience had trapped him and robbed his father of the chance to see again. Then, all at once, the fox stood before him.
        - id: ch03-b11
          speaker: narrator
          text: The prince was delighted to see his friend again. He listened humbly while the fox reproached him for ignoring the warning. Then he promised that he would be more obedient in the future, if only the fox would help him out of this trouble.
        - id: ch03-b12
          speaker: fox
          text: I came to help, but all I can do is give you advice. When they take you to court, answer yes to every question. If you do that, all will go well.
        - id: ch03-b13
          speaker: narrator
          text: The prince obeyed. At his trial, the judge questioned him.
        - id: ch03-b14
          speaker: judge
          text: Did you intend to steal the bird Grip?
        - id: ch03-b15
          speaker: youngest_brother
          text: Yes.
        - id: ch03-b16
          speaker: judge
          text: Are you a master thief?
        - id: ch03-b17
          speaker: youngest_brother
          text: Yes.
        - id: ch03-b18
          speaker: narrator
          text: When the king heard this confession, he offered the prince a bargain.
        - id: ch03-b19
          speaker: bird_king
          text: I will pardon your attempt to steal Grip if you go to the next kingdom, carry off the most beautiful princess in the world, and bring her to me.
        - id: ch03-b20
          speaker: youngest_brother
          text: Yes.
    - id: ch04
      title: The Princess and the Golden Horse
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Outside the castle, the prince found the fox waiting. They went together to the next kingdom. Near the princess's castle, the fox handed him three more grains of gold.
        - id: ch04-b02
          speaker: fox
          text: Throw one into the guardroom, one into the princess's chamber, and one into her bed. But listen carefully. You must not kiss her.
        - id: ch04-b03
          speaker: narrator
          text: The prince entered the castle and used the gold exactly as he had been told. Everyone fell asleep. But when he lifted the beautiful princess into his arms, he forgot the warning and kissed her.
        - id: ch04-b04
          speaker: narrator
          text: The princess woke, and so did everyone else in the castle. The prince was captured and shut inside a strong dungeon.
        - id: ch04-b05
          speaker: narrator
          text: Once again, the fox came to him inside the dungeon. He reproached the prince for disobeying a second time, but still promised to help him escape this trouble. All the prince had to do was answer yes to every question at his trial. The prince willingly agreed.
        - id: ch04-b06
          speaker: judge
          text: Did you mean to steal the princess?
        - id: ch04-b07
          speaker: youngest_brother
          text: Yes.
        - id: ch04-b08
          speaker: judge
          text: Are you a master thief?
        - id: ch04-b09
          speaker: youngest_brother
          text: Yes.
        - id: ch04-b10
          speaker: narrator
          text: The princess's father learned of the confession and offered another bargain.
        - id: ch04-b11
          speaker: princess_king
          text: I will pardon you if you go to the next kingdom and steal the horse with four golden shoes.
        - id: ch04-b12
          speaker: youngest_brother
          text: Yes.
        - id: ch04-b13
          speaker: narrator
          text: The prince left the castle and had not gone far before he met the fox. Once more, they continued their journey side by side. When they finally reached the castle in the next kingdom, the fox gave the prince three grains of gold for the third time.
        - id: ch04-b14
          speaker: fox
          text: One grain goes into the guardroom, one into the stable, and one into the horse's stall. A beautiful golden saddle hangs above the stall. Do not touch it. If you bring more trouble on yourself now, I will not be able to help you again.
        - id: ch04-b15
          speaker: youngest_brother
          text: This time I will be firm.
        - id: ch04-b16
          speaker: narrator
          text: The prince threw each grain in its proper place and untied the horse. Then he saw the golden saddle. Surely, he thought, only that saddle was fine enough for such a beautiful horse, especially one with golden shoes.
        - id: ch04-b17
          speaker: narrator
          text: He stretched out his hand toward the saddle. At once, some unseen being struck his arm so hard that the whole arm went numb. The blow reminded him of his promise and of the danger he was in. Without looking at the golden saddle again, he led the horse out of the castle.
        - id: ch04-b18
          speaker: narrator
          text: The fox was waiting beyond the castle walls. The prince admitted how close he had come to giving in again.
        - id: ch04-b19
          speaker: fox
          text: I know. I was the one who struck your arm.
    - id: ch05
      title: The Three Treasures
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As they traveled on, the prince confessed that he could not forget the beautiful princess.
        - id: ch05-b02
          speaker: youngest_brother
          text: Would it not be wonderful if she rode this golden-shod horse home to my father's palace?
        - id: ch05-b03
          speaker: fox
          text: That would be excellent. Go and carry her away now, and I will give you three grains of gold to do it.
        - id: ch05-b04
          speaker: youngest_brother
          text: I am ready. This time I will control myself, and I will not kiss her.
        - id: ch05-b05
          speaker: narrator
          text: The prince took the gold and entered the castle. He carried off the princess, seated her on the beautiful horse, and went on his way.
        - id: ch05-b06
          speaker: narrator
          text: When they drew near the castle where Grip was still caged, the prince asked the fox for three more grains of gold. The fox gave them to him. The prince used them as he had before, but this time he remembered the warning and carried off the bird without making a mistake.
        - id: ch05-b07
          speaker: narrator
          text: Joy filled him. His blind father could recover his sight at last. And now the prince had the world's most beautiful princess and the horse with four golden shoes.
        - id: ch05-b08
          speaker: narrator
          text: The prince and princess traveled happily together, with the fox following beside them. At last they reached the forest where the prince and fox had first met.
        - id: ch05-b09
          speaker: fox
          text: Here we must part. You have everything your heart desired, and your journey home will prosper, as long as you do not pay money to ransom anyone's life.
        - id: ch05-b10
          speaker: narrator
          text: The prince thanked the fox for every kindness and promised to pay close attention to this last warning. Then the two friends said farewell. The prince rode on toward his father's palace with the princess beside him and the bird Grip perched upon his wrist.
        - id: ch05-b11
          speaker: narrator
          text: Before long, they came to the inn where his elder brothers had stayed and forgotten their quest. This time there was no merry song and no noise of revelry. As the prince drew nearer, he saw two gallows standing outside. He and the princess entered. Every room was hung in black, and everything around them seemed to warn of sorrow and death.
        - id: ch05-b12
          speaker: narrator
          text: The prince asked what had happened.
        - id: ch05-b13
          speaker: innkeeper
          text: Two princes will be hanged for debt today. They spent all their money on feasting and games, and they owe the host more than they can pay. No one has come to ransom them, so the law says they must hang.
        - id: ch05-b14
          speaker: narrator
          text: The youngest prince knew the condemned men were his brothers. The thought of two princes dying in such shame cut him to the heart. He had enough money, so he paid their debts and ransomed their lives.
        - id: ch05-b15
          speaker: narrator
          text: At first, the brothers were grateful to have their freedom. Then they saw everything their youngest brother had won, and gratitude turned to jealousy. They plotted to destroy him, take Grip, the princess, and the horse with the golden shoes, then carry all three home and present them to their blind father as their own prizes.
        - id: ch05-b16
          speaker: narrator
          text: Once they had settled their treacherous plan, they lured their brother to a lions' den and threw him inside. They put the princess on the horse, took the bird, and rode toward home.
        - id: ch05-b17
          speaker: narrator
          text: The princess wept bitterly, but the brothers threatened her.
        - id: ch05-b18
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: Tell everyone that we won these treasures, or it will cost you your life.
          emotion: angry
    - id: ch06
      title: The Fox's Last Request
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The two brothers reached their father's palace with the princess, Grip, and the horse. They were welcomed with great rejoicing, and everyone praised their courage and bravery. But amid all the celebration, the king asked what had become of his youngest son.
        - id: ch06-b02
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: He wasted his life at the inn and was hanged for debt.
        - id: ch06-b03
          speaker: narrator
          text: The king grieved bitterly, for the youngest prince was his dearest son. Before long, all joy in the treasures died away. Grip would not sing, so the king's eyes stayed dark. The princess wept through every day and every night. And the horse was so unapproachable that no one dared go near enough even to look at its golden shoes.
        - id: ch06-b04
          speaker: narrator
          text: Down in the lions' den, the youngest prince discovered the fox sitting there. The lions did not tear the prince to pieces. Instead, they received him with the greatest friendliness. Nor was the fox angry with him for forgetting that final warning about ransoming a life.
        - id: ch06-b05
          speaker: fox
          text: Sons who could forget their old father and disgrace their royal birth would not hesitate to betray their own brother.
        - id: ch06-b06
          speaker: narrator
          text: The fox lifted the prince safely out of the lions' den. Then he told him exactly what he must do to recover his rights and reveal the truth. The prince thanked him with all his heart for helping him once again and for proving such a true friend.
        - id: ch06-b07
          speaker: fox
          text: If I have truly helped you, then I ask one service in return.
        - id: ch06-b08
          speaker: youngest_brother
          text: I will do anything for you that is within my power.
        - id: ch06-b09
          speaker: fox
          text: I ask only this. Take your sword and cut off my head.
        - id: ch06-b10
          speaker: narrator
          text: The prince was astonished. He said he could never cut off the head of his truest friend. The fox insisted that it was the greatest service the prince could do for him, but the prince still refused.
        - id: ch06-b11
          speaker: narrator
          text: Then the fox grew very sorrowful.
        - id: ch06-b12
          speaker: fox
          text: By refusing me, you force me to do what I most hate to do. If you will not cut off my head, then I must kill you.
          emotion: sad
        - id: ch06-b13
          speaker: narrator
          text: At last, the prince drew his good sword and cut off the fox's head. In the very next moment, a young man stood before him.
        - id: ch06-b14
          speaker: fox
          text: Thank you. You have freed me from a spell that even death could not break. I am the dead man who lay unburied at the robber's inn. You paid my debt and gave me an honorable burial, and that is why I helped you on your journey.
        - id: ch06-b15
          speaker: narrator
          text: Then the two parted. The prince disguised himself as a horseshoer and went to his father's palace to offer his services.
    - id: ch07
      title: Grip Sings at Last
      blocks:
        - id: ch07-b01
          speaker: palace_man_1
          text: We do need a horseshoer. But he must be able to lift the feet of the horse with the golden shoes, and no one has managed that yet.
        - id: ch07-b02
          speaker: youngest_brother
          text: Let me see the horse.
        - id: ch07-b03
          speaker: narrator
          text: The moment the disguised prince entered the stable, the horse neighed a friendly greeting. It stood as quiet as a lamb while he lifted each hoof in turn and showed the king's men the famous golden shoes.
        - id: ch07-b04
          speaker: narrator
          text: Afterward, the men spoke of the bird Grip. They could not understand why he refused to sing, no matter how carefully they tended him.
        - id: ch07-b05
          speaker: youngest_brother
          text: I know that bird well. I saw him in his cage at another king's palace. If he will not sing here, then something he needs is missing. I know his ways, and if you let me see him, I can tell you at once what he lacks.
        - id: ch07-b06
          speaker: narrator
          text: The king's men discussed whether they dared bring this unknown horseshoer before the king. Grip was kept in the royal chamber, where the weeping princess also sat. At last, the men decided that the chance was worth taking, and they led the stranger inside.
        - id: ch07-b07
          speaker: youngest_brother
          text: Grip!
        - id: ch07-b08
          speaker: narrator
          text: The instant the prince called the bird by name, Grip began to sing and the princess began to smile. Darkness cleared from the king's eyes. The longer and more sweetly Grip sang, the more clearly the king could see, until at last he recognized his beloved youngest son beneath the horseshoer's disguise.
        - id: ch07-b09
          speaker: princess
          text: Your two elder sons betrayed their brother. They threw him into a lions' den, stole the bird and the horse, and threatened my life unless I said the treasures were theirs.
        - id: ch07-b10
          speaker: father
          text: For this cruel treachery against their own brother, they are banished from my kingdom.
        - id: ch07-b11
          speaker: narrator
          text: The youngest prince married the princess. His father gave him the horse with the golden shoes and half the kingdom. As long as the old king lived, he kept the bird Grip beside him.
        - id: ch07-b12
          speaker: narrator
          text: And now Grip sang with all his heart for the king and everyone at court.
