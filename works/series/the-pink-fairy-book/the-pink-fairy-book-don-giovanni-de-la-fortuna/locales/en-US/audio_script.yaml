  chapters:
    - id: ch01
      title: The Devil's Bargain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Don Giovanni de la Fortuna once lived in a beautiful house his father had built. He spent money freely, and before long there was nothing left. The rich man who had once had everything he wanted had to dress as a pilgrim. He wandered from place to place and begged for bread.
        - id: ch01-b02
          speaker: narrator
          text: One day, as Don Giovanni walked along a broad road, a handsome stranger stopped him. Don Giovanni did not know that this man was the devil himself.
        - id: ch01-b03
          speaker: devil
          text: Would you like to be rich again and live pleasantly?
        - id: ch01-b04
          speaker: don_giovanni
          text: Of course I would.
        - id: ch01-b05
          speaker: devil
          text: Then take this purse. Say, “Dear purse, give me some money,” and it will give you as much as you want. But the magic works only on one condition. For three years, three months, and three days, you must not wash, comb your hair, shave your beard, or change your clothes. Keep that promise faithfully. When the time is over, the purse will be yours, and I will demand nothing else from you.
        - id: ch01-b06
          speaker: narrator
          text: Don Giovanni never worried about the future. He gave no thought to how miserable those three years would feel. He thought only of all the things the purse could buy, things he had been forced to live without. Delighted, he slipped the purse into his pocket and went on his way.
        - id: ch01-b07
          speaker: narrator
          text: At first he asked the purse for money simply because he enjoyed doing it, and it always gave him all he needed. For a little while he hardly noticed the dirt gathering on him. That soon changed. His filthy hair became matted and fell over his eyes. His pilgrim's clothes turned into a dreadful heap of rags and tatters.
    - id: ch02
      title: The Palace on the Road
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One bright, warm morning, Don Giovanni passed a fine palace. He sat on its steps and tried to shake away some of the dust he had gathered on the road. A maid soon spotted him and hurried to her master.
        - id: ch02-b02
          speaker: maid
          text: Please, sir, send that beggar away from the steps. He will spread his dirt through the whole house.
          emotion: disgusted
        - id: ch02-b03
          speaker: narrator
          text: The master came outside, but he called from a safe distance. He was truly afraid to go near Don Giovanni.
        - id: ch02-b04
          speaker: gentleman
          text: You filthy beggar! Get away from my house at once!
          emotion: angry
        - id: ch02-b05
          speaker: don_giovanni
          text: There is no need to speak so rudely. I am no beggar. If I wished, I could make you and your wife leave this house instead.
        - id: ch02-b06
          speaker: gentleman
          text: And how could you possibly do that?
        - id: ch02-b07
          speaker: don_giovanni
          text: Will you sell me the house? I can buy it from you this very moment.
        - id: ch02-b08
          speaker: narrator
          text: The gentleman laughed to himself. He thought the filthy stranger had lost his senses, so he decided to accept the offer as a joke.
        - id: ch02-b09
          speaker: gentleman
          text: Very well. Come with me to a lawyer, and we will have a contract prepared.
        - id: ch02-b10
          speaker: narrator
          text: Don Giovanni followed him. Their agreement said that the house would be sold at once, with a large payment due in eight days.
        - id: ch02-b11
          speaker: narrator
          text: Then Don Giovanni rented two rooms at an inn. Standing in one of them, he took out the magic purse.
        - id: ch02-b12
          speaker: don_giovanni
          text: Dear purse, fill this room with gold.
        - id: ch02-b13
          speaker: narrator
          text: Don Giovanni let the purse go on filling the room. Eight days later, gold reached from wall to wall, and not one more coin could have fitted inside.
        - id: ch02-b14
          speaker: narrator
          text: When the gentleman arrived for his payment, Don Giovanni led him to the room.
        - id: ch02-b15
          speaker: don_giovanni
          text: There it is. Take as much as the contract calls for.
        - id: ch02-b16
          speaker: narrator
          text: The gentleman stared at the gold with his mouth open. Still, he had promised to sell. He collected his money and went away with his wife to find another home. Don Giovanni left the inn and settled in the palace. His dirt and rags looked sadly out of place in those beautiful rooms, and each day they grew worse.
    - id: ch03
      title: A Royal Offer
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: In time, news of Don Giovanni's riches reached the king. The king was always short of money, so he summoned Don Giovanni and asked to borrow a great sum. Don Giovanni readily agreed. The next day, he sent an enormous wagon piled with sacks of gold.
        - id: ch03-b02
          speaker: king
          text: Who can this man be? He is richer than I am!
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: The king kept what he needed and ordered his servants to return the rest. Don Giovanni would not accept it.
        - id: ch03-b04
          speaker: don_giovanni
          text: Tell His Majesty that his offer has wounded me. I certainly will not take back that little handful of gold. If he refuses to keep it, then you may keep it yourself.
        - id: ch03-b05
          speaker: narrator
          text: The servant delivered the message. Now the king wondered more than ever how any man could possess such wealth. At last, he turned to the queen.
        - id: ch03-b06
          speaker: king
          text: My dear wife, this man has done me a great service. He also acted like a gentleman when he refused to take back the extra money. I want him to marry our eldest daughter.
        - id: ch03-b07
          speaker: narrator
          text: The queen was quite pleased with the idea. Once again, a messenger went to Don Giovanni. This time, he brought the king's offer of the eldest princess's hand in marriage.
        - id: ch03-b08
          speaker: don_giovanni
          text: His Majesty is far too kind. I can only accept this great honor with humility.
        - id: ch03-b09
          speaker: narrator
          text: The messenger carried back his answer. Soon he returned with another request. The royal family wanted Don Giovanni's portrait, so they could see what sort of man to expect. The portrait arrived, and the eldest princess saw the dreadful figure in it.
        - id: ch03-b10
          speaker: eldest_princess
          text: What? You expect me to marry this filthy beggar? Never! Never!
          emotion: disgusted
        - id: ch03-b11
          speaker: king
          text: My child, how could I have guessed that the wealthy Don Giovanni looked like this? But I gave my royal word. I cannot break it, and there is nothing I can do for you.
        - id: ch03-b12
          speaker: eldest_princess
          text: No, Father! You may cut off my head if you wish, but I will never marry that horrible beggar!
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: The queen took her eldest daughter's side. She bitterly scolded the king for expecting the princess to marry such a creature.
        - id: ch03-b14
          speaker: youngest_princess
          text: Dear Father, please do not look so sad. You have given your word, so I will marry Don Giovanni.
        - id: ch03-b15
          speaker: narrator
          text: The king threw his arms around his youngest daughter. He thanked her and kissed her. The queen and the eldest princess only laughed at her and mocked her choice.
    - id: ch04
      title: The End of the Bargain
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The marriage was settled. The king sent one of his lords to ask Don Giovanni when the wedding should take place, so the princess could prepare.
        - id: ch04-b02
          speaker: don_giovanni
          text: Let the wedding be two months from now.
        - id: ch04-b03
          speaker: narrator
          text: The time set by the devil was almost over. Don Giovanni wanted an entire month to wash away the dirt of the past three years.
        - id: ch04-b04
          speaker: narrator
          text: The very moment his bargain with the devil ended, he had his beard shaved and his hair cut. His rags were burned. Day and night, he lay in a bath of clear, warm water. At last, he felt clean again.
        - id: ch04-b05
          speaker: narrator
          text: Don Giovanni dressed in splendid clothes and hired a beautiful ship. Then he sailed in great state to the king's palace.
    - id: ch05
      title: The Wedding and the Crown
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The entire royal family came down to the ship to welcome him. All along the way, the queen and the eldest princess kept teasing the youngest daughter about the filthy husband she was going to have.
        - id: ch05-b02
          speaker: narrator
          text: Then they saw how handsome Don Giovanni truly was. Envy and anger filled their hearts so completely that they could not see where they were going. Both fell into the sea and drowned.
        - id: ch05-b03
          speaker: narrator
          text: The youngest princess rejoiced at the good fortune that had come to her. When the days of mourning for her mother and sister were over, she and Don Giovanni had a splendid wedding.
        - id: ch05-b04
          speaker: narrator
          text: Soon afterward, the old king died, and Don Giovanni became king.
        - id: ch05-b05
          speaker: narrator
          text: He was rich and happy for the rest of his days. He loved his wife, and his purse always gave him money.
