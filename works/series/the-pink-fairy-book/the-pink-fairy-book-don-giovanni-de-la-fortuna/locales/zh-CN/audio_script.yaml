audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    don_giovanni:
      display_name: "唐·乔万尼"
      tts:
        delivery: "随性自信，富贵以后更显大方"
        timbre: "明朗厚实的男声"
        pace: "从容"
        pitch: "中音"
    devil:
      display_name: "魔鬼"
      tts:
        delivery: "彬彬有礼，话里藏着诱惑"
        timbre: "光滑低沉的男声"
        pace: "不紧不慢"
        pitch: "中低音"
    maid:
      display_name: "女仆"
      tts:
        delivery: "谨慎拘束，嫌恶时仍守着礼数"
        timbre: "清楚利落的女声"
        pace: "稍快"
        pitch: "中高音"
    gentleman:
      display_name: "绅士"
      tts:
        delivery: "自负轻慢，受惊时失去从容"
        timbre: "圆润端正的男声"
        pace: "适中"
        pitch: "中音"
    king:
      display_name: "国王"
      tts:
        delivery: "庄重威严，也有为难与惊叹"
        timbre: "沉稳洪亮的男声"
        pace: "稍慢"
        pitch: "中低音"
    queen:
      display_name: "王后"
      tts:
        delivery: "高傲强势，喜怒都十分鲜明"
        timbre: "饱满锐利的女声"
        pace: "适中"
        pitch: "中高音"
    elder_princess:
      display_name: "大公主"
      tts:
        delivery: "骄傲任性，受到冒犯时激烈尖锐"
        timbre: "清亮偏尖的年轻女声"
        pace: "稍快"
        pitch: "高音"
    younger_princess:
      display_name: "小公主"
      tts:
        delivery: "温柔坚定，面对嘲弄仍不失从容"
        timbre: "柔和清澈的年轻女声"
        pace: "平稳"
        pitch: "中高音"
  chapters:
    - id: ch01
      title: "魔鬼的钱袋"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "很久以前，唐·乔万尼·德拉·福尔图纳住在父亲建造的漂亮房子里。他花钱从来没有节制，很快就把家产挥霍得一干二净。昔日的富人只好披上朝圣者的衣服，四处流浪，向人讨饭。"
        - id: ch01-b02
          speaker: narrator
          text: "一天，他走在一条宽阔的大路上，一名陌生的英俊男子拦住了他。唐·乔万尼并不知道，这个人就是魔鬼。"
        - id: ch01-b03
          speaker: devil
          text: "你愿不愿意变得富有，往后舒舒服服地过日子？"
        - id: ch01-b04
          speaker: don_giovanni
          text: "那还用问？我当然愿意。"
        - id: ch01-b05
          speaker: devil
          text: "拿着这只钱袋。你只要叫它给钱，它就会给你想要的数目。不过，三年三个月零三天以内，你不能洗澡，不能梳头，不能刮胡子，也不能换衣服。只要一天不少地守住约定，期满以后，钱袋永远归你，我也不再提任何条件。"
        - id: ch01-b06
          speaker: narrator
          text: "唐·乔万尼从不操心未来。他没去想三年不洗不换会有多难受，只想着有了钱袋，从前不得不放弃的种种享受都能重新得到，便高高兴兴收下钱袋，继续赶路。起初，他连取乐时也要向钱袋要钱，袋里总会出现足够的金币。他甚至忘了自己正一天比一天肮脏。"
        - id: ch01-b07
          speaker: narrator
          text: "可没过多久，他的头发就和污垢粘成一团，垂在眼前。朝圣者的衣裳也烂成了碎布，模样实在骇人。"
    - id: ch02
      title: "用黄金买下的房子"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "一个阳光灿烂、天气温暖的早晨，唐·乔万尼经过一座华美的宅邸。他坐到门前台阶上，想把一路沾在身上的尘土抖落一些。没过几分钟，女仆便看见了他。"
        - id: ch02-b02
          speaker: maid
          text: "老爷，请您把台阶上的乞丐赶走吧。他再坐下去，整幢房子都会被弄脏。"
        - id: ch02-b03
          speaker: narrator
          text: "主人走出门，却怕得不敢靠近，只在远处朝他大喊。"
        - id: ch02-b04
          speaker: gentleman
          text: "肮脏的乞丐，立刻离开我的房子！"
          emotion: disgusted
        - id: ch02-b05
          speaker: don_giovanni
          text: "何必这样无礼？我不是乞丐。我要是真想这么做，还能让你和妻子从这幢房子里搬出去。"
        - id: ch02-b06
          speaker: gentleman
          text: "就凭你？你倒说说，怎么让我搬出去？"
        - id: ch02-b07
          speaker: don_giovanni
          text: "把房子卖给我吧，我现在就买下来。"
        - id: ch02-b08
          speaker: narrator
          text: "绅士认定这个脏兮兮的家伙疯了，索性拿他取乐，假装接受出价。"
        - id: ch02-b09
          speaker: gentleman
          text: "行啊，跟我去找律师。我们这就把契约写好。"
        - id: ch02-b10
          speaker: narrator
          text: "两人立下契约，房子马上归唐·乔万尼，只等他在八天后交出一大笔钱。他随即在客店租了两个房间，走进其中一间。"
        - id: ch02-b11
          speaker: don_giovanni
          text: "亲爱的钱袋，请把这间屋子装满黄金。"
        - id: ch02-b12
          speaker: narrator
          text: "到了第八天，金子已经把房间塞得满满当当，再多一枚也放不下。原来的房主前来收钱，唐·乔万尼领他进屋。"
        - id: ch02-b13
          speaker: don_giovanni
          text: "金子都在这里，你需要多少，只管往口袋里装。"
        - id: ch02-b14
          speaker: narrator
          text: "绅士看得目瞪口呆，可卖房的话已经说出口，他只得照约定取走钱，带着妻子另找住所。唐·乔万尼离开客店，搬进了漂亮的新家。只是他身上的破布和污垢放在这样的房间里格外刺眼，而且还在越积越多。"
    - id: ch03
      title: "国王的婚约"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "唐·乔万尼富有的名声终于传进王宫。国王总为钱发愁，便召他前来，请他借出一大笔钱。唐·乔万尼一口答应，第二天就送来一辆巨大的马车，车上堆满一袋袋黄金。"
        - id: ch03-b02
          speaker: king
          text: "这个人到底是什么来历？他的财富竟然远远超过了我！"
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: "国王留下自己需要的数目，叫人把其余黄金送回去。唐·乔万尼却连一枚也不肯收。"
        - id: ch03-b04
          speaker: don_giovanni
          text: "请告诉陛下，他要退钱，实在让我难过。这么一点黄金，我绝不会拿回来。陛下若不肯收，你就留下吧。"
        - id: ch03-b05
          speaker: narrator
          text: "仆人照实回禀。国王听完更加惊奇，想不明白世上怎会有如此富有的人。他转身同王后商量。"
        - id: ch03-b06
          speaker: king
          text: "亲爱的，他帮了我这样大的忙，又不许我退还余款，做事很有绅士风度。我想把大女儿许配给他。"
        - id: ch03-b07
          speaker: narrator
          text: "王后很赞成。使者又去了一趟，替国王向唐·乔万尼提出婚事。"
        - id: ch03-b08
          speaker: don_giovanni
          text: "陛下这样看重我，我只能恭敬地接受这份荣幸。"
        - id: ch03-b09
          speaker: narrator
          text: "使者带着答复回宫，后来又奉命去了一趟。王室请唐·乔万尼送来一幅画像，想先知道未来的女婿究竟是什么模样。画像一到，大公主看见画里那个满身污垢、衣衫破烂的人，立刻尖叫起来。"
        - id: ch03-b10
          speaker: elder_princess
          text: "让我嫁给这样一个脏乞丐？不可能，我绝不答应！"
          emotion: disgusted
        - id: ch03-b11
          speaker: king
          text: "孩子，我哪里料得到，富有的唐·乔万尼会是这副模样？可我是国王，已经许下的诺言不能收回。你只能嫁给他。"
        - id: ch03-b12
          speaker: elder_princess
          text: "父亲，就算您砍下我的头，我也不会嫁给那个可怕的乞丐！"
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: "王后站到大女儿那边，狠狠责怪国王，怎么能让女儿嫁给这种人。这时，小公主开口了。"
        - id: ch03-b14
          speaker: younger_princess
          text: "父亲，请别难过。您既然已经答应了人家，就让我嫁给唐·乔万尼吧。"
          emotion: calm
        - id: ch03-b15
          speaker: narrator
          text: "国王一把搂住小女儿，不住地向她道谢，又亲吻了她。王后和大公主却没有一句好话，只顾在一旁嘲笑、讥讽她。婚事就此定下，国王又派一位大臣去询问婚期，好让小公主提前准备。"
        - id: ch03-b16
          speaker: don_giovanni
          text: "请把婚礼定在两个月以后。"
        - id: ch03-b17
          speaker: narrator
          text: "魔鬼规定的期限就要结束了。唐·乔万尼想给自己留下整整一个月，好把三年来积下的污垢彻底洗净。"
    - id: ch04
      title: "英俊的新郎"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "约定期满的那一刻，唐·乔万尼立刻刮掉胡子，剪短头发，烧掉身上的破衣。他日日夜夜泡在清澈温暖的浴水中，直到觉得自己终于恢复了洁净。随后，他换上华丽衣裳，租了一艘漂亮的大船，体面地驶向王宫。"
        - id: ch04-b02
          speaker: narrator
          text: "王室全家来到船边迎接。一路上，王后和大公主还在嘲笑小公主，说她就要得到一个肮脏的丈夫。可她们真正看见唐·乔万尼时，才发现他原来十分英俊。"
        - id: ch04-b03
          speaker: narrator
          text: "王后和大公主顿时又妒忌又愤怒，气得眼前发黑，一起跌进海里淹死了。小公主则为降临在自己身上的好运感到欢喜。等她为母亲和姐姐服完丧，便同唐·乔万尼举行了一场盛大的婚礼。"
        - id: ch04-b04
          speaker: narrator
          text: "不久，老国王去世，唐·乔万尼成为新的国王。他深爱自己的妻子，魔法钱袋也始终给他取之不尽的财富。就这样，他富足幸福地度过了一生。"
