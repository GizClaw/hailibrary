audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    snow_man:
      display_name: 雪人
      tts:
        delivery: 天真自信，话里带着一本正经的稚气
        timbre: 清亮而略显僵硬
        pace: 中速
        pitch: 中音
    yard_dog:
      display_name: 看院狗
      tts:
        delivery: 老练直率，偶尔带着自嘲和粗声的幽默
        timbre: 低沉沙哑
        pace: 稍缓
        pitch: 中低音
    girl:
      display_name: 年轻姑娘
      tts:
        delivery: 明朗温柔，赞叹时真挚轻快
        timbre: 清澈柔美
        pace: 中速
        pitch: 中高音
    young_man:
      display_name: 年轻男子
      tts:
        delivery: 开朗亲切，玩笑说得自然爽快
        timbre: 明亮温厚
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 刚刚来到世上的雪人
      blocks:
        - id: ch01-b01
          speaker: snow_man
          text: 冷得真吓人！我浑身都快冻裂了！这风像刀子一样，简直要把命割走。还有上面那个火红的东西，它干吗这样瞪着我？不过我才不会眨眼。我会一直冷静下去。
        - id: ch01-b02
          speaker: narrator
          text: 雪人说的，是正在落山的太阳。他有两块三角形的大石板当眼睛，嘴巴是一把旧耙子，因此还长了一排牙齿。男孩子们刚在欢笑声中把他堆好，雪橇的铃铛和噼啪作响的鞭子便一起迎接了他。
        - id: ch01-b03
          speaker: narrator
          text: 太阳落下去以后，一轮满月升上深蓝的天空。月亮又大又圆，清澈而美丽。
        - id: ch01-b04
          speaker: snow_man
          text: 瞧，它从另一边又出来了！现在它再怎么瞪我，我也习惯啦。真希望它一直挂在那里，好让我看看自己是什么模样。可我要怎样才能换个地方呢？我很想走动走动。要是会动，我也要像那些男孩子一样，在冰面上滑来滑去。偏偏我连怎么跑都不知道。
        - id: ch01-b05
          speaker: narrator
          text: 雪人把月亮当成了刚才的太阳。院子里的老狗听完，扯着沙哑的嗓子叫起来。他从前住在屋里，常躺在火炉前，嗓子就是那时候变哑的。
        - id: ch01-b06
          speaker: yard_dog
          text: 汪！汪！太阳很快就会教你跑。我去年冬天见过你的前任，再往前那些雪人也是一样。他们最后全跑掉了！
        - id: ch01-b07
          speaker: snow_man
          text: 朋友，我听不明白。你说上头那个东西会教我跑？可它刚才的确跑了呀。我先看见它在那一边，现在又跑到这一边来了。
        - id: ch01-b08
          speaker: yard_dog
          text: 你才刚刚造出来，当然什么都不懂。现在这个叫月亮，刚才从另一边落下去的才是太阳。明天早上，太阳还会升起来。到时候，他很快就会教你沿着水沟跑掉。我左后腿已经疼了，天气准要变。
        - id: ch01-b09
          speaker: snow_man
          text: 这条狗的话，我一句也听不懂。不过他讲的准不是什么好事。那个先瞪着我、后来又不见了的太阳，绝不是我的朋友。我天生就知道。
    - id: ch02
      title: 白霜、恋人与老狗的往事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 老狗汪汪叫了两声，原地转过三圈，就钻进狗窝睡觉去了。天气果然变了。清晨前，湿漉漉的浓雾罩住四周，随后冰冷的风刮过，寒霜也来了。
        - id: ch02-b02
          speaker: narrator
          text: 等太阳升起，眼前简直像换了一个世界。树木和灌丛披满白霜，成了一片珊瑚林。每根树枝都密密开着修长的白花。夏天藏在叶子里、细得几乎看不见的嫩枝，如今全都显了出来，仿佛织成一张闪闪发亮的白蛛网。白桦迎风摇摆，阳光落下来，到处像撒了钻石粉，连雪地上都躺着一颗颗大钻石。
        - id: ch02-b03
          speaker: narrator
          text: 一位姑娘和一个年轻男子走进花园，在雪人旁边停下。他们一同望着结霜的树林，姑娘的眼睛也跟着亮了起来。年轻男子指了指雪人。
        - id: ch02-b04
          speaker: girl
          text: 多美呀！就算是夏天，也拿不出比这更美的景色。
          emotion: happy
        - id: ch02-b05
          speaker: young_man
          text: 而且到了夏天，也找不到这么漂亮的家伙。瞧这个雪人，他可真神气！
        - id: ch02-b06
          speaker: narrator
          text: 姑娘笑着向雪人点点头，随后和年轻男子踏过白雪，像跳舞一样走远了。
        - id: ch02-b07
          speaker: snow_man
          text: 刚才那两个人是谁？你在院子里待得久，一定认识他们吧？
        - id: ch02-b08
          speaker: yard_dog
          text: 我当然认识。姑娘常常摸我，那个年轻人还给过我骨头，所以我谁也不会咬。
        - id: ch02-b09
          speaker: snow_man
          text: 可他们究竟是什么呢？
        - id: ch02-b10
          speaker: yard_dog
          text: 他们是一对恋人！以后会住进同一个窝，还会一起啃同一根骨头！
        - id: ch02-b11
          speaker: snow_man
          text: 他们和我们是同一种生灵吗？
        - id: ch02-b12
          speaker: yard_dog
          text: 他们是我们的主人。你只在世上待了一天，懂的事情实在太少。我就不一样了。我年纪大，见识也多，屋里每个人都认识。我还记得自己没有住进这个冷狗窝的日子。汪！汪！
        - id: ch02-b13
          speaker: snow_man
          text: 冷有什么不好？我觉得舒服极了。你再说些从前的事吧，可别把链子弄得那么响。我听着都要裂开啦！
        - id: ch02-b14
          speaker: yard_dog
          text: 从前，大家都夸我是个漂亮的小家伙。那时候我躺在主人家蒙着天鹅绒的椅子上。女主人抱着我，亲我，摸我，还叫我亲亲甜甜的小艾丽斯。后来我长得太大，他们就把我交给管家太太，让我住进厨房。
        - id: ch02-b15
          speaker: yard_dog
          text: 你站在这里就能看见那间屋。我跟管家太太住在一起时，厨房就是我的天下。地方虽然比楼上小，我却过得更舒服。那些孩子再也不能追着我捉弄了。吃的和从前一样好，有时还更好。我有自己的枕头，屋里更有一座火炉。每年到了这个季节，火炉就是世上最美的东西。我总爱钻到它底下。直到现在，我还常常梦见它呢。汪！汪！
        - id: ch02-b16
          speaker: snow_man
          text: 火炉真的那么美？它是不是和我长得差不多？
        - id: ch02-b17
          speaker: yard_dog
          text: 它和你正好相反！它全身乌黑，脖子又细又长，上面接着黄铜管。它会吞木柴，再从嘴里喷出火来。只要靠在旁边，就会舒服得不得了。要是能躺到它底下，那才最好呢。你朝窗户里面看，就能看见它。
        - id: ch02-b18
          speaker: narrator
          text: 雪人顺着老狗所说的方向望去。窗里果然立着一样光滑锃亮的东西，还长着黄铜管。跃动的火光越过雪地，映到了雪人身上。他心里忽然涌起一阵从未有过的欢喜，却说不出那是什么。只要不是雪人，大概都会明白。
    - id: ch03
      title: 对火炉的心事
      blocks:
        - id: ch03-b01
          speaker: snow_man
          text: 你为什么要离开她？这么美的生灵，准是一位女士。你怎么舍得离开那么好的地方？
        - id: ch03-b02
          speaker: yard_dog
          text: 不是我想走，是他们把我赶出来，拴在这里。家里最小的男孩抢走我正啃着的骨头，我就在他腿上咬了一口。我当时想，他拿我一根骨头，我也该还他一根骨头。可他们气坏了。从那以后，我就被拴在院子里，连嗓子也毁了。
        - id: ch03-b03
          speaker: yard_dog
          text: 你听，我现在多哑！汪！汪！我连别的狗那样的叫声都发不出来了。汪！汪！我的好日子就是这样结束的。
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: 可雪人早已没有听他了。他只看着管家太太住的厨房，看着那座用四条铁腿站立的火炉。火炉差不多和他一样高。
        - id: ch03-b05
          speaker: snow_man
          text: 我身体里面怎么裂得这么响？难道我永远也进不了那间屋吗？我不过是有一个再单纯不过的愿望。这样单纯的愿望，就该实现才对。我非到她身边不可。哪怕要先撞破窗户，我也要靠在火炉上！
        - id: ch03-b06
          speaker: yard_dog
          text: 你根本进不去。就算真到了火炉跟前，你也会消失。汪！汪！
        - id: ch03-b07
          speaker: snow_man
          text: 我现在已经和消失差不多了！我觉得自己快要碎了！
        - id: ch03-b08
          speaker: narrator
          text: 一整天，雪人都守着窗户往里看。天色渐暗，那间屋显得更诱人了。火炉放着柔和的光，不像月光，也不像阳光。那是只有吃饱木柴的火炉才有的光。房门一开，炉火就猛地亮起来。这是它独有的脾气。火光红彤彤的，在雪人白色的脸上闪动。
        - id: ch03-b09
          speaker: snow_man
          text: 我真的再也受不了啦！你们看，她把火舌伸出来的样子，多美啊！
        - id: ch03-b10
          speaker: narrator
          text: 那一夜很长，雪人却一点也不嫌长。他站在原地，心里装满甜美的念头。那些心事冻住以后，弄得他全身咔咔直响。
        - id: ch03-b11
          speaker: narrator
          text: 第二天早上，厨房的窗玻璃结满了冰花。那些花美得连雪人看了也该称心，却正好遮住了火炉。窗户打不开，雪人再也见不到那位美丽的火炉姑娘。他的身体里外一阵接一阵地开裂。天气明明冷得足以让任何雪人快活，可他和别的雪人不同，又怎么快活得起来？
        - id: ch03-b12
          speaker: yard_dog
          text: 对雪人来说，你得的可是种怪病。我从前也得过，好在现在已经好了。汪！汪！听着吧，天气又要变了！
    - id: ch04
      title: 冬天结束以后
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 老狗又说中了。天气暖起来，冰雪开始消融。雪一化，雪人也跟着一点点化了。他没有说话，也没有抱怨。这可不是什么好兆头。
        - id: ch04-b02
          speaker: narrator
          text: 一天早晨，雪人彻底垮了。他站过的地方，只剩一根扫帚柄直挺挺地竖着。男孩子们造他的时候，原来就是绕着这根柄堆起了雪。
        - id: ch04-b03
          speaker: yard_dog
          text: 啊，现在我知道他为什么会爱上火炉了！那是清理火炉用的炉耙。原来雪人的身体里一直藏着一把炉耙，这就是他的病根，难怪他会变成那样！如今他彻底完了。汪！汪！
        - id: ch04-b04
          speaker: narrator
          text: 没过多久，冬天也彻底结束了。嗓音沙哑的老狗还在院子里汪汪叫着。那位年轻姑娘却唱起一支歌。
        - id: ch04-b05
          speaker: girl
          text: 树林呀，披上明亮的绿衣裳！柳树呀，戴好毛茸茸的手套！云雀和杜鹃，天天放声歌唱，二月已经把春天送到！我的心也随甜美的歌声欢跳。亲爱的太阳，快出来照耀！
          emotion: happy
        - id: ch04-b06
          speaker: narrator
          text: 再也没有人想起那个雪人。
