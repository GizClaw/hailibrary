audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and mellow
        pace: measured
        pitch: medium
    snow_man:
      display_name: Snow-man
      tts:
        delivery: proud, curious, and increasingly lovestruck
        timbre: crisp and resonant
        pace: measured
        pitch: medium
    yard_dog:
      display_name: Yard-dog
      tts:
        delivery: worldly, blunt, and dryly humorous
        timbre: rough and hoarse
        pace: unhurried
        pitch: low
    girl:
      display_name: Young Girl
      tts:
        delivery: bright, delighted, and lyrical
        timbre: clear and light
        pace: lively
        pitch: medium-high
    young_man:
      display_name: Young Man
      tts:
        delivery: cheerful and playful
        timbre: warm and clear
        pace: easy
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Snow-man Is Born
      blocks:
        - id: ch01-b01
          speaker: snow_man
          text: How terribly cold it is! I am cracking all over. That wind cuts right through me, and look how the fiery thing up there is glaring! Still, it will not make me blink. I shall stay perfectly cool and collected.
        - id: ch01-b02
          speaker: narrator
          text: By the fiery thing, the Snow-man meant the setting sun. He had two large triangles of slate for eyes. An old rake formed his mouth, so he had teeth as well. He had only just been born. The boys had shaped him amid shouts and laughter, while sleigh bells jingled and drivers cracked their whips as the sledges swept past.
        - id: ch01-b03
          speaker: narrator
          text: The sun sank out of sight. Then the full moon rose on the other side of the dark blue sky. It looked large and round, clear and beautiful. The newly made Snow-man mistook it for the same fiery thing he had seen before.
        - id: ch01-b04
          speaker: snow_man
          text: There it is again, only now it is on the other side! I am getting used to that glare. I hope it stays there and shines so I can see myself. But how does one change position? I would dearly like to move. If I could, I would glide up and down the ice as the boys did. Somehow, I simply do not know how to run.
        - id: ch01-b05
          speaker: narrator
          text: An old yard-dog answered with a hoarse bark. He had lost his clear voice back when he lived indoors and slept beside the stove.
        - id: ch01-b06
          speaker: yard_dog
          text: Bow-wow! The sun will teach you to run soon enough. I saw it happen to the snow-man before you, and to the ones before him. Every one of them ran away.
        - id: ch01-b07
          speaker: snow_man
          text: I do not understand, my friend. Will that thing above us teach me to run? It certainly ran. A moment ago it was over there, and now it is on this side.
        - id: ch01-b08
          speaker: yard_dog
          text: You know nothing yet. You were only just made. What you see now is the moon. The thing that went down was the sun. It will rise tomorrow morning, and before long it will teach you to run down the gutter. The weather is changing. I can feel it in my left hind leg.
        - id: ch01-b09
          speaker: snow_man
          text: I cannot make sense of him, but I think he means something unpleasant. That glaring thing which disappears, the one he calls the sun, is no friend of mine. I know it by instinct.
        - id: ch01-b10
          speaker: narrator
          text: The yard-dog barked again, turned around three times, and crept into his kennel to sleep.
    - id: ch02
      title: A Garden of Frost
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The weather truly did change. Near morning, a thick, wet fog covered the whole neighborhood. Later, an icy wind swept in and sent the frost racing over everything. When the sun rose, it revealed a glorious sight.
        - id: ch02-b02
          speaker: narrator
          text: Frost covered every tree and shrub until the garden looked like a forest of coral. Long white blossoms clung thickly to every branch. Even the finest twigs, hidden by leaves all summer, now stood out like webs of shining white. The birches swayed in the wind. Under the sunlight, everything flashed as though diamond dust had fallen over it, with great diamonds scattered across the snowy ground.
        - id: ch02-b03
          speaker: girl
          text: Isn't it wonderful? Even summer cannot give us anything more beautiful than this!
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: A young girl had come into the garden with a young man. Her eyes shone as they stopped beside the Snow-man and gazed at the glittering trees.
        - id: ch02-b05
          speaker: young_man
          text: And summer could never give us a fellow like this one. Just look at him. He is splendid!
          emotion: happy
        - id: ch02-b06
          speaker: narrator
          text: The young man's praise made the girl laugh. She gave the Snow-man a friendly nod, and then she and her companion danced away together across the snow.
        - id: ch02-b07
          speaker: snow_man
          text: Who were those two? You have lived in this yard much longer than I have. Do you know them?
        - id: ch02-b08
          speaker: yard_dog
          text: Of course I know them. She has stroked me many times, and he has brought me bones. I would never bite either one.
        - id: ch02-b09
          speaker: snow_man
          text: But what are they?
        - id: ch02-b10
          speaker: yard_dog
          text: Lovers! They will move into one kennel and gnaw the same bone.
        - id: ch02-b11
          speaker: snow_man
          text: Are they creatures like us?
        - id: ch02-b12
          speaker: yard_dog
          text: They are our masters. Anyone who has been in the world for only one day knows very little. That is what I have learned. I have age and wisdom now. I know everyone in the house, and I remember when I did not have to lie outside in a cold kennel. Bow-wow!
        - id: ch02-b13
          speaker: snow_man
          text: This cold is splendid. Tell me more. Only please stop rattling your chain. The sound makes me crack!
    - id: ch03
      title: The Yard-dog's Story
      blocks:
        - id: ch03-b01
          speaker: yard_dog
          text: Bow-wow! People once called me a pretty little fellow. I had a chair covered in velvet inside my master's house. My mistress held me in her arms, kissed me, and fussed over me. She even called me her dear, sweet little Alice.
        - id: ch03-b02
          speaker: yard_dog
          text: Then I grew too big, so they sent me to live with the housekeeper in the kitchen. You can see that room from where you stand. I was master there, in my way. It was smaller than the rooms upstairs, but far more comfortable. The children did not chase and tease me there. My food was just as good, perhaps better, and I had a pillow of my own.
        - id: ch03-b03
          speaker: yard_dog
          text: Best of all, there was a stove. At this time of year, nothing in the world is more beautiful. I used to crawl right underneath it. Ah, I still dream about that stove. Bow-wow!
        - id: ch03-b04
          speaker: snow_man
          text: Is a stove really so beautiful? Does it look anything like me?
        - id: ch03-b05
          speaker: yard_dog
          text: It is the exact opposite of you. It is black as coal and has a long neck with a brass pipe. It eats firewood, and flames leap from its mouth. You have to stay close beside it. Right underneath is the finest place of all. Look through the window and you can see it from where you stand.
        - id: ch03-b06
          speaker: narrator
          text: The Snow-man turned toward the kitchen window and peered inside. There stood a smooth, polished object with a brass pipe. The fire within it flickered, and its light reached all the way across the snow to him. A wonderful happiness came over the Snow-man. He could not have put that feeling into words, though anyone who is not made of snow knows it well.
        - id: ch03-b07
          speaker: snow_man
          text: Why did you leave her? A lovely creature like that stove must surely be a lady. How could you leave such a place?
        - id: ch03-b08
          speaker: yard_dog
          text: I had no choice. They threw me outdoors and chained me here. The youngest boy took away the bone I was chewing, so I bit him on the leg. A bone for a bone, I thought. They became very angry. I have been chained here ever since, and I lost my voice. You can hear how hoarse I am. Bow-wow! I cannot speak like other dogs. That was the end of my happiness.
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: But the Snow-man was no longer listening. He stared into the housekeeper's room. The stove stood there on four iron legs, and it seemed to be just about his own size.
        - id: ch03-b10
          speaker: snow_man
          text: Something inside me is cracking! Will I never be able to go in there? It is such an innocent wish, and innocent wishes ought to come true. I must reach her and lean against her, even if I have to break the window!
        - id: ch03-b11
          speaker: yard_dog
          text: You will never get inside. And if you did reach the stove, you would disappear. Bow-wow!
        - id: ch03-b12
          speaker: snow_man
          text: I am nearly gone already. I think I am breaking apart!
    - id: ch04
      title: Longing for the Stove
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: All day long, the Snow-man kept his eyes fixed on the stove through the window. He watched until dusk, when the room looked more inviting than ever. The stove gave off a soft, gentle glow. It was nothing like the cold light of the moon or the fierce glare of the sun. It shone in the special way a stove shines when it has been fed with fuel.
        - id: ch04-b02
          speaker: narrator
          text: Whenever the kitchen door opened, the fire flared. That was one of the stove's peculiar ways. Its red light danced across the Snow-man's white face.
        - id: ch04-b03
          speaker: snow_man
          text: I cannot bear this any longer! How beautiful she looks when she stretches out that fiery tongue!
        - id: ch04-b04
          speaker: narrator
          text: The night was long, but it did not seem long to him. He stood lost in pleasant thoughts, and the thoughts froze until he cracked.
        - id: ch04-b05
          speaker: narrator
          text: By morning, ice covered every pane of the kitchen window. It had formed the loveliest frost flowers any snow-man could wish for. But those flowers hid the stove completely, and the frozen window would not open. The Snow-man could no longer catch even one glimpse of the beautiful lady he longed for.
        - id: ch04-b06
          speaker: narrator
          text: Cracks sounded inside him and all around him. The frost was so hard that any ordinary snow-man would have delighted in it. This Snow-man was no longer ordinary. How could he be happy?
        - id: ch04-b07
          speaker: yard_dog
          text: You have a terrible sickness for a snow-man. I suffered from it once, but I got over it. Bow-wow! The weather is going to change.
        - id: ch04-b08
          speaker: narrator
          text: And the weather did change. A thaw began.
        - id: ch04-b09
          speaker: narrator
          text: As the thaw spread through the yard, the Snow-man began to melt and sink down. He said nothing at all, and he never once complained. Silence like that was a bad sign.
    - id: ch05
      title: The End of Winter
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One morning, the Snow-man collapsed completely. In the place where he had stood, a broomstick remained upright. The boys had packed the snow around it when they built him.
        - id: ch05-b02
          speaker: yard_dog
          text: Ah! Now I understand why he loved the stove. That stick is the rake they use to clean it out. The Snow-man had a stove-raker inside his body. That was what troubled him all along. And now it is all over for him. Bow-wow!
        - id: ch05-b03
          speaker: narrator
          text: Before long, winter was over too.
        - id: ch05-b04
          speaker: yard_dog
          text: Bow-wow!
        - id: ch05-b05
          speaker: narrator
          text: Then the young girl sang.
        - id: ch05-b06
          speaker: girl
          text: Woods, put on your bright green clothes! Willows, pull on your woolly gloves! Let the lark and cuckoo sing each day. February has brought the spring! My heart joins in your lovely song. Come out, dear sun, and greet the world!
          emotion: happy
        - id: ch05-b07
          speaker: narrator
          text: And no one thought of the Snow-man.
