audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    sucy:
      display_name: "苏西"
      tts:
        delivery: "年轻腼腆，笨拙中带着诚恳和勇气"
        timbre: "清朗温和的年轻男声"
        pace: "适中，紧张时稍快"
        pitch: "中音"
    diaphana:
      display_name: "迪亚法娜"
      tts:
        delivery: "讲究礼节，娇弱而略带挑剔"
        timbre: "轻盈清脆的年轻女声"
        pace: "舒缓"
        pitch: "中高音"
    aveline:
      display_name: "阿夫琳"
      tts:
        delivery: "聪慧坚定，化作老妇人时直率而爱絮叨"
        timbre: "温厚清楚的成熟女声"
        pace: "从容"
        pitch: "中低音"
    minon_minette:
      display_name: "米侬—米奈特"
      tts:
        delivery: "高贵爽朗，意志坚定，感情真挚"
        timbre: "明亮柔韧的年轻女声"
        pace: "明快"
        pitch: "中高音"
    iron_king:
      display_name: "铁王"
      tts:
        delivery: "残酷专横，话语咄咄逼人"
        timbre: "冷硬洪亮的男声"
        pace: "沉稳而逼迫"
        pitch: "低音"
    grimace:
      display_name: "格里马斯"
      tts:
        delivery: "记仇狠毒，威胁时带着尖刻的得意"
        timbre: "干冷锐利的成熟女声"
        pace: "缓慢而刻意"
        pitch: "中低音"
  chapters:
    - id: ch01
      title: "一位没学会做国王的国王"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有位年轻的国王名叫苏西。他还在襁褓里，就交给了仙女吉鲁埃特抚养。吉鲁埃特心地不坏，可她的主意从来撑不过两分钟，跟她一起过日子实在叫人受不了。苏西长大以前，宫廷全归她管，朝中自然也被弄得颠三倒四。她先是照着古老的规矩，什么治国的责任都不让小国王知道。一天，她忽然又变了主意，把整个国家交给了他。这时再教苏西怎样做个称职的国王，已经太迟，可仙女根本没想到。她忙着组建御前会议，还让贤明的“正是”先生当首相，因为从来没人听他反驳过谁。"
        - id: ch01-b02
          speaker: narrator
          text: "苏西长得英俊，天性也不糊涂。只是从没人教他怎样待人处事，他既腼腆又笨拙，更不会自己动脑筋。御前会议办不了多少正事，国家很快乱成一团，百姓终于公开反抗。幸好苏西勇气过人。宫门外刀枪闪动时，他还若无其事地吹着长笛，一场内战这才没有真正打起来。"
        - id: ch01-b03
          speaker: narrator
          text: "叛乱刚平息，大臣们就操心起国王的婚事。他们举荐了好几位公主。吉鲁埃特想在永远离开宫廷以前办完这件事，认定迪亚法娜公主最适合做王后。一队使者奉命去看清公主的模样和举止，再回来禀报。他们说，公主身材高挑匀称，却轻得惊人。她每次散步，马官都要死死盯着，免得一阵风把她吹走。这样的事出过太多次，臣民生怕有一天永远失去她。有人想往她口袋里装重物，也有人想把重物绑在她脚踝上，可公主嫌难受，只好作罢。最后大家规定，只要起风，她就不许出门。为了保险，她腰间还要系几根绳子，每个马官牵住一头。"
        - id: ch01-b04
          speaker: narrator
          text: "御前会议谈了好几天，苏西终于决定亲自去看公主，只说自己是国王的使者。这个办法虽不新鲜，倒一向管用，他们也想不出更好的。出发的使团气派得举世无双。苏西把国家交给首相。不论别人说什么，这位先生都只答“正是”。这选择其实很明智。百姓都喜欢他，因为每个人说的话他都赞成，离开时便觉得自己和自己的智慧好极了。"
        - id: ch01-b05
          speaker: narrator
          text: "苏西来到迪亚法娜的宫廷，受到了盛大的欢迎。人人嘴上装作不知道他的身份，可这种秘密向来藏不住。苏西最烦冗长的礼节，就提议第二次在花园见面。公主起初不肯，后来见天色晴美，四周静得没有一丝风，才答应下来。谁知两人刚行完第一轮礼，一阵微风就吹了过来，公主跟着摇摇晃晃。马官们为了表示敬意，早已退得远远的。苏西赶上前想扶她，可他跑动带起的风，反而把她推得更远。"
        - id: ch01-b06
          speaker: sucy
          text: "公主！你真要这样逃开我吗？"
        - id: ch01-b07
          speaker: diaphana
          text: "天哪，我当然不想逃！你再快一点儿，就能把我拦住，我会永远感激你的。你瞧，在花园里谈话就是这种下场。还是四面关得严严实实的屋子好得多！"
          emotion: disgusted
        - id: ch01-b08
          speaker: narrator
          text: "苏西拼命追赶，可风比他更快。转眼间，迪亚法娜已经被卷到花园尽头。前面横着一道沟，她轻得像鸟，飘飘悠悠就过去了。苏西只能在沟边猛然停下，眼看她飞过原野，一会儿向右，一会儿向左，最后没了影子。"
        - id: ch01-b09
          speaker: narrator
          text: "宫里所有人都追进原野，有的跑着，有的骑马，都急着救公主。公主的处境十分危险，风越来越猛，眼看就要变成暴风。苏西站着看了一会儿，带随从回了宫。他一路都在想，这位准新娘实在轻得过分，娶一个比风筝还容易飞上天的妻子，未免太荒唐。最后他决定不等了，立刻离开。等侍从在一座草垛上找到浑身湿透的迪亚法娜时，苏西早已上路。载公主回宫的马车正好与他相遇。他停下祝贺她脱险，又劝她快换干衣服，随后继续赶路。"
        - id: ch01-b10
          speaker: narrator
          text: "苏西花了很久才回国。这番周折全都白费，他很恼火，宫里人偏还拿这次遭遇暗中取笑他。他们当然不敢当面笑，可苏西还是最受不了被人嘲笑。没过多久，他又出去远游。这次只带了一名马官，可刚走出国境，他就设法把这唯一的随从也弄丢了。"
    - id: ch02
      title: "老妇人的一捆柴"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "那时候，王子和公主都由仙女抚养。仙女疼他们就像疼亲生儿女，为了他们，给旁人添多少麻烦也不在乎，简直和真正的母亲一模一样。仙女阿夫琳住在苏西邻国，照料着美丽的米侬—米奈特公主。她一心想让公主嫁给苏西。这个年轻国王虽然举止笨拙，却还教得好。论起本性，他比公主可能遇见的大多数年轻人都可爱。"
        - id: ch02-b02
          speaker: narrator
          text: "阿夫琳早有安排。她先让马官在森林里迷路，又趁苏西在树下睡着，取走他的剑和马。她料定苏西突然变得孤身一人，身上什么也没有，一定不肯说出身份，只能像个普通人那样，凭自己的本事讨人喜欢。这对他很有好处。"
        - id: ch02-b03
          speaker: narrator
          text: "苏西醒来，只见拴马那棵树最低的枝桠断了，四周连个活物的影子都没有。他慌忙寻找丢失的东西，却怎么也找不到。过了一阵，他饿了，只好试着走出森林，看看能不能找些吃的。没走几步，他就遇见了阿夫琳。仙女变成一个老妇人，背着一大捆柴，在小路上摇摇晃晃，差点摔在他脚边。苏西怕她受伤，连忙扶她站稳，随后转身要走。可事情哪有这么容易结束。"
        - id: ch02-b04
          speaker: aveline
          text: "我的柴呢？你的礼貌到哪儿去了？瞧瞧你受的好教养！他们究竟教过你什么？"
        - id: ch02-b05
          speaker: sucy
          text: "教我吗？什么也没教过。"
        - id: ch02-b06
          speaker: aveline
          text: "这一点我完全相信！你连替人捡起一捆柴都不会。来，走近些。我可比你聪明得多，知道该怎么把柴捡起来。"
        - id: ch02-b07
          speaker: narrator
          text: "苏西脸红了。他觉得老妇人说得有理，便老老实实背起柴捆。第一次试验就成功，阿夫琳高兴极了。她一瘸一拐跟在后面，一路絮絮叨叨，真像个寻常老妇人。"
        - id: ch02-b08
          speaker: aveline
          text: "我真希望天下每个国王，一辈子都能有这么一回。这样他们才会明白，想弄到烧火的柴，得费多大的力气。"
        - id: ch02-b09
          speaker: narrator
          text: "苏西也觉得这话有理，心里开始同情她。"
        - id: ch02-b10
          speaker: sucy
          text: "我们要去哪儿？"
        - id: ch02-b11
          speaker: aveline
          text: "去白魔王的城堡。你要是想干活，我可以替你找点事做。"
        - id: ch02-b12
          speaker: sucy
          text: "可我什么也不会。除了背柴，我一件事都做不来，靠这个也挣不到多少钱。"
        - id: ch02-b13
          speaker: aveline
          text: "哦，你已经开始学了。第一堂课能学成这样，算不错啦。"
        - id: ch02-b14
          speaker: narrator
          text: "苏西几乎没听见她的话。他又累又恼，觉得再也背不动，正要放下柴捆，忽然有个年轻姑娘走来。她比白昼还美，浑身珠光宝气。姑娘跑到两人身边，朝老妇人叫起来。"
        - id: ch02-b15
          speaker: minon_minette
          text: "哎呀，你太辛苦了！我正要来找你，看看能不能帮上忙。"
        - id: ch02-b16
          speaker: aveline
          text: "这儿正好有位年轻人。他一定很愿意把柴交给你。你看，他背得可一点儿也不快活。"
        - id: ch02-b17
          speaker: minon_minette
          text: "先生，让我替你背，好吗？"
        - id: ch02-b18
          speaker: narrator
          text: "苏西想起自己刚才还打算放下柴，顿时觉得惭愧，反倒把柴捆抱得更紧。况且米侬—米奈特一出现，他的心情也好了许多。三个人走到一座极普通的房子前。阿夫琳说，这就是白魔王的城堡，又叫苏西把柴放在院子里。"
        - id: ch02-b19
          speaker: narrator
          text: "苏西很怕被人认出来，看见堂堂国王落到这般境地。他本想转身离开，要不是惦记米侬—米奈特，早就走了。可公主和老妇人进屋时，谁也没再看他一眼，他仍觉得窘迫又孤单。他在原地站了好一会儿，完全不知道下一步该做什么。终于有个仆人来把他领进华美的大厅。里面坐满了人，有的奏乐，有的谈笑。苏西惊讶地站着，默默听他们说话，却没有一个人理会他，这叫他很不高兴。"
        - id: ch02-b20
          speaker: narrator
          text: "这样的日子持续了一阵。苏西一天比一天爱米侬—米奈特，公主却一天比一天忙着跟别人来往，几乎顾不上他。最后，他实在绝望，便去找老妇人请教。就算听不到好主意，至少还能跟她谈谈公主，享受一会儿说起她的快乐。"
        - id: ch02-b21
          speaker: narrator
          text: "他在一间地下屋子里找到了阿夫琳。她正在纺线，很乐意把他想知道的都告诉他。苏西这才明白，光是生来做王子，还远远不够资格迎娶米侬—米奈特。她不会嫁给一个没有证明过忠诚的人。那个人还得有才华、有教养，因为有了这些本领，日子才能过得幸福。"
        - id: ch02-b22
          speaker: narrator
          text: "苏西起初十分沮丧，过了一会儿又振作起来。"
        - id: ch02-b23
          speaker: sucy
          text: "请告诉我，要赢得公主的心，我该做什么。无论多难，我都会做到。还有，我要怎样报答你的好意？只要我给得起，你想要什么都可以。要不要我每天替你把柴背回来？"
        - id: ch02-b24
          speaker: aveline
          text: "你愿意这么问，就已经够了。拿着这绞线吧。总有一天，你会庆幸收下了它。等它再也派不上用场，你的磨难也就结束了。"
        - id: ch02-b25
          speaker: sucy
          text: "这是我的生命之线吗？"
        - id: ch02-b26
          speaker: aveline
          text: "不，这是你爱情厄运的线。"
        - id: ch02-b27
          speaker: narrator
          text: "苏西接过线绞，转身离开。"
    - id: ch03
      title: "铁笼与一绞线"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "抚养苏西的吉鲁埃特有个老朋友，名叫格里马斯。她是弗吕埃王子的保护人，常跟吉鲁埃特商量这个年轻人的事。等她觉得弗吕埃已经长大，可以治理国家，就来打听谁最适合做他的妻子。吉鲁埃特不肯停下来想，也不肯查问，张口就把米侬—米奈特夸上了天。格里马斯听后，下定决心，无论如何也要促成这门婚事。"
        - id: ch03-b02
          speaker: narrator
          text: "弗吕埃王子就这样被引进宫来。他温和又英俊，可米侬—米奈特觉得他有些地方太女气，而且一点儿也不掩饰自己的看法。格里马斯因此恨上了公主，连阿夫琳也受了牵连。仙女当场宣布，米侬—米奈特若找不到一座没有拱的桥和一只没有羽毛的鸟，就永远别想得到幸福。说完，她也走了。"
        - id: ch03-b03
          speaker: narrator
          text: "苏西再次远游以前，阿夫琳把马和剑还给了他。公主不在身边，这两样东西也算不上多大安慰，不过有总比没有好。他隐约觉得，也许正是它们能带自己回到公主身旁。"
        - id: ch03-b04
          speaker: narrator
          text: "苏西穿过好几片荒漠，终于来到一处像是有人居住的国家。谁知才过边境，他就被人抓住，锁上铁链，径直拖进都城。他问守卫为什么这样对他，对方只说这里是铁王的领土。那时候，各国没有自己的名字，只按照统治它们的君王来称呼。"
        - id: ch03-b05
          speaker: narrator
          text: "苏西被带到铁王面前。铁王坐在黑色王座上，大厅四壁也挂着黑幔，用来悼念所有被他亲手处死的亲族。"
        - id: ch03-b06
          speaker: iron_king
          text: "你闯进我的国家，到底想干什么？"
          emotion: angry
        - id: ch03-b07
          speaker: sucy
          text: "我只是误闯进来。要是我能从你手里活着出去，我一定会记住这个教训，绝不会这样对待自己的臣民。"
        - id: ch03-b08
          speaker: iron_king
          text: "你竟敢在我的宫廷里羞辱我？把他拖进“小安逸”！"
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: "所谓“小安逸”，其实是一只铁笼。四条粗链把它悬在巨大穹顶厅堂的正中央。关进去的人坐不得，站不得，也躺不得，还要轮流熬过难忍的酷热和严寒。笼门上足足拴着一百道沉重的门闩。照看苏西原本是吉鲁埃特的责任，可她又迷上了一个新主意，早把他的存在忘得干干净净。要不是阿夫琳赶来，他很快就会死去，再也不能给任何人添麻烦。仙女在他耳边轻轻提醒。"
        - id: ch03-b10
          speaker: aveline
          text: "那绞线呢？"
        - id: ch03-b11
          speaker: narrator
          text: "苏西想不出线能有什么用，还是把它拿出来，绑在一根铁栏上，因为他能做的也只有这些。接着，他用力一拉。栏杆竟立刻松脱，在他手里碎成千百片。逃出铁笼一下变得容易了。厅堂的窗户全装着密密的铁条，他也用同样的办法拆开。"
        - id: ch03-b12
          speaker: narrator
          text: "可自由仍旧远在天边。厅堂和旷野之间隔着一堵高墙，墙面光滑得连猴子也爬不上去。苏西一下泄了气。他看不出别的路，仿佛只能等着某种可怕的死法。不过，他无论如何也不想让铁王再得好处，便把珍贵的线绞抛向空中。"
        - id: ch03-b13
          speaker: sucy
          text: "仙女啊，我的灾难已经大过你的法力了。我不会忘记你的好意，可还是请你把礼物收回去吧！"
          emotion: sad
        - id: ch03-b14
          speaker: narrator
          text: "阿夫琳怜惜他年轻，又原谅他失去了信心，特意让线的一端留在他手里。苏西忽然感觉线猛地一扯，知道另一头一定勾住了东西。绝境里，他又有了勇气。"
        - id: ch03-b15
          speaker: sucy
          text: "相信一根线，总比相信一个国王会发慈悲强。"
        - id: ch03-b16
          speaker: narrator
          text: "他顺着线滑下去，平安落到高墙外。随后，他把线卷好，小心放进口袋，又在心里向仙女道谢。"
    - id: ch04
      title: "枯叶屋的陷阱"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "阿夫琳一直把苏西的遭遇告诉米侬—米奈特。公主听说铁王这样折磨他，气得不得了，立刻着手备战。她尽力暗中筹划，可大军一集结，人们总能猜出一场风暴正在酝酿，更别说要瞒过仙女教母。格里马斯很快便听到了消息。她始终没有原谅公主拒绝弗吕埃，如今只觉得报仇的机会来了。"
        - id: ch04-b02
          speaker: narrator
          text: "从前，阿夫琳总能挡住格里马斯的恶毒把戏，保护米侬—米奈特，可她的法力管不到远方。公主宣布要亲自领兵，又天天打猎，好让自己习惯劳顿。阿夫琳一再恳求她小心。只要不在仙女身边，就千万不能跨出国境。公主立刻答应，接连几天也平安无事。"
        - id: ch04-b03
          speaker: narrator
          text: "不幸的是，一天早晨，米侬—米奈特骑着漂亮的白马缓缓小跑，满脑子都想着苏西，根本没有留意边界。其实，她本来也不太清楚边界在哪儿。忽然，一座完全由枯叶搭成的屋子出现在眼前。不知为什么，它让公主想起了种种不祥的事。她记起阿夫琳的警告，想掉转马头，可白马一动不动，仿佛变成大理石。"
        - id: ch04-b04
          speaker: narrator
          text: "接着，米侬—米奈特觉得自己正慢慢离开马背，有股力量硬把她拖向地面。她尖叫着，死死抓住马鞍，还是没有用。她多想逃走，可身体外面有某种更强的东西，逼她走上通往枯叶屋的小路。她的双脚刚碰到门槛，格里马斯便出现了。"
        - id: ch04-b05
          speaker: grimace
          text: "米侬—米奈特，你总算来了！我等了你好久，这个陷阱从一开始就是给你备下的。过来吧，我的宝贝！你竟敢向我的朋友开战，我一定好好教训你。事情不会照你的心意发展。现在，你得跪在铁王面前求他宽恕。等他答应休战，你还得求他开恩，娶你做妻子。在那以前，你就乖乖做我的女仆！"
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: "从那天起，可怜的公主被迫去干最苦、最脏的活。每天早晨，都有比前一天更讨厌的差事等着她。她只能吃一点黑面包，夜里睡在一小堆稻草上。格里马斯只为折磨她，偏让她在一天最热的时候出去放鹅。要不是碰巧在田里捡到一把大扇子，用来遮住脸，她多半早就中了暑。"
        - id: ch04-b07
          speaker: narrator
          text: "一个牧鹅姑娘拿着扇子，实在有些古怪，公主却没想到这一点。她打开扇子当阳伞，一封情人的信从里面掉出来，她立刻忘了所有苦难。她知道阿夫琳没有忘记自己，便重新鼓起了勇气。"
        - id: ch04-b08
          speaker: narrator
          text: "格里马斯发现米侬—米奈特仍旧白得像雪，一点儿没有晒成浆果般的褐色，心里十分纳闷，便开始紧紧盯着她。第二天，太阳升到最高、晒得最烈时，她看见公主从裙褶里拿出扇子，举到眼前遮阳。格里马斯怒气冲冲地伸手去抢，公主却拼死不放。"
        - id: ch04-b09
          speaker: grimace
          text: "马上把扇子交给我！"
          emotion: angry
        - id: ch04-b10
          speaker: minon_minette
          text: "只要我还有一口气，就绝不会给你！"
        - id: ch04-b11
          speaker: narrator
          text: "米侬—米奈特不知道把扇子藏在哪里才安全，索性一脚踩在上面。转眼之间，她发现自己升离地面，而扇子始终托着双脚。格里马斯气得什么也看不见，根本没察觉变化。等她回过神，公主已经飞出了她能够着的地方。"
    - id: ch05
      title: "空中的桥与鸟"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "在这些日子里，苏西一直漂泊在世界各地。他把珍贵的线仔细缠在身上，找遍所有可能藏着公主的地方，就连那些根本不可能的地方也没放过。有时，他能找到她留下的痕迹，甚至能看见她刻在岩石或树皮上的留言，可米侬—米奈特本人始终无处可寻。"
        - id: ch05-b02
          speaker: sucy
          text: "她要是不在地上，也许就藏在空中。我要到天上去找她。"
        - id: ch05-b03
          speaker: narrator
          text: "于是，苏西借着那绞线，试着向空中攀升。起初，他每次只能升起一点点，随后便跌回地面，摔得浑身疼痛。可他没有放弃。试了许多天，也摔了许多次，他惊喜地发现，自己比最初升得更高，也能在空中多停留一会儿。渐渐地，他终于可以一直生活在天上了。"
        - id: ch05-b04
          speaker: narrator
          text: "然而，空中的世界似乎和地上的世界一样，也没有公主的踪影。苏西越来越绝望，心想下一步恐怕只能去海里的世界寻找。他正忧伤地飘荡，根本没留意自己会飘到哪里，忽然看见远处有个美丽明亮的东西，像一只鸟似的向他飞来。不知为什么，他的心怦怦直跳。等两人越靠越近，他听见了公主的声音。"
        - id: ch05-b05
          speaker: minon_minette
          text: "瞧呀！一只没有羽毛的鸟，还有一座没有拱的桥！"
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: "他们就这样在空中重逢了。相见的地方虽奇怪，两个人的欢乐却丝毫不少。扇子变得足够宽大，不但载得下苏西，也载得下匆匆赶来指点他们的阿夫琳。仙女驾着扇子，带他们飞到两军对垒、眼看就要开战的地方。"
        - id: ch05-b07
          speaker: narrator
          text: "战斗打了很久，十分血腥。铁王最终只得退让，向米侬—米奈特投降。公主罚他去替苏西放羊，不过在此以前，铁王必须庄严起誓，好好对待那些羊。"
        - id: ch05-b08
          speaker: narrator
          text: "随后，苏西和米侬—米奈特举行了婚礼。吉鲁埃特也来参加，大家费了九牛二虎之力才找到她。她发现自己离开的这段日子里，竟然办成了这么多事情，惊讶得不得了。"
