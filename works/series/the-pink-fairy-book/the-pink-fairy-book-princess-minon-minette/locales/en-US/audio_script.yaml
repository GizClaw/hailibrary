    souci:
      display_name: King Souci
      tts:
        delivery: earnest, awkward, and increasingly resolute
        timbre: clear and youthful
        pace: steady
        pitch: medium
    diaphana:
      display_name: Princess Diaphana
      tts:
        delivery: refined, anxious, and easily exasperated
        timbre: light and delicate
        pace: quick
        pitch: high
    aveline:
      display_name: Fairy Aveline
      tts:
        delivery: kindly, shrewd, and quietly playful
        timbre: warm and weathered
        pace: unhurried
        pitch: medium-low
    minon_minette:
      display_name: Princess Minon-Minette
      tts:
        delivery: gracious, brave, and strong-willed
