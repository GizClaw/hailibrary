  chapters:
    - id: ch01
      title: A King Without a Lesson
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a young king named Souci. The fairy Inconstancy had raised him from the time he was a baby. She had a kind heart, but living with her was never easy. She could not keep the same opinion for two minutes. Because she alone ruled the court until Souci grew up, every part of court life was always in confusion.
        - id: ch01-b02
          speaker: narrator
          text: First, she followed the old custom of keeping the young king ignorant of every duty he would one day have to perform. Then, with no warning at all, she handed the reins of government over to him. By then it was too late to train him properly for the task, but the fairy never thought of that. Swept up in her newest idea, she quickly formed a council and chose the excellent Ditto as prime minister. He had earned that name because no one had ever heard him contradict anybody.
        - id: ch01-b03
          speaker: narrator
          text: Young Souci had a handsome face, and beneath it all he had a good deal of common sense. But no one had taught him good manners. He was shy and awkward, and although he had a mind of his own, he had never learned how to use it.
        - id: ch01-b04
          speaker: narrator
          text: Under those circumstances, it was hardly surprising that the council accomplished very little. The country's affairs fell into such disorder that the people finally rose in open rebellion. Only the king's courage prevented anyone from declaring a civil war. While swords and spears flashed outside the palace gate, he calmly went on playing his flute.
        - id: ch01-b05
          speaker: narrator
          text: No sooner was the revolt over than the council began discussing the king's marriage. Several princesses were put forward. The fairy wanted the whole affair settled before she left the court forever, and in her opinion Princess Diaphana would make the best wife. Messengers were sent to bring back an exact account of Diaphana's appearance and her ways.
        - id: ch01-b06
          speaker: narrator
          text: Their report was unusual. Diaphana was tall and well formed, but so light that her attendants had to watch her whenever she walked outside, in case she suddenly blew away. It had happened so often that her people lived in fear of losing her altogether. They tried everything they could imagine to keep her on the ground. They suggested weights in her pockets and even weights tied around her ankles, but she found them too uncomfortable. At last they decided she must never go out when it was windy. To make doubly sure, attendants walked with her while each held one end of a string fastened around her waist.
        - id: ch01-b07
          speaker: narrator
          text: The council discussed the messengers' report for several days. Then Souci decided to judge the princess for himself while pretending to be his own ambassador. It was not a new trick, but it had succeeded many times before, and the council could think of no better plan.
        - id: ch01-b08
          speaker: narrator
          text: No country had ever seen such a splendid embassy. Souci left his kingdom to Prime Minister Ditto, who answered "Ditto" to everyone. That choice worked better than anyone expected. The people loved a man who agreed with everything they said, and they went away delighted with their own wisdom.
        - id: ch01-b09
          speaker: narrator
          text: Diaphana's court gave Souci a magnificent welcome. Everyone pretended not to know who he was, though a secret like that never stays hidden. Souci disliked long ceremonies, so he asked to meet the princess a second time in the garden. She hesitated, but the day was lovely and still, and at last she agreed.
        - id: ch01-b10
          speaker: narrator
          text: They had barely finished their first bows and curtsies when a small breeze sprang up and began to sway Diaphana. Her attendants had stepped away out of respect, so no one held her strings. Souci moved forward to steady her, but the air he stirred only pushed her farther from him. He rushed after her and called out.
        - id: ch01-b11
          speaker: souci
          text: Princess, are you truly running away from me?
          emotion: surprised
        - id: ch01-b12
          speaker: diaphana
          text: Goodness, no! Run faster and stop me, and I'll be grateful forever. This is what happens when people insist on talking in gardens. A tightly closed room is much better.
          emotion: disgusted
        - id: ch01-b13
          speaker: narrator
          text: Souci ran as hard as he could, but the wind was faster. It swept Diaphana to the ditch at the end of the garden. She sailed across it like a bird. Souci had to stop at the edge and watch as she flew over the plain, first one way, then another, until she disappeared.
        - id: ch01-b14
          speaker: narrator
          text: By then, the whole court was racing over the plain, some on foot and some on horseback. Everyone hurried to save the princess, who was in real danger now that the wind had grown into a gale. Souci watched for a while, then returned to the palace with his attendants. All the way back, he thought about the astonishing lightness of his intended bride and the absurdity of marrying a woman who rose into the air better than any kite.
        - id: ch01-b15
          speaker: narrator
          text: On the whole, he thought it wiser not to wait any longer. He left on horseback just as Diaphana's followers found her soaked through and blown against a haystack. When he met the carriage bringing her home, he stopped to congratulate her on escaping and advised her to change into dry clothes. Then he continued his journey.
        - id: ch01-b16
          speaker: narrator
          text: The journey home took a long time, and Souci was cross that so much trouble had come to nothing. To make matters worse, his courtiers made fun of the adventure. They did not dare laugh in front of him, but Souci knew about it and hated being mocked. Before long, he set out again with only one attendant. The moment they passed beyond his own kingdom, Souci managed to lose him too.
    - id: ch02
      title: The Castle of the White Demon
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: In those days, princes and princesses were commonly raised by fairies. The fairies loved them like their own children and never minded how much inconvenience they caused everyone else for their sake. In that way, they were just like real mothers. The fairy Aveline lived in a country that touched Souci's kingdom at one point, and her charge was the lovely Princess Minon-Minette.
        - id: ch02-b02
          speaker: narrator
          text: Aveline had made up her mind that Minon-Minette should marry Souci. His awkward manners could be improved, and in truth he was much nicer than most young men the princess was likely to meet. She began her preparations by arranging for his attendant to lose his way in the forest. Then, while Souci slept beneath a tree, she took his horse and sword. Aveline was sure that, once he woke alone and robbed of everything, he would hide his royal birth. Without rank or riches to help him, he would have to rely on his own power to please, just like any other man. That would be much better for him.
        - id: ch02-b03
          speaker: narrator
          text: When Souci awoke, he saw that the lowest branch of the tree where he had tied his horse was broken. Not another living creature was in sight. He searched high and low for his lost treasures, but found nothing. After a while, hunger began to trouble him. He decided to search for a way out of the forest, hoping he might also find something to eat.
        - id: ch02-b04
          speaker: narrator
          text: He had gone only a few steps when he met Aveline disguised as an old woman. A heavy bundle of firewood bent her back. She staggered along the path and almost fell at his feet. Souci was afraid she had hurt herself, so he picked her up, set her firmly on her feet, and started on his way. But the old woman had no intention of letting him escape so easily.
        - id: ch02-b05
          speaker: aveline
          text: And what about my bundle? Have you no manners? You must have had a fine upbringing. Did anyone teach you anything at all?
        - id: ch02-b06
          speaker: souci
          text: Teach me? No one taught me anything.
        - id: ch02-b07
          speaker: aveline
          text: That I can believe! You don't even know enough to pick up a bundle. Come closer. I know how it should be done, even if you don't.
        - id: ch02-b08
          speaker: narrator
          text: Souci blushed because her words were true. He meekly lifted the bundle. Pleased that her first test had worked, Aveline hobbled after him and talked without stopping.
        - id: ch02-b09
          speaker: aveline
          text: I wish every king would carry firewood once in his life. Then he'd understand how much work it takes to keep his fires burning.
        - id: ch02-b10
          speaker: narrator
          text: Souci knew she was right, and he felt sorry for her.
        - id: ch02-b11
          speaker: souci
          text: Where are we going?
        - id: ch02-b12
          speaker: aveline
          text: To the White Demon's castle. If you need work, I'll find something for you there.
        - id: ch02-b13
          speaker: souci
          text: But I can't do anything except carry a bundle. That won't earn me much.
        - id: ch02-b14
          speaker: aveline
          text: You're learning already. For a first lesson, this isn't bad.
        - id: ch02-b15
          speaker: narrator
          text: Souci hardly listened to her lesson. He was tired and rather cross, and the heavy bundle had become too much for him. He was just about to set it down when a young woman came toward them. She was more beautiful than the day, and precious stones glittered all over her. She ran straight to the old woman.
        - id: ch02-b16
          speaker: minon_minette
          text: Oh, you poor dear! I was coming to see if you needed my help.
        - id: ch02-b17
          speaker: aveline
          text: This young man will gladly hand you the bundle. You can see how little he enjoys carrying it.
        - id: ch02-b18
          speaker: minon_minette
          text: May I take it from you, sir?
        - id: ch02-b19
          speaker: narrator
          text: Ashamed of himself, Souci gripped the bundle tightly. The princess's presence improved his temper at once.
        - id: ch02-b20
          speaker: narrator
          text: The three traveled on together until they reached a very ordinary-looking house. Aveline pointed it out as the White Demon's castle and told Souci he could put down the bundle in its courtyard. He was terribly afraid that someone might recognize him in such a strange position. He would have turned on his heel and left if the thought of Minon-Minette had not kept him there.
        - id: ch02-b21
          speaker: narrator
          text: The princess and the old woman went inside without paying the slightest attention to him. Souci remained alone in the courtyard for some time, feeling awkward and lonely and unable to decide what to do. At last a servant arrived and led him upstairs to a beautiful room. It was full of people playing musical instruments and talking merrily. Their lively ways astonished him. He stood listening in silence, not at all pleased that no one paid him any attention.
        - id: ch02-b22
          speaker: narrator
          text: This continued for some time. Each day, Souci fell more deeply in love with Minon-Minette. Each day, the princess seemed more occupied with other people. At last he grew desperate and went looking for the old woman. He hoped she could advise him about how to behave, or at least give him the pleasure of talking about Minon-Minette.
        - id: ch02-b23
          speaker: narrator
          text: He found Aveline spinning in an underground room, quite ready to tell him everything he wanted to know. In answer to his questions, she explained that being born a prince was not enough to win Minon-Minette's hand. The princess would marry no one who had not proved himself faithful. He must also possess all the talents and accomplishments that help to make other people happy.
        - id: ch02-b24
          speaker: narrator
          text: Souci was crushed for a moment, but then his courage returned.
        - id: ch02-b25
          speaker: souci
          text: Tell me how to win her heart, and I'll do it, however hard it may be. Tell me how to repay your kindness too. You may have anything I can give. Shall I bring in your firewood every day?
        - id: ch02-b26
          speaker: aveline
          text: Your offer is enough. Take this skein of thread. One day you'll be grateful for it, and when it is no longer useful, your troubles will be over.
        - id: ch02-b27
          speaker: souci
          text: Is this the thread of my life?
        - id: ch02-b28
          speaker: aveline
          text: It is the thread of your love's bad fortune.
        - id: ch02-b29
          speaker: narrator
          text: Souci took the skein and went away.
    - id: ch03
      title: The Iron King's Prison
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Girouette, the fairy who had raised Souci, had an old friend named Grimace. Grimace watched over Prince Fluet. When she decided Fluet was old enough to rule his kingdom, she asked Girouette to suggest a wife for him.
        - id: ch03-b02
          speaker: narrator
          text: Girouette never paused to think or ask questions. She gave such a delightful account of Minon-Minette that Grimace resolved to spare no effort in arranging the marriage. Prince Fluet was presented at court. He was handsome and pleasant, but Minon-Minette thought some of his ways rather womanish. She showed her opinion so openly that both she and Aveline drew the fairy's anger.
        - id: ch03-b03
          speaker: narrator
          text: Grimace was furious with both Minon-Minette and Aveline.
        - id: ch03-b04
          speaker: grimace
          text: Minon-Minette will never be happy until she finds a bridge without an arch and a bird without feathers!
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: With that, Grimace departed.
        - id: ch03-b06
          speaker: narrator
          text: Before Souci resumed his travels, Aveline returned his horse and sword. They were only a small comfort while the princess was absent, but they were better than nothing. Souci felt that somehow, in some way he could not yet see, they might become the means of leading him back to her.
        - id: ch03-b07
          speaker: narrator
          text: Souci crossed several deserts before he finally reached a country that seemed inhabited. The instant he stepped across its border, men seized him, threw him into chains, and dragged him straight to the capital. He asked his guards why they treated him this way. Their only answer was that he stood in the Iron King's territory. In those days, countries had no names of their own. Each was simply called after its ruler.
        - id: ch03-b08
          speaker: narrator
          text: The guards led Souci into the Iron King's presence. The king sat on a black throne in a hall also draped in black. All that black was a sign of mourning for the many relatives he himself had put to death.
        - id: ch03-b09
          speaker: iron_king
          text: What business have you in my country?
          emotion: angry
        - id: ch03-b10
          speaker: souci
          text: I crossed the border by accident. If I escape your hands, I'll remember your example and treat my own people very differently.
        - id: ch03-b11
          speaker: iron_king
          text: You dare insult me here in my own court? Take him to Little Ease!
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: Little Ease was an iron cage suspended by four thick chains in the center of a vast, vaulted hall. It gave a prisoner no room to sit, stand, or lie down. One moment brought unbearable heat and the next unbearable cold, while a hundred heavy bolts made escape seem impossible.
        - id: ch03-b13
          speaker: narrator
          text: Girouette was supposed to watch over Souci, but the excitement of some new idea had made her forget he existed. He would not have remained alive much longer to trouble anybody if Aveline had not come to his rescue. Her voice whispered in his ear.
        - id: ch03-b14
          speaker: aveline
          text: What about the skein of thread?
        - id: ch03-b15
          speaker: narrator
          text: Souci obeyed, though he could not imagine how a skein of thread might save him. He picked it up and tied it around one of the iron bars because that was the only thing he could think to do. Then he pulled. To his amazement, the bar gave way at once, and he found he could break it into a thousand pieces. It did not take him long to escape the cage or to shatter the closely set bars across the hall's windows.
        - id: ch03-b16
          speaker: narrator
          text: Yet even after all that, freedom seemed as far away as ever. A high wall stood between Souci and the open country, and its face was so smooth that even a monkey could not climb it. His heart sank. He saw no escape from a horrible death. But he was determined that the Iron King should profit no more than he could help, so he hurled the precious thread into the air and spoke.
        - id: ch03-b17
          speaker: souci
          text: Fairy, my troubles are greater than your power. I thank you for trying to help me, but take back your gift!
          emotion: sad
        - id: ch03-b18
          speaker: narrator
          text: Aveline pitied both his youth and his lack of faith. She made sure one end of the thread remained in his hand. Suddenly he felt a jerk and understood that the other end must have caught on something. The thought filled him with the kind of daring that comes from despair.
        - id: ch03-b19
          speaker: souci
          text: Better to trust a thread than trust a king's mercy.
        - id: ch03-b20
          speaker: narrator
          text: He slid down the thread and landed safely beyond the wall. Then he wound it up, tucked it carefully into his pocket, and silently thanked the fairy.
    - id: ch04
      title: The House of Dead Leaves
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Aveline kept Minon-Minette informed of all Souci's adventures. When the princess heard how the Iron King had treated him, she flew into a fury and began preparing for war. She made her plans with all the secrecy she could. But when great armies gather, people soon suspect that a storm is coming, and hiding anything from fairy godmothers is especially difficult.
        - id: ch04-b02
          speaker: narrator
          text: Grimace soon discovered the plan. She had never forgiven Minon-Minette for rejecting Prince Fluet, and now she saw her chance for revenge. Until then, Aveline had stopped many of Grimace's spiteful tricks and kept guard over the princess. But her power could not reach anything that happened far away.
        - id: ch04-b03
          speaker: narrator
          text: Minon-Minette declared that she would lead her army herself. To train her body to bear the strain, she began hunting each day. Aveline begged her to be careful and never cross the borders of her own country without the fairy there to protect her. Minon-Minette gave her promise at once.
        - id: ch04-b04
          speaker: narrator
          text: For several days, all went well. Then one morning Minon-Minette rode slowly on her beautiful white horse. Her thoughts were fixed on Souci, not on the borders of her kingdom, which she hardly knew. Suddenly she faced a house built entirely from dead leaves. The sight filled her mind with unpleasant thoughts.
        - id: ch04-b05
          speaker: narrator
          text: She remembered Aveline's warning and tried to turn her horse, but it stood as still as if it had been made of marble. Then Minon-Minette felt herself being pulled slowly and unwillingly from the saddle. She screamed and clung to it with all her strength, but nothing helped. She longed to fly away. Instead, a power outside herself proved stronger and forced her down the path to the House of Dead Leaves.
        - id: ch04-b06
          speaker: narrator
          text: The instant Minon-Minette crossed the threshold, Grimace appeared.
        - id: ch04-b07
          speaker: grimace
          text: So I've caught you at last, Minon-Minette! I've watched for you a long time, and this trap was ready from the start. Come here, my darling. I'll teach you what happens when you make war on my friends. Your plans will not end as you imagined. You must kneel to the king and beg forgiveness. Before he agrees to peace, you will have to plead with him to let you become his wife. Until then, you will serve me.
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: From that day on, poor Minon-Minette received the hardest and dirtiest tasks. Each morning seemed to bring work more unpleasant than the day before. She was given nothing to eat but a little black bread and no bed except a little straw. Out of pure spite, Grimace sent her to guard the geese beneath the hottest midday sun.
        - id: ch04-b09
          speaker: narrator
          text: The heat would probably have struck her down, but she happened to find a large fan in the field and used it to shade her face. A fan was a strange possession for a goose girl, though Minon-Minette never stopped to wonder about it. When she opened it like a parasol, a letter from Souci tumbled out. At once, she forgot all her troubles. She knew Aveline had not abandoned her, and the princess took heart.
        - id: ch04-b10
          speaker: narrator
          text: Grimace noticed that Minon-Minette still looked as white as snow instead of turning as brown as a berry. She wondered what had happened and began watching closely. The next day, when the sun stood at its highest and hottest, she saw the princess pull the fan from the folds of her dress and hold it before her eyes. In a rage, Grimace tried to snatch it away, but Minon-Minette refused to let go.
        - id: ch04-b11
          speaker: grimace
          text: Give me that fan this instant!
          emotion: angry
        - id: ch04-b12
          speaker: minon_minette
          text: Never, as long as I live!
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: Not knowing any safer place, Minon-Minette put the fan beneath her feet. At once, she began to rise with the fan supporting her. Grimace was so blinded by fury that she failed to see what was happening until the princess had soared beyond her reach.
    - id: ch05
      title: The Bird and the Bridge
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: All this while, Souci wandered through the world with the precious thread fastened securely around him. He searched every possible and impossible place where Minon-Minette might happen to be. Sometimes he found traces of her. He even discovered messages scratched into rock or cut into the bark of a tree. But the princess herself was nowhere to be found.
        - id: ch05-b02
          speaker: souci
          text: If she isn't anywhere on the earth, perhaps she is hidden in the air. That is where I must look for her.
        - id: ch05-b03
          speaker: narrator
          text: With the thread's help, he tried to climb into the sky. At first he could rise only a very short distance, and every tumble back to earth hurt him terribly. Still, he refused to give up. After many days of effort and many falls, he discovered to his great joy that he could rise a little higher and remain there a little longer than before. In time, he learned to live in the air altogether.
        - id: ch05-b04
          speaker: narrator
          text: But alas, the world of the air seemed as empty of Minon-Minette as the world below. Souci began to lose hope and wondered if he would have to search the world beneath the sea next. He floated sadly onward without paying any attention to where he was going.
        - id: ch05-b05
          speaker: narrator
          text: Then, far away, he saw a beautiful, shining kind of bird flying toward him. His heart beat faster, though he did not know why. As the two drew close, he heard the princess's voice.
        - id: ch05-b06
          speaker: minon_minette
          text: Here are the bird without feathers and the bridge without an arch!
          emotion: happy
        - id: ch05-b07
          speaker: narrator
          text: Their first meeting took place in the air, but that made it no less joyful. The fan grew large enough to carry Souci as well as Minon-Minette. Aveline hurried to join them, for she had some good advice to give.
    - id: ch06
      title: The Wedding of Minon-Minette
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Aveline guided the fan above the place where two armies lay camped opposite each other, ready to begin the battle. The fighting was long and bloody. In the end, the Iron King was forced to give way and surrender to Minon-Minette.
        - id: ch06-b02
          speaker: narrator
          text: The princess set him to guarding King Souci's sheep, but first she made him swear a solemn oath that he would treat them kindly.
        - id: ch06-b03
          speaker: narrator
          text: Then Souci and Minon-Minette were married. Girouette was present, though they had the greatest trouble finding her. She was very astonished to discover how much business everyone had managed to finish while she was away.
