audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    esben:
      display_name: "埃斯本"
      tts:
        delivery: "个头虽小却执着机敏，答话爽快"
        timbre: "轻快清亮的少年男声"
        pace: "明快"
        pitch: "中高音"
    father:
      display_name: "父亲"
      tts:
        delivery: "疲惫直率，话语朴实"
        timbre: "低沉沧桑的男声"
        pace: "舒缓"
        pitch: "低音"
    brother_1:
      display_name: "大哥"
      tts:
        delivery: "傲慢急躁，说话强硬"
        timbre: "结实清楚的男声"
        pace: "适中"
        pitch: "中低音"
    brother_2:
      display_name: "二哥"
      tts:
        delivery: "多疑紧张，言语直接"
        timbre: "坚定的年轻男声"
        pace: "适中"
        pitch: "中音"
    brother_3:
      display_name: "最小的哥哥"
      tts:
        delivery: "谨慎忧虑，对弟弟稍多一分在意"
        timbre: "清楚温和的年轻男声"
        pace: "平稳"
        pitch: "中音"
    witch:
      display_name: "女巫"
      tts:
        delivery: "阴险粗暴，带着逼人的威吓"
        timbre: "苍老沙哑的女声"
        pace: "缓慢而刻意"
        pitch: "低音"
    king:
      display_name: "国王"
      tts:
        delivery: "专横贪求，不容辩驳"
        timbre: "洪亮端正的男声"
        pace: "沉稳"
        pitch: "中低音"
    sir_red:
      display_name: "红骑士"
      tts:
        delivery: "表面圆滑，内里刻薄算计"
        timbre: "尖利干涩的男声"
        pace: "克制"
        pitch: "中低音"
    witch_daughter:
      display_name: "女巫的女儿"
      tts:
        delivery: "顺从迟疑，后来流露同情"
        timbre: "单薄清楚的年轻女声"
        pace: "适中"
        pitch: "中高音"
  chapters:
    - id: ch01
      title: "白树枝"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有个男人养着十二个儿子。前十一个全都高大强壮，老十二埃斯本却是个小不点儿。哥哥们跟父亲到田里和林中干活，埃斯本更愿意在家陪母亲。久而久之，谁都不把他当回事，他在兄弟中间倒像个外人。"
        - id: ch01-b02
          speaker: narrator
          text: "十一个哥哥长大成人后，决定到外面的世界闯荡，碰碰运气。他们天天缠着父亲，要齐上路用的一切。父亲已经年老体弱，实在舍不得这些帮手，可到头来还是拗不过他们。他给每个儿子一匹漂亮的白马，又备好盘缠。十一个人辞别父亲和家园，骑马远去，却没人想起埃斯本，甚至没跟他说一声再见。"
        - id: ch01-b03
          speaker: esben
          text: "父亲，也给我一匹马和一些盘缠吧。我也想出去看看世界。"
        - id: ch01-b04
          speaker: father
          text: "你这个小傻瓜。要是能把十一个哥哥留在家里，只放你出去，我这把年纪倒轻松多了。"
        - id: ch01-b05
          speaker: esben
          text: "好吧，反正你很快就不用再见到我了。"
        - id: ch01-b06
          speaker: narrator
          text: "父亲不肯给他马。埃斯本便走进森林，折下一根树枝，把树皮剥得干干净净。这样一来，他的树枝比哥哥们的白马还白。埃斯本把它当马骑，跨上去追赶十一个哥哥。"
        - id: ch01-b07
          speaker: narrator
          text: "哥哥们骑了整整一天。傍晚时分，他们走进一片大森林，在林子深处找到一座小屋。兄弟们敲响房门。出来开门的是个又老又丑、脸上还长着胡子的老太婆。他们问她，十一个人能不能全都借宿一夜。"
        - id: ch01-b08
          speaker: witch
          text: "当然能。你们不但可以过夜，我还要把一个女儿许给你们每个人。"
        - id: ch01-b09
          speaker: narrator
          text: "兄弟们只当碰上了极其好客的人家。他们受到周到招待，临睡时，每个人身边果真躺着老太婆的一个女儿。埃斯本一路跟在后面，也找到了这座小屋。他没惊动女巫和她的女儿，偷偷溜进去，藏在一张床底。午夜前不久，他轻手轻脚爬出来，逐个叫醒哥哥，要他们跟身边的姑娘交换睡帽。哥哥们看不出这样做有什么道理，只是受不了他反复纠缠，才勉强照办，随后又沉沉睡去。"
        - id: ch01-b10
          speaker: narrator
          text: "午夜一到，老女巫提着宽刃斧，蹑手蹑脚地走过十一张床。屋里黑得伸手不见五指，她只能摸着睡帽辨人。凡是戴着男人睡帽的，她全都一斧砍掉脑袋。她哪里知道，死去的正是自己的十一个女儿。女巫离开后，埃斯本立刻叫醒哥哥们。他们匆匆牵出白马，逃离那座屋子。大家都在庆幸自己安然脱险，却彻底忘了是谁救了他们，更没人向埃斯本道谢。"
        - id: ch01-b11
          speaker: narrator
          text: "他们又骑了一阵，来到一座王宫，询问能不能留下当差。宫里的人说，只有马夫的差事，要做就做。十一个哥哥马上答应，从此照料国王所有的马。埃斯本很久以后才骑着白树枝赶到。他也想谋个差事，却没有人肯用他，大家还叫他从哪儿来就回哪儿去。埃斯本偏偏留了下来，白天能找什么活就做什么。他只能领到饭食，没有工钱，夜里碰到哪里能躺，就睡在哪里。"
        - id: ch01-b12
          speaker: narrator
          text: "当时，宫里还有个红骑士。国王十分喜欢他，其他人却个个厌恶他，因为这个人不但心肠歹毒，做起事来也同样卑劣。十一个兄弟不肯每次见到他都站得笔直、恭敬听命。红骑士为此恼恨他们，决心找机会报复。他跑去对国王说，这些马夫把真正的本领藏了起来，除非拿死亡威胁他们，否则绝不会肯为陛下效力。"
    - id: ch02
      title: "金银羽毛与金银猪鬃"
      blocks:
        - id: ch02-b01
          speaker: sir_red
          text: "陛下，那十一个新来的马夫藏着大本领。我亲耳听他们说，自己能弄来一只鸽子，羽毛一根金、一根银。可您若不用死来逼他们，他们绝不会动手。"
        - id: ch02-b02
          speaker: king
          text: "你们不是说，能给我弄来一只羽毛金银相间的鸽子吗？三天之内把它带来。带不来，你们一个也别想保住脑袋。"
        - id: ch02-b03
          speakers: [brother_1, brother_2, brother_3]
          ensemble: chorus
          text: "我们从没说过！世上根本不会有这样的鸽子！"
        - id: ch02-b04
          speaker: narrator
          text: "十一个人赌咒发誓，说自己从没讲过这种话，也不相信世上真有这样的鸽子。国王却随他们怎样解释都不肯改变主意。兄弟们退下后悲痛万分，有的哭泣，有的哀叹。埃斯本恰好经过，看见他们一个个满面愁容，便来询问。"
        - id: ch02-b05
          speaker: esben
          text: "出什么事了？"
        - id: ch02-b06
          speaker: brother_1
          text: "告诉你有什么用？你这个小傻瓜救不了我们。"
        - id: ch02-b07
          speaker: esben
          text: "那可不一定。我从前已经救过你们一次。"
        - id: ch02-b08
          speaker: narrator
          text: "哥哥们起初不肯开口。埃斯本提醒他们，女巫家那一夜，是自己救了所有人的命。他们这才把红骑士的谎言和国王的命令全说出来。埃斯本听完，只让他们拿来一袋豌豆。随后，他取出白树枝，跨到上面，念出歌谣。"
        - id: ch02-b09
          speaker: esben
          text: "小树枝，快快飞，载我越过河水去。"
        - id: ch02-b10
          speaker: narrator
          text: "树枝立刻载他飞过河，径直落进女巫的院子。埃斯本从前见过那只鸽子，知道它就在这里。他把豌豆全撒在地上，鸽子果然扑棱棱飞下来啄食。埃斯本瞅准机会，一把捉住它，装进口袋，赶在女巫看见以前匆匆离开。可下一刻，女巫还是追了出来，在背后放声大喊。"
        - id: ch02-b11
          speaker: witch
          text: "喂——是你吗，埃斯本？鸽子是你偷的吗？害我杀掉十一个女儿的也是你吗？"
          emotion: angry
        - id: ch02-b12
          speaker: esben
          text: "是——啊——！全都是我。"
        - id: ch02-b13
          speaker: witch
          text: "你还敢回来吗？"
        - id: ch02-b14
          speaker: esben
          text: "也许会吧。"
        - id: ch02-b15
          speaker: witch
          text: "那你可有苦头吃了！"
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: "白树枝把埃斯本和鸽子送回王宫。哥哥们见到救命的宝物，个个欣喜万分。国王为鸽子再三道谢，还赏下许多金银，可哥哥们照旧没对埃斯本说一个谢字。红骑士见计谋落空，心里更加愤恨。他很快又去告诉国王，鸽子根本不算兄弟们所能弄来的最好东西。他亲耳听他们说过，自己还能捉来一头猪鬃金银相间的野猪。"
        - id: ch02-b17
          speaker: king
          text: "三天之内把那头野猪带来，不然就拿你们的脑袋来抵。"
        - id: ch02-b18
          speakers: [brother_1, brother_2, brother_3]
          ensemble: chorus
          text: "我们从没说过这种话，也不相信世上有这种野猪！"
        - id: ch02-b19
          speaker: narrator
          text: "兄弟们再三否认，国王仍限他们三天交出野猪。他们觉得这一次比上次更糟，根本不知道该去哪里找这种怪物，只能整天低着头发愁。三天只剩最后一天时，埃斯本又来了。他们仍说弟弟帮不上忙，埃斯本却提醒他们，自己早已救过他们。听完红骑士怎样挑唆国王，他要来一袋麦芽，再次跨上白树枝。"
        - id: ch02-b20
          speaker: esben
          text: "小树枝，快快飞，载我越过河水去。"
        - id: ch02-b21
          speaker: narrator
          text: "树枝很快把他送回女巫的院里。埃斯本倒出麦芽，下一刻，那头神奇的野猪便跑来吃食。它全身的鬃毛一根金、一根银，轮流相间。埃斯本立刻把野猪塞进口袋，赶在女巫发现以前匆匆离开。可女巫还是马上追了出来，在他背后大声质问。"
        - id: ch02-b22
          speaker: witch
          text: "又是你吗，埃斯本？你偷了我的漂亮野猪，也偷了鸽子，还害死了我十一个女儿，是不是？"
          emotion: angry
        - id: ch02-b23
          speaker: esben
          text: "是——啊——！"
        - id: ch02-b24
          speaker: witch
          text: "你还会回来吗？"
        - id: ch02-b25
          speaker: esben
          text: "也许会吧。"
        - id: ch02-b26
          speaker: witch
          text: "那你可有苦头吃了！"
          emotion: angry
        - id: ch02-b27
          speaker: narrator
          text: "野猪很快被送到王宫。哥哥们庆幸自己再次保住性命，高兴得简直不知道哪条腿该站在地上，却还是没人想起感谢埃斯本。国王见到野猪，比见到鸽子时更加欢喜，甚至想不出该拿什么赏赐兄弟们。红骑士却又被怒火和嫉妒攫住，继续谋划怎样把他们推入困境。"
    - id: ch03
      title: "照亮七国的灯"
      blocks:
        - id: ch03-b01
          speaker: sir_red
          text: "陛下，鸽子和野猪还不算什么。那十一个兄弟说过，只要愿意，他们还能弄来一盏照亮七个王国的灯。"
        - id: ch03-b02
          speaker: king
          text: "那一定是盏辉煌的灯。既然他们说过，就非得替我带回来。"
        - id: ch03-b03
          speaker: narrator
          text: "兄弟们又被召进宫。他们猜到红骑士想出了新的毒计，谁也不愿前去，却不得不听命。国王说，他们既然声称能取得一盏照亮七国的灯，就必须在三天内把它交出来，否则全都要丧命。兄弟们说自己从没讲过这种话，也确信世上没有这种灯，可他们怎样申辩都没有用。"
        - id: ch03-b04
          speaker: king
          text: "我要那盏灯。拿不来，就把脑袋留下！"
        - id: ch03-b05
          speaker: narrator
          text: "这回，兄弟们比从前任何一次都更加绝望。他们不知道还能做些什么，因为世上从来没人听说过一盏能照亮七国的灯。大家只觉得性命这回一定保不住了。就在事情糟得不能再糟时，埃斯本又来到他们身边。"
        - id: ch03-b06
          speaker: esben
          text: "又出事了？这回怎么啦？"
        - id: ch03-b07
          speaker: brother_2
          text: "告诉你也没用。你救不了我们。"
        - id: ch03-b08
          speaker: esben
          text: "至少先说给我听听。我以前不是帮过你们吗？"
        - id: ch03-b09
          speaker: narrator
          text: "哥哥们只好说明灯的事，还说全世界从来没人听说过这样的宝物。埃斯本要来一蒲式耳盐，骑上白树枝，念道。"
        - id: ch03-b10
          speaker: esben
          text: "小树枝，快快飞，载我越过河水去。"
        - id: ch03-b11
          speaker: narrator
          text: "树枝带他飞到女巫家。可这次事情没那么容易。天已经黑了，院门紧紧锁着，他根本进不去。想了一阵，他爬上屋顶，从烟囱钻进屋里。"
        - id: ch03-b12
          speaker: narrator
          text: "灯是女巫最珍贵的宝物之一，被她藏得严严实实。埃斯本把屋里各处都找遍了，还是连灯的影子也没看见。他实在累了，只好钻进烤炉，打算躺在那里睡到天亮。就在这时，女巫躺在床上喊醒一个女儿。她肚子饿了，又忽然馋得厉害，非要马上吃一碗粥。女儿起床生火，把一锅水架了上去。"
        - id: ch03-b13
          speaker: witch
          text: "粥里千万别放盐。"
        - id: ch03-b14
          speaker: witch_daughter
          text: "我不会放的。"
        - id: ch03-b15
          speaker: narrator
          text: "女儿答应绝不放盐，转身去拿谷粉。埃斯本立刻溜出烤炉，把整整一蒲式耳盐全倒进锅里，又赶紧藏好。女儿回来加入谷粉，等粥煮了一会儿，就端到母亲床前。女巫舀起一勺送进嘴里，刚尝到味道，便恶心得叫了起来。"
        - id: ch03-b16
          speaker: witch
          text: "呸！我不是叫你别放盐吗？这粥咸得跟海水一样！"
          emotion: disgusted
        - id: ch03-b17
          speaker: narrator
          text: "女儿只得把咸粥倒掉，重新再煮一锅。母亲严厉提醒她，这次绝不能放盐。偏偏屋里已经没水了，女儿只好向母亲借灯，好去井边打水。女巫终于拿出那盏照亮七国的灯，叮嘱她务必看好。女儿提灯出门，埃斯本悄悄跟在后面。她来到井边，把灯放在一块石头上，弯腰准备汲水。埃斯本瞅准机会，抓起灯，又从背后推她一把。女儿头朝下栽进井里，埃斯本拿着灯就跑。女巫听见动静，从床上爬起来追了出去。"
        - id: ch03-b18
          speaker: witch
          text: "又是你吗，埃斯本？鸽子和野猪都是你偷的，十一个女儿也是你害死的。现在你又抢走我的灯，把我第十二个女儿淹死了，对不对？"
          emotion: angry
        - id: ch03-b19
          speaker: esben
          text: "是——啊——！"
        - id: ch03-b20
          speaker: witch
          text: "你还会回来吗？"
        - id: ch03-b21
          speaker: esben
          text: "也许会吧。"
        - id: ch03-b22
          speaker: witch
          text: "那你可有苦头吃了！"
          emotion: angry
        - id: ch03-b23
          speaker: narrator
          text: "不过片刻，白树枝便把埃斯本送回王宫，哥哥们终于摆脱了眼前的灾祸。国王得到神灯，送出许多精美礼物，哥哥们却连一句谢意也没留给埃斯本。红骑士从没像此刻这样嫉妒得发狂。他日里想，夜里也想，绞尽脑汁，非要找出一件绝不可能完成的差事，逼兄弟们去送死。"
    - id: ch04
      title: "响彻八国的床罩"
      blocks:
        - id: ch04-b01
          speaker: sir_red
          text: "陛下，那盏灯虽好，兄弟们却能弄到更好的宝物。那是凡人听说过的最美床罩。只要轻轻一碰，它的声音就能传遍八个王国。"
        - id: ch04-b02
          speaker: king
          text: "这样好的床罩必须归我。你们把它弄来，不然就丢掉性命。"
        - id: ch04-b03
          speakers: [brother_1, brother_2, brother_3]
          ensemble: chorus
          text: "我们从没提过这种床罩。它根本不可能存在，我们也不可能把它带来！"
        - id: ch04-b04
          speaker: narrator
          text: "兄弟们说，他们从没提过这种床罩，也不相信它真的存在，更不可能把它弄来。国王一句也不肯听，把他们赶了出去，还威胁说，若不赶快办成，就砍掉所有人的脑袋。兄弟们觉得这次再也没有活路。最小的哥哥倒问了一句，埃斯本去了哪里。其他人却说，那个小傻瓜连自己的衣服都快保不住了，哪里救得了他们。没有一个人觉得弟弟值得去找，埃斯本还是自己来了。"
        - id: ch04-b05
          speaker: esben
          text: "好啦，这次又发生什么事了？"
        - id: ch04-b06
          speaker: brother_1
          text: "说了也白说，你帮不了。"
        - id: ch04-b07
          speaker: esben
          text: "谁知道呢？我以前不是帮过你们吗？"
        - id: ch04-b08
          speaker: narrator
          text: "哥哥们说，那条床罩只要有人碰一下，声音就能传遍八国。埃斯本听完，也觉得这是自己遇到过最难的差事。可再坏不过是失败，他仍决定试一试。他取出白树枝，跨坐上去，念道。"
        - id: ch04-b09
          speaker: esben
          text: "小树枝，快快飞，载我越过河水去。"
        - id: ch04-b10
          speaker: narrator
          text: "下一刻，他便越过河，来到女巫屋旁。"
        - id: ch04-b11
          speaker: narrator
          text: "天色已经很晚，女巫的门早就锁上了。埃斯本照旧爬上屋顶，从烟囱下去。进屋以后，他才发现最难的一关还没过。那条床罩就铺在女巫睡觉的床上。埃斯本轻轻走进房间，女巫和女儿都没有醒。他伸手想把床罩抽走，可手指刚一碰到它，巨大的响声就传遍八个王国。女巫猛然惊醒，跳下床，一把抓住了他。埃斯本拼命挣扎，却怎么也挣不开。"
        - id: ch04-b12
          speaker: witch
          text: "快来帮忙！把他关进小黑屋，慢慢养肥。哈，哈！这一次，我总算逮住他了！"
          emotion: happy
        - id: ch04-b13
          speaker: narrator
          text: "埃斯本被塞进一个狭小的黑洞，那里既看不见太阳，也看不见月亮。女巫每天拿甜牛奶和坚果仁喂他，要把他养得肥肥的。女巫的女儿忙着替他咬开坚果，十四天下来，满嘴牙齿都被坚硬的果壳硌断，只剩下一颗。可就在这些日子里，她倒渐渐喜欢上了埃斯本，很想偷偷放他走，只是不知道怎样才能办到。"
        - id: ch04-b14
          speaker: narrator
          text: "过了一阵，女巫命令女儿割下埃斯本一根手指，好让自己咬一咬，看看他养肥没有。女儿不愿伤害埃斯本，便跑来告诉他母亲的命令，问他该怎么办。埃斯本想出一个主意，让她拿一根铁钉，在外面紧紧裹上一块皮，冒充他的手指，送给女巫试咬。"
        - id: ch04-b15
          speaker: witch
          text: "呸，不行！还是皮包骨头，得再养些日子。"
          emotion: disgusted
        - id: ch04-b16
          speaker: narrator
          text: "女巫觉得这根假手指只有皮和骨，便让女儿继续喂养。埃斯本只好又吃了一阵甜牛奶和坚果仁。终于有一天，女巫认定他肯定够肥了，再次命令女儿割下他的手指。这时候，埃斯本在黑洞里也待得厌烦透顶。他叫女儿去割下一只母牛乳头，拿给女巫试咬。女儿照办，女巫一口咬下，十分满意。"
        - id: ch04-b17
          speaker: witch
          text: "啊，这回可肥了，几乎摸不到骨头。现在就该宰掉他！"
          emotion: happy
        - id: ch04-b18
          speaker: narrator
          text: "偏巧这天，女巫必须赶去特罗姆斯教堂。所有女巫每年会在那里聚会一次，她无论如何不能错过。既然来不及亲自动手，她就吩咐女儿把大烤炉烧得滚烫，再从黑屋里带出埃斯本，务必在她回来以前把他烤熟。女儿答应了每一项吩咐，女巫这才动身。"
        - id: ch04-b19
          speaker: narrator
          text: "女儿把烤炉烧得不能再热，随后打开黑屋，带埃斯本出来。她拿来一把烤炉铲，叫他坐到上面，好把他一口气送进炉膛。埃斯本依言坐好。可女儿刚把他推到炉口，他就故意大大张开两条腿，卡住两边，怎么也塞不进去。"
        - id: ch04-b20
          speaker: witch_daughter
          text: "不能这样坐。你得把腿交叉起来。"
        - id: ch04-b21
          speaker: esben
          text: "我不明白。到底该怎么坐？"
        - id: ch04-b22
          speaker: witch_daughter
          text: "让开，我坐给你看。"
        - id: ch04-b23
          speaker: narrator
          text: "女儿要亲自示范，才在烤炉铲上坐稳，埃斯本便一把抓住铲柄，将她猛地送进炉膛，随后牢牢关紧炉门。他转身跑进女巫的卧房，抓起那条床罩。手指刚一碰上，响声又越过山川，传遍八个王国。远在特罗姆斯教堂的女巫也听见了，立刻从聚会中飞回家来，追着埃斯本放声怒吼。"
        - id: ch04-b24
          speaker: witch
          text: "又是你吗，埃斯本？十一个女儿是你害死的，鸽子、野猪和灯是你偷的，第十二个女儿是你推进井里的。现在，你又把我第十三个，也是最后一个女儿烤死了，还抢走我的床罩，对不对？"
          emotion: angry
        - id: ch04-b25
          speaker: esben
          text: "是——啊——！"
        - id: ch04-b26
          speaker: witch
          text: "你还会回来吗？"
        - id: ch04-b27
          speaker: esben
          text: "不，我永远不会回来了。"
        - id: ch04-b28
          speaker: narrator
          text: "听见埃斯本说永远不会回来，女巫再也压不住怒火。她气得整个身体猛然炸开，化成数也数不清的燧石，散落到四面八方。直到今天，这个国家里还到处都能找到燧石。据说，它们就是在那一刻留下来的。"
    - id: ch05
      title: "埃斯本归家"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "埃斯本找回被女巫夺走的白树枝，跨坐上去，再次念道。"
        - id: ch05-b02
          speaker: esben
          text: "小树枝，快快飞，载我越过河水去。"
        - id: ch05-b03
          speaker: narrator
          text: "树枝载着他和床罩飞过河水，转眼回到王宫。这里的情形已经坏到极点。因为迟迟见不到床罩，国王把十一个哥哥全投入监牢，处刑的日子也近在眼前。"
        - id: ch05-b04
          speaker: narrator
          text: "埃斯本赶去见国王，把这件宝物呈到他面前。国王欣喜若狂，伸手一碰床罩，声音果然传遍八个王国。其他七位国王都听见了。他们只能坐在各自的宫里生闷气，嫉妒这个国王拥有世上独一无二的床罩，自己却没有。"
        - id: ch05-b05
          speaker: narrator
          text: "接着，埃斯本从头讲清事情的全部经过。他告诉国王，红骑士只是嫉妒自己的哥哥，才编出一个又一个谎言，用尽所能想到的办法加害他们。国王听完，马上下令释放十一个人。红骑士却要为自己的恶行受罚。他被吊死在众人所能找到的最高的一棵树上，终于得到了应有的报应。"
        - id: ch05-b06
          speaker: narrator
          text: "这一次，埃斯本和哥哥们都受到隆重款待。到了此刻，哥哥们终于开口感谢弟弟，承认是他一次又一次救了大家的性命。国王赏给十二个人许多金银，让他们能拿多少就拿多少。兄弟们背起自己所能带动的全部财宝，一同踏上回家的路。"
        - id: ch05-b07
          speaker: narrator
          text: "年迈的父亲原以为儿子们一去不返，自己这辈子再也见不到他们了。如今十二个人一个不少，全都站在眼前，他欢喜得流下眼泪。哥哥们围在父亲身边，把一路上的奇遇讲给他听。他们告诉老人，从女巫的小屋到国王的监牢，埃斯本做过多少了不起的事，又怎样一次次救下他们所有人的性命。"
        - id: ch05-b08
          speaker: narrator
          text: "十二个儿子终于一个不少地回到家中。哥哥们把埃斯本立下的功劳，还有他怎样救过大家性命的每一件事，全都告诉了父亲。从那一天起，一家人再也不把埃斯本排斥在外，他也不再是任人取笑、任人欺负的小不点儿了。"
