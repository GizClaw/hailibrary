  chapters:
    - id: ch01
      title: The White Stick
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man with twelve sons. The eleven eldest were big and strong, while the twelfth, Esben, was only a little fellow. The older boys went with their father to work in the fields and forests. Esben preferred staying home with his mother, so the others hardly counted him as one of them. He lived like an outcast in his own family.
        - id: ch01-b02
          speaker: narrator
          text: When the eleven grew to manhood, they decided to go out into the world and seek their fortunes. They kept after their father, demanding everything they would need for the journey. He did not favor the plan at all. He was old and weak by then, and he could hardly spare the sons who helped him with his work. In the end, their pestering forced him to give in. Each of the eleven received a fine white horse and money for the road. Then they said farewell to their father and their home and rode away together. Nobody had thought of Esben. His brothers had not even said goodbye to him.
        - id: ch01-b03
          speaker: esben
          text: Father, give me a horse and some money too. I'd like to go out and see the world.
        - id: ch01-b04
          speaker: father
          text: You little fool. If I could have sent you away and kept your eleven brothers here, my old age would be much easier.
        - id: ch01-b05
          speaker: esben
          text: Well, you won't have me here much longer anyway.
        - id: ch01-b06
          speaker: narrator
          text: Since Esben could get no horse, he went into the forest and broke off a branch. He stripped away the bark until his stick was even whiter than his brothers' horses. Then he climbed onto it and rode after them.
        - id: ch01-b07
          speaker: narrator
          text: The eleven brothers rode onward for the whole day. As evening drew near, they reached a great forest and followed the road beneath its trees. Far inside the wood, they came upon a little house. With night approaching, they went to the door and knocked. An old and ugly hag opened it. She even had a beard. The brothers asked whether there was room for all eleven of them to stay until morning.
        - id: ch01-b08
          speaker: witch
          text: Yes, you may all stay. And each of you shall have one of my daughters beside him tonight.
        - id: ch01-b09
          speaker: narrator
          text: The brothers thought they had found wonderfully hospitable people. The household treated them well, and at bedtime each brother lay down beside one of the hag's daughters.
        - id: ch01-b10
          speaker: narrator
          text: Esben had followed the same road and found the same house. He slipped inside without the witch or her daughters seeing him and hid under one of the beds. A little before midnight, he crept out and quietly woke his brothers. He told each man to exchange nightcaps with the daughter beside him. The brothers could see no reason for doing it, but Esben would not stop insisting. At last, just to be rid of his pleas, all eleven made the exchange. Then they lay down and were soon fast asleep again.
        - id: ch01-b11
          speaker: narrator
          text: At midnight Esben heard the old witch creeping through the room. She carried a broad-bladed axe and went from bed to bed. The darkness was so deep that she could not see even a hand's breadth before her face. She had to feel her way along all eleven beds. At each one, she found the sleeper who wore a man's nightcap and struck off that sleeper's head. Because of Esben's exchange, every one of them was the witch's own daughter.
        - id: ch01-b12
          speaker: narrator
          text: As soon as the witch had gone, Esben woke his brothers. They hurried to their horses and fled from the house, thankful to have escaped. Yet they forgot all about thanking Esben.
        - id: ch01-b13
          speaker: narrator
          text: After riding for some time, the brothers reached a king's palace and asked for work. They were told the king would take them only as stablemen. That suited them, and they began caring for all his horses.
        - id: ch01-b14
          speaker: narrator
          text: Long after his brothers, Esben arrived at the palace riding his stick. He too asked for a place in the king's service, but no one had any use for him. They told him he might as well turn around and go back the way he had come. Esben stayed anyway and found whatever small occupations he could. The palace gave him food, but no wages and no lodging. Each night, he simply lay down wherever he could find a place.
        - id: ch01-b15
          speaker: narrator
          text: At that time, a knight named Sir Red lived in the palace. The king thought very highly of him, but everyone else hated him, for the knight was wicked in both his wishes and his deeds. Sir Red grew angry with the eleven new stablemen because they would not always spring to attention when he passed. He took the insult deeply and decided that he would have his revenge on them.
        - id: ch01-b16
          speaker: sir_red
          text: Those eleven new stablemen can do far more than they admit, Your Majesty. I heard them say they could bring you a marvelous dove with feathers alternating gold and silver. They simply refuse to fetch it unless you threaten them with death.
        - id: ch01-b17
          speaker: narrator
          text: The king summoned all eleven brothers.
        - id: ch01-b18
          speaker: king
          text: You have claimed that you can bring me a dove whose feathers alternate gold and silver.
        - id: ch01-b19
          speakers: [brother_1, brother_2, brother_3]
          ensemble: chorus
          text: We never said any such thing. We don't believe a dove like that exists anywhere in the world.
        - id: ch01-b20
          speaker: king
          text: Believe whatever you please. If that dove is not here within three days, every one of you will lose his head.
        - id: ch01-b21
          speaker: narrator
          text: The king dismissed them. Grief swept over the brothers. Some wept, and the others groaned over their fate. Just then Esben came by and saw their miserable faces.
        - id: ch01-b22
          speaker: esben
          text: Hello there. What's happened to all of you?
        - id: ch01-b23
          speaker: brother_1
          text: Why should we tell a little fool like you? There's nothing you can do for us.
        - id: ch01-b24
          speaker: esben
          text: You can't be sure of that. I've saved you once already.
        - id: ch01-b25
          speaker: narrator
          text: In the end, they told him about the king's cruel order and the dove with alternating feathers of gold and silver.
        - id: ch01-b26
          speaker: esben
          text: Give me a bag of peas, and I'll see what I can do.
        - id: ch01-b27
          speaker: narrator
          text: Esben received the peas. Then he took his white stick and spoke to it.
        - id: ch01-b28
          speaker: esben
          text: Fly quickly, my little stick. Carry me over the stream.
        - id: ch01-b29
          speaker: narrator
          text: At once the stick carried him across the river and into the old witch's courtyard. Esben had noticed her wondrous dove during his first visit. He scattered the peas, and the bird fluttered down to eat them. Esben caught it, tucked it into the bag, and hurried away before the witch saw him. A moment later she came running after him.
        - id: ch01-b30
          speaker: witch
          text: Hey! Is that you, Esben?
          emotion: angry
        - id: ch01-b31
          speaker: esben
          text: Ye-e-es!
        - id: ch01-b32
          speaker: witch
          text: Did you steal my dove?
          emotion: angry
        - id: ch01-b33
          speaker: esben
          text: Ye-e-es!
        - id: ch01-b34
          speaker: witch
          text: Were you the one who made me kill my eleven daughters?
          emotion: angry
        - id: ch01-b35
          speaker: esben
          text: Ye-e-es!
        - id: ch01-b36
          speaker: witch
          text: Will you come back here again?
          emotion: angry
        - id: ch01-b37
          speaker: esben
          text: Perhaps I will.
        - id: ch01-b38
          speaker: witch
          text: Then just wait until I catch you!
          emotion: angry
        - id: ch01-b39
          speaker: narrator
          text: The stick carried Esben and the dove safely back to the king's palace. His brothers were overjoyed when they saw what he had brought. They presented the marvelous bird as their own prize. The king thanked them again and again for the dove and rewarded them with both silver and gold. The sight of their success only made Sir Red more bitter. Once again, he began searching for a way to take revenge on the brothers.
    - id: ch02
      title: The Golden and Silver Boar
      blocks:
        - id: ch02-b01
          speaker: sir_red
          text: The dove is nowhere near the finest thing those brothers can bring you. I overheard them talking together. They said they could fetch a boar whose bristles alternate gold and silver.
        - id: ch02-b02
          speaker: narrator
          text: Once again, the king called the brothers before him and asked whether Sir Red's report was true.
        - id: ch02-b03
          speakers: [brother_1, brother_2, brother_3]
          ensemble: chorus
          text: No, Your Majesty. We have never said or even thought it. We don't believe such a boar exists anywhere.
        - id: ch02-b04
          speaker: king
          text: Bring me that boar within three days, or all your heads will pay for it.
        - id: ch02-b05
          speaker: narrator
          text: The brothers had to leave the king without changing his mind. This demand seemed even worse than the first. Where in the whole world could they find such a marvelous boar? They spent the next two days wandering about with their heads hanging low, unable to see any hope of escape. When only one day remained before the king's deadline, Esben came along and found them in their sorrow.
        - id: ch02-b06
          speaker: esben
          text: Hello again. What's troubling you this time?
        - id: ch02-b07
          speaker: brother_2
          text: What's the point in telling you? You certainly can't help us.
        - id: ch02-b08
          speaker: esben
          text: You don't know that. I've helped you before.
        - id: ch02-b09
          speaker: narrator
          text: At last the brothers explained that Sir Red had turned the king against them. Now they had to bring him a boar with bristles of gold and silver.
        - id: ch02-b10
          speaker: esben
          text: That's no reason to despair. Give me a sack of malt. I may be able to help you yet.
        - id: ch02-b11
          speaker: narrator
          text: They gave Esben the malt. He mounted his little white stick and spoke the familiar words.
        - id: ch02-b12
          speaker: esben
          text: Fly quickly, my little stick. Carry me over the stream.
        - id: ch02-b13
          speaker: narrator
          text: Away the stick flew. Before long Esben stood in the witch's courtyard once more. He emptied the malt onto the ground. The boar came at once, with every other bristle made of gold or silver. Esben forced it into the sack and rushed away before the witch could spot him. But a moment later she ran after him, shouting.
        - id: ch02-b14
          speaker: witch
          text: Hey! Is that you, Esben?
          emotion: angry
        - id: ch02-b15
          speaker: esben
          text: Ye-e-es!
        - id: ch02-b16
          speaker: witch
          text: Have you taken my beautiful boar?
          emotion: angry
        - id: ch02-b17
          speaker: esben
          text: Ye-e-es!
        - id: ch02-b18
          speaker: witch
          text: Did you steal my dove as well?
          emotion: angry
        - id: ch02-b19
          speaker: esben
          text: Ye-e-es!
        - id: ch02-b20
          speaker: witch
          text: And did you make me kill my eleven daughters?
          emotion: angry
        - id: ch02-b21
          speaker: esben
          text: Ye-e-es!
        - id: ch02-b22
          speaker: witch
          text: Are you coming back again?
          emotion: angry
        - id: ch02-b23
          speaker: esben
          text: Perhaps I will.
        - id: ch02-b24
          speaker: witch
          text: Then you'll suffer when I catch you!
          emotion: angry
        - id: ch02-b25
          speaker: narrator
          text: Esben and his white stick soon returned to the palace with the boar. His brothers were so relieved to be safe again that they scarcely knew which leg to stand on. Even then, not one of them remembered to thank Esben. The king was more delighted with the golden and silver boar than he had been with the dove. He hardly knew what reward could be grand enough for the brothers. Sir Red, meanwhile, burned with anger and envy. Once more he went away to plan how he could bring the eleven men into trouble.
    - id: ch03
      title: The Lamp Over Seven Kingdoms
      blocks:
        - id: ch03-b01
          speaker: sir_red
          text: Those eleven brothers have brought you the dove and the boar, but they can do much more. I know they have said they could bring you a lamp that shines over seven kingdoms.
        - id: ch03-b02
          speaker: king
          text: If they have said so, then they will bring it. What a glorious lamp that would be!
        - id: ch03-b03
          speaker: narrator
          text: The king sent for the brothers again. They went unwillingly, certain that Sir Red had invented some fresh trouble. The moment they stood before the throne, the king gave his command.
        - id: ch03-b04
          speaker: king
          text: You claim that you can bring me a lamp bright enough to shine over seven kingdoms. I must have it within three days, or you will lose your lives.
        - id: ch03-b05
          speakers: [brother_1, brother_2, brother_3]
          ensemble: chorus
          text: We never claimed that, Your Majesty. We are certain no such lamp exists.
        - id: ch03-b06
          speaker: king
          text: Bring me the lamp, or lose your heads!
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: Their words had done no good. The brothers fell into deeper despair than ever, for no one had even heard of such a lamp. When all seemed lost, Esben came along.
        - id: ch03-b08
          speaker: esben
          text: Is something wrong again? What's happened now?
        - id: ch03-b09
          speaker: brother_1
          text: Telling you won't help. You can't save us from this.
        - id: ch03-b10
          speaker: esben
          text: You could at least tell me. I've helped you before.
        - id: ch03-b11
          speaker: narrator
          text: Finally they told him that the king demanded a lamp whose light reached across seven kingdoms, though no one had ever heard of one.
        - id: ch03-b12
          speaker: esben
          text: Give me a bushel of salt. Then we'll see how matters turn out.
        - id: ch03-b13
          speaker: narrator
          text: With the salt in hand, Esben climbed onto his white stick.
        - id: ch03-b14
          speaker: esben
          text: Fly quickly, my little stick. Carry me over the stream.
        - id: ch03-b15
          speaker: narrator
          text: In an instant, the stick carried Esben and his salt to the witch's courtyard. This time the task was harder. Evening had come, and the gate was locked. At last Esben climbed onto the roof and slipped down the chimney.
        - id: ch03-b16
          speaker: narrator
          text: He searched all around the house, but he could not find the lamp anywhere. It was one of the witch's dearest treasures, and she always kept it safely guarded. At last Esben grew tired of searching. He crawled into the baking oven, meaning to hide there and sleep until morning. Just then, he heard the witch calling from her bed to one of her daughters. She had grown hungry and had taken a fancy to porridge. The daughter got out of bed, kindled the fire, and set a pot of water over it.
        - id: ch03-b17
          speaker: witch
          text: Do not put any salt in my porridge!
        - id: ch03-b18
          speaker: witch_daughter
          text: I won't put in any, Mother.
        - id: ch03-b19
          speaker: narrator
          text: While the daughter went to fetch the meal, Esben slipped from the oven and poured the whole bushel of salt into the pot. The daughter returned, stirred in the meal, and let the porridge boil. Then she carried it to her mother. The witch tasted one spoonful.
        - id: ch03-b20
          speaker: witch
          text: Ugh! I told you to leave out the salt. This tastes as salty as the sea!
          emotion: disgusted
        - id: ch03-b21
          speaker: narrator
          text: The daughter had to begin again, and the witch warned her sharply not to use salt. But there was no water left in the house. The daughter asked for the lamp so she could see her way to the well.
        - id: ch03-b22
          speaker: witch
          text: Here, take it. But mind that you guard it carefully.
        - id: ch03-b23
          speaker: narrator
          text: Carrying the lamp that shone over seven kingdoms, the daughter left the house and went to the well for water. Esben slipped out behind her and followed without being seen. When she was ready to draw water, she placed the precious lamp on a stone beside her. Esben watched until his chance came. Then he snatched the lamp and pushed the daughter from behind, sending her tumbling headfirst into the well. He made off at once, but the witch sprang from her bed, rushed outside, and ran after him.
        - id: ch03-b24
          speaker: witch
          text: Hey! Is that you again, Esben?
          emotion: angry
        - id: ch03-b25
          speaker: esben
          text: Ye-e-es!
        - id: ch03-b26
          speaker: witch
          text: Were you the one who took my dove?
          emotion: angry
        - id: ch03-b27
          speaker: esben
          text: Ye-e-es!
        - id: ch03-b28
          speaker: witch
          text: And did you take my boar too?
          emotion: angry
        - id: ch03-b29
          speaker: esben
          text: Ye-e-es!
        - id: ch03-b30
          speaker: witch
          text: Did you make me kill my eleven daughters?
          emotion: angry
        - id: ch03-b31
          speaker: esben
          text: Ye-e-es!
        - id: ch03-b32
          speaker: witch
          text: And now you've stolen my lamp and drowned my twelfth daughter in the well?
          emotion: angry
        - id: ch03-b33
          speaker: esben
          text: Ye-e-es!
        - id: ch03-b34
          speaker: witch
          text: Will you dare to come back again?
          emotion: angry
        - id: ch03-b35
          speaker: esben
          text: Perhaps I will.
        - id: ch03-b36
          speaker: witch
          text: Then you'll pay for it when I catch you!
          emotion: angry
        - id: ch03-b37
          speaker: narrator
          text: Within a minute, the stick brought Esben back to the palace, and his brothers were safe once more. The king gave them splendid presents. Esben did not receive so much as a word of thanks. Sir Red had never felt such envy. Day and night he racked his mind for something impossible to demand from the brothers.
    - id: ch04
      title: The Coverlet That Sounded Over Eight Kingdoms
      blocks:
        - id: ch04-b01
          speaker: sir_red
          text: The lamp those brothers brought is good enough, but they can fetch you something far better.
        - id: ch04-b02
          speaker: king
          text: And what might that be?
        - id: ch04-b03
          speaker: sir_red
          text: The most beautiful coverlet any mortal has ever heard of. Whenever someone touches it, the sound can be heard across eight kingdoms.
        - id: ch04-b04
          speaker: king
          text: That must be a magnificent coverlet!
        - id: ch04-b05
          speaker: narrator
          text: He sent for the brothers at once.
        - id: ch04-b06
          speaker: king
          text: You have said you know of the loveliest coverlet in the world, one that sounds across eight kingdoms when it is touched. Bring it to me, or lose your lives.
        - id: ch04-b07
          speakers: [brother_1, brother_2, brother_3]
          ensemble: chorus
          text: We have never spoken a word about such a coverlet. We don't believe it exists, and we could never bring it to you.
        - id: ch04-b08
          speaker: narrator
          text: The king refused to listen. He drove them away with another threat that their heads would fall if the coverlet did not come soon. Everything looked black for the brothers. They were sure there was no escape.
        - id: ch04-b09
          speaker: brother_3
          text: Where is Esben?
        - id: ch04-b10
          speaker: brother_1
          text: That little fool can hardly keep clothes on his own back. We can't expect him to help us.
        - id: ch04-b11
          speaker: narrator
          text: None of them thought it worthwhile to look for Esben. Before long, he appeared on his own.
        - id: ch04-b12
          speaker: esben
          text: Well, what's the trouble this time?
        - id: ch04-b13
          speaker: brother_2
          text: There's no use telling you. You can't help us with this.
        - id: ch04-b14
          speaker: esben
          text: Who knows? I've helped you before.
        - id: ch04-b15
          speaker: narrator
          text: In the end, they told him of the coverlet that sounded across eight kingdoms whenever anyone touched it. Esben thought this was the hardest errand yet. Still, the worst that could happen was failure, so he decided to try.
        - id: ch04-b16
          speaker: narrator
          text: Once again, he mounted his little white stick.
        - id: ch04-b17
          speaker: esben
          text: Fly quickly, my little stick. Carry me over the stream.
        - id: ch04-b18
          speaker: narrator
          text: The next moment he stood beside the witch's house. Evening had fallen and the door was locked, but Esben already knew the way down the chimney. Once inside, he faced the worst part. The coverlet lay on the very bed where the witch was sleeping.
        - id: ch04-b19
          speaker: narrator
          text: Esben crept into the room without waking the witch or her remaining daughter. The instant he touched the coverlet, it sounded across eight kingdoms. The witch leaped out of bed and seized him. Esben struggled, but he could not break free.
        - id: ch04-b20
          speaker: witch
          text: Come help me! We'll shut him in the little dark room and fatten him up. Ho, ho! At last I've caught him!
          emotion: happy
        - id: ch04-b21
          speaker: narrator
          text: The witch and her daughter locked Esben in a small dark hole where he could see neither sun nor moon. There they began fattening him on sweet milk and nut kernels. The daughter had more than enough work cracking all those nuts for him. By the end of fourteen days, she had broken every tooth in her mouth but one. During that time she had also grown fond of Esben. She would willingly have opened the dark room and set him free, but she could not do it.
        - id: ch04-b22
          speaker: narrator
          text: After some time, the witch ordered her daughter to cut off one of Esben's fingers. She wanted to bite it and discover whether he was fat enough. The daughter went to Esben, told him the order, and asked what she should do.
        - id: ch04-b23
          speaker: esben
          text: Wrap a piece of skin around an iron nail. Give that to your mother to bite.
        - id: ch04-b24
          speaker: narrator
          text: The daughter obeyed. The witch bit down on the wrapped nail.
        - id: ch04-b25
          speaker: witch
          text: Ugh! No, no. He's nothing but skin and bone. He needs much more fattening.
          emotion: disgusted
        - id: ch04-b26
          speaker: narrator
          text: So Esben ate sweet milk and nut kernels for a while longer. One day the witch decided he must surely be ready. Once more she ordered her daughter to cut off one of his fingers. By then Esben had grown tired of the dark hole.
        - id: ch04-b27
          speaker: esben
          text: Cut a teat from a cow this time, and let the witch bite that.
        - id: ch04-b28
          speaker: narrator
          text: The daughter did as he said.
        - id: ch04-b29
          speaker: witch
          text: Ah, now he is fat! I can scarcely feel the bone in him. Now he shall be killed.
          emotion: happy
        - id: ch04-b30
          speaker: narrator
          text: It happened to be the very time when the witch had to travel to Troms Church, where all the witches gathered once each year. She had no time to deal with Esben herself.
        - id: ch04-b31
          speaker: witch
          text: While I am gone, heat the great oven. Take Esben from his prison and roast him before I return.
        - id: ch04-b32
          speaker: witch_daughter
          text: I will do it, Mother.
        - id: ch04-b33
          speaker: narrator
          text: The witch left on her journey. Her daughter heated the oven as fiercely as she could and brought Esben out to roast him. She fetched the oven spade and told him to sit on it so she could slide him inside. Esben sat down, but when she brought him to the oven mouth, he spread his legs wide and stopped the spade from going in.
        - id: ch04-b34
          speaker: witch_daughter
          text: You must not sit that way.
        - id: ch04-b35
          speaker: esben
          text: Then how should I sit?
        - id: ch04-b36
          speaker: witch_daughter
          text: You have to cross your legs.
        - id: ch04-b37
          speaker: narrator
          text: Esben acted as though he could not understand her.
        - id: ch04-b38
          speaker: witch_daughter
          text: Move aside. I'll show you the right way.
        - id: ch04-b39
          speaker: narrator
          text: The daughter moved Esben aside and seated herself on the oven spade to demonstrate. The moment she was in place, Esben grabbed the handle. He thrust her straight into the blazing oven and fastened its door. Then he ran into the witch's room and seized the coverlet. As soon as his hand touched it, the coverlet sounded so loudly that it could be heard across eight kingdoms. Far away at Troms Church, the witch heard the sound. She knew what it meant and came flying home.
    - id: ch05
      title: Esben Comes Home
      blocks:
        - id: ch05-b01
          speaker: witch
          text: Hey! Is that you again, Esben?
          emotion: angry
        - id: ch05-b02
          speaker: esben
          text: Ye-e-es!
        - id: ch05-b03
          speaker: witch
          text: Did you make me kill my eleven daughters?
          emotion: angry
        - id: ch05-b04
          speaker: esben
          text: Ye-e-es!
        - id: ch05-b05
          speaker: witch
          text: And did you take my dove?
          emotion: angry
        - id: ch05-b06
          speaker: esben
          text: Ye-e-es!
        - id: ch05-b07
          speaker: witch
          text: Did you steal my beautiful boar too?
          emotion: angry
        - id: ch05-b08
          speaker: esben
          text: Ye-e-es!
        - id: ch05-b09
          speaker: witch
          text: Did you drown my twelfth daughter in the well and take my lamp?
          emotion: angry
        - id: ch05-b10
          speaker: esben
          text: Ye-e-es!
        - id: ch05-b11
          speaker: witch
          text: And now you've roasted my thirteenth and last daughter and stolen my coverlet?
          emotion: angry
        - id: ch05-b12
          speaker: esben
          text: Ye-e-es!
        - id: ch05-b13
          speaker: witch
          text: Are you coming back again?
          emotion: angry
        - id: ch05-b14
          speaker: esben
          text: No. Never again.
        - id: ch05-b15
          speaker: narrator
          text: The witch became so furious that she burst into countless pieces of flint. That is where all the flint stones scattered through the country came from.
        - id: ch05-b16
          speaker: narrator
          text: Esben found the little white stick the witch had taken from him. He mounted it with the coverlet and spoke.
        - id: ch05-b17
          speaker: esben
          text: Fly quickly, my little stick. Carry me over the stream.
        - id: ch05-b18
          speaker: narrator
          text: The next moment, Esben was back at the palace. Matters there had grown desperate. The king had imprisoned all eleven brothers, and they were soon to be executed because they had failed to bring him the coverlet.
        - id: ch05-b19
          speaker: narrator
          text: Esben went before the king and presented the coverlet. The king was delighted. When he touched it, the sound traveled across eight kingdoms, and all the other kings sat in anger because none of them owned its equal.
        - id: ch05-b20
          speaker: narrator
          text: Then Esben told the king the whole story of what had happened. He also explained how Sir Red's envy had driven the knight to do the brothers every harm he could devise. As soon as the king learned the truth, he ordered all eleven brothers released from prison. Sir Red was punished for his wickedness. They found the highest tree in the country and hanged him from it, and so he received the reward his own deeds had earned.
        - id: ch05-b21
          speaker: narrator
          text: Everyone at the palace now made much of Esben and his brothers. At last the eleven understood what their little brother had done for them, and they thanked him for every time he had saved their lives. The king gave all twelve sons as much gold and silver as they could carry. Laden with their treasure, they left the palace together and began the long journey home to their old father.
        - id: ch05-b22
          speaker: narrator
          text: Their father had never expected to see any of his twelve sons again. When they appeared, he was so happy that he wept for joy. The older brothers told him all Esben had done and how he had saved their lives.
        - id: ch05-b23
          speaker: narrator
          text: From that day on, no one at home ever made Esben their outcast again.
