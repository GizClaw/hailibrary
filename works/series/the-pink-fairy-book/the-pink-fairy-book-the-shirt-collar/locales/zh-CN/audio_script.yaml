audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    shirt_collar:
      display_name: 衬衫领子
      tts:
        delivery: 爱慕虚荣，夸夸其谈，带着戏剧腔
        timbre: 清脆而装腔作势
        pace: 轻快
        pitch: 中音
    garter:
      display_name: 袜带
      tts:
        delivery: 腼腆矜持，拒绝时坚定
        timbre: 轻柔纤细
        pace: 从容
        pitch: 中高音
    iron:
      display_name: 熨斗
      tts:
        delivery: 高傲强硬，毫不客气
        timbre: 厚重响亮
        pace: 平稳
        pitch: 低音
    scissors:
      display_name: 剪刀
      tts:
        delivery: 干脆自信，脾气火爆
        timbre: 明亮锋利
        pace: 明快
        pitch: 中高音
    hair_brush:
      display_name: 发刷
      tts:
        delivery: 务实直白，不动声色
        timbre: 清楚而略显干涩
        pace: 平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 洗衣盆里的袜带
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有位体面的绅士，他在世上的全部家当，只有一只脱靴器和一把发刷。不过，他还有全世界最漂亮的衬衫领子。今天要讲的，就是这只领子的故事。
        - id: ch01-b02
          speaker: narrator
          text: 衬衫领子年纪大了，开始盘算结婚的事。一天，他和一根袜带碰巧一同进了洗衣盆。
        - id: ch01-b03
          speaker: shirt_collar
          text: 哎呀，我从没见过谁像您这么纤细娇嫩，还这样雅致漂亮！能告诉我您的芳名吗？
        - id: ch01-b04
          speaker: garter
          text: 我才不告诉你呢。
        - id: ch01-b05
          speaker: shirt_collar
          text: 那么，您住在哪里？
        - id: ch01-b06
          speaker: narrator
          text: 袜带天性害羞，觉得这种问题不该回答，便一声不响。
        - id: ch01-b07
          speaker: shirt_collar
          text: 您也许是条束腰带？是贴身系的那一种吧？漂亮小姐，我看您不只是装饰，还很实用！
        - id: ch01-b08
          speaker: garter
          text: 你不该对我讲这种话！我可没给过你任何暗示！
        - id: ch01-b09
          speaker: shirt_collar
          text: 您都美成这样了，还要什么别的暗示呢？
        - id: ch01-b10
          speaker: garter
          text: 走开，别贴得这么近！看起来，你倒像是位绅士！
        - id: ch01-b11
          speaker: shirt_collar
          text: 我当然是绅士，还是位很体面的绅士！我有一只脱靴器和一把发刷呢！
        - id: ch01-b12
          speaker: narrator
          text: 这可是假话。那两样东西属于他的主人。衬衫领子就是这样爱吹牛。
        - id: ch01-b13
          speaker: garter
          text: 别再靠近了。我可不习惯别人这样对我！
        - id: ch01-b14
          speaker: shirt_collar
          text: 真会装模作样！
    - id: ch02
      title: 滚烫的熨斗
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 随后，袜带和领子被捞出洗衣盆，浆过以后搭在椅子上，让太阳把他们晒干，然后又送上熨衣板。这时，滚烫的熨斗来了，压在衬衫领子身上。
        - id: ch02-b02
          speaker: shirt_collar
          text: 寡妇太太，亲爱的寡妇太太！您让我整个儿焕然一新，身上所有皱纹都消失了。可是，您快把我烫出洞啦！哎哟，求您停手吧！
        - id: ch02-b03
          speaker: iron
          text: 你这块破布！
        - id: ch02-b04
          speaker: narrator
          text: 熨斗神气地从领子身上驶过去。她把自己想成了车站里的蒸汽机，正拖着一长列货车向前跑。
        - id: ch02-b05
          speaker: iron
          text: 我说，你就是块破布！
    - id: ch03
      title: 剪刀和发刷
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 衬衫领子的边沿磨出了毛，剪刀便过来修掉散开的线头。
        - id: ch03-b02
          speaker: shirt_collar
          text: 啊，您一定是舞蹈家！瞧这腿踢得多高！我这辈子都没见过这么美的动作，任何男人都学不来！
        - id: ch03-b03
          speaker: scissors
          text: 这还用你说！
        - id: ch03-b04
          speaker: shirt_collar
          text: 像您这样的人，真该当一位公爵夫人！我的全部家当里，有一位体面的绅士、一只脱靴器和一把发刷。只可惜还少了一块公爵领地！
        - id: ch03-b05
          speaker: scissors
          text: 什么？他竟敢打我的主意？
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: 剪刀一听，气得狠狠咬了领子一口。这一下剪得又快又深，衬衫领子彻底没用了，只得被丢到一旁。
        - id: ch03-b07
          speaker: shirt_collar
          text: 那我只好向发刷求婚了。太太，您的头发真是又细密又漂亮！您有没有考虑过结婚？
        - id: ch03-b08
          speaker: hair_brush
          text: 当然考虑过。我已经和脱靴器订婚了。
        - id: ch03-b09
          speaker: shirt_collar
          text: 已经订婚了！
          emotion: surprised
        - id: ch03-b10
          speaker: narrator
          text: 这下再没有谁可以娶了。衬衫领子没别的办法，便装出一副瞧不起婚姻的样子。
    - id: ch04
      title: 破布袋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 日子一天天过去。衬衫领子被塞进破布袋，送到造纸厂。那里堆着各式各样的破布，好料放在一堆，粗料放在另一堆，分得井井有条。每块破布都有不少话说，可谁也说不过衬衫领子，因为他吹起牛来简直没救。
        - id: ch04-b02
          speaker: shirt_collar
          text: 我的风流韵事多得吓人！那些小姐缠得我一刻不得安宁。当年的我多么体面，浆得又挺又直！我有一只脱靴器和一把发刷，可我从来用不着它们。你们真该看看我那时的模样！
        - id: ch04-b03
          speaker: shirt_collar
          text: 我的初恋永远忘不了。她是一条束腰带，娇嫩、柔软又漂亮。为了我，她纵身跳进了洗衣盆！
        - id: ch04-b04
          speaker: shirt_collar
          text: 后来还有一位寡妇，爱我爱得浑身发烫。我没有理她，把她独自丢在那里，直到她变得一团漆黑。接着来了位舞蹈家。她脾气太凶，给我留下了这道伤，害得我今天落到这里！
        - id: ch04-b05
          speaker: shirt_collar
          text: 连我自己的发刷也深深爱着我，还因为爱我，掉光了所有头发。说起爱情，我经历得实在太多啦！
        - id: ch04-b06
          speaker: shirt_collar
          text: 可我最放不下的，还是那根袜带——不，是那条束腰带。她为了我跳进洗衣盆。我的良心背着这么多亏欠，也该变成白纸了！
    - id: ch05
      title: 衬衫领子的故事
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 后来，他果真成了白纸，而且正是印着这个故事的这一张纸。他会有这样的下场，谁叫他吹牛吹得那么厉害，讲的还全是假话呢。
        - id: ch05-b02
          speaker: narrator
          text: 我们可得把这件事牢牢记在心里，免得自己也落到同样的下场。谁也说不准，也许有一天，我们会被扔进破布袋，再做成白纸。到时候，我们一生的故事，连最隐秘的部分，都会印在上面。我们也会像衬衫领子一样，带着自己的故事走遍全世界。
