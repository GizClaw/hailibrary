audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and mellow
        pace: measured
        pitch: medium
    shirt_collar:
      display_name: Shirt-Collar
      tts:
        delivery: vain, boastful, and theatrical
        timbre: crisp and polished
        pace: lively
        pitch: medium
    garter:
      display_name: Garter
      tts:
        delivery: reserved, proper, and firm
        timbre: light and delicate
        pace: measured
        pitch: medium-high
    iron:
      display_name: Iron
      tts:
        delivery: proud, forceful, and dismissive
        timbre: heavy and ringing
        pace: steady
        pitch: low
    scissors:
      display_name: Scissors
      tts:
        delivery: sharp, confident, and quick-tempered
        timbre: bright and cutting
        pace: brisk
        pitch: medium-high
    hair_brush:
      display_name: Hair-Brush
      tts:
        delivery: practical and matter-of-fact
        timbre: dry and clear
        pace: steady
        pitch: medium
  chapters:
    - id: ch01
      title: The Garter in the Wash-Tub
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a fine gentleman who owned only a boot-jack and a hair-brush. But he also had the most beautiful shirt-collar in the world, and this is the shirt-collar's story.
        - id: ch01-b02
          speaker: narrator
          text: The shirt-collar had grown so old that he began thinking it was time to marry. One day, he found himself in the wash-tub beside a garter.
        - id: ch01-b03
          speaker: shirt_collar
          text: Well, hello! I have never seen anyone so slender and delicate, or so elegant and pretty. May I ask your name?
        - id: ch01-b04
          speaker: garter
          text: I will not tell you.
        - id: ch01-b05
          speaker: shirt_collar
          text: Then where do you live?
        - id: ch01-b06
          speaker: narrator
          text: The garter was bashful, and she did not think it proper to answer him.
        - id: ch01-b07
          speaker: shirt_collar
          text: Maybe you are a girdle. An under-girdle, perhaps? I can see that you are useful as well as beautiful, my pretty miss.
        - id: ch01-b08
          speaker: garter
          text: You should not talk to me that way. I certainly have not encouraged you!
        - id: ch01-b09
          speaker: shirt_collar
          text: When someone is as lovely as you are, what more encouragement could I need?
        - id: ch01-b10
          speaker: garter
          text: Go away, and do not come so near! You seem to think you are quite a gentleman.
        - id: ch01-b11
          speaker: shirt_collar
          text: I am a gentleman, and a very fine one! I own a boot-jack and a hair-brush.
        - id: ch01-b12
          speaker: narrator
          text: That was not true. Those things belonged to his master. The shirt-collar was a terrible boaster.
        - id: ch01-b13
          speaker: garter
          text: Keep your distance. I am not used to being treated like this!
        - id: ch01-b14
          speaker: shirt_collar
          text: What a show you make of being modest!
    - id: ch02
      title: The Glowing Iron
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Then the collar and the garter were lifted from the wash-tub. They were starched, hung over a chair to dry in the sun, and laid on the ironing-board. Soon the glowing iron came down upon the collar.
        - id: ch02-b02
          speaker: shirt_collar
          text: Dear Mistress Widow! You are making a new man of me. Every crease is disappearing. But now you are burning a hole in me! Ugh! Please stop!
        - id: ch02-b03
          speaker: iron
          text: You are nothing but a rag!
        - id: ch02-b04
          speaker: narrator
          text: The iron traveled proudly over him. She imagined she was a steam engine at the station, ready to pull a line of railway cars.
        - id: ch02-b05
          speaker: iron
          text: I said, you are a rag!
    - id: ch03
      title: The Scissors and the Hair-Brush
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The edge of the shirt-collar was badly frayed, so the scissors came to trim away the loose threads.
        - id: ch03-b02
          speaker: shirt_collar
          text: Oh, you must be a dancer! Look how high you can kick. That is the most beautiful thing I have ever seen. No man could ever do what you do!
        - id: ch03-b03
          speaker: scissors
          text: I know that.
        - id: ch03-b04
          speaker: shirt_collar
          text: You deserve to be a duchess! My worldly possessions include a fine gentleman, a boot-jack, and a hair-brush. If only I owned a duchy as well!
        - id: ch03-b05
          speaker: scissors
          text: What? Does he think he can marry me?
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: The scissors grew so angry that she gave him one sharp snip. After that, the collar was no longer good for anything and had to be thrown aside.
        - id: ch03-b07
          speaker: shirt_collar
          text: Well, then I will propose to the hair-brush. Madam, what wonderfully fine hair you have! Have you ever considered getting married?
        - id: ch03-b08
          speaker: hair_brush
          text: Of course I have. I am engaged to the boot-jack.
        - id: ch03-b09
          speaker: shirt_collar
          text: She is already engaged!
          emotion: surprised
        - id: ch03-b10
          speaker: narrator
          text: There was no one left for the shirt-collar to marry, so from then on he pretended to despise marriage.
    - id: ch04
      title: The Rag-Bag
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Time went by. At last, the shirt-collar was stuffed into a rag-bag and carried to the paper-mill. A great many rags had gathered there. The fine rags lay in one heap and the coarse ones in another, just as they should. Every rag had a story to tell, but the shirt-collar had more stories than anyone, because he was a hopeless braggart.
        - id: ch04-b02
          speaker: shirt_collar
          text: I have had more love affairs than I can count! Those ladies never gave me a moment's peace. I was such a fine gentleman then, standing tall and stiff with starch. I owned a boot-jack and a hair-brush, though I never used either one. You should have seen me!
        - id: ch04-b03
          speaker: shirt_collar
          text: I will never forget my first love. She was a girdle, delicate and soft and pretty. She threw herself into a wash-tub just for me!
        - id: ch04-b04
          speaker: shirt_collar
          text: Then there was a widow who glowed with love for me. I left her there until she turned black. After her came a dancer. She was terribly violent, and she gave me the wound that brought me here.
        - id: ch04-b05
          speaker: shirt_collar
          text: Even my own hair-brush fell in love with me. She lost every bit of her hair because of it. Oh yes, I have been through a great deal where love is concerned.
        - id: ch04-b06
          speaker: shirt_collar
          text: Still, I grieve most for the garter. I mean the girdle, the one who threw herself into the wash-tub. My conscience is heavy with all of this. It is high time I became white paper!
    - id: ch05
      title: The Shirt-Collar's Story
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: And white paper was exactly what he became. In fact, he became the very sheet on which this story was printed. It happened because he had boasted so terribly about things that were not true.
        - id: ch05-b02
          speaker: narrator
          text: We should remember what happened to him. One day, we might also land in the rag-bag and be made into white paper. Then our whole history could be printed there, even its most secret parts, and travel around the world telling its tale, just like the shirt-collar.
