audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    ivan:
      display_name: "伊万"
      tts:
        delivery: "朴实厚道，惊喜时仍带着老人的迟缓"
        timbre: "温厚略显苍老"
        pace: "舒缓"
        pitch: "中低音"
    marie:
      display_name: "玛丽"
      tts:
        delivery: "慈爱热切，牵挂孩子时柔软而忧心"
        timbre: "温柔略显苍老"
        pace: "从容"
        pitch: "中音"
    passerby:
      display_name: "过路人"
      tts:
        delivery: "随口发问，带着乡邻的好奇"
        timbre: "明朗自然"
        pace: "适中"
        pitch: "中音"
    snowflake:
      display_name: "雪花姑娘"
      tts:
        delivery: "乖巧安静，声音里藏着淡淡忧愁"
        timbre: "清澈轻柔"
        pace: "稍慢"
        pitch: "中高音"
    village_girl_1:
      display_name: "村庄姑娘甲"
      tts:
        delivery: "活泼热情，邀请同伴时爽朗自然"
        timbre: "清亮年轻"
        pace: "明快"
        pitch: "中高音"
    village_girl_2:
      display_name: "村庄姑娘乙"
      tts:
        delivery: "开朗亲切，和伙伴说话时轻快"
        timbre: "柔亮年轻"
        pace: "明快"
        pitch: "中高音"
    village_girl_3:
      display_name: "村庄姑娘丙"
      tts:
        delivery: "天真爽快，情急时语速略快"
        timbre: "清脆年轻"
        pace: "稍快"
        pitch: "高音"
  chapters:
    - id: ch01
      title: "雪地里的孩子"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有个农夫名叫伊万，妻子叫玛丽。老两口原本过得很幸福，只是一直没有自己的孩子陪在身边。如今他们上了年纪，天天看着邻家的孩子玩耍，也没法把那些孩子当成自己的，心里的缺憾怎么都补不上。"
        - id: ch01-b02
          speaker: narrator
          text: "有一年，冬雪大得惊人。凡是经历过那个冬天的人，一辈子都忘不了。连最高大的人走进雪里，也会没到膝盖。雪全部落尽以后，太阳又出来了。孩子们跑到街上，先堆起一座小雪台，用脚踩得又坚又实，接着又动手堆一个雪女人。伊万和玛丽坐在窗前望着，心里想了很多。"
        - id: ch01-b03
          speaker: ivan
          text: "老伴儿，我们也来堆一个雪人，怎么样？"
        - id: ch01-b04
          speaker: marie
          text: "好呀，为什么不呢？正好也能给咱们解解闷。不过别堆大人了，那没什么意思。咱们堆个雪娃娃，就当她真是个活孩子吧。"
        - id: ch01-b05
          speaker: ivan
          text: "对，就这么办。"
        - id: ch01-b06
          speaker: narrator
          text: "那天玛丽心情正好。伊万也立刻摘下帽子，跟她一起来到花园。两人使出全身力气，先堆出小小的身子，又做了两只小手和两只小脚。最后，他们在上头放上一团雪球，准备把它雕成脑袋。"
        - id: ch01-b07
          speaker: passerby
          text: "你们俩到底在忙什么呢？"
        - id: ch01-b08
          speaker: ivan
          text: "这还看不出来吗？"
        - id: ch01-b09
          speaker: marie
          text: "我们在堆一个雪娃娃。"
        - id: ch01-b10
          speaker: narrator
          text: "鼻子和下巴做好了，眼睛的位置也留出了两个小洞。伊万刚把嘴雕好，就觉得有一股暖气拂过脸颊。他吓得往后一退，再仔细一看，那孩子竟在望着他。覆盆子一样红的嘴唇，还冲他笑了起来。"
        - id: ch01-b11
          speaker: ivan
          text: "这是怎么回事？是我疯了，还是这个雪娃娃中了魔法？"
          emotion: surprised
        - id: ch01-b12
          speaker: narrator
          text: "伊万连忙在胸前画了十字。雪娃娃却像真有了生命，低下头，动起小胳膊和小腿，跟雪地里的孩子一模一样。"
        - id: ch01-b13
          speaker: marie
          text: "伊万！上天终于赐给我们一个孩子了！"
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: "玛丽欢喜得浑身发颤，一把抱住雪花姑娘，亲个不停。那就是雪娃娃的名字。蓬松的雪从她身上一片片落下，像蛋壳剥离鸡蛋。等雪落尽，玛丽怀里已经是个小女孩了。"
        - id: ch01-b15
          speaker: marie
          text: "我心爱的雪花姑娘，快跟妈妈回家吧！"
          emotion: happy
    - id: ch02
      title: "春天来了"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "雪花姑娘长得飞快。别说一天一个样，几乎每过一个钟头，她都会有变化，而且一天比一天美。老两口欢喜得不知如何是好，满心都是这个孩子，再也想不起别的事。"
        - id: ch02-b02
          speaker: narrator
          text: "村里的孩子总挤在小屋里陪她玩。为了逗她开心，世上简直没有什么事是大家不肯做的。他们把雪花姑娘当作自己的洋娃娃，不停给她想新式样的衣裳，教她一首又一首歌，还陪她玩各种游戏。她聪明极了，什么都会留心，凡事一看就懂，功课一学就会。谁见了都会以为她至少十三岁。"
        - id: ch02-b03
          speaker: narrator
          text: "她不光聪明，还乖巧听话，模样也漂亮。肌肤像雪一样白，眼睛像勿忘草一样蓝，一头金色长发闪闪发亮。只有双颊没有半点红晕，跟额头一样白净。"
        - id: ch02-b04
          speaker: narrator
          text: "冬天渐渐过去。春日的太阳越升越高，大地暖了，田野里的草也绿了。云雀在高空歌唱，村里的姑娘们围成圆圈，边跳边唱。"
        - id: ch02-b05
          speakers: [village_girl_1, village_girl_2, village_girl_3]
          ensemble: chorus
          text: "美丽的春天，你怎么来到这里？你怎么来到这里？是坐着犁来的，还是乘着耙来的？"
        - id: ch02-b06
          speaker: narrator
          text: "只有雪花姑娘静静坐在小屋的窗边。"
        - id: ch02-b07
          speaker: marie
          text: "好孩子，你怎么这么难过？是生病了吗？还是她们欺负你了？"
        - id: ch02-b08
          speaker: snowflake
          text: "没有，妈妈，什么事也没有。谁都没伤害我，我好好的。"
        - id: ch02-b09
          speaker: narrator
          text: "春日的阳光把篱笆下最后一点藏雪也赶走了。田野开满鲜花，夜莺在树上唱个不停，整个世界都喜气洋洋。可鸟儿唱得越欢，花儿开得越盛，雪花姑娘就越忧伤。"
        - id: ch02-b10
          speaker: narrator
          text: "她不再和伙伴们一起玩，总是躲开大家，独自蜷缩到最浓的阴影里，就像一朵藏在叶丛中的百合。她唯一喜欢的事，就是躺在闪亮的小溪旁、青翠的柳树间。也只有到了黎明和黄昏，她才显得快活。"
        - id: ch02-b11
          speaker: narrator
          text: "暴风雨袭来，冰雹把大地铺得雪白时，她又变回从前那个明朗欢欣的雪花姑娘。可乌云一散，冰雹在阳光下融化，她便放声哭泣，像姐姐在哀悼死去的弟弟。"
    - id: ch03
      title: "仲夏节前夜"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "春天过去，圣约翰节，也就是仲夏节的前夜到了。这是一年中最盛大的节日，年轻姑娘们都要去树林里跳舞、游戏。她们来到伊万的小屋，要接走雪花姑娘。"
        - id: ch03-b02
          speakers: [village_girl_1, village_girl_2, village_girl_3]
          ensemble: chorus
          text: "让雪花姑娘跟我们一起去跳舞吧！"
        - id: ch03-b03
          speaker: narrator
          text: "玛丽说不清为什么，心里就是害怕，舍不得让孩子去。雪花姑娘自己也不想去，可母女俩都找不到推辞的理由。玛丽只好吻了吻她。"
        - id: ch03-b04
          speaker: marie
          text: "去吧，我的雪花姑娘，跟朋友们好好玩。姑娘们，请你们照看好她。她可是我的心头宝。"
        - id: ch03-b05
          speakers: [village_girl_1, village_girl_2, village_girl_3]
          ensemble: chorus
          text: "放心吧，我们一定会照看好她！"
          emotion: happy
        - id: ch03-b06
          speaker: narrator
          text: "姑娘们欢欢喜喜地跑进树林。到了那里，她们戴上花环，采来一束束鲜花，又唱起一支接一支的歌，有的哀伤，有的欢快。无论大家做什么，雪花姑娘也一声不响地跟着做。"
        - id: ch03-b07
          speaker: narrator
          text: "太阳落山以后，姑娘们点燃一堆干草，排成一队。雪花姑娘站在最后面。"
        - id: ch03-b08
          speakers: [village_girl_1, village_girl_2, village_girl_3]
          ensemble: chorus
          text: "看着我们，照我们的样子跑！"
        - id: ch03-b09
          speaker: narrator
          text: "姑娘们唱着歌，一个接一个跳过火堆。"
    - id: ch04
      title: "一缕薄雾"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "忽然，她们听见身后近处传来一声叹息，接着又是一声呻吟。姑娘们惊叫起来。"
        - id: ch04-b02
          speaker: narrator
          text: "姑娘们急忙转身，互相看了看，身后却什么也没有。她们不放心，又仔仔细细看了一遍，这才发现雪花姑娘不见了。大家猜她一定是故意躲起来逗人玩，便在四周分头寻找。"
        - id: ch04-b03
          speakers: [village_girl_1, village_girl_2, village_girl_3]
          ensemble: chorus
          text: "雪花姑娘，你在哪里？快出来呀！"
        - id: ch04-b04
          speaker: narrator
          text: "没有人回答。"
        - id: ch04-b05
          speaker: village_girl_1
          text: "她会去哪儿呢？一定是先回家了。"
        - id: ch04-b06
          speaker: narrator
          text: "姑娘们赶回村里，可雪花姑娘并没有回家。接下来的好几天，大家到处寻找，远的地方找了，近的地方也找了。每一丛灌木、每一道篱笆都查看过，还是没有雪花姑娘的踪影。"
        - id: ch04-b07
          speaker: narrator
          text: "后来，所有人都不再抱希望了。可过了很久很久，伊万和玛丽仍旧在树林里徘徊，一边走，一边不停地呼唤她。"
        - id: ch04-b08
          speakers: [ivan, marie]
          ensemble: duo
          text: "雪花姑娘，我的小鸽子，回来吧，回来吧！"
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: "有时，他们以为远处传来了回应，可那从来不是雪花姑娘的声音。她究竟去了哪里？是凶猛的野兽抓住她，把她拖进森林深处的巢穴了吗？还是一只大鸟把她带走，飞过了辽阔的蓝色海洋？"
        - id: ch04-b10
          speaker: narrator
          text: "都不是。没有野兽碰过她，也没有鸟儿把她带走。"
        - id: ch04-b11
          speaker: narrator
          text: "她跟着朋友们奔跑时，火焰喷出的第一口热气刚掠过身子，雪花姑娘就融化了。最后留下的，只有一缕轻柔的薄雾，缓缓飘向天空。"
