        delivery: curious and conversational
        timbre: clear and natural
        pace: steady
        pitch: medium
    snowflake:
      display_name: Snowflake
      tts:
        delivery: gentle, obedient, and quietly wistful
        timbre: light and youthful
        pace: soft and measured
        pitch: medium-high
    village_girl_1:
      display_name: First Village Girl
      tts:
        delivery: friendly and lively
        timbre: bright and youthful
        pace: quick
        pitch: medium-high
    village_girl_2:
      display_name: Second Village Girl
      tts:
        delivery: cheerful and encouraging
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    village_girl_3:
      display_name: Third Village Girl
      tts:
        delivery: playful and warm
        timbre: light and youthful
        pace: lively
