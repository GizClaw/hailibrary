  chapters:
    - id: ch01
      title: A Child of Snow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a peasant named Ivan, who lived with his wife, Marie. They might have been perfectly happy, except that they had no children of their own. Now they were growing old, and watching the neighbors' children at play could not fill the empty place in their hearts.
        - id: ch01-b02
          speaker: narrator
          text: Then came a winter no one who lived through it would ever forget. Snow fell so deep that it reached the knees of the tallest man. At last the storm ended and the sun shone again. The village children hurried into the street, while Ivan and Marie watched them from their window.
        - id: ch01-b03
          speaker: narrator
          text: The children packed the snow into a firm little terrace and began building a snow woman. As the old couple looked on, each was lost in thought. All at once, Ivan's face lit up.
        - id: ch01-b04
          speaker: ivan
          text: Wife, why don't we make a snow woman too?
        - id: ch01-b05
          speaker: marie
          text: Why not? It might cheer us up. But let's not make a woman. Let's make a little child out of snow and pretend the child is alive.
        - id: ch01-b06
          speaker: ivan
          text: Yes. Let's do it.
        - id: ch01-b07
          speaker: narrator
          text: Ivan took down his cap, and he and Marie went into the garden. They worked with all their strength, shaping a little body, two small hands, and two small feet. Then they set a round ball of snow on top for the head.
        - id: ch01-b08
          speaker: passerby
          text: What in the world are you making there?
        - id: ch01-b09
          speaker: ivan
          text: Can't you tell?
        - id: ch01-b10
          speaker: marie
          text: We're making a child out of snow.
        - id: ch01-b11
          speaker: narrator
          text: They formed the nose and chin, leaving two little hollows for the eyes. Ivan carefully shaped the mouth. The moment he finished, warm breath touched his cheek. He sprang back and stared. The child's eyes were looking straight into his, and her lips, red as raspberries, smiled at him.
        - id: ch01-b12
          speaker: ivan
          text: What is happening? Have I lost my senses, or has this snow child been bewitched?
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: The snow child bowed her head as though she were truly alive. She moved her little arms and legs in the snow, just as the living children did.
        - id: ch01-b14
          speaker: marie
          text: Oh, Ivan! Heaven has finally sent us a child!
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: Trembling with joy, Marie threw her arms around Snowflake, for that was the child's name, and covered her with kisses. Loose snow fell away from Snowflake like a shell slipping from an egg. There in Marie's arms was a little girl.
        - id: ch01-b16
          speaker: marie
          text: Oh, my darling Snowflake!
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: And Marie led her into the cottage.
    - id: ch02
      title: Snowflake in Winter
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Snowflake grew with astonishing speed. Every hour brought a change, and each day she became more beautiful. Ivan and Marie could hardly contain their happiness. They thought of nothing but their new daughter.
        - id: ch02-b02
          speaker: narrator
          text: The cottage was always crowded with village children. They loved to entertain Snowflake, and they would have done anything to please her. She was their precious doll. They kept making new dresses for her, teaching her songs, and drawing her into their games.
        - id: ch02-b03
          speaker: narrator
          text: Snowflake was wonderfully clever. She noticed everything and learned any lesson in a moment. Anyone might have thought she was at least thirteen. She was good and obedient too, and very pretty. Her skin was white as snow. Her eyes were blue as forget-me-nots, and her long hair was golden. Only her cheeks had no color. They were as pale as her forehead.
        - id: ch02-b04
          speaker: narrator
          text: So the winter days went by.
    - id: ch03
      title: When Spring Came
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last, the spring sun climbed higher and began to warm the earth. Green grass rose in the fields, and larks sang high overhead. The village girls joined hands and danced in a ring.
        - id: ch03-b02
          speakers: [village_girl_1, village_girl_2, village_girl_3, village_girl_4]
          ensemble: chorus
          text: Beautiful spring, how did you come here? Did a plow bring you, or did you ride upon a harrow?
        - id: ch03-b03
          speaker: narrator
          text: But Snowflake stayed perfectly still beside the cottage window.
        - id: ch03-b04
          speaker: marie
          text: What is wrong, dear child? Why are you so unhappy? Are you sick? Has anyone been unkind to you?
        - id: ch03-b05
          speaker: snowflake
          text: No, Mother. Nothing is wrong. No one has hurt me, and I am well.
        - id: ch03-b06
          speaker: narrator
          text: The spring sun found the last patches of snow beneath the hedges and melted them away. Flowers filled the fields, nightingales sang among the trees, and the whole world seemed joyful. Yet the brighter the birds and flowers became, the sadder Snowflake grew.
        - id: ch03-b07
          speaker: narrator
          text: She hid from her playmates and curled up in the deepest shadows, like a lily sheltered by its leaves. Her only pleasure was to lie among the green willows beside a sparkling stream. She seemed happy only at dawn and twilight.
        - id: ch03-b08
          speaker: narrator
          text: One day a great storm swept over the village and covered the ground with white hail. At once Snowflake became as bright and joyful as she had been in winter. But the clouds moved on. The sun melted the hail, and Snowflake burst into tears. She wept as a sister might weep for her brother.
    - id: ch04
      title: Midsummer Eve
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Spring passed, and the eve of St. John arrived. It was Midsummer Eve, the greatest holiday of the year, when the young girls gathered in the woods to dance and play. They came to the cottage to fetch Snowflake.
        - id: ch04-b02
          speakers: [village_girl_1, village_girl_2, village_girl_3, village_girl_4]
          ensemble: chorus
          text: Please let Snowflake come dance with us.
        - id: ch04-b03
          speaker: narrator
          text: Marie was afraid, though she could not explain why. She could hardly bear to let the child go. Snowflake did not want to go either, but neither of them could think of an excuse. At last Marie kissed her.
        - id: ch04-b04
          speaker: marie
          text: Go with your friends, my Snowflake, and try to be happy. Girls, please watch over her. You know she is the light of my eyes.
        - id: ch04-b05
          speakers: [village_girl_1, village_girl_2, village_girl_3, village_girl_4]
          ensemble: chorus
          text: Oh, we will take good care of her!
          emotion: happy
        - id: ch04-b06
          speaker: narrator
          text: The girls ran away to the woods. They wove wreaths, gathered bunches of flowers, and sang both merry songs and sad ones. Whatever the others did, Snowflake did too.
        - id: ch04-b07
          speaker: narrator
          text: When the sun went down, they made a fire from dry grass and stood in a line. Snowflake took the last place.
        - id: ch04-b08
          speakers: [village_girl_1, village_girl_2, village_girl_3, village_girl_4]
          ensemble: chorus
          text: Watch us closely, Snowflake, then run and jump the way we do.
        - id: ch04-b09
          speaker: narrator
          text: They began to sing. One after another, the girls leaped across the fire. Snowflake followed behind them.
    - id: ch05
      title: The Little Haze
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Suddenly the girls heard a sigh close behind them, and then a groan.
        - id: ch05-b02
          speakers: [village_girl_1, village_girl_2, village_girl_3, village_girl_4]
          ensemble: chorus
          text: Ah!
          emotion: surprised
        - id: ch05-b03
          speaker: narrator
          text: They spun around and stared at one another. There was nothing there. They looked once more. Where was Snowflake? Perhaps she had hidden herself as a joke. They searched everywhere.
        - id: ch05-b04
          speakers: [village_girl_1, village_girl_2, village_girl_3, village_girl_4]
          ensemble: chorus
          text: Snowflake! Snowflake!
        - id: ch05-b05
          speaker: narrator
          text: No one answered.
        - id: ch05-b06
          speaker: village_girl_1
          text: Where could she be? She must have gone home.
        - id: ch05-b07
          speaker: narrator
          text: The girls returned to the village, but Snowflake was not there.
        - id: ch05-b08
          speaker: narrator
          text: For days they searched high and low. They looked beneath every bush and along every hedge, but found no sign of her. Long after everyone else had abandoned hope, Ivan and Marie still wandered through the woods calling for their child.
        - id: ch05-b09
          speakers: [ivan, marie]
          ensemble: duo
          text: Snowflake, our dove, come back! Please come back!
          emotion: sad
        - id: ch05-b10
          speaker: narrator
          text: Sometimes they thought a voice called back to them. But it was never Snowflake's voice.
        - id: ch05-b11
          speaker: narrator
          text: So what had happened to her? Had a fierce wild animal caught her and dragged her into its den? Had some great bird carried her away across the wide blue sea?
        - id: ch05-b12
          speaker: narrator
          text: No. No animal had touched her, and no bird had carried her away.
        - id: ch05-b13
          speaker: narrator
          text: When Snowflake ran after her friends and the first breath of flame swept over her, she melted away. All that remained of her was a little soft haze, floating upward into the air.
