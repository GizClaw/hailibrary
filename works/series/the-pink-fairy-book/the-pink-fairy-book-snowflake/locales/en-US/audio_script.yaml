        delivery: kindly, plainspoken, and easily amazed
        timbre: mature and rustic
        pace: unhurried
        pitch: medium-low
    marie:
      display_name: Marie
      tts:
        delivery: tender, motherly, and openly emotional
        timbre: warm and mature
        pace: measured
        pitch: medium
