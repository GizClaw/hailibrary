audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and mellow
        pace: measured
        pitch: medium
    mother_dove:
      display_name: Mother Dove
      tts:
        delivery: tender, anxious, and brave when pressed
        timbre: soft and airy
        pace: measured
        pitch: medium-high
    jackal:
      display_name: Jackal
      tts:
        delivery: sly, threatening, and smoothly deceptive
        timbre: lean and rough-edged
        pace: steady
        pitch: medium-low
    heron:
      display_name: Heron
      tts:
        delivery: thoughtful, cautious, and pleading under threat
        timbre: clear and reedy
        pace: unhurried
        pitch: medium
    panther:
      display_name: Panther
      tts:
        delivery: trusting at first, then urgent and fierce
        timbre: deep and strong
        pace: steady
        pitch: low
    baboon:
      display_name: Baboon
      tts:
        delivery: curious, bold, and sharply mocking
        timbre: brisk and gravelly
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: The Nest on the Rock
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A dove once made a soft, comfortable nest as a home for her three little ones. She was very proud of their beauty. In fact, she talked about them to her neighbors rather more than she needed to. Before long, everyone for miles around knew exactly where to find the three prettiest baby doves in the whole countryside.
        - id: ch01-b02
          speaker: narrator
          text: One day, a jackal was prowling about in search of dinner. By chance, he came to the foot of the rock where the dove had hidden her nest. He suddenly thought that if he could find nothing better to eat, he might at least make a mouthful of one young dove. So he raised his voice and shouted as loudly as he could.
        - id: ch01-b03
          speaker: jackal
          text: Ho there, Mother Dove!
        - id: ch01-b04
          speaker: mother_dove
          text: What do you want, sir?
          emotion: fearful
        - id: ch01-b05
          speaker: jackal
          text: Give me one of your children. If you refuse, I will eat you and the other two as well.
        - id: ch01-b06
          speaker: narrator
          text: The jackal's words nearly drove the mother dove out of her mind. She did not know how to save her children. At last, she decided that the only way to keep the other two alive was to give him one. She threw a little dove from the nest. The jackal ate it up, then went home and fell asleep.
        - id: ch01-b07
          speaker: narrator
          text: The mother sat on the edge of her nest and wept bitterly. A heron flying slowly past the rock felt sorry for her and stopped.
        - id: ch01-b08
          speaker: heron
          text: What has happened, poor Mother Dove?
        - id: ch01-b09
          speaker: mother_dove
          text: A jackal demanded one of my little ones. He said that if I refused, he would leap onto the nest and eat us all.
          emotion: sad
        - id: ch01-b10
          speaker: heron
          text: You should never have believed him. He cannot jump this high. He only tricked you because he wanted his supper.
        - id: ch01-b11
          speaker: narrator
          text: With that, the heron flew away.
        - id: ch01-b12
          speaker: narrator
          text: He had scarcely vanished when the jackal crept around the foot of the rock again. He called to the dove a second time.
        - id: ch01-b13
          speaker: jackal
          text: Ho there, Mother Dove! Hand down one of your little ones, or I will leap up and eat every one of you.
        - id: ch01-b14
          speaker: mother_dove
          text: No, I will do nothing of the kind!
        - id: ch01-b15
          speaker: narrator
          text: Her heart still beat wildly when she saw the jackal crouch and prepare to spring. He tried to leap up the rock, but he could not reach the nest. All he managed to do was cut himself against the stone. He decided that he had better forget about jumping and go back to threats, so he began his old cry once more.
        - id: ch01-b16
          speaker: jackal
          text: Mother Dove, be quick! Give me one of your young, or I will eat all of you!
        - id: ch01-b17
          speaker: mother_dove
          text: I still refuse. Now I know that we are safely beyond your reach.
        - id: ch01-b18
          speaker: narrator
          text: The jackal saw that he had no hope of getting what he wanted.
        - id: ch01-b19
          speaker: jackal
          text: Tell me, Mother Dove. How did you suddenly grow so wise?
        - id: ch01-b20
          speaker: mother_dove
          text: The heron told me.
        - id: ch01-b21
          speaker: jackal
          text: Which way did he go?
        - id: ch01-b22
          speaker: mother_dove
          text: Down among the reeds. Look, and you can see him.
        - id: ch01-b23
          speaker: narrator
          text: The jackal nodded goodbye and hurried after the heron.
    - id: ch02
      title: The Heron's Mistake
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: He soon caught up with the great bird, who stood on a stone beside the river watching for a nice fat fish.
        - id: ch02-b02
          speaker: jackal
          text: Tell me, Heron. When the wind blows from that direction, which way do you turn?
        - id: ch02-b03
          speaker: heron
          text: Which way do you turn?
        - id: ch02-b04
          speaker: jackal
          text: I always turn this way.
        - id: ch02-b05
          speaker: heron
          text: Then I turn that way too.
        - id: ch02-b06
          speaker: jackal
          text: And when rain comes from that direction, which way do you turn?
        - id: ch02-b07
          speaker: heron
          text: Which way do you turn then?
        - id: ch02-b08
          speaker: jackal
          text: Oh, I always face this way.
        - id: ch02-b09
          speaker: heron
          text: That is the way I face as well.
        - id: ch02-b10
          speaker: jackal
          text: What do you do when the rain falls straight down?
        - id: ch02-b11
          speaker: heron
          text: What do you do yourself?
        - id: ch02-b12
          speaker: jackal
          text: I cover my head with my paws, like this.
        - id: ch02-b13
          speaker: heron
          text: Then I cover my head with my wings.
        - id: ch02-b14
          speaker: narrator
          text: As he spoke, the heron lifted his great wings and spread them until they covered his head completely. That was exactly what the jackal had been waiting for. In a single bound, he sprang at the heron, seized him by the neck, and began to shake him.
        - id: ch02-b15
          speaker: heron
          text: Please have pity! I have never harmed you!
          emotion: fearful
        - id: ch02-b16
          speaker: jackal
          text: You taught the dove how to defeat me. Now I am going to eat you for it.
          emotion: angry
        - id: ch02-b17
          speaker: heron
          text: Let me go, and I will show you where the panther has her den.
          emotion: fearful
        - id: ch02-b18
          speaker: jackal
          text: Then show me quickly.
        - id: ch02-b19
          speaker: narrator
          text: The jackal kept his teeth firmly around the heron's neck while the frightened bird showed him where the panther had her den. Only when the place had been clearly pointed out did the jackal loosen his grip.
        - id: ch02-b20
          speaker: jackal
          text: You may go now, my friend. There is plenty here for me to eat.
        - id: ch02-b21
          speaker: narrator
          text: The heron escaped, and the jackal went up to the panther.
    - id: ch03
      title: The Panther's Children
      blocks:
        - id: ch03-b01
          speaker: jackal
          text: Panther, would you like me to care for your children while you are hunting?
        - id: ch03-b02
          speaker: panther
          text: I would be very grateful. But take good care of them. They cry the whole time I am away.
        - id: ch03-b03
          speaker: narrator
          text: The panther trotted off. The jackal marched into the cave, found ten little panthers, and ate one at once. Later, their mother returned from the hunt.
        - id: ch03-b04
          speaker: panther
          text: Jackal, bring my little ones out for their supper.
        - id: ch03-b05
          speaker: narrator
          text: The jackal fetched the little panthers from the cave one at a time. Their mother watched as each cub came out. When he had shown her all nine, he quietly took the last one back inside and brought it out once more. That made it seem as if the whole ten were still there, and the panther went away completely satisfied.
        - id: ch03-b06
          speaker: narrator
          text: She went hunting again the next day. The jackal ate another little panther, leaving only eight. When she came home that evening, she called to him.
        - id: ch03-b07
          speaker: panther
          text: Jackal, bring out my little ones!
        - id: ch03-b08
          speaker: narrator
          text: Once again, the jackal led the cubs out one after another for their mother to see. Because only eight remained, he brought the final little panther out three separate times. His trick worked just as it had before. The mother counted ten appearances and believed that all ten of her children were safe.
        - id: ch03-b09
          speaker: narrator
          text: The same thing happened the following day. It happened again the next day, and the day after that. Each time the panther went hunting, the jackal ate another of her children and fooled her when she returned. At last, there was not even one little panther left. The jackal spent the rest of that day digging a large hole through the back of the den so he could escape.
        - id: ch03-b10
          speaker: narrator
          text: That night, the panther came home from hunting and gave her usual call.
        - id: ch03-b11
          speaker: panther
          text: Jackal, bring out my little ones.
        - id: ch03-b12
          speaker: jackal
          text: Bring out your little ones? You know as well as I do that you have eaten them all.
        - id: ch03-b13
          speaker: narrator
          text: The panther had no idea what he meant.
        - id: ch03-b14
          speaker: panther
          text: Jackal, bring me my children.
        - id: ch03-b15
          speaker: narrator
          text: No answer came. She entered the cave, but the jackal had crawled through his hole and escaped. Worse still, her little ones were gone too.
    - id: ch04
      title: The Jackal's School
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The panther had no intention of letting the jackal escape after what he had done. She set off at a trot to catch him. But he had already gained a good head start. He ran until he reached a place where a swarm of bees kept its honey deep in the cleft of a rock. Then the jackal stood still beside the cleft and waited for the panther to catch up.
        - id: ch04-b02
          speaker: panther
          text: Jackal, where are my little ones?
        - id: ch04-b03
          speaker: jackal
          text: They are up there. That is where I keep my school.
        - id: ch04-b04
          speaker: narrator
          text: The panther looked around but saw nothing.
        - id: ch04-b05
          speaker: panther
          text: Where are they? I cannot see them anywhere.
        - id: ch04-b06
          speaker: jackal
          text: Come a little closer. Then you will hear how beautifully they sing.
        - id: ch04-b07
          speaker: narrator
          text: The panther moved nearer to the cleft.
        - id: ch04-b08
          speaker: jackal
          text: Can you hear them now? They are inside there.
        - id: ch04-b09
          speaker: narrator
          text: While the panther listened for her children's song, the jackal slipped away.
    - id: ch05
      title: The Bees in the Rock
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The panther was still standing by the cleft when a baboon passed.
        - id: ch05-b02
          speaker: baboon
          text: What are you doing there, Panther?
        - id: ch05-b03
          speaker: panther
          text: I am listening to my children sing. The jackal keeps his school here.
        - id: ch05-b04
          speaker: narrator
          text: The baboon picked up a stick and poked it into the cleft.
        - id: ch05-b05
          speaker: baboon
          text: Well then, I would like to see these children of yours!
        - id: ch05-b06
          speaker: narrator
          text: The stick disturbed the bees inside. A huge swarm burst from the rock and flew furiously at the panther. They attacked her from every side, while the baboon quickly climbed up and out of their way. Safe above them, he perched on the branch of a tree and called down to her.
        - id: ch05-b07
          speaker: baboon
          text: I wish you joy of your children!
        - id: ch05-b08
          speaker: narrator
          text: From far away, the jackal called out.
        - id: ch05-b09
          speaker: jackal
          text: Sting her well! Do not let her escape!
        - id: ch05-b10
          speaker: narrator
          text: The panther galloped away as if she had gone mad, with the furious bees still after her. She raced to the nearest lake and flung herself into the water. Yet every time she raised her head above the surface, the bees attacked and stung her all over again. At last, the poor panther could bear it no longer and drowned in the lake.
