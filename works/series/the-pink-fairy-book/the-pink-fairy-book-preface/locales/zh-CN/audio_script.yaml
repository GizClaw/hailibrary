audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
  chapters:
    - id: ch01
      title: 人人都讲童话
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 世上每个民族都会给孩子讲童话。日本人讲，中国人讲，美洲原住民围着营火讲，爱斯基摩人住在阴暗又肮脏的冬屋里，也一样讲。
        - id: ch01-b02
          speaker: narrator
          text: 南非的卡菲尔人会讲，现代希腊人会讲，古埃及人也早就在讲。那时，摩西从芦苇丛中获救还没有多少年呢。
        - id: ch01-b03
          speaker: narrator
          text: 德国人、法国人、西班牙人、意大利人、丹麦人，还有苏格兰高地人，也都爱讲童话。说来也有趣，各地流传的故事常常很相像。
        - id: ch01-b04
          speaker: narrator
          text: 要是一个孩子读过《蓝色童话书》《红色童话书》和《黄色童话书》，再到《粉红色童话书》里仔细找找、互相比比，就会碰见一些老朋友，只是他们换了新面孔。
    - id: ch02
      title: 新故事与讲故事的人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 不过，日本的故事对小读者多半很陌生。像狸猫这种动物，他们从前也许根本没有遇见过。
        - id: ch02-b02
          speaker: narrator
          text: 读安徒生的故事时，他们还可能发现，安徒生不光要把故事讲得好听，也要从中讲出道理。他拿文明国家里人们的种种愚行开玩笑，正有这个用意。
        - id: ch02-b03
          speaker: narrator
          text: 丹麦故事《箱中的公主》有点像鬼故事，太胆小的孩子还是别听了。书里收下的已经是改过的版本，丹麦原文要吓人得多。可历史告诉我们，丹麦人原本并不胆小，也不容易受惊。我敢肯定，这个故事不是真的。
        - id: ch02-b04
          speaker: narrator
          text: 其余的丹麦故事和瑞典故事就不吓人了，它们由 W. A. 克雷吉先生翻译。西西里故事从德文转译，非洲故事经过法文，日本故事经过德文。加泰罗尼亚故事和一个古老的法国故事也在其中。这些都出自兰夫人的译笔。
        - id: ch02-b05
          speaker: narrator
          text: 阿尔玛·阿莱恩小姐依据德文，译出了安徒生的故事。福特先生还是像往常一样，为怪物、美人鱼、王子、巨人和美丽的公主们画了插图。编者觉得，这些公主简直比从前画过的还要漂亮。
    - id: ch03
      title: 童话里的真理
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这样一来，来自四面八方的奇思妙想就聚到了一起。黑人、白人和黄种人，原来都喜欢同一类奇遇。
        - id: ch03-b02
          speaker: narrator
          text: 勇气、青春、美貌和善良会遇到一次又一次考验，可最后总是它们取胜。女巫、巨人和那些冷酷又不友善的人，却总在失败的一边。
        - id: ch03-b03
          speaker: narrator
          text: 事情本来就该这样。总的说来，从前是这样，将来也会这样。童话要讲的道理，也不过如此。
        - id: ch03-b04
          speaker: narrator
          text: 可惜，我们不能人人都年轻、漂亮、强壮。但没有什么能拦着我们做一个善良的人。在世上这些最古老的寓言里，善良的男人和女人，善良的走兽和飞鸟，到头来总会得到好报。
        - id: ch03-b05
          speaker: narrator
          text: 童话里真正的真实，就只有这些，再多也没有了。
