audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    pupil:
      display_name: "徒弟"
      tts:
        delivery: "聪明自信，遇事机敏果断"
        timbre: "清亮的少年男声"
        pace: "轻快"
        pitch: "中高音"
    wizard:
      display_name: "巫师"
      tts:
        delivery: "戒备阴沉，追逼时冷酷强硬"
        timbre: "干涩低沉的成年男声"
        pace: "适中"
        pitch: "低音"
    girl:
      display_name: "姑娘"
      tts:
        delivery: "真诚坚定，带着安静的惊奇"
        timbre: "明亮清澈的年轻女声"
        pace: "平稳"
        pitch: "中高音"
  chapters:
    - id: ch01
      title: "藏在旧书里的本领"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有个男人的儿子十分聪明，书读得又快又好，而且一拿起来就舍不得放下。后来，少年离开家，到外面的世界寻找差事。走过几座土丘之间时，他迎面遇见一个男人。那人拦住他，问他要到哪里去。"
        - id: ch01-b02
          speaker: pupil
          text: "我正在四处找差事。"
        - id: ch01-b03
          speaker: wizard
          text: "那么，你愿意替我做事吗？"
        - id: ch01-b04
          speaker: pupil
          text: "当然愿意。替您做事，跟替谁做事都一样。"
        - id: ch01-b05
          speaker: wizard
          text: "不过，你会读书吗？"
        - id: ch01-b06
          speaker: pupil
          text: "当然会，我读得跟牧师一样好。"
        - id: ch01-b07
          speaker: wizard
          text: "那我可不能收你。我正要找个不识字的孩子，每天只用替我的旧书掸掸灰。"
        - id: ch01-b08
          speaker: narrator
          text: "那人说完便继续上路了。少年留在原地，望着他越走越远，越想越觉得可惜。"
        - id: ch01-b09
          speaker: pupil
          text: "唉，这份差事多适合我，怎么偏偏没拿到呢？"
        - id: ch01-b10
          speaker: narrator
          text: "少年决定再试一次。他躲到土丘后面，把外套脱下来，翻个里朝外重新穿好，这样就不容易被认出来了。随后，他沿着土丘背面飞跑，从另一头绕出去，再次迎上那个男人。"
        - id: ch01-b11
          speaker: wizard
          text: "小家伙，你这是要去哪儿？"
        - id: ch01-b12
          speaker: narrator
          text: "那人果然没有认出他。"
        - id: ch01-b13
          speaker: pupil
          text: "我想找一份替人做事的差事。"
        - id: ch01-b14
          speaker: wizard
          text: "你肯来替我做事吗？"
        - id: ch01-b15
          speaker: pupil
          text: "我很乐意。替您做，跟替别人做没有两样。"
        - id: ch01-b16
          speaker: wizard
          text: "可你认得字吗？"
        - id: ch01-b17
          speaker: pupil
          text: "不认得，我连一个字母都不认识。"
        - id: ch01-b18
          speaker: narrator
          text: "这一次，那人收下了少年。他的活儿果然只有一样，就是替主人掸去书上的灰尘。可他边打扫边偷读，一本接一本，最后竟跟主人一样有智慧。原来主人是个大巫师，旧书里藏着各种魔法。少年全学到了手，想变成哪一种动物就变成哪一种，甚至别的东西也难不住他。"
    - id: ch02
      title: "集市上的骏马"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "少年学会了全部魔法，觉得再留下去也没什么可学，便从巫师那里逃走，回到了父母身边。没过多久，邻村正好要赶集。他告诉母亲，自己如今想变成什么动物都可以。"
        - id: ch02-b02
          speaker: pupil
          text: "这次我变成一匹马，让父亲牵到集市上卖掉。您别怕，卖完以后，我会平平安安地回家。"
        - id: ch02-b03
          speaker: narrator
          text: "母亲听见这个计划，心里很怕。少年却告诉她，不会出事。说完，他真的变成了一匹神气非凡的马。父亲把马牵到集市，卖出了很高的价钱。等买卖说定，钱也交清，少年趁没人留意，悄悄恢复人形，自己走回了家。"
        - id: ch02-b04
          speaker: narrator
          text: "消息很快传遍全国。人们到处都在谈论那匹高价卖掉、后来又凭空消失的骏马。最后，这件事也传到了巫师耳朵里。"
        - id: ch02-b05
          speaker: wizard
          text: "哈，原来是那个骗了我又逃走的小子！等着吧，我早晚会把他抓回来。"
        - id: ch02-b06
          speaker: narrator
          text: "又一个集日到了。少年再次变成马，让父亲牵去出售。没过多久，便有一个买主付钱买下了他。买主和父亲进屋喝成交酒时，巫师正巧来到集市，也看见了这匹马。他一眼就知道，这绝不是普通牲口。"
        - id: ch02-b07
          speaker: narrator
          text: "巫师跟进屋里，开出了比买主刚才所付高得多的价钱。买主立刻答应，把马转手卖给了他。少年就这样落进了旧主人手里。"
    - id: ch03
      title: "最后一次变化"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "巫师买到马，第一件事就是把它牵到铁匠那里。他要让铁匠把一枚烧得通红的钉子钉进马嘴。只要钉子落下，少年就再也不能变化了。马看清巫师的打算，立刻化作一只鸽子，冲上天空。巫师也马上变成鹰，紧追在后。"
        - id: ch03-b02
          speaker: narrator
          text: "鸽子眼看摆脱不了鹰，忽然又变成一枚金戒指，从空中直落下来，恰好掉进一个姑娘怀里。追来的鹰随即落地，恢复成男人。他拿出一大笔钱，想从姑娘手里买走戒指。"
        - id: ch03-b03
          speaker: girl
          text: "我不能把戒指卖给你。它像是从天上特意落到我这里的，我要留下它。"
        - id: ch03-b04
          speaker: narrator
          text: "巫师不肯罢休，把价钱越抬越高。金戒指听着他不断加价，渐渐害怕起来，又一次改变了形状。这回，它成了一粒大麦，从姑娘怀里落到地上。巫师见了，立刻化作一只母鸡，低头在地上四处寻找。"
        - id: ch03-b05
          speaker: narrator
          text: "可那粒大麦又变了。眨眼之间，一只艾鼬扑到母鸡身上，一口咬断了它的脖子。巫师死了。艾鼬这才恢复成少年的模样。后来，少年娶了那位不肯交出戒指的姑娘。从那一天起，他把所有魔法都放下，再也没有施展过。"
