audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and mellow
        pace: measured
        pitch: medium
    pupil:
      display_name: Pupil
      tts:
        delivery: clever, confident, and quick-thinking
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    wizard:
      display_name: Wizard
      tts:
        delivery: guarded, cunning, and commanding
        timbre: dark and dry
        pace: measured
        pitch: low
    girl:
      display_name: Girl
      tts:
        delivery: firm, sincere, and quietly wondering
        timbre: bright and clear
        pace: steady
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Place Among the Books
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man whose son was a remarkably clever reader. The boy loved books, but he needed work, so he set off into the world to find a place in someone's service. As he walked between a line of mounds, he met a man coming the other way.
        - id: ch01-b02
          speaker: wizard
          text: Where are you headed?
        - id: ch01-b03
          speaker: pupil
          text: I'm looking for someone who will take me into service.
        - id: ch01-b04
          speaker: wizard
          text: Would you work for me?
        - id: ch01-b05
          speaker: pupil
          text: Oh, yes. I'd serve you as willingly as anyone.
        - id: ch01-b06
          speaker: wizard
          text: Can you read?
        - id: ch01-b07
          speaker: pupil
          text: I can read as well as the priest can.
        - id: ch01-b08
          speaker: wizard
          text: Then you're no use to me. I need a boy who cannot read. All he would have to do is dust my old books.
        - id: ch01-b09
          speaker: narrator
          text: The man continued on his way, leaving the boy behind.
        - id: ch01-b10
          speaker: pupil
          text: What a shame I lost that place. Dusting books would suit me perfectly.
        - id: ch01-b11
          speaker: narrator
          text: He decided he would get the position if he could. He slipped behind one of the mounds and turned his jacket inside out, hoping the man would not recognize him. Then he hurried along behind the mounds and came out to meet him at the far end.
        - id: ch01-b12
          speaker: wizard
          text: And where might you be going, little boy?
        - id: ch01-b13
          speaker: narrator
          text: The man did not realize this was the same boy.
        - id: ch01-b14
          speaker: pupil
          text: I'm out looking for a place in someone's service.
        - id: ch01-b15
          speaker: wizard
          text: Will you work for me?
        - id: ch01-b16
          speaker: pupil
          text: Gladly. I'd serve you as soon as anyone else.
        - id: ch01-b17
          speaker: wizard
          text: But do you know how to read?
        - id: ch01-b18
          speaker: pupil
          text: No. I don't know even one letter.
        - id: ch01-b19
          speaker: narrator
          text: So the man hired him. His only task was to dust his master's books. That left him plenty of time to read them too. He kept reading until he became every bit as wise as his master, who was a powerful wizard. The boy learned all kinds of magic. He could even take the shape of any animal, or anything else he chose.
    - id: ch02
      title: The Horse at Market
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Once he had learned everything, the boy saw no reason to stay. He ran away and returned to his parents. Before long, there was to be a market in the next village. The boy told his mother what the wizard's books had taught him.
        - id: ch02-b02
          speaker: pupil
          text: I can change into any animal I please. This time I'll become a horse, and Father can sell me at the market. Don't worry. I'll come home safely afterward.
        - id: ch02-b03
          speaker: narrator
          text: His mother was frightened by the plan, but he told her there was nothing to fear and that all would be well. Then he became a horse. He was such a splendid animal that his father sold him for a high price. Once the bargain was settled and the money paid, the horse waited until no one was watching. Then he took his own shape again and went home.
        - id: ch02-b04
          speaker: narrator
          text: Word traveled across the country about the magnificent horse that had been sold and then vanished. At last, the tale reached the wizard.
        - id: ch02-b05
          speaker: wizard
          text: Aha! That must be my boy, the one who tricked me and ran away. I'll catch him yet.
    - id: ch03
      title: The Wizard Buys the Horse
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the next market day came, the boy became a horse once more, and his father led him away to be sold. A buyer soon took the horse. While the buyer and the father went indoors to drink the luck-penny together, the wizard appeared. One look told him that this was no ordinary horse.
        - id: ch03-b02
          speaker: narrator
          text: The wizard followed the buyer inside and offered him far more than he had just paid. The buyer accepted, and the horse now belonged to the wizard.
        - id: ch03-b03
          speaker: narrator
          text: The wizard's first move was to lead the horse to a smith. He meant to have a red-hot nail driven into its mouth. Once that was done, the boy would never be able to change his shape again.
    - id: ch04
      title: The Chase of Many Shapes
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The horse saw what was about to happen. At once, it became a dove and flew high into the air. The wizard changed into a hawk and swept up after it.
        - id: ch04-b02
          speaker: narrator
          text: The dove turned into a gold ring and dropped into a girl's lap. The hawk came down and took the shape of a man again.
        - id: ch04-b03
          speaker: wizard
          text: I'll give you a great deal of money for that gold ring.
        - id: ch04-b04
          speaker: girl
          text: No, I won't give it up. It fell into my lap as if it came straight from Heaven.
        - id: ch04-b05
          speaker: narrator
          text: The wizard would not stop. He offered more and more money, until the gold ring itself grew afraid. Suddenly it became a single grain of barley and fell to the ground.
        - id: ch04-b06
          speaker: narrator
          text: The wizard changed into a hen and began hunting for the grain. But the grain became a polecat. With one snap, the polecat took off the hen's head.
    - id: ch05
      title: The End of the Magic
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The wizard was dead. The polecat took human shape, and the young man later married the girl.
        - id: ch05-b02
          speaker: narrator
          text: From that time on, he left all his magic arts alone.
