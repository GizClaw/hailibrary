  chapters:
    - id: ch01
      title: The Sunday Wager
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Three houses once stood side by side. A tailor lived in the first, a carpenter in the second, and a smith in the third. Each man had a wife, and the three wives were the best of friends. They often talked about how foolish their husbands were. What they could never settle was which husband was the greatest fool, because each wife insisted that hers deserved the honor.
        - id: ch01-b02
          speaker: narrator
          text: Every Sunday, the women walked to church together and filled the road with gossip. On the way home, they always stopped at the tavern for half a pint of brandy. In those days it cost threepence, so each woman paid one penny.
        - id: ch01-b03
          speaker: narrator
          text: Then the price went up. The taverner told them that half a pint would now cost fourpence. This annoyed them greatly. There were only three women to share the cost, and not one of them would pay the extra penny.
        - id: ch01-b04
          speaker: narrator
          text: As they walked home from church that day, they made a wager. Each wife would play a trick on her husband before the next Sunday. Whoever fooled her husband most completely would drink for free from then on. The other two would each pay twopence for the Sunday brandy.
    - id: ch02
      title: The Watchdog
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The very next day, the tailor's wife began her trick.
        - id: ch02-b02
          speaker: tailor_wife
          text: Some girls are coming today to help me card all this wool. We have a great deal to finish, so everyone must work hard. But our watchdog is dead, and that worries me. This evening, the young fellows will come around to joke with the girls, and then no work will get done. A fierce watchdog would keep them away.
        - id: ch02-b03
          speaker: tailor
          text: Yes, a fierce dog would be very useful.
        - id: ch02-b04
          speaker: tailor_wife
          text: Then listen, my good man. You can be the watchdog yourself and frighten those fellows away from the house.
        - id: ch02-b05
          speaker: narrator
          text: The tailor was not at all sure about that. Usually, though, he gave in to whatever his wife wanted.
        - id: ch02-b06
          speaker: tailor_wife
          text: Oh, come now. You will see. It will work perfectly.
        - id: ch02-b07
          speaker: narrator
          text: Near evening, she dressed him in a shaggy fur coat. She wrapped a black woolen cloth around his head and chained him beside the empty dog kennel. There the tailor stood, barking and growling at everyone who came near. The other two wives knew exactly what was happening, and the sight amused them greatly.
    - id: ch03
      title: The Carpenter's Funeral
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The day after that, the carpenter came home from work in a cheerful mood. The instant he stepped inside, his wife clapped her hands together and cried out.
        - id: ch03-b02
          speaker: carpenter_wife
          text: My dear, why do you look like that? You must be ill!
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: The carpenter had not felt ill at all. He had only felt hungry. So he sat at the table and began to eat his dinner.
        - id: ch03-b04
          speaker: narrator
          text: His wife sat directly across from him. She folded her hands, shook her head, and watched him with an anxious face.
        - id: ch03-b05
          speaker: carpenter_wife
          text: You are getting worse, my dear. Look how pale you are now! This is a serious illness. I can tell just by looking at you.
        - id: ch03-b06
          speaker: narrator
          text: Now the carpenter began to worry. Perhaps, he thought, he really was not quite well.
        - id: ch03-b07
          speaker: carpenter_wife
          text: No, this will never do. You should have been in bed already.
        - id: ch03-b08
          speaker: narrator
          text: She persuaded him to lie down, then piled every bedcover she could find on top of him. She gave him one medicine after another. All the while, the carpenter felt worse and worse.
        - id: ch03-b09
          speaker: carpenter_wife
          text: You will never recover from this. I am afraid you are going to die.
          emotion: fearful
        - id: ch03-b10
          speaker: carpenter
          text: Do you truly think so? I can easily believe it. I feel terribly sick now.
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: A little while passed. Then his wife spoke again.
        - id: ch03-b12
          speaker: carpenter_wife
          text: Ah, now I must say goodbye to you. Death is here. I must close your eyes.
        - id: ch03-b13
          speaker: narrator
          text: She shut his eyes. The carpenter had believed every word his wife told him, so now he believed he was dead. He lay perfectly still and let her do whatever she wished.
        - id: ch03-b14
          speaker: narrator
          text: She called in her neighbors, and together they laid him in a coffin he had made himself. His wife had bored air holes in it. She made him a soft bed, drew a coverlet over him, and folded his hands across his chest. But she did not place a flower or a psalm book in those hands. She gave him a pint bottle of brandy instead.
        - id: ch03-b15
          speaker: narrator
          text: After lying there for a while, the carpenter took a small drink. Then he took another, and another. The brandy seemed to do him good. Before long he was sleeping sweetly and dreaming that he was in heaven.
        - id: ch03-b16
          speaker: narrator
          text: Meanwhile, the news traveled through the whole village. The carpenter was dead, people said, and he would be buried the next day.
    - id: ch04
      title: The Black Figure
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Now it was the smith's wife's turn. Her husband was asleep after a drinking bout. She took off all his clothes, blackened him from head to foot until he looked like coal, and left him sleeping until late in the day.
        - id: ch04-b02
          speaker: narrator
          text: By then, the funeral party had gathered at the carpenter's house. They lifted the coffin and set off toward the church. Only after they had gone did the smith's wife rush in to wake her husband.
        - id: ch04-b03
          speaker: smith_wife
          text: Good gracious, are you still lying there? You have slept far too long. You know you are supposed to attend the funeral.
        - id: ch04-b04
          speaker: narrator
          text: The smith was completely confused. He knew nothing about a funeral.
        - id: ch04-b05
          speaker: smith_wife
          text: It is our neighbor, the carpenter. They are burying him today, and the funeral party is halfway to the church already.
        - id: ch04-b06
          speaker: smith
          text: All right, then. Hurry and help me put on my black clothes.
        - id: ch04-b07
          speaker: smith_wife
          text: What are you talking about? You have your black clothes on already. Now get going!
        - id: ch04-b08
          speaker: narrator
          text: The smith looked down and saw that he was much blacker than usual. He snatched up his hat and ran after the funeral party. They were nearly at the church when he caught sight of them. He wanted to help carry the coffin, as a good neighbor should, so he ran as hard as he could and shouted after them.
        - id: ch04-b09
          speaker: smith
          text: Hey! Wait for me! Let me get hold of him too!
        - id: ch04-b10
          speaker: narrator
          text: The people turned and saw a black figure racing toward them. They were certain it was the devil himself, coming to seize the carpenter. They dropped the coffin and fled for their lives.
        - id: ch04-b11
          speaker: narrator
          text: The fall knocked the lid from the coffin. The carpenter woke, raised his head, and looked out. He remembered everything. He knew he was dead and on his way to be buried. Then he recognized the smith and spoke to him in a low voice.
        - id: ch04-b12
          speaker: carpenter
          text: My good neighbor, if I were not dead already, the sight of you coming to my funeral like this would have made me laugh myself to death.
        - id: ch04-b13
          speaker: narrator
          text: From that Sunday onward, the carpenter's wife drank without paying a penny. The other two wives had to admit that she had fooled her husband best.
