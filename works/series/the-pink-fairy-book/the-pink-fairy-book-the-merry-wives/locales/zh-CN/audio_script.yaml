audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    tailors_wife:
      display_name: "裁缝的妻子"
      tts:
        delivery: "机灵爽快，哄人时胸有成竹"
        timbre: "明亮利落的女声"
        pace: "明快"
        pitch: "中高音"
    tailor:
      display_name: "裁缝"
      tts:
        delivery: "老实顺从，凡事听妻子安排"
        timbre: "温和朴实的男声"
        pace: "适中"
        pitch: "中音"
    carpenters_wife:
      display_name: "木匠的妻子"
      tts:
        delivery: "一本正经，故作忧虑时格外逼真"
        timbre: "沉着清楚的女声"
        pace: "从容"
        pitch: "中音"
    carpenter:
      display_name: "木匠"
      tts:
        delivery: "憨厚轻信，语气迟疑而认真"
        timbre: "厚实温和的男声"
        pace: "稍慢"
        pitch: "中低音"
    smiths_wife:
      display_name: "铁匠的妻子"
      tts:
        delivery: "泼辣果断，说谎时毫不露怯"
        timbre: "爽利有力的女声"
        pace: "明快"
        pitch: "中音"
    smith:
      display_name: "铁匠"
      tts:
        delivery: "粗直豪爽，刚睡醒时迷迷糊糊"
        timbre: "粗犷洪亮的男声"
        pace: "适中"
        pitch: "低音"
  chapters:
    - id: ch01
      title: "一便士引出的赌局"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，三座房子并排立着，里面依次住着裁缝、木匠和铁匠。三个男人都有妻子，三个妻子又亲密得很。她们最爱谈论各自的丈夫有多傻，可是谁也不肯让步，都说自家那一个才是最傻的。"
        - id: ch01-b02
          speaker: narrator
          text: "每到星期日，她们便一起去教堂，路上少不了说一阵闲话。回家时，三人总会走进路边的酒馆，合喝半品脱白兰地。那时候，这些酒只卖三便士，每人出一便士就够了。后来酒价涨到四便士，这可难住了她们。三个人都不愿意独自多付那一便士。"
        - id: ch01-b03
          speaker: narrator
          text: "那天，她们离开教堂以后，终于想出一个办法。三人要比一比，究竟谁的丈夫最傻。谁能在下个星期日以前把丈夫骗得最狠，以后喝酒就不必掏钱，另外两人每人付两便士。赌局就这样定了下来。"
    - id: ch02
      title: "狗窝旁的裁缝"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "第二天，裁缝的妻子先动手了。她告诉丈夫，今天有几个姑娘要来梳羊毛，偏偏家里的看门狗已经死了。"
        - id: ch02-b02
          speaker: tailors_wife
          text: "活儿多得很，姑娘们得忙上一整天。可到了晚上，那些小伙子一定会来找她们玩，害得她们什么也做不成。家里要是还有一条凶狗，就能把人都吓走了。"
        - id: ch02-b03
          speaker: tailor
          text: "说得是。有条看门狗就好了。"
        - id: ch02-b04
          speaker: tailors_wife
          text: "那你来扮狗吧。只要守住屋子，把那些小伙子吓跑就行。"
        - id: ch02-b05
          speaker: narrator
          text: "裁缝听了有点犹豫。不过，他平时就很少违拗妻子。"
        - id: ch02-b06
          speaker: tailors_wife
          text: "放心，一定管用。你等着看好了。"
        - id: ch02-b07
          speaker: narrator
          text: "傍晚，妻子给裁缝套上一件毛茸茸的皮外套，用黑毛布裹住他的头，再把他拴到狗窝旁边。只要附近有个人影晃动，他就冲着人家汪汪叫，还从喉咙里发出低吼，认认真真替姑娘们守起门来。两位邻居太太知道这场把戏，躲在一旁看得十分开心。"
    - id: ch03
      title: "躺进棺材的木匠"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "第二天，木匠做完活儿，心情很好地回到家。刚跨进门，妻子突然拍起手来。"
        - id: ch03-b02
          speaker: carpenters_wife
          text: "亲爱的，你的样子怎么这么不对劲？你一定是病了！"
        - id: ch03-b03
          speaker: narrator
          text: "木匠根本不知道生病是怎么回事，只觉得干了一天活，肚子已经饿了。他坐到桌边，照常吃起晚饭。妻子却在正对面坐得笔直，双手叠在一起，一边不停摇头，一边满脸担心地盯着他。"
        - id: ch03-b04
          speaker: carpenters_wife
          text: "病得更重了。你的脸都白了，这准是大病，我看得出来。"
        - id: ch03-b05
          speaker: narrator
          text: "木匠被她说得心里发慌，渐渐也怀疑自己真的病了。"
        - id: ch03-b06
          speaker: carpenters_wife
          text: "不会错的。你早该上床休息了。"
        - id: ch03-b07
          speaker: narrator
          text: "她让丈夫躺下，把家里能找到的被褥都压到他身上，还叫他吃了好几种药。木匠越躺越觉得难受。"
        - id: ch03-b08
          speaker: carpenters_wife
          text: "看来你挨不过这一场了。我怕你就快死了。"
        - id: ch03-b09
          speaker: carpenter
          text: "你也这么想吗？那一定是真的，我现在确实难受极了。"
        - id: ch03-b10
          speaker: carpenters_wife
          text: "唉，我只好同你告别了。死神已经来了，让我替你合上眼睛吧。"
        - id: ch03-b11
          speaker: narrator
          text: "她说完就合上了丈夫的眼睛。木匠一向对妻子深信不疑。听她说自己死了，他也相信自己已经死去，便直挺挺躺着，随她处置。"
        - id: ch03-b12
          speaker: narrator
          text: "妻子叫来两位邻居，把他放进一口由他亲手做成的棺材。她早已在棺材上钻好小孔，让丈夫还能透气。里面铺着软垫，身上也盖了一床被子。妻子把他的双手叠在胸前，却没有像送葬时那样放上鲜花或赞美诗集，只塞给他一瓶足有一品脱的白兰地。木匠躺了一会儿，喝一口，再喝一口，又喝一口，觉得这酒对自己的病很有好处。不久，他便安稳地睡着，还梦见自己到了天堂。"
        - id: ch03-b13
          speaker: narrator
          text: "很快，全村都知道木匠死了，第二天就要下葬。"
    - id: ch04
      title: "追赶葬礼的铁匠"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "最后该铁匠的妻子出手了。铁匠喝了一场大酒，正在床上呼呼大睡。妻子脱掉他的衣服，把他从头到脚涂得像煤炭一样黑，又让他一直睡到很晚。"
        - id: ch04-b02
          speaker: narrator
          text: "送葬的人已经在木匠家集合，抬着棺材往教堂走了。铁匠的妻子这才急匆匆跑到丈夫跟前。"
        - id: ch04-b03
          speaker: smiths_wife
          text: "哎呀，你怎么还睡着？都什么时候了！你不是要去参加葬礼吗？"
        - id: ch04-b04
          speaker: narrator
          text: "铁匠刚醒，脑子里一团糊涂，根本不知道谁要下葬。"
        - id: ch04-b05
          speaker: smiths_wife
          text: "是邻居木匠呀，今天就要埋了。他们抬着棺材，都走到半路了。"
        - id: ch04-b06
          speaker: smith
          text: "那快帮我把黑衣服穿上。"
        - id: ch04-b07
          speaker: smiths_wife
          text: "说什么傻话，你不是已经穿好了吗？快去追吧！"
        - id: ch04-b08
          speaker: narrator
          text: "铁匠低头一看，自己果然比平时黑得多。他抓起帽子就往外跑。送葬队伍已经靠近教堂，他还想尽一尽好邻居的本分，帮大家抬棺材，于是使出全身力气追了上去。"
        - id: ch04-b09
          speaker: smith
          text: "喂，等等我！也让我抓住他！"
        - id: ch04-b10
          speaker: narrator
          text: "人们回头看见一个漆黑的人影飞奔而来，又听见他要抓住木匠，还以为魔鬼亲自来索命了。他们当场把棺材往地上一扔，一个个拔腿逃命，转眼便跑得无影无踪。"
        - id: ch04-b11
          speaker: narrator
          text: "棺材落地时狠狠一震，棺盖猛地弹开了。木匠从甜梦中醒来，探出头向外张望。他还清楚记得先前的一切，仍旧认定自己已经死了，现在正被送去下葬。等他看清追来的黑影原来是铁匠，便压低声音开口。"
        - id: ch04-b12
          speaker: carpenter
          text: "好邻居，要不是我早就死了，看见你这副模样赶来参加我的葬礼，我准会当场笑死。"
        - id: ch04-b13
          speaker: narrator
          text: "从那以后，每逢星期日，木匠的妻子都能白喝那份酒。另外两个妻子只好承认，这一回，的确是她把丈夫骗得最厉害。"
