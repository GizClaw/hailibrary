audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    eldest_son:
      display_name: "长子"
      tts:
        delivery: "年轻自信，带着未经世事的轻率"
        timbre: "明朗的年轻男声"
        pace: "适中偏快"
        pitch: "中音"
    second_son:
      display_name: "次子"
      tts:
        delivery: "急切认真，却同样有些自负"
        timbre: "清晰的年轻男声"
        pace: "适中"
        pitch: "中音"
    youngest_son:
      display_name: "小儿子"
      tts:
        delivery: "机敏勇敢，由不耐烦渐渐变得诚恳"
        timbre: "清亮坚定的年轻男声"
        pace: "轻快而有变化"
        pitch: "中高音"
    king:
      display_name: "国王"
      tts:
        delivery: "威严谨慎，秘密受威胁时强作镇定"
        timbre: "浑厚的成年男声"
        pace: "沉稳"
        pitch: "中低音"
    old_woman:
      display_name: "老妇人"
      tts:
        delivery: "世故机敏，说话不紧不慢"
        timbre: "略显沙哑的老年女声"
        pace: "舒缓"
        pitch: "中低音"
    princess:
      display_name: "公主"
      tts:
        delivery: "活泼聪慧，受惊后仍能迅速镇定"
        timbre: "明亮柔和的年轻女声"
        pace: "轻快"
        pitch: "中高音"
  chapters:
    - id: ch01
      title: "失踪的两个哥哥"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有个富商养育了三个儿子。等三个孩子都长大成人，长子便来向父亲请求。"
        - id: ch01-b02
          speaker: eldest_son
          text: "父亲，我想出去走一走，看看外面的世界。请您让我去吧。"
        - id: ch01-b03
          speaker: narrator
          text: "父亲答应了，还替他备下一艘漂亮的大船。长子出海航行了几个星期，最后在一座大城外抛锚，上岸去了。他才走到城里，就看见一块很大的告示牌。上面写着，谁能在八天内找到国王的女儿，谁就能娶她。可谁要是没有找到，便要赔上脑袋。"
        - id: ch01-b04
          speaker: eldest_son
          text: "这能有多难？我不妨去试试。"
        - id: ch01-b05
          speaker: narrator
          text: "长子求见国王，说自己要寻找公主。"
        - id: ch01-b06
          speaker: king
          text: "可以。整座王宫都由你搜，可你要记住，八天以后找不到人，你的脑袋就保不住了。"
        - id: ch01-b07
          speaker: narrator
          text: "国王叫人打开宫里所有房门，又先拿酒菜招待他。长子吃饱以后，把角落、箱子和橱柜全找遍了，公主却连影子也没有。到了第八天，他只能放弃，于是被砍掉了脑袋。"
        - id: ch01-b08
          speaker: narrator
          text: "长子出海以后，家里的父亲和两个弟弟一直没有收到他的半点消息。他们不知道他身在何处，也不知道他是死是活，一天比一天不安。到后来，次子终于再也坐不住了。"
        - id: ch01-b09
          speaker: second_son
          text: "父亲，也给我一艘大船，再给我些盘缠吧。我要去找哥哥。"
        - id: ch01-b10
          speaker: narrator
          text: "父亲替他备好了第二艘船。次子扬帆出海，海风却把他送进了哥哥登陆过的同一个港口。他远远看见第一艘船还停在那里，心怦怦直跳，立刻吩咐人放下小船，把自己送到岸上。"
        - id: ch01-b11
          speaker: second_son
          text: "船既然在这里，哥哥肯定没有走远。"
        - id: ch01-b12
          speaker: narrator
          text: "次子坐小船上了岸，刚跳上码头，便看见寻找公主的告示。他立刻猜到哥哥接下挑战，已经丢了性命。可他觉得自己既能找公主，也能找哥哥，而且事情不会太难。结果八天过去，他同样一无所获，也被砍掉了脑袋。"
    - id: ch02
      title: "老妇人的办法"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "家中只剩下小儿子。两个哥哥始终没有回来，他也求父亲备船，让自己去寻找他们。船刚刚启程，海面便刮起大风，径直把他吹到那座城的港口。那里仍立着寻找公主的告示。小儿子从头读了一遍，总算明白两个哥哥遭遇了什么。"
        - id: ch02-b02
          speaker: youngest_son
          text: "原来，找到公主的人就能娶她。哥哥们准是为这件事送了命。可我既然来了，还是要碰碰运气。"
        - id: ch02-b03
          speaker: narrator
          text: "他往王宫走去，半路碰见一个讨钱的老妇人。老妇人把他拦了下来。"
        - id: ch02-b04
          speaker: youngest_son
          text: "老太婆，别来烦我。"
        - id: ch02-b05
          speaker: old_woman
          text: "别让我什么也没讨到呀。你这么俊俏，难道不肯给老太婆几个小钱吗？"
        - id: ch02-b06
          speaker: youngest_son
          text: "我已经说了，请让我清静一会儿。"
        - id: ch02-b07
          speaker: old_woman
          text: "你心里有难事吧？说来听听，也许我有办法。"
        - id: ch02-b08
          speaker: narrator
          text: "小儿子这才告诉她，自己非找到国王的女儿不可。"
        - id: ch02-b09
          speaker: old_woman
          text: "只要你带的钱够多，这件事不难办。"
        - id: ch02-b10
          speaker: youngest_son
          text: "钱不用担心，我带得足够。"
        - id: ch02-b11
          speaker: old_woman
          text: "那就去找金匠，把钱全打成一头金狮子。眼睛要用水晶，身体里面还得装上会奏乐的机关。做好以后，把狮子送到我这里。"
        - id: ch02-b12
          speaker: narrator
          text: "小儿子带着钱去找金匠，把老妇人交代的每一件事都办妥了。金狮子造好后，老妇人让他藏进狮腹，自己把狮子带去见国王。水晶眼睛闪闪发亮，狮腹里还能奏出乐曲。国王见到这件宝物，喜爱得不得了，当场便想买下。"
        - id: ch02-b13
          speaker: old_woman
          text: "这不是我的东西。无论您肯出多少钱，我的主人都不会卖。"
        - id: ch02-b14
          speaker: king
          text: "那就借给我几天。我想让女儿也看一看。"
        - id: ch02-b15
          speaker: old_woman
          text: "借给您倒行，不过明天我就要来取。"
        - id: ch02-b16
          speaker: narrator
          text: "老妇人离开以后，国王一直盯着她的背影，直到她彻底消失，确信她没有躲在附近偷看，才把金狮子搬进自己的房间。他掀开几块松动的地板，下面藏着一道楼梯。国王顺着楼梯走到底，打开那里的锁门。门后是一条狭窄的过道，尽头又有一道门。他继续开锁，藏在狮子里的小儿子把每一步都记在心里，暗暗数出前后总共有七道门。"
    - id: ch03
      title: "藏在金狮子里的人"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "七道门后是一座美丽的大厅。公主正和十一个女伴在那里玩。十二位姑娘穿着相同的衣服，长得也一模一样，简直像同一个豆荚里的豌豆。小儿子看在眼里，心一下凉了。"
        - id: ch03-b02
          speaker: youngest_son
          text: "就算我下次能走到这里，也认不出谁是公主啊。"
        - id: ch03-b03
          speaker: narrator
          text: "他只好仔细盯住眼前的公主。公主却欢喜地拍着手，跑到金狮子跟前。"
        - id: ch03-b04
          speaker: princess
          text: "让我们把这只可爱的小兽留一夜吧！拿它来玩，一定有意思极了。"
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: "国王没有久留，临走前把狮子交给十二位姑娘。她们围着这个新奇的玩具消磨了好一阵，直到个个困倦，才各自准备上床。公主把金狮子带回自己的卧房，放在地上。她刚有一点睡意，近旁突然有人开口，把她吓得猛然惊醒。"
        - id: ch03-b06
          speaker: youngest_son
          text: "美丽的公主，要是你知道我为了找到你，经历过多少事情就好了！"
        - id: ch03-b07
          speaker: princess
          text: "狮子！狮子在说话！"
          emotion: fearful
        - id: ch03-b08
          speaker: narrator
          text: "她的女伴们以为她只是做了噩梦，谁也没有起床。金狮子里的声音又响了起来。"
        - id: ch03-b09
          speaker: youngest_son
          text: "请别怕。我是富商的儿子，一心想娶你为妻。为了见到你，我才躲进这头金狮子。"
        - id: ch03-b10
          speaker: princess
          text: "你就算进得来，又能怎么样？到时候要是分不清我和十一个女伴，你还是会被砍头。"
        - id: ch03-b11
          speaker: youngest_son
          text: "那就请你帮我一次吧。我费尽力气才走到你面前，只求你为我做这一件事。"
        - id: ch03-b12
          speaker: princess
          text: "好，你记住。第八天，我会在腰上系一条白色腰带。看见腰带，你就能认出我。"
        - id: ch03-b13
          speaker: narrator
          text: "第二天一大早，老妇人已经来到王宫，催着国王归还金狮子。国王只好亲自去把它取来。老妇人带走狮子，等走到无人看见的地方，才打开机关，把小儿子放出来。小儿子随即回到王宫，告诉国王，自己也要寻找公主。"
        - id: ch03-b14
          speaker: king
          text: "很好。可是你若找不到，便要交出脑袋。"
        - id: ch03-b15
          speaker: narrator
          text: "这些话国王已经说得几乎厌烦了。小儿子在宫里住下来，每天吃吃喝喝，欣赏那些华美的陈设，偶尔才装出认真搜寻的样子，翻一翻壁橱，瞧一瞧墙角。就这样，他等到了第八天。"
    - id: ch04
      title: "白色腰带"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "第八天，小儿子走进国王所在的房间，指着脚下开口。"
        - id: ch04-b02
          speaker: youngest_son
          text: "请把这里的地板掀开。"
        - id: ch04-b03
          speaker: narrator
          text: "国王失声惊叫，马上又忍住了。"
        - id: ch04-b04
          speaker: king
          text: "为什么要动地板？下面根本没有东西。"
        - id: ch04-b05
          speaker: narrator
          text: "可满朝大臣都在旁边看着，国王不便继续阻拦，只得命人照办。地板掀开以后，小儿子径直走下楼梯，来到第一道门前，转身要国王取出钥匙。国王只能打开第一道门，再开第二道、第三道，一直把七道门全部打开。"
        - id: ch04-b06
          speaker: narrator
          text: "他们穿过最后一道门，走进那座美丽的大厅。十二位姑娘已经并排站在那里，不仅衣着完全相同，容貌也没有一点分别，任谁看了都分不出来。小儿子逐个望过去，其中一位悄悄从衣袋取出白色腰带，系到了腰间。他一看见那个记号，马上冲到她身旁。"
        - id: ch04-b07
          speaker: youngest_son
          text: "她就是公主。我要娶她为妻。"
        - id: ch04-b08
          speaker: narrator
          text: "国王再也无话可说，只好承认自己输了，下令摆设盛大的婚宴。婚礼过后又过了八天，新婚夫妇向国王辞行，扬帆前往小儿子的故乡。船上还装着整整一船珍宝，那都是公主的嫁妆。他们也没有忘记老妇人成全了这桩婚姻，送给她足够的钱，让她从此衣食无忧，舒舒服服地安度晚年。"
