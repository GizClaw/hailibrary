audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and mellow
        pace: measured
        pitch: medium
    king:
      display_name: King
      tts:
        delivery: commanding, eager, and quick to emotion
        timbre: rich and resonant
        pace: steady
        pitch: medium-low
    eldest_brother:
      display_name: Eldest Brother
      tts:
        delivery: proud, impatient, and dismissive
        timbre: firm and youthful
        pace: brisk
        pitch: medium-low
    second_brother:
      display_name: Second Brother
      tts:
        delivery: confident, competitive, and severe
        timbre: clear and youthful
        pace: steady
        pitch: medium
    youngest_brother:
      display_name: Youngest Brother
      tts:
        delivery: kind, earnest, and openhearted
        timbre: warm and youthful
