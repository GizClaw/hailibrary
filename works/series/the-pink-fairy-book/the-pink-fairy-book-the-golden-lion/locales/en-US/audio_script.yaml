  chapters:
    - id: ch01
      title: The Eldest Brother's Challenge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a rich merchant with three sons. When they were grown, the eldest went to his father and asked to see the world.
        - id: ch01-b02
          speaker: eldest_brother
          text: Father, I want to travel and see what lies beyond our home. Please let me go.
        - id: ch01-b03
          speaker: narrator
          text: His father had a beautiful ship prepared for him, and the young man sailed away. Several weeks later, the ship anchored outside a great town. The merchant's son went ashore, and the first thing he noticed was a proclamation on a large board. Any man who found the king's daughter within eight days could marry her. If he tried and failed, he would lose his head.
        - id: ch01-b04
          speaker: eldest_brother
          text: That can't be very hard.
        - id: ch01-b05
          speaker: narrator
          text: He went straight to the king and asked for the chance to search for the princess.
        - id: ch01-b06
          speaker: king
          text: Certainly. You may search the whole palace. But remember, if you fail, it will cost you your head.
        - id: ch01-b07
          speaker: narrator
          text: The king ordered the palace doors opened and had food and drink brought to the young man. Once he had eaten, the search began. He looked in every corner, every chest, and every cupboard. The princess was nowhere to be found. At the end of eight days, he gave up, and his head was cut off.
    - id: ch02
      title: Two Brothers Follow
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Back home, the merchant and his two younger sons had heard nothing. Day after day they waited, but no message came. As their worry grew, the second brother could bear waiting no longer.
        - id: ch02-b02
          speaker: second_brother
          text: Dear Father, please give me a large ship and some money. I must go and look for my brother.
        - id: ch02-b03
          speaker: narrator
          text: The father fitted out another ship. The second son sailed away, and the wind carried him into the very harbor where his brother had landed. There lay the first ship, still at anchor. The sight of it made his heart beat fast.
        - id: ch02-b04
          speaker: second_brother
          text: My brother must be close by!
        - id: ch02-b05
          speaker: narrator
          text: He had a boat lower him to shore. The moment he stepped onto the pier, he saw the notice about the princess. Then he understood what his brother must have done.
        - id: ch02-b06
          speaker: second_brother
          text: He must have tried to find her and lost his head. I'll try too, and search for both of them. It shouldn't be so difficult.
        - id: ch02-b07
          speaker: narrator
          text: But his search ended just as his brother's had. Eight days passed, he failed to find the princess, and his head was cut off.
        - id: ch02-b08
          speaker: narrator
          text: Only the youngest son remained at home. When neither brother returned, he too begged his father for a ship so he could search for them. As soon as he set sail, a strong wind drove his vessel straight to the harbor with the proclamation.
        - id: ch02-b09
          speaker: youngest_brother
          text: So anyone who finds the king's daughter may marry her. Now I know what happened to my brothers. Even so, I think I must try my luck.
        - id: ch02-b10
          speaker: narrator
          text: He started toward the castle. On the road, an old woman stopped him and begged for money.
        - id: ch02-b11
          speaker: youngest_brother
          text: Please leave me alone, old woman.
        - id: ch02-b12
          speaker: old_woman
          text: Oh, don't send me away with nothing. A handsome young man like you can surely spare an old woman a few coins.
        - id: ch02-b13
          speaker: youngest_brother
          text: I told you to leave me alone.
        - id: ch02-b14
          speaker: old_woman
          text: Something is troubling you, isn't it? Tell me what it is. Perhaps I can help.
        - id: ch02-b15
          speaker: narrator
          text: So he told her that he had set his heart on finding the king's daughter.
        - id: ch02-b16
          speaker: old_woman
          text: I can arrange that easily, if you have enough money.
        - id: ch02-b17
          speaker: youngest_brother
          text: Money is no problem. I have plenty.
        - id: ch02-b18
          speaker: old_woman
          text: Then take it to a goldsmith. Have him make a golden lion with crystal eyes, and put a device inside it that can play music. Bring the lion to me when it's finished.
        - id: ch02-b19
          speaker: narrator
          text: The young man followed her instructions. When the golden lion was ready, the old woman hid him inside it and carried it to the king. The king was delighted and wanted to buy it at once.
        - id: ch02-b20
          speaker: old_woman
          text: It isn't mine, and my master would never sell it, no matter what you offered.
        - id: ch02-b21
          speaker: king
          text: Then at least leave it here for a few days. I want to show it to my daughter.
        - id: ch02-b22
          speaker: old_woman
          text: I can leave it tonight, but I must have it back tomorrow.
        - id: ch02-b23
          speaker: narrator
          text: With that, she went away.
    - id: ch03
      title: Inside the Golden Lion
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The king watched until the old woman was completely out of sight. He wanted to be certain she wasn't spying. Then he carried the golden lion into his own room and lifted several loose floorboards. A staircase lay underneath. He went down to a door, unlocked it, and entered a narrow passage with another locked door at the far end.
        - id: ch03-b02
          speaker: narrator
          text: Hidden inside the lion, the young man carefully counted each door and fixed the whole route in his mind. There were seven locked doors altogether. Beyond the seventh was a lovely hall. The princess was there with eleven friends, and all twelve girls were dressed alike. They looked as much alike as peas in a pod.
        - id: ch03-b03
          speaker: youngest_brother
          text: This is terrible luck. Even if I find my way back, how will I ever know which girl is the princess?
        - id: ch03-b04
          speaker: narrator
          text: He watched closely. The princess clapped her hands, ran to meet her father, and cried out with delight.
        - id: ch03-b05
          speaker: princess
          text: Oh, please let us keep this wonderful creature tonight! It would be such fun to play with.
        - id: ch03-b06
          speaker: narrator
          text: The king soon left, placing the lion in the maidens' care. They played with it until they grew sleepy and went to bed. The princess carried it into her own room and set it on the floor.
        - id: ch03-b07
          speaker: narrator
          text: She had just begun to doze when a voice spoke very near her. She jumped awake.
        - id: ch03-b08
          speaker: youngest_brother
          text: Lovely princess, if only you knew all I've been through to find you!
        - id: ch03-b09
          speaker: narrator
          text: The princess leaped from her bed and screamed.
        - id: ch03-b10
          speaker: princess
          text: The lion! The lion!
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: Her friends thought she was having a nightmare, so none of them got up.
        - id: ch03-b12
          speaker: youngest_brother
          text: Please don't be afraid. I'm the son of a rich merchant, and more than anything, I want you to be my wife. I hid inside this golden lion so I could reach you.
        - id: ch03-b13
          speaker: princess
          text: But how will that help? If you can't pick me out from my companions, you'll still lose your head.
        - id: ch03-b14
          speaker: youngest_brother
          text: I'm depending on you to help me. I've come so far for you. Won't you do this one thing for me?
        - id: ch03-b15
          speaker: princess
          text: Then listen carefully. On the eighth day, I'll tie a white sash around my waist. That's how you'll know me.
    - id: ch04
      title: The Seven Locked Doors
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Early the next morning, the king came for the lion. The old woman was already waiting at the palace to take it back. Once they were safely out of sight, she let the young man climb out. He returned to the king and announced that he wanted to search for the princess.
        - id: ch04-b02
          speaker: king
          text: Very well. But if you fail, your head is the price.
        - id: ch04-b03
          speaker: narrator
          text: By now, the king was almost weary of giving the same warning. The young man stayed quietly in the castle. He ate, admired the beautiful things around him, and every so often pretended to search busily through closets and corners.
        - id: ch04-b04
          speaker: narrator
          text: On the eighth day, he entered the room where the king sat.
        - id: ch04-b05
          speaker: youngest_brother
          text: Have the floorboards lifted right here.
        - id: ch04-b06
          speaker: narrator
          text: The king gave a cry, then quickly checked himself.
        - id: ch04-b07
          speaker: king
          text: Why should anyone lift the floor? There's nothing underneath it.
        - id: ch04-b08
          speaker: narrator
          text: But the courtiers were all watching. The king did not dare object again, so he ordered the floor taken up. The young man went straight down the staircase. At the first door, he turned back.
        - id: ch04-b09
          speaker: youngest_brother
          text: Bring the key and open this door.
        - id: ch04-b10
          speaker: narrator
          text: The king had no choice. He unlocked the first door, then the second, and on they went until all seven stood open. At last they entered the hall. The twelve maidens were waiting in a row, dressed alike and so similar that no one could tell them apart.
        - id: ch04-b11
          speaker: narrator
          text: As the young man looked at them, one maiden quietly drew a white sash from her pocket and slipped it around her waist. He rushed to her side.
        - id: ch04-b12
          speaker: youngest_brother
          text: Here is the princess. I claim her as my wife.
        - id: ch04-b13
          speaker: narrator
          text: The king admitted that he had been beaten and ordered the wedding feast to begin.
    - id: ch05
      title: The Wedding and the Voyage Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Eight days later, the bride and groom said farewell to the king. They sailed toward the young man's country with an entire shipload of treasure for the princess's dowry.
        - id: ch05-b02
          speaker: narrator
          text: They did not forget the old woman who had made their happiness possible. They gave her enough money to live comfortably for the rest of her days.
