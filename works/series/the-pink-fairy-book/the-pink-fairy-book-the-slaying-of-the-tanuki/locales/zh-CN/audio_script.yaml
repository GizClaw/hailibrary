audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    old_man:
      display_name: 老农夫
      tts:
        delivery: 朴实厚道，悲痛时低沉克制
        timbre: 苍老浑厚
        pace: 稍缓
        pitch: 中低音
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 善良朴实，说话柔和
        timbre: 温厚清楚
        pace: 中速
        pitch: 中音
    tanuki:
      display_name: 狸
      tts:
        delivery: 狡猾善变，得意时尖刻张扬
        timbre: 粗哑灵活
        pace: 中速偏快
        pitch: 中音
    hare:
      display_name: 野兔
      tts:
        delivery: 机敏果断，面对仇敌时沉着伶俐
        timbre: 清亮利落
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 林中的仇敌
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，一条大河从两座高山之间流过。河边有间小屋，里面住着一对老夫妇。四周的森林又深又密，可林里的路和树，老农夫从小就熟悉。一次进山，他结识了一只野兔。往后，老农夫常在路边坐下吃午饭，野兔便来陪他。两个朋友总能在一起待上好半天。
        - id: ch01-b02
          speaker: narrator
          text: 有一只狸看见了这段交情。它凶狠又好斗，一直憎恨老农夫，三天两头就要给他找点麻烦。它常溜进小屋，翻出留给小野兔的吃食。好吃的，它自己吞下去。不好吃的，也要踩得稀烂，不让别人吃。老农夫忍了又忍，终于下定决心，要取这只狸的性命。
        - id: ch01-b03
          speaker: narrator
          text: 他一连埋伏了许多天。一天早晨，狸大摇大摆地走来，只顾惦记着要偷的饭。老农夫一下扑上去，把它四条腿牢牢捆住。这个屡次作恶的家伙总算落到了手里，他高高兴兴地把狸拖回小屋。
        - id: ch01-b04
          speaker: old_man
          text: 它做了那么多坏事，就拿这张皮来还债吧。我们先杀掉它，再煮来吃。
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: 说完，老农夫把狸头朝下吊在房梁上，自己出门捡柴生火去了。
    - id: ch02
      title: 狸的骗局
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 老妇人正在臼前舂米。那是全家一星期的口粮，杵又重得很，累得她两条胳膊直发酸。墙角忽然传来呜呜的哭声。她停下手，回头去看。狸等的就是这一刻。它马上装得又顺从又可怜，用最柔和的声音求她松开绳子，说身上实在勒得太疼。
        - id: ch02-b02
          speaker: narrator
          text: 老妇人心里不忍，却知道丈夫会发怒，还是不敢放它。狸看出她已经心软，又央求了一遍。
        - id: ch02-b03
          speaker: tanuki
          text: 我只求您解开绳子。我发誓不逃，还能替您把米舂完。您正好歇一歇。舂米这么累，身子柔弱的女人怎么受得住呢？
        - id: ch02-b04
          speaker: narrator
          text: 这番话终于打动了善良的老妇人，她解开了绳索。可怜的糊涂人！狸一得到自由，转眼就抓住她，剥下她的衣裳，把她塞进臼里。没过多久，老妇人便像米一样被捣得粉碎。狸仍不罢休，又在火塘上架起锅，要拿她的肉给老农夫做饭。
        - id: ch02-b05
          speaker: narrator
          text: 饭菜准备好了，狸朝门外一看，老农夫正背着一大捆木柴走出森林。它立刻穿上老妇人的衣裳，又施展妖术，变成她的模样。狸接过柴，生起火，很快摆出一大桌饭菜。老农夫饿极了，早把房梁上的囚犯忘在脑后，坐下来吃了个饱。
        - id: ch02-b06
          speaker: narrator
          text: 狸知道他很快就会想起来，赶紧躲到门后，脱掉衣裳，现出自己的本相。
        - id: ch02-b07
          speaker: tanuki
          text: 你可真有本事，捉住牲畜就说要杀！现在你落进自己的网里了。你刚吃掉的就是你的妻子。想找她的骨头吗？低头看看地板底下吧！
        - id: ch02-b08
          speaker: narrator
          text: 说完，狸转身逃进了森林。
    - id: ch03
      title: 野兔前来报仇
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 老农夫听完，浑身一下冷透了，站在原地动也不能动。过了好一阵，他才缓过神来。他收起妻子的遗骨，埋在园中，又在坟前发誓，一定要向狸报仇。事情办完，老农夫独自坐在空屋里，痛哭不止。最折磨他的，是自己这辈子再也忘不掉，竟然吃下了妻子的肉。
        - id: ch03-b02
          speaker: narrator
          text: 他的朋友野兔正巧从门前经过。听见屋里的哭声，它竖起耳朵，认出了老农夫的声音。野兔探头进门，问他出了什么事。老农夫流着泪，把那场灾祸从头说了一遍。野兔听了，既愤怒又难过，只能尽力安慰朋友，并答应帮他复仇。
        - id: ch03-b03
          speaker: hare
          text: 那个奸诈的恶棍，绝不能让它逃过惩罚。
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: 野兔在屋里找齐材料，调出一罐药膏，又撒进许多胡椒，收进自己的口袋。接着，它拿起一把短柄斧，告别老农夫，走进森林。来到狸的住处，野兔上前敲门。狸根本没提防它，见它来还很高兴。特别是瞧见那把短柄斧以后，它马上打起主意，想把斧头弄到自己手里。
        - id: ch03-b05
          speaker: narrator
          text: 狸觉得，最好的办法就是提出和野兔同路。这正是野兔盼着它做的事。野兔太了解这个坏蛋的诡计了，于是痛快地答应下来，一路还故意待它十分亲热。
        - id: ch03-b06
          speaker: narrator
          text: 走在森林里，野兔像是随手举起斧头，砍掉几根伸到小路上方的粗树枝。后来，它费了很大力气，连劈许多斧，又砍倒一棵大树。
        - id: ch03-b07
          speaker: hare
          text: 这些树枝太沉了，我实在背不回去，只好丢在这里。
        - id: ch03-b08
          speaker: narrator
          text: 贪心的狸一听便十分欢喜，说这点分量根本压不住自己。它们把大树枝收拢起来，野兔牢牢捆在狸背上。狸驮着沉重的木柴，兴冲冲地朝家跑。野兔背着较轻的一捆，紧紧跟在后面。
    - id: ch04
      title: 背上的烈火
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 野兔早已想好下一步。它们一到地方，它就悄悄点燃狸背上的木柴。狸正忙着别的事，一点也没察觉。听见身后噼噼啪啪地响，它只管高声问野兔，那是什么声音。
        - id: ch04-b02
          speaker: hare
          text: 没什么，是山坡上的石头滚下来，碰得咔啦咔啦响。
        - id: ch04-b03
          speaker: narrator
          text: 狸信了，再没有多问。它根本不知道，真正作响的是背上的树枝。火越烧越旺，等它的皮毛也燃起来，再想扑灭已经太晚了。狸尖声惨叫，扔下背上的火柴堆，一边跺脚，一边疼得大声哀号。野兔却过来安慰它，说自己总随身带着一罐好药，正是留着急用的，只要敷上，伤口马上就不疼了。
        - id: ch04-b04
          speaker: narrator
          text: 野兔拿出加了胡椒的药膏，厚厚地涂在竹叶上，再贴到狸的伤口。竹叶才挨到身上，狸就惨叫着蹦上半空。野兔哈哈大笑，转身跑回老农夫那里，把自己怎样捉弄仇敌全告诉了他。
        - id: ch04-b05
          speaker: narrator
          text: 老农夫却只是悲伤地摇头。他明白，那恶棍不过暂时吃了亏，不久就会向他们报复。要想过上安稳日子，只有一个办法，那就是让狸永远不能再作恶。老农夫和野兔苦想了许久，终于商量出一条计策。他们要造两条船，一条是木头做的小船，另一条是泥土做的大船。
    - id: ch05
      title: 河上的两条船
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 他们马上动手。两条船造好后，又仔细涂上油漆，看起来一模一样。野兔去找还没养好伤的狸，邀它一起到河里捕鱼。狸想起上回的骗局，心中仍在生气。可是它身体虚弱，肚子又饿，最后还是接受了邀请，跟野兔来到河边。
        - id: ch05-b02
          speaker: narrator
          text: 两条船系在岸边，随着水波轻轻摇晃。狸只看出一条大，一条小。它心想，大船一定能装下更多的鱼，便跳进泥土做的那条大船。野兔则爬进木头做的小船。它们解开缆绳，一起向河心划去。
        - id: ch05-b03
          speaker: narrator
          text: 船离河岸已经很远。野兔忽然举起船桨，朝狸的船狠狠砸去。一声响，泥船裂成两半，狸直直掉进河里。野兔把它按在水中，直到它彻底断了气。
        - id: ch05-b04
          speaker: narrator
          text: 野兔把狸的尸体拖进木船，划回岸上，又去告诉老农夫，他的仇敌终于死了。老农夫知道妻子的仇已经报了，心中十分欢喜。他把野兔接到家里。从此，两个朋友一同住在山上，安安宁宁地度过了余生。
