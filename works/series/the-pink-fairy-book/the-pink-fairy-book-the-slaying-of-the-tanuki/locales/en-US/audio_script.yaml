audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and mellow
        pace: measured
        pitch: medium
    peasant:
      display_name: Peasant
      tts:
        delivery: plainspoken, earnest, and deeply feeling
        timbre: weathered and warm
        pace: unhurried
        pitch: medium-low
    wife:
      display_name: Peasant's Wife
      tts:
        delivery: gentle, hardworking, and compassionate
        timbre: soft and mature
        pace: measured
        pitch: medium
    tanuki:
      display_name: Tanuki
      tts:
        delivery: sly, quarrelsome, and falsely charming
        timbre: rough and agile
