  chapters:
    - id: ch01
      title: The Peasant Catches the Tanuki
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long, long ago, a man and his wife lived in a cottage near a broad river, between two high mountains. A thick forest surrounded their home. The peasant had known nearly every path and tree since boyhood. During his walks, he had befriended a hare. The two often sat together by the roadside while the man rested and ate his dinner.
        - id: ch01-b02
          speaker: narrator
          text: A wicked, quarrelsome Tanuki noticed their friendship. He hated the peasant and was always looking for ways to harm him. Time after time, he crept to the cottage and found a special morsel saved for the little hare. If he liked it, he ate it. If not, he trampled it so no one else could have it. At last, the peasant's patience was gone. He decided to kill the Tanuki.
        - id: ch01-b03
          speaker: narrator
          text: For many days, the man hid and waited. One morning, the Tanuki came marching up the road, thinking only of the dinner he meant to steal. The peasant sprang on him and tied all four of his legs so tightly that he could not move. Delighted to have finally beaten the beast that had caused so much trouble, he dragged the Tanuki home.
        - id: ch01-b04
          speaker: peasant
          text: He will pay for all his mischief with his skin. First we will kill him, and then we will cook him.
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: The peasant hung the Tanuki upside down from a beam. Then he went out to gather firewood.
    - id: ch02
      title: The Tanuki's Cruel Trick
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meanwhile, the old woman stood at the mortar, pounding the rice they would need for the week. Her pestle was so heavy that her arms ached. Then she heard whining and weeping from the corner. She stopped her work and turned around. That was exactly what the rascal had been waiting for. He put on his humblest manner and spoke in his softest voice.
        - id: ch02-b02
          speaker: tanuki
          text: Please loosen these ropes. They are hurting me terribly.
        - id: ch02-b03
          speaker: narrator
          text: The woman pitied him, but she was afraid to free him because her husband would be furious. The Tanuki saw that her heart had softened, so he tried again.
        - id: ch02-b04
          speaker: tanuki
          text: You do not have to let me escape. Just untie me, and I give you my word that I will stay. Then I can pound the rice for you. You could rest a while. That work is exhausting, and the pestle is far too heavy for you.
        - id: ch02-b05
          speaker: narrator
          text: Those words melted the good woman's heart. She untied him. The poor, foolish woman had no time to save herself. In an instant, the Tanuki seized her, stripped away her clothes, and thrust her into the mortar. He pounded her as fine as the rice. Then, still not satisfied, he set a pot on the hearth and prepared a dinner for the peasant from his own wife's flesh.
        - id: ch02-b06
          speaker: narrator
          text: When all was ready, the Tanuki looked outside. The old man was coming from the forest with a great bundle of wood. In a flash, the Tanuki put on the woman's clothes. Because he was a magician, he also took on her shape. He accepted the wood, lit the fire, and soon placed a large meal before the hungry peasant. The man ate until he was full. For the moment, he had forgotten all about his prisoner.
        - id: ch02-b07
          speaker: narrator
          text: The Tanuki waited until the old man had eaten his fill and would soon remember him. Then he slipped behind a door, threw off the clothes, and returned to his own shape.
        - id: ch02-b08
          speaker: tanuki
          text: So you catch animals and speak of killing them, do you? Now your own trap has caught you. You have eaten your wife. If you want her bones, look beneath the floor.
        - id: ch02-b09
          speaker: narrator
          text: With that, the Tanuki turned and fled into the forest.
    - id: ch03
      title: The Hare's Promise
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Horror turned the old peasant cold. For a while, he stood as still as if he had frozen in place. When he could move again, he gathered his dead wife's bones and buried them in the garden. Over her grave, he swore that he would take revenge on the Tanuki.
        - id: ch03-b02
          speaker: narrator
          text: When everything was done, the man sat alone in his cottage and wept bitterly. Worst of all was knowing that he could never forget how the Tanuki had tricked him into eating his own wife.
        - id: ch03-b03
          speaker: narrator
          text: As he wept and wailed, his friend the hare happened to pass by. The hare's ears rose at the sound, and he soon recognized the old man's voice. Wondering what could have happened, he put his head through the doorway.
        - id: ch03-b04
          speaker: hare
          text: My friend, what has happened? Why are you crying so terribly?
        - id: ch03-b05
          speaker: narrator
          text: Through tears and groans, the peasant told him the whole dreadful story. Anger and pity filled the hare. He comforted the old man as well as he could and promised to help him take revenge.
        - id: ch03-b06
          speaker: hare
          text: That lying villain will be punished for this.
          emotion: angry
    - id: ch04
      title: Firewood and Pepper
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: First, the hare searched the cottage for what he needed. He made an ointment, mixed plenty of pepper into it, and tucked it into his pocket. Then he took a hatchet, said farewell to the old man, and set off through the forest.
        - id: ch04-b02
          speaker: narrator
          text: The hare went to the Tanuki's home and knocked. The Tanuki had no reason to suspect him and was delighted by the visit. But the moment he saw the hatchet, he began plotting how to make it his own. He decided that the best way was to offer to go along with the hare.
        - id: ch04-b03
          speaker: narrator
          text: That was just what the hare had hoped he would do. The hare knew how cunning the Tanuki was and understood his ways. He cheerfully accepted the company and acted most friendly as they wandered among the trees.
        - id: ch04-b04
          speaker: narrator
          text: As they walked, the hare casually swung his hatchet and cut several thick branches that hung across the path. At last, after many hard blows, he brought down a large tree. Then he declared that the wood was too heavy for him and that he would have to leave it behind.
        - id: ch04-b05
          speaker: tanuki
          text: Too heavy for you, perhaps, but not for me. I can carry those branches easily.
        - id: ch04-b06
          speaker: narrator
          text: The greedy Tanuki was delighted. They gathered the big branches, and the hare bound them tightly onto his back. The Tanuki trotted happily toward home with his load, while the hare followed with a lighter bundle.
        - id: ch04-b07
          speaker: narrator
          text: By then, the hare knew exactly what he would do. As soon as they arrived, he quietly set fire to the wood on the Tanuki's back. The Tanuki was busy with something else and noticed nothing. Soon, though, he heard a strange crackling sound.
        - id: ch04-b08
          speaker: tanuki
          text: What is making that crackling noise?
        - id: ch04-b09
          speaker: hare
          text: Oh, that is only the sound of stones rolling down the mountainside.
        - id: ch04-b10
          speaker: narrator
          text: The answer satisfied the Tanuki, and he said no more. He never guessed that the sound came from the branches burning on his back. By the time he understood, his fur was in flames and it was almost too late to put them out. Shrieking in pain, he dropped the burning wood, stamped his feet, and howled.
        - id: ch04-b11
          speaker: narrator
          text: The hare pretended to comfort him. He said he always carried an excellent plaster for emergencies and that it would give relief at once. He took out the pepper ointment, spread it across a bamboo leaf, and laid it on the burn.
        - id: ch04-b12
          speaker: narrator
          text: The instant it touched him, the Tanuki leaped into the air with a yell. The hare laughed and ran back to tell the peasant how he had tricked their enemy.
        - id: ch04-b13
          speaker: narrator
          text: But the old man only shook his head sadly. The trick had defeated the villain for a moment, but soon he would seek revenge. They would never have peace until the Tanuki could do no more harm. For a long while, the old man and the hare puzzled over what to do. At last, they formed a plan. They would build two boats, one small boat of wood and one large boat of clay.
    - id: ch05
      title: The Two Boats
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The peasant and the hare began work at once. When both boats were finished and properly painted, the hare went to visit the Tanuki, who was still badly hurt. He invited him to come on a great fishing trip.
        - id: ch05-b02
          speaker: narrator
          text: The Tanuki was still angry about the trick the hare had played. But he was weak and very hungry, so the thought of catching fish pleased him. He accepted and followed the hare to the riverbank. There, the two boats lay moored, rocking on the waves.
        - id: ch05-b03
          speaker: narrator
          text: The boats looked exactly alike. The Tanuki noticed only that one was larger and could hold more fish. He jumped into the large clay boat, while the hare climbed into the smaller wooden one. They untied the boats and rowed toward the middle of the river.
        - id: ch05-b04
          speaker: narrator
          text: Once they were far from shore, the hare lifted his oar. He struck the other boat such a heavy blow that it broke in two. The Tanuki fell straight into the water. The hare held him there until he was dead.
        - id: ch05-b05
          speaker: narrator
          text: Then the hare placed the Tanuki's body in his own boat and rowed back to land. He told the old man that at last, his enemy was dead. The peasant rejoiced because his wife had been avenged.
        - id: ch05-b06
          speaker: narrator
          text: The old man welcomed the hare into his home, and together they lived out all their days in peace and quiet upon the mountain.
