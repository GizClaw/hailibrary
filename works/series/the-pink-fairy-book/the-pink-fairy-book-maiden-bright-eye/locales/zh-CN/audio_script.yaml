audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    maiden_bright_eye:
      display_name: "明眸姑娘"
      tts:
        delivery: "善良真诚，柔和中带着坚韧"
        timbre: "清澈悦耳的年轻女声"
        pace: "平稳"
        pitch: "中高音"
    bergman:
      display_name: "山精"
      tts:
        delivery: "古怪爽直，奖惩分明"
        timbre: "轻巧而略带粗粝的男声"
        pace: "明快"
        pitch: "中高音"
    stepsister:
      display_name: "继姐"
      tts:
        delivery: "骄横刻薄，说话毫不客气"
        timbre: "尖利的年轻女声"
        pace: "急促"
        pitch: "高音"
    brother:
      display_name: "哥哥"
      tts:
        delivery: "诚恳温厚，遇事容易慌乱"
        timbre: "清楚朴实的年轻男声"
        pace: "适中"
        pitch: "中音"
    king:
      display_name: "国王"
      tts:
        delivery: "专横贪求，不容辩驳"
        timbre: "洪亮端正的男声"
        pace: "沉稳"
        pitch: "中低音"
    dog:
      display_name: "小狗"
      tts:
        delivery: "忠诚忧伤，回答简短直接"
        timbre: "温厚清楚的男声"
        pace: "平稳"
        pitch: "中音"
    cook:
      display_name: "厨师"
      tts:
        delivery: "机警务实，拿定主意便行动"
        timbre: "结实沉着的男声"
        pace: "适中"
        pitch: "中低音"
  chapters:
    - id: ch01
      title: "山精的三个愿望"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有一对夫妻，生了一儿一女。妻子去世以后，男人又娶了一个女人。后妻也有一个独生女儿。那姑娘不但长得难看，身上还很邋遢；继女却美丽动人，人们都叫她明眸姑娘。继母正因如此，对明眸姑娘格外狠毒。家里最累最重的活儿全都推给她，吃的却少得可怜，也从来没人肯照料她。亲生女儿得到的全是疼爱，任何重活都不用沾手，还总能穿上家里最漂亮的衣裳。"
        - id: ch01-b02
          speaker: narrator
          text: "明眸姑娘还要放羊。继母不许她在荒原上闲着，又叫她一边看羊，一边拔石南。给她带去当午饭的薄饼，面粉里还掺了炉灰，难吃得不能再难吃。小姑娘来到一座土丘旁，才开始拔石南，一个头戴红帽的小矮人便从土丘里钻了出来。"
        - id: ch01-b03
          speaker: bergman
          text: "是谁在掀我家的屋顶？"
        - id: ch01-b04
          speaker: maiden_bright_eye
          text: "是我。我只是个可怜的小姑娘，母亲叫我到这里来拔石南。你若肯好好待我，我愿意把午饭分给你。"
        - id: ch01-b05
          speaker: narrator
          text: "山精答应了，明眸姑娘便把最大的一份薄饼给他。饼虽不好吃，饿着肚子时也变得有滋味了。山精吃完以后，要送她三样礼物。"
        - id: ch01-b06
          speaker: bergman
          text: "你是个好姑娘，所以我要送你三个愿望，不过都由我来挑。你本来很美，以后会美得举世无双。每当你开口，嘴里都会落下一枚金币，你的声音也会像最美妙的乐声。最后，你会嫁给年轻的国王，成为王后。我再送你一顶帽子。把它仔细收好，哪天有了性命之危，只要戴上它，它就能救你。"
        - id: ch01-b07
          speaker: narrator
          text: "明眸姑娘一遍又一遍地向山精道谢，傍晚赶着羊群回了家。她已经美得叫家里人几乎认不出来。继母追问她为何突然变得这样美丽。她一向诚实，便把荒原上的事从头讲了一遍，说有个小矮人从土丘里钻出来，是他赐下这般美貌。不过，她没有提起自己把午饭分给他吃。继母心想，既然去那里就能变漂亮，自己的女儿正该去一趟。"
        - id: ch01-b08
          speaker: narrator
          text: "第二天，她烙了最精细的饼，把亲生女儿打扮得漂漂亮亮，叫她赶羊出门。姑娘怕遇见什么东西，还带了根棍子防身。她从不干活，很不情愿拔石南。可才动手一会儿，红帽山精又钻了出来。"
        - id: ch01-b09
          speaker: bergman
          text: "是谁在掀我家的屋顶？"
        - id: ch01-b10
          speaker: stepsister
          text: "关你什么事？"
        - id: ch01-b11
          speaker: bergman
          text: "分一点午饭给我，我就不会伤害你。"
        - id: ch01-b12
          speaker: stepsister
          text: "午饭我自己吃得完。你非要东西不可，就尝尝我的棍子！"
        - id: ch01-b13
          speaker: narrator
          text: "姑娘举起棍子，狠狠打在山精头上。山精挨了这一击，也要送她三个愿望。"
        - id: ch01-b14
          speaker: bergman
          text: "你这姑娘心肠真坏！你已经够丑了，还要变成世上最丑的人。每次张嘴，都会有一只大癞蛤蟆掉出来，声音也会像公牛吼叫。第三个愿望，是让你死于非命。"
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: "姑娘傍晚回到家，母亲看见她变得这样丑，气得不得了，倒也怪不得她。可这还不是最糟的。等她亲眼看见大癞蛤蟆不断从女儿嘴里落下，又听见那嗓音像公牛一样轰轰响起，她就更加惊恼了。"
    - id: ch02
      title: "海上的阴谋"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "明眸姑娘的哥哥早已离家闯荡，在国王的宫里当差。这时，他获准回家看望妹妹。见妹妹变得如此美丽，他又惊喜又快活。回到宫里以后，他整日笑逐颜开，人人都想知道他为何这样高兴。他便告诉大家，因为自己家中有一位美丽无比的妹妹。哥哥的话传到国王耳中，姑娘的美名也早已传遍远近。国王于是召来这个年轻人，亲自问他外面的种种传闻是不是真的。"
        - id: ch02-b02
          speaker: brother
          text: "句句都是真的。我亲眼见过妹妹的美貌，也亲耳听过她唱歌。她的声音实在美妙。"
        - id: ch02-b03
          speaker: narrator
          text: "国王一听便一心想得到这位姑娘，命哥哥回家把她接来，因为这件差事交给别人，他都不放心。哥哥得到一艘船，也备齐一路所需之物，乘船回了家。继母一听说他的来意，立刻暗下决心，只要自己还有办法阻拦，这件婚事就休想成功。她绝不能让明眸姑娘得到这样的尊荣。"
        - id: ch02-b04
          speaker: narrator
          text: "她叫人给亲生女儿做了一身王后般华丽的衣裙，又给她戴上面具，遮住丑陋的面孔。她严令女儿，在国王答应成婚以前，绝不能摘下面具。随后，她假称亲生女儿只想陪明眸姑娘走上一程，让哥哥把两个妹妹都带上了船。"
        - id: ch02-b05
          speaker: narrator
          text: "船驶到海上，明眸姑娘刚走上甲板，继姐便照母亲的吩咐，猛推一把，将她推进水里。哥哥得知发生了什么，顿时悲痛万分，却又慌得没了主意。他没有勇气把真相说出来，也料想国王绝不会相信自己。思来想去，他最后只好继续向王宫航行，任由事情自己发展。"
        - id: ch02-b06
          speaker: narrator
          text: "事情果然像哥哥担心的那样。国王接见了面具下的姑娘，立刻同她成婚。可才过一夜，他就后悔了。第二天一早，房里遍地都是癞蛤蟆，连脚都快没处落。国王再看见新娘真正的面孔，顿时怒不可遏。他认定哥哥欺骗了自己，命人把这个年轻人扔进满是毒蛇的深坑。国王发这么大的火，不只是因为受了欺骗。最叫他恼恨的是，自己已经娶了这个丑陋的女人，往后一生都摆脱不了她。"
    - id: ch03
      title: "金羽鸭的三个夜晚"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "再说明眸姑娘。落水时，她正处在性命之危，幸好及时戴上了山精送的帽子，立刻变成一只鸭子。她跟在船后一路游去，第二天傍晚也来到国王的宫殿。鸭子摇摇摆摆地钻过排水沟，一直走进厨房。她的小狗正趴在炉边石板上。它受不了同丑陋的继姐待在华美的房间里，已经独自躲到了这里。鸭子跳到它身旁，同它说起话来。"
        - id: ch03-b02
          speaker: maiden_bright_eye
          text: "晚上好。"
        - id: ch03-b03
          speaker: dog
          text: "谢谢你，明眸姑娘。"
        - id: ch03-b04
          speaker: maiden_bright_eye
          text: "我的哥哥在哪里？"
        - id: ch03-b05
          speaker: dog
          text: "他在蛇坑里。"
        - id: ch03-b06
          speaker: maiden_bright_eye
          text: "我那狠毒的姐姐呢？"
        - id: ch03-b07
          speaker: dog
          text: "她同尊贵的国王在一起。"
        - id: ch03-b08
          speaker: maiden_bright_eye
          text: "唉，今晚我来了。往后还会再来两个晚上，接着就永远不来了。"
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: "鸭子说完便摇摇摆摆地离开了。几个女仆听见她和小狗交谈，大为惊奇。她们觉得这件事值得查个清楚。既然鸭子亲口说第二晚还会再来，大家便想等她出现时把她捉住。第二天晚上，许多人都守在厨房里看着。鸭子果然钻过排水沟，又走到趴在炉边石板上的小狗面前。"
        - id: ch03-b10
          speaker: maiden_bright_eye
          text: "晚上好。我的哥哥在哪里？"
        - id: ch03-b11
          speaker: dog
          text: "谢谢你，明眸姑娘。他在蛇坑里。"
        - id: ch03-b12
          speaker: maiden_bright_eye
          text: "我那狠毒的姐姐呢？"
        - id: ch03-b13
          speaker: dog
          text: "她同尊贵的国王在一起。"
        - id: ch03-b14
          speaker: maiden_bright_eye
          text: "唉，今晚我来了。往后只再来一个晚上，接着就永远不来了。"
          emotion: sad
        - id: ch03-b15
          speaker: narrator
          text: "她又从众人眼前溜走，谁也没能抓住。厨师却下定决心，第三晚一定要把她捉到。到了那天晚上，鸭子再次从排水沟钻进厨房，走到小狗身旁。"
        - id: ch03-b16
          speaker: maiden_bright_eye
          text: "晚上好。我的哥哥在哪里？"
        - id: ch03-b17
          speaker: dog
          text: "谢谢你，明眸姑娘。他在蛇坑里。"
        - id: ch03-b18
          speaker: maiden_bright_eye
          text: "我那狠毒的姐姐呢？"
        - id: ch03-b19
          speaker: dog
          text: "她同尊贵的国王在一起。"
        - id: ch03-b20
          speaker: maiden_bright_eye
          text: "唉，从今以后，我再也不会来了。"
          emotion: sad
        - id: ch03-b21
          speaker: narrator
          text: "鸭子刚溜出去，守在排水沟外的厨师便撒下网，一下将她罩住。"
        - id: ch03-b22
          speaker: narrator
          text: "厨师把鸭子带到众人面前。她是他们生平见过最美丽的鸭子，全身长着数也数不清的金色羽毛，人人都看得惊叹不已。谁也不知道该如何处置她，可大家听过那几夜的对话，明白她绝非寻常的鸟，便把她留下，十分用心地照料起来。"
    - id: ch04
      title: "明眸姑娘归来"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "这时候，蛇坑里的哥哥做了一个梦。他梦见亲妹妹变成鸭子，一路游到了国王的宫殿。梦里还告诉他，除非有人割掉她的鸭嘴，否则她永远无法恢复原来的模样。他设法把这个梦告诉别人，请人把消息传出去。国王终于听说了这件事，便命人把哥哥从蛇坑里拉上来，带到自己面前。"
        - id: ch04-b02
          speaker: king
          text: "你从前说妹妹美丽无比。现在，你能让她出现在我面前吗？"
        - id: ch04-b03
          speaker: brother
          text: "只要把那只鸭子和一把刀拿来，我就能做到。"
        - id: ch04-b04
          speaker: narrator
          text: "鸭子和刀很快都送到了哥哥面前。他把这只金羽鸭轻轻抱到近前。"
        - id: ch04-b05
          speaker: brother
          text: "要是我割掉你的鸭嘴尖，不知道你会变成什么模样。"
        - id: ch04-b06
          speaker: narrator
          text: "他从鸭嘴上割下一小块，鸭子体内立刻传出声音。"
        - id: ch04-b07
          speaker: maiden_bright_eye
          text: "哎哟，哎哟！你割到我的小手指啦！"
          emotion: surprised
        - id: ch04-b08
          speaker: narrator
          text: "转眼之间，明眸姑娘亭亭立在众人面前，依旧美得如同哥哥回家时所见。哥哥告诉国王，眼前的姑娘才是自己的亲妹妹。于是，继姐怎样将她推下海、又怎样戴着面具冒名嫁给国王的经过，也从头到尾真相大白。"
        - id: ch04-b09
          speaker: narrator
          text: "狠毒的继姐被装进一只四周钉满尖刺的木桶，再由六匹野马拖走，就这样丢了性命。国王见到真正的明眸姑娘，喜不自胜，立刻同她成婚，封她做了这个国家的王后。她的哥哥也从蛇坑里得到解救，做了国王的首相。"
