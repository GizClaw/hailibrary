  chapters:
    - id: ch01
      title: The Little Man in the Mound
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man and his wife who had two children, a boy and a girl. When the wife died, the man married again. His new wife had only one child, a daughter of her own. That girl was ugly and untidy. Her stepsister was a beautiful girl, and everyone knew her as Maiden Bright-eye.
        - id: ch01-b02
          speaker: narrator
          text: The stepmother hated Maiden Bright-eye because she was beautiful. She made the girl do all the hardest work, gave her very little to eat, and paid no attention to her. But the woman treated her own daughter as well as she could. That daughter was spared every difficult household task and always had the prettiest clothes to wear.
        - id: ch01-b03
          speaker: narrator
          text: Maiden Bright-eye also had to watch the sheep. Her stepmother would not let her be idle or enjoy herself even while she tended them. Out on the moor, she had to pull heather at the same time. The woman sent pancakes for her dinner, but she mixed ashes into the flour and made them as bad as she possibly could.
        - id: ch01-b04
          speaker: narrator
          text: The girl reached the moor and began pulling heather from the side of a little mound. At once, a tiny fellow in a red cap popped out.
        - id: ch01-b05
          speaker: bergman
          text: Who is tearing the roof off my house?
        - id: ch01-b06
          speaker: maiden_bright_eye
          text: Oh, it's only me, a poor little girl. My mother sent me to pull heather. If you'll be kind to me, I'll share my dinner with you.
        - id: ch01-b07
          speaker: narrator
          text: The little fellow gladly agreed, and she gave him the largest share of her pancakes. They were not good, but anything tastes welcome when you are hungry. He ate every bit she gave him.
        - id: ch01-b08
          speaker: bergman
          text: You are a good little girl, so I will give you three wishes. I shall choose them for you. You are beautiful now, but you will become lovelier than anyone else in the world. Whenever you open your mouth, a gold coin will fall out, and your voice will sound like the sweetest music. Last of all, you will marry the young king and become queen of this country.
        - id: ch01-b09
          speaker: bergman
          text: I will also give you this cap. Guard it well. If your life is ever in danger, put it on your head, and it can save you.
        - id: ch01-b10
          speaker: narrator
          text: Maiden Bright-eye thanked the little bergman again and again. That evening, she drove the sheep home. By then she had grown so beautiful that the people in her own home could hardly recognize her.
        - id: ch01-b11
          speaker: stepmother
          text: How did you come to look so beautiful?
        - id: ch01-b12
          speaker: narrator
          text: Maiden Bright-eye always told the truth, so she explained how a little man had appeared on the moor and given her this beauty. But she said nothing about sharing her dinner with him.
        - id: ch01-b13
          speaker: stepmother
          text: If a trip out there can make a girl beautiful, then my own daughter must go. She could certainly stand to be a little prettier.
        - id: ch01-b14
          speaker: narrator
          text: The next morning, the stepmother baked her daughter the finest cakes and dressed her prettily before sending her out with the sheep. The girl would not go without a stick to defend herself if anything came near.
        - id: ch01-b15
          speaker: narrator
          text: She had never been used to work and had no wish to pull heather. Still, she had barely begun when the same little fellow in the red cap appeared.
        - id: ch01-b16
          speaker: bergman
          text: Who is tearing the roof off my house?
        - id: ch01-b17
          speaker: stepsister
          text: What business is that of yours?
        - id: ch01-b18
          speaker: bergman
          text: Give me a little of your dinner, and I won't harm you.
        - id: ch01-b19
          speaker: stepsister
          text: You won't get my dinner. I can eat it myself. But if you must have something, you may have a blow from my stick.
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: She lifted the stick and struck the bergman over the head.
        - id: ch01-b21
          speaker: bergman
          text: What a wicked little girl! You will gain nothing from this. I will choose three wishes for you. You are ugly, and now you will become uglier than anyone on earth. Each time you open your mouth, a great toad will fall out, and your voice will roar like a bull. My third wish is that you will meet a violent death.
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: The girl went home that evening. Her mother was as upset as she could be when she saw how ugly her daughter had become. It was worse when great toads began falling from the girl's mouth and her voice came out like the roar of a bull.
    - id: ch02
      title: The King's Bride
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meanwhile, the stepson had gone out into the world and taken service at the king's palace. Around this time, he received permission to visit his sister. When he saw how lovely Maiden Bright-eye had become, he was so delighted that everyone noticed his happiness when he returned.
        - id: ch02-b02
          speaker: narrator
          text: He told everyone that he was happy because he had such a beautiful sister at home. The tale of her beauty spread far and wide. At last, both that report and the brother's praise reached the king. The king summoned the young man and asked whether everything being said about the girl was true.
        - id: ch02-b03
          speaker: brother
          text: Every word is true. I have seen her beauty myself. I have heard her sing, too, and her voice is wonderfully sweet.
        - id: ch02-b04
          speaker: narrator
          text: The king began to long for Maiden Bright-eye. He ordered her brother to go home and bring her back, for there was no one he trusted more to carry out the errand. The young man was given a ship and everything else he required, and he sailed home for his sister.
        - id: ch02-b05
          speaker: narrator
          text: As soon as the stepmother learned why he had come, she made up her mind to stop Maiden Bright-eye from receiving such an honor.
        - id: ch02-b06
          speaker: stepmother
          text: This must never happen if I can prevent it. She will not rise so high.
        - id: ch02-b07
          speaker: narrator
          text: She had a dress made for her own daughter, as splendid as a queen's finest robe. She also prepared a mask that made the girl look quite pretty, and warned her not to remove it until the king had promised to marry her.
        - id: ch02-b08
          speaker: narrator
          text: The brother set sail with both sisters. The stepmother pretended that her own daughter merely wished to keep Maiden Bright-eye company for part of the journey. But when they were far out at sea and Maiden Bright-eye stepped onto the deck, the stepsister followed her mother's orders. She pushed the girl overboard.
        - id: ch02-b09
          speaker: narrator
          text: When the brother learned what had happened, he was overcome with distress. He did not know what to do. He could not bring himself to tell the king the truth, and he did not expect the king to believe such a story. In the end, he kept sailing and decided to let things turn out as they would.
        - id: ch02-b10
          speaker: narrator
          text: Things happened just as he feared. The king welcomed the masked sister and married her at once. By the next morning, he bitterly regretted it. So many toads covered the room that he could scarcely set down a foot. Then he saw her true face.
        - id: ch02-b11
          speaker: narrator
          text: Furious at the brother, the king ordered him thrown into a pit full of serpents. He was angry because he had been deceived. Worse still, he believed there was no way to free himself from the ugly woman who was now tied to him for life.
    - id: ch03
      title: Three Evenings at the Hearth
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Now we return to Maiden Bright-eye. As she fell into the sea, she managed to put the bergman's cap on her head. Her life was in danger, and at once she became a duck.
        - id: ch03-b02
          speaker: narrator
          text: The duck swam after the ship and reached the king's palace the following evening. She waddled up through the drain and into the kitchen. Her little dog lay there on the hearthstone. It could not bear to remain in the fine rooms with the wicked sister, so it had taken shelter down in the kitchen. The duck hopped close enough to speak to it.
        - id: ch03-b03
          speaker: maiden_bright_eye
          text: Good evening.
        - id: ch03-b04
          speaker: dog
          text: Thank you, Maiden Bright-eye.
        - id: ch03-b05
          speaker: maiden_bright_eye
          text: Where is my brother?
        - id: ch03-b06
          speaker: dog
          text: He is in the serpent pit.
        - id: ch03-b07
          speaker: maiden_bright_eye
          text: And where is my wicked sister?
        - id: ch03-b08
          speaker: dog
          text: She is with the noble king.
        - id: ch03-b09
          speaker: maiden_bright_eye
          text: Alas, alas! I am here tonight. I will return for two more evenings, and then I will never come again.
          emotion: sad
        - id: ch03-b10
          speaker: narrator
          text: With that, the duck waddled away. Several servant girls had heard every word. They were amazed, and decided it would be worth catching the bird when it returned. They knew it had promised to come again.
        - id: ch03-b11
          speaker: narrator
          text: The next evening, the duck appeared just as she had said. Many people had gathered to watch. She came through the drain and waddled up to the dog on the hearthstone.
        - id: ch03-b12
          speaker: maiden_bright_eye
          text: Good evening.
        - id: ch03-b13
          speaker: dog
          text: Thank you, Maiden Bright-eye.
        - id: ch03-b14
          speaker: maiden_bright_eye
          text: Where is my brother?
        - id: ch03-b15
          speaker: dog
          text: He is in the serpent pit.
        - id: ch03-b16
          speaker: maiden_bright_eye
          text: And where is my wicked sister?
        - id: ch03-b17
          speaker: dog
          text: She is with the noble king.
        - id: ch03-b18
          speaker: maiden_bright_eye
          text: Alas, alas! I am here tonight. I will return for one more evening, and then I will never come again.
          emotion: sad
        - id: ch03-b19
          speaker: narrator
          text: Then she slipped away before anyone could catch her. The king's cook watched her go and formed a plan.
        - id: ch03-b20
          speaker: cook
          text: Tomorrow evening, I mean to catch you.
    - id: ch04
      title: The Golden Duck
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the third evening, the duck once more came waddling through the drain. She went straight to the dog beside the hearthstone.
        - id: ch04-b02
          speaker: maiden_bright_eye
          text: Good evening.
        - id: ch04-b03
          speaker: dog
          text: Thank you, Maiden Bright-eye.
        - id: ch04-b04
          speaker: maiden_bright_eye
          text: Where is my brother?
        - id: ch04-b05
          speaker: dog
          text: He is in the serpent pit.
        - id: ch04-b06
          speaker: maiden_bright_eye
          text: And where is my wicked sister?
        - id: ch04-b07
          speaker: dog
          text: She is with the noble king.
        - id: ch04-b08
          speaker: maiden_bright_eye
          text: Alas, alas! Now I will never come again.
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: The duck slipped out once more, but the cook was waiting at the far end of the drain with a net. As she emerged, he threw it over her and carried her inside.
        - id: ch04-b10
          speaker: narrator
          text: She was the most beautiful duck anyone had ever seen. She had so many golden feathers that everyone marveled at her. No one knew what should be done with the bird. Yet after hearing her speak with the dog on three evenings, they understood that there was something extraordinary about her, and they guarded her carefully.
    - id: ch05
      title: Maiden Bright-eye Returns
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: While this was happening, the brother dreamed in the serpent pit. In his dream, his true sister had swum to the king's palace as a duck. She could not regain her own shape until someone cut off her beak.
        - id: ch05-b02
          speaker: narrator
          text: He told someone about the dream, and in time the news reached the king. The king had him lifted from the pit and brought before him.
        - id: ch05-b03
          speaker: king
          text: Can you show me the sister you once described, as beautiful as you said she was?
        - id: ch05-b04
          speaker: brother
          text: I can, if you bring me the duck and a knife.
        - id: ch05-b05
          speaker: narrator
          text: The duck and the knife were brought to him. He looked at the bird.
        - id: ch05-b06
          speaker: brother
          text: I wonder how you would look if I cut the tip from your beak.
        - id: ch05-b07
          speaker: narrator
          text: He cut off a small piece of the beak. At once, a voice cried out.
        - id: ch05-b08
          speaker: maiden_bright_eye
          text: Oh! Oh! You cut my little finger!
          emotion: surprised
        - id: ch05-b09
          speaker: narrator
          text: The next moment, Maiden Bright-eye stood before them, just as lovely and beautiful as when her brother had visited her at home. He declared that this was his true sister. Then the whole story came out. Everyone learned how the other girl had treated Maiden Bright-eye and how she had taken her place.
        - id: ch05-b10
          speaker: narrator
          text: The wicked sister was placed in a barrel ringed with spikes. Six wild horses dragged it away, and that was the end of her.
        - id: ch05-b11
          speaker: narrator
          text: The king was delighted with Maiden Bright-eye and made her his queen at once. Her brother became his prime minister.
