audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    king:
      display_name: "国王"
      tts:
        delivery: "威严果断，情感深沉"
        timbre: "浑厚有力的男声"
        pace: "沉稳"
        pitch: "中低音"
    queen:
      display_name: "老王后"
      tts:
        delivery: "端庄温厚，心事深重"
        timbre: "柔和丰润的女声"
        pace: "舒缓"
        pitch: "中音"
    old_woman:
      display_name: "老妇人"
      tts:
        delivery: "神秘笃定，说话直截了当"
        timbre: "苍老低哑的女声"
        pace: "不疾不徐"
        pitch: "中低音"
    younger_prince:
      display_name: "小王子"
      tts:
        delivery: "年轻骄傲，直率听话"
        timbre: "清亮的青年男声"
        pace: "适中"
        pitch: "中音"
    king_lindorm:
      display_name: "林多姆王"
      tts:
        delivery: "起初阴沉威吓，恢复人形后庄重深情"
        timbre: "深沉洪亮的男声"
        pace: "稍慢"
        pitch: "低音"
    young_queen:
      display_name: "年轻王后"
      tts:
        delivery: "温柔勇敢，危急时镇定坚决"
        timbre: "温暖清澈的女声"
        pace: "从容"
        pitch: "中音"
    stepmother:
      display_name: "继母"
      tts:
        delivery: "虚情假意，甜言下藏着冷酷"
        timbre: "干涩圆滑的女声"
        pace: "稍慢"
        pitch: "中低音"
    retainer:
      display_name: "忠心的侍从"
      tts:
        delivery: "忠诚谨慎，语气庄重"
        timbre: "坚实沧桑的男声"
        pace: "沉稳"
        pitch: "低音"
    peter:
      display_name: "彼得"
      tts:
        delivery: "寡言忧郁，坦白时真诚"
        timbre: "粗粝低沉的男声"
        pace: "缓慢"
        pitch: "低音"
    evil_one:
      display_name: "恶魔"
      tts:
        delivery: "凶狠霸道，充满威胁"
        timbre: "阴冷粗哑的男声"
        pace: "缓慢有力"
        pitch: "极低音"
    evil_spirit_1:
      display_name: "恶鬼甲"
      tts:
        delivery: "尖刻嘲弄，来势汹汹"
        timbre: "尖细嘶哑的声音"
        pace: "急促"
        pitch: "高音"
    evil_spirit_2:
      display_name: "恶鬼乙"
      tts:
        delivery: "躁动阴险，语带讥笑"
        timbre: "粗糙漏气的声音"
        pace: "明快"
        pitch: "中低音"
    evil_spirit_3:
      display_name: "恶鬼丙"
      tts:
        delivery: "暴躁凶恶，咬牙切齿"
        timbre: "刺耳干涩的声音"
        pace: "忽快忽慢"
        pitch: "中高音"
  chapters:
    - id: ch01
      title: "岔路口的林蛇"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，一位国王和一位王后统治着辽阔富庶的国土。夫妻俩和睦幸福，只是多年没有孩子。国王虽然从不说出口，心里却一天比一天沉重。他怕王国没有继承人。王后看得出他的忧愁，自己也日日盼着能有一个孩子。"
        - id: ch01-b02
          speaker: narrator
          text: "一天，一个穷苦的老妇人来到城堡，想见王后。仆人不肯放叫花子进去，只递给她一枚便士，叫她离开。老妇人请他们捎句话，说宫门外有人能解开王后藏在心里的忧愁。王后一听，马上命人带她进来。"
        - id: ch01-b03
          speaker: old_woman
          text: "王后啊，你的忧愁我全知道。我正是来帮你的。你想要一个儿子。照我的话去做，你会得到两个。"
        - id: ch01-b04
          speaker: narrator
          text: "王后没想到这个陌生人竟知道她的秘密，惊讶之余，答应一切照办。"
        - id: ch01-b05
          speaker: old_woman
          text: "请人在你房里放一只浴盆，装满流动的清水。洗完以后，你会在盆底找到两只红洋葱。记住，要把两只都仔细剥净，再吃下去。时候一到，愿望就会实现。"
        - id: ch01-b06
          speaker: narrator
          text: "王后完全照她的话做了。沐浴过后，她在浴盆下找到两只红洋葱，大小和模样一模一样。她果然明白，老妇人绝不像外表那么寻常。王后高兴得忘乎所以，拿起一只洋葱，连皮全吃了。等她想起那句重要的叮嘱，第一只已经无法补救。她只好仔细剥净第二只，再把它吃掉。"
        - id: ch01-b07
          speaker: narrator
          text: "时候一到，老妇人的预言果真应验。王后头一个生下来的，却是条丑陋可怕的林蛇。只有贴身女仆看见。她趁别人不知情，把林蛇从窗口扔进了城堡旁的森林。接着降生的孩子，却是世上最漂亮的小王子。人们欢喜地把他抱给国王和王后，而这对父母根本不知道，小王子还有个被丢在荒野里的林蛇哥哥。"
        - id: ch01-b08
          speaker: narrator
          text: "整座王宫乃至全国都为漂亮的小王子欢庆，没人知道王后的长子正躺在野森林里。国王、王后和小王子一直幸福安稳地生活。王子长到二十岁时，父母也渐渐老了。他们希望入土以前看见儿子成婚，便叫他去别的王国寻找新娘。王子听从父母的安排，命人给镀金马车套好马，启程去求亲。"
        - id: ch01-b09
          speaker: narrator
          text: "可他才到第一个岔路口，就见一条巨大骇人的林蛇横在路中央，马儿只能停下。"
        - id: ch01-b10
          speaker: king_lindorm
          text: "你要到哪儿去？"
        - id: ch01-b11
          speaker: younger_prince
          text: "与你无关。我是王子，想往哪儿走都可以。"
        - id: ch01-b12
          speaker: king_lindorm
          text: "回去。我知道你要去求亲。可我若没有伴侣，没能同她共枕，你也别想娶到新娘。"
        - id: ch01-b13
          speaker: narrator
          text: "王子回宫说出经过。父母让他第二天再试，也许能绕过林蛇。可是第二天，林蛇仍在原处。第三天，王子又被它拦下。这一回，林蛇的声音满是威胁。除非先给它找到伴侣，否则王子永远不能去求亲。"
        - id: ch01-b14
          speaker: narrator
          text: "同样的事情接连发生三次，国王和王后实在想不出别的办法，只好把林蛇请进宫，答应给它找个伴侣。他们觉得，这种怪物不论得到什么女人都该满意，便强迫一个女奴做它的新娘。可到了早晨，女奴已经被撕成碎片。后来，他们每强迫一个女人嫁给林蛇，同样的惨事都会发生。"
        - id: ch01-b15
          speaker: narrator
          text: "消息传遍全国，一个继母听了格外高兴。她丈夫和前妻生有一个女儿，容貌胜过所有姑娘，性情又温柔善良，人人都喜欢她。继母也有个成年女儿，却又丑又讨人嫌。站在美丽的继姐妹身旁，越发显得丑陋恶毒。"
        - id: ch01-b16
          speaker: narrator
          text: "继母早就因为继女比亲生女儿漂亮，恨得心里发苦。如今，她听说王宫里的林蛇会撕碎每一位新娘，还点名要娶漂亮姑娘，立刻想出了一条毒计。她赶去见国王，打算借林蛇的手除掉继女。"
        - id: ch01-b17
          speaker: stepmother
          text: "我的继女愿意嫁给林蛇。这样，您唯一的王子就能去远方寻找自己的新娘了。"
        - id: ch01-b18
          speaker: narrator
          text: "国王听说有人自愿嫁给林蛇，高兴极了，马上命人把姑娘接进宫。使者到来时，姑娘吓坏了。她知道自己从没说过这种话，一定是恶毒的继母想借这种办法取她性命。她苦苦恳求，只希望获准在父亲家里再住一夜。使者答应了她。"
        - id: ch01-b19
          speaker: narrator
          text: "姑娘来到母亲坟前，哀叹自己就要被送给林蛇，又恳切地请母亲赐她一个主意。谁也不知道她伏在坟边哭了多久，只知道她后来睡着了，一直睡到太阳升起。可她站起来时，心里的恐惧已经消失，反而觉得轻快欢喜。她在附近的田野里仔细寻找，找到了三颗坚果，小心地收进口袋。"
        - id: ch01-b20
          speaker: young_queen
          text: "等我遇上真正的大难，就敲开一颗。"
        - id: ch01-b21
          speaker: narrator
          text: "她回到家，这一回心甘情愿地随使者进宫。大家看见这位美丽姑娘，都怜惜她将要遭遇的命运，她自己却鼓起了勇气。姑娘请王后另换一间新房，不用林蛇过去成婚的屋子。她又要一锅烧热的烈碱水和三把崭新的硬毛刷。王后命人一一备齐。姑娘穿上七件干净雪白的衬衣，同林蛇举行了婚礼。"
    - id: ch02
      title: "七张蛇皮"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "新房里只剩新娘和林蛇时，林蛇用吓人的声音下了命令。"
        - id: ch02-b02
          speaker: king_lindorm
          text: "把衣服脱掉。"
        - id: ch02-b03
          speaker: young_queen
          text: "你先脱。"
        - id: ch02-b04
          speaker: king_lindorm
          text: "从前的新娘从没这样要求过我。"
          emotion: surprised
        - id: ch02-b05
          speaker: young_queen
          text: "可我就是这样要求你。"
        - id: ch02-b06
          speaker: narrator
          text: "林蛇扭动着，呻吟着，沉重地喘息，终于蜕下最外面那层可怕的皮。新娘也脱下一件白衬衣，盖在蛇皮上。"
        - id: ch02-b07
          speaker: narrator
          text: "林蛇又叫她脱衣，她仍叫林蛇先脱。林蛇只能服从。它一边呻吟，一边忍着疼，一层接一层蜕皮。每蜕下一层，姑娘才脱掉一件衬衣，扔到对应的蛇皮上。最后，地上铺了七张蛇皮、六件白衬衣。姑娘还穿着第七件，林蛇却只剩一团黏滑、没有形状的身体。"
        - id: ch02-b08
          speaker: narrator
          text: "姑娘抓起硬毛刷，蘸着烈碱水，使出全身力气刷洗。最后一把刷子也快磨坏时，世上最俊美的青年站在了她面前。"
        - id: ch02-b09
          speaker: king_lindorm
          text: "谢谢你解除我身上的魔法。我才是国王和王后的长子，也是王国的继承人。你答应过林蛇，要同它分享一切。如今，你还愿意履行婚约吗？"
        - id: ch02-b10
          speaker: young_queen
          text: "我愿意。"
          emotion: happy
        - id: ch02-b11
          speaker: narrator
          text: "从前每次林蛇成婚，国王都会派一名侍从在第二天清晨打开新房，看看新娘是否还活着。这天早晨，侍从也从门缝向里看了一眼。眼前的景象太不可思议，他惊得马上关好门，匆匆奔去向等待消息的国王和王后禀报。新房地上铺着七张蛇皮、六件白衬衣，旁边还有三把磨坏的硬毛刷。可床上却睡着一位俊美青年，身边正是那位美丽的姑娘。"
        - id: ch02-b12
          speaker: narrator
          text: "国王和王后正在惊疑，故事开头的老妇人又来了。"
        - id: ch02-b13
          speaker: old_woman
          text: "你当初没有听我的话。第一只洋葱连皮吃下，所以头生子才会变成林蛇。"
        - id: ch02-b14
          speaker: narrator
          text: "贴身女仆被传来问话，只得承认，王后生下林蛇以后，是她把它从窗口扔进了森林。国王和王后马上召来长子和年轻的新娘，把两人紧紧抱在怀里。他们又请长子讲一讲，这二十年来，他怎样以一条丑陋林蛇的模样独自生活在森林里。长子把自己的苦难全说了出来。"
        - id: ch02-b15
          speaker: narrator
          text: "听完以后，父母昭告全国，他是国王的长子，将来要和妻子一同继承王国。"
        - id: ch02-b16
          speaker: narrator
          text: "林多姆王子和美丽的妻子在宫中过了一段幸福日子。不久，老国王去世，王子继承全部国土。没过多久，母亲也离开了人世。"
    - id: ch03
      title: "被调换的书信"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "后来，一个敌国向年轻的林多姆王宣战。国王料到，这场战争至少会让他三年不能回到自己的国土，不能回到妻子身边。他命令所有留守的仆人，一定要用心保护王后。为了能秘密通信，他让人打造两枚一模一样的印戒，夫妻各留一枚。他还下令，谁敢私自拆开盖有其中一枚印章的信，谁就会被处死。安排好一切，国王告别妻子，率军出征。"
        - id: ch03-b02
          speaker: narrator
          text: "恶毒的继母听说继女不仅从林蛇手下活了下来，还成了一国王后，气得不行。她日夜盘算着怎样毁掉继女的幸福。趁林多姆王在外打仗，她来到王宫，满口都是好听的话，装出一副慈爱的样子讨好王后。"
        - id: ch03-b03
          speaker: stepmother
          text: "我早就看出，你命中注定会成为了不起的人物。正因为这样，我才安排你嫁给那位中了魔法的王子。"
        - id: ch03-b04
          speaker: narrator
          text: "年轻王后不相信世上有人会如此奸诈，便热情接纳继母，把她留在身边。"
        - id: ch03-b05
          speaker: narrator
          text: "不久，王后生下两个孩子，都是任谁看见都会赞叹的漂亮男孩。她写好一封信，要把喜讯告诉远方的国王。继母提出替她梳头，说要像王后亲生母亲过去那样照料她。王后毫无防备地答应了。继母慢慢梳着，直到王后沉沉睡去。随后，她从王后的颈上摘下印戒，换掉原信。那封假信上写着，王后生下了两只小狗崽。"
        - id: ch03-b06
          speaker: narrator
          text: "国王收到信，难过极了。可他想到自己曾做了二十年林蛇，最终仍被妻子救下，便写信嘱咐最信任的侍从，好好照顾王后和那两只小狗崽。"
        - id: ch03-b07
          speaker: narrator
          text: "继母截下回信，重新写了一封，假称国王下令把王后和两位小王子绑上火刑柱。她又用王后的印章封好信。那枚印章和国王的一模一样。"
        - id: ch03-b08
          speaker: narrator
          text: "侍从读到国王的命令，既震惊又悲伤，怎么也想不出国王为什么要这样做。他实在不忍杀害三个无辜的人，便命人点起一堆大火，在里面烧掉一只母羊和两只小羊羔，好让百姓以为命令已经执行。继母早已把那道假命令传扬出去，还添上一句，说王后是个邪恶的女巫。"
        - id: ch03-b09
          speaker: narrator
          text: "忠心的侍从告诉王后，国王要她在战争结束以前藏在宫里，除了侍从，谁也不能见她和孩子。王后照办了，外面的人都以为母子三人已经死去。"
        - id: ch03-b10
          speaker: narrator
          text: "三年过去，林多姆王就快回来了。老侍从想到自己没有执行信上的命令，心里越来越害怕。他终于找到王后，把调换书信以后发生的一切全说了出来，又拿出那封假冒的国王书信，让王后亲眼看见烧死母子三人的命令。最后，他恳求王后赶在国王回来以前离开王宫。"
    - id: ch04
      title: "森林里的三颗坚果"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "王后带着两个小儿子走进荒野森林。他们走了一整天，连一户人家也没遇见，个个筋疲力尽。后来，王后看见一个男人背着几块鹿肉走来。那人衣衫破旧，模样凄苦，可王后很高兴终于遇见了活人。她连忙上前询问，哪里能给她和两个年幼的孩子一片屋顶，让他们安安稳稳过上一夜。"
        - id: ch04-b02
          speaker: peter
          text: "我在林子里有间小屋，你们可以在那里歇息。不过我远离人群，独自过活，除了屋子、一匹马和一条猎犬，什么也没有。我全靠打猎生活。"
        - id: ch04-b03
          speaker: narrator
          text: "王后带着孩子跟男人来到小屋，在那里歇了一夜。第二天早晨醒来，男人已经出门打猎。她便收拾房间，准备饭菜。男人回来时，只见屋里处处干净整齐，食物也已经做好，看起来颇为高兴。不过，他仍然不爱说话，只告诉王后，自己名叫彼得。"
        - id: ch04-b04
          speaker: narrator
          text: "当天晚些时候，彼得又骑马进了森林。王后望着他的背影，觉得这个人实在很不快乐。趁他不在，她把小屋更仔细地看了一遍，发现一只盛水的木桶里泡着许多染满鲜血的衬衣。王后很惊讶，却以为那是彼得把猎物扛回家时沾上的鹿血。她把衣服一件件洗净，挂起来晾干，见到彼得后也什么都没问。"
        - id: ch04-b05
          speaker: narrator
          text: "日子一天天过去。王后发现，彼得每天从森林骑马回来，身上都穿着一件血衣。他会把它脱下来，再换上干净的衬衣。王后终于明白，那些血绝不是搬运鹿肉时染上的。一天，她鼓起勇气，问彼得到底发生了什么。彼得起初怎么也不肯说。王后便先讲出自己的遭遇，也告诉他，自己曾怎样救出中了魔法的林蛇。"
        - id: ch04-b06
          speaker: peter
          text: "我从前过着放荡的日子，最后还同恶魔签下一纸契约。契约没有到期，我已经悔过，离开邪路，独自躲进这片荒野。恶魔再也不能抓走我，可契约仍在它手中。只要它握着那张纸，就能逼我每天在固定时刻进森林，让恶鬼把我抽打得满身是血。"
        - id: ch04-b07
          speaker: narrator
          text: "第二天，彼得又该骑马进森林了。王后请他留在家中照看两个小王子，由她代替彼得去见恶鬼。彼得大吃一惊。他说，王后这样做不但会赔上性命，还会给他招来比眼下更大的灾祸。王后叫他不要害怕，又检查了一遍母亲坟边找到的三颗坚果。随后，她骑上彼得的马，带着他的猎犬，独自向森林深处走去。"
        - id: ch04-b08
          speakers: [evil_spirit_1, evil_spirit_2, evil_spirit_3]
          ensemble: chorus
          text: "彼得的马来了，彼得的猎犬也来了，可彼得自己没来！"
        - id: ch04-b09
          speaker: narrator
          text: "远处传来一个可怕的声音，厉声问她想要什么。"
        - id: ch04-b10
          speaker: young_queen
          text: "我是来拿回彼得那份契约的。"
        - id: ch04-b11
          speaker: narrator
          text: "恶鬼顿时吵成一片，其中最可怕的声音压过了它们。"
        - id: ch04-b12
          speaker: evil_one
          text: "回去告诉彼得，他明天来时，要挨平常两倍的鞭子！"
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: "王后敲开第一颗坚果，调转马头。所有树木忽然迸出火星，恶鬼们像挨着鞭子一样惨叫，被赶回自己的巢穴。"
        - id: ch04-b14
          speaker: narrator
          text: "第二天同一时刻，王后又骑进了森林。这一次，恶鬼吃过苦头，不敢再靠她那么近。可它们还是不肯交出契约，还恶狠狠地威胁王后和彼得。王后敲开第二颗坚果，身后的整座森林顿时仿佛烧起冲天大火。恶鬼们的号叫比前一天更加凄厉，可无论怎样惨叫，它们仍没有交出契约。"
        - id: ch04-b15
          speaker: narrator
          text: "如今，王后只剩最后一颗坚果。可为了把彼得从恶魔手中救出来，她连这一颗也甘愿舍弃。第三天，她刚刚接近恶鬼出没的地方，便马上敲开坚果。这一回，她看不见恶鬼们究竟遭遇了什么，只听见疯狂的尖叫和哀号响彻林间。闹声终于停下时，一根长树枝远远伸到她面前，枝头递着彼得的那纸契约。"
        - id: ch04-b16
          speaker: narrator
          text: "王后欢喜地骑回小屋。彼得一直在那里提心吊胆，如今比她还要欢喜。从这一刻起，恶鬼再也不能伤害他了。"
    - id: ch05
      title: "一家人重逢"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "与此同时，林多姆王结束战争，回到王宫。他进门便问起王后和两只小狗崽。侍从们听得莫名其妙。他们说，王后生的是两位漂亮王子，可国王下令把母子三人烧死了。"
        - id: ch05-b02
          speaker: narrator
          text: "国王又悲伤又愤怒，脸色一下变得煞白。他立刻传来那位最信任的侍从，因为自己当初明明写信叫这个人好好照看王后和小狗崽。侍从却拿出收到的那封信，上面清清楚楚写着，要把王后和孩子烧死。两封信里的命令完全不同。到了这时，国王和在场的人终于明白，有人暗中设下了可怕的骗局。"
        - id: ch05-b03
          speaker: retainer
          text: "陛下，我没有杀害王后和两位王子。我只烧了一只母羊和两只小羊羔，又把他们藏在宫中三年。可是您快回来时，我害怕自己违抗了命令，便让王后带着孩子去了森林。"
        - id: ch05-b04
          speaker: narrator
          text: "国王听说妻儿还活着，悲痛总算减轻了一些。他决定亲自走进森林，寻找王后和两个孩子。若能找到，他就带他们一起回来。若是找不到，他便永远不再踏进王宫。到了那种时候，这位救下王后和两位王子的忠臣，应当代替他做一国之王。"
        - id: ch05-b05
          speaker: narrator
          text: "林多姆王独自走进荒野森林。第一天，他走了整整一天，没有看见半个人影。第二天也是这样。到了第三天，他绕过许多弯路，终于走到彼得的小屋。他走进去，请求主人准许自己在长凳上歇一会儿。王后和两个孩子都在那里。可王后衣衫破旧，满面忧愁，国王没有认出她。两个男孩也只裹着粗糙的兽皮，他更没想到那会是自己的亲生儿子。"
        - id: ch05-b06
          speaker: narrator
          text: "国王实在太累，刚在长凳上躺下不久，便沉沉睡着了。那条长凳十分狭窄，睡梦中，他的一条胳膊滑落下来，一直垂在凳边。衣衫破旧的王后却一眼就认出了丈夫，只是心里仍有畏惧，不敢马上表明自己的身份。"
        - id: ch05-b07
          speaker: young_queen
          text: "孩子，去把你父亲的胳膊抬回长凳上。"
        - id: ch05-b08
          speaker: narrator
          text: "一个小王子走过去，抱起国王的胳膊。可他年纪太小，没能轻轻把胳膊放好，国王一下惊醒了。他起初还以为自己进了强盗窝，随后决定不动声色，继续装睡，看看屋里究竟住着什么人。他安静躺了一会儿，发现谁也没有走动，便故意又让胳膊慢慢滑到凳边。"
        - id: ch05-b09
          speaker: young_queen
          text: "孩子，你去把父亲的胳膊放回凳上。不过轻一点，别像哥哥刚才那么粗手粗脚。"
        - id: ch05-b10
          speaker: narrator
          text: "这一次，一双小手轻轻托起他的胳膊，小心地放回长凳。国王睁开眼睛，终于认出了自己的王后，也看见了两个亲生儿子。他猛地从凳上跳起来，把母子三人一同紧紧抱进怀里。"
        - id: ch05-b11
          speaker: narrator
          text: "国王欢欢喜喜地带着妻子和孩子回宫，也邀请彼得同行，连彼得的马和猎犬也一起带走。王宫里顿时欢声雷动，整个王国都沉浸在无边的喜悦里。害得这一家人分离三年的恶毒继母，则被绑上火刑柱烧死了。"
        - id: ch05-b12
          speaker: narrator
          text: "林多姆王和王后从此长久而幸福地生活在一起。有人说，要是他们至今还没有死，那么直到今天，他们一定仍在人世。"
