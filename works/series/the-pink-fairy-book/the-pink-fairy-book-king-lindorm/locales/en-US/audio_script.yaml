  chapters:
    - id: ch01
      title: The Lindorm at the Crossroads
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a king and queen ruled a great and wealthy kingdom. They were happy together, but as the years went by, the king grew heavyhearted because they had no child. He never spoke of it to the queen. Even so, she could see how deeply it troubled him that there was no heir, and she longed each day for a child of her own.
        - id: ch01-b02
          speaker: narrator
          text: One day, a poor old woman came to the castle and asked to see the queen. The royal servants would not admit a beggar. They offered her a penny and told her to leave. Then she asked them to carry one message inside. Someone stood at the palace gate who could help the queen with her secret sorrow. When the queen heard this, she ordered them to bring the woman in.
        - id: ch01-b03
          speaker: old_woman
          text: Your sorrow is no secret to me, my queen, and I have come to help. You want a son. Follow my directions, and you will have two.
        - id: ch01-b04
          speaker: narrator
          text: The queen was astonished that this stranger knew her hidden wish, and she promised to do as the woman said.
        - id: ch01-b05
          speaker: old_woman
          text: Have a bath placed in your room and fill it with running water. After you bathe, you will find two red onions beneath it. Peel them both with great care, and eat them. In time, your wish will come true.
        - id: ch01-b06
          speaker: narrator
          text: The queen followed every direction. Beneath the bath she found two onions, alike in size and appearance. Now she knew the old woman had been more than she seemed. In her delight, she swallowed the first onion with every bit of its skin. Only then did she remember that both onions had to be peeled. It was too late to undo her mistake, so she carefully peeled the second onion and ate it too.
        - id: ch01-b07
          speaker: narrator
          text: In time, the old woman's promise came true, though not as the queen expected. Her first child was a hideous serpent called a lindorm. Only the waiting-woman saw it. Before anyone else could learn what had happened, she threw the creature through the window into the forest beside the castle. The queen's second child was a beautiful little prince. He was carried proudly before the king and queen, and neither parent knew that his elder brother lay hidden among the wild trees.
        - id: ch01-b08
          speaker: narrator
          text: The whole country rejoiced over the young prince. He lived happily with his parents until he was twenty. Then they asked him to travel to another kingdom and find a bride. They were growing old, and they wished to see him married before they died. The prince obeyed. He harnessed his horses to a gilded chariot and set out.
        - id: ch01-b09
          speaker: narrator
          text: At the first crossroads, an enormous and terrible lindorm lay stretched across the road. The horses had to stop.
        - id: ch01-b10
          speaker: king_lindorm
          text: Where do you think you are going?
        - id: ch01-b11
          speaker: younger_prince
          text: That is no concern of yours. I am the prince, and I may drive wherever I please.
        - id: ch01-b12
          speaker: king_lindorm
          text: Go home. I know why you are traveling, but you will have no bride until I have found a mate and slept beside her.
        - id: ch01-b13
          speaker: narrator
          text: The prince turned his chariot around and returned to the palace. He told his parents exactly what had blocked him at the crossroads. They thought he should try again the next morning. Perhaps this time he could pass the creature and continue into another kingdom. But when he reached the first crossroads, the lindorm lay across the road once more and stopped him in the same way. The prince tried for a third time the following day. Again the lindorm barred his path, and now its voice was threatening. Until the lindorm found a mate, the prince would never be allowed to seek a bride.
        - id: ch01-b14
          speaker: narrator
          text: After hearing this for the third time, the king and queen could think of only one plan. They invited the lindorm to the palace and promised to find him a bride. Surely such a monster would be satisfied with anyone they gave him. They forced a slave woman to marry him, but in the morning she lay torn to pieces. They tried again with another woman, and the same dreadful thing happened. Every bride they compelled to enter his chamber was dead by dawn.
        - id: ch01-b15
          speaker: narrator
          text: Before long, everyone in the country had heard the tale. One woman was especially pleased by the news. She was a second wife, and her husband had a daughter from his first marriage. That girl was more beautiful than any other maiden, and so gentle and good that everyone loved her. The second wife had a grown daughter too. Her own daughter was ugly and disagreeable, and beside her lovely stepsister she seemed uglier and more wicked still.
        - id: ch01-b16
          speaker: narrator
          text: The stepmother had long hated her stepdaughter for being more beautiful than her own child. Once she heard that the lindorm demanded a beautiful bride and killed every woman sent to him, she went straight to the king.
        - id: ch01-b17
          speaker: stepmother
          text: My stepdaughter wishes to marry the lindorm. Then your only prince will be free to travel away and seek a bride of his own.
        - id: ch01-b18
          speaker: narrator
          text: The king was delighted. If the lindorm accepted this bride, his younger son could finally continue his own journey. He ordered the maiden brought to the palace at once. When the royal messengers came for her, she was terrified. She understood that she had never offered herself at all. Her wicked stepmother had invented the claim as a way to take her life. The maiden begged to spend one final night in her father's house, and the messengers granted her request.
        - id: ch01-b19
          speaker: narrator
          text: The maiden went to her mother's grave. There she mourned the cruel fate that would give her to the lindorm, and she begged her dead mother to guide her. No one could say how long she lay beside the grave and wept. What is certain is that she fell asleep there and did not wake until the sun rose. When she stood up, the fear had left her and her heart felt happy. She began searching the fields nearby, though she did not yet know what she would find. Before long, she discovered three nuts and tucked them carefully into her pocket.
        - id: ch01-b20
          speaker: young_queen
          text: When I am in very great danger, I must crack one of these nuts.
        - id: ch01-b21
          speaker: narrator
          text: She returned home, then willingly left with the king's messengers. Everyone at the palace pitied the beautiful maiden, but she stayed brave. She asked the queen for a different bridal chamber from the one the lindorm had used before. Next she asked for a pot of strong lye to be heated over the fire and for three new scrubbing brushes. The queen ordered it all prepared. Then the maiden put on seven clean, snow-white shirts and married the lindorm.
    - id: ch02
      title: Seven Skins and Seven Shirts
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When the bride and the lindorm were alone in the new chamber, he spoke to her in a threatening voice.
        - id: ch02-b02
          speaker: king_lindorm
          text: Take off your clothes.
        - id: ch02-b03
          speaker: young_queen
          text: You must undress first.
        - id: ch02-b04
          speaker: king_lindorm
          text: None of the others ever told me to do that.
          emotion: surprised
        - id: ch02-b05
          speaker: young_queen
          text: I am telling you now.
        - id: ch02-b06
          speaker: narrator
          text: The lindorm writhed and groaned. His breath came heavily, but at last he cast off his outer skin. It dropped to the floor, horrible to see. The bride removed one snow-white shirt and threw it over that skin.
        - id: ch02-b07
          speaker: narrator
          text: Again he ordered her to undress, and again she made him go first. Groaning in pain, the lindorm shed another skin. The bride answered by taking off another shirt. This went on until seven lindorm skins and six white shirts covered the floor. The bride still wore her seventh shirt. Before her, the lindorm had become a shapeless, slimy mass.
        - id: ch02-b08
          speaker: narrator
          text: She seized the brushes and scrubbed him with the strong lye using all her strength. By the time the last brush was nearly worn away, the loveliest young man in the world stood before her.
        - id: ch02-b09
          speaker: king_lindorm
          text: You have freed me from the enchantment. I am the eldest son of the king and queen, and I am heir to this kingdom. Will you keep the promise you made when I was a lindorm and share everything with me?
        - id: ch02-b10
          speaker: young_queen
          text: Yes, I will.
        - id: ch02-b11
          speaker: narrator
          text: After every lindorm wedding, one of the king's retainers had been sent to the chamber at dawn to see whether the bride had survived. So the next morning, a retainer came to the new room and peeped through the door. What he saw startled him so greatly that he pulled the door shut at once and ran to the king and queen, who were waiting for his report. Seven lindorm skins lay across the floor. Beside them were six snow-white shirts and three brushes worn almost to nothing. Yet the maiden was alive, and a beautiful young man lay sleeping next to her.
        - id: ch02-b12
          speaker: narrator
          text: The king and queen could not understand what it meant. Just then, the old woman from the beginning of the tale was brought before the queen.
        - id: ch02-b13
          speaker: old_woman
          text: You did not follow my directions. You ate the first onion with all its skins, and that is why your first child was born a lindorm.
        - id: ch02-b14
          speaker: narrator
          text: The waiting-woman was called in, and she admitted that she had thrown the lindorm from the window into the forest. The king and queen sent for their eldest son and his bride. They held them both in their arms, then asked their son to tell them of the sorrowful twenty years he had spent in the forest as that hideous creature.
        - id: ch02-b15
          speaker: narrator
          text: When he had told them everything, his parents sent a proclamation across the country. He was their eldest son, and he and his wife would inherit the kingdom after them.
        - id: ch02-b16
          speaker: narrator
          text: Prince Lindorm and his beautiful wife lived happily at the palace. Not long afterward, his father died, and the prince became king of the whole country. His mother died soon after that.
    - id: ch03
      title: The False Letters
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Then an enemy declared war on the young king. King Lindorm knew the campaign would keep him from his country and his queen for at least three years. Before leaving, he ordered every servant who remained at home to guard her with the greatest care. He also wanted the two of them to write without anyone reading their letters. For that reason, he had two matching seal rings made, one for himself and one for her. He declared that anyone who opened a letter bearing either seal would be put to death. Then he said farewell to his queen and marched away to war.
        - id: ch03-b02
          speaker: narrator
          text: The queen's wicked stepmother had been bitterly unhappy to learn how well her stepdaughter had prospered. The maiden she had meant to destroy had saved her own life and become queen. Now the stepmother was always plotting to ruin her good fortune.
        - id: ch03-b03
          speaker: narrator
          text: While King Lindorm was away, the woman came to the palace and spoke sweetly to the queen.
        - id: ch03-b04
          speaker: stepmother
          text: I always knew you were meant to become someone great. That is why I arranged for you to marry the enchanted prince.
        - id: ch03-b05
          speaker: narrator
          text: The trusting queen could not imagine that anyone might be so deceitful. She welcomed her stepmother and kept the woman near her.
        - id: ch03-b06
          speaker: narrator
          text: Before long, the queen gave birth to two children, the prettiest little boys anyone had ever seen. She wrote to tell the king. Then her stepmother offered to comb her hair, just as her own mother once had. The queen agreed, and the woman combed until she fell asleep. While she slept, the stepmother took the seal ring from around her neck. She replaced the queen's letter with one claiming that the queen had given birth to two whelps.
        - id: ch03-b07
          speaker: narrator
          text: The news caused King Lindorm great sorrow. Then he remembered that he too had lived for twenty years as a lindorm, until his young queen freed him from the spell. He wrote to his most trusted retainer and ordered him to care for the queen and her two whelps until the king returned.
        - id: ch03-b08
          speaker: narrator
          text: But the stepmother stole this letter as well. She wrote a different one, saying that the king commanded the queen and the two little princes to be burned at the stake. Then she sealed it with the queen's ring, which looked exactly like the king's.
        - id: ch03-b09
          speaker: narrator
          text: The trusted retainer was horrified and grieved. He could see no reason for such an order, and he could not bring himself to kill three innocent people. Instead, he had a great fire built and burned a sheep and two lambs. The stepmother had already told everyone about the command and claimed that the queen was a wicked sorceress. Now the people believed the sentence had been carried out.
        - id: ch03-b10
          speaker: retainer
          text: The king has ordered you to remain hidden in the castle while he is at war. No one but me may see you or the little princes.
        - id: ch03-b11
          speaker: narrator
          text: The queen obeyed. Everyone else believed that she and her children were dead. For three years, the retainer kept them hidden in the palace.
        - id: ch03-b12
          speaker: narrator
          text: As the time for King Lindorm's return drew near, the old retainer became frightened. Until then, he had protected the queen by hiding the truth from her. Now he feared what would happen when the king discovered that his written order had been disobeyed. The retainer went to the queen and confessed everything. He placed the sealed letter before her so she could read the command to burn her and the princes. Then he begged her to leave the palace before the king came home.
        - id: ch03-b13
          speaker: narrator
          text: The queen took her two little boys and walked into the wild forest. They traveled all day without finding a single house, and soon all three were exhausted. Then the queen saw a man carrying venison. He looked poor and miserable, but she was glad to meet another person.
        - id: ch03-b14
          speaker: young_queen
          text: Do you know anywhere my little children and I might have a roof over us tonight?
        - id: ch03-b15
          speaker: peter
          text: I have a small hut in the forest, and you may rest there. But I live far from everyone. I own nothing except the hut, a horse, and a dog, and I feed myself by hunting.
        - id: ch03-b16
          speaker: narrator
          text: The queen followed him home and spent the night there with her sons. By the time she woke, the man had already gone hunting. She tidied the room and prepared food. He seemed pleased when he returned and found everything in order, though he said very little. He told her only that his name was Peter.
    - id: ch04
      title: The Three Nuts in the Forest
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Later that day, Peter rode into the forest looking deeply unhappy. While he was gone, the queen looked more closely around the hut. She found a tub of shirts soaking in water, and every shirt was stained with blood. At first she supposed the blood came from the deer Peter carried home. She washed the shirts, hung them to dry, and said nothing.
        - id: ch04-b02
          speaker: narrator
          text: As time passed, she noticed that Peter returned each day in a bloody shirt and immediately changed into a clean one. The stains could not be from the deer. One day, she gathered her courage and asked him to explain.
        - id: ch04-b03
          speaker: narrator
          text: Peter refused at first. Then the queen told him her own story and explained how she had freed the lindorm. At last, he trusted her with his secret.
        - id: ch04-b04
          speaker: peter
          text: I once lived a wild and wicked life, and in the end I signed a written contract with the Evil Spirit. Before the contract reached its end, I repented. I turned away from my old ways and withdrew to this lonely forest. Because I changed my life, the Evil One lost the power to take me away. But he still holds the paper I signed. As long as he has it, he can force me to ride to one place in the forest at the same hour every day. The evil spirits wait for me there, and they beat me until I bleed.
        - id: ch04-b05
          speaker: narrator
          text: The next day, when the hour came for Peter to ride away, the queen asked him to stay in the hut and watch the little princes. She would go to meet the evil spirits in his place.
        - id: ch04-b06
          speaker: peter
          text: They will kill you, and what they do afterward will bring me even greater misery than I suffer now.
          emotion: fearful
        - id: ch04-b07
          speaker: young_queen
          text: Take courage. I will go.
          emotion: calm
        - id: ch04-b08
          speaker: narrator
          text: She made sure the three nuts from beside her mother's grave were still in her pocket. Then she mounted Peter's horse and rode into the forest with his hound. After she had gone some distance, the evil spirits appeared.
        - id: ch04-b09
          speakers: [evil_spirit_1, evil_spirit_2, evil_spirit_3]
          ensemble: chorus
          text: That is Peter's horse, and there is Peter's hound. But where is Peter?
        - id: ch04-b10
          speaker: narrator
          text: From far away came a terrible voice.
        - id: ch04-b11
          speaker: evil_one
          text: What do you want here?
        - id: ch04-b12
          speaker: young_queen
          text: I have come for Peter's contract.
        - id: ch04-b13
          speaker: narrator
          text: A dreadful uproar broke out among the spirits. Then the worst voice of all answered her.
        - id: ch04-b14
          speaker: evil_one
          text: Ride home and tell Peter to come tomorrow. When he does, he will receive twice his usual beating.
          emotion: angry
        - id: ch04-b15
          speaker: narrator
          text: The queen cracked one nut and turned the horse toward home. Sparks flew from every tree. The evil spirits howled as though they themselves were being whipped back to their dwelling place.
        - id: ch04-b16
          speaker: narrator
          text: At the same hour the next day, the queen rode out again. This time the spirits did not dare come so close. They still refused to surrender the contract, and they threatened both Peter and the queen. She cracked the second nut. Behind her, the whole forest seemed to blaze with fire and flame. The spirits howled even more terribly than before, but they held on to the contract.
        - id: ch04-b17
          speaker: narrator
          text: Only one nut remained. The queen was ready to spend even that to free Peter. On the third day, she cracked it as soon as she drew near the spirits' meeting place. She could not see what happened to them. She heard only wild shrieks and howls. Then a long branch reached out and placed the contract in her hand.
        - id: ch04-b18
          speaker: narrator
          text: The queen rode joyfully back to the hut. Peter had waited there in terrible anxiety, and his joy was greater still. At last, he was free from all the evil spirits' power.
    - id: ch05
      title: The Family Found Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Meanwhile, King Lindorm returned from the war. The moment he entered the palace, he asked about his queen and the whelps. His attendants stared at him in surprise. They knew nothing of any whelps. The queen had borne two beautiful princes, they said, but the king himself had ordered all three to be burned.
        - id: ch05-b02
          speaker: narrator
          text: King Lindorm went pale with sorrow and anger. He had sent clear instructions that the queen and the whelps must be carefully protected. He ordered the attendants to summon the trusted retainer who had received those instructions. The retainer came before him carrying a very different letter. Its words ordered the queen and her children to be burned, and its seal appeared to be genuine. As the two letters were remembered and compared, everyone understood that someone had carried out a terrible act of treachery.
        - id: ch05-b03
          speaker: narrator
          text: When the retainer saw his master's grief, he confessed what he had done.
        - id: ch05-b04
          speaker: retainer
          text: I could not kill the queen and the little princes. I burned a sheep and two lambs instead. For three years I kept the queen and her sons hidden here in the palace. But when I knew you were about to return, I sent them away into the wild forest.
        - id: ch05-b05
          speaker: narrator
          text: The king's sorrow eased when he learned that his family might still be alive.
        - id: ch05-b06
          speaker: king_lindorm
          text: I will go into the forest and search for my wife and children. If I find them, I will come back to the palace. If I do not, I will never return. Then you, my faithful retainer, will rule in my place, because you saved their lives.
        - id: ch05-b07
          speaker: narrator
          text: King Lindorm left the palace alone and entered the wild forest. He searched through the whole first day without seeing a single human being. He wandered on through the second day, and still there was no trace of his wife or sons. On the third day, his roundabout path brought him at last to Peter's little hut. The king went inside. He did not know that his search had ended, and he only asked the poorly dressed woman there if he might rest for a while on the bench.
        - id: ch05-b08
          speaker: narrator
          text: The queen and the two princes were there. But she wore poor clothing and looked so sorrowful that the king did not recognize her. The children wore only rough skins, and he never imagined that they might be his own sons.
        - id: ch05-b09
          speaker: narrator
          text: The weary king lay on the narrow bench and soon fell asleep. As he slept, one arm slipped over the edge and hung down beside him. The queen knew him at once, though she was afraid to reveal herself.
        - id: ch05-b10
          speaker: young_queen
          text: My son, lift your father's arm and put it back on the bench.
        - id: ch05-b11
          speaker: narrator
          text: The first little prince took the king's arm. He was only a child, and he set it back none too gently.
        - id: ch05-b12
          speaker: narrator
          text: The king woke with a start. For a moment he thought he had stumbled into a robbers' den. He decided to stay quiet and pretend to sleep until he learned what kind of people lived there. After a while, when the room was still, he let his arm slide from the bench once more.
        - id: ch05-b13
          speaker: young_queen
          text: My son, you put your father's arm back this time. Be gentler than your brother was.
        - id: ch05-b14
          speaker: narrator
          text: A pair of little hands closed softly around his arm. The king opened his eyes and saw his queen and their two children.
        - id: ch05-b15
          speaker: narrator
          text: He leaped up and gathered all three into his arms. Then he took them home to the palace, along with Peter, his horse, and his hound. Joy filled the palace and spread throughout the whole kingdom. But the wicked stepmother was burned.
        - id: ch05-b16
          speaker: narrator
          text: King Lindorm and his queen lived long and happily together. Some say that if they are not dead now, they are living still to this very day.
