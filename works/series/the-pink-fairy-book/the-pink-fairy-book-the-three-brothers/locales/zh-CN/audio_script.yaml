audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    father:
      display_name: 父亲
      tts:
        delivery: 慈爱公正，说话稳重坦率
        timbre: 温厚沉稳
        pace: 从容
        pitch: 中低音
    eldest_brother:
      display_name: 大哥
      tts:
        delivery: 自信爽快，带着手艺人的利落
        timbre: 结实明亮
        pace: 明快
        pitch: 中音
    second_brother:
      display_name: 二哥
      tts:
        delivery: 机敏活泼，开口时胸有成竹
        timbre: 清亮灵巧
        pace: 稍快
        pitch: 中高音
    third_brother:
      display_name: 三弟
      tts:
        delivery: 坚韧沉着，自信却不张扬
        timbre: 清朗有力
        pace: 平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 各学一门手艺
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有位父亲，养了三个儿子。他没有别的产业，只有一家人住的那所老房子。这房子是祖祖辈辈传下来的，不能卖掉分钱。可父亲一样疼爱三个孩子，谁也不愿偏心，实在不知道死后该把房子留给哪一个。想了又想，他终于有了办法。
        - id: ch01-b02
          speaker: father
          text: 你们三个都出去闯一闯，各自学好一门手艺。等大家回来，谁拿出的本领最出色，这所房子就归谁。
        - id: ch01-b03
          speaker: narrator
          text: 儿子们都赞成。老大决定学打铁，老二要做理发师，老三则去学剑术。三人约定了回家的日子，便分头上路。
        - id: ch01-b04
          speaker: narrator
          text: 三兄弟的运气都不错，各自拜到一位好师傅，把该学的本事练得十分精熟。老大甚至给国王的马钉过蹄铁。他越干越有信心。
        - id: ch01-b05
          speaker: eldest_brother
          text: 这下不用说，老房子一定会归我。
        - id: ch01-b06
          speaker: narrator
          text: 老二专给王国里最显贵的人修面，也觉得自己稳操胜券。老三练剑时挨了许多下打，可他每次都咬紧牙关，绝不泄气。
        - id: ch01-b07
          speaker: third_brother
          text: 要是连挨一下都害怕，我还怎么赢得那所房子？
    - id: ch02
      title: 三样绝活
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 约定的日子一到，三兄弟回到家中，坐在一起商量该怎么展示本领。正在这时，一只野兔从田野那边直奔他们而来。老二一看，立刻叫出了声。
        - id: ch02-b02
          speaker: second_brother
          text: 快看，这机会来得刚刚好！
        - id: ch02-b03
          speaker: narrator
          text: 他抓起面盆和肥皂，趁野兔跑近时打好泡沫。等野兔从身旁飞奔过去，他已经把它的胡须刮得干干净净，既没划破它的皮，也没碰伤它身上一根毛。
        - id: ch02-b04
          speaker: father
          text: 这一手我真喜欢。你们两个要是不使出最大的本事，房子可就归他了。
        - id: ch02-b05
          speaker: narrator
          text: 不久，一个人驾着马车飞快地朝他们冲来。老大一见，马上追了上去。
        - id: ch02-b06
          speaker: eldest_brother
          text: 父亲，这回该看我的了！
        - id: ch02-b07
          speaker: narrator
          text: 马还在全速奔跑，老大已经卸掉它原来的四只蹄铁，又钉上四只新的。整个过程里，马车连一点儿速度都没有放慢。
        - id: ch02-b08
          speaker: father
          text: 好个能干的小伙子！你的手艺一点儿不比弟弟差。现在，我更不知道房子该给谁了。
        - id: ch02-b09
          speaker: narrator
          text: 这时，天空开始落雨。老三知道，自己的机会也来了。
        - id: ch02-b10
          speaker: third_brother
          text: 父亲，也请您看看我的本领。
        - id: ch02-b11
          speaker: narrator
          text: 他拔出剑，在头顶横一下、竖一下，飞快地挥舞起来，雨点竟一滴也落不到身上。雨越下越猛，最后像有人从天上往下泼水。他的剑也越舞越快，浑身始终干干爽爽，就像站在屋檐底下一样。
        - id: ch02-b12
          speaker: narrator
          text: 父亲看得惊叹不已。
        - id: ch02-b13
          speaker: father
          text: 你这一手最了不起。房子应当归你。
    - id: ch03
      title: 永不分离
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 另外两个兄弟一点儿也不嫉妒。他们心服口服，也称赞三弟的本领。三个人感情深厚，谁都不愿离开，于是一起留在老房子里，各做各的营生。他们经验丰富，手艺又精，赚下了许多钱，就这样和和美美地生活，一直活到很老。
        - id: ch03-b02
          speaker: narrator
          text: 后来，一个兄弟病倒去世了。余下两人悲痛得难以承受，也相继生病，离开了人世。三兄弟聪明能干，又一生彼此友爱，最后也没有分开。他们被合葬在同一座坟墓里。
