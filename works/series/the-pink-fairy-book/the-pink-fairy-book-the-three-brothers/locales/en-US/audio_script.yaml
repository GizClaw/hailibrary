  chapters:
    - id: ch01
      title: The Father's Choice
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man with three sons. Apart from the house where they lived, he owned nothing at all. He loved each son equally, and that made it impossible to choose which one should inherit the house when he died.
        - id: ch01-b02
          speaker: narrator
          text: He could have sold it and divided the money between them. But the house had been in their family for generations, and he could not bear to part with it. At last, an idea came to him.
        - id: ch01-b03
          speaker: father
          text: Go out into the world, all three of you, and each learn a trade. When you come home, show me what you can do. The house will belong to whoever makes the finest masterpiece.
        - id: ch01-b04
          speaker: narrator
          text: The sons thought this was fair. The eldest chose to become a blacksmith, the second chose barbering, and the youngest chose fencing. They fixed a day to meet at home again, then went their separate ways.
    - id: ch02
      title: Three Trades
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Each brother found an excellent master and learned everything his trade required. The blacksmith was trusted to shoe the king's own horses. He became certain that the house would be his.
        - id: ch02-b02
          speaker: narrator
          text: The barber shaved the finest gentlemen in the kingdom, and he felt just as sure that he would win the house.
        - id: ch02-b03
          speaker: narrator
          text: The fencing master took many blows while he trained. Still, he gritted his teeth and never let them discourage him.
        - id: ch02-b04
          speaker: youngest_brother
          text: If a blow frightens me, I will never win that house.
        - id: ch02-b05
          speaker: narrator
          text: When the appointed day arrived, all three brothers returned home. They sat together and talked about how each one might best display his skill.
    - id: ch03
      title: The Barber and the Hare
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Just then, a hare came racing across the field toward them. The second brother spotted it at once.
        - id: ch03-b02
          speaker: second_brother
          text: Look at that! It has come at exactly the right moment.
        - id: ch03-b03
          speaker: narrator
          text: He snatched up his basin and soap and whipped up a lather as the hare drew near. Without slowing the animal, he shaved off its whiskers while it raced past. He never cut the hare or harmed a single hair anywhere else on its body.
        - id: ch03-b04
          speaker: father
          text: That was excellent. Unless your brothers can do their very best, the house will be yours.
    - id: ch04
      title: The Blacksmith and the Fencing Master
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Soon afterward, a man came driving a carriage furiously toward them. Now the eldest brother saw his chance.
        - id: ch04-b02
          speaker: eldest_brother
          text: Father, watch what I can do now!
        - id: ch04-b03
          speaker: narrator
          text: He raced after the carriage. While the horse galloped at full speed, he pulled off all four of its shoes and fitted four new ones. The carriage never had to slow down.
        - id: ch04-b04
          speaker: father
          text: You are a clever fellow, and you know your trade as well as your brother knows his. How can I choose between you?
        - id: ch04-b05
          speaker: youngest_brother
          text: Father, give me a chance to show you my skill too.
        - id: ch04-b06
          speaker: narrator
          text: Rain had begun to fall. The youngest brother drew his sword and swept it back and forth above his head. Not one drop touched him. The rain grew heavier and heavier until it poured down like a waterspout. His sword moved faster and faster, and he stayed as dry as if he stood beneath a roof.
        - id: ch04-b07
          speaker: narrator
          text: His father stared in astonishment.
        - id: ch04-b08
          speaker: father
          text: Yours is the greatest masterpiece. The house belongs to you.
    - id: ch05
      title: Together to the End
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The two older brothers were satisfied with the decision, and they praised their youngest brother. The three loved one another so much that none of them wished to leave. They all stayed in the family home and worked at their trades.
        - id: ch05-b02
          speaker: narrator
          text: They were so skilled that they earned plenty of money, and they lived happily together until they were very old. Then one brother fell ill and died. The other two grieved so deeply that they also became ill, and before long, they died as well.
        - id: ch05-b03
          speaker: narrator
          text: The brothers had been clever, and they had loved one another all their lives. So, in the end, all three were laid together in a single grave.
