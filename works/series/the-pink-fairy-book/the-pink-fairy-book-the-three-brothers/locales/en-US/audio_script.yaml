  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and mellow
        pace: measured
        pitch: medium
    father:
      display_name: Father
      tts:
        delivery: thoughtful, fair-minded, and warmly approving
        timbre: mature and resonant
        pace: measured
        pitch: medium-low
    eldest_brother:
      display_name: Eldest Brother
      tts:
        delivery: confident, practical, and energetic
        timbre: strong and clear
        pace: steady
        pitch: medium-low
    second_brother:
      display_name: Second Brother
      tts:
        delivery: quick, cheerful, and self-assured
        timbre: light and bright
        pace: lively
        pitch: medium
    youngest_brother:
      display_name: Youngest Brother
      tts:
        delivery: determined, composed, and quietly confident
