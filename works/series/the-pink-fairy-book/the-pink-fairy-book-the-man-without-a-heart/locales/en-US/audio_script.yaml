  chapters:
    - id: ch01
      title: Seven Brothers Seek Seven Brides
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there were seven orphan brothers who had no sister. They had to do every bit of housework themselves, and they disliked it so much that they finally decided to marry. No young women lived nearby, so the six elder brothers agreed to search the world for brides. If the youngest stayed home and cared for the house, they promised to bring a beautiful wife back for him too. He gladly agreed, and the other six set out in high spirits.
        - id: ch01-b02
          speaker: narrator
          text: Their road led through a wood, where a small cottage stood all alone. An old, old man was waiting outside its door. He called to the brothers as they passed.
        - id: ch01-b03
          speaker: old_man
          text: Hello there, young fellows! Where are you all rushing off to so cheerfully?
        - id: ch01-b04
          speakers: [first_brother, second_brother, third_brother, fourth_brother]
          ensemble: chorus
          text: We are looking for pretty brides for ourselves, and one for our youngest brother at home.
        - id: ch01-b05
          speaker: old_man
          text: Then please bring a bride for me as well. I am terribly lonely here. Just remember, she must be young and pretty.
        - id: ch01-b06
          speaker: narrator
          text: The brothers wondered what such a shriveled, gray old man wanted with a young bride, but they continued on their way. Before long, they reached a town where seven sisters lived, all young and lovely. Each elder brother chose one sister. They saved the youngest for the brother waiting at home, and the whole party began the journey back.
        - id: ch01-b07
          speaker: narrator
          text: Once again, they passed the lonely cottage. The old man stood by the door and cried out to them.
        - id: ch01-b08
          speaker: old_man
          text: You fine fellows! What a charming bride you have brought me!
        - id: ch01-b09
          speakers: [first_brother, second_brother, third_brother, fourth_brother]
          ensemble: chorus
          text: She is not yours. We promised her to our youngest brother.
        - id: ch01-b10
          speaker: old_man
          text: Promised, did you? I will make you swallow those promises!
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: He raised a magic wand and murmured a charm. One by one, he touched the brothers and their brides, and all twelve became gray stones on the spot. Only the youngest sister escaped the spell. The old man took her into his cottage, and from then on she had to keep house for him.
    - id: ch02
      title: The Secret of the Heart
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The girl was not entirely unhappy living in the cottage, but one fear never left her. If the old man died, she would be alone there, deep in the heart of the wood, with no one to keep her company. Then she would be as terribly lonely as he had once been. One day, she told him what she feared.
        - id: ch02-b02
          speaker: old_man
          text: Do not worry. You need not fear my death, or even wish for it, because there is no heart in my breast. But if I should die, my wand is above the door. Use it to free your sisters and their bridegrooms, and you will have company enough.
          emotion: calm
        - id: ch02-b03
          speaker: young_bride
          text: If your heart is not in your breast, where in the world do you keep it?
        - id: ch02-b04
          speaker: old_man
          text: Must you know everything? Very well. My heart is in the bedcover.
        - id: ch02-b05
          speaker: narrator
          text: After the old man went out, his bride embroidered lovely flowers on the bed quilt. She wanted to make his heart happy. When he saw her work, he laughed.
        - id: ch02-b06
          speaker: old_man
          text: You are a good child, but I was only teasing you. My heart is really in... in...
        - id: ch02-b07
          speaker: young_bride
          text: Then where is it, dear husband?
        - id: ch02-b08
          speaker: old_man
          text: It is in the doorway.
        - id: ch02-b09
          speaker: narrator
          text: The next day, while he was away, she covered the door with bright feathers and fresh flowers and hung garlands around it. When the old man returned, he asked what all the decorations meant.
        - id: ch02-b10
          speaker: young_bride
          text: I made them to show how much I love your heart.
        - id: ch02-b11
          speaker: old_man
          text: You are a dear child, but my heart is not in the doorway either.
        - id: ch02-b12
          speaker: narrator
          text: Now the poor bride was deeply vexed.
        - id: ch02-b13
          speaker: young_bride
          text: Oh, my dear, you must have a heart somewhere. That means you may die and leave me here all alone.
          emotion: sad
        - id: ch02-b14
          speaker: narrator
          text: The old man repeated everything he had said to comfort her. Still, she begged him to tell the truth. At last, he gave in.
        - id: ch02-b15
          speaker: old_man
          text: Far, far away, in a lonely place, there stands a church older than you can imagine. It has iron doors, and a deep moat circles it with no bridge across. Inside is a bird that never eats, never drinks, and never dies. It flies up and down, and no one can catch it. My heart is in that bird. As long as it lives, so will I.
        - id: ch02-b16
          speaker: narrator
          text: The little bride was sad because she could do nothing to show her love for the old man's heart. She thought about it through the long days while she sat alone, for her husband was nearly always away.
    - id: ch03
      title: The Youngest Brother's Journey
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: One day, a young traveler passed the cottage. When he saw the pretty girl, he wished her good day. She returned the greeting, then asked where he had come from and where he was going.
        - id: ch03-b02
          speaker: youngest_brother
          text: I am very unhappy. My six brothers went away to find brides for themselves and one for me. They never came home, so I have set out to find them.
          emotion: sad
        - id: ch03-b03
          speaker: young_bride
          text: Oh, my good friend, you do not need to go any farther. Sit down and have something to eat and drink. Afterward, I will tell you what happened.
        - id: ch03-b04
          speaker: narrator
          text: She fed him, and when his meal was over, she told him the whole story. His brothers had come to her town and chosen six of her sisters as brides. They had brought her along for him. Then the old man turned the twelve travelers to stone and kept her as his own bride. She wept as she spoke, and even revealed the secret of the heart bird.
        - id: ch03-b05
          speaker: youngest_brother
          text: I will search for that bird. Perhaps God will help me find it and catch it.
        - id: ch03-b06
          speaker: young_bride
          text: Yes, please go. You will be doing a good deed, because then you can free your brothers and my sisters.
        - id: ch03-b07
          speaker: narrator
          text: It was late, and the old man would soon return, so the girl hid the traveler inside the cottage. He stayed hidden until morning. After her husband had gone out again, she packed plenty of food for her guest. Then she sent him on his way, wishing him good luck and success in his search.
        - id: ch03-b08
          speaker: narrator
          text: The young man walked until it seemed time for breakfast. He opened his knapsack and was delighted by all the good things inside.
        - id: ch03-b09
          speaker: youngest_brother
          text: What a feast! Would anyone like to share it with me?
        - id: ch03-b10
          speaker: narrator
          text: A long moo sounded just behind him. He turned and saw a great red ox.
        - id: ch03-b11
          speaker: red_ox
          text: I would be very pleased to accept that kind invitation.
        - id: ch03-b12
          speaker: youngest_brother
          text: I am glad you came. Help yourself. Everything I have is yours to share.
        - id: ch03-b13
          speaker: narrator
          text: The ox settled down comfortably, licked his lips, and ate a hearty meal. When he rose, he thanked the young man.
        - id: ch03-b14
          speaker: red_ox
          text: If you are ever in danger or need, call me. You need only think of me.
        - id: ch03-b15
          speaker: narrator
          text: Then the ox disappeared among the bushes. The traveler packed what remained and went on. By midday, the shortening shadows and his hunger told him it was time to stop. He spread his food on a cloth.
        - id: ch03-b16
          speaker: youngest_brother
          text: Dinner is ready. Anyone who wants to share it is welcome.
        - id: ch03-b17
          speaker: narrator
          text: The undergrowth rustled loudly, and a wild boar ran out, grunting.
        - id: ch03-b18
          speaker: wild_boar
          text: Umph, umph! Did someone say dinner was ready? Was that you, and did you mean I could come?
        - id: ch03-b19
          speaker: youngest_brother
          text: Of course I did. Please share whatever I have.
        - id: ch03-b20
          speaker: narrator
          text: They enjoyed the meal together. Afterward, the boar got to his feet.
        - id: ch03-b21
          speaker: wild_boar
          text: Thank you. Whenever you need help, call me quickly.
        - id: ch03-b22
          speaker: narrator
          text: The boar rolled away. The youth walked for many more miles, until evening came and he was hungry again. He still had provisions, so he laid out his supper and called once more.
        - id: ch03-b23
          speaker: youngest_brother
          text: If anyone would care to share my meal, you are welcome.
        - id: ch03-b24
          speaker: narrator
          text: Wings beat overhead, and a shadow crossed the ground. A huge griffin appeared.
        - id: ch03-b25
          speaker: griffin
          text: I heard someone offer a meal. Is there anything here for me?
        - id: ch03-b26
          speaker: youngest_brother
          text: Why not? Come down and eat all you want. There will not be much left after this.
        - id: ch03-b27
          speaker: narrator
          text: The griffin landed and ate his fill.
        - id: ch03-b28
          speaker: griffin
          text: Call me if you need me.
        - id: ch03-b29
          speaker: narrator
          text: Then he flew away.
        - id: ch03-b30
          speaker: youngest_brother
          text: He left in a great hurry. Perhaps he could have shown me the way to the church. I will never find it by myself.
        - id: ch03-b31
          speaker: narrator
          text: The young man gathered his things and decided to walk a little farther before resting. He had barely gone on when, all at once, the church stood before him. Soon he reached the broad, deep moat around it. There was no bridge anywhere. It was too late to try crossing, and he was exhausted, so he lay on the ground and fell fast asleep.
    - id: ch04
      title: The Bird in the Ancient Church
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When he woke the next morning, he wished he could get across the moat. Then he remembered the red ox. If the ox were thirsty enough to drink all that water, the young man could cross on dry ground.
        - id: ch04-b02
          speaker: narrator
          text: The thought had scarcely entered his mind when the ox appeared and drank the moat dry. The grateful traveler hurried across. But the church walls were thick, and its strong iron doors would not let him in.
        - id: ch04-b03
          speaker: youngest_brother
          text: I think that great boar would be more useful here than I am.
        - id: ch04-b04
          speaker: narrator
          text: As soon as he wished for the boar, it appeared and pushed with all its strength against the wall. Its tusks worked one stone loose. Once that first stone was out, the boar poked away another, and then another. It kept going until a large hole opened in the wall, wide enough for a man to pass through.
        - id: ch04-b05
          speaker: narrator
          text: The young man slipped inside the church. A bird was flying up and down, but he could not catch it.
        - id: ch04-b06
          speaker: youngest_brother
          text: Oh, if the griffin were here, he would catch that bird at once!
        - id: ch04-b07
          speaker: narrator
          text: At those words, the griffin appeared inside the church. The great creature swept after the bird, seized it, and placed it in the young man's hands. Then the griffin flew away. Holding the bird carefully so it could not escape, the traveler hurried back toward the cottage as fast as he could.
        - id: ch04-b08
          speaker: narrator
          text: He reached the cottage before evening and told the little bride all that had happened. She gave him food and drink, then hid both him and the bird beneath the bed.
    - id: ch05
      title: The Twelve Gray Stones
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Before long, the old man came home complaining that he felt ill. Nothing would ever be right for him again, he said, because someone had caught his heart bird. Under the bed, the young man heard every word and thought it over.
        - id: ch05-b02
          speaker: youngest_brother
          text: This old man has never harmed me himself. But he bewitched my brothers and their brides, and he took my own bride for himself. That is bad enough.
        - id: ch05-b03
          speaker: narrator
          text: He pinched the bird.
        - id: ch05-b04
          speaker: old_man
          text: Ah! Death has hold of me! Child, I am dying!
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: The old man fainted and fell from his chair. Before the youth quite knew what he was doing, he squeezed the bird to death. At that same moment, the old man died too.
        - id: ch05-b06
          speaker: narrator
          text: The young man crawled out from under the bed. The girl went to the place above the door and found the magic wand, exactly where the old man had said it would be. She carried it outside and touched each of the twelve gray stones. At once, they became the six brothers and their six brides again.
        - id: ch05-b07
          speaker: narrator
          text: What joy followed! Everyone kissed and embraced. The old man lay dead nearby, and no magic wand could have brought him back to life, even if they had wanted it to.
        - id: ch05-b08
          speaker: narrator
          text: Then they all left the lonely cottage. The seven couples were married, and they lived happily together for many years.
