audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    elder_brother:
      display_name: "哥哥"
      tts:
        delivery: "勇敢爽直，冲动时强硬急促"
        timbre: "明亮有力的年轻男声"
        pace: "适中"
        pitch: "中音"
    younger_brother:
      display_name: "弟弟"
      tts:
        delivery: "仁厚机敏，危急时果断坚定"
        timbre: "温暖清朗的年轻男声"
        pace: "适中"
        pitch: "中音"
    little_fish:
      display_name: "小鱼"
      tts:
        delivery: "急切诚恳，声音小却很有把握"
        timbre: "轻巧清脆的中性声"
        pace: "稍快"
        pitch: "高音"
    princess:
      display_name: "公主"
      tts:
        delivery: "温柔真挚，悲伤中仍有勇气"
        timbre: "清澈柔和的年轻女声"
        pace: "适中"
        pitch: "中高音"
    royal_slave:
      display_name: "国王的奴仆"
      tts:
        delivery: "阴险逼迫，得意时故作镇定"
        timbre: "干冷的成年男声"
        pace: "适中"
        pitch: "中低音"
    king:
      display_name: "国王"
      tts:
        delivery: "威严果断，对女儿慈爱"
        timbre: "洪亮厚实的老年男声"
        pace: "偏慢"
        pitch: "低音"
    witch:
      display_name: "老女巫"
      tts:
        delivery: "阴森狡诈，受制时虚假讨好"
        timbre: "粗哑苍老的女声"
        pace: "偏慢"
        pitch: "中低音"
    old_man:
      display_name: "小老头"
      tts:
        delivery: "沉着明白，指点时郑重谨慎"
        timbre: "温厚苍老的男声"
        pace: "舒缓"
        pitch: "低音"
  chapters:
    - id: ch01
      title: "小鱼带来的好运"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "很久以前，有一对英俊的兄弟，家里却穷得厉害，平日难得有别的东西，只能靠自己捕来的鱼填肚子。一天，他们天一亮就驾船出海，在水上守了整整一天，连一条鱼也没上钩。眼看两人正要收起钓线，回家饿着肚子睡觉，手中忽然传来一下微弱的拉扯。他们赶紧把线提起来，钩上却只有一条小得可怜的鱼。"
        - id: ch01-b02
          speaker: elder_brother
          text: "这么小，也太寒碜了！不过总比空着肚子强。我拿面包屑裹上，烤来当晚饭。"
        - id: ch01-b03
          speaker: little_fish
          text: "先别杀我！放了我，我一定给你们带来好运！"
          emotion: fearful
        - id: ch01-b04
          speaker: elder_brother
          text: "别说傻话了。我捉到你，就是要吃你的。"
        - id: ch01-b05
          speaker: narrator
          text: "弟弟却可怜小鱼，替它求起情来。"
        - id: ch01-b06
          speaker: younger_brother
          text: "它还不够我们吃一口呢，放它活命吧。万一我们扔掉的正是自己的好运呢？还是送它回海里好。"
        - id: ch01-b07
          speaker: little_fish
          text: "只要饶了我，明早你们会在沙滩上看见两匹备好鞍辔的骏马。骑上它们，你们就能做骑士，到四方寻找奇遇。"
        - id: ch01-b08
          speaker: elder_brother
          text: "一派胡言！我们怎么知道你没撒谎？"
        - id: ch01-b09
          speaker: younger_brother
          text: "就试一次吧。它若骗人，以后再捉回来也不迟。"
        - id: ch01-b10
          speaker: narrator
          text: "哥哥终于让了步，把小鱼送回海里。那一晚，兄弟俩没有晚饭可吃，只能饿着肚子躺下，猜想第二天究竟会有什么运气。黎明才露出第一线微光，他们就双双起床，飞快地跑到海边。沙滩上果然站着两匹神骏非凡的马，正如小鱼所说，鞍辔样样齐全。马背上各放着一套铠甲和衬衣、一柄宝剑，还有一袋金币。"
        - id: ch01-b11
          speaker: younger_brother
          text: "幸好你没吃掉那条鱼！它真把好运送来了，将来我们说不定会很有作为。现在各自去历险吧，你走一边，我走另一边。"
        - id: ch01-b12
          speaker: elder_brother
          text: "好。可分开以后，我们怎么知道对方还活着？"
        - id: ch01-b13
          speaker: younger_brother
          text: "你看见眼前这棵无花果树了吗？记住它。以后谁想知道对方的消息，就回来用剑划开树皮。若是流出乳汁，说明我们平安顺遂。若是流出鲜血，就是有人已经死了，或是正身陷大难。"
        - id: ch01-b14
          speaker: narrator
          text: "兄弟俩把铠甲穿在身上，佩好宝剑，又把各自的钱袋收进衣服。他们依依不舍地告别，谁也不知道再见会是哪一天。最后，两人跨上骏马，朝着不同的方向出发了。"
    - id: ch02
      title: "七头巨蛇与真正的新郎"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "哥哥一直朝前骑，来到一个陌生王国的边境。他越过国界，又走了一程，不久来到一条河边。河中央有块岩石，一位美丽的姑娘被铁链锁在上面，哭得十分伤心。原来河中住着一条七头巨蛇，它能从鼻孔喷出火焰，还扬言要把整个国家烧成一片焦土。除非国王每天早晨送一个人给它当早点，它才肯罢休。这样的日子过了太久，国中已经无人可送，国王不得不献出亲生女儿。可怜的公主只能在岩石上等着，等怪物肚子饿了来吞吃她。"
        - id: ch02-b02
          speaker: elder_brother
          text: "可怜的姑娘，你为什么哭？"
        - id: ch02-b03
          speaker: princess
          text: "我被锁在这里，等七头巨蛇来吃。先生，快走吧，不然它连你也会吞掉！"
          emotion: fearful
        - id: ch02-b04
          speaker: elder_brother
          text: "我不会走。我要把你救出来。"
        - id: ch02-b05
          speaker: princess
          text: "你不了解那怪物有多可怕，谁也敌不过它。"
        - id: ch02-b06
          speaker: elder_brother
          text: "这由我来应付。你只管告诉我，它从哪边来。"
        - id: ch02-b07
          speaker: princess
          text: "你既然决意救我，就先站到一旁。等它浮上来，我会说今天有两个人可吃，让它先吃你，因为我被锁着，逃不掉。它听见后，多半会先扑向你。"
        - id: ch02-b08
          speaker: narrator
          text: "年轻人照办了。不久，河水轰然奔涌，饥饿的巨蛇浮出水面，四处寻找公主所在的岩石。"
        - id: ch02-b09
          speaker: princess
          text: "巨蛇啊，今天有两个人给你吃！先吃那个年轻人吧，我锁在这里，反正跑不了。"
        - id: ch02-b10
          speaker: narrator
          text: "巨蛇听见这话，立刻张开血盆大口，朝年轻人猛扑过去，想一口将他吞下。他纵身闪到旁边，拔出宝剑迎战。双方一直斗到七颗蛇头全被他砍落，怪物庞大的身体倒毙在脚边。年轻人这才走到岩石上，解开公主身上的锁链。重获自由的公主扑进他的怀里。"
        - id: ch02-b11
          speaker: princess
          text: "你救了我。父王早已宣布，谁杀死巨蛇，谁就能娶我。现在，你就是我的丈夫。"
          emotion: happy
        - id: ch02-b12
          speaker: elder_brother
          text: "现在还不行，我前面还有很长的路。请等我七年零七个月。若我没有回来，你就可以嫁给别人。我会带走七条蛇舌。日后拿出它们，你就知道真正杀蛇的人是我。"
        - id: ch02-b13
          speaker: narrator
          text: "说完，年轻人割下七条蛇舌。公主拿出一块厚布，让他把舌头仔细包好。他把布包收在身边，跨上马继续远行。他走后不久，国王派来打听女儿死活的奴仆到了河边。这个人见公主安然无恙地站在那里，巨蛇的尸体横在她脚边，心中立刻生出一个恶毒的主意。"
        - id: ch02-b14
          speaker: royal_slave
          text: "你必须告诉父王，是我杀了巨蛇。否则，我就在这里杀掉你、埋掉你，谁也不会知道发生过什么。"
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: "可怜的公主还能怎么办？这一次，身边没有骑士来救她。她只得答应按照奴仆的话去说。奴仆拾起巨蛇的七颗头，把公主带回国王身边。国王重见爱女，欢喜得不得了，满城百姓也一同庆祝。接着，奴仆被叫来讲述自己如何杀死怪物。等他把谎话讲完，国王便宣布，要把公主嫁给这个所谓的英雄。"
        - id: ch02-b16
          speaker: princess
          text: "父王，您的诺言不能收回。可请再给我一个恩典，让我等满七年零七个月。期限一到，我就嫁给他。"
        - id: ch02-b17
          speaker: narrator
          text: "国王听从了女儿的请求。整整七年零七个月，公主日日盼望真正的新郎，夜夜为他流泪。这段日子里，年轻人一直骑着马周游四方。期限一满，他便回到公主居住的城里。此时离那场婚礼只剩几天，他径直走进王宫，站到了国王面前。"
        - id: ch02-b18
          speaker: elder_brother
          text: "国王，请把女儿嫁给我。七头巨蛇是我杀的。这七条蛇舌就是凭证，包住它们的绣花布也是公主亲手给我的。"
        - id: ch02-b19
          speaker: princess
          text: "父王，他说的都是真的，他才是我真正的新郎。不过，请饶恕那个奴仆吧，他当时受了很大的诱惑。"
        - id: ch02-b20
          speaker: king
          text: "这种背叛，谁也不能宽恕！把他带走，砍下他的头！"
          emotion: angry
        - id: ch02-b21
          speaker: narrator
          text: "欺骗国王的奴仆被处死了，好让别人再不敢效仿他的恶行。随后，王宫举行了盛大的婚宴。失散七年零七个月的真正新郎终于回来，公主也终于不用再日夜等候，所有人的心中都充满了喜悦。"
    - id: ch03
      title: "山中女巫"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "婚后，夫妻俩幸福又知足地生活了很长一段日子。一天傍晚，年轻人站在窗边向城外眺望，忽然看见远处的一座山上亮着一团耀眼的光。他便开口询问妻子。"
        - id: ch03-b02
          speaker: elder_brother
          text: "山上亮的是什么？"
        - id: ch03-b03
          speaker: princess
          text: "别看！那是邪恶女巫的住处，没有哪个男人杀得了她。"
          emotion: fearful
        - id: ch03-b04
          speaker: narrator
          text: "公主要是没有开口，反倒更好。她的话使丈夫心中燃起斗志，他一心想拿自己的力量去试试女巫的诡计。这个念头一整天都在变强。第二天早晨，他不顾妻子流泪挽留，还是骑马奔向那座山。路比想象中远得多。天黑时，他才走到山脚。若不是那道亮光像月亮一样照着道路，他根本找不到方向。最后，他来到一座华美的城堡，每扇窗里都有火光喷涌。他走上台阶，踏进大厅，只见一个丑陋的老妇人坐在金椅上。"
        - id: ch03-b05
          speaker: witch
          text: "我拔下一根头发，就能把你变成石头。"
        - id: ch03-b06
          speaker: elder_brother
          text: "别胡说了，老太婆！一根头发能把我怎么样？"
        - id: ch03-b07
          speaker: narrator
          text: "女巫当真拔下一根头发，轻轻放到他肩上。年轻人的四肢立刻又冷又沉，再也不能动弹。恰在这个时候，远方的弟弟想起了哥哥，想知道分别这些年，他到底过得怎样。弟弟骑马穿过树林，来到当年约定的无花果树前，用剑划开树皮，站在一旁等待。树干里响起轻轻的汩汩声，飞快流出的不是乳汁，而是一股鲜血。"
        - id: ch03-b08
          speaker: younger_brother
          text: "哥哥不是死了，就是快死了！我还赶得及救他吗？好马儿，快像风一样飞！"
          emotion: fearful
        - id: ch03-b09
          speaker: narrator
          text: "弟弟跳上马背，催着马儿穿过整个世界，终于有一天来到哥哥居住的城里。公主从丈夫离开的那个早晨起，便每天坐在那里流泪，侧耳听着他的脚步声。她看见弟弟骑马经过阳台下面，心头猛地一阵欢喜，还以为自己的丈夫终于回来。兄弟俩长得一模一样，世上谁也分辨不出。"
        - id: ch03-b10
          speaker: princess
          text: "终于回来了！我等你等了多久啊！"
          emotion: happy
        - id: ch03-b11
          speaker: narrator
          text: "弟弟听见她的呼唤，这才知道哥哥曾住在此处，眼前这位美丽的女子正是自己的嫂嫂。他没有开口解释，任由公主把他当成丈夫。公主满心喜悦，领他去见老国王。国王也把他当作亲生儿子一般欢迎，还命人为他设下宴席。公主更是欢喜得忘了自己，她张开双臂，想要拥抱他、亲吻他，弟弟却抬手挡住了她。"
        - id: ch03-b12
          speaker: younger_brother
          text: "别碰我。"
        - id: ch03-b13
          speaker: narrator
          text: "公主十分诧异。几天后，弟弟也在傍晚望见山中的亮光。"
        - id: ch03-b14
          speaker: younger_brother
          text: "那是什么光？"
        - id: ch03-b15
          speaker: princess
          text: "快离开那里！那道光不是已经害过你一次了吗？难道你还要再去和老女巫交手？"
          emotion: fearful
        - id: ch03-b16
          speaker: narrator
          text: "弟弟牢牢记住了这几句话，公主却不知道自己无意间说出了哥哥的去处，也透露了哥哥遭遇过什么。第二天天还没亮，弟弟便悄悄起身，给马备好鞍，奔向那座山。道路比他料想的更加遥远。半路上，他遇到一个小老头。老人拦住他，问他要到哪里去。"
        - id: ch03-b17
          speaker: younger_brother
          text: "不管用什么办法，我都要救回落入女巫手中的哥哥。"
        - id: ch03-b18
          speaker: old_man
          text: "女巫的法力全在头发里。见到她就扑上去，抓紧她的头发，千万别松手。逼她领你找到哥哥，再用药膏救活他。那药能医好一切伤口，也能唤醒死人。等哥哥平安站起来，你就砍下女巫的头。"
        - id: ch03-b19
          speaker: narrator
          text: "弟弟十分感激老人的指点，答应每一句都会照办。随后，他继续向山中赶路，很快便到了那座城堡。他没有在门前迟疑，大胆走上台阶，径直进入大厅。丑陋的老女巫迎面走来，冲着他狰狞地咧开嘴。"
        - id: ch03-b20
          speaker: witch
          text: "我只要一根头发，就能叫你变成石头。"
        - id: ch03-b21
          speaker: younger_brother
          text: "是吗？你这老恶婆！快说，我哥哥在哪里？不然我现在就砍下你的头！"
          emotion: angry
        - id: ch03-b22
          speaker: narrator
          text: "话还没说完，弟弟已经扑上去，一把揪住女巫的头发。老人教给他的办法果然有效，女巫全身的力量顿时消失，再也不能施展魔法，只能服从他的命令。"
    - id: ch04
      title: "弟弟救回哥哥"
      blocks:
        - id: ch04-b01
          speaker: witch
          text: "我带你去找他。可你抓得太紧，我没法走路，先放开我吧。"
        - id: ch04-b02
          speaker: younger_brother
          text: "你自己想办法。"
        - id: ch04-b03
          speaker: narrator
          text: "弟弟根本不信她的话，反而把头发抓得更紧，叫她无论如何也得往前走。女巫只好领他进入一间宽阔的大厅。里面密密麻麻摆满了石像，而那些冰冷的石像从前全是活生生的人。女巫随手指向其中一尊。"
        - id: ch04-b04
          speaker: witch
          text: "那就是你的哥哥。"
        - id: ch04-b05
          speaker: younger_brother
          text: "我全看过了，他不在这里。快带我去找，不然你要吃苦头。"
        - id: ch04-b06
          speaker: narrator
          text: "女巫不肯死心，又接连拿别的石像搪塞他。弟弟把每一尊都仔细看过，没有一次上当。他揪着她一间大厅接一间大厅地找下去。直到来到最后一间，他才终于看见哥哥一动不动地躺在地上。"
        - id: ch04-b07
          speaker: younger_brother
          text: "这才是我哥哥。把能救活他的药膏拿来。"
        - id: ch04-b08
          speaker: narrator
          text: "女巫极不情愿地打开旁边的橱柜，里面摆满了大大小小的瓶罐。她取下一瓶，递给弟弟。弟弟早就提防她使诈，仔细检验以后，看出这瓶药根本不能疗伤。女巫又拿来别的瓶子，一次又一次想骗过他。最后，她明白再骗也没有用，才交出真正的药膏。弟弟把药稳稳拿住，仍旧揪紧女巫的头发，逼她弯下腰，把药膏涂在哥哥脸上。等死去的人睁开双眼，他立刻拔剑，一下砍掉了女巫的头。哥哥站起身，伸了个懒腰。"
        - id: ch04-b09
          speaker: elder_brother
          text: "我睡了多久啊？这里又是什么地方？"
          emotion: surprised
        - id: ch04-b10
          speaker: younger_brother
          text: "女巫给你施了魔法。如今她已经死了，你自由了。我们先唤醒其他中了魔法的骑士，再一起离开。"
        - id: ch04-b11
          speaker: narrator
          text: "兄弟俩没有把其他受害者留在那里。他们拿着药膏，逐个救醒所有中了女巫魔法的骑士。众人又把城堡里找到的珠宝和黄金分给彼此，这才各奔前程。两兄弟仍旧并肩同行，哥哥把那盒令自己起死回生的药膏紧紧握在手中，一路也没有放开。"
    - id: ch05
      title: "再也不分开"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "兄弟俩骑马踏上归途。分别了这么多年，又各自经历了那么多事，他们一路上有说不完的话。谈着谈着，弟弟忽然提起了哥哥留在城里的公主。"
        - id: ch05-b02
          speaker: younger_brother
          text: "你真傻，竟留下那么美丽的妻子，自己跑去斗女巫！她把我当成了丈夫，我也没告诉她认错了人。"
        - id: ch05-b03
          speaker: narrator
          text: "哥哥一听，心中顿时被怒火填满。他一句话也没说，更没有问清事实，拔出宝剑便杀了弟弟。弟弟的身体滚落在路旁的尘土里。哥哥独自骑马回到家中，公主仍坐在那里伤心流泪。她看见真正的丈夫归来，惊叫一声，立刻站起来扑进他的怀里。"
        - id: ch05-b04
          speaker: princess
          text: "我等了你这么久！以后不许再离开我，永远都不许！"
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: "老国王听说女婿回来，也像迎接亲生儿子一样欢迎他，立刻命人摆下宴席。宫廷上下的人全都来入席庆祝。到了晚上，热闹终于散去，只剩夫妻二人时，公主想起了前一次重逢时那件始终弄不明白的事。"
        - id: ch05-b06
          speaker: princess
          text: "你上次回来，为什么不肯让我碰你？我想抱你、亲你，你怎么总把我推开？"
        - id: ch05-b07
          speaker: narrator
          text: "年轻人听到这里，终于明白弟弟从未背叛自己。那几天里，他甚至不肯让嫂嫂碰他一下。哥哥一下坐倒，流着眼泪绞紧双手，为自己犯下的凶杀后悔不已。忽然，他猛地站了起来，因为想起衣服里面还藏着女巫的药膏。他立刻冲出王宫，飞奔到弟弟依旧躺着的地方。哥哥跪在尸身旁，取出那盒药膏，仔细涂在颈上大大裂开的伤口。裂开的皮肉渐渐合拢，断开的筋脉也重新变得强健。死去的弟弟终于坐起身来，茫然地望着四周。"
        - id: ch05-b08
          speaker: narrator
          text: "死而复生的弟弟就在眼前，兄弟俩紧紧拥抱在一起。哥哥为那凶狠的一剑请求弟弟原谅。随后，他们并肩回到王宫，从此再也没有分开。"
