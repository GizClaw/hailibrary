  chapters:
    - id: ch01
      title: The Little Fish's Gift
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, there lived two brothers. Both were very handsome, and both were so poor that they seldom ate anything except the fish they caught.
        - id: ch01-b02
          speaker: narrator
          text: One day, they had been out in their boat since sunrise without feeling a single bite. They were about to pull in their lines and go home hungry when one line gave a faint little tug. They drew it in quickly and found a tiny fish on the hook.
        - id: ch01-b03
          speaker: elder_brother
          text: What a miserable little thing! Still, it is better than nothing. I will bake it with bread crumbs for my supper.
        - id: ch01-b04
          speaker: fish
          text: Oh, please don't kill me yet! I promise I will bring you good luck.
        - id: ch01-b05
          speaker: elder_brother
          text: What nonsense! I caught you, so I am going to eat you.
        - id: ch01-b06
          speaker: narrator
          text: The younger brother felt sorry for the fish and spoke up for it.
        - id: ch01-b07
          speaker: younger_brother
          text: Let the poor little fellow live. It would hardly make one bite. And who knows? We may be throwing away our good luck. Put it back in the sea.
        - id: ch01-b08
          speaker: fish
          text: If you spare me, go to the sands tomorrow morning. You will find two beautiful horses there, saddled and bridled. You can ride through the world as knights and seek adventures.
        - id: ch01-b09
          speaker: elder_brother
          text: Oh, what foolishness! How can we know you are telling the truth?
        - id: ch01-b10
          speaker: younger_brother
          text: Please, let it live. If it has lied, we can always catch it again. Surely it is worth trying.
        - id: ch01-b11
          speaker: narrator
          text: The younger brother pleaded until, at last, the elder one gave in and tossed the fish back into the sea. Neither of them had caught anything else, so they went to bed without supper. As they lay there hungry, they wondered what sort of fortune the morning might bring.
        - id: ch01-b12
          speaker: narrator
          text: At the first streak of dawn, they ran down to the shore. There stood two magnificent horses, just as the fish had promised. Both were saddled and bridled. On their backs lay suits of armor and clothes to wear beneath them, along with two swords and two purses of gold.
        - id: ch01-b13
          speaker: younger_brother
          text: There! Aren't you glad you did not eat that fish? It has brought us good luck, and who knows how great we may become? Let us seek our own adventures. You take one road, and I will take the other.
        - id: ch01-b14
          speaker: elder_brother
          text: Very well. But how will either of us know if the other is still alive?
        - id: ch01-b15
          speaker: younger_brother
          text: See this fig tree? Whenever we want news of each other, we can come here and cut the bark with our swords. If milk flows out, we are well and prospering. If blood flows instead, one of us is dead or in terrible danger.
        - id: ch01-b16
          speaker: narrator
          text: The brothers dressed in the clothes the fish had given them. They put on their armor, fastened their swords at their sides, and slipped the purses of gold into their pockets. Then they said a tender farewell. Each mounted one of the splendid horses, and they rode away by different roads.
    - id: ch02
      title: The Seven-Headed Serpent
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The elder brother rode straight ahead until he reached the border of a kingdom he had never seen. He crossed into that land and soon came to the bank of a river. In the middle of the current stood a rock. A beautiful girl sat chained to it, all alone, and she was weeping bitterly.
        - id: ch02-b02
          speaker: narrator
          text: A seven-headed serpent lived in that river. It had threatened to burn the whole land with fire from its nostrils unless the king sent it a man to eat every morning. At last, no men remained, and the king had been forced to send his own daughter. Now she waited for the hungry monster to come.
        - id: ch02-b03
          speaker: elder_brother
          text: My poor girl, why are you crying?
        - id: ch02-b04
          speaker: princess
          text: I am chained here until a horrible serpent with seven heads comes to eat me. Please, sir, do not stay. It will eat you too.
          emotion: fearful
        - id: ch02-b05
          speaker: elder_brother
          text: I am staying. I mean to set you free.
        - id: ch02-b06
          speaker: princess
          text: But you cannot! You do not know how terrible that monster is. No one can stand against it.
          emotion: fearful
        - id: ch02-b07
          speaker: elder_brother
          text: Leave that to me. Just tell me which way the serpent will come.
        - id: ch02-b08
          speaker: princess
          text: If you truly mean to save me, stand off to one side. When the serpent rises, I will tell it there are two people to eat today. I will say it should begin with you because I am chained and cannot escape. It will probably come at you first.
        - id: ch02-b09
          speaker: narrator
          text: The young man took his place. Before long, he heard the water rushing. The dreadful creature rose to the surface and searched for the rock where the king's daughter waited. It was late, and the serpent was hungry.
        - id: ch02-b10
          speaker: princess
          text: Serpent, you may eat two people today! Start with the young man. I am chained here, so I cannot run away.
        - id: ch02-b11
          speaker: narrator
          text: The serpent rushed at the youth with its jaws wide, ready to swallow him whole. He sprang aside, drew his sword, and fought until all seven heads had fallen. Then he freed the princess. She threw her arms around him.
        - id: ch02-b12
          speaker: princess
          text: You saved me from that monster! You must be my husband now. My father promised me to whoever killed the serpent.
        - id: ch02-b13
          speaker: elder_brother
          text: I cannot marry you yet. I still have far to travel. Wait for me for seven years and seven months. If I have not returned by then, you may marry anyone you choose. I will take the serpent's seven tongues. When I show them again, you will know I am the man who killed it.
        - id: ch02-b14
          speaker: narrator
          text: He cut out the seven tongues. The princess gave him a thick cloth to wrap them in, and he mounted his horse and rode away.
        - id: ch02-b15
          speaker: narrator
          text: Soon afterward, a slave sent by the king reached the river to learn what had happened to the princess. He saw her standing safe beside the dead monster, and a wicked plan came to him.
        - id: ch02-b16
          speaker: slave
          text: Tell your father that I killed the serpent. If you refuse, I will kill you and bury you here, and no one will ever learn what happened.
          emotion: angry
        - id: ch02-b17
          speaker: narrator
          text: What could the poor princess do? The knight who had saved her was gone, and no one else was there to defend her. To save her life, she promised to tell the lie. The slave gathered up all seven severed heads as his false proof and took the princess back to her father.
        - id: ch02-b18
          speaker: narrator
          text: The king was overjoyed to see his daughter, and the whole town rejoiced with him. The slave told everyone how he claimed to have slain the monster. When his tale was done, the king declared that he would marry the princess.
        - id: ch02-b19
          speaker: narrator
          text: The princess fell at her father's feet and begged him to wait.
        - id: ch02-b20
          speaker: princess
          text: You have given your royal word, Father, and you cannot take it back. But grant me one kindness. Wait seven years and seven months before the wedding. When that time has passed, I will marry the slave.
        - id: ch02-b21
          speaker: narrator
          text: The king listened to his daughter and granted her request. Then the long waiting began. For seven years and seven months, the princess watched for the knight who had saved her. As one day followed another without his return, she wept for him by day and by night.
        - id: ch02-b22
          speaker: narrator
          text: All that time, the elder brother rode through the world. When the appointed years and months had passed, he returned to the princess's town just a few days before the wedding. He went before the king.
        - id: ch02-b23
          speaker: elder_brother
          text: Give me your daughter, O King. I killed the seven-headed serpent. Here are the seven tongues I cut from its heads, wrapped in the embroidered cloth your daughter gave me. They prove that I speak the truth.
        - id: ch02-b24
          speaker: princess
          text: Yes, Father, he tells the truth. He is my rightful bridegroom. But please forgive the slave. The temptation was very great.
        - id: ch02-b25
          speaker: king
          text: No man can pardon such treachery. Take him away at once and cut off his head!
          emotion: angry
        - id: ch02-b26
          speaker: narrator
          text: The false slave was put to death so that no one would follow his example. Then the wedding feast was held, and every heart rejoiced because the true bridegroom had returned at last.
    - id: ch03
      title: The Witch on the Mountain
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The elder brother and the princess lived happily together for a long time. Then one evening, he looked from the window and saw a great bright light on a mountain beyond the town.
        - id: ch03-b02
          speaker: elder_brother
          text: What can that light be?
        - id: ch03-b03
          speaker: princess
          text: Ah, do not look at it! It shines from the house of a wicked witch, and no man has ever managed to kill her.
          emotion: fearful
        - id: ch03-b04
          speaker: narrator
          text: The princess would have done better to say nothing. Her warning only made her husband burn to test his strength against the witch's cunning. He could think of little else, and the desire grew stronger all through the day. The next morning, his wife wept and begged him not to go. He would not be turned aside. He mounted his horse and set out for the mountain.
        - id: ch03-b05
          speaker: narrator
          text: The journey was longer than he expected, and darkness fell before he reached the mountain. Without the bright light, which shone on his path like the moon, he could not have found his way. At last, he came to a fine castle with firelight pouring from every window.
        - id: ch03-b06
          speaker: narrator
          text: He climbed the steps and entered a hall. A hideous old woman sat there on a golden chair. She glared at him.
        - id: ch03-b07
          speaker: witch
          text: One hair from my head is enough to turn you to stone.
        - id: ch03-b08
          speaker: elder_brother
          text: What nonsense! Be quiet, old woman. What harm could one hair possibly do?
        - id: ch03-b09
          speaker: narrator
          text: The witch did not argue. She plucked one hair from her head and placed it on his shoulder. Coldness crept through his limbs. They grew so heavy that he could not lift an arm or take a step. He stood there helpless beneath her spell.
        - id: ch03-b10
          speaker: narrator
          text: At that very moment, the younger brother was thinking about him. He wondered what had happened in all the years since they had parted.
        - id: ch03-b11
          speaker: younger_brother
          text: I will go to the fig tree and see whether my brother is alive or dead.
        - id: ch03-b12
          speaker: narrator
          text: He rode through the forest to the tree and cut a slit in its bark. A soft gurgling came from within. Then blood streamed out, fast and red.
        - id: ch03-b13
          speaker: younger_brother
          text: Oh, misery! My brother is dead or dying. Will I reach him in time to save his life?
          emotion: sad
        - id: ch03-b14
          speaker: narrator
          text: He leaped onto his horse.
        - id: ch03-b15
          speaker: younger_brother
          text: Now, my steed, fly like the wind!
        - id: ch03-b16
          speaker: narrator
          text: They rode across the world until, one day, they entered the town where the elder brother had lived with his wife. Since her husband left, the princess had sat each day listening for his footsteps and weeping bitter tears.
        - id: ch03-b17
          speaker: narrator
          text: When she saw the younger brother beneath her balcony, she thought her husband had come home. The brothers looked so much alike that no one could tell them apart. Her heart leaped, and she bent over the balcony.
        - id: ch03-b18
          speaker: princess
          text: At last! At last! I have waited so long for you!
          emotion: happy
        - id: ch03-b19
          speaker: narrator
          text: The younger brother understood her words at once. His brother had lived in this town, and the beautiful woman above him must be his sister-in-law. But he kept his discovery to himself. He let her go on believing that her husband had returned. Full of joy, the princess brought him before the old king. The king welcomed him as his own son and ordered a feast to celebrate his return.
        - id: ch03-b20
          speaker: narrator
          text: But when the princess tried to embrace and kiss him, he raised a hand to stop her.
        - id: ch03-b21
          speaker: younger_brother
          text: Do not touch me.
        - id: ch03-b22
          speaker: narrator
          text: The princess was greatly puzzled. Several days passed this way. Then, one evening, the younger brother leaned from the balcony and saw a bright light on the mountain.
        - id: ch03-b23
          speaker: younger_brother
          text: What is that light over there?
        - id: ch03-b24
          speaker: princess
          text: Oh, come away! Hasn't that light already brought you ruin? Do you want to fight that old witch a second time?
          emotion: fearful
        - id: ch03-b25
          speaker: narrator
          text: Without knowing it, she had shown him where his brother was and what had happened. Before sunrise, he slipped out, saddled his horse, and rode toward the mountain.
    - id: ch04
      title: The Brother in the Stone Hall
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Once again, the road proved longer than it seemed. Along the way, the younger brother met a little old man who asked where he was going. The young man told his story.
        - id: ch04-b02
          speaker: younger_brother
          text: Somehow, I must free my brother. An old witch has him in her power.
        - id: ch04-b03
          speaker: old_man
          text: Then listen carefully. The witch's power is in her hair. As soon as you see her, leap at her and seize it. Never let go, or she can harm you. Make her lead you to your brother and bring him back to life. She owns an ointment that heals every wound and even wakes the dead. Once your brother stands safe before you, cut off her head, for she is wicked.
        - id: ch04-b04
          speaker: narrator
          text: The younger brother thanked him and promised to obey. He rode on to the castle, climbed the steps without fear, and entered the hall. The hideous witch came to meet him with a dreadful grin.
        - id: ch04-b05
          speaker: witch
          text: With one hair from my head, I can turn you to stone!
        - id: ch04-b06
          speaker: younger_brother
          text: Can you really?
        - id: ch04-b07
          speaker: narrator
          text: He sprang forward and seized her by the hair.
        - id: ch04-b08
          speaker: younger_brother
          text: You wicked old creature! Tell me what you did to my brother, or I will cut off your head this instant.
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: With her hair held fast, the witch lost all her strength and had to obey.
        - id: ch04-b10
          speaker: witch
          text: I will take you to him, but let go of me. You are holding me so tightly that I cannot walk.
        - id: ch04-b11
          speaker: younger_brother
          text: You will have to manage somehow.
        - id: ch04-b12
          speaker: narrator
          text: He refused to loosen his hand and gripped her hair more tightly than before. Somehow, the witch was forced to walk. She led him into a large hall crowded with silent stone statues. Every one of those cold figures had once been a living man. The witch stopped before one of them and pointed.
        - id: ch04-b13
          speaker: witch
          text: There is your brother.
        - id: ch04-b14
          speaker: narrator
          text: The young man examined every statue and shook his head.
        - id: ch04-b15
          speaker: younger_brother
          text: My brother is not here. Take me to him, or you will suffer for it.
        - id: ch04-b16
          speaker: narrator
          text: The witch tried to fool him with one statue after another, but he would not be deceived. Only in the very last hall did he find his brother lying on the ground.
        - id: ch04-b17
          speaker: younger_brother
          text: That is my brother. Now give me the ointment that will bring him back to life.
        - id: ch04-b18
          speaker: narrator
          text: Very unwillingly, the witch opened a cupboard close at hand. Its shelves were filled with bottles and jars. She took one down and held it out, hoping to deceive him. But the younger brother was watching for trickery. He examined the jar with care and saw that there was no healing power in it. The witch tried the same trick many times, offering one useless jar after another. At last, she understood that she could not fool him and gave him the ointment he had demanded.
        - id: ch04-b19
          speaker: narrator
          text: Once the true ointment was safely in his possession, he made the witch kneel beside his brother and spread it across the dead man's face. All the while, he kept her hair twisted firmly in his hand. The elder brother's eyes opened. As soon as he saw his brother alive and safe, the younger man drew his sword and cut off the witch's head with one blow.
        - id: ch04-b20
          speaker: narrator
          text: The elder brother rose, stretched, and looked around him.
        - id: ch04-b21
          speaker: elder_brother
          text: How long I must have slept! Where am I?
          emotion: surprised
        - id: ch04-b22
          speaker: younger_brother
          text: The old witch enchanted you. She is dead now, and you are free. Let us wake the other knights she put under her spell, and then we can leave.
        - id: ch04-b23
          speaker: narrator
          text: The brothers restored the other knights. They divided the jewels and gold found in the castle, and then each knight went his own way. The brothers stayed together. The elder held tightly to the ointment that had brought him back to life.
    - id: ch05
      title: The Wicked Blow
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As they rode, the brothers had many things to tell each other. At last, the younger brother spoke about the princess.
        - id: ch05-b02
          speaker: younger_brother
          text: What a fool you were to leave such a beautiful wife and go fight a witch! She thought I was her husband, and I did not tell her otherwise.
        - id: ch05-b03
          speaker: narrator
          text: The elder brother heard that the princess had taken this man for her husband. A terrible rage filled his heart. Without asking anything or saying a single word, he drew his sword and struck his brother dead. The younger man's body rolled from the road into the dust.
        - id: ch05-b04
          speaker: narrator
          text: The elder brother rode home. His wife was still waiting there in tears. When she saw him, she cried out and threw herself into his arms.
        - id: ch05-b05
          speaker: princess
          text: Oh, I have waited so long for you! You must never, ever leave me again!
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: The old king welcomed him like a son and prepared a feast. The whole court sat down together. That evening, when the husband and wife were alone, the princess questioned him.
        - id: ch05-b07
          speaker: princess
          text: When you came home before, why wouldn't you let me touch you? Whenever I tried to embrace or kiss you, why did you push me away?
        - id: ch05-b08
          speaker: narrator
          text: Her question showed the elder brother the whole truth. His brother had not allowed the princess to embrace or kiss him. He had been loyal every moment he stayed in the palace. The elder brother understood what a wicked murder he had committed. He sank down, weeping and wringing his hands because he had killed his faithful brother.
        - id: ch05-b09
          speaker: narrator
          text: Then a sudden hope made him leap to his feet. The witch's ointment was still hidden in his clothes. He rushed back to the place where his brother's body lay and dropped to his knees beside it. Taking out the salve, he rubbed it over the neck where the wound still gaped. Before his eyes, the skin joined together and the sinews grew strong. Life returned to the dead man. He sat up and looked all around him.
        - id: ch05-b10
          speaker: narrator
          text: The brothers embraced. The elder begged forgiveness for his wicked blow. Then they returned to the palace together, and they were never parted again.
