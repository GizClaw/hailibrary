  chapters:
    - id: ch01
      title: Under the Cherry Tree
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there lived a wonderfully beautiful cat named Gon. His coat shone like silk, and his wise green eyes could see even in the dark. He belonged to a music teacher who loved him dearly and would not have given him up for anything.
        - id: ch01-b02
          speaker: narrator
          text: Not far away, a lady lived with a lovely little cat named Koma. Koma blinked so sweetly, ate her supper so neatly, and afterward cleaned her pink nose with her tiny tongue. Her mistress never tired of admiring her.
        - id: ch01-b03
          speaker: lady
          text: Koma, my darling, what would I ever do without you?
        - id: ch01-b04
          speaker: narrator
          text: One evening, Gon and Koma went walking and met beneath a cherry tree. In a single moment, they fell deeply in love. Gon had thought for some time that he ought to find a wife. All the neighborhood cats paid him so much attention that they made him shy, but none of them had pleased him. Then he saw Koma, and love caught him before he could think.
        - id: ch01-b05
          speaker: narrator
          text: Koma loved him just as much, though she could see what stood in their way. Sadly, the two cats wondered how they could ever be together. Gon begged his master to buy Koma, but her mistress would not let her go.
        - id: ch01-b06
          speaker: lady
          text: I cannot part with Koma. She must stay with me.
        - id: ch01-b07
          speaker: narrator
          text: Then they asked Koma's mistress to buy Gon. The music teacher would not even consider it.
        - id: ch01-b08
          speaker: music_teacher
          text: No. I could never sell Gon.
        - id: ch01-b09
          speaker: narrator
          text: So nothing changed, and the two cats remained apart.
    - id: ch02
      title: Into the Unknown World
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At last, Gon and Koma could bear their separation no longer. They decided to choose their own path and seek their fortunes together. One moonlit night, they slipped away from home and set out into a world they did not know.
        - id: ch02-b02
          speaker: narrator
          text: They walked bravely through the sunshine all day, leaving their homes far behind. By evening, they had reached a large park. They were hot and tired. The grass looked soft, and the trees spread cool, deep shadows over the ground.
        - id: ch02-b03
          speaker: narrator
          text: Then an ogre seemed to burst into that peaceful place, though this ogre was really an enormous dog. He sprang at them with all his teeth showing. Koma shrieked and raced up a cherry tree.
        - id: ch02-b04
          speaker: narrator
          text: Gon stood where he was and prepared to fight. Koma was watching him, and he felt he could not run. Yet courage alone could not have saved him if that fierce, powerful dog had caught him.
        - id: ch02-b05
          speaker: narrator
          text: From her branch, Koma saw the danger. She cried out as loudly as she could, hoping someone would hear and come to help. Luckily, a servant of the princess who owned the park was passing nearby. He drove the dog away, lifted the trembling Gon into his arms, and carried him to the princess.
        - id: ch02-b06
          speaker: narrator
          text: Poor Koma was left alone. Gon was carried away in great distress, with no idea what he could do. The princess delighted in his beauty and his charming ways, but all her attention could not comfort him. He could not fight what had happened. He could only wait and see what came next.
    - id: ch03
      title: The Serpent in the Palace
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The princess became Gon's new mistress. She was so good and kind that everyone loved her. She might have lived happily, except that a serpent had fallen in love with her. Again and again, he came to trouble her.
        - id: ch03-b02
          speaker: narrator
          text: The princess ordered her servants to drive him away whenever he appeared. But the servants were careless, and the serpent was sly. Sometimes he slipped past them and frightened her by suddenly appearing before her.
        - id: ch03-b03
          speaker: narrator
          text: One day, the princess sat in her room playing her favorite musical instrument. Something began sliding up her sash. She looked down and saw the serpent creeping toward her cheek to kiss it.
        - id: ch03-b04
          speaker: narrator
          text: The princess screamed and threw herself backward. Gon had been curled on a stool at her feet. He understood her terror at once. With a single leap, he caught the serpent by the neck. He bit him, shook him once, and flung him onto the floor. The serpent lay there and never troubled the princess again.
        - id: ch03-b05
          speaker: narrator
          text: The princess gathered Gon into her arms. She praised him and stroked him, gave him the finest morsels to eat, and made sure he had the softest mats for sleeping. Gon would have wanted nothing else in the world, if only he could have seen Koma again.
    - id: ch04
      title: Gon Finds Koma
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Time passed. One morning, Gon lay in the sunshine before the house door. He gazed sleepily across the world in front of him. Far away, he noticed a large, rough cat tormenting a much smaller one.
        - id: ch04-b02
          speaker: narrator
          text: Gon sprang up in a fury and chased the big cat away. Then he turned to comfort the little cat. His heart almost burst with joy. It was Koma.
        - id: ch04-b03
          speaker: narrator
          text: At first, Koma did not recognize him. Gon had grown so large and stately. Then she realized who stood before her, and her happiness had no bounds. Again and again, they rubbed their heads and noses together. Their purring could have been heard a mile away.
    - id: ch05
      title: Together to the End
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Paw in paw, Gon and Koma went before the princess. They told her everything that had happened to them and all the sorrow they had endured. The princess wept for them. She promised that they would never be separated again and could live with her for the rest of their days.
        - id: ch05-b02
          speaker: princess
          text: You will stay here together. No one will ever part you again.
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: After a while, the princess married. A prince came to live with her in the palace in the park. She told him about her two cats. She told him how bravely Gon had saved her from the serpent.
        - id: ch05-b04
          speaker: prince
          text: These cats shall never leave us. Wherever you go, they will go with you.
        - id: ch05-b05
          speaker: narrator
          text: And so everything happened just as the princess wished. Gon and Koma had many children, and so did the princess. All the children played together, and they remained friends to the end of their lives.
