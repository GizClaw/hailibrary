audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    gon:
      display_name: 贡
      tts:
        delivery: 真挚果敢，危急时坚定勇敢
        timbre: 清亮结实
        pace: 中速，情急时稍快
        pitch: 中低音
    koma:
      display_name: 驹
      tts:
        delivery: 温柔细腻，又有坚定的真情
        timbre: 轻柔清甜
        pace: 中缓，焦急时稍快
        pitch: 中高音
    koma_mistress:
      display_name: 驹的女主人
      tts:
        delivery: 疼爱亲昵，语气柔和
        timbre: 柔润清晰
        pace: 舒缓
        pitch: 中音
    princess:
      display_name: 公主
      tts:
        delivery: 善良真诚，语气温和而有分量
        timbre: 明亮柔和
        pace: 中缓
        pitch: 中高音
    prince:
      display_name: 王子
      tts:
        delivery: 坦率庄重，许诺时坚定
        timbre: 沉稳清晰
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 樱花树下的相遇
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一只美得出奇的猫，名叫贡。他的毛像丝绸一样柔滑发亮，聪慧的绿眼睛在黑暗里也看得清。贡的主人是一位音乐教师，对他又爱又得意。拿世上什么来换，主人都不肯让出贡。
        - id: ch01-b02
          speaker: narrator
          text: 不远处还住着一位太太。她有只小母猫，叫驹。驹眨眼时优雅极了，吃晚饭斯斯文文，吃完还会用小舌头，轻轻舔干净粉红的鼻子。
        - id: ch01-b03
          speaker: koma_mistress
          text: 驹呀，我要是没有你，日子可怎么过呢？
        - id: ch01-b04
          speaker: narrator
          text: 有天傍晚，贡和驹各自出门散步，在一棵樱花树下遇见了。只是一眼，他们就疯狂地爱上了对方。
        - id: ch01-b05
          speaker: narrator
          text: 贡早觉得自己该娶妻了。附近的猫姑娘都对他大献殷勤，弄得他怪害羞的。可他眼光高，谁也没看上。这一回，贡还来不及细想，就被爱神缠进了情网，满心都是驹。
        - id: ch01-b06
          speaker: narrator
          text: 驹也深深爱上了贡。可她一下就看到了面前的难题，只好忧心地同贡商量。
        - id: ch01-b07
          speaker: koma
          text: 我们都舍不得对方，可两位主人也都舍不得我们。这个难关，该怎么过呢？
        - id: ch01-b08
          speaker: narrator
          text: 贡再三求音乐教师买下驹，可驹的女主人怎么也不肯分别。又有人请音乐教师把贡卖过去，他却连听都不愿听。事情一点也没有改变。
    - id: ch02
      title: 月夜私奔
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 贡和驹爱得越来越深，终于决定自己做主，一同出去闯荡。一个月光明亮的夜晚，他们悄悄离开家，走进了全然陌生的世界。
        - id: ch02-b02
          speaker: narrator
          text: 他们顶着阳光，勇敢地走了一整天，把家远远抛在身后。傍晚，两只猫走进一座宽阔的花园。他们又热又累，眼前的青草柔软极了，树下的阴影又深又凉。
        - id: ch02-b03
          speaker: narrator
          text: 谁知道，这片乐园里猛然跳出一个怪物。原来是一只好大好大的狗！他露着满口牙，对准两只猫直扑过来。
        - id: ch02-b04
          speaker: koma
          text: 快来人啊，救救我们！
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: 驹尖叫一声，飞快地蹿上了樱花树。贡却守在原地，摆好架势准备迎战。他知道驹正在树上看他，自己绝不能逃。
        - id: ch02-b06
          speaker: narrator
          text: 可那条狗太高大，太强壮，也太凶猛。只要挨上一下，贡有再大的勇气也没有用。
        - id: ch02-b07
          speaker: narrator
          text: 驹在树上看得一清二楚，便拼命叫喊，盼着谁能听见，赶来帮忙。幸好，这座花园属于一位公主，她的仆人恰好从附近经过。他赶跑恶狗，抱起浑身发抖的贡，把他带去见公主。
        - id: ch02-b08
          speaker: narrator
          text: 可怜的驹被独自留了下来。贡心乱如麻，一点儿也不知道该怎么办。
    - id: ch03
      title: 贡救了公主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 公主喜欢贡漂亮的模样，也喜欢他可爱的举止，对他十分关心。可贡还是难过。他无法和命运争辩，只能等下去，看看以后会有什么转机。
        - id: ch03-b02
          speaker: narrator
          text: 这位公主又善良又仁慈，所有人都爱她。她原本会过得很幸福，偏偏有一条蛇爱上了她，一次又一次地来纠缠。
        - id: ch03-b03
          speaker: narrator
          text: 公主吩咐仆人，蛇一露面就要赶走。偏偏仆人粗心，蛇又十分狡猾，有时还是能偷偷溜过他们，冷不防出现在公主面前，把她吓一大跳。
        - id: ch03-b04
          speaker: narrator
          text: 有一天，公主坐在房间里，正弹着最喜欢的乐器。突然，她感觉有什么东西沿腰带滑了上来。原来是那条蛇。他正爬向公主的面颊，想要亲她。
        - id: ch03-b05
          speaker: narrator
          text: 公主惊叫着往后一仰。贡原本蜷在她脚边的凳子上，马上就明白了她为什么害怕。他纵身一跃，一下制住蛇的脖子，狠狠咬了一口，再用力一甩，把他摔到了地上。
        - id: ch03-b06
          speaker: narrator
          text: 蛇倒在那里，再也不能骚扰公主了。公主把贡抱进怀里，一边夸奖，一边亲热地抚摸他。
        - id: ch03-b07
          speaker: princess
          text: 贡，你救了我。你真是一只勇敢的好猫！
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: 从此，贡吃的都是最好的东西，睡的都是最柔软的垫子。要是还能再见驹一面，他在世上就真的什么都不缺了。
    - id: ch04
      title: 重逢
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 日子一天天过去。一个早晨，贡躺在屋门前晒太阳，懒洋洋地看着眼前的世界。
        - id: ch04-b02
          speaker: narrator
          text: 远处，一只又大又蛮横的猫，正在折磨一只小得多的猫。贡一看就怒了。他立刻跳起来，赶跑那只大猫，然后转身去安慰受欺负的小猫。
        - id: ch04-b03
          speaker: narrator
          text: 他这才发现，眼前的竟然是驹。贡欢喜得心都快要胀破了。
        - id: ch04-b04
          speaker: gon
          text: 驹，真的是你！我终于找到你了！
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: 驹一开始没有认出贡。他已经长得又高大又神气，和从前大不相同了。等她终于明白眼前是谁，那份幸福简直没有边。
        - id: ch04-b06
          speaker: koma
          text: 贡，是你！我还以为再也见不到你了！
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: 两只猫一遍又一遍地用头和鼻子蹭着对方，呼噜声响得不得了，恐怕连一英里以外都听得见。
    - id: ch05
      title: 永不分离
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 贡和驹爪牵着爪，一同来到公主面前，把他们一路上的遭遇和苦难，全都讲给她听。公主听得流下了同情的眼泪。
        - id: ch05-b02
          speaker: princess
          text: 你们吃了这么多苦，以后再也不会分开了。你们就留在我身边，一直住到生命的最后一天。
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: 过了一些时候，公主也结婚了。她带来一位王子，两人一同住进花园里的宫殿。
        - id: ch05-b04
          speaker: narrator
          text: 公主把两只猫的故事都告诉了王子。她讲到贡有多勇敢，又讲到他怎样除掉蛇，从那个敌人手中救了她。
        - id: ch05-b05
          speaker: prince
          text: 贡和驹永远都不必离开我们。以后公主走到哪里，他们就能跟到哪里。
        - id: ch05-b06
          speaker: narrator
          text: 事情果然都按公主希望的那样发生了。后来，贡和驹有了许多孩子，公主也有了许多孩子。孩子们总在一起玩耍，彼此做了一辈子的好朋友。
