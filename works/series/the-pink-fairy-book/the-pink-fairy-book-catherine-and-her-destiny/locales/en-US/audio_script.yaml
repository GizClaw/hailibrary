  chapters:
    - id: ch01
      title: A Choice for the Future
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, there lived a merchant richer than any king. In his great hall stood three chairs, one of silver, one of gold, and one of diamonds. Yet his greatest treasure was his only daughter, Catherine.
        - id: ch01-b02
          speaker: narrator
          text: One day, Catherine was sitting in her room when the door suddenly flew open. A tall, beautiful woman entered, carrying a little wheel.
        - id: ch01-b03
          speaker: destiny
          text: Catherine, which would you choose, a happy youth or a happy old age?
        - id: ch01-b04
          speaker: narrator
          text: Catherine was too startled to answer, so the woman asked her once more.
        - id: ch01-b05
          speaker: destiny
          text: Tell me. Would you rather have a happy youth or a happy old age?
        - id: ch01-b06
          speaker: narrator
          text: Catherine thought carefully. If she chose happiness while she was young, she might suffer for all the rest of her life. Better to bear trouble now, she decided, and have happier days ahead.
        - id: ch01-b07
          speaker: catherine
          text: Give me a happy old age.
        - id: ch01-b08
          speaker: destiny
          text: So be it.
        - id: ch01-b09
          speaker: narrator
          text: The woman turned her wheel as she spoke. Then she vanished as suddenly as she had come. She was Catherine's Destiny.
        - id: ch01-b10
          speaker: narrator
          text: Only a few days later, terrible news reached the merchant. A storm had sunk all his finest ships, though they had been loaded with his richest goods. In a single blow, he was left a beggar. The shock was more than he could bear. He took to his bed, and before long, he died of disappointment.
        - id: ch01-b11
          speaker: narrator
          text: Catherine was alone in the world now, without a penny or anyone to help her. But she was brave and full of spirit. She decided to go to the nearest town and earn her bread as a servant.
        - id: ch01-b12
          speaker: narrator
          text: She prepared at once and soon reached the town. As she walked along its main street, a noble lady saw her sad face from a window and called down to her.
        - id: ch01-b13
          speaker: first_lady
          text: Where are you going all alone, my pretty girl?
        - id: ch01-b14
          speaker: catherine
          text: Ah, my lady, I am very poor. I must find a place as a servant so I can earn my bread.
        - id: ch01-b15
          speaker: first_lady
          text: Then you may come and serve me.
        - id: ch01-b16
          speaker: narrator
          text: Catherine entered the lady's service and did her work well.
        - id: ch01-b17
          speaker: first_lady
          text: I must go out for a long while today. I will lock the door so no thieves can enter.
        - id: ch01-b18
          speaker: narrator
          text: After the lady left, Catherine took her work and sat by the window. All at once, the locked door burst open, and her Destiny walked in.
        - id: ch01-b19
          speaker: destiny
          text: Oh, so this is where you are, Catherine! Did you truly think I would leave you in peace?
        - id: ch01-b20
          speaker: narrator
          text: Destiny went straight to the linen press. She tore the lady's finest sheets and underclothes to pieces and threw them all over the floor.
        - id: ch01-b21
          speaker: narrator
          text: Poor Catherine wrung her hands and wept. She thought of her mistress coming home and finding all her precious linen destroyed. Surely the lady would believe Catherine had done it. In her fear, Catherine sprang up and fled through the open door.
        - id: ch01-b22
          speaker: narrator
          text: Once Catherine was gone, Destiny made every torn piece whole again. She put everything neatly back in the press and left the house.
        - id: ch01-b23
          speaker: narrator
          text: When the lady returned, she called for Catherine, but Catherine was nowhere to be found. The lady wondered if the girl had robbed her and searched the house in haste. Nothing was missing. She could not understand why Catherine had disappeared, and after a few days she hired someone else.
    - id: ch02
      title: Seven Years of Trouble
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meanwhile, Catherine wandered on without knowing where she was going. At last, she came to another town. Once again, a noble lady noticed her passing beneath a window and called to her.
        - id: ch02-b02
          speaker: second_lady
          text: Where are you going all alone, my pretty girl?
        - id: ch02-b03
          speaker: catherine
          text: Ah, my lady, I am very poor. I must find work as a servant to earn my bread.
        - id: ch02-b04
          speaker: second_lady
          text: Then I will take you into my service.
        - id: ch02-b05
          speaker: narrator
          text: Catherine served this lady well and hoped she might finally be left in peace. But one day, when she was alone in the house, her Destiny returned.
        - id: ch02-b06
          speaker: destiny
          text: What? Have you come here now?
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: In a rage, Destiny tore apart everything she saw. Catherine was so miserable that she ran from the house.
        - id: ch02-b08
          speaker: narrator
          text: The same thing went on for seven years. Catherine would wander until she found another place and begin serving in a new house. Then her Destiny would appear, cause some terrible destruction, and force her to run away again.
        - id: ch02-b09
          speaker: narrator
          text: At last, Destiny seemed to grow tired of tormenting her, and Catherine was given a time of peace. After the final cruel prank had chased her from yet another house, she entered the service of a different lady.
        - id: ch02-b10
          speaker: narrator
          text: This mistress gave Catherine a daily task. She must carry freshly baked loaves to the top of the mountain above the town. There she must lay them on the ground and call three times for her mistress's Destiny. That Destiny would come and take the offering.
        - id: ch02-b11
          speaker: catherine
          text: I will gladly do it.
        - id: ch02-b12
          speaker: narrator
          text: The years passed, and Catherine stayed in that household. Every day, she put the fresh bread in a basket, carried it on her arm, and climbed all the way to the mountaintop. There she laid down the loaves and called for her mistress's Destiny three times. Catherine was happier than before. Still, when no one could see her, she sometimes wept over the life she had lost and how different it was from the life she now led.
        - id: ch02-b13
          speaker: mistress
          text: Catherine, what is wrong? Why do you weep so often?
        - id: ch02-b14
          speaker: narrator
          text: Catherine told her mistress the whole story.
        - id: ch02-b15
          speaker: mistress
          text: I have an idea! Tomorrow, when you take the bread up the mountain, ask my Destiny to speak to yours. Beg her to make your Destiny leave you in peace. Perhaps it will help.
        - id: ch02-b16
          speaker: narrator
          text: Catherine dried her eyes. The next morning, she climbed the mountain, told her mistress's Destiny all she had suffered, and made her plea.
        - id: ch02-b17
          speaker: catherine
          text: O Destiny of my mistress, please speak to my Destiny for me. Beg her to leave me in peace.
        - id: ch02-b18
          speaker: mistress_destiny
          text: Oh, my poor girl! Do you not know that your Destiny lies beneath seven coverlets and cannot hear a thing? Come back tomorrow, and I will bring her to you.
    - id: ch03
      title: The Ball of Silk
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After Catherine had gone, her mistress's Destiny went to find her sister.
        - id: ch03-b02
          speaker: mistress_destiny
          text: Dear sister, has Catherine not suffered enough? Surely it is time for her good days to begin.
        - id: ch03-b03
          speaker: destiny
          text: Bring her to me tomorrow. I will give her something that may help her in her need.
        - id: ch03-b04
          speaker: narrator
          text: Catherine set out earlier than usual the next morning and hurried up the mountain. Her mistress's Destiny was waiting there. She took Catherine by the hand and led her to her sister, Catherine's own Destiny, who still lay hidden beneath all seven coverlets.
        - id: ch03-b05
          speaker: narrator
          text: Catherine's Destiny held out a ball of silk.
        - id: ch03-b06
          speaker: destiny
          text: Keep this. It may be useful one day.
        - id: ch03-b07
          speaker: narrator
          text: Then Destiny pulled the coverings over her head once more.
        - id: ch03-b08
          speaker: narrator
          text: Catherine walked sadly down the mountain. She went straight to her mistress and showed her the silken ball, all that had come of her high hopes.
        - id: ch03-b09
          speaker: catherine
          text: What can I do with this? It is not worth sixpence, and it is no use to me!
          emotion: sad
        - id: ch03-b10
          speaker: mistress
          text: Take good care of it. Who knows how useful it may become?
    - id: ch04
      title: The King's Wedding Garment
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Not long afterward, the whole town began preparing for the king's wedding. Every tailor was busy embroidering splendid clothes. The king's wedding garment was so beautiful that no one had ever seen anything like it. But just as the work was almost done, the tailor discovered that he had run out of silk.
        - id: ch04-b02
          speaker: narrator
          text: The color was very rare, and no matching silk could be found. So the king proclaimed that anyone who had some must bring it to court and would receive a great sum in return.
        - id: ch04-b03
          speaker: mistress
          text: Catherine! I have seen the wedding garment at the tailor's. Your ball of silk is exactly the right color. Take it to the king, and you may ask whatever you wish for it.
        - id: ch04-b04
          speaker: narrator
          text: Catherine put on her best clothes and went to court. She looked more beautiful than any woman there.
        - id: ch04-b05
          speaker: catherine
          text: May it please your majesty, I have brought a ball of silk in the color you asked for. No one else in town has any.
        - id: ch04-b06
          speaker: courtier
          text: Your majesty, shall I give this maiden the silk's weight in gold?
        - id: ch04-b07
          speaker: narrator
          text: The king agreed, and a pair of scales was brought into the court. A handful of gold went into one pan and the little ball of silk into the other. The king added more gold, then more again. Yet no matter how many pieces he put on the scale, the silk always remained heavier.
        - id: ch04-b08
          speaker: narrator
          text: The king ordered larger scales. He piled every treasure he owned on one side, but still the ball of silk outweighed them all. Only one thing had not been added. It was the golden crown on his head.
        - id: ch04-b09
          speaker: narrator
          text: The king set his crown on top of the treasure. At last, the scale moved, and the ball of silk was balanced.
        - id: ch04-b10
          speaker: king
          text: Where did you get this silk?
        - id: ch04-b11
          speaker: catherine
          text: My mistress gave it to me, your majesty.
        - id: ch04-b12
          speaker: king
          text: That is not true. Tell me the truth now, or I will have your head cut off this instant.
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: With her life at stake, Catherine told the king the whole story. She explained that she had once been as rich as he was. Then she told him about the strange visitor and the choice she had made, her father's ruin and death, the seven years of persecution, and the gift she had received beneath the seven coverlets.
    - id: ch05
      title: Catherine's Happy Age
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A wise woman lived at the court, and she had listened to Catherine's story.
        - id: ch05-b02
          speaker: wise_woman
          text: You have suffered greatly, my poor girl, but your luck has turned at last. I know from the scales, and from the crown that balanced them, that you will die a queen.
        - id: ch05-b03
          speaker: king
          text: And so she shall! She will die as my queen. She is more beautiful than every lady at court, and I will marry no one else.
        - id: ch05-b04
          speaker: narrator
          text: And that is what happened. The king sent the bride he had promised to marry back to her own country. Catherine took her place as queen at the wedding feast.
        - id: ch05-b05
          speaker: narrator
          text: From that day on, Catherine lived happily and contentedly for the rest of her life.
