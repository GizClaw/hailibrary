audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    catherine:
      display_name: "凯瑟琳"
      tts:
        delivery: "勇敢真诚，历经苦难仍保有柔韧"
        timbre: "清澈柔和的年轻女声"
        pace: "适中"
        pitch: "中高音"
    catherine_destiny:
      display_name: "凯瑟琳的命运女神"
      tts:
        delivery: "冷峻莫测，发怒时尖刻逼人"
        timbre: "清冷有力的女声"
        pace: "适中偏慢"
        pitch: "中音"
    first_mistress:
      display_name: "第一位女主人"
      tts:
        delivery: "和善端庄，说话简洁"
        timbre: "温和成熟的女声"
        pace: "适中"
        pitch: "中音"
    second_mistress:
      display_name: "第二位女主人"
      tts:
        delivery: "亲切爽快，待人宽厚"
        timbre: "明朗成熟的女声"
        pace: "适中"
        pitch: "中音"
    final_mistress:
      display_name: "最后一位女主人"
      tts:
        delivery: "体贴稳重，劝慰时温柔坚定"
        timbre: "温润清晰的女声"
        pace: "舒缓"
        pitch: "中音"
    mistress_destiny:
      display_name: "女主人的命运女神"
      tts:
        delivery: "仁慈沉着，言语里带着怜悯"
        timbre: "柔和空灵的女声"
        pace: "舒缓"
        pitch: "中高音"
    king:
      display_name: "国王"
      tts:
        delivery: "自负急躁，发号施令时不容置疑"
        timbre: "洪亮的成年男声"
        pace: "适中"
        pitch: "中低音"
    courtier:
      display_name: "大臣"
      tts:
        delivery: "恭敬谨慎，措辞清楚"
        timbre: "沉稳的成年男声"
        pace: "适中"
        pitch: "中音"
    wise_woman:
      display_name: "智慧的老妇人"
      tts:
        delivery: "洞察世事，语气笃定而慈爱"
        timbre: "苍老温厚的女声"
        pace: "舒缓"
        pitch: "中低音"
  chapters:
    - id: ch01
      title: "幸福的晚年"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "很久以前，有一位富商。他的珍宝比世上任何国王都多，大厅里还摆着银、金和钻石做成的三把椅子。不过，他最珍爱的宝贝，是独生女儿凯瑟琳。"
        - id: ch01-b02
          speaker: narrator
          text: "一天，凯瑟琳正坐在房里，门忽然开了。一位高挑美丽的女人走进来，手里拿着一只小纺轮。她来到凯瑟琳面前，问了一个奇怪的问题。"
        - id: ch01-b03
          speaker: catherine_destiny
          text: "凯瑟琳，幸福的青春和幸福的晚年，你想选哪一个？"
        - id: ch01-b04
          speaker: narrator
          text: "凯瑟琳毫无准备，不知道该怎样回答。女人便又问了一遍。凯瑟琳想，要是选了幸福的青春，往后余生就得一直受苦。与其那样，不如先熬过苦日子，把更好的生活留在将来。"
        - id: ch01-b05
          speaker: catherine
          text: "请让我有一个幸福的晚年吧。"
        - id: ch01-b06
          speaker: catherine_destiny
          text: "那就照你的选择来。"
        - id: ch01-b07
          speaker: narrator
          text: "女人一边回答，一边转动纺轮，转眼便不见了，消失得和出现时一样突然。原来，她就是可怜的凯瑟琳的命运女神。几天以后，富商接到噩耗。他那些最好的船满载着最贵重的货物，却全在风暴中沉没了。他一下从巨富变成了乞丐，经不起这样的打击，很快卧床不起，最后在失望中死去。"
        - id: ch01-b08
          speaker: narrator
          text: "凯瑟琳从此孤身一人，身上没有一文钱，世上也没有谁可以帮助她。可她既勇敢又有志气，很快决定去附近的城里当女仆。她没有耽搁，收拾好东西便立刻启程，没用多久就走完了这段路。她沿着城里的大街走过时，一位贵妇从窗口望见她，留意到她满脸忧愁，便叫住了她。"
        - id: ch01-b09
          speaker: first_mistress
          text: "漂亮姑娘，你一个人要去哪里？"
        - id: ch01-b10
          speaker: catherine
          text: "夫人，我太穷了，得找一份服侍人的差事，才能养活自己。"
        - id: ch01-b11
          speaker: first_mistress
          text: "那你就到我家来吧。"
        - id: ch01-b12
          speaker: narrator
          text: "凯瑟琳进了贵妇家，尽心尽力地服侍她，事事都做得很好。过些日子，女主人说自己要出门很久，离开前得锁上大门，免得盗贼闯进屋。她走以后，凯瑟琳拿起手里的活儿，安静地坐在窗边。谁知房门突然大开，她的命运女神又来了。"
        - id: ch01-b13
          speaker: catherine_destiny
          text: "原来你在这儿！你当真以为我会让你安稳过日子？"
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: "命运女神走到衣柜前，把女主人珍藏的床单和贴身衣物全撕成碎片，扔得满地都是。凯瑟琳急得哭了。她怕女主人回来会怪罪自己，只好从开着的门里逃走。她一走，命运女神却把碎片全都恢复原样，放回柜中，收拾干净后也离开了。"
        - id: ch01-b15
          speaker: narrator
          text: "女主人回家后，连声呼唤凯瑟琳，屋里却无人回答。她心里一惊，怀疑凯瑟琳偷了东西，赶紧把整座房子都查了一遍，却发现什么也没少。她始终想不明白姑娘为何这样突然地消失，此后也再没听到凯瑟琳的消息。几天过去，她只得另找一个女仆补上空缺。"
    - id: ch02
      title: "七年的追逐"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "这时候，凯瑟琳还在路上漫无目的地走着，连自己要去哪里也说不清。她就这样一直走，最后来到另一座城。事情和上次一模一样，又有一位贵妇恰好从窗口看见她经过，便高声叫住了她。"
        - id: ch02-b02
          speaker: second_mistress
          text: "漂亮姑娘，你孤身一人，这是要去哪儿？"
        - id: ch02-b03
          speaker: catherine
          text: "夫人，我一贫如洗，只能找人家做事，换一口饭吃。"
        - id: ch02-b04
          speaker: second_mistress
          text: "那就来服侍我吧。"
        - id: ch02-b05
          speaker: narrator
          text: "凯瑟琳又成了尽心的女仆，以为这次总能平静生活了。可她独自在家时，命运女神再次闯了进来。"
        - id: ch02-b06
          speaker: catherine_destiny
          text: "怎么，你现在又藏到这里来了？"
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: "命运女神怒气冲冲，把看到的东西全都撕毁。凯瑟琳苦不堪言，又从那座房子里逃了出去。此后整整七年，她每找到一个新主人，命运女神就赶来逼她离开。"
        - id: ch02-b08
          speaker: narrator
          text: "七年过去，命运女神仿佛终于折磨够了，凯瑟琳也有了一段安宁日子。她被那些恶作剧赶出上一户人家后，又投奔了一位贵妇。新主人交给她一件每天都要做的差事。城边有一座高山，山影罩着整座城。凯瑟琳要挎着几只新烤的面包爬到山顶，把面包摆在地上，再高声呼唤三遍。贵妇的命运女神听见后，就会现身收走这份供品。"
        - id: ch02-b09
          speaker: final_mistress
          text: "到了山顶，你就喊三遍‘命运女神，我的女主人’。"
        - id: ch02-b10
          speaker: catherine
          text: "这件事我很乐意做。"
        - id: ch02-b11
          speaker: narrator
          text: "日子一年年过去，凯瑟琳一直留在这户人家。她每天挎着面包上山，过得比从前快活。只是没人看见时，她会想起过去的生活，也会想到如今的一切已经完全不同，忍不住悄悄流泪。一天，女主人撞见了。"
        - id: ch02-b12
          speaker: final_mistress
          text: "凯瑟琳，你怎么了？为什么总在哭？"
        - id: ch02-b13
          speaker: narrator
          text: "凯瑟琳便把自己的遭遇从头说了一遍。女主人听完，忽然想到了一个办法。"
        - id: ch02-b14
          speaker: final_mistress
          text: "明天再送面包时，求我的命运女神去跟你的命运女神说一说，让她别再为难你。也许这样真能帮到你。"
    - id: ch03
      title: "七层被褥下的礼物"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "凯瑟琳擦掉眼泪。第二天爬上山后，她把自己受过的苦全都告诉了女主人的命运女神。"
        - id: ch03-b02
          speaker: catherine
          text: "命运女神，我的女主人，求您替我说说情，请我的命运女神放过我吧。"
        - id: ch03-b03
          speaker: mistress_destiny
          text: "可怜的姑娘，你还不知道吧？你的命运女神埋在七层被褥下面，外面的声音一点也听不到。你明天再来，我会带你去见她。"
        - id: ch03-b04
          speaker: narrator
          text: "凯瑟琳走后，这位命运女神去找自己的姐妹，问她，凯瑟琳已经受了这么多苦，难道还不该开始过好日子吗？"
        - id: ch03-b05
          speaker: catherine_destiny
          text: "明天带她来。我给她一样东西，也许能帮她渡过难关。"
        - id: ch03-b06
          speaker: narrator
          text: "第二天，凯瑟琳早早上山。女主人的命运女神牵着她，来到埋在七层被褥下的姐妹面前。凯瑟琳的命运女神递给她一个丝线团。"
        - id: ch03-b07
          speaker: catherine_destiny
          text: "把它收好，也许有一天会派上用场。"
        - id: ch03-b08
          speaker: narrator
          text: "说完，她又把七层被褥拉过来，重新蒙住自己的头。凯瑟琳满心忧伤地走下山，没有去别处，径直回到女主人面前，把丝线团拿给她看。她原本抱着那么大的希望，最后却只得到这个小东西。"
        - id: ch03-b09
          speaker: catherine
          text: "这东西能做什么？它连六便士都不值，对我根本没用！"
        - id: ch03-b10
          speaker: final_mistress
          text: "先好好留着。现在谁也说不准，它以后会有多大的用处。"
          emotion: calm
    - id: ch04
      title: "比王冠更重的丝线"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "不久，国王要举行婚礼。全国上下都在隆重筹备，城里的裁缝也忙着为婚礼刺绣华服。那件婚服美得前所未见，可快要完工时，稀有颜色的丝线偏偏用尽了，城里无论如何也找不到相同的。国王只好颁下命令，谁能献上这种丝线，就能得到一大笔赏金。"
        - id: ch04-b02
          speaker: final_mistress
          text: "凯瑟琳，我去看过那件婚服了。你的丝线正是他们要找的颜色！把它带给国王吧，你可以自己提出想要的报酬。"
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: "凯瑟琳穿上最好的衣裳，走进王宫。宫里所有女子都比不上她美。"
        - id: ch04-b04
          speaker: catherine
          text: "陛下，您要找的那种颜色，城里别人都没有。我这里正好有一团丝线，特地给您送来。"
        - id: ch04-b05
          speaker: courtier
          text: "陛下，要不要用同样重量的黄金赏给这位姑娘？"
        - id: ch04-b06
          speaker: narrator
          text: "国王点头答应。人们搬来天平，一边放丝线团，一边放上一把金币。可真是怪事，任凭国王添进多少金币，丝线总是更重。国王又叫人换来更大的天平，把自己的所有珍宝都堆在一边，另一边的丝线依然把它们全压了下去。到最后，只有国王头上的金王冠还没放进去。他摘下王冠，搁在所有珍宝顶端，天平终于动了，那团丝线这才有了和自己同等的分量。"
        - id: ch04-b07
          speaker: king
          text: "这团丝线，你是从哪里拿到的？"
        - id: ch04-b08
          speaker: catherine
          text: "陛下，是我的女主人送给我的。"
        - id: ch04-b09
          speaker: king
          text: "你没有说实话。马上把真相告诉我，不然我现在就叫人砍了你的头。"
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: "凯瑟琳只得说出自己的全部经历，也告诉国王，自己从前和他一样富有。"
    - id: ch05
      title: "命运终于转身"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "宫中住着一位智慧的老妇人。她听完凯瑟琳的故事，又想起方才天平上的王冠，便开口告诉她。"
        - id: ch05-b02
          speaker: wise_woman
          text: "可怜的姑娘，你吃过太多苦。不过现在，你的好运终于到了。丝线一直要称到王冠才平衡，这说明你离开人世时，已经是一位王后。"
        - id: ch05-b03
          speaker: narrator
          text: "国王在一旁听见了这句话，当即喊了起来。"
        - id: ch05-b04
          speaker: king
          text: "她当然会成为王后！她会作为我的王后度过一生。宫里没有哪位贵妇比她更美，我谁也不要，只娶她。"
        - id: ch05-b05
          speaker: narrator
          text: "后来果真如此。国王把那位自己早已答应迎娶的新娘送回她自己的国家，原定的婚礼仍然举行，只是婚宴上坐在王后位置的换成了凯瑟琳。从那一天起，她一直过得幸福而满足，直到生命的尽头。"
