audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    old_man:
      display_name: "老翁"
      tts:
        delivery: "善良厚道，语气温和诚恳"
        timbre: "温暖朴实的男声"
        pace: "舒缓"
        pitch: "中低音"
    old_woman:
      display_name: "老妇"
      tts:
        delivery: "贪婪暴躁，得意时刻意装得客气"
        timbre: "尖利有力的女声"
        pace: "稍快"
        pitch: "中高音"
    sparrow_maiden:
      display_name: "麻雀姑娘"
      tts:
        delivery: "温柔明快，待人真诚有礼"
        timbre: "清澈柔美的女声"
        pace: "从容"
        pitch: "中高音"
  chapters:
    - id: ch01
      title: "山中小屋"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "很久以前，一对老夫妻住在高山深处的一间小屋里。两人平日相处得还算安稳和睦，脾气却完全不同。老翁心善又厚道，老妇却又贪心又爱吵架，只要有人能跟她争上几句，她就一定不会放过。"
        - id: ch01-b02
          speaker: narrator
          text: "一天，老翁照例坐在小屋门口。忽然，一只小麻雀尖声叫着，直朝他飞来，后面还紧追着一只大黑乌鸦。乌鸦饿坏了，拼命拍着翅膀，伸长尖嘴，眼看就要追上自己的晚餐。老翁猛地起身，把它赶了回去。乌鸦失望地发出粗哑的嘶叫，飞上天空，小麻雀却依偎进了老翁的手心。"
        - id: ch01-b03
          speaker: old_man
          text: "别怕，别怕。到了这里，你就安全了。"
          emotion: calm
        - id: ch01-b04
          speaker: narrator
          text: "老翁轻轻抚摸它的羽毛，可掌心里那颗小心脏还是怦怦跳个不停。他便把麻雀放进笼中。没多久，小鸟就有了胆量，在里面啾啾地叫，还跳来跳去。老翁喜欢所有生灵，每天早晨都会打开笼门。麻雀快活地在屋里飞，一见猫、老鼠，或别的凶猛动物，就马上躲回笼子。它知道，那里谁也伤不了它。"
        - id: ch01-b05
          speaker: narrator
          text: "老妇本来就成天找事情抱怨，看见丈夫那么疼爱麻雀，心里越来越嫉妒。她早想伤害小鸟，只是一直不敢下手。终于有天早晨，老翁下山去了几英里外的镇子，要过好几个钟头才回来。出门以前，他照常打开了鸟笼。麻雀毫无戒心，欢叫着到处蹦跳，老妇的脸色却越来越难看，最后终于爆发了。"
        - id: ch01-b06
          speaker: narrator
          text: "麻雀停在墙壁高处的托架上。老妇抓起扫帚扔过去，没打中小鸟，反倒把架上的花瓶撞下来，摔得粉碎。这当然没能消掉她的火气，反而让她更加恼怒。老妇追着麻雀满屋跑，终于把它紧紧捏在手指间。小鸟怕得直发抖，就像第一次飞进这间屋子时那样。"
        - id: ch01-b07
          speaker: narrator
          text: "老妇气得发了狂。她没有胆量当场杀死麻雀，就剪开了它的舌头。小鸟拼命挣扎，凄声哀鸣，却没有人听见。后来，它疼得放声惨叫，飞出屋子，消失在森林深处。"
    - id: ch02
      title: "竹林深处"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "过了一阵，老翁回到家，马上问起心爱的小鸟。老妇还在生气，把事情全说了，又狠狠骂他，说他为一只鸟这样着急，简直傻透了。老翁听得忧心如焚。"
        - id: ch02-b02
          speaker: old_man
          text: "它那么弱小，又从没伤害过谁。你竟这样对它，心肠实在太狠了！"
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: "老翁说完便进了森林。他走了许多个钟头，一边吹着口哨，一边不停地呼唤麻雀，可小鸟始终没有出现。老翁难过地回了家，决定天一亮就继续找，不带回这个流落在外的小伙伴，绝不停下。此后一天又一天，他到处寻找呼唤。可每到黄昏，他总是绝望地空手回来。最后，老翁终于不再抱希望，以为自己再也见不到小朋友了。"
        - id: ch02-b04
          speaker: narrator
          text: "一个炎热的夏日早晨，老翁慢慢走在参天大树的清凉绿荫下。他根本没留意自己要去哪里，不知不觉进了一片竹林。前面的竹子渐渐稀疏，一座美丽的花园出现在眼前。园子中央有幢纤巧整洁的小屋。一位美丽的姑娘走出来，打开园门，热情地请他进去歇息。"
        - id: ch02-b05
          speaker: sparrow_maiden
          text: "啊，亲爱的老朋友，你总算找到我了！我就是你救过的那只小麻雀。那时候，多亏你一直细心照料我。"
          emotion: happy
        - id: ch02-b06
          speaker: narrator
          text: "老翁激动地握住她的双手，还来不及问话，姑娘已经拉他进屋，摆好食物，亲自陪他用餐。老翁吃饭时，姑娘和侍女们拿起琴，为他唱歌跳舞。时间过得飞快，他连天黑了都没发现，更没想起自己这么晚回去，会挨妻子怎样一顿骂。"
        - id: ch02-b07
          speaker: narrator
          text: "他们唱着、跳着，又谈起姑娘还是麻雀时，在鸟笼里里外外蹦跳的日子。转眼一夜过去，第一缕阳光穿过竹篱。老翁猛地站起来，感谢女主人的盛情款待，准备告别。"
        - id: ch02-b08
          speaker: sparrow_maiden
          text: "我不能让你空着手回去。请你收下一件礼物，就当是我向你道谢。"
        - id: ch02-b09
          speaker: narrator
          text: "侍女们抬来两只箱子，一只很小，另一只又大又沉。"
        - id: ch02-b10
          speaker: sparrow_maiden
          text: "这两只箱子，你挑一只带走吧。"
        - id: ch02-b11
          speaker: narrator
          text: "老翁选了小箱子，藏在外衣下面，踏上回家的路。"
    - id: ch03
      title: "小箱里的光"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "快到家时，老翁心里微微一沉。他知道妻子一定会为他彻夜未归大发脾气。可真进了门，情形比他料想的还糟。多年相处下来，老翁早已知道该怎么办。他一句也不回，只点起烟斗，等妻子自己骂累。"
        - id: ch03-b02
          speaker: narrator
          text: "老妇还在没完没了地怒骂，老翁却早把她忘到脑后。他从外衣下面拿出箱子，揭开盖子。耀眼的光芒一下扑进眼里。黄金和宝石一直堆到箱盖，在阳光中闪闪跳动。就连老妇那张骂个不停的嘴，也终于安静了。她凑到箱边，把宝石一颗颗拿在手里，贪心地将最大、最值钱的几颗挑到一旁。接着，她忽然换上了客客气气的口吻。"
        - id: ch03-b03
          speaker: old_woman
          text: "你昨晚到底去了哪里？这些漂亮的宝贝，又是怎么得来的？快跟我说说吧。"
        - id: ch03-b04
          speaker: narrator
          text: "老翁把整件事讲给她听。老妇越听越惊奇，直到听说麻雀姑娘曾让他在两只箱子里任选一只，马上又破口大骂。她责怪丈夫愚蠢，为什么偏偏拿了小箱子。接着，她又纠缠不休，硬要老翁把通往麻雀公主家的路讲得清清楚楚。"
        - id: ch03-b05
          speaker: narrator
          text: "老妇把路线记牢，换上最好的衣服，立刻出发。她一心赶路，常常走错方向，在林中转了好几个钟头，才找到那幢小屋。她大摇大摆地闯进房间，仿佛这里本来就属于她。麻雀姑娘突然见到从前的仇敌，吓了一跳，却尽力藏起心里的感受，仍旧请她坐下，还摆出食物和酒。姑娘只盼这个不速之客吃饱喝足，就会离开。可老妇根本没有走的意思。"
        - id: ch03-b06
          speaker: old_woman
          text: "你不会让我连一件小礼物都没有，就这么回去吧？"
        - id: ch03-b07
          speaker: sparrow_maiden
          text: "当然不会。"
        - id: ch03-b08
          speaker: narrator
          text: "姑娘吩咐一声，侍女们便像上次一样抬来两只箱子。老妇一把抓住较大的那只。箱子压得她走路直晃，她却连好好告别都顾不上，转眼便消失在森林里。"
    - id: ch04
      title: "大箱里的毒蛇"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "回家的路很远，那只箱子好像每走一步都要变沉一点。有几次，老妇觉得自己实在走不动了，可贪心又给了她力气。最后，她总算来到自家门前，累得瘫坐在门槛上。可她只歇了一转眼，就又站起来，急急忙忙摸索箱锁。"
        - id: ch04-b02
          speaker: narrator
          text: "这时天已经黑了，屋里一盏灯也没有。老妇只想赶快看到财宝，连找灯都嫌浪费工夫。终于，锁开了，箱盖猛地弹起来。可怕的东西就在她眼前。箱里没有黄金，也没有珠宝，只有一群眼睛闪亮、吐着分叉舌头的毒蛇。"
        - id: ch04-b03
          speaker: narrator
          text: "毒蛇缠上老妇的身体，把毒液刺进她的血脉。老妇死了，没有一个人为她惋惜。"
