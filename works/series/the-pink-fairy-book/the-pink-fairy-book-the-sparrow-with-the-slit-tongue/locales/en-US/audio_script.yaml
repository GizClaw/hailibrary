audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and mellow
        pace: measured
        pitch: medium
    old_man:
      display_name: Old Man
      tts:
        delivery: gentle, honest, and tenderhearted
        timbre: warm and weathered
        pace: unhurried
        pitch: medium-low
    old_woman:
      display_name: Old Woman
      tts:
        delivery: sharp, impatient, and grasping
        timbre: dry and piercing
        pace: brisk
        pitch: medium-high
    sparrow_princess:
      display_name: Sparrow Princess
      tts:
        delivery: gracious, bright, and quietly dignified
        timbre: light and clear
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Sparrow Finds a Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long, long ago, an old couple lived deep in the heart of a high mountain. Though they shared their home peacefully, they were very different. The old man was honest and kind. His wife was greedy, and she would quarrel with anyone who gave her the chance.
        - id: ch01-b02
          speaker: narrator
          text: One day, the old man sat in front of his cottage, as he often liked to do. A little sparrow came flying toward him, crying in terror. Close behind swept a great black raven. It was hungry, and it rushed after the sparrow with beating wings and an outstretched beak.
        - id: ch01-b03
          speaker: narrator
          text: When the birds came near, the old man sprang up and drove the raven away. The raven rose into the sky with harsh, disappointed cries. The rescued sparrow settled into the old man's hand, and he carried it indoors.
        - id: ch01-b04
          speaker: old_man
          text: There, little one. You don't need to be frightened now. You are safe with me.
          emotion: calm
        - id: ch01-b05
          speaker: narrator
          text: He gently stroked its feathers, but he could still feel its heart pounding. So he placed it in a cage. Before long, the sparrow found its courage and began to hop and twitter.
        - id: ch01-b06
          speaker: narrator
          text: The old man loved every living creature. Each morning he opened the cage, and the sparrow flew happily around the cottage. The instant it saw a cat, a rat, or any other dangerous beast, it darted back inside. It knew that nothing could hurt it there.
    - id: ch02
      title: The Cruel Wife
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The old woman was always searching for something to grumble about. Soon she became jealous of the love her husband gave the bird. She longed to hurt it, though she did not dare while he was near.
        - id: ch02-b02
          speaker: narrator
          text: Then, one morning, her chance came. The old man went to a town several miles down the mountain and would be away for hours. Before leaving, he remembered to open the cage. The sparrow hopped about and twittered as usual, never dreaming of danger. All the while, the old woman's face grew darker and darker.
        - id: ch02-b03
          speaker: narrator
          text: At last her anger burst out. The sparrow was perched on a bracket high on the wall, and she hurled her broom at it. The broom missed the bird, but it knocked down the vase beside it and smashed it. That only made her angrier. She chased the sparrow from one place to another until she caught the little creature between her fingers. The sparrow was almost as frightened as it had been on the day it first entered the cottage.
        - id: ch02-b04
          speaker: narrator
          text: By then she was more furious than ever. She did not dare kill her husband's pet, so instead she slit its tongue. The sparrow struggled and cried, but no one was there to hear. Shrieking with pain, it flew out of the cottage and vanished into the deep forest.
        - id: ch02-b05
          speaker: narrator
          text: After a while, the old man returned and immediately asked where his pet was. His wife was still in a foul temper. She told him everything, then scolded him for making such a fuss over one small bird.
        - id: ch02-b06
          speaker: old_man
          text: You are a cruel, hardhearted woman! That poor bird never harmed anyone. How could you treat it so badly?
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: Deeply troubled, he left the cottage and went to look for his sparrow. For hours he walked through the forest, whistling and calling, but the bird never came. He returned sadly, determined to set out again at dawn and never rest until he brought the wanderer home.
        - id: ch02-b08
          speaker: narrator
          text: Day after day he searched and called. Evening after evening he came back in despair. At last, he lost all hope. He believed he would never see his little friend again.
    - id: ch03
      title: The House Beyond the Bamboo
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: One hot summer morning, the old man wandered slowly beneath the cool shade of the great trees. He paid no attention to where he was going and found himself inside a bamboo thicket. The bamboo gradually thinned, and before him lay a beautiful garden. At its center stood a tiny house, neat and shining.
        - id: ch03-b02
          speaker: narrator
          text: A lovely maiden came from the house, opened the gate, and warmly invited him to come in and rest.
        - id: ch03-b03
          speaker: sparrow_princess
          text: Oh, my dear old friend, you have found me at last! I am so glad. I am the little sparrow whose life you saved and cared for so kindly.
          emotion: happy
        - id: ch03-b04
          speaker: narrator
          text: The old man eagerly took her hands, but before he could ask a single question, she led him inside. She placed food before him and served him herself.
        - id: ch03-b05
          speaker: narrator
          text: As he ate, the maiden and her maids played their lutes, sang, and danced for him. The hours slipped away so quickly that he never noticed the darkness. He did not even remember how his wife would scold him for coming home so late.
        - id: ch03-b06
          speaker: narrator
          text: They danced and sang, and they talked about the days when the maiden had been a sparrow, hopping in and out of her cage. In this way the whole night passed. When the first sunlight shone through the bamboo hedge, the old man rose, thanked his hostess for her generous welcome, and prepared to leave.
        - id: ch03-b07
          speaker: sparrow_princess
          text: I cannot let you leave with nothing. I have a gift for you, and you must accept it as a sign of my gratitude.
        - id: ch03-b08
          speaker: narrator
          text: At her words, servants carried in two chests. One was very small. The other was large and heavy.
        - id: ch03-b09
          speaker: sparrow_princess
          text: Please choose whichever chest you would like to carry home.
        - id: ch03-b10
          speaker: narrator
          text: The old man chose the small chest, tucked it beneath his cloak, and started for home.
    - id: ch04
      title: The Small Chest
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: As he neared his cottage, his heart sank. He knew his wife would be furious and would abuse him for staying away. She was even worse than he expected. Long experience had taught him to say nothing while she stormed, so he lit his pipe and waited for her anger to wear itself out.
        - id: ch04-b02
          speaker: narrator
          text: She was still raging when the old man, who had stopped paying attention to her, remembered the chest. He drew it from under his cloak and opened it. A brilliant blaze met his eyes. Gold and precious stones filled the chest to the lid and danced in the sunlight.
        - id: ch04-b03
          speaker: narrator
          text: Even his wife's scolding tongue fell silent. She came closer and lifted the jewels in her hands, greedily putting aside the largest and most valuable ones. Then her voice suddenly grew gentle.
        - id: ch04-b04
          speaker: old_woman
          text: Please tell me where you spent the night, dear husband. And how did you come by all these wonderful riches?
        - id: ch04-b05
          speaker: narrator
          text: The old man told her the whole story. She listened in amazement until he explained how the sparrow-princess had let him choose between two chests. Then her scolding began all over again. She called him a fool for taking the smaller one and refused to stop until he described the exact path to the princess's house.
        - id: ch04-b06
          speaker: narrator
          text: Once she had fixed the way in her mind, the old woman put on her best clothes and set out at once. In her blind hurry, she often strayed from the path. She wandered for several hours before she finally reached the little house.
        - id: ch04-b07
          speaker: narrator
          text: She marched up to the door and entered as boldly as if the place belonged to her. The poor maiden was startled and frightened to see her old enemy. Still, she hid her feelings as well as she could and welcomed the intruder. She offered her food and wine, hoping the woman would eat, drink, and leave. But the old woman had no such intention.
        - id: ch04-b08
          speaker: old_woman
          text: Surely you aren't going to send me away without a little present?
        - id: ch04-b09
          speaker: sparrow_princess
          text: No, of course I won't.
        - id: ch04-b10
          speaker: narrator
          text: At the maiden's order, the same two chests were carried in. The old woman seized the larger one at once. She staggered beneath its weight as she disappeared into the forest, hardly pausing to say goodbye.
    - id: ch05
      title: The Large Chest
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Her own cottage was far away, and the chest seemed heavier with every step. Again and again, she felt she could go no farther at all. Each time, her greed drove her onward and gave her strength. At last she reached her own door.
        - id: ch05-b02
          speaker: narrator
          text: She collapsed on the threshold, worn out by the journey. A moment later, she was back on her feet, fumbling with the lock. Night had fallen, and the cottage was dark, but she was far too eager to find her treasure to stop and look for a light.
        - id: ch05-b03
          speaker: narrator
          text: At last the lock gave way and the lid flew open. But there was no gold and there were no jewels. Before her were serpents with shining eyes and forked tongues.
        - id: ch05-b04
          speaker: narrator
          text: The serpents twisted around her and drove their poison into her veins. The old woman died, and no one mourned her.
