cover_prompt: |-
  A wordless cover gathers delicate motifs from The Pink Fairy Book in a blossoming garden linked to distant seas and hills. A small sparrow with a healed tongue carries a seed, a resourceful young traveler approaches a stone gate, a fox watches beside a flowering tree, and a tiny boat crosses a rose-colored inlet. At the center, a child plants the sparrow's seed and a flowering vine springs upward in a gentle spiral. The shared act of planting is the focal action, with other tales appearing as distinct discoveries among layered paths and branches. Use a gently elevated composition with a clear foreground circle, distant landscapes, and generous pale-pink dawn sky at the top. Keep every figure original, culturally respectful, premodern in dress, and free from modern film or commercial adaptation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
