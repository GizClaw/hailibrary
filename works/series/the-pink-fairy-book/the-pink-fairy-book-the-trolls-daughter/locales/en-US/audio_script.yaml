audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and mellow
        pace: measured
        pitch: medium
    youth:
      display_name: Young Man
      tts:
        delivery: openhearted, capable, and quietly daring
        timbre: clear and youthful
        pace: steady
        pitch: medium
    troll:
      display_name: Troll
      tts:
        delivery: commanding, crafty, and quick to anger
        timbre: deep and rough
        pace: deliberate
        pitch: low
