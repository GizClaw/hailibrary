  chapters:
    - id: ch01
      title: Three Years in the Troll's Service
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A young lad once set out to find a place where he could work. Along the road, he met a stranger who asked where he was going. The lad explained his errand, and the man made him an offer.
        - id: ch01-b02
          speaker: troll
          text: Then come and serve me. I need a lad like you, and I pay well. You will earn one bushel of money after the first year, two after the second, and three after the third. You must stay for all three years and obey me, however strange my orders may seem. If you know how to obey, you have nothing to fear.
        - id: ch01-b03
          speaker: narrator
          text: The lad accepted the bargain and followed his new master home. It was a very strange place indeed. The man lived inside a bank in the middle of a wild forest, and the lad saw no other person anywhere around it. His master was really a great troll with marvelous power over people and beasts alike.
        - id: ch01-b04
          speaker: narrator
          text: The lad began his service the next morning. His first job was to feed all the wild creatures the troll had gathered from the forest. Beneath the ground stretched a stable a full mile long. Wolves and bears were tied in its stalls, while deer and hares waited in its pens. Somehow the lad fed every one before the day was over. The troll praised him and declared the work very well done.
        - id: ch01-b05
          speaker: troll
          text: Do not feed the animals today. They cannot expect food every day. You may go out and play until it is time to feed them again.
        - id: ch01-b06
          speaker: narrator
          text: Then the troll spoke words the lad could not understand. In an instant, the lad became a hare and raced into the wood. He had good reason to race. Every hunter aimed a gun at him, and the dogs barked and chased him whenever they caught his scent. The troll had shut away every other animal, so this one hare was the only game left in the entire forest. Every hunter in the country wanted to bring him down.
        - id: ch01-b07
          speaker: narrator
          text: No dog was fast enough to catch him, and no marksman could hit him. They fired and fired while he ran and ran. It was a restless life, with hardly a peaceful moment. Yet as the months passed, he saw that none of their shots could harm him. After that, he even took pleasure in fooling the hunters and leading their eager dogs a hopeless chase.
        - id: ch01-b08
          speaker: narrator
          text: A whole year went by. At last, the troll called the hare home. The lad was under his power, just like the other animals, so he had to return. The troll spoke another strange spell, and the hare became a person again.
        - id: ch01-b09
          speaker: troll
          text: Well, how do you like working for me? And how did you like being a hare?
        - id: ch01-b10
          speaker: youth
          text: I liked it very much. I had never moved so quickly in my life.
        - id: ch01-b11
          speaker: narrator
          text: The troll showed him the bushel of money he had earned. The lad was pleased and gladly stayed for a second year.
        - id: ch01-b12
          speaker: narrator
          text: On the first day, he once more fed every wild beast in the underground stable. Then the troll spoke his magic words, and the lad became a raven. He soared high into the sky. This seemed even better than being a hare. He could travel faster, and no dog could follow him up there.
        - id: ch01-b13
          speaker: narrator
          text: But the raven was not left in peace. With every other bird locked away by the troll, the hunters had nothing else to shoot. Whenever they spotted him overhead, they raised their guns and fired. He had to keep flying while shot after shot followed him. Soon he grew used to that as well, for not one of them could hit him. He spent the whole year roaming through the open air.
        - id: ch01-b14
          speaker: narrator
          text: He flew that way until the second year ended. The troll called him back, spoke the spell, and restored his human shape.
        - id: ch01-b15
          speaker: troll
          text: And how did you like being a raven?
        - id: ch01-b16
          speaker: youth
          text: Very well. Never before have I been able to fly so high.
        - id: ch01-b17
          speaker: narrator
          text: The troll showed him the two bushels he had earned that year. The lad was satisfied and agreed to serve for the third and final year.
    - id: ch02
      title: The Palace Beneath the Sea
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next day began with the same old task. The lad went down into the mile-long stable and fed all the wild beasts. When the last animal had eaten, the troll said the magic words again. This time the lad turned into a fish and leaped straight into the river.
        - id: ch02-b02
          speaker: narrator
          text: He swam upstream and down and found it pleasant to let the current carry him. The river bore him all the way into the sea. Still he swam on, farther and farther from shore, until he reached the very bottom. There, standing on the seabed, was a palace made of glass.
        - id: ch02-b03
          speaker: narrator
          text: Through the glass walls he could see every splendid hall and room. The furniture was made of white ivory, inlaid with gold and pearls. Soft rugs and cushions shone in all the colors of the rainbow, and beautiful carpets looked like the finest moss. Flowers and trees spread strangely crooked branches in green, yellow, white, and red. Little fountains sprang from lovely snail shells and fell into bright mussel shells. As the water flowed, it made sweet music that filled the whole palace.
        - id: ch02-b04
          speaker: narrator
          text: Yet the loveliest sight was a young woman who lived there all alone. None of that grandeur seemed to make her happy. She wandered sadly from one room to another, with no one to speak to. The polished glass walls reflected her on every side, but she never even thought of looking at herself, though she was as pretty as anyone could wish. The lad thought so too as he swam around the palace and peered in from every side.
        - id: ch02-b05
          speaker: youth
          text: I would rather be a man in there than a poor silent fish out here. If only I could remember the words the troll uses to change me, perhaps I could change myself back.
        - id: ch02-b06
          speaker: narrator
          text: He swam on, turning the sound of the spell over in his mind. At last, he remembered it and tried to speak it. The next moment, he stood as a man at the bottom of the sea.
        - id: ch02-b07
          speaker: narrator
          text: He hurried into the glass palace and went up to the young woman. His sudden appearance nearly frightened the life out of her. But he spoke kindly and told her about the troll, the spell, and his journey through the sea. Her fear soon passed. She was delighted to have someone beside her after the terrible solitude in which she had lived.
        - id: ch02-b08
          speaker: narrator
          text: With company at last, the hours passed quickly for both of them. The lad was a young man now, and he forgot entirely how long he had stayed beneath the sea. As they talked, she told him she was the daughter of the very troll he served. Her father had shut her inside the glass palace because he wanted to keep her away from everyone in the world.
        - id: ch02-b09
          speaker: narrator
          text: One day, she warned him that his year was nearly over. The troll would soon call him home. Before that happened, he must become a fish again, or the sea would kill him before he reached the surface. She had also formed a plan. If he followed every part of it carefully, perhaps they could meet again and spend their lives together.
    - id: ch03
      title: The Troll's Daughter Makes a Plan
      blocks:
        - id: ch03-b01
          speaker: trolls_daughter
          text: Every king in the lands around here owes my father money. The king of one particular country must be the first to pay, and I will tell you exactly which kingdom to find. If he cannot bring the debt on the appointed day, he will lose his head. And I know for certain that he cannot pay.
        - id: ch03-b02
          speaker: trolls_daughter
          text: First, leave my father's service. Your three years will be over, so you will be free. Take the six bushels you have earned and go to that king's country. Enter his service. As the day for paying the debt comes closer, you will see that something troubles him.
        - id: ch03-b03
          speaker: trolls_daughter
          text: Tell him you know he cannot repay the troll, but you can lend him the whole six bushels. Ask for two things in return. You must travel with him when he pays, and he must let you dress as his fool and run ahead of him.
        - id: ch03-b04
          speaker: trolls_daughter
          text: When you reach my father's home, behave as foolishly as you can. Smash plenty of windows and cause every kind of damage. My father will fly into a rage. The king is responsible for his fool, so even after the debt is paid, my father will order him to answer three questions or lose his life.
        - id: ch03-b05
          speaker: trolls_daughter
          text: His first question will be, “Where is my daughter?” Do not leave the king to answer. Step forward and say, “She is at the bottom of the sea.” Then my father will ask whether you can recognize me. Say yes. He will parade a great many women past you and order you to choose his daughter from among them. You will not be able to recognize me by sight, so I will catch hold of you as I pass. The moment you feel it, grab me and hold me fast. That will answer his first question.
        - id: ch03-b06
          speaker: trolls_daughter
          text: Next he will ask, “Where is my heart?” Step forward once more and tell him, “It is in a fish.” When he asks whether you know the fish, say yes again. He will call every kind of fish before you and make you choose. I will stay close by your side. When the right fish comes past, I will give you a small push. Seize it at once and cut it open. Then my father will be finished. He will ask no more questions, and we will be free to marry.
        - id: ch03-b07
          speaker: narrator
          text: The young man knew what to do once he reached land. But first he had to remember the spell that changed him from a man into an animal, and he had forgotten it. The troll's daughter did not know it either.
        - id: ch03-b08
          speaker: narrator
          text: All day, he paced in despair and searched his memory. He thought and thought, but the sound of the words would not return. That night, he lay awake for hours. Near morning he finally fell into a light sleep, and all at once the spell flashed into his mind. He sprang up and repeated it. His body became a fish again, and he slipped out of the palace into the sea.
        - id: ch03-b09
          speaker: narrator
          text: Almost immediately, the troll's summons reached him. The fish swam all the way through the sea and then up the river he had followed at the start of the year. His master stood waiting on the bank. When the fish reached him, the troll spoke the same strange words as before and gave the young man his human shape again.
        - id: ch03-b10
          speaker: troll
          text: Well, how did you like being a fish?
        - id: ch03-b11
          speaker: youth
          text: Better than anything else.
        - id: ch03-b12
          speaker: narrator
          text: That answer was perfectly true, as anyone could guess. The troll showed him the three bushels he had earned in the final year. They stood beside the one bushel from his first year and the two from his second. All six now belonged to the young man, exactly as their bargain required.
        - id: ch03-b13
          speaker: troll
          text: Why not serve me for one more year? I will give you another six bushels. You would have twelve altogether, and that is a fine sum.
        - id: ch03-b14
          speaker: youth
          text: No, I have served long enough. I want to find another place and learn how other people live. Perhaps I will return to you someday.
        - id: ch03-b15
          speaker: troll
          text: You will always be welcome. You served me faithfully for the three years we agreed upon, so I cannot object to your leaving now.
        - id: ch03-b16
          speaker: narrator
          text: The young man took his six bushels of money and went straight to the kingdom his sweetheart had named.
    - id: ch04
      title: The Sorrowful King
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When he reached the kingdom, he chose a lonely spot close to the royal palace and buried all six bushels of money there for safekeeping. Then he entered the palace and asked to be taken into service. His request was granted. The king hired him as a stableman and gave him the care of the royal horses.
        - id: ch04-b02
          speaker: narrator
          text: Some time passed. The stableman noticed that the king was always grieving. Day after day, he walked about in sorrow, and nothing seemed to make him glad or happy. One day the king entered the stable when no one else was there, and the young man asked permission to speak plainly.
        - id: ch04-b03
          speaker: youth
          text: Your Majesty, may I ask why you are so sorrowful?
        - id: ch04-b04
          speaker: king
          text: There is no use discussing it. Whatever my trouble is, you cannot help me.
          emotion: sad
        - id: ch04-b05
          speaker: youth
          text: You cannot be sure of that. I know exactly what weighs on you, and I know how your debt can be paid.
        - id: ch04-b06
          speaker: narrator
          text: That answer changed everything. The king stayed and heard him out. The stableman said he could easily lend the full six bushels, enough to pay the troll. But the loan came with conditions. The young man must go along when the king paid the debt. He must be dressed as the royal court fool and allowed to run in front of the king. He warned that he would cause trouble and the king would be severely scolded for it, but promised that no harm would come to him.
        - id: ch04-b07
          speaker: narrator
          text: The king gladly accepted every condition. There was no time to waste, so they prepared to leave at once.
    - id: ch05
      title: The Fool at the Glass Castle
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When they reached the troll's dwelling, it looked nothing like the place the young man remembered. The bank was still there, but now a huge castle stood on top of it. He had never seen that castle during his three years of service. The troll could make it visible or invisible whenever he pleased, and the young man knew enough about his master's magic not to be surprised.
        - id: ch05-b02
          speaker: narrator
          text: The castle looked as though it were made of pure glass. As they drew near, the young man ran ahead in his fool's clothes. Sometimes he faced forward, sometimes backward. One moment he stood on his feet, and the next he stood on his head. He smashed the troll's enormous glass windows and doors, overturned everything he could reach, and made a dreadful uproar.
        - id: ch05-b03
          speaker: narrator
          text: The troll rushed outside in a fury and poured abuse on the king. How dared he bring such a miserable fool to the castle? The king could not even settle his old debt, the troll shouted, so there was no chance he could pay for all the windows, doors, and other things his fool had destroyed.
        - id: ch05-b04
          speaker: youth
          text: He can pay it easily enough.
        - id: ch05-b05
          speaker: narrator
          text: The king came forward with the six bushels the young man had lent him. The troll measured the money, and every bit of the debt was there. He had never expected the king to bring it. Yet the payment was honest and complete, so the troll could raise no objection. He gave the king his old bond back.
        - id: ch05-b06
          speaker: narrator
          text: Yet the damage from that day still had to be settled, and the king had no money left for it. Under the terms of the old bond, the troll gave him a choice. He must answer three questions, or have his head cut off.
        - id: ch05-b07
          speaker: narrator
          text: There was nothing to do but face the riddles. The fool took his place close beside the king, and the troll stepped forward to begin.
    - id: ch06
      title: The Troll's Two Riddles
      blocks:
        - id: ch06-b01
          speaker: troll
          text: Where is my daughter?
        - id: ch06-b02
          speaker: youth
          text: She is at the bottom of the sea.
        - id: ch06-b03
          speaker: troll
          text: How could you know that?
        - id: ch06-b04
          speaker: youth
          text: A little fish saw her.
        - id: ch06-b05
          speaker: troll
          text: Would you recognize her?
        - id: ch06-b06
          speaker: youth
          text: Yes. Bring her before me.
        - id: ch06-b07
          speaker: narrator
          text: The troll summoned a whole crowd of women and sent them past the king and his fool one after another. The fool watched carefully, but nearly every woman was only a shadow or a magical deception. The troll's true daughter came among the very last. As she passed, she pinched the fool so he would know she was there. He caught her around the waist at once and held her fast. The troll had no choice but to admit that his first riddle was solved.
        - id: ch06-b08
          speaker: troll
          text: Then tell me this. Where is my heart?
        - id: ch06-b09
          speaker: youth
          text: Your heart is inside a fish.
        - id: ch06-b10
          speaker: troll
          text: Would you know which fish it is?
        - id: ch06-b11
          speaker: youth
          text: Yes. Bring it before me.
        - id: ch06-b12
          speaker: narrator
          text: The troll called up every kind of fish and made them swim past. His daughter remained close beside the young man as they watched the long procession. At last, the one fish that held the troll's heart came swimming along. She gave the young man a nudge. He seized it at once, drove in his knife, and split the fish open. Then he pulled out the troll's heart and cut it through the middle.
        - id: ch06-b13
          speaker: narrator
          text: At that very moment, the troll fell dead and broke into pieces of flint. Every bond made by his magic snapped. All the wild beasts and birds he had captured and hidden beneath the ground were free at last. The beasts scattered through the woods, and the birds flew away into the open sky.
        - id: ch06-b14
          speaker: narrator
          text: The young man and his sweetheart entered the troll's castle, which now belonged to them, and held their wedding there. All the kings from the lands around them had been in the troll's debt, but now every one of them was free. They came to the wedding feast together and saluted the young man as their emperor.
        - id: ch06-b15
          speaker: narrator
          text: He ruled over them, kept peace among their kingdoms, and lived in the castle with his beautiful empress in joy and splendor.
        - id: ch06-b16
          speaker: narrator
          text: And if they have not died since, they are living there to this day.
