audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    youth:
      display_name: "年轻人"
      tts:
        delivery: "朴实机敏，历经奇遇后更加沉着"
        timbre: "清朗的年轻男声"
        pace: "适中"
        pitch: "中音"
    troll:
      display_name: "山怪"
      tts:
        delivery: "威严诡秘，发怒时粗暴凶狠"
        timbre: "低沉粗粝的男声"
        pace: "偏慢而有压迫感"
        pitch: "低音"
    daughter:
      display_name: "山怪的女儿"
      tts:
        delivery: "温柔聪慧，谋划时清楚坚定"
        timbre: "清澈柔和的年轻女声"
        pace: "适中而清楚"
        pitch: "中高音"
    king:
      display_name: "国王"
      tts:
        delivery: "忧郁谨慎，重获希望后坦率果断"
        timbre: "成熟浑厚的男声"
        pace: "沉稳"
        pitch: "中低音"
  chapters:
    - id: ch01
      title: "山怪的三年差事"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有个小伙子出门找差事。路上，一个陌生男人问清他的去处，便说自己正缺这样一个帮手。他答应第一年给一斗钱，第二年给两斗，第三年给三斗。小伙子要做满三年，无论命令多奇怪都得服从。只要听话，就不会有危险。"
        - id: ch01-b02
          speaker: narrator
          text: "小伙子答应下来，跟着新主人回家。那人住在荒林中央的一道土坡里，那里再没有别人。原来他是个大神通的山怪，人和野兽都逃不过他的摆布。"
        - id: ch01-b03
          speaker: narrator
          text: "第二天，小伙子开始干活。山怪交给他的第一件差事，就是喂养林中所有的野兽。山怪把它们全捉了来，既有狼和熊，也有鹿和野兔，全关在地底马厩的一间间栏舍里。那座马厩足足有一英里长。小伙子却在当天就把每只动物都喂饱了，山怪夸奖他，说这件差事做得很好。"
        - id: ch01-b04
          speaker: troll
          text: "明天不用再喂。它们可不是天天都有这样的好命。下回喂食以前，你出去玩吧。"
        - id: ch01-b05
          speaker: narrator
          text: "山怪念了几句听不懂的话，小伙子立刻变成一只野兔，跑进森林。这下可有他跑的了。林中其他动物全被关了起来，整个国家的猎人只剩这一只野兔可追，个个都急着把他撂倒。枪声接连响起，猎犬只要闻着气味，便一路狂吠着追赶。可是没有一条狗追得上他，也没有一个猎人打得中他。猎人一枪接一枪地打，他就一程接一程地跑。"
        - id: ch01-b06
          speaker: narrator
          text: "日子虽然不得安宁，小伙子却渐渐明白自己不会受伤，也就适应了这种生活。后来，看着那些穷追不舍的猎人和猎犬一次次白费力气，他反而觉得戏弄他们很有趣。整整一年就这样过去了。年期一满，山怪便把他召回。此时他像其他动物一样，完全受山怪支配。山怪又念了几句他听不懂的话，野兔立刻恢复了人的形貌。"
        - id: ch01-b07
          speaker: troll
          text: "为我做事怎么样？做野兔又怎么样？"
        - id: ch01-b08
          speaker: youth
          text: "很好。我从来没有跑得这么快过。"
        - id: ch01-b09
          speaker: narrator
          text: "山怪给他看已经挣到的一斗钱。小伙子很满意，愿意再做一年。第二年第一天，他照旧喂饱所有野兽。山怪又念动咒语，把他变成一只渡鸦。"
        - id: ch01-b10
          speaker: narrator
          text: "小伙子高高飞上天空，觉得比做野兔更加痛快。如今速度更快，猎犬也不可能追到天上来。可他很快发现，自己仍不能完全安宁。枪手和猎人只要看见他，就会举枪射击，因为别的鸟也全被山怪捉走了，他们再没有别的目标。小伙子看出子弹始终打不中自己，渐渐也就习惯了。他这样飞了整整一年，直到山怪再次召他回去，念动咒语，让他恢复人形。"
        - id: ch01-b11
          speaker: troll
          text: "做渡鸦的滋味怎么样？"
        - id: ch01-b12
          speaker: youth
          text: "非常好。我这一生从没飞得这样高。"
        - id: ch01-b13
          speaker: narrator
          text: "山怪给他看第二年挣到的两斗钱，他便留下来做第三年。第二天，他再次喂完野兽，山怪又念了咒语。这一回，小伙子变成一条鱼，跃入河中。"
        - id: ch01-b14
          speaker: narrator
          text: "他时而逆流，时而顺水，觉得任由水流带着自己漂荡十分惬意。游出河口以后，他进入大海，越游越远，最后来到海底的一座玻璃宫。隔着透明的墙壁，每一间房和每一座大厅都看得清清楚楚。宫里的洁白象牙家具镶着黄金和珍珠，柔软的地毯和靠垫闪着彩虹的颜色，还有些地毯像最细嫩的苔藓。奇异的枝条弯弯曲曲，有红有白，有绿有黄。清泉从美丽的螺壳中喷出，落进明亮的贝壳，发出的悦耳音乐响遍整座宫殿。"
    - id: ch02
      title: "海底玻璃宫"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "宫里最美的，是一个独自生活的年轻姑娘。她从一间房走到另一间房，身边虽然尽是荣华，却一点儿也不快乐。她始终忧郁孤单。四周的玻璃墙光洁如镜，她连自己的影子也不看。可她美得无与伦比，无论谁见到，都不可能再盼望看见更美的人。小伙子绕着宫殿游来游去，从每一面往里张望时，也这样认为。"
        - id: ch02-b02
          speaker: youth
          text: "在这里，做人可比做一条哑巴鱼好多了。要是我能想起山怪的咒语，也许就能自己变回去。"
        - id: ch02-b03
          speaker: narrator
          text: "他一边游一边苦想，终于记起咒语的声音。他试着念了一遍，转眼便以人的模样站在海底。随后，他赶紧走进玻璃宫，来到姑娘面前。"
        - id: ch02-b04
          speaker: narrator
          text: "姑娘起初吓得魂都快没了。可年轻人语气和善，又仔细说明自己怎样变成鱼、怎样来到海底，她很快安下心来。她独自在玻璃宫里生活了太久，如今终于有人陪伴，心中十分欢喜。两个人在一起时，都觉得时间过得飞快。年轻人已经不再是当初那个小伙子，而是真正长大成人了。他甚至彻底忘了自己在宫里待了多久。"
        - id: ch02-b05
          speaker: narrator
          text: "姑娘早已告诉他，自己就是山怪的女儿。父亲把她关在海底，是要让她远离世上的每一个人。一天，她说变回鱼的日子已经临近，山怪很快就会召他回去。到时他非走不可，可启程前必须先变成鱼，否则不可能活着穿过大海。她还想出了一个办法，也许能让两个人再次相见，从此相守一生。不过，其中有许多事情要做，他必须把她说的每一句话都牢牢记住。"
        - id: ch02-b06
          speaker: daughter
          text: "附近各国的国王都欠我父亲的债。我告诉你的那个国王最先到期，可他肯定还不起。三年已经满了，你先辞掉差事，带着六斗钱去他的王国，为他做事。"
        - id: ch02-b07
          speaker: daughter
          text: "还债的日子临近时，你会看出国王心神不宁。告诉他，你知道他为什么发愁，是因为欠了山怪的钱又无力偿还。你愿意把六斗钱全借给他，数目恰好与债款相同。不过，你要提出一个条件。他去还债时必须带上你，还要让你扮成弄臣，跑在他的队伍前面。"
        - id: ch02-b08
          speaker: daughter
          text: "到了我父亲那里，你尽管胡闹，打碎他的窗户，能毁坏多少就毁坏多少。他一定会大发雷霆。弄臣惹的祸要由国王承担，所以就算旧债还清，他仍会逼国王回答三个问题，答不出就得送命。"
        - id: ch02-b09
          speaker: daughter
          text: "他会先问：‘我的女儿在哪里？’你回答：‘她在海底。’他再问你能不能认出我，你就说能。他会让许多女人从你面前走过。你认不出我，所以我经过时会抓你一下。你立刻抱住我，千万别放手。"
        - id: ch02-b10
          speaker: daughter
          text: "接着他会问：‘我的心在哪里？’你回答：‘在一条鱼里。’他若问你认不认得那条鱼，你还说认得。各种鱼会从你面前游过，我会守在你身边。正确的鱼来了，我就推你一下。你抓住它，把它剖开。山怪一死，就再也问不出第三个问题，我们也能自由成婚了。"
        - id: ch02-b11
          speaker: narrator
          text: "年轻人把上岸后要做的一切记在心里，接下来还要想起山怪把人变成动物时念的咒语。可他偏偏忘了，姑娘也不知道。他绝望地在宫中走来走去，整整一天都在苦想，却怎么也记不起那几个音节。夜里，他翻来覆去，仍然睡不着。直到快天亮时，他才打了个盹。就在那一刻，山怪常念的话忽然闪进脑海。"
        - id: ch02-b12
          speaker: narrator
          text: "他赶紧把那几句话念出口，同一刻便变回一条鱼，溜出宫殿，进入大海。紧接着，山怪果然开始召唤他。他游过海洋，又逆着河水一路而上，最后来到山怪等候的岸边。山怪用从前念过的咒语，再一次让他恢复了人的形貌。"
        - id: ch02-b13
          speaker: troll
          text: "做鱼的滋味怎么样？"
        - id: ch02-b14
          speaker: youth
          text: "这是我最喜欢的一种变化。"
        - id: ch02-b15
          speaker: narrator
          text: "谁都猜得出，这句话绝不虚假。山怪把第三年挣到的三斗钱摆在原来的三斗旁边。六斗钱全归年轻人了。"
        - id: ch02-b16
          speaker: troll
          text: "再替我做一年吧。下一年我给你六斗，加起来就是十二斗，那可是一大笔钱。"
        - id: ch02-b17
          speaker: youth
          text: "不了，我已经做得够久。现在想到别处做事，看看别人怎样生活。以后也许还会回来。"
        - id: ch02-b18
          speaker: narrator
          text: "山怪说，年轻人无论什么时候回来，自己都欢迎。他已经按照最初的约定，忠忠实实地做满三年，现在想离开，自己没有理由反对。于是，年轻人收下六斗钱，离开荒林和土坡，直奔心上人告诉他的那个王国。"
    - id: ch03
      title: "国王的弄臣"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "年轻人带着六斗钱，径直来到心上人告诉他的王国。他把钱埋在王宫附近一个无人经过的僻静地方，然后进宫求一份差事。他如愿成了马夫，负责照料国王的马。过了一阵，他发现国王走到哪里都是满面忧愁，从来没有高兴的时候。一天，国王来到马厩，那里正好没有别人。年轻人便直截了当地请求陛下准许他问一问，究竟为什么这样忧伤。"
        - id: ch03-b02
          speaker: king
          text: "说出来也没有用。你帮不了我。"
        - id: ch03-b03
          speaker: youth
          text: "那可未必。我知道什么事压在您心上，也知道怎样把那笔钱还清。"
        - id: ch03-b04
          speaker: narrator
          text: "国王一听，事情可就完全不同了。他立刻同马夫细谈起来。年轻人说，借出六斗钱并不困难，条件是还债时让他同行，并且准他扮成宫廷弄臣，跑在国王前面。他会故意惹些麻烦，害国王挨一顿严厉责骂，不过他可以保证，最后不会有任何伤害落到国王身上。国王高高兴兴地答应了全部条件。期限已经迫近，两个人马上启程。"
        - id: ch03-b05
          speaker: narrator
          text: "他们来到山怪的住处，发现山怪已经不住在土坡里面。土坡上方立着一座年轻人从未见过的大城堡。原来，山怪想让城堡显现，它就会显现，想让它消失，它就会消失。年轻人已经见识过他的许多法术，所以眼前的景象一点儿也没有让他惊讶。"
        - id: ch03-b06
          speaker: narrator
          text: "靠近那座仿佛由纯玻璃造出的城堡时，年轻人扮成弄臣跑在前面。他一会儿正着跑，一会儿倒着跑，一会儿用双脚走，一会儿又倒立起来。他砸碎许多巨大的玻璃门窗，推倒所有够得着的东西，闹得天翻地覆。"
        - id: ch03-b07
          speaker: narrator
          text: "山怪怒气冲冲地奔出来，气得暴跳如雷。他使出全副力气狠狠辱骂国王，责问他为什么带来这样一个该死的傻子。国王连从前欠下的旧债都还不起，如今又毁坏了这么多东西，肯定连其中最小的一点损失也赔不起。"
        - id: ch03-b08
          speaker: youth
          text: "这些损失，要赔可太容易了。"
        - id: ch03-b09
          speaker: narrator
          text: "国王走上前，拿出年轻人借给他的六斗钱。那些钱经过一斗一斗量取，分毫不差。山怪完全没料到这一手，却找不到任何理由反对。旧债就这样老老实实地还清了，国王也取回自己的借据。可是当天毁坏的门窗和其他东西仍要赔偿，国王手中已经再拿不出别的财物。"
        - id: ch03-b10
          speaker: narrator
          text: "山怪便依照旧借据上的约定，命令国王回答三个问题，不然就砍掉他的脑袋。国王别无选择，只能试着猜谜。弄臣紧挨着他站好，山怪开始发问。"
        - id: ch03-b11
          speaker: troll
          text: "我的女儿在哪里？"
        - id: ch03-b12
          speaker: youth
          text: "她在海底。"
        - id: ch03-b13
          speaker: troll
          text: "你怎么知道？"
        - id: ch03-b14
          speaker: youth
          text: "小鱼看见了。"
        - id: ch03-b15
          speaker: troll
          text: "你认得她吗？"
        - id: ch03-b16
          speaker: youth
          text: "认得。带她出来吧。"
        - id: ch03-b17
          speaker: narrator
          text: "山怪让一大群女人一个接一个从他们面前走过，要年轻人从中挑选。可走在前面的全是幻影和假象。最后几个人当中，才有他真正的女儿。她经过弄臣身边时，偷偷拧了他一把，让他知道自己已经来到。年轻人立刻伸手搂住她的腰，紧紧抓住，再也不放。山怪无可奈何，只好承认第一道谜题已经解开。"
    - id: ch04
      title: "藏在鱼里的心"
      blocks:
        - id: ch04-b01
          speaker: troll
          text: "我的心在哪里？"
        - id: ch04-b02
          speaker: youth
          text: "在一条鱼里。"
        - id: ch04-b03
          speaker: troll
          text: "你认得那条鱼吗？"
        - id: ch04-b04
          speaker: youth
          text: "认得。把它带出来吧。"
        - id: ch04-b05
          speaker: narrator
          text: "山怪施展法术，让各种各样的鱼全都来到面前。它们一条接一条地游过，山怪的女儿寸步不离地站在年轻人身旁。正确的那条鱼终于出现，她马上轻轻撞了年轻人一下。年轻人立刻伸手抓住鱼，拔出刀刺下去。他剖开鱼腹，掏出藏在里面的心，又把那颗心从正中间切成两半。"
        - id: ch04-b06
          speaker: narrator
          text: "就在那一刻，山怪轰然倒地死去，身体化成一块块燧石。他施下的一切束缚也同时断开了。那些被他捉来、关进地底马厩的野兽和飞鸟，如今全都恢复自由。野兽四散奔向树林，飞鸟也纷纷展开翅膀，重新飞入天空。"
        - id: ch04-b07
          speaker: narrator
          text: "年轻人和心上人一同走进城堡。从此，这座华丽的城堡完全属于他们，两个人也在那里举行了盛大的婚礼。周围所有曾经欠下山怪债务、如今终于摆脱债务的国王，全都从各自的国家赶来参加婚宴。他们在宴会上向年轻人致敬，奉他为统领众王的皇帝。"
        - id: ch04-b08
          speaker: narrator
          text: "从此，年轻人统领周围所有的国王。每逢他们彼此发生争执，他便亲自出面耐心调解，让各个国家一直和平相处。他和美丽的皇后住在自己的城堡里，生活得荣耀、富足又快乐。这个古老故事最后还说，要是他们后来没有死，那么直到今天，两个人仍旧住在那里。"
