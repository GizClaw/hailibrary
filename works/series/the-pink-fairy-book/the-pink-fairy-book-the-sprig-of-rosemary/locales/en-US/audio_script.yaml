  chapters:
    - id: ch01
      title: The Rosemary Root
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a man lived with his only daughter and made her work hard from morning till night. One morning, when she had finished every task he had given her, he sent her into the woods for dry leaves and sticks to light the fire.
        - id: ch01-b02
          speaker: narrator
          text: The girl soon gathered a great bundle. Then she saw a sweet-smelling sprig of rosemary and tried to pick it for herself. She pulled, but the plant held fast. The harder she tugged, the firmer it seemed. At last she gave one mighty pull, and the rosemary came away in her hands.
        - id: ch01-b03
          speaker: prince
          text: Well? Why have you come here to steal my firewood?
        - id: ch01-b04
          speaker: narrator
          text: A voice had spoken close beside her. She turned and found a handsome young man standing there. The girl was so confused that she could barely answer him.
        - id: ch01-b05
          speaker: maiden
          text: My father sent me here.
        - id: ch01-b06
          speaker: prince
          text: Very well. Then come with me.
        - id: ch01-b07
          speaker: narrator
          text: He led her through the hole left by the torn-up root. They traveled on until they reached a beautiful palace, richly furnished and lit only from above. Once they were inside, the young man told her that he was a great lord. He had never seen anyone as beautiful as she was.
        - id: ch01-b08
          speaker: prince
          text: If you will give me your heart, we can marry and live happily together forever.
        - id: ch01-b09
          speaker: maiden
          text: Yes, I will.
        - id: ch01-b10
          speaker: narrator
          text: So the maiden and the young lord were married.
        - id: ch01-b11
          speaker: narrator
          text: The next day, the old dame who kept the house gave the bride all the palace keys. She pointed to one key and warned her never to use it.
        - id: ch01-b12
          speaker: old_dame
          text: If you use this key, the whole palace will fall. Grass will grow over the place, and no one will remember you anymore.
        - id: ch01-b13
          speaker: narrator
          text: The bride promised to be careful. But after a while, when every task was done, she began wondering about the chest that key would open. What could be hidden inside it? Once the thought had taken hold, she could not leave it alone. Before long, the key was no longer in her hand. It was in the lock of the forbidden chest.
        - id: ch01-b14
          speaker: narrator
          text: The lock was stiff. She strained against it, but it would not turn, and at last she broke it open. What did the chest contain? Nothing but a serpent's skin. Unknown to her, her husband was a magician, and he wore that skin when he worked.
        - id: ch01-b15
          speaker: narrator
          text: The girl turned away in disgust. At once the earth shook violently beneath her feet. The palace vanished as though it had never stood there, and the bride found herself alone in the middle of a field. She did not know where she was or which way to go.
    - id: ch02
      title: The Sun, the Moon, and the Wind
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: She wept bitterly, partly because of her own foolishness, but even more because she had lost the husband she dearly loved. Then she broke a sprig of rosemary from a nearby bush. Whatever it cost her, she would search the whole world until she found him.
        - id: ch02-b02
          speaker: narrator
          text: She walked and walked and walked until she came to a house made of straw. She knocked and asked whether anyone there needed a servant. The mistress of the house said she did, and the girl could stay if she wished.
        - id: ch02-b03
          speaker: narrator
          text: Day after day, the poor maiden grew sadder. At last her mistress begged her to explain what troubled her. The maiden told how she had lost her husband and was traveling through the world to find him.
        - id: ch02-b04
          speaker: mistress
          text: No one can know where he is better than the Sun, the Moon, and the Wind. They travel everywhere!
        - id: ch02-b05
          speaker: narrator
          text: At those words, the maiden set out again. She walked until she reached the Golden Castle, where the Sun lived, and she knocked boldly at the door.
        - id: ch02-b06
          speaker: maiden
          text: Greetings, O Sun! Please help me in my need. My own fault brought me to this trouble, and I am weary from searching the wide world for my husband.
        - id: ch02-b07
          speaker: sun
          text: You are rich, and yet you need help? Even though you live in a palace without windows, the Sun enters everywhere. I know you.
        - id: ch02-b08
          speaker: narrator
          text: The bride told him the whole story and hid none of what she had done. The Sun listened and felt sorry for her. He could not tell her where her husband was, but he gave her a nut.
        - id: ch02-b09
          speaker: sun
          text: Keep this nut, and open it when your need is very great.
        - id: ch02-b10
          speaker: narrator
          text: The maiden thanked him with all her heart. Then she walked and walked and walked until she reached another castle. An old woman opened the door when she knocked.
        - id: ch02-b11
          speaker: maiden
          text: Greetings! I have come to beg for your help.
        - id: ch02-b12
          speaker: moon_keeper
          text: You are looking for my mistress, the Moon. I will tell her that you have come to ask for aid.
        - id: ch02-b13
          speaker: narrator
          text: The Moon came out and knew the maiden at once. She had watched the girl sleeping in both the cottage and the palace.
        - id: ch02-b14
          speaker: moon
          text: You are rich, and yet you need help?
        - id: ch02-b15
          speaker: narrator
          text: Again the maiden told her whole story. The Moon listened and pitied her. She could not say where the husband was, but she gave the maiden an almond.
        - id: ch02-b16
          speaker: moon
          text: Crack this almond open when your need is great.
        - id: ch02-b17
          speaker: narrator
          text: The girl thanked the Moon and went on. She walked and walked and walked until she came to a third castle. She knocked on its door.
        - id: ch02-b18
          speaker: maiden
          text: Greetings! Please help me in my need.
        - id: ch02-b19
          speaker: wind_keeper
          text: You need my lord, the Wind. I will tell him what you ask.
        - id: ch02-b20
          speaker: narrator
          text: The Wind looked at the maiden and knew her too. He had seen her in the cottage and in the palace.
        - id: ch02-b21
          speaker: wind
          text: You are rich, and yet you need help?
        - id: ch02-b22
          speaker: narrator
          text: She told her story once more. The Wind listened with pity and gave her a walnut to eat when she was in need. He expected her to leave, but she was tired and sad and had no idea where to turn. She began to weep bitterly. The Wind wept along with her.
        - id: ch02-b23
          speaker: wind
          text: Do not be afraid. I will go and see what I can discover.
          emotion: calm
        - id: ch02-b24
          speaker: narrator
          text: The Wind rushed away with a great deal of noise and fuss. In the blink of an eye, he was back, beaming with delight.
        - id: ch02-b25
          speaker: wind
          text: I listened to what one person and another happened to say, and I found him. He is hidden in the king's palace so that no one may see him. Tomorrow he must marry the princess. She is an ugly creature, and she has found no other man willing to wed her.
          emotion: happy
        - id: ch02-b26
          speaker: narrator
          text: Despair seized the poor maiden. When she could speak again, she begged the Wind to delay the wedding for two or three days. She would need that long to reach the king's palace.
        - id: ch02-b27
          speaker: wind
          text: I will gladly do all I can.
    - id: ch03
      title: How the Wind Delayed the Wedding
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Wind traveled much faster than the maiden. He soon reached the palace and found five tailors working day and night on the princess's wedding clothes.
        - id: ch03-b02
          speaker: narrator
          text: Down he swept, straight into their lace, satin, and pearl trimmings. Everything flew through the open windows with a whiz. Some landed in the treetops, some crossed the river, and some scattered among the dancing ears of corn.
        - id: ch03-b03
          speaker: narrator
          text: The tailors raced after everything. They jumped, climbed, and snatched at each piece, but it was no use. The lace tore, the satin became stained, and the pearls were knocked away. Nothing could be saved. They had to return to the shops, buy fresh materials, and begin the work all over again. The wedding clothes could never be ready by the next day.
        - id: ch03-b04
          speaker: narrator
          text: The king was far too eager to see his daughter married to accept any excuse. He ordered the tailors to put together some sort of dress for the bride. But when he saw the princess wearing it, even he had to admit she could not appear in such a gown. He delayed the ceremony and banquet for a few hours while the tailors took the dress apart and made it fit.
    - id: ch04
      title: The Three Wedding Garments
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: By then, after walking for all those days, the maiden had reached the castle, footsore and weary. At the door, she remembered the gift from the Sun and cracked open the nut. Out came the most beautiful mantle in the world. With the mantle in her hands, she rang the bell.
        - id: ch04-b02
          speaker: maiden
          text: Is the princess being married today?
        - id: ch04-b03
          speaker: palace_servant
          text: Yes, she is.
        - id: ch04-b04
          speaker: maiden
          text: Then ask her if she would like to buy this mantle.
        - id: ch04-b05
          speaker: narrator
          text: The princess was delighted when she saw it. Her own wedding mantle had been ruined with everything else, and there was no time to make another.
        - id: ch04-b06
          speaker: princess
          text: Ask any price you wish. I will pay it.
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: The maiden named a great price, many pieces of gold. The princess had set her heart on the mantle and would not let it go. She counted out the gold and paid at once.
        - id: ch04-b08
          speaker: narrator
          text: The maiden hid the gold in her dress pocket and left the castle. As soon as no one could see her, she broke open the Moon's almond. Out came the most magnificent petticoats anyone had ever seen. She carried them back to the castle.
        - id: ch04-b09
          speaker: maiden
          text: Would the princess like to buy these petticoats?
        - id: ch04-b10
          speaker: narrator
          text: One look was enough. The princess declared that the petticoats were even lovelier than the mantle.
        - id: ch04-b11
          speaker: princess
          text: I will give you whatever price you name for them.
          emotion: happy
        - id: ch04-b12
          speaker: narrator
          text: Once again the maiden asked for many pieces of gold. The princess was so pleased with her new petticoats that she gladly paid every coin.
        - id: ch04-b13
          speaker: narrator
          text: Then the girl went down the castle steps to a place where no one was watching. She cracked the Wind's walnut, and out came the finest court dress any dressmaker had ever created. Holding it carefully in her arms, she knocked once more.
        - id: ch04-b14
          speaker: maiden
          text: Would the princess like to buy a court dress?
        - id: ch04-b15
          speaker: narrator
          text: When the message reached her, the princess sprang up in delight. A beautiful mantle and elegant petticoats were not much use without a dress, and she knew the tailors would never finish in time.
        - id: ch04-b16
          speaker: princess
          text: Tell her I will buy it. Ask how much she wants.
          emotion: happy
        - id: ch04-b17
          speaker: maiden
          text: The price is permission to see the bridegroom.
        - id: ch04-b18
          speaker: narrator
          text: The princess did not like that answer at all. But she could not do without the dress, so she had to agree. After all, she told herself, it did not matter very much.
    - id: ch05
      title: The Sprig Restores His Memory
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The bargain was kept, and the maiden was led through the palace to the rooms that had been given to her husband. She had carried her sprig of rosemary through the whole long search. When she came near him at last, she reached out and touched him with it.
        - id: ch05-b02
          speaker: narrator
          text: At once his memory returned. He knew his wife, kissed her, and declared that she was his true bride.
        - id: ch05-b03
          speaker: prince
          text: You are my true wife. I love you, and no one else.
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: Then they went back to the maiden's home. They grew very old together and lived happily for all the rest of their days.
