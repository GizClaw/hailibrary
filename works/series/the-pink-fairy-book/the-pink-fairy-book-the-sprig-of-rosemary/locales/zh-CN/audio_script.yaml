audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    maiden:
      display_name: "姑娘"
      tts:
        delivery: "真诚坚韧，从羞怯悔恨渐渐变得果断"
        timbre: "清澈柔和的年轻女声"
        pace: "适中而有变化"
        pitch: "中高音"
    magician:
      display_name: "年轻领主"
      tts:
        delivery: "温和自信，恢复记忆后深情坚定"
        timbre: "明朗沉稳的年轻男声"
        pace: "从容"
        pitch: "中音"
    old_housekeeper:
      display_name: "宫中老妇人"
      tts:
        delivery: "严肃谨慎，告诫时郑重清楚"
        timbre: "略显苍老的女声"
        pace: "缓慢"
        pitch: "中低音"
    cottage_mistress:
      display_name: "小屋女主人"
      tts:
        delivery: "朴实体贴，说话直截了当"
        timbre: "温厚的成年女声"
        pace: "适中"
        pitch: "中音"
    sun:
      display_name: "太阳"
      tts:
        delivery: "明亮庄重，带着洞悉一切的慈悲"
        timbre: "饱满开阔的男声"
        pace: "舒缓"
        pitch: "中音"
    moon_gatekeeper:
      display_name: "月亮城堡的老妇人"
      tts:
        delivery: "恭谨平和，言语简洁"
        timbre: "柔和的老年女声"
        pace: "舒缓"
        pitch: "中音"
    moon:
      display_name: "月亮"
      tts:
        delivery: "宁静慈爱，语气轻柔而清醒"
        timbre: "清润柔和的女声"
        pace: "舒缓"
        pitch: "中高音"
    wind_gatekeeper:
      display_name: "风城堡的老妇人"
      tts:
        delivery: "恭谨爽利，答话干脆"
        timbre: "清晰的老年女声"
        pace: "适中"
        pitch: "中音"
    wind:
      display_name: "风"
      tts:
        delivery: "热心爽朗，来去匆匆却富有同情心"
        timbre: "轻快有力的男声"
        pace: "明快而有变化"
        pitch: "中高音"
    king:
      display_name: "国王"
      tts:
        delivery: "急切专断，一心催成女儿的婚事"
        timbre: "浑厚的成年男声"
        pace: "适中偏快"
        pitch: "中低音"
    door_attendant:
      display_name: "王宫门人"
      tts:
        delivery: "守礼简洁，如实回答来客"
        timbre: "清晰的成年女声"
        pace: "适中"
        pitch: "中音"
    princess:
      display_name: "公主"
      tts:
        delivery: "任性挑剔，见到华服时毫不掩饰欢喜"
        timbre: "明亮的年轻女声"
        pace: "轻快"
        pitch: "中高音"
  chapters:
    - id: ch01
      title: "迷迭香下的宫殿"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有个男人只有一个女儿，却叫她整天干活。一天早晨，姑娘刚做完父亲交代的事情，又被打发到树林里捡枯叶和树枝，好拿回家生火。"
        - id: ch01-b02
          speaker: narrator
          text: "姑娘很快捡起一大捆柴叶。她闻见迷迭香的清香，便想折一枝留给自己。奇怪的是，她越拉，那株香草就扎得越牢。姑娘不肯认输，猛地一拽，总算把迷迭香拔了出来。"
        - id: ch01-b03
          speaker: magician
          text: "怎么样？"
        - id: ch01-b04
          speaker: narrator
          text: "声音就在身边。姑娘回过头，面前竟站着一个英俊的年轻人。他问她，为什么要来偷自己的柴火。姑娘窘得说不出完整的话，只能结结巴巴地解释，是父亲叫她来的。"
        - id: ch01-b05
          speaker: magician
          text: "既然这样，那就跟我走吧。"
        - id: ch01-b06
          speaker: narrator
          text: "年轻人带她钻进迷迭香根下留下的洞口。两人走了很久，来到一座美丽的宫殿。里面处处华贵，却只有顶上的光照得进来。年轻人说，自己是一位尊贵的领主，还说他从未见过这么美的姑娘。"
        - id: ch01-b07
          speaker: magician
          text: "只要你愿意把心交给我，我们就结为夫妻，从此永远幸福地生活在一起。"
        - id: ch01-b08
          speaker: maiden
          text: "我愿意。"
        - id: ch01-b09
          speaker: narrator
          text: "于是，两人成了婚。第二天，照料宫中事务的老妇人把所有钥匙交给新娘，唯独拿出一把，郑重告诫她绝不能使用。"
        - id: ch01-b10
          speaker: old_housekeeper
          text: "这把钥匙千万不要动。你若用了，整座宫殿都会倒塌，野草会盖住废墟，从此再也不会有人记得你。"
        - id: ch01-b11
          speaker: narrator
          text: "新娘答应一定小心。可没过多久，手边的活全做完了，她便忍不住去猜，那把钥匙能打开的箱子里到底有什么。人一旦想个不停，很快就会动手。果然，钥匙不久便插进了锁孔。箱锁锈得厉害，她怎么拧也拧不开，最后只好把锁砸坏。"
        - id: ch01-b12
          speaker: narrator
          text: "箱里没有金银珠宝，只有一张蛇皮。她并不知道，丈夫其实是个魔法师，出去办事时就披着这张皮。新娘一看见它，厌恶得转身就走。可就在这时，大地猛然震动，宫殿一下子消失了，像是从来没有存在过。"
        - id: ch01-b13
          speaker: narrator
          text: "新娘独自站在田野里，不知道这是哪里，也不知道该往哪里走。她放声大哭，既后悔自己的愚蠢，更伤心失去了深爱的丈夫。后来，她从近旁折下一枝迷迭香，决心不管要付出什么代价，也要走遍天下，把丈夫找回来。"
    - id: ch02
      title: "太阳、月亮和风"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "姑娘走啊，走啊，又走啊，来到一间稻草盖的小屋。她敲门问屋里缺不缺女仆。女主人正好需要一个帮手，只要姑娘愿意，就可以留下。可是日子一天天过去，这个可怜的姑娘越来越忧伤。女主人见了，终于恳切地劝她说出心事。姑娘这才讲起自己的遭遇，说她正在走遍天下寻找丈夫。"
        - id: ch02-b02
          speaker: cottage_mistress
          text: "要想知道他在哪里，你该去问太阳、月亮和风。它们什么地方都去，再没有谁比它们更清楚了。"
        - id: ch02-b03
          speaker: narrator
          text: "姑娘听了女主人的话，再次踏上旅途。她走了很远，一直来到太阳居住的金城堡，这才壮着胆子敲响大门。"
        - id: ch02-b04
          speaker: maiden
          text: "太阳啊，愿你安好！请你发发慈悲，帮帮我吧。我因为自己的过错落到这般境地，已经走得疲惫不堪，只为在茫茫世界里寻找丈夫。"
        - id: ch02-b05
          speaker: sun
          text: "是吗？你这样富贵的人，竟也需要帮助？你虽然住在没有窗户的宫殿里，可阳光哪里都能进去，我当然认得你。"
        - id: ch02-b06
          speaker: narrator
          text: "新娘把一切从头讲起，也没有隐瞒自己的过错。太阳听完很怜悯她，却不知道她该往哪里去。他送给姑娘一颗榛子，嘱咐她只有在万分危急的时候才能打开。姑娘诚心诚意地谢过太阳，又独自继续赶路。"
        - id: ch02-b07
          speaker: narrator
          text: "她走啊，走啊，又走啊，来到另一座城堡。一位老妇人听见敲门声，出来应门。"
        - id: ch02-b08
          speaker: maiden
          text: "愿你安好！请你发发慈悲，帮我一个忙吧。"
        - id: ch02-b09
          speaker: moon_gatekeeper
          text: "你要找的是我的女主人月亮。我这就替你把请求禀告她。"
        - id: ch02-b10
          speaker: narrator
          text: "月亮走出来，一眼便认出了姑娘。无论姑娘睡在小屋还是宫殿，月亮都曾在夜里看见过她。"
        - id: ch02-b11
          speaker: moon
          text: "你这样富贵的人，也会需要帮助吗？"
        - id: ch02-b12
          speaker: narrator
          text: "姑娘又把全部遭遇讲了一遍。月亮静静听完，十分同情她，却也不知道该到哪里去找她的丈夫。于是月亮送给她一颗巴旦木，叫她万分危急时再敲开。姑娘道过谢，离开城堡，又独自上路了。"
        - id: ch02-b13
          speaker: narrator
          text: "她走啊，走啊，又走啊，来到第三座城堡，再次敲响大门。"
        - id: ch02-b14
          speaker: maiden
          text: "愿你安好！请你发发慈悲，在我为难的时候帮帮我。"
        - id: ch02-b15
          speaker: wind_gatekeeper
          text: "你要找的是我的男主人风。我这就把你的请求告诉他。"
        - id: ch02-b16
          speaker: narrator
          text: "风看见姑娘，也马上认出了她。因为不论在小屋还是宫殿，他都见过她。"
        - id: ch02-b17
          speaker: wind
          text: "你这样富贵的人，也会需要帮助吗？"
        - id: ch02-b18
          speaker: narrator
          text: "姑娘再一次讲完自己的故事。风很怜悯她，送给她一颗核桃，叫她有难时吃下。可姑娘没有离开。她又累又伤心，已经不知道还能往哪里走，只能痛哭起来。风见她落泪，也陪着她哭。"
        - id: ch02-b19
          speaker: wind
          text: "别害怕。我去四处看看，一定尽力替你打听消息。"
          emotion: calm
        - id: ch02-b20
          speaker: narrator
          text: "风呼呼隆隆地飞走，闹出好大的声势。转眼间，他又满脸喜色地回来了。"
        - id: ch02-b21
          speaker: wind
          text: "我听这个人漏一句，又听那个人漏一句，总算拼出了消息。你丈夫就在国王的宫殿里。国王把他藏起来，不让任何人见他。明天，他就要娶公主了。那位公主长得实在难看，一直没有男人肯娶她。"
          emotion: happy
        - id: ch02-b22
          speaker: narrator
          text: "姑娘听见这个消息，顿时陷入绝望，好半天才说得出话。她央求风设法把婚礼拖延两三天，因为自己至少还要走这么久，才能赶到王宫。"
        - id: ch02-b23
          speaker: wind
          text: "我答应你，一定尽力。"
    - id: ch03
      title: "风吹走了婚服"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "风比姑娘快得多，很快便赶到王宫。五个裁缝正在那里日夜不停地赶制公主的婚服。风一下扑进他们的花边、缎子和珍珠饰物中间。呼啦一声，所有东西全从窗户飞了出去！"
        - id: ch03-b02
          speaker: narrator
          text: "有的挂上树梢，有的越过河流，还有的掉进摇摆的麦穗之间。裁缝们跟在后面又追又跳又爬，可什么也没抢救回来。花边撕了，缎子脏了，珍珠也撞落了。他们只能去铺子里重新买材料，从头再做。第二天，婚服显然赶不出来了。"
        - id: ch03-b03
          speaker: narrator
          text: "国王一心急着把女儿嫁出去，根本不肯听裁缝解释，硬说无论如何也要拼出一件衣裳给新娘穿。可他亲自去看公主时，也不得不承认，她穿着那件衣服实在不像样。以公主的身份，绝不能就这样露面。于是，国王把婚礼和宴席推迟了几个钟头，让裁缝拆开衣服，重新改得合身。"
        - id: ch03-b04
          speaker: narrator
          text: "就在这时，姑娘拖着走痛的脚，疲惫不堪地赶到城堡。她来到门前，敲开太阳送的榛子，从里面取出一件世上最美丽的斗篷。随后，她拉响了门铃。"
        - id: ch03-b05
          speaker: maiden
          text: "公主是今天结婚吗？"
        - id: ch03-b06
          speaker: door_attendant
          text: "对，正是今天。"
        - id: ch03-b07
          speaker: maiden
          text: "请替我问问，她愿不愿意买下这件斗篷。"
        - id: ch03-b08
          speaker: narrator
          text: "公主一见斗篷，欢喜极了。她自己的婚礼斗篷已经和其他衣物一起毁掉，现在再做也来不及。她让姑娘随意开价，说要多少都肯付。姑娘索要许多金币，公主一心想得到斗篷，立刻付清了。"
        - id: ch03-b09
          speaker: narrator
          text: "姑娘把金币藏进口袋，离开城堡。等走到没人看得见的地方，她敲开月亮送的巴旦木，从里面取出一套从未有人见过的华美衬裙。她带着衬裙回到城堡，又请人去问公主愿不愿意买。"
        - id: ch03-b10
          speaker: narrator
          text: "公主只看了一眼，就说这些衬裙比斗篷还要漂亮，无论姑娘开多少价，她都愿意。姑娘再次要了许多金币。公主得到了喜欢的新衣，也高高兴兴地把钱付了。"
    - id: ch04
      title: "礼服的价钱"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "姑娘走下台阶，到了无人看见的地方，又敲开风送的核桃。一件华贵无比的宫廷礼服落了出来，世上任何裁缝都不曾想出过这样的衣服。姑娘小心翼翼地把礼服抱在怀里，再次敲响王宫的大门，请人去问公主愿不愿意买下它。"
        - id: ch04-b02
          speaker: narrator
          text: "公主听见消息，欢喜得跳了起来。她正想着，自己有了美丽的斗篷和雅致的衬裙，却没有一件礼服，这些东西终究派不上用场。而裁缝无论如何也不可能及时赶完。她马上叫人传话，说自己愿意买，问姑娘要多少价钱。"
        - id: ch04-b03
          speaker: maiden
          text: "这一次，我不要金币。只要准许我见新郎一面，礼服就是你的。"
        - id: ch04-b04
          speaker: narrator
          text: "公主听了很不高兴，可她不能没有礼服，只得勉强答应。她安慰自己，不过是见一面，不会有什么大不了。于是，姑娘被带到为新郎安排的房间。"
        - id: ch04-b05
          speaker: narrator
          text: "姑娘走到丈夫身边，举起一路带来的迷迭香枝，轻轻碰了碰他。就在那一刻，他的记忆全部回来了。他认出了自己的妻子，紧紧吻住了她。"
        - id: ch04-b06
          speaker: magician
          text: "你才是我真正的妻子。我爱的是你，绝不会是别人。"
        - id: ch04-b07
          speaker: narrator
          text: "后来，他们一起回到姑娘的家乡，慢慢活到很老很老，一生都过得幸福快乐。"
