  chapters:
    - id: ch01
      title: The Mermaid's Son
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In a village there lived a smith named Basmus. He was young, strong, and handsome, but he was very poor. There were many small children to feed, and smithing brought in little money. Basmus worked hard. Whenever the forge was quiet, he went fishing at sea or searched the shore for wreckage.
        - id: ch01-b02
          speaker: narrator
          text: One day he went fishing alone in a little boat. The weather was fine, but Basmus did not return that night. Another day passed, and everyone thought he had drowned. Then, on the third day, he came ashore with his boat piled high with the biggest, fattest fish anyone had ever seen. He was perfectly well, without hunger or thirst.
        - id: ch01-b03
          speaker: narrator
          text: Basmus said a fog had closed around his boat and hidden the land. He had simply been unable to find his way home. But he did not tell anyone where he had really spent those three days. The truth came out only six years later. Far out on the deep sea, a mermaid had caught him and made him her guest for all the time he was missing. From then on, Basmus never went fishing again. In fact, he no longer needed to. Whenever he walked down to the shore, wreckage washed in without fail, and valuable things were always hidden among it. In those days, anyone who found such goods was allowed to keep them. Little by little, the poor smith became more prosperous.
        - id: ch01-b04
          speaker: narrator
          text: Seven years after that fishing trip, Basmus was mending a plough in his smithy when a handsome young fellow walked in.
        - id: ch01-b05
          speaker: hans
          text: Good day, Father. My mother, the mermaid, sends her greetings. She has kept me for six years, and now she says you may keep me for the same length of time.
        - id: ch01-b06
          speaker: narrator
          text: He was a strange six-year-old. He looked eighteen, and he was larger and stronger than most boys of that age.
        - id: ch01-b07
          speaker: basmus
          text: Would you like a piece of bread?
        - id: ch01-b08
          speaker: hans
          text: Oh, yes.
        - id: ch01-b09
          speaker: narrator
          text: His name was Hans. The smith asked his wife to cut him some bread. Hans swallowed the piece in one mouthful and came straight back to the smithy.
        - id: ch01-b10
          speaker: basmus
          text: Was that enough for you?
        - id: ch01-b11
          speaker: hans
          text: No. That was only a tiny bite.
        - id: ch01-b12
          speaker: narrator
          text: Basmus fetched a whole loaf, sliced it in two, and filled it with butter and cheese. Hans ate that too, then returned once more.
        - id: ch01-b13
          speaker: basmus
          text: Now have you had enough?
        - id: ch01-b14
          speaker: hans
          text: Not nearly. I had better find somewhere else to live. I can see that I will never eat my fill here.
        - id: ch01-b15
          speaker: narrator
          text: Hans was ready to leave at once, but first he asked his father to make him the sort of staff he wanted.
        - id: ch01-b16
          speaker: hans
          text: Make it from iron, and make it strong enough to last.
        - id: ch01-b17
          speaker: narrator
          text: The smith brought an iron rod as thick as a common walking staff. Hans tested it by winding it around one finger, so that would never do. Basmus dragged out another rod as thick as a wagon pole. Hans laid it across his knee, bent it, and snapped it as easily as a piece of straw. His father had only one choice left. He gathered every scrap of iron in the smithy into one great mass. Hans held it steady while Basmus worked the forge and shaped a single staff. When it was done, the staff weighed more than the anvil.
        - id: ch01-b18
          speaker: hans
          text: Thank you, Father. Now I have my inheritance.
        - id: ch01-b19
          speaker: narrator
          text: Hans set off across the country. Basmus was glad to see him go before the boy ate the family out of house and home.
    - id: ch02
      title: Work for Twelve Men
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Hans came first to a great estate. The squire himself was standing outside the farmyard.
        - id: ch02-b02
          speaker: squire
          text: Where are you headed?
        - id: ch02-b03
          speaker: hans
          text: I am looking for work. I need a place that wants strong men and serves plenty of food.
        - id: ch02-b04
          speaker: squire
          text: I usually employ twenty-four men at this season, but right now I have only twelve. I can certainly hire you.
        - id: ch02-b05
          speaker: hans
          text: Good. I can easily do the work of twelve men, as long as I get enough food for twelve.
        - id: ch02-b06
          speaker: narrator
          text: The squire agreed. He took Hans to the kitchen and told the servant girls to give the new man as much as all twelve workers. Hans would have a cooking pot to himself and could eat from it with the ladle.
        - id: ch02-b07
          speaker: narrator
          text: Hans had arrived in the evening, so there was no work for him until morning. For supper, the kitchen gave him a great pot of buckwheat porridge. He scraped it clean to the bottom. It did not fill him completely, but it satisfied him enough to sleep, and he went straight to bed. Hans slept both soundly and long. The next morning, every other man rose and started work while he still lay fast asleep. The squire was up as well. He was curious to see how this newcomer would behave, since Hans had promised to work for twelve and expected to eat for twelve too.
        - id: ch02-b08
          speaker: narrator
          text: The sun climbed high, but Hans still did not appear. At last the squire went to wake him.
        - id: ch02-b09
          speaker: squire
          text: Get up, Hans! You have slept far too long.
        - id: ch02-b10
          speaker: narrator
          text: Hans opened his eyes and rubbed them.
        - id: ch02-b11
          speaker: hans
          text: Yes, I suppose I have. Time to get up and eat breakfast.
        - id: ch02-b12
          speaker: narrator
          text: He dressed, went to the kitchen, and swallowed another pot of porridge. Then he asked for his work. The squire told him to thresh grain. Twelve men were already working in pairs on six threshing floors. Hans was to clear the other six by himself.
        - id: ch02-b13
          speaker: narrator
          text: In the barn, Hans picked up a flail and watched how the other men used theirs. He copied their movement, but his very first blow smashed the tool to pieces. Several more flails hung nearby. Hans tried them one by one, and every one flew into splinters at the first stroke. He searched for something that could bear his strength. Two heavy beams lay close at hand, and a horsehide was nailed across the barn door. Hans took down the hide and used it to bind the beams together. He held one beam as a handle and let the other swing as the striking piece. At last he had a flail that did not break.
        - id: ch02-b14
          speaker: narrator
          text: The barn was not. Its roof hung too low for Hans to swing such a huge flail, and the threshing floors gave him too little room. Hans solved both problems at once. He lifted the whole roof from the barn and set it down in the neighboring field. Then he emptied out all the grain he could lay his hands on and began to strike. He worked through load after load without caring which crop came next. Rye, wheat, barley, and oats all went into the same great mixture. Before noon, every bit of the squire's grain was threshed. Hans lifted the roof back into place as easily as setting a lid on a box, then went indoors to report.
        - id: ch02-b15
          speaker: hans
          text: The threshing is finished.
        - id: ch02-b16
          speaker: narrator
          text: The squire stared, then went to see for himself. The work was certainly done, though he was not pleased to find all his crops mixed. When he saw Hans's enormous flail and heard how the roof had been moved, fear kept him from complaining.
        - id: ch02-b17
          speaker: squire
          text: It is good that you finished the threshing. The grain still needs cleaning, though.
        - id: ch02-b18
          speaker: hans
          text: What do you mean by cleaning it?
        - id: ch02-b19
          speaker: narrator
          text: The squire explained that cleaning meant separating the grain from the chaff. At that moment, both were mixed in one enormous heap that rose all the way to the roof. Hans scooped up a little and tried sifting it through his hands. He quickly saw that he would never finish that way. Then a better plan came to him. He opened the doors at both ends of the barn and lay flat at one end of the floor. Hans drew a breath and blew so powerfully that all the light chaff flew out. It gathered like a sandbank beyond the far door, while the clean grain stayed behind.
        - id: ch02-b20
          speaker: hans
          text: That job is done too.
        - id: ch02-b21
          speaker: squire
          text: Very well. There is nothing else for you today.
        - id: ch02-b22
          speaker: narrator
          text: Hans went to the kitchen, ate all he wanted, and took a midday nap that lasted until supper.
    - id: ch03
      title: The Race from the Forest
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Meanwhile, the squire was miserable. He told his wife that she must help him get rid of this mighty worker, because he was too frightened to dismiss him. She called the steward. Together they planned to send all the men for firewood the next day. The workers would agree that whoever returned last with his load must be hanged. They expected Hans to sleep late while everyone else got an early start.
        - id: ch03-b02
          speaker: narrator
          text: That evening, the men spoke of the hard work and long journey ahead. For amusement, they suggested a bargain. The last man home with his load would lose his life on the gallows. Hans agreed without objection.
        - id: ch03-b03
          speaker: narrator
          text: Long before sunrise, the twelve men took the best horses and carts and drove away. Hans slept on.
        - id: ch03-b04
          speaker: squire
          text: Leave him there. Let him sleep.
        - id: ch03-b05
          speaker: narrator
          text: When Hans finally thought breakfast time had come, he dressed and ate without hurrying. The others had taken everything useful. He had to fit four mismatched wheels onto an old cart, and the only horses left were two worn-out nags. Hans did not know the way to the forest, so he followed the other carts' tracks.
        - id: ch03-b06
          speaker: narrator
          text: The tracks led Hans to the gate of the forest, but as he passed through, he accidentally broke the gate to pieces. He could not leave the entrance open. In the field nearby lay a tremendous stone, seven ells long and seven ells wide. Hans lifted it and set it squarely in the gap where the gate had stood. Then he drove on until he found the workers. They had been laboring as hard as they could since daybreak. They helped one another cut down trees and heave the trunks onto their carts. By the time Hans appeared with his crooked cart and tired horses, every cart but one was loaded, and the men laughed heartily at him.
        - id: ch03-b07
          speaker: narrator
          text: Hans took a woodman's axe, but his first blow ruined its edge and broke its handle. He put it aside, wrapped both arms around a tree, and pulled it out by the roots. Onto his cart it went. He uprooted another, then another. The other men stopped working and stared with open mouths. Suddenly they remembered the bargain. They loaded the final cart and whipped their horses toward home.
        - id: ch03-b08
          speaker: narrator
          text: Once Hans had loaded enough trees, he harnessed the two old horses again. They leaned against their traces, but could not move the cart even an inch. Hans grew annoyed with them and took them out of the harness. Next he wound a rope around the cart and around the whole pile of trees so that nothing could slip loose. He bent down, lifted cart, timber, and rope together onto his back, and started for home. The empty-handed horses came behind him, one rein in each hand.
        - id: ch03-b09
          speaker: narrator
          text: At the forest gate, the other carts stood in a long row. None could pass the stone Hans had put there.
        - id: ch03-b10
          speaker: hans
          text: What is this? Can twelve men not move one stone?
        - id: ch03-b11
          speaker: narrator
          text: He lifted the stone and threw it aside. With the loaded cart still on his back and the horses behind him, Hans reached the farm long before the others.
        - id: ch03-b12
          speaker: narrator
          text: Back at the farm, the squire paced about and kept looking down the road. He badly wanted to know how his plan had ended. At last he saw Hans approaching with the loaded cart and all the trees on his back, while the two horses walked behind him. The sight frightened the squire so badly that he did not know what else to do. He slammed the courtyard gate and barred it. Hans arrived, lowered his load, and hammered on the wood. No one came. So he picked up the trees and tossed them clear over the barn into the yard. The cart followed. It struck the ground so hard that its four wheels shot away in four different directions.
        - id: ch03-b13
          speaker: narrator
          text: The squire saw what happened and thought the horses might come flying over next. He hurried to open the gate.
        - id: ch03-b14
          speaker: hans
          text: Good day, master.
        - id: ch03-b15
          speaker: narrator
          text: Hans stabled the horses and went to the kitchen for food. Much later, the other men arrived with their loads.
        - id: ch03-b16
          speaker: hans
          text: Do you remember last night's bargain? Which one of you is going to be hanged?
        - id: ch03-b17
          speaker: worker
          text: Oh, that was only a joke. We did not mean it.
        - id: ch03-b18
          speaker: hans
          text: Well, then. It does not matter.
        - id: ch03-b19
          speaker: narrator
          text: And nothing more was said about the bargain.
    - id: ch04
      title: The Millstone Collar
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The squire, his wife, and the steward held another anxious meeting about the terrible man now living on their farm. They all agreed that Hans had to go, but no one dared tell him to leave. The steward promised that this time he could manage it. The next morning, all the men would clean the well. They would persuade Hans to climb to the bottom, then have a great millstone ready and throw it down on his head. Afterward they could simply fill in the well. They would be rid of Hans and would not even have to pay for his funeral. The squire and his wife called it a splendid plan. They went about rejoicing because they believed their trouble was nearly over.
        - id: ch04-b02
          speaker: narrator
          text: But Hans was not easily killed. As usual, he slept late. When he would not wake on his own, the squire had to call him.
        - id: ch04-b03
          speaker: squire
          text: Get up, Hans! You are sleeping too long.
        - id: ch04-b04
          speaker: narrator
          text: Hans rubbed his eyes.
        - id: ch04-b05
          speaker: hans
          text: That is true. I will get up and eat my breakfast.
        - id: ch04-b06
          speaker: narrator
          text: He dressed and finished the breakfast waiting for him. Then he asked what he should do. The squire sent him to help the others clean the well. Hans found them waiting outside.
        - id: ch04-b07
          speaker: hans
          text: Choose whichever job you prefer. You can go down and fill the buckets while I pull them up, or you can stay here and pull while I work alone at the bottom.
        - id: ch04-b08
          speaker: worker
          text: We would rather stay above. There would not be room for all of us down there.
        - id: ch04-b09
          speaker: narrator
          text: Hans climbed down alone and began cleaning. At once, each man picked up a large stone from a nearby heap and dropped it into the well, hoping to kill him.
        - id: ch04-b10
          speaker: hans
          text: Keep those hens away from the well! They are scratching gravel down on my head.
        - id: ch04-b11
          speaker: narrator
          text: When Hans mistook their stones for chicken-scratched gravel, the men knew those smaller blocks would never kill him. They still had the great millstone. All twelve strained together with poles and rollers, inching it toward the mouth of the well. Even with every man helping, they had great trouble tipping it over the edge. Once it fell, they had no doubt that Hans had finally received all he could bear. But the millstone came down in the luckiest possible way. Hans's head passed straight through the hole in its center, and the stone settled around his neck like a priest's broad collar.
        - id: ch04-b12
          speaker: narrator
          text: Hans had had enough of the well. He climbed out wearing the millstone and went straight to the squire.
        - id: ch04-b13
          speaker: hans
          text: Those men are trying to make a fool of me. I will not be their priest. I have far too little learning for that.
        - id: ch04-b14
          speaker: narrator
          text: He lowered his head and shook off the millstone. It landed on one of the squire's big toes and crushed it.
        - id: ch04-b15
          speaker: narrator
          text: The squire limped indoors to his wife and summoned the steward. His last scheme had failed, and now he demanded another way to remove this terrible man.
        - id: ch04-b16
          speaker: steward
          text: There are still plenty of ways. Send him to fish in Devilmoss Lake tonight. No one can go there after dark and escape Old Eric alive.
        - id: ch04-b17
          speaker: narrator
          text: The squire and his wife thought this was an excellent plan. The squire limped back to Hans. He promised to punish the workers for mocking him, then offered Hans a task away from those rascals. Hans could fish on the lake that night and have the next day free.
        - id: ch04-b18
          speaker: hans
          text: That suits me well. But I need food to take along. Give me one baking of bread, a cask of butter, a barrel of ale, and a keg of brandy. I cannot manage with less.
        - id: ch04-b19
          speaker: narrator
          text: The squire readily supplied it all. Hans tied the provisions together, hung them from his iron staff, and marched away to Devilmoss Lake.
    - id: ch05
      title: Old Eric of Devilmoss Lake
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At Devilmoss Lake, Hans climbed into a boat and rowed out across the dark water. He stopped in the very middle and arranged everything he needed for fishing. By then it was late in the evening. Before starting the job, Hans decided that he had better eat. He opened his bundle and became thoroughly occupied with his meal. That was when Old Eric rose from the lake. He caught Hans by the back of his collar, snatched him bodily from the boat, and dragged him down through the water to the bottom.
        - id: ch05-b02
          speaker: narrator
          text: Luckily, Hans had brought his iron staff. The moment he felt Old Eric's claws at his neck, he caught hold of it. As soon as they reached the lake bed, Hans planted his feet.
        - id: ch05-b03
          speaker: hans
          text: Stop a moment. Here we have solid ground.
        - id: ch05-b04
          speaker: narrator
          text: With one hand, Hans gripped Old Eric by the back of the neck. With the other, he beat him with the staff until the creature was flat as a pancake. Old Eric howled and begged for freedom. He promised that he would leave the lake and never return.
        - id: ch05-b05
          speaker: hans
          text: No, my friend. I will not release you until you promise something more. Before morning, bring every fish in this lake to the squire's courtyard.
        - id: ch05-b06
          speaker: narrator
          text: Old Eric eagerly gave his word, if only Hans would let him go. Hans rowed back to shore, finished his provisions, and went home to bed.
        - id: ch05-b07
          speaker: narrator
          text: The next morning, the squire opened his front door. Fish tumbled into the porch, and the whole courtyard was packed with them. Since he could never think of a plan himself, he ran to his wife.
        - id: ch05-b08
          speaker: squire
          text: What can we do with him now? Old Eric did not take him. Every fish must be out of the lake, because they have filled the entire yard!
        - id: ch05-b09
          speaker: squires_wife
          text: This is bad. See if you can send him to Purgatory to collect tribute.
        - id: ch05-b10
          speaker: narrator
          text: The squire set out for the men's quarters to speak with Hans. The fish were packed so deeply across the yard that he could not take the usual path. He had to squeeze along the walls, keeping under the eaves as he edged forward. When he reached Hans, he thanked him warmly for such excellent fishing. Then he explained that another errand was waiting, one so important that he could entrust it only to a dependable servant. Hans must travel all the way to Purgatory and collect three years of tribute that the squire claimed was owed from that place.
        - id: ch05-b11
          speaker: hans
          text: Gladly. Which road will take me there?
        - id: ch05-b12
          speaker: narrator
          text: The squire had no answer. He had to return to his wife and ask her.
        - id: ch05-b13
          speaker: squires_wife
          text: What a fool you are! Tell him to go straight south through the wood. Whether he reaches the place or not, we will be rid of him.
        - id: ch05-b14
          speaker: narrator
          text: The squire went back outside.
        - id: ch05-b15
          speaker: squire
          text: Go straight ahead, south through the wood.
        - id: ch05-b16
          speaker: narrator
          text: Hans asked for provisions again. This journey required two bakings of bread, two casks of butter, two barrels of ale, and two kegs of brandy. He tied everything together, balanced the bundle on his shoulder from his iron staff, and set off toward the south.
    - id: ch06
      title: The Tribute from Purgatory
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Beyond the wood, Hans found several roads and could not tell which one to follow. He sat down and opened his provisions. He had forgotten his knife, but a plough stood nearby, so he removed its iron blade and used that to cut his bread. While he ate, a man rode past.
        - id: ch06-b02
          speaker: hans
          text: Where have you come from?
        - id: ch06-b03
          speaker: rider
          text: From Purgatory.
        - id: ch06-b04
          speaker: hans
          text: Then stop and wait for me.
        - id: ch06-b05
          speaker: narrator
          text: The rider was in a hurry and kept going. Hans ran after him and caught the horse by its tail. The horse reared onto its hind legs, and the rider flew over its head into a ditch.
        - id: ch06-b06
          speaker: hans
          text: Wait a moment. I am headed the same way.
        - id: ch06-b07
          speaker: narrator
          text: Hans tied up his provisions and loaded them onto the horse. Then he took the reins.
        - id: ch06-b08
          speaker: hans
          text: You and I can walk there together.
        - id: ch06-b09
          speaker: narrator
          text: The two continued on foot, with Hans leading the horse. As they traveled, Hans told the stranger why the squire had sent him out and described the fun he had enjoyed with Old Eric at the bottom of the lake. The stranger did not answer much. Still, he knew the road well, and it did not take them long to reach the gate of Purgatory. The instant they arrived, both the man and his horse disappeared. Hans found himself standing outside the gate with no companion and no guide.
        - id: ch06-b10
          speaker: narrator
          text: Hans thought someone would surely come and open the gate in a moment. He waited, but nobody appeared. Then he hammered on the gate and listened. Still there was no answer. At last Hans lost patience. He swung his iron staff against the gate again and again until the whole thing broke into pieces. He stepped through the ruined entrance, and a troop of little demons came racing down to meet him.
        - id: ch06-b11
          speaker: demon
          text: What do you want here?
        - id: ch06-b12
          speaker: hans
          text: My master, the squire of Devilmoss, sends his greetings. I have come to collect the three years of tribute you owe him.
        - id: ch06-b13
          speaker: narrator
          text: The demons howled. They tried to seize Hans and drag him away, but a few blows from his iron staff made them release him. Howling louder than ever, they fled to Old Eric. He was still in bed after the beating at the lake.
        - id: ch06-b14
          speaker: demon
          text: A messenger has come from the squire at Devilmoss. He demands three years of tribute. He smashed the gate and bruised our arms and legs with his iron staff!
        - id: ch06-b15
          speaker: old_eric
          text: Give him three years! Give him ten! Only keep him away from me!
          emotion: fearful
        - id: ch06-b16
          speaker: narrator
          text: Old Eric's orders sent the little demons hurrying. They dragged out such a mountain of gold and silver that it was almost terrible to see. Hans opened the bundle that had carried his provisions and filled it with coins. Then he hoisted the heavy treasure onto his neck and started back along the road. He marched all the way to the estate and presented himself to his master. The squire had expected never to see him again, and Hans's return frightened him beyond measure.
        - id: ch06-b17
          speaker: narrator
          text: By then, Hans too had grown tired of service. He let the squire keep half the treasure. The squire was glad to have both the money and the chance to be rid of Hans. Hans carried the other half home to his father, the smith in Furreby.
        - id: ch06-b18
          speaker: hans
          text: Farewell, Father. I am tired of living on shore among mortal people. I would rather go home to my mother.
        - id: ch06-b19
          speaker: narrator
          text: Since that day, no one has ever seen Hans, the Mermaid's son.
