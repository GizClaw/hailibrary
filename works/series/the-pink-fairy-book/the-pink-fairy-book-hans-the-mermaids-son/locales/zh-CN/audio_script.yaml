audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    basmus:
      display_name: 巴斯穆斯
      tts:
        delivery: 朴实谨慎，面对儿子时带着无奈
        timbre: 粗厚沉稳
        pace: 平稳
        pitch: 中低音
    hans:
      display_name: 汉斯
      tts:
        delivery: 爽直笃定，说话不紧不慢，透着惊人的自信
        timbre: 洪亮结实
        pace: 从容
        pitch: 中低音
    squire:
      display_name: 庄园主
      tts:
        delivery: 外强中干，越到后来越显得心虚慌张
        timbre: 清楚偏薄
        pace: 稍快
        pitch: 中音
    worker_1:
      display_name: 长工甲
      tts:
        delivery: 说话随大伙起哄，遇事立刻退缩
        timbre: 粗实
        pace: 稍快
        pitch: 中音
    worker_2:
      display_name: 长工乙
      tts:
        delivery: 语气直白，胆子不大
        timbre: 清亮
        pace: 稍快
        pitch: 中音
    squire_wife:
      display_name: 庄园主太太
      tts:
        delivery: 精明冷硬，出主意时毫不迟疑
        timbre: 干脆清晰
        pace: 平稳
        pitch: 中高音
    steward:
      display_name: 管家
      tts:
        delivery: 自以为足智多谋，语气阴沉笃定
        timbre: 低沉干涩
        pace: 稍慢
        pitch: 低音
    old_eric:
      display_name: 老埃里克
      tts:
        delivery: 凶狠粗暴，吃了苦头后惊惧求饶
        timbre: 沙哑浑厚
        pace: 起伏强烈
        pitch: 低音
    rider:
      display_name: 骑马人
      tts:
        delivery: 冷淡简短，一心赶路
        timbre: 平直清楚
        pace: 稍快
        pitch: 中音
    demon_1:
      display_name: 小恶魔甲
      tts:
        delivery: 凶躁尖刻，挨打后惊慌失措
        timbre: 尖细沙哑
        pace: 快
        pitch: 高音
    demon_2:
      display_name: 小恶魔乙
      tts:
        delivery: 色厉内荏，叫喊声急促刺耳
        timbre: 干涩尖亮
        pace: 快
        pitch: 高音
  chapters:
    - id: ch01
      title: 从海上来的儿子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一座村庄里住着铁匠巴斯穆斯。他年轻、英俊，又有一身力气，可家里孩子多，打铁挣的钱少，日子过得很穷。他倒十分勤快。铁匠铺没有活儿时，他就出海打鱼，或者沿着海岸捡拾沉船冲来的东西。
        - id: ch01-b02
          speaker: narrator
          text: 有一天天气晴好，他独自划着小船出海。当天没有回来，第二天也没回来，村里人都以为他已经葬身大海。谁知第三天，巴斯穆斯平安上了岸，船里装满又大又肥的鱼，谁也没见过那样的鱼。他不饿也不渴，只说自己遇上浓雾，找不到陆地了。
        - id: ch01-b03
          speaker: narrator
          text: 他没有说出真正的去处。六年以后，人们才知道，他曾在深海里被一位美人鱼捉住，失踪的三天一直是她的客人。从那以后，他再也不出海捕鱼。其实也没有这个必要。每次走到海边，总会有沉船残骸被海浪冲上岸，里面还装着各式各样的贵重物品。那时候，谁捡到东西，只要得到准许，就能归自己所有。铁匠的家境也就一天比一天富裕。
        - id: ch01-b04
          speaker: narrator
          text: 那次出海过去七年，一天早晨，巴斯穆斯正在铺子里修犁。一个俊秀的少年走进来，开口便叫他父亲。
        - id: ch01-b05
          speaker: hans
          text: 您好，父亲。我的母亲美人鱼向您问好。她已经养了我六年，现在让我到您这里，也请您养我六年。
        - id: ch01-b06
          speaker: narrator
          text: 少年明明只有六岁，看上去却足有十八岁，甚至比寻常十八岁的青年还高大强壮。
        - id: ch01-b07
          speaker: basmus
          text: 你要不要先吃块面包？
        - id: ch01-b08
          speaker: hans
          text: 好啊。
        - id: ch01-b09
          speaker: narrator
          text: 少年名叫汉斯。铁匠叫妻子切了一块面包给他，他一口吞下，又回到铺子里。
        - id: ch01-b10
          speaker: basmus
          text: 这下吃饱了吗？
        - id: ch01-b11
          speaker: hans
          text: 没有，那才一小口。
        - id: ch01-b12
          speaker: narrator
          text: 铁匠拿来一整条面包，切成两大片，中间夹满黄油和奶酪。汉斯吃完，没多久又来找父亲。
        - id: ch01-b13
          speaker: basmus
          text: 这一回总该够了吧？
        - id: ch01-b14
          speaker: hans
          text: 还差得远。我得找个更好的地方。留在这里，我恐怕永远也填不饱肚子。
        - id: ch01-b15
          speaker: narrator
          text: 汉斯马上要走，只等父亲按他的要求打一根手杖。
        - id: ch01-b16
          speaker: hans
          text: 手杖得用铁做，还得真正经得住使。
        - id: ch01-b17
          speaker: narrator
          text: 铁匠先拿来普通手杖粗细的铁棍，汉斯往手指上一绕，铁棍便弯成了圈。父亲又拖来一根车辕那么粗的，汉斯在膝头一压，竟像麦秆一样折断了。最后，铁匠收集起家里所有的铁，由汉斯扶住，他亲手锻出一根比铁砧还重的手杖。
        - id: ch01-b18
          speaker: hans
          text: 多谢您，父亲。现在，我总算拿到自己的遗产了。
        - id: ch01-b19
          speaker: narrator
          text: 汉斯扛起铁杖，朝乡间走去。铁匠很庆幸儿子离开了。再住下去，只怕整个家都要被他吃空。
    - id: ch02
      title: 十二个人的饭与活
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 汉斯来到一座大庄园，正碰见庄园主站在农庄院外。
        - id: ch02-b02
          speaker: squire
          text: 你这是要去哪里？
        - id: ch02-b03
          speaker: hans
          text: 我在找活儿。最好需要有力气的人，也能让人痛痛快快地吃饱。
        - id: ch02-b04
          speaker: squire
          text: 往年这时候，我得雇二十四个人。今年才有十二个，多收下你一个正合适。
        - id: ch02-b05
          speaker: hans
          text: 那就说定了。十二个人的活，我一个人干得完。不过，他们十二个人吃多少，也得给我吃多少。
        - id: ch02-b06
          speaker: narrator
          text: 庄园主答应下来，把汉斯领进厨房，吩咐女仆给他十二个人的饭。他有自己的一口大锅，可以拿长柄勺随意舀着吃。
        - id: ch02-b07
          speaker: narrator
          text: 汉斯傍晚才到，那天只吃了一顿晚饭。他把满满一锅荞麦粥刮得干干净净，总算觉得能靠这一顿睡上一觉。于是，他上床睡得又香又久。第二天，别人早已起来干活，他还在呼呼大睡。庄园主也早早起身，一心想看看这个吃十二人饭、干十二人活的新长工有什么本事。
        - id: ch02-b08
          speaker: narrator
          text: 太阳升得老高，汉斯还是没有露面。庄园主只好亲自去叫他。
        - id: ch02-b09
          speaker: squire
          text: 汉斯，快起来！你这一觉睡得太久了。
        - id: ch02-b10
          speaker: hans
          text: 您说得对。我该起来吃早饭了。
        - id: ch02-b11
          speaker: narrator
          text: 汉斯穿好衣服，走进厨房，吞下整锅粥，然后问自己该干什么。庄园主叫他去打谷。谷仓里一共有十二块打谷场。十二个长工已经两人一组，在其中六块场地上忙碌。余下六块场地上的谷物，全归汉斯一个人。
        - id: ch02-b12
          speaker: narrator
          text: 汉斯走进谷仓，拿起一把连枷，先看了看别人怎样挥动，然后照着他们的样子打下去。谁知第一下，连枷就碎成了几段。墙上还挂着好几把，他一把接一把地试，可每一把都在第一下木屑四飞。汉斯只好四处寻找别的家伙。他看见附近放着两根结实的大梁，又发现谷仓门上钉着一张马皮，便用马皮把大梁牢牢绑成一把巨大的连枷。一根当柄，一根拍打，这才真正合手。
        - id: ch02-b13
          speaker: narrator
          text: 可谷仓太矮，连枷没有地方抡，打谷场也太小。汉斯很快有了办法。他索性把整座谷仓的屋顶抬起来，搁到旁边的田里。随后，他把凡是能找到的谷物全倒在地上，抡起大连枷打了起来。这一堆打完又换下一堆，抓到什么便打什么。不到中午，庄园主所有的谷子，无论黑麦、小麦、大麦还是燕麦，全都打完了，当然也全都混在了一起。
        - id: ch02-b14
          speaker: narrator
          text: 活儿一完，汉斯又抬起屋顶，把它安回谷仓，就像给一只箱子盖上盖子。接着，他走进去告诉庄园主，打谷的工作已经完成。庄园主听得瞪大眼睛，赶紧出来察看。事情果然是真的，可各处收来的粮食混成一堆，他实在高兴不起来。不过，他看见汉斯用的那把连枷，又听说汉斯为了挥动它，竟把屋顶整个搬走，心里怕极了。一句责怪的话也不敢说，只好承认谷子打完当然很好，不过还得扬干净。
        - id: ch02-b15
          speaker: hans
          text: 扬净是什么意思？
        - id: ch02-b16
          speaker: narrator
          text: 别人告诉他，扬谷就是把谷粒和谷壳分开。眼下两样东西仍混在一起，堆得几乎一直顶到屋顶。汉斯先抓起一点，放在手里筛了筛，很快便看出，这样干永远也干不完。他又想出一个办法，把谷仓前后的两扇门全都打开，自己趴在一头，用力吹了一口气。所有谷壳顿时飞出去，在谷仓另一头堆得像一道沙洲，留在原地的谷粒干净得不能再干净。
        - id: ch02-b17
          speaker: narrator
          text: 庄园主只好说，这件活也做得很好，今天不用再干别的。汉斯走进厨房吃了个饱，又睡起午觉，一觉睡到晚饭时分。
        - id: ch02-b18
          speaker: narrator
          text: 庄园主却愁坏了。他告诉妻子，自己连解雇汉斯都不敢，请她想个办法。妻子叫来管家，三个人定下一条毒计。第二天，所有人都去森林砍柴，并且约好，谁最后拉着木头回家，谁就上绞架。他们认定汉斯一定睡过头。
        - id: ch02-b19
          speakers: [worker_1, worker_2]
          ensemble: duo
          text: 明天路远，活儿又重。咱们来找点乐子吧，谁最后把一车木头拉回来，谁就得上绞架。
        - id: ch02-b20
          speaker: narrator
          text: 汉斯没有反对。第二天天还没亮，十二个长工便挑走最好的马和车，赶往森林。汉斯仍躺着熟睡。
        - id: ch02-b21
          speaker: squire
          text: 别叫他，就让他继续睡。
    - id: ch03
      title: 森林与水井里的圈套
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 汉斯终于觉得该吃早饭了，这才起床穿衣。他不慌不忙地吃了个饱，然后出去准备马车。好用的东西早被别人拿光了。他找了半天，才凑齐四只大小不一的车轮，装到一辆破旧的大车上。马也只剩两匹衰老的驽马。他连森林在哪里都不知道，只好沿着其他马车留下的车辙前进，好在这样也顺利找到了地方。
        - id: ch03-b02
          speaker: narrator
          text: 经过通往森林的大门时，他不小心把门撞得粉碎。为了堵住缺口，他从田里搬来一块巨石。这块石头足足长七厄尔，宽也有七厄尔。放好石头，他才继续赶路，同其他人会合。那些人从天亮起便拼命干活，还互相帮着伐树、装车。这时，除了最后一辆车，其余的都已经装满。大家看见汉斯带来的破车老马，笑得十分痛快。
        - id: ch03-b03
          speaker: narrator
          text: 汉斯拿起樵夫的斧头，准备砍树。第一下，斧刃便卷了，斧柄也断了。他干脆放下斧头，伸开双臂抱紧树干，把一棵大树连根拔起，扔到自己的车上。接着又拔一棵，再拔一棵，就这样不停地拔下去。其他长工全忘了手里的活，只管张着嘴，呆看这套稀奇的伐木办法。忽然，他们醒过神来，赶快装满最后一辆车，挥鞭催马，都想第一个回到庄园。
        - id: ch03-b04
          speaker: narrator
          text: 汉斯干完自己的活，把两匹老马重新套上大车。可是它们用尽力气，车子还是纹丝不动。汉斯有些恼火，又把马卸下来。他用一条绳子捆牢大车和车上所有的树，将整副家当一把扛到背上，迈步往家走，两匹老马则由他牵着缰绳跟在身后。到了森林门口，只见十二辆车排成一长列，全堵在那块巨石前，谁也没法通过。
        - id: ch03-b05
          speaker: hans
          text: 怎么，十二个人还搬不动这一块石头？
        - id: ch03-b06
          speaker: narrator
          text: 他举起巨石，随手扔到一旁，又背着木头和大车继续走，两匹马仍在身后跟着。他远远赶在所有人前面，第一个回到农庄。庄园主正在院里来回走动，不住朝远处张望，急着知道森林里究竟出了什么事。等他看清汉斯竟这样走回来，顿时吓得不知如何是好，只能关紧院门，匆匆插上门闩。
        - id: ch03-b07
          speaker: narrator
          text: 汉斯到了门前，先放下木头，砰砰敲了半天，始终没人来开门。他只好再次举起树木，越过谷仓，一股脑儿扔进院里。接着，大车也被扔了进去，四只车轮顿时各自飞向一个方向。庄园主看见这一幕，心想要是再不开门，那两匹马一定也会这样飞进来，只得赶快拔掉门闩。
        - id: ch03-b08
          speaker: hans
          text: 主人，您好。
        - id: ch03-b09
          speaker: narrator
          text: 汉斯把马牵进马厩，便去厨房找吃的。其他人过了很久才到家。
        - id: ch03-b10
          speaker: hans
          text: 昨晚的约定，你们还记得吧？现在该轮到谁上绞架了？
        - id: ch03-b11
          speakers: [worker_1, worker_2]
          ensemble: duo
          text: 那只是闹着玩的，根本不算数！
        - id: ch03-b12
          speaker: hans
          text: 好吧，那也没关系。
        - id: ch03-b13
          speaker: narrator
          text: 这件事就此算了。可是庄园主、庄园主太太和管家又聚在一起商量。他们招来的这个人实在可怕，无论如何也得设法除掉。管家自信地说，这件事由他来办。第二天正要清理水井，他们可以让汉斯下到井底，再准备一块大磨盘，从上面砸下去。这样准能解决他。最后只要填平水井，连替他办葬礼的钱都省了。庄园主夫妇觉得这主意妙极了，一想到终于能摆脱汉斯，便满心欢喜。
        - id: ch03-b14
          speaker: narrator
          text: 可汉斯并没有那么容易被杀死。第二天，他照常睡到很晚，庄园主又来叫他。
        - id: ch03-b15
          speaker: squire
          text: 快起来，汉斯。你睡得实在太久了！
        - id: ch03-b16
          speaker: hans
          text: 的确如此。我这就起来吃早饭。
        - id: ch03-b17
          speaker: narrator
          text: 汉斯吃光等候他的早饭，听说今天要和其他人一起清井，便走到井边。
        - id: ch03-b18
          speaker: hans
          text: 两样活随你们挑。要么你们下井装桶，我在上面往上拉。要么你们留在这里拉桶，我一个人下到井底。
        - id: ch03-b19
          speaker: worker_1
          text: 我们还是留在上面吧。井下也容不下这么多人。
        - id: ch03-b20
          speaker: narrator
          text: 汉斯便独自下到井底，动手清理起来。留在上面的长工早已商量好该怎样下手。他们立刻各自从一堆巨大石块中搬起一块，对准汉斯头顶砸了下去，以为这一阵石头准能取走他的性命。
        - id: ch03-b21
          speaker: hans
          text: 快把井边的母鸡赶开！它们把碎石子全刨到我头上了。
        - id: ch03-b22
          speaker: narrator
          text: 众人这才知道，那些小石头根本杀不了汉斯。好在他们还留着一块大的。十二个人一齐动手，借助木杠和滚木，费尽力气才把大磨盘推到井边。他们又好不容易把它砸下去，认定汉斯这回一定吃够了苦头。偏偏磨盘落下的位置巧得不能再巧。汉斯的头正好穿过中央的圆孔，那块石头便像牧师的硬领一样套在他脖子上。
        - id: ch03-b23
          speaker: narrator
          text: 这一下，汉斯再也不肯留在井底。他就这样把沉重的磨盘套在脖子上，若无其事地爬出水井，径直去找庄园主评理，说其他长工存心拿他取笑。
        - id: ch03-b24
          speaker: hans
          text: 那些人非要拿我取笑。他们想让我当牧师，可我读的书太少，哪里当得了？
        - id: ch03-b25
          speaker: narrator
          text: 他说着低下头，把磨盘抖落下来，正砸烂庄园主的一只大脚趾。庄园主一瘸一拐地进屋，又把管家叫来。这回，管家说可以派汉斯去魔鬼沼湖。夜里到了那里，谁也逃不过老埃里克。
        - id: ch03-b26
          speaker: steward
          text: 办法还有的是。今晚让他去魔鬼沼湖捕鱼。老埃里克绝不会让他活着回来。
        - id: ch03-b27
          speaker: narrator
          text: 庄园主夫妇连声赞好。庄园主又跛着脚去找汉斯，说自己会惩罚那些捉弄他的长工，还会另外给他一件小活，让他离那群无赖远远的。
        - id: ch03-b28
          speaker: squire
          text: 今晚，你去湖上捕鱼。明天一整天都不用再做事。
        - id: ch03-b29
          speaker: hans
          text: 这个安排不错。不过我得带上一炉面包、一桶黄油、一大桶麦酒和一小桶白兰地。再少就不够了。
    - id: ch04
      title: 魔鬼沼湖的夜晚
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 庄园主说，这些东西很容易备齐。汉斯把一炉面包、一桶黄油、一大桶麦酒和一小桶白兰地牢牢捆成一团，挂在那根结实的铁手杖上，扛到肩头，大步走向魔鬼沼湖。到了那里，他上船划到湖心，把捕鱼用的一切准备妥当。天色已经很晚，他想，还是先吃点东西，再动手捕鱼。
        - id: ch04-b02
          speaker: narrator
          text: 汉斯正吃得起劲，老埃里克忽然从湖里冒出来，一把揪住他的后颈，把他从小船里提了出去，一直拖向湖底。幸好汉斯那天带着铁手杖。老埃里克的利爪刚碰到他的脖子，他还来得及伸手抓住杖。所以等两人落到湖底，汉斯手里仍有那件称手的家伙。
        - id: ch04-b03
          speaker: hans
          text: 停一下，稍等。现在脚下是实地，可以好好说话了。
        - id: ch04-b04
          speaker: narrator
          text: 汉斯一手反扣老埃里克的后颈，一手挥动铁杖，朝他的背上不停捶打，直到把他打得像薄饼一样扁。老埃里克哀号起来，苦苦求汉斯放手，还发誓再也不回这座湖。
        - id: ch04-b05
          speaker: old_eric
          text: 饶了我吧！只要放我走，我以后再也不会回来！
          emotion: fearful
        - id: ch04-b06
          speaker: hans
          text: 那还不够。你得答应我，明天早晨以前，把湖里所有的鱼送到庄园主的院子里。答应了，我才放你。
        - id: ch04-b07
          speaker: narrator
          text: 老埃里克满口答应，只求汉斯赶快放了他。汉斯这才划回岸边，吃光剩下的食物，回去睡觉了。
        - id: ch04-b08
          speaker: narrator
          text: 第二天早晨，庄园主起床打开前门，鱼群便骨碌碌滚进门廊。整个院子都被塞得满满当当。他吓得马上缩回屋里，赶紧跑去找妻子，因为他自己向来想不出主意。看着院里这许多鱼，他已经明白，老埃里克又一次没能除掉汉斯。
        - id: ch04-b09
          speaker: squire
          text: 现在拿汉斯怎么办？老埃里克也没有抓走他。我看湖里的鱼全在这里了，整个院子都装不下！
        - id: ch04-b10
          speaker: squire_wife
          text: 这确实麻烦。你想办法把他派去炼狱，让他到那里讨贡钱。
        - id: ch04-b11
          speaker: narrator
          text: 庄园主只好去长工住处找汉斯。院子里挤满了鱼，他费了好大力气，才贴着墙，从屋檐底下慢慢挤过去。他先感谢汉斯捕了这么多鱼，又告诉他，眼下正有一件重要的差事。这件事不能交给别人，只有最可靠的仆人才办得成。
        - id: ch04-b12
          speaker: squire
          text: 请你到炼狱去一趟，替我讨回他们拖欠的三年贡钱。
        - id: ch04-b13
          speaker: hans
          text: 我愿意去。不过，哪一条路能通到炼狱？
        - id: ch04-b14
          speaker: narrator
          text: 庄园主答不上来，只好又进屋问妻子。
        - id: ch04-b15
          speaker: squire_wife
          text: 你怎么这样笨！就叫他一直往前，朝南穿过树林。不管他能不能找到炼狱，我们总算能甩掉他。
        - id: ch04-b16
          speaker: narrator
          text: 庄园主又回到汉斯面前。
        - id: ch04-b17
          speaker: squire
          text: 你一直往前走，朝南穿过树林，就能到了。
        - id: ch04-b18
          speaker: narrator
          text: 汉斯要了两炉面包、两桶黄油、两大桶麦酒和两小桶白兰地。他把食物捆好，挂在铁手杖上，大步朝南方走去。
    - id: ch05
      title: 到炼狱讨贡钱
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 穿过树林，眼前有好几条岔路，汉斯不知道该走哪条，便坐下打开食物。他把刀忘在家里了，幸好旁边有一张犁。他拆下犁刀，正好拿来切面包。这时，一个男人骑马经过。
        - id: ch05-b02
          speaker: hans
          text: 你是从哪里来的？
        - id: ch05-b03
          speaker: rider
          text: 我是从炼狱来的。
        - id: ch05-b04
          speaker: hans
          text: 那就停下来，等我一会儿。
        - id: ch05-b05
          speaker: narrator
          text: 那人急着赶路，不肯停。汉斯追上去抓住马尾，马被扯得后腿着地，前身扬起，骑马人则越过马头，飞进了沟里。
        - id: ch05-b06
          speaker: hans
          text: 你等一等，我也要去炼狱。正好，我们两个一起步行。
        - id: ch05-b07
          speaker: narrator
          text: 汉斯重新捆好食物，把它们放到马背上，又牵住缰绳。一路上，他把庄园主交代的差事告诉陌生人，也兴致勃勃地讲了自己怎样在湖底收拾老埃里克。那人没有多说什么，却非常熟悉道路。两人同行了没多久，便来到一座大门前。
        - id: ch05-b08
          speaker: narrator
          text: 一到门口，马和骑马人同时消失，只留下汉斯独自站在外面。他以为很快会有人出来，放他进去，可等了又等，始终没人来。他砰砰敲门，里面还是毫无动静。汉斯等得不耐烦，挥起铁手杖朝大门猛砸，一直把整扇门打得粉碎，这才闯了进去。
        - id: ch05-b09
          speaker: narrator
          text: 汉斯闯进门，一大群小恶魔迎面扑来，喝问他要干什么。
        - id: ch05-b10
          speaker: hans
          text: 我的主人向你们问好。他派我来收三年的贡钱。
        - id: ch05-b11
          speakers: [demon_1, demon_2]
          ensemble: duo
          text: 你敢闯进这里要钱？抓住他，把他拖走！
          emotion: angry
        - id: ch05-b12
          speaker: narrator
          text: 小恶魔们正要抓住汉斯，把他拖走，铁手杖已经一下接一下打了下来。他们只好松开汉斯，叫得比先前更响，捂着受伤的胳膊和腿，飞奔进去找老埃里克。老埃里克自从在湖里挨过那顿打，这时还躺在床上，没有恢复过来。
        - id: ch05-b13
          speakers: [demon_1, demon_2]
          ensemble: duo
          text: 魔鬼沼庄园主派人来收三年的贡钱！那人砸碎了大门，还用铁杖打伤了我们的胳膊和腿！
          emotion: fearful
        - id: ch05-b14
          speaker: old_eric
          text: 给他三年的，给他十年的都行！只要别让他走近我！
          emotion: fearful
        - id: ch05-b15
          speaker: narrator
          text: 于是，所有小恶魔一起动手，拖来多得吓人的金银。汉斯把金币和银币装满自己的大包袱，扛到脖子上，又沿着原路大步走回庄园。主人看见他不但活着回来，还带回了贡钱，吓得简直无法形容。
        - id: ch05-b16
          speaker: narrator
          text: 不过，汉斯也已经厌倦了替人做长工。他把从炼狱带回来的金银分成两半，留给庄园主一半。庄园主得了这么多钱，又终于可以送走汉斯，心里当然再高兴不过。
        - id: ch05-b17
          speaker: narrator
          text: 汉斯带着另一半金银，回到富勒比村，把这些钱交给做铁匠的父亲。可他并不打算重新留在父亲家里生活。
        - id: ch05-b18
          speaker: hans
          text: 父亲，再见。我已经厌倦在岸上和凡人生活。我还是回到母亲那里去吧。
        - id: ch05-b19
          speaker: narrator
          text: 汉斯向父亲道别后，便离开了富勒比村。从那以后，再也没有人见过美人鱼之子汉斯。
