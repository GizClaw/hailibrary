  chapters:
    - id: ch01
      title: A Calf Called Peter
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, in Denmark, a peasant and his wife lived on a very good farm. They prospered year after year and became rich, but they had no children. Often they grieved together because there was no child of their own to inherit all the wealth they had gathered. As their fortune grew, that sorrow remained.
        - id: ch01-b02
          speaker: narrator
          text: Then one year, a pretty little bull-calf was born on their farm. They named him Peter. He was the loveliest creature they had ever seen. He was clever enough to understand everything they said, and he was so gentle and playful that the couple grew as fond of him as if he were their own child.
        - id: ch01-b03
          speaker: peasant
          text: I wonder if our parish clerk could teach Peter to talk. If he could, we might adopt Peter as our son and leave him everything we own.
        - id: ch01-b04
          speaker: wife
          text: Well, I can't be sure. But our clerk is tremendously learned. He knows much more than his Paternoster, and Peter has a wonderfully good head too. You could at least ask him.
        - id: ch01-b05
          speaker: narrator
          text: So the peasant went to the clerk. He explained that they had a bull-calf they dearly wanted for their heir, and asked whether the clerk could teach it to speak.
        - id: ch01-b06
          speaker: narrator
          text: The clerk was no fool. He looked all around to make sure nobody could hear them before he answered.
        - id: ch01-b07
          speaker: clerk
          text: Oh, yes. I can teach him easily. But you must tell no one. This has to be done in complete secrecy, especially from the priest, because it is forbidden and I could get into trouble. It will cost you something as well. I shall need some very expensive books.
        - id: ch01-b08
          speaker: peasant
          text: The cost doesn't matter much to us. Here are a hundred dollars to buy the books. I won't tell anyone, and I'll bring Peter to you this evening.
        - id: ch01-b09
          speaker: narrator
          text: The peasant paid him then and there. That evening, he brought the calf over, and the clerk promised to do his very best with Peter.
    - id: ch02
      title: Peter's Lessons
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: A week later, the peasant returned to hear how Peter was doing and to see whether the calf was thriving. But the clerk would not let him have so much as a glimpse of Peter.
        - id: ch02-b02
          speaker: clerk
          text: If Peter sees you, he'll long to go home. Then he'll forget everything he has learned. His lessons are going well, but we need more books, so I must have another hundred dollars.
        - id: ch02-b03
          speaker: narrator
          text: The peasant had brought the money with him. He handed it over and went home full of hope that Peter's lessons would succeed.
        - id: ch02-b04
          speaker: narrator
          text: After another week, he came back to ask how far Peter had advanced.
        - id: ch02-b05
          speaker: clerk
          text: He's making excellent progress.
        - id: ch02-b06
          speaker: peasant
          text: But I suppose he still can't say anything?
        - id: ch02-b07
          speaker: clerk
          text: Oh, he can. He can say “Moo” now.
        - id: ch02-b08
          speaker: peasant
          text: Do you think he'll keep making progress with his lessons?
        - id: ch02-b09
          speaker: clerk
          text: Certainly. But I'll need another hundred dollars for books. Peter can't learn properly from the books he has now.
        - id: ch02-b10
          speaker: peasant
          text: Well, if the money must be spent, then it must be spent.
        - id: ch02-b11
          speaker: narrator
          text: He paid a third hundred dollars for books. He also sent a cask of fine old ale for Peter. The clerk drank the ale himself and gave the calf milk, which he thought would suit it better.
        - id: ch02-b12
          speaker: narrator
          text: Several weeks went by without another visit from the peasant. He had begun to squirm at losing so much money, and he feared that one more visit would cost him yet another hundred dollars.
        - id: ch02-b13
          speaker: narrator
          text: Meanwhile, the clerk saw that the calf had grown as fat as it ever would. He killed it and got all the beef out of sight. Then he put on his black clothes and set off for the peasant's farm.
    - id: ch03
      title: Peter Disappears
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: As soon as the clerk had said good day, he asked a question.
        - id: ch03-b02
          speaker: clerk
          text: Has Peter come home?
        - id: ch03-b03
          speaker: peasant
          text: No, he certainly hasn't. Surely he hasn't run away?
          emotion: surprised
        - id: ch03-b04
          speaker: clerk
          text: I hope he wouldn't behave so disgracefully after all my trouble teaching him and all the money I've spent on him. I had to use at least a hundred dollars of my own to buy books before he learned enough.
        - id: ch03-b05
          speaker: clerk
          text: By now he could say anything he pleased. Today he told me that he longed to see his parents again, so of course I wanted to give him that pleasure. I worried that he couldn't find the way alone, and I got ready to come with him.
        - id: ch03-b06
          speaker: clerk
          text: But once we were outside, I remembered my stick. I went back into the house to fetch it, and when I came out, Peter had gone off by himself. I thought he must be here. If he isn't, I have no idea where he could be.
        - id: ch03-b07
          speaker: narrator
          text: The peasant and his wife began to grieve bitterly. Peter had fled just when they expected to have such joy in him, after they had spent so much on his education. They had waited for him to come home speaking like a son. Worst of all, they had no heir after all.
        - id: ch03-b08
          speaker: narrator
          text: The clerk comforted them as well as he could. He claimed that he too was deeply troubled. After all his work, Peter should have brought him honor as a teacher, but instead the calf had behaved shamefully. Still, the clerk suggested that Peter might simply have lost his way.
        - id: ch03-b09
          speaker: clerk
          text: Next Sunday, I'll announce his disappearance at church. Then we can find out whether anyone has seen him.
        - id: ch03-b10
          speaker: narrator
          text: The clerk said goodbye and went home. There, he dined on a fine roast of fat veal.
        - id: ch03-b11
          speaker: narrator
          text: Now, the clerk received a newspaper. One day he read about a new merchant who had settled in a town some distance away. The merchant's name was Peter Bull.
        - id: ch03-b12
          speaker: narrator
          text: The clerk put the newspaper in his pocket and hurried to the sorrowing couple. He read the notice aloud to them.
        - id: ch03-b13
          speaker: clerk
          text: Do you suppose this could be your bull-calf Peter?
        - id: ch03-b14
          speaker: peasant
          text: Of course it is! Who else could it be?
        - id: ch03-b15
          speaker: wife
          text: You must set out and see him, good man. I'm perfectly certain it's our Peter. Take plenty of money too. Now that he's a merchant, who knows when he might need some cash?
    - id: ch04
      title: The Merchant Named Peter Bull
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next day, the peasant started for the town where the new merchant lived. He carried a bag of money on his back, a sandwich in his pocket, and his pipe in his mouth.
        - id: ch04-b02
          speaker: narrator
          text: The journey was long, and he traveled for many days. At last, just at daybreak one morning, he reached the town. He found the right house and asked whether the merchant was at home.
        - id: ch04-b03
          speaker: house_servant
          text: Yes, sir, but he hasn't risen yet.
        - id: ch04-b04
          speaker: peasant
          text: That doesn't matter. I'm his father. Just take me up to his bedroom.
        - id: ch04-b05
          speaker: narrator
          text: Someone showed him upstairs. The moment he entered the bedroom and saw the merchant, he was sure he recognized him. Peter Bull had the same broad forehead, the same thick neck, and the same red hair. In every other way, though, he now looked like a human being.
        - id: ch04-b06
          speaker: narrator
          text: The peasant rushed to the bed and seized the merchant firmly.
        - id: ch04-b07
          speaker: peasant
          text: Oh, Peter, how you have grieved your mother and me! You ran away just when we had finished giving you such a good education. Get up now. Let me have a proper look at you, and then we can talk.
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: The merchant thought a madman had broken into his room. He decided that the safest thing was to remain quiet.
        - id: ch04-b09
          speaker: merchant
          text: All right. I'll get up at once.
        - id: ch04-b10
          speaker: narrator
          text: He climbed out of bed and dressed as quickly as he could.
        - id: ch04-b11
          speaker: peasant
          text: Ah, now I see how clever our clerk is! He has done wonderfully well with you. You look exactly like a human being. No one would ever guess that you came to us from the red cow. Will you come home with me now?
        - id: ch04-b12
          speaker: merchant
          text: No, I can't spare the time just now. I have a large business to manage.
        - id: ch04-b13
          speaker: peasant
          text: You could take over the farm immediately, and we old people would retire. Still, if you prefer to remain a merchant, you may. Is there anything you need?
        - id: ch04-b14
          speaker: merchant
          text: Oh, yes. What I need most is money. A merchant can always put money to use.
        - id: ch04-b15
          speaker: peasant
          text: I can easily believe that. You had nothing at all when you began. That's exactly why I brought this money with me.
        - id: ch04-b16
          speaker: narrator
          text: He emptied the bag onto the table until bright dollars covered its whole surface.
    - id: ch05
      title: A Son and Heir
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Once the merchant understood what sort of man stood before him, he began speaking very pleasantly. He invited the peasant to stay for several days so that they could talk longer.
        - id: ch05-b02
          speaker: peasant
          text: Very well. But you must call me “Father.”
        - id: ch05-b03
          speaker: merchant
          text: My father and mother are both dead.
        - id: ch05-b04
          speaker: peasant
          text: I know they are. Your real father was sold in Hamburg last Michaelmas, and your real mother died while calving this spring. But my wife and I adopted you as our own. You're our only heir, so you must call me “Father.”
        - id: ch05-b05
          speaker: narrator
          text: Peter Bull was quite willing to call him Father. They settled that the merchant would keep the bag of money. Before the peasant went home to his wife, he also made a will leaving Peter everything he owned.
        - id: ch05-b06
          speaker: narrator
          text: When the peasant returned to his wife, he told her the whole story. She was delighted. Now she knew that the merchant Peter Bull truly was their own bull-calf.
        - id: ch05-b07
          speaker: wife
          text: Go and tell the clerk at once. You must repay the hundred dollars he spent on our son. He has earned that and more after giving us the joy of having such a son and heir.
          emotion: happy
        - id: ch05-b08
          speaker: narrator
          text: Her husband agreed. He thanked the clerk for everything he had done and gave him two hundred dollars.
        - id: ch05-b09
          speaker: narrator
          text: Then the peasant sold the farm. He and his wife moved to the town where their dear son and heir lived, and they gave Peter Bull all their wealth.
        - id: ch05-b10
          speaker: narrator
          text: They lived with him until the end of their days.
