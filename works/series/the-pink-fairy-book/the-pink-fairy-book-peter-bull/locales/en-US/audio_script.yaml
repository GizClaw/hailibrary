        delivery: earnest, trusting, and warmly affectionate
        timbre: sturdy and open
        pace: unhurried
        pitch: medium-low
    wife:
      display_name: Wife
      tts:
        delivery: practical, hopeful, and tenderhearted
        timbre: mature and warm
