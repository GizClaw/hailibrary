audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    farmer:
      display_name: 农夫
      tts:
        delivery: 朴实热心，深信不疑时透着憨厚
        timbre: 粗厚温和
        pace: 平稳
        pitch: 中低音
    farmer_wife:
      display_name: 农夫妻子
      tts:
        delivery: 实在直爽，对家人与未来满怀热望
        timbre: 温暖清亮
        pace: 平稳
        pitch: 中音
    clerk:
      display_name: 执事
      tts:
        delivery: 圆滑镇定，编造谎话时一本正经
        timbre: 清楚偏薄
        pace: 从容
        pitch: 中音
    peter_bull:
      display_name: 彼得·布尔
      tts:
        delivery: 精明客气，察觉有利可图后格外亲热
        timbre: 成熟清晰
        pace: 平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 会说话的继承人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，丹麦有一对农夫夫妇。他们有一座很好的农场，日子越过越兴旺，成了有钱人，却一直没有孩子。两人常常彼此叹息，这么多家产，将来竟没有自己的骨肉继承。到头来，万贯家财还是没有主人。
        - id: ch01-b02
          speaker: narrator
          text: 有一年，他们养了一头漂亮的小公牛，给它取名彼得。这是他们见过的最可爱的小家伙。它不但漂亮，还聪明得出奇，别人说什么都听得懂，性情又格外温顺活泼。夫妻俩越看越喜欢，简直把它当成亲生孩子。
        - id: ch01-b03
          speaker: farmer
          text: 你说，咱们教区的执事能不能教彼得开口？要是能，我们就认它做儿子，把家产都留给它。
        - id: ch01-b04
          speaker: farmer_wife
          text: 这可难说。执事的学问大得很，会的远不止一篇《主祷文》。彼得脑瓜又好，你至少该去问问。
        - id: ch01-b05
          speaker: narrator
          text: 农夫果真去问执事，能不能教他家的小公牛说话，好让它继承家业。执事先看看四周，确定没人偷听，才压低声音答应下来。
        - id: ch01-b06
          speaker: clerk
          text: 这不难，但你绝不能说出去，尤其不能让牧师知道。教牛说话是不准许的，我会惹上麻烦。还有，得买几本很贵的书。
        - id: ch01-b07
          speaker: farmer
          text: 花多少钱都不打紧。我先给你一百块钱买书，晚上就把彼得送来，也保证不告诉任何人。
        - id: ch01-b08
          speaker: narrator
          text: 农夫当场交出一百块钱。到了晚上，他又亲自把小牛送到执事家。执事答应，一定会尽力教它。一个星期后，农夫回来探望，想看看小牛过得怎么样。执事却不准他见彼得，说彼得一见到他就会想家，连已经学会的东西也会忘掉。学业倒是很顺利，只是还得添置更多的书，所以又需要一百块钱。农夫身上正好带着钱，便交给执事，满怀希望地回家了。
        - id: ch01-b09
          speaker: narrator
          text: 又过一个星期，农夫再来打听进展。
        - id: ch01-b10
          speaker: clerk
          text: 彼得学得非常好。
        - id: ch01-b11
          speaker: farmer
          text: 不过，它还不会说什么吧？
        - id: ch01-b12
          speaker: clerk
          text: 怎么不会？它已经会说“哞”了。
        - id: ch01-b13
          speaker: farmer
          text: 那它还能接着学吗？
        - id: ch01-b14
          speaker: clerk
          text: 当然能。可我还得拿一百块钱买书。现有的书不适合彼得。
        - id: ch01-b15
          speaker: farmer
          text: 好吧，该花的钱总得花。
        - id: ch01-b16
          speaker: narrator
          text: 农夫把第三个一百块钱也交给执事买书，还特意送来一桶上好的陈年麦酒，给彼得补补身子。执事却把麦酒留给自己喝，只给小牛喂奶，因为他觉得奶对小牛更合适。
    - id: ch02
      title: 彼得失踪了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 接连几个星期，农夫始终没来打听小牛的情形。他怕一登门，又得掏出一百块钱。送出去这么多钱，他毕竟已经有些肉疼了。这期间，执事见小牛肥得不能再肥，便把它宰掉。等牛肉全都收拾妥当，他走进屋，郑重其事地换上一身黑衣服，这才动身去了农夫家。
        - id: ch02-b02
          speaker: clerk
          text: 日安。彼得已经回到这里了吗？
        - id: ch02-b03
          speaker: farmer
          text: 没有啊。难道它逃走了？
        - id: ch02-b04
          speaker: clerk
          text: 我费尽心血教它，还为买书自己贴了一百块钱，才让它想说什么都会说。今天，它说想念父母，要回来看看。我怕它迷路，本来要陪它走。可出了门，我想起手杖落在屋里，回去拿了一趟。再出来时，彼得已经独自走了。我以为它准会到家。现在它不在，我也不知道去了哪里。
        - id: ch02-b05
          speaker: narrator
          text: 夫妻俩伤心地哭了起来。他们花了那么多钱教彼得，眼看就要享到儿子的福气，彼得偏偏在这时候跑了。最糟的是，到头来他们还是没有继承人。执事尽力安慰两人，自己也装得十分难过，说眼看就要靠这位学生赢得体面，彼得却做出这种事来。也许它只是走错了路。下个星期日，他会在教堂里贴出寻人启事，打听有没有人见过它。随后，他向夫妇俩告辞，回家美美地吃了一顿肥嫩的小牛肉。
        - id: ch02-b06
          speaker: narrator
          text: 说来也巧，执事订了一份报纸。一天，他偶然读到一则消息，远处一座城里新来了一位商人，名字就叫彼得·布尔。他把报纸塞进口袋，去找那对失去继承人、仍在悲伤的夫妇，把那段消息原原本本念给他们听。
        - id: ch02-b07
          speaker: clerk
          text: 你们说，这会不会就是你家的小公牛彼得？
        - id: ch02-b08
          speaker: farmer
          text: 那当然是它，不然还能是谁？
        - id: ch02-b09
          speaker: farmer_wife
          text: 当家的，你一定得马上动身，亲自去看看他。我敢肯定，那个商人就是咱们的彼得。你还要多带些钱，他如今做了商人，谁知道是不是正缺一笔现钱呢！
    - id: ch03
      title: 城里的彼得·布尔
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天，农夫背上一袋钱，口袋装着一份夹心面包，嘴里叼着烟斗，上路了。那段路可不近。他一连走了许多天，才终于在一个清晨到达那座城，当时天刚蒙蒙亮。他打听到商人的住处，走上门去，问彼得在不在家。家里人告诉他，商人在家，只是还没起床。
        - id: ch03-b02
          speaker: farmer
          text: 没关系，我是他父亲。带我到他的卧房去。
        - id: ch03-b03
          speaker: narrator
          text: 有人把农夫领到卧房。他一进门，看见那位商人，马上就认出来了。彼得还是那样宽阔的额头，那样粗壮的脖子，还有同样的红头发，只是其余地方如今全都变得像人了。农夫径直冲到床前，一把牢牢抓住他。
        - id: ch03-b04
          speaker: farmer
          text: 哎呀，彼得！我们刚把你教出个样子，你就跑了，可把我和你母亲伤透了心。快起来，让我好好看看你，也同你说说话。
        - id: ch03-b05
          speaker: narrator
          text: 商人根本不认识这个闯进卧房的人，只当他是个疯子。眼下又被他牢牢抓着，商人觉得最好别去招惹他，先安安静静顺着他的话做。
        - id: ch03-b06
          speaker: peter_bull
          text: 好，我马上起来。
        - id: ch03-b07
          speaker: narrator
          text: 他立刻从床上下来，手忙脚乱地穿好衣服，让这个自称父亲的陌生人把自己看个清楚。
        - id: ch03-b08
          speaker: farmer
          text: 现在我才知道，咱们的执事真有本事！他把你教得太好了，你现在看起来和人一模一样。要不是早就知道，谁也猜不到你原来是我家红母牛生下来的。你现在愿意跟我一起回家吗？
        - id: ch03-b09
          speaker: peter_bull
          text: 现在不行，我抽不出时间，还有一大摊生意要照管。
        - id: ch03-b10
          speaker: farmer
          text: 你回去就能接手农场，我们两个老人也该歇歇了。不过，你想继续做生意也行。你眼下缺什么吗？
        - id: ch03-b11
          speaker: peter_bull
          text: 我最缺钱。做商人的，什么时候都用得上钱。
        - id: ch03-b12
          speaker: farmer
          text: 我完全相信。你起家的时候身无分文，我就是为这个送钱来的。
        - id: ch03-b13
          speaker: narrator
          text: 说着，农夫把袋子里的钱全倒在桌上，亮闪闪的钱币铺满了整张桌面。商人这才看明白，站在自己面前的究竟是个什么样的人。他马上换了一副亲热的口气，请农夫留下来多住几天，好让两人再好好聊一聊。
        - id: ch03-b14
          speaker: farmer
          text: 那好，不过你得管我叫“父亲”。
        - id: ch03-b15
          speaker: peter_bull
          text: 我的父母早就不在人世了。
        - id: ch03-b16
          speaker: farmer
          text: 我知道。你亲生父亲去年米迦勒节在汉堡被卖了，亲生母亲今年春天下小牛时也死了。可我和妻子已经认你做亲儿子。你是我们唯一的继承人，当然得叫我“父亲”。
    - id: ch04
      title: 一家团聚
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 彼得·布尔很愿意管农夫叫父亲。事情就这样说定了，桌上的钱归他留下。农夫还在回家以前立好遗嘱，把自己所有的财产全留给这个儿子。办妥一切，他才回到妻子身边，把这趟旅程从头到尾讲了一遍。
        - id: ch04-b02
          speaker: narrator
          text: 妻子听完丈夫的讲述，知道报纸上的消息果然不假。城里的商人彼得·布尔不是别人，正是他们自家的小公牛。她听了高兴极了。
        - id: ch04-b03
          speaker: farmer_wife
          text: 你得马上去把这个好消息告诉执事，再把他替咱们儿子买书时垫付的一百块钱还给他。他完全配得上这笔钱，再多给一些也是应该的。多亏他花心血教彼得，咱们才有了这么好的儿子和继承人，得到了这么大的欢喜！
        - id: ch04-b04
          speaker: narrator
          text: 农夫也觉得妻子说得有理。他去感谢执事为他们做的一切，还给了他两百块钱。随后，夫妻俩卖掉农场，搬到他们亲爱的儿子和继承人居住的城里，又把全部财产都交给彼得。他们从此同彼得生活在一起，直到去世的那一天。
