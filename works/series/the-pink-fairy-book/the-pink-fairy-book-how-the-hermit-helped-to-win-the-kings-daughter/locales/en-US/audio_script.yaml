  chapters:
    - id: ch01
      title: Three Brothers and Three Ships
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a very rich man lived with his three sons. When he knew that he was dying, he divided all his money and land equally among them. Not long after his death, the king sent a proclamation across the country. Whoever built a ship that could float on both land and sea would marry the king's daughter.
        - id: ch01-b02
          speaker: eldest_brother
          text: I think I'll spend some of my money on that ship. I would very much like the king for a father-in-law.
        - id: ch01-b03
          speaker: narrator
          text: The eldest brother summoned every shipbuilder in the land and ordered them to start at once. Trees came down, great preparations began, and the yard filled with activity. Within days, everyone knew what he was building and why. The young man spent most of each day at the yard. Crowds of old people gathered and pressed around its gates while he watched the work.
        - id: ch01-b04
          speaker: old_worker
          text: Please, master, give us work so we can earn our bread.
        - id: ch01-b05
          speaker: eldest_brother
          text: You're old and have no strength left. What use would you be? Go away!
        - id: ch01-b06
          speaker: narrator
          text: He drove them off with harsh words. Then some boys came to ask for work.
        - id: ch01-b07
          speaker: boy_worker
          text: Master, could you let us help too?
        - id: ch01-b08
          speaker: eldest_brother
          text: You weak little things? What good could you do? Be gone!
        - id: ch01-b09
          speaker: narrator
          text: He refused everyone who was not already a skilled workman. At last, a little old man with a long white beard knocked at the gate.
        - id: ch01-b10
          speaker: hermit
          text: Will you give me some work, so I may earn my bread?
        - id: ch01-b11
          speaker: narrator
          text: The eldest brother drove him away like all the others. The ship took a long time to finish and swallowed a great deal of money. At last, the day came to launch it. Just then, a sudden squall rose and broke the vessel to pieces. The young man's hope of marrying the princess broke with it. By that time, he did not have a penny left. He returned to his two brothers and told them the whole unhappy tale.
        - id: ch01-b12
          speaker: second_brother
          text: He certainly handled that badly. I believe I can do better and win the princess myself.
        - id: ch01-b13
          speaker: narrator
          text: The second brother called all the country's shipbuilders and ordered another vessel that could cross land as well as sea. Yet his heart was no kinder than his brother's. He chased away every man who was not a skilled worker, and cruel words followed each one out. The white-bearded old man came last and received no better treatment. When this ship was finished, its launch seemed to be going smoothly. Then a gale sprang up and dashed the vessel to pieces on the rocks. The second brother had spent his whole fortune on it. With everything swallowed up, he had to beg his youngest brother for shelter.
        - id: ch01-b14
          speaker: youngest_brother
          text: I don't have enough money to support all three of us. I had better try in my turn. If I win the princess, her fortune and mine will give us enough to live on.
        - id: ch01-b15
          speaker: narrator
          text: After hearing the story, the youngest brother gathered every shipbuilder in the kingdom and ordered a third ship. The old people came to the yard and asked him for work. Unlike his brothers, he answered them cheerfully.
        - id: ch01-b16
          speaker: youngest_brother
          text: Oh, yes. There is plenty of work for everyone.
        - id: ch01-b17
          speaker: narrator
          text: When the boys begged to help, he found useful tasks for them too. No one was sent away merely for being old, young, or unskilled. Then the little old man with the long white beard stood before him and prayed for a chance to earn his bread.
        - id: ch01-b18
          speaker: youngest_brother
          text: Oh, father, I couldn't make you labor. You shall oversee the work and look after everyone else.
        - id: ch01-b19
          speaker: narrator
          text: The old man was a holy hermit. When he saw the young man's kind heart, he decided to do everything he could to help him gain his wish.
    - id: ch02
      title: The Hermit's Strange Companions
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: In time, the ship was finished. The hermit came to his young friend with good news.
        - id: ch02-b02
          speaker: hermit
          text: Now you may claim the king's daughter. This ship will float over land as well as sea.
        - id: ch02-b03
          speaker: youngest_brother
          text: Oh, good father, please don't leave me! Stay beside me and lead me to the king.
        - id: ch02-b04
          speaker: hermit
          text: I will come if you promise me half of everything you receive.
        - id: ch02-b05
          speaker: youngest_brother
          text: Oh, if that is all, I can promise it easily!
        - id: ch02-b06
          speaker: narrator
          text: The promise was made, and the two set out together aboard the marvelous ship. It carried them onward over the country. After they had traveled some distance, they saw a man standing in the middle of a thick fog. He was gathering that fog and trying to stuff it into a sack.
        - id: ch02-b07
          speaker: youngest_brother
          text: Good father, what could that man be doing?
        - id: ch02-b08
          speaker: hermit
          text: Ask him.
        - id: ch02-b09
          speaker: youngest_brother
          text: What are you doing there, my fine fellow?
        - id: ch02-b10
          speaker: fog_man
          text: I'm putting the fog into my sack. That's my work.
        - id: ch02-b11
          speaker: hermit
          text: Ask him to travel with us.
        - id: ch02-b12
          speaker: fog_man
          text: Give me enough food and drink, and I'll gladly come.
        - id: ch02-b13
          speaker: narrator
          text: They welcomed him aboard and moved on.
        - id: ch02-b14
          speaker: youngest_brother
          text: Good father, first there were two of us. Now there are three!
        - id: ch02-b15
          speaker: narrator
          text: A little farther on, they met a man who had torn up half a forest. He was walking along with all those trees piled across his shoulders as if their enormous weight meant nothing.
        - id: ch02-b16
          speaker: youngest_brother
          text: Good father, look at that! Why would he pull up all those trees?
        - id: ch02-b17
          speaker: hermit
          text: Ask him why.
        - id: ch02-b18
          speaker: strong_man
          text: Why, I've only gathered a handful of brushwood.
        - id: ch02-b19
          speaker: hermit
          text: Invite him to come with us.
        - id: ch02-b20
          speaker: strong_man
          text: Willingly, if you give me all I want to eat and drink.
        - id: ch02-b21
          speaker: narrator
          text: The strong man climbed aboard.
        - id: ch02-b22
          speaker: youngest_brother
          text: Good father, first we were three. Now we are four.
        - id: ch02-b23
          speaker: narrator
          text: The ship traveled on again. Some miles later, they found a man bent over a stream and drinking without stopping. So much water had already disappeared that the stream was nearly dry.
        - id: ch02-b24
          speaker: youngest_brother
          text: Good father, just look at him! Have you ever seen anyone drink so much?
        - id: ch02-b25
          speaker: hermit
          text: Ask him why he's doing it.
        - id: ch02-b26
          speaker: thirsty_man
          text: What's so strange about taking one mouthful of water?
        - id: ch02-b27
          speaker: hermit
          text: Ask him to join us.
        - id: ch02-b28
          speaker: thirsty_man
          text: With pleasure, if you give me enough food and drink.
        - id: ch02-b29
          speaker: narrator
          text: He joined them, and the ship went onward.
        - id: ch02-b30
          speaker: youngest_brother
          text: Good father, first we were four. Now we are five.
    - id: ch03
      title: The Marksman and the Walker
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Not much farther along, they noticed another man planted in the middle of a stream. He had his bow ready and was shooting down into the water beneath him.
        - id: ch03-b02
          speaker: youngest_brother
          text: Good father, what can he be aiming at?
        - id: ch03-b03
          speaker: hermit
          text: Ask him.
        - id: ch03-b04
          speaker: marksman
          text: Hush! Now you've scared it away. A quail is sitting in a tree in the Underworld, and I meant to shoot it. That's my work. Whatever I aim at, I hit.
        - id: ch03-b05
          speaker: hermit
          text: Ask him to travel with us.
        - id: ch03-b06
          speaker: marksman
          text: Gladly, as long as I have enough to eat and drink.
        - id: ch03-b07
          speaker: narrator
          text: They brought the marksman onto the ship.
        - id: ch03-b08
          speaker: youngest_brother
          text: Good father, first we were five. Now we are six.
        - id: ch03-b09
          speaker: narrator
          text: Soon they met a man striding toward them. His steps were so enormous that one foot stood at the north end of the island while the other reached the south.
        - id: ch03-b10
          speaker: youngest_brother
          text: Good father, look at him! What tremendous steps he takes!
        - id: ch03-b11
          speaker: hermit
          text: Ask him why he walks that way.
        - id: ch03-b12
          speaker: long_legged_man
          text: Oh, I'm only taking a little walk.
        - id: ch03-b13
          speaker: hermit
          text: Ask him to come with us.
        - id: ch03-b14
          speaker: long_legged_man
          text: Gladly, if you give me as much food and drink as I want.
        - id: ch03-b15
          speaker: narrator
          text: He stepped aboard, and once again the vessel set off.
        - id: ch03-b16
          speaker: youngest_brother
          text: Good father, first we were six. Now we are seven.
        - id: ch03-b17
          speaker: narrator
          text: The young man did not understand why they needed such strange companions, or what use each man might be. The hermit knew exactly what he was doing and why he had gathered every one of them onto the ship.
    - id: ch04
      title: A Letter to the Underworld
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After many days, they reached the town where the king and his daughter lived. The ship stopped directly before the palace. The young man went inside and bowed low.
        - id: ch04-b02
          speaker: youngest_brother
          text: Your Majesty, I have obeyed your command. Here is the ship that can travel over land and sea. Now give me my reward and let me marry your daughter.
        - id: ch04-b03
          speaker: narrator
          text: The king wondered how he could marry his daughter to a stranger. He did not even know whether the young man was rich or poor, a knight or a beggar. So he spoke aloud.
        - id: ch04-b04
          speaker: king
          text: Building the ship is not enough. Find a runner who can carry this letter to the ruler of the Underworld and bring back the answer within one hour.
        - id: ch04-b05
          speaker: youngest_brother
          text: That was not part of our agreement.
        - id: ch04-b06
          speaker: king
          text: Do as you please. But unless you do it, you will not have my daughter.
        - id: ch04-b07
          speaker: narrator
          text: Deeply troubled, the young man went out and told the hermit what had happened.
        - id: ch04-b08
          speaker: hermit
          text: Silly boy! Accept the king's terms at once. Send the long-legged man with the letter. He will cover the distance in no time.
        - id: ch04-b09
          speaker: narrator
          text: Joy leaped in the young man's heart. He hurried back to the king.
        - id: ch04-b10
          speaker: youngest_brother
          text: Your Majesty, I accept. Here is the messenger who will carry out your command.
        - id: ch04-b11
          speaker: narrator
          text: The king had no choice but to hand over the letter. The long-legged man strode away at once. With his tremendous steps, he made short work of the whole distance between the palace and the Underworld. He soon found its ruler and delivered the message.
        - id: ch04-b12
          speaker: underworld_ruler
          text: Wait here for a moment while I write the answer.
        - id: ch04-b13
          speaker: narrator
          text: But even that swift walk had tired the messenger. While the ruler wrote, he settled down to wait, fell sound asleep, and forgot all about his errand. Back at the palace, the young man anxiously counted every passing minute. He stood with his eyes fixed on the road where the messenger would have to appear. Still no one came, and the hour was almost gone.
        - id: ch04-b14
          speaker: youngest_brother
          text: What can be keeping him?
        - id: ch04-b15
          speaker: narrator
          text: The hermit called for the man who never missed his aim.
        - id: ch04-b16
          speaker: hermit
          text: Look and see why our messenger is taking so long.
        - id: ch04-b17
          speaker: marksman
          text: He is fast asleep in the palace of the Underworld. But I can wake him.
        - id: ch04-b18
          speaker: narrator
          text: The marksman drew his bow and sent an arrow straight into the sleeping man's knee. The messenger woke with a tremendous start. He saw at once that the hour had nearly run out. Snatching up the ruler's answer, he rushed back with all his speed. The palace clock had not yet struck when he came through the door.
    - id: ch05
      title: The Royal Cellar
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The young man thought the princess must surely be his now. But the king set another task.
        - id: ch05-b02
          speaker: king
          text: You still have not done enough. Before I give you my daughter, find a man who can drink half the contents of my cellar in one day.
        - id: ch05-b03
          speaker: youngest_brother
          text: That was not part of our agreement.
        - id: ch05-b04
          speaker: king
          text: Do as you please. You will not have my daughter unless it is done.
        - id: ch05-b05
          speaker: narrator
          text: The young man went sadly to the hermit and asked what he should do.
        - id: ch05-b06
          speaker: hermit
          text: Silly boy! Give the task to the man who drinks up everything.
        - id: ch05-b07
          speaker: narrator
          text: They called the thirsty man.
        - id: ch05-b08
          speaker: youngest_brother
          text: Can you drink half the king's cellar in a single day?
        - id: ch05-b09
          speaker: thirsty_man
          text: Dear me, yes! I can drink that and as much again as you like. I am never satisfied.
        - id: ch05-b10
          speaker: narrator
          text: The king was displeased that the young man had found someone and agreed so readily, but he could not take back his words. He ordered the thirsty man to be taken downstairs to the royal cellar. What a day the fellow had there! Hour after hour, he drank and drank and drank. By evening, he had emptied not half the cellar, but every last cask in it. Not one of them held a single drop. When the king saw what had happened, he turned to the young man.
        - id: ch05-b11
          speaker: king
          text: You have beaten me, and I can no longer keep my daughter from you. But her dowry will be only as much as one man can carry away.
        - id: ch05-b12
          speaker: youngest_brother
          text: Even the strongest man can carry no more than a hundredweight. What kind of dowry is that for a king's daughter?
        - id: ch05-b13
          speaker: king
          text: Do as you please. I have spoken, and the matter is yours now, not mine.
        - id: ch05-b14
          speaker: narrator
          text: The young man did not know how to answer. He would gladly have married the princess without a penny, but building the ship had cost him everything. He knew he could not provide all that she needed. Once more, he went to the hermit.
        - id: ch05-b15
          speaker: youngest_brother
          text: The king will give her only what one man can carry. I have no money left, and neither do my brothers.
        - id: ch05-b16
          speaker: hermit
          text: Silly boy! Fetch the man who carried half the forest on his shoulders.
    - id: ch06
      title: The Dowry and the King's Fleet
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Delighted, the young man called for the strong man and explained his task.
        - id: ch06-b02
          speaker: youngest_brother
          text: Carry everything you can. Load yourself until you bend double, and don't worry if the palace is left bare.
        - id: ch06-b03
          speaker: narrator
          text: The strong man promised, and he kept that promise splendidly. He took everything he could see and stacked it on his back. Up went the chairs and tables, then wardrobes and heavy chests filled with gold and silver. He kept piling until there was nothing else in sight to add. At last, he took the king's own crown and balanced it on top. Then he carried the towering burden to the ship and safely stored every treasure aboard.
        - id: ch06-b04
          speaker: narrator
          text: The young man followed, leading the king's daughter. Behind them, the king raged through his empty palace. He called his army together and prepared his warships. He meant to chase the little vessel and seize everything that had been carried away.
        - id: ch06-b05
          speaker: narrator
          text: The king's ships were very fast. Before long, they drew close behind the little vessel, and their sailors shouted with joy. The hermit looked back and saw how near they were.
        - id: ch06-b06
          speaker: hermit
          text: Do you see what is coming?
        - id: ch06-b07
          speaker: youngest_brother
          text: Ah, good father! It is a whole fleet chasing us. In a few moments, they will be upon us!
          emotion: fearful
        - id: ch06-b08
          speaker: narrator
          text: The hermit told him to summon the man with the sack of fog. As soon as the sack opened, the captured fog came pouring out. It spread across the water and hung thickly around all the king's ships. Their sailors could see nothing and could no longer follow the little vessel. The fleet turned back to the palace, where the men told the king what strange thing had stopped them. Meanwhile, the young man's ship continued on its way and reached home safely.
    - id: ch07
      title: The Promise Kept
      blocks:
        - id: ch07-b01
          speaker: hermit
          text: Well, you are home again. Now you can keep your promise and give me half of everything you received.
        - id: ch07-b02
          speaker: youngest_brother
          text: I will do it with all my heart.
        - id: ch07-b03
          speaker: narrator
          text: The young man began dividing the treasure. One share went to him, and an equal share went to his old friend. At last, every piece had been sorted.
        - id: ch07-b04
          speaker: youngest_brother
          text: Good father, it is done. There is nothing left for us to divide.
        - id: ch07-b05
          speaker: hermit
          text: Nothing left? Why, you have forgotten the best thing of all!
        - id: ch07-b06
          speaker: youngest_brother
          text: What could that be? We have divided everything.
        - id: ch07-b07
          speaker: hermit
          text: What about the king's daughter?
        - id: ch07-b08
          speaker: narrator
          text: The young man's heart stood still, for he loved her dearly. Yet he answered the hermit.
        - id: ch07-b09
          speaker: youngest_brother
          text: Very well. I gave my word, and I will keep it.
        - id: ch07-b10
          speaker: narrator
          text: He drew his sword to cut the princess in two. The hermit saw that the young man valued his honor even more than his wife. He raised one hand and cried out.
        - id: ch07-b11
          speaker: hermit
          text: Stop! She is yours, and so are all the treasures. I helped you because you showed pity to people in need. Whenever you are in need yourself, call for me, and I will come.
        - id: ch07-b12
          speaker: narrator
          text: The hermit gently touched their heads. Then he vanished.
