  chapters:
    - id: ch01
      title: The Turtle in the Net
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, an old couple lived by the coast and earned their living by fishing. Their only child was a son named Uraschimataro, which means “Son of the Island” in Japanese. He was their pride and joy. They worked hard for him from morning until night, yet never complained or felt weary of their life.
        - id: ch01-b02
          speaker: narrator
          text: Uraschimataro grew into a strong young man and a skillful fisherman. Wind and rough weather never stopped him. He sailed farther out than even the boldest fisherman in the village dared to go. The neighbors often shook their heads and warned his parents.
        - id: ch01-b03
          speaker: neighbor
          text: If your son keeps taking such risks, one day he will go too far. Then the waves will swallow him.
        - id: ch01-b04
          speaker: narrator
          text: Uraschimataro paid no attention to their warnings. He handled a boat so cleverly that his parents seldom worried about him.
        - id: ch01-b05
          speaker: narrator
          text: One bright, beautiful morning, he pulled his full nets into the boat. Among the fish lay a tiny turtle. Pleased with his catch, he dropped it into a wooden vessel to take home. All at once, the little creature spoke. It trembled as it begged him to spare its life.
        - id: ch01-b06
          speaker: turtle
          text: What good could I possibly do you? I am so small and young, and I want very much to live a little longer. Please be merciful and set me free. Someday I will find a way to thank you.
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: Uraschimataro had a kind heart, and he could never bear to refuse a plea. He lifted the turtle from the vessel and returned it to the sea.
    - id: ch02
      title: Beneath the Sea
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Years passed, and every morning Uraschimataro sailed into deep water. Then one day, as he headed toward a little bay between the rocks, a violent whirlwind rose around him. It smashed his boat apart and dragged the pieces beneath the waves. Uraschimataro nearly went down with them.
        - id: ch02-b02
          speaker: narrator
          text: He was a powerful swimmer, and he fought hard to reach land. Through the storm, he saw a large turtle swimming toward him. Above the howl of the wind, he heard her voice.
        - id: ch02-b03
          speaker: turtle
          text: I am the turtle whose life you saved long ago. Now I can repay my debt. The shore is still far away, and you cannot reach it without help. Climb onto my back, and I will carry you wherever you wish to go.
        - id: ch02-b04
          speaker: narrator
          text: Uraschimataro needed no second invitation. He was thankful for his friend's help and climbed onto her shell. As soon as he was sitting firmly, the turtle suggested a different journey. Instead of returning to shore at once, they could travel beneath the sea and see the wonders hidden there.
        - id: ch02-b05
          speaker: narrator
          text: Uraschimataro gladly agreed. A moment later, they were deep below the surface, with fathoms of blue water over their heads. They darted through the warm, quiet sea. The young man held tight and wondered where they were going, and how long the journey would last.
        - id: ch02-b06
          speaker: narrator
          text: For three days, they rushed onward. At last the turtle stopped before a splendid palace. Gold, silver, crystal, and precious stones shone on every side. Pale pink coral and glittering pearls adorned its walls. The beauty outside amazed Uraschimataro, but the hall within left him speechless. Blazing fish scales filled it with light.
        - id: ch02-b07
          speaker: uraschimataro
          text: Where have you brought me?
        - id: ch02-b08
          speaker: turtle
          text: This is Ringu, the palace of the sea god. Every creature here is his subject. I am the first waiting maid to his daughter, the lovely Princess Otohime. You will meet her very soon.
        - id: ch02-b09
          speaker: narrator
          text: So many wonders had befallen Uraschimataro that he could only wait in a daze. The turtle had told the princess so much about him that Otohime wished to see him. She hurried away to announce his arrival.
        - id: ch02-b10
          speaker: narrator
          text: The moment Princess Otohime saw Uraschimataro, she set her heart on him. She asked him to remain with her. If he stayed, she promised, he would never grow old, and his beauty would never fade. Smiling, she looked as fair as the sun itself.
        - id: ch02-b11
          speaker: otohime
          text: Is that not reward enough?
        - id: ch02-b12
          speaker: uraschimataro
          text: Yes, it is.
        - id: ch02-b13
          speaker: narrator
          text: And so Uraschimataro stayed in the palace beneath the sea. He did not yet know how long he would remain there.
    - id: ch03
      title: The Golden Box
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Life flowed happily past, and every hour seemed better than the one before. Then one day, Uraschimataro was seized by a terrible longing to see his parents. He tried hard to master it because he knew his wish would grieve the princess. But the longing grew until he became so sad that Otohime asked what troubled him.
        - id: ch03-b02
          speaker: uraschimataro
          text: I long to visit my old home. I must see my parents once more.
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: Horror seemed to freeze the princess. She begged him to stay, certain that something dreadful would happen if he left.
        - id: ch03-b04
          speaker: otohime
          text: You will never return. If you leave now, we will never see each other again.
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: Yet Uraschimataro would not change his mind.
        - id: ch03-b06
          speaker: uraschimataro
          text: I will leave you only this once. Then I will come back and stay beside you forever.
        - id: ch03-b07
          speaker: narrator
          text: Otohime shook her head sadly. At last she answered him, speaking very slowly.
        - id: ch03-b08
          speaker: otohime
          text: There is one way for you to return safely. But I am afraid you will never accept the condition.
        - id: ch03-b09
          speaker: uraschimataro
          text: I will do anything if it brings me back to you.
        - id: ch03-b10
          speaker: narrator
          text: He looked at her tenderly, but the princess said nothing. She knew too well that once he left, she would never see his face again. Then she took a tiny golden box from a shelf and placed it in his hands. She begged him to guard it carefully. Above everything else, he must never open it.
        - id: ch03-b11
          speaker: otohime
          text: If you obey me, your friend the turtle will meet you at the shore and carry you back to me.
        - id: ch03-b12
          speaker: narrator
          text: Uraschimataro thanked her with all his heart and solemnly promised to do as she asked. He hid the box safely inside his clothes and climbed onto the turtle's back. As they vanished along the ocean path, he waved farewell to the princess.
        - id: ch03-b13
          speaker: narrator
          text: For three days and three nights, the turtle carried him through the sea. At last they reached the beach before his old home. The turtle said goodbye, and in another moment she was gone.
    - id: ch04
      title: Three Hundred Years
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Uraschimataro hurried toward the village, his steps quick and joyful. Smoke curled through a roof. Green plants grew thickly from the thatch. Children shouted to one another, and the notes of a koto rang from a passing window. Everything seemed to welcome him home.
        - id: ch04-b02
          speaker: narrator
          text: Then a pain struck his heart as he walked down the street. Everything had changed. He knew none of the people, and none of the houses looked familiar. Soon he found his old home. The house still stood, but something about it felt strange.
        - id: ch04-b03
          speaker: narrator
          text: Anxiously, he knocked. A woman opened the door, and Uraschimataro asked for his parents.
        - id: ch04-b04
          speaker: village_woman
          text: I do not know those names. I cannot tell you anything about them.
        - id: ch04-b05
          speaker: narrator
          text: More troubled than ever, he ran to the burial ground. Surely that place would tell him what had happened. There he found his parents' grave. The date carved into the stone was almost the very date when they had lost their son, and he had left them for the Daughter of the Sea.
        - id: ch04-b06
          speaker: narrator
          text: Only then did Uraschimataro understand. Since he had left his home, three hundred years had passed.
        - id: ch04-b07
          speaker: narrator
          text: Horrified by what he had discovered, he shuddered and returned to the village street. He still hoped to find someone who could speak of the old days. But when a man answered him, Uraschimataro knew he was not dreaming, though he felt as if he had lost his senses.
    - id: ch05
      title: The Box Is Opened
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: In his despair, Uraschimataro remembered the princess's box. Perhaps this horror was not real. Perhaps an enchanter had placed him under a spell, and the charm that could break it lay in his hands.
        - id: ch05-b02
          speaker: narrator
          text: Almost without knowing what he did, he opened the box. Purple vapor poured from it. As he held the empty box, he watched his young hand shrivel into the hand of a very old man.
        - id: ch05-b03
          speaker: narrator
          text: He ran to the brook that flowed clear from the mountain and stared into the water. His reflection looked like the face of a mummy. The sight wounded him to the heart.
        - id: ch05-b04
          speaker: narrator
          text: He crept back through the village. No one knew that this ancient man was the strong, handsome youth who had run along the same street only an hour before. Step by weary step, he made his way back until he reached the shore.
        - id: ch05-b05
          speaker: narrator
          text: There Uraschimataro sat sadly on a rock and called again and again for the turtle. She never returned. Before long, death came and set him free.
        - id: ch05-b06
          speaker: narrator
          text: Before he died, the people who saw him sitting alone by the sea heard his story. Later, whenever their children grew restless, they told them about the good son who loved his parents so dearly that he gave up the splendor and wonders of the palace beneath the sea, and the most beautiful woman in the world, all for their sake.
