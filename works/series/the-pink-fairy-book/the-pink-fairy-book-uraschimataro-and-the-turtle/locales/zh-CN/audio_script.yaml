audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    urashimataro:
      display_name: 浦岛太郎
      tts:
        delivery: 真诚爽朗，遇到奇事时带着年轻人的惊叹
        timbre: 清朗有力
        pace: 中速
        pitch: 中音
    turtle:
      display_name: 海龟
      tts:
        delivery: 温和知礼，语气坚定可靠
        timbre: 柔润沉静
        pace: 从容
        pitch: 中音
    otohime:
      display_name: 乙姬公主
      tts:
        delivery: 高贵温柔，悲伤时克制而深切
        timbre: 清柔明亮
        pace: 舒缓
        pitch: 中高音
    woman:
      display_name: 村中妇人
      tts:
        delivery: 朴实直接，面对陌生人略带疑惑
        timbre: 自然清楚
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 海边的渔夫
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，海边住着一对善良的老夫妇，靠打鱼过日子。他们只有一个儿子，名叫浦岛太郎，意思是“岛之子”。这个孩子是他们最大的骄傲和欢喜。为了他，两位老人整天劳作也不觉得累，从不埋怨生活清苦。浦岛太郎长得高大健壮，又有一身驾船捕鱼的好本领。他不怕风，也不怕雨，常常驶到连村里最勇敢的水手都不敢去的远海。
        - id: ch01-b02
          speaker: narrator
          text: 邻居们总替他担心，常常摇着头提醒两位老人，说浦岛太郎再这样冒险，总有一次会碰不上好运，让海浪整个吞下去。浦岛太郎却不理会这些话。幸好他的船驾得实在高明，父母也很少为他忧虑。
        - id: ch01-b03
          speaker: narrator
          text: 一个晴朗明媚的早晨，他把装满渔获的网拖进船里，发现鱼群中有一只很小很小的海龟。浦岛太郎很喜欢这件意外的收获，把它放进一只木桶，准备带回家再作打算。谁知海龟忽然开口说话，浑身颤抖着求他饶命。
        - id: ch01-b04
          speaker: turtle
          text: 我这样幼小，对你能有什么用呢？我真想再多活些日子。请你发发慈悲，放我回海里吧。我一定会报答你的恩情。
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: 浦岛太郎心地厚道，又不忍拒绝这样的请求，便捧起海龟，送它回到海中。
    - id: ch02
      title: 海底的龙宫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 好些年过去，浦岛太郎每天早晨仍旧驾船出海。一天，他正驶向岩石间的小海湾，海上突然卷起狂风。船被打得粉碎，碎片也让巨浪吸进了水底。浦岛太郎险些遭到同样的命运。幸好他水性极好，只能拼尽力气朝岸边游。就在这时，一只大海龟迎着风浪游来。暴风呼啸，他却清楚地听见了它的声音。
        - id: ch02-b02
          speaker: turtle
          text: 我就是当年被你救过的海龟。今天让我来报恩吧。这里离陆地还远，你独自游不过去。快坐到我背上，你想去哪里，我就送你去哪里。
        - id: ch02-b03
          speaker: narrator
          text: 浦岛太郎自然不用海龟再请第二次，感激地爬上龟背。刚刚坐稳，海龟又提议，不如暂且别回岸上，先到海底看看藏在那里的奇观。浦岛太郎欣然答应。他们转眼潜入深处，头顶只剩下不知多少寻的蓝色海水。
        - id: ch02-b04
          speaker: narrator
          text: 海龟驮着他，在温暖安静的海里飞快穿行，速度快得叫人惊叹。浦岛太郎紧紧抓住龟背，一路猜想着他们究竟要去哪里，还得走上多久。他们就这样一刻不停地赶了整整三天，才在一座辉煌的宫殿前停下。宫殿上闪着金银、水晶和宝石的光，淡粉色的珊瑚枝与晶亮的珍珠点缀在各处。外面的美景已经叫浦岛太郎惊叹，可走进由灿烂鱼鳞照亮的大厅，他更是震撼得说不出话来。
        - id: ch02-b05
          speaker: urashimataro
          text: 这里究竟是什么地方？
          emotion: surprised
        - id: ch02-b06
          speaker: turtle
          text: 这里是龙宫，是海神的住所，我们都是他的臣民。我在海神的女儿乙姬公主身边做首席侍女。你很快就会见到美丽的公主了。
        - id: ch02-b07
          speaker: narrator
          text: 一路上的奇遇让浦岛太郎恍恍惚惚，只能等着看下一件事。海龟早向公主讲过他的许多事情，公主听了以后，也表示想见见他。海龟现在马上进去，禀报浦岛太郎已经到了。乙姬公主一见这个年轻人，便喜欢上了他。她请浦岛太郎留在自己身边，还许诺他永远不会衰老，俊美的容貌也永远不变。
        - id: ch02-b08
          speaker: otohime
          text: 这样的报答，还不够好吗？
        - id: ch02-b09
          speaker: narrator
          text: 公主微笑着，面容像太阳一样明亮。
        - id: ch02-b10
          speaker: urashimataro
          text: 当然够。我愿意留下来。
        - id: ch02-b11
          speaker: narrator
          text: 从此，浦岛太郎住进了龙宫。至于住了多久，他到后来才知道。
    - id: ch03
      title: 公主的金盒
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 日子一天天过去，浦岛太郎觉得每个时辰都比前一个更幸福。可有一天，他忽然非常想念父母。他明知公主会伤心，还是压不下这份思念。念头越来越强，最后让他整天愁眉不展。公主问他出了什么事，他只得说出心愿。
        - id: ch03-b02
          speaker: urashimataro
          text: 我实在太想念故乡了。无论如何，我都得回去，再见父母一面。
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: 公主听完，惊恐得几乎浑身冰冷。她苦苦请求浦岛太郎留下，因为只要他离开，可怕的事就一定会发生。
        - id: ch03-b04
          speaker: otohime
          text: 你这一走，就再也回不来了。我们也永远不会重逢。
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: 浦岛太郎的心意却没有动摇。
        - id: ch03-b06
          speaker: urashimataro
          text: 我只离开这一次。等我回来，就永远陪在你身旁。
        - id: ch03-b07
          speaker: otohime
          text: 倒是有一个办法，可以让你平安回来。可那个条件，只怕你不会答应。
          emotion: sad
        - id: ch03-b08
          speaker: urashimataro
          text: 只要能回来见你，什么条件我都愿意答应。
        - id: ch03-b09
          speaker: narrator
          text: 浦岛太郎深情地望着公主。公主没有回答，因为她很清楚，他一旦离开，自己就再也见不到这张脸了。她从架子上取下一只小小的金盒，交到他手里。
        - id: ch03-b10
          speaker: otohime
          text: 一定要把它保管好，千万不能打开。只要你守住约定，海龟会在岸边等你，再把你送回我这里。
        - id: ch03-b11
          speaker: narrator
          text: 浦岛太郎从心底谢过公主，郑重发誓绝不违背她的叮嘱。他把金盒妥帖地藏进衣服，坐上海龟的背，一边挥手向公主告别，一边消失在海中的道路上。海龟驮着他，在海中游了三天三夜，终于来到故乡前面的海滩。它向浦岛太郎告别，眨眼间就不见了。
    - id: ch04
      title: 三百年以后
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 浦岛太郎脚步轻快，欢欢喜喜地走向村庄。屋顶升起袅袅炊烟，茅草上长满了茂密的绿叶。孩子们的叫喊声四处传来，路过窗边时，他还听见筝弦清脆地响了一声。所有东西都像在欢迎他回家。可走进街道以后，他的心忽然痛了一下。仔细一看，原来所有东西都变了。这里的人和房屋，没有一样是他从前熟悉的。
        - id: ch04-b02
          speaker: narrator
          text: 浦岛太郎很快找到老家的房子。房子虽然还在那里，模样却陌生得很。他心里越发不安，急忙敲开房门，向出来应门的女人打听年迈的父母。
        - id: ch04-b03
          speaker: woman
          text: 我从没听过这两个人的名字，也不知道他们去了哪里。
        - id: ch04-b04
          speaker: narrator
          text: 浦岛太郎更加慌乱，转身奔向墓地。他知道，只有那里还能给他答案，也只有墓碑能让他弄明白这一切。果然，他找到了父母的坟墓。碑上刻的日期，几乎正是两位老人失去儿子，而他为了海神之女离开他们的年月。直到这时他才明白，自己离家以后，人间已经过去了三百年。
        - id: ch04-b05
          speaker: narrator
          text: 这个发现让浦岛太郎恐惧得浑身发颤。他回到街上，盼着找到一个知道旧日往事的人。后来真有人同他说了话。听完那人的回答，浦岛太郎知道眼前的一切绝不是梦，尽管他的神智几乎错乱了。
    - id: ch05
      title: 紫色的烟雾
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 绝望中，浦岛太郎想起公主送的金盒。也许眼前这桩可怕的事并不是真的，他只是中了某个魔法师的咒。说不定，解除咒语的法宝就在自己手里。他几乎不知道自己在做什么，便掀开盒盖。紫色烟雾立刻喷涌而出，盒子空了。他握着空盒低头看去，年轻饱满的手竟在眼前皱缩，变成了一个极老极老的人的手。
        - id: ch05-b02
          speaker: narrator
          text: 浦岛太郎奔向从山上流下来的清澈小溪。水面像镜子一样，映出一张木乃伊般衰老的脸。他的心受了致命的创痛，只能蹒跚着爬回村庄。没有一个人认得这个老得不成样子的人，就是一个时辰以前跑过街道的强健俊美的青年。
        - id: ch05-b03
          speaker: narrator
          text: 他拖着沉重的脚步回到海边，孤零零地坐在礁石上，一遍又一遍高声呼唤海龟。可是海面始终没有回答。
        - id: ch05-b04
          speaker: narrator
          text: 可海龟再也没有回来。来到他身边的只有死亡，不久便让他从悲苦中解脱。在那以前，海边的人听浦岛太郎讲完了自己的故事。后来，每当孩子们烦躁不安，大人便会说起这个孝顺的儿子。他因为深爱父母，舍弃了海底宫殿的辉煌和奇观，也舍弃了世上最美丽的女子。
