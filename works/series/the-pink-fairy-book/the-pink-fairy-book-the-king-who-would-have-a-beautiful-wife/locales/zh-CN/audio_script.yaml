audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    king:
      display_name: "国王"
      tts:
        delivery: "自负急躁，发号施令时不容置疑"
        timbre: "洪亮的成年男声"
        pace: "适中"
        pitch: "中低音"
    servant:
      display_name: "忠仆"
      tts:
        delivery: "忠诚谨慎，说话恭敬而清楚"
        timbre: "沉稳清晰的男声"
        pace: "适中"
        pitch: "中音"
    younger_sister:
      display_name: "八十岁的妹妹"
      tts:
        delivery: "狡黠镇定，得意时仍不慌不忙"
        timbre: "略显苍老而清亮的女声"
        pace: "适中"
        pitch: "中音"
    elder_sister:
      display_name: "九十岁的姐姐"
      tts:
        delivery: "执拗急切，追问时纠缠不休"
        timbre: "苍老干涩的女声"
        pace: "适中偏快"
        pitch: "中高音"
    fairy_1:
      display_name: "仙女甲"
      tts:
        delivery: "淘气直率，想到什么便说什么"
        timbre: "轻盈明亮的女声"
        pace: "适中"
        pitch: "高音"
    fairy_2:
      display_name: "仙女乙"
      tts:
        delivery: "善良果断，语气温柔而坚定"
        timbre: "柔和清澈的女声"
        pace: "舒缓"
        pitch: "中高音"
    fairy_3:
      display_name: "仙女丙"
      tts:
        delivery: "轻快爽朗，言语简洁"
        timbre: "清脆的女声"
        pace: "适中"
        pitch: "中高音"
    fairy_4:
      display_name: "仙女丁"
      tts:
        delivery: "安静温厚，说话柔和"
        timbre: "温润的女声"
        pace: "舒缓"
        pitch: "中音"
    barber:
      display_name: "理发匠"
      tts:
        delivery: "无奈谨慎，最后带一点冷冷的幽默"
        timbre: "朴实的成年男声"
        pace: "适中"
        pitch: "中音"
  chapters:
    - id: ch01
      title: "寻找美丽的王后"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "五十年前，有个国王急着成婚，却非要娶一位像太阳一样美丽的妻子。没有一个姑娘合他的心意，他便派出一名忠仆，叫他走遍全国，找到足以成为王后的美人，再把她带回来。"
        - id: ch01-b02
          speaker: narrator
          text: "忠仆立刻上路，从高处寻到低处，城堡和茅屋全都走遍了。漂亮姑娘虽多得像野地里的黑莓，他却知道，国王一个也看不上。一天，他在外面奔波许久，走得又累又渴。路边正好有一座小得可怜的房子，他便上前敲门，讨一杯水喝。"
        - id: ch01-b03
          speaker: narrator
          text: "屋里住着两个靠纺纱度日的穷姐妹，一个八十岁，一个九十岁。长年纺纱，倒让她们的手变得又白又软，像少女的手。妹妹没有开门，只隔着格子窗把水递出来。忠仆一见那双小巧纤细的手，心想，有这样一双手的姑娘一定美极了。他越想越确信，赶忙回宫禀告。"
        - id: ch01-b04
          speaker: king
          text: "马上回去，想办法看清她的模样。"
        - id: ch01-b05
          speaker: narrator
          text: "忠仆立刻又去敲门。老妇人仍不开门，只从格子窗里递水给他。"
        - id: ch01-b06
          speaker: servant
          text: "这里只有你一个人住吗？"
        - id: ch01-b07
          speaker: younger_sister
          text: "不，我和姐姐一起住。我们都是穷姑娘，得靠干活挣饭吃。"
        - id: ch01-b08
          speaker: servant
          text: "你们多大年纪？"
        - id: ch01-b09
          speaker: younger_sister
          text: "我十五岁，姐姐二十岁。"
        - id: ch01-b10
          speaker: narrator
          text: "忠仆又回到王宫，把自己看到的、听到的，全都告诉了国王。"
        - id: ch01-b11
          speaker: king
          text: "我要十五岁的那个。去把她接来。"
    - id: ch02
      title: "面纱下的新娘"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "忠仆第三次来到小屋，站在门外敲了敲。格子窗应声打开，里面有个声音问他，这一回到底想要什么。"
        - id: ch02-b02
          speaker: servant
          text: "国王要我接走年纪较小的姑娘，请她回宫做王后。"
        - id: ch02-b03
          speaker: younger_sister
          text: "我愿意听从陛下的旨意。可我从出生起，脸上就没照过一线光。只要见光，我立刻会变黑。请陛下今晚派一辆严严实实的马车来，我就随你回宫。"
        - id: ch02-b04
          speaker: narrator
          text: "国王听完，马上命人备好那辆华丽的金马车，还在车里放了几套富贵衣裙。到了晚上，老妇人把自己严严实实地裹在一层厚面纱里，坐车进了王宫。国王早已等得心急，一见新娘到了，便客客气气地请她揭开面纱，让自己看看她的脸。"
        - id: ch02-b05
          speaker: younger_sister
          text: "这里的烛火太亮了。陛下难道要亲眼看着我变黑吗？"
        - id: ch02-b06
          speaker: narrator
          text: "国王居然信了。婚礼照常举行，从头到尾，面纱一次也没揭开。后来只剩两个人时，国王偷偷掀起一角，这才第一次看清，自己娶来的竟是个满脸皱纹的老妇人。他顿时勃然大怒，猛地推开窗户，把她扔了出去。幸好她命不该绝，衣服钩在墙上的一枚钉子上，人便吊在半空，上不着天，下不着地。"
    - id: ch03
      title: "四位仙女的礼物"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "老妇人悬在那里，脚下就是高高的墙根。她提心吊胆，只觉得下一刻衣服就会裂开，自己也会直摔到地上。就在这时，恰好有四位仙女从旁边经过。"
        - id: ch03-b02
          speaker: fairy_1
          text: "姐妹们，快看！那一定是国王接来的老妇人。要不要让衣服裂开，叫她摔下去？"
        - id: ch03-b03
          speaker: fairy_2
          text: "不，不！我们送她些好东西吧。我要送她青春。"
        - id: ch03-b04
          speaker: fairy_3
          text: "我要送她美貌。"
        - id: ch03-b05
          speaker: fairy_1
          text: "那我送她智慧。"
        - id: ch03-b06
          speaker: fairy_4
          text: "我要送她一颗温柔的心。"
        - id: ch03-b07
          speaker: narrator
          text: "四位仙女送完礼物，便继续赶路。她们身后留下的，已经不再是那个衰老的女人，而是世上最美丽的少女。第二天清晨，国王从窗口向外望去，看见这位美丽的姑娘还挂在钉子上。"
        - id: ch03-b08
          speaker: king
          text: "啊，我都做了些什么！昨晚我一定是瞎了眼！"
          emotion: surprised
        - id: ch03-b09
          speaker: narrator
          text: "国王赶紧叫人搬来长梯，把少女从墙外救下来。接着，他跪倒在她面前，一再求她原谅自己。为了向她表示敬意，宫里还举行了一场盛大的宴会。"
    - id: ch04
      title: "姐姐的追问"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "几天以后，九十岁的姐姐来到王宫求见王后。"
        - id: ch04-b02
          speaker: king
          text: "那个丑陋的老巫婆是谁？"
        - id: ch04-b03
          speaker: younger_sister
          text: "是从前的邻居，脑子有点糊涂。"
        - id: ch04-b04
          speaker: narrator
          text: "姐姐一动不动地盯着王后，看了又看。尽管妹妹已经变得年轻美丽，她还是把人认了出来。"
        - id: ch04-b05
          speaker: elder_sister
          text: "你怎么会变得又年轻又漂亮？我也想变成这样。"
        - id: ch04-b06
          speaker: narrator
          text: "姐姐翻来覆去地问，从早到晚，一刻也不肯罢休。王后被她缠了一整天，终于失去了耐心。"
        - id: ch04-b07
          speaker: younger_sister
          text: "我叫人砍掉了那颗老脑袋，原来的地方就长出一颗新脑袋。"
    - id: ch05
      title: "变美的代价"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "姐姐听完，立刻去找理发匠。"
        - id: ch05-b02
          speaker: elder_sister
          text: "只要你砍掉我的脑袋，让我年轻漂亮，要多少钱都行。"
        - id: ch05-b03
          speaker: barber
          text: "好太太，我要是真砍下去，你会死的！"
        - id: ch05-b04
          speaker: narrator
          text: "理发匠再怎么劝，老妇人也一个字都听不进去，只管逼他动手。到最后，他只好拿出刀，朝她的脖子砍下第一刀。"
        - id: ch05-b05
          speaker: elder_sister
          text: "啊，疼死我了！"
        - id: ch05-b06
          speaker: narrator
          text: "理发匠曾经在法国待过，便拿一句在那里学来的话回答她。"
        - id: ch05-b07
          speaker: barber
          text: "想变美，总得吃点苦头。"
        - id: ch05-b08
          speaker: narrator
          text: "第二刀落下，老妇人的脑袋滚到一旁。这一回，她彻彻底底地死了。"
