  chapters:
    - id: ch01
      title: The Search for a Beautiful Wife
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Fifty years ago, there lived a king who was very anxious to marry. But he was quite determined that his wife must be as beautiful as the sun. He would accept no one who fell short of that. No maiden he saw was beautiful enough for him, so finding a queen was harder than it had first seemed.
        - id: ch01-b02
          speaker: narrator
          text: At last, he sent a faithful servant across the whole land. The man was to search its entire length and breadth. If he had the good luck to find a girl fair enough to be queen, he must bring her back.
        - id: ch01-b03
          speaker: narrator
          text: The servant left at once. He searched high and low, through castles and cottages. Pretty maidens were as plentiful as blackberries, but he was sure none would satisfy the king.
        - id: ch01-b04
          speaker: narrator
          text: One day, after wandering far and wide, he grew tired and thirsty. He stopped at a tiny house beside the road and knocked to ask for water.
    - id: ch02
      title: The Sisters Behind the Lattice
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Two sisters lived in that house. One was eighty years old, and the other was ninety. They were very poor, and spinning was the only way they had to earn their bread. Years of that work had kept their hands soft and white, like a young girl's hands.
        - id: ch02-b02
          speaker: narrator
          text: One sister passed a cup of water through the lattice without opening the door. The servant saw only her small, delicate fingers. A maiden with a hand like that must be lovely indeed, he thought. He hurried back and told the king what he had seen.
        - id: ch02-b03
          speaker: king
          text: Go back at once, and find a way to see her.
        - id: ch02-b04
          speaker: narrator
          text: The servant wasted no time. Again he knocked at the little house and asked for water. Again, an old woman passed it through the lattice without opening the door.
        - id: ch02-b05
          speaker: servant
          text: Do you live here by yourself?
        - id: ch02-b06
          speaker: younger_sister
          text: No, my sister lives with me. We are poor girls, and we have to work for our food.
        - id: ch02-b07
          speaker: servant
          text: And how old are you?
        - id: ch02-b08
          speaker: younger_sister
          text: I am fifteen. My sister is twenty.
        - id: ch02-b09
          speaker: narrator
          text: The servant returned and told the king everything he knew.
        - id: ch02-b10
          speaker: king
          text: I will marry the fifteen-year-old. Go and bring her to me.
        - id: ch02-b11
          speaker: narrator
          text: For the third time, the servant went to the little house and knocked. The lattice opened, and a voice asked what he wanted.
        - id: ch02-b12
          speaker: servant
          text: The king has sent me to bring the younger sister to his castle, where she will become his queen.
        - id: ch02-b13
          speaker: younger_sister
          text: Tell his majesty I am ready to obey. But no ray of light has touched my face since I was born. If light ever reaches it, I will turn black at once. Please ask the king to send a closed carriage this evening, and I will ride in it to the castle.
    - id: ch03
      title: The Veiled Bride
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the king heard her answer, he had his great golden carriage prepared and filled it with magnificent robes. The old woman wrapped herself in a thick veil and rode away to the castle.
        - id: ch03-b02
          speaker: narrator
          text: The king waited eagerly for her. When she arrived, he politely asked her to lift the veil and show him her face.
        - id: ch03-b03
          speaker: younger_sister
          text: The candles here are too bright, and the light is too strong. Do you want to watch me turn black before your eyes?
        - id: ch03-b04
          speaker: narrator
          text: The king believed every word. The marriage took place, and not once was the veil lifted. Later, when they were alone, he raised one corner himself. Only then did he discover that he had married a wrinkled old woman.
        - id: ch03-b05
          speaker: narrator
          text: The king flew into a furious rage. He threw open the window and flung her outside. Luckily, her clothes caught on a nail in the wall, leaving her hanging between heaven and earth.
    - id: ch04
      title: Four Fairy Wishes
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The old woman could only hang there between the window and the ground. Every moment, she expected her clothes to tear and send her falling. While she was still suspended, four fairies happened to pass by.
        - id: ch04-b02
          speaker: first_fairy
          text: Look, sisters! That must be the old woman the king sent for. Shall we wish for her clothes to tear and let her fall?
        - id: ch04-b03
          speaker: second_fairy
          text: Oh, no, no! Let us give her something good. I will wish her young again.
        - id: ch04-b04
          speaker: third_fairy
          text: Then I will give her beauty.
        - id: ch04-b05
          speaker: fourth_fairy
          text: And I will give her wisdom.
        - id: ch04-b06
          speaker: first_fairy
          text: Then I will give her a tender heart.
        - id: ch04-b07
          speaker: narrator
          text: With that, the fairies went on their way. Behind them, they left the most beautiful maiden in the world.
        - id: ch04-b08
          speaker: narrator
          text: The next morning, the king looked from his window and saw the lovely maiden still hanging from the nail.
        - id: ch04-b09
          speaker: king
          text: What have I done? I must have been blind last night!
        - id: ch04-b10
          speaker: narrator
          text: He ordered long ladders to be brought and had the maiden rescued. Then he fell to his knees and begged her forgiveness. A great feast was held in her honor.
    - id: ch05
      title: The Older Sister's Wish
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A few days later, the ninety-year-old sister came to the palace and asked to see the queen.
        - id: ch05-b02
          speaker: king
          text: Who is that hideous old witch?
          emotion: disgusted
        - id: ch05-b03
          speaker: younger_sister
          text: Oh, she is an old neighbor of mine, and she is a little foolish.
        - id: ch05-b04
          speaker: narrator
          text: But the older woman stared at the queen and recognized her.
        - id: ch05-b05
          speaker: older_sister
          text: How did you become so young and beautiful? I want to be young and beautiful too.
        - id: ch05-b06
          speaker: narrator
          text: She asked the same question all day. At last, the queen lost her patience.
        - id: ch05-b07
          speaker: younger_sister
          text: I had my old head cut off, and a new one grew in its place.
        - id: ch05-b08
          speaker: narrator
          text: The older sister went to a barber.
        - id: ch05-b09
          speaker: older_sister
          text: I will pay whatever you ask if you cut off my head, so I can become young and lovely.
        - id: ch05-b10
          speaker: barber
          text: But, my good woman, if I cut off your head, you will die!
        - id: ch05-b11
          speaker: narrator
          text: She refused to listen. At last, the barber took out his knife and struck her neck once.
        - id: ch05-b12
          speaker: older_sister
          text: Ah! It hurts!
        - id: ch05-b13
          speaker: barber
          text: You must suffer to be beautiful.
        - id: ch05-b14
          speaker: narrator
          text: The barber had learned that saying in France. At the second blow, her head rolled off, and the old woman was dead for good and all.
