audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    father:
      display_name: "男人"
      tts:
        delivery: "憨直自信，卖弄本领时一本正经"
        timbre: "朴实略显苍老"
        pace: "适中"
        pitch: "中低音"
    wife:
      display_name: "妻子"
      tts:
        delivery: "爽直务实，生气时干脆有力"
        timbre: "明亮成熟"
        pace: "适中偏快"
        pitch: "中音"
    youngest_daughter:
      display_name: "小女儿"
      tts:
        delivery: "亲热爽朗，见到父亲时满是惊喜"
        timbre: "清亮年轻"
        pace: "轻快"
        pitch: "中高音"
    youngest_troll:
      display_name: "小女婿山怪"
      tts:
        delivery: "豪爽随意，说起怪本领毫不费力"
        timbre: "粗厚有力"
        pace: "适中"
        pitch: "低音"
    second_troll:
      display_name: "二女婿山怪"
      tts:
        delivery: "轻松笃定，对自己的本领习以为常"
        timbre: "浑厚明朗"
        pace: "适中"
        pitch: "中低音"
    eldest_daughter:
      display_name: "大女儿"
      tts:
        delivery: "自然沉着，与丈夫配合默契"
        timbre: "柔和清晰"
        pace: "从容"
        pitch: "中音"
    eldest_troll:
      display_name: "大女婿山怪"
      tts:
        delivery: "爽快自如，说话透着山怪的奇异自信"
        timbre: "低沉结实"
        pace: "适中"
        pitch: "低音"
  chapters:
    - id: ch01
      title: "小女儿家的肉汤"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有个男人生了三个女儿。三个女儿都嫁给了山怪，住在地下。有一天，他想去看看女儿们。妻子给他带上干面包，他便出了门。走了好一阵，他又累又饿，就坐在一座土丘东边吃面包。谁知土丘忽然打开，小女儿从里面走了出来。"
        - id: ch01-b02
          speaker: youngest_daughter
          text: "爸爸，原来是您呀！怎么不进来看看我？"
          emotion: surprised
        - id: ch01-b03
          speaker: father
          text: "我要是知道你住在这里，又看得见入口，早就进去啦。"
        - id: ch01-b04
          speaker: narrator
          text: "男人跟着女儿走进土丘。没过多久，山怪回来了。小女儿告诉丈夫父亲来了，请他买些牛肉回来煮汤。"
        - id: ch01-b05
          speaker: youngest_troll
          text: "买牛肉太麻烦了，咱们有更省事的办法！"
        - id: ch01-b06
          speaker: narrator
          text: "山怪往屋顶的横梁钉进一根铁钉，拿脑袋一下又一下地撞，直到头上掉下好几大块肉。可他一点事也没有，一锅肉汤就这么煮成了。"
        - id: ch01-b07
          speaker: narrator
          text: "临走时，山怪又送给岳父满满一袋钱。男人背起沉甸甸的钱袋，踏上回家的路。快到家时，他突然想起自家的母牛快下犊了。他把钱袋往地上一放，飞奔回去，张口就问母牛生了没有。"
        - id: ch01-b08
          speaker: wife
          text: "什么事急成这样？没有，母牛还没生呢。"
        - id: ch01-b09
          speaker: father
          text: "那你快跟我来，帮我搬一袋钱回家。"
        - id: ch01-b10
          speaker: wife
          text: "你说什么？一袋钱？"
          emotion: surprised
        - id: ch01-b11
          speaker: father
          text: "对呀，满满一袋。这有什么好奇怪的？"
        - id: ch01-b12
          speaker: narrator
          text: "妻子不大相信，却还是陪他出了门。到了放钱的地方，钱袋早没了。原来有个贼从那里经过，把钱偷走了。妻子气得狠狠骂了他一通。"
        - id: ch01-b13
          speaker: father
          text: "好啦，钱丢了就丢了！反正我知道自己学会了什么。"
        - id: ch01-b14
          speaker: wife
          text: "那你倒说说，学会了什么？"
        - id: ch01-b15
          speaker: father
          text: "哈，这个我自己知道。"
    - id: ch02
      title: "二女儿家的亮光"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "过了一阵，男人又去看二女儿。妻子照旧让他带上干面包。他走累了，就坐到一座土丘东边吃起来。二女儿从土丘里出来，请父亲进去，他高高兴兴地跟着去了。"
        - id: ch02-b02
          speaker: narrator
          text: "不久，山怪回到家里。天已经黑了，二女儿请丈夫去买几根蜡烛。"
        - id: ch02-b03
          speaker: second_troll
          text: "想要亮光还不容易，哪用去买蜡烛。"
        - id: ch02-b04
          speaker: narrator
          text: "山怪把手指伸进火里。手指立刻亮了起来，照亮了屋子，他自己却连一点皮也没烧伤。"
        - id: ch02-b05
          speaker: narrator
          text: "这次，老人得了两袋钱。两只钱袋沉甸甸的，压得他走路十分吃力，只能一步一步往家挪。眼看就要到家，那头怀着小牛的母牛又钻进了他的脑子。他放下钱，跑回家问母牛生了没有。"
        - id: ch02-b06
          speaker: wife
          text: "你到底怎么回事？跑得像整座房子要塌了似的。放心吧，母牛还没生。"
        - id: ch02-b07
          speaker: narrator
          text: "男人请她去帮忙搬回两袋钱。她还是不信，他就一遍又一遍地保证，直到妻子终于答应跟着去。可是他们赶到放钱的地方，那里又来过一个贼，两袋钱全让人拿走了。妻子当然气坏了。"
        - id: ch02-b08
          speaker: father
          text: "唉，你要是知道我学会了什么就好啦。"
    - id: ch03
      title: "大女儿家的鱼"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "男人第三次出门，去看大女儿。他在一座土丘东边坐下，吃起妻子准备的干面包。大女儿从土丘里出来，把父亲请进家中。"
        - id: ch03-b02
          speaker: narrator
          text: "过了一会儿，山怪回来了。大女儿请他去买些鱼。"
        - id: ch03-b03
          speaker: eldest_troll
          text: "鱼不用买，弄到它们有个更容易的办法。把和面槽和长柄勺拿来。"
        - id: ch03-b04
          speaker: narrator
          text: "夫妻俩坐进和面槽，把它划到土丘旁边的湖上。刚划出一小段，山怪便问妻子。"
        - id: ch03-b05
          speaker: eldest_troll
          text: "我的眼睛绿了吗？"
        - id: ch03-b06
          speaker: eldest_daughter
          text: "还没有。"
        - id: ch03-b07
          speaker: narrator
          text: "山怪又往前划了一段。"
        - id: ch03-b08
          speaker: eldest_troll
          text: "现在呢？我的眼睛还没绿吗？"
        - id: ch03-b09
          speaker: eldest_daughter
          text: "绿了，现在已经绿了。"
        - id: ch03-b10
          speaker: narrator
          text: "山怪马上跳进湖里，用长柄勺一勺接一勺地舀鱼。没过多久，和面槽里堆满了鱼，再也装不下一条。他们这才划回家，用捞来的鱼美美地吃了一顿。"
        - id: ch03-b11
          speaker: narrator
          text: "老人离开时，带走了满满三袋钱。快到家了，他又想起那头母牛，只好把钱放下。这回他多了个心眼，把木鞋脱下来压在钱袋上，心想别人见了木鞋，就不会拿钱。他跑回家问母牛生了没有。母牛还是没生，妻子又骂他大惊小怪。到最后，他总算说动妻子，让她去帮忙搬钱。"
        - id: ch03-b12
          speaker: narrator
          text: "可他们赶到那里，只找到了两只木鞋。就在这段工夫里，又有一个贼经过，把三袋钱全拿走了。妻子怒气冲冲地数落丈夫，他却像没事人一样。"
        - id: ch03-b13
          speaker: father
          text: "钱丢了就丢了！反正我知道自己学会了什么。"
        - id: ch03-b14
          speaker: wife
          text: "我还真想知道，你究竟学会了什么！"
          emotion: angry
        - id: ch03-b15
          speaker: father
          text: "别急，你早晚会见识到。"
    - id: ch04
      title: "他学来的本领"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "有一天，妻子想喝肉汤。"
        - id: ch04-b02
          speaker: wife
          text: "你去村里买一块牛肉，咱们煮汤喝吧。"
        - id: ch04-b03
          speaker: father
          text: "不用去买，我知道一个更省事的办法。"
        - id: ch04-b04
          speaker: narrator
          text: "男人在横梁上钉进一根铁钉，一头撞了上去。他可没有山怪那样的本领。这一撞让他吃足了苦头，不得不在床上躺了很久才起得来。"
        - id: ch04-b05
          speaker: narrator
          text: "伤好以后，家里的蜡烛又用完了。妻子请他去买几根。"
        - id: ch04-b06
          speaker: father
          text: "不用，蜡烛也没必要买。"
        - id: ch04-b07
          speaker: narrator
          text: "他说完便把手伸进火里。这一次，他又在床上躺了好一阵。"
        - id: ch04-b08
          speaker: narrator
          text: "等他再次养好伤，妻子有一天想吃鱼，叫他去买。男人又想显摆自己学来的本领。他让妻子带上和面槽和长柄勺，跟自己一起去。两人坐进槽里，划到了湖上。刚划出一小段，他便问妻子。"
        - id: ch04-b09
          speaker: father
          text: "我的眼睛绿了吗？"
        - id: ch04-b10
          speaker: wife
          text: "没有。好端端的，眼睛为什么会绿？"
        - id: ch04-b11
          speaker: narrator
          text: "他们又往湖心划了一段，男人再次开口。"
        - id: ch04-b12
          speaker: father
          text: "我的眼睛还没绿吗？"
        - id: ch04-b13
          speaker: wife
          text: "你说的什么胡话？它们为什么非得变绿？"
        - id: ch04-b14
          speaker: father
          text: "亲爱的，你就不能说它们已经绿了吗？"
        - id: ch04-b15
          speaker: wife
          text: "好吧，好吧，你的眼睛绿了。"
        - id: ch04-b16
          speaker: narrator
          text: "男人一听，拿起长柄勺就跳进水里捞鱼。这一跳，他再也没能回来，只好永远留在鱼群里了！"
