  chapters:
    - id: ch01
      title: The Youngest Daughter's Mound
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man with three daughters, and each daughter had married a troll who lived underground. One day he decided to visit them. His wife gave him some dry bread for the journey.
        - id: ch01-b02
          speaker: narrator
          text: After walking a long way, he grew tired and hungry. He sat on the east side of a mound and began eating. At once the mound opened, and his youngest daughter stepped out.
        - id: ch01-b03
          speaker: youngest_daughter
          text: Father! Why haven't you come inside to see me?
          emotion: surprised
        - id: ch01-b04
          speaker: father
          text: If I'd known you lived here, or seen a way in, I would have come.
        - id: ch01-b05
          speaker: narrator
          text: So he went into the mound with her. Her troll husband soon came home. When his wife told him her father had arrived, she asked him to buy beef for broth.
        - id: ch01-b06
          speaker: youngest_troll
          text: We can get beef much more easily than that!
        - id: ch01-b07
          speaker: narrator
          text: The troll drove an iron spike into a roof beam. Then he charged at it headfirst, again and again, until several large pieces fell from his head. He was perfectly well afterward. They had what they needed for the broth, without going out to buy a thing.
        - id: ch01-b08
          speaker: narrator
          text: Before the old man left, the troll gave him a sack full of money. He carried it toward home. But when he was nearly there, he remembered that his cow was about to give birth. He dropped the sack on the ground, ran home, and asked his wife if the calf had come.
        - id: ch01-b09
          speaker: wife
          text: Why did you come rushing home like this? No, the cow hasn't had her calf.
        - id: ch01-b10
          speaker: father
          text: Then come outside and help me carry in a sack full of money.
        - id: ch01-b11
          speaker: wife
          text: A whole sack of money?
          emotion: surprised
        - id: ch01-b12
          speaker: father
          text: Yes, a whole sack. Is that so hard to believe?
        - id: ch01-b13
          speaker: narrator
          text: His wife hardly believed him, but she decided to humor him and went along. When they reached the place, the sack was gone. While the money lay beside the road, a thief had passed by and carried it away. She was furious, and she gave her husband a thorough scolding.
        - id: ch01-b14
          speaker: father
          text: Oh, forget the money! I know what I have learned.
        - id: ch01-b15
          speaker: wife
          text: And what have you learned?
        - id: ch01-b16
          speaker: father
          text: Ah, I know that.
    - id: ch02
      title: The Second Daughter's Light
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Some time later, the man decided to visit his second daughter. Once again his wife packed him dry bread. When he became tired and hungry, he sat on the east side of a mound to eat. His daughter came up from below and invited him in, and he gladly followed her.
        - id: ch02-b02
          speaker: narrator
          text: Her troll husband came home after dark. His wife asked him to go out and buy candles.
        - id: ch02-b03
          speaker: second_troll
          text: Oh, we'll have light soon enough.
        - id: ch02-b04
          speaker: narrator
          text: He dipped his fingers right into the fire. When he pulled them out, they shone like candles and gave them all the light they needed. The flames had not burned him in the least.
        - id: ch02-b05
          speaker: narrator
          text: This troll gave the old man two sacks of money. He trudged home with both of them, but just before he arrived, he thought of the cow again. He set down the money, hurried home, and asked whether the calf had come.
        - id: ch02-b06
          speaker: wife
          text: What is the matter with you? You rush in as if the whole house is about to fall! Set your mind at ease. The cow still hasn't had her calf.
        - id: ch02-b07
          speaker: narrator
          text: He asked her to come out and help carry home his two sacks of money. She did not believe there were any sacks waiting for them. Still, he kept assuring her that it was true. At last she gave in and went with him.
        - id: ch02-b08
          speaker: narrator
          text: A thief had beaten them there again. Both sacks were gone. His wife was angry, and no wonder. But the man had only one answer.
        - id: ch02-b09
          speaker: father
          text: Ah, if you only knew what I have learned.
    - id: ch03
      title: The Eldest Daughter's Fish
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The third time, the man set out to visit his eldest daughter. He reached another mound, sat on its east side, and ate the bread his wife had packed. His daughter came out and invited him below.
        - id: ch03-b02
          speaker: narrator
          text: Before long, her troll husband returned. When his wife asked him to buy fish, he had another plan.
        - id: ch03-b03
          speaker: eldest_troll
          text: We can get fish much more easily. Bring me your dough trough and your ladle.
        - id: ch03-b04
          speaker: narrator
          text: The troll and his wife climbed into the trough and used it as a boat on the lake beside the mound. Once they had rowed a little way, he turned to her.
        - id: ch03-b05
          speaker: eldest_troll
          text: Are my eyes green?
        - id: ch03-b06
          speaker: eldest_daughter
          text: No, not yet.
        - id: ch03-b07
          speaker: narrator
          text: He rowed farther and asked her once more.
        - id: ch03-b08
          speaker: eldest_troll
          text: Aren't my eyes green yet?
        - id: ch03-b09
          speaker: eldest_daughter
          text: Yes. They're green now.
        - id: ch03-b10
          speaker: narrator
          text: As soon as his eyes turned green, the troll jumped into the water. He used the ladle to scoop fish into the trough, one load after another. Before long, the trough was so full it could not hold one more. Then they rowed back to the mound and made a fine meal of their catch.
        - id: ch03-b11
          speaker: narrator
          text: This time the old man received three sacks of money. Yet when he was almost home, the cow came into his mind again. He put down the sacks, then placed his wooden shoes on top. Surely, he thought, no one would take the money now. Off he ran to ask about the calf.
        - id: ch03-b12
          speaker: narrator
          text: The cow had still not given birth. His wife scolded him once more for rushing home in such a state. Then he told her about the three sacks and persuaded her to come out and help him carry them.
        - id: ch03-b13
          speaker: narrator
          text: When they returned, only the wooden shoes remained. A thief had taken every sack. His wife burst out at him in anger, while he remained perfectly quiet.
        - id: ch03-b14
          speaker: father
          text: Forget the money! I know what I have learned.
        - id: ch03-b15
          speaker: wife
          text: Then I'd like to know what you have learned!
          emotion: angry
        - id: ch03-b16
          speaker: father
          text: You'll see soon enough.
    - id: ch04
      title: Beef and Candlelight
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One day the man's wife wanted broth.
        - id: ch04-b02
          speaker: wife
          text: Please go to the village and buy some beef for the broth.
        - id: ch04-b03
          speaker: father
          text: There's no need. We can get beef an easier way.
        - id: ch04-b04
          speaker: narrator
          text: He drove a spike into a beam and ran straight into it with his head. Instead of producing beef, he hurt himself so badly that he had to stay in bed for a long time.
        - id: ch04-b05
          speaker: narrator
          text: After he recovered, his wife discovered one day that they had no candles. She asked him to buy some.
        - id: ch04-b06
          speaker: father
          text: No, there's no need to buy candles.
        - id: ch04-b07
          speaker: narrator
          text: He thrust his hand into the fire, expecting his fingers to give them light. Instead, the fire burned him. That sent him back to bed for another long while.
    - id: ch05
      title: The Green Eyes
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When he was well again, his wife wanted fish and asked him to go buy some. But the man was determined to show her the last thing he had learned.
        - id: ch05-b02
          speaker: father
          text: Come with me, and bring your dough trough and a ladle.
        - id: ch05-b03
          speaker: narrator
          text: They both sat in the trough and rowed out onto the lake. After they had gone a little way, the man looked at his wife.
        - id: ch05-b04
          speaker: father
          text: Are my eyes green?
        - id: ch05-b05
          speaker: wife
          text: No. Why would they be green?
        - id: ch05-b06
          speaker: narrator
          text: They rowed farther. Then he tried again.
        - id: ch05-b07
          speaker: father
          text: Aren't my eyes green yet?
        - id: ch05-b08
          speaker: wife
          text: What nonsense! Why should your eyes be green?
        - id: ch05-b09
          speaker: father
          text: Oh, my dear, can't you simply say they are green?
        - id: ch05-b10
          speaker: wife
          text: Very well. They're green.
        - id: ch05-b11
          speaker: narrator
          text: The moment he heard her say it, he leaped into the lake with the ladle, ready to scoop up the fish. But he could not do what the troll had done. Down he went, and there he stayed with the fish.
