audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    youth:
      display_name: 年轻人
      tts:
        delivery: 机敏大胆，说话爽快，设下圈套时若无其事
        timbre: 清亮结实
        pace: 中速，得意时稍快
        pitch: 中音
    shepherd:
      display_name: 老牧羊人
      tts:
        delivery: 朴实急切，容易轻信别人
        timbre: 苍老沙哑
        pace: 中缓
        pitch: 中低音
    king:
      display_name: 国王
      tts:
        delivery: 威严苛刻，贪心而急躁
        timbre: 洪亮厚重
        pace: 中速
        pitch: 低音
    dragon:
      display_name: 巨龙
      tts:
        delivery: 粗声粗气，自负易怒，对飞马时格外宠爱
        timbre: 低沉浑厚
        pace: 中缓，发怒时加快
        pitch: 低音
    dragoness:
      display_name: 母龙
      tts:
        delivery: 冷硬凶狠，行动干脆
        timbre: 粗哑有力
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 树下的骗局
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个人养着两个儿子。弟弟比哥哥俊美得多，哥哥因此满心嫉妒，兄弟俩一直合不来。等他们长大，关系更糟了。有一天，两人走进树林，哥哥突然抓住弟弟，把他绑在树上，独自离去。他盼着弟弟就这样饿死。
        - id: ch01-b02
          speaker: narrator
          text: 可没过多久，一位驼背的老牧羊人赶着羊群经过。他瞧见树下的年轻人，停住了脚。
        - id: ch01-b03
          speaker: shepherd
          text: 孩子，快告诉我，你为什么让人绑在这棵树上？
        - id: ch01-b04
          speaker: youth
          text: 从前我的背弯得厉害，所以才绑在这里。你看，这一下全治好了，我的背现在多直啊！
        - id: ch01-b05
          speaker: shepherd
          text: 那你也把我绑上去吧！这样我的背也能变直了。
        - id: ch01-b06
          speaker: youth
          text: 我当然乐意。你先解开我身上的绳子，我再用它把你牢牢绑好。
        - id: ch01-b07
          speaker: narrator
          text: 两人很快换了位置。年轻人赶走羊群，只留下真正的牧羊人绑在树上，为自己的愚蠢后悔。他继续赶路，又遇见一个牧马童和一个赶牛人，还说动他们跟自己一道去闯荡。
        - id: ch01-b08
          speaker: narrator
          text: 凭着这一招和许多别的诡计，年轻人很快出了名。消息一直传到国王耳中。国王听得满心好奇，很想亲眼瞧瞧，这个骗得过所有人的家伙究竟是谁，便下令让卫兵把他捉了来。
    - id: ch02
      title: 偷走飞马
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 年轻人站在国王面前。国王开口了。
        - id: ch02-b02
          speaker: king
          text: 你使了那么多诡计，捉弄了那么多人，依法早就该死。不过，我可以给你一条活路。巨龙有一匹飞马，你把它带来，我就饶了你。要是失败，我便叫人把你剁成一千块。
        - id: ch02-b03
          speaker: youth
          text: 原来只要一匹马？你很快就能见到它。
        - id: ch02-b04
          speaker: narrator
          text: 年轻人离开王宫，径直来到巨龙的马厩。飞马就拴在那里。他悄悄伸手去抓缰绳，飞马却猛然放声嘶鸣。巨龙正睡在马厩楼上的房间里，听见声音便醒了。
        - id: ch02-b05
          speaker: dragon
          text: 怎么了，我的宝贝？是什么东西弄疼你了吗？
        - id: ch02-b06
          speaker: narrator
          text: 年轻人等了一会儿，又动手解绳。飞马第二次高声嘶鸣，巨龙急忙醒来，大声追问它为什么这样吵。第三次，飞马还是嘶鸣不止。这回巨龙终于失去了耐性。他冲进马厩，抄起鞭子，把飞马狠狠打了一顿。
        - id: ch02-b07
          speaker: narrator
          text: 飞马受了委屈，心里也恼了。年轻人再来解缰绳时，它没发出一点声音，安安静静地跟着他走。刚离开马厩，年轻人便翻身上马，飞驰而去。他还扭过头，朝身后大喊。
        - id: ch02-b08
          speaker: youth
          text: 喂，巨龙！以后有人问你的马去哪儿了，你就告诉他，飞马归我啦！
    - id: ch03
      title: 铃铛床罩
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 年轻人带着飞马回来，国王却仍不满足。
        - id: ch03-b02
          speaker: king
          text: 飞马是不错，可我还要一样东西。巨龙床上那条缀着小铃铛的床罩，你也得给我拿来。拿不到，我就把你剁成一千块。
        - id: ch03-b03
          speaker: youth
          text: 就这件事吗？办起来容易得很。
        - id: ch03-b04
          speaker: narrator
          text: 夜里，年轻人来到巨龙家，爬上屋顶。他推开一扇小窗，把平时吊锅的链子慢慢放下去，想钩住床罩，再把它拉上来。谁知床罩上的铃铛全响了，叮叮当当，吵醒了巨龙。
        - id: ch03-b05
          speaker: dragon
          text: 老婆，你怎么把被褥全扯走了？
        - id: ch03-b06
          speaker: narrator
          text: 巨龙抓住床罩往回一拽，连屋顶上的年轻人也拖进了房间。他扑过去，用绳子把人捆得结结实实。最后一个结打好后，他吩咐妻子。
        - id: ch03-b07
          speaker: dragon
          text: 明天我要去教堂。你在家把他杀了，煮熟。等我回来，咱们一起吃掉他。
        - id: ch03-b08
          speaker: narrator
          text: 第二天早晨，母龙抓住年轻人，从搁板上取下一把快刀。她要动手杀人了。为了抓得更方便，她先解开绳索。年轻人立刻抱住她的双腿，把她掀翻在地，又牢牢制住她。
        - id: ch03-b09
          speaker: narrator
          text: 母龙原本要割断他的喉咙，他反过来迅速割断了母龙的喉咙，还把尸体塞进烤炉。随后，年轻人抓起铃铛床罩，回去交给国王。
        - id: ch03-b10
          speaker: narrator
          text: 国王正坐在宝座上。年轻人走到他面前，深深鞠了一躬，把床罩展开。国王看了一眼，还是不肯罢休。
        - id: ch03-b11
          speaker: king
          text: 这也不够。你还得把巨龙本人给我带来。不然，我就叫人把你剁成一千块。
        - id: ch03-b12
          speaker: youth
          text: 我能办到。不过，你得给我两年。我得先把胡子留起来，免得巨龙认出我。
        - id: ch03-b13
          speaker: king
          text: 好，就给你两年。
    - id: ch04
      title: 箱子里的巨龙
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 两年过去，年轻人的胡子长成了。他立刻动身去找巨龙。路上遇见一个乞丐，他便说服对方交换衣裳，然后穿着那身破衣服，毫无惧色地继续赶路。
        - id: ch04-b02
          speaker: narrator
          text: 巨龙正在屋前忙着做一口箱子。年轻人装成乞丐，客客气气地上前搭话。
        - id: ch04-b03
          speaker: youth
          text: 早安，大人。能赏我一小块面包吗？
        - id: ch04-b04
          speaker: dragon
          text: 先等着。等我把箱子做好，再看看有没有面包给你。
        - id: ch04-b05
          speaker: youth
          text: 这口箱子做好以后，是拿来做什么的？
        - id: ch04-b06
          speaker: dragon
          text: 是给一个年轻人准备的。他杀了我的妻子，还偷走了飞马和床罩。
        - id: ch04-b07
          speaker: youth
          text: 那他活该。他干的事实在太坏了。不过，这口箱子恐怕太小。那年轻人可是个大个子。
        - id: ch04-b08
          speaker: dragon
          text: 你说错了。这箱子连我都装得下。
        - id: ch04-b09
          speaker: youth
          text: 那恶棍几乎跟你一样高。你要是进得去，他当然也行。可我看啊，你躺进去一定挤得很。
        - id: ch04-b10
          speaker: dragon
          text: 才不会，里面宽敞得很。
        - id: ch04-b11
          speaker: narrator
          text: 巨龙边说边小心地钻进箱子。等他刚刚躺好，年轻人立刻扣上箱盖。
        - id: ch04-b12
          speaker: youth
          text: 现在使劲顶顶看。我要试试，那个人能不能从里面逃出来。
        - id: ch04-b13
          speaker: narrator
          text: 巨龙使出全身力气往上顶，箱盖却纹丝不动。
        - id: ch04-b14
          speaker: dragon
          text: 箱子没问题！现在把它打开吧。
        - id: ch04-b15
          speaker: narrator
          text: 年轻人当然没有开箱。他取来一根根长钉，一根接一根地钉进去，把箱子封得更加严实。然后他把箱子背到背上，一路送到国王那里。
    - id: ch05
      title: 谁也不知道的结局
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 国王听说巨龙真在箱子里，激动得连一刻也等不了。他砸开锁，把箱盖掀开一条小缝，想亲眼确认一下。他十分当心，觉得这道缝绝不够巨龙跳出来。
        - id: ch05-b02
          speaker: narrator
          text: 可那道缝，偏偏刚好容得下巨龙的血盆大口。只听咔嚓一声，国王就消失在那张鲜红的阔嘴里。
        - id: ch05-b03
          speaker: narrator
          text: 后来，年轻人娶了国王的女儿，统治了这个国家。
        - id: ch05-b04
          speaker: narrator
          text: 至于他最后怎样处置巨龙，谁也不知道。
