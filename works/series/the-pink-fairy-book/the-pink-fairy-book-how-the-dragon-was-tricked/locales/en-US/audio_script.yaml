audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and mellow
        pace: measured
        pitch: medium
    youth:
      display_name: Young Man
      tts:
        delivery: quick-witted, bold, and self-assured
        timbre: clear and youthful
        pace: lively
        pitch: medium
    shepherd:
      display_name: Shepherd
      tts:
        delivery: trusting and eager
        timbre: rough and elderly
        pace: unhurried
        pitch: medium-low
    king:
      display_name: King
      tts:
        delivery: commanding, severe, and impatient
        timbre: full and authoritative
        pace: measured
        pitch: low
    dragon:
      display_name: Dragon
      tts:
        delivery: booming, possessive, and easily provoked
        timbre: deep and gravelly
        pace: deliberate
        pitch: very low
  chapters:
    - id: ch01
      title: The Brothers and the Shepherd
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a man had two sons who could never get along. The younger son was much handsomer, and his elder brother was bitterly jealous. As the brothers grew older, things between them only became worse. One day, while they were walking through a wood, the elder brother seized the younger one. He tied him to a tree and went away, hoping he would starve there.
        - id: ch01-b02
          speaker: narrator
          text: Before long, an old shepherd with a crooked back came past with his flock. He saw the prisoner and stopped.
        - id: ch01-b03
          speaker: shepherd
          text: Tell me, my son. Why are you tied to that tree?
        - id: ch01-b04
          speaker: youth
          text: I was tied here because my back was crooked. Look at me now. It has cured me, and my back is perfectly straight.
        - id: ch01-b05
          speaker: shepherd
          text: Then please tie me to a tree too. I want my back to grow straight.
        - id: ch01-b06
          speaker: youth
          text: Gladly. Just loosen these ropes, and I will bind you with them as firmly as I can.
        - id: ch01-b07
          speaker: narrator
          text: The shepherd quickly set him free. The young man tied the old shepherd in his place, drove away the sheep, and left their true master regretting his foolishness. He had not gone far when he met a boy leading horses and a man driving oxen. He talked them into joining him, and together they went off in search of adventures.
    - id: ch02
      title: The Flying Horse
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Tricks like these soon made the young man famous. At last, word of him reached the king. The king was curious to meet the man who had outwitted everyone, so he ordered his guards to seize the youth and bring him to the palace.
        - id: ch02-b02
          speaker: king
          text: Your tricks and all the trouble you have caused have cost you your life in the eyes of the law. I will spare you on one condition. Bring me the great dragon's flying horse. If you fail, I will have you cut into a thousand pieces.
        - id: ch02-b03
          speaker: youth
          text: If that is all you want, you will soon have him.
        - id: ch02-b04
          speaker: narrator
          text: The young man went straight to the stable where the flying horse stood tethered. He carefully reached for the bridle, but the horse suddenly neighed as loudly as he could. The dragon slept in a room just above the stable. The noise woke him.
        - id: ch02-b05
          speaker: dragon
          text: What is wrong, my treasure? Is something hurting you?
        - id: ch02-b06
          speaker: narrator
          text: The young man waited a little, then tried once more to free the horse. Again, the horse neighed so loudly that the dragon woke with a start and called down to ask what all the noise was about. When it happened a third time, the dragon lost his temper. He stormed into the stable, took up a whip, and gave the horse a hard beating.
        - id: ch02-b07
          speaker: narrator
          text: The horse was angry and offended. So when the young man reached out again and untied him, he made no more fuss. He allowed himself to be led quietly away. As soon as they were clear of the stable, the youth leaped onto his back and galloped off.
        - id: ch02-b08
          speaker: youth
          text: Dragon! Dragon! If anyone asks where your horse has gone, tell them I have him!
    - id: ch03
      title: The Covering with Bells
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The young man brought the flying horse to the king, but the king was not satisfied.
        - id: ch03-b02
          speaker: king
          text: The flying horse is all very well, but I want more. Bring me the covering with the little bells from the dragon's bed, or I will have you cut into a thousand pieces.
        - id: ch03-b03
          speaker: youth
          text: Is that all? I can do that easily.
        - id: ch03-b04
          speaker: narrator
          text: That night, the youth went to the dragon's house and climbed onto the roof. He opened a small roof window and lowered the chain that usually held the cooking kettle. With its hook, he caught the bed covering and began to pull it upward. But the little bells sewn onto it all started ringing.
        - id: ch03-b05
          speaker: narrator
          text: The dragon woke. Thinking his wife had pulled the bedclothes away, he seized the covering and dragged it back toward himself. As he pulled, the chain drew the young man down through the window and into the room. The dragon threw himself upon the intruder and tied him tightly with ropes.
        - id: ch03-b06
          speaker: dragon
          text: Tomorrow, when I go to church, you will stay here. Kill this fellow and cook him. When I return, we will eat him together.
        - id: ch03-b07
          speaker: narrator
          text: The next morning, the dragoness took hold of the prisoner and reached for a sharp knife on the shelf. She meant to kill him, but first she loosened his ropes so she could handle him more easily. The instant his bonds came free, he caught her by the legs and threw her to the floor. He seized the knife, cut her throat just as she had meant to cut his, and put her body into the oven. Then he snatched up the bell-covered cloth and carried it back to the palace.
        - id: ch03-b08
          speaker: narrator
          text: The king was sitting on his throne when the youth appeared. With a deep bow, the young man spread the covering before him.
    - id: ch04
      title: The Beggar at the Dragon's House
      blocks:
        - id: ch04-b01
          speaker: king
          text: This is still not enough. Bring me the dragon himself, or I will have you cut into a thousand pieces.
        - id: ch04-b02
          speaker: youth
          text: I will do it. But you must give me two years. My beard needs time to grow, so the dragon will not recognize me.
        - id: ch04-b03
          speaker: king
          text: So be it.
        - id: ch04-b04
          speaker: narrator
          text: Two years passed, and the young man's beard grew long. Then he set out for the dragon's house. On the road, he met a beggar and persuaded the man to trade clothes with him. Dressed in rags, the youth went boldly onward.
        - id: ch04-b05
          speaker: narrator
          text: He found the dragon outside his house, hard at work making a box. The disguised young man greeted him politely.
        - id: ch04-b06
          speaker: youth
          text: Good morning, your worship. Could you spare me a piece of bread?
        - id: ch04-b07
          speaker: dragon
          text: You will have to wait until I finish this box. Then I will see whether I can find you some.
        - id: ch04-b08
          speaker: youth
          text: What are you going to do with the box when it is finished?
        - id: ch04-b09
          speaker: dragon
          text: It is for the young man who killed my wife and stole my flying horse and my bed covering.
        - id: ch04-b10
          speaker: youth
          text: After such a wicked deed, he deserves it. But that box is much too small. The man you want is a big fellow.
        - id: ch04-b11
          speaker: dragon
          text: You are mistaken. This box is large enough even for me.
        - id: ch04-b12
          speaker: youth
          text: Well, that rogue is almost as tall as you are. If you can fit inside, then he can too. Still, I am sure it would be a tight squeeze for you.
        - id: ch04-b13
          speaker: dragon
          text: Nonsense. There is plenty of room.
        - id: ch04-b14
          speaker: narrator
          text: To prove it, the dragon carefully tucked himself into the box.
    - id: ch05
      title: The Dragon in the Box
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The moment the dragon was completely inside, the young man slammed down the lid.
        - id: ch05-b02
          speaker: youth
          text: Now push against it as hard as you can. We need to know whether that man could break his way out.
        - id: ch05-b03
          speaker: narrator
          text: The dragon pressed upward with all his strength, but the lid did not move.
        - id: ch05-b04
          speaker: dragon
          text: It works! You can open the box now.
        - id: ch05-b05
          speaker: narrator
          text: Instead of opening it, the youth drove long nails through the lid and fastened it more tightly than before. Then he lifted the box onto his back and carried the trapped dragon all the way to the king.
    - id: ch06
      title: The King's Last Look
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: When the king heard that the dragon was truly inside the box, he became so excited that he could not wait another moment. He broke the lock and raised the lid just a little, wanting to see the prisoner for himself.
        - id: ch06-b02
          speaker: narrator
          text: The king was careful not to make an opening wide enough for the dragon to climb out. But there was just enough room for the dragon's enormous mouth. With one snap of his wide red jaws, he swallowed the king, and the king vanished.
        - id: ch06-b03
          speaker: narrator
          text: After that, the young man married the king's daughter and ruled the land. But what he did with the dragon, nobody knows.
