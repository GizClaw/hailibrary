audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    man:
      display_name: "男人"
      tts:
        delivery: "朴实坚忍，危急时紧张急促"
        timbre: "厚实略带沙哑的男声"
        pace: "适中"
        pitch: "中低音"
    wife:
      display_name: "妻子"
      tts:
        delivery: "任性直率，口渴时焦灼迫切"
        timbre: "清楚有力的女声"
        pace: "稍快"
        pitch: "中音"
    nyamatsane_1:
      display_name: "尼亚马察内兽甲"
      tts:
        delivery: "警觉粗野，声音响亮"
        timbre: "粗重的中性声"
        pace: "稍快"
        pitch: "中低音"
    nyamatsane_2:
      display_name: "尼亚马察内兽乙"
      tts:
        delivery: "警觉急躁，语气生硬"
        timbre: "干涩的中性声"
        pace: "稍快"
        pitch: "中音"
    nyamatsane_3:
      display_name: "尼亚马察内兽丙"
      tts:
        delivery: "警觉凶猛，带着低沉咆哮"
        timbre: "低沉的中性声"
        pace: "适中"
        pitch: "低音"
    neighbor:
      display_name: "邻居"
      tts:
        delivery: "直爽警惕，不肯退让"
        timbre: "明亮结实的女声"
        pace: "适中"
        pitch: "中音"
    big_lion:
      display_name: "大狮子"
      tts:
        delivery: "威严自负，发怒时低声咆哮"
        timbre: "浑厚洪亮的男声"
        pace: "沉稳"
        pitch: "低音"
    little_hare:
      display_name: "小野兔"
      tts:
        delivery: "机灵狡猾，得意时轻快放肆"
        timbre: "灵巧清亮的男声"
        pace: "轻快多变"
        pitch: "中高音"
    rabbit:
      display_name: "兔子"
      tts:
        delivery: "老实谨慎，受骗后委屈冷淡"
        timbre: "柔和朴实的男声"
        pace: "适中"
        pitch: "中音"
    long_eared_beast:
      display_name: "长耳朵的野兽"
      tts:
        delivery: "认真警醒，语气直接"
        timbre: "清晰的中性声"
        pace: "适中"
        pitch: "中音"
    beast_1:
      display_name: "野兽甲"
      tts:
        delivery: "守规矩而严肃"
        timbre: "结实的中性声"
        pace: "适中"
        pitch: "中音"
    beast_2:
      display_name: "野兽乙"
      tts:
        delivery: "谨慎而顺从"
        timbre: "清亮的中性声"
        pace: "适中"
        pitch: "中音"
    beast_3:
      display_name: "野兽丙"
      tts:
        delivery: "沉稳而警觉"
        timbre: "低柔的中性声"
        pace: "适中"
        pitch: "中低音"
    monkey:
      display_name: "猴妈妈"
      tts:
        delivery: "聪明谨慎，反应敏捷"
        timbre: "灵活清脆的女声"
        pace: "稍快"
        pitch: "中高音"
    hyena_daughter:
      display_name: "鬣狗小姑娘"
      tts:
        delivery: "年轻机敏，惊讶却笃定"
        timbre: "清亮稚嫩的女声"
        pace: "稍快"
        pitch: "高音"
    hyena_father:
      display_name: "鬣狗父亲"
      tts:
        delivery: "迟疑固执，后来羞愤"
        timbre: "粗哑的男声"
        pace: "适中"
        pitch: "中低音"
    hyena_friend:
      display_name: "鬣狗朋友"
      tts:
        delivery: "审慎果断"
        timbre: "干脆的男声"
        pace: "适中"
        pitch: "中音"
    hyena_1:
      display_name: "鬣狗甲"
      tts:
        delivery: "畏惧中带着戒备"
        timbre: "粗糙的中性声"
        pace: "稍快"
        pitch: "中音"
    hyena_2:
      display_name: "鬣狗乙"
      tts:
        delivery: "紧张多疑"
        timbre: "尖涩的中性声"
        pace: "稍快"
        pitch: "中高音"
    hyena_3:
      display_name: "鬣狗丙"
      tts:
        delivery: "胆怯而服从"
        timbre: "低哑的中性声"
        pace: "适中"
        pitch: "中低音"
  chapters:
    - id: ch01
      title: "尼亚马察内兽的肝"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "在很远很远的地方，有一片水源稀少的土地。那里住着一对夫妻，还有他们的几个孩子。一天，妻子忽然对丈夫说，她馋尼亚马察内兽的肝，非拿它当晚饭不可。"
        - id: ch01-b02
          speaker: wife
          text: "你要是真像自己说的那么爱我，就去猎一只尼亚马察内兽，把它的肝带回来。你要是不去，我就知道，你的爱一点也不稀罕。"
        - id: ch01-b03
          speaker: man
          text: "烤些面包，把面包皮装进这个小袋子。"
        - id: ch01-b04
          speaker: narrator
          text: "妻子照办了。她把袋子塞得满满的，交给丈夫。"
        - id: ch01-b05
          speaker: wife
          text: "袋子准备好了。"
        - id: ch01-b06
          speaker: man
          text: "很好。那我走了，我去找尼亚马察内兽。"
        - id: ch01-b07
          speaker: narrator
          text: "尼亚马察内兽可不像妻子盼望的那么好找。男人不停地往前走，走了很久，始终一只也没见着。每隔一阵，他就饿得实在撑不住，只好从袋里拿出一块面包皮吃。后来，他累得快要倒下，终于来到一大片沼泽边。沼泽一侧就是尼亚马察内兽的国土，可那里仍旧空空荡荡，半只尼亚马察内兽的影子也没有。"
        - id: ch01-b08
          speaker: narrator
          text: "原来，尼亚马察内兽的食物吃光了，它们全都出门打猎，只留下年迈虚弱、从不出屋的祖母。男人觉得这是天大的好运。他赶紧杀死老太婆，取出她的肝，又披上她的皮，尽力扮成她的样子。"
        - id: ch01-b09
          speaker: narrator
          text: "他刚刚收拾妥当，就听见尼亚马察内兽们回来了。它们最疼爱祖母，从来不肯在外多待。一群家伙噼里啪啦冲进小屋，立刻闻到了异样。"
        - id: ch01-b10
          speakers: [nyamatsane_1, nyamatsane_2, nyamatsane_3]
          ensemble: chorus
          text: "有人肉的味道！这里藏着人！"
        - id: ch01-b11
          speaker: man
          text: "没有啊，孩子们，没有。人怎么会跑到这里来呢？"
        - id: ch01-b12
          speaker: narrator
          text: "他故意把声音抖得像个老太婆。可尼亚马察内兽们不肯罢休，翻遍所有柜子，又查看每张床底。"
        - id: ch01-b13
          speakers: [nyamatsane_1, nyamatsane_2, nyamatsane_3]
          ensemble: chorus
          text: "这里有人！这里有人！"
        - id: ch01-b14
          speaker: narrator
          text: "它们怎么也找不到人，加上打猎累了一整天，最后只好蜷起身子睡着了。"
        - id: ch01-b15
          speaker: narrator
          text: "第二天早晨，它们醒来后精神十足，又要出去打猎。只是放心不下祖母，便请她一起去吃东西。它们把祖母带到屋外，饿着肚子嚼起小石子。男人装作跟着吃，其实把石头塞进袋里，偷偷咽下的是面包皮。"
        - id: ch01-b16
          speakers: [nyamatsane_1, nyamatsane_2, nyamatsane_3]
          ensemble: chorus
          text: "祖母，您今天跟我们一起吃吧。"
        - id: ch01-b17
          speaker: narrator
          text: "尼亚马察内兽没有看见他的小动作，自然没发现眼前的祖母是假的。吃了许多石子以后，它们觉得这一天已经吃够了，便一起回屋，蜷起身子睡觉。第二天醒来，它们提议跳沟取乐，一只接一只纵身跃起，每次都稳稳落到另一边。它们还央求祖母也跳。男人拼尽全力，竟真的越过了沟。尼亚马察内兽们这才彻底相信他就是祖母，放心地出门打猎，把他独自留在小屋里。"
        - id: ch01-b18
          speaker: narrator
          text: "它们一走远，男人马上取出藏好的肝，脱掉老太婆的皮，拼命逃跑。途中，他捡到一颗光彩耀眼、溜滑圆润的小石子，就把它放进袋里，跟那副肝搁在一起。"
    - id: ch02
      title: "光滑的巨岩"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "傍晚，尼亚马察内兽们惦记着祖母，匆匆赶回小屋。一进门，它们便看见祖母的皮躺在地上，顿时明白自己上了当。"
        - id: ch02-b02
          speakers: [nyamatsane_1, nyamatsane_2, nyamatsane_3]
          ensemble: chorus
          text: "我们果然没闻错，那就是人肉的气味！"
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: "它们低头搜寻，很快找到了男人的脚印，立刻怒气冲冲地追上去。那时男人已经走出许多英里，正觉得安全了一些，身上也舒服多了。谁知他偶然回头一看，远处有一团浓浓的尘云，正以惊人的速度向他逼近。他的心几乎不跳了。"
        - id: ch02-b04
          speaker: man
          text: "我完了。是那些尼亚马察内兽，它们会把我撕碎的。"
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: "尼亚马察内兽越来越近，仿佛下一刻就能把他吞下去。男人只剩最后一个办法。他从袋里摸出那颗小石子，扔到地上。石子刚碰到泥土，就变成一块四壁陡峭、光滑如镜的巨岩，男人已经坐到了岩顶。"
        - id: ch02-b06
          speaker: narrator
          text: "尼亚马察内兽拼命想爬到岩顶抓住他，却一次次滑落下来，而且下滑时比攀爬时快得多。折腾到太阳落山，它们终于累得筋疲力尽，倒在岩脚睡着。它们才一入睡，男人就轻手轻脚地爬下岩石，两条腿能跑多快就跑多快。等追兵醒来，他早已逃到了很远的地方。"
        - id: ch02-b07
          speaker: narrator
          text: "尼亚马察内兽们一跃而起，嗅遍岩石四周的泥土，重新找到男人留下的脚印，又以可怕的速度飞奔追去。这场追逐持续了好几个白天和黑夜。它们有好几次几乎伸手就能抓住男人，可每到危急关头，那颗神奇的小石子都会再次救他脱险。"
        - id: ch02-b08
          speaker: narrator
          text: "男人在恐惧中不停赶路，身上又累到了极点，几乎只剩下半条命，总算看见了自己的村庄。村中每条道路上都有成群的狗，那正是尼亚马察内兽最害怕的仇敌。追兵不敢再往前走，只得放弃男人，掉头返回自己的家。"
        - id: ch02-b09
          speaker: narrator
          text: "男人踉跄着走进自家小屋。"
        - id: ch02-b10
          speaker: man
          text: "伊丘！我累坏了！快给我水喝，再去找柴，把火生起来。"
        - id: ch02-b11
          speaker: narrator
          text: "妻子照他说的做了。男人取出尼亚马察内兽的肝，递给她。"
        - id: ch02-b12
          speaker: man
          text: "你要的东西，我带回来了。现在你知道我是真心爱你了吧。"
        - id: ch02-b13
          speaker: wife
          text: "很好。你带孩子们出去，让我一个人待在屋里。"
        - id: ch02-b14
          speaker: narrator
          text: "妻子取下旧石锅，把肝煮上。男人看了她一会儿，又特意叮嘱她。"
        - id: ch02-b15
          speaker: man
          text: "这副肝全归你。别分给孩子，一口也别剩。"
        - id: ch02-b16
          speaker: narrator
          text: "妻子果然独自吃光了整副肝。最后一口才咽下去，她便渴得受不了。她抓起一大罐水，一气喝光。家里没水了，她又冲到隔壁去求邻居。"
        - id: ch02-b17
          speaker: wife
          text: "邻居，求你给我些水喝。"
        - id: ch02-b18
          speaker: narrator
          text: "邻居给她满满一大容器水，她转眼喝完，还伸手再要。"
        - id: ch02-b19
          speaker: neighbor
          text: "不能再给了，不然我的孩子就没水喝。"
        - id: ch02-b20
          speaker: narrator
          text: "女人只好又闯进另一户人家，把能找到的水全喝掉，可她越喝越渴。她就这样走遍整个村庄，喝干每一只水罐。接着，她冲到最近的泉边，把泉水也吞得一滴不剩。附近所有泉眼和水井都干了，她又先喝光一条河，再喝干一座湖。等到这时，她肚里的水实在太多，已经倒在地上起不来了。"
    - id: ch03
      title: "湖边的诬告"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "傍晚，到了动物们睡前饮水的时候，它们来到湖边，却发现整座湖已经干了。大家只好忍着口渴，等水重新流来，溪流再次充盈。后来水虽然回来了，湖里仍有很长一阵浑浊不堪。百兽之王大狮子便下令，湖水没有完全澄清以前，谁也不许喝。"
        - id: ch03-b02
          speaker: narrator
          text: "小野兔偏偏爱由着自己的性子来，而且渴得厉害。等其他动物全都回到洞里睡熟，他独自悄悄溜出去，爬到湖边，把水喝了个痛快。喝完以后，他又把浑浊的泥水抹满兔子的脸和爪子，想叫大家以为，违抗大狮子命令的正是兔子。"
        - id: ch03-b03
          speaker: narrator
          text: "第二天天一亮，大狮子带着所有野兽直奔湖边。他一眼看出水又浑了，气得怒吼。"
        - id: ch03-b04
          speaker: big_lion
          text: "是谁喝了我的水？"
          emotion: angry
        - id: ch03-b05
          speaker: little_hare
          text: "看兔子！准是他干的。他脸上和爪子上全是泥！"
        - id: ch03-b06
          speaker: rabbit
          text: "不，不是我！我真的没有喝！"
          emotion: fearful
        - id: ch03-b07
          speaker: narrator
          text: "兔子吓得魂不附体，拼命否认，可大狮子根本不肯听，命令大家用桦树条狠狠抽他。小野兔看着兔子代替自己挨了打，觉得这一计聪明极了。此后他四处夸耀自己的本事，终于被另一只动物听见了。"
        - id: ch03-b08
          speaker: beast_1
          text: "小野兔，你刚才说什么？"
        - id: ch03-b09
          speaker: little_hare
          text: "我只是请你把手杖递给我。"
        - id: ch03-b10
          speaker: narrator
          text: "过了一两个钟头，小野兔以为旁边没人，又低声说出了真相。"
        - id: ch03-b11
          speaker: little_hare
          text: "水是我喝的，可我让大家以为是兔子喝的。"
        - id: ch03-b12
          speaker: narrator
          text: "偏偏一只耳朵很长的野兽听见了，马上去告诉大狮子。"
        - id: ch03-b13
          speaker: long_eared_beast
          text: "您听见小野兔说什么了吗？"
        - id: ch03-b14
          speaker: narrator
          text: "大狮子把小野兔叫来，问他那句话是什么意思。小野兔知道瞒不过去了，仍旧回答得十分放肆。"
        - id: ch03-b15
          speaker: little_hare
          text: "水就是我喝的，可我让你们以为是兔子喝的。"
        - id: ch03-b16
          speaker: narrator
          text: "话音刚落，他转身就跑，所有野兽一起追了上去。它们越追越近，眼看就要抓住他，小野兔猛地钻进岩石上一道极窄的裂缝。那道缝实在太小，别的野兽谁也进不去。可小野兔逃得太急，把一只长耳朵留在了外面，恰好被它们一把抓住。大家用尽力气往外拉，始终拖不出他，最后只好放弃。等它们走后，他那只耳朵已经被扯得又破又伤。"
        - id: ch03-b17
          speaker: narrator
          text: "等最后一条尾巴也看不见了，小野兔才小心爬出来。迎面来的正是兔子。小野兔脸皮厚得惊人，竟装作什么也没发生。"
        - id: ch03-b18
          speaker: little_hare
          text: "好兔子，你看，我也跟你一样挨打了。"
        - id: ch03-b19
          speaker: rabbit
          text: "你把我害得太惨了。明明是你喝了水，却诬赖我。"
          emotion: angry
        - id: ch03-b20
          speaker: little_hare
          text: "好兔子，别再计较了！我有个了不起的秘密。你知道怎样才能逃过一死吗？"
        - id: ch03-b21
          speaker: rabbit
          text: "我不知道。"
        - id: ch03-b22
          speaker: little_hare
          text: "那我们先挖一个坑。"
    - id: ch04
      title: "兔骨笛子"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "他们挖好坑，小野兔又叫兔子在坑里生火。两人捡来木柴，燃起很大一堆火。火烧旺以后，小野兔说出了下一步。"
        - id: ch04-b02
          speaker: little_hare
          text: "朋友，把我扔进火里。等我的皮毛噼啪作响，我再喊‘伊奇，伊奇’，你就赶快把我拉出来。"
        - id: ch04-b03
          speaker: narrator
          text: "兔子照办了。小野兔一感觉到火焰的热气，就拿出事先采好的新鲜月桂叶，伸进火里。叶子顿时噼啪爆响。"
        - id: ch04-b04
          speaker: little_hare
          text: "伊奇，伊奇！兔子朋友，快来拉我！你没听见我的皮都烧得噼啪响了吗？"
        - id: ch04-b05
          speaker: narrator
          text: "兔子急忙把他拉了出来。"
        - id: ch04-b06
          speaker: little_hare
          text: "现在轮到你了！"
        - id: ch04-b07
          speaker: narrator
          text: "小野兔把兔子扔进火里。火焰刚碰到身上，兔子便大声呼救。"
        - id: ch04-b08
          speaker: rabbit
          text: "伊奇，伊奇，我烧起来了！朋友，快把我拉出去！"
          emotion: fearful
        - id: ch04-b09
          speaker: narrator
          text: "小野兔只顾哈哈大笑。"
        - id: ch04-b10
          speaker: little_hare
          text: "不，你就待在里面吧！谁叫你蠢到肯让人扔进火里？难道你不知道火会烧人吗？这是你自找的。"
        - id: ch04-b11
          speaker: narrator
          text: "没过几分钟，兔子只剩下几根骨头。等火完全熄灭，小野兔捡起一根兔骨，做成笛子，唱起歌来。"
        - id: ch04-b12
          speaker: little_hare
          text: "噼，噼，我心爱的笛儿响。噼，噼，兔子不过是小儿郎。他若能，早把我烧伤。如今我烧了他，噼啪响得真叫响。"
          emotion: happy
        - id: ch04-b13
          speaker: narrator
          text: "他吹着笛子走遍四方，直到把这支歌唱腻，才回到朋友们那里，做了大狮子的仆从。一天，他向主人献上一条妙计。"
        - id: ch04-b14
          speaker: little_hare
          text: "祖父，我教您一个猎取野兽的好办法，怎么样？"
        - id: ch04-b15
          speaker: big_lion
          text: "什么办法？"
        - id: ch04-b16
          speaker: little_hare
          text: "我们挖一条沟，您躺进去装死。"
        - id: ch04-b17
          speaker: narrator
          text: "大狮子照办了。等他躺好，小野兔爬上墙，吹响号角，朝四面八方喊起来。"
        - id: ch04-b18
          speaker: little_hare
          text: "噼，噼，所有动物都来看！大狮子死了，太平日子到眼前！"
        - id: ch04-b19
          speaker: narrator
          text: "动物们一听见这个消息，立刻从四面八方跑来。小野兔迎在门口，把它们一个个领进动物王国。猴妈妈最后才出现，其他动物已经全都进去了。"
        - id: ch04-b20
          speaker: little_hare
          text: "往前走，狮子就在这边。"
        - id: ch04-b21
          speaker: narrator
          text: "猴妈妈最后才到，背上还驮着孩子。她来到沟边，摘下一根草叶，轻轻搔大狮子的鼻子。大狮子拼命忍着，鼻孔还是动了。"
        - id: ch04-b22
          speaker: monkey
          text: "孩子，快爬到我背上，我们走！哪有尸体被草一搔，还能感觉到的？"
          emotion: fearful
        - id: ch04-b23
          speaker: narrator
          text: "猴妈妈带着孩子逃走了。小野兔随即叫其他动物关门。大门关紧，外面又堵上巨石。"
        - id: ch04-b24
          speaker: little_hare
          text: "把动物王国的大门关上！好了，祖父，动手！"
        - id: ch04-b25
          speaker: narrator
          text: "大狮子猛然跃出沟，把困在里面的动物全都撕成了碎片。"
    - id: ch05
      title: "冰雹下的大狮子"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "大狮子把所有上好的肉块都留给自己，只肯把不爱吃的小碎块分出去。小野兔分到的自然也是这些残余。他越想越气，决定好好报复一番。很久以前，他就看出大狮子特别容易受骗，于是专门依着这个弱点，很快想好了计策。"
        - id: ch05-b02
          speaker: little_hare
          text: "祖父，我们盖间小屋吧。"
        - id: ch05-b03
          speaker: narrator
          text: "大狮子答应了。他们把一根根木桩打进地里，又筑起四面的屋墙。等这些活都做完，小野兔叫大狮子爬到屋顶上，自己留在小屋里面。当地的屋顶一向要用芦苇铺盖。大狮子在上面准备好以后，小野兔便朝他喊话，叫他开工。"
        - id: ch05-b04
          speaker: little_hare
          text: "祖父，可以开始了。"
        - id: ch05-b05
          speaker: narrator
          text: "大狮子把一根长棍从芦苇间穿进屋里。小野兔接过来，又把它往屋顶捅回去，还狠狠戳了一下大狮子的尾巴。"
        - id: ch05-b06
          speaker: little_hare
          text: "现在轮到我从里面穿过去。"
        - id: ch05-b07
          speaker: big_lion
          text: "什么东西在扎我？"
        - id: ch05-b08
          speaker: little_hare
          text: "只是一根伸出来的小树枝。我马上把它折掉。"
        - id: ch05-b09
          speaker: narrator
          text: "其实，小野兔是故意的。他想把大狮子的尾巴牢牢固定在小屋上，让他再也动不了。过了一会儿，小野兔又戳一下。"
        - id: ch05-b10
          speaker: big_lion
          text: "又是什么东西在扎我？"
        - id: ch05-b11
          speaker: narrator
          text: "小野兔担心大狮子看穿他的把戏，马上换了个办法。"
        - id: ch05-b12
          speaker: little_hare
          text: "祖父，把舌头放到这里来吧，这样树枝就碰不到您了。"
        - id: ch05-b13
          speaker: narrator
          text: "大狮子伸出舌头，小野兔立刻把它紧紧绑在屋墙的木桩上。随后，他走到外面。"
        - id: ch05-b14
          speaker: little_hare
          text: "祖父，您现在可以下来了。"
        - id: ch05-b15
          speaker: narrator
          text: "大狮子使劲挣扎，却连一寸也动不了。小野兔就在他眼前慢慢吃光他的晚饭，任凭他愤怒地咆哮。吃完以后，小野兔爬上屋顶，吹响那支兔骨笛。"
        - id: ch05-b16
          speaker: little_hare
          text: "噼，噼，雨落下，冰雹落下！"
        - id: ch05-b17
          speaker: narrator
          text: "转眼间，乌云铺满天空，雷声轰鸣。硕大的冰雹砸下来，把屋顶盖得一片雪白。小野兔躲进屋里，还故意招呼大狮子。"
        - id: ch05-b18
          speaker: little_hare
          text: "大狮子，快下来跟我一起吃饭！"
        - id: ch05-b19
          speaker: narrator
          text: "屋顶没有回答，连一声咆哮也听不见。大狮子已经被冰雹砸死了。"
    - id: ch06
      title: "披着狮皮的野兔"
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "小野兔在屋里快活地住了好一阵。这里吃喝不愁，要得到食物也不用费半点力气。一天，忽然刮起一阵大风，把晾在屋顶、还没有完全干透的狮皮掀落下来。狮皮掉下时发出一声大响，小野兔吓得蹦起老高，还以为大狮子又活过来了。等他看清是怎么回事，便把狮皮仔细清理干净，又用木棍撑开狮口，好让自己能从那里钻进去。"
        - id: ch06-b02
          speaker: narrator
          text: "小野兔披着大狮子的皮出门旅行，首先来到鬣狗的村庄。鬣狗们一见这头可怕的猛兽，全都吓得发抖。"
        - id: ch06-b03
          speakers: [hyena_1, hyena_2, hyena_3]
          ensemble: chorus
          text: "我们怎样才能从他手里逃命？"
          emotion: fearful
        - id: ch06-b04
          speaker: narrator
          text: "小野兔根本不把它们放在心上。他只问清鬣狗之王住在哪里，随后便大模大样地住进王家，就像待在自己家里一样。每天早晨醒来，每只鬣狗都会暗暗想着，那个可怕的家伙今天准会吃掉自己。可是一天又一天过去，它们竟然都还活着。"
        - id: ch06-b05
          speaker: narrator
          text: "一天傍晚，小野兔正想找点乐子，看见一口盛满滚水的大锅。他走到一只鬣狗跟前。"
        - id: ch06-b06
          speaker: little_hare
          text: "进去。"
        - id: ch06-b07
          speaker: narrator
          text: "那只鬣狗吓得根本不敢违抗，只好爬进滚水，没过几分钟便被活活烫死。小野兔接着走遍整个村庄，每逢遇见一只鬣狗，就命令对方钻进那口滚水锅。没有谁敢说不。过了不久，村里的雄鬣狗已经几乎一个也不剩了。"
        - id: ch06-b08
          speaker: narrator
          text: "一天清早，活着的鬣狗全去了田野，只留下一个小女儿。小野兔以为四下无人，走进围栏，脱下狮皮。他想重新尝尝做野兔的滋味，于是又蹦又跳，唱起歌来。"
        - id: ch06-b09
          speaker: little_hare
          text: "我就是小野兔，小野兔，小野兔！我就是杀死大鬣狗的小野兔！"
          emotion: happy
        - id: ch06-b10
          speaker: hyena_daughter
          text: "什么？杀死我们那么多好汉的，真是这个小不点儿？"
          emotion: surprised
        - id: ch06-b11
          speaker: narrator
          text: "突然一阵风吹来，围栏周围的芦苇沙沙作响。小野兔吓了一跳，连忙钻回狮皮。鬣狗们回家以后，小姑娘立刻告诉父亲。"
        - id: ch06-b12
          speaker: hyena_daughter
          text: "爸爸，我们这一族差点被杀光，全是一只披着狮皮的小东西干的。"
        - id: ch06-b13
          speaker: hyena_father
          text: "好孩子，你根本不知道自己在说什么。"
        - id: ch06-b14
          speaker: hyena_daughter
          text: "是真的，爸爸。我亲眼看见了。"
        - id: ch06-b15
          speaker: narrator
          text: "父亲拿不定主意，就把这件事告诉一个朋友。"
        - id: ch06-b16
          speaker: hyena_friend
          text: "明天我们亲自藏起来看看。"
        - id: ch06-b17
          speaker: narrator
          text: "第二天，两只鬣狗躲在暗处，等小野兔走出王家的小屋。他兴冲冲来到围栏，脱下狮皮，又像上次那样边跳边唱。"
        - id: ch06-b18
          speaker: little_hare
          text: "我就是小野兔，小野兔，小野兔！我就是杀死大鬣狗的小野兔！"
          emotion: happy
        - id: ch06-b19
          speaker: narrator
          text: "当天夜里，两只亲眼看见真相的鬣狗把所有同伴叫到一起，告诉大家，那头所谓的狮子究竟是什么东西。"
        - id: ch06-b20
          speaker: hyena_father
          text: "你们知道吗？我们竟让一个可恶的小东西欺负成这样。他身上属于狮子的，只有那张皮！"
          emotion: angry
    - id: ch07
      title: "磨刀石旁的逃脱"
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: "那天晚上，晚饭还在锅里煮，大家都没有睡。小野兔披着狮皮，仍旧摆出凶恶可怕的样子，照常命令一只鬣狗。"
        - id: ch07-b02
          speaker: little_hare
          text: "到滚水里去。"
        - id: ch07-b03
          speaker: narrator
          text: "鬣狗一动不动。四周安静了片刻，另一只鬣狗突然捡起石头，使出全身力气砸向狮皮。小野兔从狮口里一跃而出，像闪电一样逃走。所有鬣狗大声吼叫着追在后面。"
        - id: ch07-b04
          speaker: narrator
          text: "拐过一个弯，小野兔割掉自己的两只耳朵，好让追兵认不出他。路旁正好有一块磨刀石，他便停下来，装作在那里干活。"
        - id: ch07-b05
          speaker: hyena_1
          text: "朋友，你看见小野兔从这里跑过去了吗？"
        - id: ch07-b06
          speaker: little_hare
          text: "没有，我谁也没看见。"
        - id: ch07-b07
          speakers: [hyena_1, hyena_2, hyena_3]
          ensemble: chorus
          text: "他会躲到哪里去呢？这个家伙当然不是他，一点也不像小野兔。"
        - id: ch07-b08
          speaker: narrator
          text: "鬣狗们继续往前追，可怎么也找不到小野兔的踪迹。最后，它们只得垂头丧气地回村，一路都在懊恼。"
        - id: ch07-b09
          speakers: [hyena_1, hyena_2, hyena_3]
          ensemble: chorus
          text: "想想看，我们竟让那么一个可恶的小东西杀得七零八落！"
          emotion: angry
