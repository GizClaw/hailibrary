  chapters:
    - id: ch01
      title: The Trunk That Could Fly
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There was once a merchant so rich that he could have covered a whole street in silver, with enough left for a little side street too. But he knew better ways to spend his money. Whenever he paid out a shilling, a florin came back. He was an excellent merchant, right up to the day he died.
        - id: ch01-b02
          speaker: narrator
          text: His son inherited everything and spent it merrily. He went to the theater every night. He made paper kites from five-pound notes and skipped sovereigns over the water instead of stones. His fortune could not last long that way, and soon it was gone.
        - id: ch01-b03
          speaker: narrator
          text: At last, he owned only four shillings, a pair of slippers, and an old dressing gown. His friends stopped caring about him. They would not even be seen walking beside him in the street.
        - id: ch01-b04
          speaker: narrator
          text: One friend was kinder than the rest. He sent over an old trunk with a short message.
        - id: ch01-b05
          speaker: narrator
          text: The message said, "Pack up!"
        - id: ch01-b06
          speaker: narrator
          text: That sounded sensible, except the young man had nothing to pack. So he climbed into the trunk himself.
        - id: ch01-b07
          speaker: narrator
          text: This was no ordinary trunk. The moment he pressed the lock, it flew. Up the chimney it carried him, high among the clouds and farther and farther away. Each time the bottom creaked, he trembled. If the trunk broke apart, he would tumble head over heels through the sky. Just imagine that!
        - id: ch01-b08
          speaker: narrator
          text: At last, he came down in the land of the Turks. He covered the trunk with dry leaves in a wood and walked into town. His clothes did not look strange there at all, because everyone around him wore dressing gowns and slippers.
    - id: ch02
      title: The Princess in the Tower
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: In the street, he met a nurse carrying a little child. He pointed to a great castle just outside the town. Its windows were set very high.
        - id: ch02-b02
          speaker: merchant_son
          text: Hello there, Turkish nurse. Who lives in that great castle with the high windows?
        - id: ch02-b03
          speaker: nurse
          text: The sultan's daughter lives there. A prophecy says she will be very unlucky in her husband, so no one may see her unless the sultan and sultana are there.
        - id: ch02-b04
          speaker: merchant_son
          text: Thank you.
        - id: ch02-b05
          speaker: narrator
          text: He hurried back to the wood, sat inside his trunk, and flew onto the castle roof. Then he slipped through a window into the princess's room.
        - id: ch02-b06
          speaker: narrator
          text: The princess lay asleep on a sofa. She was so beautiful that he had to kiss her. She woke in a fright, but he quickly told her he was a Turkish god who had flown through the air to visit her. That pleased her very much.
        - id: ch02-b07
          speaker: narrator
          text: They sat close together while he made up stories about her face. Her eyes were deep, dark lakes, and her thoughts swam through them like mermaids. Her forehead was a mountain covered in snow, shining and grand. The princess thought his stories were lovely.
        - id: ch02-b08
          speaker: narrator
          text: Then the merchant's son asked her to marry him, and she agreed at once.
        - id: ch02-b09
          speaker: princess
          text: Come back on Saturday. The sultan and sultana will be here for tea, and they will be so proud that I have welcomed the god of the Turks. You must bring a truly good story. My mother loves stories that are thoughtful and grand, while my father wants something funny enough to make him laugh.
        - id: ch02-b10
          speaker: merchant_son
          text: Then my dowry will be one fairy tale, and nothing else.
        - id: ch02-b11
          speaker: narrator
          text: Before they parted, the princess gave him a saber decorated with gold pieces. He flew away, used them to buy a new dressing gown, and settled in the wood to invent his tale. It had to be finished by Saturday, and making it was no easy task.
        - id: ch02-b12
          speaker: narrator
          text: By the time his story was ready, Saturday had come.
    - id: ch03
      title: The Story in the Kitchen
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The sultan, the sultana, and the entire court gathered for tea with the princess. They welcomed the young man most graciously.
        - id: ch03-b02
          speaker: sultana
          text: Will you tell us a story that gives us something wise and useful to think about?
        - id: ch03-b03
          speaker: sultan
          text: And make it something we can laugh at!
        - id: ch03-b04
          speaker: merchant_son
          text: Of course. Now listen closely. Once, a box of matches lay between a tinderbox and an old iron pot. The matches began telling everyone about their youth.
        - id: ch03-b05
          speaker: matches
          text: We once grew on the green branches of fir trees. Every morning and evening, we drank dew as sparkling as diamonds. We had sunshine all day, and the little birds told us stories. We were very rich. Other trees wore green only in summer, but our family wore green in winter too. Then the woodcutter came and split us all apart. Now our task is to make light for the lowest sort of people. That is why grand folk like us have ended up in the kitchen.
        - id: ch03-b06
          speaker: iron_pot
          text: My life has been quite different. Ever since I was made, I have been scrubbed again and again, and I have cooked a great many meals. My one pleasure comes after dinner. Then I lie clean in my place and have a good talk with my companions.
        - id: ch03-b07
          speaker: fire
          text: You are all talking too fast!
        - id: ch03-b08
          speaker: matches
          text: Then let us decide which one of us is the grandest!
        - id: ch03-b09
          speaker: iron_pot
          text: No, I would rather not talk about myself. Let us put on an evening's entertainment instead. I will tell you the story of my life. It begins on the Baltic, beside the Danish shore...
        - id: ch03-b10
          speakers: [plate_1, plate_2]
          ensemble: duo
          text: What a beautiful beginning! This is a story we will all enjoy!
        - id: ch03-b11
          speaker: narrator
          text: The ending pleased them just as much. All the plates clattered with delight.
        - id: ch03-b12
          speaker: tongs
          text: Now it is my turn to dance!
        - id: ch03-b13
          speaker: narrator
          text: The tongs danced and kicked so high that the old chair cover in the corner split at the sight. The urn would have sung, but she said she had a cold and could sing only when she was boiling.
        - id: ch03-b14
          speaker: narrator
          text: An old quill pen sat in the window. There was nothing special about her, except that she had once been dipped much too deeply into the ink. Still, that made her very proud.
        - id: ch03-b15
          speaker: quill_pen
          text: If the urn refuses to sing, there is a nightingale in a cage outside the door. Let the bird sing for us.
        - id: ch03-b16
          speaker: kettle
          text: I do not think we should listen to a foreign bird. It would not be proper.
        - id: ch03-b17
          speakers: [plate_1, plate_2, tongs, quill_pen]
          ensemble: chorus
          text: Then let us have a play! Oh, please, let us act something!
        - id: ch03-b18
          speaker: narrator
          text: Just then, the door opened and the maid walked in. Every object fell silent. Not one of them made a sound. Yet each pot knew how grand it was and how much it might have done.
        - id: ch03-b19
          speaker: narrator
          text: The maid picked up the matches and used them to light the fire. They spluttered and burst into flame.
        - id: ch03-b20
          speaker: matches
          text: Now everyone can see that we are the grandest! See how we sparkle! Look at our wonderful light...
        - id: ch03-b21
          speaker: narrator
          text: And with that, the matches burned out.
        - id: ch03-b22
          speaker: sultana
          text: What a delightful story! I felt as though I were right there in the kitchen with those matches. Yes, you may marry our daughter.
          emotion: happy
        - id: ch03-b23
          speaker: sultan
          text: Indeed you may! You will marry her on Monday.
          emotion: happy
        - id: ch03-b24
          speaker: narrator
          text: From that moment, they treated the merchant's son as one of the family.
    - id: ch04
      title: Fireworks over the Town
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The wedding was arranged, and on the night before it, lights shone throughout the town. Biscuits and gingerbread rained down among the people. Boys stood on tiptoe, cheering and whistling through their fingers. Everything looked splendid.
        - id: ch04-b02
          speaker: merchant_son
          text: I ought to give them a treat of my own.
        - id: ch04-b03
          speaker: narrator
          text: So he bought rockets, firecrackers, and every kind of firework he could find. He packed them all into the trunk and carried them into the sky.
        - id: ch04-b04
          speaker: narrator
          text: Whir-r-r! The fireworks fizzed and blazed overhead. The Turks jumped so high that their slippers flew above their heads. None of them had ever seen such glittering lights.
        - id: ch04-b05
          speaker: narrator
          text: Now they understood perfectly. The bridegroom truly had to be the god of the Turks.
        - id: ch04-b06
          speaker: narrator
          text: The young man brought the trunk down in the wood once more.
        - id: ch04-b07
          speaker: merchant_son
          text: I will go into town and hear what everyone thought of the show.
        - id: ch04-b08
          speaker: narrator
          text: Of course he wanted to know. And what marvelous stories the townspeople had to tell! Everyone he questioned had seen something different, but every one of them agreed it had been beautiful.
        - id: ch04-b09
          speaker: townsman_1
          text: I saw the Turkish god himself! His eyes glittered like stars, and his beard foamed like water.
        - id: ch04-b10
          speaker: townsman_2
          text: I saw him fly away wrapped in a cloak of fire!
        - id: ch04-b11
          speaker: narrator
          text: The merchant's son was delighted by everything he heard. Tomorrow was to be his wedding day.
    - id: ch05
      title: Ashes in the Wood
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: He returned to the wood, ready to climb into his trunk. But the trunk was gone. A spark from the fireworks had landed on it and set it alight. All that remained was ash.
        - id: ch05-b02
          speaker: narrator
          text: Without the trunk, he could not fly. He could never reach his bride again.
        - id: ch05-b03
          speaker: narrator
          text: The princess stood on the roof and waited for him all day long. Perhaps she is waiting there still.
        - id: ch05-b04
          speaker: narrator
          text: As for the merchant's son, he wandered through the world telling stories. But none of them were as merry as the tale he once told about the matches.
