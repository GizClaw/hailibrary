  chapters:
    - id: ch01
      title: 荡尽家财与会飞的箱子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个商人，富得能用银币铺满整条大街，兴许还够铺一条小巷。可他没有真拿钱铺路。他花掉一先令，就能赚回一弗罗林，做了一辈子这样出色的生意。
        - id: ch01-b02
          speaker: narrator
          text: 商人死后，儿子继承了全部家财，日子过得快活极了。他每晚都去看戏，拿五英镑的钞票糊风筝，还把金币当石子丢进水里打水漂。照这样挥霍，钱当然很快就花光了。最后，他只剩四先令，能穿的也只有一双拖鞋和一件旧晨衣。朋友们从此不再理他，甚至不肯同他一起走过街头。
        - id: ch01-b03
          speaker: narrator
          text: 只有一个还算好心的朋友送来一只旧箱子，还捎给他一句话，叫他收拾行李。话倒说得容易，可他根本没有东西可收，只好把自己装进箱子。谁知这是一只魔箱，只要按下锁扣，它就能飞。他伸手一按，箱子立刻冲出烟囱，飞到高高的云层里，又越飞越远。箱底每咯吱一响，他都怕得要命，唯恐箱子散架，害自己从天上翻着可怕的跟头摔下去。
        - id: ch01-b04
          speaker: narrator
          text: 箱子就这样载着他来到土耳其人的国度。他把它藏进树林，又在上面盖好枯叶，这才徒步进城。当地人个个都穿晨衣和拖鞋，他这一身打扮恰好和他们一样，走在街上毫不起眼。没过多久，他遇见一位带着小孩的保姆。
        - id: ch01-b05
          speaker: merchant_son
          text: 喂，保姆，城边那座大宫殿是谁住的？就是窗户开得特别高的那一座。
        - id: ch01-b06
          speaker: nurse
          text: 苏丹的女儿住在那里。预言说，她会因为丈夫遭到大难。所以只有苏丹和皇后在场时，别人才准见她。
        - id: ch01-b07
          speaker: merchant_son
          text: 多谢你了。
        - id: ch01-b08
          speaker: narrator
          text: 他回到树林，坐进箱子，径直飞上宫殿屋顶，又从窗口爬进公主的房间。
    - id: ch02
      title: 空中来客的求婚
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 公主正在沙发上熟睡，美得让年轻人忍不住吻了她。公主惊醒后害怕极了，他连忙说，自己是土耳其人的神，特意从空中来看她。公主一听，顿时十分欢喜。
        - id: ch02-b02
          speaker: narrator
          text: 两人紧挨着坐下。年轻人开始讲关于她眼睛的故事。他说，那双眼睛像两泓幽暗而美丽的湖水，她的心思就在湖里游来游去，仿佛一尾尾美人鱼。她的额头呢，是一座覆盖白雪的高山，又庄严，又明亮。公主觉得这些故事美妙极了。
        - id: ch02-b03
          speaker: narrator
          text: 年轻人接着向她求婚，公主马上答应了。
        - id: ch02-b04
          speaker: princess
          text: 那你星期六一定要来。那天父王和母后来陪我喝茶。他们知道我接待了土耳其人的神，一定会很骄傲。你可得准备一个真正精彩的故事。母后喜欢有道理、格调又高的，父王却想听能逗他发笑的趣事。
        - id: ch02-b05
          speaker: merchant_son
          text: 好，我就带一个童话来当聘礼。
        - id: ch02-b06
          speaker: narrator
          text: 两人就此告别。公主送他一柄镶满金币的弯刀，那些金币正好能给他花用。他乘箱飞走，先给自己买了一件新晨衣，再坐进树林里，专心编起故事。故事必须赶在星期六以前完成，可要把它编得又有道理又好笑，实在不是容易的事。等他终于编好，星期六也到了。
        - id: ch02-b07
          speaker: narrator
          text: 苏丹、苏丹皇后和满朝廷臣都来陪公主喝茶，大家极其亲切地迎接了年轻人。
        - id: ch02-b08
          speaker: sultana
          text: 请给我们讲个故事吧。我要听那种能叫人深思，也能教人道理的故事。
        - id: ch02-b09
          speaker: sultan
          text: 可也得有趣，让我们笑得出来。
        - id: ch02-b10
          speaker: merchant_son
          text: 当然可以。请大家仔细听。从前有一盒火柴，躺在火绒匣和一口旧铁锅中间。火柴们讲起了自己年轻时的往事。
    - id: ch03
      title: 厨房里的故事
      blocks:
        - id: ch03-b01
          speakers: [match_1, match_2, match_3]
          ensemble: chorus
          text: 我们从前住在碧绿的枞树枝头。早晚喝的钻石茶就是露水，白天总有阳光，小鸟还给我们讲故事。别的树只有夏天才穿衣，我们却一年四季都穿绿衣，多么富贵！后来樵夫拆散了我们一家。如今，我们竟要替最卑贱的人点火。像我们这样高贵，才会落到厨房里来。
        - id: ch03-b02
          speaker: narrator
          text: 火柴旁边的铁锅听了，也说起自己的命运。
        - id: ch03-b03
          speaker: iron_pot
          text: 我的经历可完全不同。我来到世上以后，被刷洗过好多次，也煮过好多东西。吃完饭，干干净净地躺回原处，再和伙伴们聊一会儿，这是我唯一的乐趣。
        - id: ch03-b04
          speaker: fire
          text: 慢一点，你说得太快啦。
        - id: ch03-b05
          speakers: [match_1, match_2, match_3]
          ensemble: chorus
          text: 对呀，我们来评评看，到底谁最尊贵！
        - id: ch03-b06
          speaker: iron_pot
          text: 我可不爱谈论自己。咱们还是办一场晚间余兴吧。我来讲自己的生平。故事要从波罗的海边、丹麦的海岸讲起——
        - id: ch03-b07
          speakers: [plate_1, plate_2, plate_3]
          ensemble: chorus
          text: 这个开头真美！这样的故事，我们每个都爱听。
        - id: ch03-b08
          speaker: narrator
          text: 铁锅接着把生平讲了下去。故事的结尾和开头一样精彩，盘子们听得十分满意，高兴得叮叮当当响成一片。
        - id: ch03-b09
          speaker: tongs
          text: 现在该我来跳舞啦！
        - id: ch03-b10
          speaker: narrator
          text: 火钳当真跳了起来，一下又一下，把腿踢得高极了。墙角的旧椅套看见她这副模样，竟笑得裂开了口。茶炊本来也想唱上一曲，可她说自己着了凉。除非把水烧开，否则她一句也唱不出来。
        - id: ch03-b11
          speaker: narrator
          text: 窗台上还有一支旧鹅毛笔。她唯一特别的地方，是曾经在墨水里蘸得太深，可她偏偏为此骄傲得很。
        - id: ch03-b12
          speaker: quill
          text: 茶炊不唱也没关系。门外笼子里有只夜莺，它能唱。
        - id: ch03-b13
          speaker: kettle
          text: 让一只外国鸟唱给我们听，我觉得不太合适。
        - id: ch03-b14
          speakers: [iron_pot, tongs, quill, kettle]
          ensemble: chorus
          text: 那就演场戏吧！求你们啦，演一场吧！
        - id: ch03-b15
          speaker: narrator
          text: 门忽然开了，女仆走进厨房。所有东西马上安静下来，一点声音也不敢出。可每一口锅心里都清楚，自己原本能做些什么，又有多么尊贵。
        - id: ch03-b16
          speaker: narrator
          text: 女仆拿起火柴点炉子。火柴噼啪作响，火焰蹿得老高。
        - id: ch03-b17
          speakers: [match_1, match_2, match_3]
          ensemble: chorus
          text: 现在人人都看见了，我们才是最尊贵的！瞧我们闪得多亮，发出的光多灿烂——
        - id: ch03-b18
          speaker: merchant_son
          text: 可就在这时候，火柴全都烧完了。故事也讲完了。
    - id: ch04
      title: 满城烟火
      blocks:
        - id: ch04-b01
          speaker: sultana
          text: 这个故事真讨人喜欢！听着听着，我好像也和火柴一起待在厨房里了。好吧，你可以娶我们的女儿。
          emotion: happy
        - id: ch04-b02
          speaker: sultan
          text: 正是这样。星期一，你就和我们的女儿成婚。
        - id: ch04-b03
          speaker: narrator
          text: 从此，苏丹一家把年轻人当作自家人。婚礼定了下来。前一夜，全城灯火通明。人们把饼干和姜饼撒向街头，孩子们踮着脚欢呼，还把手指含在嘴里，吹出尖亮的哨声。场面气派极了。
        - id: ch04-b04
          speaker: merchant_son
          text: 我也该给大家看点新鲜玩意儿。
        - id: ch04-b05
          speaker: narrator
          text: 他买来火箭、爆竹，还有能想到的各式烟火，全都装进飞箱，带上天空。烟火咻咻呼啸，砰砰炸响，在空中烧出一片耀眼的光焰。土耳其人惊得跳起老高，连脚上的拖鞋都飞过了头顶。他们一生从没见过这样的光彩。现在大家终于明白，要娶公主的果然是土耳其人的神本尊。
        - id: ch04-b06
          speaker: narrator
          text: 年轻人乘箱回到树林，刚一落地，就想进城听听大家怎样议论这场表演。他想亲耳听听，本来也很自然。
        - id: ch04-b07
          speaker: narrator
          text: 城里人果然讲得神乎其神。每个人看见的情形都不一样，可每个人都觉得美妙极了。
        - id: ch04-b08
          speaker: townsman_1
          text: 我亲眼看见了土耳其人的神！他的眼睛像闪亮的星星，胡须像翻滚的白沫。
        - id: ch04-b09
          speaker: townsman_2
          text: 我看见他披着火焰做的斗篷飞走了！
        - id: ch04-b10
          speaker: narrator
          text: 年轻人一路听到的，全是这类叫他觉得精彩万分的奇妙说法。而第二天，就是他举行婚礼的日子。
    - id: ch05
      title: 化成灰烬的飞箱
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 他回到树林，正要坐进箱子，却怎么也找不到它。飞箱已经烧毁了。原来烟火迸出一颗火星，点着了箱子，如今那里只剩一堆灰。他再也飞不起来，也永远到不了新娘身边。
        - id: ch05-b02
          speaker: narrator
          text: 公主一整天都站在屋顶上等他。说不定直到今天，她还在那里等着呢。
        - id: ch05-b03
          speaker: narrator
          text: 商人的儿子从此浪迹天涯，走到哪里就把故事讲到哪里。只是他后来的故事，再也没有火柴的故事那样快活了。
