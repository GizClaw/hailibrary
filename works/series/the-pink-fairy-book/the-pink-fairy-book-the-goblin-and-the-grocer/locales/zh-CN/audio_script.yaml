audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    student:
      display_name: 学生
      tts:
        delivery: 诚恳爽朗，谈起诗时热切而坚定
        timbre: 清亮温和
        pace: 中速
        pitch: 中音
    grocer:
      display_name: 杂货商
      tts:
        delivery: 随和实在，精明中带着好脾气
        timbre: 厚实明亮
        pace: 中速
        pitch: 中低音
    goblin:
      display_name: 小妖精
      tts:
        delivery: 机灵敏感，爱憎分明，认真时仍带稚气
        timbre: 轻巧清脆
        pace: 稍快，动情时放缓
        pitch: 中高音
    tub:
      display_name: 旧木桶
      tts:
        delivery: 一本正经又自鸣得意，夸耀时毫不含糊
        timbre: 粗哑空响
        pace: 中缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 奶酪包里的诗
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个勤奋的学生住在阁楼里，身边什么财物也没有。一楼住着一位同样勤劳的杂货商，整栋房子都是他的。就连小妖精也跟着杂货商，因为每年圣诞夜，店里总会给他预备一碟果酱，中间还放着一大块黄油。杂货商供得起这份点心，小妖精自然愿意留下来。光是这件事，就够我们明白不少道理了。
        - id: ch01-b02
          speaker: narrator
          text: 一天晚上，学生从后门进店，亲自来买蜡烛和奶酪。他没有仆人可以差遣。杂货商把东西交给他，他付了钱，又朝杂货商和老板娘点头道晚安。老板娘可不只会点头，她还特别能说。学生正要离开，忽然停下来，低头读起了包奶酪的纸。
        - id: ch01-b03
          speaker: narrator
          text: 原来，那是从一本旧诗集里撕下来的一页。
        - id: ch01-b04
          speaker: grocer
          text: 那边还有好多页呢！有位老太太拿整本书来，我给了她一点咖啡。你要是肯出两便士，剩下的都可以拿走。
        - id: ch01-b05
          speaker: student
          text: 好啊，那就别给我奶酪了，把书给我吧。面包不配奶酪，我也吃得下。可这么好的书要是一页页给撕掉，多可惜。你又聪明又能干，不过你对诗的了解，跟墙角那只旧木桶差不多！
        - id: ch01-b06
          speaker: narrator
          text: 这话听在木桶耳朵里，实在不大客气。不过杂货商笑了，学生也笑了，谁都知道这只是句玩笑。小妖精可气坏了。他想，杂货商有一整栋房子，还卖着全城最好的黄油，怎么能让人这样说呢？
    - id: ch02
      title: 会说话的木桶
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 夜里，店门关了。除了学生，人人都已上床。小妖精跑上楼，取来了老板娘的舌头。她睡着时反正用不到。那舌头放在什么东西上，什么东西就会说出自己的想法和感受，跟老板娘说得一样好。不过一次只能让一样东西开口。要不然，满屋的东西一起说话，那可不得了。
        - id: ch02-b02
          speaker: narrator
          text: 小妖精先把舌头放在装旧报纸的木桶上，然后问它。
        - id: ch02-b03
          speaker: goblin
          text: 学生说你根本不懂诗，这是真的吗？
        - id: ch02-b04
          speaker: tub
          text: 当然是假的！诗嘛，就是报纸上登出来、还常让人剪下来的那些东西。我肚子里的诗比那个学生多得多。可我呢，不过是杂货店里一只小木桶罢了。
        - id: ch02-b05
          speaker: narrator
          text: 小妖精又把舌头放到咖啡磨上，它马上喀啦喀啦地数落起来。黄油桶和钱匣接着也开了口，说的全跟废纸桶一样。既然大多数都这么想，那当然该相信大多数。
        - id: ch02-b06
          speaker: goblin
          text: 这下我可要去教训那个学生了！
        - id: ch02-b07
          speaker: narrator
          text: 小妖精轻手轻脚地爬上楼梯，来到学生住的阁楼。里面还亮着灯。他凑到钥匙孔前一看，学生正在读从店里买来的那本破书。
    - id: ch03
      title: 钥匙孔里的光
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可那书里亮得惊人！一道光从书页中射出来，越长越高，竟变成一棵大树。树枝远远伸到学生头顶。每片叶子都有生命，每朵花都是一位美丽少女的脸。有的眼睛乌黑发亮，有的眼睛蓝得神奇。树上的果实全是一颗颗闪耀的星。学生的屋里，还有奇妙的音乐在回响。这样的景象，小妖精做梦都没梦到过，更别说亲眼见过。
        - id: ch03-b02
          speaker: narrator
          text: 他踮起脚尖，看了又看。后来，学生吹灭蜡烛，上床睡了。小妖精还是舍不得走，继续站在门外听。那音乐轻了下来，甜甜地唱着，给学生送去一首摇篮曲。
        - id: ch03-b03
          speaker: goblin
          text: 我从来没见过这样的景象！我连想都没想过，世上还有这种东西。我一定要留下来陪着学生。
        - id: ch03-b04
          speaker: narrator
          text: 小家伙认真想了一遍。他是个很明白事理的小妖精。可想来想去，他叹了口气。
        - id: ch03-b05
          speaker: goblin
          text: 唉，可学生没有果酱啊！
        - id: ch03-b06
          speaker: narrator
          text: 于是他又回到楼下。幸亏回来得及时，木桶差点把老板娘的舌头用坏。它已经把肚子这一面的东西全念完了，正要翻个身，接着念另一面。小妖精赶忙取回舌头，还给了主人。
        - id: ch03-b07
          speaker: narrator
          text: 从那夜起，店里的钱匣、刨花，还有其他东西，全都对木桶另眼相看。它们又仰慕又信任木桶，甚至相信杂货商每晚从报纸上读的艺术评论和戏剧评论，原本都出自木桶。
        - id: ch03-b08
          speaker: narrator
          text: 可小妖精再也听不进楼下那些智慧和学问了。每当夜晚阁楼亮起灯，他就觉得那一道道光变成了结实的绳子，拉着他往楼上走。他一定要去，一定要贴在钥匙孔上看。每次看见里面的景象，他心里都会翻涌起来，就像我们看见风暴里的大海。眼泪流了下来，他也不知道为什么。可是一边哭，他又一边觉得幸福。
        - id: ch03-b09
          speaker: narrator
          text: 要是能跟学生一起坐在那棵树下，该多好啊！但他做不到，只能守在钥匙孔外面。这样也已经让他满足。他站在寒冷的楼梯平台上，秋风从地板缝里往上钻。起初他根本顾不上冷。直到阁楼的灯熄灭，林间的音乐也停下来，他才冻得受不了，只好爬回楼下那个温暖舒适的小角落。
        - id: ch03-b10
          speaker: narrator
          text: 等圣诞节到了，果酱端来了，中间还是那一大块黄油。这时候，杂货商在小妖精心里又排到了第一位。
    - id: ch04
      title: 火光中的宝贝
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了半夜，小妖精忽然被巨响惊醒。百叶窗给敲得砰砰作响，人们在外面拼命捶打，守夜人也吹起了号角。城里起了大火，到处都是火光。
        - id: ch04-b02
          speaker: narrator
          text: 是这栋房子着火了吗？还是邻居家？火究竟在哪里？
        - id: ch04-b03
          speaker: narrator
          text: 外面的叫喊越来越响。老板娘吓得摘下金耳环，塞进口袋里，至少要救出一点值钱的东西。杂货商一把抓起账本，女仆则抱住了她的黑绸衣裳。
        - id: ch04-b04
          speaker: narrator
          text: 人人都想救出自己最珍贵的东西。小妖精也一样。他几步冲上楼梯，跑进学生的房间。学生安静地站在敞开的窗前，看着正对面邻居家的大火。小妖精抓起桌上的书，塞进红帽子，再用两只手紧紧抱住。整栋房子里最好的宝贝，就这样得救了。
        - id: ch04-b05
          speaker: narrator
          text: 小妖精抱着书爬上屋顶，一直爬到烟囱上。对面熊熊燃烧的房屋照亮了他。他坐在火光里，两只手死死护着红帽子，那个宝贝就藏在帽子里面。这一刻，他终于知道自己的心最看重什么，也知道自己真正属于谁了。
    - id: ch05
      title: 都是因为果酱
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 可是大火扑灭以后，小妖精又仔细想了一遍。
        - id: ch05-b02
          speaker: goblin
          text: 我要把自己分给他们两个。我还是不能彻底离开杂货商，都是因为那碟果酱！
        - id: ch05-b03
          speaker: narrator
          text: 我们其实也一样。我们也不能彻底离开杂货商——都是因为那碟果酱。
