audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and mellow
        pace: measured
        pitch: medium
    goblin:
      display_name: Goblin
      tts:
        delivery: lively, impulsive, and sincere
        timbre: small and bright
        pace: quick
        pitch: high
    student:
      display_name: Student
      tts:
        delivery: thoughtful, spirited, and good-humored
        timbre: clear and youthful
        pace: steady
        pitch: medium
    grocer:
      display_name: Grocer
      tts:
        delivery: practical, easygoing, and amused
        timbre: broad and hearty
        pace: measured
        pitch: medium-low
    tub:
      display_name: Waste-Paper Tub
      tts:
        delivery: pompous, certain, and talkative
        timbre: dry and hollow
        pace: brisk
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Book in the Cheese Paper
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a hard-working student who lived up in an attic. He owned almost nothing. Down on the first floor lived a hard-working grocer, and the whole house belonged to him.
        - id: ch01-b02
          speaker: narrator
          text: The Goblin belonged to the grocer too. Every Christmas Eve, the grocer set out a dish of jam for him, with a great lump of butter in the middle. The grocer could afford it, so the Goblin stayed in his shop. That tells you quite a lot.
        - id: ch01-b03
          speaker: narrator
          text: One evening, the student came through the back door to buy a candle and some cheese. He had no one to send, so he came himself. He paid and nodded good evening to the grocer and his wife. The grocer's wife could do much more than nod. She could talk.
        - id: ch01-b04
          speaker: narrator
          text: The student had already said good night when he suddenly stopped. He was reading the paper wrapped around his cheese. It was a page torn from an old book, and the book was full of poetry.
        - id: ch01-b05
          speaker: grocer
          text: There are plenty more pages over there. I traded an old woman some coffee for the book. Give me two pennies, and you may take the rest.
        - id: ch01-b06
          speaker: student
          text: Then give me the book instead of the cheese. I can eat my bread plain. It would be shameful to let you tear up a book like that. You're clever and practical, but when it comes to poetry, you know no more than that old tub over there!
        - id: ch01-b07
          speaker: narrator
          text: That was rather insulting to the tub. Still, the grocer laughed, and the student laughed with him. The student had only meant it as a joke.
        - id: ch01-b08
          speaker: narrator
          text: The Goblin did not find it funny at all. He was furious that anyone would speak that way to a grocer who owned the house and sold the finest butter.
    - id: ch02
      title: What the Shop Had to Say
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Night came. The shop was locked, and everyone but the student had gone to bed. Then the Goblin crept upstairs and borrowed the grocer's wife's tongue. She had no need of it while she slept.
        - id: ch02-b02
          speaker: narrator
          text: The tongue had a remarkable power. Whatever object the Goblin placed it on could speak its thoughts and feelings as clearly as the grocer's wife herself. Only one thing could use it at a time, which was fortunate. Otherwise, every object in the room might have started talking at once.
        - id: ch02-b03
          speaker: narrator
          text: The Goblin carried the tongue back into the shop and laid it on the tub that held the old newspapers.
        - id: ch02-b04
          speaker: goblin
          text: Tell me, is it true that you don't understand poetry?
        - id: ch02-b05
          speaker: tub
          text: Of course it isn't true! Poetry is the sort of thing printed in newspapers that people often cut out. Why, I have much more poetry inside me than the student does, and I'm only a little tub in a grocer's shop.
        - id: ch02-b06
          speaker: narrator
          text: Next, the Goblin put the tongue on the coffee mill, and what a grinding noise it made. He tried the butter cask and then the cashbox. Every one of them agreed with the waste-paper tub, and surely the majority must be right.
        - id: ch02-b07
          speaker: goblin
          text: Now I'll go and tell the student!
        - id: ch02-b08
          speaker: narrator
          text: With that, he slipped quietly up the stairs toward the student's attic.
    - id: ch03
      title: The Light in the Attic
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A light was still burning up there. The Goblin peered through the keyhole and saw the student reading the ragged old book he had bought from the shop.
        - id: ch03-b02
          speaker: narrator
          text: And what a brightness filled the room! A shining beam sprang from the book. It rose into a great tree whose branches spread high above the student's head. Every leaf seemed alive. Each flower had the face of a beautiful girl. Some faces had dark, gleaming eyes, while others had eyes of wonderful blue.
        - id: ch03-b03
          speaker: narrator
          text: The tree's fruit shone like glittering stars, and marvelous music flowed all through the attic. The little Goblin had never seen anything so splendid. He had never even dreamed that such a sight could exist.
        - id: ch03-b04
          speaker: narrator
          text: He stretched up on tiptoe and stared. He went on staring until the student's candle went dark. The student had blown it out and gone to bed, but the Goblin stayed outside the door. He could still hear the music. Now it had softened into a sweet lullaby for the sleeping student.
        - id: ch03-b05
          speaker: goblin
          text: I've never seen anything like it! I never imagined anything like it. I must stay here with the student.
          emotion: surprised
        - id: ch03-b06
          speaker: narrator
          text: The sensible little Goblin stopped to think. Then one unhappy thought came to him.
        - id: ch03-b07
          speaker: goblin
          text: But the student has no jam!
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: So he went back down to the grocer after all. It was just as well that he did. The tub had nearly worn out the borrowed tongue. It had read aloud everything stored inside it on one side, and it was about to turn around and begin on the other. The Goblin arrived just in time to take the tongue away and return it to its sleeping owner.
        - id: ch03-b09
          speaker: narrator
          text: From that night on, everything in the shop thought differently of the tub. From the cashbox down to the wood shavings, they all looked up to it. When the grocer read newspaper reviews of art and plays at night, they imagined every word had come from the tub.
    - id: ch04
      title: Between Poetry and Jam
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After that, the Goblin could no longer sit downstairs and listen peacefully to all the shop's wisdom. Whenever light appeared in the attic window, its beams seemed like strong ropes pulling him upward. He had to climb the stairs and look through the keyhole.
        - id: ch04-b02
          speaker: narrator
          text: Each time he looked in, a great feeling swept over him, like watching the vast sea roll in a storm. Tears filled his eyes. He could not explain them, yet he felt wonderfully happy.
        - id: ch04-b03
          speaker: narrator
          text: How beautiful it would have been to sit beside the student beneath that shining tree. But the Goblin could not go into the room. He had to be satisfied with his place at the keyhole, and there he found his happiness.
        - id: ch04-b04
          speaker: narrator
          text: He stood on the cold landing while the autumn wind whistled through cracks in the floor. It was bitterly cold, though he never noticed until the attic light went out and the music among the branches faded away.
        - id: ch04-b05
          speaker: narrator
          text: Only then did the cold bite him. Shivering, he hurried downstairs to his warm little corner. It was snug and comfortable there.
        - id: ch04-b06
          speaker: narrator
          text: Then Christmas arrived, bringing the dish of jam with the great lump of butter in its middle. At that moment, there was no question in the Goblin's mind. The grocer came first.
    - id: ch05
      title: The Treasure in the Red Cap
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: In the middle of the night, the Goblin woke to a terrible noise. Something was pounding against the shutters. People outside were hammering on them, and the watchman was sounding his horn. A great fire had broken out. The town was in flames.
        - id: ch05-b02
          speaker: narrator
          text: Was the fire in their house, or in a neighbor's? No one knew. The alarm grew louder. The grocer's wife was so frightened that she pulled the gold earrings from her ears and tucked them into her pocket, hoping to save at least something. The grocer snatched up his account books, while the maid seized her black silk dress.
        - id: ch05-b03
          speaker: narrator
          text: Everyone reached for the thing they valued most. The Goblin did the same. In a few quick leaps, he raced upstairs and into the student's room.
        - id: ch05-b04
          speaker: narrator
          text: The student stood quietly beside the open window. Across the way, the neighbor's house was burning. The Goblin grabbed the old book from the table, tucked it into his red cap, and held it tight in both hands. The finest treasure in the house was safe.
        - id: ch05-b05
          speaker: narrator
          text: Carrying the book, the Goblin climbed out onto the roof and then up to the chimney. He sat there in the red glow from the burning house opposite. Both hands clutched the cap that held his treasure.
        - id: ch05-b06
          speaker: narrator
          text: At last, the Goblin understood what his heart valued above everything else. He knew where he truly belonged.
        - id: ch05-b07
          speaker: narrator
          text: But the fire was put out, and once the danger had passed, the Goblin began to think it all over again.
        - id: ch05-b08
          speaker: goblin
          text: I'll divide myself between the two. I can't quite leave the grocer, not when there's jam.
        - id: ch05-b09
          speaker: narrator
          text: And we are much the same. We cannot quite leave the grocer either, all because of the jam.
