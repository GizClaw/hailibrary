  chapters:
    - id: ch01
      title: The Wise Woman's Warning
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there were a king and queen who loved each other dearly and lived happily in a beautiful castle. The land they ruled was large and lovely. It was rich, and its people were happy. But after seven years of marriage, the king and queen still had no son or daughter to inherit it. That was a deep sorrow to them both. More than once, when the king was in a bad temper, he blamed the poor queen. He said they were growing old, that neither they nor the kingdom had an heir, and that it was all her fault. Those words were hard to bear. The queen would go away and cry, tormenting herself over what he had said.
        - id: ch01-b02
          speaker: king
          text: >-
            I cannot bear this any longer. I have no child, and I blame you for it. I am leaving on a journey for one year. If I return and find that you have a child, all will be well. I will love you beyond measure and never speak angrily to you again. But if our home is still empty, I must part from you.
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: >-
            The king set out on his year-long journey. Left alone in the castle, the queen grieved and worried more than ever. Day after day she wondered what would become of her when he returned. At last, one of her maids saw her sorrow and offered a little hope.
        - id: ch01-b04
          speaker: maid
          text: >-
            Your Majesty, I think you may find help if you look for it. A wise old woman in this country has helped many others with the same sorrow. Send for her. Perhaps she can help you too.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The maid told her that this wise old woman had already helped many people who suffered from the same trouble. The queen sent for her at once. When the old woman arrived, the queen trusted her with the whole unhappy story. She had no child, the king and his kingdom had no heir, and the king had threatened to part from her. The wise woman listened and said there was a way to help.
        - id: ch01-b06
          speaker: wise_woman
          text: >-
            Go into the king's garden alone before sunrise, and eat nothing first. On your left, just outside the castle, a great oak stands over a small brownish bush with hairy leaves and long spikes. The bush now has three buds. Pick the middle bud and eat it. Six months later, you will give birth to a princess.
        - id: ch01-b07
          speaker: wise_woman
          text: >-
            As soon as the child is born, she must be given to a nurse whom I will choose. They must live alone in a secluded part of the palace. No one else may visit. Neither you nor the king may see the child before she is fourteen years old. If either of you does, great sorrow and misfortune will follow.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The queen rewarded the wise woman generously. Before sunrise the next morning, she found the bush, plucked its middle bud, and ate it. At first it tasted sweet. Afterward, it was as bitter as gall.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Six months later, the queen gave birth to a little girl. The nurse chosen by the wise woman was already waiting, and a home had been prepared for her and the child. It lay in a secluded wing of the castle, looking out over the pleasure park. The queen obeyed the warning. She gave up her newborn daughter at once, and the nurse carried the baby away. From then on, the two lived there entirely alone.
        - id: ch01-b10
          speaker: narrator
          text: >-
            When the king returned, he was delighted to learn that he had a daughter and wanted to see her at once. The queen told him only that a prophecy warned of terrible sorrow if either parent saw the child before her fourteenth birthday.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Fourteen years seemed an age. The king longed to see his daughter, and the queen longed just as much. Now and then, the queen was allowed to speak with the nurse, though she never entered the child's rooms. The nurse told her that this was no ordinary girl. The princess had spoken from the moment she was born and was already as wise as older people. Still, no one but the nurse had ever seen her. The queen had witnessed the wise woman's power for herself, so she insisted that the warning must be obeyed. Again and again, the king lost patience and declared that he would see the child. Each time, the queen managed to turn him from the idea, until only one day remained.
        - id: ch01-b12
          speaker: narrator
          text: >-
            At last, only one day remained. As the king and queen walked in the garden, his patience failed completely.
        - id: ch01-b13
          speaker: king
          text: >-
            I will not wait any longer. I must see my daughter now. A few hours cannot possibly matter.
        - id: ch01-b14
          speaker: queen
          text: >-
            Please, have patience until morning. We have waited all these years. Surely we can wait one more day.
        - id: ch01-b15
          speaker: king
          text: >-
            Enough of this. She is as much my child as yours, and I mean to see her.
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: >-
            The king went straight to the princess's room. He burst through the door and pushed aside the nurse when she tried to stop him. There stood his daughter, the loveliest young princess. Her cheeks were red and white, like blood and milk. Her eyes were clear blue, her hair was golden, and a small tuft of brown hair grew in the middle of her forehead.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The princess ran to him, threw her arms around his neck, and kissed him. Then she told him what his impatience had brought upon them.
        - id: ch01-b18
          speaker: princess
          text: >-
            Oh, Father, what have you done? Tomorrow I must die, and you must choose what follows. A black plague may strike the land, or there may be a long and bloody war. Your third choice is to place me in a plain wooden chest as soon as I die. Set it in the church, and station a sentinel beside it every night for a whole year.
          emotion: fearful
        - id: ch01-b19
          speaker: narrator
          text: >-
            The king was badly frightened and thought his daughter must be raving. He answered only to soothe her.
        - id: ch01-b20
          speaker: king
          text: >-
            Then I choose the wooden chest. If you die, I will place you in it at once, set it in the church, and post a sentinel there every night. But you are not going to die, no matter how ill you feel now.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The king immediately summoned every great doctor in the country. They hurried to the palace with prescriptions and bottles of medicine, determined to prevent the death he refused to believe in. Nothing helped. The very next day, the princess lay stiff and cold. Every doctor examined her and certified that she was dead. One after another, they signed the statement and pressed a seal beside the name. With that, they had done everything they knew how to do.
    - id: ch02
      title: The Vanishing Sentinels
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The king kept his promise. That same day, the princess was laid in a plain wooden chest in the castle chapel. A sentinel stood guard beside it that night.
        - id: ch02-b02
          speaker: narrator
          text: >-
            In the morning, the sentinel was gone. They supposed he had taken fright and run away, so a new guard went in the next evening. He vanished too. Night after night, the same thing happened. No one could discover how the men had escaped, or why none of them was ever heard from again.
        - id: ch02-b03
          speaker: narrator
          text: >-
            People began to believe that the princess's ghost walked at night and devoured anyone who guarded her chest. Soon no one would willingly accept the duty. The king's own soldiers deserted before their turn came to watch over her body. Then the king offered a large reward to any man who volunteered. For a time, the promise of money drew a few reckless fellows. But none ever collected the reward, because each had vanished by morning. This continued for nearly a whole year. Every night, a sentinel was posted beside the chest, sometimes by force and sometimes by his own choice. Not one was seen the following day, or at any later time.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The night before Christian arrived, yet another sentinel disappeared. Christian was a cheerful young smith who had wandered to the capital in search of work. There was none for him in his own town, while people of every kind came to the city where the king's castle stood, hoping to find a place. Christian entered an inn, sat in the public room, and ordered a meal. Some junior officers were there on their daily search for another sentinel. Until then they had always managed to find some reckless fellow, but not that day. The disappearances were too well known, and every man they approached had politely refused.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The officers sat beside Christian and bought drinks for him. Christian loved good company. Once he had a little wine in him, he could drink, sing, talk, and boast with the best of them. Before long, he declared that he feared nothing.
        - id: ch02-b06
          speaker: officer
          text: >-
            Then you are exactly the man we need. You can earn a fine sum before tomorrow. The king pays one hundred dollars to anyone who spends the night guarding his daughter's chest in the church.
        - id: ch02-b07
          speaker: christian
          text: >-
            A chest in a church? I am not afraid of that. I am not afraid of anything!
        - id: ch02-b08
          speaker: narrator
          text: >-
            They drank another bottle on the bargain. Then the officers took Christian to the colonel. He was dressed in uniform, given a musket, and locked inside the church for the night.
    - id: ch03
      title: The First Night
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Christian took his post at eight o'clock. For the first hour, he felt proud of his courage. During the second, he happily imagined the great reward waiting for him in the morning. But during the third hour, as eleven o'clock drew near, the warmth of the wine left his head. He knew the stories about this post. As far as anyone could tell, not one sentinel had escaped alive. Yet no one could say what had actually become of any of them. The mystery seemed worse than knowing.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Once the wine was gone, that thought chased every other thought around his head. At last, Christian began searching every corner for a way out. He found a small unlocked door in the steeple. When the clock reached eleven, he crept through it. The moment his foot touched the ground outside the church, he meant to run.
        - id: ch03-b03
          speaker: little_man
          text: >-
            Good evening, Christian. Where are you going?
        - id: ch03-b04
          speaker: narrator
          text: >-
            A little man stood before him. Christian felt rooted to the ground. He could not move.
        - id: ch03-b05
          speaker: christian
          text: >-
            Nowhere.
        - id: ch03-b06
          speaker: little_man
          text: >-
            Oh, yes, you were. You meant to run away. But you agreed to guard the church tonight, and you must stay at your post.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Christian humbly admitted that he was too frightened to remain. He begged the little man to let him go.
        - id: ch03-b08
          speaker: little_man
          text: >-
            No. You must stay, but I will tell you how to remain safe. Stand in the pulpit. Pay no attention to anything you see or hear, and do not leave your place until the lid has slammed shut again over the dead princess. Once you hear that sound, the danger is past, and you may go anywhere in the church.
        - id: ch03-b09
          speaker: narrator
          text: >-
            The little man pushed Christian back through the door and locked it. Christian hurried into the pulpit and stayed there until midnight. When the clock struck twelve, the lid of the princess's chest flew open. A creature that looked like the princess climbed out and shrieked through the church.
        - id: ch03-b10
          speaker: princess
          text: >-
            Sentry, where are you? Sentry, where are you? If you do not come out, you will suffer the cruelest death anyone has ever known!
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: >-
            She searched all around the church. At last, she caught sight of Christian high in the pulpit. She rushed toward him and mounted the steps. But she could not climb all the way. She stretched and strained toward him, yet her hands could not touch him. Christian stayed where the little man had told him to stand, trembling above her.
        - id: ch03-b12
          speaker: narrator
          text: >-
            When the clock struck one, the apparition was forced to return to the chest. Christian heard the lid slam behind her. After all that shrieking, the church became utterly still. He lay down right there in the pulpit and fell asleep. He did not wake until daylight, when he heard footsteps outside and the sound of a key entering the lock. Christian hurried down, took up his musket, and placed himself before the princess's chest as though he had stood there all night.
        - id: ch03-b13
          speaker: narrator
          text: >-
            The colonel himself entered with the morning patrol. He stared in astonishment when he found the new recruit alive and unharmed. The colonel demanded a report, but Christian would tell him nothing. So he marched the smith straight to the king and announced the news that no one had ever brought before. Here was the sentinel who had guarded the church through the night and returned alive.
        - id: ch03-b14
          speaker: narrator
          text: >-
            The king climbed out of bed, placed one hundred dollars on the table, and began asking questions.
        - id: ch03-b15
          speaker: king
          text: >-
            Did you see anything? Did you see my daughter?
        - id: ch03-b16
          speaker: christian
          text: >-
            I stood at my post. That is enough. I promised nothing more.
        - id: ch03-b17
          speaker: narrator
          text: >-
            Christian truly was not sure he dared reveal what he had seen and heard. At the same time, he had grown a little conceited. He had survived what no other man had managed, or even had the courage to face. His short answer made the feat sound more impressive. The king claimed to be quite satisfied and asked whether Christian would engage himself for another night.
        - id: ch03-b18
          speaker: christian
          text: >-
            No, thank you. I want no more of that!
        - id: ch03-b19
          speaker: king
          text: >-
            As you wish. You have acted bravely. Now you shall have breakfast, for you must need something after such a night.
        - id: ch03-b20
          speaker: narrator
          text: >-
            The king had breakfast served and ate beside Christian. He praised the smith, drank to his health, and kept refilling his glass. Christian needed no urging. He ate heartily and drank even more heartily. At last, the wine made him bold again.
        - id: ch03-b21
          speaker: christian
          text: >-
            Give me two hundred dollars, and I will stand guard for one more night.
        - id: ch03-b22
          speaker: narrator
          text: >-
            The king agreed. Christian said good day and joined the guards and officers below. With his pocket full of money, he went into town with them and treated everyone to drinks. He boasted about his courage and mocked the useless fellows who feared the dead princess would eat them. After all, anyone could look at Christian and see that she had not eaten him. The day passed in laughter and merriment. But at eight o'clock, Christian was shut inside the church again, completely alone.
    - id: ch04
      title: The Second Night
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Before two hours had passed, Christian was tired of the church and thought only of escape. He found an unlocked door behind the altar. At ten o'clock, he slipped outside and ran toward the beach. He was halfway there when the little man suddenly appeared in front of him.
        - id: ch04-b02
          speaker: little_man
          text: >-
            Good evening, Christian. Where are you going?
        - id: ch04-b03
          speaker: christian
          text: >-
            I have permission to go wherever I please.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Even as he spoke, Christian found he could not move one foot.
        - id: ch04-b05
          speaker: little_man
          text: >-
            No. You agreed to keep guard tonight, and you must do it.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The little man took hold of him. Christian did not want to go, but wanting made no difference. However much he resisted, his feet carried him all the way back to the same little door behind the altar, the very door through which he had escaped.
        - id: ch04-b07
          speaker: little_man
          text: >-
            Stand before the altar and hold the book you find there. Stay in that place until the lid has slammed shut over the dead princess. If you do that, she cannot harm you.
        - id: ch04-b08
          speaker: narrator
          text: >-
            He shoved Christian through the door and locked it. The smith took the book and stood before the altar. At midnight, the apparition sprang from the chest.
        - id: ch04-b09
          speaker: princess
          text: >-
            Sentry, where are you? Sentry, where are you?
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: >-
            She rushed to the pulpit and climbed right into it, but no one was there. Then she howled again.
        - id: ch04-b11
          speaker: princess
          text: >-
            My father has set no sentry in. War and Pest this night begin.
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: >-
            Suddenly she saw Christian at the altar and charged toward him.
        - id: ch04-b13
          speaker: princess
          text: >-
            There you are! Now I will catch you!
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: >-
            Yet she could not cross the step before the altar. She howled, screamed, and threatened him from below until one o'clock. Then she had to return to the chest, and Christian heard the lid slam shut. This second night, she had looked less ugly than before.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Once the church was quiet, Christian lay down before the altar and slept peacefully until morning. The colonel arrived and led him to the king, just as he had the day before. Christian received his money but still refused to explain whether he had seen the king's daughter. When the king asked him to take the post once more, he firmly said no.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Then came another good breakfast and more of the king's wine. Soon Christian changed his mind.
        - id: ch04-b17
          speaker: christian
          text: >-
            I will take the third night, but this post is dangerous. This time, my price is half the kingdom.
        - id: ch04-b18
          speaker: narrator
          text: >-
            The king had to agree and gave his promise. Christian spent the rest of the day as he had spent the last. He played the merry smith and the swaggering soldier, surrounded by companions. At eight o'clock, he put on his uniform and was locked in the church for the third time.
    - id: ch05
      title: The Third Night
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Christian had not been inside for even an hour when his good sense returned. He told himself it was best to stop while the game was still going his way. Surely the third night would be worse than the first two. Besides, he had been drunk when he promised to return, and he could not believe the king had seriously meant to give a smith half the kingdom.
        - id: ch05-b02
          speaker: narrator
          text: >-
            This time, Christian decided to flee before the little man expected him. Every door and side entrance had been locked, but at last he thought of a window. As the clock struck nine, he opened it and climbed out. The drop was high, yet he reached the ground without breaking a bone and started running. No one stopped him on the road to the shore. There he climbed into a boat and pushed away from the land. Christian laughed enormously to himself, certain that he had finally outwitted the little man.
        - id: ch05-b03
          speaker: little_man
          text: >-
            Good evening, Christian. Where are you going?
        - id: ch05-b04
          speaker: narrator
          text: >-
            The voice came from the shore. Christian gave no answer. Tonight, he thought, the little man's legs would be too short. He bent over the oars and pulled. Then he felt something take hold of the boat. Though he struggled with all his strength, it dragged him in a straight line back to shore.
        - id: ch05-b05
          speaker: little_man
          text: >-
            You promised to remain at your post, and remain you must.
        - id: ch05-b06
          speaker: narrator
          text: >-
            The little man grabbed him, and Christian had to walk back to the church. At the foot of the high window, the smith protested.
        - id: ch05-b07
          speaker: christian
          text: >-
            I can never get in that way again. The window is far too high.
        - id: ch05-b08
          speaker: little_man
          text: >-
            You must go in, and you shall.
        - id: ch05-b09
          speaker: narrator
          text: >-
            The little man answered by lifting Christian all the way onto the window ledge. Before sending him through the opening he had used to escape, he made the smith listen to one final set of instructions.
        - id: ch05-b10
          speaker: little_man
          text: >-
            Listen closely. Lie full length beside the left side of the princess's chest. Its lid opens to the right, and she will climb out to the left. When she has stepped over you, slip into the chest quickly, before she sees you. Stay there until dawn. Whether she threatens you or begs you, do not answer and do not come out. Then she will have no power over you, and you will both be free.
        - id: ch05-b11
          speaker: narrator
          text: >-
            Christian had no choice but to climb through the window. He went to the princess's chest and stretched himself out full length on its left side, close against it. There he lay as stiff as a rock until midnight. The lid flew open to the right, and the princess climbed out to the left, passing straight over him. As soon as she rushed away to search the church, Christian sprang up and slipped into the empty chest before she could see him.
        - id: ch05-b12
          speaker: princess
          text: >-
            Sentry, where are you? Sentry, where are you?
          emotion: angry
        - id: ch05-b13
          speaker: narrator
          text: >-
            She raced to the altar, but no one stood there. Then she cried out once more.
        - id: ch05-b14
          speaker: princess
          text: >-
            My father has set no sentry in. War and Pest will now begin.
          emotion: angry
        - id: ch05-b15
          speaker: narrator
          text: >-
            She searched the church from end to end. This time, she sighed and wept as she repeated the warning.
        - id: ch05-b16
          speaker: princess
          text: >-
            My father has set no sentry in. War and Pest will now begin.
          emotion: sad
        - id: ch05-b17
          speaker: narrator
          text: >-
            At last she went away. At that same moment, the tower clock struck one.
        - id: ch05-b18
          speaker: narrator
          text: >-
            From inside the chest, Christian heard soft music begin in the church. It grew louder and louder until it filled the whole building. Then came a multitude of footsteps, as though people were pouring in and taking every place. He heard a priest begin a service before the altar. Unseen voices answered with singing more beautiful than any Christian had heard in his life.
        - id: ch05-b19
          speaker: narrator
          text: >-
            The priest offered a prayer of thanksgiving. The land, he said, had been freed from war, plague, and every other misfortune, and the king's daughter had been delivered from the evil one. Many voices joined in a hymn of praise. Then Christian heard the priest speak again. This time, he heard his own name and the princess's name together, and he thought the invisible service was joining them in marriage.
        - id: ch05-b20
          speaker: narrator
          text: >-
            The church sounded packed with people, though Christian could see nothing at all. At last, the service ended. He heard the many footsteps again, now moving as if the unseen congregation were leaving. At the same time, the music grew fainter and fainter until it died away completely. Only when everything was silent did the first daylight begin to shine through the windows.
        - id: ch05-b21
          speaker: narrator
          text: >-
            Christian sprang from the chest, fell to his knees, and thanked God. The church was empty. Before the altar lay the princess, with the red and white color of a living person. She sobbed and shook with cold beneath her white shroud. Christian wrapped his sentry coat around her.
        - id: ch05-b22
          speaker: narrator
          text: >-
            Wrapped in Christian's coat, the princess dried her tears and took his hand. She thanked him and explained what he had done. Sorcery had been within her from the time of her birth. It had come over her again when her father broke the command and looked at her before she had completed her fourteenth year. By obeying the little man's instructions until dawn, Christian had finally set her free from it all.
        - id: ch05-b23
          speaker: princess
          text: >-
            If the man who rescued me will marry me, I will be his wife. If he will not, I shall enter a convent. But while I live, he can marry no one else, because the service for the dead that he heard has already joined us in marriage.
        - id: ch05-b24
          speaker: narrator
          text: >-
            The princess was now as beautiful as anyone could wish, and Christian was lord of the half kingdom promised for his third night of guard duty. They agreed to marry and love each other for the rest of their lives.
        - id: ch05-b25
          speaker: narrator
          text: >-
            With the first ray of sunlight, the watch came to unlock the church. The colonel was there as usual, but this time the king himself had come to learn what had happened to the sentinel. They found Christian and the princess sitting hand in hand on the step before the altar. The king knew his daughter at once. He gathered her into his arms and thanked both God and the man who had delivered her.
        - id: ch05-b26
          speaker: narrator
          text: >-
            The king accepted their decision. Christian the smith married the princess. He received half the kingdom at once and inherited all of it when the king died.
        - id: ch05-b27
          speaker: narrator
          text: >-
            And the other sentinels? With so many doors and windows to escape through, they had probably run away and joined the Prussian service. As for everything Christian claimed to have seen, remember that he had drunk more wine than was good for him.
