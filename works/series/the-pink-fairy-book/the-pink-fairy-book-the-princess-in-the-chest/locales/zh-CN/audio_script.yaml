audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 威严急躁，情绪来得直接
        timbre: 浑厚有力
        pace: 稍快
        pitch: 中低音
    maid:
      display_name: 侍女
      tts:
        delivery: 谨慎恭敬，言语诚恳
        timbre: 柔和清亮
        pace: 平稳
        pitch: 中高音
    wise_woman:
      display_name: 智慧老妇人
      tts:
        delivery: 沉着神秘，叮嘱时不容置疑
        timbre: 苍老而清晰
        pace: 缓慢
        pitch: 中低音
    princess:
      display_name: 公主
      tts:
        delivery: 清澈端庄，受魔法控制时凄厉迫切
        timbre: 明亮纯净
        pace: 从容而富于变化
        pitch: 中高音
    christian:
      display_name: 克里斯蒂安
      tts:
        delivery: 爽朗爱吹牛，害怕时又坦率局促
        timbre: 年轻结实
        pace: 明快
        pitch: 中音
    officer:
      display_name: 下级军官
      tts:
        delivery: 热络圆滑，善于劝诱
        timbre: 清楚爽利
        pace: 稍快
        pitch: 中音
    little_man:
      display_name: 小矮人
      tts:
        delivery: 平静坚定，指点时简洁严肃
        timbre: 低沉奇异
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 十四年的禁令
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位国王和一位王后，住在一座美丽的城堡里。他们的国土辽阔富饶，风光秀美，百姓也安居乐业。夫妻俩从一开始就十分恩爱，生活幸福，只可惜没有继承人。
        - id: ch01-b02
          speaker: narrator
          text: 两人结婚七年，既没有王子，也没有公主，心里都很悲伤。国王一发脾气，常把怨气撒在可怜的王后身上，说他们眼看都要老了，自己和王国却没有继承人，这全是她的错。王后听了十分难过，只能独自流泪，越想越苦恼。
        - id: ch01-b03
          speaker: king
          text: 我再也受不了啦！我没有孩子，全怪你。我要出门远行，一年以后回来。到那时，你若有了孩子，一切都好。我会比从前更爱你，再也不说一句气话。可我回来时，这个家还是空空的，我就只能离开你。
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 国王启程以后，王后孤零零地留在宫里，比从前更加忧愁。终于有一天，侍女想到了一个办法。
        - id: ch01-b05
          speaker: maid
          text: 陛下，只要您肯求助，我想一定能找到办法。国内有一位很有智慧的老妇人，她帮许多人摆脱过同样的烦恼。您若派人请她来，她准能帮助您。
        - id: ch01-b06
          speaker: narrator
          text: 王后把老妇人请进宫，把自己的痛苦全告诉了她。她生不出孩子，国王和整个王国也就没有继承人。老妇人果然知道该怎么办。
        - id: ch01-b07
          speaker: wise_woman
          text: 走出城堡，花园左边有一棵大橡树。树下长着一丛矮灌木，褐色比绿色多，叶片上有毛，还生着长刺。现在，枝头正好结了三个花苞。明天日出以前，您空着肚子，独自到那里摘下中间那个，吃掉它。六个月以后，您会生下一位公主。
        - id: ch01-b08
          speaker: wise_woman
          text: 公主一出生，就必须交给我安排的乳母。乳母要带她住进宫中僻静的一角，不许任何人探望。公主满十四岁以前，国王和王后都不能见她。谁若违背这条禁令，就会招来巨大的悲痛和灾祸。
        - id: ch01-b09
          speaker: narrator
          text: 王后重赏了老妇人。第二天太阳还没升起，她便来到花园，找到那丛生着三个花苞的灌木，摘下中间那个吃了。刚入口时很甜，随后却苦得像胆汁。六个月后，她生下一个女孩。老妇人安排的乳母早已等在那里，宫里也收拾好一处僻静的侧翼，窗外正对御苑。王后遵照嘱咐，立刻把孩子交给乳母，两人从此独自住在那里。
        - id: ch01-b10
          speaker: narrator
          text: 国王回宫，听说有了女儿，欢喜得不得了，马上就想见她。王后只好告诉他，预言警告过，公主满十四岁以前，父母无论谁看见她，都会惹来大祸。
        - id: ch01-b11
          speaker: narrator
          text: 十四年实在太久了。国王一心想见女儿，王后也同样思念她。乳母告诉王后，这孩子一出生就会说话，聪明得像大人。王后偶尔和乳母交谈，却始终没人见过公主。她亲眼见识过老妇人的本领，因此坚决不肯违背警告。国王一次次失去耐心，又一次次被王后劝住。就这样，他们等到了公主十四岁生日前的最后一天。
        - id: ch01-b12
          speaker: king
          text: 我不能再等，也不肯再等了！我现在就要见女儿。早几个钟头，晚几个钟头，能有什么分别？
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: 王后求他耐心等到第二天早晨。他们已经等了这么多年，再等一天又有什么难？国王却一点道理也听不进去。
        - id: ch01-b14
          speaker: king
          text: 别说这些了！她是你的女儿，也是我的女儿。我非见她不可。
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: 国王说完，径直上楼。他撞开房门，把阻拦的乳母推到一边，终于看见女儿。公主美得世间少有，肌肤红润洁白，像鲜血映着牛奶。她有一双清澈的蓝眼睛，一头灿烂的金发，只在额头正中长着一小绺褐色头发。
        - id: ch01-b16
          speaker: narrator
          text: 公主迎上来，搂住父亲的脖子，亲吻了他，随即说出一件可怕的事。
        - id: ch01-b17
          speaker: princess
          text: 父王啊，父王！您到底做了什么？明天我就必须死去。您得从三件事里选择一样。要么让黑死病席卷全国，要么打一场漫长而血腥的战争，要么等我死后，把我装进一口朴素的木箱，安放在教堂里。此后整整一年，每天晚上都要派一名哨兵守在箱旁。
          emotion: fearful
        - id: ch01-b18
          speaker: narrator
          text: 国王吓坏了，只当女儿病中胡言乱语。为了让她安心，他答应选择最后一样。
        - id: ch01-b19
          speaker: king
          text: 你若真的死去，我马上把你放进朴素的木箱，安放在教堂里，每晚派一名哨兵守着。不过，你不会死的。就算现在病了，你也一定不会死。
        - id: ch01-b20
          speaker: narrator
          text: 国王立刻召来全国最好的医生。医生们带着药方和药瓶赶到宫中，可第二天，公主已经全身冰冷僵硬，死去了。医生们逐一签名盖章，证明她确实死亡。至于救她，他们已经毫无办法。
    - id: ch02
      title: 木箱旁的哨兵
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 国王遵守了诺言。当天，公主的遗体被放进一口朴素的木箱，安置在城堡的小教堂里。当天夜里，以及此后的每一夜，都有一名哨兵被派进去，守在木箱旁边。
        - id: ch02-b02
          speaker: narrator
          text: 第一个清晨，人们来给哨兵开门，里面却不见他的踪影。大家以为他只是害怕，偷偷逃走了，第二晚便换了一个人。可清晨一到，第二个人也不见了。往后夜夜如此。假如他们真的逃了，谁也查不出究竟从哪里走的。可为什么每个人都要逃呢？为什么从守到公主木箱旁的那一刻起，他们便再没留下半点消息，也再没人见过他们？
        - id: ch02-b03
          speaker: narrator
          text: 众人渐渐相信，公主的幽灵会在夜里游荡，把守箱子的人一个个吃掉。很快，再也没人愿意接这项差事。国王手下的士兵还没轮到给她守灵，便纷纷逃离军队。国王只好许下重赏，招募自愿守夜的人。这个办法一度有用，几个不要命的家伙贪图丰厚赏金，肯进去试试。可他们谁也没拿到钱，因为第二天早晨，他们也像先前的人一样消失了。
        - id: ch02-b04
          speaker: narrator
          text: 这样的日子差不多过了整整一年。每晚都有人守在木箱旁，有的是被迫，有的是自愿。可第二天见不到他们，往后的任何一天也见不到。某一天的前夜，一名哨兵又照样消失了。就在那一天，一个快活的年轻铁匠来到国王城堡所在的都城。这里聚集着各地前来找活儿的人。铁匠名叫克里斯蒂安，因为家乡没有工作，也来都城谋生。
        - id: ch02-b05
          speaker: narrator
          text: 他走进客店大堂，坐下来吃东西。几名下级军官也在那里，他们每天都得四处找人去站岗。以往总能哄到一两个亡命徒，这一天却始终没找到人。公主木箱旁的哨兵会消失，早已人尽皆知。军官们找上的每个人都客客气气地道谢，然后一口回绝。于是，他们坐到克里斯蒂安身边，点来酒，陪他一起喝。
        - id: ch02-b06
          speaker: narrator
          text: 克里斯蒂安性情快活，喜欢热闹。酒一下肚，他能唱，会聊，也爱吹牛。他告诉军官，自己天不怕，地不怕。
        - id: ch02-b07
          speaker: officer
          text: 那你正是我们要找的人！今天还没过去，你就能轻松赚一大笔钱。只要在教堂里守一夜，站在国王女儿的木箱旁边，就能领到一百元。
        - id: ch02-b08
          speaker: narrator
          text: 克里斯蒂安什么也不怕，自然更不怕这件事。大家又为此喝了一瓶酒。他跟着军官去见上校，领了军服、火枪和其他装备，随后便被锁进教堂，担任当夜的哨兵。
        - id: ch02-b09
          speaker: narrator
          text: 晚上八点，他开始站岗。第一个钟头，他还为自己的勇气得意。第二个钟头，他想着将要到手的重赏，心里美滋滋的。可到了第三个钟头，眼看快十一点，酒劲渐渐散了，他开始不安。他听说过这个可怕的岗位，据人所知，还没有一个哨兵能活着逃出去，也没人知道那些失踪的人究竟去了哪里。醉意越淡，这件事越在他脑中打转。他把教堂四处搜了个遍，只想找到一条出路。终于，十一点时，他发现钟楼有扇小门没上锁，便悄悄钻出去准备逃跑。
        - id: ch02-b10
          speaker: narrator
          text: 一只脚才迈出门，他便看见一个小矮人站在面前。
        - id: ch02-b11
          speaker: little_man
          text: 晚上好，克里斯蒂安。你要到哪里去？
        - id: ch02-b12
          speaker: narrator
          text: 克里斯蒂安顿时像在地上生了根，半步也动不了。
        - id: ch02-b13
          speaker: christian
          text: 我哪儿也不去。
        - id: ch02-b14
          speaker: little_man
          text: 不对，你刚才正想逃跑。你已经答应今晚在教堂站岗，就必须留在那里。
        - id: ch02-b15
          speaker: narrator
          text: 克里斯蒂安低声下气地承认，自己实在不敢留下，所以才想逃走，还求小矮人放他一马。
        - id: ch02-b16
          speaker: little_man
          text: 不行，你必须守住岗位。不过，我能教你一个办法。登上布道坛，一直站在那里。无论看见什么，听见什么，都别理会。只要留在原处，等到死者回去，箱盖在她身后砰的一声合上，你就不会受伤。那时危险已经过去，你爱在教堂里走到哪里都行。
        - id: ch02-b17
          speaker: narrator
          text: 小矮人把他推回教堂，又从外面锁上门。克里斯蒂安赶忙登上布道坛，站在那里，对周围不闻不问。时钟敲响十二下，公主的木箱盖突然弹开，一个长得像公主的怪物从里面钻了出来，身上的装束正如图中所画。它一出来便尖声哭号。
        - id: ch02-b18
          speaker: princess
          text: 哨兵，你在哪里？哨兵，你在哪里？再不出来，我就让你遭受世上最残酷的死法！
          emotion: angry
        - id: ch02-b19
          speaker: narrator
          text: 它在教堂里四处寻找，终于发现铁匠躲在布道坛上，便冲过去爬上台阶。可它怎么也到不了顶，伸长身子，用尽力气，仍碰不到在高处发抖的克里斯蒂安。时钟敲响一点，它只得回到木箱。箱盖在它身后砰然合拢，教堂里随即一片死寂。
        - id: ch02-b20
          speaker: narrator
          text: 克里斯蒂安就地睡下。天光大亮后，他被门外的脚步声和钥匙开锁声惊醒。他走下布道坛，拿着火枪站到公主的木箱前。上校亲自带巡逻队进来，看到新兵安然无恙，惊讶极了。克里斯蒂安拒绝报告经过，上校只好把他直接带到国王面前。
    - id: ch03
      title: 第二夜的歌声
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 国王听说终于有人活着守过整夜，立即起床，把一百元赏钱放在桌上，接着盘问他。
        - id: ch03-b02
          speaker: king
          text: 你看见什么了吗？你看见我的女儿了吗？
        - id: ch03-b03
          speaker: christian
          text: 我守住了自己的岗位，这就够了。我答应的也只有这件事。
        - id: ch03-b04
          speaker: narrator
          text: 他不确定自己敢不敢讲出所见所闻。况且，别人没本事也没胆量做到的事，他偏偏做到了，心里难免有点得意。国王装作十分满意，问他第二夜是否还肯继续守岗。
        - id: ch03-b05
          speaker: christian
          text: 不了，多谢！这种事我再也不干啦！
        - id: ch03-b06
          speaker: king
          text: 随你吧。你表现得像个勇士。现在来吃早饭，熬过这一夜，你一定得补补力气。
        - id: ch03-b07
          speaker: narrator
          text: 国王摆好早餐，亲自陪他同桌，不断替他斟酒，夸赞他的胆量，又举杯祝他健康。克里斯蒂安不用人劝，饭菜和酒都享用得很痛快，尤其没少喝酒。最后，他的胆子又壮了起来，说只要国王给两百元，下一夜他也肯去。
        - id: ch03-b08
          speaker: narrator
          text: 事情说定以后，他向国王道别，回到卫兵中间，又同士兵和军官们一起进城。口袋里装满了钱，他便请众人吃喝，一边饮酒吹牛，一边嘲笑那些不敢站岗的窝囊废。他们害怕死去的公主吃人，可瞧瞧，她把克里斯蒂安吃掉了吗？他欢笑狂饮了一整天。到了晚上八点，又独自被锁进教堂。
        - id: ch03-b09
          speaker: narrator
          text: 还不到两个钟头，他便待腻了，只想赶快脱身。祭坛后面有扇小门没有上锁。十点一到，他便从那里溜出去，朝海滩飞奔。跑到半路，那个小矮人又突然挡住了他。
        - id: ch03-b10
          speaker: little_man
          text: 晚上好，克里斯蒂安。你要到哪里去？
        - id: ch03-b11
          speaker: christian
          text: 我获准想去哪儿就去哪儿。
        - id: ch03-b12
          speaker: narrator
          text: 话刚出口，铁匠便发觉双脚又不能动了。
        - id: ch03-b13
          speaker: little_man
          text: 不对，你答应今晚继续守夜，就该把这件事做好。
        - id: ch03-b14
          speaker: narrator
          text: 小矮人抓住克里斯蒂安。铁匠再不情愿，也只能跟着他返回那扇小门。
        - id: ch03-b15
          speaker: little_man
          text: 进去以后，站到祭坛前，把那里的书拿在手里。一直等到死者回去，箱盖在她头顶砰然合上。照我说的做，你就不会受伤。
        - id: ch03-b16
          speaker: narrator
          text: 小矮人把他推进门，随即上了锁。克里斯蒂安走到祭坛前，拿着那本书站好。十二点的钟声一响，怪物便从木箱里跳出来，尖叫着寻找哨兵，又直扑布道坛。它冲到最上面，却发现那里空无一人，于是哭号着唱起来。
        - id: ch03-b17
          speaker: princess
          text: 父王未把哨兵派，瘟疫战争今夜来。
          emotion: angry
        - id: ch03-b18
          speaker: narrator
          text: 这时，它看见铁匠站在祭坛前，立刻向他猛扑过去。
        - id: ch03-b19
          speaker: princess
          text: 原来你在这里！这回我可要抓住你了！
          emotion: angry
        - id: ch03-b20
          speaker: narrator
          text: 可它迈不过祭坛前的那级台阶，只能守在那里哭号、尖叫，不停恐吓。时钟敲响一点，它不得不钻回木箱，箱盖在头顶砰然合上。这一夜，它已不如前一夜那么可怕，也没有那么丑陋了。
        - id: ch03-b21
          speaker: narrator
          text: 教堂安静下来，铁匠便在祭坛前躺下，安稳睡到清晨。上校来接他出去，又把他带到国王面前。一切都和前一天一样。他领了赏钱，却仍不肯说明自己有没有见过国王的女儿，还说再也不接这项差事。可是，一顿丰盛的早餐下肚，又好好品尝了国王的美酒以后，他答应守第三夜。不过，这回少于半个王国，他绝不肯干，因为这个岗位实在危险。国王只得答应，把半个王国许给他。
    - id: ch04
      title: 第三夜的解救
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 余下的一天和前一天一样。克里斯蒂安扮足了爱吹牛的士兵和快活铁匠，周围挤满伙伴和酒友。晚上八点，他重新穿上军服，又被锁进教堂。还不到一个钟头，他就清醒了。
        - id: ch04-b02
          speaker: christian
          text: 趁现在运气还好，最好赶紧收手。第三夜准是最可怕的。我喝醉了才答应这件事，国王说给我半个王国，也不可能当真！
        - id: ch04-b03
          speaker: narrator
          text: 他决定早早逃走，不像前两夜那样久等，这样就能避开小矮人。所有门都锁得严严实实，他只好爬到一扇高窗前，把窗打开。九点钟声一响，他便钻了出去。窗子离地很高，好在落地时一根骨头也没摔断。他一路飞奔到海边，没遇见任何人，便跳进小船，划离岸边。想到这条妙计，也想到终于骗过小矮人，他忍不住暗自大笑。就在这时，岸上传来熟悉的声音。
        - id: ch04-b04
          speaker: little_man
          text: 晚上好，克里斯蒂安。你要到哪里去？
        - id: ch04-b05
          speaker: narrator
          text: 克里斯蒂安没有回答，只顾使劲划桨，心想这回小矮人的腿再快也追不上。谁知有什么东西抓住小船，任凭他拼命划，船还是被径直拖回岸边。
        - id: ch04-b06
          speaker: little_man
          text: 你答应过守住岗位，就必须留下。
        - id: ch04-b07
          speaker: narrator
          text: 铁匠愿意也好，不愿意也罢，只得一路跟着他返回教堂。到了墙下，克里斯蒂安说窗户实在太高，自己绝不可能再从那里进去。
        - id: ch04-b08
          speaker: little_man
          text: 你必须从那里进去，也一定进得去。
        - id: ch04-b09
          speaker: narrator
          text: 小矮人说着，把他举上窗台，然后仔细叮嘱他。
        - id: ch04-b10
          speaker: little_man
          text: 今晚，紧贴着木箱左边躺下。箱盖会向右打开，她会从左边出来。等她从你身上跨过去，就赶紧钻进箱子躺好，千万别让她看见。一直躺到天亮。无论她威胁你，还是哀求你，都不能出来，也不能回答。这样她就伤不了你，你和她也都能得到解救。
        - id: ch04-b11
          speaker: narrator
          text: 铁匠只得从原路爬进窗户，紧贴着公主木箱的左侧，直挺挺地躺下。他像石头一样一动不动，直到时钟敲响十二下。箱盖向右猛然弹开，公主从里面出来，正好从他身上跨过去。她才一过去，克里斯蒂安便赶紧钻进木箱躺好，没有让她看见。公主在教堂里来回狂奔，哭号着寻找哨兵，又一直冲到祭坛前，却发现那里空无一人。于是，她再次唱道。
        - id: ch04-b12
          speaker: princess
          text: 哨兵，你在哪里？哨兵，你在哪里？父王未把哨兵派，瘟疫战争就要来。
          emotion: fearful
        - id: ch04-b13
          speaker: narrator
          text: 她上上下下走遍整座教堂，一边叹息流泪，一边又唱了一遍。
        - id: ch04-b14
          speaker: princess
          text: 父王未把哨兵派，瘟疫战争就要来。
          emotion: sad
        - id: ch04-b15
          speaker: narrator
          text: 随后，她离开了。就在同一刻，塔楼上的时钟敲响一点。
        - id: ch04-b16
          speaker: narrator
          text: 铁匠躺在木箱里，听见教堂响起轻柔的乐声。声音越来越响，很快充满整座教堂。无数脚步随之传来，仿佛人群正不断涌入。祭司在祭坛前主持仪式，又响起了他一生从未听过的美妙歌声。祭司献上感恩的祈祷，感谢上天让这个国家免受战争、瘟疫和一切灾祸，也让国王的女儿摆脱邪魔。许多声音一同加入，唱起赞美诗。
        - id: ch04-b17
          speaker: narrator
          text: 随后，祭司再次开口。克里斯蒂安听见自己和公主的名字，觉得那是在为他们举行婚礼。教堂似乎挤得满满当当，他却一个人也看不见。后来，密集的脚步声又响起来，仿佛所有人正依次离开教堂。乐声也越来越轻，越来越远，终于完全消失。四周重归寂静，第一缕晨光开始透过窗户照进来。
    - id: ch05
      title: 公主归来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 铁匠从木箱里跳出来，跪在地上感谢上帝。教堂空无一人，可祭坛前躺着公主。她的脸红润洁白，已经恢复活人的模样，却还在哭泣，身上裹着白色尸衣，冷得不停发抖。铁匠脱下哨兵外套，披在她身上。公主擦干眼泪，握住他的手向他道谢。
        - id: ch05-b02
          speaker: princess
          text: 你已经解除了我身上所有的魔法。那魔法从我出生时便缠着我。父王违背禁令，没等我满十四岁就见了我，它才会重新发作。
        - id: ch05-b03
          speaker: princess
          text: 你救了我。你若愿意娶我，我便嫁给你。若不愿，我就进入修道院。只要我还活着，你便不能另娶别人，因为你听见的那场亡者礼拜，已经让我们结为夫妻。
        - id: ch05-b04
          speaker: narrator
          text: 这时的公主，是任谁见了都会心动的绝色少女。铁匠也已经是半个王国的主人，那正是国王为了让他守第三夜而许下的赏赐。一个得到了解救，一个赢得了半个王国。于是，两人说定要结为夫妻，并且一生一世彼此相爱。
        - id: ch05-b05
          speaker: narrator
          text: 第一束阳光照进来时，值守的卫兵们来到门外，打开了教堂。来的不只有上校，国王也亲自赶来，要看看这一夜哨兵究竟遭遇了什么。他发现两人手牵着手，并肩坐在祭坛前的台阶上，马上认出那正是自己十四年来日夜想见的女儿。国王立刻把她抱进怀里，又感谢上帝和救她的人。国王没有反对两人的约定。于是，铁匠克里斯蒂安和公主举行婚礼，当即得到半个王国。国王去世以后，整个王国也归了他。
        - id: ch05-b06
          speaker: narrator
          text: 至于其他哨兵，教堂里开着那么多门窗，他们大概早就逃走，投奔普鲁士军队去了。至于克里斯蒂安声称看见的那些事——唉，他喝的酒实在太多了些。
