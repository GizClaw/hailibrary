audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    shoemaker:
      display_name: "约瑟夫师傅"
      tts:
        delivery: "机敏圆滑，编起谎话镇定自若"
        timbre: "灵活明亮的成年男声"
        pace: "适中偏快"
        pitch: "中音"
    wife:
      display_name: "艾塔"
      tts:
        delivery: "爽利务实，配合丈夫演戏时自然沉着"
        timbre: "清晰成熟的女声"
        pace: "适中"
        pitch: "中音"
    woman_1:
      display_name: "第一位女顾客"
      tts:
        delivery: "和气大方，说话干脆"
        timbre: "温和清亮的女声"
        pace: "适中"
        pitch: "中音"
    woman_2:
      display_name: "第二位女顾客"
      tts:
        delivery: "爽快利落，语气亲切"
        timbre: "明朗的女声"
        pace: "适中"
        pitch: "中音"
    robber_captain:
      display_name: "强盗头领"
      tts:
        delivery: "蛮横好胜，受骗后仍强装得意"
        timbre: "粗哑厚重的男声"
        pace: "适中偏快"
        pitch: "低音"
    robber_2:
      display_name: "强盗甲"
      tts:
        delivery: "贪心急切，轻信又冲动"
        timbre: "粗亮的男声"
        pace: "偏快"
        pitch: "中低音"
    robber_3:
      display_name: "强盗乙"
      tts:
        delivery: "凶悍直率，随众人起哄"
        timbre: "沙哑的男声"
        pace: "适中"
        pitch: "低音"
    robber_4:
      display_name: "强盗丙"
      tts:
        delivery: "贪婪粗鲁，跟着同伴附和"
        timbre: "结实的男声"
        pace: "适中"
        pitch: "中低音"
    captain_wife:
      display_name: "头领的妻子"
      tts:
        delivery: "直率警醒，面对怪事毫不客气"
        timbre: "成熟有力的女声"
        pace: "适中"
        pitch: "中音"
    captain_daughter:
      display_name: "头领的女儿"
      tts:
        delivery: "听话利落，语气朴实"
        timbre: "清脆年轻的女声"
        pace: "适中"
        pitch: "中高音"
    swineherd:
      display_name: "猪倌"
      tts:
        delivery: "单纯直爽，羡慕时满怀向往"
        timbre: "朴实开朗的男声"
        pace: "适中"
        pitch: "中音"
  chapters:
    - id: ch01
      title: "鞋匠的好运气"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前有个鞋匠，一直找不到活儿，穷得和妻子几乎要饿死。两个人就这样苦等着，日子一点也没有起色。最后，鞋匠实在等不下去了，决定去马斯卡卢恰碰碰运气。"
        - id: ch01-b02
          speaker: shoemaker
          text: "留在这里也找不到活儿。我去马斯卡卢恰看看，说不定能走好运。"
        - id: ch01-b03
          speaker: narrator
          text: "到了马斯卡卢恰，他沿街吆喝起来。很快，一扇窗户开了，一个女人探出头来。"
        - id: ch01-b04
          speaker: shoemaker
          text: "谁有鞋要修？"
        - id: ch01-b05
          speaker: woman_1
          text: "我有一双。你帮我补好吧。"
        - id: ch01-b06
          speaker: narrator
          text: "鞋匠坐在她家门阶上，把鞋补好了。"
        - id: ch01-b07
          speaker: woman_1
          text: "该给你多少钱？"
        - id: ch01-b08
          speaker: shoemaker
          text: "工钱是一先令。"
        - id: ch01-b09
          speaker: woman_1
          text: "给你十八便士。祝你好运！"
        - id: ch01-b10
          speaker: narrator
          text: "鞋匠继续往前走，拐进下一条街，又吆喝起来。另一扇窗很快也开了。"
        - id: ch01-b11
          speaker: woman_2
          text: "我这里也有鞋要补。"
        - id: ch01-b12
          speaker: narrator
          text: "他还是坐在门阶上干活。鞋补完了，女人问起工钱。"
        - id: ch01-b13
          speaker: shoemaker
          text: "这回收一弗罗林。"
        - id: ch01-b14
          speaker: woman_2
          text: "给你一枚克朗。愿好运跟着你！"
        - id: ch01-b15
          speaker: narrator
          text: "女人关上窗户。鞋匠盘算着，这一天赚得真好，索性先不回妻子身边。只要照这个势头继续干，很快就能攒够钱，买上一头驴。他打定主意，又在城里待了几天，直到四枚金币稳稳当当地装进钱袋。接着，他来到集市，花两枚金币买下一头健壮的驴，骑上驴背，朝卡塔尼亚的家走去。"
        - id: ch01-b16
          speaker: narrator
          text: "走进一片密林时，他远远看见一伙强盗正飞快赶来。鞋匠心里明白，这下糟了，那些人准会抢光他辛苦挣来的钱，让他重新变成从前那个穷光蛋。可他个子虽小，却既机灵又有胆量，并没有灰心。他取出五枚弗罗林，悄悄藏到驴子浓密的鬃毛下面，这才继续赶路。"
        - id: ch01-b17
          speaker: narrator
          text: "强盗冲到跟前，果然抓住他，搜走了他身上的钱。"
        - id: ch01-b18
          speaker: shoemaker
          text: "好心的朋友们，我只是个穷鞋匠。如今除了这头驴，我什么也没有啦！"
        - id: ch01-b19
          speaker: narrator
          text: "他一边说，一边绞着双手。驴子恰好抖了抖身子，五枚弗罗林叮叮当当地落下来。"
        - id: ch01-b20
          speakers: [robber_captain, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: "这些钱是从哪儿来的？"
          emotion: surprised
        - id: ch01-b21
          speaker: shoemaker
          text: "唉，我的秘密还是让你们发现了。它是一头金驴，我花的钱全是它给的。"
        - id: ch01-b22
          speakers: [robber_captain, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: "把驴卖给我们！价钱随你开！"
        - id: ch01-b23
          speaker: narrator
          text: "鞋匠起初一口咬定，无论如何也舍不得卖。强盗们再三央求，他最后才收下五十枚金币，把驴交了出去。"
        - id: ch01-b24
          speaker: shoemaker
          text: "你们得轮流养它，每人一夜一天。要不然，为了那些钱，你们非打起来不可。"
        - id: ch01-b25
          speaker: narrator
          text: "双方就此分手。强盗赶着驴回森林里的山洞，鞋匠也心满意足地踏上归途，为自己的计策得手暗暗高兴。路上，他停下来买了一顿好饭。第二天，他又拿出大半所得，买下一座小葡萄园。"
    - id: ch02
      title: "不会生钱的金驴"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "强盗们回到山洞，头领把大家叫到一起，说第一夜该由他养驴。同伴都同意了。他随即叫妻子在马厩里铺一张褥子。"
        - id: ch02-b02
          speaker: captain_wife
          text: "你疯了吗？为什么要睡在马厩里？"
          emotion: surprised
        - id: ch02-b03
          speaker: robber_captain
          text: "这不关你的事！照我的话做。明天我会带财宝给你。"
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: "天刚蒙蒙亮，头领便醒了。他把马厩翻了个遍，连一枚钱也没找到，这才明白约瑟夫师傅一直在拿他们取乐。可他不愿独自丢脸，便决定让同伴们也尝尝被骗的滋味。"
        - id: ch02-b05
          speaker: robber_captain
          text: "既然我上了当，其他人也别想好过。"
        - id: ch02-b06
          speaker: narrator
          text: "不久，一个手下跑来，急着问他得了多少钱。"
        - id: ch02-b07
          speaker: robber_2
          text: "头儿，那头驴给了你多少？"
        - id: ch02-b08
          speaker: robber_captain
          text: "伙计，你根本想不到！等人人都轮过一遍，我再告诉你们。"
          emotion: happy
        - id: ch02-b09
          speaker: narrator
          text: "就这样，强盗们一个接一个地养驴，谁也没有得到半个钱。等全伙人都被骗过，他们才聚在一起商议，决定直奔鞋匠家，好好惩治这个狡猾的家伙。鞋匠和上次一样，远远就看见他们来了。他没有干等，而是立刻琢磨怎样才能再骗他们一次，很快便想出了主意。"
        - id: ch02-b10
          speaker: shoemaker
          text: "艾塔，快把一个膀胱装满血，绑在脖子上。强盗来讨买驴的钱时，我会大声叫你去拿。你只管和我争辩，说什么也不肯听话。到时候我会拿刀刺破膀胱，你就倒在地上装死，一直躺着别动。等我弹起吉他，你再站起来跳舞。"
        - id: ch02-b11
          speaker: narrator
          text: "艾塔赶紧照丈夫的话准备好。她一刻也不敢耽搁，因为强盗们已经离房子很近了。没过多久，他们便吵吵嚷嚷地闯进门，围住鞋匠，把他拿假金驴骗人的事骂了个狗血淋头。"
        - id: ch02-b12
          speaker: shoemaker
          text: "这头可怜的驴换了主人，可能就没了本领。不过别吵，我会退还那五十枚金币。艾塔，快去楼上的箱子里取钱，交给这几位先生。"
        - id: ch02-b13
          speaker: wife
          text: "等一等。我得先把鱼烤好，现在走开就糟蹋了。"
        - id: ch02-b14
          speaker: shoemaker
          text: "叫你去就马上去！"
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: "他跺着脚，装出暴怒的样子。见妻子一动不动，他抽刀刺向她的脖子。膀胱里的血喷了出来，艾塔倒在地上，像死了一样。"
        - id: ch02-b16
          speakers: [robber_captain, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: "你做了什么？她什么也没做呀！"
          emotion: surprised
        - id: ch02-b17
          speaker: shoemaker
          text: "也许是我太性急了，不过这事很容易补救。"
        - id: ch02-b18
          speaker: narrator
          text: "他从墙上取下吉他，弹了起来。第一个音才刚响，妻子就坐了起来。接着，她站起身，当着所有人的面跳起舞来。强盗们张着嘴，眼睛一眨不眨，全都看呆了。"
        - id: ch02-b19
          speakers: [robber_captain, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: "约瑟夫师傅，五十枚金币你留着吧。告诉我们，这把吉他要多少钱才肯卖？"
        - id: ch02-b20
          speaker: shoemaker
          text: "这可不行！每次和妻子吵架，我总要一刀杀了她，好让自己消气。我早就改不掉这个习惯了。没有吉他，我还怎么让她活过来？"
        - id: ch02-b21
          speaker: narrator
          text: "强盗们不肯罢休。鞋匠最后收下四十枚金币，把吉他卖给了他们。"
    - id: ch03
      title: "不能救命的吉他"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "强盗们带着新买的吉他回到森林里的山洞，为这件宝贝高兴极了，人人都盼着快点找个机会试试它的本领。头领却宣称，第一次仍旧归他，等他试完以后才轮得到别人。那天晚上，他把妻子叫来。"
        - id: ch03-b02
          speaker: robber_captain
          text: "今晚做了什么饭？"
        - id: ch03-b03
          speaker: captain_wife
          text: "我做了通心粉。"
        - id: ch03-b04
          speaker: robber_captain
          text: "为什么没煮鱼？"
        - id: ch03-b05
          speaker: narrator
          text: "他一点也没生气，却还是一刀刺进妻子的脖子，把她杀死了。接着，他抓起吉他拼命弹，可无论弹得多响，死去的妻子始终一动不动。"
        - id: ch03-b06
          speaker: robber_captain
          text: "这个骗子！这个恶棍！他已经骗我两次了。我要让他付出代价！"
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: "头领气得又吼又骂，发誓要报复鞋匠，可这些全都没有用。摆在眼前的事实没有改变，他亲手杀了妻子，再也没法让她活过来。第二天早晨，一个强盗来取吉他，也想听听头领试过以后怎么样。"
        - id: ch03-b08
          speaker: robber_2
          text: "怎么样，吉他管用吗？"
        - id: ch03-b09
          speaker: robber_captain
          text: "太管用了！我刺死妻子，再弹起吉他，她现在已经跟从前一样好好的。"
          emotion: happy
        - id: ch03-b10
          speaker: robber_2
          text: "真的？那今晚轮到我来试。"
          emotion: surprised
        - id: ch03-b11
          speaker: narrator
          text: "接下来的事全都一个样。每个强盗都先听见上一人谎称吉他十分灵验，再回家偷偷杀死自己的妻子。直到所有妻子都死了，他们才互相低声说出那桩可怕的真相，并发誓一定要向鞋匠报仇。"
        - id: ch03-b12
          speaker: narrator
          text: "这伙人立刻赶去鞋匠家。鞋匠照旧远远看见了他们。艾塔正在厨房洗东西，他赶紧嘱咐妻子。"
        - id: ch03-b13
          speaker: shoemaker
          text: "他们问起我，你就说我去葡萄园了。然后叫狗去喊我，再把它赶出门。"
        - id: ch03-b14
          speaker: narrator
          text: "把话交代清楚以后，鞋匠从后门跑出去，藏在一个木桶后面。几分钟后，强盗们赶到了，站在屋外扯着嗓子，非要鞋匠出来不可。"
        - id: ch03-b15
          speaker: wife
          text: "几位先生，他去葡萄园了。我马上让狗去叫他。快去告诉主人，有客人等着和他说话。快去！"
        - id: ch03-b16
          speaker: narrator
          text: "她打开门，把狗放了出去。"
        - id: ch03-b17
          speakers: [robber_captain, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: "这条狗真能把你丈夫叫回来？"
        - id: ch03-b18
          speaker: wife
          text: "当然能。它什么都懂，我交代的口信，它每次都能送到。"
        - id: ch03-b19
          speaker: narrator
          text: "过了一会儿，鞋匠回来了。"
        - id: ch03-b20
          speaker: shoemaker
          text: "早上好，先生们。狗说你们有话要和我谈。"
        - id: ch03-b21
          speaker: robber_2
          text: "我们就是来谈那把吉他的！你害得我们杀了所有妻子。我们照你的话弹奏，她们却一个也没活过来。"
          emotion: angry
        - id: ch03-b22
          speaker: shoemaker
          text: "那是你们没有弹对。只能怪你们自己。"
        - id: ch03-b23
          speakers: [robber_captain, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: "只要把狗卖给我们，吉他的事就算了。"
        - id: ch03-b24
          speaker: shoemaker
          text: "不行！没有它，我一天也过不下去。"
        - id: ch03-b25
          speaker: narrator
          text: "强盗们开出四十枚金币的价钱。鞋匠还是装作万般舍不得，推让了一番，最后终于收下钱，把狗交给了他们。"
    - id: ch04
      title: "不会送信的狗"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "强盗带着狗回到山洞，头领照例抢到了第一次。"
        - id: ch04-b02
          speaker: robber_captain
          text: "女儿，我要去客店。有人来找我，你就放开狗，让它去叫我。"
        - id: ch04-b03
          speaker: narrator
          text: "大约过了一个钟头，果然有人来找头领办事。姑娘解开狗绳。"
        - id: ch04-b04
          speaker: captain_daughter
          text: "快去客店，把我父亲叫回来！"
        - id: ch04-b05
          speaker: narrator
          text: "狗飞奔出去，却径直跑回鞋匠家。头领回家后找不到狗，猜它一定回了原来的主人那里。天虽然已经黑了，他还是追了过去。"
        - id: ch04-b06
          speaker: robber_captain
          text: "约瑟夫师傅，我的狗在你这里吗？"
        - id: ch04-b07
          speaker: shoemaker
          text: "在这儿！这可怜的小家伙太舍不得我。你得给它一点时间，让它习惯新日子。"
        - id: ch04-b08
          speaker: narrator
          text: "头领把狗带了回去。第二天早晨，他把狗交给另一个强盗，只告诉对方，这畜生确实有鞋匠说的本领。第二个强盗试过之后，也把自己上当的事瞒得严严实实，趁人不知偷偷去鞋匠家领回了狗。接下来，全伙人一个又一个，做的都是同样的事。直到人人都吃过苦头，他们才碰面说出全部真相。"
        - id: ch04-b09
          speaker: narrator
          text: "第二天，他们怒气冲冲地奔向那个一再拿自己取乐的人。强盗们先痛骂鞋匠一再欺骗他们，接着把他结结实实地捆进麻袋，告诉他，这一回要把他扔进海里。鞋匠既不挣扎，也不求饶，只管静静躺着，任凭他们摆布。"
        - id: ch04-b10
          speaker: narrator
          text: "走到一座教堂前，强盗们又热又累。"
        - id: ch04-b11
          speakers: [robber_captain, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: "太阳这么晒，麻袋又这么沉。先放在这里，我们进去歇会儿。"
        - id: ch04-b12
          speaker: narrator
          text: "他们把麻袋丢在路边，走进教堂。附近的山坡上，一个猪倌正看守着一大群猪，快活地吹着口哨。"
    - id: ch05
      title: "海底的猪群"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "约瑟夫师傅听见口哨，扯开嗓子大喊。"
        - id: ch05-b02
          speaker: shoemaker
          text: "我不干！说什么我也不干！"
        - id: ch05-b03
          speaker: swineherd
          text: "你不肯干什么？"
        - id: ch05-b04
          speaker: shoemaker
          text: "他们非逼我娶国王的女儿，可我就是不肯。"
        - id: ch05-b05
          speaker: swineherd
          text: "你可真走运！要是他们逼的是我，那该多好。"
        - id: ch05-b06
          speaker: shoemaker
          text: "你只想要这个？那好办。你钻进麻袋，把我放出来。"
        - id: ch05-b07
          speaker: narrator
          text: "猪倌打开麻袋，钻进去换出了鞋匠。鞋匠赶着那群猪，高高兴兴地走了。"
        - id: ch05-b08
          speaker: narrator
          text: "强盗们歇够以后，走出教堂，抬起麻袋一路来到海边。他们把麻袋扔进水里，眼看着它一下沉了下去，便转身往回走。谁知半路上，他们竟迎面看见鞋匠赶着那群猪。强盗们全都停住脚，一个个张大嘴巴，瞪着他发呆。"
        - id: ch05-b09
          speaker: shoemaker
          text: "你们不知道海里有多少猪！水越深，猪就越多。这些是我刚从海底带上来的，我还想回去多弄几头。"
        - id: ch05-b10
          speakers: [robber_captain, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: "海里真的还有猪？"
          emotion: surprised
        - id: ch05-b11
          speaker: shoemaker
          text: "多得根本数不清。我来告诉你们该怎么办。"
        - id: ch05-b12
          speaker: narrator
          text: "他把强盗们领回海边。"
        - id: ch05-b13
          speaker: shoemaker
          text: "每个人都在脖子上绑块石头，这样才能沉得够深。你们刚才看见的那些猪，都是我从很深很深的水底找到的。"
        - id: ch05-b14
          speaker: narrator
          text: "强盗们贪心极了，果真各自找来石头，牢牢绑在脖子上。他们一个接一个跳进海里，想沉到深处寻找猪群，结果全部淹死了。约瑟夫师傅赶着猪群回了家。从那以后，他成了有钱人，一辈子都过得富足。"
