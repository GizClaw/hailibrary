  chapters:
    - id: ch01
      title: The Lion in the Meadow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a girl so poor that she wandered from place to place, asking for charity. One day she came to a thatched cottage and asked if there was any work she could do.
        - id: ch01-b02
          speaker: farmer
          text: My cowherd has left me. If the place suits you, you may tend my cows.
        - id: ch01-b03
          speaker: narrator
          text: So the girl became a cowherd. One morning, as she drove the cows through the meadows, she heard a great groan nearby. It sounded almost human. She hurried toward it and found a lion stretched upon the ground.
        - id: ch01-b04
          speaker: narrator
          text: She was terribly frightened. Yet the lion was in such pain that she felt sorry for him. She crept closer until she saw a large thorn buried in one paw. She pulled it free, bound the sore place, and the grateful lion licked her hand with his big, rough tongue.
        - id: ch01-b05
          speaker: narrator
          text: When she had finished caring for the lion, she went back to find the cows. They were gone. She hunted everywhere, but never found them. At last she returned to the cottage and confessed what had happened. Her master scolded her bitterly, and afterward he beat her.
        - id: ch01-b06
          speaker: farmer
          text: From now on, you will look after the asses.
        - id: ch01-b07
          speaker: narrator
          text: Every day after that, she took the asses into the woods to feed.
    - id: ch02
      title: The Lion Returns
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Exactly one year after she first found the lion, the girl heard another groan that sounded human. She went straight toward it. To her great surprise, the same lion lay there with a deep wound across his face.
        - id: ch02-b02
          speaker: narrator
          text: This time she was not afraid. She ran to him, washed the wound, laid soothing herbs over it, and bound it carefully. Once again, the lion thanked her by licking her hand.
        - id: ch02-b03
          speaker: narrator
          text: When the lion's wound was bound, she returned to the asses. They were nowhere to be seen. She searched here and she searched there, but they had vanished completely. Once more, she had to go home and confess to her master. First he scolded her, and afterward he beat her.
        - id: ch02-b04
          speaker: farmer
          text: Go on, then. You can tend the pigs now!
        - id: ch02-b05
          speaker: narrator
          text: The next day she took the pigs out and found them such rich feeding grounds that they grew fatter day by day.
        - id: ch02-b06
          speaker: narrator
          text: Another year passed. One morning she heard that same almost-human groan. She ran toward it and found her old friend beneath a tree. The lion was wounded through and through, and he was close to death.
        - id: ch02-b07
          speaker: narrator
          text: She dropped to her knees. One by one, she washed his wounds and covered them with healing herbs. The lion licked her hands in thanks and asked her to stay beside him.
        - id: ch02-b08
          speaker: maiden
          text: I cannot stay. I have to watch the pigs, and I must go see that they are safe.
        - id: ch02-b09
          speaker: narrator
          text: She ran back, but the pigs had vanished as though the earth had swallowed them. She whistled and called. Only the birds answered.
        - id: ch02-b10
          speaker: narrator
          text: The girl sank to the ground and wept. For hours, she did not dare go home. When she had cried all she could, she searched every part of the wood. It was no use. There was not one sign of the pigs.
    - id: ch03
      title: The Secret Behind the Rock
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last she climbed a tree, hoping she could see farther from the top. She had barely settled on the highest branch when she forgot all about the pigs. A handsome young man was walking down the path. As he reached the tree, he pulled a rock aside and disappeared behind it.
        - id: ch03-b02
          speaker: narrator
          text: The girl rubbed her eyes. Had she dreamed it? She decided to stay where she was until he came out, so she could discover who he was.
        - id: ch03-b03
          speaker: narrator
          text: At dawn, the rock moved aside and a lion came out. Once he was gone, the girl climbed down, pushed the rock aside, and stepped through the opening. A path led her to a beautiful house.
        - id: ch03-b04
          speaker: narrator
          text: At the end of the path stood a beautiful house. She went inside, swept the rooms, dusted the furniture, and put everything in order. On a shelf in one corner, she found a very good dinner and ate it. Then she left the house and climbed back to the top of her tree.
        - id: ch03-b05
          speaker: narrator
          text: At sunset, the same young man came gaily along the path and vanished behind the rock. The next morning, the lion came out. He looked sharply in every direction, saw no one, and disappeared into the forest.
        - id: ch03-b06
          speaker: narrator
          text: As soon as the lion was out of sight, the maiden came down and did exactly what she had done the day before. For three days, she secretly went into the palace and tidied everything. Still she was no closer to learning the young man's secret. So that evening, when she saw him coming through the wood, she climbed down and begged him to tell her his name.
        - id: ch03-b07
          speaker: prince
          text: I am glad to see you. I thought you must be the one who has secretly cared for my house these past few days. I am a prince, but a powerful giant has enchanted me. I may wear my own shape only at night. All day long, I must be the lion you have helped so often. The giant also stole the cows, the asses, and the pigs to punish you for being kind to me.
        - id: ch03-b08
          speaker: maiden
          text: Tell me what I can do to break the spell.
        - id: ch03-b09
          speaker: prince
          text: I fear it will be very hard. You must get a lock of hair from a king's daughter, spin it, and make a cloak for the giant who lives at the top of a high mountain.
        - id: ch03-b10
          speaker: maiden
          text: Then I will go to the city. I will knock at the palace door and ask the princess to take me as her servant.
    - id: ch04
      title: The Princess's Golden Hair
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The two parted. In the city, the maiden walked through the streets calling for work.
        - id: ch04-b02
          speaker: maiden
          text: Who will hire me as a servant? Who needs a servant?
        - id: ch04-b03
          speaker: narrator
          text: Many people liked the look of her, because she was clean and neat, and they offered her work. But she would listen to none of them. She kept walking through the streets and calling for a place until the princess's waiting-maid came by.
        - id: ch04-b04
          speaker: waiting_maid
          text: What kind of work can you do?
        - id: ch04-b05
          speaker: narrator
          text: The girl had to admit that she could do very little.
        - id: ch04-b06
          speaker: waiting_maid
          text: Then you can work in the scullery and wash the dishes.
        - id: ch04-b07
          speaker: narrator
          text: They went straight to the palace. There the maiden arranged her own hair and made herself look so neat and smart that everyone praised her. Before long, the princess heard about her and sent for her.
        - id: ch04-b08
          speaker: narrator
          text: When the princess saw how beautifully the girl had dressed her own hair, she told her to come and comb the royal hair as well. The princess's hair was very thick and long, and it shone like the sun. The maiden combed and combed it until it gleamed more brightly than ever.
        - id: ch04-b09
          speaker: narrator
          text: The princess was pleased and called her back each day. At last, the maiden found the courage to ask for one of those long, thick locks.
        - id: ch04-b10
          speaker: princess
          text: No. I will not part with any of my hair.
        - id: ch04-b11
          speaker: narrator
          text: But every day the maiden begged for just one tress. At last, the princess lost her patience.
        - id: ch04-b12
          speaker: princess
          text: Very well, you may have it. But only if you find the handsomest prince in the world and bring him to be my bridegroom!
          emotion: angry
        - id: ch04-b13
          speaker: maiden
          text: I will do it.
        - id: ch04-b14
          speaker: narrator
          text: She cut off the lock and wove it into a coat that glittered like silk. Then she carried it to the prince. He told her to take it straight to the giant. He also warned her to shout what she was carrying while she was still far away. Otherwise, the giant would leap on her and run her through with his sword.
    - id: ch05
      title: The Giant's Coat
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The maiden climbed the mountain. Before she reached the top, the giant heard her footsteps. He rushed out breathing fire and flame, with a sword in one hand and a club in the other.
        - id: ch05-b02
          speaker: maiden
          text: I have brought your coat! I have brought the coat for you!
        - id: ch05-b03
          speaker: narrator
          text: At once the giant grew quiet and invited her inside. He tried on the coat, but it was too short. He flung it off.
        - id: ch05-b04
          speaker: giant
          text: This is no use to me. It does not fit.
        - id: ch05-b05
          speaker: narrator
          text: Sadly, the maiden picked up the useless coat. She came down the mountain and returned to the king's palace in despair. The next morning, while she was combing the princess's hair, she begged for another lock. At first the princess said no. The maiden pleaded so earnestly that at last she gave in, but only on one condition.
        - id: ch05-b06
          speaker: princess
          text: You may take another lock, but you must find me a prince for my bridegroom.
        - id: ch05-b07
          speaker: maiden
          text: I have already found him.
        - id: ch05-b08
          speaker: narrator
          text: The maiden spun the second lock into shining cloth and fastened it to the bottom of the coat. When it was ready, she carried it back to the giant.
        - id: ch05-b09
          speaker: narrator
          text: She climbed the mountain once more and brought the finished coat to the giant. This time it fitted him. The giant was delighted with it and asked what he could give her in return.
        - id: ch05-b10
          speaker: maiden
          text: There is only one reward you can give me. Take the spell from the lion and let him return to his own shape.
        - id: ch05-b11
          speaker: narrator
          text: For a long time, the giant would not hear of freeing the lion. In the end, he gave way. Then he told the maiden exactly how the enchantment had to be broken.
        - id: ch05-b12
          speaker: giant
          text: You must kill the lion yourself and cut him into very small pieces. Burn them, then scatter the ashes into the water. The prince will rise from the water, free from the spell forever.
        - id: ch05-b13
          speaker: narrator
          text: The maiden left in tears. She feared the giant had tricked her. If she killed the lion, perhaps she would kill the prince as well.
        - id: ch05-b14
          speaker: narrator
          text: She wept all the way down the mountain. At the bottom, she found the prince waiting for her. When he had heard the whole story, he comforted her.
        - id: ch05-b15
          speaker: prince
          text: Take courage. Trust what the giant told you, and do exactly as he said.
          emotion: calm
    - id: ch06
      title: The Prince Set Free
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The maiden trusted the prince. In the morning, when he had taken the lion's shape again, she gathered her courage. She raised a knife and killed him. Then she cut him into very small pieces, burned them, and cast all the ashes into the water.
        - id: ch06-b02
          speaker: narrator
          text: Out of the water came the prince, free of the enchantment. He was beautiful as the day and as joyful to look upon as the sun itself.
        - id: ch06-b03
          speaker: prince
          text: You have done everything to save me. I will marry you, and no one else.
          emotion: happy
        - id: ch06-b04
          speaker: narrator
          text: But the maiden wept bitterly.
        - id: ch06-b05
          speaker: maiden
          text: I can never be your wife. When the princess gave me her hair, I promised that you would marry her, and only her.
          emotion: sad
        - id: ch06-b06
          speaker: prince
          text: If it must be the princess, then we must hurry. Come with me.
        - id: ch06-b07
          speaker: narrator
          text: Together they went to the royal palace. The moment the king, queen, and princess saw the young man, great joy filled their hearts. They knew him at once. He was the king's eldest son, long ago enchanted by a giant and lost to them.
        - id: ch06-b08
          speaker: narrator
          text: The prince asked his parents to consent to his marriage with the girl who had saved him. They gladly gave their consent, and a great wedding feast was prepared for them.
        - id: ch06-b09
          speaker: narrator
          text: So the poor maiden became a princess, and in time she became a queen. She richly deserved every honor that came to her.
