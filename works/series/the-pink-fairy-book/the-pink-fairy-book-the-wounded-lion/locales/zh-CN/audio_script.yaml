audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: "讲述者"
      tts:
        delivery: "亲切从容，带一点温和的幽默"
        timbre: "温暖清晰"
        pace: "舒缓而有变化"
        pitch: "中音"
    maiden:
      display_name: "姑娘"
      tts:
        delivery: "善良勇敢，语气朴实而坚定"
        timbre: "清澈柔韧的年轻女声"
        pace: "适中"
        pitch: "中高音"
    farmer:
      display_name: "农夫"
      tts:
        delivery: "严厉急躁，说话生硬直截"
        timbre: "粗重的成年男声"
        pace: "偏快"
        pitch: "中低音"
    prince:
      display_name: "王子"
      tts:
        delivery: "温和真诚，安慰人时沉着笃定"
        timbre: "温暖清朗的年轻男声"
        pace: "从容"
        pitch: "中音"
    waiting_maid:
      display_name: "公主的贴身女仆"
      tts:
        delivery: "精明干练，问话直接利落"
        timbre: "清脆成熟的女声"
        pace: "适中"
        pitch: "中音"
    princess:
      display_name: "公主"
      tts:
        delivery: "高傲端庄，失去耐性时尖锐果断"
        timbre: "明亮细致的年轻女声"
        pace: "适中"
        pitch: "中高音"
    giant:
      display_name: "巨人"
      tts:
        delivery: "严肃坦率，告诫时郑重有力"
        timbre: "洪亮浑厚的男声"
        pace: "缓慢"
        pitch: "低音"
  chapters:
    - id: ch01
      title: "草地上的狮子"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有个穷得一无所有的姑娘。她四处流浪，靠人施舍过日子。一天，她来到一间茅草屋，问屋里的人能不能给她一份活儿。农夫正好缺一个牧牛人，因为原来替他放牛的人已经离开了。"
        - id: ch01-b02
          speaker: farmer
          text: "我原来的牧牛人走了。你要是愿意留下，就替我看牛吧。"
        - id: ch01-b03
          speaker: narrator
          text: "姑娘觉得这份差事合适，便答应下来，做了牧牛人。一天早晨，她正赶着牛群穿过草地，近旁忽然响起沉重的呻吟，听着几乎像人的声音。她急忙循着声音跑过去，看见一头狮子伸直身子躺在地上。"
        - id: ch01-b04
          speaker: narrator
          text: "姑娘吓坏了。可狮子痛苦不堪，她又觉得它十分可怜。她慢慢靠近，发现狮子的一只脚上扎着一根大刺，便替它拔出刺，包好伤口。狮子感激地伸出粗糙的大舌头，舔了舔她的手。"
        - id: ch01-b05
          speaker: narrator
          text: "等姑娘照料完狮子，回去找牛时，牛群已经不见了。她在草地四处寻找，找了很久，始终没能找到，只得回家把实情告诉主人。农夫听后狠狠责骂她一顿，随后又打了她。"
        - id: ch01-b06
          speaker: farmer
          text: "从现在起，你不用看牛了，给我看驴去。"
    - id: ch02
      title: "狮子再度受伤"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "从此，姑娘每天把驴赶进树林吃草。她第一次遇见狮子的那天过去了整整一年。一天早晨，她又听见那种简直与人声一样的呻吟，便径直循声找去。眼前竟还是那头狮子。它倒在地上，脸上裂开一道深深的伤口。"
        - id: ch02-b02
          speaker: narrator
          text: "这一回，姑娘一点也不怕。她跑上前，洗净伤口，敷好止痛的草药，再仔细包扎起来。狮子又舔了舔她的手，向她道谢。"
        - id: ch02-b03
          speaker: narrator
          text: "可她回去一看，驴群也消失得干干净净。姑娘这边找，那边找，依旧一无所获，只好再去向主人认错。农夫照旧先骂她，再打她。"
        - id: ch02-b04
          speaker: farmer
          text: "去吧！这一次，你给我看猪！"
        - id: ch02-b05
          speaker: narrator
          text: "第二天，姑娘赶着猪群出门，找到一片草木丰茂的地方。猪儿在那里一天比一天肥壮。又过了一年，她在放猪时再次听见了呻吟。她跑过去，发现老朋友狮子浑身都是伤，倒在树下，已经奄奄一息。"
        - id: ch02-b06
          speaker: narrator
          text: "姑娘跪到它面前，把每一道伤口洗净，再敷上疗伤的草药。狮子舔着她的双手向她道谢，还请她留下来，陪自己坐一会儿。"
        - id: ch02-b07
          speaker: maiden
          text: "我还得守着那些猪，不能留下。我得赶快回去看看它们。"
        - id: ch02-b08
          speaker: narrator
          text: "姑娘跑回原处，猪群却像被大地吞掉了一样，一头也不剩。她一边吹着口哨，一边大声呼唤，回答她的却只有林中的鸟儿。她瘫坐在地上痛哭，几个钟头都不敢回家。等眼泪终于流尽，她才站起身，把树林上上下下找了个遍。可怎么找都没有用，连一头猪的踪迹也看不见。"
    - id: ch03
      title: "岩石后的秘密"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "最后，姑娘爬上一棵树，想从高处看得远些。她刚在最高的树枝上坐稳，便看见一个英俊的年轻人沿小路走来。年轻人走到附近，推开一块岩石，转眼就消失在后面。猪群顿时被姑娘忘到了脑后。"
        - id: ch03-b02
          speaker: narrator
          text: "姑娘揉了揉眼睛，怀疑自己是不是做了梦。她决定守在树上，等年轻人出来，好弄清他是谁。可第二天黎明，岩石移开以后，走出来的竟是一头狮子。"
        - id: ch03-b03
          speaker: narrator
          text: "狮子走得无影无踪以后，姑娘才下树来到岩石前。她把岩石推向一旁，走进露出的洞口。洞里有一条小路，通向一座美丽的房屋。她进去扫地，又把家具擦亮，将每样东西收拾整齐。接着，她吃了角落搁板上放着的丰盛饭菜，随后再次爬回树梢。"
        - id: ch03-b04
          speaker: narrator
          text: "太阳落山时，年轻人兴高采烈地沿小路回来。他像头一天那样推开岩石，又消失在岩石后。第二天一早，狮子走出洞口，警觉地向四面张望，没有发现任何人，便钻进树林。姑娘下树后，又把前一天做过的事原样做了一遍。她连续收拾了三天，还是没弄懂这个秘密。"
        - id: ch03-b05
          speaker: narrator
          text: "第三天傍晚，姑娘见年轻人穿过树林，便从树上下来，请他告诉自己叫什么名字。年轻人见到她，十分欢喜。他已经猜到，这几天暗中照料房屋的就是眼前的姑娘。"
        - id: ch03-b06
          speaker: prince
          text: "我本是一位王子，却中了一个强大巨人的魔法。只有到了夜里，我才能变回自己。白天，我就是那头被你救过几次的狮子。你的牛、驴和猪，也是巨人偷走的。他这样做，只是为了报复你帮助我。"
        - id: ch03-b07
          speaker: maiden
          text: "那我要怎样做，才能替你解除魔法？"
        - id: ch03-b08
          speaker: prince
          text: "这很难。你得从国王的女儿头上取下一绺头发，把头发纺成线，为住在高山顶上的巨人织一件外衣。只有这样才行。"
        - id: ch03-b09
          speaker: maiden
          text: "那我就进城去。我会敲开王宫的大门，请公主收我做仆人。"
    - id: ch04
      title: "公主的长发"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "两人分别以后，姑娘来到城里，沿街寻找差事。"
        - id: ch04-b02
          speaker: maiden
          text: "谁愿意雇我做仆人？谁家需要仆人？"
        - id: ch04-b03
          speaker: narrator
          text: "姑娘衣着干净，模样整洁又讨人喜欢，许多人都想雇她。可无论谁来询问，她都不肯答应，只顾沿街继续呼喊。终于，公主的贴身女仆走了过来，停在她面前问话。"
        - id: ch04-b04
          speaker: waiting_maid
          text: "你都会做些什么？"
        - id: ch04-b05
          speaker: narrator
          text: "姑娘只得承认，自己几乎什么也不会。"
        - id: ch04-b06
          speaker: waiting_maid
          text: "那你就到厨房打下手，负责洗碗碟吧。"
        - id: ch04-b07
          speaker: narrator
          text: "女仆把她带回王宫。姑娘重新梳过头发，把自己收拾得整洁漂亮，人人看见都称赞。话传到公主耳中，公主便召她前来，让她也替自己梳头。"
        - id: ch04-b08
          speaker: narrator
          text: "公主的头发又浓又长，像太阳一样发亮。姑娘耐心地梳了一遍又一遍，直把它梳得比从前更加耀眼。公主十分满意，命她以后天天来梳。姑娘就这样一连来了许多天，终于鼓起勇气，求公主准她剪下一绺又长又浓的头发。"
        - id: ch04-b09
          speaker: princess
          text: "不行。我一根头发也不愿意给你。"
        - id: ch04-b10
          speaker: narrator
          text: "公主一向为自己的长发骄傲，舍不得送出其中任何一绺。姑娘却不肯死心，每天都求她答应。公主终于被缠得失去耐性。"
        - id: ch04-b11
          speaker: princess
          text: "好，你拿去吧！但你必须找到世上最英俊的王子，让他来做我的新郎！"
          emotion: angry
        - id: ch04-b12
          speaker: maiden
          text: "我答应你。"
        - id: ch04-b13
          speaker: narrator
          text: "姑娘剪下那绺头发，把它织成一件闪着丝绸光泽的外衣，再拿去交给王子。王子让她把衣服直接送上山，还郑重叮嘱她，要在离巨人很远时就喊明来意。否则，巨人会扑上来，用剑把她刺穿。"
    - id: ch05
      title: "巨人的外衣"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "姑娘攀上高山。还没到顶，巨人已经听见她的脚步，口喷烈火冲了出来。他一只手握剑，另一只手提着大棒。"
        - id: ch05-b02
          speaker: maiden
          text: "我是来送外衣的！我把你的外衣带来了！"
        - id: ch05-b03
          speaker: narrator
          text: "巨人这才安静下来，把姑娘请进屋。他试了试外衣，发现太短，立刻脱下来扔到一旁。"
        - id: ch05-b04
          speaker: giant
          text: "太短了。这件衣服对我毫无用处。"
        - id: ch05-b05
          speaker: narrator
          text: "姑娘难过地捡起外衣，心灰意冷地回到王宫。第二天替公主梳头时，她又请求剪下一绺。公主起先不肯，架不住姑娘苦苦哀求，最后还是答应了，条件仍是为她找一位王子做新郎。"
        - id: ch05-b06
          speaker: maiden
          text: "王子我已经找到了。"
        - id: ch05-b07
          speaker: narrator
          text: "姑娘把第二绺头发纺成闪亮的线，接在原来那件外衣的下摆上。衣服完工后，她又带着它登上高山，送到巨人手里。这一回，外衣恰好合身。巨人十分满意，便问她想要什么作为报酬。"
        - id: ch05-b08
          speaker: maiden
          text: "我只要一种报酬。请你解除狮子身上的魔法，让它恢复原来的模样。"
        - id: ch05-b09
          speaker: narrator
          text: "巨人很久都不肯答应，最后才让步，并把解除魔法的办法原原本本说了出来。"
        - id: ch05-b10
          speaker: giant
          text: "你必须亲手杀死狮子，把它切得粉碎，再放火烧掉。把灰烬撒进水里，王子就会从水中出来，从此永远摆脱魔法。"
        - id: ch05-b11
          speaker: narrator
          text: "姑娘哭着离开。她怕巨人骗了自己，更怕杀死狮子以后，才知道王子也死在自己手里。她一路哭下山，在山脚找到等候她的王子，把巨人的话全都告诉了他。王子听完，温声安慰她。"
        - id: ch05-b12
          speaker: prince
          text: "勇敢一点。照巨人说的去做吧，相信他告诉你的办法。"
          emotion: calm
    - id: ch06
      title: "王子重获自由"
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "姑娘相信了王子亲口告诉她的话。第二天早晨，王子再次化成狮子，她便拿起刀，亲手将它杀死。随后，她把狮子切得粉碎，放火烧成灰烬，再将所有灰烬撒进水中。"
        - id: ch06-b02
          speaker: narrator
          text: "王子果然从水里走了出来，魔法已经彻底消失。他像白昼一样俊美，也像太阳一样令人见之心喜。"
        - id: ch06-b03
          speaker: prince
          text: "你为救我付出了这么多。我要娶你为妻，除了你，我谁也不娶。"
          emotion: happy
        - id: ch06-b04
          speaker: narrator
          text: "姑娘听了，却伤心地哭了起来。"
        - id: ch06-b05
          speaker: maiden
          text: "不，我不能嫁给你。公主给我头发时，我答应过她，要让你娶她，而且只能娶她。"
          emotion: sad
        - id: ch06-b06
          speaker: prince
          text: "既然你说的是公主，那我们得赶快走。跟我来吧。"
        - id: ch06-b07
          speaker: narrator
          text: "两人一同赶到王宫。国王、王后和公主一看见年轻人，心里顿时充满喜悦。他们立刻认出来了，这正是国王的长子。许多年前，他被巨人施了魔法，从此失去踪影。"
        - id: ch06-b08
          speaker: narrator
          text: "王子请求父母同意，让自己迎娶救了他的姑娘。他们答应了，王宫随即摆下盛大的宴席。贫穷的姑娘成了王妃，后来又成了王后。她得到的一切尊荣，的确都受之无愧。"
