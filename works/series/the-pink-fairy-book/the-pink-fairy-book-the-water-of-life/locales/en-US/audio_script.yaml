  chapters:
    - id: ch01
      title: The Palace and Its Missing Wonders
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Three brothers and their sister lived together in a little cottage. They loved one another dearly. The eldest brother had always spent his days amusing himself, from sunrise until sunset. Then one day, he had an idea.
        - id: ch01-b02
          speaker: eldest_brother
          text: What if we all worked hard? We might grow rich enough to build ourselves a palace.
        - id: ch01-b03
          speakers: [second_brother, youngest_brother, sister]
          ensemble: chorus
          text: Yes! We will all work!
        - id: ch01-b04
          speaker: narrator
          text: So all four worked with all their strength. In time they became rich, and they built a beautiful palace. People came from miles around to stare at its wonders and praise its splendor. No one found a single fault with it, until an old woman walked through the rooms among a crowd of visitors.
        - id: ch01-b05
          speaker: old_woman
          text: Yes, this palace is splendid. But it is still missing something.
        - id: ch01-b06
          speakers: [eldest_brother, second_brother, youngest_brother]
          ensemble: chorus
          text: What could it possibly need?
        - id: ch01-b07
          speaker: old_woman
          text: A church.
        - id: ch01-b08
          speaker: narrator
          text: The brothers went back to work. They earned more money, and when they had enough, they built a church as large and beautiful as the palace itself.
        - id: ch01-b09
          speaker: narrator
          text: Once it was finished, even greater crowds arrived. They came to see the palace, the church, the vast gardens, and the magnificent halls. As usual, the brothers welcomed their guests and showed them around. One day, an old man spoke to them.
        - id: ch01-b10
          speaker: old_man
          text: Everything here is very beautiful. Yet something is still missing.
        - id: ch01-b11
          speakers: [eldest_brother, second_brother, youngest_brother]
          ensemble: chorus
          text: And what is that?
        - id: ch01-b12
          speaker: old_man
          text: You need a pitcher of the water of life, a branch from the tree whose flowers give eternal beauty with their scent, and the talking bird.
        - id: ch01-b13
          speaker: eldest_brother
          text: Where can I find all three?
        - id: ch01-b14
          speaker: old_man
          text: Travel to that distant mountain. There you will find what you are seeking.
        - id: ch01-b15
          speaker: narrator
          text: The old man bowed politely and said farewell. As soon as he had gone, the eldest brother turned to the others.
        - id: ch01-b16
          speaker: eldest_brother
          text: I will go and find the water of life, the talking bird, and the tree of beauty.
        - id: ch01-b17
          speaker: sister
          text: But what if something terrible happens to you? How will we ever know?
        - id: ch01-b18
          speaker: eldest_brother
          text: You are right. I never thought of that.
        - id: ch01-b19
          speaker: narrator
          text: They hurried after the old man and caught up with him.
        - id: ch01-b20
          speaker: second_brother
          text: Our eldest brother means to search for the three wonders you told us about. How can we know if anything evil happens to him?
        - id: ch01-b21
          speaker: narrator
          text: The old man took out a knife and placed it in their hands.
        - id: ch01-b22
          speaker: old_man
          text: Guard this knife carefully. While its blade stays bright, all is well. If the blade turns bloody, you will know that evil has befallen him.
        - id: ch01-b23
          speaker: narrator
          text: They thanked him and returned to the palace. There they found the eldest brother preparing to leave for the distant mountain where the three treasures lay hidden.
    - id: ch02
      title: Three Brothers on the Mountain
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The eldest brother walked and walked and walked. After traveling a great distance, he met a giant.
        - id: ch02-b02
          speaker: eldest_brother
          text: Can you tell me how much farther I must go before I reach that mountain?
        - id: ch02-b03
          speaker: giant
          text: Why do you want to go there?
        - id: ch02-b04
          speaker: eldest_brother
          text: I am looking for the water of life, the talking bird, and a branch from the tree of beauty.
        - id: ch02-b05
          speaker: giant
          text: Many people have passed this way in search of those treasures, but not one has returned. You will not return either unless you remember every word I tell you.
        - id: ch02-b06
          speaker: giant
          text: Follow this path to the mountain. You will see that its slopes are covered with stones. Do not pause to look at them. Keep going. You will hear laughter and cruel taunts behind you, for the stones themselves will mock you. Pay no attention, and above all, never turn around. If you do, you will become a stone too. Walk straight to the summit, and there you may take whatever you wish.
        - id: ch02-b07
          speaker: narrator
          text: The young man thanked the giant for his warning. Then he walked and walked and walked until he reached the mountain.
        - id: ch02-b08
          speaker: narrator
          text: As he climbed, jeers and laughter rang out behind him. He shut his ears to the noise and pressed on. But the mocking grew louder and louder. At last, his patience broke. He bent down to seize a stone and throw it into the middle of the uproar. Suddenly his arm went stiff. A moment later, he too was stone.
        - id: ch02-b09
          speaker: narrator
          text: Back at the palace, his sister began to wonder why he had been gone so long. She brought out the knife. Its blade was as red as blood.
        - id: ch02-b10
          speaker: sister
          text: Something terrible has happened to him!
          emotion: fearful
        - id: ch02-b11
          speaker: second_brother
          text: I will go and find him.
        - id: ch02-b12
          speaker: narrator
          text: The second brother set off. He walked and walked and walked until he met the giant.
        - id: ch02-b13
          speaker: second_brother
          text: Have you seen a young man traveling toward that mountain?
        - id: ch02-b14
          speaker: giant
          text: Yes. I saw him pass this way, but I never saw him return. The spell must have taken hold of him.
        - id: ch02-b15
          speaker: second_brother
          text: Then how can I free him and find the water of life, the talking bird, and a branch from the tree of beauty?
        - id: ch02-b16
          speaker: giant
          text: Take this path to the mountain. It is covered in stones, but do not stop to look at them. Climb steadily. You will hear laughter and taunts rising on every side. Ignore them, and never turn around. Once you reach the summit, you may take all you desire.
        - id: ch02-b17
          speaker: narrator
          text: The second brother thanked the giant and continued toward the mountain. The instant he reached it, loud jokes and insults burst out all around him. The din was almost deafening.
        - id: ch02-b18
          speaker: narrator
          text: For a while, he let the stones rail at him and climbed boldly on. He passed the place his elder brother had reached. Then he thought he heard his brother's voice among all the mocking cries. He stopped and looked behind him. At once, one more stone joined the rest.
        - id: ch02-b19
          speaker: narrator
          text: At home, the sister counted the days until her brothers should return. Time dragged by. Again and again she took out the knife and examined its polished blade, wanting to be sure that the second brother was still safe. Each time it shone bright and clear, and she knew that all was well.
        - id: ch02-b20
          speaker: narrator
          text: Then one evening, she was tired and anxious as she opened the drawer. The blade had turned red with blood. She gave a cry of horror, and the youngest brother ran to her. She could not speak. She could only hold out the knife.
        - id: ch02-b21
          speaker: youngest_brother
          text: I will go.
        - id: ch02-b22
          speaker: narrator
          text: So the youngest brother walked and walked and walked until he came to the giant.
        - id: ch02-b23
          speaker: youngest_brother
          text: Have two young men passed this way on their journey to that mountain?
        - id: ch02-b24
          speaker: giant
          text: Yes, they both passed me, but neither one returned. That tells me the spell has fallen upon them.
        - id: ch02-b25
          speaker: youngest_brother
          text: What must I do to set them free and bring back the water of life, the talking bird, and the branch from the tree of beauty?
        - id: ch02-b26
          speaker: giant
          text: Go to the mountain. Stones cover it so thickly that you will barely find room for your feet. Walk straight ahead. Turn neither right nor left, and ignore every laugh and taunt that follows you. When you reach the top, you may take everything you seek.
        - id: ch02-b27
          speaker: narrator
          text: The youngest brother thanked him and went on. The moment he began to climb, a storm of jeers broke out around him. He remembered the giant's warning. He looked neither right nor left, and soon the summit stood directly before him.
        - id: ch02-b28
          speaker: narrator
          text: He was only a moment away from reaching it when he heard his brothers' voices through the groans and yells. He turned toward them. And then there was one more stone on the mountain.
    - id: ch03
      title: The Sister's Climb
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: All this while, the sister paced back and forth through the palace. She hardly let the knife leave her hand. She dreaded what she knew she might see. Then, before her eyes, the blade grew red.
        - id: ch03-b02
          speaker: sister
          text: Now it is my turn.
        - id: ch03-b03
          speaker: narrator
          text: She walked and walked and walked until she reached the giant. She begged him to tell her whether he had seen three young men pass that way in search of the distant mountain.
        - id: ch03-b04
          speaker: giant
          text: I saw all three go by, but none of them came back. That is how I know the spell has taken them.
        - id: ch03-b05
          speaker: sister
          text: What must I do to free them and find the water of life, the talking bird, and a branch from the tree of beauty?
        - id: ch03-b06
          speaker: giant
          text: You must go to that mountain. It is so crowded with stones that your feet will scarcely find a place to step. As you climb, you will hear a noise as if every stone in the world were mocking you. Pay no attention to anything you hear. Once you reach the top, you have gained everything.
        - id: ch03-b07
          speaker: narrator
          text: The girl thanked the giant and went toward the mountain. She had taken only a few steps upward when cries and screams broke out around her. Every stone beneath her feet seemed to be alive.
        - id: ch03-b08
          speaker: narrator
          text: But she remembered the giant's words. She did not know what had happened to her brothers, so she kept her face fixed on the summit. With every step, it drew nearer.
        - id: ch03-b09
          speaker: narrator
          text: The higher she climbed, the louder the uproar became, until it seemed seven times greater than before. Above every other sound, she heard the voices of her three brothers. Still, she paid no attention. At last, her feet stood on the mountaintop.
        - id: ch03-b10
          speaker: narrator
          text: She looked around. In a hollow lay the pool of the water of life. She had brought a brazen pitcher with her, and she filled it right to the brim.
        - id: ch03-b11
          speaker: narrator
          text: Beside the pool grew the tree of beauty. The talking bird sat on one of its boughs. She caught the bird and put it in a cage. Then she broke a branch from the tree.
    - id: ch04
      title: The Spell Is Broken
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Carrying all three treasures, the sister turned and started joyfully down the mountain. The long climb had left her weary, and the brazen pitcher was very heavy. As she walked, a few drops spilled onto the stones.
        - id: ch04-b02
          speaker: narrator
          text: The moment the water touched them, those stones changed into young men and maidens. They crowded around the sister and thanked her for setting them free.
        - id: ch04-b03
          speaker: narrator
          text: Now she understood how to break the wicked spell. She carefully sprinkled water over every stone on the mountain. At last, not one stone remained. In their place stood a great company of young men and women, and they followed her down the slope.
        - id: ch04-b04
          speaker: narrator
          text: When the sister reached the palace, she did not waste a moment. She planted the branch of the tree of beauty and watered it with the water of life.
        - id: ch04-b05
          speaker: narrator
          text: At once, the branch sprang up into a tree. Its boughs grew heavy with flowers, and the talking bird settled among them.
    - id: ch05
      title: The Prince and the Brave Maiden
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: News of these wonders spread far and wide. Great crowds came to see the water of life, the tree of beauty, and the talking bird. They also came to see the maiden who had won all three.
        - id: ch05-b02
          speaker: narrator
          text: Among the visitors was the king's son. The prince would not leave until the sister had shown him everything and told him the whole story.
        - id: ch05-b03
          speaker: narrator
          text: He admired the strange and beautiful treasures in the palace. More than any treasure, though, he admired the maiden's beauty and courage.
        - id: ch05-b04
          speaker: narrator
          text: The prince went home and told his parents about her. He asked for their consent to take her as his wife, and they gave it.
        - id: ch05-b05
          speaker: narrator
          text: Their wedding was celebrated in the church beside the palace.
        - id: ch05-b06
          speaker: narrator
          text: Then the bridegroom brought her to his own home, and there they lived happily ever after.
