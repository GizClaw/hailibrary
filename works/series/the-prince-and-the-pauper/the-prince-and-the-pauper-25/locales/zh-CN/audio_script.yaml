audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华亲王
      tts:
        delivery: 高贵坚定，受辱时仍保持尊严
        timbre: 清亮稚嫩
        pace: 从容有力
        pitch: 中高
    miles_hendon:
      display_name: 迈尔斯·亨顿
      tts:
        delivery: 豪爽诙谐，危急时勇敢坚定
        timbre: 洪亮粗粝
        pace: 明快有力
        pitch: 中低
    hugh_hendon:
      display_name: 休·亨顿
      tts:
        delivery: 表面温和有礼，内里冷酷狡猾
        timbre: 平滑低沉
        pace: 从容克制
        pitch: 中低
    lady_edith:
      display_name: 伊迪丝小姐
      tts:
        delivery: 克制忧郁，言语间压着恐惧
        timbre: 柔和清澈
        pace: 缓慢迟疑
        pitch: 中等
    old_servant:
      display_name: 老仆人
      tts:
        delivery: 谨慎畏缩，对主人恭敬顺从
        timbre: 苍老朴实
        pace: 稍慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 归家的路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 亨顿和国王走出警役的视线后，亨顿让陛下先到城外约好的地方等候，自己回客店结账。半个钟头以后，两位朋友骑上那几匹瘦马，快活地向东走去。国王脱掉了破衣服，换上亨顿在伦敦桥买来的旧衣裳，身上终于又暖和又舒服了。
        - id: ch01-b02
          speaker: narrator
          text: 亨顿怕孩子累坏。他觉得赶路太苦、吃饭没准时、又睡不够，只会让那颗疯乱的小脑袋病得更重。好好休息，按时吃睡，再适量走动，才会让他快些康复。亨顿多么盼望那受损的神智恢复正常，让种种病态幻象从这颗饱受折磨的小脑袋里消失。因此，他压住归心，没有顺着急切的心意日夜兼程，只带着国王一站一站往那个阔别多年的家走。
        - id: ch01-b03
          speaker: narrator
          text: 走了大约十英里，他们来到一座颇大的村镇，在一家好客店里住下。两人又照从前的规矩相处。国王吃饭，亨顿站在椅子后面侍候。国王要睡了，他替陛下宽衣，自己则裹着毯子横卧在门口，把地板当床。
        - id: ch01-b04
          speaker: narrator
          text: 第二天和第三天，他们一路慢慢骑马，互相讲起分别后的遭遇，谁都听得兴致勃勃。亨顿详细说了自己为了寻找国王，怎样四处奔波。那个自称“大天使”的老人领着他在森林里白白绕了一大圈。老人发现怎么也甩不掉他，最后只好又把他带回小屋。
        - id: ch01-b05
          speaker: narrator
          text: 老人进了卧房，出来时脚步踉跄，伤心得不得了。他原以为孩子已经回来，正躺在里面休息，可屋里根本没人。亨顿又在那里等了一整天，直到彻底失去希望，才重新出发寻找。
        - id: ch01-b06
          speaker: miles_hendon
          text: 那个老“至圣所”发现殿下没有回来，倒真是伤心。我亲眼看见他的脸色了。
        - id: ch01-b07
          speaker: prince_edward
          text: 这一点，我永远不会怀疑！
        - id: ch01-b08
          speaker: narrator
          text: 国王接着说了自己的经历。亨顿听完，后悔当时没有杀掉那个“大天使”。
        - id: ch01-b09
          speaker: narrator
          text: 到了旅程的最后一天，亨顿兴奋极了，嘴里一刻不停。他说起年迈的父亲和哥哥亚瑟，用一件件往事说明他们的品格多么高尚、胸怀多么宽厚。提起心爱的伊迪丝，他更是欢喜得忘乎所以。他心情实在太好，就连休也得到了几句温和而有兄长情意的好话。
        - id: ch01-b10
          speaker: narrator
          text: 他不停想象回到亨顿庄园的情形。大家见到他会多么吃惊，又会怎样感谢上天，欢呼着迎接他。
        - id: ch01-b11
          speaker: narrator
          text: 这里景色秀丽，农舍和果园散落各处。道路穿过一片片辽阔的牧场，远方的草地微微起伏，看上去就像海浪一起一落。下午，亨顿总是绕开道路，登上小丘向远处张望，只想早一点看见自己的家。终于，他望见了。
        - id: ch01-b12
          speaker: miles_hendon
          text: 殿下，村子就在那边，庄园也在旁边！您看，从这里已经能望见塔楼。那片树林，就是我父亲的园林。现在，您可要知道什么叫气派和豪华了！宅子有七十个房间，还有二十七名仆人。我们住在那里，够体面吧？快走，我再也等不下去了！
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: 他们使出一切办法赶路，能走多快便走多快。可赶到村里时，还是过了下午三点。两人飞奔穿过村庄，亨顿的嘴一路没有停过。
        - id: ch01-b14
          speaker: miles_hendon
          text: 这就是教堂，墙上还是从前那些常春藤，一株没少，也一株没多。那边是老红狮客店，再过去就是集市广场。这里是五月柱，那里是水泵。什么都没变，只有人变了。十年会把人变得认不出来。我看着有些人眼熟，可他们一个也认不出我。
        - id: ch01-b15
          speaker: narrator
          text: 很快，他们到了村尾，转进一条曲折的窄路。高高的树篱像墙一样从两边夹住道路。两人沿路疾行了半英里，穿过一座气派庄严的大门，进入广阔的花园。门口竖着巨大的石柱，上面雕着家族纹章。一幢宏伟的宅邸就立在前方。
        - id: ch01-b16
          speaker: miles_hendon
          text: 我的国王，欢迎来到亨顿庄园！今天真是个大喜日子。父亲、哥哥和伊迪丝小姐见了我，一定高兴得发狂。刚重逢时，他们眼里只看得见我，嘴里也只顾着跟我说话，恐怕会显得冷落了您。您可别放在心上，很快就不会这样了。我会告诉他们，您是我的受监护人，也会说我为了爱护您付出了多大代价。到那时，他们会因为我是迈尔斯·亨顿，把您紧紧搂进怀里。从今以后，他们的家就是您的家，他们的心也会永远向您敞开。
          emotion: happy
    - id: ch02
      title: 陌生的兄弟
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 亨顿在大门前跳下马，扶国王落地，拉着他的手冲进屋里。走过几步，他们来到一间宽敞的厅堂。亨顿匆忙让国王坐下，礼数也顾不得了，转身就奔向一个年轻人。那人正坐在写字桌前，面前是一座宽大的壁炉，炉里烧着旺旺的木柴。
        - id: ch02-b02
          speaker: miles_hendon
          text: 休，快抱抱我！快说你有多高兴见我回来！再把父亲叫来。我要握到他的手，看到他的脸，重新听见他的声音。要不然，这个家还算不得家！
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: 休先是吃了一惊，却马上往后退去，严厉地盯着闯进来的人，仿佛自己的尊严受到了冒犯。随后，他像是心里忽然生出什么念头，或者已经打定了主意。那目光变成惊奇的好奇，还混着一丝说不清是真是假的怜悯。他温和地开了口。
        - id: ch02-b04
          speaker: hugh_hendon
          text: 可怜的陌生人，你的神智大概出了问题。你一定吃过许多苦，也受过世人的粗暴欺负。看看你的模样和衣服，就都明白了。你以为我是什么人？
        - id: ch02-b05
          speaker: miles_hendon
          text: 我还能把你当成谁？你就是休·亨顿！
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: 对方的声音依旧温和。
        - id: ch02-b07
          speaker: hugh_hendon
          text: 那你又以为自己是谁？
        - id: ch02-b08
          speaker: miles_hendon
          text: 什么叫“以为”？难道你要假装不认识我？我是你的弟弟迈尔斯·亨顿！
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: 休脸上掠过惊喜的神色，突然喊了起来。
        - id: ch02-b10
          speaker: hugh_hendon
          text: 什么！你不是说笑？死人真的活过来了？要真是这样，感谢上帝！我们失踪多年的可怜孩子，受尽这些年的折磨，终于回到亲人怀里了。可是，这消息好得简直不像真的。求你可怜我，别拿这件事骗我！快到亮处来，让我仔细看看你！
          emotion: surprised
        - id: ch02-b11
          speaker: narrator
          text: 休抓住迈尔斯的胳膊，把他拖到窗边。他的眼睛像要把人吞下去，从头一直看到脚。他让迈尔斯转来转去，自己也绕着他快步走，从每个角度仔细察看。归家的迈尔斯却满脸放光，时而微笑，时而大笑，还不停地点头。
        - id: ch02-b12
          speaker: miles_hendon
          text: 接着看吧，哥哥，不用担心。无论看我的脸，还是看我的手脚，都经得住检验。好休，你尽管从头到脚看个够。我就是从前那个迈尔斯，是你失踪的弟弟，对不对？我早说今天是个大喜日子！把手给我，再让我亲亲你的脸。天哪，我真要欢喜死了！
          emotion: happy
        - id: ch02-b13
          speaker: narrator
          text: 迈尔斯正要扑过去拥抱哥哥，休却抬手阻止。他悲伤地垂下头，把下巴贴到胸前，动情地说道。
        - id: ch02-b14
          speaker: hugh_hendon
          text: 愿仁慈的上帝给我力量，让我承受这样沉重的失望！
          emotion: sad
        - id: ch02-b15
          speaker: narrator
          text: 迈尔斯惊得半晌说不出话。等他终于找回声音，立刻大喊起来。
        - id: ch02-b16
          speaker: miles_hendon
          text: 什么失望？难道我不是你弟弟？
          emotion: surprised
        - id: ch02-b17
          speaker: narrator
          text: 休悲伤地摇了摇头。
        - id: ch02-b18
          speaker: hugh_hendon
          text: 我也求上天让这是真的，希望别人能看出我看不到的相像之处。可惜啊，只怕那封信说的都是真话。
          emotion: sad
        - id: ch02-b19
          speaker: miles_hendon
          text: 什么信？
        - id: ch02-b20
          speaker: hugh_hendon
          text: 大约六七年前，海外来了一封信。信里说，我弟弟战死了。
        - id: ch02-b21
          speaker: miles_hendon
          text: 那封信在撒谎！叫父亲来，他会认出我！
          emotion: angry
        - id: ch02-b22
          speaker: hugh_hendon
          text: 死去的人，谁也叫不回来。
    - id: ch03
      title: 无人承认的人
      blocks:
        - id: ch03-b01
          speaker: miles_hendon
          text: 死了？父亲死了！这消息太沉重了。我刚刚找回的快乐，一半已经枯萎。让我见见哥哥亚瑟吧。他一定认得我，也会安慰我。
          emotion: sad
        - id: ch03-b02
          speaker: hugh_hendon
          text: 他也死了。
        - id: ch03-b03
          speaker: miles_hendon
          text: 愿上帝怜悯我这个受尽打击的人！两个人都走了。好人被带走，像我这样的无用之人却还活着。求你可怜我，别再说伊迪丝小姐也——
          emotion: sad
        - id: ch03-b04
          speaker: hugh_hendon
          text: 你怕她也死了？没有，她还活着。
        - id: ch03-b05
          speaker: miles_hendon
          text: 感谢上帝，我的快乐又完整了！哥哥，快让她来见我。就算她也说我不是迈尔斯……不，她不会的，她一定认得我。我若怀疑她，才真是傻瓜。把她带来，再把从前的老仆人们叫来。他们也会认出我。
          emotion: happy
        - id: ch03-b06
          speaker: hugh_hendon
          text: 只剩下五个人了。彼得、哈尔西、戴维、伯纳德，还有玛格丽特。
        - id: ch03-b07
          speaker: narrator
          text: 休说完便离开了房间。迈尔斯站着想了一会儿，又开始来回踱步，嘴里低声嘟囔。
        - id: ch03-b08
          speaker: miles_hendon
          text: 二十二个忠厚老实的人全不在了，活下来的偏偏是五个大恶棍。真奇怪。
        - id: ch03-b09
          speaker: narrator
          text: 他仍在屋里走来走去，早把国王忘得干干净净。过了一阵，陛下庄重地开口，声音里有真切的同情。不过那几句话听起来，也可能是在讥讽。
        - id: ch03-b10
          speaker: prince_edward
          text: 好心人，别再为这件不幸的事烦恼。世上还有别人也不被承认，提出的主张也遭人嘲笑。你并不孤单。
        - id: ch03-b11
          speaker: miles_hendon
          text: 我的国王，请您别认定我是骗子。再等等，您马上会明白。我没有冒名顶替，伊迪丝会亲口证明。您会从英格兰最甜美的嘴唇里听见真相。我怎么会是骗子？这座老宅、墙上祖先的画像，还有身边每一件东西，我都熟悉得像孩子熟悉自己的育儿室。我就在这里出生，在这里长大，陛下。我说的全是真话，绝不会欺骗您。哪怕别人全都不相信，也求您千万别怀疑我。我承受不了这个。
        - id: ch03-b12
          speaker: prince_edward
          text: 我不怀疑你。
        - id: ch03-b13
          speaker: narrator
          text: 国王的语气带着孩子般的纯真和信任。亨顿听得深受感动。
        - id: ch03-b14
          speaker: miles_hendon
          text: 我从心底感谢您！
        - id: ch03-b15
          speaker: narrator
          text: 国王仍是那样温柔而纯真，又问了一句。
        - id: ch03-b16
          speaker: prince_edward
          text: 那么，你怀疑我吗？
        - id: ch03-b17
          speaker: narrator
          text: 亨顿顿时满心愧疚，不知该怎么回答。恰好房门在这时打开，休走了进来。亨顿不用回答了，心里不由得松了一口气。
    - id: ch04
      title: 伊迪丝的回答
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一位衣着华贵的美丽女子跟在休身后，后面还有几个穿号衣的仆人。女子走得很慢，始终低着头，目光落在地上。她脸上的哀伤，简直无法形容。迈尔斯·亨顿一看见她，猛地冲上前去，大声呼唤她。
        - id: ch04-b02
          speaker: miles_hendon
          text: 啊，伊迪丝，我的心肝！
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: 休神情严肃地挥手，让他退回去，随后转向女子。
        - id: ch04-b04
          speaker: hugh_hendon
          text: 看看这个人。你认识他吗？
        - id: ch04-b05
          speaker: narrator
          text: 伊迪丝一听见迈尔斯的声音，身子轻轻一颤，双颊泛起红晕，此刻更浑身发抖。她一动不动地站着，屋里是一段令人屏住呼吸的沉默。过了好一会儿，她才慢慢抬起头，用僵硬而恐惧的目光望进亨顿眼中。她脸上的血色一点一点退尽，最后只剩下死人般的灰白。
        - id: ch04-b06
          speaker: lady_edith
          text: 我不认识他！
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: 她的声音和脸色一样死寂。说完，她呻吟一声，强忍住呜咽，踉跄着离开了房间。迈尔斯跌坐在椅子上，双手捂住了脸。沉默片刻，休向仆人们发问。
        - id: ch04-b08
          speaker: hugh_hendon
          text: 你们已经看清楚他了。认识他吗？
        - id: ch04-b09
          speaker: narrator
          text: 仆人们都摇了摇头。庄园的主人这才对迈尔斯说道。
        - id: ch04-b10
          speaker: hugh_hendon
          text: 先生，这些仆人都不认识你。看来其中一定有什么差错。你也亲眼看到了，我的妻子同样不认识你。
        - id: ch04-b11
          speaker: miles_hendon
          text: 你的妻子！
          emotion: surprised
        - id: ch04-b12
          speaker: narrator
          text: 转眼之间，休已经被迈尔斯死死按在墙上，喉咙让一只铁钳般的大手掐住。
        - id: ch04-b13
          speaker: miles_hendon
          text: 你这个狐狸心肠的奴才，我全明白了！那封假信就是你写的。你靠它抢走了我的新娘，也抢走了我的家产。现在滚开！别逼我杀了你这个卑劣的小人，玷污一个正直军人的荣誉！
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: 休涨红了脸，几乎喘不过气。他踉跄着倒向最近的椅子，立刻命令仆人抓住这个要行凶的陌生人，把他捆起来。仆人们却迟疑着不敢上前。其中一个终于开了口。
        - id: ch04-b15
          speaker: old_servant
          text: 休爵士，他身上有武器，我们什么也没有。
          emotion: fearful
        - id: ch04-b16
          speaker: hugh_hendon
          text: 有武器又怎么样？你们这么多人！我叫你们上！
          emotion: angry
        - id: ch04-b17
          speaker: narrator
          text: 迈尔斯警告他们，动手前最好想清楚，接着向他们说道。
        - id: ch04-b18
          speaker: miles_hendon
          text: 你们从前都认识我。我一点也没变。谁想来，就来吧。
        - id: ch04-b19
          speaker: narrator
          text: 这句话没能让仆人们壮起胆子。他们还是缩在后面，不肯上前。
        - id: ch04-b20
          speaker: hugh_hendon
          text: 那就滚出去，你们这些没用的懦夫！拿上武器，守住每一道门。我会派人去叫巡警！
          emotion: angry
        - id: ch04-b21
          speaker: narrator
          text: 休走到门槛边，又回头警告迈尔斯。
        - id: ch04-b22
          speaker: hugh_hendon
          text: 别白费力气逃跑。这样做，对你自己更有好处。
        - id: ch04-b23
          speaker: miles_hendon
          text: 逃跑？如果你只担心这个，那就省省心吧。迈尔斯·亨顿才是亨顿庄园和这里全部财产的主人。他会留在这里。你不必怀疑。
