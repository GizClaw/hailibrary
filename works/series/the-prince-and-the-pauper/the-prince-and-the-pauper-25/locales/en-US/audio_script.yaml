  chapters:
    - id: ch01
      title: The Road East
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            As soon as Miles and the King were safely out of the constable's sight, Miles told Edward to hurry to a place beyond the town and wait. Miles went back to the inn to pay what they owed. Half an hour later, the two friends were riding cheerfully east on Miles's miserable horses.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Edward was warm and comfortable now. He had thrown away his rags and put on the secondhand suit Miles had bought on London Bridge.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Miles did not want the boy worn out again. In his mind, hard travel, meals at odd hours, and too little sleep could only make Edward's troubled thoughts worse. Rest, regular meals, and gentle exercise might help cure him and drive those painful visions from his head.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Miles had been banished from home for many years, and every part of him longed to race back without stopping. But he held down his impatience. For Edward's sake, they would travel in easy stages instead of pushing on day and night.
        - id: ch01-b05
          speaker: narrator
          text: >-
            After about ten miles, they came to a large village and spent the night at a good inn. Their old arrangement began again. Miles stood behind the King's chair and served him through dinner. When Edward was ready for bed, Miles helped him undress. Then he wrapped himself in a blanket, lay across the doorway, and slept on the floor.
    - id: ch02
      title: Tales Along the Way
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The next day and the day after that, they rode along at an easy pace. They talked about everything that had happened while they were apart, and each took great pleasure in hearing the other's adventures.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Miles told Edward how widely he had wandered in search of him. The old hermit, whom Miles called the archangel, had sent him chasing foolishly through the forest. At last, when the hermit could not get rid of him, he led Miles back to the hut.
        - id: ch02-b03
          speaker: narrator
          text: >-
            There, the old man went into the bedchamber. He came stumbling out again with a brokenhearted look. He said he had hoped to find the boy back inside, lying down to rest, but the room was empty. Miles waited at the hut all day. When his hope of Edward's return finally died, he set out searching once more.
        - id: ch02-b04
          speaker: miles_hendon
          text: >-
            And old Sanctum Sanctorum truly was sorry that your Highness had not come back. I could see it in his face.
        - id: ch02-b05
          speaker: edward_tudor
          text: >-
            Indeed, I shall never doubt that!
        - id: ch02-b06
          speaker: narrator
          text: >-
            Then Edward told his own story. By the time he finished, Miles regretted that he had not destroyed the archangel.
        - id: ch02-b07
          speaker: narrator
          text: >-
            On the last day of their journey, Miles's spirits rose higher and higher. He could hardly stop talking. He spoke of his old father and his brother Arthur, recalling one thing after another that showed how generous and noble they were.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Whenever he spoke of Edith, his affection poured out in a rush. He felt so joyful that he even found kind, brotherly things to say about Hugh. Again and again, he imagined their arrival at Hendon Hall. Everyone would be astonished. Then the whole house would burst into thanks and delight.
        - id: ch02-b09
          speaker: narrator
          text: >-
            The country around them was lovely. Cottages and orchards dotted the land. Wide pastures rose and fell in long, gentle slopes, like waves swelling and sinking on the sea.
        - id: ch02-b10
          speaker: narrator
          text: >-
            That afternoon, Miles kept turning away from the road to climb every little hill. Each time, he searched the distance for a first glimpse of home. At last he saw it.
        - id: ch02-b11
          speaker: miles_hendon
          text: >-
            There is the village, my Prince! And there, close beside it, is the Hall. You can see the towers from here. That wood is my father's park. Now you shall learn what grandeur truly is! The house has seventy rooms and twenty-seven servants. A fine lodging for us, would you not say? Come, let us hurry. I cannot endure another delay!
          emotion: happy
    - id: ch03
      title: Welcome to Hendon Hall
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            They hurried as fast as they could, but it was after three o'clock when they reached the village. They raced through its streets while Miles talked without pause.
        - id: ch03-b02
          speaker: miles_hendon
          text: >-
            Here is the church, with the very same ivy. Not a leaf seems gone or added. Over there is the old Red Lion inn, and beyond it is the marketplace.
        - id: ch03-b03
          speaker: miles_hendon
          text: >-
            Here is the Maypole, and here is the pump. Nothing has changed except the people. Ten years will change them. I seem to recognize some of these faces, yet no one recognizes me.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Soon they passed the end of the village and entered a crooked, narrow lane between tall hedges. They followed it briskly for half a mile. Then they rode through an imposing gateway into a vast flower garden. Huge stone pillars stood on either side, carved with coats of arms. Ahead of them rose a noble mansion.
        - id: ch03-b05
          speaker: miles_hendon
          text: >-
            Welcome to Hendon Hall, my King! What a great day this is! My father, my brother, and Lady Edith will be so wild with joy that at first they may have no eyes or words for anyone but me.
          emotion: happy
        - id: ch03-b06
          speaker: miles_hendon
          text: >-
            Do not mind if their welcome seems cold for a moment. Once I tell them you are under my care, and how dearly I love you, they will embrace you for Miles Hendon's sake. Their house and their hearts will be your home forever.
          emotion: happy
        - id: ch03-b07
          speaker: narrator
          text: >-
            The next moment, Miles jumped down before the great door. He helped Edward from his horse, caught him by the hand, and rushed inside. They crossed into a spacious room. Miles seated the King with more speed than ceremony, then ran toward a young man sitting at a writing table before a generous fire.
        - id: ch03-b08
          speaker: miles_hendon
          text: >-
            Embrace me, Hugh! Tell me you are glad I have come home. Call our father, too. This cannot feel like home until I touch his hand and see his face and hear his voice again!
          emotion: happy
        - id: ch03-b09
          speaker: narrator
          text: >-
            Hugh drew back. Surprise flashed across his face, but only for a moment. He stared gravely at the stranger before him. At first he looked offended. Then, as some private thought came to him, his expression changed to wondering curiosity mixed with compassion, whether true or carefully acted.
        - id: ch03-b10
          speaker: hugh_hendon
          text: >-
            Poor stranger, your mind seems unwell. No doubt the world has treated you harshly. Your face and clothing show how much you have suffered. Who do you believe I am?
        - id: ch03-b11
          speaker: miles_hendon
          text: >-
            Believe you are? Who else could you be? You are Hugh Hendon.
        - id: ch03-b12
          speaker: hugh_hendon
          text: >-
            And who do you imagine yourself to be?
        - id: ch03-b13
          speaker: miles_hendon
          text: >-
            This is no imagining! Do you mean to claim you do not know your own brother, Miles Hendon?
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: >-
            Pleased surprise passed over Hugh's face.
        - id: ch03-b15
          speaker: hugh_hendon
          text: >-
            What? You cannot be joking. Can the dead truly return to life? God be praised, if this is real! Our poor lost boy, back in our arms after all these cruel years! No, it seems too wonderful to be true. Please, have mercy and do not play with my feelings. Come to the light and let me look at you properly.
          emotion: surprised
        - id: ch03-b16
          speaker: narrator
          text: >-
            Hugh seized Miles by the arm and pulled him to the window. He studied him from head to foot, turning him one way and then the other. He stepped quickly around him, examining him from every side. Miles glowed with happiness. He smiled and laughed and kept nodding.
        - id: ch03-b17
          speaker: miles_hendon
          text: >-
            Go on, brother. Look as closely as you please. You will find no limb or feature that fails your test. Examine me all you like, my good old Hugh. I truly am your old Miles, your lost brother. You see it now, do you not? I told you this was a great day! Give me your hand and your cheek. I may die of joy!
          emotion: happy
    - id: ch04
      title: The Dead and the Living
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Miles moved to throw his arms around his brother. Hugh raised one hand to stop him. Then Hugh lowered his chin sadly to his chest and spoke with deep emotion.
        - id: ch04-b02
          speaker: hugh_hendon
          text: >-
            May God in his mercy give me strength to bear this bitter disappointment.
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: >-
            Miles was too astonished to speak. After a moment, he found his voice.
        - id: ch04-b04
          speaker: miles_hendon
          text: >-
            What disappointment? Am I not your brother?
          emotion: surprised
        - id: ch04-b05
          speaker: narrator
          text: >-
            Hugh shook his head with a sorrowful look.
        - id: ch04-b06
          speaker: hugh_hendon
          text: >-
            I pray that you are, and that other eyes may see the likeness hidden from mine. But I fear the letter told the truth.
        - id: ch04-b07
          speaker: miles_hendon
          text: >-
            What letter?
        - id: ch04-b08
          speaker: hugh_hendon
          text: >-
            A letter came from overseas six or seven years ago. It said my brother had died in battle.
        - id: ch04-b09
          speaker: miles_hendon
          text: >-
            That was a lie! Call our father. He will know me.
        - id: ch04-b10
          speaker: hugh_hendon
          text: >-
            No one can call back the dead.
        - id: ch04-b11
          speaker: miles_hendon
          text: >-
            Dead? My father is dead? Oh, this news is hard to bear. Half the joy of coming home has withered away. Then let me see Arthur. My brother Arthur will know me, and he will comfort me.
          emotion: sad
        - id: ch04-b12
          speaker: hugh_hendon
          text: >-
            He is dead as well.
        - id: ch04-b13
          speaker: miles_hendon
          text: >-
            God have mercy on me. Both gone! The worthy were taken, while the worthless one in me was spared. Please, show me mercy. Do not tell me Lady Edith is—
          emotion: sad
        - id: ch04-b14
          speaker: hugh_hendon
          text: >-
            Dead? No. She is alive.
        - id: ch04-b15
          speaker: miles_hendon
          text: >-
            Then God be praised! My joy is whole again. Hurry, brother, and bring her to me. If she says I am not Miles—but she never will. No, no, she will know me. I would be a fool to doubt it. Bring her, and bring the old servants. They will recognize me too.
          emotion: happy
        - id: ch04-b16
          speaker: hugh_hendon
          text: >-
            Only five of the old servants remain. Peter, Halsey, David, Bernard, and Margaret.
        - id: ch04-b17
          speaker: narrator
          text: >-
            Hugh left the room. Miles stood thinking for a while, then paced the floor and muttered to himself.
        - id: ch04-b18
          speaker: miles_hendon
          text: >-
            So the five worst villains survived, while the twenty-two loyal and honest servants are gone. That is a strange thing.
        - id: ch04-b19
          speaker: narrator
          text: >-
            Miles went on pacing and muttering. He had forgotten the King completely. At last, Edward spoke with dignity and real sympathy, though his words could easily have sounded like mockery.
        - id: ch04-b20
          speaker: edward_tudor
          text: >-
            Do not despair over your bad fortune, good man. Others in this world have had their identity denied and their rightful claims mocked. You are not alone.
        - id: ch04-b21
          speaker: miles_hendon
          text: >-
            My King, do not judge me yet. Wait, and you will see. I am no impostor. Edith will say so, and you will hear it from the sweetest lips in England.
        - id: ch04-b22
          speaker: miles_hendon
          text: >-
            How could I be an impostor? I know this old hall, the portraits of my ancestors, and everything around us as well as a child knows his own nursery. I was born and raised here, my lord. I am telling you the truth. I would never deceive you.
        - id: ch04-b23
          speaker: miles_hendon
          text: >-
            Even if no one else believes me, please do not doubt me. I could not bear that.
          emotion: sad
        - id: ch04-b24
          speaker: edward_tudor
          text: >-
            I do not doubt you.
        - id: ch04-b25
          speaker: narrator
          text: >-
            Edward spoke with a child's simple, complete faith. Miles was deeply touched.
        - id: ch04-b26
          speaker: miles_hendon
          text: >-
            I thank you with all my heart!
        - id: ch04-b27
          speaker: edward_tudor
          text: >-
            Do you doubt me?
        - id: ch04-b28
          speaker: narrator
          text: >-
            Guilt and confusion swept over Miles. Just then the door opened, and Hugh entered. Miles was grateful to be spared from answering.
    - id: ch05
      title: Edith's Answer
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            A beautiful lady in rich clothing followed Hugh into the room. Several servants in livery came behind her. The lady walked slowly, her head bowed and her eyes fixed on the floor. Her face held a sadness beyond words. Miles sprang toward her.
        - id: ch05-b02
          speaker: miles_hendon
          text: >-
            Oh, my Edith, my darling—
          emotion: happy
        - id: ch05-b03
          speaker: narrator
          text: >-
            Hugh gave a grave wave of his hand and held Miles back. Then he addressed the lady.
        - id: ch05-b04
          speaker: hugh_hendon
          text: >-
            Look at this man. Do you know him?
        - id: ch05-b05
          speaker: narrator
          text: >-
            Edith had flinched at the sound of Miles's voice, and color had risen in her cheeks. Now she trembled. For several long moments, she stood without moving. Then she slowly lifted her head and looked straight into Miles's eyes.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Her gaze was hard and frightened. Little by little, every trace of color left her face until it looked gray and lifeless. When she answered, her voice sounded as lifeless as her face.
        - id: ch05-b07
          speaker: lady_edith
          text: >-
            I do not know him.
          emotion: fearful
        - id: ch05-b08
          speaker: narrator
          text: >-
            Edith turned away with a moan and a smothered sob. She staggered out of the room. Miles dropped into a chair and covered his face with his hands.
        - id: ch05-b09
          speaker: narrator
          text: >-
            After a pause, Hugh turned to the servants.
        - id: ch05-b10
          speaker: hugh_hendon
          text: >-
            You have all had a good look at him. Do you know this man?
        - id: ch05-b11
          speaker: narrator
          text: >-
            The servants shook their heads.
        - id: ch05-b12
          speaker: hugh_hendon
          text: >-
            The servants do not know you, sir. I fear you have made some mistake. You also saw that my wife did not know you.
        - id: ch05-b13
          speaker: miles_hendon
          text: >-
            Your wife!
          emotion: surprised
        - id: ch05-b14
          speaker: narrator
          text: >-
            In an instant, Miles had Hugh pinned against the wall, one powerful hand gripping his throat.
        - id: ch05-b15
          speaker: miles_hendon
          text: >-
            You treacherous fox! Now I understand everything. You wrote that lying letter yourself, and that lie gave you my bride and all that belonged to me.
          emotion: angry
        - id: ch05-b16
          speaker: miles_hendon
          text: >-
            There. Get away from me before I disgrace my honorable life as a soldier by killing such a pitiful little man!
          emotion: angry
        - id: ch05-b17
          speaker: narrator
          text: >-
            Red-faced and nearly choked, Hugh stumbled to the nearest chair. He ordered the servants to seize the murderous stranger and tie him up. They hesitated, and one of them spoke.
        - id: ch05-b18
          speaker: unidentified_servant
          text: >-
            He has a weapon, Sir Hugh, and none of us is armed.
        - id: ch05-b19
          speaker: hugh_hendon
          text: >-
            Armed? What does that matter when there are so many of you? Take him, I say!
          emotion: angry
        - id: ch05-b20
          speaker: narrator
          text: >-
            Miles warned them to take care.
        - id: ch05-b21
          speaker: miles_hendon
          text: >-
            You knew me in the old days, and I have not changed. Come at me, if that is what you want.
        - id: ch05-b22
          speaker: narrator
          text: >-
            That reminder gave the servants no courage. They still kept their distance.
        - id: ch05-b23
          speaker: hugh_hendon
          text: >-
            Then go, you miserable cowards! Arm yourselves and guard the doors while I send someone for the watch.
          emotion: angry
        - id: ch05-b24
          speaker: narrator
          text: >-
            At the doorway, Hugh turned back to Miles.
        - id: ch05-b25
          speaker: hugh_hendon
          text: >-
            It will be better for you if you make no useless attempt to escape.
        - id: ch05-b26
          speaker: miles_hendon
          text: >-
            Escape? If that is all that troubles you, save yourself the worry. Miles Hendon is master of Hendon Hall and everything that belongs to it. He will remain here. Do not doubt it.
