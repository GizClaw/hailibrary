audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently ironic
        timbre: clear and resonant
        pace: measured
        pitch: medium
    prince_edward:
      display_name: Prince Edward
      tts:
        delivery: proud, fiery, and resolute
        timbre: bright and firm
        pace: brisk
        pitch: medium-high
    miles_hendon:
      display_name: Miles Hendon
      tts:
        delivery: swaggering, warmhearted, and boldly humorous
        timbre: rugged and resonant
        pace: lively
        pitch: medium-low
  chapters:
    - id: ch01
      title: To London
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            At last, Hendon's time in the stocks came to an end. They set him free and ordered him out of the region, warning him never to return. They gave back his sword, his mule, and his donkey. He mounted and rode away, with the King following behind. The crowd quietly opened a path for them, then scattered once they had passed.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Before long, Hendon was lost in thought. He had serious questions to answer. What could he do now? Where could he go? Unless he found someone powerful enough to help him, he would lose his inheritance and go on being called an impostor. But where could he find such help? He turned the problem over and over, and no answer came.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Then he remembered what old Andrews had told him. The young King was good and generous, and he defended people who had been wronged or mistreated. Why not ask the King himself for justice? It was the faintest hope, but it was the only hope Hendon had. No other plan offered him any chance at all, however small.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Of course, a ragged pauper with such a wild tale might never be allowed near the monarch. Hendon decided not to worry about that yet. He could cross that bridge when he came to it. He was an old soldier, used to finding a way through trouble. Surely he could think of something.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Yes, London would be his destination. Perhaps his father's old friend, Sir Humphrey Marlow, could help. Good old Sir Humphrey had been Head Lieutenant of the late King's kitchen, or the stables, or something of the sort. Miles could no longer remember exactly what the post had been.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Now Hendon had a clear purpose again. The fog of shame and misery lifted from his spirits, and he raised his head to look around. He was startled to see how far they had traveled. The village lay well behind them. The King jogged along at his back with his head bowed, deep in plans of his own.
        - id: ch01-b07
          speaker: narrator
          text: >-
            A sad doubt dimmed Hendon's new cheer. Would the boy agree to return to the city where his whole short life had brought him nothing but hunger and cruel treatment? There was no avoiding the question. Hendon drew rein and called back to him.
        - id: ch01-b08
          speaker: miles_hendon
          text: >-
            I forgot to ask where we are going. What are your orders, my liege?
        - id: ch01-b09
          speaker: prince_edward
          text: >-
            To London!
        - id: ch01-b10
          speaker: narrator
          text: >-
            Hendon rode on, delighted by that answer and amazed by it too.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Nothing important happened during the whole journey. But something certainly happened at the end of it. At about ten o'clock on the night of February nineteenth, they reached London Bridge. There they found themselves in the middle of a twisting, shoving mass of people. The crowd yelled and cheered, and the light of countless torches shone on faces made merry by beer.
        - id: ch01-b12
          speaker: narrator
          text: >-
            At that very moment, the decaying head of some former duke or other grand gentleman dropped from above. It struck Hendon on the elbow, bounced away, and vanished among the churning feet.
        - id: ch01-b13
          speaker: narrator
          text: >-
            So quickly do the proud works of men fall apart. The good old King had been dead only three weeks and buried only three days. Yet the decorations he had so carefully chosen for his noble bridge were already tumbling down.
        - id: ch01-b14
          speaker: narrator
          text: >-
            One citizen tripped over the fallen head and crashed face-first into the back of the man ahead of him. That man spun around and knocked down the nearest person he could reach. Then the fallen person's friend promptly knocked him flat in return.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The moment was perfect for a free fight. Tomorrow was Coronation Day, and the celebrations had already begun. Everyone was full of strong drink and patriotism. Within five minutes, the fight had spread across a large part of the bridge. Within ten or twelve, it covered nearly an acre and had grown into a riot.
        - id: ch01-b16
          speaker: narrator
          text: >-
            By then, Hendon and the King had been torn far apart. Each was lost in the rush and uproar of that roaring human crowd.
        - id: ch01-b17
          speaker: narrator
          text: >-
            And there we must leave them.
