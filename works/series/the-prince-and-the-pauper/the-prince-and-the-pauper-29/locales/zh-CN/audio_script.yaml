audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华亲王
      tts:
        delivery: 高贵坚定，受辱时仍保持尊严
        timbre: 清亮稚嫩
        pace: 从容有力
        pitch: 中高
    miles_hendon:
      display_name: 迈尔斯·亨顿
      tts:
        delivery: 豪爽诙谐，危急时勇敢坚定
        timbre: 洪亮粗粝
        pace: 明快有力
        pitch: 中低
  chapters:
    - id: ch01
      title: 离开亨顿庄园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 亨顿戴枷示众的刑期终于满了。他获准释放，却也接到命令，必须离开此地，永远不许回来。官差把剑、骡子和驴都还给了他。他跨上坐骑，带着国王上路。刚才还围观的人群，此刻带着无声的敬意默默分开，让两人从中间过去。等他们走远，众人才各自散开。
        - id: ch01-b02
          speaker: narrator
          text: 走了没多久，亨顿便低头想起自己的处境。眼前的问题个个关系重大，非想出答案不可。他该怎么办，又该去哪里？如果找不到一个有权势的人帮忙，他不但要失去家产，还会一直背着冒名骗子的恶名。可是，这样的援手到哪里去找？他想来想去，终于抓住了一点极渺茫的希望。
        - id: ch01-b03
          speaker: narrator
          text: 老安德鲁斯说过，小国王心地仁慈，愿意替受苦受冤的人主持公道。或许亨顿可以求见国王，请他伸张正义。一个穷得像叫花子、说话又没人肯信的人，怎么进得了君王面前？亨顿决定，等真走到那一步再设法。他是久经沙场的老兵，临时找条门路，总不会难倒他。
        - id: ch01-b04
          speaker: narrator
          text: 对，就去京城。父亲的老朋友汉弗莱·马洛爵士说不定也能帮忙。那位善良的老爵士，好像是先王御膳房的总管，又好像管的是马厩，迈尔斯怎么也记不准。无论如何，他总算有了目标。压在心头的屈辱和沮丧像雾一样散了，他也重新抬起头来。
    - id: ch02
      title: 国王的命令
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 亨顿这才发现，他们已经走出很远，村子早落在身后。国王低着头，骑着驴跟在后面，也深深陷在自己的谋划和思索里。亨顿刚轻快起来的心情，又蒙上一层忧虑。这孩子短短一生里，在那座城中只尝过虐待和穷困，还肯回去吗？可这个问题不能不问，也没法避开。他勒住坐骑，回头高声开口。
        - id: ch02-b02
          speaker: miles_hendon
          text: 我竟忘了问，咱们究竟要往哪里走。陛下，请下令吧！
        - id: ch02-b03
          speaker: prince_edward
          text: 去伦敦！
        - id: ch02-b04
          speaker: narrator
          text: 亨顿听了，满意得不得了，却也着实吃了一惊。他再次催动坐骑，继续赶路。
    - id: ch03
      title: 伦敦桥上的骚乱
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这一路没出什么大事，偏偏就在终点出了事。二月十九日夜里十点左右，两人刚踏上伦敦桥，就挤进一片翻腾的人潮。四周全是呼喊和欢呼。无数火把照着一张张喝啤酒喝得兴高采烈的脸。就在这时，不知是哪位旧日公爵或显贵的腐烂头颅从上面掉下来，先砸中亨顿的胳膊肘，又弹进了乱踏的脚丛里。
        - id: ch03-b02
          speaker: narrator
          text: 人世间的功业，还真是短暂又靠不住。仁慈的先王去世才三周，入土不过三天，他当初费心从名人身上挑来、挂在桥上做装饰的东西，已经开始往下掉了。
        - id: ch03-b03
          speaker: narrator
          text: 一个市民被那颗头颅绊倒，自己的脑袋撞上前面那人的后背。前面的人转过身，顺手打倒离他最近的一个人，随即又被挨打者的朋友撂翻。明天就是加冕日，庆典已经开始。人人都喝足了烈酒，也装满了爱国热情，正好放开手脚打一场混战。
        - id: ch03-b04
          speaker: narrator
          text: 不到五分钟，斗殴已经蔓延开来。再过十来分钟，打架的人足足占了一英亩左右，混战也彻底成了骚乱。亨顿和国王早被人潮冲散，在奔突推搡的混乱中，在咆哮的人海里，失去了彼此的踪影。于是，我们暂且把他们留在那里。
