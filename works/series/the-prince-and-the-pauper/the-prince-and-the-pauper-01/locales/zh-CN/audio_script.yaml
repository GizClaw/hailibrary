audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
  chapters:
    - id: ch01
      title: 两个孩子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 十六世纪第二个二十五年间，一个秋日，古老的伦敦城里降生了两个男孩。
        - id: ch01-b02
          speaker: narrator
          text: 一个生在贫寒的康第家，这家人根本不盼着他来。另一个英国孩子生在富贵的都铎家，全家一直等着他。不只都铎家，整个英国都盼望着这个孩子。人们等了又等，向上帝求了又求。如今他真的来了，全国高兴得几乎发了狂。
    - id: ch02
      title: 举国欢庆
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 平日不过点头相识的人，这时也抱在一起，又亲又哭。人人放下活计，不分贵贱贫富，都来赴宴、跳舞、唱歌，还喝得醉意醺然。这场庆祝接连闹了好几个白天和夜晚。
        - id: ch02-b02
          speaker: narrator
          text: 白天，鲜艳的旗帜在每一处阳台和屋顶上迎风招展，盛装的庆典队伍穿城而过。夜里，每个街角都烧起大篝火，一群群狂欢的人围着火堆尽情作乐。那几天的伦敦，无论昼夜，都有看不尽的热闹。
    - id: ch03
      title: 王子与贫儿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 全国上下谈的全是新生的威尔士亲王，爱德华·都铎。他裹在绫罗绸缎里，丝毫不知道外面为何如此喧腾，也不知道那些爵爷贵妇正守在身旁服侍他。就算知道，他也不会在意。
        - id: ch03-b02
          speaker: narrator
          text: 可另一个孩子呢？汤姆·康第只裹着几片破布，外面没有一个人提起他。只有他那穷苦的一家谈到这个新生婴儿，因为在他们眼里，这孩子一来，只是给全家又添了一份麻烦。
