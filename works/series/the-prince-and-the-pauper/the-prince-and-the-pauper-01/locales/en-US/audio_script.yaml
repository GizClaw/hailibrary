  chapters:
    - id: ch01
      title: The birth of the Prince and the Pauper.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long ago in London, on an autumn day in the second quarter of the sixteenth century, two English boys were born. One arrived in the poor Canty family, where nobody wanted him. The other arrived that same day in the rich Tudor family, where everyone did want him. In fact, all England wanted that child.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The country had waited for him, hoped for him, and prayed to God for him for so long that, when he finally came, the people nearly went mad with joy. Even people who barely knew each other hugged, kissed, and cried together. Everyone took a holiday. High and low, rich and poor, they feasted, danced, sang, and grew very merry, day after day and night after night. In daylight, bright banners flew from balconies and rooftops while splendid pageants marched through London. After dark, huge bonfires burned on every corner, with crowds of revelers celebrating around them.
        - id: ch01-b03
          speaker: narrator
          text: >-
            All England talked about the new baby, Edward Tudor, Prince of Wales. Wrapped in silks and satins, he knew nothing of the excitement. He did not know that great lords and ladies were caring for him and watching over him, and he would not have cared if he had. But no one talked about the other baby. Tom Canty lay wrapped in poor rags, and only his pauper family spoke of the child who had come to trouble them.
