  chapters:
    - id: ch01
      title: The Recognition procession.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            When Tom Canty woke the next morning, a mighty murmur filled the air and rolled in from every direction. To him, it sounded like music. All England seemed to have come out in strength to welcome this great day.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Soon Tom was again the chief figure in a splendid pageant floating along the Thames. By ancient custom, London's recognition procession had to begin at the Tower, so that was where he went.
        - id: ch01-b03
          speaker: narrator
          text: >-
            As he arrived, the old fortress seemed to split open in a thousand places. Red flames sprang out, white smoke poured after them, and a deafening blast swallowed the crowd's cheers and shook the ground. Again and again came the fire, smoke, and thunder. Within moments, the Tower had vanished inside a vast cloud of its own making. Only the top of the White Tower remained in sight, its banners rising above the smoke like a mountain peak above the clouds.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Tom wore magnificent clothes and rode a prancing warhorse whose rich trappings nearly swept the ground. Behind him rode his so-called uncle, Lord Protector Somerset, mounted in equal splendor. The King's Guard formed single lines on both sides, their polished armor shining. Then came what seemed an endless train of brilliant nobles, each attended by his own followers. The lord mayor and all the aldermen followed in crimson velvet robes, with gold chains laid across their chests. After them came the officers and members of every London guild, dressed in their finest clothes and carrying the showy banners of their different companies.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The Ancient and Honourable Artillery Company also marched in the procession as the King's special guard of honor through the city. Even then, the company was already three hundred years old. It was the only military body in England with the privilege of remaining independent of Parliament's commands, a privilege it still held in the chronicler's own day. The whole procession made a dazzling sight. It moved with stately slowness between packed crowds of citizens, and cheers met it all along the route.
        - id: ch01-b06
          speaker: narrator
          text: >-
            One chronicler tells how warmly the people received the King as he entered the city. They offered prayers, welcomes, cries, tender words, and every other sign of the deep love that subjects could feel for their sovereign. Tom showed just as much gratitude for their goodwill. He lifted his happy face toward those far away and spoke with great tenderness to those near him. He thanked everyone who wished him well.
        - id: ch01-b07
          speakers: [citizen_1, citizen_2, citizen_3, citizen_4]
          ensemble: chorus
          text: >-
            God save your Grace!
          emotion: happy
        - id: ch01-b08
          speaker: tom_canty
          text: >-
            And God save every one of you! I thank you with all my heart.
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: >-
            His loving answers and gestures carried the people away with delight.
        - id: ch01-b10
          speaker: narrator
          text: >-
            In Fenchurch Street, a finely dressed child stood on a stage to welcome his Majesty into the city. The greeting ended with these words.
        - id: ch01-b11
          speaker: welcoming_child
          text: >-
            Welcome, O King, as warmly as our hearts can think and our tongues can tell. Our joyful voices and faithful hearts welcome you. May God protect you always and keep you well.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The people burst into a joyful shout and repeated the child's welcome together.
        - id: ch01-b13
          speakers: [citizen_1, citizen_2, citizen_3, citizen_4]
          ensemble: chorus
          text: >-
            Welcome, O King! May God protect you and keep you well!
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: >-
            Tom looked across the heaving sea of eager faces, and his heart rose with triumph. At that moment, nothing in the world seemed more worth living for than being a king and the idol of a nation.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Then he spotted two ragged boys from Offal Court in the distance. In his old make-believe court, one had been lord high admiral and the other first lord of the bedchamber. The sight made Tom's pride climb higher still. If only they could recognize him now! What glory it would be if they understood that the mock king they had once laughed at among the slums and back alleys had become a real King, with famous dukes and princes acting as his humble servants and the whole English world lying at his feet.
        - id: ch01-b16
          speaker: narrator
          text: >-
            But Tom forced himself to turn away. Being recognized might cost him far more than the pleasure was worth. So the two dirty boys kept shouting their praise, never guessing who received it.
        - id: ch01-b17
          speakers: [citizen_1, citizen_2, citizen_3, citizen_4]
          ensemble: chorus
          text: >-
            A gift! A gift from the King!
        - id: ch01-b18
          speaker: narrator
          text: >-
            Whenever that cry rose, Tom scattered handfuls of bright new coins for the crowd to scramble after.
        - id: ch01-b19
          speaker: narrator
          text: >-
            At the upper end of Gracechurch Street, in front of the sign of the Eagle, the city had raised a splendid arch. Beneath it stood a stage stretching all the way from one side of the street to the other. The scene presented the King's nearest royal ancestors. Elizabeth of York sat in the center of an enormous white rose, its great petals folded around her like elaborate ruffles. Beside her, Henry the Seventh appeared from a vast red rose arranged in the same fashion. The royal pair held hands, and their wedding ring was placed where everyone could plainly see it.
        - id: ch01-b20
          speaker: narrator
          text: >-
            A single stem grew out of the red and white roses and reached a second stage above them. There sat Henry the Eighth, appearing from a rose that was both red and white. Beside him stood an image of the new King's mother, Jane Seymour. From that pair, one branch climbed to a third stage. There, an image of Edward the Sixth himself sat on a throne in royal majesty. Wreaths of red and white roses framed the whole bright, curious display.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The strange and gaudy sight excited the celebrating people so much that their cheers completely drowned the small voice of the child who was supposed to explain it all in flattering verses. Tom did not mind in the least. That loyal uproar sounded sweeter to him than any poem, no matter how fine the poem might be. Wherever he turned his delighted young face, the people compared him with the royal image on the stage. They saw how exactly the painted figure resembled its living flesh-and-blood model, and fresh whirlwinds of applause broke loose.
        - id: ch01-b22
          speaker: narrator
          text: >-
            On and on the grand procession went. It passed beneath one triumphal arch after another and by a dizzying series of spectacular scenes and symbols. Each display stood for some virtue, talent, or worthy quality of the little King, and each one praised him for it. All through Cheapside, banners and streamers hung from every projecting roof and every window. The richest carpets, fabrics, and cloth of gold decorated the streets. They were samples of the great wealth stored inside the shops. Other streets matched the splendor of Cheapside, and some even surpassed it.
        - id: ch01-b23
          speaker: tom_canty
          text: >-
            All these wonders, all these marvels, are here to welcome me. Me!
          emotion: surprised
        - id: ch01-b24
          speaker: narrator
          text: >-
            Tom's cheeks glowed with excitement, and his eyes flashed. Pleasure left him almost dizzy and overwhelmed his senses. He raised a hand to throw another rich gift of coins. Then he saw a pale, astonished face leaning out from the second row of the crowd. Its eyes were fixed upon him.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Horror swept through him. It was his mother. At once his hand flew up, palm outward, before his eyes. It was the old movement he made without thinking, a habit born from something he had long forgotten.
        - id: ch01-b26
          speaker: narrator
          text: >-
            In another instant, she had fought her way through the crowd and slipped past the guards. She reached Tom's side, threw her arms around his leg, and covered it with kisses. Then she looked up at him, her face shining with joy and love.
        - id: ch01-b27
          speaker: toms_mother
          text: >-
            Oh, my child! My darling!
          emotion: happy
        - id: ch01-b28
          speaker: narrator
          text: >-
            A Guard officer cursed, tore her away, and flung her reeling back toward the crowd with one powerful shove.
        - id: ch01-b29
          speaker: tom_canty
          text: >-
            I do not know you, woman!
        - id: ch01-b30
          speaker: narrator
          text: >-
            The words were already leaving Tom's lips when he saw what the officer had done. The pitiful sight struck him to the heart. As the crowd swallowed his mother from view, she turned for one last glimpse of him. Her face looked so wounded and so brokenhearted that shame fell upon Tom. It burned his pride to ashes and withered the royalty he had stolen. In one moment, all his grandeur became worthless. It seemed to fall away from him like rotten rags.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The procession moved on through greater splendors and ever louder storms of welcome, but Tom neither saw nor heard them. Royalty had lost all its sweetness. Its pomp now accused him, and remorse ate at his heart.
        - id: ch01-b32
          speaker: tom_canty
          text: >-
            I wish to God I could escape this prison!
          emotion: sad
        - id: ch01-b33
          speaker: narrator
          text: >-
            Without knowing it, he had fallen back into the way he spoke during the first days of his forced greatness.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The shining procession still wound through the crooked lanes of the quaint old city like a bright and endless serpent. Cheering crowds pressed around it everywhere. Yet the King rode on with his head bowed and his eyes empty. Of all the things before him, he saw only his mother's face and the wounded look she had given him.
        - id: ch01-b35
          speakers: [citizen_1, citizen_2, citizen_3, citizen_4]
          ensemble: chorus
          text: >-
            A gift! A gift from the King!
        - id: ch01-b36
          speaker: narrator
          text: >-
            Tom paid no attention.
        - id: ch01-b37
          speakers: [citizen_1, citizen_2, citizen_3, citizen_4]
          ensemble: chorus
          text: >-
            Long live Edward of England!
          emotion: happy
        - id: ch01-b38
          speaker: narrator
          text: >-
            The roar seemed strong enough to shake the earth, but the King gave no answer. He heard it as a person hears the thunder of ocean waves carried faintly from a great distance. Another sound was closer, inside his own chest. His accusing conscience kept repeating the shameful words he had spoken.
        - id: ch01-b39
          speaker: tom_canty
          text: >-
            I do not know you, woman!
          emotion: sad
        - id: ch01-b40
          speaker: narrator
          text: >-
            Those words struck his soul like a funeral bell that reminds a living friend of some secret betrayal against the one who has died.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Every turn revealed fresh glory, fresh wonders, and fresh marvels. Waiting cannons released the thunder they had held back, and waiting crowds poured out new cries of joy. Still the King showed no sign that he saw or heard any of it. The grieving, accusing voice inside his comfortless heart was all he heard.
        - id: ch01-b42
          speaker: narrator
          text: >-
            After a while, the happiness on the people's faces began to change. Concern and worry crept into their expressions, and the great volume of cheering grew noticeably quieter. The Lord Protector was quick to see the difference, and just as quick to understand its cause. He urged his horse to the King's side, removed his hat, and bent low in the saddle.
        - id: ch01-b43
          speaker: lord_protector
          text: >-
            My liege, this is no time to dream. The people see your bowed head and troubled face. They fear it is a bad sign. Let them see the sun of royalty again and drive those dark fears away. Raise your face, Your Grace. Smile at your people.
        - id: ch01-b44
          speaker: narrator
          text: >-
            The Duke threw a handful of coins to his right and left, then returned to his place. Tom obeyed like a machine. There was no feeling in his smile, but few people stood close enough, or watched sharply enough, to notice. He nodded his feathered head with perfect grace and kindness as he greeted his subjects. The gifts he scattered from his hand were generous enough for any King. The people's anxiety disappeared, and their cheers rose again with all their former power.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Not long before the procession ended, the Duke had to ride forward once more. He leaned close and whispered another warning.
        - id: ch01-b46
          speaker: lord_protector
          text: >-
            O mighty sovereign, cast off this deadly mood. The whole world is watching you.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Then annoyance sharpened his voice.
        - id: ch01-b48
          speaker: lord_protector
          text: >-
            Curse that mad beggar! She is the one who has upset your Highness.
          emotion: angry
        - id: ch01-b49
          speaker: narrator
          text: >-
            The splendid figure turned a dull, lifeless eye toward the Duke. His answer came in a dead voice.
        - id: ch01-b50
          speaker: tom_canty
          text: >-
            She was my mother.
          emotion: sad
        - id: ch01-b51
          speaker: narrator
          text: >-
            The Protector groaned and pulled his horse backward toward his post.
        - id: ch01-b52
          speaker: lord_protector
          text: >-
            My God! That evil sign has come true. He has gone mad again!
          emotion: fearful
