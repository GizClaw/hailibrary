audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    tom_canty:
      display_name: 汤姆·康蒂
      tts:
        delivery: 天真敏捷，窘迫时带着平民孩子的直率
        timbre: 清亮稚嫩
        pace: 轻快灵活
        pitch: 中高
    herald:
      display_name: 传令官
      tts:
        delivery: 庄严响亮，吐字利落
        timbre: 洪亮清晰
        pace: 稳健
        pitch: 中低
    spectator_1:
      display_name: 回廊中的市民甲
      tts:
        delivery: 热烈恭敬，声音充满庆典的兴奋
        timbre: 明亮有力
        pace: 明快
        pitch: 中等
    spectator_2:
      display_name: 回廊中的市民乙
      tts:
        delivery: 热烈恭敬，带着由衷的欢呼
        timbre: 清脆饱满
        pace: 明快
        pitch: 中高
    spectator_3:
      display_name: 回廊中的市民丙
      tts:
        delivery: 热烈恭敬，语气坚定昂扬
        timbre: 雄浑响亮
        pace: 明快
        pitch: 中低
  chapters:
    - id: ch01
      title: 第十六章　国宴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 用膳的时辰一点点近了。奇怪的是，汤姆这回只有些许不安，几乎不再害怕。上午的经历给了他不少信心。这只可怜的灰堆小猫，在陌生阁楼里住了四天，竟比成年人住满一个月还适应得快。孩子随遇而安的本领，在他身上显得再清楚不过。
        - id: ch01-b02
          speaker: narrator
          text: 汤姆正在为这场盛会梳妆。趁这个工夫，我们先去宴会大厅瞧一眼。那是一间宽敞宏伟的大厅，柱子和壁柱都镀着金，墙上和天花板上画满图画。高大的卫兵守在门边，身穿华美别致的服装，手执长戟，一动不动，像一尊尊雕像。
        - id: ch01-b03
          speaker: narrator
          text: 大厅高处有一圈回廊。乐师和衣着灿烂的男女市民把那里挤得满满当当。大厅中央立着高台，汤姆的餐桌就摆在台上。至于开宴前的礼节，古代的编年史家记得十分仔细。
        - id: ch01-b04
          speaker: narrator
          text: 先有一位绅士拿着权杖走进来，另一人捧着桌布跟在身旁。两人恭恭敬敬地跪拜三次，随后把桌布铺上餐桌。他们又跪拜一回，这才一同退下。
        - id: ch01-b05
          speaker: narrator
          text: 接着又来两人。一个仍旧拿着权杖，另一个捧来盐罐、餐盘和面包。他们照样跪拜，把东西放上桌，再按前一对人的礼节退出。
        - id: ch01-b06
          speaker: narrator
          text: 最后进来两位衣饰华贵的贵族，其中一人带着试膳刀。他们用最优雅的姿态伏地拜了三次，才走到桌边，用面包和盐擦拭桌面。那副诚惶诚恐的样子，就像国王已经坐在那里看着他们。
        - id: ch01-b07
          speaker: narrator
          text: 庄严的准备仪式总算结束了。远处幽长的走廊里，忽然传来一声号角，模糊的呼喊也跟着响起。
        - id: ch01-b08
          speaker: herald
          text: 给国王让路！给至高无上的国王陛下让路！
        - id: ch01-b09
          speaker: narrator
          text: 号声和呼喊不断重复，一次比一次近。不多时，激昂的号角仿佛就在眼前奏响，传令声也清楚地震动着整座大厅。
        - id: ch01-b10
          speaker: herald
          text: 给国王让路！
        - id: ch01-b11
          speaker: narrator
          text: 光彩夺目的仪仗队就在这时出现，迈着庄重整齐的步子从门口进来。走在最前面的是绅士、男爵、伯爵和嘉德骑士。他们个个衣着华贵，头上都没有戴帽子。
        - id: ch01-b12
          speaker: narrator
          text: 大法官随后走来，左右各有一人相伴。一人捧着王室权杖，另一人举着剑尖向上的御剑。御剑装在红色剑鞘里，上面缀满金色鸢尾花。
        - id: ch01-b13
          speaker: narrator
          text: 接下来就是国王本人。他一露面，十二支号角和许多面大鼓便一齐轰响，送上盛大的欢迎。回廊里的人全都站了起来。
        - id: ch01-b14
          speakers: [spectator_1, spectator_2, spectator_3]
          ensemble: chorus
          text: 上帝保佑国王！
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: 国王身后跟着近身侍奉的贵族，左右两边是仪仗卫队。那五十名领取年金的王室绅士肩扛镀金战斧，护送着他走进大厅。
        - id: ch01-b16
          speaker: narrator
          text: 眼前的一切既壮观，又叫人愉快。汤姆心跳得快起来，眼睛里也闪着喜悦。他的举止格外自然优雅，因为他根本顾不上琢磨自己做得好不好。周围欢快的景象和声音早已把他迷住，占满了他的心思。
        - id: ch01-b17
          speaker: narrator
          text: 再说，一个人穿着漂亮又合身的衣服，习惯之后，本来也不容易显得笨拙。要是他一时忘了自己穿着那身衣服，就更不会局促了。汤姆还记得别人教过的规矩。他头戴羽饰，向欢呼的人群轻轻点头。
        - id: ch01-b18
          speaker: tom_canty
          text: 谢谢你们，我的好百姓。
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: 汤姆没有摘帽子，直接在桌前坐下，而且一点也不难为情。戴帽吃饭，恰好是历代国王和康蒂一家唯一共有的习惯。说起对此事的熟悉，谁也不比谁更占便宜。仪仗队伍这时散开，在四周排成一幅华丽悦目的景象，所有人依然光着头。
        - id: ch01-b20
          speaker: narrator
          text: 欢快的乐声里，王家近卫队走了进来。编年史家说，他们是全英格兰最高大、最强壮的男子，因为选拔时尤其看重这两样条件。近卫们没有戴帽子，身穿猩红制服，背后绣着金色玫瑰。
        - id: ch01-b21
          speaker: narrator
          text: 他们一次次进出大厅，每次送来一道装在银盘里的菜。另一位绅士依次接过菜肴，摆到餐桌上。与此同时，试膳官从每道菜里取出一口，让负责送菜的卫士吃下去，以防菜里藏着毒物。
        - id: ch01-b22
          speaker: narrator
          text: 汤姆吃得很香，尽管他知道，几百双眼睛正跟着送到他嘴边的每一口食物。众人兴致勃勃地看他吃下去，专注得不得了。哪怕那口食物会突然爆炸，把他炸得四处飞散，大家恐怕也不会盯得更紧。
        - id: ch01-b23
          speaker: narrator
          text: 汤姆小心地控制着速度，不让自己吃得太急。他也绝不亲手做任何事，只等该管那件事的官员跪下来替他办。他就这样吃完了整顿饭，一次错也没出。这场小小的胜利完美无瑕，对他来说实在珍贵。
        - id: ch01-b24
          speaker: narrator
          text: 国宴终于结束。汤姆在华丽的仪仗簇拥下离开，嘹亮的号角、隆隆的鼓声和雷鸣般的欢呼还响在耳边。这些喜庆的声音叫他心满意足。
        - id: ch01-b25
          speaker: narrator
          text: 他心想，倘若公开用膳最难熬的也不过如此，那这样的考验，一天来上好几回也没什么。只要能用它换掉几项更可怕的王室职责，他会十分乐意。
