audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华亲王
      tts:
        delivery: 高贵坚定，受辱时仍保持尊严
        timbre: 清亮稚嫩
        pace: 从容有力
        pitch: 中高
    miles_hendon:
      display_name: 迈尔斯·亨顿
      tts:
        delivery: 豪爽诙谐，危急时勇敢坚定
        timbre: 洪亮粗粝
        pace: 明快有力
        pitch: 中低
    jailer:
      display_name: 狱卒
      tts:
        delivery: 粗暴轻慢，取笑人时满是恶意
        timbre: 沙哑厚重
        pace: 粗声粗气
        pitch: 中低
    blake_andrews:
      display_name: 布莱克·安德鲁斯
      tts:
        delivery: 忠厚谨慎，真情流露时恳切坚定
        timbre: 苍老温厚
        pace: 缓慢清楚
        pitch: 中低
    baptist_woman:
      display_name: 浸礼派妇人
      tts:
        delivery: 温柔慈爱，面对苦难时悲痛而克制
        timbre: 柔和低沉
        pace: 舒缓
        pitch: 中等
    old_lawyer:
      display_name: 老律师
      tts:
        delivery: 刚毅无畏，承受苦难仍不失尊严
        timbre: 苍劲清晰
        pace: 沉稳
        pitch: 中低
  chapters:
    - id: ch01
      title: 拥挤的牢房
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 牢房都塞满了，国王和亨顿只好被锁进一间大屋。这里本来关的是轻罪犯，如今却挤着二十来个男女老少，人人戴着手铐脚镣，吵闹又粗野。
        - id: ch01-b02
          speaker: narrator
          text: 国王想到王者的尊严受了这般羞辱，越想越愤怒。亨顿却阴着脸，一句话也不说。他实在想不通，自己明明像一个欢天喜地归家的浪子，以为人人都会为他的归来欣喜若狂，等到的却只有冷眼和监牢。先前的希望与眼下的结果相差太远，震得他头脑发蒙，甚至说不清这更像一场悲剧，还是一出荒唐戏。
        - id: ch01-b03
          speaker: narrator
          text: 那滋味，就像一个人欢欢喜喜跑去看彩虹，结果迎头挨了一道雷劈。
        - id: ch01-b04
          speaker: narrator
          text: 混乱又折磨人的思绪慢慢沉下来，亨顿便一心想起伊迪丝。她到底认出了他没有？他把她的一举一动翻来覆去，从各个角度琢磨了很久，却始终找不到一个满意的解释。最后，他认定伊迪丝其实认出了自己，只因私利才拒不相认。他真想把一切诅咒都加在她身上，可那个名字在心里神圣了太多年，他仍说不出一句亵渎的话。
        - id: ch01-b05
          speaker: narrator
          text: 两个人裹着肮脏破烂的监狱毯子，熬过一个不得安宁的夜晚。几个囚犯买通狱卒弄来酒，很快便唱起下流的歌，又叫喊，又打架，喝得闹成一团。午夜过后，一个男人扑向一个女人，用手铐猛砸她的头。狱卒赶到以前，他已经险些把她打死。
        - id: ch01-b06
          speaker: narrator
          text: 狱卒赶来，用棍子狠狠揍了那男人一顿，总算压住骚乱。此后，除了两个伤者的呻吟，再没有别的喧闹。不嫌那声音扰人的囚犯，终于可以睡了。
        - id: ch01-b07
          speaker: narrator
          text: 接下来一星期，白天和黑夜都过得单调而一成不变。白天，总有亨顿隐约认得面孔的人来到牢里，观看这个所谓的冒牌货。他们一个接一个当面否认他，又出言羞辱他。到了夜里，喝酒闹事和斗殴又像按着时辰一样准时开始。直到一天，狱卒带来一个老人，才终于有了变化。
        - id: ch01-b08
          speaker: jailer
          text: 那个恶棍就在这里。拿你的老眼挨个儿瞧瞧，看你认不认得出他。
        - id: ch01-b09
          speaker: narrator
          text: 亨顿抬头一看，入狱以后第一次感到欣慰。来人是布莱克·安德鲁斯，在他父亲家当了一辈子仆人，一向忠厚正直。可亨顿立刻又想，如今人人都会说谎，安德鲁斯即使认出了他，也会像别人那样否认。
        - id: ch01-b10
          speaker: narrator
          text: 老人把屋里每张脸都看了一遍。
        - id: ch01-b11
          speaker: blake_andrews
          text: 我只看见一群不值钱的无赖，全是街头渣滓。你说的是谁？
        - id: ch01-b12
          speaker: narrator
          text: 狱卒笑起来，朝亨顿一指。
        - id: ch01-b13
          speaker: jailer
          text: 就是这头大牲口。好好看看，再说说你的见解。
        - id: ch01-b14
          speaker: narrator
          text: 安德鲁斯走到跟前，长久而仔细地打量亨顿，随后摇了摇头。
        - id: ch01-b15
          speaker: blake_andrews
          text: 老天作证，这个人不是亨顿，以前也从来不是！
        - id: ch01-b16
          speaker: jailer
          text: 对了，你的老眼还挺好使。换成休爵士，准会把这寒酸的老东西——
        - id: ch01-b17
          speaker: narrator
          text: 狱卒踮起脚，假装脖子套上绞索，喉咙里还挤出被勒住似的怪声，用这个动作说完了后半句话。
        - id: ch01-b18
          speaker: blake_andrews
          text: 他若只受这点罪，就该感谢上帝。这个恶棍要落在我手里，我非烤熟他不可，不然还算什么真汉子！
        - id: ch01-b19
          speaker: narrator
          text: 狱卒像只得意的鬣狗一样笑了。
        - id: ch01-b20
          speaker: jailer
          text: 老头儿，尽管痛骂他吧，人人都这样取乐。你也会觉得有意思。
        - id: ch01-b21
          speaker: narrator
          text: 狱卒慢吞吞回到外间。等他消失，老人立刻跪到亨顿面前，把声音压得极低。
        - id: ch01-b22
          speaker: blake_andrews
          text: 感谢上帝，主人，您终于回来了！七年来我一直以为您死了，没想到您还活着。我第一眼就认出了您。为了不露声色，我得板着脸，把您说成两便士也不值的街头垃圾，真是费尽了力气。我又老又穷，可只要您开口，我就出去宣告真相，哪怕因此被人勒死！
        - id: ch01-b23
          speaker: miles_hendon
          text: 不，你不能去。那会毁掉你，对我的事情却没有多少帮助。不过我谢谢你。是你让我重新相信，世上还有忠诚的人。
    - id: ch02
      title: 老仆人的消息
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 从此，老仆人成了亨顿和国王的一大助力。安德鲁斯一天来好几次，装作辱骂亨顿，暗地里却总会偷带进一些可口食物，给监狱的饭菜添点补充，还把外面的消息告诉他。亨顿把好吃的全留给国王。狱卒给的牢饭既粗劣又难以下咽，国王根本吃不下去。若没有这些补充，他也许无法活着撑过这段日子。
        - id: ch02-b02
          speaker: narrator
          text: 为了不引起怀疑，老人每次都很快离开。他贴近亨顿，低声讲真正的消息，再忽然提高嗓门，夹进几句骂人的话，好让旁人听见。
        - id: ch02-b03
          speaker: narrator
          text: 亨顿就这样一点点知道了家中的往事。亚瑟已经死了六年。父亲失去了亚瑟，又一直收不到迈尔斯的消息，身体也随之越来越坏。他以为自己的日子已经不多了，唯一的愿望，就是在离开人世以前亲眼看着休和伊迪丝成婚安家。
        - id: ch02-b04
          speaker: narrator
          text: 伊迪丝苦苦请求延期，只盼迈尔斯还能回来。后来，那封宣告迈尔斯死讯的信送到，理查德爵士受不住这场打击，病得再也起不了身，只觉得死期就在眼前。他和休一起坚持要伊迪丝成婚。伊迪丝先争取到一个月宽限，接着又求来一个月，最后又拖了第三个月。可迈尔斯始终没有回来，婚礼终究在理查德爵士的病榻边举行。
        - id: ch02-b05
          speaker: narrator
          text: 这桩婚姻并不幸福。乡间流传着一个说法：新婚不久，伊迪丝在丈夫的文件里发现了那封致命书信的几份草稿。她指责休伪造书信，不但逼成了婚事，也害死了理查德爵士。
        - id: ch02-b06
          speaker: narrator
          text: 休虐待伊迪丝和仆人的传闻到处都是。父亲去世后，他连最后一点温和的伪装也扔掉了。凡是仰仗他和庄园才有饭吃的人，都只能忍受这个冷酷的主人。
        - id: ch02-b07
          speaker: narrator
          text: 安德鲁斯接着说起一则传闻，国王一下来了精神。
        - id: ch02-b08
          speaker: blake_andrews
          text: 外面有人说，国王疯了。不过千万别说是我提的。听说谈起这件事就能叫人丢了性命。
        - id: ch02-b09
          speaker: narrator
          text: 国王狠狠瞪住老人。
        - id: ch02-b10
          speaker: prince_edward
          text: 国王没有疯，好人。少说这种大逆不道的话，多管与你自己有关的事，对你才有好处。
          emotion: angry
        - id: ch02-b11
          speaker: blake_andrews
          text: 这孩子是什么意思？
        - id: ch02-b12
          speaker: narrator
          text: 意想不到的凌厉斥责叫安德鲁斯吃了一惊。亨顿给他使个眼色，他便不再追问，只管继续说消息。
        - id: ch02-b13
          speaker: blake_andrews
          text: 先王过一两天就要安葬在温莎，也就是本月十六日。新王会在二十日到威斯敏斯特加冕。
        - id: ch02-b14
          speaker: prince_edward
          text: 那他们总得先找到他。不过他们自会留意这件事，我也不会坐着不管。
        - id: ch02-b15
          speaker: blake_andrews
          text: 看在上帝的份上，您这话究竟是什么意思？
        - id: ch02-b16
          speaker: narrator
          text: 亨顿赶紧用眼神把他的话截住。老人只好又把话题转回外面的消息。
        - id: ch02-b17
          speaker: blake_andrews
          text: 休爵士要去参加加冕礼，心里还抱着极大的希望。他认定自己回来时会成为贵族，因为护国公十分宠信他。
        - id: ch02-b18
          speaker: prince_edward
          text: 你说哪个护国公？
        - id: ch02-b19
          speaker: blake_andrews
          text: 萨默塞特公爵大人。
        - id: ch02-b20
          speaker: prince_edward
          text: 哪个萨默塞特公爵？
        - id: ch02-b21
          speaker: blake_andrews
          text: 当然只有一个，就是赫特福德伯爵西摩。
        - id: ch02-b22
          speaker: prince_edward
          text: 他什么时候成了公爵，又成了护国公？
        - id: ch02-b23
          speaker: blake_andrews
          text: 一月最后一天。
        - id: ch02-b24
          speaker: prince_edward
          text: 那是谁封他的？
        - id: ch02-b25
          speaker: blake_andrews
          text: 他自己和大议会，还得到了国王的帮助。
        - id: ch02-b26
          speaker: narrator
          text: 国王猛地一震。
        - id: ch02-b27
          speaker: prince_edward
          text: 国王？好先生，你说的是哪个国王？
          emotion: surprised
        - id: ch02-b28
          speaker: blake_andrews
          text: 还能是哪个？上帝慈悲，这孩子是怎么了？我们只有一位国王，就是最神圣的爱德华六世陛下，愿上帝保佑他！他还是个可爱又仁慈的小家伙。无论他究竟疯没疯，大家都说他的病一天天好转。人人赞颂他，为他祝福，也都祈求他长久统治英格兰。
        - id: ch02-b29
          speaker: blake_andrews
          text: 他登基之初便救下老诺福克公爵的性命，如今又决心废除那些最残酷、最会迫害百姓的法律。大家都为这些仁慈的事感谢他。
    - id: ch03
      title: 两位温柔的朋友
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这些话把国王惊得哑口无言。他陷进阴沉的沉思，安德鲁斯后来还说了什么，他一个字也没听见。
        - id: ch03-b02
          speaker: narrator
          text: 那位所谓的小国王，会不会就是他留在宫中、还穿着他那身衣服的乞丐孩子？可那孩子若冒充威尔士亲王，言谈举止一定会泄露身份。人们早该把他赶出去，再四处寻找真正的亲王。难道宫廷另找了一个贵族子弟来顶替？这也说不通。他的舅舅权势无边，既有能力粉碎这种图谋，也绝不会容许它发生。
        - id: ch03-b03
          speaker: narrator
          text: 他越想解开谜团，头脑越乱，头也越痛，夜里更难入睡。他每一刻都更急着赶往伦敦，监牢几乎变得无法忍受。
        - id: ch03-b04
          speaker: narrator
          text: 亨顿使尽办法也安慰不了他，锁在附近的两个女人却做得好得多。她们温柔地照料他，让他渐渐平静下来，也学会了几分耐心。国王十分感激，心里很快便深深爱上了这两位朋友。他喜欢她们待在身边时那种甜美又安抚人心的力量，也越来越离不开这份安宁。
        - id: ch03-b05
          speaker: narrator
          text: 他问两人为什么入狱。听说她们是浸礼派教徒，他笑了。
        - id: ch03-b06
          speaker: prince_edward
          text: 信奉这个教派也算该进监牢的罪吗？这下我倒要难过了，因为很快就见不到你们啦。为了这么一点小事，他们不会关你们太久。
        - id: ch03-b07
          speaker: narrator
          text: 两个女人没有回答。她们脸上的神情让国王忽然不安起来。
        - id: ch03-b08
          speaker: prince_edward
          text: 你们怎么不说话？请待我好些，告诉我，不会还有别的刑罚吧？快说，不必担心别的事。
        - id: ch03-b09
          speaker: narrator
          text: 她们想换个话题，可国王已经害怕起来，不肯罢休。
        - id: ch03-b10
          speaker: prince_edward
          text: 难道他们会鞭打你们？不，不会的，他们不至于这样残忍。快告诉我，他们不会这样做，对不对？
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: 两个女人又慌乱又痛苦。她们躲不过这个问题，其中一人终于开口，声音哽咽。
        - id: ch03-b12
          speaker: baptist_woman
          text: 你这样温柔，真要叫我们的心都碎了！上帝会帮助我们忍受——
          emotion: sad
        - id: ch03-b13
          speaker: prince_edward
          text: 这等于承认了！那些铁石心肠的恶棍，真的要鞭打你们！可你别哭，我受不了。一定要鼓起勇气。总有一天我会夺回属于我的一切，那时我会救你们免受这种苦刑。我一定会救你们！
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: 第二天早晨，国王醒来时，两个女人已经不见了。
        - id: ch03-b15
          speaker: prince_edward
          text: 她们得救了！可我又该怎么办呢？她们原是安慰我的人。
          emotion: sad
        - id: ch03-b16
          speaker: narrator
          text: 她们各自在他的衣服上别了一小条丝带，留给他作纪念。国王说，他会永远珍藏它们。不久以后，他还要找到这两位亲爱的朋友，把她们保护起来。
    - id: ch04
      title: 雪中的刑场
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 狱卒恰在这时带着手下进来，命令所有囚犯到院子里去。国王高兴极了。他终于能再看见蓝天，呼吸新鲜空气。狱吏动作稍慢一些，他便焦躁不已。终于，锁住他的链子被解开，他和亨顿一起跟在其他囚犯身后。
        - id: ch04-b02
          speaker: narrator
          text: 院子四四方方，地上铺着石块，头顶没有遮盖。囚犯穿过厚重的石拱门，排成一列，背靠墙站着。面前拉着绳子，四周还有狱吏看守。
        - id: ch04-b03
          speaker: narrator
          text: 清晨阴沉寒冷。夜里落下的一层薄雪，把这片巨大而空荡的院子全都染白，更显凄凉。凛冽的寒风不时穿堂而过，把地上的雪卷得四处飞旋。
        - id: ch04-b04
          speaker: narrator
          text: 院子中央站着两个女人，都被铁链锁在柱子上。国王一眼就认出，她们正是那两位温柔的朋友。他浑身发抖，这才明白她们根本没有获得自由。
        - id: ch04-b05
          speaker: prince_edward
          text: 像她们这样善良的人，竟也要受鞭刑，而且是在英格兰！这里不是异教徒的国度，而是信奉基督的英格兰，这才最可耻。她们安慰过我，善待过我，如今我却只能看着她们受冤屈。
          emotion: angry
        - id: ch04-b06
          speaker: prince_edward
          text: 我明明是这片国土上一切权力的源头，却连她们也保护不了。那些恶徒最好小心。总有一天，我会重重清算今日的罪行。他们现在每打下一鞭，将来都要偿还百鞭！
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 大门轰然打开，一群市民涌进来，围住两个女人，也把她们完全挡在国王的视线之外。一位教士穿过人群，很快也看不见了。国王只听见远处有人来来回回地说话，仿佛正在问答，却怎么也听不清内容。
        - id: ch04-b08
          speaker: narrator
          text: 官员们忙着准备，在人群里来来往往。他们活动的地方都在两个女人远离国王的那一边，所以国王仍看不见究竟发生了什么。四周慢慢安静下来。随后，人群奉命分向两边。国王终于看见眼前的景象，只觉得骨髓都冻住了。
        - id: ch04-b09
          speaker: narrator
          text: 两个女人身边堆的不是鞭子，而是柴薪。一个男人正跪在地上点火。
        - id: ch04-b10
          speaker: narrator
          text: 两个女人低下头，用手掩住脸。黄色的火焰在噼啪作响的柴堆间向上攀，蓝色烟缕随风飘散。教士举起双手，开始祷告。
        - id: ch04-b11
          speaker: narrator
          text: 就在此刻，两个年轻姑娘尖叫着冲进大门，扑向火刑柱上的女人。狱吏立刻拖走她们，牢牢抓住一个。另一个却挣脱开来，哭喊着要和母亲一起死，再次扑上去，抱住母亲的脖子。
        - id: ch04-b12
          speaker: narrator
          text: 狱吏又一次把她扯开，她的裙子已经着火。两三个人按住她，撕下燃烧的衣料扔到一边。她始终拼命挣扎，哭喊着母亲一死，自己在世上便孤苦无依，求他们让她和母亲死在一起。
        - id: ch04-b13
          speaker: narrator
          text: 两个姑娘不停尖叫，也不停反抗。忽然，火刑柱上传来一阵阵临死前的惨叫，压过了一切声音。国王从疯狂挣扎的姑娘们望向火焰，随即转过身，把惨白的脸贴在墙上，再也不肯看。
        - id: ch04-b14
          speaker: prince_edward
          text: 方才那一刻看见的一切，永远不会从我的记忆里消失。直到我死，我会日日看见它，夜夜梦见它。但愿上帝早让我瞎了眼！
          emotion: sad
        - id: ch04-b15
          speaker: narrator
          text: 亨顿一直观察着国王，心里反而十分满意。他以为孩子的病正在好转，性情也变温和了。照国王从前的样子，他早该对恶徒大发雷霆，宣称自己是国王，再命令所有人毫发无伤地释放两个女人。
        - id: ch04-b16
          speaker: narrator
          text: 亨顿相信，那场妄想很快便会过去，孩子可怜的心智也会恢复健全。他只求上帝让这一天早些到来。
    - id: ch05
      title: 残酷的法律
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 当天，又有几个囚犯被押进来过夜。他们正由守卫押往王国各地，要在那里为自己犯下的所谓罪行受刑。国王从一开始便拿定主意，只要机会出现，就要询问囚犯，亲自了解他们的遭遇，用这种办法学习怎样履行国王的职责。于是他同这些人一一交谈，而他们的苦难让他心如刀割。
        - id: ch05-b02
          speaker: narrator
          text: 一个神智不全的可怜女人，只从织布匠那里偷了一两码布，便要被绞死。另一个男人曾被指控偷马。由于指控他的证据不足，他原以为自己已经逃过绞索。谁知才刚得到自由，他又被控杀死国王园林里的一头鹿。这一回罪名得到证实，他如今正在被押往绞刑架。
        - id: ch05-b03
          speaker: narrator
          text: 最叫国王难过的是一个商人的学徒。一天傍晚，年轻人捡到一只逃离主人的鹰，以为自己可以留下，便把鹰带回家。法庭却判他犯了盗窃罪，同样要处死他。
        - id: ch05-b04
          speaker: narrator
          text: 国王听得怒不可遏。他要亨顿立刻越狱，跟他飞奔到威斯敏斯特。只要他重新登上王位，便会伸出仁慈的权杖，救下这些不幸的人。
        - id: ch05-b05
          speaker: miles_hendon
          text: 可怜的孩子。这些悲惨故事又让他的病发作了。唉，要不是遭逢这场祸事，他原本很快就会痊愈。
        - id: ch05-b06
          speaker: narrator
          text: 囚犯中还有一位老律师。他面容坚毅，神色毫不畏惧。三年前，他写了一本反对大法官的小册子，公开指责对方办事不公。为此，他被押上颈手枷示众，双耳遭到割除，律师资格也被剥夺。不仅如此，他还被罚款三千英镑，并判处终身监禁。
        - id: ch05-b07
          speaker: narrator
          text: 最近，他又犯下了同一种所谓的罪行。新的判决是割掉耳朵剩余的部分，罚款五千英镑，在两边脸颊上烙印，再让他一辈子留在监牢。
        - id: ch05-b08
          speaker: old_lawyer
          text: 这些都是光荣的伤疤。
        - id: ch05-b09
          speaker: narrator
          text: 老律师说着，把灰白头发往后一拨，露出残缺的耳根。那里从前长着他的两只耳朵。
        - id: ch05-b10
          speaker: narrator
          text: 国王眼中燃起愤怒的火焰。
        - id: ch05-b11
          speaker: prince_edward
          text: 没有人相信我，你也不会相信。不过没关系，不出一个月，你就会重获自由。那些羞辱了你，也玷污了英格兰名声的法律，会从法典里一扫而空。
        - id: ch05-b12
          speaker: prince_edward
          text: 这个世界出了错。君王有时应当到自己的法律那里去上学，这样才能懂得仁慈。
