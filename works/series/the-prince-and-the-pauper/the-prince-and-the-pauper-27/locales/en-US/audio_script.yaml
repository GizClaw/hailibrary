  chapters:
    - id: ch01
      title: In Prison
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Every cell was full, so Edward and Hendon were chained in a large room used for people accused of minor offenses. About twenty other prisoners were packed in with them, men and women of all ages, all in chains. They were a loud and filthy company. Edward burned with anger at this insult to his royal person, while Hendon sat silent and gloomy. He had come home like a joyful wanderer, sure that everyone would celebrate his return. Instead, they had turned their backs on him and thrown him into jail. He could not decide whether it was tragic or ridiculous. It felt as if he had danced out to see a rainbow and been struck by lightning.
        - id: ch01-b02
          speaker: narrator
          text: >-
            In time, Hendon's troubled thoughts began to settle, and then he could think of nothing but Edith. Again and again, he considered her behavior from every side. Had she known him, or had she not? Nothing he remembered gave him a satisfying answer. After wrestling with the question for a long while, he became convinced that she had recognized him and denied him for reasons of her own advantage. In his bitterness, he wanted to pile curses upon her name. Yet that name had been sacred to him for so long that even now he could not bring himself to speak against it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Hendon and Edward spent a miserable night wrapped in prison blankets that were dirty and torn. The jailer accepted a bribe and brought liquor to some of the prisoners. The result came quickly. They sang filthy songs, shouted, fought, and drank deep into the night. A little after midnight, one man turned on a woman and beat her over the head with his manacles. He nearly killed her before the jailer came to her rescue. The jailer restored order by clubbing the attacker hard across the head and shoulders. At last, the revelry stopped. After that, everyone had a chance to sleep, if they could bear the moans and groans of the two wounded people.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The next week passed with dreary sameness. By day, men whose faces Hendon half remembered came to stare at the so-called impostor, deny that they knew him, and heap insults on him. By night, the drinking and brawling began again. At last, something changed. The jailer brought an old man into the room and ordered him to look around.
        - id: ch01-b05
          speaker: jailer
          text: >-
            The villain is somewhere in here. Use those old eyes of yours and tell me which man he is.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Hendon looked up and felt his first moment of pleasure since entering the jail. The visitor was Blake Andrews, who had served Hendon's father all his life. He had always been an honest man with a good heart. Then Hendon remembered how everyone else had betrayed him.
        - id: ch01-b07
          speaker: miles_hendon
          text: >-
            He will know me. Then he will deny me like all the rest.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The old servant studied every face in the room before speaking.
        - id: ch01-b09
          speaker: blake_andrews
          text: >-
            I see nothing here but worthless rogues and street scum. Which one do you mean?
        - id: ch01-b10
          speaker: narrator
          text: >-
            The jailer laughed and pointed Hendon out.
        - id: ch01-b11
          speaker: jailer
          text: >-
            Here he is. Look this great brute over and give me your judgment.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Andrews came closer and examined Hendon for a long time. Then he shook his head.
        - id: ch01-b13
          speaker: blake_andrews
          text: >-
            Why, this man is not Hendon. He never was.
        - id: ch01-b14
          speaker: jailer
          text: >-
            Right! Your old eyes still work. If I were Sir Hugh, I would take this shabby fellow and—
        - id: ch01-b15
          speaker: narrator
          text: >-
            The jailer rose on his toes as though a rope had lifted him and made a choking sound. Andrews answered with convincing spite.
        - id: ch01-b16
          speaker: blake_andrews
          text: >-
            He should thank God if hanging is the worst he gets. Put him in my hands, and I would roast the villain alive!
        - id: ch01-b17
          speaker: narrator
          text: >-
            The jailer gave a laugh like a pleased hyena.
        - id: ch01-b18
          speaker: jailer
          text: >-
            Tell him exactly what you think, old man. Everyone does. You will find it fine entertainment.
        - id: ch01-b19
          speaker: narrator
          text: >-
            He wandered back to his little room and disappeared. At once, Andrews dropped to his knees and whispered.
        - id: ch01-b20
          speaker: blake_andrews
          text: >-
            Thank God you have come home, my master! For seven years I believed you dead, and here you are alive. I knew you the instant I saw you. It was hard work keeping my face still and pretending I saw only cheap rogues and street rubbish. I am old and poor, Sir Miles, but give the word and I will go out and tell the truth, even if they strangle me for it.
        - id: ch01-b21
          speaker: miles_hendon
          text: >-
            No, you must not. It would destroy you and do little to help me. But I thank you. You have given me back some of the faith I had lost in my fellow men.
        - id: ch01-b22
          speaker: narrator
          text: >-
            From then on, the old servant was a great help to Hendon and Edward. Several times each day, he came in pretending to abuse Hendon. Each visit brought a few small delicacies hidden from the jailer, along with the latest news from outside. Hendon saved every good morsel for Edward. The boy could not force himself to eat the jailer's coarse, miserable food and might not have survived without the treats. Andrews had to keep every visit short so no one would suspect him. Even then, he found a clever way to say a great deal. He whispered the true information for Hendon, then suddenly raised his voice and called him insulting names for the benefit of anyone else who might be listening.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Piece by piece, the family story emerged. Arthur had died six years earlier. That loss, along with the long absence of any news from Miles, had ruined Sir Richard's health. He came to believe that he was dying, and he wanted to see Hugh and Edith settled in marriage before he went. Edith pleaded hard for more time because she still hoped Miles would return. Then the letter arrived with news that Miles was dead. The shock left Sir Richard helpless. Certain that his end was close, he and Hugh insisted on the marriage. Edith begged for one month's delay and received it. Then she gained another month, and finally a third. When there could be no more delay, the wedding took place beside Sir Richard's deathbed.
        - id: ch01-b24
          speaker: narrator
          text: >-
            The marriage was not happy. People whispered that soon after the wedding, Edith had found several rough, unfinished versions of that fatal letter among Hugh's papers. She accused him of forging it to hurry the marriage and even Sir Richard's death. Stories of Hugh's cruelty toward Edith and the servants could be heard everywhere. Once his father was dead, Hugh dropped every gentle disguise. He became merciless to anyone who depended on him or his lands for bread.
        - id: ch01-b25
          speaker: narrator
          text: >-
            One piece of Andrews's gossip caught Edward's attention at once.
        - id: ch01-b26
          speaker: blake_andrews
          text: >-
            People say the King is mad. But please do not tell anyone you heard it from me. They say a man can die for speaking of it.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Edward glared at the old man.
        - id: ch01-b28
          speaker: edward_tudor
          text: >-
            The King is not mad, good man. You would do well to mind matters closer to you and leave this treasonous gossip alone.
          emotion: angry
        - id: ch01-b29
          speaker: blake_andrews
          text: >-
            What does the boy mean by that?
        - id: ch01-b30
          speaker: narrator
          text: >-
            The sharp attack from such an unexpected quarter startled Andrews. Hendon gave him a warning sign, so he let the question go and continued with his news.
        - id: ch01-b31
          speaker: blake_andrews
          text: >-
            The late King will be buried at Windsor in a day or two, on the sixteenth. The new King will be crowned at Westminster on the twentieth.
        - id: ch01-b32
          speaker: edward_tudor
          text: >-
            First they will have to find him. But they will see to that, and so shall I.
        - id: ch01-b33
          speaker: blake_andrews
          text: >-
            In the name of—
        - id: ch01-b34
          speaker: narrator
          text: >-
            Another sign from Hendon stopped him. Andrews returned to his report.
        - id: ch01-b35
          speaker: blake_andrews
          text: >-
            Sir Hugh is going to the coronation with great hopes. He expects to come home a peer because the Lord Protector favors him highly.
        - id: ch01-b36
          speaker: edward_tudor
          text: >-
            What Lord Protector?
        - id: ch01-b37
          speaker: blake_andrews
          text: >-
            His Grace, the Duke of Somerset.
        - id: ch01-b38
          speaker: edward_tudor
          text: >-
            What Duke of Somerset?
        - id: ch01-b39
          speaker: blake_andrews
          text: >-
            There is only one. Seymour, the Earl of Hertford.
        - id: ch01-b40
          speaker: edward_tudor
          text: >-
            Since when has he been a duke and Lord Protector?
        - id: ch01-b41
          speaker: blake_andrews
          text: >-
            Since the last day of January.
        - id: ch01-b42
          speaker: edward_tudor
          text: >-
            And who made him so?
        - id: ch01-b43
          speaker: blake_andrews
          text: >-
            He and the Great Council did it, with the King's help.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Edward started violently.
        - id: ch01-b45
          speaker: edward_tudor
          text: >-
            The King? What king do you mean, good sir?
          emotion: surprised
        - id: ch01-b46
          speaker: blake_andrews
          text: >-
            What king? What is wrong with the boy? We have only one. His sacred Majesty, King Edward the Sixth, whom God preserve! He is a dear and gracious little lad too. Mad or not, and they say he improves each day, everyone praises him. People bless him and pray he may rule England for many years. He began mercifully by saving the old Duke of Norfolk's life. Now he means to destroy the cruelest laws that torment and oppress the people.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Edward was too amazed to speak. He sank into such a dark and miserable reverie that he heard no more of Andrews's gossip. Was this little lad the beggar boy he had left at the palace dressed in royal clothes? That seemed impossible. The boy could wear a prince's clothes, but how could he pass himself off as the Prince of Wales? His speech and manners would surely expose him. The court would drive him out at once, and then everyone would search for the true prince.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Could the court have chosen some young noble and placed him on the throne instead? No, Edward decided. His uncle was too powerful to permit such a thing, and he would crush any movement behind it. The boy's thoughts brought him no closer to an answer. The harder he tried to solve the mystery, the more tangled it became. His head hurt more, he slept worse, and each hour increased his desperate need to reach London. Soon, he could hardly endure another moment of captivity.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Nothing Hendon tried could comfort him. Two women chained nearby had better success. Their gentle care brought Edward some peace and taught him patience. He grew deeply grateful and came to love them. Their presence soothed him. When he asked why they had been imprisoned, they told him they were Baptists. Edward smiled.
        - id: ch01-b50
          speaker: edward_tudor
          text: >-
            Can they truly put you in prison for that? I am sorry I must lose you, but they cannot keep you long over such a small matter.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Neither woman answered. The look on their faces made him uneasy, and he pressed them eagerly.
        - id: ch01-b52
          speaker: edward_tudor
          text: >-
            Why are you silent? Please tell me there is no other punishment. Tell me there is nothing more to fear.
          emotion: fearful
        - id: ch01-b53
          speaker: narrator
          text: >-
            They tried to speak of something else, but Edward's fear had awakened. He would not let the question go.
        - id: ch01-b54
          speaker: edward_tudor
          text: >-
            Will they whip you? No, they could not be so cruel. Say they will not. They will not, will they?
          emotion: fearful
        - id: ch01-b55
          speaker: narrator
          text: >-
            The women looked distressed and confused. At last, one of them answered in a voice choked with feeling.
        - id: ch01-b56
          speaker: baptist_woman
          text: >-
            Oh, gentle child, you will break our hearts. God will help us bear our—
          emotion: sad
        - id: ch01-b57
          speaker: edward_tudor
          text: >-
            You have admitted it! Then those stone-hearted villains will whip you. Please, do not cry. I cannot bear it. Be brave. In time I will regain my rightful place, and I will save you from this bitter punishment. I promise I will.
          emotion: angry
        - id: ch01-b58
          speaker: narrator
          text: >-
            When Edward woke the next morning, the women were gone.
        - id: ch01-b59
          speaker: edward_tudor
          text: >-
            They are free!
          emotion: happy
        - id: ch01-b60
          speaker: edward_tudor
          text: >-
            But now I have lost the friends who comforted me.
          emotion: sad
        - id: ch01-b61
          speaker: narrator
          text: >-
            Each woman had pinned a scrap of ribbon to his clothes as a token of remembrance. Edward said he would keep them always. Soon, he promised, he would find his dear friends and place them under his protection.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Just then, the jailer entered with several assistants and ordered the prisoners taken into the jail yard. Edward was delighted at the thought of blue sky and fresh air again. The officers moved far too slowly for him, but his turn came at last. They freed him from the iron ring that held his chain and ordered him to follow the others with Hendon.
        - id: ch01-b63
          speaker: narrator
          text: >-
            The prison yard was paved with stone and open to the sky. The prisoners passed beneath a massive stone arch and were lined up with their backs against the wall. A rope separated them from the open yard, and officers stood guard. It was a cold, gloomy morning. A light snow had fallen during the night, whitening the great empty space and making it more dismal still. Now and then, a winter wind swept through and spun the snow this way and that.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Two women stood in the center of the yard, chained to posts. One glance told Edward they were his friends. He shuddered.
        - id: ch01-b65
          speaker: edward_tudor
          text: >-
            They were not freed after all. I thought they had been saved, but now these good women must feel the whip here in England. That is the shame of it. This is not some heathen land. It is Christian England. They treated me kindly and gave me comfort, yet I must stand here and watch this terrible wrong. How strange that I am the source of power across this whole kingdom, yet I cannot protect them. But these villains had better beware. The day will come when I demand a heavy price for this deed. For every blow they strike now, they will feel a hundred.
          emotion: angry
        - id: ch01-b66
          speaker: narrator
          text: >-
            A great gate swung open, and a crowd of citizens poured into the yard. They rushed around the women until Edward could no longer see either prisoner. A clergyman came through the gate, passed into the crowd, and disappeared from view as well. Edward could hear voices going back and forth, as if someone were asking questions and receiving answers, but he could not make out a single word. Then came a great deal of movement and preparation. Officials kept passing through the far side of the crowd. As they worked, the voices died away, and a deep silence slowly settled over everyone.
        - id: ch01-b67
          speaker: narrator
          text: >-
            At a command, the crowd parted. The sight before Edward froze him to the bone. Bundles of wood had been piled around the two women, and a kneeling man was setting them alight.
        - id: ch01-b68
          speaker: narrator
          text: >-
            The women bowed their heads and covered their faces. Yellow flames began climbing through the snapping wood, and blue smoke streamed away on the wind. The clergyman raised his hands and began to pray. At that moment, two young girls rushed through the gate, screaming. They threw themselves upon the women at the stakes.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Officers tore both girls away and held one fast. The other broke free.
        - id: ch01-b70
          speaker: young_girl
          text: >-
            I will die with my mother!
          emotion: fearful
        - id: ch01-b71
          speaker: narrator
          text: >-
            Before anyone could stop her, she wrapped her arms around her mother's neck again. The officers dragged her away once more, but now her gown was burning. Two or three men held her while someone ripped off the burning cloth and threw it aside. She fought them all the while.
        - id: ch01-b72
          speaker: young_girl
          text: >-
            I will be all alone now! Please let me die with my mother!
          emotion: fearful
        - id: ch01-b73
          speaker: narrator
          text: >-
            Both girls kept screaming and fighting to break free. Then their cries were drowned beneath a burst of heart-piercing screams of mortal agony from the stakes. Edward looked from the frantic girls back to the women in the flames. What he saw was enough. He turned away, pressed his ashen face against the prison wall, and would look no more.
        - id: ch01-b74
          speaker: edward_tudor
          text: >-
            What I saw in that one moment will never leave my memory. I will see it every day and dream of it every night until I die. Would God I had been blind!
          emotion: sad
        - id: ch01-b75
          speaker: narrator
          text: >-
            Hendon watched Edward and felt satisfied by what he saw.
        - id: ch01-b76
          speaker: miles_hendon
          text: >-
            His sickness is improving. He has changed and grown gentler. Before now, he would have raged at those villains, declared himself King, and ordered them to release the women unharmed. Soon this delusion will fade away, and his poor mind will be whole again. May that day come quickly.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Later that same day, several prisoners arrived to spend the night. They were traveling under guard to different parts of the kingdom, where each would receive punishment for a crime. Edward spoke with them one by one. From the beginning of his wanderings, he had questioned prisoners whenever he had the chance. He meant to learn from them what a king needed to know about his own justice. Now, as these new prisoners told him why they had been condemned, every tale of suffering wrung his heart.
        - id: ch01-b78
          speaker: narrator
          text: >-
            One was a poor woman whose mind was clouded. She had stolen a yard or two of cloth from a weaver, and for that she was going to be hanged. Another was a man accused of stealing a horse. He said the evidence had failed, so he thought he had escaped the rope. But as soon as he was free, they charged him with killing a deer in the King's park. That charge was proved, and now he too was going to the gallows.
        - id: ch01-b79
          speaker: narrator
          text: >-
            The case of a tradesman's apprentice troubled Edward most of all. One evening, the young man found a hawk that had escaped from its owner. He took it home, believing he had a right to keep it. The court called that theft and sentenced him to die.
        - id: ch01-b80
          speaker: narrator
          text: >-
            These inhuman punishments filled Edward with fury. He wanted Hendon to break out of the jail with him at once and flee to Westminster. Once there, Edward would mount his throne and hold out his royal scepter in mercy over these unfortunate people. He would stop the punishments and save their lives. Hendon listened to this plan and sighed.
        - id: ch01-b81
          speaker: miles_hendon
          text: >-
            Poor child. These sorrowful stories have brought his illness back. If not for this misfortune, he might have been well very soon.
          emotion: sad
        - id: ch01-b82
          speaker: narrator
          text: >-
            One of the prisoners was an old lawyer with a strong face and a fearless manner. His punishment had begun three years earlier, after he wrote a pamphlet accusing the Lord Chancellor of injustice. For speaking out, his ears had been cut off while he stood in the pillory. The authorities had also expelled him from the legal profession, fined him three thousand pounds, and sentenced him to remain in prison for the rest of his life.
        - id: ch01-b83
          speaker: narrator
          text: >-
            Recently, he had committed the same offense again. Now he was condemned to lose what little remained of his ears, pay another fine of five thousand pounds, be branded on both cheeks, and stay in prison for the rest of his life.
        - id: ch01-b84
          speaker: old_lawyer
          text: >-
            These are honorable scars.
        - id: ch01-b85
          speaker: narrator
          text: >-
            He pushed back his gray hair and showed the mutilated remains of his ears. Edward's eyes burned with anger.
        - id: ch01-b86
          speaker: edward_tudor
          text: >-
            No one believes that I am King, and neither will you. It does not matter. Within a month, you will be free. More than that, the laws that dishonored you and shamed the name of England will be swept from the law books. The world is badly made. Sometimes kings should study their own laws, so they may learn mercy.
          emotion: angry
