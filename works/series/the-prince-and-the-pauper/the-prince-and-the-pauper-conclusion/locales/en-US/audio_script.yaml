audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently ironic
        timbre: clear and resonant
        pace: measured
        pitch: medium
    lady_edith:
      display_name: Lady Edith
      tts:
        delivery: dignified, sorrowful, and carefully controlled
        timbre: graceful and clear
        pace: measured
        pitch: medium
    prince_edward:
      display_name: Prince Edward
      tts:
        delivery: proud, fiery, and resolute
        timbre: bright and firm
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Conclusion. Justice and retribution.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            In time, every mystery was cleared up. Hugh Hendon himself confessed why Lady Edith had denied knowing Miles that day at Hendon Hall. Hugh had ordered her to do it. He had warned that if she admitted the stranger was Miles Hendon, and would not hold firmly to her denial, he would have her killed.
        - id: ch01-b02
          speaker: lady_edith
          text: >-
            Then take my life. It means nothing to me. I will not deny that he is Miles.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Hugh changed his threat. He promised to spare Edith, but said he would have Miles murdered instead. That changed everything. To save Miles, Edith gave Hugh her word. Then she kept it.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Hugh was never brought to trial for those threats, or for taking his brother's title and estates. Neither Edith nor Miles would speak against him. And in those days, Edith would not have been allowed to testify even if she had wished to. Hugh abandoned her and fled across the sea to the continent. He died there not long afterward. In due course, Miles became the Earl of Kent and married Hugh's widow. When Miles and Edith first returned to Hendon Hall together, the whole village celebrated with grand rejoicing.
        - id: ch01-b05
          speaker: narrator
          text: >-
            As for Tom Canty's father, no one ever heard of him again.
        - id: ch01-b06
          speaker: narrator
          text: >-
            King Edward did not forget the people whose suffering he had seen. He found the farmer who had been branded and sold into slavery. The man had fallen into a life of crime with the Ruffler's gang, but Edward rescued him and helped him earn a comfortable living.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Edward also freed the old lawyer from prison and canceled his fine. He found good homes for the daughters of the two Baptist women he had watched burn at the stake. And he punished the official who had ordered Miles Hendon to be whipped when Miles had done nothing to deserve it.
        - id: ch01-b08
          speaker: narrator
          text: >-
            He saved two people from the gallows. One was the boy who had caught a stray falcon. The other was the woman who had stolen a scrap of cloth from a weaver. But he could not save everyone. He learned too late about the man condemned for killing a deer in the royal forest.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Edward remembered the justice who had shown him pity when everyone believed he had stolen a pig. The King rewarded that kindness. He had the pleasure of watching the justice win the public's respect and become a great and honored man.
        - id: ch01-b10
          speaker: narrator
          text: >-
            For the rest of his life, Edward loved to tell the full story of his adventures. He began with the hour when the palace guard struck him and drove him from the gate. He went on until that last midnight, when he slipped among a crowd of workmen hurrying into the Abbey. There he climbed into the Confessor's tomb, hid himself, and fell asleep. The next day, he slept so long that he almost missed the Coronation.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The King said he repeated that precious lesson for a reason. Telling it kept him determined to turn what he had learned into help for his people. As long as he lived, he meant to keep those sorrowful sights fresh in his memory, so that pity would keep rising in his heart.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Miles Hendon and Tom Canty remained the King's favorites through his short reign. When Edward died, both mourned him sincerely. Miles had too much good sense to misuse his unusual right to sit in the sovereign's presence. Even so, he used it twice more before his own death. The first time was when Queen Mary came to the throne. The second was when Queen Elizabeth became queen.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Later, one of Miles's descendants claimed the same right when James the First became king. Nearly twenty-five years passed before that man's son chose to use it. By then, most people had forgotten the privilege of the Kents. So when the Earl of Kent walked before Charles the First and his court, then calmly sat down in the King's presence to preserve his family's right, he caused a tremendous stir. The matter was soon explained, and the right was confirmed.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The last Earl in that family line fought for the King during the wars of the Commonwealth, and he fell in battle. With him, the strange privilege came to an end.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Tom Canty lived to be very old. In time, he became a handsome, white-haired gentleman with a serious and kindly face. People honored him for as long as he lived, and they treated him with deep respect. His remarkable clothes always reminded them that he had once been royal. Whenever he appeared, the crowd opened a path before him. People whispered to one another that the King's Ward was passing and told each other to take off their hats. Tom answered their salute with his gentle smile. They treasured that smile, because his life had been an honorable one.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Poor King Edward the Sixth lived only a few more years, but he lived them worthily. More than once, a powerful noble in splendid dress argued against the King's mercy. Such men would insist that a law Edward wanted to change was gentle enough. They claimed it caused no suffering or oppression worth troubling over. Then the young King would turn his great, compassionate eyes upon the speaker. Those eyes spoke sadly before he answered.
        - id: ch01-b17
          speaker: prince_edward
          text: >-
            What do you know of suffering and oppression? My people and I know them. You do not.
        - id: ch01-b18
          speaker: narrator
          text: >-
            For such cruel times, Edward the Sixth ruled with extraordinary mercy. And now, as we say goodbye to him, let us remember that mercy and give him the honor it deserves.
