audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华王子
      tts:
        delivery: 骄傲刚烈，意志坚定，带着君王的威严
        timbre: 清亮坚实
        pace: 明快
        pitch: 中高
  chapters:
    - id: ch01
      title: 谜团揭晓
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            所有谜团终于澄清了。休·亨顿亲口招认，那天在亨顿庄园，是他逼伊迪丝否认迈尔斯的身份。他把话说得明明白白。她若不肯一口咬定那人不是迈尔斯，休就要她的命。伊迪丝回答，命可以拿去，她绝不会抛弃迈尔斯。休见这威胁无用，便说可以饶她不死，却要派人刺杀迈尔斯。这就不同了。为了救迈尔斯，她只好答应，也确实守住了诺言。
        - id: ch01-b02
          speaker: narrator
          text: >-
            可休并没有因为威胁妻子、侵占兄长的产业和爵位而受审。伊迪丝和迈尔斯都不肯出庭指证他。况且按照当时的法律，伊迪丝即使愿意，也没有资格这样做。后来，休抛下妻子，逃到欧洲大陆，不久便死了。又过了一段日子，肯特伯爵娶了伊迪丝。两人婚后第一次回亨顿庄园时，全村都在欢庆，好不热闹。
        - id: ch01-b03
          speaker: narrator
          text: 从那以后，汤姆·康蒂的父亲再也没有消息。
    - id: ch02
      title: 国王的仁慈
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            国王没有忘记一路上见过的苦难。他找到了那个受过烙刑、又被卖为奴隶的农夫，把人从“首领”匪帮的罪恶生活中救出来，还替他安排了一条能安稳度日的生路。
        - id: ch02-b02
          speaker: narrator
          text: >-
            那位年老的律师也被国王救出监牢，罚金一笔勾销。他还替那两个被烧死在火刑柱上的浸礼派妇人的女儿找到了良好的住处。至于那个无缘无故鞭打迈尔斯·亨顿的官吏，则受到了严厉惩处。
        - id: ch02-b03
          speaker: narrator
          text: >-
            有个男孩只因捉住一只走失的猎鹰，就要被送上绞刑架。还有一个女人，因为从织工那里偷了一块零头布，也被判了死刑。国王及时救下了他们。可是另一个男人，只因猎杀王家森林里的鹿而获罪，国王赶到时已经太迟，没能保住他的性命。
        - id: ch02-b04
          speaker: narrator
          text: >-
            国王被当成偷猪贼的时候，一位治安法官曾经同情他。如今，他便格外眷顾这位法官。后来，那人越来越受百姓敬重，终于成为声望卓著、人人尊崇的大人物。国王亲眼看见这一切，心里十分欣慰。
    - id: ch03
      title: 故事与特权
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            国王在世时，总爱一遍又一遍地讲自己的历险。他从宫门口说起，讲那个卫兵怎样一巴掌把他赶走。接着一路讲到最后的深夜。他混进匆匆赶路的工匠中间，悄悄溜进大教堂，又爬进忏悔王的墓里藏好。第二天，他一觉睡了太久，差一点连自己的加冕礼都错过了。
        - id: ch03-b02
          speaker: narrator
          text: >-
            爱德华说，这段经历给了他一堂珍贵的课。时常把故事重新讲一遍，他才能坚定心意，照着从中学到的道理去做，让百姓真正得到好处。所以，只要生命还没有结束，他就要继续讲下去。那些悲惨的景象必须常留在记忆里，他心中怜悯的泉源也不能枯竭。
        - id: ch03-b03
          speaker: narrator
          text: >-
            在爱德华短暂的统治中，迈尔斯·亨顿和汤姆·康蒂一直深得宠爱。国王去世后，两人也都真心为他哀悼。善良的肯特伯爵很有分寸，并不滥用那项奇特的特权。我们从前见过他在国王面前坐下。那以后直到离世，他只又坐过两次。一回是在玛丽女王即位时，另一回是在伊丽莎白女王即位时。
        - id: ch03-b04
          speaker: narrator
          text: >-
            后来，他的一名后人在詹姆斯一世即位时也行使了这项权利。再等到那人的儿子想要照做，将近四分之一个世纪已经过去。大多数人早已忘了“肯特家族的特权”。所以，当时的肯特伯爵来到查理一世和满朝臣僚面前，径直在君王面前坐下时，宫廷里顿时大乱。好在缘由很快解释清楚，这项权利也重新得到确认。
        - id: ch03-b05
          speaker: narrator
          text: >-
            这个家族最后一位伯爵在英国内战中为国王而战，最终死在战场上。那项奇特的特权，也就和他一起消失了。
    - id: ch04
      title: 告别爱德华
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            汤姆·康蒂活到了很老。他晚年相貌堂堂，白发苍苍，神情庄重又慈祥。只要他还活着，人们就始终敬重他，甚至对他心怀崇敬。因为他一直穿着那身醒目而独特的服装，谁看见了都会记起，这个人从前做过国王。
        - id: ch04-b02
          speaker: narrator
          text: >-
            无论汤姆走到哪里，人群都会向两旁让开。大家彼此提醒，快脱下帽子，这是国王的受监护人。于是人人都向他致敬，汤姆则回给他们一个亲切的微笑。人们非常珍惜那个笑容，因为汤姆的一生光明磊落，配得上所有尊荣。
        - id: ch04-b03
          speaker: narrator
          text: >-
            是的，可怜的爱德华六世只活了短短几年，可他没有辜负那些岁月。有时，一位地位显赫的权贵，或是披金戴银的王室臣仆，会反对国王过于宽仁。他们说，国王想要修订的某条法律已经足够温和，并没有造成什么了不得的痛苦和压迫。
        - id: ch04-b04
          speaker: narrator
          text: 这时，年轻的国王总会用那双充满悲悯的大眼睛，忧伤地望着对方。
        - id: ch04-b05
          speaker: prince_edward
          text: 你哪里懂得什么是苦难，什么是压迫？我和我的百姓懂得，你却不懂。
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: >-
            在那个严酷的时代，爱德华六世的统治格外仁慈。如今，我们就要同他告别了。愿我们记住这一点，把这份荣誉归于他。
