  chapters:
    - id: ch01
      title: The Prince a Prisoner
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Miles Hendon held back a smile. He bent close to the King and whispered in his ear.
        - id: ch01-b02
          speaker: miles_hendon
          text: >-
            Easy now, my prince. Watch your tongue. Better still, do not use it at all. Trust me. Everything will come right in the end.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Then Miles remembered something he had almost forgotten. Sir Miles! The boy had made him a knight. It was marvelous how firmly the child's memory held on to every strange and mad fancy. The title itself was empty and foolish. Even so, Miles had earned it, and that meant something. He thought it more honorable to be considered worthy of knighthood in the boy's Kingdom of Dreams and Shadows than to be considered low enough to become an earl in some real kingdom of the world.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The crowd opened for a constable. As the man reached toward the King's shoulder, Hendon stopped him.
        - id: ch01-b05
          speaker: miles_hendon
          text: >-
            Gently, friend. Keep your hand off him. He will go quietly, and I answer for it. Lead the way. We will follow.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The officer went first with the woman and her bundle. Miles and the King came behind them, and the crowd followed at their heels. Edward wanted to resist, but Hendon spoke softly to him.
        - id: ch01-b07
          speaker: miles_hendon
          text: >-
            Think, Sire. Your laws are the wholesome breath of your own royal power. Should the source of those laws resist them while expecting every branch to obey? It seems that one of your laws has been broken. When you sit on your throne again, you will not regret remembering this. While you seemed to be a private citizen, you put aside the King, took the citizen's place, and submitted to the law's authority.
        - id: ch01-b08
          speaker: prince_edward
          text: >-
            You are right. Say no more. Whatever the King of England asks a subject to endure under the law, he will endure himself while he stands in a subject's place.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Before the justice of the peace, the woman swore that the small prisoner was the one who had stolen from her. No one there could show that she was wrong, so the King was found guilty. Then her bundle was opened. Inside lay a plump little pig, already dressed for cooking. The judge looked troubled. Hendon went pale, and a sharp shock of fear ran through his whole body. Edward alone remained unmoved, protected by his ignorance of the law.
        - id: ch01-b10
          speaker: narrator
          text: >-
            After a long and ominous silence, the judge turned to the woman.
        - id: ch01-b11
          speaker: justice
          text: >-
            What do you say this pig is worth?
        - id: ch01-b12
          speaker: woman
          text: >-
            Three shillings and eightpence, your worship. I could not take off a single penny and still give its value honestly.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The justice glanced uneasily at the crowd. Then he nodded to the constable.
        - id: ch01-b14
          speaker: justice
          text: >-
            Empty the court and shut the doors.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Soon only the two officials, the accuser, the accused, and Miles Hendon remained. Miles stood stiff and white. Large drops of cold sweat gathered on his forehead, joined together, and trickled down his face. The judge turned back to the woman and spoke with compassion.
        - id: ch01-b16
          speaker: justice
          text: >-
            The boy is poor and ignorant. Perhaps hunger drove him to it. These are hard times for the unfortunate, and he does not have an evil face. But good woman, do you understand the law? If someone steals a thing worth more than thirteenpence halfpenny, he must hang for it.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The little King started and stared in horror, but he controlled himself and said nothing. The woman could not. She sprang up, trembling with fright.
        - id: ch01-b18
          speaker: woman
          text: >-
            Oh, what have I done? Mercy! I would not have the poor boy hanged for all the world. Please save me from this, your worship. What can I do?
          emotion: fearful
        - id: ch01-b19
          speaker: narrator
          text: >-
            The justice kept his calm judicial manner.
        - id: ch01-b20
          speaker: justice
          text: >-
            You may revise the value, since it has not yet been written in the record.
        - id: ch01-b21
          speaker: woman
          text: >-
            Then call the pig worth eightpence, in God's name. Heaven bless the day that frees my conscience from this terrible thing!
        - id: ch01-b22
          speaker: narrator
          text: >-
            Miles was so delighted that he forgot all proper behavior. He threw his arms around the King and hugged him, surprising Edward and wounding his royal dignity. The grateful woman said her farewells and left with her pig. When the constable opened the door, he followed her into the narrow hall.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The justice began writing in his record book. Miles was always watchful, and he wanted to know why the officer had gone after the woman. He slipped quietly into the dim hall and listened.
        - id: ch01-b24
          speaker: constable
          text: >-
            That is a fat pig. It should make a fine meal. I will buy it from you. Here is eightpence.
        - id: ch01-b25
          speaker: woman
          text: >-
            Eightpence? You will do nothing of the kind! It cost me three shillings and eightpence in good honest money from old King Harry's reign, before anyone could tamper with it. I want none of your eightpence!
        - id: ch01-b26
          speaker: constable
          text: >-
            Is that how matters stand? You were under oath. If the pig is worth more, then you lied when you called it eightpence. Come back before his worship and answer for that crime. Then the boy will hang.
        - id: ch01-b27
          speaker: woman
          text: >-
            There, dear heart, that is enough. I agree. Give me the eightpence, and say nothing more about it.
          emotion: fearful
        - id: ch01-b28
          speaker: narrator
          text: >-
            The woman went away crying over the bargain she had been forced to accept. Hendon slipped back into the courtroom. A little later the constable returned too, after hiding his prize in some convenient place.
        - id: ch01-b29
          speaker: narrator
          text: >-
            The justice wrote for a while longer. Then he gave the King a wise and kindly lecture. Edward would spend a short time in the common jail, followed by a public flogging.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The astonished King opened his mouth. He was probably about to order the good judge beheaded on the spot. Then he caught Hendon's warning signal and managed to close his mouth before any dangerous words escaped.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Miles took him by the hand, bowed to the justice, and followed the constable toward the jail. The moment they reached the street, the furious young monarch stopped and tore his hand away.
        - id: ch01-b32
          speaker: prince_edward
          text: >-
            Fool! Do you imagine I will enter a common jail alive?
          emotion: angry
        - id: ch01-b33
          speaker: narrator
          text: >-
            Hendon bent down and answered rather sharply.
        - id: ch01-b34
          speaker: miles_hendon
          text: >-
            Will you trust me? Be quiet, and do not make our chances worse with dangerous talk. Whatever God wills is going to happen. You cannot hurry it or change it. So wait and be patient. There will be time enough to rage or rejoice once we know what has happened.
