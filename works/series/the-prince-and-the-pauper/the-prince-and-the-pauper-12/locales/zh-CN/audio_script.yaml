audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华亲王
      tts:
        delivery: 高贵坚定，受辱时仍保持尊严
        timbre: 清亮稚嫩
        pace: 从容有力
        pitch: 中高
    miles_hendon:
      display_name: 迈尔斯·亨顿
      tts:
        delivery: 豪爽诙谐，危急时勇敢坚定
        timbre: 洪亮粗粝
        pace: 明快有力
        pitch: 中低
    john_canty:
      display_name: 约翰·坎蒂
      tts:
        delivery: 粗暴凶狠，威胁时咄咄逼人
        timbre: 沙哑浑浊
        pace: 急促
        pitch: 低
  chapters:
    - id: ch01
      title: 第十二章　亲王和他的救命恩人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 迈尔斯·亨顿带着小亲王逃出暴民的包围，立刻穿过偏僻的街巷，朝河边赶去。快到伦敦桥时，他们又一头扎进人海。亨顿牢牢抓住亲王的手腕。不对，从这一刻起，该说是国王的手腕了。那个震动全国的消息早已传开，千百个声音同时在男孩耳边喊着：“国王驾崩了！”这句话像寒气一样钻进小流浪儿的心里，叫他浑身一颤。他终于明白，自己失去了多么重要的人。那个令别人恐惧的暴君，对他却始终温和。眼泪涌出来，四周都模糊了。一瞬间，他觉得自己是世上最孤苦、最无依无靠的人。可紧接着，又一阵雷鸣般的呼声震彻夜空：“爱德华六世国王万岁！”男孩的眼睛亮了，一股骄傲从心头传到指尖。
        - id: ch01-b02
          speaker: prince_edward
          text: 啊，真庄严，也真奇妙——我已经是国王了！
        - id: ch01-b03
          speaker: narrator
          text: 两个人随着人潮，在伦敦桥上慢慢往前挪。这座桥已经站了六百年，也做了六百年喧闹拥挤的通道。它的样子很奇特，很像一座独立的小城。从河岸这头一直到那头，两侧密密排着商店，店铺楼上就是一家家的住处。桥上有客店、啤酒店、面包房、服饰杂货铺、食品市场和各式作坊，甚至还有自己的教堂。它连接着伦敦和萨瑟克，却只把两个邻居当成还过得去的郊区，并不觉得它们有多重要。整座桥城只有一条五分之一英里长的窄街，人口不过一个村子那么多。人人彼此熟识，连对方的父母和家里那些鸡毛蒜皮的小事也知道得一清二楚。这里当然也有名门望族，就是那些世代卖肉、烤面包，在同一间老铺子里住了五六百年的古老人家。他们熟悉大桥从头到尾的历史，也知道所有稀奇传说。他们说桥上的话，想桥上的事，就连撒谎也带着伦敦桥的派头，又长又平，直截了当，结结实实，还显得理直气壮。
        - id: ch01-b04
          speaker: narrator
          text: 这里的人眼界狭窄，孤陋寡闻，却很自负。孩子在桥上出生，在桥上长大，一直活到老死，一辈子也没在伦敦桥以外的世界落过脚。他们自然会觉得，日日夜夜穿过桥街的庞大队伍，连同人群杂乱的叫喊、马嘶、牛吼、羊叫和低沉如雷的脚步，就是世上唯一了不起的景象，而他们多少也算这景象的主人。事实上，他们也真像主人一样经营它。每逢凯旋的国王或英雄经过，让队伍突然添上一时的光彩，桥民便打开自家窗口，收钱让外人观看，而且从不放过这样的机会。毕竟要看一列列行进的队伍，再没有比这里更笔直、更绵长、也更无遮挡的视野了。
        - id: ch01-b05
          speaker: narrator
          text: 生在桥上、长在桥上的人，一到别处便觉得日子无聊空虚，简直没法忍受。史书说，有个桥民七十一岁才离开大桥，搬到乡下养老。可他躺在床上只会烦躁地翻来覆去，怎么也睡不着。那里实在太安静了，那种深沉的寂静叫他痛苦、害怕，又觉得沉重压抑，几乎喘不过气。等他终于被折磨得精疲力竭，已经瘦得像个憔悴的幽灵，只好逃回老家。桥下急流的拍击声，加上桥面隆隆的碰撞和雷鸣般的轰响，反倒成了催眠的乐曲。他终于能平静地躺下，安稳地睡着，又做起了甜美的梦。
        - id: ch01-b06
          speaker: narrator
          text: 那个年代，桥上还为孩子们陈列着英国历史的“实物课”。门楼顶端的铁刺上，挑着一颗颗名人的头颅，已经青灰腐烂。不过，这话扯远了。亨顿住的那家小客店，就在桥上。他带着男孩刚走近门口，一个粗野的声音便迎面砸来。
        - id: ch01-b07
          speaker: john_canty
          text: 哈，你总算滚回来了！这回别想再逃。我要把你浑身骨头揍成肉酱，教你懂点规矩，看你以后还敢不敢叫我们等这么久！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 约翰·坎蒂伸手便要抓男孩。迈尔斯一步挡在两人中间。
        - id: ch01-b09
          speaker: miles_hendon
          text: 别着急，朋友。你下手未免太粗暴了。这孩子跟你是什么关系？
        - id: ch01-b10
          speaker: john_canty
          text: 你既然这么爱插手别人的事，我就告诉你。他是我儿子。
        - id: ch01-b11
          speaker: prince_edward
          text: 他撒谎！
          emotion: angry
        - id: ch01-b12
          speaker: miles_hendon
          text: 说得痛快！孩子，不管你脑子清醒还是糊涂，我都信你。这个卑鄙家伙是不是你父亲，并不重要。只要你愿意留下，我就不会让他照刚才说的那样打你、欺负你。
        - id: ch01-b13
          speaker: prince_edward
          text: 我愿意留下！我不认识他，也厌恶他。要我跟他走，我宁可死！
        - id: ch01-b14
          speaker: miles_hendon
          text: 那就这么定了，没什么可争的。
        - id: ch01-b15
          speaker: john_canty
          text: 定不定还得走着瞧！我非把他抢回去——
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: 坎蒂跨过亨顿，伸手去捉男孩。亨顿按住剑柄，再次拦住了他。
        - id: ch01-b17
          speaker: miles_hendon
          text: 你这会走路的臭肉，敢碰他一下，我就像串鹅一样把你串起来！一群跟你一样的暴民想虐待他，没准还会杀了他，是我把他救下来的。你以为我会在这时候丢开他，让他遭更大的罪吗？说实话，我根本不信你是他父亲。就算你真是，这样的孩子落在你这畜生手里活一辈子，还不如痛快死了。赶紧走。我耐性不多，也不爱跟人没完没了地废话。
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 坎蒂退缩了。他一边咒骂威胁，一边钻进人群，很快不见踪影。亨顿吩咐店家把饭送到楼上，随后领着男孩爬过三层楼梯，进了自己的房间。那里十分寒酸，只有一张破床和几件旧家具，两支病恹恹的蜡烛勉强照亮屋子。小国王饿得发软，也累得快要倒下。他大半个白天和整整一夜都在奔波，如今已是凌晨两三点钟，这期间一口东西也没吃。他拖到床边躺下，声音里满是睡意。
        - id: ch01-b19
          speaker: prince_edward
          text: 饭摆好以后，叫醒我。
        - id: ch01-b20
          speaker: narrator
          text: 他立刻沉沉睡去。亨顿眼里闪过笑意。
        - id: ch01-b21
          speaker: miles_hendon
          text: 凭弥撒起誓，这个小叫花子进了我的房间，占了我的床，竟自在得像这里本来就是他的，连一句“劳驾”也没有。他先前自称威尔士亲王，还真把这个角色从头演到了尾。可怜的小家伙，无亲无友，准是受尽虐待，脑子才出了毛病。好吧，我来当他的朋友。我救了他以后，不知不觉就喜欢上这个嘴硬胆大的小无赖。他面对那群肮脏暴民，像士兵一样毫不畏惧，还敢傲然顶撞他们。现在烦恼被睡眠赶走，这张脸看起来又漂亮，又甜美温柔。我要教导他，治好他的病，做他的兄长，照顾他，保护他。谁敢羞辱他、伤害他，最好先给自己订好裹尸布。哪怕我会因此被烧死，那人也一定用得上！
        - id: ch01-b22
          speaker: narrator
          text: 亨顿俯下身，怜爱地端详男孩。他用宽大的褐色手掌轻拍那张小脸，又把蓬乱的卷发向后理好。男孩微微打了个寒战。
        - id: ch01-b23
          speaker: miles_hendon
          text: 看我干的好事，竟让他什么也不盖，就这样躺着，非受寒生病不可。可要把他抱进被窝，又会惊醒他。他实在太需要睡一觉了。
        - id: ch01-b24
          speaker: narrator
          text: 房里找不到多余的被褥，亨顿只好脱下自己的紧身上衣，裹住男孩。他说自己早已习惯寒风和单衣，不在乎这点冷，随后便在屋里来回走动，好让身上保持暖和，嘴里仍不停地琢磨。
        - id: ch01-b25
          speaker: miles_hendon
          text: 他受伤的脑子认定自己是威尔士亲王。如今真正的亲王已成了国王，我们身边却还留着一个威尔士亲王，倒真奇怪。这颗可怜的脑袋只守着一个念头，想不到现在该改口称自己是国王了。我被关在异国牢里七年，一直没有家乡的消息。若父亲还活着，他会看在我的情面上收留这个孩子。善良的大哥亚瑟也会。至于弟弟休，那个狠心又坏脾气的狐狸，要是敢阻拦，我就打破他的脑袋！对，我们马上去亨顿庄园。
        - id: ch01-b26
          speaker: narrator
          text: 仆人送来热气腾腾的饭菜，放到一张松木小桌上，又摆好椅子，便让这两个付不起大价钱的客人自己伺候自己。门在他身后砰地关上，男孩猛然惊醒，坐起来高兴地看了看四周。很快，悲伤又回到脸上。他深深叹了口气，说原来只是一场梦。接着，他发现身上盖着亨顿的紧身上衣，也明白了对方为自己作出的牺牲。
        - id: ch01-b27
          speaker: prince_edward
          text: 你待我很好，真的很好。把衣服拿回去穿上吧，我已经不需要了。
        - id: ch01-b28
          speaker: narrator
          text: 男孩起身走到墙角的盥洗架前，站在那里等着。亨顿兴冲冲地招呼他来大吃一顿，说饭菜样样香喷喷、热腾腾，吃饱以后，再加上刚才那场好觉，他很快又会精神起来。男孩却不答话，只用沉静的目光看着这个佩剑的高个子武士。那眼神既郑重又诧异，还透着一点不耐烦。亨顿完全弄不明白，只好问他怎么了。
        - id: ch01-b29
          speaker: prince_edward
          text: 好先生，我要洗手洗脸。
        - id: ch01-b30
          speaker: miles_hendon
          text: 哦，原来只是这个！你想做什么，不必向我请示。屋里的一切随你取用，千万别客气。
        - id: ch01-b31
          speaker: narrator
          text: 男孩还是站着不动，还用小脚不耐烦地点了两下地板。亨顿越发糊涂，又问他到底想要什么。
        - id: ch01-b32
          speaker: prince_edward
          text: 请你替我倒水，别说这么多废话！
        - id: ch01-b33
          speaker: narrator
          text: 亨顿差点放声大笑。他暗暗赞叹这事真有意思，赶忙上前照办。随后，他愣愣地站在一旁，直到男孩催他拿毛巾，才猛然回神，从男孩鼻子底下拿起毛巾递过去。男孩洗完便坐到桌边，准备吃饭。亨顿也麻利地洗了脸，拉开另一把椅子，正要坐下。
        - id: ch01-b34
          speaker: prince_edward
          text: 住手！你怎么敢当着国王的面坐下？
          emotion: angry
        - id: ch01-b35
          speaker: narrator
          text: 这句话把亨顿从头到脚都震懵了。他心想，这孩子的疯病居然也赶上了时势。王国变了天，他的妄想也跟着变，如今已经把自己当成国王。看来只好继续顺着他，否则这孩子没准真要下令把自己关进伦敦塔。亨顿觉得这个念头很好笑，便把椅子搬开，站到国王身后，使出自己懂得的全部宫廷礼数伺候他。国王吃着饭，神情渐渐不再那么严峻。肚子填饱一些以后，他也有了谈兴。
        - id: ch01-b36
          speaker: prince_edward
          text: 如果我没听错，你的名字是迈尔斯·亨顿，对吗？
        - id: ch01-b37
          speaker: miles_hendon
          text: 是，陛下。既然我要顺着这个可怜孩子的疯病，就得好好称他“陛下”，不能只演一半。否则这个角色演坏了，反而会坏了我的好意。
        - id: ch01-b38
          speaker: narrator
          text: 后半截话，迈尔斯只在心里说。国王又喝了一杯酒，身上暖和起来。
        - id: ch01-b39
          speaker: prince_edward
          text: 我想了解你。把你的身世讲给我听。你举止勇武，也有贵族气派。你出身高贵吗？
        - id: ch01-b40
          speaker: miles_hendon
          text: 禀陛下，我们家勉强排在贵族末尾。家父是从男爵，也就是凭骑士役效忠国王的小领主。他叫理查德·亨顿爵士，住在肯特郡蒙克斯霍尔附近的亨顿庄园。
        - id: ch01-b41
          speaker: prince_edward
          text: 我不记得这个名字。继续，把你的故事讲完。
        - id: ch01-b42
          speaker: miles_hendon
          text: 我的故事没什么了不起，眼下没有更好的消遣，或许能替陛下打发小半个钟头。父亲十分富有，为人也很慷慨。母亲在我年幼时就去世了。我有两个兄弟。大哥亚瑟像父亲一样，有一副善良心肠。弟弟休比我小，却卑鄙、贪婪、奸诈、恶毒，专爱暗中害人，简直像条毒虫。他从襁褓里起就是这样。十年前我最后见他时，他十九岁，已经坏透了；我那时二十岁，亚瑟二十二岁。家里还有表妹伊迪丝小姐。她那时十六岁，美丽、温柔又善良，是一位伯爵的女儿，也是那个家族最后的后人，继承着大笔财产和一个无人承袭的爵位。父亲是她的监护人。我和伊迪丝彼此相爱，可她从襁褓时便许配给亚瑟，父亲不准解除婚约。亚瑟心里爱着另一位姑娘，便劝我们不要灰心，要牢牢守住希望。他相信，只要耐心等待，再加上一点运气，总有一天，我们各自的心愿都能实现。
        - id: ch01-b43
          speaker: miles_hendon
          text: 休真正爱的是伊迪丝的财产，嘴上却偏说爱她本人。他一向嘴里说一套，心里想另一套。不过，他那些手段在伊迪丝面前全白费了。他骗不了她，只骗得了父亲。父亲在我们兄弟中最宠他，也最信他，因为他年纪最小，又被其他人厌恶。无论在哪个年代，这两条似乎都足以替一个孩子赢得父母最深的偏爱。再加上他有一张圆滑会哄人的嘴，撒谎的本领又高，正好帮着盲目的宠爱欺骗自己。那时我很放荡，说实话，甚至可以说非常放荡。但那种放荡并不害人。我的过错只伤到自己，没给别人带来羞耻和损失，也没有任何罪恶或卑劣之处，更没有做过有辱自己身份的事。
        - id: ch01-b44
          speaker: miles_hendon
          text: 可休偏偏利用了这些过错。他见亚瑟的身体一直不好，便盼着最坏的事情发生。只要再把我也从路上赶开，他就能从中获利。这个故事太长，也不值得让陛下久听，我简单说吧。他巧妙地夸大我的过错，把它们说成罪行。最后，他在我房里偷偷放了一架丝梯，再假装把它找出来，又买通仆人和其他无赖作假证，让父亲相信我要带伊迪丝私奔，公然违抗他的命令和她成婚。父亲说，把我赶出家门和英格兰三年，可以把我磨炼成军人和男子汉，也教我懂得一些事理。我在欧洲大陆的战争中熬完了这场漫长考验，饱尝打击、困苦和冒险。可在最后一场战斗里，我成了俘虏，随后又在异国地牢中被关了七年。七度寒来暑往，牢门始终没有打开。
        - id: ch01-b45
          speaker: miles_hendon
          text: 最后，我靠机智和勇气逃出牢狱，立即赶回这里。我刚刚抵达，口袋空空，衣衫破旧。至于这七年让亨顿庄园和家里的人发生了什么变化，我更是一无所知。陛下，我这单薄的故事讲完了。
        - id: ch01-b46
          speaker: prince_edward
          text: 他们无耻地迫害了你！我会替你主持公道。我以十字架起誓，一定会。这是国王说的话！
          emotion: angry
        - id: ch01-b47
          speaker: narrator
          text: 迈尔斯的遭遇叫国王满腔激愤。他也打开话匣，把自己近日遭受的种种不幸，从头到尾讲给迈尔斯听。迈尔斯听得十分惊讶，却仍以为这全是男孩的幻想。他心想，这绝不是一颗平庸的脑袋。寻常人无论清醒还是疯癫，都不可能拿一堆凭空捏造的材料，编出这样严整、鲜明又华丽的传奇。这个可怜孩子的脑子虽然受了损伤，只要自己还活着，他就不会缺少朋友和住处。迈尔斯决定让男孩永远留在身边，把他当作宠儿，也当作自己的小伙伴。他还相信男孩一定能治好，一定会彻底恢复健全，将来凭自己的才华闯出名声。到那时，迈尔斯会自豪地告诉别人，自己早在这个无家可归的小流浪儿衣衫褴褛时，就看出了他身上的光彩，也早就断定世人终有一天会听到他的名字。然后，他会把已经成名的男孩指给大家看，问上一句：“瞧见了吗？我当初说得对不对？”
        - id: ch01-b48
          speaker: narrator
          text: 国王沉思了一会儿，语声不急不缓。
        - id: ch01-b49
          speaker: prince_edward
          text: 你救我免受伤害和羞辱，或许还救了我的性命，也就是救了我的王冠。这样的功劳应当重赏。说出你的愿望吧，只要王权能够做到，我都赐给你。
        - id: ch01-b50
          speaker: narrator
          text: 这番异想天开的话把亨顿从遐想中惊醒。他本想向国王道谢，再说自己只是尽了臣民的本分，不需要任何报偿，就此把事情带过。可就在这时，一个更聪明的主意忽然钻进他的脑袋。他请求安静片刻，好好考虑这份慷慨的赏赐。国王郑重地答应了，还说这样重大的事情，本来就不该仓促决定。迈尔斯思索了一会儿，认定除此以外，再没有别的办法能够得到自己需要的东西。这一个钟头的亲身经历已经让他明白，照现在的规矩继续下去，实在又累人又不方便。他庆幸自己没有随口推掉这个难得的机会，随即走到国王面前，单膝跪下。
        - id: ch01-b51
          speaker: miles_hendon
          text: 我的效劳只是臣民理当尽到的本分，所以谈不上功劳。既然陛下仍认为它值得赏赐，我便鼓起勇气，斗胆提出一个请求。近四百年前，陛下想必知道，英格兰国王约翰和法兰西国王结下仇怨，双方决定各派一名勇士到比武场决斗，借所谓上帝的裁决解决争端。两位国王和西班牙国王一同到场观看并作出裁断。法兰西勇士出场以后，我国骑士见他太过可怕，竟然无人敢拿起武器同他交锋。那桩争端十分重大，英格兰国王眼看就要因为无人出场应战而落败。
        - id: ch01-b52
          speaker: miles_hendon
          text: 当时，英格兰臂力最强的德·库尔西勋爵正被剥夺荣誉和财产，囚禁在伦敦塔里。漫长的牢狱生活一点点消磨着他。国王派人请他出战，他答应了，披挂整齐来到比武场。法兰西勇士刚看见他魁梧的身材，又听到他威名赫赫的名字，转身便逃。英格兰不战而胜，法兰西国王也因此输了争端。约翰王恢复了德·库尔西的爵位和财产，还让他说出愿望，哪怕要付出半壁江山也会满足。德·库尔西就像我现在这样跪下，只求自己和后代永远可以在英格兰国王面前不脱帽。国王准了。四百年来，这一家始终没有断绝继承人，所以直到今天，古老家族的主人仍能在国王面前戴着帽子或头盔，不受任何阻拦。除了他，别人谁也没有这项权利。
        - id: ch01-b53
          speaker: miles_hendon
          text: 我借用这个先例，恳请陛下只赐给我一项恩典。这已经远远超过我应得的赏赐，此外我再无所求。请准许我和我的后代，世世代代都能坐在英格兰国王面前！
        - id: ch01-b54
          speaker: narrator
          text: 国王拔出亨顿的剑，神情庄严地为他行了骑士授勋礼。
        - id: ch01-b55
          speaker: prince_edward
          text: 起来吧，迈尔斯·亨顿爵士。起来，坐下。你的请求准了。只要英格兰还在，只要王冠尚存，这项特权就永远不会废止。
        - id: ch01-b56
          speaker: narrator
          text: 国王走到一旁沉思。亨顿立刻坐进桌边的椅子，心里大大松了一口气。他庆幸自己想出了这个妙法，两条疲惫的腿总算得救。要不是想出这项特权，在可怜孩子恢复理智以前，他恐怕得连续站上几个星期。他又觉得，自己竟成了梦幻王国里的骑士，对一个讲究实际的人来说，实在古怪。但他不肯发笑，甚至求上帝不许自己发笑，因为这件事对自己虽然虚无缥缈，对男孩却完全真实。从另一个角度说，它对迈尔斯也并非虚假，因为它真切映出了男孩那颗善良而慷慨的心。他只担心，男孩若在人前用这个堂皇头衔称呼他，那身褪色破烂的衣裳和骑士的荣耀摆在一起，准会形成滑稽的对照。不过，这也没什么。只要男孩高兴，无论叫他什么，迈尔斯都心满意足。
