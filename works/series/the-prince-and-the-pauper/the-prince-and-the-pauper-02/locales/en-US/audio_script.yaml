audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently ironic
        timbre: clear and resonant
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Tom’s early life.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Let us skip ahead a number of years. London was fifteen hundred years old by then, and for its day it was a great city. A hundred thousand people lived there, though some believed the number was twice as high. Its streets were narrow, crooked, and dirty. They were especially bad near London Bridge, in the part of town where Tom Canty lived.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The houses were made of wood. Each upper floor reached farther over the street than the floor below, so the buildings grew wider as they rose. Strong beams crossed their fronts, with plaster filling the spaces between. Owners painted those beams red, blue, or black, giving the houses a striking look. The little windows had diamond-shaped panes and swung outward on hinges, just like doors.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Tom's father lived in a filthy little dead-end called Offal Court, off Pudding Lane. The house was small, decaying, and unsteady, yet it was crammed with desperately poor families. The Cantys had one room on the third floor. Tom's mother and father had something like a bedstead in one corner. Tom, his grandmother, and his twin sisters, Bet and Nan, had the whole floor and could sleep wherever they pleased. There were scraps of one or two blankets and bundles of old, dirty straw, though no one could truly call them beds. Each morning they were kicked into one heap. At night, everyone chose what they could from the pile.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Bet and Nan were fifteen. They were kindhearted girls, but they wore rags, went unwashed, and knew almost nothing. Their mother was much the same. Their father and grandmother were another matter. Those two were fiends. Whenever they could get drink, they got drunk. Then they fought each other or anyone who crossed their path. Drunk or sober, they were always cursing. John Canty stole, and his mother begged. They forced the children to become beggars too, but they never managed to make thieves of them.
        - id: ch01-b05
          speaker: narrator
          text: >-
            One good old priest lived among the dreadful people in that house, though he was nothing like them. The King had driven him from his home and left him a pension worth almost nothing. In secret, Father Andrew would draw the children aside and teach them how to live rightly. He also taught Tom a little Latin, along with reading and writing. He would have taught the girls as well, but they feared their friends would mock them for learning anything so strange.
        - id: ch01-b06
          speaker: narrator
          text: >-
            All of Offal Court was much like the Cantys' house. Nearly every night, drunken shouting, fighting, and disorder went on for hours. A broken head was as common there as an empty stomach. Even so, little Tom was not unhappy. His life was hard, but he did not know it. Every boy in Offal Court lived that way, so Tom supposed it was the proper and comfortable sort of life.
        - id: ch01-b07
          speaker: narrator
          text: >-
            When he returned at night without any money, he knew exactly what would happen. First his father would curse and beat him. Then his terrible grandmother would do it all again, only worse. Much later, his starving mother would creep over and give him any poor scrap or crust she had saved by going hungry herself. Sometimes her husband caught her in that act of betrayal, as he saw it, and beat her badly for it.
        - id: ch01-b08
          speaker: narrator
          text: >-
            No, Tom's life went along well enough, especially in summer. He begged only enough to keep himself out of trouble, because the laws against begging were strict and the punishments were severe. That left him plenty of time to listen to Father Andrew's wonderful old stories. The priest told him about giants and fairies, dwarfs and genies, enchanted castles, and splendid kings and princes.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Tom's mind filled with those marvels. Night after night, he lay in the dark on his small heap of foul straw, tired and hungry, his body still aching from a beating. Then he would set his imagination free. Soon the pain was gone from his thoughts, replaced by delightful pictures of a cherished prince living in a royal palace. Before long, one wish followed him day and night. He wanted to see a real prince with his own eyes. Once he told some boys in Offal Court, but they mocked him so cruelly that after that he kept the dream to himself.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Tom often read the priest's old books and asked Father Andrew to explain them more fully. In time, all that reading and dreaming began to change him. The people in his imagination were so grand that his own ragged clothes and dirt troubled him. He wished he could be clean and better dressed. He still played happily in the mud, of course. But when he splashed in the Thames, he no longer did it only for fun. Now he also valued the chance to wash himself.
        - id: ch01-b11
          speaker: narrator
          text: >-
            There was always something to see near the Maypole in Cheapside or at the fairs. Every so often, Tom and the rest of London could watch soldiers escort some famous unfortunate prisoner to the Tower, either through the streets or by boat. One summer day, Tom saw poor Anne Askew and three men burned at the stake in Smithfield. He also heard a former bishop preach to them, though the sermon did not interest him. Taken altogether, Tom thought his life was varied and pleasant enough.
        - id: ch01-b12
          speaker: narrator
          text: >-
            After a while, his books and dreams of royal life affected him so deeply that he began to act like a prince without even knowing it. His speech became formal and courtly, and so did his manners. His closest friends found this both impressive and amusing. Yet Tom's influence over the other children grew day by day. They began to look up to him with wonder, almost as if he were a higher sort of being. He knew so much. He could say and do such astonishing things. To them, he seemed both wise and mysterious.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The boys carried stories of Tom's words and performances home to their elders. Soon the grown-ups were discussing Tom Canty too, and they came to see him as unusually gifted. They even brought their difficult problems to him. His clever and sensible answers often amazed them. In fact, Tom became a hero to everyone who knew him except his own family. They alone saw nothing remarkable in him.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Before long, Tom secretly created a royal court of his own. He was the prince. His chosen companions became guards, chamberlains, royal attendants, lords and ladies, and members of the royal family. Every day, the make-believe prince was welcomed with elaborate ceremonies that Tom had borrowed from his romantic books. His council debated the great business of their imaginary kingdom, and his false Highness sent out decrees to armies, navies, and distant governors that existed only in their minds.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Afterward, Tom would go out in his rags and beg for a few coins. He would eat his poor crust, suffer the usual blows and insults, then stretch out on his handful of filthy straw. There, in his dreams, he returned to all his empty royal splendor.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Still, his longing to look upon a real, living prince grew stronger with every day and every week. At last, it pushed aside every other wish and became the one great passion of his life.
        - id: ch01-b17
          speaker: narrator
          text: >-
            One January day, Tom set out on his usual begging rounds. For hours he trudged sadly around Mincing Lane and Little Eastcheap, barefoot and freezing. He stared through the windows of cookshops, longing for the terrible pork pies and other deadly creations displayed inside. To Tom, they seemed like food fit for angels. He could judge them only by their smell, since he had never been lucky enough to own one and eat it. A cold rain drizzled down. The air was dark and gloomy, and so was the day.
        - id: ch01-b18
          speaker: narrator
          text: >-
            By nightfall, Tom reached home soaked, exhausted, and hungry. His father and grandmother could hardly see such misery without being moved in their own special way, so they promptly gave him a sharp beating and sent him to bed. For a long time, pain and hunger kept him awake, along with all the cursing and fighting in the building. At last his thoughts wandered off to faraway lands of romance, and he fell asleep among little princes covered in jewels and gold. They lived in enormous palaces, where servants bowed low before them or hurried away to carry out their commands. As always, Tom dreamed that he was one of those princes himself.
        - id: ch01-b19
          speaker: narrator
          text: >-
            All through the night, the glory of his royal life shone around him. He walked among great lords and ladies in a blaze of light. Sweet perfumes filled the air, and beautiful music surrounded him. A glittering crowd parted to let him pass, bowing with deep respect. Tom answered one person with a smile and another with a princely nod.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Then morning came. Tom woke and saw the misery around him once more. As always, the dream made his shabby world seem a thousand times worse.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Then came bitterness, heartbreak, and tears.
