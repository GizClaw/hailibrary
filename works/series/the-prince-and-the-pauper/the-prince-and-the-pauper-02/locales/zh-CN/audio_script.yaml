audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
  chapters:
    - id: ch01
      title: 古老伦敦的下水院
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 且让我们一跃，跳过若干年。那时的伦敦已经有一千五百岁了，也算得上一座大城。城里住着十万人，也许足有二十万。街道狭窄、弯曲，又满是污泥。汤姆·康第住的地方离伦敦桥不远，尤其肮脏。
        - id: ch01-b02
          speaker: narrator
          text: 街边的房子都是木头造的。二楼探出一楼，三楼又从二楼上面伸出来，仿佛把两肘伸得更远。房子越高，反倒越宽。粗大的木梁纵横交错，像一副骨架。梁间填上结实的材料，外头再抹灰泥。主人喜欢什么颜色，就把木梁漆成红色、蓝色或黑色，远远看去别有风味。小窗上镶着一块块菱形玻璃，像门一样用铰链朝外打开。
        - id: ch01-b03
          speaker: narrator
          text: 布丁巷外有一条污秽的死胡同，名叫下水院。汤姆的父亲就住在那里。那幢房子又小又破，摇摇欲坠，里面却塞满了穷苦人家。康第一家住在三楼的一间屋里。父母在墙角有副勉强算床的架子。汤姆、祖母，还有两个姐姐贝特和南，倒不受这个限制，整片地板都归他们，随便挑地方睡。屋里虽有一两条破毯子和几捆陈年脏稻草，却算不上床铺。早晨，大伙儿把它们踢成一堆。晚上，再各自从那一堆里挑一份出来。
    - id: ch02
      title: 污秽里的梦
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 贝特和南是一对十五岁的双胞胎。她们心地善良，却浑身脏污、衣衫破烂，什么也没学过。母亲和她们一样。父亲与祖母却像一对恶鬼，只要有机会便喝醉，然后互相厮打，或是揪住挡路的人打。不管醉没醉，两人嘴里的诅咒和脏话总不会停。约翰·康第偷东西，他的母亲讨饭。他们逼孩子们做乞丐，却没能把孩子们变成小偷。
        - id: ch02-b02
          speaker: narrator
          text: 这座屋子里住满了可怕的人，不过有一位善良的老神父并不属于他们。国王夺去了他的家，只给他几个小钱过活。安德鲁神父常把孩子们悄悄叫到一旁，教他们走正道。他教汤姆一点拉丁文，也教他读书写字。本来还想教贝特和南，可两个姑娘怕同伴讥笑。在那些同伴看来，姑娘识字实在是种叫人受不了的怪本事。
        - id: ch02-b03
          speaker: narrator
          text: 整座下水院都像康第家的房子一样，是个嘈杂的蜂窝。每到夜里，醉酒、吵闹和斗殴几乎整夜不停。那里的人头破血流，就像挨饿一样平常。汤姆的生活很苦，可他自己不知道，因为别的男孩也都这样过。他以为，这就是正常又舒坦的日子。
        - id: ch02-b04
          speaker: narrator
          text: 要是晚上空着手回家，父亲会先骂他、打他，祖母接着再打一遍，而且打得更狠。深夜里，饿着肚子的母亲会偷偷过来，把自己省下的一点残羹或面包皮塞给他。她为了孩子挨饿，还常被丈夫撞见，因这桩所谓的叛逆之事挨一顿毒打。
    - id: ch03
      title: 王子的世界
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可汤姆觉得自己的日子过得还不错，夏天更是这样。他只讨到足够免受责罚的钱，因为当时严禁乞讨，处罚也很重。余下的时间，他便去听善良的安德鲁神父讲迷人的古老故事和传说。那些故事里有巨人、仙女、侏儒和精灵，也有中了魔法的城堡、华贵的国王与王子。
        - id: ch03-b02
          speaker: narrator
          text: 奇妙的故事装满了汤姆的脑袋。多少个夜晚，他又累又饿地躺在一把又脏又臭的稻草上，被打过的地方还在疼。可只要放开想象，他很快就忘了伤痛。他会看见自己变成王宫里受尽宠爱的王子，过着像中了魔法一样的生活。后来，有个愿望日日夜夜缠着他。他想亲眼看看真正的王子。
        - id: ch03-b03
          speaker: narrator
          text: 汤姆曾把愿望告诉下水院的几个伙伴，却遭到他们毫不留情的嘲弄和奚落。从那以后，他再也不肯说出口，只把梦藏在心底。他常读老神父的旧书，请神父把书里的事讲得更明白。读得多了，梦得久了，他也慢慢变了。梦中人个个衣着华美，他便开始嫌自己的身体太脏、衣裳太破，盼着能干净体面一些。
        - id: ch03-b04
          speaker: narrator
          text: 汤姆还是照样在泥里玩，也照样玩得快活。只是到了泰晤士河里扑腾时，除了好玩，他又多了一个喜欢河水的理由：它还能把人洗干净。齐普赛街的五月柱旁和各处市集总有热闹。他也偶尔看见士兵押着出了名的倒霉人物，走陆路或水路前往伦敦塔。有一年夏天，他看见可怜的安妮·阿斯丘和三个男人在史密斯菲尔德被绑上火刑柱烧死，还听一位被革职的主教向他们布道。那篇布道可没能吸引他。总的说来，汤姆的生活很有变化，也相当有趣。
    - id: ch04
      title: 假王子的宫廷
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 关于王侯生活的书读得越多，汤姆的梦就越真。渐渐地，他竟不知不觉扮起了王子。说话和举止都讲究起礼数，还带着一种古怪的宫廷气派。亲近的伙伴们看了，既十分佩服，又忍不住觉得好笑。可他在这些孩子当中的威望，也确实一天高过一天。
        - id: ch04-b02
          speaker: narrator
          text: 后来，伙伴们仰望汤姆，惊奇中还带着几分敬畏，仿佛他比常人更高一等。他似乎知道得太多了，会做了不得的事，也会说了不得的话，而且又深沉又聪明。男孩们把他的言论和事迹讲给大人听，大人也开始谈论汤姆·康第，把他当作天分非凡的奇才。成年人遇到难题会来请他裁断，还常常惊叹他的机智与智慧。除了自己的家人，认识他的人都把他看成英雄。只有家里人，始终没看出他有什么特别。
        - id: ch04-b03
          speaker: narrator
          text: 再后来，汤姆暗中组织了一座王家宫廷。他是王子，最亲近的伙伴当卫兵、宫务大臣、侍从、爵爷、侍女和王室成员。每天，假王子都要接受一套从传奇故事里学来的繁复朝见礼仪。御前会议也天天召开，商议假王国的军国大事。接着，假殿下还会向想象中的陆军、海军和各地总督颁发谕令。
        - id: ch04-b04
          speaker: narrator
          text: 宫廷散去，汤姆便穿着破衣出去讨几个小钱，啃一块可怜的面包，照例挨耳光、受辱骂。到了晚上，他在那把脏稻草上伸直身子，又回到梦里的空幻荣华中。想见一次活生生的真正王子，这个愿望一天比一天强，一周比一周迫切，最后吞没了所有别的愿望，成了他一生唯一的渴求。
    - id: ch05
      title: 梦醒之后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 一月里的一天，汤姆照常出去乞讨。他光着脚，冷得发抖，在明辛巷和小东廉街附近垂头丧气地来回走了好几个钟头。他一次次望向熟食店的橱窗，馋着里面那些可怕的猪肉馅饼，还有别的致命发明。在他闻来，那都是天使才配吃的美味，因为他从没好运到能买一个尝尝。
        - id: ch05-b02
          speaker: narrator
          text: 冰冷的细雨下个不停，空气阴沉昏暗，整整一天都很凄凉。夜里，汤姆回到家，浑身湿透，又累又饿。父亲和祖母看见他这副可怜模样，实在不可能无动于衷——当然，他们用的是自己的方式。他们立刻痛打汤姆一顿，然后把他赶去睡觉。
        - id: ch05-b03
          speaker: narrator
          text: 汤姆身上疼，肚子也饿，楼里还有没完没了的咒骂和打斗。他很久都睡不着。终于，思绪飘去了遥远而浪漫的国度。他梦见戴满珠宝、浑身金光的小王子们住在宽广的宫殿里。仆人有的弯腰行礼，有的一听吩咐就飞奔而去。和平常一样，汤姆也梦见自己成了小王子。
        - id: ch05-b04
          speaker: narrator
          text: 整整一夜，王家身份的荣光照耀着他。他走在显赫的爵爷贵妇中间，四周灯火灿烂，香气浮动，音乐悦耳。他尽情呼吸芬芳，也沉醉地听着乐声。珠光闪耀的人群恭敬行礼，又向两旁分开，让出道路。他走过去，一会儿微笑回应，一会儿带着王子的气派点点头。
        - id: ch05-b05
          speaker: narrator
          text: 可清晨醒来，他看见的仍是四周的悲惨景象。那个梦又一次让眼前的一切比从前肮脏寒酸了一千倍。紧接着，苦涩、心碎和泪水，一齐涌了上来。
