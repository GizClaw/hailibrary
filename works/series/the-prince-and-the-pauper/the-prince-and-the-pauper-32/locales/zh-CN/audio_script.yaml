audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华王子
      tts:
        delivery: 骄傲刚烈，意志坚定，带着君王的威严
        timbre: 清亮坚实
        pace: 明快
        pitch: 中高
    tom_canty:
      display_name: 汤姆·康蒂
      tts:
        delivery: 天真敏捷，窘迫时带着平民孩子的直率
        timbre: 清亮稚嫩
        pace: 轻快灵活
        pitch: 中高
    hertford:
      display_name: 赫特福德勋爵
      tts:
        delivery: 老练克制，对国王始终恭谨而婉转
        timbre: 沉稳饱满
        pace: 从容
        pitch: 中低
    lord_st_john:
      display_name: 圣约翰勋爵
      tts:
        delivery: 谨慎端庄，措辞准确而有所保留
        timbre: 平滑克制
        pace: 从容
        pitch: 中等
    noble_1:
      display_name: 贵族甲
      tts:
        delivery: 庄严热切，庆贺时声势昂扬
        timbre: 洪亮清晰
        pace: 稳健
        pitch: 中等
    noble_2:
      display_name: 贵族乙
      tts:
        delivery: 庄严热切，语气充满敬意
        timbre: 明亮饱满
        pace: 稳健
        pitch: 中高
    noble_3:
      display_name: 贵族丙
      tts:
        delivery: 庄严热切，声音坚定有力
        timbre: 低沉浑厚
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 黎明前的威斯敏斯特
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            让我们把时间往回拨几个钟头。这个难忘的加冕日，凌晨四点，威斯敏斯特教堂里已经有了人声。夜还黑着，火炬照亮的廊座却不断有人涌入。这些人甘愿坐着苦等七八个小时，只为看一场一生未必还能见到第二回的国王加冕。三点钟警炮一响，伦敦和威斯敏斯特就醒了。没有爵位的富人花钱买来入场资格，此刻正从专用入口挤进来，争着找座位。
        - id: ch01-b02
          speaker: narrator
          text: >-
            时间沉闷地拖着。各处廊座早已挤满，先前的喧动也停了。我们正好坐下来，从容看看，也想想眼前的一切。教堂里的晨光还很暗。往这边看一眼，再往那边看一眼，只能隔着立柱和凸出的装饰，零零碎碎瞧见廊座与楼台的一角。那里全塞满了人，另外的部分则被建筑挡住。宽阔的北耳堂倒尽收眼底，目前还空着，正等候英格兰那些享有特权的人物。
        - id: ch01-b03
          speaker: narrator
          text: >-
            再看那片宽大的高台，上面铺着华贵织物。王座立在中央，又由四级台阶托得高高的。椅面下面封着一块粗糙的扁石，叫斯昆石。苏格兰一代又一代国王都曾坐在上面接受加冕，久而久之，它也变得足够神圣，可以为英格兰君王派上同样的用场。王座和脚凳全都蒙着金锦。
        - id: ch01-b04
          speaker: narrator
          text: >-
            四下一片寂静。火炬昏昏闪动，漫长的时辰沉沉走过。迟来的天光终于一点点透进来，火炬熄灭了，柔和的光辉漫过宏伟的空间。建筑的轮廓已经清晰，却仍带着梦一样的朦胧，因为太阳还藏在薄云后面。
        - id: ch01-b05
          speaker: narrator
          text: >-
            七点钟一到，单调的等待第一次有了变化。第一位贵族夫人走进耳堂，浑身的华丽不输所罗门王。一名穿丝缎和天鹅绒的礼官领她入座，另一个同样装束的礼官托着长长的裙裾跟在后面。等她坐定，他把裙裾铺上膝头，再照她的意思摆好脚凳，把小冠放到伸手可及的地方，等候贵族们一同戴冠的时刻。
        - id: ch01-b06
          speaker: narrator
          text: >-
            贵族夫人们很快汇成一条闪亮的溪流，不断流进耳堂。穿丝缎的礼官在各处来回穿梭，衣服也跟着闪光。他们引夫人们落座，再一一替她们安置舒服。到处都有人走动，到处都有鲜活的气息，色彩也一直变幻。等人全到齐，各自坐到位置上，安静又回来了。眼前仿佛铺开整整一英亩的人间花卉，百色争艳，密密的钻石像银河里的寒霜，撒在花丛之上。
        - id: ch01-b07
          speaker: narrator
          text: >-
            这里什么年纪的人都有。有些老贵妇皮肤黝黑，满面皱纹，头发已经全白。她们的记忆可以沿着岁月一直倒流，回到理查三世加冕和那个早已被人遗忘的动荡年代。这里也有仪态雍容的中年夫人，有秀丽温雅的年轻少妇，还有眼睛明亮、面色鲜润的美丽少女。大典时刻一到，那些少女头一回戴上镶满珠宝的小冠，也许会因为激动而手忙脚乱。不过，那也未必。所有人的发式早就为这件事专门梳理好了，只等号令一下，便能迅速把冠冕稳稳戴上。
        - id: ch01-b08
          speaker: narrator
          text: >-
            这一大片夫人已经够叫人赞叹了，真正的奇景却还在后面。九点左右，云层忽然裂开。一束阳光穿过柔和的空气，慢慢扫过一排排夫人。照到哪里，哪里的珠宝便燃起五彩火焰般的光。突如其来的美丽仿佛一道电流穿透全身，直叫人的指尖都发麻。
        - id: ch01-b09
          speaker: narrator
          text: >-
            不多时，一位来自东方某个遥远角落的特使，跟着外国使臣的大队人马走了过来。他正好穿过那道阳光，人们一下看得屏住了呼吸。他从头到脚缀满宝石，周身的光芒不断流泻、闪烁、跳动，强烈得逼人。身子只要轻轻一动，便有一阵舞蹈般的灿烂光雨洒向四周。
    - id: ch02
      title: 金冠悬在头顶
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            时间又流过一个钟头、两个钟头、两个半钟头。低沉的炮声终于传来，它告诉所有人，国王和盛大仪仗总算到了。久候的人群立刻欢喜起来。大家知道还得再等上一阵，因为国王要为庄严的典礼更衣整装。不过，王国贵族正好趁这段工夫穿着庄重礼袍入场。有这样的场面可看，继续等待也成了一件愉快的事。
        - id: ch02-b02
          speaker: narrator
          text: >-
            贵族们在隆重的礼仪中被引到座位，小冠就放在随手能取的地方。廊座上的人全都兴致勃勃，大多数人都是第一次亲眼看见那些公爵、伯爵和男爵。他们本人也许陌生，他们的名号却已经在五百年的历史里传扬。人们等候时，眼睛始终追着这些身穿礼袍的大人物，仿佛五百年的往事都从面前走过。等所有人终于坐定，无论从廊座还是别的好位置望去，眼前都成了一幅完整的辉煌画面，既值得观赏，也值得永远记住。
        - id: ch02-b03
          speaker: narrator
          text: >-
            接下来，教会的显贵们一个跟着一个走进来。他们穿着礼袍，戴着主教冠，各自领着随员登上高台，走到指定的位置。摄政大臣和其他要员紧跟在后面。最后进场的，是一队从头到脚披着钢甲的卫兵。
        - id: ch02-b04
          speaker: narrator
          text: >-
            众人静候片刻。号令一出，胜利的乐声骤然响起。汤姆·康蒂身穿曳地的金锦长袍，从门里出现，踏上高台。全场一齐起立，认主仪式开始了。
        - id: ch02-b05
          speaker: narrator
          text: >-
            随后，高贵的圣歌卷起丰厚的声浪，一阵阵漫过整座教堂的广阔空间。汤姆就在歌声的宣告与欢迎中，被人引到王座前。观众凝神望着，古老的礼仪一项接一项进行，场面庄严得叫人屏息。可是，大典越接近完成，汤姆的脸色就越苍白。深重的悲苦和绝望一层层压住了他，也压住了他那颗充满悔恨的心。
        - id: ch02-b06
          speaker: narrator
          text: >-
            最后一项仪式到了。坎特伯雷大主教从软垫上捧起英格兰王冠，举到颤抖的假国王头顶。同一瞬间，一道虹彩闪过宽广的耳堂。所有贵族一齐举起自己的小冠，悬在头上，就这样停住不动。
        - id: ch02-b07
          speaker: narrator
          text: >-
            教堂深处一片寂静。就在这一刻，一个惊人的身影闯进中央大甬道。那是个男孩，没戴帽子，鞋子破旧，粗布衣裳已经破烂不堪。众人刚才全看得入神，直到他一步步走近，才忽然注意到他。男孩一身又脏又惨，举起手时却郑重得像个真正的君王。
        - id: ch02-b08
          speaker: prince_edward
          text: 我不许你们把英格兰王冠戴到那个无权承受它的人头上。我才是国王！
        - id: ch02-b09
          speaker: narrator
          text: 几只愤怒的手立刻抓住他。身穿王袍的汤姆猛地跨出一步，声音响彻高台。
        - id: ch02-b10
          speaker: tom_canty
          text: 放开他！谁也不许动手！他才是真正的国王！
        - id: ch02-b11
          speaker: narrator
          text: >-
            惊愕像一阵恐慌扫过全场。众人纷纷从座位上欠起身，茫然地看看彼此，又看看高台上的几个主要人物。他们简直弄不清自己是不是醒着，神志是不是正常，还是已经睡去，正在做梦。摄政大臣也和所有人一样大吃一惊，却很快镇定下来，威严地下令。
        - id: ch02-b12
          speaker: hertford
          text: 陛下的病又犯了，不必理会。把这个流浪汉抓起来！
        - id: ch02-b13
          speaker: narrator
          text: 卫兵正要服从，假国王却用力跺脚，再次厉声喝止。
        - id: ch02-b14
          speaker: tom_canty
          text: 谁敢动他，后果自负！他就是国王！
          emotion: angry
    - id: ch03
      title: 两个国王
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            抓住男孩的手缩了回去。全场像中了定身术，无人移动，也无人说话。事情实在太离奇，谁都不知道该怎么办，更不知道该说什么。众人拼命想理清头绪，脑子却仍是一团乱。男孩却始终昂着头，神态自信，脚步稳稳向前。他从进门起就没停过。等他登上高台，汤姆满脸喜悦地跑来迎接，又在他面前跪倒。
        - id: ch03-b02
          speaker: tom_canty
          text: >-
            我的国王陛下，请让可怜的汤姆·康蒂第一个向您宣誓效忠。请戴上王冠，拿回本来就属于您的一切！
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: >-
            摄政大臣严厉地盯着来人的脸，可那份严厉转眼就变成了惊疑。其他大臣也一样。他们彼此望望，又不由自主地一齐退后一步。每个人心里都是同一个念头：这两个孩子竟然这样相像。
        - id: ch03-b04
          speaker: hertford
          text: 阁下若肯准许，我想问您几个问题……
        - id: ch03-b05
          speaker: prince_edward
          text: 大人只管问，我会回答。
        - id: ch03-b06
          speaker: narrator
          text: >-
            公爵接连问起宫廷、先王、王子和两位公主。男孩毫不迟疑，每一个问题都答对了。他还把宫中的国事厅、先王的寝宫和威尔士亲王的住所一一说清。所有听见的人都觉得离奇，觉得惊人，简直无法解释。情势似乎开始转向，汤姆心里的希望也越升越高。就在这时，摄政大臣却摇了摇头。
        - id: ch03-b07
          speaker: hertford
          text: 这些回答确实惊人，可我们的国王陛下也全都答得出来。这算不得证据。
        - id: ch03-b08
          speaker: narrator
          text: >-
            他仍把汤姆称作国王。汤姆心头一沉，觉得刚升起的希望正在脚下崩塌。情势变化得飞快，却转错了方向。浪潮仿佛把可怜的汤姆搁浅在王座上，又卷着另一个男孩漂向大海。
        - id: ch03-b09
          speaker: narrator
          text: >-
            摄政大臣暗自思量。若让这个关系重大的谜团继续下去，国家就有危险，它会使全国分裂，也会动摇王位。他正要叫托马斯爵士抓人，忽然停住，脸上有了光。
        - id: ch03-b10
          speaker: hertford
          text: >-
            英格兰国玺藏在哪里？如实回答，这个谜就解开了。只有真正做过威尔士亲王的人才知道答案。一件小东西，却悬着一个王位、一个王朝的命运！
        - id: ch03-b11
          speaker: narrator
          text: >-
            大臣们的眼睛纷纷亮起来，赞许的目光在彼此之间传递。这个主意来得太妙了。只有真正的王子才能解开国玺失踪的谜。这个可怜的小骗子也许把别人教的功课背得滚瓜烂熟，可连教他的人都不可能答出这一题。好极了，这场麻烦又危险的风波马上就能结束。众人暗暗点头，心里已经露出满意的微笑，只等着看这个愚蠢的男孩心虚慌乱，吓得僵在原地。可他没有。他平静而自信，立刻回答。
        - id: ch03-b12
          speaker: prince_edward
          text: >-
            这个谜一点也不难。圣约翰勋爵，到宫中我的私室去。候见室那扇门进去以后，离门最远的左边墙角，贴近地面有一枚黄铜钉头。按下去，一个珠宝暗柜就会弹开。除了我，世上只有替我造暗柜的可靠工匠知道它。打开以后，第一眼看见的就是英格兰国玺。把它取来。
        - id: ch03-b13
          speaker: narrator
          text: >-
            全场听了这番话，无不惊奇。他们更想不到，这个小乞儿竟然毫不迟疑地从人群里认出了圣约翰勋爵，还准确叫出他的名字。他的神情平静又笃定，仿佛一辈子都认识这位贵族。圣约翰惊讶得差点真服从命令，身子已经做出要走的动作，才突然清醒过来，红着脸恢复镇定。汤姆立刻转向他。
        - id: ch03-b14
          speaker: tom_canty
          text: 你还等什么？没听见国王的命令吗？快去！
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: >-
            圣约翰深深鞠了一躬。这一礼谨慎极了，既不朝向这一个国王，也不朝向另一个，只对着两人中间的空地。随后，他退了出去。
    - id: ch04
      title: 国玺的考验
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            高台上那群衣饰华美的官员开始悄悄移动。那动静很慢，几乎看不出来，却一直没有停，像有人缓缓转动万花筒。一团灿烂图案里的碎片纷纷脱落，汇进另一团图案。聚在汤姆身边的闪亮人群一点点散开，又在新来的男孩身旁聚成一团。接下来是短短一段叫人透不过气的等待。连最后几个胆小鬼也慢慢凑足勇气，一个接一个溜到多数人那边。
        - id: ch04-b02
          speaker: narrator
          text: >-
            到最后，汤姆穿着王袍、戴着珠宝，完全孤零零地站在原地。他与整个世界隔开了，身影分外显眼，四周那片空白也显得意味深长。
        - id: ch04-b03
          speaker: narrator
          text: >-
            圣约翰回来了。他沿中央甬道一步步走近。众人的心全都绷紧了，人群里的低语渐渐消失，最后只剩下屏息凝神的深寂。寂静里，只有他的脚步声一下下传来，沉闷而遥远。千万双眼睛牢牢跟着他，看着他穿过甬道，登上高台。他停了一下，随后走到汤姆面前，深深行礼。
        - id: ch04-b04
          speaker: lord_st_john
          text: 陛下，国玺不在那里！
        - id: ch04-b05
          speaker: narrator
          text: >-
            廷臣们脸色惨白，惊恐地逃离那个寒酸的王位争夺者。他们逃开的速度，就算眼前站的是一个瘟疫病人，也不过如此。转眼间，男孩就孤身一人。再没有朋友，也没有支持者。他仿佛成了一个靶子，轻蔑和愤怒的目光像一阵猛烈的火焰，全都集中烧向他。摄政大臣厉声下令。
        - id: ch04-b06
          speaker: hertford
          text: 把这个乞丐扔到街上去，押着他游遍全城，一路鞭打！这种卑贱无赖，不值得再费一点心思！
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 卫兵立刻冲上前。汤姆挥手把他们喝退。
        - id: ch04-b08
          speaker: tom_canty
          text: 退下！谁敢碰他，谁就拿自己的性命冒险！
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: 摄政大臣实在想不明白，只好转向圣约翰勋爵。
        - id: ch04-b10
          speaker: hertford
          text: >-
            你仔细搜过吗？算了，这也不必问。小东西从眼前溜掉，并不稀奇。可英格兰国玺那么大，怎么会消失得无影无踪，叫谁都查不到？那可是沉甸甸的一面金圆盘……
        - id: ch04-b11
          speaker: narrator
          text: 汤姆的眼睛忽然亮了。他猛地跳上前。
        - id: ch04-b12
          speaker: tom_canty
          text: >-
            等等，够了！它是不是又圆又厚，上面还刻着文字和图案？原来那就是让大家急得团团转的国玺！你们要是早说清它的模样，三个星期前就能拿回去了。我知道它在哪里。不过，最先把它放到那里的人不是我。
          emotion: surprised
        - id: ch04-b13
          speaker: hertford
          text: 那么是谁呢，陛下？
        - id: ch04-b14
          speaker: tom_canty
          text: >-
            就是站在那里的英格兰合法国王。让他亲口告诉你们，大家就会相信这是他自己的记忆。我的国王，好好想想。那天您穿着我的破衣裳冲出宫门，要去惩罚侮辱我的士兵。藏好国玺，就是您出门前做的最后一件事。
        - id: ch04-b15
          speaker: narrator
          text: >-
            四下没有动作，也没有耳语。所有目光都落在新来的男孩身上。他低着头，眉头紧锁。无数记忆纷纷涌来，可眼下全都没有用处。他只能在其中摸索，寻找那个小小的、躲躲闪闪的事实。找到了，这事实就会把他送上王位。找不到，他便永远保持现在的模样，只是一个穷儿、一个被人抛弃的孩子。一刻又一刻过去，片刻积成了几分钟。他始终沉默地苦苦寻找，没有露出一点找到答案的迹象。终于，他叹了口气，慢慢摇头，嘴唇也颤抖起来。
        - id: ch04-b16
          speaker: prince_edward
          text: >-
            那一幕我全想起来了，可里面没有国玺。诸位大人、诸位先生，如果只因为我拿不出这项证据，你们就要夺走合法君王本来拥有的一切，我无力阻止。可是……
          emotion: sad
        - id: ch04-b17
          speaker: narrator
          text: 汤姆一下慌了，急忙打断他。
        - id: ch04-b18
          speaker: tom_canty
          text: >-
            我的国王，您千万别糊涂！等一等，再想想，不能放弃！事情还没完，也绝不能这样完！听我说，每个字都听清。我把那天早晨照原样再带回来。我们谈过话。我说起两个姐姐南恩和贝特，也说起老祖母，还有残渣院那些孩子的粗野游戏。这些您都记得，对不对？
          emotion: fearful
        - id: ch04-b19
          speaker: tom_canty
          text: >-
            您给我吃的喝的，还体贴地遣退仆人，免得我出身卑微，在他们面前难为情。这件事您也记得。接着想，别停下来，您一定能把一切都找回来。
        - id: ch04-b20
          speaker: narrator
          text: >-
            汤姆一件件往下说，另一个男孩则不停点头，表示这些往事他都认得。观众和大臣全看呆了。他们越听越觉得，这个故事分明是一段真实的历史。可一位王子和一个小乞儿，怎么可能有过这样的相遇？这群人从没这样困惑过，也从没这样入神，更没有这样目瞪口呆过。
    - id: ch05
      title: 真正的国王
      blocks:
        - id: ch05-b01
          speaker: tom_canty
          text: >-
            为了好玩，我的王子，我们换了衣裳。后来站到镜子前，发现彼此太像，都说好像根本没换过。接着，您看见那个士兵弄伤了我的手。看，伤还没好，手指还是硬的，我到现在都不能写字。
        - id: ch05-b02
          speaker: tom_canty
          text: >-
            您当时跳起来，发誓要找那个士兵报仇，然后冲向门口。路上经过一张桌子，您说的国玺就在桌上。您一把拿起来，急忙四处找地方藏。这时，您看见了……
        - id: ch05-b03
          speaker: prince_edward
          text: >-
            够了，我想起来了！感谢仁慈的上帝！快去，圣约翰。墙上挂着一副米兰式铠甲，到它的护臂里找，国玺就在里面！
          emotion: happy
        - id: ch05-b04
          speaker: tom_canty
          text: >-
            对，我的国王，答对了！现在英格兰的王权真正属于您了。谁还敢争辩，还不如生来就是个哑巴！圣约翰勋爵，快让双脚长出翅膀来！
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: >-
            全场所有人都站了起来。焦灼、忧惧和烧灼人心的激动，搅得大家几乎失去理智。地面上和高台上，狂乱的交谈猛然爆发，汇成震耳的嗡鸣。好一阵子，谁也不知道别的事，听不见别的声音，更顾不上别的东西。每个人只管听身旁的人朝自己耳朵里喊了什么，再朝那人的耳朵里喊回去。时间就这样飞快流过，无人留心，更无人知道究竟过去了多久。
        - id: ch05-b06
          speaker: narrator
          text: >-
            忽然，全场静了。圣约翰就在这时登上高台，手里高高举着英格兰国玺。一阵欢呼立刻冲上教堂穹顶。
        - id: ch05-b07
          speakers: [noble_1, noble_2, noble_3]
          ensemble: chorus
          text: 真正的国王万岁！
          emotion: happy
        - id: ch05-b08
          speaker: narrator
          text: >-
            足足五分钟，欢呼声和乐器猛烈的轰响震得空气发颤。无数手帕在人们头顶挥舞，像一场暴风雪，把半空都染成了白色。穿过这一切，一个衣衫褴褛的孩子站在宽大高台中央。他满脸通红，既喜悦又骄傲，成了整个英格兰最引人注目的身影。王国里那些权势最大的贵族，此刻全都跪在他的四周。
        - id: ch05-b09
          speaker: narrator
          text: 众人重新起身，汤姆高声请求新王。
        - id: ch05-b10
          speaker: tom_canty
          text: 我的国王，请收回这些王家衣袍，把可怜的仆人汤姆那身破衣裳还给他吧。
        - id: ch05-b11
          speaker: hertford
          text: 把这个小无赖剥光，扔进伦敦塔。
          emotion: angry
        - id: ch05-b12
          speaker: prince_edward
          text: >-
            我不许这样。没有他，我就拿不回王冠。谁也不许伤害他。至于您，我的好舅父，摄政大臣大人，您这样对待这个可怜的孩子，可算不得知恩图报。听说他封了您做公爵，可他不是国王，那么这个爵位现在还值什么？
        - id: ch05-b13
          speaker: narrator
          text: 摄政大臣的脸红了。爱德华还没有说完。
        - id: ch05-b14
          speaker: prince_edward
          text: >-
            明天，您得通过汤姆向我请求确认爵位。否则，您就做不成公爵，只能继续当个普通伯爵。
        - id: ch05-b15
          speaker: narrator
          text: >-
            受了这番斥责，萨默塞特公爵暂时退到后面。国王转向汤姆，语气和缓下来。
        - id: ch05-b16
          speaker: prince_edward
          text: 我可怜的孩子，我自己都记不起国玺藏在哪里，你怎么反而记得？
        - id: ch05-b17
          speaker: tom_canty
          text: 这太容易了，我的国王。我拿它用了好些天。
        - id: ch05-b18
          speaker: prince_edward
          text: 你用过它，却说不出它在哪里？
        - id: ch05-b19
          speaker: tom_canty
          text: 我不知道他们要找的就是那个东西。陛下，他们一直没说它长什么样。
        - id: ch05-b20
          speaker: prince_edward
          text: 那么，你拿它做什么？
        - id: ch05-b21
          speaker: narrator
          text: 汤姆的脸一点点红了。他垂下眼睛，一声不响。
        - id: ch05-b22
          speaker: prince_edward
          text: 说吧，好孩子，不用害怕。你究竟拿英格兰国玺做了什么？
          emotion: calm
        - id: ch05-b23
          speaker: narrator
          text: 汤姆窘迫得可怜，结巴了好一阵，才总算说出口。
        - id: ch05-b24
          speaker: tom_canty
          text: 我……拿它砸核桃！
        - id: ch05-b25
          speaker: narrator
          text: >-
            雪崩般的笑声迎面压来，差点把这个可怜的孩子冲得站不住。可这回答也解决了最后一个问题。要是还有谁心里留着一点疑虑，以为汤姆可能真是英格兰国王，熟悉王室那些庄严的器物，这句话也把那点疑虑扫得干干净净，再没有半点留下。
    - id: ch06
      title: 加冕礼完成
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            就在这段时间里，华贵的国王礼袍已经从汤姆肩上脱下，披到了爱德华身上。他原来那身破破烂烂的衣裳，被宽大的礼袍遮得严严实实，再也看不见了。中断的加冕仪式重新开始，每一项庄严的仪式又照原来的次序进行。真正的国王接受了涂油礼，英格兰王冠终于戴上他的头顶。大炮随即一门接一门轰响，把这个消息从教堂外一路传遍伦敦的街巷。各处的喝彩一齐爆发，整座城市仿佛都在欢呼声中摇撼起来。
