  chapters:
    - id: ch01
      title: Coronation Day
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Let us go back a few hours and place ourselves in Westminster Abbey at four in the morning on this memorable Coronation Day. We would not be alone. Night still covered the city, but the torchlit galleries were already filling. People were quite content to sit still for seven or eight hours, waiting for a sight they could hardly hope to see twice in their lives: the crowning of a king. London and Westminster had been awake since the warning guns boomed at three. Crowds of wealthy people without titles had bought the privilege of searching for a seat, and they kept streaming through the entrances reserved for them.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The hours dragged. Before long, every gallery was packed and all movement stopped. There was plenty of time now to sit, look, and think. Through the dim cathedral light, people could glimpse pieces of galleries and balconies crowded tight with other watchers. Pillars and projecting stone hid the rest. Below them, the entire north transept stood empty, waiting for England's privileged guests. They could also see the broad platform, richly carpeted, with the throne in its center. Four steps raised it above the floor. Inside the throne's seat lay the rough, flat Stone of Scone. Many generations of Scottish kings had sat upon it for their coronations, until time had made it holy enough for the kings of England too. The throne and its footstool both shone under cloth of gold.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Stillness ruled the Abbey. The torches blinked dimly, and time moved heavily. At last the slow daylight claimed the vast space and the torches were put out. Now every part of the noble building could be seen. Yet all of it remained soft and dreamlike because a light veil of clouds covered the sun.
        - id: ch01-b04
          speaker: narrator
          text: >-
            At seven o'clock, the first break came in that sleepy sameness. On the stroke of the hour, the first peeress entered the transept, dressed with the splendor of Solomon. An official in satin and velvet led her to the place appointed for her. Another official, dressed just like the first, gathered up her long train and followed. Once she was seated, he spread the train across her lap, moved the footstool to please her, and placed her coronet where her hand could easily reach it. It would have to be ready when the signal came and all the nobles crowned themselves at once.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Soon the peeresses flowed in like a glittering stream. Satin-clad officials flashed here and there, seating them and making them comfortable. The transept filled with life and shifting color. Then, once every lady had arrived and taken her place, quiet returned. They covered nearly an acre like a field of human flowers in every color, frosted with diamonds like the Milky Way. Every age was there. Brown, wrinkled, white-haired dowagers could travel far back in memory to the coronation of Richard the Third and the troubled days of that forgotten time. There were handsome women in middle age, lovely young matrons, and gentle young girls with fresh faces and shining eyes. The girls might place their jeweled coronets awkwardly when the great moment came, because the task was new and excitement could trouble their hands. Still, their hair had been arranged especially so each little crown could be set quickly and securely in place.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The diamonds already made a marvelous sight, but at about nine the Abbey offered something more astonishing. The clouds suddenly opened, and a shaft of sunlight cut through the mellow air. It drifted slowly along the ranks of ladies. Every row it touched burst into dazzling fires of many colors, and the surprise and beauty of it sent a thrill through everyone who watched. Then a special envoy from a distant part of the East marched past with the foreign ambassadors. He crossed that bright bar of sunlight, and the sight took people's breath away. Gems covered him from head to foot. At his slightest movement, light streamed, flashed, and danced all around him.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Time drifted on for one hour, then two, then two and a half. At last the deep boom of artillery announced that the King and his grand procession had arrived, and the waiting crowd rejoiced. Everyone knew there would be another delay while the King was prepared and dressed for the solemn ceremony. But now they could watch the peers of the realm assemble in their stately robes. Each peer was led with ceremony to a seat, and each coronet was placed close at hand. Interest stirred through the galleries. Most of those watching had never seen these dukes, earls, and barons before, although their names had stood in history for five hundred years. When the last of them sat down, the view from every gallery and high corner was complete. It was a magnificent sight, made to remain in the memory.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Next came the great leaders of the church, wearing their robes and mitres, with their attendants behind them. They filed onto the platform and took the places assigned to them. The Lord Protector and other high officers followed, then a detachment of the Guard covered in steel. Everyone waited again. At a signal, triumphant music suddenly rang through the Abbey. Tom Canty appeared in a doorway, dressed in a long robe of cloth of gold, and stepped onto the platform. The entire gathering rose, and the ceremony of Recognition began.
        - id: ch01-b09
          speaker: narrator
          text: >-
            A noble anthem swept through the Abbey in rich waves of sound. With that great welcome around him, Tom was led to the throne. The audience watched while one ancient ceremony followed another in solemn order. Each one carried Tom closer to the end. And with every step, he grew paler. A deepening sorrow settled over his spirit, while remorse weighed more and more heavily on his heart.
        - id: ch01-b10
          speaker: narrator
          text: >-
            At last the final act was ready. The Archbishop of Canterbury lifted the crown of England from its cushion and held it above the trembling head of the false king. In that same instant, a rainbow glow flashed through the wide transept. Every noble in that vast gathering had raised a coronet and held it above his or her head. There they all paused, waiting together.
        - id: ch01-b11
          speaker: narrator
          text: >-
            A deep hush filled the Abbey. At that solemn moment, a startling figure entered the scene. The absorbed crowd did not notice him at first. Then suddenly he could be seen moving up the great central aisle. He was a bareheaded boy in worn shoes and coarse common clothes that were falling into rags. His dirty, miserable appearance seemed completely at odds with the solemn authority of the hand he raised in warning.
        - id: ch01-b12
          speaker: prince_edward
          text: >-
            I forbid you to place the crown of England on that false head. I am the King!
        - id: ch01-b13
          speaker: narrator
          text: >-
            Several angry hands seized him at once, ready to drag this ragged intruder away. But in that same instant, Tom stepped quickly forward in his royal robes. His voice rang clear and strong across the Abbey.
        - id: ch01-b14
          speaker: tom_canty
          text: >-
            Let him go! Do not touch him. He is the King!
        - id: ch01-b15
          speaker: narrator
          text: >-
            A kind of panic swept through the gathering. People half rose from their places and stared in bewilderment at one another, then at the two boys before them. They looked like people trying to decide whether they were awake and in their right minds, or asleep and dreaming. The Lord Protector was as astonished as everyone else, but he recovered first.
        - id: ch01-b16
          speaker: lord_protector
          text: >-
            Pay no attention to His Majesty. His illness has returned. Seize that vagabond!
        - id: ch01-b17
          speaker: narrator
          text: >-
            The order would have been obeyed, but Tom stamped his foot.
        - id: ch01-b18
          speaker: tom_canty
          text: >-
            Touch him at your peril! He is the King!
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: >-
            Every hand stopped. It was as if the whole Abbey had been struck motionless. No one moved and no one spoke, because no one knew what to do or say in such an extraordinary moment. While every mind struggled to understand, Edward kept coming. He had never paused from the moment he entered. He moved steadily down the aisle with his head high and the confidence of a king. While the confused officials still searched for an answer, he stepped onto the platform. Tom's face shone with joy. He ran forward to meet Edward, fell to his knees before him, and spoke first.
        - id: ch01-b20
          speaker: tom_canty
          text: >-
            My lord the King, let poor Tom Canty be the first to swear loyalty to you. Take your crown and enter into your own again!
          emotion: happy
        - id: ch01-b21
          speaker: narrator
          text: >-
            The Lord Protector fixed a stern look on the newcomer. Almost at once, the sternness disappeared and wonder took its place. The same change passed over the other great officers. They looked at Edward, then at Tom, then at one another. Without planning it, they all stepped back. One thought had come to every mind at the same time: the resemblance between these two boys was extraordinary.
        - id: ch01-b22
          speaker: lord_protector
          text: >-
            With your permission, sir, I would like to ask you certain questions.
        - id: ch01-b23
          speaker: prince_edward
          text: >-
            I will answer them, my lord.
        - id: ch01-b24
          speaker: narrator
          text: >-
            The Duke asked question after question about the Court, the late King, the prince, and the princesses. Edward answered every one correctly and without hesitation. He described the palace's state rooms, the late King's private apartments, and the rooms that belonged to the Prince of Wales. Those who heard him called it strange, wonderful, and impossible to explain. The feeling in the Abbey began to turn in Edward's favor, and Tom's hopes rose with it. Then the Lord Protector slowly shook his head.
        - id: ch01-b25
          speaker: lord_protector
          text: >-
            It is remarkable, but our lord the King can answer those questions too. They prove nothing.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Hearing the Protector still call him King made Tom's hope crumble beneath him. The feeling in the Abbey turned quickly now, but in the wrong direction. It left poor Tom stranded on the throne and carried Edward away from it. The Lord Protector thought in silence and shook his head. It was dangerous, he decided, for the state and for everyone there to allow such a terrible riddle to remain open. It might divide the country and weaken the throne itself. He turned to order Sir Thomas to arrest Edward. Then he stopped. His face brightened as a new thought came to him.
        - id: ch01-b27
          speaker: lord_protector
          text: >-
            Where is the Great Seal? Answer that, and this mystery is over. Only the true Prince of Wales can know. A throne and a dynasty now rest on this one small thing.
        - id: ch01-b28
          speaker: narrator
          text: >-
            It seemed a lucky and brilliant thought. Bright, approving glances passed silently among the great officials. Surely no one but the true prince could solve the stubborn mystery of the missing Great Seal. The ragged little impostor might have learned every other answer from a clever teacher. But even that teacher could not know this. The troublesome danger would soon be over. The officials gave almost invisible nods and smiled inwardly, waiting for guilt and confusion to break across the boy's face. To their amazement, nothing of the kind happened. Edward answered at once in a confident, untroubled voice.
        - id: ch01-b29
          speaker: prince_edward
          text: >-
            There is nothing difficult about it. Lord St. John, go to my private cabinet in the palace. You know the room better than anyone. Look close to the floor in the left corner, the one farthest from the door that opens into the antechamber. You will find a brass nailhead in the wall. Press it, and a small jewel closet will spring open. Even you have never known it was there. No one in the world knows except me and the trusted craftsman who made it for me. The Great Seal will be the first thing you see inside. Bring it here.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Everyone marveled at Edward's answer. They were even more astonished when the ragged boy picked Lord St. John from the group without a moment's doubt, called him by name, and spoke as if he had known him all his life. St. John was almost startled into obeying. He even began to move, then recovered his careful manner and blushed at his own mistake. Tom turned sharply on him.
        - id: ch01-b31
          speaker: tom_canty
          text: >-
            Why are you waiting? You heard the King's command. Go!
          emotion: angry
        - id: ch01-b32
          speaker: narrator
          text: >-
            St. John bowed deeply, but he aimed the bow with great care at the empty ground halfway between the two boys. That way, he committed himself to neither one. Then he left. As the waiting began, a slow movement passed through the glittering group of officials. It was barely noticeable, but it never stopped. Like the bright pieces in a turning kaleidoscope, courtiers slipped away from the cluster around Tom and joined the new cluster around Edward. Tom was soon almost alone. During the tense silence, even the few timid supporters who remained beside him gathered enough courage to cross over one by one. At last Tom stood completely alone in his royal robes and jewels, surrounded by a wide, empty space.
        - id: ch01-b33
          speaker: narrator
          text: >-
            At last St. John appeared again. As he came up the middle aisle, the interest became so intense that the low murmur of the crowd faded into complete silence. His footsteps sounded dull and distant through the breathless Abbey. Every eye stayed fixed upon him. He reached the platform, paused for a moment, then walked toward Tom and bowed deeply.
        - id: ch01-b34
          speaker: lord_st_john
          text: >-
            Sire, the Seal is not there.
        - id: ch01-b35
          speaker: narrator
          text: >-
            The frightened courtiers melted away from Edward as quickly as a mob fleeing someone with the plague. In one moment, the shabby little claimant stood entirely alone, without one friend or supporter. Scornful and angry looks struck him from every side. The Lord Protector called out fiercely.
        - id: ch01-b36
          speaker: lord_protector
          text: >-
            Throw the beggar into the street and whip him through the town. The miserable fraud deserves nothing more!
          emotion: angry
        - id: ch01-b37
          speaker: narrator
          text: >-
            Officers of the guard rushed forward to obey the Protector. Before they could reach Edward, Tom raised his hand and waved them back.
        - id: ch01-b38
          speaker: tom_canty
          text: >-
            Stop! Anyone who touches him risks his life!
          emotion: angry
        - id: ch01-b39
          speaker: lord_protector
          text: >-
            Did you search carefully? No, there is no need to ask you that. This is extremely strange. Small things and trifles can slip out of sight, and no one thinks their loss is surprising. But how can the Seal of England disappear with no one able to find the least trace of it? It is not a little object. It is a large, heavy disk of gold.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The Lord Protector could not understand it. The loss of a little object would have been no wonder, but the Seal was a massive golden disk. How could something so large vanish without leaving a trace? At that description, Tom's eyes suddenly lit up, and he sprang forward.
        - id: ch01-b41
          speaker: tom_canty
          text: >-
            Wait! Is it round and thick, with letters and designs cut into it? Then I know what the Great Seal is. If anyone had described it, I could have found it three weeks ago. I know exactly where it is, but I was not the one who put it there.
          emotion: surprised
        - id: ch01-b42
          speaker: lord_protector
          text: >-
            Who did, your Majesty?
        - id: ch01-b43
          speaker: tom_canty
          text: >-
            The boy standing there, the rightful King of England. Let him tell you where it is, and then you will know the answer came from his own memory. Think, my King. It was the very last thing you did before you ran from the palace in my rags to punish the soldier who had hurt me.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Silence held the Abbey without so much as a movement or a whisper. Every face turned to Edward. He stood with his head bowed and his forehead tight with effort. A whole crowd of memories pressed through his mind, but nearly all of them were useless. Somewhere among them was one small, escaping fact. If he found it, that fact would seat him on a throne. If he did not, it would leave him forever as he was, a pauper and an outcast. One moment followed another until the moments became minutes. Still the boy searched in silence and gave no sign. At last he sighed, slowly shook his head, and looked up with a trembling lip.
        - id: ch01-b45
          speaker: prince_edward
          text: >-
            I can call the whole scene back to mind, every part of it, but the Seal has no place there. My lords and gentlemen, if you choose to rob your rightful sovereign of his own crown because he cannot give you this proof, I cannot stop you. I have no power here. But—
          emotion: sad
        - id: ch01-b46
          speaker: narrator
          text: >-
            Tom broke in, terrified that Edward was giving up.
        - id: ch01-b47
          speaker: tom_canty
          text: >-
            No, my King! This is madness. Wait and think. Do not give up, because we have not lost yet, and we will not lose. Listen closely and follow every word. I will bring that morning back exactly as it happened. We talked together. I told you about my sisters, Nan and Bet, about my old grandmother, and about the rough games the boys play in Offal Court. Yes, you remember all of that. Then you gave me food and drink. With a prince's kindness, you sent the servants away so my poor manners would not shame me before them. You remember that too. Keep following me.
          emotion: fearful
        - id: ch01-b48
          speaker: narrator
          text: >-
            Tom called up each detail, one after another, and Edward nodded as he recognized them. The great audience and all the officials stared in puzzled wonder. This did not sound like a lesson learned from a teacher. It sounded like the true history of a morning the two boys had shared. Yet how could such an impossible meeting between a prince and a beggar boy ever have happened? The people had never been so confused, so interested, or so completely amazed.
        - id: ch01-b49
          speaker: tom_canty
          text: >-
            For a joke, we traded clothes. Then we stood together in front of a mirror, and we looked so much alike that both of us said it seemed no change had been made. Yes, you remember. Then you noticed that the soldier had hurt my hand. Look at it. The fingers are still so stiff that I cannot write with them. When you saw that, you sprang up and swore you would take revenge on the soldier. You rushed toward the door and passed a table. The object you call the Seal was lying on it. You snatched it up and looked quickly around for somewhere to hide it. Then your eye caught sight of—
        - id: ch01-b50
          speaker: prince_edward
          text: >-
            There, that is enough! Thank God. Now I remember. St. John, go back to the palace. You will find the Seal inside an arm piece of the Milanese armor that hangs on the wall!
          emotion: happy
        - id: ch01-b51
          speaker: tom_canty
          text: >-
            Yes, my King, that is right! Now England's scepter is truly yours. Anyone who tries to deny it would be better off if he had been born unable to speak. Go, Lord St. John. Give your feet wings!
          emotion: happy
        - id: ch01-b52
          speaker: narrator
          text: >-
            The whole gathering rose. They were nearly beside themselves with worry, hope, and excitement. A deafening storm of frantic talk broke across the floor and the platform. For a while, no one knew or heard anything except what a neighbor was shouting into one ear, or what he was shouting back. Time passed without anyone noticing how much of it had gone. Then a sudden hush fell over the Abbey. At that very moment, St. John appeared upon the platform. In his raised hand, for all of them to see, he held the Great Seal.
        - id: ch01-b53
          speakers: [noble_1, noble_2, noble_3]
          ensemble: chorus
          text: >-
            Long live the true King!
          emotion: happy
        - id: ch01-b54
          speaker: narrator
          text: >-
            For five full minutes, the air shook with cheers and the crash of musical instruments. The sound rolled through the great spaces of the Abbey while white handkerchiefs filled the air like a whirling storm. Through all the noise and movement, the ragged boy remained the most noticeable person in England. He stood in the center of the broad platform, flushed, proud, and happy. Around him, the great nobles and vassals of the kingdom had dropped to their knees before their true sovereign. The outcast who had entered alone now stood at the heart of the whole splendid gathering. At last the noise eased and everyone rose. Then Tom called to Edward.
        - id: ch01-b55
          speaker: tom_canty
          text: >-
            Now, my King, take back these royal clothes and return poor Tom's rags to him.
        - id: ch01-b56
          speaker: lord_protector
          text: >-
            Strip the little wretch and throw him into the Tower.
        - id: ch01-b57
          speaker: prince_edward
          text: >-
            I will not allow it. Without this boy, I would never have regained my crown, so no one will lay a hand on him or do him harm. And you, my good uncle, Lord Protector, show very little gratitude toward the poor boy. I hear that he made you a duke. Yet he was not truly a king, so what is that fine title worth now? Tomorrow you must come to me through Tom and ask me to confirm it. Otherwise you will be no duke at all. You will remain a mere earl.
        - id: ch01-b58
          speaker: narrator
          text: >-
            The Duke of Somerset blushed at the reminder that Tom had raised him from earl to duke. Under Edward's rebuke, he stepped back from the front of the group for a while. Then the true King turned away from his uncle and looked kindly at Tom.
        - id: ch01-b59
          speaker: prince_edward
          text: >-
            Poor boy, how did you remember where I hid the Seal when I could not?
        - id: ch01-b60
          speaker: tom_canty
          text: >-
            That was easy, my King. I used it for several days.
        - id: ch01-b61
          speaker: prince_edward
          text: >-
            You used it, but you could not tell them where it was?
        - id: ch01-b62
          speaker: tom_canty
          text: >-
            I did not know that was what they wanted. No one described it, your Majesty.
        - id: ch01-b63
          speaker: prince_edward
          text: >-
            Then what did you use it for?
        - id: ch01-b64
          speaker: narrator
          text: >-
            Red slowly crept into Tom's cheeks. He lowered his eyes and said nothing. The truth was harmless, but it was hard to confess before the King and the entire court.
        - id: ch01-b65
          speaker: prince_edward
          text: >-
            Speak, good lad. You have nothing to fear. What did you do with the Great Seal of England?
          emotion: calm
        - id: ch01-b66
          speaker: narrator
          text: >-
            Tom stammered for a moment in painful embarrassment. At last, with every important person in England waiting to hear him, he managed to force out the answer.
        - id: ch01-b67
          speaker: tom_canty
          text: >-
            I cracked nuts with it!
        - id: ch01-b68
          speaker: narrator
          text: >-
            An avalanche of laughter greeted the poor child and nearly knocked him off his feet. But the answer settled one last question. If anyone still doubted that Tom Canty was not the King of England and knew nothing about the sacred treasures of royalty, no doubt could survive the news that he had used England's Great Seal as a nutcracker.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Meanwhile, attendants removed the splendid robe of state from Tom's shoulders and placed it over Edward's. The rich cloth completely hid the true King's rags from sight. Everything that had nearly been completed for Tom was now made ready for Edward. Then the interrupted coronation ceremonies began again before the watching multitude. This time the ancient rites belonged to the right boy. Edward was anointed, and the crown of England was set upon his head. Outside the Abbey, cannon thundered the news across the city, and all London seemed to rock with applause.
