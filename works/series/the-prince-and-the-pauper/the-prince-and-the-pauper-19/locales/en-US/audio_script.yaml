  chapters:
    - id: ch01
      title: The Children in the Barn
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The King woke early in the morning. During the night, a wet but thoughtful rat had crept into the stall and made a warm bed in his shirt. Now that Edward was stirring, the rat scampered away.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The boy smiled after it.
        - id: ch01-b03
          speaker: edward_tudor
          text: >-
            Poor fool, why are you afraid? I am as lost and alone as you are. I could never hurt a helpless creature when I am helpless myself. And I owe you thanks for a good omen. When a king has fallen so low that rats make their bed on him, his fortune must soon turn. Plainly, he can fall no lower.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He rose and stepped out of the stall. Just then, he heard children talking nearby in the barn. The barn door opened, and two little girls came in together. The moment they saw him, their laughter stopped. They stood perfectly still and stared. Then they whispered to each other, moved a little closer, and stopped to stare and whisper again.
        - id: ch01-b05
          speaker: narrator
          text: >-
            At last, they found enough courage to speak about him where he could hear.
        - id: ch01-b06
          speaker: prissy
          text: >-
            His face is rather handsome.
        - id: ch01-b07
          speaker: margery
          text: >-
            And he has pretty hair.
        - id: ch01-b08
          speaker: prissy
          text: >-
            But his clothes are terribly poor.
        - id: ch01-b09
          speaker: margery
          text: >-
            And look how hungry he is.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The girls edged nearer and circled him shyly. They examined him from every side as if he were some strange new animal. Still, they stayed watchful, half afraid that this animal might bite. Finally, they stopped in front of him and held hands for protection. After one long, satisfying stare, Prissy gathered all her courage.
        - id: ch01-b11
          speaker: prissy
          text: >-
            Who are you, boy?
        - id: ch01-b12
          speaker: edward_tudor
          text: >-
            I am the King.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Both children started. Their eyes opened wide, and for half a minute neither one spoke. Then curiosity won.
        - id: ch01-b14
          speaker: prissy
          text: >-
            The King? Which king?
        - id: ch01-b15
          speaker: edward_tudor
          text: >-
            The King of England.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The girls looked at each other, then at Edward, then back at each other. They were puzzled and amazed.
        - id: ch01-b17
          speaker: prissy
          text: >-
            Did you hear that, Margery? He says he is the King. Could it really be true?
        - id: ch01-b18
          speaker: margery
          text: >-
            How could it not be true, Prissy? Would he tell a lie? If it were not true, then it would be a lie. It surely would. Think about it. Anything that is not true is a lie. It cannot be anything else.
        - id: ch01-b19
          speaker: narrator
          text: >-
            It was a tight little argument without a leak anywhere, and Prissy's doubts had nothing left to stand on. She thought for a moment, then put the King upon his honor.
        - id: ch01-b20
          speaker: prissy
          text: >-
            If you truly are the King, then I believe you.
        - id: ch01-b21
          speaker: edward_tudor
          text: >-
            I truly am the King.
        - id: ch01-b22
          speaker: narrator
          text: >-
            That settled it. The girls accepted his royal claim without one more question. Then their questions came tumbling out. How had he come there? Why was he dressed in clothes no king would wear? Where was he going? What else had happened to him? Edward felt an enormous relief. At last, he could pour out every trouble without being mocked or doubted. He told the whole tale with such feeling that he even forgot his hunger for a while. The gentle girls listened with deep and tender sympathy.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Then he reached the latest part of his story, and they learned how long he had gone without food. They stopped him at once and hurried him toward the farmhouse for breakfast.
        - id: ch01-b24
          speaker: narrator
          text: >-
            The King was cheerful now. As he went, he made himself a promise.
        - id: ch01-b25
          speaker: edward_tudor
          text: >-
            When I have my own place again, I will always honor little children. These two trusted and believed me when I was in trouble. Older people thought themselves wiser, yet they mocked me and called me a liar.
    - id: ch02
      title: The Widow's Questions
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The girls' mother welcomed Edward kindly and pitied him. His ragged state and what seemed to her a confused mind touched her heart. She was a poor widow who had known enough trouble to feel for anyone in distress.
        - id: ch02-b02
          speaker: narrator
          text: >-
            She supposed the wandering boy had escaped from his friends or keepers. While she prepared the meal, she tried to learn where he belonged so she could send him back. She named nearby towns and villages and questioned him about the country around them. None of it meant anything to him. His face and his answers made that plain.
        - id: ch02-b03
          speaker: narrator
          text: >-
            When Edward spoke of court affairs, he was simple and earnest, as if everything he said were perfectly ordinary. More than once, his voice failed as he talked of the late King, his father. But whenever the widow turned to humbler matters, his interest disappeared. He had nothing to add and soon fell silent.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The woman was deeply puzzled, but she would not give up. As she cooked, she kept inventing ways to surprise the boy into revealing his secret. She spoke of cattle, and he showed no concern. Sheep did no better, so he could not have been a shepherd. She tried mills, weavers, tinkers, smiths, and every kind of trade. She even mentioned Bedlam, prisons, and charitable homes. Nothing worked.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Still, she believed she had narrowed the answer down. He must have worked as a household servant. Yet sweeping only wearied him. Building fires did not stir him. Scrubbing and scouring brought no enthusiasm at all. Almost out of hope, the goodwife mentioned cooking. To her astonishment and delight, Edward's face lit up.
        - id: ch02-b06
          speaker: narrator
          text: >-
            She was sure she had finally caught him. Better still, she felt proud of all the clever turns that had led her to the answer.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Now her tired tongue could rest. Edward was desperately hungry, and wonderful smells rose from the sputtering pots and pans. He began to describe delicious dishes with such eloquence that within three minutes the widow was certain he had worked in a kitchen.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Then he widened his list and spoke with real knowledge and delight about one fine dish after another. The widow could hardly understand it. How could a ragged outcast know so many foods, especially dishes served only to rich and powerful people? Suddenly, it all made sense to her. Before losing his wits, the boy must have served at the palace. Yes, he must have helped in the King's own kitchen. Now she would put that answer to the test.
    - id: ch03
      title: King Alfred's Cakes
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Eager to prove herself right, the widow asked Edward to watch the cooking for a moment. She hinted that he could make another dish or two if he wished. Then she left the room and signaled for her daughters to follow.
        - id: ch03-b02
          speaker: edward_tudor
          text: >-
            Another English king was once given a task like this. I lose no dignity by taking an office that great Alfred accepted. But I shall do better than he did, for he allowed the cakes to burn.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Edward meant well, but his work did not match his promise. Like Alfred, he soon sank into deep thoughts about his vast affairs. The same disaster followed. The food began to burn.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The widow returned just in time to keep the entire breakfast from being ruined. A brisk, hearty scolding quickly pulled the King out of his dreams. Edward was deeply troubled, not simply because the food had burned, but because he had failed a duty that had been trusted to him. When the widow saw how much he cared, her anger melted at once. She softened toward him and treated him with nothing but kindness.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The boy ate a hearty, satisfying meal and felt happy and refreshed. Something curious happened at that breakfast. Both sides set rank aside, though neither one knew the other had done so.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The goodwife had planned to give the young tramp leftover scraps in a corner, as she would feed any other tramp, or even a dog. But now she regretted the scolding she had given him. She wanted to make up for it, so she allowed him to sit at the family table and eat beside his betters, as if all of them met on equal terms.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Edward, on his side, regretted breaking his trust after the whole family had been so kind to him. He too wanted to make amends, so he forced himself to come down to their level. He did not demand that the widow and her children remain standing and wait upon him while he occupied their table alone, with all the ceremony his birth and royal dignity deserved.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Now and then, it does everyone good to bend a little. The widow spent the day happily praising herself for treating a tramp with such noble generosity. The King was just as pleased with himself for showing gracious humility to a poor countrywoman.
    - id: ch04
      title: A King at Work
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            When breakfast ended, the housewife told Edward to wash the dishes. For a moment, the command nearly drove him to rebel. Then he thought of Alfred again.
        - id: ch04-b02
          speaker: edward_tudor
          text: >-
            Alfred the Great watched the cakes. No doubt he would have washed the dishes as well. Therefore, I shall attempt it.
        - id: ch04-b03
          speaker: narrator
          text: >-
            He did a poor job, much to his own surprise. Cleaning a few wooden spoons and trenchers had looked like the easiest thing in the world. Once he began, it proved slow, tedious, and troublesome. He kept at it, however, until the last piece was finally done.
        - id: ch04-b04
          speaker: narrator
          text: >-
            By then, Edward was growing impatient to continue his journey. But the thrifty widow was not ready to let such a useful pair of hands escape so easily. She kept finding little odds and ends for him to do. Edward worked through them one by one, doing each task fairly well and earning some credit for his efforts.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Next, she had him and the little girls peel winter apples. Edward handled the work so awkwardly that she soon took him off it and gave him a butcher knife to sharpen.
        - id: ch04-b06
          speaker: narrator
          text: >-
            After that, she kept him carding wool. Before long, the King felt he had left good King Alfred far enough behind for one day. These humble acts of heroism might look splendid and picturesque when someone wrote them down in storybooks and histories. Doing them was another matter. Edward was more than half ready to give up his new career.
    - id: ch05
      title: The Visitors at the Gate
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Just after the midday meal, the goodwife handed him a basket of kittens and ordered him to drown them. That settled the matter. The King resigned from her service. Or rather, he was just about to resign. He felt that even a king willing to follow Alfred's example must draw the line somewhere, and kitten drowning seemed exactly the right place to draw it.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Then something interrupted him. John Canty was coming toward the farmhouse with a peddler's pack on his back. Hugo walked beside him.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Edward spotted the two villains near the front gate before they saw him. He said nothing about resigning. Instead, he picked up the basket and quietly slipped out the back without a word.
        - id: ch05-b04
          speaker: narrator
          text: >-
            He left the kittens safe in an outbuilding, then hurried into the narrow lane behind the farmhouse.
