    edward_tudor:
      display_name: Edward Tudor
      tts:
        delivery: youthful, dignified, and earnest
        timbre: clear and light
        pace: measured
        pitch: medium-high
    margery:
      display_name: Margery
      tts:
        delivery: shy, thoughtful, and sincere
        timbre: soft and bright
