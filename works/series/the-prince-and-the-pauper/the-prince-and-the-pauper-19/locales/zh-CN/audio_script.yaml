audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华亲王
      tts:
        delivery: 高贵坚定，受辱时仍保持尊严
        timbre: 清亮稚嫩
        pace: 从容有力
        pitch: 中高
    prissy:
      display_name: 普丽茜
      tts:
        delivery: 天真直率，好奇时大胆发问
        timbre: 清脆稚嫩
        pace: 轻快自然
        pitch: 高
    margery:
      display_name: 玛杰丽
      tts:
        delivery: 单纯认真，说话带着孩子气的笃定
        timbre: 柔和稚嫩
        pace: 稍慢而清楚
        pitch: 高
    widow:
      display_name: 农妇
      tts:
        delivery: 热心能干，盘算时自信而絮叨
        timbre: 朴实温厚
        pace: 明快
        pitch: 中等
  chapters:
    - id: ch01
      title: 谷仓里的两位小客人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 清早，国王醒了。他发现一只湿漉漉的老鼠夜里钻进畜栏，还在他怀里做了个暖和的窝。老鼠受到惊动，一溜烟跑掉。国王看着它逃走，笑了。
        - id: ch01-b02
          speaker: prince_edward
          text: 可怜的傻东西，你怕什么？我和你一样孤苦无助，怎么会去伤害你呢？再说，我还得谢谢你送来好兆头。一位国王落魄到连老鼠都拿他当床，运气准该转了。他已经不可能跌得更低啦。
        - id: ch01-b03
          speaker: narrator
          text: 他走出畜栏，正好听见孩子的声音。谷仓门开了，两个小姑娘走进来。一见到他，她们立刻不说也不笑了，只站在那里好奇地盯着他。两个孩子先是悄悄议论，接着走近几步，又停下来打量。胆子渐渐大了，她们索性当面说了起来。
        - id: ch01-b04
          speaker: prissy
          text: 他长得真好看。
        - id: ch01-b05
          speaker: margery
          text: 头发也漂亮。
        - id: ch01-b06
          speaker: prissy
          text: 可衣服破得太厉害了。
        - id: ch01-b07
          speaker: margery
          text: 而且他饿得好瘦啊。
        - id: ch01-b08
          speaker: narrator
          text: 她们羞怯地围着国王挪来挪去，从各个方向仔细看他，好像遇见了一只从未见过的动物。可两人又很小心，仿佛担心这只动物会咬人。最后，她们拉住彼此的手壮胆，站在他面前看了个够。一个孩子终于鼓起勇气，直接问他。
        - id: ch01-b09
          speaker: prissy
          text: 小子，你到底是什么人？
        - id: ch01-b10
          speaker: prince_edward
          text: 我是国王。
        - id: ch01-b11
          speaker: narrator
          text: 两个孩子吃了一惊，眼睛睁得溜圆，足足半分钟没说话。最后，还是好奇心先开了口。
        - id: ch01-b12
          speaker: prissy
          text: 国王？你是哪一位国王？
        - id: ch01-b13
          speaker: prince_edward
          text: 英格兰国王。
        - id: ch01-b14
          speaker: narrator
          text: 两个小姑娘互相看看，又看看他，再互相看看，实在弄不明白。
        - id: ch01-b15
          speaker: prissy
          text: 玛杰丽，你听见了吗？他说自己是国王。这能是真的吗？
        - id: ch01-b16
          speaker: margery
          text: 怎么会不真呢，普丽茜？他总不会说假话吧？你想，如果这件事不是真的，那就是假话。凡是不真的事都是假话，怎么也变不成别的呀。
        - id: ch01-b17
          speaker: narrator
          text: 这番道理严丝合缝，一点破绽也没有，普丽茜仅剩的疑虑顿时站不住了。她想了想，只要求国王亲口保证。
        - id: ch01-b18
          speaker: prissy
          text: 只要你当真是国王，我就相信你。
        - id: ch01-b19
          speaker: prince_edward
          text: 我当真是国王。
        - id: ch01-b20
          speaker: narrator
          text: 事情就这么定了。两个女孩不再追问，也不再争辩，完全承认了他的国王身份。她们马上问他怎么来到这里，为什么穿得一点也不像国王，接下来又要去哪里，还想知道他经历过的每一件事。国王终于遇见既不嘲笑、也不怀疑自己的人，顿时如释重负。他动情地讲起一路上的苦难，连饥饿都暂时忘了。两个温柔的孩子听得满心同情。可一听说他已经很久没吃东西，她们立刻打断故事，匆匆带他赶往农舍找早饭。
        - id: ch01-b21
          speaker: narrator
          text: 国王心里又轻松又快活。他暗自许下心愿。
        - id: ch01-b22
          speaker: prince_edward
          text: 等我重掌王位，一定永远敬重孩子。患难时相信我的，正是她们。那些年纪更大、自以为聪明的人，却只会嘲笑我，把我当成骗子。
    - id: ch02
      title: 主妇的推断
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 孩子们的母亲和善地接待了国王。她看他孤零零的，神志似乎也不清楚，心里十分怜悯。她是个贫寒的寡妇，自己吃过不少苦，所以更同情不幸的人。她猜，这个孩子准是从亲友或看护人身边走失了，便打听他从哪里来，好设法送他回去。
        - id: ch02-b02
          speaker: narrator
          text: 她把附近的城镇村庄挨个问了一遍，可从国王的神情和回答来看，他显然一个也不熟。她沿着这条线索反复打听，仍旧一无所获。国王谈起宫廷时，认真又坦率。说到已故的国王，也就是“他的父亲”，还不止一次哽咽得说不下去。可话题一转到低微的寻常琐事，他马上没了兴趣，沉默起来。
        - id: ch02-b03
          speaker: narrator
          text: 妇人很困惑，却不肯放弃。她边做饭边想办法，打算趁孩子没有防备，套出他的真实来历。她先说牛，孩子毫不关心。再说羊，还是一样。看来她先前猜他是个牧羊童，已经猜错了。她又谈到磨坊、织工、补锅匠、铁匠，还把各行各业的手艺和商人说了个遍。后来，她连疯人院、监牢和慈善收容所都提到了，可无论从哪里试探，还是处处碰壁。
        - id: ch02-b04
          speaker: narrator
          text: 不过，她觉得自己至少排除了不少答案，现在只剩下家仆这一条路。对，这回准不会错，他过去一定在人家做过仆役。她试着说起家务。扫地只让国王厌烦，生火引不起兴趣，擦洗刷洗也不能叫他动心。主妇几乎不抱希望了，最后只当例行试探，随口提到做饭。没想到，国王的脸立刻亮了起来。她又惊又喜，认定自己总算查出了真相，还为这番聪明又迂回的试探得意极了。
        - id: ch02-b05
          speaker: narrator
          text: 这下，妇人说累了的舌头可以休息了。国王饿得厉害，锅里又滋滋作响，飘出阵阵香味。他一下打开了话匣子，滔滔不绝地说起几道美味的菜。还不到三分钟，妇人便在心里下了结论。
        - id: ch02-b06
          speaker: widow
          text: 我果然没猜错，这孩子在厨房里帮过忙！
        - id: ch02-b07
          speaker: narrator
          text: 可国王越说越多，而且每一道都是富贵人家才吃得到的好菜。主妇听得又起了疑心，接着便恍然大悟。
        - id: ch02-b08
          speaker: widow
          text: 我的天，他怎么知道这么多名贵菜肴？我明白了！他发疯以前准在王宫当过差，没准就在国王的厨房里帮忙。我要试试他。
        - id: ch02-b09
          speaker: narrator
          text: 她急着证明自己的聪明，便让国王暂时看着炉上的饭菜，还暗示他若是愿意，尽管亲手再做一两道菜添进去。随后，她走出屋子，又给两个女儿使了个眼色，叫她们跟来。国王独自留在厨房，低声自语。
        - id: ch02-b10
          speaker: prince_edward
          text: 从前也有一位英格兰国王受过这样的差遣。伟大的阿尔弗雷德都肯做，我接下这件差事，也不会有损尊严。不过，我得比他尽职。他可是把饼烤煳了。
        - id: ch02-b11
          speaker: narrator
          text: 国王用心虽好，结果却不怎么样。他和阿尔弗雷德一样，很快就想起那些关乎天下的大事，陷入沉思。于是，同样的灾难发生了，饭菜也烧煳了。妇人及时回来，才没有让早饭全毁掉。她劈头盖脸训了国王一顿，把他从梦里骂醒。可一见他因为辜负托付而难过，她马上心软下来，又温和地待他。
    - id: ch03
      title: 国王在农家做活
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 国王饱饱吃了一顿，精神大振，也重新高兴起来。这顿饭最奇妙的地方，是双方都觉得自己放下了身份，却谁也不知道对方同样这样想。
        - id: ch03-b02
          speaker: narrator
          text: 主妇本来只想把残羹剩饭丢在角落，让这个小流浪汉像其他流浪汉，甚至像狗一样蹲在那里吃。可她想起刚才那顿责骂，心里十分过意不去。为了尽量补偿，她便准他坐到全家的桌边，和她眼中身份比他高的人一起用餐，表面上也算平起平坐。
        - id: ch03-b03
          speaker: narrator
          text: 国王也为自己没照看好饭菜而过意不去。这家人待他这么和善，他只好勉强屈尊，和她们同桌，算是补偿自己的失职。他没有要求母女三人站在旁边侍候，也没有依照自己的出身和尊严，独自庄严地占据餐桌。偶尔放下身段，对大家都有好处。
        - id: ch03-b04
          speaker: narrator
          text: 主妇一整天都在心里称赞自己。她觉得，肯屈尊和一个流浪汉同桌，实在宽宏大量，这让她从早到晚都很愉快。国王同样十分满意，觉得自己肯纡尊降贵，迁就一个卑微的农妇，也真是谦逊仁慈。
        - id: ch03-b05
          speaker: narrator
          text: 吃完早饭，主妇叫国王去洗碗。这道命令把他惊住了，他差一点就要反抗。不过，他很快又用阿尔弗雷德来说服自己。
        - id: ch03-b06
          speaker: prince_edward
          text: 阿尔弗雷德大帝既然肯照看烤饼，想必也肯洗碗。那我也来试试。
        - id: ch03-b07
          speaker: narrator
          text: 这件事他做得很糟，连自己都意外。清洗木匙和木盘原本看着很容易，真正动手，却是件既烦琐又麻烦的差事。好在他费了一番力气，终于还是完成了。此时，国王已经越来越不耐烦，一心想继续赶路。可要摆脱这位勤俭主妇的安排，并没有那么容易。她又交来几样零碎活儿，这几件事他完成得还算像样，也多少值得夸奖。
        - id: ch03-b08
          speaker: narrator
          text: 接着，主妇叫他和两个女孩削过冬储存的苹果。他实在笨手笨脚，只好被撤下来，改去磨一把屠刀。后来，她又让他不停地梳理羊毛。国王渐渐觉得，论起那些写进故事书和历史书便显得漂亮动人的仆役英雄事迹，自己今天做得已经够多，早把善良的阿尔弗雷德远远甩在后面。他开始认真考虑辞掉这份差事。
        - id: ch03-b09
          speaker: narrator
          text: 午饭刚过，主妇又给了他一篮小猫，要他拿去淹死。国王这回真的决定不干了。至少，他正准备辞掉这些差事。凡事总要划一条界线，而他觉得，把界线划在淹死小猫这里正合适。可他还没来得及开口，就有人打断了他。
        - id: ch03-b10
          speaker: narrator
          text: 来的是约翰·坎蒂和雨果。坎蒂背着小贩的货包，两人正向前门走来。
    - id: ch04
      title: 从后门逃走
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 国王先看见了两个恶棍正朝前门走来，他们却还没有发现他。于是，他不再说什么界线，也没有开口惊动任何人，只提起那篮小猫，一声不响地从后门飞快溜了出去。
        - id: ch04-b02
          speaker: narrator
          text: 他把小猫留在一间外屋里，随后赶紧钻进屋后那条狭窄的小巷，逃走了。
