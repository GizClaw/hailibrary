audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    tom_canty:
      display_name: 汤姆·康蒂
      tts:
        delivery: 天真敏捷，窘迫时带着平民孩子的直率
        timbre: 清亮稚嫩
        pace: 轻快灵活
        pitch: 中高
    palace_voice_1:
      display_name: 宫中传令声甲
      tts:
        delivery: 庄严有力，带着王室仪仗的威势
        timbre: 洪亮清晰
        pace: 稳健
        pitch: 中等
    palace_voice_2:
      display_name: 宫中传令声乙
      tts:
        delivery: 庄严有力，呼应清楚利落
        timbre: 明亮饱满
        pace: 稳健
        pitch: 中高
    palace_voice_3:
      display_name: 宫中传令声丙
      tts:
        delivery: 庄严有力，声音沉着雄浑
        timbre: 低沉浑厚
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 王权光明的一面
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            真正的国王还在英格兰四处流浪。他衣衫褴褛，吃不饱饭。流浪汉打他、骂他、嘲笑他，后来他又被关进牢里，和盗贼、杀人犯混在一起。不管遇上谁，人家都一样叫他傻子、骗子。可假国王汤姆·康蒂过的，完全是另一种日子。
        - id: ch01-b02
          speaker: narrator
          text: >-
            上回说到汤姆，他刚尝到一点王权的好处。往后的每一天，那一面都变得更明亮。没过多久，他眼前几乎只剩阳光和欢喜。害怕没了，疑心散了，原先的窘迫也让位给从容和自信。
        - id: ch01-b03
          speaker: narrator
          text: >-
            那个替国王挨鞭子的孩子，也越来越派得上用场。汤姆想玩耍或说话，就召伊丽莎白公主和小珍·格雷女士前来。等他尽了兴，再叫她们退下，做得像是早已习惯了一样。临别时，两人俯身亲吻他的手，他也不再慌乱。
    - id: ch02
      title: 排场与荣光
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            到了夜里，一大群人郑重地送汤姆上床。早晨，又有人按照繁复庄严的礼节替他穿衣。他渐渐爱上了这一套。最叫他得意的，是去用膳时那支辉煌的队伍。国务官员和侍卫簇拥在身边，陪他一路走过王宫。
        - id: ch02-b02
          speaker: narrator
          text: >-
            汤姆喜欢这份排场，索性把贴身侍卫增加一倍，凑足一百人。他听着号角声沿长廊传来，远处也响起一阵阵呼喊。
        - id: ch02-b03
          speakers: [palace_voice_1, palace_voice_2, palace_voice_3]
          ensemble: chorus
          text: 国王驾到，让路！
        - id: ch02-b04
          speaker: narrator
          text: >-
            后来，就连坐在王座上主持会议，他也觉得有趣。看上去，他已经不只是替摄政大臣传话了。显赫的大使带着华服随从前来觐见，替各国君王送上亲切问候。那些君王还称他为兄弟。汤姆·康蒂真是走运，毕竟不久前，他还住在残渣院呢！
        - id: ch02-b05
          speaker: narrator
          text: >-
            华美的衣裳让他十分开心，他便下令再做更多。四百名仆役似乎也撑不起国王的排场，于是他把人数添到了三倍。朝臣俯首行礼，句句都是奉承。如今，这些话在汤姆耳中就像甜美的音乐。
    - id: ch03
      title: 一颗人心
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            不过，汤姆依然仁慈温和。他坚定地保护受压迫的人，也一直和不公的法律作对。可谁要是惹恼了他，哪怕是伯爵或公爵，他猛地看过去一眼，也能叫那位贵族发抖。
        - id: ch03-b02
          speaker: narrator
          text: >-
            有一回，他名义上的王姐玛丽公主来劝他。玛丽虔诚得近乎冷酷，觉得汤姆不该赦免那么多人。没有他的恩典，那些人本来应该坐牢、上绞架，或者被火烧死。她还说，他们威严的先父曾让监狱一次关进六万名囚犯，在那段值得赞颂的统治里，更有七万二千名盗贼和强盗被交给刽子手处死。
        - id: ch03-b03
          speaker: narrator
          text: >-
            汤姆听完，心里涌起一股正直的怒火。他命玛丽回到自己的内室，向上帝祈祷。
        - id: ch03-b04
          speaker: tom_canty
          text: 求上帝拿走你胸膛里那块石头，赐给你一颗人心！
          emotion: angry
    - id: ch04
      title: 渐渐淡去的面孔
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            难道汤姆从来没为那位真正的小王子忧心过吗？当然不是。爱德华曾待他十分和善。宫门口的卫兵欺负汤姆时，王子还满腔怒火地冲出去，要替他讨回公道。汤姆没有忘记这些事。
        - id: ch04-b02
          speaker: narrator
          text: >-
            刚当上国王的那些日夜里，他常常痛苦地想起失踪的王子。他真心盼着爱德华回来，重新得到原本属于他的王位和荣华。可是日子久了，爱德华始终没有出现。汤姆的新生活那么新奇，那么迷人，渐渐占满了他的心。
        - id: ch04-b03
          speaker: narrator
          text: >-
            那位消失的君王，就这样一点点淡出了汤姆的思绪。后来，爱德华偶尔再闯进他的脑海，已经像个不受欢迎的幽灵，只会让他内疚，让他羞愧。
        - id: ch04-b04
          speaker: narrator
          text: >-
            汤姆可怜的母亲和两个姐姐，也顺着同一条路走出了他的心。起初，他思念她们，为她们难过，一心盼着再见到她们。可到后来，他只要想到她们可能穿着破衣、满身污垢地来到王宫，就会害怕得发抖。
        - id: ch04-b05
          speaker: narrator
          text: >-
            她们会不会用亲吻暴露他的身份，把他从高位上拉下来，再拖回贫困、屈辱和贫民窟？最后，汤姆几乎不再想她们了。他很满足，甚至暗自庆幸。因为那几张哀伤又责备的脸一旦浮现，他就觉得自己卑贱得连地上爬的虫子都不如。
    - id: ch05
      title: 加冕前夜
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            二月十九日午夜，汤姆·康蒂躺在王宫华贵的床上，正慢慢睡去。忠诚的臣仆守护着他，王室的荣华环绕着他。他是个快乐的孩子，因为明天，他就要接受庄严的加冕，成为英格兰国王。
        - id: ch05-b02
          speaker: narrator
          text: >-
            就在同一时刻，真正的国王爱德华正站在威斯敏斯特大教堂外。他又饿又渴，浑身又脏又湿，走了这么远的路，早已疲惫不堪。那场骚乱留给他的，只剩身上一片片破布。他被紧紧挤在人群中。
        - id: ch05-b03
          speaker: narrator
          text: >-
            所有人都兴致勃勃地望着一队队工匠。他们匆匆进出大教堂，忙得像一群蚂蚁，正在为王室加冕礼做最后的准备。
