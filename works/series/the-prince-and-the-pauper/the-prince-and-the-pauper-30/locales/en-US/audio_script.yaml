audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently ironic
        timbre: clear and resonant
        pace: measured
        pitch: medium
    tom_canty:
      display_name: Tom Canty
      tts:
        delivery: youthful, earnest, and increasingly assured
        timbre: clear and light
        pace: natural
        pitch: medium-high
    palace_voice_1:
      display_name: Palace Voice One
      tts:
        delivery: formal and commanding
        timbre: clear and strong
        pace: measured
        pitch: medium
    palace_voice_2:
      display_name: Palace Voice Two
      tts:
        delivery: formal and commanding
        timbre: bright and strong
        pace: measured
        pitch: medium-high
    palace_voice_3:
      display_name: Palace Voice Three
      tts:
        delivery: formal and commanding
