audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    tom_canty:
      display_name: 汤姆·康第
      tts:
        delivery: 诚恳谦卑，容易受惊，情急时带着孩子气
        timbre: 清亮稚嫩
        pace: 稍快
        pitch: 中高
    page:
      display_name: 侍童
      tts:
        delivery: 正式利落，恪守宫廷礼节
        timbre: 清亮年轻
        pace: 中等
        pitch: 中高
    lady_jane_grey:
      display_name: 简·格雷小姐
      tts:
        delivery: 温柔端庄，真挚而敏感
        timbre: 明亮柔和
        pace: 中等
        pitch: 中高
    royal_official:
      display_name: 王室官员
      tts:
        delivery: 庄严威严，宣告时字字分明
        timbre: 洪亮浑厚
        pace: 稍慢
        pitch: 中低
    king_henry_viii:
      display_name: 亨利八世
      tts:
        delivery: 威严强硬，偶尔流露突然而深切的慈爱
        timbre: 低沉厚重
        pace: 稍慢
        pitch: 低
    physician:
      display_name: 宫廷医师
      tts:
        delivery: 恭敬稳重，判断时笃定审慎
        timbre: 平滑成熟
        pace: 中等
        pitch: 中低
    lord_hertford:
      display_name: 赫特福德勋爵
      tts:
        delivery: 谨慎守礼，服从中带着分寸
        timbre: 沉稳成熟
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 独自在王子书房
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 王子走后，书房里只剩下汤姆·康第。他可没浪费这个机会，站在大镜子前左转右转，把身上的华服看个够。接着，他学起王子那种高贵的步态，一边走，一边从镜中察看自己究竟像不像。
        - id: ch01-b02
          speaker: narrator
          text: 他又拔出那柄漂亮的剑，先鞠躬，再吻过剑身，把剑横在胸前。五六个星期以前，他见过一位尊贵的骑士这样向伦敦塔总管致意。当时，那位骑士正把诺福克和萨里两位大贵族交给总管监禁。
        - id: ch01-b03
          speaker: narrator
          text: 汤姆把玩着腿旁的宝石匕首，又仔细端详屋里每一件昂贵精巧的摆设。那些豪华的椅子，他一把接一把，全坐了个遍。
        - id: ch01-b04
          speaker: narrator
          text: 他不禁想，要是垃圾大院那帮人能从门缝里看见他现在的尊贵模样，他该多么得意。等他回到家，说起这段奇遇，那些人会相信吗？还是会摇着头说，他一天到晚胡思乱想，终于把脑子想坏了？
        - id: ch01-b05
          speaker: narrator
          text: 半个钟头过去，汤姆忽然发觉，王子已经离开很久了。他马上觉得孤单起来，侧耳盼着王子回来。身边那些漂亮东西，他再也无心碰了。他先是不安，接着焦躁，最后真的害怕起来。
        - id: ch01-b06
          speaker: narrator
          text: 要是有人进来，看见他穿着王子的衣裳，王子却不在这里替他说明，那可怎么办？说不定，他们会先把他绞死，事后才查问原委。汤姆早听说过，大人物处置小事情，向来快得很。
        - id: ch01-b07
          speaker: narrator
          text: 他越想越怕，浑身直抖，悄悄打开了通往前厅的门。他想逃出去找到王子，请王子保护他，放他自由。谁知门一开，六个衣饰华丽的男仆和两个出身高贵的小侍童，全都站了起来。他们打扮得像蝴蝶一样鲜艳，一齐向他深深鞠躬。汤姆赶紧缩回书房，关上了门。
        - id: ch01-b08
          speaker: tom_canty
          text: 啊，他们是在取笑我！他们马上就会去告发我。我为什么要跑到这里来，把自己的命白白送掉？
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: 汤姆在屋里走来走去，心里装满了连名字也说不出的恐惧。他竖起耳朵听着，一丁点声响都能把他吓得跳起来。
    - id: ch02
      title: 可怕的耳语
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 没过多久，门忽然开了。一个穿绸衣的侍童站在那里，恭敬地通报来客。
        - id: ch02-b02
          speaker: page
          text: 简·格雷小姐到。
        - id: ch02-b03
          speaker: narrator
          text: 门又关上了。一个衣着华贵、模样甜美的少女，轻快地朝汤姆跑来。可她猛地停住了，看出眼前的情形很不对劲。
        - id: ch02-b04
          speaker: lady_jane_grey
          text: 殿下，您这是怎么了？
        - id: ch02-b05
          speaker: narrator
          text: 汤姆几乎喘不过气，好不容易才挤出话来。
        - id: ch02-b06
          speaker: tom_canty
          text: 求您可怜可怜我！我根本不是什么殿下，只是城里垃圾大院的穷孩子汤姆·康第。请让我见王子吧。他会把破衣裳还给我，让我平平安安地走。求您发发慈悲，救救我！
          emotion: fearful
        - id: ch02-b07
          speaker: narrator
          text: 这时，汤姆已经跪在了地上。他嘴里苦苦哀求，眼睛和高举的双手也都在求救。简小姐吓得脸色都变了。
        - id: ch02-b08
          speaker: lady_jane_grey
          text: 殿下！您怎么能跪在我面前？
          emotion: surprised
        - id: ch02-b09
          speaker: narrator
          text: 她惊慌地逃走了。汤姆彻底绝望，瘫倒在地。
        - id: ch02-b10
          speaker: tom_canty
          text: 这下没人救得了我，一点希望都没了。他们马上就会来抓我。
          emotion: fearful
        - id: ch02-b11
          speaker: narrator
          text: 汤姆躺在那里，吓得全身麻木。与此同时，一个可怕的消息已经传遍王宫。当然，这消息始终只敢用耳语来传。它从一个仆役溜到另一个仆役耳边，又从贵族那里钻到贵妇身旁，穿过长廊，爬上楼层，从一间大厅传进下一间大厅。大家说的都是同一句话，王子疯了，王子疯了。
        - id: ch02-b12
          speaker: narrator
          text: 没过多久，每一间厅堂、每一座大理石殿里，都聚满衣饰闪耀的贵族男女，旁边还站着一群群同样耀眼、身份却低些的人。人人神色惊慌，只敢凑近了郑重低语。
        - id: ch02-b13
          speaker: narrator
          text: 随后，一位盛装显赫的官员，庄严地从这些人群面前走过，朗声宣告国王的命令。
        - id: ch02-b14
          speaker: royal_official
          text: 奉国王之名！这个消息荒唐虚假，任何人都不准听信，不准议论，也不准传到宫外。违令者处死！这是国王的命令！
        - id: ch02-b15
          speaker: narrator
          text: 所有耳语一下子全停了，仿佛说话的人同时变成了哑巴。可很快，长廊中又起了一片低低的嗡嗡声。王子来了，王子来了。
        - id: ch02-b16
          speaker: narrator
          text: 可怜的汤姆慢慢走过一排排深深弯腰的人群。他尽力给每个人还礼，又用茫然而凄楚的眼睛，温顺地看着周围这个陌生的世界。两位大贵族一左一右陪着，让他倚在他们身上，免得脚步不稳。宫廷医师和几个仆人跟在后面。
    - id: ch03
      title: 面见国王
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 汤姆被带进宫中一间富丽堂皇的屋子，门在他身后关上。陪他来的人都站在四周。前面不远处，有一个身躯庞大、肥胖异常的男人，斜靠在卧榻上。他脸盘宽阔松软，神情严厉，硕大的脑袋已经灰白。一圈灰白的胡须沿着脸庞生长，像给那张脸镶了一道边框。
        - id: ch03-b02
          speaker: narrator
          text: 男人的衣服料子名贵，却已经旧了，还有几处磨损。一条肿腿垫在枕头上，裹满绷带。屋里静悄悄的。除了这个男人，每个人都敬畏地低着头。这位面容严峻的病人，就是人人惧怕的亨利八世。开口时，他的神色温和下来。
        - id: ch03-b03
          speaker: king_henry_viii
          text: 怎么了，爱德华殿下，我的王子？父王这样疼你、善待你，你却要拿这种可怜的玩笑来哄骗我吗？
        - id: ch03-b04
          speaker: narrator
          text: 汤姆脑子里昏昏沉沉，只勉强听进开头几句话。可一听那人自称父王，他的脸立刻白了，双膝猛地落地，快得就像挨了一枪。他举起双手，失声叫了出来。
        - id: ch03-b05
          speaker: tom_canty
          text: 您就是国王？那我这回可真完了！
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: 这句话仿佛把亨利也震住了。他茫然地看过一张张脸，最后才把困惑的目光落在男孩身上。国王失望极了。
        - id: ch03-b07
          speaker: king_henry_viii
          text: 唉，我原以为传言夸大了实情。现在看来，恐怕一点也没有。到父王这里来吧，孩子，你病了。
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: 有人扶汤姆站起来。他谦卑地发着抖，走近英格兰的国王。亨利双手捧着那张惊恐的小脸，满怀爱怜地看了许久，像是要找到一点理智恢复的迹象。随后，他把那颗鬈发的脑袋抱到胸前，温柔地拍了拍。
        - id: ch03-b09
          speaker: king_henry_viii
          text: 孩子，你连父王也不认得了吗？别让我的这颗老心碎掉。告诉我，你知道我是谁。你还认得我，对不对？
          emotion: sad
        - id: ch03-b10
          speaker: tom_canty
          text: 认得。您是我敬畏的国王陛下，愿上帝保佑您！
        - id: ch03-b11
          speaker: king_henry_viii
          text: 对，对，这就好了。放心，别再抖了。这里没有人会伤害你，每个人都爱你。你已经好些了，那个可怕的梦就快过去了。听说你刚才把自己说成别人，以后不会再这么说了，是不是？
          emotion: calm
        - id: ch03-b12
          speaker: tom_canty
          text: 求陛下相信我，我说的真的都是实话。我生来就是穷人，是您所有臣民里最卑微的一个。一场倒霉的意外把我送到这里，这不是我的错。我还这么小，不该现在就死。您只要说一句话，就能救我。陛下，请您快说吧！
          emotion: fearful
        - id: ch03-b13
          speaker: king_henry_viii
          text: 死？亲爱的王子，别再说了。把心放下，你不会死！
          emotion: calm
        - id: ch03-b14
          speaker: narrator
          text: 汤姆高兴得叫出声来，又一次跪在地上。
        - id: ch03-b15
          speaker: tom_canty
          text: 愿上帝报答您的仁慈，我的国王！愿上帝长久保佑您，让您一直造福这片国土！
          emotion: happy
        - id: ch03-b16
          speaker: narrator
          text: 他一下跳起来，满脸喜色地转向旁边侍立的两位贵族。
        - id: ch03-b17
          speaker: tom_canty
          text: 你们都听见了！我不用死了，是国王亲口说的！
          emotion: happy
        - id: ch03-b18
          speaker: narrator
          text: 没有人回答。众人只庄重地弯腰行礼，除此之外，连动都没有动。汤姆愣了一下，有些窘迫，又怯生生地回头问国王。
        - id: ch03-b19
          speaker: tom_canty
          text: 那么，我现在可以走了吗？
        - id: ch03-b20
          speaker: king_henry_viii
          text: 走？你想走，当然可以。可为什么不再留一会儿？你打算去哪里？
        - id: ch03-b21
          speaker: narrator
          text: 汤姆低下眼睛，谦卑地回答。
        - id: ch03-b22
          speaker: tom_canty
          text: 也许是我弄错了。我以为自己已经自由，就想回到出生长大的那条破巷去。那里虽然只有苦日子，可我的母亲和两个姐姐都在，所以那儿才是我的家。这些荣华气派，我实在不习惯。陛下，求您让我走吧！
    - id: ch04
      title: 考验王子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 国王沉默着想了一会儿，脸上的忧愁和不安越来越深。过了片刻，他的声音里又有了一点希望。
        - id: ch04-b02
          speaker: king_henry_viii
          text: 也许他只是想到这件事时才会发疯，别的事情还很清醒。愿上帝让事情果真如此。我们来试试他。
        - id: ch04-b03
          speaker: narrator
          text: 亨利用拉丁语问了汤姆一个问题。汤姆也用拉丁语勉强作答。贵族和医师们听见了，都露出欣慰的神色。
        - id: ch04-b04
          speaker: king_henry_viii
          text: 这回答配不上他平日所受的教导，也配不上他的才智。不过，这足以说明他的心智只是病了，并没有彻底毁掉。医师，你怎么看？
        - id: ch04-b05
          speaker: narrator
          text: 那位医师深深鞠了一躬。
        - id: ch04-b06
          speaker: physician
          text: 陛下判断得完全正确，这也正是臣的看法。
        - id: ch04-b07
          speaker: narrator
          text: 这番鼓励来自一位最可靠的权威，国王听了十分高兴，又振作起精神。
        - id: ch04-b08
          speaker: king_henry_viii
          text: 你们都看仔细了。我们再试他一次。
        - id: ch04-b09
          speaker: narrator
          text: 他改用法语问了汤姆一个问题。所有人的眼睛都盯着汤姆，他尴尬地沉默了一会儿，才迟疑着回答。
        - id: ch04-b10
          speaker: tom_canty
          text: 请陛下恕罪，我不懂这种语言。
        - id: ch04-b11
          speaker: narrator
          text: 国王一下倒在卧榻上。侍从赶紧上前搀扶，他却挥手让他们退开。
        - id: ch04-b12
          speaker: king_henry_viii
          text: 不用管我，只是一阵讨厌的昏眩。扶我坐起来。好了，这样就够了。过来吧，孩子，把你那颗烦乱的小脑袋靠在父王心口，好好静一静。你很快就会康复，这不过是一阵短暂的幻症。别怕，你很快就会好的。
          emotion: calm
        - id: ch04-b13
          speaker: narrator
          text: 接着，亨利转向众人。他脸上的温柔消失了，眼里闪起危险的光。
        - id: ch04-b14
          speaker: king_henry_viii
          text: 你们全都听着！我儿子是疯了，可这病不会长久。书读得太多，又关得太久，才会变成这样。把他的书和老师全都撤走！让他多玩耍，用有益身心的法子给他解闷，直到他恢复健康。
        - id: ch04-b15
          speaker: narrator
          text: 国王勉强把身体撑得更高，越说越有力气。
        - id: ch04-b16
          speaker: king_henry_viii
          text: 他虽然疯了，却仍是我的儿子，是英格兰的王位继承人。不管他疯还是不疯，他照样会登上王位！你们还要把这条命令传出去。谁敢谈论他的病情，谁就是在扰乱这片国土的安宁与秩序，必须送上绞架！
          emotion: angry
        - id: ch04-b17
          speaker: king_henry_viii
          text: 给我水喝。我浑身发烫，这场悲痛快要耗尽我的力气了。好了，把杯子拿走。扶住我。对，这样就好。
        - id: ch04-b18
          speaker: king_henry_viii
          text: 你们说他疯了？哪怕他疯上一千倍，也还是威尔士亲王。我是国王，这身份由我来确认！就在明天，必须按照古老而正当的仪式，正式授予他亲王的尊位。赫特福德勋爵，马上去安排。
          emotion: angry
        - id: ch04-b19
          speaker: narrator
          text: 一位贵族走到国王的卧榻前，跪了下来。
        - id: ch04-b20
          speaker: lord_hertford
          text: 国王陛下知道，英格兰的世袭大元帅已经被判罪，如今关在伦敦塔里。让一个获罪的人主持仪式，恐怕不合适……
        - id: ch04-b21
          speaker: king_henry_viii
          text: 住口！别拿他那可恨的名字来侮辱我的耳朵。难道这个人要永远活下去吗？难道我的意志还得受他阻挠？就因为全国找不到一个没沾上叛国罪名的伯爵元帅，王子就不能得到应有的尊位吗？不，以上帝的荣光起誓，绝不行！去警告我的议会。太阳再次升起以前，他们必须把诺福克的判决送来。不然，他们会为此付出惨痛的代价！
          emotion: angry
        - id: ch04-b22
          speaker: narrator
          text: 赫特福德勋爵答道。
        - id: ch04-b23
          speaker: lord_hertford
          text: 国王的意志就是法律。
        - id: ch04-b24
          speaker: narrator
          text: 说完，他站起身，退回原来的位置。老国王脸上的怒火也渐渐消了。
        - id: ch04-b25
          speaker: king_henry_viii
          text: 亲亲我，我的王子。好了……你还怕什么？我不是最疼爱你的父王吗？
        - id: ch04-b26
          speaker: tom_canty
          text: 至高而仁慈的陛下，我不配得到您的宽厚，可我知道您待我很好。只是……只是想到那个人就要死去，我心里很难过，而且……
          emotion: sad
        - id: ch04-b27
          speaker: king_henry_viii
          text: 啊，这才像你！哪怕你的心智受了损伤，你的心肠还是没有变。你一直都是个温厚善良的孩子。可那个公爵挡在你和亲王尊荣之间。我会换一个人接替他，绝不能让这个崇高的职位蒙上污点。放心吧，我的王子，别再拿这件事烦扰你那可怜的脑袋。
          emotion: calm
        - id: ch04-b28
          speaker: tom_canty
          text: 可是陛下，催他去死的人不正是我吗？要不是为了我，他也许还能活上很久！
          emotion: sad
        - id: ch04-b29
          speaker: king_henry_viii
          text: 别再想他了，我的王子，他不值得你挂念。再亲我一下，然后去玩些小玩意儿，自己找点乐子。我正被病痛折磨，实在累了，想要休息。跟你的舅父赫特福德和随从们去吧。等我身子好些，你再回来。
        - id: ch04-b30
          speaker: narrator
          text: 汤姆心情沉重地被带了出去。国王最后这句话，彻底击碎了他的希望。方才，他还以为自己马上就能获释。现在，耳边又响起那片低低的嗡嗡声。王子来了，王子来了。
        - id: ch04-b31
          speaker: narrator
          text: 他从一列列衣饰闪耀、躬身行礼的廷臣中间走过，心一点点沉下去。他终于明白，自己已经成了真正的囚徒。也许，他会永远被关在这座镀金的牢笼里，做一个凄凉无助、孤苦无依的王子。除非仁慈的上帝怜悯他，放他出去。
        - id: ch04-b32
          speaker: narrator
          text: 不管转向哪里，汤姆仿佛都能看见诺福克大公被砍下的头颅，还有记忆中那张脸，一起悬在空中。那双眼睛直盯着他，仿佛在责备他。
        - id: ch04-b33
          speaker: narrator
          text: 从前的梦那么美好，眼前的现实却这样凄凉。
