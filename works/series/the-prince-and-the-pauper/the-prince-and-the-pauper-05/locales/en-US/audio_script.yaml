  chapters:
    - id: ch01
      title: Alone in the Prince's Cabinet
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Left alone in the prince's cabinet, Tom Canty made the most of his chance. He turned this way and that before the great mirror, admiring his splendid clothes. Then he walked away with the proud bearing of a prince and watched himself in the glass to see how well he did it.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Next he drew the beautiful sword. He bowed, kissed the blade, and laid it across his chest. Five or six weeks earlier, he had seen a noble knight give that salute to the lieutenant of the Tower while handing over the great lords of Norfolk and Surrey as prisoners.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Tom played with the jeweled dagger at his thigh and studied every costly ornament in the room. He tried each magnificent chair. How proud he would feel if the crowd from Offal Court could peek in and see him in all this grandeur! When he got home and told his amazing tale, would they believe him? Or would they shake their heads and say that too much imagining had finally driven him out of his senses?
        - id: ch01-b04
          speaker: narrator
          text: >-
            Half an hour passed. Then Tom suddenly realized the prince had been gone a very long time. Loneliness crept over him. Soon he stopped touching the pretty things and began to listen and long for the prince's return. He grew uneasy, then restless, and at last deeply afraid.
        - id: ch01-b05
          speaker: narrator
          text: >-
            What if someone found him wearing the prince's clothes, with no prince there to explain? They might hang him first and ask questions afterward. Tom had heard that great people dealt quickly with small matters. Trembling harder by the moment, he softly opened the door to the antechamber. He meant to run, find the prince, and beg for protection and freedom.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Six splendid gentlemen-servants and two young pages, dressed as brightly as butterflies, sprang to their feet and bowed low. Tom darted back into the cabinet and shut the door.
        - id: ch01-b07
          speaker: tom_canty
          text: >-
            Oh, they're making fun of me! They'll go and tell everyone. Why did I ever come here and throw my life away?
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: >-
            He paced the floor, full of fears he could not even name. He listened closely and jumped at every little sound.
    - id: ch02
      title: The Terrible Whisper
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Before long, the door swung open. A page dressed in silk made an announcement.
        - id: ch02-b02
          speaker: page
          text: >-
            The Lady Jane Grey.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The door closed again, and a sweet young girl in rich clothes hurried toward Tom. Then she stopped short. She saw something was badly wrong.
        - id: ch02-b04
          speaker: lady_jane_grey
          text: >-
            Oh, my lord, what is the matter with you?
        - id: ch02-b05
          speaker: narrator
          text: >-
            Tom could hardly breathe, but somehow he managed to stammer out an answer.
        - id: ch02-b06
          speaker: tom_canty
          text: >-
            Please, have mercy on me! I am no lord. I am only poor Tom Canty from Offal Court in the city. Let me see the prince. He'll give me back my rags and let me leave unharmed. Please be merciful and save me!
          emotion: fearful
        - id: ch02-b07
          speaker: narrator
          text: >-
            By now Tom was on his knees, pleading with his eyes and his raised hands as well as his words. Lady Jane looked horrified.
        - id: ch02-b08
          speaker: lady_jane_grey
          text: >-
            My lord! You're kneeling to me?
          emotion: surprised
        - id: ch02-b09
          speaker: narrator
          text: >-
            She fled in fright. Tom gave way to despair and sank to the floor.
        - id: ch02-b10
          speaker: tom_canty
          text: >-
            No one can help me now. There's no hope. They'll come and take me away.
          emotion: fearful
        - id: ch02-b11
          speaker: narrator
          text: >-
            While he lay there numb with terror, dreadful news raced through the palace. It traveled only in whispers, from servant to servant and lord to lady, along every corridor, up every floor, and through every grand room. The prince had gone mad. Soon every grand room and marble hall held groups of glittering lords and ladies, with other groups of dazzling people of lower rank. They spoke earnestly under their breath, and every face showed alarm.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Then a splendid official marched past the groups and made a solemn proclamation.
        - id: ch02-b13
          speaker: royal_official
          text: >-
            In the name of the King! On pain of death, no one shall listen to this false and foolish story, speak of it, or spread it outside the palace. This is the King's command!
        - id: ch02-b14
          speaker: narrator
          text: >-
            The whispering stopped at once, as if every whisperer had suddenly been struck dumb. Soon another murmur moved along the corridors. The prince was coming.
        - id: ch02-b15
          speaker: narrator
          text: >-
            Poor Tom walked slowly between rows of people bowing low. He tried to bow back and stared meekly at the strange world around him with bewildered, miserable eyes. Great nobles walked on either side, letting him lean on them to steady his steps. The court physicians and several servants followed behind.
    - id: ch03
      title: Before the King
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Tom was led into another magnificent room, and the door closed behind him. The people who had escorted him stood nearby. A short distance ahead, an enormous, very fat man rested on a couch. He had a broad, fleshy face and a stern look. His great head was gray, and gray whiskers framed the edges of his face.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The man's clothes were made of rich cloth, though they were old and a little worn. One swollen leg lay on a pillow, wrapped in bandages. Silence filled the room. Everyone bowed their head before him. Everyone, that is, except the man himself. This stern and ailing man was the feared King Henry the Eighth. His face softened when he spoke.
        - id: ch03-b03
          speaker: king_henry_viii
          text: >-
            Well, Lord Edward, my prince? Did you mean to fool your good father, who loves you and treats you kindly, with this sad little joke?
        - id: ch03-b04
          speaker: narrator
          text: >-
            Tom's stunned mind caught only part of the speech. But when he heard the man call himself the good King, all the color left Tom's face. He dropped to his knees as suddenly as if he had been shot and threw up his hands.
        - id: ch03-b05
          speaker: tom_canty
          text: >-
            You're the King? Then I truly am ruined!
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: >-
            The words seemed to stun Henry. His gaze wandered helplessly from one face to another before settling on the boy. He looked bewildered and deeply disappointed.
        - id: ch03-b07
          speaker: king_henry_viii
          text: >-
            Ah, I hoped the rumor had made things sound worse than they were. Now I fear it has not. Come to your father, child. You are ill.
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: >-
            Tom was helped to his feet. Humble and trembling, he approached the King of England. Henry held the frightened face between his hands and studied it with love, searching for some welcome sign that the boy's reason had returned. Then he drew the curly head to his chest and patted it tenderly.
        - id: ch03-b09
          speaker: king_henry_viii
          text: >-
            Don't you know your father, child? Do not break my old heart. Tell me you know who I am. You do know me, don't you?
          emotion: sad
        - id: ch03-b10
          speaker: tom_canty
          text: >-
            Yes. You are my feared lord the King. May God protect you!
        - id: ch03-b11
          speaker: king_henry_viii
          text: >-
            Yes, yes, that's right. Take comfort, and don't tremble so. No one here would hurt you. Everyone here loves you. You're better now, and that terrible dream is passing. You won't claim to be someone else again, as they say you did a little while ago, will you?
          emotion: calm
        - id: ch03-b12
          speaker: tom_canty
          text: >-
            Your Majesty, please believe me. I only told the truth. I was born a pauper, the lowest of your subjects. A cruel accident brought me here, and it was not my fault. I am so young to die, and one word from you can save me. Please say it, sir!
          emotion: fearful
        - id: ch03-b13
          speaker: king_henry_viii
          text: >-
            Die? No, sweet prince, do not speak that way. Quiet your troubled heart. You shall not die!
          emotion: calm
        - id: ch03-b14
          speaker: narrator
          text: >-
            Tom fell to his knees with a joyful cry.
        - id: ch03-b15
          speaker: tom_canty
          text: >-
            May God repay your mercy, my King, and preserve you for many years to bless your country!
          emotion: happy
        - id: ch03-b16
          speaker: narrator
          text: >-
            Then he sprang up and turned a shining face toward the two lords waiting nearby.
        - id: ch03-b17
          speaker: tom_canty
          text: >-
            You heard him! I am not going to die. The King himself said so!
          emotion: happy
        - id: ch03-b18
          speaker: narrator
          text: >-
            No one moved except to bow with grave respect. No one answered. Tom hesitated, a little confused, and turned timidly back to the King.
        - id: ch03-b19
          speaker: tom_canty
          text: >-
            May I go now?
        - id: ch03-b20
          speaker: king_henry_viii
          text: >-
            Go? Of course, if that is what you want. But why not stay a little longer? Where would you go?
        - id: ch03-b21
          speaker: narrator
          text: >-
            Tom lowered his eyes and answered humbly.
        - id: ch03-b22
          speaker: tom_canty
          text: >-
            Perhaps I misunderstood. I thought I was free, and I wanted to return to the miserable alley where I was born and raised. My mother and sisters are there, so it is home to me. I'm not used to all this splendor. Please, sir, let me go.
    - id: ch04
      title: A Test of the Prince
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The King fell silent and thoughtful. Uneasiness and distress slowly showed in his face. Then a little hope entered his voice.
        - id: ch04-b02
          speaker: king_henry_viii
          text: >-
            Perhaps his madness touches only this one idea, and his mind is still sound in other matters. God grant that it is so. We shall test him.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Henry asked Tom a question in Latin. Tom gave a weak answer in the same language, and the lords and doctors showed their relief.
        - id: ch04-b04
          speaker: king_henry_viii
          text: >-
            That answer does not match his schooling or his ability. Still, it shows that his mind is sick, not completely destroyed. Do you agree, doctor?
        - id: ch04-b05
          speaker: narrator
          text: >-
            The physician bowed low.
        - id: ch04-b06
          speaker: physician
          text: >-
            That is exactly my own conclusion, Your Majesty. You have judged correctly.
        - id: ch04-b07
          speaker: narrator
          text: >-
            This encouragement came from an excellent authority, and it pleased the King. He continued with fresh confidence.
        - id: ch04-b08
          speaker: king_henry_viii
          text: >-
            Now, all of you, pay attention. We will test him further.
        - id: ch04-b09
          speaker: narrator
          text: >-
            He asked Tom a question in French. With every eye fixed upon him, Tom stood silent for a moment in embarrassment. Then he answered uncertainly.
        - id: ch04-b10
          speaker: tom_canty
          text: >-
            If it pleases Your Majesty, I do not know that language.
        - id: ch04-b11
          speaker: narrator
          text: >-
            The King collapsed against his couch. His attendants rushed to help, but he waved them away.
        - id: ch04-b12
          speaker: king_henry_viii
          text: >-
            Do not trouble yourselves. It is only a wretched faintness. Help me sit up. There, that will do. Come here, child. Rest your poor, troubled head against your father's heart and be still. You'll soon be well. This is only a passing illness. Do not be afraid. You'll soon be well.
          emotion: calm
        - id: ch04-b13
          speaker: narrator
          text: >-
            Then Henry faced the company. His gentleness vanished, and a dangerous light flashed in his eyes.
        - id: ch04-b14
          speaker: king_henry_viii
          text: >-
            Hear me, all of you! My son is mad, but it will not last. Too much study and too much confinement have caused this. Take away his books and teachers. Give him sports and healthy amusements until he recovers.
        - id: ch04-b15
          speaker: narrator
          text: >-
            The King forced himself higher and spoke with growing energy.
        - id: ch04-b16
          speaker: king_henry_viii
          text: >-
            He may be mad, but he is still my son and England's heir. Mad or sane, he shall reign! Proclaim this too. Anyone who speaks of his illness threatens the peace and order of this kingdom, and that person will hang!
          emotion: angry
        - id: ch04-b17
          speaker: king_henry_viii
          text: >-
            Give me something to drink. I am burning, and this sorrow is draining my strength. There, take the cup away. Hold me up. Yes, that is better.
        - id: ch04-b18
          speaker: king_henry_viii
          text: >-
            Mad, is he? Even if he were a thousand times mad, he would still be Prince of Wales, and I am the King who says so! Tomorrow he shall receive his princely rank in the proper ancient ceremony. Lord Hertford, see to it at once.
          emotion: angry
        - id: ch04-b19
          speaker: narrator
          text: >-
            One of the nobles knelt beside the royal couch.
        - id: ch04-b20
          speaker: lord_hertford
          text: >-
            Your Majesty knows that England's hereditary Great Marshal has been condemned and lies in the Tower. A condemned man should not be allowed to perform the ceremony.
        - id: ch04-b21
          speaker: king_henry_viii
          text: >-
            Silence! Do not insult my ears with his hated name. Is that man going to live forever? Must my will be blocked? Must the prince wait for his honors because England has no Earl Marshal free from the stain of treason? No, by the glory of God! Tell Parliament to bring me Norfolk's sentence before the sun rises again. If they fail, they will answer bitterly for it!
          emotion: angry
        - id: ch04-b22
          speaker: lord_hertford
          text: >-
            The King's will is law.
        - id: ch04-b23
          speaker: narrator
          text: >-
            Lord Hertford rose and returned to his place.
    - id: ch05
      title: The Gilded Cage
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Little by little, the anger faded from the old King's face.
        - id: ch05-b02
          speaker: king_henry_viii
          text: >-
            Kiss me, my prince. There. What are you afraid of? Am I not your loving father?
        - id: ch05-b03
          speaker: tom_canty
          text: >-
            You have been good to me, though I do not deserve it, mighty and gracious lord. I know that is true. But it grieves me to think of the man who must die, and...
          emotion: sad
        - id: ch05-b04
          speaker: king_henry_viii
          text: >-
            Ah, that is just like you! Your mind has been hurt, but your heart has not changed. You have always been gentle. Yet this duke stands between you and your honors. I will put another man in his place, one who brings no stain to that great office. Take comfort, my prince. Do not trouble your poor head about it.
        - id: ch05-b05
          speaker: tom_canty
          text: >-
            But am I not the one sending him to his death, my lord? If it were not for me, how much longer might he live?
          emotion: sad
        - id: ch05-b06
          speaker: king_henry_viii
          text: >-
            Do not think about him, my prince. He is not worthy of it. Kiss me once more, then go to your games and amusements. My illness pains me. I am tired and wish to rest. Go with your uncle Hertford and your attendants. Come back when my body is refreshed.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Tom left the King's presence with a heavy heart. Those last words destroyed his hope that he would now be set free. Once again, low voices stirred around him. The prince was coming.
        - id: ch05-b08
          speaker: narrator
          text: >-
            His spirits sank lower and lower as he passed between glittering rows of bowing courtiers. He understood now that he truly was a prisoner. He might remain forever shut inside this gilded cage, a lonely and friendless prince with no one to help him, unless God took pity on him and set him free.
        - id: ch05-b09
          speaker: narrator
          text: >-
            Wherever Tom turned, he seemed to see the severed head and remembered face of the great Duke of Norfolk floating before him, its eyes fixed on him in blame.
        - id: ch05-b10
          speaker: narrator
          text: >-
            His old dreams had been so pleasant. The reality was so dreary.
