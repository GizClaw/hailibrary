audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    tom_canty:
      display_name: 汤姆·康第
      tts:
        delivery: 谦恭自然，谈起穷街生活时渐渐活泼
        timbre: 清亮稚嫩
        pace: 中等，拘谨时略慢
        pitch: 中高
    edward_tudor:
      display_name: 爱德华·都铎
      tts:
        delivery: 自信端正，天真中带着王室威严
        timbre: 明亮清晰
        pace: 中等，激动时加快
        pitch: 中高
    palace_guard:
      display_name: 王宫卫兵
      tts:
        delivery: 粗暴傲慢，嘲弄时故作恭敬
        timbre: 粗硬低沉
        pace: 稍快
        pitch: 中低
    onlooker_1:
      display_name: 围观者甲
      tts:
        delivery: 见风使舵，起哄时声音响亮
        timbre: 粗亮
        pace: 明快
        pitch: 中等
    onlooker_2:
      display_name: 围观者乙
      tts:
        delivery: 随众附和，带着看热闹的兴奋
        timbre: 清脆
        pace: 明快
        pitch: 中高
    onlooker_3:
      display_name: 围观者丙
      tts:
        delivery: 善于起哄，语气夸张而响亮
        timbre: 略沙哑
        pace: 明快
        pitch: 中等
  chapters:
    - id: ch01
      title: 第三章　汤姆遇见王子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 汤姆饿着肚子起了床，也饿着肚子走出门去。可他的心思，还留在昨夜那场朦胧而华丽的梦里。他在城中到处闲逛，没留神自己走到了哪儿，也没留神身边发生了什么。有人撞他，有人粗声呵斥，他全没听进去。等他回过神，已经到了圣殿关。这是他沿这个方向走得最远的一次。他停了片刻，又沉进幻想，继续走出了伦敦城墙。
        - id: ch01-b02
          speaker: narrator
          text: 那时候，河滨大道已经不肯再做乡间小路，自称是一条街了，只是这称呼多少有些勉强。路的一边还算紧凑，整齐排着一列房屋，另一边却只有几座零散的宏伟宫邸，属于富贵的爵爷。每座宫邸四周都有宽阔美丽的庭园，一直伸到河边。到了今天，那些庭园早已不见，那里只剩下一片挤得密不透风的阴沉砖石房屋。
        - id: ch01-b03
          speaker: narrator
          text: 不久，汤姆来到查令村，在一座美丽的十字纪念碑旁歇脚。那是从前一位痛失爱妻的国王建造的。接着，他沿着一条幽静宜人的道路悠闲向前，经过大红衣主教庄严的府邸，走向远处一座更加雄伟壮丽的宫殿，那便是威斯敏斯特宫。
        - id: ch01-b04
          speaker: narrator
          text: 汤姆欢喜又惊奇地仰望那座庞大的石砌宫殿。宽阔的侧翼向远处展开，堡垒和塔楼森严耸立。巨大的石门装着镀金栅栏，周围陈列着气势非凡的硕大花岗岩狮子，还有种种象征英国王权的华美标志。他心底的愿望，难道终于要实现了吗？这里的的确确是国王的宫殿。只要上天肯成全，他现在或许就能见到一位有血有肉的王子。
        - id: ch01-b05
          speaker: narrator
          text: 镀金大门两旁，各立着一尊活雕像。那是两名从头到脚披着亮银钢甲的卫兵，神情庄重，身姿挺拔，一动不动。许多乡下人和城里人隔着一段恭敬的距离等候，都盼着碰上机会，瞥见一位王室成员。王宫围墙上还开着几座宏伟大门，不断有华丽的马车进进出出。车里坐着衣饰华贵的人，车外侍候的仆从也一样体面。
        - id: ch01-b06
          speaker: narrator
          text: 一身破烂的小汤姆怯生生地走近。他的心怦怦直跳，希望也跟着一点点升起。就在这时，他透过金色栅栏看见一个俊秀的男孩。那男孩常在户外运动，皮肤晒得健康黝黑，身上是绫罗绸缎，珠宝闪闪发亮。腰间佩着镶宝石的小剑和匕首，脚上穿着红跟短靴，头顶斜戴一顶深红色帽子。帽上垂着羽饰，由一颗耀眼的大宝石固定。旁边几位衣着绚丽的先生，想必都是他的侍从。
        - id: ch01-b07
          speaker: narrator
          text: 汤姆欢喜得几乎喊出来。那真是一位活生生的王子，一位真正的王子，绝不会错。小乞丐藏在心里的祈愿，总算实现了。他激动得呼吸又急又短，双眼因为惊奇和喜悦越睁越大。脑中所有念头都在一瞬间让到一旁，只剩下一个愿望。他要走近些，把王子好好看个痛快。还没意识到自己在做什么，他已经把脸贴到了门栅上。
        - id: ch01-b08
          speaker: narrator
          text: 一名卫兵猛地把汤姆揪开，扔进围观的人群里，摔得他直打转。
        - id: ch01-b09
          speaker: palace_guard
          text: 小叫花子，懂点规矩！
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 人群一边讥讽，一边哄笑。小王子却冲到门前，脸涨得通红，眼里闪着怒火。
        - id: ch01-b11
          speaker: edward_tudor
          text: 你怎么敢欺负一个穷孩子？就算是我父王治下最卑微的子民，你也不许这样对待！打开大门，放他进来！
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: 那群人方才还在嘲笑，此刻立刻摘下帽子。紧接着，欢呼声响了起来。
        - id: ch01-b13
          speakers: [onlooker_1, onlooker_2, onlooker_3]
          ensemble: chorus
          text: 威尔士亲王万岁！
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: 卫兵把长戟举到胸前致敬，打开了大门。身披飘摇破衣的贫穷小王子走了进去。他要与拥有无尽财富的王子握手会合时，卫兵又把长戟举起，行了一次礼。
        - id: ch01-b15
          speaker: edward_tudor
          text: 你又累又饿，还受了委屈。跟我来吧。
        - id: ch01-b16
          speaker: narrator
          text: 五六名侍从一齐抢上前来。至于想做什么，我可说不准，多半是要拦阻吧。王子只很有气派地一挥手，他们便停在原地，像一排雕像。爱德华领汤姆进了一间富丽的书斋，又一声吩咐，叫人送上饭食。这样的宴席，汤姆从前只在书里见过。王子很有教养，也很体贴，怕仆人挑剔的目光让这位卑微的客人不自在，便把他们全遣走了。随后，他自己坐在一旁，等汤姆边吃边回答问题。
        - id: ch01-b17
          speaker: edward_tudor
          text: 你叫什么名字？
        - id: ch01-b18
          speaker: tom_canty
          text: 回殿下，我叫汤姆·康第。
        - id: ch01-b19
          speaker: edward_tudor
          text: 这个名字倒挺奇怪。你住在哪儿？
        - id: ch01-b20
          speaker: tom_canty
          text: 住在城里，殿下。就是布丁巷外的下水院。
        - id: ch01-b21
          speaker: edward_tudor
          text: 下水院？这名字更奇怪。你有父母吗？
        - id: ch01-b22
          speaker: tom_canty
          text: 有的，殿下。我还有个祖母。愿上帝宽恕我这么说，我实在没法亲近她。另外，我还有一对孪生姐姐，叫南和贝特。
        - id: ch01-b23
          speaker: edward_tudor
          text: 听起来，你祖母待你不太和善。
        - id: ch01-b24
          speaker: tom_canty
          text: 她对谁都不和善，殿下。她心肠坏，整天都在做坏事。
        - id: ch01-b25
          speaker: edward_tudor
          text: 她会虐待你吗？
        - id: ch01-b26
          speaker: tom_canty
          text: 她也有不动手的时候，那是在睡着或者喝醉时。可等她清醒过来，就会狠狠打我，把少打的全补上。
        - id: ch01-b27
          speaker: narrator
          text: 小王子的眼里顿时腾起怒火。
        - id: ch01-b28
          speaker: edward_tudor
          text: 什么？她竟敢打你？你这么瘦小，她也下得了手！听着，天黑以前，我就叫人把她押进伦敦塔。我父王……
          emotion: angry
        - id: ch01-b29
          speaker: tom_canty
          text: 可殿下忘了，她身份太低微。伦敦塔只关大人物。
        - id: ch01-b30
          speaker: edward_tudor
          text: 对，我还真没想到。那我另想办法罚她。你父亲待你好吗？
        - id: ch01-b31
          speaker: tom_canty
          text: 他跟康第婆婆一样，殿下。
        - id: ch01-b32
          speaker: edward_tudor
          text: 或许天下的父亲都差不多。我的父王脾气也不温柔，动手很重，不过总算饶了我。只是说起严厉话来，他可不总肯饶我。那你母亲呢？她待你怎么样？
        - id: ch01-b33
          speaker: tom_canty
          text: 她很好，殿下，从不叫我伤心，也从不让我受苦。南和贝特也和她一样。
        - id: ch01-b34
          speaker: edward_tudor
          text: 你的姐姐多大了？
        - id: ch01-b35
          speaker: tom_canty
          text: 十五岁，殿下。
        - id: ch01-b36
          speaker: edward_tudor
          text: 我的姐姐伊丽莎白公主十四岁。表妹简·格雷小姐跟我同龄，又漂亮又亲切。不过我的姐姐玛丽公主总是一脸阴沉，而且……对了，你的姐姐也不准仆人发笑吗？她们是不是也怕笑这种罪，会毁掉仆人的灵魂？
        - id: ch01-b37
          speaker: tom_canty
          text: 她们？殿下，您以为她们也有仆人？
          emotion: surprised
        - id: ch01-b38
          speaker: narrator
          text: 小王子严肃地看了这个小乞丐一会儿。
        - id: ch01-b39
          speaker: edward_tudor
          text: 她们怎么会没有？晚上是谁帮她们脱衣服？早晨又是谁替她们穿戴？
        - id: ch01-b40
          speaker: tom_canty
          text: 没人呀，殿下。难道要她们脱掉身上那件衣服，像野兽一样光着睡觉？
        - id: ch01-b41
          speaker: edward_tudor
          text: 身上那一件？她们就只有一件衣服？
          emotion: surprised
        - id: ch01-b42
          speaker: tom_canty
          text: 好殿下，多一件能有什么用？她们每个人又没有两副身子。
        - id: ch01-b43
          speaker: edward_tudor
          text: 这想法真稀奇！请原谅，我不是有意笑你。南和贝特很快就会有足够的衣服和仆人，我叫掌管王室钱财的人去办。别谢我，这不算什么。你谈吐很好，说话也很从容。你念过书吗？
        - id: ch01-b44
          speaker: tom_canty
          text: 我也不知道算不算，殿下。善良的安德鲁神父好心拿他的书教过我。
        - id: ch01-b45
          speaker: edward_tudor
          text: 你懂拉丁文吗？
        - id: ch01-b46
          speaker: tom_canty
          text: 恐怕只懂一点点，殿下。
        - id: ch01-b47
          speaker: edward_tudor
          text: 那就学下去吧，只有开头难。希腊文更难，可不管这两种还是别的语言，对伊丽莎白姐姐和我表妹好像都不难。你真该听听她们说起来的样子！现在跟我讲讲下水院。你在那里过得快活吗？
        - id: ch01-b48
          speaker: tom_canty
          text: 除了挨饿的时候，我过得很快活，殿下。那里有潘趣和朱迪的木偶戏，还有猴子。那些猴子滑稽极了，穿得也神气极了！我们还能看戏，台上的人又喊又打，一直打到全都死光，特别好看。一场只要一个法辛，不过要弄到那一个法辛，可真难。
        - id: ch01-b49
          speaker: edward_tudor
          text: 再多讲一点。
        - id: ch01-b50
          speaker: tom_canty
          text: 我们下水院的男孩有时会学那些学徒，拿棍棒互相较量。
        - id: ch01-b51
          speaker: narrator
          text: 王子的眼睛一下子亮了。
        - id: ch01-b52
          speaker: edward_tudor
          text: 这个我准会喜欢。还有呢？
          emotion: happy
        - id: ch01-b53
          speaker: tom_canty
          text: 我们还赛跑，看谁跑得最快，殿下。
        - id: ch01-b54
          speaker: edward_tudor
          text: 这个我也喜欢。接着说。
          emotion: happy
        - id: ch01-b55
          speaker: tom_canty
          text: 夏天，我们会到水渠和河里蹚水、游泳。大家把同伴按进水里，朝他泼水，还潜水、喊叫、翻滚，还有……
        - id: ch01-b56
          speaker: edward_tudor
          text: 只要能这么痛快地玩一次，拿我父王的整个王国去换都值得！快接着说。
          emotion: happy
        - id: ch01-b57
          speaker: tom_canty
          text: 我们围着齐普赛街的五月柱唱歌跳舞，也在沙地上玩，把同伴一个个埋起来。有时还拿泥巴做点心。啊，那泥巴太可爱了，天底下再没有比它更好玩的东西！我们就在泥里滚来滚去。请殿下别见怪。
          emotion: happy
        - id: ch01-b58
          speaker: edward_tudor
          text: 别说什么见怪，这简直太痛快了！要是我能穿上你的衣服，脱掉鞋袜，只到泥里好好玩一回，没人责骂，也没人阻拦，我想连王冠都可以不要！
          emotion: happy
        - id: ch01-b59
          speaker: tom_canty
          text: 好殿下，要是我也能穿一回您的衣服……只要一回……
        - id: ch01-b60
          speaker: edward_tudor
          text: 原来你想穿？那就这么办！脱下你的破衣服，换上我这身华服吧。这份快乐就算短一点，也不会少了滋味。趁现在没人打扰，我们好好享受一会儿，再换回来。
          emotion: happy
        - id: ch01-b61
          speaker: narrator
          text: 几分钟后，威尔士亲王披上了汤姆那身飘摇的破布条，贫儿国的小王子却穿起了王室绚丽的羽衣。两个男孩并肩站到一面大镜子前。奇迹出现了，他们仿佛根本没有交换衣裳。两人看看对方，再看看镜子，又回头看着对方。最后，小王子满腹疑惑地开了口。
        - id: ch01-b62
          speaker: edward_tudor
          text: 你觉得这是怎么回事？
        - id: ch01-b63
          speaker: tom_canty
          text: 好殿下，别叫我回答吧。以我的身份，不该把那件事说出口。
        - id: ch01-b64
          speaker: edward_tudor
          text: 那就由我说。你的头发、眼睛、嗓音和举止都跟我一样。你的身形、个头、面孔和神情，也全跟我相同。要是我们什么都不穿地走出去，谁也分不清哪一个是你，哪一个是威尔士亲王。现在我穿上了你刚才的衣服，应该更能明白那名野蛮卫兵欺负你时，你是什么感受。等等，你手上这块是不是淤青？
          emotion: surprised
        - id: ch01-b65
          speaker: tom_canty
          text: 是的，不过只是点小伤。殿下也知道，那名可怜的卫兵……
        - id: ch01-b66
          speaker: edward_tudor
          text: 别替他说话！他做得又可耻又残忍！要是父王……你一步也不许动，就在这里等我回来！这是命令！
          emotion: angry
        - id: ch01-b67
          speaker: narrator
          text: 小王子赤着脚重重一跺，转身抓起桌上一件关系国家安危的重要物品，收进衣服里，冲出了门。他脸涨得通红，眼里燃着怒火，那身破衣像旗帜一样飞舞。他一路跑过王宫庭院，来到大门前，抓住栅栏使劲摇晃。
        - id: ch01-b68
          speaker: edward_tudor
          text: 开门！把门闩拉开！
          emotion: angry
        - id: ch01-b69
          speaker: narrator
          text: 方才欺负汤姆的卫兵立刻照命把门打开。王子被满腔怒火冲得几乎透不过气，刚冲出门洞，卫兵便狠狠扇了他一记响亮的耳光，把他打得转着圈跌到路上。
        - id: ch01-b70
          speaker: palace_guard
          text: 小叫花子的杂种，这一巴掌赏给你！谁叫你害我挨殿下训斥！
          emotion: angry
        - id: ch01-b71
          speaker: narrator
          text: 人群放声大笑。王子从泥里爬起来，怒气冲冲地扑向卫兵。
        - id: ch01-b72
          speaker: edward_tudor
          text: 我是威尔士亲王，我的身体神圣不可侵犯！你竟敢动手打我，我一定叫人绞死你！
          emotion: angry
        - id: ch01-b73
          speaker: narrator
          text: 卫兵举起长戟，装模作样地行了个礼。
        - id: ch01-b74
          speaker: palace_guard
          text: 向尊贵的殿下致敬。现在滚开，你这个发疯的废物！
          emotion: angry
        - id: ch01-b75
          speaker: narrator
          text: 那群起哄的人把可怜的小王子围住，一边嘲笑，一边推搡着他沿路走出很远。他们还不停高喊。
        - id: ch01-b76
          speakers: [onlooker_1, onlooker_2, onlooker_3]
          ensemble: chorus
          text: 给王家殿下让路！给威尔士亲王让路！
