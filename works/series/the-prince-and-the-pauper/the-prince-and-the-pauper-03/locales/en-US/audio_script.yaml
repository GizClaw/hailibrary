  chapters:
    - id: ch01
      title: Tom's meeting with the Prince.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Tom woke hungry and wandered away hungry, but his mind was still full of the dim splendors he had dreamed about all night. He drifted through London without noticing where he went or what happened around him. People bumped into him. Some spoke harshly to him. The dreaming boy heard none of it.
        - id: ch01-b02
          speaker: narrator
          text: >-
            After a while, Tom found himself at Temple Bar. He had never gone so far from home in that direction. He paused there, thought for a moment, and then slipped back into his daydream. Soon he had passed beyond London's walls. The Strand was no longer a country road, though it could hardly call itself a proper street. Houses stood close together along one side. On the other were a few great palaces belonging to rich nobles, each surrounded by beautiful grounds that reached down to the river. Today, those grounds are buried beneath grim stretches of brick and stone.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Tom came to Charing Village and rested beside the beautiful cross that a grieving king had built long ago. Then he wandered along a quiet, lovely road. He passed the great cardinal's stately palace and went on toward an even mightier one beyond it: Westminster.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He gazed in delighted wonder at that vast mass of stone, its wide wings, stern battlements, and towers. The enormous gateway had gilded bars. Great granite lions stood around it, along with every other proud sign of English royalty. Could the wish of Tom's heart finally come true? This truly was a king's palace. If Heaven allowed it, perhaps he might now see a prince of real flesh and blood.
        - id: ch01-b05
          speaker: narrator
          text: >-
            A man-at-arms stood on either side of the golden gate. Each one was straight, grand, and motionless, like a living statue dressed from head to foot in shining steel. Country people and Londoners waited at a respectful distance, hoping for any glimpse of royalty. Several other noble gateways opened into the royal grounds. Magnificent carriages arrived and departed through them, carrying fine people inside, with fine servants riding outside.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Poor little Tom crept toward the gate in his rags. He moved slowly past the guards, timid and hopeful, with his heart pounding. Then he looked through the golden bars and saw something that nearly made him cry out with joy.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Inside stood a handsome boy, brown from outdoor games and exercise. Lovely silks and satins covered him, and jewels flashed from his clothes. A small jeweled sword and dagger hung at his hip. He wore delicate boots with red heels and a jaunty crimson cap. Its drooping feathers were fastened by one great sparkling gem. Several richly dressed gentlemen stood nearby. They had to be his servants.
        - id: ch01-b08
          speaker: narrator
          text: >-
            There could be no doubt. He was a prince, a living, breathing, real prince. At last, the prayer in the pauper boy's heart had been answered.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Tom breathed in quick, short gasps. His eyes widened with wonder and delight. One wish drove everything else from his mind: he had to get close and drink in the sight of that prince. Before he knew it, his face was pressed against the bars.
        - id: ch01-b10
          speaker: narrator
          text: >-
            At once, one of the soldiers tore him away and sent him spinning into the staring crowd of country folk and London idlers.
        - id: ch01-b11
          speaker: soldier
          text: >-
            Learn some manners, you little beggar!
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: >-
            The crowd jeered and laughed. But the young prince rushed to the gate. His face had gone red, and his eyes flashed with anger.
        - id: ch01-b13
          speaker: prince_edward
          text: >-
            How dare you treat a poor boy that way? How dare you do that to even the humblest subject of my father, the King? Open the gates and let him in!
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: >-
            That fickle crowd snatched off their hats in an instant. Then they cheered at the tops of their voices.
        - id: ch01-b15
          speakers: [crowd_member_1, crowd_member_2, crowd_member_3]
          ensemble: chorus
          text: >-
            Long live the Prince of Wales!
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: >-
            The soldiers raised their halberds in salute, opened the gates, and saluted once more. Through them walked the little Prince of Poverty, his rags fluttering, to take the hand of the Prince of Limitless Plenty.
        - id: ch01-b17
          speaker: prince_edward
          text: >-
            You look tired and hungry, and they have treated you badly. Come with me.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Half a dozen attendants sprang forward. No one could say exactly what they meant to do, though they probably meant to interfere. One truly royal sweep of Edward's hand stopped them. They stood where they were, as still as so many statues, while he led Tom into a splendid room that he called his cabinet.
        - id: ch01-b19
          speaker: narrator
          text: >-
            At Edward's command, servants brought a meal finer than any Tom had ever seen outside a book. The prince understood that their watchful eyes might embarrass his humble guest, so he sent them away. Then he sat nearby and questioned Tom as the hungry boy ate.
        - id: ch01-b20
          speaker: prince_edward
          text: >-
            What is your name, lad?
        - id: ch01-b21
          speaker: tom_canty
          text: >-
            Tom Canty, if it pleases you, sir.
        - id: ch01-b22
          speaker: prince_edward
          text: >-
            That is an odd name. Where do you live?
        - id: ch01-b23
          speaker: tom_canty
          text: >-
            In the city, sir. In Offal Court, just off Pudding Lane.
        - id: ch01-b24
          speaker: prince_edward
          text: >-
            Offal Court? That is another odd name. Do you have parents?
        - id: ch01-b25
          speaker: tom_canty
          text: >-
            Yes, sir. I have parents, a grandmother I cannot say I value very much, God forgive me if that is wrong, and twin sisters named Nan and Bet.
        - id: ch01-b26
          speaker: prince_edward
          text: >-
            I suppose your grandmother is not very kind to you.
        - id: ch01-b27
          speaker: tom_canty
          text: >-
            She is not kind to anyone, sir. Her heart is wicked, and she spends her days doing evil.
        - id: ch01-b28
          speaker: prince_edward
          text: >-
            Does she mistreat you?
        - id: ch01-b29
          speaker: tom_canty
          text: >-
            Sometimes she leaves me alone because she is asleep or overcome with drink. Once her head is clear again, she makes up for it by beating me soundly.
        - id: ch01-b30
          speaker: narrator
          text: >-
            A fierce look came into Edward's eyes.
        - id: ch01-b31
          speaker: prince_edward
          text: >-
            What? She beats you?
          emotion: surprised
        - id: ch01-b32
          speaker: tom_canty
          text: >-
            Oh yes, indeed she does, sir.
        - id: ch01-b33
          speaker: prince_edward
          text: >-
            Beatings, when you are so small and frail? Listen to me. Before nightfall, she shall be taken to the Tower. The King, my father, will—
          emotion: angry
        - id: ch01-b34
          speaker: tom_canty
          text: >-
            But sir, you forget how lowly she is. The Tower is only for great people.
        - id: ch01-b35
          speaker: prince_edward
          text: >-
            That is true. I had not thought of it. I shall decide on another punishment for her. Is your father kind to you?
        - id: ch01-b36
          speaker: tom_canty
          text: >-
            No kinder than Granny Canty, sir.
        - id: ch01-b37
          speaker: prince_edward
          text: >-
            Perhaps fathers are all much the same. Mine has no gentle temper. His hand strikes hard, though he spares me that. His tongue does not always spare me, to tell the truth. And how does your mother treat you?
        - id: ch01-b38
          speaker: tom_canty
          text: >-
            She is good to me, sir. She never causes me pain or sorrow. Nan and Bet are good like her.
        - id: ch01-b39
          speaker: prince_edward
          text: >-
            How old are your sisters?
        - id: ch01-b40
          speaker: tom_canty
          text: >-
            They are fifteen, sir.
        - id: ch01-b41
          speaker: prince_edward
          text: >-
            My sister, Lady Elizabeth, is fourteen. My cousin Lady Jane Grey is my own age, and she is both lovely and gracious. But my sister Lady Mary always looks so gloomy. Tell me, do your sisters forbid their servants to smile because they fear it will ruin their souls?
        - id: ch01-b42
          speaker: tom_canty
          text: >-
            My sisters? Sir, do you think they have servants?
          emotion: surprised
        - id: ch01-b43
          speaker: narrator
          text: >-
            The little prince studied the little pauper with a grave face for a moment.
        - id: ch01-b44
          speaker: prince_edward
          text: >-
            Why should they not? Who helps them undress at night? Who dresses them when they rise in the morning?
        - id: ch01-b45
          speaker: tom_canty
          text: >-
            No one, sir. Would you have them take off their only garment and sleep bare like animals?
        - id: ch01-b46
          speaker: prince_edward
          text: >-
            Their only garment? Do they truly have just one?
        - id: ch01-b47
          speaker: tom_canty
          text: >-
            What would they do with another, sir? They do not have two bodies apiece.
        - id: ch01-b48
          speaker: prince_edward
          text: >-
            What a strange and marvelous thought! Forgive me. I did not mean to laugh. Your good Nan and Bet shall soon have plenty of clothes and servants. My treasurer will see to it. No, do not thank me. It is nothing. You speak very well and easily. Have you been taught?
        - id: ch01-b49
          speaker: tom_canty
          text: >-
            I do not know whether I am learned, sir. Good Father Andrew kindly taught me from his books.
        - id: ch01-b50
          speaker: prince_edward
          text: >-
            Do you know Latin?
        - id: ch01-b51
          speaker: tom_canty
          text: >-
            Only a little, sir, I am afraid.
        - id: ch01-b52
          speaker: prince_edward
          text: >-
            Learn it, lad. It is hard only at the beginning. Greek is harder. Yet no language seems difficult for Lady Elizabeth or my cousin. You should hear those two! But tell me about Offal Court. Do you enjoy your life there?
        - id: ch01-b53
          speaker: tom_canty
          text: >-
            I do, sir, except when I am hungry. We have Punch-and-Judy shows and monkeys. Oh, the monkeys are such funny creatures, and they wear such fine clothes! There are plays too. The actors shout and fight until every one of them is dead. It is wonderful to watch and costs only a farthing, though finding that farthing is terribly hard.
        - id: ch01-b54
          speaker: prince_edward
          text: >-
            Tell me more.
        - id: ch01-b55
          speaker: tom_canty
          text: >-
            Sometimes the boys in Offal Court fight one another with sticks, the way the apprentices do.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Edward's eyes flashed with interest.
        - id: ch01-b57
          speaker: prince_edward
          text: >-
            I believe I would like that. What else do you do?
        - id: ch01-b58
          speaker: tom_canty
          text: >-
            We race each other, sir, to find out which boy is fastest.
        - id: ch01-b59
          speaker: prince_edward
          text: >-
            I would like that too. Go on.
        - id: ch01-b60
          speaker: tom_canty
          text: >-
            In summer, we wade and swim in the canals and the river. We duck one another, splash water everywhere, dive, shout, and tumble about, and—
        - id: ch01-b61
          speaker: prince_edward
          text: >-
            I would give my father's kingdom to enjoy that just once! Please, keep going.
        - id: ch01-b62
          speaker: tom_canty
          text: >-
            We dance and sing around the Maypole in Cheapside. We play in the sand and bury one another. Sometimes we make mud pies. Oh, nothing in the whole world is as delightful as that mud! We roll about in it, sir, if you will pardon me for saying so.
        - id: ch01-b63
          speaker: prince_edward
          text: >-
            Say no more. It sounds glorious! If only I could put on clothes like yours, go barefoot, and play in the mud once, just once, with no one to scold or stop me. I think I could give up the crown for that!
        - id: ch01-b64
          speaker: tom_canty
          text: >-
            And if I could dress just once in clothes like yours, kind sir—only once—
        - id: ch01-b65
          speaker: prince_edward
          text: >-
            Oh, would you like that? Then we shall do it. Take off your rags and put on my finery, lad! The pleasure will not last long, but that will not make it any less wonderful. We can enjoy it now and change back before anyone comes to disturb us.
        - id: ch01-b66
          speaker: narrator
          text: >-
            A few minutes later, the little Prince of Wales stood wrapped in Tom's fluttering, ragged odds and ends. The little Prince of Pauperdom wore the showy silks, satins, and jewels of royalty. They went to a great mirror and stood side by side. Then came a miracle. Even with their clothes exchanged, it looked as though no change had been made at all.
        - id: ch01-b67
          speaker: narrator
          text: >-
            They stared at each other, then at the mirror, then back at each other. At last, Edward spoke in bewilderment.
        - id: ch01-b68
          speaker: prince_edward
          text: >-
            What do you make of this?
          emotion: surprised
        - id: ch01-b69
          speaker: tom_canty
          text: >-
            Please do not make me answer, sir. It would not be proper for someone as lowly as I am to say such a thing.
        - id: ch01-b70
          speaker: prince_edward
          text: >-
            Then I shall say it. Your hair is the same as mine. So are your eyes, your voice, your manner, your height and build, and even your face. If we went out with no clothes on, no one could tell which of us was Tom Canty and which was the Prince of Wales.
        - id: ch01-b71
          speaker: prince_edward
          text: >-
            Now that I am wearing your clothes, I think I can better understand how you felt when that brutal soldier—Wait. Is that a bruise on your hand?
        - id: ch01-b72
          speaker: tom_canty
          text: >-
            Yes, sir, but it is only a small one. And you know the poor man-at-arms—
        - id: ch01-b73
          speaker: prince_edward
          text: >-
            Enough! What he did was cruel and shameful! If the King—Stay exactly where you are until I return. That is an order!
          emotion: angry
        - id: ch01-b74
          speaker: narrator
          text: >-
            Edward stamped his bare foot. Then, in an instant, he snatched up and put away an object of national importance that had been lying on a table. He flew out the door and across the palace grounds in his streaming rags, his face hot and his eyes blazing.
        - id: ch01-b75
          speaker: narrator
          text: >-
            When he reached the great gate, he grabbed its bars and tried to shake them.
        - id: ch01-b76
          speaker: prince_edward
          text: >-
            Open the gate! Unbar it at once!
          emotion: angry
        - id: ch01-b77
          speaker: narrator
          text: >-
            The soldier who had mistreated Tom obeyed immediately. Edward burst through the opening, nearly choking with royal fury. The soldier struck him sharply on the ear and sent him spinning into the road.
        - id: ch01-b78
          speaker: soldier
          text: >-
            Take that, you beggar's brat! That is for the trouble you caused me with His Highness!
          emotion: angry
        - id: ch01-b79
          speaker: narrator
          text: >-
            The crowd roared with laughter. Edward pulled himself out of the mud and rushed fiercely at the sentry.
        - id: ch01-b80
          speaker: prince_edward
          text: >-
            I am the Prince of Wales! My person is sacred, and you shall hang for laying a hand on me!
          emotion: angry
        - id: ch01-b81
          speaker: narrator
          text: >-
            The soldier raised his halberd in a mocking salute.
        - id: ch01-b82
          speaker: soldier
          text: >-
            I salute Your Gracious Highness.
        - id: ch01-b83
          speaker: soldier
          text: >-
            Now get away from here, you mad piece of rubbish!
          emotion: angry
        - id: ch01-b84
          speaker: narrator
          text: >-
            The jeering crowd closed around the poor little prince. They shoved him far down the road, hooting as they went.
        - id: ch01-b85
          speakers: [crowd_member_1, crowd_member_2, crowd_member_3]
          ensemble: chorus
          text: >-
            Make way for His Royal Highness! Make way for the Prince of Wales!
