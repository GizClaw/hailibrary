audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华亲王
      tts:
        delivery: 高贵坚定，受辱时仍保持尊严
        timbre: 清亮稚嫩
        pace: 从容有力
        pitch: 中高
    miles_hendon:
      display_name: 迈尔斯·亨顿
      tts:
        delivery: 豪爽诙谐，危急时勇敢坚定
        timbre: 洪亮粗粝
        pace: 明快有力
        pitch: 中低
    officer:
      display_name: 执刑官
      tts:
        delivery: 蛮横刻薄，发号施令时冷酷随意
        timbre: 粗硬沙哑
        pace: 不紧不慢
        pitch: 中低
    sir_hugh:
      display_name: 休爵士
      tts:
        delivery: 阴冷傲慢，恶意藏在从容的口吻里
        timbre: 冷峻低沉
        pace: 缓慢清楚
        pitch: 低
  chapters:
    - id: ch01
      title: 枷架上的冒牌货
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 迈尔斯早已受够牢狱和无所事事的日子。终于开庭时，他甚至有些高兴，以为只要不再坐牢，怎样判都行。谁知法庭认定他是个强横的流浪汉，说他行为凶蛮，还袭击了亨顿庄园的主人，罚他戴枷示众两个小时。迈尔斯一听便勃然大怒。他明明说过，原告是自己的亲兄弟，自己才是亨顿家荣誉与产业的合法继承人，可法庭只觉得这些话不值一查。
        - id: ch01-b02
          speaker: narrator
          text: 迈尔斯气得一路怒骂威胁，可无论说什么都没有用。官差不但粗暴地拖着他往受刑的地方走，还因为他的顶撞，时不时给他一拳。
        - id: ch01-b03
          speaker: narrator
          text: 国王挤不过后面蜂拥的人群，只能落在队尾，跟自己的好友和忠仆远远隔开。他本来也险些因为结交恶棍而被判戴枷，幸亏年纪小，挨过一顿训斥和警告便被放了。等人群停下，他焦急地绕着外围东奔西跑，处处寻找空隙，费了许久才挤到前面。
        - id: ch01-b04
          speaker: narrator
          text: 眼前的迈尔斯困在耻辱的枷架里，任肮脏的暴民嘲弄。英格兰国王的贴身侍从，竟成了众人的笑柄。爱德华亲耳听过判决，却直到这一刻，才真正明白那判决有多屈辱。他的怒火刚刚升起，一只鸡蛋便飞过空中，在亨顿脸上砸得稀烂。人群放声大笑，爱德华的怒火一下烧得像盛夏一样炽烈。他冲进中间的空地，迎面喝住执刑官。
        - id: ch01-b05
          speaker: prince_edward
          text: 真可耻！他是我的仆人，马上放了他！我是——
          emotion: angry
        - id: ch01-b06
          speaker: miles_hendon
          text: 快住口！你会害死自己的。长官，别理这个孩子，他疯了。
          emotion: fearful
        - id: ch01-b07
          speaker: officer
          text: 不劳你操心，我才懒得理他。不过，我倒愿意教教他规矩。来人，赏这个小傻瓜一两鞭。
        - id: ch01-b08
          speaker: narrator
          text: 休爵士恰在这时骑马赶到。他并不打算久留，只想顺路看一眼这里的热闹，却立刻开口加重了刑罚。
        - id: ch01-b09
          speaker: sir_hugh
          text: 一两鞭怎么够？依我看，给他结结实实的半打，才能真正教会他规矩。
    - id: ch02
      title: 替国王受刑
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 国王被人一把抓住。他想到鞭子竟要落在自己神圣的身体上，顿时惊得僵住，连挣扎也忘了。史书已经记过英格兰国王受鞭打的耻辱，难道还要由他把那污秽的一页再写一遍？这念头叫他无法忍受。可他已经落进罗网，没有人能救他。眼前只有两个选择，要么挨打，要么求饶。两个都残酷，但国王可以挨鞭，却不能乞求宽免。
        - id: ch02-b02
          speaker: narrator
          text: 这时，迈尔斯替他作出了选择。
        - id: ch02-b03
          speaker: miles_hendon
          text: 放开这孩子！你们这些没心肝的恶狗，看不出他年纪小、身子又单薄吗？放了他，他的鞭子由我来挨。
          emotion: angry
        - id: ch02-b04
          speaker: sir_hugh
          text: 好主意，我还真得谢谢你。放了那个小叫花子，换这个人挨十二鞭。十二下都要打结实，一下也不许轻。
        - id: ch02-b05
          speaker: narrator
          text: 国王正要厉声抗议，休爵士立刻堵住了他。
        - id: ch02-b06
          speaker: sir_hugh
          text: 说吧，有什么尽管说。不过记住，你每多说一个字，他就多挨六鞭。
        - id: ch02-b07
          speaker: narrator
          text: 迈尔斯被拖出枷架，后背裸露出来。鞭子一下下抽落，可怜的小国王转过脸，让有失君王身份的眼泪在脸上冲出道道泪痕。他在心里赞叹这颗勇敢高尚的心，发誓自己永远不会忘记这番忠义。至于伤害亨顿的人，他们也休想忘记。想到这里，他又悲痛，又愤怒。
        - id: ch02-b08
          speaker: narrator
          text: 他越想，越觉得亨顿的义举崇高无比，心里的感激也越来越深。有人救亲王免受创伤，甚至免于一死，自然已经立下大功。可跟另一件事相比，这功劳竟算不得什么，甚至比什么也不是还要微小。因为迈尔斯救自己的亲王免受了羞辱。
    - id: ch03
      title: 英格兰的伯爵
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 沉重的鞭子不断落下，亨顿却一声不吭，拿出军人的刚毅忍受着。他替孩子受刑，又如此坚忍，连聚在那里的穷苦卑微的暴民也起了敬意。嘲笑声和喝倒彩一点点低下去，最后完全消失，场上只剩鞭子落在后背的声音。
        - id: ch03-b02
          speaker: narrator
          text: 受刑完毕，亨顿又被架回枷锁。四周静得出奇，跟不久前充满侮辱的喧闹全然不同。国王轻轻走到他身旁，贴着他的耳朵说话。
        - id: ch03-b03
          speaker: prince_edward
          text: 善良而伟大的灵魂，国王不能使你变得高贵，因为高于所有国王的那一位，早已赐给你高贵。不过，国王可以让世人承认你的贵族身份。
        - id: ch03-b04
          speaker: narrator
          text: 爱德华从地上捡起鞭子，在亨顿流血的肩头轻轻一点，又低声宣布。
        - id: ch03-b05
          speaker: prince_edward
          text: 英格兰的爱德华，册封你为伯爵！
        - id: ch03-b06
          speaker: narrator
          text: 亨顿感动得眼含泪水，可眼前的处境又实在阴森而滑稽，把他的严肃冲得七零八落。他拼命绷住脸，才没让心里的笑意露出来。一个人刚才还赤身裸体、鲜血淋漓地困在平民的枷架里，转眼竟被送上伯爵爵位那阿尔卑斯山般的巅峰，还要沐浴它的荣光。世上还有比这更荒唐的事吗？
        - id: ch03-b07
          speaker: narrator
          text: 他暗暗取笑自己，如今真是披金戴银了。梦幻王国的幽灵骑士又成了幽灵伯爵，一双嫩翅膀飞得未免太高。照这样下去，他很快就会像五月柱一样，挂满稀奇的饰物和虚假的荣衔。
        - id: ch03-b08
          speaker: narrator
          text: 可亨顿仍愿意珍惜这些毫无价值的东西，因为赐予它们的是一份真挚的爱。清白的手和正直的心主动送来的虚名，远胜过靠卑躬屈膝，从吝啬自私、另有所图的权贵手里换来的真爵位。
    - id: ch04
      title: 人群的敬意
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 令人畏惧的休爵士拨转马头，策马离开。人墙无声地分开，等他过去，又无声地合拢，依旧保持沉默。没有人敢替囚犯说一句好话，也没有人敢当面赞扬他，可这不要紧。众人不再辱骂，本身便是十足的敬意。
        - id: ch04-b02
          speaker: narrator
          text: 这时，一个刚到的人还不知道发生了什么。他开口讥讽那个所谓的冒牌货，接着举起一只死猫，正想朝亨顿扔过去。众人立刻把他打倒在地，一句话也没说，便把他踢了出去。随后，深沉的寂静再次笼罩全场。
