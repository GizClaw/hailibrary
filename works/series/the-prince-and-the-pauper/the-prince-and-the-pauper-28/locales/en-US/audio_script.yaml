  chapters:
    - id: ch01
      title: The Sacrifice
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Meanwhile, Miles had grown thoroughly tired of being locked up with nothing to do. At last his trial began, and he welcomed it. Any sentence would suit him, he thought, as long as it did not mean more time in prison. He soon learned his mistake. The court called him a sturdy vagabond and sentenced him to two hours in the stocks, both for being one and for attacking the master of Hendon Hall. No one even considered his claim that the man accusing him was his brother, or that the Hendon name and estate belonged to him by right. The court treated those claims as too absurd to examine.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Miles was furious. All the way to the stocks, he raged and threatened, but it changed nothing. The officers dragged him roughly along and cuffed him now and then for showing them no respect.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Edward could not force his way through the mob streaming after them. He had to follow far behind his faithful friend and servant. The court had nearly sent Edward to the stocks too, simply for keeping such bad company. Because he was young, they had let him go with a lecture and a warning.
        - id: ch01-b04
          speaker: narrator
          text: >-
            When the crowd finally stopped, Edward hurried around its outer edge, darting from place to place in search of an opening. It took time and a great deal of effort, but at last he broke through.
        - id: ch01-b05
          speaker: narrator
          text: >-
            There sat poor Miles in the shameful stocks, mocked and tormented by a filthy crowd. And this was the personal servant of the King of England. Edward had heard the sentence, but only now did he understand what it truly meant. His anger rose as the insult sank in.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Then an egg flew through the air and burst against Miles's cheek. The crowd roared with delight. In an instant, Edward's anger blazed. He sprang into the open circle and faced the officer in charge.
        - id: ch01-b07
          speaker: edward_tudor
          text: >-
            Shame on you! This man is my servant. Release him! I am the—
          emotion: angry
        - id: ch01-b08
          speaker: miles_hendon
          text: >-
            Hush! You will destroy yourself. Pay no attention to him, officer. The boy is mad.
          emotion: fearful
        - id: ch01-b09
          speaker: officer
          text: >-
            Do not worry, good fellow. I have no wish to pay him any mind. But I would gladly teach him a lesson.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The officer turned to one of his men.
        - id: ch01-b11
          speaker: officer
          text: >-
            Give the little fool a stroke or two of the whip. That may improve his manners.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Sir Hugh had ridden up a moment earlier for a quick look at the punishment. Now he offered his own advice.
        - id: ch01-b13
          speaker: hugh_hendon
          text: >-
            Six strokes would teach him better.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The officers seized Edward. He did not even struggle. The very thought of such an outrageous punishment against his sacred person left him frozen. History already carried the shameful tale of one English king being scourged. Edward could not bear the thought of adding a second such page.
        - id: ch01-b15
          speaker: narrator
          text: >-
            There was no escape. He must accept the whipping or beg them to spare him. The choice was cruel, but to Edward it was clear. A king might endure the lashes. A king could not beg.
        - id: ch01-b16
          speaker: narrator
          text: >-
            While Edward faced that choice, Miles found another way.
        - id: ch01-b17
          speaker: miles_hendon
          text: >-
            Let the child go! Have you no hearts? Can you not see how young and frail he is? Set him free. I will take the lashes for him.
        - id: ch01-b18
          speaker: hugh_hendon
          text: >-
            An excellent idea. I thank you for it. Release the little beggar, and give this fellow twelve strokes instead. A full dozen, and lay them on properly.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Edward drew breath to protest fiercely, but Sir Hugh stopped him with a warning.
        - id: ch01-b20
          speaker: hugh_hendon
          text: >-
            Yes, go on. Say everything you wish. But remember this. For every word you speak, he will receive six more strokes.
        - id: ch01-b21
          speaker: narrator
          text: >-
            They took Miles out of the stocks and bared his back. As the whip came down again and again, the poor little King turned his face away. He could do nothing to stop it. Tears ran freely along his cheeks, and for once he made no effort to hide them.
        - id: ch01-b22
          speaker: edward_tudor
          text: >-
            Ah, brave and noble heart. I will remember this loyal deed forever. And they will remember it too!
        - id: ch01-b23
          speaker: narrator
          text: >-
            Edward's wonder at Miles's sacrifice grew as the blows continued, and his gratitude grew with it. Saving a prince from wounds, perhaps even from death, was a great service. Miles had already done that for him. Yet in Edward's mind, even such a service became small beside what Miles was doing now. He was saving his prince from shame.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Miles never cried out. He took the heavy strokes with the courage of a soldier. Even that miserable mob began to respect him. They had seen him rescue the boy by accepting the punishment himself. Their jokes and jeers faded away. Soon, the only sound was the falling whip.
            Nobody laughed now.
        - id: ch01-b25
          speaker: narrator
          text: >-
            When the whipping ended, Miles was put back into the stocks. The square had become deeply still, nothing like the place of insults and shouting it had been only moments before. Edward came quietly to his side and whispered in his ear.
        - id: ch01-b26
          speaker: edward_tudor
          text: >-
            No king can make you noble, great and good soul, because One higher than kings has already done that. But a king can declare your nobility before all men.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Edward picked up the whip from the ground. He touched Miles's bleeding shoulders gently with it and whispered once more.
        - id: ch01-b28
          speaker: edward_tudor
          text: >-
            Edward of England names you Earl.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Miles was deeply moved, and tears rose in his eyes. Yet there was something so grimly funny about the whole scene that he could hardly keep his amusement from showing. One moment he was naked and bleeding in the common stocks. The next, he had been lifted from that low place to the dazzling height and splendor of an earldom. Nothing could have seemed more absurd.
        - id: ch01-b30
          speaker: miles_hendon
          text: >-
            Well, I am finely decorated now. The shadow-knight from the Kingdom of Dreams has become a shadow-earl. That is a dizzy climb for such an untried wing. If this continues, I will soon look like a maypole hung all over with imaginary titles and honors.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Still, those honors mattered to Miles because of the love with which Edward gave them.
        - id: ch01-b32
          speaker: miles_hendon
          text: >-
            They may have no value in the world, but I will treasure them. They came freely from a clean hand and an honest heart. I would rather have these poor make-believe honors than real ones bought by groveling before some selfish power that hated to grant them.
        - id: ch01-b33
          speaker: narrator
          text: >-
            The dreaded Sir Hugh turned his horse and spurred away. The living wall of people opened in silence to let him pass, then closed behind him just as silently. No one tried to stop him.
        - id: ch01-b34
          speaker: narrator
          text: >-
            No one dared to praise Miles or speak in his defense. It did not matter. Their silence was honor enough, because the abuse had stopped.
        - id: ch01-b35
          speaker: narrator
          text: >-
            One latecomer had not seen what happened or learned why the crowd had changed. He sneered at the impostor and raised a dead cat to throw after the insult. Before he could do it, the crowd knocked him down and kicked him out without a word.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Then the deep quiet settled over the square again.
