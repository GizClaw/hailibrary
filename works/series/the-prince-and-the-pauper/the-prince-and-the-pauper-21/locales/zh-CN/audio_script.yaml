audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华亲王
      tts:
        delivery: 高贵坚定，受辱时仍保持尊严
        timbre: 清亮稚嫩
        pace: 从容有力
        pitch: 中高
    hermit:
      display_name: 隐士
      tts:
        delivery: 神秘多变，在狂热与慈和之间骤然转换
        timbre: 低沉苍老，略带沙哑
        pace: 时而急促，时而缓慢
        pitch: 中低
    miles_hendon:
      display_name: 迈尔斯·亨顿
      tts:
        delivery: 豪爽诙谐，危急时勇敢坚定
        timbre: 洪亮粗粝
        pace: 明快有力
        pitch: 中低
  chapters:
    - id: ch01
      title: 刀锋下的黎明
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老人弓着身子悄悄走开，脚步轻得像一只猫。他搬来短凳坐下，一半身子映着摇晃的微光，另一半藏在黑影里。那双贪婪的眼睛，一刻也没离开熟睡的孩子。他不管时间过去多久，只耐心守着，一边磨刀，一边咕哝窃笑。他活像一只毛茸茸的大蜘蛛，守着落进网里、再也逃不掉的小虫。
        - id: ch01-b02
          speaker: narrator
          text: 很久以后，老人仍朝床上看着，心思却不知道飘到了哪里。忽然，他发现男孩的眼睛已经睁开了。那双眼睛睁得那么大，里面全是冻住一般的恐惧，正死死盯住他手里的刀。老人脸上慢慢浮出魔鬼得逞时才有的笑。他坐姿不动，磨刀的手也不停。
        - id: ch01-b03
          speaker: hermit
          text: 亨利八世的儿子，你已经祷告过了吗？
        - id: ch01-b04
          speaker: narrator
          text: 男孩拼命挣扎，可绳子把他捆得动弹不得。他的牙关也被封住，只能从嘴里挤出一声闷响。隐士听见了，便只当他回答了“是”。
        - id: ch01-b05
          speaker: hermit
          text: 那你再祷告一次。现在就念临终祷文！
        - id: ch01-b06
          speaker: narrator
          text: 男孩猛地哆嗦了一下，脸上的血色全褪尽了。他又挣扎起来，一会儿向左扭，一会儿向右转，发疯似的拉扯绳索。他用尽力气，可绳结还是纹丝不动。老怪物低头笑着，安稳地磨着刀，还一次次点头。
        - id: ch01-b07
          speaker: hermit
          text: 剩下的时间不多了，每一刻都很宝贵。快念临终祷文吧！
        - id: ch01-b08
          speaker: narrator
          text: 男孩终于发出一声绝望的呻吟，再也挣扎不动了，只能躺在那里大口喘气。泪珠接连滚出眼眶，沿着脸颊往下淌。可老人看着这副可怜模样，心里没有生出半点怜悯。
        - id: ch01-b09
          speaker: narrator
          text: 外面的天色渐渐亮了。隐士也发现黑夜快要过去，声音一下变得尖厉，其中还透出几分慌乱。
        - id: ch01-b10
          speaker: hermit
          text: 我不能再享受这份狂喜了！黑夜已经过去，可我觉得它才刚刚开始，不过一眨眼罢了。真希望这一夜能有一年那么长！你这个戕害教会之人的孽种，要是害怕看见接下来的事，就闭上你那双快要死去的眼睛——
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: 后面的话，全变成了谁也听不清的咕哝。老人握着刀跪下来，身子慢慢压向正在呻吟的孩子。
        - id: ch01-b12
          speaker: narrator
          text: 就在这时，小屋附近忽然传来人声。隐士吓得松开手，刀一下掉在地上。他赶紧把一张羊皮盖到男孩身上，又浑身发抖地站起来。外面的声音越来越响，先是粗暴的争吵和怒骂，接着响起打斗声，还有人在高喊救命。随后，一阵急促的脚步杂乱地退远了。
        - id: ch01-b13
          speaker: narrator
          text: 紧接着，有人猛敲小屋的门，一下又一下，简直像雷声砸在门板上。门外的人扯开嗓门大喊。
        - id: ch01-b14
          speaker: miles_hendon
          text: 喂——！开门！以一切魔鬼的名义，赶紧给我开门！
        - id: ch01-b15
          speaker: narrator
          text: 国王从来没有听过比这更动听、更叫人庆幸的声音。门外正是迈尔斯·亨顿！
    - id: ch02
      title: 一位自称大天使的人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 隐士气得直咬牙，却拿门外的人毫无办法。他飞快地离开卧房，把门关在身后。很快，国王就听见两人在隔壁那间“礼拜堂”里说起话来。
        - id: ch02-b02
          speaker: miles_hendon
          text: 尊敬的先生，向您致敬，也向您问候！那个男孩在哪儿？我是说，我的男孩在哪儿？
        - id: ch02-b03
          speaker: hermit
          text: 朋友，你说的是哪个男孩？
        - id: ch02-b04
          speaker: miles_hendon
          text: 哪个男孩？神父先生，别撒谎，也别玩花样，我可没心情听这些！我在附近抓住了几个恶棍，认定是他们偷走了孩子，就逼他们招供。他们说孩子又逃了，他们一路循着踪迹追到您门前，还把孩子的脚印指给我看。别再含糊其辞了。神圣的先生，您若不把他交出来——快说，那男孩究竟在哪儿？
          emotion: angry
        - id: ch02-b05
          speaker: hermit
          text: 哦，好先生，您大概是在找昨晚住在这里的那个流浪儿吧。他衣服破破烂烂，还说自己是国王。像您这样的人，若真会关心他那样的孩子，我就告诉您好了。我派他出门办了一件事，他过不了多久就会回来。
        - id: ch02-b06
          speaker: miles_hendon
          text: 还要多久？到底多久？别再浪费时间了！我现在去追，还来得及追上他吗？他什么时候能回来？
        - id: ch02-b07
          speaker: hermit
          text: 你不必出去。他很快就回来了。
        - id: ch02-b08
          speaker: miles_hendon
          text: 那好，我就尽量等一等。可先别忙！您说，是您派他出去办事？是您？这话一听就是假的，他根本不肯去。您若敢这样使唤他，他非揪住您那把老胡子不可。朋友，您在说谎，而且这谎撒得一点也不高明！别说替您办事，他不肯替任何人做这种事。
        - id: ch02-b09
          speaker: hermit
          text: 若是凡人，他当然不会听命，或许确实如此。不过，我不是凡人。
        - id: ch02-b10
          speaker: miles_hendon
          text: 什么？看在上帝的分上，那您到底是什么？
          emotion: surprised
        - id: ch02-b11
          speaker: hermit
          text: 这是秘密，你千万不能告诉别人。我是一位大天使！
        - id: ch02-b12
          speaker: narrator
          text: 亨顿发出一声震天动地的怪叫，其中还混进几句不怎么虔敬的话。随后，他又一本正经地开了口。
        - id: ch02-b13
          speaker: miles_hendon
          text: 原来如此！难怪他肯乖乖听话。我早知道，若有凡人叫他去干仆人的活，他连手指头都不动，更别提挪脚了。可是天哪，大天使亲自下令就不同了。哪怕是国王，也非服从不可！让我——嘘！刚才那是什么声音？
        - id: ch02-b14
          speaker: narrator
          text: 小国王一直躺在卧房里，一会儿怕得发抖，一会儿又因看见希望而战栗。他使出全身力气，不断发出痛苦的呻吟，总以为下一声能钻进亨顿耳中。可每一次，他都只能痛苦地明白，那声音要么没传过去，要么没引起注意。
        - id: ch02-b15
          speaker: narrator
          text: 如今，亨顿终于听见了动静。国王就像一个快要死去的人，忽然吸到了田野间吹来的清新空气，身上立刻又有了力气。他拼尽全力，再次发出呻吟。可这时，隐士也开口了。
        - id: ch02-b16
          speaker: hermit
          text: 声音？我什么也没听见，只听见外面的风。
        - id: ch02-b17
          speaker: miles_hendon
          text: 也许真是风。对，多半就是了。其实这声音，我一直隐隐约约听见——等等，又来了！这不是风声！听起来太古怪了。走，我们把它找出来！
        - id: ch02-b18
          speaker: narrator
          text: 国王欢喜得几乎承受不住。疲惫的双肺又拼命鼓动起来，这次他满怀希望。可牙关被布带封住，身上又盖着羊皮，他再怎么努力，声音也传不远。紧接着，隐士的一句话又把他推进绝望。
        - id: ch02-b19
          speaker: hermit
          text: 啊，那声音是外面传来的。我想，就在那边的小树林里。跟我来，我在前面带路。
        - id: ch02-b20
          speaker: narrator
          text: 国王听见他们还在说话，却已经一同走出门去。两人的脚步越来越轻，很快就再也听不见了。小屋里只剩下国王一个人，还有一片仿佛预示着灾难的寂静。那寂静沉沉压下来，越等越叫人害怕。
    - id: ch03
      title: 希望再次远去
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 对国王来说，这次等待简直像过了一辈子。终于，远处又响起脚步和说话声，正朝小屋靠近。其中还夹着蹄子踏地的声音。随后，他听见亨顿说道。
        - id: ch03-b02
          speaker: miles_hendon
          text: 我不等了。我不能再这样等下去！他一定是在这片密林里迷了路。快告诉我，他朝哪个方向走了？马上给我指出来。
        - id: ch03-b03
          speaker: hermit
          text: 他朝——先等一等，我和你一起去。
        - id: ch03-b04
          speaker: miles_hendon
          text: 好，好极了！说真的，您的心肠比您的长相可强得多。圣母在上，天底下恐怕再也找不出第二位像您这么热心的大天使了。您要不要骑牲口？可以骑那头给我家孩子准备的小驴，也可以把您那双神圣的腿跨到这头骡子背上。这坏脾气的家伙，是我特意给自己弄来的。
        - id: ch03-b05
          speaker: miles_hendon
          text: 买下它，可真叫我上了一个大当。就算我付的钱只有一枚铜板，而且那铜板还是借给失业补锅匠、放上一个月才能收到的利息，我照样觉得自己吃了亏！
        - id: ch03-b06
          speaker: hermit
          text: 不必了。你骑骡子，手里牵着驴。我更信得过自己的两只脚，所以还是走路。
        - id: ch03-b07
          speaker: miles_hendon
          text: 那就请您先替我看住这头小家伙。我得把自己的性命攥紧了，再想办法爬上那头大家伙的背。
        - id: ch03-b08
          speaker: narrator
          text: 外面顿时乱成一团。骡子又踢又蹬，亨顿又打又骂，踩踏声和纵跃声接连响起。他那一串咒骂，更像滚过树林的雷。最后，他对着骡子狠狠痛斥一番。那头牲口大概给骂泄了气，从这一刻起，这场仗似乎停了。
        - id: ch03-b09
          speaker: narrator
          text: 被捆住的小国王只能躺在那里，听着他们的声音再次远去。他们的说话声越来越模糊，脚步声也越来越轻，最后什么都听不到了。他心里的痛苦，已经不是话语能够说清。就在这一刻，希望全离开了他，只剩一片麻木的绝望压在胸口。
        - id: ch03-b10
          speaker: prince_edward
          text: 我唯一的朋友受了骗，已经让人支走了。隐士很快就会回来，然后——
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: 国王猛吸了一口气，后面的话再也说不下去。他又一次疯狂地扭动身体，拼命拉扯绳索。挣扎之中，那张一直压住他的羊皮终于滑落下来。
    - id: ch04
      title: 来的却不是亨顿
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这时，屋门忽然开了。那声响叫国王从头到脚冷了个透。他觉得隐士已经回来，甚至仿佛能感觉到刀刃正贴上自己的喉咙。恐惧使他紧紧闭上眼睛，可同样是这份恐惧，又逼得他马上把眼睛睁开。
        - id: ch04-b02
          speaker: narrator
          text: 站在他面前的人并不是隐士。来的是约翰·康第和雨果！
        - id: ch04-b03
          speaker: narrator
          text: 要不是嘴巴还被牢牢缚住，国王一定会当场喊出：“感谢上帝！”
        - id: ch04-b04
          speaker: narrator
          text: 一两分钟后，绑住他手脚的绳索全解开了。可他并没有得到自由。约翰·康第和雨果一人抓住他一条胳膊，攥得紧紧的，随后押着他飞快穿过森林。
