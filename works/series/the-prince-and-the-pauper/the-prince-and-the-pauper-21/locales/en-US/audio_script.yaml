audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently ironic
        timbre: clear and resonant
        pace: measured
        pitch: medium
    edward_tudor:
      display_name: Edward Tudor
      tts:
        delivery: youthful, proud, and resolute
        timbre: clear and light
        pace: measured
        pitch: medium-high
    hermit:
      display_name: The Hermit
      tts:
        delivery: fanatical, menacing, and unpredictable
        timbre: dry and rasping
        pace: deliberate
        pitch: medium-low
    miles_hendon:
      display_name: Miles Hendon
      tts:
        delivery: bold, warmhearted, and wry
        timbre: rugged and resonant
        pace: lively
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Hermit's Vigil
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The old man slipped away, bent low and moving as quietly as a cat. He brought back the low bench and sat down. The weak, wavering light fell across half his body, while the other half remained in darkness.
        - id: ch01-b02
          speaker: narrator
          text: >-
            His hungry eyes stayed fixed on the sleeping boy. Time passed, but the hermit never noticed. He softly sharpened his knife, muttering and chuckling to himself. He looked like a huge gray spider watching some helpless insect caught in its web.
        - id: ch01-b03
          speaker: narrator
          text: >-
            A long while went by. The old man was still staring, though his thoughts had wandered far away. Then he suddenly realized that the boy's eyes were open. They were wide with frozen horror, and they were fixed on the knife.
        - id: ch01-b04
          speaker: narrator
          text: >-
            A wicked smile crept across the hermit's face. He did not change his position or stop sharpening the blade.
        - id: ch01-b05
          speaker: hermit
          text: >-
            Son of Henry the Eighth, have you said your prayers?
        - id: ch01-b06
          speaker: narrator
          text: >-
            Edward fought against the cords, but they held him fast. His jaws were bound shut, and only a muffled sound escaped them. The hermit chose to take that sound as yes.
        - id: ch01-b07
          speaker: hermit
          text: >-
            Then say them once more. Say the prayer for a dying man.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The boy shuddered, and all the color left his face. Again he twisted and turned. He pulled at the cords with every bit of strength he had, fighting wildly to break free. Nothing gave way.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The old monster only smiled down at him and nodded. Calmly, steadily, he kept sharpening the knife. Now and then he muttered the same warning.
        - id: ch01-b10
          speaker: hermit
          text: >-
            You have only a few precious moments left. Pray the prayer for the dying.
        - id: ch01-b11
          speaker: narrator
          text: >-
            At last Edward gave a hopeless groan. He stopped struggling and lay there panting. Tears gathered in his eyes and ran one by one down his face. Even that pitiful sight did not soften the savage old man.
    - id: ch02
      title: Voices at the Door
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Dawn was beginning to break. The hermit saw the growing light, and when he spoke again, a sudden nervousness sharpened his voice.
        - id: ch02-b02
          speaker: hermit
          text: >-
            I cannot enjoy this delight any longer! The night is gone already. It felt like a single moment. If only it had lasted a year! Child of the man who robbed the Church, shut your dying eyes if you are afraid to watch me—
        - id: ch02-b03
          speaker: narrator
          text: >-
            His words dissolved into sounds no one could understand. Knife in hand, he dropped to his knees and leaned over the moaning boy.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Then voices sounded near the cabin. The knife fell from the hermit's hand. Trembling, he threw a sheepskin over Edward and sprang up.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The voices grew louder, rougher, and angrier. Blows followed, then cries for help. Rapid footsteps clattered away. A moment later, someone hammered on the cabin door.
        - id: ch02-b06
          speaker: miles_hendon
          text: >-
            Hullo there! Open this door at once, in the name of all the devils!
        - id: ch02-b07
          speaker: narrator
          text: >-
            No sound had ever made sweeter music in Edward's ears. It was the voice of Miles Hendon.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The hermit ground his teeth, helpless with rage. He hurried out of the bedchamber and closed the door behind him. From the room he called his chapel, the King heard their conversation.
        - id: ch02-b09
          speaker: miles_hendon
          text: >-
            My respects, reverend sir. Now, where is the boy? Where is my boy?
        - id: ch02-b10
          speaker: hermit
          text: >-
            Which boy do you mean, friend?
        - id: ch02-b11
          speaker: miles_hendon
          text: >-
            Which boy? Do not lie to me, priest, and do not try any tricks. I am in no mood for either. Near this place I caught the villains I believed had stolen him from me, and I forced them to confess.
        - id: ch02-b12
          speaker: miles_hendon
          text: >-
            They said the boy had escaped again, and they had followed him right to your door. They even showed me his footprints. Enough of this dodging, holy sir. If you do not bring him out—where is he?
        - id: ch02-b13
          speaker: hermit
          text: >-
            Ah, good sir, perhaps you mean the ragged young wanderer who calls himself a king. He stayed here last night. If a man like you cares about a boy like that, you should know I sent him on an errand. He will return soon.
        - id: ch02-b14
          speaker: miles_hendon
          text: >-
            How soon? Tell me quickly. There is no time to waste. Can I catch up with him? When will he be back?
        - id: ch02-b15
          speaker: hermit
          text: >-
            There is no need to go anywhere. He will be back before long.
    - id: ch03
      title: The Archangel's Errand
      blocks:
        - id: ch03-b01
          speaker: miles_hendon
          text: >-
            Very well. I will try to wait. But hold on. You sent him on an errand? You did? That cannot be true. He would never agree to it. If you offered him such an insult, he would pull that old beard of yours.
        - id: ch03-b02
          speaker: miles_hendon
          text: >-
            You have lied to me, friend. I am certain of it. That boy would run an errand for neither you nor any other man.
        - id: ch03-b03
          speaker: hermit
          text: >-
            Not for any man, perhaps. But I am not a man.
        - id: ch03-b04
          speaker: miles_hendon
          text: >-
            What? In God's name, what are you, then?
          emotion: surprised
        - id: ch03-b05
          speaker: hermit
          text: >-
            This is a secret, so see that you tell no one. I am an archangel.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Miles let out a tremendous cry. Not all of it was holy language.
        - id: ch03-b07
          speaker: miles_hendon
          text: >-
            Well, that explains why he obeyed you! I knew he would never lift a hand or take a step to serve an ordinary mortal. But of course, even a king must obey an archangel's command. Let me—hush! What was that sound?
        - id: ch03-b08
          speaker: narrator
          text: >-
            All this time, the little King lay in the next room, shaking first with terror and then with hope. Again and again he forced all his strength into his painful moans. Each time, he waited for Hendon to hear. Each time, it seemed the sound had failed to reach him, or had meant nothing to him.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Now Miles's question came to Edward like a breath of fresh air reaching a dying man. He gathered his strength and tried once more.
        - id: ch03-b10
          speaker: hermit
          text: >-
            A sound? I heard nothing but the wind.
        - id: ch03-b11
          speaker: miles_hendon
          text: >-
            Perhaps it was. Yes, that must be it. I have heard it faintly all the—there! It came again. That is not the wind. What a strange noise! Come, we will find it.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Edward could hardly bear such joy. Though his lungs were tired, he pushed them as hard as he could, and now he had hope. But his bound jaws trapped the sound, and the heavy sheepskin smothered it. Then his heart sank as the hermit spoke.
        - id: ch03-b13
          speaker: hermit
          text: >-
            Ah, it came from outside. I think it came from that grove over there. Follow me. I will show you the way.
        - id: ch03-b14
          speaker: narrator
          text: >-
            The King heard both men leave the cabin, still talking. Their footsteps quickly faded. Then he was alone, surrounded by a terrible silence that seemed to brood over him and warn of what was coming.
    - id: ch04
      title: Hope Rides Away
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            It felt like an age before Edward heard footsteps and voices drawing near again. This time another sound came with them. It seemed to be the stamping of hoofs.
        - id: ch04-b02
          speaker: miles_hendon
          text: >-
            I will wait no longer. I cannot. The boy must have lost his way in these thick woods. Which direction did he take? Point it out, quickly.
        - id: ch04-b03
          speaker: hermit
          text: >-
            He went—but wait. I will come with you.
        - id: ch04-b04
          speaker: miles_hendon
          text: >-
            Good, good! You have a kinder heart than your face suggests. Truly, I doubt there is another archangel anywhere as goodhearted as you.
        - id: ch04-b05
          speaker: miles_hendon
          text: >-
            Will you ride? You may take the little donkey I brought for my boy. Or would you rather put your holy legs over this miserable slave of a mule I found for myself?
        - id: ch04-b06
          speaker: miles_hendon
          text: >-
            Even if that mule had cost no more than one month's interest on a brass farthing lent to a tinker with no work, I would still have been cheated.
        - id: ch04-b07
          speaker: hermit
          text: >-
            No. You ride the mule and lead the donkey. I trust my own feet more, so I will walk.
        - id: ch04-b08
          speaker: miles_hendon
          text: >-
            Then please hold the little beast for me while I put my life at risk and do my best to climb onto the big one.
        - id: ch04-b09
          speaker: narrator
          text: >-
            What followed was a wild confusion of kicks, blows, stamping hoofs, and plunges. Miles poured out a thundering storm of curses. At last he spoke so bitterly to the mule that its spirit must have broken, for the battle suddenly ended.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Still tied and helpless, the little King listened in misery as the footsteps and voices faded into the distance. For the moment, every bit of hope left him. A heavy despair settled over his heart.
        - id: ch04-b11
          speaker: edward_tudor
          text: >-
            My only friend has been fooled and sent away. The hermit will come back, and then—
          emotion: fearful
        - id: ch04-b12
          speaker: narrator
          text: >-
            Edward could finish only with a gasp. At once he began fighting his bonds again, so wildly that the sheepskin slipped off him.
    - id: ch05
      title: New Captors
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Then he heard the cabin door open.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The sound chilled him to the bone. He could almost feel the hermit's knife against his throat already. Terror made him squeeze his eyes shut. Then the same terror forced him to open them again.
        - id: ch05-b03
          speaker: narrator
          text: >-
            John Canty and Hugo stood before him.
        - id: ch05-b04
          speaker: narrator
          text: >-
            If Edward's jaws had been free, he would have thanked God.
        - id: ch05-b05
          speaker: narrator
          text: >-
            A moment or two later, his arms and legs were untied. John Canty seized one of his arms, and Hugo seized the other. Holding him tightly between them, his captors hurried him through the forest as fast as they could go.
