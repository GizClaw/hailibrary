audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    tom_canty:
      display_name: 汤姆·康蒂
      tts:
        delivery: 天真敏捷，窘迫时带着平民孩子的直率
        timbre: 清亮稚嫩
        pace: 轻快灵活
        pitch: 中高
    hertford:
      display_name: 赫特福德勋爵
      tts:
        delivery: 老练克制，对国王始终恭谨而婉转
        timbre: 沉稳饱满
        pace: 从容
        pitch: 中低
    under_sheriff:
      display_name: 副郡长
      tts:
        delivery: 恭敬守礼，对法律与判决深信不疑
        timbre: 端正厚实
        pace: 平稳
        pitch: 中低
    prisoner:
      display_name: 男囚犯
      tts:
        delivery: 质朴急切，绝望中仍保有诚恳
        timbre: 粗哑疲惫
        pace: 时缓时急
        pitch: 中低
    courtier_1:
      display_name: 廷臣甲
      tts:
        delivery: 谨慎低声，言语中带着赞叹
        timbre: 清晰成熟
        pace: 适中
        pitch: 中等
    courtier_2:
      display_name: 廷臣乙
      tts:
        delivery: 老成审慎，观察细致
        timbre: 温厚
        pace: 从容
        pitch: 中低
    courtier_3:
      display_name: 廷臣丙
      tts:
        delivery: 郑重笃定，带着如释重负的欣慰
        timbre: 洪亮稳重
        pace: 适中
        pitch: 中低
    learned_judge:
      display_name: 法官
      tts:
        delivery: 一本正经，熟稔法理而不觉荒谬
        timbre: 干净苍老
        pace: 徐缓
        pitch: 中低
    elderly_courtier:
      display_name: 年长廷臣
      tts:
        delivery: 压低声音，讥诮中透着机敏
        timbre: 苍老柔和
        pace: 不紧不慢
        pitch: 低
    accused_woman:
      display_name: 被控的女人
      tts:
        delivery: 惊惧卑微，护子之情真切强烈
        timbre: 沙哑单薄
        pace: 急促而颤抖
        pitch: 中等
  chapters:
    - id: ch01
      title: 王冠下的第四天
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天，各国使节带着衣饰华美的随从来朝见。汤姆威严地坐在御座上接待他们。起初，那片辉煌让他看得入迷，心里的想象也亮了起来。可觐见又长又闷，那些致辞大多也叫人厌倦。没过多久，兴致就变成了疲惫和想家。
        - id: ch01-b02
          speaker: narrator
          text: 赫特福德不时教汤姆说什么，他便尽力照着说。可是这些事太陌生，他又浑身不自在，最后也只能勉强应付过去。他看起来足够像一位国王，却实在没有当国王的感觉。典礼终于结束时，他打心底里高兴，痛痛快快地松了一口气。
        - id: ch01-b03
          speaker: narrator
          text: 接下来，汤姆把大半天都花在王室公务上。依他自己的说法，那些时间全都浪费了。就连专门留给王子的两个钟头游戏和消遣，也被一道道限制和礼节捆得严严实实。做什么都有人看着，每一步都有规矩，那两个钟头也就成了负担。只有同挨打童单独相处的一个钟头，既能解闷，又能打听自己急需的宫中消息，算得上真正的收获。
        - id: ch01-b04
          speaker: narrator
          text: 汤姆当国王的第三天，也同前两天差不多。不过，罩在心头的阴云总算淡了一点。他开始习惯眼下的处境，也开始习惯周围的一切，不再像最初那样难受。那副锁链仍旧磨人，却不是一刻不停地磨。一个钟头又一个钟头过去，显贵们站在面前向他行礼，也渐渐没有那么叫他痛苦和慌张了。
        - id: ch01-b05
          speaker: narrator
          text: 要不是还有一件怕人的事等着，第四天到来时，汤姆本不会这样发愁。那一天，他得第一次公开用膳。日程上明明还有更重大的事。他要主持枢密会议。那些国家远远近近，散布在辽阔的世界各处，大臣们都要来问国王该用什么方略，等他亲口下令。赫特福德也要正式受命做护国公，另外还有几件大事。可在汤姆眼里，这些全比不上公开吃饭可怕。
        - id: ch01-b06
          speaker: narrator
          text: 他想到自己得孤零零地吃，四周无数双好奇的眼睛盯着，无数张嘴悄悄议论。如果不小心出了错，大家还会盯着错处说个不停。可是，谁也拦不住第四天。它到底还是来了。
        - id: ch01-b07
          speaker: narrator
          text: 可怜的汤姆一早便情绪低落，心不在焉，怎么也振作不起来。例行公务拖得没完没了，叫他疲惫不堪。他又觉得自己像个被关住的人。临近中午，他在宽敞的觐见厅里同赫特福德交谈，没精打采地等着钟响。到了时辰，一大群高官和廷臣就要正式前来觐见。
        - id: ch01-b08
          speaker: narrator
          text: 汤姆慢慢走到窗前，被宫门外大路上的人来人往吸引住了。他不只是看热闹。他真想冲进那片喧闹，亲自尝尝自由的滋味。这时，大路远处来了一群最穷苦的人。有男人、女人，也有孩子。他们乱哄哄地叫嚷着，队伍前头已经快到宫门了。
        - id: ch01-b09
          speaker: tom_canty
          text: 真想知道那边出了什么事！
        - id: ch01-b10
          speaker: hertford
          text: 您就是国王。请陛下准许微臣去处置。
        - id: ch01-b11
          speaker: tom_canty
          text: 准，当然准！我正巴不得呢！
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: 汤姆兴奋起来，心里想着，当国王倒也不全是苦闷。王位确实有它的方便。赫特福德叫来一名侍从，让他向卫队长传令。
        - id: ch01-b13
          speaker: hertford
          text: 拦住那群人，问清他们为什么聚在那里。这是国王的命令。
        - id: ch01-b14
          speaker: narrator
          text: 几秒钟后，一长列身披亮甲的王家卫兵走出宫门，在人群前横着排开。很快便有信使回来禀报。那群人正跟着三个犯人去刑场，犯人是一个男人、一个女人和一个小女孩。他们触犯了王国的治安与尊严，都要被处死。
        - id: ch01-b15
          speaker: narrator
          text: 死刑，而且是横死。汤姆一想到这三个可怜人的命运，心就被揪紧了。怜悯占满了他的心，再也容不下别的念头。他没有想法律为何被冒犯，也没有想三个犯人给受害者带来过多少悲痛和损失。他只看见刑场，只看见那种阴森可怕的死亡正悬在三个人头顶，随时就要落下来。
        - id: ch01-b16
          speaker: narrator
          text: 这一刻，他甚至忘了自己只是国王的影子，不是真国王。命令一下便冲出了口。
        - id: ch01-b17
          speaker: tom_canty
          text: 把他们带到这里来！
        - id: ch01-b18
          speaker: narrator
          text: 汤姆立刻羞红了脸，一句道歉已经涌到嘴边。可他看看伯爵，又看看等候在旁的侍从，两个人对这道命令一点也不惊讶。侍从深深行礼，像接到再寻常不过的差事那样倒退着离开房间，出去传旨。汤姆这才把道歉咽了回去，心里反倒涌起一阵骄傲。他又一次发现，王位确实能补偿不少苦处。
        - id: ch01-b19
          speaker: narrator
          text: 从前读老神父的故事时，汤姆总爱幻想自己是个王子，可以对所有人发号施令。他说做这个，做那个，没有人敢拦。现在，那场幻想竟变成了真的。
    - id: ch02
      title: 三名死囚来到御前
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 觐见厅的大门开了。一个又一个响亮的头衔被报出来，拥有那些头衔的人跟着走进厅里。贵族们衣着华美，很快便站满了半间屋子。汤姆几乎没留意他们。他心里激动得厉害，全部心思都落在三个犯人身上。坐上御座以后，他一刻不停地望着门口，脸上的焦急谁都看得出来。众人见了，也不去打扰，只在一旁混杂着谈些公务和宫廷闲话。
        - id: ch02-b02
          speaker: narrator
          text: 过了一会儿，军人整齐而有节奏的脚步声越来越近。副郡长押着三个犯人，在一队王家卫兵护送下走进厅里。他先在汤姆面前跪下，随后起身退到一边。三名死囚也跪了下来，一直没有起身。卫兵则列队站在汤姆的座椅后面。
        - id: ch02-b03
          speaker: narrator
          text: 汤姆好奇地打量那个男人。他的衣着或相貌，勾起了一点模糊的记忆。汤姆觉得以前见过他，却怎么也想不起时间和地方。那人飞快地抬头看了一眼，又承受不住君王的威严，马上低下脸去。可这一眼已经够了。汤姆认出了他。
        - id: ch02-b04
          speaker: narrator
          text: 新年第一天，天冷风大，就是这个陌生人从泰晤士河里救起了贾尔斯·威特。汤姆觉得那是件勇敢的好事，可惜此人后来又干了卑劣的勾当，才落到今天这个悲惨地步。那一天，那个时辰，他都记得格外清楚。救人一小时后，十一点钟刚敲响，康蒂奶奶便狠狠揍了他一顿。那顿打厉害得出奇，无论是此前还是此后的毒打，同它相比都算不了什么，简直只能算轻柔的抚摸和爱抚。
        - id: ch02-b05
          speaker: narrator
          text: 汤姆命人暂时带走女人和女孩，只留下男人。接着，他问副郡长。
        - id: ch02-b06
          speaker: tom_canty
          text: 好先生，这个人犯了什么罪？
        - id: ch02-b07
          speaker: under_sheriff
          text: 启禀陛下，他下毒害死了您的一名臣民。
        - id: ch02-b08
          speaker: narrator
          text: 汤姆本来很同情这个人，也很佩服他敢下水救人。听到这项罪名，两种感情都受了重重一击。
        - id: ch02-b09
          speaker: tom_canty
          text: 他的罪证当真确凿吗？
        - id: ch02-b10
          speaker: under_sheriff
          text: 千真万确，陛下。
        - id: ch02-b11
          speaker: narrator
          text: 汤姆叹了口气。
        - id: ch02-b12
          speaker: tom_canty
          text: 把他带走吧，他犯的罪该受死刑。真可惜，他原是个勇敢的人。不，我是说，他看起来像个勇敢的人。
        - id: ch02-b13
          speaker: narrator
          text: 囚犯忽然用力合起双手，又在绝望中使劲绞扭。他抬头向国王哀求，吓得连一句完整的话都很难说出。
        - id: ch02-b14
          speaker: prisoner
          text: 国王陛下，若您肯怜悯无路可走的人，就可怜可怜我吧！我是清白的，指控我的证据也很不足。可我现在求的不是翻案。判决已经下了，改不了。我只求一项恩典，因为那刑罚实在受不住。求您开恩，下令把我绞死吧！
          emotion: fearful
        - id: ch02-b15
          speaker: narrator
          text: 汤姆惊呆了。这同他料想的完全不一样。
        - id: ch02-b16
          speaker: tom_canty
          text: 我的天，这算什么古怪的请求？他们本来不就是要绞死你吗？
          emotion: surprised
        - id: ch02-b17
          speaker: prisoner
          text: 不是啊，仁慈的陛下！他们要把我活活煮死！
          emotion: fearful
        - id: ch02-b18
          speaker: narrator
          text: 这句骇人的话差点让汤姆从椅子上跳起来。他好不容易回过神，马上喊道。
        - id: ch02-b19
          speaker: tom_canty
          text: 就照你的心愿办，可怜的人！哪怕你毒死过一百个人，也不该受这种惨无人道的死刑。
        - id: ch02-b20
          speaker: narrator
          text: 囚犯把脸伏到地上，激动地连声感谢，最后又送上祝愿。
        - id: ch02-b21
          speaker: prisoner
          text: 愿上帝保佑您永不落难！可若您有一天真的遭遇不幸，愿世人记得您今日对我的仁慈，也用同样的仁慈回报您！
        - id: ch02-b22
          speaker: tom_canty
          text: 大人，法律当真准许用这样凶残的刑罚处死他吗？
        - id: ch02-b23
          speaker: hertford
          text: 陛下，这正是法律给投毒犯定的刑罚。在德国，造伪币的人要放进油里煮死。他们不是一下把人扔进去，而是用绳子吊着，慢慢往热油里放。先是双脚，然后是小腿，接着……
        - id: ch02-b24
          speaker: tom_canty
          text: 求您别再说了，大人，我受不了！请设法把这条法律改掉吧。别再让可怜人受这种酷刑了！
          emotion: fearful
        - id: ch02-b25
          speaker: narrator
          text: 汤姆用双手蒙住眼睛，不让那幅可怕的景象钻进脑海。他恳求赫特福德设法改变法律，再也不要让别的可怜人受那样的折磨。赫特福德听后非常欣慰。他天性仁慈宽厚，而在那个残酷年代，他这个阶层里这样的人并不多。
        - id: ch02-b26
          speaker: hertford
          text: 陛下这番高尚的话，已经判了那条法律的死刑。历史会记住这件事，把它当作王室的荣耀。
    - id: ch03
      title: 一桩投毒案
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 副郡长正要带走犯人，汤姆却示意他先等一等。方才只是把活活煮死改成绞刑，现在他还想把整件案子查清楚。
        - id: ch03-b02
          speaker: tom_canty
          text: 好先生，我还想查查这件案子。他说罪名没有充分证据。把你知道的全讲出来。
        - id: ch03-b03
          speaker: under_sheriff
          text: 陛下，审讯时查明，这个人去过伊斯灵顿村的一所房子，那里住着一个病人。三名证人说，他在上午十点进去。另有两人说，是十点又过了几分钟。病人当时独自在家睡觉。这个人不久便离开了。不到一个钟头，病人就在抽搐和呕吐中死去。
        - id: ch03-b04
          speaker: tom_canty
          text: 有人亲眼看见他下毒吗？找到毒药了吗？
        - id: ch03-b05
          speaker: under_sheriff
          text: 没有，陛下，都没有。
        - id: ch03-b06
          speaker: tom_canty
          text: 那么，人们凭什么断定病人中了毒？
        - id: ch03-b07
          speaker: under_sheriff
          text: 医生们作证说，只有中毒才会出现那种症状，绝不会有人因别的缘故那样死去。
        - id: ch03-b08
          speaker: narrator
          text: 在那个头脑简单的年代，这份证据很有分量。汤姆也觉得它十分有力。
        - id: ch03-b09
          speaker: tom_canty
          text: 医生懂得自己的行当，他们大概不会错。这个可怜人的处境看来很不妙。
        - id: ch03-b10
          speaker: under_sheriff
          text: 这还不是全部，陛下。后面还有更糟的事。村里从前有个女巫，后来不知去了哪里。许多人作证说，她早就悄悄告诉他们，那个病人会中毒而死，下毒的会是个陌生人。那人长着棕色头发，穿着普通的破旧衣裳。眼前这个犯人正好样样都对得上。请陛下郑重看待这项情由，因为一切早就被预言出来了。
        - id: ch03-b11
          speaker: narrator
          text: 在那个迷信的年代，这个说法有压倒一切的力量，简直无法反驳。汤姆觉得案情已经定了。要是证据真能证明什么，这个可怜人的罪名似乎已经证实无疑。不过，他仍不肯马上结束审问，还是给了犯人最后一次为自己说话的机会。
        - id: ch03-b12
          speaker: tom_canty
          text: 你若有话能为自己辩解，就说吧。
        - id: ch03-b13
          speaker: prisoner
          text: 没有什么话能管用，陛下。我是清白的，却证明不了。我没有朋友。要是有，我便能证明案发那天，我根本不在伊斯灵顿。那个时辰，我正在一里格以外的沃平老阶梯。他们说我在夺取一条性命，其实我正在救人。有个孩子掉进水里……
        - id: ch03-b14
          speaker: tom_canty
          text: 住口！郡长，那件案子发生在哪一天？
        - id: ch03-b15
          speaker: under_sheriff
          text: 新年第一天，上午十点，或是又过了几分钟，最尊贵的陛下……
        - id: ch03-b16
          speaker: tom_canty
          text: 放了他！这是国王的旨意！
        - id: ch03-b17
          speaker: narrator
          text: 这道脱口而出的命令不大像国王的做派，汤姆又红了脸，赶紧替自己找补。
        - id: ch03-b18
          speaker: tom_canty
          text: 竟要凭这种荒唐又愚蠢的证据绞死一个人，实在叫我生气！
          emotion: angry
        - id: ch03-b19
          speaker: narrator
          text: 厅里响起一阵低低的赞叹。众人并不是赞成汤姆释放一个已经定罪的投毒犯。赦免这种人是否妥当、是否明智，在场几乎没人觉得自己可以赞成，更谈不上称许。他们真正赞叹的，是汤姆审问时表现出的聪慧，还有下令时那股果断的气魄。几名廷臣低声议论起来。
        - id: ch03-b20
          speaker: courtier_1
          text: 这不是个疯王，他的神智清醒得很。
        - id: ch03-b21
          speaker: courtier_2
          text: 他的问题问得多么明白，处置案子又那样果断威严，真像从前的他。
        - id: ch03-b22
          speaker: courtier_3
          text: 感谢上帝，他的病已经过去了！这不是个软弱的人，而是一位真正的国王。他的举止同父王一模一样。
          emotion: happy
        - id: ch03-b23
          speaker: narrator
          text: 称赞声充满了厅堂，汤姆自然听见了一些。他顿时放松下来，浑身都觉得舒畅。不过，这些愉快的念头和感受，很快便压不住一个孩子的好奇心。他急着知道，那个女人和小女孩到底犯了什么要命的罪，便用国王的身份下令，把两个吓得一边发抖、一边哭泣的人重新带到面前。
    - id: ch04
      title: 长袜与暴风雨
      blocks:
        - id: ch04-b01
          speaker: tom_canty
          text: 她们做了什么？
        - id: ch04-b02
          speaker: under_sheriff
          text: 陛下，她们被控犯下邪恶的重罪，而且证据确凿。法官已经依法判她们受绞刑。她们把自己卖给了魔鬼，这就是她们的罪。
        - id: ch04-b03
          speaker: narrator
          text: 汤姆打了个寒战。他从小就被教导，要憎恶做这种坏事的人。可是，他还是舍不得放下自己的好奇心。
        - id: ch04-b04
          speaker: tom_canty
          text: 这件事发生在什么地方？又是什么时候？
        - id: ch04-b05
          speaker: under_sheriff
          text: 十二月的一个午夜，在一座荒废的教堂里，陛下。
        - id: ch04-b06
          speaker: narrator
          text: 汤姆又打了个寒战。
        - id: ch04-b07
          speaker: tom_canty
          text: 当时有谁在场？
        - id: ch04-b08
          speaker: under_sheriff
          text: 只有她们两个，陛下。还有那个家伙。
        - id: ch04-b09
          speaker: tom_canty
          text: 她们自己招认了吗？
        - id: ch04-b10
          speaker: under_sheriff
          text: 没有，陛下。她们一直否认。
        - id: ch04-b11
          speaker: tom_canty
          text: 那么，别人是怎样知道的？
        - id: ch04-b12
          speaker: under_sheriff
          text: 有证人看见她们往那座教堂去，所以起了疑心。后来发生的灾祸，又证明这个怀疑没有错。证据表明，她们用得到的邪恶力量召来一场暴风雨，毁坏了周围整个地区。四十多名证人都证明有那场风暴。其实，一千名证人也找得到，因为人人都受了害，谁也不会忘记。
        - id: ch04-b13
          speaker: tom_canty
          text: 这确实是件严重的事。
        - id: ch04-b14
          speaker: narrator
          text: 汤姆在心里琢磨了一会儿这桩阴暗的罪行，忽然想到一个问题。
        - id: ch04-b15
          speaker: tom_canty
          text: 那个女人自己也被暴风雨害了吗？
        - id: ch04-b16
          speaker: narrator
          text: 几位年长者听出了这个问题的聪明之处，纷纷点头。副郡长却没觉得它有什么要紧，只管老实回答。
        - id: ch04-b17
          speaker: under_sheriff
          text: 她当然也受害了，陛下。人人都说她活该。风刮走了她的住处，她和孩子也没了家。
        - id: ch04-b18
          speaker: tom_canty
          text: 那她为了得到这种力量，付的代价也太高了。就算只付一枚小钱，她都算受了骗。可她付出的是自己和孩子的灵魂，这说明她已经疯了。疯子不知道自己在做什么，所以她没有罪。
        - id: ch04-b19
          speaker: narrator
          text: 那几位老人又点头赞许汤姆的聪明。其中一人低声说了一句。
        - id: ch04-b20
          speaker: elderly_courtier
          text: 要是传言没错，国王真的疯了，那这种疯倒能让某些人变清醒。只盼上帝慈悲，也让他们染上才好。
        - id: ch04-b21
          speaker: tom_canty
          text: 那孩子多大？
        - id: ch04-b22
          speaker: under_sheriff
          text: 九岁，陛下。
        - id: ch04-b23
          speaker: tom_canty
          text: 大人，依英格兰法律，一个孩子能订立契约，把自己卖掉吗？
        - id: ch04-b24
          speaker: learned_judge
          text: 陛下，法律不准孩子订立或插手重大契约。孩子的心智还不成熟，斗不过年长者老练的头脑和邪恶的算计。魔鬼若想买一个孩子，而孩子也答应了，他倒是可以买。可英格兰人不能买。若买主是英格兰人，契约便不算数。
        - id: ch04-b25
          speaker: tom_canty
          text: 英格兰法律不肯把这种权利给英格兰人，反倒白白送给魔鬼。这也太粗暴，太不合基督教义，定得实在糟糕！
          emotion: angry
        - id: ch04-b26
          speaker: narrator
          text: 这番新奇的见解逗得许多人露出笑容。大家把它牢牢记在心里，准备日后拿到宫廷各处去讲，证明汤姆不但见解独到，原先传说有病的神智也越来越清楚了。
        - id: ch04-b27
          speaker: narrator
          text: 那名年长的女犯已经不再抽泣。她屏息听着汤姆的每一句话，越来越激动，眼里也慢慢有了希望。汤姆看见她把全部希望都系在自己的话上，心便更软了。他越发同情这个身处险境、又没有任何人帮助的女人。
        - id: ch04-b28
          speaker: tom_canty
          text: 她们是怎么召来暴风雨的？
        - id: ch04-b29
          speaker: under_sheriff
          text: 脱掉她们的长袜，陛下。
        - id: ch04-b30
          speaker: narrator
          text: 汤姆大吃一惊，好奇心一下烧到了顶点。
        - id: ch04-b31
          speaker: tom_canty
          text: 真奇妙！每次这样做，都会刮起可怕的风暴吗？
          emotion: surprised
        - id: ch04-b32
          speaker: under_sheriff
          text: 每次都会，陛下。只要那女人想要风暴，再在心里或嘴上念出咒语，风暴便会来。
        - id: ch04-b33
          speaker: tom_canty
          text: 那就使出你的本领吧。我要看一场暴风雨！
        - id: ch04-b34
          speaker: narrator
          text: 满屋子迷信的人脸色霎时白了。人人都想赶快逃出去，只是谁也不敢把这愿望说出口。汤姆却一心等着那场即将发生的天崩地裂，周围的一切全都看不见了。他看见女人满脸困惑和惊讶，只以为她不敢动手，便急着安慰她。
        - id: ch04-b35
          speaker: tom_canty
          text: 别怕，这事不会怪罪你。我还会放你自由，谁也不准碰你。快使出本领来。
        - id: ch04-b36
          speaker: accused_woman
          text: 国王陛下，我没有那种本领。我是被人诬告的。
          emotion: fearful
        - id: ch04-b37
          speaker: tom_canty
          text: 是害怕拦住了你。放心，你不会受伤害。只要召来一场小小的风暴就好，我不要猛烈又害人的，越温和越好。你只要办到，就能带着孩子自由离开。你会拿到国王的赦令，王国里谁也不能伤害你。
        - id: ch04-b38
          speaker: narrator
          text: 女人伏倒在地，流着泪一遍遍申明，她根本不会创造这种奇迹。要是她真有那种力量，又能靠服从国王的命令换来如此珍贵的恩典，她一定会立刻照办。哪怕最后只能救下孩子一人的性命，她自己仍要被处死，她也心甘情愿。
        - id: ch04-b39
          speaker: narrator
          text: 汤姆一再催促，女人始终没有改口。最后，他相信了她。
        - id: ch04-b40
          speaker: tom_canty
          text: 我想你说的是真话。假如我的母亲有魔鬼的本领，只要召来风暴，毁掉整个国家，就能救下我的命，她绝不会迟疑。别的母亲也一定一样。好女人，你和孩子都自由了。我相信你们清白。
        - id: ch04-b41
          speaker: tom_canty
          text: 现在你已经得到赦免，什么都不用怕了。脱掉长袜吧！如果你真能给我召来一场暴风雨，我就让你成为富人！
        - id: ch04-b42
          speaker: narrator
          text: 重获自由的女人高声道谢，马上照着做了。汤姆满怀期待地看着，心里也夹着一点不安。廷臣们更是惶恐，个个坐立难安。女人先脱下自己的长袜，又脱掉小女儿的长袜。她显然用尽了全力，想用一场地震来报答国王的慷慨，让他的愿望成真。
        - id: ch04-b43
          speaker: narrator
          text: 可是什么也没发生。女人的努力彻底失败，汤姆期待的奇观也落了空。所有人都失望了。他只好叹了口气。
        - id: ch04-b44
          speaker: tom_canty
          text: 好了，好心人，别再费力了。你的本领已经离开你。安心走吧。以后它要是哪天回来，千万别忘记我，记得给我带一场暴风雨来。
