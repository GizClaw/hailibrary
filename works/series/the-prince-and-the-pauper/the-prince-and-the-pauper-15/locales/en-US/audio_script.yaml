  chapters:
    - id: ch01
      title: Tom as King.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The next day, foreign ambassadors arrived with magnificent processions, and Tom received them from his throne in all the solemn glory of a king. At first, the splendor delighted him and set his imagination racing. But the audience dragged on, and most of the speeches were just as long and dull. Pleasure slowly turned into weariness and homesickness. Whenever Hertford supplied the proper words, Tom repeated them and tried hard to do well. He managed tolerably, though everything was still too new and uncomfortable for him. He looked enough like a king, but he could not yet feel like one. He was heartily glad when the ceremony ended.
        - id: ch01-b02
          speaker: narrator
          text: >-
            In his own mind, Tom called most of that day wasted on the work of being king. One royal duty followed another, leaving him little time that felt like his own. Even the two hours set aside for princely games and recreation became a burden. Rules restricted every pleasure, and solemn ceremonies surrounded even his play. One private hour with his whipping-boy was different. No crowd watched him then, and no grand observance spoiled the time. Tom counted that hour as a true gain, for it brought him both entertainment and information he badly needed.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Tom's third day as king passed much like the others, though one part of his gloom began to lift. His surroundings no longer made him quite so uneasy. The chains still hurt, but not every moment. As each hour went by, the presence and homage of great lords troubled and embarrassed him a little less.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Only one fear kept him from facing the fourth day calmly. That was his first public dinner. There were greater affairs on the day's program. He must preside over a council whose members would ask for his views and commands about policy toward nations scattered far and wide across the globe. Hertford would formally be chosen for the great office of Lord Protector, and still more important business awaited Tom. Yet all of it seemed insignificant beside the ordeal of eating by himself in public. A multitude of curious eyes would follow every motion. A multitude of mouths would whisper about his performance, and about every mistake if he was unlucky enough to make one.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Nothing could hold back the fourth day, and it came. Tom was miserable and distracted from the start. He could not shake the feeling. The morning duties crawled along and exhausted him, and once again his captivity weighed heavily upon him.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Late that morning, Tom stood in a large audience chamber talking with Hertford. He was waiting without much interest for the hour when a great company of officials and courtiers would make a formal visit. After a while, he wandered to a window. Beyond the palace gates, the broad road was alive with movement. Tom did more than watch it. With all his heart, he longed to be out there sharing its bustle and freedom.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Then a disorderly crowd appeared up the road, hooting and shouting. Poor men, women, and children pressed forward together at its head.
        - id: ch01-b08
          speaker: tom
          text: >-
            Oh, I wish I knew what all that was about!
        - id: ch01-b09
          speaker: narrator
          text: >-
            The curiosity in his voice was entirely a boy's. Hertford bowed with grave ceremony.
        - id: ch01-b10
          speaker: hertford
          text: >-
            You are the King. Will Your Grace permit me to act?
        - id: ch01-b11
          speaker: tom
          text: >-
            Yes, gladly! Please do!
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: >-
            Tom was suddenly delighted. Being king was not all dreariness after all. The office had its conveniences. Hertford summoned a page and sent him to the captain of the guard.
        - id: ch01-b13
          speaker: hertford
          text: >-
            Stop that crowd and learn why it is moving through the road. This is the King's command.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Within seconds, a long line of royal guards in flashing steel marched through the gates and formed across the highway. A messenger soon returned with the answer. The crowd was following a man, a woman, and a young girl to their execution for crimes against the peace and dignity of the kingdom.
        - id: ch01-b15
          speaker: narrator
          text: >-
            They were going to die, and die violently. The thought tore at Tom's heart. Compassion drove every other concern away. He did not think of broken laws or of whatever grief and loss the three prisoners might have caused. He could see only the scaffold and the dreadful fate hanging over them. For a moment, he even forgot that he was merely the false shadow of a king.
        - id: ch01-b16
          speaker: tom
          text: >-
            Bring them here!
        - id: ch01-b17
          speaker: narrator
          text: >-
            The command escaped before Tom knew it. He flushed scarlet, and an apology nearly followed. He had spoken from pity and forgotten for that instant that he was not the true king at all. But neither Hertford nor the waiting page showed the smallest surprise. The page bowed deeply and backed from the room as if such an order were perfectly ordinary, then went to deliver it. Tom swallowed his apology. Pride warmed him as he felt another advantage of being king. This was just like the old priest's tales. While reading them, Tom had imagined himself as a prince giving law and commands to everyone around him. He would say, "Do this," and, "Do that," and no one dared place an obstacle in the way of his will.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The doors opened, and one grand title after another rang through the chamber. The people who owned those titles entered behind the announcements, dressed in all the finery of the court. Soon noble men and women filled half the room. Tom scarcely knew they were there. He was too excited and too deeply absorbed in the fate of the prisoners. He sat down absently in the chair of state and kept his eyes on the door, making no attempt to hide his impatient expectation. The company understood that he did not wish to be troubled. They left him alone and talked quietly among themselves, mixing public business with the latest court gossip.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Before long, measured military footsteps approached. The three prisoners entered with an under-sheriff and an escort of royal guards. The officer knelt before Tom, then moved aside. The condemned man, woman, and girl also knelt and stayed there, while the guards took their places behind the royal chair.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Tom studied them. Something about the man's clothing or appearance stirred a faint memory. He felt sure he had seen the fellow, but he could not remember when or where. Then the man looked up for one quick instant before dropping his face again, unable to bear the terrible sight of royal authority. That single glimpse was enough.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Now Tom knew him. This was the stranger who had pulled Giles Witt from the Thames and saved his life on that bitter, windy first day of the new year. It had been a brave and good deed. What a pity, Tom thought, that the man had since done baser things and brought himself to this sorrowful end. Tom had not forgotten the date or even the hour. Just one hour after the rescue, when the clock struck eleven, Gammer Canty had given him a magnificent hiding. Its severity had been so memorable that every beating before it, and every beating after it, seemed no more than fond pats and caresses by comparison.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Tom ordered the woman and child taken away for a little while. Then he turned to the under-sheriff.
        - id: ch01-b23
          speaker: tom
          text: >-
            Good sir, what crime has this man committed?
        - id: ch01-b24
          speaker: under_sheriff
          text: >-
            If it please Your Majesty, he poisoned one of your subjects and took his life.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Tom's pity for the prisoner, and his admiration for the brave rescuer, suffered a heavy blow.
        - id: ch01-b26
          speaker: tom
          text: >-
            Was the charge proved against him?
        - id: ch01-b27
          speaker: under_sheriff
          text: >-
            Most clearly, Sire.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Tom sighed.
        - id: ch01-b29
          speaker: tom
          text: >-
            Take him away, then. He has earned his death. It is a pity, for he was a brave man. No, I mean he has the look of one.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The prisoner suddenly clasped his hands and wrung them in despair. In broken, terrified phrases, he begged the King for mercy.
        - id: ch01-b31
          speaker: prisoner
          text: >-
            My lord the King, if you can pity a lost man, have pity on me! I am innocent, and the charge was poorly proved. But I do not ask you to change the judgment. That judgment has already been given. I beg only one mercy, because the death chosen for me is more than I can bear. In your royal compassion, command that I be hanged!
          emotion: fearful
        - id: ch01-b32
          speaker: narrator
          text: >-
            Tom stared in amazement. This was not the plea he had expected.
        - id: ch01-b33
          speaker: tom
          text: >-
            What a strange favor to ask! Were you not meant to be hanged already?
          emotion: surprised
        - id: ch01-b34
          speaker: prisoner
          text: >-
            No, my liege. I am sentenced to be boiled alive!
          emotion: fearful
        - id: ch01-b35
          speaker: narrator
          text: >-
            The horror of those words almost lifted Tom from his chair. When he could think again, he cried out.
        - id: ch01-b36
          speaker: tom
          text: >-
            You shall have what you ask, poor soul! Even if you had poisoned a hundred men, you should not suffer such a miserable death.
        - id: ch01-b37
          speaker: narrator
          text: >-
            The prisoner bowed his face to the floor and poured out his gratitude. At last, he ended with a blessing.
        - id: ch01-b38
          speaker: prisoner
          text: >-
            If misfortune should ever come to you, though God forbid it, may your goodness to me today be remembered and returned to you!
        - id: ch01-b39
          speaker: tom
          text: >-
            My lord Hertford, can there truly be a lawful reason for so savage a punishment?
        - id: ch01-b40
          speaker: hertford
          text: >-
            It is the law for poisoners, Your Grace. In Germany, men who make false coins are boiled in oil. They are not dropped in at once. A rope lowers them slowly, first the feet, then the legs, and then—
        - id: ch01-b41
          speaker: tom
          text: >-
            Please, no more! I cannot bear it. My lord, see that this law is changed. Let no more poor creatures be tortured by it.
          emotion: fearful
        - id: ch01-b42
          speaker: narrator
          text: >-
            Tom covered his eyes to shut out the picture. Hertford looked deeply pleased. He was merciful and generous by nature, qualities rarely found among men of his rank in that fierce age.
        - id: ch01-b43
          speaker: hertford
          text: >-
            Your Grace's noble words have ended that law. History will remember this as an honor to your royal house.
        - id: ch01-b44
          speaker: narrator
          text: >-
            The under-sheriff was ready to lead the prisoner away, but Tom signaled him to wait.
        - id: ch01-b45
          speaker: tom
          text: >-
            Good sir, I want to examine this case more closely. The man says the proof was weak. Tell me what you know.
        - id: ch01-b46
          speaker: under_sheriff
          text: >-
            At the trial, it was said that he entered a house in Islington where a sick man lay alone and asleep. Three witnesses placed the time at ten in the morning, while two said it was several minutes later. This man soon came out and went away. Within the hour, the sick man died in spasms and retching.
        - id: ch01-b47
          speaker: tom
          text: >-
            Did anyone see him give poison? Was any poison found?
        - id: ch01-b48
          speaker: under_sheriff
          text: >-
            No, my liege.
        - id: ch01-b49
          speaker: tom
          text: >-
            Then how does anyone know that poison was given at all?
        - id: ch01-b50
          speaker: under_sheriff
          text: >-
            The doctors testified that only poison could cause such symptoms, Your Majesty.
        - id: ch01-b51
          speaker: narrator
          text: >-
            In that simple age, this sounded like powerful evidence. Tom understood its weight.
        - id: ch01-b52
          speaker: tom
          text: >-
            Doctors know their trade, so perhaps they were right. This looks bad for the poor man.
        - id: ch01-b53
          speaker: under_sheriff
          text: >-
            There is worse, Your Majesty. A witch who has since vanished from the village told many people in private that the sick man would die by poison. She also said a stranger would give it, a brown-haired stranger in worn, common clothes. This prisoner fits that description very well. Surely the prophecy deserves its proper weight, since it came before the death.
        - id: ch01-b54
          speaker: narrator
          text: >-
            In that superstitious time, this argument seemed overwhelming. The witch's words appeared to fit the death, the stranger, his brown hair, and his worn clothing. No one around Tom doubted that a prophecy deserved solemn weight simply because it had come before the event. Tom thought the matter settled. If evidence meant anything at all, the poor fellow must be guilty. Still, he gave the man one last chance to speak for himself.
        - id: ch01-b55
          speaker: tom
          text: >-
            If you can say anything in your own defense, speak now.
        - id: ch01-b56
          speaker: prisoner
          text: >-
            Nothing that will help me, my King. I am innocent, but I cannot prove it. I have no friends. If I did, they could show I was nowhere near Islington that day. At the hour they named, I was more than a league away at Wapping Old Stairs. They could prove something more. At the very moment I was said to be taking a life, I was saving one. A boy was drowning—
        - id: ch01-b57
          speaker: tom
          text: >-
            Stop! Sheriff, on what day was this crime committed?
        - id: ch01-b58
          speaker: under_sheriff
          text: >-
            On the first day of the new year, most illustrious Sire, at ten in the morning or a few minutes later.
        - id: ch01-b59
          speaker: tom
          text: >-
            Set the prisoner free. That is the King's will!
        - id: ch01-b60
          speaker: narrator
          text: >-
            Tom blushed again at his unkingly burst of excitement. He tried to cover it with a more formal reason.
        - id: ch01-b61
          speaker: tom
          text: >-
            It makes me furious that a man could be condemned on such foolish, harebrained evidence!
          emotion: angry
        - id: ch01-b62
          speaker: narrator
          text: >-
            A low murmur of admiration passed through the assembled court. The courtiers were not praising the pardon itself. Few of them would have dared call it proper or wise to free a man already convicted of poisoning. What impressed them was the intelligence and spirit Tom had shown. He had found the weakness in the evidence, questioned the case sharply, and disposed of the matter with a sudden royal command.
        - id: ch01-b63
          speaker: courtier_1
          text: >-
            This is not a mad king. His mind is sound.
        - id: ch01-b64
          speaker: courtier_2
          text: >-
            He questioned them wisely. And that sudden command sounded just like his old self.
        - id: ch01-b65
          speaker: courtier_3
          text: >-
            Thank God his illness is over! This is no weakling. He has carried himself like his own father.
        - id: ch01-b66
          speaker: narrator
          text: >-
            Praise filled the room, and some of it reached Tom's ears. It made him feel far more at ease and gave him a deep glow of satisfaction.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Soon, though, a boy's curiosity pushed those pleasant feelings aside. Tom wanted to know what deadly mischief the woman and little girl had done. At his command, the two terrified, sobbing prisoners were brought back before him.
        - id: ch01-b68
          speaker: tom
          text: >-
            What have these two done?
        - id: ch01-b69
          speaker: under_sheriff
          text: >-
            A dark crime has been clearly proved against them, Your Majesty. The judges have sentenced them to hang. They sold themselves to the devil.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Tom shuddered. He had been taught to hate anyone who committed such wickedness. Even so, he would not give up the chance to satisfy his curiosity.
        - id: ch01-b71
          speaker: tom
          text: >-
            Where and when did they do this?
        - id: ch01-b72
          speaker: under_sheriff
          text: >-
            At midnight in December, inside a ruined church, Your Majesty.
        - id: ch01-b73
          speaker: narrator
          text: >-
            Tom shuddered once more.
        - id: ch01-b74
          speaker: tom
          text: >-
            Who was there to see it?
        - id: ch01-b75
          speaker: under_sheriff
          text: >-
            Only these two, Your Grace, and the other one.
        - id: ch01-b76
          speaker: tom
          text: >-
            Have they confessed?
        - id: ch01-b77
          speaker: under_sheriff
          text: >-
            No, Sire. They deny it.
        - id: ch01-b78
          speaker: tom
          text: >-
            Then how was it discovered?
        - id: ch01-b79
          speaker: under_sheriff
          text: >-
            Witnesses saw them going to the ruined church, and that created suspicion. Terrible events afterward confirmed it. With the wicked power they gained, they called up a storm that devastated the whole countryside. More than forty witnesses proved there was a storm, and we might have found a thousand. Everyone remembered it because everyone suffered from it.
        - id: ch01-b80
          speaker: tom
          text: >-
            That is certainly serious. Did the woman suffer from the storm too?
        - id: ch01-b81
          speaker: narrator
          text: >-
            Several older men nodded at the wisdom of the question. The under-sheriff saw nothing important in it and answered plainly.
        - id: ch01-b82
          speaker: under_sheriff
          text: >-
            Indeed she did, Your Majesty, and everyone says she deserved it. Her home was swept away, leaving her and the child without shelter.
        - id: ch01-b83
          speaker: tom
          text: >-
            She paid dearly for the power to harm herself. Even one farthing would have been too much. If she gave her own soul and her child's soul for it, she must be mad. And if she is mad, she does not understand what she is doing, so she cannot be guilty of sin.
        - id: ch01-b84
          speaker: narrator
          text: >-
            The older heads nodded again. One courtier murmured that if the King truly was mad, as people claimed, it was the kind of madness that might improve the good sense of certain other men at court.
        - id: ch01-b85
          speaker: tom
          text: >-
            How old is the child?
        - id: ch01-b86
          speaker: under_sheriff
          text: >-
            Nine years old, Your Majesty.
        - id: ch01-b87
          speaker: narrator
          text: >-
            Tom turned to a learned judge.
        - id: ch01-b88
          speaker: tom
          text: >-
            Under English law, may a child make a contract and sell herself?
        - id: ch01-b89
          speaker: judge
          text: >-
            The law does not allow a child to take part in any weighty agreement, my liege. A child's young mind cannot stand against the mature understanding and cunning of an adult. The devil may buy a child if he chooses and the child agrees. But an Englishman may not. Such a contract with an Englishman would be worthless.
        - id: ch01-b90
          speaker: tom
          text: >-
            What a rude and unchristian law! It denies Englishmen a privilege only to waste that privilege on the devil!
          emotion: angry
        - id: ch01-b91
          speaker: narrator
          text: >-
            This entirely new view of English law brought smiles to many faces. The court had not expected its young king to notice that the devil enjoyed a legal privilege denied to an English subject. More than one listener stored the remark away to repeat around the palace later. It would serve as fresh proof of Tom's originality, and also of what they believed was his steady return to a sound mind.
        - id: ch01-b92
          speaker: narrator
          text: >-
            The woman had stopped crying. She followed every word Tom spoke with growing excitement and hope, as if her life and her child's life might turn upon his next question. Tom noticed the change in her face. Seeing her stand there in danger, with no friend to help her, drew his sympathy still more strongly toward her and made him eager to hear her case more fully.
        - id: ch01-b93
          speaker: tom
          text: >-
            How did they bring on the storm?
        - id: ch01-b94
          speaker: under_sheriff
          text: >-
            By pulling off their stockings, Sire.
        - id: ch01-b95
          speaker: narrator
          text: >-
            Tom was astonished, and his curiosity burned hotter than ever.
        - id: ch01-b96
          speaker: tom
          text: >-
            Wonderful! Does taking them off always cause a storm?
          emotion: surprised
        - id: ch01-b97
          speaker: under_sheriff
          text: >-
            Always, my liege, as long as the woman wishes for one and says the necessary words, either aloud or in her mind.
        - id: ch01-b98
          speaker: narrator
          text: >-
            Tom turned eagerly to the woman.
        - id: ch01-b99
          speaker: tom
          text: >-
            Use your power. I want to see a storm!
          emotion: happy
        - id: ch01-b100
          speaker: narrator
          text: >-
            Faces throughout the chamber suddenly went pale. The superstitious company shared one silent wish to escape, but Tom noticed none of it. He could think only of the coming disaster. When the woman looked puzzled and amazed, he hurried to reassure her.
        - id: ch01-b101
          speaker: tom
          text: >-
            Do not be afraid. You will not be blamed. More than that, you will go free, and no one will touch you. Show me your power.
          emotion: calm
        - id: ch01-b102
          speaker: woman
          text: >-
            My lord the King, I have no such power. The charge against me is false.
          emotion: fearful
        - id: ch01-b103
          speaker: tom
          text: >-
            Fear is holding you back. Take courage. No harm will come to you. Make a storm, no matter how small. I want nothing great or dangerous. I would rather have the opposite. Do this, and you and your child will leave with the King's pardon. No one in the kingdom may hurt you or seek revenge against you.
          emotion: calm
        - id: ch01-b104
          speaker: narrator
          text: >-
            The woman threw herself flat upon the floor. Through her tears, she insisted again and again that she could work no miracle. The King's promise could not tempt her into pretending otherwise. If she had possessed such power, she would gladly have obeyed his command for the sake of her child. She would have been content to lose her own life if calling up a storm could win the precious mercy of saving her daughter's life alone.
        - id: ch01-b105
          speaker: narrator
          text: >-
            Tom kept urging her, but her answer never changed. At last, he believed her.
        - id: ch01-b106
          speaker: tom
          text: >-
            I think this woman is telling the truth. If my own mother stood in her place and had the devil's powers, she would not wait a moment to summon storms and ruin the whole land if that would save my life. Other mothers must be made the same way. Goodwife, you and your child are free, because I believe you are innocent. Now you have nothing to fear. Pull off your stockings! If you can still make me a storm, I will make you rich!
        - id: ch01-b107
          speaker: narrator
          text: >-
            The rescued woman poured out her thanks loudly and began to obey. Tom watched with eager expectation, though a little worry now mixed with his excitement. Around him, the courtiers showed open discomfort and uneasiness. They had heard the same testimony he had, but unlike Tom, they had no desire to witness its promised result. The woman pulled the stockings from her own feet and then from her little daughter's. She plainly did her very best to repay the King's generosity with an earthquake, or at least with some sign of a storm. Nothing happened. For all her effort, the attempt ended in complete failure and disappointment.
        - id: ch01-b108
          speaker: narrator
          text: >-
            Tom sighed.
        - id: ch01-b109
          speaker: tom
          text: >-
            There, good soul, do not trouble yourself anymore. Your power has left you. Go in peace. If it ever comes back, remember me and bring me a storm.
