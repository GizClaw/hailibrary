audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华亲王
      tts:
        delivery: 高贵坚定，受辱时仍保持尊严
        timbre: 清亮稚嫩
        pace: 从容有力
        pitch: 中高
    miles_hendon:
      display_name: 迈尔斯·亨顿
      tts:
        delivery: 豪爽诙谐，危急时勇敢坚定
        timbre: 洪亮粗粝
        pace: 明快有力
        pitch: 中低
    lady_edith:
      display_name: 伊迪丝小姐
      tts:
        delivery: 克制忧郁，言语间压着恐惧
        timbre: 柔和清澈
        pace: 缓慢迟疑
        pitch: 中等
  chapters:
    - id: ch01
      title: 国王为何无人寻找
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 国王默默想了一会儿，忽然抬起头。
        - id: ch01-b02
          speaker: prince_edward
          text: 真奇怪，实在太奇怪了。我怎么都想不通。
        - id: ch01-b03
          speaker: miles_hendon
          text: 这没什么奇怪的，陛下。我了解休，他从小就是个无赖，做出这种事再自然不过。
        - id: ch01-b04
          speaker: prince_edward
          text: 迈尔斯爵士，我说的不是他。
        - id: ch01-b05
          speaker: miles_hendon
          text: 不是休？那您说什么？什么事叫您这样奇怪？
        - id: ch01-b06
          speaker: prince_edward
          text: 国王不见了，竟然没人发觉。
        - id: ch01-b07
          speaker: miles_hendon
          text: 什么？谁不见了？我恐怕没有听懂。
        - id: ch01-b08
          speaker: prince_edward
          text: 全国没有信使四处奔走，也没有告示描绘我的相貌、搜寻我的下落，这还不奇怪吗？一国之君消失了，甚至迷失在外，难道不该举国震动，人人忧急？
        - id: ch01-b09
          speaker: miles_hendon
          text: 您说得对，我的国王。我竟把这件事忘了。
        - id: ch01-b10
          speaker: narrator
          text: 亨顿叹了口气，暗自嘟囔起来。他只觉得这个孩子的神智已经受损，却仍被那场令人心酸的梦缠着，实在可怜。
        - id: ch01-b11
          speaker: prince_edward
          text: 我倒有一个办法，能让我们两人都讨回公道。我要用拉丁文、希腊文和英文写一封信。明天一早，你带着它赶往伦敦。记住，除了我的舅舅赫特福德勋爵，谁也不能看。他认得我的笔迹，一看便会知道这是我亲笔写的，到时就会派人来接我。
        - id: ch01-b12
          speaker: miles_hendon
          text: 殿下，我们何不先留在这里？等我证明身份，拿回庄园，我就更有能力替您——
        - id: ch01-b13
          speaker: narrator
          text: 国王威严地打断了他。
        - id: ch01-b14
          speaker: prince_edward
          text: 住口！国家的安危和王位的正统就在眼前，你那点寒酸的庄园和微不足道的私事算什么？
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: 国王随即放柔了声音，仿佛后悔自己方才过于严厉。
        - id: ch01-b16
          speaker: prince_edward
          text: 照我说的做，不必害怕。我会替你伸张正义，把你的损失全补回来。不，我会给你更多。我不会忘记，也一定会重赏你。
    - id: ch02
      title: 三种文字的信
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 国王拿起笔，认真写了起来。亨顿带着疼爱看了他片刻，心里却觉得好笑。要是在黑暗里只听声音，他真会以为发号施令的是一位国王。谁也不能否认，这个孩子劲头一来，果然又打雷又掣电，活像真正的君主。可这套本事究竟是从哪里学来的？
        - id: ch02-b02
          speaker: narrator
          text: 他看着国王心满意足地又写又画，只当那些笔画是毫无意义的鬼画符，孩子却相信自己写的是拉丁文和希腊文。亨顿犯起了愁。要是他的脑袋想不出一条走运的妙计，让孩子打消这个念头，明天他只好装作匆匆赶往伦敦，去办这桩为他想出来的荒唐差事。
        - id: ch02-b03
          speaker: narrator
          text: 可没过多久，亨顿又想起伊迪丝刚才的举动，想得出了神。国王把信交给他，他竟毫无知觉地接过来，塞进衣袋。
        - id: ch02-b04
          speaker: miles_hendon
          text: 她的样子真是奇怪。我觉得她认出了我，又觉得她根本不认识我。两种想法明明冲突，我却调和不了，哪一种也驳不倒，甚至不能说服自己更相信其中一个。她怎么会不认得我的脸、身形和声音？可她亲口说不认识，这又是最确凿的证据，因为她绝不会撒谎。等等，我明白了！一定是休摆布了她，命令她，逼她说谎。她当时怕得丢了魂，分明受了他的胁迫。
        - id: ch02-b05
          speaker: miles_hendon
          text: 我要去找她，一定要见到她。如今休不在，她会说出真心话。她会想起我们小时候一起玩耍的日子，心也会软下来。到那时，她不会再背弃我，而会承认我是谁。她一向诚实可靠，身上没有不忠不义的血。她从前爱过我，这就是我的凭据。一个人绝不会背叛自己爱过的人。
        - id: ch02-b06
          speaker: narrator
          text: 亨顿急忙朝门口走去，门却在这时开了。伊迪丝小姐走进来。她脸色十分苍白，脚步却很坚定，举止依旧优雅，透着温柔的尊严。她的脸和先前一样，仍旧笼罩在悲伤里。
        - id: ch02-b07
          speaker: narrator
          text: 迈尔斯满怀欢喜与信心，猛地迎上去。伊迪丝只用一个几乎看不出的手势，便让他停在原地。她坐下，也请他坐。这个简单的举动一下抽走了旧日伙伴的亲近，把他变成陌生人和客人。事情来得太突然，亨顿又惊又乱，有一瞬间竟怀疑，自己或许真的不是那个自称的人。
    - id: ch03
      title: 伊迪丝的警告
      blocks:
        - id: ch03-b01
          speaker: lady_edith
          text: 先生，我来是为了警告你。疯癫的人或许听不进劝，放不下自己的妄想，可总还能听劝躲开危险。你心里相信这场幻梦是真的，所以不算存心作恶。但不要留在这里抱着它不放。在这个地方，它会给你招来危险。
        - id: ch03-b02
          speaker: narrator
          text: 她直直望着迈尔斯，又郑重地补了一句。
        - id: ch03-b03
          speaker: lady_edith
          text: 更危险的是，你长得很像我们失踪的那个孩子。要是他还活着，大概就是你现在的模样。
        - id: ch03-b04
          speaker: miles_hendon
          text: 天哪，夫人，我就是他！
          emotion: surprised
        - id: ch03-b05
          speaker: lady_edith
          text: 我相信你真心认为自己就是他，也不怀疑你在这件事上诚实。我只想警告你。我丈夫掌管这一带，权势几乎没有边界。这里的人能吃饱还是挨饿，全凭他的意思。要是你不像自己声称的那个人，他或许会由着你安静地做梦。可我太了解他了，也知道他会怎么做。他会告诉所有人，你只是个发疯的骗子，话一出口，人人都会跟着这样说。
        - id: ch03-b06
          speaker: narrator
          text: 伊迪丝仍稳稳地望着他，接下来的话说得格外沉重。
        - id: ch03-b07
          speaker: lady_edith
          text: 就算你真是迈尔斯·亨顿，就算我丈夫知道，整个地区的人也都知道，也不会有任何不同。请你仔细想想，好好掂量我的话。他照样会否认你、揭发你，惩罚一定会落到你身上，没有人敢站出来支持你。
        - id: ch03-b08
          speaker: miles_hendon
          text: 我完全相信。有一种权势，能命令相交一生的朋友背叛对方、拒不相认，还让人不得不服从。既然连这样的命令都能办到，那些拿面包和性命作赌注、彼此又没有一丝忠诚和荣誉牵绊的人，自然更会俯首听命。
        - id: ch03-b09
          speaker: narrator
          text: 伊迪丝脸颊上泛起一丝淡淡的红晕，只停留了片刻。她随即垂下眼睛，默默望着地面。可她继续说话时，声音依然平稳，没有泄露半点情绪。
        - id: ch03-b10
          speaker: lady_edith
          text: 我已经警告过你，还得再说一遍。离开这里，不然这个人会毁掉你。他是个毫无怜悯的暴君。我是被他锁在枷锁里的奴隶，没有人比我更清楚。可怜的迈尔斯、亚瑟，还有我亲爱的监护人理查德爵士，都已经摆脱了他，安静地长眠。你与其留下来落进这个恶棍手里，还不如去和他们作伴。
          emotion: fearful
        - id: ch03-b11
          speaker: lady_edith
          text: 你声称的身份威胁到他的爵位和财产，又在他自己的宅子里袭击了他。只要留下来，你就完了。快走，别再犹豫。要是没有钱，请收下这只钱袋，拿去买通仆人，让他们放你出去。可怜的人，听我的警告吧，趁还来得及，快逃！
          emotion: fearful
    - id: ch04
      title: 拒不相认
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 迈尔斯只抬了抬手，拒绝收下钱袋。随后，他从座位上站起来，走到伊迪丝面前。
        - id: ch04-b02
          speaker: miles_hendon
          text: 只答应我一件事。请把目光落在我的眼睛上，不要移开，让我亲眼看看你的眼神能不能始终镇定。好了，现在回答我。我是迈尔斯·亨顿吗？
        - id: ch04-b03
          speaker: lady_edith
          text: 不是。我不认识你。
        - id: ch04-b04
          speaker: miles_hendon
          text: 那就发誓！
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 伊迪丝压低了声音，可她的回答仍然清清楚楚，每一个字都听得分明。
        - id: ch04-b06
          speaker: lady_edith
          text: 我发誓。
        - id: ch04-b07
          speaker: miles_hendon
          text: 这怎么可能！
          emotion: surprised
        - id: ch04-b08
          speaker: lady_edith
          text: 快逃！为什么还要浪费宝贵的时间？快走，救救你自己！
          emotion: fearful
        - id: ch04-b09
          speaker: narrator
          text: 就在这时，警役们猛地闯进房间，一场激烈的扭打立刻开始。亨顿奋力抵抗，可对方人多势众，他很快便被制服，强行拖走。警役也没有放过站在一旁的国王。两个人全被捆了起来，一同押进监牢。
