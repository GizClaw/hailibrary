audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently ironic
        timbre: clear and resonant
        pace: measured
        pitch: medium
    prince_edward:
      display_name: Prince Edward
      tts:
        delivery: proud, fiery, and resolute
        timbre: bright and firm
        pace: brisk
        pitch: medium-high
    miles_hendon:
      display_name: Miles Hendon
      tts:
        delivery: swaggering, warmhearted, and boldly humorous
        timbre: rugged and resonant
        pace: lively
        pitch: medium-low
    lady_edith:
      display_name: Lady Edith
      tts:
        delivery: dignified, sorrowful, and carefully controlled
        timbre: graceful and clear
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Disowned
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The King thought in silence for a few moments. Then he looked up.
        - id: ch01-b02
          speaker: prince_edward
          text: >-
            This is strange. Most strange. I cannot explain it.
        - id: ch01-b03
          speaker: miles_hendon
          text: >-
            There is nothing strange about it, my liege. I know Hugh. He has been a scoundrel since birth.
        - id: ch01-b04
          speaker: prince_edward
          text: >-
            I was not speaking of him, Sir Miles.
        - id: ch01-b05
          speaker: miles_hendon
          text: >-
            Not Hugh? Then what do you mean? What is so strange?
        - id: ch01-b06
          speaker: prince_edward
          text: >-
            No one seems to miss the King. Should not messengers be riding across the land? Should not proclamations describe me and command a search? The head of the nation has vanished and is lost. Why is the whole country not in distress?
        - id: ch01-b07
          speaker: miles_hendon
          text: >-
            You are right, my King. I had forgotten.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Miles sighed. To himself, he mourned the boy's ruined mind, still caught in its sad dream.
        - id: ch01-b09
          speaker: prince_edward
          text: >-
            But I have a plan that will restore us both. I shall write a message in Latin, Greek, and English. Tomorrow morning, take it straight to London. Give it only to my uncle, Lord Hertford. He will recognize my writing and send for me.
        - id: ch01-b10
          speaker: miles_hendon
          text: >-
            Would it not be wiser to wait here until I prove who I am and regain my estates? Then I would be far better able to—
        - id: ch01-b11
          speaker: narrator
          text: >-
            The King cut him off with a royal command.
        - id: ch01-b12
          speaker: prince_edward
          text: >-
            Silence! Your little estates and private concerns are nothing beside the welfare of a nation and the safety of its throne.
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: >-
            Then his voice softened, as though he regretted speaking so harshly.
        - id: ch01-b14
          speaker: prince_edward
          text: >-
            Obey me and do not be afraid. I will restore everything you have lost, and more. I shall remember your service and reward it.
          emotion: calm
        - id: ch01-b15
          speaker: narrator
          text: >-
            Edward took up the pen and began his message. Miles watched him fondly for a while. If the room were dark, he thought, anyone hearing that voice might believe a true king was speaking. When the royal mood seized the boy, he thundered and flashed like one. There was no denying it. But where had he learned such a thing? Now he was happily scratching lines across the page. To Miles, they were meaningless hooks and strokes, though Edward believed he was writing Latin and Greek. Unless Miles found some clever way to turn him from the plan, he would have to pretend to ride to London on this wild mission the next morning.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Soon Miles was thinking again about the strange meeting with Lady Edith. He was so deep in thought that when Edward handed him the finished paper, he slipped it into his pocket without noticing what he had done.
        - id: ch01-b17
          speaker: miles_hendon
          text: >-
            How strangely she behaved. Part of me is certain she knew me, while another part is certain she did not. The two cannot both be true, but I cannot reason either one away. She must have recognized my face, my shape, and my voice. How could she fail to? But she said she did not know me. That should be perfect proof, because Edith cannot lie. Wait. I begin to understand. Hugh must have commanded her to deny me and forced her to obey. Yes, that solves the riddle. She looked terrified, as though she were under his power. I will find her now that he is gone, and she will speak freely. She will remember when we played together as children. Her heart will soften, and she will admit who I am instead of betraying me again. There is no treachery in her blood. She was always honest and true. She loved me in those days, and no one can betray a person they once loved.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Miles hurried toward the door. Just then it opened, and Lady Edith came in. Her face was very pale and just as sad as before, but she walked firmly, with quiet grace and dignity.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Miles sprang forward to welcome her, happy and sure that his doubts were over. A tiny gesture from Edith stopped him where he stood. She sat down and asked him to sit as well. With that simple act, she swept away every sign that they had once been close companions. Suddenly he was only a stranger and a guest. Her manner was so unexpected and bewildering that, for a moment, Miles almost wondered whether he truly was the man he claimed to be.
        - id: ch01-b20
          speaker: lady_edith
          text: >-
            Sir, I have come to warn you. Perhaps no one can reason a madman out of his false belief, but he may still be persuaded to avoid danger. I believe this dream feels true to you, so I do not call it a crime. Still, you must not remain here. Here, your dream puts you in danger.
        - id: ch01-b21
          speaker: narrator
          text: >-
            She held Miles's gaze, then spoke with great care.
        - id: ch01-b22
          speaker: lady_edith
          text: >-
            The danger is greater because you closely resemble the man our lost boy would have become if he had lived.
        - id: ch01-b23
          speaker: miles_hendon
          text: >-
            Heaven help me, madam. I am that man!
        - id: ch01-b24
          speaker: lady_edith
          text: >-
            I truly believe that you think you are Miles, sir. I do not doubt your honesty in that. I only mean to warn you. My husband rules this whole region, and there is almost no limit to his power. At his will, the people here either prosper or starve. If you did not look like the man you claim to be, he might let you enjoy your dream in peace. But I know my husband well. I know exactly what he will do. He will tell everyone that you are only a mad impostor, and at once they will all repeat his words.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Again, she looked steadily into his face.
        - id: ch01-b26
          speaker: lady_edith
          text: >-
            Suppose you truly were Miles Hendon, and both my husband and the whole region knew it. Think carefully about what I am saying and weigh it well. Even then, you would be in exactly the same danger. Your punishment would be just as certain and no less severe. My husband would deny you and condemn you in public. Not one person in this region would dare support your claim or stand beside you.
        - id: ch01-b27
          speaker: miles_hendon
          text: >-
            I believe that completely. A power that can force one lifelong friend to betray and disown another will easily command people whose food and lives are at risk. They are not even bound by the faintest thread of loyalty or honor.
        - id: ch01-b28
          speaker: narrator
          text: >-
            A trace of color touched Edith's cheek, and she lowered her eyes. Still, her voice revealed nothing.
        - id: ch01-b29
          speaker: lady_edith
          text: >-
            I have warned you, and I must warn you again. Leave this place, or he will destroy you. He is a merciless tyrant. I know because I live as his chained slave. Poor Miles and Arthur, and my dear guardian, Sir Richard, are beyond his reach now and at peace. You would be better off beside them than trapped here in this villain's hands. Your claim threatens both his title and everything he owns. You have also attacked him inside his own house. If you stay, you are ruined. Go now. Do not waste another moment. If you have no money, please take this purse. Use it to bribe the servants, and they may let you pass. Please listen to me, poor soul. Escape while you still have the chance.
          emotion: fearful
        - id: ch01-b30
          speaker: narrator
          text: >-
            Miles refused the purse with a gesture. He rose and stood before her.
        - id: ch01-b31
          speaker: miles_hendon
          text: >-
            Grant me one thing. Look straight into my eyes, so I can see whether yours remain steady. There. Now answer me. Am I Miles Hendon?
        - id: ch01-b32
          speaker: lady_edith
          text: >-
            No. I do not know you.
        - id: ch01-b33
          speaker: miles_hendon
          text: >-
            Swear it!
        - id: ch01-b34
          speaker: narrator
          text: >-
            Her answer was quiet but clear.
        - id: ch01-b35
          speaker: lady_edith
          text: >-
            I swear it.
        - id: ch01-b36
          speaker: miles_hendon
          text: >-
            No. I cannot believe this!
        - id: ch01-b37
          speaker: lady_edith
          text: >-
            Run! Why are you wasting these precious moments? Go and save yourself!
          emotion: fearful
        - id: ch01-b38
          speaker: narrator
          text: >-
            At that instant, officers burst into the room. Miles fought them fiercely, but they soon overpowered him and dragged him away. They seized the King as well. Both prisoners were bound and taken to jail.
