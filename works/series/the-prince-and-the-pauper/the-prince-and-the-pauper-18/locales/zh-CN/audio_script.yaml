audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华亲王
      tts:
        delivery: 高贵坚定，受辱时仍保持尊严
        timbre: 清亮稚嫩
        pace: 从容有力
        pitch: 中高
    hugo:
      display_name: 雨果
      tts:
        delivery: 油滑刻薄，嘲笑别人时肆无忌惮
        timbre: 尖细轻佻
        pace: 轻快
        pitch: 中高
    stranger:
      display_name: 好心的绅士
      tts:
        delivery: 热心善良，见人受苦时急切关怀
        timbre: 温厚明亮
        pace: 稍快而清楚
        pitch: 中等
  chapters:
    - id: ch01
      title: 清晨上路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 天刚蒙蒙亮，流浪汉们便全体出动，上路了。头顶的阴云沉沉压着，脚下尽是烂泥，空气里还带着冬天的寒气。队伍中再没有半点笑声。有人阴着脸一声不响，有人烦躁易怒，谁也和气不起来，而且个个渴得难受。
        - id: ch01-b02
          speaker: narrator
          text: 头领交代了几句，把“杰克”交给雨果看管。他命令约翰·坎蒂离孩子远些，不准再找麻烦，也警告雨果不许下手太狠。
        - id: ch01-b03
          speaker: narrator
          text: 走了一阵，天渐渐暖和，云也散开一些。众人不再冷得发抖，精神跟着好起来。他们越走越快活，开始彼此取笑，还沿路辱骂行人。看来，他们又重新懂得享受人生了。
        - id: ch01-b04
          speaker: narrator
          text: 路人一看见这伙人，立刻躲到旁边。无论听见多么下流无礼的话，大家都默默忍着，谁也不敢还嘴。流浪汉们甚至从树篱上扯走晾晒的衣服。有时主人明明站在眼前，也不敢阻拦，仿佛只要树篱还在，就该谢天谢地。
        - id: ch01-b05
          speaker: narrator
          text: 不久，这伙人闯进一户小农庄，把那里当成自己家。农夫一家吓得发抖，只能掏空食品柜，为他们摆出早饭。流浪汉接食物时轻佻地捏主妇和女儿们的下巴，又用粗俗的话拿她们取乐，笑得放肆极了。
        - id: ch01-b06
          speaker: narrator
          text: 他们还把骨头和蔬菜扔向农夫父子，逼得几个人不停躲闪。谁打中了，众人就轰然喝彩。有个女儿不肯忍受他们的无礼，他们竟在临走前把黄油抹了她满头。最后，这伙人还扬言，若是谁把事情报告官府，他们就回来放火，连人带房子一起烧掉。
        - id: ch01-b07
          speaker: narrator
          text: 快到中午时，众人走了很远的路，早已疲惫不堪。他们来到一个颇大的村庄外，在树篱后停下。休息一小时后，大伙儿分头从不同方向进村，各自去做自己的营生。杰克得跟着雨果。
        - id: ch01-b08
          speaker: narrator
          text: 两人在村里转来转去。雨果一路寻找下手的机会，可始终没有收获，只好开了口。
        - id: ch01-b09
          speaker: hugo
          text: 这个穷地方没什么可偷的。走吧，咱们讨饭去。
        - id: ch01-b10
          speaker: prince_edward
          text: 咱们？你倒说得出口。讨饭正合你的身份，你自己去，我绝不去。
        - id: ch01-b11
          speaker: hugo
          text: 你不讨饭？你是从什么时候开始改邪归正的？
        - id: ch01-b12
          speaker: prince_edward
          text: 你到底想说什么？
        - id: ch01-b13
          speaker: hugo
          text: 你不是从小就在伦敦街头要饭吗？还能是什么意思？
        - id: ch01-b14
          speaker: prince_edward
          text: 我讨饭？你这蠢货！
        - id: ch01-b15
          speaker: hugo
          text: 省着点夸我吧，你那点好话还能多留几天。你父亲说，你一辈子都在讨饭。也许他撒了谎。怎么，你还真敢这么说？
        - id: ch01-b16
          speaker: prince_edward
          text: 你说的那个人并不是我父亲。不错，他撒了谎。
        - id: ch01-b17
          speaker: hugo
          text: 行了，伙计，装疯是拿来取乐的，别玩过头害了自己。我要把这句话告诉他，他准会把你的皮烤得够呛。
        - id: ch01-b18
          speaker: prince_edward
          text: 用不着你去说，我会亲口告诉他。
        - id: ch01-b19
          speaker: hugo
          text: 我倒真喜欢你这份胆量，可你的脑子实在不怎么样。人活着已经免不了断骨头、挨棍子，何必还自己找上门去挨打？算了，别谈这个。你父亲的话，我信。
        - id: ch01-b20
          speaker: hugo
          text: 他当然会撒谎。机会合适时，我们当中再正派的人也会撒。可这件事不值得。谎话是好东西，聪明人不会白白浪费。既然你不肯讨饭，那咱们干什么？去厨房偷吃的吗？
        - id: ch01-b21
          speaker: narrator
          text: 国王已经听得很不耐烦。
        - id: ch01-b22
          speaker: prince_edward
          text: 别再胡扯了。你实在叫我厌烦！
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: 雨果也恼怒起来。
        - id: ch01-b24
          speaker: hugo
          text: 你听好。你不讨饭，也不偷东西，那就算了。可我讨饭的时候，你必须给我做诱饵。你要是觉得自己敢拒绝，只管试试！
          emotion: angry
        - id: ch01-b25
          speaker: narrator
          text: 国王刚要轻蔑地反驳，雨果便抢在前面叫他住口。一个面相和善的人正朝这边走来。
        - id: ch01-b26
          speaker: hugo
          text: 我马上倒地装病。那个人一跑过来，你就跪下哭，装得越伤心越好。你要告诉他，这是你病得快死的兄弟，你们无亲无故。求他看在上帝分上发发慈悲，赏一个便士，救救这个无依无靠的苦命人。
        - id: ch01-b27
          speaker: hugo
          text: 记住，一直哭，半刻也不能停。非等我们骗到他的便士不可，不然你一定会后悔。
    - id: ch02
      title: 雨果的骗局
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 雨果立刻呻吟起来。他翻着眼睛，身子东摇西晃。等陌生人走到跟前，他突然尖叫一声，扑倒在那人面前，接着就在泥地里翻滚扭动，仿佛正忍受着可怕的痛苦。
        - id: ch02-b02
          speaker: stranger
          text: 哎呀，可怜的人！你一定痛苦极了。来，让我扶你起来。
        - id: ch02-b03
          speaker: hugo
          text: 高贵的老爷，千万别碰我。愿上帝保佑您这位尊贵的绅士。我一发病，别人碰一下便会痛得要命。我兄弟知道，我每回发作都要受多大的罪。
        - id: ch02-b04
          speaker: hugo
          text: 好心的老爷，赏我一个便士买点吃的吧。给了钱，就让我独自在这里忍受痛苦好了。
        - id: ch02-b05
          speaker: stranger
          text: 只要一个便士？可怜的孩子，我给你三个。拿着吧，尽管收下，不必客气。
        - id: ch02-b06
          speaker: narrator
          text: 绅士慌忙在口袋里摸索，掏出三个便士交给雨果，又招呼国王过来。
        - id: ch02-b07
          speaker: stranger
          text: 小伙子，快来帮忙。我们一起把你哥哥抬进那边的屋子，到了那里再——
        - id: ch02-b08
          speaker: prince_edward
          text: 我不是他的兄弟。
        - id: ch02-b09
          speaker: stranger
          text: 什么？你不是他的兄弟？
          emotion: surprised
        - id: ch02-b10
          speaker: hugo
          text: 听听他说的！我都一只脚踏进坟墓了，他竟然连亲兄弟也不认！
        - id: ch02-b11
          speaker: narrator
          text: 雨果嘴里哀号着，暗地里却气得咬牙。
        - id: ch02-b12
          speaker: stranger
          text: 孩子，如果他真是你哥哥，你的心也太硬了。他连手脚都快动不了了，你竟这样对待他。若他不是你哥哥，那他究竟是什么人？
        - id: ch02-b13
          speaker: prince_edward
          text: 他是乞丐，也是小偷。他拿了你的钱，还偷了你口袋里的东西。你若想治好他，就用手杖狠狠抽他的肩膀，剩下的交给上帝吧。
        - id: ch02-b14
          speaker: narrator
          text: 雨果可没留下来等这场奇迹。他一跃而起，像风一样跑了。绅士紧追在后，一路大喊捉贼。国王深深感谢上天让自己脱身，立刻朝相反方向飞奔，直到确定没有危险才慢下来。
        - id: ch02-b15
          speaker: narrator
          text: 他随意挑了眼前第一条路，很快把村子抛在身后。接下来的几个小时，他能走多快便走多快，还不时紧张地回头寻找追兵。后来，恐惧终于退去，他才觉得自己安全了。
        - id: ch02-b16
          speaker: narrator
          text: 这时国王才发现，他又饿又累。他在一户农舍前停下，刚要开口，人家就粗暴地把他赶走了。那身破衣服让所有人都厌恶他。
        - id: ch02-b17
          speaker: narrator
          text: 国王感到屈辱又愤怒。他继续往前走，发誓再也不让自己受到同样的待遇。可是饥饿终究能压倒骄傲。黄昏快到时，他又试着走近另一户农舍，结果比上一次还糟。人家骂了他一通，还说他若不马上滚开，就把他当流浪汉抓起来。
        - id: ch02-b18
          speaker: narrator
          text: 夜色降临，天又冷又阴。国王的双脚疼痛难忍，仍只能缓慢地往前走。他不敢停。每次坐下休息，寒气很快便钻进骨头。
        - id: ch02-b19
          speaker: narrator
          text: 他从未经历过这样的夜晚。天地庄严而昏暗，四周空旷得没有尽头。每隔一阵，便有说话声慢慢靠近，从旁边经过，又消失在寂静中。国王看不清说话的人，只能瞧见一团团模糊的影子飘过去。那景象像有幽灵出没，叫他浑身发抖。
        - id: ch02-b20
          speaker: narrator
          text: 偶尔，远处会闪过一点灯火，仿佛来自另一个世界。羊铃的声音缥缈而含混。牛群低沉的叫声乘夜风飘来，越来越弱，听着十分凄凉。有时，狗的哀嗥会越过看不见的田野和森林。
        - id: ch02-b21
          speaker: narrator
          text: 所有声音都离得那么远。小国王觉得，一切有生命、有动静的东西都远离了他。无边无际的荒寂中央，只剩下他独自一人，没有朋友，也没有伴侣。
    - id: ch03
      title: 黑暗中的触碰
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这种全新的经历既可怕，又有一种摄人的魔力。国王跌跌撞撞地走着，头顶的枯叶不时轻轻作响，像人在低声耳语，每次都让他吃一惊。
        - id: ch03-b02
          speaker: narrator
          text: 过了一会儿，他突然看见近旁有盏白铁灯笼，灯光斑斑点点地洒在地上。他退到暗处等待。灯笼放在一座谷仓敞开的门旁，可那里听不到声音，也看不见人影。
        - id: ch03-b03
          speaker: narrator
          text: 国王站着不动，冷得越来越难受。眼前的谷仓却像在热情招呼他。最后，他决定冒险进去。他轻手轻脚地快步走过去，刚跨过门槛，身后就传来了说话声。
        - id: ch03-b04
          speaker: narrator
          text: 他赶紧躲到谷仓里的一只大桶后面，弯下身子。两个农工提着灯笼走进来，一面干活，一面聊天。趁他们举着灯走来走去，国王睁大眼睛，把四周的位置仔细看了个清楚，好等独自留下时摸黑行走。
        - id: ch03-b05
          speaker: narrator
          text: 谷仓尽头有一间宽敞的畜栏。国王打算等人走后，摸黑到那里过夜。他还记住了半路上一堆马毯的位置，准备以英格兰王室的名义，征用它们一个晚上。
        - id: ch03-b06
          speaker: narrator
          text: 两个农工终于做完活，带着灯笼离开，又从外面锁上了门。国王冻得直发抖。他摸到那堆马毯，把它们抱起来，再摸索着走进畜栏。他拿两条铺床，另外两条盖在身上，心里顿时快活起来。
        - id: ch03-b07
          speaker: narrator
          text: 那些毯子又旧又薄，不能完全挡住寒气，还散发着刺鼻的马味，浓得几乎叫人喘不过气。可是有了床和被子，这位国王已经很满足了。
        - id: ch03-b08
          speaker: narrator
          text: 国王虽然又饿又冷，却也累得睁不开眼。困倦很快占了上风，他渐渐陷入半梦半醒的状态。就在他要完全睡着时，忽然清清楚楚地感觉到，有什么东西碰了他一下。
        - id: ch03-b09
          speaker: narrator
          text: 他猛然清醒，吓得喘不过气。黑暗中那神秘的一碰，几乎让他的心停止跳动。他一动不动地躺着，屏住呼吸仔细听。可是什么也没有动，一点声音都没有。
        - id: ch03-b10
          speaker: narrator
          text: 他听着，等着，仿佛过了很久。四周依旧没有动静。国王终于又有了睡意，谁知那个神秘的东西突然又碰了他一下。
        - id: ch03-b11
          speaker: narrator
          text: 一个看不见也听不见的东西，竟然伸来这样轻轻的一碰。那感觉可怕极了，孩子吓得浑身发冷。他该怎么办？他想不出答案。
        - id: ch03-b12
          speaker: narrator
          text: 难道该舍弃这个还算舒服的地方，逃走吗？可是谷仓已经锁住，他根本出不去。要是在四堵墙之间摸黑乱跑，那个幽灵却一路追来，每次转弯都轻轻碰一下他的脸或肩膀，单是想想都叫人无法忍受。
        - id: ch03-b13
          speaker: narrator
          text: 可若留在原地，整夜活活忍受这种恐怖，难道会好一些吗？不会。最后，他明白只有一个办法。必须伸出手，把那东西找出来。
        - id: ch03-b14
          speaker: narrator
          text: 想到这个办法很容易，真要动手却难极了。他小心地把手伸进黑暗，又猛吸一口气，立刻缩回来。这样试了三次。并不是他碰到了什么，而是每一次都觉得自己马上就要碰到它。
        - id: ch03-b15
          speaker: narrator
          text: 到了第四次，国王伸得稍远一些，手背轻轻擦过一个柔软温暖的东西。他几乎吓僵了。他的神经绷得太紧，认定那是一具刚死不久、身上还有余温的尸体。此刻，他宁愿死也不肯再碰第二次。
        - id: ch03-b16
          speaker: narrator
          text: 他会这么想，是因为还不了解人的好奇心有多么强大。没过多久，那只手又颤抖着伸了出去。理智明明反对，他自己也不情愿，可手还是固执地继续摸索。
        - id: ch03-b17
          speaker: narrator
          text: 他的手碰到一绺长毛，不由得打了个寒战。顺着毛摸过去，又碰到一根温热的绳子。再顺着绳子摸下去，他终于发现了一头无辜的小牛。原来那根绳子，根本就是小牛的尾巴。
    - id: ch04
      title: 小牛朋友
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 为了一头睡着的小牛，竟然平白受了那么多惊吓和折磨，国王打心底里感到羞愧。其实他不必羞愧。真正吓坏他的并不是小牛，而是他借着小牛想象出来的那个可怕东西。那东西根本不存在。
        - id: ch04-b02
          speaker: narrator
          text: 在那个迷信盛行的古老年代，换成任何一个男孩，都会像他一样行动，也会受到同样的折磨。
        - id: ch04-b03
          speaker: narrator
          text: 发现那东西只是小牛，国王当然很高兴。更让他开心的是，自己终于有了陪伴。他实在太孤独、太无依无靠，所以哪怕是一头卑微的小牛愿意作伴，也叫他满心欢迎。
        - id: ch04-b04
          speaker: narrator
          text: 人们一路冲撞他，粗暴地对待他。如今，他总算来到另一个生灵身边。小牛也许没有什么高贵的禀赋，却至少有一颗柔软的心，性情也很温和。这让他得到了真正的安慰。于是国王决定暂时不讲身份，同小牛交个朋友。
        - id: ch04-b05
          speaker: narrator
          text: 小牛就躺在旁边，伸手便能碰到。国王抚摸着它光滑温暖的背，忽然想到，这位新朋友还有别的用处。
        - id: ch04-b06
          speaker: narrator
          text: 他重新铺好床，把毯子挪到小牛身边，再紧贴着它的背蜷起来，最后把盖毯拉过来，罩住自己和小牛。只过了一两分钟，他便暖和舒适起来，竟和躺在威斯敏斯特王宫柔软的羽绒床上没有两样。
        - id: ch04-b07
          speaker: narrator
          text: 愉快的念头马上涌进心头，人生也显得明亮了一些。他已经摆脱奴役和犯罪的锁链，也摆脱了那群卑劣残暴的亡命徒。他身上暖和，又有地方遮风挡雨。简单说来，他很幸福。
        - id: ch04-b08
          speaker: narrator
          text: 夜风越来越强，一阵阵扫过来，吹得破谷仓摇晃作响。风势有时会减弱，转而绕着墙角和凸出的木板呜咽哀号。可国王如今躺得温暖又安稳，这些声音在他耳中全成了音乐。
        - id: ch04-b09
          speaker: narrator
          text: 任风吹，任风狂，任它拍打轰响，任它呜咽哀鸣，国王一点也不在乎。他只是更亲密地偎着朋友，享受那份温暖和满足，随后心中一片宁静安详，安安稳稳地沉入一场无梦的深睡。
        - id: ch04-b10
          speaker: narrator
          text: 远处的狗还在嚎叫，牛群依然忧郁地低鸣。狂风继续肆虐，大雨一阵阵猛打着屋顶。可是英格兰国王陛下依旧沉睡，没有受到半点惊扰。
        - id: ch04-b11
          speaker: narrator
          text: 小牛也睡得一样安稳。它头脑简单，不容易被风暴搅得心神不宁，更不会因为身旁睡着一位国王，就觉得有什么不自在。
