audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently ironic
        timbre: clear and resonant
        pace: measured
        pitch: medium
    prince_edward:
      display_name: Prince Edward
      tts:
        delivery: proud, fiery, and resolute
        timbre: bright and firm
        pace: brisk
        pitch: medium-high
    hugo:
      display_name: Hugo
      tts:
        delivery: sly, taunting, and coldly amused
        timbre: thin and rough
        pace: brisk
        pitch: medium-high
    kind_stranger:
      display_name: Kindly Stranger
      tts:
        delivery: compassionate, earnest, and easily alarmed
        timbre: warm and gentle
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: The Prince with the Tramps
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            At early dawn, the vagabonds set out again. A dark sky hung above them. The ground was wet and muddy, and the air had a sharp winter chill. Nobody felt merry now. Some trudged along in sullen silence. Others snapped and complained. Not one of them was in a gentle mood, and every one of them was thirsty.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The Ruffler placed Jack, as they called Edward, in Hugo's care and gave Hugo a few quick orders. John Canty was to stay away from the boy and leave him alone. Hugo, too, was warned not to handle him too roughly.
        - id: ch01-b03
          speaker: narrator
          text: >-
            After a while, the day grew milder and the clouds began to lift. The troop stopped shivering, and their spirits rose. Soon they were joking among themselves and shouting insults at travelers on the road. That was how these men showed that life had become enjoyable again.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Everyone feared them. People stepped out of their way and quietly endured their filthy abuse. No one dared answer back. The tramps pulled linen from hedges, sometimes while the owners stood watching. Those owners did not protest. They seemed thankful the thieves had taken only the linen and had left the hedges behind.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Before long, the gang marched into a little farmhouse and settled in as if it belonged to them. The frightened farmer and his family emptied the pantry to serve them breakfast. As the housewife and her daughters brought out the food, the men touched them rudely under the chin, called them insulting names, and roared at their own coarse jokes.
        - id: ch01-b06
          speaker: narrator
          text: >-
            They pelted the farmer and his sons with bones and vegetables, forcing them to dodge again and again. Whenever something struck its mark, the gang cheered wildly. One daughter resisted their rude treatment, so they smeared butter over her head. At last the vagabonds left, but not before warning the family to keep silent. If the authorities heard what had happened, they said, they would return and burn the house down over everyone inside.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Near noon, after a long, exhausting march, the gang stopped behind a hedge at the edge of a large village. They rested for an hour. Then they split up and entered by different ways to practice their various trades. Jack was sent with Hugo.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The two boys wandered about while Hugo searched for a chance to make some money. He found none. At last, he decided the village offered nothing worth stealing.
        - id: ch01-b09
          speaker: hugo
          text: >-
            There's nothing here to steal. This place is worthless. We'll have to beg instead.
        - id: ch01-b10
          speaker: prince_edward
          text: >-
            We? Beg if that is your trade. It suits you. I will do no such thing.
        - id: ch01-b11
          speaker: hugo
          text: >-
            You won't beg? Since when did you give it up?
          emotion: surprised
        - id: ch01-b12
          speaker: prince_edward
          text: >-
            What are you talking about?
        - id: ch01-b13
          speaker: hugo
          text: >-
            What am I talking about? You've begged in the streets of London all your life.
        - id: ch01-b14
          speaker: prince_edward
          text: >-
            I have? You fool!
        - id: ch01-b15
          speaker: hugo
          text: >-
            Save your insults. You'll need them later. Your father says you've been a beggar all your days. Perhaps he lied. Maybe you'll even dare to say so.
        - id: ch01-b16
          speaker: prince_edward
          text: >-
            That man you call my father? Yes. He lied.
        - id: ch01-b17
          speaker: hugo
          text: >-
            Don't push this madman's game too far, mate. Play it for amusement if you like, but don't let it get you hurt. If I tell him what you said, he'll burn you nicely for it.
        - id: ch01-b18
          speaker: prince_edward
          text: >-
            Do not trouble yourself. I will tell him myself.
        - id: ch01-b19
          speaker: hugo
          text: >-
            I do like your spirit. Your judgment is another matter. Life brings enough broken bones and beatings without inviting more. Still, let that go. I believe your father. Oh, I don't doubt he can lie. I don't doubt he does it now and then, because even the best of us will lie when it serves us. But he has no reason to lie about this. A wise man doesn't waste a useful thing like a lie when it gains him nothing. So, if begging no longer pleases you, what shall we do? Rob kitchens?
        - id: ch01-b20
          speaker: prince_edward
          text: >-
            Enough of this nonsense. You are tiring me.
        - id: ch01-b21
          speaker: hugo
          text: >-
            Now listen, mate. You won't beg, and you won't steal. Fine. But you will act as my decoy while I beg. Refuse if you think you dare.
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: >-
            Edward was about to answer with contempt, but Hugo cut him off. A kind-looking stranger was coming toward them, and Hugo had already chosen his trick.
        - id: ch01-b23
          speaker: hugo
          text: >-
            Quiet! Here comes a man with a kindly face. I'll fall down in a fit. When he runs to help me, start wailing. Drop to your knees and pretend to cry. Tell him I'm your poor sick brother and that we have no friends. Beg him, in God's name, to pity a miserable boy who's been struck down and is about to die. Ask for one little penny from all his riches. And keep crying until we cheat him out of it, or you'll be sorry.
        - id: ch01-b24
          speaker: narrator
          text: >-
            At once, Hugo began to moan and groan. His eyes rolled. He staggered from side to side. Just as the stranger reached him, Hugo gave a shriek and flung himself into the road. He twisted and writhed in the dirt as if terrible pain had seized him.
        - id: ch01-b25
          speaker: kind_stranger
          text: >-
            Oh dear! You poor soul, how terribly you suffer. Here, let me help you to your feet.
        - id: ch01-b26
          speaker: hugo
          text: >-
            No, noble sir, please don't touch me. God bless you for being such a gentleman, but a hand upon me causes awful pain when one of these fits comes. My brother can tell you how I suffer. Just a penny, dear sir, so I may buy a little food. Then leave me here with my misery.
        - id: ch01-b27
          speaker: kind_stranger
          text: >-
            One penny? You shall have three, you poor boy. Here, take them gladly. Now come here, lad, and help me carry your suffering brother to that house, where we can—
        - id: ch01-b28
          speaker: prince_edward
          text: >-
            I am not his brother.
        - id: ch01-b29
          speaker: kind_stranger
          text: >-
            What? He is not your brother?
          emotion: surprised
        - id: ch01-b30
          speaker: hugo
          text: >-
            Listen to him! He denies his own brother, even with one foot in the grave!
        - id: ch01-b31
          speaker: narrator
          text: >-
            Hugo groaned aloud, but beneath the groan he ground his teeth in fury.
        - id: ch01-b32
          speaker: kind_stranger
          text: >-
            Boy, if he truly is your brother, you have a cruel heart. Shame on you! He can scarcely move. If he isn't your brother, then who is he?
        - id: ch01-b33
          speaker: prince_edward
          text: >-
            He is a beggar and a thief. He has your money, and he has picked your pocket as well. If you want to work a healing miracle, lay your staff across his shoulders and leave the rest to Providence.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Hugo did not wait for that miracle. He sprang up and raced away like the wind. The gentleman chased him, loudly calling for others to stop the thief. Edward drew a deep breath and thanked Heaven for his freedom. Then he ran in the opposite direction and did not slow down until all danger lay behind him.
        - id: ch01-b35
          speaker: narrator
          text: >-
            He took the first road he found and soon left the village far behind. For several hours he hurried onward as fast as he could. Again and again, he looked nervously over his shoulder for pursuit. At last his fear faded, and in its place came the grateful knowledge that he was safe.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Only then did Edward notice how hungry and tired he had become. He stopped at a farmhouse, meaning to ask for help, but they would not even let him speak. They drove him rudely away because of his ragged clothes.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Hurt and indignant, he wandered on, determined never to offer himself for such treatment again. But hunger can master pride. As evening approached, he tried another farmhouse. This time he was treated even worse. They called him ugly names and threatened to have him arrested as a vagrant unless he moved along at once.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Night fell, cold and cloudy, while the footsore King still struggled onward. He had to keep moving. Whenever he sat down to rest, the cold soon reached all the way to his bones. Everything about that journey through the deep gloom and the vast, empty night felt new and strange.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Now and then, Edward heard voices draw near, pass him, and fade back into silence. He could barely see the people who spoke. Their bodies were only shapeless blurs drifting through the dark, and they seemed so ghostly that he shuddered.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Sometimes a tiny light flickered in the distance. It always looked impossibly far away, almost as if it shone from another world. A sheep's bell might tinkle faintly, or the lowing of cattle might float toward him on the night wind and slowly die. From unseen fields and forests came the lonely howl of a dog.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Every sound came from far off. It made the little King feel that all life and movement had gone away from him. He seemed to stand alone, without a friend or companion, at the center of an endless emptiness.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Edward stumbled on through the frightening wonder of this strange new experience. The dry leaves rustled softly above him, sounding so much like human whispers that they startled him. Then, without warning, he saw the spotted glow of a tin lantern close by.
        - id: ch01-b43
          speaker: narrator
          text: >-
            He stepped into the shadows and waited. The lantern stood beside the open door of a barn. For some time, Edward watched and listened. No one moved, and he heard nothing. Standing still made him terribly cold, while the shelter of the barn looked more inviting every moment. At last, he decided to risk going inside.
        - id: ch01-b44
          speaker: narrator
          text: >-
            He moved quickly and quietly toward the door. Just as he crossed the threshold, voices sounded behind him. Edward darted behind a barrel and crouched there. Two farm laborers entered with the lantern and began their work, talking as they moved around the barn.
        - id: ch01-b45
          speaker: narrator
          text: >-
            While their light traveled about, Edward studied the place. At the far end, he saw what looked like a roomy stall. Once the men left, he meant to feel his way there through the darkness. Halfway across the barn, he also noticed a pile of horse blankets. For this one night, he planned to take them into the service of the Crown of England.
        - id: ch01-b46
          speaker: narrator
          text: >-
            In time, the laborers finished their work and went away. They took the lantern and fastened the barn door behind them. Shivering in the darkness, Edward hurried toward the blankets as well as he could. He gathered them up, then felt his way safely to the stall.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Two blankets became his bed, and he pulled the other two over himself. The King was glad to have them, though they were old and thin and did not keep out all the cold. They also gave off such a powerful smell of horse that it nearly choked him.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Edward was hungry and chilly, but he was even more tired. Drowsiness slowly overcame every other feeling, and he began to drift into a half-sleep. Just as he was about to lose consciousness completely, something touched him.
        - id: ch01-b49
          speaker: narrator
          text: >-
            In an instant, he was wide awake and gasping. The horror of that mysterious touch in the darkness nearly stopped his heart. He lay perfectly still and listened, hardly breathing. Nothing moved. There was no sound. He kept listening and waiting through what seemed like a very long time. Still nothing stirred, and not the faintest sound broke the silence. Only then did he begin to believe that whatever had touched him might be gone.
        - id: ch01-b50
          speaker: narrator
          text: >-
            At last, his eyes began to close again. Then the unseen thing touched him a second time. That light touch from a silent, invisible presence filled the boy with sickening fear. He did not know what to do.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Should he leave his fairly comfortable bed and run from this horror? But where could he go? The barn was locked. He imagined himself rushing blindly from place to place inside those four walls. All the while, a phantom would glide after him and reach him with that soft, horrible touch upon his cheek or shoulder wherever he turned. The thought was unbearable.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Yet staying where he was and suffering this terror through the whole night seemed like a living death. There was only one thing left to do. Edward knew what it was. He had to reach into the dark and find that thing.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Thinking of it was easy. Making himself do it was not. Three times, he carefully stretched one hand a short way into the darkness. Three times, he snatched it back with a gasp. He had touched nothing, but each time he felt certain that he was just about to.
        - id: ch01-b54
          speaker: narrator
          text: >-
            On his fourth attempt, Edward reached a little farther. His fingers brushed against something soft and warm. He almost froze with terror. In his frightened state, he could imagine only one answer. It must be a body, newly dead and still warm.
        - id: ch01-b55
          speaker: narrator
          text: >-
            He thought he would rather die than touch it again. But that thought did not last, because he had not yet learned how powerful human curiosity can be. Before long, his trembling hand was searching once more. He did not want it to. His judgment told him to stop. Still, the hand went stubbornly on.
        - id: ch01-b56
          speaker: narrator
          text: >-
            His fingers found a bunch of long hair. Edward shuddered, but followed it until he reached what felt like a warm rope. He followed the rope, too, and discovered an innocent calf. The rope was not a rope at all. It was the calf's tail.
        - id: ch01-b57
          speaker: narrator
          text: >-
            The King felt deeply ashamed that a sleeping calf had caused him so much fear and misery. But he did not need to be ashamed. The calf itself had not frightened him. He had been terrified by the dreadful thing that did not exist, the thing he had imagined the calf to be. In those old and superstitious days, any other boy would have suffered just as Edward did.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Edward was delighted to learn what the creature was, and even happier to have its company. He had felt so lonely and friendless that this humble animal seemed a welcome companion. People had knocked him about and treated him cruelly. Now, at last, he was beside a fellow creature with a soft heart and a gentle spirit, even if the calf had few grander qualities. The King decided to set rank aside and make a friend of it.
        - id: ch01-b59
          speaker: narrator
          text: >-
            The calf lay close enough for Edward to stroke its smooth, warm back. As he did, another use for his new friend occurred to him. He moved his bed until it lay beside the calf, cuddled against its back, and drew the covers over both of them.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Within a minute or two, he was as warm and comfortable as he had ever been among the soft beds of Westminster Palace.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Pleasant thoughts came to him at once, and life seemed cheerful again. He was free from slavery and crime. He was free from the company of cruel and brutal outlaws. He was warm. He had shelter. In a word, he was happy.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Outside, the night wind rose. Sudden gusts swept past, making the old barn shake and rattle. Then the wind would weaken for a time and go moaning around every corner and jutting board. To Edward, snug in his blankets, it all sounded like music. Let the storm blow and rage. Let it batter, bang, moan, and wail. He did not care. He enjoyed every sound of it now.
        - id: ch01-b63
          speaker: narrator
          text: >-
            The King nestled closer to his friend, wrapped in warm contentment. Soon he slipped peacefully into a deep, dreamless sleep.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Far away, dogs howled and cattle gave their sorrowful calls. The wind kept raging, and hard rain swept across the barn roof. But the Majesty of England slept on without stirring. The calf slept too. It was a simple creature, not easily troubled by storms or embarrassed to find itself sharing a bed with a king.
