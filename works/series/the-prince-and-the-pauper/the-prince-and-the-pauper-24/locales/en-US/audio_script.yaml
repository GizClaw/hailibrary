  chapters:
    - id: ch01
      title: The Escape
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The short winter day was almost over. Only a few people remained in the streets, and they hurried along without looking either way. The wind was rising, twilight was gathering, and each person seemed intent on finishing an errand and getting safely indoors. No one paid any attention to the constable and his prisoners. They did not seem to see them at all. Edward wondered if a king on his way to jail had ever been met with such astonishing indifference.
        - id: ch01-b02
          speaker: narrator
          text: >-
            At last the constable entered an empty market square. When they reached the middle, Hendon put a hand on the man's arm and spoke quietly.
        - id: ch01-b03
          speaker: miles_hendon
          text: >-
            Wait a moment, good sir. No one can hear us here, and I need a word with you.
        - id: ch01-b04
          speaker: constable
          text: >-
            My duty will not allow it, sir. Do not hold me up. Night is coming.
        - id: ch01-b05
          speaker: miles_hendon
          text: >-
            Stay anyway. This concerns you closely. Turn your back for a moment, pretend you see nothing, and let this poor boy escape.
        - id: ch01-b06
          speaker: constable
          text: >-
            You dare say that to me? I am placing you under arrest.
        - id: ch01-b07
          speaker: miles_hendon
          text: >-
            Not so fast. Take care that you make no foolish mistake.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Then Hendon lowered his voice to a whisper and spoke into the constable's ear.
        - id: ch01-b09
          speaker: miles_hendon
          text: >-
            That pig you bought for eightpence may cost you your neck, man.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The constable was struck speechless. Then he found his voice and began to bluster and threaten. Hendon stayed perfectly calm. He waited until the man had spent all his breath before answering.
        - id: ch01-b11
          speaker: miles_hendon
          text: >-
            I have taken a liking to you, friend, and I would hate to see you harmed. I heard everything in that hall, every word between you and the woman. I can prove it.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Hendon repeated their entire conversation, word for word. When he had finished, he asked one last question.
        - id: ch01-b13
          speaker: miles_hendon
          text: >-
            Did I get it right? Do you think I could repeat it just as well to the judge?
        - id: ch01-b14
          speaker: narrator
          text: >-
            Fear and misery silenced the constable again. After a moment, he pulled himself together and tried to sound unconcerned.
        - id: ch01-b15
          speaker: constable
          text: >-
            You are making far too much of a joke. I only teased the woman to amuse myself.
        - id: ch01-b16
          speaker: miles_hendon
          text: >-
            And did you keep her pig for your amusement too?
        - id: ch01-b17
          speaker: constable
          text: >-
            Of course, good sir. That was all. I tell you, the whole thing was only a joke.
        - id: ch01-b18
          speaker: miles_hendon
          text: >-
            I am beginning to believe you. Still, wait here while I ask his worship. After all, the judge knows far more than either of us about law and jokes.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Hendon spoke with a puzzling mix of mockery and half belief. Still talking, he started to walk away. The constable hesitated, shifted about, and spat out an oath or two. Then he called Hendon back.
        - id: ch01-b20
          speaker: constable
          text: >-
            Stop, good sir! Please wait. The judge? Why, that man has no more sympathy with a joke than a dead body has. Come back, and we can discuss this. God's body, I am in terrible trouble, all because of one harmless, thoughtless bit of fun. I have a family. I have a wife and little children. Please, your worship, listen to reason. What do you want from me?
        - id: ch01-b21
          speaker: miles_hendon
          text: >-
            Only this. Be blind, dumb, and unable to move while a man slowly counts to a hundred thousand.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Hendon wore the expression of a man asking for one very small and reasonable favor.
        - id: ch01-b23
          speaker: constable
          text: >-
            That will ruin me! Please be reasonable, good sir. Look at it from every side, and you will see that it was plainly a joke. Even if it was not a joke, the fault was so small that the harshest punishment could only be a warning from the judge.
          emotion: fearful
        - id: ch01-b24
          speaker: narrator
          text: >-
            Hendon answered with such solemnity that the air itself seemed to turn cold.
        - id: ch01-b25
          speaker: miles_hendon
          text: >-
            This joke of yours has a name in law. Do you know what it is?
        - id: ch01-b26
          speaker: constable
          text: >-
            I did not know that! Perhaps I was unwise, but I never dreamed it had a name. Dear heaven, I thought it was original.
          emotion: fearful
        - id: ch01-b27
          speaker: miles_hendon
          text: >-
            Oh, it has a name. The law calls this crime Non compos mentis lex talionis sic transit gloria mundi.
        - id: ch01-b28
          speaker: constable
          text: >-
            Oh, my God!
          emotion: fearful
        - id: ch01-b29
          speaker: miles_hendon
          text: >-
            And the penalty is death.
        - id: ch01-b30
          speaker: constable
          text: >-
            God have mercy on me, a sinner!
          emotion: fearful
        - id: ch01-b31
          speaker: miles_hendon
          text: >-
            You took advantage of a woman who was at fault, in terrible danger, and completely at your mercy. You seized property worth more than thirteenpence halfpenny and paid almost nothing for it. In the eyes of the law, that is constructive barratry, misprision of treason, malfeasance in office, ad hominem expurgatis in statu quo. The punishment is death by hanging, with no ransom, no lesser sentence, and no benefit of clergy.
        - id: ch01-b32
          speaker: constable
          text: >-
            Hold me up, sweet sir. My legs are giving way! Have mercy and spare me. I will turn my back and see nothing that happens.
          emotion: fearful
        - id: ch01-b33
          speaker: miles_hendon
          text: >-
            Good. Now you are being wise and reasonable. You will return the pig too, will you not?
        - id: ch01-b34
          speaker: constable
          text: >-
            I will, indeed I will. I will never touch another pig, even if heaven sends it and an archangel delivers it. Go now. For your sake, I am blind. I see nothing. I will say you broke in and tore the prisoner from my hands by force. The door is old and weak. I will smash it down myself sometime between midnight and morning.
        - id: ch01-b35
          speaker: miles_hendon
          text: >-
            Do that, good fellow. No harm will come from it. The judge cares kindly for this poor boy. He will not shed any tears over the escape, and he will not break any jailer's bones for it.
