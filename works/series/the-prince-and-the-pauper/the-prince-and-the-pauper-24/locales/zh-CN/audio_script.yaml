audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    miles_hendon:
      display_name: 迈尔斯·亨顿
      tts:
        delivery: 豪爽诙谐，危急时勇敢坚定
        timbre: 洪亮粗粝
        pace: 明快有力
        pitch: 中低
    constable:
      display_name: 警役
      tts:
        delivery: 圆滑强硬，善于拿腔作势
        timbre: 粗哑浑厚
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 暮色中的交易
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 冬日天短，眼看就要入夜。街上空荡荡的，只剩零星几个行人。他们一心赶着办完差事，好在风起天黑以前躲回温暖的家，根本不朝两边看。这一行人从他们身旁经过，谁也没有留意，仿佛完全看不见。爱德华六世不禁纳闷，一个国王正被押往监牢，世人竟能如此冷淡，这样的怪事从前有过吗？
        - id: ch01-b02
          speaker: narrator
          text: 警役带着众人来到一座空荡荡的集市广场，径直往对面走。到了广场中央，亨顿伸手按住他的胳膊，低声叫住了他。
        - id: ch01-b03
          speaker: miles_hendon
          text: 好先生，等一等。这里没人听得见，我有句话要跟你说。
        - id: ch01-b04
          speaker: constable
          text: 我的职责不许我停下，先生。别耽误我，天就要黑了。
        - id: ch01-b05
          speaker: miles_hendon
          text: 你还是留下吧，这事跟你关系大着呢。只要转过身去，装作什么也没看见，让这个可怜孩子逃走。
        - id: ch01-b06
          speaker: constable
          text: 你竟敢跟我说这种话！我要把你也抓起来——
        - id: ch01-b07
          speaker: miles_hendon
          text: 别急。你可得小心，千万别犯下蠢事。
        - id: ch01-b08
          speaker: narrator
          text: 亨顿把声音压得更低，凑到警役耳边，悄悄点破了他的秘密。
        - id: ch01-b09
          speaker: miles_hendon
          text: 老兄，你花八便士买来的那头猪，说不定会叫你丢掉脑袋。
        - id: ch01-b10
          speaker: narrator
          text: 警役猝不及防，顿时说不出话来。好不容易回过神，他便又嚷又吓唬人，拼命摆起威风。亨顿安安静静地等着，直到他把气力全耗光，才不紧不慢地开口。
        - id: ch01-b11
          speaker: miles_hendon
          text: 朋友，我还挺喜欢你的，并不想看你倒霉。大厅里那些话，我从头到尾听得一清二楚。你和那个女人说了什么，我一个字也没漏。我现在就能证明。
        - id: ch01-b12
          speaker: narrator
          text: 亨顿把两人的对话原原本本复述了一遍，末了又逼问一句。
        - id: ch01-b13
          speaker: miles_hendon
          text: 我说得对不对？要是有这个必要，到了法官面前，我难道不能再说一遍吗？
    - id: ch02
      title: 玩笑的罪名
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 警役又惊又怕，再次哑了半晌。随后，他硬撑起精神，装出一副轻松的样子。
        - id: ch02-b02
          speaker: constable
          text: 不就是个玩笑吗？你何必把事情闹得这么大？我不过拿那个女人寻寻开心。
        - id: ch02-b03
          speaker: miles_hendon
          text: 那么，你留下她的猪，也是为了寻开心？
        - id: ch02-b04
          speaker: constable
          text: 当然了，好先生。我已经告诉你了，整件事不过是个玩笑。
          emotion: angry
        - id: ch02-b05
          speaker: miles_hendon
          text: 我倒有些相信了。不过你先在这里等等，我去问问法官大人。毕竟，他对法律、对玩笑，还有对别的那些事情，都很有见识——
        - id: ch02-b06
          speaker: narrator
          text: 亨顿说得半真半假，讥讽里又像带着几分相信，让人摸不清他的心思。他嘴里还在往下说，人却已经转身要走。警役迟疑起来，浑身不自在，又骂了一两句，终于忍不住把他叫住。
        - id: ch02-b07
          speaker: constable
          text: 慢着，好先生，请等一等！你要去找法官？那个人对玩笑的体谅，还不如一具死尸。回来，我们再商量商量。上帝在上，我这下可惨了，全怪那个无伤大雅、没过脑子的玩笑。我还有家室，有妻子，也有年幼的孩子。大人，请你讲讲道理吧。你到底想要我做什么？
          emotion: fearful
        - id: ch02-b08
          speaker: miles_hendon
          text: 很简单。只要在别人慢慢数到十万以前，你什么也看不见，什么也说不出，浑身也动不了。
        - id: ch02-b09
          speaker: narrator
          text: 亨顿说这话时满脸理所当然，好像只求对方帮一个合情合理的小忙。
        - id: ch02-b10
          speaker: constable
          text: 那我就全毁了！好先生，求你讲讲道理。你把这件事前前后后都想一遍，就会看出它明明只是个玩笑。就算它不算玩笑，过错也实在太小了。再怎么重罚，法官也不过训斥我几句，叫我以后当心罢了。
          emotion: fearful
        - id: ch02-b11
          speaker: narrator
          text: 亨顿忽然换上一副庄严的口气，冷得仿佛连四周的空气也跟着凉了。
        - id: ch02-b12
          speaker: miles_hendon
          text: 你这个玩笑，在法律上可是有名目的。你知道它叫什么吗？
        - id: ch02-b13
          speaker: constable
          text: 我不知道啊！也许我确实不够聪明。可我做梦也想不到，它居然还有个名目。仁慈的上天啊，我还以为是自己独创的呢。
          emotion: fearful
        - id: ch02-b14
          speaker: miles_hendon
          text: 它当然有名目。依照法律，这项罪行就叫“诺恩·孔波斯·门蒂斯，莱克斯·塔利奥尼斯，西克·特兰西特·格洛里亚·蒙迪”。
        - id: ch02-b15
          speaker: constable
          text: 啊，我的上帝！
          emotion: fearful
        - id: ch02-b16
          speaker: miles_hendon
          text: 而它的刑罚，就是死刑。
        - id: ch02-b17
          speaker: constable
          text: 上帝开恩，饶了我这个罪人吧！
          emotion: fearful
    - id: ch03
      title: 警役闭上眼睛
      blocks:
        - id: ch03-b01
          speaker: miles_hendon
          text: 那个女人犯了错，正身陷大祸，只能任你摆布。你却乘人之危，只付一点小钱，就拿走了价值超过十三个半便士的财物。在法律眼里，这就构成蓄意包揽诉讼、隐匿叛国罪、公职渎职，还有阿德·霍米内姆·埃克斯普尔加蒂斯·因·斯塔图·阔。依法应当处以绞刑，不得赎罪，不得减刑，也不能享受神职人员的豁免。
        - id: ch03-b02
          speaker: constable
          text: 快扶住我，好先生，我的腿已经软了！求你发发慈悲，饶我逃过这一劫。我会转过身去，不管发生什么，都装作没看见。
          emotion: fearful
        - id: ch03-b03
          speaker: miles_hendon
          text: 很好。现在你既聪明，又讲道理了。那头猪也会还给人家，是不是？
        - id: ch03-b04
          speaker: constable
          text: 会，我一定还！以后我再也不碰别人的猪，哪怕那头猪是上天送来的，还是大天使亲手送到我面前的。你们走吧。为了你，我现在是个瞎子，什么也看不见。我会说你闯了进来，硬从我手里抢走囚犯。那扇门又旧又破，等半夜到天亮之间，我自己把它砸烂。
        - id: ch03-b05
          speaker: miles_hendon
          text: 就这么办吧，好心人，不会出事的。法官很怜惜这个可怜孩子。他不会为孩子逃走掉眼泪，也不会因此打断哪个狱卒的骨头。
