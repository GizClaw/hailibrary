  chapters:
    - id: ch01
      title: Tom receives instructions.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Tom was led into the main room of a grand set of apartments. He was told to sit, though he hated to do it while elderly gentlemen and great nobles stood around him. He asked them to sit too. They only bowed or murmured their thanks and stayed on their feet. Tom was about to insist when his supposed uncle, the Earl of Hertford, bent close and whispered to him.
        - id: ch01-b02
          speaker: earl_of_hertford
          text: >-
            Please do not press them, my lord. It would not be proper for them to sit in your presence.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Then the Lord St. John was announced. He bowed deeply to Tom before he spoke.
        - id: ch01-b04
          speaker: lord_st_john
          text: >-
            I have come on the King's business, your highness, and the matter must be private. Will you dismiss everyone here except the Earl of Hertford?
        - id: ch01-b05
          speaker: narrator
          text: >-
            Tom plainly had no idea how to dismiss a roomful of attendants. Hertford quietly told him that a motion of his hand would be enough. He need not speak unless he wished to. Tom made the sign, and the waiting gentlemen withdrew. Lord St. John then delivered the King's command.
        - id: ch01-b06
          speaker: lord_st_john
          text: >-
            His Majesty says that, for serious reasons of state, you must hide your illness in every way you can until it passes and you are yourself again. You must never deny that you are the true prince and the heir to England. You must carry yourself with a prince's dignity and accept all the honor and obedience that belong to your rank, without a word or gesture against them.
        - id: ch01-b07
          speaker: lord_st_john
          text: >-
            You must also stop speaking about the low birth and poor life that your sickness has made you imagine. Work hard to remember the faces you once knew. When you cannot remember someone, say nothing. Do not let surprise or any other sign betray you.
        - id: ch01-b08
          speaker: lord_st_john
          text: >-
            At public ceremonies, if you do not know what to do or say, show no uneasiness before those who are watching. Ask the Earl of Hertford or me. The King has ordered us to stay close and advise you until he says otherwise. His Majesty sends you his greetings and prays that God will soon make you well and always keep you in His care.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Lord St. John bowed and stepped aside. Tom answered as a boy submitting to something he could not escape.
        - id: ch01-b10
          speaker: tom_canty
          text: >-
            The King has spoken. No one may twist his command or dodge the parts that chafe him. I will obey.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Hertford moved on to another part of the King's orders.
        - id: ch01-b12
          speaker: earl_of_hertford
          text: >-
            As for His Majesty's command about books and other serious studies, perhaps your highness would prefer some light amusement. We would not want you worn out before the banquet tonight.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Tom looked at him in puzzled surprise. Then he noticed Lord St. John watching him sadly, and he blushed. St. John reminded him of the very lesson he had just received.
        - id: ch01-b14
          speaker: lord_st_john
          text: >-
            Your memory has failed you again, and your surprise showed. Do not let that trouble you. It will pass as you recover. Lord Hertford means the city banquet. Two months ago, the King promised that your highness would attend it. Do you remember now?
        - id: ch01-b15
          speaker: tom_canty
          text: >-
            I am sorry to admit that I had forgotten it entirely.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Tom spoke hesitantly and blushed again. Just then, Lady Elizabeth and Lady Jane Grey were announced. The two lords exchanged a meaningful look, and Hertford hurried toward the door. As the young ladies came in, he spoke to them under his breath.
        - id: ch01-b17
          speaker: earl_of_hertford
          text: >-
            Please do not appear to notice his strange moods, ladies, and do not show surprise when his memory fails. You will be grieved to see how even the smallest things escape him.
        - id: ch01-b18
          speaker: narrator
          text: >-
            At the same time, Lord St. John whispered one last warning into Tom's ear.
        - id: ch01-b19
          speaker: lord_st_john
          text: >-
            Please keep the King's wishes firmly in mind, sir. Remember everything you can, and seem to remember the rest. Do not let your old playmates see how much you have changed. They love you dearly, and it would hurt them. Would you like your uncle and me to remain?
        - id: ch01-b20
          speaker: narrator
          text: >-
            Tom gave a small gesture and murmured his consent. He was learning already. In his simple and honest heart, he had firmly decided to play his enormous part as well as he possibly could, just as the King had ordered him to do.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Even with all these precautions, the talk among the young people sometimes grew awkward. More than once, Tom almost gave up and confessed that the role was too much for him. Each time, Elizabeth's quick judgment saved him, or one of the watchful lords slipped a useful word into the conversation as if by chance.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Once, little Lady Jane turned to Tom with a question that filled him with alarm.
        - id: ch01-b23
          speaker: lady_jane_grey
          text: >-
            My lord, have you visited the Queen and paid your respects today?
        - id: ch01-b24
          speaker: narrator
          text: >-
            Tom hesitated and looked miserable. He was about to risk some answer when Lord St. John smoothly stepped in for him, like a courtier used to meeting delicate dangers.
        - id: ch01-b25
          speaker: lord_st_john
          text: >-
            Indeed he has, madam. The Queen greatly encouraged him concerning His Majesty's health. Was that not so, your highness?
        - id: ch01-b26
          speaker: narrator
          text: >-
            Tom mumbled his agreement, but he felt the ground beneath him becoming dangerous. A little later, someone mentioned that he would not have to study for the present. Lady Jane cried out at once.
        - id: ch01-b27
          speaker: lady_jane_grey
          text: >-
            Oh, what a pity! You were doing so well. But be patient. It will not last long. One day you will be learned like your father, my good prince, and speak as many languages as he does.
        - id: ch01-b28
          speaker: tom_canty
          text: >-
            My father? Why, he cannot even speak his own language so that anyone but the pigs in their sties can understand him! And as for any kind of learning—
        - id: ch01-b29
          speaker: narrator
          text: >-
            Tom had forgotten himself. He looked up and met a grave warning in Lord St. John's eyes. He stopped, turned red, and finished in a low, unhappy voice.
        - id: ch01-b30
          speaker: tom_canty
          text: >-
            Ah, my illness is tormenting me again, and my thoughts are wandering. I meant no disrespect to the King.
          emotion: sad
        - id: ch01-b31
          speaker: narrator
          text: >-
            Elizabeth took her supposed brother's hand between both of hers, respectfully but with affection.
        - id: ch01-b32
          speaker: lady_elizabeth
          text: >-
            We understand, sir. Do not distress yourself. This is not your fault. It is your illness speaking.
          emotion: calm
        - id: ch01-b33
          speaker: tom_canty
          text: >-
            You comfort me kindly, sweet lady. If I may be so bold, I thank you with all my heart.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Then lively little Jane suddenly tossed a simple Greek phrase at Tom. Elizabeth's sharp eyes saw the peaceful blankness on his face and knew the words had flown right over him. Without a pause, she answered Jane in fine-sounding Greek for him, then quietly turned the talk to something else.
        - id: ch01-b35
          speaker: narrator
          text: >-
            On the whole, the time passed pleasantly and smoothly. The hidden snags and sandbars came less and less often, and Tom began to feel more at ease. He could see that everyone was lovingly determined to help him and overlook his mistakes. Then he learned that both young ladies would go with him to the Lord Mayor's banquet that evening. His heart leaped with relief and delight. He would not be friendless now among that great crowd of strangers. Only an hour before, the thought of their going with him would have been more than he could bear.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Tom's two guardian angels had enjoyed the visit much less. Hertford and St. John felt as though they were steering a great ship through a dangerous channel. They never stopped watching for trouble, and their task was no child's game.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Near the end of the visit, Lord Guilford Dudley was announced. The two lords decided that Tom had been tested enough for now. They themselves were in no condition to turn their great ship around and guide it through the whole anxious voyage once more. They respectfully advised Tom to excuse himself. He was very glad to do it, though a small shadow of disappointment crossed Lady Jane's face when the splendid young gentleman was refused entry.
        - id: ch01-b38
          speaker: narrator
          text: >-
            A waiting silence followed, and Tom did not understand it. He glanced at Hertford. Hertford gave him a sign, but Tom did not understand that either. As usual, Elizabeth came gracefully to his rescue. She bowed and spoke.
        - id: ch01-b39
          speaker: lady_elizabeth
          text: >-
            May we have our brother the prince's permission to leave?
        - id: ch01-b40
          speaker: tom_canty
          text: >-
            Your ladyships may have anything of mine merely by asking. Yet I would rather give you anything else within my poor power than give you leave to take the light and blessing of your presence away. Good evening, and may God be with you both!
        - id: ch01-b41
          speaker: narrator
          text: >-
            Tom smiled inwardly. All that reading about princes had not been wasted after all. It had taught his tongue a little of their rich and gracious way of speaking.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Once the noble young ladies had gone, Tom turned wearily to the two men guarding him.
        - id: ch01-b43
          speaker: tom_canty
          text: >-
            Would your lordships please allow me to go somewhere quiet and rest?
        - id: ch01-b44
          speaker: earl_of_hertford
          text: >-
            If that pleases your highness, you have only to command and we must obey. You do need to rest, for before long you must travel into the city.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Hertford rang a bell. When a page appeared, he ordered the boy to fetch Sir William Herbert. The gentleman arrived at once and led Tom into a private room.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Tom's first act was to reach for a cup of water. Before he could take it, a servant dressed in silk and velvet snatched it up, dropped to one knee, and presented it on a golden tray.
        - id: ch01-b47
          speaker: narrator
          text: >-
            The tired prisoner sat down and began to remove his boots, looking around timidly for permission. Another silk-and-velvet nuisance sank to his knees and did the job for him. Tom tried two or three more times to do small things for himself. Each time, someone rushed ahead of him. At last, he gave up with a sigh and muttered under his breath.
        - id: ch01-b48
          speaker: tom_canty
          text: >-
            Upon my word, I wonder they do not insist on breathing for me too!
        - id: ch01-b49
          speaker: narrator
          text: >-
            They put slippers on him, wrapped him in a magnificent robe, and finally let him lie down to rest. But he could not sleep. His head held too many thoughts, and the room held too many people. He could not dismiss the thoughts, so they stayed. He did not know enough about being a prince to dismiss the people, so they stayed in the room too. Tom deeply regretted their presence, and the attendants were no happier about having to remain.
        - id: ch01-b50
          speaker: narrator
          text: >-
            After Tom left, his two noble guardians were alone. For a while, they paced the floor, shook their heads, and thought. Then Lord St. John asked the question directly.
        - id: ch01-b51
          speaker: lord_st_john
          text: >-
            Tell me plainly. What do you think?
        - id: ch01-b52
          speaker: earl_of_hertford
          text: >-
            Plainly, I think this. The King is near death, and my nephew is mad. A mad prince will take the throne and remain mad. God protect England, for England will need His protection!
        - id: ch01-b53
          speaker: lord_st_john
          text: >-
            Yes, it certainly appears so. But have you never wondered whether... whether...
        - id: ch01-b54
          speaker: narrator
          text: >-
            St. John hesitated and stopped. He knew he was stepping onto dangerous ground. Hertford came to a halt in front of him and looked straight into his face.
        - id: ch01-b55
          speaker: earl_of_hertford
          text: >-
            Go on. No one can hear you but me. What is it that troubles you?
        - id: ch01-b56
          speaker: lord_st_john
          text: >-
            I hate to put the thought into words when he is so close to you by blood, my lord. Forgive me if I offend you, but is it not strange that madness could change his bearing and his manners so greatly? He still looks and speaks like a prince, yet little things differ from all his former habits.
        - id: ch01-b57
          speaker: lord_st_john
          text: >-
            Is it not strange that madness has made him forget his own father's face? He has forgotten the customs and honors that belong to him. He still knows Latin, yet his Greek and French are gone. Please do not take offense. Set my mind at ease, and I will be grateful. I cannot forget that he said he was not the prince, and so—
        - id: ch01-b58
          speaker: earl_of_hertford
          text: >-
            Silence, my lord! You are speaking treason. Have you forgotten the King's command? If I stand here and listen, I share your crime.
          emotion: angry
        - id: ch01-b59
          speaker: narrator
          text: >-
            St. John turned pale and hurried to take back his words.
        - id: ch01-b60
          speaker: lord_st_john
          text: >-
            I was wrong, and I admit it. Please do not betray me. Grant me that kindness, and I will never think or speak of this again. Do not deal harshly with me, sir, or I am ruined.
          emotion: fearful
        - id: ch01-b61
          speaker: earl_of_hertford
          text: >-
            Very well, my lord. If you never repeat the offense here or where others may hear, it will be as though you said nothing. But there is no reason for doubt. He is my sister's son. I have known his voice, face, and body since he was a baby. Madness can cause every strange contradiction we see in him, and stranger things besides.
        - id: ch01-b62
          speaker: earl_of_hertford
          text: >-
            Do you not remember old Baron Marley? When he went mad, he forgot the face he had seen in the mirror for sixty years and thought it belonged to another man. He even claimed to be the son of Mary Magdalene and said his head was made of Spanish glass. He would let no one touch it, for fear a careless hand might shatter it.
        - id: ch01-b63
          speaker: earl_of_hertford
          text: >-
            Put your doubts aside, my good lord. This is the true prince. I know him well, and soon he will be your king. You would do wisely to remember that and give it more thought than your other suspicion.
        - id: ch01-b64
          speaker: narrator
          text: >-
            They talked a little longer. Lord St. John tried as well as he could to cover his mistake. Again and again, he declared that his faith in the prince was now firmly grounded and that no doubt could ever shake it. At last, Hertford relieved his fellow guardian and sat down to keep watch over Tom alone.
        - id: ch01-b65
          speaker: narrator
          text: >-
            He soon sank deep into thought. The longer he thought, the more troubled he became. Before long, he rose and began pacing the floor, muttering to himself.
        - id: ch01-b66
          speaker: earl_of_hertford
          text: >-
            Nonsense, he must be the prince! Would anyone in all England believe that two boys, with different blood and different parents, could look so perfectly alike? And even if that miracle happened, would chance then put each boy in the other's place? No. It is foolish, foolish, foolish!
        - id: ch01-b67
          speaker: narrator
          text: >-
            A little later, another thought came to him.
        - id: ch01-b68
          speaker: earl_of_hertford
          text: >-
            Now, if he were an impostor and called himself the prince, that would be natural. That would make sense. But has any impostor ever been called prince by the King, the court, and everyone around him, only to deny the rank and beg not to be raised so high? No! By the soul of Saint Swithin, no! This is the true prince, gone mad!
