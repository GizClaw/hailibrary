audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    tom_canty:
      display_name: 汤姆·康第
      tts:
        delivery: 诚恳谦卑，容易受惊，情急时带着孩子气
        timbre: 清亮稚嫩
        pace: 稍快
        pitch: 中高
    lord_hertford:
      display_name: 赫特福德勋爵
      tts:
        delivery: 谨慎守礼，服从中带着分寸
        timbre: 沉稳成熟
        pace: 中等
        pitch: 中低
    lord_st_john:
      display_name: 圣约翰勋爵
      tts:
        delivery: 圆熟谨慎，言谈始终带着宫廷礼数
        timbre: 平稳成熟
        pace: 中等
        pitch: 中等
    lady_elizabeth:
      display_name: 伊丽莎白小姐
      tts:
        delivery: 从容机敏，亲切中不失王室仪态
        timbre: 清澈柔和
        pace: 中等
        pitch: 中高
    lady_jane_grey:
      display_name: 简·格雷小姐
      tts:
        delivery: 温柔端庄，真挚而敏感
        timbre: 明亮柔和
        pace: 中等
        pitch: 中高
  chapters:
    - id: ch01
      title: 国王的训令
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 汤姆被带进一套华贵房间的正厅。有人请他坐下，可四周站着的不是长者，就是身份显赫的贵族，他怎么也不肯独自落座。他请大家一同坐下，众人只是躬身道谢，仍旧站着。汤姆正想再劝，赫特福德伯爵凑到他耳边提醒他。
        - id: ch01-b02
          speaker: lord_hertford
          text: 殿下，别再劝了。依照礼制，他们不能在您面前坐下。
        - id: ch01-b03
          speaker: narrator
          text: 随后，侍从通报圣约翰勋爵觐见。圣约翰进来行过礼，说明自己奉国王之命而来。
        - id: ch01-b04
          speaker: lord_st_john
          text: 臣有一件事要私下禀告。请殿下让这里的人都退下，只留下赫特福德伯爵。
        - id: ch01-b05
          speaker: narrator
          text: 汤姆显然不知道该怎么遣退众人。赫特福德悄声告诉他，只要挥挥手就行，不想说话也不要紧。等侍立的贵族全都退出去，圣约翰才传达国王的训令。
        - id: ch01-b06
          speaker: lord_st_john
          text: 国王陛下有令。为了国家大事，在殿下康复以前，您必须尽力掩饰病情。无论谁问起，都不可否认自己是真正的王子，是英格兰王位的继承人。您要维护王子的尊严，也要照旧接受众人的敬礼与服侍，不能出言拒绝，也不能显出抗拒。
        - id: ch01-b07
          speaker: lord_st_john
          text: 从今以后，也不要再向任何人提起那种卑微的出身和生活。国王认定，那些都是心神劳损以后生出的幻念。您要努力认出从前熟悉的人。实在想不起来，就保持沉默，千万别让脸上的惊讶泄露了这件事。
        - id: ch01-b08
          speaker: lord_st_john
          text: 遇到国家典礼，要是不知道该说什么、做什么，也不能当着众人的面慌乱。请向赫特福德勋爵或臣本人问策。国王命我们随时守在近旁，直到他撤回命令。陛下向您致意，还祈求上帝早日治好您，从今往后永远护佑您。
        - id: ch01-b09
          speaker: narrator
          text: 圣约翰行了一礼，退到旁边。汤姆明白，自己已经没有别的路可走，只得认命。
        - id: ch01-b10
          speaker: tom_canty
          text: 国王既然已经下令，谁也不能讨价还价，更不能因为自己不舒服，就拿借口把命令改得顺心。国王的旨意，我会遵行。
        - id: ch01-b11
          speaker: narrator
          text: 赫特福德接着提起，国王已经叫人撤去书本和一切严肃功课。眼下，汤姆不妨做些轻松的消遣，免得赴宴以前太过劳累。
        - id: ch01-b12
          speaker: lord_hertford
          text: 殿下先放松一会儿吧。若是累着去赴宴，恐怕会伤了身体。
        - id: ch01-b13
          speaker: narrator
          text: 汤姆听得满脸疑惑。可一看圣约翰悲伤地望着自己，他马上想起国王的训令，羞得红了脸。
        - id: ch01-b14
          speaker: lord_st_john
          text: 您的记忆还在跟您为难，所以方才露出了惊讶。不过别担心，病情好转以后，这些都会过去。赫特福德勋爵说的是伦敦城的宴会。国王两个月前就答应让您参加。现在想起来了吗？
        - id: ch01-b15
          speaker: tom_canty
          text: 我很惭愧。这件事，我确实全忘了。
        - id: ch01-b16
          speaker: narrator
          text: 汤姆说得迟疑，脸也更红了。就在这时，侍从通报伊丽莎白小姐和简·格雷小姐到来。两位勋爵互相看了一眼，赫特福德赶紧迎向门口。两个少女经过身旁时，他低声叮嘱她们。
        - id: ch01-b17
          speaker: lord_hertford
          text: 两位小姐，请别留意殿下那些反常的举动。他记不起事情时，也请别吃惊。你们会发现，他现在连小事都很难想起来。
        - id: ch01-b18
          speaker: narrator
          text: 另一边，圣约翰也抓紧最后一点时间，在汤姆耳边重复国王的意思。
        - id: ch01-b19
          speaker: lord_st_john
          text: 殿下，请牢牢记住国王的心愿。能想起来的就尽量回想，其余的全要装作记得。别让两位旧日玩伴看出您变了。她们一向真心爱戴您，知道得越多，只会越难过。要臣和您的舅父都留下来吗？
        - id: ch01-b20
          speaker: narrator
          text: 汤姆用一个手势和一声低低的答应表示同意。他已经开始懂得宫里的规矩，也真心打定主意，要按照国王的命令，尽力扮好这个身份。
    - id: ch02
      title: 两位小姐来访
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 众人虽然处处小心，几个年轻人的谈话还是不时变得尴尬。汤姆好几次差点撑不下去，险些承认自己根本担不起这个可怕的角色。幸好伊丽莎白公主机敏，总能及时解围。两位勋爵也时时警醒，常像无意似的插进一句话，把危险带过去。
        - id: ch02-b02
          speaker: narrator
          text: 有一回，小简忽然转向汤姆，问起一件他毫无准备的事。
        - id: ch02-b03
          speaker: lady_jane_grey
          text: 殿下今天去向王后陛下问安了吗？
        - id: ch02-b04
          speaker: narrator
          text: 汤姆迟疑着，神情十分窘迫。他正要随口结巴几句，圣约翰已经从容地替他接过话头。这样的微妙难题，宫廷里的老手随时都有办法应付。
        - id: ch02-b05
          speaker: lord_st_john
          text: 殿下当然去过，小姐。王后还谈到国王的病情，给了殿下许多安慰。是不是这样，殿下？
        - id: ch02-b06
          speaker: narrator
          text: 汤姆含糊地应了一声，心里却清楚，自己刚刚走过一片危险的地方。后来，有人提到他暂时不必再读书，小简马上觉得十分可惜。
        - id: ch02-b07
          speaker: lady_jane_grey
          text: 真可惜！殿下原来学得那么好。不过请耐心等一等，不会很久的。以后您一定会像父王一样学识渊博，也能说很多种语言。
        - id: ch02-b08
          speaker: tom_canty
          text: 我的父亲？我敢说，除了猪圈里的猪，谁也听不懂他讲的本国语言。至于什么学问，他更是……
        - id: ch02-b09
          speaker: narrator
          text: 汤姆说到一半，忽然看见圣约翰眼里严肃的警告。他马上住口，脸涨得通红，声音也低了下来。
        - id: ch02-b10
          speaker: tom_canty
          text: 唉，我的病又发作了，脑子也糊涂了。我绝没有不敬国王陛下的意思。
          emotion: sad
        - id: ch02-b11
          speaker: narrator
          text: 伊丽莎白恭敬又亲昵地把这位“哥哥”的手合在自己双掌之间，柔声安慰他。
        - id: ch02-b12
          speaker: lady_elizabeth
          text: 我们都知道，殿下。别为这件事难过。这不是您的错，是疾病在作怪。
          emotion: calm
        - id: ch02-b13
          speaker: tom_canty
          text: 善良的小姐，你真会安慰人。请容我冒昧说一句，我打心底里感谢你。
        - id: ch02-b14
          speaker: narrator
          text: 又有一次，活泼的小简突然说了一句简单的希腊语，像朝汤姆射去一支箭。伊丽莎白一看汤姆那张平静而茫然的脸，就知道箭已经越过了靶子。她不慌不忙，替他用一串响亮的希腊语回敬过去，随即把话题带到了别处。
        - id: ch02-b15
          speaker: narrator
          text: 总的说来，这段时间过得还算愉快顺利。航道里的暗礁和沙洲越来越少。汤姆也看出来了，每个人都真心帮他，还愿意宽容他的错误，他便慢慢自在起来。
        - id: ch02-b16
          speaker: narrator
          text: 后来，他听说两位小姐晚上也要去市长的宴会，一颗心顿时因为轻松和喜悦跳了起来。有她们陪着，他在那么多陌生人中间就不再孤单。可就在一个钟头前，他若听说她们要同行，只怕还会吓得受不了。
        - id: ch02-b17
          speaker: narrator
          text: 两位勋爵可没有这样轻松。他们像在危险水道里驾驶一艘大船，时时刻刻都得警醒，这差事一点也不像儿戏。等两位小姐快要告辞时，侍从又通报吉尔福德·达德利勋爵求见。两个监护人觉得汤姆今天已经够累了，自己也没力气把这场提心吊胆的航程再走一遍，便劝他谢绝会面。
        - id: ch02-b18
          speaker: narrator
          text: 汤姆当然求之不得。不过，那位风采出众的少年没能进门时，小简脸上似乎闪过一丝失望。
        - id: ch02-b19
          speaker: narrator
          text: 屋里忽然静下来。大家像是在等什么，汤姆却不明白。他看向赫特福德，勋爵朝他使了个眼色，他仍旧没看懂。还是伊丽莎白从容地替他解了围。她行过礼，开口请示。
        - id: ch02-b20
          speaker: lady_elizabeth
          text: 王子殿下，我的哥哥，我们可以告退了吗？
        - id: ch02-b21
          speaker: tom_canty
          text: 两位小姐无论向我求什么，我都会答应。只是我宁愿把自己办得到的任何别的东西送给你们，也不愿准许你们带走这里的光明与福泽。两位晚安，愿上帝与你们同在！
        - id: ch02-b22
          speaker: narrator
          text: 说完这番华丽的话，汤姆心里暗暗得意。看来，他从书里跟王公贵族相处那么久，果然没有白费。至少，他的舌头也学会了一点高雅的宫廷辞令。
    - id: ch03
      title: 华服仆人的服侍
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两位尊贵的少女离开以后，汤姆疲倦地转向监护他的勋爵。
        - id: ch03-b02
          speaker: tom_canty
          text: 两位勋爵可否准许我找个角落歇一歇？
        - id: ch03-b03
          speaker: lord_hertford
          text: 殿下只管吩咐，我们自然服从。您确实该休息一会儿，因为不久以后就要动身进城。
        - id: ch03-b04
          speaker: narrator
          text: 赫特福德按了一下铃，叫侍童去请威廉·赫伯特爵士。爵士很快赶来，把汤姆领进里面一间屋子。汤姆刚伸手去拿水杯，一个满身绸缎天鹅绒的仆人就抢先取过杯子，单膝跪下，用金托盘呈给他。
        - id: ch03-b05
          speaker: narrator
          text: 疲倦的囚徒接着坐下来，想亲手脱掉短靴，还怯生生地拿眼睛询问行不行。另一个穿着绸缎天鹅绒、专叫人不自在的家伙立刻跪下，替他脱了靴子。汤姆又试了两三次，想自己照料自己，每回都有人抢在前头。
        - id: ch03-b06
          speaker: narrator
          text: 他终于认命，叹了一口气，小声抱怨起来。
        - id: ch03-b07
          speaker: tom_canty
          text: 真见鬼，他们怎么不连气也替我喘了！
        - id: ch03-b08
          speaker: narrator
          text: 仆人给他换上便鞋，披好华贵的长袍。汤姆总算躺下了，却根本睡不着。他脑子里挤满念头，屋里也挤满了人。念头赶不走，只能留下。那些人，他又不知道可以遣退，也只能留下。这叫汤姆万分懊恼，而那些仆人自己大概也一样。
    - id: ch04
      title: 危险的怀疑
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 汤姆走后，两位尊贵的监护人独自留在正厅。他们沉思了一阵，一边摇头，一边来回踱步。最后，圣约翰先开了口。
        - id: ch04-b02
          speaker: lord_st_john
          text: 老实说，你到底怎么想？
        - id: ch04-b03
          speaker: lord_hertford
          text: 既然要听实话，那就是这样。国王大限将至，我的外甥又疯了。他会带着疯病登上王位，也会一直疯下去。愿上帝保佑英格兰吧，以后她少不了上帝的保佑！
        - id: ch04-b04
          speaker: lord_st_john
          text: 看来确实如此。不过……你难道从没怀疑过……怀疑……
        - id: ch04-b05
          speaker: narrator
          text: 圣约翰犹豫着，终于停了下来。他很清楚，自己正踏进一块危险的地方。赫特福德走到他面前，用坦荡而清醒的目光看着他。
        - id: ch04-b06
          speaker: lord_hertford
          text: 说下去。这里只有我一个人听见。你怀疑什么？
        - id: ch04-b07
          speaker: lord_st_john
          text: 你和殿下血缘这样亲近，我实在不愿把心里的话说出来。若有冒犯，请你宽恕。可是，疯病真能把一个人的仪态举止改变得这样厉害吗？他的言谈和模样仍然像王子，可许多小地方都跟从前不同。
        - id: ch04-b08
          speaker: lord_st_john
          text: 疯病怎么会让他忘了亲生父亲的容貌，忘了身边的人该怎样依礼服侍他？又怎么会只留下拉丁语，偏偏夺走他的希腊语和法语？请别见怪，只求你替我消除心里的不安。殿下说自己不是王子，这句话一直缠着我，所以……
        - id: ch04-b09
          speaker: lord_hertford
          text: 住口！你说的是叛国之言。难道忘了国王的命令？我只要继续听下去，就成了你的同谋。
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: 圣约翰的脸一下白了，连忙认错求饶。
        - id: ch04-b11
          speaker: lord_st_john
          text: 是我错了，我承认。请看在情面上饶恕我，千万别告发。从今以后，我不再想这件事，也绝不再提。请别严厉处置我，否则我就毁了。
          emotion: fearful
        - id: ch04-b12
          speaker: lord_hertford
          text: 我答应你。只要你不再犯，无论在这里还是在别人面前，我都当你没说过。不过，你根本不必怀疑。他是我姐姐的儿子。从他还在襁褓里起，他的声音、面孔和身形，我哪一样不熟悉？疯病能叫人做出你看见的这些怪事，还能做出更多。
        - id: ch04-b13
          speaker: lord_hertford
          text: 你还记得老马利男爵吗？他发疯以后，忘了自己看了六十年的那张脸，认定镜子里是别人。他还说自己是抹大拉的马利亚之子，脑袋是西班牙玻璃做的。谁也不许碰他的头，生怕哪只冒失的手把它打碎。
        - id: ch04-b14
          speaker: lord_hertford
          text: 所以，把疑虑放下吧。这就是真正的王子，我再熟悉不过。再过不久，他就是你的国王。你最好记牢这一点，多想这个，少想别的。
        - id: ch04-b15
          speaker: narrator
          text: 两人又谈了一阵。圣约翰竭力遮掩刚才的过失，一再保证自己如今已经深信不疑，再也不会让疑念动摇。赫特福德这才让他退下，独自留下来看守汤姆。
    - id: ch05
      title: 赫特福德说服自己
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 赫特福德很快陷入沉思。显然，他越想越烦恼。没过多久，他便在屋里来回踱步，嘴里不停地嘀咕。
        - id: ch05-b02
          speaker: lord_hertford
          text: 哼，他一定是王子！难道整个英格兰真会有人说，两个毫无血缘、出身完全不同的人，竟然能长得像孪生兄弟？就算真有这种事，命运又偏偏让他们交换了身份，那不是更离奇的奇迹吗？不，这全是蠢话，蠢话，蠢话！
        - id: ch05-b03
          speaker: narrator
          text: 过了一会儿，他又换了一个方向，继续说服自己。
        - id: ch05-b04
          speaker: lord_hertford
          text: 假如他是冒牌货，却自称王子，那才合乎常情，也讲得通。可是古往今来，哪有这样的冒牌货？国王叫他王子，宫廷叫他王子，人人都叫他王子，他反倒否认自己的尊位，一心不让别人抬举他？没有！凭圣斯威辛的灵魂起誓，绝没有！这就是真王子，只不过疯了！
