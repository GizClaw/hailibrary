audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    tom_canty:
      display_name: 汤姆·康第
      tts:
        delivery: 诚恳谦卑，容易受惊，情急时带着孩子气
        timbre: 清亮稚嫩
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第七章　汤姆的第一顿皇家午宴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 下午一点刚过，汤姆又得任人摆布，穿戴整齐去吃午饭。从颈上的轮状皱领到脚上的长袜，这回全换了新花样。不过每一件衣服，都跟先前一样华丽。
        - id: ch01-b02
          speaker: narrator
          text: 一队人前呼后拥，把他送进一间宽敞华美的大厅。桌子已经摆好，只等他一个人入席。桌上的器具全是厚重的纯金，上面还有本韦努托亲手做出的精美图案，几乎件件都是无价之宝。出身高贵的侍从站了满屋，占去一半地方。
        - id: ch01-b03
          speaker: narrator
          text: 宫廷牧师做完餐前祷告，汤姆马上就要开吃。对他来说，肚子饿早就是家常便饭了。可伯克利伯爵先走过来，替他把餐巾系在颈上。别看只是系一块餐巾，这可是威尔士亲王府的显赫职位，而且由伯爵一家世代承袭。
        - id: ch01-b04
          speaker: narrator
          text: 侍酒官也守在旁边。汤姆每次想自己倒酒，他都抢先把杯子斟满。威尔士亲王的尝膳官同样来了。哪道菜只要有一点可疑，他便得先吃一口，冒着中毒的危险替王子试菜。
        - id: ch01-b05
          speaker: narrator
          text: 到汤姆这个时候，尝膳官多半只是个好看的摆设，很少真要拿命办差。可往前数不了几代，这还是个危险的职位，绝不是什么值得眼馋的荣耀。王室为什么不用一条狗，或是一个铅管工来试毒呢？这确实奇怪。不过，王室的规矩，哪一样不奇怪？
        - id: ch01-b06
          speaker: narrator
          text: 内廷首席侍从达西勋爵也来了。天知道他来做什么，反正有他站在那里就够了。汤姆椅背后还站着宫廷总管，专门盯着这顿庄严的午宴。他的上司宫内大臣和御膳总管就在附近。除去这些人，汤姆另有三百八十四名仆役。当然，他们没有全挤进大厅，连四分之一也没来。而汤姆呢，还根本不知道自己有这么多仆人。
        - id: ch01-b07
          speaker: narrator
          text: 就在刚才那一个钟头里，在场众人都受过仔细训示。王子只是一时神志失常，不管他做出什么怪事，谁都不许露出惊讶。没多久，那些“怪事”便一件件上演了。大家却笑不出来，只觉得怜悯又难过。敬爱的王子落到这般境地，实在叫他们心痛。
        - id: ch01-b08
          speaker: narrator
          text: 可怜的汤姆吃东西时，多半直接伸手去抓。没有人笑，甚至没有人显出自己看见了。他倒对颈上的餐巾很感兴趣，仔细看了又看。那料子又精巧又漂亮，他真怕糟蹋了，便老老实实地开口。
        - id: ch01-b09
          speaker: tom_canty
          text: 劳驾，把这块餐巾拿走吧。我一不留神，怕会把它弄脏。
        - id: ch01-b10
          speaker: narrator
          text: 世袭餐巾官恭恭敬敬地取走餐巾，什么也没说，更没有表示反对。
        - id: ch01-b11
          speaker: narrator
          text: 接着，汤姆盯上了芜菁和莴苣。他问这是什么，还问能不能吃。因为英国人直到不久前才开始自己种这些菜，从前都把它们当作奢侈品，从荷兰运来。侍从们一本正经地答了话，脸上一点惊讶也没有。
        - id: ch01-b12
          speaker: narrator
          text: 甜点吃完以后，汤姆往衣袋里塞满了坚果。众人依旧装作没看见。可他自己很快慌了起来。整顿饭里，别人只准他亲手做这一件事。他越想越觉得，自己准是做了什么极不得体、极不像王子的事。
        - id: ch01-b13
          speaker: narrator
          text: 偏在这时，汤姆的鼻子开始抽动，鼻尖一翘一皱，越来越痒。他求助似的望望这个勋爵，又望望那个勋爵，眼泪都快出来了。众人吓得一齐赶上前，连声问他究竟哪里不舒服。
        - id: ch01-b14
          speaker: tom_canty
          text: 请诸位原谅，我的鼻子痒得太厉害了。宫里遇到这种事，照规矩应该怎么办？求你们快一点，我真的忍不了多久了。
        - id: ch01-b15
          speaker: narrator
          text: 没有一个人发笑。勋爵们全都为难极了，只能忧心忡忡地互相望着，等别人拿主意。可整部英国史都没说过，眼前这堵死墙应该怎样翻过去。司礼官又偏偏不在。谁也不敢独自驶进这片陌生海域，更不敢冒险解答如此庄严的问题。唉，宫里就是没有一位“世袭挠痒官”！
        - id: ch01-b16
          speaker: narrator
          text: 汤姆的泪水已经滚过双颊，抽动的鼻子还在拼命求救。终于，人的天性冲破了宫廷礼法。汤姆在心里向上帝祷告，要是自己做错了，求上帝宽恕。接着，他伸手挠了挠鼻子。满朝上下那一颗颗悬着的心，总算全放下了。
        - id: ch01-b17
          speaker: narrator
          text: 午宴结束，一位勋爵捧来宽而浅的金盘，盘里盛着芬芳的玫瑰水，本是让汤姆洗嘴和手指的。世袭餐巾官也拿着餐巾等在一旁。汤姆困惑地看了金盘一会儿，竟把它举到唇边，郑重地喝了一口，随后才交还给那位勋爵。
        - id: ch01-b18
          speaker: tom_canty
          text: 不成，大人，我不大喜欢。味道倒是挺香，可惜一点酒劲也没有。
        - id: ch01-b19
          speaker: narrator
          text: 大家认定，王子混乱的神智又添了一桩怪事，一个个更加心痛。可这么伤感的情形，还是没有逗笑任何人。
        - id: ch01-b20
          speaker: narrator
          text: 汤姆接着又犯了一个自己毫不知情的错。宫廷牧师已经站到椅背后，举起双手，闭着眼仰起脸，正要做餐后祝祷，他却恰好起身走了。依然没有人显出王子做了什么反常的事。
        - id: ch01-b21
          speaker: narrator
          text: 按照汤姆自己的请求，侍从把他带到私人书斋，让他独自待着。橡木护墙板的挂钩上，分件挂着一套闪亮的钢甲。每一件甲胄都有精美图案，上面巧妙地嵌着黄金。这身盔甲属于真正的王子，是帕尔王后不久前送来的礼物。
        - id: ch01-b22
          speaker: narrator
          text: 汤姆穿上护胫和铁手套，又戴起插着羽饰的头盔。凡是不用人帮忙就能穿的，他全都试了一遍。他本想叫人进来，把剩下的甲胄也穿齐，可忽然想起衣袋里的坚果。
        - id: ch01-b23
          speaker: narrator
          text: 要是没人围着看，也没有那些显赫的世袭官员追着提供他不想要的服侍，他就能痛痛快快吃坚果了。于是，汤姆把漂亮的甲胄一件件放回原处，马上剥起坚果。自从上帝为了惩罚他的罪过、把他变成王子以后，他第一次觉得几乎像平常一样快活。
        - id: ch01-b24
          speaker: narrator
          text: 坚果吃光后，他又在壁橱里发现几本很诱人的书。其中一本专门讲英国宫廷礼仪，这可真是如获至宝。汤姆躺到奢华的长榻上，认认真真地读起来。
        - id: ch01-b25
          speaker: narrator
          text: 眼下，就让我们把他留在那里吧。
