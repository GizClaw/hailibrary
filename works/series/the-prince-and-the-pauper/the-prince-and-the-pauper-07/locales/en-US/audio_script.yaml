audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently ironic
        timbre: clear and resonant
        pace: measured
        pitch: medium
    tom_canty:
      display_name: Tom Canty
      tts:
        delivery: earnest, courteous, and plainly spoken
        timbre: light and youthful
        pace: moderate
        pitch: medium-high
  chapters:
    - id: ch01
      title: Tom's first royal dinner.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A little after one that afternoon, Tom gave in and let the servants dress him for dinner. His clothes were every bit as fine as before, but now every piece was different, from the ruff at his neck to the stockings on his feet.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Then he was led with great ceremony into a large, richly decorated room. A table had been laid for one. Its heavy gold furnishings were covered in designs by Benvenuto, so beautiful that they were almost beyond price. Noble servants filled half the room.
        - id: ch01-b03
          speaker: narrator
          text: >-
            A chaplain said grace, and Tom was ready to start at once. Being hungry was nothing new to him. But the Earl of Berkeley stopped him long enough to fasten a napkin around his neck. This was not merely a servant's task. The nobleman's family had inherited the grand office of Diaperer to the Prince of Wales, so the duty passed from one generation to the next.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Tom's cupbearer stood ready too, pouring the wine before Tom could reach for it himself. The prince's Taster was there in case any dish seemed suspicious. If called upon, he would taste it and take the chance of being poisoned. By Tom's time the post was mostly for show, and the Taster rarely had to do his duty. A few generations earlier, though, it had been a dangerous honor.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Why they did not use a dog or a plumber may seem strange, but all the ways of royalty are strange. Lord d'Arcy, the First Groom of the Chamber, was there as well. What he was meant to do, goodness knows. It is enough to say that he was there.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Behind Tom's chair stood the Lord Chief Butler, watching over the solemn meal. He took his orders from the Lord Great Steward and the Lord Head Cook, who stood nearby. Besides these men, Tom had three hundred and eighty-four servants. Of course, they were not all in that room, nor even a quarter of them. Tom did not yet know that most of them existed.
        - id: ch01-b07
          speaker: narrator
          text: >-
            During the past hour, everyone present had been carefully warned that the prince had lost his reason for a time. Whatever strange thing he did, they must show no surprise. His odd behavior soon began, but no one found it funny. They felt only pity and sorrow at seeing their beloved prince in such a state.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Poor Tom ate mostly with his fingers. Not one servant smiled or even seemed to notice. He studied the napkin with great interest because the cloth was so fine and lovely. Then, in all simplicity, he spoke to the Diaperer.
        - id: ch01-b09
          speaker: tom_canty
          text: >-
            Please take this away. If I am not careful, I may soil it.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The Hereditary Diaperer removed it with a respectful bow. He offered neither a word nor an objection.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Tom looked closely at the turnips and lettuce. He asked what they were and whether people ate them. Only recently had English farmers begun growing such things instead of bringing them over from Holland as costly luxuries. The servants answered him with grave respect and showed no surprise.
        - id: ch01-b12
          speaker: narrator
          text: >-
            After dessert, Tom filled his pockets with nuts. Again, everyone acted as if they had seen nothing. A moment later, however, Tom began to worry. This was the only thing he had been allowed to do for himself through the whole meal. He felt sure he must have done something terribly improper and unprincely.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Just then, his nose began to twitch. Its tip lifted and wrinkled, and his discomfort kept growing. Tom looked from one lord to another, pleading for help, until tears gathered in his eyes. The lords rushed forward in alarm and begged him to tell them what was wrong.
        - id: ch01-b14
          speaker: tom_canty
          text: >-
            Forgive me, but my nose itches cruelly. What am I supposed to do when this happens? Please, be quick. I cannot bear it much longer.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Nobody smiled. Instead, the lords stared at one another in deep distress, each waiting for someone else to advise them. English history offered no answer to this solemn problem. The Master of Ceremonies was absent, and no one dared sail into such unknown waters alone. Alas, there was no Hereditary Scratcher.
        - id: ch01-b16
          speaker: narrator
          text: >-
            By now, tears were running down Tom's cheeks, and his twitching nose demanded relief more urgently than ever. At last, nature broke through the walls of royal manners. Tom silently prayed for forgiveness in case he was doing wrong. Then, to the great relief of his burdened court, he scratched his nose himself.
        - id: ch01-b17
          speaker: narrator
          text: >-
            When the meal ended, a lord held out a broad, shallow gold dish filled with fragrant rosewater. It was meant for Tom to rinse his mouth and fingers. The Hereditary Diaperer waited beside it with another napkin. Tom puzzled over the dish for a moment. Then he raised it to his lips and took a solemn drink before handing it back.
        - id: ch01-b18
          speaker: tom_canty
          text: >-
            No, my lord, I do not care for it. The flavor is pleasant, but the drink is far too weak.
        - id: ch01-b19
          speaker: narrator
          text: >-
            This new sign of the prince's troubled mind made every heart around him ache. Still, no one laughed.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Tom made his next mistake without knowing it. He rose and left the table just as the chaplain stepped behind his chair to begin the blessing. The chaplain's hands were raised, and so were his closed eyes. Yet nobody appeared to notice that the prince had done anything unusual.
        - id: ch01-b21
          speaker: narrator
          text: >-
            At Tom's request, the servants took him to his private cabinet and left him to do as he pleased. A shining suit of steel armor hung in pieces from hooks on the oak-paneled wall. Every piece was beautifully decorated with patterns inlaid in gold. The armor belonged to the real prince and had recently been given to him by Queen Parr.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Tom put on the leg armor, the metal gloves, the plumed helmet, and every other piece he could manage without help. For a while, he thought of calling someone to finish dressing him. Then he remembered the nuts in his pockets. How good it would be to eat them with no crowd watching and no grand hereditary officers bothering him with services he did not want.
        - id: ch01-b23
          speaker: narrator
          text: >-
            So Tom returned the beautiful pieces to their hooks and began cracking nuts. For the first time since God had punished him by making him a prince, he felt almost naturally happy.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Once the nuts were gone, he found some inviting books in a cupboard. One of them explained the rules and ceremonies of the English court. What a rare treasure that was. Tom stretched out on a luxurious couch and began studying it with honest determination.
        - id: ch01-b25
          speaker: narrator
          text: >-
            We will leave him there for now.
