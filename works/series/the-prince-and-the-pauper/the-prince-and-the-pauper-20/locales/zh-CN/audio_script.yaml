audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华亲王
      tts:
        delivery: 高贵坚定，受辱时仍保持尊严
        timbre: 清亮稚嫩
        pace: 从容有力
        pitch: 中高
    hermit:
      display_name: 隐士
      tts:
        delivery: 神秘多变，在狂热与慈和之间骤然转换
        timbre: 低沉苍老，略带沙哑
        pace: 时而急促，时而缓慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 暮色森林中的灯火
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 高高的树篱挡住了身后的屋子。国王吓得拼尽全力，朝远处的树林奔去。快到林边时，他回头看见两个模糊的人影，再也不敢多看，只顾往树林深处跑。直到四周全是昏暗的树影，他才停下来，觉得自己总算安全了一些。
        - id: ch01-b02
          speaker: narrator
          text: 他屏住呼吸，竭力捕捉四周的动静。林中静得又深又沉，甚至显得庄严可怕，压得人心里发慌。隔上很久，远处才传来一点空洞而神秘的声音，仿佛不是活人发出的，而是亡魂在幽幽呻吟、低声哀叹。那声音偶尔划破寂静，听起来反而比寂静更加凄凉。
        - id: ch01-b03
          speaker: narrator
          text: 国王本想躲在这里，等这一天过去。可他满身是汗，很快就冷得发抖，只好继续走，好让身体暖起来。他认准一个方向，径直穿过森林，盼着不久便能找到一条路。谁知这个愿望落了空。他走了又走，越往前，树木似乎越密。
        - id: ch01-b04
          speaker: narrator
          text: 天色越来越暗。国王想到自己也许得在这阴森的地方过夜，不禁打了个寒战。他急着加快脚步，却因为看不清脚下，走得更加艰难。树根一次次绊住他，藤蔓和荆棘也不停地缠上来。
        - id: ch01-b05
          speaker: narrator
          text: 就在这时，远处出现了一线微光。国王又惊又喜，却不敢贸然靠近。他走走停停，一边察看四周，一边细听动静。光从一间破旧小屋的窗口透出来，那窗口连玻璃也没有。他听见屋里有人说话，刚想逃开，便听出那个人正在祈祷。
        - id: ch01-b06
          speaker: narrator
          text: 他悄悄来到窗前，踮起脚往里看。屋里很小，泥地已经踩得又平又硬。角落里有灯芯草铺成的床和几条破毯子，旁边放着水桶、杯子、面盆，还有几口锅。屋里只有一条短凳和一只三脚凳，壁炉中的柴火只剩下暗红的余烬。
        - id: ch01-b07
          speaker: narrator
          text: 一支孤零零的蜡烛照亮了神龛。神龛前跪着一位老人，身边的旧木箱上摊着一本书，还摆着一颗人头骨。老人身材高大，瘦得骨头突出。长发和络腮胡都很长，雪一样白。一件羊皮长袍裹着他的身体，从脖子一直遮到脚跟。
        - id: ch01-b08
          speaker: prince_edward
          text: 原来是一位圣洁的隐士！这回我的运气可真不错。
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: 隐士结束祈祷，站起身来。国王敲了敲门，屋里传出一个低沉的声音。
        - id: ch01-b10
          speaker: hermit
          text: 进来吧！可你得把罪恶留在门外，因为你就要踏上神圣的土地！
        - id: ch01-b11
          speaker: narrator
          text: 国王进门站定。老人用一双发亮却躁动不安的眼睛盯住他。
        - id: ch01-b12
          speaker: hermit
          text: 你是什么人？
        - id: ch01-b13
          speaker: prince_edward
          text: 我是国王。
        - id: ch01-b14
          speaker: hermit
          text: 欢迎你，国王！欢迎，欢迎！
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: 隐士一下忙碌起来。他摆好短凳，请国王坐在壁炉旁，又往火里添了柴。随后，他迈着紧张的步子，在屋里不停地来回走动。
    - id: ch02
      title: 大天使的秘密
      blocks:
        - id: ch02-b01
          speaker: hermit
          text: 许多人来我这里寻求庇护，可他们都不配，我把他们赶走了。你却不一样。你抛下王冠，不稀罕王位的浮华，还穿上破衣，要用一生追求圣洁、磨炼肉身。你配留在这里！你会一直住到死去的那一天。
        - id: ch02-b02
          speaker: narrator
          text: 国王赶紧想解释，可隐士仿佛完全没有听见。他越说越响，神情也越来越激动。
        - id: ch02-b03
          speaker: hermit
          text: 在这里，没有人找得到你，也没有人能求你回到那种空虚愚蠢的生活。你要祈祷，研读《圣经》，想想今世有多少愚昧虚妄，再想想来世有多么崇高。你只吃硬面包和野菜，每天用鞭子抽打身体，净化灵魂。你贴身穿苦衣，只喝清水，就能得到彻底的安宁。无论谁来找你，都只能失望地离开。他找不到你，更打扰不了你。
        - id: ch02-b04
          speaker: narrator
          text: 老人还在屋里来回走，却渐渐不再高声讲话，只顾低低地咕哝。国王抓住机会，把自己的处境详细说了一遍。不安和忧虑让他越说越急，简直口若悬河，可隐士一句也没听进去。老人照旧自言自语，一边嘟囔，一边来到国王面前，忽然变得郑重起来。
        - id: ch02-b05
          speaker: hermit
          text: 嘘！我告诉你一个秘密！
        - id: ch02-b06
          speaker: narrator
          text: 他俯下身，刚要开口，又突然侧耳倾听。过了一会儿，他踮脚走到窗口，探出脑袋，在暮色中到处窥望。确认外面没有动静，他才悄悄回来，把脸凑到国王跟前。
        - id: ch02-b07
          speaker: hermit
          text: 我是一位大天使！
        - id: ch02-b08
          speaker: narrator
          text: 国王猛地打了个激灵。刚才的庆幸顿时变成恐惧，而且明明白白地写在了脸上。
        - id: ch02-b09
          speaker: prince_edward
          text: 上帝保佑，我真宁愿还和那些亡命徒待在一起！现在，我竟成了一个疯子的囚徒！
          emotion: fearful
        - id: ch02-b10
          speaker: hermit
          text: 我看得出来，你已经感受到我的气息了。你脸上满是敬畏！谁来到这气息里，都会受到震慑，因为这正是天堂的气息。我一眨眼就能上天堂，再从那里回来。
        - id: ch02-b11
          speaker: hermit
          text: 五年前，天堂派天使来到这里，赐给我大天使的尊位。他们一出现，整个屋子便亮得叫人受不了。国王啊，他们还跪在我面前！因为我比他们更加伟大。
        - id: ch02-b12
          speaker: hermit
          text: 我走过天堂的殿堂，也和列祖说过话。来，摸摸我的手，不要怕，尽管摸。好了，你现在摸到的这只手，亚伯拉罕、以撒和雅各都握过！我曾走在黄金铺成的天庭里，还亲眼见过上帝！
        - id: ch02-b13
          speaker: narrator
          text: 隐士故意停了一下，让这番话显得更有分量。可转眼间，他的脸色完全变了。他猛地起身，怒火又烧了起来。
        - id: ch02-b14
          speaker: hermit
          text: 是的，我是大天使。可我不过是个大天使！我本来可以做教皇！二十年前，天堂就在梦里告诉过我。我一定会成为教皇，因为那是上天的旨意！
          emotion: angry
        - id: ch02-b15
          speaker: hermit
          text: 可国王解散了我的修道院。我只是个贫穷无名、没人帮助的修士，就这样无家可归，被赶进茫茫人世，还让人夺走了那份伟大的命运！所以我才只是个大天使，而我本来应当做教皇！
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: 他又含混地嘟囔起来，一边徒劳地用拳头捶打额头，一边恶毒地咒骂。过一会儿，他又可怜巴巴地哀叹，自己本来应当成为教皇。这样的狂乱持续了整整一个钟头，可怜的小国王只能坐在那里忍受。
    - id: ch03
      title: 火边的温情
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 突然，隐士的狂乱消失了。他的声音柔和下来，整个人仿佛从云端回到人间。他说起话来质朴又亲切，很快便赢得了国王的心。
        - id: ch03-b02
          speaker: narrator
          text: 老人把孩子挪到离火更近的地方，让他暖暖和和地坐好。他用灵巧温柔的手，仔细处理孩子身上一处处小伤和擦破的地方，又动手准备食物，亲自烧起了晚饭。他忙个不停，却一直和国王愉快地交谈，偶尔轻抚孩子的脸颊，或者疼爱地拍拍他的头。
        - id: ch03-b03
          speaker: narrator
          text: 不久前，那个自称大天使的疯子还让国王又怕又厌恶。现在，眼前这位慈爱的老人却叫他心生敬重，甚至有了亲近之情。两人一起吃完晚饭，这份温情始终没有改变。
        - id: ch03-b04
          speaker: narrator
          text: 饭后，他们先在神龛前祈祷。随后，隐士把男孩领到旁边的一间小屋，让他上床休息。他像母亲照顾孩子那样，把被子四周掖得严严实实，叫男孩躺得安稳又舒服。临走前，他还满怀爱意地抚摸了一下孩子。
        - id: ch03-b05
          speaker: narrator
          text: 隐士回到火边坐下，心不在焉地拨弄余火。过了一会儿，他停住手，用手指敲了几下额头，像是要找回一个突然溜走的念头。可他似乎没有想起来。就在下一刻，他猛地站起身，走进客人的房间。
        - id: ch03-b06
          speaker: hermit
          text: 你真是国王？
        - id: ch03-b07
          speaker: prince_edward
          text: 是的，我是国王。
        - id: ch03-b08
          speaker: narrator
          text: 国王困得睁不开眼，声音也含含糊糊。
        - id: ch03-b09
          speaker: hermit
          text: 哪一国的国王？
        - id: ch03-b10
          speaker: prince_edward
          text: 我是英格兰国王。
        - id: ch03-b11
          speaker: hermit
          text: 英格兰？这么说，亨利已经死了！
          emotion: surprised
        - id: ch03-b12
          speaker: prince_edward
          text: 唉，是的。我是他的儿子。
          emotion: sad
        - id: ch03-b13
          speaker: narrator
          text: 一层阴沉的怒色罩住了隐士的脸。他攥紧骨瘦的双手，呼吸又快又重，还不停地咽着唾沫。过了片刻，他用沙哑的声音问道。
        - id: ch03-b14
          speaker: hermit
          text: 你知不知道，正是他把我们赶到世上，让我们无家可归？
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: 男孩没有回答。老人俯下身，仔细端详他安详的脸，又听了听那平稳的呼吸。孩子已经睡着了，而且睡得很沉。隐士脸上的怒色消失了，换成一种邪恶而满足的神情。就在这时，睡梦中的男孩脸上掠过一丝微笑。
        - id: ch03-b16
          speaker: hermit
          text: 原来如此。他心里正快活呢。
    - id: ch04
      title: 午夜的屠刀
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 隐士转过身，悄无声息地在屋里四处翻找。他不时停下听听动静，又会猛然扭过头，朝床上飞快地瞥一眼，嘴里始终嘀嘀咕咕，含混不清地自言自语。最后，他终于找到了想要的东西，一把生锈的旧屠刀，还有一块磨刀石。
        - id: ch04-b02
          speaker: narrator
          text: 他蹑手蹑脚地回到火边坐下，把刀放在石头上，一下一下轻轻地磨，嘴里仍在喃喃自语，偶尔还会突然冒出一声叫喊。风绕着孤零零的小屋低声叹息，远方传来夜里神秘的声音。胆大的老鼠从墙缝和藏身处探出头，一双双眼睛闪着光，窥视着老人。可他全神贯注，什么也没有留意。
        - id: ch04-b03
          speaker: narrator
          text: 隔上很久，他就用拇指试一试刀刃，然后满意地点头。
        - id: ch04-b04
          speaker: hermit
          text: 越来越锋利了。对，越来越锋利了。
        - id: ch04-b05
          speaker: narrator
          text: 时间一点点过去，隐士却完全没有察觉，只是心平气和地继续磨刀。他沉浸在自己的念头里，仿佛正用它们取乐。那些念头偶尔冲出口来，变成一句句清楚的话。
        - id: ch04-b06
          speaker: hermit
          text: 他的父亲害了我们，毁了我们！如今，他已经堕入永恒的烈火！他曾经逃出我们的手心，可那是上帝的旨意，我们不该抱怨。他终究没有逃过烈火。那火吞噬一切，没有怜悯，永不宽恕，而且永远不会熄灭！
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 他还是不停地磨刀。时而低声嘟囔，时而发出一阵刺耳的窃笑，接着又冒出几句话。
        - id: ch04-b08
          speaker: hermit
          text: 这一切都是他父亲干的。我现在只是个大天使。要不是他，我早就做教皇了！
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: 国王忽然动了一下。隐士立刻无声地扑到床边，跪在地上，俯身压向熟睡的孩子，手里的刀高高举起。
        - id: ch04-b10
          speaker: narrator
          text: 男孩又动了动，眼睛短暂地睁开，却没有清醒，也什么都没看见。转眼间，他的呼吸恢复平稳，又一次沉沉睡去。
        - id: ch04-b11
          speaker: narrator
          text: 隐士仍旧跪在那里，保持着俯身举刀的姿势。他观察了好一会儿，也听了好一会儿，几乎连气都不敢喘。终于，他慢慢放下双臂。又过了片刻，他才从床边悄悄退开。
        - id: ch04-b12
          speaker: hermit
          text: 早就过了半夜。最好别让他叫出声，免得碰巧有人经过。
        - id: ch04-b13
          speaker: narrator
          text: 他像幽灵一样在陋屋中走动，从这里捡起一块破布，从那里找来一根皮条，又到别处拿来一根。随后，他回到床前，动作小心而轻柔，没惊醒国王就把他的两只脚踝捆到了一起。
        - id: ch04-b14
          speaker: narrator
          text: 接着，隐士要捆孩子的手腕。他试了好几次，想把两只手交叠起来。可每当绳子就要缠上去，熟睡的男孩总会抽开一只手。大天使几乎要绝望了，男孩却自己把双手叠在了一起。下一刻，两只手便被牢牢绑住。
        - id: ch04-b15
          speaker: narrator
          text: 最后，隐士拿来一条布带，从男孩的下巴底下穿过，再绕到头顶扎紧。他收紧每个绳结时，都是那样轻，那样慢，又那样熟练。孩子从头到尾都睡得安安稳稳，连动也没有动一下。
