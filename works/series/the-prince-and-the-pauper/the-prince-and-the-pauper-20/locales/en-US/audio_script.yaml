audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently ironic
        timbre: clear and resonant
        pace: measured
        pitch: medium
    edward:
      display_name: Edward
      tts:
        delivery: dignified, direct, and quick to command
        timbre: clear and youthful
        pace: measured
        pitch: medium-high
    hermit:
      display_name: Hermit
      tts:
        delivery: intense, erratic, and shifting between fervor and tenderness
        timbre: deep and weathered
        pace: variable
        pitch: low
  chapters:
    - id: ch01
      title: The Prince and the hermit.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once the high hedge hid Edward from the house, terror drove him toward a distant wood. He ran with all his strength and never once looked back. Only when he had almost reached the shelter of the trees did he turn and see two figures far behind him. That one glimpse was enough. He did not wait to learn who they were or study them more closely. He rushed on into the dim forest and never slowed until he was far beneath the trees and felt reasonably safe.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Edward stopped and listened with all his attention. The silence was deep and solemn. It was so awful that it weighed on his spirits. Only after long intervals did his straining ears catch a sound, and each one came from far away, hollow and mysterious. They seemed less like real noises than the moans and complaints of the dead. Those sounds felt even drearier than the silence they broke.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At first, he meant to stay in that spot for the rest of the day. Soon a chill crept over his sweating body, and at last he had to move again just to keep warm. He chose a straight course through the forest, hoping he would soon break through to a road. But no road appeared. He walked on and on, and the trees seemed to grow thicker the farther he went.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Little by little, the gloom deepened, and Edward realized night was coming. The thought of spending it in that uncanny place made him shudder. He tried to hurry, but the darkness only slowed him down. He could no longer see well enough to choose where he stepped. Again and again, he tripped over roots or caught himself in tangles of vines and thorns.
        - id: ch01-b05
          speaker: narrator
          text: >-
            At last, he saw the faint gleam of a light, and the sight filled him with relief. Still, he approached it carefully. Again and again, he stopped to search the darkness around him and listen for danger. At last, he saw that the light came through the open, glassless window of a shabby little hut.
        - id: ch01-b06
          speaker: narrator
          text: >-
            A voice came from inside. Edward nearly ran to hide, but then he realized the man was praying. He slipped to the hut's only window, rose on tiptoe, and looked in.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The room was small, with a bare earth floor packed hard by use. A bed of rushes and a few ragged blankets lay in one corner. Nearby stood a pail, a cup, a basin, and a few pots and pans. There was also a short bench and a three-legged stool. The remains of a wood fire smoldered on the hearth.
        - id: ch01-b08
          speaker: narrator
          text: >-
            An old man knelt before a shrine lit by one candle. An open book and a human skull rested on a wooden box beside him. He was tall and bony, with long, snow-white hair and whiskers. A sheepskin robe covered him from neck to heels.
        - id: ch01-b09
          speaker: edward
          text: >-
            A holy hermit. I am fortunate indeed.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The hermit rose, and Edward knocked at the door. A deep voice answered from within.
        - id: ch01-b11
          speaker: hermit
          text: >-
            Come in, but leave your sins outside. The ground beneath your feet is holy.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Edward entered and stopped. The hermit turned his bright, restless eyes on the boy.
        - id: ch01-b13
          speaker: hermit
          text: >-
            Who are you?
        - id: ch01-b14
          speaker: edward
          text: >-
            I am the King.
        - id: ch01-b15
          speaker: hermit
          text: >-
            You are a king! Welcome, welcome!
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: >-
            With feverish energy, the old man hurried around the hut, repeating his welcome over and over. He arranged the bench beside the hearth and seated Edward on it. Then he threw more wood on the dying fire. When that was done, he began pacing the floor with restless, nervous strides.
        - id: ch01-b17
          speaker: hermit
          text: >-
            Many have come here seeking sanctuary, but they were unworthy, so I sent them away. You have cast aside your crown and rejected the empty splendor of your throne. You wear rags so you may give your life to holiness and punish the flesh. You are worthy. You shall stay here until death comes.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Edward quickly tried to interrupt and explain that he had not given up his throne at all. The hermit paid no attention. He did not even seem to hear the boy. His voice rose, and his words came with more and more force.
        - id: ch01-b19
          speaker: hermit
          text: >-
            You will be at peace here. No one will discover your refuge and beg you to return to that foolish life God led you to abandon. You will pray, study the holy book, and think about this world's delusions and the glory of the next. You will eat crusts and herbs. Each day, you will scourge your body to purify your soul. You will wear a hair shirt against your skin and drink nothing but water.
        - id: ch01-b20
          speaker: hermit
          text: >-
            Yes, you will have perfect peace. Anyone who comes looking for you will leave disappointed. No one will find you or trouble you.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Still pacing back and forth, the old man stopped speaking aloud and began to mutter to himself. Edward seized the chance to explain what had happened to him and did his best to make the danger clear. Fear and uneasiness made him eloquent. But the hermit went right on muttering and showed no sign that he had heard a word. At last, he came close to the boy and spoke with great importance.
        - id: ch01-b22
          speaker: hermit
          text: >-
            Quiet. I will tell you a secret.
        - id: ch01-b23
          speaker: narrator
          text: >-
            He bent down as if he meant to share it at once. Then he suddenly checked himself and stood listening. After a moment or two, he crept to the window on tiptoe, put his head outside, and peered all around through the fading light. Satisfied at last, he tiptoed back, brought his face close to Edward's, and whispered.
        - id: ch01-b24
          speaker: hermit
          text: >-
            I am an archangel.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Edward started violently. He wished with all his heart that he were back among the outlaws. Their company had been dangerous enough, but now he knew he was the prisoner of a madman. His fear grew stronger, and it showed plainly on his face.
        - id: ch01-b26
          speaker: hermit
          text: >-
            I see that you can feel the air around me. That is awe upon your face. Everyone feels it here, for this is the very air of heaven. I can go there and return in the blink of an eye.
        - id: ch01-b27
          speaker: hermit
          text: >-
            Five years ago, angels came down to this very spot and made me an archangel. Their brightness filled the hut until it could hardly be borne. They knelt before me, King. Yes, they knelt, because I was greater than they were.
        - id: ch01-b28
          speaker: hermit
          text: >-
            I have walked through the courts of heaven and spoken with the patriarchs. Touch my hand. Do not be afraid. There. You have touched the hand that Abraham, Isaac, and Jacob clasped. I have walked in the golden courts. I have seen God face to face.
        - id: ch01-b29
          speaker: narrator
          text: >-
            The hermit paused so his astonishing claims could make their full impression. Then his face changed without warning. He sprang to his feet, and his voice rang with sudden anger.
        - id: ch01-b30
          speaker: hermit
          text: >-
            Yes, I am an archangel. Only an archangel, though I might have been pope! Heaven told me so in a dream twenty years ago. I was meant to be pope, and I would have been, because Heaven itself had spoken.
          emotion: angry
        - id: ch01-b31
          speaker: hermit
          text: >-
            But the King destroyed my religious house. I was a poor monk with no friends, cast homeless into the world and robbed of my mighty destiny!
          emotion: angry
        - id: ch01-b32
          speaker: narrator
          text: >-
            Once more, he fell to mumbling and struck his forehead with his fist in helpless rage. Sometimes a bitter curse came out clearly through the muttering. At other moments, his anger collapsed into a pitiful complaint.
        - id: ch01-b33
          speaker: hermit
          text: >-
            Why am I nothing but an archangel when I should have been pope?
          emotion: sad
        - id: ch01-b34
          speaker: narrator
          text: >-
            This went on for a full hour while the poor little King sat and endured it. Then, all at once, the old man's frenzy vanished. He became completely gentle. His voice softened, and his wild thoughts seemed to come down out of the clouds. He began to chat in such a simple, human way that he soon won Edward's heart.
        - id: ch01-b35
          speaker: narrator
          text: >-
            The old devotee moved the boy nearer to the fire and made him comfortable. With a skilled and tender hand, he treated all the little cuts and bruises Edward had gathered during his flight. Then he began preparing and cooking their supper. He chatted pleasantly the whole time. Now and then, he stroked the boy's cheek or patted his head with quiet affection.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Before long, Edward's fear and dislike of the archangel had changed into respect and affection for the man. That happy feeling lasted throughout their meal.
        - id: ch01-b37
          speaker: narrator
          text: >-
            After supper, they prayed together before the shrine. Then the hermit led Edward into a small room beside the first and put him to bed. He tucked the boy in snugly and lovingly, just as a mother might. With one last caress, he left Edward to sleep and returned to his place beside the fire.
        - id: ch01-b38
          speaker: narrator
          text: >-
            For a while, the old man poked at the glowing wood in an absent, aimless way. Then he stopped. He tapped his forehead several times with his fingers, as if searching for a thought that had slipped out of his mind. The thought would not return. Suddenly, he jumped up and hurried into Edward's room.
        - id: ch01-b39
          speaker: hermit
          text: >-
            You are a king?
        - id: ch01-b40
          speaker: edward
          text: >-
            Yes, I am.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Edward's answer was heavy with sleep.
        - id: ch01-b42
          speaker: hermit
          text: >-
            King of what land?
        - id: ch01-b43
          speaker: edward
          text: >-
            I am King of England.
        - id: ch01-b44
          speaker: hermit
          text: >-
            England? Then Henry is dead!
        - id: ch01-b45
          speaker: edward
          text: >-
            Alas, yes. I am his son.
        - id: ch01-b46
          speaker: narrator
          text: >-
            A dark frown settled over the hermit's face. His bony hands closed into fists with a vengeful strength. For several moments, he stood there breathing quickly and swallowing again and again. At last, he spoke in a rough, strained voice.
        - id: ch01-b47
          speaker: hermit
          text: >-
            Do you know that he cast us out into the world without homes or shelter?
          emotion: angry
        - id: ch01-b48
          speaker: narrator
          text: >-
            No answer came. The old man bent over the boy's peaceful face and listened to his quiet breathing.
        - id: ch01-b49
          speaker: hermit
          text: >-
            He is asleep. Sound asleep.
        - id: ch01-b50
          speaker: narrator
          text: >-
            The frown disappeared, and a look of wicked satisfaction replaced it. A smile passed over the dreaming boy's face.
        - id: ch01-b51
          speaker: hermit
          text: >-
            So, his heart is happy.
        - id: ch01-b52
          speaker: narrator
          text: >-
            The hermit turned away and began searching the hut. He moved stealthily, pausing now and then to listen or glance sharply toward the bed. All the while, he muttered to himself. At last, he found what he wanted. It was a rusty butcher knife and a whetstone.
        - id: ch01-b53
          speaker: narrator
          text: >-
            He crept back to the fire, sat down, and softly sharpened the knife on the stone. The wind sighed around the lonely hut, and mysterious voices drifted through the night from far away. Bold mice and rats peered from cracks and hiding places, their eyes shining. The old man noticed none of them. He was lost in his work and his thoughts.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Every so often, he drew his thumb along the blade and nodded with satisfaction.
        - id: ch01-b55
          speaker: hermit
          text: >-
            It is getting sharper. Yes, it is getting sharper.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Time passed without his notice. He worked on quietly, entertaining himself with thoughts that sometimes broke into words.
        - id: ch01-b57
          speaker: hermit
          text: >-
            His father ruined us and destroyed our home. Now he has gone down into the eternal fires. Yes, into the eternal fires! He escaped us, but that was God's will, and we must not complain. Still, he did not escape those flames. They consume without mercy, and they burn forever.
          emotion: angry
        - id: ch01-b58
          speaker: narrator
          text: >-
            He kept sharpening the knife, muttering and sometimes giving a low, harsh chuckle. Then more words burst out.
        - id: ch01-b59
          speaker: hermit
          text: >-
            His father caused it all. Because of him, I am only an archangel when I should be pope!
          emotion: angry
        - id: ch01-b60
          speaker: narrator
          text: >-
            Edward stirred. Without a sound, the hermit sprang to the bedside and knelt over the sleeping boy with the knife raised. Edward moved again. His eyes opened for a moment, but they saw nothing. Then his peaceful breathing showed that he was sound asleep once more.
        - id: ch01-b61
          speaker: narrator
          text: >-
            The hermit stayed there watching and listening, hardly daring to breathe. At last, he slowly lowered his arms and crept away.
        - id: ch01-b62
          speaker: hermit
          text: >-
            It is long past midnight. He must not cry out. Someone might happen to pass nearby.
        - id: ch01-b63
          speaker: narrator
          text: >-
            He glided around the hut, collecting scraps of cloth and leather thongs. Then he returned to the bed. With slow and gentle movements, he tied Edward's ankles together without waking him.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Next, he tried to bind the boy's wrists. Again and again, just as the cord was ready, Edward pulled one hand away in his sleep. The hermit was nearly ready to give up when the boy crossed his own hands. A moment later, they were tied.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Finally, the old man passed a bandage beneath the sleeper's chin, drew it over his head, and fastened it tightly. He pulled every knot so softly, slowly, and skillfully that Edward slept peacefully through it all without moving.
