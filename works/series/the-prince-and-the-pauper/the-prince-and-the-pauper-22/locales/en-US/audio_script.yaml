  chapters:
    - id: ch01
      title: King of the Game-Cocks
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once again, “King Foo-foo the First” wandered with the tramps and outlaws. They made him the target of their coarse jokes and foolish teasing. Canty and Hugo sometimes tormented him in small ways when the Ruffler was not looking. No one else truly disliked him. Some even liked him, and every one of them admired his courage and spirit.
        - id: ch01-b02
          speaker: narrator
          text: >-
            For two or three days, Hugo was in charge of the King. He secretly did whatever he could to make the boy miserable. During the wild gatherings at night, he entertained the company by insulting him in little ways and pretending each insult was an accident.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Twice Hugo stepped on the King’s toes “by accident.” With the contempt expected of royalty, the King acted as if he had not noticed and did not care. But when Hugo amused himself that way a third time, the King knocked him flat with a cudgel. The whole tribe roared with delight.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Burning with anger and shame, Hugo jumped up, grabbed a cudgel, and rushed at his small opponent. A ring formed around the two fighters at once. The cheering and betting began.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Poor Hugo had no chance at all. His frantic, clumsy apprentice work was useless against such skill. The King had been trained by the finest masters in Europe in single-stick, quarterstaff, and every skill and trick of sword fighting.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The little King stood ready but perfectly at ease. He caught the thick rain of blows and turned them aside with such speed and precision that the ragged crowd went wild with admiration. Whenever his practiced eye saw an opening, his cudgel flashed down on Hugo’s head like lightning. Each sharp rap brought another wonderful storm of laughter and cheers.
        - id: ch01-b07
          speaker: narrator
          text: >-
            After fifteen minutes, Hugo was battered, bruised, and buried under merciless ridicule. He crept away from the field. The King had not been touched. The joyful rabble lifted him onto their shoulders and carried him to the place of honor beside the Ruffler.
        - id: ch01-b08
          speaker: narrator
          text: >-
            There, with tremendous ceremony, they crowned him King of the Game-Cocks. His old insulting title was solemnly abolished. Anyone who dared use it again would be banished from the gang.
    - id: ch02
      title: A Captive’s Misery
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Every attempt to make the King useful to the troop had failed. He stubbornly refused to take part in their work, and he was always trying to escape.
        - id: ch02-b02
          speaker: narrator
          text: >-
            On the first day after his return, they pushed him into an unwatched kitchen. He not only came out with nothing, but tried to raise an alarm among the people in the house. Next they sent him to help a tinker at his work. He refused to do a thing and threatened the man with his own soldering iron. Before long, Hugo and the tinker had their hands full simply keeping him from getting away.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The King thundered royal threats at anyone who blocked his freedom or tried to force him into service. Hugo then took him begging with a slovenly woman and a sick baby. That went no better. The King would not beg for them or help their cause in any way.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Several days passed. The misery, exhaustion, dirt, cruelty, and vulgarity of life on the road became harder and harder for the captive to bear. At last, he began to feel that escaping the hermit’s knife had only delayed his death for a little while.
        - id: ch02-b05
          speaker: narrator
          text: >-
            At night, his dreams carried all of that away. He sat on his throne and was master once more.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Then morning came, and waking hurt all the more. During the few days between his return to captivity and his fight with Hugo, each new morning brought humiliation that was more bitter and more difficult to endure.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The morning after the fight, Hugo rose with revenge in his heart. He had two plans. First, he would force a special humiliation on the proud boy and his so-called royalty. If that failed, he would make the King appear guilty of a crime and betray him into the merciless hands of the law.
    - id: ch03
      title: Hugo’s First Plan
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            For his first plan, Hugo meant to put what the gang called a “clime” on the King’s leg. He knew the shame would wound the boy’s pride deeply. Once the clime had done its work, Hugo would ask Canty to help force the King onto the highway. They would make him show his leg and beg for coins.
        - id: ch03-b02
          speaker: narrator
          text: >-
            A clime was a false sore. To make one, a rogue mixed quicklime, soap, and rust from old iron into a paste. He spread it on leather and bound it tightly around the victim’s leg. The paste soon rubbed away the skin and left the flesh raw and inflamed.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Next, blood was rubbed over the wounded flesh. Once it dried completely, the leg looked dark and revolting. Finally, dirty rags were wrapped around it with clever carelessness. The horrible sore remained visible, ready to stir the pity of anyone passing by.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Hugo enlisted the tinker whom the King had frightened with the soldering iron. The two men took the boy along on a tinkering trip. As soon as the camp was out of sight, they threw him down. The tinker held him while Hugo tied the poultice firmly around his leg.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The King raged and fought. He promised to hang both villains the instant the royal scepter was back in his hand. They only tightened their grip, mocked his threats, and enjoyed watching him struggle helplessly.
        - id: ch03-b06
          speaker: edward_tudor
          text: >-
            The moment I hold my scepter again, I will have you both hanged for this!
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: >-
            Soon the poultice began to burn. It would not have needed much longer to finish its cruel work, but someone interrupted them. The slave who had spoken against England’s laws appeared. He stopped the scheme and tore away the bandage and poultice.
        - id: ch03-b08
          speaker: narrator
          text: >-
            The King wanted to borrow the man’s cudgel and beat the two scoundrels on the spot. His rescuer refused. A fight there would cause trouble, he said. They should wait until night, when the whole tribe was together and no outsider would interfere.
        - id: ch03-b09
          speaker: slave
          text: >-
            No. We would only bring trouble on ourselves here. Leave it until tonight, when the whole band is together and no one from outside will interrupt us.
        - id: ch03-b10
          speaker: narrator
          text: >-
            The slave marched the whole party back to camp and told the Ruffler exactly what had happened. The chief listened and thought the matter over. Then he decided that the King must never be sent begging again. Plainly, the boy was worthy of higher and better work. So the Ruffler promoted him from the low rank of beggar and appointed him a thief on the spot.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Hugo was delighted. He had tried before to make the King steal and had failed. Now, surely, the boy would never defy a direct command from the head of the gang.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Hugo planned a raid for that very afternoon. Somehow, he would put the King into the hands of the law and make the betrayal look accidental. The King of the Game-Cocks was popular now. If the gang learned the truth, they might deal harshly with the man who had handed their champion to their common enemy.
    - id: ch04
      title: The Stolen Bundle
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            When the afternoon came, Hugo strolled into a nearby village with his intended victim. They drifted slowly up and down one street after another. Hugo watched closely for a chance that would make his wicked purpose certain. The King watched just as closely for a chance to dart away and escape his hateful captivity forever.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Each of them let several promising chances pass. Both were determined to succeed this time, and neither would risk his burning hopes on anything uncertain.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Hugo found his chance first. A woman came toward them with a large package in her basket. His eyes shone with wicked pleasure. If he could plant that bundle on the boy, he thought, then it would be farewell to the King of the Game-Cocks.
        - id: ch04-b04
          speaker: narrator
          text: >-
            He waited until the woman had passed. He looked patient, but excitement burned inside him. When the moment was right, he spoke quietly.
        - id: ch04-b05
          speaker: hugo
          text: >-
            Stay here until I return.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Hugo slipped after the woman. The King’s heart leaped with joy. If Hugo went far enough, he could finally escape.
        - id: ch04-b07
          speaker: narrator
          text: >-
            But luck failed him. Hugo crept up behind the woman, snatched the package, and ran back. As he came, he wrapped it in an old piece of blanket that had been hanging over his arm.
        - id: ch04-b08
          speaker: narrator
          text: >-
            The woman had not seen the theft, but she felt the sudden lightness of her basket and knew her package was gone. At once, she raised the alarm, and people took up the cry. Without stopping, Hugo shoved the bundle into the King’s hands.
        - id: ch04-b09
          speaker: hugo
          text: >-
            Run after me with the others and shout, “Stop, thief!” Make sure you send them the wrong way.
        - id: ch04-b10
          speaker: narrator
          text: >-
            A moment later, Hugo rounded a corner and raced down a crooked alley. Within another moment or two, he strolled calmly back into sight, looking innocent and unconcerned. He took his place behind a post and watched.
        - id: ch04-b11
          speaker: narrator
          text: >-
            The outraged King threw the bundle to the ground. The blanket fell open just as the woman reached him with a growing crowd behind her. She seized his wrist with one hand and snatched up her package with the other. Then she poured abuse on him while he struggled in vain to break her grip.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Hugo had seen all he needed. His enemy was caught, and the law would have him now. Laughing with triumph, Hugo slipped away toward camp. As he walked, he carefully invented the version of the affair that he would tell the Ruffler’s crew.
    - id: ch05
      title: Sir Miles Returns
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The King kept struggling against the woman’s powerful grip. Now and then, he cried out in frustration.
        - id: ch05-b02
          speaker: edward_tudor
          text: >-
            Let go of me, you foolish woman! I did not steal your miserable goods.
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: >-
            The crowd pressed in, threatening the King and shouting names at him. A muscular blacksmith pushed forward. He wore a leather apron, and his sleeves were rolled to his elbows. Reaching for the boy, he declared that a sound beating would teach him a lesson.
        - id: ch05-b04
          speaker: blacksmith
          text: >-
            I’ll give this boy a proper beating. That will teach him!
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: >-
            Just then, a long sword flashed through the air. Its flat side struck the blacksmith’s arm with convincing force. The strange-looking owner of the sword spoke pleasantly.
        - id: ch05-b06
          speaker: miles_hendon
          text: >-
            Easy, good people. There is no need for anger or cruel words. The law must settle this, not a crowd taking matters into its own hands. Goodwife, release the boy.
        - id: ch05-b07
          speaker: narrator
          text: >-
            The blacksmith looked the sturdy soldier up and down. Then he backed away, muttering and rubbing his arm. The woman reluctantly let go of the boy’s wrist. The crowd did not like the stranger, but they wisely kept quiet.
        - id: ch05-b08
          speaker: narrator
          text: >-
            With flushed cheeks and shining eyes, the King sprang to his rescuer’s side and cried out.
        - id: ch05-b09
          speaker: edward_tudor
          text: >-
            You took far too long, Sir Miles, but you have come at the right moment. Now cut this rabble to pieces!
