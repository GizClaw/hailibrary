audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华亲王
      tts:
        delivery: 高贵坚定，受辱时仍保持尊严
        timbre: 清亮稚嫩
        pace: 从容有力
        pitch: 中高
    hugo:
      display_name: 雨果
      tts:
        delivery: 油滑刻薄，嘲笑别人时肆无忌惮
        timbre: 尖细轻佻
        pace: 轻快
        pitch: 中高
    miles_hendon:
      display_name: 迈尔斯·亨顿
      tts:
        delivery: 豪爽诙谐，危急时勇敢坚定
        timbre: 洪亮粗粝
        pace: 明快有力
        pitch: 中低
  chapters:
    - id: ch01
      title: 斗鸡之王
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: “糊涂国王一世”又跟着流浪汉和亡命徒四处游荡。大伙拿粗俗的笑话和愚蠢的嘲弄逗他，等大头领转过身，康第和雨果还会偷偷使些小坏。真正恨他的只有这两个人。其余人有些很喜欢他，人人都佩服他的胆量和骨气。
        - id: ch01-b02
          speaker: narrator
          text: 国王归雨果看管。接连两三天，雨果总在暗地里想办法叫他难受。夜晚，众人照例纵酒狂欢，他就故意羞辱国王，却次次装成无心之失。他已经两回“不小心”踩上国王的脚趾。国王不愧是位君主，只用轻蔑的沉默表示自己根本不在意。
        - id: ch01-b03
          speaker: narrator
          text: 到第三回，雨果又踩了下去。国王抡起木棍，一下把他打倒在地。整伙人顿时乐坏了。雨果又羞又怒，跳起来抓过一根棍子，发疯似的扑向这个小对手。众人马上围成一圈，把两个斗士圈在中央，下注和喝彩的声音四处响起。
        - id: ch01-b04
          speaker: narrator
          text: 可怜的雨果，根本没有一点胜算。他那套又猛又笨、还没学到家的把式，对上的却是一条经欧洲顶尖名师调教过的手臂。单棍、长棍，还有剑术里的招数和巧技，国王样样都学过。
        - id: ch01-b05
          speaker: narrator
          text: 小国王站得轻松优雅，神情却十分机警。棍棒像雨点一样密集地砸来，他总能准确又利落地接住、拨开。围观的人看得如痴如狂。每当他发现一个破绽，紧接着便有一棍快如闪电，敲上雨果的脑袋。欢呼和大笑随即席卷全场，简直震耳欲聋。
        - id: ch01-b06
          speaker: narrator
          text: 一刻钟后，雨果已经遍体青肿，还要承受众人毫不留情的嘲笑，只能灰溜溜地退下。毫发未伤的小英雄却让人群高高举起，扛到大头领身边的尊位上。
        - id: ch01-b07
          speaker: narrator
          text: 他们郑重其事地举行了一场盛大仪式，封他为“斗鸡之王”。他原先那个卑贱的称号也被庄严废除。从此谁再敢提起，就要被逐出这伙人。
        - id: ch01-b08
          speaker: narrator
          text: 可众人想叫国王替团伙出力，每一次都失败。他坚决不肯听命，还总想着逃走。回来的头一天，他们把他塞进无人看守的厨房。他不但空着手出来，还想惊动屋里的人。
        - id: ch01-b09
          speaker: narrator
          text: 他们让他跟补锅匠出去帮忙，他拒绝干活，还拿补锅匠自己的烙铁威胁人家。到最后，雨果和补锅匠光是防着他逃跑，就忙得不可开交。谁敢妨碍他的自由，谁想逼他做事，他便以国王的雷霆之怒痛斥过去。
        - id: ch01-b10
          speaker: narrator
          text: 后来，他们让雨果押着他，陪一个邋遢女人和一个患病的婴儿出去乞讨。结果还是叫人失望。国王不肯替那两个乞丐求人施舍，也不肯以任何方式掺和他们的勾当。
        - id: ch01-b11
          speaker: narrator
          text: 几天就这样过去了。四处流浪的生活又苦又累，肮脏、卑劣而粗俗。国王一天比一天难以忍受。到最后，他甚至觉得，从隐士的刀下获救，最多也不过是暂且逃过一死。
        - id: ch01-b12
          speaker: narrator
          text: 夜里一入梦，他就忘了这一切。他又坐上王位，又做回自己的主人。可梦越美，醒来就越痛苦。从重新被抓，到与雨果决斗，中间没有几个早晨。可他每一次睁眼，所受的屈辱都比前一天更苦，也更难熬。
    - id: ch02
      title: 雨果的两个计策
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 决斗后的第二天早晨，雨果一醒来，心里便装满了报复国王的恶念。他有两个计策。头一个，是用一种特别的法子羞辱男孩，把他那份傲气和“自以为是”的王者尊严踩个粉碎。要是这计不成，他就栽给国王一桩罪，再出卖他，让他落入法律那双绝不留情的利爪。
        - id: ch02-b02
          speaker: narrator
          text: 为了实行头一个计策，雨果打算在国王腿上做一处“假疮”。他料定，这会把国王羞辱到无以复加。等假疮生效，他就找康第帮忙，逼国王在大路上露出那条腿，向过路人讨钱。
        - id: ch02-b03
          speaker: narrator
          text: “假疮”是这伙人的黑话，指人为做出的烂疮。先把生石灰、肥皂和旧铁锈调成糊，抹在一块皮革上，再紧紧绑到腿上。没多久，皮肤就会被磨掉，露出红肿溃烂的生肉。
        - id: ch02-b04
          speaker: narrator
          text: 接下来，他们会往腿上涂血。血干透以后，皮肉就变得又黑又恶心。最后，再用肮脏的破布包扎。那绷带看似随意，其实正好能把可怕的溃疡露出来，好博取过路人的怜悯。
        - id: ch02-b05
          speaker: narrator
          text: 雨果找来那个曾被国王用烙铁吓住的补锅匠。两人带男孩离开营地，装作要沿途补锅。等营地看不见了，他们立刻把他摔倒。补锅匠死死按住他，雨果则把涂着药膏的皮革牢牢缚在他腿上。
        - id: ch02-b06
          speaker: prince_edward
          text: 等权杖回到朕手里，朕立刻把你们两个吊死！
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: 两人紧紧制住国王，一边看他徒劳挣扎，一边嘲笑他的威胁。药膏很快开始灼痛皮肉。再过不久，它便要大功告成。幸好就在这时，那个曾经发表演说、斥责英格兰法律的“奴隶”出现了。他制止两人的勾当，扯下药膏和绷带。
        - id: ch02-b08
          speaker: narrator
          text: 国王想借救命恩人的棍子，当场把两个恶棍狠狠揍一顿。那人却不肯，说这样会招来麻烦，最好留到晚上再算账。那时整伙人都在，外人不敢插手，也没人能来搅局。
        - id: ch02-b09
          speaker: narrator
          text: 那人押着众人回到营地，把事情禀报给大头领。大头领听完，想了想，认定国王不该再被派去乞讨。他显然配得上更高贵、更体面的差事。于是，大头领当场把他从乞丐中提拔出来，派他去偷东西！
        - id: ch02-b10
          speaker: narrator
          text: 雨果喜出望外。他以前也逼过国王行窃，却没能得逞。这一次，命令由首领亲口下达，国王总不会公然违抗了吧。雨果当即决定，下午就去干上一票，还要趁机把国王送入法律手中。
        - id: ch02-b11
          speaker: narrator
          text: 不过，他得把圈套布置得非常巧妙，让一切看起来只是一场意外。如今“斗鸡之王”很受欢迎。要是哪个不招人喜欢的家伙狠下毒手，把他交给大家共同的敌人，也就是法律，这伙人只怕不会轻饶那个叛徒。
    - id: ch03
      title: 偷来的包裹
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到了下午，雨果带着他的猎物，慢悠悠地走进附近一座村庄。两人在一条又一条街上来回闲逛。雨果仔细寻找一个稳妥的机会，好实现自己的恶意。国王也同样警觉，等待一个空隙，好一举逃走，从此摆脱这场可耻的囚禁。
        - id: ch03-b02
          speaker: narrator
          text: 两人都放过了几个看来不错的机会。他们心里都已打定主意，这一次非得万无一失。谁也不肯让那份烧灼内心的渴望，推着自己闯进一场把握不大的险局。
        - id: ch03-b03
          speaker: narrator
          text: 雨果的机会先到了。一个女人迎面走来，篮子里放着一只鼓鼓囊囊的包裹。雨果眼里闪出罪恶的喜悦，偷偷盘算起来。
        - id: ch03-b04
          speaker: hugo
          text: 凭我的命起誓，只要能把这东西栽到他头上，斗鸡之王就该乖乖说晚安啦。愿上帝保佑他！
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: 他一面等，一面望。表面上十分耐心，心里却兴奋得快要燃烧起来。等那个女人走过去，时机也成熟了。雨果压低声音，嘱咐国王。
        - id: ch03-b06
          speaker: hugo
          text: 你就在这里等着，等我回来。
        - id: ch03-b07
          speaker: narrator
          text: 说完，他便悄悄追向猎物。国王心中一下充满喜悦。只要雨果追得够远，他现在就能逃走了。
        - id: ch03-b08
          speaker: narrator
          text: 可好运没有来。雨果溜到女人身后，一把抢走包裹，随即飞奔回来，还用手臂上搭着的旧毯子把东西裹住。女人虽然没看见贼，却觉得篮子突然轻了，立刻知道丢了东西，当场高声呼喊。
        - id: ch03-b09
          speaker: narrator
          text: 雨果脚步不停，迎面把包裹硬塞进国王手里，同时喊道。
        - id: ch03-b10
          speaker: hugo
          text: 拿着剩下的东西，跟在我后面跑！还要喊“抓贼”，可别忘了把他们引到别处去！
        - id: ch03-b11
          speaker: narrator
          text: 下一刻，雨果拐过街角，钻进一条弯曲的小巷。又过了一两分钟，他居然慢吞吞地重新露面，装出无辜而漠不关心的样子，躲在一根柱子后面观看结果。
        - id: ch03-b12
          speaker: narrator
          text: 国王受不了这份侮辱，马上把包裹扔到地上。就在此时，那个女人领着越来越多的人追到了，旧毯子也正好从包裹上散开。她一手抓住国王的手腕，一手抢回自己的包裹，对着男孩劈头盖脸地痛骂。
        - id: ch03-b13
          speaker: narrator
          text: 国王一次次挣扎，却怎么也甩不开她。雨果已经看够了。敌人被捉住，马上就会落进法律手里。他心花怒放，偷笑着溜走。返回营地的路上，他还在琢磨，要怎样给大头领那伙人编出一套稳妥的说辞。
    - id: ch04
      title: 迟到的救兵
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 国王还在女人有力的手中挣扎。他又气又急，时不时冲她喊上一句。
        - id: ch04-b02
          speaker: prince_edward
          text: 放开朕，你这个愚蠢的妇人！夺走你那点不值钱东西的人，根本不是朕！
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: 人群越围越紧，七嘴八舌地威胁国王，骂他是贼。一个壮硕的铁匠围着皮围裙，袖子一直卷到手肘。他伸手来抓男孩，还说要狠狠揍他一顿，叫他永远记住这个教训。
        - id: ch04-b04
          speaker: narrator
          text: 就在这时，一柄长剑在空中寒光一闪。剑身随即结结实实地拍上铁匠的胳膊。那位装束奇特的剑主人同时开口，语气倒十分和善。
        - id: ch04-b05
          speaker: miles_hendon
          text: 圣母在上，各位好心人，咱们还是温和一点吧。别恶语相向，也别伤了和气。这件事该交给法律处置，不能由私人擅自审判。好太太，请放开这个孩子。
        - id: ch04-b06
          speaker: narrator
          text: 铁匠看了看这个高大健壮的军人，一面揉着胳膊，一面咕哝着退开。女人虽然不情愿，还是松开国王的手腕。人群不怀好意地盯着陌生人，可他们很识相，一个个闭紧了嘴。
        - id: ch04-b07
          speaker: narrator
          text: 国王脸颊通红，双眼发亮，立刻跳到救命恩人身边，高声叫起来。
        - id: ch04-b08
          speaker: prince_edward
          text: 迈尔斯爵士，你来得实在太迟！不过眼下倒正是时候。快把这群乌合之众砍成碎片！
          emotion: happy
