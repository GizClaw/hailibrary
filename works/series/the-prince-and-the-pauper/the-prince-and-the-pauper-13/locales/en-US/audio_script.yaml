  chapters:
    - id: ch01
      title: The disappearance of the Prince.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Before long, a deep sleepiness came over the two companions. The King tugged at his clothes and gave Miles an order.
        - id: ch01-b02
          speaker: edward
          text: >-
            Take these rags off me.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Hendon undressed the boy without arguing or asking questions, then tucked him into bed. After that, he looked around the room unhappily. The boy had taken his bed again, just as he had before. Where was Miles supposed to sleep? The little King saw the problem and settled it with a single sleepy command.
        - id: ch01-b04
          speaker: edward
          text: >-
            You will lie across the doorway and guard it.
        - id: ch01-b05
          speaker: narrator
          text: >-
            A moment later, Edward had forgotten every trouble and fallen into a deep sleep. Hendon watched him with admiration.
        - id: ch01-b06
          speaker: miles_hendon
          text: >-
            Bless his heart, he ought to have been born a king! He plays the part wonderfully.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Then Miles stretched himself out on the floor across the doorway. He was quite content with his place.
        - id: ch01-b08
          speaker: miles_hendon
          text: >-
            I slept in worse places during those seven years. It would be poor thanks to Heaven if I complained about this one.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Dawn was appearing when he finally fell asleep. He did not rise until nearly noon. Then, while his young charge still slept, Miles uncovered him bit by bit and measured him with a length of string.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Edward woke just as the measuring was finished. He complained that he was cold and demanded to know what Miles was doing.
        - id: ch01-b11
          speaker: miles_hendon
          text: >-
            It is all done now, my liege. I have a little business outside, but I will soon be back. Go to sleep again. You need the rest. There, I will cover your head too, and you will warm up faster.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Before Miles had even finished speaking, the King was dreaming again. Miles slipped quietly out. Thirty or forty minutes later, he slipped in just as quietly, carrying a complete secondhand suit for a boy. The clothes were cheap and worn, but they were tidy and warm enough for the season.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Miles sat down and examined what he had bought. As he worked, he mumbled to himself.
        - id: ch01-b14
          speaker: miles_hendon
          text: >-
            A longer purse would have bought something finer. Still, when your purse is short, you must make do with what it can buy. There was a woman in our town, in our town did dwell...
        - id: ch01-b15
          speaker: narrator
          text: >-
            Edward stirred. Miles noticed at once and lowered his voice.
        - id: ch01-b16
          speaker: miles_hendon
          text: >-
            I thought he moved. I had better sing less loudly. He has a journey ahead, and the poor boy is worn out. Now, this piece is good enough. One stitch here and another there will put it right. This next one is better, though a stitch or two would help it as well.
        - id: ch01-b17
          speaker: miles_hendon
          text: >-
            And these are very good and strong. They will keep his little feet warm and dry. That must be something new for him. No doubt he has always gone barefoot, winter and summer alike. If only thread were bread! A farthing buys enough thread for a year, and they give you a great big needle for nothing. Now the devil of a job will be getting the thread through it.
        - id: ch01-b18
          speaker: narrator
          text: >-
            And it was. Miles did what men have always done, and will probably go on doing until the end of time. He held the needle still and tried to push the thread through its eye, which is the exact opposite of the way a woman does it.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Again and again, the thread missed. It passed on one side of the needle, then the other. Sometimes it bent and doubled against the metal. Miles stayed patient. He had fought this battle before during his years as a soldier. At last, the thread went through. He picked up the garment that had been lying across his lap and began to sew.
        - id: ch01-b20
          speaker: miles_hendon
          text: >-
            The room is paid for, and so is the breakfast that will soon arrive. I still have enough money to buy two donkeys and cover our small expenses for the next two or three days. Then we shall reach the plenty waiting for us at Hendon Hall. She loved her husband dearly, but another man she loved.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Suddenly the needle drove under his fingernail.
        - id: ch01-b22
          speaker: miles_hendon
          text: >-
            Body of me! That went under my nail! Well, it is nothing new, though it is certainly not pleasant. We shall be merry at Hendon Hall, little one. Never doubt it. Your troubles will disappear there, and so will this sad madness of yours. She loved her husband dearly, but another man...
        - id: ch01-b23
          speaker: narrator
          text: >-
            Miles held the garment up and admired his work.
        - id: ch01-b24
          speaker: miles_hendon
          text: >-
            Those are splendidly large stitches! They have such greatness and majesty that the tailor's tiny, stingy stitches look common and miserable beside them. She loved her husband dearly, but another man she loved...
        - id: ch01-b25
          speaker: narrator
          text: >-
            He made the last stitch and inspected the finished suit with satisfaction.
        - id: ch01-b26
          speaker: miles_hendon
          text: >-
            There, it is done. Fine work, too, and finished quickly. Now I shall wake him, dress him, pour his drink, and feed him. Then we will go to the market by the Tabard Inn in Southwark. Please rise, my liege!
        - id: ch01-b27
          speaker: narrator
          text: >-
            There was no answer.
        - id: ch01-b28
          speaker: miles_hendon
          text: >-
            Ho there, my liege! Still nothing. His sacred person will have to forgive a touch, since his sleep is too deep to hear me. What!
          emotion: surprised
        - id: ch01-b29
          speaker: narrator
          text: >-
            Miles flung back the covers. The boy was gone.
        - id: ch01-b30
          speaker: narrator
          text: >-
            For a moment, he could only stare around the room in silent astonishment. Then he noticed that the boy's ragged clothes had vanished too. Miles began to rage and shout for the innkeeper. Just then, a servant entered carrying breakfast.
        - id: ch01-b31
          speaker: miles_hendon
          text: >-
            Explain this, you child of Satan, or your last hour has come! Where is the boy?
          emotion: angry
        - id: ch01-b32
          speaker: narrator
          text: >-
            The soldier sprang at the servant so fiercely that fear and surprise left the man unable to speak for a moment. When he found his voice, his answer came out in broken, trembling pieces.
        - id: ch01-b33
          speaker: servant
          text: >-
            Your worship had hardly left when a young man came running in. He said you wanted the boy to meet you at once, at the end of the bridge on the Southwark side. I brought the young man up here. He woke the boy and gave him the message.
          emotion: fearful
        - id: ch01-b34
          speaker: servant
          text: >-
            The boy complained a little about being disturbed so early, as he called it. But he put on his rags right away and left with the young man. He only said it would have been better manners if your worship had come for him yourself instead of sending a stranger. And so...
          emotion: fearful
        - id: ch01-b35
          speaker: miles_hendon
          text: >-
            And so you proved yourself a fool! Any trickster can deceive you. Curse the whole breed of you! Still, perhaps no harm has been done. Perhaps the boy is in no danger. I will go and bring him back. Set out the breakfast.
          emotion: angry
        - id: ch01-b36
          speaker: narrator
          text: >-
            Then Miles stopped. Something about the bed had caught his mind.
        - id: ch01-b37
          speaker: miles_hendon
          text: >-
            Wait! The covers were arranged to look as though someone was still lying under them. Did that happen by accident?
        - id: ch01-b38
          speaker: servant
          text: >-
            I do not know, good your worship. I saw the young man touching the covers. I mean the one who came for the boy.
        - id: ch01-b39
          speaker: miles_hendon
          text: >-
            A thousand deaths! He meant to fool me. That is clear. He wanted more time to get away. Listen carefully. Was that young man alone?
          emotion: angry
        - id: ch01-b40
          speaker: servant
          text: >-
            He was all alone, your worship.
        - id: ch01-b41
          speaker: miles_hendon
          text: >-
            Are you certain?
        - id: ch01-b42
          speaker: servant
          text: >-
            Certain, your worship.
        - id: ch01-b43
          speaker: miles_hendon
          text: >-
            Gather up those scattered wits of yours. Think. Take your time, man.
        - id: ch01-b44
          speaker: narrator
          text: >-
            The servant thought for a moment. Then another piece of the memory came back to him.
        - id: ch01-b45
          speaker: servant
          text: >-
            No one was with him when he arrived. But now I remember something. When the two of them stepped into the crowd on the bridge, a rough-looking man rushed out from somewhere nearby. He was just about to join them.
        - id: ch01-b46
          speaker: miles_hendon
          text: >-
            When what? Say it!
          emotion: angry
        - id: ch01-b47
          speaker: servant
          text: >-
            At that very moment, the crowd swallowed them and closed around them. I saw nothing more because my master called me. He was furious about a joint of meat that a scrivener had ordered and someone forgot. But I call on all the saints to witness that blaming me for it would be like judging an unborn baby for sins it never committed...
        - id: ch01-b48
          speaker: miles_hendon
          text: >-
            Get out of my sight, idiot! Your babbling is driving me mad! Wait! Where are you running? Can you not stand still for one moment? Did they go toward Southwark?
          emotion: angry
        - id: ch01-b49
          speaker: servant
          text: >-
            They did, your worship. And as I was saying, about that dreadful joint of meat, an unborn baby could not be more innocent than I am...
        - id: ch01-b50
          speaker: miles_hendon
          text: >-
            You are still here, and still babbling! Vanish before I throttle you!
          emotion: angry
        - id: ch01-b51
          speaker: narrator
          text: >-
            The servant vanished. Hendon went after him, passed him, and charged down the stairs two steps at a time. As he ran, he muttered to himself.
        - id: ch01-b52
          speaker: miles_hendon
          text: >-
            It was that filthy villain who claimed the boy was his son. I have lost you, my poor little mad master. That thought is bitter, for I had come to love you so. No! By book and bell, you are not lost. I will search the whole land until I find you again.
        - id: ch01-b53
          speaker: miles_hendon
          text: >-
            Poor child, there is his breakfast, and mine too. But I have no hunger now. Let the rats eat it. Speed, speed! That is what matters!
        - id: ch01-b54
          speaker: narrator
          text: >-
            Miles pushed and twisted his way through the noisy crowds on the bridge as quickly as he could. Again and again, he clung to one thought. It seemed to comfort him more than anything else could.
        - id: ch01-b55
          speaker: miles_hendon
          text: >-
            He grumbled, but he went. Yes, he went because he thought Miles Hendon had called for him. Sweet boy, he would never have gone for anyone else. I know that well.
