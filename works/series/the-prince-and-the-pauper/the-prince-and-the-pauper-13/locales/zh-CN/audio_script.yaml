audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华亲王
      tts:
        delivery: 高贵坚定，受辱时仍保持尊严
        timbre: 清亮稚嫩
        pace: 从容有力
        pitch: 中高
    miles_hendon:
      display_name: 迈尔斯·亨顿
      tts:
        delivery: 豪爽诙谐，危急时勇敢坚定
        timbre: 洪亮粗粝
        pace: 明快有力
        pitch: 中低
    inn_servant:
      display_name: 客店仆人
      tts:
        delivery: 胆怯啰嗦，慌乱时仍忍不住辩解
        timbre: 单薄微哑
        pace: 急促而断续
        pitch: 中高
  chapters:
    - id: ch01
      title: 第十三章　亲王失踪
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 没过多久，两个人都困得睁不开眼。国王指了指身上的破衣服，吩咐亨顿替他脱掉。
        - id: ch01-b02
          speaker: prince_edward
          text: 把这些破布脱掉。
        - id: ch01-b03
          speaker: narrator
          text: 亨顿没反驳，也没多问。他替男孩脱去衣服，把人安顿在床上，再仔细盖好。可他看看四周，立刻犯了愁。床又叫这孩子占了，自己该睡哪儿呢？小国王看懂了他的难处，带着浓浓的睡意替他作了安排。
        - id: ch01-b04
          speaker: prince_edward
          text: 你横睡在门口，替我守门。
        - id: ch01-b05
          speaker: narrator
          text: 话一说完，国王便沉沉睡去，什么烦恼都没有了。亨顿望着他，满心赞叹。
        - id: ch01-b06
          speaker: miles_hendon
          text: 好家伙，他真该生来就是个国王！这个角色叫他演得活灵活现。
        - id: ch01-b07
          speaker: narrator
          text: 亨顿在门前的地板上横躺下来，倒也十分知足。
        - id: ch01-b08
          speaker: miles_hendon
          text: 这七年里，我住过比这里糟得多的地方。如今若还挑剔，可就太对不起天上的主了。
        - id: ch01-b09
          speaker: narrator
          text: 黎明刚刚出现，他也睡着了。将近中午，亨顿起身掀开被子，每次只露出男孩身体的一小截，再拿细绳替他量尺寸。刚量完，国王便醒来，觉得身上冷，问他究竟在做什么。
        - id: ch01-b10
          speaker: miles_hendon
          text: 已经办好了，陛下。我得出去办点事，很快就回来。您再睡一会儿，眼下正需要好好休息。来，我把您的头也盖住，这样暖得快些。
        - id: ch01-b11
          speaker: narrator
          text: 亨顿还没说完，国王已经回到梦乡。迈尔斯轻轻溜出房门。三四十分钟后，他又悄悄回来，手里多了一整套半旧的男孩衣服。料子虽然便宜，也有些磨损，却干净整齐，正合时令。他坐下来，一件件查看自己的收获。
        - id: ch01-b12
          speaker: miles_hendon
          text: 钱袋若是再鼓一点，就能买到更好的衣裳。可钱不够，也只好量入为出。让我唱两句吧。我们镇上有个妇人，她就在镇上安了家。
        - id: ch01-b13
          speaker: narrator
          text: 床上的男孩似乎动了一下。亨顿赶紧压低嗓门，免得搅了他的好觉。前头还有路要赶，这可怜孩子已经累坏了。亨顿继续翻看衣服，觉得这一件补两针便能穿，那一件更好，只需稍加缝补。鞋子倒十分结实，能让男孩的小脚保持温暖干爽。这种滋味，他猜那孩子从前大概从未尝过，冬夏都只能赤脚走路。亨顿又看了看针线。一个法丁便能买来足够用上一年的线，还白送一根又粗又好的针，可是怎么把线穿进针眼，才是真正的难题。
        - id: ch01-b14
          speaker: narrator
          text: 果然，亨顿遭了罪。他的办法跟男人们自古以来的办法一模一样，而且多半到世界末日也不会变。他把针捏得一动不动，拿线头往针眼里硬戳，恰好跟女人的做法相反。线头一次次偏开，一会儿从左边滑过，一会儿从右边溜走，一会儿又顶在针身上弯成一团。好在他当兵时吃过这种苦，耐性还在。最后总算穿好线，他拿起横在膝上等了半天的衣服，开始动手缝补。
        - id: ch01-b15
          speaker: miles_hendon
          text: 客店的钱已经付过，连待会儿的早饭也算在内。剩下的钱够买两头驴，还能应付两三天路上的花销。等到了亨顿庄园，好日子就在前头了。歌里唱，那妇人深爱自己的丈夫。
        - id: ch01-b16
          speaker: narrator
          text: 唱到这里，针一下扎进了他的指甲底下。亨顿疼得叫了一声，却觉得没什么稀奇，只是实在不大舒服。他安慰睡着的男孩，等到了庄园，他们会过得很快活。孩子的苦难会在那里消失，那场可怜的疯病也会一同消失。说着，他又接着哼唱。歌里的妇人深爱丈夫，心里却偏偏还爱着另一个男人。
        - id: ch01-b17
          speaker: narrator
          text: 亨顿举起衣服，满怀赞赏地端详自己的针脚。
        - id: ch01-b18
          speaker: miles_hendon
          text: 瞧瞧，多么雄伟的针脚！又气派，又威严。跟它们一比，裁缝那些细小寒酸的针脚，简直卑微得不值一提。
        - id: ch01-b19
          speaker: narrator
          text: 他又哼起那首歌，说那个妇人深爱丈夫，却爱上了另一个男人。没多久，活儿便做完了。亨顿觉得自己不但缝得漂亮，动作也很麻利。接下来只要叫醒国王，替他穿衣，给他倒水洗漱，让他吃饱，两个人就能去萨瑟克塔巴德客店旁边的集市。
        - id: ch01-b20
          speaker: miles_hendon
          text: 陛下，该起床了！陛下，您听见了吗？看来光喊是叫不醒您的。我只好冒犯一下，亲手碰一碰您了。
        - id: ch01-b21
          speaker: narrator
          text: 亨顿猛地掀开被子。男孩不见了。
        - id: ch01-b22
          speaker: narrator
          text: 他哑口无言地愣了一会儿，四下张望，这才发现男孩那身破衣服也不见了。亨顿顿时暴跳如雷，高声叫店主人来。一个仆人恰在这时端着早饭走进房间。亨顿凶猛地扑过去，吓得对方又惊又怕，一时连话都说不出来。
        - id: ch01-b23
          speaker: miles_hendon
          text: 快说清楚，你这撒旦的小崽子！不然你就活到头了！那孩子在哪里？
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: 仆人浑身发抖，结结巴巴地讲起事情的经过。
        - id: ch01-b25
          speaker: inn_servant
          text: 老爷，您刚走没多久，就有个年轻人跑来，说您吩咐那孩子立刻去桥头找您，就在萨瑟克那边。我领他进来，他叫醒孩子，传了话。那孩子还抱怨这么早便受人打扰，可马上就穿好破衣服，跟着年轻人走了。临走时，他还说，您若亲自来，而不是派个陌生人来，才更懂礼数。
          emotion: fearful
        - id: ch01-b26
          speaker: miles_hendon
          text: 后来你就像个傻瓜一样上了当！你这蠢货，别人随便一骗，你就信了。你们这种人都该下地狱！不过，也许还没有出事。或许那人并不打算伤害孩子。我这就去把他找回来。你把桌子摆好。等等，床上的被子铺得像下面还躺着人。这是碰巧弄成的吗？
          emotion: angry
        - id: ch01-b27
          speaker: inn_servant
          text: 小人不知道，老爷。不过我确实看见那个年轻人动过被子，就是领走孩子的那个人。
        - id: ch01-b28
          speaker: miles_hendon
          text: 真该死！他分明是在骗我，好多争取一点时间。听着，那个年轻人是独自来的吗？
          emotion: angry
        - id: ch01-b29
          speaker: inn_servant
          text: 是一个人来的，老爷。
        - id: ch01-b30
          speaker: miles_hendon
          text: 你确定？
        - id: ch01-b31
          speaker: inn_servant
          text: 确定，老爷。
        - id: ch01-b32
          speaker: miles_hendon
          text: 把你那散乱的脑子拢起来，仔细想一想。慢慢想，不要急。
        - id: ch01-b33
          speaker: narrator
          text: 仆人想了一会儿，终于又记起一点事情。
        - id: ch01-b34
          speaker: inn_servant
          text: 他来的时候，身边确实没人。不过现在我想起来了，他们两个走进桥上的人群时，有个模样像恶棍的男人，突然从附近什么地方蹿了出来。那人眼看就要跟他们会合了。
        - id: ch01-b35
          speaker: miles_hendon
          text: 然后怎么了？快说！
          emotion: angry
        - id: ch01-b36
          speaker: inn_servant
          text: 就在那时，人潮一下把他们吞没了，四周又合拢起来，我什么也看不见。偏偏主人又叫我过去。他大发雷霆，因为代书人点的烤肉忘了预备。可我敢请众圣作证，把这件差错怪到我身上，就像把尚未出生的婴儿拉去审判，硬说他犯了还没有犯下的罪一样荒唐。
        - id: ch01-b37
          speaker: miles_hendon
          text: 滚出我的眼前，蠢材！你这张废话连篇的嘴快把我逼疯了！站住，你又往哪儿跑？连一会儿也待不住吗？他们是往萨瑟克去的？
          emotion: angry
        - id: ch01-b38
          speaker: inn_servant
          text: 正是，老爷。我刚才说过，那块可恶的烤肉出了差错。尚未出生的婴儿，绝不可能比小人更加清白。
        - id: ch01-b39
          speaker: miles_hendon
          text: 你怎么还在这里，还说个不停？快滚，不然我掐死你！
          emotion: angry
        - id: ch01-b40
          speaker: narrator
          text: 仆人一溜烟逃了。亨顿紧跟着冲出房间，从他身边掠过，一步跨两级楼梯，飞奔下楼。他认定这件事是那个卑鄙恶棍干的，就是那个声称自己是孩子父亲的人。想到可怜的疯癫小主人就这样被自己弄丢，而自己已经如此喜欢那个孩子，亨顿心里一阵难受。可他立刻发誓，凭圣经和圣钟作证，男孩没有丢。他会翻遍全国，直到重新把人找到。孩子的早饭还留在那里，自己的早饭也一样，可亨顿现在毫无胃口。就让老鼠吃去吧。眼下只有一件事要做，那就是快，快去追。
        - id: ch01-b41
          speaker: narrator
          text: 亨顿在人声鼎沸的桥上飞快挤过人群。一路上，他不止一次抓住同一个念头，仿佛那是最叫人欣慰的证据。男孩虽然抱怨，却还是去了，因为他以为那是迈尔斯·亨顿叫他去的。这个可爱的孩子，换作别人，他绝不会去。亨顿对此深信不疑。
