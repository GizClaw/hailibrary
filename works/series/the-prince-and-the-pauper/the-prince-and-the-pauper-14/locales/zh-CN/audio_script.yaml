audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    tom_canty:
      display_name: 汤姆·康蒂
      tts:
        delivery: 天真敏捷，窘迫时带着平民孩子的直率
        timbre: 清亮稚嫩
        pace: 轻快灵活
        pitch: 中高
    lord_bedchamber:
      display_name: 掌寝大臣
      tts:
        delivery: 恭敬谨慎，严格遵循宫廷礼数
        timbre: 清润稳重
        pace: 徐缓
        pitch: 中等
    dwarf:
      display_name: 侏儒
      tts:
        delivery: 神秘亲切，语气笃定
        timbre: 尖细而温和
        pace: 不紧不慢
        pitch: 高
    mother_canty:
      display_name: 康蒂太太
      tts:
        delivery: 慈爱质朴，情感真挚
        timbre: 柔和略带疲惫
        pace: 舒缓
        pitch: 中等
    chief_equerry:
      display_name: 马政大臣
      tts:
        delivery: 庄重拘谨，遇到失仪时极度惊恐
        timbre: 浑厚
        pace: 缓慢
        pitch: 中低
    hertford:
      display_name: 赫特福德勋爵
      tts:
        delivery: 老练克制，对国王始终恭谨而婉转
        timbre: 沉稳饱满
        pace: 从容
        pitch: 中低
    state_secretary:
      display_name: 国务秘书
      tts:
        delivery: 正式严谨，宣读时不带私情
        timbre: 清晰平稳
        pace: 均匀
        pitch: 中等
    humphrey_marlow:
      display_name: 汉弗莱·马洛
      tts:
        delivery: 恭顺机敏，谈及生计时诚恳急切
        timbre: 清秀的少年声线
        pace: 适中略快
        pitch: 中高
  chapters:
    - id: ch01
      title: 一场破碎的美梦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 同一天清晨，天快亮时，汤姆·康蒂从沉睡中醒来。他在黑暗里静静躺了一会儿，拼命想理清脑中混乱的印象。突然，他惊喜地压低声音喊了起来。
        - id: ch01-b02
          speaker: tom_canty
          text: 我全明白了！感谢上帝，我终于醒了。南！贝特！快从草铺上起来，到我身边听听。我做了一场古怪透顶的疯梦，连黑夜里的鬼魂也未必变得出来！
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: 一个模糊的身影来到床边。
        - id: ch01-b04
          speaker: lord_bedchamber
          text: 请陛下降旨。
        - id: ch01-b05
          speaker: tom_canty
          text: 降旨？我认得你的声音。快告诉我，我究竟是谁？
          emotion: fearful
        - id: ch01-b06
          speaker: lord_bedchamber
          text: 昨夜，您还是威尔士亲王。今日，您已经是微臣最仁慈的君主，英格兰国王爱德华了。
        - id: ch01-b07
          speaker: narrator
          text: 汤姆把头埋进枕头，痛苦地咕哝着。
        - id: ch01-b08
          speaker: tom_canty
          text: 唉，原来那不是梦。好先生，你去歇着吧，留我一个人受苦。
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: 汤姆又睡着了。这一回，他梦见夏天的好人田。他正独自玩耍，一个只有一英尺高、长着红胡子和驼背的侏儒忽然出现，叫他去树桩边挖。汤姆照做了，竟挖出十二枚崭新的便士。对他来说，那简直是一笔巨大的财富。
        - id: ch01-b10
          speaker: dwarf
          text: 我知道你是个善良的好孩子。你的苦日子到头了。从今以后，每逢第七天就来这里挖，每次都能找到十二枚新便士。别告诉任何人，一定要守住秘密。
        - id: ch01-b11
          speaker: narrator
          text: 侏儒消失了。汤姆带着钱飞奔回残渣院。他一路算着，每晚要给父亲一便士。父亲会以为那是讨来的，心里一高兴，就不会再打他。教他读书的好神父每周也能得到一枚。十二枚钱里剩下的四枚，便全部给妈妈、南和贝特。他仿佛已经看见一家人将从此告别饥饿和破衣，再也不用害怕，不用发愁，也不用再受残暴的欺负。
        - id: ch01-b12
          speaker: narrator
          text: 梦里，汤姆气喘吁吁地跑回家，欢喜又感激。他把四枚便士抛进母亲怀里。
        - id: ch01-b13
          speaker: tom_canty
          text: 全都给你！给你、南和贝特。这些钱来得正当，不是讨的，也不是偷的！
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: 母亲又惊又喜，紧紧抱住了他。可她开口时，说出的却是另一句话。
        - id: ch01-b15
          speaker: mother_canty
          text: 时辰不早了。请陛下起身吧。
        - id: ch01-b16
          speaker: narrator
          text: 这根本不是汤姆等待的回答。梦断了。他睁开眼，看见华服的掌寝大臣跪在床边。屋里站满披着紫色丧服的廷臣和贵族仆从。美梦的喜悦消失了。可怜的孩子明白，自己依旧既是囚徒，又是国王。
    - id: ch02
      title: 国王穿衣
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 穿衣这件大事开始了。廷臣们一个接一个跪下，一边向小国王表示丧父之痛的慰问，一边办理穿衣的仪式。一件衬衫先由当值的马政大臣拿起，交给首席猎犬官。猎犬官再交给第二掌寝绅士，接着是温莎森林总管、第三便器侍从、兰开斯特公国王室大臣、宫廷衣库总管、诺洛伊纹章院长、伦敦塔长、宫廷总管、世袭御前餐巾官、英格兰海军统帅和坎特伯雷大主教。最后，衬衫才落到掌寝大臣手里。
        - id: ch02-b02
          speaker: narrator
          text: 掌寝大臣把经过这一路传递后还剩下的衬衫穿到汤姆身上。小家伙看得目瞪口呆，只觉得这像极了失火时人们排队传水桶。可不只衬衫要这样传。每一件衣服都要轮流经过这番缓慢又庄严的仪式，然后才能穿到国王身上。汤姆很快就被折腾得精疲力竭。终于看见长长的丝袜在队列中开始传递，他知道快要穿完了，感激得简直想哭。可他高兴得太早了。
        - id: ch02-b03
          speaker: narrator
          text: 掌寝大臣接过袜子，正要往汤姆腿上套，脸色却忽然涨得通红。他惊骇地指着袜子上某个地方，赶紧把它塞回坎特伯雷大主教手中，叫大主教快看。大主教先发白，随即又发红，转手交给海军统帅，同样叫他快看。统帅几乎喘不上气，又把袜子交给世袭御前餐巾官。就这样，丝袜伴着一路又惊又怕的“快看”，经过宫廷总管、伦敦塔长、纹章院长、衣库总管、兰开斯特王室大臣、便器侍从、温莎森林总管、掌寝绅士和猎犬官，一双手一双手地往回传。最后，它终于又落到马政大臣手中。
        - id: ch02-b04
          speaker: chief_equerry
          text: 我的天！系带上少了一个金属头！把国王长袜的保管官送进伦敦塔！
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: 马政大臣脸色惨白，盯着那个叫所有人惊慌失措的地方看了一会儿。发完命令后，他靠在猎犬官肩上，好让飞散的魂魄重新回来。一双系带完好的新袜子很快送来了。世上一切事总会有尽头，汤姆终于穿戴停当，可以下床。该倒水的官员倒水，该安排洗漱的官员安排洗漱，还有一位官员专管拿毛巾。汤姆好不容易闯过洗漱这一关，又落进御用理发师手中。
        - id: ch02-b06
          speaker: narrator
          text: 御用理发师终于忙完，汤姆走出来时，已经变成一个气派高贵的小君王。他穿着紫缎短裤，披着紫缎斗篷，帽上还插着紫色羽毛。这一番精心打扮，使他漂亮得简直像个女孩。接着，他摆出君王的威仪，在一大群廷臣的簇拥下走向餐厅。他每往前一步，面前的人群便向两边退开，给他让出道路，然后一个接一个地屈膝跪下。
    - id: ch03
      title: 帝国大事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 早餐后，汤姆按照王家礼仪出发，在重臣和五十名镀金战斧侍卫的护送下来到王座厅，开始处理国务。他的“舅舅”赫特福德站在王座旁，随时准备用明智的建议辅助国王。先王指定的那一群显贵遗嘱执行人前来，请新王批准他们已经作出的决定。这大体上是个形式，可因为摄政王还未产生，又不完全是走过场。
        - id: ch03-b02
          speaker: narrator
          text: 坎特伯雷大主教报告了先王葬礼的安排，接着念起执行人的名字。他从自己念起，然后是英格兰大法官、威廉·圣约翰勋爵、约翰·罗素勋爵、爱德华·赫特福德伯爵、约翰·莱斯尔子爵，还有达勒姆主教卡斯伯特。可汤姆根本没有听这份名单。文件前面有句话让他想不通，于是他转向赫特福德。
        - id: ch03-b03
          speaker: tom_canty
          text: 他说葬礼定在哪一天？
        - id: ch03-b04
          speaker: hertford
          text: 下个月十六日，陛下。
        - id: ch03-b05
          speaker: tom_canty
          text: 这也太糊涂了。尸体能放到那个时候吗？
          emotion: surprised
        - id: ch03-b06
          speaker: narrator
          text: 汤姆还不熟悉王家规矩。在残渣院，他见过的穷人尸体总会很快被运走。赫特福德用几句话解除了他的顾虑。接着，一位国务秘书呈上命令，请国王同意在次日十一时接见各国使节。汤姆又望向赫特福德。
        - id: ch03-b07
          speaker: hertford
          text: 陛下只需表示同意。他们奉各自君主的命令前来，要对陛下和英格兰遭逢的大难表示哀悼。
        - id: ch03-b08
          speaker: narrator
          text: 汤姆照做了。另一位秘书又开始宣读宫廷账目。先王的宫廷在过去六个月花了二万八千英镑。汤姆从未想象过这样的巨款，听得倒吸一口凉气。接着，他听说这笔钱里有两万英镑还欠着没付，又吸了一口凉气。等听到国库已经差不多空了，国王手下的一千二百名仆役还在等着被拖欠的工钱，他第三次倒吸凉气，连心都悬了起来。
        - id: ch03-b09
          speaker: tom_canty
          text: 看来我们就要完蛋了。咱们应该换一所小房子，再把仆人们打发走。他们除了拖拉，就只会用那些又烦人又丢脸的规矩折腾人。只有没脑子又没手、什么也做不了的玩偶，才需要这样侍候。我记得比利恩斯门的鱼市场对面，就有一所小房子……
        - id: ch03-b10
          speaker: narrator
          text: 赫特福德及时在汤姆手臂上重重捏了一下。汤姆立刻住口，涨红了脸。在场的人却个个面不改色，仿佛根本没听见这番怪话。
        - id: ch03-b11
          speaker: state_secretary
          text: 先王的遗嘱规定，赫特福德伯爵将受封为公爵，他的弟弟托马斯·西摩尔爵士将进入贵族之列，他的儿子也将受封为伯爵。王室其他重要仆从也有相似的封赏。委员会将在二月十六日举行正式会议，宣告并确认这些荣誉。先王虽然没有留下地产赐予的书面命令，委员会却知道他的私下心愿，也认为应该照着这份心愿去做。因此，西摩尔应得年收入五百英镑的土地。赫特福德的儿子应得年收入八百英镑的土地，再从下一处空缺的主教领地中分得年收入三百英镑的部分。这些尚需陛下批准。
        - id: ch03-b12
          speaker: narrator
          text: 汤姆差点脱口而出，说应当先还清先王的债，然后才能把这么多钱拿去封赏别人。细心的赫特福德又及时碰了碰他的手臂，救他避免了这番失言。于是汤姆一声不吭地批准了，心里却很不舒服。他坐在王座上，想着自己竟然只需点点头，就能创造这些古怪又闪闪发光的奇迹。这时，一个好主意忽然闪进他脑中。为什么不封母亲做残渣院公爵夫人，再赐给她一处庄园呢？
        - id: ch03-b13
          speaker: narrator
          text: 这个念头刚出现，就被一个悲哀的念头冲走了。汤姆只是个有名无实的国王。这些庄重的老臣和显赫的贵族看似在服侍他，其实才是他的主人。在他们看来，汤姆的母亲并不真实存在，只是他那颗病乱的脑袋幻想出的人。如果汤姆把这项打算说出来，他们只会怀疑地听着，然后派人去请医生。
        - id: ch03-b14
          speaker: narrator
          text: 枯燥的国务继续下去，迟缓得仿佛永远没有尽头。请愿书、公告和特许状，还有各种有关国家事务的文件，一份接一份地念着。每一份都冗长、重复，叫人听了就生厌。汤姆坐在王座上，觉得那些声音既沉闷又遥远。最后，他终于可怜巴巴地叹了口气。
        - id: ch03-b15
          speaker: tom_canty
          text: 我究竟做错了什么？上帝为什么要把我从田野、自由的空气和阳光里带走，把我关在这里，逼我做国王，受这样的罪？
          emotion: sad
        - id: ch03-b16
          speaker: narrator
          text: 汤姆糊里糊涂的小脑袋晃了一会儿，慢慢垂到肩上。国王睡着了，没人能够批准文件，帝国大事也只好停下。孩子身边一片寂静，王国的贤者们也不再讨论了。
    - id: ch04
      title: 世袭挨打童
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 上午，汤姆的两位看管者赫特福德和圣约翰给了他一点自由。他同伊丽莎白公主和小珍·格雷女士愉快地相处了一个钟头。只是王室刚刚遭逢沉重打击，两位公主的情绪都有些低落。这次相聚结束时，汤姆那位日后被历史称为“血腥玛丽”的“大姐”，又同他进行了一场庄重得令人心冷的会谈。在汤姆看来，这场会谈唯一的好处就是很短。
        - id: ch04-b02
          speaker: narrator
          text: 汤姆刚独处几分钟，一个约莫十二岁、身材纤细的少年就获准走了进来。少年除了雪白的硬领和袖口蕾丝，从紧身上衣到长袜都是黑色。他身上没有别的丧服标志，只在肩头系了一结紫丝带。他低着头，手里拿着帽子，迟疑地走上前，然后在汤姆面前单膝跪下。汤姆没有马上开口，只是严肃地打量了他一会儿。
        - id: ch04-b03
          speaker: tom_canty
          text: 起来吧。你是谁？来找我有什么事？
        - id: ch04-b04
          speaker: humphrey_marlow
          text: 陛下一定还记得我。我是您的挨打童。
        - id: ch04-b05
          speaker: tom_canty
          text: 我的挨打童？
          emotion: surprised
        - id: ch04-b06
          speaker: humphrey_marlow
          text: 正是，陛下。我叫汉弗莱·马洛。
        - id: ch04-b07
          speaker: narrator
          text: 汤姆立刻意识到，看管他的人本该事先提到这少年。眼下的处境很棘手。如果假装认识，自己每说一句，都会暴露从未听说过这个人。可如果直接说不认识，又会出麻烦。他转念一想，赫特福德和圣约翰都是遗嘱执行委员会的成员，日后经常会被紧急公事叫走，类似的麻烦一定还会出现。不如自己想出一个应急的办法，现在就拿这少年试一试。于是，他装出困惑的样子，摸了摸额头。
        - id: ch04-b08
          speaker: tom_canty
          text: 我好像有点想起你了。只是病痛让我的头脑变得迟钝。
        - id: ch04-b09
          speaker: humphrey_marlow
          text: 唉，我可怜的主人！
          emotion: sad
        - id: ch04-b10
          speaker: narrator
          text: 汉弗莱心里暗想，传言果然是真的，国王的神智已经失常。可他马上又想起，别人特意告诫过，绝不能显出自己看见陛下有什么不对。
        - id: ch04-b11
          speaker: tom_canty
          text: 这些日子，我的记性常常戏弄我。不过它好得很快。只要给我一点提示，我就能想起那些忘掉的事和名字。你说吧，来找我是为了什么？
        - id: ch04-b12
          speaker: narrator
          text: 汤姆心里还在暗暗得意。用这个办法，就算是从未听过的事，他也能够“想”起来。
        - id: ch04-b13
          speaker: humphrey_marlow
          text: 只是一件小事，陛下。两天前的早课上，您的希腊文连错了三处。您还记得吗？
        - id: ch04-b14
          speaker: tom_canty
          text: 是的……我想我记得。对，现在我想起来了。你继续说吧。
        - id: ch04-b15
          speaker: narrator
          text: 汤姆觉得这不算撒了太大的谎。如果自己当真学过希腊文，出错绝不会只有三处，而会有四十处。
        - id: ch04-b16
          speaker: humphrey_marlow
          text: 老师说功课做得又马虎又愚蠢，气得不得了。他说，要把我狠狠打一顿。所以……
        - id: ch04-b17
          speaker: tom_canty
          text: 打你？明明是我犯了错，他为什么要打你？
          emotion: surprised
        - id: ch04-b18
          speaker: humphrey_marlow
          text: 陛下又忘了。只要您的功课出错，老师总会抽打我。
        - id: ch04-b19
          speaker: tom_canty
          text: 对，我忘了。你私下教我，所以我要是学不好，老师就认为你没尽到职责。
        - id: ch04-b20
          speaker: humphrey_marlow
          text: 陛下怎么会这么说？我只是您最卑微的仆人，怎么敢教您？
          emotion: surprised
        - id: ch04-b21
          speaker: tom_canty
          text: 那你究竟错在哪里？这是什么谜？到底是我疯了，还是你疯了？快说明白。
        - id: ch04-b22
          speaker: humphrey_marlow
          text: 陛下，这事没有什么谜。没有人可以殴打威尔士亲王尊贵的身体。所以亲王犯错，就由我挨打。这很公平，因为它就是我的职业，我要靠它过活。
        - id: ch04-b23
          speaker: narrator
          text: 汤姆盯着这个一脸平静的少年，暗暗惊叹天下竟然有这样古怪的行当。他实在想不通，一个人竟能专门靠替别人挨打谋生，还觉得这完全公平。接着，他又奇怪起来，宫里既然能想出这种办法，怎么没有雇个孩子，替自己承受梳头和穿衣的折磨。如果真能这样换换，汤姆宁愿自己挨鞭子，还要感谢上帝给他换了一份好差事。
        - id: ch04-b24
          speaker: tom_canty
          text: 可怜的朋友，那么老师已经照说过的打你了吗？
        - id: ch04-b25
          speaker: humphrey_marlow
          text: 还没有，陛下。我原定今天受罚，可王室正在服丧，这顿打也许会因为不合时宜而取消。我不知道会怎样，所以斗胆来提醒陛下，您曾答应要替我求情。
        - id: ch04-b26
          speaker: tom_canty
          text: 向老师求情，免你挨打？
        - id: ch04-b27
          speaker: humphrey_marlow
          text: 啊，您记起来了！
          emotion: happy
        - id: ch04-b28
          speaker: tom_canty
          text: 你看，我的记性正在好转。放心吧，你的背不会挨一下鞭子。这件事由我来办。
        - id: ch04-b29
          speaker: humphrey_marlow
          text: 谢谢仁慈的陛下！我大概已经冒昧得太过分了。可是……
          emotion: happy
        - id: ch04-b30
          speaker: narrator
          text: 汉弗莱又跪了下去，说到一半就犹豫起来。汤姆鼓励他继续，还说自己此刻正想赏人。
        - id: ch04-b31
          speaker: humphrey_marlow
          text: 那我就说了。这件事一直压在我心上。您如今已是国王，想怎么安排都可以，没人能说不。您当然不会继续用枯燥的功课折磨自己，只会烧掉书本，去做轻松的事。可那样一来，我和我那几个没有父母的姐妹就全完了！
        - id: ch04-b32
          speaker: tom_canty
          text: 全完了？为什么？
        - id: ch04-b33
          speaker: humphrey_marlow
          text: 陛下，我靠这张背吃饭！它要是闲着，我就得挨饿。您不再学习，就不再需要挨打童，我的差事也没了。求您别赶我走！
          emotion: fearful
        - id: ch04-b34
          speaker: narrator
          text: 少年的诉苦打动了汤姆。他立刻拿出国王的气派，慨然许下恩典。
        - id: ch04-b35
          speaker: tom_canty
          text: 别再担心了。这份差事将由你和你的子孙永远世袭。
        - id: ch04-b36
          speaker: narrator
          text: 汤姆用剑身在少年肩上轻轻一拍。
        - id: ch04-b37
          speaker: tom_canty
          text: 起来吧，汉弗莱·马洛，英格兰王室世袭挨打童大官！别再发愁。我会重新拿起书本，还要把功课学得糟透了，叫你的差事繁重三倍。他们为了公平，就必须给你三倍工钱。
        - id: ch04-b38
          speaker: humphrey_marlow
          text: 谢谢最尊贵的陛下！这样的王家厚赐，比我最疯狂的富贵美梦还要奢华。从今往后，我一生都会幸福，马洛家世世代代也都会幸福。
          emotion: happy
        - id: ch04-b39
          speaker: narrator
          text: 汤姆看出汉弗莱很有用，便鼓励他继续聊。汉弗莱也一点都不排斥这件事。他相信自己正在帮助国王恢复神智，因此说得非常起劲。他把国王在王家教室里的功课和经历，还有在宫中其他地方发生的事，一件一件地讲给汤姆听。每当汉弗莱说完一件，他就会惊喜地发现，这些详情已经唤醒了国王病乱的头脑。因为接下来，汤姆已经能把那件事“回想”得清清楚楚。
        - id: ch04-b40
          speaker: narrator
          text: 一个钟头后，汤姆的脑子里已经装满了有关宫廷人物和事务的宝贵消息。他看出这个源头不能浪费，便决定每天都向汉弗莱学些东西。为此，他要下令，以后只要英格兰的君主没在忙着接见其他人，汉弗莱无论什么时候到来，都可以直接进入国王的私室。汉弗莱刚刚被遣退，赫特福德勋爵就赶了过来，给汤姆带来了更多的麻烦。
        - id: ch04-b41
          speaker: hertford
          text: 枢密院的各位勋爵担心，有人可能已经把陛下健康受损的夸大消息泄露出去，而且消息正在外面传播。因此，请陛下在一两天后开始公开用膳，这是最明智、也最稳妥的办法。届时，人们会亲眼看见您面色健康，步伐矫健。您只需要小心维持沉着而自在的神态，举止优雅得体。如果那些恶意的流言当真已经传开，这些亲眼所见的事，也会比任何其他办法更能平息万民的不安。
        - id: ch04-b42
          speaker: narrator
          text: 伯爵接着小心地教导汤姆，公开用膳这种庄重场合应该遵守什么礼仪。他当然不能直说国王什么都不知道，所以只能勉强掩饰，装成在“提醒”陛下回想早已熟悉的事。让伯爵非常高兴的是，汤姆在这方面几乎不需要帮助。原来汉弗莱已从宫中传得飞快的闲言碎语里，听说国王几天后就要开始公开用膳，并把相关礼仪讲给了汤姆。汤姆却小心地把这些事实藏在心里，没有向伯爵透露一句。
        - id: ch04-b43
          speaker: narrator
          text: 伯爵见国王的记性大有起色，便壮着胆子，装作随口聊天，又试了几个问题，想知道陛下究竟恢复到什么程度。结果有时好，有时坏。只要走到汉弗莱已经留下足迹的地方，汤姆就能答得不错。总的来说，伯爵对结果非常满意，也大受鼓舞。他甚至开始相信，国王只要再努力一点，就能想起一件更重要的事。于是，他用充满希望的语气开了口。
        - id: ch04-b44
          speaker: hertford
          text: 现在微臣相信，陛下只要再努力回想一下，就能解开王国大印之谜。它失踪在昨日还是大事，今日却已无关紧要，因为先王驾崩之后，它的使命也结束了。陛下可愿试试？
        - id: ch04-b45
          speaker: narrator
          text: 汤姆完全摸不着头脑。他连王国大印是什么都不知道。迟疑了一会儿，他天真地抬起头。
        - id: ch04-b46
          speaker: tom_canty
          text: 大人，它是什么样子的？
        - id: ch04-b47
          speaker: narrator
          text: 伯爵几乎无人察觉地惊了一下。他暗暗叹息，陛下的神智又飞走了。既然他的头脑还不能受力，自己就不该鼓动他勉强去回想。这实在不是明智之举。不过，伯爵没有显出一点异样，也没有让汤姆继续回答。他巧妙地转开话题，说起别的事情，想让汤姆忘掉刚才的问题，将那枚不吉利的大印从他的念头里彻底扫出去。这个目的很容易就达到了。
