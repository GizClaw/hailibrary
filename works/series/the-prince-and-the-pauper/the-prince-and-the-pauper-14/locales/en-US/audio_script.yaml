  chapters:
    - id: ch01
      title: "‘Le Roi est mort--vive le Roi.’"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Near daylight that same morning, Tom Canty stirred from a heavy sleep and opened his eyes in the dark. For a few moments he lay still, trying to make sense of the confused thoughts in his head. Then understanding seemed to strike him all at once.
        - id: ch01-b02
          speaker: tom_canty
          text: >-
            I understand it now! Thank God, I'm truly awake at last. Sorrow is gone, and joy has come! Nan! Bet! Get off your straw and come here. You must hear the wildest dream the spirits of night ever made to amaze a man. Nan! Bet!
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: >-
            A shadowy figure appeared beside him.
        - id: ch01-b04
          speaker: gentleman_bedchamber
          text: >-
            Will Your Majesty give me your commands?
        - id: ch01-b05
          speaker: tom_canty
          text: >-
            Commands? Oh, no. I know that voice. Tell me, then. Who am I?
          emotion: fearful
        - id: ch01-b06
          speaker: gentleman_bedchamber
          text: >-
            Last night you were the Prince of Wales. Today you are my gracious lord Edward, King of England.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Tom buried his head in the pillows and spoke in a miserable murmur.
        - id: ch01-b08
          speaker: tom_canty
          text: >-
            Then it wasn't a dream. Go back to your rest, good sir. Leave me alone with my sorrow.
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: >-
            Tom fell asleep again, and this time a pleasant dream came to him. It was summer. He was alone in the green meadow called Goodman's Fields when a dwarf suddenly appeared. The little man stood only a foot high. He had long red whiskers and a bent back.
        - id: ch01-b10
          speaker: dream_dwarf
          text: >-
            Dig beside that stump.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Tom dug there and found twelve bright new pennies. To him, they were an astonishing fortune. Better still, the dwarf had more to say.
        - id: ch01-b12
          speaker: dream_dwarf
          text: >-
            I know you. You're a good and deserving boy, and your troubles end today. Dig here every seventh day, and you'll always find the same treasure: twelve bright new pennies. Tell no one. Keep it secret.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The dwarf vanished. Tom raced toward Offal Court with his treasure, planning as he ran.
        - id: ch01-b14
          speaker: tom_canty
          text: >-
            I'll give Father a penny every night. He'll think I begged it, and he'll be pleased, so he won't beat me anymore. Each week the good priest who teaches me shall have one penny. Mother, Nan, and Bet can share the other four. No more hunger or rags for us. No more fear or cruel treatment.
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: >-
            In the dream he reached his miserable home breathless, his eyes shining with gratitude. He threw four pennies into his mother's lap.
        - id: ch01-b16
          speaker: tom_canty
          text: >-
            They're all for you, Mother! Every one of them is for you and Nan and Bet. I got them honestly. I didn't beg or steal them!
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: >-
            His delighted, astonished mother pulled him tightly to her breast.
        - id: ch01-b18
          speaker: mother_canty
          text: >-
            It is growing late. Will Your Majesty please rise?
        - id: ch01-b19
          speaker: narrator
          text: >-
            That was not the answer Tom expected. The dream broke apart, and he was awake. The richly dressed First Lord of the Bedchamber knelt beside his couch. All the joy of that false dream faded. The poor boy understood that he was still a captive and still a king. Beyond the heavy silk curtains stood a roomful of courtiers and royal servants. Every one of them wore the purple of mourning.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Tom sat up, and the great ceremony of dressing him began. One courtier after another knelt to honor the little King and offer sympathy for his loss. Meanwhile, his shirt started a long journey. The Chief Equerry in Waiting handed it to the First Lord of the Buckhounds. From there it passed through the hands of the Second Gentleman of the Bedchamber, the Head Ranger of Windsor Forest, the Third Groom of the Stole, the Chancellor Royal of the Duchy of Lancaster, and the Master of the Wardrobe.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The shirt traveled on to Norroy King-at-Arms, the Constable of the Tower, the Chief Steward of the Household, the Hereditary Grand Diaperer, the Lord High Admiral of England, and the Archbishop of Canterbury. At last it reached the First Lord of the Bedchamber, who took what remained of it and put it on Tom. The wondering boy thought it was rather like passing buckets at a fire.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Every piece of clothing had to make the same slow, solemn trip. Tom became thoroughly tired of it. When his long silk hose finally began moving down the line, he nearly overflowed with gratitude. Surely the ceremony was almost done. He celebrated too soon. The First Lord of the Bedchamber received the hose and prepared to put them on him. Then the man's face flushed. He stared at something on the hose and hurriedly pushed them back toward the Archbishop.
        - id: ch01-b23
          speaker: gentleman_bedchamber
          text: >-
            Look, my lord!
          emotion: surprised
        - id: ch01-b24
          speaker: narrator
          text: >-
            The Archbishop went pale, then red. He passed the hose to the Lord High Admiral.
        - id: ch01-b25
          speaker: archbishop_canterbury
          text: >-
            Look at this, my lord!
          emotion: surprised
        - id: ch01-b26
          speaker: narrator
          text: >-
            The Admiral barely had breath enough to send the hose on to the Hereditary Grand Diaperer.
        - id: ch01-b27
          speaker: lord_high_admiral
          text: >-
            Look, my lord!
          emotion: surprised
        - id: ch01-b28
          speaker: narrator
          text: >-
            Back through the entire line the hose went. Each horrified courtier whispered, "Look! Look!" until they reached the Chief Equerry in Waiting. He gazed at the cause of all this terror, his face drained of color.
        - id: ch01-b29
          speaker: chief_equerry
          text: >-
            Upon my life, one of the strings has lost its metal tip! Send the Head Keeper of the King's Hose to the Tower!
          emotion: fearful
        - id: ch01-b30
          speaker: narrator
          text: >-
            Then he leaned against the First Lord of the Buckhounds to recover his strength while fresh hose were brought, with every string safely undamaged.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Even that ceremony ended at last, and Tom was allowed out of bed. One official poured the water, another managed the washing, and a third waited with the towel. Once Tom had safely survived being cleaned, the royal hairdresser took charge. He emerged looking graceful and almost as pretty as a girl, dressed in purple satin mantle and trunks, with purple feathers in his cap.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Tom moved in state toward the breakfast room. The assembled court drew back to clear his path, then dropped to its knees as he passed. After breakfast, great officers escorted him with full royal ceremony to the throne room. His guard included fifty Gentlemen Pensioners carrying gilded battle-axes. Tom sat down to conduct the nation's business, while his "uncle," Lord Hertford, stood beside the throne to guide him.
        - id: ch01-b33
          speaker: narrator
          text: >-
            The distinguished men appointed as the late King's executors came to ask Tom to approve their decisions. It was mostly a formality, though not entirely, because no Protector had yet been chosen. The Archbishop of Canterbury reported the executors' plans for the late King's funeral. Then he began reading their names and titles, one after another.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Tom was not listening. Something earlier in the document still puzzled him. He leaned toward Hertford and whispered.
        - id: ch01-b35
          speaker: tom_canty
          text: >-
            What date did he choose for the burial?
        - id: ch01-b36
          speaker: lord_hertford
          text: >-
            The sixteenth of next month, Your Majesty.
        - id: ch01-b37
          speaker: tom_canty
          text: >-
            That's foolishly late. Will the body keep until then?
          emotion: surprised
        - id: ch01-b38
          speaker: narrator
          text: >-
            Tom knew nothing of royal customs. In Offal Court, the poor dead were hurried away much sooner. Hertford quietly gave him a few words of reassurance.
        - id: ch01-b39
          speaker: secretary_council
          text: >-
            The Council appoints tomorrow at eleven for Your Majesty to receive the foreign ambassadors. We ask for the King's consent.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Tom looked questioningly at Hertford.
        - id: ch01-b41
          speaker: lord_hertford
          text: >-
            Your Majesty should consent. The ambassadors come to express their royal masters' sorrow over the calamity that has struck you and England.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Tom gave the answer he had been told to give. Another secretary began reading about the late King's household expenses. In only six months, they had reached twenty-eight thousand pounds. Tom gasped. Twenty thousand pounds remained unpaid, so he gasped again. Then he learned that the royal treasury was nearly empty and twelve hundred servants were in difficulty because their wages were overdue.
        - id: ch01-b43
          speaker: tom_canty
          text: >-
            We're plainly headed for ruin! We must move into a smaller house and dismiss the servants. They do nothing but slow everything down with tiresome duties fit only for a doll that has no mind or hands of its own. I remember a little house across from the fish market near Billingsgate—
          emotion: fearful
        - id: ch01-b44
          speaker: narrator
          text: >-
            A sharp squeeze on his arm stopped him. Tom blushed, but not one face in the room showed that anyone had noticed his astonishing speech.
        - id: ch01-b45
          speaker: secretary_council
          text: >-
            The late King intended to make the Earl of Hertford a duke, raise his brother Sir Thomas Seymour to the peerage, and make Hertford's son an earl. He also wished to grant honors to other great servants of the Crown. The Council will meet on the sixteenth of February to confirm these titles. No written grants of land were made to support them. Knowing the late King's private wishes, the Council proposes five hundred pounds' worth of land for Seymour. Hertford's son is to receive eight hundred pounds' worth, with three hundred pounds' worth from the next bishop's lands that become vacant, if His Majesty agrees.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Tom nearly demanded that the dead King's debts be paid before all this money was handed out. Another timely touch from Hertford kept that dangerous thought inside his head. Tom gave his royal consent, though he felt deeply uneasy.
        - id: ch01-b47
          speaker: narrator
          text: >-
            For a moment he marveled at how easily he could perform such strange, glittering miracles. Then a happy idea came to him. Why not make his own mother Duchess of Offal Court and give her an estate? The thought died at once. He was a king in name only. These grave old statesmen and powerful nobles were his masters. They believed his mother was merely a creature imagined by his sick mind. If he offered the plan, they would listen in disbelief and send for the doctor.
        - id: ch01-b48
          speaker: narrator
          text: >-
            The dreary business dragged on. They read petitions, proclamations, patents, and every kind of long, repetitive paper about public affairs. At last Tom sighed and muttered to himself.
        - id: ch01-b49
          speaker: tom_canty
          text: >-
            What wrong have I done, that God should take me from the fields, the open air, and the sunshine, then lock me in here and punish me by making me a king?
          emotion: sad
        - id: ch01-b50
          speaker: narrator
          text: >-
            His tired head nodded, then sank onto his shoulder. The work of the empire stopped because its royal power of approval had fallen asleep. Silence gathered around the child, and the wise men of the realm ended their discussion.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Later that morning, his keepers Hertford and St. John allowed Tom one pleasant hour with Lady Elizabeth and young Lady Jane Grey. Both princesses were subdued by the terrible loss that had struck the royal family. At the end of their visit, his "older sister," the future Bloody Mary, came for a solemn interview. In Tom's opinion, it had only one good quality: it was short.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Tom had a few moments alone. Then a slender boy of about twelve entered. Except for a snowy ruff and white lace at his wrists, he wore black from head to foot. His only sign of mourning was a knot of purple ribbon on one shoulder. He approached with his head bowed and uncovered, then knelt before Tom. Tom studied him in silence.
        - id: ch01-b53
          speaker: tom_canty
          text: >-
            Get up, lad. Who are you, and what do you want?
        - id: ch01-b54
          speaker: narrator
          text: >-
            The boy rose and stood gracefully, though worry showed in his face.
        - id: ch01-b55
          speaker: humphrey_marlow
          text: >-
            Surely you remember me, my lord. I'm your whipping boy.
        - id: ch01-b56
          speaker: tom_canty
          text: >-
            My whipping boy?
          emotion: surprised
        - id: ch01-b57
          speaker: humphrey_marlow
          text: >-
            Yes, Your Grace. I'm Humphrey Marlow.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Tom realized that his keepers should have warned him about this boy. It was a delicate problem. He could pretend to remember Humphrey, but every word would soon prove that he had never heard of him. Then an idea saved him. Hertford and St. John belonged to the Council of Executors, so affairs of state would often call them away. Accidents like this were likely to happen again. Tom needed his own plan for handling them, and he could practice it now.
        - id: ch01-b59
          speaker: narrator
          text: >-
            He rubbed his forehead and looked puzzled for a moment before he spoke.
        - id: ch01-b60
          speaker: tom_canty
          text: >-
            I almost remember you, but suffering has clouded my mind.
        - id: ch01-b61
          speaker: humphrey_marlow
          text: >-
            Oh, my poor master!
          emotion: sad
        - id: ch01-b62
          speaker: narrator
          text: >-
            Humphrey thought the rumors were true and his master's mind was gone. Then he remembered that he must never appear to notice anything wrong.
        - id: ch01-b63
          speaker: tom_canty
          text: >-
            My memory plays strange tricks these days, but don't worry. I'm improving quickly. One small clue often brings back names and events I've forgotten. Tell me why you've come.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Tom privately added that a clue could even bring back things he had never known. This boy would soon see that for himself.
        - id: ch01-b65
          speaker: humphrey_marlow
          text: >-
            It's only a small matter, Your Majesty. Two days ago, you made three mistakes in your morning Greek lesson. Do you remember?
        - id: ch01-b66
          speaker: tom_canty
          text: >-
            Y-yes, I believe I do.
        - id: ch01-b67
          speaker: narrator
          text: >-
            It was hardly a lie, Tom told himself. If he had ever tried Greek, he would have made forty mistakes instead of three.
        - id: ch01-b68
          speaker: tom_canty
          text: >-
            Yes, I remember now. Go on.
        - id: ch01-b69
          speaker: humphrey_marlow
          text: >-
            The teacher was angry at what he called your careless, foolish work. He promised to give me a hard whipping for it, and—
        - id: ch01-b70
          speaker: tom_canty
          text: >-
            Whip you? Why should you be beaten for my mistakes?
          emotion: surprised
        - id: ch01-b71
          speaker: humphrey_marlow
          text: >-
            Your Grace has forgotten again. He always whips me when you fail at your lessons.
        - id: ch01-b72
          speaker: tom_canty
          text: >-
            Of course, of course. I'd forgotten. You teach me privately, so when I fail, the teacher decides you haven't done your work properly, and—
        - id: ch01-b73
          speaker: humphrey_marlow
          text: >-
            My lord, how could I, the lowest of your servants, ever presume to teach you?
          emotion: surprised
        - id: ch01-b74
          speaker: tom_canty
          text: >-
            Then how can it be your fault? What sort of riddle is this? Is one of us truly mad? Explain it plainly.
        - id: ch01-b75
          speaker: humphrey_marlow
          text: >-
            But, Your Majesty, there's nothing mysterious about it. No one may strike the sacred body of the Prince of Wales. When the prince makes a mistake, I take the blows instead. That's proper, because it's my office and how I earn my living.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Tom stared at the calm boy. What a marvelous and curious trade, he thought. He wondered why the palace had not hired someone to suffer through his combing and dressing too. He would gladly take his own whippings if they made that exchange.
        - id: ch01-b77
          speaker: tom_canty
          text: >-
            And did they beat you as the teacher promised, poor fellow?
        - id: ch01-b78
          speaker: humphrey_marlow
          text: >-
            Not yet, Your Majesty. My punishment was set for today. It may be canceled because we're in mourning, but I don't know. So I dared to come and remind Your Grace that you kindly promised to speak for me.
        - id: ch01-b79
          speaker: tom_canty
          text: >-
            You mean speak to the teacher and save you from the whipping?
        - id: ch01-b80
          speaker: humphrey_marlow
          text: >-
            Ah, you do remember!
          emotion: happy
        - id: ch01-b81
          speaker: tom_canty
          text: >-
            You see? My memory is improving. Don't worry. Your back won't be touched. I'll take care of it.
          emotion: calm
        - id: ch01-b82
          speaker: narrator
          text: >-
            Humphrey dropped to one knee again and thanked him. He said he had probably dared enough already, yet he hesitated as though more remained to be said. Tom encouraged him. The King, he announced, was in a mood to grant requests.
        - id: ch01-b83
          speaker: humphrey_marlow
          text: >-
            Then I'll say it, because it weighs heavily on me. You're King now, not Prince of Wales, and no one can command you. You may soon stop those dreary lessons, burn your books, and choose more pleasant things. If you do, I'll be ruined, and so will my orphan sisters!
          emotion: fearful
        - id: ch01-b84
          speaker: tom_canty
          text: >-
            Ruined? How can that be?
          emotion: surprised
        - id: ch01-b85
          speaker: humphrey_marlow
          text: >-
            My back earns our bread, my lord! If it has no work, I starve. If you give up studying, you won't need a whipping boy, and my office is gone. Please don't send me away!
          emotion: fearful
        - id: ch01-b86
          speaker: narrator
          text: >-
            Humphrey's distress touched Tom. He answered with a truly royal burst of generosity.
        - id: ch01-b87
          speaker: tom_canty
          text: >-
            Trouble yourself no more. You and your family shall hold this office forever.
          emotion: calm
        - id: ch01-b88
          speaker: narrator
          text: >-
            Tom tapped the boy lightly on the shoulder with the flat of his sword.
        - id: ch01-b89
          speaker: tom_canty
          text: >-
            Rise, Humphrey Marlow, Hereditary Grand Whipping-Boy to the Royal House of England! Put away your sorrow. I'll return to my books and study so badly that justice will require them to triple your wages, for your duties will grow enormously.
          emotion: happy
        - id: ch01-b90
          speaker: humphrey_marlow
          text: >-
            Thank you, my noble master! This princely generosity is greater than anything I ever dreamed. Now I shall be happy all my life, and every Marlow after me will be happy too.
          emotion: happy
        - id: ch01-b91
          speaker: narrator
          text: >-
            Tom was clever enough to see that Humphrey could be useful. He encouraged the boy to talk, and Humphrey was delighted to do it. He believed he was helping Tom recover. Each time Humphrey described some event from the royal schoolroom or elsewhere in the palace, Tom could suddenly "remember" it quite clearly.
        - id: ch01-b92
          speaker: narrator
          text: >-
            An hour later, Tom possessed a rich supply of valuable knowledge about the people and affairs of the court. He decided to learn from Humphrey every day. The boy was to be admitted to the King's private room whenever he came, unless His Majesty was occupied with someone else. Humphrey had scarcely left when Lord Hertford arrived with a fresh problem.
        - id: ch01-b93
          speaker: lord_hertford
          text: >-
            The Council fears that exaggerated reports about Your Majesty's poor health may have escaped the palace. In a day or two, it would be wise for you to begin dining in public. Your healthy color and strong step, together with a carefully controlled manner and easy dignity, would quiet the people better than any other plan, if harmful rumors are spreading.
        - id: ch01-b94
          speaker: narrator
          text: >-
            Hertford then carefully taught Tom how to behave at that stately occasion, pretending only to remind him of things he already knew. To Hertford's great delight, Tom needed very little help. Humphrey had heard the swift court gossip that the King would soon dine in public, and he had already explained the ceremony. Tom wisely kept that fact to himself.
        - id: ch01-b95
          speaker: narrator
          text: >-
            The improvement in the royal memory encouraged Hertford to try a few casual tests. Tom did well wherever Humphrey's lessons had left a mark. Overall, Hertford was pleased and hopeful.
        - id: ch01-b96
          speaker: lord_hertford
          text: >-
            I now believe that if Your Majesty presses your memory a little further, you may solve the mystery of the Great Seal. Its loss mattered yesterday, though it no longer matters today, since the late King's death ended its service. Will Your Grace try to remember?
        - id: ch01-b97
          speaker: narrator
          text: >-
            Tom was completely lost. He knew nothing at all about a Great Seal. After hesitating, he looked up with innocent curiosity.
        - id: ch01-b98
          speaker: tom_canty
          text: >-
            What did it look like, my lord?
        - id: ch01-b99
          speaker: narrator
          text: >-
            Hertford gave the smallest start. He thought Tom's wits had deserted him again and blamed himself for making the boy strain his mind. With great skill, he turned the conversation toward other matters. The unfortunate Great Seal soon passed entirely out of Tom's thoughts.
