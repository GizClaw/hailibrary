  chapters:
    - id: ch01
      title: 第十一章　在市政厅
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 御船由华丽的船队簇拥着，庄严地顺泰晤士河而下，从数不清的灯船之间穿过。音乐飘满夜空，两岸的欢庆焰火一起一伏。远处的伦敦城笼在柔和的光里，那是无数看不见的篝火映出来的。细长的尖塔直刺天空，塔身缀着闪烁的灯。从远处望去，它们就像一柄柄镶满珠宝、向天竖起的长矛。船队一路驶过，两岸的欢呼声早已喊得粗哑，却仍然没有停。礼炮也不停闪光，不停轰鸣。
        - id: ch01-b02
          speaker: narrator
          text: 汤姆·坎蒂半陷在丝绸软垫里。眼前的奇景，耳边的声浪，壮丽得叫他说不出话来。可对坐在身旁的伊丽莎白公主和简·格雷小姐来说，这一切根本不算什么。
        - id: ch01-b03
          speaker: narrator
          text: 船队到了道门，便被拖着沿清澈的沃尔布鲁克河逆流而上。后来，这条河道埋进了大片房屋底下，到如今已经消失了两个世纪。他们经过巴克勒斯伯里。岸边的房屋和头顶的桥梁上，全挤着欢庆的人，到处灯火通明。最后，船队停进伦敦古城中心的一处水湾，也就是今天的驳船场。汤姆上岸以后，随着衣饰堂皇的队伍穿过齐普赛街，又走过老犹太街和贝辛霍尔街，很快便来到市政厅。
        - id: ch01-b04
          speaker: narrator
          text: 市长和市议会的元老们全都佩着金链，穿着猩红色礼袍，按照隆重的礼仪迎接汤姆和两位小姑娘。传令官在前面高声宣告，市政权杖和市剑也在前方开道，一行人被引到大厅上首，坐在华美的华盖下面。随侍汤姆和两个小伙伴的贵族男女，就站在他们各自的座椅后。
        - id: ch01-b05
          speaker: narrator
          text: 下首的席桌旁，坐着宫廷显贵、贵族宾客和城中权贵。平民则坐满大厅中央的一张张桌子。巨人歌革与玛各高高站在上方。这两位古城守护者从许多代以前便望着这样的宴会，早已见怪不怪。号角一响，又有人高声宣告。一个胖管事出现在左边墙上的高台，仆从们跟在他身后，庄严地抬来一大块皇家烤牛肉。牛肉热气腾腾，就等着下刀。
        - id: ch01-b06
          speaker: narrator
          text: 祷告完毕，汤姆照着事先的指点站起来，全场也一起起身。他与伊丽莎白公主共饮一只硕大的金杯。杯子又传给简小姐，接着在所有宾客间传了一遍。宴会就这样开始了。
        - id: ch01-b07
          speaker: narrator
          text: 到了午夜，欢宴正热闹。接下来出现的，是那个年代人人爱看的一幕华丽表演。一位亲眼见过它的编年史家，还用当时的古老说法记下了当晚的情景。
        - id: ch01-b08
          speaker: narrator
          text: 众人先让出地方。一位男爵和一位伯爵走进来，两人穿着土耳其式的金线锦长袍，袍子上洒满金饰。头戴深红天鹅绒帽，帽上围着粗大的金带，腰间还用宽阔的金色肩带挂着两把弯刀。接着又来了一位男爵和一位伯爵。他们穿黄色缎子长袍，袍上斜缀白缎，每道白缎之间又有一道深红缎带，这是俄罗斯式样。两人戴着灰色毛皮帽，各拿一把小斧，脚上的长靴尖头上翘，足足有一英尺长。
        - id: ch01-b09
          speaker: narrator
          text: 后面先来一位骑士，再来海军大臣，还有五位贵族跟随。他们穿深红天鹅绒的紧身上衣，前后领口一直低开到锁骨，胸前用银链系住。外面罩着深红缎子短斗篷，头戴舞者式样的帽子，帽上插着野鸡羽毛。他们扮的是普鲁士人。再后面有大约一百名持火炬者，穿着深红和绿色缎衣，脸涂成黑色，扮作摩尔人。随后又来了一队假面演员。乔装的乐师跳起舞，贵族男女也跟着尽情狂舞，场面好看极了。
        - id: ch01-b10
          speaker: narrator
          text: 汤姆坐在高处，目不转睛地看着这场狂舞。衣着艳丽的人影在下方飞快旋转，耀眼的颜色像万花筒一样交织变幻，叫他看得入了迷。就在这个时候，衣衫褴褛却货真价实的小亲王，正在市政厅门外申明自己的权利，诉说所受的冤屈。他斥责那个冒牌货，一定要进去见人。围观的人觉得这出插曲有趣极了，全都向前挤，伸长脖子来看这个闹事的孩子。
        - id: ch01-b11
          speaker: narrator
          text: 很快，人们开始故意挖苦他，嘲笑他。他们只想把亲王激得更生气，好让自己多看一会儿热闹。亲王受尽羞辱，眼里已经涌出泪水，却仍然守在原地，以王者的气概向暴民挑战。讥讽一声接着一声，终于把他刺痛了。
        - id: ch01-b12
          speaker: prince_edward
          text: 我再说一遍！你们这群不懂礼数的恶狗，我就是威尔士亲王！如今我虽然孤苦无依，没有朋友，也没有人在危难中肯帮我一把，可你们休想逼我退让。我绝不会离开这里！
          emotion: angry
        - id: ch01-b13
          speaker: miles_hendon
          text: 你是不是亲王都不要紧。你是个有胆量的好孩子，而且并非没有朋友。迈尔斯·亨顿就站在你身边，这便是证据。你就是跑断两条腿，也未必能找出一个比我更糟的朋友。孩子，先让你的小嘴歇一歇。对付这些阴沟里的下贱耗子，我说起他们的土话可是熟练得很。
        - id: ch01-b14
          speaker: narrator
          text: 这个仗义开口的人，无论衣着、相貌还是神态，都像堂·凯撒·德·巴赞。他个子高挑，身材匀称结实。紧身上衣和短裤本来用了贵重料子，现在却褪色磨破，金边也黯淡无光。轮状皱领又皱又破，软帽上的羽饰折断了，湿软凌乱，看着很不体面。腰间还挂着一柄长剑，插在生锈的铁鞘里。他那大摇大摆的架势，一看就是军营里的浪荡客。人群听了这个古怪人物的话，立刻爆出一阵讥笑。
        - id: ch01-b15
          speaker: heckler_1
          text: 瞧啊，又冒出来一个乔装改扮的亲王！
        - id: ch01-b16
          speaker: heckler_2
          text: 朋友，你可要当心自己的舌头。他说不定是个危险人物呢！
        - id: ch01-b17
          speaker: heckler_3
          text: 他看着可真危险。你们快瞧瞧他的眼睛！
        - id: ch01-b18
          speaker: heckler_4
          text: 把那小崽子从他手里抢过来，再把小崽子扔进饮马池！
        - id: ch01-b19
          speaker: narrator
          text: 这句话才出口，马上有人伸手去抓亲王。陌生人的长剑也在同一瞬间出了鞘。他用剑身重重一拍，那个多事的家伙便砰的一声倒在地上。
        - id: ch01-b20
          speakers: [heckler_1, heckler_2, heckler_3, heckler_4]
          ensemble: chorus
          text: 大家宰了这条狗！杀了他！快杀了他！
          emotion: angry
        - id: ch01-b21
          speaker: narrator
          text: 暴民一齐围向那名武士。亨顿背靠着墙，挥起长剑，像发疯一样左右劈打。挨了剑的人东一个西一个倒下，可后面的人踩过他们的身子，仍旧怒吼着冲上来。亨顿只剩孤身一人，眼看性命不保。就在这时，一声号角突然响起。
        - id: ch01-b22
          speaker: cavalry_herald
          text: 快给国王的信使让开道路！
        - id: ch01-b23
          speaker: narrator
          text: 一队骑兵直冲人群而来。暴民唯恐被马蹄踩中，赶紧使尽力气四散奔逃。亨顿一把抱起亲王，很快就离开了险境，也远离了那群人。
        - id: ch01-b24
          speaker: narrator
          text: 再回到市政厅里。欢呼和喧闹声震得大厅轰轰作响。忽然，一记清亮的号声压过所有声音。刹那间，四周一片寂静。宫里来的信使开口宣读公告，全场的人都站着听。读到最后，他的声音变得格外庄严。
        - id: ch01-b25
          speaker: royal_messenger
          text: 国王已经驾崩！
        - id: ch01-b26
          speaker: narrator
          text: 大厅里所有人一齐低下头，垂到胸前。沉默持续了片刻，他们又同时跪下，向汤姆伸出双手。一阵巨大的高呼猛然爆发，仿佛整座市政厅都在震动。
        - id: ch01-b27
          speakers: [courtier_1, courtier_2, courtier_3, courtier_4]
          ensemble: chorus
          text: 愿我们的国王万岁！
        - id: ch01-b28
          speaker: narrator
          text: 可怜的汤姆被眼前的场面震得发懵。他茫然地望遍大厅，最后先看向跪在身旁的两位公主，又把目光转到赫特福德伯爵身上。忽然，他像是拿定了一个主意，凑到伯爵耳边低声问道。
        - id: ch01-b29
          speaker: tom_canty
          text: 请凭你的忠诚和名誉，老实回答我。要是我在这里颁下一道只有国王才有权颁布的命令，大家也会服从吗？真的不会有人站出来反对？
        - id: ch01-b30
          speaker: earl_hertford
          text: 整个王国都不会有人反对，陛下。英格兰的王权如今就在您一人身上。您已经是国王，您说的话就是法律。
        - id: ch01-b31
          speaker: narrator
          text: 汤姆顿时有了精神。他的声音坚定又恳切，比刚才响亮了许多。
        - id: ch01-b32
          speaker: tom_canty
          text: 那么从今天开始，国王的法律就要讲仁慈，再也不能只会流血！快起来，立刻赶去伦敦塔！告诉那里的人，国王已经下令，绝不能处死诺福克公爵！
        - id: ch01-b33
          speaker: narrator
          text: 这道命令立刻从一张嘴传到另一张嘴，飞快传遍整座大厅。赫特福德匆匆离去时，又一阵震天的欢呼爆发出来。
        - id: ch01-b34
          speakers: [courtier_1, courtier_2, courtier_3, courtier_4]
          ensemble: chorus
          text: 流血的统治已经结束！英格兰国王爱德华万岁！
          emotion: happy
