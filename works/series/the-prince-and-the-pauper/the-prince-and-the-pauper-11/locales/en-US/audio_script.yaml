  chapters:
    - id: ch01
      title: The Banquet at Guildhall
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The royal barge moved slowly down the Thames, surrounded by its splendid fleet. All around it, lighted boats filled the river. Music hung in the air. Bonfires made the banks dance with flame, while the distant city glowed under the night sky. Far above, slim church spires sparkled like jeweled lances. As the fleet passed, cheers rolled from the banks without stopping, and the flash and thunder of cannon followed it downstream.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Tom Canty lay half buried in silk cushions. To him, every sound and every sight was too wonderful for words. But the two young girls beside him, Princess Elizabeth and Lady Jane Grey, had known such splendor all their lives. They saw nothing remarkable in it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At Dowgate, boats towed the fleet into the clear waters of the Walbrook. That stream has been buried beneath London buildings for centuries now, but in Tom's time it still flowed in the open. The barges passed bright houses and crowded bridges, all packed with merry people. At last they stopped in a basin at the place now called Barge Yard, in the heart of the old city.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Tom stepped ashore. His grand procession crossed Cheapside, then marched through Old Jewry and Basinghall Street to Guildhall. There, the Lord Mayor and the Fathers of the City received Tom and the young ladies with every proper ceremony. Gold chains lay across their scarlet robes of state.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Heralds went ahead making proclamations, followed by the city mace and sword. They led Tom, Elizabeth, and Jane beneath a rich canopy at the head of the great hall. Their lords and ladies stood behind their chairs, ready to attend them.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Below them, nobles, court officials, and the great men of the city sat at another table. Common citizens filled many more tables across the hall. High above everyone stood the giants Gog and Magog, the ancient guardians of London. Their wooden eyes had watched feasts like this through generations too old to remember.
        - id: ch01-b07
          speaker: narrator
          text: >-
            A bugle sounded, and a proclamation followed. Then a fat butler appeared on a high platform along the left wall. His servants came behind him in solemn order, carrying a royal baron of beef. It was steaming hot and ready for the knife.
        - id: ch01-b08
          speaker: narrator
          text: >-
            When grace was over, Tom rose as he had been taught, and everyone in the hall stood with him. He drank with Princess Elizabeth from a great golden loving cup. Elizabeth passed it to Lady Jane, and from Jane it traveled through the whole gathering. With that, the banquet began.
    - id: ch02
      title: The Midnight Masquerade
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            By midnight, the celebration was at its wildest. Then came one of the grand shows people loved in those days. A man who witnessed it left a description, and this is what he saw.
        - id: ch02-b02
          speaker: narrator
          text: >-
            First, the crowd made room. A baron and an earl entered in Turkish dress, wearing long robes of rich silk sprinkled with gold. Their hats were crimson velvet, wrapped with thick bands of gold. Each man wore two curved swords hanging from broad golden belts.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Another baron and earl followed, dressed in the Russian fashion. Their long gowns of yellow satin were crossed with bands of white and crimson. Gray fur hats covered their heads. They carried hatchets, and the pointed toes of their boots curled upward for a whole foot.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Next came a knight, the Lord High Admiral, and five nobles dressed as Prussians. They wore crimson velvet doublets cut low at the front and back, with silver chains laced across their chests. Short crimson satin cloaks covered their shoulders. Pheasant feathers nodded from their dancers' hats.
        - id: ch02-b05
          speaker: narrator
          text: >-
            About a hundred torchbearers came after them, dressed in crimson and green like Moors, with their faces blackened. Then came a masked performance. Disguised musicians danced, and soon the lords and ladies were dancing just as wildly. It was a marvelous sight.
        - id: ch02-b06
          speaker: narrator
          text: >-
            From his high seat, Tom stared down in delight. Bright colors spun together like pieces in a turning kaleidoscope as the richly dressed dancers whirled below him. But at that very moment, outside the gates of Guildhall, the ragged boy who was truly the Prince of Wales was demanding justice. He declared his rights, denounced the impostor, and shouted for someone to let him in.
    - id: ch03
      title: The Prince Finds a Friend
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The crowd found the little disturbance wonderfully entertaining. People pushed closer and stretched their necks to see the small rioter. Then they began to mock him on purpose, hoping to drive him into an even greater rage. Tears of shame filled the prince's eyes, but he held his ground and faced the mob with all the courage of a king. More taunts struck him, one after another, until he cried out.
        - id: ch03-b02
          speaker: prince_edward
          text: >-
            I tell you again, you pack of ill-mannered dogs, I am the Prince of Wales! I may be alone and without a friend. No one may offer me a kind word or help me now. But you will not drive me from this place. I will stand my ground!
          emotion: angry
        - id: ch03-b03
          speaker: miles_hendon
          text: >-
            Prince or no prince, it makes no difference to me. You are a brave lad, and you are not friendless. Miles Hendon stands beside you, and you could search a long way before finding a worse friend. Now rest that small jaw of yours, child. I speak the language of these kennel rats as well as any man alive.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The man who said this looked like a soldier from a romantic play. He was tall, lean, and strong. His doublet and short trousers had once been costly, but now they were faded and worn thin. The gold lace was tarnished. His ruff was crushed and damaged, and the broken feather in his drooping hat looked bedraggled and disreputable.
        - id: ch03-b05
          speaker: narrator
          text: >-
            A long rapier hung at his side in a rusty iron sheath. The bold way he carried himself marked him at once as a swaggering soldier. The crowd greeted this strange figure with an explosion of laughter and jeers.
        - id: ch03-b06
          speaker: heckler_1
          text: >-
            Look, here comes another prince in disguise!
        - id: ch03-b07
          speaker: heckler_2
          text: >-
            Guard your tongue, friend. He may be dangerous!
        - id: ch03-b08
          speaker: heckler_3
          text: >-
            Oh, he certainly looks dangerous. Just look at his eye!
        - id: ch03-b09
          speaker: heckler_4
          text: >-
            Tear the boy away from him! Throw the cub in the horse pond!
        - id: ch03-b10
          speaker: narrator
          text: >-
            Someone grabbed the prince at once, delighted with the idea. But Hendon's long sword flashed out just as quickly. He struck the meddler with the flat of the blade and sent him crashing to the ground.
        - id: ch03-b11
          speakers: [heckler_1, heckler_2, heckler_3, heckler_4]
          ensemble: chorus
          text: >-
            Kill the dog! Kill him! Kill him!
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: >-
            The mob rushed Hendon. He backed against a wall and swung his long weapon around him like a madman. Men fell sprawling on every side. Still the human tide poured over them and crashed against him with the same fury. It seemed he could survive only a few moments more.
        - id: ch03-b13
          speaker: narrator
          text: >-
            Then a trumpet blast split the noise.
        - id: ch03-b14
          speaker: royal_messenger
          text: >-
            Make way for the King's messenger!
        - id: ch03-b15
          speaker: narrator
          text: >-
            A troop of horsemen charged straight at the mob. The people ran out of danger as fast as their legs could carry them. Hendon caught the prince up in his arms. In moments, he had carried the boy far from the crowd and safely out of danger.
    - id: ch04
      title: Long Live the King
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Now let us return inside Guildhall. The roar of celebration still filled the great room when one clear bugle note sounded above it. Every voice stopped at once. A deep silence settled over the hall. Then the messenger from the palace began his proclamation, while the whole gathering stood and listened.
        - id: ch04-b02
          speaker: narrator
          text: >-
            At last, the messenger reached his closing words. He spoke them slowly and solemnly.
        - id: ch04-b03
          speaker: royal_messenger
          text: >-
            The King is dead!
        - id: ch04-b04
          speaker: narrator
          text: >-
            Everyone in the great hall bowed their heads. For several moments, no one moved or spoke. Then the whole assembly sank to its knees and reached out toward Tom.
        - id: ch04-b05
          speakers: [assembly_member_1, assembly_member_2, assembly_member_3, assembly_member_4]
          ensemble: chorus
          text: >-
            Long live the King!
        - id: ch04-b06
          speaker: narrator
          text: >-
            The shout was so mighty that it seemed to shake the building. Poor Tom stared in a daze at the astonishing scene. His eyes moved to the kneeling princesses beside him and rested there for a moment. Then he looked at the Earl of Hertford. Suddenly, a purpose came into his face. He leaned close and spoke quietly into Hertford's ear.
        - id: ch04-b07
          speaker: tom_canty
          text: >-
            Answer me honestly, upon your faith and honor. Suppose I gave an order here that only a king has the right and power to give. Would everyone obey it? Would no one dare refuse me?
        - id: ch04-b08
          speaker: earl_hertford
          text: >-
            No one in all these realms would refuse you, my liege. The majesty of England now lives in you. You are the King, and your word is law.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Tom answered in a strong, earnest voice. His whole face came alive.
        - id: ch04-b10
          speaker: tom_canty
          text: >-
            Then from this day forward, the King's law shall be a law of mercy, never again a law of blood! Get up and go at once. Ride to the Tower and tell them the King has decreed that the Duke of Norfolk shall not die!
        - id: ch04-b11
          speaker: narrator
          text: >-
            The command flew eagerly from person to person across the hall. Hertford hurried away to carry it out. Then another enormous shout rose around Tom.
        - id: ch04-b12
          speakers: [assembly_member_1, assembly_member_2, assembly_member_3, assembly_member_4]
          ensemble: chorus
          text: >-
            The reign of blood is ended! Long live Edward, King of England!
