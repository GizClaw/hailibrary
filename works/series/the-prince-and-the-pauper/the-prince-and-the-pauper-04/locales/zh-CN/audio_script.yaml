audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    edward_tudor:
      display_name: 爱德华·都铎
      tts:
        delivery: 自信端正，天真中带着王室威严
        timbre: 明亮清晰
        pace: 中等，激动时加快
        pitch: 中高
    schoolboy_1:
      display_name: 慈幼院男孩甲
      tts:
        delivery: 粗野顽皮，嘲弄时盛气凌人
        timbre: 清亮而略显粗硬
        pace: 稍快
        pitch: 中高
    schoolboy_2:
      display_name: 慈幼院男孩乙
      tts:
        delivery: 爱起哄，口气轻佻
        timbre: 清脆
        pace: 明快
        pitch: 中高
    schoolboy_3:
      display_name: 慈幼院男孩丙
      tts:
        delivery: 随众叫喊，兴奋而莽撞
        timbre: 略带沙哑
        pace: 明快
        pitch: 中等
    john_canty:
      display_name: 约翰·康第
      tts:
        delivery: 醉意浓重，凶狠粗暴
        timbre: 低沉沙哑
        pace: 忽快忽慢
        pitch: 低
  chapters:
    - id: ch01
      title: 第四章　王子的苦难开始了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那帮人追着小王子取乐，整整折磨了他几个钟头，终于觉得无趣，撇下他散去了。先前，爱德华还能对他们大发雷霆，拿王室的威严吓唬他们，还一道接一道地下命令。那些命令越郑重，众人越觉得可笑。可后来，他累得再也说不出话，也就没法继续逗他们开心了。于是，他们到别处找乐子去了。
        - id: ch01-b02
          speaker: narrator
          text: 王子看看四周，完全认不出身在何处。他只知道，这里还在伦敦城里。于是，他漫无目的地往前走。渐渐地，沿路的房屋少了，行人也稀了。当年的法灵顿街一带有条溪流，他把淌血的双脚浸进水里洗了洗，又歇了一会儿，才继续赶路。
        - id: ch01-b03
          speaker: narrator
          text: 不久，眼前出现一大片空地。空地上只有几座零散的房屋，还有一座巍峨的教堂。王子认识它。四周搭满脚手架，成群的工人正在大修教堂。他的心一下子振作起来，以为这场苦难总算要结束了。
        - id: ch01-b04
          speaker: edward_tudor
          text: 这是古老的灰衣修士教堂。父王从修士手里收回了这里，把它赐给穷苦无依的孩子永远居住，还改名叫基督教堂。父王这样厚待他们，他们一定乐意侍奉父王的儿子。何况，我现在也跟这里收留的孩子一样贫穷，一样孤苦。无论今天还是以后，再不会有人比我更可怜了。
        - id: ch01-b05
          speaker: narrator
          text: 教堂旁有一大群男孩。他们跑来跑去，又跳又叫，有的玩球，有的跳背，闹得好不热烈。每个人的衣服都一模一样，穿的是当时仆役和学徒常穿的式样。
        - id: ch01-b06
          speaker: narrator
          text: 他们头顶扣着碟子大小的黑扁帽。那帽子小得遮不住什么，也实在算不上好看。头发从帽下垂到前额中间，没有分缝，发梢剪得齐齐整整。颈间围着牧师式的白领，身上的合体蓝袍一直垂到膝下，袖子十分宽大。腰间束着宽红带，鲜黄的长袜在膝上扎紧，低帮鞋上还钉着大大的金属扣。总之，这身衣服难看得很。
        - id: ch01-b07
          speaker: narrator
          text: 男孩们停下游戏，一窝蜂围住王子。爱德华仍带着天生的尊严，对他们开了口。
        - id: ch01-b08
          speaker: edward_tudor
          text: 好孩子们，去告诉你们的师长，威尔士亲王爱德华要见他。
        - id: ch01-b09
          speaker: narrator
          text: 男孩们轰然大笑。一个粗野的家伙挤到前面。
        - id: ch01-b10
          speaker: schoolboy_1
          text: 怎么，叫花子，你是替亲王殿下来传话的吗？
        - id: ch01-b11
          speaker: narrator
          text: 王子的脸一下子涨红了，手也本能地按向腰间，可那里根本没有佩剑。男孩们笑得更响了。
        - id: ch01-b12
          speaker: schoolboy_2
          text: 你们看，他还以为腰上挂着剑呢。说不定，他自己就是王子！
        - id: ch01-b13
          speaker: narrator
          text: 这句嘲弄又惹来一阵哄笑。可怜的爱德华却傲然挺直了身子。
        - id: ch01-b14
          speaker: edward_tudor
          text: 我正是王子。你们吃着我父王赐下的饭食，却这样对待我，实在不成体统。
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: 这句话更叫男孩们开心，笑声越发响亮。最先说话的那个男孩，转身朝同伴们喊了起来。
        - id: ch01-b16
          speaker: schoolboy_1
          text: 喂，你们这些猪猡、奴才，还有靠亲王殿下的王父养活的寄食虫！规矩都忘了吗？快把膝盖跪下去，向他的王者气派，还有这一身王室破衣，好好行礼！
        - id: ch01-b17
          speaker: narrator
          text: 男孩们闹哄哄地笑着，一齐跪倒，装模作样地朝他们的猎物致敬。王子抬脚踢开离他最近的男孩，厉声斥道。
        - id: ch01-b18
          speaker: edward_tudor
          text: 这一下先赏给你！等到明天，我再替你竖一座绞架！
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: 这一回，事情可不再好笑了。玩闹已经过了头。笑声立刻停下，男孩们全都火冒三丈。十几个人一齐叫喊。
        - id: ch01-b20
          speakers: [schoolboy_1, schoolboy_2, schoolboy_3]
          ensemble: chorus
          text: 把他拖出去！扔进饮马池！狗到哪儿去了？狮子！尖牙！快过来！
          emotion: angry
        - id: ch01-b21
          speaker: narrator
          text: 接下来的一幕，英格兰还从没有见过。神圣不可侵犯的王位继承人，竟被一双双平民的手粗暴殴打，又遭恶犬扑咬撕扯。
        - id: ch01-b22
          speaker: narrator
          text: 这一天快要过去时，王子已经走进城里房屋密集的深处。他浑身青肿，双手流着血，一身破衣沾满污泥。他一直往前走，却越来越迷惘。疲惫和虚弱压得他几乎抬不起脚。他也不再找人问路了，因为每回得到的都不是指点，只有辱骂。
        - id: ch01-b23
          speaker: edward_tudor
          text: 下水院，就是这个名字。只要我在力气用尽、倒下以前找到那里，我就得救了。汤姆的家人会带我回宫，证明我不是他们家的孩子。我才是真正的王子。到那时，我失去的一切都会回来。
        - id: ch01-b24
          speaker: narrator
          text: 爱德华走着走着，又想起基督慈幼院那些粗野的男孩，也想起了自己在那里得到的教训。
        - id: ch01-b25
          speaker: edward_tudor
          text: 等我做了国王，那些孩子不能只有面包和住处，还要从书里学到知识。肚子吃饱了，心智和心灵却还在挨饿，又有什么用？我要牢牢记住今天的事，不能白白受这场教训，更不能叫我的百姓因此受苦。学问能让人心变得柔软，也能教人温厚仁爱。
        - id: ch01-b26
          speaker: narrator
          text: 街上的灯火一盏盏亮了起来。雨落下来，风越刮越紧，夜色又湿又冷，狂风阵阵。无处栖身的王子，英格兰无家可归的王位继承人，还在不停向前。他陷进那些肮脏小巷组成的迷宫，一步步走向更深处。成群的贫穷与苦难，就挤在这片蜂巢一般的地方。
        - id: ch01-b27
          speaker: narrator
          text: 突然，一个醉醺醺的高大恶汉冲过来，一把揪住了他的衣领。
        - id: ch01-b28
          speaker: john_canty
          text: 又在外头混到这么晚！我敢说，你准是一个法辛也没带回来。要真叫我猜中了，我非把你这副瘦骨头根根打断不可。要不然，我就不叫约翰·康第，干脆换个名字！
          emotion: angry
        - id: ch01-b29
          speaker: narrator
          text: 王子扭身挣脱，随手掸了掸那只被冒犯的肩膀，急忙追问。
        - id: ch01-b30
          speaker: edward_tudor
          text: 你当真是他的父亲？愿仁慈的上天让这件事是真的！那你就能把他接走，让我回到原来的地方了！
          emotion: surprised
        - id: ch01-b31
          speaker: john_canty
          text: 他的父亲？我不知道你在说些什么。我只知道，我是你的父亲。马上我就会叫你好好明白这一点……
        - id: ch01-b32
          speaker: edward_tudor
          text: 别再说笑，也别骗我，更不要耽搁！我累极了，身上又有伤，真的再也撑不住了。带我去见父王吧。他会赐给你连做梦都想不到的财富。相信我，求你相信我！我没有说谎，每一句都是真话。伸手救救我吧！我的的确确是威尔士亲王！
        - id: ch01-b33
          speaker: narrator
          text: 那汉子目瞪口呆，低头盯了孩子半晌，才摇摇头，嘴里嘟囔起来。
        - id: ch01-b34
          speaker: john_canty
          text: 疯得跟从疯人院里逃出来的一样！
        - id: ch01-b35
          speaker: narrator
          text: 他再次揪住王子的衣领，粗声大笑，又夹着咒骂说道。
        - id: ch01-b36
          speaker: john_canty
          text: 管你疯不疯，我和康第婆婆很快就会找出，你身上哪几根骨头最禁不起打！要不然，我约翰·康第就不算个堂堂男子汉！
          emotion: angry
        - id: ch01-b37
          speaker: narrator
          text: 说完，他拖着王子走了。王子发狂般挣扎，却怎么也逃不脱。约翰·康第拐进一条临街的院巷，很快消失不见。后面还跟着一大群兴高采烈、吵吵嚷嚷的人形害虫。
