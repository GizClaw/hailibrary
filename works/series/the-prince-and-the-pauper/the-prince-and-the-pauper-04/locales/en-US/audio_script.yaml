  chapters:
    - id: ch01
      title: The Prince’s troubles begin.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            For hours, the crowd chased and tormented the little prince. While he still had strength to rage at them, threaten them like a king, and give royal orders they could laugh at, he kept them entertained. At last, weariness forced him to stop talking. With no more amusement to be had from him, his tormentors went away.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Edward looked around. He knew he was somewhere in London, but that was all. He wandered on without knowing where he was going. Soon the houses grew fewer, and he met hardly anyone. At the brook that once ran where Farringdon Street stands now, he washed his bleeding feet and rested for a little while. Then he went on until he reached a wide open space. Only a few houses stood there, along with an enormous church.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He knew that church. Scaffolds covered it, and crowds of workmen were busy with great repairs. At once, the prince took heart. Surely his troubles were over.
        - id: ch01-b04
          speaker: edward
          text: >-
            This is the old Grey Friars’ Church. My father the king took it from the monks and gave it to poor, forsaken children as their home forever. He named it Christ’s Church. They will gladly help the son of the man who was so generous to them, especially now that I am as poor and friendless as any child sheltered here today.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Soon Edward stood among a noisy crowd of boys. They ran and jumped, played ball and leapfrog, and shouted as they played. Every boy wore the same ugly uniform, much like the clothes worn by servants and apprentices in those days. A flat black cap no bigger than a saucer sat on each head. It was too small to give any shelter and too plain to be an ornament. Straight-cut hair hung down over each forehead. Each boy also wore a white band at the neck, a close-fitting blue gown that reached at least to the knees, full sleeves, a wide red belt, bright yellow stockings tied above the knees, and low shoes with large metal buckles.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The boys stopped their games and crowded around the prince. Edward addressed them with all his natural dignity.
        - id: ch01-b07
          speaker: edward
          text: >-
            Good lads, go and tell your master that Edward, Prince of Wales, wishes to speak with him.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The boys answered with a great shout. One rough fellow called out to him.
        - id: ch01-b09
          speaker: hospital_boy_1
          text: >-
            Well now, beggar, are you His Grace’s messenger?
        - id: ch01-b10
          speaker: narrator
          text: >-
            Edward’s face burned with anger. His hand flew straight to his hip, ready for his sword, but there was no sword there. The boys roared with laughter.
        - id: ch01-b11
          speaker: hospital_boy_2
          text: >-
            Did you see that? He thought he had a sword! Perhaps he really is the prince.
        - id: ch01-b12
          speaker: narrator
          text: >-
            That joke brought another burst of laughter. Poor Edward drew himself up proudly.
        - id: ch01-b13
          speaker: edward
          text: >-
            I am the prince. You live on the kindness of my father the king, and it is shameful for you to treat me this way.
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: >-
            The boys enjoyed this even more. Their laughter made that plain. The first boy shouted to his companions.
        - id: ch01-b15
          speaker: hospital_boy_1
          text: >-
            Listen, you swine, you slaves, you pensioners of his princely father! Have you forgotten your manners? Everyone on your knees. Bow down before his royal bearing and his royal rags!
        - id: ch01-b16
          speaker: narrator
          text: >-
            With loud delight, they all dropped to their knees and made a mocking show of honoring him. The prince kicked the nearest boy away.
        - id: ch01-b17
          speaker: edward
          text: >-
            Take that! Tomorrow I shall have a gallows built for you.
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: >-
            But that was no joke to them. The fun had gone too far. Their laughter stopped at once, and fury took its place. A dozen boys began shouting together.
        - id: ch01-b19
          speakers: [hospital_boy_1, hospital_boy_2, hospital_boy_3, hospital_boy_4]
          ensemble: chorus
          text: >-
            Drag him away! Throw him in the horse pond! Where are the dogs? Here, Lion! Here, Fangs!
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: >-
            What followed was something England had never seen before. Common hands struck and shoved the sacred heir to the throne, and dogs were set upon him and tore at him.
        - id: ch01-b21
          speaker: narrator
          text: >-
            By the time that day was nearing its end, the prince was far away in a tightly packed part of the city. His body was bruised. His hands were bleeding, and his rags were smeared with mud. He wandered on, growing more lost with every step. He was so tired and faint that he could barely put one foot before the other. He no longer asked anyone for directions. Every question had brought him insults instead of help.
        - id: ch01-b22
          speaker: edward
          text: >-
            Offal Court. That is the name. If I can find it before all my strength is gone and I fall, I shall be safe. Tom’s family will take me to the palace. There they will prove that I do not belong with them, that I am the true prince, and I shall have my own place again.
        - id: ch01-b23
          speaker: narrator
          text: >-
            As he went, his thoughts kept returning to the rude boys at Christ’s Hospital and the way they had treated him.
        - id: ch01-b24
          speaker: edward
          text: >-
            When I am king, those children shall have more than bread and shelter. They shall learn from books as well. A full stomach means little when the mind and heart are left starving. I will remember carefully what this day has taught me, so my people will not suffer because I forgot. Learning softens the heart and teaches gentleness and charity.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Lights began to gleam in the darkness. Rain started to fall, the wind rose, and the night turned raw and gusty. The prince had no house to shelter him. The heir to England’s throne had no home. Still he walked on, drifting farther into a maze of filthy alleys, where poverty and misery crowded together like swarming hives.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Suddenly, a large drunken brute seized him by the collar.
        - id: ch01-b27
          speaker: john_canty
          text: >-
            Out again this late, are you? And I’ll wager you have not brought home a single farthing. If that is true, I’ll break every bone in your skinny body, or my name is not John Canty!
          emotion: angry
        - id: ch01-b28
          speaker: narrator
          text: >-
            The prince twisted free. Without thinking, he brushed the spot where the man had touched his shoulder. Then he spoke eagerly.
        - id: ch01-b29
          speaker: edward
          text: >-
            Oh, are you truly his father? Please, heaven, let it be so! Then you can take him away and give me back my own place.
          emotion: surprised
        - id: ch01-b30
          speaker: john_canty
          text: >-
            His father? I do not know what you mean. I only know that I am your father, and soon I’ll give you good reason to remember it.
        - id: ch01-b31
          speaker: edward
          text: >-
            Oh, do not joke with me or waste another moment! I am exhausted and wounded. I cannot bear any more. Take me to my father the king, and he will make you richer than you ever dreamed. Believe me! I am telling you the truth. Reach out your hand and save me. I truly am the Prince of Wales!
        - id: ch01-b32
          speaker: narrator
          text: >-
            The man stared down at the boy, too amazed to answer. Then he shook his head and muttered.
        - id: ch01-b33
          speaker: john_canty
          text: >-
            The boy has gone as mad as any Bedlam beggar.
        - id: ch01-b34
          speaker: narrator
          text: >-
            He caught Edward by the collar again. With a rough laugh and a curse, he went on.
        - id: ch01-b35
          speaker: john_canty
          text: >-
            Mad or not, your Gammer Canty and I will soon find every tender place in your bones, or I am no true man!
          emotion: angry
        - id: ch01-b36
          speaker: narrator
          text: >-
            Then John Canty dragged the frantic, struggling prince away. They vanished up a front court, followed by a noisy, delighted swarm of human vermin.
