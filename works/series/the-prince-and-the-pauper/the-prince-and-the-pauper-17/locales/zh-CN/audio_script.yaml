        timbre: 浑厚嘶哑
        pace: 急促
        pitch: 中低
  chapters:
    - id: ch01
      title: 第十七章　福福一世
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 迈尔斯·亨顿一路赶向伦敦桥的萨瑟克桥头，两眼不停搜寻那几个人。他本以为很快就能追上，可一路向人打听，追过半个萨瑟克以后，所有踪迹还是突然断了。他一时不知该往哪里走，却不肯死心，又竭尽所能找了整整一天。到了晚上，他两腿酸软，饿得发慌，离目标却依旧遥远，只好在塔巴德客店吃饭歇宿，准备天一亮就把全城彻底搜遍。
        - id: ch01-b02
          speaker: narrator
          text: 躺在床上，他一边计划，一边换了个思路。那孩子只要有机会，准会逃离那个自称父亲的恶棍。可他会回伦敦，去找从前熟悉的地方吗？不会。那样太容易再次落入对方手里。那么，一个从前既无朋友又无人保护，直到遇见亨顿才有了依靠的孩子，会到哪里去呢？只要不用朝伦敦和危险的方向走，他一定会设法找到这个朋友。他多半会去亨顿庄园。毕竟，他知道亨顿正在回乡，也知道去那里就可能找到人。
        - id: ch01-b03
          speaker: narrator
          text: 这一下，亨顿心里清楚了。他不能继续留在萨瑟克，应该马上穿过肯特郡，朝蒙克斯霍姆去，一路搜索树林、向人问讯。现在，我们也暂且离开亨顿，回去看看那位失踪的小国王。
        - id: ch01-b04
          speaker: narrator
          text: 客店仆人看见的那个恶棍，并没有真的上前同国王和年轻人会合。他一声不响，只是紧紧跟在后面。那人的左臂吊在绷带里，左眼盖着大片绿色眼罩，走路略跛，还拿一根橡木杖支撑身体。年轻人领国王在萨瑟克绕来绕去，故意走出一条曲折的路线，过了一阵才走上城外的大路。
        - id: ch01-b05
          speaker: narrator
          text: 国王渐渐恼火起来。他停下脚步，不肯再走，声称该由亨顿前来拜见，不能反过来让国王去寻找自己的臣仆。他绝不会容忍这样的无礼，所以决定就站在这里等候。
        - id: ch01-b06
          speaker: hugo
          text: 你的朋友受了伤，就躺在前面的树林里。你还要留在这儿？好吧，那就留下。
        - id: ch01-b07
          speaker: narrator
          text: 国王听见“受伤”二字，立刻变了脸色。
        - id: ch01-b08
          speaker: prince_edward
          text: 受伤？是谁胆敢伤他？先别说了，快带路！走快些，你的鞋底灌了铅吗？不论凶手是谁，哪怕他是公爵的儿子，也得为此付出代价！
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: 树林还有一段路，他们却很快便赶到了。年轻人四下张望，找到一根插在地上的树枝，上面系着一小片破布。他领头钻进林子，一路留心寻找同样的树枝。每隔一段就有一根，显然都是引向同一个地方的路标。最后，两人来到一片空地。那里有一座农舍烧剩的焦黑残骸，旁边立着一间腐朽破败、几乎快倒的谷仓。四下没有半点活物的踪影，静得可怕。
        - id: ch01-b10
          speaker: narrator
          text: 年轻人走进谷仓，国王紧随其后，可里面根本没有亨顿。国王惊疑地瞪向带路人。
        - id: ch01-b11
          speaker: prince_edward
          text: 他人呢？
        - id: ch01-b12
          speaker: narrator
          text: 年轻人只用一声冷笑回答。国王怒火顿起，抓起一截木柴便要扑过去。这时，身后又传来一阵嘲笑。那个装跛的恶棍也进了谷仓。
        - id: ch01-b13
          speaker: prince_edward
          text: 你是谁？来这里有什么企图？
          emotion: angry
        - id: ch01-b14
          speaker: john_canty
          text: 别装疯卖傻了，给我安静点。我这身装扮又没有高明到让你连亲爹都认不出来。
        - id: ch01-b15
          speaker: prince_edward
          text: 你不是我的父亲，我也不认识你。我是国王。若是你把我的臣仆藏了起来，就立刻把他找来，否则你一定会后悔。
        - id: ch01-b16
          speaker: narrator
          text: 约翰·坎蒂放慢声音，严厉地训斥起来。
        - id: ch01-b17
          speaker: john_canty
          text: 看来你真疯了。我本来不愿惩罚你，可你再惹我，我就不得不动手。这里没人会理会你的疯话，但换个地方，这张嘴会给我们惹祸。你从现在起就得学会谨慎说话。
        - id: ch01-b18
          speaker: john_canty
          text: 我杀了人，不能再回家。你也不能走，因为我还用得着你。为了避祸，我如今叫约翰·霍布斯，你就叫杰克。牢牢记住。现在告诉我，你母亲和两个姐姐在哪儿？她们没去约好的地方。你知不知道她们去了哪里？
        - id: ch01-b19
          speaker: prince_edward
          text: 别用这些谜语烦我。我的母后已经去世，两位姐姐都在王宫。
        - id: ch01-b20
          speaker: narrator
          text: 雨果在旁边放声讥笑。国王又要动手，却被坎蒂拦了下来。
        - id: ch01-b21
          speaker: john_canty
          text: 行了，雨果，别再逗他。他脑子不清醒，经不起你这样招惹。杰克，坐下安静一会儿，待会儿会给你东西吃。
        - id: ch01-b22
          speaker: narrator
          text: 霍布斯和雨果凑在一起低声交谈，国王则尽可能远离这两个讨厌的人。他一直退到谷仓尽头昏暗的角落，发现那里的泥地上铺着足足一英尺厚的麦秸。他便躺在上面，又把麦秸拉到身上代替被子，很快陷入了沉思。
        - id: ch01-b23
          speaker: narrator
          text: 国王想起了种种悲苦，可最大的悲痛很快压过其余一切。他失去了父亲。对世人来说，亨利八世这个名字会让人浑身发冷，使人想到一个鼻孔喷着毁灭气息、伸手便降下鞭笞和死亡的恶魔。对这个孩子来说，这名字带来的却只有温暖。父亲的脸上，也只有慈爱和柔情。他一遍遍回想父子间那些亲爱温存的往事，久久舍不得离开，眼泪也不断流下来。午后渐渐过去，重重忧患把孩子折磨得筋疲力尽，他终于在麦秸里沉入一场安宁而疗愈的睡眠。
        - id: ch01-b24
          speaker: narrator
          text: 不知过了多久，他的神志才挣扎着恢复了几分。国王闭着眼躺在那里，迷迷糊糊地想着自己身在何处，又发生过什么。雨点正在沉沉敲打屋顶，那阵低低的沙沙声让他觉得温暖安稳。可下一刻，一片尖厉的怪叫和粗野笑声突然把这感觉打碎。他不快地惊醒，拨开头上的麦秸，看见谷仓另一头燃起旺火。诡异的红光照着一群东倒西歪的男女。那是他读过或梦见过的最古怪、最丑陋的一伙流浪汉和恶棍。
        - id: ch01-b25
          speaker: narrator
          text: 当中有皮肤被风吹日晒得黝黑、长发披散的魁梧汉子，也有满脸凶相的年轻人。他们全都裹着稀奇古怪的破布。有人假装眼瞎，用膏药和绷带蒙着眼。有人拄着拐杖，装着木腿。还有人身患恶疾，流着脓的伤口从包扎不严的破布下露出来。一个面目奸恶的货郎背着货担，磨刀匠、补锅匠和理发兼外科医生也都带着各自吃饭的家伙。
        - id: ch01-b26
          speaker: narrator
          text: 女人中有没长大的姑娘，有正值盛年的女子，也有满脸皱纹的老妪。她们个个肮脏邋遢，既厚颜无耻又吵闹不休，嘴里还尽是脏话。火边另有三个满脸疮疤的婴儿和两条饿瘦的野狗。狗脖子上系着绳，原来它们的差事，就是替那些“瞎子”引路。
        - id: ch01-b27
          speaker: narrator
          text: 夜色已经降临。这伙人刚刚结束一场大吃大喝，新的狂欢才要开头。酒罐从一张嘴传到另一张嘴，人人都喝得兴起。忽然，众人一齐叫嚷起来，非要听上一支歌不可。
        - id: ch01-b28
          speakers: [bat, dick, dot_and_go_one, gang_member]
          ensemble: chorus
          text: 唱一支！让蝙蝠、迪克和蹦腿儿唱一支！
          emotion: happy
        - id: ch01-b29
          speaker: narrator
          text: 一个瞎子站起来，撕掉保护那双好眼睛的膏药，也丢开那块可怜巴巴、写着自己如何遭难的招牌。蹦腿儿卸掉木腿，用两条健康结实的腿站到同伙身边。两个骗子扯开嗓子唱起胡闹的小调。每唱完一节，整伙人便放声接上副歌。等唱到最后一节，这群半醉之人的兴致已经高涨到了极点，所有人干脆从开头加入，把整首歌再唱一遍。那股邪腔怪调震得屋椽都发颤。
        - id: ch01-b30
          speakers: [bat, dick, dot_and_go_one, gang_member]
          ensemble: chorus
          text: 好黑夜呀，酒婆娘和贼窝，好汉们四散逃亡。脚镣加身，任游民审判，漫长的性命终须收场。好婆娘快出来瞧呀，瞧呀，快走出罗姆恶酒坊。瞧那偷走你衣裳的汉子，戴着脚镣受审判。
          emotion: happy
        - id: ch01-b31
          speaker: narrator
          text: 唱完以后，众人改说寻常话，不再使用只有防备外人偷听时才说的盗贼黑话。国王听出，约翰·霍布斯并不算新入伙，他早些年就在这群人中混过。大家追问他离开后的经历。他说自己“不小心”杀了人，众人十分满意。听说死者还是教士，更是热烈喝彩，非要他同每个人都喝上一杯。旧相识欢天喜地地迎接他，新人也以能同他握手为荣。随后，有人问他为什么一连几个月都不见踪影。
        - id: ch01-b32
          speaker: john_canty
          text: 这几年法律越来越严，查办得又勤，伦敦反倒比乡下更好，也更加安全。若不是出了那场意外，我原本会一直留在那里。我已经打定主意，再也不到乡下来冒险。可如今出了人命，这个打算也就彻底完了。
        - id: ch01-b33
          speaker: narrator
          text: 霍布斯问起这伙人如今有多少成员。头领答道——
        - id: ch01-b34
          speaker: ruffler
          text: 连女贼、姘妇和其他婆娘一起算，一共二十五个扒手、小偷、骗子、假乞丐和游丐。大多数都在这儿，剩下的正沿冬季路线往东走。天亮后，我们也去追他们。
        - id: ch01-b35
          speaker: john_canty
          text: 这些正派朋友里，怎么不见温？他去了哪儿？
        - id: ch01-b36
          speaker: ruffler
          text: 可怜的家伙如今拿硫黄当饭吃，那味道对娇嫩舌头可太烫了。他在一次斗殴里送了命，大概就是仲夏前后的事。
        - id: ch01-b37
          speaker: john_canty
          text: 真叫人难过。温既能干又勇敢。
        - id: ch01-b38
          speaker: ruffler
          text: 他确实又能干又勇敢。黑贝丝，就是他那个女人，眼下还跟着我们，不过这会儿正在往东边游荡。她是个举止端正、很守规矩的好姑娘。一星期里，别人绝不会看见她醉上四天以上。
        - id: ch01-b39
          speaker: john_canty
          text: 她一向很自律，我记得。那姑娘值得称赞。她母亲就随便多了，是个难缠的坏脾气老太婆，脑子倒比普通人好使。
        - id: ch01-b40
          speaker: ruffler
          text: 她就是聪明过了头。她会看手相，还精通其他种种占卜，后来便得了女巫的名声。法律用小火把她慢慢烤死了。她面对命运时那股豪气，连我看了都不免生出几分柔情。四周的人伸长脖子盯着她，她却一直咒骂他们。
        - id: ch01-b41
          speaker: ruffler
          text: 火焰一点点舔上她的脸，燎着稀疏的头发，在灰白的老脑袋旁噼啪作响。可她还是骂个不停，一个人也不放过。你就是活上一千年，也听不到那么有气势的诅咒。可惜，她的本事随她一起死了。如今只剩一些软弱卑劣的仿冒货，再也没有真正高明的亵渎之辞。
        - id: ch01-b42
          speaker: narrator
          text: 头领叹了口气，听众也感同身受地陪着叹息，整群人一时都消沉下来。看来，就连这些心肠硬透的亡命徒，也不是完全没有感情。只要隔上足够漫长的岁月，再碰巧遇到特别合适的情形，他们也会为损失和不幸伤感片刻。比如现在，一位既有天赋又有修养的人离世，却没有留下传人。好在所有人一齐痛饮一大口，哀悼者们很快便恢复了精神。
        - id: ch01-b43
          speaker: john_canty
          text: 咱们还有哪些朋友遭了难？
        - id: ch01-b44
          speaker: ruffler
          text: 有几个，尤其是新来的人。小农的田地被夺去改成牧羊场，他们没有活路，只能饿着肚子流落世间。他们去讨饭，就被剥掉腰部以上的衣服，绑在车尾一路抽打，直到鲜血直流。接着，他们又被关进枷具，任人把东西往身上砸。
        - id: ch01-b45
          speaker: ruffler
          text: 他们再次乞讨，又挨了一顿鞭子，还被割掉一只耳朵。第三次再去讨饭——可怜的魔鬼，除了乞讨还能怎么办？——他们便被烧红的烙铁在脸上留下印记，随后卖作奴隶。等他们逃跑，又会被人追捕回来，最后绞死。这故事不长，几句话就讲完了。还有几位运气稍好些。约克尔、伯恩斯、霍奇，站起来让我们看看你们的装饰！
        - id: ch01-b46
          speaker: narrator
          text: 三个人站起来，掀开身上的破布。鞭打留下的旧伤像粗绳一样隆起，在背上纵横交错。一个人撩开头发，露出被割掉的左耳。另一个人的肩头烙着字母V，耳朵也已残缺。第三个人便是约克尔。他开了口。
        - id: ch01-b47
          speaker: yokel
          text: 我从前是个日子富足的农夫，有贤惠的妻子，也有孩子。如今我的身份和营生都变了，妻儿也全都没了。他们或许在天堂，或许在另一个地方。可是感谢仁慈的上帝，他们再也不用留在英格兰！
          emotion: sad
        - id: ch01-b48
          speaker: yokel
          text: 我那善良清白的老母亲靠照料病人糊口。有个病人死了，大夫怎么也查不出缘故，他们便把母亲当作女巫活活烧死，我的孩子们就在旁边看着，哭喊个不停。英格兰的法律！大伙儿站起来，举起杯子！现在一起欢呼！敬仁慈的英格兰法律，是它把她从英格兰的地狱里解救出去！谢谢弟兄们，一个也不少。
          emotion: angry
        - id: ch01-b49
          speaker: yokel
          text: 我和妻子带着挨饿的孩子，挨家挨户讨饭。可在英格兰，挨饿也是罪。他们剥光我们，一路挥鞭，赶着我们穿过三个市镇。再敬仁慈的英格兰法律一杯！它的鞭子饱饮了我妻子玛丽的血，而那蒙福的解脱很快就降临到她身上。如今她躺在穷人墓地里，从此平安，再也不会受到伤害。
          emotion: angry
        - id: ch01-b50
          speaker: yokel
          text: 至于孩子们，法律把我从一座城抽打到另一座城时，他们活活饿死了。弟兄们，再喝一小口，敬那些从未伤害过任何生灵的可怜孩子。
          emotion: sad
        - id: ch01-b51
          speaker: yokel
          text: 我又去讨饭，只求一块面包皮，结果进了枷具，也丢掉一只耳朵。瞧，残根还在。我再次乞讨，另一只耳朵也只剩下这截残根，时时提醒着我。可我还是去讨，于是他们把我卖作奴隶。
          emotion: angry
        - id: ch01-b52
          speaker: yokel
          text: 若把我脸上这块污迹洗掉，你们就能看见烙铁留下的红色字母S。奴隶！你们明白这个词吗？站在这里的是一个英格兰奴隶！我从主人那里逃了出来，等他们找到我——愿天上最沉重的诅咒降到颁布这条法律的国家头上！——我就会被绞死！
          emotion: angry
        - id: ch01-b53
          speaker: narrator
          text: 昏暗中忽然传来一个清亮的声音。
        - id: ch01-b54
          speaker: prince_edward
          text: 你不会被绞死！从今天起，那条法律就到头了！
        - id: ch01-b55
          speaker: narrator
          text: 众人一齐转头。小国王穿着古怪的破衣服，正快步走入火光。等大家看清了他，四周顿时爆出一片追问。
        - id: ch01-b56
          speakers: [bat, dick, dot_and_go_one, gang_member]
          ensemble: chorus
          text: 他是谁？那是什么东西？你是谁呀，小不点儿？
          emotion: surprised
        - id: ch01-b57
          speaker: narrator
          text: 男孩站在一圈惊疑的目光中，毫不慌乱，仍带着王者的尊严。
        - id: ch01-b58
          speaker: prince_edward
          text: 我是爱德华，英格兰国王。
        - id: ch01-b59
          speaker: narrator
          text: 众人狂笑起来，既是嘲弄，也是在欣赏这个绝妙的笑话。国王被刺痛了，厉声斥责他们。
        - id: ch01-b60
          speaker: prince_edward
          text: 你们这群无礼的流浪汉！朕答应赐给你们王恩，你们竟用这种态度回应吗？
          emotion: angry
        - id: ch01-b61
          speaker: narrator
          text: 他还气愤地说了不少，可所有话都淹没在旋风般的笑声和嘲弄里。霍布斯喊了好几次，终于让众人听见。
        - id: ch01-b62
          speaker: john_canty
          text: 弟兄们，他是我儿子，是个爱做梦的傻瓜，已经疯得彻底了。别理他。他真以为自己就是国王。
        - id: ch01-b63
          speaker: prince_edward
          text: 我本来就是国王。时候一到，我会让你付出代价。你已经承认杀了人，必定会被绞死。
        - id: ch01-b64
          speaker: john_canty
          text: 你敢出卖我？就凭你？等我抓住你——
          emotion: angry
        - id: ch01-b65
          speaker: narrator
          text: 魁梧的头领及时拦住他，又一拳把霍布斯打倒，格外有力地完成了这场救驾。
        - id: ch01-b66
          speaker: ruffler
          text: 啧啧！你眼里既没有国王，也没有头领吗？再敢当着我的面放肆，我就亲手把你吊起来。
          emotion: angry
        - id: ch01-b67
          speaker: ruffler
          text: 小子，你不许威胁自己的弟兄，到了别处也不能说他们的坏话。你的疯念头非要你当国王，那就当吧，可别因此害人。刚才那个尊号不能再提，那可是叛国罪。我们在几件小事上也许不算好人，却没人卑鄙到要背叛国王。这一点，我们个个忠心耿耿。现在听听我说得对不对。大家一起喊，英格兰国王爱德华万岁！
        - id: ch01-b68
          speakers: [bat, dick, dot_and_go_one, gang_member]
          ensemble: chorus
          text: 英格兰国王爱德华万岁！
        - id: ch01-b69
          speaker: narrator
          text: 回应声犹如雷暴，震得破谷仓都在颤动。小国王脸上亮了一瞬。他微微点头，严肃而真诚地回答。
        - id: ch01-b70
          speaker: prince_edward
          text: 谢谢你们，我的好百姓。
          emotion: happy
        - id: ch01-b71
          speaker: narrator
          text: 这句话又逗得众人前仰后合。等喧闹稍稍平息，头领用坚决却不算恶意的口气劝他。
        - id: ch01-b72
          speaker: ruffler
          text: 别再说了，孩子，这样既不明智，也不妥当。你若一定要顺着自己的妄想，就换个别的名号。
        - id: ch01-b73
          speaker: narrator
          text: 补锅匠尖声喊出了一个主意。
        - id: ch01-b74
          speaker: tinker
          text: 福福一世，傻瓜国国王！
          emotion: happy
        - id: ch01-b75
          speaker: narrator
          text: 这个名号立刻得到了所有人的赞同。
        - id: ch01-b76
          speakers: [bat, dick, dot_and_go_one, gang_member]
          ensemble: chorus
          text: 傻瓜国国王福福一世万岁！
          emotion: happy
        - id: ch01-b77
          speaker: narrator
          text: 欢呼之后，嘘声、怪叫和狂笑响成一片。众人又七嘴八舌地喊起来。
        - id: ch01-b78
          speaker: bat
          text: 把他拖出来，给他加冕！
        - id: ch01-b79
          speaker: dick
          text: 给他披上王袍！
        - id: ch01-b80
          speaker: dot_and_go_one
          text: 给他权杖！
        - id: ch01-b81
          speaker: gang_member
          text: 送他上宝座！
        - id: ch01-b82
          speaker: narrator
          text: 这几声和另外几十种叫喊同时爆发。可怜的小国王还来不及喘气，就被人在头上扣了锡盆当王冠，身上裹了破毯子当王袍，又扶上木桶当作登基，手里还塞进补锅匠的烙铁充当权杖。接着，众人全都扑通跪在他四周，用肮脏破烂的衣袖和围裙假装擦眼泪，一齐发出讥讽的哭声，又装模作样地苦苦哀求。
        - id: ch01-b83
          speaker: bat
          text: 仁慈些吧，甜心国王！
        - id: ch01-b84
          speaker: dick
          text: 高贵的陛下，别践踏我们这些苦苦哀求的小虫！
        - id: ch01-b85
          speaker: dot_and_go_one
          text: 可怜您的奴隶吧，赏我们一记王家御脚当作安慰！
        - id: ch01-b86
          speaker: gang_member
          text: 主权之火熊熊燃烧的太阳啊，请用仁慈的光芒鼓舞我们，温暖我们！
        - id: ch01-b87
          speaker: bat
          text: 请用您的御足圣化这片土地，好让我们吃下泥土，从此变得高贵！
        - id: ch01-b88
          speaker: dick
          text: 陛下，请屈尊朝我们吐一口唾沫吧！那样，我们的子子孙孙就能传颂您的王者恩典，永远为此骄傲又幸福！
        - id: ch01-b89
          speaker: narrator
          text: 当晚最出风头的还是补锅匠。他跪下来假装亲吻国王的脚，国王气愤地一脚踢开了他。补锅匠马上四处求人给他一块破布，说要把脸上被御足碰过的地方仔细贴住。这块神圣之地再也不能接触庸俗的空气，必须好好保存起来。
        - id: ch01-b90
          speaker: tinker
          text: 往后我就去大路上，把这块圣地展示给人看。看一眼收一百先令，我可要发大财啦！
          emotion: happy
        - id: ch01-b91
          speaker: narrator
          text: 补锅匠把这场玩笑演得滑稽透顶，成了当晚最得意的人。那群肮脏无赖看着他，个个又羡慕又佩服。羞耻和愤怒的泪水却在小国王眼中打转。他心里只有一个念头。就算自己曾经深深伤害过这些人，他们也不会待他更加残酷。可他给出的明明只有善意，只想为他们废除恶法、赐下恩惠，他们竟用这样的方式回报他！
