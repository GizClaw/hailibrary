  chapters:
    - id: ch01
      title: Hendon's Search
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Miles Hendon hurried toward the Southwark end of the bridge. He watched every face, certain he would soon catch up with the people he was hunting. But they were nowhere to be seen. Questions helped him follow their trail for part of the way through Southwark. Then the trail vanished, and Miles had no idea where to turn.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Still, he searched as well as he could for the rest of the day. He followed one hope after another, but each led nowhere. By nightfall, his legs ached, he had hardly eaten, and he was no closer to finding the boy. At last he ate supper at the Tabard Inn and went to bed. He meant to rise early and search every corner of the town until he had exhausted every possibility.
        - id: ch01-b03
          speaker: narrator
          text: >-
            As Miles lay awake making plans, a new thought came to him. The boy would escape from the brute who claimed to be his father if he possibly could. But he would never return to his old haunts in London, where he might be caught again. Until he met Miles, the boy had never known a friend or protector. Surely he would try to find that one friend again, as long as he could do it without going back toward danger.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Then the answer seemed plain. The boy would make for Hendon Hall. He knew Miles was traveling home, and he could expect to find him there. Miles decided he must waste no more time in Southwark. He would travel through Kent toward Monk's Holm, searching the woods and asking questions along the road.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Now let us return to the little King who had vanished.
    - id: ch02
      title: The Trap in the Wood
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The suspicious man seen by the inn waiter had not quite joined Edward and the young guide. Instead, he followed close behind without a word. His left arm rested in a sling, a large green patch covered his left eye, and he walked with a slight limp, leaning on an oak staff.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The youth led Edward along a twisting route through Southwark and finally onto the high road beyond it. By then Edward had lost patience. He declared that he would go no farther. Hendon ought to come to his King, not expect his King to go to him. Edward would not bear such insolence. He meant to stop exactly where he was.
        - id: ch02-b03
          speaker: hugo
          text: >-
            You would stay here while your friend lies wounded in the wood? Very well, then.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Edward changed at once.
        - id: ch02-b05
          speaker: prince_edward
          text: >-
            Wounded? Who dared harm him? Never mind that now. Lead on, and move faster! Are your shoes made of lead? Whoever did this will pay for it, even if he is a duke's son!
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: >-
            The wood lay some distance away, but Edward's urgency carried them over the ground quickly. The youth looked around until he found a branch stuck upright in the earth with a scrap of cloth tied to it. He entered the forest, watching for other marked branches. They appeared at intervals, clearly pointing out the route to the place he meant to find.
        - id: ch02-b07
          speaker: narrator
          text: >-
            At last they reached a clearing. The charred remains of a farmhouse stood there, beside a barn that was rotting and close to collapse. There was no sign of life anywhere. Nothing moved, and not a sound could be heard. The youth went into the barn, and Edward followed eagerly at his heels, expecting to find his wounded friend. But the place was empty. Edward stopped and gave his guide a startled, suspicious look.
        - id: ch02-b08
          speaker: prince_edward
          text: >-
            Where is he?
        - id: ch02-b09
          speaker: narrator
          text: >-
            Hugo only laughed at him. Edward snatched up a piece of wood and started toward him in a fury. Then another mocking laugh sounded behind the King. It came from the limping stranger who had followed them.
        - id: ch02-b10
          speaker: prince_edward
          text: >-
            Who are you, and what business brings you here?
          emotion: angry
        - id: ch02-b11
          speaker: john_canty
          text: >-
            Enough of this nonsense. Be quiet. My disguise is not so clever that you can pretend you do not recognize your own father.
        - id: ch02-b12
          speaker: prince_edward
          text: >-
            You are no father of mine. I do not know you. I am the King. If you have hidden my servant, bring him to me, or you will bitterly regret it.
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: >-
            John Canty answered slowly and sternly.
        - id: ch02-b14
          speaker: john_canty
          text: >-
            Plainly you are mad, and I would rather not punish you. Provoke me, though, and I will. Your babble can do no harm here, where nobody cares about it. But you must learn to guard your tongue before we move among other people. I killed a man, so I cannot stay at home. You will come with me because I need your help. For good reason, my name is now Hobbs, John Hobbs. Your name is Jack. Remember it. Now tell me, where are your mother and sisters? They never came to the place we chose. Do you know where they went?
        - id: ch02-b15
          speaker: narrator
          text: >-
            Edward answered sullenly.
        - id: ch02-b16
          speaker: prince_edward
          text: >-
            Stop troubling me with riddles. My mother is dead, and my sisters are at the palace.
          emotion: sad
        - id: ch02-b17
          speaker: narrator
          text: >-
            Hugo burst into scornful laughter. Edward tried to attack him, but Canty stopped the blow.
        - id: ch02-b18
          speaker: john_canty
          text: >-
            Leave him alone, Hugo. His wits have gone astray, and your tricks only torment him. Sit down, Jack, and be still. You will get a bite to eat soon.
        - id: ch02-b19
          speaker: narrator
          text: >-
            Canty and Hugo began talking quietly. Edward moved as far as he could from their hateful company. At the dim far end of the barn, straw lay a foot deep across the dirt floor. He stretched out and pulled it over himself like a blanket.
        - id: ch02-b20
          speaker: narrator
          text: >-
            His troubles crowded his mind, but one sorrow pushed almost every other grief away. He had lost his father. The name Henry the Eighth made the rest of the world tremble. It called up the image of a monster whose breath brought destruction and whose hand dealt out whippings and death. Edward knew a different man. In his memory, his father's face held only gentleness and love. One tender moment after another returned to him. He lingered over each one, and the tears flowed freely. His grief was deep and real.
        - id: ch02-b21
          speaker: narrator
          text: >-
            The afternoon faded. Worn out by sorrow, the boy slowly fell into a peaceful, healing sleep.
    - id: ch03
      title: The Company in the Barn
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Much later, Edward began to wake. He did not know how long he had slept. With his eyes still shut, he tried to remember where he was. Rain beat steadily on the roof, and for a moment its sound made him feel warm and safe beneath the straw.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Then a chorus of shrill cackles and rough laughter shattered that comfort. Edward started, uncovered his head, and looked toward the noise. A harsh and ugly scene waited for him. A bright fire burned in the middle of the floor at the other end of the barn. People lounged and sprawled all around it. The red glare lit them in strange, shifting patches. They were the most mixed and ragged crowd of outcasts and ruffians Edward had ever seen, either in life, in books, or in his wildest dreams.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Huge, strong men sprawled near the flames. The weather had browned their skin, their hair hung long, and fantastic rags covered them. Fierce-looking youths in similar clothes sat among them. Some beggars hid their eyes beneath patches and bandages. Others leaned on crutches or wore wooden legs. Sickly people showed running sores through wrappings that did little to hide them. A wicked-looking peddler had brought his pack. A knife grinder, a tinker, and a barber-surgeon displayed the tools of their trades.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The women ranged from young girls to wrinkled old hags. Every one of them was loud, dirty, and foul-mouthed. Three babies had sore faces. Two starving dogs wore cords around their necks so they could lead the blind.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Night had fallen. The gang had finished its feast, and now the drinking had begun. One can passed from mouth to mouth. Suddenly, voices called for a song from the Bat and Dot-and-go-One.
        - id: ch03-b06
          speakers: [gang_member_1, gang_member_2, gang_member_3, gang_member_4]
          ensemble: chorus
          text: >-
            A song! Give us a song from the Bat and Dot-and-go-One!
          emotion: happy
        - id: ch03-b07
          speaker: narrator
          text: >-
            One of the blind men stood up. He threw aside the patches that had covered his perfectly good eyes and dropped the sorrowful sign explaining his supposed misfortune. Dot-and-go-One removed his wooden leg and stood beside him on two healthy legs.
        - id: ch03-b08
          speakers: [blind_singer, dot_and_go_one]
          ensemble: duo
          text: >-
            Bien Darkman's then, Bouse Mort and Ken, the bien coves bings awast. On chates to trine by Rome coves dine for his long lib at last. Bing'd out, bien morts, and toure and toure. Bing out of the Rome vile bine, and toure the cove that cloy'd your duds upon the chates to trine!
        - id: ch03-b09
          speaker: narrator
          text: >-
            The two rogues roared out their lively thieves' song. At the end of every verse, the whole company thundered the chorus. The liquor and music drove their excitement higher with each round. By the final verse, the half-drunken crowd could no longer wait for its turn. Everybody joined in and sang the entire song again from the beginning. The great blast of terrible sound rose to the roof and made the rafters shake.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Afterward they talked in ordinary language, not the thieves' dialect from the song. They saved those secret words for times when unfriendly ears might be listening. Their conversation showed that John Hobbs was no true newcomer. He had trained with this gang in earlier days. Everyone demanded the story of his later life. He told them he had killed a man by accident, and the news pleased them greatly. When he added that the dead man was a priest, they cheered him, and he had to share a drink with every person there. Old friends welcomed him with joy. New acquaintances were proud to shake his hand. Then they demanded to know why he had stayed away for so many months.
        - id: ch03-b11
          speaker: john_canty
          text: >-
            London has been safer than the countryside these past few years. Out here, the laws are cruel and enforced too well. Without that accident, I would have stayed in London. I had made up my mind never to risk the country again, but now the accident has settled that for me.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Canty asked how large the gang had grown.
        - id: ch03-b13
          speaker: ruffler
          text: >-
            We number twenty-five now, counting every sort of beggar, thief, man, and woman among us. Most are here. The rest have gone east along the winter road, and we follow them at dawn.
        - id: ch03-b14
          speaker: john_canty
          text: >-
            I do not see the Wen among this honest company. Where is he?
        - id: ch03-b15
          speaker: ruffler
          text: >-
            Poor fellow, he is tasting brimstone now, and finding it too hot for comfort. Someone killed him in a brawl around midsummer.
        - id: ch03-b16
          speaker: john_canty
          text: >-
            I am sorry for that. The Wen was capable and brave.
        - id: ch03-b17
          speaker: ruffler
          text: >-
            He was indeed. Black Bess, his woman, still belongs to us, though she is away on the eastern tramp. A fine, well-behaved lass. No one ever saw her drunk more than four days out of seven.
        - id: ch03-b18
          speaker: john_canty
          text: >-
            She always was strict. I remember that. A worthy woman in every way. Her mother was less particular, and she had an ugly temper, but her wit was uncommon.
        - id: ch03-b19
          speaker: ruffler
          text: >-
            That wit killed her in the end. She read palms and practiced other kinds of fortune-telling until people gave her the name and reputation of a witch. The law roasted her slowly to death. I nearly felt tenderhearted when I saw how bravely she met her fate. All the while, she cursed every person in the crowd who stood gaping at her. The flames climbed toward her face, caught her thin gray hair, and crackled around her head, but still she cursed them. What mastery! Live a thousand years and you will never hear its equal. Her art died with her. A few poor imitators remain, but none can produce true blasphemy.
        - id: ch03-b20
          speaker: narrator
          text: >-
            The Ruffler sighed, and everyone sighed with him. Even such hardened outcasts could sometimes feel a passing sense of loss, especially when rare talent died without an heir. A deep drink all around soon lifted their spirits again.
        - id: ch03-b21
          speaker: john_canty
          text: >-
            Have any more of our friends met with trouble?
        - id: ch03-b22
          speaker: ruffler
          text: >-
            Some have, especially the newcomers. Small farmers were left helpless and hungry when their farms were taken away and turned into sheep pasture. They begged because they had nothing else. The law stripped them from the waist up, tied them behind a cart, and whipped them until the blood ran. Then it set them in the stocks for people to pelt. They begged again, so the law whipped them again and cut off an ear. The third time they begged, because what else could those poor devils do, it branded their cheeks with hot iron and sold them as slaves. If they escaped, hunters dragged them back and hanged them. A short story, quickly told. Others here suffered less. Yokel, Burns, and Hodge, stand up and show us your decorations.
        - id: ch03-b23
          speaker: narrator
          text: >-
            Three men rose and pulled away their rags. Old welts crossed their backs in thick ropes. One lifted his hair to show where his left ear had been. Another had lost part of an ear and bore the letter V branded into his shoulder. Then the third man spoke.
        - id: ch03-b24
          speaker: yokel
          text: >-
            I am Yokel. Once I was a prosperous farmer, with a loving wife and children. Now my life and work are very different. My family is gone. Perhaps they are in heaven, perhaps in the other place. But thank kind God they are no longer in England.
        - id: ch03-b25
          speaker: yokel
          text: >-
            My good, innocent old mother earned her bread by nursing sick people. One patient died, and the doctors did not know why. So they burned my mother as a witch while my little ones watched and cried. English law! Raise your cups, all of you. Drink to merciful English law for freeing her from this English hell!
          emotion: angry
        - id: ch03-b26
          speaker: narrator
          text: >-
            The gang drank, and Yokel thanked them.
        - id: ch03-b27
          speaker: yokel
          text: >-
            My wife and I went from house to house begging, with our hungry children beside us. But hunger is a crime in England. They stripped us and whipped us through three towns. Drink again to merciful English law. Its lash drank my Mary's blood, and soon it delivered her. She lies in the potter's field now, safe from every harm.
          emotion: angry
        - id: ch03-b28
          speaker: yokel
          text: >-
            And the children? While the law drove me from town to town under the whip, they starved. One more drop, lads, for the poor children who never harmed a living thing.
          emotion: sad
        - id: ch03-b29
          speaker: yokel
          text: >-
            I begged once more for a crust. They put me in the stocks and took an ear. I begged again, and they took the other one. I still begged, so they sold me as a slave. Beneath this stain on my cheek is the red letter S from the branding iron. A slave! Do you understand? An English slave stands before you. I ran away from my master. When they find me, I will hang. May heaven's heaviest curse fall on the law that commands it!
          emotion: angry
    - id: ch04
      title: Foo-foo the First
      blocks:
        - id: ch04-b01
          speaker: prince_edward
          text: >-
            You shall not hang! This very day, that law comes to an end!
        - id: ch04-b02
          speaker: narrator
          text: >-
            Edward's clear voice rang through the smoky air. Everyone turned. The strangely dressed little King hurried toward the fire, and questions burst from every side as soon as the light revealed him.
        - id: ch04-b03
          speakers: [gang_member_1, gang_member_2, gang_member_3]
          ensemble: chorus
          text: >-
            Who is that? What is he? Who are you, little man?
        - id: ch04-b04
          speaker: narrator
          text: >-
            Edward stood calmly beneath all their staring eyes. He answered with the dignity of a prince.
        - id: ch04-b05
          speaker: prince_edward
          text: >-
            I am Edward, King of England.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Wild laughter swept through the barn. Part of it was cruel mockery, and part came from sheer delight in what they thought was a splendid joke. Edward had offered justice with perfect seriousness. Their answer stung him deeply.
        - id: ch04-b07
          speaker: prince_edward
          text: >-
            You ill-mannered vagabonds! Is this how you receive the royal mercy I have promised you?
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: >-
            He went on, his voice angry and his gestures fierce, but mocking cries and louder laughter swallowed every word. John Hobbs tried again and again to speak over the uproar. At last the others heard him.
        - id: ch04-b09
          speaker: john_canty
          text: >-
            Friends, he is my son. He dreams foolish dreams, and he is completely mad. Pay no attention to him. He believes he truly is the King.
        - id: ch04-b10
          speaker: prince_edward
          text: >-
            I am the King, and one day you will learn it at your cost. You confessed to murder. You will hang for it.
          emotion: angry
        - id: ch04-b11
          speaker: john_canty
          text: >-
            You would betray me? You? Just wait until I get my hands on you!
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: >-
            The burly Ruffler stepped between them before Canty could seize Edward. One blow from his fist knocked Canty to the floor.
        - id: ch04-b13
          speaker: ruffler
          text: >-
            Enough! Have you no respect for kings or Rufflers? Insult my presence again, Hobbs, and I will hang you myself.
          emotion: angry
        - id: ch04-b14
          speaker: ruffler
          text: >-
            As for you, lad, do not threaten your companions, and do not speak against them when strangers can hear. Call yourself king if your madness demands it, but cause no harm with the game. And give up the title you just claimed. That is treason. We may be bad men in a few small ways, but none of us is vile enough to betray our King. Our hearts are loving and loyal there. Listen, and you will see. All together now. Long live Edward, King of England!
        - id: ch04-b15
          speakers: [gang_member_1, gang_member_2, gang_member_3, gang_member_4]
          ensemble: chorus
          text: >-
            Long live Edward, King of England!
        - id: ch04-b16
          speaker: narrator
          text: >-
            The ragged company answered with such a thunderous roar that the ruined barn shook. Pleasure brightened Edward's face for one instant. He bowed his head slightly.
        - id: ch04-b17
          speaker: prince_edward
          text: >-
            I thank you, my good people.
        - id: ch04-b18
          speaker: narrator
          text: >-
            That reply sent the whole gang into helpless laughter. When something like quiet returned, the Ruffler spoke firmly but without anger.
        - id: ch04-b19
          speaker: ruffler
          text: >-
            Let it go, boy. This is neither wise nor safe. Keep your fantasy if you must, but choose some other title.
        - id: ch04-b20
          speaker: narrator
          text: >-
            The tinker shrieked out an answer.
        - id: ch04-b21
          speaker: tinker
          text: >-
            Foo-foo the First, King of the Mooncalves!
        - id: ch04-b22
          speaker: narrator
          text: >-
            The name caught on at once. Every throat took it up through hoots, wild calls, and peals of laughter.
        - id: ch04-b23
          speakers: [gang_member_1, gang_member_2, gang_member_3, gang_member_4]
          ensemble: chorus
          text: >-
            Long live Foo-foo the First, King of the Mooncalves!
        - id: ch04-b24
          speaker: gang_member_1
          text: >-
            Bring him out and crown him!
        - id: ch04-b25
          speaker: gang_member_2
          text: >-
            Give him his royal robes!
        - id: ch04-b26
          speaker: gang_member_3
          text: >-
            Give him a scepter!
        - id: ch04-b27
          speaker: gang_member_4
          text: >-
            Put him on his throne!
        - id: ch04-b28
          speaker: narrator
          text: >-
            A score of other cries broke out at the same time. The gang swarmed around poor Edward before he could catch his breath. They pressed a tin basin onto his head as a crown and wrapped him in a torn blanket for his royal robe. They lifted him onto a barrel for a throne and thrust the tinker's soldering iron into his hand for a scepter.
        - id: ch04-b29
          speaker: narrator
          text: >-
            Then they all dropped to their knees. Wiping imaginary tears with filthy sleeves and aprons, they begged and moaned in a mocking chorus.
        - id: ch04-b30
          speaker: gang_member_1
          text: >-
            Be merciful to us, sweet King!
        - id: ch04-b31
          speaker: gang_member_2
          text: >-
            Do not crush the poor worms who beg before you, noble Majesty!
        - id: ch04-b32
          speaker: gang_member_3
          text: >-
            Have pity on your slaves. Comfort us with one royal kick!
        - id: ch04-b33
          speaker: gang_member_4
          text: >-
            Cheer us and warm us with your gracious light, blazing sun of royalty!
        - id: ch04-b34
          speaker: gang_member_1
          text: >-
            Make this ground holy with your foot, so we may eat its dirt and become noble!
        - id: ch04-b35
          speaker: gang_member_2
          text: >-
            Spit upon us, Sire. Then our children's children can boast forever of your princely kindness!
        - id: ch04-b36
          speaker: narrator
          text: >-
            The tinker won the greatest laughter of the night and carried off all the honors. He knelt before Edward and pretended to kiss the King's foot. Edward kicked him away in fury. At once the tinker went around the barn begging for a scrap of cloth. He wanted to paste it over the place on his face that the royal foot had touched and protect that precious spot from the common air.
        - id: ch04-b37
          speaker: tinker
          text: >-
            I must keep this sacred place away from common air! I shall make my fortune on the highway by showing it for a hundred shillings a look!
        - id: ch04-b38
          speaker: narrator
          text: >-
            His joke delighted the ragged crowd and made every other wit in the barn envy him.
        - id: ch04-b39
          speaker: narrator
          text: >-
            Tears of shame and anger stood in the little King's eyes. In his heart, one bitter thought repeated itself. If he had done these people a terrible wrong, they could hardly have treated him with greater cruelty. Yet he had wronged none of them. He had stepped forward only to promise Yokel justice and kindness. This mockery was the answer they gave him.
