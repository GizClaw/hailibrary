audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    herald:
      display_name: 传令官
      tts:
        delivery: 庄严洪亮，字句清楚有力
        timbre: 明亮浑厚
        pace: 缓慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 第九章　河上盛会
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 晚上九点，宫殿临河的整片岸边都亮起了灯。往城里望去，河面上密密麻麻全是船夫的小艇和游览彩舫。每条船的边沿都挂着五色灯笼。水波一摇，彩灯也跟着轻轻荡漾。远远看去，整条河就像一座望不到尽头的明亮花园，满园的花正让夏风吹得缓缓起伏。
        - id: ch01-b02
          speaker: narrator
          text: 一道宽阔的石阶从大露台直通水边，宽得足以站下一座德意志小邦的整支军队。王室戟卫穿着擦得锃亮的铠甲，整队守在石阶上。身着华服的侍从忙着做最后的准备，来来回回，上上下下，脚步一刻不停。
        - id: ch01-b03
          speaker: narrator
          text: 不久，一声命令传来，石阶上的一切活物顿时全不见了。周围一下静得叫人屏住呼吸，所有人都在等。放眼看去，万千船只里的人纷纷站了起来。他们用手遮住灯笼和火炬的强光，目光一齐投向宫殿。
        - id: ch01-b04
          speaker: narrator
          text: 四五十艘御用彩舫排成一列，靠到石阶旁。船身涂满金彩，高高翘起的船头和船尾刻着繁复的花纹。有的挂满旌旗长幡，有的铺着金线织锦，还有绣着纹章的壁毯。有的船上扬着丝旗，旗面缀了数不清的小银铃。微风一吹，银铃便洒下一阵细小而欢快的声音。
        - id: ch01-b05
          speaker: narrator
          text: 还有些彩舫更显尊贵，因为它们属于贴身侍奉亲王的贵族。船舷边立着一排排盾牌，上面绘满鲜艳的家族纹章。每艘彩舫都由一艘附艇拖着。附艇里不光有桨手，还坐着头盔胸甲光可鉴人的武士，以及一班乐师。
        - id: ch01-b06
          speaker: narrator
          text: 这时，仪仗队的前锋终于从宫门出现了。最先出来的是一队戟卫。他们穿着黑褐相间的条纹紧身裤，戴着天鹅绒帽，帽子一侧缀有银玫瑰。紫红蓝布做成的紧身上衣，前胸后背都用金线绣着亲王的徽记，也就是三根羽毛。他们的戟柄裹着深红天鹅绒，用镀金钉牢牢扣住，下面还垂着金穗。
        - id: ch01-b07
          speaker: narrator
          text: 戟卫分向左右，从宫门一直排到水边。穿着亲王金红制服的侍从，在两队人中间展开一幅厚厚的放射纹地毯。地毯刚铺好，宫内便响起嘹亮的号声，水上的乐师也奏起轻快的前曲。两名引礼官手持白杖，迈着缓慢庄严的步子走出宫门。
        - id: ch01-b08
          speaker: narrator
          text: 后面的人一个接一个跟了出来。先是手捧市政权杖的官员，又有一人捧着伦敦城剑。几名城市卫队军士全副装束，袖口佩着徽章。再后面是穿纹章袍的嘉德纹章院长，袖系白带的巴斯骑士和他们的侍从。法官披着猩红法袍，头戴白麻法帽。英格兰大法官也穿着猩红长袍，前襟敞开，边上镶着白貂皮。市参议员代表披猩红斗篷，各行业公会的首领则穿着礼袍。
        - id: ch01-b09
          speaker: narrator
          text: 接着，十二名法国绅士盛装走下石阶。他们的白锦缎紧身衣横饰金带，外面是深红天鹅绒短披风，衬里用了紫罗兰色塔夫绸，下面还穿着石竹红马裤。他们都是法国大使的随员。随后又来了西班牙大使手下的十二名骑士。这些人从头到脚一身黑天鹅绒，没有半点装饰。走在更后面的，是几位英格兰大贵族和各自的侍从。
        - id: ch01-b10
          speaker: narrator
          text: 宫内再次响起号声。亲王的舅父走出宫门，他后来成了声名显赫的萨默塞特公爵。这时候，他穿着黑色金锦紧身衣，披一件织有金花的深红缎斗篷，斗篷上还有银网缎带。他转过身，摘下插着羽饰的帽子，深深弯腰致敬。接着，他一步一步向后退，每走一步，就鞠一回躬。
        - id: ch01-b11
          speaker: narrator
          text: 跟着，一声绵长的号角响了起来。传令官高声宣告。
        - id: ch01-b12
          speaker: herald
          text: 尊贵而威武的威尔士亲王爱德华殿下驾到！众人让路！
        - id: ch01-b13
          speaker: narrator
          text: 宫墙高处，一长排赤红的火舌轰然跃起。河面上的万千人群立刻爆发出震天的欢呼。汤姆·坎蒂终于现身了。他正是这场盛会的缘由，也是盛会的主角。他微微低下那颗亲王的头，向众人致意。
        - id: ch01-b14
          speaker: narrator
          text: 汤姆穿着华贵的白缎紧身衣。紫色金银织锦做成的前襟上撒满钻石，边上镶着白貂皮。外面那件白底金锦斗篷轧着三羽徽记，衬里是蓝缎，上面嵌满珍珠宝石，又用一枚钻石搭扣系在身前。他的脖子上挂着嘉德勋章，还有好几枚外国王室勋章。灯光落在哪里，那里的珠宝就迸出刺眼的光芒。
        - id: ch01-b15
          speaker: narrator
          text: 啊，汤姆·坎蒂！你出生在破屋里，在伦敦的阴沟边长大。从小陪着你的，只有破衣、污泥和苦难。可看看眼前吧，这该是怎样一番奇景！
