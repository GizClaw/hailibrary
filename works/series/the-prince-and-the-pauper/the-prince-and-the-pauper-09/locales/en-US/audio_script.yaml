audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently ironic
        timbre: clear and resonant
        pace: measured
        pitch: medium
    herald:
      display_name: Herald
      tts:
        delivery: formal, commanding, and ceremonial
        timbre: strong and ringing
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The river pageant.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            At nine that evening, the whole riverfront of the palace blazed with light. Looking toward the city, a person could see the river crowded with watermen's boats and pleasure barges. Colored lanterns shone along their edges. As the boats rocked gently on the waves, the lights looked like an endless glowing garden, its flowers moving softly in a summer wind.
        - id: ch01-b02
          speaker: narrator
          text: >-
            A grand terrace of stone steps led from the palace down to the water. It was so broad that the entire army of a small German state could have gathered there. Royal guards stood in rows, their polished armor gleaming. Servants in brilliant uniforms hurried up and down, crossing this way and that as they made the final preparations.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Then a command was given. At once, every living soul disappeared from the steps. A deep hush settled over the scene as everyone waited. Far out across the river, thousands of people rose in their boats. They shaded their eyes from the glare of the lanterns and torches and stared toward the palace.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Forty or fifty royal barges moved into place beside the steps. Gold covered them, and their high bows and sterns were carved in elaborate designs. Some flew banners and long streamers. Some were draped in cloth of gold and tapestries embroidered with coats of arms. Others carried silk flags hung with countless tiny silver bells. Whenever the breeze stirred those flags, the bells scattered little showers of cheerful music through the air.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The grandest barges belonged to nobles who served the prince himself. Rows of splendid shields, each painted with a noble family's arms, ran along their sides. A smaller boat towed every state barge. Along with the rowers, each of those boats carried armed men in shining helmets and breastplates, and a company of musicians.
        - id: ch01-b06
          speaker: narrator
          text: >-
            At last, the first part of the procession appeared beneath the great palace gateway. A troop of halberdiers came forward. They wore black-and-tawny striped hose and velvet caps with silver roses at the sides. Their blue and dark-red doublets bore the prince's badge of three feathers, embroidered in gold on the front and back. Crimson velvet covered the shafts of their halberds, with gilt nails holding it in place and golden tassels for ornament.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The guards divided to the right and left. They formed two long lines from the palace gate all the way to the river. Between them, servants in the prince's gold-and-crimson livery unrolled a thick striped carpet. When everything was ready, trumpets sounded from inside the palace, and the musicians on the water began a lively tune.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Two ushers carrying white wands passed through the gate with slow, stately steps. An officer with the city's ceremonial mace followed them. Behind him came another officer carrying the city sword. Next came several sergeants of the city guard, fully equipped and wearing badges on their sleeves. The Garter King-at-arms followed in his official coat, then several Knights of the Bath, each wearing white lace on one sleeve, with their squires behind them.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The judges came next in scarlet robes and close white caps. After them walked the Lord High Chancellor of England. His scarlet robe stood open at the front and was edged with white fur. A group of aldermen in scarlet cloaks followed, and then came the leaders of the city's different guilds, dressed in their robes of office.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Now twelve French gentlemen made their way down the steps. Their splendid clothes included white damask jackets crossed with gold, short crimson-velvet cloaks lined in violet silk, and flesh-colored breeches. They belonged to the French ambassador's party. Behind them came twelve horsemen from the Spanish ambassador's party. These men wore plain black velvet, without a single ornament. Several great English nobles and their attendants followed.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Another flourish of trumpets rang out from within. The prince's uncle, who would one day become the great Duke of Somerset, appeared at the gateway. He wore a doublet of black cloth woven with gold and a crimson satin cloak patterned with golden flowers and decorated with nets of silver. Turning toward the doorway, he removed his feathered cap and bowed low. Then he began walking backward, bowing again with every step.
        - id: ch01-b12
          speaker: narrator
          text: >-
            A long trumpet blast followed. Then a herald's voice rang above the waiting crowd.
        - id: ch01-b13
          speaker: herald
          text: >-
            Make way for the high and mighty Lord Edward, Prince of Wales!
        - id: ch01-b14
          speaker: narrator
          text: >-
            High along the palace walls, a line of red flames leaped into the sky with a crash like thunder. The great mass of people on the river answered with a tremendous roar of welcome. Then Tom Canty, the cause and hero of it all, stepped into sight and gave a slight, princely bow.
        - id: ch01-b15
          speaker: narrator
          text: >-
            His clothes were magnificent. He wore a white satin doublet with a panel of purple tissue across the front, sprinkled with diamonds and bordered in ermine. Over it lay a mantle of white cloth of gold. The prince's crest of three feathers covered the mantle. Blue satin lined it, pearls and precious stones adorned it, and a clasp of brilliant jewels held it closed.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Around Tom's neck hung the Order of the Garter and several royal orders from foreign lands. Wherever the light touched him, his jewels answered with a flash bright enough to blind the eye.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Oh, Tom Canty! He had been born in a hovel and raised in the gutters of London. Rags, dirt, and misery were the things he knew. And now, what a sight he was!
