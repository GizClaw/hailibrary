  chapters:
    - id: ch01
      title: Edward as King
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Miles Hendon had looked picturesque enough before the riot on London Bridge. When he came out of it, he looked even more remarkable. He had gone in with little money and come out with none. The pickpockets had taken his last farthing.
        - id: ch01-b02
          speaker: narrator
          text: >-
            None of that mattered if he could find his boy. Miles was a soldier, so he did not begin at random. First, he laid out a campaign.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Where would the boy go? Most likely, back to the places he knew. A troubled mind would do that when it was homeless and alone, and so would a sound one. The boy's rags, and the low villain who knew him and claimed to be his father, pointed toward one of London's poorest quarters.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The search should be quick, Miles decided. He would not hunt for the boy. He would hunt for a crowd, whether large or small. Sooner or later, he was sure to find his poor little friend standing in the middle of one, declaring that he was King as usual while the shabby mob amused itself by teasing and tormenting him. Then Miles would cripple a few of them, carry off his young ward, and cheer him with loving words. After that, the two would never be parted again.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Miles began his search. Hour after hour, he tramped through filthy streets and back alleys. There seemed to be no end of groups and crowds, but not one held any sign of the boy. That surprised him, though it did not discourage him. As far as Miles could see, there was nothing wrong with his plan. He had expected a short campaign. This one was simply taking longer.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Daylight finally came. By then, Miles had walked many miles and searched more gatherings than he could count. All he had gained was a tired body, an empty stomach, and a terrible need for sleep. He wanted breakfast, but had no way to buy it. Begging never entered his mind. He would sooner give up his honor than pawn his sword. He might have sold some clothes, but finding a buyer for those rags would have been as hard as finding a buyer for a disease.
        - id: ch01-b07
          speaker: narrator
          text: >-
            At noon, he was still walking. Now he joined the common people following the royal procession, certain such a grand display would draw his little mad friend. The pageant twisted and turned through London, and Miles stayed with it all the way to Westminster and the Abbey. For a long, weary while, he drifted here and there through the great crowds packed nearby. Still, he found nothing.
        - id: ch01-b08
          speaker: narrator
          text: >-
            At last, puzzled and defeated, he wandered away. He was thinking so hard, trying to find some way to improve his campaign, that he stopped noticing where he went. When he finally came out of his thoughts and looked around, London lay far behind him and the day was nearly over. He had reached the countryside beside the river. Fine country houses stood all around, in a district where a man in his clothes would not be welcome.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The weather was mild, so Miles stretched out behind a hedge to rest and think. Soon, sleep began to steal over him. From far away came the faint boom of cannon.
        - id: ch01-b10
          speaker: miles_hendon
          text: >-
            The new King has been crowned.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Then he fell asleep. He had gone more than thirty hours without sleep or rest, and he did not wake until nearly the middle of the next morning.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Miles rose lame, stiff, and half starved. He washed in the river, filled his empty stomach with a pint or two of water, and trudged toward Westminster, grumbling at himself for wasting so much time. Hunger gave him a new plan. He would try to speak with old Sir Humphrey Marlow and borrow a few marks. What would come after that? It did not matter yet. This first step was enough of a plan for the present, and he could enlarge it when the step was done.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Near eleven o'clock, he approached the palace. A host of splendidly dressed people surrounded him, all moving in the same direction, but Miles was impossible to overlook in his ruined clothes. His costume made sure of that. He studied their faces closely, hoping to find some kindly person who might carry his name to the old lieutenant. Miles himself had no chance of getting inside.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Presently, Humphrey Marlow, the royal whipping boy, passed him. Humphrey turned back and examined the ragged figure.
        - id: ch01-b15
          speaker: humphrey_marlow
          text: >-
            If that isn't the very vagabond His Majesty is so worried about, then I'm a fool. Perhaps I was one already. He matches the description down to the last rag. God would be wasting miracles if He made two men like that. If only I had some excuse to speak to him.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Miles saved him the trouble. Like anyone who feels a hard stare from behind, he turned around. He saw the interest in Humphrey's eyes and stepped closer.
        - id: ch01-b17
          speaker: miles_hendon
          text: >-
            You have just come from the palace. Do you belong there?
        - id: ch01-b18
          speaker: humphrey_marlow
          text: >-
            Yes, sir.
        - id: ch01-b19
          speaker: miles_hendon
          text: >-
            Do you know Sir Humphrey Marlow?
        - id: ch01-b20
          speaker: narrator
          text: >-
            Humphrey started. That was the name of his dead father.
        - id: ch01-b21
          speaker: humphrey_marlow
          text: >-
            I knew him very well, sir.
        - id: ch01-b22
          speaker: miles_hendon
          text: >-
            Good. Is he inside?
        - id: ch01-b23
          speaker: humphrey_marlow
          text: >-
            Yes.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Humphrey silently added that his father was inside his grave.
        - id: ch01-b25
          speaker: miles_hendon
          text: >-
            Would you do me a favor? Take him my name and say I beg a private word with him.
        - id: ch01-b26
          speaker: humphrey_marlow
          text: >-
            Gladly, sir.
        - id: ch01-b27
          speaker: miles_hendon
          text: >-
            Tell him Miles Hendon, Sir Richard's son, is waiting outside. I shall owe you a great deal, my good lad.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Humphrey was disappointed. The King had not given that name. Still, he decided this must be the other man's twin brother, and the fellow could surely bring news of the one His Majesty wanted.
        - id: ch01-b29
          speaker: humphrey_marlow
          text: >-
            Wait in that recess for a moment, sir. I'll bring you an answer.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Miles went to the place Humphrey indicated, a hollow in the palace wall with a stone bench where sentries could shelter from bad weather. He had barely sat down when an officer passed with several halberdiers under his command. The officer spotted Miles, stopped his men, and ordered him to come out at once. Miles obeyed. The officer promptly arrested him as a suspicious character prowling inside the palace grounds.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Things looked grim. Miles tried to explain, but the officer roughly silenced him. Then he told the guards to take Miles's sword and search him.
        - id: ch01-b32
          speaker: miles_hendon
          text: >-
            May God in His mercy grant that they find something. I have searched long enough and found nothing, though I need it more than they do.
        - id: ch01-b33
          speaker: narrator
          text: >-
            The search produced only a document. The officer tore it open. Miles smiled when he recognized the crooked marks his lost little friend had made on that dark day at Hendon Hall. Then the officer read the English paragraph. His face darkened, while Miles's face went pale.
        - id: ch01-b34
          speaker: palace_officer
          text: >-
            Another man claiming the Crown! They are breeding like rabbits today. Hold this rascal tight while I take his precious paper inside and send it to the King.
          emotion: angry
        - id: ch01-b35
          speaker: narrator
          text: >-
            The officer hurried away, leaving Miles in the halberdiers' grip.
        - id: ch01-b36
          speaker: miles_hendon
          text: >-
            My run of bad luck is finally over. That scrap of writing will put me at the end of a rope for certain. And what will happen to my poor boy? Only God knows.
          emotion: sad
        - id: ch01-b37
          speaker: narrator
          text: >-
            After a while, Miles saw the officer hurrying back. He pulled his courage together, determined to meet whatever trouble came as a man should. Instead, the officer ordered the guards to release him and put his sword back into his hands. Then he bowed with great respect.
        - id: ch01-b38
          speaker: palace_officer
          text: >-
            Please follow me, sir.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Miles followed him.
        - id: ch01-b40
          speaker: miles_hendon
          text: >-
            If I weren't on my way to death and judgment, where I must be sparing with sin, I would throttle this scoundrel for his mocking courtesy.
        - id: ch01-b41
          speaker: narrator
          text: >-
            They crossed a crowded court and reached the palace's grand entrance. With another bow, the officer handed Miles to a magnificently dressed official. That man received him with the deepest respect and led him through a great hall. Rows of splendid servants lined both sides. They bowed low as the two men passed, then nearly doubled over in fits of silent laughter at the stately scarecrow as soon as his back was turned.
        - id: ch01-b42
          speaker: narrator
          text: >-
            They climbed a broad staircase through flocks of fine people. At last, the official brought him into a vast room and opened a path through the assembled nobility of England. He bowed, reminded Miles to remove his hat, and left him standing alone in the center. Every eye in the room turned toward him. Plenty of faces frowned with outrage, and more than enough wore amused, mocking smiles.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Miles was completely bewildered. Five steps away, beneath a royal canopy, sat the young King. His head was bent and turned aside as he spoke to a brightly dressed man who looked like a human bird of paradise, perhaps a duke. Miles thought it was hard enough to be condemned to death while still in the full strength of life. Must this strangely public humiliation be added to it? He wished the King would hurry and finish the business, for some of the glittering people nearby were growing offensive.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Then the King raised his head, and Miles saw his face clearly. The sight nearly stopped his breath. He stared at that fair young face as if turned to stone.
        - id: ch01-b45
          speaker: miles_hendon
          text: >-
            Why, the lord of the Kingdom of Dreams and Shadows is sitting on his throne!
          emotion: surprised
        - id: ch01-b46
          speaker: narrator
          text: >-
            Still staring in wonder, Miles muttered broken phrases. Then he looked around at the brilliant crowd and splendid room.
        - id: ch01-b47
          speaker: miles_hendon
          text: >-
            But these people are real. They are truly real. Surely this cannot be a dream.
          emotion: surprised
        - id: ch01-b48
          speaker: narrator
          text: >-
            He looked at the King once more. Was this a dream, or was the boy truly England's sovereign? Could he really be the King, and not the friendless young madman Miles had taken him for? How could anyone solve such a riddle?
        - id: ch01-b49
          speaker: narrator
          text: >-
            A sudden idea came to him. Miles strode to the wall, picked up a chair, carried it back, set it down, and sat.
        - id: ch01-b50
          speaker: narrator
          text: >-
            An angry murmur swept through the room. A rough hand seized him.
        - id: ch01-b51
          speaker: courtier
          text: >-
            On your feet, you ill-mannered clown! How dare you sit before the King?
          emotion: angry
        - id: ch01-b52
          speaker: narrator
          text: >-
            The disturbance caught Edward's attention. He reached out his hand and cried aloud.
        - id: ch01-b53
          speaker: prince_edward
          text: >-
            Do not touch him. It is his right!
        - id: ch01-b54
          speaker: narrator
          text: >-
            The astonished crowd drew back. The King continued.
        - id: ch01-b55
          speaker: prince_edward
          text: >-
            Ladies, lords, and gentlemen, know that this is my trusted and beloved servant, Miles Hendon. He placed his good sword between his prince and bodily harm, perhaps even death. By the King's own word, he is now a knight.
        - id: ch01-b56
          speaker: prince_edward
          text: >-
            He gave me a greater service as well. He saved his sovereign from the whip and its shame by taking the punishment himself. For that, he is a peer of England and Earl of Kent. He shall receive the gold and lands that belong to his rank.
        - id: ch01-b57
          speaker: prince_edward
          text: >-
            The privilege you have just seen is his by royal grant. We decree that the heads of his family shall have the right to sit in the presence of England's monarch, generation after generation, for as long as the Crown endures. Do not trouble him.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Two people had been delayed on their journey from the country and had arrived only that morning. They had been in the room for no more than five minutes. Now they listened to these astonishing words, looked at the King, looked at the scarecrow, then looked back at the King. They seemed almost too confused to move. They were Sir Hugh and Lady Edith, but the new Earl never saw them.
        - id: ch01-b59
          speaker: narrator
          text: >-
            Miles still gazed at the monarch in a daze.
        - id: ch01-b60
          speaker: miles_hendon
          text: >-
            Heaven help me! This is my pauper? My lunatic? This is the boy I meant to teach about grandeur in my house with seventy rooms and twenty-seven servants? The boy I thought had known nothing but rags to wear, kicks for comfort, and scraps to eat? The boy I adopted and meant to make respectable? I wish I had a bag to hide my head in!
          emotion: surprised
        - id: ch01-b61
          speaker: narrator
          text: >-
            Then Miles suddenly remembered his manners. He dropped to his knees, placed his hands between the King's, swore loyalty, and paid homage for his lands and titles. When he rose, he stood respectfully to one side. Every eye still watched him, and now many watched with envy.
        - id: ch01-b62
          speaker: narrator
          text: >-
            The King noticed Sir Hugh. His eyes flashed, and his voice rang with anger.
        - id: ch01-b63
          speaker: prince_edward
          text: >-
            Strip this robber of his false honors and stolen estates. Lock him away until I have use for him.
          emotion: angry
        - id: ch01-b64
          speaker: narrator
          text: >-
            The former Sir Hugh was led away.
        - id: ch01-b65
          speaker: narrator
          text: >-
            A stir rose at the far end of the room. The assembly parted, and Tom Canty came down between those living walls behind an usher. His clothes were strange but rich. He knelt before the King.
        - id: ch01-b66
          speaker: prince_edward
          text: >-
            I have heard the story of these past weeks, and I am well pleased with you. You ruled the kingdom with true royal gentleness and mercy. Have you found your mother and sisters again? Good. They will be cared for. As for your father, he may hang if you wish it and the law allows.
        - id: ch01-b67
          speaker: prince_edward
          text: >-
            Let everyone hear this. From today onward, the children who live at Christ's Hospital under the King's care shall receive food for their minds and hearts as well as for their bodies. This boy shall live there and hold the highest place among its honored governors for the rest of his life.
        - id: ch01-b68
          speaker: prince_edward
          text: >-
            Because he has been a king, he deserves more than ordinary respect. Remember his ceremonial dress. It will mark him, and no one else may copy it. Wherever he goes, it will remind the people that he was once royal. No one shall deny him proper respect or fail to salute him. The throne will protect him, and the Crown will support him. He shall be known by the honorable title of the King's Ward.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Proud and happy, Tom Canty rose and kissed the King's hand. Then he was led from the royal presence.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Tom wasted no time. He flew to his mother, eager to tell her, Nan, and Bet everything and have them help him enjoy the wonderful news.
