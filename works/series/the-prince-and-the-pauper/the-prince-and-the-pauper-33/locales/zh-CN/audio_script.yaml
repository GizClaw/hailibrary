audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华王子
      tts:
        delivery: 骄傲刚烈，意志坚定，带着君王的威严
        timbre: 清亮坚实
        pace: 明快
        pitch: 中高
    tom_canty:
      display_name: 汤姆·康蒂
      tts:
        delivery: 天真敏捷，窘迫时带着平民孩子的直率
        timbre: 清亮稚嫩
        pace: 轻快灵活
        pitch: 中高
    miles_hendon:
      display_name: 迈尔斯·亨顿
      tts:
        delivery: 豪爽诙谐，危急时勇敢坚定
        timbre: 洪亮粗粝
        pace: 明快有力
        pitch: 中低
    whipping_boy:
      display_name: 挨鞭童子
      tts:
        delivery: 机灵活泼，心里话带着顽皮的自嘲
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 中高
    palace_officer:
      display_name: 王宫军官
      tts:
        delivery: 粗暴傲慢，奉命行事时干脆利落
        timbre: 粗硬低沉
        pace: 稳健
        pitch: 中低
    courtier:
      display_name: 廷臣
      tts:
        delivery: 高傲严厉，对失礼之举毫不容忍
        timbre: 清晰锐利
        pace: 急促
        pitch: 中等
  chapters:
    - id: ch01
      title: 寻找失踪的孩子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            迈尔斯·亨顿卷进伦敦桥的骚乱以前，模样就够惹眼了。等他从人堆里脱身出来，更是狼狈。他进去时还剩几个钱，出来时一个子儿也没有，扒手连最后一枚铜板都摸走了。不过，只要能找到那个孩子，钱丢了也不要紧。
        - id: ch01-b02
          speaker: narrator
          text: >-
            迈尔斯是个军人，办事不会四处乱撞。他先想好搜索的方略。孩子会做什么，又会去哪里？他觉得，无家可归又遭人遗弃以后，无论神志正常不正常，人总会回到从前熟悉的地方。孩子穿着破衣，那个下流恶棍又认识他，还自称是他父亲，可见他的家必在伦敦最穷苦的街区。
        - id: ch01-b03
          speaker: narrator
          text: >-
            这样一想，找人应该不会太难，也不会花很久。迈尔斯不必寻找孩子，只要寻找人群。无论人群大小，早晚有一次，他会在某个人堆中央发现自己可怜的小朋友。那些癞皮狗般的家伙准拿折磨他、激怒他取乐，而他还是照旧宣称自己是国王。迈尔斯到时便打残几个人，把自己的小监护人救走，再用温柔的话安慰他、哄他高兴。从那以后，两人再也不分开。
        - id: ch01-b04
          speaker: narrator
          text: >-
            迈尔斯照这个办法出发了。他一小时又一小时地走过狭窄的后巷和肮脏的街道，看遍一群又一群人，遇到的人堆简直没完没了，却始终也不见孩子的影子。这叫他很意外，但没有使他泄气。他仍相信计划没错，只是原以为很快结束的战役，如今拖得越来越久。
        - id: ch01-b05
          speaker: narrator
          text: >-
            天终于亮了。迈尔斯走了不知多少英里，也查看了不知多少人群，只换来一身疲惫、满腹饥饿和浓重的睡意。他想吃早饭，却无从弄到。乞讨这件事，他根本想不到。要他典当宝剑，就跟要他舍弃荣誉一样不可能。衣服倒可以卖，可给这身衣服找买主，恐怕和给一种疾病找买主一样容易。
        - id: ch01-b06
          speaker: narrator
          text: >-
            中午，他还在走。这回，他混进了尾随王家仪仗的民众当中。他料想，这样盛大的场面一定会吸引那个小疯子。迈尔斯跟着仪仗在伦敦曲曲折折地绕来绕去，一直走到威斯敏斯特和大教堂。随后，他在附近聚集的人海里东奔西走，疲惫地找了很久，依旧一无所获。他既困惑又茫然，只好离开人群，边走边想，怎样才能改进自己的计划。
        - id: ch01-b07
          speaker: narrator
          text: >-
            等迈尔斯回过神来，城镇早已落在身后，天色也晚了。他来到乡间的河边，四周都是富丽的庄园。这种地方，显然不会欢迎他这身衣裳。天气并不冷，他便躺到树篱背风的一面休息。困意很快蒙住了他的知觉，远方隐约传来低沉的炮声。
        - id: ch01-b08
          speaker: miles_hendon
          text: 新国王已经加冕了。
        - id: ch01-b09
          speaker: narrator
          text: >-
            这个念头刚刚闪过，迈尔斯就睡着了。他已经三十多个小时没有睡觉，也没有休息。这一觉直到第二天将近中午才醒。起来时，他腿脚酸痛，浑身僵硬，肚子快饿瘪了。他到河里洗了洗，又一口气喝下一两品脱河水，勉强压住饥饿，随后拖着脚步朝威斯敏斯特走去，一路责怪自己白白浪费了太多时间。
        - id: ch01-b10
          speaker: narrator
          text: >-
            饥饿又帮他想出一个办法。他要设法见到老汉弗莱·马洛爵士，先借几个马克。眼下有这一步就够了，办成以后，再想下一步也不迟。
    - id: ch02
      title: 王宫外的误会
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            快到十一点，迈尔斯走近王宫。许多衣饰华美的人和他走向同一处，可他那身装束太出众，绝不会埋没在人群里。他逐张端详路人的脸，想找一个看起来慈善的人，替自己向老副官通报姓名。亲自进宫，他知道绝无可能。
        - id: ch02-b02
          speaker: narrator
          text: >-
            这时，挨鞭童子从他身边走过，忽然转过身，把他仔细打量了一遍。
        - id: ch02-b03
          speaker: whipping_boy
          text: >-
            这若不是陛下急着寻找的流浪汉，我就是头蠢驴。说不定我本来就是。他身上每一块破布都对得上。上帝若造出两个这样的家伙，那便是在白白糟蹋奇迹。我要能找个由头跟他说话就好了。
        - id: ch02-b04
          speaker: narrator
          text: >-
            男孩不必费心找由头。迈尔斯被背后的目光盯得不自在，自己转过身来。他看见男孩满眼好奇，便走近问他。
        - id: ch02-b05
          speaker: miles_hendon
          text: 你刚从王宫出来，是宫里的人吗？
        - id: ch02-b06
          speaker: whipping_boy
          text: 是的，老爷。
        - id: ch02-b07
          speaker: miles_hendon
          text: 那你认得汉弗莱·马洛爵士吗？
        - id: ch02-b08
          speaker: narrator
          text: 男孩吃了一惊。那正是他已经去世的父亲。
        - id: ch02-b09
          speaker: whipping_boy
          text: 我当然认得，老爷。
        - id: ch02-b10
          speaker: miles_hendon
          text: 好极了。他现在在宫里吗？
        - id: ch02-b11
          speaker: whipping_boy
          text: 在。
        - id: ch02-b12
          speaker: narrator
          text: 男孩嘴上这样回答，心里却悄悄补了一句。
        - id: ch02-b13
          speaker: whipping_boy
          text: 他在自己的坟墓里。
        - id: ch02-b14
          speaker: miles_hendon
          text: >-
            那就请你帮个忙，把我的名字通报给他，说我求见，想私下跟他说句话。
        - id: ch02-b15
          speaker: whipping_boy
          text: 好先生，我很乐意替您办妥。
        - id: ch02-b16
          speaker: miles_hendon
          text: >-
            请告诉他，理查德爵士的儿子迈尔斯·亨顿正在外面等候。好孩子，我会十分感激你的。
        - id: ch02-b17
          speaker: narrator
          text: 男孩有些失望。国王说的并不是这个名字。不过，他立刻又有了主意。
        - id: ch02-b18
          speaker: whipping_boy
          text: >-
            没关系，他准是那个人的孪生兄弟，也一定知道另一个什么“横七竖八爵士”的消息。好先生，请到那边等一小会儿，我很快带消息回来。
        - id: ch02-b19
          speaker: narrator
          text: >-
            迈尔斯走进王宫外墙的一处凹间。里面放着石凳，坏天气时可以替卫兵挡风遮雨。他刚刚坐下，一名军官就带着几个戟兵经过。军官看见他，立刻叫手下停步，又喝令他从凹间出来。迈尔斯顺从地走了出来，却马上被当成在王宫范围内游荡的可疑人物抓住。眼看事情不妙，他正要解释，军官却粗暴地堵住他的话，命人缴下他的剑，再从头到脚搜他的身。
        - id: ch02-b20
          speaker: miles_hendon
          text: >-
            但愿仁慈的上帝叫你们搜出点东西。我自己已经搜了很久，什么也没找到，可我比你们更需要有点收获。
        - id: ch02-b21
          speaker: narrator
          text: >-
            他们翻遍迈尔斯全身，只搜出一份文书。军官一把将它撕开。迈尔斯认出上面的鬼画符，正是自己在亨顿庄园遭难的那一天，失踪的小朋友亲手写下的，不禁笑了。军官读到那段英文，脸色越来越阴沉。迈尔斯在一旁听着，脸色却朝相反的方向变化，越来越白。
        - id: ch02-b22
          speaker: palace_officer
          text: >-
            又来一个争王位的！他们今天简直像兔子一样，一窝接一窝。弟兄们，把这个恶棍抓紧。我把这份宝贝文书送给国王时，绝不能让他逃走。
          emotion: angry
        - id: ch02-b23
          speaker: narrator
          text: 军官匆匆离去，迈尔斯被戟兵牢牢看住。
        - id: ch02-b24
          speaker: miles_hendon
          text: >-
            我的霉运总算要到头了。凭这张纸，他们一定会把我吊死。可我那可怜的孩子怎么办？只有仁慈的上帝知道。
          emotion: sad
        - id: ch02-b25
          speaker: narrator
          text: >-
            过了一阵，军官急匆匆地回来。迈尔斯鼓起勇气，准备像个男子汉一样迎接灾祸。没想到军官却命人放开他，把剑还给他，又恭敬地鞠了一躬。
        - id: ch02-b26
          speaker: palace_officer
          text: 先生，请跟我来。
        - id: ch02-b27
          speaker: miles_hendon
          text: >-
            若不是我正走向死亡和末日审判，非得少犯点罪，我真想掐死这个假装恭敬的恶棍。
    - id: ch03
      title: 梦幻之国的君主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            两人穿过人来人往的庭院，来到王宫宏伟的正门。军官又鞠了一躬，把迈尔斯交给一名衣饰华贵的官员。那人极恭敬地接待他，领他走过宽广的大厅。两旁整排衣着光鲜的仆役见他们经过，纷纷低头行礼。可等这个庄严的稻草人一转过背，众人便笑得像要断气一样，浑身抽搐，却又不敢发出一点声音。
        - id: ch03-b02
          speaker: narrator
          text: >-
            他们登上宽阔的楼梯，从一群群盛装人物中间穿过，最后走进一间巨大的厅堂。官员替迈尔斯从英格兰贵族当中分开一条路，又提醒他摘下帽子，这才鞠躬离开。迈尔斯独自站在厅堂中央，所有眼睛都盯着他。有些人愤怒地皱眉，也有不少人露出轻蔑的笑。
        - id: ch03-b03
          speaker: narrator
          text: >-
            迈尔斯完全糊涂了。年轻的国王就在五步以外，坐在华盖下面，头低着，又偏向一边，正和一个仿佛人形极乐鸟的家伙说话，那人大概是位公爵。迈尔斯觉得，自己正当壮年就要被判死刑，已经够难受了，何必还要加上这样一场特别公开的羞辱。他只希望国王快些处置，因为旁边那些花枝招展的人已经越来越放肆，实在叫他受不了。
        - id: ch03-b04
          speaker: narrator
          text: >-
            就在这时，国王微微抬起头。迈尔斯终于看清他的脸，顿时几乎喘不过气来。他直瞪着那张俊秀的少年面孔，像被钉在了原地。过了好一会儿，才喊出一句话。
        - id: ch03-b05
          speaker: miles_hendon
          text: 看哪，梦幻与幽影之国的君主，正坐在他的王座上！
          emotion: surprised
        - id: ch03-b06
          speaker: narrator
          text: 迈尔斯仍在惊奇地凝望，嘴里断断续续地念叨。他又看看华丽的人群和辉煌的厅堂。
        - id: ch03-b07
          speaker: miles_hendon
          text: >-
            可这些都是真的，千真万确。这一定不是梦。可是，那真是英格兰的君王吗？他不是我以为的那个无依无靠、疯疯癫癫的可怜汤姆？谁能替我解开这个谜？
        - id: ch03-b08
          speaker: narrator
          text: >-
            一个念头忽然闪过。迈尔斯大步走到墙边，搬来一把椅子，往地上一放，径直坐了下来。四周立刻响起愤怒的低语。一只粗暴的手按到他身上。
        - id: ch03-b09
          speaker: courtier
          text: 起来，你这个不懂规矩的乡巴佬！竟敢当着国王的面坐下？
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: 这阵骚动引起了国王的注意。他伸出手，高声喝止。
        - id: ch03-b11
          speaker: prince_edward
          text: 不许碰他！坐在这里是他的权利。
        - id: ch03-b12
          speaker: narrator
          text: 人群惊呆了，纷纷向后退去。国王继续向整个厅堂宣告。
        - id: ch03-b13
          speaker: prince_edward
          text: >-
            诸位夫人、勋爵和先生们，听我说。此人是我忠实而亲爱的臣仆迈尔斯·亨顿。他曾拔剑保护自己的王子，使我免受伤害，甚至免于一死。凭这件功劳，我亲口封他为骑士。他还立下了更大的功劳。为了使自己的君王免受鞭打和羞辱，他替我承受了这一切。所以，他从此是英格兰的贵族、肯特伯爵，还会得到与这份尊荣相称的黄金和土地。
        - id: ch03-b14
          speaker: prince_edward
          text: >-
            他刚才行使的特权，也是我亲自赐下的。从今天起，只要英格兰的王冠仍在，他这一族每一代的族长，都有权坐在君王面前。任何人都不许为难他。
        - id: ch03-b15
          speaker: narrator
          text: >-
            有两个人因为路上耽搁，直到今晨才从乡下赶来。他们进入厅堂不过五分钟，此刻听着国王的话，一会儿看看国王，一会儿看看那个稻草人，再回头看看国王，整个人都陷在麻木的困惑中。他们正是休爵士和伊迪丝夫人。新伯爵却没有看见他们。他仍然神情恍惚地望着君王，嘴里还在低声念叨。
        - id: ch03-b16
          speaker: miles_hendon
          text: >-
            哎哟，我的老天！这就是我的穷孩子，我的小疯子！我还想在那座有七十个房间、二十七名仆人的宅子里，让他见识什么叫气派！我以为他只穿过破布，只挨过拳脚，只吃过残羹剩饭。我竟把他收作义子，还打算教他做个体面人！上帝啊，真该给我一只口袋，让我把脑袋藏起来！
          emotion: surprised
        - id: ch03-b17
          speaker: narrator
          text: >-
            这时，迈尔斯的礼数突然全回来了。他立刻跪在地上，把双手放进国王手中，郑重宣誓效忠，又为自己获赐的土地和爵位行了臣服礼。随后，他站起身，恭恭敬敬地退到一旁，依旧是全厅目光的目标，只是这回又多了许多羡慕和嫉妒。
    - id: ch04
      title: 国王的裁断
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 国王这才发现休爵士。他眼中燃起怒火，声音也严厉起来。
        - id: ch04-b02
          speaker: prince_edward
          text: >-
            剥掉这个强盗虚假的排场，收回他偷来的产业。先把他锁起来，等我需要时再处置。
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: 不再是爵士的休就这样被带走了。
        - id: ch04-b04
          speaker: narrator
          text: >-
            厅堂另一头随即起了一阵骚动。聚在一起的人纷纷向两旁分开，汤姆·康蒂穿着奇特而华贵的衣裳，在一名礼官引领下，从这两堵活生生的人墙之间一路走来。他到了国王面前，恭敬地跪下。国王告诉他，自己已经知道过去几周发生的一切。
        - id: ch04-b05
          speaker: prince_edward
          text: >-
            汤姆，我对你十分满意。你用真正的君王才有的仁厚和慈悲治理了国家。你已经找回母亲和两个姐姐了吗？很好，她们以后会得到照料。至于你的父亲，如果你希望他死，法律也准许，我就把他绞死。
        - id: ch04-b06
          speaker: prince_edward
          text: >-
            凡是听见我声音的人，都听清楚。从今天起，住在基督慈幼院、受国王供养的人，不但要让身体得到滋养，心灵和智慧也应受到培育。这个孩子会住在那里，终身担任受人尊敬的院董会首席。
        - id: ch04-b07
          speaker: prince_edward
          text: >-
            他毕竟做过国王，理当受到不同于常人的礼遇。记住他这身礼服，这是他独有的服色，谁也不得仿效。无论他走到哪里，这身衣裳都会提醒众人，他曾经做过君王。谁都要给他应有的敬意，见到他便要致礼。他受王座庇护，也有王冠扶持。从此以后，人们要尊称他为“国王的受监护人”。
        - id: ch04-b08
          speaker: narrator
          text: >-
            汤姆·康蒂又骄傲又幸福。他起身亲吻国王的手，随后由人引出御前。他一点时间也没有浪费，立刻飞奔去找母亲。他要把这一切从头到尾告诉她，也告诉南恩和贝特，再请她们陪自己一起欢喜，好好享受这个天大的喜讯。
