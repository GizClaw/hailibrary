audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳从容，带有含蓄的讽刺意味
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    prince_edward:
      display_name: 爱德华亲王
      tts:
        delivery: 高贵坚定，受辱时仍保持尊严
        timbre: 清亮稚嫩
        pace: 从容有力
        pitch: 中高
    john_canty:
      display_name: 约翰·坎蒂
      tts:
        delivery: 粗暴蛮横，话语带着威吓
        timbre: 沙哑厚重
        pace: 急促粗硬
        pitch: 低
    grandmother:
      display_name: 祖母
      tts:
        delivery: 刻薄凶狠，透着恶意
        timbre: 干涩苍老
        pace: 偏慢
        pitch: 中低
    mrs_canty:
      display_name: 坎蒂太太
      tts:
        delivery: 慈爱忧苦，情绪真挚克制
        timbre: 疲惫柔和
        pace: 缓慢
        pitch: 中等
    nan:
      display_name: 南
      tts:
        delivery: 胆怯善良，恳求时小心翼翼
        timbre: 清细年轻
        pace: 稍慢
        pitch: 中高
    bet:
      display_name: 贝特
      tts:
        delivery: 温顺紧张，言语朴实直接
        timbre: 柔弱年轻
        pace: 中等
        pitch: 中高
    visitor:
      display_name: 报信人
      tts:
        delivery: 压低声音，急切而严肃
        timbre: 粗粝清楚
        pace: 偏快
        pitch: 中低
    waterman:
      display_name: 船夫
      tts:
        delivery: 酒意高昂，豪爽而不容拒绝
        timbre: 洪亮浑厚
        pace: 明快
        pitch: 中低
    reveler_1:
      display_name: 欢庆者甲
      tts:
        delivery: 兴奋起哄，声音响亮
        timbre: 明亮
        pace: 快
        pitch: 中等
    reveler_2:
      display_name: 欢庆者乙
      tts:
        delivery: 热烈起哄，带着醉意
        timbre: 粗犷
        pace: 快
        pitch: 中低
    reveler_3:
      display_name: 欢庆者丙
      tts:
        delivery: 欢快喧闹，语气夸张
        timbre: 清脆
        pace: 快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第十章　亲王落入罗网
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 上回说到，约翰·坎蒂把真正的亲王一路拖进垃圾场巷。后面那群人兴高采烈地跟着，吵吵嚷嚷，像在看一场开心的热闹。只有一个人开口替被抓的孩子求情，可周围实在太乱，他的声音几乎没人听见，更没有谁肯理会。亲王始终没有放弃，不停挣扎着想要脱身，也不停斥责坎蒂这样虐待自己。坎蒂最后一点耐性耗光了，突然暴怒起来，抡起橡木棍就往他头上砸。那个求情的人赶紧扑过来拦他的手臂，自己的手腕却替亲王挨了这一棍。
        - id: ch01-b02
          speaker: john_canty
          text: 你偏要管闲事，是不是？好，那就拿着这份赏吧！
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: 木棍又重重落下，正砸在那人的头上。黑暗中传来一声呻吟，一个模糊的人影倒在众人脚下。人群继续往前涌，转眼就把他独自丢在那里。这件可怕的事丝毫没有坏了他们的兴致。
        - id: ch01-b04
          speaker: narrator
          text: 很快，亲王就被关进约翰·坎蒂的住处，房门也在身后关紧，把外面的人挡住了。一根油脂蜡烛插在瓶口，只照出一点昏黄的光。他借着这点光，看清了这地方的模样，污秽得像个兽穴。墙角缩着两个蓬头垢面的姑娘和一个中年妇人。她们像早已受惯虐待的牲口，知道又要挨打，只能一边害怕，一边等着。另一个角落里还悄悄走出一个干瘪的老太婆。她灰发披散，眼里全是恶意。
        - id: ch01-b05
          speaker: john_canty
          text: 先别动手，这儿还有一出好戏呢。等你看够了，想打多重都随你。小子，站出来！把那套蠢话再说一遍。你叫什么？到底是谁？
        - id: ch01-b06
          speaker: narrator
          text: 小亲王的脸又因为受辱涨红了。他抬起眼，毫不退缩地盯着坎蒂。
        - id: ch01-b07
          speaker: prince_edward
          text: 你竟敢命令我说话，可见你毫无教养。我再告诉你一次，我就是威尔士亲王爱德华，不是别人。
        - id: ch01-b08
          speaker: narrator
          text: 这个回答就像一记闷棍。老太婆惊得双脚钉在原地，几乎喘不上气，只会呆呆地瞪着亲王。她这副样子逗得那个无赖儿子放声大笑。汤姆的母亲和两个姐姐却完全是另一种反应。方才她们还在害怕自己会挨打，现在那份恐惧一下变成了更深的痛苦。她们满脸悲伤和惊惶，奔到孩子面前。
        - id: ch01-b09
          speakers: [mrs_canty, nan, bet]
          ensemble: chorus
          text: 可怜的汤姆！可怜的孩子！
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: 母亲跪下来，双手扶住他的肩。她含着泪，急切地望进他的眼睛。
        - id: ch01-b11
          speaker: mrs_canty
          text: 我可怜的孩子！你读那些书，终于把神智读坏了。我早就劝过你，为什么偏不肯听？你真把母亲的心伤透了。
          emotion: sad
        - id: ch01-b12
          speaker: narrator
          text: 亲王看着她，声音温和下来。
        - id: ch01-b13
          speaker: prince_edward
          text: 大娘，你的儿子好好的，也没有发疯。别伤心，放我回宫吧。他就在宫里，我父王马上会把他还给你。
          emotion: calm
        - id: ch01-b14
          speaker: mrs_canty
          text: 你还说国王是你父亲！孩子，快把这句话收回去。它会害死你，也会害了身边所有的人。快从这个可怕的梦里醒来，想起从前的事吧。你看看我，我不是生你、疼你的母亲吗？
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: 亲王摇了摇头，很不忍心，却只能说出实话。
        - id: ch01-b16
          speaker: prince_edward
          text: 上帝知道，我不愿让你伤心。可在今天以前，我确实从未见过你。
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: 妇人一下瘫坐在地上，捂住脸，哭得心都要碎了。
        - id: ch01-b18
          speaker: john_canty
          text: 戏还没演完呢！南，贝特，你们两个没规矩的丫头，站在亲王面前还不跪下？快向殿下行礼，你们这些穷鬼！
        - id: ch01-b19
          speaker: narrator
          text: 坎蒂又粗声大笑。两个姑娘怯生生地替弟弟求情。
        - id: ch01-b20
          speaker: nan
          text: 爹，让他上床睡吧。只要歇一歇，好好睡一觉，他的疯病也许就好了。求你了。
        - id: ch01-b21
          speaker: bet
          text: 爹，就让他睡吧。他今天累得比平时厉害。明天他会恢复的，也会认真出去讨钱，不再空手回家。
        - id: ch01-b22
          speaker: narrator
          text: 这句话叫坎蒂想起了正事，笑意顿时没了。他怒气冲冲地转向亲王。
        - id: ch01-b23
          speaker: john_canty
          text: 明天得交两个便士的房租。听好了，两个便士，才够住这破洞半年。不交钱，咱们全得滚出去。把你今天讨来的东西拿出来！
          emotion: angry
        - id: ch01-b24
          speaker: prince_edward
          text: 别拿这种卑贱的琐事冒犯我。我已经告诉过你，我是国王的儿子。
        - id: ch01-b25
          speaker: narrator
          text: 坎蒂抡起宽大的手掌，重重打在亲王肩上，响声震耳。孩子被打得站立不稳，踉跄着跌进坎蒂太太怀里。她立刻把他紧紧搂在胸前，用自己的身子护住他，替他挡下接连落来的拳头和耳光。两个姑娘吓得退回墙角，不敢上前，祖母却急急冲过来，要帮儿子一起打人。亲王不肯让坎蒂太太继续替自己受苦，挣开了她的怀抱。
        - id: ch01-b26
          speaker: prince_edward
          text: 夫人，不要为我受苦。让这两头猪只打我一个人！
        - id: ch01-b27
          speaker: narrator
          text: 被亲王称作猪，坎蒂母子顿时暴跳如雷。他们片刻也不肯耽搁，立刻把孩子结结实实地狠揍一顿。接着，他们又把两个姑娘和母亲也打了，只因为三个人曾经同情挨打的孩子。打够以后，坎蒂说这场消遣让自己累了，命令所有人去睡觉。
        - id: ch01-b28
          speaker: narrator
          text: 灯灭了，一家人各自躺下。等坎蒂和他母亲的鼾声响起，两个姑娘悄悄爬到亲王身边，温柔地拿稻草和破布盖住他，替他挡寒。坎蒂太太也悄悄爬了过来。她一边抚摸他的头发，一边为他流泪，还在他耳边断断续续说着安慰和怜惜的话。她偷偷给他留了一小口吃的，可亲王浑身疼痛，对那又黑又没滋味的硬面包皮实在没有胃口。
        - id: ch01-b29
          speaker: narrator
          text: 她为了保护他，挨了那样一顿打，这份勇气和怜爱深深打动了亲王。他用高贵而郑重的话向她道谢，劝她回去睡，尽力忘掉自己的悲苦。他还告诉她，国王绝不会让这样忠诚善良的照拂得不到报答。可他一提父王，在她听来就只是疯病又犯了。她的心再次碎了，只能一次又一次把他紧紧搂在胸前，最后才泪流满面地回到床上。
        - id: ch01-b30
          speaker: narrator
          text: 坎蒂太太躺在那里，越想越觉得不对。眼前这个孩子身上有种说不出的东西，是汤姆从来没有的，不管汤姆清醒还是发疯都没有。她形容不出那是什么，可一个母亲的本能似乎已经察觉到了。难道他真的不是自己的儿子？这个念头太荒唐，尽管心里全是悲苦，她几乎还是笑了。可它偏偏压不下去，不停地追着她，折磨她，紧紧缠住她。她终于明白，必须想出一个绝对可靠的考验，才能知道这孩子究竟是不是汤姆，也才能赶走这些叫她不得安宁的疑虑。
        - id: ch01-b31
          speaker: narrator
          text: 她立刻开动脑筋。她想出一个看似可行的办法，又把它推翻，接着再想，再推翻。没有哪一个绝对可靠，也没有哪一个能让她完全放心。看来她只能放弃了。这个叫人沮丧的念头刚刚闪过，她便听见孩子均匀的呼吸，知道他睡着了。忽然，那平稳的呼吸里冒出一声轻轻的惊叫，像是做了噩梦。这件偶然的小事给了她一个胜过所有办法的主意。她赶忙悄无声息地点亮蜡烛。
        - id: ch01-b32
          speaker: mrs_canty
          text: 刚才要是看见他的动作，我就能认出来了！汤姆小时候被火药炸过脸。从那以后，只要睡梦里或沉思时突然受惊，他总会抬手挡住眼睛，而且手掌不是朝里，是朝外。我见过上百次，从没变过。这一回，我马上就能知道了。
        - id: ch01-b33
          speaker: narrator
          text: 她一只手拿着蜡烛，仔细遮住烛光，爬到熟睡的孩子身旁。她小心翼翼地俯下身，死死压住心里的激动，紧张得几乎不敢呼吸。忽然，她把光直照到他脸上，又用指关节猛敲他耳边的地板。孩子的双眼一下睁得滚圆，惊慌地四下看去，却没有用双手做出任何特别的动作，更没有抬手挡住眼睛。
        - id: ch01-b34
          speaker: narrator
          text: 可怜的母亲又惊又痛，几乎没了力气。她勉强藏住情绪，把孩子重新哄睡，才爬到一旁，独自承受这场试验带来的可怕结果。她拼命告诉自己，也许疯病使汤姆忘了那个动作，可心里根本不信。那是双手记住的老习惯，神智疯了，双手也不会跟着发疯。
        - id: ch01-b35
          speaker: mrs_canty
          text: 不，他的手又没有疯。多少年的老习惯，怎么会一下子忘掉？今天真是我的苦难日！
          emotion: sad
        - id: ch01-b36
          speaker: narrator
          text: 然而，希望也和先前的怀疑一样顽固。她怎么也不能接受这个结果，一定要再试一次。头一回的失败也许只是意外。于是她等了一阵，又把孩子从睡梦中惊醒，接着还试了第三次。三次的结果完全相同，孩子始终没有那个动作。她终于拖着沉重的身子回到床上，悲伤地躺了下来。
        - id: ch01-b37
          speaker: mrs_canty
          text: 可我不能不要他。不，我不能……他一定是我的孩子！
          emotion: sad
        - id: ch01-b38
          speaker: narrator
          text: 母亲终于不再惊醒他，身上的疼痛也渐渐失去了妨碍睡眠的力量。极度的疲惫封住亲王的双眼，他终于沉沉睡去。这一回，他睡得又深又安稳，简直像死去一样。一小时又一小时悄悄过去，足足过了四五个钟头，他昏沉的睡意才慢慢变浅。半梦半醒之间，他低声唤了起来。
        - id: ch01-b39
          speaker: prince_edward
          text: 威廉爵士！
        - id: ch01-b40
          speaker: narrator
          text: 过了一会儿，他又叫道。
        - id: ch01-b41
          speaker: prince_edward
          text: 威廉·赫伯特爵士，快过来听听。我做了一个再古怪不过的梦……威廉爵士，你听见了吗？我梦见自己变成了穷孩子，还……来人！卫兵！值夜的寝宫侍从都去哪儿了？这件事我一定要重重——
        - id: ch01-b42
          speaker: nan
          text: 你怎么了？在叫谁呢？
        - id: ch01-b43
          speaker: prince_edward
          text: 我叫威廉·赫伯特爵士。你是谁？
        - id: ch01-b44
          speaker: nan
          text: 我还能是谁？我是你姐姐南呀。啊，汤姆，我忘了，你还在发疯。可怜的孩子，我真希望自己没有醒来，就不用又想起这件事了。快管住舌头，不然咱们全会被活活打死！
          emotion: fearful
        - id: ch01-b45
          speaker: narrator
          text: 亲王猛地撑起半个身子，僵硬的伤处立刻传来一阵剧痛。他终于清醒过来，呻吟着倒回肮脏的稻草上。
        - id: ch01-b46
          speaker: prince_edward
          text: 唉，原来那不是梦！
          emotion: sad
        - id: ch01-b47
          speaker: narrator
          text: 睡眠赶走的悲苦一下全压了回来。他终于知道，自己不再是宫里受尽宠爱的亲王，也不再被举国上下仰望。如今，他穿着一身破布，成了一个无家可归的穷孩子。他被关在这座牲口才配住的洞里，身边陪着他的，也不再是侍臣和卫兵，而是乞丐与盗贼。
        - id: ch01-b48
          speaker: narrator
          text: 正在悲痛时，他听见一两条街外传来欢笑和叫喊。门上很快响起几下急促的敲击声。约翰·坎蒂停住鼾声。
        - id: ch01-b49
          speaker: john_canty
          text: 谁在敲门？要干什么？
        - id: ch01-b50
          speaker: visitor
          text: 你知道刚才拿棍子打的是谁吗？
        - id: ch01-b51
          speaker: john_canty
          text: 不知道，也不在乎。
        - id: ch01-b52
          speaker: visitor
          text: 你马上就会在乎了。想保住脖子，只有赶快逃命。那个人眼看就要断气了。他是安德鲁神父！
        - id: ch01-b53
          speaker: john_canty
          text: 上帝保佑！全都起来，赶快逃！不走就留在这里等死！
          emotion: fearful
        - id: ch01-b54
          speaker: narrator
          text: 不到五分钟，坎蒂一家已经冲上街，拼命逃亡。约翰紧抓亲王的手腕，催他沿着黑暗的路快走。
        - id: ch01-b55
          speaker: john_canty
          text: 管好你的舌头，你这个疯傻瓜！不许说出咱们的姓名。我马上换个新名字，好甩掉法律的猎狗。记住，闭紧嘴！
          emotion: fearful
        - id: ch01-b56
          speaker: narrator
          text: 他又压低声音，冲其他人吼道。
        - id: ch01-b57
          speaker: john_canty
          text: 要是走散了，就各自去伦敦桥。谁先到桥上最后一家布店，谁就在那里等。等人齐了，咱们一起逃进萨瑟克。
        - id: ch01-b58
          speaker: narrator
          text: 话音刚落，他们便猛然冲出黑暗，闯进一片光明，又一头扎进河岸边密密麻麻的人群。那里的人又唱又跳，欢呼不止。泰晤士河两岸的篝火连成一线，上游下游都望不到尽头。伦敦桥灯火辉煌，萨瑟克桥同样灿烂，彩灯的流光照亮了整条河。烟花接连在天空炸开，一道道飞射的光辉和密密洒落的耀眼火星交织在一起，几乎把夜晚变成白天。到处都是纵情欢庆的人，仿佛整个伦敦的人都上了街。
        - id: ch01-b59
          speaker: narrator
          text: 约翰恶狠狠地咒骂一声，命令全家退回去，可已经晚了。他和家里人一下就被这座蜂巢般涌动的人海吞没，转眼彼此冲散，再也找不到对方。亲王当然不算坎蒂家的一员，只是约翰还死死抓着他的手腕，没有让他走脱。看见四周这样拥挤混乱，亲王心里重新升起逃走的希望，胸口也因此怦怦直跳。
        - id: ch01-b60
          speaker: narrator
          text: 坎蒂在人群里横冲直撞，推到一个身材魁梧的船夫。那人喝了不少酒，兴致正高，便伸出大手按住坎蒂的肩。
        - id: ch01-b61
          speaker: waterman
          text: 朋友，走这么急干什么？忠诚正直的人都在过节，你倒只顾那些扫兴的生意吗？
        - id: ch01-b62
          speaker: john_canty
          text: 我的事与你无关。把手拿开，让我过去！
          emotion: angry
        - id: ch01-b63
          speaker: waterman
          text: 既然你这副脾气，那就更不能走了。先为威尔士亲王干一杯，我才放你过去！
        - id: ch01-b64
          speaker: john_canty
          text: 把杯子给我。快点！
        - id: ch01-b65
          speaker: narrator
          text: 周围的人也来了兴致，齐声起哄。
        - id: ch01-b66
          speakers: [reveler_1, reveler_2, reveler_3]
          ensemble: chorus
          text: 同饮杯！让这个扫兴的家伙喝，不然就把他扔去喂鱼！
          emotion: happy
        - id: ch01-b67
          speaker: narrator
          text: 一个硕大的双耳酒杯送了过来。船夫一手握住一边的杯把，另一只手托起一条并不存在的餐巾末端，郑重其事地按照古老规矩把酒递出去。坎蒂也必须照着旧俗，一手握住另一边的把手，再用空着的手揭开杯盖。两只手都有了事情可做，他自然只好暂时松开亲王。
        - id: ch01-b68
          speaker: narrator
          text: 亲王一刻也没有耽误。他弯下身子，马上钻进身边那片腿脚的森林，眨眼便消失在人群里。再过一瞬，他已经埋进这片不断翻腾起伏的人海深处。就算周围涌动的真是大西洋的波涛，而亲王只是一枚掉进海里的六便士，要把他找出来也不会比眼下更难。
        - id: ch01-b69
          speaker: narrator
          text: 亲王很快也明白，在这片翻腾的人海里，坎蒂绝不可能再找到自己。他立刻把那人抛到脑后，开始考虑自己的处境。另一个事实也很快浮现在他心里。伦敦城此刻正在替一个冒牌的威尔士亲王设宴，而那个人占了本该属于他的位置。于是他毫不犹豫地断定，汤姆·坎蒂一定是故意抓住这个天大的机会，做了篡位者。
        - id: ch01-b70
          speaker: narrator
          text: 他眼下只有一条路可走。先找到通往市政厅的路，到了那里公开自己的真实身份，再当着众人的面揭穿那个冒牌货。至于汤姆，亲王心里也已经作好了安排。他会宽宏大量，给那孩子一段合情合理的时间，让他为自己的灵魂做好准备。等时间一到，就依照当时惩治叛国重罪的法律和规矩，把这个篡位者绞死、开膛、分尸。
