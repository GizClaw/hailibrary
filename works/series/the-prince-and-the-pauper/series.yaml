cover_prompt: |-
  A wordless cover scene in Tudor London shows two lookalike boys discovering their uncanny resemblance before a tall palace mirror. One boy is sun-browned from outdoor exercise and now wears fluttering patched rags with bare feet, while the other has the same face and stature but wears rich sixteenth-century silks and satins, a crimson plumed cap, jeweled dagger, and dainty red-heeled buskins. They stand side by side and turn from their reflections toward each other in astonishment, making the exchanged clothing and shared identity the focal action. A carved table with the Great Seal resting upon it and a glimpse of the guarded palace courtyard ground the moment in the story without distracting from the boys. Use a child-height three-quarter view, frame the paired figures and mirror in the lower two-thirds, and leave calm shadowed wall and high windows across the top for title room. Keep the chamber, clothing, and objects faithful to royal England in the 1540s, with wholly original faces and no reference to film or animation adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
