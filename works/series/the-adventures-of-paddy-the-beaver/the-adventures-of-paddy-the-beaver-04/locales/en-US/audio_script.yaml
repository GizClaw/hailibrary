  chapters:
    - id: ch01
      title: Sammy Jay Speaks His Mind
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When Sammy Jay reached the place deep in the Green Forest where Paddy the Beaver was working so hard, he didn't hide the way the little four-footed people had. He felt perfectly safe, so he saw no reason to hide.
        - id: ch01-b02
          speaker: narrator
          text: Just as Sammy hurried up, a big tree Paddy had cut came down with a crash. Sammy was so startled that, for a moment, he couldn't speak. He had never imagined anyone but Farmer Brown or Farmer Brown's boy could bring down such a large tree. The sight took his breath away.
        - id: ch01-b03
          speaker: narrator
          text: Sammy soon found his voice again. He was already boiling with anger because he had been the last to hear that Paddy had come down from the North to live in the Green Forest. Now he had a chance to say exactly what he thought.
        - id: ch01-b04
          speaker: sammy_jay
          text: Thief! Thief! Thief!
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: Sammy screamed the words in his harshest voice. Paddy looked up, and his eyes twinkled.
        - id: ch01-b06
          speaker: paddy
          text: Hello, Mr. Jay. I can see your manners are no better than your cousin's up North.
        - id: ch01-b07
          speaker: sammy_jay
          text: Thief! Thief! Thief!
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: Sammy was so angry that he hopped up and down as he screamed.
        - id: ch01-b09
          speaker: paddy
          text: I suppose you're talking about yourself. I've never met an honest Jay, and I don't expect I ever will.
        - id: ch01-b10
          speaker: peter_rabbit
          text: Ha, ha, ha!
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: Peter Rabbit had been hiding, but Paddy's answer made him forget all about it.
        - id: ch01-b12
          speaker: paddy
          text: Why, good morning, Mr. Rabbit. I'm very glad you came to visit me. It seems Mr. Jay got out of bed on the wrong side today.
        - id: ch01-b13
          speaker: narrator
          text: Paddy spoke as though he hadn't known all along exactly where Peter was. Peter laughed once more.
        - id: ch01-b14
          speaker: peter_rabbit
          text: He gets up that way every morning. He wouldn't be happy if he didn't. You might not guess it from looking at him, but he's happy right now. He just doesn't know it. Showing everyone his bad temper always makes him happy.
        - id: ch01-b15
          speaker: narrator
          text: Sammy glared down at Peter, then glared at Paddy. All the while, he kept shrieking, "Thief!" at the top of his voice. Paddy paid no attention and went right on working. That only made Sammy angrier. He came closer and closer until he landed in the very tree Paddy was cutting. Once again, Paddy's eyes twinkled.
        - id: ch01-b16
          speaker: paddy
          text: I am not a thief!
        - id: ch01-b17
          speaker: sammy_jay
          text: You are! You are! Thief! Thief! You're stealing our trees!
          emotion: angry
        - id: ch01-b18
          speaker: paddy
          text: Those trees aren't yours. They belong to the Green Forest, and the forest belongs to everyone who loves it. We all have the right to take what we need. I need these trees. I have just as much right to them as you have to the fat acorns that fall in autumn.
        - id: ch01-b19
          speaker: sammy_jay
          text: That's not true! Acorns are food. They're meant to be eaten, and I need them to live. But you're cutting down whole trees! You're ruining the Green Forest. You don't belong here. No one invited you, and no one wants you. You're a thief!
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: Sammy couldn't talk without screaming. The more excited he became, the louder he screamed. Then Jerry Muskrat spoke up. Jerry, as you know, was Paddy's cousin.
        - id: ch01-b21
          speaker: jerry_muskrat
          text: Don't listen to him, Cousin Paddy. Nobody else does. He's the biggest troublemaker in the Green Forest or on the Green Meadows. Why, he'd even steal from his own family. Pay no attention to anything he says.
        - id: ch01-b22
          speaker: narrator
          text: Through all of this, Paddy had kept working as if no one else were there. The moment Jerry finished, Paddy slapped the ground with his tail. That was his warning for everyone to watch out. Then he suddenly scurried away as fast as he could.
        - id: ch01-b23
          speaker: narrator
          text: Sammy was so surprised that he lost his voice again. He hadn't noticed anything unusual about the tree beneath him. Then, all at once, he felt himself falling.
        - id: ch01-b24
          speaker: narrator
          text: With a frightened scream, Sammy spread his wings. But he couldn't get away. The branches swept him down with them and dropped him straight into the Laughing Brook. While Sammy had been speaking his mind, Paddy had cut down the very tree where he sat.
        - id: ch01-b25
          speaker: narrator
          text: Sammy wasn't hurt, but he was wet, muddy, and terribly frightened. No Jay had ever looked more miserable. The sight was too much for all the little people in hiding. They simply had to laugh.
        - id: ch01-b26
          speaker: narrator
          text: Then every one of them came out to pay their respects to Paddy the Beaver.
