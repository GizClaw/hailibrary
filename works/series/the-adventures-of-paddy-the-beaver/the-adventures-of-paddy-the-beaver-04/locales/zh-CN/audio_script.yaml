audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    paddy:
      display_name: 海狸帕迪
      tts:
        delivery: 快活坚定，做事干脆利落
        timbre: 结实而年轻
        pace: 轻快
        pitch: 中低音
    sammy:
      display_name: 松鸦萨米
      tts:
        delivery: 尖刻急躁，激动时越说越响
        timbre: 高亢刺耳
        pace: 急促
        pitch: 高音
    peter:
      display_name: 兔子彼得
      tts:
        delivery: 活泼机灵，话里常带笑意
        timbre: 明亮轻巧
        pace: 轻快
        pitch: 中高音
    jerry:
      display_name: 麝鼠杰里
      tts:
        delivery: 直爽热心，说话干脆
        timbre: 温厚清晰
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第四章　松鸦萨米说出心里话
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 松鸦萨米匆匆赶到绿森林深处时，海狸帕迪还在埋头干活。那些四脚小动物全都藏着，萨米却觉得自己安全得很，根本不用躲。
        - id: ch01-b02
          speaker: narrator
          text: 他刚飞到近前，一棵大树就被帕迪咬断了，轰隆一声倒在地上。萨米惊得说不出话来。他一直以为，这么大的树，只有农夫布朗或者布朗家的男孩才能砍倒。
        - id: ch01-b03
          speaker: narrator
          text: 这一幕叫萨米差点喘不过气。不过，他很快又找回了声音。帕迪从北方搬来绿森林安家，他居然最后一个才知道，早就气得满肚子冒火。现在，他可有机会把想说的话全倒出来了。
        - id: ch01-b04
          speaker: sammy
          text: 小偷！小偷！小偷！
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: 萨米扯着最刺耳的嗓门尖叫。帕迪抬头看了看，眼睛里却带着笑。
        - id: ch01-b06
          speaker: paddy
          text: 松鸦先生，你好啊。你的礼貌看来也没比我北方老家的那位堂亲好到哪里去。
        - id: ch01-b07
          speaker: sammy
          text: 小偷！小偷！小偷！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 萨米气得一边叫，一边上蹿下跳。
        - id: ch01-b09
          speaker: paddy
          text: 你说的小偷，大概是你自己吧。我还没见过老实的松鸦，以后恐怕也见不到。
        - id: ch01-b10
          speaker: narrator
          text: 兔子彼得忍不住哈哈大笑，完全忘了自己还躲在暗处。
        - id: ch01-b11
          speaker: paddy
          text: 哟，兔子先生，你好吗？今天早晨你肯来看我，我可真高兴。松鸦先生今天起床时，准是下错了床。
        - id: ch01-b12
          speaker: narrator
          text: 帕迪说得好像才发现彼得似的，其实他早就知道彼得藏在哪里。彼得听完，又笑了起来。
        - id: ch01-b13
          speaker: peter
          text: 他每天起床都下错床。要是哪天不发脾气，他反而不快活。你看他现在气成这样，想不到吧？其实他正高兴呢，只是自己不知道。只要能让别人见识他的坏脾气，他就高兴。
        - id: ch01-b14
          speaker: narrator
          text: 萨米狠狠瞪了瞪下面的彼得，又转眼瞪着帕迪，嘴里始终拼命叫着“小偷”。帕迪根本不理他，只管继续干活。这下，萨米更加恼火了。
        - id: ch01-b15
          speaker: narrator
          text: 他越靠越近，最后落在一棵树上。偏偏那棵树，正是帕迪正在咬的。帕迪的眼睛又闪起了笑意。
        - id: ch01-b16
          speaker: paddy
          text: 我可不是小偷！
        - id: ch01-b17
          speaker: sammy
          text: 你就是！你就是！小偷！小偷！你在偷我们的树！
          emotion: angry
        - id: ch01-b18
          speaker: paddy
          text: 树不是你的。它们属于绿森林，而绿森林属于所有爱它的居民。大家需要什么，都有权从这里取用。我需要这些树，当然可以拿，就像秋天落下肥橡子时，你也可以捡去吃。
        - id: ch01-b19
          speaker: sammy
          text: 根本不是这么回事！橡子是食物，本来就是给大家吃的。我不吃它们就活不下去。可你砍掉的是一整棵一整棵的树！你在糟蹋绿森林！你不属于这里。没人请你来，也没人想让你留下。你就是小偷！
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: 你知道，萨米平常说话就爱尖叫，越激动，声音越响。这时，帕迪的表亲麝鼠杰里开口了。
        - id: ch01-b21
          speaker: jerry
          text: 帕迪表哥，别理他，谁都不把他的话当回事。他是绿森林和绿草地上最会惹麻烦的家伙，连亲戚的东西都偷。你别把他说的话放在心上。
        - id: ch01-b22
          speaker: narrator
          text: 大家说了这么久，帕迪手上的活儿一直没停，好像周围根本没有谁。杰里刚说完，帕迪便用尾巴使劲拍了一下地。这是他提醒大家赶快留神的办法。
        - id: ch01-b23
          speaker: narrator
          text: 接着，帕迪忽然转身，以最快的速度窜开了。萨米吃了一惊，一时又没了声音，也完全没看出脚下的树有什么异样。
        - id: ch01-b24
          speaker: narrator
          text: 可他马上就觉得自己往下掉。萨米吓得尖叫起来，慌忙张开翅膀想飞。树枝随着大树倒下，把他一起扫了下去，直直落进欢笑溪。
        - id: ch01-b25
          speaker: narrator
          text: 原来呀，萨米忙着说心里话的时候，帕迪已经把他落脚的那棵树咬倒了。
        - id: ch01-b26
          speaker: narrator
          text: 萨米没有受伤，可他浑身湿淋淋、沾满泥巴，还吓得要命。大伙儿从没见过这么狼狈的松鸦。
        - id: ch01-b27
          speaker: narrator
          text: 躲起来的小动物们实在忍不住，全都笑出了声。随后，他们一个个走出来，向海狸帕迪问候致意。
