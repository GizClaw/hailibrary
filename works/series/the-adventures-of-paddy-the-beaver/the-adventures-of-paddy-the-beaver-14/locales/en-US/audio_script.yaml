audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    paddy_beaver:
      display_name: Paddy the Beaver
      tts:
        delivery: practical and thoughtfully self-assured
        timbre: sturdy and mellow
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: A Footprint in the Mud
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Very early one morning, Paddy the Beaver heard Sammy Jay raising a terrible fuss among the aspen trees beside Paddy's pond in the Green Forest. Paddy couldn't see what was happening. He was inside his windowless house. But he could hear every scream, and he wrinkled his brow as he listened.
        - id: ch01-b02
          speaker: paddy_beaver
          text: Sammy sounds terribly excited this morning. When he screams that way, he's usually doing two things at once. He's making trouble for somebody while he keeps somebody else out of trouble. That's a funny way to behave when you think about it. Sammy isn't all bad, but he certainly isn't all good either.
        - id: ch01-b03
          speaker: paddy_beaver
          text: From the sound of it, I'd say Sammy caught Reddy Fox creeping toward someone near my aspens. Reddy is afraid of me. Still, he probably knows Peter Rabbit has been spending a lot of time here watching me work. Maybe Reddy hopes he can watch Peter instead. I'd better whisper a warning into one of Peter's long ears and tell him to be careful.
        - id: ch01-b04
          speaker: narrator
          text: Paddy often talked to himself like that because he spent so much time alone. After a while, Sammy's cries grew fainter and fainter as he went deeper into the Green Forest. At last, Paddy couldn't hear him at all.
        - id: ch01-b05
          speaker: paddy_beaver
          text: Whoever came here must have gone, and Sammy followed along just to bother them.
        - id: ch01-b06
          speaker: narrator
          text: Paddy was busy making a bed. He was very particular about it. With his wonderful big cutting teeth, he split fine slivers from pieces of wood. Those dry little splinters made the very best sort of bed.
        - id: ch01-b07
          speaker: narrator
          text: Making it took plenty of patience and hard work. But patience is one of the first lessons a young beaver learns. And Paddy had discovered long ago that few things feel better than honest work done well. So even after everything outside fell quiet, he kept working on his bed for quite a while.
        - id: ch01-b08
          speaker: narrator
          text: At last, Paddy decided to visit his aspen grove. He wanted to look over the trees and choose which ones to cut the following night. He slid along one of his long passageways, passed through the doorway at the bottom of the pond, and swam up toward the surface.
        - id: ch01-b09
          speaker: narrator
          text: For a few minutes, Paddy floated with only his head above the water. All the while, his eyes searched, his nose tested the air, and his ears listened for the slightest hint of danger. Everything was still. Once he felt sure it was safe, he crossed the pond and waddled onto the shore where the aspens grew.
        - id: ch01-b10
          speaker: narrator
          text: Paddy looked one way, then the other. He searched the treetops and peered up the hill. Most of all, though, he studied the ground. Yes, sir, Paddy examined it closely. He hadn't forgotten Sammy Jay's noisy fuss, and he meant to find out what had caused it.
        - id: ch01-b11
          speaker: narrator
          text: At first, nothing seemed unusual. Then Paddy noticed a small patch of wet ground. Right in the middle was something that made his eyes open wide. It was a footprint. Someone had stepped carelessly into the mud.
        - id: ch01-b12
          speaker: paddy_beaver
          text: Well, look at that!
        - id: ch01-b13
          speaker: narrator
          text: The hair along Paddy's back rose just a little, and a prickly feeling ran all over him for a moment. The track looked very much like Reddy Fox's footprint, except that it was bigger.
        - id: ch01-b14
          speaker: paddy_beaver
          text: Ha! That is certainly Old Man Coyote's footprint. I can see I'll have to watch more carefully than I thought.
          emotion: surprised
        - id: ch01-b15
          speaker: paddy_beaver
          text: Very well, Mr. Coyote. Now that I know you're nearby, you'll have to be even smarter than I think you are if you want to catch me. You'll surely come back tonight to look for me. In that case, I'll cut my trees now, while it's still daytime.
