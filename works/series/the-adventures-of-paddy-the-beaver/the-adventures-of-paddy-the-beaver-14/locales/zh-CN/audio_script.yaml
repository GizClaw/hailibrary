audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    paddy:
      display_name: 海狸帕迪
      tts:
        delivery: 开朗坚定，做事胸有成竹
        timbre: 结实而年轻
        pace: 轻快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十四章　泥地上的脚印
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天清早，天刚蒙蒙亮，海狸帕迪就听见松鸦萨米在白杨树林里闹个不停。那片林子就在帕迪筑成的池塘边上。帕迪还待在没有窗户的房子里，外面发生了什么，他一点儿也看不见。不过，那一声声尖叫，他可听得清清楚楚。帕迪皱起眉头，仔细琢磨起来。
        - id: ch01-b02
          speaker: paddy
          text: 萨米今天早上听着可真激动。他只要这么叫，准是在同时干两件事。一边给谁找麻烦，一边又提醒另一个谁躲开麻烦。你说怪不怪？这么看来，萨米不算坏透了，可也远远算不上全好。
        - id: ch01-b03
          speaker: paddy
          text: 听这动静，大概是狐狸雷迪在我的白杨树附近偷偷逼近谁，被萨米瞧见了。雷迪虽然怕我，可他八成知道兔子彼得近来总到这儿看我干活，便想守着彼得。我得找个机会，对着彼得的一只长耳朵悄悄提醒他，叫他小心一点儿。
        - id: ch01-b04
          speaker: narrator
          text: 帕迪常常独自生活，所以总爱这样自言自语。过了一会儿，萨米的叫声越来越远，渐渐没入绿森林深处，最后完全听不见了。
        - id: ch01-b05
          speaker: paddy
          text: 不管刚才来的是谁，现在一定已经走了。萨米跟在后面，就是为了继续折腾人家。
        - id: ch01-b06
          speaker: narrator
          text: 这时，帕迪正在忙着做床。他对睡觉的地方十分讲究。那对又大又厉害的门牙从木头上咬过，削下一片片细木屑。拿这种干爽的木屑铺床，最合适不过了。
        - id: ch01-b07
          speaker: narrator
          text: 做好一张床，要有耐心，也得肯下功夫。小海狸最早学会的本领里，耐心就是一样。帕迪也早就明白，老老实实把活儿做好，会让人打心底里快活。因此，外面安静下来以后，他又埋头忙了好一阵。
        - id: ch01-b08
          speaker: narrator
          text: 终于，帕迪准备去看看那些白杨，好选出当天夜里要砍的树。他沿着一条长通道滑下去，从池塘底下的门口游出房子，再浮上水面。接下来的几分钟里，他只把脑袋露在水外，静静漂着。
        - id: ch01-b09
          speaker: narrator
          text: 帕迪一边四处察看，一边闻着空气里的气味，还竖起耳朵仔细听。任何危险的迹象，他都不肯放过。周围始终静悄悄的。确定安全以后，他才游过池塘，来到白杨树林边，摇摇摆摆地上了岸。
        - id: ch01-b10
          speaker: narrator
          text: 帕迪先看这边，再瞧那边。他望过树梢，又朝山坡上方看了看。可他查得最仔细的，还是脚下的地面。是的，先生，他简直把那片地研究了个遍。萨米刚才闹出的动静，他可没有忘。帕迪非得弄清楚，那究竟是怎么回事。
        - id: ch01-b11
          speaker: narrator
          text: 起初，四周没有什么不对劲。后来，帕迪偶然发现了一小片湿地。就在湿地正中，有一样东西让他猛地瞪大了眼睛。那是一枚脚印！有谁走过这里时不留神，一脚踩进了泥里。
        - id: ch01-b12
          speaker: paddy
          text: 哈，这儿有个脚印！
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: 帕迪背上的毛微微竖了起来。那一瞬间，他浑身发紧，仿佛到处都有针在扎。这个脚印看起来很像狐狸雷迪留下的，只不过大了许多。
        - id: ch01-b14
          speaker: paddy
          text: 哈！这肯定是郊狼老先生的脚印！看来，我得比原先想的更加留神才行。
          emotion: surprised
        - id: ch01-b15
          speaker: paddy
          text: 好吧，郊狼先生。既然我知道你就在附近，你想抓到我，就得比我以为的还聪明才行。今天晚上，你一定会回来找我。那我干脆趁着现在还是白天，马上去砍树。
