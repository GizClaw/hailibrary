audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 好奇直率，思考时认真而略带困惑
        timbre: 清亮年轻
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 穿过老牧场
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 农夫布朗家的男孩大步穿过老牧场，一直走向绿森林后面的大山脚下。猎犬鲍泽跑在前面，一路又嗅又闻，寻找狐狸雷迪和狐狸奶奶的足迹。可它们已经很久没来过老牧场，鲍泽当然什么也找不到。
        - id: ch01-b02
          speaker: narrator
          text: 不过，鲍泽发现了老杰德·桑珀。那只大灰兔从前可没少叫兔子彼得难受，这回却被鲍泽吓得慌不择路，差点一头撞上农夫布朗家的男孩。
        - id: ch01-b03
          speaker: farmer_browns_boy
          text: 嘿！你这只老棉尾兔！
        - id: ch01-b04
          speaker: narrator
          text: 这一嗓子把杰德吓得更慌了。他从自己的荆棘城堡旁飞奔过去，居然连那座用带刺灌木围成的家都没看见。农夫布朗家的男孩笑着继续赶路，把受惊的老杰德留在了身后。
    - id: ch02
      title: 泉水还在冒
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 不久，他来到几眼泉水旁。这里流出的水，正是欢笑溪最初的源头。他原以为泉眼肯定干了。绿草地那边的微笑池快见底了，欢笑溪也快断流了，那么源头不再冒水，不就是最顺理成章的解释吗？
        - id: ch02-b02
          speaker: narrator
          text: 可眼前的泉水偏偏还在冒！清凉透亮的水照常涌出地面，汇成一股细流，向绿森林淌去。它会一路越流越大，最后汇成那条欢笑溪，就和过去一模一样。
        - id: ch02-b03
          speaker: narrator
          text: 男孩摘下破旧的草帽，紧皱眉头盯着泉眼，那样子仿佛泉水不该出现在这里。其实，他也不知道自己究竟该怎么想，怎么想也想不明白。
        - id: ch02-b04
          speaker: narrator
          text: 泉水和从前一样涌着，小溪也像往常那样咕噜咕噜地流进森林。再往前，那咕噜声就会变成笑声。可森林另一头的欢笑溪和微笑池，为什么都不见了？他真想掐自己一下，看看自己到底是在醒着，还是在做梦。
        - id: ch02-b05
          speaker: farmer_browns_boy
          text: 我不明白这是怎么回事。真的，一点儿也不明白。不过，我一定要查出原因。世上的事情都有缘故，碰上不懂的，就该彻底弄清楚。哪怕花上一年，我也要知道欢笑溪究竟出了什么事！
    - id: ch03
      title: 沿着溪水往前走
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他顺着那股咕噜作响的细流走进绿森林。这条路，他以前走过好几回，眼前的一切都和记忆里一样。水流越走越宽，渐渐成了欢笑溪。溪水欢快地翻过一块又一块岩石，再汇成一个又一个深水潭，鳟鱼最爱藏在这样的水潭里。
        - id: ch03-b02
          speaker: narrator
          text: 他走到绿森林正中心的一片开阔洼地旁。这里原本有几个很棒的深水潭，水又深又凉，大鳟鱼总爱卧在潭底。他一心想着那些鱼，越想越后悔没有把钓竿带来。
        - id: ch03-b03
          speaker: narrator
          text: 他挤过一片赤杨灌木，忽然停住了，还惊得倒吸一口气。因为就在前面，竟然出现了一座池塘！
    - id: ch04
      title: 从未有过的池塘
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 男孩揉揉眼睛，又仔细看了一遍。他甚至弯下腰，把手伸进水里试了试。没错，这是真水，也的确是一座池塘。可这地方从来没有过池塘。
        - id: ch04-b02
          speaker: narrator
          text: 绿森林深处一向安静，现在却像是比平时更静了。他一步步绕着这座陌生池塘的边缘往前走，总觉得自己还在梦里。也许过一会儿，他就会醒来，发现眼前的一切都不是真的。
        - id: ch04-b03
          speaker: narrator
          text: 可他一直没有醒，眼前的池水也没有消失，他只好继续走。没过多久，他看见了一道水坝。那道坝筑得真漂亮，用的是圆木、树枝和泥巴。水从坝顶漫过去，流向下方的绿森林。他还能听见，欢笑溪已经在那里重新发出了一点儿笑声。
        - id: ch04-b04
          speaker: narrator
          text: 农夫布朗家的男孩坐了下来，双肘撑着膝盖，双手托住下巴。他实在太吃惊了，几乎连脑子都不会转了。
