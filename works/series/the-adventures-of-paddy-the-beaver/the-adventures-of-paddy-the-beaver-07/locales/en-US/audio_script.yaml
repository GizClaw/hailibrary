  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: curious and good-natured
        timbre: clear and youthful
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: Farmer Brown's Boy Gets Another Surprise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Farmer Brown's boy tramped across the Old Pasture toward the foot of the Mountain behind the Green Forest. Bowser the Hound trotted ahead, sniffing and snuffling for the tracks of Reddy Fox or Granny Fox. He found none, of course. Reddy and Granny hadn't visited the Old Pasture for a long time.
        - id: ch01-b02
          speaker: narrator
          text: Bowser did find old Jed Thumper. He was the big gray Rabbit who had once made Peter Rabbit so uncomfortable. Bowser gave Jed such a fright that the Rabbit forgot to watch where he was going. He nearly ran headfirst into Farmer Brown's boy.
        - id: ch01-b03
          speaker: farmer_browns_boy
          text: Hey there, you old cottontail!
        - id: ch01-b04
          speaker: narrator
          text: The shout frightened Jed even more. He raced straight past his own castle of bullbriars without seeing it.
        - id: ch01-b05
          speaker: narrator
          text: Farmer Brown's boy laughed at old Jed's fright and kept going. Before long, he reached the springs that formed the very beginning of the Laughing Brook. He expected them to be dry. Far away on the Green Meadows, the Smiling Pool and the Laughing Brook were nearly dry. He had supposed the reason was simple. The springs where the brook began must have stopped bubbling.
        - id: ch01-b06
          speaker: narrator
          text: But they hadn't. Clear, cold water bubbled out of the ground just as it always had. It flowed toward the Green Forest in a tiny stream. As that stream traveled, it would grow and grow until it became the Laughing Brook.
        - id: ch01-b07
          speaker: narrator
          text: Farmer Brown's boy took off his ragged old straw hat. He stared down at the bubbling water with a scowl, almost as if it had no right to be there.
        - id: ch01-b08
          speaker: narrator
          text: That wasn't quite what he was thinking. The truth was, he didn't know what to think. The springs were bubbling as they always had. The little stream was gurgling into the Green Forest, and in time that gurgle would turn into a laugh, just as it always did. Yet on the far side of the forest, there was no longer a Laughing Brook or a Smiling Pool. He almost wanted to pinch himself to make sure he was awake.
        - id: ch01-b09
          speaker: farmer_browns_boy
          text: I don't understand this. No, sir, I don't understand it at all. But I'm going to find out. Everything in this world happens for a reason. If a fellow doesn't know something, it's his job to learn all about it. I'll find out what happened to the Laughing Brook, even if it takes me a year!
        - id: ch01-b10
          speaker: narrator
          text: So he set off after the little stream as it gurgled down into the Green Forest. He had followed it more than once, and now it looked just as he remembered. The farther it flowed, the bigger it became. At last, it turned into the Laughing Brook. The water tumbled merrily over rocks and filled deep pools where the trout loved to hide.
        - id: ch01-b11
          speaker: narrator
          text: At last, Farmer Brown's boy reached a small open hollow deep in the Green Forest. He knew the Laughing Brook had splendid deep holes there. Big trout liked those holes because the water was deep and cool. Thinking about them made him wish he had brought his fishing rod.
        - id: ch01-b12
          speaker: narrator
          text: He pushed through a thicket of alders. Then he stopped short and gasped. He couldn't go another step, because right in front of him was a pond!
        - id: ch01-b13
          speaker: narrator
          text: He rubbed his eyes and looked once more. Then he bent down and dipped a hand into the water to find out if it was real. There could be no doubt. Here was a real pond, full of real water, in a place where no pond had ever been before.
        - id: ch01-b14
          speaker: narrator
          text: The heart of the Green Forest was always quiet, but now it seemed quieter than ever. Farmer Brown's boy walked around the edge of that strange pond. Everything felt like a dream. He wondered whether he might wake up soon and discover that none of it was true.
        - id: ch01-b15
          speaker: narrator
          text: But he didn't wake up. He kept walking until he came to a dam. It was a splendid dam, built of logs, sticks, and mud. Water flowed over the top of it. Down in the Green Forest below, he could hear the Laughing Brook beginning to laugh again.
        - id: ch01-b16
          speaker: narrator
          text: Farmer Brown's boy sat down with his elbows on his knees and his chin in his hands. He was almost too surprised to think.
