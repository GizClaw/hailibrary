audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    paddy:
      display_name: 海狸帕迪
      tts:
        delivery: 开朗坚定，做事胸有成竹
        timbre: 结实而年轻
        pace: 轻快
        pitch: 中低音
    jerry:
      display_name: 麝鼠杰里
      tts:
        delivery: 直爽热心，说话干脆
        timbre: 温厚清晰
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十二章　麝鼠杰里学到了一件事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 自以为是万事通，早晚摔得两手空。眼睛耳朵都用好，管住舌头智慧高。
        - id: ch01-b02
          speaker: narrator
          text: 麝鼠杰里会告诉你，这几句话一点儿也不假，因为他亲自得到了教训。如今再说起别人和别人做的事，他总会格外小心。可大表哥海狸帕迪盖房子时，杰里还不懂得谨慎。不，先生，那时他一点儿也不谨慎。
        - id: ch01-b03
          speaker: narrator
          text: 那时候，杰里认定自己比帕迪更懂盖房子。帕迪把一大堆泥巴堆在本该留作卧室的地方，外面又围起树枝墙。杰里一看，更觉得自己没错，还把这番见解告诉了兔子彼得。
        - id: ch01-b04
          speaker: narrator
          text: 有句话要是不想让大家知道，告诉兔子彼得可绝不稳妥。彼得很信服杰里对盖房子的看法。他特别喜欢杰里在微笑池塘里的舒适小屋。那的确是一座很漂亮的房子，杰里为它自豪也情有可原。可这并不能证明，他已经懂得盖房子的所有门道。
        - id: ch01-b05
          speaker: narrator
          text: 彼得果然逢人便讲，帕迪的新房盖错了，而且这是本该很懂行的麝鼠杰里说的。
        - id: ch01-b06
          speaker: narrator
          text: 从那以后，绿森林和绿草地的小居民们只要逮到机会，就会悄悄来到帕迪的新池塘岸边。他们望着帕迪用树枝和泥巴筑成的那一大堆东西，忍不住偷笑。说是房子，里面却没有房间。至少大家都是这样想的。因为他们怎么瞧也看不到房间，帕迪准是忘掉了这件最要紧的事。
        - id: ch01-b07
          speaker: narrator
          text: 这成了大家口中的大笑话。他们笑了一回又一回。帕迪筑起那道了不起的水坝后，大家原本十分敬重他，现在这份敬意也少了许多。
        - id: ch01-b08
          speaker: narrator
          text: 一天夜里，杰里和彼得坐在月光下，又议论起帕迪的房子。帕迪不再往墙上搬树枝了。他潜到水下，过了好一阵，还是没有露面。
        - id: ch01-b09
          speaker: narrator
          text: 忽然，杰里发现新房四周的池水变得非常浑。他紧皱眉头，怎么也猜不出帕迪在做什么。过了一会儿，帕迪浮上来换气，接着又潜下去，水比刚才更浑了。
        - id: ch01-b10
          speaker: narrator
          text: 这样的情形持续了很久。每隔一会儿，帕迪就浮上来喘口气，歇上几分钟，然后再次下潜。池水也一次比一次浑浊。
        - id: ch01-b11
          speaker: narrator
          text: 杰里终于再也受不了心里的疑惑，非把事情弄明白不可。他悄悄滑进池塘，朝水最浑的地方游去。刚到那里，帕迪正好冒出水面。
        - id: ch01-b12
          speaker: paddy
          text: 你好啊，杰里表弟！我正要请你进去看看呢。你来评评房子里面怎么样，跟我走吧。
        - id: ch01-b13
          speaker: narrator
          text: 帕迪潜下去，杰里紧跟在后。他们穿过水下三扇门中的一扇，再沿着平滑的通道向上游，直接进了一间大卧室。杰里一辈子也没见过这么宽敞、这么漂亮的房间。
        - id: ch01-b14
          speaker: narrator
          text: 他惊得倒吸一口气，一个字也说不出来。自己明明认定这里没有房间，如今却站在这间高出水面的气派大屋里。杰里完全不知道该怎么解释眼前的一切。
        - id: ch01-b15
          speaker: narrator
          text: 帕迪眼里闪着笑意。
        - id: ch01-b16
          speaker: paddy
          text: 怎么样，杰里表弟？你觉得我的房子如何？
        - id: ch01-b17
          speaker: jerry
          text: 我——我觉得棒极了，简直好得不能再好！可我一点儿也没弄明白，帕迪表哥。我——我——以前帮你堆在正中央的那一大堆泥巴，怎么不见了？
          emotion: surprised
        - id: ch01-b18
          speaker: narrator
          text: 问这句话时，杰里心里有多难为情，脸上的样子就有多傻。
        - id: ch01-b19
          speaker: paddy
          text: 咳，我把泥巴全挖走了呀。池水就是这么变浑的。
        - id: ch01-b20
          speaker: jerry
          text: 那你一开始为什么还要堆起那座泥堆？
        - id: ch01-b21
          speaker: paddy
          text: 我砌墙时，总得有个结实的东西让树枝靠着，这还用说吗？等枝条顶端扣在一起，搭好了屋顶，它们就不再需要支撑了。我再挖走泥堆，房间便空了出来。要不这样，我根本盖不出这么大的屋子。看来，你对盖房子的门道懂得不算多呀，杰里表弟。
        - id: ch01-b22
          speaker: jerry
          text: 我——恐怕我真的不懂。
          emotion: sad
