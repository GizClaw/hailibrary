  chapters:
    - id: ch01
      title: Jerry Muskrat Learns Something
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: If you think you know it all, you are riding for a fall. Use your ears and use your eyes, but hold your tongue and you'll be wise.
        - id: ch01-b02
          speaker: narrator
          text: Jerry Muskrat will tell you that those words are as true as can be. He learned the lesson himself. These days, he is very careful about what he says of other people and their work. But when his cousin Paddy the Beaver was building his house, Jerry wasn't careful at all.
        - id: ch01-b03
          speaker: narrator
          text: No, sir. Back then, Jerry believed he knew more about building houses than Paddy did. He felt certain of it when he saw Paddy heap up a huge mound of mud where the room should have been, then build a wall of sticks around it. Jerry said exactly what he thought to Peter Rabbit.
        - id: ch01-b04
          speaker: narrator
          text: Now, if you don't want everyone to hear something, it is never safe to tell Peter Rabbit. Peter respected Jerry's opinion about houses. He greatly admired Jerry's snug home in the Smiling Pool. It truly was a fine house, and Jerry had every right to be proud of it. Still, that didn't mean Jerry knew everything there was to know about building.
        - id: ch01-b05
          speaker: narrator
          text: Of course, Peter told everyone he met that Paddy was making a foolish mistake with his new house. Jerry Muskrat had said so, and Jerry ought to know.
        - id: ch01-b06
          speaker: narrator
          text: After that, whenever they had the chance, the little people of the Green Forest and Green Meadows crept down to the shore of Paddy's new pond. They looked across at the great heap of sticks and mud Paddy had built and chuckled. It was supposed to be a house, yet Paddy had forgotten the room. At least, that was what they believed. There certainly wasn't any room they could see.
        - id: ch01-b07
          speaker: narrator
          text: They thought it was a wonderful joke and laughed about it again and again. Since Paddy had built his amazing dam, they had respected him greatly. Now much of that respect was gone.
        - id: ch01-b08
          speaker: narrator
          text: One night, Jerry and Peter sat in the moonlight and talked the whole thing over. Paddy was no longer bringing sticks for his wall. He had dived beneath the water and stayed out of sight for a long while.
        - id: ch01-b09
          speaker: narrator
          text: Then Jerry noticed that the water all around Paddy's new house had turned very, very muddy. He frowned and tried to imagine what Paddy might be doing. After a while, Paddy rose for air. Down he went again, and the water became muddier than ever.
        - id: ch01-b10
          speaker: narrator
          text: This went on for a long time. Every so often, Paddy surfaced to breathe and rest for a few minutes. Then he dived once more, and more mud clouded the water.
        - id: ch01-b11
          speaker: narrator
          text: At last, Jerry couldn't bear the mystery any longer. He had to find out what was happening. He slipped into the pond and swam toward the muddiest water. Just as he reached the spot, Paddy popped up beside him.
        - id: ch01-b12
          speaker: paddy
          text: Hello, Cousin Jerry! I was just about to ask you in. Come see what you think of my house from the inside. Follow me.
        - id: ch01-b13
          speaker: narrator
          text: Paddy dived, and Jerry followed. Paddy led him through one of three doorways beneath the water. From there, they swam up a smooth hall and entered the biggest, finest bedroom Jerry had ever seen.
        - id: ch01-b14
          speaker: narrator
          text: Jerry could only gasp. Surprise had taken every word from him. Here he was in a splendid, roomy bedroom above the water, after being so sure there was no room at all. He had no idea what to think.
        - id: ch01-b15
          speaker: narrator
          text: Paddy's eyes began to twinkle.
        - id: ch01-b16
          speaker: paddy
          text: Well, Cousin Jerry, what do you think of it?
        - id: ch01-b17
          speaker: jerry
          text: I... I think it's splendid. It's simply splendid! But I don't understand any of this, Cousin Paddy. I... I... What happened to that huge mound of mud I helped you build in the middle?
          emotion: surprised
        - id: ch01-b18
          speaker: narrator
          text: Jerry looked every bit as foolish as he felt when he asked.
        - id: ch01-b19
          speaker: paddy
          text: Why, I dug all the mud away. That's why the water got so muddy.
        - id: ch01-b20
          speaker: jerry
          text: Then why did you put the mound there to begin with?
        - id: ch01-b21
          speaker: paddy
          text: I needed something solid to brace my sticks against while I built the walls, of course. Once I had fastened the tops together to make the roof, the sticks didn't need that support anymore. So I dug the mud out and made this room. There was no other way for me to build a room this large. I can see you don't know very much about building houses, Cousin Jerry.
        - id: ch01-b22
          speaker: jerry
          text: I... I'm afraid I don't.
          emotion: sad
