  chapters:
    - id: ch01
      title: The Queer Storehouse
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Everyone knew that Paddy the Beaver was storing food for winter, and almost everyone thought his food was very queer. Prickly Porky the Porcupine was the one exception. He ate the same sort of food, though he never stored any. Winter or summer, it made no difference to him. He simply climbed a tree and ate whenever he was hungry. And what did they both eat? Bark from certain kinds of trees.
        - id: ch01-b02
          speaker: narrator
          text: Prickly Porky could climb up and eat bark where it grew, but Paddy couldn't climb at all. Suppose Paddy ate only the bark he could reach from the ground. It would take a great many trees to fill him, and before long he would ruin the Green Forest. Once the bark is stripped all the way around a trunk, that tree dies. Everything a tree draws from the ground to help it grow and stay alive travels from the roots in the sap. The sap moves up through the inside of the bark and on into the branches. When the bark is gone all around the trunk, the sap can no longer make that journey, and the tree slowly starves.
        - id: ch01-b03
          speaker: narrator
          text: Paddy loved the Green Forest as dearly as you or I, and perhaps a little more, because it was his home. He never wasted anything, either. Instead of taking a little bark and killing many trees, he cut down one tree and used all its bark. Paddy wasn't lazy in the least.
        - id: ch01-b04
          speaker: narrator
          text: Aspen bark was his favorite. When there was no aspen to be had, he would eat bark from poplar, alder, willow, or even birch. But aspen tasted so much better to Paddy that he would work very hard to get it. Perhaps it tasted better because he had worked so hard for every bite.
        - id: ch01-b05
          speaker: narrator
          text: Some aspens grew right at the edge of the pond Paddy had made in the Green Forest. He cut them down just as he had cut the trees for his dam. As soon as each tree fell, he chopped it into short pieces. Then, piece by piece, he swam with them into the deep water close to his new house.
        - id: ch01-b06
          speaker: narrator
          text: Paddy carried the first pieces to the bottom one at a time. He pressed each one just far enough into the mud to hold it there. Every new piece went onto the ones below. The pile grew and grew, higher with every return trip.
        - id: ch01-b07
          speaker: narrator
          text: Jerry Muskrat, Peter Rabbit, Bobby Coon, and the other little people of the Green Forest watched with great interest. They were all trying to understand what Paddy was doing. It almost looked as though he were laying the foundation for another house.
        - id: ch01-b08
          speaker: peter
          text: Jerry, what in the world is he doing?
        - id: ch01-b09
          speaker: narrator
          text: Peter had tried to hold that question in, but at last he couldn't stay quiet any longer.
        - id: ch01-b10
          speaker: jerry
          text: I'm not quite sure. Paddy said he meant to store food for winter, just as I told you. I suppose that's what this is. But why is he carrying it all the way out into the pond? I think I'll swim over and ask him.
        - id: ch01-b11
          speaker: peter
          text: Please do, and come right back to tell us what he says!
        - id: ch01-b12
          speaker: narrator
          text: Peter had grown so curious that he could hardly sit still. Jerry swam out to where Paddy was hard at work.
        - id: ch01-b13
          speaker: jerry
          text: Cousin Paddy, is this the food you're saving for winter?
        - id: ch01-b14
          speaker: narrator
          text: Paddy climbed onto the side of his house for a rest.
        - id: ch01-b15
          speaker: paddy
          text: Yes, it is. This is my winter food. Isn't it splendid?
        - id: ch01-b16
          speaker: jerry
          text: I suppose it is, though I'd rather have lily roots and clams. But what will you do with all these sticks? Where do you keep them?
        - id: ch01-b17
          speaker: paddy
          text: The pond is my storehouse. I'll build a great pile here beside my house, and the water will keep everything fresh all winter. After the pond freezes, I can slip through one of my doorways on the bottom, swim over, take a stick, and have my meal. Could anything be handier?
