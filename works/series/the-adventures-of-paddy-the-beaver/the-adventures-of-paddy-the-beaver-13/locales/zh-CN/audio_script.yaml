audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    paddy:
      display_name: 海狸帕迪
      tts:
        delivery: 开朗坚定，做事胸有成竹
        timbre: 结实而年轻
        pace: 轻快
        pitch: 中低音
    jerry:
      display_name: 麝鼠杰里
      tts:
        delivery: 直爽热心，说话干脆
        timbre: 温厚清晰
        pace: 适中
        pitch: 中音
    peter:
      display_name: 兔子彼得
      tts:
        delivery: 活泼机灵，话里常带笑意
        timbre: 明亮轻巧
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十三章　奇怪的食物仓库
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 大家都知道，海狸帕迪在给冬天储备食物。可大家也都觉得，他存下的食物实在古怪。只有豪猪刺刺不这样想，因为刺刺和帕迪爱吃同一种东西。不过，刺刺从不储存。他想吃了就出去找，不管冬天还是夏天都一样。
        - id: ch01-b02
          speaker: narrator
          text: 那到底是什么呢？当然是树皮啦。是的，先生，就是几种特定树木的皮。
        - id: ch01-b03
          speaker: narrator
          text: 豪猪刺刺会爬树，可以直接待在树上啃。帕迪不会爬树。要是他只啃站在地上够得着的树皮，想填饱肚子，就得伤害许许多多棵树。过不了多久，绿森林也会被他毁掉。
        - id: ch01-b04
          speaker: narrator
          text: 你要知道，一棵树要是被绕着树干剥掉整圈树皮，它就活不成了。树从土里吸取的养分，要靠汁液从根部往上送，才能生长，也才能活下去。树液沿着树皮内侧往上流，经过树干，再进入枝条。树皮少了一圈，树液就上不去，那棵树只好活活饿死。
        - id: ch01-b05
          speaker: narrator
          text: 帕迪深爱着绿森林，就像你我一样，或许比我们还要爱它。因为这里就是他的家。帕迪也从不浪费。他宁愿砍倒一棵树，把整棵树的皮都吃到，也不会为了省事，只吃一点点树皮，却害死一大群树。他身上连一根懒骨头都找不到，一根也没有。
        - id: ch01-b06
          speaker: narrator
          text: 帕迪最喜欢白杨树皮。没有白杨，他也吃杨树、桤木、柳树，甚至桦树的皮。可白杨树皮的滋味好得多，所以哪怕要费很大力气，他也愿意。说不定，正是因为得来不容易，它才吃着格外香呢。
        - id: ch01-b07
          speaker: narrator
          text: 帕迪造出的池塘边，恰好长着几棵白杨。他像当初筑坝那样，把树一棵棵砍倒。每倒下一棵，他就把树干截成短段，带着木头游到新房附近的深水里。
        - id: ch01-b08
          speaker: narrator
          text: 帕迪一次运一段。最先运来的几段，他沉到水底，稍稍推进泥里，让它们稳稳立住。后来送来的木头，就一段接一段堆在上面。那堆木头越垒越高，也越垒越大。
        - id: ch01-b09
          speaker: narrator
          text: 麝鼠杰里、兔子彼得、浣熊博比和绿森林里的其他小居民，都兴致勃勃地看着。他们怎么也猜不透帕迪要做什么。瞧起来，他几乎像在给另一座房子打地基。
        - id: ch01-b10
          speaker: narrator
          text: 彼得终于再也坐不住了。
        - id: ch01-b11
          speaker: peter
          text: 杰里，他这到底是在干什么呀？
        - id: ch01-b12
          speaker: jerry
          text: 我也不能完全确定。他说要准备过冬的食物，我早就把这话告诉你们了。我想，他现在做的就是这件事。可他为什么把东西全运进池塘，我实在想不通。还是让我过去问问吧。
        - id: ch01-b13
          speaker: narrator
          text: 彼得越来越好奇，已经没法安安稳稳坐着了。
        - id: ch01-b14
          speaker: peter
          text: 那你快去问，问完一定回来告诉我们！
        - id: ch01-b15
          speaker: narrator
          text: 于是，杰里朝忙个不停的帕迪游过去。到了帕迪跟前，他开口问道。
        - id: ch01-b16
          speaker: jerry
          text: 帕迪表哥，这一堆就是你准备过冬的食物吗？
        - id: ch01-b17
          speaker: narrator
          text: 帕迪爬上房子侧面，停下来歇口气。
        - id: ch01-b18
          speaker: paddy
          text: 对，就是这些。这些食物存得很不错吧？
        - id: ch01-b19
          speaker: narrator
          text: 杰里想说得客气一点儿。
        - id: ch01-b20
          speaker: jerry
          text: 我想，应该很不错。不过，我自己更喜欢睡莲的根和蛤蜊。可是，这些木头你准备怎么用呢？你的食物仓库又在哪儿？
        - id: ch01-b21
          speaker: paddy
          text: 这座池塘就是我的食物仓库。我会在房子旁边堆起一大堆木头，池水能让它们整个冬天都保持新鲜。等池塘结冰了，我只要从水底的一扇门溜出去，游到这里拿一根木头，就能填饱肚子。你说，是不是方便极了？
