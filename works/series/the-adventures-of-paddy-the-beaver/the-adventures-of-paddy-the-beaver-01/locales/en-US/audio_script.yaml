audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    paddy:
      display_name: Paddy the Beaver
      tts:
        delivery: cheerful and determined
        timbre: sturdy and youthful
        pace: lively
        pitch: medium-low
  chapters:
    - id: ch01
      title: Paddy the Beaver Begins Work
      blocks:
        - id: ch01-b01
          speaker: paddy
          text: |-
            Work, work all through the night,
            While the stars are shining bright.
            Work, work all through the day.
            I have no time now for play.
        - id: ch01-b02
          speaker: narrator
          text: Paddy the Beaver made up that little rhyme while he worked on a dam. The dam would give him the pond he wanted, deep in the Green Forest.
        - id: ch01-b03
          speaker: narrator
          text: Of course, the rhyme wasn't quite true about working all night and all day. Nobody could keep that up. Everyone needs rest and sleep, and a little playtime helps everyone do their best.
        - id: ch01-b04
          speaker: narrator
          text: So Paddy didn't really work all day after working all night. But he truly had no time to play. There was far too much to do. He had enjoyed plenty of play through the long summer. Now he had to prepare for the long, cold winter.
        - id: ch01-b05
          speaker: narrator
          text: Of all the workers in the Green Forest, on the Green Meadows, and in the Smiling Pool, not one can match Paddy. Even his cousin Jerry Muskrat can't.
        - id: ch01-b06
          speaker: narrator
          text: Happy Jack Squirrel and Striped Chipmunk store food for the cold months when rough Brother North Wind and Jack Frost are in charge. Jerry Muskrat builds a fine house to stay warm and comfortable. Yet their work seems small beside Paddy's.
        - id: ch01-b07
          speaker: narrator
          text: As you know, Paddy had spent the summer playing. He had wandered back and forth along the Laughing Brook. He had even followed it far upstream, all the way to the place where it began.
        - id: ch01-b08
          speaker: narrator
          text: But while Paddy wandered, he was also studying everything around him. He needed to decide whether he truly wanted to make his home in the Green Forest.
        - id: ch01-b09
          speaker: narrator
          text: First, he had to find out whether enough of his favorite food grew there. Then he had to be just as certain that he could make a pond close to that food. Finally, he needed to know that if he made the pond and built a home, he would be fairly safe inside it.
        - id: ch01-b10
          speaker: narrator
          text: Paddy had answered every one of those questions during his summer playtime. Now he was ready to begin. And once Paddy starts a job, he stays with it until the job is done.
        - id: ch01-b11
          speaker: paddy
          text: If you want to succeed, that's the only way to work.
        - id: ch01-b12
          speaker: narrator
          text: Paddy says so, and you and I both know that he is right.
        - id: ch01-b13
          speaker: narrator
          text: Paddy can see at night as well as Reddy Fox, Peter Rabbit, and Bobby Coon. He likes night best because he feels safest then. He can see by day, too, and he works then if he feels safe and knows no one is watching.
        - id: ch01-b14
          speaker: narrator
          text: Before Paddy could have the pond he needed, he had to build a dam across the Laughing Brook. He had already chosen the perfect spot. It was a low, open place hidden deep in the Green Forest. Many young aspen trees grew around its edges, and aspen bark was Paddy's favorite food.
        - id: ch01-b15
          speaker: narrator
          text: The Laughing Brook ran straight through the middle of that open ground. Down at the lower edge, Paddy had found just the right place for his dam. The dam would not need to stretch very far.
        - id: ch01-b16
          speaker: narrator
          text: Once it was finished, it would hold back the water in the Laughing Brook. The water would spread over the low ground and turn the open place into a pond. Paddy's eyes twinkled the first time he saw how well it would work. Right then, he decided that he would stay in the Green Forest.
        - id: ch01-b17
          speaker: narrator
          text: At last, Paddy was ready to begin the dam. He went upstream along the Laughing Brook until he reached a place where alders and willows grew. That was where his real work started.
        - id: ch01-b18
          speaker: narrator
          text: Paddy needed a great many trees, so he began cutting them down. He used his big front teeth, the very teeth made for work like this.
        - id: ch01-b19
          speaker: narrator
          text: And as Paddy worked, he was happy. After all, no one who does no work can ever be truly happy.
