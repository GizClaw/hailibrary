audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    paddy:
      display_name: 海狸帕迪
      tts:
        delivery: 快活坚定，做事干脆利落
        timbre: 结实而年轻
        pace: 轻快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第一章　海狸帕迪开工了
      blocks:
        - id: ch01-b01
          speaker: paddy
          text: |-
            干呀，干呀，干一整夜，
            天上的星星亮晶晶；
            干呀，干呀，干一整天，
            哪还有工夫去玩耍。
        - id: ch01-b02
          speaker: narrator
          text: 海狸帕迪正忙着筑坝，这首小歌谣就是他干活时编出来的。等坝筑好，绿森林深处就会有一座他盼了很久的池塘。
        - id: ch01-b03
          speaker: narrator
          text: 不过呀，歌里说他从夜里一直干到白天，可不全是真的。谁也不能没日没夜地一直干。人人都要休息，要睡觉，也得玩一会儿，才有最好的精神。
        - id: ch01-b04
          speaker: narrator
          text: 所以，帕迪不会干完一整夜，白天还不停手。可是他确实没空玩，因为要做的事实在太多。长长的夏天里，他已经玩够了。如今，他得为漫长又寒冷的冬天作准备。
        - id: ch01-b05
          speaker: narrator
          text: 绿森林、绿草地和微笑池里，有许多勤快的小家伙，可谁也比不上海狸帕迪。连他的表亲麝鼠杰里也比不过他。
        - id: ch01-b06
          speaker: narrator
          text: 北风老哥和霜冻杰克掌管寒冬时，松鼠快乐杰克和花栗鼠条纹儿会吃储藏的食物。麝鼠杰里会躲进自己造的好房子，住得又暖和又舒服。可跟帕迪的活儿相比，这些都算不上什么。
        - id: ch01-b07
          speaker: narrator
          text: 前面说过，帕迪整个夏天都在玩。他沿着欢笑溪来来回回地走，还一直走到上游，找到了溪水开始流出的地方。
        - id: ch01-b08
          speaker: narrator
          text: 可他边玩边仔细察看周围的一切。他要先想清楚，自己是不是真的愿意留在绿森林安家。
        - id: ch01-b09
          speaker: narrator
          text: 他先要看看，这里有没有足够多的食物，而且得是自己爱吃的。接着，还要确定能不能在食物附近造一座池塘。最后，他得知道池塘和家造好以后，住在里面是不是足够安全。
        - id: ch01-b10
          speaker: narrator
          text: 这些问题，帕迪早在夏天玩耍的时候查清楚了。现在，他可以开工啦。帕迪只要动了手，就会一直干到把事情做完。
        - id: ch01-b11
          speaker: paddy
          text: 想把事情做成，就得这么干。
        - id: ch01-b12
          speaker: narrator
          text: 帕迪总是这样说。你知道，我也知道，他说得没错。
        - id: ch01-b13
          speaker: narrator
          text: 帕迪在夜里看得很清楚，跟狐狸雷迪、兔子彼得和浣熊博比一样。他最喜欢在夜里活动，那时候觉得最安全。白天他也看得见，只要四周没有危险，也没有谁盯着，他照样会干活。
        - id: ch01-b14
          speaker: narrator
          text: 要得到那座急需的池塘，帕迪得先横着欢笑溪筑一道坝。他已经挑好了地方。那是绿森林深处一片低洼的空地，四周长着不少小白杨。帕迪最爱吃的，正是白杨树皮。
        - id: ch01-b15
          speaker: narrator
          text: 欢笑溪从空地正中流过。到了空地下游的边上，恰好有一处适合筑坝，而且坝不用造得很长。
        - id: ch01-b16
          speaker: narrator
          text: 坝一造好，就能把欢笑溪的水拦住。水会慢慢漫过低地，让整片空地变成池塘。帕迪第一次看明白这一点时，眼睛都亮了。就在那一刻，他决定留在绿森林。
        - id: ch01-b17
          speaker: narrator
          text: 现在，帕迪终于要筑坝了。他沿着欢笑溪往上游走，来到长满桤木和柳树的地方。他的活儿，就从这里开始。
        - id: ch01-b18
          speaker: narrator
          text: 筑坝需要许许多多的树，帕迪便动手咬树。他用的是两颗大门牙，而这两颗牙，生来就是干这种活儿的。
        - id: ch01-b19
          speaker: narrator
          text: 帕迪一边干，一边觉得快活。因为呀，一个什么活儿都不干的人，永远不会真正快活。
