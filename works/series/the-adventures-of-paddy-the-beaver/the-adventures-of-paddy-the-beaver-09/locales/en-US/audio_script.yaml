audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    paddy:
      display_name: Paddy the Beaver
      tts:
        delivery: cheerful and determined
        timbre: sturdy and youthful
        pace: lively
        pitch: medium-low
  chapters:
    - id: ch01
      title: Paddy Plans a House
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Paddy the Beaver sat on his dam with happiness shining in his eyes. Before him lay the bright water of the pond he had made, with the tall trees of the Green Forest growing all around its edge.
        - id: ch01-b02
          speaker: narrator
          text: It was a beautiful place, and it was very still. To almost anyone else, it might have felt lonely. But Paddy is never lonely. The trees and flowers and all the little plants are company enough for him.
        - id: ch01-b03
          speaker: narrator
          text: The pond was very, very still. On one side, the water held a lovely rosy glow. It was the reflection of jolly, round, red Mr. Sun. The tall trees hid him from Paddy, but Paddy knew just what he was doing. Mr. Sun was going to bed behind the Purple Hills.
        - id: ch01-b04
          speaker: narrator
          text: Soon the little stars would come out and twinkle down at Paddy. He loved those stars, and every evening he watched for the very first one.
        - id: ch01-b05
          speaker: narrator
          text: Yes, Paddy was very happy. Only one thing kept him from being completely happy. Farmer Brown's boy had discovered the dam and pond that very afternoon, and Paddy couldn't be sure what the boy would do next.
        - id: ch01-b06
          speaker: narrator
          text: Paddy had stayed snugly out of sight during the boy's visit. He felt almost certain the boy didn't know who had made the dam. And that was the trouble. Farmer Brown's boy might decide to find out all about it. If he did, Paddy would always have to keep watch.
        - id: ch01-b07
          speaker: paddy
          text: But why worry about trouble before it comes? It may never come at all. If it does, that will be time enough to worry.
        - id: ch01-b08
          speaker: narrator
          text: That thought showed just how much wisdom Paddy carried in his little brown head.
        - id: ch01-b09
          speaker: paddy
          text: What I need to do now is get ready for winter, and that's going to take a lot of work.
        - id: ch01-b10
          speaker: paddy
          text: Let's see. First I need a house. It must be big and strong and warm, so I'll be safe and cozy after the pond freezes over. Then I need to store enough food to last until gentle Sister South Wind comes back to make way for lovely Mistress Spring.
        - id: ch01-b11
          speaker: paddy
          text: My, my! With so much work waiting for me, I can't sit here dreaming any longer!
        - id: ch01-b12
          speaker: narrator
          text: Paddy slipped into the water. He swam all around his new pond, looking for the very best place to build his house. He wanted to be certain before he made his choice.
        - id: ch01-b13
          speaker: narrator
          text: Choosing exactly where to put a house is important, though some people are terribly careless about it. Jimmy Skunk, for example, often digs his underground house where everyone passing by can see it. Perhaps Jimmy is so independent that he simply doesn't care who knows where he lives.
        - id: ch01-b14
          speaker: narrator
          text: Paddy is never careless that way. Before he begins, he always chooses the best place and makes sure it truly is best. This time, he already felt quite certain where his house belonged. Even so, he circled the pond once more, just to be doubly sure.
        - id: ch01-b15
          speaker: narrator
          text: At last Paddy was satisfied. He swam to the place he had chosen, where the water was quite deep.
        - id: ch01-b16
          speaker: paddy
          text: I can't let the ice grow thick enough to close my doorway, and here I'm sure it never will.
        - id: ch01-b17
          speaker: paddy
          text: The foundations must be strong, and the walls must be thick. I'll need plenty of mud for plaster. Inside, above the water, I need the coziest, warmest room I can make, so I can sleep in comfort.
        - id: ch01-b18
          speaker: paddy
          text: This is where I'll build. It's high time I got to work.
        - id: ch01-b19
          speaker: narrator
          text: With that, Paddy swam toward the place where he had cut the trees for his dam.
        - id: ch01-b20
          speaker: narrator
          text: His heart was light, for Paddy had learned long ago that the surest way to be happy is to be busy.
