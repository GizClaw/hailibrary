audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    paddy:
      display_name: 海狸帕迪
      tts:
        delivery: 快活坚定，做事干脆利落
        timbre: 结实而年轻
        pace: 轻快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第九章　帕迪打算盖房子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 河狸帕迪坐在自己筑的水坝上，望着亲手造出的池塘。水面闪着光，他的眼睛也因为欢喜，亮闪闪的。池塘四周长满了绿森林的高大树木。这里美极了，静极了，也冷清极了。
        - id: ch01-b02
          speaker: narrator
          text: 差不多谁来到这里，都会觉得冷清，帕迪却不会寂寞。树木、花儿，还有一株株小小的草木，都是陪伴他的朋友。
        - id: ch01-b03
          speaker: narrator
          text: 四下里一点儿声音也没有，真是静得不能再静。池塘的一边泛着美丽的玫瑰色霞光，那是快活、滚圆、红彤彤的太阳公公映在水里的影子。高树遮住了太阳公公，可帕迪知道，他正要到紫山后面睡觉。
        - id: ch01-b04
          speaker: narrator
          text: 很快，小星星就会出来，在天上朝帕迪眨眼睛。帕迪最喜欢小星星了，每晚都等着看见最先露面的那一颗。
        - id: ch01-b05
          speaker: narrator
          text: 这时的帕迪非常幸福。要不是心里还挂着一件事，他就再幸福不过了。那天下午，农夫布朗家的男孩发现了水坝和池塘，帕迪不知道男孩接下来会做什么。
        - id: ch01-b06
          speaker: narrator
          text: 男孩在池塘边的时候，帕迪藏得严严实实。他相信男孩不知道水坝是谁筑的。可正因为不知道，男孩也许会想办法查个明白。那样的话，帕迪就得一直小心提防。
        - id: ch01-b07
          speaker: paddy
          text: 麻烦还没来，说不定永远也不会来，我干吗现在就操心？真来了再操心，也来得及。
        - id: ch01-b08
          speaker: narrator
          text: 帕迪能这样劝自己，可见那颗棕色的小脑袋里很有智慧。他很快又想到，眼下最要紧的是为过冬作准备，而这可有不少活儿要干。
        - id: ch01-b09
          speaker: paddy
          text: 让我想想。我得盖一座又大、又结实、又暖和的房子。等池塘冻住了，我在里面才会又暖和又安全。还得存够食物，一直吃到温柔的南风姐姐赶来，替美丽的春姑娘开路。
        - id: ch01-b10
          speaker: paddy
          text: 哎呀，哎呀！这么多事情等着我，我可不能还坐在这里做梦啦！
        - id: ch01-b11
          speaker: narrator
          text: 说完，帕迪滑进水里，绕着新池塘游了一圈，寻找最适合盖房子的地方。房子的位置选得对不对，是一件很要紧的事。有些家伙在这上面实在粗心得很。
        - id: ch01-b12
          speaker: narrator
          text: 臭鼬吉米就常犯这样的错。他的房子是挖在地下的，可他偏偏会把洞挖在路过的谁都能看见的地方。也许吉米太有主见了，根本不在乎别人知不知道他的住处。
        - id: ch01-b13
          speaker: narrator
          text: 帕迪可从来不马虎。他总要选出最好的地点，而且动工前一定会确认清楚。这一次，他其实已经相当肯定该把房子盖在哪里，却还是绕池塘游了一圈，再检查一遍。
        - id: ch01-b14
          speaker: narrator
          text: 等到完全满意，帕迪才游向自己选中的地方。那一带的水相当深。
        - id: ch01-b15
          speaker: paddy
          text: 冰绝不能厚到把我的门口封住。选在这里，我敢肯定不会出那种事。地基得打得牢牢的，墙也得砌得厚厚的。
        - id: ch01-b16
          speaker: paddy
          text: 我得准备很多泥巴来抹墙。屋子里面，水面上方，还得有一间最舒服、最暖和的房间，让我能睡得安安稳稳。
        - id: ch01-b17
          speaker: paddy
          text: 没错，房子就盖在这里。我早该动手啦！
        - id: ch01-b18
          speaker: narrator
          text: 帕迪说完，就朝先前为筑坝砍树的地方游去。他心里轻快极了，因为他早就明白，要想快活，最可靠的办法就是让自己忙起来。
