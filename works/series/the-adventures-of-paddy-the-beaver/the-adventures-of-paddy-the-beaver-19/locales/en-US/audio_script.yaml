audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    paddy_beaver:
      display_name: Paddy the Beaver
      tts:
        delivery: practical and thoughtfully self-assured
        timbre: sturdy and mellow
        pace: unhurried
        pitch: medium-low
    old_man_coyote:
      display_name: Old Man Coyote
      tts:
        delivery: crafty and quick to grumble
        timbre: rough and lean
        pace: measured
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, lively, and boldly teasing
        timbre: bright and piercing
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: Paddy and Sammy Jay Become Friends
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Paddy the Beaver floated in his pond, wearing the most provoking grin as he looked at Old Man Coyote. The coyote had come so close to catching him. Now Old Man Coyote danced with anger on the bank. He had been certain Paddy was his, and he could hardly believe Paddy had escaped. He showed his long, cruel teeth and looked fierce and ugly.
        - id: ch01-b02
          speaker: paddy_beaver
          text: Come on in! The water feels wonderful!
        - id: ch01-b03
          speaker: narrator
          text: That wasn't very nice of Paddy. It only made Old Man Coyote angrier. Paddy knew he was completely safe, and he couldn't resist saying unkind things. For days, Paddy had needed to watch for danger so he wouldn't be caught. That kept him from doing his best work. With nothing to fear, he could have gotten much more done, and he still had many winter preparations to finish. So Paddy told Old Man Coyote exactly what he thought.
        - id: ch01-b04
          speaker: paddy_beaver
          text: You aren't nearly as smart as you think you are, Mr. Coyote. If you were, you never would have stepped in that mud and left a footprint to warn me. You gave your whole trick away!
        - id: ch01-b05
          speaker: narrator
          text: Sammy Jay had been listening and chuckling. When he heard about the footprint, he flew down and stopped just beyond Old Man Coyote's reach. Then Sammy let his tongue run loose. Some people say his tongue is fastened in the middle and wags at both ends. That isn't really true, of course, but it can seem true when Sammy starts abusing someone. He called Old Man Coyote a sneak, a thief, a coward, a bully, and every other bad name he could think of.
        - id: ch01-b06
          speaker: sammy_jay
          text: You blamed me for warning Paddy! You said that was why you never found him working at night. But you were the one who warned him all along! I once thought you were clever. Now I know better. Paddy is twice as smart as you are!
          emotion: angry
        - id: ch01-b07
          speaker: sammy_jay
          text: Mr. Coyote is ever so sly. Mr. Coyote is clever and spry, if you believe all you hear. But Mr. Coyote is nothing of the kind. Mr. Coyote is stupid and blind. He couldn't catch a flea on his ear!
        - id: ch01-b08
          speaker: narrator
          text: Paddy laughed at Sammy's foolish verse until tears came to his eyes. But Old Man Coyote only grew angrier. Paddy had escaped him, and now Sammy was making fun of him. Worst of all, he couldn't catch either one. Paddy was at home in the water, and Sammy was at home in the air. Old Man Coyote could follow neither of them. At last, he saw no use in staying there to be laughed at. Muttering and grumbling, he set off for the Green Meadows.
        - id: ch01-b09
          speaker: narrator
          text: As soon as Old Man Coyote disappeared from sight, Paddy turned to Sammy Jay. Paddy knew how much Sammy liked being called mister.
        - id: ch01-b10
          speaker: paddy_beaver
          text: Mr. Jay, you did me a very good turn today, and I won't forget it. From now on, you may call me anything you like. You may scream at me as much as you please, but I won't give you the pleasure of seeing me angry. I'll just remember that Mr. Jay saved my life today. Then your sharp tongue won't bother me.
        - id: ch01-b11
          speaker: narrator
          text: Sammy felt both proud and happy. He hardly ever heard anyone say something nice about him. He flew down and landed on the stump of a tree Paddy had cut.
        - id: ch01-b12
          speaker: sammy_jay
          text: Then let's be friends.
          emotion: happy
        - id: ch01-b13
          speaker: paddy_beaver
          text: Gladly!
          emotion: happy
