audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    coyote:
      display_name: 郊狼老先生
      tts:
        delivery: 狡猾自信，盘算时透着得意
        timbre: 粗粝而低沉
        pace: 稍慢
        pitch: 中低音
    sammy:
      display_name: 松鸦萨米
      tts:
        delivery: 尖锐爱炫耀，得意时神气十足
        timbre: 清亮而略带刺耳
        pace: 偏快
        pitch: 高音
    paddy:
      display_name: 海狸帕迪
      tts:
        delivery: 开朗坚定，做事胸有成竹
        timbre: 结实而年轻
        pace: 轻快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十九章　帕迪和松鸦萨米成了朋友
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 海狸帕迪浮在池塘里，冲着岸上的郊狼老先生咧嘴直笑，那副模样可真气人。郊狼方才险些捉住他，这会儿气得在岸边直跳脚。
        - id: ch01-b02
          speaker: narrator
          text: 郊狼原以为这一回十拿九稳，帕迪绝对逃不掉了。现在，他怎么也不敢相信，帕迪竟真的从自己眼前溜走。郊狼龇着又长又狠的牙，看上去又凶又难看。
        - id: ch01-b03
          speaker: paddy
          text: 你也下来呀，池水舒服得很！
        - id: ch01-b04
          speaker: narrator
          text: 帕迪说这种话当然不厚道，只会让郊狼更加恼火。可他很清楚，自己在水里绝对安全，实在忍不住要刺郊狼几句。
        - id: ch01-b05
          speaker: narrator
          text: 这些天，帕迪时时刻刻都防着郊狼来捉他，干活也没有平安无事时那么顺当。眼看冬天就要来了，他还有不少东西没准备好呢。
        - id: ch01-b06
          speaker: narrator
          text: 于是，帕迪把自己对郊狼的看法全讲了出来。他还告诉郊狼，要是真有自己想的那么聪明，就不会在泥地里留下脚印，亲自把行踪泄露给别人。
        - id: ch01-b07
          speaker: narrator
          text: 松鸦萨米一直在旁边听，越听越想笑。一听到脚印的事，他便飞到郊狼够不着的地方，放开那张厉害的嘴，痛痛快快地骂了起来。
        - id: ch01-b08
          speaker: narrator
          text: 有人说，萨米的舌头吊在正中间，两头都会摆个不停。这当然不是真的。可他一骂起人来，还真像有那么回事。他骂郊狼鬼鬼祟祟，骂他是小偷、胆小鬼和仗势欺人的恶霸，能想到的难听话几乎全用上了。
        - id: ch01-b09
          speaker: sammy
          text: 你还说是我给帕迪通了风，所以你夜里才找不到他干活。闹了半天，明明是你自己留下脚印，亲自给他报了信！
          emotion: angry
        - id: ch01-b10
          speaker: sammy
          text: 我以前居然以为你聪明，现在总算知道了。帕迪可比你聪明一倍！
        - id: ch01-b11
          speaker: sammy
          text: 郊狼先生真狡猾，郊狼先生机灵又敏捷。只要听来的话，你全都信。
        - id: ch01-b12
          speaker: sammy
          text: 其实郊狼哪样都不沾，又是愚蠢又是眼瞎，连耳朵上的跳蚤都捉不着！
        - id: ch01-b13
          speaker: narrator
          text: 帕迪听了这首傻乎乎的打油诗，笑得眼泪都出来了。郊狼老先生却气得更加厉害。他恨帕迪从爪下逃走，也恨萨米，简直恨透了。
        - id: ch01-b14
          speaker: narrator
          text: 可最叫郊狼难受的是，这两个家伙他谁也抓不着。帕迪在水里就像回到家，萨米在空中也像回到家。水里和空中，郊狼都追不上去。
        - id: ch01-b15
          speaker: narrator
          text: 最后，郊狼明白再待下去也只能挨他们嘲笑。他嘴里嘟囔着，满腹牢骚地转身走向绿草地。
        - id: ch01-b16
          speaker: narrator
          text: 等郊狼彻底看不见了，帕迪转过身，对松鸦萨米开了口。他知道，称萨米一声“先生”，最能让萨米高兴。
        - id: ch01-b17
          speaker: paddy
          text: 松鸦先生，今天你真是帮了我一个天大的忙，我一定不会忘记。
        - id: ch01-b18
          speaker: paddy
          text: 往后你想怎么叫我，就怎么叫我。你想冲我嚷嚷多久，也随你的便。可你别想再靠这个取乐了，因为我根本不会生气。
        - id: ch01-b19
          speaker: paddy
          text: 我只要告诉自己，前些天松鸦先生救过我的命，就不会把你那张嘴放在心上啦。
        - id: ch01-b20
          speaker: narrator
          text: 这几句话让萨米又骄傲又快活。要知道，别人很少会说他的好话。他飞下来，落在帕迪砍倒的一棵树留下的树桩上。
        - id: ch01-b21
          speaker: sammy
          text: 那我们做朋友吧。
          emotion: happy
        - id: ch01-b22
          speaker: paddy
          text: 我一百个愿意！
          emotion: happy
