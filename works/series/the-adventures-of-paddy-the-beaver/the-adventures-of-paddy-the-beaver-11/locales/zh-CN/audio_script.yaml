audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    jerry:
      display_name: 麝鼠杰里
      tts:
        delivery: 直爽热心，说话干脆
        timbre: 温厚清晰
        pace: 适中
        pitch: 中音
    peter:
      display_name: 兔子彼得
      tts:
        delivery: 机灵直率，反应快，偶尔有点不服气
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十一章　兔子彼得和麝鼠杰里百思不解
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 麝鼠杰里越来越觉得，大表哥海狸帕迪盖房子的本事，好像没有自己原先以为的那么大。他其实很想提几个建议，却又不大敢开口，因为他最怕惹大表哥不高兴。可这些话一直憋着实在难受，他非找个人说说不可。
        - id: ch01-b02
          speaker: narrator
          text: 杰里游到池塘对面。自从帕迪动工以后，兔子彼得几乎每晚都会来这里。果然，彼得正把身子坐得笔直，睁着一双圆溜溜的大眼睛，盯住水面上那座泥巴和树枝搭成的平台。帕迪还在那里忙着呢。
        - id: ch01-b03
          speaker: jerry
          text: 喂，彼得，你看这东西怎么样？
        - id: ch01-b04
          speaker: peter
          text: 这是什么呀？难道又是一道水坝？
        - id: ch01-b05
          speaker: narrator
          text: 杰里一听，仰起脑袋笑个不停。
        - id: ch01-b06
          speaker: narrator
          text: 彼得满脸疑心地望着他。
        - id: ch01-b07
          speaker: peter
          text: 我真不明白，这到底有什么可笑的。
        - id: ch01-b08
          speaker: jerry
          text: 那是房子呀，你这个笨蛋！是帕迪的新房子。
        - id: ch01-b09
          speaker: narrator
          text: 杰里笑得眼泪都流了出来，边说边抹着眼睛。
        - id: ch01-b10
          speaker: peter
          text: 我才不笨！那堆泥巴和树枝，怎么看也不像一座房子，我怎么猜得到？再说，它的门在哪儿？
          emotion: angry
        - id: ch01-b11
          speaker: jerry
          text: 老实说，我也觉得它不大像样。门倒是有，一共有三扇，全都藏在水底，所以你看不见。每扇门后面都有一条通道，从水下穿过泥巴和树枝搭成的平台，一直通到上面。这个平台就是房子的地基，确实造得很好，真的很好。
        - id: ch01-b12
          speaker: jerry
          text: 可我怎么也想不通，帕迪干吗在正中央堆那么大一堆泥巴。等墙盖好以后，卧室放哪儿呢？屋里一点地方都不会剩下。到头来，它根本不是房子，只是一大堆没用的树枝和泥巴。
        - id: ch01-b13
          speaker: narrator
          text: 彼得望着水里的那一大堆东西。帕迪仍旧在上面干活。彼得挠了挠头，又拉着自己的胡须，认真琢磨起来。
        - id: ch01-b14
          speaker: peter
          text: 嗯，看着的确挺傻的。杰里，你为什么不直接告诉他哪里弄错了？你自己的房子造得那么漂亮，当然能帮他改正呀。
        - id: ch01-b15
          speaker: narrator
          text: 听到彼得夸自己的房子，杰里笑得十分得意。可是，一听说要由自己给帕迪出主意，他马上摇了摇头。
        - id: ch01-b16
          speaker: jerry
          text: 我——我还是不太想去。帕迪说不定不爱听，而且——而且，这样做似乎不大礼貌。
        - id: ch01-b17
          speaker: narrator
          text: 彼得轻轻哼了一声。
        - id: ch01-b18
          speaker: peter
          text: 要是他是我的表哥，我可不会为这种事发愁。
        - id: ch01-b19
          speaker: narrator
          text: 杰里又摇了摇头。
        - id: ch01-b20
          speaker: jerry
          text: 对，我想你肯定不会。可我就是会犯愁，而且——而且——唉，我还是先等一等吧。
        - id: ch01-b21
          speaker: narrator
          text: 他们说这些话的时候，帕迪一直在埋头苦干，一刻也没有停。他从先前砍来筑坝的那些树木上，挑出最长的枝条，一根根拖到水里，又找来许多细长的柳条和赤杨枝。游水的时候，他就把这些材料推在前面，一路送到房子旁边。
        - id: ch01-b22
          speaker: narrator
          text: 到了房子的地基旁，帕迪把每根树枝斜靠在中央的泥堆上，让粗的一头稳稳落在地基上。他就这样绕着泥堆四周，一圈又一圈地搭下去。没过多久，中央的泥堆便完全看不见了。树枝把它盖得严严实实，枝条的顶端还被帕迪巧妙地扣在了一起。
