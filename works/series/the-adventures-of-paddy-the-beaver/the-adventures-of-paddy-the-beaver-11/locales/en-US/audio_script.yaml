audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jerry_muskrat:
      display_name: Jerry Muskrat
      tts:
        delivery: thoughtful and politely cautious
        timbre: light and reedy
        pace: medium
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and confidently curious
        timbre: bright and youthful
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Peter Rabbit and Jerry Muskrat Are Puzzled
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jerry Muskrat was becoming more certain every day that his big cousin Paddy the Beaver didn't know as much about building houses as he ought to know. Jerry wanted to offer a few suggestions, but he didn't quite dare. He was much too anxious not to upset his big cousin.
        - id: ch01-b02
          speaker: narrator
          text: Still, Jerry felt he had to tell somebody what he thought. So he swam across to the place where Peter Rabbit had been watching almost every night since Paddy began to build. Sure enough, Peter was there. He sat very straight, his big round eyes fixed on the platform of mud and sticks where Paddy was working out in the water.
        - id: ch01-b03
          speaker: jerry_muskrat
          text: Well, Peter, what do you make of it?
        - id: ch01-b04
          speaker: peter_rabbit
          text: What is it supposed to be? Is Paddy building another dam?
        - id: ch01-b05
          speaker: narrator
          text: Jerry threw back his head and laughed and laughed.
        - id: ch01-b06
          speaker: narrator
          text: Peter gave him a suspicious look.
        - id: ch01-b07
          speaker: peter_rabbit
          text: I don't see what's so funny.
        - id: ch01-b08
          speaker: jerry_muskrat
          text: Why, that's a house, you silly rabbit! It's Paddy's new house.
        - id: ch01-b09
          speaker: narrator
          text: Jerry wiped the tears of laughter from his eyes.
        - id: ch01-b10
          speaker: peter_rabbit
          text: I am not silly! How could I know that heap of mud and sticks was meant to be a house? It certainly doesn't look like one. So where's the door?
          emotion: angry
        - id: ch01-b11
          speaker: jerry_muskrat
          text: Honestly, I don't think it's much of a house either. But it does have a door. In fact, it has three of them. You can't see them because they're underwater. Each one leads through a passage that comes up through this platform of sticks and mud. That's the foundation of the house.
        - id: ch01-b12
          speaker: jerry_muskrat
          text: And it really is a fine foundation, Peter. It truly is. What I don't understand is why Paddy is putting that huge mound of mud right in the middle. Once he builds the walls, where can he put his bedroom? There won't be any space left. It won't be a house at all. It'll only be one big, useless heap of mud and sticks.
        - id: ch01-b13
          speaker: narrator
          text: Peter scratched his head. Then he thoughtfully pulled at his whiskers while he studied the pile in the water where Paddy was working.
        - id: ch01-b14
          speaker: peter_rabbit
          text: It does seem foolish, that's for sure. Why don't you tell Paddy what he's doing wrong? You built a splendid house of your own. You ought to be able to help him and point out his mistakes.
        - id: ch01-b15
          speaker: narrator
          text: When Peter praised his fine house, Jerry gave a very pleased little smile. But at the thought of advising Paddy, he shook his head.
        - id: ch01-b16
          speaker: jerry_muskrat
          text: I... I don't think I'd like to do that. Paddy might not take it well, you know. And it doesn't seem very polite.
        - id: ch01-b17
          speaker: narrator
          text: Peter sniffed.
        - id: ch01-b18
          speaker: peter_rabbit
          text: That wouldn't bother me if Paddy were my cousin.
        - id: ch01-b19
          speaker: narrator
          text: Jerry shook his head again.
        - id: ch01-b20
          speaker: jerry_muskrat
          text: No, I don't suppose it would bother you. But it bothers me. So... well, I think I'll wait for a while.
        - id: ch01-b21
          speaker: narrator
          text: All this time, Paddy had kept hard at work. He was bringing over the longest branches cut from the trees he had used for his dam. He also carried plenty of thin willow and alder poles. As he swam, he pushed them through the water ahead of him.
        - id: ch01-b22
          speaker: narrator
          text: Each time Paddy reached the foundation of his house, he leaned the branches and poles against the mound of mud in the middle. Their thick ends rested on the foundation below. He kept working this way all around the mound.
        - id: ch01-b23
          speaker: narrator
          text: Before long, no one could see the mud pile in the middle. Sticks covered it completely, and Paddy had cleverly fastened their tops together.
