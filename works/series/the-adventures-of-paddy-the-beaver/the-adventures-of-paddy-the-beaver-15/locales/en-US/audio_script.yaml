audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    paddy_beaver:
      display_name: Paddy the Beaver
      tts:
        delivery: good-natured and quietly confident
        timbre: sturdy and warm
        pace: unhurried
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp and hot-tempered
        timbre: harsh and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Sammy Jay Makes Paddy a Call
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Paddy the Beaver was hard at work. He had just cut down a good-sized aspen tree. Now he was gnawing it into short pieces for the food pile in his pond. But all the while, he was thinking about Old Man Coyote's footprint in that little patch of mud. The footprint meant that Coyote had found the pond. Paddy knew he would stay nearby, waiting to catch Paddy when he wasn't watching.
        - id: ch01-b02
          speaker: narrator
          text: Paddy understood that as clearly as if Coyote had told him himself. That was why Paddy was gathering food during the day. He usually worked at night, and he knew Coyote knew it too.
        - id: ch01-b03
          speaker: paddy_beaver
          text: He'll be waiting for me tonight. So I'll work on land now and trick him.
        - id: ch01-b04
          speaker: narrator
          text: The tree Paddy was cutting began to sway and crack. He gnawed out one more big chip, then hurried to a safe place. The tree came crashing down.
        - id: ch01-b05
          speaker: sammy_jay
          text: Thief! Thief! Thief!
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: The scream came from just behind Paddy.
        - id: ch01-b07
          speaker: paddy_beaver
          text: Hello, Sammy Jay. You sound just as cheerful as ever this morning. Would you like to perch in this tree while I cut it down?
        - id: ch01-b08
          speaker: narrator
          text: Sammy's face grew black with anger. He knew Paddy was making fun of him. Only a few days earlier, Sammy had been so busy calling Paddy names that he hadn't noticed Paddy cutting down the very tree where he sat. When that tree fell, Sammy had gotten a terrible fright.
        - id: ch01-b09
          speaker: sammy_jay
          text: You think you're very clever, Mr. Beaver. One of these days, you'll change your mind! If you knew what I know, you wouldn't be feeling so pleased with yourself.
          emotion: angry
        - id: ch01-b10
          speaker: paddy_beaver
          text: Oh? What do you know?
        - id: ch01-b11
          speaker: narrator
          text: Paddy made himself sound very worried.
        - id: ch01-b12
          speaker: sammy_jay
          text: I'm not telling you what I know. You'll find out soon enough. And when you do, you'll never steal another tree from our Green Forest. Someone is going to catch you, and it isn't Farmer Brown's boy!
        - id: ch01-b13
          speaker: narrator
          text: Paddy pretended to be terribly frightened.
        - id: ch01-b14
          speaker: paddy_beaver
          text: Oh, who is it? Please tell me, Mr. Jay.
        - id: ch01-b15
          speaker: narrator
          text: Being called Mr. Jay made Sammy feel very important. Almost everyone called him Sammy. He puffed himself up and tried to look as important as he felt. His eyes shone with pleasure. He was actually frightening Paddy the Beaver. At least, that was what Sammy thought.
        - id: ch01-b16
          speaker: sammy_jay
          text: No, sir, I will not tell you. I certainly wouldn't want to be in your place! Someone much smarter than you is going to catch you. When he's finished, there won't be anything left of you but a few bones. No, sir. Just a few bones!
        - id: ch01-b17
          speaker: paddy_beaver
          text: Oh, Mr. Jay, what terrible news! What can I possibly do?
        - id: ch01-b18
          speaker: narrator
          text: Even as Paddy cried out, he kept working on another tree.
        - id: ch01-b19
          speaker: sammy_jay
          text: There's nothing you can do, unless you go straight back north where you came from.
        - id: ch01-b20
          speaker: narrator
          text: Sammy gave a wicked grin at Paddy's fright.
        - id: ch01-b21
          speaker: sammy_jay
          text: You think you're so smart, but—
        - id: ch01-b22
          speaker: narrator
          text: Sammy never finished. Crack! Down came the tree Paddy had been cutting. Its top fell straight into the alder where Sammy was sitting.
        - id: ch01-b23
          speaker: sammy_jay
          text: Oh! Oh! Help!
          emotion: fearful
        - id: ch01-b24
          speaker: narrator
          text: Sammy spread his wings and flew away just in time.
        - id: ch01-b25
          speaker: narrator
          text: Paddy sat down and laughed until his sides hurt.
        - id: ch01-b26
          speaker: paddy_beaver
          text: Come and visit me again someday, Sammy! But next time, please bring some real news. I already know all about Old Man Coyote. Tell him something for me. When he plans to catch someone, he should be careful not to leave footprints that give him away.
        - id: ch01-b27
          speaker: narrator
          text: Sammy said nothing. He simply sneaked away through the Green Forest, looking every bit as foolish as he felt.
