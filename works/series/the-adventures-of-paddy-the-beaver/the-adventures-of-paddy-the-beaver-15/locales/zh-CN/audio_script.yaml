audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    paddy:
      display_name: 海狸帕迪
      tts:
        delivery: 开朗坚定，做事胸有成竹
        timbre: 结实而年轻
        pace: 轻快
        pitch: 中低音
    sammy:
      display_name: 松鸦萨米
      tts:
        delivery: 尖锐爱炫耀，得意时神气十足
        timbre: 清亮而略带刺耳
        pace: 偏快
        pitch: 高音
  chapters:
    - id: ch01
      title: 第十五章　松鸦萨米来拜访帕迪
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 海狸帕迪正忙着干活。他刚砍倒一棵挺粗的白杨树，又把树干一截截啃短，好存进池塘里的食物堆。可他干着活，心里一直想着泥地上那枚郊狼脚印。郊狼老先生已经发现了池塘，往后准会一直在附近转悠，等帕迪一不小心就扑上来。这一点，就算郊狼亲口承认，也不会更清楚了。
        - id: ch01-b02
          speaker: narrator
          text: 帕迪平常总在夜里上岸准备食物。他知道郊狼也摸清了这个习惯，准会挑那个时候守着他，所以今天特意改在白天干活。
        - id: ch01-b03
          speaker: paddy
          text: 他一定打算趁夜里抓我。那我现在就把岸上的活儿做完，让他白等一场。
        - id: ch01-b04
          speaker: narrator
          text: 那棵正在啃的树摇晃起来，树干喀喀作响。帕迪再咬下一大块木屑，赶紧躲到安全的地方。轰隆一声，树倒了。
        - id: ch01-b05
          speaker: sammy
          text: 小偷！小偷！小偷！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 尖叫声突然从帕迪身后传来。
        - id: ch01-b07
          speaker: paddy
          text: 你好啊，松鸦萨米！听这口气，你今天早上的脾气还是老样子。我砍这棵树的时候，你要不要先到树上坐一会儿？
        - id: ch01-b08
          speaker: narrator
          text: 萨米气得脸都黑了。他听得出来，帕迪是在取笑自己。你还记得几天前的事吧？那时，萨米一心只顾着骂帕迪，竟没发现帕迪啃的正是自己坐着的那棵树。大树一倒，他可受了一场不小的惊吓。
        - id: ch01-b09
          speaker: sammy
          text: 海狸先生，你别以为自己聪明得不得了。早晚有一天，你就不会这么想了！我要是把知道的事说出来，看你还得意不得意！
          emotion: angry
        - id: ch01-b10
          speaker: paddy
          text: 你到底知道什么呀？
        - id: ch01-b11
          speaker: narrator
          text: 帕迪问这话时，故意装得十分慌张。
        - id: ch01-b12
          speaker: sammy
          text: 我知道什么，才不告诉你呢。反正用不了多久，你自己就会明白。等着吧，到那时候，你再也偷不走绿森林里的一棵树！有人要来抓你，而且不是农夫布朗家的男孩！
        - id: ch01-b13
          speaker: narrator
          text: 帕迪装出吓坏了的样子，还故意央求起来。
        - id: ch01-b14
          speaker: paddy
          text: 哎呀，到底是谁？松鸦先生，求求你告诉我吧！
        - id: ch01-b15
          speaker: narrator
          text: “松鸦先生”这个称呼，让萨米觉得自己一下子变得十分重要。平常大家差不多都只叫他萨米。他把身子鼓得圆圆的，拼命想让自己显得和心里一样威风，两只眼睛也高兴得直发亮。他竟然把海狸帕迪吓着了。至少，萨米自己深信不疑。
        - id: ch01-b16
          speaker: sammy
          text: 不行，先生，我不会告诉你。给我多少好处，我也不愿意做你！那个家伙比你聪明，他很快就会抓住你。等他收拾完，地上只会剩几根骨头。听清楚了，除了几根骨头，什么也不会剩！
        - id: ch01-b17
          speaker: paddy
          text: 哎呀，松鸦先生，这可真是个吓人的消息！我到底该怎么办呢？
        - id: ch01-b18
          speaker: narrator
          text: 帕迪嘴上叫得厉害，嘴下却没停。他还在啃另一棵树。
        - id: ch01-b19
          speaker: sammy
          text: 你什么也做不了。除非你马上回到北方，回到你原来住的地方去。你总觉得自己很聪明，可是——
        - id: ch01-b20
          speaker: narrator
          text: 萨米看着帕迪害怕的样子，笑得很不怀好意。可他的话没能说完。只听喀嚓一声，帕迪一直在啃的那棵树倒了下来，树梢直冲进萨米坐着的桤木丛。
        - id: ch01-b21
          speaker: sammy
          text: 哎哟！哎哟！救命啊！
          emotion: fearful
        - id: ch01-b22
          speaker: narrator
          text: 萨米尖叫着张开翅膀，总算赶在树梢砸下来以前飞走了。帕迪坐到地上，笑得两边肋骨都疼起来。
        - id: ch01-b23
          speaker: paddy
          text: 萨米，改天再来看我呀！不过下次请带点儿真正的消息来。郊狼老先生的事，我早就知道了。你替我告诉他，想抓谁的时候可得小心，千万别留下脚印，把自己给暴露了。
        - id: ch01-b24
          speaker: narrator
          text: 萨米一句话也没回。他悄悄溜进绿森林，那模样看起来有多傻，他心里就有多难堪。
