audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: curious and plainspoken
        timbre: clear and youthful
        pace: medium
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and quietly amused
        timbre: mellow and earthy
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Empty Smiling Pool
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The day before Paddy the Beaver decided his pond was big enough and let the water flow into the Laughing Brook again, Farmer Brown's boy decided to fish in the Smiling Pool. As usual, he took his fishing rod and crossed the Green Meadows whistling. Somehow, fishing always made him feel like whistling.
        - id: ch01-b02
          speaker: narrator
          text: Grandfather Frog heard him coming. He dived into the little water left in the Smiling Pool and stirred up the mud on the bottom, so Farmer Brown's boy wouldn't see him.
        - id: ch01-b03
          speaker: narrator
          text: The whistle came closer and closer. Then it stopped all at once. Farmer Brown's boy had caught sight of the Smiling Pool, or rather, the place where the Smiling Pool used to be.
        - id: ch01-b04
          speaker: narrator
          text: There was no Smiling Pool now. The tiny bit of water left looked too small and sickly to smile. Great banks of mud lay around it, with bulrushes growing from them. The lily pads stretched sadly toward the last little pool. Along the steep banks, the holes Jerry Muskrat and Billy Mink knew so well stood open for anyone to see. Off to one side, Jerry Muskrat's house was completely out of the water.
    - id: ch02
      title: Where Was the Laughing Brook?
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Farmer Brown's boy felt as if he must be dreaming. He had never seen anything like this, even during the driest days of the hottest summer. He looked all around, one way and then the other. The Green Meadows seemed the same. The Green Forest seemed the same. Then he thought of the Laughing Brook. Why couldn't he hear it? The brook was always easy to hear, so its silence was very strange.
        - id: ch02-b02
          speaker: narrator
          text: He dropped his fishing rod and ran over to the Laughing Brook. But there was no brook. No, sir, there really wasn't. Only a few pools remained, with the tiniest trickle of water running between them.
        - id: ch02-b03
          speaker: narrator
          text: The big stones were bare and dry. He had always watched the water tumble over them in pretty little white falls. Now frightened minnows darted through the small pools between the stones.
    - id: ch03
      title: A Plan to Find the Trouble
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Farmer Brown's boy scratched his head. He couldn't make sense of it.
        - id: ch03-b02
          speaker: farmer_browns_boy
          text: I don't understand this at all. Something must be wrong with the springs that feed the Laughing Brook. Maybe they've stopped flowing. Yes, sir, that must be it. But I've never heard of that happening, and I can't see how it could.
        - id: ch03-b03
          speaker: narrator
          text: He stared into the Green Forest as though he might see the springs from there. Of course, he knew he couldn't. He was simply thinking it all through.
        - id: ch03-b04
          speaker: farmer_browns_boy
          text: I'll go to the springs this afternoon and find out what's wrong. They're almost on the far side of the Green Forest. The easiest way is to start from home, cross the Old Pasture, and go up near the foot of the Mountain behind the forest. Following the Laughing Brook would take too long because it twists and turns so much. It would be too hard, too.
    - id: ch04
      title: Jimmy Skunk Has a Laugh
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After saying that, Farmer Brown's boy went back for his fishing rod and started home across the Green Meadows. For once, he wasn't whistling. He was much too busy thinking about the missing water.
        - id: ch04-b02
          speaker: narrator
          text: In fact, he was thinking so hard that he didn't notice Jimmy Skunk until he nearly stepped on him. Farmer Brown's boy jumped in fright and ran away. Without a gun, he was just as afraid of Jimmy as Jimmy was of him when he carried one.
        - id: ch04-b03
          speaker: narrator
          text: Jimmy only grinned and went about his business. He always enjoyed seeing people run from him, especially people much bigger than he was. They looked so silly.
        - id: ch04-b04
          speaker: jimmy_skunk
          text: You'd think they'd have learned by now. If they leave me alone, I'll leave them alone.
        - id: ch04-b05
          speaker: narrator
          text: Jimmy rolled over a stone to hunt for fat beetles.
        - id: ch04-b06
          speaker: jimmy_skunk
          text: Somehow, folks never do understand me.
