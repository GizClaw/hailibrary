audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 好奇直率，思考时认真而略带困惑
        timbre: 清亮年轻
        pace: 适中
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 悠然自得，话里带着不动声色的诙谐
        timbre: 温和浑厚
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 消失的微笑池
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 海狸帕迪觉得自己的池塘已经够大，重新放水流进欢笑溪。就在这件事发生的前一天，农夫布朗家的男孩忽然想去微笑池钓鱼。他像平常一样，吹着口哨穿过绿草地。不知道为什么，只要去钓鱼，他就特别想吹口哨。
        - id: ch01-b02
          speaker: narrator
          text: 青蛙爷爷听见他来了，赶紧跳进微笑池仅剩的那一点水里，又把池底的泥搅起来。这样一来，农夫布朗家的男孩就看不见他了。
        - id: ch01-b03
          speaker: narrator
          text: 口哨声越来越近，却一下子停住了。农夫布朗家的男孩看见了微笑池。不，准确地说，他看见的是从前那个微笑池留下的地方。
        - id: ch01-b04
          speaker: narrator
          text: 现在，微笑池已经不见了。剩下的水又少又病恹恹的，再也笑不出来。大片泥滩露在四周，上面长着一丛丛香蒲。睡莲叶子没精打采地伸向最后那一小汪水。陡峭的岸边，麝鼠杰里和水貂比利熟悉的洞穴全都露了出来。杰里的屋子也彻底离开了水面，孤零零地立在一旁。
    - id: ch02
      title: 欢笑溪去了哪里
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 农夫布朗家的男孩觉得，自己一定是在做梦。就连盛夏最热、最干旱的时候，他也从没见过这样的景象。他朝两边看了又看。绿草地还是原来的样子，绿森林也没有变化。那么，欢笑溪呢？它出了什么事？怎么一点声音也听不到？这实在太反常了。
        - id: ch02-b02
          speaker: narrator
          text: 他扔下钓竿，跑到欢笑溪边。可是，溪流真的不见了。那里只剩下一处处水洼，水洼之间，只有细得不能再细的一线水还在流。
        - id: ch02-b03
          speaker: narrator
          text: 那些大石头全都裸露出来，干巴巴的。从前，溪水总会越过石头，变成一道道漂亮的小白瀑布。如今，只有受惊的小鱼苗在几处水洼里飞快地游来游去。
    - id: ch03
      title: 去寻找原因
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 农夫布朗家的男孩想不明白，只好困惑地挠了挠头。
        - id: ch03-b02
          speaker: farmer_browns_boy
          text: 我真是一点儿也不明白。一定是给欢笑溪供水的泉眼出了毛病。它们准是干涸了。对，肯定就是这样。可我从没听说泉眼会出这种事，也想不通这事怎么可能发生。
        - id: ch03-b03
          speaker: narrator
          text: 他望着绿森林深处，好像从这里就能看到那些泉眼。当然，他知道自己看不到。他只是还在心里琢磨整件事。
        - id: ch03-b04
          speaker: farmer_browns_boy
          text: 有办法了。今天下午，我就去泉眼那里看个明白。它们差不多在绿森林的另一边，远着呢。最省事的路，是从家里出发，穿过老牧场，再到绿森林后面那座大山的边缘。要是沿欢笑溪往上走，它一路弯来绕去，既费时间又费力。
    - id: ch04
      title: 吉米看了一场笑话
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 话一说完，农夫布朗家的男孩便回去捡起钓竿，穿过绿草地往家走。这一次，他居然没吹口哨。他满脑子都在想着那些消失的水。
        - id: ch04-b02
          speaker: narrator
          text: 他想得太入神了，差一点踩到臭鼬吉米，才发现吉米就在眼前。他吓得跳了起来，转身就跑。没带枪的时候，他有多怕吉米，就像带着枪的时候，吉米有多怕他。
        - id: ch04-b03
          speaker: narrator
          text: 吉米只是咧嘴一笑，接着忙自己的事。看见别人逃跑，他总觉得很有趣。要是逃跑的家伙比他大得多，那就更有趣了，因为他们跑起来实在滑稽。
        - id: ch04-b04
          speaker: jimmy_skunk
          text: 他们早该明白了吧？只要不来招惹我，我也不会去招惹他们。
        - id: ch04-b05
          speaker: narrator
          text: 吉米一边嘟囔，一边翻开一块石头，找起肥美的甲虫来。
        - id: ch04-b06
          speaker: jimmy_skunk
          text: 可不知道为什么，大伙儿就是弄不懂我。
