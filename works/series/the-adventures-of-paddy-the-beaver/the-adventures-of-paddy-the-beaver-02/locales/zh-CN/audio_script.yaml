audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二章　帕迪打算造池塘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 海狸帕迪正忙着砍树。他计划修一道坝，这些树就是筑坝的材料。
        - id: ch01-b02
          speaker: narrator
          text: 帕迪原先住在北方的树林里，后来才来到绿森林。砍树、筑坝、挖水道、盖房子，这些本领，他在那里全学会了。帕迪的爸爸妈妈在海狸世界里都很有智慧，他自己又学得快。所以现在，该做什么，怎样做最好，他心里清清楚楚。
        - id: ch01-b03
          speaker: narrator
          text: 你知道，不少人用错了方法，白白花掉时间和力气，最后只好重做一遍。他们动手以前不先把方法弄明白，只顾往下干。等发现不对，前面的工夫也就全白费了。
        - id: ch01-b04
          speaker: narrator
          text: 帕迪可不是这种人。他绝不会像青蛙爷爷那样，看也不看，就跳进四壁陡峭的泉眼里。挑选要砍的树时，他总是特别仔细。要是树倒下来才发现不合用，那先前花的时间可就浪费了。
        - id: ch01-b05
          speaker: narrator
          text: 确定一棵树正合适以后，帕迪还要抬头看看树梢。他得先弄明白，这棵树被砍倒时，会不会挂在别的树上。
        - id: ch01-b06
          speaker: narrator
          text: 这可是帕迪小时候莽撞过以后，才学到的教训。他还记得，有一回自己费了好大好大的劲，眼看就要砍倒一棵大树。他赶紧叫所有朋友躲远一点，免得被倒下来的树伤着。可是那棵树根本没倒，树梢挂在了另一棵树上。帕迪羞得不得了，好久以后才不再把这件事放在心上。
        - id: ch01-b07
          speaker: narrator
          text: 从那以后，他每次都先看准，树能不能顺顺当当地倒下，是不是正好倒向自己想要的地方。
        - id: ch01-b08
          speaker: narrator
          text: 看准以后，帕迪用后腿坐稳，把宽大的尾巴撑在身后，接着就咬得木屑四处飞扬。你知道，他那副砍树的牙齿可神奇了，又长，又宽，还特别锋利。
        - id: ch01-b09
          speaker: narrator
          text: 他先深深咬一口，再到稍低一点的地方咬一口，然后撬出两道齿痕中间的小木片。他在树的一边咬得很深，让树朝那边倒，再绕到另一边接着咬。
        - id: ch01-b10
          speaker: narrator
          text: 树刚开始歪斜，只要肯定它马上就要倒了，帕迪便飞快跑开，躲到安全的地方。他最爱看高高的树慢慢向前倾斜，越倒越快，最后轰隆一声砸在地上。
        - id: ch01-b11
          speaker: narrator
          text: 树刚倒下，帕迪就把枝杈咬掉，修成一根长杆。这活儿对他来说很轻松，挺粗的一根树枝，一口就能咬断。有些树，他会把枝叶茂密的树梢留下来。
        - id: ch01-b12
          speaker: narrator
          text: 等树木修得合心意，再截成合适的长度，他就连拖带拽，把它们运到准备筑坝的地方。
        - id: ch01-b13
          speaker: narrator
          text: 到了那里，帕迪把长杆一根挨一根地放好。他没有像架桥那样，把它们横搭在欢笑溪上，而是让粗的一头朝着上游。欢笑溪流到这里，溪面很宽，水却很浅。
        - id: ch01-b14
          speaker: narrator
          text: 为了不让长杆漂走，他把石头滚过来，又在枝叶茂密的那头堆上泥巴。他从一岸铺到另一岸，一直铺到水面开始升高。接着，他又拖来更多长杆，叠在原来的长杆上，还把短树枝横着楔进缝里。
        - id: ch01-b15
          speaker: narrator
          text: 帕迪不停地干，欢笑溪流起来也越来越费劲。它原本快活的笑声一点点低下去，到最后，几乎听不见了。没办法呀，那么多长杆和树枝堵在那里，溪水已经来不及从缝隙里流过去。
        - id: ch01-b16
          speaker: narrator
          text: 就在这时候，微笑池里的小家伙们决定，该去看看帕迪到底在做什么了。他们沿着欢笑溪往上游出发，把青蛙爷爷和蝌蚪们留在池里。接下来的一小段日子，微笑池可再也笑不出来了。
