audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    paddy:
      display_name: Paddy the Beaver
      tts:
        delivery: cheerful and determined
        timbre: sturdy and youthful
        pace: lively
        pitch: medium-low
  chapters:
    - id: ch01
      title: Paddy Plans a Pond
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Paddy the Beaver was hard at work cutting down trees for his new dam. Back in the northern woods where he had grown up, he had learned how to cut trees, build dams, dig canals, and make houses.
        - id: ch01-b02
          speaker: narrator
          text: Paddy's father and mother had been very wise as Beavers go, and Paddy had learned quickly. Now he knew exactly what to do, and he knew the best way to do it.
        - id: ch01-b03
          speaker: narrator
          text: Many people waste their time and strength by doing a job the wrong way. Then they must do it all over again. They start before making sure they are right, and by the time they discover their mistake, all their work has been wasted.
        - id: ch01-b04
          speaker: narrator
          text: Paddy wasn't like that. He would never have jumped into a steep-sided spring without looking first, the way Grandfather Frog once did. Paddy chose each tree with care. He couldn't spend time cutting one down only to find that it was no use to him.
        - id: ch01-b05
          speaker: narrator
          text: Once he had found the right tree, he studied its top. Would it fall cleanly, or would it catch in the branches around it? Paddy had learned to check when he was young and careless.
        - id: ch01-b06
          speaker: narrator
          text: He still remembered working terribly hard to cut through one big tree. He had warned all his friends to stand back so no one would be hurt when it fell. But the tree never reached the ground. Its top caught in another tree and held it there. Paddy had been so embarrassed that it took him a long time to get over it.
        - id: ch01-b07
          speaker: narrator
          text: So these days, Paddy made certain that every tree would fall clear, and that it would land where he wanted it. Then he sat upright on his hind legs. He braced himself with his great broad tail and sent the wood chips flying.
        - id: ch01-b08
          speaker: narrator
          text: Paddy has wonderful cutting teeth. They are long, broad, and sharp. First he sank them deep into the wood. Then he took another bite a little lower down and pried out the bit of wood between the two cuts.
        - id: ch01-b09
          speaker: narrator
          text: He cut far into one side so the tree would fall that way, then worked around to the other side. The moment it began to lean and Paddy knew it was coming down, he scampered to safety. How he loved watching a tall tree tip slowly forward, fall faster and faster, and strike the ground with a crash!
        - id: ch01-b10
          speaker: narrator
          text: As soon as a tree was down, Paddy trimmed away its branches until only a long pole remained. That was easy for him. One bite could take off a good-sized branch. He left the bushy tops on many of the trees. Then he cut the poles to the lengths he needed and tugged and pulled them to the place where his dam would stand.
        - id: ch01-b11
          speaker: narrator
          text: Paddy laid the poles side by side in the broad, shallow water. He didn't place them across the Laughing Brook like a bridge. Instead, the thick ends pointed upstream. He rolled stones and piled mud over the bushy ends to stop the poles from floating away.
        - id: ch01-b12
          speaker: narrator
          text: He laid poles like that all the way across, from one bank to the other. Soon the water began to rise. Paddy dragged down still more poles and stacked them on top. Between those poles, he wedged short sticks crosswise.
        - id: ch01-b13
          speaker: narrator
          text: All the while, the Laughing Brook found it harder and harder to flow. Its merry laugh became less merry, until at last it almost fell silent. The water could no longer slip through all those poles and sticks fast enough.
        - id: ch01-b14
          speaker: narrator
          text: That was when the little people of the Smiling Pool decided to find out exactly what Paddy was doing. They set off up the Laughing Brook. Only Grandfather Frog and the tadpoles stayed behind in the Smiling Pool, which, for a little while, would smile no more.
