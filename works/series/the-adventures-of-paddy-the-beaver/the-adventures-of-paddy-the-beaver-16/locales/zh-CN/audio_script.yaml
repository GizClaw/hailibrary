audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    coyote:
      display_name: 郊狼老先生
      tts:
        delivery: 狡猾自信，盘算时透着得意
        timbre: 粗粝而低沉
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十六章　郊狼老先生诡计多端
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 郊狼脑袋精又灵，为达目的计谋多。
        - id: ch01-b02
          speaker: narrator
          text: 这话一点儿也不假。绿森林和绿草地的小居民里，郊狼老先生的脑袋最会盘算。老狐狸奶奶已经够机灵了，可还是比他差一点儿。谁想骗过他，就得天不亮便早早起床。即便这样，最后上当的多半也是自己，不是郊狼。
        - id: ch01-b03
          speaker: narrator
          text: 周围有什么动静，很少能逃过他的眼睛。不过偶尔也会有事情从他眼皮底下溜过去。海狸帕迪来到绿森林，就是他没察觉的事。等郊狼听说帕迪时，帕迪早已筑好水坝和房子，正忙着砍过冬的食物了。
        - id: ch01-b04
          speaker: narrator
          text: 事情是这样的。西风妈妈家的快乐小微风一听见绿森林里的新鲜事，就照老习惯跑遍绿草地和绿森林，把消息传给大家。唯独碰上郊狼老先生，她们连一点儿口风也不肯露。她们怕郊狼惹麻烦，甚至把帕迪赶走。
        - id: ch01-b05
          speaker: narrator
          text: 帕迪筑坝的地方又藏在绿森林深处，郊狼很少到那里去。因此好一阵子，郊狼不知道帕迪，帕迪也不知道郊狼。
        - id: ch01-b06
          speaker: narrator
          text: 后来，郊狼老先生发现，绿草地上的小居民不像平常那样常常露面了。他们仿佛共同藏着一个秘密。郊狼便把这件事告诉了朋友獾迪格。
        - id: ch01-b07
          speaker: narrator
          text: 迪格一直专心忙自己的事，原本什么异样也没留意。听郊狼一说，他才想起来，乌鸦布莱基每天早晨都直奔绿森林。他还见过好几次，松鸦萨米也匆匆飞向同一个地方，像是急着去赶什么热闹。
        - id: ch01-b08
          speaker: narrator
          text: 郊狼老先生听完，咧嘴笑了。
        - id: ch01-b09
          speaker: coyote
          text: 朋友迪格，这些就够我弄明白了。只要布莱基和萨米接连往一个地方跑，那里准有有意思的事情。我要去绿森林里走一趟，好好看看。
        - id: ch01-b10
          speaker: narrator
          text: 说完，郊狼便出发了。不过，他实在又狡猾又有心计，绝不会径直走向绿森林。那样太容易叫人看出目的。他装作和平常一样，在绿草地上四处找猎物，暗地里却越挪越靠近森林。
        - id: ch01-b11
          speaker: narrator
          text: 到了森林边缘，他悄悄钻进树丛。等到四周没人会看见，郊狼就把鼻子贴近地面，东一头西一头地跑起来。
        - id: ch01-b12
          speaker: coyote
          text: 哈！狐狸雷迪最近来过这里。
        - id: ch01-b13
          speaker: narrator
          text: 没过多久，他又找到一道足迹。
        - id: ch01-b14
          speaker: coyote
          text: 原来兔子彼得最近常来这里。他和雷迪的足迹都通往同一个方向。好啦，我只要跟着彼得走过的路，就能找出大家瞒着我的秘密。
        - id: ch01-b15
          speaker: narrator
          text: 郊狼一路循着彼得的足迹，很快来到海狸帕迪的池塘边。他望向水面，看见了帕迪的新房子。
        - id: ch01-b16
          speaker: coyote
          text: 哈！原来绿森林里住进了一个新家伙！大家都说海狸的肉非常好吃。奇怪，我的肚子怎么偏偏现在空起来了？
        - id: ch01-b17
          speaker: narrator
          text: 郊狼馋得口水直流，两只眼睛里也亮起凶狠的饿光。
        - id: ch01-b18
          speaker: narrator
          text: 偏偏就在这时，松鸦萨米看见了他。萨米立刻扯开嗓门大叫，声音大得连房子里的海狸帕迪都听见了。郊狼明白，只要萨米守在这里，自己再待下去也没用。
        - id: ch01-b19
          speaker: narrator
          text: 他赶紧扫了一眼池塘，找出帕迪上岸砍食物的地方。随后，郊狼朝萨米挥了挥拳头，转身径直回绿草地去了。
        - id: ch01-b20
          speaker: coyote
          text: 我等夜里再来拜访。趁海狸先生忙着干活，正好给他一个惊喜。
        - id: ch01-b21
          speaker: narrator
          text: 可郊狼老先生再会算计，也没发现自己在泥地里留下了一枚脚印。
