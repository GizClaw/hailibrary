audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_man_coyote:
      display_name: Old Man Coyote
      tts:
        delivery: sly and watchful, sharpening with hunger
        timbre: dry and wiry
        pace: deliberate
        pitch: medium-low
  chapters:
    - id: ch01
      title: Old Man Coyote is Very Crafty
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Coyote has a crafty brain. His wits are sharp when there's something he wants to gain.
        - id: ch01-b02
          speaker: narrator
          text: Nothing could be more true. Of all the little people in the Green Forest and on the Green Meadows, Old Man Coyote has the craftiest mind. Granny Fox is very clever, but even her wits are not quite as sharp as his. If you hope to fool him, you had better rise very early. Even then, you will probably be the one who gets fooled.
        - id: ch01-b03
          speaker: narrator
          text: Very little happens around Old Man Coyote without his knowing. Once in a while, though, something gets past him. Paddy the Beaver's arrival in the Green Forest did just that. Old Man Coyote knew nothing about Paddy until the dam and house were finished and Paddy had begun cutting food for the winter.
        - id: ch01-b04
          speaker: narrator
          text: This was how it happened. When the Merry Little Breezes of Old Mother West Wind heard the news, they hurried across the Green Meadows and through the Green Forest to spread it, just as they always did. But they took great care not to give Old Man Coyote even the smallest hint. They feared he would cause trouble and might drive Paddy away.
        - id: ch01-b05
          speaker: narrator
          text: Paddy had chosen a place deep in the Green Forest for his dam, and Old Man Coyote seldom went there. So for a while, Old Man Coyote knew nothing about Paddy, and Paddy knew nothing about him.
        - id: ch01-b06
          speaker: narrator
          text: After some time, Old Man Coyote noticed that the little people of the Green Meadows were not around as often as usual. It looked as though they shared some kind of secret. He spoke about it to his friend Digger the Badger.
        - id: ch01-b07
          speaker: narrator
          text: Digger had been too busy with his own affairs to notice anything strange. But once Old Man Coyote brought it up, Digger remembered seeing Blacky the Crow fly straight toward the Green Forest every morning. He had also seen Sammy Jay hurry the same way several times, as if he were eager to reach some place.
        - id: ch01-b08
          speaker: narrator
          text: Old Man Coyote grinned.
        - id: ch01-b09
          speaker: old_man_coyote
          text: That's all I needed to hear, friend Digger. When Blacky the Crow and Sammy Jay keep visiting the same place, there must be something interesting there. I believe I'll stroll through the Green Forest and look around.
        - id: ch01-b10
          speaker: narrator
          text: Off he went. But Old Man Coyote was far too sly to head straight for the Green Forest. Instead, he pretended to hunt across the Green Meadows as he usually did, while slowly working closer and closer to the trees.
        - id: ch01-b11
          speaker: narrator
          text: At the forest's edge, he slipped among the trees. Once he felt sure no one was likely to see him, he began running this way and that with his nose close to the ground.
        - id: ch01-b12
          speaker: old_man_coyote
          text: Ha! Reddy Fox passed this way not long ago.
        - id: ch01-b13
          speaker: narrator
          text: Before long, he discovered another trail.
        - id: ch01-b14
          speaker: old_man_coyote
          text: Well, well. Peter Rabbit has been coming here often lately, and his tracks lead the same way as Reddy Fox's. Now I only need to follow Peter's trail. It should take me straight to the secret.
        - id: ch01-b15
          speaker: narrator
          text: Old Man Coyote followed Peter's tracks and soon reached Paddy the Beaver's pond. He looked across the water and saw Paddy's new house.
        - id: ch01-b16
          speaker: old_man_coyote
          text: Ha! So the Green Forest has a newcomer. I've always heard that Beaver makes very good eating. Why, my stomach feels empty already.
        - id: ch01-b17
          speaker: narrator
          text: His mouth began to water, and his eyes shone with a fierce, hungry look.
        - id: ch01-b18
          speaker: narrator
          text: Just then, Sammy Jay spotted him and screamed as loudly as he could. Paddy heard the warning all the way from inside his house. Old Man Coyote knew there was no point in staying while Sammy was there, so he took one quick look over the pond. He found the place where Paddy climbed ashore to cut his food.
        - id: ch01-b19
          speaker: narrator
          text: Then Old Man Coyote shook his fist at Sammy Jay and headed straight back toward the Green Meadows.
        - id: ch01-b20
          speaker: old_man_coyote
          text: I'll come back after dark. Then I'll surprise Mr. Beaver while he's busy at work.
        - id: ch01-b21
          speaker: narrator
          text: But for all his craftiness, Old Man Coyote never saw the footprint he had left behind in the mud.
