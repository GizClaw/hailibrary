audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 好奇直率，思考时认真而略带困惑
        timbre: 清亮年轻
        pace: 适中
        pitch: 中音
    bowser:
      display_name: 猎犬鲍泽
      tts:
        delivery: 忠实活泼，叫声洪亮而有冲劲
        timbre: 浑厚有力
        pace: 稍快
        pitch: 中低音
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 机灵健谈，语气爽快而爱发表意见
        timbre: 明亮清脆
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 水坝留下的谜
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 农夫布朗家的男孩坐在新池塘边，双手托着下巴，眼睛一直盯着那道拦出池塘的水坝。他怎么也想不通。究竟是谁筑了坝？为什么要筑？砍树的时候，他又怎么会一点儿声音都没听见？
        - id: ch01-b02
          speaker: narrator
          text: 他随意看了看一截树桩，眉头立刻皱得更紧了。那棵树看起来不像是斧头砍倒的，倒像是被牙齿咬断的。他张大嘴巴，盯着树桩看个不停。躲在附近旧枯枝堆底下的兔子彼得瞧见他那副滑稽模样，差点儿就笑出了声。
        - id: ch01-b03
          speaker: narrator
          text: 可彼得没有笑。不，先生，他一点儿也没笑。偏偏就在这时，身后的枯枝堆边传来两声嗅鼻子的动静。彼得听得清清楚楚，吓得全身的毛一下子都竖了起来。
        - id: ch01-b04
          speaker: bowser
          text: 汪！汪！汪！
        - id: ch01-b05
          speaker: narrator
          text: 这洪亮的叫声仿佛就在彼得耳朵边炸开，吓得他顾不上想，猛地从枯枝堆底下蹿了出去。这一来，他整个儿暴露在外面。刚蹿出去，身后又是一声大吼。原来，猎犬鲍泽一路跟着主人的踪迹，却因为逢着什么都要停下嗅嗅，远远落在了后头。他来到枯枝堆旁一闻，马上就发现彼得藏在这里。
    - id: ch02
      title: 慌乱的水坝之路
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得这一蹿，正好落在水坝的一头。鲍泽第二次大叫，把他吓得直接跳上了坝。现在他只能从水坝上逃到对岸，可脚下根本不是一条好走的路。水坝大半是横七竖八、缠在一起的树枝。
        - id: ch02-b02
          speaker: narrator
          text: 要是松鼠快乐杰克、红松鼠喋喋不休，或是花栗鼠条纹，准能轻轻松松地蹦过去。彼得却没有尖利的小爪子，没法牢牢抓住圆木和树枝，立刻就吃了苦头。他滑进树枝缝里，慌忙爬上来，又一次滑了下去。最后，他想使劲跳远一点儿，身子却失去了平衡，头朝下、脚朝上，一骨碌栽进水里。
        - id: ch02-b03
          speaker: narrator
          text: 可怜的彼得以为自己这回死定了。他虽然会游泳，水性却很差，而且一点儿也不喜欢水。他不能像麝鼠杰里或水貂比利那样潜下去躲起来，只能让四条腿拼命划。池水灌进他的鼻子，又呛进喉咙，害得他不停咳嗽。
        - id: ch02-b04
          speaker: narrator
          text: 彼得一边游，一边认定鲍泽马上会扑进水里追他，再一口把他捉住。就算鲍泽不来，农夫布朗家的男孩也会守在岸边，等他爬上去的时候抓住他。
    - id: ch03
      title: 一场公平的追逐
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可农夫布朗家的男孩根本没这么做。不，先生，他没有。他反而高声叫住鲍泽，把它从岸边唤了回来。鲍泽很不情愿，可它早就学会要听主人的话，只好一步一磨蹭，慢慢走到主人坐着的地方。
        - id: ch03-b02
          speaker: farmer_browns_boy
          text: 老伙计，你明白的，趁彼得掉在水里的时候去抓他，那可不公平。咱们绝不会做不公平的事，对吧？
        - id: ch03-b03
          speaker: narrator
          text: 鲍泽心里也许并不同意，可它还是摇了摇尾巴，仿佛是在表示赞成。接着，它在主人身边坐下来，看着彼得继续往前游。
    - id: ch04
      title: 彼得游上了岸
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 彼得觉得那岸边远得不得了，自己好像永远、永远也游不到。其实，他要游的不过是短短一段。好不容易挣扎着爬上岸，他的样子别提有多狼狈了。
        - id: ch04-b02
          speaker: narrator
          text: 彼得一刻也不敢停，立刻一蹦一跳、一蹦一跳地飞奔回家。农夫布朗家的男孩和猎犬鲍泽只是在后面笑，完全没有追上去抓他。
        - id: ch04-b03
          speaker: narrator
          text: 冠蓝鸦萨米站在一棵松树顶上，从头到尾看见了这一切。
        - id: ch04-b04
          speaker: sammy_jay
          text: 嘿，我可真没想到！真没想到！这么看，农夫布朗家的男孩也不算太坏嘛。
          emotion: surprised
