audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: thoughtful and good-natured
        timbre: clear and boyish
        pace: conversational
        pitch: medium
    bowser:
      display_name: Bowser the Hound
      tts:
        delivery: eager and booming
        timbre: deep and full
        pace: deliberate
        pitch: low
    sammy:
      display_name: Sammy Jay
      tts:
        delivery: sharp and animated
        timbre: bright and slightly nasal
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: Peter Rabbit Gets a Ducking
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Farmer Brown's boy sat with his chin resting in his hands. He stared at the new pond in the Green Forest, then at the dam that had made it. He couldn't understand that dam at all. Who had built it? What was it for? And why hadn't he heard anyone chopping down the trees?
        - id: ch01-b02
          speaker: narrator
          text: He glanced at one of the stumps. Then the furrows between his eyes grew even deeper. That tree looked as though it had been cut by teeth, not by an axe. Farmer Brown's boy stared with his mouth hanging open. Peter Rabbit was hiding under an old brush pile nearby, and the boy looked so funny that Peter nearly burst out laughing.
        - id: ch01-b03
          speaker: narrator
          text: But Peter didn't laugh. Just then, he heard something sniffing right behind him at the edge of the brush pile. Every hair on Peter stood straight up with fright.
        - id: ch01-b04
          speaker: bowser
          text: Bow, wow, wow!
        - id: ch01-b05
          speaker: narrator
          text: To Peter, that great voice seemed to sound right inside his ears. It frightened him so badly that he jumped before he could think. Out he sprang from beneath the brush pile, straight into plain sight. At once another mighty roar came from behind him.
        - id: ch01-b06
          speaker: narrator
          text: Of course, the voice belonged to Bowser the Hound. Bowser had been following his master's trail. But Bowser always stopped to sniff everything he passed, so he had fallen some distance behind. When he reached the brush pile where Peter was hiding, he stopped to sniff it too. Naturally, he smelled Peter at once.
        - id: ch01-b07
          speaker: narrator
          text: When Peter leaped out, he landed at one end of the dam. Bowser's second roar scared him even more, and Peter jumped right up onto the dam. Now there was nowhere for him to go but across.
        - id: ch01-b08
          speaker: narrator
          text: Crossing that dam was anything but easy. Most of it was a tangled heap of sticks. Happy Jack Squirrel, Chatterer the Red Squirrel, or Striped Chipmunk could have skipped over it without any trouble. Peter Rabbit couldn't. He had no little sharp claws for clinging to logs and sticks, and he was in trouble almost at once.
        - id: ch01-b09
          speaker: narrator
          text: Peter slipped down between the sticks and scrambled back out. Then he slipped again. He tried one long jump, lost his balance, and tumbled heels over head into the water.
        - id: ch01-b10
          speaker: narrator
          text: Poor Peter Rabbit! This time, he was sure he was lost. Peter could swim, but not very well, and he hated being in the water. He couldn't dive out of sight the way Jerry Muskrat or Billy Mink could. His only chance was to paddle as fast as his legs could move.
        - id: ch01-b11
          speaker: narrator
          text: Water had rushed up Peter's nose and down his throat, and he choked as he swam. All the while, he expected Bowser to plunge in after him and catch him. And if Bowser stayed on shore, Peter was certain Farmer Brown's boy would wait there and grab him as soon as he climbed out.
        - id: ch01-b12
          speaker: narrator
          text: But Farmer Brown's boy did nothing of the kind. Instead, he called Bowser away from the water. Bowser didn't want to come. Still, he had learned long ago that he must obey. Very slowly, he walked over to the place where his master was sitting.
        - id: ch01-b13
          speaker: farmer_browns_boy
          text: It wouldn't be fair to catch Peter now, old fellow. That wouldn't be fair at all. And we don't want to do anything unfair, do we?
        - id: ch01-b14
          speaker: narrator
          text: Bowser might not have agreed. Even so, he wagged his tail as if he did. Then he sat beside his master, and together they watched Peter swim.
        - id: ch01-b15
          speaker: narrator
          text: To Peter, it seemed as if he would never reach the shore. In truth, he had only a very short distance to swim. At last he scrambled out, looking like the sorriest Rabbit you ever saw.
        - id: ch01-b16
          speaker: narrator
          text: Peter didn't waste a second. He raced for home as fast as he could go, lipperty-lipperty-lip. Farmer Brown's boy and Bowser the Hound only laughed. They didn't try to catch him at all.
        - id: ch01-b17
          speaker: narrator
          text: Sammy Jay had watched everything from the top of a pine tree.
        - id: ch01-b18
          speaker: sammy
          text: Well, I never! I truly never did! Maybe Farmer Brown's boy isn't so bad after all.
          emotion: surprised
