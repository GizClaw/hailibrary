audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    coyote:
      display_name: 郊狼老先生
      tts:
        delivery: 狡猾自信，盘算时透着得意
        timbre: 粗粝而低沉
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十七章　郊狼老先生失望了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 郊狼老先生伸开四肢，舒舒服服地躺在绿草地上。那是他最喜欢打盹的地方。此刻，他满脑子都是早晨在绿森林里发现的事。原来，海狸帕迪就住在那里。
        - id: ch01-b02
          speaker: narrator
          text: 郊狼越想越开心，可他打的主意实在可怕。他觉得抓住帕迪轻而易举，还想着海狸肉一定能让自己饱餐一顿。馋到这里，他忍不住舔了舔嘴。
        - id: ch01-b03
          speaker: coyote
          text: 帕迪还不知道，我已经晓得他住在这里。说不定他连我就在附近都不知道，当然不会防着我。
        - id: ch01-b04
          speaker: coyote
          text: 他总在夜里砍树。我只要藏在他干活的地方旁边，等他自己走进我嘴里就行。萨米虽说见过我早晨来这里，可他夜里要睡觉，没法给帕迪报警。
        - id: ch01-b05
          speaker: coyote
          text: 哎呀呀，这只海狸吃起来一定香极了！
          emotion: happy
        - id: ch01-b06
          speaker: narrator
          text: 郊狼又舔了一回嘴，打个哈欠，闭上眼睛睡午觉去了。
        - id: ch01-b07
          speaker: narrator
          text: 他一直等到红彤彤的圆太阳公公落到紫山背后，黑影也爬过绿草地，这才动身。郊狼专挑最黑的影子走，自己瞧着也像一道影子，悄悄溜进绿森林。
        - id: ch01-b08
          speaker: narrator
          text: 林子里一片漆黑。他飞快地直奔帕迪的新池塘，脚下没有一点儿声音。快到那片白杨时，郊狼知道帕迪准备来砍这些树，便慢下来，小心地往前挪。四周静得一丝动静也没有。
        - id: ch01-b09
          speaker: coyote
          text: 好极了！我先到了。现在只要藏好，等帕迪上岸就行。
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: 郊狼紧贴地面，伏在一片矮树丛后面。这里就在帕迪从水边踩出的小路旁。他藏好以后，开始等。
        - id: ch01-b11
          speaker: narrator
          text: 夜里静得出奇，郊狼仿佛能听见自己的心跳。天上的小星星闪呀闪，池水里的倒影也闪呀闪，像在回望它们。
        - id: ch01-b12
          speaker: narrator
          text: 郊狼等了又等。只要能捞到好处，他一向很有耐心。何况海狸帕迪能做成那么丰盛的一顿晚餐，再等一等当然值得。
        - id: ch01-b13
          speaker: narrator
          text: 他继续等啊等。四下里一直没有声音，好像除了树木，再没有一个活物。就连树也像睡着了。
        - id: ch01-b14
          speaker: narrator
          text: 过了很久很久，终于传来一声几乎听不见的水响。郊狼马上竖起耳朵，从藏身处望向池塘。那双黄眼睛里满是贪馋。
        - id: ch01-b15
          speaker: narrator
          text: 水面上出现了一道细细的银线，笔直地向他靠近。郊狼知道，那是帕迪游水划出的波纹。银线越来越近，他在肚子里偷偷发笑，却没漏出半点声音。
        - id: ch01-b16
          speaker: narrator
          text: 现在，郊狼已经看见帕迪的脑袋了。帕迪径直往岸边游来，好像这世上根本没有什么值得害怕。
        - id: ch01-b17
          speaker: narrator
          text: 帕迪眼看就要游到池塘边，却忽然停住。过了一会儿，他又动起来，可这次却转身朝自己的房子游去，身边似乎还带着什么。
        - id: ch01-b18
          speaker: narrator
          text: 那是帕迪白天砍下的一根食物木段。他正把木段运往储藏食物的地方。送到以后，帕迪又游回来搬另一根。他就这样来来回回，一次也没有上岸。
        - id: ch01-b19
          speaker: narrator
          text: 郊狼苦苦等着，直到帕迪把最后一根木头也送进储藏处。随后，帕迪用宽尾巴“啪”地猛拍水面，一头潜下去，消失在自己的房子里。
        - id: ch01-b20
          speaker: narrator
          text: 郊狼老先生只好站起身，到别处寻找晚餐。他心里别提有多失望了。
