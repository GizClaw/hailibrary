audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_man_coyote:
      display_name: Old Man Coyote
      tts:
        delivery: sly and self-satisfied
        timbre: rough and lean
        pace: deliberate
        pitch: medium-low
  chapters:
    - id: ch01
      title: Old Man Coyote Is Disappointed
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Man Coyote lay stretched out in his favorite napping place on the Green Meadows. He was thinking about what he had discovered in the Green Forest that morning. Paddy the Beaver was living there.
        - id: ch01-b02
          speaker: narrator
          text: To Old Man Coyote, his thoughts were very pleasant. In truth, they were dreadful. He expected Paddy to be easy to catch, and he imagined what a splendid meal that Beaver would make. Just thinking about it made him lick his chops.
        - id: ch01-b03
          speaker: old_man_coyote
          text: Paddy doesn't know I've found him. Why, I don't believe he even knows I'm anywhere nearby. He won't be watching for me at all.
        - id: ch01-b04
          speaker: old_man_coyote
          text: He cuts his trees at night. All I have to do is hide close to where he's working, and he'll walk straight into my mouth. Sammy Jay saw me up there this morning, but Sammy sleeps at night. He won't be there to warn Paddy.
        - id: ch01-b05
          speaker: old_man_coyote
          text: My, my! That Beaver is going to taste good!
          emotion: happy
        - id: ch01-b06
          speaker: narrator
          text: Old Man Coyote licked his chops again. Then he yawned, closed his eyes, and took a nap.
        - id: ch01-b07
          speaker: narrator
          text: He waited until jolly, round, red Mr. Sun had gone to bed behind the Purple Hills. By then, the Black Shadows had crept across the Green Meadows. Old Man Coyote kept to the darkest shadows. Looking almost like a shadow himself, he slipped into the Green Forest.
        - id: ch01-b08
          speaker: narrator
          text: It was dark among the trees. He headed straight for Paddy's new pond, trotting quickly without a sound. When he came near the aspen trees Paddy meant to cut, he slowed down and crept ahead with great care. Everything was perfectly still.
        - id: ch01-b09
          speaker: old_man_coyote
          text: Good! I've arrived first. Now I only need to hide and wait for Paddy to come out of the water.
        - id: ch01-b10
          speaker: narrator
          text: He lay flat behind some brush beside the little path Paddy had made from the water's edge. Then he settled down to wait.
        - id: ch01-b11
          speaker: narrator
          text: The night was so still that Old Man Coyote could almost hear his own heart beating. Above him, little stars twinkled in the sky. Their reflections twinkled back from the water of Paddy's pond.
        - id: ch01-b12
          speaker: narrator
          text: He waited and waited. Old Man Coyote can be very patient when patience may win him something. For a dinner as splendid as Paddy would make, he felt he could wait as long as necessary.
        - id: ch01-b13
          speaker: narrator
          text: So he kept waiting. Nothing stirred. It seemed as though the trees were the only living things there, and even they appeared to be asleep.
        - id: ch01-b14
          speaker: narrator
          text: At last, after a long, long time, he heard the faintest splash. His ears sprang up. He peered across the pond, and his yellow eyes were full of hunger.
        - id: ch01-b15
          speaker: narrator
          text: A thin silver line was moving straight toward him. Old Man Coyote knew Paddy the Beaver made that line as he swam. It came nearer and nearer. Old Man Coyote chuckled deep inside, but he never made a sound.
        - id: ch01-b16
          speaker: narrator
          text: Soon he could see Paddy's head. Paddy was coming straight toward shore as though he had nothing in the world to fear.
        - id: ch01-b17
          speaker: narrator
          text: Paddy swam almost to the edge of the pond. Then he stopped. A few minutes later, he began swimming again, but now he was headed back toward his house. He seemed to be carrying something.
        - id: ch01-b18
          speaker: narrator
          text: It was one of the little food logs Paddy had cut that day. He was taking it out to his storehouse. Then he returned for another. Back and forth he went, but not once did he climb onto the bank.
        - id: ch01-b19
          speaker: narrator
          text: Old Man Coyote waited until Paddy had carried the final log to his storehouse. Then Paddy struck the water with his broad tail. Whack! He dived and disappeared inside his house.
        - id: ch01-b20
          speaker: narrator
          text: Old Man Coyote got up and went somewhere else to hunt for his dinner.
        - id: ch01-b21
          speaker: narrator
          text: Deep in his heart, he was bitterly disappointed.
