audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    paddy:
      display_name: 海狸帕迪
      tts:
        delivery: 快活坚定，做事干脆利落
        timbre: 结实而年轻
        pace: 轻快
        pitch: 中低音
    jerry:
      display_name: 麝鼠杰里
      tts:
        delivery: 直爽热心，说话干脆
        timbre: 温厚清晰
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十章　帕迪动手盖房子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 麝鼠杰里听说表哥海狸帕迪要盖房子，马上来了兴致。杰里自己也会盖房，而且心里有点儿不服气。他不大相信，帕迪能把房子盖得跟自己的一样好。
        - id: ch01-b02
          speaker: narrator
          text: 杰里的家就在微笑池里。那座房子是用泥巴、草皮、赤杨和柳树的细枝，还有香蒲造的。杰里觉得它好极了，一提起来就很自豪。他已经在那里过了一个冬天，只要稍微修整一下，还打算再住上一冬。
        - id: ch01-b03
          speaker: narrator
          text: 既然不用另盖新家，杰里有的是时间看帕迪干活。也许，他还暗暗等着表哥来请自己出主意呢。
        - id: ch01-b04
          speaker: narrator
          text: 可帕迪根本没来请教。他见过杰里的房子，还偷偷笑过。不过帕迪很有礼貌，脾气也好，绝不愿叫杰里看见那个笑容，伤了表弟的心。
        - id: ch01-b05
          speaker: narrator
          text: 杰里坐在一根老木头的一端，看着帕迪开工。第一步是打地基。帕迪把泥巴和草堆在一起，再往里面掺进树枝，让地基连得结结实实。
        - id: ch01-b06
          speaker: narrator
          text: 泥巴是从新池塘底下挖来的。因为池塘才刚形成，水底还铺着很多带草的泥块。那正合帕迪的需要，取起来又方便极了。
        - id: ch01-b07
          speaker: narrator
          text: 杰里看了一阵，再也坐不住了。他本来就是个爱干活的家伙，于是有些不好意思地对大表哥说，自己也想帮着盖新房。
        - id: ch01-b08
          speaker: paddy
          text: 好啊，那可太好了。我去找树枝和草，你来运泥巴吧。
        - id: ch01-b09
          speaker: narrator
          text: 杰里潜到池塘底下，挖出一捧捧泥巴，垒到地基上。他干得十分开心。小星星在高处望着两个忙碌的家伙，快活地眨着眼睛。
        - id: ch01-b10
          speaker: narrator
          text: 水面下面，地基越筑越大。杰里越看越吃惊，这地基比自家的大了不知多少。原来，他忘记帕迪的个头也比自己大得多了。
        - id: ch01-b11
          speaker: narrator
          text: 就这样，帕迪和杰里每晚干活，白天休息。浣熊博比、狐狸雷迪、负鼠比利大叔和臭鼬吉米偶尔会到池边看看。兔子彼得更是一个晚上也不落下。
        - id: ch01-b12
          speaker: narrator
          text: 可惜，他们看不见多少，因为帕迪和杰里一直在水底忙活。
        - id: ch01-b13
          speaker: narrator
          text: 彼得耐心等了这么久，终于有了收获。水面上方露出一座美观又结实的平台，是用泥巴、草和树枝筑成的。
        - id: ch01-b14
          speaker: narrator
          text: 平台刚露出水面，帕迪就在上面仔细铺了许多树枝。这一步，他半点儿也不肯马虎，因为这里将是那间漂亮屋子的地板，而屋子要怎么盖，他早就在心里盘算好了。
        - id: ch01-b15
          speaker: narrator
          text: 等地板铺到自己满意，帕迪又把泥巴一堆堆放在正中央。
        - id: ch01-b16
          speaker: narrator
          text: 杰里怎么想也想不通。泥巴都堆在中间了，房间还能盖在哪儿呢？他不好意思开口问，只好接着帮忙。
        - id: ch01-b17
          speaker: narrator
          text: 帕迪一次次潜到水底，用两只前掌捧着泥巴浮上来，把泥紧紧抱在胸前。他爬上平台，摇摇摆摆地走到中央，放下泥巴，拍打结实，再回到水底取下一捧。
        - id: ch01-b18
          speaker: narrator
          text: 那堆泥巴就这样越垒越高，最后足足有两英尺高。
        - id: ch01-b19
          speaker: paddy
          text: 好了，现在该砌墙了。这活儿你恐怕帮不上多少忙。我明晚开始砌。杰里表弟，你要不要来看看我怎么做？
        - id: ch01-b20
          speaker: jerry
          text: 那当然，我一定来看。
        - id: ch01-b21
          speaker: narrator
          text: 杰里嘴上答应着，心里还在琢磨，平台中央那一大堆泥巴到底有什么用。
