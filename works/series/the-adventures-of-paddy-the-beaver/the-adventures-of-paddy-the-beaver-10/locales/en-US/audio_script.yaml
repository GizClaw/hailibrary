audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jerry_muskrat:
      display_name: Jerry Muskrat
      tts:
        delivery: eager and a little self-important
        timbre: light and lively
        pace: medium
        pitch: medium-high
    paddy_beaver:
      display_name: Paddy the Beaver
      tts:
        delivery: good-natured and quietly confident
        timbre: sturdy and warm
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Paddy Starts His House
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jerry Muskrat became very interested when he learned that his cousin Paddy the Beaver was building a house. Jerry built houses too, and deep down, he doubted Paddy could build one as good as his.
        - id: ch01-b02
          speaker: narrator
          text: Jerry's house stood in the Smiling Pool. He thought it was wonderful, and he was very proud of it. He had made it from mud, sod, little alder and willow twigs, and bulrushes. After spending one winter there, he planned to stay another. The house only needed a little fixing up.
        - id: ch01-b03
          speaker: narrator
          text: Since Jerry didn't have to build a whole new house, he had plenty of time to watch Paddy. Perhaps he hoped his cousin would ask for advice.
        - id: ch01-b04
          speaker: narrator
          text: But Paddy never did. He had seen Jerry's house, and it had made him smile. Still, he was careful not to let Jerry notice. Paddy was far too polite and good-natured to hurt his cousin's feelings.
        - id: ch01-b05
          speaker: narrator
          text: So Jerry perched on the end of an old log and watched Paddy work. Paddy began with the foundation. He mixed mud and grass, then worked sticks through it to hold everything together.
        - id: ch01-b06
          speaker: narrator
          text: Paddy dug the mud from the bottom of his new pond. Because the pond had only just been made, there was plenty of grassy sod down there too. It was exactly what he needed, and very handy.
        - id: ch01-b07
          speaker: narrator
          text: Jerry watched for a while. But Jerry was a worker himself, and before long he simply had to help. A little timidly, he told his big cousin that he wanted a part in building the new house.
        - id: ch01-b08
          speaker: paddy_beaver
          text: All right. That'll be fine. You bring the mud while I gather the sticks and grass.
        - id: ch01-b09
          speaker: narrator
          text: Jerry dived to the pond bottom, dug up mud, and piled it onto the foundation. He was happy at his work. Above them, the little stars looked down and twinkled merrily as the two cousins worked.
        - id: ch01-b10
          speaker: narrator
          text: Under the water, the foundation grew and grew. Its size surprised Jerry. It was ever so much bigger than the foundation of his own house. He had forgotten just how much bigger Paddy was.
        - id: ch01-b11
          speaker: narrator
          text: Paddy and Jerry worked each night and rested during the day. Now and then, Bobby Coon, Reddy Fox, Unc' Billy Possum, or Jimmy Skunk came to the pond's edge to see what was happening. Peter Rabbit came every single night.
        - id: ch01-b12
          speaker: narrator
          text: None of them could see very much, because Paddy and Jerry were working beneath the water.
        - id: ch01-b13
          speaker: narrator
          text: At last, Peter's patience was rewarded. Just above the water stood a splendid platform made of mud, grass, and sticks.
        - id: ch01-b14
          speaker: narrator
          text: As soon as the platform rose above the surface, Paddy carefully laid down a great many sticks. He was very particular about this part. That platform would be the floor of the splendid room he meant to build.
        - id: ch01-b15
          speaker: narrator
          text: When the floor suited him, Paddy began heaping mud right in the middle.
        - id: ch01-b16
          speaker: narrator
          text: Jerry puzzled and puzzled over that. If Paddy piled mud there, where could the room possibly go? Jerry didn't like to ask, though, so he went on helping.
        - id: ch01-b17
          speaker: narrator
          text: Paddy dived to the bottom and came up carrying two handfuls of mud against his chest. He scrambled onto the platform, waddled to the heap in the center, and pressed the mud firmly into place. Then down he went for another load.
        - id: ch01-b18
          speaker: narrator
          text: The pile kept growing until it stood a full two feet high.
        - id: ch01-b19
          speaker: paddy_beaver
          text: Now I'll start on the walls. I don't think you'll be able to help me much with those. I'll begin tomorrow night. Maybe you'd like to watch me do it, Cousin Jerry.
        - id: ch01-b20
          speaker: jerry_muskrat
          text: I certainly would.
        - id: ch01-b21
          speaker: narrator
          text: Jerry was still trying to make sense of that pile of mud in the middle.
