audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_man_coyote:
      display_name: Old Man Coyote
      tts:
        delivery: sly and calculating, turning sharp when angry
        timbre: rough and lean
        pace: deliberate
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp and hot-tempered
        timbre: harsh and piercing
        pace: quick
        pitch: high
    paddy:
      display_name: Paddy the Beaver
      tts:
        delivery: cheerful and determined
        timbre: sturdy and youthful
        pace: lively
        pitch: medium-low
  chapters:
    - id: ch01
      title: Old Man Coyote Tries Another Plan
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: For three nights, Old Man Coyote slipped through the Green Forest as the Black Shadows came creeping in. Each time, he hid among the aspen trees where Paddy the Beaver cut his food. And each time, Paddy failed to come ashore.
        - id: ch01-b02
          speaker: narrator
          text: Every night, Paddy seemed to have enough food logs floating in the water to keep him busy. He never needed to cut another tree. Old Man Coyote waited and watched. The hungry look in his eyes gave way to doubt, and then to suspicion. Could Paddy be smarter than he had thought?
        - id: ch01-b03
          speaker: narrator
          text: It certainly began to seem that way. Yes, sir, it looked as if Paddy knew perfectly well that Old Man Coyote was hiding there each night. Paddy had not cut a single tree in three nights, yet he always had plenty of food logs ready to carry to his storehouse in the pond.
        - id: ch01-b04
          speaker: old_man_coyote
          text: Then he must come ashore and cut his trees during the day. He couldn't have found me out by himself. He isn't clever enough for that. Someone must have warned him. And Sammy Jay is the only one who knows I've been here. Sammy must be the tattletale! Tomorrow I'll visit Paddy in daylight. Then we'll see!
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: Old Man Coyote was tired as he trotted home after that third night, and black anger filled his heart.
        - id: ch01-b06
          speaker: narrator
          text: Some clever people have one great trouble. They can never believe anyone else might be just as clever. Old Man Coyote did not know that on his first visit to Paddy's pond, he had left a footprint in a small patch of soft mud. Even if he had known, he would never have believed Paddy could guess what that footprint meant.
        - id: ch01-b07
          speaker: narrator
          text: So Old Man Coyote blamed Sammy Jay for everything. That very morning, Sammy came flying over the Green Meadows. Old Man Coyote accused him of telling Paddy and threatened dreadful things if he ever caught him.
        - id: ch01-b08
          speaker: narrator
          text: Sammy had actually flown down to tell Old Man Coyote that Paddy was doing all his work on land during the daytime. But then Old Man Coyote called him a tattletale. He blamed Sammy for warning Paddy and began making those terrible threats.
        - id: ch01-b09
          speaker: narrator
          text: At once, Sammy forgot how angry he had been with Paddy. Now every bit of that anger turned on Old Man Coyote. Sammy called him every bad name he could think of, and Sammy could think of a great many. He had a wicked tongue when he was angry.
        - id: ch01-b10
          speaker: narrator
          text: When Sammy had no breath left, he flew over to the Green Forest. There he found a hiding place where he could watch everything that happened.
        - id: ch01-b11
          speaker: narrator
          text: That afternoon, Old Man Coyote put his new plan to work. He slipped into the Green Forest, glancing this way and that to make sure no one saw him. Then he began creeping toward Paddy's pond, moving very, very softly through the trees.
        - id: ch01-b12
          speaker: narrator
          text: As he came closer, a crash sounded through the forest. Old Man Coyote smiled. He knew exactly what that crash meant. Paddy was at work cutting down trees.
        - id: ch01-b13
          speaker: narrator
          text: Old Man Coyote lowered himself until his stomach almost brushed the ground. Little by little, he crept forward. He took such care that he did not rustle even one leaf. At last, he reached a spot where he could see the aspens.
        - id: ch01-b14
          speaker: narrator
          text: And there was Paddy, just as Old Man Coyote had hoped. Paddy sat upright on his hind legs, working hard as he cut into another tree.
        - id: ch01-b15
          speaker: narrator
          text: For a few minutes, Old Man Coyote lay still and watched him. Then he wriggled a little closer. Slowly, carefully, he pulled his legs beneath him and prepared to rush. At last, Paddy the Beaver was his!
        - id: ch01-b16
          speaker: narrator
          text: But at that very moment, a harsh scream burst out directly over Old Man Coyote's head.
        - id: ch01-b17
          speaker: sammy_jay
          text: Thief! Thief! Thief!
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: It was Sammy Jay. He had followed Old Man Coyote every step of the way.
        - id: ch01-b19
          speaker: narrator
          text: Paddy did not stop even long enough to look around. He knew what Sammy's warning meant. Down his little path he scrambled, faster than he had ever scrambled before.
        - id: ch01-b20
          speaker: narrator
          text: Paddy dived with a tremendous splash. At the very same instant, Old Man Coyote came down from a great leap on the very edge of the pond.
