audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    coyote:
      display_name: 郊狼老先生
      tts:
        delivery: 狡猾自信，盘算时透着得意
        timbre: 粗粝而低沉
        pace: 稍慢
        pitch: 中低音
    sammy:
      display_name: 松鸦萨米
      tts:
        delivery: 尖锐爱炫耀，得意时神气十足
        timbre: 清亮而略带刺耳
        pace: 偏快
        pitch: 高音
  chapters:
    - id: ch01
      title: 第十八章　郊狼老先生又想出一条计策
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一连三个夜晚，黑影刚刚降临，郊狼老先生就偷偷穿过绿森林，藏进帕迪砍食物的那片白杨林。可是，帕迪三个晚上都没有上岸。
        - id: ch01-b02
          speaker: narrator
          text: 每天夜里，水里好像总有足够多的食物木段，够帕迪忙个不停，根本不用再去砍树。郊狼伏在那里，眼里的饥馋先变成疑惑，接着又成了怀疑。
        - id: ch01-b03
          speaker: narrator
          text: 难道帕迪比他想的还要聪明？眼前的情形，明明就是帕迪早知道他每晚躲在那里。是的，先生，看起来正是这么回事。帕迪三夜没砍一棵树，三夜都有许多食物木段，等着运进池塘里的储藏处。
        - id: ch01-b04
          speaker: narrator
          text: 到了第三夜，郊狼老先生又累又恼火，只能往家跑。
        - id: ch01-b05
          speaker: coyote
          text: 这么说，帕迪是在白天上岸砍树。他不可能自己发现我，哪有那么聪明！准是谁给他通了风。
          emotion: angry
        - id: ch01-b06
          speaker: coyote
          text: 知道我去过那里的，只有松鸦萨米。告密的一定是他。明天白天，我也去拜访拜访帕迪。到时候走着瞧！
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: 有些聪明人有个毛病。他们怎么也不肯相信，别人可能和自己一样聪明。郊狼老先生就不知道，他第一次去帕迪的池塘时，在一小片软泥上留下过一个脚印。
        - id: ch01-b08
          speaker: narrator
          text: 就算知道这件事，他也不会相信，帕迪能从那枚脚印猜出究竟发生了什么。于是，他把错全推到松鸦萨米头上。
        - id: ch01-b09
          speaker: narrator
          text: 当天早晨，萨米正好飞过绿草地。郊狼老先生张口便骂他是告密鬼，还威胁说，只要逮住他，什么可怕的事都干得出来。
        - id: ch01-b10
          speaker: narrator
          text: 其实，萨米飞到绿草地来，本来是想告诉郊狼，帕迪怎样趁着白天，把岸上的活儿全做完。
        - id: ch01-b11
          speaker: narrator
          text: 可郊狼一开口就骂他告密，还指控他给帕迪报信，又说了许多吓人的狠话。萨米马上忘了自己还在生帕迪的气，把一肚子火全撒到了郊狼身上。
        - id: ch01-b12
          speaker: narrator
          text: 他把能想到的难听话统统骂了出来。萨米那张尖刻的嘴，能想出的骂人话可真不少。他一直骂到喘不上气，才飞进绿森林，找个地方藏起来，要看清接下来发生的一切。
        - id: ch01-b13
          speaker: narrator
          text: 那天下午，郊狼老先生使出了新计策。他溜进绿森林，一路左瞧右看，确定谁也没发现自己。随后，他把脚步放得轻轻的，悄悄向帕迪的池塘摸去。
        - id: ch01-b14
          speaker: narrator
          text: 快到池塘时，前面传来“轰”的一声。郊狼听见就笑了。他很清楚，这声音说明帕迪正在砍树。
        - id: ch01-b15
          speaker: narrator
          text: 郊狼几乎把肚皮贴到地面，一点一点往前爬。他小心得不得了，连一片叶子也不肯碰响。没过多久，他来到一个能看见白杨林的地方。
        - id: ch01-b16
          speaker: narrator
          text: 果然，帕迪正用后腿坐着，卖力地啃另一棵树。郊狼趴下来，盯着他看了几分钟，又扭动身子，往前靠近了一点。
        - id: ch01-b17
          speaker: narrator
          text: 他慢慢把四条腿收到身下，做好猛扑出去的准备。这一回，海狸帕迪终于逃不出他的掌心了！
        - id: ch01-b18
          speaker: narrator
          text: 偏偏就在这一刻，他头顶上响起一声刺耳的尖叫。
        - id: ch01-b19
          speaker: sammy
          text: 小偷！小偷！小偷！
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: 原来是松鸦萨米。他一路跟着郊狼来到这里。帕迪连头也没回。他知道这声警报是什么意思，立刻沿着自己的小路冲向水边，从来没有跑得这么快。
        - id: ch01-b21
          speaker: narrator
          text: 帕迪“扑通”一声潜进池塘，水花溅得到处都是。几乎就在同时，郊狼老先生也猛地一跃，扑到了池塘边上。
