audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    paddy_beaver:
      display_name: Paddy the Beaver
      tts:
        delivery: practical and thoughtfully self-assured
        timbre: sturdy and mellow
        pace: unhurried
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp and hot-tempered
        timbre: harsh and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Paddy Finishes His Harvest
      blocks:
        - id: ch01-b01
          speaker: paddy_beaver
          text: Sammy has sharp eyes and a sharp tongue. He keeps danger from taking me by surprise. If Sammy Jay weren't here, I couldn't get any work done today.
        - id: ch01-b02
          speaker: narrator
          text: Sammy overheard Paddy say that to Jerry Muskrat, and he swelled all over with pride. Sammy was used to hearing people say bad things about him. Hearing such kind words pleased him more than you can imagine.
        - id: ch01-b03
          speaker: narrator
          text: At once, Sammy forgot every mean thing he had said when he first met Paddy. He forgot calling Paddy a thief for cutting the aspens he needed. He even forgot how Paddy had made everyone laugh at him by cutting down the very tree where Sammy sat.
        - id: ch01-b04
          speaker: narrator
          text: All Sammy remembered was that Paddy trusted him to stand watch and was saying good things about him. Sammy decided to deserve every kind word Paddy could say. Right then, he thought Paddy was the finest fellow in the world.
        - id: ch01-b05
          speaker: narrator
          text: Jerry Muskrat wasn't so sure. He didn't trust Sammy. And after hearing that Old Man Coyote was nearby, Jerry was careful to stay close to the water. Paddy, though, went right on working as if he had nothing to fear.
        - id: ch01-b06
          speaker: paddy_beaver
          text: If you want someone to be worthy of trust, you must trust them first. If Sammy sees that I doubt him, he'll think there's no use trying and give up. But if he knows I truly trust him, he'll be the best watchman in the Green Forest.
        - id: ch01-b07
          speaker: narrator
          text: Paddy had thought wisely, because everything happened just as he expected. Sammy arrived bright and early each morning. First he made certain Old Man Coyote was nowhere in the Green Forest. Then he perched comfortably at the top of a tall pine. From there, he could see everything while Paddy worked.
        - id: ch01-b08
          speaker: narrator
          text: By then, Paddy had finished his canal. It was a beautiful one, running straight from his pond to the aspen trees. As soon as the canal was done, he began cutting the trees.
        - id: ch01-b09
          speaker: narrator
          text: Whenever a tree fell, Paddy cut it into short logs and rolled them into the canal. He floated each piece down to his pond and across to his storehouse. He carried the larger branches the same way because their bark was sweet and tender. Paddy never wasted anything.
        - id: ch01-b10
          speaker: narrator
          text: After a while, Paddy went to inspect his storehouse. It was simply a great pile of aspen logs and branches in the pond beside his home. He studied the pile with great care. Then he swam back and climbed onto the bank of his canal.
        - id: ch01-b11
          speaker: paddy_beaver
          text: Mr. Jay, I believe our work is nearly done.
        - id: ch01-b12
          speaker: sammy_jay
          text: What? You're not going to cut down the rest of those aspen trees?
          emotion: surprised
        - id: ch01-b13
          speaker: paddy_beaver
          text: No. Enough is enough, and I have all I need for the winter. Those other trees are for next year. Everything is ready now, so I think I'll rest for a while.
        - id: ch01-b14
          speaker: narrator
          text: Sammy looked disappointed. He had only just begun to understand that doing something for someone else could bring the greatest pleasure in the world.
        - id: ch01-b15
          speaker: narrator
          text: For the first time Sammy could remember, someone truly wanted him nearby. That gave him a wonderfully good feeling deep inside.
        - id: ch01-b16
          speaker: narrator
          text: Perhaps Sammy remembered that feeling the following spring. Perhaps that was why he was so eager to help poor Mrs. Quack. What he did for her, and all her terrible adventures, belong to the next book.
