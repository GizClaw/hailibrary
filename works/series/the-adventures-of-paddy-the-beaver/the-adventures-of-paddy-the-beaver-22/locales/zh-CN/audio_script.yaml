audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    sammy:
      display_name: 松鸦萨米
      tts:
        delivery: 尖锐爱炫耀，得意时神气十足
        timbre: 清亮而略带刺耳
        pace: 偏快
        pitch: 高音
    paddy:
      display_name: 海狸帕迪
      tts:
        delivery: 开朗坚定，做事胸有成竹
        timbre: 结实而年轻
        pace: 轻快
        pitch: 中低音
    jerry:
      display_name: 麝鼠杰里
      tts:
        delivery: 直爽热心，说话干脆
        timbre: 温厚清晰
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 萨米听见了好话
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 萨米眼尖嘴也尖，处处留神防危险。若非松鸦来放哨，今天活儿干不了。
        - id: ch01-b02
          speaker: narrator
          text: 松鸦萨米恰好听见海狸帕迪对麝鼠杰里念出这几句，骄傲得全身都鼓了起来。萨米平日听到的尽是别人说他的坏话，突然有人这样夸他，他心里可太受用了。
        - id: ch01-b03
          speaker: narrator
          text: 他立刻把自己从前对帕迪说过的刻薄话忘得一干二净。那时帕迪砍了几棵需要的白杨树，萨米竟骂他是贼。后来，帕迪又砍倒萨米坐着的那棵树，让他成了绿森林和绿草原的笑柄。这些事，他也全都忘了。
        - id: ch01-b04
          speaker: narrator
          text: 萨米只记得一件事。帕迪信任他，把放哨的任务交给他，现在还说了他的好话。萨米暗暗下定决心，一定要配得上帕迪的称赞。这时在他心里，帕迪就是全世界最了不起的伙伴。
    - id: ch02
      title: 信任能换来信任
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 麝鼠杰里可没有这么放心。他不信任萨米，又听说郊狼老先生就在附近转悠，所以始终不敢离水太远。帕迪却照常干活，好像什么危险也不怕。
        - id: ch02-b02
          speaker: paddy
          text: 要想让别人愿意得到信任，你就得先信任他。我要是让萨米看出我信不过他，他会觉得再努力也没用，很快就不干了。可我要是真心相信他，也让他知道，他准会成为绿森林里最好的哨兵。
        - id: ch02-b03
          speaker: narrator
          text: 帕迪想得一点儿也没错，这正说明他很有智慧。每天一大早，萨米都会准时出现。他先把绿森林仔细查看一遍，确定郊狼老先生不在那里，再舒舒服服地停到一棵高松树的树顶上。
        - id: ch02-b04
          speaker: narrator
          text: 帕迪在下面忙活，萨米就在高处盯着周围。森林里发生的每一点动静，他都看得清清楚楚。
    - id: ch03
      title: 漂向池塘的冬粮
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这时候，帕迪的水渠已经挖好了。它又漂亮又笔直，从池塘一直伸到白杨树下。水渠刚完工，帕迪便开始砍树。
        - id: ch03-b02
          speaker: narrator
          text: 一棵树倒下，他就把树干截成短段，滚进水渠。木头顺着水漂进池塘，再被送到他的储粮堆。那些长着又嫩又甜的树皮的粗树枝，他也一根根运了回去。帕迪从不浪费东西。
        - id: ch03-b03
          speaker: narrator
          text: 过了一会儿，帕迪游到自己的储粮堆旁。你还记得吧，那不过是一大堆白杨木和树枝，就堆在他家附近的池塘里。他认真察看了一番，又游回水渠，爬上了岸。
        - id: ch03-b04
          speaker: paddy
          text: 松鸦先生，我看咱们的活儿快要做完了。
        - id: ch03-b05
          speaker: sammy
          text: 什么！剩下的白杨树，你都不打算砍了吗？
          emotion: surprised
        - id: ch03-b06
          speaker: paddy
          text: 不砍了。够用就行，我存下的食物已经能吃一整个冬天。那些树要留到明年。过冬的东西全都备好了，我也该歇一阵子啦。
    - id: ch04
      title: 为别人做事的快乐
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 萨米听完，反倒失望起来。因为他才刚刚明白，替别人做事，会带来世上最大的快乐。从他记事起，这还是头一回有人希望他留在身边。那份感觉一直暖到了他的心底。
        - id: ch04-b02
          speaker: narrator
          text: 也许萨米一直记着这份美好的感觉。第二年春天，可怜的野鸭太太遇上麻烦时，他才会那么愿意帮忙，又那么着急地想帮助她。
        - id: ch04-b03
          speaker: narrator
          text: 萨米到底为野鸭太太做了什么？她又经历了哪些可怕的事情？这些故事，我会在下一本书里讲给你听。
