audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    sammy:
      display_name: 松鸦萨米
      tts:
        delivery: 尖锐爱炫耀，得意时神气十足
        timbre: 清亮而略带刺耳
        pace: 偏快
        pitch: 高音
    paddy:
      display_name: 海狸帕迪
      tts:
        delivery: 开朗坚定，做事胸有成竹
        timbre: 结实而年轻
        pace: 轻快
        pitch: 中低音
    jerry:
      display_name: 麝鼠杰里
      tts:
        delivery: 直爽热心，说话干脆
        timbre: 温厚清晰
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 池塘边的怪事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 麝鼠杰里回到微笑池塘，已经有好几天了。可他待不了多久。哎呀，当然待不了！他心里老惦记着那位大个子表哥，非得去看看海狸帕迪又在忙些什么。
        - id: ch01-b02
          speaker: narrator
          text: 等杰里确定微笑池塘一切都好，便顺着欢笑溪急急忙忙往上游赶。他来到绿森林深处，又看见了帕迪的池塘。一到那里，他就四下寻找帕迪。
        - id: ch01-b03
          speaker: narrator
          text: 起先，杰里没找到他。后来，他停下来，朝帕迪砍白杨当食物的地方望过去。那边正在发生一件怪事，可杰里怎么也看不明白。
    - id: ch02
      title: 萨米说自己也有份
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 正在这时，松鸦萨米从空中飞了过来。
        - id: ch02-b02
          speaker: jerry
          text: 帕迪在那边做什么？
        - id: ch02-b03
          speaker: narrator
          text: 萨米落到一棵桤木的树梢上，还把全身羽毛蓬得鼓鼓的，样子神气极了。
        - id: ch02-b04
          speaker: sammy
          text: 哦，帕迪和我正在造一样东西！
        - id: ch02-b05
          speaker: jerry
          text: 你？你和帕迪一起造东西？哈，哈！这话可真好笑！
        - id: ch02-b06
          speaker: sammy
          text: 对，就是我！你没听错，帕迪和我正在一起造东西。
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: 杰里一边说，一边已经向池塘对岸游去。萨米也从水面上飞了过去。
        - id: ch02-b08
          speaker: jerry
          text: 萨米，你还是说实话吧。东西是帕迪造的，你只会在旁边拼命给他添乱！
        - id: ch02-b09
          speaker: narrator
          text: 萨米气得两眼直冒火。他猛地掉头，朝杰里那颗棕色的小脑袋冲了下去。
        - id: ch02-b10
          speaker: sammy
          text: 根本不是这样！你去问帕迪，看我有没有帮他的忙！
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: 杰里赶紧钻到水下，这才躲开萨米尖利的嘴。
    - id: ch03
      title: 通向白杨林的水道
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 等杰里重新浮上水面，萨米已经到了那片小白杨林，帕迪正在那里忙个不停。这时，杰里终于瞧出了那件怪事。原来，一条窄窄的水道一直伸到白杨树跟前。
        - id: ch03-b02
          speaker: narrator
          text: 水道尽头，帕迪正在用力挖土。他把挖出的泥土整齐地堆在一边，让水道一点点向前伸去。
        - id: ch03-b03
          speaker: narrator
          text: 杰里沿着水道游到帕迪身边。
        - id: ch03-b04
          speaker: jerry
          text: 早上好，帕迪表哥。你这是在做什么？
        - id: ch03-b05
          speaker: paddy
          text: 哦，松鸦萨米和我正在挖水渠。
        - id: ch03-b06
          speaker: narrator
          text: 萨米得意地低头看着杰里。杰里却望着帕迪，像是怀疑表哥在和他开玩笑。
        - id: ch03-b07
          speaker: jerry
          text: 松鸦萨米？挖水渠跟他有什么关系？
    - id: ch04
      title: 两个伙伴一起干活
      blocks:
        - id: ch04-b01
          speaker: paddy
          text: 关系可大啦。我动手挖的时候，萨米替我放哨。没有他，我就不能在这里干活，这条水渠也挖不成。
        - id: ch04-b02
          speaker: paddy
          text: 郊狼老先生一直想抓我。要不是绿森林里最尖的那双眼睛在替我留意危险，我哪敢待在岸上？
        - id: ch04-b03
          speaker: narrator
          text: 萨米听了这番话，心里又高兴，又骄傲。
        - id: ch04-b04
          speaker: paddy
          text: 所以呀，这条水渠得靠我们两个。我负责挖，萨米负责守。我们当然是在一起干活。
        - id: ch04-b05
          speaker: narrator
          text: 帕迪说到这里，眼里闪着笑意。杰里慢慢想了想，这下终于懂了。他转过身，认真地望着萨米。
        - id: ch04-b06
          speaker: jerry
          text: 我明白了。萨米，刚才是我不对，请你原谅。我是真心向你道歉。
        - id: ch04-b07
          speaker: sammy
          text: 没关系。你倒说说，我们这条水渠怎么样？
        - id: ch04-b08
          speaker: jerry
          text: 我觉得棒极了。
        - id: ch04-b09
          speaker: narrator
          text: 杰里说得一点儿也不错。那条水渠又直又宽，水也够深，帕迪能从里面游过去，还能让木头一路漂进池塘。对呀，这的确是一条非常好的水渠。
