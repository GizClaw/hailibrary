audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    paddy_beaver:
      display_name: Paddy the Beaver
      tts:
        delivery: practical and thoughtfully self-assured
        timbre: sturdy and mellow
        pace: unhurried
        pitch: medium-low
    jerry:
      display_name: Jerry Muskrat
      tts:
        delivery: confident and quick to speak, softening when humbled
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp and hot-tempered
        timbre: harsh and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Something Queer at Paddy's Pond
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jerry Muskrat had been back home at the Smiling Pool for several days. But he simply couldn't stay there any longer. He had to find out what his big cousin, Paddy the Beaver, was doing.
        - id: ch01-b02
          speaker: narrator
          text: As soon as Jerry knew that everything at the Smiling Pool was all right, he hurried up the Laughing Brook. Deep in the Green Forest, he came to Paddy's pond and eagerly looked around for Paddy.
        - id: ch01-b03
          speaker: narrator
          text: At first, Jerry couldn't see him. Then he stopped and stared toward the place where Paddy had been cutting aspen trees for food. Something queer was happening over there, but Jerry couldn't tell what it was.
    - id: ch02
      title: Sammy Makes a Claim
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Just then, Sammy Jay flew over.
        - id: ch02-b02
          speaker: jerry
          text: What is Paddy doing?
        - id: ch02-b03
          speaker: narrator
          text: Sammy landed at the top of an alder tree. He puffed out all his feathers and made himself look very important.
        - id: ch02-b04
          speaker: sammy_jay
          text: Oh, Paddy and I are building something!
        - id: ch02-b05
          speaker: jerry
          text: You? You and Paddy are building something together? Ha, ha! That's a good one!
        - id: ch02-b06
          speaker: narrator
          text: Jerry laughed at the very idea. Sammy snapped back angrily.
        - id: ch02-b07
          speaker: sammy_jay
          text: Yes, I am helping! You heard me. Paddy and I are building it.
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: By then, Jerry had started swimming across the pond, and Sammy was flying over it.
        - id: ch02-b09
          speaker: jerry
          text: Why not tell the truth, Sammy? Paddy is building something, and you're causing as much trouble as you can!
        - id: ch02-b10
          speaker: narrator
          text: Sammy's eyes flashed. He swooped down at Jerry's little brown head.
        - id: ch02-b11
          speaker: sammy_jay
          text: That isn't true! Ask Paddy. He'll tell you I'm helping!
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: Jerry ducked beneath the water just in time to escape Sammy's sharp bill.
    - id: ch03
      title: The Water-Path
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When Jerry came up again, Sammy had reached the little grove of aspens where Paddy was working. That was when Jerry noticed something new. A narrow water-path ran all the way to the trees.
        - id: ch03-b02
          speaker: narrator
          text: At the far end of the path, Paddy was hard at work. He dug up earth and piled it neatly along one side. He was making the water-path longer.
        - id: ch03-b03
          speaker: narrator
          text: Jerry swam along the little path until he reached his cousin.
        - id: ch03-b04
          speaker: jerry
          text: Good morning, Cousin Paddy. What are you working on?
        - id: ch03-b05
          speaker: paddy_beaver
          text: Oh, Sammy Jay and I are building a canal.
        - id: ch03-b06
          speaker: narrator
          text: Sammy looked down at Jerry in triumph. Jerry stared at Paddy as though Paddy must be joking.
        - id: ch03-b07
          speaker: jerry
          text: Sammy Jay? How can Sammy have anything to do with it?
    - id: ch04
      title: Building It Together
      blocks:
        - id: ch04-b01
          speaker: paddy_beaver
          text: He has a great deal to do with it. Sammy keeps watch while I work. Without him, I couldn't work here, and there wouldn't be a canal.
        - id: ch04-b02
          speaker: paddy_beaver
          text: Old Man Coyote has been trying to catch me. I wouldn't dare work on shore unless I knew the sharpest eyes in the Green Forest were watching for danger.
        - id: ch04-b03
          speaker: narrator
          text: Sammy looked very pleased with himself. He was proud, too.
        - id: ch04-b04
          speaker: paddy_beaver
          text: So it takes both of us to make this canal. I dig, and Sammy watches. That's how we're building it together.
        - id: ch04-b05
          speaker: narrator
          text: There was a twinkle in Paddy's eyes as he finished. Jerry thought it over slowly. Now he understood.
        - id: ch04-b06
          speaker: jerry
          text: I see. Sammy, I owe you an apology. I truly do.
        - id: ch04-b07
          speaker: sammy_jay
          text: That's all right. So, what do you think of our canal?
        - id: ch04-b08
          speaker: jerry
          text: I think it's wonderful.
        - id: ch04-b09
          speaker: narrator
          text: And it really was a very fine canal. It ran straight through the earth, and it was wide and deep enough for Paddy to swim along it and float his logs out to the pond. Yes, indeed, it was a very fine canal.
