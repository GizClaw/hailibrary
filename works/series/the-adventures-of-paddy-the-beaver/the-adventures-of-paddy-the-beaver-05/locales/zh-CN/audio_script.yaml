audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    billy:
      display_name: 水貂比利
      tts:
        delivery: 自信好胜，挖苦别人时带着夸张的得意
        timbre: 灵活清亮
        pace: 明快
        pitch: 中高音
    jerry:
      display_name: 麝鼠杰里
      tts:
        delivery: 直爽热心，说话干脆
        timbre: 温厚清晰
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第五章　帕迪信守诺言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 海狸帕迪只顾埋头干活，就像那些访客根本不在身边。筑坝可是项大工程。等坝筑好了，他还要盖房子，还要割下食物存起来，留着过冬。帕迪哪有工夫闲聊呢？
        - id: ch01-b02
          speaker: narrator
          text: 他不停地筑着坝。可那东西刚开始实在不像水坝，有些访客一看见，便不屑地翘起了鼻子。他们早听说帕迪很会筑坝，原以为会看见一道平整又长满青草的堤岸，就像农夫布朗筑在大河边、用来挡住河水倒灌低洼田地的那一道。
        - id: ch01-b03
          speaker: narrator
          text: 然而，他们眼前只有一大堆横七竖八的长杆和树枝，怎么看都不像坝。
        - id: ch01-b04
          speaker: billy
          text: 呸！帕迪要是只有这点本事，我们还替欢笑溪和微笑池担心什么？用不了多久，欢笑溪的水就会从这堆破树枝里钻过去。
        - id: ch01-b05
          speaker: narrator
          text: 帕迪当然听见了。他一句话也不答，手上的活儿也没停。
        - id: ch01-b06
          speaker: billy
          text: 你们瞧瞧，那些树枝都让他摆成什么样了！谁不知道要把树枝横着架在欢笑溪上？他偏偏顺着水流摆。换成我，筑出来的坝肯定比这好。
        - id: ch01-b07
          speaker: narrator
          text: 帕迪还是不出声，只管接着干。
        - id: ch01-b08
          speaker: billy
          text: 真的，我筑坝准比他强。就那堆树枝，怎么可能拦得住水？
        - id: ch01-b09
          speaker: jerry
          text: 水貂比利，你的眼睛是不是有点儿毛病？
        - id: ch01-b10
          speaker: billy
          text: 我的眼睛当然没毛病！你干吗这么问？
          emotion: angry
        - id: ch01-b11
          speaker: jerry
          text: 没什么。我只是觉得，你大概没看见吧？帕迪的坝上游，欢笑溪已经漫过溪岸了。
        - id: ch01-b12
          speaker: narrator
          text: 杰里一直很有兴致地观察着水坝。比利这才看清楚，坝上方果然积起了一个小池塘，而且还在越变越大。他顿时显得有点难为情。
        - id: ch01-b13
          speaker: narrator
          text: 说到这儿，还得讲讲松鸦萨米。他一想到有事情发生，而自己居然不是头一个知道的，就气坏了。你知道，萨米最爱打听别人的事，也最爱夸口，说绿森林和绿草地上发生的事情，没有一件能瞒过他。
        - id: ch01-b14
          speaker: narrator
          text: 这回，他的自尊心可受了伤，气得怒火冲天。小风儿们告诉他，帕迪正在绿森林深处干活。萨米半个字也不信，却还是跟在他们后面赶去，非得亲眼看个明白。
        - id: ch01-b15
          speaker: narrator
          text: 帕迪仍然默不作声地干着活。他在坝前挖出泥巴和青草，塞进树枝末端的缝里，再用双手拍紧。从水坝正面的一头到另一头，他一路这么填过去，坝顶需要的地方也都填上。
        - id: ch01-b16
          speaker: narrator
          text: 溪水越来越难从坝里钻过去，坝上方的小池塘也涨得更快。没多久，水面就快到坝顶了。水坝起初很低，帕迪又运来更多树枝。现在运树枝轻松多了，他可以让砍下来的树枝顺水漂过来。
        - id: ch01-b17
          speaker: narrator
          text: 帕迪把树枝摆到坝顶，马上又赶回去取。哪里需要，他就往哪里填泥。他甚至还滚来几块石头，帮着把整座坝压牢。
        - id: ch01-b18
          speaker: narrator
          text: 水坝就这样越筑越大，上方的池塘也越涨越大。要筑成这么大一道坝，当然得花上许多天，也得下不少苦功。
        - id: ch01-b19
          speaker: narrator
          text: 绿森林和绿草地的小动物们每天早晨都来瞧。每一次，他们都发现水坝在夜里长高了许多，因为帕迪最喜欢趁着夜色干活。
        - id: ch01-b20
          speaker: narrator
          text: 这时，欢笑溪已经不再欢笑。微笑池里的水少得可怜，连小鱼苗都觉得不安全。水貂比利再也不取笑那道坝了。住在欢笑溪和微笑池里的小家伙们，全都担心得不得了。
        - id: ch01-b21
          speaker: narrator
          text: 其实，帕迪早就告诉过他们自己要做什么。他还答应，等自己的池塘够大，溪水就会重新流进欢笑溪。大家很想相信他，心里却免不了有点害怕，担心他不一定完全说话算数。
        - id: ch01-b22
          speaker: narrator
          text: 毕竟，帕迪是个外乡人，大家都不了解他。只有麝鼠杰里好像一点儿也不担心，认定事情一定会好起来。也许因为帕迪是他的表哥吧。杰里有这么一位高大又聪明能干的表哥，心里可自豪了。
        - id: ch01-b23
          speaker: narrator
          text: 日子一天天过去，水坝一天比一天高，池塘也一天比一天大。一天早晨，青蛙爷爷待在那片从前叫作微笑池的地方，忽然听见一个声音，心里一下欢喜得怦怦直跳。
        - id: ch01-b24
          speaker: narrator
          text: 那声音起先只是轻轻的潺潺声，随后越来越响，最后变成了欢笑溪快活的笑声。
        - id: ch01-b25
          speaker: narrator
          text: 青蛙爷爷终于明白，帕迪信守了诺言。溪水就要重新灌满微笑池了。
