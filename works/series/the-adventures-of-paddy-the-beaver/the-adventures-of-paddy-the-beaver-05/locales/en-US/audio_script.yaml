  chapters:
    - id: ch01
      title: Paddy Keeps His Promise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Paddy the Beaver went right on working as though he had no visitors at all. Building a dam was a tremendous job. When that was finished, he still had a house to build and a winter supply of food to cut and store. Paddy had no time to stand around gossiping. He kept at his dam.
        - id: ch01-b02
          speaker: narrator
          text: At first, it didn't look much like a dam. Some visitors even turned up their noses when they saw it. They had heard that Paddy was a wonderful dam-builder. They expected something like the smooth bank covered with grass that Farmer Brown used to keep the Big River away from his low fields. What they found instead was one great heap of poles and sticks. It hardly looked like a dam at all.
        - id: ch01-b03
          speaker: billy_mink
          text: Pooh! If that's the best Paddy can build, we don't need to worry about the Laughing Brook or the Smiling Pool. The brook will rush right through that pile in no time.
        - id: ch01-b04
          speaker: narrator
          text: Paddy heard Billy Mink, of course. He didn't answer. He simply went on with his work.
        - id: ch01-b05
          speaker: billy_mink
          text: Look how he put those sticks down! Anybody ought to know they should go across the Laughing Brook, not along it like that. Why, I could make a better dam myself.
        - id: ch01-b06
          speaker: narrator
          text: Still Paddy said nothing. Still he worked.
        - id: ch01-b07
          speaker: billy_mink
          text: Yes, sir, I could build a much better one. That heap of sticks is never going to stop the water.
        - id: ch01-b08
          speaker: jerry_muskrat
          text: Billy Mink, is there something wrong with your eyes?
        - id: ch01-b09
          speaker: billy_mink
          text: Of course there isn't! Why would you ask me that?
          emotion: angry
        - id: ch01-b10
          speaker: jerry_muskrat
          text: Oh, no special reason. You just haven't noticed that the Laughing Brook is already spilling over its banks above Paddy's dam.
        - id: ch01-b11
          speaker: narrator
          text: Jerry had been watching the dam very carefully. Now Billy looked a little foolish. Sure enough, a small pool had formed just above the dam, and it was getting larger.
        - id: ch01-b12
          speaker: narrator
          text: Meanwhile, Sammy Jay was terribly upset that something might be happening before he knew about it. Sammy loved to pry into everyone else's business. He especially loved to boast that nothing happened in the Green Forest or on the Green Meadows without his knowing.
        - id: ch01-b13
          speaker: narrator
          text: Now his pride was hurt, and he flew into a terrible rage. The Merry Little Breezes had told him that Paddy was working deep in the Green Forest. Sammy didn't believe one word of their story, but he set out after them to see for himself.
        - id: ch01-b14
          speaker: narrator
          text: Paddy kept working without a word. By now he was digging in front of the dam. He took the mud and grass he dug up, pushed it between the ends of the sticks, and packed it down with his hands.
        - id: ch01-b15
          speaker: narrator
          text: He worked all the way along the front and over the top, filling every place that needed it. The mud made it harder for water to slip through. Above the dam, the little pond began to spread more quickly.
        - id: ch01-b16
          speaker: narrator
          text: Before long, the water had almost reached the top of the dam, which was still quite low. Then Paddy brought in more sticks. That part had become easier because he could float them down from the place where he was cutting.
        - id: ch01-b17
          speaker: narrator
          text: Paddy set each stick on top of the dam and hurried away to fetch another. He packed in mud wherever the wall needed it. He even rolled in a few stones to help hold the whole mass together.
        - id: ch01-b18
          speaker: narrator
          text: The dam grew and grew. The pond behind it grew too. A dam that large took many days and a great deal of hard work.
        - id: ch01-b19
          speaker: narrator
          text: Every morning, the little people from the Green Forest and the Green Meadows came to look. Every morning, they found that the dam had grown a great deal during the night. Nighttime, you see, was when Paddy liked working best.
        - id: ch01-b20
          speaker: narrator
          text: By then, the Laughing Brook had stopped laughing. Far below, hardly enough water remained in the Smiling Pool for the minnows to feel safe, even for a minute.
        - id: ch01-b21
          speaker: narrator
          text: Billy Mink no longer laughed at Paddy's dam. All the little people who lived in the Laughing Brook and the Smiling Pool were terribly worried.
        - id: ch01-b22
          speaker: narrator
          text: Paddy had warned them what he meant to do. He had also promised that once his pond was large enough, water would flow through the Laughing Brook again.
        - id: ch01-b23
          speaker: narrator
          text: They tried hard to believe him. Even so, they couldn't help wondering whether Paddy might not be completely honest with them. He was a stranger, and they didn't know him yet.
        - id: ch01-b24
          speaker: narrator
          text: Only Jerry Muskrat seemed completely sure that everything would turn out fine. Perhaps that was because Paddy was his cousin. Jerry couldn't help feeling proud to have a cousin who was so big and so clever.
        - id: ch01-b25
          speaker: narrator
          text: Day after day, the dam kept growing. Day after day, the pond spread farther behind it.
        - id: ch01-b26
          speaker: narrator
          text: Then one morning, Grandfather Frog sat down in what had once been the Smiling Pool and heard a sound that made his heart leap with joy.
        - id: ch01-b27
          speaker: narrator
          text: At first it was only a murmur. It grew and grew until, at last, it became the merry laugh of the Laughing Brook.
        - id: ch01-b28
          speaker: narrator
          text: Grandfather Frog knew then that Paddy had kept his word. Water would fill the Smiling Pool once more.
