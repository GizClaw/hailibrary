  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    paddy:
      display_name: Paddy the Beaver
      tts:
        delivery: cheerful and determined
        timbre: sturdy and youthful
        pace: lively
        pitch: medium-low
    billy_mink:
      display_name: Billy Mink
      tts:
        delivery: quick and boastful
        timbre: bright and wiry
        pace: brisk
        pitch: medium-high
    jerry_muskrat:
      display_name: Jerry Muskrat
      tts:
        delivery: thoughtful and quietly confident
