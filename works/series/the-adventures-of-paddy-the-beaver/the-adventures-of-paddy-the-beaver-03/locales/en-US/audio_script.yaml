audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    paddy:
      display_name: Paddy the Beaver
      tts:
        delivery: cheerful and determined
        timbre: sturdy and youthful
        pace: lively
        pitch: medium-low
  chapters:
    - id: ch01
      title: Paddy Has Many Visitors
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Paddy the Beaver knew that visitors would come as soon as he started building his dam. In fact, he expected a great many of them. None of the little people had ever watched a Beaver at work. Perhaps Prickly Porky the Porcupine had, because he, too, had come down from the North.
        - id: ch01-b02
          speaker: narrator
          text: So Paddy kept working, but he kept his ears open. Soon he heard a little rustle in one place, and then another rustle somewhere else. He smiled to himself. He knew exactly what those sounds meant. Every rustle meant that another visitor had arrived. Yes, Sir, another visitor was there, though not one of them had shown himself.
        - id: ch01-b03
          speaker: narrator
          text: Paddy gave a chuckle. Then he spoke loudly, as if he were talking to no one at all.
        - id: ch01-b04
          speaker: paddy
          text: It seems to me you're all terribly afraid to show yourselves.
        - id: ch01-b05
          speaker: narrator
          text: Everything went still. After Paddy spoke, he couldn't hear even one small rustle. He chuckled again. He couldn't see a single pair of eyes, but he could feel ever so many of them watching him.
        - id: ch01-b06
          speaker: narrator
          text: Paddy knew why his visitors were hiding so carefully. They were afraid of him. He was much bigger than most of the little people of the Green Meadows and the Green Forest. They didn't know what sort of temper this stranger might have.
        - id: ch01-b07
          speaker: narrator
          text: It is always safest to be very careful about strangers. That is one of the first lessons taught to every little child of the meadows and the forest.
        - id: ch01-b08
          speaker: narrator
          text: Of course, Paddy understood that lesson. He had been brought up the same way. One of his mother's favorite sayings had always stayed with him.
        - id: ch01-b09
          speaker: narrator
          text: Be sure, and then you'll never be sorry.
        - id: ch01-b10
          speaker: narrator
          text: Remembering those words had saved Paddy a great deal of trouble. So he was quite willing to keep working while his hidden visitors watched. They could take all the time they needed to make sure he meant them no harm.
        - id: ch01-b11
          speaker: narrator
          text: Paddy himself felt sure that none of them was big enough to hurt him. Little Joe Otter was the only one he wondered about at all, and Paddy was fairly certain that Little Joe would not try to start a quarrel.
        - id: ch01-b12
          speaker: narrator
          text: Paddy went right on cutting down trees. He trimmed away the branches and hauled the trunks to the dam he was building. When he could, he floated the trunks down the Laughing Brook. That made the work easier.
        - id: ch01-b13
          speaker: narrator
          text: The first ones to learn that Paddy had come to the Green Forest were the little people of the Smiling Pool. When they set out along the Laughing Brook to see what he was doing, they told the Merry Little Breezes where they were going.
        - id: ch01-b14
          speaker: narrator
          text: The Merry Little Breezes were greatly excited. How could a stranger be living in the Green Forest without their knowing about him? They had forgotten that they almost never wandered into the deepest part of the forest.
        - id: ch01-b15
          speaker: narrator
          text: At once, they rushed off as fast as they could. They meant to tell all the other little people who lived on the Green Meadows or nearby. There was only one neighbor they did not tell. That was Old Man Coyote.
        - id: ch01-b16
          speaker: narrator
          text: For some reason, the Merry Little Breezes thought it was best to leave him out. They weren't at all sure about Old Man Coyote. He was so big and strong, and so sly and clever, that all his neighbors feared him.
        - id: ch01-b17
          speaker: narrator
          text: Perhaps the Merry Little Breezes were thinking about that. They may have known that no one would dare visit the stranger if Old Man Coyote was going there too.
        - id: ch01-b18
          speaker: narrator
          text: Whatever their reason, they simply greeted Old Man Coyote as they passed and hurried on to tell everyone else. The very last person they met was Sammy Jay.
