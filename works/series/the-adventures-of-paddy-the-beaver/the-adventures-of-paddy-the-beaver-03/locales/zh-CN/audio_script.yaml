audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    paddy:
      display_name: 海狸帕迪
      tts:
        delivery: 快活坚定，做事干脆利落
        timbre: 结实而年轻
        pace: 轻快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第三章　帕迪迎来许多访客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 海狸帕迪早就知道，只要他开始筑坝，客人们很快就会一个接一个地赶来。他猜得出，来客一定不少。除了同样从北方来的豪猪波奇，也许谁都没有亲眼见过海狸干活。
        - id: ch01-b02
          speaker: narrator
          text: 所以帕迪手上忙着，耳朵也一直听着。这边轻轻响起一阵窸窣声，那边又来一阵，他听了只在心里发笑。每一阵响动，都说明又多了一位访客。是的，先生，来客越来越多，却没有一个肯现身。
        - id: ch01-b03
          speaker: narrator
          text: 帕迪咯咯笑了一声，忽然提高嗓门，像是随口对着空气说话。
        - id: ch01-b04
          speaker: paddy
          text: 看来你们胆子真小，怕得都不敢出来见我啦。
        - id: ch01-b05
          speaker: narrator
          text: 话音一落，四周静得连一丝窸窣声都没有。帕迪又笑了。眼前明明一双眼睛也看不见，他却清清楚楚地感觉到，好多双眼睛正在暗处盯着自己。
        - id: ch01-b06
          speaker: narrator
          text: 帕迪明白，这些客人藏得严严实实，是因为怕他。他比绿草地和绿森林里的大多数小居民高大得多，大家又不知道他脾气怎么样。遇见陌生人，先多提防一些，总归最稳妥。草地和森林里的孩子，从小就要学会这一点。
        - id: ch01-b07
          speaker: narrator
          text: 这套道理，帕迪当然懂，因为他也是这样长大的。妈妈有句话常挂在嘴边，帕迪一直牢牢记着。
        - id: ch01-b08
          speaker: narrator
          text: 先把事情弄准，就永远不会后悔。
        - id: ch01-b09
          speaker: narrator
          text: 这句话的确帮帕迪躲过了不少麻烦。如今，他就安心做自己的事，让躲起来的客人慢慢看，直到他们确定帕迪不会伤害自己。
        - id: ch01-b10
          speaker: narrator
          text: 帕迪自己也很确定，来的这些小居民，没有谁大到能伤着他。只有小水獭乔让他稍稍有些拿不准，不过他相信，小乔不会跑来故意争吵。
        - id: ch01-b11
          speaker: narrator
          text: 于是帕迪不停手，照样砍树，咬掉树枝，再把树干拖到正在修筑的坝边。有些树干，他直接放进欢笑溪，让溪水送下去。这可轻松多了。
        - id: ch01-b12
          speaker: narrator
          text: 微笑池的小居民最先知道海狸帕迪来到了绿森林。他们沿着欢笑溪去看帕迪时，把自己的去向告诉了欢乐小微风。欢乐小微风听了兴奋极了。他们想不通，绿森林里已经住进一个陌生人，自己怎么会毫不知情。
        - id: ch01-b13
          speaker: narrator
          text: 可他们忘了，自己很少飘进绿森林最深处。于是，他们马上飞快地出发，要把消息告诉绿草地上和四周的所有小居民。不过，郊狼老先生不在其中。不知为什么，欢乐小微风觉得这件事还是瞒着他好。
        - id: ch01-b14
          speaker: narrator
          text: 他们对郊狼老先生有些不放心。他个头大，力气强，又狡猾，又机灵，邻居们全都怕他。也许欢乐小微风早就想到，要是大家听说郊狼老先生也去拜访陌生人，就谁也不敢跟着去了。
        - id: ch01-b15
          speaker: narrator
          text: 所以他们碰见郊狼老先生时，只随口问候了一声，便赶紧去通知别人。最后一个听到消息的，是松鸦萨米。
