audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻柔的观察和一点幽默
        timbre: 清澈圆润
        pace: 从容舒展
        pitch: 中音
    sammy:
      display_name: 松鸦萨米
      tts:
        delivery: 尖锐爱炫耀，得意时神气十足
        timbre: 清亮而略带刺耳
        pace: 偏快
        pitch: 高音
    paddy:
      display_name: 海狸帕迪
      tts:
        delivery: 开朗坚定，做事胸有成竹
        timbre: 结实而年轻
        pace: 轻快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十章　松鸦萨米要来帮帕迪
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 帕迪坐在那里，望着远处那些白杨树，心里直发愁。要把过冬的食物备足，他还得砍下一些白杨。可池塘边的早就砍光了，剩下的全都东一棵、西一棵，长在离池塘有一段路的地方。
        - id: ch01-b02
          speaker: paddy
          text: 我真不知道该怎么办。我真不知道。
        - id: ch01-b03
          speaker: narrator
          text: 萨米和帕迪已经成了朋友。如今，帕迪做的每一件事，他都很感兴趣，也很想弄个明白。
        - id: ch01-b04
          speaker: sammy
          text: 你不知道什么？
        - id: ch01-b05
          speaker: paddy
          text: 我不知道怎么才能把那些树弄回来。郊狼老先生正盯着我，我离池塘太远可不安全。
        - id: ch01-b06
          speaker: paddy
          text: 我可以挖条水渠，通到几棵最近的树那儿，再让树顺水漂进池塘。可是，一边干活，一边防着敌人，实在太难了。
        - id: ch01-b07
          speaker: paddy
          text: 看来，我只能拿水边这些桤木凑合。可白杨树皮好吃得多，我……我真想把那些树弄回来。
        - id: ch01-b08
          speaker: sammy
          text: 水渠是什么？
        - id: ch01-b09
          speaker: paddy
          text: 水渠啊，就是一条能让水流过去的沟。
        - id: ch01-b10
          speaker: narrator
          text: 萨米点了点头。
        - id: ch01-b11
          speaker: sammy
          text: 我见过农夫布朗在绿草地那边挖水渠，那活儿看上去可费劲了。我还以为只有他才会挖呢。帕迪，你真的也会？
        - id: ch01-b12
          speaker: paddy
          text: 那当然。我帮着挖过好多条呢。你真该到我以前住的地方看看，那儿的水渠才叫多。
          emotion: surprised
        - id: ch01-b13
          speaker: sammy
          text: 我真想去看看。这也太了不起了！我怎么也想不出你是怎样挖的。
        - id: ch01-b14
          speaker: paddy
          text: 知道怎么挖，就容易得很。我要是敢出去，就挖给你看。
        - id: ch01-b15
          speaker: narrator
          text: 就在这时，萨米脑中忽然冒出一个主意。这个主意叫他激动得差点喘不过气来。
        - id: ch01-b16
          speaker: sammy
          text: 有办法了！你来干活，我替你放哨！我的眼睛有多尖，你是知道的。
          emotion: surprised
        - id: ch01-b17
          speaker: paddy
          text: 你真的愿意？那可太好了！我认识的朋友里，就数你的眼睛最尖。有你放哨，我什么也不怕。
        - id: ch01-b18
          speaker: paddy
          text: 可是，松鸦先生，我不愿让你费这么大的事。
        - id: ch01-b19
          speaker: sammy
          text: 我当然愿意。这一点儿也不麻烦，我正巴不得帮这个忙呢。
        - id: ch01-b20
          speaker: narrator
          text: 帕迪说自己认识的朋友里，萨米的眼睛最尖。听到这样的夸奖，萨米心里别提多得意了。
        - id: ch01-b21
          speaker: sammy
          text: 你什么时候开工？
        - id: ch01-b22
          speaker: paddy
          text: 马上。你先到四周看看，只要外面安全，我就能上岸。
        - id: ch01-b23
          speaker: narrator
          text: 萨米连后面的话也没等帕迪说完。他张开美丽的蓝翅膀，飞过绿森林，径直去了绿草地。帕迪一直望着他越飞越远，脸上既疑惑，又失望。
        - id: ch01-b24
          speaker: paddy
          text: 真奇怪。我还以为他是当真的，怎么连再见都不说，就这样飞走了？
        - id: ch01-b25
          speaker: narrator
          text: 可是没过多久，萨米又从绿草地飞回来了。他飞得太急，落下时已经累得上气不接下气。
        - id: ch01-b26
          speaker: sammy
          text: 没事了。你想什么时候开工都行。
        - id: ch01-b27
          speaker: narrator
          text: 帕迪听了，反倒比刚才更加糊涂。
        - id: ch01-b28
          speaker: paddy
          text: 你怎么知道？我根本没看见你在附近察看呀。
        - id: ch01-b29
          speaker: sammy
          text: 我用了一个更好的办法。郊狼老先生要是藏在绿森林里，我得找上半天才能找到他。可他根本不在这儿。
        - id: ch01-b30
          speaker: sammy
          text: 我直接飞到他在绿草地的家里去了。他果然在那儿晒太阳，脸拉得老长，脾气坏得不得了。
        - id: ch01-b31
          speaker: sammy
          text: 我看他今天上午不会回来。不过你干活的时候，我还是会替你仔细盯着四周。
        - id: ch01-b32
          speaker: narrator
          text: 听完萨米的办法，帕迪佩服极了，郑重地向他深深鞠了一躬。
        - id: ch01-b33
          speaker: paddy
          text: 松鸦先生，你可真聪明。我怎么就没想到去郊狼老先生家里，看看他在不在呢？
        - id: ch01-b34
          speaker: paddy
          text: 有你替我守着，我就完全放心了。现在，我要开工啦。
