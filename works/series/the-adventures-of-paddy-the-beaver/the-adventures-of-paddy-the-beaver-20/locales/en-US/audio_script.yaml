audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and rounded
        pace: measured
        pitch: medium
    paddy_beaver:
      display_name: Paddy the Beaver
      tts:
        delivery: practical and thoughtfully self-assured
        timbre: sturdy and mellow
        pace: unhurried
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: lively and proudly inquisitive
        timbre: bright and crisp
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Sammy Jay Offers to Help Paddy
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Paddy sat studying the aspen trees he still needed for his winter food supply. He had already cut every aspen close to the edge of his pond. The trees that remained were scattered some distance away. One stood here and another there, with none of them close to the water. Paddy sat quietly, looking from one distant tree to the next. Then he spoke aloud.
        - id: ch01-b02
          speaker: paddy_beaver
          text: I just don't know. I truly don't know.
        - id: ch01-b03
          speaker: narrator
          text: Now that Sammy Jay and Paddy were friends, Sammy took a great interest in Paddy's work.
        - id: ch01-b04
          speaker: sammy_jay
          text: What is it you don't know?
        - id: ch01-b05
          speaker: paddy_beaver
          text: I can't decide how to reach those trees. Old Man Coyote is watching for me, so going far from my pond isn't safe. I could dig a canal toward some of the closest aspens and float them down to the water. But working while I watch for enemies would be difficult. I may have to settle for those alders beside the pond. Aspen bark tastes so much better, though. I only wish I could get those trees.
        - id: ch01-b06
          speaker: sammy_jay
          text: Wait. What is a canal?
        - id: ch01-b07
          speaker: paddy_beaver
          text: A canal? It's a kind of ditch that water can flow through.
        - id: ch01-b08
          speaker: narrator
          text: Sammy nodded.
        - id: ch01-b09
          speaker: sammy_jay
          text: I've seen Farmer Brown digging one on the Green Meadows. It looked like an enormous job. I never imagined anyone else could do it. Can you really dig a canal, Paddy?
        - id: ch01-b10
          speaker: narrator
          text: Paddy was surprised by the question.
        - id: ch01-b11
          speaker: paddy_beaver
          text: I certainly can. I've helped dig plenty of canals. You should see the ones back where I came from.
        - id: ch01-b12
          speaker: sammy_jay
          text: I'd like to see them. Digging a canal sounds wonderful, but I can't imagine how you manage it.
        - id: ch01-b13
          speaker: paddy_beaver
          text: Once you know how, it isn't hard. If it were safe to leave the pond, I would show you.
        - id: ch01-b14
          speaker: narrator
          text: All at once, an idea came to Sammy. It nearly took his breath away.
        - id: ch01-b15
          speaker: sammy_jay
          text: I've got it! You do the digging, and I'll stand guard. My eyes are very sharp, you know.
          emotion: surprised
        - id: ch01-b16
          speaker: paddy_beaver
          text: Would you really do that? That would be splendid! You have the sharpest eyes of anyone I know. With you watching, I would feel perfectly safe. Still, Mr. Jay, I don't want to cause you so much trouble.
          emotion: happy
        - id: ch01-b17
          speaker: sammy_jay
          text: Of course I'll do it. It won't be any trouble. I'd love to help. When are you going to start?
        - id: ch01-b18
          speaker: narrator
          text: Sammy felt very proud after hearing Paddy praise his sharp eyes.
        - id: ch01-b19
          speaker: paddy_beaver
          text: Right now. First, please look around and make sure it's safe for me to come onto the land.
        - id: ch01-b20
          speaker: narrator
          text: Sammy didn't wait for another word. He opened his beautiful blue wings and flew over the Green Forest, straight toward the Green Meadows. Paddy watched him leave, puzzled and disappointed.
        - id: ch01-b21
          speaker: paddy_beaver
          text: That's strange. I thought he meant what he said, but now he's flown away without even saying good-bye.
        - id: ch01-b22
          speaker: narrator
          text: Before long, Sammy came flying back. He was out of breath.
        - id: ch01-b23
          speaker: sammy_jay
          text: Everything is safe. You can begin whenever you're ready.
        - id: ch01-b24
          speaker: narrator
          text: Paddy looked even more puzzled.
        - id: ch01-b25
          speaker: paddy_beaver
          text: How can you know that? I never saw you search around here.
        - id: ch01-b26
          speaker: sammy_jay
          text: I did something better. If Old Man Coyote were hiding in the Green Forest, finding him might take a long time. But he isn't here. I flew straight to his home on the Green Meadows to check. He's there, sunning himself and looking as cross as two sticks. I don't expect him back this morning, but I'll still watch carefully while you work.
        - id: ch01-b27
          speaker: narrator
          text: Paddy gave Sammy a low bow.
        - id: ch01-b28
          speaker: paddy_beaver
          text: You certainly are clever, Mr. Jay. I never would have thought of checking Old Man Coyote's own home. With you standing guard, I'll feel perfectly safe. Now I can get to work.
