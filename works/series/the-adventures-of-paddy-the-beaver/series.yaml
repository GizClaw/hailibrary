cover_prompt: |-
  A wordless cover scene in an early-twentieth-century American forest shows a sturdy brown beaver building a dam across a lively woodland brook. The beaver has dense chestnut fur, small alert ears, strong front teeth, and a broad flat tail braced against the streambed as he drags a freshly cut aspen branch into place. A small brown rabbit and a sleek dark muskrat watch from the safe bank while a blue jay with vivid blue wings perches above them. The beaver fitting the leafy branch among poles, stones, and mud is the clear focal action, with the new pond beginning to spread through the sunny clearing behind him. Use a wide child-height view along the curving brook, keeping the animals prominent in the lower middle and leaving broad calm room in the pale sky and upper forest canopy. Keep the animals anatomically believable, the woodland setting warm and child-friendly, and every figure independent of film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
