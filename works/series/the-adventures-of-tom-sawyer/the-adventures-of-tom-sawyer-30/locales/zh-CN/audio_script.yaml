audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，带着街头少年的粗朴和谨慎
        timbre: 略带沙哑的少年声
        pace: 自然偏慢
        pitch: 中音
    welshman:
      display_name: 老威尔士人
      tts:
        delivery: 直率警觉，沉稳有主见
        timbre: 强健沧桑
        pace: 从容
        pitch: 低音
    widow_douglas:
      display_name: 道格拉斯寡妇
      tts:
        delivery: 仁慈虔诚，关切时温柔坚定
        timbre: 温厚成熟的女声
        pace: 从容
        pitch: 中音
    mrs_thatcher:
      display_name: 撒切尔太太
      tts:
        delivery: 关爱而坚定，语气实际
        timbre: 温暖成熟的女声
        pace: 从容
        pitch: 中音
    mrs_harper:
      display_name: 哈珀太太
      tts:
        delivery: 朴实直爽，忧虑时语气发紧
        timbre: 清晰成熟的女声
        pace: 自然
        pitch: 中音
    aunt_polly:
      display_name: 波莉姨妈
      tts:
        delivery: 爽利慈爱，焦急时感情外露
        timbre: 温暖略显苍老的女声
        pace: 明快
        pitch: 中音
    joe_harper:
      display_name: 乔·哈珀
      tts:
        delivery: 老实直接，回答长辈时略显拘谨
        timbre: 清亮的少年声
        pace: 自然
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 星期日清晨，天边才刚透出一点曙光，哈克就摸索着爬上山，轻轻敲响老威尔士人的门。屋里的人原本都睡着了，可昨夜那场惊险让他们的睡意绷得像一触即发的机关。敲门声才响，窗口立刻有人喝问是谁。
        - id: ch01-b02
          speaker: huck
          text: 请让我进去！是我，哈克·费恩！
          emotion: fearful
        - id: ch01-b03
          speaker: welshman
          text: 孩子，不管白天黑夜，你这个名字都能叫开我家的门。快进来吧，欢迎你！
        - id: ch01-b04
          speaker: narrator
          text: 对这个四处流浪的孩子来说，这句话真是从没听过。尤其是“欢迎”两个字，哈克想不起从前有谁拿它招呼过自己。它陌生极了，却也是他平生听过最叫人舒心的话。门很快打开，他进屋坐下，老人和两个高个子儿子赶紧穿好衣服。
        - id: ch01-b05
          speaker: welshman
          text: 你一定饿坏了吧？太阳一出来，就有热腾腾的早饭。昨晚我和两个孩子还盼着你回来，留在这里过夜呢。
        - id: ch01-b06
          speaker: huck
          text: 我当时怕得要命。枪一响，我就跑了三英里。现在回来，是想知道后来出了什么事。我特意趁天没亮来，免得撞见那两个恶鬼，就算他们死了，我也不想见。
          emotion: fearful
        - id: ch01-b07
          speaker: welshman
          text: 可怜的孩子，你昨晚准吃了不少苦。吃完饭就去睡一觉。不过那两个人没死，真可惜。我们照你的指点，踮着脚摸进漆树小路，一直靠到离他们十五英尺的地方。那里黑得像地窖，偏偏我这时觉得要打喷嚏。还有比这更倒霉的吗？我拼命往回忍，可它非出来不可，到底还是打了出来！我走在最前头，手枪已经举起。他们一听喷嚏就窸窸窣窣地往外逃，我马上喊孩子们开枪，三个人一起朝发出响动的地方射击。
        - id: ch01-b08
          speaker: welshman
          text: 那两个恶棍转眼钻进树林，我们一路追下去。他们起跑时一人回了一枪，子弹嗖嗖地从身旁飞过，谁也没有受伤。我看我们的子弹也没碰着他们。后来听不见脚步声了，我们才放弃追赶，下山叫醒治安官。他们召集了一队人，已经去把守河岸。天一亮，郡治安长官还要带人搜遍树林，我两个儿子马上也会赶去。眼下只缺那两个混蛋的长相，要是能说清楚，可就帮大忙了。天那么黑，你大概没看见吧？
        - id: ch01-b09
          speaker: huck
          text: 我看清了。我在镇上见过他们，还跟了他们一路。
        - id: ch01-b10
          speaker: welshman
          text: 太好了！快说，他们长什么样？
        - id: ch01-b11
          speaker: huck
          text: 一个是近来出现过的聋哑西班牙老头，另一个脸色凶恶，衣服破破烂烂……
        - id: ch01-b12
          speaker: welshman
          text: 够了，我们知道是谁！以前在寡妇家后面的树林里遇见过，他们一见人就溜了。孩子们，马上去告诉郡治安长官，早饭明天再吃！
        - id: ch01-b13
          speaker: narrator
          text: 两个年轻人立刻出门。哈克忽然跳起来，苦苦求他们不要告诉任何人，是自己报了信。
        - id: ch01-b14
          speaker: welshman
          text: 既然你坚持，我们就不说。不过救人的功劳本来该算在你头上。
        - id: ch01-b15
          speaker: huck
          text: 不要，千万不要！求你们别说！
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: 儿子们走后，老人答应替哈克保密，又问他为什么这样害怕。哈克只肯说，自己知道其中一人的秘密。那人一旦知道，准会杀了他。
        - id: ch01-b17
          speaker: welshman
          text: 那你怎么会跟踪他们？是不是一看就觉得可疑？
        - id: ch01-b18
          speaker: narrator
          text: 哈克沉默了一阵。他得把回答编得谨慎些，既要说清自己为什么跟踪，又不能让老人猜到印第安乔的身份。
        - id: ch01-b19
          speaker: huck
          text: 人人都说我是个坏小子，我也不反对。有时候一想到这事，想换个活法，我就睡不着。昨晚半夜，我沿街走到禁酒旅店旁边那家破砖铺，正靠墙琢磨，两个家伙贴着我溜过去，胳膊下还夹着东西。我猜那是偷来的。
        - id: ch01-b20
          speaker: huck
          text: 一个正在抽烟，另一个要借火。他们停在我跟前，雪茄照亮了脸。我认出那个大个子，他有白胡子，眼睛蒙着眼罩，就是聋哑西班牙人。另一个家伙满身污垢，衣服也破烂得很。
        - id: ch01-b21
          speaker: welshman
          text: 雪茄那一点亮光，真能让你看见衣服上的破洞？
        - id: ch01-b22
          speaker: narrator
          text: 哈克一下被问住了。
        - id: ch01-b23
          speaker: huck
          text: 我也说不清。不过我总觉得，自己当时看见了。
        - id: ch01-b24
          speaker: welshman
          text: 后来他们继续走，你就……
        - id: ch01-b25
          speaker: huck
          text: 我就跟上去了。他们偷偷摸摸的，我想看看在搞什么鬼。我一直跟到寡妇家的栅栏台阶，听见那个破衣服的替寡妇求情，西班牙人却说要毁掉她的脸，就跟我昨晚告诉您和您两个儿子的一样……
        - id: ch01-b26
          speaker: welshman
          text: 等等！那些话是那个聋哑人说的？
          emotion: surprised
        - id: ch01-b27
          speaker: narrator
          text: 哈克又犯了一个要命的错误。他费尽心思想让老人猜不到那个西班牙人是谁，自己的舌头却偏要把他往麻烦里送。他几次试着绕出去，越解释，漏洞反而越多。老人一直看着他，不让他再躲闪。
        - id: ch01-b28
          speaker: welshman
          text: 孩子，别怕。我绝不会伤你，还会保护你。你已经无意中告诉我，那个西班牙人并不聋哑。现在遮不住了。把你知道的实情告诉我吧，我保证不出卖你。
          emotion: calm
        - id: ch01-b29
          speaker: narrator
          text: 哈克望着老人那双诚实的眼睛，看了好一会儿，终于弯下腰，凑到他耳边压低声音开口。
        - id: ch01-b30
          speaker: huck
          text: 他不是西班牙人。他是印第安乔！
        - id: ch01-b31
          speaker: narrator
          text: 老人差点从椅子上跳起来。定了定神，他总算明白了。先前听到割破耳朵、割开鼻孔，他还当那是哈克自己添上的吓人话，因为白人不会用这种法子报仇。可那人要是印第安乔，事情就完全不同了。
        - id: ch01-b32
          speaker: narrator
          text: 吃早饭时，他们继续谈论昨夜的事。老人说，睡觉以前，他和两个儿子做的最后一件事，就是提着灯笼回到栅栏台阶，把附近仔细检查一遍，想找找有没有血迹。他们一滴血也没发现，却捡到一大包东西。
        - id: ch01-b33
          speaker: huck
          text: 一大包什么？
          emotion: surprised
        - id: ch01-b34
          speaker: narrator
          text: 这句话像闪电一样从哈克惨白的嘴唇间蹿出来。他瞪着眼，屏住呼吸。老人也吃惊地盯了他好一阵，才回答。
        - id: ch01-b35
          speaker: welshman
          text: 是一包撬门的家伙。你怎么吓成这样？
        - id: ch01-b36
          speaker: narrator
          text: 哈克一下靠回椅背，轻轻却又深深地喘着气，心里的感激简直没法说出口。老人神情严肃又疑惑地端详着他，越看越觉得事情不对。
        - id: ch01-b37
          speaker: welshman
          text: 没错，是撬门工具。你好像一下轻松了不少。你刚才以为我们捡到了什么？
        - id: ch01-b38
          speaker: narrator
          text: 哈克被逼到了墙角。老人探究的目光紧紧盯着他，像是越钻越深。他恨不得拿任何东西换一个像样的回答，可脑中一片空白。忽然冒出来的，偏偏是一句毫无道理的话。老人还在等，已经没有时间斟酌了，他只好硬着头皮，虚弱地把它说出口。
        - id: ch01-b39
          speaker: huck
          text: 也许是主日学校的课本。
        - id: ch01-b40
          speaker: narrator
          text: 可怜的哈克愁得连笑也笑不出来，老人却放声大笑，从头到脚每一处骨节仿佛都跟着抖起来。笑够以后，他说，这样大笑一场，就像口袋里多了钱，因为它比什么都能省下看医生的花费。
        - id: ch01-b41
          speaker: welshman
          text: 可怜的老弟，你脸色惨白，人也累坏了，难怪说话颠三倒四。去休息，好好睡一觉，希望醒来就没事了。
        - id: ch01-b42
          speaker: narrator
          text: 哈克恼恨自己那么慌张，白白露出可疑的样子。昨晚在寡妇家的栅栏旁听过两个恶棍的密谋后，他已经觉得从旅店拿出的包裹不是宝藏。可那只是猜测，他并不能肯定，所以老人一提到捡回一大包东西，他马上失去了镇定。好在这个小插曲终于让他再无疑问，那一包绝不是他们要找的那一包。如今他彻底踏实了。金子一定还在二号房里，那两个男人今天就会被捕，他和汤姆今晚便能安安稳稳拿走宝藏，不必担心有人来打扰。
        - id: ch01-b43
          speaker: narrator
          text: 早饭刚吃完，门外便有人敲门。哈克连忙跳起来找地方藏身。他不愿和昨夜的事沾上一点关系，哪怕只是叫别人远远联想到他也不行。老威尔士人迎进几位先生太太，道格拉斯寡妇也在其中。他从门口望出去，只见一群群镇民正在往山上爬，都要去看那处栅栏。消息显然已经传开了。老人只得把昨夜的经过讲给客人听，寡妇听后毫不掩饰自己的感激。
        - id: ch01-b44
          speaker: welshman
          text: 夫人，您不必谢我。还有一个人也许比我和两个儿子更值得感谢，可他不许我说出名字。要不是他报信，我们根本不会去那里。
        - id: ch01-b45
          speaker: narrator
          text: 这话激起的好奇心大得惊人，几乎把救下寡妇这件正事都比小了。可老人就是不肯吐露秘密，只让好奇在来客心里越钻越深，再由他们带到全镇。等昨夜别的细节都问完后，寡妇才想起另一个问题。
        - id: ch01-b46
          speaker: widow_douglas
          text: 我昨晚躺在床上看书，看着看着就睡着了，连枪声也没听见。你们为什么不叫醒我？
        - id: ch01-b47
          speaker: welshman
          text: 那两个家伙丢了工具，多半不敢再来，何苦把您吓个半死？我手下三个人整夜守着您家，刚刚才回来。
        - id: ch01-b48
          speaker: narrator
          text: 来客一拨接一拨，门口总有人进来，屋里的人也总在追问昨夜的每个细节。老人只好把同一个故事讲完再讲，足足又讲了两个钟头。
        - id: ch01-b49
          speaker: narrator
          text: 学校正在放假，这段日子不办主日学校，可星期日这天，人人还是早早到了教堂。昨夜那场轰动的事被大家从头到尾议论了一遍。有人带来消息，说两个恶棍仍然没有半点踪影。布道结束后，众人顺着过道往外走，撒切尔太太在人群中赶上哈珀太太。
        - id: ch01-b50
          speaker: mrs_thatcher
          text: 我家贝琪还要睡上一整天吗？我早知道她会累坏。
        - id: ch01-b51
          speaker: mrs_harper
          text: 你家贝琪？
          emotion: surprised
        - id: ch01-b52
          speaker: mrs_thatcher
          text: 是啊。她昨晚不是住在你家吗？
        - id: ch01-b53
          speaker: mrs_harper
          text: 没有呀。
        - id: ch01-b54
          speaker: narrator
          text: 撒切尔太太脸色刷地白了，一下跌坐在长椅上。波莉姨妈正同朋友说话，从她们身旁走过。
        - id: ch01-b55
          speaker: aunt_polly
          text: 早上好，撒切尔太太。早上好，哈珀太太。我家那个小子不见了。我还以为汤姆昨晚住在你们一家呢。现在准是怕我收拾他，不敢来教堂。
        - id: ch01-b56
          speaker: narrator
          text: 撒切尔太太无力地摇头，脸色更白了。
        - id: ch01-b57
          speaker: mrs_harper
          text: 他没住在我们家。
        - id: ch01-b58
          speaker: narrator
          text: 哈珀太太也不安起来，波莉姨妈脸上顿时满是焦虑。
        - id: ch01-b59
          speaker: aunt_polly
          text: 乔·哈珀，你今天早上见过汤姆吗？
        - id: ch01-b60
          speaker: joe_harper
          text: 没有，太太。
        - id: ch01-b61
          speaker: aunt_polly
          text: 那你最后一次见他是什么时候？
        - id: ch01-b62
          speaker: narrator
          text: 乔使劲回想，却怎么也想不准。原本向教堂外走的人全都停下脚步，低声议论在一排排长椅间传开，不祥的忧虑爬上每一张脸。大家焦急地逐个询问孩子，又去问带队的年轻老师，可谁也没留意汤姆和贝琪回程时是否上了渡船。那时天色太黑，根本没人想到查看有没有谁落下。终于，一个年轻人脱口说出大家最怕听见的话，他们也许还在山洞里。撒切尔太太当场昏倒，波莉姨妈哭起来，绝望地绞紧双手。
        - id: ch01-b63
          speaker: narrator
          text: 警讯从一张嘴传到另一张嘴，从一群人传到另一群人，又从教堂传遍街巷。不到五分钟，钟声已经疯狂敲响，全镇都惊动了。卡迪夫山上的枪战立刻变得微不足道，两个强盗也被忘得干干净净。人们给马备鞍，给一只只小船配上划手，又下令把渡船开出来。恐慌传开不到半小时，两百个人已经沿着大路和河道涌向山洞。
        - id: ch01-b64
          speaker: narrator
          text: 漫长的下午，村子空得像死了一样。许多女人陪着波莉姨妈和撒切尔太太，想说些话安慰她们，到后来也只能一起流泪。这样陪着哭，反倒比任何劝慰都更有用。全镇又苦等了整整一夜。天终于亮时，洞里传回的只有一句话：“再送些蜡烛来，还要送吃的。”撒切尔太太几乎急疯了，波莉姨妈也一样。撒切尔法官不断从洞里捎来充满希望、给人打气的话，可这些话并没有带来真正的安慰。
        - id: ch01-b65
          speaker: narrator
          text: 快到天亮，老威尔士人拖着疲惫的身子回家，浑身溅满烛油，又沾着泥浆。他发现哈克仍躺在给他准备的床上，正发着高烧，嘴里说着胡话。镇上的医生全去了山洞，道格拉斯寡妇便赶来照料病人。她说，无论哈克是好是坏，还是不好不坏，他都是上帝的孩子。凡属于上帝的，谁也不能丢下不管。老人说哈克身上有好地方，寡妇十分赞同。
        - id: ch01-b66
          speaker: widow_douglas
          text: 那是上帝留在他身上的记号。上帝从不会忘记。凡是他创造的生灵，身上总有这样的记号。
        - id: ch01-b67
          speaker: narrator
          text: 上午，一队队累垮的男人开始零零落落地回村，最强壮的人还留在洞里继续寻找。传回来的消息说，他们已经搜到游人从未踏进的遥远深处，每个角落、每道石缝都会彻底查遍。不管走在迷宫般的通道里哪一处，都能看见远方有灯光忽隐忽现。呼喊和枪声顺着阴森的长廊传来，到了耳边，只剩一阵阵空洞的回响。
        - id: ch01-b68
          speaker: narrator
          text: 在远离寻常路线的地方，搜寻者发现岩壁上用蜡烛烟熏着“贝琪和汤姆”几个字，附近还有一小截被烛油弄脏的丝带。撒切尔太太认出女儿的丝带，抱着它痛哭。她说，这恐怕是自己能得到的最后一件遗物。没有别的纪念品能比它更珍贵，因为在那可怕的死亡到来以前，这东西最后离开了孩子还活着的身体。
        - id: ch01-b69
          speaker: narrator
          text: 山洞深处偶尔闪出一个遥远的光点，人群便爆发出一阵欢呼，二十来个人沿着回声隆隆的通道冲过去。可等待他们的总是叫人心口发冷的失望。那不过是另一个搜寻者手里的灯，孩子们始终不在那里。
        - id: ch01-b70
          speaker: narrator
          text: 可怕的三天三夜拖着沉重的脚步缓慢熬过，整个村子陷入绝望和麻木，谁也没有心思理会别的消息。偏偏就在这时，人们偶然发现，禁酒旅店的老板竟在店里私藏着酒。这件事平日足以轰动全镇，此刻却几乎没让大家的心多跳一下。哈克偶尔清醒过来，虚弱地把话题一点点引到旅店上，最后带着模糊却深沉的恐惧，问寡妇，自从他病倒以后，店里有没有发现什么东西。
        - id: ch01-b71
          speaker: widow_douglas
          text: 发现了。
        - id: ch01-b72
          speaker: narrator
          text: 哈克两眼突然睁得很大，发疯似的猛然从床上撑起身，死死等着寡妇回答。
        - id: ch01-b73
          speaker: huck
          text: 发现了什么？
          emotion: fearful
        - id: ch01-b74
          speaker: widow_douglas
          text: 是酒！那家店已经被查封了。快躺下，孩子，你真把我吓了一跳！
        - id: ch01-b75
          speaker: huck
          text: 求您只告诉我一件事，就一件！那些酒是汤姆·索亚发现的吗？
        - id: ch01-b76
          speaker: narrator
          text: 寡妇一下哭了起来。
        - id: ch01-b77
          speaker: widow_douglas
          text: 别说了，孩子，安静些。我早就告诉你不能讲话，你病得太重了！
          emotion: sad
        - id: ch01-b78
          speaker: narrator
          text: 原来他们只找到了酒。要是发现的是金子，镇上一定早就闹翻了。这样看来，那批宝藏已经永远丢掉，再也找不回来了。可寡妇为什么哭呢？这件事真奇怪。哈克病得昏昏沉沉，只能让这些念头慢慢从脑海里挤过去。
        - id: ch01-b79
          speaker: narrator
          text: 那些念头还没有理出答案，深重的疲倦已经压倒了哈克，把他拖进睡梦。寡妇看着床上这个烧得憔悴不堪的孩子，低声自语。
        - id: ch01-b80
          speaker: widow_douglas
          text: 好了，这个可怜的小家伙总算睡着了。还问是不是汤姆·索亚发现的。唉，要是有人能找到汤姆·索亚该多好！如今还有几个人，既有希望，又有力气继续找下去呢？
          emotion: sad
