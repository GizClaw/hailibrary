  chapters:
    - id: ch01
      title: CHAPTER XXX
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The first hint of Sunday dawn was showing when Huck felt his way up the hill and tapped softly at the old Welshman's door. Everyone inside was asleep, but after the excitement of the night, they were ready to wake at the slightest sound. A voice called down from a window.
        - id: ch01-b02
          speaker: welshman
          text: Who's there?
        - id: ch01-b03
          speaker: huck
          text: Please let me in. It's only Huck Finn.
          emotion: fearful
        - id: ch01-b04
          speaker: welshman
          text: Huck Finn? That name can open this door day or night, lad. You're welcome here!
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: Those words sounded strange to the homeless boy, and sweeter than any he could remember hearing. Huck could not recall anyone ever using the word welcome for him before. The door was unlocked at once, and he came inside. They gave him a chair while the old man and his two tall sons hurried into their clothes.
        - id: ch01-b06
          speaker: welshman
          text: Now, my boy, I hope you've brought a good appetite. Breakfast will be ready at sunrise, and it'll be piping hot. The boys and I hoped you'd come back and stay with us last night.
        - id: ch01-b07
          speaker: huck
          text: I was scared awful bad, so I ran. When the pistols went off, I lit out and never stopped for three miles. I came back to find out what happened. I came before daylight so I wouldn't meet those devils, even if they were dead.
          emotion: fearful
        - id: ch01-b08
          speaker: welshman
          text: Poor lad, you look like you've had a hard night. There's a bed waiting for you after breakfast. But no, those men aren't dead, and we're sorry enough about that. Your directions showed us exactly where to find them. We crept forward on tiptoe until we were only fifteen feet away. That sumach path was as dark as a cellar. Then, of all the miserable luck, I felt a sneeze coming.
        - id: ch01-b09
          speaker: welshman
          text: I fought it, but that sneeze was coming whether I liked it or not. The moment it burst out, the scoundrels began crashing out of the path. I had my pistol raised, so I yelled, "Fire, boys!" and shot toward the rustling. My sons fired too.
        - id: ch01-b10
          speaker: welshman
          text: The villains were gone in a flash, and we chased them downhill through the woods. I don't believe we touched either one. As they ran, they each fired one shot back at us. Both bullets whistled past without doing any harm. We kept after them until we could no longer hear their feet. Then we gave up the chase, went down into town, and roused the constables.
        - id: ch01-b11
          speaker: welshman
          text: The constables gathered a posse to watch the riverbank. At daylight, the sheriff and his men will search the woods, and my boys will join them. A description would help them mightily, but I suppose it was too dark for you to see the rascals.
        - id: ch01-b12
          speaker: huck
          text: Oh, I saw them downtown. That's where I started following them.
        - id: ch01-b13
          speaker: welshman
          text: Splendid! Tell me what they looked like, my boy.
          emotion: surprised
        - id: ch01-b14
          speaker: huck
          text: One was that old deaf-and-dumb Spaniard who's been around here a time or two. The other was a mean-looking fellow in ragged clothes.
        - id: ch01-b15
          speaker: welshman
          text: That's enough. We know those men! We came across them in the woods behind the widow's place once, and they slipped away from us. Boys, go tell the sheriff. You can eat breakfast tomorrow!
        - id: ch01-b16
          speaker: narrator
          text: The Welshman's sons left at once. As they were going through the door, Huck sprang from his chair.
        - id: ch01-b17
          speaker: huck
          text: Oh, please don't tell anybody I was the one who gave them away! Please don't!
          emotion: fearful
        - id: ch01-b18
          speaker: welshman
          text: All right, Huck, if that's what you want. But you deserve the credit for what you did.
        - id: ch01-b19
          speaker: huck
          text: No, no! Please keep it secret!
          emotion: fearful
        - id: ch01-b20
          speaker: narrator
          text: Once the young men had gone, the Welshman assured Huck that none of them would tell. Then he asked why Huck wanted his name hidden.
        - id: ch01-b21
          speaker: narrator
          text: Huck would only say that he already knew too much about one of those men. If the man ever found out, Huck was certain he would be killed. The old man promised again to keep his secret.
        - id: ch01-b22
          speaker: welshman
          text: How did you come to follow those fellows, lad? Did they seem suspicious?
        - id: ch01-b23
          speaker: narrator
          text: Huck went quiet while he put together an answer that would not give too much away.
        - id: ch01-b24
          speaker: huck
          text: Well, everybody says I'm a pretty hard case, and I reckon they're right. Sometimes that keeps me awake. I get to thinking about it and wondering if I could start doing things different. That's what happened last night.
        - id: ch01-b25
          speaker: huck
          text: I couldn't sleep, so around midnight I wandered up the street, still thinking. At that old broken-down brick store by the Temperance Tavern, I leaned against the wall to think some more. Then these two fellows came creeping past with something under an arm. I figured they'd stolen it.
        - id: ch01-b26
          speaker: huck
          text: One of them was smoking, and the other asked for a light. They stopped right in front of me. When their cigars lit their faces, I saw the big one had white whiskers and a patch over his eye, so I knew he was the deaf-and-dumb Spaniard. The other one looked rusty and ragged.
        - id: ch01-b27
          speaker: welshman
          text: Could you really see his ragged clothes by the light of those cigars?
        - id: ch01-b28
          speaker: narrator
          text: That question stopped Huck for a moment.
        - id: ch01-b29
          speaker: huck
          text: Well, I don't rightly know. Somehow it feels like I did.
        - id: ch01-b30
          speaker: welshman
          text: So they went on. What did you do next?
        - id: ch01-b31
          speaker: huck
          text: I followed them, yes. They were sneaking along, and I wanted to know what they were up to. I trailed them to the widow's stile and stood in the dark. I heard the ragged man plead for the widow. Then the Spaniard swore he'd ruin her face, just like I told you and your two sons.
        - id: ch01-b32
          speaker: welshman
          text: What? The deaf-and-dumb man said all of that?
          emotion: surprised
        - id: ch01-b33
          speaker: narrator
          text: Huck had made another dreadful mistake. More than anything, he wanted to keep the Welshman from getting even the faintest hint of who the Spaniard really was. But his own tongue seemed determined to betray him. He tried one explanation, then another, hoping to creep out of the trap. Every attempt only led to a fresh blunder, while the old man's eyes stayed fixed on him.
        - id: ch01-b34
          speaker: welshman
          text: My boy, you needn't fear me. I wouldn't harm one hair on your head for anything in the world. I'd protect you. That Spaniard isn't deaf and dumb. You let that slip, and there's no hiding it now. You know something about him that you want kept secret. Trust me and tell me what it is. I won't betray you.
          emotion: calm
        - id: ch01-b35
          speaker: narrator
          text: Huck studied the old man's honest eyes. Then he leaned close and whispered into his ear.
        - id: ch01-b36
          speaker: huck
          text: He ain't a Spaniard. He's Injun Joe!
          emotion: fearful
        - id: ch01-b37
          speaker: narrator
          text: The Welshman nearly jumped out of his chair. A moment later, the whole thing made sense to him.
        - id: ch01-b38
          speaker: welshman
          text: Now I understand. When you told us about cutting ears and slitting noses, I thought you'd dressed up the story yourself. White men don't usually take revenge that way. But Injun Joe is another matter altogether.
        - id: ch01-b39
          speaker: narrator
          text: They kept talking over breakfast. The Welshman explained that before he and his sons went to bed, they had taken a lantern back to the stile and searched the ground for blood. They found no blood, but they did pick up one large bundle. Before he could say what it held, Huck cried out.
        - id: ch01-b40
          speaker: huck
          text: A bundle of what?
          emotion: fearful
        - id: ch01-b41
          speaker: narrator
          text: The words shot from Huck's pale lips like lightning. His eyes flew wide, and he stopped breathing while he waited. The startled Welshman stared back for three seconds, then five, then ten.
        - id: ch01-b42
          speaker: welshman
          text: Burglars' tools. Why, what's wrong with you?
        - id: ch01-b43
          speaker: narrator
          text: Huck fell back in his chair and drew deep, quiet breaths. He was too grateful to speak. The old man watched him with grave curiosity.
        - id: ch01-b44
          speaker: welshman
          text: Yes, burglars' tools. That news certainly eased your mind. What gave you such a fright? What did you think we had found?
        - id: ch01-b45
          speaker: narrator
          text: Huck was trapped again. The old man waited, watching him more closely every second. Huck would have given anything for a believable answer, but not one came. At last, with no time left to think, he weakly offered the first foolish thing that entered his head.
        - id: ch01-b46
          speaker: huck
          text: Maybe you found Sunday-school books.
        - id: ch01-b47
          speaker: narrator
          text: Huck felt far too miserable to smile, but the Welshman laughed so hard that his whole body shook. He said a laugh like that was worth money because it could cut a man's doctor bill better than anything.
        - id: ch01-b48
          speaker: welshman
          text: Poor lad, you're pale and worn out. You're not well at all, so no wonder your thoughts are wandering. Some rest and sleep should set you right again.
          emotion: calm
        - id: ch01-b49
          speaker: narrator
          text: Huck was annoyed with himself for acting like such a fool and showing so much alarm. After hearing the men talk at the widow's stile, he had given up the idea that the package from the tavern held the treasure. Still, he had only thought it was not the treasure. He had never known for certain. That was why the Welshman's sudden mention of a captured bundle had been too much for him, and all his careful self-control had vanished.
        - id: ch01-b50
          speaker: narrator
          text: On the whole, though, Huck was glad the little scare had happened. Now he knew beyond any doubt that the burglars' bundle was not the treasure, and his mind felt wonderfully easy. In fact, everything seemed to be drifting in just the right direction. The gold must still be in Number Two. The men would surely be caught and jailed that day. Then he and Tom could take the treasure that very night, with no danger and no one there to interrupt them.
        - id: ch01-b51
          speaker: narrator
          text: Just as breakfast ended, someone knocked at the door. Huck darted away to hide. He wanted no connection at all with what had happened during the night. The Welshman let in several ladies and gentlemen, including Widow Douglas. Outside, groups of townspeople were climbing the hill to stare at the stile. The news had spread.
        - id: ch01-b52
          speaker: narrator
          text: The Welshman had to tell his visitors the whole story. Widow Douglas spoke freely of how grateful she was to him for saving her.
        - id: ch01-b53
          speaker: welshman
          text: Please don't thank me, madam. You may owe even more to someone else than you do to my boys and me, but he won't let me give you his name. Without him, we never would have been there.
        - id: ch01-b54
          speaker: narrator
          text: At once, everyone burned to know who the mysterious helper was. Their curiosity grew so enormous that it almost made the attack itself seem like the smaller matter. The Welshman let the secret eat at his visitors, and through them it spread to the whole town. No matter how they wondered, he refused to give up the name. When they had learned every other detail, the widow had a question of her own.
        - id: ch01-b55
          speaker: widow_douglas
          text: I fell asleep over my book and slept through all that noise. Why didn't you wake me?
        - id: ch01-b56
          speaker: welshman
          text: We didn't think there was any need. Those men weren't likely to come back after leaving their tools behind, and waking you would only have frightened you half to death. My three hired men guarded your house for the rest of the night. They just came back.
        - id: ch01-b57
          speaker: narrator
          text: More visitors kept arriving. Each new group wanted every detail, so for another two hours the Welshman had to tell the story over and over from the beginning.
        - id: ch01-b58
          speaker: narrator
          text: There was no Sunday school during the school vacation, but everyone came early to church. All around the building, people talked over the thrilling news. Word arrived that the two villains had still left no trace. After the sermon, as the crowd moved down the aisle, Mrs. Thatcher came up beside Mrs. Harper.
        - id: ch01-b59
          speaker: mrs_thatcher
          text: Is my Becky going to sleep all day? I expected her to be completely worn out.
        - id: ch01-b60
          speaker: mrs_harper
          text: Your Becky?
          emotion: surprised
        - id: ch01-b61
          speaker: mrs_thatcher
          text: Yes. Didn't she stay with you last night?
          emotion: fearful
        - id: ch01-b62
          speaker: mrs_harper
          text: Why, no.
        - id: ch01-b63
          speaker: narrator
          text: Mrs. Thatcher turned pale and sank onto a pew. Just then Aunt Polly passed by, talking briskly with a friend.
        - id: ch01-b64
          speaker: aunt_polly
          text: Good morning, Mrs. Thatcher. Good morning, Mrs. Harper. My boy's gone missing. I reckon Tom stayed at one of your houses last night, and now he's afraid to show himself at church. When I find him, I'll settle with him.
        - id: ch01-b65
          speaker: narrator
          text: Mrs. Thatcher could only shake her head. Her face grew paler still.
        - id: ch01-b66
          speaker: mrs_harper
          text: He didn't stay with us.
        - id: ch01-b67
          speaker: narrator
          text: Uneasiness showed plainly on Aunt Polly's face.
        - id: ch01-b68
          speaker: aunt_polly
          text: Joe Harper, have you seen Tom this morning?
        - id: ch01-b69
          speaker: joe_harper
          text: No, ma'am.
        - id: ch01-b70
          speaker: aunt_polly
          text: When did you see him last?
        - id: ch01-b71
          speaker: narrator
          text: Joe tried to remember when he had last seen Tom, but he could not give a sure answer. By now, people had stopped filing out of the church. Whispers traveled from one person to the next, and a dark uneasiness settled over every face. They questioned the children anxiously, then questioned the young teachers. No one had noticed whether Tom and Becky were aboard the ferryboat on the trip home. It had been dark, and not one person had thought to ask whether anybody was missing.
        - id: ch01-b72
          speaker: narrator
          text: At last, one young man blurted out the fear that was rising among them.
        - id: ch01-b73
          speaker: young_man
          text: What if they're still inside the cave?
          emotion: fearful
        - id: ch01-b74
          speaker: narrator
          text: Mrs. Thatcher fainted. Aunt Polly began to cry and wring her hands.
        - id: ch01-b75
          speaker: narrator
          text: The alarm raced from person to person, from group to group, and from street to street. Within five minutes, bells were clanging wildly and the whole town was moving. The trouble on Cardiff Hill suddenly shrank into nothing. Everyone forgot the burglars. Men rushed to saddle horses. Crews piled into skiffs, and orders went out for the ferryboat to join the search.
        - id: ch01-b76
          speaker: narrator
          text: The dreadful news was not even half an hour old when two hundred men were already pouring toward the cave. Some hurried down the main road, while others made their way along the river.
        - id: ch01-b77
          speaker: narrator
          text: Through the whole long afternoon, the village felt empty and dead. Many of the women came to sit with Aunt Polly and Mrs. Thatcher. They tried to offer comfort, but words could do very little. So they cried beside the two mothers instead, and sharing their grief helped more than anything they could have said.
        - id: ch01-b78
          speaker: narrator
          text: All through the weary night, the town waited for news. Morning finally came, but the only message from the cave was a demand for more supplies.
        - id: ch01-b79
          speaker: messenger
          text: Send more candles, and send food.
        - id: ch01-b80
          speaker: narrator
          text: Mrs. Thatcher was nearly out of her mind with fear, and Aunt Polly was not much better. Judge Thatcher kept sending messages of hope and encouragement from inside the cave, but the words brought no real comfort to anyone waiting at home.
        - id: ch01-b81
          speaker: narrator
          text: Near daylight, the old Welshman returned home from the cave. Candle grease spotted his clothes, clay was smeared all over him, and exhaustion had nearly finished him. He found Huck still lying in the bed they had given him. The boy was burning with fever and talking wildly. Every doctor was away helping at the cave, so Widow Douglas came and took charge of the sick boy herself.
        - id: ch01-b82
          speaker: narrator
          text: She said she would do everything she could for him. Whether Huck was good, bad, or somewhere between, he belonged to the Lord, and nothing belonging to the Lord ought to be neglected. The Welshman answered that Huck had good places in him.
        - id: ch01-b83
          speaker: widow_douglas
          text: You can be sure of that. Those good places are the Lord's mark. He never leaves it off. He puts it somewhere on every creature he makes.
        - id: ch01-b84
          speaker: narrator
          text: Early that morning, parties of worn-out searchers began straggling back into the village. The strongest townsmen stayed behind and kept looking. All anyone could learn was that they were searching distant reaches of the cavern where no visitor had ever gone before. They meant to examine every corner and every narrow crack before they stopped.
        - id: ch01-b85
          speaker: narrator
          text: Wherever a man wandered in that maze of passages, he could see other searchers' lights flickering far away in the distance. Calls rang out through the darkness. Now and then, a pistol shot cracked, and its hollow echoes traveled down the long, gloomy stone aisles.
        - id: ch01-b86
          speaker: narrator
          text: In one place, far beyond the part tourists usually visited, searchers found the names Becky and Tom traced on a rocky wall with candle smoke. Nearby lay a small ribbon stained with candle grease. Mrs. Thatcher recognized it and wept over it. She said it would be the last thing she ever had of her child. No other keepsake could ever be so precious, because this little ribbon had been the last thing to part from Becky's living body before the awful death her mother now feared had come.
        - id: ch01-b87
          speaker: narrator
          text: People said that now and then, deep in the cave, a tiny speck of light would appear far away. At once, a glorious cheer would burst from the searchers, and twenty men would go racing down the echoing passage toward it. Every time, that rush of hope ended in the same sickening disappointment. The children were not there. The distant gleam belonged only to another searcher.
