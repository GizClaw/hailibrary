cover_prompt: |-
  A wordless cover scene beside the Mississippi River in the 1840s shows Tom Sawyer and Huckleberry Finn embarking on an adventure. Tom is a wiry boy with tousled brown hair, a straw hat, loose white shirt, suspenders, rolled trousers, and bare feet; Huck is leaner, sun-browned, and dressed in an oversized battered hat and patched castoff clothes. They balance at the bow of a rough log raft carrying a lantern, fishing line, and tied bundle, while the whitewashed fence and village rooftops recede along the bank. Tom points toward a wooded island through morning mist, making the shared decision to explore the focal action. Use a low river-level view with the raft cutting diagonally forward and broad quiet sky above the distant shore. Keep clothing, raft, and river settlement grounded in antebellum Missouri and independent of film or television adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
