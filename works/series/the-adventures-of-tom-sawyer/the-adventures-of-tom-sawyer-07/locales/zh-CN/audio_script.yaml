audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    joe_harper:
      display_name: 乔·哈珀
      tts:
        delivery: 直爽好胜，生气时毫不退让
        timbre: 清亮稚嫩
        pace: 明快
        pitch: 中高音
    becky:
      display_name: 贝琪·撒切尔
      tts:
        delivery: 天真活泼，害羞时轻柔，受伤时倔强
        timbre: 清甜稚嫩
        pace: 轻快自然
        pitch: 高音
  chapters:
    - id: ch01
      title: 困倦的课堂
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 汤姆越想专心看书，心思越往别处跑。最后，他叹口气，打个哈欠，彻底放弃了。午休迟迟不来，空气像死了一样，连一丝风也没有。这真是个困得不能再困的日子。二十五个学生念书的嗡嗡声像蜂群低鸣，听着更叫人犯困。远处的卡迪夫山沐浴在灼热的阳光里，柔和的绿坡隔着闪烁的热雾，泛出远方的淡紫色。几只鸟懒洋洋地浮在高空。除此以外，能看见的活物只剩几头牛，连牛也睡着了。汤姆只想逃出教室，或者找点有趣的事熬过这段时间。
        - id: ch01-b02
          speaker: narrator
          text: 他的手无意间摸进口袋，脸上忽然亮了起来。那份感激简直就是祷告，只是汤姆自己不知道。他偷偷掏出火帽盒，把扁虱放到又长又平的课桌上。扁虱此刻大概也感激得想要祷告。可它高兴得太早，才满怀谢意地往前爬，汤姆就用针挡住去路，逼它转了个方向。
        - id: ch01-b03
          speaker: narrator
          text: 坐在旁边的乔·哈珀刚才也无聊得要命，一见这个游戏，马上来了精神。两个男孩平日是最要好的朋友，到了星期六却总要打得像仇人。乔从衣襟上拔下一根针，也操练起这个小囚犯。两个人越玩越起劲，谁都嫌对方碍手碍脚。汤姆便拿来乔的写字石板，从中间画了一条线。
        - id: ch01-b04
          speaker: tom
          text: “它在你那边的时候，你尽管拨，我不碰。可它一跑到我这边，只要我不让它越线，你也不能碰。”
        - id: ch01-b05
          speaker: joe_harper
          text: “行啊，开始吧，让它动起来。”
        - id: ch01-b06
          speaker: narrator
          text: 扁虱很快逃过汤姆的针，爬过了那条“赤道”。乔折腾一阵，它又挣脱出来，掉头爬了回去。就这样，它一次次换着地盘。一个男孩拿针追它，另一个就在旁边死死盯着，两个人的兴致谁也不比谁少。两颗脑袋一同低垂在石板上方，别的事全忘了。后来，运气像是选中了乔，留在他那边不走了。扁虱左冲右突，什么路都试遍，急得像两个男孩一样。它一次又一次快要冲过边界，汤姆的手指也一次又一次痒得抽动，可乔总能灵巧地用针把它截回去，牢牢守着自己的地盘。汤姆终于忍受不住，伸针帮了一下。
        - id: ch01-b07
          speaker: joe_harper
          text: “汤姆，别碰它！”
          emotion: angry
        - id: ch01-b08
          speaker: tom
          text: “我只想轻轻拨它一下，乔。”
        - id: ch01-b09
          speaker: joe_harper
          text: “不行，这不公平。你把手拿开。”
          emotion: angry
        - id: ch01-b10
          speaker: tom
          text: “真见鬼，我又不会使劲拨。”
        - id: ch01-b11
          speaker: joe_harper
          text: “我说了，不许碰！”
          emotion: angry
        - id: ch01-b12
          speaker: tom
          text: “我偏要碰！”
          emotion: angry
        - id: ch01-b13
          speaker: joe_harper
          text: “你敢！它现在在我这边。”
          emotion: angry
        - id: ch01-b14
          speaker: tom
          text: “乔·哈珀，你说，这扁虱到底是谁的？”
        - id: ch01-b15
          speaker: joe_harper
          text: “管它是谁的！既然在我这边，你就不能动。”
          emotion: angry
        - id: ch01-b16
          speaker: tom
          text: “我还非动不可。扁虱是我的，我想怎么摆弄就怎么摆弄，死也不怕！”
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: 啪！一记教鞭重重落在汤姆肩上，紧接着，乔也挨了同样一下。接下来的两分钟里，两件外套上灰尘乱飞，全校学生都看得很快活。原来老师早就踮着脚走下教室，站在他们身后，四周也早已悄悄安静下来。两个男孩太入迷，什么都没发现。老师欣赏了好一会儿这场表演，才亲自给它添上一点新变化。
    - id: ch02
      title: 只属于两个人的学校
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 中午一放学，汤姆立刻跑到贝琪·撒切尔身边，贴着她的耳朵安排起来。
        - id: ch02-b02
          speaker: tom
          text: “你戴上帽子，装作回家。到了街角就甩开他们，从小巷绕回来。我也往另一边走，用同样的办法脱身。”
        - id: ch02-b03
          speaker: narrator
          text: 两人各自跟着一群学生离开，不久就在小巷尽头碰了头。等他们回到学校，整座校舍里只剩下他们两个。他们并肩坐在写字石板前。汤姆把石笔交给贝琪，又把她的手握在自己手里，领着她画出另一幢模样惊人的房子。等画画慢慢失去趣味，他们便聊起天来。汤姆快活得像在幸福里游泳。
        - id: ch02-b04
          speaker: tom
          text: “你喜欢老鼠吗？”
        - id: ch02-b05
          speaker: becky
          text: “才不喜欢！我恨死老鼠了！”
        - id: ch02-b06
          speaker: tom
          text: “我也讨厌活老鼠。我是问死的那种，用绳子拴住尾巴，绕着脑袋甩。”
        - id: ch02-b07
          speaker: becky
          text: “反正我不喜欢老鼠。我喜欢嚼口香糖。”
        - id: ch02-b08
          speaker: tom
          text: “口香糖当然好！我现在有一块就好了。”
        - id: ch02-b09
          speaker: becky
          text: “我有呀。可以给你嚼一会儿，不过你得还给我。”
        - id: ch02-b10
          speaker: narrator
          text: 这个办法两人都满意。他们轮流嚼着那块口香糖，两条腿在长凳下晃来晃去，心里别提多美了，简直快活得没边。
        - id: ch02-b11
          speaker: tom
          text: “你去过马戏团吗？”
        - id: ch02-b12
          speaker: becky
          text: “去过。只要我听话，爸爸以后还会带我去。”
        - id: ch02-b13
          speaker: tom
          text: “我去过三四次，算起来可多了。教堂哪能跟马戏团比，马戏团从头到尾都有热闹看。我长大以后要去当小丑。”
        - id: ch02-b14
          speaker: becky
          text: “真的？那可真好。小丑身上一块一块的，多漂亮呀。”
        - id: ch02-b15
          speaker: tom
          text: “对呀，而且挣的钱可多了。本·罗杰斯说，一天差不多有一块钱。对了，贝琪，你订过婚吗？”
        - id: ch02-b16
          speaker: becky
          text: “订婚是什么？”
        - id: ch02-b17
          speaker: tom
          text: “就是两个人约好，以后要结婚。”
        - id: ch02-b18
          speaker: becky
          text: “我没有。也许我想订吧，可那到底是什么样的？”
        - id: ch02-b19
          speaker: tom
          text: “没什么难的。你告诉一个男孩，说自己永远永远只要他一个，再亲一下，就行了。谁都会。”
        - id: ch02-b20
          speaker: becky
          text: “为什么还要亲一下？”
        - id: ch02-b21
          speaker: tom
          text: “因为……反正大家都是那么做的。”
        - id: ch02-b22
          speaker: becky
          text: “所有人都这样吗？”
        - id: ch02-b23
          speaker: tom
          text: “相互喜欢的人都这样。你还记得我在石板上写的那句话吗？”
        - id: ch02-b24
          speaker: becky
          text: “记得。”
        - id: ch02-b25
          speaker: tom
          text: “那句话是什么？”
        - id: ch02-b26
          speaker: becky
          text: “我不告诉你。”
        - id: ch02-b27
          speaker: tom
          text: “那让我告诉你，好不好？”
        - id: ch02-b28
          speaker: becky
          text: “好吧，不过现在不行，明天再说。”
        - id: ch02-b29
          speaker: tom
          text: “别等下次，就现在吧。求你了，贝琪，我会说得特别小声。”
    - id: ch03
      title: 小小的订婚
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 贝琪没有回答。汤姆把她的沉默当成了同意，伸手搂住她的腰，把嘴贴近她耳边，极轻地说出了那句话。
        - id: ch03-b02
          speaker: tom
          text: “现在该你了，也照样说给我听。”
        - id: ch03-b03
          speaker: narrator
          text: 贝琪躲了一会儿，终于答应了。
        - id: ch03-b04
          speaker: becky
          text: “你先把脸转过去，不许偷看，我才说。还有，你永远不能告诉别人。汤姆，你答应我，真的不会说出去吧？”
        - id: ch03-b05
          speaker: tom
          text: “绝对不会。真的，我发誓不会。来吧，贝琪。”
        - id: ch03-b06
          speaker: narrator
          text: 汤姆转过脸。贝琪怯生生地探过身子，呼出的气拂动了他的卷发。
        - id: ch03-b07
          speaker: becky
          text: “我——爱——你！”
        - id: ch03-b08
          speaker: narrator
          text: 她说完就跳开了，绕着课桌和长凳一圈圈地跑。汤姆在后面追，贝琪最后躲进墙角，用白围裙蒙住脸。汤姆搂住她的脖子，不住地央求。
        - id: ch03-b09
          speaker: tom
          text: “贝琪，都办完啦，只差亲一下。这个一点也不可怕，真的没什么。求你了。”
        - id: ch03-b10
          speaker: narrator
          text: 他拉着她的围裙和两只手。过了一会儿，贝琪终于不再抵抗，垂下双手。她挣扎得满脸通红，还是抬起脸来。汤姆吻了吻她鲜红的嘴唇。
        - id: ch03-b11
          speaker: tom
          text: “现在全办完了。以后你永远不许喜欢别人，也不能嫁给别人，只能喜欢我。永永远远都是这样。你答应吗？”
        - id: ch03-b12
          speaker: becky
          text: “我答应。我永远只喜欢你，只嫁给你。可你也不能娶别人。”
        - id: ch03-b13
          speaker: tom
          text: “当然啦，这本来就是规矩。以后上学、放学的时候，只要没人看着，你就跟我一起走。参加聚会时，你选我，我也选你。订了婚的人全都这样。”
        - id: ch03-b14
          speaker: becky
          text: “真好呀。我以前从来没听说过。”
        - id: ch03-b15
          speaker: tom
          text: “可有意思了！从前我和艾米·劳伦斯就——”
        - id: ch03-b16
          speaker: narrator
          text: 贝琪猛地睁大眼睛。汤姆这才明白自己说错了话，慌忙闭上嘴。
    - id: ch04
      title: 破碎的心
      blocks:
        - id: ch04-b01
          speaker: becky
          text: “汤姆！原来我不是第一个跟你订婚的人！”
          emotion: sad
        - id: ch04-b02
          speaker: narrator
          text: 小姑娘听完，伤心得哭了起来。汤姆见她落泪，赶紧开口安慰。
        - id: ch04-b03
          speaker: tom
          text: “别哭呀，贝琪。我早就不喜欢她了。”
        - id: ch04-b04
          speaker: becky
          text: “你还喜欢她，汤姆。你明明就喜欢。”
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: 汤姆想搂住她的脖子，她却把他推开，转身面对墙壁，哭个不停。他嘴里说着安慰的话，又试了一回，仍然被推开。汤姆的傲气也上来了，转身大步走出校舍。他在外面不安地来回走，隔一会儿就朝门口望望，盼着贝琪后悔，主动出来找他。可她一直没来。汤姆越来越难受，也开始担心这回真的是自己错了。
        - id: ch04-b06
          speaker: narrator
          text: 到了这个地步，再让汤姆主动求和可太难了。不过，他还是硬着头皮走进教室。贝琪仍旧站在后面的墙角，脸对着墙，抽抽噎噎地哭。汤姆心里一阵刺痛。他走到她身边，站了一会儿，根本不知道该怎么开口。
        - id: ch04-b07
          speaker: tom
          text: “贝琪，我……我谁也不喜欢，只喜欢你。”
        - id: ch04-b08
          speaker: narrator
          text: 贝琪没有回答，只有哭声。
        - id: ch04-b09
          speaker: tom
          text: “贝琪，你就跟我说句话，好不好？”
        - id: ch04-b10
          speaker: narrator
          text: 她还是只顾抽泣。汤姆拿出自己最宝贝的东西，那是壁炉柴架顶上的一个黄铜圆头。他从贝琪身旁递过去，想让她看见。
        - id: ch04-b11
          speaker: tom
          text: “求你了，贝琪，你把它收下吧。”
        - id: ch04-b12
          speaker: narrator
          text: 贝琪一巴掌把它打到地上。汤姆立刻走出校舍，翻过一道道山坡，越走越远。这一天，他再也不回学校了。过了一会儿，贝琪才觉得不对。她冲到门口，已经看不见汤姆。她又飞快地跑到操场上，那里也没有他的影子。她这才着急地喊了起来。
        - id: ch04-b13
          speaker: becky
          text: “汤姆！回来呀，汤姆！”
          emotion: sad
        - id: ch04-b14
          speaker: narrator
          text: 贝琪屏住呼吸仔细听，却没有人回答。陪着她的，只有寂静和孤单。她只好坐下来重新哭泣，一面不停责怪自己。这时候，学生们陆续回来了，她只能把悲伤藏起来，强忍住那颗破碎的心，独自背起漫长、沉闷而疼痛的一下午。周围全是陌生人，没有一个能听她诉说，更没有一个能同她分担忧愁。
