  chapters:
    - id: ch01
      title: CHAPTER VII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The harder Tom tried to keep his mind on his book, the farther his thoughts wandered. At last he sighed, yawned, and gave up. Noon recess seemed as if it would never come. The air did not move. It was the sleepiest kind of day. Twenty-five students murmured over their lessons, making a drowsy sound like bees. Far off in the blazing sun, green Cardiff Hill shimmered through the heat and looked purple with distance. A few birds drifted high overhead. The only other living things in sight were some sleeping cows. Tom longed to be free, or at least to find something interesting enough to fill the miserable time.
        - id: ch01-b02
          speaker: narrator
          text: His hand slipped into his pocket, and his face suddenly brightened. He was so grateful for what he found that it was almost a prayer, though Tom did not know it. Out came the little box that had once held a percussion cap. Tom opened it, freed the tick inside, and set him on the long, flat desk. The tick started off at once, probably just as thankful to be loose. His thanks came too soon. Tom used a pin to turn him around and send him another way.
        - id: ch01-b03
          speaker: narrator
          text: Joe Harper, Tom's closest friend, sat beside him. He had been suffering through the slow morning too, and this new amusement caught him at once. Tom and Joe were sworn friends all week and bitter enemies every Saturday. Joe pulled a pin from his coat and joined in exercising the prisoner. But before long, each boy was getting in the other's way. Tom laid Joe's slate on the desk and drew a line straight down the middle.
        - id: ch01-b04
          speaker: tom
          text: While he's on your side, you can poke him and I won't touch him. But if he gets away and crosses onto my side, you have to leave him alone as long as I can keep him here.
        - id: ch01-b05
          speaker: joe
          text: All right. Go on and get him moving.
        - id: ch01-b06
          speaker: narrator
          text: The tick soon escaped Tom and crossed the line. Joe chased him around for a while, until he broke away and went back to Tom. Again and again he changed sides. One boy would bend over the slate and worry the tick with his pin, while the other watched just as closely and waited for his chance. Their heads nearly touched over the slate. Both boys were completely lost in the game. Nothing else in the world existed for either of them.
        - id: ch01-b07
          speaker: narrator
          text: Then luck seemed to settle on Joe's side. The tick tried one path, then another, then another, and grew almost as excited and anxious as the boys. Each time he seemed to have victory within reach, Tom's fingers twitched, ready for his turn. But Joe's pin neatly headed the tick off and kept him there. This happened time after time. At last Tom could not bear it. The temptation was too much, and he reached across with his own pin.
        - id: ch01-b08
          speaker: joe
          text: Tom, leave him alone.
          emotion: angry
        - id: ch01-b09
          speaker: tom
          text: I only want to give him one little poke, Joe.
        - id: ch01-b10
          speaker: joe
          text: No. That's not fair. Keep your pin away from him.
          emotion: angry
        - id: ch01-b11
          speaker: tom
          text: Oh, I won't bother him much.
        - id: ch01-b12
          speaker: joe
          text: I said leave him alone.
          emotion: angry
        - id: ch01-b13
          speaker: tom
          text: I won't!
          emotion: angry
        - id: ch01-b14
          speaker: joe
          text: You will! He's on my side of the line.
          emotion: angry
        - id: ch01-b15
          speaker: tom
          text: Listen, Joe Harper. Who owns that tick?
          emotion: angry
        - id: ch01-b16
          speaker: joe
          text: I don't care who owns him. He's on my side, so you can't touch him.
          emotion: angry
        - id: ch01-b17
          speaker: tom
          text: You bet I can. He's my tick, and I'll do whatever I please with him, even if it kills me!
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: A tremendous whack landed on Tom's shoulders, and another came down on Joe's. For two minutes, dust flew from both jackets while the whole school enjoyed the show. The boys had been so absorbed that they never noticed the room grow quiet some time before. Their teacher had tiptoed down the aisle and stood over them. He watched a good part of their performance before adding his own little change to it.
        - id: ch01-b19
          speaker: narrator
          text: When school let out at noon, Tom hurried to Becky Thatcher and whispered in her ear.
        - id: ch01-b20
          speaker: tom
          text: Put on your bonnet and act like you're going home. At the corner, slip away from the others, go down the lane, and come back. I'll fool my group the same way from the other direction.
        - id: ch01-b21
          speaker: narrator
          text: Becky left with one group of students, and Tom went with another. Before long, they met at the bottom of the lane. When they returned to the schoolhouse, they had it all to themselves. They sat together with a slate between them. Tom put the pencil in Becky's hand, held her hand in his, and guided it until they had drawn another astonishing house. When drawing stopped being fun, they began to talk. Tom was floating in happiness.
        - id: ch01-b22
          speaker: tom
          text: Do you like rats?
        - id: ch01-b23
          speaker: becky
          text: No! I hate them!
          emotion: disgusted
        - id: ch01-b24
          speaker: tom
          text: So do I, when they're alive. I mean dead rats. You tie one to a string and swing it around your head.
        - id: ch01-b25
          speaker: becky
          text: I don't much like rats either way. I like chewing gum.
        - id: ch01-b26
          speaker: tom
          text: Oh, yes! I wish I had some right now.
        - id: ch01-b27
          speaker: becky
          text: You do? I have some. You can chew it for a while, but then you have to give it back.
        - id: ch01-b28
          speaker: narrator
          text: Tom agreed. They took turns chewing the gum and swung their legs against the bench, perfectly content.
        - id: ch01-b29
          speaker: tom
          text: Have you ever been to a circus?
        - id: ch01-b30
          speaker: becky
          text: Yes. Pa says he'll take me again sometime if I'm good.
        - id: ch01-b31
          speaker: tom
          text: I've been three or four times. Lots of times. A church isn't anything next to a circus. Something is always happening there. When I grow up, I'm going to be a circus clown.
        - id: ch01-b32
          speaker: becky
          text: You are? That'll be wonderful. Clowns look so lovely, all covered with spots.
          emotion: happy
        - id: ch01-b33
          speaker: tom
          text: That's right. And they make piles of money. Ben Rogers says they get almost a dollar every day. Becky, have you ever been engaged?
        - id: ch01-b34
          speaker: becky
          text: What does that mean?
        - id: ch01-b35
          speaker: tom
          text: Engaged to be married.
        - id: ch01-b36
          speaker: becky
          text: No.
        - id: ch01-b37
          speaker: tom
          text: Would you like to be?
        - id: ch01-b38
          speaker: becky
          text: Maybe. I don't know. What do you have to do?
        - id: ch01-b39
          speaker: tom
          text: It isn't hard. You tell a boy you'll never have anybody else, ever, ever, ever. Then you kiss. That's all. Anybody can do it.
        - id: ch01-b40
          speaker: becky
          text: Kiss? Why do you have to kiss?
        - id: ch01-b41
          speaker: tom
          text: Well, because... that's what people always do.
        - id: ch01-b42
          speaker: becky
          text: Everybody does?
        - id: ch01-b43
          speaker: tom
          text: Of course. Everybody who's in love. Remember what I wrote on the slate?
        - id: ch01-b44
          speaker: becky
          text: Y-yes.
        - id: ch01-b45
          speaker: tom
          text: What did it say?
        - id: ch01-b46
          speaker: becky
          text: I won't tell you.
        - id: ch01-b47
          speaker: tom
          text: Should I tell you?
        - id: ch01-b48
          speaker: becky
          text: Y-yes, but another time.
        - id: ch01-b49
          speaker: tom
          text: No, tell me now.
        - id: ch01-b50
          speaker: becky
          text: Not now. Tomorrow.
        - id: ch01-b51
          speaker: tom
          text: Oh, please, Becky. Now. I'll whisper it so softly.
        - id: ch01-b52
          speaker: narrator
          text: Becky hesitated. Tom took her silence as permission. He put an arm around her waist, leaned close to her ear, and whispered the words. Then he asked her to whisper the very same thing back to him.
        - id: ch01-b53
          speaker: becky
          text: Turn your face away so you can't see me. Then I'll say it. But you must never tell anyone. You won't, will you, Tom? Promise you won't.
        - id: ch01-b54
          speaker: tom
          text: I promise I won't. Go on, Becky.
        - id: ch01-b55
          speaker: narrator
          text: Tom turned his face away. Becky leaned toward him so timidly that her breath stirred his curls.
        - id: ch01-b56
          speaker: becky
          text: I love you!
        - id: ch01-b57
          speaker: narrator
          text: She sprang away and raced around the desks and benches, with Tom chasing after her. At last she hid in a corner and covered her face with her little white apron. Tom put his arms around her neck and begged her to finish the engagement. Only the kiss remained, he told her. There was nothing to fear. He tugged at her apron and her hands.
        - id: ch01-b58
          speaker: tom
          text: Please, Becky. The kiss is all that's left. Don't be scared. It's nothing at all.
        - id: ch01-b59
          speaker: narrator
          text: After a while, Becky gave in. Her hands dropped, and she raised her face, glowing from the struggle. Tom kissed her red lips.
        - id: ch01-b60
          speaker: tom
          text: Now we're really engaged. From now on, you can never love anybody but me, and you can never marry anybody but me. Not ever. Will you promise?
        - id: ch01-b61
          speaker: becky
          text: Yes. I'll never love anybody but you, Tom, and I'll never marry anyone else. But you must never marry anybody but me either.
        - id: ch01-b62
          speaker: tom
          text: Certainly. That's part of being engaged. When we come to school or go home, we have to walk together if no one is watching. At parties, you choose me and I choose you. That's how engaged people do it.
        - id: ch01-b63
          speaker: becky
          text: It's so nice. I never knew about it before.
          emotion: happy
        - id: ch01-b64
          speaker: tom
          text: Oh, it's great fun! Why, Amy Lawrence and I—
        - id: ch01-b65
          speaker: narrator
          text: Becky's wide eyes showed Tom exactly what he had done. He stopped, confused.
        - id: ch01-b66
          speaker: becky
          text: Oh, Tom! Then I'm not the first girl you've been engaged to!
          emotion: surprised
        - id: ch01-b67
          speaker: narrator
          text: Becky began to cry.
        - id: ch01-b68
          speaker: tom
          text: Please don't cry, Becky. I don't care about Amy anymore.
        - id: ch01-b69
          speaker: becky
          text: Yes, you do, Tom. You know you do.
          emotion: sad
        - id: ch01-b70
          speaker: narrator
          text: Tom tried to put his arm around her neck, but she pushed him away, turned toward the wall, and kept crying. He tried again with gentle words ready, and again she refused him. Then Tom's pride rose. He marched outside and stayed there for a while, restless and uneasy. Every so often he looked at the door, hoping Becky would regret what she had done and come looking for him. She did not.
        - id: ch01-b71
          speaker: narrator
          text: Soon Tom felt miserable and began to fear that he was the one in the wrong. It was hard for him to make the first move again. At last he gathered his courage and went back inside. Becky was still in the corner with her face to the wall, sobbing. Tom's heart hurt at the sight. He stood beside her for a moment, unsure what to do.
        - id: ch01-b72
          speaker: tom
          text: Becky, I... I don't care about anybody but you.
          emotion: sad
        - id: ch01-b73
          speaker: narrator
          text: Becky answered only with sobs.
        - id: ch01-b74
          speaker: tom
          text: Becky, please. Won't you say something?
          emotion: sad
        - id: ch01-b75
          speaker: narrator
          text: She sobbed even harder. Tom took out his greatest treasure, a brass knob from the top of a fireplace andiron. He held it around in front of her so she could see it.
        - id: ch01-b76
          speaker: tom
          text: Please, Becky. Will you take it?
          emotion: sad
        - id: ch01-b77
          speaker: narrator
          text: Becky knocked the treasure to the floor. Tom marched out of the schoolhouse, crossed the hills, and went far away. He would not return to school that day.
        - id: ch01-b78
          speaker: narrator
          text: After a moment, Becky began to worry. She ran to the door, but Tom was nowhere in sight. She hurried around to the schoolyard. He was not there either.
        - id: ch01-b79
          speaker: becky
          text: Tom! Come back, Tom!
          emotion: sad
        - id: ch01-b80
          speaker: narrator
          text: Becky listened as hard as she could. No answer came. She had nothing with her but silence and loneliness. She sat down and cried again, blaming herself. Then the other students began to return. Becky had to hide her sorrow, quiet her broken heart, and face a long, dull, aching afternoon among people who felt like strangers, with no one there to share her grief.
