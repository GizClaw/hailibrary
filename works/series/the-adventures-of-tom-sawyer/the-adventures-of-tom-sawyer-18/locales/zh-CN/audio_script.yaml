audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    becky:
      display_name: 贝琪
      tts:
        delivery: 天真敏感，情绪真挚而克制
        timbre: 清甜稚嫩
        pace: 轻缓
        pitch: 高音
    aunt_polly:
      display_name: 波莉姨妈
      tts:
        delivery: 心直口快，严厉里藏着深厚疼爱
        timbre: 温厚而有力
        pace: 适中
        pitch: 中音
    mary:
      display_name: 玛丽
      tts:
        delivery: 温柔真诚，沉静体贴
        timbre: 柔和稚嫩
        pace: 舒缓
        pitch: 中高音
    sid:
      display_name: 席德
      tts:
        delivery: 一本正经，话里带着自以为是
        timbre: 清细稚嫩
        pace: 平稳
        pitch: 中高音
    amy:
      display_name: 艾米
      tts:
        delivery: 活泼亲热，满心欢喜时轻快明朗
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 高音
    mary_austin:
      display_name: 玛丽·奥斯汀
      tts:
        delivery: 爽快友善，带着孩子气的热心
        timbre: 清亮稚嫩
        pace: 适中
        pitch: 高音
    grace_miller:
      display_name: 格雷丝·米勒
      tts:
        delivery: 开朗直接，兴奋而有礼貌
        timbre: 清甜稚嫩
        pace: 轻快
        pitch: 高音
    sally_rogers:
      display_name: 萨莉·罗杰斯
      tts:
        delivery: 天真爽直，问话简洁明快
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 高音
    susy_harper:
      display_name: 苏茜·哈珀
      tts:
        delivery: 亲切活泼，说话干脆自然
        timbre: 清脆稚嫩
        pace: 适中
        pitch: 高音
    alfred:
      display_name: 阿尔弗雷德
      tts:
        delivery: 讲究体面，热心中带着少年人的骄傲
        timbre: 清朗稚嫩
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 汤姆的神奇梦境
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 汤姆藏着一个天大的秘密。他和海盗弟兄们早就计划好了，要悄悄回家，亲自参加自己的葬礼。星期六黄昏，他们骑着圆木划到密苏里一岸，在村子下游五六英里的地方上了岸。他们先睡在镇外的树林里，快天亮时才穿过偏僻的小路和巷子，溜进教堂楼座，又在一堆破长椅中间睡了一觉。
        - id: ch01-b02
          speaker: narrator
          text: 到了星期一早饭时，波莉姨妈和玛丽都格外疼爱汤姆，把他照顾得周周到到。桌上的话也比平常多。说着说着，波莉姨妈提起了汤姆的那场恶作剧。
        - id: ch01-b03
          speaker: aunt_polly
          text: “汤姆，你们为了自己玩得痛快，让大家担心了差不多一个星期。这个玩笑的确高明，可你也太狠心了，竟舍得让我这样受罪。你既然能骑着圆木回来参加葬礼，为什么不能回来给我透个信，让我知道你没有死，只是跑出去胡闹了呢？”
          emotion: sad
        - id: ch01-b04
          speaker: mary
          text: “汤姆，你本来做得到。我相信你只要想起来，就一定会回来告诉我们。”
        - id: ch01-b05
          speaker: aunt_polly
          text: “汤姆，你真的会吗？要是你当时想到了，真的会给我报信吗？”
        - id: ch01-b06
          speaker: tom
          text: “我……我也说不准。那样一来，整个计划就全毁了。”
        - id: ch01-b07
          speaker: aunt_polly
          text: “我还以为你总有那么疼我呢。就算最后没来，只要你还惦记过这件事，我心里也会好受一点。”
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: 姨妈伤心的口气叫汤姆很不自在，玛丽赶紧替他解围。
        - id: ch01-b09
          speaker: mary
          text: “姨妈，您别怪他。汤姆一向冒冒失失，做什么都急着往前冲，哪里还顾得上想别的。”
        - id: ch01-b10
          speaker: aunt_polly
          text: “这才更可惜。席德就想得到，而且他想到了就一定会回来做。汤姆，将来等一切都来不及了，你会后悔当初没有多疼我一点。这原本不费你多少事。”
        - id: ch01-b11
          speaker: tom
          text: “姨妈，您知道我心里是疼您的。”
        - id: ch01-b12
          speaker: aunt_polly
          text: “那你就该让我从你的行动里看出来。”
        - id: ch01-b13
          speaker: tom
          text: “我现在真后悔没有想到。不过，我还梦见您了。这总能算一点吧？”
        - id: ch01-b14
          speaker: aunt_polly
          text: “这算不了多少，连猫也会梦见人。不过总比没有好。你梦见什么了？”
        - id: ch01-b15
          speaker: tom
          text: “星期三晚上，我梦见您坐在那边的床旁，席德坐在木柴箱旁边，玛丽就坐在席德身边。”
        - id: ch01-b16
          speaker: aunt_polly
          text: “我们当时正是这么坐的，而且一向这么坐。你的梦还肯替我们费这点心，我已经很高兴了。”
        - id: ch01-b17
          speaker: tom
          text: “我还梦见乔·哈珀的妈妈也来了。”
        - id: ch01-b18
          speaker: aunt_polly
          text: “她那晚真的来了！你还梦见别的没有？”
          emotion: surprised
        - id: ch01-b19
          speaker: tom
          text: “还梦见了很多，可现在记不清了。”
        - id: ch01-b20
          speaker: aunt_polly
          text: “你好好想一想，难道一点都想不起来？”
        - id: ch01-b21
          speaker: tom
          text: “我好像记得有一阵风。那阵风把……把……”
        - id: ch01-b22
          speaker: aunt_polly
          text: “再使劲想，汤姆！风确实吹了什么东西。快想呀！”
        - id: ch01-b23
          speaker: narrator
          text: 汤姆用手指抵着额头，焦急地苦想了一分钟，忽然叫了起来。
        - id: ch01-b24
          speaker: tom
          text: “我想起来了！那阵风把蜡烛吹灭了！”
        - id: ch01-b25
          speaker: aunt_polly
          text: “我的老天！汤姆，快接着讲！”
          emotion: surprised
        - id: ch01-b26
          speaker: tom
          text: “我好像还听见您说，您觉得那扇门……”
        - id: ch01-b27
          speaker: aunt_polly
          text: “别停下来，接着说！”
        - id: ch01-b28
          speaker: tom
          text: “让我再想一会儿。对了，您说您觉得那扇门开着。”
        - id: ch01-b29
          speaker: aunt_polly
          text: “我就坐在这里作证，我真的说过。玛丽，你也听见了吧？汤姆，往下讲！”
          emotion: surprised
        - id: ch01-b30
          speaker: tom
          text: “后来，我可不敢肯定，好像是您让席德去做什么。”
        - id: ch01-b31
          speaker: aunt_polly
          text: “我叫他做什么了？汤姆，你快说呀！”
        - id: ch01-b32
          speaker: tom
          text: “您让席德把门关上。”
        - id: ch01-b33
          speaker: aunt_polly
          text: “天哪，我活到现在都没听过这么神奇的事！以后谁也别再说梦里没有名堂。一个钟头之内，我就要把这事告诉塞丽妮·哈珀。她不是总拿反对迷信的废话搪塞我吗？我倒要看她这回怎么解释。汤姆，继续讲！”
          emotion: surprised
        - id: ch01-b34
          speaker: tom
          text: “现在我全想清楚了。接着您说，我不算坏，只是淘气，野得没边，根本不能怪我，就跟一匹小马驹差不多。”
        - id: ch01-b35
          speaker: aunt_polly
          text: “没错，我说的就是小马驹！我的天哪，继续讲！”
          emotion: surprised
        - id: ch01-b36
          speaker: tom
          text: “后来您就哭了。”
        - id: ch01-b37
          speaker: aunt_polly
          text: “我的确哭了，而且还不只哭过那一回。后来呢？”
        - id: ch01-b38
          speaker: tom
          text: “哈珀太太也哭了。她说乔跟我一样，还后悔因为乔偷吃奶油打了他，因为那奶油其实是她自己倒掉的。”
        - id: ch01-b39
          speaker: aunt_polly
          text: “汤姆，那时一定有神灵附在你身上！你是在说预言。我的老天，快往下讲！”
          emotion: surprised
        - id: ch01-b40
          speaker: tom
          text: “后来席德说了一句话……”
        - id: ch01-b41
          speaker: sid
          text: “我不记得自己说过什么。”
        - id: ch01-b42
          speaker: mary
          text: “席德，你当时明明说了。”
        - id: ch01-b43
          speaker: aunt_polly
          text: “你们两个都别插嘴，让汤姆说完。汤姆，席德说了什么？”
        - id: ch01-b44
          speaker: tom
          text: “我想，席德说的是，希望我去了那个地方以后能过得好一点，不过要是我平常能乖一点……”
        - id: ch01-b45
          speaker: aunt_polly
          text: “你们听见了吗？这就是席德当时说的原话！”
          emotion: surprised
        - id: ch01-b46
          speaker: tom
          text: “然后您马上叫他住嘴。”
        - id: ch01-b47
          speaker: aunt_polly
          text: “我当然叫了。当时一定有个天使待在这间屋子里，一定有，只是不知道藏在哪里！”
          emotion: surprised
        - id: ch01-b48
          speaker: tom
          text: “哈珀太太又说起乔用爆竹吓她的事，您也讲了彼得和止痛药的事。”
        - id: ch01-b49
          speaker: aunt_polly
          text: “这话就跟我还活着一样真！”
        - id: ch01-b50
          speaker: tom
          text: “后来你们还谈到要去河里捞我们，也谈到星期天要办葬礼。最后您和哈珀太太抱在一起哭，她就回家了。”
        - id: ch01-b51
          speaker: aunt_polly
          text: “一点不差，事情就是这样！汤姆，哪怕你亲眼看见，也不会讲得更准。后来又怎么样？快说！”
          emotion: surprised
        - id: ch01-b52
          speaker: tom
          text: “后来我看见您为我祷告。我不但看得见您，连您说的每个字都听得见。您上床以后，我心里特别难过，就在一片梧桐树皮上写下，我们没有死，只是出去当海盗了。我把树皮放在蜡烛旁边的桌上。您睡着的样子那么慈祥，我就走过去弯下腰，亲了亲您的嘴唇。”
        - id: ch01-b53
          speaker: aunt_polly
          text: “汤姆，你真的亲了我？就凭这一件事，我什么都原谅你！”
          emotion: happy
        - id: ch01-b54
          speaker: narrator
          text: 波莉姨妈一把将汤姆搂进怀里，抱得他几乎喘不过气。汤姆却觉得自己像天底下最心虚的恶棍。
        - id: ch01-b55
          speaker: sid
          text: “这件事真够体贴的，虽说它不过是一场梦。”
        - id: ch01-b56
          speaker: aunt_polly
          text: “闭嘴，席德！人在梦里做的事，跟醒着时会做的一样。汤姆，这个米勒姆大苹果是我特意留下的。我一直想着，如果还能找到你，就把它给你。现在快去上学吧。感谢仁慈的上帝，感谢我们众人的天父，把你重新送回我身边。他对信奉他、遵守他教诲的人总是那么忍耐，那么慈悲。天知道我不配得到这份恩典，可要是只有配得上的人才能蒙他赐福，靠他的手走过那些难走的路，这世上就没有几个人还能笑得出来。等漫漫长夜降临，又有几个人能走进他的安息之地呢？好了，席德、玛丽、汤姆，你们全都走吧。你们已经耽误我够久了。”
        - id: ch01-b57
          speaker: narrator
          text: 孩子们出门去上学，波莉姨妈则去找哈珀太太。她要拿汤姆那个神奇的梦，彻底驳倒哈珀太太那套不信迷信的道理。席德很识趣，出门时没有说出心里的想法。他觉得这个梦实在太假了，因为它那么长，居然连一处错误也没有。
    - id: ch02
      title: 两位英雄回到学校
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 汤姆现在成了不起的英雄了。他不再蹦蹦跳跳，而是摆出庄严的神气，大摇大摆地走着。既然这个海盗知道人人都在看他，他就得有个海盗的样子。人们也确实都在看。汤姆假装没看见那些目光，也没听见那些议论，可它们对他来说，简直比美酒佳肴还要受用。
        - id: ch02-b02
          speaker: narrator
          text: 比汤姆小的男孩成群结队跟在后面。只要别人看见自己能跟他走在一起，还得到他的容许，他们就骄傲得不得了，仿佛跟着的是游行队伍最前面的鼓手，又像是率领整座动物园进城的大象。跟汤姆一般大的男孩却假装不知道他离开过，心里其实嫉妒得快着火了。他们情愿拿任何东西，换汤姆那一身晒得黝黑的皮肤和闪闪发亮的名声。汤姆呢，就算有人拿一整座马戏团来换，他也舍不得交出任何一样。
        - id: ch02-b03
          speaker: narrator
          text: 学校里的孩子把汤姆和乔捧上了天，眼里的钦佩怎么也藏不住。两位英雄很快就得意得叫人受不了。他们开始给一群急着听故事的人讲自己的历险，可这才只是开头。凭他们的想象力，故事随时都有新材料添进去，根本讲不完。最后，两个人拿出烟斗，悠然自得地一边吞云吐雾，一边四处闲逛。他们的荣耀也登上了顶峰。
        - id: ch02-b04
          speaker: narrator
          text: 汤姆认定，自己现在根本用不着贝琪·撒切尔了。有荣耀就够了，他以后只为荣耀活着。既然自己已经成了名人，说不定贝琪反而想来和好。那就让她来吧。他也要让她尝尝被人冷落的滋味。
        - id: ch02-b05
          speaker: narrator
          text: 贝琪来了，汤姆却装作没看见，转身加入一群男孩女孩，跟他们聊起天。没过多久，他发现贝琪红着脸，眼睛亮闪闪的。她快活地跑来跑去，装作忙着追赶同学，每抓到一个人就高声大笑。可她每次都在汤姆身边抓人，还像是不经意地朝他瞟上一眼。
        - id: ch02-b06
          speaker: narrator
          text: 汤姆那点刻薄的虚荣心得到了满足。可这不但没有把他拉回贝琪身边，反而叫他更神气了。他越发小心，不让贝琪看出自己已经注意到了她。贝琪玩了一会儿，渐渐停了下来。她犹犹豫豫地走动，轻轻叹气，又偷偷带着期盼望向汤姆。接着，她发现汤姆跟艾米·劳伦斯说得特别起劲，心里猛地一痛。
        - id: ch02-b07
          speaker: narrator
          text: 贝琪马上变得又烦又乱。她想离开，两只脚却偏偏把她带到那群人跟前。她装出轻快的样子，对汤姆身边的玛丽·奥斯汀说起话来。
        - id: ch02-b08
          speaker: becky
          text: “玛丽·奥斯汀，你这个坏丫头！星期天怎么没有来主日学校？”
        - id: ch02-b09
          speaker: mary_austin
          text: “我明明来了呀，你没有看见我吗？”
        - id: ch02-b10
          speaker: becky
          text: “我真的没看见。你坐在哪里了？”
        - id: ch02-b11
          speaker: mary_austin
          text: “我还坐在彼得斯小姐的班里，一向都坐那里。我倒看见你了。”
        - id: ch02-b12
          speaker: becky
          text: “是吗？我居然没看见你，真奇怪。我本来还想告诉你野餐的事呢。”
        - id: ch02-b13
          speaker: mary_austin
          text: “那可太棒了！这次是谁要办野餐？”
        - id: ch02-b14
          speaker: becky
          text: “我妈妈答应让我办一次。”
        - id: ch02-b15
          speaker: mary_austin
          text: “真好！我也可以去吗？”
        - id: ch02-b16
          speaker: becky
          text: “当然可以。这次野餐是为我办的，我想请谁，妈妈就让谁来。我当然想请你。”
        - id: ch02-b17
          speaker: mary_austin
          text: “你真好。野餐定在什么时候？”
        - id: ch02-b18
          speaker: becky
          text: “还要过些日子，也许等到放假的时候。”
        - id: ch02-b19
          speaker: mary_austin
          text: “那一定特别好玩！你会把所有男孩女孩都请来吗？”
        - id: ch02-b20
          speaker: becky
          text: “会呀。凡是跟我好，或者想跟我好的人，我都会请。”
        - id: ch02-b21
          speaker: narrator
          text: 贝琪说着，极隐秘地朝汤姆看了一眼。汤姆却还在对艾米滔滔不绝地讲岛上的暴风雨。他说闪电把一棵大梧桐树劈成了碎片，而他当时就站在不到三英尺远的地方。
        - id: ch02-b22
          speaker: grace_miller
          text: “贝琪，我可以去吗？”
        - id: ch02-b23
          speaker: becky
          text: “你当然可以去。”
        - id: ch02-b24
          speaker: sally_rogers
          text: “那我也可以去吗？”
        - id: ch02-b25
          speaker: becky
          text: “你也可以去。”
        - id: ch02-b26
          speaker: susy_harper
          text: “我也想去。乔能不能一起来？”
        - id: ch02-b27
          speaker: becky
          text: “你和乔都可以来。”
        - id: ch02-b28
          speaker: narrator
          text: 大家就这样一个接一个地问，还高兴得不停拍手。最后，整群人里只有汤姆和艾米没有讨到邀请。汤姆这才冷冷转身，一面继续说话，一面把艾米也带走了。
        - id: ch02-b29
          speaker: narrator
          text: 贝琪的嘴唇颤抖起来，眼泪也涌进眼睛。她强装出快活的样子，继续跟人说笑，可野餐已经没有了趣味，世上别的事情也一样。她一找到机会就躲开众人，藏起来痛痛快快哭了一场——女孩子们是这么说的。然后她闷闷不乐地坐着，自尊心疼得厉害，直到上课铃响。贝琪一下子振作起来，眼里露出报复的神色。她甩了甩两条辫子，已经知道接下来要怎么做了。
    - id: ch03
      title: 谁让谁更难受
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 课间休息时，汤姆继续向艾米献殷勤，对自己的表现满意极了。他不停地四处转悠，只想找到贝琪，好让她看见这一切，让她也难受。最后，汤姆终于瞧见了她，可他心里那股得意劲儿一下子全凉了。
        - id: ch03-b02
          speaker: narrator
          text: 贝琪和阿尔弗雷德·坦普尔舒舒服服地坐在校舍后面的小长椅上，一起看一本图画书。两个人看得那么入迷，脑袋在书上方挨得那么近，仿佛世上除了他们和那本书，就再没有别的东西了。
        - id: ch03-b03
          speaker: narrator
          text: 嫉妒在汤姆的血管里烧得滚烫。他开始恨自己，怪自己白白丢掉了贝琪刚才给他的和好机会。他骂自己是傻瓜，还把想得出来的难听话全骂了一遍。他气得想哭。
        - id: ch03-b04
          speaker: narrator
          text: 艾米一路快乐地说个不停，心里像在唱歌，可汤姆的舌头已经不会动了。他压根儿没听见艾米说什么。每当她满怀期待地停下来，汤姆只能尴尬地胡乱答应一声，十有八九还答得牛头不对马嘴。
        - id: ch03-b05
          speaker: narrator
          text: 汤姆一次次绕回校舍后面，非要让那幅可恨的景象灼痛自己的眼睛。他控制不住自己。更叫他发狂的是，照他看来，贝琪根本没发现他还活在世上。其实贝琪看见了。她知道这场较量正在由自己获胜，也很高兴汤姆终于尝到了她刚才受过的苦。
        - id: ch03-b06
          speaker: narrator
          text: 艾米欢快的话越来越叫汤姆受不了。汤姆暗示自己还有要紧事要办，而且时间正不停溜走，可艾米还是叽叽喳喳地说着。汤姆在心里咒骂，不知道自己什么时候才能摆脱她。最后，他坚持非走不可。
        - id: ch03-b07
          speaker: amy
          text: “那好吧，等放学的时候，我还会在附近。”
        - id: ch03-b08
          speaker: narrator
          text: 汤姆急忙走开，竟因为这句话恨起了艾米。他一面走，一面咬牙切齿地想着贝琪身边的阿尔弗雷德。
        - id: ch03-b09
          speaker: tom
          text: “换成镇上哪个男孩都行，偏偏不能是那个从圣路易斯来的自作聪明鬼！他以为自己衣服漂亮，就是上等人了。先生，你头一天进镇，我就揍过你，以后还能再揍你一顿！等我在外面逮住你，我一定要……”
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: 汤姆把一个想象出来的男孩痛打了一顿。他挥拳猛击空气，又踢又抠，还冲着那个不存在的对手叫喊。
        - id: ch03-b11
          speaker: tom
          text: “你还敢这样，是不是？现在知道喊饶了？好好记住这个教训！”
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: 这场想象中的毒打，总算让汤姆满意地收了手。
    - id: ch04
      title: 拼字课本上的墨水
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 中午，汤姆逃回了家。他的良心再也受不了艾米满怀感激的快乐，他的嫉妒也承受不住校舍后面的折磨。贝琪重新跟阿尔弗雷德看起了图画。可是时间一点点过去，汤姆一直没有回来受罪，她胜利的喜悦也渐渐暗淡了。
        - id: ch04-b02
          speaker: narrator
          text: 贝琪先是对图画失去了兴趣，接着变得严肃而心不在焉，最后只剩下忧愁。两三次听到脚步声，她都赶紧竖起耳朵，可每次都是空欢喜。汤姆始终没有出现。贝琪越来越难受，终于后悔自己不该把事情做得这么过分。
        - id: ch04-b03
          speaker: narrator
          text: 可怜的阿尔弗雷德眼看着她不再理会自己，却完全猜不出原因，只好一遍遍把图画指给她看。
        - id: ch04-b04
          speaker: alfred
          text: “这张真有意思！贝琪，你快看看这一张！”
        - id: ch04-b05
          speaker: becky
          text: “别再烦我了！我根本不想看这些！”
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 贝琪说完便放声哭起来，站起身走了。阿尔弗雷德追到旁边，想要安慰她。
        - id: ch04-b07
          speaker: becky
          text: “你走开，让我一个人待着不行吗？我讨厌你！”
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: 阿尔弗雷德停下脚步，怎么也想不通自己做错了什么。明明是贝琪亲口说的，整个午休都要和他一起看图画。现在她却哭着走远了。
        - id: ch04-b09
          speaker: narrator
          text: 阿尔弗雷德又羞又气，满怀心事地走进空荡荡的校舍。他很快就猜到了真相。贝琪不过是在利用他，好拿汤姆·索亚出气。想到这里，他对汤姆只有更恨。他很想找个办法，让汤姆惹上麻烦，自己却不用担多少风险。
        - id: ch04-b10
          speaker: narrator
          text: 这时，汤姆的拼字课本落进了他的眼里。机会来了。阿尔弗雷德满怀感激地翻到下午要学的那一课，把墨水倒在了书页上。
        - id: ch04-b11
          speaker: narrator
          text: 就在这一刻，贝琪从他身后的窗外看了进来。她看见阿尔弗雷德做了什么，却没有让他发现自己。贝琪转身往家走，本来打算找到汤姆，把这件事告诉他。汤姆一定会感激她，两个人之间的别扭也就能过去了。
        - id: ch04-b12
          speaker: narrator
          text: 可是还没走到一半，贝琪就改变了主意。她又想起自己谈到野餐时，汤姆是怎么对待她的。那段记忆火辣辣地烧回来，让她满心羞愤。她决定什么也不说，就让汤姆因为拼字课本被弄坏而挨一顿鞭子。除此之外，她还决定永远恨着他。
