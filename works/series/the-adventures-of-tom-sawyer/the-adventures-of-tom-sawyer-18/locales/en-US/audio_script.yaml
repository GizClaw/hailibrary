  chapters:
    - id: ch01
      title: CHAPTER XVIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Tom's great secret was how the three pirates had managed to come home for their own funerals. At dusk on Saturday, they had ridden a log across to the Missouri shore and landed five or six miles below the village. They slept in the woods near town until almost daylight. Then they slipped through back lanes and alleys, crept into the church gallery, and finished their sleep among a jumble of broken benches.
        - id: ch01-b02
          speaker: narrator
          text: At breakfast on Monday, Aunt Polly and Mary fussed over Tom with great affection. Everyone talked more than usual, and before long Aunt Polly came to what was troubling her.
        - id: ch01-b03
          speaker: aunt_polly
          text: "Well, Tom, I won't say it wasn't a fine joke for you boys. You had your fun while everyone suffered for nearly a week. But how could you be so hardhearted toward me? If you could cross the river on a log for your own funeral, you could have found some way to let me know you weren't dead. You'd only run away."
          emotion: sad
        - id: ch01-b04
          speaker: mary
          text: "You could have done that, Tom. I believe you would have, if the thought had come to you."
        - id: ch01-b05
          speaker: aunt_polly
          text: "Would you, Tom? Tell me honestly. Would you have done it, if you'd thought of it?"
        - id: ch01-b06
          speaker: narrator
          text: Her face brightened with hope.
        - id: ch01-b07
          speaker: tom
          text: "I... well, I don't know. It would've ruined the whole thing."
        - id: ch01-b08
          speaker: aunt_polly
          text: "Tom, I hoped you loved me more than that. Even if you hadn't come, it would've meant something if you'd cared enough to think of me."
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: Her hurt voice made Tom uncomfortable.
        - id: ch01-b10
          speaker: mary
          text: "Oh, Auntie, he didn't mean any harm. That's just Tom. He's always rushing so fast that he never stops to think."
        - id: ch01-b11
          speaker: aunt_polly
          text: "And that's a great pity. Sid would've thought of me, and Sid would've come to tell me, too. Someday it'll be too late, Tom. Then you'll wish you'd cared a little more when it would've cost you so little."
        - id: ch01-b12
          speaker: tom
          text: "But Auntie, you know I do care about you."
        - id: ch01-b13
          speaker: aunt_polly
          text: "I'd know it better if you showed it."
        - id: ch01-b14
          speaker: tom
          text: "I truly wish I'd thought of it. But I dreamed about you. That counts for something, doesn't it?"
        - id: ch01-b15
          speaker: narrator
          text: Tom sounded sorry now.
        - id: ch01-b16
          speaker: aunt_polly
          text: "Not for much. Even a cat can dream. Still, it's better than nothing. What happened in your dream?"
        - id: ch01-b17
          speaker: tom
          text: "On Wednesday night, you were sitting beside the bed. Sid was by the woodbox, and Mary was next to him."
        - id: ch01-b18
          speaker: aunt_polly
          text: "Why, that's exactly where we were. That's where we always sit. Well, I'm glad your dreams took that much trouble over us."
        - id: ch01-b19
          speaker: tom
          text: "And Joe Harper's mother was here, too."
        - id: ch01-b20
          speaker: aunt_polly
          text: "She was here! Was there anything else?"
          emotion: surprised
        - id: ch01-b21
          speaker: tom
          text: "Oh, plenty. It's gone dim now, though."
        - id: ch01-b22
          speaker: aunt_polly
          text: "Try to remember. Can't you?"
        - id: ch01-b23
          speaker: tom
          text: "I seem to remember the wind. The wind blew... it blew..."
        - id: ch01-b24
          speaker: aunt_polly
          text: "Think harder, Tom! The wind blew something. What was it?"
        - id: ch01-b25
          speaker: narrator
          text: Tom pressed his fingers to his forehead for an anxious minute.
        - id: ch01-b26
          speaker: tom
          text: "Now I've got it! The wind blew out the candle!"
        - id: ch01-b27
          speaker: aunt_polly
          text: "Mercy on us! Keep going, Tom!"
          emotion: surprised
        - id: ch01-b28
          speaker: tom
          text: "Then I think you said, 'Why, I believe that door...'"
        - id: ch01-b29
          speaker: aunt_polly
          text: "Go on, Tom!"
        - id: ch01-b30
          speaker: tom
          text: "Give me one moment to think. Oh, yes. You said you believed the door was open."
        - id: ch01-b31
          speaker: aunt_polly
          text: "I did, as surely as I'm sitting here! Didn't I, Mary? Go on!"
          emotion: surprised
        - id: ch01-b32
          speaker: tom
          text: "And then... I can't be certain, but it seems like you made Sid go and..."
        - id: ch01-b33
          speaker: aunt_polly
          text: "Go and do what, Tom? What did I make him do?"
        - id: ch01-b34
          speaker: tom
          text: "You made him... oh, you made him shut the door."
        - id: ch01-b35
          speaker: aunt_polly
          text: "Well, for the land's sake! I've never heard anything like it. No one can tell me dreams mean nothing after this. Before an hour passes, Sereny Harper is going to hear about it. Let's see her answer that, with all her talk against superstition. Go on, Tom!"
          emotion: surprised
        - id: ch01-b36
          speaker: tom
          text: "It's all coming back, clear as day. Next you said I wasn't bad, only wild and mischievous. You said I wasn't any more responsible than... than a colt, I think."
        - id: ch01-b37
          speaker: aunt_polly
          text: "That's just what I said! Goodness gracious, keep going!"
          emotion: surprised
        - id: ch01-b38
          speaker: tom
          text: "Then you started crying."
        - id: ch01-b39
          speaker: aunt_polly
          text: "I did. It wasn't the first time, either. And then what?"
        - id: ch01-b40
          speaker: tom
          text: "Mrs. Harper cried too. She said Joe was just the same. And she wished she hadn't whipped him for taking the cream, because she'd thrown it out herself."
        - id: ch01-b41
          speaker: aunt_polly
          text: "Tom, the spirit was upon you! You were prophesying, that's what you were doing. Land alive, go on!"
          emotion: surprised
        - id: ch01-b42
          speaker: tom
          text: "Then Sid said... he said..."
        - id: ch01-b43
          speaker: sid
          text: "I don't think I said a thing."
        - id: ch01-b44
          speaker: mary
          text: "Yes, you did, Sid."
        - id: ch01-b45
          speaker: aunt_polly
          text: "Both of you hush and let Tom speak! What did Sid say?"
        - id: ch01-b46
          speaker: tom
          text: "I think he said he hoped I was better off where I'd gone. But he said that if I'd behaved better sometimes..."
        - id: ch01-b47
          speaker: aunt_polly
          text: "There! Did you hear that? Those were his very words!"
        - id: ch01-b48
          speaker: tom
          text: "And you stopped him mighty quick."
        - id: ch01-b49
          speaker: aunt_polly
          text: "I certainly did! There must have been an angel in that room. There simply must have been!"
        - id: ch01-b50
          speaker: tom
          text: "Then Mrs. Harper told about Joe frightening her with a firecracker. You told her about Peter and the Pain-killer."
        - id: ch01-b51
          speaker: aunt_polly
          text: "Every bit of it is true!"
        - id: ch01-b52
          speaker: tom
          text: "After that, you talked about dragging the river for us and holding the funeral on Sunday. Then you and old Mrs. Harper hugged and cried, and she left."
        - id: ch01-b53
          speaker: aunt_polly
          text: "That's exactly how it happened! Tom, you couldn't have told it any better if you'd seen it yourself. What came next?"
          emotion: surprised
        - id: ch01-b54
          speaker: tom
          text: "Then you prayed for me. I could see you and hear every word. After you went to bed, I felt so sorry that I wrote, 'We aren't dead. We're only off being pirates,' on a piece of sycamore bark. I put it on the table beside the candle. Then you looked so good lying there asleep that I leaned over and kissed you on the lips."
        - id: ch01-b55
          speaker: aunt_polly
          text: "You kissed me, Tom? You really did? Then I forgive you for everything!"
          emotion: happy
        - id: ch01-b56
          speaker: narrator
          text: She seized Tom in a crushing hug, and he felt like the guiltiest villain alive.
        - id: ch01-b57
          speaker: sid
          text: "It was very kind of him, even if it was only a... dream."
        - id: ch01-b58
          speaker: narrator
          text: Sid said it just loudly enough to be heard.
        - id: ch01-b59
          speaker: aunt_polly
          text: "Be quiet, Sid! A person does the same thing in a dream that he'd do awake. Tom, here's a big Milum apple I've been saving in case we ever found you. Now run along to school. I'm thankful to the good God and Father of us all that I have you back. He is patient and merciful to those who believe in Him and keep His word. Goodness knows I'm not worthy of His kindness. But if blessings came only to worthy people, very few of us would smile in this world or find His rest when the long night comes. Now all three of you, off to school. You've kept me long enough."
        - id: ch01-b60
          speaker: narrator
          text: The children set off for school. Aunt Polly went to visit Mrs. Harper and defeat her practical notions with Tom's marvelous dream. Sid knew better than to say what he was thinking as he left the house. A dream that long, without one mistake in it, seemed pretty thin to him.
        - id: ch01-b61
          speaker: narrator
          text: Tom had become a hero. He no longer skipped or pranced down the road. He walked with the grand, dignified swagger that suited a pirate who knew the whole town was watching. And everyone was watching. Tom tried not to look as if he saw the stares or heard the remarks around him, but they were food and drink to him.
        - id: ch01-b62
          speaker: narrator
          text: Smaller boys crowded behind him. They were proud just to be seen near him, as if he were the drummer leading a parade or the elephant at the head of a traveling show. Boys his own age acted as though they had never heard of his adventure, but envy was eating them alive. They would have traded anything for his dark suntan and shining fame. Tom would not have traded either one for a whole circus.
        - id: ch01-b63
          speaker: narrator
          text: At school, the children crowded around Tom and Joe. Their admiring eyes said so much that both heroes soon became unbearably proud. They started telling their adventures to a crowd hungry for every detail. They only made a beginning, though. With imaginations like theirs supplying more material, those stories were not likely to end. At last they brought out their pipes and calmly puffed around the schoolyard. That carried their glory to its highest point.
        - id: ch01-b64
          speaker: narrator
          text: Tom decided he could be independent of Becky Thatcher now. Glory was enough. From this time on, he would live for glory. Perhaps now that he was famous, Becky would want to make peace. Well, she could try. Then she would see that he could be just as indifferent as anyone else.
        - id: ch01-b65
          speaker: narrator
          text: When Becky arrived, Tom acted as if he had not seen her. He joined a group of boys and girls and began talking. Soon Becky was darting cheerfully among her classmates, her cheeks flushed and her eyes dancing. She chased them and screamed with laughter whenever she caught someone.
        - id: ch01-b66
          speaker: narrator
          text: Tom noticed that every chase brought her close to him. Each time, she seemed to glance his way on purpose. That pleased his spiteful vanity. Instead of drawing him toward her, it made him prouder and more careful not to show that he noticed.
        - id: ch01-b67
          speaker: narrator
          text: After a while, Becky stopped playing. She wandered uncertainly, sighed once or twice, and stole wistful looks at Tom. Then she saw that he was giving Amy Lawrence more attention than anyone else. The sight hurt at once. Becky tried to leave, but her feet carried her straight toward the group.
        - id: ch01-b68
          speaker: becky
          text: "Why, Mary Austin! You awful girl, why weren't you at Sunday school?"
        - id: ch01-b69
          speaker: narrator
          text: Becky spoke with cheerfulness she did not feel, almost at Tom's elbow.
        - id: ch01-b70
          speaker: mary_austin
          text: "But I was there. Didn't you see me?"
        - id: ch01-b71
          speaker: becky
          text: "No, I didn't! Where were you sitting?"
        - id: ch01-b72
          speaker: mary_austin
          text: "In Miss Peters' class, where I always sit. I saw you."
        - id: ch01-b73
          speaker: becky
          text: "Did you? How funny that I missed you. I wanted to tell you about the picnic."
        - id: ch01-b74
          speaker: mary_austin
          text: "Oh, that sounds wonderful! Who's giving it?"
        - id: ch01-b75
          speaker: becky
          text: "My mother says I may have one."
        - id: ch01-b76
          speaker: mary_austin
          text: "Oh, good! I hope she'll let me come."
        - id: ch01-b77
          speaker: becky
          text: "Of course she will. It's my picnic, and she says I can invite anyone I want. I want you there."
        - id: ch01-b78
          speaker: mary_austin
          text: "That's ever so nice! When will it be?"
        - id: ch01-b79
          speaker: becky
          text: "Later on. Maybe around vacation."
        - id: ch01-b80
          speaker: mary_austin
          text: "Won't that be fun! Are you inviting all the girls and boys?"
        - id: ch01-b81
          speaker: becky
          text: "Yes, everyone who's my friend... or wants to be."
        - id: ch01-b82
          speaker: narrator
          text: Becky slipped one quick look at Tom. He kept talking to Amy Lawrence about the terrible storm on the island. He told her how lightning had torn the great sycamore tree to pieces while he stood only three feet away.
        - id: ch01-b83
          speaker: grace_miller
          text: "May I come to the picnic?"
        - id: ch01-b84
          speaker: becky
          text: "Yes."
        - id: ch01-b85
          speaker: sally_rogers
          text: "Can I come too?"
        - id: ch01-b86
          speaker: becky
          text: "Yes."
        - id: ch01-b87
          speaker: susy_harper
          text: "What about me? And may Joe come?"
        - id: ch01-b88
          speaker: becky
          text: "Yes."
        - id: ch01-b89
          speaker: narrator
          text: The invitations went on, with delighted clapping, until everyone in the group had asked except Tom and Amy. Then Tom coolly walked away, still talking, and took Amy with him. Becky's lips trembled. Tears filled her eyes, but she hid them behind more false cheerfulness and kept chatting.
        - id: ch01-b90
          speaker: narrator
          text: The picnic had lost all its life for her. So had everything else. As soon as she could, Becky slipped away, hid herself, and had a good cry. Afterward she sat in wounded silence until the bell rang. Then she shook her braids, and a vengeful look came into her eyes. She knew exactly what she would do.
        - id: ch01-b91
          speaker: narrator
          text: At recess, Tom kept flirting with Amy and felt delighted with himself. He wandered around looking for Becky so she could see it and suffer. At last he found her, and all his delight dropped away.
        - id: ch01-b92
          speaker: narrator
          text: Becky sat comfortably on a little bench behind the schoolhouse, looking through a picture book with Alfred Temple. Their heads were close together over the pages. They seemed to have forgotten that anything else existed.
        - id: ch01-b93
          speaker: narrator
          text: Hot jealousy rushed through Tom. He hated himself for throwing away Becky's offer of peace. He called himself a fool and every other cruel name he could think of. He was so frustrated that he wanted to cry.
        - id: ch01-b94
          speaker: narrator
          text: Amy walked beside him, chattering happily because her heart was singing. Tom could no longer manage a proper answer. He did not hear what she said. Whenever she paused and waited, he stammered some awkward reply, and it was often the wrong one.
        - id: ch01-b95
          speaker: narrator
          text: Again and again, he drifted behind the schoolhouse and tortured himself with the hateful sight of Becky and Alfred bent over that book. He could not stay away. Worst of all, Becky seemed not even to suspect that Tom was still alive. But she did see him. She knew she was winning their battle, and she was glad to watch him suffer as she had suffered.
        - id: ch01-b96
          speaker: narrator
          text: Soon Amy's cheerful talk became unbearable. Tom hinted that he had important things to do and that time was running out. It made no difference. She kept talking, while he wondered bitterly whether he would ever be rid of her.
        - id: ch01-b97
          speaker: narrator
          text: At last Tom insisted that he had to go. Amy innocently told him she would be nearby when school ended. He hurried off, hating her for saying it.
        - id: ch01-b98
          speaker: tom
          text: "Why did it have to be him? Any boy in town but that fancy Saint Louis fellow who thinks he's so well dressed and important! I whipped you the first day you came here, mister, and I'll whip you again. Just wait until I catch you alone. I'll..."
          emotion: angry
        - id: ch01-b99
          speaker: narrator
          text: Tom began beating up an imaginary Alfred. He punched the air, kicked, and gouged.
        - id: ch01-b100
          speaker: tom
          text: "Oh, so that's how you want it? Had enough now, have you? There! That'll teach you!"
          emotion: angry
        - id: ch01-b101
          speaker: narrator
          text: The imaginary fight ended to Tom's complete satisfaction.
        - id: ch01-b102
          speaker: narrator
          text: At noon, Tom ran home. His conscience could not bear any more of Amy's grateful happiness, and his jealousy could not bear another look at Becky with Alfred.
        - id: ch01-b103
          speaker: narrator
          text: Becky went back to examining the pictures with Alfred. But the minutes dragged by, and Tom never came to see her victory. Soon her triumph grew cloudy and she lost interest in the book. First she became serious, then absentminded, and finally deeply sad. Two or three times, she heard a footstep and lifted her head with sudden hope. Each time, it was a false alarm. Tom did not come.
        - id: ch01-b104
          speaker: narrator
          text: At last Becky became thoroughly miserable. She wished she had not carried her revenge so far. Alfred could see that he was losing her, though he had no idea why. He kept trying to draw her back to the pictures.
        - id: ch01-b105
          speaker: alfred
          text: "Oh, here's a wonderful one! Look at this!"
        - id: ch01-b106
          speaker: becky
          text: "Oh, stop bothering me! I don't care about the pictures!"
          emotion: angry
        - id: ch01-b107
          speaker: narrator
          text: Becky burst into tears, stood up, and walked away. Alfred followed, meaning to comfort her.
        - id: ch01-b108
          speaker: becky
          text: "Can't you go away and leave me alone? I hate you!"
          emotion: angry
        - id: ch01-b109
          speaker: narrator
          text: Alfred stopped, wondering what he had done. Becky had said she would look at pictures with him all through the noon break, and now she walked away crying.
        - id: ch01-b110
          speaker: narrator
          text: Alfred went thoughtfully into the empty schoolhouse. He felt humiliated and angry. It did not take long to guess the truth. Becky had only used him to get revenge on Tom Sawyer. That discovery made him hate Tom even more.
        - id: ch01-b111
          speaker: narrator
          text: Alfred wanted to find some way of getting Tom into trouble without taking much risk himself. Then Tom's spelling book caught his eye. Here was the very chance he wanted. Grateful for his good luck, Alfred opened the book to the afternoon lesson and poured ink across the page.
        - id: ch01-b112
          speaker: narrator
          text: At that very moment, Becky glanced through a window behind Alfred and saw what he had done. She moved on without letting him know. Now she started home, planning to find Tom and warn him. He would be grateful, and their quarrel would be over.
        - id: ch01-b113
          speaker: narrator
          text: Before Becky was halfway home, she changed her mind. She remembered how Tom had treated her while she talked about the picnic, and the memory burned with shame. She decided to let him be whipped for the ruined spelling book. She would hate him forever, too.
