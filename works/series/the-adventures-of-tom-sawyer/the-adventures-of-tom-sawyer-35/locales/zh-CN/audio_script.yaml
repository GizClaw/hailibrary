audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 聪明好胜，兴奋时语速加快，害怕时压低声音
        timbre: 清亮的少年声
        pace: 轻快灵活
        pitch: 中高音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，带着街头少年的粗朴和谨慎
        timbre: 略带沙哑的少年声
        pace: 自然偏慢
        pitch: 中音
    judge_thatcher:
      display_name: 撒切尔法官
      tts:
        delivery: 庄重有力，激动时慷慨昂扬
        timbre: 洪亮沉稳的成年男声
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第三十五章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 汤姆和哈克突然发了财，这件事在贫穷的圣彼得堡小镇上闹得沸沸扬扬。那可是一大笔现钱，多得叫人不敢相信。镇民谈个没完，越说越眼热，又把两个孩子夸上了天。不少人兴奋过头，连脑子都不大清醒了。
        - id: ch01-b02
          speaker: narrator
          text: 镇上和附近村子里，只要哪座房子传说闹鬼，大人们就一拥而上。他们把木板一块块拆掉，又挖开地基，翻得乱七八糟，只为寻找藏起来的宝贝。干这事的还不是孩子，而是几位平日相当严肃、毫无浪漫心肠的大人。
        - id: ch01-b03
          speaker: narrator
          text: 汤姆和哈克走到哪儿，都有人奉承、赞叹，还盯着他们瞧。从前，他们说的话有没有分量，连自己都想不起来。如今随口一句话，也会被人当成宝贝记住，再传给别人。无论他们做什么，别人都觉得了不起。他们仿佛再也说不出一句平常话，做不出一件寻常事。就连过去的经历也被人重新翻出来，处处都能找到极其不凡的迹象。镇上的报纸还登了两人的生平小传。
        - id: ch01-b04
          speaker: narrator
          text: 道格拉斯寡妇把哈克的钱借出去，收六厘利息。波莉姨妈也请撒切尔法官替汤姆这样办。两个孩子从此有了一笔惊人的收入，一年里每个工作日都有一美元，连一半的星期日也算上。
        - id: ch01-b05
          speaker: narrator
          text: 这恰好等于牧师的薪水。不对，应该说，是别人答应给牧师的薪水，因为那笔钱通常到不了他的手里。那年月的日子还很朴素，每星期一美元二十五美分，就够一个孩子吃饭、住宿、上学，甚至连衣服和洗衣钱都包括在内。
        - id: ch01-b06
          speaker: narrator
          text: 撒切尔法官非常看重汤姆。他说，普通孩子绝不可能把自己的女儿带出山洞。贝琪又悄悄告诉父亲，汤姆曾经在学校里替她挨过鞭子。法官听了，心里十分感动。
        - id: ch01-b07
          speaker: narrator
          text: 贝琪还替汤姆那句大谎求情。汤姆撒谎，是为了把本该落在她身上的鞭子揽到自己身上。法官一面在屋里踱步，一面跺着脚，激动地说了起来。
        - id: ch01-b08
          speaker: judge_thatcher
          text: 那是一个高尚、慷慨、宽宏大量的谎言！它尽可以昂起头来，和乔治·华盛顿那桩著名的斧头真话并肩走进历史！
        - id: ch01-b09
          speaker: narrator
          text: 贝琪从没见过父亲显得这么高大威风。她马上跑去，把这番话告诉了汤姆。
        - id: ch01-b10
          speaker: narrator
          text: 撒切尔法官希望汤姆长大后成为大律师，或者大军人。他说自己一定要设法送汤姆进国立军事学院，再让他到全国最好的法学院受训。这样，不论汤姆选哪条路，或者两条都选，都能事先做好准备。
        - id: ch01-b11
          speaker: narrator
          text: 哈克有了钱，又归道格拉斯寡妇照管，于是便进了上流社会。说“进”还不够，他简直是被硬拖进去、猛扔进去的。那套生活从四面八方挤压着他，他受的罪，几乎超过了忍耐的限度。
        - id: ch01-b12
          speaker: narrator
          text: 仆人天天把他洗得干干净净，收拾得整整齐齐，又替他梳头，又拿刷子刷。到了晚上，他还得钻进毫不亲切的干净床单。上面连一块能让他贴在胸口、认作老朋友的小污点、小斑痕都没有。
        - id: ch01-b13
          speaker: narrator
          text: 哈克吃饭得用刀叉，还要用餐巾、杯子和盘子。他得读书，得上教堂，连说话也必须规规矩矩，弄得嘴里一点滋味都没有。无论转向哪里，文明的栅栏和锁链都围着他，把他的手脚捆得牢牢的。
        - id: ch01-b14
          speaker: narrator
          text: 哈克勇敢地熬了三个星期，有一天忽然不见了。寡妇急坏了，找了整整四十八小时。全镇的人也到处搜寻，甚至下河打捞，以为他已经没命了。
        - id: ch01-b15
          speaker: narrator
          text: 到了第三天清早，汤姆很有见识地想到废弃屠宰场后面的几只空旧木桶。他逐只钻进去查看，果然在一只桶里找到了逃跑的哈克。哈克一直睡在那里，刚拿几样偷来的零碎食物吃完早饭，正叼着烟斗舒舒服服地躺着。
        - id: ch01-b16
          speaker: narrator
          text: 他头发没梳，浑身脏乱，还穿着从前那套破衣服。自由快活的日子里，正是这身破烂让他显得别有风采。汤姆把他叫起来，告诉他大家有多着急，又劝他回去。哈克脸上的满足消失了，只剩下一片愁苦。
        - id: ch01-b17
          speaker: huck
          text: 别提了，汤姆。我已经试过，可就是不成，真的不成。那种日子不适合我。寡妇对我又好又和气，可她那些规矩，我实在受不了。
          emotion: sad
        - id: ch01-b18
          speaker: huck
          text: 她每天非让我在同一个钟点起床，还逼我洗脸。他们又拼命给我梳头，不许我睡柴房。我还得穿那套该死的衣服，闷得透不过气。衣服好得要命，害我不能随便坐，不能躺，也不能到处打滚。我都多少年没从地窖门板上滑下去了！
          emotion: angry
        - id: ch01-b19
          speaker: huck
          text: 我还得上教堂，坐在那里热得一身又一身汗。那些讨厌的布道，我恨死啦！我不能捉苍蝇，不能嚼烟草，每个星期日还必须穿鞋。寡妇听铃吃饭，听铃睡觉，听铃起床。什么事都规矩得吓人，谁受得了啊？
          emotion: angry
        - id: ch01-b20
          speaker: tom
          text: 可是哈克，大家都这么过日子呀。
        - id: ch01-b21
          speaker: huck
          text: 那跟我有什么关系？我又不是大家，我就是受不了。什么都把人绑得死死的，太难受。饭来得那么容易，连吃饭都没意思。我要钓鱼，得先问；要游泳，也得先问。真见鬼，我做什么都得先问！
          emotion: angry
        - id: ch01-b22
          speaker: huck
          text: 话也得说得好听，一点儿都不痛快。我每天非躲到阁楼上痛痛快快地骂一阵，嘴里才有点滋味，不然我早死了。寡妇不许我抽烟，不许我喊。在别人面前，我连哈欠不能打，懒腰不能伸，痒也不能挠。
          emotion: angry
        - id: ch01-b23
          speaker: huck
          text: 最该死的是，她整天都在祷告！我从没见过这样的女人！我实在非跑不可。学校又快开学了，我还得去上学。那个我绝对受不了！
          emotion: angry
        - id: ch01-b24
          speaker: huck
          text: 你瞧吧，有钱根本没别人吹得那么好。除了不停发愁、不停流汗，就是恨不得死掉。现在这身衣服适合我，这只木桶也适合我，我再也不离开它们了。
          emotion: sad
        - id: ch01-b25
          speaker: huck
          text: 要不是那笔钱，我哪会遭这些罪。你把我那份也拿去吧，只要偶尔给我一角钱就行。也别给得太勤，不费很大劲就能弄到的东西，我根本不稀罕。你再替我求求寡妇，叫她别管我了。
        - id: ch01-b26
          speaker: tom
          text: 哈克，你知道我不能这么做。这样不合适。只要再忍一阵子，你慢慢就会喜欢那种日子了。
        - id: ch01-b27
          speaker: huck
          text: 喜欢？让我在滚烫的炉子上多坐一会儿，我也会喜欢它吧！汤姆，我不想当有钱人，也不要住在那些闷死人的鬼房子里。我喜欢树林、河水和木桶，就守着它们过。
          emotion: angry
        - id: ch01-b28
          speaker: huck
          text: 真倒霉！咱们刚有了枪，也有了山洞，连抢劫的事都安排好了。偏偏冒出这种该死的蠢事，把一切全毁啦！
          emotion: angry
        - id: ch01-b29
          speaker: narrator
          text: 汤姆一听，知道机会来了。
        - id: ch01-b30
          speaker: tom
          text: 哈克，你听我说。我有钱归有钱，可有钱拦不住我去当强盗。
        - id: ch01-b31
          speaker: huck
          text: 真的？哎呀，太好啦！汤姆，你这回真是铁了心吗？
          emotion: surprised
        - id: ch01-b32
          speaker: tom
          text: 跟我正坐在这里一样真。不过哈克，你要是不体面，我们就不能让你入伙。你明白吧？
        - id: ch01-b33
          speaker: narrator
          text: 哈克刚升起来的喜悦，一下子熄灭了。
        - id: ch01-b34
          speaker: huck
          text: 不能让我入伙？汤姆，你们不是让我当过海盗吗？
          emotion: sad
        - id: ch01-b35
          speaker: tom
          text: 那不一样。一般说来，强盗比海盗高贵得多。在大多数国家，强盗都是地位很高的贵族，公爵之类的大人物。
        - id: ch01-b36
          speaker: huck
          text: 汤姆，你一直都拿我当朋友，对吧？你不会把我撇在外头吧？你不会这么对我，是不是，汤姆？
          emotion: sad
        - id: ch01-b37
          speaker: tom
          text: 哈克，我不愿意撇下你，真的不愿意。可别人会怎么说？他们会说：“哼，汤姆·索亚的帮派！里头尽是些下等货色！”他们指的就是你。你听了不高兴，我也不高兴。
        - id: ch01-b38
          speaker: narrator
          text: 哈克沉默了好一阵，心里正激烈地挣扎。过了许久，他终于有了决定。
        - id: ch01-b39
          speaker: huck
          text: 好吧。只要你让我入伙，我就回寡妇家，跟那些规矩拼一个月，看看能不能熬得住。
        - id: ch01-b40
          speaker: tom
          text: 好极了，哈克，太棒啦！走吧，老伙计。我去求寡妇，让她对你放松一点儿。
          emotion: happy
        - id: ch01-b41
          speaker: huck
          text: 你真的肯去？太好啦！只要她把最难受的几条规矩放宽些，我就偷偷抽烟，偷偷骂人。要么硬挤过去，要么豁出去。你打算什么时候叫齐大家，成立帮派去当强盗？
          emotion: happy
        - id: ch01-b42
          speaker: tom
          text: 马上就办。咱们把孩子们叫到一起，说不定今晚就举行入伙仪式。
        - id: ch01-b43
          speaker: huck
          text: 举行什么？
        - id: ch01-b44
          speaker: tom
          text: 入伙仪式。
        - id: ch01-b45
          speaker: huck
          text: 那是什么？
        - id: ch01-b46
          speaker: tom
          text: 就是发誓永远互相帮忙。哪怕被人剁成碎片，也绝不能泄露帮里的秘密。谁伤害了帮里的人，就杀掉他，再杀掉他全家。
        - id: ch01-b47
          speaker: huck
          text: 这可真带劲，实在太带劲了，汤姆！
          emotion: happy
        - id: ch01-b48
          speaker: tom
          text: 那当然。还得在半夜里发誓，地方越偏僻、越吓人越好。闹鬼的房子最合适，可惜现在全给拆烂了。
        - id: ch01-b49
          speaker: huck
          text: 不管怎么说，半夜就很好。
        - id: ch01-b50
          speaker: tom
          text: 没错。还得对着一口棺材发誓，再用血签上名字。
        - id: ch01-b51
          speaker: huck
          text: 这才像样嘛！比当海盗强上一百万倍。汤姆，我就是在寡妇家待到烂掉也不走了。等我成了真正厉害的强盗，人人都在谈论我，我猜寡妇一定会为当初把我从风雨里拖回家而得意！
          emotion: happy
    - id: ch02
      title: 结语
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这部故事就讲到这里。它写的是一个男孩，所以必须在这里结束。再往后讲，就会变成一个男人的故事。
        - id: ch02-b02
          speaker: narrator
          text: 写成年人的小说，作者很清楚该停在哪儿，那就是婚礼。可是写孩子们，就没有这样现成的界线，只能在最合适的地方尽量停住。
        - id: ch02-b03
          speaker: narrator
          text: 书里登场的大多数人，如今仍然活着，日子过得幸福而兴旺。也许有一天，值得重新讲起这些年轻人的故事，看看他们长大后成了怎样的男人和女人。所以现在，最好先别泄露他们后来的生活。
