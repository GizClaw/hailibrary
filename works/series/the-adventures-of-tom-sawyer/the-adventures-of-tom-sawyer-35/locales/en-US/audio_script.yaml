audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry sense of humor
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
    tom:
      display_name: Tom Sawyer
      tts:
        delivery: lively and impulsive, with earnest feeling beneath the bravado
        timbre: bright and youthful
        pace: quick with breathless turns
        pitch: medium-high
    huck:
      display_name: Huckleberry Finn
      tts:
        delivery: rough-edged and independent, with plainspoken warmth
        timbre: youthful and slightly raspy
        pace: easygoing, quickening with excitement
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER XXXV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Tom and Huck's sudden fortune caused a mighty stir in poor little St. Petersburg. That much money, all in real cash, hardly seemed possible. People talked about it, dreamed over it, and praised it until the excitement nearly robbed some of them of their sense. Men began tearing every haunted house in town and in the neighboring villages apart, plank by plank. They dug through the foundations, hunting for treasure. These were not boys at work, either. Some were serious, practical men who had never seemed romantic at all.
        - id: ch01-b02
          speaker: narrator
          text: Wherever Tom and Huck went, people admired them, stared at them, and tried to win their favor. The boys could not remember anyone caring much about their opinions before. Now every remark they made was saved and repeated. Nothing they said or did seemed ordinary anymore. People even searched through their past and found signs that the boys had always been remarkably original. The village newspaper printed stories about their lives.
        - id: ch01-b03
          speaker: narrator
          text: The Widow Douglas invested Huck's money at six percent. At Aunt Polly's request, Judge Thatcher did the same with Tom's. Each boy now received an astonishing income. It came to a dollar for every weekday in the year and half the Sundays. That was what the minister earned. Or rather, it was what people promised him, since he could rarely collect it all. In those simpler days, a dollar and a quarter could feed, house, teach, clothe, and wash a boy for a whole week.
        - id: ch01-b04
          speaker: narrator
          text: Judge Thatcher thought more highly of Tom than ever. He said no ordinary boy could have brought his daughter safely out of the cave. Then Becky privately told him how Tom had taken her punishment at school. She begged her father to forgive the enormous lie Tom had told so the whipping would fall on him instead of her. The judge was deeply moved. He declared that Tom's lie was noble, generous, and great. It deserved to march through history beside George Washington's famous truth about the hatchet. As he paced the floor and stamped his foot, Becky thought her father had never looked so tall or grand. She hurried away and told Tom everything.
        - id: ch01-b05
          speaker: narrator
          text: Judge Thatcher hoped Tom would become a great lawyer or soldier. He planned to get the boy into the National Military Academy, then send him to the finest law school in the country. That way, Tom would be ready for either career, or both.
        - id: ch01-b06
          speaker: narrator
          text: Huck Finn's money and the Widow Douglas's protection brought him into respectable society. No, they dragged him into it and threw him in, and he could barely stand the suffering. The widow's servants kept him washed and tidy. They combed and brushed him, then put him to bed each night in cold, unfriendly sheets without a single spot or stain he could treasure as a friend. He had to eat with a knife and fork and use a napkin, cup, and plate. He had to study his lessons and go to church. He had to speak so properly that the words had no flavor left. Everywhere he turned, civilized life seemed to lock him behind bars and tie him hand and foot.
        - id: ch01-b07
          speaker: narrator
          text: Huck endured his troubles bravely for three weeks. Then, one day, he disappeared. For forty-eight hours, the widow searched everywhere in terrible distress. The whole town worried about him. People hunted high and low, and they dragged the river, looking for his body.
        - id: ch01-b08
          speaker: narrator
          text: Early on the third morning, Tom Sawyer thought to search among some empty old barrels behind the abandoned slaughterhouse. He found the runaway inside one of them. Huck had slept there and had just eaten a breakfast of stolen scraps. Now he lay at ease with his pipe. His hair was tangled, his body was dirty, and he wore the same ruined rags he had worn back when he was free and happy.
        - id: ch01-b09
          speaker: narrator
          text: Tom made Huck come out. He told him how much trouble his disappearance had caused and tried to persuade him to go home. The peaceful look left Huck's face, and he grew miserable.
        - id: ch01-b10
          speaker: huck
          text: Don't start on that, Tom. I tried living that way, and it just don't work. It ain't meant for me. I'm not used to it. The widow's good and friendly, but I can't bear all her rules. She makes me get up at the exact same time every morning. Then I have to wash, and they comb me half to death. She won't even let me sleep in the woodshed. I've got to wear those awful clothes that smother me. Seems like no air can get through them. And they're so terribly fine that I can't sit down or lie down or roll around anywhere. I haven't slid down a cellar door in so long it feels like years.
        - id: ch01-b11
          speaker: huck
          text: Then I've got to sit in church and sweat and sweat through those miserable sermons. I can't catch a fly in there. I can't chew. On Sundays, I have to wear shoes. The widow eats when a bell rings, goes to bed when a bell rings, and gets up when a bell rings. Everything happens so regular that nobody could stand it.
        - id: ch01-b12
          speaker: tom
          text: But everybody lives that way, Huck.
        - id: ch01-b13
          speaker: huck
          text: That don't matter, Tom. I ain't everybody, and I can't stand it. Being tied down like that is awful. Even food comes too easy, so eating ain't any fun. I have to ask before I go fishing. I have to ask before I go swimming. Why, I have to ask before I do anything!
        - id: ch01-b14
          speaker: huck
          text: And I had to talk so nice that speaking wasn't any comfort. Every day, I went up to the attic and let loose for a while, just to get the taste back in my mouth. Otherwise I'd have died, Tom. The widow wouldn't let me smoke or yell. I couldn't yawn, stretch, or scratch when people were around. And, dad fetch it, she prayed all the time! I never saw such a woman. I had to run, Tom. I just had to.
          emotion: angry
        - id: ch01-b15
          speaker: huck
          text: Besides, school will open soon, and I'd have to go. Well, I won't stand for that. Listen, Tom. Being rich ain't nearly as good as people say. It's nothing but worrying and sweating and wishing you were dead. These clothes suit me, and this barrel suits me. I'm never leaving either one again.
        - id: ch01-b16
          speaker: huck
          text: That money caused all this trouble. You take my share and put it with yours. Just give me ten cents once in a while. Not too often, because I don't care much for anything that's easy to get. And please ask the widow to let me go.
        - id: ch01-b17
          speaker: tom
          text: Oh, Huck, you know I can't do that. It wouldn't be fair. Anyway, if you keep trying for a little longer, you'll get used to it.
        - id: ch01-b18
          speaker: huck
          text: Get used to it! Sure, just like I'd get used to sitting on a hot stove if I stayed there long enough. No, Tom. I won't be rich, and I won't live in those cursed, choking houses. I like the woods, the river, and these barrels. That's where I'm staying.
        - id: ch01-b19
          speaker: huck
          text: And just when we had guns and a cave and everything ready for robbing, this foolish mess had to come along and spoil it all!
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: Tom saw his chance.
        - id: ch01-b21
          speaker: tom
          text: Look, Huck. Being rich won't stop me from becoming a robber.
        - id: ch01-b22
          speaker: huck
          text: It won't? Oh, that's grand! Tom, do you truly mean it?
          emotion: surprised
        - id: ch01-b23
          speaker: tom
          text: I mean it as surely as I'm sitting here. But Huck, if you aren't respectable, we can't let you join the gang.
        - id: ch01-b24
          speaker: narrator
          text: Huck's joy went out at once.
        - id: ch01-b25
          speaker: huck
          text: You won't let me join? But you let me be a pirate.
        - id: ch01-b26
          speaker: tom
          text: That's different. Robbers are generally much more high-class than pirates. In most countries, they're way up among the nobles. They're dukes and people like that.
        - id: ch01-b27
          speaker: huck
          text: Tom, you've always been my friend. You wouldn't shut me out, would you? You wouldn't really do that to me, would you, Tom?
        - id: ch01-b28
          speaker: tom
          text: I wouldn't want to, Huck. I truly wouldn't. But think what people would say. They'd say, “Hmph! Tom Sawyer's Gang has some pretty low sorts in it.” They'd mean you. You wouldn't like that, and neither would I.
        - id: ch01-b29
          speaker: narrator
          text: Huck said nothing for a long time. A hard struggle was going on inside him. At last, he made his choice.
        - id: ch01-b30
          speaker: huck
          text: All right. I'll go back to the widow for a month and wrestle with it. I'll see if I can learn to stand it, but only if you let me into the gang.
        - id: ch01-b31
          speaker: tom
          text: Done, Huck! That's splendid. Come on, old fellow. I'll ask the widow to ease up on you a little.
        - id: ch01-b32
          speaker: huck
          text: Will you, Tom? Will you truly do it? Good. If she drops some of the worst rules, I'll smoke in private and cuss in private. I'll squeeze through somehow or burst trying. When are we getting the gang together and starting our robber life?
          emotion: happy
        - id: ch01-b33
          speaker: tom
          text: Right away. We'll gather the boys and maybe hold the initiation tonight.
        - id: ch01-b34
          speaker: huck
          text: Hold the what?
        - id: ch01-b35
          speaker: tom
          text: The initiation.
        - id: ch01-b36
          speaker: huck
          text: What's that?
        - id: ch01-b37
          speaker: tom
          text: We swear to stand by each other and never tell the gang's secrets, even if somebody chops us to pieces. And if anyone hurts one of us, we kill that person and the whole family.
        - id: ch01-b38
          speaker: huck
          text: That's fine, Tom. Mighty fine, I tell you.
          emotion: happy
        - id: ch01-b39
          speaker: tom
          text: You bet it is. And we have to do all the swearing at midnight, in the loneliest and most terrible place we can find. A haunted house is best, except people have torn them all apart now.
        - id: ch01-b40
          speaker: huck
          text: Midnight is good, anyway.
        - id: ch01-b41
          speaker: tom
          text: Yes, it is. And you have to swear over a coffin and sign the oath with blood.
        - id: ch01-b42
          speaker: huck
          text: Now that's the real thing! Why, it's a million times finer than being a pirate. I'll stay with the widow till I rot, Tom. If I become a first-rate robber and everybody talks about me, I reckon she'll be proud she took me in from the rain.
          emotion: happy
    - id: ch02
      title: CONCLUSION
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: And so this chronicle ends. It has been the history of a boy, so it must stop here. If it went much farther, it would become the history of a man. When someone writes a novel about grown people, the proper stopping place is perfectly clear. It ends with a marriage. But a writer telling about young people must stop wherever he can.
        - id: ch02-b02
          speaker: narrator
          text: Most of the people in this book are still alive, happy, and doing well. Perhaps one day it will seem worthwhile to return to the younger ones and discover what kind of men and women they became. For now, it is wiser not to reveal that part of their lives.
