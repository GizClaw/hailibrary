audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    aunt_polly:
      display_name: 波莉姨妈
      tts:
        delivery: 心直口快，严厉里藏着深厚疼爱
        timbre: 温厚而有力
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十九章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 汤姆闷闷不乐地回了家。本想从姨妈那里讨点安慰，谁知她一开口，他就明白自己找错地方了。
        - id: ch01-b02
          speaker: aunt_polly
          text: “汤姆，我真想把你的皮活剥下来！”
          emotion: angry
        - id: ch01-b03
          speaker: tom
          text: “姨妈，我又做什么了？”
        - id: ch01-b04
          speaker: aunt_polly
          text: “你做的还不够多吗？我像个老糊涂似的跑去找塞丽妮·哈珀，还满心以为能让她相信你那场梦。哪知道乔早告诉她了，说你那晚回来过，我们讲的每句话你全听见了。你明知道我会跑去她面前，把自己弄成一个大傻瓜，竟然半个字也不说。你这样胡闹下去，将来可怎么办？只要想起这件事，我心里就难受。”
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: 汤姆忽然看清了这件事的另一面。早晨，他还觉得自己的把戏又聪明又好笑，现在却只觉得这事做得又卑鄙又寒碜。他低着头，半天想不出一句话。
        - id: ch01-b06
          speaker: tom
          text: “姨妈，我真后悔那么做了。可我当时没想到。”
          emotion: sad
        - id: ch01-b07
          speaker: aunt_polly
          text: “孩子，你什么时候替别人想过？你只想着自己。你能大半夜从杰克逊岛老远跑回来，躲着看我们伤心，还把这当成乐子。你也能编出一个梦来骗我，可你就是想不到可怜我们一下，早点让我们知道真相，免得我们受这份苦。”
          emotion: sad
        - id: ch01-b08
          speaker: tom
          text: “姨妈，我现在知道那样很坏，可我不是故意要使坏，真的不是。那天夜里，我回来也不是为了笑话你们。”
        - id: ch01-b09
          speaker: aunt_polly
          text: “那你到底回来做什么？”
        - id: ch01-b10
          speaker: tom
          text: “我想告诉您，我们没有淹死，请您别担心。”
        - id: ch01-b11
          speaker: aunt_polly
          text: “汤姆，要是我能相信你真有过这么好的念头，我会比世上任何人都感恩。可你知道自己没想过，我也知道。”
          emotion: sad
        - id: ch01-b12
          speaker: tom
          text: “我真的想过，姨妈！要是没有，就叫我以后一步也动不了。”
        - id: ch01-b13
          speaker: aunt_polly
          text: “别再撒谎了，汤姆。你这么说，只会让事情坏上一百倍。”
        - id: ch01-b14
          speaker: tom
          text: “我没撒谎。我回来就是不想让您伤心，这是真的。”
        - id: ch01-b15
          speaker: aunt_polly
          text: “我要能信这句话，拿全世界来换都情愿。它能替你遮掉一大堆过错，我甚至会因为你逃出去胡闹过而感到高兴。可是孩子，这事怎么也说不通呀。你既然特意回来告诉我，为什么最后一个字也没说？”
        - id: ch01-b16
          speaker: tom
          text: “因为你们后来讲起葬礼，我满脑子都是回来躲进教堂的计划，实在舍不得把它毁掉。于是我又把树皮塞进口袋，一句话也没说。”
        - id: ch01-b17
          speaker: aunt_polly
          text: “什么树皮？”
        - id: ch01-b18
          speaker: tom
          text: “我在一片树皮上写了字，想告诉您，我们只是去当海盗了。现在我真希望，那晚我亲您的时候，您能醒过来。我说的都是真话。”
        - id: ch01-b19
          speaker: narrator
          text: 姨妈脸上紧绷的纹路慢慢松开，眼里忽然有了温柔的光。
        - id: ch01-b20
          speaker: aunt_polly
          text: “汤姆，你真的亲过我？”
          emotion: surprised
        - id: ch01-b21
          speaker: tom
          text: “当然亲过。”
        - id: ch01-b22
          speaker: aunt_polly
          text: “你肯定吗，汤姆？”
        - id: ch01-b23
          speaker: tom
          text: “当然肯定，姨妈，千真万确。”
        - id: ch01-b24
          speaker: aunt_polly
          text: “那你为什么亲我？”
        - id: ch01-b25
          speaker: tom
          text: “因为我很爱您。您躺在那里不停地哼哼，我心里难受极了。”
          emotion: sad
        - id: ch01-b26
          speaker: narrator
          text: 这番话听着就是真的。老太太再开口时，声音已经微微发颤，怎么也掩不住。
        - id: ch01-b27
          speaker: aunt_polly
          text: “汤姆，再亲我一下！然后赶紧上学去，别再烦我了。”
        - id: ch01-b28
          speaker: narrator
          text: 汤姆一出门，姨妈就跑到壁橱前，拿出了他当海盗时穿的那件破外套。可衣服握在手里，她又停住了。
        - id: ch01-b29
          speaker: aunt_polly
          text: “不行，我不敢看。可怜的孩子，我猜这还是他编的。不过这谎话多叫人安慰呀，简直像得了福。我希望上帝……不，我知道上帝会原谅他，因为他肯这么说，是出于一片好心。可我不愿亲眼看见它是假的。我不看。”
        - id: ch01-b30
          speaker: narrator
          text: 她把外套放了回去，站在旁边默默想了一会儿。她两次伸手去拿那件衣服，又两次硬把手缩了回来。第三次，她终于鼓起了勇气，还用一句话给自己壮胆。
        - id: ch01-b31
          speaker: aunt_polly
          text: “这是个好谎话，是个好谎话。我不能为它伤心。”
        - id: ch01-b32
          speaker: narrator
          text: 她摸进外套口袋。没过多久，她便泪流满面地读着汤姆写在树皮上的话。
        - id: ch01-b33
          speaker: aunt_polly
          text: “现在，就算这孩子犯过一百万桩罪，我也能原谅他！”
