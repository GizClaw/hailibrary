audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry sense of humor
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
    tom:
      display_name: Tom
      tts:
        delivery: quick, bold, and mischievous
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    aunt_polly:
      display_name: Aunt Polly
      tts:
        delivery: practical, concerned, and warmly stern
        timbre: mature and hearty
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER XIX
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Tom came home feeling miserable. His aunt's very first words told him he would find no comfort there.
        - id: ch01-b02
          speaker: aunt_polly
          text: "Tom, I ought to skin you alive!"
          emotion: angry
        - id: ch01-b03
          speaker: tom
          text: "Why, Auntie? What did I do?"
        - id: ch01-b04
          speaker: aunt_polly
          text: "You've done plenty. I went over to Sereny Harper's like an old fool, thinking she'd believe all that nonsense about your dream. Then I found out Joe had told her you came here that night and heard every word we said. Tom, what am I going to do with a boy who behaves like that? You knew I would go over there and make a fool of myself, and you never said one word. It hurts me to think of it."
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: Tom had not seen it that way before. That morning, the trick had seemed clever and funny. Now it seemed mean and shameful. He lowered his head and could not think of a thing to say. After a moment, he spoke.
        - id: ch01-b06
          speaker: tom
          text: "Auntie, I wish I hadn't done it. I just didn't think."
        - id: ch01-b07
          speaker: aunt_polly
          text: "Oh, child, you never think. You think about yourself and nothing else. You could come all the way from Jackson's Island at night to laugh at our misery. You could fool me with that story about a dream. But you couldn't spare one thought for us and keep us from grieving."
          emotion: angry
        - id: ch01-b08
          speaker: tom
          text: "I know it was mean now, Auntie, but I wasn't trying to be mean. Honest, I wasn't. And I didn't come here that night to laugh at you."
        - id: ch01-b09
          speaker: aunt_polly
          text: "Then why did you come?"
        - id: ch01-b10
          speaker: tom
          text: "I came to tell you not to worry about us. We hadn't drowned."
        - id: ch01-b11
          speaker: aunt_polly
          text: "Tom, I would be the most thankful soul alive if I could believe you had a thought that kind. But you know you didn't, and I know it too."
        - id: ch01-b12
          speaker: tom
          text: "I truly did, Auntie. I hope I never move again if I didn't."
        - id: ch01-b13
          speaker: aunt_polly
          text: "Oh, Tom, please don't lie. It only makes everything a hundred times worse."
        - id: ch01-b14
          speaker: tom
          text: "It isn't a lie, Auntie. It's true. I only came because I wanted you to stop grieving."
        - id: ch01-b15
          speaker: aunt_polly
          text: "I'd give the whole world to believe that. It would make up for a great many sins, Tom. I'd almost be glad you ran away and behaved so badly. But it doesn't make sense. If that's why you came, why didn't you tell me?"
        - id: ch01-b16
          speaker: tom
          text: "Well, when you started talking about the funeral, I suddenly thought of us hiding in the church. I couldn't stand to spoil it. So I put the piece of bark back in my pocket and kept quiet."
        - id: ch01-b17
          speaker: aunt_polly
          text: "What piece of bark?"
        - id: ch01-b18
          speaker: tom
          text: "The one I wrote on to tell you we'd gone off to be pirates. I wish you'd woken up when I kissed you. I really do."
        - id: ch01-b19
          speaker: narrator
          text: The stern lines in Aunt Polly's face softened, and her eyes suddenly grew tender.
        - id: ch01-b20
          speaker: aunt_polly
          text: "You kissed me, Tom?"
          emotion: surprised
        - id: ch01-b21
          speaker: tom
          text: "Why, yes, I did."
        - id: ch01-b22
          speaker: aunt_polly
          text: "Are you certain, Tom?"
        - id: ch01-b23
          speaker: tom
          text: "Yes, Auntie. Certain sure."
        - id: ch01-b24
          speaker: aunt_polly
          text: "Why did you kiss me, Tom?"
        - id: ch01-b25
          speaker: tom
          text: "Because I love you. You were lying there moaning, and I felt so sorry for you."
        - id: ch01-b26
          speaker: narrator
          text: His words sounded true. Aunt Polly tried to hide the tremble in her voice, but she could not.
        - id: ch01-b27
          speaker: aunt_polly
          text: "Kiss me again, Tom. Then off you go to school, and don't trouble me any more."
        - id: ch01-b28
          speaker: narrator
          text: As soon as Tom left, Aunt Polly ran to a closet and pulled out the jacket he had worn when he went off to be a pirate. The jacket was nearly ruined now. She held it for a moment, then stopped herself.
        - id: ch01-b29
          speaker: aunt_polly
          text: "No, I don't dare look. The poor boy has probably lied about it. Still, it's a blessed lie, and it has brought me such comfort. I hope the Lord will forgive him. No, I know the Lord will forgive him, because he told it out of kindness. But I don't want to learn that it was a lie. I won't look."
        - id: ch01-b30
          speaker: narrator
          text: She put the jacket away and stood thinking for a minute. Twice she reached for it, and twice she drew back. Then she gathered her courage one more time.
        - id: ch01-b31
          speaker: aunt_polly
          text: "It's a good lie. It's a good lie. I won't let it hurt me."
        - id: ch01-b32
          speaker: narrator
          text: She searched the jacket pocket. A moment later, tears were streaming down her face as she read Tom's message on the piece of bark.
        - id: ch01-b33
          speaker: aunt_polly
          text: "I could forgive that boy now, even if he'd committed a million sins!"
          emotion: happy
