audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry sense of humor
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
    tom:
      display_name: Tom Sawyer
      tts:
        delivery: lively and impulsive, with earnest feeling beneath the bravado
        timbre: bright and youthful
        pace: quick with breathless turns
        pitch: medium-high
    huck:
      display_name: Huck Finn
      tts:
        delivery: wary and plainspoken, with rough country phrasing
        timbre: light and weathered
        pace: quick when nervous, otherwise easy
        pitch: medium-high
    sid:
      display_name: Sid
      tts:
        delivery: precise, watchful, and quietly self-satisfied
        timbre: neat and youthful
        pace: measured
        pitch: medium-high
    aunt_polly:
      display_name: Aunt Polly
      tts:
        delivery: brisk and spirited, with deep affection beneath her scolding
        timbre: warm and slightly husky
        pace: lively
        pitch: medium
    widow_douglas:
      display_name: Widow Douglas
      tts:
        delivery: gracious and earnest
        timbre: warm and mature
        pace: measured
        pitch: medium
    welshman:
      display_name: The Welshman
      tts:
        delivery: hearty, direct, and reassuring
        timbre: deep and sturdy
        pace: steady
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XXXIV
      blocks:
        - id: ch01-b01
          speaker: huck
          text: Tom, if we can find a rope, we can get out through the window. It ain't very far to the ground.
        - id: ch01-b02
          speaker: tom
          text: Shucks! What do you want to run away for?
        - id: ch01-b03
          speaker: huck
          text: I ain't used to crowds like that. I can't take it, Tom. I ain't going downstairs.
        - id: ch01-b04
          speaker: tom
          text: Oh, quit worrying. It's nothing. It doesn't bother me, and I'll look after you.
        - id: ch01-b05
          speaker: narrator
          text: Then Sid came in.
        - id: ch01-b06
          speaker: sid
          text: Tom, Aunt Polly has been waiting for you all afternoon. Mary laid out your Sunday clothes, and everybody has been worrying. Say, is that grease and clay all over what you're wearing?
        - id: ch01-b07
          speaker: tom
          text: Now, Mr. Siddy, you mind your own business. What's this big celebration for, anyway?
        - id: ch01-b08
          speaker: sid
          text: It's one of the widow's parties. She gives them all the time. Tonight it's for the Welshman and his sons, because they saved her from that trouble the other night. And I've got something I could tell you, if you want to hear it.
        - id: ch01-b09
          speaker: tom
          text: Well? What is it?
        - id: ch01-b10
          speaker: sid
          text: Old Mr. Jones plans to surprise everybody tonight. I heard him tell Aunt Polly about it in secret. It isn't much of a secret anymore, though. Everybody knows, even the widow, no matter how hard she pretends she doesn't. Mr. Jones insisted that Huck come. He can't put on his grand surprise without Huck, you know.
        - id: ch01-b11
          speaker: tom
          text: What's the secret about, Sid?
        - id: ch01-b12
          speaker: sid
          text: It's about Huck following the robbers to the widow's house. Mr. Jones meant to make a grand show of revealing it, but I bet his surprise falls pretty flat.
        - id: ch01-b13
          speaker: narrator
          text: Sid gave a pleased little chuckle. He was thoroughly satisfied with himself.
        - id: ch01-b14
          speaker: tom
          text: Sid, were you the one who told everybody?
        - id: ch01-b15
          speaker: sid
          text: Oh, never mind who told. Somebody did, and that's all that matters.
        - id: ch01-b16
          speaker: tom
          text: Sid, only one person in this town is mean enough to do that, and it's you. If you'd been in Huck's place, you would've slipped back down the hill and never warned anybody about those robbers. All you can do is something mean, and you can't stand seeing somebody get praised for doing good. There. No thanks, as the widow says.
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: Tom boxed Sid's ears, then helped him through the door with several kicks.
        - id: ch01-b18
          speaker: tom
          text: Go tell Aunt Polly, if you dare! Tomorrow, I'll make you pay for it!
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: A few minutes later, the widow's guests sat down to supper. In the same room, a dozen children were perched at small side tables, as children were in that place and time.
        - id: ch01-b20
          speaker: narrator
          text: When the right moment came, Mr. Jones stood to make a short speech. He thanked the widow for honoring him and his sons. Then he said there was someone else involved, someone too modest to speak of his own part in the adventure.
        - id: ch01-b21
          speaker: narrator
          text: He went on that way for a while. Then he revealed Huck's part with all the drama he could manage. But most of the guests already knew, so their surprise was largely an act. Their reaction was far quieter than it would have been if Sid had kept the secret.
        - id: ch01-b22
          speaker: narrator
          text: Still, the widow put on a respectable show of astonishment. She poured so much praise and gratitude over Huck that he nearly forgot how unbearable his new clothes felt. Nearly. Having everybody stare at him and praise him was even worse.
        - id: ch01-b23
          speaker: widow_douglas
          text: Huck, I mean to give you a home here under my roof and see that you're educated. As soon as I can afford it, I'll help you start a modest business of your own.
        - id: ch01-b24
          speaker: narrator
          text: This was the opening Tom had been waiting for.
        - id: ch01-b25
          speaker: tom
          text: Huck doesn't need that. Huck's rich.
        - id: ch01-b26
          speaker: narrator
          text: Only the strain of good manners kept the guests from giving Tom's pleasant joke the laugh it deserved. Instead, an awkward silence settled over the room. Tom broke it himself.
        - id: ch01-b27
          speaker: tom
          text: Huck has money. Maybe you don't believe me, but he's got piles of it. You can stop smiling. I can prove it. Just wait here a minute.
        - id: ch01-b28
          speaker: narrator
          text: Tom dashed outside. The guests looked at one another, puzzled and curious. Then they turned questioning eyes on Huck, who could not get a word out.
        - id: ch01-b29
          speaker: aunt_polly
          text: Sid, what has gotten into Tom? Well, there's just no understanding that boy. I never—
        - id: ch01-b30
          speaker: narrator
          text: Before Aunt Polly could finish, Tom came back, struggling beneath the weight of his sacks. He poured a heap of yellow coins across the table.
        - id: ch01-b31
          speaker: tom
          text: There! What did I tell you? Half of that belongs to Huck, and the other half is mine!
        - id: ch01-b32
          speaker: narrator
          text: The sight stole the breath from everyone in the room. For a moment, they could only stare. Nobody spoke. Then every voice called for an explanation.
        - id: ch01-b33
          speaker: narrator
          text: Tom said he could explain, and he did. It was a long story, but every part held their attention. Almost no one interrupted him. His tale carried the whole room along until he reached the end.
        - id: ch01-b34
          speaker: welshman
          text: I thought I'd arranged a fine little surprise for tonight, but it doesn't amount to a thing now. Beside this one, mine looks mighty small. I'll admit that.
        - id: ch01-b35
          speaker: narrator
          text: They counted the money. It came to a little more than twelve thousand dollars.
        - id: ch01-b36
          speaker: narrator
          text: No one there had ever seen so much money gathered in one place, even though several of the guests owned property worth considerably more.
