audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 聪明好胜，兴奋时语速加快，害怕时压低声音
        timbre: 清亮的少年声
        pace: 轻快灵活
        pitch: 中高音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，带着街头少年的粗朴和谨慎
        timbre: 略带沙哑的少年声
        pace: 自然偏慢
        pitch: 中音
    welshman:
      display_name: 老威尔士人
      tts:
        delivery: 直率警觉，沉稳有主见
        timbre: 强健沧桑
        pace: 从容
        pitch: 低音
    widow_douglas:
      display_name: 道格拉斯寡妇
      tts:
        delivery: 仁慈虔诚，关切时温柔坚定
        timbre: 温厚成熟的女声
        pace: 从容
        pitch: 中音
    sid:
      display_name: 西德
      tts:
        delivery: 一本正经又爱卖弄，得意时藏不住笑意
        timbre: 清脆的少年声
        pace: 自然偏快
        pitch: 中高音
    aunt_polly:
      display_name: 波莉姨妈
      tts:
        delivery: 直爽慈爱，抱怨里总带着牵挂
        timbre: 温暖厚实的年长女声
        pace: 自然
        pitch: 中音
  chapters:
    - id: ch01
      title: 第三十四章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 汤姆，只要能找到绳子，咱们就从窗户溜出去吧。那里离地面不高。
        - id: ch01-b02
          speaker: tom
          text: 别胡说了！好端端的，为什么要溜？
        - id: ch01-b03
          speaker: huck
          text: 我不习惯跟这种人在一起，实在受不了。汤姆，我不下楼。
        - id: ch01-b04
          speaker: tom
          text: 哎呀，没什么可怕的，我根本不在乎。放心，我会照应你。
        - id: ch01-b05
          speaker: narrator
          text: 这时，西德走了进来。
        - id: ch01-b06
          speaker: sid
          text: 汤姆，姨妈等了你整整一下午。玛丽连你的礼拜服都备好了，大家一直在为你着急。喂，你衣服上这些东西，不是油和泥吗？
        - id: ch01-b07
          speaker: tom
          text: 西德少爷，你还是管好自己的事吧。楼下到底为什么摆这么大的宴席？
        - id: ch01-b08
          speaker: sid
          text: 还不是寡妇常办的那种聚会。不过今晚请的是老威尔士人和他两个儿子，因为前几天夜里，他们帮寡妇躲过了一场祸。对了，你要想听，我还知道一件事。
        - id: ch01-b09
          speaker: tom
          text: 什么事？
        - id: ch01-b10
          speaker: sid
          text: 老琼斯先生今晚要当众揭开一个秘密。他今天悄悄告诉姨妈，叫我听见了。不过现在大家差不多全知道啦，连寡妇也知道，只是她拼命装作不知道。琼斯先生一定要哈克来，因为少了哈克，他那个天大的秘密就揭不开了！
        - id: ch01-b11
          speaker: tom
          text: 到底是什么秘密？
        - id: ch01-b12
          speaker: sid
          text: 就是哈克跟踪强盗，一直跟到寡妇家那件事。琼斯先生原想靠这个惊喜大出风头，可我敢说，到时候场面一定冷得很。
        - id: ch01-b13
          speaker: narrator
          text: 西德说完，咯咯笑起来，满脸都是得意。
        - id: ch01-b14
          speaker: tom
          text: 西德，是你把事情说出去的？
        - id: ch01-b15
          speaker: sid
          text: 管它是谁说的呢。反正有人说了，这就够啦。
        - id: ch01-b16
          speaker: tom
          text: 这镇上卑鄙得能干出这种事的，只有你。换成你站在哈克的位置上，你准会偷偷溜下山，任那帮强盗去害人，也不告诉别人。你只会做卑鄙事，又受不了别人做好事、受夸奖。行啦，不用谢，寡妇总这么说。
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: 汤姆扇了西德几个耳光，又连踢几脚，把他送到门口。
        - id: ch01-b18
          speaker: tom
          text: 你敢去告诉姨妈就去吧。明天有你好受的！
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: 几分钟后，客人们在寡妇家的餐桌旁坐好。依照当地当时的规矩，十来个孩子也坐在同一间屋子的几张小边桌旁。时候一到，琼斯先生站起来说了几句话。他先感谢寡妇这样看重自己和两个儿子，接着又说，还有一个人，因为天性谦逊，所以……
        - id: ch01-b20
          speaker: narrator
          text: 后面无非还是那一套。琼斯先生使出浑身解数，把哈克在那场冒险里出的力，当成一个了不起的秘密揭开。可在座的人大多早已听说，脸上的惊讶都是装的，欢呼自然也不够响亮热烈。
        - id: ch01-b21
          speaker: narrator
          text: 道格拉斯寡妇倒把惊讶做得很像，又不停地感谢哈克、夸奖哈克。哈克的新衣服本来已经让他浑身不自在，几乎受不了，如今大家还一起盯着他、夸着他，那就更难熬了。相比之下，他几乎忘了衣服有多难受。
        - id: ch01-b22
          speaker: widow_douglas
          text: 我要让哈克住到我家来，再送他去读书。以后手头宽裕了，我还要给他置办一份小生意。
        - id: ch01-b23
          speaker: narrator
          text: 汤姆一听，知道自己的机会来了。
        - id: ch01-b24
          speaker: tom
          text: 哈克不需要。哈克有钱。
        - id: ch01-b25
          speaker: narrator
          text: 大家都把这话当成了笑话。只是为了守住礼貌，他们才忍着没有笑出声。于是，屋里忽然安静得有些尴尬。汤姆只好继续往下说。
        - id: ch01-b26
          speaker: tom
          text: 哈克真的有钱，而且多着呢。你们也许不信。别笑，我能拿给你们看。等我一会儿。
        - id: ch01-b27
          speaker: narrator
          text: 汤姆跑出门去。客人们迷惑地互相看看，又带着疑问望向哈克。哈克舌头打了结，一个字也说不出来。
        - id: ch01-b28
          speaker: aunt_polly
          text: 西德，汤姆这是怎么啦？这个孩子，谁也永远弄不明白。我从来没有……
        - id: ch01-b29
          speaker: narrator
          text: 波莉姨妈的话还没说完，汤姆就回来了。他拖着几个沉重的口袋，走起路来十分吃力。接着，他把一大堆黄澄澄的金币全倒在桌上。
        - id: ch01-b30
          speaker: tom
          text: 瞧，我说什么来着？一半是哈克的，一半是我的！
        - id: ch01-b31
          speaker: narrator
          text: 所有人都倒吸一口气，盯着金币看，一时间谁也说不出话来。接着，大家同时嚷着要听个究竟。汤姆说自己能讲清楚，便从头到尾讲了起来。
        - id: ch01-b32
          speaker: narrator
          text: 那个故事很长，却处处引人入胜。大家听得入了迷，几乎没有一个人出声打断。等汤姆讲完，琼斯先生开口了。
        - id: ch01-b33
          speaker: welshman
          text: 我还以为自己给今晚准备了一个小惊喜。现在看来，那根本算不了什么。跟你这个惊喜一比，我那个实在太小，连声音都听不见了。
        - id: ch01-b34
          speaker: narrator
          text: 大家把钱数了一遍，总数略多于一万两千美元。在场的人从没见过这么多钱同时摆在眼前。其实，其中有好几位名下的财产，远远不止这个数目。
