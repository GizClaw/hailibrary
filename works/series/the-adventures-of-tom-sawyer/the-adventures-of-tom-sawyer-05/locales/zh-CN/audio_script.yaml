audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    sprague:
      display_name: 斯普拉格牧师
      tts:
        delivery: 庄严郑重，朗诵时抑扬夸张
        timbre: 洪亮厚实
        pace: 中等偏慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第五章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 十点半左右，小教堂那口破钟响了起来。人们陆续赶来听早晨的布道。主日学校的孩子们散坐在教堂各处，都挨着父母，好让大人看住。波莉姨妈带着汤姆、锡德和玛丽坐下。汤姆被放在靠过道的一头，尽量远离敞开的窗户，免得窗外的夏日景色勾走他的心。
        - id: ch01-b02
          speaker: narrator
          text: 人群从过道里一个接一个地走进来。先是年老穷困、早年风光过的邮政局长。接着是镇长和夫人，这地方除了许多没用的东西，居然还设了一位镇长。后面有治安法官，还有漂亮利落、四十岁的道格拉斯寡妇。她有钱，也慷慨善良。山坡上那座宅子是镇里唯一的宫殿。论好客，论大办宴会，圣彼得堡也数她家最阔气。
        - id: ch01-b03
          speaker: narrator
          text: 佝偻而德高望重的沃德少校和夫人也来了。外地来的新名人里弗森律师跟在后面。村里最漂亮的姑娘一露面，身边就围着一群穿细麻布、系彩带、专叫人伤心的小美人。全镇的年轻店员也倾巢而出。他们刚才一直守在门厅，嘴里吮着手杖头，头发抹得油亮，脸上堆着笑，围成一堵爱慕者的人墙，直到最后一个姑娘从眼前走过。
        - id: ch01-b04
          speaker: narrator
          text: 最后来的是模范少年威利·马弗森。他扶着母亲，小心得像在照料一件玻璃器皿。他每个星期日都陪母亲来教堂，所有做母亲的人都拿他当骄傲。男孩们却恨透了他，因为他实在太乖，大人还总拿他来数落他们。和每个星期日一样，他裤子后袋露着一块白手帕，当然只是“不小心”露出来的。汤姆自己没有手帕，便认定有手帕的男孩全是装模作样的讨厌鬼。
        - id: ch01-b05
          speaker: narrator
          text: 人都到齐了，钟又响一遍，催那些迟到和磨蹭的人快些进来。随后，庄严的寂静落在教堂里，只有楼座上唱诗班的窃笑和低语不时传下来。整个礼拜期间，他们总是这样。很多年前，倒有过一个举止不粗野的唱诗班。可那是在什么地方呢？叙述这个故事的人已经记不得了，只依稀觉得是在某个外国。
        - id: ch01-b06
          speaker: narrator
          text: 牧师报出圣诗的篇目，兴致勃勃地朗诵起来。他那种特别的腔调，在当地很受赞赏。声音先从中间的调门起步，稳稳地越爬越高。到了最高处，他把顶上那个词重重托住，然后像从跳板上一跃而下，声音猛然落了下去。
        - id: ch01-b07
          speaker: sprague
          text: “难道我能乘着安逸的花床，升上天堂？别人却为得奖赏奋战，航过血海茫茫？”
        - id: ch01-b08
          speaker: narrator
          text: 大家都说他朗诵得绝妙。教会办联谊会时，也总要请他念诗。等他念完，太太们会把双手举起来，又软软地落回膝上。她们翻着眼睛，摇着头，那神情分明是在说，言语根本形容不了，这实在太美了，美得尘世都不配拥有。
        - id: ch01-b09
          speaker: narrator
          text: 圣诗唱完，斯普拉格牧师仿佛变成了一块布告牌。他把各种集会、社团和其他事情的通知逐项念下去，那张单子像要一直拖到末日来临。直到报纸已经很多的今天，美国仍保留着这项奇怪的习俗，城市里也一样。旧规矩往往越没有道理，人们反倒越难把它废掉。
        - id: ch01-b10
          speaker: narrator
          text: 接下来是祷告。这篇祷词善意宽厚，照顾得十分周全。牧师为教会和教会里的孩子祈求，也为村里的其他教会祈求。他从村子一路祈求到县、州和州里的官员，又祈求到美国、美国的教会、国会、总统和政府官员。
        - id: ch01-b11
          speaker: narrator
          text: 他还为在狂风恶浪里颠簸的可怜水手祈求，为欧洲君主和东方专制统治铁蹄下呻吟的千百万受压迫者祈求。有人已经见到光明，听见福音，却还是看不见、听不进，他也为这些人祈求。遥远海岛上的异教徒也没有漏掉。最后，他恳求上帝赐下恩典，让自己将要说的话像种子落进肥沃的土地，日后结出丰美可喜的善果。祷告终于在一声阿门中结束。
        - id: ch01-b12
          speaker: narrator
          text: 衣裳窸窣作响，会众纷纷坐下。汤姆一点也不喜欢祷告，只能勉强熬着。整个过程里，他坐立不安，不知不觉却把祷词中的项目一项项数了下来。他其实没有听，只是早就熟悉这片地界，也熟悉牧师每回走的路线。偶尔多出一点新内容，他的耳朵马上就能发现，全副性情也立刻起来反对。汤姆觉得，临时添东西既不公平，又卑鄙无耻。
        - id: ch01-b13
          speaker: narrator
          text: 祷告到一半，一只苍蝇落在前排长凳的靠背上，开始折磨汤姆。它从容地搓着两只手，又把胳膊抱到头上，使劲擦洗，仿佛要把脑袋从身上擦掉，连细线似的脖子都露了出来。接着，它用后腿刮过翅膀，再把翅膀抚平在身侧，就像整理燕尾服的后摆。它安安稳稳地梳洗全身，似乎知道谁也不敢碰它。
        - id: ch01-b14
          speaker: narrator
          text: 它确实安全。汤姆的手痒得厉害，却不敢伸过去。他相信祷告时抓苍蝇，自己的灵魂会立刻毁灭。直到牧师念出最后一句，他的手指才弯起来，悄悄向前摸去。“阿门”刚出口，苍蝇便做了战俘。可波莉姨妈看见了，马上叫他把苍蝇放走。
        - id: ch01-b15
          speaker: narrator
          text: 牧师报出经文，又用单调的声音讲起枯燥乏味的道理。没过多久，许多人的脑袋就一点一点垂了下去。那番话讲的偏偏是无穷的烈火和硫黄，还把上帝预定得救的人削减到寥寥几个，少得几乎不值得拯救。汤姆只顾数讲稿有多少页。每次礼拜以后，他都记得页数，至于牧师到底说过什么，他通常一点也不知道。
        - id: ch01-b16
          speaker: narrator
          text: 不过这一回，他确实听进去了一小会儿。牧师描绘千禧年来临时的宏伟景象。全世界的人聚在一起，狮子和羔羊并肩躺着，一个小孩子领着它们。这里面的哀感、教诲和寓意，汤姆一样也没听懂。他只想到，那孩子站在天下万民眼前，一定非常出风头。想到这里，他的脸亮了起来。
        - id: ch01-b17
          speaker: tom
          text: “只要那头狮子是驯服的，我真想当那个孩子。”
        - id: ch01-b18
          speaker: narrator
          text: 枯燥的论说又开始了，汤姆也重新受起罪来。忽然，他想起自己还带着一件宝贝，便把它掏了出来。那是一只黑甲虫，长着一对吓人的大颚。汤姆管它叫“大夹虫”，平时把它装在火帽盒里。甲虫一出来，就在他手指上狠狠夹了一口。汤姆本能地一弹，甲虫翻滚着掉进过道，仰面躺下。他把受伤的手指塞进嘴里。甲虫在地上无助地蹬腿，怎么也翻不过身。汤姆眼巴巴看着，却够不着它。
        - id: ch01-b19
          speaker: narrator
          text: 其他不爱听布道的人也发现了甲虫，纷纷拿它解闷。一只流浪的卷毛狗懒洋洋地走过来。夏日暖洋洋，教堂里又安静，它早就待腻了，一心想碰上点变化。它看见甲虫，低垂的尾巴立刻抬起，摇了几下。它先端详这个猎物，绕着走一圈，隔着安全距离嗅了嗅。又绕一圈以后，它胆子大了，凑近再闻，掀起嘴唇，小心地咬了一口，却没咬着。
        - id: ch01-b20
          speaker: narrator
          text: 卷毛狗试了一次又一次，渐渐喜欢上了这个游戏。它趴下来，把甲虫放在两只前爪中间，继续试探。过了一阵，它又厌烦了，先是不在意，后来干脆走了神。它的脑袋一点点垂下去，下巴慢慢碰到敌人。甲虫猛地夹住了它。卷毛狗尖叫一声，使劲甩头。甲虫飞出两码开外，再次仰面落地。
        - id: ch01-b21
          speaker: narrator
          text: 周围的人暗自快活，身子笑得轻轻发抖。好几张脸躲到了扇子和手帕后面，汤姆更是高兴透了。卷毛狗看上去很傻，大概自己也觉得丢脸。可它心里又恼火，又想报仇，于是重新扑向甲虫。它绕着圆圈从各个方向发动进攻，两只前爪每次都落在离甲虫不到一英寸的地方。牙齿越咬越近，脑袋猛甩，连两只耳朵也跟着啪啪拍打。
        - id: ch01-b22
          speaker: narrator
          text: 没多久，卷毛狗又累了。它去招惹一只苍蝇，没觉得有趣。它把鼻子贴近地面，跟着一只蚂蚁转悠，很快也腻了。它打个哈欠，叹口气，把甲虫彻底忘掉，一屁股坐了上去。刹那间，一声痛苦的狂叫冲了出来。卷毛狗顺着过道飞奔，一边跑，一边不停地叫。它从圣坛前横穿教堂，又冲下另一条过道，从大门前飞驰而过，随后大叫着奔上最后一段直道。
        - id: ch01-b23
          speaker: narrator
          text: 它越跑越痛，很快就像一颗沿轨道疾驰的毛茸茸的彗星，闪得像光，快得也像光。最后，这个发狂的受难者猛然偏离路线，跳进主人的怀里。主人一把将它扔出窗外。那痛苦的叫声越来越细，很快消失在远处。
        - id: ch01-b24
          speaker: narrator
          text: 这时候，全教堂的人都涨红了脸，憋笑憋得喘不过气，布道只好彻底停下。过了一会儿，牧师重新开讲，可他讲得磕磕绊绊，再也不可能打动任何人。哪怕他说出最庄严的话，远处某排长凳的靠背后面也总会爆出一阵压低的、不大虔敬的笑声，仿佛这个可怜人刚刚讲了绝妙的笑话。折磨终于结束，牧师宣布祝福，所有人都真正松了口气。
        - id: ch01-b25
          speaker: narrator
          text: 汤姆·索亚兴高采烈地回了家。他觉得，只要偶尔来点新花样，教堂礼拜倒也有几分乐趣。只有一件事让他不痛快。他愿意让那只狗跟自己的大夹虫玩，可狗把虫子一起带走，实在不怎么光明正大。
