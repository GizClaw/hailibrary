  chapters:
    - id: ch01
      title: CHAPTER V
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At about half past ten, the cracked bell of the little church began to ring. Before long, people were gathering for the morning sermon. The Sunday school children spread through the church and sat with their parents, where someone could keep an eye on them. Aunt Polly arrived with Tom, Sid, and Mary. She put Tom beside the aisle, as far as she could get him from the open window and the tempting summer world outside.
        - id: ch01-b02
          speaker: narrator
          text: The rest of the town came filing in. There was the old postmaster, poor now after better days, followed by the mayor and his wife. St. Petersburg had a mayor, along with several other things it could have managed without. The justice of the peace came too. So did Widow Douglas, a handsome, clever woman of forty with a generous heart and plenty of money. Her house on the hill was the nearest thing the town had to a palace, and no one gave finer or more plentiful parties.
        - id: ch01-b03
          speaker: narrator
          text: Bent old Major Ward entered with Mrs. Ward. Lawyer Riverson came next, the important newcomer from far away. Then came the prettiest young woman in the village, with a flock of girls in pale dresses and bright ribbons behind her. Every young clerk in town followed. They had waited in the entrance, chewing the knobs of their canes and forming a smiling, well-oiled wall of admirers until the last girl had passed between them.
        - id: ch01-b04
          speaker: narrator
          text: Last came Willie Mufferson, the Model Boy. He guided his mother with as much care as if she were made of thin glass. He always brought her to church, and all the older ladies thought he was wonderful. The other boys hated him for being so good, and because their mothers were always telling them to be more like Willie. As usual on Sunday, a white handkerchief hung from his back pocket. It looked accidental. Tom had no handkerchief, and he considered any boy who carried one a snob.
        - id: ch01-b05
          speaker: narrator
          text: When everyone had settled in, the bell rang again to warn anyone still wandering in late. A solemn silence filled the church, except for the choir giggling and whispering up in the gallery. They giggled and whispered through every service. I once heard of a church choir that behaved well, but it was many years ago, and I believe it was somewhere in a foreign country.
        - id: ch01-b06
          speaker: narrator
          text: Reverend Mr. Sprague announced the hymn and read it with great pleasure. People in that part of the country admired his special style. His voice began in the middle, climbed steadily toward one important word, struck that word with all its force, then dropped from it like a man diving off a springboard.
        - id: ch01-b07
          speaker: mr_sprague
          text: "Shall I be carried to the skies on flowery beds of ease, while others fight to win the prize and sail through bloody seas?"
        - id: ch01-b08
          speaker: narrator
          text: Everyone agreed that he was a marvelous reader. At church social gatherings, they always asked him to recite poetry. When he finished, the ladies would raise their hands, let them fall helplessly into their laps, roll their eyes, and shake their heads. Their faces said that words could never express it. His reading was simply too beautiful for this ordinary earth.
        - id: ch01-b09
          speaker: narrator
          text: After the hymn was sung, Mr. Sprague became a living notice board. He announced meeting after meeting and society after society until the list seemed likely to last until the end of time. Even in an age full of newspapers, American churches still kept this odd custom, in cities as well as villages. A tradition often becomes harder to remove when there is less reason to keep it.
        - id: ch01-b10
          speaker: narrator
          text: Then the minister began to pray. It was a generous prayer, and it covered everything in detail.
        - id: ch01-b11
          speaker: mr_sprague
          text: "We pray for this church and its little children, for every other church in the village, and for the village itself. We pray for the county, the state and its officers, the United States, all its churches, Congress, the President, and every officer of the government. Remember the poor sailors tossed on stormy seas. Remember the millions suffering under the rulers of Europe and the East. Help those who have received the light and the good news but still cannot see or hear them. Remember the people on the far islands of the sea. And let the words I am about to speak find grace and favor. May they be like seed planted in rich earth, and may they grow in time into a welcome harvest of goodness. Amen."
        - id: ch01-b12
          speaker: narrator
          text: Dresses rustled as the congregation sat down. Tom had not enjoyed the prayer. He had merely survived it, if even that could be said. He had fidgeted through the whole thing. Without meaning to listen, he kept track of every subject in the prayer because he knew the minister's usual route so well. The smallest new addition caught his ear and offended him. Adding anything seemed unfair and downright dishonest.
        - id: ch01-b13
          speaker: narrator
          text: During the prayer, a fly landed on the back of the pew ahead of Tom and tormented him. It calmly rubbed its front feet together. It wrapped its legs around its head and polished so hard that its head seemed ready to come off, leaving its thin little neck exposed. Then it scraped its wings with its hind legs and smoothed them down like coat tails. The fly performed its entire washing routine as peacefully as if it knew no one could touch it.
        - id: ch01-b14
          speaker: narrator
          text: And the fly really was safe. Tom's hands ached to grab it, but he did not dare. He believed that reaching for a fly during a prayer would destroy his soul at once. As the minister reached the final sentence, though, Tom's hand began to curve and creep forward. The instant the word “Amen” was spoken, he captured the fly as a prisoner of war. Aunt Polly saw him and made him release it.
        - id: ch01-b15
          speaker: narrator
          text: Mr. Sprague announced the text for his sermon. Then he droned through a dull argument until head after head began to nod. The subject itself was endless fire and brimstone. By the minister's reasoning, the chosen few who would be saved became such a tiny group that saving them hardly seemed worth the trouble.
        - id: ch01-b16
          speaker: narrator
          text: Tom counted the sermon pages. After church, he always knew exactly how many there had been, though he almost never knew what the sermon had said. This time, one part truly caught his attention. The minister painted a grand and moving picture of all the people of the world gathering at the millennium. The lion and the lamb would lie down together, and a little child would lead them.
        - id: ch01-b17
          speaker: narrator
          text: Tom missed all the sorrow, the lesson, and the moral. He thought only of that child standing where all the nations could see him. His face brightened.
        - id: ch01-b18
          speaker: tom
          text: "I wish I could be that child, as long as the lion was tame."
        - id: ch01-b19
          speaker: narrator
          text: Then the sermon returned to its dry argument, and Tom returned to suffering. Before long, he remembered a treasure in his pocket and took it out. It was a big black beetle with powerful jaws. Tom called it a pinchbug, and he kept it in a little box that had once held a percussion cap.
        - id: ch01-b20
          speaker: narrator
          text: The first thing the pinchbug did was clamp onto Tom's finger. Tom jerked his hand without thinking. The beetle flew into the aisle, landed on its back, and waved its legs helplessly. Tom stuck his sore finger into his mouth. He watched the beetle and wanted it back, but now it lay beyond his reach. Other people who had lost interest in the sermon noticed it too, and the beetle gave them something new to watch.
        - id: ch01-b21
          speaker: narrator
          text: Soon a stray poodle wandered along. The warm summer stillness had made him lazy and sad, and he was tired of being shut inside. He wanted something to happen. Then he saw the beetle. His hanging tail rose and began to wag.
        - id: ch01-b22
          speaker: narrator
          text: The poodle studied his prize. He walked around it and sniffed from a safe distance. After another circle, he grew braver and moved closer. He lifted his lip and snapped carefully, but missed. He tried again, and then once more. The game began to please him. He lay down with the beetle between his front paws and continued his experiments.
        - id: ch01-b23
          speaker: narrator
          text: In time, the dog became tired of the game. His attention wandered. His head began to nod, and his chin sank little by little until it touched the enemy. The beetle seized him. The poodle gave a sharp yelp and tossed his head. The pinchbug sailed a couple of yards away and landed on its back again.
        - id: ch01-b24
          speaker: narrator
          text: The people nearby shook with silent delight. Several hid their faces behind fans and handkerchiefs. Tom was perfectly happy. The dog looked foolish, and probably felt foolish too. But now he was angry and wanted revenge.
        - id: ch01-b25
          speaker: narrator
          text: The poodle returned to the beetle and attacked more carefully. He jumped at it from every side, landing his front paws within an inch of it. He snapped closer and closer with his teeth, then jerked his head until his ears flapped. After a while, he tired of that too. He tried playing with a fly, but it did not satisfy him. He followed an ant with his nose close to the floor and quickly lost interest. He yawned. He sighed. He forgot the beetle completely and sat down on it.
        - id: ch01-b26
          speaker: narrator
          text: A wild howl of pain rang out, and the poodle went racing up the aisle. He kept howling and kept running. He crossed the church in front of the altar, tore down the other aisle, dashed past the doors, and charged along the final stretch. The farther he went, the worse the pain became. Soon he was a woolly comet flying around its path with the speed and brightness of light.
        - id: ch01-b27
          speaker: narrator
          text: At last, the frantic dog broke out of his course and leaped into his owner's lap. The man threw him through the window. His cries grew thinner and fainter until they disappeared in the distance.
        - id: ch01-b28
          speaker: narrator
          text: By then, everyone in the church was red in the face and nearly choking from the effort not to laugh. The sermon had stopped completely. Mr. Sprague soon tried to continue, but his words came out weak and uneven. Any chance of sounding impressive was gone. Even his most serious statements were met by muffled bursts of wicked laughter from behind distant pews, as though the poor minister had just said something wonderfully funny.
        - id: ch01-b29
          speaker: narrator
          text: When the ordeal finally ended and the blessing was pronounced, the whole congregation felt truly relieved.
        - id: ch01-b30
          speaker: narrator
          text: Tom Sawyer went home in a cheerful mood. He decided that a church service could offer some satisfaction when it included a little variety. Only one thought troubled him. He had been perfectly willing to let the dog play with his pinchbug, but he did not think it was honest of the dog to carry the beetle away.
