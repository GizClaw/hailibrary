audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry sense of humor
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
    tom:
      display_name: Tom Sawyer
      tts:
        delivery: quick, daring, and vividly expressive
        timbre: bright and youthful
        pace: lively with sudden cautious turns
        pitch: medium-high
    huck:
      display_name: Huckleberry Finn
      tts:
        delivery: rough-edged, wary, and plainspoken
        timbre: light and slightly husky
        pace: relaxed until alarmed
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER XXVIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: That night, Tom and Huck were ready for their adventure. They stayed near the tavern until after nine. One watched the alley from a distance while the other watched the tavern door. No one went into the alley or came out. No one who looked like the Spaniard passed through the tavern door, either.
        - id: ch01-b02
          speaker: narrator
          text: The sky looked as though it would stay fair, so Tom went home. They had agreed that if the night grew dark enough, Huck would come and meow outside. Then Tom would slip out and try the keys. But the sky stayed clear. At midnight, Huck gave up his watch and went to sleep inside an empty sugar barrel.
        - id: ch01-b03
          speaker: narrator
          text: Tuesday brought the same bad luck, and so did Wednesday. Thursday night looked more hopeful. Tom slipped out early with his aunt's old tin lantern and a large towel to cover it. He hid the lantern in Huck's sugar barrel, and their watch began.
        - id: ch01-b04
          speaker: narrator
          text: An hour before midnight, the tavern closed and its lights went out. They were the only lights nearby. No Spaniard had appeared, and no one had entered or left the alley. Everything was in their favor. Deep darkness covered the village, and the silence broke only when distant thunder muttered now and then.
        - id: ch01-b05
          speaker: narrator
          text: Tom climbed into the barrel, lit the lantern, and wrapped the towel tightly around it. Then the two adventurers crept through the darkness toward the tavern. Huck stayed outside as sentry while Tom felt his way down the alley.
        - id: ch01-b06
          speaker: narrator
          text: Huck waited, and the worry pressed on him like a mountain. He almost wished he could see the lantern flash. The light would scare him, but at least it would mean Tom was still alive. Tom seemed to have been gone for hours. Perhaps he had fainted. Perhaps he was dead. Perhaps fear and excitement had made his heart burst.
        - id: ch01-b07
          speaker: narrator
          text: Without meaning to, Huck edged closer and closer to the alley. Every dreadful thing he could imagine seemed ready to happen. He could scarcely draw a thimbleful of air, and his pounding heart felt ready to wear itself out.
        - id: ch01-b08
          speaker: narrator
          text: Suddenly, a light flashed. Tom tore past him.
        - id: ch01-b09
          speaker: tom
          text: Run! Run for your life!
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: Tom did not need to say it twice. Before the second cry was out, Huck was flying along as if he could run thirty or forty miles an hour. The boys did not stop until they reached a shed at an abandoned slaughterhouse on the far side of the village. The storm burst just as they got under cover, and rain poured down.
        - id: ch01-b11
          speaker: narrator
          text: When Tom could breathe again, he told Huck what had happened.
        - id: ch01-b12
          speaker: tom
          text: Huck, it was awful! I tried two keys, as softly as I could, but they made such a terrible racket that I could hardly breathe. And neither one would turn. Then I grabbed the doorknob without even thinking, and the door opened. It wasn't locked! I jumped inside, pulled off the towel, and great Caesar's ghost!
          emotion: fearful
        - id: ch01-b13
          speaker: huck
          text: What was it, Tom? What did you see?
          emotion: fearful
        - id: ch01-b14
          speaker: tom
          text: Huck, I nearly stepped on Injun Joe's hand!
          emotion: fearful
        - id: ch01-b15
          speaker: huck
          text: You didn't!
          emotion: surprised
        - id: ch01-b16
          speaker: tom
          text: I did! He was stretched out on the floor, sound asleep. His old eye patch was on, and both arms were spread wide.
        - id: ch01-b17
          speaker: huck
          text: Lord, what did you do? Did he wake up?
          emotion: fearful
        - id: ch01-b18
          speaker: tom
          text: No, he never moved. I reckon he was drunk. I snatched up that towel and ran!
        - id: ch01-b19
          speaker: huck
          text: I bet I'd never have remembered the towel!
        - id: ch01-b20
          speaker: tom
          text: Well, I remembered it. My aunt would make me mighty sorry if I lost that towel.
        - id: ch01-b21
          speaker: huck
          text: Tom, did you see the box?
        - id: ch01-b22
          speaker: tom
          text: I didn't stop to look, Huck. I never saw the box or the cross. All I noticed was a bottle and a tin cup on the floor beside Injun Joe. There were two barrels and plenty more bottles in the room, too. Now do you understand what's wrong with that haunted room?
        - id: ch01-b23
          speaker: huck
          text: What do you mean?
        - id: ch01-b24
          speaker: tom
          text: It's haunted by whiskey! Maybe every Temperance Tavern has a haunted room. What do you think, Huck?
        - id: ch01-b25
          speaker: huck
          text: I reckon that might be true. Who would ever have guessed it? But Tom, if Injun Joe is drunk, this is a mighty good time to get that box.
        - id: ch01-b26
          speaker: tom
          text: It surely is. You go try it!
        - id: ch01-b27
          speaker: narrator
          text: Huck shuddered.
        - id: ch01-b28
          speaker: huck
          text: Well, no. I reckon I won't.
          emotion: fearful
        - id: ch01-b29
          speaker: tom
          text: I won't either, Huck. One bottle beside Injun Joe isn't enough. If there had been three, he would be drunk enough for me to risk it.
        - id: ch01-b30
          speaker: narrator
          text: They thought in silence for a long while. Then Tom spoke.
        - id: ch01-b31
          speaker: tom
          text: Listen, Huck. We won't try again until we know Injun Joe isn't there. It's too scary. If we watch every night, sooner or later we'll see him leave. Then we'll grab that box quicker than lightning.
        - id: ch01-b32
          speaker: huck
          text: That's settled, then. I'll watch all night, every night, if you'll handle the other part.
        - id: ch01-b33
          speaker: tom
          text: All right, I will. Just run one block up Hooper Street and meow. If I'm asleep, throw some gravel at my window. That'll wake me.
        - id: ch01-b34
          speaker: huck
          text: Agreed, and you can count on it!
        - id: ch01-b35
          speaker: tom
          text: The storm's over now, Huck, so I'll go home. Daylight will come in a couple of hours. Will you go back and keep watch until then?
        - id: ch01-b36
          speaker: huck
          text: I said I would, Tom, and I mean it. I'll haunt that tavern every night for a year! I'll sleep all day and stand watch all night.
        - id: ch01-b37
          speaker: tom
          text: Good. Where are you going to sleep?
        - id: ch01-b38
          speaker: huck
          text: In Ben Rogers's hayloft. Ben lets me, and so does Uncle Jake, the Black man who works for Ben's father. I carry water for Uncle Jake whenever he needs it. When I ask, he gives me a little food if he has any to spare. He's mighty good to me, Tom. He likes me because I never act like I'm better than he is. Sometimes I've even sat down and eaten with him. Don't tell anybody, though. When you're terribly hungry, you do things you wouldn't make a regular habit of doing.
        - id: ch01-b39
          speaker: tom
          text: If I don't need you during the day, I'll leave you alone so you can sleep. But whenever something happens at night, come straight over and meow.
