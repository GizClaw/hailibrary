audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 聪明好胜，兴奋时语速加快，害怕时压低声音
        timbre: 清亮的少年声
        pace: 轻快灵活
        pitch: 中高音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，带着街头少年的粗朴和谨慎
        timbre: 略带沙哑的少年声
        pace: 自然偏慢
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二十八章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 当天夜里，汤姆和哈克准备好去冒险了。他们在旅店附近一直守到九点以后。一个远远盯住小巷，另一个看着旅店大门。可小巷里没人进出，门口也不见那个西班牙人的影子。
        - id: ch01-b02
          speaker: narrator
          text: 夜空看着十分晴朗。汤姆只好先回家，并跟哈克约好，只要天黑得够深，哈克就去学猫叫。汤姆听见以后，便溜出来试钥匙。谁知整夜都很明亮。到了十二点左右，哈克收了岗，钻进一只空糖桶睡觉去了。
        - id: ch01-b03
          speaker: narrator
          text: 星期二和星期三，两个孩子还是一无所获。星期四的夜色倒很有希望。汤姆早早带来姨妈的旧铁皮灯，又拿了条大毛巾遮光。他把灯藏在哈克的糖桶里，两人就开始监视。
        - id: ch01-b04
          speaker: narrator
          text: 离午夜还有一个钟头，旅店关了门，附近仅有的几盏灯也熄灭了。西班牙人没有露面，小巷里更没有人出入。一切都很顺利。四周黑得严严实实，静得只剩远处偶尔滚过的雷声。
        - id: ch01-b05
          speaker: narrator
          text: 汤姆躲在糖桶里点亮灯，用毛巾把它裹得严严实实。随后，两个冒险家摸黑爬向旅店。哈克留在外面放哨，汤姆伸手摸索着，一点点探进了小巷。
        - id: ch01-b06
          speaker: narrator
          text: 接下来那段等待，把哈克压得透不过气。他甚至盼着灯光能闪一下。虽然那也会吓到他，却至少能证明汤姆还活着。汤姆像是已经消失了好几个钟头，也许昏倒了，也许死了，甚至可能让恐惧和激动撑破了心。
        - id: ch01-b07
          speaker: narrator
          text: 哈克越想越怕，不知不觉挪到了小巷近旁。脑子里种种可怕的事越冒越多，他每一刻都觉得大祸就要降临，自己马上会吓断气。可他原本也没剩多少气，每回只能吸进顶针那么一丁点儿。那颗心又跳得太猛，简直快累垮了。
        - id: ch01-b08
          speaker: narrator
          text: 突然，一道灯光闪过。汤姆从他身边飞奔过去。
        - id: ch01-b09
          speaker: tom
          text: 快跑！快逃命！
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: 根本不用再喊第二遍。第一声已经足够，第二声还没出口，哈克就跑出了每小时三四十英里的速度。两个孩子一路没有停步，一口气奔到村子下头，躲进一座废弃屠宰场的棚屋。刚进棚里，暴风雨就轰然落下，大雨直往地上泼。
        - id: ch01-b11
          speaker: narrator
          text: 汤姆好容易喘匀了气，这才说起刚才的遭遇。
        - id: ch01-b12
          speaker: tom
          text: 哈克，刚才真吓死人了！我轻手轻脚试了两把钥匙，可听着还是响得惊人。我怕得气都不敢喘，偏偏哪一把也拧不动。后来我稀里糊涂抓住门把手，门竟然自己开了。它根本没锁！我一蹿进去，扯掉毛巾，凯撒大帝的鬼魂啊！
          emotion: fearful
        - id: ch01-b13
          speaker: huck
          text: 怎么了？汤姆，你到底看见什么了？
        - id: ch01-b14
          speaker: tom
          text: 我差一点就踩在印第安乔手上！
        - id: ch01-b15
          speaker: huck
          text: 不会吧！
          emotion: surprised
        - id: ch01-b16
          speaker: tom
          text: 真的！他躺在地板上睡得死沉，眼睛上戴着那块旧眼罩，两条胳膊摊在旁边。
        - id: ch01-b17
          speaker: huck
          text: 老天！那你怎么办的？他醒过来没有？
          emotion: fearful
        - id: ch01-b18
          speaker: tom
          text: 没有，连动也没动。我猜他喝醉了。我抓起毛巾，转身就跑！
        - id: ch01-b19
          speaker: huck
          text: 要是换了我，准把毛巾忘得干干净净！
        - id: ch01-b20
          speaker: tom
          text: 我忘不了。要是把姨妈的毛巾弄丢，她非收拾得我生病不可。
        - id: ch01-b21
          speaker: huck
          text: 那你看见箱子了吗？
        - id: ch01-b22
          speaker: tom
          text: 我哪敢四处找啊。我没看见箱子，也没看见十字架。除了印第安乔身边地板上的酒瓶和铁皮杯，我什么都顾不上看。对了，屋里还有两只大桶和一大堆瓶子。现在你该明白那间屋为什么闹鬼了吧？
        - id: ch01-b23
          speaker: huck
          text: 为什么？
        - id: ch01-b24
          speaker: tom
          text: 因为里头闹的是威士忌鬼！说不定每一家禁酒旅店，都藏着这么一间闹鬼的屋子呢。
        - id: ch01-b25
          speaker: huck
          text: 嗯，也许真是这样。谁能想得到呢？不过汤姆，印第安乔既然醉了，现在去拿箱子正合适。
        - id: ch01-b26
          speaker: tom
          text: 可不是嘛！那你去呀！
        - id: ch01-b27
          speaker: narrator
          text: 哈克听完，浑身打了个哆嗦。
        - id: ch01-b28
          speaker: huck
          text: 呃，不，我还是不去了。
          emotion: fearful
        - id: ch01-b29
          speaker: tom
          text: 我看也别去。印第安乔旁边才一只瓶子，这还不保险。要是摆着三只，我就知道他彻底醉了，那时候我准敢进去。
        - id: ch01-b30
          speaker: narrator
          text: 两个人沉默了很久，各自琢磨着这件事。最后，汤姆想出了一个新办法。
        - id: ch01-b31
          speaker: tom
          text: 哈克，在弄清楚印第安乔不在屋里以前，咱们别再进去冒险了。那地方实在太吓人。只要咱们每天晚上都守着，早晚准能看见他出门。等他一走，咱们眨眼工夫就能抢走箱子。
        - id: ch01-b32
          speaker: huck
          text: 好，就照你说的办。我可以整夜守着。只要剩下的事情归你，我夜夜来守都行。
        - id: ch01-b33
          speaker: tom
          text: 行，剩下的交给我。你沿胡珀街跑过一个街区，再学声猫叫。要是我睡着了，就拿小石子砸窗户，我准会醒。
        - id: ch01-b34
          speaker: huck
          text: 一言为定，绝不反悔！
        - id: ch01-b35
          speaker: tom
          text: 暴风雨已经过去了，我该回家啦。再过两个钟头天就会亮。你回去一直守到那时候，行吗？
        - id: ch01-b36
          speaker: huck
          text: 我答应了就一定会守。往后一年，我夜夜都去缠着那家旅店！白天睡觉，夜里放哨。
        - id: ch01-b37
          speaker: tom
          text: 那就好。你现在上哪儿睡觉？
        - id: ch01-b38
          speaker: huck
          text: 去本·罗杰斯家的干草棚。他肯让我睡，他爸爸家的黑鬼杰克大叔也肯。我替杰克大叔挑水。他有吃的可以分，等我开口时，也会给我一点。他可真是个好黑鬼。他喜欢我，因为我从来不摆出比他高一等的架子。有时候，我还会坐下来跟他一起吃饭。可这事你别告诉别人。人饿得太狠，总得做些平常不愿做的事。
        - id: ch01-b39
          speaker: tom
          text: 好。白天要是没事找你，我就让你睡，不去打扰。夜里只要发现动静，你马上跑来学猫叫。
