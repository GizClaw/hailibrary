  chapters:
    - id: ch01
      title: CHAPTER XXIV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once again, Tom was a glittering hero. The old folks adored him, and the young ones envied him. His name even appeared in the village paper, which made him sound grander still. Some people thought he might grow up to be President, if he managed not to get himself hanged first.
        - id: ch01-b02
          speaker: narrator
          text: The world changed its mind about Muff Potter, too. It welcomed him warmly and fussed over him just as freely as it had mistreated him before. But that was the world's way, and people gave it credit for doing the right thing in the end.
        - id: ch01-b03
          speaker: narrator
          text: Tom's days shone with pride and happiness. His nights were full of terror. Injun Joe haunted every dream, always with death in his eyes. Almost nothing could tempt Tom outdoors after dark.
        - id: ch01-b04
          speaker: narrator
          text: Poor Huck was just as miserable and frightened. On the night before the trial, Tom had told the lawyer the whole story. Injun Joe's escape had spared Huck from testifying in court, but Huck still feared that his part in the business would come out. He had made the lawyer promise to keep it secret, yet that promise gave him little comfort. Tom had once sealed his own lips with the darkest and most dreadful oath. Even so, his tormented conscience had driven him to the lawyer's house at night, where the terrible story had been pulled from him. After that, Huck could barely trust anyone at all.
        - id: ch01-b05
          speaker: narrator
          text: Each day, Muff Potter's gratitude made Tom glad he had spoken. Each night, Tom wished he had kept his mouth shut.
        - id: ch01-b06
          speaker: narrator
          text: Half the time, Tom feared that Injun Joe would never be caught. The rest of the time, he feared that he would. Tom felt sure he could never breathe safely again until the man was dead and Tom had seen the body for himself.
        - id: ch01-b07
          speaker: narrator
          text: Rewards were offered, and searchers combed the countryside, but no one found Injun Joe. Then one of those all-knowing, awe-inspiring wonders arrived from St. Louis. He was a detective. He nosed around, shook his head, looked wise, and achieved the kind of astonishing success detectives so often achieve. In other words, he found a clue. But a clue cannot be hanged for murder. When the detective finished his work and went home, Tom felt no safer than before.
        - id: ch01-b08
          speaker: narrator
          text: The days passed slowly. With each one, the weight of Tom's fear grew just a little lighter.
