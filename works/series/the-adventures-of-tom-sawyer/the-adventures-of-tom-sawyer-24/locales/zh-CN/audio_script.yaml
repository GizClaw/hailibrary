audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
  chapters:
    - id: ch01
      title: 英雄的白天与黑夜
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 汤姆又成了光彩夺目的英雄。老人们疼爱他，孩子们羡慕他，连村里的报纸也把他的名字印出来，好好吹捧了一番。有人甚至相信，只要他别先上绞架，将来准能当上总统。
        - id: ch01-b02
          speaker: narrator
          text: 至于莫夫·波特，世人也照老样子办事。他们先前怎样糟践他，如今就怎样把他搂进怀里，百般疼爱。这样的反复无常，倒也算世人的一桩美德，所以还是别挑它的错了。
        - id: ch01-b03
          speaker: narrator
          text: 汤姆白天风光又得意，夜里却只剩下恐惧。每一个梦里都有印第安乔，那双眼睛总带着要他送命的凶光。天一黑，再大的诱惑也很难哄他出门。
    - id: ch02
      title: 守不住的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 哈克也在受同样的罪。审判开始前一夜，汤姆已经把一切告诉律师。印第安乔这一逃，哈克不用出庭作证了，可他还是怕自己参与过的事会泄露出去。他虽然请律师答应保密，心里却一点也不踏实。
        - id: ch02-b02
          speaker: narrator
          text: 这也难怪。汤姆受不了良心的折磨，夜里竟被它赶到律师家，连那个用最可怕的毒誓封住的秘密都吐了出来。看到这件事，哈克对人的信任几乎全没了。
        - id: ch02-b03
          speaker: narrator
          text: 每到白天，莫夫·波特满怀感激，汤姆便庆幸自己说出了真相。可是一到夜里，他又恨不得当初把嘴封得死死的。
        - id: ch02-b04
          speaker: narrator
          text: 有一半时候，汤姆怕印第安乔永远也抓不到。另一半时候，他又怕那人真的被抓住。他认定，除非印第安乔死了，自己还亲眼见到尸体，否则再也别想安稳地喘气。
    - id: ch03
      title: 一条线索
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 悬赏贴出去了，四乡八野也搜遍了，可印第安乔还是不见踪影。后来，圣路易斯来了一位据说无所不知、叫人肃然起敬的奇才。他是一名侦探。
        - id: ch03-b02
          speaker: narrator
          text: 这位侦探到处嗅探，一会儿摇头，一会儿摆出高深莫测的样子，最后取得了这一行惯有的惊人成就。他“找到了一条线索”。可谋杀案不能把“一条线索”送上绞架。侦探忙完回家以后，汤姆仍旧觉得自己随时都有危险。
        - id: ch03-b03
          speaker: narrator
          text: 日子就这样慢吞吞地漂过去。每过去一天，留在汤姆心头的恐惧便稍稍轻了一点。
