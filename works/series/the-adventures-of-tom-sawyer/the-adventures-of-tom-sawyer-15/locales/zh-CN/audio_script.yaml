audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    joe:
      display_name: 乔
      tts:
        delivery: 认真热烈，带着孩子气的悲壮和兴奋
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，语气粗朴而自在
        timbre: 微哑稚嫩
        pace: 从容
        pitch: 中音
    aunt_polly:
      display_name: 波莉姨妈
      tts:
        delivery: 心直口快，严厉中透着深厚慈爱
        timbre: 饱满苍老
        pace: 从容，激动时略有停顿
        pitch: 中音
    sid:
      display_name: 席德
      tts:
        delivery: 一本正经，话里带着自以为是
        timbre: 清细稚嫩
        pace: 平稳
        pitch: 中高音
    mary:
      display_name: 玛丽
      tts:
        delivery: 温柔真诚，沉静体贴
        timbre: 柔和稚嫩
        pace: 舒缓
        pitch: 中高音
    mrs_harper:
      display_name: 哈珀太太
      tts:
        delivery: 坦率慈爱，悲痛时难以自持
        timbre: 成熟浑厚
        pace: 缓慢，带哽咽停顿
        pitch: 中音
    ferry_worker:
      display_name: 渡轮工人
      tts:
        delivery: 简短利落，带着干活人的干脆
        timbre: 粗粝洪亮
        pace: 明快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 夜渡大河
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 几分钟后，汤姆已经走进沙洲的浅水，朝伊利诺伊州那边蹚去。水还没到腰，路程就过了一半。再往前水深流急，不能继续走了，他便满怀信心地游向百码外的河岸。他斜着往上游游，可水流还是把他往下冲，冲得比预想的更快。好在他终于到了岸边，又顺水漂了一段，找到一处低岸爬了上去。
        - id: ch01-b02
          speaker: narrator
          text: 汤姆摸摸衣袋，那片树皮还好好装在里面。他沿河穿过树林，湿衣服一路滴着水。快到十点，他来到村庄对面的一片空地。渡轮静静泊在树木和高岸的阴影下，星光一闪一闪，四周没有一点动静。
        - id: ch01-b03
          speaker: narrator
          text: 他仔细望着周围，悄悄爬下岸，游了三四下，攀上渡轮船尾的小艇。接着，他躺到横座板下面，一边喘气，一边等候。
        - id: ch01-b04
          speaker: narrator
          text: 没过多久，船上的破钟当的一响。
        - id: ch01-b05
          speaker: ferry_worker
          text: “解缆！”
        - id: ch01-b06
          speaker: narrator
          text: 一两分钟后，渡轮开动了，小艇的船头在船尾的波浪上高高翘起。汤姆知道这是今晚最后一趟，心里暗暗高兴。漫长的十二到十五分钟过去，明轮终于停下来。他立刻溜进水中，趁着夜色游上岸。落脚处离渡口下游足有五十码，不会碰见任何逗留未归的人。
    - id: ch02
      title: 床下的偷听者
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 汤姆沿着冷清的小巷飞奔，翻过姨妈家的后篱笆，来到屋后。他从窗外望进去，只见起居室还亮着灯。波莉姨妈、席德、玛丽和哈珀太太都坐在床边说话，那张床恰好挡在他们和门之间。
        - id: ch02-b02
          speaker: narrator
          text: 汤姆轻轻抬起门闩，一点点推门。每响一声吱呀，他就吓得发抖。等门缝宽到能跪着钻进去，他才探进脑袋，小心往里爬。
        - id: ch02-b03
          speaker: aunt_polly
          text: “蜡烛怎么直晃？咦，那扇门开着呢。可不是嘛，最近的怪事真没完。席德，去把门关上。”
        - id: ch02-b04
          speaker: narrator
          text: 汤姆赶紧钻进床底。他先趴着喘匀了气，又往前挪了挪，离姨妈的脚近得几乎伸手就能碰到。
        - id: ch02-b05
          speaker: aunt_polly
          text: “我刚才说啊，汤姆并不坏，他只是淘气，整天毛毛躁躁，做事没头没脑。他像匹小马驹，根本不懂好歹。他从来不存心害人，天底下再没有心肠比他更好的孩子了。”
          emotion: sad
        - id: ch02-b06
          speaker: narrator
          text: 说着，波莉姨妈哭了起来。
        - id: ch02-b07
          speaker: mrs_harper
          text: “我家乔也一样。什么淘气事都干，可他又那么无私，那么善良。老天保佑我吧！他拿了那罐奶油，我竟然揍了他，却忘了那奶油明明是我嫌酸倒掉的。现在我再也见不到他了，永远也见不到了。我那受尽委屈的可怜孩子！”
          emotion: sad
        - id: ch02-b08
          speaker: narrator
          text: 哈珀太太哭得像是心都要碎了。
        - id: ch02-b09
          speaker: sid
          text: “但愿汤姆在那边能过得好些。不过，他有些地方要是能改好一点……”
        - id: ch02-b10
          speaker: aunt_polly
          text: “席德！汤姆已经走了，你不许再说他一句不好！上帝会照看他，用不着你操心。哈珀太太，我真不知道怎么才能舍得他。我舍不得呀！他差点把我这颗老心折磨碎，可他也给了我那么多安慰。”
          emotion: angry
        - id: ch02-b11
          speaker: mrs_harper
          text: “主赐给我们，也把人收回。主的名当受赞美！可是太难了，实在太难了！上星期六，乔还把爆竹放到我鼻子底下炸，我一巴掌把他打倒了。我哪知道，这么快就会……要是能重来一次，我一定抱住他，还要为这件事祝福他。”
          emotion: sad
        - id: ch02-b12
          speaker: aunt_polly
          text: “是啊，我太明白你的心情了。昨天中午，汤姆给猫灌了一肚子止痛药，我以为那畜生要把房子拆了。愿上帝宽恕我，我竟用顶针敲破了汤姆的脑袋。我那可怜的孩子，我那死去的孩子！他现在再也不用受苦了。可我最后听见他说的话，还是在埋怨……”
          emotion: sad
        - id: ch02-b13
          speaker: narrator
          text: 那段回忆压得波莉姨妈再也说不下去，她彻底哭垮了。床下的汤姆也抽起鼻子来，只是与其说他同情别人，不如说他更可怜自己。他听见玛丽在哭，还不时替他说几句温柔的好话。汤姆顿时觉得，自己比从前任何时候都更加高尚了。
        - id: ch02-b14
          speaker: narrator
          text: 姨妈那么伤心，汤姆真想跳出去，让她一下子欢喜起来。况且，那场面一定辉煌极了，正合他的脾气。可他还是忍住，继续躺在床底。
    - id: ch03
      title: 全村人的悲伤
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 汤姆接着听，终于从零零碎碎的话里拼出了事情的经过。人们起初猜男孩们游泳时淹死了，接着又发现那只小木筏不见了。几个孩子还说，失踪的男孩曾答应，很快要让全村“听到点动静”。于是，那些自作聪明的大人把这件事和那件事凑到一起，认定他们坐着木筏走了，很快会在下游某个镇子露面。
        - id: ch03-b02
          speaker: narrator
          text: 可快到中午时，人们却在村子下游五六英里外、密苏里州一侧的岸边找到了木筏。希望一下就没了。男孩们一定淹死了，否则就算没有早些回来，饥饿也会逼他们在天黑以前回家。一直找不到尸首，大家便认定他们是在河道中央出的事。三个孩子水性都好，要是在别处落水，本该能够逃上岸。
        - id: ch03-b03
          speaker: narrator
          text: 当天是星期三晚上。要是星期日还找不到尸首，人们就会放弃最后一点希望，并在那天上午举行葬礼。汤姆听得打了个寒战。
        - id: ch03-b04
          speaker: narrator
          text: 哈珀太太抽泣着道过晚安，转身要走。两位失去孩子的母亲忽然同时抱住对方，痛痛快快哭了一场，也彼此安慰了一番，这才分开。波莉姨妈向席德和玛丽道晚安时，温柔得远远超过平日。席德抽了几下鼻子，玛丽却哭得伤心欲绝，离开了房间。
        - id: ch03-b05
          speaker: narrator
          text: 波莉姨妈跪下来为汤姆祷告。她的恳求那么动人，苍老颤抖的声音里全是无边的爱。祷告还没有结束，汤姆早已泪流满面。
    - id: ch04
      title: 没有留下的树皮
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 姨妈躺下以后，汤姆仍久久不敢动。她不时发出心碎的叹息，翻来覆去，怎么也睡不安稳。过了很久，她终于不再动了，只在梦中轻轻呻吟。汤姆这才悄悄爬出来，在床边一点点站起。他用手挡住烛光，低头凝望着姨妈，心里满是怜惜。
        - id: ch04-b02
          speaker: narrator
          text: 他取出那卷梧桐树皮，放在蜡烛旁。忽然，一个念头闪过，他没有马上离开，而是站在那里仔细琢磨。等他想出一个满意的办法，脸一下亮了，又赶紧把树皮收回口袋。他弯下身，亲了亲姨妈失去血色的嘴唇，然后悄无声息地退出屋子，还随手把门闩好。
        - id: ch04-b03
          speaker: narrator
          text: 汤姆回到渡口，见四下无人，便直接走上渡轮。船上只有一个看守，那人每晚一躺下，就睡得像石像。他解开船尾的小艇，坐进去，小心地向上游划。
        - id: ch04-b04
          speaker: narrator
          text: 到了村庄上游一英里处，他才斜着横渡，使足力气划起桨来。他对这段水路熟得很，小艇稳稳靠上对岸。汤姆一度很想把它据为己有，毕竟这也算一艘船，理应成为海盗名正言顺的战利品。可他知道，人们一定会四处寻找小艇，弄不好就会因此发现他的秘密。他只好登岸，走进树林。
    - id: ch05
      title: 海盗归来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 汤姆在树林里坐下，歇了很久。他困得厉害，还得拼命折磨自己，不许眼皮合上，然后才小心地踏上最后一程。夜已经所剩无几。等他真正来到岛边沙洲的对面，天早就大亮了。他又一直歇到太阳升得老高，用灿烂的金光染亮整条大河，这才纵身跳进水里。
        - id: ch05-b02
          speaker: narrator
          text: 不久，汤姆浑身滴着水，站在营地门口。他停住脚，听见乔正在说话。
        - id: ch05-b03
          speaker: joe
          text: “不会的，哈克。汤姆是条真汉子，一定会回来。他绝不会扔下咱们。海盗要是这么干，多丢脸啊，汤姆那么骄傲，才不会做这种事。他准是在打什么主意，就是不知道究竟是什么。”
        - id: ch05-b04
          speaker: huck
          text: “不管怎样，那些东西现在归咱们了，对吧？”
        - id: ch05-b05
          speaker: joe
          text: “还差一点，哈克。字条上说，他到吃早饭时还没回来，东西才归咱们。”
        - id: ch05-b06
          speaker: tom
          text: “可他已经回来了！”
        - id: ch05-b07
          speaker: narrator
          text: 汤姆故意挑准这一刻现身，神气十足地走进营地。两个伙伴亲眼看着他回来，这一番亮相的戏剧效果精彩极了。
        - id: ch05-b08
          speaker: narrator
          text: 没过多久，一顿丰盛的熏肉烤鱼早餐就做好了。三个男孩动手大吃，汤姆讲起昨夜的冒险，还添油加醋地润色了一番。等故事说完，三个小英雄全都虚荣又自负，吹嘘得不得了。随后，汤姆躲进一处阴凉角落，一觉睡到中午。另外两个海盗则收拾起来，准备去钓鱼和探险。
