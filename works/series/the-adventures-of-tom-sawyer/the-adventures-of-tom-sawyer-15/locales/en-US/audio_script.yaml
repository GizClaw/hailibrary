  chapters:
    - id: ch01
      title: CHAPTER XV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A few minutes later, Tom was wading across the shallow bar toward the Illinois shore. Before the water reached his waist, he had made it halfway. Then the current grew too deep for walking, so he confidently began swimming the last hundred yards. He aimed upstream, but the river swept him down faster than he expected. At last he reached land, drifted along to a low bank, and pulled himself out.
        - id: ch01-b02
          speaker: narrator
          text: Tom felt his jacket pocket and found the piece of bark still safe. Then he hurried through the woods along the shore, his clothes streaming water. Not long before ten, he reached an open spot across from the village. The ferryboat lay in the shadows beneath the trees and the high bank. Under the blinking stars, everything was quiet.
        - id: ch01-b03
          speaker: narrator
          text: Watching carefully, Tom crept down the bank and slipped into the river. After three or four strokes, he climbed into the little skiff tied at the ferryboat's stern. He stretched out beneath the seats and waited there, panting.
        - id: ch01-b04
          speaker: narrator
          text: Soon the cracked bell tapped.
        - id: ch01-b05
          speaker: ferry_worker
          text: Cast off!
        - id: ch01-b06
          speaker: narrator
          text: A minute or two later, the skiff's bow rose high against the ferryboat's wake, and the trip began. Tom was delighted. He knew this was the boat's final crossing that night. After twelve or fifteen long minutes, the paddle wheels stopped. Tom slipped overboard and swam to shore in the darkness. He landed fifty yards downstream, safely away from anyone who might still be around.
        - id: ch01-b07
          speaker: narrator
          text: He raced through empty alleys and soon reached his aunt's back fence. Over he went. Then he crept up to the back part of the house and peered through the sitting-room window, where a lamp still burned. Aunt Polly, Sid, Mary, and Joe Harper's mother sat together beside the bed, talking. The bed stood between them and the door.
        - id: ch01-b08
          speaker: narrator
          text: Tom went to that door and softly lifted the latch. He pressed with care, and it opened a crack. Each creak made him tremble, but he kept pushing until he thought he could crawl through. He put his head inside and started forward.
        - id: ch01-b09
          speaker: aunt_polly
          text: What is making that candle flicker so? Why, I believe the door is open. It surely is. Strange things just keep happening. Go shut it, Sid.
        - id: ch01-b10
          speaker: narrator
          text: Tom darted under the bed just in time. He stayed there until he had caught his breath, then crept close enough to almost touch his aunt's foot.
        - id: ch01-b11
          speaker: aunt_polly
          text: Like I was saying, Tom wasn't a bad boy. He was only mischievous. He was just wild and thoughtless, the way a young colt is. He never meant to hurt anyone, and no boy ever had a kinder heart.
          emotion: sad
        - id: ch01-b12
          speaker: narrator
          text: Aunt Polly began to cry.
        - id: ch01-b13
          speaker: mrs_harper
          text: My Joe was the very same. He was always raising trouble and getting into mischief, but he was as kind and unselfish as a boy could be. And heaven help me, I whipped him for taking that cream. I had forgotten that I threw it out myself because it was sour. Now I'll never see him again in this world. Never, never, never. My poor boy, treated so badly!
          emotion: sad
        - id: ch01-b14
          speaker: narrator
          text: Mrs. Harper sobbed as if her heart would break.
        - id: ch01-b15
          speaker: sid
          text: I hope Tom is better off now. Still, if he had behaved better in some ways...
        - id: ch01-b16
          speaker: aunt_polly
          text: Sid! Don't you say one word against my Tom now that he's gone! God will look after him, so you needn't concern yourself, young man. Oh, Mrs. Harper, I don't know how to let him go! I just don't know how. He was such a comfort to me, even though he nearly tormented my old heart to death.
          emotion: angry
        - id: ch01-b17
          speaker: mrs_harper
          text: The Lord gave him, and the Lord has taken him away. Blessed be the Lord's name. But it is so hard. Oh, it is so hard! Just last Saturday, Joe set off a firecracker right under my nose, and I knocked him flat. I had no idea how soon... Oh, if I could do it again, I would hug him and bless him for it.
          emotion: sad
        - id: ch01-b18
          speaker: aunt_polly
          text: Yes, yes, I know exactly how you feel. Only yesterday at noon, Tom filled the cat with Pain-killer. I thought the poor creature would tear the house apart. God forgive me, I struck Tom on the head with my thimble. My poor boy. My poor dead boy. At least all his troubles are over now. And the last thing I ever heard him say was a reproach to me...
          emotion: sad
        - id: ch01-b19
          speaker: narrator
          text: The memory was too much for Aunt Polly, and she completely broke down. Tom was sniffling now, too, though he pitied himself more than anyone else. He heard Mary crying and saying kind things about him now and then. He began to think more highly of himself than ever.
        - id: ch01-b20
          speaker: narrator
          text: Still, his aunt's sorrow touched him deeply. He longed to rush out and fill her with joy. The grand drama of such an entrance appealed to him, too. But he resisted and stayed beneath the bed.
        - id: ch01-b21
          speaker: narrator
          text: As he listened, Tom pieced together what had happened. At first, people thought the boys had drowned while swimming. Then someone noticed that the little raft was missing. Some boys remembered that the missing three had promised the village would hear something soon. The village wise men put those clues together. They decided the boys had floated away on the raft and would soon appear in the next town downstream.
        - id: ch01-b22
          speaker: narrator
          text: But around noon, the raft had been found caught against the Missouri shore, five or six miles below the village. That ended all hope. The boys had to be drowned. Otherwise, hunger would have brought them home by nightfall, if not sooner.
        - id: ch01-b23
          speaker: narrator
          text: People believed the search had failed because the boys must have drowned in the middle of the river. Since all three were good swimmers, they would have reached land if they had been near either shore. It was Wednesday night now. If no bodies appeared by Sunday, everyone would give up hope, and the funeral sermons would be preached that morning. Tom shuddered.
        - id: ch01-b24
          speaker: narrator
          text: Mrs. Harper said a tearful goodnight and turned to leave. Then both grieving women moved at once. They threw their arms around each other and shared a long, comforting cry before parting. Aunt Polly was much more tender than usual when she said goodnight to Sid and Mary. Sid sniffled a little. Mary left the room crying with all her heart.
        - id: ch01-b25
          speaker: narrator
          text: Aunt Polly knelt and prayed for Tom. Her words were so loving, her plea so tender, and her old voice trembled so much that Tom was soaked in tears again long before she finished.
        - id: ch01-b26
          speaker: narrator
          text: Even after she went to bed, Tom had to remain still. From time to time, she cried out in grief, tossed restlessly, and turned over. At last she grew quiet, apart from a faint moan in her sleep.
        - id: ch01-b27
          speaker: narrator
          text: Tom crept out and slowly stood beside the bed. Shading the candle with one hand, he looked down at her, his heart full of pity. He took out his sycamore-bark message and laid it beside the candle. Then a thought stopped him. He considered it for a moment, and his face brightened when the answer came. He quickly returned the bark to his pocket.
        - id: ch01-b28
          speaker: narrator
          text: Then Tom leaned over, kissed Aunt Polly's faded lips, and slipped away. He quietly latched the door behind him.
        - id: ch01-b29
          speaker: narrator
          text: He made his way back to the ferry landing and found no one about. This time he walked boldly onto the boat. He knew it was empty except for the watchman, who always went to bed and slept like a stone statue. Tom untied the skiff from the stern, climbed in, and began rowing carefully upstream.
        - id: ch01-b30
          speaker: narrator
          text: A mile above the village, he angled across the river and pulled with all his strength. He landed neatly on the opposite side. This was familiar work to him. For a moment he wanted to keep the skiff. It might count as a ship, he reasoned, which would make it fair prize for a pirate. But he knew people would search hard for it, and that could uncover his secret. So he stepped onto land and entered the woods.
        - id: ch01-b31
          speaker: narrator
          text: Tom sat down for a long rest and struggled to keep himself awake. Then he cautiously started down the last stretch. Most of the night was gone. Broad daylight had come before he drew level with the island bar.
        - id: ch01-b32
          speaker: narrator
          text: He rested once more. When the sun stood high enough to cover the great river in gold, he plunged into the water. A little later, Tom stood dripping at the camp entrance and heard Joe talking.
        - id: ch01-b33
          speaker: joe_harper
          text: No, Tom is true-blue, Huck. He'll be back. He would never desert us. He knows a pirate would be disgraced for doing that, and Tom is far too proud. He must be planning something. I wonder what it is.
        - id: ch01-b34
          speaker: huckleberry
          text: Well, his things belong to us anyway, don't they?
        - id: ch01-b35
          speaker: joe_harper
          text: Almost, but not yet. The writing says we get them if he isn't back by breakfast.
        - id: ch01-b36
          speaker: tom
          text: And here I am!
          emotion: happy
        - id: ch01-b37
          speaker: narrator
          text: Tom stepped grandly into camp, making the most dramatic entrance he could. Soon the boys had a splendid breakfast of bacon and fish. While they ate, Tom told the story of his adventures and made it even finer in the telling. By the end, all three heroes were proud and boastful.
        - id: ch01-b38
          speaker: narrator
          text: Then Tom found a shady corner and hid himself away to sleep until noon. The other pirates went off to fish and explore.
