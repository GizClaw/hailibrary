  chapters:
    - id: ch01
      title: CHAPTER IX
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At half past nine that night, Tom and Sid went to bed as usual. They said their prayers. Sid soon fell asleep, but Tom stayed awake, waiting with restless impatience. It felt as if morning must be close when the clock finally struck ten. Tom could hardly bear it. He wanted to toss and fidget, but that might wake Sid, so he lay still and stared into the dark.
        - id: ch01-b02
          speaker: narrator
          text: The house was miserably quiet. Then tiny sounds began to stand out. The clock ticked. Old beams cracked for no clear reason. The stairs gave a faint creak. It seemed that spirits must be moving about. From Aunt Polly's room came a steady, muffled snore. Somewhere, an impossible-to-find cricket kept chirping.
        - id: ch01-b03
          speaker: narrator
          text: Then a death-watch began its dreadful ticking inside the wall by Tom's head. He shuddered, because that sound meant somebody's days were numbered. A dog howled far away into the night, and a fainter howl answered from even farther off. Tom suffered through every sound. At last, he decided time itself had stopped and eternity had begun. In spite of everything, sleep started to pull him under. The clock struck eleven, but he never heard it.
        - id: ch01-b04
          speaker: narrator
          text: A miserable cat's howl slipped into his half-made dreams. Then a nearby window went up.
        - id: ch01-b05
          speaker: neighbor
          text: "Scat! Get out of here, you devil!"
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: An empty bottle smashed against Aunt Polly's woodshed, and Tom snapped wide awake. Within a minute, he was dressed, out the window, and crawling on hands and knees along the roof of the back wing. He gave one or two careful meows as he went. Then he jumped onto the woodshed roof and down to the ground.
        - id: ch01-b07
          speaker: narrator
          text: Huckleberry Finn was waiting with his dead cat. The boys slipped away into the darkness. Half an hour later, they were wading through the tall grass in the graveyard.
        - id: ch01-b08
          speaker: narrator
          text: This was an old-fashioned Western graveyard on a hill, about a mile and a half from the village. A broken board fence surrounded it. The fence leaned inward here and outward there, but nowhere did it stand straight. Thick grass and weeds covered the whole place. Every old grave had sunk into the earth.
        - id: ch01-b09
          speaker: narrator
          text: There was not one stone marker. Instead, rounded wooden boards, eaten by worms, staggered above the graves and leaned for support they could not find. The words “Sacred to the memory of” and the dead person's name had once been painted on them. Now, even with light, hardly any of those names could have been read.
        - id: ch01-b10
          speaker: narrator
          text: A weak wind moaned through the trees. Tom feared it might be the spirits of the dead, complaining because the boys had disturbed them. The boys barely spoke, and when they did, they kept their voices under their breath. The late hour, the graveyard, and the deep, solemn silence weighed on them. At last, they found the sharp new mound they had come to find. They settled into hiding behind three great elm trees growing together only a few feet from the grave.
        - id: ch01-b11
          speaker: narrator
          text: They waited without a word for what felt like a very long time. Only a distant owl disturbed the dead stillness. Tom's thoughts became too much for him. He had to make them talk.
        - id: ch01-b12
          speaker: tom
          text: "Hucky, do you think the dead folks mind us being here?"
        - id: ch01-b13
          speaker: huck
          text: "I wish I knew. It sure feels awful solemn, don't it?"
        - id: ch01-b14
          speaker: tom
          text: "I bet it does."
        - id: ch01-b15
          speaker: narrator
          text: Both boys thought that over in silence. After a while, Tom whispered again.
        - id: ch01-b16
          speaker: tom
          text: "Say, Hucky, reckon Hoss Williams can hear us talking?"
        - id: ch01-b17
          speaker: huck
          text: "Course he can. His spirit can, anyhow."
        - id: ch01-b18
          speaker: tom
          text: "I should've called him Mister Williams. I didn't mean anything bad by it. Everybody calls him Hoss."
        - id: ch01-b19
          speaker: huck
          text: "You can't be too careful what you say about dead folks, Tom."
        - id: ch01-b20
          speaker: narrator
          text: That stopped the conversation cold. Silence settled over them again.
        - id: ch01-b21
          speaker: narrator
          text: Suddenly Tom grabbed Huck's arm.
        - id: ch01-b22
          speaker: tom
          text: "Shh!"
        - id: ch01-b23
          speaker: huck
          text: "What is it, Tom?"
        - id: ch01-b24
          speaker: narrator
          text: The boys clung to each other, their hearts pounding.
        - id: ch01-b25
          speaker: tom
          text: "Quiet! There it is again. Didn't you hear that? There! You heard it now."
        - id: ch01-b26
          speaker: huck
          text: "Lord, Tom, they're coming! They're coming for sure. What are we gonna do?"
          emotion: fearful
        - id: ch01-b27
          speaker: tom
          text: "I don't know. Think they'll see us?"
        - id: ch01-b28
          speaker: huck
          text: "Oh, Tom, they can see in the dark just like cats. I wish I'd never come."
          emotion: fearful
        - id: ch01-b29
          speaker: tom
          text: "Don't be scared. I don't reckon they'll trouble us. We aren't hurting anything. Maybe they won't notice us if we stay perfectly still."
        - id: ch01-b30
          speaker: huck
          text: "I'll try, Tom, but I'm shaking all over."
          emotion: fearful
        - id: ch01-b31
          speaker: tom
          text: "Listen!"
        - id: ch01-b32
          speaker: narrator
          text: They pressed their heads together and hardly breathed. From the far end of the graveyard came the muffled sound of voices.
        - id: ch01-b33
          speaker: tom
          text: "Look over there. What is that?"
        - id: ch01-b34
          speaker: huck
          text: "It's devil-fire. Oh, Tom, this is awful."
          emotion: fearful
        - id: ch01-b35
          speaker: narrator
          text: Dim figures moved toward them through the darkness. One carried an old tin lantern that sprinkled the ground with countless little spots of light.
        - id: ch01-b36
          speaker: huck
          text: "It's devils, sure enough. Three of them! Lordy, Tom, we're done for. Can you pray?"
          emotion: fearful
        - id: ch01-b37
          speaker: tom
          text: "I'll try. Don't be scared. They won't hurt us. Now I lay me down to sleep, I—"
        - id: ch01-b38
          speaker: huck
          text: "Shh!"
        - id: ch01-b39
          speaker: tom
          text: "What is it, Huck?"
        - id: ch01-b40
          speaker: huck
          text: "They're people! One of them is, anyway. That's old Muff Potter's voice."
          emotion: surprised
        - id: ch01-b41
          speaker: tom
          text: "No. You sure?"
        - id: ch01-b42
          speaker: huck
          text: "I'd know it anywhere. Don't move an inch. He's probably drunk like always, and he isn't sharp enough to spot us."
        - id: ch01-b43
          speaker: tom
          text: "All right. I'll stay still. They've lost the place. Now they're coming this way again. Getting warmer. Cold again. Warmer. Now they're burning hot! They're headed straight for it. Say, Huck, I know another voice. That's Injun Joe."
        - id: ch01-b44
          speaker: huck
          text: "It is. That murdering half-breed! I'd a whole lot rather they really were devils. What could they be doing here?"
          emotion: fearful
        - id: ch01-b45
          speaker: narrator
          text: Their whispers stopped completely. The three men had reached the grave and now stood only a few feet from the boys' hiding place.
        - id: ch01-b46
          speaker: doctor_robinson
          text: "Here it is."
        - id: ch01-b47
          speaker: narrator
          text: The man raised the lantern, and its light revealed young Doctor Robinson. Potter and Injun Joe carried a handbarrow loaded with a rope and two shovels. They dropped everything and began opening the grave. The doctor set the lantern at the head of it, then leaned against one of the elms. He was so close that the boys could have reached out and touched him.
        - id: ch01-b48
          speaker: doctor_robinson
          text: "Hurry up, men. The moon could come out any minute."
        - id: ch01-b49
          speaker: narrator
          text: The two men growled an answer but kept digging. For a long while, the only sound was the steady scrape of their shovels lifting dirt and gravel from the grave and throwing it aside. The sound went on and on. At last, one shovel struck the coffin with a dull wooden knock. Within another minute or two, the men had freed the coffin and hauled it out onto the ground.
        - id: ch01-b50
          speaker: narrator
          text: They forced off the lid with their shovels, pulled out the body, and dumped it roughly beside the grave. The clouds drifted away from the moon, exposing the pale face. The men placed the corpse on the barrow, covered it with a blanket, and tied it down. Potter opened a large spring knife and cut away the loose end of rope.
        - id: ch01-b51
          speaker: muff_potter
          text: "There. The cursed thing's ready, Sawbones. Now hand over another five dollars, or it stays right here."
        - id: ch01-b52
          speaker: injun_joe
          text: "That's right."
        - id: ch01-b53
          speaker: doctor_robinson
          text: "What is this supposed to mean? You demanded your money in advance, and I paid it."
        - id: ch01-b54
          speaker: injun_joe
          text: "You did more than that. Five years ago, I came to your father's kitchen asking for food. You drove me off and said I was there to cause trouble. I swore I'd get even if it took a hundred years, and your father had me jailed as a vagrant. You thought I'd forget? My Injun blood won't let me forget. I've got you now, and you're going to settle that debt."
          emotion: angry
        - id: ch01-b55
          speaker: narrator
          text: Joe had moved close to the doctor and was shaking his fist in his face. Without warning, the doctor struck him and knocked him flat. Potter dropped his knife.
        - id: ch01-b56
          speaker: muff_potter
          text: "Hey, now! Don't you hit my partner!"
          emotion: angry
        - id: ch01-b57
          speaker: narrator
          text: Potter grabbed the doctor, and they fought with all their strength. Their feet tore through the grass and dug into the earth. Injun Joe sprang up, his eyes blazing. He snatched Potter's knife and crept around the struggling men, bent low like a cat, waiting for his chance.
        - id: ch01-b58
          speaker: narrator
          text: The doctor suddenly broke free. He seized the heavy wooden marker from Williams's grave and struck Potter down with it. At that very instant, Injun Joe saw his chance. He drove the knife all the way into the young doctor's chest. Doctor Robinson staggered and fell partly across Potter, and his blood poured over the fallen man. Clouds swept across the moon and hid the terrible scene. The two frightened boys sprang from their hiding place and raced away through the darkness.
        - id: ch01-b59
          speaker: narrator
          text: When the moon came out again, Injun Joe stood over the two bodies and watched them. The doctor made a faint sound, drew one or two long breaths, and then lay still.
        - id: ch01-b60
          speaker: injun_joe
          text: "That score is settled. Damn you."
          emotion: angry
        - id: ch01-b61
          speaker: narrator
          text: Joe bent down and robbed the dead man. Then he placed the bloody knife in Potter's open right hand and sat on the coffin they had torn apart. Three minutes passed, then four, then five. At last, Potter began to stir and moan. His fingers closed around the knife. He raised it in front of him, looked at it, and let it fall with a shudder.
        - id: ch01-b62
          speaker: narrator
          text: Potter sat up and pushed the doctor's body away. He stared at the dead man, then looked around in confusion. At last, his eyes found Joe.
        - id: ch01-b63
          speaker: muff_potter
          text: "Lord, Joe, what happened?"
          emotion: surprised
        - id: ch01-b64
          speaker: injun_joe
          text: "It's ugly work. Why'd you do it?"
        - id: ch01-b65
          speaker: muff_potter
          text: "Me? I never did that!"
          emotion: surprised
        - id: ch01-b66
          speaker: injun_joe
          text: "Now look here. That story won't fool anybody."
        - id: ch01-b67
          speaker: narrator
          text: Potter began to tremble, and his face turned white.
        - id: ch01-b68
          speaker: muff_potter
          text: "I thought I'd sobered up. I had no business drinking tonight, but my head's worse now than when we came. Everything's mixed up, and I can hardly remember a thing. Tell me honestly, Joe. Did I do it? I never meant to, I swear on my soul and honor. Tell me how it happened. Oh, it's awful. He was so young, and he had such a future."
          emotion: fearful
        - id: ch01-b69
          speaker: injun_joe
          text: "You two were fighting. He hit you with that grave marker and knocked you flat. Then you stumbled back up, grabbed the knife, and drove it into him just as he struck you again. You've been lying here stiff as a board ever since."
        - id: ch01-b70
          speaker: muff_potter
          text: "I didn't know what I was doing. May I drop dead this minute if that's not true. It must've been the whiskey and all the excitement. I've never used a weapon in my life, Joe. I've fought, sure, but never with a weapon. Everybody knows that. Please don't tell. Promise you won't. I've always liked you, Joe, and I've stood up for you. You remember that, don't you? You won't tell, will you?"
          emotion: fearful
        - id: ch01-b71
          speaker: narrator
          text: The poor man fell to his knees before the unmoved murderer and clasped his hands in a plea.
        - id: ch01-b72
          speaker: injun_joe
          text: "You've always treated me fair and square, Muff Potter. I won't turn against you. That's as honest an answer as any man can give."
        - id: ch01-b73
          speaker: muff_potter
          text: "Oh, Joe, you're an angel. I'll bless you for this as long as I live."
          emotion: sad
        - id: ch01-b74
          speaker: narrator
          text: Potter began to cry.
        - id: ch01-b75
          speaker: injun_joe
          text: "Enough of that. This is no time for crying. You go that way, and I'll go this way. Move, and don't leave any tracks."
        - id: ch01-b76
          speaker: narrator
          text: Potter set off at a trot, then quickly broke into a run. Injun Joe stayed where he was and watched him disappear.
        - id: ch01-b77
          speaker: injun_joe
          text: "If that blow stunned him as badly as the rum muddled him, he won't remember the knife until he's far away. Then he'll be too scared to come back here alone for it. Coward."
        - id: ch01-b78
          speaker: narrator
          text: Two or three minutes later, only the moon looked down on the murdered man, the corpse under its blanket, the open coffin without its lid, and the waiting grave. The stillness was complete once more.
