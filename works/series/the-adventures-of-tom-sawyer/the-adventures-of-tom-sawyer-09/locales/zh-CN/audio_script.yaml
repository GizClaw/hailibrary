audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    huck:
      display_name: 哈克贝利
      tts:
        delivery: 随性粗放，满不在乎又笃定
        timbre: 略沙哑的少年声
        pace: 松快
        pitch: 中音
    neighbor:
      display_name: 邻居
      tts:
        delivery: 睡意未消，恼火而短促
        timbre: 粗哑困倦
        pace: 快
        pitch: 中音
    doctor_robinson:
      display_name: 罗宾逊医生
      tts:
        delivery: 克制自持，受扰时明显不耐烦
        timbre: 清晰年轻
        pace: 中等
        pitch: 中音
    muff_potter:
      display_name: 莫夫·波特
      tts:
        delivery: 粗声粗气，醉意未消又容易惊慌
        timbre: 沙哑疲惫
        pace: 时快时慢
        pitch: 中低音
    injun_joe:
      display_name: 印第安·乔
      tts:
        delivery: 阴冷克制，威胁时不动声色
        timbre: 冷硬低沉
        pace: 缓慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 第九章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那天晚上九点半，汤姆和锡德照常上床，做完祷告，锡德很快就睡着了。汤姆却焦躁地醒着，等啊等。他觉得天都快亮了，钟才敲十下！这可叫他绝望透顶。他浑身都想翻来覆去，可又怕惊醒锡德，只得一动不动地躺着，望着头顶的黑暗。
        - id: ch01-b02
          speaker: narrator
          text: 屋里静得阴森。慢慢地，那些本来几乎听不见的细微动静，一样样都清楚起来。钟在滴答，老房梁神秘地咔咔响，楼梯也轻轻吱呀。看来鬼魂已经出来游荡了。波莉姨妈房里传来均匀的鼾声，不知躲在哪里的蟋蟀又唧唧叫个不停。
        - id: ch01-b03
          speaker: narrator
          text: 接着，床头墙里的报丧虫也发出可怕的滴答声。汤姆听说这表示有人寿数将尽，不由得浑身一颤。远处的狗对着夜空嗥叫，更远处又有一条狗轻声回应。每个声音都在折磨他。他终于认定，时间已经停住，永恒开始了。可睡意还是不由自主地渐渐袭来，钟敲十一点时，他一点也没听见。
        - id: ch01-b04
          speaker: narrator
          text: 一声凄惨的猫叫钻进汤姆刚成形的梦里。邻居家的窗户打开了。
        - id: ch01-b05
          speaker: neighbor
          text: “滚开！你这魔鬼！”
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 一只空瓶子砰地撞上波莉姨妈家的柴棚，汤姆顿时醒透了。不到一分钟，他已经穿好衣服翻出窗户，手脚并用地爬过侧屋屋顶。一路上，他还小心地学了两三声猫叫。他跳到柴棚顶，再从那里落到地上，哈克贝利·费恩正抱着死猫等他。两个男孩一起走进黑暗，很快便没了踪影。半小时后，他们已经蹚进墓地的深草里。
        - id: ch01-b07
          speaker: narrator
          text: 那是一座西部老式墓地，孤零零地立在离村子约一英里半的小山上。木板篱笆摇摇欲倒，有的朝里歪，其余的朝外斜，就是没有一处站得直。野草和杂草长满了整座墓地，老坟也一座座陷进地里。那里没有一块石碑，只有被虫蛀坏的圆顶木牌在坟前东倒西歪，想找个支撑也找不到。木牌上从前漆着“谨此纪念某某”，如今就算有光，大多也辨认不出了。
        - id: ch01-b08
          speaker: narrator
          text: 微风穿过树木，呜呜咽咽。汤姆怕这是死人的鬼魂在抱怨他们打扰。两个男孩很少开口，就算说话，也只敢压低嗓子。时辰、地方，还有笼罩四周的庄严与沉寂，都压得他们心头发沉。他们找到了那座堆着尖尖新土的坟，躲到几英尺外三棵并生的大榆树后面。
        - id: ch01-b09
          speaker: narrator
          text: 他们默默等了很久。远处的猫头鹰偶尔啼叫一声，除此以外，死寂里什么也听不见。汤姆心里越来越压抑，觉得非说点话不可。
        - id: ch01-b10
          speaker: tom
          text: “哈克，你说，死人愿意让咱们待在这儿吗？”
        - id: ch01-b11
          speaker: huck
          text: “我要是知道就好啦。这地方阴森得吓人，你不觉得吗？”
        - id: ch01-b12
          speaker: tom
          text: “我看也是。”
        - id: ch01-b13
          speaker: narrator
          text: 两个人沉默下来，各自在心里琢磨。过了一会儿，汤姆又压低嗓子。
        - id: ch01-b14
          speaker: tom
          text: “喂，哈克，你说霍斯·威廉斯能听见咱们讲话吗？”
        - id: ch01-b15
          speaker: huck
          text: “当然能。至少他的鬼魂能听见。”
        - id: ch01-b16
          speaker: tom
          text: “我刚才真该叫他威廉斯先生。可我没半点恶意，大家都叫他霍斯呀。”
        - id: ch01-b17
          speaker: huck
          text: “谈到死人，怎么小心都不算过分，汤姆。”
        - id: ch01-b18
          speaker: narrator
          text: 这句话叫他们心里一凉，谈话又停了。没过多久，汤姆猛地抓住哈克的胳膊。
        - id: ch01-b19
          speaker: tom
          text: “嘘！又有声音了，你没听见吗？”
        - id: ch01-b20
          speaker: narrator
          text: 哈克刚要回答，话还没说完，那个声音又响了。
        - id: ch01-b21
          speaker: tom
          text: “那边！这回听清了吧。”
        - id: ch01-b22
          speaker: huck
          text: “老天爷啊，汤姆，他们来了，准是他们！咱们怎么办？”
          emotion: fearful
        - id: ch01-b23
          speaker: tom
          text: “我不知道。你说他们会不会看见咱们？”
        - id: ch01-b24
          speaker: huck
          text: “汤姆，他们在黑地里也看得见，跟猫一样。我真不该来。”
          emotion: fearful
        - id: ch01-b25
          speaker: tom
          text: “别怕，我想他们不会来招惹咱们。咱们又没干坏事。只要一动不动，他们也许根本注意不到。”
        - id: ch01-b26
          speaker: huck
          text: “我尽量不动，可我浑身都在发抖。”
          emotion: fearful
        - id: ch01-b27
          speaker: tom
          text: “仔细听！”
        - id: ch01-b28
          speaker: narrator
          text: 两个男孩把头凑紧，连气都几乎不敢喘。墓地远处有一阵含混的说话声飘过来。
        - id: ch01-b29
          speaker: tom
          text: “快看那儿！那是什么？”
        - id: ch01-b30
          speaker: huck
          text: “那是鬼火。汤姆，这下可太吓人了。”
          emotion: fearful
        - id: ch01-b31
          speaker: narrator
          text: 黑暗里出现几个模糊的人影，正提着一盏老式铁皮灯走近。灯来回摇摆，在地上洒下数不清的点点亮光。哈克打着寒战开了口。
        - id: ch01-b32
          speaker: huck
          text: “真的是魔鬼，一共三个！老天爷啊，汤姆，咱们完啦！你会不会祷告？”
          emotion: fearful
        - id: ch01-b33
          speaker: tom
          text: “我试试。你别怕，他们不会伤害咱们的。‘如今我躺下安睡，我……’”
        - id: ch01-b34
          speaker: huck
          text: “别出声！”
        - id: ch01-b35
          speaker: tom
          text: “怎么了，哈克？”
        - id: ch01-b36
          speaker: huck
          text: “他们是人！至少有一个是人。我听见老莫夫·波特的声音了。”
          emotion: surprised
        - id: ch01-b37
          speaker: tom
          text: “不会吧，真是他？”
          emotion: surprised
        - id: ch01-b38
          speaker: huck
          text: “我准没听错。你一点也别动。那老家伙脑子不灵，多半又像往常一样喝醉了，不会发现咱们的。”
        - id: ch01-b39
          speaker: tom
          text: “好，我不动。他们找不到地方啦。又过来了。现在近了，又远了，又近了。这回近极了，方向准没错。哈克，另一个声音我也认出来了，是印第安·乔。”
        - id: ch01-b40
          speaker: huck
          text: “没错，就是那个杀人不眨眼的混血种！我宁可来的真是魔鬼。他们到底要干什么？”
          emotion: fearful
        - id: ch01-b41
          speaker: narrator
          text: 三个男人已经走到坟前，离藏身的男孩只有几英尺，两人的耳语立刻断了。
        - id: ch01-b42
          speaker: doctor_robinson
          text: “就在这里。”
        - id: ch01-b43
          speaker: narrator
          text: 第三个男人提起灯，灯光照出了年轻的罗宾逊医生。波特和印第安·乔抬着一辆手推架，上面放着一根绳子和两把铁锹。他们把东西扔在地上，动手掘坟。医生把灯放在坟头，又走到一棵榆树旁，背靠树干坐下来。他离两个男孩近得很，孩子们伸手就能碰到他。
        - id: ch01-b44
          speaker: doctor_robinson
          text: “你们快一点，月亮随时都会出来。”
        - id: ch01-b45
          speaker: narrator
          text: 两个人咕哝一声算作回答，接着挖土。很长一段时间里，都只有铁锹卸下泥土和碎石的刮擦声，单调地响个不停。终于，一把铁锹碰到棺材，发出沉闷的木头声。又过一两分钟，他们把棺材吊到地面，用铁锹撬开盖子，拖出尸体，粗暴地扔在地上。
        - id: ch01-b46
          speaker: narrator
          text: 月亮从云后移出来，照亮了尸体惨白的脸。他们备好手推架，把尸体放上去，盖上一条毯子，再用绳子牢牢捆住。波特拿出一把大弹簧刀，割掉了垂下来的那截绳头。
        - id: ch01-b47
          speaker: muff_potter
          text: “这该死的东西弄好了，郎中。你得再给我们五块钱，不然就把它留在这里。”
        - id: ch01-b48
          speaker: injun_joe
          text: “这话说得对。”
        - id: ch01-b49
          speaker: doctor_robinson
          text: “等一下，这是怎么回事？是你们要我先付钱，我已经照办了。”
        - id: ch01-b50
          speaker: injun_joe
          text: “不错，可你还干过另一件事。五年前有一晚，我去你父亲的厨房讨点吃的，你赶我出去，还说我去那里准没好事。我发誓迟早要报复，哪怕等上一百年，你父亲却把我当流浪汉送进牢里。你以为我忘了吗？我身上的印第安血可不是白流的。现在你落到我手里了，这笔账必须算清！”
          emotion: angry
        - id: ch01-b51
          speaker: narrator
          text: 印第安·乔走到医生面前，用拳头抵着他的脸。医生忽然一拳挥出去，把他打倒在地。波特丢下手里的刀，大喊起来。
        - id: ch01-b52
          speaker: muff_potter
          text: “住手！不许你打我的伙伴！”
          emotion: angry
        - id: ch01-b53
          speaker: narrator
          text: 波特一把揪住医生，两个人拼尽全力扭打起来，脚下的草被踩烂，鞋跟也把地面刨出道道痕迹。印第安·乔跳起来，眼里燃着怒火。他抓起波特的刀，弓着腰，像猫一样蹑手蹑脚地绕着那两个人转了一圈又一圈，等着下手的机会。
        - id: ch01-b54
          speaker: narrator
          text: 猛然间，医生挣脱波特，抓起威廉斯坟头沉重的木牌，一下把波特打倒在地。就在同一刻，印第安·乔瞅准空当，将刀直没至柄，刺进年轻医生的胸口。医生踉跄几步才倒下，半边身子压在波特身上，鲜血涌了波特一身。云层恰好遮住眼前这幅可怕的景象，两个吓坏的男孩也趁着黑暗飞奔而去。
        - id: ch01-b55
          speaker: narrator
          text: 月亮再露面时，印第安·乔站在倒下的两人旁边，低头看着他们。医生含混地哼了一声，长长喘过两口气，便不动了。
        - id: ch01-b56
          speaker: injun_joe
          text: “这笔账总算清了。该死的东西。”
        - id: ch01-b57
          speaker: narrator
          text: 他搜走医生身上的东西，再把杀人的刀塞进波特张开的右手，自己坐到撬坏的棺材上。三分钟，四分钟，五分钟过去了。波特开始动弹，还低声呻吟。他的手指合拢，握住了刀。他把刀举起来看了一眼，又打着寒战扔到地上。随后，他坐起来推开身上的尸体，先盯着尸体看，再茫然地望向四周，最后正对上乔的目光。
        - id: ch01-b58
          speaker: muff_potter
          text: “老天爷啊，乔，这是怎么回事？”
          emotion: surprised
        - id: ch01-b59
          speaker: injun_joe
          text: “这事可够肮脏的。你为什么要这么干？”
        - id: ch01-b60
          speaker: muff_potter
          text: “我？不是我干的！”
          emotion: surprised
        - id: ch01-b61
          speaker: injun_joe
          text: “行了，这种话骗不了人。”
        - id: ch01-b62
          speaker: narrator
          text: 波特浑身颤抖，脸色一下变得惨白。
        - id: ch01-b63
          speaker: muff_potter
          text: “我还当自己酒醒了呢。今晚真不该喝，可酒劲还在脑袋里，比咱们动身时更厉害。我什么都想不清，几乎一点也记不得。乔，你说实话，老伙计，真是我干的吗？我绝不是故意的，我凭灵魂和名誉发誓！快告诉我当时到底怎么了。太可怕了，他还这么年轻，前途又那么好。”
          emotion: fearful
        - id: ch01-b64
          speaker: injun_joe
          text: “你们两个正扭打，他抡起坟头木牌，一下把你打趴了。后来你晃晃悠悠地爬起来，抓过那把刀捅进他胸口。偏偏这时候，他又狠狠打了你一下。你就像块木楔似的躺在这里，一直昏到刚才。”
        - id: ch01-b65
          speaker: muff_potter
          text: “我根本不知道自己在干什么。要是我明知故犯，就叫我现在死在这里！准是威士忌和打斗弄昏了我的头。我这辈子从没用过家伙。打架是打过，可从不用家伙，人人都能作证。乔，别告诉别人！你答应我吧，老伙计。我一向喜欢你，还替你说过话，你不记得了吗？你不会说出去，对不对？”
          emotion: fearful
        - id: ch01-b66
          speaker: narrator
          text: 可怜的波特跪在真正的凶手面前，合起双手苦苦哀求。印第安·乔仍旧冷冷地看着他。
        - id: ch01-b67
          speaker: injun_joe
          text: “不会。莫夫·波特，你一直待我公平厚道，我也不会出卖你。一个人能给的保证，也就这么实在了。”
        - id: ch01-b68
          speaker: muff_potter
          text: “乔，你简直是天使！只要我还活着一天，就会为这件事祝福你一天。”
        - id: ch01-b69
          speaker: narrator
          text: 波特说着哭了起来。
        - id: ch01-b70
          speaker: injun_joe
          text: “行了，别哭个没完。现在不是哭鼻子的时候。你往那边走，我走这边。快点动身，别留下脚印。”
        - id: ch01-b71
          speaker: narrator
          text: 波特先是小跑，很快便撒腿狂奔。印第安·乔站在原地望着他的背影，低声自语。
        - id: ch01-b72
          speaker: injun_joe
          text: “要是那一棍真把他打昏了，酒也真把他灌糊涂了，看样子准是这样，那他想起这把刀时，早就跑出老远。这个胆小鬼绝不敢独自回到这种地方找刀！”
        - id: ch01-b73
          speaker: narrator
          text: 两三分钟后，遇害的医生、裹着毯子的尸体、敞着盖子的棺材，还有挖开的坟坑，都只剩月亮照看。四周也重新陷入彻底的寂静。
