  chapters:
    - id: ch01
      title: CHAPTER XXIX
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Friday morning brought Tom wonderful news. Judge Thatcher and his family had returned to town the night before. For a while, even Injun Joe and the treasure slipped to the back of Tom's mind. Becky mattered most. He found her, and the two of them wore themselves out playing hispy and gully-keeper with their schoolmates.
        - id: ch01-b02
          speaker: narrator
          text: Then the day ended in the best possible way. Becky coaxed her mother into holding the long-promised picnic the very next day, and Mrs. Thatcher agreed. Becky was beside herself with joy, and Tom was just as excited. Before sunset, the invitations had gone out. Soon all the village children were rushing about, getting ready and dreaming of the fun ahead.
        - id: ch01-b03
          speaker: narrator
          text: Tom stayed awake late that night. He kept hoping to hear Huck's call outside, the long-drawn maow that would mean news of the treasure. If Huck came, Tom could astonish Becky and everyone at the picnic with the box of money the next day. But the signal never came.
        - id: ch01-b04
          speaker: narrator
          text: Morning finally arrived. By ten or eleven, a laughing, restless crowd had gathered at Judge Thatcher's house, ready to go. Older people did not usually spoil these picnics by coming along. A few young ladies of eighteen and young gentlemen of about twenty-three were thought quite enough to keep the children safe.
        - id: ch01-b05
          speaker: narrator
          text: They had hired the old steam ferryboat for the day. Before long, the merry company marched up the main street carrying baskets of food. Sid was ill and had to miss everything, while Mary stayed home to keep him company. Just before Becky left, her mother gave her one last instruction.
        - id: ch01-b06
          speaker: mrs_thatcher
          text: You won't be home until late, Becky. Maybe you should spend the night with one of the girls who lives near the ferry landing.
        - id: ch01-b07
          speaker: becky
          text: Then I'll stay with Susy Harper, Mama.
        - id: ch01-b08
          speaker: mrs_thatcher
          text: All right. Mind your manners, and don't make trouble for anyone.
        - id: ch01-b09
          speaker: narrator
          text: As the children hurried along, Tom leaned toward Becky with another plan.
        - id: ch01-b10
          speaker: tom
          text: Listen, Becky. Instead of going to Joe Harper's tonight, let's climb the hill and stay at Widow Douglas's. She has heaps of ice cream almost every day, and she'll be mighty glad to see us.
        - id: ch01-b11
          speaker: becky
          text: Oh, that sounds wonderful!
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: Becky thought it over for a moment. Then one worry occurred to her.
        - id: ch01-b13
          speaker: becky
          text: But what will Mama think?
        - id: ch01-b14
          speaker: tom
          text: How would she ever find out?
        - id: ch01-b15
          speaker: narrator
          text: Becky turned that answer over in her mind. She still sounded doubtful.
        - id: ch01-b16
          speaker: becky
          text: I suppose it isn't right, but...
        - id: ch01-b17
          speaker: tom
          text: Oh, nonsense! Your mother won't know, so where's the harm? She only wants you somewhere safe. If she'd thought of Widow Douglas's, I bet she'd have told you to go there herself. I know she would.
        - id: ch01-b18
          speaker: narrator
          text: Widow Douglas was famous for treating guests splendidly, and Tom knew how to persuade. Together, those two things settled the matter. Tom and Becky agreed not to tell anyone where they meant to spend the night.
        - id: ch01-b19
          speaker: narrator
          text: Then Tom remembered that Huck might come that very night with the signal. The thought took some of the pleasure out of his plan. Still, he could not bear to miss an evening at Widow Douglas's. The signal had not come last night, he told himself, so why should it come tonight? The evening's fun was certain, while the treasure was not. That was enough for Tom. He gave in to the stronger temptation and refused to think about the box of money again that day.
        - id: ch01-b20
          speaker: narrator
          text: Three miles below town, the ferryboat stopped at the mouth of a wooded hollow and tied up. Everyone swarmed ashore. Soon the forest and the rocky heights rang with laughter and shouting. The children tried every possible way of making themselves hot and tired. At last the wandering groups straggled back to camp with enormous appetites and began destroying all the good things in the food baskets.
        - id: ch01-b21
          speaker: narrator
          text: When the feast was over, they rested and talked beneath the wide oak trees. After a while, someone called out to the whole company.
        - id: ch01-b22
          speaker: picnic_goer
          text: Who wants to explore the cave?
        - id: ch01-b23
          speaker: narrator
          text: Everyone did. They gathered bundles of candles and raced up the hill. The cave entrance stood high on the slope, shaped like a great letter A, with its heavy oak door left open. Just inside lay a small chamber. It was as cold as an icehouse, and drops of moisture covered its solid limestone walls.
        - id: ch01-b24
          speaker: narrator
          text: From that deep shadow, the children could look back at the green valley shining in the sun. For a moment, it felt mysterious and grand. Then the feeling passed, and the romping began again. Whenever someone lit a candle, everyone else rushed to put it out. Its owner fought bravely, but the flame was soon knocked down or blown away. Each victory brought laughter and another chase.
        - id: ch01-b25
          speaker: narrator
          text: At last, the games gave way to exploring. The children filed down the steep main passage, their flickering row of lights showing the towering rock walls almost to the place where they met, sixty feet overhead. The passage was only eight or ten feet across. Every few steps, another high, narrow crack opened on one side or the other.
        - id: ch01-b26
          speaker: narrator
          text: McDougal's cave was a huge maze. Its crooked passages crossed, doubled back, and led nowhere. People said a person could wander through its cracks and pits for days and nights without finding the end. He could keep going down into the earth and discover maze beneath maze, forever. No one truly knew the whole cave. That was impossible. Most of the young men knew only part of it, and people rarely went beyond that familiar ground. Tom Sawyer knew as much as anyone.
        - id: ch01-b27
          speaker: narrator
          text: The procession followed the main passage for about three quarters of a mile. Then pairs and small groups began slipping into side passages. They raced through the gloomy corridors and startled one another where the paths met again. A group could hide from all the others for half an hour without leaving the part of the cave people knew.
        - id: ch01-b28
          speaker: narrator
          text: One group after another eventually stumbled back to the entrance. They were breathless and laughing, streaked all over with candle grease and clay, and completely pleased with their day. Only then did they notice the time. Night was nearly upon them, and the ferryboat's clanging bell had already been calling them back for half an hour.
        - id: ch01-b29
          speaker: narrator
          text: But the late ending made the adventure feel romantic, so everyone was satisfied. When the ferryboat carried its wild load back into the river, only the captain cared that they had lost so much time.
        - id: ch01-b30
          speaker: narrator
          text: Huck was already keeping watch when the ferryboat's lights glimmered past the wharf. The children aboard were so nearly tired to death that they had become quiet, so Huck heard no noise from the deck. He wondered what boat it was and why it had not stopped. Then he let it pass from his mind and returned to his own business.
        - id: ch01-b31
          speaker: narrator
          text: Clouds gathered, and the night grew darker. At ten o'clock, the sound of wagons stopped. Scattered lights winked out one after another across town. Every last straggling pedestrian disappeared from the streets, and the village went to sleep, leaving the small watcher alone with the silence and the ghosts. Eleven came. The tavern lights went dark too. Now there was darkness everywhere.
        - id: ch01-b32
          speaker: narrator
          text: Huck waited for what felt like an endless time, but nothing happened. He began to lose faith. Was this watch doing any good? Was there really any point in staying? Why not quit and find somewhere to sleep?
        - id: ch01-b33
          speaker: narrator
          text: Then he heard a sound. In an instant, he was fully alert. The alley door closed with hardly a noise. Huck darted to the corner of the brick store. A moment later, two men passed close by. One seemed to be carrying something beneath his arm. It had to be the box.
        - id: ch01-b34
          speaker: narrator
          text: They were moving the treasure. There was no time to call Tom. If Huck left now, the men would escape with the box and might never be found again. He would follow them himself and trust the darkness to hide him. Barefoot and silent as a cat, Huck slipped after the men, keeping them just near enough to see.
        - id: ch01-b35
          speaker: narrator
          text: They went three blocks along the river street, turned left, and kept on until they reached the path up Cardiff Hill. They passed the old Welshman's house halfway up without slowing. Huck decided they must be planning to bury the box in the old quarry. But they went straight past the quarry and climbed to the top.
        - id: ch01-b36
          speaker: narrator
          text: The men entered a narrow path between tall sumac bushes and vanished into the gloom. Huck moved closer. They could never see him here, he thought. He trotted for a while, then slowed down, afraid he was catching up too quickly. He crept a little farther and stopped to listen.
        - id: ch01-b37
          speaker: narrator
          text: There were no footsteps. Huck could hear only the pounding of his own heart. An owl hooted across the hill, and the sound seemed full of warning. Had he lost the men? He was ready to dash forward when someone cleared his throat less than four feet away.
        - id: ch01-b38
          speaker: narrator
          text: Huck's heart jumped into his throat. He swallowed hard and stood trembling so violently that he thought his legs would give way. Then he recognized the place. He was less than five steps from the stile that led into Widow Douglas's grounds. Very well, he thought. If they bury the treasure here, finding it again will be easy.
        - id: ch01-b39
          speaker: narrator
          text: A man spoke in a whisper. Huck knew the voice at once. It was Injun Joe.
        - id: ch01-b40
          speaker: injun_joe
          text: Curse her. Maybe she has visitors. There are lights burning this late.
          emotion: angry
        - id: ch01-b41
          speaker: stranger
          text: I don't see any lights.
        - id: ch01-b42
          speaker: narrator
          text: The other voice belonged to the stranger from the haunted house. A deadly chill went through Huck. So this was the revenge they had spoken about. His first thought was to run. Then he remembered how often Widow Douglas had been kind to him. Perhaps the men meant to murder her. Huck wished he dared warn her, but he knew they might catch him if he tried.
        - id: ch01-b43
          speaker: injun_joe
          text: That bush is blocking your view. Come this way. There. You see the lights now, don't you?
        - id: ch01-b44
          speaker: stranger
          text: Yes. I suppose she does have company. We ought to leave it alone.
        - id: ch01-b45
          speaker: injun_joe
          text: Leave it alone when I'm about to quit this country forever? I may never get another chance. I've told you before, I don't want her money. You can take it. Her husband treated me brutally, over and over. Worse than that, he was the justice of the peace who jailed me for being a vagrant. And that was hardly the beginning. He had me horsewhipped in front of the jail, with the whole town watching. Horsewhipped! Do you understand? He escaped me by dying, but I'll punish her in his place.
          emotion: angry
        - id: ch01-b46
          speaker: stranger
          text: Please don't murder her. Don't do that.
          emotion: fearful
        - id: ch01-b47
          speaker: injun_joe
          text: Murder her? I never said that. If her husband were here, I'd kill him, but I won't kill her. To take revenge on a woman, you ruin her face. You cut her nostrils and notch her ears like a sow.
          emotion: angry
        - id: ch01-b48
          speaker: stranger
          text: Good God, that's...
          emotion: fearful
        - id: ch01-b49
          speaker: injun_joe
          text: Keep your thoughts to yourself. That's safest for you. I'll tie her to the bed. If she bleeds to death, it won't be my fault, and I won't shed a tear. You're here to help me because I may not manage alone. If you lose your nerve, I'll kill you. Understand? And if I have to kill you, I'll kill her too. Then no one will ever learn who did it.
          emotion: angry
        - id: ch01-b50
          speaker: stranger
          text: If we have to do it, let's finish it. The sooner, the better. I'm shaking all over.
          emotion: fearful
        - id: ch01-b51
          speaker: injun_joe
          text: Go in now, while she has company? Talk like that will make me suspicious of you. No. We'll wait until every light is out. We have plenty of time.
        - id: ch01-b52
          speaker: narrator
          text: Huck knew a silence was coming, and that seemed even more terrible than all their murderous talk. He held his breath and eased one foot backward. He had to balance on one leg, swaying first one way and then the other, before he could set it down carefully. He took another slow step, then another. A twig snapped beneath his foot.
        - id: ch01-b53
          speaker: narrator
          text: Huck stopped breathing and listened. Nothing moved. The stillness was complete, and his relief was beyond measure. Between the walls of sumac, he turned his whole body as cautiously as a ship changing course. Then he began moving away, quickly but carefully. When he stepped out at the quarry, he finally felt safe. He lifted his heels and flew down, down the hill toward the Welshman's house.
        - id: ch01-b54
          speaker: narrator
          text: Huck hammered on the door. Soon the old man and his two strong sons stuck their heads out of the windows.
        - id: ch01-b55
          speaker: welshman
          text: What's all this noise? Who's pounding on the door, and what do you want?
        - id: ch01-b56
          speaker: huck
          text: Let me in, quick! I'll explain everything.
          emotion: fearful
        - id: ch01-b57
          speaker: welshman
          text: Who are you?
        - id: ch01-b58
          speaker: huck
          text: Huckleberry Finn. Please, let me in now!
          emotion: fearful
        - id: ch01-b59
          speaker: welshman
          text: Huckleberry Finn, is it? That name doesn't open many doors, I reckon. Still, let him in, boys. We'll find out what's wrong.
        - id: ch01-b60
          speaker: narrator
          text: The moment Huck was inside, he begged them to keep his part secret.
        - id: ch01-b61
          speaker: huck
          text: Please, never tell anyone I warned you. They'd kill me for sure. But the widow has been kind to me more than once, so I want to tell you. I will tell you, if you all promise never to say it came from me.
          emotion: fearful
        - id: ch01-b62
          speaker: welshman
          text: By George, you truly do have something to tell, or you wouldn't be acting this way. Speak up, lad. No one here will ever give you away.
        - id: ch01-b63
          speaker: narrator
          text: Three minutes later, the Welshman and his sons were armed and climbing the hill. They entered the sumac path on tiptoe, carrying their weapons. Huck went no farther. He hid behind a great boulder and listened.
        - id: ch01-b64
          speaker: narrator
          text: The silence dragged on, heavy with worry. Then gunshots suddenly exploded, and someone cried out.
        - id: ch01-b65
          speaker: narrator
          text: Huck did not wait to learn anything more. He sprang from his hiding place and raced down the hill as fast as his legs could carry him.
