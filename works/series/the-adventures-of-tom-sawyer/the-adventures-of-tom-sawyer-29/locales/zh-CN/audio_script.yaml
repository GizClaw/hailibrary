audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    mrs_thatcher:
      display_name: 撒切尔太太
      tts:
        delivery: 关爱而坚定，语气实际
        timbre: 温暖成熟的女声
        pace: 从容
        pitch: 中音
    becky:
      display_name: 贝琪·撒切尔
      tts:
        delivery: 明快热情，犹豫时略带迟疑
        timbre: 清脆的少女声
        pace: 轻快
        pitch: 中高音
    tom:
      display_name: 汤姆
      tts:
        delivery: 聪明好胜，兴奋时语速加快，害怕时压低声音
        timbre: 清亮的少年声
        pace: 轻快灵活
        pitch: 中高音
    picnic_goer:
      display_name: 野餐伙伴
      tts:
        delivery: 欢快热情，富有号召力
        timbre: 清新的年轻声音
        pace: 明快
        pitch: 中音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，带着街头少年的粗朴和谨慎
        timbre: 略带沙哑的少年声
        pace: 自然偏慢
        pitch: 中音
    injun_joe:
      display_name: 印第安乔
      tts:
        delivery: 低沉克制，透着威胁
        timbre: 粗粝阴暗
        pace: 缓慢有压迫感
        pitch: 低音
    stranger:
      display_name: 陌生人
      tts:
        delivery: 不安退缩，时常迟疑
        timbre: 粗哑低弱
        pace: 犹疑偏慢
        pitch: 中低音
    welshman:
      display_name: 老威尔士人
      tts:
        delivery: 直率警觉，沉稳有主见
        timbre: 强健沧桑
        pace: 从容
        pitch: 低音
  chapters:
    - id: ch01
      title: 第二十九章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 星期五一早，汤姆就听到了好消息。撒切尔法官一家昨夜回城了。印第安乔和宝藏顿时被他抛到脑后，现在最要紧的是贝琪。他一见到贝琪，便和她还有一群同学玩起“躲躲藏”和“守山沟”，直玩得筋疲力尽。
        - id: ch01-b02
          speaker: narrator
          text: 这一天还有个再称心不过的结尾。贝琪缠着母亲，要她把拖了又拖的野餐会定在第二天，母亲终于点了头。贝琪欢喜得不得了，汤姆也一样兴奋。太阳落山前，请帖已经送遍全村，孩子们忙着准备，也忙着盼望。
        - id: ch01-b03
          speaker: narrator
          text: 那晚，汤姆激动得迟迟睡不着。他盼着窗外传来哈克那声“喵呜”，这样明天就能带着宝藏，让贝琪和所有伙伴大吃一惊。可他终究没等到信号。
        - id: ch01-b04
          speaker: narrator
          text: 第二天早晨总算到了。十点到十一点之间，一大群孩子聚在撒切尔法官家，笑着，闹着，只等出发。按当地的规矩，上了年纪的人不会露面，把野餐会的兴致搅坏。只要由几位十八岁的姑娘和二十三岁上下的年轻男子照看，大家就认为孩子们足够安全了。
        - id: ch01-b05
          speaker: narrator
          text: 大家为了这次野餐，专门包下一艘老式蒸汽渡船。不久，欢乐的队伍提着装满食物的篮子，沿大街排队走去。锡德病了，只能错过这场热闹。玛丽留在家里陪他。贝琪临出门时，母亲又叮嘱了她一遍。
        - id: ch01-b06
          speaker: mrs_thatcher
          text: 贝琪，你们回来时一定很晚。今晚最好住在渡口附近哪个姑娘家里。
        - id: ch01-b07
          speaker: becky
          text: 那我住苏茜·哈珀家吧，妈妈。
        - id: ch01-b08
          speaker: mrs_thatcher
          text: 好。记住要规矩些，别给人家惹麻烦。
        - id: ch01-b09
          speaker: narrator
          text: 大家欢快地走着，汤姆凑到贝琪身边，说起了另一个打算。
        - id: ch01-b10
          speaker: tom
          text: 贝琪，今晚咱们别去乔·哈珀家了。咱们爬上山，住到道格拉斯寡妇家去。她家差不多天天都有大堆冰激凌，而且她见到咱们，一定高兴极了。
        - id: ch01-b11
          speaker: becky
          text: 那一定特别好玩！
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: 贝琪想了想，又有些担心。
        - id: ch01-b13
          speaker: becky
          text: 可妈妈知道了会怎么说？
        - id: ch01-b14
          speaker: tom
          text: 她怎么可能知道呢？
        - id: ch01-b15
          speaker: narrator
          text: 贝琪反复琢磨着这个主意，开口时还是不大情愿。
        - id: ch01-b16
          speaker: becky
          text: 我觉得这样不太对，可是……
        - id: ch01-b17
          speaker: tom
          text: 得了吧！你妈妈不会知道，能有什么关系？她只是要你平安。要是她想到了道格拉斯寡妇家，准会让你去。我敢肯定！
        - id: ch01-b18
          speaker: narrator
          text: 道格拉斯寡妇一向把客人招待得特别好，这个诱惑本来就很难抵挡，再加上汤姆会劝人，贝琪终于答应了。他们决定不把晚上的去处告诉任何人。
        - id: ch01-b19
          speaker: narrator
          text: 汤姆忽然记起，哈克可能恰好会在今晚发信号，兴致顿时消了大半。可他又舍不得放弃去寡妇家享乐。他暗自盘算，昨晚没有信号，今晚又凭什么会有呢？晚上的快乐是一定的，宝藏却说不准。汤姆到底是个男孩子，很快就顺着更强烈的念头走了，并且一整天都不准自己再想那箱钱。
        - id: ch01-b20
          speaker: narrator
          text: 渡船开到镇子下游三英里，在一条长满树林的山谷口靠岸。众人一窝蜂涌上去，叫声和笑声很快响遍远处的树林和嶙峋高地。凡是能让自己又热又累的玩法，孩子们全试了一遍。后来，这群四处游荡的人带着货真价实的好胃口，陆续回到营地，把篮子里的好东西一扫而空。
        - id: ch01-b21
          speaker: narrator
          text: 吃饱以后，大家在枝叶舒展的橡树荫下休息说笑，清凉的空气让人精神一爽。过了一阵，有人朝众人大喊。
        - id: ch01-b22
          speaker: picnic_goer
          text: 谁要进山洞探险？
        - id: ch01-b23
          speaker: narrator
          text: 人人都要去。他们拿来一捆捆蜡烛，争着跑上山。洞口开在山坡上，像一个大写的字母A，厚重的橡木门也没有上闩。里面是一间小石室，冷得像冰窖，坚实的石灰岩壁上凝满了水珠。
        - id: ch01-b24
          speaker: narrator
          text: 孩子们站在洞口的幽暗中，回头望着阳光下闪亮的绿色山谷，只觉得又浪漫、又神秘，还带着一种庄严。不过这种感觉没维持多久，他们很快又闹了起来。谁刚点亮一支蜡烛，别人便一拥而上。主人拼命抵挡，火苗还是会被撞落或吹灭。欢快的笑声一响，新一轮追逐也开始了。
        - id: ch01-b25
          speaker: narrator
          text: 可所有游戏都有结束的时候。玩闹终于停下，队伍沿主通道陡峭的斜坡往下走。一列摇晃的火光隐约照出两边高高的岩壁，一直延伸到六十英尺上方，那里几乎合在了一起。主通道只有八到十英尺宽，每隔几步，两侧就会岔出更高、更窄的裂缝。
        - id: ch01-b26
          speaker: narrator
          text: 麦克杜格尔山洞是一座巨大的迷宫。弯弯曲曲的通道互相穿插，绕进去又绕出来，最后哪里也到不了。据说，有人能在纵横交错的石缝和深坑中走上许多个白天黑夜，仍然找不到山洞尽头。他还可以不断往下走，再往下走，一直深入地底。可下面仍是迷宫套着迷宫，层层都没有尽头。
        - id: ch01-b27
          speaker: narrator
          text: 没人真正熟悉整座山洞，因为那根本办不到。年轻男子大多只认得其中一部分，平常也不会远远走出这片熟路。汤姆·索亚知道的，已经不比任何人少了。
        - id: ch01-b28
          speaker: narrator
          text: 队伍沿主通道走了大约四分之三英里，接着，三五成群和两两结伴的人纷纷溜进两侧的岔道。他们在阴森的走廊里飞奔，又在通道重新交会的地方突然冲出来吓对方。谁也不用离开那片大家熟悉的区域，就能躲开其他人足足半个钟头。
        - id: ch01-b29
          speaker: narrator
          text: 后来，一拨拨人跌跌撞撞地回到洞口。他们喘着气，大声笑着，从头到脚都是滴落的烛油，衣服和身上还抹满泥巴，对这一天的成果满意极了。直到这时，大家才惊讶地发现，他们一直没有留意时间，夜色已经逼近，而召集他们的钟声足足响了半个钟头。
        - id: ch01-b30
          speaker: narrator
          text: 不过，用这种方式结束一天的冒险很有几分浪漫，所以人人都觉得满意。渡船载着这群疯闹的乘客驶回河中时，只有船长在意白白耽误了多少时间，其他人连半个便士都不在乎。
        - id: ch01-b31
          speaker: narrator
          text: 渡船的灯光闪闪烁烁，从码头前经过时，哈克已经开始守夜。船上的年轻人全累得半死，像所有累到这种地步的人一样，安静得一点声音也没有。哈克猜不出那是什么船，也不明白为什么不停靠，可转眼就把它忘了，继续盯着自己的事。
        - id: ch01-b32
          speaker: narrator
          text: 云越聚越多，夜也越来越黑。十点一到，车辆没了声响，镇上零落的灯火一盏盏熄灭，最后几个在街上游荡的行人也消失了。整个村子沉入睡梦，只剩这个小小的守望者独自陪着寂静和鬼魂。十一点钟，旅店的灯也熄了，到处漆黑一片。
        - id: ch01-b33
          speaker: narrator
          text: 哈克又等了仿佛无穷无尽的一段时间，还是什么也没发生。他渐渐没了信心。这样苦等有用吗？真的有用吗？为什么不就此放弃，找地方睡觉呢？
        - id: ch01-b34
          speaker: narrator
          text: 忽然，一个声响传进耳朵，哈克立刻全神贯注。小巷的门轻轻关上了。他猛地躲到砖砌商店的墙角。紧接着，两个男人几乎擦着他走过，其中一个腋下似乎夹着东西。一定是那只箱子！
        - id: ch01-b35
          speaker: narrator
          text: 他们要转移宝藏。现在去叫汤姆实在太傻，两个男人会带着箱子逃得无影无踪，从此再也找不到。哈克决定紧跟在后面，独自追踪，相信黑夜会护着自己，不让人发现。他光着脚，像猫一样悄无声息地尾随，只让那两人走在刚好还能看见的地方。
        - id: ch01-b36
          speaker: narrator
          text: 两人沿河边街道走了三个街区，左转进入横街，又一直向前，踏上通往卡迪夫山的小路。他们经过半山腰老威尔士人的家，连脚步也没停一下。哈克心里叫好，猜他们准要把箱子埋进老采石场。谁知两人径直越过采石场，继续登上山顶。
        - id: ch01-b37
          speaker: narrator
          text: 他们一头钻进高高的漆树丛，立刻消失在一条狭窄小径的黑暗里。哈克赶紧靠近，缩短距离，因为这里没人能看见他。他小跑了一阵，又怕追得太快，便放慢脚步。再向前挪了一点，他索性停下来，竖起耳朵仔细听。
        - id: ch01-b38
          speaker: narrator
          text: 没有脚步声，一点儿也没有。哈克只听得见自己的心怦怦直跳。山那边传来猫头鹰不祥的啼叫，可脚步声还是没有。老天，难道一切都完了，人也跟丢了？他正要拔腿向前飞奔，离他不到四英尺的地方突然有人清了清嗓子。
        - id: ch01-b39
          speaker: narrator
          text: 哈克的心一下跳到喉咙口，又被他咽了回去。他站在那里浑身打战，仿佛十二种寒热病一齐缠上了身，双腿软得快要倒下。随后，他认出了这个地方。前面不到五步，就是通往道格拉斯寡妇家园子的栅栏台阶。他心想，好吧，让他们埋在这里，往后很容易找到。
        - id: ch01-b40
          speaker: narrator
          text: 一个男人压低声音开口。哈克马上听出，那是印第安乔。
        - id: ch01-b41
          speaker: injun_joe
          text: 该死的娘儿们。家里也许有客人，这么晚还亮着灯。
          emotion: angry
        - id: ch01-b42
          speaker: stranger
          text: 我看不见灯。
        - id: ch01-b43
          speaker: narrator
          text: 另一个声音属于闹鬼屋里的陌生人。一阵要命的寒意直钻进哈克心里。原来，这就是他们说的报仇。他第一个念头就是逃，可又记起道格拉斯寡妇不止一次善待过自己。他们也许正打算杀她。哈克真希望自己敢冒险去提醒她，却又明白，只要一动就可能被这两个人追上并抓住。在陌生人说完、印第安乔再次开口之前的短短一瞬，他已经想完了这一切。
        - id: ch01-b44
          speaker: injun_joe
          text: 是那片灌木挡住了你。往这边来。现在看见了吧？
        - id: ch01-b45
          speaker: stranger
          text: 看见了。她家里确实有客人。我们最好算了。
        - id: ch01-b46
          speaker: injun_joe
          text: 算了？我马上就要永远离开这里，也许再没有机会！我说过，我不要她的钱，全给你都行。可她丈夫一次次狠狠整我。他当治安法官时，因为我四处流浪，就把我关进牢里。可这还远远不算完！他让人在监狱门口拿马鞭抽我，像抽黑鬼一样，全镇的人都看着！拿马鞭抽我，你明白吗？他死了，逃过了我的手，可我要从她身上讨回这笔账。
          emotion: angry
        - id: ch01-b47
          speaker: stranger
          text: 别杀她！求你千万别这么做！
          emotion: fearful
        - id: ch01-b48
          speaker: injun_joe
          text: 杀她？谁说过要杀她？她丈夫要是还活着，我会杀了他，可我不会杀她。向女人报仇，就该毁了她的脸。割开她的鼻孔，再像给母猪做记号一样，把她的耳朵割出豁口！
          emotion: angry
        - id: ch01-b49
          speaker: stranger
          text: 我的上帝，那也太可怕了！
          emotion: fearful
        - id: ch01-b50
          speaker: injun_joe
          text: 把你的意见收起来，这样你才安全。我会把她绑在床上。她要是流血死了，那也不是我的错，我更不会为她掉眼泪。你得帮我，因为我一个人未必办得到。你敢退缩，我就杀了你。明白吗？要是杀了你，我也会把她杀掉。那样就永远没人知道是谁干的。
          emotion: angry
        - id: ch01-b51
          speaker: stranger
          text: 既然非做不可，那就动手吧。越快越好，我已经抖个不停了。
          emotion: fearful
        - id: ch01-b52
          speaker: injun_joe
          text: 她家里还有客人，你要现在动手？再这样说，我可要先怀疑你了。不行，等灯全灭了再说。我们不着急。
        - id: ch01-b53
          speaker: narrator
          text: 哈克知道，两人接下来要沉默了。那比他们说多少句杀人的话都更可怕。他屏住呼吸，小心往后退。为了把一只脚稳稳放下，他得用另一条腿支撑身体，左右摇晃，一会儿险些倒向这边，一会儿又险些倒向那边。第二步同样费力，也冒着同样的危险。接着是第三步、第四步。突然，一根细枝在脚下咔嚓折断。
        - id: ch01-b54
          speaker: narrator
          text: 哈克顿时没了呼吸，站着细听。什么动静也没有，四周的寂静完完整整，没有一丝裂缝。他庆幸得无法形容。随后，他在两堵漆树丛之间慢慢转过整个身子，小心得像一艘正在掉头的船。接着，他又快又轻地离开。走到采石场，他才觉得自己安全了，于是提起那双灵活的脚后跟，撒腿飞奔。向下，向下，他一路冲到老威尔士人的家。
        - id: ch01-b55
          speaker: narrator
          text: 哈克砰砰敲门。很快，老人和两个壮实的儿子都从窗户里探出头来。
        - id: ch01-b56
          speaker: welshman
          text: 出什么乱子了？谁在砸门？你想干什么？
        - id: ch01-b57
          speaker: huck
          text: 快让我进去！事情我全告诉你们。
          emotion: fearful
        - id: ch01-b58
          speaker: welshman
          text: 你到底是谁？
        - id: ch01-b59
          speaker: huck
          text: 我是哈克贝利·费恩。快点让我进去！
          emotion: fearful
        - id: ch01-b60
          speaker: welshman
          text: 原来是哈克贝利·费恩！这个名字恐怕敲不开多少扇门。不过孩子们，让他进来吧，看看出了什么事。
        - id: ch01-b61
          speaker: narrator
          text: 哈克刚一进门，便求他们替自己保密。
        - id: ch01-b62
          speaker: huck
          text: 求你们永远别说是我报的信。千万别说，不然我一定会被杀。可那位寡妇有几次待我很好，所以我想告诉你们。只要你们答应不说出我，我就把一切都讲出来。
          emotion: fearful
        - id: ch01-b63
          speaker: welshman
          text: 老天，这孩子准有大事要说，不然不会吓成这样！说吧，孩子，我们谁也不会泄露半个字。
        - id: ch01-b64
          speaker: narrator
          text: 三分钟后，老人和两个儿子已经全副武装上了山。他们把武器握在手里，踮着脚走进漆树丛间的小路。哈克没有继续跟随，而是藏到一块巨石后面，屏息听着。迟迟不散的寂静叫人越来越焦灼。猛然间，枪声轰然炸开，紧接着响起一声喊叫。
        - id: ch01-b65
          speaker: narrator
          text: 哈克根本没等结果，也不想知道详情。他转身蹿出去，两条腿能跑多快就跑多快，一路飞奔下山。
