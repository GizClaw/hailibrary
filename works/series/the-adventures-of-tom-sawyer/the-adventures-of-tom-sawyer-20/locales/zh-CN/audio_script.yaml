audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    becky:
      display_name: 贝琪
      tts:
        delivery: 天真敏感，倔强中带着真挚
        timbre: 清脆稚嫩
        pace: 轻快，情绪激动时稍急
        pitch: 高音
    mr_dobbins:
      display_name: 多宾斯先生
      tts:
        delivery: 严厉刻板，问话时步步紧逼
        timbre: 干涩沉重
        pace: 缓慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 波莉姨妈吻汤姆时，神情里流露出的东西，一下赶走了他的沮丧。他又变得轻松快活，动身去上学。走到草场巷口，他正巧遇见贝琪·撒切尔。汤姆的心情总会写在行动上。这一回，他毫不犹豫地跑到了贝琪面前。
        - id: ch01-b02
          speaker: tom
          text: “贝琪，我今天实在太不像话了。我真后悔。这辈子我再也不会那样对你了，真的。咱们和好吧，好不好？”
        - id: ch01-b03
          speaker: narrator
          text: 贝琪停住脚，轻蔑地望着他的脸。
        - id: ch01-b04
          speaker: becky
          text: “托马斯·索亚先生，请你只管好自己。我再也不跟你说话了。”
        - id: ch01-b05
          speaker: narrator
          text: 她一甩头，走了过去。汤姆当场愣住，连那句“谁稀罕呀，自作聪明的小姐”都没及时说出口。等他想起来，回嘴已经晚了。他什么也没说，心里却冒起了火。
        - id: ch01-b06
          speaker: narrator
          text: 汤姆阴着脸走进学校院子，恨不得贝琪是个男孩，那样他就能把她狠狠揍一顿。两人很快又碰了面。汤姆擦身而过时，甩出一句刻薄话，贝琪也毫不客气地回敬了一句。这一来，他们彻底闹翻了。
        - id: ch01-b07
          speaker: narrator
          text: 贝琪气得等不及上课，只想快点看到汤姆为那本被糟蹋的拼字课本挨打。她原本或许还想揭发阿尔弗雷德·坦普尔，可汤姆那句伤人的话，把这个念头赶得无影无踪。
        - id: ch01-b08
          speaker: narrator
          text: 可怜的贝琪还不知道，麻烦也正飞快地朝她逼近。多宾斯先生人到中年，心愿却一直没能实现。他最想当一名医生，家里太穷，只好做了乡村小学教师。
        - id: ch01-b09
          speaker: narrator
          text: 每天，没有学生背书的时候，多宾斯先生总会从讲桌里拿出一本神秘的书，埋头研读。平时那本书锁得严严实实。全校孩子都馋得要命，谁都想偷看一眼，却从来没有机会。大家纷纷猜测书里有什么，可没有两个人的说法相同，也没人能弄清答案。
        - id: ch01-b10
          speaker: narrator
          text: 贝琪从门边的讲桌旁经过，忽然发现钥匙就插在锁孔里。机会太难得了！她看看四周，屋里一个人也没有。转眼间，那本书已经到了她手里。
        - id: ch01-b11
          speaker: narrator
          text: 扉页上写着“某某教授著《解剖学》”，贝琪根本看不明白，便往后翻。她马上看到一幅印得很精美的彩色插图，画中是一个全身赤裸的人。
        - id: ch01-b12
          speaker: narrator
          text: 就在这时，一道影子落到书页上。汤姆从门口进来，一眼瞥见了那幅画。贝琪慌忙合书，偏偏把画页从中间往下撕开了一半。她赶紧把书塞回讲桌，锁上抽屉，又羞又恼，放声哭了。
        - id: ch01-b13
          speaker: becky
          text: “汤姆·索亚，你坏得不能再坏了！你偷偷走到别人身后，还偷看人家在看什么。”
          emotion: angry
        - id: ch01-b14
          speaker: tom
          text: “我哪知道你正在看东西？”
        - id: ch01-b15
          speaker: becky
          text: “你真该害臊！你肯定会去告我的密。哎呀，我怎么办？我会挨鞭子的！我在学校里从来没挨过打。”
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: 贝琪越说越气，抬起小脚重重跺了一下。
        - id: ch01-b17
          speaker: becky
          text: “好啊，你想坏就坏到底吧！有件事马上就会发生，你等着瞧！讨厌，讨厌，讨厌！”
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 她又一次大哭起来，冲出了校舍。汤姆留在原地，叫这一通责骂弄得有些发慌。过了一会儿，他才对自己嘀咕起来。
        - id: ch01-b19
          speaker: tom
          text: “女孩子真是怪得要命的傻瓜！从来没在学校挨过打？呸，挨打有什么了不起？她们就是脸皮薄，胆子小。我当然不会为了这件事找老多宾斯告密。我要跟这个小傻瓜算账，还有别的办法，用不着做得这么卑鄙。”
        - id: ch01-b20
          speaker: tom
          text: “不过，这又有什么用？老多宾斯会问是谁撕了书，谁也不会回答。接着，他就会一个一个地问下去。问到真正干这事的姑娘时，不用别人开口，他也会看出来。女孩子的脸自己就会告密，她们一点骨气都没有。贝琪准会挨打。这下她可进了死胡同，根本逃不掉。”
        - id: ch01-b21
          speaker: narrator
          text: 汤姆又把整件事琢磨了一遍，越想越觉得贝琪无路可逃。
        - id: ch01-b22
          speaker: tom
          text: “也好。她正想看我遇上这种麻烦呢。就让她自己干着急吧！”
        - id: ch01-b23
          speaker: narrator
          text: 汤姆走到外面，加入那群嬉闹的学生。几分钟后，多宾斯先生来了，学校开始上课。汤姆却无心学习。每次偷看女生那边，贝琪的脸都会让他不安。
        - id: ch01-b24
          speaker: narrator
          text: 想起两人之间发生的一切，他本来不愿可怜贝琪，却忍不住要可怜她。他也想幸灾乐祸，可怎么都高兴不起来。
        - id: ch01-b25
          speaker: narrator
          text: 不久，老师发现了拼字课本上的墨迹，汤姆便暂时只顾得上自己的麻烦。贝琪从忧愁中打起精神，认真看着事情往下发展。她知道，汤姆就算否认墨水是自己泼的，也逃不掉。事实正是如此，他越否认，情况越糟。
        - id: ch01-b26
          speaker: narrator
          text: 贝琪原以为自己会很高兴。她也努力告诉自己，她确实很高兴，可心里始终拿不准。事情到了最坏的时候，她忽然想站起来，说出阿尔弗雷德·坦普尔的名字。但她强迫自己坐着不动。
        - id: ch01-b27
          speaker: becky
          text: “他肯定会把我撕坏插图的事说出去。就算能救他的命，我也一个字都不说！”
        - id: ch01-b28
          speaker: narrator
          text: 汤姆挨了鞭子，回到座位，心里一点也没垮。他想，自己也许真在某次胡闹中碰翻了墨水，只是没有察觉。他一开始否认，是因为人人遇到这种事都会先否认。后来坚持不认，那就是原则问题了。
        - id: ch01-b29
          speaker: narrator
          text: 一个钟头慢慢过去。多宾斯先生坐在那张宝座般的椅子上打瞌睡。学生们嗡嗡读书，连空气都困倦起来。终于，老师坐直身子，打了个哈欠，打开讲桌，把手伸向那本书。他似乎拿不准是要取出来，还是把它留在原处。
        - id: ch01-b30
          speaker: narrator
          text: 大多数学生只懒洋洋地看了一眼，教室里却有两个人死死盯着老师。多宾斯先生心不在焉地摸弄一阵，还是拿出了书，坐好准备阅读。
        - id: ch01-b31
          speaker: narrator
          text: 汤姆赶紧看向贝琪。他见过无处可逃的兔子，在猎枪瞄准脑袋时露出的神情。此刻的贝琪就是那只兔子。他顿时忘记两人还在吵架。
        - id: ch01-b32
          speaker: narrator
          text: 得想办法，而且必须马上动手！偏偏事情逼得太紧，汤姆的脑子反倒僵住了。忽然，他想到了一个主意。他可以冲过去抢走书，蹿出门逃掉。可他只迟疑了一小会儿，机会就没了。老师已经翻开了书。
        - id: ch01-b33
          speaker: narrator
          text: 汤姆恨不得让刚才的机会重新回来，可是一切都太迟了。贝琪已经无路可救。多宾斯先生转过身，面对全校学生。大家一接触他的目光，便低下了头。那眼神连没做错事的人也会害怕。
        - id: ch01-b34
          speaker: narrator
          text: 教室里静了很久，足够让人从一数到十。老师正在一点点聚起怒火。终于，他开口了。
        - id: ch01-b35
          speaker: mr_dobbins
          text: “是谁撕了这本书？”
          emotion: angry
        - id: ch01-b36
          speaker: narrator
          text: 没有人出声，静得连一根针落地都听得见。老师挨个打量学生的脸，想从中找出有罪的神色。
        - id: ch01-b37
          speaker: mr_dobbins
          text: “本杰明·罗杰斯，是你撕的吗？”
        - id: ch01-b38
          speaker: narrator
          text: 本杰明否认了。教室里又静了一阵。
        - id: ch01-b39
          speaker: mr_dobbins
          text: “约瑟夫·哈珀，是你吗？”
        - id: ch01-b40
          speaker: narrator
          text: 约瑟夫也否认了。这种缓慢的盘问像一场折磨，汤姆越来越不安。老师看遍一排排男生，想了想，又转向女生。
        - id: ch01-b41
          speaker: mr_dobbins
          text: “艾米·劳伦斯？”
        - id: ch01-b42
          speaker: narrator
          text: 艾米摇了摇头。
        - id: ch01-b43
          speaker: mr_dobbins
          text: “格雷西·米勒？”
        - id: ch01-b44
          speaker: narrator
          text: 格雷西也摇了头。
        - id: ch01-b45
          speaker: mr_dobbins
          text: “苏珊·哈珀，是你做的吗？”
        - id: ch01-b46
          speaker: narrator
          text: 苏珊同样否认了。下一个就轮到贝琪·撒切尔。汤姆激动得从头抖到脚，也知道贝琪已经没有逃脱的希望。
        - id: ch01-b47
          speaker: mr_dobbins
          text: “丽贝卡·撒切尔……”
        - id: ch01-b48
          speaker: narrator
          text: 汤姆朝贝琪脸上望去。她已经吓得脸色雪白。
        - id: ch01-b49
          speaker: mr_dobbins
          text: “是你撕的……不许躲，看着我的脸。”
          emotion: angry
        - id: ch01-b50
          speaker: narrator
          text: 贝琪抬起双手，像是在求老师放过她。
        - id: ch01-b51
          speaker: mr_dobbins
          text: “这本书，是不是你撕的？”
        - id: ch01-b52
          speaker: narrator
          text: 一个念头像闪电一样穿过汤姆的脑海。他猛地站了起来。
        - id: ch01-b53
          speaker: tom
          text: “是我干的！”
        - id: ch01-b54
          speaker: narrator
          text: 全校学生都呆住了，谁也想不通汤姆为什么会做出这种不可思议的傻事。他站了一会儿，才收拢四散的心神，走上前去领罚。
        - id: ch01-b55
          speaker: narrator
          text: 可怜的贝琪望着汤姆，眼里全是惊讶、感激和崇拜。对他来说，那目光足以抵偿一百顿鞭子。想到自己做了一件了不起的事，他挨下多宾斯先生有史以来最狠的一顿打，硬是没有喊出一声。
        - id: ch01-b56
          speaker: narrator
          text: 老师还罚他放学后再留两个钟头，汤姆照样毫不在意。他知道有个人会一直等在外面，直到他的囚禁结束。那个人也绝不会觉得漫长的等待是在浪费时间。
        - id: ch01-b57
          speaker: narrator
          text: 当天晚上，汤姆躺在床上，盘算着怎样报复阿尔弗雷德·坦普尔。贝琪又羞愧又后悔，已经把一切都告诉了他，连自己曾经背叛他的事也没有漏掉。
        - id: ch01-b58
          speaker: narrator
          text: 可没过多久，报仇的念头就给更愉快的遐想让了路。汤姆终于睡着了，贝琪最后说的那句话，还像梦一样在他耳边回响。
        - id: ch01-b59
          speaker: becky
          text: “汤姆，你怎么能这么高尚呀！”
