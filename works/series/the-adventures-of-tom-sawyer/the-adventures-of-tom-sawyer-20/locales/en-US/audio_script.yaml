  chapters:
    - id: ch01
      title: CHAPTER XX
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There was something in the way Aunt Polly kissed Tom that swept his gloom away. He felt cheerful again as he headed for school. At the entrance to Meadow Lane, he happened to meet Becky Thatcher. Tom always acted according to his mood, and this time he ran straight to her without a second thought.
        - id: ch01-b02
          speaker: tom
          text: "Becky, I was awful mean today, and I'm truly sorry. I'll never act that way again as long as I live. Please, can't we make up?"
        - id: ch01-b03
          speaker: narrator
          text: Becky stopped and gave him a scornful look.
        - id: ch01-b04
          speaker: becky
          text: "You can keep to yourself, Mr. Thomas Sawyer. I'm never speaking to you again."
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: She tossed her head and walked on. Tom was too stunned even to call after her, and by the time he thought of saying, “Who cares, Miss Smarty?” the moment had passed. He said nothing, but he was furious. He dragged himself into the schoolyard, wishing Becky were a boy so he could thrash her. When they crossed paths again, he threw a cutting remark at her. She fired one right back. Now the break between them was complete.
        - id: ch01-b06
          speaker: narrator
          text: Becky was so angry that she could hardly wait for school to begin. She wanted to see Tom whipped for the damaged spelling book. Any thought she might have had of exposing Alfred Temple vanished after Tom's insult.
        - id: ch01-b07
          speaker: narrator
          text: The poor girl had no idea that trouble was rushing toward her too. Their teacher, Mr. Dobbins, was a middle-aged man with a disappointed dream. More than anything, he had wanted to be a doctor. Poverty had left him a village schoolmaster instead.
        - id: ch01-b08
          speaker: narrator
          text: Every day, when no class was reciting, he took a mysterious book from his desk and studied it. He always kept it locked away. Every child in school was desperate for one look, but no chance ever came. They all had guesses about what the book contained, and no two guesses matched.
        - id: ch01-b09
          speaker: narrator
          text: As Becky passed the teacher's desk near the door, she saw the key sitting in the lock. This was the chance everyone had longed for. She looked around and found herself alone. A moment later, the book was in her hands. The title page said it was an anatomy by some professor, which meant nothing to her, so she turned the pages to find out what was inside.
        - id: ch01-b10
          speaker: narrator
          text: Almost at once, she found a beautifully colored picture of a naked human figure. Just then, a shadow crossed the page. Tom Sawyer had stepped through the doorway and caught sight of it. Becky snatched the book shut, but the picture tore halfway down the middle. She shoved the book into the desk, turned the key, and burst into tears from shame and frustration.
        - id: ch01-b11
          speaker: becky
          text: "Tom Sawyer, you're as mean as can be! You sneaked up and looked at what I was looking at."
          emotion: angry
        - id: ch01-b12
          speaker: tom
          text: "How was I supposed to know you were looking at anything?"
        - id: ch01-b13
          speaker: becky
          text: "You ought to be ashamed! I know you'll tell on me. Oh, what am I going to do? They'll whip me, and I've never been whipped at school!"
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: She stamped one little foot.
        - id: ch01-b15
          speaker: becky
          text: "Go ahead and be mean! I know what's going to happen to you. Just wait, and you'll see! I hate you, hate you, hate you!"
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: She rushed out of the schoolhouse, crying harder than ever. Tom stood there, shaken by the attack.
        - id: ch01-b17
          speaker: tom
          text: "Girls sure are strange fools. She's never been whipped at school? Shucks, what's one whipping? That's just like a girl. They're so touchy and scared of everything. I won't tell old Dobbins what she did. There are other ways to get even that aren't so low. But it won't matter. He'll ask who tore his book, and nobody will answer. Then he'll question everyone, one by one. When he reaches the right girl, he'll know just by looking at her. Girls' faces always give them away. They haven't got any backbone. She'll be whipped, and there isn't any way out for her."
        - id: ch01-b18
          speaker: narrator
          text: Tom thought it over a little longer.
        - id: ch01-b19
          speaker: tom
          text: "Well, all right. She'd enjoy seeing me trapped like that. Let her worry about it."
        - id: ch01-b20
          speaker: narrator
          text: Tom went outside and joined the noisy crowd of students. A few minutes later, Mr. Dobbins arrived and school began. Tom could not pay much attention to his lessons. Whenever he glanced toward the girls' side of the room, Becky's face bothered him. After all she had done, he did not want to pity her. Still, he could hardly stop himself, and he could not feel properly pleased about her trouble.
        - id: ch01-b21
          speaker: narrator
          text: Then someone discovered the damage to the spelling book, and Tom had troubles of his own for a while. Becky shook off the misery that had left her dull and listless, and she watched closely. She knew Tom could not escape by denying that he had spilled the ink himself, and she was right. His denial only made matters worse. Becky thought she ought to enjoy that. She tried hard to convince herself that she did, but she was not sure at all.
        - id: ch01-b22
          speaker: narrator
          text: When things became serious, she nearly stood up and named Alfred Temple. She forced herself to stay seated instead.
        - id: ch01-b23
          speaker: becky
          text: "He'd tell about me tearing the picture. I wouldn't say one word, not even to save his life."
        - id: ch01-b24
          speaker: narrator
          text: Tom took his whipping and returned to his seat without feeling crushed. For all he knew, he might have knocked over the ink himself during one of his wild games. He had denied it partly for the sake of appearances and partly because denying such things was the usual custom. Once he began, he stuck to the denial out of principle.
        - id: ch01-b25
          speaker: narrator
          text: A whole hour slowly passed. Mr. Dobbins nodded on his raised seat while the room grew drowsy with the steady hum of study. At last he straightened up, yawned, unlocked his desk, and reached for his private book. For a moment, he seemed unable to decide whether to take it out or leave it there. Most of the students barely looked up, but Tom and Becky watched every movement with intense attention.
        - id: ch01-b26
          speaker: narrator
          text: Mr. Dobbins handled the book absentmindedly, then pulled it out and settled down to read. Tom looked at Becky. She reminded him of a helpless rabbit with a gun aimed straight at its head. His quarrel with her vanished at once. He had to do something, and he had to do it now. But the danger was so close that he could not think.
        - id: ch01-b27
          speaker: narrator
          text: Then an idea came. He would grab the book, dash through the door, and run. But his courage wavered for one tiny moment, and the chance was gone. Mr. Dobbins opened the book. Tom would have given anything to have that wasted moment back again. It was too late now. Nothing could save Becky.
        - id: ch01-b28
          speaker: narrator
          text: Mr. Dobbins turned to face the school. Every student lowered their eyes. Even the innocent children were frightened by his stare. He let the silence stretch while his anger gathered.
        - id: ch01-b29
          speaker: mr_dobbins
          text: "Who tore this book?"
          emotion: angry
        - id: ch01-b30
          speaker: narrator
          text: No one made a sound. A falling pin could have been heard. Mr. Dobbins searched one face after another for guilt.
        - id: ch01-b31
          speaker: mr_dobbins
          text: "Benjamin Rogers, was it you?"
        - id: ch01-b32
          speaker: narrator
          text: Benjamin denied it. Mr. Dobbins paused again.
        - id: ch01-b33
          speaker: mr_dobbins
          text: "Joseph Harper, did you tear it?"
        - id: ch01-b34
          speaker: narrator
          text: Joseph denied it too. As the questioning dragged on, Tom grew more and more uneasy. Mr. Dobbins studied the rows of boys, waited, and then turned toward the girls.
        - id: ch01-b35
          speaker: mr_dobbins
          text: "Amy Lawrence?"
        - id: ch01-b36
          speaker: narrator
          text: Amy shook her head.
        - id: ch01-b37
          speaker: mr_dobbins
          text: "Gracie Miller?"
        - id: ch01-b38
          speaker: narrator
          text: Gracie gave the same answer.
        - id: ch01-b39
          speaker: mr_dobbins
          text: "Susan Harper, did you do it?"
        - id: ch01-b40
          speaker: narrator
          text: Susan said no. Becky Thatcher was next. Tom trembled from head to foot. The situation seemed hopeless.
        - id: ch01-b41
          speaker: mr_dobbins
          text: "Rebecca Thatcher, did you tear... No, look me in the face. Did you tear this book?"
          emotion: angry
        - id: ch01-b42
          speaker: narrator
          text: Tom looked at Becky. Her face was white with terror, and she raised her hands as if begging for mercy. Then a thought flashed through Tom's mind like lightning. He sprang to his feet.
        - id: ch01-b43
          speaker: tom
          text: "I did it!"
        - id: ch01-b44
          speaker: narrator
          text: The whole school stared in confusion. No one could understand such unbelievable foolishness. Tom stood still for a moment, trying to collect his scattered thoughts after that sudden decision. Then he stepped forward to be punished. From poor Becky's eyes came such surprise, gratitude, and adoration that they seemed like reward enough for a hundred whippings.
        - id: ch01-b45
          speaker: narrator
          text: The glory of what he had done gave Tom courage. He endured without one cry the most merciless whipping Mr. Dobbins had ever given a student. He was just as unconcerned when the teacher added another punishment and ordered him to remain for two full hours after school ended. Tom knew who would wait outside until his captivity was over, and she would not count the long, tedious wait as time wasted.
        - id: ch01-b46
          speaker: narrator
          text: That night in bed, Tom planned his revenge against Alfred Temple. Becky had told him the whole story with shame and regret. She had not even left out her own act of treachery. Before long, though, Tom's wish for revenge gave way to much happier thoughts. At last he drifted to sleep with Becky's final words lingering dreamily in his ear.
        - id: ch01-b47
          speaker: becky
          text: "Tom, how could you ever be so noble?"
          emotion: surprised
