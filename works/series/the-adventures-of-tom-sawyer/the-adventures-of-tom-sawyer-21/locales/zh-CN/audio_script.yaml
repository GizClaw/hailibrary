audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    little_boy:
      display_name: 小男孩
      tts:
        delivery: 害羞拘谨，努力背得郑重
        timbre: 稚嫩单薄
        pace: 稍慢，偶有停顿
        pitch: 高音
    little_girl:
      display_name: 小姑娘
      tts:
        delivery: 腼腆认真，带轻微含混的童声
        timbre: 细软稚嫩
        pace: 缓慢
        pitch: 高音
    essay_reader:
      display_name: 作文朗读者
      tts:
        delivery: 矫饰投入，刻意讲究抑扬顿挫
        timbre: 清亮柔美
        pace: 从容
        pitch: 中高音
    poem_reader:
      display_name: 诗歌朗读者
      tts:
        delivery: 忧郁多情，郑重吟诵
        timbre: 纤细低柔
        pace: 舒缓
        pitch: 中高音
    vision_reader:
      display_name: 幻象朗读者
      tts:
        delivery: 悲剧化而庄严，语气深沉
        timbre: 浓郁清晰
        pace: 缓慢
        pitch: 中音
    audience_woman_1:
      display_name: 女听众甲
      tts:
        delivery: 压低声音，满心赞赏
        timbre: 柔和明亮
        pace: 轻快
        pitch: 中高音
    audience_woman_2:
      display_name: 女听众乙
      tts:
        delivery: 压低声音，热切赞叹
        timbre: 清脆
        pace: 轻快
        pitch: 高音
    audience_woman_3:
      display_name: 女听众丙
      tts:
        delivery: 压低声音，深信不疑
        timbre: 温和
        pace: 平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 严师与密谋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 假期快到了。多宾斯先生本来就严厉，如今为了让学校在“考试”那天风光露脸，越发苛刻起来。教鞭和戒尺几乎没有闲着，年幼的学生尤其倒霉。只有个头最大的男生，还有十八岁、二十岁的年轻姑娘，才不会挨打。
        - id: ch01-b02
          speaker: narrator
          text: 老师假发下面的头虽然秃得锃亮，人却刚到中年，胳膊上的力气半点不弱。考试越近，他越专横，仿佛连学生最小的过错也能给他一个痛痛快快惩罚人的理由。小男孩们白天又怕又苦，夜里就忙着筹划报仇。
        - id: ch01-b03
          speaker: narrator
          text: 他们逮着机会便捉弄老师，可老师总能压过他们一头。孩子们每次刚尝到胜利的甜头，随后那场声势浩大的惩罚，就会把他们打得一败涂地。
        - id: ch01-b04
          speaker: narrator
          text: 最后，男孩们一起想出一条必胜的妙计。他们拉油漆匠的儿子入伙，把计划全告诉了他。那孩子乐意极了。老师寄宿在他家，早就做了不少叫他怀恨的事。
        - id: ch01-b05
          speaker: narrator
          text: 再过几天，老师的妻子就要去乡下探亲，谁也妨碍不了他们。每逢大场面，老师总爱先喝得醉醺醺的。油漆匠的儿子答应，考试当晚，等校长醉到火候、坐在椅子里睡着，他就把那件事办妥。然后，他们只需准时叫醒老师，把他匆匆送去学校。
    - id: ch02
      title: 考试晚会
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那个有趣的夜晚终于来了。八点钟，校舍里灯火通明，四处挂着枝叶和鲜花编成的花环。老师高高坐在台上的大椅子里，黑板就在身后。他脸上已经有了七八分醉意。
        - id: ch02-b02
          speaker: narrator
          text: 老师两边各有三排长凳，面前还有六排，坐满镇上的头面人物和学生家长。左边另搭了一座大台子，参加表演的学生全在那里。小男孩洗得干干净净，衣服也穿得周周正正，浑身难受得不得了。大男孩一排排坐着，个个笨手笨脚。
        - id: ch02-b03
          speaker: narrator
          text: 女孩和年轻姑娘穿着细麻纱、薄棉布衣裙，堆在一起像一片雪。她们露着胳膊，自己也明明白白地惦记着这件事。身上戴着祖母留下的老首饰，系着粉色或蓝色缎带，头发里插着花。其余座位也被不表演的学生塞满了。
        - id: ch02-b04
          speaker: narrator
          text: 表演开始。一个很小的男孩站起来，羞羞答答地背诵。
        - id: ch02-b05
          speaker: little_boy
          text: “像我这么小的年纪，诸位想必不曾料到，我也敢登台当众演讲……”
        - id: ch02-b06
          speaker: narrator
          text: 他一边背，一边做着精确得叫人难受、又一抽一顿的手势，活像一架出了点毛病的机器。他怕得要命，好歹平安背完了。最后，他照着教过的样子鞠了一躬，赢得一阵响亮的掌声。
        - id: ch02-b07
          speaker: narrator
          text: 接着，一个害羞的小姑娘含混不清地念起儿歌。
        - id: ch02-b08
          speaker: little_girl
          text: “玛丽有只小羊羔……”
        - id: ch02-b09
          speaker: narrator
          text: 她行了一个叫人忍不住同情的屈膝礼，领到该得的掌声，红着脸快活地坐下了。
        - id: ch02-b10
          speaker: narrator
          text: 汤姆·索亚神气十足地走上台，自信得不得了。他皱出一脸漂亮的怒容，手臂挥得发狂，慷慨激昂地背起那篇怎么背也背不灭的名演说。
        - id: ch02-b11
          speaker: tom
          text: “不自由，毋宁死！”
        - id: ch02-b12
          speaker: narrator
          text: 可他背到一半，突然卡住了。可怕的怯场抓住了他，两条腿直打颤，喉咙也几乎堵死。全场都同情他，可全场偏偏鸦雀无声。这份沉默比同情更难熬。老师又皱起眉，汤姆彻底完了。他挣扎片刻，只得认输退下。有人勉强拍了几下手，掌声才响就没了。
        - id: ch02-b13
          speaker: narrator
          text: 后面又有人背《男孩立在燃烧的甲板上》《亚述人如狼扑来》，还有别的演说名篇。朗读练习、拼字比赛也接连上场。人数少得可怜的拉丁文班，倒把功课背得很体面。
        - id: ch02-b14
          speaker: narrator
          text: 现在终于轮到晚会的重头戏，年轻姑娘们的原创“作文”。她们一个接一个走到台前，先清清嗓子，再举起用漂亮缎带扎好的手稿，卖力读出精心练过的“表情”和标点。
        - id: ch02-b15
          speaker: narrator
          text: 题目都是老一套。她们的母亲、祖母，恐怕连十字军东征时代的女性祖先，也曾在相同场合把这些题目讲得光彩照人。有《友谊》《往日的回忆》《历史中的宗教》《梦境》《教养的益处》《政治体制的比较与对照》，还有《忧郁》《孝爱》《心灵的渴望》等等。
        - id: ch02-b16
          speaker: narrator
          text: 这些文章也有一套老特色。作者们把忧郁精心娇养起来，又大把挥霍“华丽辞藻”，还把心爱的词句硬拖进来，反复使用，直到彻底用烂。最惹眼、也最糟糕的是，每篇末尾都拖着一番没完没了的说教，像摇着一条残废的尾巴。不管前面写的是友谊、梦境还是政治，最后都逃不过它。
        - id: ch02-b17
          speaker: narrator
          text: 不论题目是什么，她们都要绞尽脑汁，把它扭成一颗讲道德、重宗教的心可以得到教益的样子。那些说教虚伪得耀眼，却始终没能从学校里消失。直到今天也没有。只要世界还在，大概就永远不会消失。
        - id: ch02-b18
          speaker: narrator
          text: 全国没有哪所学校例外，年轻姑娘们仿佛都觉得，作文末尾非讲一通道理不可。最轻浮、最不信教的那个姑娘，写出的说教往往最长，也最虔诚得不依不饶。好啦，这话说得够多了。朴素的真相总不招人喜欢。
    - id: ch03
      title: 华丽文章
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 还是回到“考试”吧。第一篇作文题为《那么，这就是人生吗？》读者大概还能忍受其中一段。
        - id: ch03-b02
          speaker: essay_reader
          text: “在平凡的人生道路上，青春的心灵遥望那期待已久的欢宴时，会涌起何等欢欣的情感啊！想象忙着勾画玫瑰色的欢乐图景。那位沉醉于时尚繁华的佳人，仿佛看见自己站在欢庆的人群里，成了万目所瞩之人。她披着雪白长袍，婀娜的身影在舞步间回旋。整个聚会里，她的眼睛最亮，脚步最轻。”
        - id: ch03-b03
          speaker: essay_reader
          text: “甜美的幻想让时光飞逝，她终于踏进梦中绚烂的极乐世界。着了魔的眼睛看出去，一切都像仙境，新出现的每一幕都比上一幕迷人。可是渐渐地，她发现美丽外表下面只有虚空。过去叫她心醉的奉承，如今听来刺耳。舞厅不再迷人。健康消损，心也苦了，她只得转身离开，终于明白，尘世的欢乐永远填不满灵魂的渴望！”
        - id: ch03-b04
          speaker: narrator
          text: 后面还有一大篇类似的话。朗读时，人群里不时发出满意的嗡嗡声，还夹着一句句压低的赞叹。
        - id: ch03-b05
          speakers: [audience_woman_1, audience_woman_2, audience_woman_3]
          ensemble: chorus
          text: “多甜美呀！多有文采呀！说得真对！”
        - id: ch03-b06
          speaker: narrator
          text: 等这篇东西以一番格外折磨人的说教收尾，大家立刻热烈鼓掌。
        - id: ch03-b07
          speaker: narrator
          text: 接下来，一个纤细忧郁的姑娘站起来。药丸和消化不良送给她一张“惹人遐思”的苍白面孔。她开始朗读一首诗，题目叫《一个密苏里少女告别亚拉巴马》。听其中两节就够了。
        - id: ch03-b08
          speaker: poem_reader
          text: “亚拉巴马，再会！我深深爱着你，如今却要暂时离开你的怀抱。想起你，悲伤涨满我心里，滚烫的回忆涌上眉梢。我曾走过你开满鲜花的树林，曾在塔拉普萨河边漫游读书，听过塔拉西的激流争战，也在库萨河畔追求曙光女神的晨晖。”
        - id: ch03-b09
          speaker: poem_reader
          text: “我不以一颗过度饱满的心为耻，也不羞于含泪回望。我离开的不是陌生乡土，留下叹息的也不是异乡。这片土地曾欢迎我，给过我家园。如今山谷远去，尖塔消失。亲爱的亚拉巴马，若有一天我对你冷淡，那定是我的眼、我的心、我的‘泰特’全都冷却！”
        - id: ch03-b10
          speaker: narrator
          text: 在场的人几乎没有谁知道“泰特”是什么意思，可他们仍然觉得这首诗好极了。
        - id: ch03-b11
          speaker: narrator
          text: 随后，一位皮肤黝黑、眼睛乌黑、头发也乌黑的年轻姑娘登场。她意味深长地停了一会儿，摆出悲剧神情，以缓慢庄严的声调，念起《幻象》。
        - id: ch03-b12
          speaker: vision_reader
          text: “夜，黑暗而暴烈。高天的宝座周围，没有一颗星星颤动。沉重的雷却不断震撼耳膜。可怕的闪电怀着怒意，在天堂乌云密布的宫室里纵情嬉戏，仿佛嘲笑大名鼎鼎的富兰克林，嘲笑他为了制服闪电的恐怖而施展的力量！狂风也一齐冲出神秘的家园，到处咆哮，像是要让这番景象变得更加狂野。”
        - id: ch03-b13
          speaker: vision_reader
          text: “在这个黑暗凄凉的时刻，我的灵魂渴求人间的同情。可来到我身边的，却是我最亲爱的朋友，我的谋士、安慰与向导，是我悲伤时的喜悦，也是欢乐中的第二重幸福。”
        - id: ch03-b14
          speaker: vision_reader
          text: “她翩然而来，像浪漫而年轻的心在幻想伊甸园的阳光小径上画出的光明精灵。她是美的女王，除了自己超凡的美貌，再没有别的装饰。她脚步轻柔，没有发出一点声音。若不是那亲切的触碰传来魔法般的震颤，她便会像别的不惹眼的美好事物一样，无人察觉，也无人寻找，悄悄滑走。”
        - id: ch03-b15
          speaker: vision_reader
          text: “奇异的哀愁停在她脸上，仿佛十二月长袍上结冰的泪。她指着屋外争斗的种种元素，命我凝神观看眼前的两个生灵。”
        - id: ch03-b16
          speaker: narrator
          text: 这场噩梦足足占了十页手稿。最后，它又拖出一篇说教，把所有非长老会教徒得救的希望毁得一干二净。正因如此，它拿到了一等奖。大家都说这是当晚最出色的作品。镇长颁奖时发表了一通热情洋溢的演讲，声称这是他一生听过最“有文采”的东西，就连丹尼尔·韦伯斯特本人也尽可以为它自豪。
        - id: ch03-b17
          speaker: narrator
          text: 顺便说一句，把“美艳”用得过了头、又把人生经历叫作“生命之页”的作文，篇数也跟往年一样多。
    - id: ch04
      title: 金色秃头
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这时，老师已经醉得快要和蔼可亲了。他推开椅子，背对观众，在黑板上画美洲地图，准备考地理班。可那只手摇摇晃晃，把地图画得惨不忍睹。校舍里立刻荡开一阵压低的笑声。
        - id: ch04-b02
          speaker: narrator
          text: 老师以为大家在笑那张地图，便拿起板擦，擦掉几根线重新画。地图反而比原先更加走样，笑声也更响。他把全部心思都放到黑板上，决意不向嘲笑低头。他感觉所有人的眼睛都牢牢盯着自己，还以为地图终于渐渐有了模样。可笑声一直没停，反倒越来越明显，越来越大。那阵笑当然有它越来越响的道理。
        - id: ch04-b03
          speaker: narrator
          text: 大家当然该笑。校舍上面有间阁楼，老师头顶正开着一扇小天窗。一只猫从那里被慢慢吊下来。绳子拴着它的后腰，脑袋和嘴裹在破布里，免得它叫。
        - id: ch04-b04
          speaker: narrator
          text: 猫往下降时，便向上蜷起身子，伸爪乱抓绳子。荡下去时，它又拼命去抓摸不到的空气。笑声越来越高。它离全神贯注的老师只剩六英寸了。向下，向下，再低一点。
        - id: ch04-b05
          speaker: narrator
          text: 猫绝望地伸出爪子，一把抓住老师的假发，牢牢钩住。转眼间，它就被拽回阁楼，爪上还挂着战利品。假发一离开，老师那颗光秃秃的脑袋便完全露了出来，在满屋观众眼前，顿时向四面八方放出灿烂的光芒。原来，油漆匠的儿子早把它镀成了金色！
        - id: ch04-b06
          speaker: narrator
          text: 晚会就此散场。男孩们报了仇。假期来临了。
        - id: ch04-b07
          speaker: narrator
          text: 本章引用的那些假托“作文”，其实一字未改地取自《一位西部女士的散文与诗歌》。它们完完全全符合女学生作文的套路，所以比任何单纯的模仿都传神得多。
