  chapters:
    - id: ch01
      title: CHAPTER XXI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Vacation was getting close. The schoolmaster had always been severe, but now he became harsher and more demanding than ever. He wanted his school to look its best on Examination Day. His rod and flat ruler were hardly ever still, at least when the smaller pupils were near. Only the biggest boys and the young ladies of eighteen or twenty escaped a whipping. Mr. Dobbins struck hard, too. Beneath his wig, his head was perfectly bald and shiny, but he was only middle-aged, and there was nothing weak about his arm.
        - id: ch01-b02
          speaker: narrator
          text: As the great day drew closer, every bit of tyranny in him came out. He seemed to enjoy punishing the smallest mistake. The little boys suffered in terror all day and plotted revenge all night. They never missed a chance to play some trick on their master, but he always came out ahead. After each small victory, his punishment was so grand and crushing that the boys left the field much worse off than before.
        - id: ch01-b03
          speaker: narrator
          text: At last, they joined forces and found a plan that promised a splendid victory. They swore the signpainter's boy to secrecy, explained the scheme, and asked him to help. He was delighted. Mr. Dobbins boarded with his family and had given him plenty of reasons to hate him. The schoolmaster's wife would soon be visiting the country, so she would not get in the way. Mr. Dobbins always prepared for important occasions by drinking until he was fairly muddled. The signpainter's boy promised that, once the master had reached the right condition on Examination Evening, he would take care of everything while the man slept in his chair. Then he would wake him at just the right time and rush him off to school.
        - id: ch01-b04
          speaker: narrator
          text: At last, the interesting evening arrived. By eight o'clock, the schoolhouse shone with light. Wreaths and long loops of leaves and flowers decorated the room. The master sat like a king in his great chair on a raised platform, with the blackboard behind him. He already looked pleasantly softened by drink.
        - id: ch01-b05
          speaker: narrator
          text: Three rows of benches stood on either side of him and six more faced him. They held the important people of the town and the pupils' parents. Behind the citizens on his left was a broad temporary platform for the students who would perform. There sat rows of small boys, scrubbed and dressed until they could hardly bear it, then rows of awkward big boys. Beyond them were banks of girls and young ladies in lawn and muslin. They were very aware of their bare arms, their grandmothers' old jewelry, their pink and blue ribbons, and the flowers in their hair. Every other part of the schoolhouse was packed with students who had no part in the program.
        - id: ch01-b06
          speaker: narrator
          text: The exercises began. A very little boy stood up, horribly frightened. With stiff, jerking gestures, as if he were a machine that had gone slightly wrong, he began his piece.
        - id: ch01-b07
          speaker: little_boy
          text: "You'd hardly expect someone my age to speak in public on a stage..."
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: Somehow, he made it safely to the end. He gave a carefully manufactured bow, and the audience rewarded him with a fine round of applause.
        - id: ch01-b09
          speaker: narrator
          text: Next, a shy little girl stood and lisped her poem.
        - id: ch01-b10
          speaker: little_girl
          text: "Mary had a little lamb..."
        - id: ch01-b11
          speaker: narrator
          text: She made a curtsy that begged for everyone's sympathy, received the applause she had earned, and sat down, flushed and happy.
        - id: ch01-b12
          speaker: narrator
          text: Then Tom Sawyer stepped forward, overflowing with confidence. He launched into the speech that never seemed to wear out, with splendid fury and wild gestures.
        - id: ch01-b13
          speaker: tom
          text: "Give me liberty, or give me death!"
        - id: ch01-b14
          speaker: narrator
          text: But halfway through, he fell apart. Terrible stage fright seized him. His legs shook, and he could scarcely breathe. The whole room plainly felt sorry for him, but everyone was silent, and that silence was worse than their sympathy. The master frowned. That finished the disaster. Tom struggled for a little longer, then left the stage completely defeated. A weak attempt at applause began and quickly died.
        - id: ch01-b15
          speaker: narrator
          text: More famous recitations followed. There was “The Boy Stood on the Burning Deck,” then “The Assyrian Came Down,” and other treasures meant to be thundered from a stage. After that came reading exercises and a spelling contest. The small Latin class recited with honor.
        - id: ch01-b16
          speaker: narrator
          text: Now it was time for the finest part of the evening, original compositions by the young ladies. One after another, each writer walked to the front of the platform, cleared her throat, and raised a manuscript tied with a delicate ribbon. Then she read with great effort, carefully expressing every sentence and every mark of punctuation.
        - id: ch01-b17
          speaker: narrator
          text: Their subjects were the same ones their mothers had used, and their grandmothers before them, and perhaps every woman in the family since the Crusades. There was Friendship, Memories of Other Days, Religion in History, Dream Land, the Advantages of Culture, different forms of government compared against one another, Melancholy, Filial Love, Heart Longings, and plenty more.
        - id: ch01-b18
          speaker: narrator
          text: These compositions usually had three things in common. First came a carefully tended sadness. Then came floods of fancy language. Favorite words and phrases were dragged in again and again until they were worn out. Worst of all was the sermon that limped behind every single piece and wagged its crippled tail at the end.
        - id: ch01-b19
          speaker: narrator
          text: Whatever the subject, the writer twisted it until she could show it to a moral and religious mind for its improvement. The sermons were clearly insincere, but that never drove the fashion out of school, and it still has not. Perhaps it never will. In every school in the land, young ladies feel that their compositions must end with a sermon. The lightest and least religious girl generally writes the longest and most mercilessly pious one. But that is enough. Plain truth does not taste very pleasant.
        - id: ch01-b20
          speaker: narrator
          text: Let us go back to the Examination. The first composition was called “Is This, Then, Life?” Here is part of what the young lady read.
        - id: ch01-b21
          speaker: first_young_lady
          text: "As young people go through ordinary life, how joyfully they look ahead to some coming celebration! Imagination paints rosy pictures of happiness. A fashionable young woman sees herself at the center of the festive crowd, watched by everyone. Dressed in snowy white, her graceful figure turns through the happy dance. No eye shines brighter, and no step in the whole gathering is lighter than hers."
        - id: ch01-b22
          speaker: first_young_lady
          text: "Time passes quickly in these delicious dreams. At last, the welcome hour arrives, and she enters the paradise she has imagined. Everything looks like a fairy vision. Each new scene charms her more than the last. But soon she discovers that all this lovely appearance is empty. The praise that once delighted her now sounds harsh. The ballroom has lost its charm. Her health is ruined and her heart has grown bitter, so she turns away at last, convinced that earthly pleasures can never satisfy the longings of the soul!"
        - id: ch01-b23
          speaker: narrator
          text: And on it went. From time to time, a pleased murmur passed through the room, mixed with admiring whispers.
        - id: ch01-b24
          speaker: audience_woman_1
          text: "Oh, how sweet!"
        - id: ch01-b25
          speaker: audience_woman_2
          text: "How beautifully she speaks!"
        - id: ch01-b26
          speaker: audience_woman_3
          text: "Every word is true."
        - id: ch01-b27
          speaker: narrator
          text: When the composition finally closed with an especially painful sermon, the applause was enthusiastic.
        - id: ch01-b28
          speaker: narrator
          text: Then a thin, melancholy girl stood up. Her face had the interesting paleness produced by pills and indigestion. She began to read a poem. Two stanzas will be enough.
        - id: ch01-b29
          speaker: melancholy_girl
          text: "A Missouri Maiden's Farewell to Alabama. Alabama, goodbye! I love you well, though I must leave you for a while. Sad thoughts of you fill my heart, and burning memories crowd my brow. I have wandered through your flowering woods. I have roamed and read beside Tallapoosa's stream. I have heard Tallassee's battling floods and welcomed dawn beside the Coosa."
        - id: ch01-b30
          speaker: melancholy_girl
          text: "I am not ashamed that my heart is overflowing, nor do I blush to turn my tearful eyes behind me. I do not leave a foreign land, and these sighs are not for strangers. I found welcome and a home within this state. Now I leave its valleys, and its towers fade far behind. My eyes, my heart, and my head must all grow cold before they turn cold toward you, dear Alabama!"
        - id: ch01-b31
          speaker: narrator
          text: Hardly anyone there knew what the poem's grand French word for “head” meant. Even so, everybody found the poem very satisfactory.
        - id: ch01-b32
          speaker: narrator
          text: A dark-complexioned young lady with black eyes and black hair came next. She paused for effect, arranged her face into a tragic expression, and began in a slow and solemn voice. Her composition was called “A Vision.”
        - id: ch01-b33
          speaker: dark_haired_young_lady
          text: "The night was dark and stormy. Not one star trembled around the throne above. The deep voice of heavy thunder sounded again and again, while terrible lightning raged angrily through heaven's cloudy rooms, as though it scorned the power that the famous Franklin held over it. Even the wild winds rushed together from their mysterious homes. They roared around, helping to make the scene still wilder."
        - id: ch01-b34
          speaker: dark_haired_young_lady
          text: "In that dark and dreadful hour, my spirit longed for human sympathy. Then my dearest friend came to my side. She was my counselor, my comforter and guide, my joy in grief, and my second happiness in joy."
        - id: ch01-b35
          speaker: dark_haired_young_lady
          text: "She moved like one of those bright creatures that the young and romantic picture in the sunny paths of imagination's Eden. She was a queen of beauty, wearing no ornament but her own surpassing loveliness. Her step was so soft that it made no sound. Without the magical thrill of her gentle touch, she might have glided away unseen and unsought, like other quiet beauties. A strange sorrow rested on her face like frozen tears on December's robe. She pointed toward the warring storm outside and told me to study the two beings before us."
        - id: ch01-b36
          speaker: narrator
          text: This nightmare filled about ten pages. It ended with a sermon that destroyed all hope for anyone who was not a Presbyterian, and it won first prize. Everyone considered it the finest work of the evening. The village mayor presented the prize and delivered a warm speech.
        - id: ch01-b37
          speaker: mayor
          text: "This is by far the most eloquent piece I have ever heard. Daniel Webster himself would be proud to have written it."
        - id: ch01-b38
          speaker: narrator
          text: It is also worth mentioning that the usual number of compositions had lovingly worn out the word “beauteous” and called human experience “life's page.”
        - id: ch01-b39
          speaker: narrator
          text: By now, the master was so softened by drink that he was almost good-natured. He moved his chair aside and turned his back to the audience. To test the geography class, he began drawing a map of America on the blackboard. His hand was unsteady, and the map came out badly. A muffled giggle moved through the schoolhouse.
        - id: ch01-b40
          speaker: narrator
          text: Mr. Dobbins understood what was wrong and tried to fix it. He erased some lines and drew them again, but that only made the map more misshapen. The laughter became easier to hear. Now he gave the map his complete attention, determined not to let the amusement defeat him. He felt every eye on his back. He believed the drawing was improving, yet the giggles went on and grew louder.
        - id: ch01-b41
          speaker: narrator
          text: There was a good reason. A trapdoor in the ceiling opened into the attic above him. Through it, a cat was slowly lowered on a string tied around her hindquarters. A cloth had been wrapped around her head and jaws so she could not cry out. As she came down, she bent upward and clawed at the string. Then she swung below it and clawed desperately at the empty air.
        - id: ch01-b42
          speaker: narrator
          text: The laughter rose and rose. The cat came within six inches of the absorbed schoolmaster's head. Down she went, then a little farther. Her frantic claws caught his wig. She clung to it and was jerked back into the attic in an instant, carrying her prize with her.
        - id: ch01-b43
          speaker: narrator
          text: How the light blazed from the master's bald head! The signpainter's boy had covered it in gold.
        - id: ch01-b44
          speaker: narrator
          text: That ended the meeting. The boys had their revenge. Vacation had begun.
        - id: ch01-b45
          speaker: narrator
          text: One final note. The compositions quoted in this chapter were taken exactly from a book called “Prose and Poetry, by a Western Lady.” They fit the schoolgirl pattern so perfectly that no imitation could have been better.
