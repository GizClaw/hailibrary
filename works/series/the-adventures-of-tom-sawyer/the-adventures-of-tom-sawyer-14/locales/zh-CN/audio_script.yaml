audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    joe:
      display_name: 乔
      tts:
        delivery: 认真热烈，带着孩子气的悲壮和兴奋
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，语气粗朴而自在
        timbre: 微哑稚嫩
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 林中的清晨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 早晨，汤姆醒了。他一时不知道自己在哪儿，坐起来揉揉眼睛，四下一看，才全想起来。天刚蒙蒙亮，清凉的树林静得很深，透着说不出的安宁。叶子纹丝不动，也没有一点声音来打扰大自然的沉思。草叶和树叶上挂满露珠，篝火只剩一层白灰，一缕淡蓝的烟笔直升上天空。乔和哈克还睡着。
        - id: ch01-b02
          speaker: narrator
          text: 远处有只鸟叫了一声，另一只马上回应。接着，啄木鸟也笃笃敲了起来。灰暗的晨光一点点变白，林中的声音越来越多，生命全都醒了。汤姆静静看着大自然抖掉睡意，开始一天的忙碌。
        - id: ch01-b03
          speaker: narrator
          text: 一条绿色小虫爬过带露的叶片，走几步，就把大半截身子抬到空中，像是在四处嗅闻。汤姆认定它正在量路。小虫朝他爬来，他立刻坐得像石头一样，一动也不敢动。它靠近时，他满怀希望。它稍一转向，他的心又往下沉。最后，小虫弓着身子犹豫了好一阵，终于落到汤姆腿上，沿着他爬了起来。汤姆高兴极了。这准是在预告，他会得到一套新衣服，而且必定是一身花哨的海盗制服。
        - id: ch01-b04
          speaker: narrator
          text: 一队蚂蚁不知从哪里出现，各自忙着干活。一只蚂蚁抱着比自己大五倍的死蜘蛛，拼命把它拖上树干。一只褐斑瓢虫爬上高高的草叶，汤姆俯身凑近了它。
        - id: ch01-b05
          speaker: tom
          text: “瓢虫，瓢虫，快回家。你家着火啦，孩子没人管。”
        - id: ch01-b06
          speaker: narrator
          text: 瓢虫当真展开翅膀，飞回去察看了。汤姆一点也不意外。他早就知道，瓢虫听说着火总会上当，他已经不止一次骗过它。随后，一只蜣螂使劲推着粪球过来。汤姆碰了碰它，它立刻把腿收紧，装起死来。
        - id: ch01-b07
          speaker: narrator
          text: 鸟儿这时已经闹翻了天。汤姆头顶的树上，一只猫鸟兴高采烈地模仿着别的鸟叫。又有一只松鸦像蓝色火焰一样冲下来，停在近得几乎能够到的树枝上，歪着脑袋，满心好奇地盯着陌生来客。一只灰松鼠和一只大狐松鼠也奔了过来，时不时坐直身子察看，还冲男孩们吱吱乱叫。这些野生的小家伙大概从没见过人，根本不知道该不该害怕。
        - id: ch01-b08
          speaker: narrator
          text: 整个大自然都醒了，到处有东西在活动。一道道阳光像长矛，从远远近近的浓密枝叶间刺下来，几只蝴蝶也飞进了这片热闹的晨景。
    - id: ch02
      title: 海盗的一天
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 汤姆把另外两个海盗叫醒。三个人喊叫着冲到河边，转眼就脱光衣服，跳进白色沙洲旁清澈的浅水里。他们互相追逐，扑来滚去，闹个不停。隔着辽阔的水面，远处的小村庄还在沉睡，可他们半点也不想念它。
        - id: ch02-b02
          speaker: narrator
          text: 不知是水流改变了方向，还是河面涨了一点，昨夜的木筏已经被冲走。男孩们反而很满意。木筏一消失，就像把他们通往文明世界的桥烧断了。
        - id: ch02-b03
          speaker: narrator
          text: 游完水，三个人回到营地，个个精神十足，快活得很，也饿得厉害。他们重新点旺篝火。哈克在附近发现一股清凉的泉水，大家便把宽大的橡树叶和山核桃树叶折成杯子。他们觉得，泉水带着野林的滋味，用来代替咖啡完全够好。
        - id: ch02-b04
          speaker: narrator
          text: 乔正准备切熏肉，汤姆和哈克请他先等等。两人走到河岸上一处看着有鱼的地方，甩下钓线，马上就有鱼咬钩。乔还没等得不耐烦，他们已经提着几条肥黑鲈、两条太阳鱼和一条小鲶鱼回来。这些鱼，足够一大家子饱餐一顿。
        - id: ch02-b05
          speaker: narrator
          text: 他们把鱼和熏肉放在一起煎。三个人从没吃过这么鲜美的鱼，简直不敢相信。他们还不知道，淡水鱼刚钓起来就下锅，味道最好。他们也没想到，在露天睡了一夜，又活动、游泳，再添上一肚子饥饿，本身就是绝妙的佐料。
        - id: ch02-b06
          speaker: narrator
          text: 早饭以后，他们先在树荫下躺着，让哈克抽完一烟斗，然后进树林探险。一路上，他们跨过烂倒木，钻过纠缠的灌木，从一棵棵庄严大树之间走过。葡萄藤从树冠垂到地上，像给森林的君王披了一身长长的华服。有时，他们还会闯进安静舒适的小角落，地上铺满青草，花朵像宝石一样点缀在上面。
        - id: ch02-b07
          speaker: narrator
          text: 岛上处处让人喜欢，却没有什么真正惊人的东西。他们查明，小岛大约三英里长、四分之一英里宽，最近的河岸离这里还不到两百码，中间只隔着一条狭窄水道。他们差不多每过一小时就游一次泳，等回到营地，已经快到下午三点了。
        - id: ch02-b08
          speaker: narrator
          text: 三个人饿得不肯花时间钓鱼，便拿冷火腿痛痛快快吃了一顿。饭后，他们倒在树荫下聊天。可话题很快就没意思了，最后谁也不再开口。树林太安静，也太肃穆，孤零零的感觉慢慢压上心头。他们开始各想各的，一种说不明白的渴望悄悄冒出来。过了一会儿，他们才隐约知道，那是思乡的念头正在发芽。
        - id: ch02-b09
          speaker: narrator
          text: 就连血手费恩，也想起了自家门前的台阶和那些空桶。可是，三个人都觉得想家很丢脸，谁也不敢先把心事说出口。
    - id: ch03
      title: 河上的炮声
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 其实，男孩们已经有一阵子隐约听见远处有种怪声，只是没有认真留意，就像人有时听见钟表滴答，却没把它放在心上。现在，那声音越来越清楚，逼得他们非注意不可。三个人猛地坐直，互相看看，都侧耳听了起来。
        - id: ch03-b02
          speaker: narrator
          text: 四周久久没有一点动静。寂静深沉，连一丝缝隙也没有。忽然，一声低沉阴郁的轰响从远方悠悠飘来。
        - id: ch03-b03
          speaker: joe
          text: “那是什么？”
          emotion: surprised
        - id: ch03-b04
          speaker: tom
          text: “不知道。”
        - id: ch03-b05
          speaker: huck
          text: “肯定不是打雷。”
        - id: ch03-b06
          speaker: narrator
          text: 哈克正要说出理由，汤姆打断了他。
        - id: ch03-b07
          speaker: tom
          text: “嘘，仔细听。别说话。”
        - id: ch03-b08
          speaker: narrator
          text: 他们等了好久，久得像过了一辈子。接着，同样沉闷的一声轰响，又打破了林中的寂静。
        - id: ch03-b09
          speaker: tom
          text: “走，咱们去看看。”
        - id: ch03-b10
          speaker: narrator
          text: 三个人跳起来，赶紧跑到朝着小镇的河岸，拨开灌木向外看。村庄下游约一英里处，小渡轮正在顺水漂流，宽阔的甲板上挤满了人。渡轮周围还有许多小艇，有的在划，有的随水漂着。男孩们看不清艇上的人在做什么。
        - id: ch03-b11
          speaker: narrator
          text: 忽然，一大股白烟从渡轮侧面喷出来，慢慢铺开，升成一团懒洋洋的烟云。紧接着，那声沉闷的震响又传了过来。
        - id: ch03-b12
          speaker: tom
          text: “我明白了！有人淹死啦！”
          emotion: surprised
        - id: ch03-b13
          speaker: huck
          text: “没错！去年夏天比尔·特纳淹死，他们就是这么办的。朝水面开炮，尸首就会浮上来。他们还会往面包里塞水银，再把面包放到河里。漂到有人淹死的地方，面包自己就停下了。”
        - id: ch03-b14
          speaker: joe
          text: “对，我也听说过。可面包怎么会知道该停在哪儿？”
        - id: ch03-b15
          speaker: tom
          text: “我看不全是面包的本事。放进水里以前，他们一定会对着面包念些什么。”
        - id: ch03-b16
          speaker: huck
          text: “他们根本没念。我亲眼见过，连一句话也没说。”
        - id: ch03-b17
          speaker: tom
          text: “那可怪了。也许他们是在心里念的。肯定是这样，谁想想都该知道。”
        - id: ch03-b18
          speaker: narrator
          text: 另外两个男孩觉得这话有道理。一块什么也不懂的面包，要是没有咒语教它该怎么做，接到这么要紧的差事，哪能指望它办得聪明呢？
        - id: ch03-b19
          speaker: joe
          text: “真希望我现在也在那边。”
        - id: ch03-b20
          speaker: huck
          text: “我也是。只要能知道淹死的是谁，花多大代价我都愿意。”
    - id: ch04
      title: 失踪的英雄
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 男孩们继续看着，也继续听着。忽然，汤姆脑子里闪过一个念头，谜底一下全揭开了。
        - id: ch04-b02
          speaker: tom
          text: “伙伴们，我知道淹死的是谁了——是咱们！”
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: 三个人转眼就觉得自己成了英雄。这是多么辉煌的一场胜利！大家发现他们失踪了，正在为他们哀悼。有人心碎，有人流泪。人们回想起从前怎样亏待过这几个可怜的孩子，开始责怪自己，再怎么后悔、懊丧也没有用了。
        - id: ch04-b04
          speaker: narrator
          text: 最棒的是，这几个已经“死去”的海盗，现在成了全镇议论的中心。单凭这份耀眼的名声，就足够让别的男孩羡慕死了。三个人觉得，这实在太美。当海盗果然值得。
        - id: ch04-b05
          speaker: narrator
          text: 黄昏越来越深，渡轮回去做平日的营生，小艇也全都散了。海盗们回到营地。他们忽然有了这么了不起的身份，还给全镇惹出这么轰动的麻烦，心里又得意又兴奋。
        - id: ch04-b06
          speaker: narrator
          text: 他们钓来鱼，做好晚饭吃掉，然后开始猜测，村里人此刻会怎样想他们、谈论他们。三个人描绘出一幅幅全镇为他们悲痛的景象。至少在他们自己眼里，那些画面真是好看极了。
        - id: ch04-b07
          speaker: narrator
          text: 可等夜色从四周合拢，他们的话渐渐少了。三个人坐着望向火焰，心思显然都飘到了别处。兴奋已经过去。汤姆和乔不由得想起家里的某些人。对那些人来说，这场美妙的胡闹可没有这么好玩。
        - id: ch04-b08
          speaker: narrator
          text: 两个男孩心里起了疑虑，越来越烦恼，也越来越难过，偶尔还会不由自主地叹气。过了好一会儿，乔怯生生地绕着圈子试探起来。他想知道，另外两个人怎么看回到文明世界这件事。他不是说现在就回去，只不过——
        - id: ch04-b09
          speaker: narrator
          text: 汤姆立刻狠狠嘲笑了他。哈克本来还没选定站在哪边，一看汤姆开口，也跟着一起讥笑。动摇的乔赶紧“解释”自己的意思。他总算脱了身，也没让胆小思乡的污点在自己身上沾得太多，心里暗暗庆幸。这场反叛暂时彻底平息了。
    - id: ch05
      title: 汤姆的秘密行动
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 夜更深了。哈克先开始点头，很快就打起呼噜。接着，乔也睡着了。汤姆却一直没有动。他用胳膊肘撑着身体，仔细看了两人好一阵。
        - id: ch05-b02
          speaker: narrator
          text: 最后，汤姆小心地跪坐起来，在草丛和篝火摇曳的光影里寻找。他捡起几大片梧桐树薄薄的白皮。这些树皮都弯得像半截圆筒。他一片片察看，终于挑出两片合适的。
        - id: ch05-b03
          speaker: narrator
          text: 汤姆跪在火边，拿那支“红铅笔”吃力地在两片树皮上各写了一些字。他把一片卷起来，塞进自己的上衣口袋。另一片放进乔的帽子里，再把帽子挪到离乔稍远的地方。
        - id: ch05-b04
          speaker: narrator
          text: 他又往帽子里放了几件小学生的宝物。那些东西几乎每一样都珍贵得无法估量，有一块粉笔、一个橡皮球、三只鱼钩，还有一颗他们叫作“货真价实水晶”的弹珠。
        - id: ch05-b05
          speaker: narrator
          text: 做完这一切，汤姆踮着脚，小心穿过树林。等他确信自己已经走到乔和哈克听不见的地方，立刻拔腿飞奔，直朝沙洲跑去。
