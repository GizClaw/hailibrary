  chapters:
    - id: ch01
      title: CHAPTER XIV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Tom woke the next morning and wondered where he was. He sat up, rubbed his eyes, and looked around. Then he remembered. Cool gray dawn lay over the woods. Everything was so calm and quiet that the whole place seemed at rest. No leaf moved. No sound broke the silence. Drops of dew covered the leaves and grass. White ashes lay over the fire, and one thin blue thread of smoke rose straight into the air. Joe and Huck were still asleep.
        - id: ch01-b02
          speaker: narrator
          text: Far off in the woods, one bird called and another answered. Soon a woodpecker began to hammer. Little by little, the cool, dim gray of morning turned white. More sounds joined in, and signs of life appeared everywhere. Tom sat quietly and watched the wonderful sight of the woods shaking off sleep and going to work.
        - id: ch01-b03
          speaker: narrator
          text: A small green worm crawled over a wet leaf. Every so often, it raised most of its body into the air to sniff around, as Tom put it, and then moved on. Tom stayed as still as a stone when it came his way. His hopes rose whenever it moved closer and fell whenever it seemed ready to turn aside. The creature kept him waiting, first choosing his direction and then appearing to prefer another. At last, after one painful pause with its body curved in the air, the worm came down on Tom's leg and began crawling over him. Tom was delighted. That meant he would get a new suit of clothes, and without a doubt it would be a bright pirate uniform.
        - id: ch01-b04
          speaker: narrator
          text: Next came a line of ants, all busy with their work. One struggled past carrying a dead spider five times its own size and hauled it straight up a tree. A brown, spotted ladybug climbed to the top of a blade of grass. Tom bent close to it.
        - id: ch01-b05
          speaker: tom
          text: "Ladybug, ladybug, fly home. Your house is burning, and your children are alone."
        - id: ch01-b06
          speaker: narrator
          text: The ladybug spread its wings and flew away to see about the trouble. Tom was not surprised. He already knew how easily that insect believed stories about fires, and he had fooled it more than once. Then a tumblebug came along, pushing hard at its ball. Tom touched it just to see what it would do. The creature pulled its legs tight against its body and pretended to be dead.
        - id: ch01-b07
          speaker: narrator
          text: By now the birds were making a joyful racket. A catbird landed above Tom and poured out imitations of its neighbors as if it delighted in every sound. A jay flashed down like blue flame, stopped on a twig almost within reach, and stared at the strangers with its head tipped to one side. A gray squirrel and a large fox squirrel hurried over, stopping again and again to sit up, inspect the boys, and chatter at them. Perhaps the wild creatures had never seen people before and did not know whether to be afraid. The woods were fully awake. Long spears of sunlight pierced the thick leaves near and far, and butterflies fluttered into view.
        - id: ch01-b08
          speaker: narrator
          text: Tom woke the other pirates. With a shout, they all rushed off. In a minute or two, they had stripped and were chasing one another through the clear, shallow water by the white sandbar, splashing and tumbling together. They did not miss the little village sleeping far across the very broad river. During the night, the current or a small rise in the water had carried away their raft. That pleased them. It felt as though the bridge back to ordinary life had been burned.
        - id: ch01-b09
          speaker: narrator
          text: They returned to camp refreshed, cheerful, and terribly hungry, and soon the fire was blazing again. Huck found a spring of clear, cold water nearby. The boys folded broad oak or hickory leaves into cups. With the wild woods around them, they decided that spring water was good enough to take the place of coffee.
        - id: ch01-b10
          speaker: narrator
          text: Joe started slicing bacon for breakfast, but Tom and Huck asked him to wait. They went to a good spot on the riverbank and cast their lines. The fish bit almost at once. Before Joe had time to grow impatient, they came back with fine bass, two sunfish, and a small catfish, enough to feed a whole family.
        - id: ch01-b11
          speaker: narrator
          text: They fried the fish with the bacon and could hardly believe how good it tasted. They did not know that a freshwater fish tastes best when it goes straight from the river to the fire. Nor did they think much about the flavor added by sleeping outside, exercising, swimming, and being very hungry.
        - id: ch01-b12
          speaker: narrator
          text: After breakfast, they stretched out in the shade while Huck had a smoke. Then they set off to explore the island. They walked along cheerfully, stepping over rotting logs and pushing through twisted underbrush. Great old trees stood around them like solemn kings of the forest. Grape vines hung from their crowns all the way to the ground, like drooping royal robes. Now and then, the boys found a snug, sheltered patch where soft grass covered the earth and flowers shone like jewels.
        - id: ch01-b13
          speaker: narrator
          text: They found plenty to enjoy, though nothing truly amazing. The island was about three miles long and a quarter of a mile wide. On its nearest side, a narrow channel of less than two hundred yards separated it from shore. The boys stopped for a swim about once every hour, so it was nearly midafternoon when they returned to camp.
        - id: ch01-b14
          speaker: narrator
          text: They were too hungry to fish. Instead, they feasted on cold ham and stretched out in the shade to talk. Before long, the conversation slowed and stopped. The quiet woods felt solemn and lonely now. The boys began to think, and a vague longing crept over them. Soon it became homesickness. Even Finn the Red-Handed dreamed of the doorsteps and empty barrels where he used to sleep. But all three were ashamed of feeling weak, and none was brave enough to admit what he was thinking.
        - id: ch01-b15
          speaker: narrator
          text: For some time, they had half noticed a strange sound far away, the way someone may hear a clock ticking without paying attention. Now it grew too clear to ignore. The boys started and looked at one another. Then they listened. A long, deep silence passed. Out of the distance came a low, heavy boom.
        - id: ch01-b16
          speaker: joe_harper
          text: "What was that?"
          emotion: surprised
        - id: ch01-b17
          speaker: tom
          text: "I wonder."
        - id: ch01-b18
          speaker: huck
          text: "That ain't thunder. Thunder don't sound like that."
        - id: ch01-b19
          speaker: tom
          text: "Hush. Just listen."
        - id: ch01-b20
          speaker: narrator
          text: They waited so long that it felt like an age. Then the same muffled boom rolled through the stillness.
        - id: ch01-b21
          speaker: tom
          text: "Come on. Let's find out what it is."
        - id: ch01-b22
          speaker: narrator
          text: They jumped up and hurried to the shore that faced the town. Pulling the bushes apart, they peered across the water. The little steam ferryboat was drifting with the current about a mile below the village. Its broad deck looked crowded with people. Many small boats surrounded it. Some were rowing about while others simply floated downstream. The boys strained their eyes, but they could not tell what the men aboard them were doing.
        - id: ch01-b23
          speaker: narrator
          text: Suddenly, a great burst of white smoke shot from the ferryboat's side. As the smoke spread into a slow cloud, that same dull boom reached the boys again.
        - id: ch01-b24
          speaker: tom
          text: "Now I know! Somebody drowned!"
          emotion: surprised
        - id: ch01-b25
          speaker: huck
          text: "That's it. They did the same thing last summer when Bill Turner drowned. They fire a cannon over the water to make the body rise. And they float loaves of bread with quicksilver inside. Wherever the drowned person is, the bread stops right there."
        - id: ch01-b26
          speaker: joe_harper
          text: "Yeah, I've heard that. But what makes the bread know where to stop?"
        - id: ch01-b27
          speaker: tom
          text: "It ain't really the bread doing it. I reckon it's mostly the words they say over the loaf before they put it in the water."
        - id: ch01-b28
          speaker: huck
          text: "But they don't say any words. I've watched them, and they never say a thing."
        - id: ch01-b29
          speaker: tom
          text: "Well, that's strange. Maybe they say the words inside their heads. Of course that's it. Anybody can see that."
        - id: ch01-b30
          speaker: narrator
          text: The others agreed that Tom's answer made sense. A stupid lump of bread could hardly be expected to handle such an important job unless a spell had told it what to do.
        - id: ch01-b31
          speaker: joe_harper
          text: "By jings, I wish I was over there right now."
        - id: ch01-b32
          speaker: huck
          text: "Me too. I'd give plenty to know who drowned."
        - id: ch01-b33
          speaker: narrator
          text: The boys kept watching and listening. Then the truth flashed into Tom's mind.
        - id: ch01-b34
          speaker: tom
          text: "Boys, I know who's drowned. It's us!"
          emotion: surprised
        - id: ch01-b35
          speaker: narrator
          text: In an instant, they felt like heroes. What a splendid victory this was. People missed them and mourned them. Hearts were breaking because they were gone, and tears were falling. Folks must be remembering every unkind thing they had done to the poor lost boys. Now they would blame themselves, regret it all, and wish uselessly that they could take it back. Best of all, the whole town was talking about the three departed boys. Every other boy must envy such dazzling fame. This was glorious. Being a pirate was worthwhile after all.
        - id: ch01-b36
          speaker: narrator
          text: As evening came on, the ferryboat returned to its usual work, and the skiffs vanished. The pirates went back to camp, bursting with pride over their new greatness and the famous trouble they had caused. They caught fish, cooked supper, and ate. Then they tried to guess what everyone in the village was saying and thinking about them. They pictured all the grief their disappearance had caused. From their own point of view, those scenes of public sorrow were wonderful to imagine.
        - id: ch01-b37
          speaker: narrator
          text: Night closed around them. Their talk slowly faded, and they sat staring into the fire while their thoughts wandered elsewhere. The excitement was gone. Tom and Joe could not stop thinking of certain people at home who were not enjoying this grand adventure at all. Doubts crept in. The boys grew troubled and unhappy, and now and then one of them sighed without meaning to.
        - id: ch01-b38
          speaker: narrator
          text: At last, Joe cautiously tested how the others might feel about going back to ordinary life. He made it clear that he did not mean going home right then. He was only wondering how they might feel about it sometime later.
        - id: ch01-b39
          speaker: narrator
          text: Tom mocked the idea until Joe shrank from it. Huck had not chosen a side yet, so he joined Tom. Joe quickly explained that he had not really meant it. He was relieved to escape with as little suspicion of cowardly homesickness as possible. For the moment, the mutiny was over.
        - id: ch01-b40
          speaker: narrator
          text: As the night grew deeper, Huck began to nod and soon was snoring. Joe fell asleep next. Tom lay still on one elbow for a while, watching them closely. At last, he carefully rose to his knees and searched through the grass in the shifting firelight.
        - id: ch01-b41
          speaker: narrator
          text: He picked up several broad, curved pieces of thin white sycamore bark and inspected them one by one. At last, he chose two that suited him. He knelt beside the fire and, with a great deal of effort, used his red keel to write something on each piece. He rolled up one and slipped it into his jacket pocket. The other went into Joe's hat, which Tom moved a short distance away from its sleeping owner.
        - id: ch01-b42
          speaker: narrator
          text: Into the hat, Tom also placed some schoolboy treasures of almost priceless value. There was a lump of chalk, an India-rubber ball, three fishhooks, and a marble of the kind known as a sure-enough crystal.
        - id: ch01-b43
          speaker: narrator
          text: Then Tom tiptoed carefully among the trees. Once he was sure he had gone beyond hearing, he broke into a swift run toward the sandbar.
