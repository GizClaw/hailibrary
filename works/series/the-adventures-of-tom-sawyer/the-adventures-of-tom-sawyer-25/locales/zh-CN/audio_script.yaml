audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵自信，讲到冒险时神秘又兴奋
        timbre: 清亮的少年声
        pace: 明快，争辩时稍快
        pitch: 中高音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，带着谨慎和粗朴的幽默
        timbre: 略沙哑的少年声
        pace: 自然偏慢，害怕时稍急
        pitch: 中音
  chapters:
    - id: ch01
      title: 寻宝的规矩
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 每个天性健全的男孩子，一生中总会有那么一阵，心里突然冒出一股劲，非得找个地方挖宝不可。有一天，汤姆也犯了这个瘾。他先找乔·哈帕，没找着。再去找本·罗杰斯，本钓鱼去了。没多久，他碰见了“血手”哈克·费恩。哈克最合适不过。只要事情有趣，又不用花本钱，他总愿意参加，反正他多的是不值钱的时间。汤姆把他领到僻静处，神神秘秘地说了寻宝的打算。
        - id: ch01-b02
          speaker: huck
          text: 行啊。那咱们去哪儿挖？
        - id: ch01-b03
          speaker: tom
          text: 哪儿都行，差不多吧。
        - id: ch01-b04
          speaker: huck
          text: 怎么，宝贝到处都埋着？
        - id: ch01-b05
          speaker: tom
          text: 哪能啊，哈克。宝贝只藏在特别的地方。有时候在岛上，有时候装在烂箱子里，埋在老枯树横枝的尽头下面，就在半夜树影落到的地方。不过，大多还是埋在鬼屋的地板底下。
        - id: ch01-b06
          speaker: huck
          text: 谁把它们埋下去的？
        - id: ch01-b07
          speaker: tom
          text: 当然是强盗。不然还能是谁，主日学校的校长吗？
        - id: ch01-b08
          speaker: huck
          text: 我哪知道。钱要是归我，我才不会藏起来。我早花掉，好好快活一场了。
        - id: ch01-b09
          speaker: tom
          text: 我也会，可强盗不是这么办的。他们把宝贝藏起来，就丢在那里。
        - id: ch01-b10
          speaker: huck
          text: 那他们不回来拿吗？
        - id: ch01-b11
          speaker: tom
          text: 原本是想回来的。可后来不是忘了记号，就是自己死了。宝贝就在那里搁上好多年，慢慢全锈了。再后来，有人会找到一张发黄的旧纸，上面写着怎么找那些记号。可那纸差不多全是符号和象形文字，得琢磨一个星期才看得懂。
        - id: ch01-b12
          speaker: huck
          text: 象形什么？
        - id: ch01-b13
          speaker: tom
          text: 象形文字。就是一些图画什么的，看起来根本没意思。
        - id: ch01-b14
          speaker: huck
          text: 汤姆，你有那种纸吗？
        - id: ch01-b15
          speaker: tom
          text: 没有。
        - id: ch01-b16
          speaker: huck
          text: 那你拿什么找记号？
        - id: ch01-b17
          speaker: tom
          text: 我根本用不着。宝贝总在鬼屋下面、岛上，或者伸着横枝的枯树底下。杰克逊岛咱们已经找过一点了，改天还能再去。制酒坊那条岔路上有一座老鬼屋，附近还有一大堆伸着枯枝的树，多得很。
        - id: ch01-b18
          speaker: huck
          text: 每棵树下面都有？
        - id: ch01-b19
          speaker: tom
          text: 你想什么呢！当然不是。
        - id: ch01-b20
          speaker: huck
          text: 那你怎么知道该挖哪棵？
        - id: ch01-b21
          speaker: tom
          text: 每棵都挖一遍！
        - id: ch01-b22
          speaker: huck
          text: 哎呀，汤姆，那一整个夏天都挖不完。
        - id: ch01-b23
          speaker: tom
          text: 那又怎么了？你想想，要是挖出一只铜罐，里面有一百块灰扑扑的锈钱。或者挖到一只烂箱子，满满装着钻石，那该多好！
        - id: ch01-b24
          speaker: narrator
          text: 哈克听得两眼发亮。
        - id: ch01-b25
          speaker: huck
          text: 那可太棒了。光那一百块钱，就够我快活啦。钻石全给你，我不要。
        - id: ch01-b26
          speaker: tom
          text: 好啊。不过我可不会把钻石丢掉。有的钻石一颗就值二十块，几乎没有哪颗只值七毛五，或者一块钱。
        - id: ch01-b27
          speaker: huck
          text: 不会吧！真有这么值钱？
          emotion: surprised
        - id: ch01-b28
          speaker: tom
          text: 当然，谁都会这么告诉你。哈克，你从没见过钻石吗？
        - id: ch01-b29
          speaker: huck
          text: 我不记得见过。
        - id: ch01-b30
          speaker: tom
          text: 嗐，国王们可多的是。
        - id: ch01-b31
          speaker: huck
          text: 可我不认识国王呀，汤姆。
        - id: ch01-b32
          speaker: tom
          text: 我想你也不认识。不过你去了欧洲，就会看见一大群国王到处蹦跶。
        - id: ch01-b33
          speaker: huck
          text: 国王还会蹦？
        - id: ch01-b34
          speaker: tom
          text: 蹦？蹦你奶奶！他们才不蹦呢！
        - id: ch01-b35
          speaker: huck
          text: 那你怎么说他们到处蹦跶？
        - id: ch01-b36
          speaker: tom
          text: 呸，我是说你会看见他们，不是真说他们蹦。国王干吗要蹦？我的意思是，你到处都能看见几个。东一个，西一个，明白了吧？就像那个驼背的老理查。
        - id: ch01-b37
          speaker: huck
          text: 理查姓什么？
        - id: ch01-b38
          speaker: tom
          text: 他没有姓。国王除了名字，别的什么都没有。
        - id: ch01-b39
          speaker: huck
          text: 是这样吗？
        - id: ch01-b40
          speaker: tom
          text: 就是这样。
        - id: ch01-b41
          speaker: huck
          text: 好吧，他们乐意这样就随他们去。反正我不想当国王，跟黑鬼一样只有个名字。对了，咱们先去哪里挖？
        - id: ch01-b42
          speaker: tom
          text: 嗯，我也不知道。要不先去制酒坊岔路那边，挖山上那棵伸着枯枝的老树？
        - id: ch01-b43
          speaker: huck
          text: 我赞成。
    - id: ch02
      title: 发财以后的日子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两个人找来一把破镐和一把铁锹，走了三英里才到地方。他们热得直喘气，一头倒在附近一棵榆树的阴凉底下，边歇边抽烟。
        - id: ch02-b02
          speaker: tom
          text: 我喜欢这样。
        - id: ch02-b03
          speaker: huck
          text: 我也喜欢。
        - id: ch02-b04
          speaker: tom
          text: 哈克，要是咱们真在这里挖到宝藏，你那一份准备怎么花？
        - id: ch02-b05
          speaker: huck
          text: 我每天都吃馅饼，再喝一杯汽水。只要马戏团来了，我场场都去看。那日子准快活极了。
        - id: ch02-b06
          speaker: tom
          text: 你一点也不留着？
        - id: ch02-b07
          speaker: huck
          text: 留着干吗？
        - id: ch02-b08
          speaker: tom
          text: 往后总得靠它养活自己呀。
        - id: ch02-b09
          speaker: huck
          text: 嗐，那没用。哪天我爹回到镇上，我要是没把钱赶紧花掉，他准会伸手来抢。用不了多久，他就能把钱全花光。汤姆，你那一份准备怎么办？
        - id: ch02-b10
          speaker: tom
          text: 我要买一面新鼓，一把真正的宝剑，一条红领带，再买一只斗牛犬崽，然后结婚。
        - id: ch02-b11
          speaker: huck
          text: 结婚！
          emotion: surprised
        - id: ch02-b12
          speaker: tom
          text: 对啊。
        - id: ch02-b13
          speaker: huck
          text: 汤姆，你一定是脑子糊涂了。
        - id: ch02-b14
          speaker: tom
          text: 你等着看吧，到时候就知道了。
        - id: ch02-b15
          speaker: huck
          text: 那是你能干出来最傻的事。你看看我爹和我娘，他们从前一天到晚打个没完，我记得清清楚楚。
        - id: ch02-b16
          speaker: tom
          text: 那不一样。我要娶的女孩不会打架。
        - id: ch02-b17
          speaker: huck
          text: 我看她们全都一样，个个都会收拾人。你最好再想清楚，我可不是说着玩的。那个姑娘叫什么？
        - id: ch02-b18
          speaker: tom
          text: 她不是姑娘，是女孩。
        - id: ch02-b19
          speaker: huck
          text: 在我看来都一样。有人叫姑娘，有人叫女孩，多半都没错。她到底叫什么，汤姆？
        - id: ch02-b20
          speaker: tom
          text: 以后再告诉你，现在不说。
        - id: ch02-b21
          speaker: huck
          text: 好吧，那也行。可你要是结婚了，我就比现在更孤单啦。
          emotion: sad
        - id: ch02-b22
          speaker: tom
          text: 不会的。你来跟我一起住。好了，起来吧，咱们挖去。
    - id: ch03
      title: 挖错了地方
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们流着汗苦干了半个钟头，什么也没挖到。又干了半个钟头，仍旧一无所获。
        - id: ch03-b02
          speaker: huck
          text: 宝贝总埋得这么深吗？
        - id: ch03-b03
          speaker: tom
          text: 有时候会，可也不总是，一般没这么深。我看咱们是找错地方了。
        - id: ch03-b04
          speaker: narrator
          text: 他们换了一个地方，又动起手来。两个人虽然越干越慢，坑却还是一点点深了下去。他们闷头挖了好一阵。最后，哈克撑着铁锹，用袖子擦掉额头上的汗珠。
        - id: ch03-b05
          speaker: huck
          text: 这棵挖完了，下一处去哪儿？
        - id: ch03-b06
          speaker: tom
          text: 我想，可以去挖卡迪夫山上，寡妇家后面那棵老树。
        - id: ch03-b07
          speaker: huck
          text: 那棵听着不错。可树长在寡妇的地上，她不会把宝贝抢走吗？
        - id: ch03-b08
          speaker: tom
          text: 她抢一个试试！这种宝藏谁找着就归谁，埋在谁的地上都没关系。
        - id: ch03-b09
          speaker: narrator
          text: 哈克听了很满意，两个人接着挖。又过了一会儿，他开口了。
        - id: ch03-b10
          speaker: huck
          text: 真倒霉，咱们肯定又挖错了。你说呢？
        - id: ch03-b11
          speaker: tom
          text: 这就怪了，哈克，我也想不通。有时候女巫会来捣乱，我看这次八成是她们坏了事。
        - id: ch03-b12
          speaker: huck
          text: 呸！现在可是大白天，女巫哪有本事作怪。
        - id: ch03-b13
          speaker: tom
          text: 嗯，说得对，我倒没想到。啊，我知道哪里不对了！咱们真是两个该死的大傻瓜！应该先看清半夜横枝的影子落在哪里，再从那里往下挖！
        - id: ch03-b14
          speaker: huck
          text: 真见鬼，忙了这么久，全白费了。该死，还得半夜再来一趟，这条路远得要命。你能出来吗？
        - id: ch03-b15
          speaker: tom
          text: 当然能，而且非得今晚来。要是有人看见这些坑，马上就会明白这里有东西，自己跑来挖走。
        - id: ch03-b16
          speaker: huck
          text: 那好，今晚我在你家旁边学猫叫。
        - id: ch03-b17
          speaker: tom
          text: 行。咱们把工具藏进灌木丛里。
    - id: ch04
      title: 半夜的树影
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 当天晚上，两个孩子按约定的时辰回到那里，坐在阴影中等着。四周僻静极了，关于这个时辰的古老传说，又让一切显得更加森严。树叶沙沙响，像是精灵在小声说话。幽灵仿佛藏在昏暗的角落里。远处有猎犬低沉地长叫，猫头鹰也用坟墓般阴森的声音应和。两个孩子被这可怕又庄严的气氛镇住了，几乎一句话也没说。
        - id: ch04-b02
          speaker: narrator
          text: 过了一阵，他们估摸午夜已经到了，便在树影落下的地方做好记号，开始往下挖。希望一点点升起来，他们越挖越起劲，手脚也越来越快。坑渐渐深了。每次镐头碰到什么东西，两颗心都会猛跳一下，结果却总让人失望，不是石头，就是硬土块。最后，汤姆停了下来。
        - id: ch04-b03
          speaker: tom
          text: 不行，哈克，咱们又弄错了。
        - id: ch04-b04
          speaker: huck
          text: 可这回不可能错啊。树影落在哪里，咱们看得清清楚楚。
        - id: ch04-b05
          speaker: tom
          text: 我知道，可还有一件事。
        - id: ch04-b06
          speaker: huck
          text: 什么事？
        - id: ch04-b07
          speaker: tom
          text: 时辰是咱们自己猜的。没准来早了，也没准来晚了。
        - id: ch04-b08
          speaker: narrator
          text: 哈克把铁锹一扔。
        - id: ch04-b09
          speaker: huck
          text: 对，就是这个毛病。这个地方只能放弃，咱们永远也弄不准时辰。再说了，半夜待在这里，女巫和鬼魂到处飞，实在吓人。我老觉得背后有东西，可我不敢回头。说不定前面也有别的东西，就等着我一转身，好扑上来。打从来到这里，我浑身的鸡皮疙瘩就没下去过。
          emotion: fearful
        - id: ch04-b10
          speaker: tom
          text: 我也差不多，哈克。他们把宝藏埋在树底下的时候，多半还会放个死人进去，替他们守着。
        - id: ch04-b11
          speaker: huck
          text: 老天爷！
          emotion: surprised
        - id: ch04-b12
          speaker: tom
          text: 真的。他们就是这么干，我一直听人这么说。
        - id: ch04-b13
          speaker: huck
          text: 汤姆，我可不想在有死人的地方乱挖。把他们惹恼了，准会有麻烦。
          emotion: fearful
        - id: ch04-b14
          speaker: tom
          text: 我也不想惊动他们。万一这里这个死人忽然伸出骷髅头，还开口说话呢！
        - id: ch04-b15
          speaker: huck
          text: 别说了，汤姆！太吓人了。
          emotion: fearful
        - id: ch04-b16
          speaker: tom
          text: 本来就吓人。哈克，我心里也一点都不踏实。
          emotion: fearful
        - id: ch04-b17
          speaker: huck
          text: 汤姆，咱们别在这里挖了，换个地方吧。
        - id: ch04-b18
          speaker: tom
          text: 好吧，我看还是换了好。
        - id: ch04-b19
          speaker: huck
          text: 换到哪儿？
        - id: ch04-b20
          speaker: narrator
          text: 汤姆想了一会儿。
        - id: ch04-b21
          speaker: tom
          text: 鬼屋。对，就去那里！
    - id: ch05
      title: 山谷里的鬼屋
      blocks:
        - id: ch05-b01
          speaker: huck
          text: 真倒霉，我可不喜欢鬼屋，汤姆。那东西比死人还糟。死人也许会开口，可他们不会趁你不注意，裹着尸布悄悄滑过来，突然从你肩膀后面探出脸，还冲你咬牙切齿。鬼就会这样。我可受不了，谁也受不了。
          emotion: fearful
        - id: ch05-b02
          speaker: tom
          text: 可是哈克，鬼只在晚上出来乱逛。咱们白天去挖，他们不会妨碍咱们。
        - id: ch05-b03
          speaker: huck
          text: 嗯，这倒是真的。可你明明知道，不管白天还是晚上，谁都不肯靠近那座鬼屋。
        - id: ch05-b04
          speaker: tom
          text: 那主要是因为有人在屋里被杀过，大家本来就不愿意去。不过，附近只有晚上才出现过怪东西。也就是几团蓝火从窗前飘过去，从来没人见过真正的鬼。
        - id: ch05-b05
          speaker: huck
          text: 汤姆，只要看见哪里有蓝火晃来晃去，你就能断定后面跟着一个鬼，绝不会错。你也知道，除了鬼，谁会用那种东西？
        - id: ch05-b06
          speaker: tom
          text: 对，这倒是真的。可他们白天总不会出来，那咱们还怕什么？
        - id: ch05-b07
          speaker: huck
          text: 好吧。既然你这么说，咱们就去挖鬼屋。不过我觉得，这可是在冒险。
        - id: ch05-b08
          speaker: narrator
          text: 这时，他们已经往山下走了。月光照亮脚下的山谷，那座“鬼屋”孤零零地站在正中央。围墙早就没了，疯长的野草几乎淹没门阶。烟囱塌成一片废墟，窗框空荡荡的，屋顶的一角也陷了下去。两个孩子盯着它看了一阵，仿佛随时会有一团蓝火从某扇窗前飘过去。
        - id: ch05-b09
          speaker: narrator
          text: 随后，他们压低了声音。在这样的时辰、这样的地方，本来就该这么说话。他们远远绕向右边，避开鬼屋，穿过卡迪夫山背坡的树林，走上了回家的路。
