audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry sense of humor
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
    tom:
      display_name: Tom Sawyer
      tts:
        delivery: confident, imaginative, and quick to explain
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    huck:
      display_name: Huckleberry Finn
      tts:
        delivery: rough-edged, curious, and plainly spoken
        timbre: light and dusty
        pace: easygoing
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER XXV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sooner or later, every proper boy is seized by one wild desire. He has to go somewhere and dig for buried treasure. One day, that desire took hold of Tom. He went looking for Joe Harper, but could not find him. Then he tried Ben Rogers, who had gone fishing. At last he ran into Huck Finn the Red-Handed. Huck would do. Tom led him somewhere private and told him the plan in confidence. Huck was ready at once. He always had plenty of time for any adventure that was fun and cost nothing.
        - id: ch01-b02
          speaker: huck
          text: So where are we going to dig?
        - id: ch01-b03
          speaker: tom
          text: Oh, almost anywhere.
        - id: ch01-b04
          speaker: huck
          text: You mean treasure is hidden all over the place?
        - id: ch01-b05
          speaker: tom
          text: Of course not. It's only in certain places. Sometimes it's on an island. Sometimes it's in a rotten chest, under the end of a dead tree limb, right where the shadow falls at midnight. But most of it is under the floor of a haunted house.
        - id: ch01-b06
          speaker: huck
          text: Who puts it there?
        - id: ch01-b07
          speaker: tom
          text: Robbers, naturally. Who did you think, Sunday school superintendents?
        - id: ch01-b08
          speaker: huck
          text: I don't know. If it belonged to me, I wouldn't hide it. I'd spend it and enjoy myself.
        - id: ch01-b09
          speaker: tom
          text: So would I. Robbers don't work that way, though. They hide their treasure and leave it there.
        - id: ch01-b10
          speaker: huck
          text: Don't they ever come back for it?
        - id: ch01-b11
          speaker: tom
          text: They mean to, but usually they forget the marks, or they die. The treasure lies there so long it gets rusty. Then somebody finds an old yellow paper that explains the marks. It takes about a week to figure out because it's covered in signs and hieroglyphics.
        - id: ch01-b12
          speaker: huck
          text: Hiero-what?
        - id: ch01-b13
          speaker: tom
          text: Hieroglyphics. Pictures and things that don't seem to mean anything.
        - id: ch01-b14
          speaker: huck
          text: Have you got one of those papers?
        - id: ch01-b15
          speaker: tom
          text: No.
        - id: ch01-b16
          speaker: huck
          text: Then how will you find the marks?
        - id: ch01-b17
          speaker: tom
          text: I don't need any marks. Treasure is always under a haunted house, on an island, or beneath a dead tree with one limb sticking out. We've tried Jackson's Island a little, and we can try it again. There's the old haunted house along Still-House Branch, too. And there are piles of dead-limb trees.
        - id: ch01-b18
          speaker: huck
          text: Is treasure under every one of them?
        - id: ch01-b19
          speaker: tom
          text: What kind of question is that? No!
        - id: ch01-b20
          speaker: huck
          text: Then how will you know which one to try?
        - id: ch01-b21
          speaker: tom
          text: We'll try them all!
        - id: ch01-b22
          speaker: huck
          text: Tom, that'll take the whole summer.
        - id: ch01-b23
          speaker: tom
          text: So what? Think about finding a brass pot with a hundred dollars inside, all gray and rusty. Or a rotten chest full of diamonds. How would you like that?
        - id: ch01-b24
          speaker: narrator
          text: Huck's eyes shone.
        - id: ch01-b25
          speaker: huck
          text: That would be grand. Grand enough for me, anyway. Give me the hundred dollars. I don't need any diamonds.
        - id: ch01-b26
          speaker: tom
          text: Fine, but I'm not giving up the diamonds. Some are worth twenty dollars each. Almost every one is worth at least seventy-five cents or a dollar.
        - id: ch01-b27
          speaker: huck
          text: No! Really?
          emotion: surprised
        - id: ch01-b28
          speaker: tom
          text: Certainly. Anybody will tell you. Haven't you ever seen a diamond, Huck?
        - id: ch01-b29
          speaker: huck
          text: Not that I remember.
        - id: ch01-b30
          speaker: tom
          text: Kings have heaps of them.
        - id: ch01-b31
          speaker: huck
          text: Well, I don't know any kings.
        - id: ch01-b32
          speaker: tom
          text: I expect you don't. If you went to Europe, you'd see crowds of them hopping around.
        - id: ch01-b33
          speaker: huck
          text: Kings hop?
        - id: ch01-b34
          speaker: tom
          text: Hop? Good grief, no!
        - id: ch01-b35
          speaker: huck
          text: Then why did you say they did?
        - id: ch01-b36
          speaker: tom
          text: Oh, hush. I only meant you'd see them. They wouldn't really be hopping. Why would they? I mean they'd be scattered around everywhere. Like that old hunchbacked Richard.
        - id: ch01-b37
          speaker: huck
          text: Richard what? What's his other name?
        - id: ch01-b38
          speaker: tom
          text: He didn't have another one. Kings only have a given name.
        - id: ch01-b39
          speaker: huck
          text: They do?
        - id: ch01-b40
          speaker: tom
          text: Yes, they do.
        - id: ch01-b41
          speaker: huck
          text: Well, if kings like it, that's fine. I wouldn't want to be a king with only one plain name. Anyway, where do we dig first?
        - id: ch01-b42
          speaker: tom
          text: I'm not sure. What if we try that old dead-limb tree on the hill across Still-House Branch?
        - id: ch01-b43
          speaker: huck
          text: I'm with you.
        - id: ch01-b44
          speaker: narrator
          text: They found a damaged pick and a shovel, then set off on the three-mile walk. By the time they arrived, they were hot and breathless. They dropped into the shade of a nearby elm to rest and smoke.
        - id: ch01-b45
          speaker: tom
          text: I like this.
        - id: ch01-b46
          speaker: huck
          text: So do I.
        - id: ch01-b47
          speaker: tom
          text: Huck, if we find treasure here, what will you do with your share?
        - id: ch01-b48
          speaker: huck
          text: I'll have pie and a glass of soda every day. And I'll go to every circus that comes along. I'll have a wonderful time.
        - id: ch01-b49
          speaker: tom
          text: Aren't you going to save any of it?
        - id: ch01-b50
          speaker: huck
          text: Save it? What for?
        - id: ch01-b51
          speaker: tom
          text: So you'll have something to live on later.
        - id: ch01-b52
          speaker: huck
          text: That wouldn't do any good. Pap would come back to town someday and get his claws on it unless I spent it fast. He'd use it all up in no time. What will you do with your share?
        - id: ch01-b53
          speaker: tom
          text: I'll buy a new drum, a real sword, a red necktie, and a bull pup. Then I'll get married.
        - id: ch01-b54
          speaker: huck
          text: Married?
          emotion: surprised
        - id: ch01-b55
          speaker: tom
          text: That's right.
        - id: ch01-b56
          speaker: huck
          text: Tom, you can't be in your right mind.
        - id: ch01-b57
          speaker: tom
          text: Just wait. You'll see.
        - id: ch01-b58
          speaker: huck
          text: That's the most foolish thing you could do. Look at Pap and my mother. They fought all the time. I remember it well.
        - id: ch01-b59
          speaker: tom
          text: That doesn't prove anything. The girl I'm marrying won't fight.
        - id: ch01-b60
          speaker: huck
          text: I reckon they're all alike. Every one of them will knock you around. You'd better think about this, Tom. I'm telling you, you'd better. What's the girl's name?
        - id: ch01-b61
          speaker: tom
          text: Don't call her a gal. She's a girl.
        - id: ch01-b62
          speaker: huck
          text: Seems the same to me. Some people say gal and some say girl. I reckon either one works. But what's her name?
        - id: ch01-b63
          speaker: tom
          text: I'll tell you another time. Not now.
        - id: ch01-b64
          speaker: huck
          text: All right, then. Only if you get married, I'll be lonelier than ever.
          emotion: sad
        - id: ch01-b65
          speaker: tom
          text: No, you won't. You'll come live with me. Now get up, and let's start digging.
        - id: ch01-b66
          speaker: narrator
          text: They dug and sweated for half an hour without finding anything. They worked for another half hour. Still nothing.
        - id: ch01-b67
          speaker: huck
          text: Do they always bury treasure this deep?
        - id: ch01-b68
          speaker: tom
          text: Sometimes, but not always. Usually they don't. I reckon we picked the wrong place.
        - id: ch01-b69
          speaker: narrator
          text: They chose another spot and started over. The work dragged now, but they still made progress. They kept at it in silence for quite a while. At last Huck rested on his shovel and wiped the beads of sweat from his forehead with his sleeve.
        - id: ch01-b70
          speaker: huck
          text: After we finish with this tree, where will we dig next?
        - id: ch01-b71
          speaker: tom
          text: Maybe we'll try that old tree on Cardiff Hill, behind the widow's place.
        - id: ch01-b72
          speaker: huck
          text: That sounds like a good one. But it's on her land. Won't the widow take the treasure from us?
        - id: ch01-b73
          speaker: tom
          text: Her, take it? I'd like to see her try. Hidden treasure belongs to whoever finds it. It doesn't matter whose land it's under.
        - id: ch01-b74
          speaker: narrator
          text: That answer satisfied Huck, and they went on digging. After a while, he spoke again.
        - id: ch01-b75
          speaker: huck
          text: Confound it, we're in the wrong place again. Don't you think so?
        - id: ch01-b76
          speaker: tom
          text: It is strange, Huck. I don't understand it. Sometimes witches meddle with things. Maybe that's our trouble.
        - id: ch01-b77
          speaker: huck
          text: Nonsense. Witches don't have any power during the day.
        - id: ch01-b78
          speaker: tom
          text: You're right. I forgot that. Wait, now I know what's wrong! What fools we've been. You have to see where the limb's shadow falls at midnight. That's where you dig!
        - id: ch01-b79
          speaker: huck
          text: Then we've wasted all this work for nothing. Now we have to walk all the way back here tonight. Can you get out of your house?
        - id: ch01-b80
          speaker: tom
          text: You bet I can. And it has to be tonight. If anyone sees these holes, they'll know at once what's here and come after it.
        - id: ch01-b81
          speaker: huck
          text: All right. I'll come around and meow tonight.
        - id: ch01-b82
          speaker: tom
          text: Good. Let's hide the tools in the bushes.
        - id: ch01-b83
          speaker: narrator
          text: The boys returned that night around the agreed time and sat waiting in the shadows. It was a lonely place, and old stories made the midnight hour feel grim. The leaves rustled as if spirits whispered in them. Ghosts seemed to hide in every dark corner. Far away, a hound gave a deep howl, and an owl answered with a hollow cry. The boys felt the weight of it all and said very little.
        - id: ch01-b84
          speaker: narrator
          text: At last they decided midnight had come. They marked the place where the branch's shadow fell and began digging. Their hopes rose, and the more excited they became, the harder they worked. The hole grew deeper and deeper. Each time the pick struck something, their hearts jumped. Each time, it was only a stone or a lump of earth.
        - id: ch01-b85
          speaker: tom
          text: It's no use, Huck. We're wrong again.
        - id: ch01-b86
          speaker: huck
          text: But we can't be wrong. We marked the shadow exactly.
        - id: ch01-b87
          speaker: tom
          text: I know, but there's something else.
        - id: ch01-b88
          speaker: huck
          text: What is it?
        - id: ch01-b89
          speaker: tom
          text: We only guessed the time. We were probably too early or too late.
        - id: ch01-b90
          speaker: narrator
          text: Huck let his shovel fall.
        - id: ch01-b91
          speaker: huck
          text: That's it. That's exactly what went wrong. We'll have to give this place up. We can never know the right time. And this is too awful anyway, coming here at night with witches and ghosts fluttering all around. I keep feeling something behind me, but I'm afraid to turn around. There might be something else in front of me, waiting for its chance. I've had chills crawling over me ever since we got here.
          emotion: fearful
        - id: ch01-b92
          speaker: tom
          text: I've felt almost the same way. When robbers bury treasure under a tree, they usually put a dead man in with it to guard it.
        - id: ch01-b93
          speaker: huck
          text: Good Lord!
          emotion: fearful
        - id: ch01-b94
          speaker: tom
          text: They do. That's what I've always heard.
        - id: ch01-b95
          speaker: huck
          text: Tom, I don't care to fool around where dead people are. You're sure to get in trouble with them.
          emotion: fearful
        - id: ch01-b96
          speaker: tom
          text: I don't want to disturb them either. What if the one down here stuck his skull out and spoke to us?
          emotion: fearful
        - id: ch01-b97
          speaker: huck
          text: Don't say that, Tom! It's horrible.
          emotion: fearful
        - id: ch01-b98
          speaker: tom
          text: It really is. Huck, I don't feel safe here at all.
          emotion: fearful
        - id: ch01-b99
          speaker: huck
          text: Then let's leave this place and try somewhere else.
        - id: ch01-b100
          speaker: tom
          text: All right. I reckon we'd better.
        - id: ch01-b101
          speaker: huck
          text: Where will we go?
        - id: ch01-b102
          speaker: narrator
          text: Tom thought for a moment.
        - id: ch01-b103
          speaker: tom
          text: The haunted house. That's the place!
        - id: ch01-b104
          speaker: huck
          text: Confound it, Tom, I don't like haunted houses. They're much worse than dead people. A dead person might speak, maybe. But dead people don't glide around in shrouds when you aren't looking, then peer over your shoulder and grind their teeth at you. I couldn't stand that. Nobody could.
          emotion: fearful
        - id: ch01-b105
          speaker: tom
          text: Yes, but ghosts only wander around at night. They won't stop us from digging there in daylight.
        - id: ch01-b106
          speaker: huck
          text: That's true. Still, you know nobody goes near that haunted house, day or night.
        - id: ch01-b107
          speaker: tom
          text: Mostly that's because a man was murdered there, and people don't like places like that. But nothing has ever been seen around the house during the day. At night there are only blue lights sliding past the windows, not proper ghosts.
        - id: ch01-b108
          speaker: huck
          text: Whenever you see one of those blue lights flickering around, you can be sure a ghost is close behind it. That only makes sense. Nobody but ghosts uses them.
        - id: ch01-b109
          speaker: tom
          text: I suppose that's true. But ghosts don't come out in daylight, so why should we be afraid?
        - id: ch01-b110
          speaker: huck
          text: All right. If you say so, we'll try the haunted house. But I reckon we're taking a chance.
        - id: ch01-b111
          speaker: narrator
          text: By then, the boys were walking down the hill. In the middle of the moonlit valley below stood the haunted house, completely alone. Its fences had disappeared long ago. Thick weeds covered the very doorstep. The chimney had crumbled, the window frames stood empty, and one corner of the roof had fallen in.
        - id: ch01-b112
          speaker: narrator
          text: The boys stared at it for a while, half expecting a blue light to slip past a window. Then they spoke in low voices, as the hour and the place seemed to demand. They turned far to the right, giving the haunted house plenty of room, and went home through the woods behind Cardiff Hill.
