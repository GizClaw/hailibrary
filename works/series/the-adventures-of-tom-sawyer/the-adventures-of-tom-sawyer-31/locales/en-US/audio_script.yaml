audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry sense of humor
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
    tom:
      display_name: Tom Sawyer
      tts:
        delivery: spirited and resourceful, with confidence that strains under fear
        timbre: clear and youthful
        pace: quick and responsive
        pitch: medium-high
    becky:
      display_name: Becky Thatcher
      tts:
        delivery: openhearted and youthful, shifting naturally from wonder to distress
        timbre: bright and gentle
        pace: moderate with breathless turns
        pitch: high
  chapters:
    - id: ch01
      title: Wonders in the Cave
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Now we return to Tom and Becky's part in the picnic. They followed the others through the dim passages and visited the cave's familiar wonders. Each one had been given a rather grand name, such as the Drawing-Room, the Cathedral, or Aladdin's Palace. Before long, everyone began playing hide-and-seek. Tom and Becky joined in eagerly, until all that running started to tire them.
        - id: ch01-b02
          speaker: narrator
          text: Then the two of them wandered down a twisting passage, holding their candles high. The rocky walls were covered in a tangled pattern of names, dates, addresses, and sayings, all written in candle smoke. They walked and talked without noticing that the smoky writing had disappeared from the walls. Under a shelf of rock, they added their own names and kept going.
        - id: ch01-b03
          speaker: narrator
          text: Soon they found a thin stream trickling over a ledge. Through the slow ages, its limestone had formed a lacy, ruffled Niagara of shining stone. Tom squeezed behind it and held up his candle so Becky could admire it. There he discovered that the stone curtain hid a steep natural stairway between two narrow walls. At once, he wanted to become an explorer.
        - id: ch01-b04
          speaker: narrator
          text: Tom called to Becky, and she came after him. They left a smoke mark to guide them back, then set off into the cave's secret depths. They twisted this way and that, made another mark far below, and took a new branch in search of wonders they could describe to everyone above.
        - id: ch01-b05
          speaker: narrator
          text: One passage opened into a huge cavern. From its ceiling hung crowds of gleaming stalactites, each as long and thick as a man's leg. Tom and Becky walked all around, staring up in wonder. Then they chose one of the many passages leading out.
        - id: ch01-b06
          speaker: narrator
          text: That passage soon brought them to a lovely spring. Glittering crystals covered its basin like frost. All around it stood strange pillars, formed where great stalactites and stalagmites had met after centuries of dripping water.
        - id: ch01-b07
          speaker: narrator
          text: Above them, thousands of bats were packed into enormous clusters. The candlelight disturbed them. Hundreds dropped from the roof at once, squeaking and darting furiously at the flames. Tom knew what bats could do to a candle, so he grabbed Becky's hand and rushed into the first open corridor. They escaped just in time. As Becky passed out of the cavern, a bat's wing struck her candle out.
        - id: ch01-b08
          speaker: narrator
          text: The bats chased them for a long way. The children plunged into one new passage after another until they finally escaped the creatures. Not long afterward, Tom found an underground lake. Its dim waters stretched away until their shape vanished into shadow. He wanted to follow the shore, but decided they should rest first.
        - id: ch01-b09
          speaker: narrator
          text: For the first time, the cave's deep stillness settled coldly over both children.
        - id: ch01-b10
          speaker: becky
          text: Tom, I didn't notice before, but it feels like such a long time since we heard anyone else.
        - id: ch01-b11
          speaker: tom
          text: Now that you mention it, we're far below them, Becky. And I don't know how far north or south or east we've gone. There's no way we'd hear them from here.
        - id: ch01-b12
          speaker: narrator
          text: Becky began to worry.
        - id: ch01-b13
          speaker: becky
          text: How long have we been down here? We should start back.
        - id: ch01-b14
          speaker: tom
          text: Yes. I think we'd better. We really should.
        - id: ch01-b15
          speaker: becky
          text: Can you find the way, Tom? Every passage looks tangled up with every other one.
        - id: ch01-b16
          speaker: tom
          text: I think I could, except for those bats. If they put out our candles, we'd be in terrible trouble. Let's find another way around them.
        - id: ch01-b17
          speaker: becky
          text: All right. I only hope we don't get lost. That would be awful.
          emotion: fearful
        - id: ch01-b18
          speaker: narrator
          text: Becky shuddered at the thought. Then they started down another corridor.
    - id: ch02
      title: Lost
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They went a long way without speaking. At every opening, they looked for something familiar, but each passage seemed strange. Whenever Tom stopped to examine one, Becky searched his face for some sign of hope.
        - id: ch02-b02
          speaker: tom
          text: It's all right. This isn't the passage, but we'll find it any minute.
        - id: ch02-b03
          speaker: narrator
          text: Each failure left Tom with less hope. Soon he was choosing turns at random, desperate to stumble upon the way they needed. He kept saying everything was all right, but dread lay heavy in his heart. Now the words sounded as though he meant that everything was lost. Becky clung to him in terror. She tried to hold back her tears, but could not.
        - id: ch02-b04
          speaker: becky
          text: Tom, forget the bats. Let's go back the other way. Every turn we take only makes things worse.
          emotion: fearful
        - id: ch02-b05
          speaker: tom
          text: Listen!
        - id: ch02-b06
          speaker: narrator
          text: The silence was so complete that they could hear their own breathing. Tom shouted. His call rolled through the empty passages and faded far away into a sound like a ripple of mocking laughter.
        - id: ch02-b07
          speaker: becky
          text: Oh, Tom, please don't do that again. It sounds horrible.
          emotion: fearful
        - id: ch02-b08
          speaker: tom
          text: It does, but I have to try. Someone might hear us.
        - id: ch02-b09
          speaker: narrator
          text: He shouted once more. That word, might, was even colder than the ghostly echo. It showed how little hope remained. The children stood still and listened. Nothing answered.
        - id: ch02-b10
          speaker: narrator
          text: Tom immediately turned back and hurried on. Before long, Becky saw him hesitate. That small change revealed another terrible fact. He could no longer find the way they had come.
        - id: ch02-b11
          speaker: becky
          text: Oh, Tom! You didn't leave any marks!
          emotion: fearful
        - id: ch02-b12
          speaker: tom
          text: Becky, I was a fool. I never thought we'd need to come back this way. No, I can't find it now. Everything is mixed up.
        - id: ch02-b13
          speaker: becky
          text: Tom, we're lost! We'll never get out of this awful place. Why did we ever leave the others?
          emotion: fearful
        - id: ch02-b14
          speaker: narrator
          text: She sank to the ground and cried so wildly that Tom feared she might die or lose her senses. He sat beside her and held her. Becky buried her face against him, clung tightly, and poured out all her fear and useless regret. Far-off echoes turned every cry into jeering laughter.
        - id: ch02-b15
          speaker: narrator
          text: Tom begged her to hope again, but Becky said she could not. Then he began blaming himself for bringing her into such misery. That helped her more. She said she would try to hope. She would get up and follow wherever he led, if only he stopped speaking that way. She told him he was no more at fault than she was.
        - id: ch02-b16
          speaker: narrator
          text: So they moved on with no plan at all. Moving was the only thing they could do. For a little while, hope seemed to return. There was no reason for it. Hope simply rises again in the young, before years of failure have worn out its spring.
        - id: ch02-b17
          speaker: narrator
          text: After a time, Tom took Becky's candle and blew it out. That small act of saving meant everything, and neither child needed to say so. Becky knew Tom still had one whole candle and three or four candle pieces in his pockets. If he had begun to save light already, their danger must be great. Her hope died again.
        - id: ch02-b18
          speaker: narrator
          text: Weariness soon made its own demand. The children fought against it. With time now so precious, sitting down felt dreadful. If they kept moving in any direction, at least they were making progress, and perhaps it might lead somewhere. To stop felt like inviting death to catch them sooner.
        - id: ch02-b19
          speaker: narrator
          text: At last, Becky's weak legs would carry her no farther. She sat, and Tom rested beside her. They spoke of home, their friends, their comfortable beds, and most of all, the light. Becky cried. Tom tried to comfort her, but he had used every hopeful promise so often that now each one sounded cruel.
        - id: ch02-b20
          speaker: narrator
          text: Becky was so exhausted that she fell asleep. Tom was thankful. He watched the strain leave her face as pleasant dreams made it look smooth and natural again. Soon a smile appeared and stayed there. Some of that peace reached Tom, and his mind drifted toward old times and dreamy memories.
        - id: ch02-b21
          speaker: narrator
          text: Then Becky woke with a light little laugh. It died on her lips at once, and a groan followed.
        - id: ch02-b22
          speaker: becky
          text: How could I fall asleep? I wish I'd never, never woken up! No, Tom, I don't mean that. Please don't look at me like that. I won't say it again.
          emotion: sad
        - id: ch02-b23
          speaker: tom
          text: I'm glad you slept, Becky. You're more rested now, and we'll find the way out.
        - id: ch02-b24
          speaker: becky
          text: We can try. But I saw such a beautiful country in my dream. I think that's where we're going.
          emotion: sad
        - id: ch02-b25
          speaker: tom
          text: Maybe we're not. Come on, Becky. Let's keep trying.
        - id: ch02-b26
          speaker: narrator
          text: They stood and wandered onward, hopeless and hand in hand.
    - id: ch03
      title: The Last Candle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: They tried to guess how long they had been underground. It felt like days or weeks, though that could not be true because they still had candles. Much later, though neither knew how much later, Tom said they must walk softly and listen for dripping water. They needed to find a spring.
        - id: ch03-b02
          speaker: narrator
          text: Soon they found one, and Tom said they should rest again. Both children were painfully tired, but Becky thought she could go a little farther. She could not understand why Tom said no. They sat down, and he used clay to fasten his candle to the wall in front of them. For a while, they thought in silence.
        - id: ch03-b03
          speaker: becky
          text: Tom, I'm so hungry.
        - id: ch03-b04
          speaker: narrator
          text: Tom took something from his pocket.
        - id: ch03-b05
          speaker: tom
          text: Do you remember this?
        - id: ch03-b06
          speaker: narrator
          text: Becky almost smiled.
        - id: ch03-b07
          speaker: becky
          text: It's our wedding cake, Tom.
        - id: ch03-b08
          speaker: tom
          text: Yes. I wish it were as big as a barrel, because it's all the food we have.
        - id: ch03-b09
          speaker: becky
          text: I saved it from the picnic so we could dream on it, the way grown-ups do with wedding cake. But now it'll be our...
        - id: ch03-b10
          speaker: narrator
          text: She could not finish. Tom divided the cake. Becky ate her share eagerly, while Tom only nibbled at his half. They had plenty of cold water to drink with their little feast.
        - id: ch03-b11
          speaker: narrator
          text: After a while, Becky suggested that they move on. Tom said nothing for a moment.
        - id: ch03-b12
          speaker: tom
          text: Becky, can you stand it if I tell you something?
        - id: ch03-b13
          speaker: narrator
          text: Becky's face turned pale, but she said she could.
        - id: ch03-b14
          speaker: tom
          text: Then we have to stay here, where there's water. This little piece is our last candle.
        - id: ch03-b15
          speaker: narrator
          text: Becky broke into tears and wails. Tom did everything he could to soothe her, but little of it helped. At last, she spoke again.
        - id: ch03-b16
          speaker: becky
          text: Tom, I need to ask you something.
        - id: ch03-b17
          speaker: tom
          text: What is it, Becky?
        - id: ch03-b18
          speaker: becky
          text: They'll notice we're gone. They'll come looking for us!
        - id: ch03-b19
          speaker: tom
          text: Yes, they will. Of course they will!
        - id: ch03-b20
          speaker: becky
          text: Maybe they're searching for us right now.
        - id: ch03-b21
          speaker: tom
          text: They might be. I hope they are.
        - id: ch03-b22
          speaker: becky
          text: When will they notice, Tom?
        - id: ch03-b23
          speaker: tom
          text: Probably when they get back to the boat.
        - id: ch03-b24
          speaker: becky
          text: But it may be dark by then. Will they see that we aren't there?
        - id: ch03-b25
          speaker: tom
          text: I don't know. Your mother will miss you as soon as everyone gets home, anyway.
        - id: ch03-b26
          speaker: narrator
          text: Fear flashed across Becky's face, and Tom suddenly understood his mistake. Becky was not supposed to go home that night. Both children fell silent. Then Becky began grieving all over again. The thought Tom had just had was now in her mind, too. Sunday morning might be half over before Mrs. Thatcher learned that Becky had never reached Mrs. Harper's house.
        - id: ch03-b27
          speaker: narrator
          text: The children fixed their eyes on the candle stub. It melted slowly and without mercy. At last, half an inch of bare wick stood alone. The weak flame rose and sank, climbed a thin thread of smoke, and rested for one moment at the top. Then it went out, and the horror of utter darkness ruled the cave.
        - id: ch03-b28
          speaker: narrator
          text: Neither child ever knew how much later Becky slowly realized that she was crying in Tom's arms. After what seemed like an enormous stretch of time, both woke from a heavy stupor of sleep and returned to their misery.
        - id: ch03-b29
          speaker: narrator
          text: Tom said it might be Sunday by now, or even Monday. He tried to make Becky talk, but her grief was too heavy and every hope was gone. He reminded her that people must have missed them long ago. The search was surely under way. He would shout, and perhaps someone would come.
        - id: ch03-b30
          speaker: narrator
          text: Tom called out. In the darkness, the distant echoes sounded so hideous that he did not try again.
        - id: ch03-b31
          speaker: narrator
          text: The hours slipped away, and hunger returned to torment them. Part of Tom's half of the cake remained. They divided it and ate, but the poor little morsel only sharpened their hunger.
    - id: ch04
      title: A Voice in the Dark
      blocks:
        - id: ch04-b01
          speaker: tom
          text: Sh! Did you hear that?
          emotion: surprised
        - id: ch04-b02
          speaker: narrator
          text: Both children held their breath. From very far away came something like the faintest shout. Tom answered at once. Holding Becky's hand, he began feeling his way down the corridor toward the sound. He stopped to listen again. The call came once more, and now it seemed a little closer.
        - id: ch04-b03
          speaker: tom
          text: It's the searchers! They're coming. Hurry, Becky, we're safe now!
          emotion: happy
        - id: ch04-b04
          speaker: narrator
          text: Joy almost overwhelmed the prisoners. Still, they could move only slowly. Hidden pits were common, and each step had to be tested. Soon they reached one and could go no farther. It might have been three feet deep or a hundred. Tom lay on his chest and reached down as far as he could, but felt no bottom.
        - id: ch04-b05
          speaker: narrator
          text: They had to wait there for the searchers. But as they listened, the distant shouts grew fainter. A moment or two later, the sounds disappeared completely. Their hearts sank. Tom called until his voice was hoarse, but no one answered. He tried to speak hopefully to Becky. They waited in misery for what felt like an age, and the voices never returned.
        - id: ch04-b06
          speaker: narrator
          text: The children felt their way back to the spring. Weary hours dragged past. They slept again, then woke starving and full of sorrow. Tom thought it must be Tuesday by now.
        - id: ch04-b07
          speaker: narrator
          text: Then he had an idea. Several side passages opened nearby, and exploring them would be better than sitting beneath the weight of time. Tom took a kite string from his pocket and tied one end to a point of rock. With Tom leading and unwinding the line, he and Becky started into one of the passages.
        - id: ch04-b08
          speaker: narrator
          text: After twenty steps, the floor ended at another drop. Tom went down on his knees and felt below it. Then he reached around the corner as far as he comfortably could. He stretched his hand just a little farther to the right.
        - id: ch04-b09
          speaker: narrator
          text: At that instant, less than twenty yards away, a human hand appeared from behind a rock. It held a candle. Tom gave a glorious shout. Then the owner of the hand stepped into view. It was Injun Joe.
        - id: ch04-b10
          speaker: narrator
          text: Tom froze and could not move. A moment later, he was deeply relieved to see the Spaniard turn and run out of sight. Tom wondered why Joe had not recognized his voice and come to kill him for testifying in court. The echoes must have disguised it. Tom felt sure that was the reason.
        - id: ch04-b11
          speaker: narrator
          text: Terror had drained all the strength from Tom's body. He decided that if he could make it back to the spring, he would stay there. Nothing would persuade him to risk meeting Injun Joe again. He took care not to tell Becky what he had seen.
        - id: ch04-b12
          speaker: tom
          text: I only shouted to see if it would bring us luck.
    - id: ch05
      title: Tom Sets Out Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: In the end, though, hunger and misery proved stronger than fear. The children waited through more dreary hours at the spring and slept another long sleep. When they woke, hunger was raging through them. Tom guessed that it might be Wednesday or Thursday, or even Friday or Saturday. Perhaps the search had already been abandoned.
        - id: ch05-b02
          speaker: narrator
          text: Tom suggested exploring another passage. By now, he was ready to risk Injun Joe and every other terror. But Becky had grown terribly weak. She had fallen into a hopeless dullness, and nothing could stir her.
        - id: ch05-b03
          speaker: becky
          text: I'll stay here now and die. It won't be long. You can take the kite string and explore if you want. Only come back often and speak to me. And promise that when the terrible time comes, you'll stay beside me and hold my hand until it's over.
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: Tom kissed her, struggling against the tightness in his throat. He pretended to feel certain he would find the searchers or discover a way out. Then he took the kite string and crawled into one of the passages on his hands and knees. Hunger tormented him, and he was sick with the fear that death was coming.
