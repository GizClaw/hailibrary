audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    becky:
      display_name: 贝琪·撒切尔
      tts:
        delivery: 明快热情，犹豫时略带迟疑
        timbre: 清脆的少女声
        pace: 轻快
        pitch: 中高音
    tom:
      display_name: 汤姆
      tts:
        delivery: 聪明好胜，兴奋时语速加快，害怕时压低声音
        timbre: 清亮的少年声
        pace: 轻快灵活
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 现在该说说野餐那天，汤姆和贝琪遇上了什么。起初，他们还跟着大伙儿在昏暗的洞里游览。那些熟悉的奇景都有响亮得过头的名字，什么“客厅”“大教堂”“阿拉丁宫殿”，一个接一个。后来大家玩起捉迷藏，两个孩子跑得兴致勃勃，直到有些累了，才举着蜡烛，独自拐进一条弯弯曲曲的通道。
        - id: ch01-b02
          speaker: narrator
          text: 岩壁上到处是游客用烛烟熏下的人名、日期、地址和格言，密得像一张乱糟糟的大网。汤姆和贝琪边走边看，边走边聊，根本没发觉周围的石壁已经变得干干净净。他们也在一块突出的石架下面熏上自己的名字，然后继续向前。
        - id: ch01-b03
          speaker: narrator
          text: 不久，一道细流出现在前面。它从石崖边缘慢慢淌落，千百年来带着石灰一层层沉积，最后凝成一道闪亮的石瀑布。那瀑布带着花边和褶皱，像尼亚加拉瀑布一样，却永远不会消失。汤姆挤到石瀑后面，想从里面照亮它，让贝琪看个清楚。没想到，后面竟藏着一条陡峭的天然石阶，两旁还夹着窄窄的石壁。汤姆一见，立刻想当一回探险家。
        - id: ch01-b04
          speaker: narrator
          text: 贝琪应声赶来。他们先用烛烟留下记号，便沿着石阶走进洞穴不为人知的深处。两个人左拐右绕，一路向下，又留下一处记号，再钻进岔道。他们一心想找些从没人见过的奇景，将来好讲给地面上的人听。
        - id: ch01-b05
          speaker: narrator
          text: 他们走进一座宽阔的洞厅。洞顶垂着无数根亮晶晶的钟乳石，每一根都像人的腿一样又长又粗。两个孩子惊叹着四处看了一遍，又从许多出口里选了一条。没走多久，眼前出现一眼迷人的泉水。泉池边结满霜花似的水晶，四周则立着一根根奇形怪状的石柱。千万年里，水滴不停落下，让钟乳石和石笋慢慢接在一起，才长成这些柱子。
        - id: ch01-b06
          speaker: narrator
          text: 洞顶下面还挤着一团团蝙蝠，一团就有成千上万只。烛光一晃，几百只蝙蝠尖叫着扑了下来，直冲蜡烛乱撞。汤姆知道这有多危险，一把抓住贝琪，冲进迎面第一条通道。他们刚刚逃出洞厅，一只蝙蝠的翅膀便扫灭了贝琪的烛火。蝙蝠又追了很远，两个孩子见到岔路就钻，终于把它们甩掉。
        - id: ch01-b07
          speaker: narrator
          text: 接着，汤姆发现了一座地下湖。昏暗的湖面一直伸向远方，最后没进阴影，连轮廓都看不见了。他本想沿着湖边探查，可还是决定先坐下歇一会儿。四周一静，洞穴深处那股阴冷黏湿的死寂，才第一次紧紧攫住了两个孩子的心。
        - id: ch01-b08
          speaker: becky
          text: 咦，我刚才一直没留意。我们是不是好久没听见别人说话了？
        - id: ch01-b09
          speaker: tom
          text: 这么一说，我们是在他们下面很深的地方。可往北还是往南，往东还是别的方向，我也弄不清。离得这么远，他们听不到我们的声音。
        - id: ch01-b10
          speaker: narrator
          text: 贝琪心里害怕起来。
        - id: ch01-b11
          speaker: becky
          text: 汤姆，我们下来多久了？还是往回走吧。
        - id: ch01-b12
          speaker: tom
          text: 对，我看是该回去了。嗯，咱们还是回去吧。
        - id: ch01-b13
          speaker: becky
          text: 你还找得到路吗？这些通道弯来绕去，在我眼里全混成一团了。
        - id: ch01-b14
          speaker: tom
          text: 我想能找到。不过还得经过那些蝙蝠。它们要是把蜡烛扑灭，我们就真没办法了。咱们换条路走，别从那里回去。
        - id: ch01-b15
          speaker: becky
          text: 那好吧。可咱们千万不能迷路，那太可怕了！
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: 两个人走进另一条通道，默默走了很久。每逢遇见岔口，他们都仔细看看，有没有一点熟悉的模样。可所有地方都很陌生。汤姆每次察看，贝琪都盯住他的脸，盼着从那里找到一点叫人安心的神色。
        - id: ch01-b17
          speaker: tom
          text: 没事，不是这一条。不过别担心，我们马上就能找到。
        - id: ch01-b18
          speaker: narrator
          text: 每找错一次，汤姆心里的希望就少一分。没过多久，他已经是在一道道岔路间乱拐了，只求侥幸撞上那条正确的路。他嘴里依旧说着没事，心头却压着铅一样沉的恐惧。听在耳里，那两个字简直变成了“全完了”。贝琪紧紧贴在他身边，拼命忍着眼泪，可泪水还是掉了下来。
        - id: ch01-b19
          speaker: becky
          text: 汤姆，别再管蝙蝠了。咱们从原路回去吧！这样走下去，只会越来越糟。
          emotion: fearful
        - id: ch01-b20
          speaker: tom
          text: 听！
        - id: ch01-b21
          speaker: narrator
          text: 四周静得连两人的呼吸都听得清清楚楚。汤姆大喊一声，声音沿着空荡荡的通道传远，又慢慢消失。最后那一点回声，听起来竟像有人在远处轻声嘲笑他们。
        - id: ch01-b22
          speaker: becky
          text: 汤姆，别再喊了。那声音太吓人了。
          emotion: fearful
        - id: ch01-b23
          speaker: tom
          text: 是很吓人，可我还得喊。说不定他们能听见我们呢。
        - id: ch01-b24
          speaker: narrator
          text: 汤姆又喊了一次。可他那句“说不定”，比鬼笑似的回声更叫人心寒，因为连他也快没有希望了。两个孩子站着细听，始终没有回应。汤姆立刻回头，加快了脚步。没过多久，他举止间露出一丝迟疑。贝琪看懂了另一个可怕的事实。他连刚才走过的路也找不到了。
        - id: ch01-b25
          speaker: becky
          text: 汤姆，你一路上没有留下记号！
          emotion: fearful
        - id: ch01-b26
          speaker: tom
          text: 贝琪，我真是个傻瓜！我根本没想到还会走回来。现在我找不到路了，这些通道全乱了。
          emotion: fearful
        - id: ch01-b27
          speaker: becky
          text: 汤姆，我们迷路了！我们再也出不去了！这个地方这么可怕，我们为什么要离开大家呀！
          emotion: fearful
        - id: ch01-b28
          speaker: narrator
          text: 贝琪一下瘫坐在地，失声痛哭，几乎哭得发了狂。汤姆吓得不知怎么办，生怕她会死去，或者失去神智。他坐到贝琪身边，用双臂抱住她。贝琪把脸埋在他胸前，紧紧攀着他，把心里的恐惧和悔恨全哭了出来。远远近近的回声却把哭声变成了讥笑。
        - id: ch01-b29
          speaker: narrator
          text: 汤姆求她重新鼓起希望，她却说自己做不到。于是汤姆开始责怪自己，说都是他害两人落到这个地步。这话反倒让贝琪振作了一点。她说，只要汤姆别再那样责备自己，她就愿意再试着抱住希望。不管他往哪里走，她都会站起来跟着，因为这件事不能只怪汤姆，她也一样有责任。
        - id: ch01-b30
          speaker: narrator
          text: 两个人又走了起来，没有目标，只能随意摸索。他们现在唯一能做的，就是不停地走。有那么一阵，希望仿佛又活了过来。不是因为有了什么根据，只是希望本来就这样。只要年岁和一次次失败还没抽走它的发条，它总会自己重新弹起。
        - id: ch01-b31
          speaker: narrator
          text: 过了一会儿，汤姆拿过贝琪的蜡烛，轻轻吹灭。这个动作是什么意思，根本不用解释。贝琪知道，汤姆还有一整支蜡烛和三四截蜡头藏在口袋里。可现在，连这些也非节省不可了。她才重新燃起的希望，又熄灭了。
        - id: ch01-b32
          speaker: narrator
          text: 疲倦也开始向他们讨债。两个孩子不愿坐下，因为时间已经珍贵得吓人。只要还在走，无论朝哪个方向，好歹算是在前进，也许就能找到出路。坐下来，却好像是在请死亡快些追上他们。
        - id: ch01-b33
          speaker: narrator
          text: 最后，贝琪的双腿再也撑不住了。她坐下来，汤姆也陪着她。他们说起家，说起亲友，说起舒服的床铺，最想念的还是光明。贝琪不停地哭。汤姆那些安慰的话已经说了一遍又一遍，磨得再也没有力量，听起来反倒像在讥讽她。
        - id: ch01-b34
          speaker: narrator
          text: 贝琪实在太累，慢慢睡着了。汤姆看着她紧绷憔悴的脸在梦里一点点舒展开来，恢复成平日的模样。后来，一丝微笑停在了她脸上。汤姆望着那张安静的小脸，自己也得到一点安宁，思绪渐渐飘回从前。贝琪忽然带着一声轻快的小笑醒来，可笑声刚到唇边便死去了，紧接着变成一声呻吟。
        - id: ch01-b35
          speaker: becky
          text: 我怎么能睡着呢！我真希望自己永远别醒过来！不，我不是真的这么想。汤姆，别那样看我，我再也不说这种话了。
          emotion: sad
        - id: ch01-b36
          speaker: tom
          text: 我倒高兴你睡了一觉。现在你有精神了，咱们一定能找到出去的路。
        - id: ch01-b37
          speaker: becky
          text: 我们可以再找找。可我刚才梦见了一个那么美的地方。我想，我们就要到那里去了。
          emotion: sad
        - id: ch01-b38
          speaker: tom
          text: 不一定，真的不一定。打起精神来，咱们接着找。
        - id: ch01-b39
          speaker: narrator
          text: 他们站起身，手拉着手，绝望地继续游荡。两个人猜不出在洞里待了多久，只觉得像是过了好几天，甚至好几个星期。可蜡烛还没有用完，所以绝不可能真有那么久。又走了很长时间，汤姆说，他们得放轻脚步，仔细听哪里有滴水声。他们必须找到一眼泉。
        - id: ch01-b40
          speaker: narrator
          text: 不久，他们真的找到了一处泉水。汤姆说，该再休息一次了。两个人都累得苦不堪言，贝琪却以为自己还能多走一段。汤姆不同意，她听了很吃惊，也不明白为什么。他们坐下来。汤姆拿黏土把蜡烛固定在面前的岩壁上，然后陷入沉思。许久以后，贝琪先开了口。
        - id: ch01-b41
          speaker: becky
          text: 汤姆，我饿极了！
        - id: ch01-b42
          speaker: narrator
          text: 汤姆从口袋里取出一样东西。
        - id: ch01-b43
          speaker: tom
          text: 你还记得这个吗？
        - id: ch01-b44
          speaker: narrator
          text: 贝琪差一点笑出来。
        - id: ch01-b45
          speaker: becky
          text: 是我们的结婚蛋糕。
        - id: ch01-b46
          speaker: tom
          text: 对。我真希望它有一只大木桶那么大，因为咱们只有这一点吃的了。
        - id: ch01-b47
          speaker: becky
          text: 我从野餐会上把它留下来，本来想让咱们像大人那样，把结婚蛋糕放在枕头底下做梦。可现在，它要变成我们的……
          emotion: sad
        - id: ch01-b48
          speaker: narrator
          text: 贝琪没有把话说完。汤姆把蛋糕分成两份。贝琪吃得很香，汤姆却只一点点啃自己的那块。他们又喝了冰凉的泉水，结束了这顿小小的宴席。过了一阵，贝琪提议继续赶路。汤姆沉默了片刻。
        - id: ch01-b49
          speaker: tom
          text: 贝琪，我有件事得告诉你。你受得了吗？
        - id: ch01-b50
          speaker: narrator
          text: 贝琪的脸白了，还是说自己受得住。
        - id: ch01-b51
          speaker: tom
          text: 那好。咱们必须留在这里，因为这里有水喝。刚才那一小截，是最后的蜡烛了。
        - id: ch01-b52
          speaker: narrator
          text: 贝琪放声哭号起来。汤姆想尽办法安慰她，却几乎没有用。她哭了很久，才再次叫他。
        - id: ch01-b53
          speaker: becky
          text: 汤姆，你听我说！
        - id: ch01-b54
          speaker: tom
          text: 怎么了，贝琪？
        - id: ch01-b55
          speaker: becky
          text: 他们会发现我们不见了，会来找我们的！
        - id: ch01-b56
          speaker: tom
          text: 会的，他们一定会！
        - id: ch01-b57
          speaker: becky
          text: 也许他们现在已经在找了。
        - id: ch01-b58
          speaker: tom
          text: 对，很可能已经开始找了。我真希望他们已经来了。
        - id: ch01-b59
          speaker: becky
          text: 他们什么时候才会发现我们不见了？
        - id: ch01-b60
          speaker: tom
          text: 大概等大家回到船上吧。
        - id: ch01-b61
          speaker: becky
          text: 可那时候天也许已经黑了。他们会留意到我们没上船吗？
        - id: ch01-b62
          speaker: tom
          text: 我不知道。不过大家一回到家，你妈妈就会发现你不见了。
        - id: ch01-b63
          speaker: narrator
          text: 贝琪脸上猛然露出惊恐的神色，汤姆这才明白自己说错了。贝琪原本就不打算在那天晚上回家。两个孩子沉默下来。过了一会儿，贝琪又伤心地哭起来。她也想到了，星期日早晨也许已经过去一半，撒切尔太太才会发现女儿没有住在哈珀太太家。
        - id: ch01-b64
          speaker: narrator
          text: 他们死死盯住最后那一小截蜡烛，看它无情地一点点融化。最后，只剩半英寸长的烛芯孤零零立着。微弱的火苗升起又落下，顺着一缕细烟爬到顶端，在那里停了一瞬。接着，伸手不见五指的黑暗带着全部恐怖，统治了整个山洞。
        - id: ch01-b65
          speaker: narrator
          text: 不知过了多久，贝琪才迷迷糊糊地发现，自己正伏在汤姆怀里哭。又像是熬过了无比漫长的一段时间，两人才从死一样的昏睡中醒来，重新面对苦难。汤姆猜，也许已经到了星期日，甚至星期一。他想叫贝琪说说话，可她被悲痛压得透不过气，已经不剩一点希望。
        - id: ch01-b66
          speaker: narrator
          text: 汤姆说，大人们肯定早就发现他们不见了，现在一定正在搜寻。他决定再喊几声，也许会有人循声赶来。可黑暗里，那些遥远的回声听着实在骇人。他试过一次，便不敢再喊了。
        - id: ch01-b67
          speaker: narrator
          text: 一个个钟头白白过去，饥饿又开始折磨两个孩子。汤姆那半块蛋糕还剩一点，他们分着吃了。可这一小口食物只把胃口撩得更凶，两人反而觉得比刚才更饿。
        - id: ch01-b68
          speaker: tom
          text: 嘘！你听见了吗？
          emotion: surprised
        - id: ch01-b69
          speaker: narrator
          text: 两个人屏住呼吸，竖起耳朵。远处仿佛传来一声极轻的呼喊。汤姆马上高声回应，拉住贝琪的手，循着声音在通道里摸索。他又停下听了一次。那呼喊再次传来，好像比刚才近了一点。
        - id: ch01-b70
          speaker: tom
          text: 是他们！他们来找我们了！快走，贝琪，这下咱们得救了！
          emotion: happy
        - id: ch01-b71
          speaker: narrator
          text: 两个被困的孩子欢喜得几乎承受不住。可洞里常有深坑，他们必须小心，所以怎么也走不快。不久，一道坑挡住了去路。它也许只有三英尺深，也许足有一百英尺，反正绝不可能跨过去。汤姆趴在地上，把手尽量往下探，还是摸不到底。他们只好留在这里，等搜寻的人赶到。
        - id: ch01-b72
          speaker: narrator
          text: 可远处的喊声分明越来越远。再过一两分钟，声音完全消失了。那种心往下沉的痛苦，几乎叫人承受不住。汤姆拼命呼喊，直到嗓子沙哑，仍然没有用。他还在对贝琪说着充满希望的话。可两人焦急地等了仿佛整整一个世纪，再也没听见任何声音。
        - id: ch01-b73
          speaker: narrator
          text: 他们摸索着回到泉边。难熬的时间缓缓拖过去。两个孩子又睡了一觉，醒来时饿得发慌，心里也只剩悲苦。汤姆猜，这时大概已经到了星期二。
        - id: ch01-b74
          speaker: narrator
          text: 汤姆忽然有了个主意。附近还有几条岔道，与其闲坐着熬时间，不如去探一探。他从口袋里取出一根风筝线，把一头系在突出的岩石上。接着，他走在前面，一边摸索，一边放线，贝琪跟在后面。才走二十步，通道便来到一处断崖。
        - id: ch01-b75
          speaker: narrator
          text: 汤姆跪下去，先伸手向崖下摸，又把手绕过转角，尽量向右边探远一些。就在这时，不到二十码外，一只握着蜡烛的手从岩石后面伸了出来。汤姆狂喜地大喊一声。紧跟着，那只手的主人也现身了。竟然是印第安乔！
        - id: ch01-b76
          speaker: narrator
          text: 汤姆浑身僵住，动也不能动。可印第安乔拔腿就跑，转眼消失了，他又庆幸极了。汤姆不明白，乔为什么没听出他的声音，也没因为他曾在法庭作证而冲过来杀他。一定是洞里的回声改变了声音，他只能这样解释。
        - id: ch01-b77
          speaker: narrator
          text: 这场惊吓让汤姆全身一点力气也没有了。他暗暗发誓，只要还能回到泉边，就再也不离开。无论什么东西，也休想引诱他再次冒险撞上印第安乔。回去以后，他小心地瞒住贝琪，只说刚才那声大喊是为了碰碰运气。
        - id: ch01-b78
          speaker: narrator
          text: 可饥饿和痛苦到头来总会压倒恐惧。他们在泉边又苦等了一场，再睡过一觉。醒来时，狂暴的饥饿正折磨着两个人。汤姆觉得，现在也许已经是星期三、星期四，甚至星期五或星期六。搜寻的人恐怕早就放弃了。
        - id: ch01-b79
          speaker: narrator
          text: 汤姆打算再探一条通道。此刻，他情愿冒险面对印第安乔和任何可怕的东西。可是贝琪已经虚弱得厉害，整个人沉进凄凉的麻木里，怎么也振作不起来。
        - id: ch01-b80
          speaker: becky
          text: 我不走了。我就在这里等着死，反正也不会太久。你要是愿意，就带着风筝线去找路。可你一定要常常回来，跟我说句话。还要答应我，等那个可怕的时候到了，你会留在我身边，握着我的手，直到一切结束。
          emotion: sad
        - id: ch01-b81
          speaker: narrator
          text: 汤姆吻了吻她，只觉得喉咙被什么堵住了。他还是装得很有信心，说自己一定能找到搜寻的人，或者找到逃出山洞的路。然后，他握住风筝线，趴下身子，用手脚撑着地面，摸进另一条通道。饥饿折磨着他，死亡就要来临的预感也让他心中作呕。
