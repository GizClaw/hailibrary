  chapters:
    - id: ch01
      title: CHAPTER XXXIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Within minutes, the news was everywhere. A dozen skiffs full of men headed for McDougal's cave, followed by a ferryboat crowded with passengers. Tom Sawyer rode in Judge Thatcher's skiff.
        - id: ch01-b02
          speaker: narrator
          text: They unlocked the cave door and saw a sorrowful sight in the dim light. Injun Joe lay dead on the ground with his face close to the crack beneath the door. It seemed that, until his last moment, he had kept his eyes on the light and freedom outside. Tom knew from his own time in the cave how terribly the man had suffered, and he felt pity. Yet he also felt a great rush of relief and safety. Only then did he understand how heavily his fear of Injun Joe had weighed on him ever since he testified against him.
        - id: ch01-b03
          speaker: narrator
          text: Injun Joe's bowie knife lay nearby, broken in two. With long, exhausting labor, he had chipped and hacked through the heavy beam beneath the door. But the work could never have freed him. Outside the beam was a sill of solid rock, and his knife had made no mark on it. The only thing it damaged was the blade itself. Even if he had cut the whole beam away, his body could not have squeezed beneath the door, and he knew it. He must have hacked there simply to keep busy, to fill the weary hours, and to give his suffering mind something to do.
        - id: ch01-b04
          speaker: narrator
          text: Tourists usually left bits of candle in the cracks around the entrance, but none remained. Injun Joe had found and eaten them all. He had caught and eaten a few bats, too. Only their claws were left. He had starved to death.
        - id: ch01-b05
          speaker: narrator
          text: Close by stood the stump of a stalagmite that had been growing for ages from water dripping off a stalactite overhead. Injun Joe had broken it off. On the stump, he placed a stone with a shallow hollow that he had scooped into it to catch the precious water. One drop fell every three minutes with the sad regularity of a clock ticking. In a whole day it made only a spoonful.
        - id: ch01-b06
          speaker: narrator
          text: That drop had been falling when the Pyramids were new, when Troy fell, and when Rome was founded. It fell when Christ was crucified, when the Norman Conqueror founded the British empire, when Columbus sailed, and when the battle at Lexington was fresh news.
        - id: ch01-b07
          speaker: narrator
          text: It is falling now. It will go on falling after those great events have faded into the late afternoon of history, passed through the twilight of legend, and finally disappeared into the night of forgetfulness. Does everything have some purpose? Did that drop fall patiently for five thousand years so it would be ready when one short-lived man needed it? Does it have another important task to perform ten thousand years from now? No matter. Many years have passed since Injun Joe carved that little basin, but visitors to McDougal's cave still stare longest at the sad stone and the slow-falling water. Injun Joe's cup stands first among the cave's wonders. Not even Aladdin's Palace can rival it.
        - id: ch01-b08
          speaker: narrator
          text: Injun Joe was buried near the cave entrance. People came by boat and wagon from towns, farms, and small settlements for seven miles around. They brought their children and every sort of food. They admitted that the funeral had been almost as satisfying as the hanging would have been.
        - id: ch01-b09
          speaker: narrator
          text: The funeral also stopped the pardon petition from gaining any more names. Many people had already signed it. There had been tearful, eloquent meetings, and a committee of foolish women planned to dress in deep mourning, weep around the governor, and beg him to be merciful enough to trample his duty underfoot. Injun Joe was thought to have killed five villagers, but what did that matter to them? Even if he had been Satan himself, plenty of weak-minded people would still have scribbled their names on a pardon and dropped a tear on the page.
        - id: ch01-b10
          speaker: narrator
          text: The next morning, Tom took Huck aside for an important talk. By then, the Welshman and Widow Douglas had told Huck about Tom's adventure. But Tom said there was one thing they could not have told him, and that was what he wanted to discuss. Huck's face fell.
        - id: ch01-b11
          speaker: huck
          text: I know what happened. You got into Number Two and found nothing but whiskey. Nobody said it was you, but I knew it had to be. And I knew you didn't get the money, because you'd have found some way to tell me even if you kept quiet with everybody else. Tom, I've always had a feeling we'd never get that treasure.
        - id: ch01-b12
          speaker: tom
          text: But Huck, I never gave away that tavern keeper. His tavern was fine on the Saturday of the picnic. Don't you remember? You were supposed to watch it that night.
        - id: ch01-b13
          speaker: huck
          text: Oh, yes. It feels like a year ago. That was the very night I followed Injun Joe to the widow's house.
        - id: ch01-b14
          speaker: tom
          text: You followed him?
          emotion: surprised
        - id: ch01-b15
          speaker: huck
          text: Yes, but don't tell anybody. Injun Joe might have left friends behind, and I don't want them turning against me and playing mean tricks. If it hadn't been for me, he'd be safe in Texas by now.
        - id: ch01-b16
          speaker: narrator
          text: Huck told Tom the whole story in confidence, including everything that had happened when he followed Injun Joe toward the widow's house. Until then, Tom had heard only the Welshman's part. Once the story was finished, Huck returned to the question that mattered most to both of them.
        - id: ch01-b17
          speaker: huck
          text: Anyway, whoever took the whiskey from Number Two must have taken the money, too. It's gone for good, Tom.
        - id: ch01-b18
          speaker: tom
          text: Huck, the money was never in Number Two!
        - id: ch01-b19
          speaker: narrator
          text: Huck studied Tom's face closely.
        - id: ch01-b20
          speaker: huck
          text: What? Tom, did you find the trail again?
          emotion: surprised
        - id: ch01-b21
          speaker: tom
          text: Huck, the money is in the cave!
        - id: ch01-b22
          speaker: narrator
          text: Huck's eyes flashed.
        - id: ch01-b23
          speaker: huck
          text: Say that again, Tom.
        - id: ch01-b24
          speaker: tom
          text: The money is in the cave!
        - id: ch01-b25
          speaker: huck
          text: Now tell me honestly. Are you joking, or do you mean it?
        - id: ch01-b26
          speaker: tom
          text: I mean it, Huck. I've never meant anything more. Will you come with me and help carry it out?
        - id: ch01-b27
          speaker: huck
          text: You bet I will, as long as we can mark our trail and keep from getting lost.
        - id: ch01-b28
          speaker: tom
          text: We can do that easy as anything.
        - id: ch01-b29
          speaker: huck
          text: That's wonderful! But what makes you think the money is there?
        - id: ch01-b30
          speaker: tom
          text: Just wait until we're inside. If we don't find it, you can have my drum and everything else I own. I swear you can.
        - id: ch01-b31
          speaker: huck
          text: That's a bargain. When do we go?
        - id: ch01-b32
          speaker: tom
          text: Right now, if you want. Are you strong enough?
        - id: ch01-b33
          speaker: huck
          text: Is it far inside? I've been up and around for three or four days, but I don't think I can walk more than a mile.
        - id: ch01-b34
          speaker: tom
          text: Anybody else would have to go about five miles through the cave, but I know a very short way. I'll row you straight to it in a skiff, and I'll row us back alone. You won't have to lift a hand.
        - id: ch01-b35
          speaker: huck
          text: Then let's go right now, Tom.
        - id: ch01-b36
          speaker: tom
          text: All right. We'll need bread and meat, our pipes, a couple of little bags, two or three kite strings, and some of those new lucifer matches. I wished for matches plenty of times when I was trapped in there.
        - id: ch01-b37
          speaker: narrator
          text: A little after noon, the boys borrowed a small skiff from a man who was away and set off. When they were several miles below Cave Hollow, Tom pointed toward the shore.
        - id: ch01-b38
          speaker: tom
          text: See how this bluff looks the same all the way down from Cave Hollow? There aren't any houses or wood yards, and all the bushes look alike. But look up there. See that white patch where the earth slid away? That's one of my marks. We'll land here.
        - id: ch01-b39
          speaker: narrator
          text: They went ashore.
        - id: ch01-b40
          speaker: tom
          text: Huck, the hole I escaped through is so close you could touch it with a fishing pole. See if you can find it.
        - id: ch01-b41
          speaker: narrator
          text: Huck searched everywhere and found nothing. Tom proudly pushed into a thick patch of sumac bushes.
        - id: ch01-b42
          speaker: tom
          text: Here it is! Look, Huck. It's the best-hidden hole in the whole country. Keep it secret. I've always wanted to be a robber, but I knew I'd need a place like this, and I never knew where to find one. Now we've got it. We won't tell anybody except Joe Harper and Ben Rogers. A proper gang has to have more people in it. Tom Sawyer's Gang. Doesn't that sound splendid?
        - id: ch01-b43
          speaker: huck
          text: It sure does, Tom. Who are we going to rob?
        - id: ch01-b44
          speaker: tom
          text: Almost anybody. Mostly we'll lie in wait and stop people on the road.
        - id: ch01-b45
          speaker: huck
          text: Do we kill them?
        - id: ch01-b46
          speaker: tom
          text: Not every time. We keep them in the cave until their friends pay a ransom.
        - id: ch01-b47
          speaker: huck
          text: What's a ransom?
        - id: ch01-b48
          speaker: tom
          text: Money. Their friends have to collect all they can. If they haven't paid after a year, then you kill the prisoners. That's how it's usually done. But you never kill the women. You lock them up, but you let them live. They're always beautiful and rich and terribly frightened. You take their watches and things, but you take off your hat and speak politely. Nobody is more polite than a robber. Every book says so. After a week or two, the women fall in love with you and stop crying. Then you couldn't make them leave. If you chased them out, they'd turn around and come right back. That's how it happens in every book.
        - id: ch01-b49
          speaker: huck
          text: That's first-rate, Tom. I think being a robber might be better than being a pirate.
        - id: ch01-b50
          speaker: tom
          text: It is better in some ways. You're close to home, and close to circuses and everything.
        - id: ch01-b51
          speaker: narrator
          text: By then, everything was ready. Tom led the way into the hole. The boys struggled through the tight tunnel until they reached its far end. There they tied down the kite strings they had joined together and moved deeper into the cave. A few more steps brought them to the spring, and a shiver ran all through Tom. He showed Huck the bit of candlewick perched on a lump of clay by the wall. Then he told him how he and Becky had sat there watching its little flame struggle, weaken, and finally go out.
        - id: ch01-b52
          speaker: narrator
          text: Soon the darkness and stillness pressed on them, and their voices dropped to whispers. They followed the other passage Tom had explored and came to the jumping-off place. In the candlelight, they saw that it was not a cliff at all. It was a steep clay slope, twenty or thirty feet high.
        - id: ch01-b53
          speaker: tom
          text: Now I'm going to show you something, Huck.
        - id: ch01-b54
          speaker: narrator
          text: Tom raised his candle.
        - id: ch01-b55
          speaker: tom
          text: Look as far around that corner as you can. Do you see the mark on the big rock? It was made with candle smoke.
        - id: ch01-b56
          speaker: huck
          text: Tom, it's a cross!
          emotion: surprised
        - id: ch01-b57
          speaker: tom
          text: So where is Number Two now? Under the cross, remember? That's the very spot where I saw Injun Joe raise his candle.
        - id: ch01-b58
          speaker: narrator
          text: Huck stared at the strange sign. When he spoke, his voice shook.
        - id: ch01-b59
          speaker: huck
          text: Tom, let's get out of here!
          emotion: fearful
        - id: ch01-b60
          speaker: tom
          text: What? And leave the treasure?
        - id: ch01-b61
          speaker: huck
          text: Yes, leave it. Injun Joe's ghost is bound to be around here.
          emotion: fearful
        - id: ch01-b62
          speaker: tom
          text: No, it isn't. His ghost would stay where he died, five miles from here at the cave entrance.
        - id: ch01-b63
          speaker: huck
          text: It wouldn't, Tom. It would stay close to the money. I know how ghosts behave, and you do, too.
          emotion: fearful
        - id: ch01-b64
          speaker: narrator
          text: Tom began to think Huck might be right, and fear crept into his own mind. Then he had an idea.
        - id: ch01-b65
          speaker: tom
          text: Huck, we're being fools! Injun Joe's ghost would never come near a cross!
        - id: ch01-b66
          speaker: narrator
          text: That argument worked.
        - id: ch01-b67
          speaker: huck
          text: I never thought of that, Tom. But you're right. That cross is lucky for us. Let's climb down and look for the box.
        - id: ch01-b68
          speaker: narrator
          text: Tom went first, cutting rough steps in the steep clay as he climbed down. Huck came behind him. At the bottom, four passages opened from the little cavern where the great rock stood. The boys examined three of them without finding anything. In the passage nearest the foot of the rock, they discovered a small hollow with a bed of blankets spread inside. There was also an old suspender, a piece of bacon rind, and the well-chewed bones of two or three chickens. But there was no money box. The boys searched that hiding place, then searched it all over again, and still found nothing.
        - id: ch01-b69
          speaker: tom
          text: He said it was under the cross. This hollow is the nearest place underneath it. The box can't be under the rock itself, because the rock sits solid on the ground.
        - id: ch01-b70
          speaker: narrator
          text: They searched everywhere once more, then sat down discouraged. Huck had no ideas. After a while, Tom noticed something.
        - id: ch01-b71
          speaker: tom
          text: Look here, Huck. There are footprints and drops of candle grease in the clay on this side of the rock, but nowhere else. Why would that be? I bet the money really is under the rock. I'm going to dig here.
        - id: ch01-b72
          speaker: huck
          text: That's a mighty good idea, Tom!
        - id: ch01-b73
          speaker: narrator
          text: Tom pulled out his real Barlow knife. Before he had dug four inches, the blade struck wood.
        - id: ch01-b74
          speaker: tom
          text: Hey, Huck! Did you hear that?
        - id: ch01-b75
          speaker: narrator
          text: Huck began digging and clawing at the earth beside him. Soon they uncovered several boards and pulled them away. The boards had hidden a natural crack that led beneath the rock. Tom climbed into it and held his candle as far ahead as he could, but the light did not reach the end. He proposed that they explore it. Stooping low, he moved into the narrow passage. It sloped slowly downward, twisting first to the right and then to the left, while Huck stayed close at his heels. At last, Tom rounded a short bend.
        - id: ch01-b76
          speaker: tom
          text: Goodness, Huck! Look at this!
          emotion: surprised
        - id: ch01-b77
          speaker: narrator
          text: There was the treasure box in a snug little cavern. Beside it stood an empty powder keg, two guns in leather cases, several pairs of old moccasins, a leather belt, and other rubbish. Everything had been thoroughly soaked by water dripping through the cave.
        - id: ch01-b78
          speaker: huck
          text: We finally found it! Look at all these old coins. Tom, we're rich!
          emotion: happy
        - id: ch01-b79
          speaker: tom
          text: I always believed we'd get it, Huck. It's almost too good to be true, but there it is! Let's quit staring and haul it out. First, let me see if I can lift the box.
          emotion: happy
        - id: ch01-b80
          speaker: narrator
          text: The box weighed about fifty pounds. Tom managed to lift it awkwardly, but he could not carry it easily.
        - id: ch01-b81
          speaker: tom
          text: Just what I thought. At the haunted house, they carried this box as if it was heavy. I noticed that. Good thing I brought the little bags.
        - id: ch01-b82
          speaker: narrator
          text: They quickly filled the bags with money and carried them up to the rock with the cross.
        - id: ch01-b83
          speaker: huck
          text: Let's go back for the guns and the other things.
        - id: ch01-b84
          speaker: tom
          text: No, leave them there. They'll be just what we need when we start robbing people. We can always keep them here, and we can hold our orgies here, too. It's a perfect place for orgies.
        - id: ch01-b85
          speaker: huck
          text: What are orgies?
        - id: ch01-b86
          speaker: tom
          text: I don't know. But robbers always have them, so we have to have them, too. Come on. We've been in here a long time, and it must be getting late. I'm hungry. We can eat and smoke once we reach the skiff.
        - id: ch01-b87
          speaker: narrator
          text: The boys came out among the sumac bushes and peered carefully in every direction. No one was there, and soon they were sitting in the skiff, eating their food and smoking their pipes. As the sun sank toward the horizon, they pushed away from shore. Tom rowed along the riverbank through the long twilight, talking cheerfully with Huck all the way. They finally landed a little after dark.
        - id: ch01-b88
          speaker: tom
          text: We'll hide the money in the loft of the widow's woodshed. Tomorrow morning, I'll come back. We'll count it, divide it, and find a safe place in the woods to keep it. Stay here and guard the bags while I borrow Benny Taylor's little wagon. I'll only be a minute.
        - id: ch01-b89
          speaker: narrator
          text: Tom disappeared and soon came back with the little wagon. He lifted the two sacks of money into it, threw old rags over them, and set off pulling the heavy cargo behind him. When the boys reached the Welshman's house, they stopped for a rest. They were just about to pull the wagon onward when Mr. Jones stepped outside.
        - id: ch01-b90
          speaker: welshman
          text: Hello there! Who is that?
        - id: ch01-b91
          speakers: [huck, tom]
          ensemble: duo
          text: We're Huck and Tom Sawyer.
        - id: ch01-b92
          speaker: welshman
          text: Good! Come with me, boys. Everybody is waiting for you. Hurry along. I'll pull that wagon. Why, this is heavier than it looks. Are you carrying bricks, or is it old metal?
        - id: ch01-b93
          speaker: tom
          text: It's old metal.
        - id: ch01-b94
          speaker: welshman
          text: That's what I thought. The boys in this town will work twice as hard hunting for fifty cents' worth of scrap iron as they would earning a dollar at honest work. That's human nature for you. Now hurry along!
        - id: ch01-b95
          speaker: narrator
          text: The boys asked why they had to hurry.
        - id: ch01-b96
          speaker: welshman
          text: Never mind. You'll find out when we reach Widow Douglas's house.
        - id: ch01-b97
          speaker: narrator
          text: Huck was used to being blamed for things he had not done, so he grew uneasy.
        - id: ch01-b98
          speaker: huck
          text: Mr. Jones, we haven't done anything wrong.
        - id: ch01-b99
          speaker: narrator
          text: The Welshman laughed.
        - id: ch01-b100
          speaker: welshman
          text: I don't know about that, Huck. Aren't you and the widow good friends?
        - id: ch01-b101
          speaker: huck
          text: Yes. Well, she's been a good friend to me, anyway.
        - id: ch01-b102
          speaker: welshman
          text: Then what are you afraid of?
        - id: ch01-b103
          speaker: narrator
          text: Before Huck's slow thoughts could find an answer, he and Tom were pushed into Widow Douglas's drawing room. Mr. Jones left the wagon by the door and followed them inside.
        - id: ch01-b104
          speaker: narrator
          text: The drawing room was brilliantly lighted, and nearly every important person in the village was there. The Thatchers, the Harpers, the Rogerses, Aunt Polly, Sid, Mary, the minister, the editor, and many others had all put on their best clothes. The widow welcomed the boys as warmly as anyone could welcome two creatures who looked as they did. Both were smeared from head to foot with clay and candle grease. Aunt Polly turned deep red with embarrassment. She frowned at Tom and shook her head. But no one in that fine room suffered half as much as the two boys themselves.
        - id: ch01-b105
          speaker: welshman
          text: Tom still wasn't home, so I'd given up on him. Then I came across him and Huck right outside my door, and I brought them straight here.
        - id: ch01-b106
          speaker: widow_douglas
          text: You did exactly right. Come with me, boys.
        - id: ch01-b107
          speaker: narrator
          text: She led them to a bedroom.
        - id: ch01-b108
          speaker: widow_douglas
          text: Now wash yourselves and get dressed. Here are two new suits, with shirts, socks, and everything you need. They're both for Huck. No, don't thank me, Huck. Mr. Jones bought one, and I bought the other. But they'll fit either of you. Put them on. We'll all wait until you come down looking presentable.
        - id: ch01-b109
          speaker: narrator
          text: Then she left them alone.
