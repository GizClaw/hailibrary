audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 聪明好胜，兴奋时语速加快，害怕时压低声音
        timbre: 清亮的少年声
        pace: 轻快灵活
        pitch: 中高音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，带着街头少年的粗朴和谨慎
        timbre: 略带沙哑的少年声
        pace: 自然偏慢
        pitch: 中音
    welshman:
      display_name: 老威尔士人
      tts:
        delivery: 直率警觉，沉稳有主见
        timbre: 强健沧桑
        pace: 从容
        pitch: 低音
    widow_douglas:
      display_name: 道格拉斯寡妇
      tts:
        delivery: 仁慈虔诚，关切时温柔坚定
        timbre: 温厚成熟的女声
        pace: 从容
        pitch: 中音
    unidentified_boy:
      display_name: 男孩
      tts:
        delivery: 简短直接，带着赶路后的疲惫
        timbre: 清亮的少年声
        pace: 自然
        pitch: 中高音
  chapters:
    - id: ch01
      title: 洞门背后
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 消息传开还不到几分钟，十来只小船已经载着人，朝麦克杜格尔山洞划去。一艘挤满乘客的渡船紧随其后。撒切尔法官坐在其中一只小船上，汤姆也跟他去了。
        - id: ch01-b02
          speaker: narrator
          text: 洞门一打开，昏暗的光里露出一幅凄惨景象。印第安乔直挺挺地躺在地上，已经死了。他的脸紧贴门缝，仿佛直到最后一刻，还在望着外面那个有光、有欢乐、也有自由的世界。
        - id: ch01-b03
          speaker: narrator
          text: 汤姆亲身尝过困在洞里的滋味，知道这个可怜虫受了多大的苦，心里不禁生出怜悯。可他又感到从未有过的轻松和安全。直到此刻他才明白，自从站出来指证这个凶狠的亡命徒，自己心里一直压着多么沉重的恐惧。
        - id: ch01-b04
          speaker: narrator
          text: 印第安乔的猎刀就在旁边，刀刃断成了两截。门下那根粗大的木梁，被他一点点劈出一道缺口。这活一定做了很久，却没有半点用处。门外是一道天然石槛，猎刀对它毫无办法，最后毁掉的只有刀。
        - id: ch01-b05
          speaker: narrator
          text: 就算没有这道石槛，还是没有用。哪怕整根木梁都砍掉，印第安乔的身子也挤不过门底，他自己当然知道。他不停地砍，只是想让手里有点事情，好熬过漫长的时间，也让那颗受尽折磨的心有个着落。
        - id: ch01-b06
          speaker: narrator
          text: 平常总有游客把五六截蜡烛头塞在前厅的石缝里，这时一截也找不到了。囚徒把它们全翻出来吃掉。他还捉到几只蝙蝠，也吃得只剩爪子。最后，这个不幸的人还是活活饿死了。
        - id: ch01-b07
          speaker: narrator
          text: 附近有根石笋，亿万年来一直被头顶落下的水滴慢慢筑高。印第安乔敲断石笋，在断桩上放了一块石头，又从石头上挖出浅浅的小窝，好接住那无比珍贵的水。每隔三分钟，才有一滴水落下来，规律得像时钟的滴答声，却也一样凄凉。整整一天，积下来的水不过一小调羹。
        - id: ch01-b08
          speaker: narrator
          text: 金字塔还很新时，这滴水就在落。特洛伊城陷落时，它在落。罗马奠基、基督受难、征服者开创大英帝国时，它都在落。哥伦布扬帆出海时，它在落。列克星敦的屠杀还是一桩新鲜消息时，它也在落。
        - id: ch01-b09
          speaker: narrator
          text: 它现在仍在落。将来，那些往事会沉进历史的斜阳，没入传说的暮色，再被遗忘的黑夜吞掉，可这滴水还会继续落下去。难道万物都有一个目的吗？难道它等了五千年，就是为了救助这只匆匆来去的人间小虫？难道再过一万年，它还有另一桩大事要完成？谁也不必回答。
        - id: ch01-b10
          speaker: narrator
          text: 印第安乔在石头上挖出水窝，已经是许多年前的事了。可直到今天，游客来看洞里的奇景，停在那块哀伤的石头和那滴慢慢落下的水前，总比在别处更久。“印第安乔的杯子”排在洞中奇观的第一位，就连“阿拉丁宫殿”也比不上它。
        - id: ch01-b11
          speaker: narrator
          text: 印第安乔被埋在洞口附近。方圆七英里内，不管住在城镇、农场还是小村落，人们都乘船坐车赶来。他们带着孩子，也带着各种吃食。后来大家承认，这场葬礼让人心满意足的程度，差不多赶得上一场绞刑。
        - id: ch01-b12
          speaker: narrator
          text: 葬礼也让另一件事停了下来。原先有人请愿，想求州长赦免印第安乔。请愿书上已经有许多签名，还开过一场场又流泪又演说的大会。他们甚至挑出一群糊涂女人，准备让她们穿上丧服，到州长身边哭喊，求他大发慈悲，做个把职责踩在脚下的仁厚蠢材。
        - id: ch01-b13
          speaker: narrator
          text: 人人都相信印第安乔杀过村里五个人，可那又算什么呢？就算他是撒旦本人，也会有一群软骨头争着在赦免书上写下名字，再从那副永远关不住水的泪腺里，滴上一颗眼泪。
    - id: ch02
      title: 钱在山洞里
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 葬礼过后的第二天早晨，汤姆把哈克带到一个没人打扰的地方，说有要紧话要谈。哈克已经从老威尔士人和道格拉斯寡妇那里听完了汤姆的历险。不过汤姆说，还有一件事，他们一定没有告诉哈克。哈克一听，脸就沉了下来。
        - id: ch02-b02
          speaker: huck
          text: 我知道你要说什么。你进了二号房间，结果只找到威士忌。没人告诉我那个人是你，可我一听威士忌那回事，就猜到准是你。我也知道你没拿到钱。要是拿到了，就算瞒着所有人，你也会想办法来告诉我。汤姆，我心里老有个声音说，那笔财宝咱们永远也找不到。
        - id: ch02-b03
          speaker: tom
          text: 哈克，我可没去告发那个客栈老板。我去野餐的星期六，那家客栈明明还好好的。你忘了吗？那天夜里本来轮到你去盯着。
        - id: ch02-b04
          speaker: huck
          text: 对呀！这事怎么像过了一年似的。就是那天晚上，我跟着印第安乔去了寡妇家。
        - id: ch02-b05
          speaker: tom
          text: 你还跟踪了他？
          emotion: surprised
        - id: ch02-b06
          speaker: huck
          text: 对。可你千万别往外说。印第安乔也许还有朋友，我不想让他们恨上我，再偷偷害我。要不是有我，他现在早就平安逃到得克萨斯了。
        - id: ch02-b07
          speaker: narrator
          text: 哈克这才把那天晚上的经历悄悄讲给汤姆听。汤姆从前只知道老威尔士人那一边发生的事。讲完以后，哈克很快又绕回最叫他惦记的问题。
        - id: ch02-b08
          speaker: huck
          text: 不管是谁拿走了二号房间的威士忌，我看钱也一起叫他拿走了。反正那笔钱没咱们的份了，汤姆。
        - id: ch02-b09
          speaker: tom
          text: 哈克，那笔钱从来就不在二号房间！
        - id: ch02-b10
          speaker: narrator
          text: 哈克猛地盯住伙伴的脸。
        - id: ch02-b11
          speaker: huck
          text: 什么？汤姆，你又找到那笔钱的线索了？
          emotion: surprised
        - id: ch02-b12
          speaker: tom
          text: 找到了。钱就在山洞里！
        - id: ch02-b13
          speaker: narrator
          text: 哈克的眼睛一下亮了。
        - id: ch02-b14
          speaker: huck
          text: 汤姆，再说一次。
        - id: ch02-b15
          speaker: tom
          text: 钱就在山洞里！
        - id: ch02-b16
          speaker: huck
          text: 汤姆，你可得说真的。你是在逗我，还是来真的？
        - id: ch02-b17
          speaker: tom
          text: 真的，哈克。我这辈子没有比这更认真的时候。你跟我一起进去，把钱弄出来，好不好？
        - id: ch02-b18
          speaker: huck
          text: 那还用说！只要一路能留下记号，不会走丢，我就去。
        - id: ch02-b19
          speaker: tom
          text: 放心吧，这事一点也不难。
        - id: ch02-b20
          speaker: huck
          text: 太棒了！可你凭什么觉得钱在……
        - id: ch02-b21
          speaker: tom
          text: 进洞以后再告诉你。要是找不到，我就把小鼓给你，连我在这世上的全部家当也都给你。我保证。
        - id: ch02-b22
          speaker: huck
          text: 好，就这么说定。什么时候去？
        - id: ch02-b23
          speaker: tom
          text: 你要愿意，现在就走。你身子撑得住吗？
        - id: ch02-b24
          speaker: huck
          text: 那地方在洞里有多远？这三四天我已经能下地了，可我走不了一英里。至少我觉得自己走不了。
        - id: ch02-b25
          speaker: tom
          text: 别人走那条路，大概要进洞五英里。可我知道一条近得多的路，除了我谁也不知道。我划小船把你送过去，回来也由我一个人划。你一根手指都不用动。
        - id: ch02-b26
          speaker: huck
          text: 那就马上动身，汤姆。
        - id: ch02-b27
          speaker: tom
          text: 好。咱们带上面包和肉，还有烟斗、一两个小口袋、两三根风筝线。再拿几根那种新鲜玩意儿，他们管它叫洋火。上次困在洞里时，我不知有多少次盼着身上能有几根。
        - id: ch02-b28
          speaker: narrator
          text: 中午刚过，两个孩子从一位出门的居民那里借来一只小船，立刻出发。划过“山洞谷”下游几英里后，汤姆指着河岸说话了。
        - id: ch02-b29
          speaker: tom
          text: 你看，从山洞谷一路下来，这面峭壁处处都一样。没有房子，没有木料场，连灌木也长得差不多。可你看见上面那块滑过坡的白地方了吗？那是我留下的一个记号。咱们就在这里上岸。
        - id: ch02-b30
          speaker: narrator
          text: 两人上岸以后，汤姆告诉哈克，他们站的地方离那个出口近得很，拿根钓鱼竿就能碰到，还叫哈克自己找找看。哈克把附近搜遍了，却什么也没发现。汤姆得意地走进一片茂密的漆树丛。
        - id: ch02-b31
          speaker: tom
          text: 在这儿呢！你瞧，这一定是全国最隐蔽的洞口。千万别告诉别人。我一直想当强盗，可当强盗非得有这样的藏身处，难就难在上哪儿找。现在咱们有了。只让乔·哈珀和本·罗杰斯知道，因为没有帮派就没有派头。“汤姆·索亚帮”，听着是不是很神气？
        - id: ch02-b32
          speaker: huck
          text: 真够神气的。汤姆，咱们抢谁？
        - id: ch02-b33
          speaker: tom
          text: 谁都能抢。一般就是躲在路边，等人经过再跳出来。
        - id: ch02-b34
          speaker: huck
          text: 抢完还要杀掉他们吗？
        - id: ch02-b35
          speaker: tom
          text: 不一定。先把人关在洞里，等他们筹赎金。
        - id: ch02-b36
          speaker: huck
          text: 什么叫赎金？
        - id: ch02-b37
          speaker: tom
          text: 就是钱。叫他们的朋友把能筹的钱都筹来。要是关上一年还没筹够，再杀掉他们。通常都是这样。不过女人不能杀，只能关起来。她们总是又漂亮又有钱，而且怕得要命。你可以拿走她们的手表和东西，可一定得脱下帽子，客客气气地说话。没有人比强盗更有礼貌，随便哪本书里都写着呢。
        - id: ch02-b38
          speaker: tom
          text: 那些女人后来都会爱上你。在洞里关上一两个星期，她们就不哭了。再往后，赶都赶不走。就算轰出洞，她们也会马上转身回来。书上全是这么说的。
        - id: ch02-b39
          speaker: huck
          text: 这可真带劲。我看比当海盗还好。
        - id: ch02-b40
          speaker: tom
          text: 有些地方确实更好。这里离家近，离马戏团什么的也近。
    - id: ch03
      title: 十字架下面
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一切准备妥当，汤姆领头钻进洞里。两人费力爬到地道尽头，把接起来的风筝线系牢，继续往里走。才走几步就到了泉水旁，汤姆浑身一阵发抖。他指给哈克看，墙边一团泥上还立着一小截烛芯。他和贝琪曾守着那点火苗，看它挣扎，最后熄灭。
        - id: ch03-b02
          speaker: narrator
          text: 洞里的寂静和黑暗压在心头，两个孩子越说越轻，最后只敢耳语。他们继续走进汤姆发现的另一条通道，一直来到所谓的“断崖”。烛光一照，那里不是真悬崖，只是一面二三十英尺高的陡峭泥坡。汤姆压低声音。
        - id: ch03-b03
          speaker: tom
          text: 哈克，我给你看样东西。
        - id: ch03-b04
          speaker: narrator
          text: 他把蜡烛高高举起来。
        - id: ch03-b05
          speaker: tom
          text: 尽量往拐角后面看。看见了吗？就在那边的大石头上，是拿蜡烛烟熏出来的。
        - id: ch03-b06
          speaker: huck
          text: 汤姆，那是个十字架！
          emotion: surprised
        - id: ch03-b07
          speaker: tom
          text: 那你的二号房间到底在哪儿？“十字架下面”，对不对？哈克，我那天看见印第安乔举起蜡烛，就在那块石头旁边！
        - id: ch03-b08
          speaker: narrator
          text: 哈克盯着那个神秘记号看了一会儿，声音开始发抖。
        - id: ch03-b09
          speaker: huck
          text: 汤姆，咱们还是出去吧！
          emotion: fearful
        - id: ch03-b10
          speaker: tom
          text: 什么？财宝也不要了？
        - id: ch03-b11
          speaker: huck
          text: 不要了。印第安乔的鬼准在这附近。
          emotion: fearful
        - id: ch03-b12
          speaker: tom
          text: 不会的，哈克。鬼只会待在他死掉的地方。那地方远在山洞口，离这儿足有五英里呢。
        - id: ch03-b13
          speaker: huck
          text: 不对，汤姆。鬼会守着钱。我知道鬼的脾气，你也知道。
        - id: ch03-b14
          speaker: narrator
          text: 汤姆听着听着，也怕哈克说对了，心里冒出越来越多的疑虑。可他很快又想到了一个道理。
        - id: ch03-b15
          speaker: tom
          text: 你听我说，哈克，咱们可真傻！有十字架的地方，印第安乔的鬼根本不敢靠近！
        - id: ch03-b16
          speaker: narrator
          text: 这话确实很有道理，哈克马上听进去了。
        - id: ch03-b17
          speaker: huck
          text: 汤姆，我刚才还真没想到。可你说得对。咱们运气不错，有这个十字架护着。我看可以爬下去，找找那只箱子。
        - id: ch03-b18
          speaker: narrator
          text: 汤姆走在前面，一边下坡，一边在泥土上凿出粗糙的台阶，哈克跟在后头。巨石坐落在一间小洞室里，四条通道从这里分出去。他们搜了其中三条，什么也没找到。
        - id: ch03-b19
          speaker: narrator
          text: 离巨石底部最近的通道里有个小凹穴，地上铺着毯子。旁边还留着一根旧背带、几块熏肉皮，以及两三只被啃干净的鸡骨头。可那里没有钱箱。他们翻来覆去搜了好几遍，仍然一无所获。
        - id: ch03-b20
          speaker: tom
          text: 他说的是十字架下面。这里离十字架下面最近。箱子又不可能真压在石头底下，因为石头严严实实坐在地面上。
        - id: ch03-b21
          speaker: narrator
          text: 两人又搜了一遍，最后泄气地坐下。哈克也想不出任何办法。过了一会儿，汤姆忽然注意到一件事。
        - id: ch03-b22
          speaker: tom
          text: 哈克，你看，石头这一边的泥地上有脚印，还有蜡油，另外几边却没有。这是为什么？我敢说钱就在石头下面。我要挖开这里看看。
        - id: ch03-b23
          speaker: huck
          text: 这主意不错，汤姆！
          emotion: happy
        - id: ch03-b24
          speaker: narrator
          text: 汤姆马上掏出那把“真正的巴洛刀”。才往下挖了四英寸，刀就碰到了木头。
        - id: ch03-b25
          speaker: tom
          text: 嘿，哈克！听见这个声音了吗？
          emotion: surprised
        - id: ch03-b26
          speaker: narrator
          text: 哈克也赶紧动手刨起来。没过多久，他们挖出几块木板。搬开木板，下面露出一道天然裂缝，一直通到巨石底下。汤姆钻进去，把蜡烛尽量往前伸，可裂缝深得看不见尽头。
        - id: ch03-b27
          speaker: narrator
          text: 汤姆决定进去探一探。他弯腰钻过狭窄的入口，小路慢慢向下倾斜。他先向右，再向左，沿着弯弯曲曲的路往前走，哈克紧跟在身后。转过一道小弯，汤姆突然叫起来。
        - id: ch03-b28
          speaker: tom
          text: 我的天哪！哈克，你快看！
          emotion: surprised
    - id: ch04
      title: 找到了财宝
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 那只财宝箱果然在那里，稳稳地待在一个小洞穴里。旁边还有一只空火药桶、两支装在皮套里的枪、两三双旧鹿皮鞋、一条皮带，以及一堆被滴水泡透的破烂。
        - id: ch04-b02
          speaker: huck
          text: 总算找到了！天哪，汤姆，咱们发财啦！
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: 哈克一边喊，一边把手插进那些失去光泽的硬币里翻动。
        - id: ch04-b04
          speaker: tom
          text: 哈克，我一直觉得咱们能找到。好得让人不敢相信，可它真的在这儿！别再磨蹭了，咱们把钱弄出去。先让我试试能不能抬动箱子。
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: 箱子大约有五十磅重。汤姆勉强可以抬起来，却没法抱着它走。
        - id: ch04-b06
          speaker: tom
          text: 我早料到了。那天在鬼屋里，他们搬箱子时，看上去就觉得很沉。我注意到了。幸亏我想着带了几个小口袋。
        - id: ch04-b07
          speaker: narrator
          text: 他们很快把钱装进袋子，提回有十字架的巨石旁。
        - id: ch04-b08
          speaker: huck
          text: 现在去拿那些枪和别的东西吧。
        - id: ch04-b09
          speaker: tom
          text: 别拿，哈克，留在这里。咱们以后当强盗，正好用得上。东西一直藏在这里，狂欢也在这里办。这地方办狂欢再合适不过了。
        - id: ch04-b10
          speaker: huck
          text: 狂欢是什么？
        - id: ch04-b11
          speaker: tom
          text: 我也不知道。可强盗总要办狂欢，咱们当然也得办。走吧，哈克，咱们进来很久了。天大概也晚了。我肚子饿了。回到小船上再吃东西、抽烟斗。
        - id: ch04-b12
          speaker: narrator
          text: 他们从漆树丛里钻出来，小心地四处看了看。外面一个人也没有。于是两人坐进小船，吃起东西，也抽起烟来。太阳渐渐沉向天边，他们把船推入水中。漫长的暮色里，汤姆贴着河岸轻快地划船，一路高高兴兴地和哈克说话。天黑不久，两人便上了岸。
        - id: ch04-b13
          speaker: tom
          text: 哈克，咱们先把钱藏在寡妇家柴房的阁楼上。明早我再过来，咱们把钱数清楚，分成两份。然后到树林里找个安全的地方藏好。你安静躺在这儿，守住东西。我去弄来本尼·泰勒的小车，很快就回来。
        - id: ch04-b14
          speaker: narrator
          text: 汤姆很快消失了。不久，他拉着小车回来，把两个小口袋放进车里，又盖上几块旧破布，然后拖着这份沉甸甸的货物上路。他们走到老威尔士人家门口，停下来歇脚。正要继续走，老威尔士人出来了。
        - id: ch04-b15
          speaker: welshman
          text: 喂，谁在那里？
        - id: ch04-b16
          speaker: unidentified_boy
          text: 是哈克和汤姆·索亚。
        - id: ch04-b17
          speaker: welshman
          text: 好极了！孩子们，跟我走吧，大家都等着你们。快点，走到前面去，车子交给我拉。哎呀，这车还真不轻。里面是砖头，还是废铁？
        - id: ch04-b18
          speaker: tom
          text: 是废铁。
        - id: ch04-b19
          speaker: welshman
          text: 我就知道。镇上的孩子宁可花更多力气、浪费更多时间，找来七十五美分的废铁卖给铸造厂，也不肯好好干活赚上一块半。不过人就是这样。快走，快走！
        - id: ch04-b20
          speaker: narrator
          text: 两个孩子连忙问，究竟有什么事，为什么这样着急。
        - id: ch04-b21
          speaker: welshman
          text: 别问。到了道格拉斯寡妇家，你们自然会知道。
        - id: ch04-b22
          speaker: narrator
          text: 哈克常常平白无故受人责怪，一听这话就害怕起来。
        - id: ch04-b23
          speaker: huck
          text: 琼斯先生，我们真的什么坏事也没干。
          emotion: fearful
        - id: ch04-b24
          speaker: narrator
          text: 老威尔士人笑了。
        - id: ch04-b25
          speaker: welshman
          text: 这我可不知道，哈克，我的孩子。我真不敢说。你和寡妇不是好朋友吗？
        - id: ch04-b26
          speaker: huck
          text: 是啊。反正她一直待我很好。
        - id: ch04-b27
          speaker: welshman
          text: 那不就行了？还有什么好怕的？
    - id: ch05
      title: 灯火辉煌的客厅
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 哈克那颗转得很慢的脑袋，还没有把这个问题想明白，就和汤姆一起被推进道格拉斯寡妇家的客厅。琼斯先生把小车放在门边，也跟着进去了。
        - id: ch05-b02
          speaker: narrator
          text: 屋里灯火辉煌，村里所有有头有脸的人几乎都来了。撒切尔一家、哈珀一家、罗杰斯一家都在。波莉姨妈、西德、玛丽、牧师、编辑，还有许许多多人，也都穿着自己最体面的衣裳。
        - id: ch05-b03
          speaker: narrator
          text: 两个孩子却满身泥土和蜡油，模样实在糟糕。即便这样，道格拉斯寡妇还是热情地迎接他们。波莉姨妈羞得满脸通红，对着汤姆皱眉，又不停摇头。不过这屋里最难受的人，还得数这两个孩子。琼斯先生向大家解释起来。
        - id: ch05-b04
          speaker: welshman
          text: 汤姆一直没有回家，我只好不等他了。可我正巧在自己门口撞见他和哈克，就赶紧把两个孩子一起带来了。
        - id: ch05-b05
          speaker: widow_douglas
          text: 你做得正对。孩子们，跟我来。
        - id: ch05-b06
          speaker: narrator
          text: 寡妇把两个孩子领进一间卧室。
        - id: ch05-b07
          speaker: widow_douglas
          text: 现在把自己洗干净，再换好衣服。这里有两套新衣裳，衬衫、袜子，样样都有。这些都是给哈克的。别急着谢我，哈克，一套是琼斯先生买的，另一套才是我买的。不过你们两个都穿得下。快换上吧，我们就在楼下等。等你们收拾得像个样子，再下来见大家。
        - id: ch05-b08
          speaker: narrator
          text: 说完，她便离开了房间。
