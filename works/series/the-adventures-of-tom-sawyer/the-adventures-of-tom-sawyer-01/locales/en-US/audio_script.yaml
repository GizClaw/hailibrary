audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry sense of humor
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
    aunt_polly:
      display_name: Aunt Polly
      tts:
        delivery: brisk and scolding, softened by deep affection
        timbre: sturdy and mature
        pace: moderately quick
        pitch: medium-low
    tom:
      display_name: Tom
      tts:
        delivery: quick, bold, and mischievous
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    sid:
      display_name: Sid
      tts:
        delivery: quiet, precise, and self-satisfied
        timbre: light and youthful
        pace: even
        pitch: medium-high
    new_boy:
      display_name: New Boy
      tts:
        delivery: proud, challenging, and sharp
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    new_boys_mother:
      display_name: New Boy's Mother
      tts:
        delivery: stern and disapproving
        timbre: firm and mature
        pace: clipped
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER I
      blocks:
        - id: ch01-b01
          speaker: aunt_polly
          text: "Tom!"
        - id: ch01-b02
          speaker: narrator
          text: No one answered.
        - id: ch01-b03
          speaker: aunt_polly
          text: "Tom! Tom! Where has that boy gone? You, Tom!"
        - id: ch01-b04
          speaker: narrator
          text: No answer came to any of it. The old lady lowered her spectacles and peered over them around the room. Then she pushed them up and looked beneath them. She almost never looked through those spectacles for anything as small as a boy. They were her finest pair and the pride of her heart. They were made for style instead of use, and she could have seen through a pair of stove lids just as well. For a moment she stood there, puzzled. Then she called out, not fiercely, but loudly enough for the furniture to hear.
        - id: ch01-b05
          speaker: aunt_polly
          text: "Just wait till I get hold of you. I'll..."
        - id: ch01-b06
          speaker: narrator
          text: She never finished. By then she was bent over, jabbing the broom beneath the bed, and she needed her breath for every jab. All she brought out was the cat.
        - id: ch01-b07
          speaker: aunt_polly
          text: "I never saw a boy like that in all my life!"
        - id: ch01-b08
          speaker: narrator
          text: She went to the open door and searched the garden among the tomato vines and jimson weeds. There was no Tom. So she raised her voice to carry as far as it could.
        - id: ch01-b09
          speaker: aunt_polly
          text: "You, Tom!"
        - id: ch01-b10
          speaker: narrator
          text: A faint sound came from behind her. She spun around just in time to catch a small boy by the loose back of his jacket before he could escape.
        - id: ch01-b11
          speaker: aunt_polly
          text: "There you are! I should've thought of that closet. What were you doing in there?"
        - id: ch01-b12
          speaker: tom
          text: "Nothing."
        - id: ch01-b13
          speaker: aunt_polly
          text: "Nothing? Look at your hands. Look at your mouth. What's that all over you?"
        - id: ch01-b14
          speaker: tom
          text: "I don't know, Aunt Polly."
        - id: ch01-b15
          speaker: aunt_polly
          text: "Well, I do. That's jam. I've warned you forty times to leave it alone, or I'd skin you. Give me that switch."
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: The switch hung in the air. Tom was in desperate danger.
        - id: ch01-b17
          speaker: tom
          text: "Oh! Look behind you, Aunt Polly!"
          emotion: surprised
        - id: ch01-b18
          speaker: narrator
          text: The old lady whirled around and pulled her skirts away from whatever danger might be there. Tom took off at once. He scrambled over the tall board fence and vanished.
        - id: ch01-b19
          speaker: narrator
          text: Aunt Polly stood astonished for a moment. Then she gave a gentle laugh.
        - id: ch01-b20
          speaker: aunt_polly
          text: "That boy! Will I ever learn? He's fooled me often enough. I ought to be watching for his tricks by now. But old fools are the biggest fools, just like they say. You can't teach an old dog new tricks. Then again, Tom never uses the same trick two days running, so how am I supposed to know what's coming? He knows exactly how long he can pester me before I lose my temper. He also knows that if he can delay me for one minute, or make me laugh, my anger is gone, and I can't strike him at all. I'm not doing right by that boy, and the Lord knows it. The Good Book says, spare the rod and spoil the child. I know I'm storing up sin and suffering for both of us. He's full of the devil, but mercy! He's my poor dead sister's boy. Somehow I haven't the heart to whip him. Whenever I let him go, my conscience aches. Whenever I hit him, my old heart nearly breaks. Scripture says a person's days are few and full of trouble, and I reckon that's true. He'll skip school this afternoon. Then I'll be forced to make him work tomorrow as punishment. Making him work on Saturday is hard when all the other boys are enjoying their holiday, but he hates work more than anything in the world. I've got to do some of my duty, or I'll be the ruin of the child."
        - id: ch01-b21
          speaker: narrator
          text: Tom did skip school that afternoon, and he had a splendid time. He reached home with barely enough time to help Jim saw the next day's wood and split the kindling before supper. At least, he arrived in time to tell Jim all about his adventures while Jim did three quarters of the work. Tom's younger brother, or rather his half brother, Sid, had already finished his own job of gathering wood chips. Sid was quiet and never went looking for trouble or adventure.
        - id: ch01-b22
          speaker: narrator
          text: At supper, Tom ate and stole sugar whenever he got the chance. Aunt Polly began asking him questions. Every one of them hid a trap, because she wanted him to reveal something that would betray what he had done. Like many honest, simple people, she was proud of what she considered her dark and mysterious skill at tricking others. She loved to think of her most obvious little schemes as wonders of deep cunning.
        - id: ch01-b23
          speaker: aunt_polly
          text: "It was fairly warm at school today, wasn't it, Tom?"
        - id: ch01-b24
          speaker: tom
          text: "Yes, ma'am."
        - id: ch01-b25
          speaker: aunt_polly
          text: "Very warm, wasn't it?"
        - id: ch01-b26
          speaker: tom
          text: "Yes, ma'am."
        - id: ch01-b27
          speaker: aunt_polly
          text: "Didn't you feel like going swimming?"
        - id: ch01-b28
          speaker: narrator
          text: Tom felt a quick stab of fear and suspicion. He studied Aunt Polly's face, but it told him nothing.
        - id: ch01-b29
          speaker: tom
          text: "No, ma'am. Well, not very much."
        - id: ch01-b30
          speaker: narrator
          text: Aunt Polly reached over and felt Tom's shirt.
        - id: ch01-b31
          speaker: aunt_polly
          text: "You're not too warm now, anyway."
        - id: ch01-b32
          speaker: narrator
          text: She felt pleased with herself. She had learned that his shirt was dry without letting anyone know why she checked it. Tom understood her plan all the same, and hurried to stop her next move.
        - id: ch01-b33
          speaker: tom
          text: "Some of us pumped water over our heads. My hair's still damp. Feel it."
        - id: ch01-b34
          speaker: narrator
          text: Aunt Polly was annoyed. She had missed that clue and lost her chance. Then a new idea came to her.
        - id: ch01-b35
          speaker: aunt_polly
          text: "You didn't have to open the collar I sewed shut just to wet your head, did you? Open your jacket."
        - id: ch01-b36
          speaker: narrator
          text: Tom's worried look disappeared. He opened his jacket, and the collar was still firmly sewn.
        - id: ch01-b37
          speaker: aunt_polly
          text: "Oh, bother. Go on, then. I was sure you'd skipped school to swim. But I forgive you, Tom. Maybe you're like a scorched cat. You're better than you look, this time."
        - id: ch01-b38
          speaker: narrator
          text: Half of her was sorry her clever plan had failed. The other half was glad Tom seemed to have behaved for once.
        - id: ch01-b39
          speaker: sid
          text: "That's odd. I thought you sewed his collar with white thread. That thread is black."
        - id: ch01-b40
          speaker: aunt_polly
          text: "Why, I did use white thread! Tom!"
          emotion: surprised
        - id: ch01-b41
          speaker: narrator
          text: Tom did not wait to hear the rest. He called back as he went out the door.
        - id: ch01-b42
          speaker: tom
          text: "Sid, I'll thrash you for that!"
          emotion: angry
        - id: ch01-b43
          speaker: narrator
          text: Once he was safely away, Tom examined two large needles stuck into the lapels of his jacket. Thread was wound around each one. One carried white thread and the other black.
        - id: ch01-b44
          speaker: tom
          text: "She never would've noticed if Sid hadn't spoken up. Confound it! Sometimes she uses white thread, and sometimes black. I wish she'd choose one and stick to it. I can't keep track of both. But I'll give Sid a beating for this. That'll teach him!"
          emotion: angry
        - id: ch01-b45
          speaker: narrator
          text: Tom was not the village's model boy. He knew the model boy very well, though, and hated him.
        - id: ch01-b46
          speaker: narrator
          text: In less than two minutes, Tom had forgotten every trouble he had. It was not because a boy's troubles felt any less heavy and bitter to him than a man's troubles do. A powerful new interest had simply pushed them from his mind, much as a new undertaking can make a man forget his misfortunes for a while. Tom had learned a special way of whistling from a Black man and desperately wanted to practice it without being disturbed. It had a birdlike twist, a flowing warble made by touching the tongue against the roof of the mouth at short intervals during the tune. Anyone who was ever a boy may remember how it was done.
        - id: ch01-b47
          speaker: narrator
          text: With care and practice, Tom soon mastered it. He marched down the street with music filling his mouth and gratitude filling his heart. He felt like an astronomer who had discovered a new planet. Yet when it came to pure, powerful delight, the boy probably had the better of the astronomer.
        - id: ch01-b48
          speaker: narrator
          text: Summer evenings were long, and it was not dark yet. Before long Tom stopped whistling. A strange boy stood in front of him, a little larger than Tom. Any newcomer, young or old, was a wonder in the poor, shabby village of St. Petersburg. This boy was also finely dressed on an ordinary weekday, which was astonishing. He wore a delicate cap, a neat new jacket of blue cloth, and smart new trousers. He had shoes on, though it was only Friday. A bright ribbon even served as his necktie. Everything about him looked like the city, and the sight cut into Tom. The longer Tom stared at all that splendor, the higher he turned up his nose at the fine clothes. At the same time, his own clothes seemed shabbier by the second.
        - id: ch01-b49
          speaker: narrator
          text: Neither boy spoke at first. Whenever one moved, the other moved sideways too. They circled each other, always face to face and eye to eye. At last Tom spoke.
        - id: ch01-b50
          speaker: tom
          text: "I can beat you in a fight."
        - id: ch01-b51
          speaker: new_boy
          text: "I'd like to see you try."
        - id: ch01-b52
          speaker: tom
          text: "I can do it."
        - id: ch01-b53
          speaker: new_boy
          text: "No, you can't."
        - id: ch01-b54
          speaker: tom
          text: "Yes, I can."
        - id: ch01-b55
          speaker: new_boy
          text: "No, you can't."
        - id: ch01-b56
          speaker: tom
          text: "I can."
        - id: ch01-b57
          speaker: new_boy
          text: "You can't."
        - id: ch01-b58
          speaker: tom
          text: "Can."
        - id: ch01-b59
          speaker: new_boy
          text: "Can't."
        - id: ch01-b60
          speaker: narrator
          text: An uneasy silence followed.
        - id: ch01-b61
          speaker: tom
          text: "What's your name?"
        - id: ch01-b62
          speaker: new_boy
          text: "Maybe that's none of your business."
        - id: ch01-b63
          speaker: tom
          text: "Maybe I'll make it my business."
        - id: ch01-b64
          speaker: new_boy
          text: "Then why don't you?"
        - id: ch01-b65
          speaker: tom
          text: "Keep talking, and I will."
        - id: ch01-b66
          speaker: new_boy
          text: "Talking, talking, talking. There."
        - id: ch01-b67
          speaker: tom
          text: "You think you're awfully smart, don't you? I could beat you with one hand behind my back."
        - id: ch01-b68
          speaker: new_boy
          text: "Why don't you do it, then? You keep saying you can."
        - id: ch01-b69
          speaker: tom
          text: "I will if you keep bothering me."
        - id: ch01-b70
          speaker: new_boy
          text: "Oh, sure. I've seen whole families just like you."
        - id: ch01-b71
          speaker: tom
          text: "Smart, aren't you? And look at that hat!"
        - id: ch01-b72
          speaker: new_boy
          text: "If you don't like my hat, you can lump it. I dare you to knock it off. Anyone who won't take a dare will suck eggs."
        - id: ch01-b73
          speaker: tom
          text: "You're a liar!"
          emotion: angry
        - id: ch01-b74
          speaker: new_boy
          text: "So are you."
          emotion: angry
        - id: ch01-b75
          speaker: tom
          text: "You're a lying coward. You won't even fight over it."
        - id: ch01-b76
          speaker: new_boy
          text: "Oh, go away."
        - id: ch01-b77
          speaker: tom
          text: "Give me any more sass, and I'll bounce a rock off your head."
        - id: ch01-b78
          speaker: new_boy
          text: "Oh, of course you will."
        - id: ch01-b79
          speaker: tom
          text: "I will."
        - id: ch01-b80
          speaker: new_boy
          text: "Then do it. Why do you keep saying you will? You're scared."
        - id: ch01-b81
          speaker: tom
          text: "I'm not scared."
        - id: ch01-b82
          speaker: new_boy
          text: "You are."
        - id: ch01-b83
          speaker: tom
          text: "I am not."
        - id: ch01-b84
          speaker: new_boy
          text: "You are."
        - id: ch01-b85
          speaker: narrator
          text: Another silence followed. They kept staring and circling. Soon they stood shoulder to shoulder.
        - id: ch01-b86
          speaker: tom
          text: "Get out of here!"
        - id: ch01-b87
          speaker: new_boy
          text: "You get out!"
        - id: ch01-b88
          speaker: tom
          text: "I won't."
        - id: ch01-b89
          speaker: new_boy
          text: "Neither will I."
        - id: ch01-b90
          speaker: narrator
          text: Each boy planted one foot at an angle to brace himself. Then they shoved with all their strength and glared at each other with hate. Neither gained any ground. They struggled until both were hot and red, then carefully eased off without dropping their guard.
        - id: ch01-b91
          speaker: tom
          text: "You're a coward and a pup. I'll tell my big brother about you. He could whip you with one little finger, and I'll make him do it."
        - id: ch01-b92
          speaker: new_boy
          text: "I don't care about your big brother. My brother is bigger than yours, and he could throw yours right over that fence."
        - id: ch01-b93
          speaker: narrator
          text: Neither brother really existed.
        - id: ch01-b94
          speaker: tom
          text: "That's a lie."
        - id: ch01-b95
          speaker: new_boy
          text: "Calling it a lie doesn't make it one."
        - id: ch01-b96
          speaker: narrator
          text: Tom used his big toe to draw a line in the dust.
        - id: ch01-b97
          speaker: tom
          text: "I dare you to cross that line. If you do, I'll beat you till you can't stand. Anyone who won't take a dare will steal sheep."
        - id: ch01-b98
          speaker: narrator
          text: The new boy stepped across at once.
        - id: ch01-b99
          speaker: new_boy
          text: "You said you'd do it. Let's see you try."
        - id: ch01-b100
          speaker: tom
          text: "Don't push me. You'd better watch out."
        - id: ch01-b101
          speaker: new_boy
          text: "You said you'd fight. Why aren't you doing it?"
        - id: ch01-b102
          speaker: tom
          text: "By jingo, I'd do it for two cents!"
        - id: ch01-b103
          speaker: narrator
          text: The new boy pulled two large copper coins from his pocket and held them out with a mocking look, as if he meant to pay Tom to fight. Tom struck the coins straight to the ground.
        - id: ch01-b104
          speaker: narrator
          text: In an instant the boys were rolling through the dirt, locked together like cats. For a full minute they pulled hair, tore at clothes, punched, and scratched each other's noses. Dust covered them, along with glory. Then the wild tangle began to take shape. Tom appeared on top of the new boy, sitting astride him and pounding with both fists.
        - id: ch01-b105
          speaker: tom
          text: "Say you've had enough!"
          emotion: angry
        - id: ch01-b106
          speaker: narrator
          text: The boy only fought to get free. He was crying, mostly from rage.
        - id: ch01-b107
          speaker: tom
          text: "Say it!"
          emotion: angry
        - id: ch01-b108
          speaker: narrator
          text: Tom kept pounding him.
        - id: ch01-b109
          speaker: new_boy
          text: "Enough!"
          emotion: angry
        - id: ch01-b110
          speaker: narrator
          text: Tom let him get up.
        - id: ch01-b111
          speaker: tom
          text: "That'll teach you. Next time, be careful who you fool with."
        - id: ch01-b112
          speaker: narrator
          text: The new boy walked away, brushing dirt from his clothes. He sobbed and sniffed, and now and then he looked back and shook his head. He kept threatening Tom with everything he would do the next time he caught him alone. Tom answered each threat with jeers and marched away in triumph.
        - id: ch01-b113
          speaker: narrator
          text: As soon as Tom turned his back, the new boy snatched up a stone. He threw it and struck Tom squarely between the shoulders. Then he turned and ran like an antelope. Tom chased the treacherous boy all the way home and learned exactly where he lived.
        - id: ch01-b114
          speaker: narrator
          text: Tom stood guard at the gate for a while and dared his enemy to come out. The boy stayed inside, made faces through a window, and refused. At last the boy's mother appeared.
        - id: ch01-b115
          speaker: new_boys_mother
          text: "You are a bad, vicious, vulgar child. Go away at once!"
          emotion: angry
        - id: ch01-b116
          speaker: narrator
          text: Tom left, but he promised that he would lie in wait for the boy.
        - id: ch01-b117
          speaker: narrator
          text: Tom got home quite late that night. He climbed carefully through the window, only to discover Aunt Polly waiting there in ambush. She took one look at the condition of his clothes. That sight made her decision as firm as stone. His Saturday holiday would become captivity at hard labor.
