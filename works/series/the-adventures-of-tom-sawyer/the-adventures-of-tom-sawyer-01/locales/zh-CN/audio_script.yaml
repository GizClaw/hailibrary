audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    aunt_polly:
      display_name: 波莉姨妈
      tts:
        delivery: 说话爽利严厉，底下藏着疼爱
        timbre: 结实成熟
        pace: 中等偏快
        pitch: 中低音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    sid:
      display_name: 锡德
      tts:
        delivery: 安静准确，隐约带着自得
        timbre: 轻细稚嫩
        pace: 平稳
        pitch: 中高音
    new_boy:
      display_name: 陌生男孩
      tts:
        delivery: 骄傲挑衅，针锋相对
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 中高音
    new_boys_mother:
      display_name: 陌生男孩的母亲
      tts:
        delivery: 严厉而不赞许
        timbre: 坚定成熟
        pace: 干脆
        pitch: 中音
  chapters:
    - id: ch01
      title: 第一章
      blocks:
        - id: ch01-b01
          speaker: aunt_polly
          text: “汤姆！”
        - id: ch01-b02
          speaker: narrator
          text: 没有回应。
        - id: ch01-b03
          speaker: aunt_polly
          text: “汤——姆！这孩子跑哪儿去了？汤姆！”
        - id: ch01-b04
          speaker: narrator
          text: 还是静悄悄的。老太太把眼镜拉到鼻梁下，从上边扫视屋子，又把眼镜推回去，从下边往外找。为了一个小男孩这么点儿的东西，她几乎从不真透过镜片看。这可是她最体面的眼镜，也是她的心头宝，只管好看，不管好用。就算换成两只炉盖，她也不会看得更糟。她纳闷了一阵，终于开口。声音不算凶，却足以让满屋家具都听清。
        - id: ch01-b05
          speaker: aunt_polly
          text: “让我抓住你，我非得……”
        - id: ch01-b06
          speaker: narrator
          text: 话没说完，她已经弯下腰，用扫帚直捅床底。每一下都要使劲，她顾不上把话说完。最后从床底钻出来的，只有那只猫。
        - id: ch01-b07
          speaker: aunt_polly
          text: “我从没见过这么淘气的孩子！”
        - id: ch01-b08
          speaker: narrator
          text: 她站到门口，搜遍园里的番茄藤和曼陀罗草，还是没有汤姆。她仰起脸，让声音尽量传得远些。
        - id: ch01-b09
          speaker: aunt_polly
          text: “汤姆——你给我出来！”
        - id: ch01-b10
          speaker: narrator
          text: 背后忽然有一点动静。她回身一抓，正好揪住一个小男孩那件宽松短上衣的后襟，在他逃掉之前把他截住了。
        - id: ch01-b11
          speaker: aunt_polly
          text: “原来在这儿！我早该想到壁橱。说，你躲在里面做什么？”
        - id: ch01-b12
          speaker: tom
          text: “什么也没做。”
        - id: ch01-b13
          speaker: aunt_polly
          text: “还说没做？看看你的手，再看看你的嘴。沾的是什么？”
        - id: ch01-b14
          speaker: tom
          text: “我不知道，姨妈。”
        - id: ch01-b15
          speaker: aunt_polly
          text: “我知道，是果酱。我说过多少遍，不许碰果酱。你再碰，我就揭你的皮。把细条子拿来！”
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: 细条子举到了半空，汤姆眼看就要遭殃。
        - id: ch01-b17
          speaker: tom
          text: “姨妈，快看你后面！”
        - id: ch01-b18
          speaker: narrator
          text: 老太太立刻回头，赶紧提起裙摆去躲那并不存在的危险。汤姆趁机飞奔出去，攀过高高的木围墙，转眼就没了踪影。
        - id: ch01-b19
          speaker: narrator
          text: 波莉姨妈愣在原地，过了一会儿，忍不住轻轻笑了。
        - id: ch01-b20
          speaker: aunt_polly
          text: “这个臭小子，我怎么总不长记性？他用这种把戏耍了我那么多次，我也该防着了。可人老了，偏偏最容易犯傻。老狗学不会新把戏，话是这么说，可汤姆从不连续两天用同一招，我怎么猜得着下一回？他知道惹到哪一步我才真发火，也知道只要拖上一会儿，或者把我逗笑，我的气就会全消，连一下都打不下去了。我没有好好管教他，老天最清楚。《圣经》说，舍不得棍子，就会惯坏孩子。照这么下去，我是在给我们俩招罪受。他浑身都是老魔鬼的坏主意，可他又是我那死去的可怜妹妹留下的孩子，我就是狠不下心。放过他吧，我良心难受。打了他吧，我这颗老心又快碎了。《圣经》还说，人在世上的日子又短，烦恼又多，真是一点儿不假。今天下午他准逃学，明天我只能罚他干活。可星期六大家都放假，偏偏让他劳动，也真难办。他最恨的又正是干活。不管怎样，我总得尽一尽本分，不能亲手毁了这个孩子。”
        - id: ch01-b21
          speaker: narrator
          text: 汤姆下午果然逃了学，还玩得十分尽兴。晚饭前，他总算及时赶回家，名义上是帮那个黑人小男孩吉姆锯明天的柴、劈引火木片。其实，他只顾讲自己的冒险，四分之三的活都让吉姆做了。弟弟锡德已经捡完自己那份木屑。严格说来，那是汤姆同母异父的弟弟。他很安静，既不四处冒险，也从不招惹麻烦。
        - id: ch01-b22
          speaker: narrator
          text: 晚饭桌上，汤姆边吃边找机会偷糖。波莉姨妈则装作随意，一句接一句地套他的话，每个问题里都藏着机关。她想让汤姆自己说漏嘴，露出逃学的马脚。许多心地单纯的人都爱相信自己天生懂得神秘的外交手腕，波莉姨妈也不例外。那些一眼就能看穿的小计策，在她看来都是深谋远虑的杰作。
        - id: ch01-b23
          speaker: aunt_polly
          text: “汤姆，今天学校里挺热吧？”
        - id: ch01-b24
          speaker: tom
          text: “是的，姨妈。”
        - id: ch01-b25
          speaker: aunt_polly
          text: “热得很厉害，对不对？”
        - id: ch01-b26
          speaker: tom
          text: “对，姨妈。”
        - id: ch01-b27
          speaker: aunt_polly
          text: “那你没想去游泳？”
        - id: ch01-b28
          speaker: narrator
          text: 汤姆猛地紧张起来。他盯着姨妈的脸，想看出她知道了多少，可那张脸什么也没透露。
        - id: ch01-b29
          speaker: tom
          text: “没有。嗯……也没有特别想。”
        - id: ch01-b30
          speaker: narrator
          text: 波莉姨妈伸手摸了摸他的衬衫。
        - id: ch01-b31
          speaker: aunt_polly
          text: “你现在可一点儿也不热。”
        - id: ch01-b32
          speaker: narrator
          text: 她很得意，觉得自己既探明了衬衫是干的，又没让任何人猜出她心里在想什么。可汤姆还是摸清了风向，知道姨妈下一步要查什么，于是赶忙抢先堵住她的下一招。
        - id: ch01-b33
          speaker: tom
          text: “我们几个人用水泵冲了头。我的头发还湿呢，你摸摸。”
        - id: ch01-b34
          speaker: narrator
          text: 波莉姨妈暗自懊恼，怎么偏偏漏了这个线索，也白白错过了这次机会。紧接着，她又想出一个办法。
        - id: ch01-b35
          speaker: aunt_polly
          text: “你只是往头上浇水，不用拆开我缝住的领口吧？把外套解开。”
        - id: ch01-b36
          speaker: narrator
          text: 汤姆立刻不担心了。他敞开外套，领口好端端地缝着。
        - id: ch01-b37
          speaker: aunt_polly
          text: “真扫兴。走吧，走吧。我还以为你逃学去游泳了。算我错怪你。人家说猫烧焦了毛，里面倒还好。你这回也算比看起来规矩。”
        - id: ch01-b38
          speaker: narrator
          text: 自己引以为豪的聪明办法竟然落了空，她有一半失望。可想到汤姆这次居然误打误撞地听了话，她又有一半高兴。
        - id: ch01-b39
          speaker: sid
          text: “奇怪，你不是用白线缝的领口吗？他这根怎么是黑线？”
        - id: ch01-b40
          speaker: aunt_polly
          text: “对呀，我用的就是白线！汤姆！”
          emotion: surprised
        - id: ch01-b41
          speaker: narrator
          text: 汤姆哪还肯留下听她说完。他冲出门，边跑边喊。
        - id: ch01-b42
          speaker: tom
          text: “锡德，你等着挨揍吧！”
          emotion: angry
        - id: ch01-b43
          speaker: narrator
          text: 跑到安全的地方，汤姆才停下来查看外套翻领。那里插着两根大针，每根针上都绕好了线，一根带着白线，另一根带着黑线。
        - id: ch01-b44
          speaker: tom
          text: “要不是锡德开口，她怎么会发现？真该死！她一会儿用白线，一会儿又用黑线，我怎么记得住？她要是永远只用一种就好了。锡德坏了我的事，我一定狠狠教训他！”
          emotion: angry
        - id: ch01-b45
          speaker: narrator
          text: 汤姆可不是镇上的模范少年。不过镇上那位真正的模范少年，他倒认识得很清楚，而且打心眼里讨厌那个人。
        - id: ch01-b46
          speaker: narrator
          text: 可还不到两分钟，汤姆已经忘了所有烦恼。孩子的烦恼并不比大人的轻，在他们心里也一样又沉又苦。只是这时，有件新鲜又强烈的兴趣把他的烦恼全压下去，暂时赶出了脑海。大人一头扎进新的事业，也常常这样忘记不幸。汤姆刚从一个黑人那里学到一种特别的口哨，把它当成宝贝，早就忍不住想找个无人打扰的地方练习。吹的时候，舌尖隔一会儿碰一下上颚，曲调里便滚出鸟鸣似的清亮颤音。小时候吹过这种口哨的人，大概还记得诀窍。
        - id: ch01-b47
          speaker: narrator
          text: 汤姆肯下功夫，又一心一意，很快就摸到了诀窍。他大步走过街道，嘴里满是和谐悦耳的曲调，心里也充满了感激。他觉得自己就像一位刚发现新行星的天文学家。不过，要说那种强烈、深沉、毫无杂质的快乐，恐怕还是这个男孩胜过那位天文学家。
        - id: ch01-b48
          speaker: narrator
          text: 夏天的黄昏拖得很长，天还亮着。汤姆忽然不吹了。一个陌生男孩挡在前面，个头比他稍大。圣彼得堡镇又穷又破，不管来了什么年纪的男人女人，都会变成稀奇人物。眼前这个男孩更不得了，大平常日子的，竟穿得那么漂亮。他戴着一顶精致的小帽，蓝呢短外套扣得严严实实，又新又挺，裤子也一样神气。今天才星期五，他居然已经穿上了鞋，脖子上还系着鲜艳的丝带。那副城里人的派头像针一样刺痛了汤姆。汤姆越看，鼻子翘得越高，仿佛压根儿瞧不上这些讲究。可他同时又觉得，自己的衣服一刻比一刻破旧。
        - id: ch01-b49
          speaker: narrator
          text: 两个男孩谁都不开口。只要一个往旁边挪，另一个也立刻横着跟上。他们就这样绕着圈子，却始终脸对着脸，眼睛瞪着眼睛，谁也不肯先移开目光。最后，还是汤姆先开了口。
        - id: ch01-b50
          speaker: tom
          text: “我一拳就能把你打趴下。”
        - id: ch01-b51
          speaker: new_boy
          text: “有本事你试试。”
        - id: ch01-b52
          speaker: tom
          text: “我当然有。”
        - id: ch01-b53
          speaker: new_boy
          text: “你才没有。”
        - id: ch01-b54
          speaker: tom
          text: “我就有。”
        - id: ch01-b55
          speaker: new_boy
          text: “你就没有。”
        - id: ch01-b56
          speaker: tom
          text: “我能做到。”
        - id: ch01-b57
          speaker: new_boy
          text: “你做不到。”
        - id: ch01-b58
          speaker: tom
          text: “我当然能！”
        - id: ch01-b59
          speaker: new_boy
          text: “你当然不能！”
        - id: ch01-b60
          speaker: narrator
          text: 两人尴尬地停了一会儿。
        - id: ch01-b61
          speaker: tom
          text: “你叫什么？”
        - id: ch01-b62
          speaker: new_boy
          text: “凭什么告诉你？”
        - id: ch01-b63
          speaker: tom
          text: “我偏要你告诉我。”
        - id: ch01-b64
          speaker: new_boy
          text: “那你倒来呀。”
        - id: ch01-b65
          speaker: tom
          text: “你再顶一句嘴，我就不客气。”
        - id: ch01-b66
          speaker: new_boy
          text: “顶嘴，顶嘴，我就顶嘴。怎么啦？”
        - id: ch01-b67
          speaker: tom
          text: “你以为自己很聪明，是吧？我把一只手绑在背后，都能收拾你。”
        - id: ch01-b68
          speaker: new_boy
          text: “那就来呀。别光会说。”
        - id: ch01-b69
          speaker: tom
          text: “你敢惹我，我真会动手。”
        - id: ch01-b70
          speaker: new_boy
          text: “这种大话，我听一家人说过。”
        - id: ch01-b71
          speaker: tom
          text: “少装机灵！你以为自己了不起？瞧那顶破帽子！”
        - id: ch01-b72
          speaker: new_boy
          text: “不喜欢就别看。我赌你不敢碰掉它。谁真敢接这个挑战，谁就是个嘬鸡蛋的家伙。”
        - id: ch01-b73
          speaker: tom
          text: “你说谎！”
        - id: ch01-b74
          speaker: new_boy
          text: “你才说谎！”
        - id: ch01-b75
          speaker: tom
          text: “你只敢嘴上叫阵，真打起来就怂了。”
        - id: ch01-b76
          speaker: new_boy
          text: “少来这一套！”
        - id: ch01-b77
          speaker: tom
          text: “你再敢这样说话，我就拿石头砸你的脑袋。”
        - id: ch01-b78
          speaker: new_boy
          text: “是啊，你肯定敢。”
        - id: ch01-b79
          speaker: tom
          text: “我真的敢。”
        - id: ch01-b80
          speaker: new_boy
          text: “那就砸呀！你一直说敢，为什么不动手？因为你害怕。”
        - id: ch01-b81
          speaker: tom
          text: “我不害怕。”
        - id: ch01-b82
          speaker: new_boy
          text: “你怕。”
        - id: ch01-b83
          speaker: tom
          text: “我不怕。”
        - id: ch01-b84
          speaker: new_boy
          text: “你就是怕。”
        - id: ch01-b85
          speaker: narrator
          text: 两个人再次停下，又瞪着对方横着挪步，慢慢挤到了肩并肩。
        - id: ch01-b86
          speaker: tom
          text: “你走开！”
        - id: ch01-b87
          speaker: new_boy
          text: “你才该走！”
        - id: ch01-b88
          speaker: tom
          text: “我就不走。”
        - id: ch01-b89
          speaker: new_boy
          text: “我也不走。”
        - id: ch01-b90
          speaker: narrator
          text: 两人各自斜伸出一只脚，牢牢抵住地面，然后用尽全身力气推着对方，眼里全是恨意。可推来推去，谁也占不到半点上风。直到两个人都浑身发热、满脸通红，他们才盯紧对手，小心翼翼地一点点收了力。
        - id: ch01-b91
          speaker: tom
          text: “你这个胆小鬼！我要叫我哥哥来。他只用一根小指头就能打赢你，我一定让他来。”
        - id: ch01-b92
          speaker: new_boy
          text: “你哥哥有什么了不起？我哥哥比他大，还能把他扔过那道围墙。”
        - id: ch01-b93
          speaker: narrator
          text: 其实，这两个哥哥全是他们编出来的。
        - id: ch01-b94
          speaker: tom
          text: “你在骗人。”
        - id: ch01-b95
          speaker: new_boy
          text: “你说骗人就算骗人吗？”
        - id: ch01-b96
          speaker: narrator
          text: 汤姆用大脚趾在尘土里划出一条线。
        - id: ch01-b97
          speaker: tom
          text: “你敢跨过来，我就揍得你站不住。谁一激就上当，谁就会偷羊。”
        - id: ch01-b98
          speaker: narrator
          text: 陌生男孩马上跨过了线。
        - id: ch01-b99
          speaker: new_boy
          text: “你说了要打。来，让我瞧瞧。”
        - id: ch01-b100
          speaker: tom
          text: “别逼我。你最好当心。”
        - id: ch01-b101
          speaker: new_boy
          text: “又是光说不练。你怎么还不来？”
        - id: ch01-b102
          speaker: tom
          text: “见鬼！给我两个铜板，我就真动手！”
        - id: ch01-b103
          speaker: narrator
          text: 陌生男孩从口袋里掏出两枚大铜币，满脸轻蔑地伸过去。汤姆抬手就把铜币打到地上。下一刻，他们像两只野猫似的扭在一起，在尘土里翻滚。他们揪头发，扯衣服，挥拳打鼻子，又抓又挠。足足一分钟，两人都沾了一身土，也挣了一身光荣。乱成一团的战局终于有了眉目。透过扬起的尘土，只见汤姆跨坐在对方身上，拳头一下接一下地落下去。
        - id: ch01-b104
          speaker: tom
          text: “快喊服输！”
        - id: ch01-b105
          speaker: narrator
          text: 男孩只是拼命挣扎。他哭了，主要是因为气愤。
        - id: ch01-b106
          speaker: tom
          text: “喊服输！”
        - id: ch01-b107
          speaker: narrator
          text: 汤姆还在揍他。终于，陌生男孩闷声挤出一句。
        - id: ch01-b108
          speaker: new_boy
          text: “我服了！”
          emotion: angry
        - id: ch01-b109
          speaker: narrator
          text: 汤姆这才让他站起来。
        - id: ch01-b110
          speaker: tom
          text: “这下你该记住了。下次想找人麻烦，先看清楚对方是谁。”
        - id: ch01-b111
          speaker: narrator
          text: 陌生男孩一边走，一边拍掉衣服上的土。他哭哭啼啼，吸着鼻子，不时回头摇头，还威胁说下次抓到汤姆，一定要他好看。汤姆用一串嘲笑回敬他，得意洋洋地转身离开。谁知他才背过身，那个男孩便抓起一块石头，扔过来正中他的两肩之间，接着像羚羊一样拔腿就跑。汤姆紧追这个卑鄙的偷袭者，一路追到他家，总算知道了他住哪儿。汤姆占住门口守了好一阵，不停叫敌人出来。那位敌人却只躲在窗后冲他做鬼脸，说什么也不应战。
        - id: ch01-b112
          speaker: narrator
          text: 最后，陌生男孩的母亲出来了。
        - id: ch01-b113
          speaker: new_boys_mother
          text: “你这个又坏、又恶毒、又没教养的孩子，赶快走！”
          emotion: angry
        - id: ch01-b114
          speaker: narrator
          text: 汤姆只得离开。不过临走前，他放下话来，说自己还会守在附近，非等那个男孩出来不可。
        - id: ch01-b115
          speaker: narrator
          text: 那天晚上，汤姆很晚才回到家。他小心翼翼地从窗户往里爬，以为不会惊动任何人，没想到一头撞进了早已设好的埋伏。守在那里的正是波莉姨妈。姨妈一看见他那身衣服的惨样，惩罚他的决心立刻硬得像金刚石。汤姆星期六的假日一定要变成一场苦役，这件事再也没有半点商量的余地了。
