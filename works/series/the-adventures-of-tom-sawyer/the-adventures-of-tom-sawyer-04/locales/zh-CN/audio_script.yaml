audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    mary:
      display_name: 玛丽
      tts:
        delivery: 温和耐心，劝说时亲切坚定
        timbre: 清甜柔和
        pace: 中等
        pitch: 中高音
    billy:
      display_name: 比利
      tts:
        delivery: 随便爽快，带着男孩间交易的精明
        timbre: 稚嫩清脆
        pace: 轻快
        pitch: 中高音
    walters:
      display_name: 沃尔特斯先生
      tts:
        delivery: 一本正经，郑重中带着刻意的庄严
        timbre: 清晰偏薄
        pace: 中等偏慢
        pitch: 中音
    boy:
      display_name: 男孩
      tts:
        delivery: 兴奋又羡慕，忍不住窃窃私语
        timbre: 清脆稚嫩
        pace: 偏快
        pitch: 中高音
    judge_thatcher:
      display_name: 撒切尔法官
      tts:
        delivery: 亲切威严，习惯用长辈口吻循循善诱
        timbre: 浑厚沉稳
        pace: 从容
        pitch: 中低音
    mrs_thatcher:
      display_name: 撒切尔太太
      tts:
        delivery: 端庄和善，鼓励孩子时语气柔软
        timbre: 温润成熟
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 第四章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 太阳升起来，照着一个宁静的世界。光芒落在安详的村庄上，仿佛赐下一片祝福。早饭以后，波莉姨妈领全家做礼拜。她先祷告，那篇祷词几乎全由一层层《圣经》原句砌成，只有缝里抹着薄薄一点自己的话。祷告完，她又像站在西奈山上那样，严肃地宣读了一章摩西律法。
        - id: ch01-b02
          speaker: narrator
          text: 接下来，汤姆也像要上战场似的，准备“背经文”了。锡德早在几天前就背熟了功课。汤姆要背五节，特意挑了《登山宝训》里的一段，因为实在找不到更短的。半小时以后，他只记住一个模糊的大概。他的心思早已跑遍人类思想的整个原野，两只手也一直忙着玩别的花样。玛丽拿过书来听他背，他只好在一片迷雾里摸索。
        - id: ch01-b03
          speaker: tom
          text: “有福的是——是——”
        - id: ch01-b04
          speaker: mary
          text: “贫穷的人——”
        - id: ch01-b05
          speaker: tom
          text: “对，贫穷的人。有福的是贫穷的——是——”
        - id: ch01-b06
          speaker: mary
          text: “心灵——”
        - id: ch01-b07
          speaker: tom
          text: “心灵。有福的是心灵贫穷的人，因为他们——他们——”
        - id: ch01-b08
          speaker: mary
          text: “天国是他们的——”
        - id: ch01-b09
          speaker: tom
          text: “因为天国是他们的。有福的是心灵贫穷的人，因为天国是他们的。哀恸的人有福了，因为他们——他们——”
        - id: ch01-b10
          speaker: mary
          text: “必——”
        - id: ch01-b11
          speaker: tom
          text: “因为他们——是——”
        - id: ch01-b12
          speaker: mary
          text: “必，得，安——”
        - id: ch01-b13
          speaker: tom
          text: “因为他们必，得——唉，我就是想不起来！”
        - id: ch01-b14
          speaker: mary
          text: “安慰！”
        - id: ch01-b15
          speaker: tom
          text: “哦，安慰！因为他们必得——因为他们必得——是——必得哀恸——是——那些必得哀恸的人有福了，因为他们必得——必得什么？玛丽，你干吗不直接告诉我？你为什么非要这么坏？”
        - id: ch01-b16
          speaker: mary
          text: “哎呀，汤姆，你这个榆木脑袋。我没有逗你，也绝不会这么做。你再去好好背一遍吧。别泄气，你一定背得会。只要背会了，我就送你一样特别好的东西。去吧，做个乖孩子。”
        - id: ch01-b17
          speaker: tom
          text: “好吧！到底是什么呀，玛丽？快告诉我。”
        - id: ch01-b18
          speaker: mary
          text: “你先别管。我说是好东西，那就一定是好东西。”
        - id: ch01-b19
          speaker: tom
          text: “那当然。行，我再去跟它较量一回。”
        - id: ch01-b20
          speaker: narrator
          text: 汤姆果真又去较量了。好奇心和眼看就要到手的奖赏一起催着他，他忽然干劲十足，竟然背得非常成功。玛丽送他一把崭新的巴洛小刀，值十二分半钱。狂喜一下席卷全身，震得他从头到脚直发颤。这把刀虽说什么也割不动，却是把“货真价实”的巴洛刀。单凭这一点，就有说不出的威风。至于西部男孩为什么认定这种刀还会有假货，那大概永远是个庄严的谜。汤姆先拿刀在碗橱上划出伤痕，正要向五斗柜下手，就被叫去换衣服，准备上主日学校。
        - id: ch01-b21
          speaker: narrator
          text: 玛丽给他一个锡盆和一块肥皂。汤姆把盆放到门外的小凳上，用肥皂蘸了一下水，便把肥皂放到一边。他卷起袖子，轻轻把水倒在地上，然后走进厨房，拿门后的毛巾使劲擦脸。玛丽一把拿走了毛巾。
        - id: ch01-b22
          speaker: mary
          text: “汤姆，你也不害臊！不许这样淘气。水又不会伤着你。”
        - id: ch01-b23
          speaker: narrator
          text: 汤姆有点下不来台。盆里重新装满水，他站在旁边犹豫了一阵，鼓足勇气，深吸一口气，终于洗了起来。过一会儿，他闭着眼走进厨房，伸手到处摸毛巾。脸上的肥皂沫和水还在滴滴答答，足以证明他确实洗过。可毛巾擦完，他的样子仍不合格。洗净的地方像一张面具，到了下巴和两腮便突然停止。下面是一大片没受过灌溉的黑土地，向前铺到胸口，向后绕过整个脖颈。
        - id: ch01-b24
          speaker: narrator
          text: 玛丽只好亲自动手。等她收拾完，汤姆全身终于成了同一种颜色。湿头发也梳得整整齐齐，短短的鬈发摆得又精巧又匀称。可他背地里费了好大力气，把鬈发一绺绺抹直，紧贴在头皮上。他觉得鬈发像女孩子，自己的鬈发简直害苦了他一辈子。玛丽又拿出那套两年来只在星期日穿的衣服。大家干脆叫它“另一套衣服”，所以汤姆有多少衣裳，也就不难猜了。
        - id: ch01-b25
          speaker: narrator
          text: 汤姆穿好以后，玛丽又把他的短上衣一直扣到下巴，翻下宽大的衬衫领子，掸净衣服，最后戴上那顶有斑点的草帽。他看起来好看多了，也难受极了。完整的衣服和干净的身体把他拘束得浑身不自在。他盼玛丽忘掉鞋子，这点希望也落了空。她照当时的习惯，把鞋仔细涂满牛油，拿到他面前。汤姆发起脾气，抱怨别人总逼他做不愿意做的事。
        - id: ch01-b26
          speaker: mary
          text: “求你啦，汤姆，做个乖孩子。”
        - id: ch01-b27
          speaker: narrator
          text: 汤姆一边嘟囔，一边套上鞋。玛丽很快也准备妥当，三个孩子一起去主日学校。汤姆从心底恨透了那里，锡德和玛丽却喜欢得很。
        - id: ch01-b28
          speaker: narrator
          text: 主日学校从上午九点上到十点半，之后便是教堂礼拜。三个孩子里，两个总会自愿留下听布道，第三个也会留下，只是迫于更强有力的理由。教堂又小又朴素，顶上架着一个松木板钉成、像栽树木箱似的尖塔。里面那些没软垫的高背长凳，大约能坐三百人。到了门口，汤姆故意落后一步，叫住一个穿着星期日礼服的伙伴。
        - id: ch01-b29
          speaker: tom
          text: “喂，比利，你有黄票吗？”
        - id: ch01-b30
          speaker: billy
          text: “有。”
        - id: ch01-b31
          speaker: tom
          text: “你要什么才肯换？”
        - id: ch01-b32
          speaker: billy
          text: “你能给什么？”
        - id: ch01-b33
          speaker: tom
          text: “一截甘草，再加一个鱼钩。”
        - id: ch01-b34
          speaker: billy
          text: “先拿来让我瞧瞧。”
        - id: ch01-b35
          speaker: narrator
          text: 汤姆亮出东西，比利觉得满意，这笔买卖便成交了。接着，汤姆用两颗白色石弹子换了三张红票，又拿一个小玩意儿换了两张蓝票。别的男孩陆续到来，他一个个截住，继续买了十来分钟各种颜色的票。随后，他跟一大群洗得干干净净、吵吵闹闹的男孩女孩走进教堂。一到座位，他就随手找了个男孩吵架。那位严肃的老教师刚把他们分开，一转过身，汤姆便揪了前排一个男孩的头发。等那孩子回头，他已经埋头看起书来。没多久，他又拿针扎另一个男孩，只为听对方叫一声“哎哟”，结果又挨了一顿训。
        - id: ch01-b36
          speaker: narrator
          text: 汤姆这一班全是一路货色，个个坐不住、爱吵闹、尽惹麻烦。轮到背功课，没有谁能独自背完整，全靠一路提示才熬过去。不过每个人还是得到几张蓝色小票，上面印着《圣经》句子。背出两节经文得一张蓝票，十张蓝票换一张红票，十张红票再换一张黄票。攒够十张黄票，校长便送一本装帧极其朴素的《圣经》。在那个物价低廉的年代，它值四十美分。
        - id: ch01-b37
          speaker: narrator
          text: 哪怕奖品是一本多雷插图的《圣经》，又有多少人肯背两千节经文呢？玛丽却已经这样赢得两本，那是她耐心努力两年的成果。还有个德裔男孩，竟赢得四五本。他曾一口气背出三千节经文，可脑力承受不住，从此几乎成了傻子。这对学校是个惨痛损失。从前每逢有客人的隆重日子，校长总把他叫出来“露一手”。只有年纪较大的学生，才能把票保管好，一直忍受那份枯燥功课，直到换得一本《圣经》。所以颁发这样的奖品既少见，又引人注目。得奖的学生在那一天会显得无比伟大、无比耀眼，当场便让每个学生都燃起新的雄心。不过那份雄心往往只能维持两个星期。汤姆的精神胃口也许从没真正馋过奖品，可他整个身心早就馋透了随奖品一起来的荣耀和风光，而且已经馋了许多天。
        - id: ch01-b38
          speaker: narrator
          text: 时候到了，校长站在讲坛前，手里拿着一本合上的赞美诗集，食指还插在书页之间，示意大家安静。主日学校校长发表例行短讲时，手里少不了诗集，就像音乐会上登台独唱的人少不了那张乐谱。为什么非得这样，谁也说不清。反正这两位受苦的人，一个从不翻诗集，另一个也从不看乐谱。这位沃尔特斯先生三十五岁，身材瘦削，留着沙黄色山羊胡，短发也是沙黄色。他的硬立领上沿几乎碰到耳朵，两个尖角向前弯到嘴角旁边，像一道篱笆，逼得他只能看正前方。想看旁边，就得连整个身子一起转。他下巴底下撑着一条又宽又长、两端带穗的领巾，活像一张钞票。靴尖也依照当时的时髦，高高翘得像雪橇弯头。年轻人要耐着性子，把脚尖抵在墙上一坐几个钟头，才能费力做出那种形状。
        - id: ch01-b39
          speaker: narrator
          text: 沃尔特斯先生神情认真，内心也真诚正直。他太敬畏神圣的事物和场所，把它们跟世俗生活分得太开，竟在不知不觉间养成了一种主日学校专用的腔调，平日从不这样说话。他开口了。
        - id: ch01-b40
          speaker: walters
          text: “好了，孩子们，请大家坐得端端正正、漂漂亮亮，专心听我说一两分钟。对，就是这样。好孩子就该这么坐。我看见一个小姑娘正望着窗外。她大概以为我在外面什么地方，说不定正站在树上，给小鸟儿们演说呢。看到这么多聪明又干净的小脸聚在这里，学习怎么做正确的事，怎么做个好孩子，我心里真高兴。”
        - id: ch01-b41
          speaker: narrator
          text: 孩子们发出一阵表示赞赏的轻笑。后面的演说还有一大篇，不过不必全记下来，因为那套样式从来不变，大家都很熟悉。讲到后三分之一，坏男孩们又打起架，玩起别的花样。坐立不安和窃窃私语向四面蔓延，像潮水一样，一直冲到锡德和玛丽这两块孤立而不受腐蚀的礁石脚下。等沃尔特斯先生声音一落，所有响动突然停止。大家用一阵无声的感激，迎接演说结束。
        - id: ch01-b42
          speaker: narrator
          text: 刚才那些私语，大多是因为来了几位少见的客人。撒切尔律师陪着一个年迈体弱的老人，另有一位仪表堂堂、身材魁梧、铁灰头发的中年绅士，旁边是一位端庄的太太，想必是他的妻子。太太还牵着一个孩子。汤姆原本坐立不安，满腹烦躁委屈，良心也在责备他。他不敢看艾米·劳伦斯，更受不了她含情脉脉的目光。可一看见那个新来的小姑娘，他整个灵魂立刻被幸福点燃。
        - id: ch01-b43
          speaker: narrator
          text: 下一刻，汤姆就拼命“显起本事”。他打男孩，揪头发，做鬼脸，凡是自以为能迷住姑娘、赢得喝彩的办法，全使了出来。这份狂喜只有一点美中不足。他还记得昨天在这位天使家的花园里受过羞辱。不过幸福的浪潮一阵阵涌来，沙地上那笔旧账很快便冲得不见了。
        - id: ch01-b44
          speaker: narrator
          text: 客人们被请到最尊贵的上座。沃尔特斯先生一讲完，便把他们介绍给全校。原来那位中年绅士竟是本县法官，是孩子们有生以来见过的最威严的造物。他们猜不出法官是什么材料做的，一半想听他大吼一声，一半又怕他真的吼起来。他从十二英里外的君士坦丁堡来，可见出过远门，也真正见过世面。那双眼睛甚至亲眼看过县法院，据说法院还盖着锡皮屋顶。想到这些，孩子们越发肃然起敬。教堂里一片寂静，一排排眼睛直愣愣地盯着他。
        - id: ch01-b45
          speaker: narrator
          text: 这位大人物正是撒切尔法官，是本地撒切尔律师的哥哥。杰夫·撒切尔马上走上前去，好在全校面前和法官亲近，让大家羡慕。要是听到下面的私语，他心里一定像听见音乐一样舒服。
        - id: ch01-b46
          speaker: boy
          text: “快看，吉姆！杰夫走上去了。喂，快看！他要跟法官握手啦。他真的握上啦！天哪，你不希望自己就是杰夫吗？”
        - id: ch01-b47
          speaker: narrator
          text: 沃尔特斯先生也开始“显本事”。他摆出十足的官样，忙着发命令、作裁决、下指示，这里指挥一下，那里安排一番，只要找得到对象，他就不会放过。图书管理员也抱着满怀书跑来跑去，闹出芝麻大点权力最喜欢的那种喧嚷和忙乱。年轻的女教师甜甜地俯身关照刚才还在挨耳光的学生，对淘气男孩竖起漂亮的手指警告，再亲昵地拍拍乖孩子。年轻的男教师则用几句小训斥和其他微不足道的权威做派来“显本事”，还格外卖力地维持纪律。男女教师大多忽然有事要去讲坛旁的图书处办，而且那件事总得重办两三次，每回还显出十分懊恼的样子。
        - id: ch01-b48
          speaker: narrator
          text: 小姑娘们用各种办法“显本事”。小男孩更卖力，纸团飞满屋子，推搡扭打的低响充满空气。在这一切上方，大人物高高坐着，向满堂绽开威严的法官微笑。他让自己的伟大像太阳一样照着自己，浑身暖洋洋的，因为他也在“显本事”。
        - id: ch01-b49
          speaker: narrator
          text: 沃尔特斯先生只差一件事便能得到圆满的狂喜。他需要一个机会，好颁发一本《圣经》奖品，再当着贵宾的面展示一个神童。有些学生手里有几张黄票，可谁也没攒够。他已经在那些出色的学生中挨个问过一遍。这时，他哪怕拿全世界来换，也想让那个德裔男孩恢复正常，重新回到这里。
        - id: ch01-b50
          speaker: narrator
          text: 就在希望完全断绝的时候，汤姆·索亚走上前，拿出九张黄票、九张红票和十张蓝票，要求换一本《圣经》。这简直是晴天霹雳。沃尔特斯本以为，未来十年都不可能从汤姆这个方向收到申请。可眼前这些票就像经过认证的支票，全是真的，票面值多少，就能兑多少，谁也赖不掉。汤姆便被请到法官和其他贵宾身边，总部还向全校宣布了这个大消息。这是十年来最惊人的意外。轰动之大，一下把新英雄抬到跟法官一样的高度。现在全校不再只有一个奇观供大家盯着看，而是有了两个。
        - id: ch01-b51
          speaker: narrator
          text: 男孩们全都嫉妒得要命。最痛苦的，是那些直到这时才发现，自己也替这份可恨的荣光出过力的人。他们曾拿票跟汤姆交换他靠出售刷墙资格积攒下来的财富。如今，他们恨透了自己，竟然上了一个狡猾骗子、一条阴险草中蛇的当。校长费尽力气，挤出在这种情形下所能挤出的全部热情，把奖品交给汤姆。可那股热情少了几分真挚，因为这个可怜人凭本能知道，这里藏着一个大概见不得光的秘密。汤姆居然能在脑子里囤下两千捆《圣经》的智慧，实在荒唐得离谱。毫无疑问，只要十二捆，就足以把他的容量撑到极限。
        - id: ch01-b52
          speaker: narrator
          text: 艾米·劳伦斯又骄傲又高兴，拼命想让汤姆从自己脸上看出这份心情。汤姆偏偏不肯看她。她先是疑惑，又有一点不安。一个朦胧的猜疑来了又走，转眼又回来。她仔细观察，只偷看一眼，便明白了所有事情。她的心碎了，又嫉妒又愤怒，眼泪也涌出来。她恨每一个人，尤其恨汤姆，至少她自己是这样想的。
        - id: ch01-b53
          speaker: narrator
          text: 汤姆被正式引见给法官。他舌头打结，几乎连气也喘不过来，心也不停发抖。一半是因为法官威严得可怕，更重要的是，他正是那位姑娘的父亲。要是四下无人，汤姆真恨不得趴下来膜拜他。法官把手放在汤姆头上，夸他是个了不起的小男子汉，又问他叫什么名字。汤姆结结巴巴，气喘吁吁，总算挤出回答。
        - id: ch01-b54
          speaker: tom
          text: “汤姆。”
        - id: ch01-b55
          speaker: judge_thatcher
          text: “哦，不，不只是汤姆。应该是——”
        - id: ch01-b56
          speaker: tom
          text: “托马斯。”
        - id: ch01-b57
          speaker: judge_thatcher
          text: “啊，这就对了。我想你的名字大概还长一些。很好。不过你一定还有另一个名字，也愿意告诉我，对不对？”
        - id: ch01-b58
          speaker: walters
          text: “托马斯，把你的另一个名字告诉这位先生，还要称先生。别忘了礼貌。”
        - id: ch01-b59
          speaker: tom
          text: “托马斯·索亚，先生。”
        - id: ch01-b60
          speaker: judge_thatcher
          text: “对啦！真是个好孩子。了不起，也很有男子气概。两千节经文可真不少，非常、非常多。你绝不会后悔为背它们吃过的苦，因为世上没有什么比知识更宝贵。知识能造就伟大而善良的人。托马斯，总有一天，你也会成为那样的人。到时候，你会回头说，这全靠童年时在主日学校得到的宝贵机会，全靠亲爱的老师教你学习，也全靠那位好校长鼓励你、照看你，还送给你一本漂亮又华美的《圣经》，让你永远保存，完完全全归你自己。你会说，这一切都来自正确的教养。”
        - id: ch01-b61
          speaker: judge_thatcher
          text: “托马斯，就算有人拿钱来换你背的两千节经文，你也绝不肯。现在，你一定愿意把自己学到的东西告诉我和这位太太。我们都为肯学习的孩子感到骄傲。十二门徒的名字，你一定全知道。那就告诉我们，最早受选的两位叫什么？”
        - id: ch01-b62
          speaker: narrator
          text: 汤姆揪着一个扣眼，难为情地望着地面。他的脸涨红了，眼睛也垂下来。沃尔特斯先生的心直往下沉。他暗想，这孩子难道连最简单的问题也答不出来？法官为什么偏偏要问他？可他又不得不开口催促。
        - id: ch01-b63
          speaker: walters
          text: “托马斯，回答这位先生。别害怕。”
        - id: ch01-b64
          speaker: narrator
          text: 汤姆仍旧没有回答，只是迟迟不肯开口。
        - id: ch01-b65
          speaker: mrs_thatcher
          text: “我知道你会告诉我的。最早的两位门徒是——”
        - id: ch01-b66
          speaker: tom
          text: “大卫和歌利亚！”
        - id: ch01-b67
          speaker: narrator
          text: 现在，让我们拉下慈悲的帷幕，遮住这尴尬场面的其余部分吧。
