  chapters:
    - id: ch01
      title: CHAPTER IV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sunday morning rose over a quiet world. The sun shone on the peaceful village like a blessing. After breakfast, Aunt Polly led the family in worship. Her prayer was built mostly from solid layers of Scripture, held together by just a little of her own wording. From that height she came down upon them with a grim chapter of the law of Moses, as if she were speaking from Mount Sinai.
        - id: ch01-b02
          speaker: narrator
          text: Then Tom prepared himself for the hard labor of learning his Bible verses. Sid had finished his lesson days ago. Tom put all his strength into memorizing five verses from the Sermon on the Mount, chosen because he could find none that were shorter. Half an hour later, he had only a cloudy notion of them. His mind had wandered across the whole field of human thought, while his hands kept finding little amusements. Mary took the book and listened as he tried to feel his way through the fog.
        - id: ch01-b03
          speaker: tom
          text: "Blessed are the... the..."
        - id: ch01-b04
          speaker: mary
          text: "The word is poor."
        - id: ch01-b05
          speaker: tom
          text: "Right, poor. Blessed are the poor... the poor..."
        - id: ch01-b06
          speaker: mary
          text: "Now say in spirit."
        - id: ch01-b07
          speaker: tom
          text: "In spirit. Blessed are the poor in spirit, for they... they..."
        - id: ch01-b08
          speaker: mary
          text: "The next word is theirs."
        - id: ch01-b09
          speaker: tom
          text: "For theirs. Blessed are the poor in spirit, for theirs is the kingdom of heaven. Blessed are they that mourn, for they... they..."
        - id: ch01-b10
          speaker: mary
          text: "It starts with sh."
        - id: ch01-b11
          speaker: tom
          text: "For they..."
        - id: ch01-b12
          speaker: mary
          text: "Listen, it begins S, H, A."
        - id: ch01-b13
          speaker: tom
          text: "For they S, H... Oh, I don't know!"
        - id: ch01-b14
          speaker: mary
          text: "The word is shall!"
        - id: ch01-b15
          speaker: tom
          text: "Oh, shall! For they shall... they shall... shall mourn... Blessed are they that shall... that shall mourn, for they shall... shall what? Why won't you tell me, Mary? Why are you being so mean?"
        - id: ch01-b16
          speaker: mary
          text: "Oh, Tom, you poor thick-headed boy. I'm not teasing you. I never would. Go learn it one more time. Don't give up. You can do it, and when you do, I'll give you something very nice. Come on, be a good boy."
        - id: ch01-b17
          speaker: tom
          text: "All right! What is it, Mary? Tell me."
        - id: ch01-b18
          speaker: mary
          text: "Never mind what it is. You know that when I call something nice, I mean it."
        - id: ch01-b19
          speaker: tom
          text: "That's true, Mary. All right, I'll try again."
        - id: ch01-b20
          speaker: narrator
          text: Tom did try again. Curiosity pushed him from one side, and the hope of a reward pushed from the other. He attacked the lesson so eagerly that he soon knew it perfectly. Mary gave him a brand-new Barlow knife worth twelve and a half cents, and delight shook him to his foundations. The knife could not cut anything, but it was a real Barlow, and that alone made it magnificent. Why boys in the West ever decided that someone might make a false Barlow and damage the honor of the real thing is an impressive mystery. Perhaps it always will be. Tom managed to scratch the cupboard with his prize. He was getting ready to start on the bureau when he was called away to dress for Sunday school.
        - id: ch01-b21
          speaker: narrator
          text: Mary handed him a tin basin of water and a piece of soap. Tom carried them outside and set the basin on a little bench. He dipped the soap into the water, put it down, and rolled up his sleeves. Then he carefully poured the water onto the ground. Back in the kitchen, he began rubbing his dry face very hard with the towel behind the door. Mary pulled the towel away.
        - id: ch01-b22
          speaker: mary
          text: "Tom, aren't you ashamed of yourself? You don't have to behave this badly. Water won't hurt you."
        - id: ch01-b23
          speaker: narrator
          text: Tom was caught off guard. The basin was filled again. This time he stood over it for a while, gathering his courage. He drew one great breath and began. Soon he came into the kitchen with both eyes shut, feeling for the towel while soap and water streamed from his face. But even after the towel, he was not clean enough. The clean part stopped at his chin and jaws like a mask. Below that line, the dirt stretched down the front of his neck and all the way around it.
        - id: ch01-b24
          speaker: narrator
          text: Mary took charge. When she finished, Tom was the same color all over. His wet hair had been brushed into neat, even curls. In private, he worked hard to flatten those curls against his head. He thought curls were girlish, and his own made his life bitter.
        - id: ch01-b25
          speaker: narrator
          text: Next Mary brought out the suit he had worn only on Sundays for the past two years. The family simply called it his other clothes, which tells us how large his wardrobe was. After Tom dressed, Mary made him proper. She buttoned his neat short jacket all the way to his chin, folded his enormous shirt collar over his shoulders, brushed every speck from him, and set his spotted straw hat on his head. He looked wonderfully improved and deeply uncomfortable. Whole clothes and cleanliness pinched and troubled him as much as his face showed.
        - id: ch01-b26
          speaker: narrator
          text: Tom hoped Mary might forget his shoes. She did not. She polished them thoroughly with tallow, as people did then, and brought them to him. Tom lost his temper and complained that he was always forced to do everything he hated. Mary answered in her most persuasive voice.
        - id: ch01-b27
          speaker: mary
          text: "Please, Tom. Be a good boy."
        - id: ch01-b28
          speaker: narrator
          text: Tom put on the shoes with a growl. Soon Mary was ready, and the three children left for Sunday school. Tom hated the place with his whole heart. Sid and Mary liked it.
        - id: ch01-b29
          speaker: narrator
          text: Sunday school lasted from nine until half past ten, and church came afterward. Two of the children always stayed for the sermon because they wanted to. The third always stayed too, but for stronger reasons. The little plain church held about three hundred people on tall, hard-backed benches. On its roof stood something like a wooden box meant to serve as a steeple.
        - id: ch01-b30
          speaker: narrator
          text: At the door, Tom dropped behind the others and stopped a friend dressed in his Sunday clothes.
        - id: ch01-b31
          speaker: tom
          text: "Hey, Billy, have you got a yellow ticket?"
        - id: ch01-b32
          speaker: billy
          text: "Yes, I've got one."
        - id: ch01-b33
          speaker: tom
          text: "What do you want for it?"
        - id: ch01-b34
          speaker: billy
          text: "What will you give me?"
        - id: ch01-b35
          speaker: tom
          text: "A piece of licorice and a fishhook."
        - id: ch01-b36
          speaker: billy
          text: "Let me see them."
        - id: ch01-b37
          speaker: narrator
          text: Tom showed him. Billy approved, and they made the trade. Tom exchanged two white marbles for three red tickets, then some other small treasure for two blue ones. For another ten or fifteen minutes, he stopped boys as they arrived and bought tickets of every color.
        - id: ch01-b38
          speaker: narrator
          text: Then he went inside with a swarm of clean, noisy children. He reached his seat and promptly began quarreling with the nearest boy. His teacher, a serious old man, stopped them. The moment the teacher turned away, Tom pulled the hair of a boy on the next bench. When the boy looked back, Tom was deep in his book. A little later, Tom stuck a pin into someone else just to hear the result.
        - id: ch01-b39
          speaker: class_boy
          text: "Ouch, that hurt!"
          emotion: surprised
        - id: ch01-b40
          speaker: narrator
          text: Tom earned another scolding. His entire class was much like him. They were noisy, restless, and troublesome. Not one knew his verses perfectly when it was time to recite. All of them needed help from beginning to end. Somehow they struggled through and received their rewards, little blue tickets printed with passages from Scripture.
        - id: ch01-b41
          speaker: narrator
          text: One blue ticket paid for two memorized verses. Ten blue tickets could be traded for one red ticket, and ten red tickets for one yellow. A student who collected ten yellow tickets received a plainly bound Bible from the superintendent. It cost forty cents in those easier times. But think of the labor behind it. How many readers would have the patience to memorize two thousand verses, even for a fine illustrated Bible?
        - id: ch01-b42
          speaker: narrator
          text: Mary had earned two Bibles in two years of patient work. A German boy had won four or five. Once he recited three thousand verses without stopping, but the strain was too much for his mind. From then on, he was hardly better than an idiot. This was a serious loss for the school. On great occasions, when company came, the superintendent had always brought that boy forward and made him spread himself, as Tom put it. Now the school no longer had its favorite wonder to display.
        - id: ch01-b43
          speaker: narrator
          text: Only the older students could save their tickets and keep at the tiresome work long enough to win a Bible. A prize ceremony was rare and important. For that whole day, the successful pupil stood out above everyone else. Every other student caught fire with fresh ambition, though the feeling often lasted only a couple of weeks. Tom's mind had probably never hungered for the prize itself. For many days, though, his whole being had longed for the glory and excitement that came with it.
        - id: ch01-b44
          speaker: narrator
          text: At last the superintendent rose before the pulpit. He held a closed hymnbook with one finger tucked between its pages and called for attention. A superintendent making his usual speech seemed to need a hymnbook just as a concert singer needed a sheet of music. No one knew why. Neither sufferer ever looked at the thing.
        - id: ch01-b45
          speaker: narrator
          text: Mr. Walters was a thin man of thirty-five, with short sandy hair and a sandy goatee. His stiff collar rose almost to his ears. Its sharp corners curved beside his mouth like a fence, so he had to stare straight ahead or turn his whole body to look sideways. A wide cravat supported his chin. It was as broad and long as a banknote, with fringe at both ends. The toes of his boots curved sharply upward like sleigh runners. Young men patiently created that fashionable shape by sitting for hours with their toes pressed against a wall.
        - id: ch01-b46
          speaker: narrator
          text: Mr. Walters looked very solemn, and at heart he was sincere and honest. He kept holy places and holy things so far apart from ordinary life that his Sunday-school voice had developed a special sound he never used during the week. He began in that voice.
        - id: ch01-b47
          speaker: mr_walters
          text: "Now, children, sit up as straight and nicely as you can, and give me your full attention for a minute or two. There, that's right. That's how good little boys and girls should sit. I see one little girl looking out the window. Perhaps she thinks I'm outside somewhere, making a speech to the birds in one of those trees. It makes me very happy to see so many bright, clean faces gathered in a place like this, learning to do right and to be good."
        - id: ch01-b48
          speaker: narrator
          text: A pleased little laugh followed his joke. Then the speech continued in the usual way. There is no need to repeat the rest. Speeches like it never change, and everyone knows them.
        - id: ch01-b49
          speaker: narrator
          text: During the last third, some of the bad boys returned to fighting and other amusements. Fidgeting and whispers spread wider and wider across the room. They washed right up to firm, lonely rocks like Sid and Mary, who could not be corrupted. Then Mr. Walters stopped speaking. Every sound died at once, and the end of the speech was welcomed with a burst of silent gratitude.
        - id: ch01-b50
          speaker: narrator
          text: Much of the whispering had been caused by some unusual visitors. Lawyer Thatcher entered with a very weak old man, a dignified lady, and a handsome, heavy middle-aged gentleman whose hair was streaked with gray. The lady led a little girl.
        - id: ch01-b51
          speaker: narrator
          text: Until then, Tom had been restless and miserable. His conscience bothered him. He could not meet Amy Lawrence's eyes or bear her loving look. But the instant he saw the little newcomer, happiness set his whole soul on fire. He began showing off with all his might. He cuffed boys, pulled hair, and made faces. He tried every trick that might charm the girl and win her applause. Only one memory spoiled his joy a little. He remembered being humiliated in this angel's garden, but the waves of his new happiness were already washing that mark from the sand.
        - id: ch01-b52
          speaker: narrator
          text: The visitors received the best seats. When Mr. Walters finished, he introduced them. The gray-haired man was no ordinary person. He was the county judge, the grandest human being those children had ever seen. They wondered what he was made of. Half of them wanted to hear him roar, and half were afraid he might.
        - id: ch01-b53
          speaker: narrator
          text: Judge Thatcher came from Constantinople, twelve miles away. To the children, that meant he had traveled and seen the world. Those very eyes had looked upon the county courthouse, which people said had a tin roof. Their thoughts about such wonders filled them with awe. The school fell into an impressive silence, and row after row of eyes stared at him.
        - id: ch01-b54
          speaker: narrator
          text: This mighty Judge Thatcher was the brother of their own lawyer. Jeff Thatcher went up at once to show that he knew the great man and to make everyone envy him. The whispers would have sounded like music to Jeff.
        - id: ch01-b55
          speaker: schoolboy
          text: "Look at him, Jim! He's going right up there. Look, he's going to shake hands with the Judge. He really is shaking hands! By jings, don't you wish you were Jeff?"
        - id: ch01-b56
          speaker: narrator
          text: Mr. Walters began showing off too. He bustled around officially, giving orders, making decisions, and issuing directions wherever he could find someone to receive them. The librarian hurried back and forth with armfuls of books, making all the noise and fuss that a little bit of authority can produce.
        - id: ch01-b57
          speaker: narrator
          text: The young women teachers bent sweetly over children they had been boxing only moments earlier. They raised pretty warning fingers at bad boys and lovingly patted the good ones. The young men teachers gave small scoldings and made careful displays of discipline. Most of the teachers found urgent business near the library by the pulpit. Much of that business had to be done two or three times, to their apparent annoyance.
        - id: ch01-b58
          speaker: narrator
          text: The little girls showed off in their own ways. The little boys worked at it so busily that the air grew thick with paper wads and the low sounds of scuffling. Above them all, the great man sat smiling upon the room with a majestic, judging smile. He warmed himself in the sunlight of his own greatness, because the Judge was showing off too.
        - id: ch01-b59
          speaker: narrator
          text: Only one thing was missing from Mr. Walters's perfect happiness. He needed a chance to present a Bible and display some brilliant student. He had already questioned the best pupils. Several owned a few yellow tickets, but no one had enough. At that moment, he would have given the world to have the German boy back with his mind restored.
        - id: ch01-b60
          speaker: narrator
          text: Just when all hope was gone, Tom Sawyer stepped forward. He carried nine yellow tickets, nine red ones, and ten blue ones, and he asked for a Bible. It was a thunderbolt from a clear sky. Mr. Walters had not expected Tom to make such a claim for at least ten years. Yet the tickets were there, and every one had its full value.
        - id: ch01-b61
          speaker: narrator
          text: Tom was raised to a place beside the Judge and the other honored guests, and the wonderful news was announced. Nothing had astonished the school so much in ten years. The surprise lifted the new hero to the Judge's own height. Now everyone had two marvels to stare at instead of one.
        - id: ch01-b62
          speaker: narrator
          text: The boys were sick with envy. The worst pain belonged to those who realized too late that they had helped build Tom's hated glory. They had traded him the tickets in return for treasures he earned by selling turns at whitewashing the fence. Now they despised themselves for being fooled by that sly fraud, that snake in the grass.
        - id: ch01-b63
          speaker: narrator
          text: Mr. Walters presented the prize with as much enthusiasm as he could force out under the circumstances. But the true warmth was missing. Some instinct told the poor man that a mystery lay underneath all this, and that it might not stand much light. The thought of Tom storing two thousand whole verses of Scripture in his mind was simply absurd. A mere dozen would have stretched his capacity beyond doubt.
        - id: ch01-b64
          speaker: narrator
          text: Amy Lawrence was proud and happy. She tried to show Tom with her face, but he would not look at her. First she wondered why. Then she grew a little troubled. A faint suspicion came and went, then came again. She watched him. One secret glance told her everything. Her heart broke. Jealousy and anger brought tears to her eyes, and she hated everyone. Most of all, she thought she hated Tom.
        - id: ch01-b65
          speaker: narrator
          text: Tom was introduced to the Judge. His tongue stopped working. He could hardly breathe, and his heart shook. The Judge's greatness was frightening enough, but even worse, he was the little girl's father. If they had been in the dark, Tom would have liked to fall down and worship him. The Judge rested a hand on Tom's head, called him a fine little man, and asked his name. Tom stammered and gasped before he managed one word.
        - id: ch01-b66
          speaker: tom
          text: "My name is Tom."
        - id: ch01-b67
          speaker: judge_thatcher
          text: "Oh, no, not just Tom. It must be..."
        - id: ch01-b68
          speaker: tom
          text: "It's Thomas."
        - id: ch01-b69
          speaker: judge_thatcher
          text: "Ah, that's it. I thought there might be more to it. Very good. But I imagine you have another name too. You'll tell me, won't you?"
        - id: ch01-b70
          speaker: mr_walters
          text: "Tell the gentleman your other name, Thomas, and remember to say sir. Mind your manners."
        - id: ch01-b71
          speaker: tom
          text: "Thomas Sawyer, sir."
        - id: ch01-b72
          speaker: judge_thatcher
          text: "There we are! Good boy. A fine, manly little fellow. Two thousand verses is a great number, a very great number. You'll never regret the work it took to learn them. Knowledge is worth more than anything else in the world. It makes men great and good. Someday you'll be a great and good man yourself, Thomas."
        - id: ch01-b73
          speaker: judge_thatcher
          text: "Then you'll look back and say it was all because of the precious Sunday-school opportunities you had as a boy. You'll thank the dear teachers who taught you to learn, and the good superintendent who encouraged you, watched over you, and gave you a beautiful, splendid Bible to keep forever. You'll say it all came from being raised properly. That's what you'll say, Thomas. You wouldn't trade those two thousand verses for any amount of money. No, indeed."
        - id: ch01-b74
          speaker: judge_thatcher
          text: "And I'm sure you won't mind telling this lady and me some of what you've learned. We are proud of boys who study. No doubt you know the names of all twelve disciples. Tell us the names of the first two who were chosen."
        - id: ch01-b75
          speaker: narrator
          text: Tom tugged at a buttonhole and looked ashamed. His face reddened, and his eyes dropped. Mr. Walters felt his heart sink. Surely the boy could not answer even the simplest question. Why had the Judge chosen to ask him this? Still, the superintendent had to urge him on.
        - id: ch01-b76
          speaker: mr_walters
          text: "Answer the gentleman, Thomas. Don't be afraid."
        - id: ch01-b77
          speaker: narrator
          text: Tom still could not speak.
        - id: ch01-b78
          speaker: mrs_thatcher
          text: "I know you'll tell me. The first two disciples were..."
        - id: ch01-b79
          speaker: tom
          text: "David and Goliath!"
        - id: ch01-b80
          speaker: narrator
          text: Let us draw the curtain of charity over the rest of the scene.
