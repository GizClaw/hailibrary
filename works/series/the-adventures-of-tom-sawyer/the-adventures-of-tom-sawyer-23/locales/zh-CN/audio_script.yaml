audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    huck:
      display_name: 哈克贝利
      tts:
        delivery: 随性粗放，满不在乎又笃定
        timbre: 略沙哑的少年声
        pace: 松快
        pitch: 中音
    muff_potter:
      display_name: 莫夫·波特
      tts:
        delivery: 粗声粗气，醉意未消又容易惊慌
        timbre: 沙哑疲惫
        pace: 时快时慢
        pitch: 中低音
    injun_joe:
      display_name: 印第安·乔
      tts:
        delivery: 阴冷克制，威胁时不动声色
        timbre: 冷硬低沉
        pace: 缓慢
        pitch: 低音
    prosecutor:
      display_name: 检方律师
      tts:
        delivery: 冷静有力，陈述时斩钉截铁
        timbre: 洪亮清晰
        pace: 稳健
        pitch: 中低音
    defense_counsel:
      display_name: 辩方律师
      tts:
        delivery: 克制沉着，问话时温和坚定
        timbre: 清晰厚实
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 守住秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 村子里那股昏昏欲睡的宁静，终于被一件大事彻底搅醒了。谋杀案开庭审判，立刻成了人人嘴里的头等新闻。汤姆无论走到哪里都躲不开。别人每提一次案子，他心里就猛地哆嗦一下。他明知没人会怀疑自己知道内情，却总觉得那些话是故意当着他的面说的，想探探他的反应。恐惧和愧疚缠着他，叫他时时刻刻浑身发冷。
        - id: ch01-b02
          speaker: narrator
          text: 他把哈克带到一个僻静地方。能把秘密说上几句，把苦恼分给另一个同样受罪的人，也许会好受些。他更想确定，哈克是不是真的一直没有开口。
        - id: ch01-b03
          speaker: tom
          text: “哈克，那件事……你跟别人说过吗？”
        - id: ch01-b04
          speaker: huck
          text: “什么事？”
        - id: ch01-b05
          speaker: tom
          text: “你知道我说的是什么。”
        - id: ch01-b06
          speaker: huck
          text: “当然没有。”
        - id: ch01-b07
          speaker: tom
          text: “真的一个字也没说？”
        - id: ch01-b08
          speaker: huck
          text: “半个字都没有，我发誓。你怎么忽然问这个？”
        - id: ch01-b09
          speaker: tom
          text: “我就是有点害怕。”
          emotion: fearful
        - id: ch01-b10
          speaker: huck
          text: “汤姆·索亚，那事要是泄露了，咱们连两天也活不成。你明明知道。”
        - id: ch01-b11
          speaker: narrator
          text: 汤姆稍稍安心了。沉默片刻，他还是放心不下。
        - id: ch01-b12
          speaker: tom
          text: “哈克，不管别人怎么逼，你都不会说吧？”
        - id: ch01-b13
          speaker: huck
          text: “逼我？除非我想让那个混血恶魔把我淹死，他们才有可能逼我开口。除此以外，想都别想。”
        - id: ch01-b14
          speaker: tom
          text: “那就好。只要咱们闭紧嘴，应该就安全。不过还是再发一次誓吧，更保险。”
        - id: ch01-b15
          speaker: huck
          text: “行。”
        - id: ch01-b16
          speaker: narrator
          text: 两个人又郑重其事地发了一遍那个可怕的誓。
        - id: ch01-b17
          speaker: tom
          text: “外面都怎么说，哈克？我听见的可不少。”
        - id: ch01-b18
          speaker: huck
          text: “还能说谁？莫夫·波特，莫夫·波特，一天到晚全是莫夫·波特。听得我不停冒冷汗，只想找个地方藏起来。”
        - id: ch01-b19
          speaker: tom
          text: “我那边也是这样。看来他这回完了。你会不会替他难过？”
        - id: ch01-b20
          speaker: huck
          text: “差不多一直都难过。他是没什么出息，可从没伤害过谁。他钓鱼换酒喝，也常常到处闲逛。不过大多数人不都这样吗，除了牧师那一类。他心眼儿其实不坏。有一次，那条鱼根本不够两个人吃，他还分给我一半。我倒霉的时候，他也帮过我好多回。”
        - id: ch01-b21
          speaker: tom
          text: “他给我补过风筝，还替我的钓线拴过鱼钩。要是咱们能把他救出来就好了。”
        - id: ch01-b22
          speaker: huck
          text: “咱们怎么救得了他？就算救出来，他们也会再抓回去。”
        - id: ch01-b23
          speaker: tom
          text: “是啊。可那件事根本不是他干的，他们却把他骂得那么狠，我听着真难受。”
        - id: ch01-b24
          speaker: huck
          text: “我也是。他们说他是这一带长得最凶恶的坏蛋，还奇怪他以前怎么没上绞架。”
        - id: ch01-b25
          speaker: tom
          text: “他们总这么说。还有人说，他就算获释，也会被私下吊死。”
        - id: ch01-b26
          speaker: huck
          text: “他们一定干得出来。”
    - id: ch02
      title: 铁窗后的波特
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两个孩子谈了很久，心里却没轻松多少。黄昏到了，他们不知不觉在那座孤零零的小监狱附近徘徊，心里隐约还存着一丝指望。他们盼着会有一件奇事突然发生，把眼前的难题全解决掉。可是什么也没发生。看来没有天使，也没有仙女，愿意搭救这个倒霉的囚犯。
        - id: ch02-b02
          speaker: narrator
          text: 他们照以前常做的那样，来到牢房的铁窗外，给波特送去烟草和火柴。牢房就在底层，旁边一个守卫也没有。波特每次收到这些礼物都感激极了，而他的感激每次都像针一样扎着两个孩子的良心。这一天，那根针扎得尤其深。他一开口，他们更觉得自己又胆小又卑鄙，简直到了极点。
        - id: ch02-b03
          speaker: muff_potter
          text: “孩子们，你们待我真好，比镇上所有人都好。我不会忘的。我常对自己说，从前我替孩子们修风筝，告诉他们哪儿钓鱼最好，能帮的忙也都帮了。如今老莫夫有难，他们全忘了他。可汤姆没忘，哈克也没忘。我不会忘记你们。”
        - id: ch02-b04
          speaker: muff_potter
          text: “唉，我干了件可怕的事。那时候我喝醉了，发了疯，也只能这么解释。如今我得上绞架，这是应该的，或许也是最好的结果。好了，不说这个。我不愿叫你们难过。你们对我这么好，我只想劝你们，千万别喝醉。只要不喝醉，你们就永远不会落到我这个地方。”
        - id: ch02-b05
          speaker: muff_potter
          text: “再往西边站一点。对，就是那里。一个人倒了这么大的霉，还能看见友善的脸，真是莫大的安慰。除了你们，没有别人来看我。多亲切的脸啊。一个人爬到另一个人的背上，让我摸摸。好了，再握握手。你们的小手能伸过铁栏，我的手太大了。这些小手虽然没多少力气，却已经帮了莫夫·波特许多。要是办得到，它们一定还会帮我更多。”
        - id: ch02-b06
          speaker: narrator
          text: 汤姆带着满心痛苦回家，夜里的梦也全是恐怖景象。第二天和第三天，他总在法院外面转。仿佛有一股几乎无法抗拒的力量非要把他拉进去，他却拼命逼自己留在门外。哈克也在受同样的折磨。两个人故意躲着彼此，各自也会暂时走远，可过不了多久，那股阴森的吸引力又会把他们带回来。
        - id: ch02-b07
          speaker: narrator
          text: 每逢闲人从法院里慢悠悠地走出来，汤姆便竖起耳朵，生怕错过一句话。可他听到的总是坏消息。可怜的波特已经落进罗网，那张网还在一刻不停地越收越紧。第二天结束时，全村都在传，印第安乔的证词牢不可破，陪审团会作出怎样的裁决，已经毫无悬念。
    - id: ch03
      title: 审判
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那天晚上，汤姆在外面待到很晚，最后从窗户爬回卧室。他激动得厉害，过了好几个钟头才睡着。第二天清早，全村人都涌进法院，因为这是决定一切的日子。旁听席挤得水泄不通，男女差不多各占一半。
        - id: ch03-b02
          speaker: narrator
          text: 众人等了许久，陪审员终于排着队走进来，各自坐好。接着，波特被带进法庭。他脸色惨白，神情憔悴，戴着沉重的镣铐，怯生生地坐在所有好奇目光都能盯住的地方，脸上已经没有一点希望。印第安乔也同样显眼，还是那么冷漠。又等了一阵，法官才到场，治安官随即宣布开庭。律师们照例低声交谈，把一叠叠文件拢到一起。这些琐碎程序一再拖延时间，也让满屋子的人越发觉得，一件庄严可怕的大事就要发生了。
        - id: ch03-b03
          speaker: narrator
          text: 第一名证人说，发现谋杀案的那天清早，他看见莫夫·波特在小溪里洗东西。波特一看见他，马上偷偷溜走。检方又问了几个问题。
        - id: ch03-b04
          speaker: prosecutor
          text: “证人交给辩方。”
        - id: ch03-b05
          speaker: narrator
          text: 波特抬了一下眼睛。可他的律师一开口，他马上又垂下眼帘。
        - id: ch03-b06
          speaker: defense_counsel
          text: “我没有问题要问这名证人。”
        - id: ch03-b07
          speaker: narrator
          text: 第二名证人证明，那把刀是在尸体旁边发现的。检方再次把证人交给辩方。
        - id: ch03-b08
          speaker: defense_counsel
          text: “我也没有问题要问这名证人。”
        - id: ch03-b09
          speaker: narrator
          text: 第三名证人发誓，他经常看见波特带着那把刀。检方照样把证人交过去，波特的律师还是拒绝发问。旁听的人开始恼火了。难道这个律师准备眼睁睁丢掉当事人的性命，连一点努力都不肯做？
        - id: ch03-b10
          speaker: narrator
          text: 更多证人被传上庭，讲述波特被带回谋杀现场时种种显得心虚的举动。他们说完便离开证人席，辩方一个也没盘问。案发那天早晨，墓地里发生的每一个对波特不利的细节，都由可信的人一一说了出来。在场的人还清楚记得那天的情形，可波特的律师仍旧沉默。满屋子的困惑和不满终于化成低低的议论声，惹得法官出言斥责。
        - id: ch03-b11
          speaker: prosecutor
          text: “各位证人的信用无可怀疑。他们已经立誓作证，足以证明这桩骇人的罪行确实是被告所犯，不再有任何疑问。检方陈述完毕。”
        - id: ch03-b12
          speaker: narrator
          text: 可怜的波特呻吟一声，双手掩住脸，身子轻轻地前后摇晃。法庭里笼罩着一片令人难受的寂静。许多男人深受触动，不少女人也流下了同情的眼泪。就在这片沉默中，辩方律师站了起来。
        - id: ch03-b13
          speaker: defense_counsel
          text: “法官大人，开庭时我们曾表示，会证明当事人是在醉酒引起的神志昏乱中犯下罪行。当时他失去了理智，不能为自己的行为负责。现在，我们改变主意，不再提出这种辩护。请传托马斯·索亚出庭。”
        - id: ch03-b14
          speaker: narrator
          text: 整个法庭顿时又惊又迷惑，连波特也不例外。汤姆站起来，走上证人席。所有人的目光都带着惊奇，牢牢盯在他身上。这个孩子吓坏了，脸上满是慌乱。书记员让他宣誓以后，辩方律师开始问话。
    - id: ch04
      title: 汤姆作证
      blocks:
        - id: ch04-b01
          speaker: defense_counsel
          text: “托马斯·索亚，六月十七日午夜前后，你在哪里？”
        - id: ch04-b02
          speaker: narrator
          text: 汤姆看了一眼印第安乔那张铁铸般的脸，舌头立刻僵住了。旁听的人全都屏住呼吸，等着他说话，他却一个字也吐不出来。过了好一会儿，他才找回一点力气，勉强把声音提起来，让附近的一部分人听清。
        - id: ch04-b03
          speaker: tom
          text: “在墓地里！”
          emotion: fearful
        - id: ch04-b04
          speaker: defense_counsel
          text: “请大声一点。别怕。你当时在什么地方？”
        - id: ch04-b05
          speaker: tom
          text: “在墓地里。”
        - id: ch04-b06
          speaker: narrator
          text: 印第安乔的脸上掠过一丝轻蔑的笑。
        - id: ch04-b07
          speaker: defense_counsel
          text: “你离霍斯·威廉斯的坟近吗？”
        - id: ch04-b08
          speaker: tom
          text: “近，先生。”
        - id: ch04-b09
          speaker: defense_counsel
          text: “声音再大一点。你离那座坟有多近？”
        - id: ch04-b10
          speaker: tom
          text: “就像现在离您这么近。”
        - id: ch04-b11
          speaker: defense_counsel
          text: “你藏起来了吗？”
        - id: ch04-b12
          speaker: tom
          text: “藏起来了。”
        - id: ch04-b13
          speaker: defense_counsel
          text: “藏在哪里？”
        - id: ch04-b14
          speaker: tom
          text: “坟边那几棵榆树后面。”
        - id: ch04-b15
          speaker: narrator
          text: 印第安乔的身体极轻微地动了一下，旁听席上几乎没有人察觉。
        - id: ch04-b16
          speaker: defense_counsel
          text: “当时有人跟你在一起吗？”
        - id: ch04-b17
          speaker: tom
          text: “有，先生。我是跟……”
        - id: ch04-b18
          speaker: defense_counsel
          text: “先别说你同伴的名字。到了适当的时候，我们会叫他出庭。你去那里时带了什么东西？”
        - id: ch04-b19
          speaker: narrator
          text: 汤姆迟疑起来，看上去十分窘迫。
        - id: ch04-b20
          speaker: defense_counsel
          text: “说出来吧，孩子，别不好意思。说真话永远不丢人。你带了什么？”
        - id: ch04-b21
          speaker: tom
          text: “只有一只……一只死猫。”
        - id: ch04-b22
          speaker: narrator
          text: 法庭里荡开一阵轻笑，笑声从旁听席上轻轻传开，很快又被法庭制止了。
        - id: ch04-b23
          speaker: defense_counsel
          text: “我们会把那只猫的骨架呈上来。现在，把发生的一切照你自己的方式告诉我们。什么也别漏掉，不用害怕。”
        - id: ch04-b24
          speaker: narrator
          text: 汤姆终于开口了。起初，他说得吞吞吐吐。可随着故事讲下去，他渐渐有了勇气，话也说得越来越顺。很快，整个法庭除了他的声音，再也听不见别的动静。每双眼睛都紧盯着他。人们微张着嘴，屏住呼吸，完全忘记了时间，全被那个可怕故事里阴森的吸引力攫住。压抑已久的情绪越绷越紧，终于到了极点。
        - id: ch04-b25
          speaker: tom
          text: “后来医生抡起木板，莫夫·波特倒下了。印第安乔拿着刀扑过去，就……”
          emotion: fearful
        - id: ch04-b26
          speaker: narrator
          text: 哗啦一声！那个混血人像闪电一样扑向窗户，撞开所有挡路的人，逃得无影无踪！
