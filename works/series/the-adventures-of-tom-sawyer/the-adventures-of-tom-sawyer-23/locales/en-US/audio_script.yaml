audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry sense of humor
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
    tom:
      display_name: Tom Sawyer
      tts:
        delivery: earnest and quick, with nervous energy
        timbre: clear and youthful
        pace: lively, slowing when afraid
        pitch: medium-high
    huck:
      display_name: Huckleberry Finn
      tts:
        delivery: rough-edged, plainspoken, and wary
        timbre: light and dusty
        pace: easy, with sudden emphasis
        pitch: medium
    muff_potter:
      display_name: Muff Potter
      tts:
        delivery: humble, weary, and deeply grateful
        timbre: coarse and worn
        pace: slow and uneven
        pitch: low
    prosecutor:
      display_name: Prosecuting Attorney
      tts:
        delivery: formal, controlled, and forceful
        timbre: firm and resonant
        pace: deliberate
        pitch: medium-low
    defense_counsel:
      display_name: Defense Counsel
      tts:
        delivery: restrained and professional, turning gently encouraging
        timbre: smooth and clear
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER XXIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At last, the village's sleepy mood was shaken wide awake. The murder trial had begun, and suddenly everyone was talking about it. Tom could not escape the subject. Each mention of the murder made his heart shudder. His guilty conscience and fear almost convinced him that people were dropping hints just to test him. He could not see how anyone might suspect what he knew, yet every bit of gossip left him in a cold tremble.
        - id: ch01-b02
          speaker: narrator
          text: Tom took Huck somewhere lonely so they could talk. Sharing the secret for a little while might ease the weight on him. More than that, he needed to know whether Huck had kept quiet.
        - id: ch01-b03
          speaker: tom
          text: Huck, have you ever told anybody about... that?
        - id: ch01-b04
          speaker: huck
          text: About what?
        - id: ch01-b05
          speaker: tom
          text: You know what I mean.
        - id: ch01-b06
          speaker: huck
          text: Oh, course I haven't.
        - id: ch01-b07
          speaker: tom
          text: Not one word?
        - id: ch01-b08
          speaker: huck
          text: Not one single word, so help me. Why're you asking?
        - id: ch01-b09
          speaker: tom
          text: Well, I was scared you might've.
        - id: ch01-b10
          speaker: huck
          text: Why, Tom Sawyer, if anybody found out, we wouldn't stay alive two days. You know that.
        - id: ch01-b11
          speaker: narrator
          text: Tom felt a little easier. After a pause, he asked one more thing.
        - id: ch01-b12
          speaker: tom
          text: Nobody could make you tell, could they, Huck?
        - id: ch01-b13
          speaker: huck
          text: Make me tell? Sure, if I wanted that half-breed devil to drown me. That's the only way they'd ever get it out of me.
        - id: ch01-b14
          speaker: tom
          text: Then we're all right. I reckon we're safe if we keep our mouths shut. But let's swear again, just to make it surer.
        - id: ch01-b15
          speaker: huck
          text: All right. I'm agreed.
        - id: ch01-b16
          speaker: narrator
          text: So the boys swore again, with all the dreadful solemnity they could manage.
        - id: ch01-b17
          speaker: tom
          text: What are people saying, Huck? I've heard an awful lot of talk.
        - id: ch01-b18
          speaker: huck
          text: It's Muff Potter, Muff Potter, Muff Potter all day long. It keeps me sweating so bad I want to hide someplace.
        - id: ch01-b19
          speaker: tom
          text: They go on the same way around me. I reckon he's done for. Don't you ever feel sorry for him?
        - id: ch01-b20
          speaker: huck
          text: Most always. He ain't worth much, but he never hurt anybody. He fishes a little so he can buy liquor, and he loafs around plenty. But most everybody does that. Well, maybe not preachers and such. And Muff's kind of good. Once he gave me half a fish when there wasn't enough for two. Lots of times he's helped me along when I was out of luck.
        - id: ch01-b21
          speaker: tom
          text: He's fixed my kites, Huck, and tied hooks onto my fishing line. I wish we could get him out of jail.
        - id: ch01-b22
          speaker: huck
          text: We couldn't do it, Tom. Besides, it wouldn't help. They'd catch him again.
        - id: ch01-b23
          speaker: tom
          text: Yes, they would. But I hate hearing folks tear into him like that when he never did it.
        - id: ch01-b24
          speaker: huck
          text: So do I. I hear them call him the bloodiest-looking villain in the whole country. They say they can't figure why nobody hanged him years ago.
        - id: ch01-b25
          speaker: tom
          text: That's how they talk all the time. I've heard them say they'd lynch him if he got free.
        - id: ch01-b26
          speaker: huck
          text: And they'd do it, too.
        - id: ch01-b27
          speaker: narrator
          text: The boys talked for a long time, but found little comfort. As twilight came on, they drifted toward the small jail standing off by itself. Somewhere inside them was a vague hope that something might happen and sweep their troubles away. Nothing did. No angels or fairies seemed to care about the unlucky prisoner.
        - id: ch01-b28
          speaker: narrator
          text: As they had often done before, Tom and Huck went to the bars of Potter's cell and passed him tobacco and matches. His cell was on the ground floor, and no guards were there.
        - id: ch01-b29
          speaker: narrator
          text: Potter's thanks had always stabbed at their consciences. This time they cut deeper than ever. The boys felt like the worst kind of cowards and traitors as he spoke.
        - id: ch01-b30
          speaker: muff_potter
          text: You've been mighty good to me, boys. Better than anybody else in this town, and I won't forget it. I keep thinking how I used to mend all the boys' kites, show them the good fishing places, and help them when I could. Now I'm in trouble, and they've all forgotten old Muff. But Tom hasn't, and Huck hasn't. They remember me, and I remember them.
        - id: ch01-b31
          speaker: muff_potter
          text: Well, boys, I did a terrible thing. I was drunk and crazy. That's the only way I can explain it. Now I've got to hang for it, and I reckon that's right. Maybe it's best, too. Leastways, I hope so.
        - id: ch01-b32
          speaker: muff_potter
          text: But we won't talk about that. I don't want to make you feel bad after you've stood by me. What I want to tell you is this. Don't you ever get drunk. Then you won't ever end up in here.
        - id: ch01-b33
          speaker: muff_potter
          text: Move a little farther west. There, that's it. Friendly faces are a mighty comfort when a man's sunk this deep in trouble, and yours are the only ones that come. Good friendly faces. Climb up on each other's backs and let me touch them.
        - id: ch01-b34
          speaker: muff_potter
          text: That's it. Now shake hands. Yours can fit through the bars, but mine's too big. Such little, weak hands... but they've helped Muff Potter a powerful lot, and they'd help him more if they could.
        - id: ch01-b35
          speaker: narrator
          text: Tom went home miserable, and his dreams that night were full of horrors. The next day, and the day after that, he kept circling the courthouse. Something almost irresistible pulled him toward the door, but he forced himself to stay outside. Huck felt the same pull. The boys carefully avoided each other. Each one wandered off now and then, yet the same gloomy fascination always brought him back.
        - id: ch01-b36
          speaker: narrator
          text: Whenever idle spectators strolled out of the courtroom, Tom listened for news. It was always bad. The net around poor Potter was drawing tighter and tighter. By the end of the second day, the village had made up its mind. Injun Joe's testimony had held firm, and nobody doubted what verdict the jury would give.
        - id: ch01-b37
          speaker: narrator
          text: Tom stayed out late that night and climbed into bed through the window. He was in a tremendous state of excitement, and hours passed before he could sleep.
        - id: ch01-b38
          speaker: narrator
          text: The whole village crowded into the courthouse the next morning. This was the great day. Men and women packed the room in nearly equal numbers, all waiting to see what would happen. After a long wait, the jury filed in and took their seats. Then Potter was led inside in chains. He looked pale, worn out, timid, and hopeless as every curious eye stared at him. Injun Joe stood out just as clearly, and his face was as stony as ever.
        - id: ch01-b39
          speaker: narrator
          text: After another pause, the judge entered and the sheriff opened the court. Lawyers whispered. Papers were gathered and arranged. All those small delays filled the room with a feeling that something great and terrible was about to happen.
        - id: ch01-b40
          speaker: narrator
          text: The first witness said he had found Muff Potter washing in the brook early on the morning of the murder. As soon as Potter saw him, he had slipped away. The prosecutor asked a few more questions, then turned to the defense.
        - id: ch01-b41
          speaker: prosecutor
          text: Your witness.
        - id: ch01-b42
          speaker: narrator
          text: Potter lifted his eyes for a moment. Then his own lawyer answered, and Potter lowered them again.
        - id: ch01-b43
          speaker: defense_counsel
          text: I have no questions for this witness.
        - id: ch01-b44
          speaker: narrator
          text: The second witness testified that the knife had been found near the dead man's body.
        - id: ch01-b45
          speaker: prosecutor
          text: Your witness.
        - id: ch01-b46
          speaker: defense_counsel
          text: I have no questions for him.
        - id: ch01-b47
          speaker: narrator
          text: A third witness swore that he had often seen the knife in Potter's hands.
        - id: ch01-b48
          speaker: prosecutor
          text: Your witness.
        - id: ch01-b49
          speaker: narrator
          text: Once again, Potter's lawyer refused to ask anything. Annoyance began to show on the faces around the room. Was this attorney going to throw away his client's life without even trying?
        - id: ch01-b50
          speaker: narrator
          text: More witnesses described Potter's guilty behavior when he was brought back to the murder scene. His lawyer let every one of them leave without a question. Then reliable witnesses laid out each damaging detail from that graveyard morning, which everyone remembered so well. Still the defense did nothing. Puzzled and dissatisfied murmurs spread through the courtroom until the judge ordered everyone to be quiet.
        - id: ch01-b51
          speaker: prosecutor
          text: These citizens have sworn to what they saw, and their honest word is beyond suspicion. Their testimony has fixed this horrible crime on the prisoner beyond any possible doubt. The prosecution rests.
        - id: ch01-b52
          speaker: narrator
          text: Poor Potter gave a groan. He buried his face in his hands and gently rocked back and forth. A painful silence settled over the courtroom. Many of the men were moved, and tears showed the women's pity. Then the defense counsel rose.
        - id: ch01-b53
          speaker: defense_counsel
          text: Your Honor, when this trial began, we said we would prove that our client committed this dreadful act in a blind, irresponsible madness caused by drink. We have changed our position. We will not make that plea. Call Thomas Sawyer.
        - id: ch01-b54
          speaker: narrator
          text: Amazement swept over every face in the room, even Potter's. Everyone watched Tom rise and take his place on the witness stand. The boy looked wild with fear. Then he was sworn in.
        - id: ch01-b55
          speaker: defense_counsel
          text: Thomas Sawyer, where were you around midnight on June seventeenth?
        - id: ch01-b56
          speaker: narrator
          text: Tom looked at Injun Joe's iron face, and his tongue stopped working. The whole room waited without a breath, but no words came. After a few moments, Tom found a little strength. He managed to speak loudly enough for part of the room to hear.
        - id: ch01-b57
          speaker: tom
          text: In the graveyard.
          emotion: fearful
        - id: ch01-b58
          speaker: defense_counsel
          text: A little louder, please. Don't be afraid. You were where?
          emotion: calm
        - id: ch01-b59
          speaker: tom
          text: In the graveyard.
          emotion: fearful
        - id: ch01-b60
          speaker: narrator
          text: A scornful smile passed over Injun Joe's face.
        - id: ch01-b61
          speaker: defense_counsel
          text: Were you near Horse Williams's grave?
        - id: ch01-b62
          speaker: tom
          text: Yes, sir.
        - id: ch01-b63
          speaker: defense_counsel
          text: Speak up just a little. How close were you?
        - id: ch01-b64
          speaker: tom
          text: As close as I am to you.
        - id: ch01-b65
          speaker: defense_counsel
          text: Were you out in sight, or were you hidden?
        - id: ch01-b66
          speaker: tom
          text: I was hidden.
        - id: ch01-b67
          speaker: defense_counsel
          text: Where were you hiding?
        - id: ch01-b68
          speaker: tom
          text: Behind the elm trees at the edge of the grave.
        - id: ch01-b69
          speaker: narrator
          text: Injun Joe gave a start so slight that it was almost impossible to see.
        - id: ch01-b70
          speaker: defense_counsel
          text: Was anyone there with you?
        - id: ch01-b71
          speaker: tom
          text: Yes, sir. I went there with—
        - id: ch01-b72
          speaker: defense_counsel
          text: Wait. Don't give us your companion's name. We will bring him in at the proper time. Did you take anything with you to the graveyard?
        - id: ch01-b73
          speaker: narrator
          text: Tom hesitated and looked embarrassed.
        - id: ch01-b74
          speaker: defense_counsel
          text: Go on, my boy. Don't be shy about it. There is no shame in telling the truth. What did you bring?
          emotion: calm
        - id: ch01-b75
          speaker: tom
          text: Only a... a dead cat.
        - id: ch01-b76
          speaker: narrator
          text: A wave of laughter moved through the room, but the court quickly stopped it.
        - id: ch01-b77
          speaker: defense_counsel
          text: We will produce that cat's skeleton. Now tell us everything that happened. Tell it your own way. Leave nothing out, and don't be afraid.
          emotion: calm
        - id: ch01-b78
          speaker: narrator
          text: Tom began with many stops and starts. But as he went on, the story came more easily, and soon his was the only voice in the room. Every other sound had died away. Every eye held to him. The listeners sat with parted lips and held their breath, forgetting time as the terrible tale pulled them in. No one noticed how long he had been speaking. The strain of all that trapped emotion rose higher and higher. Then Tom reached the moment that broke it open.
        - id: ch01-b79
          speaker: tom
          text: Then the doctor swung the board around, and Muff Potter fell. Injun Joe jumped at him with the knife, and—
          emotion: fearful
        - id: ch01-b80
          speaker: narrator
          text: Crash! Quick as lightning, Injun Joe sprang toward a window. He tore through everyone who tried to stop him, and he was gone.
