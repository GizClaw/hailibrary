  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry sense of humor
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER XXII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Tom joined the new Cadets of Temperance because their fancy regalia caught his eye. As long as he belonged, he promised not to smoke, chew tobacco, or swear. Then he discovered something new. The surest way to make yourself want a thing is to promise you will not do it. Before long, he was aching to drink and swear. The only thing keeping him in the order was the hope of showing off in his red sash.
        - id: ch01-b02
          speaker: narrator
          text: At first, Tom counted on wearing it for the Fourth of July. But before he had endured those rules for forty-eight hours, he gave up on waiting that long. Instead, he began watching old Judge Frazer. The justice of the peace seemed to be dying, and such an important official would surely have a grand public funeral. For three days, Tom eagerly hunted for news of him. Whenever the reports sounded hopeful, Tom took out his regalia and practiced in front of the mirror. But the judge's health kept changing. At last, everyone said he was improving, then recovering. Tom felt disgusted and cheated. He resigned from the Cadets at once. That very night, Judge Frazer took a turn for the worse and died. Tom decided he would never trust such a man again.
        - id: ch01-b03
          speaker: narrator
          text: The funeral was splendid. The Cadets marched so proudly that the dead man himself might have envied them. Still, Tom was free again, and that counted for something. He could drink and swear now. To his surprise, he no longer wanted to. Once those things were allowed, all their charm disappeared.
        - id: ch01-b04
          speaker: narrator
          text: Soon the vacation Tom had longed for began to feel empty. He tried keeping a diary, but nothing happened for three days, so he quit. Then the first minstrel show the town had ever seen arrived and caused a great stir. Tom and Joe Harper formed their own band of performers. That kept them happy for two days.
        - id: ch01-b05
          speaker: narrator
          text: Even the glorious Fourth was a disappointment. Heavy rain canceled the procession. Then Mr. Benton came to town, a real United States senator and, in Tom's mind, the greatest man alive. Yet he was not twenty-five feet tall. He was not even close.
        - id: ch01-b06
          speaker: narrator
          text: A circus arrived next. For three days afterward, the boys put on circuses of their own beneath tents made from rag carpeting. Admission cost boys three pins and girls two. Then they tired of that. A phrenologist and a mesmerizer came and went, leaving the village duller and drearier than before. There were a few parties for the boys and girls, but they were so delightful that the empty days between them only hurt more.
        - id: ch01-b07
          speaker: narrator
          text: Becky Thatcher had gone to her family's home in Constantinople for the vacation, so Tom could find no bright side to life. And the terrible secret of the murder never stopped troubling him. Its pain stayed with him like a cancer.
        - id: ch01-b08
          speaker: narrator
          text: Then Tom caught the measles. For two long weeks, he lay trapped in bed, very seriously ill. He had no interest in anything, and knew nothing of what was happening in the world. When he finally got up and made his weak way downtown, the whole village seemed sadly changed. A religious revival had swept through town. Everyone had found religion, grown-ups and children alike.
        - id: ch01-b09
          speaker: narrator
          text: Tom searched everywhere, desperately hoping to find one good sinful face. Instead, disappointment met him at every turn. Joe Harper was studying a Testament. Tom sadly walked away from that gloomy sight. Ben Rogers was carrying a basket of religious tracts to the poor. Jim Hollis told Tom that the measles had been a precious warning. Every boy he met made his spirits sink lower.
        - id: ch01-b10
          speaker: narrator
          text: At last, Tom fled to Huckleberry Finn for refuge. Even Huck welcomed him with a quotation from Scripture. Tom's heart broke. He crept home and climbed into bed, certain that he alone in the whole town was lost forever.
        - id: ch01-b11
          speaker: narrator
          text: That night, a terrible storm burst over the village. Rain drove against the house. Thunder crashed, and sheets of lightning blinded the sky. Tom pulled the bedclothes over his head and waited in horror for his doom. He had no doubt that all the noise was meant for him. He believed he had tried the patience of the powers above as far as it could possibly go, and now they had come to punish him.
        - id: ch01-b12
          speaker: narrator
          text: It might seem wasteful to fire a whole battery of artillery at a bug. But to Tom, there was nothing strange about raising such an expensive thunderstorm just to blast the ground out from under an insect like himself.
        - id: ch01-b13
          speaker: narrator
          text: In time, the storm wore itself out without finishing its supposed work. Tom's first thought was to feel grateful and reform. His second thought was to wait. After all, there might not be another storm.
        - id: ch01-b14
          speaker: narrator
          text: The doctors returned the next day. Tom had suffered a relapse. He spent three more weeks flat on his back, and they felt like an age. When he finally went outside again, he could hardly feel grateful for being spared. He remembered how lonely and friendless he had become.
        - id: ch01-b15
          speaker: narrator
          text: Tom wandered slowly down the street. There was Jim Hollis, playing judge in a children's court. A cat stood accused of murdering a bird, and the victim was there as evidence. Farther on, Tom found Joe Harper and Huck Finn in an alley, eating a stolen melon. The poor boys had suffered a relapse, too.
