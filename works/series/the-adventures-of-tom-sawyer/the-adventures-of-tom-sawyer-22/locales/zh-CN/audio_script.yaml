audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
  chapters:
    - id: ch01
      title: 戒酒少年团
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 汤姆加入了新成立的戒酒少年团。他倒不是忽然爱上了戒酒，真正吸引他的，是团员那身花里胡哨的“礼服”。入团以后，他发誓不抽烟，不嚼烟草，也不说脏话。没想到，这个誓言很快教会了他一条新道理：越是答应不做什么，心里就越想去做什么。
        - id: ch01-b02
          speaker: narrator
          text: 想喝酒、骂人的念头一天比一天强。要不是还惦记着系上红绶带招摇一回，汤姆早就退团了。他先盼着七月四日，可入团还不到四十八小时，便觉得这个日子太远，又把希望转到了老弗雷泽法官身上。那位治安法官眼看就要不行了。凭他的身份，葬礼一定十分盛大。
        - id: ch01-b03
          speaker: narrator
          text: 一连三天，汤姆都在打听法官的病情。有时听说情况不妙，他便满怀希望地取出礼服，对着镜子练习。可法官偏偏忽好忽坏，最后竟开始康复了。汤姆又厌恶，又觉得受了欺骗，马上递交了退团申请。谁知就在那天夜里，法官病情复发，死了。汤姆从此再也不肯相信这种人。
        - id: ch01-b04
          speaker: narrator
          text: 葬礼果然气派。戒酒少年团列队走过，那威风简直能让死者羡慕得再死一次。汤姆虽然错过了出风头的机会，却重新成了自由的孩子。现在他尽可以喝酒、骂人了，可怪的是，他一点也不想那么做。只因没人拦着，那份欲望和诱惑就全消失了。
    - id: ch02
      title: 难熬的假期
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 没过多久，汤姆发现盼望已久的假期竟有些难熬。他试着写日记，可连续三天都没事可写，只好放弃。
        - id: ch02-b02
          speaker: narrator
          text: 镇上第一次来了黑人滑稽歌舞表演，顿时轰动起来。汤姆和乔·哈泼也凑起一班演员，因此快活了两天。
        - id: ch02-b03
          speaker: narrator
          text: 光荣的七月四日也不怎么光荣。大雨下个不停，游行取消了。汤姆心目中全世界最伟大的人物本顿先生倒是来了。这位美国参议员却叫他大失所望，因为他别说二十五英尺高，连二十五英尺的边儿也沾不上。
        - id: ch02-b04
          speaker: narrator
          text: 马戏团来到镇上以后，男孩们拿碎布地毯搭成帐篷，接连玩了三天马戏。男孩交三根大头针入场，女孩只交两根。然后，大家又把马戏丢到了一边。
        - id: ch02-b05
          speaker: narrator
          text: 颅相学家来了，催眠师也来了。他们很快又走了，村子反而比从前更沉闷、更凄凉。男孩女孩的聚会倒是快活，可次数实在太少，越是好玩，两次聚会之间的日子就越显得空虚难受。
        - id: ch02-b06
          speaker: narrator
          text: 贝琪·撒切尔回君士坦丁堡的家，陪父母过假期去了。汤姆的生活里再也找不到一点光亮。谋杀案那个可怕的秘密又一直折磨着他，持久得像一颗毒瘤，疼痛也像一颗毒瘤。
        - id: ch02-b07
          speaker: narrator
          text: 接着，汤姆得了麻疹。
    - id: ch03
      title: 全镇只剩一个罪人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两个漫长的星期里，汤姆只能躺在床上，像个与世隔绝的囚犯。他病得很重，对什么都没兴趣。好不容易能够下床，他拖着虚弱的脚步走进镇里，却发现所有人、所有事都变得阴郁了。
        - id: ch03-b02
          speaker: narrator
          text: 原来，镇上刚举行过一场“宗教复兴会”。大人们全都“皈依了宗教”，就连男孩女孩也不例外。汤姆到处寻找，明知希望渺茫，仍盼着能看见一张可爱的罪人面孔，可他到哪儿都只有失望。
        - id: ch03-b03
          speaker: narrator
          text: 乔·哈泼在研读《新约》，汤姆伤心地转身走了。本·罗杰斯提着一篮宗教小册子，正去探望穷人。吉姆·霍利斯更提醒汤姆，他刚得的麻疹是上天赐下的珍贵警告。每碰见一个男孩，汤姆的沮丧就像又压上一吨重物。
        - id: ch03-b04
          speaker: narrator
          text: 最后，走投无路的汤姆只好去找哈克贝利·费恩求救。谁知哈克一开口，竟也引用起《圣经》来。汤姆的心彻底碎了。他悄悄爬回家，钻进被窝，认定整个镇上只有自己沉沦了，而且永永远远都得不到救赎。
        - id: ch03-b05
          speaker: narrator
          text: 当天夜里，一场可怕的暴风雨扑来。雨点横扫，雷声震天，成片的闪电晃得人睁不开眼。汤姆把被子蒙过头顶，吓得等候末日降临。他毫不怀疑，这场天翻地覆的动静就是冲着自己来的。一定是他耗尽了天上诸位的耐心，这才招来了惩罚。
        - id: ch03-b06
          speaker: narrator
          text: 要是为了打死一只小虫，动用整队大炮，汤姆或许还会嫌排场和弹药太浪费。可他觉得，为了把自己这只虫豸脚下的草皮轰飞，特意兴起一场代价高昂的雷雨，倒是再合适不过。
        - id: ch03-b07
          speaker: narrator
          text: 后来，暴风雨耗尽力气，渐渐停了，没能完成它的使命。汤姆第一个念头，是感谢上天，从此改过。第二个念头，却是再等等看。往后也许不会再有暴风雨了。
    - id: ch04
      title: 又一次复发
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天，医生又回来了。汤姆的麻疹复发了。这回，他仰面躺了三个星期，只觉得像过了整整一个世纪。终于能再次出门时，他想到自己又孤单、又凄凉，连一个伙伴都没有，对老天饶他一命竟也生不出多少感激。
        - id: ch04-b02
          speaker: narrator
          text: 汤姆无精打采地沿街走去，看见吉姆·霍利斯在孩子们的法庭上当法官。一只猫被控谋杀，死去的鸟就陈列在庭，算是受害者。再往前走，他又发现乔·哈泼和哈克·费恩躲在巷子里，正吃着偷来的甜瓜。可怜的孩子们！原来他们和汤姆一样，也已经“复发”了。
