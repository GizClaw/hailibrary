audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 聪明好胜，兴奋时语速加快，害怕时压低声音
        timbre: 清亮的少年声
        pace: 轻快灵活
        pitch: 中高音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，带着街头少年的粗朴和谨慎
        timbre: 略带沙哑的少年声
        pace: 自然偏慢
        pitch: 中音
  chapters:
    - id: ch01
      title: 梦里的宝藏
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 白天那场奇遇把汤姆的梦搅得不得安宁。整整四次，他伸手抓住了那笔丰厚的宝藏。可每一次，睡意一退，钱就在指间化为乌有，清醒又把不幸的现实送回眼前。
        - id: ch01-b02
          speaker: narrator
          text: 清晨，他躺着回想昨天的事。那些经过忽然变得暗淡又遥远，像是发生在另一个世界，又像隔了许多年。汤姆不禁怀疑，那场冒险会不会从头到尾都是一场梦。毕竟，他看见的钱多得太不像真的了。这正是他认定做梦的最有力理由。
        - id: ch01-b03
          speaker: narrator
          text: 他从没见过五十块钱堆在一起。像他这样年纪和家境的孩子，总把“几百”“几千”当成夸张的话，以为世上根本没有那么大的数目。在他的脑子里，一百块巨款从来不是谁真能拿在手里的东西。汤姆想象的宝藏，其实只是一把看得见、摸得着的十美分硬币，外加一大堆模模糊糊、灿烂诱人、却怎么也抓不住的“大钱”。
        - id: ch01-b04
          speaker: narrator
          text: 可他把每一段经过反复想了又想，事情反而一点点变得鲜明清楚。他渐渐觉得，那也许不是梦。这份疑惑非得扫个干净。汤姆匆匆吃过早饭，跑去找哈克。
    - id: ch02
      title: 不是一场梦
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 哈克坐在平底船的船帮上，两脚没精打采地垂进水里，神情十分忧郁。汤姆决定等他先开口。要是哈克不提昨天的事，那就证明一切只是梦。
        - id: ch02-b02
          speaker: tom
          text: 喂，哈克！
        - id: ch02-b03
          speaker: huck
          text: 喂，你也好啊。
        - id: ch02-b04
          speaker: narrator
          text: 两人沉默了一会儿。哈克终于开了口。
        - id: ch02-b05
          speaker: huck
          text: 汤姆，要是咱们没把那两件倒霉工具带进屋，那笔钱早就归咱们了。你说惨不惨！
          emotion: sad
        - id: ch02-b06
          speaker: tom
          text: 原来不是梦，真的不是梦！可不知为什么，我倒巴不得那是梦。哈克，我说的是真心话。
        - id: ch02-b07
          speaker: huck
          text: 什么不是梦？
        - id: ch02-b08
          speaker: tom
          text: 就是昨天那件事。我一直觉得，它说不定是场梦。
        - id: ch02-b09
          speaker: huck
          text: 梦？要不是楼梯塌了，你就知道那场“梦”有多真啦！我昨晚才是做够了梦。那个蒙着一只眼的西班牙魔鬼，整夜都在梦里追我。让他烂掉算了！
        - id: ch02-b10
          speaker: tom
          text: 不，不能让他烂掉。咱们得找到他，再跟着他找到钱！
        - id: ch02-b11
          speaker: huck
          text: 汤姆，咱们找不着他了。这么大一笔钱，一辈子只有一次机会，可咱们已经错过了。再说，就算碰见他，我也会吓得腿发抖。
        - id: ch02-b12
          speaker: tom
          text: 我也会怕。可我还是想碰见他，再跟着他找到那个“二号”。
    - id: ch03
      title: 二号房的秘密
      blocks:
        - id: ch03-b01
          speaker: huck
          text: 二号，对，就是这个。我一直在琢磨，可怎么也想不明白。你说它是什么？
        - id: ch03-b02
          speaker: tom
          text: 我也不知道，这事太玄了。哈克，它会不会是一幢房子的门牌号？
        - id: ch03-b03
          speaker: huck
          text: 好主意！……不对，汤姆。就算是门牌号，也不会在这个破小镇上。这里的房子根本没有号码。
        - id: ch03-b04
          speaker: tom
          text: 说得也是。让我想想……对啦！它也许是旅店里的房间号！
        - id: ch03-b05
          speaker: huck
          text: 这就对了！镇上一共才两家旅店，马上就能查清楚。
        - id: ch03-b06
          speaker: tom
          text: 你留在这儿，哈克，等我回来。
        - id: ch03-b07
          speaker: narrator
          text: 汤姆马上跑了。他不愿带着哈克在公共场所露面。半个钟头后，他已经查遍了两家旅店。气派些的那一家，二号房早就住进了一个年轻律师，如今仍是他住着。另一家不大体面的旅店里，二号房却藏着秘密。
        - id: ch03-b08
          speaker: narrator
          text: 店主的小儿子告诉汤姆，那扇门总是锁着。除了夜里，他从没见过有人进出，也说不出这情形究竟有什么缘故。他是有过一点好奇，可那点好奇并不强。于是，他索性拿“房间闹鬼”这个念头给自己找乐子。就在昨天夜里，他还看见里面亮着灯。
        - id: ch03-b09
          speaker: tom
          text: 哈克，我就打听到这些。我看那准是咱们要找的二号。
        - id: ch03-b10
          speaker: huck
          text: 我看也是。汤姆，接下来怎么办？
        - id: ch03-b11
          speaker: tom
          text: 让我想想。
        - id: ch03-b12
          speaker: narrator
          text: 汤姆沉默了很久，终于想出了办法。
    - id: ch04
      title: 黑夜里的计划
      blocks:
        - id: ch04-b01
          speaker: tom
          text: 二号房的后门通向一条又窄又憋闷的小巷，就在旅店和那座摇摇欲坠的破砖砌店铺中间。你把能找到的门钥匙都弄来，我去偷姨妈所有的钥匙。等到头一个漆黑的夜晚，咱们就去一把一把地试。
        - id: ch04-b02
          speaker: tom
          text: 你还得时时留神印第安乔。他说过要再进镇探一次风声，看看有没有机会报仇。你只要看见他，就一路跟住。要是他不去二号，那地方就不是咱们要找的。
        - id: ch04-b03
          speaker: huck
          text: 老天爷，我可不想一个人跟着他！
          emotion: fearful
        - id: ch04-b04
          speaker: tom
          text: 到时候肯定是夜里。他也许从头到尾都看不见你。就算真看见了，也未必会想到有什么不对，更不会知道你在跟踪他。
        - id: ch04-b05
          speaker: huck
          text: 好吧，要是天够黑，我就跟着他。我不知道行不行……我试试吧。
        - id: ch04-b06
          speaker: tom
          text: 哈克，要是天够黑，我肯定敢跟。他说不定发现报仇没机会，正要直接去取钱呢。
        - id: ch04-b07
          speaker: huck
          text: 对，汤姆，准是这么回事。我跟着他，说到做到！
        - id: ch04-b08
          speaker: tom
          text: 这才像话！哈克，你别泄气，我也绝不泄气。
