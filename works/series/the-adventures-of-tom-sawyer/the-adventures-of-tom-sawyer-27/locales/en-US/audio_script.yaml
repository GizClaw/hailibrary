audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry sense of humor
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
    tom:
      display_name: Tom Sawyer
      tts:
        delivery: quick, imaginative, and boldly persuasive
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    huck:
      display_name: Huckleberry Finn
      tts:
        delivery: wary, plainspoken, and rough-edged
        timbre: lean and youthful
        pace: relaxed with hesitant pauses
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER XXVII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: That day's adventure tormented Tom's dreams all night. Four times he caught hold of the treasure, and four times it melted away in his hands when sleep left him and he woke to the hard truth of his bad luck.
        - id: ch01-b02
          speaker: narrator
          text: Early the next morning, he lay thinking over everything that had happened. Somehow, it all felt dim and far away, as if it belonged to another world or some long-ago time. Then a thought struck him. Maybe the whole adventure had only been a dream.
        - id: ch01-b03
          speaker: narrator
          text: He had one powerful reason to believe it. There had been far too much money in that box to seem real. Tom had never seen even fifty dollars piled together. Like every boy of his age and place in life, he thought people said “hundreds” and “thousands” only when they wanted to sound grand. He could hardly imagine anyone truly owning one hundred dollars in coins. To Tom, buried treasure meant a handful of real dimes mixed with a bushel of splendid dollars that no one could quite grasp.
        - id: ch01-b04
          speaker: narrator
          text: But the more he went over the adventure, the sharper and clearer it became. Before long, he began to think it might have been real after all. He had to settle the question. He would hurry through breakfast and find Huck.
        - id: ch01-b05
          speaker: narrator
          text: Huck sat on the edge of a flatboat with his feet dangling in the water. He looked thoroughly miserable. Tom decided to wait and let Huck mention the adventure first. If Huck said nothing about it, that would prove it had all been a dream.
        - id: ch01-b06
          speaker: tom
          text: Hello, Huck!
        - id: ch01-b07
          speaker: huck
          text: Hello yourself.
        - id: ch01-b08
          speaker: narrator
          text: Neither boy spoke for a full minute.
        - id: ch01-b09
          speaker: huck
          text: Tom, if we'd only left those blasted tools by the dead tree, we'd have the money now. Ain't it awful?
          emotion: sad
        - id: ch01-b10
          speaker: tom
          text: Then it wasn't a dream! It wasn't a dream at all. Somehow, Huck, I almost wish it had been. I truly do.
        - id: ch01-b11
          speaker: huck
          text: What wasn't a dream?
        - id: ch01-b12
          speaker: tom
          text: What happened yesterday. I was halfway convinced I'd dreamed it.
        - id: ch01-b13
          speaker: huck
          text: A dream? If those stairs hadn't broken, you'd have found out how real it was! I dreamed plenty myself last night. That patch-eyed Spanish devil chased me through every one of them. Curse him!
          emotion: angry
        - id: ch01-b14
          speaker: tom
          text: Don't curse him. Find him! Then we can track down the money.
        - id: ch01-b15
          speaker: huck
          text: We'll never find him, Tom. A fellow only gets one chance at a pile like that, and ours is gone. Besides, I'd be mighty shaky if I saw him again.
        - id: ch01-b16
          speaker: tom
          text: So would I. But I still want to spot him and follow him to his Number Two.
        - id: ch01-b17
          speaker: huck
          text: Number Two. Yes, that's the thing. I've been puzzling over it, but I can't make any sense of it. What do you think it means?
        - id: ch01-b18
          speaker: tom
          text: I don't know. It's a hard one. Wait, Huck. Maybe it's a house number!
        - id: ch01-b19
          speaker: huck
          text: That's good!... No, Tom, it can't be. Not in this one-horse town. The houses here don't have numbers.
        - id: ch01-b20
          speaker: tom
          text: You're right. Let me think. I've got it! It could be the number of a room at a tavern.
        - id: ch01-b21
          speaker: huck
          text: That's it! There are only two taverns. We can find out in no time.
        - id: ch01-b22
          speaker: tom
          text: Stay here until I get back, Huck.
        - id: ch01-b23
          speaker: narrator
          text: Tom hurried away. He did not want Huck beside him in places where people might see them together.
        - id: ch01-b24
          speaker: narrator
          text: Half an hour later, Tom returned with news. At the better tavern, a young lawyer had occupied Room Number Two for a long time and still lived there. But Number Two at the humbler tavern was a mystery.
        - id: ch01-b25
          speaker: narrator
          text: The tavern keeper's young son had told Tom that the room was always locked. He never saw anyone enter or leave except at night, and he had no idea why. He was only a little curious about it. Mostly, he amused himself by pretending the room was haunted. He had also seen a light inside it the night before.
        - id: ch01-b26
          speaker: tom
          text: That's what I found out, Huck. I reckon this is the Number Two we're looking for.
        - id: ch01-b27
          speaker: huck
          text: I reckon so too, Tom. What are you going to do now?
        - id: ch01-b28
          speaker: tom
          text: Give me a minute to think.
        - id: ch01-b29
          speaker: narrator
          text: Tom thought for a long while. Then he laid out his plan.
        - id: ch01-b30
          speaker: tom
          text: Listen. The back door of that Number Two opens into the narrow alley between the tavern and that crumbling old brick store. You collect every door key you can find, and I'll take all of Auntie's. On the first dark night, we'll go there and try them.
        - id: ch01-b31
          speaker: tom
          text: And keep watching for Injun Joe. He said he'd come back to town and spy around once more for a chance at revenge. If you see him, follow him. If he doesn't go to that Number Two, then we've got the wrong place.
        - id: ch01-b32
          speaker: huck
          text: Lord, I don't want to follow him all by myself!
          emotion: fearful
        - id: ch01-b33
          speaker: tom
          text: It'll be nighttime for sure. He may never see you. Even if he does, maybe he won't suspect a thing.
        - id: ch01-b34
          speaker: huck
          text: Well, if it's good and dark, I reckon I'll trail him. I don't know, though. I just don't know. But I'll try.
        - id: ch01-b35
          speaker: tom
          text: I'd follow him if it was dark, Huck. Maybe he's learned that he can't get his revenge and means to go straight for the money.
        - id: ch01-b36
          speaker: huck
          text: That's it, Tom. That's just it. I'll follow him. By jingoes, I will!
        - id: ch01-b37
          speaker: tom
          text: Now you're talking! Don't you lose your nerve, Huck, and I won't lose mine.
