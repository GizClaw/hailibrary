audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry sense of humor
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
    tom:
      display_name: Tom
      tts:
        delivery: quick, bold, and mischievous
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    huckleberry:
      display_name: Huckleberry Finn
      tts:
        delivery: wary, plainspoken, and independent
        timbre: rough and youthful
        pace: easy with guarded pauses
        pitch: medium-high
    joe_harper:
      display_name: Joe Harper
      tts:
        delivery: eager, spirited, and openly emotional
        timbre: clear and youthful
        pace: lively with earnest pauses
        pitch: medium-high
  chapters:
    - id: ch01
      title: Turtle Eggs and Homesick Pirates
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: After dinner, the whole gang went hunting for turtle eggs on the sandbar. They poked sticks into the sand until they struck a soft place, then dropped to their knees and dug with their hands. One hole might hold fifty or sixty eggs. The eggs were perfectly round and white, and a little smaller than an English walnut. That night the boys had a grand fried-egg feast. They had another one on Friday morning.
        - id: ch01-b02
          speaker: narrator
          text: After breakfast they raced onto the bar, yelling and leaping. They chased one another in circles and threw off their clothes as they ran. Then they splashed far out through the shallow water, pushing against a strong current that kept sweeping their legs away. Every tumble only made the game better.
        - id: ch01-b03
          speaker: narrator
          text: Sometimes all three crouched and slapped water into one another's faces. They edged closer with their heads turned aside to escape the choking spray. Then they grabbed and wrestled until one boy ducked another, and all three went under in a tangle of pale arms and legs. Up they came together, blowing, sputtering, laughing, and fighting for breath.
        - id: ch01-b04
          speaker: narrator
          text: When they wore themselves out, they ran onto the hot, dry sand and sprawled there. They covered their bodies with sand and lay still until their strength returned. Then they broke for the water and went through the whole splashing, wrestling, and ducking performance once more. At last they decided their bare skin looked enough like flesh-colored tights for a circus. They drew a ring in the sand and put on a show with three clowns. Not one of them would give up that finest part to either of the others.
        - id: ch01-b05
          speaker: narrator
          text: Next came marbles. They played knucks, ringtaw, and keeps until those games went stale. Joe and Huck went swimming again, but Tom stayed out. While kicking off his trousers, he had kicked loose the string of rattlesnake rattles tied around his ankle. He could not understand how he had escaped a cramp for so long without that mysterious charm to protect him.
        - id: ch01-b06
          speaker: narrator
          text: Tom would not enter the water until he found the rattles. By then the other boys were tired and ready to rest. They drifted apart, sank into low spirits, and stared across the wide river. On the far bank, the village seemed to doze in the sun.
        - id: ch01-b07
          speaker: narrator
          text: Tom caught himself writing “BECKY” in the sand with his big toe. Angry at his own weakness, he scratched it out. Then he wrote it again because he could not help himself. He erased it once more and escaped the temptation by calling the other boys together.
        - id: ch01-b08
          speaker: narrator
          text: Joe was almost beyond cheering. He was so homesick he could hardly bear it, and tears were close. Huck had turned gloomy too. Tom felt just as low, though he worked hard to hide it. He had a secret he was not ready to share. But if this rebellion went on much longer, he knew he would have to use it.
        - id: ch01-b09
          speaker: tom
          text: "I bet pirates have been on this island before. Let's search it again. There must be treasure hidden here somewhere. Just think if we found an old rotten chest packed with gold and silver!"
        - id: ch01-b10
          speaker: narrator
          text: The idea stirred only a weak bit of interest, and no one answered. Tom tried one or two more temptations. Those failed too. Joe sat poking the sand with a stick, looking miserable.
        - id: ch01-b11
          speaker: joe_harper
          text: "Oh, boys, let's quit. I want to go home. It's too lonely here."
          emotion: sad
        - id: ch01-b12
          speaker: tom
          text: "No, Joe. You'll feel better after a while. Think how good the fishing is here."
        - id: ch01-b13
          speaker: joe_harper
          text: "I don't care about fishing. I want to go home."
          emotion: sad
        - id: ch01-b14
          speaker: tom
          text: "But you can't find another swimming place like this one anywhere."
        - id: ch01-b15
          speaker: joe_harper
          text: "Swimming isn't any fun now. Nobody's here to tell me I can't go in, so I don't care about it. I'm going home."
          emotion: sad
        - id: ch01-b16
          speaker: tom
          text: "Oh, what a baby! I suppose you want your mother."
        - id: ch01-b17
          speaker: joe_harper
          text: "Yes, I do want my mother. You'd want yours too, if you had one. I'm no more of a baby than you are."
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: Joe sniffled a little.
        - id: ch01-b19
          speaker: tom
          text: "We'll let the crybaby run home to his mother, won't we, Huck? The poor little thing wants his mother, so home he goes. You like it here, Huck. You and me will stay, won't we?"
        - id: ch01-b20
          speaker: huckleberry
          text: "Y-e-s."
        - id: ch01-b21
          speaker: narrator
          text: Huck had no heart in the answer.
        - id: ch01-b22
          speaker: joe_harper
          text: "I'll never speak to you again as long as I live. There!"
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: Joe got up, walked off in a dark mood, and began dressing.
        - id: ch01-b24
          speaker: tom
          text: "Who cares? Nobody wants you to talk to us. Go home and let everybody laugh at you. Fine pirate you are! Huck and me aren't crybabies. We'll stay, won't we, Huck? Let him go if he wants. I reckon we can manage without him."
        - id: ch01-b25
          speaker: narrator
          text: Tom sounded bold, but he was uneasy. Watching Joe keep on dressing frightened him. Worse still, Huck stared longingly at Joe's preparations and said nothing. At last Joe waded toward the Illinois shore without a word of goodbye. Tom's heart began to sink. He looked at Huck, but Huck could not meet his eyes.
        - id: ch01-b26
          speaker: huckleberry
          text: "I want to go too, Tom. It was lonely already, and it'll be worse with Joe gone. Come on. Let's go too."
          emotion: sad
        - id: ch01-b27
          speaker: tom
          text: "I won't. You can both leave if you want. I'm staying."
        - id: ch01-b28
          speaker: huckleberry
          text: "Tom, I think I'd better go."
        - id: ch01-b29
          speaker: tom
          text: "Then go. Who's stopping you?"
        - id: ch01-b30
          speaker: narrator
          text: Huck began gathering his scattered clothes.
        - id: ch01-b31
          speaker: huckleberry
          text: "I wish you'd come, Tom. Think it over. We'll wait for you when we reach the shore."
          emotion: sad
        - id: ch01-b32
          speaker: tom
          text: "Then you'll be waiting a mighty long time."
        - id: ch01-b33
          speaker: narrator
          text: Huck followed Joe sadly. Tom watched him go, wanting badly to swallow his pride and follow. He hoped the boys would stop, but they kept wading away. Suddenly the island felt very lonely and still. Tom fought his pride one last time. Then he raced after them.
        - id: ch01-b34
          speaker: tom
          text: "Wait! Wait! I've got something to tell you!"
          emotion: fearful
        - id: ch01-b35
          speaker: narrator
          text: The boys stopped and turned. When Tom caught up, he began to reveal his secret. They listened gloomily at first. Then they understood his plan and gave a war whoop of approval.
        - id: ch01-b36
          speakers: [joe_harper, huckleberry]
          ensemble: duo
          text: "That's splendid! If you'd told us before, we never would've left!"
          emotion: happy
        - id: ch01-b37
          speaker: narrator
          text: Tom offered an excuse for keeping quiet. The truth was that he had feared even this secret would not hold them for long. He had saved it as his last temptation.
    - id: ch02
      title: Learning to Smoke
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The boys returned happily and threw themselves into their games again. All the while they talked about Tom's enormous plan and praised him for thinking of it. After a fine dinner of eggs and fish, Tom announced that he wanted to learn to smoke. Joe eagerly said he wanted to try too.
        - id: ch02-b02
          speaker: narrator
          text: Huck made two pipes and filled them. Tom and Joe had never smoked anything but cigars rolled from grapevines. Those burned the tongue and did not count as manly anyway. Now the two beginners stretched out on their elbows and took careful, uncertain puffs. The smoke tasted bad, and both boys gagged a little.
        - id: ch02-b03
          speaker: tom
          text: "Why, this is easy! If I'd known there was nothing to it, I'd have learned ages ago."
        - id: ch02-b04
          speaker: joe_harper
          text: "Me too. This is nothing at all."
        - id: ch02-b05
          speaker: tom
          text: "I've watched people smoke plenty of times and wished I could do it. I just never thought I could."
        - id: ch02-b06
          speaker: joe_harper
          text: "That's exactly how I felt. Isn't it, Huck? You've heard me say that plenty of times. Tell him, Huck."
        - id: ch02-b07
          speaker: huckleberry
          text: "Yes. Heaps of times."
        - id: ch02-b08
          speaker: tom
          text: "I've said it hundreds of times too. I said it once down by the slaughterhouse. Bob Tanner was there, and Johnny Miller, and Jeff Thatcher. You remember that, don't you, Huck?"
        - id: ch02-b09
          speaker: huckleberry
          text: "Sure, that's right. It was the day after I lost a white alley. No, it was the day before."
        - id: ch02-b10
          speaker: tom
          text: "There, you see? Huck remembers."
        - id: ch02-b11
          speaker: joe_harper
          text: "I believe I could smoke this pipe all day. I don't feel sick."
        - id: ch02-b12
          speaker: tom
          text: "Neither do I. I could keep it up all day. But I bet Jeff Thatcher couldn't."
        - id: ch02-b13
          speaker: joe_harper
          text: "Jeff Thatcher? Two puffs would knock him over. Let him try it once. Then he'd find out!"
        - id: ch02-b14
          speaker: tom
          text: "It sure would. And Johnny Miller! I wish I could watch him try."
        - id: ch02-b15
          speaker: joe_harper
          text: "So do I! Johnny Miller couldn't do this at all. One tiny sniff would finish him."
        - id: ch02-b16
          speaker: tom
          text: "It would, Joe. I wish all the boys could see us right now."
        - id: ch02-b17
          speaker: joe_harper
          text: "I do too."
        - id: ch02-b18
          speaker: tom
          text: "Listen, boys, don't tell anybody. Someday, when they're all around, I'll walk up and say, ‘Joe, got a pipe? I want a smoke.’ Then you answer real careless, like it doesn't matter. Say, ‘Yes, I've got my old pipe and another one, but my tobacco isn't very good.’ I'll say, ‘That's all right if it's strong enough.’ Then we'll pull out the pipes and light them as calm as can be. Just watch their faces!"
        - id: ch02-b19
          speaker: joe_harper
          text: "By jings, that'll be grand, Tom! I wish we could do it now!"
          emotion: happy
        - id: ch02-b20
          speaker: tom
          text: "So do I. And when we tell them we learned while we were off being pirates, won't they wish they'd come?"
        - id: ch02-b21
          speaker: joe_harper
          text: "Oh, I reckon they won't! I just bet they will!"
          emotion: happy
        - id: ch02-b22
          speaker: narrator
          text: The boasting went on for a while. Then it slowed and broke into scraps. The quiet stretches grew longer, while the boys spit more and more. Every pore inside their cheeks seemed to turn into a fountain. Pools gathered beneath their tongues faster than they could empty them. No matter how hard they tried, a little smoke-soaked spit kept slipping down their throats, and every time it did, they retched.
        - id: ch02-b23
          speaker: narrator
          text: Both boys were pale and miserable now. Joe's pipe fell from his weak fingers. Tom's dropped next. Their mouths kept flooding, and they worked desperately to clear them.
        - id: ch02-b24
          speaker: joe_harper
          text: "I lost my knife. I reckon I'd better go look for it."
        - id: ch02-b25
          speaker: narrator
          text: Joe's voice was faint. Tom answered with trembling lips, stopping between his words.
        - id: ch02-b26
          speaker: tom
          text: "I'll help you. You search over that way, and I'll look near the spring. No, Huck, you don't need to come. We can find it."
    - id: ch03
      title: The Lost Knife
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Huck sat down again and waited for an hour. Then he grew lonely and went searching for his friends. He found them far apart in the woods. Both were very pale, and both were fast asleep. Somehow Huck understood that whatever trouble they had suffered was over now.
        - id: ch03-b02
          speaker: narrator
          text: At supper that night, Tom and Joe had little to say. They looked humble. After the meal Huck filled his own pipe and started to prepare theirs. They turned him down. They said they felt unwell because something they had eaten at dinner had disagreed with them.
    - id: ch04
      title: The Storm at Midnight
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Around midnight, Joe woke and called the others. The heavy air seemed to warn that something was coming. The boys crowded together near the friendly fire, even though the still heat was stifling. They sat quietly and waited. All around them, the night held its breath. Beyond the firelight, darkness swallowed everything.
        - id: ch04-b02
          speaker: narrator
          text: A trembling glow showed the leaves for a moment, then disappeared. Another glow followed, a little stronger, and then another. A soft moan moved through the forest branches. The boys felt one quick breath of air against their cheeks and shuddered, imagining that the Spirit of the Night had passed them.
        - id: ch04-b03
          speaker: narrator
          text: After a pause, a strange flash turned night into day. Every blade of grass around their feet stood out clearly. So did three pale, startled faces. A deep roll of thunder tumbled across the sky and faded into angry sounds far away. Cold air swept past, rustling the leaves and scattering flakes of ash from the fire.
        - id: ch04-b04
          speaker: narrator
          text: Another fierce glare filled the woods. A crash came right behind it, as if the treetops above the boys had split apart. They grabbed one another in terror when the thick darkness returned. Then a few large raindrops struck the leaves.
        - id: ch04-b05
          speaker: tom
          text: "Quick, boys! Run for the tent!"
          emotion: fearful
        - id: ch04-b06
          speaker: narrator
          text: They sprang up and raced into the dark. Each boy plunged in a different direction, tripping over roots and tangling in vines. A furious blast roared through the trees and made every branch sing as it passed. Blinding flashes came one after another, with peal after peal of deafening thunder close behind. Then the rain poured down. The rising hurricane caught it and drove whole sheets of water along the ground.
        - id: ch04-b07
          speaker: narrator
          text: The boys shouted to one another, but the wind and thunder swallowed every cry. One by one, they finally stumbled under the tent. They were cold, frightened, and streaming with water, but at least they were miserable together. The old sail flapped too wildly for them to talk, even if the rest of the storm had allowed it.
        - id: ch04-b08
          speaker: narrator
          text: The tempest grew stronger and stronger. Soon the old sail ripped free from its fastenings and flew away on the wind. With their only shelter gone, the boys caught one another's hands and fled toward a great oak on the riverbank. In the darkness they tumbled again and again and collected plenty of bruises before they reached it.
        - id: ch04-b09
          speaker: narrator
          text: Now the storm reached its height. Lightning burned across the sky without stopping, and everything below appeared sharp and without a shadow. Every bending tree stood out there clearly in the glare. The rolling river rose in waves and turned white with foam, while flakes of spray drove through the air. Across the water, the outlines of the high bluffs appeared and vanished through racing clouds and a slanting curtain of rain. Each flash revealed the whole wild scene for an instant before darkness closed over it again.
        - id: ch04-b10
          speaker: narrator
          text: Again and again, a giant tree lost its fight and crashed through the smaller growth. The thunder burst overhead in sharp, ear-splitting blows. Then the storm made one final, terrible effort. It seemed ready to tear the island apart, burn it, drown it to the treetops, blow it away, and deafen every living creature at once. It was a wild night for three homeless boys to be outdoors.
        - id: ch04-b11
          speaker: narrator
          text: At last the battle ended. Its threats and growls weakened little by little, and peace returned. The boys walked back to camp, shaken by what they had seen. There they found one thing to be thankful for. The great sycamore that had sheltered their beds was shattered by lightning. If the storm had not driven them away, they would have been beneath it when it fell.
        - id: ch04-b12
          speaker: narrator
          text: Everything in camp was soaked, including the fire. Like careless boys everywhere, they had made no plan for rain. Now they were drenched and cold, and they complained loudly. Then they noticed that the fire had burned deep under the great log beside it. Where the log curved above the ground, a patch about as wide as a hand had stayed dry.
        - id: ch04-b13
          speaker: narrator
          text: The boys worked patiently. They gathered dry shreds and bark from the undersides of sheltered logs and coaxed the fire alive. Once it caught, they piled on great dead branches until it roared like a furnace, and their spirits rose with it. They dried their soaked boiled ham and feasted. With nowhere around the camp dry enough for sleep, they sat beside the flames until morning, talking over their midnight adventure and making it grander each time they told it.
    - id: ch05
      title: Chiefs and the Pipe of Peace
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As sunlight began creeping over them, the boys grew drowsy. They went out to the sandbar, lay down, and slept. Before long the sun scorched them awake. They dragged themselves up and made breakfast.
        - id: ch05-b02
          speaker: narrator
          text: After eating, they felt worn out and stiff, and homesickness returned. Tom recognized the signs and did all he could to cheer up his pirates. They wanted nothing to do with marbles, circus, swimming, or any other game. He reminded them of his great secret, and that brought one small ray of interest.
        - id: ch05-b03
          speaker: narrator
          text: While the feeling lasted, Tom offered a new game. They would stop being pirates for a while and become Indians instead. The idea caught their interest. Soon they had stripped and covered themselves from head to foot in stripes of black mud. They looked like three zebras, and each one was a chief, of course. Then they tore through the woods to attack an English settlement.
        - id: ch05-b04
          speaker: narrator
          text: Later they split into three enemy tribes. They leaped from hiding with dreadful war whoops and killed and scalped one another by the thousands. It was a bloody day in their game, which made it a wonderfully satisfying one.
        - id: ch05-b05
          speaker: narrator
          text: Near suppertime, they gathered at camp hungry and happy. But now they faced a problem. Enemy Indians could not share the bread of friendship until they had made peace. And as far as the boys knew, peace could only be made by smoking the peace pipe. Two of the young warriors almost wished they had stayed pirates.
        - id: ch05-b06
          speaker: narrator
          text: There was no other way. They called for the pipe with as much cheer as they could manage. It passed from chief to chief, and each boy took the proper puff. Then they discovered that becoming Indians had brought them something useful after all. They could smoke a little now without going off to search for a lost knife. They did not even grow sick enough to feel badly uncomfortable.
        - id: ch05-b07
          speaker: narrator
          text: The boys were not going to waste such promising progress by giving up. After supper they practiced carefully and did fairly well. That made for a joyful evening full of smoke, chatter, and bragging. Their new skill made them prouder and happier than all the imaginary scalping and skinning of the Six Nations could have done.
        - id: ch05-b08
          speaker: narrator
          text: So we will leave them there, smoking, talking, and bragging. For now, our story has no more need of them.
