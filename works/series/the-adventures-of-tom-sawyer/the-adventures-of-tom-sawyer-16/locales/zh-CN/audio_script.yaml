audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    joe:
      display_name: 乔
      tts:
        delivery: 认真热烈，带着孩子气的悲壮和兴奋
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，语气粗朴而自在
        timbre: 微哑稚嫩
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 沙洲上的好日子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 午饭后，三个男孩到沙洲上找甲鱼蛋。他们拿棍子往沙里戳，碰到松软的地方，就跪下来用手挖。有时，一个洞里能掏出五六十只雪白滚圆的蛋，比英国核桃略小一点。当晚，他们痛痛快快吃了一顿煎蛋，星期五早晨又吃了一顿。
        - id: ch01-b02
          speaker: narrator
          text: 早饭后，他们叫着跳着冲上沙洲，一边追逐，一边脱衣服，直到浑身精光。他们迎着浅水里的急流往前冲，水流不时把人绊倒，反倒更好玩。接着，三个人挤成一团，互相泼水。他们扭开脸躲着呛人的水花，又慢慢逼近，最后抱成一团摔打。等最强的那个把身边的人按进水里，白花花的胳膊腿也全跟着沉下去。大家再冒出水面时，又吹气，又吐水，又笑，又喘。
        - id: ch01-b03
          speaker: narrator
          text: 玩得筋疲力尽，他们便跑上滚烫的干沙，四仰八叉地躺下，再用沙把自己埋起来。歇过一阵，三个人又突然冲回水里，把刚才那套把戏从头闹一遍。后来，他们看看彼此，觉得光着的皮肤很像肉色紧身衣，便在沙地上画个圆圈，演起马戏来。三个男孩谁也不肯把最风光的小丑角色让给别人，于是这一场马戏里足足有三个小丑。
        - id: ch01-b04
          speaker: narrator
          text: 接下来，他们拿出弹珠，玩了“指节弹”“圈中弹”和“赢者通吃”，直到又觉得没意思。乔和哈克再次下水，汤姆却不敢去。他脱裤子时，把脚踝上那串响尾蛇尾铃也踢掉了。没有这件神秘护身符，他居然一直没抽筋，想起来真叫人后怕。等他终于找回尾铃，再敢下水时，另外两人已经累了，只想休息。
        - id: ch01-b05
          speaker: narrator
          text: 他们渐渐各自散开，情绪也低落下来，眼巴巴地望向宽阔大河的对岸。村庄正在阳光下昏昏欲睡。汤姆不知不觉用大脚趾在沙上写下“贝琪”，发现以后马上擦掉，还恨自己这样没出息。可他实在忍不住，又写了一次，再擦掉一次。最后，他把伙伴们叫到一起，自己也凑过去，免得继续受诱惑。
    - id: ch02
      title: 差一点散伙
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 乔已经想家想得受不了，眼泪已经在眼眶里打转，随时都会掉下来。哈克也很消沉。汤姆同样难过，只是拼命不肯显露。他还藏着一个秘密，本来不想这么早说。可伙伴们这种仿佛要造反的低落劲儿若不赶快打破，他就只能把秘密拿出来救场了。于是，汤姆拼命装出兴高采烈的样子。
        - id: ch02-b02
          speaker: tom
          text: “伙计们，这座岛上以前准来过海盗。咱们再搜一遍吧。他们肯定在什么地方藏了财宝。要是咱们挖出一只烂箱子，里面全是金子银子，那该怎么样？”
        - id: ch02-b03
          speaker: narrator
          text: 这番话只换来一点点兴趣，转眼就没了，谁也不肯回答。汤姆又拿一两样好玩的事情引诱他们，可还是不管用。这实在叫人泄气。乔坐在那里，拿棍子一下下拨着沙，脸色阴沉得厉害。
        - id: ch02-b04
          speaker: joe
          text: “算了吧，伙计们。我想回家。这儿太冷清了。”
        - id: ch02-b05
          speaker: tom
          text: “别走呀，乔。你过一会儿就好了。想想这里钓鱼有多棒。”
        - id: ch02-b06
          speaker: joe
          text: “钓鱼有什么稀罕的？我想回家。”
        - id: ch02-b07
          speaker: tom
          text: “可哪儿也找不到这么好的游泳地方。”
        - id: ch02-b08
          speaker: joe
          text: “游泳也没意思。没人拦着不让我下水，我反而不想游了。我就是要回家。”
        - id: ch02-b09
          speaker: tom
          text: “呸，小娃娃！你就是想妈妈了吧。”
        - id: ch02-b10
          speaker: joe
          text: “对，我就是想妈妈。你要是有妈妈，你也会想她。我可不比你更像个小娃娃。”
          emotion: sad
        - id: ch02-b11
          speaker: narrator
          text: 乔说完，抽了抽鼻子。汤姆故意把他当成小孩子，对哈克说，应该放这个爱哭鬼回家找妈妈。他又追问哈克是不是喜欢这里，是不是愿意跟自己留下。
        - id: ch02-b12
          speaker: huck
          text: “对——。”
        - id: ch02-b13
          speaker: narrator
          text: 哈克答得一点精神也没有。乔站起身来。
        - id: ch02-b14
          speaker: joe
          text: “我这一辈子都不再跟你说话了。就这样！”
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: 乔沉着脸走开，开始穿衣服。
        - id: ch02-b16
          speaker: tom
          text: “谁在乎！也没人想听你说话。回去让大家笑话吧。你可真是个了不起的海盗。哈克和我才不爱哭。你要走就走，少了你，我们大概照样过得下去。”
        - id: ch02-b17
          speaker: narrator
          text: 汤姆嘴上强硬，心里却慌了。他看着乔穿衣服，又看见哈克眼巴巴盯着乔，一句话也不说。不久，乔连招呼都没打，就朝伊利诺伊州那边蹚去。汤姆的心直往下沉。他瞥了哈克一眼，哈克马上低下头。
        - id: ch02-b18
          speaker: huck
          text: “汤姆，我也想走。本来就够冷清了，乔一走会更糟。咱们一起回去吧。”
        - id: ch02-b19
          speaker: tom
          text: “我不走！你们想走就全走吧，我要留下。”
        - id: ch02-b20
          speaker: huck
          text: “汤姆，我还是得走。”
        - id: ch02-b21
          speaker: tom
          text: “那就走呀，谁拦你了？”
        - id: ch02-b22
          speaker: narrator
          text: 哈克开始捡起散落的衣服。
        - id: ch02-b23
          speaker: huck
          text: “汤姆，我真希望你也来。你好好想想。我们到了岸边会等你。”
        - id: ch02-b24
          speaker: tom
          text: “那你们就等到天荒地老吧。”
        - id: ch02-b25
          speaker: narrator
          text: 哈克伤心地走了。汤姆望着两个伙伴，心里真想放下骄傲，跟他们一起回去。他盼着他们停步，可他们仍慢慢往前蹚。四周忽然变得又寂寞又安静。汤姆终于认输，飞奔着追了上去。
        - id: ch02-b26
          speaker: tom
          text: “等等！等等！我有件事要告诉你们！”
        - id: ch02-b27
          speaker: narrator
          text: 两个男孩很快停下来，转身望着汤姆。他赶到他们身边，开始一点点揭开那个秘密。他们起先还阴沉着脸，后来终于听懂了汤姆的打算，立刻发出战斗呐喊般的欢呼，说这主意妙极了。要是汤姆早讲，他们根本不会走。汤姆编了个听起来很像样的借口。其实，他真正担心的是，即使说出秘密，也留不住伙伴太久，所以才一直藏着，准备当作最后的诱饵。
    - id: ch03
      title: 新手学抽烟
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们欢天喜地回到营地，很快又起劲地玩起来，一路谈论汤姆那项惊天动地的计划，赞叹他简直聪明绝顶。三个人美美吃过甲鱼蛋和鱼做的午饭，汤姆说自己现在想学抽烟，乔立刻抓住这个主意，说他也要试。哈克便给他们做了烟斗，再装好烟叶。这两个新手以前只抽过葡萄藤做的雪茄，那东西辣舌头，而且别人根本不觉得那算男子汉抽的玩意儿。
        - id: ch03-b02
          speaker: narrator
          text: 两人支着胳膊肘趴下来，小心吸了几口，心里都没多少把握。烟味难受得叫人反胃，汤姆却硬撑着开口。
        - id: ch03-b03
          speaker: tom
          text: “原来这么容易！早知道不过如此，我早就学了。”
        - id: ch03-b04
          speaker: joe
          text: “我也是。这根本不算什么。”
        - id: ch03-b05
          speaker: tom
          text: “我看别人抽过好多回，每次都想，要是自己也会就好了。我从没想到真能学会。”
        - id: ch03-b06
          speaker: joe
          text: “我也总这么说，对吧，哈克？你听见过好多次。让我说没说过，哈克最清楚。”
        - id: ch03-b07
          speaker: huck
          text: “听过，好多回呢。”
        - id: ch03-b08
          speaker: tom
          text: “我也说过几百回。有一次就在屠宰场旁边，鲍勃·坦纳、约翰尼·米勒和杰夫·撒切尔都在。哈克，你记得我那时说过吧？”
        - id: ch03-b09
          speaker: huck
          text: “对，没错。就是我丢了白色弹珠的第二天。不对，是前一天。”
        - id: ch03-b10
          speaker: tom
          text: “瞧，我没说错吧。哈克记得。”
        - id: ch03-b11
          speaker: joe
          text: “我觉得自己能抽一整天，一点也不难受。”
        - id: ch03-b12
          speaker: tom
          text: “我也能抽一整天。不过杰夫·撒切尔肯定不行。”
        - id: ch03-b13
          speaker: joe
          text: “杰夫·撒切尔？他吸两口就得栽倒。让他试一次，他就明白了！”
        - id: ch03-b14
          speaker: tom
          text: “肯定是。还有约翰尼·米勒，我真想看他试试。”
        - id: ch03-b15
          speaker: joe
          text: “我更想看！约翰尼根本做不到。他轻轻吸上一小口，就得趴下。”
        - id: ch03-b16
          speaker: tom
          text: “那当然。乔，真希望那帮家伙现在能看见咱们。”
        - id: ch03-b17
          speaker: joe
          text: “我也希望。”
        - id: ch03-b18
          speaker: tom
          text: “伙计们，先别说出去。等哪天他们都在，我就走来问你有没有烟斗。你要装得满不在乎，说自己有一只旧烟斗，还有一只，就是烟叶不太好。我就说没关系，只要够烈就行。然后你把烟斗拿出来，咱们安安稳稳地点上，看他们会是什么表情！”
        - id: ch03-b19
          speaker: joe
          text: “老天，那可太带劲了！真希望现在就能来一回！”
          emotion: happy
        - id: ch03-b20
          speaker: tom
          text: “我也希望。等他们知道咱们是当海盗时学会的，准会后悔没有跟来。”
        - id: ch03-b21
          speaker: joe
          text: “他们才不会后悔呢！我敢拿脑袋打赌，他们一定会！”
        - id: ch03-b22
          speaker: narrator
          text: 两人继续吹嘘，可话头很快失去力气，变得东一句西一句。沉默一次比一次长，吐口水的次数却多得惊人。他们腮帮子里的每个毛孔，都像变成了喷水泉。两个人拼命往外舀舌头底下那两座地窖里的水，还是快要淹了。尽管使出了浑身解数，仍有一点水不时流进喉咙，每流进去一次，就引来一阵突然的干呕。他们脸色惨白，模样可怜。乔的手指软了，烟斗掉下去，汤姆的也跟着落地。两眼泉水还在猛喷，两台水泵仍拼命抽着。乔有气无力地开口。
        - id: ch03-b23
          speaker: joe
          text: “我的小刀丢了。我最好去找找。”
        - id: ch03-b24
          speaker: narrator
          text: 汤姆的嘴唇直哆嗦，说话也断断续续。
        - id: ch03-b25
          speaker: tom
          text: “我帮你。你去那边，我到泉水旁找。哈克不用来，我们找得到。”
        - id: ch03-b26
          speaker: narrator
          text: 哈克只好重新坐下，整整等了一个钟头。后来，他实在觉得孤单，便起身到树林里寻找伙伴。他发现两个人离得远远的，脸色都白得厉害，却睡得正熟。哈克说不清为什么，心里却明白，他们就算遇到过什么麻烦，现在也已经摆脱得干干净净了。
        - id: ch03-b27
          speaker: narrator
          text: 那天晚饭时，两人都不大说话，先前那股神气已经不见了，神情也十分谦卑。饭后，哈克照常准备自己的烟斗，又要替他们把烟斗装好。汤姆和乔连忙说不用了，他们觉得身子不大舒服，大概是午饭吃了什么不合适的东西。
    - id: ch04
      title: 午夜的暴风雨
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 午夜前后，乔醒来，叫起伙伴。空气沉沉地压着人，仿佛要出什么事。四下没有一丝风，闷热得透不过气，三个男孩还是紧紧挤在火边，想从火光里得到一点安慰。他们一动不动，专心等待。火光以外的一切，都被无边的黑暗吞没了。
        - id: ch04-b02
          speaker: narrator
          text: 一道颤动的微光忽然照出树叶，转眼就消失。过了一会儿，又来一道，更亮一些，接着又是一道。林间响起低低的呜咽，一缕气息掠过孩子们的脸。三个人打了个寒战，觉得暗夜的幽灵刚从身边走过。
        - id: ch04-b03
          speaker: narrator
          text: 猛然间，一道怪异的闪光把黑夜变成白昼。脚边每根细小的草叶都清清楚楚，还有三张惊白的脸。一声沉雷翻过天空，化成远方阴郁的隆隆声。冷风横扫而过，树叶沙沙乱响，片片灰烬像雪一样撒开。又一道强光照透森林，炸雷紧跟着劈下来，仿佛就在他们头顶撕开树梢。黑暗再次压住一切，三个男孩吓得抱成一团。硕大的雨点噼啪落在树叶上。
        - id: ch04-b04
          speaker: tom
          text: “快！伙计们，快跑到帐篷里去！”
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: 他们拔腿就跑，在黑暗中被树根和藤蔓绊得跌跌撞撞，三个人还冲向了不同的方向。狂风咆哮着穿过树林，所到之处，万物都尖啸起来。闪电一道接着一道，震耳的雷声也一阵紧过一阵。倾盆大雨泼下来，越来越猛的风把雨赶成水幕，贴着地面横扫。
        - id: ch04-b06
          speaker: narrator
          text: 孩子们彼此呼喊，可声音完全淹没在风雷里。最后，他们总算一个接一个摸到帐篷下。人人冷得发抖，吓得不轻，浑身都在淌水，不过能一起受罪，也算值得庆幸。旧船帆被风拍得震天响，他们根本没法交谈。暴风越来越凶，船帆终于挣脱绳索，乘着风飞走了。
        - id: ch04-b07
          speaker: narrator
          text: 三个男孩互相抓住手，一路跌倒，身上也撞伤了好几处，终于逃到河岸一棵大橡树下。天地间的厮杀已经到了最猛烈的时候。闪电在天空烧成一场无休无止的大火，地上的一切都显得轮廓分明，没有半点影子。弯伏的树、翻涌着白沫的大河、四处飞射的碎浪，还有对岸高高峭壁的朦胧轮廓，都隔着奔散的乱云和倾斜的雨帘，时隐时现。
        - id: ch04-b08
          speaker: narrator
          text: 每隔一会儿，就有一棵参天大树败下阵来，轰然砸进周围的小树丛。雷声始终不肯停歇，此刻更化成又尖又脆的爆响，简直要把耳朵震裂，恐怖得说不出是什么滋味。最后，暴风雨使出无可匹敌的全力，仿佛要在同一瞬间把小岛撕碎、烧光、淹到树梢，再整个吹得无影无踪，还要震聋岛上的一切活物。三个无家可归的小脑袋，竟在这样的狂夜里无处躲藏。
    - id: ch05
      title: 风暴过后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 这场大战终于结束。风雷的兵马开始退去，只剩越来越弱的威吓与咕哝，安宁重新掌管四周。三个男孩怀着深深的敬畏走回营地，又发现了一件值得庆幸的事。那棵原本遮着他们床铺的大梧桐，已经被雷电劈成一片残骸。灾祸发生的时候，他们幸好没有躺在下面。
        - id: ch05-b02
          speaker: narrator
          text: 营地里的东西全湿透了，篝火也一样。这几个粗心孩子根本没防着下雨，如今浑身透湿，冷得发抖，只好大声诉苦。不过，他们很快发现，火已经烧进那根大木头向上弯起的地方，底下有一掌宽没有淋湿。
        - id: ch05-b03
          speaker: narrator
          text: 他们耐心忙起来，从受遮蔽的木头底下找到干燥的碎屑和树皮，一点点引火，总算把火重新哄着了。接着，大家堆上粗大的枯枝，直到火焰旺得像一座熊熊燃烧的炉子，心里也再次快活起来。他们把煮熟的火腿重新烤干，美餐了一顿。此后，三个人围坐在火边，把午夜的冒险越讲越大，越说越精彩，一直讲到天亮。四周没有一块能睡觉的干地，反正也不能睡了。
        - id: ch05-b04
          speaker: narrator
          text: 阳光悄悄照到他们身上时，困意也跟着袭来。他们走到沙洲上躺下睡觉。没过多久，太阳又把人晒得再也躺不住，他们只好没精打采地起来准备早饭。吃完以后，人人都觉得筋骨僵硬，关节发涩，也再次有点想家。
        - id: ch05-b05
          speaker: narrator
          text: 汤姆看出苗头，赶紧给海盗们打气，可弹珠、马戏和游泳全都提不起他们的兴趣。他拿那个了不起的秘密提醒大家，好歹唤起一点兴奋。趁着兴头还在，他又提出一种新玩法。海盗先不当了，大家改当印第安人。
        - id: ch05-b06
          speaker: narrator
          text: 这个主意果然很有吸引力。没过多久，三个人就脱光衣服，从头到脚涂满一道道黑泥，活像三匹斑马。当然，他们谁也不肯只当普通印第安人，个个都得是酋长。装扮妥当以后，他们一路冲进树林，去袭击一处英国人定居点。
        - id: ch05-b07
          speaker: narrator
          text: 后来，他们分成三个敌对部落，从埋伏处发出可怕的战斗呐喊，彼此扑杀了成千上万次，也剥了成千上万次头皮。这一天血流成河，所以，他们过得称心极了。
    - id: ch06
      title: 和平烟斗
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 快到晚饭时，三个野人又饿又快活地回到营地，可麻烦也来了。敌对的印第安人必须先讲和，才能坐在一起分享食物。而他们所知道的讲和办法，只有抽和平烟斗。有两个野人简直后悔没有继续当海盗。
        - id: ch06-b02
          speaker: narrator
          text: 可他们从没听说过别的讲和办法，实在别无选择，只好尽量装得高兴，叫人拿来烟斗，再按规矩传下去，轮流吸上一口。没想到，这回还真有了收获。他们发现自己已经能抽上一点烟，不必再借口寻找丢掉的小刀。虽然仍会恶心，却不至于难受得厉害。
        - id: ch06-b03
          speaker: narrator
          text: 眼看进步大有希望，他们当然不肯因为偷懒白白糟蹋。晚饭后，三个男孩又小心练习了一番，效果相当不错，于是快快活活地过了一晚。这项新本领叫他们无比骄傲。就算把易洛魁六部族全都剥了头皮、扒了皮，他们也不会更加高兴。
        - id: ch06-b04
          speaker: narrator
          text: 这项新本领带来的骄傲和快乐，甚至胜过他们想象中的辉煌战功。眼下故事暂时用不着他们，我们就让这三个小海盗留在那里抽烟、闲聊、吹牛吧。
