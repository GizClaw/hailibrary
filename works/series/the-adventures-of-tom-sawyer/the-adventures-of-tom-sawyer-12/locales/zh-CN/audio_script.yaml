audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    aunt_polly:
      display_name: 波莉姨妈
      tts:
        delivery: 严厉里藏着疼爱，朴实直接
        timbre: 温厚明晰
        pace: 从容
        pitch: 中音
    becky:
      display_name: 贝琪
      tts:
        delivery: 天真敏感，骄傲时尖锐干脆
        timbre: 清甜稚嫩
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 贝琪病了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 汤姆不再只顾着为那个秘密烦恼了，因为又有一件沉甸甸的大事压在了心上。贝琪·撒切尔不来上学了。他靠着骄傲硬撑了几天，想把她忘到风里去，可怎么也做不到。每到夜里，他就在她父亲家附近徘徊，心里难受极了。贝琪病了。她要是死了呢？这个念头简直能叫他发疯。
        - id: ch01-b02
          speaker: narrator
          text: 汤姆不想打仗了，连做海盗也没了兴致。日子失去了魔力，只剩下一片凄凉。铁环和球棒都叫他收了起来，再也不能给他一点快乐。波莉姨妈看在眼里，急在心上，便把各种治病的法子都用到了他身上。
        - id: ch01-b03
          speaker: narrator
          text: 姨妈最爱专卖的成药，也最信那些调养身体的新鲜方法。只要听说又出了什么新东西，她立刻就想试试。当然，她自己从来不病，所以只好挑身边的人来试。她订了各种所谓的健康期刊，也看那些相面摸骨的骗人文章。文章写得郑重其事，其实无知透顶，姨妈读来却比什么都受用。
        - id: ch01-b04
          speaker: narrator
          text: 通风该怎么通，几点睡，几点起，吃什么，喝什么，要做多少运动，心里该想些什么，身上该穿些什么，她全都当成了真理。她从来没发现，这个月的杂志常常会把上个月的主张推翻。姨妈既单纯又诚实，自然很容易上当。她收齐那些假期刊和假药，就像拿死亡武装了自己，骑着惨白的马四处奔走，身后还跟着地狱。可她从没怀疑过自己。在她心里，她一直是救苦救难的天使，是藏起真身的基列乳香，专门去抚慰那些受苦的邻人。
    - id: ch02
      title: 包治百病的止痛药
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那阵子，水疗刚刚流行。汤姆萎靡不振，正好给了姨妈大试身手的机会。每天才到天亮，她就把汤姆赶进柴棚，用冷水从头浇到脚，再拿毛巾像锉刀一样使劲擦，直到他缓过气来。接着，她用湿床单裹住他，塞到毯子下面，非要把他灵魂里的污垢都逼进汗里，再让那些黄斑从毛孔冒出来不可。这是汤姆自己的说法。
        - id: ch02-b02
          speaker: narrator
          text: 受了这么多折腾，汤姆还是越来越忧郁，越来越苍白。姨妈又加上热水浴、坐浴、淋浴和浸浴，他照旧阴沉得像辆灵车。于是，她再用稀燕麦粥和发疱膏给水疗帮忙。她像估量一只水罐那样算准汤姆的容量，每天往他肚里装满各种包治百病的假药。
        - id: ch02-b03
          speaker: narrator
          text: 后来，汤姆被折腾得什么都不在乎了。这可吓坏了姨妈。无论如何，她都得把这股麻木劲儿赶走。正好，她头一回听说一种止痛药，马上订来一大批。她先亲口尝了一下，顿时满怀感激。这药哪里是药，分明就是一团化成水的火。
        - id: ch02-b04
          speaker: narrator
          text: 姨妈立刻扔下别的疗法，把信心全押在止痛药上。她喂汤姆一茶匙，焦急地守着看结果。药一入口，她的忧虑马上没了，因为汤姆再也麻木不起来。就算真在他屁股底下点一堆火，他也未必能表现出这么狂野又热烈的兴趣。
        - id: ch02-b05
          speaker: narrator
          text: 汤姆觉得自己该振作一下了。心碎的时候，这种日子也许还算浪漫，可如今浪漫越来越少，折腾人的花样却越来越多。他想了半天，终于有了脱身的主意。他假装爱上止痛药，一遍又一遍地去讨，烦得姨妈叫他自己拿，别再来打扰她。
        - id: ch02-b06
          speaker: narrator
          text: 要是讨药的是锡德，姨妈一定只顾高兴。偏偏这是汤姆，她便偷偷盯着药瓶。药水果然一天天少下去，可她怎么也没想到，汤姆正拿它给客厅地板上的一道裂缝治病。
    - id: ch03
      title: 彼得尝药
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天，汤姆正在给地板裂缝灌药，姨妈的黄猫彼得走了过来。它咕噜咕噜地叫，眼馋地盯着茶匙，非要尝一口。
        - id: ch03-b02
          speaker: tom
          text: “彼得，你要不是真想喝，就别来讨。”
        - id: ch03-b03
          speaker: narrator
          text: 彼得表示，它是真的想喝。
        - id: ch03-b04
          speaker: tom
          text: “那你可得想清楚。”
        - id: ch03-b05
          speaker: narrator
          text: 彼得想得很清楚。
        - id: ch03-b06
          speaker: tom
          text: “好，是你自己讨的，我就给你。我可不小气。不过，喝了要是不喜欢，你只能怪自己，别去怪别人。”
        - id: ch03-b07
          speaker: narrator
          text: 彼得同意了。汤姆撬开它的嘴，把止痛药灌了下去。彼得猛地蹿起两码高，发出一声打仗似的怪叫，接着绕着屋子疯狂奔跑。它撞翻家具，掀倒花盆，到处惹祸。然后又用后腿站起来，疯了似的四处蹦跳。它把头扭到肩后，一路高叫，仿佛怎么也宣泄不完那份快乐。
        - id: ch03-b08
          speaker: narrator
          text: 彼得又在屋里横冲直撞，走到哪里，混乱和破坏就跟到哪里。波莉姨妈进门时，正看见它连翻几个筋斗。它最后发出一声惊天动地的欢呼，从开着的窗户飞了出去，把剩下的花盆也一并带走。姨妈惊得一动不动，只能隔着眼镜直瞪。汤姆已经倒在地板上，笑得快断气了。
        - id: ch03-b09
          speaker: aunt_polly
          text: “汤姆，这只猫到底怎么了？”
          emotion: surprised
        - id: ch03-b10
          speaker: tom
          text: “我不知道，姨妈。”
        - id: ch03-b11
          speaker: narrator
          text: 汤姆笑得喘不过气。
        - id: ch03-b12
          speaker: aunt_polly
          text: “哎呀，我从没见过这种事！到底是什么把它弄成这样的？”
          emotion: surprised
        - id: ch03-b13
          speaker: tom
          text: “我真不知道，波莉姨妈。猫玩得高兴时，不都是这样吗？”
        - id: ch03-b14
          speaker: aunt_polly
          text: “是吗？猫高兴起来都这样？”
        - id: ch03-b15
          speaker: narrator
          text: 姨妈的口气让汤姆有些不安。
        - id: ch03-b16
          speaker: tom
          text: “是的，姨妈。嗯，我想是这样。”
        - id: ch03-b17
          speaker: aunt_polly
          text: “你当真这么想？”
        - id: ch03-b18
          speaker: tom
          text: “是的，姨妈。”
        - id: ch03-b19
          speaker: narrator
          text: 姨妈弯下腰，汤姆一边看，一边越来越心慌。等他明白姨妈在找什么，已经迟了。那把告密的茶匙正躺在床边的罩布底下，露出了一截柄。姨妈把它捡起来举在手里。汤姆缩了缩身子，低下了眼睛。她揪住他的耳朵，把他提起来，又用顶针结结实实敲了他的脑袋。
        - id: ch03-b20
          speaker: aunt_polly
          text: “好啊，小子，你干吗这样欺负那只不会说话的可怜畜生？”
          emotion: angry
        - id: ch03-b21
          speaker: tom
          text: “我是可怜它才这么做的，因为它没有姨妈。”
        - id: ch03-b22
          speaker: aunt_polly
          text: “没有姨妈？你这个榆木脑袋！这跟姨妈有什么关系？”
          emotion: angry
        - id: ch03-b23
          speaker: tom
          text: “关系可大了。它要是有姨妈，她早把它从里到外烧透了！她会把它的肠子全烤焦，连一点都不心疼，就好像它是个人！”
        - id: ch03-b24
          speaker: narrator
          text: 波莉姨妈心里忽然一痛。汤姆这句话让她换了个角度去想。对猫来说残忍的事，会不会对孩子也一样残忍？她心软了，也有些难过。眼里刚泛起泪光，她便把手放到汤姆头上，轻声开口。
        - id: ch03-b25
          speaker: aunt_polly
          text: “汤姆，我都是为了你好。而且，那药的确对你有好处。”
          emotion: calm
        - id: ch03-b26
          speaker: narrator
          text: 汤姆抬头看着她，脸上装得很严肃，眼里却露出一丝几乎看不见的笑意。
        - id: ch03-b27
          speaker: tom
          text: “我知道你是为我好，姨妈。我给彼得吃药，也是为了它好。药对它也很有好处。我从没见它像刚才那样活蹦乱跳。”
        - id: ch03-b28
          speaker: aunt_polly
          text: “快走吧，汤姆，别再惹我生气。你就试试看，能不能有一回做个好孩子。以后不用再吃药了。”
    - id: ch04
      title: 校门口的表演
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 汤姆又提早到了学校。最近他天天早到，这件怪事已经有人注意了。他还是一直不跟伙伴们玩，只在校门口转来转去。他说自己病了，看上去也的确像病了。他装作到处张望，偏偏不肯看真正想看的那条路。
        - id: ch04-b02
          speaker: narrator
          text: 没过多久，杰夫·撒切尔出现在路上。汤姆的脸顿时亮了，可看了一会儿，他又难过地转开头。杰夫走近以后，汤姆跟他搭起话来，小心地把话头往贝琪身上引，盼着杰夫能说说她。可那个没心没肺的小子始终没看见这个诱饵。
        - id: ch04-b03
          speaker: narrator
          text: 汤姆望了又望。每当路上出现一条蹦跳的裙子，他就燃起希望。一看清来人不是贝琪，他马上又恨上了穿裙子的女孩。后来，再也没有裙子出现。汤姆彻底绝望了，只好垂头丧气地走进空教室，坐在那里独自受苦。
        - id: ch04-b04
          speaker: narrator
          text: 就在这时，又有一条裙子进了校门。汤姆的心猛地跳起来。下一刻，他已经冲到外面，像印第安人一样大喊大叫。他一会儿笑，一会儿追着男孩们跑，又冒着摔断手脚的危险跳过篱笆。他翻跟斗，拿大顶，把能想出的英雄壮举全做了一遍，还一直偷眼看着贝琪，想知道她有没有注意自己。
        - id: ch04-b05
          speaker: narrator
          text: 可贝琪好像什么也没发现，连一眼都不朝汤姆看。难道她不知道他就在这里？汤姆干脆把表演搬到了她跟前。他高叫着绕圈，抢走一个男孩的帽子扔上校舍屋顶，又一头冲进男孩堆里，把他们撞得东倒西歪。最后，他自己也摔了个四脚朝天，正好趴在贝琪鼻子底下，差点把她撞倒。
        - id: ch04-b06
          speaker: narrator
          text: 贝琪把鼻子一扬，转过身去。汤姆听见她说了一句话。
        - id: ch04-b07
          speaker: becky
          text: “哼！有些人还真觉得自己了不起，就爱在人前卖弄！”
        - id: ch04-b08
          speaker: narrator
          text: 汤姆两颊火辣辣的。他从地上爬起来，灰溜溜地走了。此刻的他，既受打击，又垂头丧气。
