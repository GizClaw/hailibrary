  chapters:
    - id: ch01
      title: CHAPTER XII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Tom's secret troubles had been pushed aside by a new and serious worry. Becky Thatcher had stopped coming to school. For several days, he fought against his pride and tried to forget her, but he could not. At night, he found himself lingering near her father's house, feeling miserable. Becky was ill. What if she died? The thought nearly drove him wild.
        - id: ch01-b02
          speaker: narrator
          text: War no longer interested him. Even piracy had lost its charm. Life felt empty and dreary. He put away his hoop and his bat because neither could give him any pleasure now.
        - id: ch01-b03
          speaker: narrator
          text: Aunt Polly grew worried and began trying every kind of remedy on him. She loved patent medicines and every new method that promised to preserve or restore health. Whenever a fresh one appeared, she could hardly wait to try it. She never tried it on herself, since she was never sick. She used whichever other person happened to be close at hand.
        - id: ch01-b04
          speaker: narrator
          text: She subscribed to health magazines and believed every solemn bit of nonsense in them. They told her how to air a room, when to sleep and wake, what to eat and drink, how much to exercise, what mood to keep, and what clothes to wear. Every word was truth to her. She never noticed that this month's advice usually contradicted last month's.
        - id: ch01-b05
          speaker: narrator
          text: Aunt Polly was completely honest and simplehearted, which made her an easy victim. She gathered up her doubtful magazines and medicines and went among her suffering neighbors, armed with death on a pale horse, with hell following behind. That is only a figure of speech, of course. Aunt Polly never doubted that she was really an angel of healing, carrying a sacred balm to anyone who suffered.
        - id: ch01-b06
          speaker: narrator
          text: The water treatment was the newest fashion, and Tom's low spirits gave her a perfect chance to use it. At daylight each morning, she marched him to the woodshed and poured a flood of cold water over him. Then she rubbed him with a towel rough enough to feel like a file until he came back to life.
        - id: ch01-b07
          speaker: narrator
          text: After that, she wrapped him in a wet sheet and buried him under blankets until he sweated his soul clean. As Tom put it, the yellow stains came right out through his pores.
        - id: ch01-b08
          speaker: narrator
          text: None of this helped. Tom only grew paler, sadder, and more dejected. Aunt Polly added hot baths, sitting baths, showers, and plunges, but he stayed as gloomy as a hearse. So she brought in a thin oatmeal diet and blister plasters. She judged his capacity as if he were a jug, then filled him each day with one cure-all after another.
        - id: ch01-b09
          speaker: narrator
          text: By then, Tom had stopped caring about the persecution. That frightened Aunt Polly more than anything. His indifference had to be broken, whatever it took.
        - id: ch01-b10
          speaker: narrator
          text: Then she heard of Pain-killer for the first time and ordered plenty at once. She tasted it herself, and gratitude filled her heart. It was simply fire in liquid form. She abandoned the water treatment and every other remedy and put all her faith in this one medicine.
        - id: ch01-b11
          speaker: narrator
          text: Aunt Polly gave Tom a teaspoonful and watched him with deep anxiety to see what would happen. Her worries vanished at once, and her heart was peaceful again. His indifference was certainly broken. Tom could not have shown wilder or more lively interest if she had built a fire beneath him.
        - id: ch01-b12
          speaker: narrator
          text: Tom decided it was time to wake up. His ruined life might have seemed romantic before, but now it held too many treatments and not enough romance. After considering several ways to escape, he began pretending that he loved Pain-killer.
        - id: ch01-b13
          speaker: narrator
          text: He asked for it so often that Aunt Polly finally told him to serve himself and stop bothering her. If Sid had acted so eager, she would have been delighted without a doubt. But this was Tom, so she secretly watched the bottle whenever he was not looking. The medicine really was disappearing day by day. It never occurred to her that Tom was using it to treat a crack in the sitting-room floor.
        - id: ch01-b14
          speaker: narrator
          text: One day, while Tom was pouring a dose into the crack, Aunt Polly's yellow cat came over. Peter purred, stared greedily at the teaspoon, and begged for a taste.
        - id: ch01-b15
          speaker: tom
          text: "Don't ask unless you truly want some, Peter."
        - id: ch01-b16
          speaker: narrator
          text: Peter made it clear that he did.
        - id: ch01-b17
          speaker: tom
          text: "You'd better be certain."
        - id: ch01-b18
          speaker: narrator
          text: Peter was certain.
        - id: ch01-b19
          speaker: tom
          text: "All right, you asked, so I'll give it to you. I'm not mean. But if you don't like it, you can only blame yourself."
        - id: ch01-b20
          speaker: narrator
          text: Peter agreed. Tom forced open the cat's mouth and poured the Pain-killer down his throat.
        - id: ch01-b21
          speaker: narrator
          text: Peter shot several feet into the air, gave a war whoop, and raced around the room. He crashed into furniture, knocked over flowerpots, and left destruction everywhere. Then he rose on his hind legs and pranced wildly, looking back over his shoulder while his voice announced boundless happiness.
        - id: ch01-b22
          speaker: narrator
          text: He tore through the house once more, spreading chaos in every direction. Aunt Polly came in just in time to see him turn several double somersaults, give one last mighty cry, and fly through the open window with the remaining flowerpots. She froze in astonishment and peered over her glasses. Tom lay on the floor, helpless with laughter.
        - id: ch01-b23
          speaker: aunt_polly
          text: "Tom, what in the world is wrong with that cat?"
          emotion: surprised
        - id: ch01-b24
          speaker: tom
          text: "I don't know, Aunt Polly."
        - id: ch01-b25
          speaker: narrator
          text: Tom could barely force out the words.
        - id: ch01-b26
          speaker: aunt_polly
          text: "I've never seen anything like it. What made him behave that way?"
        - id: ch01-b27
          speaker: tom
          text: "Honestly, I don't know. Cats always do that when they're enjoying themselves."
        - id: ch01-b28
          speaker: aunt_polly
          text: "Oh, they do, do they?"
        - id: ch01-b29
          speaker: narrator
          text: Something in her voice made Tom uneasy.
        - id: ch01-b30
          speaker: tom
          text: "Yes, ma'am. At least, I think they do."
        - id: ch01-b31
          speaker: aunt_polly
          text: "You do?"
        - id: ch01-b32
          speaker: tom
          text: "Yes, ma'am."
        - id: ch01-b33
          speaker: narrator
          text: Aunt Polly bent down while Tom watched her, curious but anxious. Too late, he understood what she was after. The handle of the guilty teaspoon showed beneath the bed curtain. She picked it up and held it out. Tom flinched and lowered his eyes. Aunt Polly lifted him by his usual handle, the ear, and struck his head firmly with her thimble.
        - id: ch01-b34
          speaker: aunt_polly
          text: "Now, sir, why did you treat that poor animal so cruelly?"
          emotion: angry
        - id: ch01-b35
          speaker: tom
          text: "I did it because I felt sorry for him. He hasn't got an aunt."
        - id: ch01-b36
          speaker: aunt_polly
          text: "No aunt! You little fool, what does that have to do with anything?"
        - id: ch01-b37
          speaker: tom
          text: "Everything. If he had an aunt, she'd have burned him up inside herself. She wouldn't have felt any worse about it than if he were a person!"
        - id: ch01-b38
          speaker: narrator
          text: Aunt Polly felt a sudden stab of guilt. Tom had made her see the matter differently. If the medicine was cruel for a cat, perhaps it could be cruel for a boy as well. Her anger softened into sorrow. Tears gathered in her eyes, and she rested a hand on Tom's head.
        - id: ch01-b39
          speaker: aunt_polly
          text: "I meant to help you, Tom. And it really did help you."
          emotion: sad
        - id: ch01-b40
          speaker: narrator
          text: Tom looked into her face. Beneath his serious expression, the smallest twinkle appeared.
        - id: ch01-b41
          speaker: tom
          text: "I know you meant well, Aunty. So did I when I gave it to Peter. It helped him too. I haven't seen him move that fast since..."
        - id: ch01-b42
          speaker: aunt_polly
          text: "Oh, get along with you before you upset me again. Try to be a good boy for once. And you don't have to take any more medicine."
        - id: ch01-b43
          speaker: narrator
          text: Tom reached school early. Lately, people had noticed him doing this strange thing every day. As usual, he waited near the schoolyard gate instead of playing with the other boys. He said he was sick, and he looked sick. He pretended to look everywhere except the one place he was truly watching, the road.
        - id: ch01-b44
          speaker: narrator
          text: At last, Jeff Thatcher appeared. Tom's face brightened for a moment, then fell again. When Jeff arrived, Tom carefully steered their talk toward chances to mention Becky. But Jeff was too thoughtless to notice the hints.
        - id: ch01-b45
          speaker: narrator
          text: Tom kept watching. Every time a lively dress appeared, he hoped it was Becky, then hated its owner when it was not. Finally, no more dresses came through the gate. Tom sank into despair, entered the empty schoolhouse, and sat down to suffer.
        - id: ch01-b46
          speaker: narrator
          text: Then one last dress passed through the gate, and Tom's heart leaped. In an instant, he was outside behaving like an Indian. He yelled and laughed, chased boys, risked his neck jumping the fence, turned handsprings, and stood on his head. He did every heroic thing he could imagine, all while secretly watching to see whether Becky noticed.
        - id: ch01-b47
          speaker: narrator
          text: Becky seemed unaware of everything. She never looked his way. Could she really not know he was there? Tom brought his performance right beside her. He came around with another war whoop, snatched a boy's cap and threw it onto the schoolhouse roof, then charged through a group of boys and sent them tumbling.
        - id: ch01-b48
          speaker: narrator
          text: Tom himself fell sprawling almost at Becky's feet and nearly knocked her over. She turned away with her nose in the air.
        - id: ch01-b49
          speaker: becky
          text: "Hmph! Some people think they're so clever, always showing off!"
        - id: ch01-b50
          speaker: narrator
          text: Tom's cheeks burned. He picked himself up and slipped away, crushed and humiliated.
