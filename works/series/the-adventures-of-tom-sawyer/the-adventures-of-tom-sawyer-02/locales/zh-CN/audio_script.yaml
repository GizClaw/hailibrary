audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    jim:
      display_name: 吉姆
      tts:
        delivery: 老实谨慎，带着孩子气的好奇
        timbre: 清亮稚嫩
        pace: 中等
        pitch: 中高音
    ben_rogers:
      display_name: 本·罗杰斯
      tts:
        delivery: 活泼爱炫耀，兴致来得又快又直
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 星期六早晨，整个夏日世界都明亮清新，充满生机。人人心里都有一支歌。年轻人的歌，更会直接从嘴里唱出来。张张脸上带着喜色，个个脚下轻快有力。刺槐开了花，香气飘满四周。村外高处的加的夫山一片青翠，远近恰到好处，望去像一片朦胧宁静、招引人前往的乐土。
        - id: ch01-b02
          speaker: narrator
          text: 汤姆却提着白灰浆和长柄刷，来到了人行道上。他一看那面围墙，所有快乐立刻都没了。三十码长的木板墙，足有九英尺高。汤姆觉得人生空空荡荡，活着只剩下负担。他叹口气，蘸上灰浆，沿最上面的木板刷了一道。又刷一道，再刷一道。可那短得可怜的白印，摆在大片没刷的围墙前，简直不值一提。他泄气地坐上树箱。
        - id: ch01-b03
          speaker: narrator
          text: 吉姆提着白铁桶，从大门里蹦出来，嘴里还唱着《布法罗姑娘》。汤姆从前最讨厌去镇上的水泵打水，现在倒不觉得那是苦差了。水泵边总有不少人。白人、混血种人和黑人家的男孩女孩在那里等候、歇脚、交换玩意儿，也在那里争吵、打架、胡闹。水泵离这里只有一百五十码，可吉姆从来不会在一小时内回来。有时过了一小时，还得派人去找他。
        - id: ch01-b04
          speaker: tom
          text: “吉姆，你替我刷一会儿墙，我替你去打水。”
        - id: ch01-b05
          speaker: narrator
          text: 吉姆摇了摇头。
        - id: ch01-b06
          speaker: jim
          text: “不行，汤姆少爷。老太太叫我把水打回来，不许跟任何人停下来瞎闹。她早就猜到你会叫我刷墙，还说我只管自己的事，刷墙的事由她来管。”
        - id: ch01-b07
          speaker: tom
          text: “别听她怎么说，吉姆，她一向这样。把桶给我吧，我一会儿就回来，她根本不会知道。”
        - id: ch01-b08
          speaker: jim
          text: “我不敢，汤姆少爷。老太太非把我的脑袋拧下来不可。她真的会。”
          emotion: fearful
        - id: ch01-b09
          speaker: tom
          text: “她？她才不会真打人呢，不过拿顶针敲几下脑袋，谁在乎？她的话是吓人，可话又伤不了你，只要她别哭就行。吉姆，我送你一颗玻璃弹子，一颗白玉弹！”
        - id: ch01-b10
          speaker: narrator
          text: 吉姆有些动摇了。
        - id: ch01-b11
          speaker: tom
          text: “白玉弹呀，吉姆！还是颗顶呱呱的主弹。”
        - id: ch01-b12
          speaker: jim
          text: “哎哟，这颗弹子可真漂亮！可我还是怕老太太……”
        - id: ch01-b13
          speaker: tom
          text: “你要肯刷，我还把受伤的脚趾给你看。”
        - id: ch01-b14
          speaker: narrator
          text: 吉姆毕竟也是凡人，这一下实在抵挡不住。他放下桶，拿过白玉弹，俯身盯着汤姆解开脚趾上的绷带。转眼间，吉姆已经提桶飞奔在街上，屁股被打得火辣辣的。汤姆正卖力刷墙。波莉姨妈手里拿着一只拖鞋，眼中满是胜利，退出了战场。
        - id: ch01-b15
          speaker: narrator
          text: 可汤姆的干劲很快就没了。他想起今天原本安排的种种乐事，心里越发难受。那些自由的男孩很快就会蹦蹦跳跳地经过这里，去参加各种快活的远征。他们看到汤姆非干活不可，一定会把他笑个够。单是想想，都像火烧一样。
        - id: ch01-b16
          speaker: narrator
          text: 汤姆掏出全部家当，只有破玩具、弹子和几样废物。也许能买来一点儿劳力，却买不到半小时真正的自由。他只好把寒酸的财产放回口袋，放弃收买伙伴。就在最黑暗、最绝望的这一刻，一个伟大又辉煌的妙计，突然闯进他的脑海。
        - id: ch01-b17
          speaker: narrator
          text: 他拿起刷子，安安静静地干了起来。过了一会儿，本·罗杰斯来了。全镇的男孩当中，汤姆最怕遭到本的嘲笑。本一路又蹦又跳，心情好极了。他啃着苹果，不时拖长声音鸣一声汽笛，再用低沉的嗓子发出“叮咚咚、叮咚咚”的钟声。他正在扮演一艘汽船。
        - id: ch01-b18
          speaker: narrator
          text: 本靠近以后，放慢速度，走到街道中央，身子向右舷远远倾斜，沉重而隆重地绕过弯来。他扮的是“大密苏里号”，还认定这艘船吃水九英尺。他同时扮演汽船、船长和机舱钟，只得想象自己站在顶层甲板上，既要下令，又要执行。
        - id: ch01-b19
          speaker: ben_rogers
          text: “停车，先生！叮铃铃！”
        - id: ch01-b20
          speaker: narrator
          text: 船的冲力快用尽了，他缓缓靠向人行道。
        - id: ch01-b21
          speaker: ben_rogers
          text: “准备倒车！叮铃铃！”
        - id: ch01-b22
          speaker: narrator
          text: 他的双臂伸得笔直，僵硬地贴在身侧。
        - id: ch01-b23
          speaker: ben_rogers
          text: “右舷倒车！叮铃铃！轰！哧——轰呜！轰！”
        - id: ch01-b24
          speaker: narrator
          text: 本的右手庄严地转着圆圈，代表那只四十英尺高的明轮。
        - id: ch01-b25
          speaker: ben_rogers
          text: “左舷倒车！叮铃铃！轰——哧轰——轰！”
        - id: ch01-b26
          speaker: narrator
          text: 他的左手也转了起来。
        - id: ch01-b27
          speaker: ben_rogers
          text: “右舷停车！叮铃铃！左舷停车！右舷前进！停车！外侧明轮慢慢转！叮铃铃！轰——呜——呜！抛出船头缆，快点儿！再把倒缆递出来，你们在干什么？把绳圈套上那个树桩！舷梯准备，放下！轮机完车，先生！叮铃铃！嘶！嘶！嘶！”
        - id: ch01-b28
          speaker: narrator
          text: 最后几声，是本在试水位旋塞。汤姆一直刷着墙，根本不理这艘汽船。本看了他一会儿，终于开口。
        - id: ch01-b29
          speaker: ben_rogers
          text: “嗨呀！你可摊上苦差事了！”
        - id: ch01-b30
          speaker: narrator
          text: 汤姆没有回答。他像个艺术家一样审视刚刷过的地方，轻轻挥一下刷子，又端详起效果。本靠到旁边。汤姆看着他的苹果，馋得直流口水，却还是继续干活。
        - id: ch01-b31
          speaker: ben_rogers
          text: “嘿，老伙计，你今天非干活不可，是吧？”
        - id: ch01-b32
          speaker: narrator
          text: 汤姆猛地回过身。
        - id: ch01-b33
          speaker: tom
          text: “咦，是你呀，本！我刚才没注意。”
        - id: ch01-b34
          speaker: ben_rogers
          text: “我要去游泳了。你一定也想去吧？不过你当然宁愿留下来干活，对不对？你当然愿意啦！”
        - id: ch01-b35
          speaker: narrator
          text: 汤姆看了看他。
        - id: ch01-b36
          speaker: tom
          text: “你说的干活，是什么意思？”
        - id: ch01-b37
          speaker: ben_rogers
          text: “怎么，难道你现在做的不是干活？”
        - id: ch01-b38
          speaker: narrator
          text: 汤姆又刷起墙来，回答得毫不在意。
        - id: ch01-b39
          speaker: tom
          text: “也许算，也许不算。反正汤姆·索亚喜欢做这件事。”
        - id: ch01-b40
          speaker: ben_rogers
          text: “得了吧！你不会真要说自己喜欢吧？”
        - id: ch01-b41
          speaker: narrator
          text: 刷子依旧来回移动。
        - id: ch01-b42
          speaker: tom
          text: “我为什么不能喜欢？哪个男孩能天天得到刷围墙的机会？”
        - id: ch01-b43
          speaker: narrator
          text: 这句话让整件事忽然变了个样。本不再啃苹果。汤姆优雅地把刷子来回一抹，退后看看效果，再给这里补一笔，给那里添一道，然后重新品评。本盯住他的每一个动作，越来越感兴趣，最后完全入了迷。
        - id: ch01-b44
          speaker: ben_rogers
          text: “汤姆，让我也刷一会儿吧。”
        - id: ch01-b45
          speaker: narrator
          text: 汤姆想了一下，仿佛正要答应，却又改了主意。
        - id: ch01-b46
          speaker: tom
          text: “不行，恐怕不大合适。本，波莉姨妈对这面墙特别挑剔，因为它正临着大街。要是后院那面墙，我不会在意，她也不会在意。可这一面必须刷得非常仔细。我想，一千个男孩里，也许两千个男孩里，都找不出一个能按她的要求刷好。”
        - id: ch01-b47
          speaker: ben_rogers
          text: “真的？那更该让我试试。就一点点。要是我们换过来，我肯定会让你刷，汤姆。”
        - id: ch01-b48
          speaker: tom
          text: “本，我是真心愿意让你刷。可波莉姨妈不答应。吉姆想刷，她不许。锡德想刷，她也不许。你现在知道我有多难办了吧？你要是碰这面墙，万一出了什么事……”
        - id: ch01-b49
          speaker: ben_rogers
          text: “不会出事，我一定特别小心。让我试试吧。我把苹果核给你。”
        - id: ch01-b50
          speaker: tom
          text: “嗯，那就……还是不行，本。我怕……”
        - id: ch01-b51
          speaker: ben_rogers
          text: “我把整个苹果都给你！”
        - id: ch01-b52
          speaker: narrator
          text: 汤姆脸上满是不舍，心里却欢天喜地。他终于交出了刷子。刚才的“大密苏里号”在太阳底下卖力干活，累得汗流浃背。退休的艺术家却坐在近旁阴凉处的木桶上，晃着双腿，嚼着苹果，盘算怎样宰割更多无辜的人。
        - id: ch01-b53
          speaker: narrator
          text: 根本不愁没有人上钩。每隔一会儿就有男孩经过。他们原本是来嘲笑汤姆的，最后却全都留下刷墙。本筋疲力尽以后，汤姆把下一次机会卖给比利·费希尔，换来一只完好的风筝。比利干不动了，约翰尼·米勒又用一只死老鼠和一根能甩着老鼠玩的细绳，买到了接班的资格。一个接着一个，一个钟头又一个钟头。
        - id: ch01-b54
          speaker: narrator
          text: 到了下午过半，早晨还穷得叮当响的汤姆，已经富得流油。除了刚才那些东西，他又有了十二颗弹子、一截口簧琴、一片能隔着看的蓝瓶玻璃、一门线轴小炮、一把打不开任何锁的钥匙、一截粉笔、一个玻璃酒瓶塞、一个锡兵、两只蝌蚪、六枚爆竹、一只独眼小猫、一个黄铜门把手，还有一条没有狗的狗项圈。他另外还有一只刀柄、四块橘子皮和一扇破旧的窗框。
        - id: ch01-b55
          speaker: narrator
          text: 整整一天，他一直舒舒服服地闲着，玩得十分痛快，身边从头到尾始终还有许多人作伴。围墙呢，已经结结实实刷了三层白灰浆。要不是灰浆用完了，汤姆准能让村里每个男孩都破产。
        - id: ch01-b56
          speaker: narrator
          text: 汤姆心想，这个世界终究没有那么空虚。他无意中发现了一条重要的道理。想叫一个男人或男孩渴望某样东西，只要让那东西很难得到就行。假如他像本书的作者一样，是位伟大又聪明的哲学家，这时就会明白，人非做不可的事叫工作，不必做的事才叫游戏。
        - id: ch01-b57
          speaker: narrator
          text: 所以，制作人造花、踩踏车是工作，打保龄球、攀登勃朗峰却是消遣。英国有些有钱的绅士，夏天每天赶着四匹马拉的客车，沿固定路线走二三十英里。因为要花很多钱才能得到这份特权，他们乐意去做。可一旦有人付工钱请他们赶车，事情就成了工作，他们也会马上辞掉。
        - id: ch01-b58
          speaker: narrator
          text: 汤姆默默想了一会儿，掂量着自己如今实实在在的财富，随后便动身去大本营汇报战果。
