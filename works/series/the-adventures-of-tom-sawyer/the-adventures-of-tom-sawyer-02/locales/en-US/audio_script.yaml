  chapters:
    - id: ch01
      title: CHAPTER II
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Saturday morning arrived, and the whole summer world looked bright, fresh, and full of life. Every heart held a song, and young hearts sang theirs aloud. Cheerful faces were everywhere, and every step had a bounce in it. The locust trees were blooming, and their fragrance filled the air. Beyond the village, green Cardiff Hill seemed just far enough away to be a dreamy, peaceful land calling everyone toward it.
        - id: ch01-b02
          speaker: narrator
          text: Tom came out onto the sidewalk carrying a bucket of whitewash and a long-handled brush. Then he looked at the fence. All his happiness vanished. There stood thirty yards of boards, nine feet high. Life felt empty, and simply being alive felt like a burden. With a sigh, he painted the top plank once, then twice, then once more. He compared that tiny white streak with the great stretch of fence still waiting for him. Then he sat down on a wooden box, thoroughly discouraged.
        - id: ch01-b03
          speaker: narrator
          text: Jim skipped through the gate, singing Buffalo Gals and carrying a tin pail. Tom had always hated fetching water from the town pump. This morning, though, it looked like a fine job. White children, Black children, and children of mixed race gathered there to wait their turns. They rested, traded toys, argued, fought, and fooled around. The pump was only a hundred and fifty yards away, but Jim never returned in less than an hour. Usually somebody had to go and bring him back.
        - id: ch01-b04
          speaker: tom
          text: "Say, Jim, I'll fetch the water if you do some whitewashing."
        - id: ch01-b05
          speaker: narrator
          text: Jim shook his head.
        - id: ch01-b06
          speaker: jim
          text: "Can't do it, Master Tom. The old missus told me to get this water and not stop to fool around with anybody. She said you'd likely ask me to whitewash. She told me to mind my own business, and she'd mind the fence."
        - id: ch01-b07
          speaker: tom
          text: "Never mind what she said. She always talks that way. Give me the bucket. I'll only be gone a minute, and she'll never know."
        - id: ch01-b08
          speaker: jim
          text: "Oh, I don't dare, Master Tom. The old missus would tear my head off. She truly would."
          emotion: fearful
        - id: ch01-b09
          speaker: tom
          text: "Her? She never really whips anybody. She just taps them on the head with her thimble. Who cares about that? She can talk terribly, but words don't hurt unless she starts crying. Jim, I'll give you a marble. A white alley!"
        - id: ch01-b10
          speaker: narrator
          text: Jim began to waver.
        - id: ch01-b11
          speaker: tom
          text: "A white alley, Jim! And it's a fine shooter."
        - id: ch01-b12
          speaker: jim
          text: "My, that's a splendid marble! But Master Tom, I'm mighty afraid of the old missus..."
          emotion: fearful
        - id: ch01-b13
          speaker: tom
          text: "And if you do it, I'll show you my sore toe."
        - id: ch01-b14
          speaker: narrator
          text: Jim was only human. That offer was too much. He set down the pail, took the white marble, and bent close while Tom unwound the bandage. A moment later, Jim was racing down the street with his pail and a stinging backside. Tom was painting with sudden energy, while Aunt Polly left the scene holding a slipper and looking victorious.
        - id: ch01-b15
          speaker: narrator
          text: Tom's burst of energy did not last. He remembered all the fun he had planned for the day, and his misery grew. Soon the free boys would come skipping along, each one setting off on some wonderful adventure. They would see him trapped at the fence and make endless fun of him for having to work. The thought burned like fire.
        - id: ch01-b16
          speaker: narrator
          text: He emptied his pockets and studied everything he owned. There were bits of toys, marbles, and assorted rubbish. It might buy a little help, but it could not buy even half an hour of freedom. Tom put his poor little fortune away. There was no use trying to hire the other boys.
        - id: ch01-b17
          speaker: narrator
          text: Then, at that dark and hopeless moment, an idea flashed into his mind. It was no ordinary idea. It was a great and magnificent one.
        - id: ch01-b18
          speaker: narrator
          text: Tom picked up the brush and went calmly back to work. Before long, Ben Rogers appeared. Of all the boys in town, Ben was the one whose teasing Tom had feared most. Ben came hopping and skipping down the street, eating an apple and feeling wonderfully cheerful.
        - id: ch01-b19
          speaker: narrator
          text: Every so often, Ben gave a long musical whoop, followed by a deep ding-dong-dong. He was pretending to be a steamboat. As he drew near, he slowed down, moved into the middle of the street, leaned far to starboard, and made a grand, heavy turn. He was the Big Missouri now, drawing nine feet of water. He had to be the boat, its captain, and its engine bells all at once. In his mind he stood high on the hurricane deck, shouting every order and carrying it out himself.
        - id: ch01-b20
          speaker: ben_rogers
          text: "Stop her, sir! Ting-a-ling-ling!"
        - id: ch01-b21
          speaker: narrator
          text: His forward motion nearly stopped as he eased toward the sidewalk.
        - id: ch01-b22
          speaker: ben_rogers
          text: "Engines in reverse! Ting-a-ling-ling!"
        - id: ch01-b23
          speaker: narrator
          text: His arms went straight and stiff against his sides.
        - id: ch01-b24
          speaker: ben_rogers
          text: "Back her up on the starboard side! Ting-a-ling-ling! Chow! Ch-chow-wow! Chow!"
        - id: ch01-b25
          speaker: narrator
          text: His right hand rolled in stately circles, turning an imaginary forty-foot paddle wheel.
        - id: ch01-b26
          speaker: ben_rogers
          text: "Now back her up on the larboard side! Ting-a-ling-ling! Chow-ch-chow-chow!"
        - id: ch01-b27
          speaker: narrator
          text: This time his left hand began to circle.
        - id: ch01-b28
          speaker: ben_rogers
          text: "Stop starboard! Ting-a-ling-ling! Stop larboard! Ahead on starboard! Stop her! Let the outside wheel turn slowly! Ting-a-ling-ling! Chow-ow-ow! Get that headline out, lively now! Bring out the spring line! What are you doing there? Loop it around that stump! Stand by the gangplank. Let her go! Finished with the engines, sir! Ting-a-ling-ling! Shh-t! Shh-t! Shh-t!"
        - id: ch01-b29
          speaker: narrator
          text: The last noises were Ben testing his imaginary gauge cocks. Through the whole performance, Tom kept whitewashing and never looked at the steamboat. Ben stared at him for a moment.
        - id: ch01-b30
          speaker: ben_rogers
          text: "Hi-yi! You're in trouble now, aren't you?"
        - id: ch01-b31
          speaker: narrator
          text: Tom did not answer. He studied his latest brushstroke like an artist, swept the brush gently once more, and studied the result again. Ben pulled up beside him. Tom badly wanted the apple, but he stayed with the fence.
        - id: ch01-b32
          speaker: ben_rogers
          text: "Hello, old fellow. They made you work, did they?"
        - id: ch01-b33
          speaker: narrator
          text: Tom spun around as though he had only just noticed him.
        - id: ch01-b34
          speaker: tom
          text: "Why, Ben! I didn't see you there."
        - id: ch01-b35
          speaker: ben_rogers
          text: "I'm going swimming. Don't you wish you could come? But you'd rather work, wouldn't you? Of course you would."
        - id: ch01-b36
          speaker: narrator
          text: Tom looked Ben over for a moment.
        - id: ch01-b37
          speaker: tom
          text: "What do you mean by work?"
        - id: ch01-b38
          speaker: ben_rogers
          text: "Isn't that work?"
        - id: ch01-b39
          speaker: narrator
          text: Tom went back to painting and answered as if it hardly mattered.
        - id: ch01-b40
          speaker: tom
          text: "Maybe it is, and maybe it isn't. All I know is, Tom Sawyer likes it."
        - id: ch01-b41
          speaker: ben_rogers
          text: "Oh, come on. You aren't really saying you enjoy it."
        - id: ch01-b42
          speaker: narrator
          text: The brush never stopped moving.
        - id: ch01-b43
          speaker: tom
          text: "Why shouldn't I enjoy it? How often does a boy get to whitewash a fence?"
        - id: ch01-b44
          speaker: narrator
          text: That changed everything. Ben stopped nibbling his apple. Tom brushed delicately back and forth, stepped away to judge the effect, added a touch here and another there, then judged it again. Ben watched every movement. He grew more interested by the second, until at last he could stand it no longer.
        - id: ch01-b45
          speaker: ben_rogers
          text: "Say, Tom, let me paint a little."
        - id: ch01-b46
          speaker: narrator
          text: Tom considered the request. He almost agreed, then changed his mind.
        - id: ch01-b47
          speaker: tom
          text: "No, Ben, I don't think that would do. Aunt Polly is very particular about this fence because it faces the street. If it were the back fence, neither of us would care. But this one has to be done just right. I suppose only one boy in a thousand, maybe one in two thousand, could manage it."
        - id: ch01-b48
          speaker: ben_rogers
          text: "Really? Come on, Tom, just let me try a little. I'd let you try if I were holding the brush."
        - id: ch01-b49
          speaker: tom
          text: "Honestly, Ben, I'd like to. But Aunt Polly wouldn't let Jim do it, and she wouldn't let Sid do it either. You can see the trouble I'm in. If you worked on this fence and something went wrong..."
        - id: ch01-b50
          speaker: ben_rogers
          text: "Oh, nonsense. I'll be very careful. Let me try. I'll give you my apple core."
        - id: ch01-b51
          speaker: tom
          text: "Well, here... No, Ben, you'd better not. I'm afraid..."
        - id: ch01-b52
          speaker: ben_rogers
          text: "I'll give you the whole apple!"
        - id: ch01-b53
          speaker: narrator
          text: Tom handed over the brush. His face showed great reluctance, but his heart leaped to give it up. The former steamboat Big Missouri worked and sweated in the sun. The retired artist sat on a barrel in the shade, swung his legs, ate his apple, and planned how to catch more innocent boys.
        - id: ch01-b54
          speaker: narrator
          text: He had plenty of chances. Boys came by every few minutes. They arrived to make fun of Tom, but they stayed to whitewash. When Ben grew tired, Tom sold the next turn to Billy Fisher for a good kite. When Billy wore out, Johnny Miller paid with a dead rat and the string used to swing it. So it went, hour after hour.
        - id: ch01-b55
          speaker: narrator
          text: By the middle of the afternoon, the poor boy from that morning was rolling in wealth. Along with the kite and the dead rat, Tom now owned twelve marbles, part of a jew's-harp, a piece of blue bottle glass to look through, a spool cannon, and a key that opened nothing. He had chalk, a glass bottle stopper, a tin soldier, two tadpoles, and six firecrackers. He had a one-eyed kitten, a brass doorknob, a dog collar with no dog, a knife handle, four pieces of orange peel, and a broken old window sash.
        - id: ch01-b56
          speaker: narrator
          text: All that time, Tom had rested pleasantly, done nothing, and enjoyed plenty of company. Meanwhile, the fence received three full coats of whitewash from end to end. If the whitewash had not run out, Tom would have taken everything the boys owned and ruined every boy in the village.
        - id: ch01-b57
          speaker: narrator
          text: The world did not seem so empty to Tom anymore. Without knowing it, he had discovered a great rule about people. To make a man or a boy long for something, you only have to make it hard to get.
        - id: ch01-b58
          speaker: narrator
          text: If Tom had been a great and wise philosopher, like the author of this book, he would have understood the difference between work and play. Work is anything a person has to do. Play is anything a person is not forced to do. That is why making artificial flowers or walking on a treadmill is work, while bowling or climbing Mont Blanc is amusement.
        - id: ch01-b59
          speaker: narrator
          text: In England, some wealthy gentlemen drove passenger coaches twenty or thirty miles every summer day because the privilege cost them plenty of money. If anyone had offered to pay them for the same driving, it would have turned into work, and they would have quit.
        - id: ch01-b60
          speaker: narrator
          text: Tom sat for a while and considered how greatly his fortunes had changed. Then he headed back to headquarters to make his report.
