audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    joe:
      display_name: 乔
      tts:
        delivery: 认真热烈，带着孩子气的悲壮和兴奋
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，语气粗朴而自在
        timbre: 微哑稚嫩
        pace: 从容
        pitch: 中音
    unidentified_pirate:
      display_name: 一名海盗
      tts:
        delivery: 认真应令，带着孩子扮演海盗时的郑重
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 两个伤心人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 汤姆终于拿定了主意。他又阴郁，又绝望，认定自己是个没人疼、没人要的孩子。等大家发现把他逼到了什么地步，也许会后悔吧。他明明想好好做人，可他们就是不肯放过他。既然非赶走他不可，那就走好了。将来出了什么事，也该怪他们。一个无依无靠的人，哪里有资格抱怨？汤姆觉得，是他们逼他走到这一步的。他只能去过犯罪的生活了。
        - id: ch01-b02
          speaker: narrator
          text: 这时，汤姆已经顺着草场巷走了很远。学校的上课铃隐隐传来。一想到从此再也听不到这熟悉的声音，他哭出了声。这件事实在残酷，可他是被逼进冷酷世界的，只好认命。不过，他还是原谅了大家。越这么想，他越是抽噎个不停。
        - id: ch01-b03
          speaker: narrator
          text: 偏偏就在这时，汤姆遇见了生死伙伴乔·哈珀。乔目光冷峻，心里显然也有一个悲壮的大打算。真是两颗心，装着同一个念头。汤姆一边拿袖子擦眼睛，一边呜咽着说，家里人欺负他，也没人同情他。他决定逃出去，在广阔的世界里漂泊，再也不回来。他只求乔别忘了自己。
        - id: ch01-b04
          speaker: narrator
          text: 谁知乔正想对汤姆说同样的话，所以才特地来找他。妈妈为了几口奶油打了他，可那奶油他根本没尝过，连怎么回事都不知道。看来妈妈已经厌烦他，只盼他走掉。既然如此，他只能认了。乔希望妈妈以后过得快活，也永远别后悔把可怜的儿子赶进无情的世界，叫他受苦，再悲惨地死去。
        - id: ch01-b05
          speaker: narrator
          text: 两个男孩悲悲戚戚地往前走，又立下盟誓。从此，他们要彼此扶持，结成兄弟，永不分离，直到死亡替他们结束一切烦恼。接着，他们商量起往后的日子。乔原想当隐士，住进远方的山洞，靠面包皮活着，最后冻死、饿死、伤心死。可听汤姆讲过犯罪生活的种种好处，他终于改了主意，同意去当海盗。
        - id: ch01-b06
          speaker: narrator
          text: 圣彼得堡下游三英里处，密西西比河宽一英里有余。河里有座狭长的小岛，长满树木，岛头还伸着一道浅滩，正适合海盗会合。小岛靠近对岸，面对一片几乎没有人烟的密林，岛上也没人居住。于是，他们选中了杰克逊岛。至于将来要抢谁，谁也没想过。
        - id: ch01-b07
          speaker: narrator
          text: 两人找到哈克贝利·费恩，他马上答应入伙。反正干什么对哈克来说都一样。三人约好在午夜碰头，地点是村庄上游两英里处一片僻静的河岸。那里有只小木筏，他们准备把它夺来。每个人还要带上钓钩、钓线，再用最黑暗、最神秘的办法偷些吃的，这才像亡命之徒。
        - id: ch01-b08
          speaker: narrator
          text: 那天下午还没过完，他们就已经四处放出风声，说全镇的人很快会“听到点动静”。能得到这句神秘暗示的人，还会被郑重叮嘱一句：别出声，只管等着瞧。
    - id: ch02
      title: 午夜会合
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 午夜前后，汤姆来了。他带着一只煮火腿和几样零碎东西，停在会合处上方的小峭壁上，藏进浓密的灌木丛。满天都是星星，四下静极了。浩荡的河水横卧在那里，像一片沉睡的海。汤姆听了一会儿，没听到半点声音，便清清楚楚地吹了一声低哨。峭壁下面立刻响起回应。他又吹两声，下面也答了两声。接着，一个戒备的声音问了起来。
        - id: ch02-b02
          speaker: unidentified_pirate
          text: “来的是谁？”
        - id: ch02-b03
          speaker: tom
          text: “我是西班牙海上的黑衣复仇者汤姆·索亚。你们也报上名来。”
        - id: ch02-b04
          speaker: unidentified_pirate
          text: “血手哈克·费恩，还有海上煞星乔·哈珀。”
        - id: ch02-b05
          speaker: narrator
          text: 这些响当当的名号，全是汤姆从自己最爱看的书里找来，分给大家的。
        - id: ch02-b06
          speaker: tom
          text: “很好。说出口令。”
        - id: ch02-b07
          speaker: narrator
          text: 两个沙哑的声音一起对着阴沉的黑夜，吐出了那个可怕的字眼。
        - id: ch02-b08
          speakers: [huck, joe]
          ensemble: duo
          text: “口令是——血！”
        - id: ch02-b09
          speaker: narrator
          text: 汤姆先把火腿扔下峭壁，自己再跟着爬下去。这一趟费了不少力气，皮肉和衣裳都划破了一些。其实下面沿着河岸就有一条平坦好走的小路。可那条路既不艰难，也不危险，海盗当然看不上。
        - id: ch02-b10
          speaker: narrator
          text: 海上煞星带来一大块咸猪肉，光是把它弄到这里，就差点累垮了。血手费恩偷来一只煎锅、一包没完全晾干的烟叶，还拿了几根玉米芯做烟斗。三个海盗里，只有他会抽烟，也只有他会嚼烟叶。
        - id: ch02-b11
          speaker: narrator
          text: 黑衣复仇者说，没带火可不能出发。这话很有道理，那时候几乎见不到火柴。他们看见上游一百码外的大木筏上还有火闷着，便偷偷摸过去，拿了一块火种。
        - id: ch02-b12
          speaker: narrator
          text: 他们硬把这件小事办成了一场威风十足的冒险。一会儿低喝一声“嘘”，一会儿又突然停住，把手指压在嘴唇上。走路时，他们还把手搭在想象中的匕首柄上，用阴森的耳语下令，要是“敌人”敢动，就“一刀捅到底”，因为“死人不会泄密”。其实他们明知道，筏工全都进村买东西或寻欢去了。不过，这可不能成为他们不按海盗规矩行事的理由。
    - id: ch03
      title: 木筏夜航
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 不久，三个人撑着木筏离岸。汤姆是船长，哈克守后桨，乔守前桨。汤姆站在木筏中央，抱着双臂，皱紧眉头，用又低又严厉的声音下令。
        - id: ch03-b02
          speaker: tom
          text: “迎风转舵，把船头顶上风！”
        - id: ch03-b03
          speaker: unidentified_pirate
          text: “是，长官！”
        - id: ch03-b04
          speaker: tom
          text: “稳住——稳——住——”
        - id: ch03-b05
          speaker: unidentified_pirate
          text: “已经稳住了，长官！”
        - id: ch03-b06
          speaker: tom
          text: “再偏开一个罗经点！”
        - id: ch03-b07
          speaker: unidentified_pirate
          text: “偏开一个点，长官！”
        - id: ch03-b08
          speaker: narrator
          text: 男孩们不紧不慢地把木筏划向河心。大家都知道，这些命令只为摆出船上的派头，并没有什么实际用处。
        - id: ch03-b09
          speaker: tom
          text: “这条船现在挂着哪些帆？”
        - id: ch03-b10
          speaker: unidentified_pirate
          text: “横帆、顶帆，还有三角帆，长官。”
        - id: ch03-b11
          speaker: tom
          text: “升起顶桅帆！上面的人全出去！来半打水手，升前桅顶上翼帆！快一点！”
        - id: ch03-b12
          speaker: unidentified_pirate
          text: “是，长官！”
        - id: ch03-b13
          speaker: tom
          text: “把主桅顶上帆抖开！拉紧帆脚索和转帆索！弟兄们，现在就动手！”
        - id: ch03-b14
          speaker: unidentified_pirate
          text: “是，长官！”
        - id: ch03-b15
          speaker: tom
          text: “下风舵，左满舵！等她转过来就接住！左舵，快左舵！伙计们，就是现在，使把劲！稳——住——”
        - id: ch03-b16
          speaker: unidentified_pirate
          text: “稳住了，长官！”
        - id: ch03-b17
          speaker: narrator
          text: 木筏过了河心，男孩们调正方向，便把桨搁下休息。河水不高，水流每小时只有两三英里。接下来的三刻钟，谁也没怎么说话。
        - id: ch03-b18
          speaker: narrator
          text: 木筏慢慢从远处的小镇前经过。两三点灯火标出了小镇的位置。它躺在辽阔朦胧、缀着星光的水面之外，安安静静地睡着，根本不知道眼前正发生一桩惊天动地的大事。
        - id: ch03-b19
          speaker: narrator
          text: 黑衣复仇者站着不动，双臂抱在胸前，向那片留下过他往日快乐和后来苦难的地方“看最后一眼”。他多希望“她”此刻能看见自己。看见他漂泊在狂野的大海上，勇敢面对危险和死亡，嘴角带着冷峻的笑，正一步步走向末日。
        - id: ch03-b20
          speaker: narrator
          text: 在想象里把杰克逊岛挪到小镇看不见的地方，对汤姆一点也不难。所以，他带着一颗既破碎又满足的心，郑重地看了最后一眼。另外两个海盗也在告别故乡。三个人看得太久，差点让水流把木筏冲过小岛。好在他们及时发现，勉强避开了危险。
        - id: ch03-b21
          speaker: narrator
          text: 凌晨两点左右，木筏在岛头上游两百码的一道浅滩搁住了。他们在水里来回蹚了好几趟，才把东西全搬上岸。筏上还有一张旧帆，他们把它盖在灌木丛的角落上，搭成帐篷，专门遮护粮食。至于海盗自己，天气好时当然得露天睡觉。
    - id: ch04
      title: 营火边的海盗
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 三人往幽暗的森林里走了二三十步，在一根大倒木旁生起火。他们用煎锅煎了些咸猪肉当晚饭，又吃掉一半玉米饼。在无人探索、无人居住的小岛上，远离人迹，自由自在地吃这一顿，实在痛快极了。他们当场宣布，再也不回文明世界。
        - id: ch04-b02
          speaker: narrator
          text: 火苗向上蹿，照亮了他们的脸。红光落在一根根柱子般的树干上，也映着油亮的叶片和低垂的藤蔓。整片森林像一座属于他们的圣殿。
        - id: ch04-b03
          speaker: narrator
          text: 最后一片焦脆的咸猪肉没了，最后一份玉米饼也下了肚。三个男孩心满意足地躺到草地上。他们明明可以找个凉快些的地方，却谁也不肯放弃熊熊营火带来的浪漫滋味。
        - id: ch04-b04
          speaker: joe
          text: “这日子是不是痛快极了？”
          emotion: happy
        - id: ch04-b05
          speaker: tom
          text: “简直好得不得了！要是镇上那些男孩能看见我们，他们会怎么说？”
          emotion: happy
        - id: ch04-b06
          speaker: joe
          text: “还用问？他们肯定恨不得立刻过来。对不对，哈克？”
        - id: ch04-b07
          speaker: huck
          text: “我想也是。反正我很满意，再好也不过如此。我平常总吃不饱。在这里可没人挑我的毛病，也没人冲我唠叨个没完。”
        - id: ch04-b08
          speaker: tom
          text: “这样的生活最适合我。早上不用起床，不用上学，不用洗脸，也不用管那些倒霉的蠢事。乔，海盗上了岸，什么都不必做。隐士可得祷告很久，而且总是孤零零的，一点乐趣也没有。”
        - id: ch04-b09
          speaker: joe
          text: “说得对。我以前没认真想过。现在亲自当了一回，我可更愿意做海盗。”
        - id: ch04-b10
          speaker: tom
          text: “你看，现在的人已经不像古时候那么看重隐士了，海盗却一直受人敬重。隐士还得找最硬的地方睡，把粗麻布和炉灰堆到头上，站在雨里，还得——”
        - id: ch04-b11
          speaker: huck
          text: “他干吗把粗麻布和炉灰堆在头上？”
        - id: ch04-b12
          speaker: tom
          text: “我也不知道。可他们非这么做不可，隐士向来都这样。你要是当隐士，也躲不过去。”
        - id: ch04-b13
          speaker: huck
          text: “我死也不干。”
        - id: ch04-b14
          speaker: tom
          text: “那你打算怎么办？”
        - id: ch04-b15
          speaker: huck
          text: “我不知道。反正不干。”
        - id: ch04-b16
          speaker: tom
          text: “可你非干不可呀，哈克。你还能怎么躲？”
        - id: ch04-b17
          speaker: huck
          text: “我不受那份罪。我会逃走。”
        - id: ch04-b18
          speaker: tom
          text: “逃走？那你可真是个不中用的懒鬼隐士。你会把隐士的脸都丢光。”
        - id: ch04-b19
          speaker: narrator
          text: 血手没有回答。他正在忙更要紧的事。哈克把玉米芯挖空，安上一截野草茎，塞进烟叶，再拿一块炭火点着，吐出一团芬芳的烟。他完全沉浸在这份奢华的满足里。另外两个海盗羡慕极了，暗自决定自己很快也要学会这种威风的恶习。过了一会儿，哈克开口了。
        - id: ch04-b20
          speaker: huck
          text: “当海盗都要干些什么？”
        - id: ch04-b21
          speaker: tom
          text: “海盗过得可威风了。他们抢下大船，再一把火烧掉，把钱夺过来，埋到岛上吓人的地方，让鬼怪守着。他们还会杀掉船上的所有人，逼那些人走跳板。”
        - id: ch04-b22
          speaker: joe
          text: “他们还会把女人带回岛上。女人是不杀的。”
        - id: ch04-b23
          speaker: tom
          text: “对，他们不杀女人，因为他们太高尚了。而且，那些女人总是很漂亮。”
        - id: ch04-b24
          speaker: joe
          text: “海盗的衣服才叫神气呢！全是金子、银子，还有钻石！”
          emotion: happy
        - id: ch04-b25
          speaker: huck
          text: “谁的衣服？”
        - id: ch04-b26
          speaker: joe
          text: “当然是海盗的。”
        - id: ch04-b27
          speaker: narrator
          text: 哈克低头看看自己的衣服，神情一下变得愁苦。
        - id: ch04-b28
          speaker: huck
          text: “我这身恐怕不配当海盗。可我只有这几件破衣裳。”
          emotion: sad
        - id: ch04-b29
          speaker: narrator
          text: 另外两个男孩告诉他，等冒险开始，好衣服很快就会有。他们叫哈克放心，刚起步时穿这身破烂也能凑合。虽说有钱的海盗按规矩一入行就该备齐体面的行头，他眼下也不必着急。
    - id: ch05
      title: 良心来访
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 说话声慢慢低了下去，睡意爬上了几个小流浪汉的眼皮。烟斗从血手的指间滑落。哈克问心无愧，又实在疲倦，很快就沉沉睡着。海上煞星和黑衣复仇者却没这么容易入睡。
        - id: ch05-b02
          speaker: narrator
          text: 汤姆和乔躺着在心里祷告。这里没有能管教他们的人，自然也没人逼他们跪下来大声背诵。其实，他们真想连祷告也一起免掉。可两人又不敢放肆到这个地步，怕上天突然降下一道专门劈他们的雷。
        - id: ch05-b03
          speaker: narrator
          text: 转眼间，他们已经来到睡眠的边缘，眼看就要掉进去。偏偏有个不速之客赶来了，任凭他们怎么撵也不肯走。这个客人就是良心。
        - id: ch05-b04
          speaker: narrator
          text: 两个男孩开始隐隐害怕，觉得离家出走也许做错了。接着，他们又想起偷来的肉，真正的折磨这才来了。他们试着跟良心讲道理，说自己以前偷过几十次糖果和苹果。可这点站不住脚的辩解，怎么也哄不好良心。
        - id: ch05-b05
          speaker: narrator
          text: 到最后，一个顽固的事实怎么也绕不过去。拿糖果，只能算顺手牵羊。可拿咸猪肉和火腿这样的贵重东西，就是明明白白的偷窃。《圣经》里偏偏有一条诫命，不许人偷东西。
        - id: ch05-b06
          speaker: narrator
          text: 于是，他们暗暗发誓，只要还当海盗，就绝不能再用偷窃的罪行玷污自己的海盗事业。良心终于答应暂时休战。这两个矛盾得出奇的海盗，也总算安安稳稳地睡着了。
