  chapters:
    - id: ch01
      title: CHAPTER XIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Tom had made up his mind. He was gloomy and desperate. He told himself he was a friendless boy whom nobody loved. Someday, when everyone learned what they had driven him to, they might be sorry. He had tried to behave and get along, but they would not let him. If they wanted him gone, then he would go, and they could blame him for what followed. A friendless boy had no right to complain. They had forced him into it at last. He would live a life of crime. He had no other choice.
        - id: ch01-b02
          speaker: narrator
          text: By then, Tom was far down Meadow Lane. The school bell reached him faintly, calling the children inside. He began to sob when he thought he would never hear that familiar sound again. It was hard, but this life had been forced on him. Since they had driven him into the cold world, he would accept it. He forgave them all, and then he cried harder than ever.
        - id: ch01-b03
          speaker: narrator
          text: At that moment, he met his sworn friend Joe Harper. Joe looked grim, and he plainly had a dark purpose of his own. Here were two boys thinking the very same thing. Tom wiped his eyes on his sleeve. Through his tears, he explained that he meant to escape the cruel treatment and lack of sympathy at home. He would wander through the wide world and never return. He only hoped Joe would remember him.
        - id: ch01-b04
          speaker: narrator
          text: But Joe had come looking for Tom to make the same request. His mother had whipped him for drinking cream he had never even tasted. Clearly, she was tired of him and wanted him gone. If that was how she felt, he would give in. He hoped she would be happy and never regret sending her poor boy into the heartless world to suffer and die.
        - id: ch01-b05
          speaker: narrator
          text: The boys walked along in sorrow and made a new agreement. They would stand by each other as brothers and never part until death freed them from their troubles. Then they began to plan their new lives. Joe wanted to become a hermit. He would hide in a distant cave, live on crusts, and someday die from cold, hunger, and grief. Tom explained that a life of crime had some much more noticeable advantages. After hearing him out, Joe gave up the hermit plan and agreed to become a pirate.
        - id: ch01-b06
          speaker: narrator
          text: Three miles below St. Petersburg, the Mississippi was a little over a mile wide. A long, narrow, wooded island lay there, with a shallow sandbar at its upper end. No one lived on it. It stood near the far bank, opposite a thick forest where hardly anyone lived. Jackson's Island would make the perfect meeting place. The boys chose it without once wondering whom they would rob.
        - id: ch01-b07
          speaker: narrator
          text: They found Huckleberry Finn, and he joined at once. One way of life was much the same as another to Huck, so he did not care which they chose. The three boys separated after agreeing to meet at midnight in a lonely place on the riverbank, two miles above the village. A small log raft waited there, ready for them to capture. Each boy would bring fishing hooks and lines, along with whatever food he could steal in the darkest and most mysterious fashion an outlaw could manage.
        - id: ch01-b08
          speaker: narrator
          text: Before the afternoon ended, each of them had enjoyed spreading the thrilling news that the town would hear something soon. Anyone who received this shadowy warning was told to keep quiet and wait.
        - id: ch01-b09
          speaker: narrator
          text: Around midnight, Tom arrived with a boiled ham and a few smaller things. He stopped in thick brush on a low bluff above the meeting place. Stars shone over the mighty river, which rested as still as an ocean. Tom listened. Nothing broke the silence. He gave one low, clear whistle, and an answer came from below. He whistled twice more. Each signal was answered. Then a guarded voice spoke from under the bluff.
        - id: ch01-b10
          speaker: huck
          text: "Who comes there?"
        - id: ch01-b11
          speaker: tom
          text: "Tom Sawyer, the Black Avenger of the Spanish Main. Give me your names."
        - id: ch01-b12
          speaker: huck
          text: "Huck Finn the Red-Handed."
        - id: ch01-b13
          speaker: joe_harper
          text: "And Joe Harper, the Terror of the Seas."
        - id: ch01-b14
          speaker: narrator
          text: Tom had borrowed all three titles from his favorite books.
        - id: ch01-b15
          speaker: tom
          text: "Good. Now give the countersign."
        - id: ch01-b16
          speakers: [huck, joe_harper]
          ensemble: duo
          text: "Blood!"
        - id: ch01-b17
          speaker: narrator
          text: Their two rough whispers sent the dreadful word into the brooding night. Tom rolled his ham over the edge and climbed down after it. He tore his skin and clothes on the way. A smooth, comfortable path ran under the bluff, but it offered none of the danger and difficulty a pirate prized.
        - id: ch01-b18
          speaker: narrator
          text: Joe, the Terror of the Seas, had brought a side of bacon and had nearly worn himself out carrying it. Huck Finn the Red-Handed had stolen a skillet, some half-cured tobacco leaves, and a few corn cobs for making pipes. Huck was the only one who smoked or chewed tobacco. Tom announced that no pirate voyage could begin without fire. He was right. Matches were scarcely known in those days.
        - id: ch01-b19
          speaker: narrator
          text: A large raft lay a hundred yards upriver with a fire still glowing on it. The boys crept over and took a burning chunk. They turned the errand into a grand adventure. Every so often, one hissed for silence. They would stop suddenly with fingers to their lips, then creep onward with their hands gripping imaginary dagger handles. In dark whispers, they ordered one another to stab the enemy to the hilt if he stirred, because dead men told no tales. They knew perfectly well that every raftsman was down in the village, either buying supplies or enjoying himself. Still, that was no excuse for carrying out the raid in an unpiratical way.
        - id: ch01-b20
          speaker: narrator
          text: Soon they pushed away from shore. Tom took command in the middle of the raft with folded arms and a gloomy face. Huck worked the rear oar, and Joe worked the front. Tom gave his orders in a low, stern whisper.
        - id: ch01-b21
          speaker: tom
          text: "Turn her into the wind!"
        - id: ch01-b22
          speakers: [huck, joe_harper]
          ensemble: duo
          text: "Aye-aye, sir!"
        - id: ch01-b23
          speaker: tom
          text: "Hold her steady. Steady now!"
        - id: ch01-b24
          speakers: [huck, joe_harper]
          ensemble: duo
          text: "Steady she is, sir!"
        - id: ch01-b25
          speaker: tom
          text: "Let her fall off one point!"
        - id: ch01-b26
          speakers: [huck, joe_harper]
          ensemble: duo
          text: "One point it is, sir!"
        - id: ch01-b27
          speaker: narrator
          text: The boys rowed steadily toward the middle of the river. Of course, these orders were only for style. None of them meant anything in particular.
        - id: ch01-b28
          speaker: tom
          text: "What sails is she carrying?"
        - id: ch01-b29
          speaker: huck
          text: "Courses, topsails, and flying jib, sir!"
        - id: ch01-b30
          speaker: tom
          text: "Raise the royals! Half a dozen of you, climb up there and set the foretopmast studding sail! Move lively!"
        - id: ch01-b31
          speakers: [huck, joe_harper]
          ensemble: duo
          text: "Aye-aye, sir!"
        - id: ch01-b32
          speaker: tom
          text: "Shake out the main topgallant sail! Mind the sheets and braces! Now, my hearties!"
        - id: ch01-b33
          speakers: [huck, joe_harper]
          ensemble: duo
          text: "Aye-aye, sir!"
        - id: ch01-b34
          speaker: tom
          text: "Helm down! Hard to port! Be ready when she turns! Port, men, port! Pull together! Steady now!"
        - id: ch01-b35
          speakers: [huck, joe_harper]
          ensemble: duo
          text: "Steady she is, sir!"
        - id: ch01-b36
          speaker: narrator
          text: Once the raft passed midstream, the boys pointed it the right way and rested on their oars. The river was low, and the current moved only two or three miles an hour. For the next three quarters of an hour, they scarcely spoke.
        - id: ch01-b37
          speaker: narrator
          text: The raft passed the distant town. Two or three lights glimmered beyond the wide, dim sweep of water sparkling with stars. The village slept peacefully, unaware of the enormous event taking place. Tom stood motionless with folded arms. He was taking his last look at the home of his old joys and his more recent troubles. He wished that she could see him now, far out on the wild sea, facing danger and death without fear and going to his doom with a grim smile on his lips.
        - id: ch01-b38
          speaker: narrator
          text: In his imagination, it was easy to move Jackson's Island far beyond sight of the village. So he took his final look with a heart that felt both broken and satisfied. The other pirates took their final looks too. All three stared back for so long that the current nearly carried the raft beyond any hope of reaching the island. They discovered the danger just in time, took up their oars again, and managed to correct their course.
        - id: ch01-b39
          speaker: narrator
          text: At about two in the morning, the raft struck the sandbar two hundred yards above the island. They waded back and forth until all their supplies were ashore. An old sail belonged to the raft, so they stretched it over a hollow in the bushes as a tent for the food. In good weather, the outlaws themselves would sleep in the open air.
        - id: ch01-b40
          speaker: narrator
          text: Twenty or thirty steps inside the dark forest, they built a fire against a great log. They fried bacon for supper and ate half their store of corn pone. To feast this way felt glorious and free. They were deep in an untouched forest on an unexplored, empty island, far from other people. They declared that they would never return to civilization. Flames climbed into the air, lighting their faces and casting a red glow over the tall tree trunks, shining leaves, and hanging vines of their forest temple.
        - id: ch01-b41
          speaker: narrator
          text: When the last crisp bacon and the last serving of corn pone were gone, the boys stretched out on the grass, completely satisfied. They might have chosen a cooler place, but sleeping beside a roasting campfire was too romantic to give up.
        - id: ch01-b42
          speaker: joe_harper
          text: "Isn't this grand?"
        - id: ch01-b43
          speaker: tom
          text: "It's the best! Just imagine what the other boys would say if they saw us."
        - id: ch01-b44
          speaker: joe_harper
          text: "They'd wish themselves dead to be here. Wouldn't they, Hucky?"
        - id: ch01-b45
          speaker: huck
          text: "I reckon. Anyhow, it suits me. I couldn't ask for better. Most times I don't get enough to eat, and nobody can come out here to nag me and push me around."
        - id: ch01-b46
          speaker: tom
          text: "This is the life for me. No getting up in the morning. No school, no washing, none of that foolishness. When a pirate is ashore, Joe, he doesn't have to do a thing. A hermit has to spend plenty of time praying, and being alone like that isn't any fun."
        - id: ch01-b47
          speaker: joe_harper
          text: "That's true. I never thought much about it before. Now that I've tried this, I'd much rather be a pirate."
        - id: ch01-b48
          speaker: tom
          text: "People don't think as much of hermits now as they did long ago. Everybody respects a pirate. Besides, a hermit has to sleep on the hardest ground he can find, put sackcloth and ashes on his head, and stand out in the rain, and..."
        - id: ch01-b49
          speaker: huck
          text: "Why does he put sackcloth and ashes on his head?"
        - id: ch01-b50
          speaker: tom
          text: "I don't know. He has to, that's all. Hermits always do. You'd have to do it if you were one."
        - id: ch01-b51
          speaker: huck
          text: "I'll be darned if I would."
        - id: ch01-b52
          speaker: tom
          text: "Then what would you do?"
        - id: ch01-b53
          speaker: huck
          text: "I don't know, but I wouldn't do that."
        - id: ch01-b54
          speaker: tom
          text: "You'd have to, Huck. How would you get out of it?"
        - id: ch01-b55
          speaker: huck
          text: "I wouldn't put up with it. I'd run away."
        - id: ch01-b56
          speaker: tom
          text: "Run away? You'd make a mighty sorry hermit. Why, you'd be a disgrace."
        - id: ch01-b57
          speaker: narrator
          text: Huck the Red-Handed did not answer. He had better things to do. He had hollowed out a corn cob, fitted a weed stem into it, and filled it with tobacco. Now he held a coal to the tobacco and blew out a sweet-smelling cloud of smoke. He looked perfectly content. Tom and Joe envied this grand habit and secretly decided to learn it soon. After a while, Huck spoke.
        - id: ch01-b58
          speaker: huck
          text: "What do pirates have to do?"
        - id: ch01-b59
          speaker: tom
          text: "They have a wonderful time. They capture ships and burn them. They take the money and bury it in dreadful places on their island, with ghosts and things guarding it. Then they kill everyone aboard by making them walk the plank."
        - id: ch01-b60
          speaker: joe_harper
          text: "They carry the women back to the island. They don't kill them."
        - id: ch01-b61
          speaker: tom
          text: "No, pirates are too noble to kill women. And the women are always beautiful."
        - id: ch01-b62
          speaker: joe_harper
          text: "And pirates wear the finest clothes you ever saw, all covered in gold and silver and diamonds!"
        - id: ch01-b63
          speaker: huck
          text: "Who does?"
        - id: ch01-b64
          speaker: joe_harper
          text: "The pirates, of course."
        - id: ch01-b65
          speaker: narrator
          text: Huck looked sadly over his own clothes.
        - id: ch01-b66
          speaker: huck
          text: "I reckon these clothes aren't fit for a pirate, but they're the only ones I've got."
          emotion: sad
        - id: ch01-b67
          speaker: narrator
          text: Tom and Joe assured him that fine clothes would come soon enough once their adventures began. They made Huck understand that his poor rags would do perfectly well at the start, even if rich pirates usually set out with a proper wardrobe already on their backs.
        - id: ch01-b68
          speaker: narrator
          text: Their talk slowly faded, and the three young outcasts grew drowsy. Huck's pipe slipped from his fingers. Tired and free from any worry about his conscience, he fell asleep. Joe, the Terror of the Seas, and Tom, the Black Avenger, had a harder time. They silently said their prayers while lying down. No one with authority was there to order them onto their knees and make them recite the words aloud. In truth, they were tempted to skip the prayers altogether. But they feared that going quite that far might bring a sudden thunderbolt down from heaven, meant especially for them.
        - id: ch01-b69
          speaker: narrator
          text: The two boys reached the very edge of sleep when something refused to leave them alone. It was their consciences. First came the uneasy thought that they might have done wrong by running away from home. Then they remembered the meat they had stolen, and that was when the real torment began.
        - id: ch01-b70
          speaker: narrator
          text: They tried to reason their guilt away. After all, they had taken candy and apples dozens of times. But their consciences would not accept such a weak excuse. In the end, the stubborn truth remained. Taking treats was only hooking them. Taking bacon, ham, and other valuable food was simply stealing, and the Bible had a command against that.
        - id: ch01-b71
          speaker: narrator
          text: So each boy silently promised that, as long as he stayed a pirate, he would never again spoil piracy with the crime of stealing. At last, their consciences agreed to a truce, and these strangely inconsistent pirates fell peacefully asleep.
