audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    becky:
      display_name: 贝琪·撒切尔
      tts:
        delivery: 明快热情，犹豫时略带迟疑
        timbre: 清脆的少女声
        pace: 轻快
        pitch: 中高音
    tom:
      display_name: 汤姆
      tts:
        delivery: 聪明好胜，兴奋时语速加快，害怕时压低声音
        timbre: 清亮的少年声
        pace: 轻快灵活
        pitch: 中高音
    villager_1:
      display_name: 村民甲
      tts:
        delivery: 热心直率，激动时放声高喊
        timbre: 洪亮的成年男声
        pace: 明快
        pitch: 中音
    villager_2:
      display_name: 村民乙
      tts:
        delivery: 朴实热烈，情绪来得直接
        timbre: 明亮的成年女声
        pace: 明快
        pitch: 中高音
    villager_3:
      display_name: 村民丙
      tts:
        delivery: 爽朗有力，欢呼时充满喜悦
        timbre: 厚实的成年男声
        pace: 稍快
        pitch: 中低音
    boatman:
      display_name: 船夫
      tts:
        delivery: 质朴爽直，带着半信半疑
        timbre: 粗粝的成年男声
        pace: 适中
        pitch: 中低音
    judge_thatcher:
      display_name: 撒切尔法官
      tts:
        delivery: 稳重亲切，遇事果断
        timbre: 沉稳的成年男声
        pace: 从容
        pitch: 中低音
    family_friend:
      display_name: 法官的朋友
      tts:
        delivery: 随和风趣，玩笑中带着关心
        timbre: 温和的成年男声
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第三十二章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 星期二下午慢慢熬到黄昏，圣彼得堡村还沉在悲伤里。两个孩子依然没有找到。公开的祈祷举行过了，私下里更不知有多少人拿出整颗心为他们祈祷，可山洞里始终没有好消息。多数人已经放弃搜寻，回去做自己的营生。他们认定，两个孩子再也找不到了。
        - id: ch01-b02
          speaker: narrator
          text: 撒切尔太太病得很重，常常神志不清。她一声声呼唤女儿，又抬起头，整整听上一分钟，最后呻吟着把头放下。听见的人无不心碎。波莉姨妈也陷在忧郁里，一头灰发几乎全白了。星期二晚上，整个村庄就这样凄凄凉凉地睡去。
        - id: ch01-b03
          speaker: narrator
          text: 到了半夜，村里的钟突然疯狂地响起来。转眼间，衣服还没穿好的男女老少全冲上街，激动得发狂。
        - id: ch01-b04
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: 都出来！快出来！找到啦！两个孩子找到啦！
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: 铁皮锅敲起来，号角也吹起来。全村人汇在一起，朝河边涌去。他们迎面看见汤姆和贝琪坐着敞篷马车回来，拉车的村民也在一路欢呼。人群立刻围上去，跟着马车往家走，又浩浩荡荡地冲上大街，一声接一声地欢呼，仿佛永远也喊不够。
        - id: ch01-b06
          speaker: narrator
          text: 家家户户点亮了灯，谁也不肯再去睡觉。这是小镇从来没有过的盛大夜晚。最初半个钟头里，村民排着队走进撒切尔法官家。他们抱住两个死里逃生的孩子，亲了又亲，再紧紧握住撒切尔太太的手。他们想说点什么，却一个字也说不出来，只能一路流着泪离开。
        - id: ch01-b07
          speaker: narrator
          text: 波莉姨妈已经幸福得别无所求。撒切尔太太也差不多，只等派出去的信使赶到山洞，把喜讯告诉还在里面搜寻的丈夫，她的幸福也就圆满了。
        - id: ch01-b08
          speaker: narrator
          text: 汤姆躺在沙发上，周围挤满了急着听故事的人，大家全都急切地听得入了神。他讲起这场奇妙的历险，当然还添了不少惊心动魄的情节。他说，自己把贝琪留在原处，独自去探路。前两条通道，他都走到风筝线放尽才折回。第三条也是一样，可就在他要回头时，远处忽然露出一个像天光的小亮点。
        - id: ch01-b09
          speaker: tom
          text: 我马上丢下风筝线，摸着黑朝那边爬。那里有个小洞，我把头和肩膀挤出去一看，外面就是宽阔的密西西比河！
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: 要是当时正好是夜里，汤姆就看不见那点光，也不会继续探那条通道了。他赶回去告诉贝琪，贝琪却叫他别再拿这种事烦她。她累透了，知道自己快死了，也情愿就这样死去。汤姆费尽口舌，不停劝她，终于说动她跟自己走。贝琪一路摸索到能亲眼看见那一点蓝光的地方，欢喜得差点支撑不住。
        - id: ch01-b11
          speaker: tom
          text: 我先从洞口钻出去，再把贝琪拉出来。我们坐在外面，高兴得只会哭。后来有几个男人划着小船过来，我赶紧叫住他们，告诉他们我们困在洞里，已经饿坏了。
        - id: ch01-b12
          speaker: boatman
          text: 这怎么可能？这里顺着河往下，离山洞所在的山谷足足有五英里呢！
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: 那些人起先不信这个离奇的故事，后来还是把两个饥肠辘辘的孩子接上船，划到一户人家，给他们吃了晚饭。两人又在那里歇了很久，一直休息到天黑以后两三个钟头，才被送回村里。
        - id: ch01-b14
          speaker: narrator
          text: 天还没亮，人们顺着撒切尔法官和几名搜寻者留在身后的细绳，在洞里找到了他们，把喜讯送到他们耳边。
        - id: ch01-b15
          speaker: narrator
          text: 可在山洞里挨过三天三夜的劳累和饥饿，哪能立刻恢复。星期三和星期四，汤姆和贝琪一直躺在床上，反而一天比一天疲惫憔悴。星期四，汤姆勉强能走几步。星期五，他已经去了镇中心。到星期六，他几乎全好了。贝琪却直到星期日才走出房门，看上去像刚熬过一场折磨人的大病。
        - id: ch01-b16
          speaker: narrator
          text: 汤姆听说哈克病了，星期五便去看他，可人家不许他进卧室。星期六和星期日也一样。后来他每天都能进去，却必须答应不谈自己的历险，也不说任何叫人激动的事。道格拉斯寡妇一直守在旁边，看他有没有照办。
        - id: ch01-b17
          speaker: narrator
          text: 汤姆还在家里听说了卡迪夫山上的事。那个“衣衫褴褛的人”的尸体，后来在渡口附近的河里找到了。他大概是逃跑时淹死的。
        - id: ch01-b18
          speaker: narrator
          text: 汤姆获救大约两个星期以后，又动身去看哈克。这时候哈克已经壮实多了，足以听些惊险的事。汤姆觉得，自己正有一件事能让他感兴趣。去哈克家要经过撒切尔法官家，汤姆便先停下来看看贝琪。法官和几位朋友引他说起这段经历，其中一个人故意拿山洞逗他。
        - id: ch01-b19
          speaker: family_friend
          text: 汤姆，你还想再进一趟山洞吗？
        - id: ch01-b20
          speaker: tom
          text: 我想，再去一趟也没什么。
        - id: ch01-b21
          speaker: judge_thatcher
          text: 汤姆，我相信像你这样想的人还不少。不过这件事已经解决了。往后再也不会有人在那个山洞里迷路。
        - id: ch01-b22
          speaker: tom
          text: 为什么？
        - id: ch01-b23
          speaker: judge_thatcher
          text: 两个星期前，我叫人给那扇大门包上了锅炉铁皮，又上了三道锁。钥匙全在我手里。
        - id: ch01-b24
          speaker: narrator
          text: 汤姆的脸唰地一下，白得像纸。
        - id: ch01-b25
          speaker: judge_thatcher
          text: 孩子，你怎么了？快来个人，拿一杯水！
          emotion: surprised
        - id: ch01-b26
          speaker: narrator
          text: 水拿来了，有人把它泼到汤姆脸上。
        - id: ch01-b27
          speaker: judge_thatcher
          text: 好了，这下没事了。汤姆，你刚才到底怎么了？
        - id: ch01-b28
          speaker: tom
          text: 法官，印第安乔还在山洞里！
          emotion: fearful
