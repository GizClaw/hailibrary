audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry sense of humor
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
    tom:
      display_name: Tom
      tts:
        delivery: quick, bold, and mischievous
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    huck:
      display_name: Huckleberry Finn
      tts:
        delivery: wary, rough-edged, and plainspoken
        timbre: light and scruffy
        pace: uneven and quick when alarmed
        pitch: medium-high
    aunt_polly:
      display_name: Aunt Polly
      tts:
        delivery: firm and loving, with deep feeling close beneath the surface
        timbre: warm and mature
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER X
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Tom and Huck ran toward the village without a word. Horror drove them on. Every few moments they looked over their shoulders, afraid someone might be following. Each stump beside the path seemed to rise up like an enemy. When they passed the cottages outside the village, the watchdogs woke and barked, and the sound made the boys run even faster.
        - id: ch01-b02
          speaker: tom
          text: If we can just reach the old tannery before we fall! I can't keep going much longer.
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: Tom could only force out the words between breaths. Huck was panting too hard to answer. The tannery was their one hope of safety, and both boys fixed their eyes on it. They pushed themselves harder and steadily drew nearer. At last they reached the open door together, rushed inside, and dropped gratefully into the sheltering shadows. Slowly, their pounding hearts began to settle. Then Tom whispered again.
        - id: ch01-b04
          speaker: tom
          text: Huck, what do you think will happen now?
        - id: ch01-b05
          speaker: huck
          text: If Doctor Robinson dies, somebody will hang for it.
        - id: ch01-b06
          speaker: tom
          text: You really think so?
        - id: ch01-b07
          speaker: huck
          text: I know it, Tom.
        - id: ch01-b08
          speaker: narrator
          text: Tom lay thinking for a while before he spoke.
        - id: ch01-b09
          speaker: tom
          text: Who's going to tell what happened? Us?
        - id: ch01-b10
          speaker: huck
          text: Are you crazy? What if Injun Joe didn't hang after all? He'd kill us sooner or later. You know he would.
          emotion: fearful
        - id: ch01-b11
          speaker: tom
          text: That's exactly what I was thinking, Huck.
        - id: ch01-b12
          speaker: huck
          text: If anybody tells, let Muff Potter do it, if he's fool enough. He's drunk most of the time anyway.
        - id: ch01-b13
          speaker: narrator
          text: Tom said nothing. He kept turning the matter over in his mind. After a moment, he whispered again.
        - id: ch01-b14
          speaker: tom
          text: But Muff Potter doesn't know what happened. How could he tell?
        - id: ch01-b15
          speaker: huck
          text: Why wouldn't he know?
        - id: ch01-b16
          speaker: tom
          text: He'd just been hit on the head when Injun Joe did it. Do you think he could see anything then? Do you think he knew what was happening?
        - id: ch01-b17
          speaker: huck
          text: By hokey, you're right, Tom!
          emotion: surprised
        - id: ch01-b18
          speaker: tom
          text: And maybe that blow killed him too.
        - id: ch01-b19
          speaker: huck
          text: No, that isn't likely. He had liquor in him. I could tell, and he always does. When my pap is full, you could hit him over the head with a church and it wouldn't bother him. He says so himself. Muff Potter must be the same. Now, if a man was stone sober, a blow like that might kill him. I don't know.
        - id: ch01-b20
          speaker: narrator
          text: Another thoughtful silence passed.
        - id: ch01-b21
          speaker: tom
          text: Hucky, are you sure you can keep quiet about this?
        - id: ch01-b22
          speaker: huck
          text: Tom, we have to. You know that. If we said one word and they didn't hang that devil, he'd drown us like a pair of cats. We need to swear to each other. That's the only way. We have to swear we'll never tell.
          emotion: fearful
        - id: ch01-b23
          speaker: tom
          text: I agree. That's best. Should we hold hands and swear that we—
        - id: ch01-b24
          speaker: huck
          text: No, that won't do for something like this. Holding hands is for little everyday things, especially with girls. They might get mad and blab afterward. Something this big has to be written down. And it needs blood.
        - id: ch01-b25
          speaker: narrator
          text: The idea thrilled Tom through and through. It was deep, dark, and terrible, and it fit the hour and the ruined place perfectly. In the moonlight, he found a clean pine shingle. He pulled a small piece of red marking chalk from his pocket and bent over his work. Slowly and painfully, he wrote. His tongue pressed between his teeth on every downward stroke, then loosened on every stroke back up.
        - id: ch01-b26
          speaker: tom
          text: Huck Finn and Tom Sawyer swear they will keep quiet about this. If they ever tell, they wish they may drop dead in their tracks and rot.
        - id: ch01-b27
          speaker: narrator
          text: Huck admired Tom's writing and thought the words were magnificent. He pulled a pin from his lapel and started to prick himself, but Tom stopped him.
        - id: ch01-b28
          speaker: tom
          text: Wait! Don't use that. The pin is brass. It might have verdigris on it.
        - id: ch01-b29
          speaker: huck
          text: What's verdigris?
        - id: ch01-b30
          speaker: tom
          text: Poison. That's what it is. Swallow some once, and you'll find out.
        - id: ch01-b31
          speaker: narrator
          text: Tom unwound the thread from one of his needles. Each boy pricked the soft part of his thumb and squeezed out a drop of blood. It took a great deal of squeezing, but Tom finally signed his initials with the tip of his little finger. Then he showed Huck how to make an H and an F. The oath was finished. They buried the shingle beside the wall, adding gloomy ceremonies and mysterious words. As far as they were concerned, their tongues were chained, locked, and the key was gone.
        - id: ch01-b32
          speaker: narrator
          text: Just then, a figure slipped quietly through a break at the far end of the ruined building. The boys never saw it.
        - id: ch01-b33
          speaker: huck
          text: Tom, does that oath mean we can never tell? Not ever?
        - id: ch01-b34
          speaker: tom
          text: Of course. No matter what happens, we have to keep quiet. We'd drop dead if we told. Don't you know that?
        - id: ch01-b35
          speaker: huck
          text: Yes, I reckon that's true.
        - id: ch01-b36
          speaker: narrator
          text: They whispered on for a little while. Then a dog began a long, mournful howl just outside the tannery, no more than ten feet away. The boys grabbed each other in terror.
        - id: ch01-b37
          speaker: huck
          text: Which one of us is he howling for?
          emotion: fearful
        - id: ch01-b38
          speaker: tom
          text: I don't know. Look through the crack. Hurry!
          emotion: fearful
        - id: ch01-b39
          speaker: huck
          text: No, you look, Tom!
          emotion: fearful
        - id: ch01-b40
          speaker: tom
          text: I can't. I can't do it, Huck!
          emotion: fearful
        - id: ch01-b41
          speaker: huck
          text: Please, Tom. There it goes again!
          emotion: fearful
        - id: ch01-b42
          speaker: tom
          text: Oh, thank goodness! I know that voice. It's Bull Harbison.
        - id: ch01-b43
          speaker: narrator
          text: Bull Harbison was the dog's name. That was why Tom called him Bull Harbison, rather than Harbison's Bull.
        - id: ch01-b44
          speaker: huck
          text: That's a relief. I was nearly scared to death. I'd have bet anything it was a stray dog.
        - id: ch01-b45
          speaker: narrator
          text: The dog howled once more, and the boys' hearts dropped again.
        - id: ch01-b46
          speaker: huck
          text: Oh, no. That isn't Bull Harbison! Please look, Tom!
          emotion: fearful
        - id: ch01-b47
          speaker: narrator
          text: Tom shook with fear, but he gave in and put his eye to the crack. When he spoke, his whisper was barely a sound.
        - id: ch01-b48
          speaker: tom
          text: Huck, it is a stray dog!
          emotion: fearful
        - id: ch01-b49
          speaker: huck
          text: Quick! Who is he howling for?
          emotion: fearful
        - id: ch01-b50
          speaker: tom
          text: It must be both of us. We're lying right together.
          emotion: fearful
        - id: ch01-b51
          speaker: huck
          text: Then we're done for, Tom. I know where I'm going when I die. I've been so wicked.
          emotion: fearful
        - id: ch01-b52
          speaker: tom
          text: Oh, blast it! This is what comes from skipping school and doing everything a boy is told not to do. I could've been good like Sid if I'd tried. But no, of course I wouldn't. If I escape this time, I'll spend all my time in Sunday school!
          emotion: fearful
        - id: ch01-b53
          speaker: narrator
          text: Tom began to sniffle.
        - id: ch01-b54
          speaker: huck
          text: You think you're bad? Tom Sawyer, you're as good as pie beside me. Oh, I wish I'd had even half the chance you had.
          emotion: sad
        - id: ch01-b55
          speaker: narrator
          text: Huck began to sniffle too. Then Tom stopped himself and whispered.
        - id: ch01-b56
          speaker: tom
          text: Look, Hucky! The dog's back is turned toward us!
          emotion: surprised
        - id: ch01-b57
          speaker: narrator
          text: Huck looked, and joy rushed into his heart.
        - id: ch01-b58
          speaker: huck
          text: It is! Was he facing away before?
          emotion: happy
        - id: ch01-b59
          speaker: tom
          text: Yes, he was. I was a fool and never noticed. This is wonderful! Now who can he be howling for?
          emotion: happy
        - id: ch01-b60
          speaker: narrator
          text: The howling stopped. Tom listened sharply.
        - id: ch01-b61
          speaker: tom
          text: Shh! What's that sound?
        - id: ch01-b62
          speaker: huck
          text: It sounds like hogs grunting. No, wait. Somebody's snoring, Tom.
        - id: ch01-b63
          speaker: tom
          text: You're right! Where is it coming from?
        - id: ch01-b64
          speaker: huck
          text: I think it's down at the other end. It sounds that way. Pap used to sleep there sometimes with the hogs, but you should hear him snore. He nearly lifts things off the ground. Besides, I don't reckon he'll ever come back to this town.
        - id: ch01-b65
          speaker: narrator
          text: Their fear began to give way to the old hunger for adventure.
        - id: ch01-b66
          speaker: tom
          text: Hucky, would you dare go closer if I lead the way?
        - id: ch01-b67
          speaker: huck
          text: I don't much like the idea. What if it's Injun Joe?
          emotion: fearful
        - id: ch01-b68
          speaker: narrator
          text: Tom's courage failed for a moment. Then curiosity grew stronger again. The boys agreed to try, but if the snoring stopped, they would run. One behind the other, they crept down the building on tiptoe. Five steps from the sleeping man, Tom stepped on a stick. It broke with a sharp snap. The man moaned and twisted a little. As he moved, his face came into the moonlight. It was Muff Potter.
        - id: ch01-b69
          speaker: narrator
          text: When he moved, the boys felt their hearts stop. Once they recognized him, their fear passed. They slipped through the broken boards and went a short distance before stopping to say good-bye. Then the same long, sorrowful howl rose into the night. They turned. The stray dog stood only a few feet from Potter, facing him with its nose pointed toward the sky.
        - id: ch01-b70
          speakers: [tom, huck]
          ensemble: duo
          text: Oh, my! It's him!
          emotion: surprised
        - id: ch01-b71
          speaker: huck
          text: Tom, people say a stray dog howled around Johnny Miller's house near midnight about two weeks ago. That same evening, a whippoorwill flew in, landed on the railing, and sang. But nobody there has died yet.
        - id: ch01-b72
          speaker: tom
          text: I know. But what does that prove? Didn't Gracie Miller fall into the kitchen fire the very next Saturday and get burned terribly?
        - id: ch01-b73
          speaker: huck
          text: Yes, but she didn't die. She's getting better, too.
        - id: ch01-b74
          speaker: tom
          text: Just wait. She's going to die as surely as Muff Potter is. That's what the enslaved people say, and they know all about signs like this, Huck.
        - id: ch01-b75
          speaker: narrator
          text: The boys parted, each deep in thought.
        - id: ch01-b76
          speaker: narrator
          text: By the time Tom climbed through his bedroom window, the night was almost over. He took extraordinary care not to make a sound as he undressed. Then he went to sleep, pleased that nobody knew about his secret adventure. He had no idea that Sid had been awake for an hour, lying there and snoring softly.
        - id: ch01-b77
          speaker: narrator
          text: When Tom woke, Sid was already dressed and gone. The daylight looked late, and even the air seemed to say that morning had nearly passed. Tom jumped in alarm. Why had no one called him, then nagged him until he got up, as they always did? He knew that could mean trouble. In five minutes he was dressed and downstairs, sore and sleepy.
        - id: ch01-b78
          speaker: narrator
          text: The family still sat at the table, though breakfast was over. No one scolded him. Instead, they looked away. The room was quiet and solemn, and a chill went through Tom. He sat down and tried to act cheerful. No one smiled or answered. Soon he fell silent too, and his heart sank as low as it could go.
        - id: ch01-b79
          speaker: narrator
          text: After breakfast, Aunt Polly took him aside. For a moment, Tom almost felt hopeful. He thought she meant to whip him. But she began to cry.
        - id: ch01-b80
          speaker: aunt_polly
          text: Tom, how could you go off and break my old heart this way? Go on, then. Ruin yourself. Bring my gray hairs down to the grave with sorrow. There's no use in my trying anymore.
          emotion: sad
        - id: ch01-b81
          speaker: narrator
          text: Her grief hurt worse than a thousand whippings. Tom's heart ached more than his body ever could. He cried and begged her to forgive him. Again and again, he promised to change his ways. At last she sent him away. He had won only an uncertain forgiveness, and he could tell that Aunt Polly had little faith in his promises.
        - id: ch01-b82
          speaker: narrator
          text: Tom left her too miserable even to be angry with Sid, so Sid's quick escape through the back gate was unnecessary. Tom dragged himself to school, gloomy and heartsick. He and Joe Harper were whipped for skipping school the day before, but Tom accepted the punishment as if it were nothing. His heart was busy with far heavier troubles.
        - id: ch01-b83
          speaker: narrator
          text: He went to his seat, planted his elbows on the desk, rested his chin in his hands, and stared at the wall. His face had the hard, empty look of someone who believed he could suffer no more. One elbow pressed against something solid. A long time passed before he shifted sadly and picked it up with a sigh.
        - id: ch01-b84
          speaker: narrator
          text: The object was wrapped in paper. Tom opened it. Then came one enormous, endless sigh, and his heart broke. It was his brass andiron knob.
        - id: ch01-b85
          speaker: narrator
          text: That final little sorrow was more than Tom could bear.
