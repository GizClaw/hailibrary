audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    huck:
      display_name: 哈克贝利
      tts:
        delivery: 随性粗放，满不在乎又笃定
        timbre: 略沙哑的少年声
        pace: 松快
        pitch: 中音
  chapters:
    - id: ch01
      title: 逃进旧鞣皮场
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 两个男孩吓得说不出话，只顾朝村子狂奔。他们一会儿就回头看一眼，总觉得有人正追在身后。路上的树桩冷不丁冒出来，每一截都像拦路的人，像等着他们的仇敌，吓得他们喘不过气。快到村边时，几座偏僻农舍里的看门狗也被惊醒了，冲着他们汪汪狂吠。他们越怕，脚下跑得越快。
        - id: ch01-b02
          speaker: tom
          text: “只要能赶到旧鞣皮场，别先累倒就行。我可撑不了多久了。”
        - id: ch01-b03
          speaker: narrator
          text: 哈克只剩下沉重的喘气声，根本说不出一句话。两人把旧鞣皮场当成唯一的救命地方，眼睛死死盯着它，低下头拼命往前冲。那扇开着的门越来越近。终于，他们肩并肩闯进去，一起倒进遮住他们的黑影里。这时，他们又庆幸，又筋疲力尽。等急促的心跳慢慢平复，汤姆才压低声音开口。
        - id: ch01-b04
          speaker: tom
          text: “哈克贝利，这件事最后会怎么样？”
        - id: ch01-b05
          speaker: huck
          text: “罗宾逊医生要是死了，凶手就得上绞架。”
        - id: ch01-b06
          speaker: tom
          text: “你真敢肯定？”
        - id: ch01-b07
          speaker: huck
          text: “不是敢不敢，我知道准会这样。”
        - id: ch01-b08
          speaker: narrator
          text: 汤姆没有马上回答。他躺在那里想了一会儿，才问谁会把真相讲出去。难道要他们两个去告发印第安·乔吗？
        - id: ch01-b09
          speaker: huck
          text: “你疯啦？万一出了差错，印第安·乔没有被绞死，他迟早会把咱们杀掉。这个准错不了。”
          emotion: fearful
        - id: ch01-b10
          speaker: tom
          text: “我刚才想的也是这个。”
        - id: ch01-b11
          speaker: huck
          text: “真要有人说，就让莫夫·波特自己说吧，只要他傻到肯开口。他反正老是喝醉。”
        - id: ch01-b12
          speaker: narrator
          text: 汤姆没有接话，仍旧一个人琢磨。过了一会儿，他才提醒哈克，波特根本不知道发生了什么。印第安·乔下刀的时候，波特才刚被坟头木牌打倒。他既看不见，也没有知觉，自然说不出真正的凶手是谁。
        - id: ch01-b13
          speaker: huck
          text: “哎呀，对啊！他什么也不知道。”
        - id: ch01-b14
          speaker: tom
          text: “而且那一下说不定已经把他打死了。”
        - id: ch01-b15
          speaker: huck
          text: “不会。他肚子里全是酒。我爹喝醉以后，你拿一座教堂砸他的脑袋，他都不在乎。他自己就是这么说的。波特准也一样。要是换成没喝酒的人，那可就说不定了。”
        - id: ch01-b16
          speaker: narrator
          text: 两人又安静下来，各自在黑暗里反复想着这件事。过了好一阵，汤姆才叫了声“哈克”，问他是不是真的能把嘴闭紧，永远不说出去。
        - id: ch01-b17
          speaker: huck
          text: “咱们非守住不可。要是让印第安·乔知道了，他淹死咱俩，就跟淹死两只猫一样容易。汤姆，咱们得互相发誓，谁也不许说。”
          emotion: fearful
        - id: ch01-b18
          speaker: tom
          text: “好，这主意最好。咱们握着手发誓……”
        - id: ch01-b19
          speaker: huck
          text: “那可不够。这又不是鸡毛蒜皮的小事，也不是跟女孩子闹着玩。女孩子一生气，转头就会把秘密说出去。像这样的事，得写下来，还得用血。”
        - id: ch01-b20
          speaker: narrator
          text: 汤姆从头到脚都赞成这个主意。用文字和血发誓，又深沉，又阴暗，又可怕，正配得上此刻的时辰、刚才发生的事和四周的破屋。他从月光里捡起一片干净的松木瓦，又从口袋掏出一小块红石笔。为了看清楚，他挪了挪木瓦，让月光落在上面。每向下写一笔，他都用牙齿紧紧夹住舌头，笔尖往上走时才放松。
        - id: ch01-b21
          speaker: narrator
          text: 他写下誓言。哈克·费恩和汤姆·索亚绝不泄露这件事。谁要是说出去，就让谁当场倒下，死掉，烂掉。
        - id: ch01-b22
          speaker: narrator
          text: 哈克佩服极了，马上拔下衣襟上的别针，要刺破手指。
        - id: ch01-b23
          speaker: tom
          text: “等等，别用黄铜别针。上面可能长着铜绿。”
        - id: ch01-b24
          speaker: huck
          text: “铜绿是什么？”
        - id: ch01-b25
          speaker: tom
          text: “是毒药。你吞一点，就知道厉害了。”
        - id: ch01-b26
          speaker: narrator
          text: 汤姆从自己的一根针上解下缠着的线。两个男孩分别刺破拇指肚，各挤出一滴血。可那点血不够写字，他们只好挤了又挤。汤姆用小指肚当笔，总算签下姓名的首字母，又一点点教哈克写出 H 和 F。誓约终于完成。他们把木瓦埋在靠墙的地方，举行了几样阴森的仪式，还郑重其事地念了咒语。从这一刻起，他们的舌头就像被镣铐锁住，连钥匙也已经扔得无影无踪。
        - id: ch01-b27
          speaker: narrator
          text: 就在这时，一个人影从破屋另一头悄悄爬进来。两个男孩完全没有发现。
    - id: ch02
      title: 野狗的预兆
      blocks:
        - id: ch02-b01
          speaker: huck
          text: “汤姆，发过这个誓以后，不管过多久，咱们都不能说吗？”
        - id: ch02-b02
          speaker: tom
          text: “当然。以后不管出什么事，都得闭紧嘴。不然咱们会倒地死掉，这你知道。”
        - id: ch02-b03
          speaker: huck
          text: “嗯，准是这样。”
        - id: ch02-b04
          speaker: narrator
          text: 他们还是压着声音，又谈了一小会儿。突然，破屋外面响起一阵漫长又悲凉的狗嗥。那条狗离他们不到十英尺。两个男孩痛苦地吓作一团，谁也没顾上逞强，猛地伸手抱紧了对方。
        - id: ch02-b05
          speaker: huck
          text: “它说咱们当中的谁要死？”
          emotion: fearful
        - id: ch02-b06
          speaker: tom
          text: “不知道。快从墙缝里看看！”
        - id: ch02-b07
          speaker: huck
          text: “你看，汤姆！”
        - id: ch02-b08
          speaker: tom
          text: “我不敢，我做不到！”
          emotion: fearful
        - id: ch02-b09
          speaker: huck
          text: “求你了。听，它又叫了！”
        - id: ch02-b10
          speaker: tom
          text: “谢天谢地，我认得这声音。是布尔·哈比森。”
        - id: ch02-b11
          speaker: narrator
          text: 这里的叫法还有一点讲究。假如布尔是哈比森先生的奴隶，汤姆会说“哈比森家的布尔”。可布尔若是他的儿子或他的狗，就得叫“布尔·哈比森”。
        - id: ch02-b12
          speaker: huck
          text: “那就好！我刚才真快吓死了，还以为那是一条野狗。”
        - id: ch02-b13
          speaker: narrator
          text: 狗又嗥了一声。两个男孩才放下的心，立刻又沉了下去。
        - id: ch02-b14
          speaker: huck
          text: “不对，那不是布尔·哈比森！汤姆，你快看看！”
          emotion: fearful
        - id: ch02-b15
          speaker: narrator
          text: 汤姆浑身发抖，还是把眼睛贴到墙缝上。他的声音轻得几乎听不见。
        - id: ch02-b16
          speaker: tom
          text: “哈克，真是野狗！”
          emotion: fearful
        - id: ch02-b17
          speaker: huck
          text: “那它说谁要死？快告诉我！”
        - id: ch02-b18
          speaker: tom
          text: “准是咱们两个。咱俩挨得这么近。”
        - id: ch02-b19
          speaker: huck
          text: “这回咱们没救了。我以后会去什么地方，也一点悬念都没有。我干过的坏事太多啦。”
          emotion: fearful
        - id: ch02-b20
          speaker: tom
          text: “都怪我逃学，还专做别人不许做的事。我本来可以学锡德，当个好孩子，可我偏偏不肯。这次要是能活下来，我以后天天泡在主日学校里！”
          emotion: fearful
        - id: ch02-b21
          speaker: narrator
          text: 汤姆说到后来，忍不住抽起鼻子。哈克也跟着呜咽起来。他觉得汤姆哪里算得上坏，跟自己放在一起，汤姆简直就是一块人人都爱的香馅饼。哈克一连叫了三声老天爷，只盼自己也能有汤姆一半的指望。
        - id: ch02-b22
          speaker: tom
          text: “哈克，快看！它拿背对着咱们呢！”
          emotion: surprised
        - id: ch02-b23
          speaker: narrator
          text: 哈克赶紧看过去，心里一下亮堂起来。
        - id: ch02-b24
          speaker: huck
          text: “真的！它刚才也背对着咱们吗？”
        - id: ch02-b25
          speaker: tom
          text: “一直都是。可我吓傻了，竟没想到这一点。太好了！那它到底是对着谁叫呢？”
    - id: ch03
      title: 月光下的莫夫·波特
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 狗不叫了。汤姆竖起耳朵，又听见一阵怪声。
        - id: ch03-b02
          speaker: huck
          text: “像猪在哼哼。不对，是有人打鼾。”
        - id: ch03-b03
          speaker: tom
          text: “没错！哈克，声音从哪儿来的？”
        - id: ch03-b04
          speaker: huck
          text: “我看是破屋另一头。我爹从前也在那里跟猪一起睡。不过他一打鼾，像能把屋顶掀起来。再说，他大概不会回这个镇子了。”
        - id: ch03-b05
          speaker: narrator
          text: 两个男孩的冒险劲儿又回来了。汤姆问哈克，如果自己带头，他敢不敢过去。
        - id: ch03-b06
          speaker: huck
          text: “我不太想去。万一那人是印第安·乔呢？”
        - id: ch03-b07
          speaker: narrator
          text: 汤姆听见印第安·乔的名字，立刻也泄了气。可没过多久，那股想冒险的劲儿又涌上来。两人终于商量好，过去试一试，只要鼾声一停，他们马上转身逃跑。于是，他们一前一后，踮着脚偷偷向破屋另一头挪去。离打鼾的人只剩五步时，汤姆踩到一根树枝，“啪”的一声把它折断了。那个人呻吟起来，身子也扭了扭，脸正好转进月光里。原来是莫夫·波特。
        - id: ch03-b08
          speaker: narrator
          text: 波特刚动时，两个男孩的心像是停了，刚刚升起的希望也一起停了。等他们认出这张脸，恐惧才散去。两人继续踮着脚，从破裂的外墙板间钻到外面，走出一小段路，停下来互道临别的话。就在这时，那阵漫长又悲凉的狗嗥再次升入夜空。他们回头一看，那条陌生的狗就站在波特躺卧处几英尺外，正面对着他，鼻子笔直指向天空。
        - id: ch03-b09
          speakers: [tom, huck]
          ensemble: duo
          text: “原来它说的是他！”
          emotion: surprised
        - id: ch03-b10
          speaker: huck
          text: “汤姆，两星期前的半夜，也有野狗在约翰尼·米勒家旁边叫。当天晚上还有一只夜鹰飞进他家，落在楼梯栏杆上唱。可他家到现在也没人死。”
        - id: ch03-b11
          speaker: tom
          text: “这我知道。可接下来的星期六，格雷西·米勒不是掉进厨房的火里，烧得很重吗？”
        - id: ch03-b12
          speaker: huck
          text: “可她没死呀，而且已经好起来了。”
        - id: ch03-b13
          speaker: tom
          text: “你等着瞧吧。她还是没救，莫夫·波特也一样。黑人都这么说。这类事，他们全懂。”
        - id: ch03-b14
          speaker: narrator
          text: 两个男孩一边想着这些不祥的预兆，一边分头回家。汤姆从卧室窗口爬进去时，漫长的夜已经快要过去。他脱衣服时小心得过了头，生怕弄出一点声音。躺下以后，他很快睡着了，心里还在庆幸，谁也不知道自己夜里偷偷溜出去过。可他没有想到，旁边那个正在轻轻打鼾的锡德其实醒着，而且已经醒了整整一个钟头。
    - id: ch04
      title: 最后一根羽毛
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 汤姆醒来时，锡德已经穿好衣服走了。晨光看着很晚，连空气都像在告诉他，时候已经不早。他吃了一惊。平常总有人一遍遍催他起床，折腾到他非起来不可，今天怎么谁也没来？这个念头一冒出来，一种不祥的感觉便涌上心头。
        - id: ch04-b02
          speaker: narrator
          text: 不到五分钟，他便穿好衣服下了楼，浑身酸痛，还困得睁不开眼。一家人仍坐在餐桌旁，早餐却已经吃完。没有熟悉的责骂声，大家只是避开他的目光。整间屋子安静得异样，人人都显得十分严肃。这种气氛像一股寒气，直钻进这个闯祸孩子的心里，比责骂更叫他害怕。
        - id: ch04-b03
          speaker: narrator
          text: 汤姆坐下来，拼命装出快活的样子。可这件事实在太难，他再怎么努力，也换不来一张笑脸、一句回应。他只好收起那副快活模样，也跟着沉默下来，任凭一颗心越沉越深。
        - id: ch04-b04
          speaker: narrator
          text: 早餐以后，波莉姨妈把他叫到一边。汤姆竟然几乎高兴起来，因为他盼着姨妈抽他一顿。可是姨妈没有动鞭子，只望着他掉泪。她问汤姆，怎么忍心这样伤透她这颗年老的心。说到最后，她叫汤姆只管继续胡闹，只管毁掉自己，再让她带着满头白发和满心悲伤走进坟墓吧。她已经尽了力，再怎么操心也没有用了。
        - id: ch04-b05
          speaker: narrator
          text: 这些话比一千顿鞭子都厉害。汤姆的心比身上还疼。他哭了起来，苦苦求姨妈原谅，一遍又一遍保证以后一定改好。姨妈最后让他走了，可他明白，自己只得到了一份勉勉强强的原谅，姨妈对他的信任也只回来了一点点，弱得经不起再碰一下。
        - id: ch04-b06
          speaker: narrator
          text: 汤姆难受极了，连找锡德报复的心思都没有。所以，锡德抢先从后门躲出去，实在是白费力气。
        - id: ch04-b07
          speaker: narrator
          text: 他愁眉苦脸地来到学校。因为昨天逃学，他和乔·哈帕一起挨了鞭子。可汤姆心里压着更大的痛苦，这顿打根本算不了什么。
        - id: ch04-b08
          speaker: narrator
          text: 他回到座位，把两只胳膊肘撑在课桌上，双手托住下巴，一动不动地瞪着墙。那双眼睛像石头一样。只有一个人痛苦到了极处，已经再也承受不了更多痛苦时，才会有这样的眼神。
        - id: ch04-b09
          speaker: narrator
          text: 他的一只胳膊肘抵到了什么硬东西。汤姆过了很久才缓慢地挪开身子。他叹着气，把那个东西拿起来。外面包着一张纸。他一层层打开纸，又发出一声漫长、拖沓、无比沉重的叹息。这一回，他的心彻底碎了。纸里包着的，正是他那颗黄铜壁炉柴架头。
        - id: ch04-b10
          speaker: narrator
          text: 这最后一根羽毛，终于压断了骆驼的脊梁。
