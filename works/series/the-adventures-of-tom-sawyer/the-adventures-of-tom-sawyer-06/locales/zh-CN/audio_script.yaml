audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    sid:
      display_name: 锡德
      tts:
        delivery: 规矩认真，遇事容易慌张
        timbre: 清脆稚嫩
        pace: 中等偏快
        pitch: 中高音
    aunt_polly:
      display_name: 波莉姨妈
      tts:
        delivery: 慈爱直率，责备里带着心疼
        timbre: 温厚略显苍老
        pace: 中等
        pitch: 中低音
    huck:
      display_name: 哈克贝利
      tts:
        delivery: 随性粗放，满不在乎又笃定
        timbre: 略沙哑的少年声
        pace: 松快
        pitch: 中音
    first_boy:
      display_name: 割破手指的男孩
      tts:
        delivery: 逞强不服气
        timbre: 清亮稚嫩
        pace: 中等偏快
        pitch: 中高音
    second_boy:
      display_name: 另一个男孩
      tts:
        delivery: 爽快爱起哄
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    teacher:
      display_name: 老师
      tts:
        delivery: 严厉刻板，训斥时威严十足
        timbre: 干硬低沉
        pace: 中等偏慢
        pitch: 低音
    becky:
      display_name: 贝琪
      tts:
        delivery: 天真矜持，好奇时轻快亲切
        timbre: 清甜稚嫩
        pace: 中等偏快
        pitch: 高音
  chapters:
    - id: ch01
      title: 装病与拔牙
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 星期一早晨，汤姆·索亚又愁得不行。学校里漫长的一周就要开始，慢吞吞的苦刑正等着他。到了这一天，他甚至觉得，还不如从来没有放过假。尝过假日里自由的滋味，再回去像囚犯一样受管束、戴镣铐，反而更加难熬。
        - id: ch01-b02
          speaker: narrator
          text: 汤姆躺在床上翻来覆去地琢磨，忽然盼着自己生一场病，好躲过上学。他把全身仔细检查了一遍，什么毛病也没有，只好再查一次。好不容易觉得肚子有点绞痛，他便满怀希望，暗暗使劲想把症状弄得严重些。谁知那点痛越来越轻，很快就彻底没了。接着，他发现上排有颗门牙松了，本想马上哼起来，拿它当个开场，又怕姨妈干脆把牙拔掉，那一定很疼，只好先把它留作后手。
        - id: ch01-b03
          speaker: narrator
          text: 他又找了好一阵，还是一无所获。后来，他记起医生说过一种病，能让人在床上躺两三个星期，还可能烂掉一根手指。汤姆赶紧从被单下面伸出那根疼脚趾，举到眼前仔细察看。虽然根本不知道这种病该有什么症状，他还是觉得值得冒险一试，立刻精神十足地呻吟起来。
        - id: ch01-b04
          speaker: narrator
          text: 锡德睡得一点知觉也没有。汤姆越哼越响，竟觉得脚趾真的疼起来，可锡德还是没反应。他卖力哼了半天，累得直喘，只好歇一会儿，再鼓足气，送出一连串精彩的呻吟。锡德照旧打鼾。
        - id: ch01-b05
          speaker: narrator
          text: 汤姆恼了，一边喊锡德，一边推了他几下。锡德总算打着哈欠醒来，撑起胳膊肘盯着汤姆。汤姆见这一招有效，又哼个不停。
        - id: ch01-b06
          speaker: sid
          text: “汤姆！喂，汤姆！醒醒啊！你怎么了？”
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: 锡德摇着汤姆，焦急地看他的脸。
        - id: ch01-b08
          speaker: tom
          text: “哎，别碰我，锡德，也别晃我。”
        - id: ch01-b09
          speaker: sid
          text: “你到底怎么了？我得去叫姨妈。”
        - id: ch01-b10
          speaker: tom
          text: “别去，不用管我。也许过一会儿就好了，别叫人来。”
        - id: ch01-b11
          speaker: sid
          text: “我非叫不可！汤姆，你别这么哼，听着太吓人了。你疼多久了？”
          emotion: fearful
        - id: ch01-b12
          speaker: tom
          text: “好几个钟头了。哎哟！锡德，别乱动，你会害死我的。”
        - id: ch01-b13
          speaker: sid
          text: “你怎么不早点叫醒我？哎呀，别再这样了，我听得浑身发麻。汤姆，你究竟怎么了？”
          emotion: fearful
        - id: ch01-b14
          speaker: tom
          text: “锡德，我原谅你。你以前对我做过什么，我全都原谅了。等我死了……”
        - id: ch01-b15
          speaker: sid
          text: “汤姆，你不会真要死吧？求你别这样。也许……”
          emotion: fearful
        - id: ch01-b16
          speaker: tom
          text: “我也原谅所有的人。你替我告诉他们。还有，把我的窗框和那只独眼猫送给新搬来的那个姑娘，再告诉她……”
        - id: ch01-b17
          speaker: narrator
          text: 锡德没等他说完，抓起衣服就跑了。汤姆的想象力实在太好，这会儿倒真的受起罪来，连呻吟都越来越像真的。
        - id: ch01-b18
          speaker: sid
          text: “波莉姨妈，快来！汤姆要死了！”
          emotion: fearful
        - id: ch01-b19
          speaker: aunt_polly
          text: “要死了？”
          emotion: surprised
        - id: ch01-b20
          speaker: sid
          text: “是啊，别耽搁，快来呀！”
          emotion: fearful
        - id: ch01-b21
          speaker: aunt_polly
          text: “胡说八道，我才不信！”
        - id: ch01-b22
          speaker: narrator
          text: 嘴上虽这么说，她还是冲上楼，锡德和玛丽紧紧跟着。波莉姨妈脸色发白，嘴唇直抖，一到床边就喘着气追问汤姆。
        - id: ch01-b23
          speaker: aunt_polly
          text: “汤姆，你这是怎么了？孩子，你到底哪儿不舒服？”
          emotion: fearful
        - id: ch01-b24
          speaker: tom
          text: “姨妈，我那根疼脚趾烂掉了！”
        - id: ch01-b25
          speaker: narrator
          text: 老太太一下跌坐在椅子里，先笑，接着哭，后来索性一边哭一边笑。等她终于缓过劲来，才开口说话。
        - id: ch01-b26
          speaker: aunt_polly
          text: “汤姆，你差点吓死我。行了，别胡闹了，快下床。”
        - id: ch01-b27
          speaker: narrator
          text: 汤姆马上不哼了，脚趾也不疼了。他有点难为情，只好另找理由。
        - id: ch01-b28
          speaker: tom
          text: “波莉姨妈，它刚才真的像烂了，疼得我连牙都顾不上。”
        - id: ch01-b29
          speaker: aunt_polly
          text: “你的牙？牙又怎么了？”
        - id: ch01-b30
          speaker: tom
          text: “有一颗松了，疼得要命。”
        - id: ch01-b31
          speaker: aunt_polly
          text: “好了，可别又哼起来。把嘴张开。嗯，牙确实松了，可这要不了你的命。玛丽，拿根丝线来，再去厨房取一块烧红的木炭。”
        - id: ch01-b32
          speaker: tom
          text: “求你了，姨妈，别拔。现在一点也不疼了。要是还疼，我就永远不动一下。求求你，我不想留在家里逃学。”
          emotion: fearful
        - id: ch01-b33
          speaker: aunt_polly
          text: “哦，你不想，是吗？闹了这么久，原来是想逃学去钓鱼！汤姆，我这么疼你，你却总用这些淘气事来伤我的心。”
        - id: ch01-b34
          speaker: narrator
          text: 拔牙的东西已经备好了。波莉姨妈把丝线一头系紧汤姆的牙，另一头拴在床柱上。接着，她抓起火炭，猛地送到汤姆脸前。下一刻，那颗牙已经挂在床柱上晃来晃去了。
    - id: ch02
      title: 死猫、咒语和扁虱
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 不过，磨难总会带来一点补偿。早饭后，汤姆走在上学路上，碰到的男孩都羡慕他。上排牙齿有了缺口，他就能用一种新奇又了不起的方式吐唾沫，一群孩子跟在后面看得津津有味。
        - id: ch02-b02
          speaker: narrator
          text: 先前有个男孩割破了手指，一直是大家惊叹的中心，现在却连一个拥护者也没有了。他心里很不好受，表面上偏要装出一副不屑的样子。
        - id: ch02-b03
          speaker: first_boy
          text: “像汤姆·索亚那样吐唾沫，根本没什么了不起。”
        - id: ch02-b04
          speaker: second_boy
          text: “哈，吃不着葡萄，就说葡萄酸！”
        - id: ch02-b05
          speaker: narrator
          text: 那位失去所有拥护者和往日荣光的英雄，再也装不出那份轻蔑，只好心情沉重、落落寡欢地走开。
        - id: ch02-b06
          speaker: narrator
          text: 不久，汤姆碰见了哈克贝利·费恩。哈克是镇上醉鬼的儿子，也是村里的小弃儿。母亲们恨他、怕他，因为他懒散、粗野、无法无天，更因为她们的孩子偏偏都仰慕他，恨不得也有胆量活得像他一样。汤姆也羡慕哈克那种自由自在的流浪生活。大人越不许他跟哈克玩，他一有机会越要去玩。
        - id: ch02-b07
          speaker: narrator
          text: 哈克总穿着大人丢掉的旧衣服，破布条迎风乱飘。他的帽子像一片巨大的废墟，帽檐缺了宽宽一块。外套几乎垂到脚后跟，裤子只靠一根背带吊着，裤裆空荡荡地坠下来。裤腿破成了穗子，要是不卷起，就会拖进泥里。
        - id: ch02-b08
          speaker: narrator
          text: 哈克想来就来，想走就走。天晴睡门阶，下雨睡空猪油桶。他不用上学，也不用去教堂，不必听任何人的话。想钓鱼、游泳就去，想待多久都行。他可以打架，可以熬夜，春天最早光脚，秋天最晚穿鞋，从来不洗澡，也不换干净衣服，连骂人都精彩极了。圣彼得堡那些处处受管束的体面男孩都觉得，人生里最宝贵的东西，哈克一样也不缺。
        - id: ch02-b09
          speaker: tom
          text: “嘿，哈克贝利！”
        - id: ch02-b10
          speaker: huck
          text: “你也嘿一个，自己尝尝滋味。”
        - id: ch02-b11
          speaker: tom
          text: “你手里拿的是什么？”
        - id: ch02-b12
          speaker: huck
          text: “一只死猫。”
        - id: ch02-b13
          speaker: tom
          text: “给我瞧瞧。嚯，都硬了！你从哪儿弄来的？”
        - id: ch02-b14
          speaker: huck
          text: “跟一个男孩买的。”
        - id: ch02-b15
          speaker: tom
          text: “你拿什么换的？”
        - id: ch02-b16
          speaker: huck
          text: “一张蓝票，还有一个从屠宰场弄来的猪膀胱。”
        - id: ch02-b17
          speaker: tom
          text: “那张蓝票又是从哪儿来的？”
        - id: ch02-b18
          speaker: huck
          text: “两个星期前，我拿一根滚铁环的棍子跟本·罗杰斯换的。”
        - id: ch02-b19
          speaker: tom
          text: “哈克，死猫能拿来干什么？”
        - id: ch02-b20
          speaker: huck
          text: “还能干什么？治疣子啊。”
        - id: ch02-b21
          speaker: tom
          text: “真的能治？我知道一个更好的办法。”
        - id: ch02-b22
          speaker: huck
          text: “我敢说你不知道。什么办法？”
        - id: ch02-b23
          speaker: tom
          text: “用腐木桩里的水。”
        - id: ch02-b24
          speaker: huck
          text: “腐木桩水？白送我都不要。”
        - id: ch02-b25
          speaker: tom
          text: “你还嫌弃？你试过吗？”
        - id: ch02-b26
          speaker: huck
          text: “没有，可鲍勃·坦纳试过。”
        - id: ch02-b27
          speaker: tom
          text: “这是谁告诉你的？”
        - id: ch02-b28
          speaker: huck
          text: “鲍勃告诉杰夫·撒切尔，杰夫告诉约翰尼·贝克，约翰尼告诉吉姆·霍利斯，吉姆告诉本·罗杰斯，本又告诉一个黑人，最后那个黑人告诉了我。这下听明白了吧！”
        - id: ch02-b29
          speaker: tom
          text: “那又能说明什么？他们全会撒谎。那个黑人我不认识，先不算他，可我从没见过不撒谎的黑人。呸！你还是说说，鲍勃·坦纳到底怎么弄的。”
        - id: ch02-b30
          speaker: huck
          text: “他把手伸进一个烂树桩，里面正好积着雨水。”
        - id: ch02-b31
          speaker: tom
          text: “他是白天去的吗？”
        - id: ch02-b32
          speaker: huck
          text: “当然。”
        - id: ch02-b33
          speaker: tom
          text: “脸朝着树桩？”
        - id: ch02-b34
          speaker: huck
          text: “对吧，至少我想是这样。”
        - id: ch02-b35
          speaker: tom
          text: “他念什么了吗？”
        - id: ch02-b36
          speaker: huck
          text: “应该没有。我也不知道。”
        - id: ch02-b37
          speaker: tom
          text: “哈！他连法子都弄错了，腐木桩水怎么可能管用？你得一个人走进树林正中央，找到一截积着腐水的烂树桩。正好半夜时，背对树桩，把手猛地插进去，还要念，大麦粒，大麦粒，玉米糠。腐桩水，腐桩水，疣子吞光光。”
        - id: ch02-b38
          speaker: tom
          text: “念完以后闭上眼睛，赶紧往前走十一步，再原地转三圈，然后一路回家。谁也不能理，只要一开口，咒语就破了。”
        - id: ch02-b39
          speaker: huck
          text: “嗯，这办法听着不错。不过鲍勃·坦纳肯定不是这么做的。”
        - id: ch02-b40
          speaker: tom
          text: “那当然！要是他真懂，怎么还会是镇上疣子最多的男孩？我用这个法子去掉过成千上万个疣子。我总跟青蛙玩，手上老长一大堆。有时候，我也用豆子治。”
        - id: ch02-b41
          speaker: huck
          text: “对，豆子确实好使，我用过。”
        - id: ch02-b42
          speaker: tom
          text: “真的？你怎么用？”
        - id: ch02-b43
          speaker: huck
          text: “先把豆子掰成两半，再割破疣子，挤出一点血，抹在半颗豆子上。等到没有月亮的黑夜，差不多半夜时去十字路口挖个坑，把沾血的半颗埋进去，再烧掉另一半。埋下去的那半颗就会拼命吸，想把另一半吸回来，血也会把疣子往外吸。过不了多久，疣子就掉了。”
        - id: ch02-b44
          speaker: tom
          text: “没错，就是这么办。可埋的时候再说一句，豆子下去，疣子离开，再也别来把我害，那就更灵了。乔·哈帕就是这么做的。他去过浣熊村，还去过差不多所有地方呢。可是死猫又怎么治疣子？”
        - id: ch02-b45
          speaker: huck
          text: “差不多半夜时，你拿着猫去墓地，得找一个埋着坏人的地方。半夜一到，就会来一个魔鬼，也许两个，也许三个。你看不见他们，只能听到像风一样的声音，说不定还能听见他们说话。等他们来拖尸首，你就把死猫扔过去，念，魔鬼跟尸首，死猫跟魔鬼，疣子跟死猫，从此别缠我！这样什么疣子都能治掉。”
        - id: ch02-b46
          speaker: tom
          text: “听着很有道理。你试过吗？”
        - id: ch02-b47
          speaker: huck
          text: “还没有，不过霍普金斯老婆婆告诉我的。”
        - id: ch02-b48
          speaker: tom
          text: “那准是真的。大家都说她是女巫。”
        - id: ch02-b49
          speaker: huck
          text: “什么叫大家说？我知道她就是女巫。她给我爹下过咒，我爹亲口说的。有一天他从她旁边经过，亲眼看见她在下咒，便捡起一块石头。要不是她躲得快，早被砸中了。就在那天晚上，我爹喝醉后躺在棚顶上，一翻身摔下来，把胳膊摔断了。”
        - id: ch02-b50
          speaker: tom
          text: “哎呀，那真吓人。他怎么知道她在下咒？”
          emotion: fearful
        - id: ch02-b51
          speaker: huck
          text: “老天，我爹一眼就看得出来。他说，要是有人直勾勾盯着你，就是在给你下咒。嘴里还念念有词，那就更没错了，因为他们念的是倒过来的《主祷文》。”
        - id: ch02-b52
          speaker: tom
          text: “小哈克，你打算什么时候用这只猫？”
        - id: ch02-b53
          speaker: huck
          text: “今晚。我猜他们今晚会来带走老霍斯·威廉斯。”
        - id: ch02-b54
          speaker: tom
          text: “可他星期六就埋了。他们星期六夜里没来吗？”
        - id: ch02-b55
          speaker: huck
          text: “瞧你说的！不到半夜，法术怎么使得出来？可过了半夜就是星期日。我看魔鬼星期日不会到处乱跑。”
        - id: ch02-b56
          speaker: tom
          text: “这一层我倒没想到。你说得对。让我也跟你去吧？”
        - id: ch02-b57
          speaker: huck
          text: “当然可以，只要你不害怕。”
        - id: ch02-b58
          speaker: tom
          text: “我才不怕。你会学猫叫吗？”
        - id: ch02-b59
          speaker: huck
          text: “会啊。你要是有机会，也得回我一声。上次你让我在外面喵了半天，老海斯拿石头砸我，还骂我是该死的猫。我就扔了块砖，砸破他家的窗户。你可别说出去。”
        - id: ch02-b60
          speaker: tom
          text: “我不会说。那晚姨妈一直盯着我，我没法学猫叫。这回一定叫。喂，那是什么？”
        - id: ch02-b61
          speaker: huck
          text: “没什么，一只扁虱。”
        - id: ch02-b62
          speaker: tom
          text: “你从哪儿弄来的？”
        - id: ch02-b63
          speaker: huck
          text: “树林里。”
        - id: ch02-b64
          speaker: tom
          text: “你要什么才肯换？”
        - id: ch02-b65
          speaker: huck
          text: “不知道，我不想换。”
        - id: ch02-b66
          speaker: tom
          text: “那算了，反正小得可怜。”
        - id: ch02-b67
          speaker: huck
          text: “哼，不是自己的东西，当然随便挑毛病。我觉得它挺好，这只扁虱对我来说够好了。”
        - id: ch02-b68
          speaker: tom
          text: “嗐，扁虱多得是。只要我想要，一千只都能弄来。”
        - id: ch02-b69
          speaker: huck
          text: “那你怎么不去弄？因为你心里明白，根本弄不到。这只出来得够早的，是我今年见过的第一只。”
        - id: ch02-b70
          speaker: tom
          text: “哈克，我拿这颗牙跟你换。”
        - id: ch02-b71
          speaker: huck
          text: “先让我看看。”
        - id: ch02-b72
          speaker: narrator
          text: 汤姆掏出一小片纸，一层层小心打开。哈克眼巴巴看着那颗牙，实在抵挡不住诱惑。
        - id: ch02-b73
          speaker: huck
          text: “这是真牙？”
        - id: ch02-b74
          speaker: narrator
          text: 汤姆掀起嘴唇，让哈克看那个缺口。
        - id: ch02-b75
          speaker: huck
          text: “那好，成交。”
        - id: ch02-b76
          speaker: narrator
          text: 汤姆把扁虱装进火帽盒。那里不久前还关着“大夹虫”。两个男孩各自走开，都觉得自己比刚才更富有了。
    - id: ch03
      title: 迟到的供认
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 汤姆来到那座孤零零的木板校舍，大步走进去，装得像是一路拼命赶来，一点也没耽搁。他把帽子挂上木钉，利落地扑到座位上。老师高高坐在宽大的篾条底扶手椅里。学生们念书的声音昏昏沉沉，嗡嗡响个不停，他听着听着已经打起瞌睡。汤姆弄出的动静把他惊醒了。
        - id: ch03-b02
          speaker: teacher
          text: “托马斯·索亚！”
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: 汤姆很清楚，只要有人连名带姓叫他，准没好事。
        - id: ch03-b04
          speaker: tom
          text: “先生！”
        - id: ch03-b05
          speaker: teacher
          text: “到这儿来。好啊，先生，你怎么又迟到了？”
        - id: ch03-b06
          speaker: narrator
          text: 汤姆正要随口编个谎话，忽然看见两条长长的金色辫子垂在一个熟悉的背后。他立刻认出，那正是叫他心里发亮的女孩。更巧的是，她旁边正好空着女生座位里唯一的一个位置。汤姆马上改了主意。
        - id: ch03-b07
          speaker: tom
          text: “我在路上停下来，跟哈克贝利·费恩说话了！”
        - id: ch03-b08
          speaker: narrator
          text: 老师像是连脉搏都停了，只能瞪着汤姆。教室里的读书声一下断掉，学生们都怀疑这个胆大包天的傻瓜是不是疯了。
        - id: ch03-b09
          speaker: teacher
          text: “你……你刚才说，你做了什么？”
          emotion: surprised
        - id: ch03-b10
          speaker: tom
          text: “我停下来跟哈克贝利·费恩说话。”
        - id: ch03-b11
          speaker: narrator
          text: 这回谁都听得清清楚楚。
        - id: ch03-b12
          speaker: teacher
          text: “托马斯·索亚，这是我这辈子听过最惊人的供认。这样的过错，光用戒尺可不够。把外衣脱掉。”
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: 老师挥着胳膊抽打，直到自己累了，手边那捆细枝也明显少了许多，才终于停手。
        - id: ch03-b14
          speaker: teacher
          text: “现在，先生，去跟女生坐。也好让你记住这个教训。”
        - id: ch03-b15
          speaker: narrator
          text: 教室里响起一阵窃笑。汤姆低着头，看起来像是羞得抬不起脸。其实，他更多是敬畏那位还不知道名字的偶像，又因为这份天大的好运又怕又喜。他在松木长凳的一端坐下，女孩一甩头，往旁边挪了挪。四周的学生互相碰胳膊、挤眼睛、说悄悄话，汤姆却把双臂放在那张又长又矮的课桌上，一动不动，装作专心看书。
    - id: ch04
      title: 石板上的秘密
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 过了一阵，大家不再留意汤姆，教室里又响起平常那种沉闷的读书声。没多久，他开始偷看身旁的女孩。女孩发现后，朝他做了个鬼脸，把后脑勺转过来足足一分钟。等她小心地再转回来，面前已经多了一只桃子。
        - id: ch04-b02
          speaker: narrator
          text: 她把桃子推开，汤姆轻轻放回去。她又推了一次，不过敌意已经少了。汤姆耐心地再次送回原处，这一回，她让桃子留了下来。汤姆在写字石板上写，请收下吧，我还有呢。女孩看了一眼，没有反应。
        - id: ch04-b03
          speaker: narrator
          text: 汤姆又在石板上画起来，用左手遮住自己的作品。起初，女孩硬是不理他，可她越来越好奇，想偷看的心思从一个个几乎察觉不到的小动作里露了出来。汤姆只管画，假装什么也没发现，也不让她看出自己早已注意到了。她终于忍不住了，犹犹豫豫地小声开口。
        - id: ch04-b04
          speaker: becky
          text: “让我看看嘛。”
        - id: ch04-b05
          speaker: narrator
          text: 汤姆只掀开一部分。那幅画难看得不得了，画的是一幢两头都有山墙的房子，烟囱里还冒着一绺打转的烟。可女孩立刻被它吸引，别的事全忘了。等汤姆画完，她盯着看了一会儿。
        - id: ch04-b06
          speaker: becky
          text: “画得真好。再画一个人吧。”
        - id: ch04-b07
          speaker: narrator
          text: 这位画家便在前院立起一个人。那人像一架起重机，一步就能跨过整幢房子。女孩一点也不挑剔，对这个怪物十分满意。
        - id: ch04-b08
          speaker: becky
          text: “这个人真漂亮。现在再画一个我，让我朝他走过去。”
        - id: ch04-b09
          speaker: narrator
          text: 汤姆画了一个沙漏，上面顶着一轮满月，四肢全是稻草秆，张开的手指还举着一把大得吓人的扇子。
        - id: ch04-b10
          speaker: becky
          text: “太好看了。我要是也会画就好了。”
        - id: ch04-b11
          speaker: tom
          text: “这很容易，我来教你。”
        - id: ch04-b12
          speaker: becky
          text: “真的？你什么时候教我？”
        - id: ch04-b13
          speaker: tom
          text: “中午。你回家吃饭吗？”
        - id: ch04-b14
          speaker: becky
          text: “你留下来，我就留下来。”
        - id: ch04-b15
          speaker: tom
          text: “好，说定了。你叫什么名字？”
        - id: ch04-b16
          speaker: becky
          text: “贝琪·撒切尔。你呢？哦，我知道，你叫托马斯·索亚。”
        - id: ch04-b17
          speaker: tom
          text: “只有他们要揍我时，才那么叫我。我乖的时候就叫汤姆。你也叫我汤姆，好吗？”
        - id: ch04-b18
          speaker: becky
          text: “好。”
        - id: ch04-b19
          speaker: narrator
          text: 汤姆又在石板上写了几个字，还用手遮着。贝琪这回不再装矜持，一个劲儿求他给自己看。
        - id: ch04-b20
          speaker: tom
          text: “哎呀，没写什么。”
        - id: ch04-b21
          speaker: becky
          text: “一定写了。”
        - id: ch04-b22
          speaker: tom
          text: “真的没有。你不会想看的。”
        - id: ch04-b23
          speaker: becky
          text: “我想看，真的想看。求你让我看看嘛。”
        - id: ch04-b24
          speaker: tom
          text: “你会告诉别人。”
        - id: ch04-b25
          speaker: becky
          text: “我不会，真的真的不会。我发双倍的誓，绝对不说。”
        - id: ch04-b26
          speaker: tom
          text: “谁也不告诉？只要你还活着，就永远不说？”
        - id: ch04-b27
          speaker: becky
          text: “对，我永远不告诉任何人。快让我看吧。”
        - id: ch04-b28
          speaker: tom
          text: “哎呀，你根本就不想看！”
        - id: ch04-b29
          speaker: becky
          text: “你越是这样，我越要看。”
        - id: ch04-b30
          speaker: narrator
          text: 贝琪把小手按到汤姆手上，两个人轻轻争夺起来。汤姆装得像在拼命抵抗，手却一点点松开，最后露出几个字，我爱你。
        - id: ch04-b31
          speaker: becky
          text: “哎呀，你这个坏东西！”
          emotion: happy
        - id: ch04-b32
          speaker: narrator
          text: 她重重拍了汤姆的手一下，脸却红了，看起来也很欢喜。
        - id: ch04-b33
          speaker: narrator
          text: 就在这时，一只手慢慢捏住汤姆的耳朵，稳稳把他提了起来。他被这样一路送回自己的座位，全班的窃笑像雨点一样落下来。老师站在他面前，阴沉地停了一会儿，什么也没说，转身回到自己的宝座。汤姆的耳朵虽火辣辣地疼，心里却欢天喜地。
        - id: ch04-b34
          speaker: narrator
          text: 教室重新安静。汤姆也真心想要用功，可心里翻腾得太厉害，怎么也定不下来。读书课上，他读得一团糟。地理课上，他把湖泊说成山，把山说成河，又把河说成大陆，简直把天地重新搅成了一片混沌。拼字课上，他连几个小娃娃都会的词也接连答错，一路从前面退到队尾，只好交出那枚已经神气活现地戴了好几个月的白镴奖章。
