  chapters:
    - id: ch01
      title: CHAPTER VI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Monday morning made Tom Sawyer miserable. It always brought the beginning of another long, slow week of suffering at school. He usually started Monday by wishing there had been no holiday at all. A taste of freedom only made going back to chains and captivity feel worse.
        - id: ch01-b02
          speaker: narrator
          text: Tom lay there thinking until it occurred to him that being sick might keep him home. That gave him a little hope. He carefully searched his whole body for an illness, found nothing, and began the search again. This time he thought he felt the beginnings of a stomachache. He encouraged it eagerly, but the symptoms weakened and soon vanished completely.
        - id: ch01-b03
          speaker: narrator
          text: Then Tom made a discovery. One of his upper front teeth was loose. That seemed like a lucky excuse, and he was ready to begin with a starter groan. Then he pictured what would happen if he brought that argument before Aunt Polly. She would pull the tooth, and that would hurt. He decided to keep it in reserve while he searched for something better.
        - id: ch01-b04
          speaker: narrator
          text: Nothing came to him for a while. Then he remembered hearing the doctor describe a certain disease. It had kept a patient in bed for two or three weeks and nearly cost the man a finger. Tom eagerly pulled his sore toe from beneath the sheet and held it up for inspection. He had no idea what symptoms went with the disease. Still, it seemed well worth the risk, so he began to groan with all his might.
        - id: ch01-b05
          speaker: narrator
          text: Sid slept through it without knowing a thing. Tom groaned louder and soon imagined that his toe really did hurt. Sid still gave no sign. By then the effort had left Tom panting. He took a rest, gathered all his strength, filled his lungs, and produced a splendid run of groans. Sid only went on snoring.
        - id: ch01-b06
          speaker: tom
          text: "Sid! Sid!"
        - id: ch01-b07
          speaker: narrator
          text: Tom shook him. That worked. As Sid yawned, stretched, and propped himself on one elbow, Tom began groaning again. Sid stared at him.
        - id: ch01-b08
          speaker: sid
          text: "Tom? Hey, Tom! Tom, what's wrong?"
        - id: ch01-b09
          speaker: narrator
          text: Sid shook him and searched his face anxiously. Tom answered with a moan.
        - id: ch01-b10
          speaker: tom
          text: "Oh, don't, Sid. Don't shake me."
        - id: ch01-b11
          speaker: sid
          text: "What's the matter? I have to call Aunt Polly."
        - id: ch01-b12
          speaker: tom
          text: "No, leave it alone. Maybe it'll pass after a while. Don't call anyone."
        - id: ch01-b13
          speaker: sid
          text: "But I have to! Please stop groaning like that. It's awful. How long have you been this way?"
          emotion: fearful
        - id: ch01-b14
          speaker: tom
          text: "Hours. Ow! Don't move the bed, Sid. You'll kill me."
        - id: ch01-b15
          speaker: sid
          text: "Why didn't you wake me? Oh, Tom, please don't! Hearing you makes my skin crawl. What's wrong with you?"
          emotion: fearful
        - id: ch01-b16
          speaker: tom
          text: "I forgive you for everything, Sid. Everything you ever did to me. When I'm gone..."
        - id: ch01-b17
          speaker: sid
          text: "You're not dying, are you, Tom? Please don't. Maybe..."
          emotion: fearful
        - id: ch01-b18
          speaker: tom
          text: "I forgive everybody. Tell them that. And give my window sash and my one-eyed cat to the new girl in town. Tell her..."
        - id: ch01-b19
          speaker: narrator
          text: Before Tom could finish, Sid snatched up his clothes and ran. Tom's imagination was working so handsomely that now he truly suffered. All those practiced groans had gathered a genuine sound of pain.
        - id: ch01-b20
          speaker: sid
          text: "Aunt Polly, come quickly! Tom's dying!"
          emotion: fearful
        - id: ch01-b21
          speaker: aunt_polly
          text: "Dying?"
          emotion: surprised
        - id: ch01-b22
          speaker: sid
          text: "Yes! Don't wait. Hurry!"
          emotion: fearful
        - id: ch01-b23
          speaker: aunt_polly
          text: "Nonsense! I don't believe it!"
        - id: ch01-b24
          speaker: narrator
          text: Still, she raced upstairs with Sid and Mary close behind. Her face went white, and her lip began to tremble. At the bed she gasped.
        - id: ch01-b25
          speaker: aunt_polly
          text: "Tom! What's the matter with you?"
          emotion: fearful
        - id: ch01-b26
          speaker: tom
          text: "Oh, Auntie, I'm..."
        - id: ch01-b27
          speaker: aunt_polly
          text: "What is it, child? Tell me what's wrong!"
          emotion: fearful
        - id: ch01-b28
          speaker: tom
          text: "Auntie, my sore toe has turned deadly!"
        - id: ch01-b29
          speaker: narrator
          text: Aunt Polly dropped into a chair. First she laughed a little, then cried a little, and then somehow did both at once. The release of all that fear restored her. When she had command of herself again, she spoke sharply.
        - id: ch01-b30
          speaker: aunt_polly
          text: "Tom, you frightened me half to death. Stop this foolishness and get out of bed."
        - id: ch01-b31
          speaker: narrator
          text: The groans stopped, and the pain in Tom's toe disappeared. Feeling rather foolish, he tried another excuse.
        - id: ch01-b32
          speaker: tom
          text: "It really felt deadly, Aunt Polly. It hurt so much that I forgot all about my tooth."
        - id: ch01-b33
          speaker: aunt_polly
          text: "Your tooth? What's wrong with it?"
        - id: ch01-b34
          speaker: tom
          text: "One is loose, and it aches terribly."
        - id: ch01-b35
          speaker: aunt_polly
          text: "Don't start groaning again. Open your mouth. Well, it is loose, but it won't kill you. Mary, bring me some silk thread and a hot coal from the kitchen."
        - id: ch01-b36
          speaker: tom
          text: "Please don't pull it, Auntie. It doesn't hurt now. I swear it doesn't. Please! I don't want to stay home from school."
          emotion: fearful
        - id: ch01-b37
          speaker: aunt_polly
          text: "Oh, now you don't want to stay home? So all this noise was meant to get you out of school and off fishing. Tom, I love you dearly, and you keep trying every possible way to break my old heart with your mischief."
        - id: ch01-b38
          speaker: narrator
          text: By then, the instruments for the operation were ready. Aunt Polly made a loop in one end of the silk thread and fastened it around Tom's tooth. She tied the other end firmly to the bedpost. Then she seized the hot coal and suddenly thrust it almost into his face. The next moment, the tooth was no longer in Tom's mouth. It hung dangling from the bedpost.
        - id: ch01-b39
          speaker: narrator
          text: Every trouble brings some reward. After breakfast, Tom headed to school and found that the gap in his upper teeth let him spit in a wonderful new way. Every boy he met envied him and wanted to see the trick again. Soon he had gathered a whole following of boys who were fascinated by the performance.
        - id: ch01-b40
          speaker: narrator
          text: Until then, a boy with a cut finger had been the center of everyone's attention and respect. Now every admirer deserted him, and all his glory was gone. His heart was heavy, though he tried to hide it under a show of scorn.
        - id: ch01-b41
          speaker: finger_boy
          text: "Spitting like Tom Sawyer isn't anything special."
        - id: ch01-b42
          speaker: teasing_boy
          text: "Sour grapes!"
        - id: ch01-b43
          speaker: narrator
          text: The former hero wandered away, stripped of his fame.
        - id: ch01-b44
          speaker: narrator
          text: Soon Tom met Huckleberry Finn, the young outcast of the village and the son of the town drunk. Every mother in town hated and feared Huck because he was idle, lawless, vulgar, and bad. Their children admired him for exactly the same reasons. They delighted in his forbidden company and wished they dared to be just like him.
        - id: ch01-b45
          speaker: narrator
          text: Like every other respectable boy, Tom envied Huck's splendid life as an outcast. He had strict orders never to play with him, so naturally he played with him whenever he had the chance. Huck wore clothes that grown men had thrown away. They were always bursting into fresh rags and fluttering around him. A great crescent-shaped piece was missing from the brim of his ruined hat. When he wore a coat, it nearly reached his heels, with the back buttons hanging far below where they belonged. One suspender held up his trousers. The empty seat sagged low, and the ragged legs dragged through the dirt unless he rolled them up.
        - id: ch01-b46
          speaker: narrator
          text: Huck came and went by his own free will. In good weather he slept on doorsteps, and in wet weather he slept in empty barrels. He had no school or church, called no one master, and obeyed nobody. He could go fishing or swimming wherever he liked and stay as long as he pleased. No one stopped him from fighting. No one told him when to go to bed. He was the first boy to go barefoot in spring and the last to put shoes back on in autumn. He never had to wash or wear clean clothes, and he could swear wonderfully. To every harassed, restricted, respectable boy in St. Petersburg, Huck had everything that made life precious.
        - id: ch01-b47
          speaker: tom
          text: "Hello, Huckleberry!"
        - id: ch01-b48
          speaker: huckleberry
          text: "Hello yourself. See how you like it."
        - id: ch01-b49
          speaker: tom
          text: "What have you got there?"
        - id: ch01-b50
          speaker: huckleberry
          text: "A dead cat."
        - id: ch01-b51
          speaker: tom
          text: "Let me see him, Huck. He's awfully stiff. Where did you get him?"
        - id: ch01-b52
          speaker: huckleberry
          text: "Bought him from a boy."
        - id: ch01-b53
          speaker: tom
          text: "What did you trade for him?"
        - id: ch01-b54
          speaker: huckleberry
          text: "A blue ticket and a bladder I got at the slaughterhouse."
        - id: ch01-b55
          speaker: tom
          text: "Where did the blue ticket come from?"
        - id: ch01-b56
          speaker: huckleberry
          text: "I gave Ben Rogers a hoop stick for it two weeks ago."
        - id: ch01-b57
          speaker: tom
          text: "Say, Huck, what can you do with a dead cat?"
        - id: ch01-b58
          speaker: huckleberry
          text: "What do you think? You cure warts with it."
        - id: ch01-b59
          speaker: tom
          text: "Really? I know something better than that."
        - id: ch01-b60
          speaker: huckleberry
          text: "I bet you don't. What is it?"
        - id: ch01-b61
          speaker: tom
          text: "Spunk-water."
        - id: ch01-b62
          speaker: huckleberry
          text: "Spunk-water? It isn't worth a darn."
        - id: ch01-b63
          speaker: tom
          text: "Oh, isn't it? Have you ever tried it?"
        - id: ch01-b64
          speaker: huckleberry
          text: "No, but Bob Tanner has."
        - id: ch01-b65
          speaker: tom
          text: "Who says so?"
        - id: ch01-b66
          speaker: huckleberry
          text: "Bob told Jeff Thatcher. Jeff told Johnny Baker. Johnny told Jim Hollis, and Jim told Ben Rogers. Ben told a Black man, and that man told me. There, now!"
        - id: ch01-b67
          speaker: tom
          text: "What does that prove? All of them lie. Well, maybe not the Black man. I don't know him. But I've never met one who wouldn't lie. Anyway, tell me how Bob Tanner tried it."
        - id: ch01-b68
          speaker: huckleberry
          text: "He dipped his hand into rainwater inside a rotten stump."
        - id: ch01-b69
          speaker: tom
          text: "In daylight?"
        - id: ch01-b70
          speaker: huckleberry
          text: "Of course."
        - id: ch01-b71
          speaker: tom
          text: "Was he facing the stump?"
        - id: ch01-b72
          speaker: huckleberry
          text: "Yes. I reckon he was."
        - id: ch01-b73
          speaker: tom
          text: "Did he say anything?"
        - id: ch01-b74
          speaker: huckleberry
          text: "I don't think so. I don't know."
        - id: ch01-b75
          speaker: tom
          text: "Aha! What a fool's way to use spunk-water. Of course it didn't work. You have to go all alone to the middle of the woods, where you know there's a stump full of spunk-water. Right at midnight, turn your back to the stump, push your hand in, and say, 'Barley-corn, barley-corn, Indian-meal shorts. Spunk-water, spunk-water, swallow these warts.' Then hurry away eleven steps with your eyes shut. Turn around three times and walk all the way home without speaking to anyone. If you say one word, the charm is broken."
        - id: ch01-b76
          speaker: huckleberry
          text: "That sounds like a good way, but Bob Tanner didn't do it like that."
        - id: ch01-b77
          speaker: tom
          text: "No, he sure didn't. He's the wartiest boy in town. If he knew how to use spunk-water, he wouldn't have one wart left. I've taken thousands off my hands that way. I play with frogs so much, I always have plenty. Sometimes I use a bean instead."
        - id: ch01-b78
          speaker: huckleberry
          text: "Beans work. I've done that."
        - id: ch01-b79
          speaker: tom
          text: "You have? What's your way?"
        - id: ch01-b80
          speaker: huckleberry
          text: "Split the bean. Cut the wart until it bleeds, and put the blood on one half. Near midnight, when the moon is dark, bury that half at the crossroads. Burn the other half. The bloody piece keeps pulling for the burned piece, and that pulls the wart right off."
        - id: ch01-b81
          speaker: tom
          text: "That's it, Huck. But it works better if you say, 'Down, bean. Off, wart. Don't ever bother me again.' Joe Harper does it that way, and he's been almost everywhere, even Coonville. But how does the dead cat cure them?"
        - id: ch01-b82
          speaker: huckleberry
          text: "Take the cat to the graveyard around midnight, after somebody wicked has been buried. When midnight comes, a devil will show up, or maybe two or three of them. You can't see them. You can only hear something like the wind, or maybe hear them talking. When they start carrying the dead man away, throw the cat after them and say, 'Devil follow corpse, cat follow devil, warts follow cat. I'm done with you!' That'll cure any wart there is."
        - id: ch01-b83
          speaker: tom
          text: "Sounds right. Have you tried it?"
        - id: ch01-b84
          speaker: huckleberry
          text: "No, but old Mother Hopkins told me."
        - id: ch01-b85
          speaker: tom
          text: "Then I reckon it's true. People say she's a witch."
        - id: ch01-b86
          speaker: huckleberry
          text: "Say, Tom, I know she is! She bewitched Pap. He said so himself. One day he caught her doing it and threw a rock. He'd have hit her if she hadn't ducked. That very night, he rolled off a shed where he was lying drunk and broke his arm."
        - id: ch01-b87
          speaker: tom
          text: "That's awful. How did he know she was bewitching him?"
        - id: ch01-b88
          speaker: huckleberry
          text: "Pap can always tell. If somebody stares at you steadily, they're bewitching you. It's even worse if they mumble, because that means they're saying the Lord's Prayer backward."
        - id: ch01-b89
          speaker: tom
          text: "When are you going to try the cat, Hucky?"
        - id: ch01-b90
          speaker: huckleberry
          text: "Tonight. I reckon they'll come for old Hoss Williams."
        - id: ch01-b91
          speaker: tom
          text: "But they buried him Saturday. Why didn't they take him Saturday night?"
        - id: ch01-b92
          speaker: huckleberry
          text: "How could the charms start before midnight? Then it was Sunday, and I don't reckon devils roam around much on Sundays."
        - id: ch01-b93
          speaker: tom
          text: "I never thought of that. You're right. Can I come?"
        - id: ch01-b94
          speaker: huckleberry
          text: "Sure, if you aren't scared."
        - id: ch01-b95
          speaker: tom
          text: "Scared? Not likely. Will you meow for me?"
        - id: ch01-b96
          speaker: huckleberry
          text: "Yes, and you meow back if you can. Last time you left me meowing until old Hays threw rocks and yelled at that cat. So I threw a brick through his window. Don't tell anybody."
        - id: ch01-b97
          speaker: tom
          text: "I won't. Aunt Polly was watching me that night, so I couldn't answer. This time I will. Say, what's that?"
        - id: ch01-b98
          speaker: huckleberry
          text: "Only a tick."
        - id: ch01-b99
          speaker: tom
          text: "Where did you find it?"
        - id: ch01-b100
          speaker: huckleberry
          text: "Out in the woods."
        - id: ch01-b101
          speaker: tom
          text: "What would you take for it?"
        - id: ch01-b102
          speaker: huckleberry
          text: "I don't know. I don't want to sell it."
        - id: ch01-b103
          speaker: tom
          text: "Fine. It's a pretty small tick anyway."
        - id: ch01-b104
          speaker: huckleberry
          text: "Anybody can make fun of a tick that belongs to somebody else. I like it. It's good enough for me."
        - id: ch01-b105
          speaker: tom
          text: "There are plenty of ticks. I could have a thousand if I wanted."
        - id: ch01-b106
          speaker: huckleberry
          text: "Then why don't you? You know you can't. This one's early. It's the first tick I've seen all year."
        - id: ch01-b107
          speaker: tom
          text: "Say, Huck, I'll trade you my tooth for it."
        - id: ch01-b108
          speaker: huckleberry
          text: "Let me see it."
        - id: ch01-b109
          speaker: narrator
          text: Tom took out a small piece of paper and carefully unwrapped the tooth. Huck examined it with longing. He clearly wanted it, and the temptation grew very strong before he finally spoke.
        - id: ch01-b110
          speaker: huckleberry
          text: "Is it real?"
        - id: ch01-b111
          speaker: narrator
          text: Tom lifted his lip and showed the empty space.
        - id: ch01-b112
          speaker: huckleberry
          text: "All right. It's a trade."
        - id: ch01-b113
          speaker: narrator
          text: Tom put the tick into the little percussion-cap box that had once held his pinchbug. Then the boys parted, each certain that he was richer than before.
        - id: ch01-b114
          speaker: narrator
          text: When Tom reached the small schoolhouse standing by itself, he marched in briskly. He wore the manner of a boy who had come with all honest speed. He hung his hat on a peg and threw himself into his seat with businesslike energy. High above the room in his great splint-bottom chair, the schoolmaster had been dozing while the sleepy hum of study lulled him. Tom's entrance woke him.
        - id: ch01-b115
          speaker: schoolmaster
          text: "Thomas Sawyer!"
        - id: ch01-b116
          speaker: narrator
          text: Tom knew that hearing his full name meant trouble.
        - id: ch01-b117
          speaker: tom
          text: "Sir?"
        - id: ch01-b118
          speaker: schoolmaster
          text: "Come here. Why are you late again, as usual?"
        - id: ch01-b119
          speaker: narrator
          text: Tom was ready to hide behind a lie. Then he noticed two long yellow braids hanging down a familiar back. Some electric sympathy of love told him at once who she was. Beside that girl stood the only empty seat on the girls' side of the room. In that instant, he threw away his safe excuse and told the truth.
        - id: ch01-b120
          speaker: tom
          text: "I stopped to talk to Huckleberry Finn!"
        - id: ch01-b121
          speaker: narrator
          text: The schoolmaster's pulse seemed to stop. He stared helplessly. The murmur of study died, and every pupil wondered whether Tom had lost his mind.
        - id: ch01-b122
          speaker: schoolmaster
          text: "You did what?"
          emotion: surprised
        - id: ch01-b123
          speaker: tom
          text: "I stopped and talked to Huckleberry Finn."
        - id: ch01-b124
          speaker: schoolmaster
          text: "Thomas Sawyer, that is the most shocking confession I have ever heard. The ruler is not enough for this offense. Take off your jacket."
        - id: ch01-b125
          speaker: narrator
          text: The schoolmaster worked his arm until it grew tired, and his supply of switches was much smaller. Then came the sentence Tom had been hoping for.
        - id: ch01-b126
          speaker: schoolmaster
          text: "Now go sit with the girls. Let this teach you a lesson."
        - id: ch01-b127
          speaker: narrator
          text: A wave of giggles ran around the room, and Tom seemed ashamed. In truth, he was overcome with worshipful awe of the unknown girl and the frightening pleasure of his good fortune. He sat at the far end of her pine bench. With a toss of her head, she edged away from him. Nudges, winks, and whispers traveled across the schoolroom, but Tom stayed still. He rested his arms on the long, low desk and appeared to study his book.
        - id: ch01-b128
          speaker: narrator
          text: Before long, everyone stopped watching him, and the familiar schoolroom murmur rose through the dull air again. Tom began stealing secret glances at the girl. She caught him at it, made a face, and gave him nothing but the back of her head for a full minute.
        - id: ch01-b129
          speaker: narrator
          text: When she cautiously looked around again, a peach lay in front of her. She pushed it away. Tom gently returned it. She pushed it back once more, but not quite so angrily. Tom patiently set it before her again, and this time she let it stay.
        - id: ch01-b130
          speaker: narrator
          text: Tom wrote on his slate, “Please take it. I have more.” She read the message but gave no answer. Then Tom began to draw something, keeping the slate hidden beneath his left hand. For a while, she refused to notice. Little by little, her curiosity showed itself in tiny movements. She made a careful attempt to peek without seeming interested. Tom kept working as if he knew nothing about it. At last she gave in and whispered.
        - id: ch01-b131
          speaker: becky
          text: "Let me see it."
        - id: ch01-b132
          speaker: narrator
          text: Tom uncovered part of a miserable little house with two gables and a corkscrew of smoke coming from its chimney. The girl forgot everything else as she watched. When he finished, she studied it.
        - id: ch01-b133
          speaker: becky
          text: "That's nice. Draw a man now."
        - id: ch01-b134
          speaker: narrator
          text: Tom raised a man in the front yard who looked like a derrick and could have stepped right over the house. The girl did not mind the monster.
        - id: ch01-b135
          speaker: becky
          text: "He's beautiful. Now draw me walking up."
        - id: ch01-b136
          speaker: narrator
          text: Tom drew an hourglass with a full moon for a head and straw-like arms and legs. He added a tremendous fan to its spreading fingers.
        - id: ch01-b137
          speaker: becky
          text: "It's ever so nice. I wish I knew how to draw."
        - id: ch01-b138
          speaker: tom
          text: "It's easy. I'll teach you."
        - id: ch01-b139
          speaker: becky
          text: "Will you? When?"
        - id: ch01-b140
          speaker: tom
          text: "At noon. Are you going home for dinner?"
        - id: ch01-b141
          speaker: becky
          text: "I'll stay if you stay."
        - id: ch01-b142
          speaker: tom
          text: "Good. It's settled. What's your name?"
        - id: ch01-b143
          speaker: becky
          text: "Becky Thatcher. What's yours? Oh, I know. Thomas Sawyer."
        - id: ch01-b144
          speaker: tom
          text: "They call me that when I'm getting whipped. When I'm good, I'm Tom. You'll call me Tom, won't you?"
        - id: ch01-b145
          speaker: becky
          text: "Yes."
        - id: ch01-b146
          speaker: narrator
          text: Tom wrote something else on the slate and hid the words. This time Becky did not hold back. She begged to see them.
        - id: ch01-b147
          speaker: tom
          text: "Oh, it's nothing."
        - id: ch01-b148
          speaker: becky
          text: "Yes, it is."
        - id: ch01-b149
          speaker: tom
          text: "No, it isn't. You don't want to see it."
        - id: ch01-b150
          speaker: becky
          text: "I really do. Please show me."
        - id: ch01-b151
          speaker: tom
          text: "You'll tell someone."
        - id: ch01-b152
          speaker: becky
          text: "No, I won't. I truly, truly won't."
        - id: ch01-b153
          speaker: tom
          text: "You won't ever tell anybody, as long as you live?"
        - id: ch01-b154
          speaker: becky
          text: "Never. Now let me see."
        - id: ch01-b155
          speaker: tom
          text: "Oh, you don't want to."
        - id: ch01-b156
          speaker: becky
          text: "If you're going to tease me like this, then I will see it."
        - id: ch01-b157
          speaker: narrator
          text: Becky put her small hand on his, and a little struggle began. Tom pretended to resist with all his strength. Yet bit by bit, he let his hand slip away until the hidden words came into view. They said, “I love you.”
        - id: ch01-b158
          speaker: becky
          text: "Oh, you bad thing!"
        - id: ch01-b159
          speaker: narrator
          text: She gave his hand a sharp slap. Even so, she blushed and looked pleased.
        - id: ch01-b160
          speaker: narrator
          text: At that moment, a slow and terrible grip closed around Tom's ear. A steady pull lifted him from the bench. The schoolmaster carried him across the room that way and dropped him into his own seat while the whole school showered him with giggles. For several awful moments, the master stood over him. At last he returned to his high chair without saying a word. Tom's ear tingled, but his heart was jubilant.
        - id: ch01-b161
          speaker: narrator
          text: When the room settled, Tom made an honest effort to study, but the storm inside him was too great. In reading class, he made a complete mess of his turn. Then geography changed beneath his hands. Lakes became mountains, mountains became rivers, and rivers became continents until the whole world was chaos again. In spelling class, one easy little word after another sent him farther down the line. At last he reached the very bottom and had to surrender the pewter medal he had worn so proudly for months.
