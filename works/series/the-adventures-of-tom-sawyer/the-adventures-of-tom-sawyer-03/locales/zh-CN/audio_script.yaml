audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    aunt_polly:
      display_name: 波莉姨妈
      tts:
        delivery: 说话爽利严厉，底下藏着疼爱
        timbre: 结实成熟
        pace: 中等偏快
        pitch: 中低音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 汤姆来到波莉姨妈面前。姨妈坐在后屋开着的窗边。这间舒服的屋子，既是卧室，也是吃早饭、吃正餐和看书的地方。夏日暖风轻轻吹着，四周安静得让人放松。花香飘进来，蜜蜂低声嗡嗡，姨妈听着听着，就对着手里的针线打起了盹。膝上那只猫也睡熟了，屋里再没有别的伴儿。她怕眼镜掉下来，便把它架在灰白的头发上。姨妈本以为汤姆早逃得没影了，没想到他竟然这么大胆，又主动送到自己手里。
        - id: ch01-b02
          speaker: tom
          text: “姨妈，我现在能出去玩了吗？”
        - id: ch01-b03
          speaker: aunt_polly
          text: “什么，这么快？你到底刷了多少？”
          emotion: surprised
        - id: ch01-b04
          speaker: tom
          text: “都刷完了，姨妈。”
        - id: ch01-b05
          speaker: aunt_polly
          text: “汤姆，不许骗我。我最受不了别人撒谎。”
        - id: ch01-b06
          speaker: tom
          text: “我真没骗你，姨妈。确实全刷完了。”
        - id: ch01-b07
          speaker: narrator
          text: 这几句话，波莉姨妈可不敢信。她亲自出去看，心想汤姆的话能有两成是真的，就算不错了。谁知整面围墙全刷白了，而且涂了一层又一层，处处都很讲究，连地面上也刷出一道白印。姨妈惊讶得差点儿说不出话。
        - id: ch01-b08
          speaker: aunt_polly
          text: “哎呀，真没想到！汤姆，只要你愿意，活儿还是能干好的。可话说回来，你愿意干的时候实在太少了。行啦，出去玩吧。不过这星期之内记得回来，不然我准要揭你的皮。”
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: 汤姆的成果实在太漂亮，姨妈高兴坏了。她把他带进储藏室，挑出一只上好的苹果交给他，还不忘讲一番道理。一件好东西，要是不做坏事，靠老老实实出力挣来，便会显得更珍贵，吃起来也会更香。她最后兴高采烈地引用了一句《圣经》。趁这个工夫，汤姆已经顺手“钩”走一只炸面包圈。
        - id: ch01-b10
          speaker: narrator
          text: 他蹦蹦跳跳地跑出去，正好看见锡德要从屋外的楼梯上二楼后屋。地上到处都是土块，抓起来很方便。眨眼之间，土块便像冰雹一样漫天乱飞，围着锡德一阵猛砸。波莉姨妈还没明白过来，更没来得及冲出去救人，锡德身上已经结结实实挨了六七下。汤姆呢，早翻过围墙跑了。旁边明明有门，可他向来忙得没空走门。锡德告发衣领上那根黑线，让汤姆吃了苦头。这笔账一算清，汤姆心里总算舒坦了。
        - id: ch01-b11
          speaker: narrator
          text: 汤姆绕过街区，从姨妈家牛棚后面那条泥泞的小巷兜回来。没多久，他便逃到了抓不着、也罚不到的地方，赶紧奔向村里的公共广场。两支男孩组成的“军队”已经照约定在那里集合，准备开战。汤姆统领一军，他的知心朋友乔·哈珀统领另一军。两位伟大的将领当然不肯亲自打仗，那种事留给年纪更小的兵就好。他们并肩坐在高处，让副官来回传令，指挥下面的战斗。
        - id: ch01-b12
          speaker: narrator
          text: 大战打了很久，十分激烈，最后汤姆的大军赢得辉煌胜利。两边清点了阵亡人数，交换了俘虏，还商定下一次要为什么争执，并约好那场非打不可的仗定在哪天。事情办妥，两军列好队伍，各自开走，汤姆一个人往家走去。
        - id: ch01-b13
          speaker: narrator
          text: 走过杰夫·撒切尔家时，汤姆看见花园里有个新来的姑娘。她有一双蓝眼睛，金黄色的头发编成两条长辫，穿着白色夏装，灯笼裤上还绣着花，可爱极了。刚刚加冕的英雄一枪没放，便投降了。那个叫艾米·劳伦斯的姑娘，一下子从他心里消失，连半点儿影子都没留下。汤姆原以为自己爱她爱得发狂，那份热情简直是膜拜。现在才知道，那不过是一点可怜又短命的好感。
        - id: ch01-b14
          speaker: narrator
          text: 他用了几个月才追到艾米。就在不到一个星期以前，她刚刚说出自己的心意。仅仅七天前，汤姆还是全世界最幸福、最骄傲的男孩。可现在，只过了一瞬间，艾米就离开了他的心，像个偶然来做客、已经告辞的陌生人。
        - id: ch01-b15
          speaker: narrator
          text: 汤姆偷偷望着眼前这位新天使，越看越着迷。等他发现小姑娘也注意到了自己，马上装作根本不知道她在场，开始耍出各种荒唐的男孩把戏。他只有一个目的，就是让她佩服自己。汤姆滑稽地胡闹了好一阵。后来，他正表演一个危险的翻腾动作，斜眼一看，小姑娘已经朝屋子走去。
        - id: ch01-b16
          speaker: narrator
          text: 汤姆赶到围墙边，靠着墙暗自伤心，只盼她还能多待一会儿。她在台阶上停了片刻，又继续走向门口。一只脚刚踏上门槛，汤姆便长长叹了口气。可下一刻，他的脸立刻亮了。原来就在消失以前，她把一朵三色堇扔过了围墙。
        - id: ch01-b17
          speaker: narrator
          text: 汤姆跑过去，却在离花一两英尺远的地方停下。他用手遮着眼睛，朝街那头使劲看，好像那里出了什么有意思的事。过一会儿，他捡起一根稻草，把头仰得老高，试着让稻草立在鼻尖上。为了不让它掉下来，他一会儿往左，一会儿往右，也一点点挪近那朵三色堇。
        - id: ch01-b18
          speaker: narrator
          text: 终于，汤姆的光脚踩住了花，灵活的脚趾把它夹起来。他单脚跳着带走宝物，拐过街角就没影了。不过他只消失了一会儿，刚好够他把花扣进上衣里面，让它贴在心口。也许贴的是胃口，因为汤姆不怎么懂人体构造，反正也不在乎。
        - id: ch01-b19
          speaker: narrator
          text: 汤姆很快又回到围墙边，一直待到天黑，还是不停地“显本事”。可小姑娘再没出现。他只好安慰自己，也许她一直待在某一扇窗子旁边，早把他的殷勤都看见了。最后，他满脑子都是幻想，十分舍不得走，却还是迈开大步回了家。
        - id: ch01-b20
          speaker: narrator
          text: 整顿晚饭期间，汤姆都兴高采烈。姨妈真不明白，这孩子到底中了什么邪。她因为土块砸锡德的事狠狠训了他一顿，汤姆却一点也不在意。他还敢在姨妈眼皮底下偷糖，结果指关节挨了一下。
        - id: ch01-b21
          speaker: tom
          text: “姨妈，锡德拿糖的时候，你怎么从来不打他？”
        - id: ch01-b22
          speaker: aunt_polly
          text: “锡德才不会像你这样折腾得人没一刻安生。我要是不盯着，你早一头钻进糖罐里了。”
        - id: ch01-b23
          speaker: narrator
          text: 过了一会儿，姨妈去了厨房。锡德仗着自己从不挨打，伸手就去拿糖罐，那副样子分明是在向汤姆炫耀，叫人几乎忍不下去。偏偏锡德手一滑，糖罐掉下来，摔得粉碎。汤姆乐得快要发狂。也正因为太快活，他反而管住了舌头，一声不吭。
        - id: ch01-b24
          speaker: narrator
          text: 他在心里盘算，姨妈回来时，自己绝不先说话。他要纹丝不动地坐着，一直等到姨妈问是谁闯了祸，再把真相说出来。看着那个受宠的乖孩子也“吃上一顿”，世上哪还有比这更痛快的事？老太太回来了，站在碎片前面，愤怒的目光隔着眼镜直往外射。汤姆满心狂喜，几乎忍不住了，只在心里说，这下要来啦！
        - id: ch01-b25
          speaker: narrator
          text: 下一秒，汤姆已经摔了个四脚朝天。那只有力的巴掌再次举起，眼看又要落下来。
        - id: ch01-b26
          speaker: tom
          text: “等等！你为什么打我？糖罐是锡德摔的！”
          emotion: surprised
        - id: ch01-b27
          speaker: narrator
          text: 波莉姨妈停住了，一时有些糊涂。汤姆等着她心疼地安慰自己。可姨妈回过神以后，只挤出一句话。
        - id: ch01-b28
          speaker: aunt_polly
          text: “哼，我看这一巴掌也没冤枉你。我不在的时候，你八成还干过别的大胆坏事。”
        - id: ch01-b29
          speaker: narrator
          text: 说完这话，姨妈的良心开始责备她。她很想说几句温柔疼爱的话，可又觉得那样等于承认自己错了，管教孩子哪能这么办？她只好沉默着继续做事，心里却很不好受。汤姆缩在墙角生闷气，还把自己的苦难越想越悲壮。他知道姨妈心里已经跪下来求他原谅，这个念头让他在气恼中又有些得意。
        - id: ch01-b30
          speaker: narrator
          text: 汤姆绝不会先发出和解的信号，姨妈给出什么信号，他也绝不理会。他知道姨妈不时望着自己，目光里满是渴望，眼中还带着泪。可汤姆偏要装作没看见。他想象自己病得快死了，姨妈守在床前，求他只说一句原谅的话。他却把脸转向墙壁，一个字也不说，就这么死去。啊，那时候姨妈会是什么感受？
        - id: ch01-b31
          speaker: narrator
          text: 接着，他又想象人们把他的尸体从河里抬回家。一头鬈发湿漉漉的，那颗受伤的心终于安息。姨妈会扑在他身上，眼泪像雨一样落下来。她会求上帝把自己的孩子还回来，会发誓再也不欺负他，永远、永远都不会。可汤姆只会浑身冰冷、脸色苍白地躺在那里，没有一点反应。这个可怜的小受难者，一切悲伤都结束了。
        - id: ch01-b32
          speaker: narrator
          text: 这些悲惨的幻想把汤姆自己都感动坏了。他不停咽着唾沫，生怕喉咙哽住。眼泪越积越多，眼前变得模糊。一眨眼，泪珠就滚下来，再顺着鼻尖往下滴。这样细细疼惜自己的哀愁，真是一种享受。任何人间的快乐，任何刺耳的喜悦，他都不准闯进来。这份悲伤太神圣，碰不得。
        - id: ch01-b33
          speaker: narrator
          text: 这时，他的表姐玛丽蹦蹦跳跳地进了屋。她去乡下做客，不过才一个星期，却像离家过了一辈子。如今终于回来，整个人满是欢喜。玛丽从一扇门把歌声和阳光带进来，汤姆便站起身，从另一扇门走出去，投进阴云和黑暗里。
        - id: ch01-b34
          speaker: narrator
          text: 他走得很远，离开男孩们平常玩耍的地方，专门去找和自己心情一样荒凉的角落。河上有一只木筏，仿佛在招呼他。汤姆坐到木筏边缘，望着眼前凄凉又宽阔的河面，只盼自己能一下子淹死，什么也别察觉。这样就用不着经历大自然为溺水安排的那套难受过程了。
        - id: ch01-b35
          speaker: narrator
          text: 他又想起那朵花，便从衣服里拿出来。三色堇已经揉皱，也枯萎了，这让他阴郁的幸福更加浓重。那个姑娘如果知道，会不会可怜他？她会不会哭，会不会恨自己没有资格搂住他的脖子，好好安慰他？还是她也会像这个虚假的世界一样，冷冰冰地转身走开？
        - id: ch01-b36
          speaker: narrator
          text: 这样的想象让汤姆又痛苦又快活。他把它翻来覆去地想，从一个角度想到另一个角度，直到所有变化都被他想尽。最后，他叹着气站起来，走进黑暗。
        - id: ch01-b37
          speaker: narrator
          text: 大约九点半或十点，汤姆沿着空荡的街道，来到那位不知姓名的心上人住的地方。他停下来侧耳细听，却一点声音也没有。二楼一扇窗的窗帘上，映着蜡烛暗淡的光。那个神圣的人儿会不会就在里面？汤姆翻过围墙，悄悄穿过花木，来到窗户底下。他满怀深情，仰头望了很久。
        - id: ch01-b38
          speaker: narrator
          text: 随后，汤姆在地上仰面躺好，两只手交叠在胸前，握着那朵可怜的枯花。他要这样死在冷酷的世界里。无家可归的头上，没有一片屋顶替他遮挡。临死的冷汗冒出来，没有友善的手替他擦去。那阵巨大的痛苦来临时，也没有一张慈爱的脸带着怜悯俯视他。
        - id: ch01-b39
          speaker: narrator
          text: 等到欢乐的早晨，她向窗外看，就会见到这样的汤姆。啊，她会不会为那具可怜、僵冷的身体落下一小滴泪？看见一条明亮幼小的生命被这样粗暴地毁掉，还没到时候便已凋零，她会不会轻轻叹一口气？
        - id: ch01-b40
          speaker: narrator
          text: 窗户突然推开。女仆刺耳的嗓音亵渎了神圣的安静。紧接着，一大盆水泼下来，把躺着的殉情者遗体浇得浑身透湿。
        - id: ch01-b41
          speaker: narrator
          text: 险些呛死的英雄哼哧一声，顿时轻松了，一下跳起来。空中有东西嗖地飞过，里面还混着低低的咒骂。接着，玻璃碎裂的声音响起。一个模糊的小身影翻过围墙，飞快钻进黑暗。
        - id: ch01-b42
          speaker: narrator
          text: 没过多久，汤姆已经脱光衣服，准备上床。他借着一小截牛油蜡烛的光，查看那身湿透的衣裳。这时锡德醒了。就算他迷迷糊糊地想过要“借题发挥”，也马上打消念头，一声不响。汤姆的眼睛里透着危险，他可不敢惹。
        - id: ch01-b43
          speaker: narrator
          text: 汤姆上床睡了，连祷告这份额外的麻烦也省掉了。锡德默默把这件事记在心里。
