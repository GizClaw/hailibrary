  chapters:
    - id: ch01
      title: CHAPTER III
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Aunt Polly sat beside an open window in the pleasant room at the back of the house. It served as bedroom, breakfast room, dining room, and library all at once. Warm summer air drifted in with the scent of flowers and the sleepy hum of bees. With no company but the cat asleep in her lap, she had begun to nod over her knitting. Her spectacles rested safely on top of her gray head. She was sure Tom had run off long ago, so she could hardly believe it when he came and boldly put himself back in her power.
        - id: ch01-b02
          speaker: tom
          text: "Can I go play now, Aunt Polly?"
        - id: ch01-b03
          speaker: aunt_polly
          text: "Already? How much of that fence have you done?"
        - id: ch01-b04
          speaker: tom
          text: "All of it."
        - id: ch01-b05
          speaker: aunt_polly
          text: "Tom, don't lie to me. I can't stand it."
        - id: ch01-b06
          speaker: tom
          text: "I'm not lying, Aunt Polly. It's really finished."
        - id: ch01-b07
          speaker: narrator
          text: Aunt Polly did not put much faith in that answer. She went outside to see for herself, and she would have been satisfied if even one fifth of it were true. But the whole fence was whitewashed. It had not merely been covered once. It was carefully coated again and again, and there was even a white streak along the ground. For once, Aunt Polly was almost too astonished to speak.
        - id: ch01-b08
          speaker: aunt_polly
          text: "Well, I never! There's no denying you can work when you decide to, Tom. Trouble is, you hardly ever decide to. Go on and play now. Just make sure you come back sometime this week, or I'll tan you."
        - id: ch01-b09
          speaker: narrator
          text: Tom's splendid work overwhelmed her so completely that she took him to the closet and chose a fine apple for him. As she handed it over, she gave him a lesson on how much more value and flavor a treat gained when it came honestly through good work instead of sin. While she happily finished the lesson with a flourish from Scripture, Tom hooked a doughnut too.
        - id: ch01-b10
          speaker: narrator
          text: Then he skipped outside and spotted Sid starting up the outer stairs to the rooms at the back of the second floor. Clods of dirt lay close at hand. An instant later, the air was full of them. They stormed around Sid like hail, and six or seven struck home before Aunt Polly recovered from her surprise and rushed to help him. By then Tom was over the fence and gone. There was a gate, but he was usually much too pressed for time to use it. His heart was peaceful now. He had paid Sid back for pointing out the black thread and getting him in trouble.
        - id: ch01-b11
          speaker: narrator
          text: Tom went around the block and slipped into a muddy alley behind his aunt's cow stable. Soon he was safely beyond capture and punishment, and he hurried toward the village square. Two companies of boys had arranged to meet there for a military battle. Tom commanded one army, and his close friend Joe Harper commanded the other. The two great generals would not lower themselves by fighting in person. That was work for the smaller boys. They sat together on high ground and sent their orders through aides.
        - id: ch01-b12
          speaker: narrator
          text: After a long, hard battle, Tom's army won a mighty victory. The boys counted the dead and exchanged prisoners. Then they settled the terms of their next disagreement and chose the day when the necessary new battle would be fought. With all of that decided, both armies formed ranks and marched away. Tom started home alone.
        - id: ch01-b13
          speaker: narrator
          text: As he passed the house where Jeff Thatcher lived, Tom saw a new girl in the garden. She had blue eyes, yellow hair braided into two long tails, a white summer dress, and embroidered pantalettes. The newly crowned hero fell without firing a shot.
        - id: ch01-b14
          speaker: narrator
          text: Amy Lawrence vanished from his heart so completely that not even a memory remained. Tom had believed he loved her beyond reason. He had spent months winning her, and she had finally admitted she loved him only a week ago. For seven short days he had been the proudest and happiest boy alive. Now, in a single moment, she left his heart like a visitor whose stay was over.
        - id: ch01-b15
          speaker: narrator
          text: Tom watched the new girl secretly and adored her. As soon as he noticed that she had seen him, he pretended not to know she was there. He began showing off in every ridiculous boyish way he could think of, all to win her admiration. He kept at it for quite a while. Then, in the middle of a dangerous gymnastic feat, he glanced over and saw her heading toward the house.
        - id: ch01-b16
          speaker: narrator
          text: He hurried to the fence and leaned against it, miserable, hoping she might stay a little longer. She paused on the steps, then moved toward the door. When her foot reached the threshold, Tom gave a great sigh. At once his face brightened. Just before she disappeared, she tossed a pansy over the fence.
        - id: ch01-b17
          speaker: narrator
          text: Tom ran around and stopped a foot or two from the flower. Then he shaded his eyes and stared down the street as though something fascinating were happening there. He picked up a straw and tried to balance it on his nose, tilting his head far back. As he moved from side to side, he edged closer and closer to the pansy. At last his bare foot came down on it. His flexible toes closed around the prize, and he hopped away with it around the corner.
        - id: ch01-b18
          speaker: narrator
          text: He stayed gone for only a minute, just long enough to button the flower inside his jacket beside his heart. Or perhaps beside his stomach. Tom knew little about anatomy, and the exact spot did not trouble him.
        - id: ch01-b19
          speaker: narrator
          text: He returned to the fence and showed off just as before, staying there until night came. The girl never appeared again. Tom comforted himself a little by hoping she had been near one of the windows all that time and had noticed every one of his efforts. At last he walked home unwillingly, his poor head crowded with visions.
        - id: ch01-b20
          speaker: narrator
          text: His spirits stayed so high through supper that Aunt Polly wondered what had gotten into him. She scolded him soundly for throwing dirt at Sid, but he hardly cared. Then he tried to steal sugar right under her nose, and she rapped his knuckles.
        - id: ch01-b21
          speaker: tom
          text: "You never hit Sid when he takes sugar."
        - id: ch01-b22
          speaker: aunt_polly
          text: "Sid doesn't pester a person the way you do. If I didn't watch you, you'd never leave that sugar alone."
        - id: ch01-b23
          speaker: narrator
          text: A moment later she went into the kitchen. Sid, pleased that he could get away with it, reached for the sugar bowl. To Tom, that little show of triumph was almost more than he could bear. Then Sid's fingers slipped. The bowl fell and shattered.
        - id: ch01-b24
          speaker: narrator
          text: Tom was wild with delight, but he held his tongue. He decided not to say one word when Aunt Polly returned. He would sit perfectly still until she asked who had done it. Then he would tell her, and nothing in the world could be finer than watching the perfect little favorite catch his punishment.
        - id: ch01-b25
          speaker: narrator
          text: He could barely contain himself when the old lady came back and stood over the broken bowl, shooting lightning above her spectacles. Tom thought the moment had come. The very next instant, he was sprawled on the floor. Aunt Polly's powerful hand rose to strike him again.
        - id: ch01-b26
          speaker: tom
          text: "Wait! Why are you hitting me? Sid broke it!"
          emotion: surprised
        - id: ch01-b27
          speaker: narrator
          text: Aunt Polly stopped, confused. Tom waited for her pity to soothe him. When she found her voice again, that was not what he got.
        - id: ch01-b28
          speaker: aunt_polly
          text: "Hmph! I reckon that smack wasn't wasted. You've probably been up to some other outrageous mischief while I wasn't looking."
        - id: ch01-b29
          speaker: narrator
          text: Then her conscience began to trouble her. She longed to say something tender and loving, but Tom might take that as an admission that she had been wrong. Discipline would not allow it. So she said nothing and went back to her work with a heavy heart.
        - id: ch01-b30
          speaker: narrator
          text: Tom sulked in a corner and built up his misery. He knew that, deep in her heart, his aunt was on her knees before him, and the thought gave him gloomy satisfaction. He would offer no sign of forgiveness, and he would accept none from her. Now and then he felt her longing gaze through a mist of tears, but he refused to notice.
        - id: ch01-b31
          speaker: narrator
          text: He imagined himself sick and dying, with Aunt Polly bending over him and begging for one small word of forgiveness. He would turn his face to the wall and die without saying it. Then how would she feel?
        - id: ch01-b32
          speaker: narrator
          text: Next he imagined himself brought home dead from the river, his curls dripping wet and his wounded heart finally still. Aunt Polly would throw herself over him. Her tears would fall like rain, and she would pray for God to return her boy. She would promise never, never to mistreat him again. But Tom would lie cold and white without moving, a poor young sufferer whose troubles were over.
        - id: ch01-b33
          speaker: narrator
          text: These mournful dreams affected him so deeply that he had to keep swallowing to stop himself from choking. Tears blurred his eyes. Whenever he blinked, they spilled over and ran from the end of his nose. He found such pleasure in nursing his sorrow that he could not let ordinary cheer or noisy happiness disturb it. His grief was too sacred for that.
        - id: ch01-b34
          speaker: narrator
          text: Just then his cousin Mary danced in, bursting with joy to be home after the endless age of one week in the country. As she brought song and sunshine through one door, Tom rose and went out the other, wrapped in clouds and darkness.
        - id: ch01-b35
          speaker: narrator
          text: He wandered far from the places where boys usually gathered and searched for lonely spots that matched his mood. A log raft in the river seemed to call to him. He sat on its outer edge and stared across the dreary, empty width of the water. He wished he could simply be drowned all at once without even knowing it, and without going through the uncomfortable process nature usually required.
        - id: ch01-b36
          speaker: narrator
          text: Then he remembered the flower. He drew it out, crushed and wilted, and it made his dark pleasure even deeper. Would the girl pity him if she knew? Would she cry and wish she had the right to put her arms around his neck and comfort him? Or would she turn away coldly, like the whole false world?
        - id: ch01-b37
          speaker: narrator
          text: That picture brought him such delicious pain that he went over it again and again, changing it in every possible way until he had worn it out. At last he stood, sighed, and walked away into the darkness.
        - id: ch01-b38
          speaker: narrator
          text: Around half past nine or ten, Tom came along the empty street where the unknown girl lived. He stopped and listened. There was no sound. A candle cast a dull glow against the curtain of an upstairs window. Could she be there?
        - id: ch01-b39
          speaker: narrator
          text: Tom climbed the fence and crept between the plants until he stood below the window. For a long time he gazed up at it, overcome with feeling. Then he lay on his back beneath it, folded his hands across his chest, and held the poor wilted flower.
        - id: ch01-b40
          speaker: narrator
          text: This was how he would die, out in the cold world. There would be no roof over his homeless head, no friendly hand to wipe the deathly damp from his forehead, and no loving face bending over him with pity when the final suffering came. In the bright morning, she would look out and find him there. Would she shed one little tear over his poor, lifeless body? Would she sigh just once for a bright young life so cruelly ended before its time?
        - id: ch01-b41
          speaker: narrator
          text: The window flew open. A maid's harsh voice shattered the holy stillness, and a flood of water poured down over the fallen martyr.
        - id: ch01-b42
          speaker: narrator
          text: The choking hero leaped up with a grateful snort. Something whizzed through the air along with a muttered curse. Glass shattered. Then a small, shadowy figure sailed over the fence and vanished into the dark.
        - id: ch01-b43
          speaker: narrator
          text: Not long afterward, Tom stood undressed for bed, studying his soaked clothes by the light of a tallow candle. Sid woke up. If he had any thought of making clever remarks about what he saw, one look at the danger in Tom's eyes changed his mind. Sid kept quiet.
        - id: ch01-b44
          speaker: narrator
          text: Tom went to bed without the extra annoyance of saying his prayers. Sid silently took note of that too.
