  chapters:
    - id: ch01
      title: CHAPTER XXVI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Around noon the next day, Tom and Huck reached the dead tree to collect their tools. Tom could hardly wait to search the haunted house. Huck wanted to go too, though not quite as badly. Then something struck him.
        - id: ch01-b02
          speaker: huck
          text: Hold on, Tom. Do you know what day this is?
        - id: ch01-b03
          speaker: narrator
          text: Tom counted through the week in his head. Then he looked up, startled.
        - id: ch01-b04
          speaker: tom
          text: My! Huck, I never thought of that once!
          emotion: surprised
        - id: ch01-b05
          speaker: huck
          text: Neither did I. Then all at once I remembered. It's Friday.
        - id: ch01-b06
          speaker: tom
          text: Blame it, you've got to be careful about these things. Going after a haunted house on a Friday could get us into an awful scrape.
        - id: ch01-b07
          speaker: huck
          text: Could? It would! Maybe some days are lucky, but Friday sure isn't.
        - id: ch01-b08
          speaker: tom
          text: Everybody knows that. I don't reckon you were the first person to find it out.
        - id: ch01-b09
          speaker: huck
          text: I never said I was, did I? And Friday isn't the only trouble. I had a mighty bad dream last night. It was about rats.
        - id: ch01-b10
          speaker: tom
          text: No! That's a sure sign of trouble. Were they fighting?
          emotion: surprised
        - id: ch01-b11
          speaker: huck
          text: No, they weren't fighting.
        - id: ch01-b12
          speaker: tom
          text: Well, that's better. If rats don't fight, it only means trouble is somewhere nearby. We just have to watch sharp and stay clear of it. We'll leave the house till tomorrow and play today. Huck, do you know Robin Hood?
        - id: ch01-b13
          speaker: huck
          text: No. Who was he?
        - id: ch01-b14
          speaker: tom
          text: One of the greatest men who ever lived in England. One of the best, too. He was a robber.
        - id: ch01-b15
          speaker: huck
          text: Cracky, I wish I was one. Who did he rob?
        - id: ch01-b16
          speaker: tom
          text: Just sheriffs and bishops and rich people and kings and that sort. He never troubled poor people. He loved them, and he always split everything fairly with them.
        - id: ch01-b17
          speaker: huck
          text: Then he must have been a brick.
        - id: ch01-b18
          speaker: tom
          text: You bet he was. Robin Hood was the noblest man there ever was. There aren't men like that now. He could whip anybody in England with one hand tied behind him. And with his yew bow, he could hit a ten-cent piece from a mile and a half away, every time.
        - id: ch01-b19
          speaker: huck
          text: What's a yew bow?
        - id: ch01-b20
          speaker: tom
          text: I don't know. Some kind of bow, of course. If his arrow only caught the edge of the dime, he'd sit down and cry and curse. Come on, we'll play Robin Hood. It's first-rate fun. I'll teach you.
        - id: ch01-b21
          speaker: huck
          text: All right. I'm agreed.
        - id: ch01-b22
          speaker: narrator
          text: They played Robin Hood all afternoon. Now and then, they looked longingly toward the haunted house and talked about what might happen there tomorrow. When the sun began to sink, they headed home through the long tree shadows. Soon the woods of Cardiff Hill hid them from sight.
        - id: ch01-b23
          speaker: narrator
          text: Shortly after noon on Saturday, they met at the dead tree again. They smoked and talked in the shade. Then they dug a little farther in their last hole, though they did not expect much. Tom had heard plenty of stories about people who gave up on treasure when they were only six inches away, and someone else found it with one push of a shovel. Nothing came of it this time. The boys shouldered their tools and left, satisfied that they had obeyed every rule of treasure hunting and had given fortune a fair chance.
        - id: ch01-b24
          speaker: narrator
          text: At the haunted house, the dead silence under the baking sun felt strange and horrible. The loneliness and desolation weighed on them so heavily that for a moment neither boy dared go in. They crept to the door and peeped through it, trembling. Inside was a room choked with weeds. It had no floor or plaster, only an ancient fireplace, empty windows, a broken staircase, and ragged, abandoned cobwebs hanging here, there, and everywhere.
        - id: ch01-b25
          speaker: narrator
          text: At last they slipped inside. Their hearts beat fast. They whispered, listening for the smallest noise, with every muscle ready to run. After a while, the house felt less frightening. They began looking around with real interest. They even admired their own courage and wondered at it.
        - id: ch01-b26
          speaker: narrator
          text: Then they wanted to see upstairs. Going up felt almost like cutting off their escape, but each boy dared the other until there was only one possible end to it. They tossed their tools into a corner and climbed. The upper floor showed the same signs of decay. A closet in one corner promised some mystery, but the promise was a fraud. There was nothing inside. By then, the boys had their courage well under control. They were about to go down and start digging when Tom froze.
        - id: ch01-b27
          speaker: tom
          text: Shh! Keep quiet!
        - id: ch01-b28
          speaker: huck
          text: What is it?
          emotion: fearful
        - id: ch01-b29
          speaker: tom
          text: Quiet. There! Do you hear it?
        - id: ch01-b30
          speaker: huck
          text: Yes! Oh, my! Let's run!
          emotion: fearful
        - id: ch01-b31
          speaker: tom
          text: Stay still! Don't move. They're coming straight toward the door.
          emotion: fearful
        - id: ch01-b32
          speaker: narrator
          text: The boys stretched out on the floor and pressed their eyes to knotholes in the boards. They waited in miserable fear.
        - id: ch01-b33
          speaker: tom
          text: They've stopped. No, they're coming again. Here they are. Don't whisper another word, Huck. My goodness, I wish I was out of here!
          emotion: fearful
        - id: ch01-b34
          speaker: narrator
          text: Two men came in. The boys recognized one as the old deaf and dumb Spaniard who had appeared around town once or twice. They had never seen the other man. He was ragged and dirty, and his face was not pleasant. The Spaniard wore a serape and green goggles. Bushy white whiskers covered his face, and long white hair hung below his sombrero.
        - id: ch01-b35
          speaker: narrator
          text: The ragged man was speaking softly as they entered. They sat on the ground with their backs against the wall, facing the door. As he went on, he became less careful and the boys could hear him clearly.
        - id: ch01-b36
          speaker: stranger
          text: No. I've thought it through, and I don't like it. It's too dangerous.
        - id: ch01-b37
          speaker: injun_joe
          text: Dangerous! You're a milksop!
        - id: ch01-b38
          speaker: narrator
          text: The supposedly deaf and dumb Spaniard had spoken. The boys gasped and shook. They knew that voice. It belonged to Injun Joe. For a while, no one said anything.
        - id: ch01-b39
          speaker: injun_joe
          text: How is this any worse than that job upriver? Nothing came of that.
        - id: ch01-b40
          speaker: stranger
          text: That was different. It was far upriver, with no other house nearby. Since we failed, nobody will ever know we tried.
        - id: ch01-b41
          speaker: injun_joe
          text: And coming here in broad daylight isn't dangerous? Anybody who saw us would get suspicious.
        - id: ch01-b42
          speaker: stranger
          text: I know. But after that foolish job, we didn't have another place this handy. I want to leave this shack. I wanted to go yesterday, but those infernal boys were playing on the hill in full view. We couldn't stir from here.
        - id: ch01-b43
          speaker: narrator
          text: The two infernal boys shook again. How lucky they had remembered Friday and waited a day! At that moment, they wished they had waited a whole year.
        - id: ch01-b44
          speaker: narrator
          text: The men brought out food and ate. After a long, thoughtful silence, Injun Joe spoke.
        - id: ch01-b45
          speaker: injun_joe
          text: Listen, lad. Go back upriver where you belong, and wait until you hear from me. I'll risk coming into town once more to look around. After I've watched awhile and things seem right, we'll do that dangerous job. Then we'll make for Texas together.
        - id: ch01-b46
          speaker: narrator
          text: That plan satisfied both men. Soon they began to yawn.
        - id: ch01-b47
          speaker: injun_joe
          text: I'm dead for sleep. It's your turn to keep watch.
        - id: ch01-b48
          speaker: narrator
          text: Injun Joe curled up in the weeds and quickly began to snore. His companion stirred him once or twice, and Joe quieted down. Before long, the watchman's head began to nod lower and lower. Soon both men were snoring.
        - id: ch01-b49
          speaker: narrator
          text: The boys let out one long, grateful breath.
        - id: ch01-b50
          speaker: tom
          text: This is our chance. Come on!
        - id: ch01-b51
          speaker: huck
          text: I can't. I'd die if they woke up.
          emotion: fearful
        - id: ch01-b52
          speaker: narrator
          text: Tom urged him, but Huck would not move. Finally, Tom rose very slowly and started alone. His first step drew such a hideous creak from the crazy floor that he dropped down again, almost dead with fright. He did not try a second time. The boys lay there counting each dragging moment. It felt as if time itself must be ending and eternity turning gray. They could do nothing but wait, and they were deeply grateful when they finally saw the sun beginning to set.
        - id: ch01-b53
          speaker: narrator
          text: One of the snores stopped. Injun Joe sat up and looked around. He gave a grim smile at his companion, whose head had sunk onto his knees, then nudged him with his foot.
        - id: ch01-b54
          speaker: injun_joe
          text: Fine watchman you are! Never mind. Nothing happened.
        - id: ch01-b55
          speaker: stranger
          text: My! Was I asleep?
          emotion: surprised
        - id: ch01-b56
          speaker: injun_joe
          text: Only part of the time. It's nearly time to move, pard. What should we do with the little bit of swag we have left?
        - id: ch01-b57
          speaker: stranger
          text: Leave it here like we always do, I reckon. There's no sense carrying it until we head south. Six hundred and fifty dollars in silver is a heavy load.
        - id: ch01-b58
          speaker: injun_joe
          text: All right. One more trip here won't matter.
        - id: ch01-b59
          speaker: stranger
          text: No, but next time we ought to come at night, the way we used to. That's safer.
        - id: ch01-b60
          speaker: injun_joe
          text: Yes, but I may have to wait a long time for the right chance at that job. Something could happen, and the silver isn't hidden very well. We'll bury it properly, and we'll put it deep.
        - id: ch01-b61
          speaker: stranger
          text: That's a good idea.
        - id: ch01-b62
          speaker: narrator
          text: The stranger crossed the room, knelt beside the fireplace, and lifted a hearthstone near the back. Under it was a bag that jingled pleasantly. He took twenty or thirty dollars for himself and the same amount for Injun Joe. Then he handed over the bag. Joe was already kneeling in a corner, digging with his bowie knife.
        - id: ch01-b63
          speaker: narrator
          text: In an instant, the boys forgot every fear and every miserable moment. They watched every movement with hungry eyes. What luck! The splendor of it was beyond anything they had imagined. Six hundred dollars could make half a dozen boys rich. Better still, this was treasure hunting under the happiest possible conditions. They would know exactly where to dig, with no bothersome uncertainty at all. They kept nudging each other. Those nudges said everything, and every one meant the same thing. Weren't they glad they were here now!
        - id: ch01-b64
          speaker: narrator
          text: Joe's knife struck something.
        - id: ch01-b65
          speaker: injun_joe
          text: Well, hello! I've struck something.
        - id: ch01-b66
          speaker: stranger
          text: What did you hit?
        - id: ch01-b67
          speaker: injun_joe
          text: A half-rotten plank. No, I think it's a box. Come give me a hand, and we'll find out why it's here. Never mind. I've broken a hole in it.
        - id: ch01-b68
          speaker: narrator
          text: He reached through the hole, then pulled his hand out again.
        - id: ch01-b69
          speaker: injun_joe
          text: Man, it's money!
          emotion: surprised
        - id: ch01-b70
          speaker: narrator
          text: The men examined the coins in his hand. They were gold. Above them, the boys were just as excited and delighted.
        - id: ch01-b71
          speaker: stranger
          text: We'll have this out fast. I saw an old rusty pick in the weeds across the fireplace. I'll get it.
        - id: ch01-b72
          speaker: narrator
          text: He ran across the room and brought back the boys' pick and shovel. Injun Joe studied the pick carefully, shook his head, muttered to himself, and began digging. Soon the box was free. It was not very large. Iron bands ran around it, and it had once been very strong, though the slow years had damaged it. For a while, the two men could only gaze at the treasure in blissful silence.
        - id: ch01-b73
          speaker: injun_joe
          text: Pard, there are thousands of dollars in here.
        - id: ch01-b74
          speaker: stranger
          text: People always said Murrel's gang spent a summer around here.
        - id: ch01-b75
          speaker: injun_joe
          text: I know. And I'd say this looks like their work.
        - id: ch01-b76
          speaker: stranger
          text: Then you won't have to do that other job now.
        - id: ch01-b77
          speaker: narrator
          text: Injun Joe frowned.
        - id: ch01-b78
          speaker: injun_joe
          text: You don't know me. At least, you don't know everything about that business. It isn't only robbery. It's revenge! I'll need your help. Once it's finished, we'll go to Texas. You can go home to Nance and your children now, and wait till you hear from me.
          emotion: angry
        - id: ch01-b79
          speaker: stranger
          text: Well, if that's what you say. What do we do with this? Bury it again?
        - id: ch01-b80
          speaker: injun_joe
          text: Yes, we'll bury it again.
        - id: ch01-b81
          speaker: narrator
          text: Delight swept through the boys overhead.
        - id: ch01-b82
          speaker: injun_joe
          text: No! By the great Sachem, no! I almost forgot. That pick has fresh earth on it!
          emotion: surprised
        - id: ch01-b83
          speaker: narrator
          text: Above him, delight turned to sick terror.
        - id: ch01-b84
          speaker: injun_joe
          text: Why are a pick and shovel here with fresh dirt on them? Who brought them? Where did they go? Did you hear anyone or see anyone? We can't bury the money and let them come back to find disturbed ground. No. We'll carry it to my den.
        - id: ch01-b85
          speaker: stranger
          text: Of course! We should have thought of that. You mean Number One?
        - id: ch01-b86
          speaker: injun_joe
          text: No. Number Two, under the cross. The other place is no good. Too many people use it.
        - id: ch01-b87
          speaker: stranger
          text: All right. It's nearly dark enough for us to leave.
        - id: ch01-b88
          speaker: narrator
          text: Injun Joe stood and moved cautiously from window to window, peering outside.
        - id: ch01-b89
          speaker: injun_joe
          text: Who brought those tools in here? Do you reckon they're upstairs?
        - id: ch01-b90
          speaker: narrator
          text: The boys stopped breathing. Injun Joe put a hand on his knife and stood there for a moment, unable to decide. Then he turned toward the stairs. The boys thought of hiding in the closet, but all their strength was gone. Step by step, they heard him coming up as the stairs creaked beneath him. The agony became more than they could bear, and at last it woke their courage. They were about to leap for the closet when rotten timbers crashed. Injun Joe fell to the ground among the wreckage of the staircase. He pulled himself together and got up, cursing.
        - id: ch01-b91
          speaker: stranger
          text: What's the use of all that? If someone is up there, let them stay. Who cares? If they jump down and land in trouble, that's their choice. It'll be dark in fifteen minutes. They can follow us then if they want to. I don't mind. Whoever left those tools probably saw us, thought we were ghosts or devils, and ran. I'll bet they're still running.
        - id: ch01-b92
          speaker: narrator
          text: Joe grumbled, but at last agreed that they should use the remaining daylight to prepare. Soon afterward, in the deepening twilight, the two men slipped out and headed toward the river with the precious box.
        - id: ch01-b93
          speaker: narrator
          text: Weak with relief, Tom and Huck stood and watched through gaps in the logs. Follow the men? Not a chance. They were satisfied to climb safely down and take the path over the hill toward town.
        - id: ch01-b94
          speaker: narrator
          text: They said very little. They were too busy hating themselves and the bad luck that had made them bring the spade and pick into the house. Without those tools, Injun Joe would never have suspected anyone. He would have hidden the silver beside the gold and left all that treasure waiting there until his revenge was done. Then he would have had the misfortune of coming back to discover that the money had disappeared. What bitter, bitter luck that the tools had ever been brought there!
        - id: ch01-b95
          speaker: narrator
          text: The boys decided to watch for the Spaniard when he came into town to spy out a chance for his revenge. They would follow him to Number Two, wherever it was. Then a ghastly thought came to Tom.
        - id: ch01-b96
          speaker: tom
          text: Revenge? Huck, what if he means us?
          emotion: fearful
        - id: ch01-b97
          speaker: huck
          text: Oh, don't say that!
          emotion: fearful
        - id: ch01-b98
          speaker: narrator
          text: Huck nearly fainted. The boys talked it over all the way into town. They agreed to believe that Joe might mean somebody else. Or at least, he might mean only Tom, since Tom alone had testified.
        - id: ch01-b99
          speaker: narrator
          text: That was very small comfort to Tom. If danger was coming, he thought, company would be a great improvement.
