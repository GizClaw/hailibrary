audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 聪明好胜，兴奋时语速加快，害怕时压低声音
        timbre: 清亮的少年声
        pace: 轻快灵活
        pitch: 中高音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，带着街头少年的粗朴和谨慎
        timbre: 略带沙哑的少年声
        pace: 自然偏慢
        pitch: 中音
    injun_joe:
      display_name: 印第安乔
      tts:
        delivery: 阴沉凶狠，说话短促而有威胁感
        timbre: 粗粝低沉
        pace: 缓慢压迫
        pitch: 低音
    accomplice:
      display_name: 同伙
      tts:
        delivery: 粗俗谨慎，遇到危险时显出犹疑
        timbre: 干涩浑浊
        pace: 中等
        pitch: 中低音
  chapters:
    - id: ch01
      title: 星期五的禁忌
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天快到中午，汤姆和哈克来到枯树下取工具。汤姆急着去鬼屋，哈克也有些迫不及待。可就在这时，哈克突然想起一件事。
        - id: ch01-b02
          speaker: huck
          text: 喂，汤姆，你知道今天星期几吗？
        - id: ch01-b03
          speaker: narrator
          text: 汤姆在心里把一星期数了一遍，猛地抬起头来，脸色都变了。
        - id: ch01-b04
          speaker: tom
          text: 哎呀，哈克！我怎么一直没想到！
          emotion: surprised
        - id: ch01-b05
          speaker: huck
          text: 我也没想到。刚才我才忽然记起来，今天是星期五。
        - id: ch01-b06
          speaker: tom
          text: 真该死，这种事怎么小心都不过分。咱们要是在星期五去碰鬼屋，准会惹上大麻烦。
        - id: ch01-b07
          speaker: huck
          text: 什么叫准会？该说一定会！也许有的日子吉利，可星期五绝对不吉利。
        - id: ch01-b08
          speaker: tom
          text: 傻瓜都知道这个。哈克，总不会是你头一个发现的吧？
        - id: ch01-b09
          speaker: huck
          text: 我又没说是我发现的。再说，麻烦还不只是星期五。昨晚我做了个糟透的梦，梦见耗子了。
        - id: ch01-b10
          speaker: tom
          text: 真的？那准要出事。那些耗子打架了吗？
          emotion: surprised
        - id: ch01-b11
          speaker: huck
          text: 没有，它们没打架。
        - id: ch01-b12
          speaker: tom
          text: 那还好。耗子不打架，只说明附近有麻烦。咱们留心避开就行。今天别寻宝了，玩一天吧。哈克，你知道罗宾汉吗？
        - id: ch01-b13
          speaker: huck
          text: 不知道。罗宾汉是什么人？
        - id: ch01-b14
          speaker: tom
          text: 他是英国最了不起、也最好的人之一。他是个强盗。
        - id: ch01-b15
          speaker: huck
          text: 乖乖，我真想当强盗。他抢的都是谁？
        - id: ch01-b16
          speaker: tom
          text: 他只抢郡长、主教、富人和国王那一类人，从来不欺负穷人。他还很爱护穷人，每次分东西都公平得很。
        - id: ch01-b17
          speaker: huck
          text: 那他准是个顶呱呱的好汉。
        - id: ch01-b18
          speaker: tom
          text: 当然了。他是世上最高尚的人，现在再也找不着这样的人啦。他把一只手绑在背后，也能打败英国任何人。他还能用紫杉木弓，隔着一英里半射中一枚十美分硬币，而且每次都中。
        - id: ch01-b19
          speaker: huck
          text: 紫杉木弓是什么弓？
        - id: ch01-b20
          speaker: tom
          text: 我也不知道，反正是一种弓。要是箭只擦着硬币边儿，他就会坐下来又哭又骂。咱们来玩罗宾汉吧，可有意思了，我教你。
        - id: ch01-b21
          speaker: huck
          text: 好，我愿意玩。
        - id: ch01-b22
          speaker: narrator
          text: 两个孩子玩了一下午的罗宾汉，时不时还满怀向往地看看山下的鬼屋，猜着明天会在那里遇到什么。夕阳西沉以后，他们踩着长长的树影往家走，很快便消失在卡迪夫山的树林里。
    - id: ch02
      title: 走进鬼屋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 星期六刚过中午，他们又回到枯树下。两人坐在阴凉里抽了会儿烟，也聊了会儿天，随后又在旧坑里挖了一阵。汤姆说，有人明明只差六英寸就挖到宝藏，却在最后关头放弃，结果后来的人一锹便把宝贝翻了出来。
        - id: ch02-b02
          speaker: narrator
          text: 可这一次，旧坑里仍旧什么也没有。他们扛起工具离开，觉得自己已经把寻宝该做的事全做了，并没有怠慢运气。
        - id: ch02-b03
          speaker: narrator
          text: 鬼屋在烈日下静得像死了一样。四周又荒凉又破败，让人心里发沉。两个孩子一时不敢进去，只敢悄悄摸到门边，哆嗦着往里看。
        - id: ch02-b04
          speaker: narrator
          text: 屋里杂草丛生，地板已经没了，墙也没抹过。那里只剩一座古老的壁炉、几扇空洞洞的窗和一道摇摇欲坠的楼梯。东一处西一处，到处都垂着没人理会的破蛛网。他们终于蹑手蹑脚地走进去，心跳得厉害，只敢耳语。两只耳朵留神着最细小的声音，浑身也绷得紧紧的，随时准备逃走。
        - id: ch02-b05
          speaker: narrator
          text: 看久以后，他们没那么害怕了，便仔细察看起整座屋子。他们既佩服自己的胆量，又觉得自己居然这么大胆，实在不可思议。接着，两人想去楼上看看。
        - id: ch02-b06
          speaker: narrator
          text: 上楼差不多等于亲手断掉退路，可他们你激我、我激你，谁也不肯示弱。结果当然只有一个，他们把工具扔在墙角，还是爬了上去。楼上同样到处腐朽。角落里有个壁橱，看起来像是藏着什么秘密，可他们打开一看，这份神秘的许诺根本是骗人的，里面空空如也。
        - id: ch02-b07
          speaker: narrator
          text: 这时两人的胆气已经壮了起来。他们正准备下楼挖宝，汤姆忽然听见了动静。
        - id: ch02-b08
          speaker: tom
          text: 嘘，别出声！
        - id: ch02-b09
          speaker: huck
          text: 怎么了？你听见什么了？
          emotion: fearful
        - id: ch02-b10
          speaker: tom
          text: 嘘，就在那边。你听见了吗？
        - id: ch02-b11
          speaker: huck
          text: 听见了！老天爷，咱们快跑吧！
          emotion: fearful
        - id: ch02-b12
          speaker: tom
          text: 别出声，一动也别动！他们正朝门口过来。
          emotion: fearful
        - id: ch02-b13
          speaker: narrator
          text: 两个孩子趴到地板上，把眼睛贴住木板的节孔，提心吊胆地等着。
        - id: ch02-b14
          speaker: tom
          text: 他们停下了。不，又过来了。已经进门了。哈克，一个字也别说。老天爷，我真想离开这儿！
          emotion: fearful
        - id: ch02-b15
          speaker: narrator
          text: 两个男人走进屋来。孩子们认出其中一个，就是近来在镇上露过一两次面的聋哑西班牙老头。另一个人，他们从没见过。
        - id: ch02-b16
          speaker: narrator
          text: 那个陌生人衣衫褴褛，蓬头垢面，模样很不讨人喜欢。西班牙人披着塞拉佩，长长的白发从宽边帽下垂下来，脸上长着浓密的白胡须，还戴着一副绿眼镜。
        - id: ch02-b17
          speaker: narrator
          text: 两人在地上坐下，背靠着墙，脸朝门口。陌生人原本压低声音说着话，后来越来越不提防，孩子们也听得越来越清楚。
        - id: ch02-b18
          speaker: accomplice
          text: 不行，我前前后后都想过了，还是不喜欢这件事。太危险了。
        - id: ch02-b19
          speaker: injun_joe
          text: 危险？你这个软蛋！
        - id: ch02-b20
          speaker: narrator
          text: 那个“聋哑人”居然开口了，两个孩子惊得浑身发抖。这个声音是印第安乔的。屋里沉寂了一阵，乔才又说下去。
    - id: ch03
      title: 楼板下的密谈
      blocks:
        - id: ch03-b01
          speaker: injun_joe
          text: 上游那一桩还不够危险吗？可咱们不是也没出事？
        - id: ch03-b02
          speaker: accomplice
          text: 那不一样。那里远在上游，四周也没有人家。反正咱们没得手，永远不会有人知道咱们试过。
        - id: ch03-b03
          speaker: injun_joe
          text: 那大白天跑来这里就不危险？谁要是看见咱们，都会起疑心。
        - id: ch03-b04
          speaker: accomplice
          text: 我知道。可那桩蠢事没办成以后，这里最方便藏身。我昨天就想走，可那两个该死的孩子一直在山上玩，正好能看清这里，我根本没法出去。
        - id: ch03-b05
          speaker: narrator
          text: 楼上那“两个该死的孩子”又抖了起来。他们庆幸自己因为星期五多等了一天，可这会儿又巴不得当初多等的是一年。
        - id: ch03-b06
          speaker: narrator
          text: 两个男人拿出食物，吃起午饭。长久的沉默以后，印第安乔开口安排下一步。
        - id: ch03-b07
          speaker: injun_joe
          text: 听着，伙计。你回上游去，待在你该待的地方，等我的消息。我再冒一次险进镇探探风声。等我踩过点，觉得时机合适，咱们就去干那桩“危险”的差事。干完以后直奔得克萨斯，咱俩一起溜！
        - id: ch03-b08
          speaker: narrator
          text: 两人都满意这个安排。不久，他们开始打呵欠。
        - id: ch03-b09
          speaker: injun_joe
          text: 我困得要死。现在轮到你放哨了。
        - id: ch03-b10
          speaker: narrator
          text: 乔蜷在杂草里，很快打起鼾来。同伙弄醒了他一两次，他才安静下来。过了一会儿，放哨的人也开始点头，脑袋越垂越低。最后，两个人全都睡着了。
        - id: ch03-b11
          speaker: narrator
          text: 两个孩子如蒙大赦，长长地舒了一口气。
        - id: ch03-b12
          speaker: tom
          text: 机会来了，快跟我走！
        - id: ch03-b13
          speaker: huck
          text: 我不敢。他们要是醒来，我一定会没命的。
          emotion: fearful
        - id: ch03-b14
          speaker: narrator
          text: 汤姆不停地催，哈克却怎么也不肯。最后，汤姆悄悄站起来，想独自离开。可他刚迈一步，破地板便发出一声骇人的尖响。他吓得瘫倒下来，再也没敢试第二次。
        - id: ch03-b15
          speaker: narrator
          text: 他们趴在那里，一个时刻接一个时刻地熬，只觉得时间已经走到尽头，连永恒也渐渐老得发白。后来，孩子们终于看见太阳西沉，心里说不出的感激，总算又有了一点盼头。
        - id: ch03-b16
          speaker: narrator
          text: 一阵鼾声停了。印第安乔坐起来，四处看了看，又阴森森地冲同伙一笑。那人的头已经垂到膝盖上。乔用脚把他弄醒。
        - id: ch03-b17
          speaker: injun_joe
          text: 喂，你可真会放哨啊！不过算了，什么事也没发生。
        - id: ch03-b18
          speaker: accomplice
          text: 哎呀，我刚才睡着了吗？
          emotion: surprised
        - id: ch03-b19
          speaker: injun_joe
          text: 也就睡了一会儿。咱们差不多该走了，伙计。剩下那一点赃物怎么办？
        - id: ch03-b20
          speaker: accomplice
          text: 我看还是像以前一样留在这里吧。等咱们往南走时再带走。六百五十块银元可不好搬。
        - id: ch03-b21
          speaker: injun_joe
          text: 那也行，反正再来一次不费什么事。
        - id: ch03-b22
          speaker: accomplice
          text: 不过下次最好像从前那样，晚上再来。夜里更稳妥。
        - id: ch03-b23
          speaker: injun_joe
          text: 对。可我还不知道什么时候才有机会办那桩事，兴许会出意外。这里也不算稳妥。咱们把东西埋好，再埋深一点。
    - id: ch04
      title: 地下的金箱
      blocks:
        - id: ch04-b01
          speaker: accomplice
          text: 这个主意好，就这么办。
        - id: ch04-b02
          speaker: narrator
          text: 同伙走到房间另一边，跪下来，掀开壁炉后面的一块炉石，从底下取出一只叮当作响的袋子。他拿出二三十块钱留给自己，又给了乔同样多，随后把袋子递过去。乔已经跪在墙角，用猎刀挖起土来。
        - id: ch04-b03
          speaker: narrator
          text: 两个孩子一下就把恐惧和苦恼忘光了。他们两眼放光，贪婪地盯紧下面的每一个动作。这样的好运，简直比他们想象过的一切都辉煌。六百块钱足够让六个孩子都成为富翁，而且这一回连该挖哪里都不用猜，也没有烦人的不确定。两人不停用胳膊肘碰对方。这些碰触不用开口也明白，每一下都在说：“现在你可庆幸咱们来了吧！”
        - id: ch04-b04
          speaker: narrator
          text: 乔的刀突然碰到了东西。
        - id: ch04-b05
          speaker: injun_joe
          text: 咦，这下面有东西。
        - id: ch04-b06
          speaker: accomplice
          text: 你碰到什么了？
        - id: ch04-b07
          speaker: injun_joe
          text: 是块烂了一半的木板。不，我看像是一只箱子。过来搭把手，看看它为什么埋在这儿。算了，我已经弄出一个洞了。
        - id: ch04-b08
          speaker: narrator
          text: 乔把手伸进洞里，又抽了出来。
        - id: ch04-b09
          speaker: injun_joe
          text: 伙计，这里面全是钱！
          emotion: surprised
        - id: ch04-b10
          speaker: narrator
          text: 两个男人察看着手里的硬币。那些全是金币。楼上的孩子和他们一样激动，一样欢喜。
        - id: ch04-b11
          speaker: accomplice
          text: 这活儿很快就能干完。壁炉另一边的墙角里，杂草中有一把生锈的旧镐，我刚才看见了。
        - id: ch04-b12
          speaker: narrator
          text: 他跑过去，拿来的正是孩子们的镐和铁锹。乔接过镐，仔细看了看，摇摇头，又低声嘟囔几句，才开始动手。
        - id: ch04-b13
          speaker: narrator
          text: 箱子很快被挖了出来。它并不算大，外面箍着铁条。当年一定非常结实，只是经过许多年，已经被岁月慢慢侵蚀。两个男人看着这份宝藏，幸福得久久没有说话。
        - id: ch04-b14
          speaker: injun_joe
          text: 伙计，这箱子里有好几千块钱。
        - id: ch04-b15
          speaker: accomplice
          text: 以前总有人说，有一年夏天，默雷尔那帮人常在这里出没。
        - id: ch04-b16
          speaker: injun_joe
          text: 我知道。依我看，这箱钱就是他们的。
        - id: ch04-b17
          speaker: accomplice
          text: 有了这些钱，你就不用去干那桩事了。
        - id: ch04-b18
          speaker: narrator
          text: 印第安乔皱起眉头，眼里燃起一道恶毒的光。
        - id: ch04-b19
          speaker: injun_joe
          text: 你不了解我，至少不知道那桩事的全部底细。那不全是为了抢劫。我是要报仇！这件事还得你帮忙。办完以后，咱们再去得克萨斯。你先回家找南希和孩子们，随时准备着，等我的消息。
          emotion: angry
        - id: ch04-b20
          speaker: accomplice
          text: 好吧，既然你这么说。这箱钱怎么办，再埋回去吗？
        - id: ch04-b21
          speaker: injun_joe
          text: 对，埋回去。不！以伟大的酋长起誓，绝对不行！我差点忘了，那把镐上沾着新鲜泥土！
          emotion: surprised
        - id: ch04-b22
          speaker: narrator
          text: 楼上的孩子先是欣喜若狂，听见那个“不”字，又一下陷进痛苦。等乔说到新鲜泥土，他们更是吓得魂不附体。
        - id: ch04-b23
          speaker: injun_joe
          text: 这里为什么会有一镐一锹？上面为什么会有新鲜泥土？是谁把它们带来的，人又去了哪里？你听见过谁，或者看见过谁吗？要是再把钱埋回去，他们一回来就会发现地面动过。没门儿。咱们把钱带到我的窝里。
        - id: ch04-b24
          speaker: accomplice
          text: 当然，早该想到的。你是说一号窝吗？
        - id: ch04-b25
          speaker: injun_joe
          text: 不是一号，是十字架下面的二号。另一个地方太寻常，不够稳妥。
        - id: ch04-b26
          speaker: accomplice
          text: 好，天已经差不多黑了，可以动身了。
    - id: ch05
      title: 二号的线索
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 印第安乔站起来，挨个走到窗边，小心地往外窥探。过了一会儿，他又望向楼上。
        - id: ch05-b02
          speaker: injun_joe
          text: 谁会把这些工具带来？你说，他们会不会还在楼上？
        - id: ch05-b03
          speaker: narrator
          text: 两个孩子连气也不敢喘。乔把手按在刀上，迟疑片刻，转身朝楼梯走来。楼梯嘎吱作响。孩子们想起那个壁橱，可他们已经吓得浑身无力。
        - id: ch05-b04
          speaker: narrator
          text: 眼看乔一步步逼近，两个吓瘫的孩子终于生出一点决断，正准备跳起来扑向壁橱。忽然，腐朽的木头轰然断裂。印第安乔连同楼梯一起摔回地面，埋进碎木堆里。
        - id: ch05-b05
          speaker: narrator
          text: 乔爬起来，嘴里骂个不停。他的同伙却觉得这番折腾毫无用处。
        - id: ch05-b06
          speaker: accomplice
          text: 要是真有人在楼上，就让他们待着。谁在乎？他们要是想跳下来找麻烦，也没人拦着。再过一刻钟天就黑了，到时候他们爱跟就跟，我没意见。
        - id: ch05-b07
          speaker: accomplice
          text: 依我看，不管是谁把工具扔进来，准是看见了咱们，又把咱们当成鬼怪或魔鬼。我敢打赌，他们现在还在逃命呢。
        - id: ch05-b08
          speaker: narrator
          text: 乔嘟囔了一阵，最后也同意，剩下的天光该用来收拾行装。不久，两人趁暮色越来越浓，抱着珍贵的箱子溜出屋子，朝河边走去。
        - id: ch05-b09
          speaker: narrator
          text: 汤姆和哈克站起来，四肢发软，却总算松了一大口气。他们透过木屋墙上的缝隙，望着两人远去。要他们跟上去？才不呢。只要能回到地面而不摔断脖子，再翻过山头，走上回镇里的路，他们就心满意足了。
        - id: ch05-b10
          speaker: narrator
          text: 两人几乎没说话，只顾痛恨自己，也痛恨那份坏运气。为什么偏偏要把镐和铁锹带进屋呢？要是没有那两件工具，乔根本不会起疑。他原本会把银元和金币一起留下，等报完仇以后才倒霉地发现钱已经不见了。可现在，一切都毁在那两件工具上。真是倒霉透顶！
        - id: ch05-b11
          speaker: narrator
          text: 他们决定留心那个西班牙人。等乔再进镇踩点，准备办那桩报仇的差事，他们就跟踪他到“二号”，不管那是什么地方。可是，一个可怕的念头忽然钻进汤姆脑海。
        - id: ch05-b12
          speaker: tom
          text: 哈克，他说要报仇。你想，他要对付的会不会是咱们？
          emotion: fearful
        - id: ch05-b13
          speaker: huck
          text: 别说了，汤姆！你快把我吓昏了！
          emotion: fearful
        - id: ch05-b14
          speaker: narrator
          text: 两人把这件事翻来覆去地谈。走进镇里时，他们努力相信乔说的也许是别人。退一步说，就算真和他们有关，乔顶多也只会找汤姆，因为只有汤姆上过法庭作证。
        - id: ch05-b15
          speaker: narrator
          text: 可是，只有自己一个人身处险境，给汤姆的安慰实在少得可怜。他觉得，要是有人陪着自己一起担惊受怕，那份安慰就看得见、摸得着，显然会好得多。
