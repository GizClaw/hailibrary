audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    joe_harper:
      display_name: 乔·哈珀
      tts:
        delivery: 直爽好胜，生气时毫不退让
        timbre: 清亮稚嫩
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 忧郁的出走
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 汤姆在小巷里东躲西绕，直到放学回家的学生再也追不上他的踪迹，才闷闷地跑起来。他还把一条小溪来回蹚了两三遍。孩子们都相信，过水能甩掉追踪的人。半小时以后，他绕过卡迪夫山顶的道格拉斯宅邸，身后的校舍已经远得快看不见了。
        - id: ch01-b02
          speaker: narrator
          text: 他钻进一片密林，顺着没有路的地方摸到中央，在一棵大橡树下的苔藓上坐了下来。正午热得死气沉沉，连一丝风也没有，鸟儿也不唱了。整个大自然像昏睡过去。远处偶尔响起啄木鸟笃笃的声音，四周反倒显得更静，也更孤单。
        - id: ch01-b03
          speaker: narrator
          text: 这景象正合汤姆忧郁的心情。他两肘支着膝盖，双手托住下巴，坐了很久。他觉得活着说到底只有麻烦，甚至有些羡慕刚刚离开人世的吉米·霍奇斯。要是能永远躺着睡觉，永远做梦，该多安宁。风会在树间低语，轻抚坟头的花草，再也不会有烦恼来打搅他。
        - id: ch01-b04
          speaker: narrator
          text: 只可惜，他在主日学校里的记录不够清白，不然他倒愿意就这样走了。再想想那个女孩子，汤姆觉得自己什么也没做错。他明明全是好意，她却把他当狗一样对待。她总有一天会后悔，也许到那时已经晚了。唉，要是能让他暂时死上一回就好了！
        - id: ch01-b05
          speaker: narrator
          text: 不过，少年人的心很有弹性，不会长久困在一种心情里。没过多久，汤姆又想起了活人的事情。要是他现在一走了之，神秘地失踪呢？要是他越过大海，去很远很远的陌生国度，再也不回来呢？那个女孩子到时会怎么想？
        - id: ch01-b06
          speaker: narrator
          text: 他想起从前做小丑的志向，如今只觉得厌恶。他的心都升进朦胧又庄严的浪漫世界了，哪能受得了小丑的玩笑和斑点紧身衣？不，他要当一名士兵。许多年后，他会带着满身征战的风霜，功成名就地回来。
        - id: ch01-b07
          speaker: narrator
          text: 可还有更好的。他可以去投奔印第安人，在遥远西部的群山和无边的大平原上猎野牛、打仗。将来，他会成为伟大的酋长，浑身插着羽毛，脸上涂满吓人的油彩。在一个叫人犯困的夏日早晨，他会发出让人胆寒的战吼，猛地闯进主日学校，叫所有同学嫉妒得眼珠发烫。
        - id: ch01-b08
          speaker: narrator
          text: 可这还不是最耀眼的生活。他要当海盗！对，就是海盗！他的前途一下子清楚了，闪着想象不到的光辉。他的名字会传遍世界，让人一听就发抖。他会驾驶一艘又长又低、船身漆黑的快船，名字就叫“风暴之魂号”。船头飘着阴森的旗，船身威风地劈开跳动的海浪。
        - id: ch01-b09
          speaker: narrator
          text: 等到名声最盛的时候，他会突然回到小镇，大步走进教堂。海风和太阳把他的脸磨成棕褐色。他穿着黑天鹅绒紧身上衣和短裤，脚上是高筒长靴，腰间系着猩红绶带。皮带里插满骑兵手枪，身侧挂着被罪恶锈蚀的弯刀，宽边软帽上的羽毛随步子摆动。他会展开画着骷髅和交叉骨的黑旗，心满意足地听大家低声惊呼：“他就是海盗汤姆·索亚！西班牙海域的黑衣复仇者！”
        - id: ch01-b10
          speaker: narrator
          text: 就这么定了。汤姆选好了自己的事业。他要离家出走，当一名海盗，第二天一早就动身。现在，他得把全部财产收拾起来。
    - id: ch02
      title: 失灵的魔法
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 附近有一根腐朽的圆木。汤姆走过去，用巴洛小折刀挖圆木一头下面的泥土。没多久，刀尖碰到木头，声音是空的。他把手伸过去，郑重地念起咒语。
        - id: ch02-b02
          speaker: tom
          text: “没来的，快过来！已经在的，别离开！”
        - id: ch02-b03
          speaker: narrator
          text: 他刨开泥土，看见一块松木瓦片。瓦片下面藏着一座小巧的宝库，底面和四壁都用木瓦铺着。可是里面只有一颗弹珠。汤姆简直不敢相信自己的眼睛。他一边抓头，一边嘟囔。
        - id: ch02-b04
          speaker: tom
          text: “嘿，这可真见鬼了！”
          emotion: surprised
        - id: ch02-b05
          speaker: narrator
          text: 他赌气扔掉弹珠，站着想个没完。这个法术是他和伙伴们都深信不疑的。只要念好咒语，埋下一颗弹珠，两个星期不去碰它，再念刚才那句话把藏处打开，以前丢过的所有弹珠就会自己聚到里面。不管它们原来散得多远，都会回来。
        - id: ch02-b06
          speaker: narrator
          text: 可这一回，法术真的失败了。汤姆的信念从根基上动摇起来。他听过许多成功的故事，从来没听说谁失败。当然，他自己也试过好几次，只是每回都把埋藏的地方忘了。这件事，他偏偏没想起来。
        - id: ch02-b07
          speaker: narrator
          text: 苦想了半天，他认定是女巫从中捣乱，破坏了魔法。为了查个明白，他四下寻找，终于找到一小片沙地。那里有个漏斗形的小凹坑。他趴下来，把嘴凑近坑口喊道。
        - id: ch02-b08
          speaker: tom
          text: “蚁狮，蚁狮，把我想知道的事告诉我！蚁狮，蚁狮，把我想知道的事告诉我！”
        - id: ch02-b09
          speaker: narrator
          text: 沙土动了动。一只黑色的小虫探出头来，转眼又吓得钻了回去。
        - id: ch02-b10
          speaker: tom
          text: “它不敢说！果然是女巫干的，我早就知道。”
        - id: ch02-b11
          speaker: narrator
          text: 汤姆知道，跟女巫斗不会有好结果，只好灰心放弃。可他又想，刚才扔掉的弹珠总得找回来。他耐心找了半天，还是没找到。于是他回到小宝库旁，照着刚才扔弹珠时的姿势站好，从口袋里又掏出一颗，用同样的动作扔了出去。
        - id: ch02-b12
          speaker: tom
          text: “兄弟，快去找你的兄弟！”
        - id: ch02-b13
          speaker: narrator
          text: 汤姆记住新弹珠停在哪里，过去一找，还是没看见原先那颗。也许第一颗滚得近些，也许滚得更远。他又试了两回，最后终于成功。两颗弹珠躺在一起，相隔还不到一英尺。
    - id: ch03
      title: 舍伍德森林的决斗
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这时，一阵玩具铁皮号声远远传来，顺着林间碧绿的长廊飘到汤姆耳边。汤姆立刻脱掉外套和长裤，把一根背带当成腰带。他扒开腐木后面的枝叶，取出藏在那里的弓箭、板条剑和铁皮号角，抓起这些装备就跑。光溜溜的腿飞快迈动，衬衫下摆在身后飘个不停。
        - id: ch03-b02
          speaker: narrator
          text: 跑到一棵大榆树下，他停住脚步，吹响号角作为回应。接着，他踮起脚尖，警惕地朝四面张望，还压低声音吩咐那队并不存在的人马。
        - id: ch03-b03
          speaker: tom
          text: “别动，我的好汉们！全都藏好，等我吹号！”
        - id: ch03-b04
          speaker: narrator
          text: 乔·哈珀出现了。他和汤姆一样，穿得轻便，身上的武器却准备得十分齐全。汤姆立刻高声拦住他。
        - id: ch03-b05
          speaker: tom
          text: “站住！没有我的通行令，是谁胆敢闯进舍伍德森林？”
        - id: ch03-b06
          speaker: joe_harper
          text: “吉斯本的盖伊不需要任何人的通行令。你是谁，竟然……竟然……”
        - id: ch03-b07
          speaker: narrator
          text: 乔忘词了。他们是凭记忆照着书演的，汤姆只好小声提醒。
        - id: ch03-b08
          speaker: tom
          text: “竟敢口出狂言。”
        - id: ch03-b09
          speaker: joe_harper
          text: “你是谁，竟敢对我口出狂言？”
        - id: ch03-b10
          speaker: tom
          text: “你问我是谁？我就是罗宾汉，你这恶贼马上就会知道我的厉害！”
        - id: ch03-b11
          speaker: joe_harper
          text: “原来你就是那个大名鼎鼎的绿林好汉！来吧，我正想跟你争一争这片欢乐森林的通路。看招！”
        - id: ch03-b12
          speaker: narrator
          text: 两个男孩抽出板条剑，把其余装备扔在地上。他们脚抵着脚，摆好击剑架势，严肃又小心地打起来，嘴里还念着“两下上，两下下”。过了一阵，汤姆觉得乔已经掌握了打法。
        - id: ch03-b13
          speaker: tom
          text: “会了吧？那就放开了快打！”
        - id: ch03-b14
          speaker: narrator
          text: 于是，两个人当真快打起来，累得气喘吁吁，浑身冒汗。又打了一会儿，汤姆急了。
        - id: ch03-b15
          speaker: tom
          text: “倒下呀！快倒下！你怎么还不倒？”
        - id: ch03-b16
          speaker: joe_harper
          text: “我才不倒！你为什么不倒？明明是你快要输了。”
        - id: ch03-b17
          speaker: tom
          text: “这根本不算，我不能倒，书里不是这样写的。书上明明说，‘接着，他反手一剑，杀死了可怜的吉斯本的盖伊。’你应该转过身，让我砍你的后背。”
        - id: ch03-b18
          speaker: narrator
          text: 既然书这位权威已经发了话，乔也没有办法。他转过身，重重挨了一下，然后倒在地上。
        - id: ch03-b19
          speaker: joe_harper
          text: “现在轮到你了。你也得让我杀死你，这样才公平。”
        - id: ch03-b20
          speaker: tom
          text: “那不行，书里没有这一段。”
        - id: ch03-b21
          speaker: joe_harper
          text: “那也太卑鄙了，反正就是卑鄙。”
        - id: ch03-b22
          speaker: tom
          text: “那这样吧。你可以演塔克修士，也可以演磨坊主的儿子马奇，拿长棍狠狠揍我。或者我演诺丁汉郡长，你演一会儿罗宾汉，把我杀死。”
    - id: ch04
      title: 最后一箭
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这个安排让乔满意了，他们便把这些冒险一件件演出来。后来，汤姆又当上罗宾汉。故事里的那个修女背叛了他，任由他受伤流血，力气也一点点耗尽。
        - id: ch04-b02
          speaker: narrator
          text: 到了最后，乔一个人扮成整整一群哭泣的绿林好汉。他悲伤地把汤姆拖出来，又把弓塞进汤姆无力的手里。汤姆用临终的口气说出了最后的话。
        - id: ch04-b03
          speaker: tom
          text: “这支箭落在哪里，就把可怜的罗宾汉葬在哪里，让他长眠在绿林树下。”
        - id: ch04-b04
          speaker: narrator
          text: 说完，汤姆射出那支箭，向后一倒，本来打算就此死去。不巧，他正落在一丛荨麻上，立刻一跃而起。一个死人跳得这么欢快，实在很不像话。
        - id: ch04-b05
          speaker: narrator
          text: 两个男孩重新穿好衣服，把全副装备藏起来，这才带着遗憾离开树林。他们惋惜世上已经没有绿林好汉，还纳闷现代文明究竟给了人们什么，能补偿这样大的损失。
        - id: ch04-b06
          speakers: [tom, joe_harper]
          ensemble: duo
          text: “我们宁可在舍伍德森林里做一年绿林好汉，也不愿永远当美国总统。”
