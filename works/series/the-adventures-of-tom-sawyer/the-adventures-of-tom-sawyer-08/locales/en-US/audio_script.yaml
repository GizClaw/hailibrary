audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry sense of humor
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
    tom:
      display_name: Tom
      tts:
        delivery: quick, bold, and mischievous
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    joe_harper:
      display_name: Joe Harper
      tts:
        delivery: spirited, competitive, and playfully dramatic
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: CHAPTER VIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Tom slipped through one lane after another until the children leaving school could no longer follow him. Then he slowed to a gloomy jog. He crossed a little stream two or three times because boys believed that crossing water would throw off anyone chasing them. Half an hour later, he passed behind the Douglas mansion at the top of Cardiff Hill. The schoolhouse was barely visible in the valley below.
        - id: ch01-b02
          speaker: narrator
          text: He pushed deep into the thick woods, picking his way where there was no path, and sat on the moss beneath a wide oak. Not a breath of wind stirred. The dead heat of noon had silenced the birds, and the whole forest seemed to be asleep. Now and then, a woodpecker hammered far away. Each faint sound only made the deep silence and loneliness feel greater.
        - id: ch01-b03
          speaker: narrator
          text: Tom sat there for a long time with his elbows on his knees and his chin in his hands. He brooded. Life seemed like nothing but trouble. He almost envied Jimmy Hodges, who had died not long ago. Tom imagined how peaceful it must be to sleep and dream forever, with the wind moving through the trees and touching the grass and flowers above the grave. Nothing would ever trouble him again. If only his Sunday school record were clean, Tom thought he might be ready to go.
        - id: ch01-b04
          speaker: narrator
          text: And what about that girl? He had done nothing wrong. He had meant well, and she had treated him like a dog. Someday she would be sorry, perhaps when it was too late. If only he could die for a little while!
        - id: ch01-b05
          speaker: narrator
          text: But a young heart does not stay crushed for long. Before Tom knew it, his thoughts had turned back to life. What if he vanished without a word? He could travel beyond the seas to unknown countries and never return. Then how would she feel?
        - id: ch01-b06
          speaker: narrator
          text: He thought again of becoming a clown, but now the idea disgusted him. Jokes, foolish tricks, and spotted tights had no place in the high and mysterious world of his romantic sorrow. He would be a soldier instead. After many years away, he would return famous, honored, and scarred by war.
        - id: ch01-b07
          speaker: narrator
          text: No, he could do better. He would join the Indians, hunt buffalo, and follow the warpath through the mountains and the vast, trackless plains of the West. Far in the future, he would charge into Sunday school on some sleepy summer morning as a mighty chief, bristling with feathers and made fearsome with paint. His terrible war cry would make every other boy stare and burn with envy.
        - id: ch01-b08
          speaker: narrator
          text: Then Tom found an even brighter future. He would be a pirate. That was it. At once, his future shone before him with a glory too great to imagine. The whole world would know his name and tremble at the sound. He would race across the dancing seas in a long, low, black ship called the Spirit of the Storm, with his grim flag flying at the bow.
        - id: ch01-b09
          speaker: narrator
          text: At the height of his fame, he would suddenly return to the old village. He would stride into church, brown from the weather and dressed in a black velvet jacket and trousers, great tall boots, and a crimson sash. Pistols would crowd his belt. A cutlass stained by his crimes would hang at his side. Long feathers would wave from his slouched hat, and he would carry an open black flag marked with a skull and crossbones. He would listen with rising delight as people whispered in awe.
        - id: ch01-b10
          speaker: narrator
          text: "It's Tom Sawyer the Pirate, the Black Avenger of the Spanish Main!"
        - id: ch01-b11
          speaker: narrator
          text: That settled it. Tom would run away and become a pirate. He would leave the next morning, so he had to gather his supplies at once.
        - id: ch01-b12
          speaker: narrator
          text: Near him lay a rotting log. Tom dug beneath one end with his Barlow knife until he struck something that sounded hollow. He reached into the hole and spoke the charm in his most impressive voice.
        - id: ch01-b13
          speaker: tom
          text: "Whatever isn't here, come here! Whatever is here, stay here!"
        - id: ch01-b14
          speaker: narrator
          text: He scraped off the dirt and uncovered a pine shingle. Beneath it was a neat little treasure box lined with shingles. Inside lay one marble. Tom stared at it in complete astonishment and scratched his head.
        - id: ch01-b15
          speaker: tom
          text: "Well, I never saw anything like that!"
          emotion: surprised
        - id: ch01-b16
          speaker: narrator
          text: He threw the marble away in annoyance and stood thinking. The charm was supposed to be perfect. Tom and all the other boys trusted it completely. Any boy knew that if you buried a marble with the required words, left it alone for two weeks, and then opened the hiding place with the proper charm, every marble you had ever lost would gather there by itself. It did not matter how widely they had been scattered. Yet this time, Tom's charm had plainly failed, and his whole faith in it began to shake.
        - id: ch01-b17
          speaker: narrator
          text: He had heard many stories of the trick working and none of it failing. He forgot that he had tried it before but had never managed to find his hiding places again. At last, he decided a witch must have broken the charm.
        - id: ch01-b18
          speaker: narrator
          text: Tom searched until he found a small dip shaped like a funnel in a patch of sand. He lay down, put his mouth close to it, and called into the hole.
        - id: ch01-b19
          speaker: tom
          text: "Doodlebug, doodlebug, tell me what I need to know! Doodlebug, doodlebug, tell me what I need to know!"
        - id: ch01-b20
          speaker: narrator
          text: The sand shifted. A little black bug showed itself for one moment, then darted underground in fright.
        - id: ch01-b21
          speaker: tom
          text: "He won't tell me! So a witch did do it. I knew it."
        - id: ch01-b22
          speaker: narrator
          text: Tom knew there was no use fighting witches, and he gave up in discouragement. Then he remembered the marble he had thrown away. He searched patiently but could not find it.
        - id: ch01-b23
          speaker: narrator
          text: He went back to the treasure box and stood exactly where he had stood before. Taking a second marble from his pocket, he tossed it the same way.
        - id: ch01-b24
          speaker: tom
          text: "Brother, go and find your brother!"
        - id: ch01-b25
          speaker: narrator
          text: Tom watched where the second marble stopped, then searched nearby. Perhaps it had not gone far enough, or perhaps it had gone too far. He tried twice more. On the last try, the trick worked. The two marbles lay less than a foot apart.
        - id: ch01-b26
          speaker: narrator
          text: Just then, the faint blast of a toy tin trumpet came through the long green paths between the trees. Tom pulled off his jacket and trousers and turned one suspender into a belt. He swept aside some brush behind the rotten log. Hidden there were a rough bow and arrow, a thin wooden sword, and a tin trumpet. A moment later, he had seized the whole collection and was racing away barefoot, his loose shirt fluttering behind him.
        - id: ch01-b27
          speaker: narrator
          text: Beneath a great elm, Tom stopped and blew an answer. Then he crept about, peering carefully in every direction. He spoke softly to a company that existed only in his imagination.
        - id: ch01-b28
          speaker: tom
          text: "Stay hidden, my merry men! Wait until I sound the trumpet."
        - id: ch01-b29
          speaker: narrator
          text: Joe Harper appeared, dressed as lightly as Tom and armed just as grandly.
        - id: ch01-b30
          speaker: tom
          text: "Stop there! Who enters Sherwood Forest without my permission?"
        - id: ch01-b31
          speaker: joe_harper
          text: "Guy of Guisborne asks permission from no man. Who are you to... to..."
        - id: ch01-b32
          speaker: narrator
          text: The boys were speaking from memory, exactly as the book had taught them. Tom supplied the missing words.
        - id: ch01-b33
          speaker: tom
          text: "To speak to me that way."
        - id: ch01-b34
          speaker: joe_harper
          text: "Who are you to speak to me that way?"
        - id: ch01-b35
          speaker: tom
          text: "You want my name? I am Robin Hood, and your worthless hide will soon know it!"
        - id: ch01-b36
          speaker: joe_harper
          text: "So you are the famous outlaw! Then I'll gladly fight you for the paths through this merry forest. Defend yourself!"
        - id: ch01-b37
          speaker: narrator
          text: They dropped their bows, trumpets, and other gear on the ground. Then they drew their wooden swords and stood foot to foot in fighting poses. With grave care, they began the proper pattern from the story, two strokes up and two strokes down.
        - id: ch01-b38
          speaker: tom
          text: "All right, you know how it goes. Now fight faster!"
        - id: ch01-b39
          speaker: narrator
          text: They fought faster, panting and sweating with the effort. Before long, Tom shouted at Joe.
        - id: ch01-b40
          speaker: tom
          text: "Fall down! Why aren't you falling?"
        - id: ch01-b41
          speaker: joe_harper
          text: "I won't! Why don't you fall? I'm beating you."
        - id: ch01-b42
          speaker: tom
          text: "That doesn't matter. I can't fall because the book doesn't say I do. It says, 'Then one backward stroke killed poor Guy of Guisborne.' You have to turn around so I can hit your back."
        - id: ch01-b43
          speaker: narrator
          text: There was no arguing with the book. Joe turned around, took the blow, and fell. Then he got up again.
        - id: ch01-b44
          speaker: joe_harper
          text: "Now you have to let me kill you. That's only fair."
        - id: ch01-b45
          speaker: tom
          text: "I can't. The book doesn't have it happen that way."
        - id: ch01-b46
          speaker: joe_harper
          text: "Well, that's just plain mean."
        - id: ch01-b47
          speaker: tom
          text: "Look, Joe, you can be Friar Tuck or Much the miller's son and beat me with a staff. Or I can be the Sheriff of Nottingham. You can play Robin Hood for a while and kill me."
        - id: ch01-b48
          speaker: narrator
          text: Joe liked that solution, so they played out each of those adventures. Then Tom became Robin Hood once more. In the next part of the story, a treacherous nun let his strength bleed away through a wound she had left untreated. At last, Joe played a whole band of grieving outlaws. He dragged Tom forward sadly, placed the bow in his weakening hands, and prepared to hear the dying hero's last words.
        - id: ch01-b49
          speaker: tom
          text: "Bury poor Robin Hood beneath the greenwood tree, wherever this arrow lands."
        - id: ch01-b50
          speaker: narrator
          text: Tom shot the arrow and fell backward to die. But he landed on a nettle and sprang up far too quickly for a dead man.
        - id: ch01-b51
          speaker: narrator
          text: The boys dressed, hid their weapons and costumes, and walked away. They mourned the fact that outlaws no longer existed and wondered what modern civilization could possibly have given the world in return. They agreed that one year as outlaws in Sherwood Forest would be better than serving forever as President of the United States.
