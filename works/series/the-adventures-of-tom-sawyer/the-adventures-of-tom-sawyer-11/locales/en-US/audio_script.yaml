  chapters:
    - id: ch01
      title: CHAPTER XI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Just before noon, dreadful news jolted the whole village. No one had even dreamed of the telegraph yet, but the story raced from person to person, group to group, and house to house almost as fast as a wire could have carried it. The schoolmaster naturally dismissed school for the afternoon. The town would have found it very strange if he had not.
        - id: ch01-b02
          speaker: narrator
          text: A bloody knife had been found beside the murdered man. Someone recognized it as Muff Potter's, or so the story went. People also said that a man out late had seen Potter washing in the branch around one or two that morning. Potter had slipped away as soon as he was spotted. That looked very suspicious, especially since washing was not one of Potter's habits.
        - id: ch01-b03
          speaker: narrator
          text: The town had already been searched for the man everyone now called the murderer, but he was nowhere to be found. Riders had galloped away along every road. The sheriff was confident they would catch Potter before night. The public had sorted through the evidence and reached its verdict with remarkable speed.
        - id: ch01-b04
          speaker: narrator
          text: Everyone drifted toward the graveyard. Tom's heartbreak disappeared, and he went with them. He would have preferred almost any other place, yet a terrible fascination pulled him along. At the graveyard, he squeezed his small body through the crowd until he could see the grim sight. It felt as if years had passed since he had last stood there.
        - id: ch01-b05
          speaker: narrator
          text: Someone pinched Tom's arm. He turned and found Huckleberry looking back at him. Both boys instantly looked away. Each wondered whether anyone had noticed that glance. But the whole crowd was talking and staring at what lay before them.
        - id: ch01-b06
          speakers: [villager_1, villager_2, villager_3, villager_4]
          ensemble: chorus
          text: "Poor fellow! Poor young man! Let this teach those grave robbers a lesson! Muff Potter will hang if they catch him!"
        - id: ch01-b07
          speaker: minister
          text: "This is God's judgment. His hand is in it."
        - id: ch01-b08
          speaker: narrator
          text: Then Tom saw Injun Joe's unmoving face and shivered from head to foot. At that moment, the crowd began to push and sway.
        - id: ch01-b09
          speakers: [villager_1, villager_2]
          ensemble: duo
          text: "That's him! That's him! He's coming here himself!"
          emotion: surprised
        - id: ch01-b10
          speakers: [villager_3, villager_4]
          ensemble: duo
          text: "Who is it? Who?"
        - id: ch01-b11
          speaker: villager_1
          text: "It's Muff Potter!"
        - id: ch01-b12
          speaker: villager_3
          text: "Wait, he's stopped! Look out, he's turning around! Don't let him escape!"
        - id: ch01-b13
          speaker: narrator
          text: People perched in the tree branches above Tom said Potter was not trying to escape. He only seemed uncertain and confused.
        - id: ch01-b14
          speaker: bystander
          text: "What nerve! I suppose he came back for a peaceful look at his own work and didn't expect to find company."
        - id: ch01-b15
          speaker: narrator
          text: The crowd parted. The sheriff came through with a show of leading Potter by the arm. Potter's face was haggard, and fear filled his eyes. When he stood before the murdered man, his whole body shook. He covered his face with his hands and burst into tears.
        - id: ch01-b16
          speaker: muff_potter
          text: "Friends, I didn't do this. I swear on my word and honor, I never did it."
          emotion: fearful
        - id: ch01-b17
          speaker: villager_2
          text: "Who said anyone accused you?"
        - id: ch01-b18
          speaker: narrator
          text: The question struck home. Potter raised his face and looked around with hopelessness in his eyes. Then he saw Injun Joe.
        - id: ch01-b19
          speaker: muff_potter
          text: "Oh, Injun Joe, you promised me you would never..."
          emotion: fearful
        - id: ch01-b20
          speaker: sheriff
          text: "Is this your knife?"
        - id: ch01-b21
          speaker: narrator
          text: The sheriff thrust the knife in front of him. Potter would have fallen if people had not caught him and lowered him to the ground.
        - id: ch01-b22
          speaker: muff_potter
          text: "Something warned me that if I didn't come back and get..."
          emotion: fearful
        - id: ch01-b23
          speaker: narrator
          text: He shuddered. Then his limp hand made a defeated little motion.
        - id: ch01-b24
          speaker: muff_potter
          text: "Tell them, Joe. Go on and tell them. There's no use anymore."
          emotion: sad
        - id: ch01-b25
          speaker: narrator
          text: Tom and Huckleberry stood silent, staring, while the hard-hearted liar calmly told his story. The boys kept waiting for lightning to fall from the clear sky and strike him. They could not understand why it took so long. Yet Joe finished speaking and remained alive and unharmed.
        - id: ch01-b26
          speaker: narrator
          text: The boys had almost found the courage to break their oath and save the poor man Joe had betrayed. Now that courage vanished. Surely, they thought, Joe had sold himself to Satan. Meddling with someone protected by such a power would be deadly.
        - id: ch01-b27
          speaker: villager_4
          text: "Why didn't you stay away? What made you come back here?"
        - id: ch01-b28
          speaker: muff_potter
          text: "I couldn't stop myself. I wanted to run, but every way I turned seemed to bring me right back here."
          emotion: sad
        - id: ch01-b29
          speaker: narrator
          text: Potter began sobbing again. A few minutes later, at the inquest, Injun Joe repeated the same statement under oath. He spoke just as calmly as before. Once again, no lightning came. That settled it for the boys. Joe had sold himself to the devil.
        - id: ch01-b30
          speaker: narrator
          text: To Tom and Huck, he had become the most dreadful and fascinating person they had ever seen. They could not pull their eyes away from his face. They privately decided to watch him at night whenever they got the chance. Perhaps they might catch a glimpse of his terrible master.
        - id: ch01-b31
          speaker: narrator
          text: Injun Joe helped lift the murdered man's body into a wagon. A whisper moved through the shuddering crowd. The wound had bled a little. Tom and Huck thought this welcome sign would point suspicion toward Joe at last, but it did not.
        - id: ch01-b32
          speaker: bystander
          text: "It started bleeding when the body was less than three feet from Muff Potter."
        - id: ch01-b33
          speaker: narrator
          text: For the next week, Tom's terrible secret and his biting conscience troubled his sleep. Then one morning at breakfast, Sid spoke up.
        - id: ch01-b34
          speaker: sid
          text: "Tom, you toss around and talk so much in your sleep that you keep me awake half the night."
        - id: ch01-b35
          speaker: narrator
          text: Tom went pale and lowered his eyes.
        - id: ch01-b36
          speaker: aunt_polly
          text: "That's a bad sign. What have you got on your mind, Tom?"
        - id: ch01-b37
          speaker: tom
          text: "Nothing. Nothing I know about."
        - id: ch01-b38
          speaker: narrator
          text: But his hand shook so badly that he spilled his coffee.
        - id: ch01-b39
          speaker: sid
          text: "And the things you say! Last night you kept saying, 'It's blood. That's what it is. It's blood.' Then you said, 'Stop tormenting me. I'll tell!' What are you going to tell, Tom?"
        - id: ch01-b40
          speaker: narrator
          text: The room seemed to swim before Tom's eyes. No one could say what might have happened next. Luckily, the worry left Aunt Polly's face, and without knowing it, she came to his rescue.
        - id: ch01-b41
          speaker: aunt_polly
          text: "Sho! It's only that dreadful murder. I dream about it nearly every night myself. Sometimes I even dream that I did it."
        - id: ch01-b42
          speaker: narrator
          text: Mary said the murder had affected her much the same way. Sid seemed satisfied. Tom escaped as quickly as he could without making it look suspicious. After that, he claimed to have a toothache for a week and tied up his jaws every night.
        - id: ch01-b43
          speaker: narrator
          text: Tom never knew that Sid watched him night after night. Sid often slipped the bandage loose, propped himself on one elbow, and listened for a long while. Then he carefully put the bandage back. Little by little, Tom's distress eased. The pretend toothache became tiresome, so he gave it up. If Sid understood anything from Tom's broken muttering, he kept it to himself.
        - id: ch01-b44
          speaker: narrator
          text: Tom felt as if his schoolmates would never stop holding inquests over dead cats and bringing his misery back to mind. Sid noticed that Tom never served as coroner, though Tom usually led every new game. He also noticed that Tom never played a witness. Stranger still, Tom clearly hated these inquests and stayed away whenever he could.
        - id: ch01-b45
          speaker: narrator
          text: Sid wondered about all of this, but said nothing. At last, even inquests fell out of fashion and stopped tormenting Tom's conscience.
        - id: ch01-b46
          speaker: narrator
          text: Every day or two during that unhappy time, Tom waited for a chance to visit the little barred window of the jail. He passed through whatever small comforts he could find for the man everyone called the murderer. The jail was only a tiny brick den in a marsh at the edge of the village. It had no guards because it was hardly ever used. Tom's gifts did a great deal to quiet his conscience.
        - id: ch01-b47
          speaker: narrator
          text: The villagers badly wanted to punish Injun Joe for stealing the body. They talked of covering him with tar and feathers and riding him out on a rail. But Joe frightened them so much that no one would lead the way, and the plan was dropped.
        - id: ch01-b48
          speaker: narrator
          text: In both statements at the inquest, Joe had carefully begun with the fight. He never admitted that the grave robbery had come first. For the time being, everyone decided it would be wiser not to take that matter to court.
