audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的调侃
        timbre: 清朗圆润
        pace: 舒缓中有活泼转折
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵大胆，淘气又争强
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
    joe:
      display_name: 乔
      tts:
        delivery: 认真热烈，带着孩子气的悲壮和兴奋
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
    huck:
      display_name: 哈克
      tts:
        delivery: 随性直率，语气粗朴而自在
        timbre: 微哑稚嫩
        pace: 从容
        pitch: 中音
    becky:
      display_name: 贝琪
      tts:
        delivery: 天真敏感，情绪真挚而克制
        timbre: 清甜稚嫩
        pace: 轻缓
        pitch: 高音
    child:
      display_name: 一个孩子
      tts:
        delivery: 一本正经，带着孩子气的郑重
        timbre: 清亮稚嫩
        pace: 适中
        pitch: 中高音
    boy:
      display_name: 一个男孩
      tts:
        delivery: 直率稚气，忍不住有些得意
        timbre: 明亮稚嫩
        pace: 适中
        pitch: 中高音
    aunt_polly:
      display_name: 波莉姨妈
      tts:
        delivery: 心直口快，严厉里藏着深厚疼爱
        timbre: 温厚而有力
        pace: 适中
        pitch: 中音
    minister:
      display_name: 牧师
      tts:
        delivery: 庄重虔诚，情感充沛
        timbre: 浑厚清晰
        pace: 沉稳
        pitch: 中低音
  chapters:
    - id: ch01
      title: 小镇的哀悼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 星期六下午，小镇宁静依旧，却再也听不见半点欢乐。哈珀家和波莉姨妈一家都穿上了丧服，沉浸在眼泪和悲痛里。整个村子平时已经很安静，这天更是静得反常。大人办事心不在焉，很少开口，只会不时叹气。孩子们也觉得这个星期六的假日沉甸甸的，玩什么都提不起精神，最后一个个停了下来。
        - id: ch01-b02
          speaker: narrator
          text: 贝琪·撒切尔独自来到空荡荡的学校院子。她满心难过，却找不到一点安慰，只好低声对自己说话。
        - id: ch01-b03
          speaker: becky
          text: “要是那个黄铜柴架头还在就好了！可我现在连一件能让我想起他的东西都没有。”
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: 贝琪哽咽着忍住哭声。走了几步，她又在一处地方停下来。
        - id: ch01-b05
          speaker: becky
          text: “就是这里。要是能重新来一次，我绝不会再说那句话，拿全世界来换也不说。可他已经走了，我永远、永远、永远见不到他了。”
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: 这个念头把她压垮了。贝琪任眼泪滚过脸颊，独自走开。一大群汤姆和乔的玩伴随后来到尖木条围栏外。他们用敬畏的口气回忆，最后一次看见两个男孩时，汤姆做过什么，乔又说过什么。原本不起眼的小事，如今听来都成了可怕的预兆。每个人还要指出男孩当时站的准确位置，再讲讲自己离他们有多近。
        - id: ch01-b07
          speaker: child
          text: “我当时就这么站着，和现在一样。你就当自己是他吧。我离他只有这么近，他还这样冲我笑了一下。接着，我浑身像有个怪吓人的东西掠过去。当时我当然不懂，现在可全明白了！”
        - id: ch01-b08
          speaker: narrator
          text: 接下来，孩子们争着说自己才是最后见过死者的人。好多人都想得到这份阴森的光荣，拿出的证据也多少改动过。等大家终于认定谁最后见过两个男孩，还和他们说过最后一句话，那几个幸运儿顿时显得神圣起来，叫其余的人又羡慕又惊叹。一个拿不出别的事迹的男孩，也得意地贡献了一段回忆。
        - id: ch01-b09
          speaker: boy
          text: “汤姆·索亚以前揍过我一回。”
        - id: ch01-b10
          speaker: narrator
          text: 可惜，大多数男孩都有同样的经历，这份光荣也就不值钱了。孩子们慢慢散开，嘴里仍在肃然谈论那两位失踪的英雄。
    - id: ch02
      title: 自己的葬礼
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天早晨，主日学校一结束，教堂便不再像平时那样鸣钟，而是一声声敲起丧钟。这个安息日静得出奇，那悲凉的钟声正合四周沉思般的寂静。村民们陆续赶来，在门厅里停一会儿，低声谈论这场悲剧。教堂里面却没有人耳语，只有妇女入座时，丧服偶尔发出窸窣声。谁也不记得小教堂有哪一天坐得这样满。
        - id: ch02-b02
          speaker: narrator
          text: 众人在沉默中等待，谁也不出声。波莉姨妈终于走进来，席德和玛丽跟在身后，再后面是哈珀一家。哀悼的人全身黑衣。会众和老牧师一起肃然起立，等他们在前排坐好。教堂再次安静下来，只有压低的哭声偶尔响起。牧师张开双手祷告，众人唱了一首动人的赞美诗，随后听见了当天的经文。
        - id: ch02-b03
          speaker: minister
          text: “复活在我，生命也在我。”
        - id: ch02-b04
          speaker: narrator
          text: 礼拜继续进行。牧师讲起两个亡故男孩的美德、讨人喜欢的性情，还有他们难得的前程。每个人都觉得，他说的正是自己认识的孩子，心里也跟着一痛。因为从前，他们一次次故意看不见这些优点，也一次次只盯着两个可怜孩子的毛病和缺点。
        - id: ch02-b05
          speaker: narrator
          text: 牧师又讲了许多感人的旧事，说这些事足以看出他们有多温柔、多慷慨。现在听来，每一件都无比高尚美好。可是事情发生时，大伙儿只当那是十足的恶作剧，觉得他们活该挨一顿皮鞭。哀婉的故事一桩接着一桩，会众越来越难过。最后，所有人都和两家亲属一起发出痛苦的哭声，连牧师也控制不住自己，站在讲坛上哭了起来。
        - id: ch02-b06
          speaker: narrator
          text: 楼座里传来一阵窸窣声，谁也没有注意。过了一会儿，教堂门吱呀一响。牧师从手帕上方抬起满是泪水的眼睛，一下子呆住了。人们一双双眼睛跟着望过去，随即几乎同时站起身来，目不转睛地盯着过道。
        - id: ch02-b07
          speaker: narrator
          text: 三个死去的男孩正沿着过道走来！汤姆在最前面，乔跟在后面，哈克一身破布耷拉着，害羞地缩起身子，偷偷摸摸走在最后。原来，他们一直藏在没人使用的楼座里，把自己的葬礼和悼词从头听到了尾。
    - id: ch03
      title: 失而复得
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 波莉姨妈、玛丽和哈珀一家扑向失而复得的孩子，用亲吻把他们淹没，感激的话说个不停。可怜的哈克却又窘迫又不自在，不知道该怎么办。周围有那么多并不欢迎他的目光，他连往哪里躲都不知道。哈克犹豫片刻，正要悄悄溜走，汤姆一把拉住了他。
        - id: ch03-b02
          speaker: tom
          text: “波莉姨妈，这不公平。总得有人见到哈克也高兴呀。”
        - id: ch03-b03
          speaker: aunt_polly
          text: “当然有人高兴。我就很高兴看见他，这个没娘疼的可怜孩子！”
        - id: ch03-b04
          speaker: narrator
          text: 波莉姨妈立刻把满腔疼爱都给了哈克。世上再没有别的办法，能让他比刚才更加不自在。
    - id: ch04
      title: 一生最得意的时刻
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 牧师忽然扯开嗓门高喊起来。
        - id: ch04-b02
          speaker: minister
          text: “万福之源，赞美上帝！唱起来，把你们的心都唱进去！”
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: 大家果真放声唱了。《老百篇》像胜利的洪流一样涌起，震得教堂屋梁都在颤动。海盗汤姆·索亚环顾那些满眼羡慕的孩子，心里承认，这是他一生中最得意的时刻。
        - id: ch04-b04
          speaker: narrator
          text: 上了当的会众鱼贯走出教堂时纷纷说，要是还能听见一次这样的《老百篇》，他们简直情愿再受一回愚弄，再让自己当众显得可笑一回。
        - id: ch04-b05
          speaker: narrator
          text: 那一天，波莉姨妈的心情变来变去。汤姆挨的巴掌和得到的亲吻，比过去一整年挣来的还多。他简直弄不明白，究竟哪一样更能表达姨妈对上帝的感激，哪一样又更能表达她对自己的疼爱。
