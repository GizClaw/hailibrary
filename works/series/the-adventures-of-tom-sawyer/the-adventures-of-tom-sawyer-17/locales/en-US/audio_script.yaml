  chapters:
    - id: ch01
      title: CHAPTER XVII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: That quiet Saturday afternoon, there was no laughter in the little town. The Harpers and Aunt Polly's family were being dressed in mourning, amid bitter grief and many tears. The village was usually quiet enough, but now an uncommon stillness lay over it. People went about their business as if their minds were somewhere else. They spoke little and sighed often. Even the Saturday holiday felt heavy to the children. They had no heart for their games, and one by one, they stopped playing.
        - id: ch01-b02
          speaker: narrator
          text: That afternoon, Becky Thatcher wandered into the empty schoolyard. She was miserable, and there was nothing there to comfort her. She spoke softly to herself.
        - id: ch01-b03
          speaker: becky
          text: "Oh, I wish I had a brass knob from an andiron again. Now I don't have anything to remember him by."
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: She had to swallow a small sob. After a while, she stopped at one particular place and spoke again.
        - id: ch01-b05
          speaker: becky
          text: "It happened right here. If I could do it over, I would never say that to him. I wouldn't say it for anything in the world. But he's gone. I'll never, never, never see him again."
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: That thought was too much for her. She walked away with tears running down her cheeks.
        - id: ch01-b07
          speaker: narrator
          text: Then a group of Tom's and Joe's playmates came along. They stood by the fence and spoke in hushed voices about the last time they had seen the boys. They recalled every little thing Tom had done and every stray remark Joe had made. Those ordinary moments sounded like dreadful warnings now. Each child pointed to the exact place where one of the missing boys had stood.
        - id: ch01-b08
          speaker: schoolchild
          text: "I was standing just like this, exactly where I am now. Pretend you're him. I was this close when he smiled at me, just this way. Then I felt something strange go right through me. It was awful. I didn't understand it then, but now I do."
        - id: ch01-b09
          speaker: narrator
          text: Soon they began arguing over who had seen the dead boys last. A great many claimed the gloomy honor, and each one offered evidence that had been improved here and there. At last, they settled who had truly seen Tom and Joe last and spoken the final words to them. Those fortunate children took on a sacred importance. Everyone else stared at them with envy.
        - id: ch01-b10
          speaker: narrator
          text: One poor boy had no greater memory to offer, but he spoke with unmistakable pride.
        - id: ch01-b11
          speaker: beaten_boy
          text: "Well, Tom Sawyer beat me up once."
        - id: ch01-b12
          speaker: narrator
          text: That attempt at glory failed. Most of the boys could say the same thing, so the honor was much too common. The group finally drifted away, still trading memories of the lost heroes in awed voices.
        - id: ch01-b13
          speaker: narrator
          text: The next morning, when Sunday school ended, the church bell began to toll instead of giving its usual ring. The Sabbath was utterly still, and that mournful sound suited the thoughtful hush over everything. Villagers gathered at the church. They lingered in the entrance, whispering about the sad event. Inside, no one whispered. Only the funeral rustle of women's dresses disturbed the silence as they took their seats. No one could remember seeing the little church so full.
        - id: ch01-b14
          speaker: narrator
          text: At last, the whole room fell into a waiting silence. Aunt Polly came in with Sid and Mary behind her. The Harper family followed, and every one of them wore deep black. The entire congregation rose, along with the old minister, and remained standing until the mourners sat in the front pew.
        - id: ch01-b15
          speaker: narrator
          text: Silence settled again, broken now and then by a muffled sob. The minister spread his hands and prayed. Then everyone sang a moving hymn.
        - id: ch01-b16
          speaker: minister
          text: "I am the Resurrection and the Life."
        - id: ch01-b17
          speaker: narrator
          text: As the service went on, the minister spoke of the lost boys' goodness, their winning ways, and all the promise they had shown. Everyone there felt sure they recognized the boys he described. It hurt to remember how they had always overlooked those fine qualities and noticed only the poor boys' faults.
        - id: ch01-b18
          speaker: narrator
          text: The minister also told touching stories that showed how sweet and generous Tom and Joe had been. Now the people could easily see how noble those moments were. Yet when the things had actually happened, they had looked like pure mischief, deserving a whipping.
        - id: ch01-b19
          speaker: narrator
          text: The sorrow in the church kept rising. At last, the whole congregation broke down. They joined the grieving families in great, painful sobs. Even the minister gave in and wept in the pulpit.
        - id: ch01-b20
          speaker: narrator
          text: A rustle came from the gallery, but no one noticed. A moment later, the church door creaked. The minister lifted his streaming eyes above his handkerchief and froze. One person after another followed his stare. Then almost everyone rose at once and looked on as the three dead boys marched up the aisle.
        - id: ch01-b21
          speaker: narrator
          text: Tom led the way, with Joe behind him. Huck came last, creeping along shyly in his drooping rags. The boys had been hiding in the unused gallery, listening to their own funeral sermon.
        - id: ch01-b22
          speaker: narrator
          text: Aunt Polly, Mary, and the Harpers threw themselves upon Tom and Joe. They covered them with kisses and poured out their thanks. Poor Huck stood to one side, ashamed and uncomfortable. With so many unfriendly eyes upon him, he did not know what to do or where to hide. He hesitated, then began to slip away. Tom caught hold of him.
        - id: ch01-b23
          speaker: tom
          text: "Aunt Polly, that isn't fair. Somebody ought to be happy Huck came back."
        - id: ch01-b24
          speaker: aunt_polly
          text: "And somebody will be. I'm glad to see him, the poor motherless boy!"
        - id: ch01-b25
          speaker: narrator
          text: Aunt Polly showered Huck with loving attention. It was the one thing that could make him even more uncomfortable than he had been before.
        - id: ch01-b26
          speaker: minister
          text: "Praise God, from whom all blessings flow! Sing, and put your hearts into it!"
          emotion: happy
        - id: ch01-b27
          speaker: narrator
          text: And everyone did. Old Hundred rose in one great, triumphant burst and shook the rafters. Tom Sawyer the Pirate looked around at all the children who envied him. In his heart, he knew this was the proudest moment of his life.
        - id: ch01-b28
          speaker: narrator
          text: The congregation had been thoroughly fooled. As they filed out, people said they would almost agree to be made ridiculous again, if only they could hear Old Hundred sung that way one more time.
        - id: ch01-b29
          speaker: narrator
          text: That day, Tom received more cuffs and kisses than he had earned in the whole year before, as Aunt Polly's mood swung back and forth. He could hardly tell which showed more gratitude to God and affection for him.
