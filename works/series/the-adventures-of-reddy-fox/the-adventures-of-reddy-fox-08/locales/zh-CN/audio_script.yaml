audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 小狐狸雷迪
      tts:
        delivery: 年轻直率，遇到危险时慌张急促
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 中高音
    granny_fox:
      display_name: 狐奶奶
      tts:
        delivery: 老练果断，话里常带一点机智的笑意
        timbre: 温厚略带沙哑
        pace: 沉稳
        pitch: 中低音
    blacky_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 机灵尖锐，取笑别人时毫不客气
        timbre: 清亮略带沙哑
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第八章　狐奶奶照料雷迪
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 雷迪浑身疼，腿也瘸了，几乎连挪都挪不动。为了甩开猎犬鲍泽，他拼命跑出一段路，又绕来绕去，把自己的气味搅乱，叫鲍泽再也追不下去。这一路可着实费了他好大的力气。等他一瘸一拐地回到家，大颗的眼泪已经顺着鼻子滚下来。雷迪拼命忍着，可刚爬进家门，还是痛苦地哼哼起来。
        - id: ch01-b02
          speaker: reddy_fox
          text: 哎哟！哎哟！哎哟！
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 狐奶奶正晒着太阳睡午觉，这会儿才刚醒。她一听见声音，立刻没好气地问他。
        - id: ch01-b04
          speaker: granny_fox
          text: 这回又出什么事啦？
        - id: ch01-b05
          speaker: reddy_fox
          text: 我……我受伤了。
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: 雷迪哭得更厉害了。狐奶奶严厉地打量他，一边走近察看伤口，一边数落起来。
        - id: ch01-b07
          speaker: granny_fox
          text: 你这回又干了什么？是在铁丝网上扯破了衣裳，还是钻进牛刺藤丛里去了？你都长这么大了，也该会照顾自己了！
          emotion: angry
        - id: ch01-b08
          speaker: reddy_fox
          text: 求求您别骂了，狐奶奶，求求您别骂我。
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: 雷迪不只是腿瘸。现在，他的胃里也开始难受，伤口更是火辣辣地疼。狐奶奶只看了一眼，就明白出了什么事。她让雷迪伸直身子趴好，仔仔细细地洗净每一处伤口，再替他包扎起来。碰到疼痛的地方时，她的动作轻得很，可她那张嘴呀，从头到尾都没停过。那张嘴可不轻柔。哎呀，一点儿也不！
        - id: ch01-b10
          speaker: narrator
          text: 狐奶奶既聪明，又机警老练。她一看就知道，雷迪身上的伤是枪里打出的弹丸造成的。雷迪准是粗心了，不然绝不会跑到可能挨枪子的地方去。
        - id: ch01-b11
          speaker: granny_fox
          text: 我真希望这回能让你长个教训！眼睛、耳朵和鼻子是干什么用的？就是让你避开这种麻烦的。
          emotion: angry
        - id: ch01-b12
          speaker: granny_fox
          text: 小狐狸，眼睛亮，若不仔细要遭殃。小狐狸，耳朵灵，声声都要听分明。小狐狸，鼻子尖，走到哪儿都嗅风向。眼耳鼻子一起用，才能长到我这般。
        - id: ch01-b13
          speaker: granny_fox
          text: 好了，雷迪，现在把事情从头到尾说给我听。眼下是夏天，人们并不猎狐狸。布朗农夫的儿子怎么会拿着枪等你呢？我实在想不明白。
        - id: ch01-b14
          speaker: narrator
          text: 雷迪便说，他跑得离那截老树干太近了，而布朗农夫的儿子就藏在树后。可他没有说，自己当时正忙着向大家卖弄。更没有说，他在光天化日之下偷了那孩子心爱的小鸡。你尽可以相信，这两件事，雷迪小心地一个字也没提。
        - id: ch01-b15
          speaker: narrator
          text: 狐奶奶皱起眉头，想了又想。她要找出一个说得通的理由，弄明白那孩子为什么会在夏天出来打猎。
        - id: ch01-b16
          speaker: blacky_crow
          text: 嘎！嘎！嘎！
        - id: ch01-b17
          speaker: narrator
          text: 一听见乌鸦布莱基的叫声，狐奶奶的眉头顿时舒展开了。她自言自语地说出了自己的答案。
        - id: ch01-b18
          speaker: granny_fox
          text: 一定是布莱基偷了东西，布朗农夫的儿子正出来追他，恰好雷迪跑来了。
        - id: ch01-b19
          speaker: narrator
          text: 雷迪的脸一下子红透了，可他一句话也没说。
