  chapters:
    - id: ch01
      title: VIII. Granny Fox Takes Care of Reddy
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Reddy Fox was so sore and lame that he could barely hobble. He had worked as hard as he possibly could to get far enough ahead of Bowser the Hound. Only then could he tangle up his trail so Bowser couldn't follow it. After that, Reddy had limped all the way home. Big tears ran down his nose, though he tried his best not to cry. He crept through his doorway, moaning as he came.
        - id: ch01-b02
          speaker: reddy_fox
          text: Oh! Oh! Oh!
        - id: ch01-b03
          speaker: narrator
          text: Old Granny Fox had just awakened from a nap in the sun. She snapped at him.
        - id: ch01-b04
          speaker: granny_fox
          text: What's wrong this time?
        - id: ch01-b05
          speaker: reddy_fox
          text: I... I got hurt.
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: Reddy began crying even harder. Granny gave him a sharp look.
        - id: ch01-b07
          speaker: granny_fox
          text: What have you done now? Did you rip yourself on a barbed-wire fence, or try to squeeze through a patch of bull-briars? You're old enough to watch out for yourself!
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: Granny came over to inspect his injuries. By then, Reddy was beginning to feel sick to his stomach. He was still lame, and every wound stung terribly.
        - id: ch01-b09
          speaker: reddy_fox
          text: Please don't scold me, Granny. Please don't.
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: One look at Reddy's wounds told Granny what had happened. She made him lie down and stretch out to his full length. Then she went to work, washing every wound with the greatest care and wrapping it up. Old Granny was very gentle whenever she touched a sore place. Her tongue was another matter. It kept going the whole time she worked, and there was nothing gentle about that. Oh, no! Nothing gentle at all.
        - id: ch01-b11
          speaker: narrator
          text: You see, old Granny Fox was wise, very sharp, and very shrewd. The moment she saw those wounds, she knew they came from shot fired by a gun. And that could mean only one thing. Reddy had been careless. Otherwise, he never, never would have gone where someone could shoot him.
        - id: ch01-b12
          speaker: granny_fox
          text: I hope this teaches you something! What are your eyes, ears, and nose for? They're supposed to keep you out of trouble like this.
        - id: ch01-b13
          speaker: granny_fox
          text: A little Fox must use his eyes, or get someday a sad surprise.
        - id: ch01-b14
          speaker: granny_fox
          text: A little Fox must use his ears, and know what makes each sound he hears.
        - id: ch01-b15
          speaker: granny_fox
          text: A little Fox must use his nose, and try the wind wherever he goes.
        - id: ch01-b16
          speaker: granny_fox
          text: A little Fox must use all three, to live to grow as old as me.
        - id: ch01-b17
          speaker: granny_fox
          text: Now tell me what happened, Reddy. It's summer, and men don't hunt foxes now. Why was Farmer Brown's boy waiting for you with a gun?
        - id: ch01-b18
          speaker: narrator
          text: So Reddy told Granny how he had run too close to the old tree trunk where Farmer Brown's boy had been hiding. But he left out two things. He didn't tell her that he had been trying to show off. He also said nothing about stealing the boy's pet chicken in broad daylight. You may be sure Reddy was very careful not to mention either one.
        - id: ch01-b19
          speaker: narrator
          text: Granny Fox wrinkled her brow. She thought and thought, trying to find a good reason for Farmer Brown's boy to be hunting in summer.
        - id: ch01-b20
          speaker: blacky_crow
          text: Caw, caw, caw!
        - id: ch01-b21
          speaker: narrator
          text: At once, Granny's face cleared. She spoke her thought aloud.
        - id: ch01-b22
          speaker: granny_fox
          text: Blacky the Crow must have been stealing. Farmer Brown's boy was after him when Reddy happened along.
        - id: ch01-b23
          speaker: narrator
          text: Reddy Fox's face turned very red, but he didn't say a word.
