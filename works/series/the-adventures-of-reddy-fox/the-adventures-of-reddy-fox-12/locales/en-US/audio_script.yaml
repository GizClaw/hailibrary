  chapters:
    - id: ch01
      title: XII. The Lost Chicken
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Granny Fox had put down the chicken she was carrying home to Reddy. She had planned to go straight back for it as soon as she caught Peter Rabbit. But now Peter was racing away across the Green Meadows, lipperty-lipperty-lip, as fast as he could go.
        - id: ch01-b02
          speaker: narrator
          text: Granny was furious. She bounced up and down, ripped at the grass, and ground her long white teeth. Then she glared at Ol' Mistah Buzzard, the one who had warned Peter. Scolding him was all she could do, and that did her little good. Before long he was so high in the blue, blue sky that he could not hear a single word she said.
        - id: ch01-b03
          speaker: narrator
          text: My, my, Granny Fox was angry! If she had been less angry, she might have noticed Johnny Chuck pressed as flat as he could get behind a big clump of grass.
        - id: ch01-b04
          speaker: narrator
          text: Johnny was frightened. Yes, indeed, he was dreadfully frightened. He had fought Reddy Fox and beaten him, but he knew Granny Fox was far too much for him. What a relief when she finally stopped tearing up the grass and trotted over to see how Reddy was doing.
        - id: ch01-b05
          speaker: narrator
          text: Johnny crept along until he was far enough away to run safely. And how he ran! He was so fat and roly-poly that he reached home completely out of breath. He was so tired that he simply dropped onto his doorstep and panted.
        - id: ch01-b06
          speaker: johnny_chuck
          text: That's what I get for being so curious.
        - id: ch01-b07
          speaker: narrator
          text: Reddy Fox looked up when Granny Fox came hurrying home. He was weak and very, very hungry. Still, he felt sure Granny would have something good for his breakfast. As soon as he heard her footsteps, his mouth began to water.
        - id: ch01-b08
          speaker: reddy_fox
          text: Granny, did you bring me something good to eat?
        - id: ch01-b09
          speaker: narrator
          text: The scare and the loss of Peter Rabbit had upset Granny so much that the chicken on the hill went clean out of her mind. Reddy's question made her remember. The thought of going all that way back put her in an even worse temper.
        - id: ch01-b10
          speaker: granny_fox
          text: No! You don't deserve breakfast anyway. If you had any gumption at all, you wouldn't have landed in this trouble. You could go find your own breakfast!
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: Gumption was the word Granny used, though Reddy had no idea what it meant. What he did know was that he was very, very hungry. He tried, but he could not hold back two big tears of disappointment. Granny noticed them.
        - id: ch01-b12
          speaker: granny_fox
          text: There, there, Reddy. Don't cry. I left a fine fat chicken up on the hill for you. I'll hurry back and fetch it.
        - id: ch01-b13
          speaker: narrator
          text: Off she went, climbing the hill to the spot where she had put down the chicken before chasing Peter Rabbit.
        - id: ch01-b14
          speaker: narrator
          text: When Granny reached the place, there was no chicken. No, Sir, there was no chicken at all. Only a few feathers remained. Granny could hardly believe her own eyes. She looked this way and that way, but still found no chicken. There were only those few feathers.
        - id: ch01-b15
          speaker: narrator
          text: That sent Granny Fox into an even wilder rage.
