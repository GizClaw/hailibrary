audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 热心直爽，兴奋时语速加快
        timbre: 圆润年轻
        pace: 轻快
        pitch: 中音
    reddy_fox:
      display_name: 小狐狸雷迪
      tts:
        delivery: 狡黠好强，受伤时压着疼痛和恼火
        timbre: 略带沙哑的年轻嗓音
        pace: 平稳，疼痛时稍慢
        pitch: 中音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练精明，恼怒时尖刻凶狠
        timbre: 苍老而有力
        pace: 从容，动怒时加快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十二章　不见了的小鸡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老狐狸奶奶放下那只带回家给雷迪吃的小鸡时，本打算抓住彼得兔以后，马上回来取。可现在，她只能眼看着彼得一蹦一跳，飞快地穿过绿色草原逃走。
        - id: ch01-b02
          speaker: narrator
          text: 她气得直跳脚，又扯草，又磨那一口雪白的长牙。她瞪着给彼得报信的秃鹫老先生，除了大骂，什么办法也没有。可这番叫骂一点儿用也没有。没过多久，秃鹫老先生已经飞到蓝蓝的高空，连一个字都听不见了。哎呀呀，老狐狸奶奶真是气坏了！要不是气昏了头，她也许就会看见土拨鼠约翰尼。他正躲在一大丛草后面，把身子贴得不能再低。
        - id: ch01-b03
          speaker: narrator
          text: 约翰尼怕得要命。他虽然跟小狐狸雷迪打过一架，还打赢了，却知道自己绝不是老狐狸奶奶的对手。等她终于不再扯草，转身小跑着去看雷迪，约翰尼才如释重负。他先贴着地面悄悄爬开，离得够远了，才拔腿飞奔。
        - id: ch01-b04
          speaker: narrator
          text: 瞧他跑得多快！可他长得又圆又胖，像个滚来滚去的小球。跑到家时，他已经上气不接下气，累得一屁股坐在门阶上，只顾呼哧呼哧地喘。
        - id: ch01-b05
          speaker: johnny_chuck
          text: 谁叫我这么好奇呢，真是活该。
        - id: ch01-b06
          speaker: narrator
          text: 老狐狸奶奶匆匆回到家，小狐狸雷迪抬头望着她。雷迪身子虚弱，肚子也饿得厉害。不过，他深信奶奶一定会给自己带回什么好吃的当早饭。脚步声才一响，他的口水就流出来了。
        - id: ch01-b07
          speaker: reddy_fox
          text: 奶奶，您给我带什么好吃的了？
        - id: ch01-b08
          speaker: narrator
          text: 老狐狸奶奶刚才受了惊，又没能抓住彼得兔，心里正气恼，早把留在山坡上的小鸡忘得干干净净。雷迪这一问，她才想起来。一想到还得走那么远的路折回去拿，她的脾气一点儿也没变好。她厉声冲雷迪说道。
        - id: ch01-b09
          speaker: granny_fox
          text: 没有！我什么也没带！再说，你根本不配吃早饭。你要是有点儿能耐，就不会惹出这种麻烦，也能自己找早饭吃了。
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 老狐狸奶奶说的词是“能耐”。雷迪根本不明白那是什么意思。他只知道自己饿极了，不管怎样强忍，两颗失望的大泪珠还是滚了下来。老狐狸奶奶看见了。
        - id: ch01-b11
          speaker: granny_fox
          text: 好啦，好啦，雷迪！别哭了。我在山坡上给你留了一只又肥又嫩的小鸡，这就回去拿。
        - id: ch01-b12
          speaker: narrator
          text: 老狐狸奶奶说走就走，重新上了山。她回到先前放下小鸡、转身去捉彼得兔的地方，可那里哪还有什么小鸡。是的，先生，一只也没有，地上只剩几根羽毛。
        - id: ch01-b13
          speaker: narrator
          text: 老狐狸奶奶简直不敢相信自己的眼睛。她朝这边找了又找，又往那边看了又看。小鸡始终不见踪影，眼前还是只有那几根羽毛。她顿时暴跳如雷，比刚才还要愤怒。
