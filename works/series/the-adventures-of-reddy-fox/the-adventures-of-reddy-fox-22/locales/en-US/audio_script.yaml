audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    granny_fox:
      display_name: Old Granny Fox
      tts:
        delivery: wise and determined with a dry edge
        timbre: mature and slightly husky
        pace: measured
        pitch: medium-low
    ol_mistah_buzzard:
      display_name: Ol' Mistah Buzzard
      tts:
        delivery: wise and sing-song
        timbre: dry and weathered
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: XXII. Ol' Mistah Buzzard's Keen Sight
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Granny Fox had fooled Bowser the Hound in the old pasture at the mountain's edge. Now she thought she could take her time going home. The chase had left her tired and hot, so she planned to choose the shadiest paths back.
        - id: ch01-b02
          speaker: narrator
          text: Granny expected Farmer Brown's boy to catch up with Bowser. Surely he would hear the great fuss Bowser was making over the old house Granny had run into.
        - id: ch01-b03
          speaker: narrator
          text: But the boy still hadn't appeared, and Granny began to worry. What if he hadn't followed Bowser at all? She climbed to a high point and looked around, but she saw no sign of Farmer Brown's boy or his gun.
        - id: ch01-b04
          speaker: narrator
          text: Just then, Ol' Mistah Buzzard sailed down from the blue, blue sky and perched on a tall dead tree. Granny had not forgotten how he had warned Peter Rabbit when she was about to pounce. Still, she suddenly saw a way he might help her.
        - id: ch01-b05
          speaker: narrator
          text: So Old Granny Fox carefully smoothed out her skirts. Then she walked over to the foot of the dead tree and smiled up at Ol' Mistah Buzzard.
        - id: ch01-b06
          speaker: granny_fox
          text: How are you today, Neighbor Buzzard?
        - id: ch01-b07
          speaker: ol_mistah_buzzard
          text: Ah'm well enough to be up and about, thank yo'.
        - id: ch01-b08
          speaker: narrator
          text: As he answered, Ol' Mistah Buzzard stretched his great wings wide so the air could blow beneath them.
        - id: ch01-b09
          speaker: granny_fox
          text: My, Mistah Buzzard, those great wings are splendid! It must be grand to fly. I suppose you see all kinds of things from high up in that blue, blue sky.
        - id: ch01-b10
          speaker: narrator
          text: That praise pleased Ol' Mistah Buzzard. He felt quite flattered by Granny's admiring words.
        - id: ch01-b11
          speaker: ol_mistah_buzzard
          text: Yes, Ah can see everything happening on the Green Meadows and in the Green Forest.
        - id: ch01-b12
          speaker: granny_fox
          text: Oh, Mistah Buzzard, you can't truly mean that!
        - id: ch01-b13
          speaker: narrator
          text: She sounded just like someone who very much wanted to believe him but simply could not.
        - id: ch01-b14
          speaker: ol_mistah_buzzard
          text: Yes, Ah can!
        - id: ch01-b15
          speaker: granny_fox
          text: Really, Mistah Buzzard? Your eyes can't be as sharp as that! I know where Bowser the Hound is, and I know where Farmer Brown's boy is, too. But I don't believe you can spot them from up there.
        - id: ch01-b16
          speaker: narrator
          text: Ol' Mistah Buzzard did not answer with a single word. He only spread his broad wings and rose into the sky. Up and up and up he sailed. In just a few minutes, Granny Fox could see nothing but a tiny speck high above her.
        - id: ch01-b17
          speaker: narrator
          text: Granny had not told the truth. She did not know where Farmer Brown's boy was. By challenging Buzzard's keen sight, she hoped to trick him into finding the boy and telling her.
        - id: ch01-b18
          speaker: narrator
          text: A few minutes later, Ol' Mistah Buzzard came sailing back down.
        - id: ch01-b19
          speaker: ol_mistah_buzzard
          text: Bowser the Hound is up in the old back pasture.
        - id: ch01-b20
          speaker: granny_fox
          text: That's right! Now, where is Farmer Brown's boy?
        - id: ch01-b21
          speaker: narrator
          text: Granny cried out and clapped her hands. Ol' Mistah Buzzard began to answer her second question, but stopped before he said where the boy was.
        - id: ch01-b22
          speaker: ol_mistah_buzzard
          text: Farmer Brown's boy is...
        - id: ch01-b23
          speaker: granny_fox
          text: Where? Where?
        - id: ch01-b24
          speaker: narrator
          text: Granny asked so eagerly that Ol' Mistah Buzzard suddenly looked at her very sharply. Her eagerness had given her trick away.
        - id: ch01-b25
          speaker: ol_mistah_buzzard
          text: Yo' said you knew. Why should Ah tell yo'? But if Ah were you, Ah'd hurry home right smart soon.
        - id: ch01-b26
          speaker: granny_fox
          text: Why? Please, please tell me what you saw, Mistah Buzzard!
        - id: ch01-b27
          speaker: narrator
          text: Granny begged him to explain, but Ol' Mistah Buzzard would not say one more word. After that warning, Old Granny Fox turned toward home and started running as fast as she could.
        - id: ch01-b28
          speaker: narrator
          text: As she ran, she muttered to herself.
        - id: ch01-b29
          speaker: granny_fox
          text: Oh dear, I do hope Reddy Fox listened to me and stayed in the house.
          emotion: fearful
