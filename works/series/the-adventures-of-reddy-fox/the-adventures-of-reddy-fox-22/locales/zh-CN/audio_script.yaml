audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练精明，恼怒时尖刻凶狠
        timbre: 苍老而有力
        pace: 从容，动怒时加快
        pitch: 中低音
    ol_mistah_buzzard:
      display_name: 秃鹫老先生
      tts:
        delivery: 悠然机敏，带着诙谐的乡土口吻
        timbre: 粗粝温厚
        pace: 慢悠悠
        pitch: 低音
  chapters:
    - id: ch01
      title: 第二十二章　秃鹫老先生的锐利目光
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老狐狸奶奶在山脚的老牧场上骗过了猎犬鲍泽，以为这下可以慢慢回家了。她又热又累，只想一路挑阴凉的小道走。鲍泽发现她跑进了那座老宅子，闹得那么响，奶奶认定布朗家的男孩很快就会赶去找他。
        - id: ch01-b02
          speaker: narrator
          text: 可那男孩迟迟没有出现，奶奶不由得担心起来。难道他根本没跟着鲍泽上山？她特意登上一处高地，朝四面仔细望去，却既没看见男孩，也没看见他的枪。
        - id: ch01-b03
          speaker: narrator
          text: 这时，秃鹫老先生从蓝蓝的高空中滑下来，落到一棵高高的枯树上。奶奶还记得，上回自己正要扑向彼得兔，就是他出声提醒了彼得，坏了她的好事。不过眼下，她忽然觉得秃鹫老先生也许正能派上用场。
        - id: ch01-b04
          speaker: narrator
          text: 奶奶理了理裙子，走到那棵枯树下，抬头朝秃鹫老先生笑了笑。
        - id: ch01-b05
          speaker: granny_fox
          text: 秃鹫邻居，您今天过得怎么样呀？
        - id: ch01-b06
          speaker: ol_mistah_buzzard
          text: 还成，还能起来四处走动。多谢您惦记。
        - id: ch01-b07
          speaker: narrator
          text: 秃鹫老先生一边回答，一边把双翅舒展开来，让风吹过翅膀下面。
        - id: ch01-b08
          speaker: granny_fox
          text: 哎呀，秃鹫先生，您这双又宽又大的翅膀真漂亮！能在天上飞，一定快活极了。飞到那么高、那么蓝的天空里，您准能把下面的许多东西看得清清楚楚吧？
        - id: ch01-b09
          speaker: narrator
          text: 这番奉承让秃鹫老先生很是得意。
        - id: ch01-b10
          speaker: ol_mistah_buzzard
          text: 那当然。绿草原和绿森林里正在发生什么，俺全都看得见。
        - id: ch01-b11
          speaker: granny_fox
          text: 哎呀，秃鹫先生，您不会是说真的吧！
        - id: ch01-b12
          speaker: narrator
          text: 奶奶装得很像那么回事，好像打心眼里想相信他，却又觉得这话实在叫人没法相信。
        - id: ch01-b13
          speaker: ol_mistah_buzzard
          text: 俺当然是说真的！
        - id: ch01-b14
          speaker: granny_fox
          text: 真的吗，秃鹫先生？当真吗？您的眼睛能尖到这个地步，我可不信！我知道猎犬鲍泽在哪里，也知道布朗家的男孩在哪里，可您一定看不见他们。
        - id: ch01-b15
          speaker: narrator
          text: 秃鹫老先生一句话也没说，只把宽大的翅膀一展。没过多久，他便越飞越高，最后在奶奶眼里只剩下一个小小的黑点。
        - id: ch01-b16
          speaker: narrator
          text: 其实，奶奶根本不知道布朗家的男孩在哪里。她刚才故意没说实话，只想用这个办法激一激秃鹫老先生，哄他飞上天找出男孩，再把男孩的去向说给自己听。
        - id: ch01-b17
          speaker: narrator
          text: 又过了几分钟，秃鹫老先生从高空飞了回来。
        - id: ch01-b18
          speaker: ol_mistah_buzzard
          text: 猎犬鲍泽正在后山那片老牧场上。
        - id: ch01-b19
          speaker: granny_fox
          text: 说对啦！那么，布朗家的男孩在哪里呢？
        - id: ch01-b20
          speaker: narrator
          text: 奶奶高兴得拍起手来。
        - id: ch01-b21
          speaker: narrator
          text: 秃鹫老先生刚说出“布朗家的男孩在”，便忽然停住了。
        - id: ch01-b22
          speaker: granny_fox
          text: 在哪里？在哪里？
        - id: ch01-b23
          speaker: narrator
          text: 奶奶问得太急，秃鹫老先生立刻狐疑地盯了她一眼。
        - id: ch01-b24
          speaker: ol_mistah_buzzard
          text: 您不是说自己知道吗？那俺还告诉您干什么？不过，俺要是您呀，准会赶紧回家，越快越好。
        - id: ch01-b25
          speaker: granny_fox
          text: 为什么？求求您，快告诉我您看见什么了吧，秃鹫先生！
        - id: ch01-b26
          speaker: narrator
          text: 可秃鹫老先生连半句话也不肯再说。老狐狸奶奶只好撒腿往家跑，能跑多快就跑多快。她一路低声念叨着。
        - id: ch01-b27
          speaker: granny_fox
          text: 哎呀，但愿雷迪听了我的话，一直待在屋里。
