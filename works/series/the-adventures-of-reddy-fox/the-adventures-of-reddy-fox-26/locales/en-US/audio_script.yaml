  chapters:
    - id: ch01
      title: XXVI. Farmer Brown's Boy Works for Nothing
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The grass around the doorstep of Reddy Fox's old home was wet with dew. Farmer Brown's boy laid down his gun, pulled off his coat, rolled up his sleeves, and took hold of his spade.
        - id: ch01-b02
          speaker: narrator
          text: It was a cool, beautiful morning at the edge of the Green Meadows. Jolly, round, red Mr. Sun had only just started his long climb through the blue, blue sky. Over among the bulrushes beside the Smiling Pool, Mr. Redwing sang for joy. Everything looked so lovely and peaceful that it was hard to believe anyone could come to harm.
        - id: ch01-b03
          speaker: narrator
          text: Yet there stood Farmer Brown's boy. He had crept toward Reddy's home on his hands and knees, as quietly as he could. If Reddy had been outside, the boy meant to get close enough to shoot him. But Reddy was nowhere in sight. So the boy jumped up, began to dig, and whistled while he worked. His freckled face looked so friendly that you might have thought he meant no harm at all.
        - id: ch01-b04
          speaker: narrator
          text: The gun lying nearby told a different story. And the boy kept digging as though he meant to reach the very bottom of Reddy Fox's home.
        - id: ch01-b05
          speaker: narrator
          text: The hole sank deeper and deeper. The pile of sand beside it grew bigger and bigger with every shovelful. Farmer Brown's boy thought no one but Bowser the Hound was watching him.
        - id: ch01-b06
          speaker: narrator
          text: He never noticed Johnny Chuck peeking from behind a tall clump of meadow grass. He missed Peter Rabbit behind a tree at the edge of the Green Forest, and Bobby Coon hidden safely in the top of that same tree. Jimmy Skunk was there too, along with Unc' Billy Possum, Happy Jack Squirrel, and Digger the Badger. The boy saw none of them, but they saw everything he did.
        - id: ch01-b07
          speaker: narrator
          text: They watched every spadeful of sand fly out of the hole, and every heart went pit-a-pat. Each of them was certain that something dreadful was about to happen to Reddy Fox.
        - id: ch01-b08
          speaker: narrator
          text: Only Ol' Mistah Buzzard knew they were wrong. High above them in the blue, blue sky, he could look down on the whole scene. He saw all the little people from the meadow and forest hiding nearby. And the harder Farmer Brown's boy dug, the more Ol' Mistah Buzzard chuckled to himself.
        - id: ch01-b09
          speaker: narrator
          text: What did he find so funny? From up there, he could also see old Granny Fox. Her sharp face was peeping around the corner of an old fence, and she was grinning. That was enough to tell Ol' Mistah Buzzard that Reddy Fox was safe.
        - id: ch01-b10
          speaker: narrator
          text: The others didn't know that Granny and Reddy had moved away. As Farmer Brown's boy dug farther and farther into the ground, the watchers' faces grew longer and longer.
        - id: ch01-b11
          speaker: peter_rabbit
          text: Reddy Fox has nearly worried me to death, and he'd eat me if he ever caught me. Still, it just wouldn't feel the same around here without him. Oh dear, I don't want him to be killed.
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: Peter Rabbit gave a miserable moan.
        - id: ch01-b13
          speaker: jimmy_skunk
          text: Maybe Reddy isn't in there.
        - id: ch01-b14
          speaker: johnny_chuck
          text: He must be home. He's so stiff and sore that he can hardly walk, so he has to stay there. Wait, what's happening now?
        - id: ch01-b15
          speaker: narrator
          text: Everyone looked. Farmer Brown's boy had climbed out of the hole. He was tired, cross, and scowling. After resting for a few minutes, he started shoveling all the sand back in. He had dug clear to the bottom and found nobody there.
        - id: ch01-b16
          speaker: peter_rabbit
          text: Hurrah!
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: Peter leaped into the air and struck his heels together. All the others were every bit as glad as he was.
        - id: ch01-b18
          speaker: narrator
          text: Johnny Chuck was especially happy. Farmer Brown's boy had once discovered Johnny's snug home, and Johnny had been forced to move away just as suddenly as Granny and Reddy Fox had. He knew exactly how Reddy must feel. Johnny had escaped many dangers in his short life, and you can read about them in the next book, The Adventures of Johnny Chuck.
