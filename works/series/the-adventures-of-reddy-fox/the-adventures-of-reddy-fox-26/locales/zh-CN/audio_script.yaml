audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇热心，着急时说话又快又直
        timbre: 年轻明亮
        pace: 轻快
        pitch: 中高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 不慌不忙，带着一本正经的揶揄
        timbre: 圆润沉稳
        pace: 舒缓
        pitch: 中低音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 热心直爽，兴奋时语速加快
        timbre: 圆润年轻
        pace: 轻快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二十六章　布朗家男孩白忙一场
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小狐狸雷迪老家的门前，草叶全叫露水打湿了。布朗家男孩来到这里，先放下枪，脱掉外套，又卷起衬衫袖子，拿起了铁锹。
        - id: ch01-b02
          speaker: narrator
          text: 绿草地边缘又凉快又美。圆滚滚、红彤彤的太阳公公才开始往湛蓝的天空上爬。微笑池塘边的芦苇丛里，红翼鸫先生正高兴地唱歌。这样的清晨实在太美了，仿佛谁也不会遇到伤害。
        - id: ch01-b03
          speaker: narrator
          text: 可布朗家男孩偏偏来了。他刚才趴在地上，手脚并用，一声不响地爬近雷迪的家。要是雷迪正在外面，他就能开枪。幸好，那里连雷迪的影子也没有。男孩跳起来，一边吹着口哨，一边挖土。他那张长满雀斑的脸看着和和气气，似乎根本不会伤害谁。
        - id: ch01-b04
          speaker: narrator
          text: 然而，那杆枪就在旁边躺着。男孩挖土的架势，分明是要一直挖到雷迪家的最深处！
        - id: ch01-b05
          speaker: narrator
          text: 洞越挖越深，抛出来的沙土越堆越高。男孩只知道猎狗鲍泽在看他，却不知道附近还藏着许多双眼睛。
        - id: ch01-b06
          speaker: narrator
          text: 土拨鼠约翰尼从一丛高草后面探头，彼得兔躲在绿森林边的一棵树后，浣熊博比则藏在同一棵树的高处。臭鼬吉米、负鼠比利大叔、松鼠快乐杰克和獾迪格也都来了。男孩一个也没发现，他们却看清了他铲出的每一锹沙土。大伙儿心里怦怦直跳，都认定可怕的事情就要落到雷迪头上了。
        - id: ch01-b07
          speaker: narrator
          text: 只有老秃鹰先生不这么想。他高高飞在蓝天上，地面的许多事情都逃不过他的眼睛。草地和森林里的小居民躲在哪里，他全都看得清清楚楚。布朗家男孩干得越起劲，他越在心里发笑。
        - id: ch01-b08
          speaker: narrator
          text: 他笑什么呢？老秃鹰先生看见了老狐狸奶奶。她从旧篱笆的拐角后面露出尖尖的脸，正咧着嘴笑呢。瞧见她这副模样，老秃鹰先生就知道雷迪平安无事。
        - id: ch01-b09
          speaker: narrator
          text: 其他伙伴可不知道狐狸奶奶和雷迪已经搬了家。他们望着男孩往地下越挖越深，一张张脸也越拉越长。
        - id: ch01-b10
          speaker: peter_rabbit
          text: 雷迪都快把我折磨死了。他要是逮住我，一定会吃掉我。可是，附近真要没了他，好像又会少点儿什么。唉，我不想让他送命啊。
          emotion: sad
        - id: ch01-b11
          speaker: narrator
          text: 彼得兔愁眉苦脸地说完，臭鼬吉米倒还抱着一点儿希望。
        - id: ch01-b12
          speaker: jimmy_skunk
          text: 也许雷迪根本没在家呢。
        - id: ch01-b13
          speaker: johnny_chuck
          text: 他肯定在家。他浑身又僵又痛，几乎连路都走不了，只能留在家里。咦，男孩那边怎么了？
        - id: ch01-b14
          speaker: narrator
          text: 大家连忙望过去。布朗家男孩已经爬出了洞。他累坏了，心情也很糟，便先停下来歇了一会儿。歇着的时候，他一直皱着眉头。
        - id: ch01-b15
          speaker: narrator
          text: 过了几分钟，男孩开始把沙土一锹锹填回去。原来，他已经挖到了洞底，却连一个人影也没找到。
        - id: ch01-b16
          speaker: peter_rabbit
          text: 太好啦！
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: 彼得兔高声欢呼，一下蹦到空中，两只脚后跟还碰了一下。其他伙伴和他一样高兴，其中最高兴的要数土拨鼠约翰尼。
        - id: ch01-b18
          speaker: narrator
          text: 从前，布朗家男孩也发现过约翰尼那座舒适的家。约翰尼只好像狐狸奶奶和雷迪这次一样，急匆匆地搬走。他年纪不大，却已经好几回差点儿没能逃脱，所以最明白雷迪会有什么感受。
        - id: ch01-b19
          speaker: narrator
          text: 想知道土拨鼠约翰尼经历过哪些险事吗？下一本《土拨鼠约翰尼历险记》，会把那些故事全都讲给你听。
