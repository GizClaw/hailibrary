audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: earnest and thoughtful
        timbre: light and clear
        pace: lively
        pitch: medium-high
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: eager and good-natured
        timbre: round and youthful
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: IX. Peter Rabbit Hears the News
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Johnny Chuck came running up to the edge of the Old Briarpatch, quite out of breath. You see, Johnny was so round and fat and roly-poly that whenever he ran, he had to puff and blow. His eyes danced with excitement as he peered into the thick briars and tried to catch sight of Peter Rabbit.
        - id: ch01-b02
          speaker: johnny_chuck
          text: Peter! Peter Rabbit! Oh, Peter!
        - id: ch01-b03
          speaker: narrator
          text: No one answered, and Johnny looked disappointed. It was the middle of the morning. He had thought Peter would surely be at home at that hour. Still, Johnny decided to try once more. This time he called in a voice so high that it was almost a squeal.
        - id: ch01-b04
          speaker: johnny_chuck
          text: Hey, Peter Rabbit!
        - id: ch01-b05
          speaker: peter_rabbit
          text: What do you want?
        - id: ch01-b06
          speaker: narrator
          text: At last, a sleepy voice answered from the middle of the Old Briarpatch. Johnny's disappointed face lit up at once.
        - id: ch01-b07
          speaker: johnny_chuck
          text: Come out here, Peter, so I can see you!
        - id: ch01-b08
          speaker: peter_rabbit
          text: Go away, Johnny Chuck. I'm sleepy.
        - id: ch01-b09
          speaker: narrator
          text: Peter sounded just a little cross. He had been out all night, which was a habit of his, and now he wanted to sleep.
        - id: ch01-b10
          speaker: johnny_chuck
          text: I've got news for you, Peter!
        - id: ch01-b11
          speaker: peter_rabbit
          text: How do you know I haven't heard it already?
        - id: ch01-b12
          speaker: narrator
          text: Johnny could hear the change at once. Peter's voice was not nearly so cross now that news had been mentioned.
        - id: ch01-b13
          speaker: johnny_chuck
          text: I'm almost certain this will be news to you. I only just heard it, and I hurried straight here because I thought you'd want to know.
        - id: ch01-b14
          speaker: peter_rabbit
          text: Pooh! I probably heard it ages ago. You folks who go to bed when the sun does never hear anything until it's old. So what is it?
        - id: ch01-b15
          speaker: johnny_chuck
          text: It's about Reddy Fox.
        - id: ch01-b16
          speaker: narrator
          text: Peter cut him off before he could say more.
        - id: ch01-b17
          speaker: peter_rabbit
          text: Shucks, Johnny Chuck, you're slow! Everyone on the Green Meadows knew last night that Farmer Brown's boy had shot Reddy Fox. That's not news. You woke me up to tell me something I knew before you went to bed! It serves Reddy right. I hope he limps for a week.
        - id: ch01-b18
          speaker: johnny_chuck
          text: He can't walk at all!
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: Johnny cried out in triumph. That did it. He knew for certain now that Peter had not heard this piece of news after all.
        - id: ch01-b20
          speaker: peter_rabbit
          text: What's that you said?
          emotion: surprised
        - id: ch01-b21
          speaker: narrator
          text: Johnny heard Peter begin to hop along one of his own little private paths in the heart of the Old Briarpatch. He knew Peter's curiosity was fully awake now, and he smiled to himself as he waited.
        - id: ch01-b22
          speaker: narrator
          text: A few minutes later, Peter poked a sleepy-looking face out from the Old Briarpatch. When he saw Johnny waiting there, he gave him a rather sheepish grin.
        - id: ch01-b23
          speaker: peter_rabbit
          text: What were you saying about Reddy Fox?
        - id: ch01-b24
          speaker: johnny_chuck
          text: Maybe I won't tell you at all, Mr. Know-it-all!
        - id: ch01-b25
          speaker: peter_rabbit
          text: Oh, please tell me, Johnny Chuck.
        - id: ch01-b26
          speaker: narrator
          text: At last, Johnny gave in.
        - id: ch01-b27
          speaker: johnny_chuck
          text: I said Reddy Fox can't walk. Aren't you glad, Peter?
        - id: ch01-b28
          speaker: peter_rabbit
          text: How do you know that's true?
        - id: ch01-b29
          speaker: narrator
          text: Peter was always suspicious of Reddy Fox. He had to keep watch for Reddy's tricks all the time.
        - id: ch01-b30
          speaker: johnny_chuck
          text: Jimmy Skunk told me. He was near Reddy's house early this morning and watched Reddy try to walk. Reddy tried again and again, but he couldn't do it. You won't have to watch out for him for a while, Peter. It serves him right, doesn't it?
        - id: ch01-b31
          speaker: peter_rabbit
          text: Let's go up there and find out if it's really true!
        - id: ch01-b32
          speaker: johnny_chuck
          text: All right.
        - id: ch01-b33
          speaker: narrator
          text: And off they started.
