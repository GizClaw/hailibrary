audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼机灵，认真劝告时一本正经
        timbre: 清亮年轻
        pace: 明快
        pitch: 中高音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 热心直爽，兴奋时语速加快
        timbre: 圆润年轻
        pace: 轻快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第九章　彼得兔听到消息
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 土拨鼠约翰尼一路跑到老荆棘丛边，已经累得呼哧直喘。没办法，他长得又圆又胖，像只滚来滚去的小球，一跑就喘个不停。他一边往荆棘丛里找彼得兔，一边兴奋得两眼放光。
        - id: ch01-b02
          speaker: johnny_chuck
          text: 彼得！彼得兔！你听见我叫你了吗，彼得？
        - id: ch01-b03
          speaker: narrator
          text: 没人回答。约翰尼很失望。上午已经过了一半，他本以为彼得准在家。他不甘心，决定再试一次，于是又扯起尖细得快要变成吱吱声的嗓子喊了一遍。
        - id: ch01-b04
          speaker: johnny_chuck
          text: 彼得兔，我还在叫你呢！
        - id: ch01-b05
          speaker: peter_rabbit
          text: 你找我干什么？
        - id: ch01-b06
          speaker: narrator
          text: 老荆棘丛深处终于传来回答，声音困倦极了。约翰尼一听见，脸上顿时有了光彩。
        - id: ch01-b07
          speaker: johnny_chuck
          text: 出来吧，彼得。到这边来，让我看看你。
        - id: ch01-b08
          speaker: peter_rabbit
          text: 走开，土拨鼠约翰尼！我还困着呢。
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: 彼得的声音带着一点点火气。原来他昨晚整夜都在外面跑，这正是彼得一向的习惯。
        - id: ch01-b10
          speaker: johnny_chuck
          text: 彼得，我有个消息要告诉你！
        - id: ch01-b11
          speaker: peter_rabbit
          text: 你怎么知道我还没听说？
        - id: ch01-b12
          speaker: narrator
          text: 约翰尼听出来，彼得刚才那股火气已经消了不少。
        - id: ch01-b13
          speaker: johnny_chuck
          text: 我差不多敢肯定你没听过，因为我自己也是刚刚才知道的。我觉得你一定想听，所以马上跑到这里来告诉你了。
        - id: ch01-b14
          speaker: peter_rabbit
          text: 得了吧！对我来说，那消息八成都跟山一样老了。你们这些太阳一下山就睡觉的家伙，等听到消息时，消息早就不新鲜啦。说吧，到底是什么事？
        - id: ch01-b15
          speaker: johnny_chuck
          text: 我要说的是小狐狸雷迪的事……
        - id: ch01-b16
          speaker: narrator
          text: 约翰尼才刚开口，还没说完，彼得就抢过了话头。
        - id: ch01-b17
          speaker: peter_rabbit
          text: 嗐，土拨鼠约翰尼，你也太慢啦！昨晚整个绿草地都传遍了，说雷迪挨了布朗农夫儿子的枪。这算什么新闻？你居然把我吵醒，就为了说一件昨晚你睡觉以前我已经知道的事！雷迪活该。真希望他瘸上一个星期。
        - id: ch01-b18
          speaker: johnny_chuck
          text: 他根本一步也走不了！
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: 约翰尼得意极了。这下他终于确定，彼得刚才根本不知道雷迪已经走不了路。
        - id: ch01-b20
          speaker: peter_rabbit
          text: 你说什么？
        - id: ch01-b21
          speaker: narrator
          text: 约翰尼听见彼得在老荆棘丛中心蹦跳起来，正沿着自己专用的一条小路往外赶。他知道彼得的好奇心已经被勾起来，不由得偷偷发笑。没过多久，一张睡眼惺忪的脸从荆棘丛里探了出来。彼得有点不好意思，咧嘴笑了笑。
        - id: ch01-b22
          speaker: peter_rabbit
          text: 你刚才说，小狐狸雷迪怎么了？
        - id: ch01-b23
          speaker: johnny_chuck
          text: 万事通先生，我现在真想不告诉你了！
        - id: ch01-b24
          speaker: peter_rabbit
          text: 哎呀，土拨鼠约翰尼，求你告诉我吧。
        - id: ch01-b25
          speaker: narrator
          text: 约翰尼最后还是让步了。
        - id: ch01-b26
          speaker: johnny_chuck
          text: 我说，雷迪一步也走不了。彼得，你高兴不高兴？
        - id: ch01-b27
          speaker: peter_rabbit
          text: 你怎么知道的？
        - id: ch01-b28
          speaker: narrator
          text: 彼得一向很提防小狐狸雷迪，因为他时时刻刻都得留神，免得中了雷迪的花招。
        - id: ch01-b29
          speaker: johnny_chuck
          text: 是臭鼬吉米告诉我的。今天一大早，他到雷迪家附近去过，亲眼看见雷迪想站起来走路。雷迪试了一遍又一遍，可怎么也走不了。彼得，这一阵子你都用不着再提防他啦。他这是活该，对不对？
        - id: ch01-b30
          speaker: peter_rabbit
          text: 咱们去看看，瞧瞧这事到底是不是真的！
        - id: ch01-b31
          speaker: johnny_chuck
          text: 好啊，咱们走！
        - id: ch01-b32
          speaker: narrator
          text: 就这样，彼得和约翰尼一起出发了。
