audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    farmer_browns_boy:
      display_name: 布朗农夫的儿子
      tts:
        delivery: 朴实干脆，生气时坚决有力
        timbre: 年轻清朗
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第七章　雷迪听见时已经太迟了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 啄木鸟鼓手飞快地敲着危险警报，一下比一下用力。红脑袋前后闪动，快得几乎看不清。嗒嗒嗒嗒嗒，嗒嗒嗒嗒嗒！他就在绿森林边缘那截老树干上敲个不停。等他停下喘口气，低头一看，布朗农夫的儿子正藏在树后，阴沉着脸望向他。
        - id: ch01-b02
          speaker: narrator
          text: 鼓手不喜欢那张怒气冲冲的脸，更不喜欢孩子手里的枪。他很清楚，那孩子躲在这里，是想开枪打小狐狸雷迪。可鼓手又担心起来。要是这孩子猜出敲击声是在给雷迪报信，那可怎么办？树干另一边恰好也能敲。鼓手便悄悄绕过去，敲得比刚才还响。每次停下来换气，他都朝绿草地张望，想看看雷迪究竟听见没有。
        - id: ch01-b03
          speaker: narrator
          text: 雷迪也许听见了，却根本没有理会。他正忙着向草地和森林里的小居民卖弄呢。非要等猎犬鲍泽快追到身后，他才轻佻地甩一下尾巴，开始显露自己奔跑的本领。雷迪跑得实在太快，衬得鲍泽慢极了。鲍泽把鼻子贴着地面，一路追赶，大嗓门叫得震天响。
        - id: ch01-b04
          speaker: narrator
          text: 雷迪的胆子越大，人也越粗心。他不肯好好看路，只顾左瞧右望，看看谁在注视他，又有谁在羡慕他。他哪里还知道自己跑向什么地方？就这么直奔那截老树干去了。啄木鸟鼓手还在那里拼命敲着危险警报。
        - id: ch01-b05
          speaker: narrator
          text: 雷迪一向眼尖耳灵。哎呀呀，那可真不是吹的！偏偏这会儿，他聋得像两只耳朵都塞满了棉花。他还在心里偷笑，盘算着怎么捉弄鲍泽，也想着大家会夸他多聪明。突然，鼓手那阵嗒嗒嗒嗒嗒钻进了他的耳朵。雷迪一下就明白了。那是在说，危险！
        - id: ch01-b06
          speaker: narrator
          text: 就那么短短一瞬，雷迪觉得自己的心都不跳了。可他没法停下，因为鲍泽已经追得太近。雷迪抬眼看见鼓手待在老树干顶端附近，好像一直盯着树下的什么东西。
        - id: ch01-b07
          speaker: narrator
          text: 雷迪赶紧朝树下一瞥。一支枪正对准他，枪后面露出布朗农夫儿子那张长满雀斑的脸。他吓得倒抽一口气，猛然转身，差一点就摔倒在地。
        - id: ch01-b08
          speaker: narrator
          text: 接着，雷迪使出了这辈子从未有过的速度。他的四只脚飞快起落，仿佛连草叶都碰不到。两只眼睛也因为害怕瞪得滚圆。每向前一跃，他都恨不得还能更快一点。
        - id: ch01-b09
          speaker: narrator
          text: 砰！砰！老树干后面闪出两道火光，又蹿起两股烟。啄木鸟鼓手吓得尖叫一声，飞进了绿森林深处。彼得兔立刻趴平身子，躲到一丛荆棘下面。土拨鼠约翰尼则一头扎进自家门洞。
        - id: ch01-b10
          speaker: narrator
          text: 雷迪忽然尖叫了一声。那是一声短促又凄厉的痛叫。紧接着，他的一条腿就瘸了。布朗农夫的儿子却没有发现，还以为自己两枪都打偏了，只在那里气恼地低声抱怨。
        - id: ch01-b11
          speaker: farmer_browns_boy
          text: 我早晚要逮住那只狐狸！谁叫它偷走我心爱的小鸡！
          emotion: angry
