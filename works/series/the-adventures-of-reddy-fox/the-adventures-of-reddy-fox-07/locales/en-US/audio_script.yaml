  chapters:
    - id: ch01
      title: VII. Too Late Reddy Fox Hears
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Drummer the Woodpecker hammered out his danger signal as fast and hard as he could. His red head flicked back and forth so quickly that it was almost a blur. Rat-a-tat-tat-a-tat-tat! The sound rang from an old tree trunk at the edge of the Green Forest. Each time Drummer paused for breath, he peered down at Farmer Brown's boy. The boy was hiding behind the trunk, and his face was twisted into a scowl.
        - id: ch01-b02
          speaker: narrator
          text: Drummer did not like that scowl one bit. He liked the boy's gun even less. Drummer knew the boy was waiting there to shoot Reddy Fox. But what if the boy guessed that all this drumming was meant to warn Reddy? Well, the far side of the tree looked like a much better place to drum. Drummer crept around the trunk and began pounding even harder. Whenever he stopped to catch his breath, he searched the Green Meadows to see whether Reddy had understood the warning.
        - id: ch01-b03
          speaker: narrator
          text: If Reddy heard it, he paid no attention. He wanted all the little meadow and forest people to see him show off. So he waited until Bowser the Hound was almost upon him. Then Reddy gave his tail a saucy flick and dashed away to prove how fast he could run. And Reddy could run very fast indeed. Behind him came Bowser with his nose close to the ground. The hound seemed terribly slow next to Reddy, though his great voice made a tremendous noise as he raced along.
        - id: ch01-b04
          speaker: narrator
          text: Reddy had grown careless along with bold. Instead of watching the way ahead, he kept glancing from side to side. He wanted to know who was looking at him and admiring his speed. He never noticed where his feet were taking him. They carried him straight toward the old tree where Drummer was beating out his warning.
        - id: ch01-b05
          speaker: narrator
          text: Reddy Fox had sharp eyes and quick ears. My, my, indeed he did! Just then, though, he might as well have had cotton stuffed in his ears. He was too busy chuckling over the trick he would play on Bowser and imagining how clever everyone would think he was. Then, all at once, Drummer's rat-a-tat-tata-tat-tat reached him. Reddy knew what it meant. Danger!
        - id: ch01-b06
          speaker: narrator
          text: For one tiny second, Reddy felt as if his heart had stopped. He could not stop running because he had allowed Bowser to come too close. His sharp eyes found Drummer near the top of the old trunk. The woodpecker seemed to be staring at something below. Reddy shot one quick look toward the foot of the tree. A gun was pointing straight at him. Behind it was the freckled face of Farmer Brown's boy.
        - id: ch01-b07
          speaker: narrator
          text: Reddy gasped in fright and turned so sharply that he nearly fell flat. Then he ran faster than he had ever run in his life. His flying feet seemed hardly to touch the grass. His eyes bulged with fear, and at every bound he strained to go just a little faster.
        - id: ch01-b08
          speaker: narrator
          text: Bang! Bang! Two bursts of fire flashed from behind the old trunk, followed by two puffs of smoke. Drummer gave a frightened scream and flew far into the Green Forest. Peter Rabbit pressed himself flat beneath a friendly bramble bush. Johnny Chuck plunged headfirst through his doorway.
        - id: ch01-b09
          speaker: narrator
          text: Reddy let out a shrill little yelp of pain. Suddenly, he began to run with a limp. Farmer Brown's boy did not notice. He believed both shots had missed, and he growled to himself.
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: I'll get that fox yet for stealing my pet chicken!
          emotion: angry
