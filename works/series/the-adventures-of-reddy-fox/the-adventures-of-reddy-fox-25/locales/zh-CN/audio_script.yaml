audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇热心，着急时说话又快又直
        timbre: 年轻明亮
        pace: 轻快
        pitch: 中高音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 爱开玩笑，遇到正事便认真恳切
        timbre: 轻亮，略带沙哑
        pace: 活泼
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 不慌不忙，带着一本正经的揶揄
        timbre: 圆润沉稳
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十五章　彼得兔有了新发现
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 天刚亮，圆滚滚、红彤彤的太阳公公摘下睡帽，从紫山后面的家里出来，又开始往湛蓝的天空上爬。就在这时，布朗家男孩沿着绿森林里的孤独小径出发了。
        - id: ch01-b02
          speaker: narrator
          text: 彼得兔在外面过了一整夜，正准备回家，忽然看见了他。彼得停住脚，直起身子，使劲揉揉眼睛，又看了一回。他还以为自己第一眼看错了，可那确实是布朗家男孩。猎狗鲍泽正跟在男孩脚边，一路小跑。
        - id: ch01-b03
          speaker: narrator
          text: 彼得又揉了一遍眼睛，眉头也皱了起来。男孩的一边肩上扛着枪，另一边还扛着铁锹。他拿铁锹去孤独小径那头做什么？布朗家的菜园可不在那里。
        - id: ch01-b04
          speaker: narrator
          text: 彼得目送他们走远，等再也看不见了，立刻朝绿草地飞奔。他得把这件事告诉土拨鼠约翰尼。瞧他那双长腿，跑得多快！刚才还觉得很困，这会儿早把瞌睡忘光了。
        - id: ch01-b05
          speaker: narrator
          text: 路才走到一半，彼得险些和浣熊博比、臭鼬吉米撞个满怀。他们俩本来正在吵架，还互相骂个没完。一看见彼得急匆匆跑来，两个人都停了嘴。
        - id: ch01-b06
          speaker: bobby_coon
          text: 彼得兔呀胆儿小，影子一追他就跑。彼得，彼得，瞧你慌！快说为何吓成这样？
        - id: ch01-b07
          speaker: narrator
          text: 博比扯着嗓子唱完这首打油诗。彼得猛地停下，差点儿因为收脚太急，向前翻个跟头。他喘得上气不接下气。
        - id: ch01-b08
          speaker: peter_rabbit
          text: 喂，我刚刚看见布朗家男孩了！
        - id: ch01-b09
          speaker: jimmy_skunk
          text: 不会吧！真有这种事？你这一说，我倒想起来了，我好像也见过布朗家男孩好几次呢。
        - id: ch01-b10
          speaker: narrator
          text: 吉米故意装出大吃一惊的样子。彼得知道他在取笑自己，也不恼，只朝他做了个鬼脸，然后把刚才看见的一切全说了出来。男孩带着枪和铁锹，猎狗鲍泽也跟着他，他们一起往孤独小径那头去了。
        - id: ch01-b11
          speaker: peter_rabbit
          text: 那个方向根本没有布朗家的菜园，你们也知道呀。
        - id: ch01-b12
          speaker: narrator
          text: 浣熊博比听完，脸色一下子严肃了。刚才还在他脸上的玩笑神气，这时一点也没有了。
        - id: ch01-b13
          speaker: jimmy_skunk
          text: 博比，你怎么了？
        - id: ch01-b14
          speaker: bobby_coon
          text: 我刚想到，小狐狸雷迪就住在那个方向。可他现在浑身僵痛，想跑也跑不了。
        - id: ch01-b15
          speaker: narrator
          text: 吉米提了提裤子，马上朝孤独小径走去。
        - id: ch01-b16
          speaker: jimmy_skunk
          text: 走吧！我们跟上去看看，弄清楚布朗家男孩到底要做什么。
        - id: ch01-b17
          speaker: narrator
          text: 博比二话不说，立刻跟在吉米身后。彼得却要先去叫土拨鼠约翰尼，说自己随后就来追他们。
        - id: ch01-b18
          speaker: narrator
          text: 他们商量的时候，布朗家男孩一直在赶路。他沿着孤独小径，直奔老狐狸奶奶和小狐狸雷迪原来的家。狐狸奶奶和雷迪头一天夜里才搬走，男孩当然还不知道。
        - id: ch01-b19
          speaker: narrator
          text: 男孩到了那里，放下枪，拿起铁锹挖了起来。吉米、博比、彼得和约翰尼也赶到了。他们躲在一处可以探头看清动静的地方。这时，男孩已经挖出了一个大洞。
        - id: ch01-b20
          speaker: peter_rabbit
          text: 哎呀！他在挖小狐狸雷迪的家！这下可怜的雷迪要被他抓住了！
          emotion: fearful
