  chapters:
    - id: ch01
      title: XXV. Peter Rabbit Makes a Discovery
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jolly, round, red Mr. Sun had barely tossed away his nightcap and come from behind the Purple Hills. He was just starting his daily climb into the blue, blue sky when Farmer Brown's boy set off down the Lone Little Path through the Green Forest.
        - id: ch01-b02
          speaker: narrator
          text: Peter Rabbit had been out all night and was on his way home. When he saw the boy, he stopped, sat up, and rubbed his eyes. Then he looked again. He could hardly believe what he had seen, but there was no mistake. Farmer Brown's boy was really there, with Bowser the Hound trotting at his heels.
        - id: ch01-b03
          speaker: narrator
          text: Peter rubbed his eyes once more and wrinkled his brows. The boy had a gun over one shoulder and a spade over the other. Where could he be going with a spade? Farmer Brown's garden certainly wasn't down the Lone Little Path.
        - id: ch01-b04
          speaker: narrator
          text: Peter watched until the boy disappeared. Then he raced toward the Green Meadows to tell Johnny Chuck. My, how those long legs flew! Peter was so excited that he forgot how sleepy he had been only minutes before.
        - id: ch01-b05
          speaker: narrator
          text: Halfway to Johnny Chuck's house, Peter nearly ran straight into Bobby Coon and Jimmy Skunk. The two had been quarreling and calling each other names, but they stopped as soon as they saw him.
        - id: ch01-b06
          speaker: bobby_coon
          text: Peter Rabbit runs away from his shadow, so they say. Peter, Peter, what a sight! Tell us why you took this fright!
        - id: ch01-b07
          speaker: narrator
          text: Peter stopped so suddenly that he almost turned a somersault. He was panting hard.
        - id: ch01-b08
          speaker: peter_rabbit
          text: Listen! I just saw Farmer Brown's boy.
        - id: ch01-b09
          speaker: jimmy_skunk
          text: You don't say! Now that I think about it, I believe I've seen Farmer Brown's boy a few times myself.
        - id: ch01-b10
          speaker: narrator
          text: Jimmy pretended to be terribly surprised. Peter made a good-natured face at him, then told them what he had seen. Farmer Brown's boy had gone down the Lone Little Path with a gun and a spade, and Bowser the Hound was with him.
        - id: ch01-b11
          speaker: peter_rabbit
          text: And you know there's no garden anywhere down that way.
        - id: ch01-b12
          speaker: narrator
          text: Bobby Coon's face grew sober. Yes, sir, every bit of fun had left his face.
        - id: ch01-b13
          speaker: jimmy_skunk
          text: What's wrong, Bobby?
        - id: ch01-b14
          speaker: bobby_coon
          text: I was thinking about Reddy Fox. He lives over that way, and he's too stiff to run.
        - id: ch01-b15
          speaker: narrator
          text: Jimmy Skunk hitched up his trousers and started for the Lone Little Path.
        - id: ch01-b16
          speaker: jimmy_skunk
          text: Come on! Let's follow the boy and find out what he's doing.
        - id: ch01-b17
          speaker: narrator
          text: Bobby Coon went with him at once. Peter said he would hurry over to fetch Johnny Chuck, then catch up with the others.
        - id: ch01-b18
          speaker: narrator
          text: Meanwhile, Farmer Brown's boy had been hurrying down the Lone Little Path. He was headed for the home that Old Granny Fox and Reddy Fox had left the night before. Of course, the boy didn't know they had moved.
        - id: ch01-b19
          speaker: narrator
          text: He put down his gun and began to dig. By the time Jimmy Skunk, Bobby Coon, Peter Rabbit, and Johnny Chuck found a place where they could peep out and watch, he had made a great hole.
        - id: ch01-b20
          speaker: peter_rabbit
          text: Oh! He's digging into Reddy Fox's house, and he's going to catch poor Reddy!
          emotion: fearful
