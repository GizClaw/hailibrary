  chapters:
    - id: ch01
      title: I. Granny Fox Gives Reddy a Scare
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Reddy Fox lived with Granny Fox. Reddy came from a very large family, and Mother Fox had all she could do to feed so many hungry little mouths. That was why she had sent Reddy to live with his grandmother.
        - id: ch01-b02
          speaker: narrator
          text: Granny Fox was the wisest, slyest, smartest fox anywhere around. Now that Reddy was getting so big, she decided it was time for him to learn what every fox ought to know. Each day she took him hunting. She showed him how to steal Farmer Brown's chickens without waking Bowser the Hound, and she taught him the many tricks she knew for fooling a dog.
        - id: ch01-b03
          speaker: narrator
          text: That morning, Granny Fox led Reddy across the Green Meadows, through the Green Forest, and all the way to the railroad track. Reddy had never seen it before. He wasn't quite sure what to think. Granny trotted ahead until she reached a long bridge. There she stopped.
        - id: ch01-b04
          speaker: granny_fox
          text: Come over here, Reddy. Look down.
        - id: ch01-b05
          speaker: narrator
          text: Reddy obeyed. But one glance below made his head spin so badly that he almost fell. Granny Fox grinned.
        - id: ch01-b06
          speaker: granny_fox
          text: Now cross the bridge.
        - id: ch01-b07
          speaker: narrator
          text: She ran lightly to the other side. Reddy stayed where he was. He was afraid. Yes, Sir, Reddy Fox was too frightened to take even one step onto that long bridge. He thought he might fall between the ties and tumble into the water, or onto the cruel rocks far below. Granny Fox ran back to him.
        - id: ch01-b08
          speaker: granny_fox
          text: Shame on you, Reddy Fox! What has you so scared? Keep your eyes up, and you'll be perfectly safe. Come across with me now.
        - id: ch01-b09
          speaker: narrator
          text: Reddy only drew back. He begged Granny to take him home, and he whimpered. All at once, Granny Fox jumped to her feet as though something had terrified her.
        - id: ch01-b10
          speaker: granny_fox
          text: Bowser the Hound! Hurry, Reddy! Hurry!
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: Granny raced onto the bridge as fast as she could. Reddy didn't pause to look around. He didn't stop to think. He had only one thought now. He must get away from Bowser the Hound.
        - id: ch01-b12
          speaker: reddy_fox
          text: Wait for me, Granny! Wait!
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: Reddy dashed after her with all his speed. Before he even remembered the bridge, he was halfway across it. At last he reached the other side safely. There sat Granny Fox, laughing at him.
        - id: ch01-b14
          speaker: narrator
          text: Only then did Reddy turn to see where Bowser might be. The hound was nowhere in sight. Reddy wondered if Bowser could have fallen off the bridge.
        - id: ch01-b15
          speaker: reddy_fox
          text: Where did Bowser the Hound go?
        - id: ch01-b16
          speaker: granny_fox
          text: He's at home in Farmer Brown's dooryard.
        - id: ch01-b17
          speaker: narrator
          text: Granny said it very dryly. Reddy stared at her for a moment. Then he understood. Granny Fox had frightened him on purpose so he would run across the bridge. Reddy felt very foolish indeed.
        - id: ch01-b18
          speaker: granny_fox
          text: Now we'll run back across.
        - id: ch01-b19
          speaker: narrator
          text: And this time, Reddy did.
