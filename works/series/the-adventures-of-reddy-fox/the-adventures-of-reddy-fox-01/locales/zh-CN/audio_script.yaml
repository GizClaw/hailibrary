audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 小狐狸雷迪
      tts:
        delivery: 年轻直率，遇到危险时慌张急促
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 中高音
    granny_fox:
      display_name: 狐奶奶
      tts:
        delivery: 老练果断，话里常带一点机智的笑意
        timbre: 温厚略带沙哑
        pace: 沉稳
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第一章　狐奶奶吓了雷迪一跳
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小狐狸雷迪跟狐奶奶住在一起。他原本是狐狸妈妈一大群孩子中的一个。兄弟姐妹实在太多，一张张小嘴总也喂不饱，狐狸妈妈忙得应付不过来，就让雷迪搬来陪年迈的狐奶奶。狐奶奶是这一带最有智慧、最有心计、也最机灵的狐狸。现在，雷迪已经长得这么大了。她觉得，是时候教他狐狸非懂不可的本领了。于是，她天天带雷迪出去打猎，把自己多年学会的狩猎门道一件件教给他。她教他怎样不惊醒猎犬鲍泽，悄悄偷走布朗农夫的鸡，还把捉弄狗的千百种办法都传给了他。
        - id: ch01-b02
          speaker: narrator
          text: 这天早晨，狐奶奶带着雷迪穿过绿草地，往上走进绿森林，一直来到铁道旁。雷迪从没来过这里，望着眼前的铁道，不知道这到底是怎么回事。狐奶奶小跑在前，直到一座长长的桥边才停下来。
        - id: ch01-b03
          speaker: granny_fox
          text: 雷迪，到我这儿来，往下面看看。
        - id: ch01-b04
          speaker: narrator
          text: 雷迪听话地往下一瞧，顿时晕得身子直晃，差点栽下去。狐奶奶咧嘴笑了。
        - id: ch01-b05
          speaker: granny_fox
          text: 来，过桥吧。
        - id: ch01-b06
          speaker: narrator
          text: 她轻轻松松地跑过桥，到了另一头。可雷迪是真的害怕。他坐在桥边，连一步也不敢迈。他担心自己会从桥缝里掉下去，落进河里，或是摔在下面尖利的岩石上。狐奶奶只好又跑回来，来到他身边。
        - id: ch01-b07
          speaker: granny_fox
          text: 雷迪，你这样可真不害臊！到底有什么好怕的？别往下看，你就不会有事。来，跟我一起过去。
        - id: ch01-b08
          speaker: narrator
          text: 雷迪还是往后缩，呜呜咽咽地求奶奶带他回家。忽然，狐奶奶像吓坏了似的跳起来。
        - id: ch01-b09
          speaker: granny_fox
          text: 猎犬鲍泽来了！快跑，雷迪，快！
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: 她转身冲上桥，跑得飞快。雷迪顾不上看，也顾不上想，脑子里只有一件事，那就是赶快逃开鲍泽。
        - id: ch01-b11
          speaker: reddy_fox
          text: 奶奶，等等我！等等我！
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: 他使出全身力气追了上去。等他想起脚下还有这座桥，自己早就跑到了桥中央。最后，他平平安安地跑到另一头，却看见老狐奶奶坐在那里，笑个不停。到了这会儿，雷迪才第一次回头去找鲍泽，可连个影子也没有。难道鲍泽从桥上掉下去了？
        - id: ch01-b13
          speaker: reddy_fox
          text: 鲍泽到底在哪儿？
        - id: ch01-b14
          speaker: granny_fox
          text: 他呀，正在布朗农夫家门前的院子里呢。
        - id: ch01-b15
          speaker: narrator
          text: 狐奶奶答得平平淡淡。雷迪盯着她看了一会儿，这才明白，奶奶不过是故意吓他，好让他自己跑过桥。雷迪觉得太丢脸了，真是越想越丢脸。
        - id: ch01-b16
          speaker: granny_fox
          text: 好了，现在我们再跑回去。
        - id: ch01-b17
          speaker: narrator
          text: 这一回，雷迪照办了。
