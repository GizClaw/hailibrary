  chapters:
    - id: ch01
      title: IV. Reddy Fox Grows Bold
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Everyone said Reddy Fox was growing bold, so it must have been true. He had always been sly, but bold? Not Reddy. Then he tricked Bowser the Hound and Farmer Brown's boy again and again, and soon he was feeling very smart indeed. But the one he had really fooled was himself. Yes, Sir, Reddy Fox had fooled himself. Now he was certain no one could ever trick him.
        - id: ch01-b02
          speaker: narrator
          text: It's a terrible habit to think too highly of yourself. And Reddy had that habit. Oh, my, yes! He certainly did. Just mention Bowser the Hound, and up went Reddy's nose.
        - id: ch01-b03
          speaker: reddy_fox
          text: Pooh! I can fool Bowser without even trying.
        - id: ch01-b04
          speaker: narrator
          text: He had completely forgotten the time Bowser fooled him at the railroad bridge. And whenever Reddy saw Farmer Brown's boy, he spoke with the greatest scorn.
        - id: ch01-b05
          speaker: reddy_fox
          text: Afraid of him? I'm certainly not!
        - id: ch01-b06
          speaker: narrator
          text: The more Reddy thought about how smart he was, the bolder he became. Almost every night, he paid a visit to Farmer Brown's henyard. Farmer Brown put traps all around the yard, but Reddy always spotted them and stayed safely away.
        - id: ch01-b07
          speaker: narrator
          text: Soon Unc' Billy Possum and Jimmy Skunk no longer dared to visit the henhouse for eggs. They were afraid they might step into one of the traps meant for Reddy Fox. They missed those fresh eggs, of course, and they blamed Reddy.
        - id: ch01-b08
          speaker: narrator
          text: One day, Jimmy Skunk looked down across the Green Meadows. Reddy was there, stretched out in the sun. Jimmy scowled at him.
        - id: ch01-b09
          speaker: jimmy_skunk
          text: Just wait. Farmer Brown's boy will catch him sooner or later. And I hope he does!
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: Jimmy said it rather spitefully, as though he truly meant every word.
        - id: ch01-b11
          speaker: narrator
          text: People who feel very, very smart usually want everyone else to notice. What fun is it otherwise? Reddy wanted to show just how clever he was, so he grew bold. Very bold indeed.
        - id: ch01-b12
          speaker: narrator
          text: In broad daylight, he went right up to Farmer Brown's henyard. Then, almost under Bowser the Hound's nose, Reddy caught the pet chicken belonging to Farmer Brown's boy.
        - id: ch01-b13
          speaker: narrator
          text: High overhead, Ol' Mistah Buzzard was sailing through the blue, blue sky. He saw Reddy and shook his bald head.
        - id: ch01-b14
          speaker: ol_mistah_buzzard
          text: Ah sees Trouble on the way. Yes, Ah do! Yes, Ah do! Hope he doesn't plan to stay. Yes, Ah do! Yes, Ah do! Trouble is a spry ol' man, bound to find you if he can. If he finds you, he will stick. When Ah sees him, Ah runs quick! Yes, Ah do! Yes, Ah do!
        - id: ch01-b15
          speaker: narrator
          text: But Reddy thought he was so smart that anyone might have believed he was actually hunting for Ol' Mr. Trouble. And the moment Reddy caught that pet chicken, Ol' Mr. Trouble was right at his heels.
