audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 小狐狸雷迪
      tts:
        delivery: 年轻直率，遇到危险时慌张急促
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 中高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 直率鲜明，恼火时带一点尖刻
        timbre: 清晰沉稳
        pace: 适中
        pitch: 中音
    old_mr_buzzard:
      display_name: 老秃鹫先生
      tts:
        delivery: 悠然老练，说唱时带着乡野韵律
        timbre: 苍老沙哑
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第四章　雷迪胆子越来越大
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小狐狸雷迪的胆子一天比一天大。大家都这么讲，那大概就是真的了。以前的雷迪十分狡猾，却并不大胆。可他一次次骗过猎犬鲍泽和布朗农夫的儿子，便把自己当成了最聪明的家伙。说穿了，是一回回的得意把他自己蒙住了。他坚信，再也没人能骗到他。
        - id: ch01-b02
          speaker: narrator
          text: 总把自己看得太了不起，可是世上最坏的习惯之一。雷迪偏偏就有这个毛病，而且还很严重。他不只是偶尔这样，早已经成了习惯。别人一提到猎犬鲍泽，他准会翘起鼻子。
        - id: ch01-b03
          speaker: reddy_fox
          text: 呸！想骗鲍泽还不容易？那简直是天底下最省事的事！
        - id: ch01-b04
          speaker: narrator
          text: 雷迪早就忘了，鲍泽曾经在铁道桥上反过来骗了他。
        - id: ch01-b05
          speaker: narrator
          text: 每次见到布朗农夫的儿子，雷迪也总是一脸瞧不起。
        - id: ch01-b06
          speaker: reddy_fox
          text: 谁怕他呀？我才不怕！
        - id: ch01-b07
          speaker: narrator
          text: 雷迪越想越觉得自己聪明，胆子也越变越大。几乎每个夜里，他都要去布朗农夫家的鸡圈。布朗农夫在四周设了不少陷阱，雷迪却总能一一找出来，从来没有踩进去。
        - id: ch01-b08
          speaker: narrator
          text: 负鼠比利大叔和臭鼬吉米可就倒霉了。他们怕踩中为雷迪设下的陷阱，再也不敢去鸡舍偷蛋。吃不到新鲜鸡蛋，他们自然把气全撒在雷迪身上。
        - id: ch01-b09
          speaker: narrator
          text: 一天，吉米皱着眉，望着正在绿草地上晒太阳的雷迪。
        - id: ch01-b10
          speaker: jimmy_skunk
          text: 等着瞧吧，布朗农夫的儿子早晚会抓住他！我倒真希望他被抓住！
        - id: ch01-b11
          speaker: narrator
          text: 吉米说这话时带着几分刻薄。他可不是随口讲讲，心里当真这么盼着。
        - id: ch01-b12
          speaker: narrator
          text: 自以为聪明的人，往往都喜欢显摆。要是别人看不到自己的聪明，只在心里得意，还有什么意思呢？所以雷迪为了炫耀，竟变得大胆极了。大白天，他就跑进布朗农夫家的鸡圈，差不多是在猎犬鲍泽的鼻子底下，叼走了布朗农夫儿子最心爱的一只鸡。
        - id: ch01-b13
          speaker: narrator
          text: 老秃鹫先生正在高高的蓝天上盘旋。他看见雷迪干的事，摇了摇光秃秃的脑袋，唱了起来。
        - id: ch01-b14
          speaker: old_mr_buzzard
          text: 麻烦来了我瞧见，没错呀，没错呀！但愿它别留身边，没错呀，没错呀！麻烦老头腿脚快，寻你踪迹一路来。一旦逮住甩不掉，我若瞧见赶紧逃！没错呀，没错呀！
        - id: ch01-b15
          speaker: narrator
          text: 可雷迪觉得自己实在太聪明了，那副样子倒像是专门在找麻烦老先生。就在他叼走那只心爱的鸡时，麻烦老先生已经追到了他的脚后跟。
