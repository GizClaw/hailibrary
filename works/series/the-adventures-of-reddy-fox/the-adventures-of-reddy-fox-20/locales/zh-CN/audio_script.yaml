audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练精明，恼怒时尖刻凶狠
        timbre: 苍老而有力
        pace: 从容，动怒时加快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十章　老狐狸奶奶犯了个错
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老狐狸奶奶正在布朗农夫家后面很远的地方，穿过那片长满杂草的老牧场。天气热得厉害，她跑得又累又烦。猎犬鲍泽紧追在后，鼻子一路贴着奶奶的脚印，还不停地扯开大嗓门叫。奶奶正是累了才这样烦躁。她近来很少跑这么多路。天冷时，她倒不怕跑，可今天实在太热了，只好停下来歇一会儿。
        - id: ch01-b02
          speaker: granny_fox
          text: 哎呀，今天怎么这么热！
        - id: ch01-b03
          speaker: narrator
          text: 老狐狸奶奶既聪明，又有见识。狐狸用来骗过追捕者的招数，她样样都懂。她随时都能把鲍泽弄迷糊，叫他再也找不到自己的踪迹。可现在还不是时候，她一点儿也不急着使出那些招数。奶奶反而处处留心，故意把脚印留得清清楚楚，好让鲍泽继续跟上来。
        - id: ch01-b04
          speaker: narrator
          text: 哪怕自己又累、又热、又烦，她也非这样做不可。因为她要把鲍泽，还有跟着鲍泽的布朗家男孩，领到很远很远的地方。几天前，男孩开枪打伤了小狐狸雷迪。雷迪正在家里养伤，奶奶就是要把追赶的人从那里引开。
        - id: ch01-b05
          speaker: narrator
          text: 鲍泽“汪、汪、汪”地吼个不停。奶奶往哪边绕，他就循着踪迹往哪边追，一步也没走错。她带着鲍泽在老牧场上兜来兜去，又钻进山边的乱石丛。这条路离绿草原和绿森林远极了，而且是奶奶故意绕远的。
        - id: ch01-b06
          speaker: narrator
          text: 奶奶宁可自己受累，也要把鲍泽和布朗家的男孩拖得筋疲力尽。等她最后布下迷阵，甩掉他们，他们就会累得连绿草原也回不去了。
        - id: ch01-b07
          speaker: narrator
          text: 过了一阵，奶奶来到地上的一个洞口。这里原是一座老宅子，从前属于她的祖父。宅子的后门紧挨着一棵倒下的空心树干，藏得十分隐蔽。奶奶从前门跑进屋，再溜出后门，钻过那截空树干，最后跳进一条浅浅的小溪。
        - id: ch01-b08
          speaker: narrator
          text: 溪里的水刚够沾湿她的脚。奶奶踩着水往前走，脚印里便不再留下能让鲍泽追踪的气味。
        - id: ch01-b09
          speaker: narrator
          text: 鲍泽一路吼到老宅子的前门。奶奶的新鲜脚印明明白白地通进屋里，他兴奋得闹出震天的声响。他以为自己终于找到了奶奶的家，至少他自己深信不疑。他也认定奶奶就在里面。毕竟，只有进去的脚印，没有出来的脚印。
        - id: ch01-b10
          speaker: narrator
          text: 鲍泽一次也没想到要找找后门。其实，就算找了也没有用。他不会知道，老狐狸奶奶早已穿过空树干，悄悄溜走了。
        - id: ch01-b11
          speaker: narrator
          text: 奶奶听见鲍泽闹得不可开交，忍不住咧嘴笑了。她歇过一会儿，便悄悄爬上山坡。从那里，她正好能看见废弃老宅的入口。鲍泽还在一边刨土，一边狂叫。奶奶看着看着，脸上却慢慢有了忧色。
        - id: ch01-b12
          speaker: granny_fox
          text: 布朗家的男孩跑到哪儿去了？我还以为，他肯定会跟着鲍泽过来呢。
