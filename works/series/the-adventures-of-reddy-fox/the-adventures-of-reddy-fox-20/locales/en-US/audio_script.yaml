audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    granny_fox:
      display_name: Old Granny Fox
      tts:
        delivery: wise and determined with a dry edge
        timbre: mature and slightly husky
        pace: measured
        pitch: medium-low
    bowser_the_hound:
      display_name: Bowser the Hound
      tts:
        delivery: loud and eager
        timbre: deep and booming
        pace: lively
        pitch: low
  chapters:
    - id: ch01
      title: XX. Old Granny Fox Makes a Mistake
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Granny Fox was running through the overgrown pasture far behind Farmer Brown's. It was a very warm day, and she was hot, tired, and cross. Bowser the Hound came behind her with his nose on her trail, making a great noise with his big voice.
        - id: ch01-b02
          speaker: narrator
          text: Granny was tired because she hadn't run much lately. She didn't mind running in cold weather. But now she stopped for a moment to rest.
        - id: ch01-b03
          speaker: granny_fox
          text: Oh dear, it is hot!
        - id: ch01-b04
          speaker: narrator
          text: Old Granny Fox was very smart and very wise. She knew every trick a fox could use to fool someone on her trail. She could have puzzled Bowser until he couldn't follow her at all, but she wasn't ready to do that. Instead, she made sure her tracks stayed easy to follow.
        - id: ch01-b05
          speaker: narrator
          text: She wanted Bowser to keep coming, even though the chase left her tired, hot, and cross. She was leading him, and Farmer Brown's boy with him, far away from Reddy Fox's home. Reddy was there nursing the wounds he had received when the boy shot at him a few days earlier.
        - id: ch01-b06
          speaker: bowser_the_hound
          text: Bow, wow, wow!
        - id: ch01-b07
          speaker: narrator
          text: Bowser roared as he followed every twist and turn Granny made, exactly as she wanted. She led him back and forth across the old pasture, then high among the rocks at the mountain's edge.
        - id: ch01-b08
          speaker: narrator
          text: They were a long, long, long way from the Green Meadows and the Green Forest. Granny had planned it that way. She was willing to tire herself if she could tire Bowser and Farmer Brown's boy, too. Then, once she fooled them and left them behind, they would be too worn out to return to the Green Meadows.
        - id: ch01-b09
          speaker: narrator
          text: After a while, Granny reached a hole in the ground. It was an old house that had once belonged to her grandfather. A back door was hidden beside the hollow trunk of a fallen tree.
        - id: ch01-b10
          speaker: narrator
          text: Granny ran straight through the house and slipped out the back. She hurried through the hollow tree, then jumped into a little brook where the water barely covered her feet. By walking in the water, she left no scent for Bowser to follow.
        - id: ch01-b11
          speaker: narrator
          text: Bowser came roaring up to the front door. Granny's tracks went right inside, and he grew so excited that he made a tremendous noise. He thought he had finally found her home. Her fresh tracks entered the house, and no tracks came out, so he was sure she must be inside.
        - id: ch01-b12
          speaker: narrator
          text: Bowser never thought to look for a back door. Even if he had, it wouldn't have helped him. Granny had already escaped through the hollow tree trunk.
