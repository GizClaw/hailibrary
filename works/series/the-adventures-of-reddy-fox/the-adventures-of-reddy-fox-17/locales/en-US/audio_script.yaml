  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: youthful and determined
        timbre: clear and sturdy
        pace: brisk
        pitch: medium
    unc_billy_possum:
      display_name: Unc' Billy Possum
