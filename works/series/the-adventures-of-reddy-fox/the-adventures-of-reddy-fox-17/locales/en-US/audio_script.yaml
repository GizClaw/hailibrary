  chapters:
    - id: ch01
      title: XVII. Farmer Brown's Boy Is Determined
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Farmer Brown's boy had made up his mind. Anyone who knew him could tell. He had clicked his teeth shut, and his lips had tightened into one thin, straight line. Now he sat cleaning his gun. As he worked, he thought about his pet chicken and all the other chickens Reddy Fox had taken.
        - id: ch01-b02
          speaker: farmer_browns_boy
          text: I'm going to catch that fox, even if it takes me all summer! I should have gotten him the other day when I had the chance. But next time? Well, Mr. Fox, you'll find out what happens next time.
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: Someone heard every word, though Farmer Brown's boy never knew it. Unc' Billy Possum was hiding inside the very woodpile the boy was sitting on. He lifted his ears and listened.
        - id: ch01-b04
          speaker: narrator
          text: Unc' Billy didn't like the sound of that voice. He remembered how Reddy Fox was still so stiff, sore, and lame that he could hardly walk. The shot Farmer Brown's boy thought had missed was the very thing that had hurt him.
        - id: ch01-b05
          speaker: unc_billy_possum
          text: There isn't going to be any next time. No, sir, there surely isn't. I don't have any love for Reddy Fox, but I can't let that boy shoot him again. I certainly can't!
        - id: ch01-b06
          speaker: narrator
          text: Farmer Brown's boy neither saw nor heard him. Unc' Billy crept out through the back of the woodpile and hurried beneath the henhouse. The boy was far too busy thinking about how he would catch Reddy Fox.
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: I'll hunt all across the Green Meadows and through the Green Forest until I get that fox! He isn't going to steal any more of my chickens. No, sir! His home must be somewhere in the meadows or the forest, and I'm going to find it. Then you'd better watch out, Mr. Fox!
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: He looked fierce enough to mean every word. Then he whistled for Bowser the Hound, and the two of them set off toward the Green Forest.
        - id: ch01-b09
          speaker: narrator
          text: Unc' Billy poked his sharp little old face out from under the henhouse and watched them leave. He was usually grinning, but there wasn't even the smallest grin on his face now. Unc' Billy looked worried.
        - id: ch01-b10
          speaker: unc_billy_possum
          text: There goes that boy with a gun, and nobody knows what might happen when it goes off. If he doesn't find Reddy Fox, he may point it at somebody else just for fun. I hope he doesn't run into my wife or any of my little ones. A boy with a gun scares me. It seems like he hasn't got any sense at all. I'd better hurry home and tell my family to stay close inside the old hollow tree.
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: Unc' Billy slipped out from his hiding place. Then he ran toward the Green Forest as fast as he could go.
