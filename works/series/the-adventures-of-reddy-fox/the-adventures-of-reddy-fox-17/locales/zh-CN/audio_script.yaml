audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    farmer_browns_boy:
      display_name: 布朗家的男孩
      tts:
        delivery: 年轻直率，下定决心时坚定有力
        timbre: 清亮结实
        pace: 轻快利落
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 悠闲诙谐，打趣时故作严厉
        timbre: 粗暖而略带鼻音
        pace: 从容适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十七章　布朗家的男孩下定决心
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 布朗家的男孩已经拿定了主意。熟悉他的人一眼就看得出来。他咬紧牙齿，发出“咔嗒”一声，嘴唇也抿成了又直又薄的一条线。这会儿，他正坐在那里擦枪，脑子里想的全是自己心爱的那只小鸡，还有被小狐狸雷迪叼走的其他那些鸡。
        - id: ch01-b02
          speaker: farmer_browns_boy
          text: 就算花上一整个夏天，我也一定要逮住那只狐狸！前些天有机会开枪，我真该把他打中。下一回嘛……哼，狐狸先生，咱们走着瞧！
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: 男孩不知道，他说的每一个字都被别人听见了。负鼠比利大叔就藏在男孩正坐着的那堆木柴里面呢。听到这番话，他马上竖起耳朵。
        - id: ch01-b04
          speaker: narrator
          text: 比利大叔不喜欢男孩说话的口气。他想起雷迪到现在还浑身僵硬，处处疼痛，腿也瘸了，几乎连路都走不了。害雷迪变成这样的，正是男孩以为没有打中的那一枪。
        - id: ch01-b05
          speaker: unc_billy_possum
          text: 不会有下一回了。是的，先生，绝对不会。我确实不喜欢小狐狸雷迪，可也不能让他再挨一枪。那可绝对不行！
        - id: ch01-b06
          speaker: narrator
          text: 布朗家的男孩当然没听见。他也根本没看见比利大叔从木柴堆后面悄悄爬出来，又飞快钻到鸡舍底下。男孩一门心思，只顾琢磨怎么抓住雷迪。
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: 我要把绿草地和绿森林全都找遍，不逮住那只狐狸就不停下！我绝不会再让他偷走我的鸡。绝对不会！他的家准在绿草地或者绿森林里，我一定能找出来。到时候，你可得小心了，狐狸先生！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 男孩说这话时满脸凶相，看样子当真要说到做到。他吹了声口哨，唤来猎犬鲍泽，随后一起朝绿森林走去。
        - id: ch01-b09
          speaker: narrator
          text: 比利大叔从鸡舍底下探出尖尖的老脸，望着他们越走越远。他平时总是笑眯眯的，这会儿脸上却连一丁点儿笑意也没有，只有满满的忧虑。
        - id: ch01-b10
          speaker: unc_billy_possum
          text: 那孩子带着枪走了，谁知道枪一响会闹出什么事。要是找不到小狐狸雷迪，他说不定会为了好玩，把枪口对准别人。我只盼他别碰上我家老婆子，也别碰上我那几个小娃娃。我是真的怕拿枪的孩子。他看起来一点儿分寸都没有。我得赶紧回去，叫一家子都守在那棵老空心树里，千万别走远。
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: 比利大叔一边嘀咕，一边从藏身的地方溜了出来。接着，他使出全身力气，一路朝绿森林飞奔而去。
