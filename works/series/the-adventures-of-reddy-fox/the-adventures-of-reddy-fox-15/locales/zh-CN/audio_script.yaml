audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 小狐狸雷迪
      tts:
        delivery: 年轻直率，遇到危险时慌张急促
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 中高音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 悠闲诙谐，打趣时故作严厉
        timbre: 粗暖而略带鼻音
        pace: 从容适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十五章　小狐狸雷迪来了一位客人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老狐狸奶奶上山找小鸡去了。她才走得看不见，负鼠比利大叔便沿着孤独小径溜达过来。他刚美美地吃完早饭，一路还哼着小曲。
        - id: ch01-b02
          speaker: narrator
          text: 一阵欢乐小微风发现了他，赶忙迎上去，把雷迪挨枪打的消息说了。比利大叔原本笑着跟小微风打招呼，听着听着，那笑容便越咧越大。
        - id: ch01-b03
          speaker: unc_billy_possum
          text: 这件事，你真的一点儿也没弄错？
        - id: ch01-b04
          speaker: narrator
          text: 欢乐小微风肯定得很。比利大叔停下来，仔细琢磨了一阵。
        - id: ch01-b05
          speaker: unc_billy_possum
          text: 那个没出息的雷迪就是活该！他在布朗农夫家闹得鸡飞狗跳，害得我没法再去那里捕猎。现在那儿可不安全喽，往后好一阵子也安全不了。对了，你是不是说老狐狸奶奶在家？
        - id: ch01-b06
          speaker: narrator
          text: 欢乐小微风本来没提过老狐狸奶奶，不过这会儿想起来了，她已经上山去了。
        - id: ch01-b07
          speaker: unc_billy_possum
          text: 那我就去看看雷迪，顺便给他送上一点儿同情吧。
        - id: ch01-b08
          speaker: narrator
          text: 比利大叔朝雷迪家走去。等他确定老狐狸奶奶不在，才露了面。雷迪正躺在门阶上，浑身难受，又疼又僵。说真的，他僵得一步也走不了。他虚弱得厉害，也饿得厉害，简直饿坏了。
        - id: ch01-b09
          speaker: narrator
          text: 听见脚步声，雷迪以为奶奶找到了那只小鸡，正带回来给他。他难受得连转过头去，看看来人是谁的力气也没有。
        - id: ch01-b10
          speaker: reddy_fox
          text: 奶奶，您拿到小鸡了吗？
        - id: ch01-b11
          speaker: narrator
          text: 没有人回答。
        - id: ch01-b12
          speaker: reddy_fox
          text: 奶奶，我问您呢，您拿到小鸡了吗？
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: 雷迪这回的声音有点儿尖，还带着不耐烦。可依旧没人回答，他终于起了疑心。雷迪翻过身，抬头一看，来的不是奶奶，而是正冲他咧嘴笑的比利大叔。
        - id: ch01-b14
          speaker: unc_billy_possum
          text: 自作聪明当小偷，自作聪明栽跟头！只因卖弄图快活，偏往上膛的枪前凑。
        - id: ch01-b15
          speaker: unc_billy_possum
          text: 你这回就是自作自受，我看了可痛快极了！真的，先生，我实在太痛快了！
        - id: ch01-b16
          speaker: narrator
          text: 比利大叔故意板着脸。雷迪眼里顿时冒出怒火，那双眼睛一时间变成了难看的黄色。可他病得太厉害，连吵架的力气也没有。
        - id: ch01-b17
          speaker: narrator
          text: 比利大叔看得出雷迪正在受苦，心底其实真有些替他难过。不过，他半点儿也不肯让雷迪知道。不，他才不会让雷迪瞧出来！他反倒装出一副乐坏了的样子，好像看到雷迪动弹不得，叫他高兴得要命。
        - id: ch01-b18
          speaker: narrator
          text: 他怕老狐狸奶奶随时回来，不敢在那里多待一会儿。临走前，他还故意多说了几句难听话，非要让雷迪听得浑身不自在。说完以后，比利大叔才沿着孤独小径走了，朝绿森林而去。
        - id: ch01-b19
          speaker: unc_billy_possum
          text: 雷迪这样可真糟，真糟啊！老狐狸奶奶要是没本事让他填饱肚子，我就得想想，咱们能做点儿什么。我一定得想想。
