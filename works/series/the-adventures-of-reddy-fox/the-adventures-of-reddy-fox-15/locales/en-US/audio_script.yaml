  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: youthful and expressive
        timbre: bright and clear
        pace: quick
        pitch: medium-high
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: sly and easygoing with a warm Southern lilt
        timbre: mellow and slightly raspy
