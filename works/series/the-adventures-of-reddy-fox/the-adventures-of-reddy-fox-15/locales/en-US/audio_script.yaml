  chapters:
    - id: ch01
      title: XV. Reddy Fox Has a Visitor
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Granny Fox had barely disappeared up the hill to look for the chicken she had left there when Unc' Billy Possum came strolling down the Lone Little Path. He hummed as he went, feeling content after a good breakfast. One of the Merry Little Breezes spotted him, hurried over, and told him that Reddy Fox had been shot.
        - id: ch01-b02
          speaker: narrator
          text: Unc' Billy listened. The grin he had worn when the Breeze greeted him spread into a broad smile.
        - id: ch01-b03
          speaker: unc_billy_possum
          text: Are yo' all certain that's true?
        - id: ch01-b04
          speaker: narrator
          text: The Merry Little Breeze was certain. Unc' Billy stopped on the path and thought for a few minutes. Then he chuckled before answering.
        - id: ch01-b05
          speaker: unc_billy_possum
          text: That no-'count Reddy Fox got exactly what was coming to him. He stirred up those hens at Farmer Brown's and spoiled mah hunting. It isn't safe to go up there now. No, Suh, and it won't be safe again for a good long while. Did yo' say Granny Fox was at home?
        - id: ch01-b06
          speaker: narrator
          text: The Breeze had said nothing about Granny Fox. Then it remembered seeing her go up the hill.
        - id: ch01-b07
          speaker: unc_billy_possum
          text: Ah believe Ah'll carry a little sympathy over to Reddy Fox.
        - id: ch01-b08
          speaker: narrator
          text: With that, Unc' Billy set off toward Reddy's house. Before showing himself, though, he made quite sure that old Granny Fox was away.
        - id: ch01-b09
          speaker: narrator
          text: Reddy lay on his doorstep, sick, sore, and stiff. He was so stiff that he could not walk at all. He was weak, too, and terribly hungry. When he heard footsteps, he thought Granny was coming back with the chicken. He felt too ill even to turn his head.
        - id: ch01-b10
          speaker: reddy_fox
          text: Did you bring back the chicken, Granny?
        - id: ch01-b11
          speaker: narrator
          text: Reddy's voice was weak, but no one answered. He tried again, this time sounding sharp and cross.
        - id: ch01-b12
          speaker: reddy_fox
          text: Granny, I asked if you got the chicken!
        - id: ch01-b13
          speaker: narrator
          text: Again, there was no answer. Now Reddy began to wonder. He rolled over, lifted his head, and looked. It was not Granny Fox at all. Unc' Billy Possum stood there, grinning down at him.
        - id: ch01-b14
          speaker: unc_billy_possum
          text: |-
            Smarty, Smarty was a thief!
            Smarty, Smarty came to grief!
            Tried to show off just for fun,
            Then ran too near a loaded gun.
        - id: ch01-b15
          speaker: unc_billy_possum
          text: Yo' all surely got what yo' deserve, and Ah'm glad. Yes, Suh, Ah'm glad of it!
        - id: ch01-b16
          speaker: narrator
          text: Unc' Billy spoke severely. For one moment, anger flashed in Reddy's eyes and turned them an ugly yellow. But Reddy felt far too sick to quarrel.
        - id: ch01-b17
          speaker: narrator
          text: Unc' Billy saw how much Reddy was suffering, and deep in his heart he truly felt sorry for him. He never let Reddy see it. No, indeed. He acted as if nothing could please him more than finding Reddy so helpless.
        - id: ch01-b18
          speaker: narrator
          text: He did not dare stay long, because Granny Fox might come back. After a few more remarks meant to make Reddy uncomfortable, Unc' Billy headed up the Lone Little Path toward the Green Forest.
        - id: ch01-b19
          speaker: unc_billy_possum
          text: Too bad. Too bad. If ol' Granny Fox isn't clever enough to find Reddy plenty to eat, Ah'll have to see what we-alls can do. Ah surely will.
