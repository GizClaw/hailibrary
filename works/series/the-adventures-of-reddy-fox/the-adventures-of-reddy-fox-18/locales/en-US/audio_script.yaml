  chapters:
    - id: ch01
      title: XVIII. The Hunt for Reddy Fox
      blocks:
        - id: ch01-b01
          speaker: granny_fox
          text: Trouble, trouble, trouble. I can feel it in the air. Trouble, trouble, trouble. It's all around me everywhere.
        - id: ch01-b02
          speaker: narrator
          text: Old Granny Fox kept muttering those words. She paced back and forth uneasily, sniffing the air as she went.
        - id: ch01-b03
          speaker: reddy_fox
          text: I don't see any trouble, and I can't feel any in the air. The only trouble I feel is in all the sore places where I was shot.
        - id: ch01-b04
          speaker: narrator
          text: Reddy Fox lay stretched across the doorstep of their home.
        - id: ch01-b05
          speaker: granny_fox
          text: That's because you don't have any sense. Once you get some and learn to watch where you're going, you won't be shot from behind old tree trunks. Then you'll feel trouble coming before it shows itself. I feel it now. Go down into the house and stay there!
        - id: ch01-b06
          speaker: narrator
          text: Granny stopped and tested the air with her nose once more. She had been doing that for ten minutes.
        - id: ch01-b07
          speaker: reddy_fox
          text: But I don't want to go inside. It's nice and warm out here. I feel much better here than I do curled up down there in the dark.
        - id: ch01-b08
          speaker: narrator
          text: Reddy whined, but Granny Fox turned and fixed him with blazing eyes. She never said a word. She didn't need to. Reddy crawled into the house, muttering under his breath. Then Granny pushed her head through the doorway.
        - id: ch01-b09
          speaker: granny_fox
          text: Don't come out until I get back. Farmer Brown's boy is on his way, and he has his gun.
        - id: ch01-b10
          speaker: narrator
          text: Reddy shivered. He didn't believe her. He thought she had only said it to frighten him into staying inside. Still, he shivered. Reddy knew what being shot meant now. He was still so stiff and sore that he couldn't run, all because he had gone too close to Farmer Brown's boy and his gun.
        - id: ch01-b11
          speaker: narrator
          text: But Granny Fox had not been fooling him. Farmer Brown's boy really was coming with a gun. He was walking down the Lone Little Path, while Bowser the Hound trotted ahead of him.
        - id: ch01-b12
          speaker: narrator
          text: How had Granny known? She had simply felt it. She hadn't heard them. She hadn't seen them. She hadn't even smelled them. She had only felt that they were coming. The moment she saw that Reddy had obeyed, she darted away like a little red flash.
        - id: ch01-b13
          speaker: granny_fox
          text: I can't let them find our home.
        - id: ch01-b14
          speaker: narrator
          text: With that thought, Granny disappeared into the Green Forest.
        - id: ch01-b15
          speaker: narrator
          text: First, she hurried to a little point on the hill where she could look down on the Lone Little Path. Sure enough, there was Farmer Brown's boy. Bowser the Hound was in front, sniffing every bush and searching all along the path.
        - id: ch01-b16
          speaker: narrator
          text: Granny didn't wait another moment. She raced around in a wide circle. It brought her onto the Lone Little Path below the boy and the hound, just beyond a bend where they couldn't see her.
        - id: ch01-b17
          speaker: narrator
          text: She trotted a short way down the path, then turned into the woods. After hurrying back up the hill, she sat and waited.
        - id: ch01-b18
          speaker: narrator
          text: A few minutes later, Bowser's great voice rang out. He had found Granny's scent on the Lone Little Path, and now he was following it. Granny Fox grinned. Her plan was to draw them far, far away from the home where Reddy lay hidden. They must never find it.
        - id: ch01-b19
          speaker: narrator
          text: Farmer Brown's boy grinned too when he heard Bowser's voice.
        - id: ch01-b20
          speaker: farmer_browns_boy
          text: I'll keep hunting that fox until I catch him.
        - id: ch01-b21
          speaker: narrator
          text: He knew nothing about old Granny Fox. He thought Bowser was following Reddy.
