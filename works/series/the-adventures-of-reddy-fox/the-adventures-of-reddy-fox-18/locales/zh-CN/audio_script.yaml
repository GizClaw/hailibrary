audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 小狐狸雷迪
      tts:
        delivery: 狡黠好强，受伤时压着疼痛和恼火
        timbre: 略带沙哑的年轻嗓音
        pace: 平稳，疼痛时稍慢
        pitch: 中音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练精明，恼怒时尖刻凶狠
        timbre: 苍老而有力
        pace: 从容，动怒时加快
        pitch: 中低音
    farmer_browns_boy:
      display_name: 布朗家的男孩
      tts:
        delivery: 年轻直率，下定决心时坚定有力
        timbre: 清亮结实
        pace: 轻快利落
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十八章　追捕小狐狸雷迪
      blocks:
        - id: ch01-b01
          speaker: granny_fox
          text: 麻烦，麻烦，麻烦，我感觉它就在风里。麻烦，麻烦，麻烦，四面八方全是它的踪迹。
        - id: ch01-b02
          speaker: narrator
          text: 老狐狸奶奶不安地来回踱步，鼻子不停地嗅着空气，嘴里反反复复念叨着这几句话。
        - id: ch01-b03
          speaker: reddy_fox
          text: 我什么麻烦也没看见，风里也感觉不到。我只知道挨枪打过的地方还都在疼。
        - id: ch01-b04
          speaker: narrator
          text: 小狐狸雷迪说着，在自家门阶上把身子摊得长长的。
        - id: ch01-b05
          speaker: granny_fox
          text: 那是因为你一点儿头脑也没有。等你有了头脑，也知道走路要看前面，就不会再叫躲在老树桩后面的人开枪打中了。真学会了本事，麻烦还没露面，你就能感觉到它。我现在就感觉到了。快下去，留在屋里！
        - id: ch01-b06
          speaker: narrator
          text: 奶奶停下脚步，又仰起鼻子试探了一回。整整十分钟，她一直在这样察看动静。
        - id: ch01-b07
          speaker: reddy_fox
          text: 我不想进去。外面暖暖和和的，多舒服啊。要我缩到下面那个黑洞洞的地方去，身上反而更难受。
        - id: ch01-b08
          speaker: narrator
          text: 雷迪拖着声音抱怨。老狐狸奶奶猛地转身，两眼冒火地盯住他，却一句话也没说。她根本不必开口。雷迪嘴里嘟嘟囔囔，身子却已经乖乖爬进了洞。奶奶把头伸到门口。
        - id: ch01-b09
          speaker: granny_fox
          text: 我没回来，你就不许出去。布朗家的男孩正带着枪往这边来。
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 雷迪一听，身上立刻打了个哆嗦。他并不相信奶奶，只当这是奶奶编出来吓他的，好逼他待在洞里。可他还是怕得发抖。毕竟，他已经知道挨枪是什么滋味了。上次离男孩和那支枪太近，害得他直到现在还又僵又疼，连跑都跑不动。
        - id: ch01-b11
          speaker: narrator
          text: 这一次，老狐狸奶奶可没有骗他。布朗家的男孩真的带枪来了。他正走在孤独小径上，猎犬鲍泽小跑着冲在前头。奶奶怎么会知道呢？她只是感觉到了，除此以外，什么凭据也没有。她没听见，没看见，也没闻见他们，却知道他们正在靠近。雷迪一躲好，她便像一道红色的小闪电，飞奔出去。
        - id: ch01-b12
          speaker: granny_fox
          text: 绝不能让他们找到我们的家。
        - id: ch01-b13
          speaker: narrator
          text: 她低声说完，转眼就消失在绿森林里。她先赶到山坡上一个突出的地方，低头就能看见孤独小径。果然，男孩来了。鲍泽走在前面，沿路到处闻，连一丛灌木也不肯漏掉。
        - id: ch01-b14
          speaker: narrator
          text: 奶奶只看了一眼，马上绕着大圈拼命奔跑。她抢先到了男孩和鲍泽下方的孤独小径，藏在弯道后面，男孩和鲍泽谁也看不到她。她沿小径往下跑了一小段，又转进树林，赶回山坡坐着等待。
        - id: ch01-b15
          speaker: narrator
          text: 几分钟后，猎犬鲍泽的大嗓门响起来了。他在小径上闻到了奶奶的足迹，正一路追踪。老狐狸奶奶咧嘴一笑。她留下气味，就是要把他们引得远远的，离雷迪藏身的洞穴越远越好。无论如何，也不能让他们找到狐狸的家。
        - id: ch01-b16
          speaker: narrator
          text: 布朗家的男孩听见鲍泽的叫声，也咧嘴笑了。
        - id: ch01-b17
          speaker: farmer_browns_boy
          text: 我一定要追到那只狐狸！
        - id: ch01-b18
          speaker: narrator
          text: 他哪里知道老狐狸奶奶也在这里，还以为鲍泽追踪的一直是小狐狸雷迪呢。
