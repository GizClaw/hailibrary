audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    drummer_woodpecker:
      display_name: 啄木鸟鼓手
      tts:
        delivery: 热心直爽，抱怨时嘴硬心软
        timbre: 清脆明亮
        pace: 明快
        pitch: 中高音
    farmer_browns_boy:
      display_name: 布朗农夫的儿子
      tts:
        delivery: 朴实干脆，生气时坚决有力
        timbre: 年轻清朗
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第六章　啄木鸟鼓手白敲了一通
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，雷迪还没觉得自己聪明绝顶时，奔跑起来总会眼观六路，绝不会把四周的动静抛在脑后。他一定能瞧见老树后面伸出的那截东西。那东西正对着他奔去的方向，活像一截枪管，肯定会让他疑心大起，变得非常警觉。可现在，雷迪只想着，这是个多好的机会啊！他正好可以让绿草地和绿森林里的小居民看看，自己有多大胆，又有多聪明。
        - id: ch01-b02
          speaker: narrator
          text: 雷迪又坐了下来，非要等猎犬鲍泽快追到跟前才动身。就在这时，啄木鸟鼓手突然敲得震天响。嗒嗒嗒嗒嗒，嗒嗒嗒嗒嗒，嗒嗒嗒嗒嗒！谁听见这阵声音，都知道是危险警报，因为鼓手平时消遣，绝不会用这种敲法。可雷迪完全没理会这阵危险警报，甚至根本没有留意。他心里装满了自己的聪明，哪里还容得下别的事。
        - id: ch01-b03
          speaker: drummer_woodpecker
          text: 真是个笨家伙！我干吗还要提醒他呢？绿草地和绿森林里要是没了他，大家的日子反而好过得多，好过得多！谁都不喜欢他。他就是个可恶的恶霸，整天欺负比自己弱小的居民，不是想抓住他们，就是想把他们吓个半死。可是……他长得还真漂亮！
        - id: ch01-b04
          speaker: narrator
          text: 鼓手把脑袋歪向一边，望着那边的雷迪。雷迪正看着鲍泽费尽力气，想从自己故意搅乱的足迹里理出头绪，忍不住笑个不停。
        - id: ch01-b05
          speaker: drummer_woodpecker
          text: 没错，他确实长得漂亮。
        - id: ch01-b06
          speaker: narrator
          text: 鼓手又低头望向自己栖身的老树脚下。这一看，他终于拿定了主意。
        - id: ch01-b07
          speaker: drummer_woodpecker
          text: 要是以后再也看不到他那身漂亮的红毛，我一定会想念的！真的会！这回他要是还听不见，也不肯当心，可不能怪我！
        - id: ch01-b08
          speaker: narrator
          text: 啄木鸟鼓手对准老树的树干，发疯似的敲了起来。嗒嗒嗒嗒嗒！急促的敲击声传遍绿森林，又越过绿草地，几乎一直传到紫山。
        - id: ch01-b09
          speaker: narrator
          text: 老树脚下，一张布满雀斑、阴沉沉的脸抬起来往上看。那正是布朗农夫的儿子。
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: 那只讨厌的啄木鸟到底犯什么毛病？再不安静，它就要把狐狸吓跑了！
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: 他冲着鼓手挥了挥拳头。鼓手却像根本没看见，还是一个劲儿地敲。嗒嗒嗒嗒嗒，嗒嗒嗒嗒嗒，嗒嗒嗒嗒嗒！
