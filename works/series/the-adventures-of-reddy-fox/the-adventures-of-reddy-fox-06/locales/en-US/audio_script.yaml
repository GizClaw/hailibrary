  chapters:
    - id: ch01
      title: VI. Drummer the Woodpecker Drums in Vain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There was a time when Reddy Fox never would have run anywhere without watching every direction. Back then, he would have spotted the thing like a gun barrel poking out from behind the old tree ahead. He would have known at once that something was wrong, and he would have been very suspicious indeed.
        - id: ch01-b02
          speaker: narrator
          text: But Reddy had come to think he was very, very smart. Now he could think of only one thing. This was his splendid chance to show all the little meadow and forest people how bold and clever he was.
        - id: ch01-b03
          speaker: narrator
          text: Reddy did exactly what he had done before. He sat down once again and waited until Bowser the Hound was almost upon him. Just then, Drummer the Woodpecker made a tremendous racket. Rat-a-tat-tat-tat! Rat-a-tat-tat-tat! Rat-a-tat-tat-tat!
        - id: ch01-b04
          speaker: narrator
          text: Everyone who heard that drumming knew it meant danger. Drummer never beat out that particular call for fun. But Reddy paid no attention. He was so full of thoughts about his own cleverness that there was no room in his head for anything else.
        - id: ch01-b05
          speaker: drummer_woodpecker
          text: What a stupid creature! Why am I even trying to warn him? The Green Meadows and the Green Forest would be much better off without him. Nobody likes him. He's a dreadful bully, always trying to catch smaller folk or frighten them to death. Still... he is so handsome!
        - id: ch01-b06
          speaker: narrator
          text: Drummer tilted his head to one side and studied Reddy Fox. Reddy was laughing as he watched Bowser struggle to sort out the trail he had mixed up.
        - id: ch01-b07
          speaker: drummer_woodpecker
          text: Yes, Sir. He certainly is handsome.
        - id: ch01-b08
          speaker: narrator
          text: Then Drummer looked down at the foot of the old tree where he sat. What he saw there settled the matter for him.
        - id: ch01-b09
          speaker: drummer_woodpecker
          text: I really would miss the sight of that beautiful red coat. I surely would! I'll warn him once more. If he doesn't listen this time, it won't be my fault!
        - id: ch01-b10
          speaker: narrator
          text: Drummer struck the trunk with a furious rat-a-tat-tat-tat. The sound rang through the Green Forest, swept across the Green Meadows, and nearly reached the Purple Hills.
        - id: ch01-b11
          speaker: narrator
          text: At the foot of the tree, a freckled face with a dark scowl turned upward. It belonged to Farmer Brown's boy.
        - id: ch01-b12
          speaker: farmer_browns_boy
          text: What's wrong with that pesky woodpecker? If he won't be quiet, he'll scare the fox away!
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: The boy shook his fist at Drummer. Drummer seemed not to notice at all. He simply went on. Rat-a-tat-tat-tat! Rat-a-tat-tat-tat! Rat-a-tat-tat-tat!
