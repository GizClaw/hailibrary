  chapters:
    - id: ch01
      title: XI. Granny Fox Returns
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Granny Fox came trotting over the hill. She was heading home, and she carried a tender young chicken for Reddy Fox. Poor Reddy! He had been showing off and had grown careless. It was his own fault that he had gone so close to the old tree trunk where Farmer Brown's boy was hiding.
        - id: ch01-b02
          speaker: narrator
          text: Granny Fox knew nothing about that. She never made such mistakes herself. Oh, my, no! When she reached a spot where she could see her home, she put down the chicken. Then she slipped behind a little bush and searched the Green Meadows to make sure the way was clear.
        - id: ch01-b03
          speaker: narrator
          text: Granny knew Bowser the Hound was chained up. She had already seen Farmer Brown and his boy hoeing in the cornfield. Neither of them gave her any reason to be afraid.
        - id: ch01-b04
          speaker: narrator
          text: She looked toward her doorstep and saw Reddy Fox stretched out in the sunshine. Then she noticed something else. Her eyes flashed, and her teeth snapped together. Peter Rabbit was sitting very straight less than ten feet from Reddy.
        - id: ch01-b05
          speaker: granny_fox
          text: So that's the young rascal Reddy meant to catch for me when I was sick! He couldn't do it, but I'll show him how easy it is. Then he can have tender young rabbit along with his chicken!
        - id: ch01-b06
          speaker: narrator
          text: First, Granny studied every patch of tall grass and every bush she might use for cover. She studied them for a long time. There was a hidden path that would take her almost all the way to Peter without letting him see her once.
        - id: ch01-b07
          speaker: narrator
          text: Before she moved, Granny looked one way and then the other. She wanted to be certain that no one was watching. Across the whole Green Meadows, she could not see a single creature looking toward her.
        - id: ch01-b08
          speaker: narrator
          text: So Granny Fox began to crawl. She slipped from one clump of grass to the next, then from bush to bush. At times she pressed herself flat and wriggled forward on her stomach. Little by little, she crept closer and closer to Peter Rabbit.
        - id: ch01-b09
          speaker: narrator
          text: But for all her cleverness, old Granny Fox had forgotten one thing. Yes, Sir, one thing had never entered her mind. She had not looked up at the sky even once.
        - id: ch01-b10
          speaker: narrator
          text: High above her, Ol' Mistah Buzzard was sailing round and round. He looked down as he flew, and he saw everything happening below.
        - id: ch01-b11
          speaker: narrator
          text: Ol' Mistah Buzzard was sharp. He understood exactly what Granny Fox meant to do. He knew her plan as clearly as if he had read her thoughts, and his eyes began to twinkle.
        - id: ch01-b12
          speaker: ol_mistah_buzzard
          text: Ah cert'nly can't let li'l' Brer Rabbit get hurt. No, Ah cert'nly can't!
        - id: ch01-b13
          speaker: narrator
          text: Ol' Mistah Buzzard chuckled. Then he tipped his broad wings downward. Without making a sound, he glided out of the sky until he was right behind Granny Fox.
        - id: ch01-b14
          speaker: ol_mistah_buzzard
          text: Granny Fox, do yo' always crawl when yo' go home?
        - id: ch01-b15
          speaker: narrator
          text: Granny had not heard even the smallest sound. The question startled her so badly that she nearly jumped out of her skin. Of course, Peter Rabbit saw her then. In an instant, he was off like a shot.
        - id: ch01-b16
          speaker: narrator
          text: Granny Fox bared every one of her teeth and snarled at Ol' Mistah Buzzard.
        - id: ch01-b17
          speaker: granny_fox
          text: I wish you would keep out of my business, Mistah Buzzard!
          emotion: angry
        - id: ch01-b18
          speaker: ol_mistah_buzzard
          text: Cert'nly, cert'nly! Ah sho'ly will!
        - id: ch01-b19
          speaker: narrator
          text: With that, Ol' Mistah Buzzard sailed back up into the blue, blue sky.
