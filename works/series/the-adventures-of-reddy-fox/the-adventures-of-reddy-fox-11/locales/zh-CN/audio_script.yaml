audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼机灵，认真劝告时一本正经
        timbre: 清亮年轻
        pace: 明快
        pitch: 中高音
    reddy_fox:
      display_name: 小狐狸雷迪
      tts:
        delivery: 狡黠好强，受伤时压着疼痛和恼火
        timbre: 略带沙哑的年轻嗓音
        pace: 平稳，疼痛时稍慢
        pitch: 中音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练精明，恼怒时尖刻凶狠
        timbre: 苍老而有力
        pace: 从容，动怒时加快
        pitch: 中低音
    ol_mistah_buzzard:
      display_name: 秃鹫老先生
      tts:
        delivery: 悠然机敏，带着诙谐的乡土口吻
        timbre: 粗粝温厚
        pace: 慢悠悠
        pitch: 低音
  chapters:
    - id: ch01
      title: 第十一章　老狐狸奶奶回来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老狐狸奶奶小跑着翻过山坡，嘴里叼着一只鲜嫩的小鸡。她要把小鸡带回家，给受伤的小狐狸雷迪吃。可怜的雷迪！不过，这伤的确怪他自己。他只顾卖弄本事，又太粗心，竟然靠近那截老树桩。布朗家的男孩就躲在那里呢。
        - id: ch01-b02
          speaker: narrator
          text: 老狐狸奶奶并不知道发生了什么。她自己可从不犯这种错，当然不犯！来到能望见自家房子的地方，她先放下小鸡，钻到一丛矮灌木后面，把绿色草原仔细看了一遍。回家的路到底安不安全，她一定要先弄清楚。
        - id: ch01-b03
          speaker: narrator
          text: 猎犬鲍泽拴着链子。农夫布朗和他家的男孩呢，她也亲眼见过，他们正在玉米地里锄草。这两边都不用担心。
        - id: ch01-b04
          speaker: narrator
          text: 她再朝门阶一看，小狐狸雷迪正躺在太阳底下。可紧接着，她又看见了别的东西。老狐狸奶奶眼里顿时冒出火来，牙齿咔嚓一声咬紧了。彼得兔正直挺挺地坐在那里，离雷迪还不到十英尺。
        - id: ch01-b05
          speaker: granny_fox
          text: 原来这就是彼得兔那个小坏蛋！我生病的时候，雷迪说要抓他给我吃，却没能抓着。现在我就让雷迪看看，这件事有多容易。到时候，他除了小鸡，还能吃上一只鲜嫩的小兔子！
        - id: ch01-b06
          speaker: narrator
          text: 老狐狸奶奶没有马上行动。她先把附近每一丛草、每一棵灌木都看了又看，盘算着该躲在哪里爬过去。这样一路摸过去，她几乎能爬到彼得身边，还一次也不用露面。她又朝左右瞧了瞧，确定没有谁在看自己。
        - id: ch01-b07
          speaker: narrator
          text: 绿色草原上，果然没有一个家伙朝这边张望。老狐狸奶奶开始行动了。她从一丛草爬到另一丛草，又从一棵灌木摸到下一棵。有时，她把整个身子贴在地面上，一点一点扭着向前。她离彼得兔越来越近，越来越近。
        - id: ch01-b08
          speaker: narrator
          text: 可是，这么精明的老狐狸奶奶偏偏忘了一件事。是的，先生，她真的忘了一件事。她一次都没有抬头看看天空。
        - id: ch01-b09
          speaker: narrator
          text: 秃鹫老先生正在高处一圈圈盘旋。他低头望着，地面上的一切全看得清清楚楚。
        - id: ch01-b10
          speaker: narrator
          text: 秃鹫老先生机灵得很。他马上猜到老狐狸奶奶想干什么，简直像读过她心里的念头一样。秃鹫老先生眼睛一闪，偷偷笑了。
        - id: ch01-b11
          speaker: ol_mistah_buzzard
          text: 俺可不能让兔兄弟受伤。这事儿，俺当然不能答应！
        - id: ch01-b12
          speaker: narrator
          text: 他把一双宽大的翅膀斜斜向下一压，没发出半点声音，就从天上滑了下来，正好落在老狐狸奶奶身后。
        - id: ch01-b13
          speaker: ol_mistah_buzzard
          text: 狐狸奶奶，您平常回家，也总是这么爬着走吗？
        - id: ch01-b14
          speaker: narrator
          text: 老狐狸奶奶什么也没听见，这一声把她吓得猛然跳起，差点从自己的皮毛里蹦出来。彼得兔当然也发现了她，立刻像一颗出膛的子弹，飞快地逃走了。老狐狸奶奶气得露出满嘴牙齿，恶狠狠地冲秃鹫老先生吼起来。
        - id: ch01-b15
          speaker: granny_fox
          text: 秃鹫先生，我真希望你少管闲事！
          emotion: angry
        - id: ch01-b16
          speaker: ol_mistah_buzzard
          text: 当然，当然。俺保证不管！
        - id: ch01-b17
          speaker: narrator
          text: 说完，秃鹫老先生飞回了蓝蓝的天空。
