audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: folksy and quick-witted
        timbre: mellow and raspy
        pace: easy
        pitch: medium-low
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: plainspoken and self-assured
        timbre: smooth and sturdy
        pace: relaxed
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: confident and determined
        timbre: clear and youthful
        pace: steady
        pitch: medium
  chapters:
    - id: ch01
      title: XIX. Unc' Billy Possum Gives Warning
      blocks:
        - id: ch01-b01
          speaker: jimmy_skunk
          text: What's wrong, Unc' Billy? You look like you've lost your very last friend.
        - id: ch01-b02
          speaker: narrator
          text: Jimmy Skunk had called out to Unc' Billy Possum. Unc' Billy stopped in his tracks. He'd been hurrying so fast that he hadn't noticed Jimmy at all. He had to catch his breath before he could answer.
        - id: ch01-b03
          speaker: unc_billy_possum
          text: Matter enough, Suh! Matter enough! Do you hear that noise?
        - id: ch01-b04
          speaker: jimmy_skunk
          text: Of course I hear it. That's just Bowser the Hound chasing old Granny Fox. When she gets tired, she'll shake him off. Why are you so worried about Bowser?
        - id: ch01-b05
          speaker: unc_billy_possum
          text: Bowser will have to get a whole lot smarter before he worries me, Ah reckon. Bowser isn't the trouble. It's Farmer Brown's boy and his gun!
          emotion: disgusted
        - id: ch01-b06
          speaker: narrator
          text: Then Unc' Billy explained what he'd heard while hiding in Farmer Brown's woodpile. The boy had said he would search all over the Green Meadows and through the Green Forest until he caught Reddy Fox.
        - id: ch01-b07
          speaker: jimmy_skunk
          text: So what? If he catches Reddy, that's fine with me. Reddy has always caused trouble for everyone else. Why should you worry about him? He's big enough to look after himself.
        - id: ch01-b08
          speaker: unc_billy_possum
          text: Yo' cert'nly are plumb slow in your wits this morning, Jimmy Skunk. Yo' cert'nly are plumb slow! Suppose yo' run into Farmer Brown's boy while he has that gun in his hands. Suppose he's tired of watching for Reddy. That gun might go off, Jimmy. It might go off while it's pointing straight at yo'!
        - id: ch01-b09
          speaker: narrator
          text: Jimmy Skunk grew serious.
        - id: ch01-b10
          speaker: jimmy_skunk
          text: That's so, Unc' Billy. That's so! Boys with guns can be dreadfully careless. Dreadfully careless. They don't seem to think about the feelings of the animals who might get hurt when a gun goes off. What are you going to do?
        - id: ch01-b11
          speaker: unc_billy_possum
          text: Ah'm just passing the warning along. Everyone in the Green Meadows and the Green Forest needs to stay out of Farmer Brown's boy's way.
        - id: ch01-b12
          speaker: jimmy_skunk
          text: That's a good plan, Unc' Billy. I'll help you.
        - id: ch01-b13
          speaker: narrator
          text: Unc' Billy Possum set off in one direction, and Jimmy Skunk went in another. Every friend they warned hurried away to pass the warning to someone else.
        - id: ch01-b14
          speaker: narrator
          text: Happy Jack Squirrel told Chatterer the Red Squirrel. Chatterer told Striped Chipmunk, and Striped Chipmunk told Danny Meadow Mouse. Danny told Johnny Chuck. Johnny told Peter Rabbit. Peter told Jumper the Hare. Jumper told Prickly Porky. Prickly Porky told Bobby Coon. Bobby told Billy Mink. Billy told Little Joe Otter. And Little Joe told Jerry Muskrat, who passed the warning to Grandfather Frog.
        - id: ch01-b15
          speaker: narrator
          text: Soon everybody in the Green Meadows and the Green Forest was hurrying into hiding, away from Farmer Brown's boy and his terrible gun.
        - id: ch01-b16
          speaker: narrator
          text: After a while, Farmer Brown's boy began to notice how quiet the Green Forest had become. He couldn't see or hear a single bird. He couldn't catch even one glimpse of an animal with fur.
        - id: ch01-b17
          speaker: farmer_browns_boy
          text: That fox must have frightened all the animals and chased all the birds away. I'll get him. Just wait and see!
        - id: ch01-b18
          speaker: narrator
          text: Farmer Brown's boy muttered those words without ever guessing that everyone was hiding from him.
