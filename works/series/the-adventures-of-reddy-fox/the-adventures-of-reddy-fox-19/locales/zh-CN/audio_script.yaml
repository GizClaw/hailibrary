audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 悠闲诙谐，打趣时故作严厉
        timbre: 粗暖而略带鼻音
        pace: 从容适中
        pitch: 中低音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 直率鲜明，恼火时带一点尖刻
        timbre: 清晰沉稳
        pace: 适中
        pitch: 中音
    farmer_browns_boy:
      display_name: 布朗家的男孩
      tts:
        delivery: 年轻直率，下定决心时坚定有力
        timbre: 清亮结实
        pace: 轻快利落
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十九章　负鼠比利大叔发出警告
      blocks:
        - id: ch01-b01
          speaker: jimmy_skunk
          text: 负鼠比利大叔，你这是怎么啦？看你那副模样，就像世上最后一个朋友也不见了似的。
        - id: ch01-b02
          speaker: narrator
          text: 臭鼬吉米这一问，负鼠比利大叔才猛地收住脚步。他刚才只顾飞快赶路，根本没瞧见吉米，还得先喘匀了气才能开口。
        - id: ch01-b03
          speaker: unc_billy_possum
          text: 出大事了，先生！真的出大事了！你听见那阵响动没有？
        - id: ch01-b04
          speaker: jimmy_skunk
          text: 我当然听见了。那只是猎犬鲍泽在追老狐狸奶奶。奶奶跑累以后，自有办法甩掉他。鲍泽有什么值得你担心的？
        - id: ch01-b05
          speaker: unc_billy_possum
          text: 鲍泽要想吓着我，还得聪明上许多才行。麻烦不是他，是布朗家的男孩，还有男孩手里的枪！
          emotion: disgusted
        - id: ch01-b06
          speaker: narrator
          text: 比利大叔说，他刚刚躲在布朗农夫家的柴堆里，听见那个男孩亲口讲，要搜遍绿草原和绿森林，直到抓住小狐狸雷迪为止。
        - id: ch01-b07
          speaker: jimmy_skunk
          text: 那有什么不好？抓到雷迪才好呢。他总给别人找麻烦，你何必替他操心？他已经那么大，照顾得了自己。
        - id: ch01-b08
          speaker: unc_billy_possum
          text: 臭鼬吉米，你今天早上这脑筋转得也太慢啦！要是你遇见布朗家的男孩，他正拿着枪，又等雷迪等烦了，那支枪说不定就会响。吉米，要是枪口刚好直对着你呢？
        - id: ch01-b09
          speaker: narrator
          text: 这下，臭鼬吉米的脸色严肃起来。
        - id: ch01-b10
          speaker: jimmy_skunk
          text: 你说得对，比利大叔，确实是这样。男孩子一拿上枪，有时候粗心得真吓人。他们不去想枪一响，可能受伤的小动物会多难受。那你准备怎么做？
        - id: ch01-b11
          speaker: unc_billy_possum
          text: 我打算把警告一路传开，叫绿草原和绿森林里的大伙儿全都避开布朗家的男孩。
        - id: ch01-b12
          speaker: jimmy_skunk
          text: 这主意好，比利大叔！我跟你一起传消息。
        - id: ch01-b13
          speaker: narrator
          text: 于是，比利大叔往这边走，臭鼬吉米往那边走。他们每告诉一个朋友，那个朋友就赶忙去告诉下一个。
        - id: ch01-b14
          speaker: narrator
          text: 消息从松鼠快乐杰克传给红松鼠喋喋不休，又传给花栗鼠条纹和草原鼠丹尼。丹尼告诉土拨鼠约翰尼，约翰尼告诉兔子彼得，彼得再告诉野兔跳跳。随后，豪猪刺刺、浣熊博比、水貂比利、小水獭乔、麝鼠杰里和青蛙爷爷，也一个接一个听到了警告。
        - id: ch01-b15
          speaker: narrator
          text: 很快，大伙儿全都藏了起来，躲着布朗家的男孩，也躲着他那支可怕的枪。
        - id: ch01-b16
          speaker: narrator
          text: 过了一阵，男孩终于觉得绿森林里静得不对劲。他一路上看不见鸟，听不到鸟叫，也见不着任何长着毛的小动物。
        - id: ch01-b17
          speaker: farmer_browns_boy
          text: 准是那只狐狸把动物全吓跑了，又把鸟儿全赶走了。我一定会逮住他，你们等着瞧！
        - id: ch01-b18
          speaker: narrator
          text: 布朗家的男孩低声念叨着，始终没有想到，大伙儿真正躲着的人其实是他。
