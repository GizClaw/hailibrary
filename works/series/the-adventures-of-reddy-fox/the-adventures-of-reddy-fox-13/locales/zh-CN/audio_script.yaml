audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练精明，恼怒时尖刻凶狠
        timbre: 苍老而有力
        pace: 从容，动怒时加快
        pitch: 中低音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 直率鲜明，恼火时带一点尖刻
        timbre: 清晰沉稳
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十三章　老狐狸奶奶骂臭鼬吉米
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老狐狸奶奶怎么也不敢相信自己的眼睛。不，先生，她真的不敢相信。她把眼睛揉了两三遍，想确定自己没有看错。可那只小鸡确实不见了，一点儿去向的痕迹也没留下。
        - id: ch01-b02
          speaker: narrator
          text: 这事实在古怪。老狐狸奶奶干脆坐下来，认真想了又想，究竟谁有这么大的胆子，敢偷她的东西？接着，她把鼻子贴近地面，绕着一个大圈走，一路闻个不停。她在做什么？当然是在找偷鸡贼留下的脚印。
        - id: ch01-b03
          speaker: granny_fox
          text: 哈！这一次我可一定要逮住他了！
        - id: ch01-b04
          speaker: narrator
          text: 老狐狸奶奶叫了一声，鼻子仍旧贴着地面，沿着山顶跑起来。没过几分钟，她越跑越慢，每走两三步就要抬头朝前望望。忽然，她双眼一亮，把肚皮贴得低低的，悄悄往前爬，就像刚才爬向彼得兔时那样。
        - id: ch01-b05
          speaker: narrator
          text: 可这一回，前面的不是彼得兔。你猜是谁？是臭鼬吉米！是的，先生，正是他。吉米慢悠悠地往前溜达，因为他从来不着急。一路上每碰见一根能挪动的大树枝，或是一块能挪动的石头，他都要把它翻过来，再探头往底下瞧瞧。他正在找甲虫吃呢。
        - id: ch01-b06
          speaker: granny_fox
          text: 吃过我的小鸡还要找甲虫，他的胃口可真大！
        - id: ch01-b07
          speaker: narrator
          text: 老狐狸奶奶盯着吉米，小声嘟囔完，猛地跳到他面前。她双眼冒着凶光，牙齿全露在外面，背上的毛也根根竖起，非要让自己显得凶狠极了不可。不过从头到尾，她都格外小心，绝不让自己离吉米太近。
        - id: ch01-b08
          speaker: granny_fox
          text: 我的那只小鸡到哪里去了？
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: 老狐狸奶奶龇着牙咆哮，看上去凶得不能再凶，可她依旧不敢向前靠近一步。臭鼬吉米抬起头，好像非常惊讶。
        - id: ch01-b10
          speaker: jimmy_skunk
          text: 你好啊，老狐狸奶奶！你丢了一只小鸡吗？
          emotion: surprised
        - id: ch01-b11
          speaker: granny_fox
          text: 就是你偷的！臭鼬吉米，你这个贼！
          emotion: angry
        - id: ch01-b12
          speaker: jimmy_skunk
          text: 黑的再说也成不了白，开口之前，先把是非弄明白。我可不是贼。
        - id: ch01-b13
          speaker: granny_fox
          text: 你就是！
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: 老狐狸奶奶越说火气越大。
        - id: ch01-b15
          speaker: jimmy_skunk
          text: 我不是！
        - id: ch01-b16
          speaker: granny_fox
          text: 你就是！
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: 这场争吵从头到尾，臭鼬吉米都在暗自咯咯发笑。他笑得越厉害，老狐狸奶奶就越生气。他还一直朝老狐狸奶奶走去，逼得她不停地向后退。因为她跟草原和森林里别的小动物一样，对吉米那只小小的臭气囊敬畏得很。
        - id: ch01-b18
          speaker: narrator
          text: 老狐狸奶奶只顾倒退，根本看不见身后的路。等她发觉不对，已经一头退进荆棘丛。荆棘扯破了她的裙子，也划伤了她的腿。
        - id: ch01-b19
          speaker: granny_fox
          text: 哎哟！
        - id: ch01-b20
          speaker: jimmy_skunk
          text: 哈！哈！哈！谁叫你骂我，这就是你的下场。
          emotion: happy
