audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    granny_fox:
      display_name: Granny Fox
      tts:
        delivery: shrewd and self-assured
        timbre: mature and crisp
        pace: steady
        pitch: medium-low
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: dry and easygoing
        timbre: mellow and rounded
        pace: relaxed
        pitch: medium-low
  chapters:
    - id: ch01
      title: XIII. Granny Fox Calls Jimmy Skunk Names
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Granny Fox could hardly believe her eyes. No, Sir, she simply could not believe them. She rubbed them two or three times to make sure she could see properly. The chicken was certainly gone. Nothing showed where it had gone.
        - id: ch01-b02
          speaker: narrator
          text: It was very strange. Granny sat down and wondered who would dare steal from her. Then she put her nose to the ground and walked in a wide circle, sniffing as she went. What was she doing that for? She was hunting for the tracks of whoever might have taken her chicken.
        - id: ch01-b03
          speaker: granny_fox
          text: Aha! This time I'll catch him!
        - id: ch01-b04
          speaker: narrator
          text: Granny started running along the hilltop with her nose still down. After a few minutes, she slowed her pace. Every two or three steps, she looked ahead.
        - id: ch01-b05
          speaker: narrator
          text: All at once, her eyes flashed. She crept forward almost flat on her stomach, just as she had when she stalked Peter Rabbit. But this time it was not Peter. Who was it? Jimmy Skunk!
        - id: ch01-b06
          speaker: narrator
          text: Yes, Sir, Jimmy was ambling slowly along, because Jimmy Skunk never hurries. Whenever he found a large stick or stone he could move, he pulled it aside or peered underneath. He was looking for beetles.
        - id: ch01-b07
          speaker: narrator
          text: Old Granny watched Jimmy closely as he searched, then muttered to herself.
        - id: ch01-b08
          speaker: granny_fox
          text: He must be terribly hungry if he's hunting beetles after eating my chicken!
        - id: ch01-b09
          speaker: narrator
          text: Then Granny leaped right in front of Jimmy. Her eyes flashed, her teeth showed, and the hair along her back stood up to make her look very fierce. Even so, she was careful not to get too close to him.
        - id: ch01-b10
          speaker: granny_fox
          text: Where is my chicken?
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: Granny snarled the question and looked fiercer than ever. Jimmy glanced up as though he were greatly surprised.
        - id: ch01-b12
          speaker: jimmy_skunk
          text: Hello, Granny Fox! Did you lose a chicken?
          emotion: surprised
        - id: ch01-b13
          speaker: granny_fox
          text: You stole it! Jimmy Skunk, you're a thief!
          emotion: angry
        - id: ch01-b14
          speaker: jimmy_skunk
          text: Words can never make black white. Be sure you're right before you speak. I'm no thief.
        - id: ch01-b15
          speaker: narrator
          text: Granny worked herself into a terrible rage.
        - id: ch01-b16
          speaker: granny_fox
          text: Yes, you are!
          emotion: angry
        - id: ch01-b17
          speaker: jimmy_skunk
          text: No, I'm not!
        - id: ch01-b18
          speaker: granny_fox
          text: You are!
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: Jimmy chuckled quietly to himself, and every chuckle made Granny angrier. All the while, he kept walking toward her, and she kept stepping backward. Like all the little people of the meadow and forest, Granny had great respect for Jimmy's little bag of scent.
        - id: ch01-b20
          speaker: narrator
          text: With her back turned, Granny could not see where she was going. Before she knew it, she backed straight into a bramble bush. The thorns tore her skirts and scratched her legs.
        - id: ch01-b21
          speaker: granny_fox
          text: Ooch! I've scratched my legs!
        - id: ch01-b22
          speaker: narrator
          text: Jimmy burst out laughing.
        - id: ch01-b23
          speaker: jimmy_skunk
          text: Ha, ha, ha! That's what happens when you call me names.
          emotion: happy
