cover_prompt: |-
  A wordless cover scene in the early-twentieth-century American countryside shows a young red fox learning caution beside an older red fox on the edge of the Green Meadows and Green Forest. The young fox has a beautiful red coat, a little black nose, sharp pointed ears, and an eager expression, while the older fox has a sharp face, yellow eyes, and a watchfully alert expression. They pause in dew-wet meadow grass as the younger fox looks toward a farmhouse chicken yard in the distance and the older fox turns him back toward the sheltering woods. Their opposed gestures make the moment of guidance and temptation the clear focal action. Use a wide child-height view with the two foxes prominent in the lower middle, a winding path, split-rail fence, pond reeds, and sunlit woodland, leaving calm open morning sky across the top. Keep the foxes anatomically believable, the rural setting appropriate to the 1910s, and the mood adventurous, warm, and non-frightening. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
