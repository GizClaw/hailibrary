audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼机灵，认真劝告时一本正经
        timbre: 清亮年轻
        pace: 明快
        pitch: 中高音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 热心直爽，兴奋时语速加快
        timbre: 圆润年轻
        pace: 轻快
        pitch: 中音
    reddy_fox:
      display_name: 小狐狸雷迪
      tts:
        delivery: 狡黠好强，受伤时压着疼痛和恼火
        timbre: 略带沙哑的年轻嗓音
        pace: 平稳，疼痛时稍慢
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十章　可怜的小狐狸雷迪
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔和土拨鼠约翰尼悄悄爬上山，往小狐狸雷迪家靠近。他们一会儿藏进草丛，一会儿又躲到灌木后面。每换一个地方，都要先停下来看看，再仔细听听。两个人一点险也不敢冒。
        - id: ch01-b02
          speaker: narrator
          text: 约翰尼从前揍赢过雷迪，所以并不怎么怕他。真正让约翰尼害怕的是老狐狸奶奶。彼得可不一样，他两个都怕。雷迪过去为了抓他，已经使过太多花招了。越接近狐狸的家，彼得越紧张。他不停地朝四面张望，只要看见一点危险，立刻就会逃走。谁知道这一次会不会也是雷迪设下的圈套呢？
        - id: ch01-b03
          speaker: narrator
          text: 他们踮着脚又爬了一阵，终于能望见狐狸家的门阶了。彼得和约翰尼趴进灌木丛，藏在那里观察。过了一会儿，老狐狸奶奶走出门，迎着风嗅了嗅，随即沿孤独小径飞快地跑远了。
        - id: ch01-b04
          speaker: narrator
          text: 约翰尼长长地松了口气。奶奶一走，他就觉得安全了。彼得却还是紧盯着四周，不敢大意。
        - id: ch01-b05
          speaker: peter_rabbit
          text: 我非得亲眼见到雷迪才行。没见到他以前，我一步也不往前走。
        - id: ch01-b06
          speaker: narrator
          text: 彼得刚说完，约翰尼就把一根手指贴到嘴边，又伸手朝门口指去。雷迪正从屋里慢慢爬出来，爬进阳光底下。彼得把身子探得更向前，想看个明白。雷迪到底伤得很重，还是又在骗人？
        - id: ch01-b07
          speaker: narrator
          text: 雷迪费力地爬上门阶。他想站起来，也想迈开腿，可身上又僵又疼，根本走不了，只好趴着往前挪。他完全不知道附近有人在看。每动一下，他的脸都疼得皱起来。
        - id: ch01-b08
          speaker: narrator
          text: 藏在灌木里的彼得终于相信，雷迪没有装病。这一回，他连一点点都不用害怕了。彼得高兴得叫了一声，一下跳出去，让雷迪看见了自己。
        - id: ch01-b09
          speaker: narrator
          text: 雷迪抬头看见彼得，本想咧嘴笑笑，结果才动了一下，脸就疼得变了样。
        - id: ch01-b10
          speaker: reddy_fox
          text: 看到我现在这样，你心里一定快活极了吧。
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: 彼得的确有理由快活。雷迪一心想抓住他，再把他交给老狐狸奶奶当晚餐。这样的事不止发生过一次。彼得每回都差一点被抓住，好不容易才逃掉。因此，他刚看见雷迪动不了时，忍不住欢呼起来。
        - id: ch01-b12
          speaker: narrator
          text: 可他再仔细一看，发现雷迪真的一点办法也没有，而且疼得厉害。彼得那双又大又柔和的眼睛忽然湿了，里面满是同情的泪水。
        - id: ch01-b13
          speaker: narrator
          text: 雷迪过去说过哪些吓唬他的话，又设过什么圈套骗他，彼得全都不记得了。就连雷迪从前有多坏，他也忘得干干净净。
        - id: ch01-b14
          speaker: peter_rabbit
          text: 可怜的小狐狸雷迪。可怜的小狐狸雷迪。
          emotion: sad
