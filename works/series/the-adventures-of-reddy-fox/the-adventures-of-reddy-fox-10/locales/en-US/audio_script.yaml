  chapters:
    - id: ch01
      title: X. Poor Reddy Fox
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit and Johnny Chuck crept up the hill toward Reddy Fox's home. As they came closer, they slipped from one clump of grass to another, then from bush to bush. Behind each one, they stopped to look and listen. Neither of them meant to take a chance.
        - id: ch01-b02
          speaker: narrator
          text: Johnny was not very afraid of Reddy, because he had beaten him once. Old Granny Fox was another matter. Peter was afraid of both foxes. The nearer he came to their home, the more nervous he felt.
        - id: ch01-b03
          speaker: narrator
          text: Reddy had tried so many tricks to catch Peter that this might be one more. Peter couldn't be sure. He watched sharply in every direction and stayed ready to run at the first sign of danger.
        - id: ch01-b04
          speaker: narrator
          text: At last, after all that tiptoeing and crawling, they reached a place where they could see the doorstep. They lay down in a clump of bushes and watched. Before long, old Granny Fox came out. She sniffed the wind, then hurried away down the Lone Little Path.
        - id: ch01-b05
          speaker: narrator
          text: Johnny Chuck sighed with relief. Granny was gone, and since he wasn't afraid of Reddy, he felt safe now. Peter stayed every bit as watchful as before.
        - id: ch01-b06
          speaker: peter_rabbit
          text: I have to see Reddy with my own eyes before I go one step closer.
        - id: ch01-b07
          speaker: narrator
          text: Peter spoke in a whisper. Just then, Johnny put one hand to his lips and pointed with the other. Reddy Fox was crawling out of his doorway and into the sunshine. Peter leaned forward for a better look. Was Reddy truly hurt that badly, or was he pretending?
        - id: ch01-b08
          speaker: narrator
          text: Reddy dragged himself painfully onto the doorstep. He tried to get up and walk, but he was much too stiff and sore. Crawling was all he could do. He had no idea anyone was watching, and every movement made him twist his face in pain.
        - id: ch01-b09
          speaker: narrator
          text: From the bushes, Peter watched and understood. Reddy wasn't pretending at all. Peter had nothing to fear from him, not even the least little thing. With a joyful whoop, Peter sprang out where Reddy could see him.
        - id: ch01-b10
          speaker: narrator
          text: Reddy looked up. He tried to grin, but his face tightened with pain instead. Even that little movement hurt.
        - id: ch01-b11
          speaker: reddy_fox
          text: I suppose seeing me this way makes you happier than you can say.
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: Reddy growled those words at Peter, and Peter certainly had good reason to be glad. Reddy had done his very best to catch him and bring him home for Granny Fox's dinner. Again and again, Peter had escaped by the narrowest chance. That was why he had shouted with joy at first.
        - id: ch01-b13
          speaker: narrator
          text: Then Peter saw just how helpless Reddy was and how badly he hurt. All at once, tears of pity filled Peter's big, soft eyes.
        - id: ch01-b14
          speaker: narrator
          text: Peter forgot every threat Reddy had made. He forgot all the tricks Reddy had tried and all the mean things he had done.
        - id: ch01-b15
          speaker: peter_rabbit
          text: Poor Reddy Fox. Poor Reddy Fox.
