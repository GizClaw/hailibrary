  chapters:
    - id: ch01
      title: V. Reddy Grows Careless
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Ol' Mistah Buzzard had been right. Trouble was close behind Reddy Fox, though Reddy never would have believed it if anyone had warned him. He had stolen Farmer Brown's boy's plump pet chicken for no reason under the sun except to show off.
        - id: ch01-b02
          speaker: narrator
          text: Reddy wanted everyone to hear how bold he was. He liked showing off. He thought he was so clever that he could do anything he pleased, and no one could stop him. So he strutted through the Green Forest and across the Green Meadows, bragging about what he had done and all the things he could do.
        - id: ch01-b03
          speaker: narrator
          text: People who boast and show off are almost sure to land in trouble. When that happens, very few people feel sorry for them. None of the little people of the meadow and forest liked Reddy anyway. Now they were so weary of his boasting that they ached to see him get into trouble. Yes, Sir, they truly ached to see it.
        - id: ch01-b04
          speaker: narrator
          text: Happy-go-lucky Peter Rabbit heard how Reddy had stolen the pet chicken and was telling everyone about it. This time, Peter shook his head gravely.
        - id: ch01-b05
          speaker: peter_rabbit
          text: Reddy Fox is getting so puffed up that soon he won't even see his own feet.
        - id: ch01-b06
          speaker: jimmy_skunk
          text: Well, what if he can't see his feet? Why should that matter?
        - id: ch01-b07
          speaker: narrator
          text: Peter looked at Jimmy with disgust.
        - id: ch01-b08
          speaker: peter_rabbit
          text: However fast his flying feet, he'll come to grief if he doesn't watch them. Jimmy, you'd be much more careful where you stepped if everyone weren't afraid of that little scent bag of yours. If Reddy isn't careful, one day he'll walk straight into a trap.
        - id: ch01-b09
          speaker: narrator
          text: Jimmy Skunk chuckled.
        - id: ch01-b10
          speaker: jimmy_skunk
          text: I hope he does!
        - id: ch01-b11
          speaker: narrator
          text: When Farmer Brown's boy heard how bold Reddy had become, he pressed his lips together until he looked very unpleasant. Then he reached for his gun.
        - id: ch01-b12
          speaker: farmer_browns_boy
          text: I can't raise chickens just to feed the foxes!
        - id: ch01-b13
          speaker: narrator
          text: He whistled for Bowser the Hound, and the two of them set out. Before long, Bowser picked up Reddy's tracks.
        - id: ch01-b14
          speaker: bowser_the_hound
          text: Bow, wow, wow, wow!
        - id: ch01-b15
          speaker: narrator
          text: Reddy was napping at the edge of the Green Forest when Bowser's great, deep voice reached him. His ears sprang up. Then he grinned.
        - id: ch01-b16
          speaker: reddy_fox
          text: This feels like a fine day for a good run.
        - id: ch01-b17
          speaker: narrator
          text: Reddy trotted down the hill along the Crooked Little Path. It was a beautiful summer day, and he knew that men and boys hardly ever hunted foxes in summer.
        - id: ch01-b18
          speaker: reddy_fox
          text: It's only Bowser. I'll enjoy my run, then play a trick on him and make him lose my trail.
        - id: ch01-b19
          speaker: narrator
          text: So Reddy did not use his eyes the way he should have. He thought he was far too smart for Bowser, and that had made him careless. Yes, Sir, Reddy Fox had grown careless. He kept looking back to see where Bowser was, but he never looked around to make sure no other danger was near.
        - id: ch01-b20
          speaker: narrator
          text: High in the blue, blue sky, Ol' Mistah Buzzard sailed round and round. From up there, he could see everything happening below. He watched Reddy run along the edge of the Green Forest. Every few minutes, Reddy stopped to chuckle and listen while Bowser tried to pick out his trail. Reddy's many twists and turns had made it very hard to follow.
        - id: ch01-b21
          speaker: narrator
          text: But Ol' Mistah Buzzard saw something else. Just ahead of Reddy, something stuck out from behind an old tree. It looked very much like the barrel of a gun.
        - id: ch01-b22
          speaker: ol_mistah_buzzard
          text: Ah reckon it's just like Ah said. Reddy Fox is gwine to meet trouble right smart soon.
