audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 小狐狸雷迪
      tts:
        delivery: 年轻直率，遇到危险时慌张急促
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 中高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 直率鲜明，恼火时带一点尖刻
        timbre: 清晰沉稳
        pace: 适中
        pitch: 中音
    old_mr_buzzard:
      display_name: 老秃鹫先生
      tts:
        delivery: 悠然老练，说唱时带着乡野韵律
        timbre: 苍老沙哑
        pace: 舒缓
        pitch: 中低音
    bowser_hound:
      display_name: 猎犬鲍泽
      tts:
        delivery: 粗犷有力，发怒时威严响亮
        timbre: 浑厚低沉
        pace: 稳健
        pitch: 低音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼机灵，认真劝告时一本正经
        timbre: 清亮年轻
        pace: 明快
        pitch: 中高音
    farmer_browns_boy:
      display_name: 布朗农夫的儿子
      tts:
        delivery: 朴实干脆，生气时坚决有力
        timbre: 年轻清朗
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第五章　雷迪变得粗心大意
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老秃鹫先生说得一点没错。麻烦已经追到了雷迪脚后跟，可谁要把这话告诉雷迪，他准不会信。雷迪偷走布朗农夫儿子那只肥嘟嘟的宠物鸡，没有别的原因，就是为了显摆。他想叫大家都知道自己胆子大。他觉得自己聪明得很，想干什么就干什么，没人拦得住。于是，他昂首阔步地穿过绿森林，走过绿草地，逢人就吹嘘自己做过什么，又有多大本事。
        - id: ch01-b02
          speaker: narrator
          text: 爱吹牛、爱夸口、爱显摆的人，多半会惹来麻烦。等他们倒了霉，别人也很少替他们难过。草地和森林里的小居民本来就不喜欢雷迪，如今更是听够了他的吹嘘，一个个巴不得看他惹祸。没错，他们真盼着雷迪惹上麻烦。
        - id: ch01-b03
          speaker: narrator
          text: 无忧无虑的彼得兔听说了那只宠物鸡的事，还听说雷迪到处拿这件事夸口，便难得认真地摇了摇头。
        - id: ch01-b04
          speaker: peter_rabbit
          text: 雷迪越来越膨胀啦。再这样下去，他很快就连自己的脚也看不见了。
        - id: ch01-b05
          speaker: jimmy_skunk
          text: 看不见自己的脚又怎么啦？
        - id: ch01-b06
          speaker: narrator
          text: 彼得嫌弃地看了吉米一眼，念出一句警告。
        - id: ch01-b07
          speaker: peter_rabbit
          text: 任你跑得快如飞，不看脚下也倒霉。吉米，要不是你有那只谁都害怕的臭气囊，你走每一步都会比现在小心得多。雷迪要是再不留神，早晚会一脚踩进陷阱。
        - id: ch01-b08
          speaker: narrator
          text: 吉米听完咯咯直笑。
        - id: ch01-b09
          speaker: jimmy_skunk
          text: 那才好呢！我就盼着他踩进去！
        - id: ch01-b10
          speaker: narrator
          text: 布朗农夫的儿子听说雷迪竟敢偷走他的宠物鸡，嘴唇一下抿得紧紧的，脸色也很不好看。他伸手拿起了枪。
        - id: ch01-b11
          speaker: farmer_browns_boy
          text: 我养鸡可不是为了喂狐狸！
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: 说完，他吹口哨叫来猎犬鲍泽，带着鲍泽一同出发。没过多久，鲍泽就嗅到了雷迪的足迹。
        - id: ch01-b13
          speaker: bowser_hound
          text: 汪！汪！汪！汪！
        - id: ch01-b14
          speaker: narrator
          text: 鲍泽低沉洪亮的叫声传到了绿森林边上。雷迪正在那里打盹儿。他竖起耳朵听了听，反倒咧嘴笑了。
        - id: ch01-b15
          speaker: reddy_fox
          text: 今天我正想痛痛快快地跑一场呢。
        - id: ch01-b16
          speaker: narrator
          text: 雷迪沿着弯弯曲曲的小路，小跑着下了山坡。这是个晴朗的夏日。他知道到了夏天，大人和孩子很少带着猎犬追狐狸。
        - id: ch01-b17
          speaker: reddy_fox
          text: 不过是鲍泽罢了。等我跑够了，再耍个花招，让他跟丢我的足迹。
        - id: ch01-b18
          speaker: narrator
          text: 雷迪自以为太聪明，便没有好好看看四周。他已经变得粗心大意了。一路上，他只顾回头找鲍泽的影子，根本没留意附近还会不会有别的危险。
        - id: ch01-b19
          speaker: narrator
          text: 老秃鹫先生正在湛蓝的高空中一圈圈盘旋，地面上的动静全逃不过他的眼睛。他清清楚楚地看见雷迪沿绿森林边缘奔跑，还每隔几分钟就停下来咯咯笑一阵，再听鲍泽费劲地辨认那些足迹。雷迪一路东拐西绕，故意把踪迹弄得难追极了。
        - id: ch01-b20
          speaker: narrator
          text: 可老秃鹫先生还看见了另一件东西。就在雷迪前方，一棵老树后面露出一截东西，看上去很像枪管。
        - id: ch01-b21
          speaker: old_mr_buzzard
          text: 我看哪，正跟我说的一样。小狐狸雷迪马上就要撞见麻烦喽。
