audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练精明，恼怒时尖刻凶狠
        timbre: 苍老而有力
        pace: 从容，动怒时加快
        pitch: 中低音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 随和机灵，开玩笑时一本正经
        timbre: 圆润清朗
        pace: 轻松适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十四章　老狐狸奶奶终于知道小鸡去了哪里
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老狐狸奶奶从荆棘丛里出来时，正在大发脾气。哎呀呀，那火气可真吓人！臭鼬吉米却笑起她来，害得她越发恼火。看她气成那样，吉米乐得满地打滚，笑得直嚷嚷。
        - id: ch01-b02
          speaker: narrator
          text: 吉米这样做当然一点儿也不厚道。不过，你要知道，老狐狸奶奶刚才一直骂他是贼，他自然也有理由笑。再说，吉米本来就不喜欢她。草原和森林里的其他小动物也一样，谁都不喜欢她，因为他们大多怕她怕得很。
        - id: ch01-b03
          speaker: narrator
          text: 老狐狸奶奶好不容易挣脱荆棘，一句话也没再跟吉米说，就急匆匆地走了。她边走边嘟囔，嘴里抱怨个不停，牙齿还咬得咯咯响。这时候谁要是遇见她，准没好果子吃。浣熊博比远远看见她走来，觉得躲开比较好，便爬上了一棵树。
        - id: ch01-b04
          speaker: narrator
          text: 博比可不是怕老狐狸奶奶。天哪，他一点儿也不怕她！他只是刚吃饱，心情好得很，又懒洋洋的，不愿意跟谁吵上一架。
        - id: ch01-b05
          speaker: bobby_coon
          text: 早上好，老狐狸奶奶。您今天早上身体还好吧？
        - id: ch01-b06
          speaker: narrator
          text: 老狐狸奶奶小跑到树下时，博比坐在树上向她问候。她抬起头，一双黄眼睛凶巴巴地瞪着他。
        - id: ch01-b07
          speaker: granny_fox
          text: 这个早上一点儿也不好，我也好不了！
          emotion: angry
        - id: ch01-b08
          speaker: bobby_coon
          text: 我的天哪，您的裙子怎么全扯破啦！
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: 老狐狸奶奶本想回他一句难听话，转念却忍住了。她坐下来，把自己碰上的麻烦全讲给博比听。博比听着听着，一次又一次把脑袋藏到树枝后面，免得她看见自己在笑。最后，她还是发现了。
        - id: ch01-b10
          speaker: granny_fox
          text: 浣熊博比，你怎么老往树枝后面躲？
        - id: ch01-b11
          speaker: narrator
          text: 老狐狸奶奶起了疑心。
        - id: ch01-b12
          speaker: bobby_coon
          text: 我在找那只小鸡的羽毛，想看看这里能不能瞧见几根。
        - id: ch01-b13
          speaker: narrator
          text: 博比回答得一本正经，眼睛里却闪着淘气的笑。
        - id: ch01-b14
          speaker: granny_fox
          text: 那么，你看见了吗？
        - id: ch01-b15
          speaker: narrator
          text: 老狐狸奶奶紧紧追问。偏偏就在这时，博比真的看见了羽毛。羽毛不在地上，正在半空中轻轻飘着。
        - id: ch01-b16
          speaker: narrator
          text: 博比从树上探出身子，要瞧瞧那些羽毛究竟从哪儿飘来。老狐狸奶奶也跟着转过头去看。你猜他们瞧见了什么？一棵高高的枯树上，苍鹰先生正把她那只小鸡的最后一口吞下肚去。
        - id: ch01-b17
          speaker: granny_fox
          text: 小偷！小偷！强盗！强盗！
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 老狐狸奶奶尖声大叫，苍鹰先生却一声不吭。他只朝浣熊博比眨眨眼，又把羽毛抖得蓬松起来，舒舒服服地安顿好，准备睡上一觉。
