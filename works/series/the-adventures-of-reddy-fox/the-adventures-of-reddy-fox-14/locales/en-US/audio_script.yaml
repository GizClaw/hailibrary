audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    granny_fox:
      display_name: Granny Fox
      tts:
        delivery: sharp and commanding
        timbre: dry and weathered
        pace: brisk
        pitch: medium-low
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: genial and quietly mischievous
        timbre: warm and smooth
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: XIV. Granny Fox Finds What Became of the Chicken
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Granny Fox was in a terrible temper. Dear, dear, what a dreadful temper it was! Jimmy Skunk laughed at her, which only made her angrier. When he saw how angry she was, he became so tickled that he rolled over and over on the ground, shouting with laughter.
        - id: ch01-b02
          speaker: narrator
          text: Of course, that wasn't very nice of Jimmy. Still, Granny Fox had been calling him a thief. Jimmy didn't like Granny Fox anyway, and neither did the other little people of the meadow and forest. Most of them were very much afraid of her.
        - id: ch01-b03
          speaker: narrator
          text: At last, Granny Fox worked her way out of the bramble bush. She had nothing more to say to Jimmy Skunk. She simply hurried off, muttering and grumbling as she ground her teeth. Anyone who met Granny just then was sure to find her very unpleasant.
        - id: ch01-b04
          speaker: narrator
          text: Bobby Coon saw her coming and decided he had better stay out of her way, so up a tree he went. Now, Bobby wasn't afraid of Granny Fox. Bless you, no! He wasn't afraid of her one bit. His stomach was full, and he felt far too lazy and good-natured for a quarrel.
        - id: ch01-b05
          speaker: bobby_coon
          text: Morning, Granny Fox! How are you feeling today?
        - id: ch01-b06
          speaker: narrator
          text: Bobby called down as Granny trotted beneath the tree where he sat. She looked up at him and glared with her yellow eyes.
        - id: ch01-b07
          speaker: granny_fox
          text: A good morning? Not for me! And I feel simply awful!
          emotion: angry
        - id: ch01-b08
          speaker: bobby_coon
          text: Oh my! Your skirts are all torn up!
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: Granny Fox was about to give him a nasty answer. Then she thought better of it. She sat down instead and told Bobby every one of her troubles. All the while, Bobby kept slipping his head behind a branch to hide his smile. At last, Granny noticed what he was doing.
        - id: ch01-b10
          speaker: granny_fox
          text: Bobby Coon, why do you keep ducking behind that branch?
        - id: ch01-b11
          speaker: bobby_coon
          text: I'm checking to see whether any feathers from your chicken are around.
        - id: ch01-b12
          speaker: narrator
          text: Bobby kept his voice perfectly solemn, but mischief still twinkled in his eyes.
        - id: ch01-b13
          speaker: granny_fox
          text: And? Have you found any?
        - id: ch01-b14
          speaker: narrator
          text: Just then, Bobby really did see some feathers. They weren't lying on the ground. They were floating through the air. Bobby leaned out to find where they had come from, and Granny turned to look as well.
        - id: ch01-b15
          speaker: narrator
          text: And what do you think they saw? There, on a tall dead tree, sat Mr. Goshawk. At that very moment, he was swallowing the last of Granny's chicken.
        - id: ch01-b16
          speaker: granny_fox
          text: Thief! Thief! Robber! Robber!
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: Granny Fox shrieked, but Mr. Goshawk said nothing at all. He only winked at Bobby Coon, puffed out his feathers, and settled down for a comfortable nap.
