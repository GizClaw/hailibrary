audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    granny_fox:
      display_name: Old Granny Fox
      tts:
        delivery: wise and determined with a dry edge
        timbre: mature and slightly husky
        pace: measured
        pitch: medium-low
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: youthful and expressive with a complaining edge
        timbre: bright and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: XXIV. Granny and Reddy Have To Move
      blocks:
        - id: ch01-b01
          speaker: reddy_fox
          text: I don't want to leave. I'm too sore to walk!
          emotion: sad
        - id: ch01-b02
          speaker: narrator
          text: Reddy Fox whined, but Old Granny Fox gave him a shove.
        - id: ch01-b03
          speaker: granny_fox
          text: Get along now, and do as you're told! If you had listened to me, we wouldn't be leaving. This is your own fault. You might have been killed when you stuck your head out in front of Farmer Brown's boy! He knows where we live now, and he'll never leave us alone. Hurry up! This was the best home I've ever had, and now I have to give it up. Oh dear! Oh dear!
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: Reddy hobbled down the long hall and through the front door. He could use only three legs, and every painful step made him pull a face.
        - id: ch01-b05
          speaker: narrator
          text: The little stars looked down as Reddy limped away from the home where he had lived so long. Granny followed close behind. She sighed, wiped away a tear, and said good-by to the old place.
        - id: ch01-b06
          speaker: narrator
          text: Reddy was too busy thinking about his own troubles to see how badly Granny felt. The pain made him stop and rest every few steps.
        - id: ch01-b07
          speaker: reddy_fox
          text: Why do we have to go tonight? Walking would be much easier and nicer when the sun is out. This cold night air is making me so stiff, I'll never get better!
        - id: ch01-b08
          speaker: narrator
          text: Granny listened to his grumbling for a while. Then she ran out of patience. Yes, sir, Granny Fox lost her patience. She boxed one of Reddy's ears, then the other. Reddy began to snivel.
        - id: ch01-b09
          speaker: granny_fox
          text: Stop that! Do you want every neighbor to hear that we have to move? They'll learn soon enough. Now come along without another fuss, or I'll leave you here to look after yourself. Then where will you find anything to eat?
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: Reddy wiped his eyes on his coat sleeve and hobbled on as well as he could. Granny kept running a little way ahead to make sure the path was safe. Then she would turn around and come back for Reddy before setting off again.
        - id: ch01-b11
          speaker: narrator
          text: Poor Reddy tried his best not to complain, but walking was terribly hard. And somehow, he still didn't believe they really needed to leave.
        - id: ch01-b12
          speaker: narrator
          text: That afternoon, Reddy had disobeyed Granny and poked his head out the door. He had looked straight into the freckled face of Farmer Brown's boy. The sight had frightened him terribly. But Reddy had ducked out of view before the boy could shoot, so he couldn't understand why Granny insisted on moving that very night.
        - id: ch01-b13
          speaker: reddy_fox
          text: She's getting old. That's why she's so timid and fussy now.
        - id: ch01-b14
          speaker: narrator
          text: Reddy muttered those words as he limped along behind her. It felt as if they had gone miles and miles. He truly believed they had been walking almost all night when Granny finally stopped before the worst-looking old fox house he had ever seen.
        - id: ch01-b15
          speaker: granny_fox
          text: Here we are!
        - id: ch01-b16
          speaker: reddy_fox
          text: What? We're going to live in that? No respectable fox would even stick his nose inside!
          emotion: surprised
        - id: ch01-b17
          speaker: granny_fox
          text: I was born here! If you want to stay out of danger, this is no time to put on airs. A fox who scorns life's simple things and turns up his nose at everything he sees is almost sure to feel the sharp cut of need through all his pleasant comfort.
          emotion: angry
        - id: ch01-b18
          speaker: granny_fox
          text: Now, not another word. Get inside at once!
        - id: ch01-b19
          speaker: narrator
          text: Reddy didn't quite understand everything Granny had said. But he knew when he had to obey her, so he carefully crawled through the broken-down doorway.
