audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练精明，恼怒时尖刻凶狠
        timbre: 苍老而有力
        pace: 从容，动怒时加快
        pitch: 中低音
    reddy_fox:
      display_name: 小狐狸雷迪
      tts:
        delivery: 聪明自信，带着少年气的急躁
        timbre: 明亮机敏
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十四章　老狐狸奶奶和雷迪不得不搬家
      blocks:
        - id: ch01-b01
          speaker: reddy_fox
          text: 我不想搬家。我浑身疼得这么厉害，哪儿还走得动啊！
          emotion: sad
        - id: ch01-b02
          speaker: narrator
          text: 雷迪哼哼唧唧地不肯动，老狐狸奶奶伸手推了他一把。
        - id: ch01-b03
          speaker: granny_fox
          text: 快走，照我说的做！你当初要是听话，我们哪用得着搬家？这全是你自己闯的祸。你竟然当着布朗家男孩的面把头探出去，没被打死已经是万幸了！现在他知道我们住在哪儿，以后别想过安生日子。快点走！这么好的家，我从来没住过，现在却非走不可。唉！唉！真叫人难过！
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 雷迪一拐一拐地走过长长的过道，从前门出了家。他只能靠三条腿走路。你想想，每迈一步都疼得厉害，难怪他的脸一次又一次皱了起来。
        - id: ch01-b05
          speaker: narrator
          text: 天上的小星星向下望着。它们看见雷迪瘸着腿，离开了住过许久的房子，奶奶紧紧跟在后面。奶奶向老家告别，叹了一口气，又擦掉一滴眼泪。
        - id: ch01-b06
          speaker: narrator
          text: 可雷迪只想着自己有多难受，一点也没发现奶奶心里有多难过。他疼得每走几步，就得坐下来歇一会儿。
        - id: ch01-b07
          speaker: reddy_fox
          text: 我真不明白，为什么偏要今晚搬。等太阳出来再走，不是轻松得多，也舒服得多吗？夜里的冷风把我吹得浑身僵硬，这下我的伤肯定永远好不了啦！
        - id: ch01-b08
          speaker: narrator
          text: 老狐狸奶奶听他一路抱怨，终于受够了。没错，你没有听错，奶奶真的失去了耐心。她先照着雷迪这只耳朵打了一巴掌，又照着那只耳朵打了一巴掌。雷迪立刻抽抽搭搭地哭起来。
        - id: ch01-b09
          speaker: granny_fox
          text: 不许哭！你是想让邻居们全听见，知道我们要搬家吗？这件事，他们早晚会发现。现在别再闹了，好好跟我走。你再不走，我就把你一个人留在这里，让你自己照顾自己。到时候，我看你去哪儿找吃的！
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 雷迪用衣袖擦掉眼泪，忍着疼继续往前挪。奶奶每次都先跑到前面，看看路上安不安全，再回来接他。
        - id: ch01-b11
          speaker: narrator
          text: 可怜的雷迪已经尽力不出声抱怨了，可这一路走得实在太艰难。更要紧的是，他怎么也不相信，他们真的非搬家不可。
        - id: ch01-b12
          speaker: narrator
          text: 就在那天下午，雷迪没有听奶奶的话。他把头伸出门，正好看见布朗家男孩那张满是雀斑的脸，当场吓坏了。可男孩还没来得及开枪，雷迪已经飞快地把头缩了回去。既然自己躲过了那一枪，他就想不通，奶奶为什么一定要连夜离开。
        - id: ch01-b13
          speaker: reddy_fox
          text: 她真是老了。年纪越大，胆子越小，还越来越爱瞎操心。
        - id: ch01-b14
          speaker: narrator
          text: 雷迪跟在后面，边走边小声嘟囔。他觉得自己已经走了好几英里，简直像走了整整一夜。终于，奶奶在一座狐狸屋前停下。那屋子又破又旧，是雷迪见过最糟糕的住处。
        - id: ch01-b15
          speaker: granny_fox
          text: 我们到了！
        - id: ch01-b16
          speaker: reddy_fox
          text: 什么？我们真要住进这个破地方？稍微体面一点的狐狸，连鼻子都不会往里伸！
          emotion: surprised
        - id: ch01-b17
          speaker: granny_fox
          text: 我就是在这里出生的！你要想平平安安，就别在这个时候摆架子。谁把朴素日子瞧不起，见了什么都要翘鼻子，穷困的刀锋迟早会劈开，他那舒舒服服的好日子。
          emotion: angry
        - id: ch01-b18
          speaker: granny_fox
          text: 好了，一个字也不许再说。马上进去！
        - id: ch01-b19
          speaker: narrator
          text: 奶奶刚才说的那番话，雷迪没有完全听懂。不过，他知道这时候必须听话。于是，他小心地从那扇破败的门里爬了进去。
