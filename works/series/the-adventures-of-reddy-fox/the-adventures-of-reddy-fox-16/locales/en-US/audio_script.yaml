  chapters:
    - id: ch01
      title: XVI. Unc' Billy Possum Visits the Smiling Pool
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Little Joe Otter and Billy Mink sat on the Big Rock in the Smiling Pool. They had nothing else to do, so they were busy planning some mischief. Jerry Muskrat couldn't join them. He was filling his new house with food for the winter and had no time for mischief.
        - id: ch01-b02
          speaker: narrator
          text: All at once, Billy raised a finger to his lips. He wanted Little Joe to stay perfectly still. Billy's sharp eyes had spotted something moving among the bulrushes. The two friends watched closely, ready to dive into the Smiling Pool at the first hint of danger.
        - id: ch01-b03
          speaker: narrator
          text: After a few minutes, the rushes parted, and a sharp little old face peeked through. Little Joe and Billy both sighed with relief. Then their eyes began to dance.
        - id: ch01-b04
          speaker: billy_mink
          text: Hi, Unc' Billy Possum!
        - id: ch01-b05
          speaker: narrator
          text: A grin spread across the little old face in the bulrushes.
        - id: ch01-b06
          speaker: unc_billy_possum
          text: Hi, yo'self!
        - id: ch01-b07
          speaker: narrator
          text: It really was Unc' Billy Possum.
        - id: ch01-b08
          speaker: little_joe_otter
          text: What brings you over here?
        - id: ch01-b09
          speaker: unc_billy_possum
          text: Ah'm jes' lookin' around.
        - id: ch01-b10
          speaker: narrator
          text: His eyes twinkled as he answered.
        - id: ch01-b11
          speaker: billy_mink
          text: Have you heard what happened to Reddy Fox?
        - id: ch01-b12
          speaker: unc_billy_possum
          text: Ah jes' came from Reddy's home.
        - id: ch01-b13
          speaker: little_joe_otter
          text: How is he doing?
        - id: ch01-b14
          speaker: unc_billy_possum
          text: Po'ly. He sho'ly is po'ly.
        - id: ch01-b15
          speaker: narrator
          text: Unc' Billy shook his head soberly. Then he told them all about Reddy. Reddy was so stiff, sore, and sick that he couldn't find any food for himself. And old Granny Fox had lost the chicken she had caught for him.
        - id: ch01-b16
          speaker: billy_mink
          text: That's just what he deserves!
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: Billy had never forgotten the time Reddy fooled him and caught more fish than anyone else.
        - id: ch01-b18
          speaker: narrator
          text: Unc' Billy nodded.
        - id: ch01-b19
          speaker: unc_billy_possum
          text: Yo' are right. Yo' cert'nly are right. Yes, Suh, Ah reckon yo' are right. But tell me, Billy Mink. Were yo' ever hungry? Ah mean real hungry.
        - id: ch01-b20
          speaker: narrator
          text: Billy remembered the day he had missed his dinner. He had left it behind in a temper, and Mr. Night Heron had gobbled it up. Billy nodded.
        - id: ch01-b21
          speaker: unc_billy_possum
          text: Ah was jes' wonderin' what it would feel like to be powerful hungry and not able to hunt for a thing to eat.
        - id: ch01-b22
          speaker: narrator
          text: For a few minutes, nobody spoke. Then Billy stood and stretched.
        - id: ch01-b23
          speaker: billy_mink
          text: Good-by.
        - id: ch01-b24
          speaker: little_joe_otter
          text: Why are you leaving so suddenly?
        - id: ch01-b25
          speaker: billy_mink
          text: If you really have to know, I'm going to catch a fish and take it to Reddy Fox!
          emotion: angry
        - id: ch01-b26
          speaker: little_joe_otter
          text: Good! And don't think you can have all the fun by yourself, Billy Mink. I'm coming with you.
          emotion: happy
        - id: ch01-b27
          speaker: narrator
          text: There was a splash in the Smiling Pool. Suddenly Unc' Billy was alone, looking out at the water and the Big Rock. He smiled to himself and turned away.
        - id: ch01-b28
          speaker: unc_billy_possum
          text: Ah reckon Ah'll sho' have to do my share, too.
        - id: ch01-b29
          speaker: narrator
          text: So when old Granny Fox finally came home with nothing but a little wood mouse for Reddy, she found him fast asleep. His stomach was as full as it could be.
        - id: ch01-b30
          speaker: narrator
          text: Not far away lay two fish tails and the feathers of a little duck.
