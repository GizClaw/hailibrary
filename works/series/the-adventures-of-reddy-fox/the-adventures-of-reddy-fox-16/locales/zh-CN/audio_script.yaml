audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 悠闲诙谐，打趣时故作严厉
        timbre: 粗暖而略带鼻音
        pace: 从容适中
        pitch: 中低音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 机灵爽快，淘气时带着顽皮劲儿
        timbre: 明亮清脆
        pace: 轻快敏捷
        pitch: 中高音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 活泼直率，好奇时热切自然
        timbre: 清朗圆润
        pace: 轻快适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十六章　负鼠比利大叔造访微笑池塘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小水獭乔和水貂比利坐在微笑池塘的大岩石上。他们闲着没事，正盘算着怎么淘气。麝鼠杰里却忙着往新房子里储藏过冬的食物，根本没空跟他们胡闹。
        - id: ch01-b02
          speaker: narrator
          text: 水貂比利忽然把手指按在嘴唇上，提醒小水獭乔千万别动。他那双锐利的眼睛看见，香蒲丛里有什么东西在动。两个小伙伴一起盯着那里，做好了准备，只要露出一点儿危险的迹象，就立刻潜进池塘。
        - id: ch01-b03
          speaker: narrator
          text: 没过多久，香蒲朝两边分开，一张尖尖的老脸探了出来。小水獭乔和水貂比利各自松了一口气，两双眼睛里马上闪起调皮的光。
        - id: ch01-b04
          speaker: billy_mink
          text: 嗨，负鼠比利大叔！
        - id: ch01-b05
          speaker: narrator
          text: 那张尖尖的老脸上慢慢露出了笑容。来的果然是负鼠比利大叔。
        - id: ch01-b06
          speaker: unc_billy_possum
          text: 嗨，你也好啊！
        - id: ch01-b07
          speaker: little_joe_otter
          text: 您跑到这边来做什么呀？
        - id: ch01-b08
          speaker: unc_billy_possum
          text: 没什么，就是到处转转。
        - id: ch01-b09
          speaker: narrator
          text: 比利大叔说着，眼睛里闪着笑意。
        - id: ch01-b10
          speaker: billy_mink
          text: 您知道小狐狸雷迪出事了吗？
        - id: ch01-b11
          speaker: unc_billy_possum
          text: 我刚刚才从他家过来。
        - id: ch01-b12
          speaker: little_joe_otter
          text: 他现在怎么样？
        - id: ch01-b13
          speaker: unc_billy_possum
          text: 不好啊，他实在很不好。
        - id: ch01-b14
          speaker: narrator
          text: 比利大叔神情严肃地摇摇头。他把雷迪的情形一五一十地告诉两个小伙伴。雷迪浑身又僵又疼，病得非常厉害，甚至连吃的也没法自己去找。老狐狸奶奶本来捉到一只小鸡，要拿给雷迪吃，可后来连那只鸡也丢了。
        - id: ch01-b15
          speaker: billy_mink
          text: 那是他活该！
        - id: ch01-b16
          speaker: narrator
          text: 水貂比利始终记得，从前雷迪骗过他，最后还捉到了最多的鱼。
        - id: ch01-b17
          speaker: narrator
          text: 比利大叔点了点头。
        - id: ch01-b18
          speaker: unc_billy_possum
          text: 对，你说得对，当然对。是的，先生，我看你说得一点儿不错。不过，水貂比利，你挨过饿吗？我说的可是真正饿得厉害。
        - id: ch01-b19
          speaker: narrator
          text: 水貂比利想起了一件事。有一回，他发脾气把晚饭扔在一边，夜鹭先生一口就把饭吞了，害得他什么也没吃上。想到这里，他点了点头。
        - id: ch01-b20
          speaker: unc_billy_possum
          text: 我刚才就在琢磨，要是一个人饿得前胸贴后背，却没法出去找东西吃，那会是什么滋味呢？
        - id: ch01-b21
          speaker: narrator
          text: 好一会儿，谁也没开口。后来，水貂比利站起来，伸了个懒腰。
        - id: ch01-b22
          speaker: billy_mink
          text: 再见。
        - id: ch01-b23
          speaker: little_joe_otter
          text: 你怎么说走就走？
        - id: ch01-b24
          speaker: billy_mink
          text: 你非要问的话，我就告诉你！我要去捉条鱼，给小狐狸雷迪送过去！
        - id: ch01-b25
          speaker: little_joe_otter
          text: 好啊！水貂比利，你可别以为这种好玩的事能让你一个人全占了。我也跟你去。
        - id: ch01-b26
          speaker: narrator
          text: 微笑池塘里响起“扑通”一声。转眼间，比利大叔朝前望去，眼前只剩下微笑池塘的水和那块大岩石。他转身离开，独自笑了笑。
        - id: ch01-b27
          speaker: unc_billy_possum
          text: 看来，我也真得尽自己的一份力喽。
        - id: ch01-b28
          speaker: narrator
          text: 后来，老狐狸奶奶终于回到家，只给雷迪带回一只小小的林鼠。她却发现雷迪正在打盹儿，肚子已经撑得不能再饱了。
        - id: ch01-b29
          speaker: narrator
          text: 就在离雷迪不远的地方，还留着两条鱼尾巴和一只小鸭子的羽毛。
