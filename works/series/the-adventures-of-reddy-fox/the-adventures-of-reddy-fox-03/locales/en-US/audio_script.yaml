  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: youthful and expressive
        timbre: bright and clear
        pace: quick
        pitch: medium-high
    blacky_crow:
      display_name: Blacky the Crow
      tts:
        delivery: clever and teasing
        timbre: sharp and raspy
        pace: brisk
        pitch: medium-high
    bowser_hound:
      display_name: Bowser the Hound
      tts:
        delivery: forceful and confident
        timbre: deep and booming
