  chapters:
    - id: ch01
      title: III. Bowser the Hound Isn't Fooled
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Granny Fox had taught Reddy so much that he was starting to think himself very wise and important. Reddy was naturally smart, and he had learned her tricks quickly. But he was also a boaster. Every day he strutted around the Green Meadows, telling everyone how clever he was. Before long, Blacky the Crow had heard enough.
        - id: ch01-b02
          speaker: blacky_crow
          text: If you're really that smart, why do you always stay out of Bowser the Hound's sight? I don't think you're clever enough to fool him.
        - id: ch01-b03
          speaker: narrator
          text: Many of the little meadow people heard Blacky's challenge, and Reddy knew they had. If he couldn't prove Blacky wrong, they would laugh at him forever. Then Reddy remembered the trick Granny Fox had played on the young hound at the railroad bridge. He could try that same trick on Bowser and have Blacky there to watch. Yes, that was what he would do.
        - id: ch01-b04
          speaker: reddy_fox
          text: Come to the railroad bridge when the train arrives this afternoon. Then you'll see how easily I can fool Bowser the Hound.
        - id: ch01-b05
          speaker: narrator
          text: Blacky agreed to come, and Reddy went off to find Bowser. Meanwhile, Blacky told everyone he met about Reddy's promise. Each time he told the story, he chuckled as though it were the funniest joke he had ever heard.
        - id: ch01-b06
          speaker: narrator
          text: That afternoon, Blacky arrived right on time, with his cousin Sammy Jay beside him. Soon they spotted Reddy racing across the fields. Bowser the Hound was close behind, baying as he ran.
        - id: ch01-b07
          speaker: narrator
          text: Reddy copied exactly what Granny Fox had done with the young hound. He let Bowser come very close. Then, just as the train came roaring toward them, Reddy dashed onto the long bridge and ran across the tracks ahead of it.
        - id: ch01-b08
          speaker: narrator
          text: Reddy expected Bowser to be so intent on catching him that he wouldn't notice the train until he was already on the bridge. That was what had happened to the young hound. Then Bowser would have only two choices. He could jump into the swift river below, or the train would run him over.
        - id: ch01-b09
          speaker: narrator
          text: The moment Reddy reached the far side, he leaped off the tracks and turned around to watch. The train was already halfway across the bridge, but Bowser was nowhere in sight. Reddy decided the hound must have jumped. He sat down with a very pleased grin.
        - id: ch01-b10
          speaker: narrator
          text: The long train thundered past. Dust and smoke made Reddy squeeze his eyes shut. When he opened them, he found himself staring straight into Bowser's wide-open mouth. The hound stood less than ten feet away.
        - id: ch01-b11
          speaker: bowser_hound
          text: Did you really think that old trick would fool me?
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: Bowser roared the words. Reddy didn't wait to answer. Badly frightened, the little fox turned and fled as fast as he could.
        - id: ch01-b13
          speaker: narrator
          text: Bowser already knew that trick. He had simply waited for the train to pass, then raced across the bridge right behind it.
        - id: ch01-b14
          speaker: narrator
          text: Reddy ran on until he was tired and out of breath. He was hurrying to Granny Fox for help getting rid of Bowser when a sound behind him made him grind his teeth.
        - id: ch01-b15
          speaker: blacky_crow
          text: Haw, haw, haw! Aren't we clever!
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: It was Blacky the Crow.
