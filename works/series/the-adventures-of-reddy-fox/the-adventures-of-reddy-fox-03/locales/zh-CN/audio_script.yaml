audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 小狐狸雷迪
      tts:
        delivery: 年轻直率，遇到危险时慌张急促
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 中高音
    blacky_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 机灵尖锐，取笑别人时毫不客气
        timbre: 清亮略带沙哑
        pace: 明快
        pitch: 中高音
    bowser_hound:
      display_name: 猎犬鲍泽
      tts:
        delivery: 粗犷有力，发怒时威严响亮
        timbre: 浑厚低沉
        pace: 稳健
        pitch: 低音
  chapters:
    - id: ch01
      title: 第三章　猎犬鲍泽没上当
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 狐奶奶教会雷迪许多本领以后，雷迪越来越觉得自己聪明又了不起。他本来就机灵，奶奶教的招数总是一学就会。可他还有个毛病，就是爱吹牛。每天，他都在绿草地上神气地晃来晃去，见谁都要夸一夸自己的聪明。乌鸦布莱基终于听腻了。
        - id: ch01-b02
          speaker: blacky_crow
          text: 你既然这么聪明，见了猎犬鲍泽为什么总要躲起来？依我看，你根本骗不过他。
        - id: ch01-b03
          speaker: narrator
          text: 周围有不少草地上的小动物听见了。雷迪明白，要是不能让大家知道布莱基说错了，他以后就会一直遭人笑话。这时，他突然想起狐奶奶在铁道桥上对付年轻猎犬的那一招。他也可以用这招骗鲍泽，再让布莱基到场看个清楚。对，就这样办。
        - id: ch01-b04
          speaker: reddy_fox
          text: 下午火车来的时候，你去铁道桥等着吧。我会让你亲眼看看，骗鲍泽有多容易。
        - id: ch01-b05
          speaker: narrator
          text: 布莱基答应了，雷迪便出发去找鲍泽。布莱基呢，遇见谁都要讲一遍雷迪的保证。每讲一遍，他都咯咯直笑，好像从没听过比这更可笑的事。
        - id: ch01-b06
          speaker: narrator
          text: 下午，布莱基准时来到桥边，表弟松鸦萨米也跟着他。过了一会儿，他们看见雷迪急匆匆地穿过田野。猎犬鲍泽在后面边叫边追，一刻也不肯停。
        - id: ch01-b07
          speaker: narrator
          text: 雷迪照搬狐奶奶的办法，故意等鲍泽追得很近。就在火车轰响着开过来时，他赶在车头前冲上长桥，一口气跑到了另一头。
        - id: ch01-b08
          speaker: narrator
          text: 雷迪以为，鲍泽光顾着追他，直到上了桥才会看到火车。那时候，鲍泽要么跳进桥下的急流，要么就会被火车轧到，跟那只年轻猎犬一样无路可逃。
        - id: ch01-b09
          speaker: narrator
          text: 跑过桥后，雷迪立刻跳下铁轨，回过头等着看热闹。火车已经驶过半座桥，鲍泽却不见了。雷迪认定他早已跳进河里，便坐下来咧着嘴，满心得意。
        - id: ch01-b10
          speaker: narrator
          text: 长长的火车轰隆隆地开了过去。尘土和烟雾扑面而来，雷迪只好闭紧眼睛。等他再次睁开眼，面前竟是鲍泽张得大大的嘴巴。他们之间还不到十英尺。
        - id: ch01-b11
          speaker: bowser_hound
          text: 你真以为，这个老掉牙的把戏能骗到我？
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: 雷迪哪里还敢答话。他转身就跑，使出了最快的速度。这下，小狐狸可吓得不轻。
        - id: ch01-b13
          speaker: narrator
          text: 原来，鲍泽对这招早有防备。他一直等在桥边，等整列火车开完，才紧跟着车尾跑过长桥。
        - id: ch01-b14
          speaker: narrator
          text: 雷迪一路逃得上气不接下气，浑身都累透了。他正要去求狐奶奶帮忙，好甩掉鲍泽，忽然听见一个声音。那声音气得他直磨牙。
        - id: ch01-b15
          speaker: blacky_crow
          text: 哈，哈，哈！瞧瞧我们多聪明呀！
        - id: ch01-b16
          speaker: narrator
          text: 嘲笑他的，正是乌鸦布莱基。
