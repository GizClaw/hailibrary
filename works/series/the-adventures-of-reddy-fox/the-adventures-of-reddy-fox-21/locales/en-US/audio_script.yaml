audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: clever and self-assured, with youthful impatience
        timbre: bright and alert
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: XXI. Reddy Fox Disobeys
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Granny Fox had sent Reddy into the house and told him to stay there until she came home. Reddy hadn't wanted to obey. But he knew Granny meant every word, so he slowly crawled down the long hall to the bedroom deep underground.
        - id: ch01-b02
          speaker: narrator
          text: Before long, Reddy heard a voice. It sounded very faint from his underground bedroom, but he knew it at once. He raised his ears and listened. Bowser the Hound was chasing Granny Fox.
        - id: ch01-b03
          speaker: narrator
          text: Reddy grinned. He wasn't worried about Granny at all. She was so smart that she could lose Bowser whenever she pleased. Then a thought came to him, and his grin disappeared.
        - id: ch01-b04
          speaker: reddy_fox
          text: Granny really did know trouble was coming, just like she said.
        - id: ch01-b05
          speaker: narrator
          text: Reddy curled up and tried to sleep. He meant to obey. He wouldn't put even his little black nose outside before Granny returned. Somehow, though, he couldn't fall asleep. The bedroom was small, and his stiff, sore body couldn't get comfortable. He twisted, turned, and fidgeted until he felt worse than ever.
        - id: ch01-b06
          speaker: narrator
          text: Then he began thinking about the warm sunshine. How good it would feel to stretch out on the doorstep and let the warmth ease his sore legs. Granny had been gone a long time. Something must have happened to delay her. Reddy told himself that if she'd known she would be away so long, she wouldn't have ordered him to stay inside until she returned.
        - id: ch01-b07
          speaker: narrator
          text: After a while, Reddy crept partway up the long, dark hall. He could just make out the sunlight on the doorstep. Soon he edged a little closer. He wasn't going to disobey Granny. Oh, no! She had said to stay in the house. She hadn't said he mustn't look outside. So Reddy crawled closer to the open door and the sunshine.
        - id: ch01-b08
          speaker: reddy_fox
          text: Granny is getting old and nervous. My eyes are every bit as sharp as hers. I'd like to see Farmer Brown's boy sneak up on me when I'm truly watching!
        - id: ch01-b09
          speaker: narrator
          text: After telling himself that, Reddy crept a little nearer to the open doorway and its warm sunlight.
        - id: ch01-b10
          speaker: narrator
          text: Outside looked so bright, warm, and pleasant. Reddy was sure he would feel much better if he could stretch out full length on the doorstep. The warmth would take the soreness from his legs. He heard Jenny Wren fussing and scolding at someone or something, and he wondered what was wrong. He moved just a tiny bit closer.
        - id: ch01-b11
          speaker: narrator
          text: Bowser's voice was still in the distance. It was so faint that Reddy had to lift his sharp ears and listen as hard as he could.
        - id: ch01-b12
          speaker: reddy_fox
          text: Granny has led them far away up the mountain. Good old Granny!
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: Reddy crawled all the way to the doorway. Jenny Wren was still fussing and scolding.
        - id: ch01-b14
          speaker: reddy_fox
          text: What is bothering her? Whether it's hot or cold, Jenny Wren always has something to scold about. From morning until night, the whole day long, her quick little tongue keeps going strong. I'm going to find out what all this means.
        - id: ch01-b15
          speaker: narrator
          text: Reddy Fox poked his head outside. He looked straight into the freckled face of Farmer Brown's boy and the muzzle of that dreadful gun!
