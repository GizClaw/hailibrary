audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 小狐狸雷迪
      tts:
        delivery: 聪明自信，带着少年气的急躁
        timbre: 明亮机敏
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十一章　小狐狸雷迪不听话
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老狐狸奶奶把小狐狸雷迪赶回屋里，要他一直待着，等她回家。雷迪很不情愿，却知道奶奶说出口的话绝不会改变。他只得慢慢爬过长长的地道，回到地底深处的卧房。
        - id: ch01-b02
          speaker: narrator
          text: 不一会儿，雷迪听见了一个声音。那声音传进深埋地下的卧房时，已经轻得快要听不见了，可雷迪立刻就认了出来。他把耳朵高高竖起，凝神一听，是猎犬鲍泽在叫。听那动静，鲍泽正在追老狐狸奶奶。
        - id: ch01-b03
          speaker: narrator
          text: 雷迪咧开嘴笑了。他才不替奶奶担心呢，连一丁点儿都不担心。奶奶那么聪明，只要想甩掉鲍泽，随时都能做到。可就在这时，雷迪忽然想起了一件事，脸上的笑一下子没了。
        - id: ch01-b04
          speaker: reddy_fox
          text: 奶奶说她觉得要出事，还真叫她说中了。
        - id: ch01-b05
          speaker: narrator
          text: 雷迪蜷起身子，想睡一觉。他是真打算听话的。奶奶回来以前，他连小黑鼻子都不会伸到门外。可是，他偏偏睡不着。卧房太小，他浑身又僵又痛，怎么躺都不舒服。他翻过来，转过去，不停地动弹，结果身上反而越来越难受。
        - id: ch01-b06
          speaker: narrator
          text: 雷迪想到了外面的暖阳。要是能把四条腿伸开，舒舒服服躺在门阶上，腿上的酸痛一定会慢慢散去。奶奶怎么还没回来呢？一定有什么事耽搁了她。雷迪越想越觉得，要是奶奶早知道自己会走这么久，她就不会命令他一直待在屋里，非等她回来不可。
        - id: ch01-b07
          speaker: narrator
          text: 又等了一阵，雷迪沿着黑漆漆的长地道，悄悄往上爬了一小段。从那里，他刚好看得见门阶上的阳光。过了一会儿，他又挪近一点儿。别误会，他可没想不听奶奶的话。绝对没有！奶奶只叫他留在屋里，又没说不能朝外面看。于是，雷迪继续往敞开的门口爬，离阳光又近了一点儿。
        - id: ch01-b08
          speaker: reddy_fox
          text: 奶奶年纪大了，胆子也越来越小。难道我的眼睛还没她看得清吗？只要我真的小心盯着，我倒想瞧瞧，布朗家的男孩还能怎么摸到我身边！
        - id: ch01-b09
          speaker: narrator
          text: 雷迪这样对自己说着，又朝敞开的门挪近了一点儿。
        - id: ch01-b10
          speaker: narrator
          text: 外面看上去真亮，真暖和，也真舒服。雷迪觉得，只要能伸直身子躺上门阶，自己马上就会好受许多，腿也不会那么疼了。这时，他听见鹪鹩珍妮正在冲着谁，或者冲着什么东西，大吵大骂。他很想知道那里究竟怎么了，便又向前挪了那么一丁点儿。
        - id: ch01-b11
          speaker: narrator
          text: 远处还传来鲍泽的叫声，只是轻得几乎听不见。雷迪不得不把两只尖耳朵竖得直直的，拼命听，才能捕捉到一点儿声音。
        - id: ch01-b12
          speaker: reddy_fox
          text: 奶奶已经把他们引到山上很远很远的地方去了。奶奶真棒！
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: 雷迪一直爬到门口。鹪鹩珍妮还是吵个没完。
        - id: ch01-b14
          speaker: reddy_fox
          text: 她到底怎么啦？天热她要骂，天冷她也骂。鹪鹩珍妮总是少不了一顿骂。从早到晚，一整天，她那灵巧的舌头就没停过。
        - id: ch01-b15
          speaker: reddy_fox
          text: 我得瞧瞧，这到底是怎么回事。
        - id: ch01-b16
          speaker: narrator
          text: 小狐狸雷迪把脑袋探出门外。谁知，他一眼就对上了布朗家男孩那张长满雀斑的脸，还看见那支可怕的枪，枪口正对着他！
