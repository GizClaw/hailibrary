audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练精明，恼怒时尖刻凶狠
        timbre: 苍老而有力
        pace: 从容，动怒时加快
        pitch: 中低音
    merry_little_breeze_1:
      display_name: 第一阵欢乐小微风
      tts:
        delivery: 明快活泼，满是孩子般的好奇
        timbre: 轻盈清脆
        pace: 轻快
        pitch: 高音
    merry_little_breeze_2:
      display_name: 第二阵欢乐小微风
      tts:
        delivery: 欢快顽皮，笑意藏不住
        timbre: 轻柔通透
        pace: 稍快
        pitch: 中高音
    merry_little_breeze_3:
      display_name: 第三阵欢乐小微风
      tts:
        delivery: 无忧无虑，语气轻松雀跃
        timbre: 柔和轻盈
        pace: 轻快
        pitch: 高音
    merry_little_breeze_4:
      display_name: 第四阵欢乐小微风
      tts:
        delivery: 阳光顽皮，声音里带着笑
        timbre: 清亮纤柔
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十三章　老狐狸奶奶吓坏了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老狐狸奶奶的一颗心，直往脚趾尖沉。秃鹫老先生一定看见了布朗家的男孩，也看见了男孩手里的枪。那地方就在她家附近，而受伤的雷迪正在家里养伤。要不然，秃鹫老先生怎么会催她快回去呢？
        - id: ch01-b02
          speaker: narrator
          text: 为了把猎犬鲍泽引出绿草原，奶奶跑了好长一段路，早就累得浑身发热。她本想沿着阴凉的小路慢慢走回去，顺便凉快一下。现在可不行了。她必须比刚才跑得更快，赶紧弄清布朗家的男孩有没有找到她的家。
        - id: ch01-b03
          speaker: granny_fox
          text: 幸好我叫雷迪进了屋，还叮嘱他，在我回来以前千万别出来。幸好我想到了这一点！
        - id: ch01-b04
          speaker: narrator
          text: 奶奶边跑边想着。没过多久，头顶的树梢上传来了歌声。
        - id: ch01-b05
          speakers: [merry_little_breeze_1, merry_little_breeze_2, merry_little_breeze_3, merry_little_breeze_4]
          ensemble: chorus
          text: 阳光灿烂一整天，欢欢喜喜舞翩跹！你追我赶多快活，输赢都把笑脸现！
        - id: ch01-b06
          speaker: narrator
          text: 这歌声，奶奶一听就认出来了。她抬头一看，果然和自己猜的一样，是西风老妈妈的欢乐小微风。她们正在枝叶间玩耍，其中一阵小微风低下头，发现了奶奶。
        - id: ch01-b07
          speaker: merry_little_breeze_1
          text: 快看，老狐狸奶奶在下面！她又热又累。咱们下去帮她凉快凉快吧！
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: 转眼之间，小微风们全从树梢飞了下来。她们围着奶奶跳起舞，送来一阵阵凉风。奶奶却一步也没停。她心里急得很，哪敢停下来呢？好在小微风一直陪着她，这一回，跑起来可比刚才省力多了。
        - id: ch01-b09
          speaker: granny_fox
          text: 你们有没有看见布朗家的男孩？
        - id: ch01-b10
          speaker: narrator
          text: 奶奶喘着粗气问道。
        - id: ch01-b11
          speakers: [merry_little_breeze_1, merry_little_breeze_2, merry_little_breeze_3, merry_little_breeze_4]
          ensemble: chorus
          text: 看见啦！刚才他就在你家附近呢，狐狸奶奶。我们还把他的帽子扯了下来，就为了听他气呼呼地骂人！
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: 小微风们互相挠着痒痒，笑个不停。看来，捉弄布朗家的男孩让她们开心极了。可老狐狸奶奶一点也没有跟着笑。哎呀，她哪里笑得出来！她的心沉得更低，只能拼命加快脚步。
        - id: ch01-b13
          speaker: narrator
          text: 很快，奶奶跑上了一座小山顶。从这里，她已经能望见自己的家。只看了一眼，她的心就像跳进了嗓子眼儿，突然不动了，两只眼睛也差点瞪出来。布朗家的男孩正站在她家门口。就在这时，雷迪偏偏把脑袋探出了门外。
        - id: ch01-b14
          speaker: narrator
          text: 奶奶眼睁睁看着男孩举起枪，枪口正对着雷迪。她赶紧用两只手紧紧蒙住眼睛，不敢看下去，只等着那一声枪响。
        - id: ch01-b15
          speaker: narrator
          text: 可枪一直没响。奶奶从指缝里偷偷望去。布朗家的男孩还站在那里，雷迪却已经缩回屋里，不见了。
        - id: ch01-b16
          speaker: narrator
          text: 老狐狸奶奶这才松了一口气。
        - id: ch01-b17
          speaker: narrator
          text: 这场惊吓实在太可怕了。奶奶记得，自己从来没有这么害怕过。
