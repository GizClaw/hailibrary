  chapters:
    - id: ch01
      title: XXIII. Granny Fox Has a Terrible Scare
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Granny Fox felt her heart sink all the way to her toes. She was certain Ol' Mistah Buzzard had seen Farmer Brown's boy and his gun near the house where Reddy Fox was nursing his wounds. Why else would he have told her to hurry home?
        - id: ch01-b02
          speaker: narrator
          text: Granny was already hot and tired after her long run leading Bowser the Hound away from the Green Meadows. She had planned to walk home along the shady paths and cool off. Now she had to run faster than ever. She had to find out whether Farmer Brown's boy had discovered her house.
        - id: ch01-b03
          speaker: granny_fox
          text: Thank goodness I told Reddy to stay inside until I came back. I'm so glad I did!
        - id: ch01-b04
          speaker: narrator
          text: Granny thought about that as she ran. Before long, she heard voices singing from the treetops above her.
        - id: ch01-b05
          speakers: [merry_little_breeze_1, merry_little_breeze_2, merry_little_breeze_3, merry_little_breeze_4]
          ensemble: chorus
          text: Happily we dance and play, all the livelong sunny day! Happily we run and race, and win or lose with smiling face!
        - id: ch01-b06
          speaker: narrator
          text: "Granny knew those voices. She looked up and saw exactly whom she expected: the Merry Little Breezes of Old Mother West Wind, playing among the leaves. Then one of them glanced down and spotted her."
        - id: ch01-b07
          speaker: merry_little_breeze_1
          text: Look, it's old Granny Fox! She looks so hot and tired. Let's fly down and cool her off!
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: In a flash, all the Breezes swept down from the treetops. They danced around Granny and cooled her as she ran. Granny never slowed down. She was far too worried for that. But with the Breezes beside her, running wasn't nearly as hard as before.
        - id: ch01-b09
          speaker: granny_fox
          text: Have you seen Farmer Brown's boy?
        - id: ch01-b10
          speaker: narrator
          text: Granny panted out the question.
        - id: ch01-b11
          speakers: [merry_little_breeze_1, merry_little_breeze_2, merry_little_breeze_3, merry_little_breeze_4]
          ensemble: chorus
          text: Oh, yes! We saw him near your house just a little while ago. We even pulled off his hat so we could hear him scold!
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: The Breezes tickled one another and laughed. They had clearly enjoyed their fun with Farmer Brown's boy. But old Granny Fox did not laugh. Oh, my, no! Her heart sank even lower, and she pushed herself to run faster.
        - id: ch01-b13
          speaker: narrator
          text: Soon Granny reached the top of a hill where she could see her home. Her heart seemed to jump into her mouth and stop beating. Her eyes nearly popped out of her head. Farmer Brown's boy was standing right in front of her door. As Granny watched, Reddy Fox stuck his head outside.
        - id: ch01-b14
          speaker: narrator
          text: Granny saw Farmer Brown's boy point his gun straight at Reddy. She clapped both hands over her eyes so she would not see the dreadful sight. Then she waited for the gun to bang.
        - id: ch01-b15
          speaker: narrator
          text: No bang came. Granny peeked through her fingers. Farmer Brown's boy was still there, but Reddy had vanished back inside the house.
        - id: ch01-b16
          speaker: narrator
          text: Granny Fox sighed with relief.
        - id: ch01-b17
          speaker: narrator
          text: It had been a terrible scare, the worst she could remember.
