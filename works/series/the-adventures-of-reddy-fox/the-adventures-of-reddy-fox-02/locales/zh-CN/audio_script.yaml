audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 小狐狸雷迪
      tts:
        delivery: 年轻直率，遇到危险时慌张急促
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 中高音
    granny_fox:
      display_name: 狐奶奶
      tts:
        delivery: 老练果断，话里常带一点机智的笑意
        timbre: 温厚略带沙哑
        pace: 沉稳
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二章　狐奶奶教雷迪一招
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 每一天，狐奶奶都领着雷迪来到那座长长的铁道桥上，让他一趟又一趟地跑过桥去。刚开始，雷迪一上桥就头晕。练到后来，他已经能全速飞奔过去，心里一点也不怕了。这一天，他终于忍不住抱怨起来。
        - id: ch01-b02
          speaker: reddy_fox
          text: 会过桥到底有什么用呀？这件事谁都做得到！
        - id: ch01-b03
          speaker: narrator
          text: 狐奶奶笑了。
        - id: ch01-b04
          speaker: granny_fox
          text: 那你还记不记得，自己头一回过桥是什么样子？
        - id: ch01-b05
          speaker: narrator
          text: 雷迪低下头。他怎么会不记得呢？那一次，狐奶奶还得吓唬他，他才敢跑过去。
        - id: ch01-b06
          speaker: narrator
          text: 狐奶奶忽然抬起脑袋。
        - id: ch01-b07
          speaker: granny_fox
          text: 听！
        - id: ch01-b08
          speaker: narrator
          text: 雷迪马上竖起两只尖耳朵。他们身后的远处，传来一阵狗叫。那声音不是猎犬鲍泽的，听起来是一只年轻猎犬。狐奶奶听了几分钟。狗叫声越来越响，那只猎犬正越追越近。
        - id: ch01-b09
          speaker: granny_fox
          text: 没错，他正沿着我们的脚印追过来。雷迪，你现在跑到桥那头去，站在那边的小山顶上看着。我也许能教你一招，让你知道我为什么非要你学会过桥。
        - id: ch01-b10
          speaker: narrator
          text: 雷迪听奶奶的话，小跑着过了长桥，登上山顶坐好。狐奶奶却走到田野中央，也坐了下来。没多久，一只年轻猎犬从灌木丛里冲出来，鼻子一路循着她的脚印。猎犬一抬头看见狐奶奶，叫得立刻又凶又急。狐奶奶等他看清自己，才转身跑起来，可她跑得一点也不快。雷迪越看越糊涂。奶奶哪里像是在逃命？她简直是在逗那只猎犬玩。
        - id: ch01-b11
          speaker: narrator
          text: 过了一会儿，雷迪听见远处传来低低的轰隆声。紧接着，汽笛也响了。原来是一列火车。狐奶奶当然也听见了。她边跑边绕，慢慢靠近长桥。等火车出现在眼前，她突然冲上桥去，快得只剩下一道小小的红影。
        - id: ch01-b12
          speaker: narrator
          text: 猎犬当时就在她身后。他一心只想抓住狐奶奶，根本没看见前面的桥，也没发现开来的火车。可他哪有狐奶奶跑得快呀！狐奶奶已经到了桥那头，他却连桥中央都没到。火车就在他背后，一声声鸣着汽笛，催他赶紧让开。
        - id: ch01-b13
          speaker: narrator
          text: 猎犬吓得惨叫一声。到了这个地步，他只剩下一个办法。他纵身往下一跳，落进桥下湍急的河水里。雷迪最后看见他时，他正拼了命地划水，想要游上岸去。
        - id: ch01-b14
          speaker: narrator
          text: 狐奶奶爬上小山，来到雷迪身边。
        - id: ch01-b15
          speaker: granny_fox
          text: 这下你该明白，我为什么要你练习过桥了吧？想甩掉猎犬，这一招可好用得很。
