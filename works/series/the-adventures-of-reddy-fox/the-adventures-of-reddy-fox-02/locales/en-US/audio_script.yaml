audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    granny_fox:
      display_name: Granny Fox
      tts:
        delivery: shrewd and self-assured
        timbre: mature and crisp
        pace: steady
        pitch: medium-low
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: youthful and expressive
        timbre: bright and clear
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: II. Granny Shows Reddy a Trick
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Every day, Granny Fox took Reddy Fox to the long railroad bridge. She made him run across it and back again until he wasn't afraid anymore. The bridge had made him dizzy at first. Now he could race over it at top speed without minding at all.
        - id: ch01-b02
          speaker: reddy_fox
          text: What good is it to know how to cross a bridge? Anybody can do that!
        - id: ch01-b03
          speaker: narrator
          text: Granny Fox smiled.
        - id: ch01-b04
          speaker: granny_fox
          text: Do you remember what happened the first time you tried?
        - id: ch01-b05
          speaker: narrator
          text: Reddy lowered his head. Of course he remembered. Granny had needed to frighten him before he would cross that bridge for the first time.
        - id: ch01-b06
          speaker: narrator
          text: Suddenly, Granny lifted her head.
        - id: ch01-b07
          speaker: granny_fox
          text: Listen!
        - id: ch01-b08
          speaker: narrator
          text: Reddy raised his sharp, pointed ears. Far behind them, in the direction they had come from, a dog was baying. It wasn't Bowser the Hound. This dog sounded younger. Granny listened for a few minutes, and the baying grew louder as the dog came nearer.
        - id: ch01-b09
          speaker: granny_fox
          text: That dog is following our trail. Run across the bridge, Reddy, and watch from the top of that little hill. Maybe I can show you a trick. Then you'll understand why I taught you to cross this bridge.
        - id: ch01-b10
          speaker: narrator
          text: Reddy trotted over the long bridge and climbed to the top of the hill, just as Granny had told him. He sat down to watch. Granny went into the middle of a field and sat there.
        - id: ch01-b11
          speaker: narrator
          text: Before long, a young hound burst from the bushes with his nose following Granny's trail. Then he looked up and spotted her. His baying became fiercer and more eager. Once Granny knew he had seen her, she began to run, but she didn't go very fast.
        - id: ch01-b12
          speaker: narrator
          text: Reddy couldn't understand it. Granny seemed to be playing with the hound instead of truly trying to escape.
        - id: ch01-b13
          speaker: narrator
          text: Soon Reddy heard another sound. A long, low rumble came through the air. Then a whistle sounded in the distance. A train was coming.
        - id: ch01-b14
          speaker: narrator
          text: Granny heard it too. While she ran, she began working her way back toward the long bridge. Now the train had come into sight.
        - id: ch01-b15
          speaker: narrator
          text: All at once, Granny Fox raced onto the bridge so fast that she looked like a little red streak. The dog was right at her heels when she started across. He wanted so badly to catch her that he noticed neither the bridge nor the train.
        - id: ch01-b16
          speaker: narrator
          text: But that hound couldn't run nearly as fast as Granny Fox. Oh, my, no! By the time Granny reached the other side, he wasn't even halfway across. The train was close behind him, whistling for him to get out of the way.
        - id: ch01-b17
          speaker: narrator
          text: The frightened hound gave one yelp. There was only one thing he could do. He leaped down, down into the swift water below. The last Reddy saw of him, the dog was struggling wildly to swim to shore.
        - id: ch01-b18
          speaker: narrator
          text: Granny Fox climbed the little hill and sat beside Reddy.
        - id: ch01-b19
          speaker: granny_fox
          text: Now you understand why I wanted you to learn to cross a bridge. It's a very good way to get rid of dogs.
