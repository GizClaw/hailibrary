audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而带几分讙谐，像在讲一则古老的欧洲童话
        timbre: 温暖清亮
        pace: 舒缓，转折处有自然停顿
        pitch: 中音
    martin:
      display_name: 马丁老爹
      tts:
        delivery: 年迈朴实，回忆往事时认真而心有余悸
        timbre: 沙哑苍老
        pace: 舒缓
        pitch: 中低音
    mountain_spirit:
      display_name: 山精
      tts:
        delivery: 粗野神秘，诱惑时哄人，遭拒时尖刻
        timbre: 粗哑刺耳
        pace: 中速偏慢
        pitch: 低音
    innkeeper:
      display_name: 客店老板
      tts:
        delivery: 精明好奇，问话直截了当
        timbre: 明亮结实
        pace: 中速
        pitch: 中音
    blaise:
      display_name: 布莱兹
      tts:
        delivery: 爽朗健谈，讲秘法时颇为得意
        timbre: 苍老洪亮
        pace: 中速
        pitch: 中低音
    peter:
      display_name: 彼得·布洛赫
      tts:
        delivery: 天性快活善良，受气时宽厚，得意时机灵讙谐
        timbre: 温厚明朗
        pace: 中速
        pitch: 中音
    ilse:
      display_name: 伊尔泽太太
      tts:
        delivery: 强势刻薄，发怒时尖锐逼人，示好时仍带几分别扭
        timbre: 尖细有力
        pace: 偏快
        pitch: 中高音
    lucia:
      display_name: 露西亚
      tts:
        delivery: 温柔真挚，对父亲体贴，面对爱人时羞怯而坚定
        timbre: 清柔甜润
        pace: 中速偏慢
        pitch: 中高音
    friedlin:
      display_name: 弗里德林
      tts:
        delivery: 年轻诚恳，忧伤时低沉，谈到爱情时热切坦率
        timbre: 清朗柔和
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 客店里的秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，高山和莽林之间有一座小镇。一天夜里，几个牧羊人围坐在客店的厨房里，一个接一个地讲着年轻时遇到的奇事。轮到银发苍苍的马丁老爹时，他说，自己的故事比大家的都要离奇。
        - id: ch01-b02
          speaker: martin
          text: 我年轻时无家可归，背着行囊到处流浪。后来，我进山给一个牧羊人做工，一干就是三年。有个秋天的傍晚，羊群少了十只，主人叫我带狗进林子去找。我一直找到天黑，连半点踪迹也没有。那一带我不熟，夜里又认不得路，只好在树下过夜。
        - id: ch01-b03
          speaker: martin
          text: 半夜里，狗忽然夹着尾巴，呜呜叫着往我身边挤。我抬头一看，月光下站着个怪影。他像人，却长着一头乱发，胡子一直垂到膝盖。他头戴花环，腰围橡树叶，右手还提着一棵连根拔起的冷杉。我吓得浑身发抖，可他却招手要我跟上。我僵在原地，他便开了口。
        - id: ch01-b04
          speaker: mountain_spirit
          text: 胆小的牧羊人，拿出点勇气来。我是这山里的寻宝人。跟我走，我叫你挖到数不清的金子。
        - id: ch01-b05
          speaker: martin
          text: 走开，恶鬼！我才不要你的财宝。
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: 山精咧嘴笑了，嘲笑马丁把送上门的好运往外推，将来活该当一辈子穷人。他假装要走，又回过头来劝马丁想清楚，说可以把他的背囊和钱袋全都装满。
        - id: ch01-b07
          speaker: martin
          text: 滚开，怪物！你的事，我一点也不想沾。
          emotion: fearful
        - id: ch01-b08
          speaker: mountain_spirit
          text: 总有一天，你会后悔的。不过，你还是把我的话牢牢记在心里吧。等你醒悟过来，也许还用得上。地底深处，安安稳稳地藏着一大批金银珠宝。黄昏和正午都找不到，只有午夜才能挖出来。我守了它七百年，如今期限已满。这批财宝从此归所有人，谁有本事找到，它就归谁。我才想把它送给你。我喜欢你，因为你常常在我的山上放羊。
        - id: ch01-b09
          speaker: narrator
          text: 山精接着把财宝藏在哪里、又该怎样找到，一步一步说得清清楚楚。马丁对那些话记得太牢，一个字也没有忘记，仿佛事情就发生在昨天。山精告诉他，先走到那片小山，再打听黑王谷。见到小溪后，要顺水走到锯木厂旁的石桥。不过桥，而是沿右岸前行，直到高岩挡路。离岩石一箭远的地方，会有一个像坟的小坑。找到小坑就往下挖。那里的土经过仔细夯实，硬得很，可不管多难挖都不能停。一直挖到四面都碰上硬岩，就会摸到一块方方正正的石板。把它从石壁上撬下来，宝库入口才会露出来。
        - id: ch01-b10
          speaker: mountain_spirit
          text: 你要把灯衔在嘴里，空出两只手，从洞口爬进去。路又陡，石头又尖，别撞了鼻子。膝盖碰伤也不要停，你走的是通往富贵的路。到了宽楼梯，一直下到大厅。厅里有三扇门。右边通往宝物主人的骸骨，左边藏满了毒蛇，都不能进。中间那扇上了铁锁和门闩，必须用开锁草才打得开。去问卖柴人吧，猎人们常用这种草。
        - id: ch01-b11
          speaker: mountain_spirit
          text: 门打开时会发出巨响和呻吟，那是魔草的声音，伤不了你。进去后把灯芯修好，别让灯灭了。墙上和柱子上的珠宝会亮得晃眼，你绝对不能碰。洞窟中央有一只铜箱，里面的金银永远取不尽。背走你扛得动的分量，就足够享用一辈子了。你能来三次，敢来第四次，就会因为贪心滚下石阶，摔断一条腿。每次走时，都要把松土重新填好。
        - id: ch01-b12
          speaker: narrator
          text: 山精说完，狗忽然竖起耳朵，朝远处的鞭声和车轮声汪汪直叫。马丁再看时，山精已经不见了。
        - id: ch01-b13
          speaker: innkeeper
          text: 那么，马丁老爹，你后来找到财宝了吗？还是说，这只是个编出来的故事？
        - id: ch01-b14
          speaker: martin
          text: 没有，没有。我连一步也没往那个土坑走。第一，我这条命可不能拿去钻圈套。第二，根本没人知道开锁草在哪里。所以，那山精说的是真是假，我到现在也不知道。
        - id: ch01-b15
          speaker: blaise
          text: 真可惜，马丁老爹！你把秘密藏到跟自己一样老了才说。四十年前要是告诉我们，开锁草早就到手了。要找它，最简单的法子就是请黑啄木鸟帮忙。
        - id: ch01-b16
          speaker: blaise
          text: 春天里，先找到它在树洞里的巢。等雏鸟快会飞时，用结实的草皮堵住洞口，再躲到树后。母鸟回来喂孩子，发现进不去，就会焦急地绕树鸣叫，然后朝太阳落山的方向飞走。这时候，你得准备一件鲜红斗篷，没有斗篷，几码红布也行。
        - id: ch01-b17
          speaker: blaise
          text: 啄木鸟会衔着开锁草回来。草根一碰到堵洞的草皮，草皮就会猛地飞出去。你立刻把红布铺在树下，母鸟会以为那是一团火，吓得把开锁草丢下。也有人真的点火，再往里面撒甘松花，可这法子太笨。火焰要是没能及时蹿起来，鸟就会把草根带走。
        - id: ch01-b18
          speaker: narrator
          text: 大家听得津津有味。可布莱兹说完时，夜已经很深了。人们各自回家，只有一个男人还坐在角落里。整整一晚，谁也没有留意到他。
    - id: ch02
      title: 彼得的打算
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那个男人叫彼得·布洛赫。他从前开过一家兴旺的客店，也做过大厨，如今却穷得一无所有。年轻时，他快活爱说笑，镇上没人能比他更会烧菜。鱼冻、榅桲馅饼、薄脆饼，样样拿手。烤猪头端上桌时，他还会给两只猪耳朵贴上金箔。
        - id: ch02-b02
          speaker: narrator
          text: 彼得年轻时想娶妻，偏偏看中了伊尔泽。她的毒舌远近闻名，年轻人宁肯多走几英里，也不愿跟她碰面。可彼得听她夸耀自己多么会持家，竟信了。伊尔泽答应他求婚的第二天，两人就成了亲。回家的路还没走完，他们已经吵了起来。彼得高兴得多喝了几杯，脚下一绊，拉着新娘一起摔倒。伊尔泽爬起来，当场就把他打了一顿。
        - id: ch02-b03
          speaker: narrator
          text: 邻居们都说，彼得以后别想有好日子过了。后来，这对总是合不来的夫妻接连有了几个孩子，彼得的欢喜却每次都很短。伊尔泽的脾气太过暴烈，孩子们像一出生就在受它摧残。他们像寒冬里的小羊羔，一个个夭折了。彼得虽然没有多少家产能留给后人，可膝下无子还是让他非常伤心。每埋葬一个婴儿，他都要向朋友哀叹。
        - id: ch02-b04
          speaker: peter
          text: 闪电又劈进樱花丛里了。这一回，又结不出成熟的果子。
          emotion: sad
        - id: ch02-b05
          speaker: narrator
          text: 后来，他们终于有了一个小女儿。这孩子健壮活泼，母亲再怎么发脾气，父亲再怎么宠她，她仍旧长得高挑美丽。可就在这时，家里的光景慢慢变了。彼得从小就怕麻烦，有钱时挥霍无度。只要有人饿着肚子上门讨面包，他就一定让对方吃饱。等口袋空了，他便向邻居借钱，只是每回都小心矒着那个爱骂人的妻子。
        - id: ch02-b06
          speaker: peter
          text: 等到头来，一切都会好起来的。
        - id: ch02-b07
          speaker: narrator
          text: 可到了头，他却破产了。他想靠自己的力气吃一口清白饭，却愁得不知道该从哪里下手。无论怎么努力，厄运都追着他不放。他找到一份差事，很快又丢掉，接下来的一份份差事也是如此。最后，他只能替妻子把谷物一袋袋扛到磨坊。只要走得慢一点，伊尔泽就会狠狠责骂，连本来该给他的那份饭食也舍不得。女儿露西亚心地温柔，看着这一切，心里十分难过。她深爱父亲，也是彼得一生最大的安慰。
        - id: ch02-b08
          speaker: narrator
          text: 彼得在客店里听牧羊人讲财宝时，想的正是女儿。为了她，他决定去寻宝。人还没离开扶手椅，整个计划已经想好了。他满心欢喜地踏上归途，这样的希望，他已经多年没有感受过。可走到半路，他才想起自己还没有开锁草。
        - id: ch02-b09
          speaker: narrator
          text: 彼得只好偷偷溜回家，躺到硬草褥上，整夜都睡不着。天一亮，他就把寻宝的每一步都仔细写下来。看着白纸黑字，他终于安下心。自己顶多再替妻子苦干一个冬天，以后就再也不用踏上去磨坊的路了。
        - id: ch02-b10
          speaker: narrator
          text: 没过多久，伊尔泽一边做家务，一边照例责骂女儿。她猛地撞开房门，对着正在穿衣的彼得勃然大骂。
        - id: ch02-b11
          speaker: ilse
          text: 好啊，你这个酒鬼！是不是喝了整整一夜，还把从我家用钱里偷的那点钱全糟蹋光了？你还知道羞耻吗？
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: 彼得早就听惯了。他等这场暴风雨刮过去，才平平静静地回答。
        - id: ch02-b13
          speaker: peter
          text: 亲爱的妻子，别生气。我手里正有一桩好买卖，说不定能让咱们转转运。
          emotion: calm
        - id: ch02-b14
          speaker: ilse
          text: 你也配说好买卖？除了吹牛说大话，你还能有什么用！
          emotion: angry
        - id: ch02-b15
          speaker: peter
          text: 我这是在立遗嘱。等我该走的时候到了，家里的事也好有个安排。
        - id: ch02-b16
          speaker: narrator
          text: 这句话刺痛了露西亚的心。她整夜都梦见一座新挖开的坟，忍不住放声大哭。伊尔泽却只顾继续叫骂。
        - id: ch02-b17
          speaker: ilse
          text: 混账！家里的钱都让你败光了，你居然还有脸说立遗嘱！
          emotion: angry
        - id: ch02-b18
          speaker: narrator
          text: 她像发狂一样扑上去，差点把丈夫的眼睛抓瞎。吵闹过后，日子又照旧往前走。从那天起，露西亚偷偷给父亲的每一分钱，彼得都收好。他用这些钱请熟识的男孩子去找黑啄木鸟的巢。
    - id: ch03
      title: 开锁草
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 男孩们被派到田野和森林里，却不肯认真找。他们一会儿领着彼得翻山越岭，跑几英里去看一窝渡鸦，一会儿又叫他扒开树洞，看里面的松鼠窝。彼得一发火，他们就当面大笑，转身跑掉。
        - id: ch03-b02
          speaker: narrator
          text: 过了很久，终于有个男孩在草地的斑鸠群中发现一只啄木鸟，又在一棵半枯的桤木里找到它的巢。他赶紧跑去把消息告诉彼得。彼得简直不敢相信自己会有这样的好运，连忙亲自赶去查验。到了树下，他果然看见一只鸟不停地飞进飞出，看样子，它的确在树洞里筑了巢。
        - id: ch03-b03
          speaker: narrator
          text: 彼得高兴极了，马上开始找红斗篷。偏偏全镇只有一件，它属于刀斧手哈默林师傅。谁都不愿求到这样的人门上，彼得心里也挣扎了很久。可他没有别的办法，只能去开口借。哈默林见这样体面的人居然来借自己的行刑礼袍，反倒觉得十分光彩，痛痛快快地答应了。
        - id: ch03-b04
          speaker: narrator
          text: 彼得总算凑齐了所需的一切。他先把鸟巢入口堵住，再躲到树后等待。后面发生的事，跟布莱兹预言的一模一样。啄木鸟衔着草根飞了回来。它用草根打开鸟巢时，彼得立刻从树后冲出，灵巧地展开火红的斗篷。鸟儿果然受了惊，把草根丢到了一眼就能看见的地方。彼得计划的每一步都成功了。
        - id: ch03-b05
          speaker: narrator
          text: 彼得的计划全都成功了。他真的把魔草握在了手里。这株小小的草，就是能打开一切门锁的万能钥匙，还能给主人带来从未听说过的好运。现在，彼得的心里只剩下那座藏宝山。他不声不响地为旅程做起准备。到出发时，他只带上一根手杖、一只结实的口袋，还有女儿露西亚送给他的一只小盒子。
    - id: ch04
      title: 空了的壁橱
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 彼得选定出发的那天，露西亚和母亲一早进城，留他看家。他刚要动身，忽然想先试试开锁草的本领。伊尔泽的房间里有一只坚固的壁橱，上面足足有七把锁。她把所有积蓄都藏在里面，钥匙却从不离开自己的脖子。彼得无权过问家里的钱，连里面有什么都不知道。
        - id: ch04-b02
          speaker: narrator
          text: 他把魔草靠近锁眼，惊讶地听见七把锁一起吱嘎作响，自己转动起来。柜门猛然弹开，里面露出伊尔泽贪心积攒的一堆金币。彼得呆呆站在原地，一时分不清，自己更该为意外发现这座秘密宝库高兴，还是更该为魔草果真有神力高兴。最后，他想起出发的时辰已经到了，便把金币装满口袋，小心锁好空柜，一刻也不再耽搁，离开了家。
        - id: ch04-b03
          speaker: narrator
          text: 母女俩回来时，发现房门紧锁，彼得又不见了，心里都觉得十分奇怪。她们在门外又敲又喊，屋里却只有家猫在动弹。到最后，她们只得请来铁匠打开房门。母女俩从阁楼一路搜到地窖，每个角落都找遍了，还是没有彼得的影子。
        - id: ch04-b04
          speaker: ilse
          text: 谁知道呢？那个混账说不定大清早就躲到哪家酒馆里偷懒去了！
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 伊尔泽忽然想到壁橱，这个念头把她吓了一跳。她赶紧伸手摸向脖子。难道钥匙落到了没用的丈夫手里，他已经私自取走她的财宝？不，钥匙还好好地待在老地方，壁橱看起来也一点没动过。正午过了，接着是傍晚，后来连午夜也过了，彼得还是没有回来。这时，事情终于变得严重了。伊尔泽很清楚自己平时怎样折磨丈夫，悔恨让她生出了一个又一个阴沉的猜想。
        - id: ch04-b06
          speaker: ilse
          text: 露西亚，我真怕你父亲做了傻事，害了自己的性命。
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: 母女俩流着泪，胡思乱想地坐到天亮。第二天，她们又搜遍全屋，连墙上每一枚钉子、每一道房梁都不放过。幸好彼得没有吊在任何地方。邻居们又拿着长竿，到每条水沟和每个池塘里打捞，仍旧一无所获。
        - id: ch04-b08
          speaker: narrator
          text: 伊尔泽认定再也见不到丈夫了。她很快就安慰好自己，只发愁以后谁来把一袋袋谷物送到磨坊。她决定买一头强壮的驴来干这份活。挑好驴以后，她跟主人来回讨价还价，最后谈妥了价钱。她走到壁橱前去取钱，却看见每一层架子都空空荡荡。这一下，她该是什么心情！伊尔泽茫然地站了一会儿，随后发出一阵骇人的狂叫。
        - id: ch04-b09
          speaker: narrator
          text: 露西亚吓得赶紧跑来，听说金币不见了，反而从心底高兴起来。她不再担心父亲遭遇不测。她明白，父亲一定是走向外面的世界，想用一种新法子试试运气。
    - id: ch05
      title: 富有的求婚人
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 大约一个月后，有人敲响伊尔泽家的门。她以为是来买面粉的客人，开门却看见一位英俊青年。他穿得像公爵的儿子，彬彬有礼地问好，又像多年的老朋友一样，问起她美丽的女儿。伊尔泽怎么也想不起来，自己在哪里见过他。
        - id: ch05-b02
          speaker: narrator
          text: 她还是请青年进屋坐下。青年神神秘秘地说，他听说露西亚针线手艺精巧，有件活想托给她。一个年轻陌生人登门求见漂亮姑娘，所谓的活儿究竟是什么，伊尔泽心里自有猜测。只要两人在她眼皮底下见面，她倒不反对，便叫来了女儿。
        - id: ch05-b03
          speaker: narrator
          text: 露西亚放下手中的活，顺从地走过来。一看见陌生人，她突然停下，红着脸垂下眼睛。青年深情地望着她，伸手握住她的手。露西亚想把手抽回来。
        - id: ch05-b04
          speaker: lucia
          text: 弗里德林，怎么是你？我还以为你在几百里外呢。你又是来让我伤心的吗？
          emotion: surprised
        - id: ch05-b05
          speaker: friedlin
          text: 不，我最亲爱的姑娘。我这次是来让你幸福，也让我自己幸福。我们分别后，我的命运全变了。我不再是那个身无分文的流浪汉。我那位富有的叔父去世，给我留下数不尽的钱财。现在，我终于敢站在你母亲面前，请她把你嫁给我。我知道自己爱你。如果你也能爱我，我就是世上最幸福的人。
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: 弗里德林说话时，露西亚羞怯地抬起那双漂亮的蓝眼睛。她红润的唇边露出笑意，又偷偷看向母亲，想知道母亲怎么看这件事。伊尔泽惊得说不出话。她敢发誓，女儿从没离开过自己的视线。可女儿怎么会早就认识这个英俊陌生人，还显然一心想当他的新娘？
        - id: ch05-b07
          speaker: narrator
          text: 伊尔泽还没看明白，急性子的求婚人已经替自己铺好了路。他把闪亮的金币铺满桌子，当作送给新娘母亲的礼物，又把露西亚的围裙也装得满满的。伊尔泽再没有异议，婚事很快定了下来。她忙着收起金币，藏到稳妥的地方。一对恋人则靠在一起悄声说话。不知弗里德林说了什么，露西亚听得越来越欢喜，也越来越安心。
        - id: ch05-b08
          speaker: narrator
          text: 屋里顿时忙得天翻地覆，婚礼的各样准备一下子都快了起来。几天后，一辆载得沉甸甸的马车停在门前，从车上卸下数不清的箱笼和包裹。伊尔泽看到未来女婿竟然这样富有，惊得目瞪口呆。婚期很快选定，所有亲朋邻里也全都收到邀请，等着来参加婚宴。露西亚试戴新娘花冠时，却想起了父亲。
        - id: ch05-b09
          speaker: lucia
          text: 要是彼得爸爸能牵着我走进教堂，我才会真心喜欢这顶花冠。我多希望他能回来！我们现在这么富，他却可能守着空桌子挨饿，连一口吃的都没有。
          emotion: sad
        - id: ch05-b10
          speaker: narrator
          text: 露西亚想着想着，便流下眼泪。就连伊尔泽也开了口。
        - id: ch05-b11
          speaker: ilse
          text: 他要是回来，我倒也不反对。家里少了个男人，总觉得缺了点什么。
        - id: ch05-b12
          speaker: narrator
          text: 其实，她只是越来越受不了家里没人可骂的日子。那么，后来发生了什么呢？
    - id: ch06
      title: 铁钉桶的主人
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 婚礼前夜，一个男人推着独轮车来到城门。车上放着一只装满铁钉的大桶。他替这桶货交过入城税，便一直推到新娘家门口，敲响了门。露西亚亲自从窗口探出头，想看清来人是谁。站在门外的，竟是彼得爸爸。
        - id: ch06-b02
          speaker: narrator
          text: 屋里立刻欢声一片。露西亚飞奔出去，一把抱住父亲。连伊尔泽也伸手欢迎他，只是想起那只空壁橱时，还是忍不住说了一句。
        - id: ch06-b03
          speaker: ilse
          text: 你这个坏东西，以后可得学好了。
        - id: ch06-b04
          speaker: narrator
          text: 彼得向新郎问好，一双眼睛却精明地把他从头到脚打量了一遍。母女俩赶紧把自己知道的一切好话全说出来，又把富有新郎带来的礼物说给他听。彼得听完，似乎对这个女婿很满意。伊尔泽给丈夫端来饭菜，又迫不及待地想听他离家以后的经历，一再追问他当初为什么不告而别。
        - id: ch06-b05
          speaker: peter
          text: 愿上帝保佑我的故乡。我走了许多地方，什么活都试过。如今总算在铁器行里找到一份营生，不过到现在，我花进去的钱比赚来的还多。这桶铁钉就是我全部的家当了。我想把它送给新娘，算是我替她凑的一份家具钱。
        - id: ch06-b06
          speaker: narrator
          text: 伊尔泽一听，顿时火冒三丈。她扯着尖嗓子责骂，吵得旁人耳朵都快聋了。弗里德林赶紧说，彼得师傅以后可以跟自己和露西亚同住。他保证岳父会过得舒适，永远受到欢迎。
        - id: ch06-b07
          speaker: narrator
          text: 露西亚总算如愿以偿。第二天，彼得爸爸亲手牵着她走进教堂，婚礼办得十分美满。不久，小夫妻搬进弗里德林买下的一座漂亮房子。那里有花园、草地和鱼塘，还有一座长满葡萄藤的小山。他们每天都过得幸福无比。彼得爸爸也安安静静地跟他们住在一起，从此再也不必受伊尔泽的气。
        - id: ch06-b08
          speaker: narrator
          text: 人人都以为，彼得靠富有的女婿慷慨供养。谁也没有想到，那桶铁钉才是真正的丰饶之角。眼前这一切富足，都是从桶里涌出来的。
    - id: ch07
      title: 财宝的真相
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 原来，彼得矒过所有人，顺利走到了藏宝山。他一路游玩，并不着急，慢慢走了很久，才找到山谷里的那条小溪。为了找到它，他着实费了一番周折。之后，他再也等不及了，顺着路线急急赶路，很快发现了林中那个小土坑。
        - id: ch07-b02
          speaker: narrator
          text: 彼得钻进土里，像鼹鼠一样不停挖掘。开锁草发挥了神力，财宝终于出现在他眼前。他兴高采烈地往口袋里装金子，一直装到自己能背动的分量。然后，他带着满心的希望和欢喜，摇摇晃晃地爬上七十七级台阶。
        - id: ch07-b03
          speaker: narrator
          text: 彼得不敢全信山精说的平安无事。他只想尽快重见天日，根本顾不上朝左右多看一眼。到后来，他甚至记不得墙壁和柱子上究竟有没有珠宝在闪光。不过，一切都很顺利。他没看见、也没听见任何可怕的东西。
        - id: ch07-b04
          speaker: narrator
          text: 唯一的意外是，彼得刚走出铁条加固的大门，门就轰然关上。他这才想起，开锁草被落在了里面，自己再也回不去，也不可能取第二袋财宝了。但这件事没叫他烦恼多久。已经得到的财富，足够让他心满意足。
        - id: ch07-b05
          speaker: narrator
          text: 他忠忠实实地照马丁老爹的吩咐，把松土填回坑里，再仔细压实。随后，他坐下来琢磨，怎样才能把财宝带回故乡，尽情享用，又不用分给爱骂人的妻子。伊尔泽一旦知道真相，一定不会让他有片刻安宁。他苦想很久，终于有了办法。
        - id: ch07-b06
          speaker: narrator
          text: 彼得把沉重的钱袋背到最近的村庄，买了一辆独轮车、一只结实的大桶和许多铁钉。他把金子全都装进桶里，上面再严严实实地盖上一层钉子。桶实在太沉，他费了好大力气，才总算把它抬上独轮车。他推着车走上归途，半路遇见一位英俊青年。那人一路垂头丧气，看起来像在受着极大的折磨。彼得爸爸巴不得所有人都跟自己一样快活，便兴冲冲地向他问好，又问他打算到哪里去。
        - id: ch07-b07
          speaker: friedlin
          text: 去这广阔的世界吧，好心的大叔。也可能离开这个世界。双脚把我带到哪里，我就去哪里。
          emotion: sad
        - id: ch07-b08
          speaker: peter
          text: 为什么要离开这个世界？它到底把你怎么了？
        - id: ch07-b09
          speaker: friedlin
          text: 它没把我怎么样，我也没把它怎么样。可这世上，已经没有任何东西值得我留下了。
          emotion: sad
        - id: ch07-b10
          speaker: narrator
          text: 彼得使劲开解青年，还请他到前面遇见的第一家客店吃晚饭。他以为陌生人只是因为又穷又饿才如此忧愁。可美食端到眼前，青年像是连吃饭都忘了。彼得这才看出，他害的是心病，便温和地请他讲讲自己的故事。
        - id: ch07-b11
          speaker: friedlin
          text: 讲出来又有什么用，大叔？你既帮不了我，也安慰不了我。
          emotion: sad
        - id: ch07-b12
          speaker: peter
          text: 这可未必。说不定，我真能替你做点什么。人这一生啊，救星常常会从最想不到的地方出现。
        - id: ch07-b13
          speaker: narrator
          text: 青年受到鼓励，终于开口了。
        - id: ch07-b14
          speaker: friedlin
          text: 我是一名弩手，侍奉一位高贵的伯爵，从小就在他的城堡里长大。不久前，主人旅行归来，带回许多珍宝，其中有一幅美丽姑娘的画像。她看起来那么温柔可爱，我只看了一眼，心就丢在她那里了。从此，我每天想的都是怎样找到她，娶她为妻。
        - id: ch07-b15
          speaker: friedlin
          text: 伯爵告诉过我她的名字和住处，却嘲笑我的爱情，说什么也不许我去找她。我只好在夜里逃出城堡。我很快来到她住的小镇，却又遇到难题。她母亲看管得极严，不准她从窗口探头，也不准她独自出门。我根本没办法认识她。
        - id: ch07-b16
          speaker: friedlin
          text: 后来，我把自己打扮成一个老太太，壮着胆子敲响她家的门。开门的正是那位可爱的姑娘。她让我着了迷，我差点忘记自己还在伪装。幸好我及时醒过神，请她给我绣一块精美的桌布，因为方圆各地都在传说她的好手艺。从那以后，我就能借着查看活儿做得怎样，常常去看她。
        - id: ch07-b17
          speaker: friedlin
          text: 有一天，她母亲进城了。我终于鼓起勇气，脱下伪装，把心里的爱意都告诉她。她起初吓了一跳，但我求她先听我说完。很快，我就看出她并不讨厌我。她只是温和地怪我不该违抗主人，也不该伪装身份骗她。
        - id: ch07-b18
          speaker: friedlin
          text: 后来，我求她嫁给我。她伤心地说，她母亲绝对看不起一个身无分文的求婚人，还求我立刻离开，免得灾祸落到她身上。既然她这样吩咐，我再痛苦，也只能走。从那天起，我四处漂泊，悲伤一直在啃噬我的心。一个没有主人、没有金钱、也没有财产的人，怎么可能娶到美丽的露西亚呢？
          emotion: sad
        - id: ch07-b19
          speaker: narrator
          text: 彼得一直专心听着。一听见女儿的名字，他立刻竖起耳朵。没费多少力气，他就弄明白了。这个青年深爱的姑娘，果然就是露西亚。
        - id: ch07-b20
          speaker: peter
          text: 你的故事倒真离奇。可那姑娘的父亲在哪里？你为什么不去向他求婚？说不定，他愿意站在你这边，也会很乐意有你这样的女婿。
        - id: ch07-b21
          speaker: friedlin
          text: 唉！她父亲是个到处游荡的没用家伙。他丢下妻子和女儿，跑到谁也不知道的地方去了。她母亲一天到晚痛骂他。每次我亲爱的姑娘替父亲说话，连她也会挨骂。
        - id: ch07-b22
          speaker: narrator
          text: 彼得听了觉得颇为好笑。不过，他很喜欢这个青年，也看出对方正是自己需要的帮手。有了弗里德林，他就能安安稳稳地享用财富，又不用离开心爱的女儿。
        - id: ch07-b23
          speaker: peter
          text: 只要你肯听我的劝，我保证你能娶到自己深爱的姑娘，而且用不了几天。
        - id: ch07-b24
          speaker: friedlin
          text: 伙计！嘲弄一个不幸的人，可不是好汉做的事。你还是去找另一个愿意上当的傻瓜，讲你这些漂亮许诺吧！
          emotion: angry
        - id: ch07-b25
          speaker: narrator
          text: 弗里德林以为彼得只在戏弄自己，猛地站起身，急匆匆地要走。彼得一把抓住他的胳膊。
        - id: ch07-b26
          speaker: peter
          text: 站住，你这个急性子！我没有开玩笑。我说过能办到，就一定能办到。
          emotion: angry
        - id: ch07-b27
          speaker: narrator
          text: 彼得把铁钉下面的财宝露给青年看，又把计划告诉他。弗里德林要扮成富有的女婿，严严守住这个秘密。这样，他们便能一起平平安安地享用财富。命运突然转了弯，弗里德林欢喜得不知该怎样感谢彼得的慷慨。
        - id: ch07-b28
          speaker: narrator
          text: 第二天黎明，两人重新上路，很快来到一座城镇。弗里德林在那里置办了求婚所需的华服和行头，让自己看起来真像一位富贵人家的少爷。彼得又把聘礼需要的金币装满他的口袋，跟他约好，一切谈妥后，就悄悄送个口信来。彼得收到消息，便会送去一马车家具用品，让这位富有的新郎在新娘居住的小镇上好好风光一回。
        - id: ch07-b29
          speaker: narrator
          text: 分别时，彼得最后叮嘱弗里德林，一定要严守秘密。就连露西亚也不能告诉，必须等她真的成了弗里德林的妻子，才能说出真相。
        - id: ch07-b30
          speaker: narrator
          text: 彼得师傅享用了许多年藏宝山带来的好处，关于财宝的真正消息始终没有走漏。到了晚年，他的家业大得连自己也不知道究竟有多少财富，可所有人仍然以为，那些钱全是弗里德林的。弗里德林和他心爱的妻子一生幸福和睦，两个人在镇上一直备受尊敬。
        - id: ch07-b31
          speaker: narrator
          text: 直到今天，镇上的人想形容一个富翁，还是会说，他富得就像彼得·布洛赫的女婿！
