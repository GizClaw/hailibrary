  chapters:
    - id: ch01
      title: Father Martin's Midnight Visitor
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a little town stood among high hills and wild forests. One night, a group of shepherds gathered together in the warm kitchen of its inn. As the evening passed, they remembered the old days. Each man told of the strange things that had happened to him when he was young, and one adventure followed another around the room. After listening to them all, silver-haired Father Martin leaned forward and spoke.
        - id: ch01-b02
          speaker: father_martin
          text: Friends, you have certainly known wonderful adventures. But I can tell you of something even more astonishing that happened to me. When I was a young boy, I had no home and not one person to care for me. With my knapsack strapped across my back, I wandered alone from one village to the next, traveling through the whole country. As soon as I was old enough to work, I entered the service of a shepherd in the mountains. I stayed there and helped him tend his flock for three full years.
        - id: ch01-b03
          speaker: father_martin
          text: One autumn evening, as we drove the flock homeward, we counted the animals and discovered that ten sheep were missing. My master ordered me to go back and search for them in the forest. I took my dog and pushed among the bushes, but he could not find a scent or any other trace. We searched until night covered the woods. I did not know that part of the country, and in the darkness I could no longer find the path home. There was nothing to do but choose a place beneath a tree and sleep until morning.
        - id: ch01-b04
          speaker: father_martin
          text: At midnight my dog began to whine. He crept close with his tail between his legs, and I knew something was wrong. In the bright moonlight, I saw a figure beside me. He looked like a man, but shaggy hair covered him, and his long beard hung to his knees. A garland circled his head, oak leaves formed his belt, and he held an uprooted fir tree in one hand. I shook like an aspen leaf, and fear went through my very spirit.
        - id: ch01-b05
          speaker: father_martin
          text: He beckoned for me to follow. I could not move.
        - id: ch01-b06
          speaker: treasure_seeker
          text: Take courage, you faint-hearted shepherd. I am the Treasure Seeker of this mountain. Come with me, and you shall dig up a great store of gold.
        - id: ch01-b07
          speaker: father_martin
          text: I was still cold with terror, but I managed to answer him.
        - id: ch01-b08
          speaker: father_martin
          text: Get away from me, evil spirit. I want none of your treasure.
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: The specter grinned in his face and mocked him.
        - id: ch01-b10
          speaker: treasure_seeker
          text: Fool! Would you throw away your good fortune? Then stay a ragged beggar for the rest of your days.
        - id: ch01-b11
          speaker: narrator
          text: He turned as though he would leave, but came back.
        - id: ch01-b12
          speaker: treasure_seeker
          text: Think again, rogue. Think carefully. I will fill your knapsack and your pouch as well.
        - id: ch01-b13
          speaker: father_martin
          text: Away with you, monster. I will have nothing to do with you.
        - id: ch01-b14
          speaker: treasure_seeker
          text: One day you will regret this.
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: The apparition looked sadly at Martin. Then he raised his voice once more.
        - id: ch01-b16
          speaker: treasure_seeker
          text: Listen closely and remember what I tell you. It may help when you come to your senses. Deep beneath the earth lies a vast treasure of gold and precious stones. It is hidden at twilight and at noon, but at midnight it can be dug up. I have guarded it for seven hundred years, and now my time is over. The treasure belongs to anyone who can find it. I meant to place it in your hands because you graze your flock on my mountain.
        - id: ch01-b17
          speaker: father_martin
          text: Then he told me exactly where it was and how to reach it. I remember every word as though he spoke only yesterday.
        - id: ch01-b18
          speaker: treasure_seeker
          text: Travel toward the little mountains and ask everyone you meet for the Black King's Valley. Once you reach it, look for a tiny brook. Follow the water until it brings you to a stone bridge beside a sawmill. Do not cross that bridge. Turn to the right and keep walking along the bank. In time, a high rock will rise directly before you. Measure about one bowshot from that rock, and you will discover a small hollow in the ground. It looks almost like a grave.
        - id: ch01-b19
          speaker: treasure_seeker
          text: Dig out that hollow. Do not expect easy work, because someone pressed the soil down with great care. Keep at it, however hard the earth becomes. When your digging reaches solid rock on every side, search the wall in front of you. Before long, you will uncover a square slab of stone. Force that slab out of its place. Behind it you will find the entrance to the treasure house.
        - id: ch01-b20
          speaker: treasure_seeker
          text: The opening will be low, so you must crawl through it with a lamp held between your teeth. Keep both hands free to steady yourself. The way slopes sharply, and jagged stones lie everywhere. Without your hands, you may strike your nose against one. If the rocks bruise your knees, pay no attention. You are on the road to fortune. Crawl on without resting until the narrow way opens onto a broad stairway. Go down those stairs. They will lead you into a spacious hall with three doors. The door on either side stands open, but the middle one is secured with iron locks and heavy bolts.
        - id: ch01-b21
          speaker: treasure_seeker
          text: Do not enter the open door on your right. The bones of the old lords of the treasure rest beyond it, and you must not disturb them. Keep away from the open door on your left as well. That passage leads to the snakes' chamber, where adders and serpents make their home. Your path is through the locked middle door. Only the well-known spring-root can open it, so you must not forget to bring one. No crowbar or ordinary human tool can help you there. If you need the root, ask a seller of firewood. Hunters often have use for such a thing, and it is not considered difficult to find.
        - id: ch01-b22
          speaker: treasure_seeker
          text: Hold the spring-root against the door. It may burst open all at once with terrible cracking and groaning, but do not be frightened. That noise comes from the root's magic, and it cannot hurt you. Before you go farther, trim your lamp so it will not fail. Gold and precious stones cover the walls and pillars of the vault. Their glitter will strike your eyes so brightly that you can hardly see. Yet you must not reach toward a single jewel. In the center of the cavern stands a copper chest. Look inside that chest. There you will find gold and silver in abundance, with enough to spare.
        - id: ch01-b23
          speaker: treasure_seeker
          text: Help yourself from the chest until you have as much as you can carry. One full load will be enough to support you for the rest of your life, but you are permitted to return three times. Take warning, though. Never venture into that place a fourth time. You would make the journey for nothing, and your greed would be punished. You would fall down the stone stairway and break your leg. Whenever you leave the treasure house, do not neglect the final task. Heap all the loose earth back into the hollow so that the entrance is hidden once more.
        - id: ch01-b24
          speaker: father_martin
          text: When he stopped, my dog raised his ears and barked. Far away, I heard a cart rolling and a driver cracking his whip. I looked around, and the specter had vanished.
        - id: ch01-b25
          speaker: narrator
          text: That ended Father Martin's tale. The landlord had listened with everyone else, and now he asked a careful question.
        - id: ch01-b26
          speaker: landlord
          text: Well, Father Martin, did you climb the mountain and find the treasure he promised? Or was the whole thing only a story?
        - id: ch01-b27
          speaker: father_martin
          text: No, no. I cannot say whether the specter lied, because I never took one step toward that hollow. I had two reasons. My neck was too precious to risk in such a trap, and no one could tell me where to find the spring-root.

    - id: ch02
      title: The Secret of the Spring-Root
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Another old shepherd, Blaize, spoke up.
        - id: ch02-b02
          speaker: blaize
          text: What a pity your secret grew old with you, Father Martin. If you had told us forty years ago, you would not have lacked a spring-root for long. You will never climb that mountain now, but I can still tell you how to find one, for the joke of it.
        - id: ch02-b03
          speaker: blaize
          text: The easiest way is to make a black woodpecker help you. In spring, watch until you find the hole where one has built her nest. Wait until her young are old enough to be almost ready to fly. Then press a hard piece of turf firmly across the mouth of the hole. Hide yourself behind the tree and stay there until the mother bird comes back to feed her nestlings.
        - id: ch02-b04
          speaker: blaize
          text: When she discovers that she cannot enter the nest, she will fly around the trunk crying in distress. After a while, she will suddenly dart away toward the setting sun. As soon as you see her go, prepare a scarlet cloak. If you do not own one, buy several yards of bright scarlet cloth. Carry it to the tree and be sure you arrive before the woodpecker comes back with the spring-root held in her beak.
        - id: ch02-b05
          speaker: blaize
          text: Watch closely. The instant she touches the turf with the root, the hard plug will fly violently from the hole. That is your moment. Spread the red cloth quickly beneath the tree. The woodpecker will think the scarlet color is a fire. In her terror, she will drop the root, and you can pick it up. Some people truly light a fire and scatter spikenard blossoms into the flames, but that is a clumsy method. Unless the fire shoots up at exactly the right instant, the woodpecker escapes with the root still in her possession.
        - id: ch02-b06
          speaker: narrator
          text: Everyone had listened closely, but it was late now. One by one the shepherds went home. They left behind a single man who had spent the whole evening unnoticed in a corner.
        - id: ch02-b07
          speaker: narrator
          text: His name was Master Peter Bloch. Once he had owned a prosperous inn and worked as a master cook. In those days, he was famous throughout the town. No other cook could match his fish jelly, his quince fritters, or even his delicate wafer cakes. When he prepared a boar's head for a feast, he gilded its ears. Yet his fortunes had steadily declined, and now the former innkeeper and master cook was very poor.
        - id: ch02-b08
          speaker: narrator
          text: Peter had once been a merry fellow who loved a joke. Early in life, he decided it was time to find a wife. Unluckily, he chose Ilse, whose vicious tongue was well known through the town. Everyone hated her. Young people would gladly walk miles around rather than meet her, because she kept a hurtful word ready for every person who crossed her path. Peter, however, let himself be fooled by all her boasting about her skill as a housewife. Ilse leaped at his offer of marriage, and they were married the following day.
        - id: ch02-b09
          speaker: narrator
          text: They had not even reached home before the quarrels began. In the happiness of his wedding day, Peter had sampled his own good wine rather freely. His new bride hung upon his arm as they walked. Peter stumbled, fell to the ground, and dragged Ilse down beside him. She answered by beating him soundly. The neighbors watched and said, quite correctly, that Master Peter's future comfort did not look promising.
        - id: ch02-b10
          speaker: narrator
          text: In time, children blessed the badly matched couple, but each happiness was short. Ilse's savage, quarrelsome temper seemed to wither the little ones from their first days. One after another, they died like young goats in a freezing winter. Master Peter did not possess a great fortune to leave his children, but it was still a sorrow to find himself childless. Whenever he laid another baby in the grave, he mourned to his friends.
        - id: ch02-b11
          speaker: peter
          text: The lightning has struck the cherry blossoms again. There will be no fruit left to ripen.
          emotion: sad
        - id: ch02-b12
          speaker: narrator
          text: At last they had a daughter named Lucia. She was so strong and healthy that neither her mother's temper nor her father's spoiling stopped her from growing tall and beautiful.
        - id: ch02-b13
          speaker: narrator
          text: While Lucia grew, the family's fortunes changed. Peter had hated difficulty and hard effort from the time he was young. Whenever he had money, he spent it with an open hand. If a hungry person came asking for bread, Peter fed that person. When his own pockets were empty, he borrowed from the neighbors, always taking great care to keep his scolding wife from discovering the loans. His favorite saying was that everything would come right in the end. But the thing that finally came was Master Peter's ruin.
        - id: ch02-b14
          speaker: narrator
          text: Peter reached the end of his wits trying to find an honest way to live. No matter what work he attempted, bad luck seemed to chase him. He lost one position and then another, until the only task left was carrying Ilse's sacks of grain to the mill. If he took too long, she scolded him severely. Even when the work was done, she resented giving him his share of the food. Pretty Lucia saw all of this. She loved her father dearly, and her tender heart ached for him. In return, she became the great comfort of his life.
        - id: ch02-b15
          speaker: narrator
          text: As Peter sat in the inn kitchen, he thought of Lucia and listened to the talk of buried treasure. For her sake, he decided to seek it. Before he rose from the landlord's chair, his plan was ready. He walked home feeling happier and more hopeful than he had in years.
        - id: ch02-b16
          speaker: narrator
          text: Then he remembered the spring-root. He did not have one. His hope fell away, and he slipped into the house with a heavy heart. On his hard straw bed, he could neither rest nor sleep.
        - id: ch02-b17
          speaker: narrator
          text: The moment daylight came, Peter rose and carefully wrote down every direction for finding the treasure. He wanted the whole business set plainly before his eyes so that no important detail could slip from his memory. The written plan gave him courage. He still had to do rough work for Ilse through one more winter, at least, but when that winter ended, the weary path to the mill would no longer be the road of his whole life.
        - id: ch02-b18
          speaker: narrator
          text: Soon Ilse began her morning song, which meant scolding Lucia while she worked. She flung open Peter's door before he had finished dressing.
        - id: ch02-b19
          speaker: ilse
          text: Well, drunkard! Have you wasted the whole night drinking with money stolen from my housekeeping? You ought to be ashamed!
          emotion: angry
        - id: ch02-b20
          speaker: narrator
          text: Peter knew this kind of storm. He waited quietly until it passed.
        - id: ch02-b21
          speaker: peter
          text: Please do not trouble yourself, dear wife. I have a promising piece of business in hand. It may turn out very well for us.
        - id: ch02-b22
          speaker: ilse
          text: You, with promising business? You are useful for nothing but talk!
          emotion: angry
        - id: ch02-b23
          speaker: peter
          text: I am writing my will, so my affairs will be settled when my final hour comes.
        - id: ch02-b24
          speaker: narrator
          text: Those words pierced Lucia's heart. All night she had dreamed of a newly dug grave. Now she began to wail. Ilse had a different answer.
        - id: ch02-b25
          speaker: ilse
          text: Miserable man! You have wasted everything we owned, and now you speak of making a will?
          emotion: angry
        - id: ch02-b26
          speaker: narrator
          text: She seized him furiously and tried to scratch his eyes. In time, the quarrel was mended, and life continued as before.
        - id: ch02-b27
          speaker: narrator
          text: From that day onward, Peter saved every penny that Lucia secretly slipped into his hand. He used the coins to bribe boys he knew and sent them through the woods and fields to search for a black woodpecker's nest. The boys found the game of tricking him much more amusing than the search. They led him for miles over hill and valley, across stones and fallen trunks, only to show him a raven's brood or a family of squirrels in a hollow tree. When Peter discovered the trick and lost his temper, they laughed directly in his face and raced away.
        - id: ch02-b28
          speaker: narrator
          text: At last one boy spotted a woodpecker among the wood pigeons in the meadows. He found her nest in a half-dead alder and raced to tell Peter. Peter could hardly believe his luck. He hurried there and saw the bird flying in and out of the hole. It was true.
        - id: ch02-b29
          speaker: narrator
          text: Now he needed a red cloak. There was only one in town, and it belonged to Master Hammerling, the hangman, a man no one willingly asked for favors. Peter struggled with himself before making the visit, but he had no choice. The hangman felt flattered that a respectable man wanted his official robe, and gladly lent it.
        - id: ch02-b30
          speaker: narrator
          text: Peter blocked the nest and hid behind the tree. Everything happened exactly as Blaize had said. The woodpecker returned with the spring-root. Peter sprang out and opened the fiery red cloak so cleverly that the frightened bird dropped the root where he could see it.
        - id: ch02-b31
          speaker: narrator
          text: At last he held the magic root, the master key that could open every door and bring unheard-of luck. He secretly prepared for the mountain, taking only a staff, a strong sack, and a little box Lucia had given him.

    - id: ch03
      title: Peter Leaves Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On the very day Peter had chosen for his journey, Lucia and her mother left early for town. They told him to remain behind and guard the house. Even that could not change his purpose. He was already on the point of leaving when another thought occurred to him. Before trusting his life to the famous spring-root, he ought to test its highly praised power for himself.
        - id: ch03-b02
          speaker: narrator
          text: A strong cupboard had been built into the wall of Ilse's room. Seven separate locks guarded it. Inside, she kept every coin she had managed to save, while the only key remained hanging around her neck day and night. Peter had no control whatever over the household money. He did not even know how much this secret hoard contained. With Ilse away, he could test the root and satisfy his curiosity at the same time.
        - id: ch03-b03
          speaker: narrator
          text: Peter held the magic root against the keyhole. To his astonishment, he heard all seven locks begin to creak. One after another, they turned by themselves. Then the heavy door suddenly flew wide open. On the shelves before him lay his greedy wife's whole store of gold pieces. Peter stood perfectly still in amazement. He could not decide which discovery gave him greater joy, the unexpected gold or the certain proof that the magic root truly worked.
        - id: ch03-b04
          speaker: narrator
          text: Then he remembered the hour. He filled his pockets with the coins, carefully locked the empty cupboard, and left the house at once.
        - id: ch03-b05
          speaker: narrator
          text: When Ilse and Lucia returned, they found the house door firmly shut and Peter nowhere in sight. They knocked, called his name, and listened. Nothing moved inside except the house cat. At last they fetched the blacksmith and made him open the door. Mother and daughter went through the whole building, searching every room from the attic down to the cellar, but Master Peter had disappeared.
        - id: ch03-b06
          speaker: ilse
          text: Who knows where the wretch is? He may have spent the whole day loafing in some tavern.
        - id: ch03-b07
          speaker: narrator
          text: A sudden thought frightened her, and she felt for her keys. Perhaps her useless husband had taken them and helped himself to her money. But the keys hung safely in their usual place, and the cupboard looked untouched.
        - id: ch03-b08
          speaker: narrator
          text: Noon passed, then evening, then midnight, and Peter still did not return. The matter began to seem serious. Ilse knew how badly she had tormented him, and remorse filled her with dark fears.
        - id: ch03-b09
          speaker: ilse
          text: Oh, Lucia, I fear your father has harmed himself.
          emotion: fearful
        - id: ch03-b10
          speaker: narrator
          text: Mother and daughter remained awake until morning, weeping over every dreadful possibility their minds could invent. As soon as there was light, they searched the house from end to end once more. This time they studied every nail driven into a wall and every beam overhead, fearing what they might see. Fortunately for them, Master Peter was not hanging from any nail or beam.
        - id: ch03-b11
          speaker: narrator
          text: Next, the neighbors joined the search. Carrying long poles, they went from one ditch and pond to another, feeling through the water for Peter's body. They found nothing. After that, Ilse gave up the idea that she would ever see her husband again. She comforted herself remarkably soon. Before long, her chief concern was practical. With Peter gone, who would carry her heavy sacks of grain to the mill?
        - id: ch03-b12
          speaker: narrator
          text: Ilse decided that a strong donkey could take Peter's place. She found a suitable animal and bargained carefully with its owner until they agreed on a price. Then she went to the cupboard in her wall to fetch the money. The locks opened beneath her key, but every shelf beyond them was bare. For a moment, she could only stand there bewildered. Then she broke into such terrible shrieks and ravings that Lucia came running in alarm.
        - id: ch03-b13
          speaker: narrator
          text: When Lucia heard that the money had vanished, she was secretly delighted. She no longer feared that her father was dead. She understood that he must have gone into the world to seek his fortune in some new way.
        - id: ch03-b14
          speaker: narrator
          text: About a month passed. One day, someone knocked at Ilse's door, and she went to answer, expecting a customer who wanted to buy meal. Instead, a handsome young man stepped inside. His clothes were fine enough for the son of a duke. He greeted Ilse with great respect and asked after pretty Lucia in the easy manner of an old family friend. Ilse searched her memory, but she felt certain she had never laid eyes on him before.
        - id: ch03-b15
          speaker: narrator
          text: Even so, she invited him into the house and offered him a seat while he explained his business. With a great show of mystery, he asked permission to speak with fair Lucia. He claimed to have heard wonderful reports of her needlework and said he had a commission for her. Ilse formed her own opinion of the sort of commission a young stranger might bring to a pretty maiden. Still, the meeting would take place under her own watchful eye, so she raised no objection and called her industrious daughter from her work.
        - id: ch03-b16
          speaker: narrator
          text: Lucia put down her work and came obediently. The moment she saw the visitor, she stopped. Her face grew red, and she lowered her eyes. He looked at her lovingly and took her hand. She tried to pull it away.
        - id: ch03-b17
          speaker: lucia
          text: Friedlin! Why are you here? I thought you were a hundred miles away. Have you come back only to make me unhappy again?
          emotion: surprised
        - id: ch03-b18
          speaker: friedlin
          text: No, my dearest. I have come to make both of us happy. Everything has changed since we parted. I am not the poor wanderer I was. My wealthy uncle has died and left me more money and property than I need. Now I can ask your mother for your hand. I know that I love you. If you love me too, no man could be happier.
        - id: ch03-b19
          speaker: narrator
          text: While Friedlin spoke, Lucia's blue eyes slowly lifted toward him. A shy smile parted her rosy lips. Then she stole a glance at her mother to learn what Ilse thought of this astonishing offer. Ilse stood lost in amazement. She would have sworn that her daughter had never once escaped her sight. Yet Lucia was already well acquainted with this handsome stranger and, from every appearance, entirely willing to become his bride.
        - id: ch03-b20
          speaker: narrator
          text: Before Ilse had finished staring, the eager suitor smoothed his way. He spread shining gold pieces across the table as a wedding gift for the bride's mother. For good measure, he poured enough more into Lucia's apron to fill it. After seeing such generosity, Ilse found no difficulties worth mentioning. The marriage was agreed upon with remarkable speed.
        - id: ch03-b21
          speaker: narrator
          text: While Ilse gathered up the gold and hid it safely, the lovers whispered. Whatever Friedlin told Lucia made her happier with every moment.
        - id: ch03-b22
          speaker: narrator
          text: Now the quiet house filled with noise and hurry. Preparations for the wedding moved at a tremendous pace. A few days later, a heavily loaded wagon drew up outside. Servants carried in box after box and bale after bale, until Ilse could only wonder at the riches of her future son-in-law. The family chose the day of the wedding, arranged the feast, and invited all their friends and neighbors to celebrate.
        - id: ch03-b23
          speaker: narrator
          text: As Lucia tried on her bridal wreath, she spoke to her mother.
        - id: ch03-b24
          speaker: lucia
          text: I would truly love this wedding garland if Father Peter could lead me to church. If only he would come home. We have riches all around us, while he may be somewhere with nothing to eat.
          emotion: sad
        - id: ch03-b25
          speaker: narrator
          text: The thought made her cry. Even Ilse softened.
        - id: ch03-b26
          speaker: ilse
          text: I would not mind seeing him come home myself. A house always seems to be missing something when its good man is away.
        - id: ch03-b27
          speaker: narrator
          text: The truth was that she had grown tired of having no one to scold. And now, what do you think happened?

    - id: ch04
      title: The Barrel of Nails
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the very evening before the wedding, a travel-worn man came through the city gate pushing a wheelbarrow. The barrow carried a heavy barrel filled, so he said, with nails. He paid the proper toll upon that barrel, passed through the gate, and pushed his load as quickly as he could toward the bride's home. When he reached the door, he stopped and knocked.
        - id: ch04-b02
          speaker: narrator
          text: The bride herself peeped from the window to see who had arrived so late. There below her stood Father Peter. The whole house burst into rejoicing. Lucia flew down and threw her arms around him. Even Ilse held out her hand and welcomed him home. She remembered the empty treasure cupboard, of course, but this time her only scolding was brief.
        - id: ch04-b03
          speaker: ilse
          text: Rogue, you had better mend your ways.
        - id: ch04-b04
          speaker: narrator
          text: Father Peter greeted the bridegroom and looked at him shrewdly, as if judging the young man for himself. Ilse and Lucia hurried to explain everything that had happened during Peter's absence. Between them, they told all they knew in Friedlin's favor. Both mother and daughter appeared completely satisfied with the man who would soon become Peter's son-in-law.
        - id: ch04-b05
          speaker: narrator
          text: Ilse put food before her husband. Then curiosity took hold of her, and she eagerly asked why he had gone away.
        - id: ch04-b06
          speaker: peter
          text: May God bless my native town. I have marched from place to place through the country and tried my hand at every kind of work. Now, at last, I have found employment in the iron trade. I must admit that up to this moment I have put more money into the business than I have earned from it. That barrel of nails is all the fortune I possess. I wish to give it as my contribution toward furnishing the bride's new home.
        - id: ch04-b07
          speaker: narrator
          text: Peter's little speech brought Ilse's anger roaring back. She poured out reproach after reproach in a voice so shrill that the wedding guests and bystanders were nearly deafened. Friedlin saw that the attack would not end by itself and quickly came to Peter's rescue.
        - id: ch04-b08
          speaker: friedlin
          text: Master Peter, come and live with Lucia and me. You will always be welcome in our home, and I promise you will be comfortable there.
        - id: ch04-b09
          speaker: narrator
          text: In that way, Lucia received the thing her heart had wanted most. The next day, Father Peter took her arm and proudly led her to the church. The marriage took place with every sign of happiness. Not long afterward, the young husband and wife settled in a fine house that Friedlin had purchased. Around it lay a garden and broad meadows, a fishpond, and a whole hill covered with vines. Lucia and Friedlin were as happy there as the day was long.
        - id: ch04-b10
          speaker: narrator
          text: Peter lived peacefully with them. Everyone believed he depended upon his wealthy son-in-law's kindness. No one guessed that his barrel of nails was the true Horn of Plenty from which all their prosperity flowed.

    - id: ch05
      title: The Treasure Mountain
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: This is how Peter's secret plan had succeeded. He traveled all the way to the treasure mountain without a single person discovering what he meant to do. With Ilse far behind him, he enjoyed himself along the road and went at whatever pace pleased him. In the end, he reached the right valley. Finding the little brook cost him considerable trouble, but once he saw it, he eagerly followed its course. The stone bridge, the sawmill, and the high rock appeared just as Father Martin had described. Soon Peter stood beside the small hollow hidden in the forest.
        - id: ch05-b02
          speaker: narrator
          text: He began to dig. Down and down Peter went, burrowing into the packed earth like a mole. He found the stone passage, crawled through it, and carried his lamp down the long stair. At the iron door, the spring-root did its work exactly as promised. At last, the hidden treasure lay open before his eyes. You can imagine how merrily he filled his strong sack with as much gold as his back could bear. When it was full, he dragged it up all seventy-seven stone steps, staggering beneath the weight but carrying a heart full of hope and delight.
        - id: ch05-b03
          speaker: narrator
          text: Even after everything the Treasure Seeker had said, Peter did not entirely trust the gnome's promise of safety. With his sack full, he cared only about reaching the open air again. He hurried through the underground halls without turning his head to the right or the left. He paid so little attention to the treasure chamber that afterward he could not remember whether gold and jewels had really flashed from its walls and pillars.
        - id: ch05-b04
          speaker: narrator
          text: Everything went well. Peter neither saw nor heard any ghost, serpent, or other frightening thing. Only one event startled him. The moment he was safely outside the great door with its iron bars, it slammed behind him with a tremendous crash. Then Peter remembered that the magic spring-root lay on the other side. Without it, the locks would never open for him again, and he could not return for a second load of treasure.
        - id: ch05-b05
          speaker: narrator
          text: That did not trouble him for long. He was content with what he had. He carefully followed Father Martin's last instruction and pressed the loose earth back over the hollow.
        - id: ch05-b06
          speaker: narrator
          text: With the entrance safely covered, Peter sat down to consider his next difficulty. He wanted to carry the gold back to his own town and enjoy it there. But how could he do that without being forced to share everything with his scolding wife? The moment Ilse learned what he possessed, she would claim control of it and give him no peace for the rest of his days. He needed a way to take the treasure home without letting her know it existed.
        - id: ch05-b07
          speaker: narrator
          text: Peter thought for a long while before an answer came to him. He carried his heavy sack to the nearest village. There he purchased a wheelbarrow, a strongly made barrel, and a large quantity of ordinary iron nails. He poured the gold into the bottom of the barrel, then covered it completely beneath a deep layer of nails. Lifting the loaded barrel onto the wheelbarrow took all his strength. Once it was secure, he pushed his disguised fortune onto the road and started toward home.
        - id: ch05-b08
          speaker: narrator
          text: At one place along the road, Peter met a handsome young man walking alone. The stranger's lowered head and sorrowful face showed that some heavy trouble lay upon him. Peter's own heart was so light that he wanted every person he met to share his happiness. He greeted the young man cheerfully, fell into step beside him, and asked where he meant to go.
        - id: ch05-b09
          speaker: friedlin
          text: Into the wide world, good father, or perhaps out of it. I will go wherever my feet happen to carry me.
          emotion: sad
        - id: ch05-b10
          speaker: peter
          text: Why would you leave the world? What wrong has it done you?
        - id: ch05-b11
          speaker: friedlin
          text: The world has done me no wrong, and I have done none to it. Even so, it holds nothing for me now.
          emotion: sad
        - id: ch05-b12
          speaker: narrator
          text: Peter did everything he could to raise the young man's spirits. He invited the stranger to share supper at the first inn they came to, because he suspected that hunger and an empty purse might be the true causes of such despair. Soon a generous meal stood on the table. Yet Friedlin barely remembered to take a bite. Watching him sit untouched before the good food, Peter understood that neither hunger nor poverty was his deepest trouble. Some sorrow of the heart was consuming him. Peter kindly asked him to explain it.
        - id: ch05-b13
          speaker: friedlin
          text: What good would that do, father? You cannot give me help or comfort.
        - id: ch05-b14
          speaker: peter
          text: How can you know? I may be able to help. Often in life, aid arrives from the place we least expect.
        - id: ch05-b15
          speaker: narrator
          text: Encouraged by that answer, Friedlin began.
        - id: ch05-b16
          speaker: friedlin
          text: I am a crossbowman in the service of a noble count, and I was brought up from childhood inside his castle. Not long ago, my master returned from a distant journey carrying many treasures. Among all those riches was the painted portrait of a maiden. Her face looked so gentle, sweet, and beautiful that I lost my heart the first moment I saw it. After that day, I could think of nothing except finding the maiden herself and asking her to become my wife.
        - id: ch05-b17
          speaker: friedlin
          text: The count had mentioned her name and the town where she lived. But when I confessed my love and begged permission to search for her, he only laughed at me. He refused me completely. There was no honorable way to leave his service, so I slipped out of the castle by night and ran away. I soon reached the little town where the maiden lived, believing the worst of my troubles was over. Instead, I found fresh difficulties waiting at her door.
        - id: ch05-b18
          speaker: friedlin
          text: The maiden lived under the care of a mother so severe that she was never allowed to look out through a window or set one foot outside the door alone. I could discover no honest way even to introduce myself. At last, I dressed in an old woman's clothes and boldly knocked at the house. The lovely maiden opened the door herself. Seeing her living face, I was so enchanted that I almost forgot the disguise I wore and the old woman's voice I meant to use.
        - id: ch05-b19
          speaker: friedlin
          text: I recovered my senses just in time. In my borrowed voice, I asked her to make a fine tablecloth for me. I had heard that she was the most skillful needlewoman in all the surrounding country. The order gave me freedom to visit again and again under the excuse of examining her progress. One day, her mother left for town. I could bear the deception no longer. I threw off the old woman's disguise, stood before the maiden as myself, and told her about my love.
        - id: ch05-b20
          speaker: friedlin
          text: Naturally, the sudden change frightened her at first. I begged her not to send me away until she had heard everything. As she listened, I saw that my love did not displease her. Still, she gently reproached me for disobeying my master and for deceiving her by pretending to be an old woman. When I asked her to marry me, sadness came over her. She said her mother would scorn any suitor who had no money. Then she begged me to go at once, before my presence was discovered and brought trouble down upon her.
        - id: ch05-b21
          speaker: friedlin
          text: Leaving was bitter, but when she asked it of me, I had no choice. I went away from her house and have wandered ever since, with grief gnawing continually at my heart. I fled my position, so now I have no master. I own no money, land, or goods. Tell me, how can such a man ever hope to return with honor and win the hand of my lovely Lucia?
          emotion: sad
        - id: ch05-b22
          speaker: narrator
          text: Peter had listened with close attention from the beginning. At the sound of his daughter's name, he raised his head and listened more sharply still. He asked Friedlin several careful questions about the town, the severe mother, and the young needlewoman. The answers left no doubt. This grieving young crossbowman was deeply in love with Peter's own Lucia.
        - id: ch05-b23
          speaker: peter
          text: That is a remarkable story. But where is the girl's father? Why not ask him for her hand? He might support you and be glad to welcome you as a son-in-law.
        - id: ch05-b24
          speaker: friedlin
          text: Alas, the girl's father is a wandering good-for-nothing. He deserted his wife and child and went off to no one knows where. Perhaps he will never return. His wife complains bitterly whenever she speaks of him. And when dear Lucia takes her father's side or says a kind word in his defense, the woman turns her anger upon her daughter and scolds her too.
        - id: ch05-b25
          speaker: narrator
          text: Peter was somewhat amused to hear this account of his own character and disappearance. He did not reveal himself yet. He had already come to like the young man, and Friedlin's whole story made the answer to Peter's problem clear. Here was exactly the person Peter needed. With Friedlin's help, he could return to Lucia, enjoy his hidden wealth in peace, and still avoid placing the treasure under Ilse's control.
        - id: ch05-b26
          speaker: peter
          text: Follow my advice, and I promise you will marry the girl you love before you are many days older.
        - id: ch05-b27
          speaker: friedlin
          text: Friend, it is cruel to mock a miserable man. Find someone else to fool with your grand promises.
          emotion: angry
        - id: ch05-b28
          speaker: narrator
          text: Friedlin sprang up to leave, but Peter caught his arm.
        - id: ch05-b29
          speaker: peter
          text: Stay, hothead! This is no joke. I can make every word come true.
        - id: ch05-b30
          speaker: narrator
          text: Peter opened the barrel and moved aside the layer of nails. Beneath them, the hidden treasure gleamed. Once Friedlin understood that the promise was real, Peter unfolded the rest of his plan. The young man would return to Lucia dressed as a wealthy suitor and play the part of a rich son-in-law. He must keep silent about where the money truly came from. Then Peter, Lucia, and Friedlin could all enjoy the treasure together without Ilse disturbing their peace.
        - id: ch05-b31
          speaker: narrator
          text: This sudden change in fortune filled Friedlin with joy. A few moments earlier, he had believed the whole world empty. Now Lucia and happiness stood within reach. He could hardly find words strong enough to thank Father Peter for his generosity. The two men rested for the night and took the road again at dawn. When they reached the next town, Friedlin used Peter's gold to equip himself with fine clothes and everything else a gallant young wooer ought to possess.
        - id: ch05-b32
          speaker: narrator
          text: Before they separated, Peter filled Friedlin's pockets with enough gold to provide a splendid wedding gift and convince even Ilse. Together, they settled every detail. Friedlin would first go alone to Lucia's house and arrange the marriage. Once everything was certain, he would secretly send a message back to Peter. Peter would then purchase the wagonload of furniture, boxes, and household supplies that a rich bridegroom could proudly send ahead and that would create such wonder in Lucia's little town.
        - id: ch05-b33
          speaker: narrator
          text: As they parted, Peter gave one final command. Friedlin must protect their secret. He must not tell even Lucia until she had become his wife.

    - id: ch06
      title: As Rich as Peter Bloch's Son-in-Law
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Master Peter lived for many years after his return and thoroughly enjoyed the rewards of his journey to the mountain. He guarded the secret as carefully as Friedlin did, and no rumor of the buried treasure ever escaped into the town. As Peter grew old, the family's prosperity became so great that even he could no longer say exactly how rich he was. Yet neighbors and visitors continued to suppose that every gold piece had always belonged to Friedlin.
        - id: ch06-b02
          speaker: narrator
          text: Friedlin and his beloved wife lived together in the greatest happiness and peace. Over the years, both of them rose to a place of great honor among the people of the town. The treasure itself remained hidden behind their good name. And to this day, whenever the citizens want to describe a man with wealth beyond counting, they still say, “He is as rich as Peter Bloch's son-in-law!”
