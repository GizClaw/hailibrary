  chapters:
    - id: ch01
      title: The Pears in Winter
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man with one son, a lazy, foolish boy who never did as he was told. When the father knew he was dying, he called the boy to him. He warned his son that he would soon be alone in the world. The boy would own nothing but their small cottage and the pear tree behind it. Whether he liked it or not, he would finally have to work. If he refused, he would starve. Then the old man died.
        - id: ch01-b02
          speaker: narrator
          text: But even then, the boy would not work. He idled away his days just as before and lived on pears from the tree. It was no ordinary pear tree. It bore fruit through the whole year, unlike any pear tree before or since. Its pears were finer even in winter than other pears were in autumn. One day, right in the middle of winter, a fox creeping past noticed the fruit.
        - id: ch01-b03
          speaker: fox
          text: My goodness, those pears look wonderful! Give me a basketful. It will bring you luck.
        - id: ch01-b04
          speaker: beggar_boy
          text: But little fox, if I give you a whole basket, what will I have to eat?
        - id: ch01-b05
          speaker: fox
          text: Trust me and do as I say. I know this will bring you luck.
        - id: ch01-b06
          speaker: narrator
          text: The boy got up, picked some of the ripest pears, and filled a rush basket. The fox thanked him, took the basket in his mouth, and trotted straight to the king's palace.
        - id: ch01-b07
          speaker: fox
          text: Your Majesty, my master sends you some of his finest pears. He hopes you will kindly accept them.
        - id: ch01-b08
          speaker: narrator
          text: He laid the basket at the king's feet. The king bent down and stared at the fruit.
        - id: ch01-b09
          speaker: king
          text: Pears at this time of year? Tell me, who is your master?
        - id: ch01-b10
          speaker: fox
          text: Count Piro.
        - id: ch01-b11
          speaker: king
          text: How can he grow pears in the middle of winter?
        - id: ch01-b12
          speaker: fox
          text: He has anything he wants. In fact, he is even richer than you, Your Majesty.
        - id: ch01-b13
          speaker: king
          text: Then what could I possibly send him for these pears?
        - id: ch01-b14
          speaker: fox
          text: Nothing at all, Your Majesty. A return gift would only offend him.
        - id: ch01-b15
          speaker: king
          text: Then tell him I thank him with all my heart, and that I shall enjoy them very much.
        - id: ch01-b16
          speaker: narrator
          text: The fox returned to the cottage with the empty basket and told the boy everything. The fox was delighted with his own cleverness, but the hungry boy was not.
        - id: ch01-b17
          speaker: beggar_boy
          text: Little fox, you came back with nothing for me, and I'm so hungry!
          emotion: sad
        - id: ch01-b18
          speaker: fox
          text: Leave it to me. I know what I'm doing. You'll see that it brings you luck.

    - id: ch02
      title: The Fox Asks for the Princess
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: A few days later, the fox came back to the cottage.
        - id: ch02-b02
          speaker: fox
          text: I need another basket of pears.
        - id: ch02-b03
          speaker: beggar_boy
          text: Oh, little fox, what will I eat if you carry all my pears away?
        - id: ch02-b04
          speaker: fox
          text: Don't worry. It will all come right.
        - id: ch02-b05
          speaker: narrator
          text: This time the fox took a larger basket and filled it to the top. Then he carried it in his mouth to the palace.
        - id: ch02-b06
          speaker: fox
          text: Your Majesty, you seemed to enjoy the first pears, so my master, Count Piro, sends you more with his humble respects.
        - id: ch02-b07
          speaker: king
          text: Surely pears like these cannot grow while deep snow covers the ground!
          emotion: surprised
        - id: ch02-b08
          speaker: fox
          text: Snow makes no difference to him. He is rich enough to manage anything. But today he has sent me to ask whether you will give him your daughter in marriage.
        - id: ch02-b09
          speaker: king
          text: If he is so much richer than I am, I must refuse. My honor would not allow me to accept his offer.
        - id: ch02-b10
          speaker: fox
          text: Please don't think that way, Your Majesty. And you needn't trouble yourself about a dowry. Count Piro asks for nothing but the princess's hand.
        - id: ch02-b11
          speaker: king
          text: Is he truly rich enough to do without a dowry?
        - id: ch02-b12
          speaker: fox
          text: Haven't I told Your Majesty that he is richer than you?
        - id: ch02-b13
          speaker: king
          text: Then ask him to come here, so that we may speak together.
        - id: ch02-b14
          speaker: narrator
          text: The fox hurried home and announced what he had done.
        - id: ch02-b15
          speaker: fox
          text: I told the king that you are Count Piro, and I asked for his daughter to marry you.
        - id: ch02-b16
          speaker: beggar_boy
          text: Oh, little fox, what have you done? As soon as the king sees me, he'll have my head cut off!
          emotion: fearful
        - id: ch02-b17
          speaker: fox
          text: No, he won't. Just do exactly as I tell you.

    - id: ch03
      title: Count Piro Goes to Court
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The fox went into town and stopped at the finest tailor's shop. He put on his grandest manner.
        - id: ch03-b02
          speaker: fox
          text: My master, Count Piro, asks you to send him the finest coat in your shop at once. If it fits, I shall return tomorrow and pay you. He is in a great hurry, so perhaps I had better carry it to him myself.
        - id: ch03-b03
          speaker: narrator
          text: The tailor was not used to serving counts, and he was eager to please such a grand customer. He quickly brought out every finished coat he had in the shop. The fox looked them over and chose a beautiful coat of white and silver. He had the tailor tie it into a parcel, caught the string between his teeth, and carried it away. Next he visited a horse dealer. The fox persuaded the man to send his finest horse to the cottage, saying that the king had summoned his master to the palace.
        - id: ch03-b04
          speaker: narrator
          text: The young man had no wish to face the king, but he obeyed. He put on the white-and-silver coat, mounted the fine horse, and rode toward the palace. All the way, the fox ran ahead of him.
        - id: ch03-b05
          speaker: beggar_boy
          text: What am I supposed to say to the king, little fox? I've never spoken to a king in my life.
          emotion: fearful
        - id: ch03-b06
          speaker: fox
          text: Say nothing and let me do the talking. All you need is, “Good morning, Your Majesty.”
        - id: ch03-b07
          speaker: narrator
          text: By then, they had reached the palace. The king himself came to the door to welcome Count Piro. He led his guest into the great hall, where a feast had been spread across the table. The princess was already seated there. She said nothing, and Count Piro was just as silent. The meal went on that way until the king finally spoke to the fox.
        - id: ch03-b08
          speaker: king
          text: The count has very little to say.
        - id: ch03-b09
          speaker: fox
          text: He has so many estates to manage that he cannot spend his time talking like ordinary people.
        - id: ch03-b10
          speaker: narrator
          text: That answer satisfied the king. They finished their dinner, and afterward Count Piro and the fox said farewell.
        - id: ch03-b11
          speaker: narrator
          text: The next morning, the fox appeared at the cottage once more.
        - id: ch03-b12
          speaker: fox
          text: Give me another basket of pears.
        - id: ch03-b13
          speaker: beggar_boy
          text: Very well, little fox. But remember, this may cost me my life.
        - id: ch03-b14
          speaker: fox
          text: Leave it all to me and do as I say. In the end, you'll see that it brings you luck.
        - id: ch03-b15
          speaker: narrator
          text: The fox picked the pears and carried them to the king.
        - id: ch03-b16
          speaker: fox
          text: My master, Count Piro, sends you these pears and asks for your answer to his proposal.
        - id: ch03-b17
          speaker: king
          text: Tell the count the wedding may take place whenever he wishes.
        - id: ch03-b18
          speaker: narrator
          text: Full of pride, the fox trotted back with the answer. The young man was dismayed.
        - id: ch03-b19
          speaker: beggar_boy
          text: But little fox, I can't bring the princess back to this cottage!
          emotion: fearful
        - id: ch03-b20
          speaker: fox
          text: Leave everything to me. Haven't I managed well so far?
        - id: ch03-b21
          speaker: narrator
          text: At the palace, everyone began preparing for a magnificent wedding. The young man returned, still dressed as Count Piro, and he was married to the princess before the court.

    - id: ch04
      title: The Road to the Ogre's Castle
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The wedding feasts lasted for a week. Then the fox approached the king.
        - id: ch04-b02
          speaker: fox
          text: My master would like to take his young bride home to his own castle.
        - id: ch04-b03
          speaker: king
          text: Very well. I shall travel with them.
        - id: ch04-b04
          speaker: narrator
          text: The king ordered all his courtiers and attendants to prepare for the journey. From his own stables, he had the finest horses brought out for himself, Count Piro, and the princess. Soon the bridal pair, the king, and the whole company set off together. They rode out across the wide plain, while the little fox ran far ahead.
        - id: ch04-b05
          speaker: narrator
          text: Soon the fox saw a great flock of sheep grazing peacefully on rich grass. He stopped beside the shepherd.
        - id: ch04-b06
          speaker: fox
          text: Who owns these sheep?
        - id: ch04-b07
          speaker: shepherd
          text: An ogre owns them.
        - id: ch04-b08
          speaker: fox
          text: Hush! See those armed men riding this way? If you say the sheep belong to an ogre, they'll kill the flock, and then the ogre will kill you. When they ask, say the sheep belong to Count Piro. That will be better for everyone.
        - id: ch04-b09
          speaker: narrator
          text: The fox hurried on before the riders could see him speaking with the shepherd. Very soon, the king reached the flock and pulled up his horse.
        - id: ch04-b10
          speaker: king
          text: What beautiful sheep! I have none so fine in my own pastures. Who owns them?
        - id: ch04-b11
          speaker: shepherd
          text: Count Piro owns them.
        - id: ch04-b12
          speaker: narrator
          text: The shepherd did not know he was speaking to the king. The king thought Count Piro must indeed be very rich, and he rejoiced in his wealthy son-in-law.
        - id: ch04-b13
          speaker: narrator
          text: Farther on, the fox found a huge herd of pigs rooting beneath some trees.
        - id: ch04-b14
          speaker: fox
          text: Who do these pigs belong to?
        - id: ch04-b15
          speaker: swineherd
          text: They belong to an ogre.
        - id: ch04-b16
          speaker: fox
          text: Quiet! Do you see that troop of armed men coming toward us? Tell them these pigs belong to the ogre, and they'll kill the herd. Then the ogre will kill you. Say they belong to Count Piro instead. It will be better for everyone.
        - id: ch04-b17
          speaker: narrator
          text: No one else was close enough to hear, but the fox whispered anyway. Then he raced onward. A little later, the king reined in his horse beside the pigs.
        - id: ch04-b18
          speaker: king
          text: Those are splendid pigs! They're fatter than any on my farms. Who owns them?
        - id: ch04-b19
          speaker: swineherd
          text: Count Piro owns them.
        - id: ch04-b20
          speaker: narrator
          text: The swineherd did not recognize the king. Once again, the king congratulated himself on having such a rich son-in-law.
        - id: ch04-b21
          speaker: narrator
          text: Now the fox ran faster than ever. In a meadow full of flowers, he found a troop of horses at grass and spoke to their keeper.
        - id: ch04-b22
          speaker: fox
          text: Whose horses are these?
        - id: ch04-b23
          speaker: horse_keeper
          text: They are an ogre's.
        - id: ch04-b24
          speaker: fox
          text: Hush! Look at those armed riders. If you tell them the horses belong to an ogre, they'll drive the animals away, and the ogre will kill you. Tell them the horses are Count Piro's. Everyone will be safer that way.
        - id: ch04-b25
          speaker: narrator
          text: The fox ran ahead again. Within minutes, the king arrived and gazed at the horses.
        - id: ch04-b26
          speaker: king
          text: What lovely creatures! I wish they were mine. Who owns them?
        - id: ch04-b27
          speaker: horse_keeper
          text: Count Piro owns them.
        - id: ch04-b28
          speaker: narrator
          text: The horse keeper did not know the king either. The king's heart leaped. If these horses belonged to his rich son-in-law, he felt they were almost his own.

    - id: ch05
      title: The Castle of Count Piro
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At last, the fox reached the ogre's own castle. He ran up the steps with tears streaming from his eyes.
        - id: ch05-b02
          speaker: fox
          text: Oh, you poor people! What a terrible fate is coming upon you!
          emotion: sad
        - id: ch05-b03
          speaker: ogre
          text: What has happened?
          emotion: fearful
        - id: ch05-b04
          speaker: narrator
          text: The ogre was trembling with fright.
        - id: ch05-b05
          speaker: fox
          text: Can you see those horsemen on the road? The king has sent them to kill you!
        - id: ch05-b06
          speakers: [ogre, ogress]
          ensemble: duo
          text: Dear little fox, please help us!
          emotion: fearful
        - id: ch05-b07
          speaker: fox
          text: I'll do what I can. Both of you should hide in the great oven. Once the soldiers have passed, I'll let you out.
        - id: ch05-b08
          speaker: narrator
          text: The ogre and ogress scrambled into the oven as fast as they could. The fox slammed the door shut. At that very moment, the king arrived.
        - id: ch05-b09
          speaker: fox
          text: Please do us the honor of dismounting, Your Majesty. This is Count Piro's palace!
        - id: ch05-b10
          speaker: king
          text: Why, it is finer than my own! But with all these beautiful things in the hall, where are the servants?
          emotion: surprised
        - id: ch05-b11
          speaker: fox
          text: His Excellency wanted the princess to choose the servants herself.
        - id: ch05-b12
          speaker: narrator
          text: The king looked all around the hall at the splendid things that filled it. Then he nodded, pleased that his daughter would choose the household servants herself. At last, he rode away and left the bride and groom in the castle. That night, when darkness fell and everything was still, the fox crept downstairs. He lit the fire in the kitchen, and the ogre and his wife were burned to death inside the oven.

    - id: ch06
      title: The Fox Tests Count Piro
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The next morning, the fox spoke to Count Piro.
        - id: ch06-b02
          speaker: fox
          text: Now you are rich and happy, so you no longer need me. Before I go, I ask one thing in return. When I die, promise to give me a magnificent coffin and bury me with proper honors.
        - id: ch06-b03
          speaker: princess
          text: Oh, little fox, please don't talk about dying!
          emotion: sad
        - id: ch06-b04
          speaker: narrator
          text: The princess was close to tears, for she had grown very fond of the fox.
        - id: ch06-b05
          speaker: narrator
          text: Some time passed. Then the fox decided to find out whether Count Piro was truly grateful for everything he had done. He returned to the castle, lay down on the doorstep, and pretended to be dead. The princess was just setting out for a walk. The moment she saw him, she burst into tears and fell to her knees beside him.
        - id: ch06-b06
          speaker: princess
          text: My dear little fox, you cannot be dead! You poor little creature. You shall have the finest coffin in the world!
          emotion: sad
        - id: ch06-b07
          speaker: beggar_boy
          text: A coffin for an animal? What nonsense! Take him by the leg and toss him into the ditch.
        - id: ch06-b08
          speaker: narrator
          text: At once, the fox sprang to his feet.
        - id: ch06-b09
          speaker: fox
          text: You miserable, thankless beggar! Have you forgotten that every bit of your wealth came from me?
          emotion: angry
        - id: ch06-b10
          speaker: narrator
          text: Count Piro was frightened. Perhaps the fox could take away the castle and leave him as poor as before, with nothing to eat but pears from his tree. He tried to soothe the fox's anger. He claimed he had only been joking, because he had known all along that the fox was not really dead.
        - id: ch06-b11
          speaker: narrator
          text: For the princess's sake, the fox allowed himself to be won over. He stayed at the castle for many years and played with Count Piro's children.
        - id: ch06-b12
          speaker: narrator
          text: When the fox truly died, his coffin was made of silver. Count Piro and his wife followed him to the grave.
