cover_prompt: |-
  A wordless cover gathers adventurous motifs from The Crimson Fairy Book in a many-layered mountain valley at sunset. A clever young woman steadies a steaming magic kettle, a loyal horse waits beside a traveler, three brothers approach a stone arch, and a tiny distant ship crosses a crimson lake. At the center, a curling ribbon of harmless steam rises from the kettle and becomes silhouettes of birds, keys, and stars. The transformation of the steam is the focal action, connecting the surrounding stories in one unified gathering rather than separate panels. Use a gently elevated composition with strong readable shapes and broad calm crimson sky at the top. Keep every costume and creature original, respectful of each tale's cultural setting, preindustrial in detail, and free of modern adaptation likenesses. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
