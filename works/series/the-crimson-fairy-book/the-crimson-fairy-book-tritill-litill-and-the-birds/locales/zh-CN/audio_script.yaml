audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 威严深情，失而复得时喜悦难抑
        timbre: 浑厚饱满
        pace: 中速偏缓
        pitch: 中低音
    eldest_son:
      display_name: 大儿子
      tts:
        delivery: 自私傲慢，对弱者冷淡而不耐烦
        timbre: 年轻硬朗
        pace: 中速偏快
        pitch: 中音
    youngest_son:
      display_name: 小儿子
      tts:
        delivery: 善良诚恳，危急时焦急，得助后真挚明快
        timbre: 清澈温和
        pace: 中速
        pitch: 中高音
    tritill:
      display_name: 特里蒂尔
      tts:
        delivery: 沉着友善，施展魔法时简洁有力
        timbre: 苍老浑厚
        pace: 舒缓
        pitch: 低音
    litill:
      display_name: 利蒂尔
      tts:
        delivery: 温和可靠，给出指点时从容笃定
        timbre: 苍老清朗
        pace: 舒缓
        pitch: 中低音
    bird_king:
      display_name: 鸟王
      tts:
        delivery: 明快热心，许诺时郑重可靠
        timbre: 清亮轻盈
        pace: 中速偏快
        pitch: 高音
    ogress:
      display_name: 女妖
      tts:
        delivery: 冷酷镇定，威胁时不动声色却令人胆寒
        timbre: 粗沉阴冷
        pace: 中速偏缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 失踪的公主与出门的兄弟
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位公主，生得极美，心地又十分善良，人人都爱她。父亲更是一刻也舍不得她离开自己的视线。可有一天，公主突然失踪了。国王悲痛欲绝，几乎送了命。全国上下翻来覆去地寻找，每个角落都查过了，却连她的影子也没见到。
        - id: ch01-b02
          speaker: narrator
          text: 国王绝望之下颁布告示，谁能把公主带回王宫，谁就能娶她为妻。年轻人纷纷重新出发，结果依然一无所获，只好伤心地回家。
        - id: ch01-b03
          speaker: narrator
          text: 王宫附近住着一对老夫妻，他们有三个儿子。父母任由两个哥哥想做什么便做什么，小儿子却总得处处让着他们。三兄弟长大以后，大儿子告诉父亲，自己早已厌倦这种平静的生活，决定出门见识世界。老两口想到要和他分别，心里十分难过，却没有开口阻拦。他们忙着备好旅途所需的一切，连一双新靴子也没忘。大儿子向父母告别，高高兴兴地上路了。
        - id: ch01-b04
          speaker: narrator
          text: 他沿着林中的道路走了好几英里，出了树林，眼前忽然是一片光秃秃的山坡。他坐下来休息，打开食物袋吃午饭。才吃几口，一个衣衫褴褛的老人恰好经过。老人看见食物，便问年轻人能不能分给他一点。
        - id: ch01-b05
          speaker: eldest_son
          text: 我自己都不够吃，哪里有你的份？想吃东西，就自己去挣。
        - id: ch01-b06
          speaker: narrator
          text: 老人只好继续赶路。大儿子吃完午饭，又走了几个钟头，来到第二座山坡。他躺在草地上，拿出面包和牛奶。另一个比先前那人更加穷苦的老人走过来，想讨几口吃的。大儿子没有给他食物，反倒说了一顿难听的话。老人只能拖着跛脚，伤心地离开。
        - id: ch01-b07
          speaker: narrator
          text: 傍晚，大儿子来到林中空地，想在那里吃晚饭。许多鸟儿看见食物，成群围着他的头顶飞，盼着能捡到几粒面包屑，他却朝它们扔石头，把鸟群全赶跑了。吃完后，他开始寻找过夜的地方。空地无遮无挡，又冷得很，实在不能睡。尽管走了一整天，已经疲惫不堪，他还是拖着身体站起来，继续寻找住处。
        - id: ch01-b08
          speaker: narrator
          text: 终于，他发现一块巨岩下有个很深的洞穴。里面看起来空无一物，他便钻进去，在角落里睡下。半夜，一阵响动把他惊醒。他探头一看，一个可怕的女妖正大步走来。大儿子苦苦哀求，请她不要伤害自己，只准他留宿这一夜。女妖答应了，条件是第二天不管她交代什么差事，他都必须完成。大儿子马上答应，翻身又睡了过去。
        - id: ch01-b09
          speaker: ogress
          text: 天黑以前，把洞里的尘土全扫出去。要是地面不干净，你就等着受罚吧。
        - id: ch01-b10
          speaker: narrator
          text: 女妖走后，大儿子拿起铁锹，可洞里的尘土像生了根，不管怎样用力，一点也铲不动。他很快便扔下工具，闷闷不乐地坐在角落里。他一面猜女妖会怎样惩罚自己，一面埋怨她为什么偏要交给自己一件不可能办成的差事。女妖回到洞里，只看了一眼地面，便一拳打裂了他的脑壳。大儿子就这样丢了性命。
        - id: ch01-b11
          speaker: narrator
          text: 过了一阵，二儿子也厌倦了家里的日子。他吵得父母片刻不得安宁，直到他们答应给他食物和新靴子，让他也出门见识世界。他在路上遇见同样两个老人。两人向他讨一点面包和牛奶，可他从没学过帮助别人，向来只肯把自己的东西留给自己，便充耳不闻，独自吃完午饭。后来，他也来到洞穴，接下清扫地面的差事。他同哥哥一样没有成功，也落得同样的结局。
    - id: ch02
      title: 善意带来的朋友
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 家里只剩下小儿子，照理说，父母就算不爱他，也该对他和善一点。可不知为什么，他们还是连看都不愿看他，哪怕小儿子远比哥哥们用心，让父母过得舒适。小儿子提出要出门时，父母马上答应了，仿佛很高兴终于能摆脱他。他们给了他一双新靴子和一点面包牛奶，还觉得自己已经十分慷慨。
        - id: ch02-b02
          speaker: narrator
          text: 小儿子既想看看世界，也急着知道哥哥们去了哪里。他决定尽可能沿着哥哥们走过的路寻找。他从父亲的屋外出发，来到第一座山坡，坐下休息，心想哥哥们一定也曾在这里停过脚。那时他又饿又累，刚拿出父母给的食物，那个老人便出现了，问他能否分一点。
        - id: ch02-b03
          speaker: narrator
          text: 小儿子立刻掰下面包，请老人坐在身旁，像招待相识多年的老朋友一样请他吃饭。老人吃饱以后站起身，临走前告诉了他自己的名字。
        - id: ch02-b04
          speaker: tritill
          text: 我叫特里蒂尔。以后你遇上难处，只管叫我，我一定会来帮你。
        - id: ch02-b05
          speaker: narrator
          text: 话音刚落，老人忽然消失了。小儿子四下张望，却怎么也看不出他去了哪里。他觉得自己已经歇够，便继续赶路。在第二座山坡，他遇见另一个老人，同样把食物和牛奶分给了对方。
        - id: ch02-b06
          speaker: litill
          text: 我叫利蒂尔。往后哪怕只有一点小麻烦，只要你开口，我就来帮忙。
        - id: ch02-b07
          speaker: narrator
          text: 小儿子走到林中空地，停下来吃午饭。转眼间，仿佛全世界的鸟都飞来围着他的头顶盘旋。他把一部分面包捏成碎屑，撒给鸟儿，看着它们一次次俯冲下来啄食。等最后一粒碎屑也被吃掉，体形最大、羽毛最鲜艳的鸟郑重地对他说。
        - id: ch02-b08
          speaker: bird_king
          text: 以后有了麻烦，就喊“我的鸟儿们，快来帮我！”我们听见了，一定会来。
        - id: ch02-b09
          speaker: narrator
          text: 傍晚，小儿子来到那座洞穴，也觉得这里适合过夜。他四下一看，发现死人的衣服碎片和残骨，吓得浑身发冷，却猜到哥哥们一定死在这里，住在这里的也一定是女妖。他没有逃走，决心等她回来。女妖很快大步走进洞中。小儿子礼貌地请求借宿，女妖答应了，条件仍是第二天无论她交代什么活儿，他都要照办。小儿子答应下来，蜷缩在角落里睡着了。
        - id: ch02-b10
          speaker: narrator
          text: 第二天，地上的尘土比从前积得更厚。小儿子拿起铁锹，可他和两个哥哥一样，无论怎么使劲也清理不动。到后来，连铁锹本身都陷进泥土，任凭他拉扯，还是拔不出来。他绝望地望着铁锹，忽然想起老人说过的话。
        - id: ch02-b11
          speaker: youngest_son
          text: 特里蒂尔，特里蒂尔，快来帮我！
        - id: ch02-b12
          speaker: narrator
          text: 特里蒂尔立刻出现在他身旁。听完事情的经过，老人对两件工具发出命令。
        - id: ch02-b13
          speaker: tritill
          text: 铁锹，铲子，都把自己的活儿干起来！
        - id: ch02-b14
          speaker: narrator
          text: 铁锹和铲子立刻在洞里上下翻飞，像跳舞一样各自忙碌。没过多久，地面便干干净净，连一星尘土也没有。特里蒂尔随即离去。小儿子心里一下轻松了，安心等女妖回来。女妖进洞以后，把地面和四周仔仔细细看了一遍。
        - id: ch02-b15
          speaker: ogress
          text: 这不是你一个人干的。不过地面既然干净了，今天我就不砍你的脑袋。
    - id: ch03
      title: 满天飞舞的羽毛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天一早，女妖又交代一项差事。小儿子必须把她所有枕头里的羽毛取出来，摊在太阳下晒干。等她晚上回来时，只要少了一根羽毛，小儿子就得拿脑袋偿还。
        - id: ch03-b02
          speaker: narrator
          text: 小儿子拿来枕头，把里面的羽毛全抖出来。哎呀，那羽毛多得简直数不清！他一根根仔细摊开，心里正庆幸阳光灿烂，天上没有一丝风，不料一阵微风突然吹来。眨眼之间，羽毛全在空中飞舞，一直飘到高高的天上。
        - id: ch03-b03
          speaker: narrator
          text: 小儿子起初还想追着收拢，很快便明白这样毫无用处。他只得大声呼救。
        - id: ch03-b04
          speaker: youngest_son
          text: 特里蒂尔、利蒂尔，还有我所有的鸟儿，快来帮我！
        - id: ch03-b05
          speaker: narrator
          text: 他还没喊完，特里蒂尔、利蒂尔和所有鸟儿就全到了。鸟儿把四散的羽毛一根根衔回来，两位老人和小儿子再依照女妖的吩咐，把它们塞回枕头。他们只在外面留下小小一根，告诉小儿子，女妖要是发现少了，就把这一根塞进她的鼻子。随后，两位老人和鸟群一起消失了。
        - id: ch03-b06
          speaker: narrator
          text: 女妖一回来，便使出全身重量，猛地倒在床上，震得整个洞穴直发颤。枕头不但没有空瘪，反而又软又饱满，这让她十分吃惊。可她还是不肯罢休，又站起身来，把枕套一个个抖空，开始清点里面的羽毛。
        - id: ch03-b07
          speaker: ogress
          text: 只要少一根，我就砍下你的脑袋。
        - id: ch03-b08
          speaker: narrator
          text: 小儿子马上从口袋里取出留下的羽毛，塞进女妖的鼻孔。
        - id: ch03-b09
          speaker: youngest_son
          text: 你缺的那根羽毛，就在这里！
        - id: ch03-b10
          speaker: ogress
          text: 羽毛不是你一个人收好的。不过这一次，我不追究。
        - id: ch03-b11
          speaker: narrator
          text: 女妖说得十分平静。那天夜里，小儿子在角落里睡得很沉。
    - id: ch04
      title: 五十头牛中的一头
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了早晨，女妖交代了第三项差事。她有五十头大公牛，小儿子必须猜出她想要杀的是哪一头，再把牛宰掉，煮熟牛心，把两只牛角做成酒杯。所有事情都要在她回家以前完成。
        - id: ch04-b02
          speaker: ogress
          text: 选对了，明天你就能自由离开，还可以挑三样东西当酬劳。选错了，就用你的脑袋来赔。
        - id: ch04-b03
          speaker: narrator
          text: 女妖一走，小儿子想了一会儿，便呼唤两位朋友。
        - id: ch04-b04
          speaker: youngest_son
          text: 特里蒂尔、利蒂尔，请快来帮我！
        - id: ch04-b05
          speaker: narrator
          text: 转眼间，他看见两个老人从远处赶来一头公牛。那是他平生见过的最大的一头牛。等他们走近，特里蒂尔把牛杀死，利蒂尔取出牛心，交给小儿子烹煮。两位老人随即一起动手，把牛角做成酒杯。
        - id: ch04-b06
          speaker: narrator
          text: 三个人一边快活地说笑，一边轻快地干活。小儿子告诉两位朋友，只要按要求完成差事，女妖不但会放他自由，还答应给他三件东西作为酬劳。两位老人听了，便嘱咐他该挑哪三样。
        - id: ch04-b07
          speaker: litill
          text: 记住，要她床脚的箱子、床上面放着的东西，还有洞穴一侧下面藏着的东西。
        - id: ch04-b08
          speaker: narrator
          text: 小儿子谢过他们的指点。特里蒂尔和利蒂尔向他告别，还说眼下他已不再需要他们帮助。两位老人刚刚消失，女妖便回到洞中。她看见公牛已经宰好，牛心煮熟了，牛角酒杯也已经做成，一切都完全照她的吩咐准备妥当。
        - id: ch04-b09
          speaker: ogress
          text: 朋友，这些也不是你独自办成的。不过我会守信，明天放你走。
        - id: ch04-b10
          speaker: narrator
          text: 他们各自睡下，一直睡到天亮。太阳升起时，女妖叫醒小儿子，让他从洞里任意挑选三样东西。
        - id: ch04-b11
          speaker: youngest_son
          text: 我要你床脚的箱子、床上面放着的东西，还有洞穴一侧下面藏着的东西。
        - id: ch04-b12
          speaker: ogress
          text: 朋友，这三样东西不是你自己选中的。但我答应过你，就一定会给。
        - id: ch04-b13
          speaker: narrator
          text: 女妖果然把三件酬劳交给了他。
    - id: ch05
      title: 公主回到王国
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 原来，床上面放着的东西正是失踪的公主。床脚的那只箱子装满了黄金和宝石。至于洞穴一侧下面藏着的东西，则是一艘有桨有帆的大船。这艘船不用人推动，无论在水上还是陆地，都能自行前进。
        - id: ch05-b02
          speaker: ogress
          text: 你真是有史以来最幸运的人。
        - id: ch05-b03
          speaker: narrator
          text: 女妖说完，像平日一样离开了洞穴。箱子沉得厉害，小儿子费了九牛二虎之力，才把它扛上肩头，搬进船舱，公主一路走在他身旁。随后，小儿子掌住船舵，驾着那艘奇异的大船，回到了公主父亲的王国。
        - id: ch05-b04
          speaker: narrator
          text: 国王终于见到失踪的女儿，欢喜得差点昏过去。等他缓过神，便让小儿子把事情的全部经过如实讲清楚。小儿子从离家讲起，说到两个哥哥留下的衣物和残骨，讲到女妖的三项差事，也讲了特里蒂尔、利蒂尔和群鸟怎样赶来帮助自己。
        - id: ch05-b05
          speaker: king
          text: 是你找到了我的女儿，她就该嫁给你。
        - id: ch05-b06
          speaker: narrator
          text: 于是，小儿子与公主结为夫妻。这个故事也就讲完了。
        - id: ch05-b07
          speaker: narrator
          text: 这个故事选自《匈牙利童话》。
