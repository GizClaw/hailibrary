  chapters:
    - id: ch01
      title: The Two Elder Brothers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a princess so beautiful and good that everyone loved her. Her father could hardly bear to let her out of his sight. Then one day she disappeared. The whole kingdom was searched from end to end, but no one could find her. The king nearly died of grief. At last he proclaimed that whoever brought her home would have her as his wife. Young men everywhere began searching again, but they all came sadly home with nothing.
        - id: ch01-b02
          speaker: narrator
          text: Not far from the palace lived an old man with three sons. Their parents let the two older sons do whatever they pleased, while the youngest always had to give way. When the boys were grown, the eldest said he was tired of his quiet life and meant to go see the world. His parents hated to lose him, but they gathered everything he needed, including new boots. He said farewell and set off cheerfully.
        - id: ch01-b03
          speaker: narrator
          text: For several miles, his road wound through a wood. Then it suddenly opened onto a bare hillside. He sat down to rest, pulled out his food bag, and prepared to eat his dinner. He had taken only a few bites when a poorly dressed old man passed by. Seeing the food, the stranger asked whether the young man could spare him a little.
        - id: ch01-b04
          speaker: eldest_son
          text: Share with you? No. I hardly have enough for myself. If you need food, go earn it.
        - id: ch01-b05
          speaker: narrator
          text: The beggar went on. Hours later, the young man stopped on another hill for bread and milk. An old man even more miserable than the first begged for a few bites. He received only cruel words and limped sadly away.
        - id: ch01-b06
          speaker: narrator
          text: Near evening, the traveler came to a clearing and decided it was time for supper. Birds saw the food and gathered thickly around his head, hoping for crumbs. He threw stones at them until they scattered in fright. Then he looked for a place to sleep. The clearing was too bare and cold, so although the long walk had exhausted him, he dragged himself onward in search of shelter.
        - id: ch01-b07
          speaker: narrator
          text: At last he found a deep hollow like a cave beneath a great rock. It seemed completely empty, so he went inside and lay down in a corner. Around midnight, a noise woke him. He peered out and saw a terrible ogress coming toward the cave. He begged her not to hurt him and pleaded for permission to stay through the rest of the night.
        - id: ch01-b08
          speaker: narrator
          text: The ogress agreed, but only if he spent the next day doing whatever work she chose. He accepted at once and went back to sleep. In the morning she ordered him to sweep every bit of dirt from the cave before she returned, warning that failure would go badly for him.
        - id: ch01-b09
          speaker: narrator
          text: He took up the spade and tried to clean the cave, but no matter how hard he worked, the dirt clung to the same spot. Soon he quit and sulked in a corner. He wondered why she had given him an impossible task and what punishment she would choose. He did not wait long to learn. As soon as she came home, the ogress took one look at the dirty floor. Then she struck him on the head so hard that his skull cracked, and that was the end of him.
        - id: ch01-b10
          speaker: narrator
          text: Meanwhile, the second brother also tired of home. He gave his parents no peace until they agreed to provide food and new boots and let him see the world. On the road, he met the same two beggars. They asked for a little bread and milk, but no one had ever taught him to help others. All his life he had made a rule of keeping everything for himself. He ignored their pleas and finished his dinner alone. In time, he too reached the cave. The ogress ordered him to clean its floor, but he did no better than his brother, and his fate was exactly the same.

    - id: ch02
      title: The Youngest Son Finds Friends
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: You might think the old couple would have treated their last son kindly, even if they did not love him. Instead, they could hardly stand to see him, though he worked much harder for their comfort than his brothers ever had. When he asked to go into the world, they agreed at once and seemed glad to be rid of him. They even thought themselves generous for giving him new boots and some bread and milk.
        - id: ch02-b02
          speaker: narrator
          text: The young man wanted to see the world, but even more, he wanted to learn what had happened to his brothers. He decided to trace their journey as closely as he could. He followed the road from his father's cottage until he reached the first hill. He felt sure his brothers must have stopped there, so he chose the same place to rest.
        - id: ch02-b03
          speaker: narrator
          text: He was hungry and tired. Just as he took out his food, the old man appeared and asked for a little. The young man broke off some bread at once, invited the stranger to sit beside him, and treated him like an old friend. When the old man rose to leave, he made him a promise.
        - id: ch02-b04
          speaker: tritill
          text: If trouble ever finds you, call me and I'll help. My name is Tritill.
        - id: ch02-b05
          speaker: narrator
          text: Then Tritill vanished, and the young man could not tell where he had gone. Still, he had rested long enough and knew he should continue. At the next hill, the second old man met him. The young man gave this stranger food and drink just as freely as he had shared with the first.
        - id: ch02-b06
          speaker: litill
          text: If you need help with anything at all, call for me. My name is Litill.
        - id: ch02-b07
          speaker: narrator
          text: The young man walked on until he reached the clearing in the wood, where he stopped for dinner. It seemed as if every bird in the world came wheeling around his head. He crumbled bread for them and watched them dart down until every crumb was gone. Then the largest bird, whose feathers were the brightest of all, spoke to him.
        - id: ch02-b08
          speaker: bright_bird
          text: Whenever you're in trouble, say, “My birds, come to me!” We will come.
        - id: ch02-b09
          speaker: narrator
          text: Then all the birds flew away. Toward evening, the young man reached the cave where his brothers had died. Like them, he thought it would make a good place to sleep. But when he looked around, he saw scraps of the dead men's clothing and pieces of their bones. The sight made him shiver. Even so, he refused to leave. He understood that an ogress must live there, and he resolved to wait for her return.
        - id: ch02-b10
          speaker: narrator
          text: Soon she came striding inside. He politely asked for a night's lodging. As before, she said he could stay only if he did whatever work she gave him in the morning. He accepted the bargain, curled up in a corner, and slept.

    - id: ch03
      title: The Cave and the Feathers
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: By morning, the dirt on the cave floor lay thicker than ever. The young man took the spade and began to work, but he could clear no more of it than his brothers had. At last the spade itself stuck fast in the earth. He tugged at it, but could not pull it free. He stared at the trapped tool in despair. Then the old beggar's promise flashed into his mind.
        - id: ch03-b02
          speaker: youngest_son
          text: Tritill! Tritill, come help me!
        - id: ch03-b03
          speaker: narrator
          text: Tritill appeared beside him and asked what he needed. The young man told him the whole story. When he had heard it, Tritill gave an order.
        - id: ch03-b04
          speaker: tritill
          text: Spade and shovel, get to work!
        - id: ch03-b05
          speaker: narrator
          text: At once the tools danced around the cave. Before long, not one speck of dust remained. As soon as the floor was clean, Tritill left.
        - id: ch03-b06
          speaker: narrator
          text: The young man waited happily for the ogress. She came in, examined the cave, and knew what had happened.
        - id: ch03-b07
          speaker: ogress
          text: You didn't clean this place by yourself. Still, the floor is clean, so you may keep your head.
        - id: ch03-b08
          speaker: narrator
          text: The next morning, she told him to empty all her pillows and spread the feathers in the sun. If even one feather was gone when she returned that night, she would take his head.
        - id: ch03-b09
          speaker: narrator
          text: The young man fetched the pillows and shook every feather out. There were more than he could have imagined. As he carefully spread them in the sun, he thought how lucky he was that the day was bright and the air was still. Then a breeze sprang up without warning. In an instant, the feathers were dancing high overhead. At first he chased after them and tried to collect them again. He soon saw it was useless, and despair came over him.
        - id: ch03-b10
          speaker: youngest_son
          text: Tritill, Litill, and all my birds, come help me!
        - id: ch03-b11
          speaker: narrator
          text: They all appeared almost before he finished calling. The birds flew after the scattered feathers and brought every one of them back. Then Tritill, Litill, and the young man gathered the feathers and stuffed them into the pillows as the ogress had ordered. The helpers kept one tiny feather aside. They told him that if the ogress noticed it was missing, he should push it up her nose. Then Tritill, Litill, and all the birds vanished as suddenly as they had come.
        - id: ch03-b12
          speaker: narrator
          text: The moment the ogress returned, she threw her whole weight onto the bed, and the cave trembled. The pillows were soft and full, which surprised her, but she was not satisfied. She rose, emptied each pillowcase, and began counting every feather.
        - id: ch03-b13
          speaker: ogress
          text: If a single one is gone, I'll have your head.
        - id: ch03-b14
          speaker: narrator
          text: The young man pulled the hidden feather from his pocket and thrust it up her nose.
        - id: ch03-b15
          speaker: youngest_son
          text: If you're looking for your last feather, here it is!
        - id: ch03-b16
          speaker: ogress
          text: You didn't sort all those feathers alone. But I'll let it pass this time.

    - id: ch04
      title: The Great Ox and the Three Choices
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The young man slept soundly in his corner that night. In the morning, the ogress gave him another task. Before she returned, he must kill one of her great oxen, cook its heart, and turn its horns into drinking cups. Her herd held fifty oxen, and he had to guess which one she meant. If he chose correctly, he would be free to go wherever he wished the next day. He could also choose three things as payment for his service. But if he killed the wrong ox, his head would pay for the mistake.
        - id: ch04-b02
          speaker: narrator
          text: When she had gone, the young man thought for a moment and called for his friends.
        - id: ch04-b03
          speaker: youngest_son
          text: Tritill, Litill, come help me!
        - id: ch04-b04
          speaker: narrator
          text: In an instant he saw them far away, driving the biggest ox he had ever seen. They brought it straight toward him. When they reached the cave, Tritill killed the animal. Litill removed its heart and handed it to the young man to cook. Then both old men quickly began turning the horns into drinking cups.
        - id: ch04-b05
          speaker: narrator
          text: The work went merrily, and the three friends talked as they finished it. The young man told them about the payment the ogress had promised if he obeyed her. The old men warned him exactly what to ask for. He must choose the chest at the foot of her bed, whatever lay on top of the bed, and whatever lay beneath the side of the cave. He thanked them for their advice. Tritill and Litill took their leave, saying that for now he would need them no more.
        - id: ch04-b06
          speaker: narrator
          text: The ogress returned almost as soon as they disappeared. She found the ox slain, its heart cooked, and its horns made into cups. Everything was ready exactly as she had ordered. Before eating the ox's heart, she turned to the young man.
        - id: ch04-b07
          speaker: ogress
          text: My friend, you didn't do all this alone. Even so, I'll keep my promise. Tomorrow you may go wherever you please.
        - id: ch04-b08
          speaker: narrator
          text: They slept until dawn. When the sun rose, the ogress woke him and told him to choose any three things in her home.
        - id: ch04-b09
          speaker: youngest_son
          text: I choose the chest at the foot of your bed, whatever is lying on top of the bed, and whatever is underneath the side of the cave.
        - id: ch04-b10
          speaker: ogress
          text: You didn't make those choices by yourself, my friend. But I gave my word, and I'll honor it.
        - id: ch04-b11
          speaker: narrator
          text: Then she handed over all three rewards. The mysterious thing on top of the bed turned out to be the missing princess. The chest at the foot of the bed proved to be filled with gold and precious stones. And beneath the side of the cave, the young man found a great ship with oars and sails. No one needed to pull or push it. The vessel moved by itself over land as easily as it sailed through water.
        - id: ch04-b12
          speaker: ogress
          text: You are the luckiest man who was ever born.
        - id: ch04-b13
          speaker: narrator
          text: And with that, the ogress went out of the cave as she always did.

    - id: ch05
      title: The Princess Comes Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The chest was terribly heavy. With great difficulty, the young man lifted it onto his shoulders and carried it aboard the ship. The princess walked at his side as he brought the treasure from the cave. Once they were both aboard, he took the helm. The wonderful vessel bore them all the way back to her father's kingdom.
        - id: ch05-b02
          speaker: narrator
          text: When the king received his lost daughter again, his joy was so great that he nearly fainted. After he recovered, he made the young man tell him how everything had truly happened. He listened to the whole account. Then, remembering the proclamation he had sent throughout the kingdom, the king kept his promise.
        - id: ch05-b03
          speaker: king
          text: You found my daughter, and you shall marry her.
        - id: ch05-b04
          speaker: narrator
          text: And so they were married. That is the end of the story.
