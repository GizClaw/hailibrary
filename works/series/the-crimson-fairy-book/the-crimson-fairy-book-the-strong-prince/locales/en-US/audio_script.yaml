  chapters:
    - id: ch01
      title: The Sword in the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king who loved wine so much that he could not sleep unless a great flask was tied to his bedpost. All day he drank, until he was too muddled to govern, and everything in his kingdom fell into ruin. Then one day, as he rode beneath a tree, a falling branch struck his head. He tumbled from his horse and died there on the ground.
        - id: ch01-b02
          speaker: narrator
          text: His wife and son grieved deeply. Whatever his faults, he had always treated them kindly. They left the crown and the country behind and wandered away without caring where the road led.
        - id: ch01-b03
          speaker: narrator
          text: At last they came to a forest. Tired from walking, they sat under a tree and ate the bread they had brought.
        - id: ch01-b04
          speaker: queen
          text: My son, I'm thirsty. Please bring me some water.
        - id: ch01-b05
          speaker: narrator
          text: The prince rose at once and followed the gurgle of a brook nearby. He filled his hat with water and carried it back to his mother. Then he returned and followed the stream upward. At its source, water bubbled cold, clear, and fresh from a rock. He bent over the deep pool to drink and saw the reflection of a sword. It was hanging from a branch above his head.
        - id: ch01-b06
          speaker: narrator
          text: He started back in surprise. A moment later, he climbed the tree, cut the rope that held the sword, and carried the weapon to his mother. She took it in both hands and examined it closely, amazed to find such a splendid thing in that lonely forest. The sword was made in a curious way, worked with gold, and words were carved into its handle.
        - id: ch01-b07
          speaker: narrator
          text: The words promised that whoever could buckle on the sword would become stronger than other men. The queen read them with rising joy and urged her son to try it at once. He fastened the sword around his waist, and strength seemed to glow through his whole body. He seized a thick oak and pulled it from the earth as easily as a weed.

    - id: ch02
      title: The Robbers' Cave
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Hope returned to the queen and her son, and they walked on. Night came, and the darkness grew so thick it seemed you could cut it with a knife. Fearing wolves and other wild beasts, they felt their way forward hand in hand. Then the prince tripped over something across the path.
        - id: ch02-b02
          speaker: narrator
          text: He could not see what had caught his foot, so he bent down and tried to lift it. The thing was terribly heavy. Even with the sword's strength, he thought the strain would break his back. One last great heave sent it rolling aside. Only then did he know it was a huge rock. Behind it stood a cave. A bright fire burned at the back, and everything showed that robbers lived there, though none of them was at home.
        - id: ch02-b03
          speaker: narrator
          text: The prince quickly put out the fire and told his mother to come inside and make no sound. Then he paced back and forth, listening for the robbers. He was so tired that, despite every effort, he could hardly keep his eyes open. Just then, he heard the robbers coming along the path, shouting and singing as they marched. Their songs stopped. In worried voices they began asking what had happened to their cave and why its fire was dark.
        - id: ch02-b04
          speaker: robber_captain
          text: This has to be the place. Yes, here's the ditch by the entrance. Someone let the fire burn out before we left, that's all. Each man can jump across and call, “Hop! I'm here.” I'll come last. Go on, then.
        - id: ch02-b05
          speaker: narrator
          text: The first robber jumped. Before he could call out, the prince's sword swept silently, and the man's head rolled into a corner.
        - id: ch02-b06
          speaker: prince
          text: Hop! I'm here.
        - id: ch02-b07
          speaker: narrator
          text: Hearing the signal, the second robber leaped over without fear and met the same end. One after another they came, until eleven robbers lay dead and only their captain remained.
        - id: ch02-b08
          speaker: narrator
          text: The captain had wrapped his dead wife's shawl around his neck, and the prince's sword struck it without harming him. The cunning robber did not fight back. Instead, he rolled over and pretended to be dead. The prince was no fool. He watched and wondered whether the captain was truly dead, but the man lay so stiff and still that at last the prince was deceived.
        - id: ch02-b09
          speaker: narrator
          text: The prince dragged all the headless bodies into a chamber and locked the door behind them. Then he and his mother searched the robbers' home until they found food. They ate their fill, lay down, and slept peacefully for the rest of the night.
        - id: ch02-b10
          speaker: narrator
          text: At dawn, they both woke and stared around them. The cave they had entered the night before had become a splendid castle filled with beautiful rooms. The prince went through them all, carefully locked each door, and left the keys with his mother while he went out to hunt.

    - id: ch03
      title: The Giant and the Betrayal
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The queen could not bear knowing that any door was closed to her. As soon as her son was out of sight, she unlocked one room after another and peeped inside. At last she reached the chamber where the robbers lay. The blood on the floor made her feel faint, but seeing the robber captain alive and walking back and forth shocked her even more. She quickly turned the key in the lock again and ran to the room where she had slept.
        - id: ch03-b02
          speaker: narrator
          text: Her son soon returned with a large bear he had killed for supper. It gave them enough food for many days, so the next morning he explored the castle instead of hunting. He discovered a secret way leading out into the forest. Following its path, he came to another castle, larger and finer than the robbers' home. He pounded on the door with his fist and said he wanted to come in.
        - id: ch03-b03
          speaker: giant
          text: I know who you are. I want nothing to do with robbers.
        - id: ch03-b04
          speaker: prince
          text: I'm not a robber. I'm a king's son, and I killed the whole band. Open this door now, or I'll break it down and send your head after theirs.
        - id: ch03-b05
          speaker: narrator
          text: The door stayed shut. The prince put one shoulder against it, and the wood began to crack at once. The giant saw that holding it closed was useless, so he opened it.
        - id: ch03-b06
          speaker: giant
          text: You're a brave young man. Let us be friends, not enemies.
        - id: ch03-b07
          speaker: narrator
          text: The prince gladly agreed. He had caught sight of the giant's beautiful daughter, and from then on he visited the giant's castle often.
        - id: ch03-b08
          speaker: narrator
          text: Meanwhile, the queen was lonely in her own castle. To amuse herself, she began visiting the robber captain. He flattered her until she agreed to marry him. But she feared what her son would do. She told the captain to wait until the prince went bathing, steal the sword from above his bed, and wear it himself. Without the sword, she said, the prince could not punish him.
        - id: ch03-b09
          speaker: narrator
          text: The captain thought her advice was good. The next morning, while the prince bathed in the river, the robber unhooked the sword from its nail and buckled it around his own waist. When the prince returned, the captain stood waiting on the castle steps and waved the blade over his head. The prince knew some dreadful fate awaited him. He fell to his knees and begged for mercy, but asking the robber was like trying to squeeze blood from a stone.
        - id: ch03-b10
          speaker: narrator
          text: The captain spared his life, but tore out both his eyes and shoved them into his hand.
        - id: ch03-b11
          speaker: robber_captain
          text: Here, keep these. Perhaps you'll find a use for them!
        - id: ch03-b12
          speaker: narrator
          text: Weeping, the blind prince felt his way to the giant's castle and told him everything.

    - id: ch04
      title: The Sword Recovered
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The giant was full of pity for the poor young man. He anxiously asked what the prince had done with his eyes. Without a word, the prince took them from his pocket and placed them in the giant's hands. The giant washed them carefully and put them back into the prince's head. For three days the prince lay in complete darkness. Then light slowly returned, and before long his sight was as good as ever.
        - id: ch04-b02
          speaker: narrator
          text: The prince rejoiced at having his eyes again, but he grieved over the lost sword. Worst of all, his bitter enemy now possessed it.
        - id: ch04-b03
          speaker: giant
          text: Don't trouble yourself, my friend. I'll bring your sword back.
        - id: ch04-b04
          speaker: narrator
          text: The giant called for the monkey who served as head of his household.
        - id: ch04-b05
          speaker: giant
          text: Take the fox and the squirrel with you, and fetch the prince's sword.
        - id: ch04-b06
          speaker: narrator
          text: The monkey, fox, and squirrel left at once. They traveled one on another's backs, and because the monkey disliked walking, he was usually perched on top. As soon as they reached the window of the robber captain's room, the monkey sprang from the backs of his two companions and climbed inside.
        - id: ch04-b07
          speaker: narrator
          text: No one was there, and the sword hung from a nail. The monkey took it down, buckled it around his waist as he had seen the prince do, and swung out through the window. Then he climbed onto the fox and squirrel again, and all three hurried home.
        - id: ch04-b08
          speaker: narrator
          text: The giant told the monkey to hand over the sword. The prince fastened it around his own waist once more and raced back to the robbers' castle.

    - id: ch05
      title: The Prince's Return
      blocks:
        - id: ch05-b01
          speaker: prince
          text: Come out, you scoundrel! Come and answer for what you did to me. Now you'll learn who rules this house!
          emotion: angry
        - id: ch05-b02
          speaker: narrator
          text: His shouting brought the robber into the room. The captain glanced up at the place where the sword usually hung, but the nail was empty. Without thinking, he turned toward the prince's hand and saw the blade gleaming brightly there. Now it was the robber's turn to drop to his knees and beg for mercy, but he was too late.
        - id: ch05-b03
          speaker: narrator
          text: The prince did to the robber what the robber had done to him. He blinded the captain, drove him outside, and sent him tumbling into a deep hole, where he remains to this day. The prince sent his mother back to her father and never saw her again.
        - id: ch05-b04
          speaker: narrator
          text: Then he returned to the giant with one last request.
        - id: ch05-b05
          speaker: prince
          text: My friend, you have already shown me so much kindness. Grant me one thing more. Let me marry your daughter.
        - id: ch05-b06
          speaker: narrator
          text: The giant agreed, and the prince and the giant's daughter were married. Their wedding feast was so splendid that there was not a kingdom in the whole world that did not hear of it.
        - id: ch05-b07
          speaker: narrator
          text: The prince never returned to his father's throne. He lived peacefully with his wife in the forest, and if they have not died, they are living there still.
