audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and storylike
        timbre: clear and mellow
        pace: measured
        pitch: medium
    prince:
      display_name: The Prince
      tts:
        delivery: brave, direct, and resolute
        timbre: youthful and ringing
        pace: steady
        pitch: medium
    queen:
      display_name: The Queen
      tts:
        delivery: dignified, restless, and persuasive
        timbre: mature and clear
        pace: measured
        pitch: medium
    robber_captain:
      display_name: The Robber Captain
      tts:
        delivery: sly, harsh, and commanding
        timbre: rough and dark
