audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而带几分诙谐，像在讲一则古老的欧洲童话
        timbre: 温暖清亮
        pace: 舒缓，转折处有自然停顿
        pitch: 中音
    prince:
      display_name: 王子
      tts:
        delivery: 年轻勇敢，面对敌人果断有力，受难时悲痛而不失坚韧
        timbre: 清朗结实
        pace: 中速
        pitch: 中音
    queen:
      display_name: 王后
      tts:
        delivery: 起初慈爱端庄，后来孤寂软弱，言语里藏着不安
        timbre: 柔和成熟
        pace: 中速偏慢
        pitch: 中音
    robber_captain:
      display_name: 强盗头目
      tts:
        delivery: 狡猾阴狠，发号施令时粗鲁，得势时冷酷嘲弄
        timbre: 粗哑低沉
        pace: 中速
        pitch: 低音
    giant:
      display_name: 巨人
      tts:
        delivery: 起初戒备威严，结交以后厚道可靠，说话直截了当
        timbre: 洪亮浑厚
        pace: 舒缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 林中的宝剑
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有位国王，嗜酒如命。夜里，床柱上若不拴着满满一壶酒，他就睡不着。白天，他又总是喝得昏昏沉沉，根本无心料理国事，整个王国渐渐衰败下去。一天，一根树枝忽然落下，正中他的头。他从马背摔到地上，当场死去了。
        - id: ch01-b02
          speaker: narrator
          text: 国王虽有许多过错，对妻子和儿子却一向慈爱。母子俩为他伤心不已，索性舍弃王位，离开故国。他们不知道要去哪里，也不在乎会走到什么地方。
        - id: ch01-b03
          speaker: narrator
          text: 两人一路流浪，来到一片森林。走累以后，他们坐在树下，吃掉随身带来的面包。王后觉得口渴，便叫儿子去取水。
        - id: ch01-b04
          speaker: queen
          text: 儿子，我渴了。去替我取些水来吧。
        - id: ch01-b05
          speaker: narrator
          text: 王子立刻起身，循着潺潺的水声找到一条小溪。他俯下身，用帽子盛满清水，送回去给母亲喝。随后，他又沿着溪流向上走，一直来到岩石间的泉眼。清澈冰凉的泉水正从那里汩汩涌出。他跪到岩石下的深潭边，刚要俯身喝水，忽然看见水面映出一把剑。那把剑就悬在他头顶的树枝上。
        - id: ch01-b06
          speaker: narrator
          text: 王子先是吓得退了一步，随即爬上树，割断绳子，把剑带回母亲身边。荒僻的森林里竟有这样华美的宝物，王后十分惊奇。剑上饰着黄金，做工奇巧，剑柄还刻着一句话。谁能将它佩在腰间，谁就会比常人更有力量。王后满心欢喜，催儿子赶紧试一试。
        - id: ch01-b07
          speaker: narrator
          text: 王子把剑系好，顿觉一股灼热的力量流遍全身。他抓住一棵粗壮的橡树，像拔野草一样，轻轻松松便把它连根拔了起来。母子俩重新有了精神，继续向森林深处走去。
    - id: ch02
      title: 强盗的洞穴
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 夜色越来越浓，黑暗仿佛用刀都能割开。母子俩害怕狼和其他猛兽，不敢露宿，只好手牵着手，在林中摸索前行。王子忽然被横在路上的东西绊倒了。他什么也看不见，只能弯腰试着去搬。那东西重得出奇，他使劲时只觉得腰都快断了。最后，他猛一发力，终于把它挪到路旁。东西落下时，他才听出那是一块巨石。石头后面藏着强盗的洞穴，里面却空无一人。
        - id: ch02-b02
          speaker: narrator
          text: 洞穴深处的火烧得正旺，王子赶紧把它扑灭，叫母亲进来藏好，千万别出声。自己则守在洞口来回走动，留心等着强盗回来。他实在困得厉害，无论怎样强撑，都快要睁不开眼了。就在这时，林中传来了叫喊和歌声。强盗们一路唱着回来了。歌声很快停住。他们看不见往日的火光，也找不到洞口，便焦急地议论起来。王子侧耳细听，听见一个像是头目的声音。
        - id: ch02-b03
          speaker: robber_captain
          text: 就是这里，我已经摸到洞口前的沟了。准是有人忘了添柴，火才灭了。你们一个个跳过去，落地就喊一声“嗨，我到了”。我最后再过。开始吧！
        - id: ch02-b04
          speaker: narrator
          text: 第一个强盗才跳过沟，还没来得及出声，王子的剑便迅疾无声地落下，他的头滚进了角落。王子立刻替他回答。
        - id: ch02-b05
          speaker: prince
          text: 嗨，我到了。
        - id: ch02-b06
          speaker: narrator
          text: 第二个强盗听见暗号，放心地跳了过来，也落得同样下场。没过多久，十一个强盗都死了，只剩下头目。头目脖子上缠着亡妻留下的披巾，王子的剑落到上面，竟没伤他分毫。他十分狡猾，既不反抗，也不出声，只顺势滚到一旁，装得和其他人一样死透了。王子也不傻，心里一直怀疑，可见他躺得又僵又直，最终还是上了当。
        - id: ch02-b07
          speaker: narrator
          text: 王子把所有无头尸体拖进洞穴的一间密室，锁上房门。他和母亲又将整个地方搜了一遍，终于找到食物。两人吃饱以后，便躺下安稳地睡了一觉。黎明时一同醒来，他们发现昨夜走进的洞穴竟变成了富丽堂皇的城堡，里面满是漂亮的房间。王子逐间查看，又一扇扇仔细锁好，把所有钥匙交给母亲保管，自己出门打猎去了。
        - id: ch02-b08
          speaker: narrator
          text: 可惜，王后也和世上所有女人一样，一想到还有什么事情是自己不知道的，便怎么也忍不住。儿子刚一转身，她就打开所有房门，一间间探头偷看。来到关强盗的屋子时，满地鲜血已经让她头晕，那个本该死去的强盗头目竟还在里面来回走动，更把她吓得魂不附体。她赶紧重新锁门，逃回自己睡过的寝室。
    - id: ch03
      title: 巨人的城堡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 没过多久，王子带着一头为晚餐猎杀的大熊回来。食物足够母子俩吃上许多天，第二天早晨，他便没有出猎，而是在城堡里四处探索。他发现一条密道通向森林，顺着小路走去，又来到一座更大、更华丽的城堡前。他举起拳头敲门，说自己要进去。城堡的主人是个巨人，只隔着紧闭的大门回答。
        - id: ch03-b02
          speaker: giant
          text: 我知道你是谁。我可不跟强盗打交道。
        - id: ch03-b03
          speaker: prince
          text: 我不是强盗，我是国王的儿子。那一伙强盗全被我杀了。你若再不开门，我就破门进去，让你的脑袋也去和他们凑在一起。
        - id: ch03-b04
          speaker: narrator
          text: 王子等了一会儿，门仍旧紧闭。他只用肩膀轻轻一顶，木门就咔嚓作响。巨人知道再也挡不住，只得开门。
        - id: ch03-b05
          speaker: giant
          text: 看来你是个勇敢的年轻人。好吧，我们和平相处。
        - id: ch03-b06
          speaker: narrator
          text: 王子很乐意答应，因为他已经瞥见巨人美丽的女儿。从那以后，他常常去巨人的城堡。王后却独自留在家中，日子十分无聊。为了排遣寂寞，她时常探望强盗头目。那头目用甜言蜜语奉承她，终于哄得她答应嫁给自己。可是王后十分害怕儿子，便教强盗等王子下次去河里洗澡时，从床头偷走宝剑。没有了剑，王子便再没有力量惩罚他的胆大妄为。
        - id: ch03-b07
          speaker: narrator
          text: 第二天早晨，王子刚去洗澡，强盗便从钉子上取下宝剑，佩到自己腰间。王子回来时，看见他站在城堡台阶上，把宝剑举过头顶挥舞，立刻知道可怕的灾祸就要临头。他跪下来苦苦求饶，可想让强盗发慈悲，就像要从石头里挤出血一样不可能。强盗倒是饶了王子的命，却挖出他的两只眼睛，塞进他手里，还凶狠地嘲弄他。
        - id: ch03-b08
          speaker: robber_captain
          text: 拿着，还是你自己收好吧！说不定以后用得着呢！
        - id: ch03-b09
          speaker: narrator
          text: 失明的王子一路哭泣，摸索着走到巨人那里，将事情从头说起。巨人十分怜悯他，又焦急地问眼睛去了哪里。王子默默从口袋里取出双眼。巨人仔细洗净，重新放回他的眼眶。王子在黑暗中躺了三天，随后光明渐渐回来，不久便看得和从前一样清楚。
        - id: ch03-b10
          speaker: narrator
          text: 王子为复明欣喜不尽，却又为宝剑落到死敌手中悲痛万分。巨人听完，马上安慰他。
        - id: ch03-b11
          speaker: giant
          text: 别担心，我的朋友。我会替你把剑拿回来。
          emotion: calm
    - id: ch04
      title: 夺回宝剑
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 巨人唤来担任总管的猴子。交代完任务以后，三个仆从立刻动身，一个骑在另一个背上。猴子不爱走路，通常都坐在最上面。
        - id: ch04-b02
          speaker: giant
          text: 叫狐狸和松鼠跟你一起去，把王子的宝剑取回来。
        - id: ch04-b03
          speaker: narrator
          text: 它们一来到强盗头目的窗前，猴子就从狐狸和松鼠背上一跃而起，爬进屋里。房间里空无一人，宝剑正挂在钉子上。猴子取下宝剑，想起自己见过王子怎样佩剑，便照样把它系在腰间。随后，它攀着窗户荡到外面，重新骑上两个伙伴，匆匆赶回主人身边。巨人叫它把剑交还王子。王子重新将剑佩好，立刻飞奔回城堡。
        - id: ch04-b04
          speaker: prince
          text: 出来，你这恶棍！出来，你这混账！你害我受了那么大的罪，现在该偿还了。我要让你看看，这座屋子里究竟谁才是主人！
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 强盗听见喊声，走进房间。他先望向平日挂剑的地方，那里已经空了，又立刻看向王子的手。宝剑正在王子手中闪闪发亮。这回轮到强盗跪地求饶，可是太迟了。他怎样伤害王子，王子也怎样惩罚他。强盗被弄瞎双眼，赶出城堡，跌进一个深坑，直到今天还留在那里。
        - id: ch04-b06
          speaker: narrator
          text: 王子把母亲送回她父亲身边，从此再也不肯见她。随后，他回到巨人的城堡，请这位朋友再答应一件事。
    - id: ch05
      title: 森林里的婚礼
      blocks:
        - id: ch05-b01
          speaker: prince
          text: 我的朋友，你已经给了我这么多恩惠。请再答应我一件事，把你的女儿嫁给我吧。
        - id: ch05-b02
          speaker: narrator
          text: 于是，王子和巨人的女儿成了婚。婚宴盛大无比，世上每个王国都听说了这件喜事。王子没有回去继承父亲的王位，而是与妻子留在森林里，平静地生活。倘若他们尚未死去，想必直到今天还住在那里。
