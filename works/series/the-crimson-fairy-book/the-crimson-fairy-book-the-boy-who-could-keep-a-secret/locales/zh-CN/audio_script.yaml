audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而带几分诙谐，像在讲一则古老的俄罗斯童话
        timbre: 温暖清亮
        pace: 舒缓，转折处有自然停顿
        pitch: 中音
    boy:
      display_name: 男孩
      tts:
        delivery: 坚定坦率，少年时沉着机敏，面对危险毫不慌乱
        timbre: 清朗坚实
        pace: 中速
        pitch: 中音
    widow:
      display_name: 寡妇
      tts:
        delivery: 急躁强硬，转怒为喜时直白热切
        timbre: 粗朴响亮
        pace: 中速偏快
        pitch: 中高音
    servant:
      display_name: 国王的仆人
      tts:
        delivery: 恭敬谨慎，禀报时清楚利落
        timbre: 平实清楚
        pace: 中速
        pitch: 中音
    first_king:
      display_name: 第一位国王
      tts:
        delivery: 起初慈爱威严，动怒后严厉果决
        timbre: 浑厚庄重
        pace: 中速偏慢
        pitch: 中低音
    eldest_princess:
      display_name: 大公主
      tts:
        delivery: 自信随意，带着年长姐姐的笃定
        timbre: 明亮柔和
        pace: 中速
        pitch: 中高音
    second_princess:
      display_name: 二公主
      tts:
        delivery: 好胜直接，不甘落在姐姐后面
        timbre: 清脆明快
        pace: 中速
        pitch: 中高音
    youngest_princess:
      display_name: 小公主
      tts:
        delivery: 骄傲任性，受挫时尖锐恼怒
        timbre: 清亮纤细
        pace: 中速偏快
        pitch: 高音
    magyar_king:
      display_name: 马扎尔国王
      tts:
        delivery: 王者气度沉稳，忧虑时低沉，求策时郑重
        timbre: 深厚有力
        pace: 中速偏慢
        pitch: 低音
    magyar_princess:
      display_name: 马扎尔公主
      tts:
        delivery: 热烈任性而心地忠诚，劝慰时温柔坚定
        timbre: 明丽饱满
        pace: 中速
        pitch: 中高音
    mason:
      display_name: 石匠
      tts:
        delivery: 朴实爽快，说话简短可靠
        timbre: 粗厚平实
        pace: 中速
        pitch: 中低音
    messenger:
      display_name: 苏丹的使者
      tts:
        delivery: 礼数周全却带着威胁，字句清晰正式
        timbre: 冷静干脆
        pace: 中速
        pitch: 中低音
    witch:
      display_name: 老女巫
      tts:
        delivery: 阴冷狡猾，判断时笃定，威胁时压低声音
        timbre: 苍老尖涩
        pace: 舒缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 土里的宝剑与未说的梦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一个穷寡妇带着独生的小男孩过日子。乍看上去，男孩和千百个普通孩子没有两样。可再瞧一眼，你就会发现他身边总挂着一只剑鞘。奇怪的是，他每长大一点，剑鞘也会跟着变大。与它相配的宝剑，是男孩在花园里找到的，当时剑身正从泥土中露出来。此后每一天，他都把剑拔起，试着插进剑鞘。宝剑明明也在慢慢长长，只是过了很久，剑和鞘仍旧合不到一起。
        - id: ch01-b02
          speaker: narrator
          text: 终于有一天，宝剑顺顺当当地滑进了鞘里。男孩不敢相信，接连试了七回，一回比一回顺。他高兴极了，却决定谁也不说，尤其不能让那个藏不住话的母亲知道。可吃早饭时，母亲还是看出了异样。
        - id: ch01-b03
          speaker: widow
          text: 你怎么了？出了什么事？
        - id: ch01-b04
          speaker: boy
          text: 妈妈，我昨晚做了一个特别美的梦，可我不能告诉任何人。
        - id: ch01-b05
          speaker: widow
          text: 跟我说总可以吧？瞧你这么高兴，那一定是个好梦。
        - id: ch01-b06
          speaker: boy
          text: 不行。等梦成真以后，我才能说。
        - id: ch01-b07
          speaker: widow
          text: 我非要知道不可！你不说，我就一直打到你肯说！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 可无论母亲怎样责骂抽打，男孩都守口如瓶。她打得胳膊发酸，终于停了手。男孩浑身疼痛，跑进花园，跪在小宝剑旁哭。剑正在土洞里自己旋转，别人碰它准会受伤。男孩一伸手，它却立刻停住，安静地进了剑鞘。
        - id: ch01-b09
          speaker: narrator
          text: 男孩坐在地上抽泣了很久。恰好国王乘车从附近经过，远远听见哭声，便叫一个仆人去看看是谁哭得这样伤心。仆人遵命去了，很快又赶回御车前禀报。
        - id: ch01-b10
          speaker: servant
          text: 陛下，是个小男孩在哭。他母亲刚刚打了他。
        - id: ch01-b11
          speaker: first_king
          text: 马上把他带来。告诉他，是国王召见他。国王一生从不流泪，也看不得别人哭泣。
        - id: ch01-b12
          speaker: narrator
          text: 仆人把国王的话带给男孩。男孩听说国王一生不曾哭过，又不愿听见旁人哭，便擦干眼泪，跟着来到御车旁。国王问他愿不愿做自己的儿子。男孩说，只要母亲答应，他就愿意。国王又派仆人回去传话，只要寡妇肯把儿子交给自己，男孩便能住进王宫，等长大成人，还能迎娶他最漂亮的女儿。
        - id: ch01-b13
          speaker: narrator
          text: 寡妇顿时转怒为喜，跑来亲吻国王的手。
        - id: ch01-b14
          speaker: widow
          text: 但愿你在陛下面前，比在我身边时听话一点。
        - id: ch01-b15
          speaker: narrator
          text: 男孩听得又惊又怕。等母亲回到小屋，他请求去花园取回一件东西。国王答应了，他便拔出宝剑，收进剑鞘，坐上御车离开。
        - id: ch01-b16
          speaker: first_king
          text: 你方才为什么哭得那么厉害？
        - id: ch01-b17
          speaker: boy
          text: 母亲打了我，因为我不肯告诉她那个梦。在它成真以前，我谁也不能告诉。
        - id: ch01-b18
          speaker: first_king
          text: 连我也不能知道？
          emotion: surprised
        - id: ch01-b19
          speaker: boy
          text: 是的，陛下，连您也不能。
        - id: ch01-b20
          speaker: first_king
          text: 等我们到家，你自然会说的。
        - id: ch01-b21
          speaker: narrator
          text: 国王微笑着换了话题，一路把男孩带回王宫。
    - id: ch02
      title: 离开王宫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 国王把男孩当作可爱的礼物送到三个女儿面前。男孩生得俊秀，公主们十分喜欢，把最好的玩具都拿给他。一天，国王看着孩子们玩耍，提醒女儿们别把他宠坏，还说他有个谁都问不出的秘密。
        - id: ch02-b02
          speaker: eldest_princess
          text: 他会告诉我的。
        - id: ch02-b03
          speaker: narrator
          text: 男孩摇了摇头。
        - id: ch02-b04
          speaker: second_princess
          text: 那他会告诉我。
        - id: ch02-b05
          speaker: boy
          text: 我才不告诉你。
        - id: ch02-b06
          speaker: youngest_princess
          text: 他一定会告诉我！
        - id: ch02-b07
          speaker: boy
          text: 梦没成真以前，我谁也不说。再有人问，我就打谁。
        - id: ch02-b08
          speaker: narrator
          text: 国王深爱这个孩子，听了很难过，却认定不能把一个不肯服从命令的人留在身边。他吩咐仆人把男孩带走，等男孩真正明白事理以前，再也不许踏进王宫。被领走时，宝剑在腰间响亮地碰着剑鞘。男孩明明什么坏事也没有做，却遭到这样的对待，心里难受极了，可他还是一句话也没有说。
        - id: ch02-b09
          speaker: narrator
          text: 幸好仆人们待他十分和善。仆人家的孩子常来陪伴，还给他送来水果和各种好吃的东西。男孩很快重新快活起来，就这样住在他们中间，一年又一年，直到十七岁生日。与此同时，两位年长的公主已经长大成人，分别嫁给两位势力强大的国王，成了海那边两个辽阔国家的王后。小公主也到了出嫁的年纪，可她挑剔极了。无论哪一位年轻王子前来求婚，她都不屑一顾。
        - id: ch02-b10
          speaker: narrator
          text: 一天，小公主独自坐在王宫里，觉得又无聊又寂寞。她忽然想知道仆人们正在做什么，也许他们住的地方比宫里更有趣。国王正在和大臣们议事，王后又卧病在床，身边没有人能拦住她。公主便匆匆穿过花园，跑向仆人居住的屋舍。她在屋外见到一位青年，那张脸比她见过的任何王子都英俊。只看了一眼，她就认出这正是童年陪自己玩耍的男孩。
        - id: ch02-b11
          speaker: youngest_princess
          text: 告诉我你的秘密，我就嫁给你。
        - id: ch02-b12
          speaker: narrator
          text: 青年记得自己从前的诺言，果真打了她。公主又痛又气，跑去向父亲告状。
        - id: ch02-b13
          speaker: first_king
          text: 他就是有一千条命，我也要一条条全取走！
          emotion: angry
        - id: ch02-b14
          speaker: narrator
          text: 当天，城外就架起了绞刑架。人们从四面八方赶来，都想亲眼看看这个胆敢殴打公主的青年怎样被处死。刽子手把青年押出来，他的双手反绑在背后。四下一片死寂，法官正在宣读判词，他腰间的剑突然铿然作响。紧接着，远处传来一阵轰响，一辆金马车碾过石路疾驰而来，车窗外还飘着一面白旗。马车停在绞刑架下，马扎尔国王走下车，请求留下青年一命。
        - id: ch02-b15
          speaker: first_king
          text: 他打了我的女儿，而她只问了他的秘密。我不能饶他。
        - id: ch02-b16
          speaker: magyar_king
          text: 把他交给我吧，他或许肯对我开口。就算不肯，我还有个美如晨星的女儿，他见了她一定会说。
        - id: ch02-b17
          speaker: narrator
          text: 宝剑第三次响了起来。公主的父亲气恼地说，既然对方这样想要这个囚犯，就把人带走，只是永远别再叫他看见青年的脸。国王向刽子手做了个手势。青年眼上的布带被取下，手腕上的绳索也解开了。他登上金马车，坐到马扎尔国王身旁。车夫挥鞭催马，他们就这样踏上了前往布达的路。
        - id: ch02-b18
          speaker: narrator
          text: 国王先和气地谈了几英里路，等青年放松下来，才问那个惹出大祸的秘密。
        - id: ch02-b19
          speaker: boy
          text: 等它成真，我才可以告诉您。
        - id: ch02-b20
          speaker: magyar_king
          text: 你会告诉我女儿的。
        - id: ch02-b21
          speaker: boy
          text: 我不会告诉任何人。
        - id: ch02-b22
          speaker: narrator
          text: 宝剑又撞响了。国王不再追问，只盼女儿的美貌能让青年改变主意。
    - id: ch03
      title: 高塔里的囚徒
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 前往布达的道路十分漫长，他们走了好几天才终于抵达。父亲的金马车驶进城堡时，马扎尔公主恰好正在花园里采摘玫瑰。等众人都站到城堡前的大理石台阶上，她仔细看清青年，不禁惊喜地叫了起来。从前，无论怎样出色的男子来到面前，她都不肯主动说一句话。这一回，她竟当众为陌生青年惊叹，国王听在耳里，不由得有些不快。
        - id: ch03-b02
          speaker: magyar_princess
          text: 好英俊的青年！父王，您是从仙境带他回来的吗？
          emotion: surprised
        - id: ch03-b03
          speaker: magyar_king
          text: 我是从绞刑架下救回他的。
        - id: ch03-b04
          speaker: magyar_princess
          text: 从哪里来都不要紧。我要嫁给他，只嫁给他，和他相守一生。
        - id: ch03-b05
          speaker: magyar_king
          text: 等你问过他的秘密，准会改变主意。他说到底只是个仆人。
        - id: ch03-b06
          speaker: magyar_princess
          text: 我不在乎，我爱他。他会对我说出秘密，也会住进我心里最深的地方。
        - id: ch03-b07
          speaker: narrator
          text: 国王只是摇头，命人把青年安置在花园的凉亭里。大约一个星期后，公主穿上自己最华美的衣服，亲自去探望他。青年原本正在看书，抬头一见公主如此美丽，书便从手里掉到地上。他连忙站起身，却惊艳得一句话也说不出来。
        - id: ch03-b08
          speaker: magyar_princess
          text: 那个了不得的秘密到底是什么？悄悄告诉我，我就亲你一下。
        - id: ch03-b09
          speaker: boy
          text: 我的天使，聪明些，别再问了，这样你才能平安回宫。我守了这么多年，现在也不会开口。
        - id: ch03-b10
          speaker: narrator
          text: 公主不肯罢休，一再逼问。青年终于重重扇了她一巴掌，打得她鼻血直流。她尖叫着跑回宫，国王看见女儿衣裙上的血，怒不可遏。
        - id: ch03-b11
          speaker: magyar_king
          text: 你这龙崽子，我要把你活活饿死！
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: 国王召来全城的石匠和泥瓦匠，命他们尽快砌一座窄塔。塔里只能留下一张小桌和一只凳子的地方，再多一件东西也不能容下。工匠们立刻动手，只用了两个钟头，整座塔便造好了。他们一同前往王宫复命，路上正好遇见公主。公主拉住一个石匠攀谈，耐心等到其他人都走远，才压低声音提出请求。
        - id: ch03-b13
          speaker: magyar_princess
          text: 能不能在塔上开个别人看不见的小洞？要能递进去一瓶酒和一些食物。
        - id: ch03-b14
          speaker: mason
          text: 当然可以。
        - id: ch03-b15
          speaker: narrator
          text: 石匠马上转身回去，没用几分钟便凿好了洞。日落时，一大群百姓聚在塔外，围观青年被押过来。他的罪行先被当众宣告，随后工匠郑重其事地把塔口砌死。可是每天清晨，公主都会从隐蔽的小洞里送进食物。国王全然不知，每隔三天便派秘书爬上梯子，从高处的小窗向里张望，看看囚犯死了没有。秘书带回的消息却次次一样，青年不但活着，还面色红润，身体也胖了。
        - id: ch03-b16
          speaker: magyar_king
          text: 这里面一定有魔法。
    - id: ch04
      title: 苏丹的两道难题
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 过了一段日子，苏丹派使者送来一封信和三根藤条。使者深深鞠躬，传达主人的命令。
        - id: ch04-b02
          speaker: messenger
          text: 请您分辨这三根藤条。哪根靠近根部，哪根生在中间，哪根长在顶端？答不出来，我的主人就向您宣战。
        - id: ch04-b03
          speaker: narrator
          text: 国王听完使者的话，害怕极了。他接过三根藤条，一根根翻过来，又掉过去，凑近了反复察看。可是无论怎样仔细，他都找不出半点差别。国王想到苏丹强大的军队，脸上的愁容越来越深。公主很快注意到父亲和平日不同，便走来询问他到底遇见了什么难事。
        - id: ch04-b04
          speaker: magyar_king
          text: 苏丹要我分辨三根藤条长在什么位置。答不出，他就发兵。可他的军队比我的强得多，我怎能不发愁？
        - id: ch04-b05
          speaker: magyar_princess
          text: 父王，别绝望，我们一定能找到答案。
          emotion: calm
        - id: ch04-b06
          speaker: narrator
          text: 公主跑到塔下，把难题告诉青年。
        - id: ch04-b07
          speaker: boy
          text: 你照常回去睡觉。醒来以后，就说梦见要把藤条放进温水。沉到底的是根部那一根，停在水中的是中间那一根，浮起来的就是顶端那一根。
        - id: ch04-b08
          speaker: narrator
          text: 第二天早晨，公主一醒来就去见父亲，把这个“梦”原原本本地讲给他听。国王立刻命人端来温水，把三根藤条一同放进去。果然，一根沉底，一根停在水中，一根浮在水面。国王把它们取出来时，又照女儿的建议逐一刻下记号，以免交还使者时弄错。苏丹收到答案，怎么也猜不出国王是从哪里得知的。这一次，他找不到开战的借口，只好作罢。
        - id: ch04-b09
          speaker: narrator
          text: 第二年，苏丹又想找借口同马扎尔国王开战。这回使者牵来三匹小马，要国王在三天内说出哪一匹生在早晨，哪一匹生在正午，哪一匹生在夜晚，否则立刻宣战。国王读完信，心都凉了。他不能指望女儿第二次又碰巧梦到正确答案。更糟的是，一场瘟疫刚刚席卷全国，夺走许多士兵，他的军队比从前更加虚弱。想到这里，国王的脸色阴沉得可怕。公主一眼便看出父亲又有了心事。
        - id: ch04-b10
          speaker: magyar_king
          text: 苏丹要我分辨三匹小马出生的时辰。答不出来，他马上开战。
        - id: ch04-b11
          speaker: magyar_princess
          text: 别灰心，父王，总会有办法的。
          emotion: calm
        - id: ch04-b12
          speaker: narrator
          text: 她再次跑去向青年求助。
        - id: ch04-b13
          speaker: boy
          text: 回去吧，我心中的珍宝。今晚你装作在梦中惊叫，让父王听见。再说你梦见他答不出难题，正要被土耳其人押走，塔里的青年忽然赶来，说出了每匹小马出生的时辰。
        - id: ch04-b14
          speaker: narrator
          text: 公主完全照办。国王一听，立即下令拆塔，把囚犯带到面前。
        - id: ch04-b15
          speaker: magyar_king
          text: 我没想到，你没有食物还能活这么久。你也该悔过了。我可以赦免你，只要你帮我渡过难关。读读这封信吧，答不出小马的问题，一场大战就要来了。
        - id: ch04-b16
          speaker: narrator
          text: 青年读完信，给出办法。
        - id: ch04-b17
          speaker: boy
          text: 我能帮您。先找三个一模一样的食槽，分别装上燕麦、小麦和大麦。吃燕麦的小马生在早晨，吃小麦的生在正午，吃大麦的生在夜里。
        - id: ch04-b18
          speaker: narrator
          text: 国王立刻依照青年的指点行事。他命人摆好三个完全相同的食槽，分别倒进燕麦、小麦和大麦，再把三匹小马牵来。每匹马各自选了一个食槽，国王便按照它们吃的谷物判断出生时辰，又在马身上分别做好标记。答案和三匹小马一同被送回土耳其，苏丹再也无话可说。那一年，匈牙利又躲过了战争。
    - id: ch05
      title: 三张相同的脸
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 两次阴谋都没能帮苏丹夺到匈牙利，他气坏了，便找会施巫术的姑母商量。
        - id: ch05-b02
          speaker: witch
          text: 回答问题的不是国王，他那么愚蠢，哪里想得出来！解谜的是一个穷女人的儿子。只要他活着，就会成为匈牙利国王。你若想要王冠，必须把他弄来杀掉。
        - id: ch05-b03
          speaker: narrator
          text: 女巫说完，苏丹立刻写下新信，送往匈牙利宫廷。他限国王三天内把住在宫中的青年送去土耳其，否则大军就要越过边境。国王读信时满心悲痛。青年两次救他免遭战争，他实在不愿把恩人送进死地。青年却只笑了笑，叫国王不必害怕。他要国王马上在城里寻找两个长得完全一样的人，自己则会画一副与他们一模一样的面具。话刚说完，他身边的宝剑便响亮地碰了碰剑鞘。
        - id: ch05-b04
          speaker: narrator
          text: 人们找了很久，终于带来一对孪生兄弟。他们相像到了极点，就连亲生母亲也分不清。青年画好面具，那张脸与兄弟俩分毫不差。等他戴上，三个年轻人简直像从同一个模子里刻出来。他们立即赶往苏丹的宫殿，一到就被带到御前。苏丹招手叫三人走近，他们一齐深深鞠躬。苏丹问起旅途，他们又同时用完全相同的话作答。一个坐下吃晚饭，另外两个也在同一瞬间坐下。一个起身，其余两个马上跟着站起，好像三个人共用一个身体。苏丹怎么也辨不出谁是谁，又不愿残忍地把三个人全杀掉，只好去找姑母商量。
        - id: ch05-b05
          speaker: witch
          text: 明天就能分辨。有一个人的袖子上会有剪口，那才是你要杀的人。
        - id: ch05-b06
          speaker: narrator
          text: 午夜前一个钟头，正是女巫能够隐去身形的时候。她溜进房间，三个年轻人正同睡在一张床上。女巫取出剪刀，从墙上挂着的男孩外衣袖口剪下一小块布，又无声无息地爬了出去。清晨，青年发现袖子上的破口，马上把两个伙伴的衣袖也剪成同样模样。三人一起下楼，同苏丹吃早饭。老女巫站在窗边，故意装作没有看见他们。可女巫的后脑勺也长着眼睛，她立刻知道，如今不是一只袖子，而是三只袖子都有剪口。三个青年仍旧一模一样，谁也分辨不出。
        - id: ch05-b07
          speaker: narrator
          text: 早饭过后，苏丹已经厌烦了这整件事。他想一个人静下来，另找能害死青年的计策，便准许三人回家。他们又动作一致地深深鞠躬，转身告辞。马扎尔公主欢欢喜喜地迎回青年，可怜的青年却没能安稳多久。一天，苏丹又送来一封信，声称自己已经查明这个年轻人极其危险，命他立刻独自前往土耳其。国王叫女儿亲手把信带给青年。公主来到青年面前，把信上的内容告诉他，说着说着便忍不住失声痛哭。
        - id: ch05-b08
          speaker: boy
          text: 别哭，我心爱的姑娘。一切都会平安。明天日出，我就出发。
          emotion: calm
    - id: ch06
      title: 梦终于成真
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 第二天太阳刚刚升起，青年便独自踏上旅途。他没有带那对孪生兄弟，也没有带任何军队，只带着腰间的小宝剑。几天以后，他终于来到苏丹的宫殿。老女巫仿佛早就算准了时辰，已经守在大门旁边。青年一步步向门槛走去，经过她身旁时，女巫贴近他，压低声音说出威胁的话。
        - id: ch06-b02
          speaker: witch
          text: 这是你这一生最后一次走进这扇门。
        - id: ch06-b03
          speaker: narrator
          text: 宝剑听见这句话，立刻在鞘中铿然一响，青年却连看也不看女巫。他跨过宫殿的门槛，十五名全副武装的土耳其人突然涌上前来，拦住了去路，苏丹亲自站在他们最前面。还没等这些人动手，宝剑便猛然飞出剑鞘。除了苏丹，所有人的头都被一一斩下。做完这一切，宝剑又安安静静地回到了青年腰间的鞘中。
        - id: ch06-b04
          speaker: narrator
          text: 女巫在一旁看得清清楚楚。她明白，只要青年还拥有宝剑，自己的任何计谋都不会有用。夜里，她悄悄潜到青年身边，伸手想把剑偷走。谁知宝剑自己跳出剑鞘，一下削掉了她那只铁打的鼻子。第二天早晨，苏丹带着一支大军来抓青年，还想夺走他的宝剑。可宝剑所到之处，士兵全被斩成碎片，青年自己却连一道划痕也没有。
        - id: ch06-b05
          speaker: narrator
          text: 匈牙利那边，公主眼看日子一天天过去，青年还是没有回来，急得几乎绝望。她日日不得安宁，一再请求父亲出兵，直到国王终于同意让她亲自率领一支军队去讨伐苏丹。公主换上整齐的戎装，神气地骑在队伍最前方，带领士兵离开城镇。可是大军向前走了还不到一英里，路上便出现一个熟悉的身影。迎面而来的，正是青年和他那把小宝剑。
        - id: ch06-b06
          speaker: narrator
          text: 青年把自己在土耳其的所作所为告诉了他们。士兵们立刻欢声雷动，把他高高簇拥着带回王宫，庆贺他的胜利。国王当众宣布，青年已经证明自己配得上成为女婿。他可以立刻迎娶公主，并继承匈牙利的王位。国王说自己年事已高，治理国家的重担已经压得他疲惫不堪。青年却回答，登上王位以前，他必须先回去探望母亲。国王便以君王应有的礼仪送他上路，还派出一队士兵，作为沿途保护他的卫队。
        - id: ch06-b07
          speaker: narrator
          text: 老寡妇远远看见这样一支威风的队伍停在自家小屋前，吓得不知如何是好。紧接着，一个她从来不认识的英俊青年从马上下来，径直走到她身边，俯身亲吻她的手。老太太望着青年，又看看屋外整齐列队的士兵，比方才更加惊讶。她怎么也想不到，眼前的人正是自己的儿子。青年望着母亲，终于可以说出那个守了许多年的秘密。
        - id: ch06-b08
          speaker: boy
          text: 亲爱的妈妈，现在您可以听我的秘密了。我梦见自己会成为匈牙利国王，如今梦已经成真。小时候您要我说，我却必须沉默，不然马扎尔国王会杀掉我。要不是您打了我，后来的一切都不会发生，我今天也不会成为匈牙利国王。
