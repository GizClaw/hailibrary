  chapters:
    - id: ch01
      title: The Sword and the Secret
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a poor widow with one little boy. At first he seemed no different from any other child. Then you noticed the empty sword scabbard hanging at his side. As the boy grew, the scabbard grew with him.
        - id: ch01-b02
          speaker: narrator
          text: In the garden, he found a sword sticking out of the earth. Every day he pulled it up and tried it in the scabbard. The sword grew longer and longer, but for a long while it would not fit.
        - id: ch01-b03
          speaker: narrator
          text: At last the sword slipped easily into place. The delighted boy could hardly trust his eyes. He tried it seven times, and every time it slid in more freely. Still, he meant to tell no one, especially his mother. She could never keep news from the neighbors.
        - id: ch01-b04
          speaker: narrator
          text: He could not quite hide that something wonderful had happened. At breakfast, his mother saw his happy face and asked what was wrong.
        - id: ch01-b05
          speaker: boy
          text: Oh, Mother, I had a wonderful dream last night. But I can't tell anyone what it was.
        - id: ch01-b06
          speaker: widow
          text: You can tell me. It must have been lovely, or you wouldn't look so pleased.
        - id: ch01-b07
          speaker: boy
          text: No, Mother. I can't tell anyone until it comes true.
        - id: ch01-b08
          speaker: widow
          text: I mean to know that dream, and I will know it. I'll beat you until you tell me!
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: Words could not move him, and neither could blows. When his mother's arm grew tired, the sore and aching child escaped to the garden. He knelt beside the little sword and wept.
        - id: ch01-b10
          speaker: narrator
          text: The sword was turning around and around in its hole all by itself. Anyone else who tried to seize it would have been badly cut. But when the boy reached out, it stopped at once and slid quietly into his scabbard.
        - id: ch01-b11
          speaker: narrator
          text: For a long while, the child stayed on his knees beside the sword and sobbed. Just then, a king happened to be driving past the garden. He heard the crying from his carriage and wondered who could be making such a sorrowful sound. He ordered one of his servants to go and find out.
        - id: ch01-b12
          speaker: servant
          text: Your Majesty, a little boy is kneeling in the garden. He is crying because his mother beat him.
        - id: ch01-b13
          speaker: first_king
          text: Bring him here at once. Tell him the king has sent for him. I have never cried in my life, and I cannot bear to hear anyone else cry.
        - id: ch01-b14
          speaker: narrator
          text: The boy dried his eyes and followed the servant to the royal carriage.
        - id: ch01-b15
          speaker: first_king
          text: Would you like to be my son?
        - id: ch01-b16
          speaker: boy
          text: Yes, if my mother allows it.
        - id: ch01-b17
          speaker: narrator
          text: The king sent the servant back to the widow with an offer. If she gave her son to him, the boy would live in the royal palace. Then, when he grew into a man, he would marry the king's prettiest daughter. The widow's anger changed instantly into joy. She came running out to the splendid coach and kissed the king's hand.
        - id: ch01-b18
          speaker: widow
          text: I hope you obey His Majesty better than you obeyed me.
        - id: ch01-b19
          speaker: narrator
          text: The boy drew back, half afraid. Once his mother had returned home, he asked leave to fetch something from the garden. He pulled up the little sword, put it in its scabbard, climbed into the coach, and rode away.

    - id: ch02
      title: Banished from the Palace
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When they had traveled some distance, the king asked why the boy had cried so bitterly.
        - id: ch02-b02
          speaker: boy
          text: My mother had been beating me.
        - id: ch02-b03
          speaker: first_king
          text: Why did she beat you?
        - id: ch02-b04
          speaker: boy
          text: Because I would not tell her my dream.
        - id: ch02-b05
          speaker: first_king
          text: And why wouldn't you tell her?
        - id: ch02-b06
          speaker: boy
          text: I will never tell anyone until it comes true.
        - id: ch02-b07
          speaker: first_king
          text: Not even me?
          emotion: surprised
        - id: ch02-b08
          speaker: boy
          text: No, Your Majesty. Not even you.
        - id: ch02-b09
          speaker: first_king
          text: I'm sure you will tell me when we reach home.
        - id: ch02-b10
          speaker: narrator
          text: The king smiled, certain that the boy would change his mind at home. For the rest of the journey he spoke about other things. At the palace, he went to his daughters and announced that he had brought them a delightful present. The boy was very pretty, and the princesses were delighted to have him. They welcomed him into their games and gave him all their best toys.
        - id: ch02-b11
          speaker: first_king
          text: Take care not to spoil him. He has a secret that he refuses to tell anyone.
        - id: ch02-b12
          speaker: eldest_princess
          text: He'll tell me.
        - id: ch02-b13
          speaker: narrator
          text: The boy shook his head.
        - id: ch02-b14
          speaker: second_princess
          text: Then he'll tell me.
        - id: ch02-b15
          speaker: boy
          text: I won't.
        - id: ch02-b16
          speaker: youngest_princess
          text: He will certainly tell me!
        - id: ch02-b17
          speaker: boy
          text: I will tell nobody until it comes true. And anyone who asks me again will get a beating.
        - id: ch02-b18
          speaker: narrator
          text: The king loved the boy dearly and was deeply sorry to hear that answer. Yet he thought it would never do to keep someone near him who would not obey. He ordered his servants to take the boy away and forbade him to enter the palace again until he came to his senses.
        - id: ch02-b19
          speaker: narrator
          text: As the servants led him away, the sword at his side clanked loudly. The boy did not speak, though he was deeply unhappy. He knew he was being treated cruelly when he had done nothing wrong. Still, the servants were kind to him in their own quarters. Their children visited him with fruit and every sort of pleasant thing they could find. In time his spirits returned. He grew up among those families and remained there for many years, all the way to his seventeenth birthday.
        - id: ch02-b20
          speaker: narrator
          text: During those years, the two elder princesses grew into women. Each married a powerful king who ruled a great country across the sea. The youngest princess also reached an age to marry. But she was very particular about choosing a husband. Many young princes came to seek her hand, and she turned up her nose at every one of them.
        - id: ch02-b21
          speaker: narrator
          text: One day, the youngest princess sat alone in the palace feeling dull and lonely. She began wondering what the servants might be doing and whether their part of the grounds was livelier than hers. The king was busy with his council, while the queen was ill in bed, so no one was there to stop her. The princess hurried across the gardens to the houses where the servants lived. Outside stood a youth more handsome than any prince she had ever seen. In a moment she recognized the little boy who had once shared her toys.
        - id: ch02-b22
          speaker: youngest_princess
          text: Tell me your secret, and I will marry you.
        - id: ch02-b23
          speaker: narrator
          text: The youth gave her the beating he had promised long before. Hurt and furious, she ran to complain to her father.
        - id: ch02-b24
          speaker: first_king
          text: If he had a thousand souls, I would kill every one of them!
          emotion: angry
        - id: ch02-b25
          speaker: narrator
          text: That very day, the king had a gallows built outside the town. People crowded around it from every direction. They had come to watch the execution of the young man who had dared to beat a king's daughter. The hangman brought the prisoner out with both hands bound behind his back. The whole crowd fell silent as the judge began to read the sentence.
        - id: ch02-b26
          speaker: narrator
          text: In the middle of that silence, the sword suddenly clanked against the prisoner's side. At once a great noise came from the road. A golden coach rumbled over the stones toward them, with a white flag waving from its window. It rolled straight through the crowd and stopped beneath the gallows. The King of the Magyars stepped down and begged the other king to spare the young man's life.
        - id: ch02-b27
          speaker: first_king
          text: Sir, he beat my daughter merely because she asked for his secret. I cannot pardon him.
        - id: ch02-b28
          speaker: magyar_king
          text: Give him to me. I am sure he will tell me. If he will not, I have a daughter as lovely as the Morning Star. He is certain to tell her.
        - id: ch02-b29
          speaker: narrator
          text: The sword clanked a third time.
        - id: ch02-b30
          speaker: first_king
          text: If you want him so badly, take him. Only never let me see his face again.
          emotion: angry
        - id: ch02-b31
          speaker: narrator
          text: The first king made a sign to the hangman. The cloth was taken from the young man's eyes, and the cords were loosened from his wrists. He climbed into the golden coach and took his seat beside the King of the Magyars. The coachman cracked his whip over the horses, and they began the long road to Buda.

    - id: ch03
      title: The Tower
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Magyar king spoke pleasantly until the youth seemed at ease. Then he asked about the secret that had caused so much trouble.
        - id: ch03-b02
          speaker: boy
          text: I cannot tell you until it comes true.
        - id: ch03-b03
          speaker: magyar_king
          text: You will tell my daughter.
        - id: ch03-b04
          speaker: boy
          text: I will tell nobody.
        - id: ch03-b05
          speaker: narrator
          text: The sword clanked loudly. The king asked no more, trusting his daughter's beauty to win the secret.
        - id: ch03-b06
          speaker: narrator
          text: Buda lay far away, and the journey lasted several days. When the golden coach finally entered the castle grounds, the beautiful princess happened to be in the garden picking roses. Her father's coach rolled up while she was there, and soon they all stood together on the marble steps before the castle.
        - id: ch03-b07
          speaker: youngest_princess
          text: What a handsome youth! Did you bring him from fairyland?
          emotion: surprised
        - id: ch03-b08
          speaker: magyar_king
          text: I brought him from the gallows.
        - id: ch03-b09
          speaker: youngest_princess
          text: I don't care where he came from. I will marry him and no one else, and we will stay together all our lives.
        - id: ch03-b10
          speaker: magyar_king
          text: You may think differently after you ask for his secret. He is only a servant, after all.
        - id: ch03-b11
          speaker: youngest_princess
          text: That means nothing to me. I love him. He will tell me his secret, and I will keep him in the very center of my heart.
        - id: ch03-b12
          speaker: narrator
          text: The king only shook his head. His daughter had never before agreed even to speak to a man, yet now she wanted to marry a youth he regarded as no better than a servant. He ordered that the young man be lodged in the summerhouse.
        - id: ch03-b13
          speaker: narrator
          text: A week later, the princess put on her finest gown and visited him. She looked so beautiful that his book fell from his hand, and he rose without a word.
        - id: ch03-b14
          speaker: youngest_princess
          text: Tell me this wonderful secret. Whisper it in my ear, and I will give you a kiss.
        - id: ch03-b15
          speaker: boy
          text: My angel, be wise and ask me nothing if you wish to return safely to the palace. I have guarded my secret all these years, and I will not reveal it now.
        - id: ch03-b16
          speaker: narrator
          text: The princess would not heed his warning. She continued to coax him and pressed him again and again for the secret. At last he struck her across the face so hard that her nose began to bleed. She shrieked, both from pain and from rage, and ran screaming all the way to the palace. Her father was waiting there to learn whether she had succeeded.
        - id: ch03-b17
          speaker: magyar_king
          text: I will starve you to death, you son of a dragon!
          emotion: angry
        - id: ch03-b18
          speaker: narrator
          text: He summoned every mason and bricklayer in town.
        - id: ch03-b19
          speaker: magyar_king
          text: Build me a tower at once. Leave room inside for one stool and one little table, and nothing more.
        - id: ch03-b20
          speaker: narrator
          text: The builders began immediately. In only two hours the narrow tower stood finished, with just enough space inside for the stool and table the king had ordered. Then the masons started back toward the palace to report that they had obeyed him. On the road they met the princess. She began talking with one mason and waited until all the others were beyond hearing before making her request.
        - id: ch03-b21
          speaker: youngest_princess
          text: Can you make a hidden opening in the tower, large enough to pass through a bottle of wine and some food?
        - id: ch03-b22
          speaker: mason
          text: Of course I can.
        - id: ch03-b23
          speaker: narrator
          text: He turned back and bored the hole within a few minutes. At sunset, a large crowd gathered to watch the youth led to the tower. His offenses were solemnly proclaimed, and the builders walled him inside. Yet every morning the princess passed food through the hidden opening. Every third day, the king sent his secretary up a ladder to peer through a little window and see whether the prisoner was dead. The secretary always returned with the same strange report. The young man was still fat and rosy.
        - id: ch03-b24
          speaker: magyar_king
          text: There must be magic in this.

    - id: ch04
      title: The Sultan's Riddles
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After some time, a messenger arrived from the Sultan with a letter and three canes.
        - id: ch04-b02
          speaker: messenger
          text: My master commands you to identify which cane grew nearest the root, which grew in the middle, and which grew at the top. If you fail, he will declare war.
        - id: ch04-b03
          speaker: narrator
          text: The king was badly frightened by the threat. He took the three canes in his own hands and examined them from every side, but he could not see the smallest difference among them. His face became so sad and troubled that his daughter noticed at once. She came to him and asked why he looked that way.
        - id: ch04-b04
          speaker: magyar_king
          text: How could I not be sad? The Sultan demands that I place these three canes in their proper order. If I cannot, he will attack us, and his army is far greater than mine.
        - id: ch04-b05
          speaker: youngest_princess
          text: Don't despair, Father. We are sure to discover the answer.
        - id: ch04-b06
          speaker: narrator
          text: She hurried to the tower and told the youth what had happened.
        - id: ch04-b07
          speaker: boy
          text: Go to bed as usual. In the morning, tell your father you dreamed that the canes should be put in warm water. The one that sinks came from near the root. The one that stays between the bottom and the surface came from the middle. The floating cane came from the top.
        - id: ch04-b08
          speaker: narrator
          text: The princess reported her dream. Her father tested the canes and cut a different notch in each one so he would not confuse them. The astonished Sultan received the correct answer and did not begin a war.
        - id: ch04-b09
          speaker: narrator
          text: The following year, the Sultan searched for another excuse to quarrel. He sent a messenger with three foals and demanded to know which animal had been born in the morning, which at noon, and which in the evening. Unless the king answered within three days, war would begin at once.
        - id: ch04-b10
          speaker: narrator
          text: The king's heart sank. A plague had carried off many soldiers, leaving his army weaker than before. He could hardly expect his daughter to dream the right answer twice. His gloomy face soon brought her to him.
        - id: ch04-b11
          speaker: magyar_king
          text: The Sultan has sent another riddle. Unless I tell when each of these three foals was born, he will declare war at once.
        - id: ch04-b12
          speaker: youngest_princess
          text: Don't lose hope. Something will happen to help us.
        - id: ch04-b13
          speaker: narrator
          text: Again she ran to the tower.
        - id: ch04-b14
          speaker: boy
          text: Go home, idol of my heart. Tonight, cry out in your sleep so your father hears you. Say you dreamed the Turks were carrying him away because he could not solve the riddle. Then say the youth in the tower ran up and identified which foal was born in the morning, at noon, and in the evening.
        - id: ch04-b15
          speaker: narrator
          text: The princess obeyed. As soon as she described her dream, the king ordered the tower pulled down and the prisoner brought before him.
        - id: ch04-b16
          speaker: magyar_king
          text: I never thought you could live so long without food. You have had time enough to repent, so I will pardon you if you help me now. Read the Sultan's letter. If I cannot answer him, a dreadful war will follow.
        - id: ch04-b17
          speaker: narrator
          text: The youth read the letter from beginning to end.
        - id: ch04-b18
          speaker: boy
          text: I can help. First bring three identical troughs. Put oats in one, wheat in another, and barley in the third. The foal that chooses oats was born in the morning. The one that eats wheat was born at noon. The one that eats barley was born at night.
        - id: ch04-b19
          speaker: narrator
          text: The king followed every direction, marked the foals, and returned them to Turkey. There was no war that year.

    - id: ch05
      title: Three Boys Alike
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Sultan was furious. Both of his plots for taking Hungary had completely failed. He summoned his aunt, who was a witch, told her the whole story of the riddles, and asked what he should try next.
        - id: ch05-b02
          speaker: witch
          text: The king never solved those riddles. He is much too stupid. The answers came from a poor woman's son who will become King of Hungary if he lives. Bring him here and kill him if you want the crown.
        - id: ch05-b03
          speaker: narrator
          text: After their talk, another letter went to the court of Hungary. It said that the young man now living in the palace must be sent to Turkey within three days. Otherwise, a great army would cross the border. The king read with a sorrowful heart. He was grateful for everything the youth had done to save him. The young man, however, only laughed.
        - id: ch05-b04
          speaker: boy
          text: Fear nothing. Search the town at once for two young men who look exactly alike. I will paint myself a mask to match them.
        - id: ch05-b05
          speaker: narrator
          text: The sword at his side clanked loudly. After a long search, twin brothers were found who looked so alike that even their mother could not distinguish them. The youth painted a perfect copy of their faces. With the mask on, he looked like a third twin.
        - id: ch05-b06
          speaker: narrator
          text: The three set out at once for the Sultan's palace. On arriving, they were taken straight into his presence. He motioned for them to come closer, and all three bowed low in greeting. He questioned them about their journey. Their answers came together, in precisely the same words. At supper, when one sat down, the other two sat at that very instant. Whenever one stood, the other two stood as well. It seemed as if the three of them shared a single body.
        - id: ch05-b07
          speaker: narrator
          text: The Sultan could find no difference between them.
        - id: ch05-b08
          speaker: sultan
          text: I will not be cruel enough to kill all three.
        - id: ch05-b09
          speaker: witch
          text: Tomorrow you will see the difference. One of them will have a cut in his sleeve. That is the one you must kill.
        - id: ch05-b10
          speaker: narrator
          text: One hour before midnight, at the time when witches are invisible, the old woman glided into the room where all three young men slept in the same bed. Their coats were hanging on the wall. She drew out a pair of scissors, cut a small piece from the sleeve of the boy's coat, and crept silently away.
        - id: ch05-b11
          speaker: narrator
          text: In the morning, the youth noticed the slit at once. He made the very same mark on the sleeves of both companions. Then all three went down to breakfast with the Sultan. The old witch stood at the window and pretended not to see them. But every witch has eyes in the back of her head. She knew immediately that three sleeves, not one, had been cut. The young men were as impossible to tell apart as before.
        - id: ch05-b12
          speaker: narrator
          text: After breakfast, the weary Sultan wanted to be alone to invent another plan. He dismissed them, and they bowed together and went home.

    - id: ch06
      title: The Sword in Turkey
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The princess welcomed the youth home with joy, but he was not allowed to live peacefully for long. A fresh letter arrived from the Sultan. This one said the young man had been discovered to be very dangerous. He must be sent to Turkey at once, and this time he must come alone. The king gave the letter to his daughter to carry to the youth. When he told her what it said, she burst into tears.
        - id: ch06-b02
          speaker: boy
          text: Do not cry, love of my heart. All will be well. I will leave tomorrow at sunrise.
          emotion: calm
        - id: ch06-b03
          speaker: narrator
          text: The next morning, exactly at sunrise, the youth set off alone. After several days on the road, he reached the Sultan's palace. The old witch was already waiting for him at the gate. As he passed her, she bent close and whispered.
        - id: ch06-b04
          speaker: witch
          text: This is the last time you will ever enter here.
        - id: ch06-b05
          speaker: narrator
          text: The sword clanked, but the youth did not so much as look at the witch. He went on across the threshold. There, fifteen armed Turks barred his path, with the Sultan himself at their head. At once the sword darted from its scabbard. Before anyone could stop it, the blade cut off every head except the Sultan's. Then it slipped quietly back into its scabbard.
        - id: ch06-b06
          speaker: narrator
          text: The watching witch understood what protected him. As long as the youth possessed that sword, every scheme against him would fail. During the night she crept in and tried to steal it from its scabbard. The sword sprang out by itself and sliced off her nose, though that nose was made of iron.
        - id: ch06-b07
          speaker: narrator
          text: The next morning, the Sultan returned with a great army. He meant to capture the young man and tear the sword away from him. But the living blade met the soldiers and cut them all to pieces. Through the entire battle, the youth himself did not receive so much as a scratch.
        - id: ch06-b08
          speaker: narrator
          text: Meanwhile, the princess waited in despair. Day followed day, and the young man did not return. She gave her father no rest until he allowed her to lead a body of troops against the Sultan. Dressed in a soldier's uniform, she rode proudly at their head as they marched out of town.
        - id: ch06-b09
          speaker: narrator
          text: They had left the town scarcely a mile behind when they met the youth coming home with his little sword. He told the princess and her soldiers everything he had done in Turkey. They shouted with joy, lifted him up, and carried him back to the palace in triumph.

    - id: ch07
      title: The Dream Comes True
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: When they reached the palace, the king declared that the youth had shown himself worthy to become his son-in-law. He should marry the princess and succeed to the throne immediately. The king was growing old, he said, and the weight of governing had become too much for him.
        - id: ch07-b02
          speaker: narrator
          text: The young man answered that he must first go and see his mother. So the king sent him away in royal state, with a whole troop of soldiers riding as his bodyguard.
        - id: ch07-b03
          speaker: narrator
          text: The old widow was quite frightened when such a grand company drew up before her little house. She was even more astonished when a handsome young man she did not recognize dismounted from his horse, came to her, and kissed her hand. Then the stranger began to speak.
        - id: ch07-b04
          speaker: boy
          text: Dear Mother, now you may hear my secret at last. I dreamed that I would become King of Hungary, and my dream has come true. When I was a child and you begged me to tell you, I had to remain silent, or the Magyar king would have killed me. If you had never beaten me, none of these things would have happened, and I would not be King of Hungary now.
