audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    lizina:
      display_name: 莉齐娜
      tts:
        delivery: 善良柔和，受委屈时克制，获得关爱后真挚明朗
        timbre: 清澈年轻
        pace: 中速
        pitch: 中高音
    mother:
      display_name: 母亲
      tts:
        delivery: 偏心刻薄，发怒时尖厉而强硬
        timbre: 干涩成熟
        pace: 中速偏快
        pitch: 中音
    father_gatto:
      display_name: 加托老爹
      tts:
        delivery: 年长睿智，慈爱时温厚，惩恶时威严如雷
        timbre: 低沉醇厚
        pace: 舒缓
        pitch: 低音
    cat_1:
      display_name: 猫儿甲
      tts:
        delivery: 机灵直率，反应敏捷
        timbre: 明亮轻快
        pace: 中速偏快
        pitch: 中高音
    cat_2:
      display_name: 猫儿乙
      tts:
        delivery: 温和稳重，说话清楚
        timbre: 柔和清亮
        pace: 中速
        pitch: 中音
    cat_3:
      display_name: 猫儿丙
      tts:
        delivery: 活泼热诚，合唱时响亮有力
        timbre: 清脆年轻
        pace: 中速
        pitch: 高音
    peppina:
      display_name: 佩皮娜
      tts:
        delivery: 贪心傲慢，得意时急切，受挫时暴躁
        timbre: 尖亮年轻
        pace: 偏快
        pitch: 中高音
    prince:
      display_name: 王子
      tts:
        delivery: 年轻温和，识破欺骗后果断威严
        timbre: 清朗年轻
        pace: 中速
        pitch: 中音
    coachman:
      display_name: 车夫
      tts:
        delivery: 朴实谨慎，禀报时恭敬清楚
        timbre: 粗厚成熟
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 猫儿庄园的新女仆
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，禽兽还会说话。大城附近有座荒屋，被一群猫占来做了家。它们吃得饱，住得好，偶尔有笨老鼠闯进来，猫儿抓住它，也只是为了享受捕猎的乐趣，并不拿来充饥。
        - id: ch01-b02
          speaker: narrator
          text: 城里老人听父母说过，早年遍地鼠患，田里连一粒谷、一穗玉米也收不到。也许人们感激猫儿除了祸害，才让它们的后代安稳度日。至于钱从哪里来，又是谁替它们付账，因为年代太久，谁也说不清了。
        - id: ch01-b03
          speaker: narrator
          text: 只知道猫儿们阔绰得雇得起女仆。它们彼此相处还算和气，抓挠打架不比人类更多，可家务实在做不来。它们也绝不肯吃生肉，非要有人煮熟才行。偏偏猫儿对家务还十分挑剔，多数女人又受不了整日只有猫作伴，所以女仆总是留不长。城里哪个女人穷得只剩最后一枚钱，常会说自己只好去跟猫儿一起过。还真有不少穷女人去了。
        - id: ch01-b04
          speaker: narrator
          text: 莉齐娜在家里很不快活。寡居的母亲一味偏爱姐姐，姐姐想要什么都有，她却常常连饭也吃不饱。只要开口抱怨，换来的准是一顿打。
        - id: ch01-b05
          speaker: lizina
          text: 你们这么恨我，我走了正合你们的心意。我这就去跟猫儿一起生活！
          emotion: sad
        - id: ch01-b06
          speaker: mother
          text: 那就快滚！
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: 母亲抄起门后的旧扫帚柄。莉齐娜不等她再说第二遍，拔腿跑出家门，一直跑到猫儿的屋前。猫儿们的厨娘恰好当天早晨辞工了。她同当家的公猫大吵一场，险些被挠瞎眼睛，离开时满脸抓痕。莉齐娜来得正是时候，猫儿们热情地接纳了她。她马上动手预备晚饭，心里却一直七上八下。猫儿们究竟爱吃什么？自己做的饭能让它们满意吗？
        - id: ch01-b08
          speaker: narrator
          text: 莉齐娜在厨房里忙前忙后，猫儿们一只接一只跑来打量新女仆，弄得她处处碍手碍脚。一只挡在脚前，一只趁她削菜时蹲上椅背，还有一只坐到她身旁的桌面上。另有五六只，在靠墙架子的锅碗瓢盆间钻来钻去。满屋的呼噜声，其实都在说它们喜欢新来的姑娘。可莉齐娜还听不懂猫语，常猜不透它们想让自己做什么。
        - id: ch01-b09
          speaker: narrator
          text: 她心地善良，把地上跌跌撞撞的小猫崽一只只抱起来，替争吵的猫儿讲和，还让庄园里最老的那只大虎斑猫卧在膝上，细心照料它的瘸爪。这些好意全被猫儿看在眼里，它们自然越来越喜欢她。过了一阵，莉齐娜也习惯了这些古怪伙伴。屋子变得从未有过的整洁，端上桌的肉食从未这样可口，生病的猫儿更是从未得到过如此周到的照顾。
        - id: ch01-b10
          speaker: narrator
          text: 后来，一只独居在山顶谷仓的老猫又下山巡视这个小庄园。它每隔一段日子便会来看看大家，庄园里的猫都称它为父亲。它第一次见到莉齐娜，也立刻喜欢上了这个姑娘。
        - id: ch01-b11
          speaker: father_gatto
          text: 这位黑眼睛的小姑娘，把你们照顾得怎么样？
        - id: ch01-b12
          speakers: [cat_1, cat_2, cat_3]
          ensemble: chorus
          text: 好极了，加托老爹！我们从没遇见过这么好的女仆！

    - id: ch02
      title: 金水的奖赏
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 加托老爹每次下山巡视，听见的都是同样的赞美。可它观察得很仔细，渐渐发现小女仆脸上的愁容一天比一天深。一天，它撞见莉齐娜独自在厨房哭泣，便停下来问她缘故。
        - id: ch02-b02
          speaker: father_gatto
          text: 孩子，出了什么事？是不是有人对你不好？
        - id: ch02-b03
          speaker: lizina
          text: 没有，大家待我都很好。可我太想知道家里的消息，也太想母亲和姐姐了。
          emotion: sad
        - id: ch02-b04
          speaker: narrator
          text: 加托老爹通情达理，完全明白她的心情。它答应让她回家，只要她不愿意，就不必再回来。不过，她这样尽心照顾过它的孩子，临走前理应得到奖赏。于是老猫取出一直随身携带的钥匙，打开那扇从不让人进入的门，带她走进厨房下面那间宽大的拱顶地窖。莉齐娜惊奇地四下张望。
        - id: ch02-b05
          speaker: narrator
          text: 地窖里立着两口大陶缸，一口装油，另一口盛着金光闪闪的液体。加托老爹咧开嘴，露出尖尖的白牙，两边胡须挺得笔直。
        - id: ch02-b06
          speaker: father_gatto
          text: 你说，我该把你浸进哪一口缸？
        - id: ch02-b07
          speaker: lizina
          text: 就浸进油缸吧。我可不能开口要求在金子里洗澡。
        - id: ch02-b08
          speaker: father_gatto
          text: 不，不。你的奖赏应当更好。
        - id: ch02-b09
          speaker: narrator
          text: 老猫用强壮的双爪抱起莉齐娜，把她整个浸进金水。奇迹发生了。等她从缸里出来，浑身像晴朗夏日高悬天际的太阳一样发亮。只有红润的脸颊和乌黑长发仍是原来的颜色，其余地方全变成了黄金，她简直是一尊纯金雕像。加托老爹满意得呼噜直响。
        - id: ch02-b10
          speaker: father_gatto
          text: 回去见你的母亲和姐姐吧。路上若听见公鸡叫，就朝它看。若听见驴叫，一定把脸转开。
        - id: ch02-b11
          speaker: narrator
          text: 莉齐娜满怀感激地亲吻老猫的白爪，踏上归途。快到母亲家时，一声鸡啼传来。她马上循声转头，一颗美丽的金星立刻出现在额上，像冠冕一样衬着光亮的黑发。驴子也在这时叫起来，她牢牢记着嘱咐，没有越过篱笆去看田里那头正在吃草的驴。
        - id: ch02-b12
          speaker: narrator
          text: 母亲和姐姐正站在门前，看见浑身金光的莉齐娜，先是惊得说不出话，随即发出一阵阵赞叹。莉齐娜伸手进衣袋取手帕，竟连带掏出满满一把金币，两人的叫声顿时更响了。此后几天，母女三人相处得十分愉快。莉齐娜把带回的一切全给了母亲和姐姐，只剩身上那套脱不下来的金衣。姐姐嫉妒得发狂，使尽力气拉扯也脱不掉它。额上的金星同样取不下来。至于莉齐娜从衣袋里掏出的金币，一枚不剩，全进了母亲和姐姐手里。

    - id: ch03
      title: 佩皮娜来到庄园
      blocks:
        - id: ch03-b01
          speaker: peppina
          text: 现在轮到我去看看，能从那些猫咪身上捞到什么了。我也要弄些金子归自己。
        - id: ch03-b02
          speaker: narrator
          text: 一天清晨，佩皮娜拿了莉齐娜的篮子，又在自己的裙子里缝好衣袋，没等太阳升起便出了门。猫儿们还没有另雇女仆。它们知道没人能代替莉齐娜，失去她的悲伤至今没有消散。听说来人是她姐姐，庄园里的猫全跑出来迎接。小猫们一见佩皮娜，便偷偷议论起来。
        - id: ch03-b03
          speakers: [cat_1, cat_3]
          ensemble: duo
          text: 她跟莉齐娜一点儿也不像。
        - id: ch03-b04
          speaker: cat_2
          text: 嘘，别说了。女仆也不可能个个都漂亮。
        - id: ch03-b05
          speaker: narrator
          text: 可佩皮娜的确处处不像妹妹，连最讲道理、最宽厚的猫儿也很快承认了。上工第一天，她就当着那些爱看莉齐娜干活的公猫的面，砰地关上厨房门。一只顽皮的小猫从敞开的窗口跃进厨房，刚落到桌上，就被她用擀面杖狠狠打中，惨叫了整整一个钟头。
        - id: ch03-b06
          speaker: narrator
          text: 日子一天天过去，猫儿们越来越明白自己遭了多大的灾。佩皮娜脾气恶劣，活儿也做得糟糕。每个房间的角落都堆满灰尘，蛛网从天花板垂下来，横在窗玻璃前。床铺几乎从不整理，老弱猫儿最爱的羽毛褥子，从莉齐娜走后就连一次也没抖松过。加托老爹再次来访时，整个庄园已经闹翻了天。
        - id: ch03-b07
          speaker: cat_1
          text: 凯撒的一只爪子肿得厉害，看上去简直像断了。那是佩皮娜穿着笨重的大木鞋踢的！赫克托也让她扔来的木椅砸中，背上已经长出了脓包。
          emotion: angry
        - id: ch03-b08
          speaker: cat_2
          text: 她把阿格里皮娜和三只小猫忘在阁楼的篮子里，三只小猫全在母亲身边饿死了。这个恶女人实在让我们忍无可忍！加托老爹，求您快把她赶走吧。莉齐娜最清楚自己的姐姐是什么样，她绝不会怪我们。
          emotion: sad
        - id: ch03-b09
          speaker: father_gatto
          text: 佩皮娜，过来。
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: 老猫把她带进地窖，让她看那两口大缸，又问她愿意浸进哪一口。佩皮娜既不仁慈，也不谦逊，立刻作了选择。
        - id: ch03-b11
          speaker: peppina
          text: 当然是装金水的那一口！
        - id: ch03-b12
          speaker: father_gatto
          text: 你根本不配！
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: 加托老爹的黄眼睛里冒出怒火，声音像雷。它一把抓起佩皮娜，将她扔进油缸，差点把她闷死。她尖叫挣扎着浮上来，决意惩罚她的老猫又把她按在地上的灰堆里来回滚。等她爬起身，已经满身污秽，双眼被灰迷住，那副模样看着就让人厌恶。
        - id: ch03-b14
          speaker: father_gatto
          text: 滚出去。遇到叫驴时，可别忘了朝它看！
          emotion: angry

    - id: ch04
      title: 驴尾巴与井底的姑娘
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 佩皮娜一路跌跌撞撞，气得不停叫骂。幸好她在路边捡到一根木棍，才有东西支撑身体。母亲的屋子已经映入眼帘，右边草地里忽然传来响亮的驴叫。她赶紧扭头去看，同时伸手摸了摸额头。那里竟长出一条驴尾巴，像帽子上的羽饰一样来回摆动。
        - id: ch04-b02
          speaker: narrator
          text: 她又怒又绝望，叫喊着飞奔到母亲身边。莉齐娜端来一大盆热水，用掉两整块肥皂，洗了足足两个钟头，才除掉加托老爹赏赐给姐姐的那层灰。可驴尾巴怎么也取不下来，就像妹妹额上的金星一样牢固。母亲气疯了。她先拿扫帚无情地毒打莉齐娜，再把她带到井口，用绳子放进井底，任她留在那里哭泣呼救。
        - id: ch04-b03
          speaker: narrator
          text: 不过在这以前，王子曾从她们家门前经过。他看见莉齐娜坐在客厅里缝衣服，立刻被她的美貌迷住了。此后他又回来过两三次，终于鼓起勇气走到窗边，用最温柔的声音向她求婚。
        - id: ch04-b04
          speaker: prince
          text: 美丽的姑娘，你愿意嫁给我吗？
        - id: ch04-b05
          speaker: lizina
          text: 我愿意。
        - id: ch04-b06
          speaker: narrator
          text: 第二天早晨，王子来接新娘，见到的却是一个蒙着宽大白面纱的人。母亲一心要骗国王的儿子娶走佩皮娜，便把姐姐额上的驴尾巴盘成一绺头发，藏在面纱下面。
        - id: ch04-b07
          speaker: mother
          text: 姑娘从父母手里出嫁，本来就该这样蒙着面纱。
        - id: ch04-b08
          speaker: narrator
          text: 王子还很年轻，性情也有些胆怯。听见母亲这样解释，他没有提出半点异议，便让蒙着面纱的佩皮娜坐进马车，挨在自己身边。马车随后驶向王宫，途中正要经过猫儿居住的那幢老屋。

    - id: ch05
      title: 猫儿的歌
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 猫儿们全守在老屋的窗口。它们听说王子将迎娶世上最美的姑娘，那姑娘额头上还闪着一颗金星，便知道新娘只能是它们心爱的莉齐娜。马车慢慢来到屋前，仿佛全世界的猫都聚在了这里。忽然，每一只猫都放开嗓子，一齐唱道。
        - id: ch05-b02
          speakers: [cat_1, cat_2, cat_3]
          ensemble: chorus
          text: 喵，喵，喵！王子快回头！美丽的莉齐娜困在井里，你身边只有佩皮娜这头驴！
        - id: ch05-b03
          speaker: narrator
          text: 车夫比主人更懂猫语。他听清歌声，马上勒住马匹。
        - id: ch05-b04
          speaker: coachman
          text: 殿下，您听懂这些猫儿唱的是什么了吗？
        - id: ch05-b05
          speaker: narrator
          text: 猫儿们又从头唱了一遍，声音比先前更加嘹亮。王子抬手猛地揭开面纱。藏在下面的哪里是美丽的莉齐娜？他只看见佩皮娜那张又肿又鼓的脸，还有一条当作头发缠在她头上的驴尾巴。
        - id: ch05-b06
          speaker: prince
          text: 原来是你这个骗子！
          emotion: angry
        - id: ch05-b07
          speaker: narrator
          text: 王子命人调转马头，把气得浑身发抖的佩皮娜送回那个企图欺骗他的老妇人那里。他一手按住剑柄，用极其可怕的声音命令她立刻交出莉齐娜。母亲听见这道怒吼，吓得不敢再隐瞒，赶忙奔向水井，把囚在井底、仍在哭喊求救的姑娘拉了上来。

    - id: ch06
      title: 莉齐娜的新婚
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 莉齐娜的金衣和额上的金星光芒四射。王子牵着她回去拜见父王时，那片光辉竟把整个宫殿都照得一片明亮。第二天，两人举行了婚礼，从此永远幸福地生活在一起。
        - id: ch06-b02
          speaker: narrator
          text: 猫儿庄园里的朋友一个也没有缺席，全都兴高采烈地来到宫中参加婚礼。那只年长、睿智又公正的加托老爹，领着庄园里的猫儿走在婚礼队伍最前面。
