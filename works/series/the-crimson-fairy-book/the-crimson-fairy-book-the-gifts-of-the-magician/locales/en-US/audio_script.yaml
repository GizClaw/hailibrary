  chapters:
    - id: ch01
      title: Lost in the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was an old man who lived in a little hut deep in a forest. His wife had died, and his only child was a son he loved dearly. Black grouse nested in a stand of birches near the hut. The boy often begged to shoot them, but his father always forbade it.
        - id: ch01-b02
          speaker: narrator
          text: One day, while his father was gathering firewood a short distance away, the boy took his bow. He shot at a bird flying toward its nest, but his aim was poor. The wounded bird dropped to the ground and fluttered away.
        - id: ch01-b03
          speaker: narrator
          text: The boy raced after it. He ran hard, and the bird seemed to move slowly, yet it stayed just beyond his reach. He was so intent on catching it that he did not notice how far he had gone. At last he found himself in a strange part of the forest and decided it would be foolish to continue.
        - id: ch01-b04
          speaker: narrator
          text: He turned toward home, certain he could follow the way he had come. But the path kept dividing where he did not expect it, and each branch led him farther astray. He searched all around for a house where he could stop and ask directions. There was no sign of one anywhere. He was afraid to stand still in the cold, especially when he remembered the stories of wolves in that part of the woods.
        - id: ch01-b05
          speaker: narrator
          text: Night came. Every sound made him start. Then a magician ran toward him with a pack of wolves snapping at his heels. The boy's courage returned at once. He drew his bow, sent an arrow through the largest wolf's heart, and drove the rest away with a few more shots.
        - id: ch01-b06
          speaker: narrator
          text: The magician was overflowing with gratitude to the boy who had saved him. He promised to give him a reward if the boy would come back to his house.
        - id: ch01-b07
          speaker: youth
          text: A bed for the night is the best thing you could offer me. I've wandered through the forest all day, and I can't find my way home.
        - id: ch01-b08
          speaker: magician
          text: Come along, then. You must be hungry as well as tired.
        - id: ch01-b09
          speaker: narrator
          text: At the magician's house, the boy threw himself onto a bed and fell sound asleep. The pantry was empty, so the magician went back into the forest to hunt for food.
        - id: ch01-b10
          speaker: narrator
          text: While he was gone, the housekeeper hurried to the boy's room and tried desperately to wake him. She stamped on the floor, shook him, and called out that he was in terrible danger and must run away at once. Nothing could rouse him. Even when his eyes opened for a moment, they closed again at once.
        - id: ch01-b11
          speaker: narrator
          text: The magician soon returned and ordered supper. When it was ready, he called the boy, but still the boy would not wake. The magician and the housekeeper ate without him. Later the magician went hunting again. He tried once more to wake his guest when he came back, failed, and returned to the forest a third time.
        - id: ch01-b12
          speaker: narrator
          text: During that third absence, the boy finally woke and dressed. He went downstairs to speak with the housekeeper. She had learned that he had saved her master's life, so she no longer urged him to flee. Instead, she gave him some advice. If the magician let him choose a reward, he should ask for the horse in the third stall.

    - id: ch02
      title: The Magician's Gifts
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When the magician came home, all three sat down to dinner. After the meal, he turned to the boy.
        - id: ch02-b02
          speaker: magician
          text: Now, my son, what reward would you like for your courage?
        - id: ch02-b03
          speaker: youth
          text: Please give me the horse in the third stall. Home is a long way off, and I can't walk that far.
        - id: ch02-b04
          speaker: magician
          text: Ah, my son, you've chosen the finest horse I own. Won't some other reward satisfy you?
        - id: ch02-b05
          speaker: narrator
          text: The boy insisted that he wanted that horse and nothing else. The magician tried to change his mind, but in the end he gave in. Along with the horse, he presented the boy with three more gifts. They were a zither, a fiddle, and a flute.
        - id: ch02-b06
          speaker: magician
          text: If danger comes, touch the zither. If no help arrives, play the fiddle. And if that fails too, blow the flute.
        - id: ch02-b07
          speaker: narrator
          text: The boy thanked him, fastened the three instruments around himself, mounted the horse, and rode away. After they had traveled several miles, the horse spoke to him.
        - id: ch02-b08
          speaker: horse_queen
          text: Don't go home yet. Your father will only beat you. Let us visit a few towns first. We may find good fortune there.
        - id: ch02-b09
          speaker: narrator
          text: The advice pleased the boy. By then he felt nearly grown and thought it was high time he saw the world. When they rode into the capital, everyone stopped to admire the beauty of his horse. Word of the splendid creature even reached the king. He came to see it with his own eyes and immediately offered whatever price the boy wished.
        - id: ch02-b10
          speaker: narrator
          text: The young man hesitated. Before he could answer, the horse whispered to him.
        - id: ch02-b11
          speaker: horse_queen
          text: Don't sell me. Ask the king to put me in his stable and feed me there. Then all his horses will become as beautiful as I am.
        - id: ch02-b12
          speaker: narrator
          text: The king was delighted by the message. He led the horse straight to his own private stall. The animal had barely tasted the corn when every horse in the stable seemed transformed.
        - id: ch02-b13
          speaker: narrator
          text: Some were old favorites the king had ridden in many wars. Age and years of service had left their marks on them. Now their heads arched proudly, their legs looked slender once more, and they pawed the ground just as they had in days long gone. The king's heart beat with delight at the sight.
        - id: ch02-b14
          speaker: narrator
          text: But the old groom watched the young man with envy and hate. Each day he carried some accusation to the king. The king understood what lay behind the tales and ignored them, until the groom invented one that struck close to his heart.
        - id: ch02-b15
          speaker: groom
          text: Your Majesty, the young man boasts that he can recover your war horse. The one that vanished into the forest years ago.
        - id: ch02-b16
          speaker: narrator
          text: The king had never stopped mourning that horse. This time he believed the groom and summoned the youth.
        - id: ch02-b17
          speaker: king
          text: Bring my horse back within three days, or you will suffer for it.
        - id: ch02-b18
          speaker: narrator
          text: The order stunned the youth. He had never claimed that he could find the missing horse, but he only bowed without a word and went straight to the stable.

    - id: ch03
      title: The Lost War Horse
      blocks:
        - id: ch03-b01
          speaker: horse_queen
          text: Don't be troubled. Ask the king for a hundred oxen. Have them killed and cut into small pieces. Then we'll ride until we reach a certain river.
        - id: ch03-b02
          speaker: horse_queen
          text: One horse will come out to meet you. Ignore it. A second horse will appear, and you must leave that one alone too. When the third horse comes, throw my bridle over its head.
        - id: ch03-b03
          speaker: narrator
          text: The king granted the hundred oxen, and the youth did exactly as his horse had told him. They rode until they reached the river. One horse came toward him, then another. He paid no attention to either one. When the third appeared, he threw the bridle over its head and caught it safely.
        - id: ch03-b04
          speaker: horse_queen
          text: As we ride away, the magician's raven will try to devour us. Toss it some of the ox meat. Then I'll run like the wind and carry you beyond the dragon's reach.
        - id: ch03-b05
          speaker: narrator
          text: Again the young man obeyed. When the raven came after them, he threw it one piece of ox meat after another. His own horse galloped like the wind and carried them safely away from the dragon. Then the youth brought the lost war horse back to the king.
        - id: ch03-b06
          speaker: narrator
          text: When the old groom heard what had happened, his jealousy grew. He searched for another way to ruin the youth. At last he went to the king with a new lie.
        - id: ch03-b07
          speaker: groom
          text: Your Majesty, he says he can bring home the queen. The one who disappeared months ago without a trace.
        - id: ch03-b08
          speaker: narrator
          text: The king called the young man before him. Since the youth had supposedly boasted that he could do it, the king ordered him to fetch the missing queen and bring her home. If he failed, his head would pay the price.
        - id: ch03-b09
          speaker: narrator
          text: The poor youth's heart seemed to stop as he listened. The queen had been gone for so long, and no one in the palace had learned a thing about her. How could he possibly find her when they had all failed? He walked slowly to the stable and rested his head against his horse's shoulder.
        - id: ch03-b10
          speaker: youth
          text: The king has ordered me to bring back his wife. But she vanished so long ago, and no one knows where she went. How can I find her?
        - id: ch03-b11
          speaker: horse_queen
          text: Take heart. We can find her. Ride me to the same river we visited yesterday. I'll plunge into the water and return to my true shape. I am the king's wife. The magician you rescued changed me into a horse.
        - id: ch03-b12
          speaker: narrator
          text: The young man leaped into the saddle with joy and rode to the riverbank. He dismounted and waited as the horse entered the water. The moment her head dipped beneath it, the black hide vanished. In its place floated the most beautiful woman in the world.
        - id: ch03-b13
          speaker: narrator
          text: She floated toward him with a smile and held out her hand. He took it, helped her from the water, and led her back to the palace. The king could hardly believe his eyes when his lost wife stood before him. His surprise gave way to immense happiness, and in gratitude he showered her rescuer with gifts.

    - id: ch04
      title: Music at the Gallows
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: You might think the youth would finally have been left in peace. But the groom hated him as fiercely as ever and laid one more trap.
        - id: ch04-b02
          speaker: groom
          text: Your Majesty, success has made him proud. Now he claims he'll take your throne for himself.
        - id: ch04-b03
          speaker: narrator
          text: The king flew into such a rage that he ordered a gallows built at once. The young man was to hang without a trial. No one allowed him to speak even a word in his own defense.
        - id: ch04-b04
          speaker: narrator
          text: On the very steps of the gallows, the youth sent the king one last request. He asked permission to play a tune on his zither. The king agreed. The youth drew the instrument from beneath his cloak and touched its strings.
        - id: ch04-b05
          speaker: narrator
          text: The first notes had scarcely sounded when the hangman and his helper began to dance. The louder the music grew, the higher they leaped and capered. At last they cried out for mercy, but the youth paid no attention. He played on, and the tunes rang out more merrily than before.
        - id: ch04-b06
          speaker: narrator
          text: By sunset, both men had collapsed from exhaustion. They declared that the hanging would have to wait until the next day.
        - id: ch04-b07
          speaker: narrator
          text: News of the zither spread through town. The following morning, the king, his entire court, and a great crowd gathered beneath the gallows to watch the execution.
        - id: ch04-b08
          speaker: narrator
          text: Once more the youth asked for a final favor. This time he wanted to play his fiddle, and the king graciously allowed it. At the very first notes, every man in the crowd lifted a leg high into the air.
        - id: ch04-b09
          speaker: narrator
          text: The king, the court, and the men in the crowd danced to the fiddle for the whole day. Darkness fell at last, and there was no light left by which to hang the musician.

    - id: ch05
      title: The Flute and the Magician
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: On the third day, the youth asked once again to play, this time on his flute.
        - id: ch05-b02
          speaker: king
          text: No, no! You made me dance all day yesterday. Another day of that will surely kill me. There will be no more tunes. Put the rope around his neck, quickly!
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: The young man looked so sorrowful that the courtiers pleaded with the king.
        - id: ch05-b04
          speakers: [courtier_1, courtier_2, courtier_3]
          ensemble: chorus
          text: He is so young to die. If one tune will make him happy, let him play it.
        - id: ch05-b05
          speaker: narrator
          text: The king gave permission very unwillingly. Before the youth began, the king had himself tied tightly to a great fir tree. He thought the ropes would keep the music from making him dance.
        - id: ch05-b06
          speaker: narrator
          text: Once the king was secure, the young man blew softly on his flute. Though the ropes held him fast, the king's body moved with the music, rubbing up and down the tree. Soon his clothes hung in tatters, and the skin on his back was nearly scraped away.
        - id: ch05-b07
          speaker: narrator
          text: The youth showed no pity and kept playing. Suddenly the old magician appeared.
        - id: ch05-b08
          speaker: magician
          text: What danger has made you call for me, my son?
        - id: ch05-b09
          speaker: youth
          text: They mean to hang me. The gallows is ready, and the hangman is only waiting for me to stop playing.
        - id: ch05-b10
          speaker: magician
          text: Oh, I'll soon set that right.
        - id: ch05-b11
          speaker: narrator
          text: The magician seized the gallows, tore it from the ground, and hurled it into the air. No one knows where it landed.
        - id: ch05-b12
          speaker: magician
          text: Who ordered your hanging?
        - id: ch05-b13
          speaker: narrator
          text: The young man pointed to the king, who was still tied to the fir tree. The magician wasted no words. He gripped the tree and gave one mighty heave. Fir and king spun through the air together and vanished into the clouds after the gallows.
        - id: ch05-b14
          speaker: narrator
          text: With the old king gone, the young man was declared free. Then the people elected him to be their king.
        - id: ch05-b15
          speaker: narrator
          text: The old groom drowned himself from envy. After all, if not for his plots, the young man would have stayed poor all his life.
