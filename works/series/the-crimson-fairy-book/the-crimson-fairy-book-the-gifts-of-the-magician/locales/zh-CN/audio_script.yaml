audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而带几分诙谐，像在讲一则古老的欧洲童话
        timbre: 温暖清亮
        pace: 舒缓，转折处有自然停顿
        pitch: 中音
    youth:
      display_name: 年轻人
      tts:
        delivery: 善良勇敢，遭遇不公时忧愁却不失沉着
        timbre: 年轻清朗
        pace: 中速
        pitch: 中音
    magician:
      display_name: 魔法师
      tts:
        delivery: 年长神秘，待恩人亲厚，施展法力时果断威严
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
    housekeeper:
      display_name: 女管家
      tts:
        delivery: 心地善良，警告时急切，指点时谨慎
        timbre: 清晰柔和
        pace: 中速偏快
        pitch: 中音
    queen_horse:
      display_name: 神奇骏马与王后
      tts:
        delivery: 聪慧镇定，说话直接，显露身份后温柔端庄
        timbre: 柔和明亮
        pace: 中速
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 威严而任性，欢喜时热切，发怒时粗暴急躁
        timbre: 浑厚有力
        pace: 中速偏慢
        pitch: 低音
    stableman:
      display_name: 老马夫
      tts:
        delivery: 阴沉嫉妒，进谗时装作恭顺可信
        timbre: 干涩低哑
        pace: 中速
        pitch: 中低音
    courtier_1:
      display_name: 廷臣甲
      tts:
        delivery: 年长持重，求情时恭敬恳切
        timbre: 沉稳清晰
        pace: 中速
        pitch: 中低音
    courtier_2:
      display_name: 廷臣乙
      tts:
        delivery: 温和谨慎，随众进言时诚恳
        timbre: 温润清楚
        pace: 中速
        pitch: 中音
    courtier_3:
      display_name: 廷臣丙
      tts:
        delivery: 率直仁厚，求情时语气真切
        timbre: 明亮朴实
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 森林里的魔法师
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个老人带着独生子住在森林深处的小屋里。妻子去世以后，这个孩子就成了他最珍爱的人。屋旁有一片白桦林，黑琴鸡在树间筑巢。少年总想拿弓箭去射，父亲却严厉禁止，从不答应。
        - id: ch01-b02
          speaker: narrator
          text: 一天，老人到附近拾柴。少年趁机取出弓，朝一只飞回巢里的鸟射了一箭。箭没有射准，只伤了它。鸟儿落到地上，一路扑腾着逃，少年紧追不舍。看着它飞得很慢，他跑得又快，却总差那么一点点。追了很久，他才发觉自己已经深入森林，四周全是陌生的路。再追下去太傻了，他转身想回家，可小径到处岔开，根本认不出来路。
        - id: ch01-b03
          speaker: narrator
          text: 附近没有一户人家可以问路，天气又冷，森林里还有狼出没。天渐渐黑了，每一点声音都让少年心惊。就在这时，一个魔法师飞奔而来，一群狼在后面咬他的脚跟。少年重新鼓起勇气，举弓射穿了最大那头狼的心脏，又用几支箭赶跑余下的狼。魔法师十分感激，请救命恩人回家，还答应送他一件礼物。
        - id: ch01-b04
          speaker: youth
          text: 要说我现在最想要什么，那就是借宿一夜。我在森林里走了一整天，已经找不到回家的路了。
        - id: ch01-b05
          speaker: magician
          text: 那就跟我走吧。你一定又累又饿。
        - id: ch01-b06
          speaker: narrator
          text: 魔法师把他领回家。少年一倒上床便睡熟了。家里的储藏室空空如也，魔法师只好重返森林寻找吃的。女管家趁主人不在，进屋用力跺地板，又摇晃少年，大声告诉他正身陷险境，必须马上逃走。可怎么也唤不醒他。他偶尔睁一下眼，转眼又闭上。魔法师带着食物回来，吩咐女管家开饭。他也试着叫少年下楼，却仍旧没有用，两人只得撇下客人先吃晚餐。后来，魔法师又进森林打猎，回来后再次唤他。少年始终熟睡，魔法师便第三次出了门。直到这时，他才终于醒来。
        - id: ch01-b07
          speaker: narrator
          text: 他穿衣下楼，同女管家说起话。姑娘知道少年救了主人的命，便不再催他逃走，反而悄悄指点他该怎样挑选谢礼。
        - id: ch01-b08
          speaker: housekeeper
          text: 主人若让你自己选，就要马厩第三个栏位里的那匹马。一定要选它。
        - id: ch01-b09
          speaker: narrator
          text: 魔法师回来以后，三个人一起吃了饭。饭后，他请少年说出心愿。
        - id: ch01-b10
          speaker: magician
          text: 孩子，你这样勇敢地救了我。现在想要什么酬谢，只管告诉我。
        - id: ch01-b11
          speaker: youth
          text: 请把第三个栏位里的马送给我吧。我离家很远，两只脚可走不了那么长的路。
        - id: ch01-b12
          speaker: magician
          text: 哎呀，你偏偏挑中了我最好的马！换一样别的，就不能让你满意吗？
        - id: ch01-b13
          speaker: narrator
          text: 少年坚持只要那匹马，魔法师最终让了步。他还添上三件礼物，一架齐特琴、一把小提琴和一支长笛。
        - id: ch01-b14
          speaker: magician
          text: 遇到危险，先弹齐特琴。若没人来救你，就拉小提琴。要是还等不到援手，再吹长笛。
    - id: ch02
      title: 会说话的骏马
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 少年谢过魔法师，把三件宝物系在身上，骑马出发。走了几英里，那匹马竟忽然开了口。
        - id: ch02-b02
          speaker: queen_horse
          text: 你现在回去，父亲只会打你。不如先去几座城里看看，说不定会有好事等着我们。
        - id: ch02-b03
          speaker: narrator
          text: 少年很喜欢这个主意。他觉得自己如今差不多是个男子汉，早该到外面的世界见见世面，便高兴地听从劝告。他们走进这个国家的都城，路上的人无不驻足，赞叹骏马的美丽。消息一直传进王宫，国王也亲自赶来，要好好看看这匹非凡的马。他一见便想买下它，还说无论少年开价多少都肯付。少年迟疑片刻，还没来得及回答，马便贴近他耳边低声嘱咐。
        - id: ch02-b04
          speaker: queen_horse
          text: 别卖掉我。请国王把我养在他的马厩里。我只要在那里吃一口谷物，其余的马也会变得和我一样漂亮。
        - id: ch02-b05
          speaker: narrator
          text: 国王听说这件奇事，十分欢喜，立刻把它牵进马厩，安置在自己专用的栏位。神奇的马刚从食槽里吃下一口谷物，满厩的马便全变了样。那些驮着国王经历多年战争的老马，身上原本尽是岁月和征战的痕迹，如今又高高昂着头，用纤细的腿刨地，仿佛回到了遥远的年轻岁月。国王欢喜得心直跳，负责照料它们的老马夫却阴沉地站在旁边，满怀仇恨与嫉妒地盯着神奇骏马的主人。
        - id: ch02-b06
          speaker: narrator
          text: 从那天起，马夫每天都编一段少年的坏话，跑去讲给国王听。国王明白他为何这样做，一直没有理会。最后，马夫编出一桩谎话，说少年夸口能找回国王多年前在森林中走失的战马。那匹马从此音讯全无，国王却从来没有停止思念它。听见有人能把爱马找回来，这一次他终于信了马夫。
        - id: ch02-b07
          speaker: stableman
          text: 陛下，那个年轻人亲口说过，他能把您失踪多年的战马找回来。
        - id: ch02-b08
          speaker: king
          text: 三天之内把我的马带回来。要是办不到，你不会有好下场。
        - id: ch02-b09
          speaker: narrator
          text: 少年听得目瞪口呆，却只向国王鞠了一躬，马上去找自己的马。
        - id: ch02-b10
          speaker: queen_horse
          text: 别发愁。请国王给你一百头牛，让人宰杀后切成小块。我们带着牛肉走到一条河边。第一匹走来的马不要理，第二匹也别管。第三匹一出现，就把我的缰绳套到它头上。
    - id: ch03
      title: 失踪的战马与王后
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 事情果然全照神奇的马所说。少年给第三匹马套稳了缰绳，这才准备离开。
        - id: ch03-b02
          speaker: queen_horse
          text: 回去的路上，魔法师的乌鸦会来吃掉我们。你只管把牛肉扔给它，我会迎风飞驰，带你逃出恶龙的魔爪。
        - id: ch03-b03
          speaker: narrator
          text: 少年依计而行，把牛肉一块块抛给追来的乌鸦，终于平安带着失踪的战马回到王宫。老马夫得知以后，心里更加嫉妒，一心盘算怎样叫年轻人失去国王的宠信。他很快又想出一个圈套，说少年曾夸口能找回王后。王后已经失踪了许多个月，没有留下一点踪迹。国王再次召见年轻人，命他把妻子带回宫，正如他吹嘘的那样。若是失败，就拿脑袋抵罪。
        - id: ch03-b04
          speaker: stableman
          text: 陛下，他还说过，连失踪的王后也能替您找回来。
        - id: ch03-b05
          speaker: narrator
          text: 可怜的少年听见命令，心都像停止了跳动。找回王后？她已经失踪了那么久，王宫里没有一个人办得到，他又能到哪里去找？他满怀忧愁，慢慢走进马厩，把头靠在自己的马肩上，说出了国王交给他的难题。
        - id: ch03-b06
          speaker: youth
          text: 国王要我找回他的妻子。她失踪了那么久，谁也不知道半点消息，我怎么可能找得到呢？
        - id: ch03-b07
          speaker: queen_horse
          text: 振作一点，我们找得到她。骑着我回到昨天那条河边，我会跳进水里，变回本来的模样。其实，我就是国王的妻子。你救过的那个魔法师把我变成了马。
        - id: ch03-b08
          speaker: narrator
          text: 少年欢喜地跃上马背，一路赶到河岸。他翻身下马，在一旁等候。马儿随即跃进河里，头才浸入水，黑色毛皮便消失无踪，世上最美丽的女子浮在水面。她含笑向少年游来，伸出一只手。少年握住她的手，把她领回王宫。国王看见失踪已久的妻子竟真的站在面前，又惊又喜。为了感谢救回王后的恩人，他把数不清的礼物都赐给了少年。
    - id: ch04
      title: 绞架下的琴声
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了这里，你也许会想，这个可怜的年轻人总该过上安稳日子了。可是没有。他的仇敌老马夫照旧恨他，又布下新的毒计，在国王面前进谗，说这个年轻人被功劳冲昏了头，竟打算夺取王位。
        - id: ch04-b02
          speaker: stableman
          text: 陛下，他现在骄傲得很，已经扬言要夺走您的宝座，自己来做国王。
        - id: ch04-b03
          speaker: narrator
          text: 国王勃然大怒，当场下令竖起绞架，不经审判便处死年轻人，连一句申辩也不准他说。走上绞架台阶时，少年托人向国王传去最后一个请求。
        - id: ch04-b04
          speaker: youth
          text: 陛下，我只求最后一件事。请让我弹奏一曲齐特琴。
        - id: ch04-b05
          speaker: narrator
          text: 国王答应了。少年从斗篷下取出琴，拨响琴弦。第一个音符传出来，刽子手和助手就跳起舞。乐声越响，他们蹦得越高，最后连连求饶。少年没有理会，曲调反而比先前更加欢快。太阳落山时，两个人已经精疲力竭地倒在地上，只好宣布绞刑推迟到第二天。
        - id: ch04-b06
          speaker: narrator
          text: 这件怪事一夜之间传遍全城。第二天早上，国王带着满朝廷臣和一大群百姓来到绞架下，要亲眼看着年轻人受刑。少年又提出一个请求。
        - id: ch04-b07
          speaker: youth
          text: 陛下，今天请再开一次恩，让我拉一曲小提琴吧。
        - id: ch04-b08
          speaker: narrator
          text: 国王开恩应允。第一个音符一响，在场每个人的腿都不由自主地高高抬起，随着琴声跳个不停。众人就这样整整跳了一天。等到黑夜降临，四下一片漆黑，再也没有光亮可供刽子手行刑，少年又活了下来。
    - id: ch05
      title: 长笛召来的援手
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第三天，年轻人请求吹奏长笛。国王一听，立刻拒绝。
        - id: ch05-b02
          speaker: king
          text: 不行！你昨天让我跳了整整一天，再来一次非要了我的命。你不能再奏乐。快把绳索套上他的脖子！
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: 年轻人听后满脸哀伤，廷臣们看着不忍，一起替他求情。
        - id: ch05-b04
          speakers: [courtier_1, courtier_2, courtier_3]
          ensemble: chorus
          text: 他还这样年轻，就让他吹一支曲子吧。至少临死以前，也能让他高兴一次。
        - id: ch05-b05
          speaker: narrator
          text: 国王极不情愿地准了，却先让人把自己牢牢捆在一棵大冷杉上，生怕长笛又逼得他起舞。等绳索全都绑结实，年轻人轻轻吹响长笛。国王纵然被缚住，身体还是随着笛声沿树干上下窜动，衣服很快磨成了碎片，背上的皮也几乎磨光。年轻人毫不怜悯，仍然吹个不停。忽然，老魔法师出现在众人面前。
        - id: ch05-b06
          speaker: magician
          text: 孩子，你遇上了什么危险，竟用长笛把我召来？
        - id: ch05-b07
          speaker: youth
          text: 他们要吊死我。绞架已经搭好，刽子手就等我停下长笛。
        - id: ch05-b08
          speaker: magician
          text: 原来是这件事。我来替你解决。
        - id: ch05-b09
          speaker: narrator
          text: 魔法师一把抓住绞架，将它连根拔起，高高抛向空中。从此，再也没有人知道它究竟落在什么地方。
        - id: ch05-b10
          speaker: magician
          text: 是谁下令吊死你的？
        - id: ch05-b11
          speaker: narrator
          text: 年轻人指了指还绑在冷杉上的国王。魔法师一句废话也没说，又抓住那棵大树，猛地使出神力。冷杉连同国王旋转着飞上天空，追着绞架没入云层，再也看不见了。
        - id: ch05-b12
          speaker: narrator
          text: 这以后，年轻人终于被宣布无罪，百姓还推选他做了国王。马夫的助手却因为嫉妒投水自尽。说到底，要不是这个人从中作梗，年轻人也许一辈子都会是个穷人。
