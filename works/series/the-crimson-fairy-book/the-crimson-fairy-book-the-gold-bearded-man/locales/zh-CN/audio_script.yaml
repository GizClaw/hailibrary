audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    old_king:
      display_name: 老国王
      tts:
        delivery: 衰弱而庄重，对妻儿满怀牵挂
        timbre: 苍老浑厚
        pace: 缓慢
        pitch: 低音
    stepfather:
      display_name: 继父国王
      tts:
        delivery: 冷酷专横，发怒时暴烈而咄咄逼人
        timbre: 阴沉粗硬
        pace: 中速偏快
        pitch: 中低音
    prince:
      display_name: 王子
      tts:
        delivery: 年轻真诚，心地柔软，受困时忧惧却不失善良
        timbre: 清澈柔和
        pace: 中速
        pitch: 中高音
    gold_bearded_man:
      display_name: 金胡子人
      tts:
        delivery: 神秘克制，恳求时真切，许诺时坚定
        timbre: 深沉而带空灵感
        pace: 舒缓
        pitch: 低音
    wood_pigeon:
      display_name: 斑鸠王
      tts:
        delivery: 温和诚恳，报恩时沉着可靠
        timbre: 柔润轻盈
        pace: 中速偏缓
        pitch: 中高音
    wild_duck:
      display_name: 野鸭王
      tts:
        delivery: 直率热心，言语爽快而亲切
        timbre: 明亮圆润
        pace: 中速
        pitch: 中音
    stork:
      display_name: 鹳王
      tts:
        delivery: 稳重有把握，危急时给人安定之感
        timbre: 清朗沉稳
        pace: 中速偏缓
        pitch: 中音
    soldier_1:
      display_name: 士兵甲
      tts:
        delivery: 表面恭敬，暗地阴险，献计时装腔作势
        timbre: 干涩尖利
        pace: 中速偏快
        pitch: 中音
    soldier_2:
      display_name: 士兵乙
      tts:
        delivery: 随声附和而心怀妒意，说话油滑
        timbre: 稍哑而薄
        pace: 中速
        pitch: 中低音
    second_king:
      display_name: 异国国王
      tts:
        delivery: 轻信而威严，自以为是，惊叹时毫不掩饰
        timbre: 洪亮饱满
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 奶溪边的囚徒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位大国王。他有妻子，还有一个年幼的独生子。国王十分疼爱这个孩子。一天，他觉得自己的日子不多了，便把妻子叫到身边。
        - id: ch01-b02
          speaker: old_king
          text: 我的死期快到了。请你答应我，今后不要再嫁，一心照料我们的儿子。
        - id: ch01-b03
          speaker: narrator
          text: 王后听了，眼泪一下涌出来，哭得泣不成声。她再三发誓，自己永远、永远不会另嫁。只要还活着，她最先牵挂的一定是儿子的安康。这个承诺终于抚平了国王心中的忧虑。几天以后，他离开人世，对自己、对世间都已再无挂碍。
        - id: ch01-b04
          speaker: narrator
          text: 可国王才断气，王后便想，许诺是一回事，守诺又是另一回事。棺材上最后一铲土刚落下，她就嫁给了邻国的一名贵族，还让新丈夫越过小王子，坐上王位。
        - id: ch01-b05
          speaker: narrator
          text: 新王又凶狠又恶毒。他几乎不给继子饭吃，只许孩子穿破衣烂衫。若不是害怕百姓反对，他早就杀死小王子了。
        - id: ch01-b06
          speaker: narrator
          text: 王宫园地旁有一条奇异的小溪，里面流的不是水，而是牛奶。从前，富人穷人每天都来，想舀多少就舀多少。可新王登基后，头一件事便是封锁溪岸。他下令，谁敢靠近，守卫就把谁抓走。溪里的奶明明够所有人饮用，他这样做，只是存心使坏。
        - id: ch01-b07
          speaker: narrator
          text: 一连几天，没人敢接近奶溪。后来守卫发现，每到黎明，总有一个长着金胡子的男人提桶前来，把牛奶装到桶沿。他们还没来得及看清，那人就像一缕烟似的消失了。守卫赶紧把这件怪事禀报国王。
        - id: ch01-b08
          speaker: narrator
          text: 国王起初不信，架不住守卫再三保证，便在夜里亲自守着。天边刚露曙光，金胡子人果然来了。他照旧装满一桶奶，转眼就不见了，像是被大地吞了下去。
        - id: ch01-b09
          speaker: narrator
          text: 国王站在原地，直瞪着那块空地，眼睛和嘴巴都张得老大。他可以肯定，自己从没见过这个人。可这不算最要紧。真正让他费心的是，怎样才能捉住对方，捉住以后又该怎么处置。他决定造一只笼子关押这个窃贼，好让各国都来谈论这件新鲜事。毕竟，别国只会把贼投进监狱，已经很久没有哪位国王拿笼子关人了。
        - id: ch01-b10
          speaker: narrator
          text: 国王在每一丛灌木后面都安插了守卫。金胡子人弯腰舀奶时，他们就踩着草地，轻手轻脚地逼近。可就在众人伸手要抓的那一刻，那人总会当着他们的面消失。这样的事发生了一次又一次。国王气得发狂，终于悬下重赏，寻找能告诉他怎样捉住这个仇敌的人。
        - id: ch01-b11
          speaker: narrator
          text: 一名老兵先来献计。他说，只要在溪岸摆上面包、咸肉和葡萄酒，金胡子人一定会吃喝。往酒里撒些药粉，等他睡着，便能锁进笼子。
        - id: ch01-b12
          speaker: narrator
          text: 国王听得十分满意，立刻吩咐人在溪岸摆好面包、咸肉和一壶掺了药的葡萄酒，还把守卫增加一倍。随后，他满怀希望地等待结果。第二天清早，金胡子人来到溪边，吃了面包和咸肉，又喝下药酒，果然沉沉睡去。守卫轻易将他绑住，抬回王宫。没过多久，国王便把他牢牢关进一只金笼。
        - id: ch01-b13
          speaker: narrator
          text: 国王怀着凶残的喜悦，把囚徒展示给那些正在宫廷做客的异乡人。金胡子人从药酒的昏睡中醒来，试着同他们说话，却没有一个人肯听。他索性从此闭口不言。前来盯着他看的人，便把他当成了不会说话的林中野人。他终日独自哭泣哀叹，连食物也几乎不碰。国王唯恐他死去，反倒从折磨他的人手中逃脱，便命御厨总管把御膳桌上的菜肴送进笼里。
    - id: ch02
      title: 王子的出逃
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 大约一个月后，邻国燃起战火，新王必须离宫统兵。临行前，他把继子叫来。
        - id: ch02-b02
          speaker: stepfather
          text: 小子，听好了。我不在时，由你看管囚徒。给他足够的吃喝，却不准他逃走，连在房里走动也不行。等我回来，要是他不见了，我就让你死得惨不堪言。
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: 王子巴不得继父去打仗，心里还暗暗盼他永远别回来。国王一走，他便日夜守在金笼旁，连玩耍也不离开那间屋子。
        - id: ch02-b04
          speaker: narrator
          text: 一天，王子用银弓射靶，一支箭落进笼中。他赶紧跑过去。
        - id: ch02-b05
          speaker: prince
          text: 请把我的箭还给我。
        - id: ch02-b06
          speaker: gold_bearded_man
          text: 你先放我出笼，我才把箭还你。
        - id: ch02-b07
          speaker: prince
          text: 我不能放你。继父说了，你要是逃走，等他回来就会狠狠处死我。这支箭对你没有用，还是还给我吧。
          emotion: fearful
        - id: ch02-b08
          speaker: narrator
          text: 金胡子人把箭从栏杆间递了出来。箭已经还了，他却比刚才更加恳切，一再求王子打开笼门，放他出去。他求得那么真切，终于打动了男孩的心。王子天性仁厚，只要看见别人受苦，便会心生怜悯。他抽开门闩，金胡子人就这样跨出笼门，重新回到自由的天地。
        - id: ch02-b09
          speaker: gold_bearded_man
          text: 你今天救了我，我一定用千倍的恩情来报答。
        - id: ch02-b10
          speaker: narrator
          text: 金胡子人说完便消失了。王子先想，继父回来时该怎样交代。接着又想，难道真要留在这里，等候那场可怕的死刑吗？
        - id: ch02-b11
          speaker: prince
          text: 不，我不敢留下。也许外面的世界待我会比他仁慈。
          emotion: fearful
        - id: ch02-b12
          speaker: narrator
          text: 黄昏降临时，王子避开所有人的眼睛，悄悄离开王宫。此后许多天，他不停地流浪。他翻过高山，穿过森林，又走进一座座山谷，却始终不知道该去哪里，也不知道往后该做什么。一路上没有别的食物，他只能靠野果充饥。
        - id: ch02-b13
          speaker: narrator
          text: 一天早晨，他看见树枝上停着一只斑鸠，立刻搭箭瞄准，想拿它饱餐一顿。斑鸠忽然开口，惊得他的武器落在地上。
        - id: ch02-b14
          speaker: wood_pigeon
          text: 尊贵的王子，求您别射！家里还有我的两个孩子。我要是不能带食物回去，它们会饿死的。
          emotion: fearful
        - id: ch02-b15
          speaker: narrator
          text: 王子心生怜悯，卸下了弓弦。
        - id: ch02-b16
          speaker: wood_pigeon
          text: 谢谢您的慈悲，王子。我将来一定报答您。
        - id: ch02-b17
          speaker: prince
          text: 可怜的小东西，你又能怎样报答我呢？
        - id: ch02-b18
          speaker: wood_pigeon
          text: 您忘了那句老话吗？山与山永远碰不到一起，活物与活物却总会有相逢的一天。
        - id: ch02-b19
          speaker: narrator
          text: 王子听了只是一笑，继续赶路。后来，他来到一片湖边，看见一只野鸭正飞向岸边的芦苇。他想起父王还在世的日子。那时候，自己想吃什么就能吃到什么，每逢生日，晚餐桌上总少不了野鸭。他立刻搭箭上弓，对准那只鸟，仔细地瞄了起来。
        - id: ch02-b20
          speaker: wild_duck
          text: 尊贵的王子，求您别射！我的两个孩子还在家里，等我带食物回去。没有我，它们会饿死的。
          emotion: fearful
        - id: ch02-b21
          speaker: narrator
          text: 王子又动了恻隐之心。他垂下箭，卸下弓弦。
        - id: ch02-b22
          speaker: wild_duck
          text: 王子，谢谢您饶我一命。我一定会回报这份慈悲。
        - id: ch02-b23
          speaker: prince
          text: 你这可怜的小东西，能拿什么回报我呢？
        - id: ch02-b24
          speaker: wild_duck
          text: 您忘了那句老话吗？山与山永远碰不到一起，活物与活物却总会有相逢的一天。
        - id: ch02-b25
          speaker: narrator
          text: 王子笑着离开湖岸。没走多远，他看见一只鹳单腿站着，又举起了弓。
        - id: ch02-b26
          speaker: stork
          text: 尊贵的王子，请不要射箭！我家里有两个年幼的孩子。我要是不回去给它们找食物，它们会饿死。
          emotion: fearful
        - id: ch02-b27
          speaker: narrator
          text: 王子第三次被打动，没有放箭。
        - id: ch02-b28
          speaker: stork
          text: 王子，我一定会报答您的慈悲。
        - id: ch02-b29
          speaker: prince
          text: 可怜的鹳，你怎么可能报答我？
        - id: ch02-b30
          speaker: stork
          text: 您忘了吗？山与山永远碰不到一起，活物与活物却总会有相逢的一天。
        - id: ch02-b31
          speaker: narrator
          text: 王子再次听到这句话，不禁笑了。他慢慢向前，不久便遇到两个被遣散的士兵。
        - id: ch02-b32
          speaker: soldier_1
          text: 小兄弟，你要到哪儿去？
        - id: ch02-b33
          speaker: prince
          text: 我在找活干。
        - id: ch02-b34
          speaker: soldier_1
          text: 我们也一样。那就一起走吧。
        - id: ch02-b35
          speaker: narrator
          text: 王子很高兴有了同伴。他们走啊走啊，接连穿过七个王国，还是没找到能做的活。最后，三人来到一座宫殿前，看见国王正站在台阶上。
        - id: ch02-b36
          speaker: second_king
          text: 看样子，你们正在找什么。
        - id: ch02-b37
          speakers: [prince, soldier_1, soldier_2]
          ensemble: chorus
          text: 我们想找活干。
        - id: ch02-b38
          speaker: narrator
          text: 国王准许两个士兵留下来做马车夫，却把王子带在身边当侍从，还给了他几间紧邻国王住处的房间。两个士兵听到这样的安排，气得要命。他们当然不知道，这个穿得不起眼的男孩本来就是一位王子，只觉得国王偏心。没过多久，两个人便凑到一起，低声密谋怎样毁掉他。
    - id: ch03
      title: 斑鸠分麦
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两个士兵来到国王面前，恭恭敬敬地讲起了第一桩谎话。
        - id: ch03-b02
          speakers: [soldier_1, soldier_2]
          ensemble: duo
          text: 陛下，我们必须禀报一件事。您的新侍从夸口说，只要让他掌管粮仓，仓里连一粒粮食也不会损失。请您把一袋小麦和一袋大麦混在一起，命他在两个钟头内分开。到时就能看出，他的大话到底有几分真。
        - id: ch03-b03
          speaker: narrator
          text: 这个国王性情软弱，轻易听信了恶人的话。他要王子在自己议事回来前，把混在一起的麦粒分成两堆。
        - id: ch03-b04
          speaker: second_king
          text: 你若办得到，就做我的粮仓总管。办不到，我当场处死你。
        - id: ch03-b05
          speaker: narrator
          text: 可怜的王子连忙声明，自己从未夸过这样的口，可他说什么都没用。国王根本不相信他，把男孩推进一间空屋，又命仆人抬来那只沉重的大袋子。袋中装满了混在一起的小麦和大麦，仆人把麦粒全倒出来，在地板上撒成一大堆。
        - id: ch03-b06
          speaker: narrator
          text: 王子站在麦粒前，连从哪里下手都不知道。其实，就算有一千个人来帮忙，再给他们整整一个星期，也做不完这件差事。可国王只留给他短短两个钟头。想到等候自己的死刑，他绝望地扑倒在地，用双手蒙住了脸。就在这时，一只斑鸠从窗口飞了进来。
        - id: ch03-b07
          speaker: wood_pigeon
          text: 尊贵的王子，您为什么在哭？
        - id: ch03-b08
          speaker: prince
          text: 国王逼我分开这一大堆麦粒。我若做不完，他就要残酷地处死我。我怎么能不哭呢？
          emotion: sad
        - id: ch03-b09
          speaker: wood_pigeon
          text: 这件事不用哭。我就是您饥饿时放过的斑鸠王。现在，我要照约定报答您。
          emotion: calm
        - id: ch03-b10
          speaker: narrator
          text: 斑鸠王飞出窗外，王子心里终于有了一点希望。几分钟后，它带着一大片密云般的斑鸠回来，几乎塞满了房间。斑鸠王说明该怎么做，鸟儿们立刻忙碌起来。议事还没结束，小麦和大麦已经各归一堆。
        - id: ch03-b11
          speaker: narrator
          text: 国王议事回来，简直不敢相信自己的眼睛。他把两堆麦粒翻了又翻，查了又查。在小麦堆里，他找不到一粒大麦。在大麦堆里，也找不到一粒小麦。最后，国王只好夸赞王子既勤奋又聪明，当场任命他做粮仓总管。
        - id: ch03-b12
          speaker: narrator
          text: 两个士兵嫉妒得更厉害，又想出一条毒计。一天，国王站在宫殿台阶上，他们走了过去。
        - id: ch03-b13
          speakers: [soldier_1, soldier_2]
          ensemble: duo
          text: 陛下，那家伙又在吹嘘。他说若由他掌管珍宝，连一枚金别针也不会遗失。请您把公主的戒指扔进小溪，叫他找回来。这样就能看清他有多大本事。
        - id: ch03-b14
          speaker: narrator
          text: 愚蠢的国王又相信了，立刻召来王子。
        - id: ch03-b15
          speaker: second_king
          text: 孩子，我听说你有把握守好我的珍宝，连一枚金别针也不会丢。我要把公主的戒指扔进溪里。等我议事回来，你若还没找到，就得死得惨不堪言。
        - id: ch03-b16
          speaker: narrator
          text: 王子再怎样否认也没用。国王不听解释，匆匆走了，只留下男孩在墙角绝望得说不出话。过了一会儿，王子想到，留在宫里绝不可能找到戒指。即使溪里希望渺茫，也非去不可。
        - id: ch03-b17
          speaker: narrator
          text: 他沿着小溪来回寻找，始终盯着清澈的水底，却看不见戒指。最后，他彻底放弃，扑倒在一棵树下，伤心地哭了起来。头顶忽然传来声音，他抬头一看，正是那只野鸭。
        - id: ch03-b18
          speaker: wild_duck
          text: 亲爱的王子，您遇上什么事了？
        - id: ch03-b19
          speaker: prince
          text: 国王把公主的戒指扔进了小溪。我若找不到，他就要叫我死得很惨。
          emotion: sad
        - id: ch03-b20
          speaker: wild_duck
          text: 别为这件事难过，我能帮您。我就是您曾经放过的野鸭王。那时您救了我，现在轮到我来救您。
          emotion: calm
        - id: ch03-b21
          speaker: narrator
          text: 野鸭王说完便飞走了。几分钟以后，一大群野鸭落进小溪。它们沿着水流游到上游，又游到下游，一只只使出浑身力气，仔细察看清澈的溪底。国王议事回来以前，那枚戒指已经被找到了，正安安稳稳地放在王子身旁的草地上。
        - id: ch03-b22
          speaker: narrator
          text: 国王看见戒指，对粮仓总管的本领更加惊讶，马上升他做珠宝总管。
    - id: ch04
      title: 鹳王带来的婴儿
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了这一步，你也许以为国王总该满意，不会再为难王子了。可人的本性很难改变。两个士兵编出第三个谎言，国王还是马上听信。
        - id: ch04-b02
          speakers: [soldier_1, soldier_2]
          ensemble: duo
          text: 仁慈的陛下，您的珠宝总管宣称，今夜宫中会生下一个婴儿。这个孩子能讲世上的一切语言，也会演奏所有乐器。他能预知未来，难道已经成了先知或魔法师？
        - id: ch04-b03
          speaker: narrator
          text: 国王听完，比从前任何一次都更恼怒。他自己也曾试着学习魔法，可不知怎么回事，那些咒语从来没有灵验过。如今，王子竟敢声称拥有他没有的力量，这比那三个预言本身更叫他生气。国王气得结结巴巴，命人立刻把年轻人押到面前。
        - id: ch04-b04
          speaker: second_king
          text: 今夜要是没有这样的奇迹，我就把你绑在马尾上，拖遍全城，直到你断气！
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 可男孩和国王一样，对魔法一窍不通。这次的差事比先前更没有希望。他被锁在房里，只能躺着哭。忽然，窗上传来急促的啄击声。王子抬头，看见了那只鹳。
        - id: ch04-b06
          speaker: stork
          text: 王子，什么事让您这样伤心？
        - id: ch04-b07
          speaker: prince
          text: 有人骗国王，说我预言今夜宫里会生下一个婴儿。这个孩子能说所有语言，也会演奏所有乐器。我不是魔法师，怎么可能办到？可事情若不发生，国王就要把我绑在马尾上，拖过全城，直到死去。
          emotion: fearful
        - id: ch04-b08
          speaker: stork
          text: 不必烦恼。我会找到这样的孩子。我就是您从前饶过的鹳王，现在该报答您了。
          emotion: calm
        - id: ch04-b09
          speaker: narrator
          text: 鹳王从窗口飞走，不久便回来了。它的长嘴里衔着一个裹在襁褓中的婴儿。鹳王把孩子轻轻放在一把鲁特琴旁边，婴儿立刻伸出两只小手，拨动琴弦，弹出一支无比动听的曲子。王子站在旁边听得入迷，连压在心头的忧愁都忘了。
        - id: ch04-b10
          speaker: narrator
          text: 接着，有人递来长笛和齐特琴。婴儿拿起哪件乐器，都能奏出音乐。王子渐渐有了勇气，便用自己懂得的各种语言同他讲话。孩子每一种都能回答，任谁也听不出哪一种才是他的母语。
    - id: ch05
      title: 善意得到回报
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天早晨，国王直奔王子的房间，亲眼看见婴儿的种种奇能。
        - id: ch05-b02
          speaker: second_king
          text: 你的魔法能变出这样的孩子，看来你胜过古往今来所有的魔法师。我要把女儿嫁给你！
          emotion: surprised
        - id: ch05-b03
          speaker: narrator
          text: 国王想要什么，一向恨不得立刻得到。他马上命人举行婚礼，还为新娘和新郎办了一场盛大的宴席。婚宴结束，他又问王子。
        - id: ch05-b04
          speaker: second_king
          text: 现在你真正是我的儿子了。告诉我，你到底用了什么法术，才完成我交给你的那些差事？
        - id: ch05-b05
          speaker: prince
          text: 尊贵的岳父，我根本不懂咒语和法术。只是每次死亡逼近，我都设法逃过了一劫。
        - id: ch05-b06
          speaker: narrator
          text: 王子把自己的经历从头讲起。继父怎样逼得他逃亡，他怎样放走金胡子人，又怎样饶过斑鸠、野鸭和鹳。他还说起两个士兵怎样与他结伴，又因为嫉妒，一次次设法害死他。
        - id: ch05-b07
          speaker: narrator
          text: 国王听完这一切，得知女儿嫁的是一位真正的王子，而不是他原先以为的普通人，心里十分欢喜。他挥起鞭子，把两个士兵赶出王国，还警告他们，往后若敢越过国界露面，就让他们尝尝原本为王子预备的死法。
