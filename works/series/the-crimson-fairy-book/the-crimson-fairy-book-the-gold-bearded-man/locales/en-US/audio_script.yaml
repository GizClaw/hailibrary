  chapters:
    - id: ch01
      title: The King, the Brook, and the Golden Cage
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a great king with a wife and one young son whom he dearly loved. One day, the king felt that death was drawing near. He called the queen to him.
        - id: ch01-b02
          speaker: father_king
          text: Promise me you will never marry another husband. Give the rest of your life to caring for our son.
        - id: ch01-b03
          speaker: narrator
          text: The queen burst into tears. She sobbed that she would never marry again and would always put her son's welfare first. Her promise eased the king's troubled heart. A few days later, he died at peace with himself and the world.
        - id: ch01-b04
          speaker: queen
          text: Making a promise is one thing. Keeping it is quite another.
        - id: ch01-b05
          speaker: narrator
          text: The last earth had hardly been thrown over the king's coffin when the queen married a nobleman from a neighboring country. She made her new husband king instead of her young son. The new king was cruel and wicked. He gave the prince barely enough food and dressed him in rags. He would have killed the boy if he had not feared the people.
        - id: ch01-b06
          speaker: narrator
          text: A brook ran beside the palace grounds, but milk flowed in it instead of water. Rich and poor came every day and took all the milk they wanted. As soon as the new king sat on the throne, he forbade anyone to approach the brook. Watchmen would seize anyone who disobeyed. He did this only from spite, for the brook held enough milk for everyone.
        - id: ch01-b07
          speaker: narrator
          text: For several days, no one dared go near it. Then the watchmen noticed something strange at dawn. A man with a gold beard came to the brook, filled a pail to the brim, and vanished like smoke before they could reach him. They reported this to the king.
        - id: ch01-b08
          speaker: narrator
          text: The king refused to believe them at first. When they insisted it was true, he went to watch the brook himself. At the first streak of dawn, the gold-bearded man appeared and filled his pail. In the next instant, he was gone, as though the earth had swallowed him.
        - id: ch01-b09
          speaker: narrator
          text: The king stood staring at the place where the man had disappeared, with his eyes and mouth wide open. One thing was certain. He had never seen this stranger before. Yet the questions that mattered most to him were how to catch the man and what to do once he was caught. The king decided to build a cage for his prison. Other countries shut thieves inside ordinary prisons, and it had been a very long time since any king had used a cage. Such a sight would give everyone something to talk about.
        - id: ch01-b10
          speaker: narrator
          text: Planning was easy. The king even stationed a watchman behind every bush. Catching the stranger was another matter. Each time he bent to fill his pail, the guards crept softly toward him over the grass. Just as they stretched out their hands to seize him, he vanished before their eyes. The same thing happened time after time, until the king flew into a rage. He began calling the gold-bearded stranger his enemy and offered a great reward to anyone who could explain how to capture him.
        - id: ch01-b11
          speaker: narrator
          text: An old soldier was the first to offer a plan.
        - id: ch01-b12
          speaker: old_soldier
          text: Put bread, bacon, and a flask of wine beside the brook. He is sure to eat and drink. Mix sleeping powder into the wine, and once he is asleep, all you need to do is lock him in the cage.
        - id: ch01-b13
          speaker: narrator
          text: The king liked the scheme. He ordered the food and drugged wine set beside the stream and doubled the watch. Then he waited eagerly.
        - id: ch01-b14
          speaker: narrator
          text: Everything happened as the soldier had promised. Early the next morning, the gold-bearded man ate the food, drank the wine, and fell fast asleep. The guards bound him easily and carried him to the palace. The king locked him in a golden cage and showed him with savage delight to visitors at his court.
        - id: ch01-b15
          speaker: narrator
          text: When the captive woke from his drugged sleep, he tried to speak to the strangers who had gathered around him, but no one would listen. At last he shut himself away inside his own silence. People came only to stare, and they decided he must be a mute man from the woods. All day he wept and moaned to himself. He scarcely touched his food. The king dreaded the thought that the prisoner might die and escape his tormentors, so he ordered the head cook to send fine dishes from the royal table.

    - id: ch02
      title: The Prince Sets the Captive Free
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: About a month passed. Then the king had to make war on a neighboring country and leave the palace to command his army. Before he rode away, he called his stepson to him.
        - id: ch02-b02
          speaker: stepfather_king
          text: Listen carefully, boy. While I am gone, the prisoner is your responsibility. Give him plenty to eat and drink, but do not let him escape or even walk around the room. If I return and find him gone, you will die a terrible death.
        - id: ch02-b03
          speaker: narrator
          text: The prince was glad to see his stepfather leave for war. In secret, he hoped the man would never return. As soon as the king rode away, the boy went to the room with the cage. He stayed there day and night and even played his games beside it.
        - id: ch02-b04
          speaker: narrator
          text: One day, the prince was using a silver bow to shoot at a mark. An arrow flew into the golden cage. He ran up to the bars.
        - id: ch02-b05
          speaker: prince
          text: Please pass my arrow back to me.
        - id: ch02-b06
          speaker: gold_bearded_man
          text: I will give it back only if you open this cage and let me out.
        - id: ch02-b07
          speaker: prince
          text: I cannot do that. My stepfather says he will give me a horrible death if you escape before he returns. You have no use for my arrow, so please give it back.
        - id: ch02-b08
          speaker: narrator
          text: The man passed the arrow through the bars. Once he had returned it, he begged harder than ever for the prince to open the door. He pleaded so earnestly that the boy's heart was touched. The prince was tender-hearted, and the suffering of other people always moved him to pity. At last he could bear the prisoner's sorrow no longer. He drew back the bolt, opened the golden door, and the gold-bearded man stepped out into the world.
        - id: ch02-b09
          speaker: gold_bearded_man
          text: I will repay this kindness a thousand times over.
        - id: ch02-b10
          speaker: narrator
          text: Then he vanished. The prince wondered what he could say when the king came home. Was it wise to wait and risk the dreadful death his stepfather had promised?
        - id: ch02-b11
          speaker: prince
          text: No. I am afraid to stay. Perhaps the world will treat me more kindly than he has.
        - id: ch02-b12
          speaker: narrator
          text: The prince waited until twilight and slipped out unseen. For many days, he wandered over mountains, through forests, and along deep valleys. He had no idea where the road was taking him, and he could not guess what he would do when he arrived. No one gave him food along the way. He lived only on the berries he found growing wild.

    - id: ch03
      title: Three Acts of Mercy
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: One morning, the prince saw a wood-pigeon perched on a branch. He fitted an arrow to his bow and took aim, thinking the bird would make a good meal. Then the pigeon spoke, and the bow dropped from his hands.
        - id: ch03-b02
          speaker: wood_pigeon
          text: Please do not shoot me, noble prince! I have two young sons at home. If I cannot bring them food, they will starve.
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: The prince took pity on the bird and unstrung his bow.
        - id: ch03-b04
          speaker: wood_pigeon
          text: Thank you, prince. I will repay you for sparing my life.
        - id: ch03-b05
          speaker: prince
          text: You poor creature. How could you ever repay me?
        - id: ch03-b06
          speaker: wood_pigeon
          text: Have you forgotten the old saying? Mountain can never meet mountain, but one living creature can always meet another.
        - id: ch03-b07
          speaker: narrator
          text: The boy laughed at that answer and continued on his way.
        - id: ch03-b08
          speaker: narrator
          text: After a while, he reached a lake. A wild duck flew toward the rushes near the shore. While his father was alive and the prince had all the food he could wish for, wild duck had always been served on his birthday. He quickly raised his bow and aimed.
        - id: ch03-b09
          speaker: wild_duck
          text: Please do not shoot me, noble prince! I have two young sons waiting at home. They will starve if I do not return with food.
          emotion: fearful
        - id: ch03-b10
          speaker: narrator
          text: Again, pity stopped the prince. He lowered the arrow and unstrung his bow.
        - id: ch03-b11
          speaker: wild_duck
          text: Prince, I will repay you for this mercy.
        - id: ch03-b12
          speaker: prince
          text: Poor little duck. What could you possibly do for me?
        - id: ch03-b13
          speaker: wild_duck
          text: Remember the old saying. Mountain can never meet mountain, but one living creature can always meet another.
        - id: ch03-b14
          speaker: narrator
          text: The boy laughed once more and walked on.
        - id: ch03-b15
          speaker: narrator
          text: Not far beyond the lake, he noticed a stork standing on one leg. For a third time, he lifted his bow and prepared to shoot.
        - id: ch03-b16
          speaker: stork
          text: Please spare me, noble prince! I have two young sons at home. Without the food I bring them, they will starve.
          emotion: fearful
        - id: ch03-b17
          speaker: narrator
          text: The prince was filled with pity, and he spared the stork too.
        - id: ch03-b18
          speaker: stork
          text: I will repay your mercy one day, prince.
        - id: ch03-b19
          speaker: prince
          text: Poor stork. How can you ever repay me?
        - id: ch03-b20
          speaker: stork
          text: You know the old saying. Mountain can never meet mountain, but one living creature can always meet another.
        - id: ch03-b21
          speaker: narrator
          text: The boy laughed to hear the same words a third time and slowly went on. Before long, he met two soldiers who had been discharged from service.
        - id: ch03-b22
          speaker: soldier_one
          text: Where are you headed, little brother?
        - id: ch03-b23
          speaker: prince
          text: I am looking for work.
        - id: ch03-b24
          speaker: soldier_one
          text: So are we. Let us all travel together.
        - id: ch03-b25
          speaker: narrator
          text: The prince was happy to have company after traveling alone. The three of them walked on and on, crossing one kingdom after another. They passed through seven kingdoms altogether, asking for work wherever they went, but they could find nothing they were able to do. At last their road brought them to another palace. The king himself was standing outside on the steps as they approached.
        - id: ch03-b26
          speaker: palace_king
          text: You three seem to be searching for something.
        - id: ch03-b27
          speakers: [prince, soldier_one, soldier_two]
          ensemble: chorus
          text: We are looking for work, Your Majesty.
        - id: ch03-b28
          speaker: narrator
          text: The king offered the two soldiers places as his coachmen. The boy pleased him more, so he chose the prince as his personal companion and gave him rooms near his own. When the soldiers learned how differently the king had treated the three travelers, they were terribly angry. Of course, they had no idea their young companion was truly a prince. They laid their heads together and began searching for a way to ruin him.

    - id: ch04
      title: The Wheat and the Barley
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The two soldiers went before the king with their first lie.
        - id: ch04-b02
          speakers: [soldier_one, soldier_two]
          ensemble: duo
          text: Your Majesty, we must tell you what your new companion has been saying. He claims that if he were your steward, he would never lose a single grain from your storehouses. Mix a sack of wheat with a sack of barley. Order him to separate every grain within two hours, and you will see what his boasting is worth.
        - id: ch04-b03
          speaker: narrator
          text: The weak king believed the wicked men. He ordered the prince to sort the mixed grain into two piles before the council ended.
        - id: ch04-b04
          speaker: palace_king
          text: Succeed, and I will make you my steward. Fail, and I will put you to death here and now.
        - id: ch04-b05
          speaker: narrator
          text: The unhappy prince declared that he had never made any such boast. His words were useless. The king would not believe him. He sent the boy into an empty room and ordered his servants to carry in the enormous sack. Before they left, they emptied it onto the floor, scattering the mixed wheat and barley into one great heap.
        - id: ch04-b06
          speaker: narrator
          text: The prince hardly knew where to begin. There were more grains than he could count, and every one had to be examined. Even if a thousand people had come to help him and worked for a whole week, they could never have finished in time. He threw himself onto the floor in despair and covered his face with his hands. While he lay there, a wood-pigeon flew in through the window.
        - id: ch04-b07
          speaker: wood_pigeon
          text: Why are you crying, noble prince?
        - id: ch04-b08
          speaker: prince
          text: How can I keep from crying? The king ordered me to sort all this wheat from the barley. If I fail, he says I will die a horrible death.
          emotion: sad
        - id: ch04-b09
          speaker: wood_pigeon
          text: There is no need to weep. I am the king of the wood-pigeons. You spared my life when you were hungry, and now I will keep my promise and repay you.
          emotion: calm
        - id: ch04-b10
          speaker: narrator
          text: With that, the pigeon flew out through the window. For the first time since entering the room, the prince felt a little hope. Within minutes, the bird returned with a cloud of wood-pigeons behind him. There were so many that the flock seemed to fill the entire room. Their king showed them the two kinds of grain and explained the task. Every bird began working at once. Long before the council ended, the wheat and barley stood in two separate heaps.
        - id: ch04-b11
          speaker: narrator
          text: When the king returned, he could hardly believe his eyes. He searched both piles, but there was not one barley grain among the wheat or one grain of wheat among the barley. He praised the prince for being clever and hardworking and made him steward at once.
        - id: ch04-b12
          speaker: narrator
          text: The two soldiers grew even more envious and began to prepare another plot.

    - id: ch05
      title: The Ring in the Brook
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One day, the soldiers found the king standing on the palace steps.
        - id: ch05-b02
          speakers: [soldier_one, soldier_two]
          ensemble: duo
          text: Your Majesty, that fellow has been boasting again. He says that if you trusted him with your treasures, he would never lose so much as a gold pin. Test this vain young man. Throw the princess's ring into the brook and order him to find it. Then we will see what his words are worth.
        - id: ch05-b03
          speaker: narrator
          text: The foolish king listened again and summoned the prince.
        - id: ch05-b04
          speaker: palace_king
          text: My son, I hear that you claim you could guard my treasure without losing even a gold pin. I am going to throw the princess's ring into the brook. Find it before I return from council, or you will die a horrible death.
        - id: ch05-b05
          speaker: narrator
          text: Once again, the prince denied saying any such thing. Once again, it did no good. The king did not believe a word and paid no attention to his protests. He hurried off to the council and left the poor boy standing speechless with despair in a corner. After a while, the prince gathered his thoughts. Finding the ring in the brook seemed almost impossible, but staying inside the palace would make it entirely impossible.
        - id: ch05-b06
          speaker: narrator
          text: He went down to the brook and walked along its bank for a long time. Again and again, he bent over the water and searched the streambed. The water was so clear that he could see all the way to the bottom, yet nowhere could he see the ring. At last he gave up in despair. He threw himself down at the foot of a tree and wept bitterly. Then a voice spoke just above his head. The prince looked up and saw the wild duck.
        - id: ch05-b07
          speaker: wild_duck
          text: What is wrong, dear prince?
        - id: ch05-b08
          speaker: prince
          text: The king threw the princess's ring into this brook. He says I must find it, or he will have me put to a horrible death.
          emotion: sad
        - id: ch05-b09
          speaker: wild_duck
          text: Do not distress yourself. I can help. I am the king of the wild ducks, and you once spared my life. Now it is my turn to save yours.
          emotion: calm
        - id: ch05-b10
          speaker: narrator
          text: The duck flew away. A few minutes later, he returned with a great flock of wild ducks. They dropped onto the brook and spread out along the water. Every bird swam up and down, searching the clear stream with all its might. They kept searching until one of them found what the prince needed. Long before the king came back from council, the princess's ring lay safely on the grass beside him.
        - id: ch05-b11
          speaker: narrator
          text: The king was even more astonished by his steward's cleverness. He immediately promoted the prince to keeper of the royal jewels.
        - id: ch05-b12
          speaker: narrator
          text: You might think the king would now have trusted the prince and left him in peace. But a person's nature is hard to change. When the envious soldiers arrived with one more lie, he was as ready to listen as ever.

    - id: ch06
      title: The Stork's Wonderful Child
      blocks:
        - id: ch06-b01
          speakers: [soldier_one, soldier_two]
          ensemble: duo
          text: Gracious Majesty, the young keeper of your jewels says a child will be born in the palace tonight. This baby will speak every language in the world and play every musical instrument. Has he become a prophet or a magician who can know the future?
        - id: ch06-b02
          speaker: narrator
          text: This made the king angrier than ever. He had once tried to learn magic himself. Somehow, no matter what he did, his spells had never worked. Now he heard that the prince claimed to know the future and possess a power the king could not master. The thought filled him with fury. He stammered with rage as he ordered his servants to bring the young man before him.
        - id: ch06-b03
          speaker: palace_king
          text: Unless this wonder happens exactly as you have foretold, I will have you tied behind a horse and dragged until you are dead!
          emotion: angry
        - id: ch06-b04
          speaker: narrator
          text: The prince knew no more magic than the king, whatever the soldiers had said. This task seemed the most hopeless of all. He lay weeping in the room he was forbidden to leave. Suddenly, something tapped sharply on the window. He looked up and saw a stork.
        - id: ch06-b05
          speaker: stork
          text: What has made you so unhappy, prince?
        - id: ch06-b06
          speaker: prince
          text: Someone told the king I predicted that a child would be born here tonight who could speak every language and play every instrument. I have no magic to make that happen. If it does not, the king says he will have a horse drag me through the city until I die.
          emotion: sad
        - id: ch06-b07
          speaker: stork
          text: Do not worry. I will find such a child. I am the king of the storks, and you spared my life. Now I can repay you.
          emotion: calm
        - id: ch06-b08
          speaker: narrator
          text: The stork flew away. Soon he returned with a baby wrapped in swaddling clothes and held gently in his beak. He laid the child down near a lute. The baby's little hands reached for the instrument at once and began to play. The tune was so beautiful that, as the prince listened, he forgot all about the sorrow that had weighed on him.
        - id: ch06-b09
          speaker: narrator
          text: They gave the baby a flute and then a zither, and the child drew music from each one just as easily. Hope began to return to the prince. He spoke to the baby in every language he knew, and the child answered in them all. No listener could have guessed which language was the baby's own.
        - id: ch06-b10
          speaker: narrator
          text: The next morning, the king went straight to the prince's room and saw these wonders for himself.
        - id: ch06-b11
          speaker: palace_king
          text: If your magic can bring me such a child, then you are greater than any wizard who ever lived. You shall marry my daughter.
        - id: ch06-b12
          speaker: narrator
          text: The king had spent his life giving commands, and he was accustomed to having everything the moment he wanted it. He would not hear of waiting. He ordered the wedding ceremony to take place without delay and commanded that a splendid feast be prepared for the bride and groom. Only after the celebration was over did he ask the prince how the wonders had been done.
        - id: ch06-b13
          speaker: palace_king
          text: Now that you are truly my son, tell me what magic allowed you to complete the tasks I gave you.
        - id: ch06-b14
          speaker: prince
          text: My noble father-in-law, I know no spells and have no magical arts. Somehow, whenever death threatened me, I found a way to escape it.
        - id: ch06-b15
          speaker: narrator
          text: The prince told the whole story. His cruel stepfather had forced him to flee. During his travels, he had spared the wood-pigeon, the wild duck, and the stork. Then he had joined the two soldiers, who had tried again and again to destroy him out of envy.
        - id: ch06-b16
          speaker: narrator
          text: The king was delighted to learn that his daughter had married a prince instead of a common man. He had the two soldiers chased from the kingdom with whips. He warned them that if they ever crossed its borders again, they would suffer the same death he had prepared for the prince.
