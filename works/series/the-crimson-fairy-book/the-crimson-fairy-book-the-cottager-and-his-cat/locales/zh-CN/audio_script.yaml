audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而带几分诙谐，像在讲一则古老的欧洲童话
        timbre: 温暖清亮
        pace: 舒缓，转折处有自然停顿
        pitch: 中音
    young_man:
      display_name: 年轻人
      tts:
        delivery: 诚恳善良，困顿时略带忧郁，作出选择时干脆坦率
        timbre: 清朗温和
        pace: 中速
        pitch: 中音
    dream_man:
      display_name: 梦中人
      tts:
        delivery: 神秘郑重，句句像不容违背的告诫
        timbre: 沉稳深厚
        pace: 偏慢
        pitch: 低音
    old_woman:
      display_name: 林中老妇人
      tts:
        delivery: 朴实慈祥，待客热心
        timbre: 温暖苍老
        pace: 舒缓
        pitch: 中低音
    supper_woman:
      display_name: 屋中女子
      tts:
        delivery: 朴素友善，见到稀奇事物时自然好奇
        timbre: 柔和明亮
        pace: 中速
        pitch: 中音
    supper_man_1:
      display_name: 屋中男子甲
      tts:
        delivery: 随和朴实，说话简短
        timbre: 清晰厚实
        pace: 中速
        pitch: 中低音
    supper_man_2:
      display_name: 屋中男子乙
      tts:
        delivery: 随和朴实，说话简短
        timbre: 清晰温和
        pace: 中速
        pitch: 中音
    host:
      display_name: 好心的老人
      tts:
        delivery: 慷慨亲切，给人指点时笃定可靠
        timbre: 温厚苍老
        pace: 舒缓
        pitch: 中低音
    king:
      display_name: 国王
      tts:
        delivery: 威严直率，苦恼时无奈，赏赐时爽快庄重
        timbre: 洪亮成熟
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 守财奴的遗产
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，国王和王后住在一座华美的王宫里。离王宫不远，有间又脏又破的村舍，里面住着一个老头儿和他的妻子。大家都说，那屋子破得连猪都不肯住。可老头儿其实非常富有。他运气好，又爱钱如命。若要花掉一枚心爱的金币，他宁可饿上一整天。
        - id: ch01-b02
          speaker: narrator
          text: 他一次次饿着自己，终于病倒了。身体已经虚弱得再也好不起来，几天后，他便死了，留下妻子和儿子。
        - id: ch01-b03
          speaker: narrator
          text: 父亲去世后的夜里，儿子做了一个梦。一个陌生人来到他面前，郑重地告诫他。
        - id: ch01-b04
          speaker: dream_man
          text: 你听好。你父亲已经去世，你母亲也活不了多久，他们的钱都会归你。不过，其中一半是从穷人手里榨来的，你得还给他们。剩下的一半，全扔进海里。钱往下沉时仔细看，水面若还浮着什么，就捞起来收好，哪怕只是一片纸。
        - id: ch01-b05
          speaker: narrator
          text: 陌生人随即消失，年轻人醒了。梦里的话一直压在心头，让他十分为难。他从小就知道挨饿受冻是什么滋味，好不容易盼到能过几天舒服快活的日子，实在舍不得父亲留下的钱。可他诚实善良，想到父亲若真用不正当的手段得来那些钱，自己怎么也无法安心享用。
        - id: ch01-b06
          speaker: narrator
          text: 最后，他还是照梦中的话做了。他打听出村里哪些人最贫苦，拿一半钱帮助他们。另一半装进口袋，带到伸向海中的岩石上，全部抛进水里。钱转眼便沉得无影无踪，谁也说不出它们落在海底的什么地方。只有一小片纸还浮在水面。
        - id: ch01-b07
          speaker: narrator
          text: 年轻人小心探下身，终于够到了那片纸。打开一看，里面包着六个先令。这就是他在世上仅剩的钱了。他望着钱想了一会儿，低声说道。
        - id: ch01-b08
          speaker: young_man
          text: 唉，六个先令能做什么呢？不过，总比一分钱也没有强。
        - id: ch01-b09
          speaker: narrator
          text: 他重新把钱包好，塞进外衣口袋。
    - id: ch02
      title: 六个先令买来的伙伴
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 此后几个星期，年轻人一直在园里劳作，和母亲靠收获的瓜果蔬菜勉强生活。谁知母亲也突然去世了。他亲手安葬了母亲，心里沉甸甸的，悲痛地走进森林，连自己要去哪里也不知道。走了好一阵，他才渐渐觉得饿了。
        - id: ch02-b02
          speaker: narrator
          text: 走到饥肠辘辘时，他看见一间小屋，便敲门求一点牛奶。开门的老妇人立刻请他进去。
        - id: ch02-b03
          speaker: old_woman
          text: 快进来吧。你若没有地方过夜，也尽管住下，不用付钱。
        - id: ch02-b04
          speaker: narrator
          text: 屋里有两名女子和三名男子在吃晚饭。众人默默让出一个位置，请他坐在旁边。年轻人吃饱后四下看了看，忽然发现炉边坐着一只从未见过的动物。它灰灰的，个头不大，一双眼睛却又大又亮，嘴里还用奇怪的调子唱着歌，和森林里的任何动物都不同。
        - id: ch02-b05
          speaker: young_man
          text: 那个古怪的小家伙叫什么？
        - id: ch02-b06
          speakers: [old_woman, supper_woman, supper_man_1, supper_man_2]
          ensemble: chorus
          text: 我们叫它猫。
        - id: ch02-b07
          speaker: young_man
          text: 要是它不太贵，我想把它买下来。有它在身边，我就不孤单了。
        - id: ch02-b08
          speaker: narrator
          text: 众人说，六个先令就能把猫带走。年轻人取出那片珍贵的纸，交出了自己所有的钱。第二天清早，他向大家告别，把猫舒舒服服地裹在斗篷里，又上路了。
        - id: ch02-b09
          speaker: narrator
          text: 他和猫在草地与森林间走了整整一天。傍晚，他们来到另一所房子。年轻人敲响房门，向开门的老人说明，自己想借宿一夜，却没有钱付住宿费。
        - id: ch02-b10
          speaker: host
          text: 既然如此，这一晚就由我白白招待你吧。
        - id: ch02-b11
          speaker: narrator
          text: 老人把他领进屋。老人的妻子、女儿和另外两个男人正在用餐。年轻人把猫放上壁炉台，所有人都围过来，仔细端详这只从未见过的怪兽。猫亲热地蹭着他们，又伸出爪子，还唱起歌来。两个女人喜欢极了，把猫能吃的东西全拿出来，连它吃不下的也给了不少。
        - id: ch02-b12
          speaker: narrator
          text: 听完年轻人的遭遇，老人得知他除了猫已经一无所有，便劝他到几英里外的王宫去，请国王给他指条路。那位国王待人人都很和善，见他如此困苦，一定愿意做他的朋友。年轻人谢过老人，欣然答应照办。第二天一早，他便向王宫出发。
    - id: ch03
      title: 王宫里的老鼠
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 年轻人请人向国王通报，说自己希望觐见。宫中很快传来答复，让他直接去大殿，国王陛下正在那里。那时，国王正和满朝大臣一起吃饭。他招手叫年轻人上前，年轻人深深行了一礼。
        - id: ch03-b02
          speaker: narrator
          text: 一抬头，年轻人吃惊地看见，大群黑色小动物在地板上乱窜，有些还爬上了餐桌。它们胆大包天，直接从国王的盘里抢走食物。国王伸手驱赶，它们反倒要咬他的手，害得他一口饭也吃不成。满桌的大臣们同样狼狈。
        - id: ch03-b03
          speaker: young_man
          text: 这些小黑动物究竟是什么？
        - id: ch03-b04
          speaker: narrator
          text: 年轻人本是在问身旁的一位贵妇，国王却听见了，亲自回答他。
        - id: ch03-b05
          speaker: king
          text: 它们叫老鼠。我们想了好多年，也没办法把它们除掉。它们闹得太凶，连我们的床铺都要钻进去。
        - id: ch03-b06
          speaker: narrator
          text: 话音刚落，有个东西嗖地飞过半空。原来猫跳上了桌子。只见它接连甩动两三下，身边立刻躺倒了一大片死老鼠。其余老鼠吓得四散奔逃，大殿里满是仓皇的脚步声。没过几分钟，一只老鼠也看不见了。
        - id: ch03-b07
          speaker: narrator
          text: 国王和大臣们面面相觑，惊得半晌没有说话。国王终于开口问道。
        - id: ch03-b08
          speaker: king
          text: 这是什么动物？它怎么会施展这样的魔法？
          emotion: surprised
        - id: ch03-b09
          speaker: young_man
          text: 它叫猫，是我花六个先令买来的。
        - id: ch03-b10
          speaker: narrator
          text: 国王听罢，当场许下重赏。
        - id: ch03-b11
          speaker: king
          text: 你替王宫除了这场多年的祸害，给我带来了好运。我让你自己选。你可以当我的首相，也可以娶我的女儿，等我去世以后统治这个国家。告诉我，你要哪一样？
        - id: ch03-b12
          speaker: young_man
          text: 我要公主和王国。
        - id: ch03-b13
          speaker: narrator
          text: 事情果然就这样办了。
