  chapters:
    - id: ch01
      title: The Search for a Child
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, all these things truly happened. If they had not, there would be no story to tell. It was an age when wolves and lambs rested peacefully in one stall, and shepherds sat on grassy banks to dine with kings and queens.
        - id: ch01-b02
          speaker: narrator
          text: In those days there lived a man who was a hundred years old, and perhaps another twenty besides. His wife was very old too. No one knew her age, though some said she was as old as the goddess Venus. They had shared many happy years. Yet they had never had a child, and that one sorrow always stayed with them. They still refused to give up hope. Often they sat by the fire and spoke about how they would have raised the children who never came to their home.
        - id: ch01-b03
          speaker: narrator
          text: One day the old man was quieter and sadder than usual. At last, he turned to his wife.
        - id: ch01-b04
          speaker: old_man
          text: Listen to me, old woman.
          emotion: sad
        - id: ch01-b05
          speaker: wife
          text: What is it you want?
        - id: ch01-b06
          speaker: old_man
          text: Take some money from the chest for me. I mean to travel all through the world and search for a child. My heart aches when I think that a stranger will have our house after I die. And hear this. If I cannot find a child, I will never come home.
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: He filled a bag with food and money, slung it over his shoulder, and said farewell to his wife. Then he wandered on and on for a very long time, without seeing a single child. One morning his road brought him to a forest so dense that no light could slip between its branches.
        - id: ch01-b08
          speaker: narrator
          text: The old man stopped before that dreadful wood. At first he was afraid to enter. Then he remembered the old saying that the unexpected is exactly what happens. Perhaps the child he sought was waiting inside that black place. He gathered all his courage and plunged among the trees.
        - id: ch01-b09
          speaker: narrator
          text: He could never have said how long he walked before he came to a cave. Its mouth looked a hundred times darker than the forest. Once again he hesitated. Still, something seemed to draw him forward, and he stepped inside with his heart pounding.
        - id: ch01-b10
          speaker: narrator
          text: For several minutes, the deep silence and darkness held him still. He did not dare take another step. At last he forced himself onward. A few paces later, he saw a faint light far ahead. Hope returned, and he followed that glimmer until he found an old hermit sitting beside it. The hermit had a long white beard and was reading a book.
        - id: ch01-b11
          speaker: narrator
          text: Either the hermit did not hear his visitor, or he chose to act as if he had not. He kept reading. The old man waited patiently, then dropped to his knees.
        - id: ch01-b12
          speaker: old_man
          text: Good morning, holy father.
        - id: ch01-b13
          speaker: narrator
          text: The hermit gave no more answer than the rock itself. The old man tried once more, speaking louder.
        - id: ch01-b14
          speaker: old_man
          text: Good morning, holy father!
        - id: ch01-b15
          speaker: narrator
          text: This time the hermit beckoned him closer.
        - id: ch01-b16
          speaker: hermit
          text: My son, why have you come to this dark, miserable place? Hundreds of years have passed since I last saw a human face. I never thought I would see one again.
          emotion: surprised
        - id: ch01-b17
          speaker: old_man
          text: Misery led me here. My wife and I have wanted a child all our lives, but we have none. I left home to search the world, hoping that somewhere I might find the child we longed for.
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: The hermit picked up an apple from the ground and placed it in the old man's hand.
        - id: ch01-b19
          speaker: hermit
          text: Eat one half of this apple. Give the other half to your wife, and stop wandering through the world.
        - id: ch01-b20
          speaker: narrator
          text: Joy swept over the old man. He bent down and kissed the hermit's feet, then hurried away from the cave.

    - id: ch02
      title: The Child Among the Roses
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The old man made his way through the forest as quickly as the darkness allowed. At last he came out into fields full of flowers, and their brightness dazzled him. Then a terrible thirst seized him. His throat burned, but he could not find a stream anywhere. With every moment, his tongue grew drier.
        - id: ch02-b02
          speaker: narrator
          text: The apple was still in his hand. In his thirst, he forgot the hermit's command. He ate his own half, then ate the half meant for his wife as well. Afterward, he lay down and fell asleep.
        - id: ch02-b03
          speaker: narrator
          text: When he awoke, he noticed something strange on a bank nearby, half hidden among long trails of pink roses. He rose, rubbed his eyes, and went closer. There lay a little girl about two years old. Her skin was as pink and white as the roses above her.
        - id: ch02-b04
          speaker: narrator
          text: Astonishment turned to joy. The old man lifted her gently into his arms. She was not frightened at all. She bounced and crowed with delight. He wrapped her in his cloak and set off for home as fast as his old legs could carry him.
        - id: ch02-b05
          speaker: narrator
          text: Near the cottage, he placed the child in a pail beside the door. Then he ran inside, calling for his wife.
        - id: ch02-b06
          speaker: old_man
          text: Come quickly, wife! Hurry! I have brought you a daughter with golden hair and eyes like stars!
          emotion: happy
        - id: ch02-b07
          speaker: narrator
          text: At that wonderful news, the old woman flew down the stairs and nearly tumbled in her eagerness to see the treasure. Her husband led her to the pail. It was completely empty.
        - id: ch02-b08
          speaker: narrator
          text: Horror almost drove the old man out of his senses. His wife sat down and sobbed with grief and disappointment. They searched every spot nearby. Perhaps, they thought, the child had climbed out of the pail and hidden herself for fun. But the little girl was nowhere to be found. Not one sign of her remained.
        - id: ch02-b09
          speaker: old_man
          text: Where can she be? Oh, why did I leave her, even for a moment? Did the fairies take her? Did some wild beast carry her away?
          emotion: sad
        - id: ch02-b10
          speaker: narrator
          text: They began the whole search again. They found no fairies and no wild beasts. At last, with aching hearts, they gave up and went sadly into their cottage.
        - id: ch02-b11
          speaker: narrator
          text: But what had happened to the baby? Left alone in a strange place, she had begun to cry in fear. An eagle circling nearby heard the sound and came to learn what made it. When he saw the plump little pink-and-white creature, he thought of his hungry young ones. He swooped down, caught her in his claws, and flew with her over the treetops.
        - id: ch02-b12
          speaker: narrator
          text: Within minutes he reached the tree where he had built his nest. He laid the child among his soft young eaglets and flew away. The old man had named her Wildrose, though he had possessed her for so short a time.
        - id: ch02-b13
          speaker: narrator
          text: The eaglets were naturally surprised when this strange creature suddenly landed among them. Their father expected them to eat her. Instead, they nestled close to Wildrose and spread their tiny wings over her to keep off the sun.

    - id: ch03
      title: The Battle Below the Nest
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Deep in that forest, a stream of poisonous water ran beneath the eagle's tree. On its banks lived a horrible lindworm with seven heads. Many times the monster had watched the eagle carry food to his young. So it waited for the eaglets to begin testing their wings and leaving the nest.
        - id: ch03-b02
          speaker: narrator
          text: The lindworm knew it could do nothing while the great eagle stood guard, no matter how big and strong the monster was. When the father was gone, though, any young bird that came too near the ground was certain to vanish down one of its throats.
        - id: ch03-b03
          speaker: narrator
          text: The smallest eaglets, still too young and weak to fly, knew none of this. They only believed their own turn to see the world would come soon. A few days passed. Their eyes opened, and their wings beat impatiently. They longed to rise over the moving treetops and see the mountains and the bright sun beyond.
        - id: ch03-b04
          speaker: narrator
          text: But at midnight, the hungry lindworm could wait no longer for its supper. It surged out of the stream and went straight toward the tree. Two eyes like flames crept closer and closer. Two fiery tongues stretched nearer and nearer to the little birds. The eaglets huddled in the farthest corner of the nest, trembling and shivering.
        - id: ch03-b05
          speaker: narrator
          text: Just as the tongues were about to reach them, the lindworm let out a dreadful cry. It twisted around and fell backward. A battle broke out on the ground below. Though there was no wind, the whole tree shook. Roars and snarls rose together through the dark. The eaglets grew more terrified than ever and believed their final hour had come.
        - id: ch03-b06
          speaker: narrator
          text: Wildrose alone was undisturbed. She slept sweetly through it all.
        - id: ch03-b07
          speaker: narrator
          text: The eagle returned in the morning. Beneath the tree he found signs of a fierce struggle. Tufts of yellow mane lay scattered here and there, mixed with hard pieces of scale. He was overjoyed by what he saw and rushed up to the nest.
        - id: ch03-b08
          speaker: eagle
          text: Children, who killed the lindworm?
        - id: ch03-b09
          speaker: narrator
          text: He had so many children that at first he did not notice the two the lindworm had eaten. The eaglets could not name their rescuer. They knew only that they had been in mortal danger, and at the very last moment something had saved them.
        - id: ch03-b10
          speaker: narrator
          text: Then a sunbeam struggled through the thick branches and caught the golden hair of Wildrose, curled asleep in one corner. As the eagle looked at her, he wondered if the little girl had brought him good fortune. Perhaps, he thought, her magic had destroyed his enemy.
        - id: ch03-b11
          speaker: eagle
          text: Children, I brought this creature here to be your dinner, but you have not touched her. What does this mean?
        - id: ch03-b12
          speaker: narrator
          text: The eaglets gave him no answer. Wildrose opened her eyes, and she seemed seven times lovelier than she had before.
        - id: ch03-b13
          speaker: narrator
          text: From that day on, Wildrose lived like a little princess. The eagle searched the forest for the softest, greenest moss and made her a bed. With his beak, he gathered the brightest flowers from fields and mountains to decorate it.
        - id: ch03-b14
          speaker: narrator
          text: He arranged everything so cleverly that any fairy in the forest would have been glad to sleep there, rocking back and forth in the breeze at the top of the tree. When the young eagles learned to leave the nest, their father taught them where to find the fruits and berries Wildrose loved.
        - id: ch03-b15
          speaker: narrator
          text: The years passed. Wildrose grew taller and more beautiful with each one. She was happy in her nest and never wished to leave it. At sunset she would stand at the edge and gaze over the lovely world. All the forest birds came to talk with her. They brought strange flowers from distant places for her playthings, and butterflies danced beside her.
        - id: ch03-b16
          speaker: narrator
          text: So the days slipped by until Wildrose was fourteen years old.

    - id: ch04
      title: The Prince in the Forest
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One morning, the emperor's son rode out to hunt. He had not gone far when a deer sprang from beneath a grove of trees and raced away before him. The prince gave chase at once. Wherever the stag led, he followed, until he reached a part of the forest where no man had ever walked.
        - id: ch04-b02
          speaker: narrator
          text: The trees crowded close, and the wood was terribly dark. The prince stopped to listen. He strained to hear something that might break the frightening silence, but no hound bayed and no hunting horn sounded. He stood wondering whether to go on.
        - id: ch04-b03
          speaker: narrator
          text: Then he looked up. A stream of light seemed to pour from the top of a tall tree. In that light he saw a nest, and young eagles peered at him over its rim. He set an arrow to his bow and aimed. Before he could release it, another ray flashed into his eyes. It shone so brightly that his bow fell from his hand, and he covered his face.
        - id: ch04-b04
          speaker: narrator
          text: At last he dared to look between his fingers. Wildrose stood above him, watching, with her golden hair flowing all around her. Never before had she seen a man.
        - id: ch04-b05
          speaker: prince
          text: Tell me, how can I climb up to you?
        - id: ch04-b06
          speaker: narrator
          text: Wildrose only smiled, shook her head, and quietly sat down.
        - id: ch04-b07
          speaker: narrator
          text: The prince understood that he could do nothing, so he turned back and found his way out of the forest. Yet he might as well have remained there, for he was no use to his father after that. His heart was full of longing for Wildrose. Twice he returned, hoping to find her again. Both times fortune deserted him, and he came home as sorrowful as before.
        - id: ch04-b08
          speaker: narrator
          text: At last the emperor, unable to understand the change in his son, summoned him and asked what troubled him. The prince confessed that Wildrose's image filled his whole soul and that without her he could never be happy.
        - id: ch04-b09
          speaker: narrator
          text: The emperor was troubled at first. He was not sure a girl raised at the top of a tree would make a suitable empress. But he loved his son dearly and promised to do everything he could to find her.
        - id: ch04-b10
          speaker: narrator
          text: The next morning, heralds went throughout the land. They asked whether anyone knew of a maiden who lived at the top of a tree in a forest. Whoever found her would receive great riches and a place at court.
        - id: ch04-b11
          speaker: narrator
          text: No one knew where she was. Every girl in the kingdom lived in a home on the ground, and they laughed at the idea of anyone being raised in a tree. They had read enough books to guess why the emperor wanted the maiden.
        - id: ch04-b12
          speakers: [village_girl_1, village_girl_2]
          ensemble: duo
          text: What a fine sort of empress she would make!
        - id: ch04-b13
          speaker: narrator
          text: The girls tossed their heads with scorn, thinking just as the emperor had at first. The heralds were almost ready to despair when an old woman stepped from the crowd. She was ancient and very ugly, with a hump on her back and no hair on her head. The heralds took one look at her and burst into rude laughter.
        - id: ch04-b14
          speaker: cunning_woman
          text: I can show you the girl who lives at the top of the tree.
        - id: ch04-b15
          speaker: narrator
          text: The heralds only laughed harder.
        - id: ch04-b16
          speakers: [second_herald, third_herald]
          ensemble: duo
          text: Go away, old witch! You will bring us nothing but bad luck!
        - id: ch04-b17
          speaker: narrator
          text: The old woman refused to move. She insisted that she alone knew where the maiden could be found.
        - id: ch04-b18
          speaker: eldest_herald
          text: Take her with us. The emperor's command was clear. Anyone who knows something about the maiden must be brought straight to court. Put her in the coach.
        - id: ch04-b19
          speaker: narrator
          text: And so, in that fashion, the old woman traveled to the palace.

    - id: ch05
      title: The Cunning Old Woman
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The emperor sat upon his throne when the old woman was led before him.
        - id: ch05-b02
          speaker: emperor
          text: You say you can bring me the maiden who lives in the forest?
        - id: ch05-b03
          speaker: cunning_woman
          text: Yes, Your Majesty. I gave my word, and I will keep it.
        - id: ch05-b04
          speaker: emperor
          text: Then bring her here at once.
        - id: ch05-b05
          speaker: cunning_woman
          text: First, give me a kettle and a tripod.
        - id: ch05-b06
          speaker: narrator
          text: The emperor ordered both things brought immediately. The old woman tucked the kettle and tripod under one arm and started on her way. Royal huntsmen rode ahead of her, following the prince, while she kept a little distance behind.
        - id: ch05-b07
          speaker: narrator
          text: What a noise she made as she walked! She chattered to herself without stopping and banged the kettle so loudly that anyone listening might have expected an entire camp of travelers to appear around the next bend. When they reached the forest, she ordered everyone else to wait outside. Then she entered the dark wood alone.
        - id: ch05-b08
          speaker: narrator
          text: The old woman stopped beneath Wildrose's tree and gathered dry sticks for a fire. She set the tripod over the flames and put the kettle on top. But the kettle would not stay where she placed it. Each time she balanced it on the tripod, it rolled off and struck the ground with a crash.
        - id: ch05-b09
          speaker: narrator
          text: It seemed as if the kettle itself were under a spell. No one can say what would have happened next if Wildrose had not been watching from her nest. At last, the girl's patience with the old woman's foolishness ran out.
        - id: ch05-b10
          speaker: wildrose
          text: That tripod will never stand on a hill. You have to move it!
          emotion: angry
        - id: ch05-b11
          speaker: cunning_woman
          text: But where should I put it, my child?
        - id: ch05-b12
          speaker: narrator
          text: She looked up toward the nest while trying to hold the kettle steady with one hand and the tripod with the other.
        - id: ch05-b13
          speaker: wildrose
          text: I told you, that will not work. Build your fire beside a tree and hang the kettle from a branch.
          emotion: angry
        - id: ch05-b14
          speaker: narrator
          text: The old woman lifted the kettle and hung it from a slender twig. The twig snapped at once, and down crashed the kettle again.
        - id: ch05-b15
          speaker: cunning_woman
          text: If you came down and showed me, perhaps then I could understand.
        - id: ch05-b16
          speaker: narrator
          text: In an instant, Wildrose slid down the smooth tree trunk. She stood beside the foolish-looking old woman, ready to show her the proper way. But the moment her feet touched the ground, the old woman seized her. She swung Wildrose over her shoulders and ran as fast as she could toward the edge of the forest, where the prince was waiting.

    - id: ch06
      title: Wildrose Leaves the Tree
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: When the prince saw the old woman and Wildrose coming, he hurried eagerly to meet them. He took the maiden in his arms and kissed her tenderly before everyone there.
        - id: ch06-b02
          speaker: narrator
          text: They dressed Wildrose in a gown of gold and wound pearls through her hair. Then she took her place in the emperor's carriage. Six of the whitest horses in the world drew it, racing without a pause until they reached the palace gates.
        - id: ch06-b03
          speaker: narrator
          text: Three days later, Wildrose and the prince were married, and a great wedding feast was held.
        - id: ch06-b04
          speaker: narrator
          text: Everyone who saw the bride agreed on one thing. If anyone wished to find a perfect wife, they must go and search for her at the top of a tree.
