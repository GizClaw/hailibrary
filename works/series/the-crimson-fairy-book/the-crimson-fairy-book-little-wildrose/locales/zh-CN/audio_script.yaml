audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而带几分诙谐，像在讲一则古老的欧洲童话
        timbre: 温暖清亮
        pace: 舒缓，转折处有自然停顿
        pitch: 中音
    old_man:
      display_name: 老头儿
      tts:
        delivery: 善良执着，忧伤时低沉，欢喜时格外急切
        timbre: 苍老温厚
        pace: 中速偏慢
        pitch: 中低音
    old_wife:
      display_name: 老太婆
      tts:
        delivery: 朴实直率，悲喜都流露得真切
        timbre: 苍老柔和
        pace: 中速
        pitch: 中音
    hermit:
      display_name: 老隐士
      tts:
        delivery: 幽深安定，言语简短而有分量
        timbre: 苍老低沉
        pace: 缓慢
        pitch: 低音
    eagle:
      display_name: 老鹰
      tts:
        delivery: 威严直率，对孩子们说话时带着父亲的关切
        timbre: 洪亮粗粝
        pace: 中速
        pitch: 中低音
    wildrose:
      display_name: 小野蔷薇
      tts:
        delivery: 清澈天真，指点别人时爽快而略显不耐烦
        timbre: 明亮轻柔
        pace: 中速
        pitch: 中高音
    prince:
      display_name: 王子
      tts:
        delivery: 年轻诚挚，思念深切，见到心上人时热切
        timbre: 清朗明亮
        pace: 中速
        pitch: 中音
    emperor:
      display_name: 皇帝
      tts:
        delivery: 庄重果断，对儿子怀有深厚的慈爱
        timbre: 浑厚沉稳
        pace: 中速偏慢
        pitch: 中低音
    girl_1:
      display_name: 王国姑娘甲
      tts:
        delivery: 自负轻慢，嘲笑时故作聪明
        timbre: 清脆
        pace: 中速偏快
        pitch: 中高音
    girl_2:
      display_name: 王国姑娘乙
      tts:
        delivery: 自负轻慢，随声附和
        timbre: 明亮
        pace: 中速偏快
        pitch: 中高音
    girl_3:
      display_name: 王国姑娘丙
      tts:
        delivery: 自负轻慢，语气里带着不屑
        timbre: 轻细
        pace: 中速
        pitch: 高音
    herald_1:
      display_name: 传令官甲
      tts:
        delivery: 粗鲁轻率，奉命办事时声调响亮
        timbre: 响亮粗厚
        pace: 中速偏快
        pitch: 中低音
    herald_2:
      display_name: 传令官乙
      tts:
        delivery: 粗鲁轻率，喜欢跟着同伴起哄
        timbre: 干脆洪亮
        pace: 中速偏快
        pitch: 中音
    eldest_herald:
      display_name: 年长的传令官
      tts:
        delivery: 务实严肃，开口时带着领头人的权威
        timbre: 稳重粗厚
        pace: 中速
        pitch: 中低音
    old_witch:
      display_name: 老巫婆
      tts:
        delivery: 外表笨拙，内里狡猾，装糊涂时十分自然
        timbre: 苍老沙哑
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 寻找一个孩子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，这个故事里的事当真发生过。不然，也不会有人把它讲到今天。那时候，狼和羊羔能安然住在一座棚里，牧羊人也会坐在青草坡上，陪国王和王后一起吃饭。
        - id: ch01-b02
          speaker: narrator
          text: 就在那个年月，有一对老夫妻。老头儿足足一百岁，说不定还要多二十岁。妻子也老得很，有人说，她简直和维纳斯女神一样老。他们一直过得幸福，只遗憾家里没有孩子。两人始终不肯死心，常坐在炉边说，要是孩子来到家里，他们会怎样把孩子养大。
        - id: ch01-b03
          speaker: narrator
          text: 一天，老头儿比平常更加忧愁。想了许久，他终于叫住妻子。
        - id: ch01-b04
          speaker: old_man
          text: 老太婆，你听我说。
        - id: ch01-b05
          speaker: old_wife
          text: 你要什么？
        - id: ch01-b06
          speaker: old_man
          text: 从箱子里拿些钱给我。我要走遍全世界，去找一个孩子。一想到我死后，这座房子会落进陌生人手里，我心里就难受。要是找不到孩子，我再也不回来了。
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: 老头儿拿来一只口袋，往里面装满食物和钱，背到肩上，告别妻子出发了。他走啊，走啊，走了很久很久，却连一个孩子也没有看见。一天早晨，他来到一片密林前。那里的树木挤得密密层层，枝叶把光遮得严严实实。他望着这个可怕的地方，停住脚步，一时不敢进去。
        - id: ch01-b08
          speaker: narrator
          text: 可他想起一句老话，偏偏是没料到的事才会发生。也许自己要找的孩子，就在这片黑暗里。他鼓足勇气，闯进森林，一直走到一座洞穴前。洞里比林中还要黑上百倍。他又停了下来，却像被什么力量推着，心头怦怦直跳地走了进去。
        - id: ch01-b09
          speaker: narrator
          text: 最初几分钟，四周又黑又静，吓得他站在原地，一步也不敢动。后来，他费了好大力气，才壮起胆子往前走了几步。远处忽然露出一点微光，他的勇气也回来了。老头儿对准那几缕微弱的光一直走，终于看见一个留着长长白胡子的老隐士，正坐在光旁读书。
        - id: ch01-b10
          speaker: narrator
          text: 隐士不知是没听见，还是故意不理，只管盯着书。老头儿耐心等了一会儿，跪下来向他问安。第一声没有回应，他便提高声音又说了一遍。
        - id: ch01-b11
          speaker: old_man
          text: 早安，圣父！
        - id: ch01-b12
          speaker: narrator
          text: 隐士招手叫他靠近。低低的声音一响，整个洞穴里都是回声。
        - id: ch01-b13
          speaker: hermit
          text: 我的孩子，是什么把你带到这片阴暗凄凉的地方？几百年了，我再没见过人的面孔，还以为今生都不会再见了。
          emotion: surprised
        - id: ch01-b14
          speaker: old_man
          text: 是苦恼把我带来的。我和妻子一辈子都盼着有个孩子，却始终没有。我离开家走遍世间，只希望能在什么地方找到一个。
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: 隐士从地上捡起一个苹果，递到他手中。
        - id: ch01-b16
          speaker: hermit
          text: 你吃一半，另一半带给妻子。以后不用再到处找了。
        - id: ch01-b17
          speaker: narrator
          text: 老头儿欢喜得俯身亲吻隐士的脚，随即离开洞穴。他照着黑暗允许的最快速度，摸索着穿过森林，终于来到鲜花盛开的田野。明亮的天光耀得他眼睛发花。偏偏这时，他渴得要命，喉咙里像着了火，舌头也越来越干。四下找不到溪水，他看见了始终握在手里的苹果。干渴让他把隐士的嘱咐忘得一干二净，不但吃掉自己的那一半，连妻子的也吞进肚里。吃完，他便睡着了。
        - id: ch01-b18
          speaker: narrator
          text: 醒来时，他发现不远处的坡上有个奇怪的东西，四周垂绕着长长的粉红蔷薇。老头儿站起来，揉揉眼睛，走近一看，又惊又喜。原来，那是个两岁左右的小女孩，她的肌肤像头顶的蔷薇一样粉白。老头儿轻轻把她抱进怀里，她一点儿也不怕，只欢喜得又蹦又咯咯笑。他用斗篷把孩子裹好，迈开双腿，以最快的速度往家赶。
        - id: ch01-b19
          speaker: narrator
          text: 快到小屋时，老头儿把孩子放在门边的木桶里，自己冲进屋去。
        - id: ch01-b20
          speaker: old_man
          text: 快来，老太婆！我给你带回一个女儿。她的头发像金子，眼睛像星星！
          emotion: happy
        - id: ch01-b21
          speaker: narrator
          text: 听见这个天大的喜讯，老太婆飞奔下楼，急着要看那宝贝，差点滚下楼梯。可丈夫把她领到门外，木桶里竟然空空如也。老头儿吓得几乎发疯，妻子坐在地上，又伤心又失望地抽泣。他们把周围每一寸地方都找遍了，以为孩子不知怎么爬出木桶，正在淘气地躲藏。可是哪里都没有她，连半点踪影也找不着。
        - id: ch01-b22
          speaker: old_man
          text: 她到底去哪儿了？我为什么要离开她，哪怕只是一小会儿？是仙女带走了她，还是野兽把她叼走了？
          emotion: sad
        - id: ch01-b23
          speaker: narrator
          text: 两人又从头找了一遍，仙女和野兽都没有遇见。最后，他们只好忍着心痛，悲伤地回到小屋。
    - id: ch02
      title: 老鹰巢里的小野蔷薇
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那个小娃娃去了哪里呢？她独自留在陌生地方，害怕得哭起来。一只老鹰听见哭声，飞来查看。它瞧见这个胖乎乎、粉白粉白的小东西，想起家里饿着肚子的小鹰，便俯冲下来，用利爪抓起她，带着她飞过树梢。
        - id: ch02-b02
          speaker: narrator
          text: 老鹰回到自己的巢，把小女孩放进长着绒毛的幼鸟中间，又飞走了。老头儿曾给她取名小野蔷薇。小鹰们见这个奇怪的动物突然落在身旁，都很惊讶。可它们没有照父亲料想的那样吃掉她，反而紧紧偎着她，张开稚嫩的翅膀替她遮阳。
        - id: ch02-b03
          speaker: narrator
          text: 森林深处，那棵大树下流着一条溪。溪水含有剧毒，岸边住着一条可怕的七头巨蛇。它常常看见老鹰在树顶飞来飞去，给幼鸟送去食物，于是耐心等着小鹰开始试翅、离开巢穴。老鹰亲自守在旁边时，巨蛇就算再庞大强壮，也知道自己无计可施。可父亲一走，哪只幼鸟胆敢靠近地面，就准会消失在怪物的喉咙里。
        - id: ch02-b04
          speaker: narrator
          text: 有些兄弟已经飞出去见过世面，留在巢里的小鹰还太幼小虚弱，对巨蛇的事一无所知。它们只以为，很快也该轮到自己出去了。没过几天，它们的眼睛也睁开了，翅膀不耐烦地拍个不停，一心盼着飞到摇曳的树顶之上，去看看远处的高山和明亮的太阳。
        - id: ch02-b05
          speaker: narrator
          text: 就在那天午夜，饥饿的巨蛇等不及晚餐，哗啦一声钻出溪水，直奔大树。两只火焰般的眼睛越逼越近，两条燃烧似的舌头伸向巢穴深处。小鹰们缩在那里，吓得浑身发抖。
        - id: ch02-b06
          speaker: narrator
          text: 舌头眼看就要碰到它们，巨蛇忽然惨叫一声，身子一扭，向后倒去。树下响起厮杀声。明明没有风，整棵树却摇晃不止，咆哮与怒吼混在一起。小鹰们以为末日到了。只有小野蔷薇安然不动，一直睡得香甜。
        - id: ch02-b07
          speaker: narrator
          text: 清晨，老鹰飞回来了。树下到处是搏斗的痕迹，这里散着黄色鬃毛，那里落着坚硬的鳞甲。它欢喜万分，赶紧飞到巢边。
        - id: ch02-b08
          speaker: eagle
          text: 孩子们，是谁杀死了七头巨蛇？
        - id: ch02-b09
          speaker: narrator
          text: 老鹰的孩子太多，起初竟没发现两只已经被巨蛇吃掉。小鹰们说不出是谁救了它们，只知道自己命悬一线，最后关头逃过一劫。一束阳光穿过密枝，落在蜷缩于角落的小野蔷薇那头金发上。老鹰望着她，猜想这个女孩是不是带来了好运，用魔法杀死了仇敌。
        - id: ch02-b10
          speaker: eagle
          text: 我把她带回来给你们当晚餐，你们怎么一点儿也没碰？这是为什么？
        - id: ch02-b11
          speaker: narrator
          text: 小鹰们没有回答。小野蔷薇睁开眼睛，看起来比先前美了七倍。
        - id: ch02-b12
          speaker: narrator
          text: 从这一天起，小野蔷薇过上了公主般的日子。老鹰飞遍树林，找来最柔软、最青翠的苔藓给她铺床，又用尖喙从田野和山间采下最鲜艳、最美丽的花朵，把床铺装点起来。它布置得巧极了，森林里的仙女没有一个不乐意躺在上面，让树梢的风吹着自己轻轻摇晃。等小鹰能够飞出巢穴，父亲又教它们去哪里寻找小野蔷薇爱吃的果子和浆果。
        - id: ch02-b13
          speaker: narrator
          text: 岁月就这样流过。一年又一年，小野蔷薇越长越高，也越来越美。她幸福地生活在自己的巢里，从来不想离开，只在夕阳西下时站到巢边，眺望面前美丽的世界。森林里所有的鸟儿都是她的伙伴，常常飞来陪她说话。它们从远方带回来的奇花成了她的玩具，蝴蝶也陪着她翩翩起舞。日子悄悄溜走，她已经十四岁了。
    - id: ch03
      title: 王子看见树顶的光
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天早晨，皇帝的儿子出门打猎。骑马还没有走出多远，一头鹿便从一片树丛下蹿出来，在他前面飞奔。王子立刻催马追赶。雄鹿跑到哪里，他便紧紧跟到哪里，追了许久，最后竟来到森林最深处，一个从来没有人踏足的地方。
        - id: ch03-b02
          speaker: narrator
          text: 树木层层叠叠，林中昏暗无光。王子停下来侧耳细听，竭力想从几乎令他害怕的寂静中捕捉到一点声音。可什么也没有传来，既听不见猎犬的吠叫，也听不见号角声。他站在原地，正犹豫要不要继续往前，忽然抬头看见一道亮光，仿佛溪流一般从一棵高树的顶端流泻下来。
        - id: ch03-b03
          speaker: narrator
          text: 光芒里有一座鸟巢，几只小鹰正在巢边望着他。王子搭箭拉弓，刚刚瞄准，另一道光忽然照得他睁不开眼。弓从手里掉下，他赶紧遮住脸。过了好一会儿，他才敢从指缝偷看。小野蔷薇披散着金发，站在树顶望着他。这也是她第一次见到男人。
        - id: ch03-b04
          speaker: prince
          text: 告诉我，我怎样才能上去见你？
        - id: ch03-b05
          speaker: narrator
          text: 小野蔷薇只微笑着摇摇头，安静地坐了下来。王子知道再待下去也没有办法，只得转身寻找出路，离开森林。可从此以后，他的心里全是对小野蔷薇的思念，对父亲也帮不上什么忙了。他又两次回到森林，希望重新找到她。可是两回都没有先前那样的好运，只能像原来一样，满怀悲伤地回家。
        - id: ch03-b06
          speaker: narrator
          text: 皇帝怎么也想不明白，儿子为什么会变成这样，终于把他叫来询问。王子这才承认，小野蔷薇的身影占满了他的心，没有她，自己永远不会快乐。皇帝听完很是忧虑。他拿不准，一个在树梢长大的姑娘能不能做好皇后。可他实在太爱儿子了，还是答应尽自己所能把她找来。
        - id: ch03-b07
          speaker: narrator
          text: 第二天一早，传令官奉命走遍全国，打听谁知道森林里住在树顶的少女。能找到她的人，会得到巨额财富和宫廷里的职位。可是没有人知道。王国里的姑娘全都住在地面上，一听说有人是在树上养大的，都觉得这个念头十分可笑。她们轻蔑地甩着头。因为读过许多书，她们已经猜到皇帝为什么要找那个姑娘。
        - id: ch03-b08
          speakers: [girl_1, girl_2, girl_3]
          ensemble: chorus
          text: 让她来当皇后，可真合适啊！
        - id: ch03-b09
          speaker: narrator
          text: 传令官们几乎绝望的时候，一个老妇人从人群里走了出来，主动同他们搭话。她不但年纪很大，而且丑得惊人，背上高高隆起一个驼峰，头顶一根头发也没有。传令官们一见她这副模样，立刻无礼地放声大笑。
        - id: ch03-b10
          speaker: old_witch
          text: 我能带你们找到那个住在树顶的姑娘。
        - id: ch03-b11
          speaker: narrator
          text: 他们听了，笑得更响。
        - id: ch03-b12
          speakers: [herald_1, herald_2]
          ensemble: duo
          text: 快走开，老巫婆！你会给我们带来霉运！
        - id: ch03-b13
          speaker: narrator
          text: 老妇人寸步不让，坚持说只有自己知道少女在哪里。年纪最大的传令官终于制止了同伴。
        - id: ch03-b14
          speaker: eldest_herald
          text: 带她走。皇帝命令过，谁知道少女的消息，就要立刻带到宫里。让她上车，跟我们回去。
        - id: ch03-b15
          speaker: narrator
          text: 老妇人就这样来到宫廷，站在皇帝的宝座前。
        - id: ch03-b16
          speaker: emperor
          text: 你说，自己能把森林里的姑娘带到这里来？
        - id: ch03-b17
          speaker: old_witch
          text: 是的，陛下。我说到做到。
        - id: ch03-b18
          speaker: emperor
          text: 那就马上把她带来。
        - id: ch03-b19
          speaker: old_witch
          text: 请先给我一口锅，再给我一只三脚架。
        - id: ch03-b20
          speaker: narrator
          text: 皇帝马上叫人取来。老妇人把锅和三脚架夹在腋下，走在王室猎人后面。猎人们跟着王子，她又和他们隔开一段距离。
    - id: ch04
      title: 老妇人的圈套
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 哎哟，那老妇人一路可真吵闹！她嘴里飞快地自言自语，手里的锅也哐啷哐啷响个不停。听见那阵势，谁都会以为一整营的吉卜赛人就要从下一个拐角出现。到了森林边，她叫王子和所有猎人都等在外面，自己独自走进昏暗的树林。
        - id: ch04-b02
          speaker: narrator
          text: 她来到小野蔷薇居住的树下，捡来一些枯枝，点起一堆火。接着，她把三脚架支在火上，再把锅放到架子顶端。可那口锅偏偏像是有毛病，怎么也放不稳。每次老妇人把它摆到该放的位置，它准会滚落下来，哐当一声砸在地上。
        - id: ch04-b03
          speaker: narrator
          text: 那口锅简直像中了魔法。小野蔷薇一直从巢里偷偷往外看，终于忍受不了老妇人的笨拙。
        - id: ch04-b04
          speaker: wildrose
          text: 三脚架放在斜坡上，当然站不稳。你得换个地方！
        - id: ch04-b05
          speaker: old_witch
          text: 可我该搬到哪里去呢，孩子？
        - id: ch04-b06
          speaker: narrator
          text: 老妇人抬头望着鸟巢，一只手扶锅，另一只手稳住架子。小野蔷薇更加不耐烦了。
        - id: ch04-b07
          speaker: wildrose
          text: 我已经告诉你，那样根本没用。到树旁边生火，把锅挂在一根树枝上。
        - id: ch04-b08
          speaker: narrator
          text: 老妇人拿起锅，挂到一根细枝上。树枝立刻折断，锅又摔到地上。
        - id: ch04-b09
          speaker: old_witch
          text: 你要是肯下来做给我看，我也许就会了。
        - id: ch04-b10
          speaker: narrator
          text: 小野蔷薇想也没想，立刻顺着光滑的树干滑下来，站到那个看似笨拙的老妇人身边，准备亲手教她该怎样做。可就在这一瞬间，老妇人一把抓住少女，把她甩到肩上，迈开脚步，拼命朝森林边缘跑去。王子正在那里等候。
        - id: ch04-b11
          speaker: narrator
          text: 王子看见她们从林中出来，急忙冲上前迎接，当着众人的面把少女搂进怀里，温柔地亲吻她。接着，人们给小野蔷薇穿上一袭金色长裙，又把珍珠编进她的头发。她坐进皇帝的马车，由世上最洁白的六匹骏马拉着。马儿一口气也不停，飞奔着把她送到宫门前。
        - id: ch04-b12
          speaker: narrator
          text: 三天以后，小野蔷薇和王子举行了婚礼，宫里也摆下盛大的喜宴。每一个见过新娘的人都异口同声地说，谁要是想找到一位十全十美的妻子，就应当到树顶上去寻找。
        - id: ch04-b13
          speaker: narrator
          text: 这个故事改编自一则罗马尼亚故事。
