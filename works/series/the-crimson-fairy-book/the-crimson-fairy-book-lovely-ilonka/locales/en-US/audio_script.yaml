  chapters:
    - id: ch01
      title: The Search for the Three Bulrushes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There once was a prince who told his father that he wanted to marry.
        - id: ch01-b02
          speaker: king_father
          text: No, no. You mustn't rush into marriage. First you must do some great deed. My own father made me wait until I had won the golden sword I wear today.
        - id: ch01-b03
          speaker: narrator
          text: The prince was bitterly disappointed, but disobeying his father never entered his mind. He thought as hard as he could about what great deed he might do. He would find no answer by staying at home, so one day he went out into the world to seek his fortune.
        - id: ch01-b04
          speaker: narrator
          text: Before long, he came to a little hut. Inside, an old woman was crouched over the fire.
        - id: ch01-b05
          speaker: prince
          text: Good evening, mother. You've lived a long time and seen a great deal. Can you tell me anything about the three bulrushes?
        - id: ch01-b06
          speaker: first_old_woman
          text: I've certainly lived long and traveled far, but I've never seen or heard of them. Stay here until tomorrow, though. By then, I may have something to tell you.
        - id: ch01-b07
          speaker: narrator
          text: The prince stayed. Early the next morning, the old woman brought out a little pipe and blew into it. In a moment, every crow in the world came flying around her. Not a single crow was missing. She asked them all about the three bulrushes, but none of them knew a thing.
        - id: ch01-b08
          speaker: narrator
          text: So the prince continued on his way. A little farther on, he found another hut, and an old man lived there. The old man knew nothing about the bulrushes either, but he asked the prince to spend the night.
        - id: ch01-b09
          speaker: narrator
          text: In the morning, the old man summoned every raven. Yet the ravens had nothing to tell him. The prince said farewell and set out once more.
        - id: ch01-b10
          speaker: narrator
          text: He wandered on until he had crossed seven kingdoms. At last, one evening, he reached a little house where another old woman lived.
        - id: ch01-b11
          speaker: prince
          text: Good evening, dear mother.
        - id: ch01-b12
          speaker: third_old_woman
          text: Good evening, my dear son. You were lucky to speak to me. If you hadn't, you would have met a terrible death. Now, where are you going?
        - id: ch01-b13
          speaker: prince
          text: I'm looking for the three bulrushes. Do you know where they are?
        - id: ch01-b14
          speaker: third_old_woman
          text: I don't know myself. But stay until tomorrow, and perhaps I'll be able to tell you then.
        - id: ch01-b15
          speaker: narrator
          text: The next morning, she blew on her pipe. Every magpie in the world flew to her except one. That last magpie had a broken leg and a broken wing, so the old woman sent for it at once. When she questioned all the birds, only the injured magpie knew where the three bulrushes could be found.

    - id: ch02
      title: Beyond the Stone Wall
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The prince set off with the lame magpie. They traveled on and on until they came to an enormous stone wall, many feet high.
        - id: ch02-b02
          speaker: magpie
          text: Prince, the three bulrushes are on the other side of that wall.
        - id: ch02-b03
          speaker: narrator
          text: The prince did not waste a moment. He urged his horse straight at the wall, and together they leaped over it. On the far side, he searched until he found the three bulrushes. He pulled them from the ground and started for home.
        - id: ch02-b04
          speaker: narrator
          text: As he rode, one bulrush struck against something and split open. And what do you think happened? A lovely girl sprang out of it.
        - id: ch02-b05
          speaker: first_maiden
          text: My heart's love, you belong to me, and I belong to you. Please give me a glass of water.
        - id: ch02-b06
          speaker: narrator
          text: But there was no water anywhere near, so the prince could give her none. The lovely maiden flew away.
        - id: ch02-b07
          speaker: narrator
          text: The prince decided to try the second bulrush. He split it open, and another lovely maiden appeared.
        - id: ch02-b08
          speaker: second_maiden
          text: My heart's love, you are mine, and I am yours. Please give me a glass of water.
        - id: ch02-b09
          speaker: narrator
          text: Again, he had no water to give her, and she too flew away.
        - id: ch02-b10
          speaker: narrator
          text: After that, he guarded the third bulrush with the greatest care. He did not open it until he reached a well. There he split it, and out sprang a maiden seven times lovelier than either of the others.
        - id: ch02-b11
          speaker: ilonka
          text: My heart's love, I belong to you, and you belong to me. Please give me a glass of water.
        - id: ch02-b12
          speaker: narrator
          text: This time, water was ready. The maiden drank and did not fly away. Her name was Ilonka, and she and the prince promised to love each other forever. Then they began the journey home together.

    - id: ch03
      title: The Bride at the Well
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Soon they reached the prince's country. He wanted to bring his promised bride home in a splendid coach, so he went ahead to town to fetch one.
        - id: ch03-b02
          speaker: narrator
          text: The king's swineherds and cowherds were tending their animals in the field around the well. The prince left Ilonka in their care while he was gone.
        - id: ch03-b03
          speaker: narrator
          text: Now, the chief swineherd had an ugly old daughter. While the prince was away, the swineherd dressed his daughter in fine clothes and threw Ilonka into the well.
        - id: ch03-b04
          speaker: narrator
          text: It was not long before the prince returned. His father and mother were with him, followed by a great company of courtiers who had come to escort Ilonka home. How they all stared when they saw the swineherd's daughter waiting there!
        - id: ch03-b05
          speaker: narrator
          text: Still, they saw no way out of it, and they took her home. Two days later, the prince married her. Then his father gave the crown to him.
        - id: ch03-b06
          speaker: narrator
          text: But the new king had no peace. He knew perfectly well that someone had tricked him, though he could not understand how it had been done.
        - id: ch03-b07
          speaker: narrator
          text: One day, he asked for water from the very well where Ilonka had been thrown. The coachman went to draw it. When he pulled up the bucket, a pretty little duck was swimming inside.
        - id: ch03-b08
          speaker: narrator
          text: The coachman stared at the duck in wonder. Suddenly it vanished, and a dirty-looking girl stood near him instead. She went back with him and managed to find work as a housemaid in the palace.
        - id: ch03-b09
          speaker: narrator
          text: The girl worked hard from morning until night. Whenever she found a spare moment, she sat down to spin. Her distaff turned on its own. Her spindle spun on its own, and the flax wound itself off. No matter how much flax she used, there was always more.

    - id: ch04
      title: Three Nights at the Palace
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The queen, who was really the swineherd's daughter, heard about the wonderful distaff and longed to own it. But the housemaid refused to give it to her. At last, the girl offered a bargain. The queen could have the distaff if the girl might spend one night in the king's room.
        - id: ch04-b02
          speaker: narrator
          text: The queen flew into a rage and scolded her. Yet she wanted the distaff so badly that she agreed. At supper, however, she slipped a sleeping draught to the king.
        - id: ch04-b03
          speaker: narrator
          text: That night, the girl entered the king's room looking seven times lovelier than ever. She leaned over the sleeping king.
        - id: ch04-b04
          speaker: ilonka
          text: My heart's love, I belong to you, and you belong to me. Say just one word to me. I am your Ilonka.
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: The king was sleeping so deeply that he neither heard her nor answered. Ilonka left the room in sorrow. She believed he was ashamed to acknowledge her.
        - id: ch04-b06
          speaker: narrator
          text: Not long afterward, the queen sent word that she wanted to buy the spindle. The girl offered it for the same price as before. Once again, the queen gave the king a sleeping draught.
        - id: ch04-b07
          speaker: narrator
          text: Ilonka returned to the king's room and spoke to him again. She whispered as sweetly as she could, but no answer came.
        - id: ch04-b08
          speaker: narrator
          text: Some of the king's servants had noticed what was happening. They warned their master that the queen had given him a sleeping draught on two nights in a row.
        - id: ch04-b09
          speakers: [servant_one, servant_two]
          ensemble: duo
          text: Your Majesty, don't eat or drink anything the queen gives you tonight. She has drugged you for the last two nights.
        - id: ch04-b10
          speaker: narrator
          text: The queen had no idea that anyone had discovered her secret. A few days later, she wanted the girl's flax. The price was one more night in the king's room, and the queen agreed without fear.
        - id: ch04-b11
          speaker: narrator
          text: At supper that evening, the queen offered the king all kinds of good things to eat and drink.
        - id: ch04-b12
          speaker: prince
          text: I have no appetite tonight.
        - id: ch04-b13
          speaker: narrator
          text: He went to bed early without touching what she offered. The queen now bitterly regretted her promise, but it was too late to take it back.

    - id: ch05
      title: Ilonka Restored
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Ilonka had already entered the king's room. He lay awake, anxiously waiting, though he did not know what he was waiting for. Then, all at once, he saw a lovely maiden bend over him.
        - id: ch05-b02
          speaker: ilonka
          text: My dearest love, I belong to you, and you belong to me. Please speak to me. I am your Ilonka.
        - id: ch05-b03
          speaker: narrator
          text: At those words, the king's heart leaped. He sprang up, took Ilonka in his arms, and kissed her. Then she told him everything that had happened from the moment he left her beside the well.
        - id: ch05-b04
          speaker: narrator
          text: When the king heard how Ilonka had suffered and how thoroughly he had been deceived, he swore to take revenge. He ordered that the swineherd, the swineherd's wife, and their daughter should all be hanged. And so they were.
        - id: ch05-b05
          speaker: narrator
          text: The next day, the king married fair Ilonka amid great rejoicing.
        - id: ch05-b06
          speaker: narrator
          text: And if they have not died yet, why, they are still alive today.
