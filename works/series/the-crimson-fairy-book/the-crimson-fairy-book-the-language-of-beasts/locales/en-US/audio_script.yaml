  chapters:
    - id: ch01
      title: The Snake in the Fire
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man whose shepherd had served him honestly and faithfully for many years. One day, while tending the flock, the shepherd heard a strange hissing in the nearby forest. He could not imagine what was making such a noise. He left the sheep for a moment and followed the sound through the wood until he came close to its source.
        - id: ch01-b02
          speaker: narrator
          text: Dry grass and leaves had caught fire. Flames circled a tree, and a snake was coiled on it, hissing in terror. The shepherd wondered how the poor creature could escape. The wind was driving the fire toward her, and soon the tree would be burning too.
        - id: ch01-b03
          speaker: snake_princess
          text: Shepherd, in heaven's name, please save me from the fire!
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: The shepherd reached his staff across the flames. The snake wound around it, slid onto his hand, crept up his arm, and wrapped herself around his neck. He shook with fear. Every instant, he expected her to sink her fangs into him and kill him.
        - id: ch01-b05
          speaker: shepherd
          text: What terrible luck! Did I save you only so you could kill me?
          emotion: fearful
        - id: ch01-b06
          speaker: snake_princess
          text: Don't be afraid. Just carry me home to my father, the King of the Snakes.
        - id: ch01-b07
          speaker: narrator
          text: The shepherd was too frightened to listen. He said he could not leave his flock alone.
        - id: ch01-b08
          speaker: snake_princess
          text: Your flock will be safe. No harm will come to them, but we must hurry.
        - id: ch01-b09
          speaker: narrator
          text: Carrying the snake, he set off through the wood. After a while, he reached a huge gateway made entirely of snakes twisted together. He stopped in amazement. The snake around his neck gave a whistle, and at once the whole arch unwound.

    - id: ch02
      title: The King of the Snakes
      blocks:
        - id: ch02-b01
          speaker: snake_princess
          text: When we reach my father's house, he'll offer you anything you ask for. He'll name silver, gold, jewels, and whatever else on earth people treasure most. Refuse every one of those things. Ask him to let you understand the language of beasts. He'll refuse for a long time, but you must hold to your choice. In the end, he'll grant it.
        - id: ch02-b02
          speaker: narrator
          text: Soon they came to the house of the King of the Snakes. When the king saw his daughter, whom he had given up for dead, he burst into tears of joy. Once he could speak again, he asked where she had been.
        - id: ch02-b03
          speaker: snake_king
          text: Where have you been all this time?
        - id: ch02-b04
          speaker: narrator
          text: She told him about the forest fire and how the shepherd had rescued her from the flames. Then the king turned to the man.
        - id: ch02-b05
          speaker: snake_king
          text: You saved my child. What reward would you like?
        - id: ch02-b06
          speaker: shepherd
          text: Let me understand the language of beasts. That's the only reward I want.
        - id: ch02-b07
          speaker: snake_king
          text: That knowledge will do you no good. If I grant it and you tell anyone, you'll die at once. Ask for anything else you wish to possess, and it will be yours.
        - id: ch02-b08
          speaker: shepherd
          text: Sir, if you truly mean to reward me for saving your daughter, then please let me understand the language of beasts. I want nothing else.
        - id: ch02-b09
          speaker: narrator
          text: He turned as though he meant to leave, but the king called him back.
        - id: ch02-b10
          speaker: snake_king
          text: If nothing else will satisfy you, open your mouth.
        - id: ch02-b11
          speaker: narrator
          text: The shepherd obeyed. The king spat into his mouth and told him to spit back. They did this three times. Then the king gave him one last warning.
        - id: ch02-b12
          speaker: snake_king
          text: Now you understand the language of beasts. Go in peace. But if you value your life, never tell anyone about this gift, or you will die at once.

    - id: ch03
      title: The Ravens' Secret
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The shepherd started home. As he passed through the wood, he heard the birds calling and the other living creatures speaking, and now he understood every word. When he reached his sheep, he found the whole flock grazing peacefully, just as the snake had promised. He was tired from the journey, so he lay down beside them to rest for a little while.
        - id: ch03-b02
          speaker: narrator
          text: Almost at once, two ravens landed in a nearby tree and began talking in their own language.
        - id: ch03-b03
          speaker: first_raven
          text: If that shepherd knew there was a vault full of gold and silver under the spot where that lamb is lying, imagine what he would do!
        - id: ch03-b04
          speaker: narrator
          text: The shepherd heard them and went straight to his master with the news. His master brought a wagon to the spot beneath the lamb. They found the vault, broke open its door, and loaded the gold and silver into the wagon. But the master was an honorable man. Instead of keeping any treasure for himself, he gave it all to the shepherd.
        - id: ch03-b05
          speaker: master
          text: Take it. It belongs to you. The gods have given it to you.
        - id: ch03-b06
          speaker: narrator
          text: The shepherd accepted the treasure and built a house. He married, and he and his wife lived together in peace and happiness. Before long, everyone knew him as the richest man in his village and in all the countryside. His sheep, cattle, and horses seemed endless, and he owned fine clothes and jewels as well.

    - id: ch04
      title: Midnight at the Farm
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One day, just before Christmas, the man spoke to his wife.
        - id: ch04-b02
          speaker: shepherd
          text: Prepare everything for a great feast. Tomorrow we'll take it to the farm so the shepherds there can celebrate.
        - id: ch04-b03
          speaker: narrator
          text: His wife obeyed, and everything was ready just as he wanted. The next day they carried the food and drink to the farm together. When evening came, the master called all the shepherds in from their work and invited them to the feast.
        - id: ch04-b04
          speaker: shepherd
          text: Come, all of you. Eat, drink, and enjoy yourselves. Tonight I'll watch the flocks in your place.
        - id: ch04-b05
          speaker: narrator
          text: He went out to spend the night among the animals. At midnight, the wolves howled and the dogs barked. Then the wolves called to the dogs in their own tongue.
        - id: ch04-b06
          speakers: [first_wolf, second_wolf]
          ensemble: duo
          text: Shall we come in and tear through the flock? You can have some meat too.
        - id: ch04-b07
          speakers: [first_dog, second_dog]
          ensemble: duo
          text: Come in! For once, we'll have all the meat we can eat.
        - id: ch04-b08
          speaker: narrator
          text: Among the dogs was one so old that only two teeth remained in his head. He answered the wolves.
        - id: ch04-b09
          speaker: old_dog
          text: As long as those two teeth are still in my mouth, no one will harm my master.
        - id: ch04-b10
          speaker: narrator
          text: The master heard and understood every word. At dawn, he ordered all the dogs killed except the old one. The farm servants were astonished.
        - id: ch04-b11
          speakers: [first_servant, second_servant]
          ensemble: duo
          text: Surely not, sir! It would be a terrible shame to kill them.
          emotion: surprised
        - id: ch04-b12
          speaker: shepherd
          text: Do as I tell you.

    - id: ch05
      title: The Laugh and the Coffin
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Then the man and his wife prepared to go home. They mounted their horses, and the wife's horse was a mare. On the road, the husband rode ahead while his wife fell a little way behind. His stallion looked back and neighed to the mare.
        - id: ch05-b02
          speaker: stallion
          text: Come on, hurry up! Why are you moving so slowly?
        - id: ch05-b03
          speaker: mare
          text: It's easy for you. You only carry our master, and he's thin. I carry our mistress, and she's so fat she weighs as much as three people.
        - id: ch05-b04
          speaker: narrator
          text: The husband understood the mare. He looked back and laughed. His wife noticed, urged her mare forward, and caught up with him.
        - id: ch05-b05
          speaker: wife
          text: Why did you laugh?
        - id: ch05-b06
          speaker: shepherd
          text: No reason. A thought just came into my head.
        - id: ch05-b07
          speaker: narrator
          text: That answer did not satisfy her at all. She kept asking what thought had made him laugh and would not let the question go. Again and again, she pressed him to explain.
        - id: ch05-b08
          speaker: shepherd
          text: Leave it alone, wife. What's come over you? I don't even know why I laughed.
        - id: ch05-b09
          speaker: narrator
          text: The more he tried to put her off, the more she tormented him for the answer. At last, he warned her what it would cost.
        - id: ch05-b10
          speaker: shepherd
          text: You must understand. If I tell you, I will surely die at once.
        - id: ch05-b11
          speaker: narrator
          text: Even the warning did not quiet her. She only begged him more insistently to tell her the cause of his laughter. By then they had reached home. Before he even got off his horse, the man called for someone to bring a coffin. When it arrived, he had it placed before the house and spoke to his wife.
        - id: ch05-b12
          speaker: shepherd
          text: Look. I'll lie down in this coffin, and then I'll tell you why I laughed. The moment I've told you, I will surely die.
        - id: ch05-b13
          speaker: narrator
          text: He lay inside the coffin and took one last look around. His old dog had followed from the farm. The dog came over, sat beside him, and whined. When the master saw him, he called to his wife.
        - id: ch05-b14
          speaker: shepherd
          text: Bring the dog a piece of bread.
        - id: ch05-b15
          speaker: narrator
          text: His wife brought some bread and threw it down, but the dog would not even look at it. Then the farm cock came over and pecked at the bread.
        - id: ch05-b16
          speaker: old_dog
          text: You miserable glutton! How can you eat when you can see our master is dying?
          emotion: angry
        - id: ch05-b17
          speaker: farm_cock
          text: Let him die if he's that foolish. I have a hundred wives. When I find one grain of corn, I call them all over, then swallow it myself. If one of them dared get angry, I'd teach her a lesson with my beak. He has only one wife, and he can't keep her in order.
        - id: ch05-b18
          speaker: narrator
          text: As soon as the man understood the cock, he climbed out of the coffin. He seized a stick and called his wife into the room.
        - id: ch05-b19
          speaker: shepherd
          text: Come in, and I'll tell you what you've been so determined to know.
        - id: ch05-b20
          speaker: narrator
          text: Then he beat her with the stick. With every blow, he repeated the same words.
        - id: ch05-b21
          speaker: shepherd
          text: That's why, wife. That's why!
          emotion: angry
        - id: ch05-b22
          speaker: narrator
          text: And in that way, he taught her never again to ask why he had laughed.
