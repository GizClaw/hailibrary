  chapters:
    - id: ch01
      title: The Tailor Who Dreamed of Being a Prince
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a respectable young tailor named Labakan. He worked in Alexandria for a clever master. No one could call him stupid or lazy. When he felt like working, his needle flew so quickly that it might have been red-hot, with a burning thread behind it. At other times he sat lost in thought, wearing such a strange expression that the other workmen said Labakan had put on his aristocratic face again.
        - id: ch01-b02
          speaker: narrator
          text: Every Friday, Labakan dressed in the fine robe he had bought with his savings and went to the mosque. On his way home, a friend might wish him good day or ask how he was. Labakan would answer with a gracious wave of the hand or a grand, condescending nod. Sometimes his master looked at him and teased him.
        - id: ch01-b03
          speaker: master_tailor
          text: Really, Labakan, you look just like a prince.
        - id: ch01-b04
          speaker: labakan
          text: So you have noticed it too? I have thought the same thing for a long while.
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: This went on for some time. His master tolerated the nonsense because, on the whole, Labakan was a good fellow and a skillful worker.
        - id: ch01-b06
          speaker: narrator
          text: Then the sultan's brother passed through Alexandria. One of his state robes needed altering, so he sent for the master tailor. The master trusted the royal garment to Labakan, his finest workman.
        - id: ch01-b07
          speaker: narrator
          text: That evening, after everyone had gone home, Labakan felt himself drawn back to the workshop. The robe was hanging there. He gazed for a long time at its rich cloth and splendid embroidery. At last he could resist no longer. He slipped it on, and there it was. The robe fitted him as if it had been made for him.
        - id: ch01-b08
          speaker: labakan
          text: Why shouldn't I be a prince as well as anyone else? Hasn't my master often said I was born to look like one?
        - id: ch01-b09
          speaker: narrator
          text: Labakan paced proudly around the room. Soon he had convinced himself that he must be the son of some unknown monarch. He would leave at once and search for the rank that properly belonged to him.
        - id: ch01-b10
          speaker: narrator
          text: To him, the magnificent robe seemed like a gift from a kind fairy, and he meant to make use of it. He gathered all his savings and slipped through the gates of Alexandria under cover of darkness.
        - id: ch01-b11
          speaker: narrator
          text: Wherever the new prince went, people stared. His splendid clothes and majestic manner did not suit a traveler on foot. If anyone questioned him, he answered grandly that he had private reasons for not riding. Before long, even Labakan saw that walking made him look ridiculous. He bought a quiet old horse for a low price and called her Murva.

    - id: ch02
      title: Omar's Secret
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, as Labakan ambled along on Murva, another horseman caught up and asked to ride beside him. Pleasant conversation, he said, would make the journey pass more quickly for them both. The stranger was a handsome, cheerful young man. He plunged eagerly into conversation and asked one question after another.
        - id: ch02-b02
          speaker: omar
          text: My name is Omar. Elfi Bey was my uncle, and I am traveling now to carry out the command he gave me on his deathbed.
        - id: ch02-b03
          speaker: narrator
          text: Labakan shared much less. He merely hinted that he came from a noble family and traveled for pleasure. Even so, the two young men liked each other and continued together.
        - id: ch02-b04
          speaker: narrator
          text: On their second day, Labakan asked what Elfi Bey had commanded. Omar told him the whole strange story. Elfi Bey, the Pacha of Cairo, had raised Omar from earliest childhood. Omar had never known his parents. Only as Elfi Bey lay dying did he reveal the truth.
        - id: ch02-b05
          speaker: omar
          text: He told me I was not his nephew at all. I am the son of a great king. Astrologers warned my father that danger threatened me, so he sent me away and vowed not to see me until I turned twenty-two.
        - id: ch02-b06
          speaker: narrator
          text: Elfi Bey had kept the king's name secret. But he had ordered Omar to stand beside a great pillar, four days east of Alexandria, on the fourth day of the coming month. That was Omar's twenty-second birthday. Men would meet him there, and he must give them a dagger from Elfi Bey.
        - id: ch02-b07
          speaker: omar
          text: I must say, "Here I am, the one you seek." If they answer, "Praised be the Prophet who has preserved you," I am to follow them. They will take me to my father.
        - id: ch02-b08
          speaker: narrator
          text: The story amazed Labakan, but it also made him envious. Here was his friend about to receive the very place Labakan wanted for himself. He studied Omar and had to admit that the young man was handsome, well mannered, and pleasant to look upon. Still, Labakan felt certain that any royal father would be just as glad to claim him.
        - id: ch02-b09
          speaker: narrator
          text: Those thoughts followed him all day and filled his dreams all night. He kept comparing himself with the real prince and imagining the royal life that should have been his. He woke very early. Omar slept peacefully beside him, smiling in his sleep, and Labakan suddenly wanted to seize by force or cunning what unkind fate had denied him.
        - id: ch02-b10
          speaker: narrator
          text: The dagger that would serve as Omar's passport showed above his belt. Labakan eased it out. For one moment he wondered whether to drive it into the sleeping prince's heart. He drew back from murder. Instead, he put the dagger in his own belt, saddled Omar's swift horse, and rode away. By the time Omar woke and understood what he had lost, Labakan was many miles ahead.

    - id: ch03
      title: The Meeting at the Pillar
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: For two days Labakan rode steadily, afraid Omar might somehow reach the meeting place first. At last he saw the great pillar in the distance. It rose from a little hill in the middle of an open plain and could be seen from far away. His heart began to pound. He had planned his part, yet his conscience troubled him. Then he told himself once more that he must have been born to be a king, and he rode bravely on.
        - id: ch03-b02
          speaker: narrator
          text: The country around the pillar was bare and empty, with no place nearby to seek food or shelter. Labakan was glad he had brought provisions to last, since the appointed day was still two days away. By the middle of the following day, a long train of horses and camels came toward him. It stopped below the hill, where servants raised splendid tents. Everything about it looked like the escort of a great man. Labakan guessed they had all come on his account, but he held back his impatience. His wish could not be fulfilled until the fourth day.
        - id: ch03-b03
          speaker: narrator
          text: The first light of sunrise woke the happy tailor on the appointed morning. As he saddled his horse, he could not help thinking of the trick he had played and the true prince whose hopes he had destroyed. But it was too late to turn back. His vanity whispered that he looked as fine as any son a king could want. What was done was done.
        - id: ch03-b04
          speaker: narrator
          text: Labakan gathered his courage, sprang into the saddle, and reached the hill in less than a quarter of an hour. He tied the horse to a bush, drew Omar's dagger, and climbed. Six men stood at the pillar around a tall, stately figure. The man's robe was cloth of gold, a white cashmere shawl circled his waist, and jewels shone on his white turban. He was clearly rich and powerful.
        - id: ch03-b05
          speaker: narrator
          text: Labakan went straight to him, bowed low, and offered him the dagger.
        - id: ch03-b06
          speaker: labakan
          text: Here I am, the one you seek.
        - id: ch03-b07
          speaker: king_sached
          text: Praised be the Prophet who has preserved you! Come into my arms, my dear son Omar!
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: Tears of joy filled the old man's eyes. The solemn welcome deeply moved the proud tailor. Ashamed and delighted at once, Labakan sank into the king's embrace.
        - id: ch03-b09
          speaker: narrator
          text: His happiness did not remain clear for long. When he lifted his head, he saw a rider struggling to urge a tired and unwilling horse across the plain. Labakan soon recognized Murva, his own old horse. On her back was the real Prince Omar. Yet now that Labakan had told his lie, he resolved not to confess.
        - id: ch03-b10
          speaker: narrator
          text: Omar finally reached the hill, threw himself from the saddle, and rushed toward the pillar.
        - id: ch03-b11
          speaker: omar
          text: Stop! Whoever you are, don't let this shameful impostor deceive you. I am Omar, and no one will steal my name from me!
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: Everyone stared in astonishment. The old king was especially shaken and looked from one young face to the other. Labakan forced himself to appear calm.
        - id: ch03-b13
          speaker: labakan
          text: My gracious lord and father, please don't be misled. As far as I know, this poor man is a half-mad tailor's apprentice from Alexandria. His name is Labakan, and he deserves pity more than anger.
        - id: ch03-b14
          speaker: narrator
          text: Omar flew into such a rage that he tried to force his way toward Labakan. The attendants seized him and held him back.
        - id: ch03-b15
          speaker: king_sached
          text: Truly, my dear son, the poor fellow is out of his mind. Bind him and put him on a dromedary. Perhaps we can find help for him.
        - id: ch03-b16
          speaker: narrator
          text: Omar's first burst of anger passed. With tears in his eyes, he appealed to the king.
        - id: ch03-b17
          speaker: omar
          text: My heart tells me you are my father. In my mother's name, I beg you to hear me.
          emotion: sad
        - id: ch03-b18
          speaker: king_sached
          text: Heaven forbid! Now he is talking nonsense again. How could the poor man ever have imagined such a thing?
        - id: ch03-b19
          speaker: narrator
          text: The king took Labakan's arm and helped him down the hill. They mounted richly decorated horses and rode at the head of the procession. Omar was tied hand and foot on a dromedary, with a watchful guard on either side.

    - id: ch04
      title: Two Sons Before the Queen
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The old king was Sached, Sultan of the Wachabites. For years he had been childless, until the son he longed for was finally born. Soothsayers and magicians warned that an enemy might harm the boy before his twenty-second birthday. To protect him, Sached entrusted the prince to his faithful friend Elfi Bey. For twenty-two years, he gave up the happiness of seeing his own child. The sultan told Labakan all of this and grew more pleased with the young man's appearance and dignified manner.
        - id: ch04-b02
          speaker: narrator
          text: When the party entered Sached's country, joy met them everywhere. News of the prince's safe return had spread like wildfire before them. Every town and village was decorated for his arrival. People left their homes and crowded the roads, greeting the travelers with cries of joy and thankfulness. Each welcome filled Labakan's proud heart with delight. Behind him, the unfortunate Omar rode in silent anger and despair.
        - id: ch04-b03
          speaker: narrator
          text: At last they reached the capital, where the public celebration was grander and more brilliant than anywhere else. The queen waited in the palace's great hall with her entire court gathered around her. Evening was falling, but hundreds of colored hanging lamps had been lit, turning night into day. The brightest lamps surrounded her throne. It stood above four steps of pure gold set with enormous amethysts. The four greatest nobles in the kingdom held a canopy of crimson silk overhead, while the Sheik of Medina cooled her with a fan of peacock feathers.
        - id: ch04-b04
          speaker: narrator
          text: The queen waited in all that splendor for her husband and the son taken from her at birth. She had never seen Omar since that day. Yet so many dreams had shown her what he would look like that she believed she could recognize him among a thousand men. At last trumpets and drums sounded outside, joined by shouts and cheers. The long-awaited moment had come. The doors opened wide. Between rows of deeply bowing courtiers and servants, the king approached the throne with his false son by the hand.
        - id: ch04-b05
          speaker: king_sached
          text: Here is the son you have longed to see for so many years.
        - id: ch04-b06
          speaker: queen
          text: That is not my son! That is not the face the Prophet showed me in my dreams!
          emotion: surprised
        - id: ch04-b07
          speaker: narrator
          text: Before the king could argue, the door burst open. Omar had escaped his keepers. He rushed into the hall, fell before the throne, and struggled to speak through his panting breath.
        - id: ch04-b08
          speaker: omar
          text: Then let me die here. Kill me now, cruel father. I cannot bear this shame any longer.
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: People pressed around him, and the guards moved to seize him. The queen had been speechless with surprise. Now she sprang from her throne.
        - id: ch04-b10
          speaker: queen
          text: Stop! This is the one, and no other. My eyes have never seen him before, but my heart knows my son.
          emotion: surprised
        - id: ch04-b11
          speaker: narrator
          text: The guards stepped back, but the king angrily ordered them to take hold of the madman.
        - id: ch04-b12
          speaker: king_sached
          text: I must judge this. A woman's dreams cannot settle it. We need a sign that cannot be mistaken. This young man is my son because he brought me Elfi Bey's token, the dagger.
          emotion: angry
        - id: ch04-b13
          speaker: omar
          text: He stole it from me! He betrayed me after I trusted him!
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: The king would not listen. He had always trusted his own judgment. Omar was dragged from the hall, and Sached withdrew to his rooms with Labakan. He was furious with the queen, though their married life had been happy for many years.
        - id: ch04-b15
          speaker: narrator
          text: The queen was overcome with grief. She felt certain that an impostor had captured her husband's affection and stolen their true son's place.

    - id: ch05
      title: The Queen's Test
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When the first shock had passed, the queen began to search for a way to prove the king was wrong. It would not be easy. The man calling himself Omar had brought the dagger as his token. He could also speak about events from the prince's childhood. She gathered her oldest and wisest ladies around her and asked each of them for advice, but none could suggest a way through the puzzle. At last, one especially clever old lady spoke.
        - id: ch05-b02
          speaker: wise_lady
          text: Your Majesty, didn't the young man with the dagger call the other one Labakan? Didn't he say Labakan was a mad tailor?
        - id: ch05-b03
          speaker: queen
          text: Yes, he did. But how can that help us?
        - id: ch05-b04
          speaker: wise_lady
          text: Perhaps the impostor gave your real son his own name. If that is what happened, I know an excellent way to uncover the truth.
        - id: ch05-b05
          speaker: narrator
          text: She leaned close and whispered her plan. The queen was delighted by what she heard and went straight to the king. Because she was a wise woman, she did not challenge him again. Instead, she pretended she might have been mistaken. She asked only for permission to test the two young men, so everyone could learn which one was truly the prince.
        - id: ch05-b06
          speaker: narrator
          text: The king felt ashamed of the anger he had shown his dear wife, and he agreed at once. Then the queen explained her choice of test.
        - id: ch05-b07
          speaker: queen
          text: Other people might ask them to ride or shoot, but anyone can learn those things. I want a task that calls for quick wits and clever hands. Let each man make a kaftan and a pair of trousers, and we will see who does it best.
        - id: ch05-b08
          speaker: king_sached
          text: No, no, that will never do! Do you expect my son to compete with a mad tailor over who can sew the better clothes? No, my dear, we cannot do that.
        - id: ch05-b09
          speaker: narrator
          text: But the queen reminded him of his promise. The king was a man of his word, so at last he gave in. He went to the son he believed was his own and asked him to humor his mother by making a kaftan.
        - id: ch05-b10
          speaker: narrator
          text: Labakan laughed to himself. If this was all the queen wanted, he thought, she would soon be glad to claim him. Two rooms were prepared with cloth, scissors, needles, and thread, and each young man was shut inside one. The king was curious to see what sort of garment his son could produce. The queen waited anxiously to learn whether her plan would work.
        - id: ch05-b11
          speaker: narrator
          text: On the third day, both men were summoned with their work. Labakan came first and unfolded his kaftan before the astonished king.
        - id: ch05-b12
          speaker: labakan
          text: Look, Father. Look, my honored mother. Isn't this a masterpiece? I would wager that even the court tailor could not make a finer one.
          emotion: happy
        - id: ch05-b13
          speaker: narrator
          text: The queen smiled and turned toward Omar.
        - id: ch05-b14
          speaker: queen
          text: And what have you made, my son?
        - id: ch05-b15
          speaker: narrator
          text: Omar impatiently threw his cloth and scissors onto the floor.
        - id: ch05-b16
          speaker: omar
          text: I was taught to control a horse, draw a sword, and throw a lance sixty paces. I was never taught to sew. Elfi Bey, the ruler of Cairo, would have thought sewing beneath his pupil's notice.
        - id: ch05-b17
          speaker: queen
          text: Ah, you are truly your father's son! If only I may embrace you and call you mine. Forgive me, my lord, for using this test. Surely you can see now which man is the prince and which is the tailor. The kaftan is excellent, but I would very much like to know who taught that young man to make clothes.
          emotion: happy
        - id: ch05-b18
          speaker: narrator
          text: The king sat deep in thought for some time. He looked first at his wife and then at Labakan. The false prince was doing everything he could to hide how bitterly he regretted his own foolishness. By displaying his skill so proudly, he had given away the truth the queen hoped to uncover.
        - id: ch05-b19
          speaker: king_sached
          text: Even this test does not satisfy me. Fortunately, I know one certain way to discover whether I have been deceived.

    - id: ch06
      title: The Two Ivory Boxes
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The king ordered his swiftest horse saddled and rode alone to a nearby forest. A kind fairy named Adolzaide lived there. She had often given wise advice to the kings of Sached's family, and now he went to ask for her help.
        - id: ch06-b02
          speaker: narrator
          text: In the heart of the forest lay a broad clearing ringed with great cedar trees. People said this was Adolzaide's favorite place. The king dismounted, tied his horse to a tree, and stood in the center of the open ground.
        - id: ch06-b03
          speaker: king_sached
          text: If you truly helped my ancestors when they were in need, please do not turn away from their descendant. Human advice has failed me. I beg you to guide me.
        - id: ch06-b04
          speaker: narrator
          text: He had barely finished when one of the cedars opened. A veiled figure in white stepped out.
        - id: ch06-b05
          speaker: adolzaide
          text: I know why you have come, King Sached, and your purpose is honest. I will help you. Take these two small boxes. Let the two men who claim to be your son choose between them. The true prince will not choose wrongly.
        - id: ch06-b06
          speaker: narrator
          text: She handed him two ivory boxes set with gold and pearls. The king tried to lift their lids, but they would not open. Words made of diamonds glittered on each one. The first read, "Honour and Glory." The second read, "Wealth and Happiness." As Sached rode home, he thought either would be difficult to choose.
        - id: ch06-b07
          speaker: narrator
          text: He quickly summoned the queen and the whole court. When everyone had gathered, he gave a signal and Labakan entered. With a proud air, the tailor approached the throne and knelt.
        - id: ch06-b08
          speaker: labakan
          text: What do you command, my lord and father?
        - id: ch06-b09
          speaker: king_sached
          text: My son, people have raised doubts about your right to that name. One of these boxes holds proof of your birth. Choose one for yourself. Surely you will choose correctly.
        - id: ch06-b10
          speaker: narrator
          text: The king pointed to the ivory boxes on two small tables beside the throne. Labakan stood and examined them. After several minutes of thought, he made his choice.
        - id: ch06-b11
          speaker: labakan
          text: Honored father, what happiness could be greater than being your son? What wealth could be nobler than your love? I choose the box marked "Wealth and Happiness."
        - id: ch06-b12
          speaker: king_sached
          text: We will soon learn whether you chose rightly. For now, sit beside the Pacha of Medina.
        - id: ch06-b13
          speaker: narrator
          text: Omar was brought in next, looking sorrowful. He knelt before the throne and asked what the king wished of him. Sached showed him the boxes. Omar rose, walked to the tables, and carefully read both inscriptions.
        - id: ch06-b14
          speaker: omar
          text: These last few days have taught me that happiness is uncertain and wealth can disappear in a moment. Even if this choice costs me a crown, I choose "Honour and Glory."
        - id: ch06-b15
          speaker: narrator
          text: Omar placed his hand on the box. The king motioned for him to wait, then called Labakan to the other table and told him to touch his own choice. Sached rose from the throne. In solemn silence, the entire court rose with him.
        - id: ch06-b16
          speaker: king_sached
          text: Open the boxes, and may Allah show us the truth.
        - id: ch06-b17
          speaker: narrator
          text: This time the lids opened easily. On a velvet cushion inside Omar's box lay a tiny golden crown and sceptre. Inside Labakan's box lay a large needle and a length of thread.
        - id: ch06-b18
          speaker: narrator
          text: The king ordered both young men to bring him their boxes. When he lifted the little crown, it grew and grew until it was the size of a real crown. He placed it on Omar's head, kissed his forehead, and seated him at his right hand. Then he turned to Labakan.
        - id: ch06-b19
          speaker: king_sached
          text: There is an old saying that a cobbler should stick to his last. It seems you must stick to your needle. You deserve no mercy, but I will not be cruel on this happy day. I spare your life. Now leave my country as quickly as you can.
        - id: ch06-b20
          speaker: narrator
          text: Shame left the unfortunate tailor unable to answer. He threw himself before Omar, his eyes full of tears.
        - id: ch06-b21
          speaker: labakan
          text: Prince Omar, can you forgive me?
          emotion: sad
        - id: ch06-b22
          speaker: omar
          text: Go in peace.
        - id: ch06-b23
          speaker: narrator
          text: Omar raised him to his feet. The king clasped the true prince in his arms.
        - id: ch06-b24
          speaker: king_sached
          text: Oh, my true son!
          emotion: happy
        - id: ch06-b25
          speakers: [pacha, emir_1, emir_2]
          ensemble: chorus
          text: Long live Prince Omar!
          emotion: happy

    - id: ch07
      title: Wealth and Happiness
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: While the palace rang with cheers, Labakan slipped away with the little ivory box under his arm. At the stables, he saddled old Murva and rode through the gate toward Alexandria. Only the box with its diamond words remained to prove that the past few weeks had not been a dream.
        - id: ch07-b02
          speaker: narrator
          text: When he finally reached Alexandria, Labakan rode straight to his old master's door. He entered the familiar shop. At first, the master came forward politely to ask what the grandly dressed visitor wanted. Then he saw who stood before him. He shouted for all the workmen, and together they rushed at Labakan with blows and angry cries until he fell half-fainting onto a heap of old clothes.
        - id: ch07-b03
          speaker: narrator
          text: The master scolded him fiercely for stealing the royal robe. Labakan said he had returned to pay for it and offered three times its value, but no one listened. They beat him again and finally pushed him into the street, more dead than alive.
        - id: ch07-b04
          speaker: narrator
          text: Labakan climbed back onto his horse and made his way to an inn. There he found a quiet place to rest his battered body and consider all his misfortunes. Before falling asleep, he firmly decided that he would stop trying to be great. From now on, he would live as an honest workman.
        - id: ch07-b05
          speaker: narrator
          text: The next morning he began to keep that promise. He sold the ivory box to a jeweler for a good sum, bought a house, and opened a workshop. Above the door he hung a sign that read, "Labakan, Tailor." Then he sat down to mend his own torn clothes with the needle that had come from the box.
        - id: ch07-b06
          speaker: narrator
          text: After a little while, someone called him away. When he returned, a wonder met his eyes. The needle was sewing by itself. It made the neatest little stitches Labakan had ever seen, finer than anything he could produce even on his best day.
        - id: ch07-b07
          speaker: narrator
          text: Even the smallest gift from a kind fairy can be precious. This gift had one more advantage. No matter how much the needle sewed, its thread never ran out.
        - id: ch07-b08
          speaker: narrator
          text: Customers soon crowded into Labakan's shop. He cut out each garment, made the first stitch with the magic needle, and left it to finish all the remaining stitches by itself. Before long, the whole town came to him because his work was excellent and inexpensive. People could not understand how one man working alone completed so much, or why he always kept his workshop doors closed.
        - id: ch07-b09
          speaker: narrator
          text: So the promise written on the ivory box, "Wealth and Happiness," came true. In time, Labakan heard stories of Prince Omar's brave deeds. Omar was the pride and darling of his people and the terror of his enemies. Whenever the former prince heard such news, he thought about the choice he had made.
        - id: ch07-b10
          speaker: labakan
          text: After all, I am better off as a tailor. Honour and Glory can be very dangerous things.
