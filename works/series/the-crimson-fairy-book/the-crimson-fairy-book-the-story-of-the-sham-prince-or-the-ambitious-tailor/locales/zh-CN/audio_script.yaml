audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    labakan:
      display_name: 拉巴坎
      tts:
        delivery: 虚荣而爱做派，得意时夸张，受挫时慌乱
        timbre: 年轻圆润
        pace: 中速偏快
        pitch: 中音
    master_tailor:
      display_name: 裁缝师傅
      tts:
        delivery: 务实爽直，调侃中带着严厉
        timbre: 成熟厚实
        pace: 中速
        pitch: 中低音
    omar:
      display_name: 奥马尔
      tts:
        delivery: 坦荡真诚，受辱时激烈，宽恕时沉稳
        timbre: 清朗年轻
        pace: 中速
        pitch: 中音
    king_sached:
      display_name: 萨赫德国王
      tts:
        delivery: 庄严果断，习惯发号施令
        timbre: 深沉洪亮
        pace: 稍慢
        pitch: 低音
    queen:
      display_name: 王后
      tts:
        delivery: 睿智坚定，带着深切的母爱
        timbre: 丰润沉着
        pace: 中速
        pitch: 中音
    wise_lady:
      display_name: 智慧老妇人
      tts:
        delivery: 思虑周密，说话谨慎而机敏
        timbre: 苍老柔和
        pace: 舒缓
        pitch: 中低音
    adolzaide:
      display_name: 阿多尔扎伊德
      tts:
        delivery: 宁静神秘，语气笃定
        timbre: 轻柔明亮
        pace: 舒缓
        pitch: 中高音
    pacha:
      display_name: 总督
      tts:
        delivery: 庄重喜悦，声音充满庆典气氛
        timbre: 成熟饱满
        pace: 中速
        pitch: 中低音
    emir_1:
      display_name: 埃米尔甲
      tts:
        delivery: 热烈庄重，欢呼干脆有力
        timbre: 明亮成熟
        pace: 中速
        pitch: 中音
    emir_2:
      display_name: 埃米尔乙
      tts:
        delivery: 热烈庄重，欢呼昂扬清晰
        timbre: 清亮年轻
        pace: 中速
        pitch: 中高音
  chapters:
    - id: ch01
      title: 裁缝的王子梦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，亚历山大城里有个年轻裁缝，名叫拉巴坎。他在一位手艺高明的师傅手下做工。拉巴坎并不笨，也不懒。只要愿意，他的针便飞得像烧红了一样，后面仿佛还拖着一缕火线。可有些时候，他会坐着发呆，脸上的神情古怪极了。同伴们一见就说，拉巴坎今天又戴上了贵族的面孔。
        - id: ch01-b02
          speaker: narrator
          text: 每到星期五，拉巴坎总穿上用积蓄买来的漂亮长袍，去清真寺做礼拜。回来路上，朋友向他说声日安，或问拉巴坎朋友近来可好。他不是优雅地挥挥手，就是高高在上地点点头。有时，师傅也会拿他开玩笑。
        - id: ch01-b03
          speaker: master_tailor
          text: 说真的，拉巴坎，你看着还真像位王子。
        - id: ch01-b04
          speaker: labakan
          text: 原来您也看出来了？我早就觉得自己像了。
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: 日子就这样过了很久。师傅知道拉巴坎总体来说是个好小伙子，手艺又十分出色，便一直容忍他的种种荒唐举动。一天，苏丹的弟弟恰好路过亚历山大，有一件正式场合穿的礼服需要修改。他召来裁缝师傅，师傅又把这件王家长袍交给手下最好的工匠拉巴坎。
        - id: ch01-b06
          speaker: narrator
          text: 那天傍晚，所有人都离开作坊回了家，拉巴坎却抵挡不住心里的渴望，又回到挂着王家礼服的地方。那件礼服正静静挂在那里。他站在衣服前看了很久，越看越喜欢华贵的衣料和灿烂的刺绣。最后，他实在忍不住了，非穿上试一试不可。真奇怪，衣服竟像专门给他做的一样合身。
        - id: ch01-b07
          speaker: labakan
          text: 我为什么不能做王子？难道我比哪一位王子差吗？连师傅都常说，我天生就是做王子的样子。
        - id: ch01-b08
          speaker: narrator
          text: 他穿着王家长袍，得意地在屋里走来走去，竟认定自己必是某位不知名的君王之子。他要立刻出发，找回真正属于自己的身份。至于这件长袍，他觉得一定是善良仙女特意送来的珍贵礼物，当然不能辜负。他收好全部积蓄，借着深沉夜色的掩护，悄悄穿过亚历山大的城门。
        - id: ch01-b09
          speaker: narrator
          text: 这位新王子走到哪里都引来不少目光。他穿得华丽，举止庄严，却用两条腿赶路，怎么看也不相称。别人问起，他便摆出一副高深莫测的重要神气，说自己不骑马自然有特别的理由。可不久，连他自己也觉得步行有损体面，只好便宜买下一匹温顺安稳的老马，取名穆尔瓦。

    - id: ch02
      title: 奥马尔的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，拉巴坎骑着穆尔瓦缓缓赶路，一名骑手从后面追上来，问能不能结伴同行。两个人一路说说话，旅途也会过得快些。来人年轻英俊，性情开朗，很快就热络地聊起来，还问了许多问题。
        - id: ch02-b02
          speaker: omar
          text: 我叫奥马尔，是埃尔菲贝伊的侄子。叔父临终前交代我一项使命，我这次出门，就是要把它完成。
        - id: ch02-b03
          speaker: narrator
          text: 拉巴坎却不肯说出自己的底细，只暗示他也出身高贵，这趟不过是出来游玩。两个年轻人仍旧很投缘，便一起赶路。第二天，拉巴坎问起那项使命，奥马尔告诉了他一个惊人的秘密。
        - id: ch02-b04
          speaker: omar
          text: 埃尔菲贝伊是开罗总督，我从小由他抚养，从没见过自己的父母。他临终时才告诉我，我根本不是他的侄子，而是一位伟大国王的儿子。占星家预言我会遇到危险，父亲只好把我送走，还发誓等我满二十二岁才同我见面。
        - id: ch02-b05
          speaker: narrator
          text: 埃尔菲贝伊没有说出国王的名字。他只命奥马尔在下个月第四天，也就是二十二岁生日那天，赶到亚历山大以东四日路程的一根巨柱旁。那里会有人来接他。他要交出叔父留下的匕首，说出约定的话。
        - id: ch02-b06
          speaker: omar
          text: 我要告诉他们：“我就是你们要找的人。”如果他们回答：“赞美先知，是他保全了你！”我就跟他们走。他们会带我去见父亲。
        - id: ch02-b07
          speaker: narrator
          text: 这个故事让拉巴坎又惊又羡。他梦寐以求的地位，竟然属于身边的朋友，这实在叫他恼恨。他仔细打量奥马尔，又把王子和自己从头到脚比了一遍。最后，他不得不承认，奥马尔的确相貌英俊、举止得体，神情也讨人喜欢。可他依然相信，要是两人交换位置，任何国王都会同样乐意认自己做儿子。
        - id: ch02-b08
          speaker: narrator
          text: 这些念头白天缠着他，夜里又钻进梦中。清晨，他看见奥马尔安静地睡着，脸上带着幸福的微笑，忽然决定用强力或计谋，抢走命运不肯给他的东西。那把作为信物的匕首，就插在奥马尔腰间。
        - id: ch02-b09
          speaker: narrator
          text: 拉巴坎轻轻抽出匕首，一瞬间甚至想把它刺进熟睡王子的心口。可他终究下不了手。他把匕首插进自己的腰带，骑上奥马尔的快马逃走了。等王子醒来，发现匕首和马都不见时，他早已跑出许多英里。
        - id: ch02-b10
          speaker: narrator
          text: 拉巴坎一连赶了两天，生怕奥马尔终究抢先到达。第二天傍晚，他远远望见平原上的小山，巨柱就立在山顶，隔着很远也能看清。那景象叫他心跳加快。虽然一路上早已想过自己要演什么角色，良心还是让他不安。可他又拿“天生该做国王”安慰自己，壮着胆子继续前进。
        - id: ch02-b11
          speaker: narrator
          text: 四周是一片光秃秃的荒野，距离约定的日子还差两天。幸好他带了足够的食物。次日中午，他看见一长队马匹和骆驼来到山脚，搭起华美的帐篷。那分明是某位大人物的随从。拉巴坎猜他们都是为自己而来，却强忍着急切，等待第四天到来。
        - id: ch02-b12
          speaker: narrator
          text: 第四天清早，第一道阳光唤醒了这个快活的裁缝。给马备鞍时，他想起自己的骗局，也想起真王子破灭的希望，心里生出几分悔意。但木已成舟，虚荣心又说，他这副相貌，最骄傲的国王也会乐意认作儿子，而且发生的事已经无法改变。于是，他鼓起全部勇气，翻身上马，不到一刻钟便来到山脚。他下马，把坐骑拴在灌木上，拿着奥马尔的匕首走上小山。

    - id: ch03
      title: 巨柱旁的冒名顶替
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 巨柱下面，六个人围着一位高大威严的老人。老人身穿华美的金锦长袍，腰间束着白色开司米披巾，头上戴着镶满珠宝的白色缠巾。一看这身装束，就知道他既富有又尊贵。拉巴坎径直走到他面前，深深弯腰行礼，双手递出匕首。
        - id: ch03-b02
          speaker: labakan
          text: 我就是你们一直在找的人。
        - id: ch03-b03
          speaker: king_sached
          text: 赞美先知，是他保全了你！快来让我抱抱你，我的儿子奥马尔！
          emotion: happy
        - id: ch03-b04
          speaker: narrator
          text: 这庄严的欢迎让拉巴坎深受触动。他又羞又喜，倒进老国王怀里。可是，这份幸福转眼便蒙上了阴影。他抬头看见一个骑手正穿过平原，拼命催促一匹疲惫又不情愿前行的马。他很快认出自己的老马穆尔瓦，也认出马背上的真王子。可谎言既已说出口，他决意不再承认。
        - id: ch03-b05
          speaker: narrator
          text: 奥马尔终于赶到山脚，跳下马，飞奔到巨柱旁。
        - id: ch03-b06
          speaker: omar
          text: 住手！不管您是谁，千万别受这个卑鄙骗子蒙骗。我才是奥马尔，谁也别想把我的名字抢走！
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: 周围的人全惊呆了。老国王看看这个，又看看那个，激动得说不出话。拉巴坎却硬逼着自己镇定下来。
        - id: ch03-b08
          speaker: labakan
          text: 最仁慈的父王，请不要听信他的话。据我所知，他只是亚历山大一个半疯的裁缝学徒，名叫拉巴坎。与其生他的气，倒不如可怜他。
        - id: ch03-b09
          speaker: narrator
          text: 奥马尔气得口吐白沫，想扑向拉巴坎，侍从们却一拥而上，把他死死按住。
        - id: ch03-b10
          speaker: king_sached
          text: 我的儿子，这个可怜人的确疯得厉害。把他捆起来，放到独峰驼上。说不定我们还能替他找到医治的办法。
        - id: ch03-b11
          speaker: narrator
          text: 王子的怒火渐渐平息，眼泪却流了下来。
        - id: ch03-b12
          speaker: omar
          text: 我的心认定您就是父亲。我以母亲的名义求您，至少听我把话说完！
          emotion: sad
        - id: ch03-b13
          speaker: king_sached
          text: 上天保佑，他怎么又说起疯话了？这个可怜人脑子里怎么会有这样的妄想？
        - id: ch03-b14
          speaker: narrator
          text: 国王挽着拉巴坎走下山，两人骑上装饰华丽的骏马，带领队伍穿过平原。不幸的奥马尔手脚都被捆住，又绑在独峰驼背上，两名卫兵在左右严密看守。
        - id: ch03-b15
          speaker: narrator
          text: 这位老人名叫萨赫德，是瓦哈比人的苏丹。他多年没有孩子，好不容易才盼来一个儿子。可他请来预言家和魔法师询问孩子的未来，得到的回答全都一样。王子在二十二岁以前，会有遭到敌人伤害的危险。为了万无一失，苏丹把他托付给最可靠的朋友埃尔菲贝伊，自己忍受了二十二年不能相见的痛苦。一路上，他把往事都告诉拉巴坎，还对假儿子的相貌和庄严举止满意极了。
        - id: ch03-b16
          speaker: narrator
          text: 队伍回到国土，所到之处都在欢庆。王子平安归来的消息像野火般传开，每座城镇和村庄都披上盛装。百姓蜂拥而来，用喜悦和感恩的呼喊迎接他们。拉巴坎那颗骄傲的心陶醉在荣耀中，真正的奥马尔却被押在后面，沉默地承受愤怒与绝望。
        - id: ch03-b17
          speaker: narrator
          text: 队伍终于到了京城，那里的庆典比别处都更加盛大辉煌。王后带着满朝臣子，在宫殿大厅等待丈夫和儿子。暮色已经降临，数百盏彩灯高高挂起，把黑夜照得如同白昼。最明亮的灯全围绕着王后的宝座。宝座立在四级纯金台阶上，台阶里镶着大块紫水晶。王国中四位最高贵的大臣在王后头顶撑起深红丝绸华盖，麦地那的谢赫则用孔雀羽扇为她扇风。
        - id: ch03-b18
          speaker: narrator
          text: 王后自奥马尔出生以后，也从未见过他。但她在一个又一个梦里看清了儿子的模样，深信哪怕一千个人站在一起，自己也能把他认出来。外面终于传来号角和鼓声，欢呼一阵高过一阵，盼望已久的时刻到了。大门猛然打开，宫臣与仆人俯首分列两旁。国王牵着假王子的手，从人群中间一步步走向宝座。
        - id: ch03-b19
          speaker: king_sached
          text: 看吧，这就是你盼了二十二年的儿子。
        - id: ch03-b20
          speaker: queen
          text: 他不是我的儿子！先知让我在梦中看见的，根本不是这张脸！
          emotion: surprised
        - id: ch03-b21
          speaker: narrator
          text: 国王正要争辩，大门突然被撞开。奥马尔挣脱了看守，冲进大厅，扑倒在宝座前。
        - id: ch03-b22
          speaker: omar
          text: 那就让我死在这里吧！残忍的父亲，快杀了我。我再也受不了这份耻辱了！
          emotion: sad
        - id: ch03-b23
          speaker: narrator
          text: 人群围了上来，卫兵也准备抓他。王后先是惊得一动不动，接着猛然从宝座上站起。
        - id: ch03-b24
          speaker: queen
          text: 都住手！他才是我的儿子。我的双眼从未见过他，可我的心认得他！
        - id: ch03-b25
          speaker: narrator
          text: 卫兵向后退去，国王却怒声命令他们抓住这个疯子。
        - id: ch03-b26
          speaker: king_sached
          text: 这件事必须由我判断，不能凭女人的梦下结论，要看绝不会错的信物。拉巴坎才是我儿子，因为是他带来了埃尔菲留给我的匕首。
          emotion: angry
        - id: ch03-b27
          speaker: omar
          text: 匕首是他偷的！我毫无防备地信任他，他却背叛了我！
          emotion: angry
        - id: ch03-b28
          speaker: narrator
          text: 萨赫德惯于相信自己的判断，根本不肯听亲生儿子的话。他任由卫兵把奥马尔拖出大厅，自己带着拉巴坎回房去了。尽管国王和王后多年来一直恩爱和睦，他此刻仍对妻子十分愤怒。王后则陷入悲痛。她确信，一个冒牌货骗得了丈夫的信任，夺走了真儿子的位置。

    - id: ch04
      title: 王后的考验
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 最初的震惊过去后，王后开始思索怎样证明国王错了。这并不容易。假奥马尔手里有匕首作信物，还从真正的王子那里听来不少儿时的事情，讲得头头是道。她召来年纪最长、最有智慧的女官们询问，谁也拿不出主意。终于，一位聪明的老妇人想到了什么。
        - id: ch04-b02
          speaker: wise_lady
          text: 陛下，带来匕首的年轻人，不是把另一个人叫作拉巴坎，还说他是个疯裁缝吗？
        - id: ch04-b03
          speaker: queen
          text: 没错。可这又能说明什么？
        - id: ch04-b04
          speaker: wise_lady
          text: 也许冒牌货把自己的名字扣在了真王子头上。要真是这样，我知道一个很好的办法，能把真相查出来。
        - id: ch04-b05
          speaker: narrator
          text: 老妇人在王后耳边悄悄说了几句。王后听完十分满意，马上去见国王。她很有智慧，没有再同丈夫争辩，只假装承认自己也许看错了。她请求国王允许自己给两个年轻人出一道考题，用结果证明谁才是真正的王子。国王想起自己不久前还对相伴多年的爱妻大发雷霆，心里正觉得惭愧，于是立刻答应下来。
        - id: ch04-b06
          speaker: queen
          text: 别人或许会叫他们赛马、射箭，或比试类似的本领，可这些东西谁都能学。我出的题目，既要头脑机敏，也要双手灵巧。让他们各做一件卡夫坦长袍和一条裤子，看谁做得最好。
        - id: ch04-b07
          speaker: king_sached
          text: 不行，这个办法可不成！难道让我的儿子跟疯裁缝比赛做衣服？不，不，绝对不行。
        - id: ch04-b08
          speaker: narrator
          text: 王后却坚持要他遵守承诺。国王向来言出必行，最后只好让步。他亲自去见自己认定的儿子，请他迁就母亲一回，做一件她一心想要的卡夫坦。拉巴坎听完，在心里偷偷发笑。他觉得这项任务再容易不过，只要拿出自己的本领，王后很快便会心服口服地认下他。
        - id: ch04-b09
          speaker: narrator
          text: 人们准备了两个房间，每一间都放进布料、剪刀、针和线，再把两个年轻人分别关进去。国王很好奇，想看看儿子究竟会做出什么样的衣服。王后也十分焦急，等待这场考验的结果。到了第三天，两个人都被召来，还得带上各自的作品。拉巴坎先走进大厅，在国王眼前展开自己的卡夫坦，国王顿时惊讶不已。
        - id: ch04-b10
          speaker: labakan
          text: 父王请看，尊敬的母后也请看。这不是一件杰作吗？我敢打赌，就连宫廷裁缝也做不出更好的衣服。
          emotion: happy
        - id: ch04-b11
          speaker: queen
          text: 那么你呢，我的儿子？你做了什么？
        - id: ch04-b12
          speaker: narrator
          text: 奥马尔不耐烦地把布料和剪刀扔到地上。
        - id: ch04-b13
          speaker: omar
          text: 我学过驾驭马匹，也学过拔剑和把长矛投到六十步以外。我从没学过缝衣服。若让开罗统治者埃尔菲贝伊的学生学这种手艺，人们会觉得有失身份。
        - id: ch04-b14
          speaker: queen
          text: 啊，这才真是你父亲的儿子！我多想抱住你，叫你一声儿子。我的丈夫，请原谅我用这种办法寻找真相。现在您还看不出谁是王子、谁是裁缝吗？这件卡夫坦的确漂亮，可我很想知道，究竟是哪位师傅教会那个年轻人做衣服的。
          emotion: happy
        - id: ch04-b15
          speaker: narrator
          text: 国王沉思起来，一会儿看看妻子，一会儿看看拉巴坎。拉巴坎也明白自己露出了破绽，拼命藏住懊恼。
        - id: ch04-b16
          speaker: king_sached
          text: 这次考验仍然不能让我信服。不过，我还知道一个绝不会错的办法，可以查明自己到底有没有受骗。
        - id: ch04-b17
          speaker: narrator
          text: 国王命人给最快的马备上鞍，独自骑向不远处的森林。那里住着善良的仙女阿多尔扎伊德。过去每逢他的先祖遇到困难，她常会送上明智的忠告。森林中央有一大片空地，四周环绕着高大的雪松，据说那是仙女最喜爱的地方。
        - id: ch04-b18
          speaker: narrator
          text: 国王到了空地，下马把坐骑拴在树上，站到正中央，向仙女求助。他说，如果她真的帮助过自己的先祖，也请不要轻视先祖的后人。凡人的主意已经全都失效，他需要她的指点。话音刚落，一棵雪松便裂开了，一位白衣蒙面的身影从树中走出。
        - id: ch04-b19
          speaker: adolzaide
          text: 萨赫德国王，我知道你为何而来。你的心意正直，我愿意帮你。拿着这两只小盒，让两个自称是你儿子的人各选一只。我知道，真正的王子不会选错。
        - id: ch04-b20
          speaker: narrator
          text: 仙女交给他两只象牙小盒，盒上镶着黄金和珍珠。国王试了又试，却怎么也打不开盒盖。每个盖子上都用钻石嵌着一行字。一只写着“荣誉与光荣”，另一只写着“财富与幸福”。国王骑马回宫时一路都在想，这可真是个艰难的选择。

    - id: ch05
      title: 两只象牙盒
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 回宫以后，国王立即召来王后和满朝臣子。众人到齐，他打个手势，拉巴坎便被带进大厅。这个假王子傲然走向宝座，跪了下来。
        - id: ch05-b02
          speaker: labakan
          text: 父王召我来，有什么吩咐？
        - id: ch05-b03
          speaker: king_sached
          text: 我的儿子，有人怀疑你是否配得上这个称呼。两只盒子里，有一只装着你出身的证明。你自己选吧，你一定不会选错。
        - id: ch05-b04
          speaker: narrator
          text: 两只象牙盒分别摆在宝座旁的小桌上。拉巴坎站起来，来回看了几分钟，终于作出选择。
        - id: ch05-b05
          speaker: labakan
          text: 尊敬的父王，能做您的儿子，就是最大的幸福。您的爱，就是最高贵的财富。所以，我选择写着“财富与幸福”的盒子。
        - id: ch05-b06
          speaker: king_sached
          text: 选得对不对，我们很快就知道。现在先坐到麦地那总督身旁去。
        - id: ch05-b07
          speaker: narrator
          text: 接着，奥马尔也被带进大厅。他满面忧伤，跪在宝座前询问国王有何旨意。国王让他看那两只盒子。奥马尔起身走到桌旁，仔细读过两行铭文。
        - id: ch05-b08
          speaker: omar
          text: 这几天让我看清，幸福并不可靠，财富也转眼就会消失。哪怕这个选择会让我失去王冠，我也要选“荣誉与光荣”。
        - id: ch05-b09
          speaker: narrator
          text: 奥马尔把手放到盒上。国王示意他先等一等，又让拉巴坎站到另一张桌旁，按住自己选的盒子。随后，国王从宝座上站起，满堂众人也在肃静中一同起身。
        - id: ch05-b10
          speaker: king_sached
          text: 打开盒子吧。愿安拉把真相指给我们看。
        - id: ch05-b11
          speaker: narrator
          text: 这一次，盒盖轻轻一掀便打开了。奥马尔的盒中，天鹅绒软垫上放着一顶小金冠和一根小权杖。拉巴坎的盒中却只有一根大针，针上还穿着线。
        - id: ch05-b12
          speaker: narrator
          text: 国王叫两人把盒子拿来。他从奥马尔的盒中取出金冠。那顶冠在他手里越变越大，直到成为一顶真正的王冠。他把王冠戴到奥马尔头上，亲吻儿子的额头，又让他坐在自己右手边。接着，国王转向拉巴坎。
        - id: ch05-b13
          speaker: king_sached
          text: 老话说，鞋匠只该守着自己的楦头。看来，你也该守着自己的针。你原本不配得到宽恕，可今天我不愿严酷待人。我饶你性命，不过你最好尽快离开我的国家。
        - id: ch05-b14
          speaker: narrator
          text: 拉巴坎羞愧得说不出话。他扑倒在奥马尔面前，眼里满是泪水。
        - id: ch05-b15
          speaker: labakan
          text: 王子，您还能原谅我吗？
          emotion: sad
        - id: ch05-b16
          speaker: omar
          text: 安心走吧。
        - id: ch05-b17
          speaker: narrator
          text: 奥马尔伸手扶起了他。国王随即把真正的儿子紧紧抱在怀中。
        - id: ch05-b18
          speaker: king_sached
          text: 啊，我真正的儿子！
          emotion: happy
        - id: ch05-b19
          speakers: [pacha, emir_1, emir_2]
          ensemble: chorus
          text: 奥马尔王子万岁！
          emotion: happy

    - id: ch06
      title: 魔针带来的幸福
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 大厅里一片喧闹和欢腾。拉巴坎趁谁也没有留意，把小盒夹在腋下，悄悄溜了出去。他来到马厩，给老马穆尔瓦备上鞍，骑出城门，向亚历山大赶去。一路上，只有那只带着钻石铭文的象牙盒提醒他，过去几星期的经历并不是一场梦。
        - id: ch06-b02
          speaker: narrator
          text: 拉巴坎回到亚历山大，径直骑到旧日师傅门前。他走进作坊，师傅迎上来，还以为是客人，客气地问他有什么事。可一认出来人，师傅立刻叫来所有工匠。众人围住拉巴坎，又打又骂，直到他支撑不住，半昏半醒地倒在一堆旧衣服上。
        - id: ch06-b03
          speaker: narrator
          text: 接着，师傅又为那件被偷走的王家长袍狠狠训斥他。拉巴坎一再解释，自己这次回来正是为了赔偿，还愿意付出长袍三倍的价钱，可谁也不肯听。众人再次围上来痛打他，最后把他推出门外。可怜的裁缝浑身是伤，几乎只剩下半条命。
        - id: ch06-b04
          speaker: narrator
          text: 拉巴坎无计可施，只能重新上马，骑到一家客店。他在那里找到一处安静的地方，让浑身青肿疼痛的手脚好好休息，也从头到尾想遍了自己遭遇的种种不幸。睡着以前，他终于下定决心，再也不妄想成为大人物，只做一个诚实本分的工匠。
        - id: ch06-b05
          speaker: narrator
          text: 第二天一早，拉巴坎便照着这个决心行动。他把象牙盒卖给珠宝商，得了一笔好价钱。随后买下房子，开了一间作坊，又在门上挂起“裁缝拉巴坎”的招牌。他坐下来，拿出盒中的大针，开始缝补自己破烂的衣服。
        - id: ch06-b06
          speaker: narrator
          text: 过了一会儿，有人把他叫走。等他回来，眼前竟出现了奇迹。那根针正在自己缝衣服，落下的针脚又细密又整齐，连拉巴坎手艺最好时也缝不出来。善良仙女的礼物再小也很珍贵，而这份礼物还有一个好处。无论针缝多久，那根线永远不会用完。
        - id: ch06-b07
          speaker: narrator
          text: 拉巴坎很快就有了许多顾客。他只要按照尺寸裁好衣料，再拿魔针缝下第一针，剩下的活便全由它完成。没过多久，全城的人都来找他。拉巴坎的衣服做得又好，价钱又便宜。人们只是不明白，他独自一人怎么做得了这么多活，也猜不透他为什么总要关着门工作。
        - id: ch06-b08
          speaker: narrator
          text: 就这样，象牙盒上“财富与幸福”的诺言在拉巴坎身上实现了。后来，他听说奥马尔王子立下许多英勇功绩。王子成了百姓的骄傲和宠儿，也成了敌人的噩梦。这位昔日的假王子听完，心里只有一个念头。
        - id: ch06-b09
          speaker: labakan
          text: 到头来，我还是做裁缝更好。“荣誉与光荣”这种东西，常常危险得很。
