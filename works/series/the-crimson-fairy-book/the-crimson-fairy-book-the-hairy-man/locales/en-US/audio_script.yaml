  chapters:
    - id: ch01
      title: The Watch in the Field
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Somewhere or other, though I cannot tell you where, there lived a king with two remarkably fine fields of rape. Every night, two heaps in one field were burned to the ground. The king sent soldiers to catch whoever was setting the fires, but they never saw a soul.
        - id: ch01-b02
          speaker: narrator
          text: At last the king offered nine hundred crowns to anyone who caught the culprit. He also ordered that anyone who failed to guard the fields properly would be killed. Crowds of people tried, but not one of them could protect the heaps.
        - id: ch01-b03
          speaker: narrator
          text: By the time the king had put ninety-nine watchers to death, a little swineherd came to him. The boy had two dogs. One was called Psst, and the other was called Hush.
        - id: ch01-b04
          speaker: swineherd
          text: Your Majesty, I will watch the heaps tonight.
        - id: ch01-b05
          speaker: narrator
          text: When darkness fell, the swineherd climbed onto the fourth heap, where he could see across the whole field. At about eleven, he made out someone approaching another heap and setting it alight.
        - id: ch01-b06
          speaker: swineherd
          text: Just wait! Psst! Hush! Catch him!
        - id: ch01-b07
          speaker: narrator
          text: The dogs had already raced away before he finished calling. Within five minutes, they had caught the man.
        - id: ch01-b08
          speaker: narrator
          text: The next morning, the prisoner was taken before the king with his hands bound. The delighted king gave the swineherd a thousand crowns on the spot. The captive was covered all over in hair and looked almost like an animal. He was such a wonder that the king locked him in a strong room. Then he invited all the neighboring kings and princes to come and see him.

    - id: ch02
      title: The Open Door
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Now, the king had a ten-year-old son. The little prince went to look at the hairy man too, and the prisoner begged and begged to be freed. The boy felt sorry for him. He stole the key to the strong room from his mother and opened the door. After he returned the key, the hairy man escaped and went away into the world.
        - id: ch02-b02
          speaker: narrator
          text: One after another, the invited kings and princes arrived, eager to see the wonder. But the hairy man was gone. The king nearly burst with rage and shame. He questioned the queen fiercely and threatened her.
        - id: ch02-b03
          speaker: first_king
          text: Find that hairy man and bring him back. If you cannot, I will shut you in a hut of rushes and burn it around you!
          emotion: angry
        - id: ch02-b04
          speaker: queen_mother
          text: I had nothing to do with his escape. If our son took the key, he did it without my knowing.
        - id: ch02-b05
          speaker: narrator
          text: The little prince was brought in and questioned in every possible way. At last, he admitted that he had opened the door. The king ordered his servants to take the boy into the forest, kill him, and return with part of his liver and lungs.
        - id: ch02-b06
          speaker: narrator
          text: Grief spread through the palace, for everyone loved the prince. Still, the servants had to lead him into the forest. Once they were there, one of the men took pity on him. He killed a dog instead and carried pieces of its liver and lungs back to the king. The king was satisfied and asked no more questions.
        - id: ch02-b07
          speaker: narrator
          text: The prince wandered through the forest for five years, living as best he could. Then one day he found a poor little cottage, with an old man inside. They talked, and the prince told him the sad story of all that had happened.
        - id: ch02-b08
          speaker: narrator
          text: As they spoke, they recognized each other. The old man was the very hairy man whom the prince had freed. Ever since his escape, he too had lived in the forest.

    - id: ch03
      title: The Three Apples
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The prince stayed in the cottage for two years. Then he decided that he wanted to travel farther. The hairy man pleaded with him to remain, but the young man would not change his mind.
        - id: ch03-b02
          speaker: narrator
          text: So his hairy friend gave him a golden apple. A horse with a golden mane could spring from it, and a golden staff would guide the horse. Next came a silver apple, which could bring forth the most beautiful hussars, along with a silver staff. Last came a copper apple and staff, from which the prince could draw as many foot soldiers as he wished.
        - id: ch03-b03
          speaker: hairy_man
          text: Swear to me that you will guard these gifts with the greatest care.
        - id: ch03-b04
          speaker: narrator
          text: The prince gave his solemn promise, and the hairy man let him go.
        - id: ch03-b05
          speaker: narrator
          text: On and on the prince wandered until he reached a large town. He became a servant in the king's palace. No one paid much attention to him, so he lived there quietly.
        - id: ch03-b06
          speaker: narrator
          text: One day, word came that the king must march to war. His army was very small, and the news frightened him terribly. Even so, he had no choice but to go.
        - id: ch03-b07
          speaker: narrator
          text: Once the king and his army had left, the prince spoke to the housekeeper.
        - id: ch03-b08
          speaker: prince
          text: May I go to the next village? I owe a small bill there, and I want to settle it.
        - id: ch03-b09
          speaker: narrator
          text: There was nothing for him to do in the empty palace, so the housekeeper gave him permission.
        - id: ch03-b10
          speaker: narrator
          text: Beyond the town, the prince opened the golden apple. The horse leaped out, and he swung into the saddle. Then he opened the silver and copper apples. With the hussars and foot soldiers following him, he rode to join the king's army.

    - id: ch04
      title: The Unknown Champion
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The king saw the great force approaching and was afraid, for he could not tell whether it belonged to a friend or an enemy. Then the prince rode forward and bowed low.
        - id: ch04-b02
          speaker: prince
          text: Your Majesty, I have brought soldiers to strengthen your army.
        - id: ch04-b03
          speaker: narrator
          text: The king was delighted, and all his fear of the enemy vanished. His daughters had come with him. They welcomed the prince warmly and asked him to ride in their carriage so they could talk.
        - id: ch04-b04
          speaker: prince
          text: Thank you, but I must stay on my horse. The battle may begin at any moment.
        - id: ch04-b05
          speaker: narrator
          text: While they stood talking, the younger princess, who was also the lovelier of the two, took off her ring. Her elder sister tore her handkerchief in half. They gave the ring and half handkerchief to the prince.
        - id: ch04-b06
          speaker: narrator
          text: Suddenly, the enemy appeared. The king asked whether his own army or the prince's men should go first. The prince answered by charging ahead. His hussars fought so bravely that only two enemies survived, and those two were spared only so they could carry the news away.
        - id: ch04-b07
          speaker: narrator
          text: The king rejoiced at the brilliant victory, and so did both princesses. On the journey home, they once more invited the prince into their carriage. Again he refused. Then he galloped away with his hussars.
        - id: ch04-b08
          speaker: narrator
          text: Near the town, the prince carefully packed every soldier and his splendid horse back into the apples. Then he walked through the gates as an ordinary palace servant.
        - id: ch04-b09
          speaker: housekeeper
          text: There you are at last! You had no business staying away for so long.

    - id: ch05
      title: The Ring and the Handkerchief
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The whole adventure might have ended there. But the younger princess had fallen in love with the unknown prince, and he had fallen in love with her. Since he carried no jewels of his own, he gave her the copper apple and its staff.
        - id: ch05-b02
          speaker: narrator
          text: One day, while the princesses were talking with their father, the younger daughter shared a thought with him.
        - id: ch05-b03
          speaker: younger_princess
          text: Father, could the servant in our palace be the man who came to your aid?
        - id: ch05-b04
          speaker: narrator
          text: The king grew angry at such an idea. Still, to satisfy her, he ordered the servant's room searched. To everyone's astonishment, the searchers found the golden ring and the half handkerchief there. As soon as the king saw them, he summoned the prince.
        - id: ch05-b05
          speaker: second_king
          text: Was it you who came to rescue us in the war?
        - id: ch05-b06
          speaker: prince
          text: Yes, Your Majesty. I was the one.
        - id: ch05-b07
          speaker: second_king
          text: Then tell me where you found such an army.
        - id: ch05-b08
          speaker: prince
          text: If you would like to see it, I can show it to you beyond the city walls.
        - id: ch05-b09
          speaker: narrator
          text: And that was exactly what he did. First, though, he asked the younger princess to return the copper apple. When the horsemen and foot soldiers were all drawn up outside, their numbers were so great that there was barely room for them.

    - id: ch06
      title: The Prince's Reward
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The king rewarded the prince with his daughter and his kingdom. When he learned that the young man was also a king's son, his joy knew no bounds.
        - id: ch06-b02
          speaker: narrator
          text: The prince carefully packed all the soldiers into the apples once again, and everyone returned to the town.
        - id: ch06-b03
          speaker: narrator
          text: Before long, they held a grand wedding. Perhaps they are all alive still, but I cannot tell you.
