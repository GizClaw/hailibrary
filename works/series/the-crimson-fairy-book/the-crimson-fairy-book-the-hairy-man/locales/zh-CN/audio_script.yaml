audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 清楚从容，像在为听众介绍一本童话集的篇目
        timbre: 温暖明亮
        pace: 舒缓，每个篇名之间留出自然停顿
        pitch: 中音
    swineherd:
      display_name: 放猪娃
      tts:
        delivery: 机灵果断，年纪虽小却毫不怯场
        timbre: 清亮稚嫩
        pace: 稍快
        pitch: 中高音
    young_prince:
      display_name: 小王子
      tts:
        delivery: 善良坦率，长大后谦逊而勇敢
        timbre: 清朗温和
        pace: 中速
        pitch: 中音
    second_king:
      display_name: 城中国王
      tts:
        delivery: 起初胆怯多疑，得胜后热情爽朗
        timbre: 成熟明亮
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 油菜田里的纵火者
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 不知在什么地方——我也说不准——住着一位国王。他有两片长得极好的油菜田，可每天夜里，其中一片田中总有两垛油菜让人烧掉。国王气坏了，派士兵去抓纵火者，士兵们却连个人影也看不到。他又拿出九百克朗悬赏，还下令说，谁看守田地不力，谁就得死。守田的人来了不少，可油菜垛还是保不住。国王接连杀了九十九个人以后，一个放猪的小男孩带着两条狗来见他。那两条狗，一条叫“嘘”，一条叫“别出声”。男孩说，他愿意守住油菜垛。
        - id: ch01-b02
          speaker: narrator
          text: 天一黑，男孩便爬上第四座油菜垛。从垛顶望去，整片田野都在眼底。到了大约十一点，他隐约看见一个人走近油菜垛，放起火来。男孩心想，这回你可跑不了啦。他刚要招呼两条狗，它们已经冲了出去。
        - id: ch01-b03
          speaker: swineherd
          text: 快去！嘘，别出声，把他抓住！
        - id: ch01-b04
          speaker: narrator
          text: 不到五分钟，那人就被两条狗逮住了。第二天一早，他被捆起来押到国王面前。国王十分满意，当场赏给男孩一千克朗。再看那个犯人，他浑身都是毛，活像一头野兽，模样古怪极了。国王把他锁进一间牢固的密室，又给各国国王和王子发出请帖，请大家都来看看这个奇人。
        - id: ch01-b05
          speaker: narrator
          text: 偏偏国王十岁的儿子也去看了毛人。毛人苦苦求他开门，小王子听得心软，便从母后那里偷出钥匙，放走了他，随后又把钥匙放回原处。毛人就这样远走他乡。等受邀的国王和王子一个接一个赶到，大家都急着一睹毛人的模样，他却早已不见了。国王又羞又怒，几乎气炸。他厉声盘问王后，还说，如果她找不回毛人，就要把她关进灯心草搭的小屋，连人带屋一起烧掉。王后再三申明，自己根本不知情。哪怕钥匙真是儿子拿的，她也毫不知晓。
        - id: ch01-b06
          speaker: narrator
          text: 他们把小王子叫来，问了又问。最后，孩子承认是自己放走了毛人。国王立即命仆人把他带进森林杀掉，再拿一部分肝和肺回来复命。
    - id: ch02
      title: 森林里的重逢
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 王命传开，整座王宫都陷入悲痛，因为人人喜爱小王子。可仆人们不敢违命，只得把孩子带进森林。其中一人实在下不了手，便射死一条狗，割下几块狗的肝和肺交给国王。国王信以为真，也就不再追问。小王子留在森林里，靠自己想办法活了整整五年。
        - id: ch02-b02
          speaker: narrator
          text: 一天，他找到一座破旧的小屋，里面住着一位老人。两人谈起话来，小王子说出了自己的身世和悲惨遭遇。说着说着，他们认出了对方。原来这老人正是当年被他放走的毛人，这些年一直住在森林里。
        - id: ch02-b03
          speaker: narrator
          text: 小王子跟毛人又住了两年，随后想到更远的地方去。毛人再三挽留，他还是决定离开。临行时，毛人送给他三件宝物。第一只是金苹果，里面能走出一匹金鬃马，配着一根驾驭它的金杖。第二只是银苹果，能唤出世上最英武的一队骠骑兵，配着一根银杖。第三只是铜苹果，只要用上那根铜杖，他想要多少步兵，就能叫出多少。毛人让他郑重起誓，一定好好保管这些礼物，这才让他上路。
        - id: ch02-b04
          speaker: narrator
          text: 少年一路走下去，来到一座大城，在王宫里当了仆人。谁也不大注意他，他便安静地生活。一天，消息传来，说国王必须出征打仗。可国王的军队少得可怜，他吓得要命，又不能不去。大队人马离开后，小王子向女管家请假，说自己在邻村欠了一笔小账，想去还清。宫中已经没有事情可做，女管家便答应了。
    - id: ch03
      title: 苹果里的军队
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小王子出了城，取出金苹果。金鬃马一跃而出，他翻身骑了上去。随后，他又打开银苹果和铜苹果，带着骠骑兵和步兵去追国王的大军。国王远远看见他们，心里十分害怕，不知道来的是援军还是敌人。小王子策马来到他面前，深深行礼。
        - id: ch03-b02
          speaker: young_prince
          text: 陛下，我带着援军来帮助您。
        - id: ch03-b03
          speaker: narrator
          text: 国王顿时欢喜起来，再也不怕敌军了。几位公主也随军同行。她们待小王子很亲热，请他坐进马车，好一路说说话。小王子没有答应，仍骑在马上，因为战斗随时可能开始。大家交谈时，最年幼、也最美丽的公主摘下戒指，她的姐姐又把手帕撕成两半。两位公主把这些信物送给了小王子。
        - id: ch03-b04
          speaker: narrator
          text: 敌军忽然出现在前方。国王问，是自己的军队先上，还是小王子的军队先上。小王子没有迟疑，一马当先，带着骠骑兵冲了出去。他们奋勇作战，最后只留下两个敌人活命，好让这两人回去报信。
        - id: ch03-b05
          speaker: narrator
          text: 国王和女儿们都为这场大胜欣喜不已。回城时，公主们再次请小王子同车，他还是不肯，带着骠骑兵飞驰而去。到了城外，他把士兵和骏马仔细收回三只苹果，才慢悠悠地走进城。女管家见他回来得这样晚，狠狠训了他一顿。
    - id: ch04
      title: 仆人的秘密
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 故事本来可以就此结束，可小公主已经爱上了小王子，小王子也爱着她。他身上没有珠宝，便把铜苹果和铜杖送给了她。一天，几位公主陪父王说话，小公主问起一件事。那天带兵相救的人，会不会就是宫里的那个仆人？国王听了十分生气，觉得这个念头太荒唐。不过，为了让女儿心服，他还是下令搜查仆人的房间。没想到，众人竟在那里找到了金戒指和半方手帕。国王一看到这些东西，马上把小王子召来。
        - id: ch04-b02
          speaker: second_king
          text: 那天带兵来救我们的人，是不是你？
        - id: ch04-b03
          speaker: young_prince
          text: 是的，陛下，正是我。
        - id: ch04-b04
          speaker: second_king
          text: 可你的军队究竟是从哪里来的？
        - id: ch04-b05
          speaker: young_prince
          text: 您若想亲眼看看，我可以到城墙外把他们全都召出来。
        - id: ch04-b06
          speaker: narrator
          text: 小王子说到做到。他先向小公主要回铜苹果，然后来到城外，打开三只苹果，把所有士兵都召了出来。军队列好阵势，人数多得几乎占满了城外的空地。
    - id: ch05
      title: 盛大婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 小王子救了国王和他的国家，国王便把女儿嫁给他，又把整个王国交给他作为酬谢。后来，国王得知这位年轻人原本就是一国王子，更是欢喜得无以复加。小王子再次把全部士兵仔细收进苹果里，众人一起回到城中。
        - id: ch05-b02
          speaker: narrator
          text: 没过多久，一场盛大的婚礼举行了。也许他们直到今天还都活着，不过，我可不知道。
