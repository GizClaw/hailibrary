  chapters:
    - id: ch01
      title: The Queen's Last Promise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long, long ago, a king and queen ruled a large and powerful country. No one remembers their names. Their son was called Sigurd and their daughter Lineik, and all through the kingdom the two young people were known for their wisdom and beauty.
        - id: ch01-b02
          speaker: narrator
          text: They were only a year apart in age and loved each other so dearly that they did nothing separately. As they grew older, the king gave them a house of their own, complete with servants, carriages, and everything they could want.
        - id: ch01-b03
          speaker: narrator
          text: The family lived happily for years. Then the queen fell ill and knew she would never recover. One day, she asked the king to make her two promises.
        - id: ch01-b04
          speaker: dying_queen
          text: If you marry again, as you surely must, do not choose a woman from a little state or some faraway island. She would know nothing of the world and might think only of her new grandeur. Find a princess from a great kingdom instead, someone who has always known court life and understands its true worth. And please, never stop watching over our children. Before long, they will be your greatest joy.
        - id: ch01-b05
          speaker: narrator
          text: Those were her last words. A few hours later, she died.
        - id: ch01-b06
          speaker: narrator
          text: Grief bent the king so low that he stopped attending even to the affairs of his kingdom. At last, his Prime Minister had to tell him that the people were complaining. No one was there to set their wrongs right.
        - id: ch01-b07
          speaker: prime_minister
          text: You must rouse yourself, Your Majesty. For your country's sake, you have to put your own sorrow aside.
        - id: ch01-b08
          speaker: king
          text: You do not spare me, but you are right, and your advice is good. People also say my kingdom needs me to marry again. My heart will always belong to the wife I lost, yet this was her wish too. I trust you to find a lady fit to share my throne. Only make certain she comes from neither a small town nor a distant island.
        - id: ch01-b09
          speaker: narrator
          text: An embassy was made ready, led by the minister himself. They would visit the greatest courts in the world and choose a suitable princess.

    - id: ch02
      title: The Woman on the Island
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The minister's ship had been at sea only a few days when a thick fog closed around it. The captain could see nothing on either side. For a whole month, the ship drifted through darkness. Then the fog finally lifted, and a cliff stood just ahead. Beside it lay a sheltered bay where they could anchor. They had no idea where they were, but at least they hoped to find fresh fruit and water.
        - id: ch02-b02
          speaker: narrator
          text: Leaving all his companions aboard, the minister lowered a small boat and rowed himself to shore. He meant to look around, search for supplies, and learn whether the island was truly as deserted as it seemed. From the water there had been no sign of any town or harbor, and nothing yet told him who might live beyond the bare coast.
        - id: ch02-b03
          speaker: narrator
          text: Before he had gone far, he heard music. He followed it and found a marvelously beautiful woman seated on a low stool, playing a harp while a girl beside her sang. The minister greeted the lady politely. She welcomed him and asked why he had come to such a lonely place, so he explained the purpose of his journey.
        - id: ch02-b04
          speaker: blauvor
          text: My fate is much like your master's. I was married to a mighty king who ruled this land. Then Vikings came, killed him, and put all our people to death. My daughter and I escaped and hid ourselves here.
        - id: ch02-b05
          speaker: narrator
          text: The daughter listened, then spoke softly to her mother.
        - id: ch02-b06
          speaker: laufer
          text: Mother, are you telling the truth this time?
        - id: ch02-b07
          speaker: narrator
          text: The woman pinched the girl where the minister could not see.
        - id: ch02-b08
          speaker: blauvor
          text: Remember what you promised.
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: The minister was deeply moved by the sad tale and asked the lady's name.
        - id: ch02-b10
          speaker: blauvor
          text: I am Blauvor, and my daughter is Laufer.
        - id: ch02-b11
          speaker: narrator
          text: Blauvor asked the minister his own name and the name of the king he served. Then they spoke of many things. She seemed learned in everything a woman was expected to know, and in much that was usually taught only to men. Her answers convinced the minister that she understood the ways of great courts. He thought she would make an excellent wife for his king. Before long, he asked for her hand on his master's behalf.
        - id: ch02-b12
          speaker: narrator
          text: At first, Blauvor claimed she was unworthy of such a place and warned that he might regret choosing her. That only made him more eager. At last she agreed, and he persuaded her to sail home with him at once.
        - id: ch02-b13
          speaker: narrator
          text: The minister brought Blauvor and Laufer aboard. The anchor came up, the sails spread, and a fair wind carried them away. Looking back, the travelers could now see that nearly the whole island was bare, deserted, and unfit for people to live on. No one gave that any thought.
        - id: ch02-b14
          speaker: narrator
          text: Six days later, they reached the king's country. The minister sent a messenger ahead, then led the two women toward the capital.
        - id: ch02-b15
          speaker: narrator
          text: The moment the king saw them in their gold and silver gowns, their beauty drove away his sorrow. He ordered the wedding to be prepared at once. In his delight, he never asked what sort of country Blauvor had come from. He was so dazzled that when invitations went out to every great person in the kingdom, he even forgot Sigurd and Lineik. His own children stayed shut away in their separate house.

    - id: ch03
      title: The King's Last Journey
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Once Blauvor was queen, the king seemed to lose his will. He consulted her about everything. She sat in every council, and no peace was made and no war begun until her opinion had been heard.
        - id: ch03-b02
          speaker: narrator
          text: After a few months, however, the king began to wonder whether his minister had chosen wisely. He also noticed that his children stayed in their own palace more and more, never going near their stepmother.
        - id: ch03-b03
          speaker: narrator
          text: Once his eyes had opened, he began to notice other troubling things. Members of his court were disappearing, one after another, for no clear reason. At first, he paid little attention and simply appointed a new person whenever a place became empty. But the vanishings continued. Man after man went missing without leaving a single trace behind. The king could no longer dismiss it as chance. He grew uneasy and began to wonder whether the queen might somehow be involved.
        - id: ch03-b04
          speaker: narrator
          text: Then one day, Blauvor told him it was time to travel through his kingdom and make sure his governors were not keeping money that belonged to him.
        - id: ch03-b05
          speaker: blauvor
          text: You need not worry about leaving. While you are away, I will govern the country as carefully as you would.
        - id: ch03-b06
          speaker: narrator
          text: The king had little wish to go, but Blauvor's will was stronger than his, and he was too lazy to oppose her. He said nothing. Instead, he ordered his finest ship prepared for a journey around the coast.
        - id: ch03-b07
          speaker: narrator
          text: Still, his heart felt heavy, and an uneasiness he could not explain stayed with him. On the night before he left, he went to his children's palace to say goodbye.
        - id: ch03-b08
          speaker: narrator
          text: Sigurd and Lineik had not seen their father for some time. They welcomed him warmly, for they loved him dearly and he had always been kind to them. They had many things to tell him, but after a while he stopped their cheerful talk.
        - id: ch03-b09
          speaker: king
          text: If I never return from this journey, it may not be safe for you here. As soon as there is no hope that I am coming back, leave at once. Follow the road east until you reach a high mountain, and cross it. Beyond the mountain, walk beside a little bay. You will come to a thicket where two trees stand, one green and one red. They grow so far from the road that you will miss them unless you look carefully. Each of you must hide inside one tree. There you will be safe from every enemy.
        - id: ch03-b10
          speaker: narrator
          text: The king said farewell and sadly boarded his ship. For several days, the wind stayed fair and the voyage went smoothly. Then a gale rose without warning. Thunder and lightning tore through a storm more terrible than anyone could remember. The frightened sailors fought to save the ship, but it crashed on the rocks. Not one man aboard survived.
        - id: ch03-b11
          speaker: narrator
          text: That same night, Prince Sigurd dreamed that his father entered the room in dripping clothes. Without a sound, the king lifted the crown from his head, placed it at his son's feet, and went away as silently as he had come.
        - id: ch03-b12
          speaker: narrator
          text: Sigurd woke Lineik at once. They agreed that their father must be dead and that they had no time to lose. They gathered their jewels and a few clothes, then slipped out of the house unseen.
        - id: ch03-b13
          speaker: narrator
          text: They hurried all the way to the mountain without looking behind them. Only then did Sigurd glance back. Their stepmother was following, and the look on her face made her uglier than the ugliest old witch. A thick wood lay between them. Sigurd paused long enough to set it on fire. Then he and Lineik raced onward until they found the grove with the red tree and the green one. They leaped into the trunks and at last felt safe.

    - id: ch04
      title: The False Princess
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At that time, a very rich and powerful king ruled Greece, though his name has also been forgotten. He had a son and a daughter who were more beautiful and accomplished than any Greeks before them. They were their father's pride.
        - id: ch04-b02
          speaker: narrator
          text: As soon as the prince was no longer a boy, he persuaded his father to let him spend each summer at war with a neighboring nation. He wanted the chance to make himself famous. In winter, food and horses were hard to find in that wild country, so the army was sent home and the prince returned to Greece.
        - id: ch04-b03
          speaker: narrator
          text: During one of those wars, he heard stories of Princess Lineik's beauty. He decided to find her and ask her to marry him. Through her black arts, Queen Blauvor learned of his plan. When he came near the capital, she dressed Laufer in a splendid gown and went out to welcome him.
        - id: ch04-b04
          speaker: narrator
          text: She received the prince at her palace. After supper, she told him that her husband had died and that no one but herself remained to govern the kingdom.
        - id: ch04-b05
          speaker: greek_prince
          text: But where is Princess Lineik?
        - id: ch04-b06
          speaker: blauvor
          text: She is here.
        - id: ch04-b07
          speaker: narrator
          text: Blauvor brought forward the girl she had kept in the background. The prince studied Laufer and felt disappointed. She was pretty, but there was nothing remarkable about her.
        - id: ch04-b08
          speaker: blauvor
          text: Do not be surprised that she looks pale and tired. She has never recovered from losing both her father and her mother.
        - id: ch04-b09
          speaker: narrator
          text: The prince decided that such grief showed a good heart. Once the girl was happy, he thought, her beauty would surely return. Without waiting any longer, he asked Blauvor to approve their betrothal. The wedding itself would have to take place in Greece.
        - id: ch04-b10
          speaker: narrator
          text: Blauvor was delighted. She had hardly expected her trick to succeed so quickly, and she began preparing for the journey at once. She wanted to travel with the young couple herself so she could make certain nothing went wrong. On that point, however, the prince stood firm. The marriage would happen in his own country, and he insisted on taking no one with him but Laufer, whom he believed to be Lineik.
        - id: ch04-b11
          speaker: narrator
          text: Soon they said goodbye to the queen and sailed away in a splendid ship. Before long, a dense fog surrounded them. The captain lost his course in the darkness, and the ship entered a bay that none of the crew knew.
        - id: ch04-b12
          speaker: narrator
          text: The prince had a boat lowered and went ashore to explore. There he noticed two beautiful trees unlike any that grew in Greece. He called a sailor and ordered him to cut them down and carry them aboard. By then the sky had cleared. The ship returned to sea, taking Sigurd and Lineik with it inside the trees, and reached Greece without another adventure.
        - id: ch04-b13
          speaker: narrator
          text: News that the prince was bringing home a bride traveled ahead of the ship. By the time they arrived, flower-covered arches and crowns of colored lights had been raised to greet them. The king and queen met the travelers on the palace steps. They welcomed Laufer as their son's future wife and led her to the women's house, where custom required her to remain until the wedding. The prince then went to his own rooms and ordered the red and green trees brought inside to him.

    - id: ch05
      title: The Three Robes
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next morning, the prince had his attendants bring his future bride to his rooms. He gave her shining silk and told her to weave three robes before the wedding, one blue, one red, and one green. The blue robe must come first. The green must come last and be the finest of all.
        - id: ch05-b02
          speaker: greek_prince
          text: I will wear the green robe when we are married.
        - id: ch05-b03
          speaker: narrator
          text: When Laufer was alone, she sat staring at the heap of silk. She did not know how to weave. Soon she burst into tears, certain that her secret would be discovered. Lineik's skill with a loom was as famous as her beauty.
        - id: ch05-b04
          speaker: narrator
          text: Hidden in his tree, Sigurd heard her sobbing and felt sorry for her.
        - id: ch05-b05
          speaker: sigurd
          text: Lineik, my sister, Laufer is crying. Please help her.
        - id: ch05-b06
          speaker: lineik
          text: Have you forgotten what her mother did to us? We are driven from our home because of her.
        - id: ch05-b07
          speaker: narrator
          text: But Lineik was not truly unforgiving. Before long, she slipped quietly from her tree, took the silk from Laufer, and began to weave. Her hands were so quick and skillful that she not only wove the blue robe but embroidered it as well. She was safely hidden again before the prince returned.
        - id: ch05-b08
          speaker: greek_prince
          text: This is the finest work I have ever seen. The red silk is even richer, so I am certain that robe will be more beautiful still.
        - id: ch05-b09
          speaker: narrator
          text: He bowed low and left the room.
        - id: ch05-b10
          speaker: narrator
          text: Laufer had secretly hoped that one finished robe would satisfy him. When she understood that he expected all three, her heart sank, and she began to weep loudly. Again Sigurd heard. Again he pleaded with Lineik to help.
        - id: ch05-b11
          speaker: narrator
          text: Lineik felt pity for Laufer's distress. She wove and embroidered the second robe just as she had the first, working gold thread and precious stones into it until the red silk could hardly be seen. She glided back inside her tree at the very moment the prince entered.
        - id: ch05-b12
          speaker: greek_prince
          text: You work as quickly as you work beautifully. This robe looks as though fairies embroidered it. But the green one must outshine them both, so I will give you three days to finish it. As soon as it is ready, we will be married.
        - id: ch05-b13
          speaker: narrator
          text: His words made Laufer remember every cruel thing that she and her mother had done to Lineik. Could she expect Lineik to forget it all and rescue her a third time?
        - id: ch05-b14
          speaker: narrator
          text: Lineik remembered the past too. She might have left Laufer to manage alone if Sigurd had not begged her to help just once more. So she came out of the tree again. To Laufer's great relief, she sat down to work.
        - id: ch05-b15
          speaker: narrator
          text: Lineik worked until the shining green silk was ready. Then, on the point of her needle, she caught rays from the sun and beams from the moon and wove them into a pattern no one had ever seen. Such work could not be hurried. It took nearly all the three days the prince had allowed. On the third morning, Lineik was sewing the final stitches into the last flower when the prince came into the room.
        - id: ch05-b16
          speaker: narrator
          text: Lineik sprang up and tried to pass him on her way back to the tree. The folds of green silk tangled around her. She would have fallen, but the prince caught her.
        - id: ch05-b17
          speaker: greek_prince
          text: I have suspected for some time that something was wrong here. Tell me who you are and where you came from.
        - id: ch05-b18
          speaker: narrator
          text: Lineik gave him her name and told him her whole story. When she finished, the prince turned on Laufer in anger.
        - id: ch05-b19
          speaker: greek_prince
          text: Your wicked lies deserve a shameful death.
          emotion: angry
        - id: ch05-b20
          speaker: narrator
          text: Laufer dropped at his feet and begged him to spare her.
        - id: ch05-b21
          speaker: laufer
          text: This was my mother's doing. She was the one who pretended I was Princess Lineik, not me. I lied to you only about the robes. That is wrong, but I do not deserve to die for it.
          emotion: fearful

    - id: ch06
      title: The Ogress Defeated
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Laufer was still kneeling when Prince Sigurd entered the room. He asked the Prince of Greece to forgive her. The prince agreed, but only if Lineik would consent to marry him.
        - id: ch06-b02
          speaker: lineik
          text: Not while my stepmother is alive. She has brought misery to everyone who came near her.
        - id: ch06-b03
          speaker: narrator
          text: Then Laufer told them the truth about Blauvor.
        - id: ch06-b04
          speaker: laufer
          text: She was never a king's wife. She is an ogress who stole me from a nearby palace and raised me as her daughter. She is a witch too. Her black magic sank the ship carrying Sigurd and Lineik's father. The courtiers who vanished did not run away. Blauvor ate them in the night. She means to rid the country of all its people and fill it with ogres and ogresses like herself.
        - id: ch06-b05
          speaker: narrator
          text: Sigurd and the Prince of Greece quickly gathered an army and marched on the city where Blauvor had her palace. They moved so swiftly that no one knew they were coming. Even a warning would have done Blauvor little good. She had eaten most of the strong men who might have defended her, while others had secretly left the city. Those people had sensed some hidden danger, though they could not say what frightened them.
        - id: ch06-b06
          speaker: narrator
          text: Blauvor was easily captured. The next day, she was beheaded in the marketplace. Afterward, the two princes marched back to Greece.
        - id: ch06-b07
          speaker: narrator
          text: Nothing now stood between Lineik and her wedding. She married the Prince of Greece on the same day that Sigurd married the Greek princess. Laufer stayed with Lineik as her friend and sister until they found her a husband among the great noblemen.
        - id: ch06-b08
          speaker: narrator
          text: And all three couples lived happily until they died.
