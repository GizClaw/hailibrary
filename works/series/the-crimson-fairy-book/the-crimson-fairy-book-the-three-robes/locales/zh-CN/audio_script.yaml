audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    queen_mother:
      display_name: 王后
      tts:
        delivery: 温柔端庄，临终嘱托中带着清醒与忧虑
        timbre: 柔和清润
        pace: 舒缓
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 原本威严，丧妻后悲伤迟缓，面对儿女时慈爱忧心
        timbre: 浑厚低沉
        pace: 中速偏缓
        pitch: 中低音
    prime_minister:
      display_name: 首相
      tts:
        delivery: 恭敬稳重，劝谏时坦率坚定
        timbre: 成熟清晰
        pace: 中速
        pitch: 中低音
    blauvor:
      display_name: 布劳沃尔
      tts:
        delivery: 表面高雅亲切，暗处阴狠强势
        timbre: 华丽冷冽
        pace: 中速偏缓
        pitch: 中音
    laufer:
      display_name: 劳弗
      tts:
        delivery: 年轻怯弱，受逼迫时迟疑，悔悟求饶时真切急迫
        timbre: 轻柔纤细
        pace: 中速
        pitch: 中高音
    sigurd:
      display_name: 西格尔德
      tts:
        delivery: 善良勇敢，对妹妹亲近恳切，危急时果断
        timbre: 年轻明朗
        pace: 中速
        pitch: 中音
    lineik:
      display_name: 利奈克
      tts:
        delivery: 聪慧沉静，受伤后仍有分寸，立场坚定
        timbre: 清澈柔韧
        pace: 中速偏缓
        pitch: 中高音
    greek_prince:
      display_name: 希腊王子
      tts:
        delivery: 自信爽直，赞叹时热烈，识破骗局后严厉
        timbre: 年轻饱满
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 王后的遗言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，一个辽阔强盛的国家里，住着一位国王和一位王后。如今谁也不知道他们的名字，只知道他们有一双儿女。王子叫西格尔德，公主叫利奈克。兄妹俩才貌双全，整个王国都知道他们。
        - id: ch01-b02
          speaker: narrator
          text: 西格尔德只比妹妹大一岁。两人亲密极了，做什么都不愿分开。等他们渐渐长大，国王送给他们一座自己的宫殿，又配齐仆人和马车。他们想要的东西，几乎样样都有。
        - id: ch01-b03
          speaker: narrator
          text: 一家人就这样幸福地生活了许多年。后来有一天，王后病倒了。她自己清楚地知道，这场病再也不会好了。一天，她把国王叫到身边，要他答应两件事。
        - id: ch01-b04
          speaker: queen_mother
          text: 将来你一定要再娶，可千万别娶小国或偏远海岛来的女子。她不懂世事，忽然有了尊贵身份，满心只会想着自己的荣华。你该去大国求娶一位公主。她从小见惯宫廷，知道这些尊荣究竟值多少。还有，请你永远照看好我们的孩子。他们很快就会成为你最大的安慰。
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: 这是王后最后的遗言。几小时后，她便去世了。国王悲痛得再也无心处理国事。百姓受了冤屈，却没有人替他们主持公道，怨声越来越多。首相只好走到国王面前，直言相劝。
        - id: ch01-b06
          speaker: prime_minister
          text: 陛下，请您振作起来。为了整个国家，您得暂且放下自己的悲痛。
        - id: ch01-b07
          speaker: king
          text: 你对我说话倒真不留情面，不过你说得公正，劝得也对。我听说，人们认为我再娶一位妻子，对王国更好。我的心永远属于亡妻，可再婚也是她的遗愿。寻找一位能和我共坐王位的女子，这件事就交给你。记住，她不能来自小城，也不能来自遥远的海岛。
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: 首相带领使团启程了。他们要走遍世上最显赫的宫廷，选出一位合适的公主。可是船出海才几天，浓雾便罩住四周，船长连左右都分辨不清。他们在黑暗中漂了整整一个月。雾终于散去时，一面峭壁正横在前方。峭壁旁边有个避风的海湾，船很快在那里抛了锚。没有人知道这是什么地方，不过岛上总该能找到鲜果和清水。
        - id: ch01-b09
          speaker: narrator
          text: 首相让随从留在船上，自己划着小艇上了岸。他想看看这座岛是不是真像表面那样荒凉。没走多远，他便听见乐声。循着声音找去，只见一位美貌非凡的女子坐在矮凳上弹竖琴，旁边还有一个少女在唱歌。首相礼貌地问候她。女子也亲切地还礼，问他为何来到如此偏僻的地方。首相便说明了这趟旅程的目的。
        - id: ch01-b10
          speaker: blauvor
          text: 我的遭遇和您的主人一样。我曾嫁给统治这片土地的一位强大国王。后来维京海盗闯来，杀死了他，也杀光了所有臣民。只有我逃了出来，带着女儿躲在这里。
        - id: ch01-b11
          speaker: laufer
          text: 母亲，您这次说的是真的吗？
        - id: ch01-b12
          speaker: narrator
          text: 布劳沃尔听了，怒气一下冒了出来。她暗中狠狠掐了女儿一把，首相一点也没有看见。
        - id: ch01-b13
          speaker: blauvor
          text: 别忘了你答应过什么。
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: 首相却被那番悲惨的故事深深打动了。
        - id: ch01-b15
          speaker: prime_minister
          text: 夫人，请问您叫什么名字？
        - id: ch01-b16
          speaker: blauvor
          text: 我叫布劳沃尔，我的女儿叫劳弗。
        - id: ch01-b17
          speaker: narrator
          text: 布劳沃尔也问了首相的名字，还问起他侍奉的国王。随后，他们谈了许多事情。首相发现，她不但精通女子该懂的一切，就连通常只教给男子的学问也懂得不少。他越谈越觉得，要是她嫁给国王，该有多合适。没多久，他便代表国王向她求婚。
        - id: ch01-b18
          speaker: narrator
          text: 布劳沃尔起初百般推辞，说自己身份卑微，配不上王后的位置，还说首相迟早会后悔。她越推辞，首相越恳切，最后终于说服她立刻随船回国。母女俩登船以后，船锚升起，风帆张开，顺风推着他们返航。
        - id: ch01-b19
          speaker: narrator
          text: 众人回头望去，这才看清那座岛除了靠近海岸的一小片地方，别处处处荒芜，根本不适合人居住。可谁也没把这件事放在心上。他们一路航行得很快，只用了六天就回到国土，随即赶往京城。首相先派信使进宫，把一路发生的事情禀报国王。
        - id: ch01-b20
          speaker: narrator
          text: 国王看见身穿金银华服的两位美人，顿时忘了悲伤，下令马上筹办婚礼。他只顾欢喜，根本没问未来的王后是从什么地方找来的。母女俩的美貌把他迷得神魂颠倒。他向全国显贵发请帖时，甚至忘了自己的两个孩子，任由他们留在各自的宫殿里。
    - id: ch02
      title: 红树与绿树
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 婚后，国王再没有自己的主意，凡事都要听妻子的。王后每次都参加议事。不管议和还是开战，国王都先问她怎么想。几个月过去，他渐渐怀疑首相的选择是否明智，也发现两个孩子越来越少出门，从不肯到继母跟前来。
        - id: ch02-b02
          speaker: narrator
          text: 一个人的眼睛只要睁开一次，就会看见许多从没料到的事。国王很快注意到，朝臣总会无缘无故地一个接一个失踪。起初，他只是另选新人填补空缺，没有多想。可失踪的人越来越多，又全都不留痕迹，他终于感到不安，开始怀疑王后与此有关。
        - id: ch02-b03
          speaker: narrator
          text: 就在这个时候，王后忽然说，国王该巡视全国了。他应该亲眼看看，各地总督有没有私吞本该献给他的赋税。
        - id: ch02-b04
          speaker: blauvor
          text: 您放心去吧。您不在的时候，我会替您治理国家，一定和您亲自掌管时一样周全。
        - id: ch02-b05
          speaker: narrator
          text: 国王一点也不想出巡。可王后的意志比他强，他又懒得争辩，只好命人备好最漂亮的船，准备沿海岸航行。他始终心神不宁，却说不出缘故。启程前夜，他来到孩子们的宫殿，向他们告别。
        - id: ch02-b06
          speaker: narrator
          text: 父子三人已经好些日子没有见面了。兄妹俩深爱父亲，而父亲也一直疼爱他们，所以一见面便有说不完的话。国王听了一阵，打断他们欢快的谈笑，留下最后的嘱咐。
        - id: ch02-b07
          speaker: king
          text: 如果我这次没有回来，你们留在这里恐怕不安全。等到确定我再也回不来，就立刻沿着向东的路走，直到一座高山脚下，再翻过那座山。山后有个小海湾。你们顺着岸边走，会在灌木丛里找到两棵树，一棵绿，一棵红。它们离大路很远，非得仔细寻找才能看见。你们一人藏进一棵树的树干，仇敌便伤不到你们。
        - id: ch02-b08
          speaker: narrator
          text: 国王说完，忧伤地告别儿女，登上了船。最初几天一路顺风。忽然，狂风卷来，雷电交加，掀起了一场从没人见过的可怕风暴。水手们吓坏了，拼尽全力也没能救回船只。船撞上礁石，无一人幸存。
        - id: ch02-b09
          speaker: narrator
          text: 当天夜里，西格尔德做了一个梦。父亲浑身湿淋淋地走进房间，从头上摘下王冠，放到儿子脚边，随后又悄无声息地离开了。
        - id: ch02-b10
          speaker: narrator
          text: 西格尔德猛然醒来，赶紧叫醒利奈克。兄妹俩认定父亲已经去世，必须马上照他的吩咐逃走。他们收好珠宝和几件衣服，趁谁也没有发现，悄悄离开了住所。
        - id: ch02-b11
          speaker: narrator
          text: 两人头也不回地奔向高山。到了山脚，西格尔德才转身望了一眼。继母正在后面追赶。她神情狰狞，比最丑陋的老巫婆还要可怕。中间正好隔着一片密林，西格尔德停下脚步，放火点燃树林，又拉着妹妹飞快向前。他们终于找到红树和绿树，纵身藏进树干，这才觉得安全了。
        - id: ch02-b12
          speaker: narrator
          text: 那时候，希腊有一位富有而强大的国王，不过他的名字不知为何失传了。他有一双儿女，两人的美貌和才艺超过以往所有希腊人，是父亲心中最大的骄傲。
        - id: ch02-b13
          speaker: narrator
          text: 王子刚刚成年，就说服父亲在每年夏天攻打邻国，好让自己有机会扬名。到了冬天，荒野里找不到足够的粮食和马匹，军队便解散，王子也回家休息。一次征战时，他听说利奈克公主美貌非凡，便决心找到她，娶她为妻。
        - id: ch02-b14
          speaker: narrator
          text: 布劳沃尔施展黑魔法，得知了王子的全部打算。等他接近京城，她便给劳弗穿上华丽礼服，亲自出城迎接。晚餐以后，布劳沃尔告诉王子，丈夫已经去世，整个国家只剩她一人治理。
        - id: ch02-b15
          speaker: greek_prince
          text: 那么，利奈克公主在哪里？
        - id: ch02-b16
          speaker: blauvor
          text: 她就在这里。
        - id: ch02-b17
          speaker: narrator
          text: 布劳沃尔把一直藏在后面的劳弗领上前。王子看了一眼，颇为失望。这少女虽然漂亮，却没有什么特别出众的地方。布劳沃尔看穿他的心思，赶紧替女儿解释。
        - id: ch02-b18
          speaker: blauvor
          text: 您别因为她脸色苍白、眼神疲倦而奇怪。她失去了父亲和母亲，至今还没有从悲痛里走出来。
        - id: ch02-b19
          speaker: narrator
          text: 王子觉得，这份悲伤正说明少女心地善良。等她重新快活，美貌自然也会回来。他马上请求王后同意订婚，因为婚礼必须回到希腊举行。
        - id: ch02-b20
          speaker: narrator
          text: 布劳沃尔喜出望外。她没想到计划这么快就会成功。她本想陪两个年轻人上路，好确保中途不出差错，可王子坚决不同意。他只肯带上被自己当成利奈克的劳弗。
        - id: ch02-b21
          speaker: narrator
          text: 他们很快告别王后，乘一艘华美的大船出海。没多久，浓雾又罩住海面。船长在黑暗中偏离航线，驶进一个全船人都不认识的海湾。王子命人放下小艇，亲自上岸察看，发现两棵从未在希腊见过的美丽树木。他叫来一名水手，把树砍倒，搬到船上。等天空放晴，他们重新起航，此后再没遇到波折，平安回到希腊。
    - id: ch03
      title: 蓝袍与红袍
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王子带回新娘的消息早已传遍王城。他们回来时，一路上立起鲜花拱门，还悬着一圈圈彩灯。国王和王后在宫殿台阶上亲自迎接，又把劳弗送到女眷居住的宫院。婚礼举行以前，她必须一直住在那里。王子则回到自己的房间，命人把那两棵树也抬了进去。
        - id: ch03-b02
          speaker: narrator
          text: 第二天，王子叫人把未来的新娘带来，交给她许多丝绸。她必须在婚礼前织成三件长袍，一件蓝色，一件红色，一件绿色。蓝袍先织，绿袍最后织，而且要最为华美。
        - id: ch03-b03
          speaker: greek_prince
          text: 绿袍一定要做得最好，因为婚礼那天，我要穿上它。
        - id: ch03-b04
          speaker: narrator
          text: 王子离开后，劳弗盯着满桌闪亮的丝绸，呆呆坐着。她根本不会织布，可利奈克的织艺和美貌一样出名。真相眼看就要败露，她掩住脸，哭得浑身发颤。藏在树里的西格尔德听见了，心中不忍，便轻声呼唤妹妹。
        - id: ch03-b05
          speaker: sigurd
          text: 利奈克，劳弗哭得这么伤心。求你帮帮她吧。
        - id: ch03-b06
          speaker: lineik
          text: 她母亲怎样害我们，你已经忘了吗？就是因为她，我们才被赶出家园。
        - id: ch03-b07
          speaker: narrator
          text: 利奈克嘴上这样说，却不是真的不肯原谅。没过多久，她便悄悄滑出树干，从劳弗手里接过丝绸。她手脚飞快，技艺又高，不但织好蓝袍，还绣上美丽花纹。王子回来以前，她早已藏回树中。
        - id: ch03-b08
          speaker: greek_prince
          text: 这是我见过最美的织品。红色衣料更加华贵，下一件一定还会更漂亮。
        - id: ch03-b09
          speaker: narrator
          text: 王子深深鞠了一躬，离开房间。劳弗原本暗暗盼望，他看见蓝袍织好，就会免去另外两件。如今知道自己还得完成全部差事，她的心一下沉了下去，忍不住放声大哭。
        - id: ch03-b10
          speaker: narrator
          text: 西格尔德再次听到哭声，又恳求妹妹帮忙。利奈克也为劳弗的苦恼感到难过，便像上一次那样替她织好第二件长袍，还把金线和宝石织进花纹，密密地盖满衣料，几乎看不见原本的红色。她刚刚溜回树里，王子便走进房间。
        - id: ch03-b11
          speaker: greek_prince
          text: 你的手艺这样高明，动作还这么快。这件红袍简直像仙女绣出来的！不过绿袍必须胜过前面两件。我给你三天，等它织好，我们马上举行婚礼。
    - id: ch04
      title: 阳光与月光织成的长袍
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 听完王子的话，劳弗想起自己和母亲曾怎样伤害利奈克。她还能指望利奈克忘掉往事，第三次救她吗？利奈克也没有忘记过去。若不是哥哥再三恳求，她或许真会让劳弗自己设法脱身。最后，她还是滑出树干，再次坐到织机前。劳弗看见她出现，终于松了一口气。
        - id: ch04-b02
          speaker: narrator
          text: 绿绸闪闪发亮。利奈克用针尖挑来太阳的光，又挑来月亮的光，把它们一起织进花纹。那图案是世上从未有人见过的。可这件长袍做得很慢。第三天早晨，她正在最后一朵花上缝最后几针，王子忽然走了进来。
        - id: ch04-b03
          speaker: narrator
          text: 利奈克急忙起身，想从王子身边绕过去，逃回树中。层层丝绸却缠住了她。她险些摔倒，幸好王子及时伸手扶住。
        - id: ch04-b04
          speaker: greek_prince
          text: 我早就觉得，这里有些事情不对劲。告诉我，你究竟是谁，又是从哪里来的？
        - id: ch04-b05
          speaker: narrator
          text: 利奈克说出自己的名字，也把全部遭遇讲给他听。王子听完，愤怒地转向劳弗。他斥责劳弗用恶毒的谎言欺骗自己，说她理应受尽耻辱而死。
        - id: ch04-b06
          speaker: narrator
          text: 劳弗跪倒在王子脚下，苦苦求他饶命。
        - id: ch04-b07
          speaker: laufer
          text: 这一切都是我母亲的错。是她把我冒充成利奈克公主，不是我的主意。我只对您撒过一个谎，说三件长袍是我织的。只凭这件事，我不该被处死。
          emotion: fearful
        - id: ch04-b08
          speaker: narrator
          text: 劳弗还跪在地上，西格尔德便走了进来。他也请求希腊王子放过劳弗。希腊王子答应宽恕她，不过有一个条件，利奈克必须同意嫁给他。
        - id: ch04-b09
          speaker: lineik
          text: 等我的继母死后，我才会答应。她让每一个接近她的人都遭了殃。
        - id: ch04-b10
          speaker: narrator
          text: 到了这一步，劳弗终于说出全部真相。布劳沃尔从来不是什么国王的妻子，而是一个女妖。她从邻国的一座王宫里偷走劳弗，把她当成自己的女儿养大。不仅如此，她还是一个女巫。西格尔德和利奈克的父亲出海时，正是她施展黑魔法，掀起风暴，弄沉了那艘船。
        - id: ch04-b11
          speaker: narrator
          text: 那些无故失踪的朝臣也全是布劳沃尔害死的。她趁着夜色吃掉他们，盼着有一天能消灭全国百姓，再让这片土地住满与她一样的男女妖怪。
    - id: ch05
      title: 三对新婚夫妇
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 西格尔德和希腊王子立刻集结军队，向布劳沃尔的王城进发。他们来得太突然，根本没人来得及报信。就算有人事先知道，城里也没有力量抵抗。强壮的男子大多已经被布劳沃尔吃掉，其余的人又受到一种说不清的恐惧折磨，早就暗中逃走了。
        - id: ch05-b02
          speaker: narrator
          text: 军队轻易擒住布劳沃尔。第二天，她在集市上被斩首。随后，两位王子率军返回希腊。
        - id: ch05-b03
          speaker: narrator
          text: 利奈克再也没有理由推迟婚事。她嫁给希腊王子的那一天，西格尔德也娶了那位真正的公主。劳弗留在利奈克身边，成了她的朋友和姐妹。后来，众人为劳弗找到一位出身高贵的丈夫。三对夫妻从此幸福地生活在一起，直到生命终结。
        - id: ch05-b04
          speaker: narrator
          text: 这个故事选自珀斯蒂翁在维也纳出版的《冰岛童话》。
