audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 清楚从容，像在为听众介绍一本童话集的篇目
        timbre: 温暖明亮
        pace: 舒缓，每个篇名之间留出自然停顿
        pitch: 中音
    prince:
      display_name: 王子
      tts:
        delivery: 诚恳有礼，历经磨难后更显坚定
        timbre: 清朗
        pace: 中速
        pitch: 中音
    king_father:
      display_name: 老国王
      tts:
        delivery: 威严强硬，怒意来得猛烈
        timbre: 浑厚
        pace: 稍慢
        pitch: 中低音
    faithful_servant:
      display_name: 忠仆
      tts:
        delivery: 忠诚谨慎，危急时仍沉着恳切
        timbre: 坚实温和
        pace: 中速
        pitch: 中音
    crow_one:
      display_name: 第一只乌鸦
      tts:
        delivery: 阴郁低声，像在预告不祥之事
        timbre: 沙哑
        pace: 稍慢
        pitch: 中低音
    crow_two:
      display_name: 第二只乌鸦
      tts:
        delivery: 冷静肯定，语气神秘
        timbre: 沙哑低沉
        pace: 稍慢
        pitch: 低音
    pigeon_one:
      display_name: 第一只鸽子
      tts:
        delivery: 郑重而神秘
        timbre: 柔和清晰
        pace: 中速
        pitch: 中高音
    pigeon_two:
      display_name: 第二只鸽子
      tts:
        delivery: 郑重而神秘
        timbre: 柔和略低
        pace: 中速
        pitch: 中音
    pigeon_three:
      display_name: 第三只鸽子
      tts:
        delivery: 郑重而神秘
        timbre: 轻柔明亮
        pace: 中速
        pitch: 中高音
    eagle_one:
      display_name: 第一只鹰
      tts:
        delivery: 庄严冷峻，像在宣告命运
        timbre: 洪亮
        pace: 稍慢
        pitch: 中低音
    eagle_two:
      display_name: 第二只鹰
      tts:
        delivery: 庄严冷峻，像在宣告命运
        timbre: 坚实
        pace: 稍慢
        pitch: 中低音
    eagle_three:
      display_name: 第三只鹰
      tts:
        delivery: 庄严冷峻，像在宣告命运
        timbre: 清锐
        pace: 稍慢
        pitch: 中音
    messenger:
      display_name: 国王的使者
      tts:
        delivery: 恭敬正式，传令时字句清楚
        timbre: 明亮
        pace: 中速
        pitch: 中音
    nurse:
      display_name: 老乳母
      tts:
        delivery: 慈爱稳重，话里带着指引
        timbre: 苍老柔和
        pace: 稍慢
        pitch: 中低音
    miller:
      display_name: 磨坊主
      tts:
        delivery: 朴实忧愁，求问时满怀期待
        timbre: 粗厚
        pace: 中速
        pitch: 中低音
    sister_one:
      display_name: 大姐
      tts:
        delivery: 端庄诚恳，带一点困惑
        timbre: 温和
        pace: 中速
        pitch: 中音
    sister_two:
      display_name: 二姐
      tts:
        delivery: 端庄诚恳，带一点困惑
        timbre: 清柔
        pace: 中速
        pitch: 中高音
    sister_three:
      display_name: 三妹
      tts:
        delivery: 端庄诚恳，带一点困惑
        timbre: 明净
        pace: 中速
        pitch: 中高音
    stream:
      display_name: 小溪
      tts:
        delivery: 清亮灵动，发怒时骤然变得凶猛
        timbre: 清澈流动
        pace: 中速
        pitch: 中高音
    luck_mother:
      display_name: 好运神的母亲
      tts:
        delivery: 亲切笃定，指点来客时有条不紊
        timbre: 苍老温暖
        pace: 稍慢
        pitch: 中低音
    lucky_luck:
      display_name: 好运神
      tts:
        delivery: 坦率从容，回答问题时胸有成竹
        timbre: 沉稳明朗
        pace: 中速偏慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 王子违命求亲
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王膝下只有一个儿子。王子十八岁时，邻国挑起战争，国王不得不亲自率兵出征。他把国家交给儿子代管，临行前却严令王子，在父亲回来以前绝不能成婚。岁月一年年过去，王子认真料理国事，连娶妻的念头也不曾有过。到了二十五岁生日那天，他忽然觉得，身边有位妻子或许很不错。这个念头在心里转来转去，叫他越来越急切。可他还记得父王的命令，又耐着性子等了一阵。国王出征整整十年后，王子终于召集群臣，带着大队随从去寻找新娘。他根本不知道该往哪里走，只好漫无目的地转了二十天，竟一头闯进父王的军营。
        - id: ch01-b02
          speaker: narrator
          text: 国王见到儿子十分欢喜，父子俩有许多话要问答。可一听王子没有在家等候，反倒出来求亲，他立刻发了火。
        - id: ch01-b03
          speaker: king_father
          text: 你爱去哪里就去哪里，可我手下的人，一个也不许跟你走！
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 国王的随从全都留下了，只有一名忠仆不肯离开王子。主仆二人翻山越岭，来到一个叫金城的地方。这里的国王有位美丽的女儿。王子很快听说了她的美貌，从此坐立不安，非见她一面不可。金城的人见他相貌英俊、举止又讨喜，对他十分亲厚。王子不愿耽误，马上向公主求婚，她的父母也满心欢喜地答应了。婚礼当即举行，宴饮和庆祝足足延续了一个月。月底，新婚夫妇踏上漫长的归途，第一晚便住进一家客店。屋里所有人都睡着了，只有忠仆睁着眼睛，整夜替大家守望。约莫半夜，三只乌鸦飞上屋顶，谈起了这对新婚夫妇。
        - id: ch01-b05
          speaker: crow_one
          text: 今晚来的两个人真是般配。可惜，他们这么快就要没命了。
        - id: ch01-b06
          speaker: crow_two
          text: 可不是吗。明天正午，他们的马车驶上金溪桥时，桥就会断。谁听见这些话又说出去，双腿就会变成石头，一直石化到膝盖。
        - id: ch01-b07
          speaker: narrator
          text: 乌鸦刚飞走，三只鸽子又落了下来。
        - id: ch01-b08
          speakers: [pigeon_one, pigeon_two, pigeon_three]
          ensemble: chorus
          text: 就算他们平安过桥，也逃不过一死。国王会派一辆油漆簇新的马车来接他们。两人一上车，狂风就会把车卷进云里，再狠狠摔回地面。谁泄露这些话，身子就会石化到腰间。
        - id: ch01-b09
          speaker: narrator
          text: 鸽子飞走后，三只鹰占了它们的位置。
        - id: ch01-b10
          speakers: [eagle_one, eagle_two, eagle_three]
          ensemble: chorus
          text: 如果他们连断桥和马车都躲过了，国王还会送来两件金线绣成的华服。他们一穿上，就会烧成灰。谁把这件事告诉别人，便会从头到脚变成石头。
        - id: ch01-b11
          speaker: narrator
          text: 第二天清早，众人吃过早饭，谈起夜里的梦。忠仆等到最后才开口。
        - id: ch01-b12
          speaker: faithful_servant
          text: 尊贵的殿下，我梦见，接下来的路上，只要您事事听我的，我们就能平安回家。若是不听，大家一定会送命。我的梦从不骗人，请您答应我吧。
        - id: ch01-b13
          speaker: prince
          text: 别为一个梦这样紧张。梦不过是浮云。不过，为了让你安心，我答应照你的话做。
        - id: ch01-b14
          speaker: narrator
          text: 他们继续赶路，正午来到金溪桥头。
        - id: ch01-b15
          speaker: faithful_servant
          text: 殿下，我们把车留下，走一小段路吧。前面不远就是城镇，可以再买一辆。这辆车的轮子已经坏了，恐怕撑不了多久。
        - id: ch01-b16
          speaker: narrator
          text: 王子把马车仔细看了一遍，并不觉得它像忠仆说的那样不牢靠。但他既然答应了，就没有反悔。众人下车，把一件件行李驮到马背上。王子和新娘步行过桥，忠仆则骑着马蹚过溪水，顺便让马匹饮了水、洗了澡。他们全都安然到达对岸，又在近旁的城镇买了一辆新车。可刚走出不远，国王的使者便迎了上来。
        - id: ch01-b17
          speaker: messenger
          text: 陛下赐给殿下一辆华美的马车，好让您回到自己的国土、见到臣民时，有与身份相称的排场。
        - id: ch01-b18
          speaker: narrator
          text: 王子高兴得说不出话，忠仆却要先验车。
        - id: ch01-b19
          speaker: faithful_servant
          text: 殿下，让我先仔细看看。车若妥当，您再坐进去。要是不妥，我们还是乘自己的车。
        - id: ch01-b20
          speaker: narrator
          text: 王子没有反对。忠仆检查完毕，摇了摇头。
        - id: ch01-b21
          speaker: faithful_servant
          text: 这辆车外表有多漂亮，里面就有多糟糕。
        - id: ch01-b22
          speaker: narrator
          text: 忠仆当场把那辆漂亮马车砸得粉碎，众人仍坐着自己买来的车前行。终于到了边境，又有一名使者等在那里。他送来两件华丽长袍，说这是国王赐给王子和新娘的，请两人穿上，好风风光光地进入国都。忠仆苦苦哀求王子，千万别碰衣服。他一刻也不肯让王子安生，直到获准把两件长袍都毁掉才罢休。
    - id: ch02
      title: 忠仆化为石头
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 老国王发现自己的诡计全落了空，气得发狂。儿子还活着，又已经成婚，按照这个国家的法律，他必须把王位让给儿子。老国王越想越不甘心，很想知道王子究竟是怎样逃过重重劫难的，便装出亲热的样子。
        - id: ch02-b02
          speaker: king_father
          text: 亲爱的儿子，你平安回来，我当然高兴。可我实在想不通，我送你的漂亮马车和华美长袍哪里不好，你为什么让人全毁了？
        - id: ch02-b03
          speaker: prince
          text: 父王，东西被毁，我也很恼火。可我的仆人请求由他安排一路上的事，我答应了。他说，要是不听他的，我们绝不可能安全回家。
        - id: ch02-b04
          speaker: narrator
          text: 老国王暴跳如雷，立刻召集御前会议，判忠仆死刑。王宫前的广场竖起绞架，忠仆被押出来，判决也当众宣读了。绳索将要套上脖子时，他请求说几句遗言。
        - id: ch02-b05
          speaker: faithful_servant
          text: 回来的路上，我们第一夜住在一家客店。那晚我没有睡，一直守着大家。
        - id: ch02-b06
          speaker: narrator
          text: 忠仆先把三只乌鸦说过的话一一讲了出来。他每说一句，身子就石化一分。等乌鸦的预言讲完，石头已经没到膝盖。王子看见他的清白已经得到证明，急忙高声叫他住口，可忠仆根本不理会。他接着讲鸽子预言的马车，石头一路升到腰间。最后，他又说出鹰对两件长袍的警告。等整个故事讲完，他也从头到脚成了一尊石像。
        - id: ch02-b07
          speaker: narrator
          text: 王子失去忠仆，心里悲痛万分。最折磨他的是，仆人没有犯下罪过，恰恰是这份至死不改的忠心，才让他遭到厄运。王子下定决心，要走遍天涯海角。一天找不到让忠仆复活的方法，他就一天不肯停下来休息。宫里那位曾抚养他的老乳母听完全部打算，接过了照料公主的责任。
        - id: ch02-b08
          speaker: nurse
          text: 孩子，你前面的路很长。找到好运神以前，千万别回来。要是他也帮不了你，世上就再没人能帮你了。
        - id: ch02-b09
          speaker: narrator
          text: 王子就这样出发寻找好运神。他不停地走，出了自己的国境，又在一片树林里转了整整三天，途中连一个活物也没见到。第三天将尽时，他来到一条河边，看见岸旁立着一座大磨坊，便在那里过了一夜。第二天早晨，他正要独自离开，磨坊主叫住了他。
        - id: ch02-b10
          speaker: miller
          text: 尊贵的殿下，您一个人要去哪里？
        - id: ch02-b11
          speaker: narrator
          text: 王子把自己的遭遇告诉了他。磨坊主听完，恳求王子替自己问一件事。
        - id: ch02-b12
          speaker: miller
          text: 我的磨坊很好，机器一样不少，送来磨的谷物也很多。可我为什么还是穷得快活不下去，天天都为下一顿发愁？请殿下替我问问好运神吧。
        - id: ch02-b13
          speaker: narrator
          text: 王子答应下来，又走了三天。第三天深夜，他来到一座小城，可城中四处不见灯火。他几乎穿过整座城，也没找到一户可以投宿的人家。直到城镇尽头，他才远远看见一扇亮着的窗。王子径直走过去，只见屋里有三位姑娘正在玩游戏。她们把他迎进门，给他端来晚饭，又收拾好一间屋子让他安睡。第二天早晨，三姐妹问起他的去处。听过他的故事，她们也有一件事想请他询问。
        - id: ch02-b14
          speakers: [sister_one, sister_two, sister_three]
          ensemble: chorus
          text: 尊贵的王子，我们三个都过了三十岁，品行端正，勤劳又不难看，可为什么从没有人上门求婚？也请您替我们问问好运神。
        - id: ch02-b15
          speaker: narrator
          text: 王子答应了她们，继续赶路。他进入一片大森林，从清早走到黑夜，又从黑夜走到天明，才接近另一头。那里有一条美丽的小溪。它不像别的溪水那样流动，只停在原地，还忽然开口说话。
    - id: ch03
      title: 找到好运神
      blocks:
        - id: ch03-b01
          speaker: stream
          text: 王子殿下，什么事把您带到这片荒野？我在这里流了一百多年，可从来没人经过。
        - id: ch03-b02
          speaker: prince
          text: 你先把水分开，让我走过去。到了对岸，我就告诉你。
        - id: ch03-b03
          speaker: narrator
          text: 溪水马上退向两边。王子走过河床，鞋底都没沾湿。他一到对岸，就依约讲出自己的故事。
        - id: ch03-b04
          speaker: stream
          text: 那也请您问问好运神。我这样清澈明亮，水流又快，为什么水里连一条鱼也没有，别的活物也没有？
        - id: ch03-b05
          speaker: narrator
          text: 王子答应替小溪问个明白，随后继续赶路。等他彻底走出那片辽阔的森林，又沿着一座美丽的山谷走了许久，终于看见一间灯心草盖顶的小屋。一路跋涉到这里，他已经累得抬不起脚，便推门进去休息。小屋里处处洁净，东西都收拾得整整齐齐。一位神情快活、模样忠厚的老妇人正坐在炉火旁边。
        - id: ch03-b06
          speaker: prince
          text: 早安，老妈妈。
        - id: ch03-b07
          speaker: luck_mother
          text: 愿好运跟着你，孩子。你怎么会来到这里？
        - id: ch03-b08
          speaker: prince
          text: 我在找好运神。
        - id: ch03-b09
          speaker: luck_mother
          text: 那你找对地方了，我就是他的母亲。他去葡萄园掘土了。你带上这两把铁锹，找到他就动手帮忙，一个字也别说。现在是十一点。等他吃午饭，你坐在旁边一起吃。饭后，他会问你是谁。到时候只管说出所有烦恼，他什么都会回答。
        - id: ch03-b10
          speaker: narrator
          text: 老妇人指明道路，王子找到好运神，完全照她的吩咐去做。两人吃过午饭，躺下来休息。好运神忽然开口。
        - id: ch03-b11
          speaker: lucky_luck
          text: 你到底是什么人？来到这里以后，为什么一句话也不说？
        - id: ch03-b12
          speaker: prince
          text: 我不是哑巴。我是一个不幸的王子，我的忠仆变成了石头。我想知道怎样才能救活他。
        - id: ch03-b13
          speaker: lucky_luck
          text: 你来救他，做得对。他值得你为他做任何事。回去吧。你到家时，妻子正好会生下一个男孩。从孩子的小手指取三滴血，用草叶把血抹在仆人的手腕上，他就能复活。
        - id: ch03-b14
          speaker: narrator
          text: 王子道过谢，又问起森林里的小溪。
        - id: ch03-b15
          speaker: prince
          text: 那条溪水很好，可里面没有鱼，也没有其他活物。这是为什么？
        - id: ch03-b16
          speaker: lucky_luck
          text: 因为从来没人淹死在里面。过溪时千万当心，尽量到了对岸再告诉它。不然，你自己可能就是第一个送命的人。
        - id: ch03-b17
          speaker: prince
          text: 我还住过三位姑娘的家。她们有礼貌，勤快又漂亮，却从没人来求婚。为什么呢？
        - id: ch03-b18
          speaker: lucky_luck
          text: 因为她们总把扫出来的尘土迎着太阳泼出去。
        - id: ch03-b19
          speaker: prince
          text: 还有一位磨坊主。他的磨坊很大，机器最好，谷物也多，可他为什么穷得过不下去？
        - id: ch03-b20
          speaker: lucky_luck
          text: 因为他把一切都留给自己，从不分给需要的人。
        - id: ch03-b21
          speaker: narrator
          text: 王子记下所有答案，友好地告别好运神，启程回家。
    - id: ch04
      title: 归途上的答案
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王子回到小溪边，溪水立刻问他有没有好消息。
        - id: ch04-b02
          speaker: prince
          text: 等我过去以后，再告诉你。
        - id: ch04-b03
          speaker: narrator
          text: 溪水向两边退去。王子走过河床，又爬到岸上最高的一块岩石，才停下来喊道。
        - id: ch04-b04
          speaker: prince
          text: 小溪，听好了！好运神说，除非有人淹死在你的水里，否则你永远不会有任何活物！
        - id: ch04-b05
          speaker: narrator
          text: 话音未落，溪水猛地涨了起来，转眼漫过两岸，一直冲到王子攀住的岩石。浪头扑得那么高，水沫飞过了他的头顶。王子紧紧抓住岩石，怎么也不松手。溪水一连三次扑向他，每一次都差一点，却始终够不着，只好退回原来的河道。王子这才从岩石上爬下来，在太阳底下把湿衣服晒干，再次上路。他又在磨坊住了一夜，把好运神的答案告诉磨坊主。后来经过那座小城，他也去见了三姐妹，叮嘱她们往后别再把尘土迎着太阳泼出去。
        - id: ch04-b06
          speaker: narrator
          text: 王子还没有到家，几个窃贼就牵着一匹偷来的骏马，想蹚过那条小溪。他们走到水中央，溪水突然暴涨，把窃贼和马全都卷走了。从那以后，溪水里有了活物，还成了附近鱼最多的溪流。磨坊主也开始把财物分给穷苦的人，渐渐成了一个十分善良的人。后来，他越来越富，连自己究竟有多少财产都弄不清了。三姐妹听从王子的劝告，不再迎着太阳泼尘土。不到一个星期，每个人都有男子上门求婚。
    - id: ch05
      title: 石像复生
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 王子终于回到家，发现妻子果然刚刚生下一个健康的男孩。他一刻也没有耽搁，马上刺破婴儿的小手指，等血珠流出来，取下三滴，再用一根草叶把血抹在石像的两只手腕上。石像忽然浑身一颤，紧接着发出一声巨响，裂成了七块。那位忠仆便从碎石中走出来，活生生的，安然无恙。
        - id: ch05-b02
          speaker: narrator
          text: 老国王看到这一切，气得口吐白沫，双眼发直。他猛地扑倒在地，就此死去。
        - id: ch05-b03
          speaker: narrator
          text: 忠仆依旧留在王室主人身边，尽心服侍了他一辈子。要是他们两人都还没有死，那么直到今天，他仍在为主人效劳。
        - id: ch05-b04
          speaker: narrator
          text: 这个故事选自《匈牙利童话》。
