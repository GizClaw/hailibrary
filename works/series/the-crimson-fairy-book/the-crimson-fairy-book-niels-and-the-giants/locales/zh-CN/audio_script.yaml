audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    niels:
      display_name: 尼尔斯
      tts:
        delivery: 聪明大胆，遇险时机敏，偶尔带着顽皮和自信
        timbre: 年轻清亮
        pace: 明快
        pitch: 中高音
    rasmus:
      display_name: 拉斯穆斯
      tts:
        delivery: 朴实谨慎，得意时毫不掩饰
        timbre: 结实温厚
        pace: 中速
        pitch: 中音
    father:
      display_name: 父亲
      tts:
        delivery: 谦和本分，说话老实拘谨
        timbre: 苍老温厚
        pace: 舒缓
        pitch: 中低音
    mother:
      display_name: 母亲
      tts:
        delivery: 虔诚坚定，旅途疲惫时仍保持朴实
        timbre: 柔和苍老
        pace: 舒缓
        pitch: 中音
    giant_1:
      display_name: 第一个巨人
      tts:
        delivery: 粗暴易怒，嗓门洪亮
        timbre: 粗哑厚重
        pace: 偏慢
        pitch: 低音
    giant_2:
      display_name: 第二个巨人
      tts:
        delivery: 暴躁强硬，受冤时怒气冲冲
        timbre: 浑厚粗粝
        pace: 中速
        pitch: 低音
    giant_3:
      display_name: 第三个巨人
      tts:
        delivery: 狡猾而威严，比同伴冷静，却同样凶狠
        timbre: 深沉有压迫感
        pace: 沉稳
        pitch: 低音
    princess:
      display_name: 公主
      tts:
        delivery: 端庄敏锐，态度坚定，最后流露温柔笑意
        timbre: 清澈柔和
        pace: 从容
        pitch: 中高音
    traveler:
      display_name: 旅人
      tts:
        delivery: 饱经风霜，说话简洁实在
        timbre: 干涩低沉
        pace: 偏慢
        pitch: 中低音
    peter:
      display_name: 彼得
      tts:
        delivery: 随和直率，想到什么便说什么
        timbre: 朴实清晰
        pace: 中速
        pitch: 中音
    steward:
      display_name: 管家
      tts:
        delivery: 起初例行公事，面对公主时恭敬谨慎
        timbre: 清楚稳重
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 荒原上的神枪手
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 日德兰有一片辽阔的荒原。那里满地是沙，风又刮得凶，连树都长不起来。从前，一对夫妇带着两个儿子住在那里，靠一间小屋和几只羊过活。哥哥叫拉斯穆斯，弟弟叫尼尔斯。拉斯穆斯愿意像父亲一样，一辈子好好牧羊。尼尔斯却只想当猎人，非弄到一杆枪、学会射击不可。
        - id: ch01-b02
          speaker: narrator
          text: 那不过是一杆老式的前装燧发枪，还是用燧石打火的，尼尔斯却把它当成难得的宝贝，珍爱得不得了。他背着枪四处走，看见什么都想开上一枪。练到后来，他成了远近闻名的神枪手，连从没见过他的人都听说了他的本领。有人觉得，除了枪法，他也没什么了不起。后来发生的事情，却让他们有了十足的理由改口。
        - id: ch01-b03
          speaker: narrator
          text: 两兄弟的父母都是虔诚的天主教徒。上了年纪以后，母亲忽然想去罗马拜见教皇。家里人觉得没多大必要，可最后还是依了她。他们卖掉羊，锁上门，步行去罗马。尼尔斯当然带上了枪。
        - id: ch01-b04
          speaker: rasmus
          text: 你带枪干什么？光是别的行李，就够我们背的了。
        - id: ch01-b05
          speaker: narrator
          text: 尼尔斯怎么也舍不得，只管背着枪上了路。那正是一年里最热的时候。中午热得不能走，夜里赶路，他们又怕迷路或撞上强盗。一天傍晚，他们来到森林边的一家客店。
        - id: ch01-b06
          speaker: rasmus
          text: 今晚就住在这里吧。
        - id: ch01-b07
          speaker: niels
          text: 这是什么主意！白天因为热不能走，晚上又停下来。照这样下去，我们什么时候才到得了罗马？
        - id: ch01-b08
          speaker: narrator
          text: 拉斯穆斯不想再走，两位老人却赞成尼尔斯。
        - id: ch01-b09
          speaker: niels
          text: 夜里并不黑，月亮也快升起来了。我们在客店问清方向，再继续走。
        - id: ch01-b10
          speaker: narrator
          text: 他们又赶了一段路，来到林中一小片空地，却发现道路分成两岔。这里没有路牌，客店的人也没说该走哪一条。
        - id: ch01-b11
          speaker: rasmus
          text: 现在怎么办？早知道就该留在客店里。
        - id: ch01-b12
          speaker: niels
          text: 没关系。夜里很暖和，我们等到天亮就行。一个人守到半夜，再叫醒另一个人。
        - id: ch01-b13
          speaker: narrator
          text: 拉斯穆斯先守，其他人躺下睡了。森林寂静极了，鹿、狐狸和别的野兽踏过落叶，发出沙沙声。月亮升起来后，拉斯穆斯偶尔还能瞧见它们。一头大雄鹿走到近前，他拿起尼尔斯的枪，一枪把它打倒。
        - id: ch01-b14
          speaker: niels
          text: 什么声音？
        - id: ch01-b15
          speaker: rasmus
          text: 我刚刚打死了一头雄鹿！
          emotion: happy
        - id: ch01-b16
          speaker: niels
          text: 那算不了什么。我常常打中麻雀，麻雀可难打多了。
        - id: ch01-b17
          speaker: narrator
          text: 快到午夜，尼尔斯接班，拉斯穆斯睡了。夜里越来越冷，尼尔斯只好来回走着取暖。他很快发现森林边缘就在附近，便爬上一棵树，越过树梢望向外面的旷野。远处有一堆火，三个巨人围坐在火边，正忙着喝肉汤、吃牛肉。他们的身躯大得吓人，汤匙像铁锹，餐叉像干草叉。他们用那些家伙从面前的一口巨锅里舀起整桶整桶的汤，又叉出一大块一大块的肉。
        - id: ch01-b18
          speaker: narrator
          text: 尼尔斯先是吃惊，也有点害怕。可巨人离得还远，真走过来，他还能躲进灌木丛。看了一阵，他的胆子又回来了。他滑下树，取来枪，打算捉弄巨人。
        - id: ch01-b19
          speaker: narrator
          text: 尼尔斯重新爬上树，仔细瞄准。一个巨人刚把大块肉送到嘴边，他便开了枪。子弹猛击叉柄，叉尖没有进嘴，反倒扎中了巨人的下巴。
        - id: ch01-b20
          speaker: giant_1
          text: 别跟我耍花样！你为什么打我的叉子，害我扎伤自己？
          emotion: angry
        - id: ch01-b21
          speaker: giant_2
          text: 我碰都没碰你的叉子。别故意找我吵架。
        - id: ch01-b22
          speaker: giant_1
          text: 你自己看看！难道是我觉得好玩，故意把叉子扎进下巴？
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: 两个巨人为了这件事越吵越凶，各自都叫嚷着要立刻跟对方打一架。第三个巨人赶紧出来劝和，他们这才重新坐下吃饭。争吵的时候，尼尔斯已经装好了弹药。第二个巨人刚要把一块美味送进嘴里，枪声再次响起，他手里的餐叉一下炸成了十几片。这个巨人比第一个更加暴怒，双方从斗嘴变成动手只差一步，第三个只得再次拦住他们。
        - id: ch01-b24
          speaker: giant_3
          text: 别犯傻！我们三个得一起对付这个国家的国王，怎么能自己打起来？这事本来就难，要是不团结，更是一点希望也没有。坐下把饭吃完。我坐在你们中间，谁也别再怪谁。
        - id: ch01-b25
          speaker: narrator
          text: 尼尔斯离得远，听不见这些话，可看手势也猜得到。他只觉得这场面好玩极了。
        - id: ch01-b26
          speaker: niels
          text: 第三回准有好运。我还得再开一枪。
        - id: ch01-b27
          speaker: narrator
          text: 第三颗子弹打中第三个巨人的餐叉，把它截成了两段。
        - id: ch01-b28
          speaker: giant_3
          text: 我要是像你们两个一样蠢，现在也会大发脾气。不过我已经看出不对了。我这就去找找，到底是谁在捉弄我们。
        - id: ch01-b29
          speaker: narrator
          text: 这个巨人看得很准。尼尔斯飞快下树，想藏进灌木丛，双脚才落地，巨人已经逼到眼前。
        - id: ch01-b30
          speaker: giant_3
          text: 站着别动！不然我一脚踩下去，你可剩不了多少。
          emotion: angry
        - id: ch01-b31
          speaker: narrator
          text: 尼尔斯只得认输，被巨人带回火堆旁。
        - id: ch01-b32
          speaker: giant_3
          text: 你这样捉弄我们，本来不配活命。不过你枪法很好，正能替我们办件事。附近有座城堡，国王的女儿住在那里。我们正跟国王交战，想掳走公主，好压倒他。可城堡守得太严，我们进不去。
        - id: ch01-b33
          speaker: giant_3
          text: 我们施了魔法，让城堡里所有活物都沉睡不醒，只有一只小黑狗还醒着。只要它不睡，我们就还是进不去。我们一开始翻墙，它会听见声音，叫声又会把所有人惊醒。现在有了你，我们能把你送到合适的地方。你赶在它叫以前开枪，把它打死。那样一来，就没人能阻止我们抓走公主。办成这件事，我们不但饶你一命，还会重重赏你。

    - id: ch02
      title: 城堡里的酒角与宝剑
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 尼尔斯不得不答应。三个巨人立刻带他来到城堡外。四周的城墙高得惊人，连巨人也摸不到顶。
        - id: ch02-b02
          speaker: niels
          text: 这么高，我怎么上去？
        - id: ch02-b03
          speaker: giant_3
          text: 很容易。我把你扔上去。
        - id: ch02-b04
          speaker: niels
          text: 还是算了吧。我可能掉到另一边，摔断腿，甚至折断脖子。到时候，可没人替你们打那只狗。
        - id: ch02-b05
          speaker: giant_3
          text: 不会。墙顶很宽，还长满深草。你落下去，就像掉在羽毛床上一样软。
        - id: ch02-b06
          speaker: narrator
          text: 尼尔斯没有别的办法，只能信他，让巨人把自己抛上去。他落在墙顶的深草里，双脚稳稳着地，果然毫发无伤。可那只小黑狗听见咚的一声，立刻从狗窝里冲了出来。它刚刚张开嘴，眼看就要叫出声，尼尔斯已经开了枪。小狗当场倒下，再也没有发出声音。
        - id: ch02-b07
          speaker: giant_3
          text: 下到里面去，想办法给我们开门。
        - id: ch02-b08
          speaker: narrator
          text: 尼尔斯从城墙内侧下到院子里，正要朝外门走去，却先来到了城堡大厅的入口。大厅的门敞开着，里面灯火辉煌，却一个人也看不见。他走进去，站在厅中四下打量。墙上挂着一柄没有剑鞘的巨剑，剑的下面是一只镶着银边的大酒角。尼尔斯走近细看，发现银边上刻着几行字。他把酒角从墙上取下来，拿在手中转过一面，看见上面写着一首短诗。
        - id: ch02-b09
          speaker: narrator
          text: 饮尽角中美酒，便能挥动壁上宝剑。持剑伸张正义，赢得王家少女爱恋。
        - id: ch02-b10
          speaker: narrator
          text: 尼尔斯拔开银塞，喝了几口。可他伸手取剑，剑竟纹丝不动。他只好挂回酒角，继续往城堡深处走。
        - id: ch02-b11
          speaker: niels
          text: 就让那些巨人多等一会儿吧。
        - id: ch02-b12
          speaker: narrator
          text: 不久，他走进一间卧房。一位美丽的公主正在床上沉睡，床边的桌上放着一条金边手帕。尼尔斯拿起手帕，撕成两半，把一半放进口袋，另一半仍旧留在桌上。他又看见地板上有一双金线绣成的鞋，便拿走其中一只，也塞进自己的口袋。
        - id: ch02-b13
          speaker: narrator
          text: 回到大厅，尼尔斯再次取下酒角。他想，也许非得喝光里面所有的酒，才能移动宝剑。这一次，他把酒喝得一滴不剩。再伸手时，那柄巨剑果然变得轻若无物。他觉得全身充满力量，好像什么事都办得到，甚至能跟城外那三个巨人交战。巨人们等了这么久，一定正在纳闷，他为什么还没有开门。
        - id: ch02-b14
          speaker: narrator
          text: 尼尔斯认定，用宝剑杀死巨人，正是伸张正义。至于赢得公主的爱，一个穷牧羊人的儿子可不敢指望。他来到城门，发现那里有一大一小两扇门，只把小门打开。
        - id: ch02-b15
          speakers: [giant_1, giant_2, giant_3]
          ensemble: chorus
          text: 不能开大门吗？这扇门这么小，我们几乎进不去。
        - id: ch02-b16
          speaker: niels
          text: 门闩太重，我拉不动。你们稍微弯腰，从小门进来就行。
        - id: ch02-b17
          speaker: narrator
          text: 第一个巨人果然低下身子，弯着腰走进小门。他还没来得及把背直起来，尼尔斯已经挥剑一扫，巨人的脑袋立刻飞了出去。尸体倒下来，堵在门边。可酒角里的美酒给了尼尔斯一身神力，他轻轻松松就把尸体推到旁边。第二个巨人随后弯腰进门，也受到了完全相同的招待。
        - id: ch02-b18
          speaker: narrator
          text: 第三个巨人动作慢了一些，尼尔斯便隔着门催他。
        - id: ch02-b19
          speaker: niels
          text: 快一点！你准是三个里面最老的，动作才这么慢。我不能久等，还得赶紧回到自己人身边。
        - id: ch02-b20
          speaker: narrator
          text: 第三个巨人也弯腰进来，于是得到了同样的招待。看来，故事里的巨人是没有公平较量的机会了！
        - id: ch02-b21
          speaker: narrator
          text: 天快亮了。尼尔斯怕家人正在找他，没有留下来看城堡里会怎样，只带着宝剑跑回森林。大家还在睡，他叫醒他们，继续赶路。对于夜里的奇遇，他只字不提。家人问剑从哪儿来，他只朝城堡那边一指。
        - id: ch02-b22
          speaker: niels
          text: 就在那个方向。
        - id: ch02-b23
          speaker: narrator
          text: 大家以为剑是他捡来的，便不再追问。尼尔斯离开城堡时，随手把门关在身后。门砰地一声合拢，把守门人惊醒了。他一睁眼，就看见三个无头巨人叠在院子里，几乎不敢相信自己的眼睛，更猜不出发生了什么。整座城堡很快都被惊动，人人围着这件怪事议论。大家认出三具尸体正是国王的大敌，可他们为什么会在院子里，又怎么会丢了脑袋，谁也说不明白。
        - id: ch02-b24
          speaker: narrator
          text: 人们接着发现，酒角里的酒已经喝光，墙上的宝剑也不见了。公主则告诉他们，自己的金边手帕少了一半，金线绣花鞋也少了一只。巨人是怎样被杀死的，现在多少有了线索，可动手的人究竟是谁，仍然是个大谜。掌管城堡的老骑士认定，那必定是一位年轻骑士。他杀死巨人后，已经立刻赶去王宫，向国王求娶公主。这个猜想听着很有道理。可信使赶到王宫再回来，却说那里没有一个人知道此事。
        - id: ch02-b25
          speaker: princess
          text: 无论如何，我们得找到他。父王既然把诺言刻在酒角上，他若愿意娶我，我就不能有失荣誉，拒绝这门婚事。
        - id: ch02-b26
          speaker: narrator
          text: 公主召来父亲手下最睿智的大臣，请他们一起想办法。大臣们提出了不少主意，其中一个是，在大路旁盖一所房子，门上写明，谁肯讲述自己一生的经历，谁就能免费住上三夜。房子照这个办法盖好了。来往的旅人在那里说了许多离奇故事，公主一一听过，却始终没有一个人提起那三个巨人。

    - id: ch03
      title: 没有走完的罗马之路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这段日子里，尼尔斯一家仍一步步朝罗马走去。秋天过去，冬天刚来，他们走到一片高耸入云的山脉脚下。
        - id: ch03-b02
          speakers: [father, mother]
          ensemble: duo
          text: 我们一定要翻过这些山吗？不是冻死，就是会被大雪埋掉。
        - id: ch03-b03
          speaker: niels
          text: 那边有人来了。我们问问他，去罗马该怎么走。
        - id: ch03-b04
          speaker: narrator
          text: 那个旅人告诉他们，除了翻山，没有别的路。
        - id: ch03-b05
          speakers: [father, mother]
          ensemble: duo
          text: 罗马还有多远？
        - id: ch03-b06
          speaker: narrator
          text: 两位老人走了太久，已经疲惫不堪。旅人抬起一只脚，给他们看鞋底。那鞋底磨得像纸一样薄，中间还破了一个洞。
        - id: ch03-b07
          speaker: traveler
          text: 我离开罗马时，这双鞋还是新的。现在看看它吧。你们离罗马有多远，它已经说明白了。
        - id: ch03-b08
          speaker: narrator
          text: 两位老人听了这番话，彻底泄了气，再也不想走完去罗马的路，只盼能尽快回到丹麦。可冬天赶路十分艰难，道路又糟糕，他们回去花的时间，比来时还要长。走了不知多久，他们终于又望见那片森林。上次从这里经过时，一家人曾在林中露宿了一夜。
        - id: ch03-b09
          speaker: rasmus
          text: 这是怎么回事？我们上次经过以后，这里盖起了一所大房子。
        - id: ch03-b10
          speaker: peter
          text: 还真是。今晚就住在这里吧。
        - id: ch03-b11
          speakers: [father, mother]
          ensemble: duo
          text: 不行，我们这样的人住不起。房钱一定太贵了。
        - id: ch03-b12
          speaker: narrator
          text: 等他们看见门上的字，一家人全都高兴起来。原来只要讲述自己的经历，就能在这里免费住宿。主人热情地接待他们，又处处殷勤照料，两位老人从没受过这种款待，反倒很不自在。等大家有时间歇过脚、恢复了精神，公主的管家便来到他们面前，要听听这一家人的故事。
        - id: ch03-b13
          speaker: steward
          text: 你们看过门上的字了。请告诉我，你们是谁，又有过什么经历。
        - id: ch03-b14
          speaker: father
          text: 哎呀，我没有什么要紧的事可讲。要不是小儿子，我们无论如何也不敢冒昧来打扰。
        - id: ch03-b15
          speaker: steward
          text: 那不要紧。只要肯讲一讲自己的一生，你们就是这里的贵客。
        - id: ch03-b16
          speaker: father
          text: 好吧，好吧，我就讲。不过真的没什么可说。我和妻子一辈子住在日德兰北部的荒原，日子一直没有变化。直到去年，她忽然很想去罗马，我们才带着两个儿子离开家。可离罗马还远得很，我们便掉头回来，现在正在回家的路上。这就是我的全部经历。两个儿子从小到大也一直跟我们住在一起，所以他们同样没有更多的故事可讲。
        - id: ch03-b17
          speaker: rasmus
          text: 我有故事。我们南下时，在附近的森林睡过一夜，我还打死了一头雄鹿。
          emotion: happy
        - id: ch03-b18
          speaker: narrator
          text: 管家听惯了不重要的小事，觉得没必要再问，便报告公主，说新来的客人无话可讲。
        - id: ch03-b19
          speaker: princess
          text: 你问过每一个人吗？
        - id: ch03-b20
          speaker: steward
          text: 没有逐个问。不过那位父亲说，别人知道的不会比他更多。
        - id: ch03-b21
          speaker: princess
          text: 你做事越来越马虎了。我亲自去问他们。

    - id: ch04
      title: 公主找到了英雄
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 公主刚走进房间，尼尔斯便认出了她，吓得心里一沉。他立刻认定，这所房子是个圈套，专门寻找那个从城堡带走宝剑、绣鞋和半条手帕的人。身份一旦败露，他准没有好下场。于是，他也讲了一个跟家人差不多的故事。尼尔斯并不太在乎讲得是真是假，讲完还以为自己躲过了所有麻烦。偏偏就在这时，拉斯穆斯忽然插嘴。
        - id: ch04-b02
          speaker: rasmus
          text: 尼尔斯，你漏了一件事。我打死雄鹿的那天夜里，你不是在附近捡到过一柄剑吗？
        - id: ch04-b03
          speaker: princess
          text: 那柄剑在哪里？
        - id: ch04-b04
          speaker: steward
          text: 我知道。他们进来时，我看见他把剑放在哪儿了。
        - id: ch04-b05
          speaker: narrator
          text: 管家去取剑，尼尔斯赶紧盘算自己能不能逃走。他还没想好，管家已经回来了。公主一眼就认出了那柄剑。
        - id: ch04-b06
          speaker: princess
          text: 这柄剑，你是从哪里得到的？
        - id: ch04-b07
          speaker: narrator
          text: 尼尔斯一声不响。他只在心里猜，一个穷牧羊人的儿子救了公主，却又从她的卧房拿走几件东西，通常会受到什么惩罚。
        - id: ch04-b08
          speaker: princess
          text: 搜一搜，看他身上还有什么。
        - id: ch04-b09
          speaker: narrator
          text: 尼尔斯只得让管家搜身。一个口袋里装着金线绣花鞋，另一个口袋里是半条金边手帕。
        - id: ch04-b10
          speaker: princess
          text: 这就够了，不必再问。立刻去请我的父王。
        - id: ch04-b11
          speaker: niels
          text: 请放我走吧。不管怎么说，我给你带来的好处，至少也和坏处一样多。
        - id: ch04-b12
          speaker: princess
          text: 谁说你带来坏处了？你得留在这里，等我父王过来。
        - id: ch04-b13
          speaker: narrator
          text: 公主说这句话时，脸上带着微笑。尼尔斯看见那个笑容，这才有了几分希望，觉得自己的下场也许并不坏。他又想起酒角上刻着的那首诗，心里更加踏实了一点。只是诗的最后一句，说他会赢得王家少女的爱，这件事还是美好得叫他不敢相信。
        - id: ch04-b14
          speaker: narrator
          text: 国王一到，事情很快便定了下来。公主愿意嫁给救了她的人，尼尔斯也愿意迎娶公主。没过几天，婚礼的钟声便响了起来。到了那时，尼尔斯已经受封为伯爵。他换下牧羊人儿子的旧衣，穿起全套华服，看上去英俊极了，模样一点也不输给在场的任何一位贵人。
        - id: ch04-b15
          speaker: narrator
          text: 不久，老国王去世，尼尔斯继承了王位。至于他的父母后来留在宫中，还是回到日德兰的荒原，又或是坐着四匹马拉的马车去了罗马，那些记载尼尔斯统治岁月的史官，竟然全都忘了写下来。
