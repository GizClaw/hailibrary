  chapters:
    - id: ch01
      title: The Road Through the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: On one of the great moors of Jutland, the sandy ground and strong wind kept trees from growing. A man and his wife lived there in a little house with their sheep and two sons. The elder son was Rasmus, and the younger was Niels.
        - id: ch01-b02
          speaker: narrator
          text: Rasmus was content to tend sheep, just as his father had. Niels wanted to hunt. Once he got an old muzzle-loading flintlock, he practiced on everything he saw. In time he became such a wonderful shot that people had heard of him in places he had never visited. Some thought shooting was his only gift, but before long they had reason to change their minds.
        - id: ch01-b03
          speaker: narrator
          text: The boys' parents were good Catholics. As they grew old, their mother decided that she wanted to go to Rome and see the Pope. The others saw little use in such a journey, but at last she had her way. They sold the sheep, shut the house, and set off for Rome on foot. Niels carried his gun.
        - id: ch01-b04
          speaker: rasmus
          text: What do you need that for? We already have enough to carry.
        - id: ch01-b05
          speaker: narrator
          text: Niels could not be happy without his gun. Rasmus's warning made no difference, and Niels carried it with him all the same.
        - id: ch01-b06
          speaker: narrator
          text: They started in the hottest part of summer. At midday the heat stopped them from traveling, but at night they feared losing the road or meeting robbers. Then, one evening just before sunset, they reached an inn at the edge of a forest.
        - id: ch01-b07
          speaker: rasmus
          text: We should spend the night here.
        - id: ch01-b08
          speaker: niels
          text: That makes no sense. It's too hot to walk by day, and now you want us to sit still all night. At this pace, we'll never reach Rome.
        - id: ch01-b09
          speaker: narrator
          text: Rasmus did not want to continue, but the two old people agreed with Niels.
        - id: ch01-b10
          speaker: niels
          text: The nights aren't dark, and the moon will be up soon. We can ask at the inn which road to follow.
        - id: ch01-b11
          speaker: narrator
          text: They went on through the forest for some time. At last they reached a small clearing where the road divided in two. There was no signpost to guide them, and now they realized that no one at the inn had said which branch they should follow.
        - id: ch01-b12
          speaker: rasmus
          text: What do we do now? We should have stayed at the inn.
        - id: ch01-b13
          speaker: niels
          text: Nothing is lost. It's a warm night, so we'll wait here until morning. One of us can watch until midnight, then wake the other.
        - id: ch01-b14
          speaker: narrator
          text: Rasmus took the first watch while the others slept. The forest was very quiet. He heard deer, foxes, and other animals moving through the leaves. Once the moon rose, he sometimes caught sight of them. When a great stag came close, he picked up Niels's gun and fired.
        - id: ch01-b15
          speaker: niels
          text: What was that?
        - id: ch01-b16
          speaker: rasmus
          text: I just shot a stag!
          emotion: happy
        - id: ch01-b17
          speaker: niels
          text: That's nothing. I've often shot a sparrow, and a sparrow is much harder to hit.
        - id: ch01-b18
          speaker: narrator
          text: Midnight was near. Niels began his watch, and Rasmus went to sleep.

    - id: ch02
      title: Three Giants at Supper
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The night grew colder, so Niels walked around to keep warm. He discovered that the edge of the forest was close. From the top of a tree, he could see the open land beyond it.
        - id: ch02-b02
          speaker: narrator
          text: A fire burned a short distance away. Three giants sat beside it, eating broth and beef. Their spoons were as large as spades, and their forks as big as hayforks. With them, they lifted buckets of broth and great pieces of meat from an enormous pot on the ground.
        - id: ch02-b03
          speaker: narrator
          text: At first the sight startled Niels, and he was rather afraid. Then he reminded himself that the giants were a good distance away. If they came closer, he could easily slip into the bushes and hide. He watched them for a while, and little by little his fear passed. At last he slid down the tree, fetched his gun, and climbed back up, determined to play a few tricks on them.
        - id: ch02-b04
          speaker: narrator
          text: Back in the tree, Niels aimed carefully. One giant was raising a large piece of meat to his mouth when the gun went off. The bullet struck the fork handle, driving the point into the giant's chin.
        - id: ch02-b05
          speaker: first_giant
          text: Stop your tricks! Why did you hit my fork and make me stab myself?
          emotion: angry
        - id: ch02-b06
          speaker: second_giant
          text: I never touched it. Don't start a quarrel with me.
        - id: ch02-b07
          speaker: first_giant
          text: Look at the fork! Do you think I stuck it into my own chin for fun?
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: The two giants grew so angry that each challenged the other to fight right there beside the fire. Before they came to blows, the third giant stepped in as peacemaker. He quieted them, and at last they sat down and began eating again.
        - id: ch02-b09
          speaker: narrator
          text: While they argued, Niels reloaded. As the second giant lifted a choice bite toward his mouth, Niels fired again. This time the fork shattered into a dozen pieces.
        - id: ch02-b10
          speaker: narrator
          text: The second giant was even angrier than the first. Their shouting was just about to turn into fighting when the third stepped between them again.
        - id: ch02-b11
          speaker: third_giant
          text: Don't be fools. We need all three of us if we're going to defeat this country's king. That will be hard enough even if we stay together. If we fight each other, we have no hope. Sit down and finish eating. I'll sit between you, so neither can blame the other.
        - id: ch02-b12
          speaker: narrator
          text: Niels was too far away to hear their words, but their gestures told him enough. He found it all very amusing.
        - id: ch02-b13
          speaker: niels
          text: Third time lucky. I'll take one more shot.
        - id: ch02-b14
          speaker: narrator
          text: The third giant's fork caught the next bullet and snapped in two.
        - id: ch02-b15
          speaker: third_giant
          text: If I were as foolish as you two, I'd lose my temper too. But now I understand what's happening. I'm going to find whoever is playing these tricks on us.
        - id: ch02-b16
          speaker: narrator
          text: The third giant had been watching carefully and had worked out where the shots came from. Niels climbed down as quickly as he could, hoping to reach the bushes before he was seen. But the moment his feet touched the ground, the giant was already upon him.
        - id: ch02-b17
          speaker: third_giant
          text: Stay there. If I put my foot on you, there won't be much left.
        - id: ch02-b18
          speaker: narrator
          text: Niels surrendered, and the giant carried him back to the fire.
        - id: ch02-b19
          speaker: third_giant
          text: You don't deserve mercy. Still, a shot like you could be useful, so we'll spare you if you help us. Nearby stands a castle where the king's daughter lives. We're at war with the king, and we mean to carry off the princess. But the castle is guarded too well for us to enter.
        - id: ch02-b20
          speaker: third_giant
          text: Our magic has put every living creature inside to sleep except one little black dog. Whenever we climb the wall, it hears us. One bark wakes everyone. We can put you where you'll have a clear shot. Kill the dog before it barks, and no one can stop us from taking the princess. Do that, and we'll free you and reward you well.
        - id: ch02-b21
          speaker: narrator
          text: Niels understood that refusing would do him no good. He had to agree to the plan, and without wasting any time, the three giants carried him toward the castle.

    - id: ch03
      title: The Sword and the Horn
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A very high rampart surrounded the castle. Even the giants could not reach its top.
        - id: ch03-b02
          speaker: niels
          text: How am I supposed to get over that?
        - id: ch03-b03
          speaker: third_giant
          text: Easily. I'll throw you up.
        - id: ch03-b04
          speaker: niels
          text: No, thank you. I might fall down the other side or break my leg or neck. Then your little dog won't get shot.
        - id: ch03-b05
          speaker: third_giant
          text: You won't be hurt. The top is wide and covered with long grass. You'll land as softly as if you fell on a feather bed.
        - id: ch03-b06
          speaker: narrator
          text: Niels had to take the giant at his word. He allowed himself to be thrown high into the air and came down on both feet, quite unhurt, in the long grass. But his landing made a thump. The little black dog heard it and rushed straight out of its kennel. Its mouth was just opening for the first bark when Niels fired. The dog fell dead before it could make a sound.
        - id: ch03-b07
          speaker: third_giant
          text: Climb down inside and open the gate for us.
        - id: ch03-b08
          speaker: narrator
          text: Niels climbed down from the rampart into the courtyard. He started across it toward the outer gate, but on the way he passed the entrance to the castle's great hall. The door stood wide open. Bright light filled the whole room, though Niels could not see a single person inside. He turned aside and went in to look around.
        - id: ch03-b09
          speaker: narrator
          text: On one wall hung a huge sword with no sheath. Directly beneath it stood a great drinking horn decorated with silver. Niels went closer. He noticed letters engraved around the silver rim, so he took the horn down, turned it in his hands, and read the inscription.
        - id: ch03-b10
          speaker: narrator
          text: Whoever drinks the wine I hold can wield the sword that hangs above. Let him use it for the right and win a royal maiden's love.
        - id: ch03-b11
          speaker: narrator
          text: Niels pulled out the silver stopper and drank some wine. Then he tried to take down the sword, but it would not move. He hung the horn back up and walked farther into the castle.
        - id: ch03-b12
          speaker: niels
          text: The giants can wait a little.
        - id: ch03-b13
          speaker: narrator
          text: Soon he found a room where a beautiful princess lay asleep. A handkerchief with a gold border rested on the table beside her. Niels tore it in half, put one piece in his pocket, and left the other on the table. A pair of gold-embroidered slippers lay on the floor. He put one slipper in his pocket too.
        - id: ch03-b14
          speaker: narrator
          text: Then he returned to the hall and lifted the horn again.
        - id: ch03-b15
          speaker: niels
          text: Maybe I must drink every drop before I can move the sword.
        - id: ch03-b16
          speaker: narrator
          text: He raised the horn to his lips and drank until not a drop remained. When he reached for the sword again, he could lift and wield it with the greatest ease. Strength seemed to fill him. He felt ready for anything, even a fight with the three giants who must be wondering why the gate was still shut. Killing them would surely count as using the sword for the right. As for winning the princess's love, Niels thought that was more than a poor sheep farmer's son could ever expect.
        - id: ch03-b17
          speaker: narrator
          text: At the castle gate, Niels found one large door and one small door. He opened the smaller one.
        - id: ch03-b18
          speakers: [first_giant, second_giant, third_giant]
          ensemble: chorus
          text: Can't you open the big door? We can hardly squeeze through this one.
        - id: ch03-b19
          speaker: niels
          text: The bars are too heavy for me. Bend down a little and you'll fit through here.
        - id: ch03-b20
          speaker: narrator
          text: The first giant bent low and squeezed through the little doorway. Before he had time to straighten his back, Niels swept the sword through the air, and off came the giant's head. The body fell in the entrance. Yet the wine had made Niels so strong that he pushed it aside without trouble. The second giant bent down and entered next. Niels greeted him in exactly the same way.
        - id: ch03-b21
          speaker: narrator
          text: The third giant was slower.
        - id: ch03-b22
          speaker: niels
          text: Hurry up! You must be the oldest if you move so slowly. I can't wait here. I need to get back to my family.
        - id: ch03-b23
          speaker: narrator
          text: The third giant came in and was served in the same way. So the story tells us that the giants were not given fair play.
        - id: ch03-b24
          speaker: narrator
          text: By then the first light of day was appearing. Niels thought his family might already be awake and searching for him. Instead of waiting to see what would happen when the castle awoke, he took the sword and ran back toward the forest as fast as he could. He found his parents and Rasmus still sleeping in the clearing. Niels woke them, and the four travelers set out again.
        - id: ch03-b25
          speaker: narrator
          text: Niels said nothing about his adventures. When they asked where the sword came from, he only pointed toward the castle.
        - id: ch03-b26
          speaker: niels
          text: Somewhere over that way.
        - id: ch03-b27
          speaker: narrator
          text: They supposed he had found it and asked no more.

    - id: ch04
      title: The Unknown Hero
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When Niels left the castle, he shut the door behind him. It closed with such a crash that the porter woke. He could scarcely believe his eyes when he found three headless giants piled in the courtyard. He stared at them, unable to imagine what could have happened while the castle slept.
        - id: ch04-b02
          speaker: narrator
          text: The porter raised the alarm, and soon the whole castle was awake. Everyone crowded around and wondered at the sight. They quickly recognized the dead giants as the king's greatest enemies, but how those enemies had entered the courtyard and lost their heads was a complete mystery. Then someone discovered that the drinking horn was empty and the great sword was gone. The princess reported that half of her gold-edged handkerchief had vanished from her table, along with one of her embroidered slippers.
        - id: ch04-b03
          speaker: narrator
          text: That explained a little about how the giants had died, but their killer remained a mystery.
        - id: ch04-b04
          speaker: old_knight
          text: I believe a young knight did this. He must have gone straight to the king to claim the princess's hand.
        - id: ch04-b05
          speaker: narrator
          text: The old knight was in charge of the castle. He reasoned that anyone who had emptied the horn could wield the missing sword, and anyone who had killed the giants had earned the princess's hand. His answer sounded likely to everyone. But when they sent a messenger to the royal court, the man returned with news that no young knight had appeared there. No one at court knew anything about the matter.
        - id: ch04-b06
          speaker: princess
          text: We must find him. If he is willing to marry me, honor will not allow me to refuse him after what my father had engraved on the horn.
        - id: ch04-b07
          speaker: narrator
          text: The princess met with her father's wisest advisers and asked how the unknown hero might be found. Among their suggestions was a house built beside the highway, with a special promise written over its door. Any traveler who told the story of his life could stay there free for three nights. The house was built, and traveler after traveler accepted its welcome. The princess heard many strange histories, but not one person mentioned the three giants.

    - id: ch05
      title: The Journey Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Meanwhile, Niels and his family kept walking toward Rome. Autumn passed. As winter began, they reached the foot of a vast mountain range that seemed to rise into the sky.
        - id: ch05-b02
          speakers: [father, mother, rasmus, niels]
          ensemble: chorus
          text: Must we cross those mountains? We'll freeze to death or be buried in snow.
        - id: ch05-b03
          speaker: niels
          text: A man is coming. Let's ask him the way to Rome.
        - id: ch05-b04
          speaker: narrator
          text: They asked, and the traveler told them there was no other road.
        - id: ch05-b05
          speakers: [father, mother]
          ensemble: duo
          text: Is Rome still far away?
        - id: ch05-b06
          speaker: narrator
          text: The old people were worn out by the long journey. The traveler raised one foot and showed them the sole of his shoe. It was as thin as paper, with a hole in the middle.
        - id: ch05-b07
          speaker: traveler
          text: These shoes were new when I left Rome. Look at them now. That should tell you how far away you are.
        - id: ch05-b08
          speaker: narrator
          text: The sight of that ruined shoe discouraged the old people completely. They gave up every thought of finishing the journey to Rome. Now they only wished to return to Denmark as quickly as they could. But winter had arrived, and the roads were bad. Going home took even longer than coming south. After many weary days, they finally saw the forest where they had once slept beneath the trees.
        - id: ch05-b09
          speaker: rasmus
          text: What's this? Someone has built a large house since we passed this way.
        - id: ch05-b10
          speaker: peter
          text: So they have. Let's spend the night there.
        - id: ch05-b11
          speakers: [father, mother]
          ensemble: duo
          text: We can't afford it. A place like that will cost too much for people like us.
        - id: ch05-b12
          speaker: narrator
          text: Then they read the promise above the door. All four were delighted to learn that they could earn a free night simply by telling their stories. The people of the house welcomed them warmly. Servants saw to every need and treated them with such care that the old couple felt quite overwhelmed. After the travelers had eaten and had time to rest, the princess's steward came in to collect the story that paid for their lodging.
        - id: ch05-b13
          speaker: steward
          text: You saw the words over the door. Tell me who you are and what has happened in your life.
        - id: ch05-b14
          speaker: father
          text: Dear me, I have nothing important to tell. We would never have been bold enough to trouble you if our younger son hadn't brought us here.
        - id: ch05-b15
          speaker: steward
          text: That doesn't matter. You're welcome here if you'll tell me your story.
        - id: ch05-b16
          speaker: father
          text: Very well, though there is little to say. My wife and I spent our whole lives on a moor in North Jutland. Last year she wished to go to Rome, so we set out with our two sons. We turned back long before reaching it, and now we're going home. That's my entire story. Our sons have always lived with us, so they have nothing more to add.
        - id: ch05-b17
          speaker: rasmus
          text: I do. On our way south, we slept in the woods near here, and I shot a stag.
        - id: ch05-b18
          speaker: narrator
          text: By then the steward was used to hearing tales in which nothing much happened. A boy shooting a stag seemed no different, so he decided there was no point questioning the family any further. He went to the princess and reported that the latest travelers had nothing important to tell.
        - id: ch05-b19
          speaker: princess
          text: Did you question every one of them?
        - id: ch05-b20
          speaker: steward
          text: Not one by one. Their father said the rest could tell me no more than he had.
        - id: ch05-b21
          speaker: princess
          text: You are becoming careless. I will speak to them myself.

    - id: ch06
      title: The Princess Finds Niels
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The moment the princess entered, Niels recognized her. He was badly frightened. He thought the house must be a trap for the person who had fled with the sword, the slipper, and half the handkerchief. If she discovered him, he was sure he would suffer for it.
        - id: ch06-b02
          speaker: narrator
          text: When his turn came, Niels told much the same plain story as his father. He left out everything that had happened during his midnight watch. Niels was not always particular about telling the whole truth, and when the princess moved on, he believed he had escaped every further question. Then Rasmus suddenly spoke.
        - id: ch06-b03
          speaker: rasmus
          text: You left something out, Niels. Remember the sword you found near here on the night I shot the stag?
        - id: ch06-b04
          speaker: princess
          text: Where is that sword?
        - id: ch06-b05
          speaker: steward
          text: I know. I saw where he put it when they arrived.
        - id: ch06-b06
          speaker: narrator
          text: The steward went to fetch it. While he was gone, Niels wondered if he could escape. Before he could decide, the steward returned. The princess recognized the sword at once.
        - id: ch06-b07
          speaker: princess
          text: Where did you get this?
        - id: ch06-b08
          speaker: narrator
          text: Niels said nothing. He wondered what punishment awaited a poor sheep farmer's son who had rescued a princess but also taken things from her bedroom.
        - id: ch06-b09
          speaker: princess
          text: Search him and see what else he is carrying.
        - id: ch06-b10
          speaker: narrator
          text: Niels had to submit. From one pocket came the gold-embroidered slipper. From another came the missing half of the gold-edged handkerchief.
        - id: ch06-b11
          speaker: princess
          text: That is enough. We need ask no more questions. Send for my father, the king, at once.
        - id: ch06-b12
          speaker: niels
          text: Please let me go. Whatever harm I did, I did you just as much good.
        - id: ch06-b13
          speaker: princess
          text: Who said you had done any harm? You must stay until my father arrives.
        - id: ch06-b14
          speaker: narrator
          text: The way the princess smiled as she spoke gave Niels his first hope that matters might not go badly after all. Then he remembered every line engraved around the silver rim of the horn. Those words encouraged him still more, though the final promise about winning a royal maiden's love seemed much too wonderful to believe.
        - id: ch06-b15
          speaker: narrator
          text: When the king arrived, the whole matter was soon settled. The princess was willing to marry the young man who had saved her, and Niels was just as willing to marry the princess. Only a few days later, wedding bells rang across the country. By that time Niels had been made an earl. Dressed in his new robes, the sheep farmer's son looked as handsome as any nobleman among them.
        - id: ch06-b16
          speaker: narrator
          text: Before long the old king died, and Niels ruled after him.
        - id: ch06-b17
          speaker: narrator
          text: But whether his father and mother stayed with him, returned to the moor in Jutland, or rode to Rome in a carriage and four, every historian of his reign forgot to say.
