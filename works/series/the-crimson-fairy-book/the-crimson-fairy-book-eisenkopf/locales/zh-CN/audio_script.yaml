audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    peter:
      display_name: 彼得
      tts:
        delivery: 真诚有礼，遇险时急切，做出承诺时认真
        timbre: 清亮年轻
        pace: 中速
        pitch: 中音
    father:
      display_name: 彼得的父亲
      tts:
        delivery: 慈爱务实，富裕后多了几分自信
        timbre: 苍老温和
        pace: 舒缓
        pitch: 中低音
    old_master:
      display_name: 老主人
      tts:
        delivery: 平静和善，言语简洁
        timbre: 干涩沧桑
        pace: 从容
        pitch: 低音
    eisenkopf:
      display_name: 铁头
      tts:
        delivery: 强硬逼人，追索诺言时冷酷不容辩解
        timbre: 坚硬洪亮
        pace: 偏慢
        pitch: 低音
    first_old_woman:
      display_name: 第一位老妇人
      tts:
        delivery: 慈祥机警，催促时干脆
        timbre: 柔和苍老
        pace: 中速
        pitch: 中低音
    second_old_woman:
      display_name: 第二位老妇人
      tts:
        delivery: 热情周到，始终留心危险
        timbre: 温暖苍老
        pace: 中速
        pitch: 中低音
    third_old_woman:
      display_name: 第三位老妇人
      tts:
        delivery: 睿智严谨，叮嘱清楚有力
        timbre: 沉稳苍老
        pace: 舒缓
        pitch: 低音
    white_house_woman:
      display_name: 白屋老妇人
      tts:
        delivery: 含蓄好客，说话平和
        timbre: 成熟匀净
        pace: 中速
        pitch: 中低音
    quick_ear:
      display_name: 灵耳
      tts:
        delivery: 敏锐热心，反应轻快
        timbre: 轻快警醒
        pace: 明快
        pitch: 中高音
    worlds_weight:
      display_name: 压世
      tts:
        delivery: 厚重自信，怀疑别人时有些粗鲁
        timbre: 深沉宽厚
        pace: 中速
        pitch: 低音
    iron_strong:
      display_name: 铁强
      tts:
        delivery: 果断有力，习惯以老大自居
        timbre: 洪亮坚定
        pace: 从容
        pitch: 低音
  chapters:
    - id: ch01
      title: 坚果与诺言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位老人只有彼得这一个儿子，疼爱得不得了。可家里实在太穷，父子俩常常连饭也吃不饱。后来老人又病倒了，日子就更难过了。他只好把儿子叫到床边。
        - id: ch01-b02
          speaker: father
          text: 孩子，我已经没有吃的可以给你了。你得到外面去，自己挣饭吃。找到什么活儿就做什么，只要用心干，对主人忠诚，你的辛苦总会有回报。
        - id: ch01-b03
          speaker: narrator
          text: 彼得在背囊里装上一块黑面包，背好背囊，又拿了一根粗木棍，就这样出门碰运气去了。他走了很久，可没有一个人肯雇他。后来，他遇见一位老人，便摘下帽子，客客气气地问候。
        - id: ch01-b04
          speaker: peter
          text: 早安。
        - id: ch01-b05
          speaker: old_master
          text: 早安。你这是要去哪儿？
        - id: ch01-b06
          speaker: peter
          text: 我正在各地找活儿做。
        - id: ch01-b07
          speaker: old_master
          text: 那就留下吧，我这里有不少活儿。
        - id: ch01-b08
          speaker: narrator
          text: 彼得答应下来。活儿不难，他只要照料两匹马和一头牛。说好的一年，竟然只有三天，所以很快就到了发工钱的时候。老主人给他一颗坚果，还愿意再雇他一年。可彼得想家了，也觉得一颗坚果太不值钱。随便一小枚钱币都比它强，毕竟坚果长在树上，自己想摘多少就能摘多少。不过老主人一直待他很好，彼得把这些念头留在心里，没有说出来，只向老人告别上路。
        - id: ch01-b09
          speaker: narrator
          text: 离家越近，他越不好意思。拿一颗坚果回去有什么用？连一片熏肉都换不来。彼得索性坐在石头上，用牙把它咬开，打算自己吃掉。
        - id: ch01-b10
          speaker: narrator
          text: 谁知果壳刚裂，里面竟走出数不清的马、牛和羊，长长的队伍仿佛一直排到世界尽头。彼得从没见过这样的景象，吓得直搓手。他哪有地方安顿这么多牲口？又该拿它们怎么办？他只能站在那里，惊恐地望着它们。正在这时，铁头走了过来。
        - id: ch01-b11
          speaker: eisenkopf
          text: 年轻人，你遇上什么麻烦了？
        - id: ch01-b12
          speaker: peter
          text: 麻烦大了，朋友！我的工钱就是这颗坚果。可我一咬开，里面便跑出这一大群牲口。我根本不知道怎样收拾！
        - id: ch01-b13
          speaker: eisenkopf
          text: 那就听我的。你答应这一生都不娶妻，我替你把它们赶回坚果。
        - id: ch01-b14
          speaker: narrator
          text: 彼得正急得没法可想，就算条件更难也会答应。他立刻许下诺言。铁头吹了声口哨，所有牲口便调过头，争着往坚果里钻，急得差点互相绊倒。最后一只脚才缩进去，两半果壳就紧紧合上了。彼得把坚果装进口袋，继续回家。
        - id: ch01-b15
          speaker: narrator
          text: 一进家门，他又把坚果咬开。马、羊和牛再次涌出来，好像比头一回还多。父亲望着门外的一大片牲口，半天说不出话。
        - id: ch01-b16
          speaker: father
          text: 这些牲口……你究竟是从哪儿弄来的？
          emotion: surprised
        - id: ch01-b17
          speaker: narrator
          text: 彼得把全部经过都告诉父亲，也没有隐瞒自己答应铁头的事。第二天，他们卖掉一部分牲口，用钱买下周围的田地和园圃。才过几个月，老人便成了全村最富有的人，日子好得不得了。他经手的东西，好像样样都能变成金子。
    - id: ch02
      title: 婚宴上的追赶
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，父子俩坐在果园里，看自家的牲口在草地上吃草。老人忽然转向彼得。
        - id: ch02-b02
          speaker: father
          text: 彼得，你年纪不小了，也该想想娶妻的事了。
        - id: ch02-b03
          speaker: peter
          text: 可是父亲，我不能娶妻。我亲口答应过铁头。
        - id: ch02-b04
          speaker: father
          text: 人哪天不许几个诺，又有谁真会把这种话当回事？铁头不乐意，也得由你成婚。咱们马厩里的灰马日夜备着鞍。他要是出现，你骑上马就走，世上没人追得上。等危险过去了，你再回来，咱们还会像海里的两条鱼那样自在。
        - id: ch02-b05
          speaker: narrator
          text: 彼得果真找了一位漂亮的褐肤姑娘，姑娘也答应嫁给他。婚礼那天，全村人都来赴宴。乐曲正欢，舞也跳得最热闹，铁头忽然从窗外探进脸来。
        - id: ch02-b06
          speaker: eisenkopf
          text: 哦嗬，兄弟，这里好热闹啊。难道是在办婚宴？奇怪，我怎么记得有人答应过我，一辈子都不会娶妻呢？
        - id: ch02-b07
          speaker: narrator
          text: 彼得根本不等他说完。他一看见铁头，就像风一样冲进马厩，跃上那匹灰马。转眼之间，他已经把婚宴、乐声和跳舞的人群都抛在身后，翻过山岭逃远了，铁头却仍在后面一路紧追。
        - id: ch02-b08
          speaker: narrator
          text: 他们不停地跑。彼得穿过阳光永远照不进去的密林，越过乘船也要一整天才能渡完的大河，又爬上山坡如同玻璃一样溜滑的高山。灰马驮着他，接连跑过七七四十九个国度，铁头始终在后面追赶，一刻也没有停下。最后，彼得才在一位老妇人的屋前勒住缰绳。
        - id: ch02-b09
          speaker: peter
          text: 您好，母亲。
        - id: ch02-b10
          speaker: first_old_woman
          text: 你好，孩子。你怎么跑到世界尽头来了？
        - id: ch02-b11
          speaker: peter
          text: 我在逃命，母亲。我要逃到世界之外的世界去，因为铁头就在身后追我。
        - id: ch02-b12
          speaker: first_old_woman
          text: 那就进来吃点东西，暖暖身子。铁头离这里还有七英里，我的小狗就会叫，你来得及走。
        - id: ch02-b13
          speaker: narrator
          text: 彼得进屋暖了身，又吃又喝。没过多久，小狗突然叫起来。
        - id: ch02-b14
          speaker: first_old_woman
          text: 快走，孩子！现在非走不可了！
        - id: ch02-b15
          speaker: narrator
          text: 彼得快得胜过闪电。可他刚要跨上马背，老妇人又叫住了他。
        - id: ch02-b16
          speaker: first_old_woman
          text: 等一等。把这块餐巾和这只小饼带上，放在袋里好拿的地方。
        - id: ch02-b17
          speaker: narrator
          text: 彼得收好礼物，挥手谢过老妇人，又像风一样飞驰而去。
    - id: ch03
      title: 烈火另一边
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得绕来绕去，又穿过七七四十九个国度。前面的森林比他走过的更密，河流比先前更宽，山岭也比先前更加溜滑。他骑了很久，终于来到第二位老妇人的屋子。
        - id: ch03-b02
          speaker: peter
          text: 您好，母亲。
        - id: ch03-b03
          speaker: second_old_woman
          text: 你好，孩子。你到世界尽头来找什么？
        - id: ch03-b04
          speaker: peter
          text: 我在逃命，母亲。我要去世界之外的世界，铁头就在我脚后追着。
        - id: ch03-b05
          speaker: second_old_woman
          text: 进来吃些东西吧。铁头还在七英里外，我的小狗就会叫。到那以前，你只管躺下来安心歇着。
        - id: ch03-b06
          speaker: narrator
          text: 老妇人进厨房烤了许多小饼，多得彼得吃一个月也吃不完。他连四分之一还没吃掉，小狗就开始叫了。
        - id: ch03-b07
          speaker: second_old_woman
          text: 该走了，孩子。先把这些小饼和这块餐巾收进袋里，要放在伸手就能拿到的地方。
        - id: ch03-b08
          speaker: narrator
          text: 彼得向她道谢，骑马飞奔而去。他再次越过七七四十九个国度，来到第三位老妇人家。她也像前两位一样欢迎彼得，给他吃的，让他休息。等负责望风的小狗一叫，彼得立刻跳起来要走。老妇人把同样的临行礼物交给他，又仔细嘱咐起来。
        - id: ch03-b09
          speaker: third_old_woman
          text: 我知道，两位姐姐各给了你一只小饼和一块餐巾。现在你一共有三份。听仔细了。一直朝前骑七天七夜，第八天早晨会看见一场大火。拿三块餐巾抽打火焰三次，火就会分开。骑进缺口，走到正中央，再用左手把三只小饼抛到身后。
        - id: ch03-b10
          speaker: narrator
          text: 彼得谢过老妇人，每句话都照着做。他接连骑了七天七夜。第八天早晨，一片无边的大火挡住去路，左右两边除了火焰什么也看不见。他取出三块餐巾，朝火里抽了三下。烈火立刻分开，在两侧竖起两堵高墙。
        - id: ch03-b11
          speaker: narrator
          text: 彼得骑进缺口，到了正中间，就用左手把三只小饼扔到背后。小饼落地，每一只都变成一条巨犬。他为它们取名压世、铁强和灵耳。三条狗认彼得作了主人，望着他欢喜地长嗥。
        - id: ch03-b12
          speaker: narrator
          text: 彼得回身拍拍它们，却看见铁头已经站在火边。幸好缺口早已合上，铁头根本过不来。
        - id: ch03-b13
          speaker: eisenkopf
          text: 站住，你这个不守诺言的家伙！这一次算你逃掉，等我下次捉住你，看你还能往哪里跑！
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: 铁头索性躺在火边守着，要看看接下来会发生什么。彼得知道眼下不用再怕他了，便慢慢向前骑，来到一座白色小屋。屋里，一位灰发妇人正在纺线，窗边还坐着一位美丽的姑娘，正梳理她的金发。
        - id: ch03-b15
          speaker: white_house_woman
          text: 孩子，你来这里做什么？
        - id: ch03-b16
          speaker: peter
          text: 我想找个地方做事，母亲。
        - id: ch03-b17
          speaker: white_house_woman
          text: 那就留在这里吧，我正需要一个仆人。
        - id: ch03-b18
          speaker: peter
          text: 我很愿意。
        - id: ch03-b19
          speaker: narrator
          text: 彼得从此过得很快活。他每天播种、犁地，有时也带三条狗去打猎。他不管带回什么猎物，金发姑娘都能烹调得很好。
    - id: ch04
      title: 姑娘打开烈火
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一天，老妇人进城买面粉，屋里只剩彼得和姑娘。两人聊了起来。姑娘问他家乡在哪里，又问他到底是怎样穿过那场烈火的。彼得把全部经历说给她听，还讲到自己怎样依照老妇人的吩咐，用三块餐巾抽打火焰，让烈火从中分开。
        - id: ch04-b02
          speaker: narrator
          text: 姑娘听得很认真，心里却不确定这件事是真是假。彼得下田以后，她偷偷进了他的房间，拿走餐巾，沿着自己熟悉的山路赶到火边。
        - id: ch04-b03
          speaker: narrator
          text: 她抽到第三下，烈火真的分开了。铁头一直守在那里，就等着这样的机会。他冲过缺口，突然站在姑娘面前。姑娘几乎吓死，好不容易才回过神，立刻转身逃回家，铁头就在后面紧追。
        - id: ch04-b04
          speaker: narrator
          text: 她气喘吁吁地冲进屋，一头昏倒在地。铁头也跟进来，藏到了厨房的炉床下面。
        - id: ch04-b05
          speaker: narrator
          text: 不久，彼得回来了。他在门槛上发现姑娘掉下的三块餐巾。明明留在自己房里的东西，为什么会在这里？接着，他看见姑娘脸色惨白地躺在地上，一动不动，像死去一样。
        - id: ch04-b06
          speaker: narrator
          text: 彼得吓坏了，赶紧抱起姑娘，把她送到床上。姑娘很快醒来，却没有提起铁头。此时，铁头仍躲在炉床底下。压世庞大的身体隔着炉石压住他，差一点便把他活活压死。
        - id: ch04-b07
          speaker: narrator
          text: 第二天早晨，彼得锁起三条狗，独自进了森林。铁头看见他离开，马上跟了上去。彼得只来得及爬上一棵高树，铁头便已经到了树下，好在他伸手够不着彼得。
        - id: ch04-b08
          speaker: eisenkopf
          text: 你这该上绞架的坏蛋，立刻给我下来！难道忘了自己答应过永远不娶妻？
          emotion: angry
        - id: ch04-b09
          speaker: peter
          text: 我知道这回逃不掉了。只求你让我呼喊三次。
        - id: ch04-b10
          speaker: eisenkopf
          text: 别说三次，喊一百次也随你。如今你在我手里，非得为自己做过的事付出代价。
        - id: ch04-b11
          speaker: peter
          text: 铁强、压世、灵耳，快来救我！
        - id: ch04-b12
          speaker: narrator
          text: 灵耳听见了，连忙告诉两个哥哥。
        - id: ch04-b13
          speaker: quick_ear
          text: 听啊，主人在叫我们！
        - id: ch04-b14
          speaker: worlds_weight
          text: 傻瓜，你准是在做梦。他现在连早饭都没吃完呢。
        - id: ch04-b15
          speaker: narrator
          text: 灵耳年纪还小，压世觉得该教它懂点事，便抬爪打了它一下。
        - id: ch04-b16
          speaker: peter
          text: 铁强、压世、灵耳，快来救我！
        - id: ch04-b17
          speaker: narrator
          text: 这一回，压世也听见了。
        - id: ch04-b18
          speaker: worlds_weight
          text: 咦，主人真的在叫我们。
        - id: ch04-b19
          speaker: iron_strong
          text: 你怎么也糊涂了？你明明知道，他每天这个时候都在吃饭。
        - id: ch04-b20
          speaker: narrator
          text: 压世已经不小了，本该懂事，铁强便也给了它一爪。
    - id: ch05
      title: 第三声呼救
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 彼得在树上浑身发抖。他怕三条狗根本没听见，又怕它们明明听见，却不肯来救。眼下只剩最后一次机会。他用尽全身力气，再次大喊。
        - id: ch05-b02
          speaker: peter
          text: 铁强、压世、灵耳，快来救我！再不来，我就没命了！
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: 铁强终于也听见了。
        - id: ch05-b04
          speaker: iron_strong
          text: 没错，主人确实在叫我们。现在就走！
        - id: ch05-b05
          speaker: narrator
          text: 铁强一下撞开房门，三条狗全都朝声音传来的方向飞奔。它们赶到树下时，彼得只下了一道命令。
        - id: ch05-b06
          speaker: peter
          text: 扑上去！
        - id: ch05-b07
          speaker: narrator
          text: 三条狗一齐扑向铁头。几分钟以后，铁头已经一点也不剩了。彼得这才下树，回到白色小屋，向老妇人和她的女儿告别。临行前，她们送给他一枚镶满钻石的漂亮戒指。那其实是枚魔戒，只是彼得和金发姑娘都不知道。
        - id: ch05-b08
          speaker: narrator
          text: 彼得怀着沉重的心情踏上归途。他已经不再爱那个被自己留在婚宴上的妻子，心里想的全是金发姑娘。可如今再想这些也没有用，他只得压住心事，稳稳地一直向家骑去。
        - id: ch05-b09
          speaker: narrator
          text: 没走多远，大火又挡在前面。彼得把餐巾放进火焰，挥动三次，通道便再次打开。他骑过去，三条狗一直跟在马后。可刚穿过烈火，奇怪的事情便发生了。压世、铁强和灵耳重新变成三只小饼。彼得把它们拾起来，和餐巾一起放进袋里。
        - id: ch05-b10
          speaker: narrator
          text: 回去的路上，他依次来到三位老妇人家，把每一位的餐巾和小饼都还了回去。
    - id: ch06
      title: 钻石戒指
      blocks:
        - id: ch06-b01
          speaker: peter
          text: 我的妻子在哪里？
        - id: ch06-b02
          speaker: father
          text: 唉，亲爱的孩子，你当初为什么要离开呢？你一消失，谁也不知道你去了哪里。你那可怜的妻子越来越悲苦，什么也不吃，什么也不喝，身子一天比一天衰弱。一个月前，我们把她葬进坟墓，让泥土盖住了她的哀愁。
          emotion: sad
        - id: ch06-b03
          speaker: narrator
          text: 彼得听后哭了起来。在离家以前，在认识金发姑娘以前，他的确爱过自己的妻子。
        - id: ch06-b04
          speaker: narrator
          text: 此后的半年，他每天都伤心地做着活儿。一天夜里，他梦见自己把金发姑娘送的钻石戒指从右手取下来，戴上了左手的结婚戒指指。
        - id: ch06-b05
          speaker: narrator
          text: 那个梦太真切了，彼得立刻醒来，真的把戒指从右手换到左手。猜猜他看见了谁？金发姑娘正站在面前。彼得一下跳起来，吻了她。
        - id: ch06-b06
          speaker: peter
          text: 从现在起，你永远都属于我。将来我们死了，也要葬在同一座坟墓里。
          emotion: happy
        - id: ch06-b07
          speaker: narrator
          text: 后来，他们果真合葬在了一起。
