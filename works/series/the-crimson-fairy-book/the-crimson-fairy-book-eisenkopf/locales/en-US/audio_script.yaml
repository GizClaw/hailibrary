  chapters:
    - id: ch01
      title: The Nut and the Promise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was an old man with one son, Peter, whom he loved dearly. They were so poor that they often had almost nothing to eat. Then the father fell ill, and their troubles grew worse.
        - id: ch01-b02
          speaker: father
          text: My dear boy, I have no food left to give you. You must go out into the world and earn your own living. Take whatever work you can find. Do it well, and be faithful to your master, and you will receive your reward.
        - id: ch01-b03
          speaker: narrator
          text: Peter packed a piece of black bread in his knapsack, strapped it to his back, and took a stout stick. Then he set off to seek his fortune. He traveled for a long time, but no one wanted to hire him. At last he met an old man. Peter politely took off his hat.
        - id: ch01-b04
          speaker: peter
          text: Good morning.
        - id: ch01-b05
          speaker: old_master
          text: Good morning. Where are you going?
        - id: ch01-b06
          speaker: peter
          text: I'm traveling through the country, looking for work.
        - id: ch01-b07
          speaker: old_master
          text: Then stay with me. I have plenty of work for you.
        - id: ch01-b08
          speaker: narrator
          text: Peter agreed and stayed with the old man. His task was easy enough. He had only two horses and one cow to feed, tend, and watch over. He had been hired for a year, but the entire year lasted just three days. So it was not long before his service ended and the time came for his wages. The old man paid him with a single nut and offered to keep him for another year.
        - id: ch01-b09
          speaker: narrator
          text: But Peter longed for home. Besides, he would have preferred even the smallest coin to a nut. Nuts grew on trees, and he could gather all he wanted. Still, the old man had treated him kindly, so Peter kept those thoughts to himself, said farewell, and started home.
        - id: ch01-b10
          speaker: narrator
          text: The closer he came to his father's house, the more ashamed he felt. What good could one nut do? It would not buy even a slice of bacon. He decided there was no point in taking it home, so he sat on a stone and cracked it with his teeth.
        - id: ch01-b11
          speaker: narrator
          text: And what came out? Horses, oxen, and sheep poured from that nut in such numbers that they seemed to reach the world's end. Peter stared in terror and wrung his hands. Where could he put all those creatures? What could he possibly do with them? Just then, Eisenkopf came by.
        - id: ch01-b12
          speaker: eisenkopf
          text: What's wrong, young man?
        - id: ch01-b13
          speaker: peter
          text: Everything's wrong, my friend! I was paid with a nut. When I cracked it, this whole crowd of animals came out, and I don't know what to do with them.
        - id: ch01-b14
          speaker: eisenkopf
          text: Listen, my son. Promise me that you will never marry, and I'll drive every animal back into the nut.
        - id: ch01-b15
          speaker: narrator
          text: In his distress, Peter would have promised something far harder. He gladly gave Eisenkopf his word. The stranger gave one whistle. At once, the animals turned and crowded back toward the nut, nearly tumbling over one another in their haste to squeeze inside. Peter watched the flood of horses, oxen, and sheep grow smaller and smaller. When the last animal had drawn in its last foot, the two halves of the shell closed tight. Peter slipped the nut safely into his pocket and continued to his father's house.
        - id: ch01-b16
          speaker: narrator
          text: As soon as he arrived, he cracked the nut again. Out came the horses, sheep, and oxen. Peter thought there were even more than before. His father could hardly believe his eyes when he saw the great herds standing outside his door.
        - id: ch01-b17
          speaker: father
          text: How did you get all these animals?
          emotion: surprised
        - id: ch01-b18
          speaker: narrator
          text: Peter told him everything, including the promise he had made to Eisenkopf. The next day, they drove some cattle to market. With the money, his father bought nearby fields and gardens. Within a few months, he was the richest and most prosperous man in the village. Everything he touched seemed to turn to gold.

    - id: ch02
      title: The Broken Promise
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, father and son sat in the orchard and watched their cattle graze in the meadows. The old man turned to Peter.
        - id: ch02-b02
          speaker: father
          text: Peter, my boy, it's time you thought about getting married.
        - id: ch02-b03
          speaker: peter
          text: But Father, I can never marry. I gave Eisenkopf my word.
        - id: ch02-b04
          speaker: father
          text: People make promises every day, but no one expects every promise to be kept. If Eisenkopf objects, he will simply have to bear it. And the gray horse in our stable stays saddled day and night. If Eisenkopf appears, jump on its back and ride. No one on earth can catch that horse. Come home when the danger is past, and we'll be as happy as two fish in the sea.
        - id: ch02-b05
          speaker: narrator
          text: That is what happened. Peter found a pretty girl with brown skin who wished to marry him, and the whole village came to the wedding feast. The music was at its brightest and the dancing at its merriest when Eisenkopf looked through the window.
        - id: ch02-b06
          speaker: eisenkopf
          text: Well, well, brother. What's happening here? It looks very much like a wedding. But perhaps I remember wrongly. Didn't you promise me that you would never marry?
        - id: ch02-b07
          speaker: narrator
          text: Peter did not wait for him to finish. He had seen Eisenkopf at the window, and that was enough. He darted from the wedding like the wind, flew to the stable, and threw himself onto the waiting gray horse. In another instant, the feast and all its music were behind him. He raced away over the mountain, while Eisenkopf ran swiftly at his heels.
        - id: ch02-b08
          speaker: narrator
          text: On and on they went. Peter rode through thick forests where the sun never shone. He crossed rivers so wide that a boat needed a whole day to sail from shore to shore. He climbed hills whose shining sides were made entirely of glass. The gray horse carried him through seven times seven countries, and Eisenkopf never stopped pursuing him. At last, Peter drew rein before an old woman's house.
        - id: ch02-b09
          speaker: peter
          text: Good day, mother.
        - id: ch02-b10
          speaker: first_old_woman
          text: Good day, my son. What are you doing here at the world's end?
        - id: ch02-b11
          speaker: peter
          text: I'm running for my life, mother. I'm trying to reach the world beyond all worlds, because Eisenkopf is right behind me.
        - id: ch02-b12
          speaker: first_old_woman
          text: Come in, rest, and eat something. My little dog will howl while Eisenkopf is still seven miles away.
        - id: ch02-b13
          speaker: narrator
          text: Peter went inside, warmed himself, and ate and drank. Suddenly the little dog began to howl.
        - id: ch02-b14
          speaker: first_old_woman
          text: Quickly, my son! You must leave now!
        - id: ch02-b15
          speaker: narrator
          text: Peter moved faster than lightning. Just as he was mounting his horse, the old woman called him back.
        - id: ch02-b16
          speaker: first_old_woman
          text: Wait one moment. Take this napkin and this cake. Keep them in your bag where you can reach them easily.
        - id: ch02-b17
          speaker: narrator
          text: Peter accepted the gifts, waved his thanks, and rode away like the wind.

    - id: ch03
      title: Beyond the Wall of Fire
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Round and round Peter rode, crossing seven times seven countries once more. Still Eisenkopf followed. The forests ahead were thicker than the ones Peter had already passed. The rivers were wider, and the mountains were even more slippery beneath the gray horse's feet. After that long, dangerous ride, Peter finally reached a lonely house where a second old woman lived.
        - id: ch03-b02
          speaker: peter
          text: Good day, mother.
        - id: ch03-b03
          speaker: second_old_woman
          text: Good day, my son. What are you looking for here at the world's end?
        - id: ch03-b04
          speaker: peter
          text: I'm running for my life, mother. I must reach the world beyond all worlds, for Eisenkopf is at my heels.
        - id: ch03-b05
          speaker: second_old_woman
          text: Come in and eat. My little dog will howl while Eisenkopf is still seven miles away. Lie down and rest in peace until then.
        - id: ch03-b06
          speaker: narrator
          text: She went to the kitchen and baked more cakes than Peter could have eaten in a month. He had not finished even a quarter of them when the dog began to howl.
        - id: ch03-b07
          speaker: second_old_woman
          text: You must go now, my son. First, put these cakes and this napkin in your bag, close at hand.
        - id: ch03-b08
          speaker: narrator
          text: Peter thanked her and sped away like the wind. Again he rode on through seven times seven countries, with no safe place behind him and the world beyond all worlds still ahead. At length he came to a third old woman's house. She welcomed him as kindly as her sisters had done, gave him food, and let him rest while her little dog kept watch. When the dog finally howled and Peter sprang up to leave, she handed him the same gifts for his journey. Then she gave him careful instructions.
        - id: ch03-b09
          speaker: third_old_woman
          text: You now have three cakes and three napkins, because each of my sisters gave you one. Listen closely. Ride straight ahead for seven days and seven nights. On the eighth morning, you will see a great fire. Strike it three times with the three napkins, and the flames will divide. Ride into the opening. When you reach the middle, throw the three cakes behind you with your left hand.
        - id: ch03-b10
          speaker: narrator
          text: Peter thanked her for the advice and made sure to follow every word. For seven whole days and seven nights, he rode straight ahead. On the eighth morning, he reached a fire so vast that its flames filled his sight. He could see nothing beyond it on either side. Peter took out all three napkins and struck the fire three times. The flames divided before him and stood like two high walls, one on his right and one on his left.
        - id: ch03-b11
          speaker: narrator
          text: Peter urged the horse into the opening. When he reached the very middle, he used his left hand to throw all three cakes behind his back. The moment they fell, each cake sprang up as a huge dog. Peter named them World's-weight, Iron-strong, and Quick-ear. The three dogs recognized him as their master and bayed with joy at the sight of him.
        - id: ch03-b12
          speaker: narrator
          text: Peter turned to pat them and saw Eisenkopf at the edge of the fire. But the opening had closed, and his pursuer could not pass through.
        - id: ch03-b13
          speaker: eisenkopf
          text: Stop, you promise-breaker! You escaped me once, but just wait until I catch you again!
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: Eisenkopf lay beside the fire and watched, waiting to see what might happen. Peter knew he was safe for the moment, so he rode on slowly until he came to a little white house.
        - id: ch03-b15
          speaker: narrator
          text: Inside, a gray-haired woman sat spinning. A beautiful girl with golden hair sat by the window, combing it. The older woman looked up at Peter.
        - id: ch03-b16
          speaker: white_house_woman
          text: What brings you here, my son?
        - id: ch03-b17
          speaker: peter
          text: I'm looking for a position, mother.
        - id: ch03-b18
          speaker: white_house_woman
          text: Then stay with me. I need a servant.
        - id: ch03-b19
          speaker: peter
          text: Gladly, mother.
        - id: ch03-b20
          speaker: narrator
          text: Peter was very happy there. He spent his days sowing and ploughing. Sometimes he took the three dogs hunting, and the golden-haired maiden knew how to prepare whatever game he brought home.

    - id: ch04
      title: The Maiden Opens the Fire
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One day, the old woman went into town to buy flour, leaving Peter and the maiden alone in the house. They began to talk. The maiden wanted to know where his home was, how far he had traveled, and how he had ever found a way through the great fire. Peter held nothing back. He told her his whole story, including the promise to Eisenkopf, his flight across the countries, and how the flames had opened when he struck them with the three napkins.
        - id: ch04-b02
          speaker: narrator
          text: The maiden listened closely, but she wondered whether his tale could be true. After Peter went out to the fields, she crept into his room and stole the napkins. Then she hurried over the hill by a path she knew and reached the fire.
        - id: ch04-b03
          speaker: narrator
          text: At her third blow, the flames divided. Eisenkopf had been watching and hoping for just such a chance. He ran through the opening and stood before her. The maiden was nearly frightened to death. With a great effort, she recovered and ran home, with Eisenkopf close behind.
        - id: ch04-b04
          speaker: narrator
          text: She rushed into the house, gasping for breath, and fainted on the floor. Eisenkopf entered behind her and hid beneath the hearth in the kitchen.
        - id: ch04-b05
          speaker: narrator
          text: Peter returned soon afterward. On the threshold, he found the three napkins the maiden had dropped. He knew he had left them in his room and wondered how they had come to be there. Then he saw her lying pale and motionless on the floor, as still as death.
        - id: ch04-b06
          speaker: narrator
          text: Horrified, Peter lifted the maiden from the floor and carried her to bed. After a while, she opened her eyes and recovered. Yet she told Peter nothing about taking the napkins, opening the fire, or being chased home by Eisenkopf. And Eisenkopf remained silent too. He was still hidden beneath the kitchen hearth, where World's-weight's enormous body had nearly crushed him to death through the heavy hearthstone.
        - id: ch04-b07
          speaker: narrator
          text: The next morning, Peter locked up his dogs and went alone into the forest. Eisenkopf saw him leave and followed so closely that Peter barely had time to climb a tall tree. There, Eisenkopf could not reach him.
        - id: ch04-b08
          speaker: eisenkopf
          text: Come down at once, you gallows bird! Have you forgotten your promise never to marry?
          emotion: angry
        - id: ch04-b09
          speaker: peter
          text: I know there is no escape for me now. Only let me call out three times.
        - id: ch04-b10
          speaker: eisenkopf
          text: Call a hundred times if you want. I have you in my power now, and you will pay for what you've done.
        - id: ch04-b11
          speaker: peter
          text: Iron-strong, World's-weight, Quick-ear, fly to my help!
        - id: ch04-b12
          speaker: narrator
          text: Quick-ear heard the cry and turned to his brothers.
        - id: ch04-b13
          speaker: quick_ear
          text: Listen! Our master is calling us.
        - id: ch04-b14
          speaker: worlds_weight
          text: You're dreaming, fool. He hasn't even finished his breakfast.
        - id: ch04-b15
          speaker: narrator
          text: World's-weight slapped Quick-ear with his paw, for Quick-ear was young and needed to be taught some sense.
        - id: ch04-b16
          speaker: peter
          text: Iron-strong, World's-weight, Quick-ear, fly to my help!
        - id: ch04-b17
          speaker: narrator
          text: This time World's-weight heard him too.
        - id: ch04-b18
          speaker: worlds_weight
          text: Ah, yes. Our master really is calling us.
        - id: ch04-b19
          speaker: iron_strong
          text: What nonsense! You know he always eats at this hour.
        - id: ch04-b20
          speaker: narrator
          text: Iron-strong cuffed World's-weight, who was old enough to know better.

    - id: ch05
      title: The Third Call
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Peter sat trembling in the tree. He feared that his dogs had not heard him, or worse, that they had heard and would not come. One last chance remained. With all his strength, he cried out again.
        - id: ch05-b02
          speaker: peter
          text: Iron-strong, World's-weight, Quick-ear, fly to my help, or I am a dead man!
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: At last Iron-strong heard him.
        - id: ch05-b04
          speaker: iron_strong
          text: Yes, he is certainly calling us. We must go at once.
        - id: ch05-b05
          speaker: narrator
          text: In an instant, Iron-strong smashed the door open, and all three dogs bounded toward Peter's voice. When they reached the tree, Peter gave them one short command.
        - id: ch05-b06
          speaker: peter
          text: At him!
        - id: ch05-b07
          speaker: narrator
          text: The dogs threw themselves upon Eisenkopf, and within minutes, nothing was left of him. Only then did Peter climb down from the tree. He returned to the white house, knowing that the long pursuit was over. There he said farewell to the old woman and her daughter. Before he left, they gave him a beautiful ring set all around with diamonds. It was truly a magic ring, though neither Peter nor the golden-haired maiden knew that.
        - id: ch05-b08
          speaker: narrator
          text: Peter rode away with a heavy heart. He no longer loved the wife he had left at their wedding feast. His heart now belonged to the golden-haired maiden. There was no use dwelling on it, so he kept riding toward home.
        - id: ch05-b09
          speaker: narrator
          text: He had not gone very far before the great fire blocked his road. Peter took out the napkins and shook them three times in the flames. Once again, a passage opened between two walls of fire. He rode into it with the three dogs following close at his heels. Then a curious thing happened. As soon as they passed through, World's-weight, Iron-strong, and Quick-ear became three cakes again. Peter gathered them up and placed them in his bag with the napkins.
        - id: ch05-b10
          speaker: narrator
          text: On his journey back, Peter stopped at the homes of all three old women. To each sister, he returned her napkin and her cake.

    - id: ch06
      title: The Diamond Ring
      blocks:
        - id: ch06-b01
          speaker: peter
          text: Where is my wife?
        - id: ch06-b02
          speaker: father
          text: Oh, my dear son, why did you ever leave us? After you vanished and no one knew where you had gone, your poor wife grew more miserable every day. She would neither eat nor drink. Little by little, she faded away. A month ago, we laid her in her grave and covered her sorrows with the earth.
          emotion: sad
        - id: ch06-b03
          speaker: narrator
          text: Peter began to weep. He had loved his wife before he went away and met the golden-haired maiden.
        - id: ch06-b04
          speaker: narrator
          text: For half a year, he went sadly about his work. Then one night he dreamed that he moved the maiden's diamond ring from his right hand and placed it on the wedding finger of his left hand.
        - id: ch06-b05
          speaker: narrator
          text: The dream felt so real that Peter woke at once and changed the ring from one hand to the other. And what did he see? The golden-haired maiden was standing before him. Peter sprang up and kissed her.
        - id: ch06-b06
          speaker: peter
          text: Now you are mine forever and ever. When we die, we will both be buried in one grave.
          emotion: happy
        - id: ch06-b07
          speaker: narrator
          text: And so they were.
