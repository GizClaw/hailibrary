  chapters:
    - id: ch01
      title: The Horse at the Fairies' Door
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king and queen with one son. The king loved the boy dearly, but the queen was wicked and could not bear to look at him. Then the king died when his son was only twelve, and the boy was left alone.
        - id: ch01-b02
          speaker: narrator
          text: The people knew what kind of woman the queen was, so they put her son on the throne instead of her. She was furious. From that day on, she thought of nothing but how to get him out of her way. The young king was wise, though, and knew better than to trust her.
        - id: ch01-b03
          speaker: narrator
          text: Once his time of mourning had ended, he ordered everyone to prepare for a grand hunt. His mother acted delighted to see him enjoying himself again and announced that she would ride with him.
        - id: ch01-b04
          speaker: young_king
          text: No, Mother, I can't allow that. The ground is rough, and you aren't strong enough for it.
        - id: ch01-b05
          speaker: narrator
          text: His warning did no good. When the hunting horn sounded at daybreak, the queen was there with everyone else.
        - id: ch01-b06
          speaker: narrator
          text: They rode all day through country rich with game. By evening, mother and son had become separated from the others in a place neither of them knew. They wandered until they met a man and begged him to shelter them.
        - id: ch01-b07
          speaker: ogre
          text: Come along with me. You're both welcome at my house.
        - id: ch01-b08
          speaker: narrator
          text: The man sounded glad to help, but he was an ogre who ate human flesh. The king and queen followed him to his house. Only when they arrived did they understand what a dreadful place they had entered. They fell to their knees and promised him great riches if he would only let them live.
        - id: ch01-b09
          speaker: narrator
          text: The queen's beauty softened the ogre's heart, and he promised not to harm her. But he stabbed the boy at once. Then he tied the body onto a horse and turned it loose in the forest.
        - id: ch01-b10
          speaker: narrator
          text: The ogre had bought that horse only the day before. He did not know it was a magician, or he would never have chosen it. The moment it was driven away, the horse galloped straight to the fairies' home and knocked on their door with its hoof.
        - id: ch01-b11
          speaker: narrator
          text: The fairies heard the knock, but they were afraid to open the door. First they peeped from an upstairs window to make sure no giant or ogre was waiting to hurt them.
        - id: ch01-b12
          speaker: fairy_sister
          text: Oh, sister, look! A horse knocked at the door. There's a dead boy tied across its back, and he's the most beautiful boy in the world!
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: The fairies hurried down, opened the door, and untied the young king. They gathered around him, marveling at his beauty, and whispered together.
        - id: ch01-b14
          speakers: [eldest_fairy, fairy_sister]
          ensemble: duo
          text: We'll bring him back to life and keep him as our brother.
        - id: ch01-b15
          speaker: narrator
          text: And that is what they did. For many years, the young king and the fairies lived together like brother and sisters.
        - id: ch01-b16
          speaker: narrator
          text: In time, the boy grew into a man. Then the eldest fairy spoke to her sisters.
        - id: ch01-b17
          speaker: eldest_fairy
          text: I will marry him now, and then he truly will be your brother.
        - id: ch01-b18
          speaker: narrator
          text: So the young king married her, and they were happy together in the castle. He loved his wife, but he still longed to see the world.

    - id: ch02
      title: The Goose-Boy Called Paperarello
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At last, his longing became too strong to resist. He called the fairies together and told them he must go.
        - id: ch02-b02
          speaker: young_king
          text: My dear wife and sisters, I must leave you for a while and travel through the world. I'll often think of you, and someday I will come home.
        - id: ch02-b03
          speaker: narrator
          text: The fairies wept and begged him to stay, but he would not change his mind. At last, his wife spoke.
        - id: ch02-b04
          speaker: eldest_fairy
          text: If you truly mean to leave us, take this lock of my hair. When you are in need, it will help you.
          emotion: sad
        - id: ch02-b05
          speaker: narrator
          text: She cut off a long curl and gave it to him. The young king mounted his horse and rode the whole day without a stop.
        - id: ch02-b06
          speaker: narrator
          text: Evening found him in a desert. No matter where he looked, he saw neither a house nor another person.
        - id: ch02-b07
          speaker: young_king
          text: What can I do? If I sleep out here, wild animals will eat me. But my horse and I are worn out. We can't go another step.
        - id: ch02-b08
          speaker: narrator
          text: Then he remembered the fairy's gift. He took out the curl and spoke to it.
        - id: ch02-b09
          speaker: young_king
          text: I need a castle here tonight, with servants, dinner, and everything that will make me comfortable. My horse must have a stable and plenty of fodder too.
        - id: ch02-b10
          speaker: narrator
          text: In a moment, the castle stood before him, exactly as he had wished.
        - id: ch02-b11
          speaker: narrator
          text: With the fairy's curl to help him whenever he was in need, he traveled through one country after another. At last, he reached a land ruled by a great king. He left his horse outside the city walls, traded his own clothes for a poor man's rags, and walked up to the palace.
        - id: ch02-b12
          speaker: narrator
          text: The queen happened to be looking from a window. When she saw the poor stranger coming, she pitied him and sent a servant to ask who he was and what he wanted.
        - id: ch02-b13
          speaker: young_king
          text: I'm a poor stranger, and I've come to ask if there is any work for me.
        - id: ch02-b14
          speaker: narrator
          text: The servant carried his answer back to the queen.
        - id: ch02-b15
          speaker: palace_queen
          text: We already have every kind of servant we need. There is a keeper for the gate, a porter for the hall, and people for every other task. But we have no one to tend the geese. Tell him he may be our goose-boy if he wishes.
        - id: ch02-b16
          speaker: narrator
          text: The young man gladly accepted. That was how he came to be called Paperarello.
        - id: ch02-b17
          speaker: narrator
          text: He did not want anyone to guess that he was more than a goose-boy. So he smeared his face and ragged clothes with mud until he looked so disgusting that people crossed the road rather than pass near him.
        - id: ch02-b18
          speaker: narrator
          text: Paperarello did his work so well that the queen began to take an interest in him. Sometimes she tried to persuade him to clean himself.
        - id: ch02-b19
          speaker: palace_queen
          text: Paperarello, please go and wash yourself.
        - id: ch02-b20
          speaker: young_king
          text: Oh, Your Majesty, I wouldn't feel comfortable if I were clean.
        - id: ch02-b21
          speaker: narrator
          text: And off he went, whistling after his geese.

    - id: ch03
      title: Seven Ovens of Bread
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: One day, an accident stopped the great flour mills that supplied the city. There was no bread, and even the king's army had to go without it. When the king heard, he summoned the cook.
        - id: ch03-b02
          speaker: king
          text: By tomorrow morning, I want as much bread as the oven can bake after being heated seven times.
        - id: ch03-b03
          speaker: cook
          text: But, Your Majesty, that can't be done! The mills have only just started again. The flour won't be ready until evening. How could I possibly heat the oven seven times in one night?
          emotion: fearful
        - id: ch03-b04
          speaker: king
          text: That is for you to solve. Bake the bread, and you may marry my daughter. Fail, and you will pay with your head.
        - id: ch03-b05
          speaker: narrator
          text: When the king fixed his mind on something, he would hear no argument. Paperarello was crossing the hall and heard the order.
        - id: ch03-b06
          speaker: young_king
          text: Don't worry, Your Majesty. I will bake the bread for you.
        - id: ch03-b07
          speaker: king
          text: Very well. But if you fail, your head will pay for it.
        - id: ch03-b08
          speaker: narrator
          text: The king motioned for both men to leave. The cook still trembled at the danger he had escaped, but Paperarello seemed perfectly easy. When night came, he began getting ready for bed as usual.
        - id: ch03-b09
          speakers: [palace_servant_1, palace_servant_2]
          ensemble: duo
          text: Paperarello, you can't go to bed! You will need the whole night to finish the work. The king does not make idle threats.
        - id: ch03-b10
          speaker: young_king
          text: I truly need to sleep first.
        - id: ch03-b11
          speaker: narrator
          text: He stretched, yawned, threw himself onto his bed, and fell asleep at once. An hour later, the servants shook his shoulder.
        - id: ch03-b12
          speaker: palace_servant_1
          text: Have you lost your mind, Paperarello? Get up, or the king will cut off your head!
        - id: ch03-b13
          speaker: young_king
          text: Oh, please let me sleep a little longer.
        - id: ch03-b14
          speaker: narrator
          text: That was all he would say, though the servants came back many times during the night to wake him.
        - id: ch03-b15
          speaker: narrator
          text: At last, dawn broke. The servants rushed into his room shouting that the king was coming.
        - id: ch03-b16
          speakers: [palace_servant_1, palace_servant_2]
          ensemble: duo
          text: Paperarello, get up! You haven't baked a single loaf, and the king will surely take your head!
          emotion: fearful
        - id: ch03-b17
          speaker: young_king
          text: Oh, stop all that screaming.
        - id: ch03-b18
          speaker: narrator
          text: Paperarello jumped out of bed, took the lock of hair in his hand, and walked into the kitchen. There stood the bread, piled high. Six ovenfuls were ready, and the seventh was still waiting to be taken out.
        - id: ch03-b19
          speaker: narrator
          text: The servants could only stare. The king looked at the great piles and praised the goose-boy.
        - id: ch03-b20
          speaker: king
          text: Well done, Paperarello. You have won my daughter.
        - id: ch03-b21
          speaker: narrator
          text: In his own mind, the king decided that this fellow truly must be a magician.
        - id: ch03-b22
          speaker: narrator
          text: When the princess learned whom she was to marry, she wept bitterly.
        - id: ch03-b23
          speaker: princess
          text: Never! I will never marry that filthy Paperarello!
          emotion: disgusted
        - id: ch03-b24
          speaker: narrator
          text: She pleaded with her father through her tears, but he paid no attention. Within a few days, the wedding was celebrated with great splendor. Even for his own wedding, the bridegroom had not bothered to wash. He stood beside the princess just as muddy and dirty as before.
        - id: ch03-b25
          speaker: narrator
          text: That night, Paperarello went back to sleep among his geese as usual. The princess went straight to her father.
        - id: ch03-b26
          speaker: princess
          text: Father, please have that horrible Paperarello put to death.
        - id: ch03-b27
          speaker: king
          text: No, no. He is a powerful magician. Before I have him killed, I must learn the secret of his power. After that, we shall see.

    - id: ch04
      title: The Knight Who Came Three Times
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Soon afterward, war broke out. Everyone at the palace was busy polishing armor and sharpening swords, for the king and his sons would lead the army. Paperarello left his geese and asked the king for permission to fight too.
        - id: ch04-b02
          speaker: king
          text: You may go. Choose any horse you like from my stables.
        - id: ch04-b03
          speaker: narrator
          text: Paperarello inspected the horses carefully. He passed by all the splendid, well-groomed animals with coats that shone like satin. Instead, he chose a poor lame horse, saddled it, and rode after the soldiers who were following the king.
        - id: ch04-b04
          speaker: narrator
          text: Before long, he pulled up and called to the other men.
        - id: ch04-b05
          speaker: young_king
          text: My horse can't go any farther. You must ride on without me. I'll stay here, make some little soldiers out of clay, and play at having a battle.
        - id: ch04-b06
          speaker: narrator
          text: The men laughed at such childishness and rode on after their master.
        - id: ch04-b07
          speaker: narrator
          text: As soon as they disappeared, Paperarello took out the curl. He wished for the finest armor, the sharpest sword, and the swiftest horse in all the world. A moment later, he was racing toward the battlefield.
        - id: ch04-b08
          speaker: narrator
          text: The fighting had already begun, and the enemy was winning. Then Paperarello charged in, and the whole battle turned. His sword struck to the right and left, piercing the toughest breastplates and strongest shields.
        - id: ch04-b09
          speaker: narrator
          text: He fought like an army all by himself. His enemies fled because they believed he must be only the first of many such warriors, and no one could stand against them.
        - id: ch04-b10
          speaker: narrator
          text: When the battle ended, the king sent for the unknown knight. He thanked him for arriving just in time and asked what reward he desired.
        - id: ch04-b11
          speaker: young_king
          text: I ask for nothing but Your Majesty's little finger.
        - id: ch04-b12
          speaker: narrator
          text: The king cut off his little finger and gave it to him. Paperarello bowed, hid it inside his surcoat, and rode away.
        - id: ch04-b13
          speaker: narrator
          text: Later, when the soldiers returned, they found the goose-boy where they had left him, sitting in the road with rows of little clay dolls.
        - id: ch04-b14
          speaker: narrator
          text: The next day, the king rode out to another battle. Again, Paperarello followed on the lame horse. Again, he stopped on the road and sat down to make clay soldiers.
        - id: ch04-b15
          speaker: narrator
          text: Once the others were gone, he wished for armor, a sword, and a horse even finer than the ones he had used before. Then he galloped after the army.
        - id: ch04-b16
          speaker: narrator
          text: He arrived just in time. The enemy had almost driven the king's forces back, and the men feared they would all die unless the strange knight came to help them.
        - id: ch04-b17
          speaker: soldier
          text: Hold on a little longer! I can see him in the distance. His armor is brighter, and his horse is faster than yesterday!
        - id: ch04-b18
          speaker: narrator
          text: The soldiers took fresh heart at the sight of him. They fought desperately and held their ground until the knight reached them. Then he threw himself into the thickest part of the battle. Once more, the enemy gave way before him, and within minutes the victory belonged to the king.
        - id: ch04-b19
          speaker: narrator
          text: The king's first act was to summon the knight, thank him for his timely help, and offer him a gift.
        - id: ch04-b20
          speaker: young_king
          text: Give me Your Majesty's ear.
        - id: ch04-b21
          speaker: narrator
          text: The king could not break his word. He cut off his ear and handed it over. Paperarello bowed, fastened the ear inside his surcoat, and rode away.
        - id: ch04-b22
          speaker: narrator
          text: That evening, when everyone returned from battle, Paperarello was sitting in the road making clay dolls.
        - id: ch04-b23
          speaker: narrator
          text: On the third day, everything happened in the same way. Paperarello set out on the lame horse, stayed behind with his clay dolls, then used the curl and rode into battle as the unknown knight. He saved the king's army for the third time. This time, he asked for the king's nose as his reward.
        - id: ch04-b24
          speaker: narrator
          text: Losing a nose was even worse than losing an ear or finger, and the king hesitated. But he had always prided himself on keeping his word. At last, he cut off his nose and gave it to Paperarello.
        - id: ch04-b25
          speaker: narrator
          text: Paperarello bowed, slipped the nose into his surcoat, and rode away. That evening, the king found the dirty goose-boy sitting in the road with his clay dolls, just as before. Paperarello rose to meet him.
        - id: ch04-b26
          speaker: young_king
          text: Do you know who I am? I am your filthy goose-boy. Yet you have given me your finger, your ear, and your nose.

    - id: ch05
      title: Paperarello Goes Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: That night, while the king sat at dinner, Paperarello entered the hall. He laid the ear, nose, and finger on the table, then turned to the nobles and courtiers waiting on the king.
        - id: ch05-b02
          speaker: young_king
          text: I am the invincible knight who came three times to help you. I am also a king's son, not the goose-boy you all believed me to be.
        - id: ch05-b03
          speaker: narrator
          text: He left the hall, washed away every trace of mud, and dressed himself in fine clothes. When he came back, he looked so handsome that the proud princess fell in love with him on the spot. But Paperarello did not even notice her admiration. He turned to the king instead.
        - id: ch05-b04
          speaker: young_king
          text: It was kind of you to offer me your daughter, and I thank you. But I already have a wife at home, and I love her more. I am going back to her now. As a farewell gift, I wish for your ear, nose, and finger to return to their proper places.
        - id: ch05-b05
          speaker: narrator
          text: With that, Paperarello said goodbye to them all. Then he returned home to his fairy bride, and they lived happily together for the rest of his life.
