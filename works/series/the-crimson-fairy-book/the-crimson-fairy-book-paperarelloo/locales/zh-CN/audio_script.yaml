audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而带几分诙谐，像在讲一则古老的欧洲童话
        timbre: 温暖清亮
        pace: 舒缓，转折处有自然停顿
        pitch: 中音
    paperarelloo:
      display_name: 帕佩拉雷洛
      tts:
        delivery: 年轻沉着，历经磨难后机敏自信，关键时刻坚定果断
        timbre: 清朗有力
        pace: 中速
        pitch: 中音
    wicked_queen:
      display_name: 王后
      tts:
        delivery: 表面端庄亲切，内里冷酷阴沉
        timbre: 冷艳低柔
        pace: 中速偏慢
        pitch: 中音
    ogre:
      display_name: 妖怪
      tts:
        delivery: 粗鲁凶狠，故作热情时也藏着危险
        timbre: 粗厚低沉
        pace: 中速偏慢
        pitch: 低音
    fairy_sister:
      display_name: 小仙女
      tts:
        delivery: 善良活泼，惊喜时轻快明亮
        timbre: 清脆柔美
        pace: 中速偏快
        pitch: 中高音
    fairy_wife:
      display_name: 大仙女
      tts:
        delivery: 温柔深情，离别时忧伤而克制
        timbre: 柔和澄澈
        pace: 舒缓
        pitch: 中音
    foreign_queen:
      display_name: 异国王后
      tts:
        delivery: 仁慈端庄，对人关切而不失王室分寸
        timbre: 温润沉静
        pace: 中速偏慢
        pitch: 中音
    palace_servant:
      display_name: 王宫仆人
      tts:
        delivery: 恭敬利落，传话时清楚谨慎
        timbre: 朴实清晰
        pace: 中速
        pitch: 中音
    foreign_king:
      display_name: 异国国王
      tts:
        delivery: 威严固执，许诺与谢恩时郑重直接
        timbre: 浑厚有力
        pace: 中速偏慢
        pitch: 低音
    cook:
      display_name: 厨师
      tts:
        delivery: 老实胆小，受惊时急促慌张
        timbre: 略显沙哑
        pace: 中速偏快
        pitch: 中音
    servant_1:
      display_name: 仆人甲
      tts:
        delivery: 直率焦急，提醒人时语气急切
        timbre: 明亮结实
        pace: 中速偏快
        pitch: 中音
    servant_2:
      display_name: 仆人乙
      tts:
        delivery: 谨慎认真，遇到怪事时容易惊讶
        timbre: 清晰柔和
        pace: 中速
        pitch: 中音
    servant_3:
      display_name: 仆人丙
      tts:
        delivery: 朴实胆怯，紧张时说话稍快
        timbre: 偏低略粗
        pace: 中速偏快
        pitch: 中低音
    princess:
      display_name: 公主
      tts:
        delivery: 骄傲任性，厌恶时尖锐，动情时直白
        timbre: 年轻清亮
        pace: 中速
        pitch: 中高音
    soldier_1:
      display_name: 士兵甲
      tts:
        delivery: 久经战阵，危急时仍竭力振奋同伴
        timbre: 洪亮粗犷
        pace: 中速偏快
        pitch: 中低音
    soldier_2:
      display_name: 士兵乙
      tts:
        delivery: 忠诚朴实，战局危急时紧张低沉
        timbre: 厚实略哑
        pace: 中速
        pitch: 中低音
    soldier_3:
      display_name: 士兵丙
      tts:
        delivery: 年轻勇敢，随众应和时干脆有力
        timbre: 清朗
        pace: 中速偏快
        pitch: 中音
  chapters:
    - id: ch01
      title: 遇害的少年国王
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王和王后只有一个儿子。国王十分疼爱他，心肠狠毒的王后却连看见他都厌恶。王子十二岁那年，父亲去世，他孤零零地留在了世上。
        - id: ch01-b02
          speaker: narrator
          text: 百姓知道王后有多坏，没有拥立她，反而让她的儿子登上王位。王后气得日夜不安，非除掉少年国王不可。她盘算了很久，终于想出一条毒计。好在这个孩子聪明谨慎，也实在太了解母亲的为人，从不肯轻信她。
        - id: ch01-b03
          speaker: narrator
          text: 服丧期满后，少年国王下令准备一场盛大的狩猎。王后装得十分高兴，还说自己也要去。
        - id: ch01-b04
          speaker: paperarelloo
          text: 不行，母亲，我不能让您同行。猎场道路崎岖，您的身体又不强健。
        - id: ch01-b05
          speaker: narrator
          text: 可这番话说了也像说给风听。黎明的号角一响，王后早已和众人等在那里。
        - id: ch01-b06
          speaker: narrator
          text: 那天猎物很多，他们骑马追逐了一整日。临近黄昏，母子俩落了单，来到一片陌生的地方。他们走了许久，遇见一个男人，便请求借宿。
        - id: ch01-b07
          speaker: ogre
          text: 跟我来吧。
        - id: ch01-b08
          speaker: narrator
          text: 那男人答应得很痛快，其实他是个吃人肉的妖怪。母子俩跟着他回到住处，一进门才明白自己落进了多么可怕的地方。他们跪在妖怪面前，许诺送他大笔金钱，只求饶过自己的性命。妖怪看见王后的美貌，心软了一点，答应不伤害她，却当场一刀刺死了少年国王。他把尸身牢牢捆在一匹马上，又把马赶进森林，任它自己乱走。
        - id: ch01-b09
          speaker: narrator
          text: 妖怪偏偏选了前一天才买来的马。他并不知道，这匹马其实是个魔法师，否则绝不会蠢到在这时候挑中它。马儿一被赶出门，立刻驮着王子径直奔到仙女们的家，用蹄子敲响了门。
        - id: ch01-b10
          speaker: narrator
          text: 仙女们听见敲门声，不敢立刻开门。她们先从楼上探头张望，生怕外面站着巨人或妖怪。
        - id: ch01-b11
          speaker: fairy_sister
          text: 姐姐，快看！敲门的是一匹马。它背上捆着一个死去的男孩，他比世上所有男孩都俊美！
          emotion: surprised
        - id: ch01-b12
          speaker: narrator
          text: 仙女们急忙打开门，放马进来，解开少年国王身上的绳索。她们围着他赞叹不已，又低声商量。
        - id: ch01-b13
          speakers: [fairy_sister, fairy_wife]
          ensemble: duo
          text: 我们让他活过来，留下来做我们的弟弟吧。
        - id: ch01-b14
          speaker: narrator
          text: 她们果真救活了他。此后许多年，他们就像亲兄弟姐妹一样住在一起。
    - id: ch02
      title: 仙女的卷发
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 男孩渐渐长成了男人，男孩总会长大的。这时，年纪最大的仙女对姐妹们开了口。
        - id: ch02-b02
          speaker: fairy_wife
          text: 我要嫁给他。这样，他就当真成了你们的兄弟。
        - id: ch02-b03
          speaker: narrator
          text: 少年国王就这样娶了大仙女，夫妻俩和她的姐妹们一起住在城堡里，日子过得十分幸福。他深爱自己的妻子，心里却一直想走出城堡，亲眼看看外面的世界。那份渴望一天天变强，终于叫他再也忍不住了。他把妻子和仙女们全都召集到身边。
        - id: ch02-b04
          speaker: paperarelloo
          text: 亲爱的妻子，亲爱的姐妹们，我得离开一阵，到外面看看世界。我会常常想念你们，总有一天还会回来。
        - id: ch02-b05
          speaker: narrator
          text: 仙女们哭着挽留，他却不肯改变主意。最后，大仙女只好对他说。
        - id: ch02-b06
          speaker: fairy_wife
          text: 你若当真非走不可，就把我的这绺头发带上吧。遇到危急，它会帮你的。
          emotion: sad
        - id: ch02-b07
          speaker: narrator
          text: 她剪下一绺长长的卷发，交给了丈夫。王子跨上马背，一口气骑了一整天。傍晚，他来到荒漠。四面既没有房屋，也没有人影。
        - id: ch02-b08
          speaker: paperarelloo
          text: 这可怎么办？睡在这里，野兽一定会来吃我。可我和马都累垮了，实在走不动啦。
        - id: ch02-b09
          speaker: narrator
          text: 他忽然想起仙女的礼物，取出那绺卷发。
        - id: ch02-b10
          speaker: paperarelloo
          text: 我要这里有一座城堡，有仆人、晚餐和今晚需要的一切。还要给我的马准备好马厩和草料。
        - id: ch02-b11
          speaker: narrator
          text: 话音刚落，一座与他的心愿分毫不差的城堡便出现在眼前。仆人、晚餐、过夜所需的一切，还有马厩和草料，果然样样齐全。
        - id: ch02-b12
          speaker: narrator
          text: 靠着这绺卷发，他走过许多国家，最后来到一位大国王统治的土地。他把马留在城墙外，换上穷人的衣裳，向王宫走去。王后从窗边看见他，动了怜悯之心，便派仆人来询问。
        - id: ch02-b13
          speaker: palace_servant
          text: 你是谁？到这里来想要什么？
        - id: ch02-b14
          speaker: paperarelloo
          text: 我是个身无分文的外乡人，只想求一份差事。
        - id: ch02-b15
          speaker: narrator
          text: 仆人把回答带回王后那里。
        - id: ch02-b16
          speaker: foreign_queen
          text: 宫里守城门的、看大门的，还有各种仆役，全都不缺。只有放鹅的人还没有。问问他，愿不愿意留下来当鹅倌。
        - id: ch02-b17
          speaker: narrator
          text: 年轻人很乐意，从此得了“帕佩拉雷洛”这个绰号。为了不让人猜到他的身份，更不让人觉得他比普通鹅倌高贵，他故意把泥抹在脸上，也抹遍破衣裳，弄得自己又脏又恶心。人们只要看见他迎面走来，个个都要穿过马路，远远躲到另一边。
        - id: ch02-b18
          speaker: narrator
          text: 他干活倒是十分勤快，王后不由得关心起他来，有时会劝他。
        - id: ch02-b19
          speaker: foreign_queen
          text: 帕佩拉雷洛，你去把自己洗洗吧。
        - id: ch02-b20
          speaker: paperarelloo
          text: 陛下，我若洗干净了，反倒浑身不自在。
        - id: ch02-b21
          speaker: narrator
          text: 他说完，吹着口哨赶鹅去了。
    - id: ch03
      title: 七炉面包与一场婚礼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 有一天，供应全城面粉的大磨坊出了事故。城里买不到面包，国王的军队也只能饿着。国王召来厨师，命令他在第二天早晨以前烤出整整七炉面包。
        - id: ch03-b02
          speaker: cook
          text: 陛下，这根本办不到！磨坊才刚恢复转动，傍晚才能磨出面粉。我怎么能在一夜之间把炉子烧热七次呢？
        - id: ch03-b03
          speaker: narrator
          text: 国王一旦打定主意，谁的话也听不进去。
        - id: ch03-b04
          speaker: foreign_king
          text: 那是你的事。你若烤出面包，我就把女儿嫁给你。若是失败，你得拿脑袋来抵。
        - id: ch03-b05
          speaker: narrator
          text: 帕佩拉雷洛正从大厅经过，听见了这番话。
        - id: ch03-b06
          speaker: paperarelloo
          text: 陛下不必担心，面包交给我来烤。
        - id: ch03-b07
          speaker: foreign_king
          text: 很好。可你要是失败，也得拿脑袋来抵！
        - id: ch03-b08
          speaker: narrator
          text: 国王挥手让两人退下。厨师想着自己刚逃过一劫，仍吓得浑身发抖。帕佩拉雷洛却像什么也没发生，天一黑便照常准备睡觉。仆人们见他不慌不忙地脱衣服，急得一齐叫了起来。
        - id: ch03-b09
          speakers: [servant_1, servant_2, servant_3]
          ensemble: chorus
          text: 帕佩拉雷洛，你不能睡！这一夜每一刻都得拿来干活。国王可不是能随便糊弄的人！
        - id: ch03-b10
          speaker: paperarelloo
          text: 我非得先睡上一觉不可。
        - id: ch03-b11
          speaker: narrator
          text: 他伸伸懒腰，打个呵欠，往床上一倒，转眼便睡熟了。一个钟头后，仆人们又来摇他的肩膀。
        - id: ch03-b12
          speakers: [servant_1, servant_2, servant_3]
          ensemble: chorus
          text: 帕佩拉雷洛，你疯了吗？快起来，不然脑袋就保不住了！
        - id: ch03-b13
          speaker: paperarelloo
          text: 哎呀，再让我睡一会儿吧。
        - id: ch03-b14
          speaker: narrator
          text: 整整一夜，仆人们一次次来叫醒他，他始终只肯这样回答。天终于亮了，众人冲进他的房间。
        - id: ch03-b15
          speakers: [servant_1, servant_2, servant_3]
          ensemble: chorus
          text: 帕佩拉雷洛，快起来！国王就要来了。你一只面包也没烤，他一定会砍掉你的脑袋！
          emotion: fearful
        - id: ch03-b16
          speaker: paperarelloo
          text: 哎呀，别这样大喊大叫。
        - id: ch03-b17
          speaker: narrator
          text: 他一边回答，一边跳下床，把那绺头发握在手里，慢悠悠地走进厨房。瞧啊，面包已经高高堆在那里。第四炉、第五炉、第六炉全都烤好了，第七炉还留在烤炉中，只等着取出来。仆人们站在原地，盯着这一切，惊得目瞪口呆。
        - id: ch03-b18
          speaker: foreign_king
          text: 干得好，帕佩拉雷洛。我的女儿归你了。
        - id: ch03-b19
          speaker: narrator
          text: 国王心里却在想，这家伙一定是个魔法师。公主听说自己要嫁给谁，伤心得大哭起来。
        - id: ch03-b20
          speaker: princess
          text: 我绝不嫁给那个脏兮兮的帕佩拉雷洛，绝不！
          emotion: disgusted
        - id: ch03-b21
          speaker: narrator
          text: 国王根本不理会她的眼泪和哀求。没过几天，婚礼便隆重举行。新郎连洗一洗都嫌麻烦，仍旧和从前一样肮脏。
        - id: ch03-b22
          speaker: narrator
          text: 夜里，帕佩拉雷洛照常睡在鹅群中间。公主跑去见父亲。
        - id: ch03-b23
          speaker: princess
          text: 父亲，求您处死那个可怕的帕佩拉雷洛吧。
        - id: ch03-b24
          speaker: foreign_king
          text: 不，不。他是个了不起的魔法师。处死他以前，我要先查清他的法力藏在哪里。等查清以后，再看吧。
    - id: ch04
      title: 三次扭转战局
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 不久，战争爆发。王宫里人人都在擦铠甲、磨刀剑。国王要带着儿子们亲自领兵。帕佩拉雷洛离开鹅群，告诉国王，自己也想上阵。国王准许他去马厩随意挑选一匹马。
        - id: ch04-b02
          speaker: narrator
          text: 他看遍群马，没有选那些皮毛光亮如缎的骏马，反而挑中一匹可怜的瘸马。他备好鞍，追上护送国王出征的武士。没走多远，他便停了下来。
        - id: ch04-b03
          speaker: paperarelloo
          text: 我的马走不动了。你们只管上战场，我留在这里捏些小泥兵，自己玩打仗。
        - id: ch04-b04
          speaker: narrator
          text: 武士们笑他孩子气，继续追随国王去了。他们一消失，帕佩拉雷洛便取出卷发，许愿要世上最坚固的铠甲、最锋利的宝剑和最快的骏马。转眼间，他已纵马飞奔，直往战场而去。
        - id: ch04-b05
          speaker: narrator
          text: 战斗早已打响，敌军正占着上风。帕佩拉雷洛一赶到，整个战局立刻逆转。陌生骑士策马冲杀，向左挥剑，又向右劈砍。再厚的胸甲、再结实的盾牌也挡不住他的利刃。他一个人便抵得上一支大军。敌人只当他是整队无敌骑士的先锋，想到后面还有更多这样的勇士，纷纷望风而逃。
        - id: ch04-b06
          speaker: narrator
          text: 战斗结束，国王召见骑士，感谢他及时相助，又问他想要什么赏赐。
        - id: ch04-b07
          speaker: paperarelloo
          text: 陛下，我什么也不要，只要您的小指。
        - id: ch04-b08
          speaker: narrator
          text: 国王割下小指交给他。帕佩拉雷洛行了一礼，把小指藏进战袍，离开了战场。士兵们回来时，却见他还坐在路边，面前摆着一排排小泥人。
        - id: ch04-b09
          speaker: narrator
          text: 第二天，国王再次领兵出战，帕佩拉雷洛仍骑着那匹瘸马跟来。他像前一天那样半路停下，坐在路旁捏起小泥兵。等众人走远，他又拿出卷发许愿。这次，他要的铠甲、宝剑和骏马，每一样都要比昨天更好、更厉害。
        - id: ch04-b10
          speaker: narrator
          text: 他飞奔着赶上大军，恰好没有迟到。敌军几乎已经把国王的军队击退。士兵们低声议论，那位陌生骑士若不快来，大家谁也活不成。
        - id: ch04-b11
          speakers: [soldier_2, soldier_3]
          ensemble: duo
          text: 陌生骑士再不来救我们，我们全都要死在这里了。
          emotion: fearful
        - id: ch04-b12
          speaker: soldier_1
          text: 再坚持一会儿！我看见他了，就在远处！他的铠甲比昨天更亮，马也跑得更快！
          emotion: surprised
        - id: ch04-b13
          speaker: narrator
          text: 众人重新鼓起勇气，拼死抵挡。骑士赶到，一头冲进战阵深处。敌人又一次在他面前败退，短短几分钟后，胜利再次属于国王。
        - id: ch04-b14
          speaker: narrator
          text: 国王获胜后，立刻召见骑士，感谢他来相救，又问该送什么礼物。
        - id: ch04-b15
          speaker: paperarelloo
          text: 我要陛下的一只耳朵。
        - id: ch04-b16
          speaker: narrator
          text: 国王已经许下诺言，不能反悔，只好亲手割下耳朵，交给眼前的骑士。帕佩拉雷洛行过一礼，把耳朵牢牢系在战袍里面，骑马走了。傍晚众人从战场回来，又见他坐在路边，若无其事地捏着泥人。
        - id: ch04-b17
          speaker: narrator
          text: 第三天，一切仍旧照样发生。这回，帕佩拉雷洛要国王拿鼻子作为报酬。失去鼻子比失去耳朵或手指更加糟糕，国王不免迟疑。可他一向以守信为荣，最终还是割下鼻子，交给了骑士。
        - id: ch04-b18
          speaker: narrator
          text: 帕佩拉雷洛行礼，把鼻子装进战袍，骑马离开。傍晚，国王回到路上，又看见那个脏鹅倌坐在那里捏泥人。帕佩拉雷洛站起身来。
        - id: ch04-b19
          speaker: paperarelloo
          text: 您知道我是谁吗？我就是您那个脏兮兮的鹅倌。可您的手指、耳朵和鼻子，现在全都给了我。
    - id: ch05
      title: 骑士现出真身
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 当天晚上，国王正在用餐。帕佩拉雷洛走进大厅，把耳朵、鼻子和手指一一放上桌面，又转身面对侍奉国王的贵族与廷臣。
        - id: ch05-b02
          speaker: paperarelloo
          text: 我就是那个战无不胜的骑士，三次赶来援助你们。我也是一位国王的儿子，并不是你们以为的鹅倌。
        - id: ch05-b03
          speaker: narrator
          text: 他随即走出大厅，把自己从头到脚洗得干干净净，又换上一身华美的衣裳。等他再次走进来时，模样英俊非凡。骄傲的公主一看见他，立刻便爱上了他。可帕佩拉雷洛看也不看她，只转向国王，说出了自己的决定。
        - id: ch05-b04
          speaker: paperarelloo
          text: 您好意把女儿嫁给我，我很感谢。可是，我家中已经有一位妻子，我爱她胜过爱您的女儿。现在我要回到她身边。临别以前，我祝愿您的耳朵、鼻子和手指全都回到原来的地方。
        - id: ch05-b05
          speaker: narrator
          text: 说完，他向众人告别，回到了自己的家，也回到了仙女新娘身边。从此，他们幸福地生活在一起，直到生命尽头。
        - id: ch05-b06
          speaker: narrator
          text: 这个故事选自《西西里童话》。
