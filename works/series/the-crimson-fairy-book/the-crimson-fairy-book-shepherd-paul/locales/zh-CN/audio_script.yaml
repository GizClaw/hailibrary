audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    paul:
      display_name: 保罗
      tts:
        delivery: 勇敢爽快，自信而直截了当，面对强敌毫不慌张
        timbre: 年轻有力
        pace: 明快
        pitch: 中音
    tree_comber:
      display_name: 梳树人
      tts:
        delivery: 粗豪自负，认输后爽朗坦率
        timbre: 粗犷浑厚
        pace: 中速
        pitch: 中低音
    stone_crusher:
      display_name: 碎石人
      tts:
        delivery: 强硬自信，说话简短有力
        timbre: 厚重结实
        pace: 中速
        pitch: 低音
    iron_kneader:
      display_name: 揉铁人
      tts:
        delivery: 沉着好胜，语气干脆
        timbre: 坚实低沉
        pace: 中速
        pitch: 低音
    dwarf_dragon:
      display_name: 尖胡子小矮人
      tts:
        delivery: 阴险傲慢，显出真身后凶狠而狂妄
        timbre: 尖利中带粗粝
        pace: 忽快忽慢
        pitch: 中低音
    six_headed_dragon:
      display_name: 六头龙
      tts:
        delivery: 残暴贪婪，把威胁说得轻慢而得意
        timbre: 低沉轰鸣
        pace: 偏慢
        pitch: 低音
    griffin:
      display_name: 鹰狮
      tts:
        delivery: 威严知恩，说话稳重而坦率
        timbre: 洪亮宽厚
        pace: 沉稳
        pitch: 低音
  chapters:
    - id: ch01
      title: 保罗与三个大力士
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一个牧羊人赶着羊群去吃草，在草地上捡到一个遭人遗弃的婴儿。也不知哪个狠心人嫌照料孩子麻烦，竟把他丢在那里。牧羊人喜欢孩子，便把婴儿抱回家，给他喝足了奶。孩子十四岁时，拔橡树已经像拔野草一样容易。牧羊人给他取名保罗。后来，保罗厌倦了家里的生活，决定到世上碰碰运气。
        - id: ch01-b02
          speaker: narrator
          text: 他走了许多英里，一直没见到什么稀奇事。到了林中一块空地，他才看见一个人正在梳树，仿佛那些树只是供人梳理的亚麻。
        - id: ch01-b03
          speaker: paul
          text: 早上好，朋友。说真的，你一定是个大力士！
        - id: ch01-b04
          speaker: narrator
          text: 那人停下手里的活儿，笑了。
        - id: ch01-b05
          speaker: tree_comber
          text: 我是梳树人。我这一生最大的心愿，就是跟牧羊人保罗摔一跤。
        - id: ch01-b06
          speaker: paul
          text: 那你的心愿可太容易实现了。我就是牧羊人保罗，现在就能跟你比试。
        - id: ch01-b07
          speaker: narrator
          text: 保罗一把抓住梳树人，猛地将他摔在地上，力气大得叫他的双腿一直陷到膝盖。可梳树人转眼就爬了起来。他抓住保罗还以颜色，把保罗摔得陷到腰间。接下来又轮到保罗。这一次，他把梳树人摔得只剩一颗脑袋露在地面上。
        - id: ch01-b08
          speaker: tree_comber
          text: 够了，够了！你果然厉害。我们交个朋友吧。
        - id: ch01-b09
          speaker: paul
          text: 很好。
        - id: ch01-b10
          speaker: narrator
          text: 两人结伴上路。走了一阵，他们遇见碎石人。那人捏石头就像捏坚果，一握便成粉末。
        - id: ch01-b11
          speaker: paul
          text: 早上好。你也一定是个大力士！
        - id: ch01-b12
          speaker: stone_crusher
          text: 我是碎石人。我最大的心愿，就是跟牧羊人保罗摔一跤。
        - id: ch01-b13
          speaker: paul
          text: 我就是保罗。来吧，现在就比。
        - id: ch01-b14
          speaker: narrator
          text: 两人马上比试起来。没过多久，碎石人便承认自己输了，请求跟他们一起走。三个人继续赶路，再往前不远，又见到揉铁人。他正把一块铁当成面团，在手里揉来揉去。
        - id: ch01-b15
          speaker: paul
          text: 早上好。看你的本事，准是个大力士。
        - id: ch01-b16
          speaker: iron_kneader
          text: 我是揉铁人。我正想跟牧羊人保罗较量。
        - id: ch01-b17
          speaker: paul
          text: 那就立刻开始。
        - id: ch01-b18
          speaker: narrator
          text: 这一次仍是保罗取胜。于是，四个人一同继续赶路。

    - id: ch02
      title: 尖胡子小矮人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 正午时，他们走进一片森林。保罗安排自己、碎石人和揉铁人去寻找野味，叫梳树人留下，好好准备一顿晚饭。梳树人生起火来，又煮又烤。饭菜就快熟时，一个留尖胡子的小矮人慢悠悠地走来。
        - id: ch02-b02
          speaker: dwarf_dragon
          text: 你煮的是什么？分我一点。
        - id: ch02-b03
          speaker: tree_comber
          text: 我可以往你背上赏一点，你要不要？
        - id: ch02-b04
          speaker: narrator
          text: 小矮人没有理会他的无礼，只在旁边耐心等着。饭菜一烧熟，他便突然将梳树人摔倒，把锅里的东西吃得精光，随后消失不见。梳树人觉得十分丢脸，只好再煮一些蔬菜。可是猎人们回来时，那些菜还硬邦邦的。他们埋怨梳树人的手艺太差，梳树人却不肯说出实情。
        - id: ch02-b05
          speaker: narrator
          text: 第二天留下的是碎石人，再下一天轮到揉铁人。小矮人每次都来，两人的遭遇跟梳树人一模一样。到了第四天，保罗终于开口。
        - id: ch02-b06
          speaker: paul
          text: 朋友们，你们每次都把饭做坏，这里面一定有缘故。今天你们去打猎，我来做饭。
        - id: ch02-b07
          speaker: narrator
          text: 三个人一边走，一边猜保罗会吃什么苦头。保罗把蔬菜放进锅里煨上，小矮人果然又来讨炖菜。
        - id: ch02-b08
          speaker: paul
          text: 走开！
        - id: ch02-b09
          speaker: narrator
          text: 保罗说着便抄起锅子。小矮人扑过来，伸手想抓他的衣领，保罗却反手揪住那把尖胡子，把他牢牢绑在一棵大树上，叫他动弹不得。保罗不慌不忙地回去继续做饭。三个猎人提早赶回来，都急着看他落得怎样，却发现晚饭已经齐齐整整地做好了。
        - id: ch02-b10
          speaker: paul
          text: 你们几个身子这么大，却一点用也没有，连一个小矮人都对付不了。吃完饭，我带你们看看我是怎么收拾他的。
        - id: ch02-b11
          speaker: narrator
          text: 可他们来到那棵树旁，树和小矮人都不见了。原来小矮人竟把整棵树连根拔起，拖在身后逃走。四个人循着树木划过地面的痕迹一路追赶，最后发现那道痕迹停在一个深洞前。
        - id: ch02-b12
          speaker: paul
          text: 他一定下去了，我去追。这里有篮子和绳子。你们把我放下去，等我再拉绳子，就立刻提篮子。
        - id: ch02-b13
          speaker: narrator
          text: 保罗跨进篮子，朋友们拉着绳子，将他一点点放下去。篮子终于碰到地面，他跳出来四下张望。眼前是一座美丽的山谷，到处是草地和溪流，旁边还立着一座宏伟的城堡。城门敞开着，他径直走了进去。一位美丽的姑娘迎面赶来，苦苦劝他赶快回去。城堡的主人是一条六头龙。它把姑娘从家里抢走，带到了这个地下世界。可不管姑娘怎样央求，保罗都不肯走。他说，自己不怕那条龙，也不在乎它长着多少颗脑袋。随后，他安稳地坐下，等龙回来。

    - id: ch03
      title: 地下的三座城堡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 不久，六头龙走进城堡。看见陌生人，它六张嘴里的长牙全都气得咯咯直响。
        - id: ch03-b02
          speaker: paul
          text: 我是牧羊人保罗，来这里跟你交手。我还赶时间，咱们马上开始吧。
        - id: ch03-b03
          speaker: six_headed_dragon
          text: 很好。反正我的晚饭已经来了。不过动手以前，先吃点东西开开胃。
        - id: ch03-b04
          speaker: narrator
          text: 龙抓起一块又一块巨石，像吃糕饼一样吃了个够，又递给保罗一块。保罗并不爱吃石头，却没有退缩。他拿出一把木刀，将巨石劈成两半，双手各抓一块，使尽全身力气砸向龙，一下打烂了两颗脑袋。龙发出震天的怒吼，朝他猛扑过来。保罗闪到一旁，挥剑横劈，又砍下两颗脑袋。接着，他抓住怪物的脖颈，把最后两颗脑袋狠狠撞碎在岩石上。
        - id: ch03-b05
          speaker: narrator
          text: 大姐得知龙已经死了，眼里含着泪水，向救命恩人道谢。可她又告诉保罗，自己的两个妹妹仍被另外两条龙控制着，那两条龙比这一条更加凶猛，也更加可怕。保罗发誓，在救出她们以前，自己的宝剑绝不入鞘。他请大姐跟自己一起走，为他带路。
        - id: ch03-b06
          speaker: narrator
          text: 大姐欣然答应。临走前，她交给保罗一根金杖，叫他敲打城堡。金杖刚落下，整座城堡便化作一只金苹果，被保罗装进口袋。
        - id: ch03-b07
          speaker: narrator
          text: 他们走了不远，就来到第二座城堡。一条十二头龙把二妹从家里抢来，一直囚禁在这里。二妹见到姐姐和保罗，欢喜极了。她拿出一件属于那条龙的衬衫，让保罗穿上。无论谁穿上它，力气都会变成原来的两倍。保罗才把衬衫套好，十二头龙便回来了，双方立刻交起手来。这一仗打得又久又苦。最后，宝剑和衬衫帮助保罗战胜了它，十二颗脑袋全都死气沉沉地落在地上。
        - id: ch03-b08
          speaker: narrator
          text: 保罗将第二座城堡也变成金苹果，装进口袋，带着姐妹俩寻找第三座城堡。他们没走多久便找到了。三妹就住在城墙里面。她年纪最小，也比两个姐姐更加美丽。她的丈夫是一条十八头龙。它每次离开地下世界，到地面上去时，只带一颗脑袋，还把那颗脑袋变成留尖胡子的小矮人模样，其余十七颗都留在家中。
        - id: ch03-b09
          speaker: narrator
          text: 保罗这才知道，那条龙就是自己绑过的小矮人。他恨不得立刻掐住对方的喉咙，可一想到十八颗脑袋，又知道必须小心。三妹拿来一件丝绸衬衫。穿上它，保罗的力气成了原来的十倍。
        - id: ch03-b10
          speaker: narrator
          text: 衬衫刚穿好，整座城堡便剧烈摇晃。十八头龙冲上台阶，闯进大厅。
        - id: ch03-b11
          speaker: paul
          text: 朋友，我们又见面了！还记得我吗？我是牧羊人保罗。今天我要跟你较量，也要救走你的妻子。
        - id: ch03-b12
          speaker: dwarf_dragon
          text: 哈，我也很高兴见到你。你杀的是我的两个兄弟，现在该用你的血还债了。
        - id: ch03-b13
          speaker: narrator
          text: 说完，龙走进自己的房间，想找那件能增加力气的衬衫，再喝些魔酒。可衬衫已经穿在保罗身上。至于魔酒，三妹早舀出一杯给保罗喝了，又把酒桶里剩下的全都放光。龙发现两样东西都没了，心里有些害怕。但它转眼想起自己还有十八颗脑袋，胆子立刻又壮了起来。
        - id: ch03-b14
          speaker: dwarf_dragon
          text: 来吧！
        - id: ch03-b15
          speaker: narrator
          text: 龙直立起来，准备让所有脑袋一齐扑向保罗。保罗却抢先跳到它身下，挥剑向上一削。六颗脑袋顿时滚落下来，偏偏那还是龙最好的六颗脑袋。没过多久，其余十二颗也全都躺到了旁边。保罗拿金杖敲过城堡，将它也变成一只苹果，装进口袋。随后，他与三姐妹一同走向通往地面的洞口。

    - id: ch04
      title: 鹰狮的报答
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 篮子仍吊在绳子下，却只能坐下三位姑娘。保罗让她们先上去，再三嘱咐她们到了地面以后，一定把篮子重新放下来接他。不幸的是，三个朋友一看见姑娘们无与伦比的美貌，便把保罗忘得干干净净。他们没有放下篮子，反而直接带着三位姑娘去了遥远的国家。三姐妹刚刚逃出龙穴，处境竟没有比从前好多少。
        - id: ch04-b02
          speaker: narrator
          text: 留在地下的保罗认定三姐妹忘恩负义，气得发誓一定要报仇。他开始四处寻找回到地面的路，可这件事实在太难了。他在地下走了一个月，又一个月，又一个月。到了最后，他离自己的目标仿佛还和刚出发时一样遥远。
        - id: ch04-b03
          speaker: narrator
          text: 终于有一天，他从一头巨鹰狮的巢旁经过。鹰狮外出了，几只幼崽独自留在巢中。保罗刚走到近前，头顶一团云忽然爆开，落下的不是雨，而是烈火。小鹰狮眼看就要被烧死，保罗连忙展开斗篷，盖住巢穴，救下了它们。鹰狮爸爸回来，听孩子们说完经过，一刻也没有耽搁，立刻追上保罗，问该怎样报答他的恩情。
        - id: ch04-b04
          speaker: paul
          text: 请把我带到地面上去。
        - id: ch04-b05
          speaker: narrator
          text: 鹰狮答应了。可是从地下飞到地面的路途十分遥远，动身以前，他先去找来沿途要吃的食物。
        - id: ch04-b06
          speaker: griffin
          text: 骑到我背上。我把头转向右边，你就从右边挂着的牛身上割一片肉，放进我嘴里。我把头转向左边，你就从左边的酒桶里舀一杯酒，倒进我的喉咙。
        - id: ch04-b07
          speaker: narrator
          text: 保罗骑到鹰狮背上，就这样一边喂它吃肉喝酒，一边向上飞。他们整整飞了三天三夜。第四天早晨，鹰狮终于落到地面，地点正好就在保罗那三个朋友定居的城外。保罗向鹰狮道过谢，又与它告别，随后回到了家。

    - id: ch05
      title: 三只金苹果
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 保罗实在太累，起初什么也做不了，只能先好好睡上一觉。等体力恢复，他立刻去找那三个背信弃义的朋友。他们一直以为保罗再也回不来，更不可能当面斥责他们的恶行。如今一看见他，三个人几乎吓死。
        - id: ch05-b02
          speaker: paul
          text: 你们心里明白自己该受什么惩罚。从今以后，我再也不想看见你们。走吧！
        - id: ch05-b03
          speaker: narrator
          text: 保罗从口袋里拿出三只金苹果，把它们放到三个最美丽的地方，再用金杖一一敲过。苹果立刻恢复原形，变回三座城堡。他把两座送给两位姐姐，自己留下第三座，又娶了最小的妹妹。从此，他们一直住在那里，直到今天。
