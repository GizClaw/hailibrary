  chapters:
    - id: ch01
      title: The Strong Men of the Road
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a shepherd was leading his flock to pasture when he found a tiny baby lying alone in a meadow. Some wicked person had left the child there rather than take the trouble to care for him.
        - id: ch01-b02
          speaker: narrator
          text: The shepherd loved children, so he carried the baby home and gave him plenty of milk. He named the boy Paul. By the time Paul was fourteen, he could pull up oak trees as easily as other people pulled weeds.
        - id: ch01-b03
          speaker: narrator
          text: At last, Paul grew tired of staying at home. He set out into the world to seek his fortune.
        - id: ch01-b04
          speaker: narrator
          text: He walked many miles without seeing anything remarkable. Then, in a clearing in the woods, he found a man combing trees as though they were bundles of flax.
        - id: ch01-b05
          speaker: paul
          text: Good morning, friend. You must be very strong indeed!
        - id: ch01-b06
          speaker: narrator
          text: The man stopped working and laughed proudly.
        - id: ch01-b07
          speaker: tree_comber
          text: I am Tree Comber. More than anything in the world, I want to wrestle Shepherd Paul.
        - id: ch01-b08
          speaker: paul
          text: Then your wish has come true easily. I am Shepherd Paul, and I am ready to wrestle you now.
        - id: ch01-b09
          speaker: narrator
          text: Paul seized Tree Comber and hurled him down so hard that he sank into the earth up to his knees. Tree Comber sprang out, caught Paul, and threw him in turn. Paul sank up to his waist.
        - id: ch01-b10
          speaker: narrator
          text: Then Paul took his next turn. This time, Tree Comber went into the ground all the way to his neck.
        - id: ch01-b11
          speaker: tree_comber
          text: Enough! I can see you are the better man. Let us be friends.
        - id: ch01-b12
          speaker: paul
          text: Very well.
        - id: ch01-b13
          speaker: narrator
          text: So the two continued together. Before long, they met a man crushing stones to powder in his hands as though the stones were nuts.
        - id: ch01-b14
          speaker: paul
          text: Good morning. You look like a very strong fellow!
        - id: ch01-b15
          speaker: stone_crusher
          text: I am Stone Crusher, and my greatest wish is to wrestle Shepherd Paul.
        - id: ch01-b16
          speaker: paul
          text: Your wish is granted. I am Shepherd Paul, so let us begin.
        - id: ch01-b17
          speaker: narrator
          text: They wrestled, and before long Stone Crusher admitted that Paul had beaten him. He asked to join them, and the three went on together.
        - id: ch01-b18
          speaker: narrator
          text: A little farther on, they came upon a man kneading iron in his hands as if it were bread dough.
        - id: ch01-b19
          speaker: paul
          text: Good morning. You must be strong too.
        - id: ch01-b20
          speaker: iron_kneader
          text: I am Iron Kneader, and I want to fight Shepherd Paul.
        - id: ch01-b21
          speaker: paul
          text: Then we can start right away.
        - id: ch01-b22
          speaker: narrator
          text: Once again, Paul proved the stronger. After that, all four men traveled on together.

    - id: ch02
      title: The Dwarf Beneath the Earth
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At midday, the four friends entered a forest. Paul stopped and divided the work.
        - id: ch02-b02
          speaker: paul
          text: Three of us will hunt for game. Tree Comber, you stay here and make us a good supper.
        - id: ch02-b03
          speaker: narrator
          text: Tree Comber began boiling and roasting the food. Just as it was nearly ready, a little dwarf with a pointed beard wandered up.
        - id: ch02-b04
          speaker: third_dragon
          text: What are you cooking? Give me some.
        - id: ch02-b05
          speaker: tree_comber
          text: I will give you something across your back, if that is what you want.
        - id: ch02-b06
          speaker: narrator
          text: The dwarf ignored the insult and waited. As soon as supper was cooked, he threw Tree Comber to the ground, emptied the saucepan, and vanished.
        - id: ch02-b07
          speaker: narrator
          text: Tree Comber was ashamed. He hurried to boil more vegetables, but they were still hard when the hunters returned. His friends complained about the meal, yet he said nothing about the dwarf.
        - id: ch02-b08
          speaker: narrator
          text: Stone Crusher stayed behind the next day, and Iron Kneader took his turn after that. Each time the dwarf appeared, ate the food, and treated the cook no better than he had treated Tree Comber.
        - id: ch02-b09
          speaker: narrator
          text: On the fourth day, Paul spoke to his companions.
        - id: ch02-b10
          speaker: paul
          text: Friends, there must be a reason your cooking has been so poor. You three go hunting today. I will stay here.
        - id: ch02-b11
          speaker: narrator
          text: The others went off, amusing themselves with thoughts of what would happen to Paul. He put the vegetables on at once. They had only just begun to simmer when the pointed-bearded dwarf returned and asked for stew.
        - id: ch02-b12
          speaker: paul
          text: Be off with you!
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: Paul snatched up the saucepan. The dwarf reached for his collar, but Paul caught him by the beard and tied him so tightly to a great tree that he could not move. Then Paul quietly finished cooking.
        - id: ch02-b14
          speaker: narrator
          text: The hunters came back early, eager to see how he had managed. To their surprise, supper was waiting.
        - id: ch02-b15
          speaker: paul
          text: You three great useless fellows could not even outwit one little dwarf. Finish eating, and I will show you what I did with him.
        - id: ch02-b16
          speaker: narrator
          text: But when they reached the place, both the dwarf and the tree were gone. The little fellow had torn the tree out by its roots and run away with it dragging behind him.
        - id: ch02-b17
          speaker: narrator
          text: The four friends followed the marks left by the tree until the trail ended at a deep hole.
        - id: ch02-b18
          speaker: paul
          text: He must have gone down here, and I am going after him. I can sit in that basket while you lower me on the rope. When I tug the rope again, pull the basket up at once.
        - id: ch02-b19
          speaker: narrator
          text: Paul climbed into the basket, and his friends lowered him into the darkness.

    - id: ch03
      title: The First Two Castles
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last the basket touched the ground. Paul climbed out and found himself in a beautiful valley filled with streams and meadows. Nearby stood a splendid castle with its door open.
        - id: ch03-b02
          speaker: narrator
          text: He walked inside. A lovely maiden met him and begged him to turn back. A six-headed dragon owned the castle. It had stolen her from her home and carried her down to this place beneath the earth.
        - id: ch03-b03
          speaker: eldest_sister
          text: Please go back before the dragon finds you.
          emotion: fearful
        - id: ch03-b04
          speaker: paul
          text: I am not afraid of that dragon, no matter how many heads it has. I will wait here for it.
        - id: ch03-b05
          speaker: narrator
          text: Paul sat down calmly. Soon the dragon entered. At the sight of the stranger, the long teeth in all six heads chattered with anger.
        - id: ch03-b06
          speaker: paul
          text: I am Shepherd Paul. I came here to fight you, and I am in a hurry, so we should begin now.
        - id: ch03-b07
          speaker: first_dragon
          text: Very well. I am sure of my supper. But first, let us eat a mouthful to sharpen our appetites.
        - id: ch03-b08
          speaker: narrator
          text: The dragon ate several enormous boulders as though they were cakes. When it had finished, it offered one to Paul.
        - id: ch03-b09
          speaker: narrator
          text: Paul had no taste for boulders. He cut one in half with a wooden knife, grabbed both pieces, and hurled them with all his strength. Two of the dragon's heads were smashed.
        - id: ch03-b10
          speaker: narrator
          text: The dragon gave a mighty roar and rushed at him. Paul sprang aside and cut off two more heads with one sweeping blow. Then he caught the monster by the neck and dashed its last two heads against the rock.
        - id: ch03-b11
          speaker: narrator
          text: When the maiden learned that the dragon was dead, she thanked Paul with tears in her eyes. Then she told him that her two younger sisters were prisoners of dragons even more terrible than this one.
        - id: ch03-b12
          speaker: paul
          text: My sword will not rest in its sheath until your sisters are free. Come with me and show me the way.
        - id: ch03-b13
          speaker: narrator
          text: The maiden gladly agreed. Before they left, she handed Paul a golden rod and told him to strike the castle with it. He did, and the whole castle became a golden apple. Paul slipped it into his pocket, and they began their search.
        - id: ch03-b14
          speaker: narrator
          text: They soon reached the castle where the second sister was held by a dragon with twelve heads. This dragon had also stolen its prisoner from her home. The girl was overjoyed to see her sister and Paul.
        - id: ch03-b15
          speaker: narrator
          text: She brought Paul a shirt that belonged to the dragon. Anyone who wore it became twice as strong as before. Paul had barely put it on when the dragon returned and attacked.
        - id: ch03-b16
          speaker: narrator
          text: The struggle was long and hard. But Paul had his sword and the dragon's shirt to help him. In the end, all twelve heads lay dead on the ground.
        - id: ch03-b17
          speaker: narrator
          text: Paul turned the second castle into another apple and put it in his pocket. Then he and the two sisters set out to find the third castle.

    - id: ch04
      title: The Dragon with Eighteen Heads
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Before long, they found the last castle. Inside was the third sister, younger and prettier than the other two. Her dragon husband had eighteen heads, though he did not always carry every one of them.
        - id: ch04-b02
          speaker: narrator
          text: Whenever the dragon went from the lower world up to the earth, it left all those heads at home except one. It changed that single head to look like a little dwarf with a pointed beard.
        - id: ch04-b03
          speaker: narrator
          text: Paul now understood that this terrible dragon was the dwarf he had tied to the tree. More than ever, he wanted to leap at its throat. Still, the thought of fighting eighteen heads warned him to be careful.
        - id: ch04-b04
          speaker: narrator
          text: The youngest sister brought him a silk shirt that would make him ten times stronger. He had scarcely put it on when the entire castle began to shake. The dragon flew up the steps and into the hall.
        - id: ch04-b05
          speaker: paul
          text: Well, my friend, here we are again! Do you remember me? I am Shepherd Paul. I have come to wrestle you and free your wife.
        - id: ch04-b06
          speaker: third_dragon
          text: I am glad you came back. You killed my two brothers, and now I will repay their deaths with your blood.
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: The dragon went to its room for the silk shirt and a drink of magic wine. But Paul was wearing the shirt. The youngest sister had already given Paul one cup of the wine and let the rest drain out of the barrel.
        - id: ch04-b08
          speaker: narrator
          text: For a moment, the dragon was afraid. Then it remembered its eighteen heads and found its courage again.
        - id: ch04-b09
          speaker: third_dragon
          text: Come on, then!
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: The dragon reared up, ready to strike Paul with all its heads at once. Paul jumped underneath and swung his sword upward. Six heads rolled to the floor, and they were the finest of them all.
        - id: ch04-b11
          speaker: narrator
          text: The other twelve soon lay beside them. Paul struck the third castle with the golden rod, turned it into an apple, and tucked it into his pocket. Then he and the three sisters started back toward the opening to the upper world.
        - id: ch04-b12
          speaker: narrator
          text: The basket still hung from the rope, but it had room for only the three sisters. Paul placed them inside and sent them up first. He told them to be sure to lower the basket again for him.
        - id: ch04-b13
          speaker: narrator
          text: When Paul's friends saw the sisters, their beauty made them forget all about him. They carried the young women away to a distant country, leaving the sisters little better off than before.
        - id: ch04-b14
          speaker: narrator
          text: Far below, Paul was furious at the sisters' ingratitude and swore to take revenge. Then he began searching for some other path back to earth. It was not easy. For months and months and months, he wandered underground, yet seemed no closer to escape than when he began.

    - id: ch05
      title: The Griffin's Flight
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One day, Paul passed the nest of a huge griffin. The parent had gone away and left its young alone. Just then, a cloud burst overhead, but it poured fire instead of rain.
        - id: ch05-b02
          speaker: narrator
          text: The young griffins would have died in the flames. Paul spread his cloak over the nest and saved them.
        - id: ch05-b03
          speaker: narrator
          text: When their father returned, the young ones told him what Paul had done.
        - id: ch05-b04
          speakers: [griffin_child_1, griffin_child_2, griffin_child_3]
          ensemble: chorus
          text: A man covered our nest with his cloak and saved us from the fire!
        - id: ch05-b05
          speaker: narrator
          text: The griffin immediately flew after Paul and asked how it could reward his kindness.
        - id: ch05-b06
          speaker: paul
          text: Carry me up to the earth.
        - id: ch05-b07
          speaker: narrator
          text: The griffin agreed. Because the journey would be long, it first went to gather food for the flight. Then it returned to Paul.
        - id: ch05-b08
          speaker: griffin
          text: Climb onto my back. When I turn my head to the right, cut a slice from the bullock hanging there and put it in my mouth. When I turn to the left, draw a cup of wine from that barrel and pour it down my throat.
        - id: ch05-b09
          speaker: narrator
          text: Paul climbed on, and the griffin carried him upward. For three days and three nights they flew, while Paul gave it meat and wine whenever it turned its head.
        - id: ch05-b10
          speaker: narrator
          text: On the fourth morning, the griffin landed outside the very city where Paul's friends had gone to live.
        - id: ch05-b11
          speaker: paul
          text: Thank you, my friend. Farewell.
        - id: ch05-b12
          speaker: narrator
          text: The griffin flew home, and Paul went into the city.

    - id: ch06
      title: The Three Golden Apples
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At first, Paul was so tired that he could do nothing but sleep. Once he had rested, he went to find the three men who had betrayed him.
        - id: ch06-b02
          speaker: narrator
          text: Tree Comber, Stone Crusher, and Iron Kneader nearly died of fright when Paul appeared. They had never expected him to return and accuse them of their wickedness.
        - id: ch06-b03
          speaker: paul
          text: You know what you deserve. Go away, and never let me see you again.
        - id: ch06-b04
          speaker: narrator
          text: Next, Paul took the three golden apples from his pocket. He chose the three prettiest places he could find and set down one apple in each place.
        - id: ch06-b05
          speaker: narrator
          text: He tapped the apples with the golden rod, and at once they became castles again. Paul gave two castles to the two elder sisters.
        - id: ch06-b06
          speaker: narrator
          text: He kept the third castle for himself and the youngest sister. Paul married her, and there they are living still.
