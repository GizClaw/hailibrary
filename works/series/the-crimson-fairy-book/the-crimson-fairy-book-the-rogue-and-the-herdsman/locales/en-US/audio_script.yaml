audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and storylike
        timbre: clear and mellow
        pace: measured
        pitch: medium
    young_man:
      display_name: The Young Man
      tts:
        delivery: sly, stubborn, and quick-thinking
        timbre: youthful and clear
        pace: lively
        pitch: medium
    father:
      display_name: The Father
      tts:
        delivery: weary, cautious, and plainspoken
        timbre: aged and dry
        pace: measured
        pitch: low
    chief_herdsman:
      display_name: The Chief Herdsman
      tts:
        delivery: practical, stern, and authoritative
        timbre: rugged and resonant
        pace: steady
        pitch: low
  chapters:
    - id: ch01
      title: Sent Out to Work
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, an old man lived with his wife and son in a tiny cottage near the king's palace. The son was terribly lazy. He would not do a single bit of work. He would not even watch the family's one cow. He let her mind herself while he slept in the sun.
        - id: ch01-b02
          speaker: narrator
          text: His father put up with this for a long time. He hoped the boy would grow wiser as he grew older. Still, nothing at all changed. At last, the old man's patience ran out. He told his son he could not sit idle at home any longer. He must go into the world and seek his fortune.
        - id: ch01-b03
          speaker: narrator
          text: The young man saw there was no help for it. He filled a wallet with food, slung it over his shoulder, and set off. At last, he reached a large house and knocked at the door. An old man opened it.
        - id: ch01-b04
          speaker: chief_herdsman
          text: What do you want?
        - id: ch01-b05
          speaker: young_man
          text: My father sent me away because I'm lazy and foolish. I need somewhere to sleep tonight.
        - id: ch01-b06
          speaker: chief_herdsman
          text: You may stay. But tomorrow I'll put you to work. I am the king's chief herdsman, you see.
        - id: ch01-b07
          speaker: narrator
          text: The young man said nothing. If people meant to make him work after all, he thought, he might as well have stayed at home. Still, he saw no other way to get a bed for the night, so he went slowly inside. The herdsman's wife and two daughters were sitting at supper, and they invited him to join them. No one said any more about work. When the meal was over, they all went to bed.
        - id: ch01-b08
          speaker: narrator
          text: The next morning, when the young man was dressed, the herdsman called him over.
        - id: ch01-b09
          speaker: chief_herdsman
          text: Listen carefully. I'll tell you what your work is.
        - id: ch01-b10
          speaker: young_man
          text: What do I have to do?
        - id: ch01-b11
          speaker: chief_herdsman
          text: You must look after two hundred pigs.
        - id: ch01-b12
          speaker: young_man
          text: Oh, I know how to do that.
        - id: ch01-b13
          speaker: chief_herdsman
          text: This time, you must do it properly.
        - id: ch01-b14
          speaker: narrator
          text: The herdsman took him to the pigs and told him to drive them into the woods on the mountainside. The young man did so. But when they reached the foot of the mountain, the pigs went wild. They nearly scattered for good. Luckily, they ran toward a narrow ravine, and from there the young man easily drove them straight to his father's cottage.

    - id: ch02
      title: The Pigs in the Swamp
      blocks:
        - id: ch02-b01
          speaker: father
          text: Where did all these pigs come from? How did you get them?
          emotion: surprised
        - id: ch02-b02
          speaker: young_man
          text: They belong to the king's chief herdsman. He told me to watch them, but I knew I couldn't. So I brought them to you. Make the most of your luck. Kill them and hang them up at once.
        - id: ch02-b03
          speaker: father
          text: What are you saying? If I did that, they would put us both to death!
          emotion: fearful
        - id: ch02-b04
          speaker: young_man
          text: No, no. Do as I say. I'll find some way out of it.
        - id: ch02-b05
          speaker: narrator
          text: In the end, the son got his way. They killed the pigs and hung them up, laying them side by side in a long row. Then the young man cut off every tail. He tied them all together with a piece of cord and swung the bundle over his back.
        - id: ch02-b06
          speaker: narrator
          text: He returned to the place where the pigs should have been feeding. Nearby was a small swamp, and it was just what he needed. He found a large stone, fastened the cord to it, and sank it in the water. Then, one by one, he carefully arranged the tails so that only their tips showed above the surface.
        - id: ch02-b07
          speaker: narrator
          text: Once everything was ready, he hurried back to his master wearing such a miserable face that the herdsman knew at once something dreadful had happened.
        - id: ch02-b08
          speaker: chief_herdsman
          text: Where are the pigs?
        - id: ch02-b09
          speaker: young_man
          text: Oh, don't ask me about them! I can hardly bear to tell you. The moment they reached the field, they went mad and ran every way at once. I chased them back and forth, but whenever I caught one, another escaped. I was desperate. At last I gathered them together and started to bring them home. Then they suddenly rushed downhill into the swamp. They vanished completely. Only the tips of their tails were left above the water. You can see them yourself.
        - id: ch02-b10
          speaker: chief_herdsman
          text: You have made that story up very neatly.
        - id: ch02-b11
          speaker: young_man
          text: No, every word is true. Come with me, and I'll prove it.
        - id: ch02-b12
          speaker: narrator
          text: They went to the swamp together. Sure enough, the tips of the tails stuck out of the water. The herdsman grabbed the nearest one and pulled with all his strength. It would not move at all, because the stone and cord held the whole bundle fast beneath the water. He called the young man to help him pull. But the two of them had no more success than the herdsman had alone.
        - id: ch02-b13
          speaker: chief_herdsman
          text: So your story was true after all. What a strange thing! This was not your fault, and I must bear the loss as well as I can. Come home now. It is time for supper.

    - id: ch03
      title: The Sheep in the Sky
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next morning, the herdsman gave the young man another task.
        - id: ch03-b02
          speaker: chief_herdsman
          text: Today you must take one hundred sheep out to graze. Be careful that no harm comes to them.
        - id: ch03-b03
          speaker: young_man
          text: I'll do my best.
        - id: ch03-b04
          speaker: narrator
          text: He opened the gate of the fold where the sheep had spent the night and drove the flock into the meadow. Before long, the sheep went as wild as the pigs had. They scattered in every direction. No matter how hard he ran or how often he turned them, he could not gather them. Then he thought that this trouble must be his punishment for being too lazy to watch his father's one cow.
        - id: ch03-b05
          speaker: narrator
          text: At last, the sheep tired of running. The young man managed to bring them together and drove them, just as before, straight to his father's house.
        - id: ch03-b06
          speaker: father
          text: Whose sheep are these? What are they doing here?
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: His son explained. When the tale was over, the father shook his head.
        - id: ch03-b08
          speaker: father
          text: Stop behaving this way. Take those sheep back to your master.
        - id: ch03-b09
          speaker: young_man
          text: No, no. I'm not foolish enough for that! We'll kill them and eat them for dinner.
        - id: ch03-b10
          speaker: father
          text: You will lose your life if you do.
        - id: ch03-b11
          speaker: young_man
          text: I'm not so sure. Anyway, for once I mean to have my way.
        - id: ch03-b12
          speaker: narrator
          text: He killed all the sheep and laid them on the grass. From the leading ram, the one with bells around its horns, he cut off the head. Then he carried it back to the grazing place.
        - id: ch03-b13
          speaker: narrator
          text: He had noticed a high rock at the grazing place. Halfway up was a patch of green grass, with two or three thick bushes growing along its edge. The young man climbed the rock with great difficulty. He tied the ram's head among the bushes with a cord, leaving only the tips of its bell-hung horns in sight. A soft breeze stirred the branches, moving the hidden head so that the bells rang gently.
        - id: ch03-b14
          speaker: narrator
          text: When everything suited him, he hurried to his master and ran panting up the steps.
        - id: ch03-b15
          speaker: chief_herdsman
          text: Where are the sheep?
        - id: ch03-b16
          speaker: young_man
          text: Oh, don't ask me! It's a miracle that I made it back alive.
        - id: ch03-b17
          speaker: chief_herdsman
          text: Tell me what happened, right now.
        - id: ch03-b18
          speaker: narrator
          text: The young man began to sob and stammer.
        - id: ch03-b19
          speaker: young_man
          text: I... I hardly know how to say it. They were so... so troublesome. I couldn't control them at all. They ran everywhere, and I chased them until I nearly died from weariness. Then I heard a noise. At first, I thought it was the wind. But it was the sheep. Right before my eyes, they were carried straight up into the air. I stood there as still as stone. All I could hear was the ringing of the bells on the ram that led them.
        - id: ch03-b20
          speaker: chief_herdsman
          text: That is a lie from start to finish.
        - id: ch03-b21
          speaker: young_man
          text: No, it is as true as the sun in heaven.
        - id: ch03-b22
          speaker: chief_herdsman
          text: Then prove it to me.
        - id: ch03-b23
          speaker: young_man
          text: All right. Come with me.
        - id: ch03-b24
          speaker: narrator
          text: By then evening had come, and dusk was falling. The young man led the herdsman to the foot of the great rock. It was so dark that they could hardly see anything above them. Still, the soft ringing of sheep bells drifted down from the bushes. The herdsman knew those bells. He had hung them himself on the horns of the ram that led his flock.
        - id: ch03-b25
          speaker: young_man
          text: Do you hear them?
        - id: ch03-b26
          speaker: chief_herdsman
          text: Yes, I hear them. You told the truth, and I cannot blame you for what happened. I must bear this loss as well as I can.
        - id: ch03-b27
          speaker: narrator
          text: The herdsman turned for home. The young man followed, very pleased with his own cleverness.

    - id: ch04
      title: The Golden-Horned Ox
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next morning, the herdsman spoke to him again.
        - id: ch04-b02
          speaker: chief_herdsman
          text: I would not be surprised if my other tasks were too hard for you, or if you had grown tired of them. Today, though, I have something very easy. You must watch forty oxen. Take great care of them, because one has gold-tipped horns and hoofs. The king counts that ox among his greatest treasures.
        - id: ch04-b03
          speaker: narrator
          text: The young man drove the oxen into the meadow. As soon as they arrived, they began racing in all directions, just like the pigs and sheep. The precious ox was the wildest of them all.
        - id: ch04-b04
          speaker: narrator
          text: The young man stood watching, with no idea what to do next. Then he remembered that his father's cow had been put out to graze not far away. At once he made such a din that he frightened the oxen and drove them onto the path he wanted. When they heard the cow lowing ahead of them, they galloped even faster. Soon the whole herd reached his father's house.
        - id: ch04-b05
          speaker: narrator
          text: The old man stood outside his cottage. Around the bend came the great herd, with his son and his own cow leading the way.
        - id: ch04-b06
          speaker: father
          text: Whose cattle are these? Why have you brought them here?
        - id: ch04-b07
          speaker: narrator
          text: His son told him the story.
        - id: ch04-b08
          speaker: father
          text: Take them back to your master as quickly as you can.
        - id: ch04-b09
          speaker: narrator
          text: The young man only laughed.
        - id: ch04-b10
          speaker: young_man
          text: No, no. They're a present for you! They'll make you fat!
        - id: ch04-b11
          speaker: narrator
          text: For a long while, the father refused to have anything to do with such a wicked scheme. But his son kept talking until, at last, the old man gave in. They killed the oxen just as they had killed the pigs and sheep. The king's treasured ox, with gold on its horns and hoofs, came last of all.
        - id: ch04-b12
          speaker: narrator
          text: The son had a rope ready. He threw it around the animal's horns and tried to drag the ox to the ground. But the ox was stronger than the rope and soon tore it to pieces. Then it dashed away into the woods with the young man close behind. Over hedges and across ditches they went until they reached a rocky pass at the edge of the herdsman's land.
        - id: ch04-b13
          speaker: narrator
          text: The ox thought it was safe there and stopped to rest. That gave the young man time to catch up. He still did not know how to seize such a strong animal, so he gathered every piece of wood he could find. By then the ox had fallen asleep. He built a ring of fire around it and set the wood alight. The animal did not wake until the flames caught its head, and then it was too late to escape. The young man stayed and watched. Afterward, he ran home to his master.
        - id: ch04-b14
          speaker: chief_herdsman
          text: You have been gone a long time. Where are the cattle?
        - id: ch04-b15
          speaker: narrator
          text: The young man gasped as though he could not speak. At last, he forced out an answer.
        - id: ch04-b16
          speaker: young_man
          text: It is the same thing again! The oxen are gone... gone!
        - id: ch04-b17
          speaker: chief_herdsman
          text: G-g-gone? You scoundrel! You're lying!
          emotion: angry
        - id: ch04-b18
          speaker: young_man
          text: I am telling you exactly what happened. As soon as we reached the meadow, they went so wild that I couldn't hold them together. The big ox broke away, and the rest followed. Every one of them vanished down a deep hole in the earth. I thought I heard bellowing. I even thought I knew the voice of the golden-horned ox. But when I reached the place, I could see and hear nothing inside the hole. There were only marks of fire all around it.
        - id: ch04-b19
          speaker: chief_herdsman
          text: You wretch! Even if you told the truth before, you are lying now.
          emotion: angry
        - id: ch04-b20
          speaker: young_man
          text: No, master. I am telling the truth. Come and look for yourself.
        - id: ch04-b21
          speaker: chief_herdsman
          text: If you have tricked me, you are a dead man.
        - id: ch04-b22
          speaker: narrator
          text: They went out together. At the rocky pass, the young man pointed to the blackened ground. The herdsman saw the marks of a fire that seemed to have burst from beneath the earth.
        - id: ch04-b23
          speaker: young_man
          text: What do you call that?
        - id: ch04-b24
          speaker: chief_herdsman
          text: Wonder upon wonder! You truly did speak the truth. I cannot blame you, though I will have to pay my royal master dearly for that ox. Come, let us go home. I will never make you herd cattle again. From now on, I'll give you easier work.

    - id: ch05
      title: The Ten Scythes
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As they walked home, the herdsman decided what the easier work would be.
        - id: ch05-b02
          speaker: chief_herdsman
          text: I know just the task for you. It is so simple that you cannot go wrong. Make me ten scythes, one for each man. I want one of my meadows mown tomorrow.
        - id: ch05-b03
          speaker: narrator
          text: The young man's heart sank. No one had ever taught him to work as a smith or a joiner. He did not dare refuse, so he smiled and nodded.
        - id: ch05-b04
          speaker: narrator
          text: He went slowly and sadly to bed, but he could not sleep. Hour after hour, he lay wondering how ten scythes could possibly be made. All the skill and cunning that had helped him escape his earlier tasks was useless now. He thought until late in the night, and at last he saw only one way out.
        - id: ch05-b05
          speaker: narrator
          text: He listened carefully until he was sure the whole house was still. Then he slipped away in the darkness and went back to his parents. He told them the entire story, from the pigs to the order for ten scythes. When they had heard everything, his parents hid him in a place where no one could find him.
        - id: ch05-b06
          speaker: narrator
          text: Time passed. The young man stayed at home, doing everything his father and mother asked of him. He no longer lay idle while work waited. In fact, he became very different from the lazy fellow who had first gone out into the world. Then one day, he told his father that he wanted to marry and have a home of his own.
        - id: ch05-b07
          speaker: young_man
          text: When I worked for the king's chief herdsman, I saw his daughter. I mean to try to win her for my wife.
        - id: ch05-b08
          speaker: father
          text: If you try that, it will cost you your life.
        - id: ch05-b09
          speaker: young_man
          text: Well, I'll do my best. But first, give me the sword hanging over your bed.
        - id: ch05-b10
          speaker: narrator
          text: The old man could not see how a sword would help. Still, he took it down and gave it to his son. The young man set off.

    - id: ch06
      title: A Bride and a Kingdom
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Late that evening, he reached the herdsman's house and knocked. A little boy opened the door.
        - id: ch06-b02
          speaker: young_man
          text: I want to speak with your master.
        - id: ch06-b03
          speaker: narrator
          text: The boy carried the message, and the herdsman came.
        - id: ch06-b04
          speaker: chief_herdsman
          text: So it is you? You may sleep here tonight if you want.
        - id: ch06-b05
          speaker: narrator
          text: The young man drew his sword.
        - id: ch06-b06
          speaker: young_man
          text: I came for more than a bed. Promise me your youngest daughter as my wife, or I will stab you through the heart.
        - id: ch06-b07
          speaker: narrator
          text: What could the poor herdsman do with a sword pointed at him? He gave the promise. Then he fetched his youngest daughter and brought her before the young man. She seemed quite pleased with the match that had been proposed, and she gave the young man her hand.
        - id: ch06-b08
          speaker: narrator
          text: The young man went home to his parents and told them to make everything ready to welcome his bride. The wedding took place. When it was over, he told his new father-in-law the truth about all those vanished animals. He confessed what he and his father had really done with the pigs, the sheep, and the cattle.
        - id: ch06-b09
          speaker: narrator
          text: Before long, the story reached the king's ears. The king thought that a man clever enough to invent such tricks was exactly the man he needed to govern the country. So he made the young man his minister. From that time on, after the king himself, no one in the land was greater than he was.
