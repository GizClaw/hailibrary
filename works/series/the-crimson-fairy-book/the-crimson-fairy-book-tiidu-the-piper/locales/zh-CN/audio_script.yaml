audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而带几分诙谐，像在讲一则古老的欧洲童话
        timbre: 温暖清亮
        pace: 舒缓，转折处有自然停顿
        pitch: 中音
    tiidu:
      display_name: 蒂杜
      tts:
        delivery: 年轻机灵，早年懒散傲慢，历经磨难后多了真诚与分寸
        timbre: 清朗灵活
        pace: 中速
        pitch: 中音
    old_man:
      display_name: 老人
      tts:
        delivery: 亲切睿智，劝诫时直率有力，又带一点幽默
        timbre: 苍老温厚
        pace: 中速偏慢
        pitch: 中低音
    young_sailor:
      display_name: 年轻水手
      tts:
        delivery: 热心大胆，说起计策时神秘而利落
        timbre: 年轻爽朗
        pace: 中速偏快
        pitch: 中音
    sailor_1:
      display_name: 水手甲
      tts:
        delivery: 粗犷直率，惊讶时声音发颤
        timbre: 洪亮粗厚
        pace: 中速
        pitch: 中低音
    sailor_2:
      display_name: 水手乙
      tts:
        delivery: 朴实谨慎，随同伴开口时干脆
        timbre: 略带沙哑
        pace: 中速
        pitch: 中音
    captain:
      display_name: 船长
      tts:
        delivery: 老练果断，严厉中不失善意
        timbre: 低沉有力
        pace: 中速偏慢
        pitch: 低音
    merchant:
      display_name: 富商
      tts:
        delivery: 讲究体面，吩咐人时不容争辩
        timbre: 稳重浑厚
        pace: 中速
        pitch: 中低音
    citizen_1:
      display_name: 市民甲
      tts:
        delivery: 热情直爽，赞叹时兴致勃勃
        timbre: 明亮
        pace: 中速偏快
        pitch: 中音
    citizen_2:
      display_name: 市民乙
      tts:
        delivery: 热情随和，语气真挚
        timbre: 清脆
        pace: 中速
        pitch: 中高音
    king:
      display_name: 国王
      tts:
        delivery: 威严急切，获救后慷慨爽快
        timbre: 浑厚沉稳
        pace: 中速偏慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 懒孩子与风笛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个穷人，孩子多得连面包都不够分。好在他们个个身强力壮，也都愿意做事，很小就学会帮父亲母亲分担活计。等到年纪够大，孩子们纷纷离家去当佣人。谁家雇到他们都很满意，因为他们干活勤快，整天又总是快快活活的。
        - id: ch01-b02
          speaker: narrator
          text: 十来个孩子当中，只有蒂杜让父母操心。他长得高高大大，却懒得出奇。骂也不听，打也不改，好话更劝不动。冬天，他缩在暖炉边。夏天，他睡在树荫下。偶尔不睡，就拿横笛吹曲子。
        - id: ch01-b03
          speaker: narrator
          text: 一天，他坐在灌木丛下吹笛。那曲子甜美得像鸟叫。一位老人路过，停下来问他。
        - id: ch01-b04
          speaker: old_man
          text: 孩子，你将来想靠什么过日子？
        - id: ch01-b05
          speaker: tiidu
          text: 我要是有钱，不用干活，就什么营生也不做。我可受不了像兄弟姐妹那样去伺候别人。
        - id: ch01-b06
          speaker: narrator
          text: 老人听得笑了起来。
        - id: ch01-b07
          speaker: old_man
          text: 可你不做事，钱从哪里来？睡觉的猫捉不到老鼠。想发财，总得动手或者动脑，还要肯日夜辛苦。不然的话……
        - id: ch01-b08
          speaker: narrator
          text: 蒂杜没等他说完，就粗声打断了他。
        - id: ch01-b09
          speaker: tiidu
          text: 行了，老头儿！这套话我听过一百遍，根本没往心里去。谁也休想叫我变成干活的人。
        - id: ch01-b10
          speaker: narrator
          text: 老人没有生气，只当没听见。
        - id: ch01-b11
          speaker: old_man
          text: 你有一样本事。出去给人吹风笛，不光每天的饭钱有了，还能多挣一些。先买一架风笛，把它练得像横笛一样好。只要有人听，你就不会缺钱。
        - id: ch01-b12
          speaker: tiidu
          text: 可风笛从哪里来？
        - id: ch01-b13
          speaker: old_man
          text: 先吹几天横笛，钱很快就攒够了。以后我会回来看看，你听没听劝，又能不能发财。
        - id: ch01-b14
          speaker: narrator
          text: 老人说完便走了。蒂杜仍坐在原处，把刚才的话翻来覆去地想。越想，他越觉得这条路真能带来好运。不过，他最怕别人笑话，便决定对谁也不说。第二天一早，他离开了家，从此再没回去。父母倒不十分伤心。他们庆幸这个没用的儿子总算显出一点志气，也盼着外面的岁月和苦日子能治好他的懒病。
        - id: ch01-b15
          speaker: narrator
          text: 几个星期里，蒂杜从一座村庄走到另一座村庄，亲自证实了老人的诺言。遇见的人都很友善，喜欢听他的横笛，给他饭吃，也给他几个小钱。他把每一枚钱都仔细收好，直到攒够了，才买下一架漂亮的风笛。抱着新风笛，他觉得自己果真踏上了发财的大路。
        - id: ch01-b16
          speaker: narrator
          text: 哪儿也找不到比他更好的风笛，更找不到比他吹得高明的人。蒂杜一吹，人人的腿都要跟着跳起来。不管是婚礼、洗礼，还是别的宴会，都非请他到场不可。少了蒂杜，那个晚上便算彻底失败。没过几年，他已经远近闻名，人们肯从很远的地方赶来听他演奏。
        - id: ch01-b17
          speaker: narrator
          text: 一次洗礼宴上，邻城来了许多富人。他们听得赞不绝口，都说这一生从没听过这样的演奏。众人挤在蒂杜身边，争着请他到家中演奏，还说不让自己的朋友听见这种音乐，实在可惜。蒂杜满心欢喜，一家家接受了邀请。离开时，他身上堆满钱财和礼物。有人送他华服，有人送他珍珠项链，还有人送他一架镶银的新风笛。姑娘们往他的羽毛帽上缠丝巾，她们的母亲又织来五颜六色的手套，免得他冬天冻手。
        - id: ch01-b18
          speaker: narrator
          text: 别人有了这些，早该心满意足地过日子了。蒂杜对财富的渴望却一刻也不肯放过他，只逼着他一天比一天卖力。就算亲娘见到如今这个四处奔忙的人，恐怕也认不出他竟是从前那个不是睡在炉边，就是躺在树下的懒孩子。
    - id: ch02
      title: 偷渡孔格拉
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 蒂杜现在认得很清楚，想发财，只能靠自己的风笛。他天天琢磨，有没有什么办法能让钱来得更快。后来，他想起从前听过的一个传说。孔格拉地方有个王国，那里很欢迎各种乐师，给的报酬也十分丰厚。可任凭他怎样苦想，也记不起那个王国究竟在哪儿，又该怎么去。他无计可施，只好沿海岸漂泊，希望遇到一艘能载自己的船，最后来到了纳尔瓦城。
        - id: ch02-b02
          speaker: narrator
          text: 港里停着好几艘商船，其中一艘过几天就要开往孔格拉。蒂杜高兴极了，赶紧上船找船长。可船费高得叫他舍不得付。他使出全副本领吹了一曲，船长还是不肯少收一个子儿。蒂杜正打算回到岸上，往日的好运又来相助。一个听过演奏的年轻水手偷偷找到他，答应趁船长不在，把他藏进船舱。
        - id: ch02-b03
          speaker: narrator
          text: 第二天夜里，天色刚暗，蒂杜便轻手轻脚溜上甲板。年轻水手把他领进底舱，藏在两只大桶之间的角落里。那里又窄又憋闷，蒂杜只能缩着身子。水手瞒住其余船员，设法给他送来食物和饮水。等商船驶到茫茫海上，再也望不见陆地，水手又准备实行一个办法，好让朋友离开这处难受的藏身地。
        - id: ch02-b04
          speaker: narrator
          text: 半夜轮到年轻水手守望时，他领蒂杜上了甲板，把绳子一头系在蒂杜腰间，一头牢牢拴住船索。
        - id: ch02-b05
          speaker: young_sailor
          text: 我把你扔进海里，你就喊救命。看见大家过来，赶紧解开腰上的绳子，再说自己从岸边一路游着追上了船。
        - id: ch02-b06
          speaker: narrator
          text: 蒂杜起初不太喜欢这个办法，因为海浪正高。不过他水性不错，朋友又一再保证不会出事。等蒂杜落进水里，年轻水手马上叫醒同伴，十分肯定地说，海里有个人正一路跟着船游。大家全跑上甲板。借着夜色往下一看，他们认出那正是昨天同船长讨价还价的人，惊得几乎说不出话来。
        - id: ch02-b07
          speakers: [sailor_1, sailor_2]
          ensemble: duo
          text: 你是鬼，还是一个快死的人？
          emotion: fearful
        - id: ch02-b08
          speaker: tiidu
          text: 再不拉我上去，我就真要死了。我快没力气了！
        - id: ch02-b09
          speaker: narrator
          text: 船长抛来一根绳子。蒂杜用牙咬住，趁众人看不见，解开腰间那根。他被拉上甲板以后，船长马上盘问。
        - id: ch02-b10
          speaker: captain
          text: 你到底从哪里来的？
        - id: ch02-b11
          speaker: tiidu
          text: 我从港口一路游着跟过来。好几次，我都怕自己撑不住。可我没有钱付船费，只盼一直跟着船，最后也能到孔格拉。
        - id: ch02-b12
          speaker: narrator
          text: 船长的心软了。
        - id: ch02-b13
          speaker: captain
          text: 你没淹死，真该庆幸。既然这么想去孔格拉，我就不收钱，把你送到那里。
        - id: ch02-b14
          speaker: narrator
          text: 船长给了蒂杜干衣服，又给他一张铺位。蒂杜和年轻水手暗地里为这个巧计偷笑。余下的航程中，船员们把他看成了不起的人。他们活了这么久，还没见过谁能在海里游上那么多个钟头。蒂杜明明知道自己什么也没做，不配受这份敬重，却还是得意极了。他吹起一支又一支风笛曲，逗得大家十分开心。
        - id: ch02-b15
          speaker: narrator
          text: 几天后，船在孔格拉抛锚。神奇的游水故事抢先传开，替蒂杜招来许多朋友。人人都想听他亲口讲那段经历。这原本很风光，可蒂杜天天提心吊胆，生怕哪天有人要他证明自己的本领，当场再游一次，那样骗局就全露馅了。孔格拉四周的富丽景象也看得他眼花。财富的主人似乎毫不在意自己的金银，他却比从前更想分到一些。
        - id: ch02-b16
          speaker: narrator
          text: 蒂杜在城里走了许多天，四处寻找需要佣人的人家。好几个人愿意雇他，可他觉得这些主人都不能帮自己迅速发财。就在他准备接受下一份差事时，碰上一位正缺厨房杂役的富商。蒂杜答应听厨子使唤，也是在这座宅子里，他才知道孔格拉多么富有。别处用铁、铜、黄铜或锡做的器皿，这里都用白银，甚至黄金。银锅煮饭，银炉烤面包，盘子和盖子是金的，就连猪食槽也是银的。
        - id: ch02-b17
          speaker: tiidu
          text: 财富天天摆在眼前，却没有一样归我，那又有什么用？杂役的工钱就算比别处高十倍，我也发不了财。
        - id: ch02-b18
          speaker: narrator
          text: 两年过去，蒂杜存下很大一笔钱，也节省得越来越过分。衣裳穿旧了，他仍舍不得换。要不是主人亲自下令，他根本不会买新的。
        - id: ch02-b19
          speaker: merchant
          text: 我的屋里不许有脏兮兮的人。
        - id: ch02-b20
          speaker: narrator
          text: 主人的话不容反驳。蒂杜只好心疼地从下个月的工钱里拿出一部分，勉强买了一件便宜外套。
    - id: ch03
      title: 椴树下的第二次劝告
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 后来，富商为最小的孩子举办盛大的洗礼宴，还送给每个仆人一件体面衣裳。只要不是自己掏钱，蒂杜也很喜欢漂亮衣服。下一个星期日，他穿上新衣，到一座美丽的游乐花园散步。晴天里，这里总是挤满游人。他在树荫下坐着，看行人来来往往。可他一个人也不认识，也没有人认识他，坐久了便觉得孤单。
        - id: ch03-b02
          speaker: narrator
          text: 忽然，他看到一位老人，那身影似乎很熟悉，却想不起在何时何地见过。蒂杜盯着他看了好一阵。后来，老人离开拥挤的小路，走到远处一棵椴树下，往柔软的草地上一躺。蒂杜故意慢慢从他身边经过，想把面孔看清。老人却先认出了他，微笑着伸出一只手。
        - id: ch03-b03
          speaker: old_man
          text: 你的风笛到哪里去了？
        - id: ch03-b04
          speaker: narrator
          text: 蒂杜这才认出他。他把老人拉到安静的地方，将分别后的经历讲了一遍。老人听着直摇头。
        - id: ch03-b05
          speaker: old_man
          text: 你真是个傻瓜，而且永远也改不了！拿风笛换厨房的长柄勺，哪还有更蠢的事？你吹一天风笛，能抵半年工钱。回去把风笛拿来，就在这里吹。你马上会知道我说得对不对。
        - id: ch03-b06
          speaker: narrator
          text: 蒂杜怕人取笑，而且很久没碰风笛了，实在不想照办。老人却坚持不让步。最后，他只好把风笛取来。
        - id: ch03-b07
          speaker: old_man
          text: 挨着我坐到岸边，开始吹吧。过不了多久，人们都会围过来。
        - id: ch03-b08
          speaker: narrator
          text: 蒂杜照着做了，起初吹得有气无力。不知怎的，风笛声竟比他记忆中还要甜美。随着曲声传开，游人不再走动，也不再聊天，只静静围在他身旁。吹过一阵，蒂杜摘下帽子，在人群中传了一圈。大银币、小银币，连金币也叮叮当当地落了进去。他又吹两支曲子答谢众人，这才收起风笛，转身回家。
        - id: ch03-b09
          speakers: [citizen_1, citizen_2]
          ensemble: duo
          text: 真了不起！求你下个星期日再来，让我们再听一回吧！
          emotion: happy
        - id: ch03-b10
          speaker: narrator
          text: 走出花园时，老人又开口了。
        - id: ch03-b11
          speaker: old_man
          text: 看见了吧？吹两三个钟头风笛，不比整天搅酱汁快活？这是我第二次给你指路。学聪明些，拿出勇气迎上去，别让好运从手边溜走。以后每个星期日下午都来这座花园，坐在椴树下给人们演奏。还要带一顶帽身很深的毡帽，把它放在脚边的地上，好让每个听众都能往里面投钱。
        - id: ch03-b12
          speaker: old_man
          text: 若有人请你去宴会，就痛快答应，但不要开定价。只说他们愿意给多少，你就收多少。这样反而赚得更多。往后我不能再给你领路了。也许我们还会相遇，到时我再看看，你究竟听进了多少。就此别过吧。
        - id: ch03-b13
          speaker: narrator
          text: 老人的话又一次应验。只是蒂杜答应的服役期限还没有满，暂时不能离开富商家。他先定做了几身好衣裳，每个星期日都穿得整整齐齐，去花园演奏。晚上回到家，他总要把当天所得一枚枚数清。而每一回赚的钱，都比前一个星期日更多。
        - id: ch03-b14
          speaker: narrator
          text: 等服役期满，蒂杜终于可以随心所欲了。请他演奏的人多得应接不暇。夜晚，城里的居民照例到客店喝酒，店主也总求他来吹几曲助兴。他就这样越来越富，很快又给银风笛包上一层黄金。无论阳光还是火光照过来，那架风笛都闪闪发亮。整个孔格拉，再也找不到比蒂杜更骄傲的人。
        - id: ch03-b15
          speaker: narrator
          text: 几年以后，蒂杜积下大笔钱财。就算在人人富有的孔格拉，他也算得上一个财主。这时，他才有闲心想起自己曾经有个家，也曾经有过亲人。他想回去看看他们，也想让家人亲耳听听，自己如今能把风笛吹得多么出色。这次，他当然不用再偷偷躲进狭窄的底舱。他可以租下船上最好的客舱，愿意的话，甚至能包下一整艘船，舒舒服服地回去。
        - id: ch03-b16
          speaker: narrator
          text: 他把所有财宝装进一只只大箱子，搬上第一艘开往故乡的船，自己也满心轻快地跟着登船。启航时风势正好，不久却越刮越猛，到了夜里，已经变成狂风。船顺着风逃了两天，众人盼着只要远离海岸，便能熬过这场风暴。谁知船身猛地撞上礁石，海水开始直往舱里灌。
        - id: ch03-b17
          speaker: narrator
          text: 船长叫人放下小艇。蒂杜和三个水手刚坐进其中一只，还没来得及划离大船，一个巨浪便把小艇掀翻。四个人全落入海里。蒂杜运气不错，身旁漂来一支船桨。他死死抓住，才得以浮在水面。太阳升起，浓雾渐渐散去，他看见岸边离得不远。海上仍是大浪，他拼尽力气游过去，好不容易爬上岸来，已经只剩半条命。他往地上一倒，很快沉沉睡着了。
    - id: ch04
      title: 荒岛上的苹果与坚果
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 醒来以后，蒂杜起身探察这座小岛，想找找岛上有没有人。清澈的溪流和结满果实的树随处可见，却没有半点人或野兽留下的踪迹。他走得筋疲力尽，终于坐下来想心事。也许这是他一生中第一次，心思没有立刻转到钱上。
        - id: ch04-b02
          speaker: narrator
          text: 他没有惦记沉入海底的财宝，只想起自己这些年来怎样对待父母。小时候，他懒惰又不听话，让父母受尽烦恼。长大以后，他又把他们忘得一干二净，连回家看一眼也不曾。
        - id: ch04-b03
          speaker: tiidu
          text: 就算野兽来把我撕碎，也是我活该！财宝都沉了，来得轻易，去得也轻易。奇怪的是，只要风笛还在，我好像根本不会在乎那些钱。
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: 蒂杜从地上站起来，又往前走了一段。很快，他看见一棵苹果树，硕大的红果子在枝叶之间闪闪发亮。他饿极了，伸手摘下几个，狼吞虎咽地吃掉。吃饱以后，他在树下找到一片柔软的苔藓，舒展身体躺了上去，很快又睡着了。
        - id: ch04-b05
          speaker: narrator
          text: 第二天早晨，他跑到最近的溪边洗脸。水里映出的面孔把他吓得魂飞魄散。鼻子已经变成苹果一样的红色，还一直垂到腰间。他猛地向后退去，以为自己仍在梦里，又战战兢兢地伸手一摸。唉，那可怕的长鼻子竟是真的。
        - id: ch04-b06
          speaker: tiidu
          text: 为什么没有野兽来吃掉我？我这副样子，再也不能回到人群里了！还不如早被大海吞掉！
          emotion: sad
        - id: ch04-b07
          speaker: narrator
          text: 他捂着脸大哭，悲痛很快耗尽了力气。肚子饿起来时，他四处寻找食物，发现头顶一根树枝上结满成熟的褐色坚果，便摘下一把来吃。没想到，他一边嚼，鼻子竟一点一点缩短了。过了一会儿，蒂杜才敢伸手摸，又壮着胆子跑到溪边照了照。没错，鼻子恢复了原样，也许还比从前短了一点。
        - id: ch04-b08
          speaker: narrator
          text: 这个发现让他欢喜极了，竟又做了个大胆的试验。他从口袋里拿出一只苹果，小心咬下一块。眨眼之间，鼻子便长到下巴。他怕鼻子继续往下伸，赶紧吞下一颗坚果，提心吊胆地等着。要是刚才缩短只是碰巧呢？要是偏偏只有第一颗坚果管用呢？那他就是不肯见好就收，凭自己的愚蠢彻底毁掉了一生。
        - id: ch04-b09
          speaker: narrator
          text: 幸好，他猜对了。鼻子很快又恢复正常。
        - id: ch04-b10
          speaker: tiidu
          text: 这些东西说不定能让我发财！
          emotion: happy
        - id: ch04-b11
          speaker: narrator
          text: 蒂杜采下一些红苹果，仔细装进一边口袋，又收集了足够多的坚果，装进另一边。第二天，他用灯心草编成一只篮子。这样，只要将来有机会离开小岛，就能把这两样奇异的宝贝一直带在身边。
        - id: ch04-b12
          speaker: narrator
          text: 当晚，他梦见老人朋友站在面前。
        - id: ch04-b13
          speaker: old_man
          text: 你没有为丢掉财宝伤心，只舍不得风笛。所以，我送你一架新的，补上原来那一架。
        - id: ch04-b14
          speaker: narrator
          text: 瞧，第二天醒来，篮子里果真躺着一架风笛。蒂杜欢喜得一把抓起来，吹起自己最爱的曲子。音乐一响，希望也从心里升了起来。他朝海上张望，想找找有没有船帆的影子。真的！远处正有一张帆，径直朝小岛驶来。蒂杜握紧风笛，飞也似的冲向岸边。
        - id: ch04-b15
          speaker: narrator
          text: 水手们明明知道小岛无人居住，见到一个男人站在海滩上挥舞双臂欢迎他们，都十分惊讶。船上放下一只小艇，两名水手划到岸边，问他怎么会来到这里，也问他愿不愿意离开。蒂杜讲了自己遭遇海难的经过。船长答应让他上船，随大家返回孔格拉。他感激万分，此后只要有人想听，便拿起风笛演奏，以此向船员们道谢。
    - id: ch05
      title: 魔法师回乡
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 返航十分顺利，没过多久，蒂杜又走在孔格拉都城的街上，一路吹着风笛。自从他离开以后，人们再没听过这样的音乐。曲声一传开，大家便高兴地围住他，把口袋里带着的钱纷纷送到他手中。
        - id: ch05-b02
          speaker: narrator
          text: 蒂杜先买了几件急需的新衣，还特意叮嘱裁缝，一定要做成外国式样。衣服备好以后，他挑了一天，提着一小篮有名的红苹果来到王宫。没等多久，一名王室仆人便经过这里，买走了全部苹果，还求这位商人下次多送一些。蒂杜满口答应，转身便飞跑，像有一头疯牛追在身后。他生怕仆人当场拿起苹果咬上一口。
        - id: ch05-b03
          speaker: narrator
          text: 不用说，接连几天，他都没有再把苹果送进王宫。他远远躲在城的另一边，换上完全不同的衣服，还用一把黑色长胡子遮住面孔。这身装扮做得十分周全，就连亲娘站到眼前，也休想认出他。
        - id: ch05-b04
          speaker: narrator
          text: 第二天早晨，整座城都因为王室遭遇的不幸乱成一团。国王、王后和孩子们都吃过陌生人的苹果，据说个个病得很重。最有名的医生和最高明的魔法师被匆匆召进王宫，却只是摇着头走出来。他们治病施法这么多年，从没见过这种怪病。
        - id: ch05-b05
          speaker: narrator
          text: 过了些时候，城里不知从哪儿传出一个说法，这种病似乎同鼻子有关。男人们全都担心地摸着自己的鼻子，生怕空气里飘着会传染的东西。这样的情形过了一个多星期，国王终于听说，城另一头的客店里住着一位能治百病的人。他立刻命令王家马车用最快的速度把人接来。只要能让全家的鼻子恢复原样，数不清的财富都肯给。
        - id: ch05-b06
          speaker: narrator
          text: 蒂杜早料到会有人来请。他花了一整夜改换相貌，而且做得极其成功，身上再也找不到风笛手或苹果商人的半点影子。他坐进马车，飞快赶到王宫。国王正焦急地数着每一刻，因为他和王后的鼻子已经长过一码，却谁也不知道还会伸到哪里才停。
        - id: ch05-b07
          speaker: narrator
          text: 蒂杜觉得，直接拿生坚果给王室成员吃，实在不大像一个魔法师，也太容易惹人怀疑。他事先把坚果细细捣成粉末，再分成一小服一小服。服用时，只要把粉末放到舌头上，立刻咽下就行。他给国王一服，也给王后一服，然后郑重说出自己的嘱咐。
        - id: ch05-b08
          speaker: tiidu
          text: 服药以前，请先到一间漆黑的屋子里躺好。几个钟头以内，一动也不能动。等你们出来，鼻子自然会恢复原样。
        - id: ch05-b09
          speaker: narrator
          text: 国王听见有治，欢喜得恨不得送给他半个王国。可经历过荒岛上的海难以后，蒂杜已经不像从前那样贪心了。他只想得到足够的钱，买下一座小庄园，往后就在里面舒舒服服地生活。这已经能让他心满意足。
        - id: ch05-b10
          speaker: narrator
          text: 国王还是命令司库，付给蒂杜所求数目的三倍。他拿着这笔足够买庄园的钱来到港口，雇了一艘小船送自己返回故乡。这一回，海上没有再降下灾祸。一路风势正好，十天以后，那片几乎被他遗忘的海岸便清清楚楚地出现在眼前。
        - id: ch05-b11
          speaker: narrator
          text: 又过了几个钟头，他已经站在从前的家里。父亲、三个姐妹和两个兄弟见他回来，全都热情地欢迎他。可他的母亲和其余那些兄弟，早在几年前便去世了。
        - id: ch05-b12
          speaker: narrator
          text: 等一家人相聚完，蒂杜便开始四处打听，想在城镇附近买一座小庄园。很快，他找到了正待出售的地方，把它买了下来。下一件事，是找一位妻子和自己共享这份生活。这同样没花多少工夫。后来，所有参加婚宴的人都说，那天最精彩的时刻，便是众人互道珍重、各自归家以前，蒂杜亲自为他们吹奏风笛的那一个钟头。
        - id: ch05-b13
          speaker: narrator
          text: 这个故事，选自《爱沙尼亚童话》。
