audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and storylike
        timbre: clear and mellow
        pace: measured
        pitch: medium
    crab:
      display_name: The Crab
      tts:
        delivery: capable, courteous, and quick-witted
        timbre: light and clear
        pace: steady
        pitch: medium-high
    monkey:
      display_name: The Monkey
      tts:
        delivery: sly, boastful, and falsely polite
        timbre: bright and nimble
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: Rice and a Kaki Stone
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a crab who lived in a hole on the shady side of a mountain. She kept a better home than any creature in the whole country. Her hole was always neat and clean, because she worked hard and took great care of it. And she was very proud of her home.
        - id: ch01-b02
          speaker: narrator
          text: One day, near the mouth of her hole, the crab found a handful of cooked rice. A pilgrim must have dropped it while stopping there for dinner. She was delighted. She hurried over and began carrying the rice home.
        - id: ch01-b03
          speaker: narrator
          text: A monkey lived in some trees nearby. He came down to see what she was doing, and his eyes lit up when he saw the rice. It was his favorite food. The sly fellow had just eaten a sweet red kaki fruit, and all he had left was the stone inside. So he offered the crab a bargain. He would give her the kaki stone if she gave him half the rice.
        - id: ch01-b04
          speaker: narrator
          text: The monkey almost expected her to laugh at such a shameless offer. Instead, the crab tilted her head and looked at him for a moment.
        - id: ch01-b05
          speaker: crab
          text: Very well. I'll make the trade.
        - id: ch01-b06
          speaker: narrator
          text: The monkey went away with his share of the rice, and the crab carried the kaki stone into her hole.

    - id: ch02
      title: The Fruit in the Tree
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: For some time after that, the crab saw nothing of the monkey. He had gone to visit the sunny side of the mountain. Then one morning he passed her hole again. There sat the crab beneath the shade of a beautiful kaki tree that had grown from the stone.
        - id: ch02-b02
          speaker: monkey
          text: Good day! What fine fruit you have up there. I'm very hungry. Could you spare one or two for me?
        - id: ch02-b03
          speaker: crab
          text: Of course. But please forgive me, because I can't climb the tree and pick them for you myself.
        - id: ch02-b04
          speaker: monkey
          text: Oh, there's no need to apologize. Now that you've given me permission, I can climb up and get them easily.
        - id: ch02-b05
          speaker: narrator
          text: The crab agreed to let him climb, but she asked him to throw down half the fruit for her.
        - id: ch02-b06
          speaker: narrator
          text: In a moment, the monkey was swinging from branch to branch. He ate every ripe kaki he could reach and stuffed the rest into his pockets. The few fruits he tossed down were either hard and unripe or completely rotten. The crab watched him, and what she saw filled her with disgust.
        - id: ch02-b07
          speaker: crab
          text: You really are a dreadful cheat!
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: The monkey ignored her and kept eating as fast as he could. The crab saw that scolding him would do no good. She would have to outwit him instead.
        - id: ch02-b09
          speaker: crab
          text: Sir Monkey, you certainly know how to climb. But you've eaten so much now that I'm sure you couldn't turn even one somersault.
        - id: ch02-b10
          speaker: narrator
          text: The monkey was proud of his somersaults. He believed no other monkey in his family could do them better. At once he turned head over heels three times on the branch where he sat. Every beautiful kaki in his pockets rolled out and fell to the ground.

    - id: ch03
      title: The Monkey's Attack
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Quick as lightning, the crab gathered up the fallen fruit. She carried a great many kakis into her house, then came back outside to collect more.
        - id: ch03-b02
          speaker: narrator
          text: This time the monkey sprang on her. He treated the crab so cruelly that he left her lying there as if she were dead. He kept beating her until his arm hurt, and then he went away.
        - id: ch03-b03
          speaker: narrator
          text: Luckily, the poor crab had friends who came to help her. Without them, she surely would have died right there. A wasp flew to her, carried her back to bed, and cared for her.

    - id: ch04
      title: The Friends Make a Plan
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Then the wasp talked things over with a rice mortar and an egg that had fallen from a nest nearby. They knew the monkey would come back to steal the fruit that remained. So they agreed to punish him severely for the way he had treated the crab.
        - id: ch04-b02
          speaker: narrator
          text: The mortar climbed onto the beam above the front door. The egg lay perfectly still on the ground. The wasp placed the water bucket in a corner. Last of all, the crab dug herself a deep hole. She hid so well that not even the tip of one claw could be seen.

    - id: ch05
      title: The Monkey Returns
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Soon everything was ready. The monkey jumped down from his tree and crept toward the door. He began a long, false speech, begging forgiveness for everything he had done.
        - id: ch05-b02
          speaker: monkey
          text: Dear Crab, I behaved terribly. Please forgive me for what I did.
        - id: ch05-b03
          speaker: narrator
          text: The monkey waited for some kind of answer, but none came. He listened. All was quiet. He peeped inside and saw no one, so at last he entered the house.
        - id: ch05-b04
          speaker: narrator
          text: He searched everywhere for the crab, but he could not find her. Then he noticed the egg. He snatched it up and put it on the fire.
        - id: ch05-b05
          speaker: narrator
          text: In an instant, the egg burst into a thousand pieces. Sharp bits of shell flew into the monkey's face and scratched him horribly. The pain burned. He rushed to the bucket and bent down, ready to splash water over his head.
        - id: ch05-b06
          speaker: narrator
          text: As the monkey reached out his hand, the wasp sprang up and stung him on the nose. The monkey shrieked and raced for the door.
        - id: ch05-b07
          speaker: narrator
          text: But just as he passed beneath the doorway, the rice mortar dropped from the beam. It struck the monkey and killed him.
        - id: ch05-b08
          speaker: narrator
          text: After that, the crab lived happily for many years. At last, she died peacefully beneath her own kaki tree.
