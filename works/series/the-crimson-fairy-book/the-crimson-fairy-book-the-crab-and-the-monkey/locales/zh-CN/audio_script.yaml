audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    crab:
      display_name: 螃蟹
      tts:
        delivery: 勤快爽直，受骗时气愤，设法反击时机敏沉着
        timbre: 清亮坚实
        pace: 中速
        pitch: 中高音
    monkey:
      display_name: 猴子
      tts:
        delivery: 表面客气，实则贪心狡猾，自负时格外夸张
        timbre: 灵活略尖
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 一把米饭和一枚柿子种
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一只螃蟹住在山背阴面的洞穴里。她很会过日子，做事又勤快又仔细。整个国度里，再也找不到比她的家更整洁的洞穴了。她也一直为这件事十分自豪。
        - id: ch01-b02
          speaker: narrator
          text: 一天，洞口附近落着一把熟米饭。大概是哪位朝圣者停下来吃饭时，不小心掉在那里的。螃蟹高兴极了，赶紧过去，准备把米饭搬回家。
        - id: ch01-b03
          speaker: narrator
          text: 附近的树上住着一只猴子。他下来瞧螃蟹在忙什么，一看见米饭，眼睛就亮了。米饭正是他最爱吃的东西。这个狡猾的家伙马上提出了一桩买卖。他要螃蟹分给自己一半米饭，拿来交换的，却只是刚吃完的一枚甜红柿子种。
        - id: ch01-b04
          speaker: narrator
          text: 猴子自己也觉得这个要求很无赖，还以为螃蟹一定会当面笑他。没想到，螃蟹只是歪着头看了他一会儿，竟然答应了。猴子带着米饭离开，螃蟹把柿子种带回了洞里。

    - id: ch02
      title: 柿子树上的无赖
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 后来，猴子去山向阳的那一面拜访朋友，很长时间没有露面。一天早晨，他恰巧又经过螃蟹的洞口，看见那里已经长出一棵美丽的柿子树。螃蟹正坐在树荫下。
        - id: ch02-b02
          speaker: monkey
          text: 你好呀！你这棵树结的果子真不错。我现在饿得很，能分给我一两个吗？
        - id: ch02-b03
          speaker: crab
          text: 当然可以。不过我不会爬树，没法亲手替你摘，请你别见怪。
        - id: ch02-b04
          speaker: monkey
          text: 不用道歉。你既然答应了，我自己上去摘就行，这太容易了。
        - id: ch02-b05
          speaker: narrator
          text: 螃蟹同意让猴子上树，只让他把一半果子扔下来。转眼间，猴子就在枝头荡来荡去。他挑最熟的柿子大口吃掉，又把其余的全塞进口袋。扔给螃蟹的那几个，不是青得不能吃，就是已经烂透了。
        - id: ch02-b06
          speaker: crab
          text: 你真是个坏透了的无赖！
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: 猴子根本不理她，只顾不停地吃。螃蟹知道，再骂下去也没有用，便想出一个办法。
        - id: ch02-b08
          speaker: crab
          text: 猴子先生，你爬树的本领确实厉害。不过，你已经吃了这么多，我看你现在连一个跟头也翻不了啦。
        - id: ch02-b09
          speaker: narrator
          text: 猴子最得意的就是翻跟头。他认定家族里没有谁比得上自己，一听这话，立刻在坐着的树枝上连翻了三个。口袋里的好柿子一下子全滚到了地上。
        - id: ch02-b10
          speaker: narrator
          text: 螃蟹快得像一道闪电，拾起一大堆柿子，抱回洞里。她出来拿第二趟时，猴子猛扑上来，对她一顿毒打，把她打得像死了一样。他一直打到胳膊发酸，才独自走掉。

    - id: ch03
      title: 螃蟹的朋友们
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 幸好螃蟹还有几个朋友赶来相救，不然她准会当场死去。黄蜂飞到她身边，把她送回床上，细心照料。接着，黄蜂又找来一只石臼，还有一枚从附近鸟巢掉下来的蛋，一起商量怎么办。
        - id: ch03-b02
          speaker: narrator
          text: 他们知道，猴子一定还会回来偷剩下的柿子，便决定给他一个严厉的教训，好替螃蟹出气。石臼爬到大门上方的横梁上。鸡蛋静静躺在地面。黄蜂把水桶放进墙角。螃蟹则在地里挖了一个深洞，藏得连爪尖也看不见。

    - id: ch04
      title: 猴子的下场
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一切刚安排好，猴子就从树上跳下来，悄悄走到门前。他装出一副诚恳的样子，说了许多赔罪的话，求螃蟹原谅。可是，他等了又等，里面一点回应也没有。
        - id: ch04-b02
          speaker: narrator
          text: 猴子侧耳听，四周静悄悄的。他探头看，也没见到谁，于是走进屋里。他四处寻找螃蟹，始终找不到，倒是一眼看见了地上的鸡蛋。他抓起鸡蛋，放到了火上。
        - id: ch04-b03
          speaker: narrator
          text: 没过多久，鸡蛋“砰”的一声炸成了千百片。尖利的蛋壳迎面飞来，把猴子的脸划得伤痕累累。他疼得受不了，赶紧跑到水桶边弯下腰，想弄些水浇在头上。
        - id: ch04-b04
          speaker: narrator
          text: 猴子的手刚伸出去，黄蜂猛地蹿了起来，在他的鼻子上狠狠蜇了一下。猴子尖叫着逃向门外。就在他穿过门口时，石臼从横梁上砸下来，当场把他砸死了。
        - id: ch04-b05
          speaker: narrator
          text: 从那以后，螃蟹在自己的柿子树下幸福地生活了许多年。最后，她安安静静地离开了人世。
