audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而带几分诙谐，像在讲一则古老的欧洲童话
        timbre: 温暖清亮
        pace: 舒缓，转折处有自然停顿
        pitch: 中音
    stone_cutter:
      display_name: 石匠
      tts:
        delivery: 起初朴实知足，许愿时渴望而急切，醒悟后安稳踏实
        timbre: 粗粝厚实
        pace: 中速
        pitch: 中低音
    mountain_spirit:
      display_name: 山神
      tts:
        delivery: 神秘平静，每次应允愿望都简短而不露褒贬
        timbre: 空灵深沉
        pace: 舒缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 山中的石匠
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个石匠天天上山，从山腰的一块巨岩上凿下石板。有的石板做墓碑，有的拿去盖房。他知道不同的用处该配什么石料，手艺又细，主顾总是很多。那些年里，他日子过得快活，也很知足，从没想过还要得到什么。
        - id: ch01-b02
          speaker: narrator
          text: 人们都说山里住着一位山神。他偶尔会在人前现身，帮人发财，让日子兴旺起来。石匠从来没有见过，只要听谁提起，便不相信地摇头。可后来发生的事，让他再也不能这样想了。
        - id: ch01-b03
          speaker: narrator
          text: 一天，他把一块墓碑送到富人家里。满屋华美的东西，看得他眼花缭乱，有些甚至连梦里都没见过。回头再想每天的活计，忽然觉得又苦又沉。
        - id: ch01-b04
          speaker: stone_cutter
          text: 要是我也有钱，能睡在挂着丝帐和金穗子的床上，那该多快活啊！
        - id: ch01-b05
          speaker: mountain_spirit
          text: 你的愿望已经听见了。你会成为富人！
        - id: ch01-b06
          speaker: narrator
          text: 石匠听见声音，赶忙四处找，却连个人影也没有。他只当自己胡思乱想，拾起工具就回家了，那天再没有心思做活。走到住处，他一下愣住了。原来的小木棚不见了，那里立着一座堂皇的宫殿，里面尽是华丽的家具。最气派的那张床挂着丝帐和金穗子，正和他刚刚羡慕的床一模一样。他欢喜得快要发狂，很快就把旧日生活忘在脑后。
    - id: ch02
      title: 富人与王子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 初夏到了，阳光一天比一天毒辣。一个早晨，石匠热得几乎透不过气，决定一直待到傍晚再出门。可他从没学会怎样消遣，闷得只好隔着紧闭的百叶窗往街上看。
        - id: ch02-b02
          speaker: narrator
          text: 一辆小车恰好从窗外经过。穿着蓝银两色衣服的仆人拉着车，车里坐了一位王子。另有一个仆人高举金伞，替王子挡住太阳。
        - id: ch02-b03
          speaker: narrator
          text: 小车刚转过街角，石匠又生出了愿望。
        - id: ch02-b04
          speaker: stone_cutter
          text: 要是我成了王子，能坐那样的车，还有人为我撑着金伞，我一定快活极了！
        - id: ch02-b05
          speaker: mountain_spirit
          text: 你的愿望已经听见了。你会成为王子。
        - id: ch02-b06
          speaker: narrator
          text: 他果然成了王子。车前有一队人开路，车后又有一队人随行。穿红金两色衣服的仆人抬着他，头顶也撑起了那把他一心想要的金伞。凡是心里想得到的东西，他全都有了，可还是不够。他不停四下张望，还想找出新的愿望。
        - id: ch02-b07
          speaker: narrator
          text: 草地浇过水，照样被阳光晒焦。金伞天天遮在头顶，他的脸仍旧越来越黑。他气得喊了起来。
        - id: ch02-b08
          speaker: stone_cutter
          text: 原来太阳比我更有力量！要是我能变成太阳就好了！
          emotion: angry
        - id: ch02-b09
          speaker: mountain_spirit
          text: 你的愿望已经听见了。你会成为太阳。
    - id: ch03
      title: 太阳和云
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他真的成了太阳，也为自己的力量得意起来。他把光芒撒向高处和低处，照遍天上地下。田野里的青草被晒枯了，无论王公贵族还是穷苦百姓，脸都被烤得焦黑。
        - id: ch03-b02
          speaker: narrator
          text: 没过多久，他又厌倦了这样的威力，因为好像已经没有别的事可做。不满重新占满了他的心。忽然，一片云遮住太阳的脸，也把大地挡得严严实实。
        - id: ch03-b03
          speaker: stone_cutter
          text: 云能拦住我的光，难道它比我还强？我要变成一片云，做最有力量的那个！
          emotion: angry
        - id: ch03-b04
          speaker: mountain_spirit
          text: 你的愿望已经听见了。你会成为一片云！
        - id: ch03-b05
          speaker: narrator
          text: 他于是成了云，横在太阳和大地之间。无论太阳射来多少光，都被他牢牢截住。大地重新披上绿色，花朵也一朵朵开放，他看着十分欢喜。可他仍不满足，接连几天、几个星期往下倾倒大雨。雨一直没有停，河水终于越过两岸，稻田全泡在水中，城镇和村庄也被洪水毁掉。
        - id: ch03-b06
          speaker: narrator
          text: 只有山腰那块巨岩，一动不动地留在原处。云怎么也没想到，自己的力量竟奈何不了它。
        - id: ch03-b07
          speaker: stone_cutter
          text: 难道岩石比我还强？要是我能成为那块岩石！
          emotion: surprised
        - id: ch03-b08
          speaker: mountain_spirit
          text: 你的愿望已经听见了。你会成为岩石！
    - id: ch04
      title: 重新做人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 他果然变成了岩石，心里无比自豪。他稳稳地高高立在山腰，太阳晒不动，暴雨冲不走。
        - id: ch04-b02
          speaker: stone_cutter
          text: 这才是最好的！
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: 有一天，他忽然听见脚下传来怪声。低头看去，一个石匠正在把工具凿进他的身体。还没等他弄明白，全身便猛地一颤，一大块石头崩落下来，重重掉在地上。
        - id: ch04-b04
          speaker: stone_cutter
          text: 一个血肉凡人，竟然比岩石更有力量？我要重新变成人！
          emotion: angry
        - id: ch04-b05
          speaker: mountain_spirit
          text: 你的愿望已经听见了。你会重新变成人！
        - id: ch04-b06
          speaker: narrator
          text: 他果然又成了人，重新干起凿石头的老本行，每天劳动得满头大汗。他的床很硬，吃的东西也不多，可这一次，他懂得了知足。他不再盼着变成别的东西，也不想成为别的什么人。
        - id: ch04-b07
          speaker: narrator
          text: 从此，他不再索求自己没有的东西，也不再希望比别人更尊贵、更强大。他终于过得快活了，也再没有听见山神的声音。
