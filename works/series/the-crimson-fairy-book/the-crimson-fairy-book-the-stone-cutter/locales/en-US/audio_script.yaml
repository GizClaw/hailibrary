audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and storylike
        timbre: clear and mellow
        pace: measured
        pitch: medium
    stone_cutter:
      display_name: The Stone-Cutter
      tts:
        delivery: earnest, restless, and plainspoken
        timbre: sturdy and clear
        pace: steady
        pitch: medium
    mountain_spirit:
      display_name: The Mountain Spirit
      tts:
        delivery: mysterious, even, and unwavering
        timbre: deep and airy
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: The Wish for Wealth
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a stone-cutter who worked each day at a great rock in the side of a mountain. He cut slabs for gravestones and houses, and he knew exactly which kind of stone suited each job. He was careful at his trade and always had plenty of customers. For a long while, he was happy with his life and wanted nothing more.
        - id: ch01-b02
          speaker: narrator
          text: A spirit lived inside that mountain. From time to time, it appeared to men and helped them grow rich and prosperous. The stone-cutter had never seen it himself. Whenever anyone spoke of the spirit, he only shook his head in disbelief. But before long, he would change his mind.
        - id: ch01-b03
          speaker: narrator
          text: One day, he delivered a gravestone to a rich man's house. Inside, he saw beautiful things beyond anything he had ever imagined. All at once, his daily labor felt harder and heavier than before.
        - id: ch01-b04
          speaker: stone_cutter
          text: If only I were rich! I could sleep in a bed with silk curtains and golden tassels. Then I'd be happy.
        - id: ch01-b05
          speaker: mountain_spirit
          text: Your wish has been heard. You shall be a rich man.
        - id: ch01-b06
          speaker: narrator
          text: The stone-cutter spun around at the sound, but no one was there. He decided he must have imagined the voice. Then he gathered his tools and went home, because he no longer felt like working that day.
        - id: ch01-b07
          speaker: narrator
          text: When he reached the place where his little wooden hut had stood, he stopped in amazement. A stately palace stood there instead, filled from room to room with splendid furniture. Best of all was the bed. It had silk curtains and golden tassels, just like the one he had envied. He was almost beside himself with joy, and he soon forgot his old life.

    - id: ch02
      title: The Wish to Be a Prince
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Summer was beginning, and the sun blazed more fiercely each day. One morning, the heat was so strong that the stone-cutter could hardly breathe. He decided to stay indoors until evening. But he had never learned how to amuse himself, and soon he grew bored.
        - id: ch02-b02
          speaker: narrator
          text: He peered through the closed blinds to see what was happening outside. A little carriage rolled past, drawn by servants in blue and silver. A prince sat inside, with a golden umbrella held above him to keep off the sun.
        - id: ch02-b03
          speaker: stone_cutter
          text: If only I were a prince! I could ride in a carriage like that, with a golden umbrella over my head. Then I'd be happy.
        - id: ch02-b04
          speaker: mountain_spirit
          text: Your wish has been heard. You shall be a prince.
        - id: ch02-b05
          speaker: narrator
          text: And so he became a prince. One company of men rode before his carriage and another followed behind it. Servants dressed in scarlet and gold carried him wherever he wished to go. The golden umbrella he had wanted was held above his head, and everything his heart could desire belonged to him.
        - id: ch02-b06
          speaker: narrator
          text: Still, it was not enough. He kept looking for something else to wish for. He watered his grass, but the sun scorched it anyway. Though the umbrella shaded him, his face grew browner each day. At last he cried out in anger.
        - id: ch02-b07
          speaker: stone_cutter
          text: The sun is mightier than I am! If only I were the sun!
          emotion: angry
        - id: ch02-b08
          speaker: mountain_spirit
          text: Your wish has been heard. You shall be the sun.

    - id: ch03
      title: The Wish to Be a Cloud
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: And so he became the sun, and he was proud of his power. He sent his beams high and low, across the earth and through the heavens. He burned the grass in the fields and scorched the faces of princes and poor people alike.
        - id: ch03-b02
          speaker: narrator
          text: Before long, even that great power began to tire him. There seemed to be nothing left for him to do, and discontent filled him again. Then a cloud passed across his face and hid the earth from his sight.
        - id: ch03-b03
          speaker: stone_cutter
          text: Can that cloud trap my rays? Is it mightier than I am? If only I were a cloud, mightier than anything!
          emotion: angry
        - id: ch03-b04
          speaker: mountain_spirit
          text: Your wish has been heard. You shall be a cloud.

    - id: ch04
      title: The Wish to Be the Rock
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: And so he became a cloud and settled between the sun and the earth. He caught the sun's beams and held them back. To his delight, the earth turned green again and flowers began to bloom.
        - id: ch04-b02
          speaker: narrator
          text: Yet this was not enough for him either. For days and weeks, he poured rain onto the land. Rivers rose over their banks, and the rice crops stood deep in water. The force of the rain destroyed towns and villages. Only the great rock in the mountainside stayed exactly where it was.
        - id: ch04-b03
          speaker: narrator
          text: The cloud stared at the rock in amazement.
        - id: ch04-b04
          speaker: stone_cutter
          text: Is the rock mightier than I am? If only I were the rock!
          emotion: surprised
        - id: ch04-b05
          speaker: mountain_spirit
          text: Your wish has been heard. You shall be the rock.

    - id: ch05
      title: The Wish to Be a Man
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: And so he became the rock and gloried in his strength. He stood proudly on the mountainside. The burning sun could not move him, and neither could the driving rain.
        - id: ch05-b02
          speaker: stone_cutter
          text: This is better than everything else!
          emotion: happy
        - id: ch05-b03
          speaker: narrator
          text: Then one day, he heard a strange sound down near his feet. He looked and saw a stone-cutter hammering tools into his surface. As he watched, a shudder ran through the whole rock. A great block split away and crashed to the ground.
        - id: ch05-b04
          speaker: stone_cutter
          text: Can a mere child of the earth be mightier than a rock? If only I were a man again!
          emotion: angry
        - id: ch05-b05
          speaker: mountain_spirit
          text: Your wish has been heard. You shall be a man once more.

    - id: ch06
      title: Happy at Last
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: And so he became a man again. With sweat on his brow, he returned to the hard work of cutting stone. His bed was hard and he had little food, but now he had learned to be satisfied with both.
        - id: ch06-b02
          speaker: narrator
          text: He no longer wished to become someone or something else. He stopped asking for what he did not have, and he no longer wanted to be greater or mightier than other people.
        - id: ch06-b03
          speaker: narrator
          text: At last, the stone-cutter was happy, and he never heard the mountain spirit's voice again.
