  chapters:
    - id: ch01
      title: The Hare at the Mill
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was an emperor with three fine young sons. All three loved to hunt, and scarcely a day passed without one of them riding out in search of game.
        - id: ch01-b02
          speaker: narrator
          text: One morning, the eldest prince rode toward a nearby forest where every kind of wild animal could be found. Before he had gone far, a hare sprang from a thicket and darted across the road. He chased it over hills and through valleys until it slipped into a mill beside a river.
        - id: ch01-b03
          speaker: narrator
          text: The prince hurried inside, then froze at the door. The hare was gone. In its place stood a dragon, breathing fire and flame. The prince turned to escape, but a fiery tongue curled around his waist and pulled him into the dragon's mouth. No one saw him again.
        - id: ch01-b04
          speaker: narrator
          text: A week went by. When the prince still had not returned, everyone in town grew anxious. His next brother told the emperor he would hunt too, and perhaps discover what had happened.
        - id: ch01-b05
          speaker: narrator
          text: He had barely passed through the castle gates when the same hare leaped from the bushes. It led him uphill and downhill to the mill. The hare flew through the open door, and the prince followed close behind. Again the creature became a fire-breathing dragon. Its fiery tongue wrapped around the young man's waist and lifted him straight into its mouth. He too was seen no more.
        - id: ch01-b06
          speaker: narrator
          text: More days passed. The emperor waited and waited for sons who never came home. At night he could not sleep for wondering where they were and what had become of them. The youngest prince wished to go in search of his brothers, but for a long time his father would not even listen. He was afraid of losing his last son as well. The young man pleaded so earnestly, and promised so often to be cautious and careful, that at last the emperor gave permission. He ordered the finest horse in his stables to be saddled for the journey.
        - id: ch01-b07
          speaker: narrator
          text: Full of hope, the youngest prince rode from the city. He had scarcely passed the walls when the hare sprang from the bushes and ran ahead of him all the way to the mill. As before, it dashed through the open doorway. This time no prince followed. Wiser than his brothers, the young man turned his horse away and spoke to himself.
        - id: ch01-b08
          speaker: prince
          text: There are plenty of good hares still in the forest. Once I have caught those, I can come back for you.
        - id: ch01-b09
          speaker: narrator
          text: He searched the mountain for hours without seeing any game. At last, tired of waiting, he returned to the mill. An old woman was sitting there, and he greeted her kindly.
        - id: ch01-b10
          speaker: prince
          text: Good morning, little mother.
        - id: ch01-b11
          speaker: old_woman
          text: Good morning, my son.
        - id: ch01-b12
          speaker: prince
          text: Can you tell me where my hare has gone?
        - id: ch01-b13
          speaker: old_woman
          text: My son, that creature was no hare. It was a dragon. It has lured many men here and eaten every one of them.
        - id: ch01-b14
          speaker: narrator
          text: The prince's heart sank.
        - id: ch01-b15
          speaker: prince
          text: Then my brothers came here too, and the dragon ate them!
          emotion: sad
        - id: ch01-b16
          speaker: old_woman
          text: You have understood the truth. My best advice is to go home now, before you meet the same fate.
        - id: ch01-b17
          speaker: prince
          text: Won't you leave this dreadful place with me?
        - id: ch01-b18
          speaker: old_woman
          text: The dragon took me prisoner as well. I cannot free myself from his chains.
        - id: ch01-b19
          speaker: prince
          text: Then do this for me. When he returns, ask where he goes whenever he leaves and what gives him such strength. Coax the secret out of him, and tell me when I come back.

    - id: ch02
      title: The Dragon's Secret
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The prince went home, while the old woman remained a prisoner in the mill. As soon as the dragon returned from his travels, she began to question him.
        - id: ch02-b02
          speaker: old_woman
          text: Where have you been all this time? You must have traveled a great distance.
        - id: ch02-b03
          speaker: dragon
          text: Yes, little mother. I have been very far away indeed.
        - id: ch02-b04
          speaker: narrator
          text: She praised his cleverness and flattered him until he seemed pleased.
        - id: ch02-b05
          speaker: old_woman
          text: I often wonder where all your strength comes from. Please tell me. I would bend down and kiss the very place out of pure love.
        - id: ch02-b06
          speaker: narrator
          text: The dragon laughed.
        - id: ch02-b07
          speaker: dragon
          text: My strength is hidden in that hearthstone.
        - id: ch02-b08
          speaker: narrator
          text: The old woman jumped up and kissed the hearth. The dragon laughed even harder.
        - id: ch02-b09
          speaker: dragon
          text: You foolish creature! I was teasing you. My strength is really inside that tall tree.
        - id: ch02-b10
          speaker: narrator
          text: She hurried to the tree, threw her arms around it, and kissed it heartily. The dragon roared with laughter at the sight.
        - id: ch02-b11
          speaker: dragon
          text: Old fool! Did you truly believe my strength came from a tree?
        - id: ch02-b12
          speaker: old_woman
          text: Then where does it come from?
        - id: ch02-b13
          speaker: narrator
          text: She was rather cross now, for she disliked being mocked.
        - id: ch02-b14
          speaker: dragon
          text: My strength lies so far away that you could never reach it. In a distant kingdom, beside the capital, there is a lake. A dragon lives in that lake. Inside the dragon is a wild boar, inside the boar is a pigeon, inside the pigeon is a sparrow, and inside that sparrow lies my strength.
        - id: ch02-b15
          speaker: narrator
          text: The old woman knew that more flattery would do no good. She could never take his strength herself.
        - id: ch02-b16
          speaker: narrator
          text: The dragon left the mill the following morning, and the prince soon returned. The old woman told him the whole tale, including every hiding place the creature had named and the distant secret he had finally confessed. The prince listened in silence. Then he went back to the castle, changed his royal clothes for a shepherd's suit, and took a staff in his hand. Without telling anyone who he was, he set out to find work tending sheep.
        - id: ch02-b17
          speaker: narrator
          text: For a long while he wandered from village to village and town to town. At last he entered a distant kingdom and came to its great capital city. A vast lake surrounded the city on three sides. By chance, or perhaps by fortune, it was the very lake the old woman had described, and the second dragon lived beneath its waters.
        - id: ch02-b18
          speaker: narrator
          text: As he always did in a new place, the prince stopped anyone in the streets who looked as though he might employ a shepherd. He asked each man for work. Some already had shepherds of their own, while others had no need of one. The prince was beginning to lose heart when a passerby overheard him. The man turned back and advised him to ask the emperor, who was searching for someone to look after the imperial flocks.
        - id: ch02-b19
          speaker: lake_emperor
          text: Will you take care of my sheep?
        - id: ch02-b20
          speaker: prince
          text: Most willingly, Your Majesty.
        - id: ch02-b21
          speaker: lake_emperor
          text: Outside the walls stands a great lake, with the richest meadows in my kingdom along its banks. The sheep will run straight there, but no flock that reached those meadows has ever returned. Do not let them choose their own way. Drive them wherever you think safest.
        - id: ch02-b22
          speaker: narrator
          text: The prince bowed low, thanked the emperor for his warning, and promised to do everything he could to bring the sheep home safely. After leaving the palace, he went straight to the marketplace. There he bought two greyhounds, a hunting hawk, and a set of pipes. With those companions beside him, he took charge of the flock and drove it out toward the pasture.

    - id: ch03
      title: Two Battles at the Lake
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The moment the sheep saw the lake, they raced toward its green meadows. The prince made no attempt to stop them. He set the hawk on a tree branch, laid his pipes in the grass, and ordered the greyhounds to stay. Then he rolled up his sleeves and trousers and waded into the water.
        - id: ch03-b02
          speaker: prince
          text: Dragon! If you are no coward, come out and fight me!
        - id: ch03-b03
          speaker: dragon
          text: I am waiting for you, O prince.
        - id: ch03-b04
          speaker: narrator
          text: The dragon rose from the lake, huge and horrible. The prince sprang at him. They locked their arms around each other and struggled until the sun stood high at noon. At last the dragon gasped for breath.
        - id: ch03-b05
          speaker: dragon
          text: Let me cool my burning head in the lake just once, and I will throw you to the very top of the sky.
        - id: ch03-b06
          speaker: prince
          text: Oh, no, my good dragon. Do not boast too soon! If the emperor's daughter were here to kiss my forehead, I would throw you higher still.
        - id: ch03-b07
          speaker: narrator
          text: At once the dragon's grip weakened, and he fell backward into the lake.
        - id: ch03-b08
          speaker: narrator
          text: The prince waited until evening, then washed away every mark of the long struggle. He settled the hawk on his shoulder and tucked the pipes beneath his arm. The two greyhounds trotted in front, while the whole flock followed behind. As this strange procession passed through the city streets, people stopped and stared in wonder. Every earlier flock driven to those meadows had vanished. Never before had a single one returned from the lake.
        - id: ch03-b09
          speaker: narrator
          text: Early the next morning, the prince rose and led the sheep down the road toward the lake once more. This time the emperor sent two mounted men after him with orders to watch everything he did. The riders followed far enough behind to remain unseen, but they never lost sight of the shepherd or his flock. When the sheep began racing toward the rich meadows, the horsemen turned aside and climbed a steep hill overlooking the water. From there they could see the whole lake.
        - id: ch03-b10
          speaker: narrator
          text: The shepherd put his pipes in the grass, seated the hounds beside them, and perched the hawk in its tree. Once more he rolled up his clothes and entered the water.
        - id: ch03-b11
          speaker: prince
          text: Dragon! If you are no coward, come out and fight me!
        - id: ch03-b12
          speaker: dragon
          text: I am waiting for you, O prince.
        - id: ch03-b13
          speaker: narrator
          text: Again the monster reared from the water. They gripped each other tightly and fought until noon, beneath the hottest sun. Then the dragon began to gasp.
        - id: ch03-b14
          speaker: dragon
          text: Let me dip my burning head in the lake once, and I will hurl you to the top of the sky.
        - id: ch03-b15
          speaker: prince
          text: Do not crow too soon, my good dragon! If the emperor's daughter came and kissed my forehead, I would send you higher still.
        - id: ch03-b16
          speaker: narrator
          text: The dragon's hold suddenly loosened, and he dropped into the lake.
        - id: ch03-b17
          speaker: narrator
          text: When evening came, the prince gathered every sheep. This time he played his pipes as he marched before them toward the city, with the animals following the music. The moment they passed through the gates, people came pouring out of their houses. They stared in wonder at the shepherd and at the flock, for the lake had given up its prey for a second day.
        - id: ch03-b18
          speaker: narrator
          text: Meanwhile, the two horsemen had galloped ahead. They told the emperor exactly how the shepherd had challenged the dragon, how the two had fought until noon, and what the prince had said about the emperor's daughter. The emperor listened eagerly to every word. Then he called his only daughter to him and repeated the entire story.
        - id: ch03-b19
          speaker: lake_emperor
          text: Tomorrow you will go to the lake with the shepherd. When he asks, you must kiss him on the forehead.
        - id: ch03-b20
          speaker: narrator
          text: The princess burst into tears.
        - id: ch03-b21
          speaker: princess
          text: Will you truly send your only child to that dreadful place? I may never return!
          emotion: fearful
        - id: ch03-b22
          speaker: lake_emperor
          text: Do not be afraid, my little daughter. Many shepherds went to that lake and never came back. This one has fought the dragon twice in two days and escaped without a wound. I believe he can kill the monster tomorrow and free our land from the creature that has slain so many brave men.
          emotion: calm

    - id: ch04
      title: The Dragon Broken
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next morning, the sun had scarcely begun to show above the hills when the princess stood beside the shepherd, ready to leave for the lake. The young man was brimming with joy because the final struggle was near. The princess could think only of the terrible monster waiting for them, and she wept bitterly.
        - id: ch04-b02
          speaker: prince
          text: Please dry your tears. Do exactly what I ask. When the moment comes, run to me and kiss my forehead. Then you will have nothing to fear.
          emotion: calm
        - id: ch04-b03
          speaker: narrator
          text: The shepherd blew a merry tune on his pipes and marched at the head of the flock. The princess walked beside him, still crying. Every now and then he lowered the pipes and tried once more to comfort her. In this way they traveled together until the lake came into view.
        - id: ch04-b04
          speaker: prince
          text: Do not cry, Heart of Gold. Trust me. You are safe with me.
          emotion: calm
        - id: ch04-b05
          speaker: narrator
          text: When they reached the lake, the sheep scattered across the meadows. The prince placed the hawk in the tree, set down his pipes, and made the greyhounds lie beside them. He rolled up his sleeves and trousers and waded out.
        - id: ch04-b06
          speaker: prince
          text: Dragon! If you are no coward, come out for one last fight!
        - id: ch04-b07
          speaker: dragon
          text: I am waiting for you, O prince.
        - id: ch04-b08
          speaker: narrator
          text: Huge and terrible, the dragon rose from the lake and swept toward the shore. The prince leaped to meet him. They seized each other around the body and fought until noon. Under the burning sun, the dragon cried out.
        - id: ch04-b09
          speaker: dragon
          text: Let me cool my burning head in the lake, and I will fling you to the top of the sky.
        - id: ch04-b10
          speaker: prince
          text: Do not boast too soon, my good dragon! If the emperor's daughter were here to kiss my forehead, I would throw you higher still.
        - id: ch04-b11
          speaker: narrator
          text: The princess heard him and ran forward. She kissed his forehead. The prince swung the dragon straight into the clouds. When the monster struck the earth again, it shattered into a thousand pieces.
        - id: ch04-b12
          speaker: narrator
          text: A wild boar sprang from those pieces and raced away. The prince sent his greyhounds after it. They caught the boar and tore it apart. A hare leaped from the remains, but the hounds chased and killed it too. Then a pigeon flew from the hare.
        - id: ch04-b13
          speaker: narrator
          text: The prince released his hawk. It soared high, swooped upon the pigeon, and carried the bird back to him. He opened the pigeon and found a sparrow inside, just as the old woman had said.
        - id: ch04-b14
          speaker: prince
          text: Now you must tell me where I can find my brothers.
        - id: ch04-b15
          speaker: sparrow
          text: Please do not hurt me, and I will gladly tell you. Behind your father's castle is a mill. Inside it are three slender twigs. Cut them off and strike their roots. An iron cellar door will open. The cellar holds enough men, women, and children to fill a kingdom, and your brothers are among them.
          emotion: fearful

    - id: ch05
      title: The Wedding Feast
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: By the time the sparrow had revealed its secret, twilight had fallen. The prince washed the dust of the battle from himself in the lake. Then he settled the hawk on his shoulder and tucked the pipes beneath his arm. The greyhounds went before him, the sheep followed behind, and he marched happily toward town. The princess came after the whole procession. Though the danger was over, she was still trembling from everything she had seen.
        - id: ch05-b02
          speaker: narrator
          text: Wondering crowds filled the streets as they passed toward the castle. Unknown to them, the emperor had ridden out and hidden on the hill. From there he had seen everything.
        - id: ch05-b03
          speaker: narrator
          text: Once the dragon's power was broken forever, the emperor galloped back. He welcomed the prince with open arms and promised him the princess as his wife.
        - id: ch05-b04
          speaker: narrator
          text: Their wedding took place with great splendor. For a whole week, colored lamps shone throughout the town. Long tables stood ready in the castle hall, covered with food for anyone who chose to enter and eat. The celebration continued day after day until the week-long feast was done.
        - id: ch05-b05
          speaker: narrator
          text: When the feast was over, the prince at last told the emperor and all the assembled people who he truly was. He was no common shepherd, but the youngest son of another emperor. Everyone rejoiced even more at the news. Preparations began at once for the prince and princess to return to his own kingdom. The prince was impatient to leave, because his first thought was still to open the hidden cellar and set his brothers free.

    - id: ch06
      title: The Cellar Door
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: As soon as he reached his homeland, the prince hurried to the mill. He found the three twigs exactly where the sparrow had promised. The instant he cut them and struck their roots, the iron door flew open.
        - id: ch06-b02
          speaker: narrator
          text: From the darkness below came a countless multitude. Young and old, men and women, and children too streamed through the doorway, enough people to fill an entire kingdom. The prince told them to pass out one by one and go wherever they wished. He himself would not leave the entrance. He waited there and watched every face until at last his two missing brothers stepped into the light.
        - id: ch06-b03
          speaker: narrator
          text: What joy there was when the three brothers met again! The elder princes had believed they would remain enchanted prisoners forever. Now they listened in delight as their youngest brother told them how he had discovered the dragon's secret, crossed into the distant kingdom, fought beside the lake, and finally broken the spell that held them.
        - id: ch06-b04
          speaker: narrator
          text: They returned home with him and served him for the rest of their lives. They said that only the brother who had proved himself brave and faithful was fit to be king.
