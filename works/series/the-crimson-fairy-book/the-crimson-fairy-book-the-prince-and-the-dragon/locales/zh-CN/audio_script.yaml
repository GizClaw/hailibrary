audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而带几分诙谐，像在讲一则古老的俄罗斯童话
        timbre: 温暖清亮
        pace: 舒缓，转折处有自然停顿
        pitch: 中音
    young_prince:
      display_name: 小王子
      tts:
        delivery: 勇敢机敏，待人温和，迎战时坚定有力
        timbre: 清朗坚实
        pace: 中速
        pitch: 中音
    emperor_father:
      display_name: 老皇帝
      tts:
        delivery: 慈爱而忧心，作出决定时庄重果断
        timbre: 浑厚苍老
        pace: 中速偏慢
        pitch: 中低音
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 苍老谨慎，套取秘密时殷勤机巧
        timbre: 沙哑温厚
        pace: 舒缓
        pitch: 中低音
    mill_dragon:
      display_name: 磨坊恶龙
      tts:
        delivery: 狂妄残忍，被奉承时得意轻浮
        timbre: 粗砺低沉
        pace: 中速偏慢
        pitch: 低音
    distant_emperor:
      display_name: 远方皇帝
      tts:
        delivery: 威严审慎，对臣民怀着深切忧虑
        timbre: 深厚庄重
        pace: 中速偏慢
        pitch: 低音
    lake_dragon:
      display_name: 湖中恶龙
      tts:
        delivery: 凶狠傲慢，搏斗中气喘却仍爱夸口
        timbre: 沉重可怖
        pace: 中速偏慢
        pitch: 低音
    princess:
      display_name: 公主
      tts:
        delivery: 温柔真诚，害怕时声音发颤，行动时勇敢果决
        timbre: 明亮柔和
        pace: 中速
        pitch: 中高音
    sparrow:
      display_name: 麻雀
      tts:
        delivery: 惊慌急切，为求活命回答得清楚利落
        timbre: 细小清脆
        pace: 中速偏快
        pitch: 高音
  chapters:
    - id: ch01
      title: 两位王子失踪
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一位皇帝，养育了三个儿子。三位王子都长得英俊健壮，也都喜欢打猎，差不多每天都有人骑马出城，追逐林中的野兽。
        - id: ch01-b02
          speaker: narrator
          text: 一天清早，大王子骑马去了附近的树林。才离开城堡不远，一只野兔突然蹿出树丛，从路上飞奔过去。王子马上追了上去，跟着它翻过山，越过山谷，一路来到河边的磨坊。野兔钻进门里，王子也紧跟着闯了进去。
        - id: ch01-b03
          speaker: narrator
          text: 可他刚到门口，就吓得停住了。眼前根本没有野兔，只有一条口吐烈焰的恶龙。王子转身想逃，一条火舌已经缠住他的腰，把他拖进了恶龙嘴里。从那以后，谁也没有再见过他。
        - id: ch01-b04
          speaker: narrator
          text: 一个星期过去，大王子一直没有回来，全城的人都不安起来。二王子向父皇请命，想出去打猎，也想找找哥哥留下的踪迹。可城门才在他身后合上，那只野兔便又从灌木里蹿了出来。它像上次一样，带着猎人越过山岭，跑进了磨坊。
        - id: ch01-b05
          speaker: narrator
          text: 二王子随后追进去，迎面看见的也是那条喷火的恶龙。火舌猛地射来，卷住他的腰，把他送进恶龙口中。此后，他也再没有出现。
        - id: ch01-b06
          speaker: narrator
          text: 日子一天天过去，皇帝左等右等，两个儿子始终杳无音信。他夜夜睡不着，总在猜他们去了哪里，又遇上了什么。小王子想把两位哥哥找回来，父亲却怕最后一个儿子也会失踪，很久都不答应。直到小王子再三恳求，又保证处处小心，皇帝才点了头，还叫人牵来马厩里最好的骏马。
        - id: ch01-b07
          speaker: narrator
          text: 小王子满怀希望地出了城。刚走过城墙，野兔又从灌木丛中跳出来，领着他直奔磨坊。它穿过敞开的门，可这一回，王子没有追进去。他比两位哥哥更机警，掉转马头时暗自想，林子里又不是只有这一只兔子，等我在别处捉到猎物，再回来找你也不迟。
        - id: ch01-b08
          speaker: narrator
          text: 他骑着马在山间转了几个钟头，连一只野兽也没碰见。最后实在等得不耐烦，便回到了磨坊。屋里坐着一位老妇人，王子客客气气地向她问候。
        - id: ch01-b09
          speaker: young_prince
          text: 早安，老妈妈。
        - id: ch01-b10
          speaker: old_woman
          text: 早安，我的孩子。
        - id: ch01-b11
          speaker: young_prince
          text: 老妈妈，请问我的野兔跑到哪里去了？
        - id: ch01-b12
          speaker: old_woman
          text: 孩子，那根本不是兔子，是一条恶龙。它把人骗到磨坊来，再一个一个吃掉。已经有许多人遭了它的毒手。
        - id: ch01-b13
          speaker: narrator
          text: 王子的心一下沉了下去。
        - id: ch01-b14
          speaker: young_prince
          text: 那么，我的两个哥哥一定也到过这里。他们已经被恶龙吃了！
        - id: ch01-b15
          speaker: old_woman
          text: 你猜对了。听我一句劝，赶紧回家吧，不然你也会落得和他们一样。
        - id: ch01-b16
          speaker: young_prince
          text: 这里这么可怕，你不肯跟我一起走吗？
        - id: ch01-b17
          speaker: old_woman
          text: 我也是被它抓来的。它用锁链困住我，我怎么也逃不掉。
        - id: ch01-b18
          speaker: young_prince
          text: 那你听我说。等恶龙回来，就问它每次出门去了哪里，再想办法问出它为什么这样强大。等我下次来，你把秘密告诉我。
        - id: ch01-b19
          speaker: narrator
          text: 说完，王子回家去了，老妇人独自留在磨坊里。
    - id: ch02
      title: 恶龙的力量
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 恶龙回到磨坊，老妇人立刻问起它的行踪。
        - id: ch02-b02
          speaker: old_woman
          text: 你去了这么久，一定走到很远的地方了吧？
        - id: ch02-b03
          speaker: mill_dragon
          text: 不错，老妈妈，我的确去了很远的地方。
        - id: ch02-b04
          speaker: narrator
          text: 老妇人连声奉承，夸它有天大的本领。见恶龙被哄得十分高兴，她才慢慢问到真正想知道的事。
        - id: ch02-b05
          speaker: old_woman
          text: 我总在想，你这么强大的力量究竟从哪儿来。你要是肯告诉我，我一定会弯下腰，好好亲吻那个地方，让你知道我多么爱你。
        - id: ch02-b06
          speaker: narrator
          text: 恶龙听了哈哈大笑。
        - id: ch02-b07
          speaker: mill_dragon
          text: 我的力量就藏在那边的炉石里。
        - id: ch02-b08
          speaker: narrator
          text: 老妇人一下跳起来，跑去亲吻炉台。恶龙笑得更厉害了。
        - id: ch02-b09
          speaker: mill_dragon
          text: 你这个傻东西！我只是逗你玩。我的力量不在炉石里，在那棵高高的大树里。
        - id: ch02-b10
          speaker: narrator
          text: 老妇人又扑过去，双臂抱紧大树，热烈地亲吻树干。恶龙看着她的模样，顿时放声大笑，好半天才停下来。
        - id: ch02-b11
          speaker: mill_dragon
          text: 老傻瓜，你还真信我的力量是从树里来的？
        - id: ch02-b12
          speaker: old_woman
          text: 那它到底藏在哪里？
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 老妇人有些恼火，她可不喜欢这样受人取笑。
        - id: ch02-b14
          speaker: mill_dragon
          text: 我的力量藏得太远，你一辈子也到不了。远方有一个王国，都城旁边有座湖。湖里住着一条恶龙，恶龙肚里藏着一头野猪，野猪肚里藏着一只鸽子，鸽子肚里还有一只麻雀。我的力量，就在那只麻雀体内。
        - id: ch02-b15
          speaker: narrator
          text: 老妇人听完，知道再怎么奉承也没有用了。那地方实在太远，她永远不可能亲手夺走恶龙的力量。
        - id: ch02-b16
          speaker: narrator
          text: 第二天早晨，恶龙刚离开，王子便回到磨坊。老妇人把昨晚听见的一切全告诉了他。王子静静听完，回城换上一身牧羊人的衣服，拿着一根木杖，动身去找替人放羊的差事。
    - id: ch03
      title: 湖边的牧羊人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王子走过一个又一个村庄，穿过一座又一座城镇，漂泊了许多天，终于来到那个遥远王国的大城。城的三面环着一片宽阔的湖，恶龙就住在湖水深处。
        - id: ch03-b02
          speaker: narrator
          text: 一路上，他见到可能需要牧羊人的人，总要上前询问。可他们不是已经雇了人，就是根本没有羊要照看。王子渐渐灰了心。就在这时，一个听见他到处求职的男人告诉他，皇帝正缺人照料羊群，最好进宫去问一问。
        - id: ch03-b03
          speaker: narrator
          text: 王子来到皇帝面前，跪下行礼。皇帝先问他愿不愿意接下这份差事。
        - id: ch03-b04
          speaker: distant_emperor
          text: 你愿意替我放羊吗？
        - id: ch03-b05
          speaker: young_prince
          text: 陛下，我十分愿意。
        - id: ch03-b06
          speaker: narrator
          text: 他恭敬地听着，皇帝便把最要紧的事讲给他。
        - id: ch03-b07
          speaker: distant_emperor
          text: 城外有一座大湖，湖岸边长着全国最肥美的青草。羊群一出城，就会径直往那里跑。可凡是到过湖边的羊，没有一群能够回来。你一定要小心，孩子，别任由它们想去哪儿就去哪儿。你觉得哪里安全，就把它们赶到哪里。
        - id: ch03-b08
          speaker: narrator
          text: 王子深深鞠躬，谢过皇帝的提醒，也答应尽全力护住羊群。离开宫殿后，他到集市买了两条灰狗、一只鹰和一管牧笛，这才赶着羊出城。
        - id: ch03-b09
          speaker: narrator
          text: 羊群一看见湖水，马上撒腿奔向岸边青绿的草场。王子没有阻拦。他让鹰停在树枝上，把牧笛放到草地上，又命两条灰狗坐好别动。随后，他卷起衣袖和裤腿，径直走进水里。
        - id: ch03-b10
          speaker: young_prince
          text: 恶龙！恶龙！你要不是胆小鬼，就出来跟我较量！
        - id: ch03-b11
          speaker: lake_dragon
          text: 王子，我一直在等你。
        - id: ch03-b12
          speaker: narrator
          text: 声音从湖底传来。紧接着，恶龙从水里直起庞大可怖的身躯。王子迎面扑去，双方死死抱住彼此，从早晨一直打到正午。太阳已经升得很高，恶龙喘着粗气开了口。
        - id: ch03-b13
          speaker: lake_dragon
          text: 王子，让我把滚烫的脑袋放进湖里蘸一下。等我凉快过来，就把你扔到天顶上去！
        - id: ch03-b14
          speaker: young_prince
          text: 哈，好恶龙，别这么早夸口！要是皇帝的女儿在这里，肯亲一下我的额头，我能把你扔得更高！
        - id: ch03-b15
          speaker: narrator
          text: 恶龙忽然松开双臂，跌回了湖里。
        - id: ch03-b16
          speaker: narrator
          text: 到了傍晚，王子洗掉身上打斗的痕迹，把鹰架在肩头，牧笛夹在臂下。两条灰狗走在前面，羊群跟在后面，一起向城里走去。队伍穿过街道时，百姓全都惊奇地望着他们。过去从没有一群羊能从湖边活着回来。
        - id: ch03-b17
          speaker: narrator
          text: 第二天清早，王子又赶着羊群上路。皇帝悄悄派出两个骑手，让他们跟在后面监视一整天。两人始终看得见王子，自己却没有被发现。羊群向湖边跑去时，他们转上旁边的陡山，在高处俯看湖面。
        - id: ch03-b18
          speaker: narrator
          text: 王子到了草场，还是把牧笛留在草地上，让灰狗守着，又把鹰安置在树枝上。随后，他卷起衣袖裤腿，踏进湖水，再次向恶龙挑战。
        - id: ch03-b19
          speaker: young_prince
          text: 恶龙！恶龙！你要不是胆小鬼，就出来跟我较量！
        - id: ch03-b20
          speaker: lake_dragon
          text: 王子，我一直在等你。
        - id: ch03-b21
          speaker: narrator
          text: 恶龙又从湖里升起。它身形巨大，样子吓人，一上来便和王子紧紧扭在一起。两人一直斗到烈日当头，恶龙热得气喘吁吁。
        - id: ch03-b22
          speaker: lake_dragon
          text: 王子，让我把滚烫的脑袋放进湖里蘸一下。等我凉快过来，就把你扔到天顶上去！
        - id: ch03-b23
          speaker: young_prince
          text: 哈，好恶龙，别这么早夸口！要是皇帝的女儿在这里，肯亲一下我的额头，我能把你扔得更高！
        - id: ch03-b24
          speaker: narrator
          text: 恶龙双臂一松，又跌回湖中。
        - id: ch03-b25
          speaker: narrator
          text: 傍晚，王子收拢羊群，吹着牧笛走在最前面，把它们带回城里。穿过城门时，百姓纷纷走出家门，瞪大眼睛看着这支平安归来的队伍。
        - id: ch03-b26
          speaker: narrator
          text: 两名骑手早已飞马回宫，把亲眼看见、亲耳听到的一切都禀报给皇帝。皇帝仔细听完，叫来自己的女儿，把事情从头到尾讲了一遍。
        - id: ch03-b27
          speaker: distant_emperor
          text: 明天你要跟牧羊人去湖边。等他需要时，就照他的愿望，在他额头上亲一下。
        - id: ch03-b28
          speaker: narrator
          text: 公主听见父亲的命令，眼泪顿时涌了出来。
        - id: ch03-b29
          speaker: princess
          text: 父皇，您真要把唯一的女儿送去那么可怕的地方吗？我这一去，恐怕再也回不来了！
          emotion: fearful
        - id: ch03-b30
          speaker: distant_emperor
          text: 别怕，我的小女儿，你会平安回来的。过去那么多牧羊人去了湖边，没有一个能回来。这个人却连续两天和恶龙交手，两次都毫发无伤。我盼着他明天彻底杀掉恶龙，救下我们的国土。那怪物已经害死太多勇敢的人了。
    - id: ch04
      title: 公主的一吻
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天清晨，太阳才从山头露出来，公主已经站在牧羊人身旁，准备和他一起去湖边。王子心里满是欢喜，公主却不停地流泪。
        - id: ch04-b02
          speaker: young_prince
          text: 请擦干眼泪吧。你只要听我的，等时机到了，跑过来亲一下我的额头。别的什么也不用做，更不用害怕。
          emotion: calm
        - id: ch04-b03
          speaker: narrator
          text: 牧羊人走在羊群前面，快活地吹着牧笛。每走一段，他便放下笛子，安慰身边哭泣的姑娘。
        - id: ch04-b04
          speaker: young_prince
          text: 别哭了，金子般的心。相信我，不会有事的。
          emotion: calm
        - id: ch04-b05
          speaker: narrator
          text: 他们就这样来到湖边。转眼间，羊群已经散满草场。王子让鹰停在树上，把牧笛放到草地，又叫两条灰狗卧在旁边。他卷起裤腿和衣袖，走进了水中。
        - id: ch04-b06
          speaker: young_prince
          text: 恶龙！恶龙！你要不是胆小鬼，就出来吧，我们再较量一回！
        - id: ch04-b07
          speaker: lake_dragon
          text: 王子，我一直在等你。
        - id: ch04-b08
          speaker: narrator
          text: 恶龙立刻从水中直起身来，庞大的躯体看上去十分可怖。它迅速逼近湖岸，王子纵身迎上。双方抱紧彼此，从清晨一直打到正午。太阳最灼热的时候，恶龙叫喊起来。
        - id: ch04-b09
          speaker: lake_dragon
          text: 王子，让我把滚烫的脑袋放进湖里蘸一下。等我凉快过来，就把你扔到天顶上去！
        - id: ch04-b10
          speaker: young_prince
          text: 哈，好恶龙，别这么早夸口！要是皇帝的女儿在这里，肯亲一下我的额头，我能把你扔得更高！
        - id: ch04-b11
          speaker: narrator
          text: 公主一直留心听着。王子的话还没说完，她已经跑到跟前，在他的额头上亲了一下。王子顿时发力，把恶龙一把抡上云端。恶龙重重落回地面，摔成了一千块碎片。
        - id: ch04-b12
          speaker: narrator
          text: 碎片中忽然蹿出一头野猪，撒腿就逃。王子立即唤两条灰狗追赶。灰狗捉住野猪，把它撕成碎片，里面又跳出一只野兔。两条狗转眼赶上，把野兔咬死，一只鸽子随即从兔子体内飞了出来。
        - id: ch04-b13
          speaker: narrator
          text: 王子连忙放出鹰。鹰冲上高空，又飞快俯冲，牢牢抓住鸽子，把它送回主人手中。王子剖开鸽子，果然在里面找到了老妇人说的那只麻雀。
        - id: ch04-b14
          speaker: young_prince
          text: 现在，你该告诉我到哪里去找两位哥哥了。
        - id: ch04-b15
          speaker: sparrow
          text: 别伤害我，我什么都告诉你。你父亲的城堡后面有一座磨坊，磨坊里放着三根细枝。折下它们，拿去抽打树根，地窖的铁门就会打开。里面关着数不清的男女老少，多得足以装满一个王国。你的两位哥哥也在那里。
          emotion: fearful
        - id: ch04-b16
          speaker: narrator
          text: 这时，暮色已经落下。王子在湖中洗净身体，把鹰架上肩头，把牧笛夹在臂下。两条灰狗走在前，羊群跟在后，他高高兴兴地踏上归途。公主依旧吓得浑身发抖，一路跟在队伍旁边。他们穿过挤满惊奇人群的街道，回到了城堡。
    - id: ch05
      title: 盛大婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 谁也没有想到，皇帝早已独自骑马溜出城。他藏在山上，把湖边发生的一切看得清清楚楚。等恶龙彻底死去，他立刻飞马赶回城堡，张开双臂迎接王子，还答应把女儿嫁给他。
        - id: ch05-b02
          speaker: narrator
          text: 婚礼办得无比盛大。整整七天，城里到处悬着彩灯，城堡大厅里摆满宴席，不管谁想来吃，都可以坐下享用。
        - id: ch05-b03
          speaker: narrator
          text: 直到宴会结束，王子才向皇帝和百姓说出自己的真实身份。人们听说这位勇士原来也是王子，更加欢喜。他们马上开始准备，让新婚夫妇返回王子的故国，因为他还急着救出两位哥哥。
    - id: ch06
      title: 兄弟重逢
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 王子一回到自己的国家，头一件事就是赶去城堡后面的磨坊。他果然找到了麻雀所说的三根细枝。细枝才抽到树根上，地窖的铁门便猛然敞开。数不清的男女老少从地下涌出来，仿佛真能装满一个王国。
        - id: ch06-b02
          speaker: narrator
          text: 王子叫他们一个接一个离开，愿意去哪里就去哪里。他自己守在门边，始终没有离开，直到两位哥哥终于从地窖里走出来。
        - id: ch06-b03
          speaker: narrator
          text: 三兄弟重新相见，那份欢喜简直无法形容。两位哥哥也听说了弟弟为了破除魔法，曾怎样一路寻找，又怎样战胜恶龙。从此，他们跟随弟弟回到家中，一生一世都忠于他。他们说，只有这样勇敢又忠诚的人，才配成为国王。
