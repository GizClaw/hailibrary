  chapters:
    - id: ch01
      title: The Queen's Sorrow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there lived a king and queen who longed for a son. When no child came, they made a vow at the shrine of St. James. If their prayer was answered, their boy would go on pilgrimage as soon as his eighteenth birthday had passed. Then one evening, the king came home from hunting and found a baby lying in the cradle.
        - id: ch01-b02
          speaker: narrator
          text: Everyone crowded around to see him. They all said he was the most beautiful baby ever born. People always say that about babies, of course, but this time it was true. The boy grew bigger and stronger each day. When he was twelve, the king died, and the boy was left to care for his mother.
        - id: ch01-b03
          speaker: narrator
          text: Six years went by, and his eighteenth birthday came near. The queen's heart sank whenever she thought of it. Her son was the light of her eyes. How could she send him into all the unknown dangers of a pilgrim's road? Each day she grew sadder, and whenever she was alone, she wept bitterly.
        - id: ch01-b04
          speaker: narrator
          text: The queen thought no one knew of her sorrow. But one morning, her son asked her why she cried all day.
        - id: ch01-b05
          speaker: queen
          text: It is nothing, my son. Nothing at all. There is only one thing in the world that troubles me.
          emotion: sad
        - id: ch01-b06
          speaker: prince
          text: What is it? Are your estates being badly managed? Let me ride out and see for myself.
        - id: ch01-b07
          speaker: narrator
          text: That answer pleased the queen. He rode across the plains where she owned great estates, but he found everything in beautiful order. He returned in high spirits.
        - id: ch01-b08
          speaker: prince
          text: You can be happy again, Mother. Your lands are managed better than any others I saw. The cattle are thriving, the fields are thick with corn, and the harvest will soon be ready.
          emotion: happy
        - id: ch01-b09
          speaker: queen
          text: That is very good news.
        - id: ch01-b10
          speaker: narrator
          text: Yet the news changed nothing. The next morning, the queen was weeping and wailing as loudly as before. Her son could bear it no longer.
        - id: ch01-b11
          speaker: prince
          text: Dear Mother, if you will not tell me what makes you so miserable, I shall leave home and wander far across the world.
        - id: ch01-b12
          speaker: queen
          text: Oh, my son! I grieve because I must part from you. Before you were born, we vowed to St. James that after your eighteenth birthday, you would make a pilgrimage to his shrine. You will be eighteen very soon, and then I shall lose you. The shrine is so far away that I will not see you for a whole year.
          emotion: sad
        - id: ch01-b13
          speaker: prince
          text: Will the journey take only a year? Then please don't be so unhappy. Only the dead never return. As long as I live, you can be sure I will come home to you.

    - id: ch02
      title: Three Apples
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: In this way, the prince comforted his mother. On his eighteenth birthday, his best horse was brought to the palace door. Before mounting, he took leave of the queen. He called her his dear mother, said farewell, and promised that, with the help of fate, he would return as soon as he could.
        - id: ch02-b02
          speaker: narrator
          text: The queen burst into tears. Between her sobs, she took three apples from her pocket and held them out to him.
        - id: ch02-b03
          speaker: queen
          text: Take these apples, my son, and listen carefully. You will need a companion on this long journey. When you meet a young man you like, ask him to travel with you. At an inn, invite him to dinner. Then cut one apple into two pieces, one large and one small, and let him choose. If he takes the larger piece, leave him, because he is not a true friend. If he chooses the smaller one, treat him like a brother and share everything you have with him.
        - id: ch02-b04
          speaker: narrator
          text: She kissed him once more, gave him her blessing, and let him go. The prince rode a long way without seeing another living creature. At last, he spotted a youth about his own age. He urged his horse forward until he caught up.
        - id: ch02-b05
          speaker: first_youth
          text: Where are you headed, my fine fellow?
        - id: ch02-b06
          speaker: prince
          text: I am going to the shrine of St. James. Before I was born, my mother vowed that I would make this pilgrimage with a thank offering when I turned eighteen.
        - id: ch02-b07
          speaker: first_youth
          text: The same is true of me. Since we're traveling the same way, why don't we keep each other company?
        - id: ch02-b08
          speaker: narrator
          text: The prince agreed, though he was careful not to treat the stranger as a close companion before the apple had tested him. After a while, they reached an inn. The sight of it reminded the prince how hungry he was. He asked the youth to come inside and order some food with him. The other agreed, and soon they were sitting together over a good dinner.
        - id: ch02-b09
          speaker: narrator
          text: Once the meal was over, the prince drew an apple from his pocket. He cut it into one large piece and one small piece, then held them both out to the stranger. The youth chose the larger piece. The prince thought to himself that this young man was no friend of his. Rather than accuse him, he pretended to fall ill and declared that he could not continue the journey.
        - id: ch02-b10
          speaker: first_youth
          text: I can't wait for you. I must hurry on. Farewell.
        - id: ch02-b11
          speaker: prince
          text: Farewell.
        - id: ch02-b12
          speaker: narrator
          text: The prince was glad to be rid of him so easily. He stayed at the inn long enough to give the youth a good start, then ordered his horse and rode on. But he loved company, and the road felt long and dull when he was alone. He wished for a true friend, someone he could talk to.
        - id: ch02-b13
          speaker: narrator
          text: Before long, he caught up with another young man, who stopped and spoke to him.
        - id: ch02-b14
          speaker: second_youth
          text: Where are you going, my fine fellow?
        - id: ch02-b15
          speaker: narrator
          text: The prince told him that he was bound for the shrine of St. James. He explained that before his birth, his mother had vowed he would go there with a thank offering on his eighteenth birthday. Just like the first stranger, this young man said his own mother had made the same vow when he was born.
        - id: ch02-b16
          speaker: prince
          text: Then we can ride together.
        - id: ch02-b17
          speaker: narrator
          text: With someone beside him to talk to, the road seemed much shorter. At last, they reached an inn. The prince said he was very hungry and asked his companion to go in with him for something to eat. When dinner was over, he brought the second apple out of his pocket. He cut it into a large piece and a small one and offered them both. His companion took the large piece at once and quickly ate it.
        - id: ch02-b18
          speaker: narrator
          text: Again, the prince knew he had not found a friend. He began saying that he felt far too ill to continue. Once the young man had been given a good start, the prince set off by himself. Now the road felt longer and duller than ever. He sighed sadly. If only he could find a true friend, he thought, he would love that friend like a brother.
        - id: ch02-b19
          speaker: narrator
          text: Just then, he noticed a third youth traveling the same road. The youth came up beside him.
        - id: ch02-b20
          speaker: friend
          text: Which way are you going, my fine fellow?
        - id: ch02-b21
          speaker: narrator
          text: For the third time, the prince explained where he was going. He told the youth about his mother's vow and the pilgrimage he had to make now that he was eighteen.
        - id: ch02-b22
          speaker: friend
          text: Why, that's exactly what happened to me!
        - id: ch02-b23
          speaker: prince
          text: Then let us ride on together.
        - id: ch02-b24
          speaker: narrator
          text: Now the miles seemed to slip past. The newcomer was lively and entertaining, and the prince could not help hoping this might truly be the friend he had searched for. Much sooner than he thought possible, they came to a roadside inn. The prince again said he was hungry and invited his companion inside. They entered, ordered dinner, and ate together.
        - id: ch02-b25
          speaker: narrator
          text: When they had finished eating, the prince reached into his pocket and took out the last apple. He cut it carefully into two unequal pieces, one plainly larger than the other, and held both toward the stranger. This time, the stranger chose the little piece. The prince's heart filled with joy. At last, he had found the true friend he had been looking for.
        - id: ch02-b26
          speaker: prince
          text: Good friend, from now on we will be brothers. Everything I have is yours, and everything you have is mine. We will reach the shrine together. If either of us dies along the road, the other will carry his body there.
          emotion: happy
        - id: ch02-b27
          speaker: narrator
          text: The young man agreed to every word, and the two rode forward side by side.

    - id: ch03
      title: The City by the Castle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Their journey to the shrine took a whole year and led them through many lands. One day, tired and half-starved, they reached a great city. They agreed to rest there before traveling farther. So they rented a small house beside the royal castle and made it their home for a while.
        - id: ch03-b02
          speaker: narrator
          text: The next morning, the king of that country stepped onto his balcony and saw the young men in their garden. He thought they were both remarkably handsome, though the prince was the handsomer of the two. The king decided that this young man should marry his daughter.
        - id: ch03-b03
          speaker: narrator
          text: To begin his plan, the king invited them both to dinner. He welcomed them warmly at the castle and sent for his daughter. She was lovelier than the sun and moon together. But at bedtime, the king secretly had the friend served a poisoned drink. It killed him within minutes. The king believed that once the friend was gone, the prince would forget his pilgrimage, stay in the city, and marry the princess.
        - id: ch03-b04
          speaker: narrator
          text: The next morning, the prince did not see his friend. He asked the servants where the young man had gone.
        - id: ch03-b05
          speaker: servant
          text: He died suddenly last night. He is to be buried at once.
        - id: ch03-b06
          speaker: narrator
          text: The prince sprang to his feet.
        - id: ch03-b07
          speaker: prince
          text: If my friend is dead, I cannot stay here. I will not remain in this house for another hour.
        - id: ch03-b08
          speaker: king
          text: Give up your journey and stay with us. You may have my daughter as your wife.
        - id: ch03-b09
          speaker: prince
          text: No, I cannot stay. But please grant me one request. Give me a good horse and let me leave in peace. When I have fulfilled my vow, I will return and marry your daughter.
        - id: ch03-b10
          speaker: narrator
          text: The king saw that nothing he said would change the prince's mind. He ordered a good horse to be brought around. The prince mounted it, then lifted his dead friend and placed him across the saddle in front of him. With his friend's body held before him, he rode away from the city.
        - id: ch03-b11
          speaker: narrator
          text: Yet the young man was not truly dead. The drink had only put him into a deep sleep.

    - id: ch04
      title: At the Shrine of St. James
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The prince kept going until he reached the shrine of St. James. There he climbed down from his horse and lifted his friend from the saddle. He took the young man in his arms as though he were carrying a child. Then he went into the shrine and laid him before the altar.
        - id: ch04-b02
          speaker: prince
          text: St. James, I have kept the vow my parents made for me. I have come to your shrine, and I have brought my friend. I place him in your hands. Please restore him to life. Though he is dead, he too has fulfilled his vow.
        - id: ch04-b03
          speaker: narrator
          text: And while the prince was still praying, his friend rose and stood before him, as well as he had ever been. The two young men gave thanks and turned their faces toward home.
        - id: ch04-b04
          speaker: narrator
          text: When they reached the king's city, they went back to their little house across from the castle. Word of their return spread quickly. The king was overjoyed that the handsome prince had come back. He ordered great feasts to be prepared, because in a few days the prince would marry his daughter.
        - id: ch04-b05
          speaker: narrator
          text: The prince could imagine no greater happiness. After the wedding, he and his bride spent several cheerful months at court, with his friend beside them.
        - id: ch04-b06
          speaker: prince
          text: My mother is waiting for me at home, anxious and afraid. I cannot stay here any longer. Tomorrow, my wife, my friend, and I will begin the journey home.
        - id: ch04-b07
          speaker: narrator
          text: The king agreed and gave orders for their departure.

    - id: ch05
      title: The Friend Left Behind
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: In his heart, however, the king still hated the friend he had tried to kill. The young man had returned alive, and the king wanted to hurt him. So he sent him with a message to a distant place.
        - id: ch05-b02
          speaker: king
          text: Be quick. Your friend will wait for you before he leaves.
        - id: ch05-b03
          speaker: narrator
          text: The friend said farewell to the prince and spurred away, hoping to deliver the message as soon as possible. The moment he was gone, the king went to the prince's room.
        - id: ch05-b04
          speaker: king
          text: If you don't leave at once, you will never reach the place where you must camp tonight.
        - id: ch05-b05
          speaker: prince
          text: I cannot go without my friend.
        - id: ch05-b06
          speaker: king
          text: He will be back within an hour. I will give him my finest horse, and he will easily catch up with you.
        - id: ch05-b07
          speaker: narrator
          text: The prince let himself be persuaded. He said goodbye to his father-in-law and set out with his wife.
        - id: ch05-b08
          speaker: narrator
          text: Meanwhile, his friend could not finish the king's errand within the short time he had been given. When he finally returned, the king spoke as though nothing were wrong.
        - id: ch05-b09
          speaker: king
          text: Your companion is far ahead by now. You had better try to overtake him.
        - id: ch05-b10
          speaker: narrator
          text: The young man bowed and left the king. No horse was waiting for him. He had to follow his friend on foot.
        - id: ch05-b11
          speaker: narrator
          text: He ran through the day and through the night, trying to close the distance on foot. At last, he reached the place where the prince had pitched his tent. He was a miserable sight, worn out by the road and covered from head to foot in mud and dust. He could go no farther and collapsed before his friend. The prince welcomed him with joy. He helped him and cared for him as tenderly as he would have cared for his own brother.

    - id: ch06
      title: The Price of a Cure
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At last, the travelers reached the prince's home. The queen was at the palace, waiting and watching for her son. She had never stopped watching from the day he rode away. Now she saw him returning with his wife and his friend. Her joy was so great that she nearly died from it.
        - id: ch06-b02
          speaker: narrator
          text: Then she remembered his sick friend. She had a bed prepared and summoned the finest doctors in the country. They came from every direction, but not one of them could cure the young man.
        - id: ch06-b03
          speaker: narrator
          text: After every doctor had tried and failed, a servant entered and told the queen that a strange old man had knocked at the palace gate. He claimed he could heal the dying youth. This visitor was a holy man who had heard of the prince's trouble and had come to help.
        - id: ch06-b04
          speaker: narrator
          text: At that very time, a little daughter had been born to the prince. He loved the baby dearly, but his fear for his friend left him hardly a thought for her. No one could persuade him to leave the sickbed. He was leaning over his friend when the holy man came into the room.
        - id: ch06-b05
          speaker: holy_man
          text: Do you want your friend to recover? What price would you pay to save him?
        - id: ch06-b06
          speaker: prince
          text: What price? Just tell me what I must do to make him well.
        - id: ch06-b07
          speaker: holy_man
          text: Then listen. This evening, you must take your child and open her veins. Smear your friend's wounds with her blood, and he will become well at once.
        - id: ch06-b08
          speaker: narrator
          text: The prince shrieked in horror, because he loved his little daughter. Still, he gave the holy man his answer.
        - id: ch06-b09
          speaker: prince
          text: I swore to treat my friend as my own brother. If there is truly no other way, then my child must be sacrificed.
          emotion: sad
        - id: ch06-b10
          speaker: narrator
          text: Evening had already fallen. The prince took his child and opened her veins. He spread her blood over the sick man's wounds. At once, the look of death left his friend. The young man grew strong and rosy again.
        - id: ch06-b11
          speaker: narrator
          text: But the little child lay pale and still, as if she were dead. They placed her in the cradle and wept bitterly. They believed that by morning, they would lose her.

    - id: ch07
      title: A True Friend
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: At sunrise, the old man returned and asked about the sick youth.
        - id: ch07-b02
          speaker: prince
          text: He is as well as ever.
        - id: ch07-b03
          speaker: holy_man
          text: And where is your baby?
        - id: ch07-b04
          speaker: prince
          text: She is in that cradle. I think she is dead.
          emotion: sad
        - id: ch07-b05
          speaker: holy_man
          text: Look at her once more.
        - id: ch07-b06
          speaker: narrator
          text: They went to the cradle. There lay the baby, smiling up at them.
        - id: ch07-b07
          speaker: holy_man
          text: I am St. James of Lizia. I came to help you because I have seen that you are a true friend. From now on, may all of you live happily together. If trouble ever comes near, send for me, and I will help you through it.
        - id: ch07-b08
          speaker: narrator
          text: St. James raised his hand in blessing, and then he vanished.
        - id: ch07-b09
          speaker: narrator
          text: They followed his words. They lived happily and contentedly together, and they tried to bring the same happiness and contentment to all the people of the land.
