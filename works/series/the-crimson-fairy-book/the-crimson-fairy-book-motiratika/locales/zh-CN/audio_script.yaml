audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    husband:
      display_name: 丈夫
      tts:
        delivery: 勤恳直率，受委屈时带一点赌气
        timbre: 朴实温厚
        pace: 中速
        pitch: 中低音
    wife:
      display_name: 妻子
      tts:
        delivery: 任性而机敏，害怕时声音发颤
        timbre: 清晰柔和
        pace: 中速
        pitch: 中高音
    motikatika:
      display_name: 莫蒂卡蒂卡
      tts:
        delivery: 年幼却沉着聪明，说话简短坚定
        timbre: 清亮稚嫩
        pace: 明快
        pitch: 高音
    ogre:
      display_name: 食人妖
      tts:
        delivery: 粗暴贪婪，困惑时显得笨拙
        timbre: 粗哑厚重
        pace: 偏慢
        pitch: 低音
    magic_bones:
      display_name: 魔法骨头
      tts:
        delivery: 神秘冷静，回答简洁果断
        timbre: 空灵清脆
        pace: 从容
        pitch: 中高音
    baby_1:
      display_name: 村里的孩子甲
      tts:
        delivery: 天真响亮，回答干脆
        timbre: 稚嫩清亮
        pace: 明快
        pitch: 高音
    baby_2:
      display_name: 村里的孩子乙
      tts:
        delivery: 活泼大胆，声音有朝气
        timbre: 稚嫩明亮
        pace: 明快
        pitch: 高音
    baby_3:
      display_name: 村里的孩子丙
      tts:
        delivery: 天真爽快，说话响亮
        timbre: 清脆稚嫩
        pace: 明快
        pitch: 高音
    baby_4:
      display_name: 村里的孩子丁
      tts:
        delivery: 活泼坚定，合声时清楚有力
        timbre: 明亮稚嫩
        pace: 明快
        pitch: 高音
  chapters:
    - id: ch01
      title: 四次蜂蜜与四次取水
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，在一个酷热的国度里，有对夫妻住在小茅屋中。屋子四周青草茂盛，鲜花盛开。他们本来过得很幸福，后来妻子病倒了，什么也不肯吃。丈夫从森林里找来各种鲜美的果子，怎么劝，她都不肯尝。眼看妻子越来越瘦，丈夫怕她会死，急得没有办法。
        - id: ch01-b02
          speaker: husband
          text: 难道真没有一样东西是你想吃的吗？
        - id: ch01-b03
          speaker: wife
          text: 有。我想吃一点野蜂蜜。
        - id: ch01-b04
          speaker: narrator
          text: 丈夫高兴极了，以为蜂蜜很容易找到，马上动身去寻。他回来时，端着满满一木盆蜂蜜。
        - id: ch01-b05
          speaker: wife
          text: 这个我吃不下。你看，里面还有死蜜蜂！我要干干净净的蜂蜜。
          emotion: disgusted
        - id: ch01-b06
          speaker: narrator
          text: 妻子厌恶地转开脸。男人只好把蜂蜜倒在草地上，再去寻找。第二盆蜂蜜里有蚂蚁，妻子叫他扔掉。男人又找来一盆，她却说里面全是泥土。一直跑到第四趟，男人才终于找到她肯吃的蜂蜜。吃完蜂蜜，妻子又央求他去取水。
        - id: ch01-b07
          speaker: narrator
          text: 丈夫找了很久，才来到一座湖边。湖水甜得像放了糖。他装满一小铁杯，带回家来。妻子急忙喝下去，说自己的病已经全好了。她起身穿好衣服，丈夫却躺到了她刚才睡的地方。
        - id: ch01-b08
          speaker: husband
          text: 你让我费了这么多事，现在轮到我了！
        - id: ch01-b09
          speaker: wife
          text: 你怎么了？
        - id: ch01-b10
          speaker: husband
          text: 我口渴，想喝水。
        - id: ch01-b11
          speaker: narrator
          text: 妻子拿起一只大陶罐，走了很远，来到离家最近的泉边。她打满水，把沉重的陶罐顶回家，再从头上卸下来。
        - id: ch01-b12
          speaker: wife
          text: 水取来了。
        - id: ch01-b13
          speaker: narrator
          text: 丈夫厌恶地别过脸。
        - id: ch01-b14
          speaker: husband
          text: 这是从长着柳树、满是青蛙的水潭里打的。你得重新去取。
          emotion: disgusted
        - id: ch01-b15
          speaker: narrator
          text: 妻子再次上路，走到更远的一座湖。可丈夫喝了一口，还是不满意。
        - id: ch01-b16
          speaker: husband
          text: 这水有股灯心草味。去换些新鲜的来。
        - id: ch01-b17
          speaker: narrator
          text: 妻子第三次带水回来，丈夫又说这水简直是睡莲做的。他一定要纯净的水，不能让柳树、青蛙或灯心草坏了味道。妻子只得第四次把水罐顶到头上，越过先前去过的所有湖，继续向前走。
        - id: ch01-b18
          speaker: narrator
          text: 她终于来到另一座湖边。那里的水像蜂蜜一样金黄。她刚俯下身想尝一口，水面上突然冒出一颗可怕的脑袋。女人吓得浑身发抖。
        - id: ch01-b19
          speaker: ogre
          text: 你好大的胆子，竟敢偷我的水！
          emotion: angry
        - id: ch01-b20
          speaker: wife
          text: 是我丈夫叫我来的。求你别杀我！只要放我走，我就把自己的孩子给你。
          emotion: fearful
        - id: ch01-b21
          speaker: ogre
          text: 我怎么知道哪个孩子是你的？
        - id: ch01-b22
          speaker: wife
          text: 这很好办。我会剃掉他脑袋两边的头发，再给他戴上一串白珠子。你到了茅屋，只管喊“莫蒂卡蒂卡”。他会跑来迎你，你就可以吃掉他。
        - id: ch01-b23
          speaker: ogre
          text: 很好，你回去吧。
        - id: ch01-b24
          speaker: narrator
          text: 妻子把水罐装得满满的，这才回到家里，把刚才遇到的可怕危险全告诉了丈夫。

    - id: ch02
      title: 一村子的莫蒂卡蒂卡
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 母亲不知道，她的孩子其实是个魔法师。她答应食人妖的每一句话，孩子都听见了。他躲在一旁暗暗发笑，开始盘算怎样智胜母亲，让她的诡计落空。
        - id: ch02-b02
          speaker: narrator
          text: 第二天早晨，母亲剃掉孩子脑袋两边的头发，又在他脖子上挂好白珠子。
        - id: ch02-b03
          speaker: wife
          text: 我要去田里干活。你留在家里，千万别出门，不然野兽会吃掉你。
        - id: ch02-b04
          speaker: motikatika
          text: 好，我不出去。
        - id: ch02-b05
          speaker: narrator
          text: 母亲一走远，孩子就取出几块魔法骨头，在面前排成一行。他先给每块骨头分派角色。
        - id: ch02-b06
          speaker: motikatika
          text: 你是我父亲，你是我母亲。最大的一块来当想吃我的食人妖。最小的这块就是我。现在告诉我，我该怎么办？
        - id: ch02-b07
          speaker: magic_bones
          text: 把村里和你一样大的孩子全叫来。剃掉他们脑袋两边的头发，每个人都戴上白珠子。告诉他们，只要有人喊“莫蒂卡蒂卡”，大家都要回答。快去，你没有多少时间了。
        - id: ch02-b08
          speaker: narrator
          text: 莫蒂卡蒂卡立刻跑出门，带回来一大群和他一样大的孩子。他替每个孩子剃掉脑袋两边的头发，又在一条条黑黝黝的小脖子上挂起白珠子。刚刚做完这些事，大地便震动起来。巨大的食人妖迈着大步来了，一路喊着莫蒂卡蒂卡的名字。
        - id: ch02-b09
          speaker: ogre
          text: 莫蒂卡蒂卡！莫蒂卡蒂卡！
        - id: ch02-b10
          speakers: [baby_1, baby_2, baby_3, baby_4]
          ensemble: chorus
          text: 我们在这里！我们在这里！
        - id: ch02-b11
          speaker: narrator
          text: 孩子们一边回答，一边全朝食人妖跑去。
        - id: ch02-b12
          speaker: ogre
          text: 我要找的是莫蒂卡蒂卡。
        - id: ch02-b13
          speakers: [baby_1, baby_2, baby_3, baby_4]
          ensemble: chorus
          text: 我们全都是莫蒂卡蒂卡。
        - id: ch02-b14
          speaker: narrator
          text: 食人妖糊涂了，只好坐下来。这些孩子的父母没有得罪过他，他不敢随便吃掉他们，不然就会遭到严厉的惩罚。孩子们疑惑地等了一会儿，后来便各自散去。食人妖却一直坐在那里，等到傍晚，女人才从田里回来。
        - id: ch02-b15
          speaker: ogre
          text: 我没有见到莫蒂卡蒂卡。
        - id: ch02-b16
          speaker: wife
          text: 我不是叫你喊他的名字吗？你为什么没有喊？
        - id: ch02-b17
          speaker: ogre
          text: 我喊了。可村里的孩子好像个个都叫莫蒂卡蒂卡。你想不到有多少孩子朝我跑过来。
        - id: ch02-b18
          speaker: narrator
          text: 女人怎么也想不明白。她怕食人妖发脾气，便进屋煮了一碗玉米糊，端给他吃。
        - id: ch02-b19
          speaker: ogre
          text: 我不要玉米糊，我要那个孩子。我非吃到他不可！
          emotion: angry
        - id: ch02-b20
          speaker: wife
          text: 你耐心等一等。我这就叫他出来，让你马上吃掉他。
        - id: ch02-b21
          speaker: narrator
          text: 女人走进茅屋，喊起孩子的名字。
        - id: ch02-b22
          speaker: wife
          text: 莫蒂卡蒂卡！
        - id: ch02-b23
          speaker: motikatika
          text: 妈妈，我来了。
        - id: ch02-b24
          speaker: narrator
          text: 可他没有直接露面。他先拿出骨头，蹲在茅屋后面，问怎样才能躲过食人妖。
        - id: ch02-b25
          speaker: magic_bones
          text: 把自己变成一只老鼠。
        - id: ch02-b26
          speaker: narrator
          text: 莫蒂卡蒂卡立刻变成老鼠，藏了起来。食人妖等得不耐烦，只好让女人再想一个办法。

    - id: ch03
      title: 田里的小鸟
      blocks:
        - id: ch03-b01
          speaker: wife
          text: 明天我叫他到田里替我摘豆子。你去那里找他，就能把他吃掉。
        - id: ch03-b02
          speaker: ogre
          text: 很好。这一回我一定会抓到他。
        - id: ch03-b03
          speaker: narrator
          text: 食人妖说完，回湖里去了。第二天早晨，母亲交给莫蒂卡蒂卡一只篮子，叫他去摘些豆子回来当晚饭。去田里的路上，莫蒂卡蒂卡又取出魔法骨头，询问逃脱的办法。
        - id: ch03-b04
          speaker: magic_bones
          text: 变成一只鸟，再把豆子啄下来。
        - id: ch03-b05
          speaker: narrator
          text: 莫蒂卡蒂卡照它们说的变成了鸟。食人妖来到田里，只看见一只鸟在啄豆子。他不知道那就是莫蒂卡蒂卡，反而把鸟赶走了。
        - id: ch03-b06
          speaker: narrator
          text: 食人妖气冲冲地回到茅屋，责怪女人又骗了他，还说自己再也不肯受她敷衍。
        - id: ch03-b07
          speaker: wife
          text: 今晚再来。孩子会盖着这条白床罩，躺在床上。你把他带走，马上就能吃掉他。
        - id: ch03-b08
          speaker: narrator
          text: 可这番话又被男孩听见了。他找到魔法骨头，问它们该怎么办。
        - id: ch03-b09
          speaker: magic_bones
          text: 拿走你父亲床上的红床罩，把你自己的白床罩铺到他的床上。
        - id: ch03-b10
          speaker: narrator
          text: 莫蒂卡蒂卡照着做了，把自己的白床罩铺到父亲床上。夜里，食人妖来到茅屋，看见白床罩下躺着一个人。他以为终于抓到了莫蒂卡蒂卡，一把将那人带到屋外吃掉了。可那不是莫蒂卡蒂卡，而是他的父亲。

    - id: ch04
      title: 食人妖吃错了人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 妻子发现食人妖吃错了人，伤心得放声大哭。莫蒂卡蒂卡却不这样想。
        - id: ch04-b02
          speaker: motikatika
          text: 被吃掉的本来就该是他，不该是我。因为叫你去取水的是他，不是我。
