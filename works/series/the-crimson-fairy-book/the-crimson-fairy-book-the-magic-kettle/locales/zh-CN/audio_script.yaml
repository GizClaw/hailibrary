audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    old_man:
      display_name: 老人
      tts:
        delivery: 朴实爱惜家物，遇到怪事时慌张却不失善意
        timbre: 苍老温厚
        pace: 中速偏慢
        pitch: 中低音
    jimmu:
      display_name: 神武
      tts:
        delivery: 精明爽快而诚恳，表演时声音响亮有号召力
        timbre: 清朗成熟
        pace: 中速
        pitch: 中音
    friend:
      display_name: 朋友
      tts:
        delivery: 沉着老练，给人指点时笃定而亲切
        timbre: 温和沉稳
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 墙角的旧茶壶
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 日本中央的群山深处，住着一位老人。他有一所小屋，屋里的草席洁白，纸墙也糊得漂亮，他怎么看都看不够。天一暖，纸墙便向两旁推开，树木和花草的香气也就飘了进来。
        - id: ch01-b02
          speaker: narrator
          text: 一天，老人正站在屋里望着对面的山，身后忽然响起一阵咕隆声。他回头一看，墙角不知何时多了一把锈迹斑斑的铁茶壶，像是许多年没见过光。他完全猜不出壶从哪里来，便拿起来翻来覆去地看。见壶身没有一点破损，他才掸去厚厚的灰尘，把它带进厨房。
        - id: ch01-b03
          speaker: old_man
          text: 今天运气真好。好茶壶可不便宜，手边多一把，急用时正好。我原来那把已经漏水，眼看就要坏了。
        - id: ch01-b04
          speaker: narrator
          text: 老人取下火上那把旧壶，把新壶装满水，放到了火上。
        - id: ch01-b05
          speaker: narrator
          text: 水才开始发热，壶就变了。壶柄慢慢成了脑袋，壶嘴拉长成了尾巴，壶身又伸出四只爪子。转眼间，火上不再是一把茶壶，而是一只狸猫！
        - id: ch01-b06
          speaker: narrator
          text: 狸猫跳下火炉，像小猫似的四处乱蹿。它爬上墙壁，又从天花板上跑过。老人急得不得了，唯恐漂亮屋子被它糟蹋，赶忙大声喊邻居帮忙。两人费了好大力气才抓住狸猫，把它严严实实锁进木箱，随后精疲力尽地坐倒在草席上。
        - id: ch01-b07
          speaker: narrator
          text: 两人坐在那里商量了好一会儿，不知道该怎么处置这个惹祸的家伙。最后，他们决定把狸猫卖掉，便叫住一个路过的孩子，请他去找名叫神武的商贩。
        - id: ch01-b08
          speaker: narrator
          text: 神武赶来后，老人说有件东西要脱手，便打开木箱。可箱里哪还有狸猫，只有墙角那把旧茶壶。老人看得十分惊讶，不过一想起火上发生的怪事，无论如何也不肯再留它。两人为价钱你来我往地谈了一阵，神武最后提着茶壶走了。

    - id: ch02
      title: 神武的怪客
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 神武还没走多远，手里的茶壶就越来越沉。等他终于回到家，已经累得快要走不动了。他如释重负地把壶放进屋角，喘了口气，随后便忘了它。
        - id: ch02-b02
          speaker: narrator
          text: 半夜里，屋角一声巨响，把神武惊醒了。他撑起身子望过去，只见茶壶安安静静地待在那里。他当自己做了梦，很快又睡着了。
        - id: ch02-b03
          speaker: narrator
          text: 可同样的响声又一次传来。神武跳下床，借着长明灯的光走近一看，茶壶已经成了狸猫，正在原地追着尾巴打转。它玩累了，又奔上露台，快活地连翻几个筋斗。
        - id: ch02-b04
          speaker: narrator
          text: 神武不知道该怎么处置它，折腾到快天亮才睡着。等他醒来，狸猫不见了，原处仍是昨晚那把旧茶壶。
        - id: ch02-b05
          speaker: narrator
          text: 神武收拾完屋子，马上到隔壁找朋友，把事情从头讲了一遍。他原以为朋友也会大吃一惊，对方却一直平静地听着。原来，这位朋友年轻时就听说过一把会显神通的茶壶。
        - id: ch02-b06
          speaker: friend
          text: 你带着它四处表演，一定能挣下大笔钱。不过，先要问狸猫愿不愿意，再行几道法术。不然它一看见那么多人，可能转身就跑。
        - id: ch02-b07
          speaker: narrator
          text: 神武谢过朋友，照他说的一一办好。狸猫答应了，他也搭起一座棚子，在外面挂出告示，请大家来看世上最奇妙的变身。

    - id: ch03
      title: 世上最奇妙的变身
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 人们一群群赶来，棚子里很快热闹起来。茶壶从一个人手上传到另一个人手上，谁都可以把它里里外外看个清楚，甚至把眼睛凑到壶口往里瞧。等大家检查够了，神武才收回茶壶，稳稳放到台上。
        - id: ch03-b02
          speaker: jimmu
          text: 现在，变成狸猫吧！
        - id: ch03-b03
          speaker: narrator
          text: 壶柄立刻化成脑袋，壶嘴成了尾巴，四只爪子也从两旁伸出来。
        - id: ch03-b04
          speaker: jimmu
          text: 给大家跳一支舞！
        - id: ch03-b05
          speaker: narrator
          text: 狸猫马上迈开舞步，从台子这边跳到那边。观众看得再也站不住，也一个接一个跟着舞起来。它姿态轻盈，先领着人们跳扇子舞，接着不停步地转入影子舞和雨伞舞。一支连着一支，仿佛永远也不会停下来。
        - id: ch03-b06
          speaker: narrator
          text: 若不是神武宣布表演已经够久，棚子该关门了，狸猫多半真会一直跳下去。

    - id: ch04
      title: 一百枚金币
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 此后每一天，棚子里都挤得几乎进不了门。朋友的话果然应验，神武成了富翁，可他心里并不快乐。
        - id: ch04-b02
          speaker: narrator
          text: 神武是个诚实人。他总觉得，自己挣来的钱，有一部分应该归给卖茶壶的老人。
        - id: ch04-b03
          speaker: narrator
          text: 一天早晨，他数出一百枚金币，全部装进茶壶，又把壶挎在手臂上，原路回去拜访卖壶的老人。他从夜里狸猫现身讲起，一直讲到棚子里每天挤满观众，把自己靠这把茶壶致富的经过全都告诉了老人。
        - id: ch04-b04
          speaker: jimmu
          text: 我没有权利继续留下它，所以把它送回来了。壶里还有一百枚金币，就当是我租用它付给您的钱。
        - id: ch04-b05
          speaker: narrator
          text: 老人收下茶壶，向神武道谢，还说世上很少有人能像他这样诚实。

    - id: ch05
      title: 茶壶带来的好运
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 从那以后，魔法茶壶给老人和神武都带来了好运。两人的日子事事顺遂，一直活到很老很老，才在所有人的敬重中离开人世。
        - id: ch05-b02
          speaker: narrator
          text: 这个故事改编自《日本童话》。
