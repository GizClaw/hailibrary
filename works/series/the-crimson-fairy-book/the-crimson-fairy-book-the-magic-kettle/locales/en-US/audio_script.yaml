  chapters:
    - id: ch01
      title: The Kettle in the Corner
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: High among the mountains in the middle of Japan, an old man lived in a little house. He never grew tired of admiring it. The straw mats were beautifully white, and the walls were covered with pretty paper. In warm weather, those walls slid back and let in the scent of the trees and flowers.
        - id: ch01-b02
          speaker: narrator
          text: One day, as he looked toward the mountain opposite his house, a rumbling sound came from the room behind him. He turned around. There in a corner sat a rusty iron kettle that seemed not to have seen daylight for years. The old man had no idea how it got there. He picked it up, examined it carefully, and found that it was still whole. So he dusted it off and carried it into the kitchen.
        - id: ch01-b03
          speaker: old_man
          text: What a lucky find! A good kettle costs money, and having a spare will be useful. Mine is wearing out already. Water has begun to leak through the bottom.
        - id: ch01-b04
          speaker: narrator
          text: Smiling to himself, he lifted his old kettle from the fire. He filled the newly found one with water and set it in the old kettle's place.
        - id: ch01-b05
          speaker: narrator
          text: As soon as the water began to warm, something extraordinary happened. The old man stood watching and wondered if he was dreaming. The handle slowly changed into a head. The spout stretched into a tail. Then four paws sprang from the kettle's body. Within minutes, the old man was no longer looking at a kettle. He was looking at a tanuki.
        - id: ch01-b06
          speaker: narrator
          text: The creature leaped off the fire and bounded around like a kitten. It raced up the walls and across the ceiling. The old man was in agony at the thought of his lovely room being ruined, and he shouted to a neighbor for help. Together, the two men caught the tanuki and shut it safely inside a wooden chest.
        - id: ch01-b07
          speaker: narrator
          text: Exhausted, they sat on the mats and discussed what to do with such a troublesome beast. At last, they decided to sell it. They stopped a child who was passing and asked the child to fetch a tradesman named Jimmu.
        - id: ch01-b08
          speaker: narrator
          text: When Jimmu arrived, the old man said he had something he wanted to be rid of. Then he raised the chest lid. To his astonishment, the tanuki had vanished. The only thing inside was the kettle from the corner.
        - id: ch01-b09
          speaker: narrator
          text: That was certainly strange. But the old man remembered what had happened over the fire, and he wanted no more of the kettle. After a little bargaining over the price, Jimmu carried it away.

    - id: ch02
      title: A Visitor in the Night
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Jimmu had not gone far when the kettle began to feel heavier. It grew heavier still with every step. By the time he reached home, he was so tired that he was grateful to set it down in a corner. Then he forgot all about it.
        - id: ch02-b02
          speaker: narrator
          text: In the middle of the night, a loud noise from that corner woke him. Jimmu sat up in bed and looked. He saw nothing but the kettle, and it seemed quiet enough. Thinking he must have dreamed the sound, he went back to sleep.
        - id: ch02-b03
          speaker: narrator
          text: The same commotion woke him a second time. This time Jimmu jumped up and hurried to the corner. A lamp was always burning in his room, and by its light he saw that the kettle had turned into a tanuki. The creature was racing in circles after its own tail.
        - id: ch02-b04
          speaker: narrator
          text: When the tanuki tired of that game, it ran out onto the balcony and turned one somersault after another, simply because it was so glad. Jimmu was deeply troubled. What was he supposed to do with this strange animal? He managed to get a little sleep only as morning drew near.
        - id: ch02-b05
          speaker: narrator
          text: When Jimmu opened his eyes again, the tanuki was gone. In its place stood the same old kettle he had left there the night before.

    - id: ch03
      title: The Friend's Advice
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: As soon as Jimmu had put his house in order, he went next door and told a friend everything that had happened. The friend listened quietly. He was not nearly as surprised as Jimmu had expected, because he remembered hearing about a wonder-working kettle when he was young.
        - id: ch03-b02
          speaker: jimmu_friend
          text: Take the kettle on your travels and put its wonders on show. You'll become a rich man. But first, you must ask the tanuki for permission. You must also perform the proper magic ceremonies, so the sight of all those people won't make him run away.
        - id: ch03-b03
          speaker: narrator
          text: Jimmu thanked his friend and followed every word of that advice. He gained the tanuki's consent and performed the ceremonies. Then he built a booth. Outside it, he hung a notice inviting everyone to witness the most marvelous transformation ever seen.

    - id: ch04
      title: The Marvelous Performance
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: People came in crowds. Before the show began, the kettle passed from one pair of hands to another. Everyone was free to examine the outside and even peer inside. At last, Jimmu took it back and placed it on the platform.
        - id: ch04-b02
          speaker: jimmu
          text: Now change yourself into a tanuki.
        - id: ch04-b03
          speaker: narrator
          text: At once, the handle became a head and the spout became a tail. Four paws appeared along the sides.
        - id: ch04-b04
          speaker: jimmu
          text: Dance for us!
        - id: ch04-b05
          speaker: narrator
          text: The tanuki began his steps. He moved first to one side, then to the other, until the people watching could no longer keep still. Soon they were dancing too. The tanuki led them gracefully through the fan dance. Without pausing, he slipped into the shadow dance, and then the umbrella dance.
        - id: ch04-b06
          speaker: narrator
          text: It seemed that he might dance forever. Perhaps he would have, if Jimmu had not declared that the performance was over and the booth must close.
        - id: ch04-b07
          speaker: narrator
          text: Day after day, so many people packed into the booth that entering it was almost impossible. The neighbor's prediction came true. Jimmu became a rich man.

    - id: ch05
      title: A Hundred Gold Pieces
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Yet Jimmu was not happy. He was an honest man, and he believed that some of his wealth belonged to the man who had sold him the kettle. One morning, he placed a hundred gold pieces inside it. Then he hung the kettle over his arm and returned to the old man.
        - id: ch05-b02
          speaker: narrator
          text: Jimmu told the whole story of the tanuki's performances and the fortune they had brought him. When he reached the end, he gave the kettle back.
        - id: ch05-b03
          speaker: jimmu
          text: I have no right to keep this any longer. I've brought it home to you, and inside are a hundred gold pieces to pay for the time I had it.
        - id: ch05-b04
          speaker: narrator
          text: The old man thanked Jimmu. He told him that very few people would have acted with such honesty.
        - id: ch05-b05
          speaker: narrator
          text: The kettle brought good luck to both men. Everything went well for them for the rest of their lives. They lived to be very old, and when they died, everyone respected their memory.
