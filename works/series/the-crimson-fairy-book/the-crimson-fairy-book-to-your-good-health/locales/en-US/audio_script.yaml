audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and storylike
        timbre: clear and mellow
        pace: measured
        pitch: medium
    king:
      display_name: The King
      tts:
        delivery: commanding and quick-tempered
        timbre: deep and forceful
        pace: deliberate
        pitch: low
    shepherd:
      display_name: The Shepherd
      tts:
        delivery: fearless and playfully stubborn
        timbre: youthful and clear
        pace: steady
        pitch: medium
    lord_chamberlain:
      display_name: Lord Chamberlain
      tts:
        delivery: formal and anxious
        timbre: smooth and dignified
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Shepherd Who Would Not Say It
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long, long ago, there lived a king so mighty that whenever he sneezed, everyone in the whole country had to cry, "To your good health!" Everyone obeyed except a shepherd with staring eyes. He would not say it.
        - id: ch01-b02
          speaker: narrator
          text: When the king heard, he flew into a rage and summoned the shepherd. The young man came and stood before the throne. The king looked grand and powerful, but the shepherd was not the least bit afraid.
        - id: ch01-b03
          speaker: king
          text: Say it now. Say, "To my good health!"
          emotion: angry
        - id: ch01-b04
          speaker: shepherd
          text: To my good health!
        - id: ch01-b05
          speaker: king
          text: Mine! I mean my health, you rascal!
          emotion: angry
        - id: ch01-b06
          speaker: shepherd
          text: Yes, mine, Your Majesty.
        - id: ch01-b07
          speaker: narrator
          text: The king roared that he meant his own health, his very own, and beat his breast in fury. The shepherd cheerfully agreed. Yes, of course he meant his own health. Then he gently tapped his own breast. The king was beside himself and had no idea what to do. At last, the Lord Chamberlain stepped in and whispered to the shepherd.
        - id: ch01-b08
          speaker: lord_chamberlain
          text: Say, "To your health, Your Majesty," this very moment. If you refuse, you will lose your life.
        - id: ch01-b09
          speaker: shepherd
          text: No. I will not say it until the princess becomes my wife.
        - id: ch01-b10
          speaker: narrator
          text: The princess sat on a little throne beside her father, as sweet and lovely as a small golden dove. She could not help laughing when she heard the shepherd. His staring eyes pleased her very much. In fact, she liked him better than any king's son she had ever seen.
        - id: ch01-b11
          speaker: narrator
          text: Her father was not so easily pleased. He ordered the guards to throw the shepherd into the white bear's pit.

    - id: ch02
      title: The Bear and the Boars
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The white bear had eaten nothing for two days. The instant the pit door closed, it rushed at the shepherd. Then it saw his staring eyes and became so frightened that it seemed ready to eat itself. It backed into a corner and watched him. Hungry as it was, it dared not touch him. It could only suck its own paws.
        - id: ch02-b02
          speaker: narrator
          text: The shepherd knew that if he looked away, he was a dead man. To stay awake, he made up songs and sang them all through the night.
        - id: ch02-b03
          speaker: narrator
          text: Morning came at last. The Lord Chamberlain went down to the pit expecting to find the shepherd's bones. Instead, the shepherd stood there alive and well. The chamberlain could hardly believe his eyes. He led the young man back to the throne, where the king burst into another furious passion.
        - id: ch02-b04
          speaker: king
          text: You have learned what it means to come close to death. Will you say, "To my good health," now?
          emotion: angry
        - id: ch02-b05
          speaker: shepherd
          text: I am not afraid of ten deaths. I will say it only when the princess is to be my wife.
        - id: ch02-b06
          speaker: king
          text: Then go to your death!
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: This time, the king had him thrown into the wild boars' den. The boars had gone unfed for a week, and they all charged in to tear the shepherd apart. But he pulled a little flute from his jacket sleeve and began to play a merry tune. At first, the boars shied away from him. Then they rose onto their hind legs and began to dance.
        - id: ch02-b08
          speaker: narrator
          text: They looked so funny that the shepherd longed to laugh, but he did not dare stop playing. The moment the music ended, they would fall on him. His staring eyes could not hold ten boars at once, so he played on. First they danced slowly, as though in a minuet. Little by little, the tune grew faster. They twisted and turned as quickly as they could, until at last they tumbled over one another in a breathless heap.
        - id: ch02-b09
          speaker: narrator
          text: Only then did the shepherd let himself laugh. He laughed so long and loudly that when the Lord Chamberlain arrived early the next morning, tears were still streaming down his cheeks.
        - id: ch02-b10
          speaker: narrator
          text: Once the king was dressed, the shepherd was brought before him again. The king was angrier than ever because the boars had failed to tear the man to pieces.
        - id: ch02-b11
          speaker: king
          text: Now you know what it feels like to be near ten deaths. Say, "To my good health!"
          emotion: angry
        - id: ch02-b12
          speaker: shepherd
          text: I do not fear a hundred deaths. I will say it only if the princess may be my wife.
        - id: ch02-b13
          speaker: king
          text: Then go to a hundred deaths!
          emotion: angry

    - id: ch03
      title: The Vault of Scythes
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The king ordered the guards to throw the shepherd into the deep vault of scythes. They dragged him away to a dark dungeon. In the middle of the floor yawned a deep well, with sharp scythes set all around it. Far below, a little light burned at the bottom. When anyone was thrown in, the watchers could tell that he had fallen all the way down because his body put out the light.
        - id: ch03-b02
          speaker: narrator
          text: The shepherd asked the guards to leave him alone for a while. He said he wanted to look into the pit and perhaps decide to wish the king good health after all. The guards agreed and went out.
        - id: ch03-b03
          speaker: narrator
          text: At once, the shepherd planted his long stick beside the well. He wrapped his cloak around it, set his hat on top, and tucked his knapsack inside so the cloak seemed to hold a body. Then he called the guards back and told them he had thought it over but still could not say what the king wanted.
        - id: ch03-b04
          speaker: narrator
          text: The guards came in and seized what looked like the waiting prisoner. They hurled the hat, cloak, knapsack, and stick down the well together. Then they peered over the edge and watched the bundle put out the light below. Certain that this was truly the end of the shepherd, they went away. All the while, he was hiding in a dark corner and laughing to himself.
        - id: ch03-b05
          speaker: narrator
          text: Very early the next morning, the Lord Chamberlain entered with a lamp. At the sight of the living shepherd, he nearly fell backward in surprise. He took him to the king, whose fury was greater than ever.
        - id: ch03-b06
          speaker: king
          text: So now you have been close to a hundred deaths. Will you say, "To your good health"?
          emotion: angry
        - id: ch03-b07
          speaker: shepherd
          text: Not until the princess is my wife.

    - id: ch04
      title: The King's Three Offers
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The king saw there was no way to get rid of this shepherd. Perhaps, he thought, the young man would settle for something less than a princess. He called for the royal coach and made the shepherd climb in and sit beside him. Then he ordered the coachman to drive out of the city and onward until they reached the silver wood.
        - id: ch04-b02
          speaker: king
          text: Look at this silver wood. I will give it to you if you say, "To your good health."
        - id: ch04-b03
          speaker: narrator
          text: The shepherd turned hot and cold, but he held firm.
        - id: ch04-b04
          speaker: shepherd
          text: I will not say it until the princess is my wife.
        - id: ch04-b05
          speaker: narrator
          text: Much annoyed, the king drove on to a splendid castle made entirely of gold.
        - id: ch04-b06
          speaker: king
          text: Do you see that golden castle? I will give you the castle and the silver wood. You need only say one thing to me. Say, "To your good health."
        - id: ch04-b07
          speaker: narrator
          text: The shepherd stared with his mouth open. The sight dazzled him, but his answer did not change.
        - id: ch04-b08
          speaker: shepherd
          text: No. I will not say it until I have the princess for my wife.
        - id: ch04-b09
          speaker: narrator
          text: Now the king was overcome with grief. Two magnificent treasures had failed to tempt the shepherd, but the king had one last prize to offer. He ordered the coachman onward to the diamond pond and tried once more.
        - id: ch04-b10
          speaker: king
          text: Look at this diamond pond. I will give you that as well. The silver wood, the golden castle, and the diamond pond will all be yours if you will only say, "To your good health!"
        - id: ch04-b11
          speaker: narrator
          text: The brilliant pond shone so fiercely that the shepherd had to squeeze his staring eyes shut. Still, he refused.
        - id: ch04-b12
          speaker: shepherd
          text: No, no. I will not say it until the princess is my wife.
        - id: ch04-b13
          speaker: narrator
          text: At last, the king understood that nothing else would do. He gave in.
        - id: ch04-b14
          speaker: king
          text: Very well. It makes no difference to me. I will give you my daughter as your wife. But then you truly must say, "To your good health."
        - id: ch04-b15
          speaker: shepherd
          text: Of course I will say it then. Why wouldn't I?

    - id: ch05
      title: To Your Very Good Health
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The king was more delighted than anyone could have imagined. He sent word throughout the country that there would be great celebrations because the princess was getting married. The news delighted everyone. The princess had turned away one royal suitor after another, and in the end she had fallen in love with the shepherd who had those remarkable staring eyes.
        - id: ch05-b02
          speaker: narrator
          text: No one had ever seen a wedding like it. Wherever you looked, people were eating, drinking, and dancing. No one was forgotten in the celebration. Even the sick were given a feast, and presents were carried to tiny babies who had only just been born.
        - id: ch05-b03
          speaker: narrator
          text: The greatest merrymaking of all filled the king's palace. The finest bands played, the finest food was cooked, and a great crowd sat down together at the tables. Everywhere in the hall there was laughter, music, and feasting.
        - id: ch05-b04
          speaker: narrator
          text: Then the groomsman followed the old custom. He carried in a great boar's head on a large dish and set it before the king to carve and share. Its savory smell was so strong that the king began to sneeze with all his might.
        - id: ch05-b05
          speaker: shepherd
          text: To your very good health!
        - id: ch05-b06
          speaker: narrator
          text: The shepherd cried it before anyone else. The king was so pleased that he no longer regretted giving him his daughter.
        - id: ch05-b07
          speaker: narrator
          text: In time, the old king died, and the shepherd took his place. He became a very good king. He never demanded that his people wish him well against their will. Even so, everyone wished him well, because they all loved him.
