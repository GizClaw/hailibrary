audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而带几分诙谐，像在讲一则古老的俄罗斯童话
        timbre: 温暖清亮
        pace: 舒缓，转折处有自然停顿
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 威严专横，发怒时声势逼人，服软时仍强撑体面
        timbre: 洪亮厚重
        pace: 中速，怒喝时稍快
        pitch: 中低音
    shepherd:
      display_name: 牧羊人
      tts:
        delivery: 机敏大胆，回答干脆，顽皮中透着坚定
        timbre: 清朗结实
        pace: 中速偏快
        pitch: 中音
    chamberlain:
      display_name: 宫廷大臣
      tts:
        delivery: 谨慎老练，对国王恭顺，对牧羊人急切劝告
        timbre: 圆润沉稳
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 不肯祝福的牧羊人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，有一位权势熏天的国王。他每打一个喷嚏，全国上上下下，无论是谁，都得立刻说：“祝您身体健康！”所有人一直照办，只有一个瞪着大眼睛的牧羊人偏不肯说。消息传进王宫，国王勃然大怒，立刻派人召他来。
        - id: ch01-b02
          speaker: narrator
          text: 牧羊人来到御座前。国王坐得威风凛凛，看起来权力大得不得了。可牧羊人站在那里，心里一点儿也不怕。
        - id: ch01-b03
          speaker: king
          text: 马上说：“祝我身体健康！”
          emotion: angry
        - id: ch01-b04
          speaker: shepherd
          text: 祝我身体健康！
        - id: ch01-b05
          speaker: narrator
          text: 国王气得大声纠正他。
        - id: ch01-b06
          speaker: king
          text: 是祝我！祝我！你这个无赖，这个流氓！
          emotion: angry
        - id: ch01-b07
          speaker: shepherd
          text: 祝我，祝我，陛下。
        - id: ch01-b08
          speaker: narrator
          text: 国王一边咆哮，一边使劲捶着自己的胸膛。
        - id: ch01-b09
          speaker: king
          text: 我说的是我！是我自己！
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 牧羊人也在自己胸口轻轻拍了两下。
        - id: ch01-b11
          speaker: shepherd
          text: 好吧，对呀。祝我，当然是祝我自己。
        - id: ch01-b12
          speaker: narrator
          text: 国王简直气疯了，却又不知该怎么办。宫廷大臣赶忙上前，凑到牧羊人耳边劝他。
        - id: ch01-b13
          speaker: chamberlain
          text: 快说吧，现在就说：“祝您身体健康，陛下。”再不说，你连命都保不住了。
        - id: ch01-b14
          speaker: shepherd
          text: 不。除非把公主嫁给我，否则我决不说。
        - id: ch01-b15
          speaker: narrator
          text: 公主就坐在父王身边的小御座上，娇美得像一只金色的小鸽子。听见这句话，她忍不住笑了。这个瞪着大眼睛的年轻牧羊人很讨她喜欢，比她见过的任何一位王子都更讨她喜欢。国王可没有女儿这么和气。他一声令下，叫卫兵把牧羊人扔进白熊坑。
    - id: ch02
      title: 白熊与野猪
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 卫兵把牧羊人推进熊坑。那头白熊两天没吃东西，已经饿坏了。门才关上，它就猛扑过来。可它一对上牧羊人的大眼睛，竟吓得恨不得把自己吞掉。白熊退到角落里，只敢远远盯着他。它宁可缩在那里挨饿，也始终不敢碰他一下，只能饿得直吮自己的熊掌。
        - id: ch02-b02
          speaker: narrator
          text: 牧羊人明白，只要把视线移开，自己就会没命。为了整夜不睡，他不停地编歌、不停地唱。就这样，天终于亮了。宫廷大臣原是来收拾骨头的，看到牧羊人还好端端活着，惊讶极了，只得把他带回国王面前。
        - id: ch02-b03
          speaker: king
          text: 这回你知道命悬一线是什么滋味了吧？现在肯说“祝我身体健康”了吗？
          emotion: angry
        - id: ch02-b04
          speaker: shepherd
          text: 死上十次我也不怕！除非让我娶公主，否则我决不说。
        - id: ch02-b05
          speaker: king
          text: 那你就去死吧！
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: 这一次，国王叫人把牧羊人扔进野猪圈。十头野猪已经饿了整整一星期，一见他进来，立刻冲上去要把他撕碎。牧羊人却从衣袖里取出一支小笛子，吹起了欢快的曲子。野猪先怯生生地往后退，接着全都用后腿站起来，兴高采烈地跳起舞。
        - id: ch02-b07
          speaker: narrator
          text: 那样子滑稽极了，牧羊人真想大笑，可他不敢停。笛声一断，野猪准会扑上来。他那双眼睛在这里也没用，毕竟一个人不可能同时瞪住十头野猪。他只好继续吹。野猪起初慢慢跳着，像在跳小步舞。曲子越吹越快，它们也越转越急，最后跟不上节拍，一头压一头摔成一堆，累得喘不过气来。
        - id: ch02-b08
          speaker: narrator
          text: 到了这时，牧羊人才放声大笑。他笑得又响又久。第二天清早，宫廷大臣又来找骨头，看见牧羊人脸上还淌着笑出来的泪水。国王才刚穿戴整齐，牧羊人便又被领到他面前。野猪没能把人撕碎，国王气得比上回更厉害。
        - id: ch02-b09
          speaker: king
          text: 你已经尝过十次死亡逼近的滋味了。现在就说：“祝我身体健康！”
          emotion: angry
        - id: ch02-b10
          speaker: shepherd
          text: 死上一百次我也不怕。除非让我娶公主，否则我决不说。
        - id: ch02-b11
          speaker: king
          text: 那你就去死上一百次吧！
          emotion: angry
    - id: ch03
      title: 镰刀井里的计策
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 国王命人把牧羊人扔进镰刀井。卫兵将他拖进阴暗的地牢。牢房正中有一口深井，四周全是锋利的镰刀，井底还亮着一盏小灯。有人被推下去，只要看那盏灯还亮不亮，就知道他落到底没有。
        - id: ch03-b02
          speaker: narrator
          text: 牧羊人请求卫兵留他独自待一会儿，让他看看这口井，再仔细想想，也许他终究肯向国王说出那句话。卫兵答应了。他马上把长手杖竖在井边，用斗篷裹住手杖，顶端扣上帽子，又把行囊塞在斗篷里面。远远望去，真像一个人站在那里。
        - id: ch03-b03
          speaker: narrator
          text: 一切布置妥当，牧羊人叫回卫兵，说自己想来想去，还是说不出国王要听的话。卫兵便把帽子、斗篷、行囊和手杖一起推下井。他们亲眼看着那些东西落到底，把小灯压灭，这才以为牧羊人真的完了，转身离开。其实他自始至终都躲在黑暗的角落里，偷偷笑个不停。
        - id: ch03-b04
          speaker: narrator
          text: 第二天一早，宫廷大臣提着灯走进来。一看牧羊人安然无恙，他惊得差点向后摔倒。大臣又把牧羊人领到国王面前。国王怒火冲天，还是对他喊了起来。
        - id: ch03-b05
          speaker: king
          text: 你已经从一百次死亡旁边走过了。现在肯说“祝您身体健康”了吗？
          emotion: angry
        - id: ch03-b06
          speaker: shepherd
          text: 除非公主做我的妻子，否则我不说。
    - id: ch04
      title: 三件耀眼的礼物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 国王终于看明白了，想除掉这个牧羊人根本没有希望。于是他换了办法，心想，也许少给一点东西，就能叫他开口。国王备好御用马车，让牧羊人与自己并肩坐着，一路来到银树林。
        - id: ch04-b02
          speaker: king
          text: 看见这片银树林了吗？只要你说“祝您身体健康”，我就把整片树林送给你。
        - id: ch04-b03
          speaker: narrator
          text: 牧羊人一阵发热，一阵发冷，可还是不肯改变心意。
        - id: ch04-b04
          speaker: shepherd
          text: 除非公主做我的妻子，否则我不说。
        - id: ch04-b05
          speaker: narrator
          text: 国王十分气恼，又让马车向前驶去。他们来到一座辉煌的城堡前，整座城堡全由黄金建成。
        - id: ch04-b06
          speaker: king
          text: 看见这座黄金城堡了吗？它也可以归你。银树林和黄金城堡全都给你，你只要对我说一句：“祝您身体健康。”
        - id: ch04-b07
          speaker: narrator
          text: 牧羊人看得张大嘴巴，又惊叹，又眼花，可回答依然没有变。
        - id: ch04-b08
          speaker: shepherd
          text: 不。除非娶到公主，否则我不说。
        - id: ch04-b09
          speaker: narrator
          text: 国王这回伤心得不得了，只好叫车夫继续赶往钻石池，再试最后一次。
        - id: ch04-b10
          speaker: king
          text: 看见这座钻石池了吗？它也给你。银树林、黄金城堡、钻石池，全都归你！只要你肯说：“祝您身体健康！”
        - id: ch04-b11
          speaker: narrator
          text: 池水闪得牧羊人睁不开眼，他只好紧紧闭上那双大眼睛，可嘴上还是不松口。
        - id: ch04-b12
          speaker: shepherd
          text: 不，不。除非公主做我的妻子，否则我不说。
        - id: ch04-b13
          speaker: narrator
          text: 国王终于承认，自己的办法全都没用，只能让步。
        - id: ch04-b14
          speaker: king
          text: 好吧，好吧，反正对我都一样。我把女儿嫁给你。不过等你们结了婚，你可得真心实意地对我说：“祝您身体健康。”
        - id: ch04-b15
          speaker: shepherd
          text: 我当然会说。到了那个时候，我有什么理由不说呢？
    - id: ch05
      title: 婚宴上的喷嚏
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 国王听见这句话，欢喜得叫人难以相信。他昭告全国，公主就要成婚，要举行盛大的庆典。全国人人都很高兴。公主拒绝过那么多王室求婚者，最后却爱上了这个瞪着大眼睛的牧羊人，这件事让大家尤其欢喜。
        - id: ch05-b02
          speaker: narrator
          text: 那场婚礼盛大得前所未见。人人都吃呀、喝呀、跳舞呀。连病人也享用了一顿丰盛的宴席，刚出生不久的小婴儿也收到了礼物。王宫里最为热闹，最好的乐队奏着乐曲，最好的厨子做出最好的食物。一大群人围坐在餐桌旁，到处都是欢声笑语。
        - id: ch05-b03
          speaker: narrator
          text: 按照当地的习俗，伴郎用一个大盘子端来硕大的野猪头，放到国王面前，请他切开分给宾客。那股香气实在太浓，国王忽然一个接一个地打起喷嚏来。
        - id: ch05-b04
          speaker: shepherd
          text: 祝您身体非常健康！
        - id: ch05-b05
          speaker: narrator
          text: 牧羊人抢在所有人前面喊出了这句话。国王高兴极了，再也不后悔把女儿嫁给他。后来，老国王去世，牧羊人继承了王位。他成了一位很好的国王，从不逼百姓违心地祝福自己。可人人都真心盼他安康，因为大家都爱戴他。
