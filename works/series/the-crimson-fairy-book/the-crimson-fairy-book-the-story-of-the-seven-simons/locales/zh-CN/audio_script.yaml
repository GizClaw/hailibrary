audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而带几分诙谐，像在讲一则古老的俄罗斯童话
        timbre: 温暖清亮
        pace: 舒缓，转折处有自然停顿
        pitch: 中音
    king_archidej:
      display_name: 阿尔奇杰伊国王
      tts:
        delivery: 自信威严，发怒时急躁，动情时坦率
        timbre: 洪亮厚实
        pace: 中速
        pitch: 中低音
    eldest_merchant:
      display_name: 老商人
      tts:
        delivery: 阅历丰富，恭敬而敢说实话
        timbre: 苍老沉稳
        pace: 舒缓
        pitch: 低音
    simon_1:
      display_name: 大西蒙
      tts:
        delivery: 朴实稳重，说话谦逊有分寸
        timbre: 结实温厚
        pace: 中速
        pitch: 中低音
    simon_2:
      display_name: 二西蒙
      tts:
        delivery: 认真敏锐，禀报时清楚利落
        timbre: 清朗
        pace: 中速
        pitch: 中音
    simon_3:
      display_name: 三西蒙
      tts:
        delivery: 自信爽快，谈起造船轻松自然
        timbre: 明亮结实
        pace: 中速偏快
        pitch: 中音
    simon_4:
      display_name: 四西蒙
      tts:
        delivery: 沉着少言，对自己的神力毫不夸耀
        timbre: 低沉有力
        pace: 中速偏慢
        pitch: 低音
    simon_5:
      display_name: 五西蒙
      tts:
        delivery: 干练自信，带着铁匠般的爽直
        timbre: 坚实明快
        pace: 中速
        pitch: 中音
    simon_6:
      display_name: 六西蒙
      tts:
        delivery: 谦和机敏，语气轻快而可靠
        timbre: 清亮灵活
        pace: 中速偏快
        pitch: 中音
    simon_7:
      display_name: 七西蒙
      tts:
        delivery: 聪明大胆，彬彬有礼中藏着机锋
        timbre: 清朗敏捷
        pace: 中速
        pitch: 中音
    court_fool:
      display_name: 宫廷小丑
      tts:
        delivery: 诙谐直率，说破难题时得意却不油滑
        timbre: 灵活明亮
        pace: 中速偏快
        pitch: 中高音
    watchman:
      display_name: 哨兵
      tts:
        delivery: 警觉严厉，像从高塔上远远喊话
        timbre: 响亮粗粝
        pace: 中速
        pitch: 中音
    princess_helena:
      display_name: 海伦娜公主
      tts:
        delivery: 聪慧端庄，好奇时轻盈，惊慌时仍清晰
        timbre: 清澈柔美
        pace: 中速
        pitch: 中高音
    king_busan:
      display_name: 布桑国王
      tts:
        delivery: 骄傲强硬，悲痛时激烈失控
        timbre: 厚重威严
        pace: 中速，盛怒时加快
        pitch: 低音
  chapters:
    - id: ch01
      title: 遥远的公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 在那遥远、遥远的地方，越过许多国家、海洋和河流，有一座富丽堂皇的城。城里住着阿尔奇杰伊国王。他善良、富有，又英俊，拥有四十乘四十座城。每座城里都有十座宫殿，宫门是银的，屋顶是金的，窗子则用水晶制成。他的大军人数众多，只要国王稍稍流露心愿，将士们便会立刻照办。御前还有十二位贤臣，长胡子一直垂到胸前，每个人的学问都抵得上一整所学院，而且只向国王说实话。
        - id: ch01-b02
          speaker: narrator
          text: 照理说，国王拥有这一切，本该心满意足。可他还是不快乐。他始终找不到称心的王后，眼前的一切便都没了滋味。一天，他坐在宫里眺望大海，看见一艘大船驶进港口，几名远道而来的商人上了岸。国王想，这些人走过远路，见过许多地方，也许知道哪位公主既聪明又美丽，正好与自己相配。于是，他下令把商人召进宫来。
        - id: ch01-b03
          speaker: king_archidej
          text: 你们游历四方，见过不少奇景。现在请如实告诉我：世上可有哪位皇帝、国王或亲王的女儿，像我一样聪明好看，配做我的妻子和我国的王后？
        - id: ch01-b04
          speaker: narrator
          text: 商人们听完谁也没有马上回答。他们彼此望了望，又低头认真思量了半天。最后，年纪最长、走过地方最多的那位商人才走上前，恭敬地开了口。
        - id: ch01-b05
          speaker: eldest_merchant
          text: 我听说，越过重重海洋，有一座布桑岛。岛上的国王权势显赫，他的女儿海伦娜公主美丽非凡，容貌一定不比陛下逊色。她又聪明绝顶，不论多有智慧的白胡子老人，也猜不出她出的谜语。
        - id: ch01-b06
          speaker: king_archidej
          text: 那座岛有多远？该怎么去？
        - id: ch01-b07
          speaker: eldest_merchant
          text: 那座岛一点也不近，走一趟要十年，而且我们并不知道该怎么去。就算知道道路，又能有什么用呢？那位公主并不适合嫁给您。
        - id: ch01-b08
          speaker: king_archidej
          text: 你好大的胆子！
          emotion: angry
        - id: ch01-b09
          speaker: eldest_merchant
          text: 请陛下恕罪，不过请您仔细想一想。使者去岛上要十年，回来又要十年，前后一共二十年。等他终于回来，公主岂不是早已老去，容貌也凋谢了吗？
        - id: ch01-b10
          speaker: narrator
          text: 国王认真想了很久，觉得这话确有道理。他谢过商人的实话，准许他们在国中做买卖而不必缴税，随后让他们退下。可商人走后，他仍陷在沉思里，既困惑又焦躁。为了散心，他召来猎人和养鹰人，骑马奔向郊外。猎人吹起号角，养鹰人把鹰架在腕上，一行人穿过原野，来到一道青翠的树篱前。篱笆后面铺开一望无际的玉米田，黄色穗子在微风里来回摆动，像一片泛着波纹的金色海洋。
        - id: ch01-b11
          speaker: king_archidej
          text: 说真的，翻地播种的人一定很能干。这片田种得真好。要是全国的田地都像这样精心料理，百姓的面包一定多得吃不完。快去问问，这片田是谁的。
        - id: ch01-b12
          speaker: narrator
          text: 随从们争先恐后地跑去打听，很快找到一座整洁可爱的农舍。屋前坐着七个农夫，正拿黑麦面包和清水当午饭。他们都穿着镶金边的红衬衫，脸孔和身量又生得几乎一模一样，叫人很难分清谁是谁。使者便问起那片金色田地的主人。
        - id: ch01-b13
          speakers: [simon_1, simon_2, simon_3, simon_4]
          ensemble: chorus
          text: 这片田是我们的。
        - id: ch01-b14
          speaker: narrator
          text: 使者又问他们是什么人。
        - id: ch01-b15
          speakers: [simon_1, simon_2, simon_3, simon_4]
          ensemble: chorus
          text: 我们是阿尔奇杰伊国王的农夫。
        - id: ch01-b16
          speaker: narrator
          text: 国王听到回报，立刻召见七兄弟。长兄深深鞠了一躬。
        - id: ch01-b17
          speaker: simon_1
          text: 阿尔奇杰伊国王，我们都是您的农夫，是同一个父亲和母亲所生，又都叫西蒙。父亲教我们忠于国王，勤恳种地，善待乡邻。他还分别传给我们一门不同的手艺，觉得日后总会派上用场。不过，他也叮嘱我们千万别冷落大地母亲。只要肯下力气，她一定会给我们丰厚的回报。
        - id: ch01-b18
          speaker: narrator
          text: 国王很喜欢这个诚实的农夫。他说，兄弟们把田种得这样好，才有了眼前金黄的收成。接着，他请七个人逐个说说，他们的父亲究竟给每个人传下了哪些不同寻常的本领。
    - id: ch02
      title: 七种本领
      blocks:
        - id: ch02-b01
          speaker: simon_1
          text: 陛下，我的手艺并不容易。只要给我人手和材料，我能造一根白色巨柱，让它高高穿过云层。
        - id: ch02-b02
          speaker: king_archidej
          text: 很好。二西蒙，你呢？
        - id: ch02-b03
          speaker: simon_2
          text: 等哥哥造好巨柱，我能爬到顶上，从云层之上看见太阳底下每个国家正在发生什么。
        - id: ch02-b04
          speaker: king_archidej
          text: 好。三西蒙会做什么？
        - id: ch02-b05
          speaker: simon_3
          text: 陛下有许多大船，都是学问渊博的人造的，船上装着各式各样新奇精巧的东西。我却只能造一条极简单的小船。一、二、三，船就成了！它模样朴素，似乎配不上国王，可别的船走一年才到的地方，它一天就到。别的船要走十年，它一星期便能走完。
        - id: ch02-b06
          speaker: king_archidej
          text: 好。四西蒙学了什么？
        - id: ch02-b07
          speaker: simon_4
          text: 陛下，我这本领实在不值一提。哥哥若替您造好船，就让我跟着登船。要是敌人从后面追赶，我能抓住船头，把整条船沉到海底。等敌人的船开远了，我再把它拉回海面。
        - id: ch02-b08
          speaker: king_archidej
          text: 这本领真不简单。五西蒙呢？
        - id: ch02-b09
          speaker: simon_5
          text: 陛下，我做的只是铁匠活儿。您吩咐人给我造一间铁匠铺，我就能替您打一张弩。天上的鹰也好，森林里的野兽也好，谁都逃不过它。眼睛看得见什么，弩箭便能射中什么。
        - id: ch02-b10
          speaker: king_archidej
          text: 很有用。六西蒙，也说说你的手艺。
        - id: ch02-b11
          speaker: simon_6
          text: 我的本事实在简单，几乎不好意思提。哥哥射中什么，我都能比猎狗更快地捉回来。猎物沉进再深的水里，我也能捞起。落进黑暗的森林，就算半夜我也找得到。
        - id: ch02-b12
          speaker: narrator
          text: 国王很喜欢六兄弟的本领，也喜欢他们说话的样子。他向这些好人道了谢，夸那位父亲教得好，又要兄弟们随自己进城，当面展示本领。国王说，自己身边正需要这样的人，不过等到田野收获时，仍会赐下王家的礼物，送他们回家。兄弟们鞠躬答道，一切听从国王旨意。国王这才忽然想起，自己一直没问七西蒙，便转过身去看着他。
        - id: ch02-b13
          speaker: king_archidej
          text: 七西蒙，你怎么一直不说话？你会什么手艺？
        - id: ch02-b14
          speaker: simon_7
          text: 陛下，我没学会正经手艺。真要说起来，我只会一种把戏。可我表演时谁也不能看，连国王也不行。而且，您多半不会喜欢。
        - id: ch02-b15
          speaker: king_archidej
          text: 别找借口。究竟是什么本事？
        - id: ch02-b16
          speaker: simon_7
          text: 请先以国王的名义保证，听完不会杀我。您答应，我才说。
        - id: ch02-b17
          speaker: king_archidej
          text: 就依你。我保证不杀你。
        - id: ch02-b18
          speaker: narrator
          text: 七西蒙退后一步，清了清嗓子。
        - id: ch02-b19
          speaker: simon_7
          text: 阿尔奇杰伊国王，我干的这一行，在您的国土上会叫人掉脑袋，根本别想得到赦免。我真正拿手的只有偷东西。无论偷来的东西多小，哪怕只是一丁点儿，我都能藏得严严实实。哪怕地窖深不见底，锁上又中了魔法，只要我想拿里面的东西，就一定拿得到。
        - id: ch02-b20
          speaker: king_archidej
          text: 我绝不饶你这个恶棍！把你关进最深的地牢，只给面包和水，直到你忘掉这种手艺。不，我简直该立刻处死你！
          emotion: angry
        - id: ch02-b21
          speaker: simon_7
          text: 国王陛下，别杀我。我其实并不像您想的那么坏。只要愿意，我早能偷空王家宝库，再拿钱贿赂法官，让他们放我无罪。剩下的钱还足够盖一座白色大理石宫殿。可我虽然会偷，却从来不偷。是您亲口问起我的手艺。您若杀了我，就违背了国王的诺言。
        - id: ch02-b22
          speaker: king_archidej
          text: 好，我不杀你，也赦免你的死罪。不过从现在起，你得被关进不见天日的地牢。卫兵，把他押进监狱！另外六个西蒙随我来，你们尽管放心，我一定会赐恩给你们。
        - id: ch02-b23
          speaker: narrator
          text: 六个西蒙跟国王走了。卫兵抓住七西蒙，给他戴上锁链，扔进监狱，每天只给面包和清水。第二天，国王拨给大西蒙木匠、泥瓦匠、铁匠和苦力，又送来大批铁料、灰浆和各种物资。大西蒙立刻开工，把白色巨柱越造越高。柱子穿过云层，一直抵达离地面最近的星星。当然，其余星星还在更高处。
    - id: ch03
      title: 神奇的巨柱、快船和魔弩
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 二西蒙爬上巨柱，看见也听见了全世界的一切。他下来以后，讲起各处的奇闻。有个国王正领兵攻打另一个国王，他连哪一方多半会获胜都看得出来。另一个地方正在盛大欢庆，第三处却有人死于饥荒。总之，大地上无论发生多么微小的事，也瞒不过他的耳目。
        - id: ch03-b02
          speaker: narrator
          text: 轮到三西蒙时，他伸开双臂，一下、两下、三下，神奇的船便造好了。国王一声令下，船被推入水中，像鸟儿一样骄傲又平稳地浮在浪尖。船上没有普通绳索，只有金属丝做成的帆索。乐师拿小提琴弓在丝线上拉奏，船上便响起美妙的音乐。快船正在海面游弋，四西蒙忽然用强有力的手抓住船头，转眼将它沉到海底。一个钟头后，他左手把船拉回水面，右手还从大海深处捉来一条巨鱼，要献给国王的餐桌。
        - id: ch03-b03
          speaker: narrator
          text: 与此同时，五西蒙搭好铁匠铺，叮叮当当地锻打铁料。国王从港口回来时，魔弩已经造好。他立刻来到空旷的田野，仰头望向天空。极远极远的地方，一只鹰正朝太阳飞去，小得只剩一个黑点。
        - id: ch03-b04
          speaker: king_archidej
          text: 你若能射下那只鹰，我就赏你。
        - id: ch03-b05
          speaker: narrator
          text: 五西蒙只微微一笑，举起弩，瞄准目标，一箭射出。鹰应声从高空坠落。还没等它掉到地上，六西蒙已经端着盘子飞奔过去，稳稳接住了它，又把盘子捧回国王面前。
        - id: ch03-b06
          speaker: king_archidej
          text: 多谢你们，我的勇士们。你们果然个个都是高手，我一定重重有赏。先去歇歇，吃顿饭吧。
        - id: ch03-b07
          speaker: narrator
          text: 六个西蒙鞠了一躬，便去吃饭。可他们才刚刚开动，就有使者赶来，说国王又要见他们。兄弟们立刻放下饭食，听命前往，只见国王身边围满朝臣和显贵。
        - id: ch03-b08
          speaker: king_archidej
          text: 我的贤臣们想起了一件事。二西蒙，你既然能站在巨柱顶上看遍全世界，就再上去看一看，也仔细听一听。远隔重重海洋，有个强盛的布桑岛国，那里的国王有位美丽的女儿，名叫海伦娜。我想知道她和那个国家的消息。
        - id: ch03-b09
          speaker: narrator
          text: 二西蒙飞快爬上巨柱，举目四望，侧耳听遍四方，随后滑下来禀报。
        - id: ch03-b10
          speaker: simon_2
          text: 陛下，我看见了布桑岛。那里的国王权势很大，却骄傲残酷。他宣称世上没有国王或亲王配得上女儿。谁敢求婚，他就向谁开战，毁掉对方的国家。
        - id: ch03-b11
          speaker: king_archidej
          text: 他的军队有多少？布桑岛又有多远？
        - id: ch03-b12
          speaker: simon_2
          text: 依我看，天气晴好时要航行将近十年，遇上风暴便要十二年。我看见他们正在检阅军队。兵力不算特别多，有十万披甲士兵、十万骑士，还有大约十万近卫和弩手。另外藏着一队精挑细选的英雄好汉，只有遇上格外需要勇气的大事，他们才会出动。
        - id: ch03-b13
          speaker: narrator
          text: 国王听完禀报，坐在那里陷入沉思。过了好一阵，他才转向围在身边的贵族、朝臣和谋士，告诉他们，自己已经下定决心迎娶海伦娜公主，可眼下还不知道究竟该怎么办。满殿聪明人谁也不肯开口，只顾悄悄往别人身后躲。三西蒙见他们沉默不语，只好自己站出来献策。
        - id: ch03-b14
          speaker: simon_3
          text: 陛下想去布桑岛吗？这有什么难的。乘我的船，不必走上十年，一个星期就能到。不过到了那里以后，该怎么办，还得请这些谋士拿主意。说到底，就是要和平赢得公主，还是发动战争？
        - id: ch03-b15
          speaker: narrator
          text: 智者们依旧沉默。国王皱起眉，刚要发火，宫廷小丑挤到了前面。
        - id: ch03-b16
          speaker: court_fool
          text: 哎呀，你们这些聪明人究竟在愁什么？这件事再明白不过了。既然去那座岛花不了多少时间，就派七西蒙去呀！他很快就能把美人偷回来。至于公主的父王，就让他慢慢考虑怎么把大军送到这里吧。光在路上就要走整整十年！你们说，这个主意怎么样？
        - id: ch03-b17
          speaker: king_archidej
          text: 妙极了！我一定赏你。卫兵，快把七西蒙带来！
    - id: ch04
      title: 前往布桑岛
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 没过多久，七西蒙便被带到殿上。他脸色苍白，看上去饿得厉害。国王把想要他做的事从头到尾说了一遍，还一本正经地告诉他，为国王和国家的利益偷东西，绝不能算错。只有为了自己谋利而偷，才是真正的坏事。七西蒙听完，只点了点头。
        - id: ch04-b02
          speaker: king_archidej
          text: 跟我说实话。你能把海伦娜公主偷来吗？
        - id: ch04-b03
          speaker: simon_7
          text: 为什么不能？这事容易。请把贵重衣料、锦缎、波斯地毯、珍珠和宝石装上快船，让我带着四个排行居中的哥哥出发，另外两位留下做人质。
        - id: ch04-b04
          speaker: narrator
          text: 国王听了这番话，心中的渴望烧得更旺，立刻下令，一切都照七西蒙说的办。众人奔来跑去，把贵重衣料、锦缎、波斯地毯、珍珠和宝石一件件搬上船。没过多久，快船便装得满满当当，做好了出发的准备。五个西蒙辞别国王，登船扬帆。船一离岸，转眼就快看不见了。它劈开海水前行，像猎鹰掠过天空。出发刚满一个星期，布桑岛便出现在前方。海岸戒备森严，高塔上的哨兵远远喝问。
        - id: ch04-b05
          speaker: watchman
          text: 停船下锚！你们是谁？从哪里来？要干什么？
        - id: ch04-b06
          speaker: simon_7
          text: 我们是安分守己的百姓，来自伟大仁慈的阿尔奇杰伊国王的国土。我们带来了外国货，有贵重的锦缎、地毯和名贵珠宝，想请你们的国王与公主过目。我们来这里做买卖，既卖，也买，也交换货物。
        - id: ch04-b07
          speaker: narrator
          text: 兄弟们从大船上放下一条小船，挑出几件珍贵货物带在身边。他们划到岸上，一路来到王宫。海伦娜公主正坐在玫瑰红色的屋子里。她远远看见陌生人走近，便叫来乳母和其他女眷，要她们问清这些人是谁，做什么营生，又有什么来意。乳母于是来到兄弟面前。
        - id: ch04-b08
          speaker: simon_7
          text: 我们来自贤明仁慈的阿尔奇杰伊国王的国土，带来各种货物出售。我们诚心盼望贵国国王肯纡尊接见，也准许仆从收下这些东西。只要他觉得我们的货物配得上装点身边的人，我们就心满意足了。
        - id: ch04-b09
          speaker: narrator
          text: 乳母把这番话原原本本告诉公主。公主立刻召兄弟们进红屋。他们恭敬行礼，铺开华美的天鹅绒与锦缎，又打开一匣匣珍珠宝石。岛上从没人见过这样的东西，乳母与侍女望着满眼华彩，全都惊呆了，还彼此低声说，这辈子从没见过这样的宝物。公主也看得惊奇不已。她的眼睛怎么都看不够，手指也舍不得离开柔软衣料，还把闪亮的珠宝一次次举到光下细看。
        - id: ch04-b10
          speaker: simon_7
          text: 最美丽的公主，请让侍女收下这些丝绸和天鹅绒，也让女眷们拿珠宝装点头巾吧。眼前这些并不是什么稀罕宝物。船上还有五颜六色的壁毯、耀眼宝石和一串串珍珠，跟那些相比，这里的东西根本不值一提。我们不知道您的喜好，所以没敢多带。您若肯赏光登船，就可以亲自挑选中意的东西。
        - id: ch04-b11
          speaker: narrator
          text: 这番话很得公主欢心。她立刻去见父王。
        - id: ch04-b12
          speaker: princess_helena
          text: 亲爱的父王，来了几位商人，带着世上最华美的货物。请准我到他们船上，挑几样喜欢的东西吧。
        - id: ch04-b13
          speaker: narrator
          text: 布桑国王左思右想，眉头皱得紧紧的，还不停揉耳朵。最后，他终于准许女儿出行，命人备好御用游艇，又派一百名弩手、一百名骑士和一千名士兵护送她。游艇载着公主和卫队驶到快船旁。西蒙兄弟先登上游艇迎接，再走在前面带路。公主身后跟着乳母和其他女眷，众人踏过两船之间的水晶跳板，来到神奇的船上。
        - id: ch04-b14
          speaker: narrator
          text: 七西蒙铺开一件件货物，还讲了许多和它们有关的新奇故事。公主看得入迷，听得忘神，把别的一切都抛在脑后。她完全没发现四西蒙已经抓住船头。忽然，整条船从海面上消失了。它潜入大海深处，飞也似的向前疾驰。
        - id: ch04-b15
          speaker: narrator
          text: 游艇上的水手放声叫喊，骑士吓得呆立不动，士兵也惊得说不出话，一个个垂下了头。谁都想不出挽救的办法，他们只能驾船回去，向国王禀报公主失踪的消息。布桑国王一听，顿时又哭又闹，大发雷霆。
        - id: ch04-b16
          speaker: king_busan
          text: 啊，我眼中的光明！我的骄傲终于招来了惩罚。我总以为世上没人配做你的丈夫，如今你却沉进大海深处，离开了我，只留下我孤零零一人！至于你们这些亲眼看着她消失的人，全都给我带走！给他们戴上镣铐，关进监狱。等我想出最合适的死法，再来处置你们！
          emotion: sad
    - id: ch05
      title: 公主的变化
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 布桑国王还在怒骂哀号，西蒙的船却像鱼儿一样游过海底。等岛屿完全看不见了，四西蒙才把船拉回海面。公主这时回过神来。
        - id: ch05-b02
          speaker: princess_helena
          text: 乳母，我们看这些宝物看得太久了。但愿父王不会怪我们回去得迟。
        - id: ch05-b03
          speaker: narrator
          text: 她勉强从奇珍异宝前移开目光，走上甲板。可海面上既没有御用游艇，也没有布桑岛。海伦娜绞着双手，又捶打胸口，忽然变成一只白天鹅，振翅飞走。五西蒙立刻举起弩，一箭射中天鹅。六西蒙没让它落进水里，伸手便在船上接住。天鹅马上变成一条银鱼，他不敢耽搁，又一把捉牢。银鱼眨眼间化作黑老鼠，在甲板上四处乱窜，直奔一个洞口。还没等它钻进去，六西蒙已经比猫更快地扑了上去。小老鼠这才重新变回美丽的海伦娜公主。
        - id: ch05-b04
          speaker: narrator
          text: 一天清晨，阿尔奇杰伊国王坐在窗边，若有所思地望着大海。他心里忧愁，不肯吃，也不肯喝，脑海中只有美得像梦一样的海伦娜公主。远处飞向海岸的，是白色海鸥，还是一面船帆？不，那不是海鸥。是神奇的船鼓着风帆，飞快驶来。旗帜迎风招展，乐师在金属帆索上奏起曲子。船抛下锚，水晶跳板从船边一直铺到码头。海伦娜走过跳板，浑身像太阳一样灿烂，眼里仿佛闪着满天星辰。
        - id: ch05-b05
          speaker: king_archidej
          text: 快，快去迎接她！吹响号角，敲响欢庆的钟声！
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: 整个宫廷顿时热闹起来，到处都是赶来迎候的朝臣和仆从。人们一路铺下金色地毯，又把宫殿的大门全都敞开。阿尔奇杰伊国王亲自迎出去，牵起海伦娜的手，把她带进王家的宫室。
        - id: ch05-b07
          speaker: king_archidej
          text: 尊贵的公主，您的美名早已传到这里，可我从不敢盼望，您本人竟会这样美丽。即便如此，我也不会违背您的心意，强留您在这里。您若想回家，神奇的船会送您回到父亲身边，送您回自己的国土。您若愿意留下，就请做我们的王后，统领我，也统领我的国家。
        - id: ch05-b08
          speaker: narrator
          text: 后面的事不难猜。公主听从了国王的求婚，两人的订婚典礼举行得无比隆重，整个国家都沉浸在欢腾里。随后，西蒙兄弟又奉命前往布桑岛。他们带着海伦娜写给父王的信，请他前来参加婚礼。神奇的快船抵达时，当初护送公主的骑士和士兵正被押出监狱，走向刑场。
        - id: ch05-b09
          speaker: simon_7
          text: 住手！住手！我带来了海伦娜公主的亲笔信！
        - id: ch05-b10
          speaker: narrator
          text: 布桑国王把女儿的信读了一遍又一遍，随即下令解开骑士与士兵的镣铐，把他们全都释放。他热情款待了阿尔奇杰伊国王的使者，也请他们把自己的祝福带给女儿，却无论如何都不肯亲自参加婚礼。等神奇的船回到家乡，阿尔奇杰伊与海伦娜听见它带来的好消息，无不欣喜若狂。
    - id: ch06
      title: 七兄弟的赏赐
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 婚礼将近时，国王特意派人召来七个西蒙，让兄弟七人一同站到自己面前。他没有忘记他们立下的功劳，决心好好赏赐这些勇敢又能干的好朋友。
        - id: ch06-b02
          speaker: king_archidej
          text: 我的勇士们，千万声感谢也道不尽我的心意！宝库里的金子、银子和宝石，你们想拿多少就拿多少。好朋友们，你们还有什么愿望，也只管告诉我，我一定满足。想成为贵族吗？还是想治理几座城？只管开口。
        - id: ch06-b03
          speaker: narrator
          text: 大西蒙深深鞠了一躬。
        - id: ch06-b04
          speaker: simon_1
          text: 陛下，我们都是平常百姓，最懂的也只是平常事。让我们去做贵族或城主，能像什么样子呢？金子我们也不想要。我们有自己的田地，田里的收成供得起一家人的饭食，手里的钱也正好够用。若您真想赏赐我们，就请免去我们土地上的赋税，再大发慈悲，饶恕七西蒙吧。他不是世上第一个以偷窃为业的人，也绝不会是最后一个。
        - id: ch06-b05
          speaker: king_archidej
          text: 就依你。你们的土地从此免除一切赋税，七西蒙也得到赦免。
        - id: ch06-b06
          speaker: narrator
          text: 国王说完，赐给每个兄弟一杯美酒，又邀请他们一同参加婚宴。至于那场婚宴究竟有多热闹，只消告诉你一句：那可真是一场了不得的盛宴！
