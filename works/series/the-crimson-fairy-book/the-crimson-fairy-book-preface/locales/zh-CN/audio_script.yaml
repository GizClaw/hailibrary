audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 清楚从容，像在为听众介绍一本童话集的篇目
        timbre: 温暖明亮
        pace: 舒缓，每个篇名之间留出自然停顿
        pitch: 中音
