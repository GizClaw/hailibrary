audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    marten:
      display_name: 貂
      tts:
        delivery: 狡黠自得，遇险时反应机敏
        timbre: 轻捷尖细
        pace: 明快
        pitch: 中高音
    squirrel:
      display_name: 松鼠
      tts:
        delivery: 客气机警，话语轻快
        timbre: 小巧明亮
        pace: 偏快
        pitch: 高音
    hare:
      display_name: 野兔
      tts:
        delivery: 活泼警觉，反应迅速
        timbre: 轻盈清脆
        pace: 偏快
        pitch: 中高音
    fox:
      display_name: 狐狸迈克尔
      tts:
        delivery: 圆滑聪明，善于哄骗，危急时镇定机变
        timbre: 温润而狡黠
        pace: 从容
        pitch: 中音
    wolf:
      display_name: 狼彼得
      tts:
        delivery: 急躁直率，饥饿时格外迫切
        timbre: 粗粝空沉
        pace: 中速
        pitch: 中低音
    bear:
      display_name: 熊
      tts:
        delivery: 沉重直率，悲伤时庄重，发怒时有压迫感
        timbre: 低沉洪亮
        pace: 舒缓
        pitch: 低音
    magpie:
      display_name: 喜鹊
      tts:
        delivery: 敏感善言，受惊时慌乱，醒悟后坚定
        timbre: 清尖颤动
        pace: 偏快
        pitch: 高音
    crow:
      display_name: 乌鸦
      tts:
        delivery: 精明直爽，讥讽时干脆，脱险时得意
        timbre: 干涩沙哑
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 六只野兽的晚餐
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，一对夫妻住在偏远的小屋里，方圆很远都没有邻居。他们倒不怕寂寞，本来可以过得很快活。偏偏有只貂每晚都摸进鸡舍，叼走一只鸡。
        - id: ch01-b02
          speaker: narrator
          text: 男人为了捉贼，摆下了各式各样的陷阱。可有一天，貂没捉到，他自己反倒中了招。他摔了一跤，脑袋撞上石头，就这样死了。
        - id: ch01-b03
          speaker: narrator
          text: 不久，貂又来找晚餐，一眼看见尸体躺在地上。他觉得自己这回走了大运。
        - id: ch01-b04
          speaker: marten
          text: 好大一件战利品！这回我可真有本事。
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: 他费了好大力气，才把尸体拖上等在旁边的雪橇，然后拉着战利品出发。雪橇沉得厉害，他一步一步走得很吃力。还没走出多远，他碰见一只松鼠。松鼠客客气气地鞠了一躬。
        - id: ch01-b06
          speaker: squirrel
          text: 教父，早安！您后面拉着什么呀？
        - id: ch01-b07
          speaker: narrator
          text: 貂笑了起来。
        - id: ch01-b08
          speaker: marten
          text: 这件事你准没听过。这个老头儿在鸡舍边设陷阱，想要捉我，谁知自己掉进去摔断了脖子。他太沉了，你帮我拉一把吧。
        - id: ch01-b09
          speaker: narrator
          text: 松鼠答应下来，雪橇缓缓往前挪。过了一会儿，一只野兔跑过田野。她瞧见这支古怪的队伍，停下了脚步。
        - id: ch01-b10
          speaker: hare
          text: 你们那儿拉着什么呢？
        - id: ch01-b11
          speaker: narrator
          text: 貂把陷阱和老头儿的事从头讲给她听，又请她帮忙。野兔答应了，使出全身力气拉。后来狐狸来了，狼也来了，最后又添上一头熊。熊一个出的力，比其余五只野兽加在一起还大。
        - id: ch01-b12
          speaker: narrator
          text: 六只野兽把那个男人当晚餐吃了。雪橇自然轻了许多。麻烦的是，他们很快又饿起来，狼尤其饿得厉害。
        - id: ch01-b13
          speaker: wolf
          text: 朋友们，人已经吃光了。我们接下来吃什么？
        - id: ch01-b14
          speaker: bear
          text: 那就只能吃我们中个头最小的。
        - id: ch01-b15
          speaker: narrator
          text: 貂马上转身去抓松鼠。松鼠比谁都小，却也比谁都快，嗖地蹿上了树。貂突然想起，松鼠跑了以后，数自己最小。他一转眼也钻进岩缝里的洞中。
        - id: ch01-b16
          speaker: narrator
          text: 狼好不容易回过神，又问这一顿该吃谁。
        - id: ch01-b17
          speaker: bear
          text: 规矩不变，还是吃最小的。
        - id: ch01-b18
          speaker: narrator
          text: 熊说着把爪子伸向野兔。可野兔逃命的本事不是白长的。熊掌还没挨到她，她早钻进森林深处去了。
        - id: ch01-b19
          speaker: narrator
          text: 如今松鼠、貂和野兔全跑了，剩下三只里面，狐狸最小。狼和熊一本正经地向他解释，说他们实在很抱歉，可依照刚定下的规矩，非吃他不可。狐狸迈克尔没有像前面几个伙伴那样转身逃走。他只是亲热地笑了笑。
        - id: ch01-b20
          speaker: fox
          text: 山谷里的东西总有一股陈味儿。要吃得香，还是得到山上去。
        - id: ch01-b21
          speaker: narrator
          text: 狼和熊都觉得有理，便离开洼地，转上山路。狐狸快活地跟着两个大伙伴小跑，半路悄悄凑到狼身边。
        - id: ch01-b22
          speaker: fox
          text: 彼得，等他们把我吃掉，你下一顿准备吃什么？
        - id: ch01-b23
          speaker: narrator
          text: 狼一下犯了难。下一顿吃什么？更要紧的是，到时谁吃谁？他们定下的规矩，是每次吃掉队伍里最小的。狐狸一死，自己当然就比熊小了。这个念头在他脑中一闪，他赶紧开口。
        - id: ch01-b24
          speaker: wolf
          text: 兄弟们，不如我们像伙伴一样住在一起。每只野兽都出去打猎，打到的东西大家一起吃。你们说，这不是更好吗？
        - id: ch01-b25
          speaker: fox
          text: 这可是我听过最好的主意。
        - id: ch01-b26
          speaker: narrator
          text: 两票对一票，熊只好答应。其实在他心里，立刻吃上一顿好饭，可比交朋友强多了。
    - id: ch02
      title: 狐狸与喜鹊
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 接连几天，三只野兽相安无事。森林里的猎物很多，连狼都能吃个够。一天早晨，狐狸照常四处巡视，发现一棵又高又细的树。树梢的枝头上，筑着一个喜鹊窝。
        - id: ch02-b02
          speaker: narrator
          text: 狐狸最爱吃喜鹊雏鸟，一心想弄一只来当晚餐。他绕着树琢磨了好一阵，终于想出一个自以为管用的办法。他在树旁坐下，仰起头，直勾勾地盯住树干。
        - id: ch02-b03
          speaker: magpie
          text: 迈克尔，你盯着什么看呢？
        - id: ch02-b04
          speaker: fox
          text: 我在看这棵树。刚才忽然想到，用它的木头削一副新雪鞋，准合适极了。
        - id: ch02-b05
          speaker: narrator
          text: 喜鹊听了，吓得尖叫起来。
        - id: ch02-b06
          speaker: magpie
          text: 亲爱的兄弟，求你千万别砍这棵树！我的窝就在上面，孩子们还不会飞呢。
          emotion: fearful
        - id: ch02-b07
          speaker: fox
          text: 要找到另一棵这么适合做雪鞋的树，恐怕很难。不过我也不愿意为难你。你给我一只雏鸟，我就去别处找木头。
        - id: ch02-b08
          speaker: narrator
          text: 可怜的喜鹊想不出别的办法，只好怀着沉重的心情飞回窝里，把一只孩子扔下去。狐狸一口叼住雏鸟，得意扬扬地跑了。喜鹊失去孩子，伤心得厉害，却又安慰自己，肯牺牲一个孩子，保住其他孩子，只有智慧非凡的鸟儿才想得出来。
        - id: ch02-b09
          speaker: narrator
          text: 可你猜怎样？几天后，迈克尔又坐到了那棵树下。喜鹊从窝上的小洞向外看，心口猛地一阵刺痛。
        - id: ch02-b10
          speaker: magpie
          text: 你又在看什么？
          emotion: fearful
        - id: ch02-b11
          speaker: fox
          text: 还是这棵树。我在想，用它做出的雪鞋一定很好。
        - id: ch02-b12
          speaker: narrator
          text: 狐狸心不在焉，仿佛连自己说了什么都没留心。喜鹊痛苦地跳来跳去。
        - id: ch02-b13
          speaker: magpie
          text: 兄弟，我亲爱的小兄弟，你可别这样！几天前你明明答应过，要去别处找雪鞋。
        - id: ch02-b14
          speaker: fox
          text: 我是答应过。可是整座森林我都找遍了，没有一棵树比得上这棵。让你为难，我也很过意不去，可这真的不能怪我。我只能再让一步。你扔一只雏鸟下来作交换，我就彻底放弃这副雪鞋。
        - id: ch02-b15
          speaker: narrator
          text: 喜鹊自以为聪明，最后还是把另一个孩子扔了下去。这一回，他可没法再用自己的智慧安慰自己了。
        - id: ch02-b16
          speaker: narrator
          text: 他垂着脑袋坐在窝沿，羽毛乱成一团，模样凄惨极了。森林里的动物都认得那只快活神气的喜鹊，可眼前这只鸟简直像换了一个。一只乌鸦正好飞过，便停下来询问。
        - id: ch02-b17
          speaker: crow
          text: 你窝里少掉的那两个孩子呢？
        - id: ch02-b18
          speaker: magpie
          text: 我只好把他们给狐狸了。上个星期，他来了两次，说要砍我的树做雪鞋。我只能交出两个孩子，求他别砍。
          emotion: sad
        - id: ch02-b19
          speaker: crow
          text: 你这个傻瓜！狐狸只是在吓唬你。他没有斧头，也没有刀，拿什么砍树？你竟然白白牺牲了两个孩子！你怎么会这么傻？
          emotion: surprised
        - id: ch02-b20
          speaker: narrator
          text: 乌鸦飞走了，只留下满心羞愧和悲伤的喜鹊。
        - id: ch02-b21
          speaker: narrator
          text: 第二天早晨，狐狸又饿着肚子来到树下。一只鲜嫩的喜鹊雏鸟，正适合给他做晚餐。可是这回，没有一只胆怯的鸟儿缩在那里听他摆布。喜鹊昂着头，开口时语气坚定极了。
        - id: ch02-b22
          speaker: magpie
          text: 好狐狸，你若听我的劝，就赶紧回家吧。你连刀和斧头都没有，根本砍不倒这棵树。再拿做雪鞋的话吓我，也没有用了！
        - id: ch02-b23
          speaker: narrator
          text: 狐狸没想到事情会变成这样，惊讶得连礼貌都忘了。
        - id: ch02-b24
          speaker: fox
          text: 谁教会你这些聪明话的？
          emotion: surprised
        - id: ch02-b25
          speaker: magpie
          text: 昨天来看我的乌鸦。
        - id: ch02-b26
          speaker: fox
          text: 原来是乌鸦。以后最好别让他遇见我，不然他可要倒霉。
    - id: ch03
      title: 乌鸦脱险
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 狡猾的迈克尔不想再说下去，转身离开森林。他来到大路上，把四肢伸得笔直，直挺挺躺下，装成一只死狐狸。
        - id: ch03-b02
          speaker: narrator
          text: 很快，他从眼角看见乌鸦飞了过来，便躺得更僵，连舌头也垂在嘴外。乌鸦正饿得厉害，赶紧跳到他身边，低下头去啄那条舌头。狐狸猛地合上嘴，一口咬住乌鸦的翅膀。
        - id: ch03-b03
          speaker: narrator
          text: 乌鸦知道挣扎也没用，便对狐狸说起好话。
        - id: ch03-b04
          speaker: crow
          text: 兄弟，你真要吃我，就请吃得气派一点。先把我扔下这座悬崖，让羽毛四处飘散。以后谁看见它们，都会知道你的聪明远胜过我。
        - id: ch03-b05
          speaker: narrator
          text: 狐狸听得十分满意。他一直记恨乌鸦，怪他害自己再也吃不到喜鹊雏鸟。这会儿若能让乌鸦承认自己更聪明，那可再好不过。于是他把乌鸦叼到悬崖边，扔了下去。他早就想好，等会儿沿熟悉的小路绕到崖底，再把乌鸦捡回来。
        - id: ch03-b06
          speaker: narrator
          text: 哪知狐狸刚松开嘴，乌鸦便展开翅膀，飞上天空。他停在狐狸的牙齿够不着的地方，笑着喊下来。
        - id: ch03-b07
          speaker: crow
          text: 狐狸呀狐狸！你很会捉，可惜不会守！
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: 狐狸夹着尾巴，灰溜溜地钻进森林。他猜乌鸦一定会抢在前头飞回去，叫森林里的每只动物都小心提防自己。这下，他不知道该去哪里找晚餐了。一想到晚上得饿着肚子睡觉，他就难受得很。正在发愁时，他恰巧遇上老朋友熊。
    - id: ch04
      title: 熊妻的哭丧人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 熊刚刚失去妻子，心里十分悲痛。他觉得应该找个真正会哭丧的人，好好哀悼她。这天，他才从舒适的洞穴里走出来，就遇到了狼。狼问他要去哪里，熊便把妻子去世的事讲了一遍。
        - id: ch04-b02
          speaker: wolf
          text: 那就让我替你哭吧！
        - id: ch04-b03
          speaker: bear
          text: 你真的会号丧吗？
        - id: ch04-b04
          speaker: wolf
          text: 当然会，教父，我当然会。
        - id: ch04-b05
          speaker: narrator
          text: 熊想先听一段，确认狼真的懂这门本事。狼立刻放开了嗓门。
        - id: ch04-b06
          speaker: wolf
          text: 你听我号一段——呼，呼，呼，哼，嗬！
        - id: ch04-b07
          speaker: narrator
          text: 这一嗓子吵得熊赶紧用爪子捂住耳朵，求狼别再唱了。
        - id: ch04-b08
          speaker: bear
          text: 你根本不会哭丧。快走！
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: 熊继续往前走。路边沟里，野兔正在休息。她见熊满脸悲伤，便出来问候。熊说起亡妻，又告诉她，自己要找一个真正懂得哀悼的哭丧人。野兔马上说她愿意试试，熊仍要先听听她的本事。
        - id: ch04-b10
          speaker: hare
          text: 那您听听我的——噗，噗，噗，嘭，啵！
        - id: ch04-b11
          speaker: narrator
          text: 野兔的声音实在太小，熊几乎听不见。
        - id: ch04-b12
          speaker: bear
          text: 这不是我要的哭法。早安，再会吧。
        - id: ch04-b13
          speaker: narrator
          text: 野兔走后，狐狸来到了熊面前。他一看熊的模样，就知道老朋友出了事。
        - id: ch04-b14
          speaker: fox
          text: 教父，你怎么了？这是要到哪里去？
        - id: ch04-b15
          speaker: bear
          text: 我在给妻子找一个哭丧人。
          emotion: sad
        - id: ch04-b16
          speaker: fox
          text: 那就选我吧！
        - id: ch04-b17
          speaker: narrator
          text: 熊仔细打量着狐狸。
        - id: ch04-b18
          speaker: bear
          text: 你会好好号丧吗？
        - id: ch04-b19
          speaker: fox
          text: 我唱得可好了。你听！喽，喽，喽！那远近闻名的纺线能手，那烤得一手好饼的巧妇，那精明持家的主妇，被从丈夫身边夺走了！喽，喽，喽！她去了！她去了！
        - id: ch04-b20
          speaker: bear
          text: 这回总算找到了一个真正懂得哭丧的人！
          emotion: happy
        - id: ch04-b21
          speaker: narrator
          text: 熊高兴极了，带着狐狸回到洞穴。熊妻一动不动，躺在灰苔铺成的床上。熊请狐狸站在亡妻身边，马上开始哭丧。狐狸看了看四周，却说这个地方根本不合适。
        - id: ch04-b22
          speaker: fox
          text: 洞里太潮湿，根本哭不好。你把遗体搬到储藏室吧。在那里唱起来，声音一定好听得多。
        - id: ch04-b23
          speaker: narrator
          text: 熊依言把妻子的遗体搬进储藏室，自己回洞里给哭丧人煮麦糊。他不时停下手，侧耳去听，却怎么也听不见哭声。最后，熊走到储藏室门外，大声问狐狸。
        - id: ch04-b24
          speaker: bear
          text: 教父，你怎么还不号丧？你在里面做什么？
        - id: ch04-b25
          speaker: narrator
          text: 狐狸哪是在哀悼熊妻。他一直躲在里面，悄悄吃她。这时，他隔着门回答。
        - id: ch04-b26
          speaker: fox
          text: 现在只剩她的腿和脚掌底了。再给我五分钟，这些也会消失！
        - id: ch04-b27
          speaker: narrator
          text: 熊听见这话，马上跑回厨房拿起长柄勺，要给这个叛徒一顿应得的痛打。可是狐狸早已防着他。储藏室的门刚打开，迈克尔便从熊的两腿之间一溜烟钻了过去，头也不回地冲进森林。
        - id: ch04-b28
          speaker: narrator
          text: 熊眼看叛徒逃走，用力把长柄勺掷了出去。勺子正好打中狐狸的尾巴尖。于是从那以后，所有狐狸的尾巴尖上都有一块白斑。
        - id: ch04-b29
          speaker: narrator
          text: 这个故事选自《芬兰童话》。
