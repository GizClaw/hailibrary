  chapters:
    - id: ch01
      title: The Sledge and the Six Beasts
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man who lived with his wife in a little hut, far from every neighbor. They did not mind the lonely place. They might have been perfectly happy there, except that a marten came to their poultry yard each night and carried off one of their fowls.
        - id: ch01-b02
          speaker: narrator
          text: The man set trap after trap for the thief. But one day, instead of catching his enemy, he was caught himself. He fell, struck his head on a stone, and died.
        - id: ch01-b03
          speaker: narrator
          text: Before long, the marten came looking for his supper. He saw the dead man on the ground and could hardly believe his luck.
        - id: ch01-b04
          speaker: marten
          text: Now there's a prize! I've done well for myself tonight.
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: With great trouble, he dragged the body onto the sledge he had waiting and drove away with his prize. He had not gone far when he met a squirrel. The squirrel bowed politely to him before asking about the load behind him.
        - id: ch01-b06
          speaker: squirrel
          text: Good morning, godfather. What are you carrying back there?
        - id: ch01-b07
          speaker: narrator
          text: The marten laughed.
        - id: ch01-b08
          speaker: marten
          text: You won't believe it. That old man set traps around his henhouse to catch me, but he fell into one himself and broke his neck. He's terribly heavy. Come help me pull the sledge.
        - id: ch01-b09
          speaker: narrator
          text: The squirrel agreed, and together they moved slowly on. After a while, a hare ran across a field. She stopped when she saw the strange load coming toward her.
        - id: ch01-b10
          speaker: hare
          text: What have you got on that sledge?
        - id: ch01-b11
          speaker: narrator
          text: The marten told her the whole strange story and asked her to pull with them. The hare agreed and pulled as hard as she could. After a while, a fox joined the company, then a wolf, and at last a bear. The bear was so strong that he did more work than all the other five beasts put together.
        - id: ch01-b12
          speaker: narrator
          text: The six beasts ate the man for supper. After that, their load was much easier to draw. The trouble was, they soon became hungry again. The wolf was hungriest of all.
        - id: ch01-b13
          speaker: wolf
          text: Friends, the man is gone. What are we going to eat now?
        - id: ch01-b14
          speaker: bear
          text: I suppose we'll have to eat whoever is smallest.
        - id: ch01-b15
          speaker: narrator
          text: The marten turned at once to grab the squirrel, who was far smaller than any of them. But the squirrel shot up a tree like lightning. Then the marten remembered just in time that he was next smallest. Quick as thought, he slipped into a hole among the rocks.
        - id: ch01-b16
          speaker: narrator
          text: Once the wolf had recovered from his surprise, he asked again what they would eat.
        - id: ch01-b17
          speaker: bear
          text: The rule is the same. We eat the smallest one left.
        - id: ch01-b18
          speaker: narrator
          text: The bear reached a paw toward the hare. But the hare knew how to be a hare. Before his paw touched her, she had darted deep into the woods.

    - id: ch02
      title: The Fox Changes the Rule
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: With the squirrel, marten, and hare gone, the fox was smallest among the three who remained. The wolf and the bear told him they were very sorry, but now they would have to eat him.
        - id: ch02-b02
          speaker: narrator
          text: Michael the fox did not run away. He gave them a friendly smile.
        - id: ch02-b03
          speaker: fox
          text: Food tastes stale down in a valley. We'd have a much better appetite up on a mountain.
        - id: ch02-b04
          speaker: narrator
          text: The wolf and bear agreed. They left the hollow where they had been walking and took a path up the mountainside. Michael trotted cheerfully beside his two large companions. On the way, he found a chance to whisper to the wolf.
        - id: ch02-b05
          speaker: fox
          text: Tell me, Peter. After you've eaten me, what will you have for your next dinner?
        - id: ch02-b06
          speaker: narrator
          text: That simple question upset the wolf badly. What would their next dinner be? More importantly, who would still be there to eat it? They had made a rule that they would always dine on the smallest of the party. Once the fox was gone, the wolf himself would be smaller than the bear. He understood at once what that meant for him.
        - id: ch02-b07
          speaker: narrator
          text: The thought flashed through his mind, and he spoke in a hurry.
        - id: ch02-b08
          speaker: wolf
          text: Dear brothers, wouldn't it be better if we lived as comrades? Each of us could hunt, and whatever we caught would make dinner for everyone. Doesn't that sound like a good plan?
        - id: ch02-b09
          speaker: fox
          text: It's the best idea I've ever heard.
        - id: ch02-b10
          speaker: narrator
          text: Two were now against one, so the bear had to accept the plan. In his heart, though, he would much rather have had a good dinner at once than any friendship.
        - id: ch02-b11
          speaker: narrator
          text: For a few days, everything went well. Game was plentiful in the forest, and even the wolf had all he wanted to eat.

    - id: ch03
      title: The Magpie's Young Ones
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: One morning, the fox was making his usual rounds when he noticed a tall, slender tree. A magpie had built a nest in one of its highest branches. Michael was especially fond of young magpies, so he began to plan how he might get one for dinner. At last, he settled on an idea. He sat near the tree and stared hard at it.
        - id: ch03-b02
          speaker: magpie
          text: What are you looking at, Michael?
        - id: ch03-b03
          speaker: fox
          text: This tree. I was just thinking it would be perfect for cutting out a new pair of snowshoes.
        - id: ch03-b04
          speaker: narrator
          text: The magpie let out a loud screech.
        - id: ch03-b05
          speaker: magpie
          text: Oh, please, dear brother, not this tree! My nest is here, and my little ones are still too young to fly.
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: The fox tipped his head to one side and studied the tree as if he were thinking very carefully.
        - id: ch03-b07
          speaker: fox
          text: I doubt I'll find another tree that would make such fine snowshoes. Still, I don't want to be unkind. Give me one of your young ones, and I'll look somewhere else.
        - id: ch03-b08
          speaker: narrator
          text: The poor magpie did not know what else to do, so he agreed. With a heavy heart, he flew back to the nest and pushed one of his young ones out. The fox caught the little bird in his mouth and ran away in triumph. Behind him, the grieving magpie remained in the tree with the young ones he believed he had saved.
        - id: ch03-b09
          speaker: narrator
          text: The magpie grieved deeply for his little one. Yet he comforted himself by thinking that only an unusually wise bird would have thought to sacrifice one child and save all the others.
        - id: ch03-b10
          speaker: narrator
          text: But a few days later, there sat Michael beneath the very same tree. When the magpie peered down from a hole in the nest, a dreadful pain went through his heart.
        - id: ch03-b11
          speaker: magpie
          text: What are you looking at now?
          emotion: fearful
        - id: ch03-b12
          speaker: fox
          text: This tree. I was thinking again what excellent snowshoes it would make.
        - id: ch03-b13
          speaker: narrator
          text: He sounded absent-minded, as if his own words hardly interested him. The magpie hopped about in anguish.
        - id: ch03-b14
          speaker: magpie
          text: Oh, my brother, my dear little brother, don't do it! Only a few days ago, you promised to find your snowshoes somewhere else.
          emotion: fearful
        - id: ch03-b15
          speaker: fox
          text: Yes, I did. But I've searched the whole forest, and there isn't one other tree as good as this. I'm sorry to trouble you, but that isn't my fault. I can give up the snowshoes altogether if you throw down another young one in exchange.
        - id: ch03-b16
          speaker: narrator
          text: In spite of all his supposed wisdom, the poor magpie had to push another little one from the nest, and the fox carried it away. This time, the father could not comfort himself with the thought that he had been cleverer than other people. He had used the same bargain twice, and now two of his little ones were gone.

    - id: ch04
      title: The Crow's Warning
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The magpie sat on the edge of his nest. His head drooped, his feathers were ruffled, and he looked utterly miserable. He was so unlike the gay, jaunty magpie every creature knew that a passing crow stopped to ask what was wrong.
        - id: ch04-b02
          speaker: crow
          text: Where are the two young ones that are missing from your nest?
        - id: ch04-b03
          speaker: magpie
          text: I had to give them to the fox. He came twice this week and threatened to cut down my tree for snowshoes. The only way I could make him leave was to give him two of my little ones.
          emotion: sad
        - id: ch04-b04
          speaker: crow
          text: You foolish bird! The fox only wanted to frighten you. How could he cut down a tree when he has no ax and no knife? Oh dear, you gave away your young ones for nothing. How could you be so foolish?
        - id: ch04-b05
          speaker: narrator
          text: The crow flew away. The magpie was left alone, overcome by shame as well as sorrow. Now he knew the sacrifice had never been necessary and that the fox's threat had been empty from the beginning.
        - id: ch04-b06
          speaker: narrator
          text: The next morning, the hungry fox returned to his usual place. A nice young magpie would have made him a very good dinner. This time, however, the bird above him was not cowering or timid. The magpie held his head high, and his voice was firm.
        - id: ch04-b07
          speaker: magpie
          text: My good fox, take my advice and go home as quickly as you can. There's no use talking about snowshoes. You have no knife or ax to cut this tree down.
        - id: ch04-b08
          speaker: narrator
          text: The turn of events surprised the fox so much that he forgot his manners.
        - id: ch04-b09
          speaker: fox
          text: Who taught you to be so wise?
          emotion: surprised
        - id: ch04-b10
          speaker: magpie
          text: The crow did. She visited me yesterday.
        - id: ch04-b11
          speaker: fox
          text: The crow, was it? She had better stay out of my way from now on, or she'll be sorry.
        - id: ch04-b12
          speaker: narrator
          text: Michael had no wish to continue that conversation, so he left the forest. When he reached the high road, he stretched himself flat on the ground and pretended to be dead.
        - id: ch04-b13
          speaker: narrator
          text: Soon he saw the crow flying toward him. He watched from the corner of his eye and became stiffer and stiller than ever, with his tongue hanging from his mouth. The crow badly wanted her supper. Believing the fox was dead, she came down, hopped quickly toward him, and bent forward to peck at his tongue. At once, the fox snapped his jaws and caught her by the wing.
        - id: ch04-b14
          speaker: narrator
          text: The crow knew that struggling would do no good, so she spoke to him.
        - id: ch04-b15
          speaker: crow
          text: Brother, if you truly mean to eat me, please do it in grand style. First throw me over this precipice. My feathers will scatter everywhere, and anyone who sees them will know your cunning was greater than mine.
        - id: ch04-b16
          speaker: narrator
          text: The idea pleased the fox greatly. He still had not forgiven the crow for depriving him of the young magpies, and he liked the thought of showing that his cunning was greater. He carried her to the edge and tossed her over the precipice. Then he meant to go around by a path he knew and collect her at the bottom.
        - id: ch04-b17
          speaker: narrator
          text: But the instant the fox released her, the crow soared into the air. She hovered just beyond the reach of his jaws and laughed.
        - id: ch04-b18
          speaker: crow
          text: Ah, fox! You know how to catch, but you don't know how to keep!
          emotion: happy
        - id: ch04-b19
          speaker: narrator
          text: With his tail between his legs, the fox slunk back into the forest.

    - id: ch05
      title: The Bear Seeks a Mourner
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Michael did not know where to find dinner now. He guessed the crow would fly ahead of him and warn everyone. The thought of going to bed without supper was very unpleasant. He was still wondering what he could do when he met his old friend the bear.
        - id: ch05-b02
          speaker: narrator
          text: The poor bear had just lost his wife. He felt her loss deeply and had set out to find someone who could mourn properly over her. He had barely left his comfortable cave when he met the wolf. The wolf asked where he was going, and the bear explained what had happened and why he needed a mourner.
        - id: ch05-b03
          speaker: wolf
          text: Let me be your mourner!
        - id: ch05-b04
          speaker: bear
          text: Do you know how to howl properly?
        - id: ch05-b05
          speaker: wolf
          text: Of course I do, godfather. Of course!
        - id: ch05-b06
          speaker: narrator
          text: The bear wanted a sample before he decided whether the wolf knew his business. So the wolf burst into a song of grief.
        - id: ch05-b07
          speaker: wolf
          text: Hu, hu, hu, hum, hoh!
        - id: ch05-b08
          speaker: narrator
          text: The noise was so dreadful that the bear covered his ears with his paws and begged him to stop.
        - id: ch05-b09
          speaker: bear
          text: You don't know the first thing about mourning. Go away!
          emotion: angry
        - id: ch05-b10
          speaker: narrator
          text: A little farther along the road, the hare was resting in a ditch. When she saw the bear, she came out to speak with him and asked why he looked so sad. He told her that his wife had died and that he was searching for someone who could lament over her in the proper way.
        - id: ch05-b11
          speaker: narrator
          text: The hare offered her services at once. Again, the bear asked for proof of her talent before he accepted.
        - id: ch05-b12
          speaker: hare
          text: Pu, pu, pu, pum, poh!
        - id: ch05-b13
          speaker: narrator
          text: Her voice was so tiny that he could scarcely hear it.
        - id: ch05-b14
          speaker: bear
          text: No, that isn't what I need. Good morning to you.
        - id: ch05-b15
          speaker: narrator
          text: After that, the fox came along. He too noticed how changed the bear looked and stopped beside him.
        - id: ch05-b16
          speaker: fox
          text: What's wrong, godfather? Where are you going?
        - id: ch05-b17
          speaker: bear
          text: I'm trying to find someone to mourn for my wife.
        - id: ch05-b18
          speaker: fox
          text: Then choose me!
        - id: ch05-b19
          speaker: narrator
          text: The bear studied him thoughtfully.
        - id: ch05-b20
          speaker: bear
          text: Can you howl well?
        - id: ch05-b21
          speaker: fox
          text: Beautifully. Just listen.
        - id: ch05-b22
          speaker: narrator
          text: The fox raised his voice and sang as if he were weeping.
        - id: ch05-b23
          speaker: fox
          text: Lou, lou, lou! The famous spinner, the baker of fine cakes, the careful keeper of the house has been torn from her husband! Lou, lou, lou! She's gone! She's gone!
          emotion: sad
        - id: ch05-b24
          speaker: bear
          text: At last, I've found someone who truly understands how to lament!
          emotion: happy
        - id: ch05-b25
          speaker: narrator
          text: Delighted, the bear led the fox back to his cave. His dead wife lay stretched upon a bed of gray moss, and he told Michael to begin mourning over her.

    - id: ch06
      title: The Fox's Last Trick
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: But mourning in the cave did not suit the fox at all.
        - id: ch06-b02
          speaker: fox
          text: No one can wail properly in here. This cave is much too damp. Take her body to the storehouse instead. My lament will sound far better there.
        - id: ch06-b03
          speaker: narrator
          text: The bear carried his wife's body to the storehouse. Then he went back to the cave to cook some porridge for the mourner. Every so often, he stopped and listened, but he heard no wailing.
        - id: ch06-b04
          speaker: narrator
          text: At last, he went to the storehouse door and called inside.
        - id: ch06-b05
          speaker: bear
          text: Why aren't you howling, godfather? What are you doing in there?
        - id: ch06-b06
          speaker: narrator
          text: Instead of mourning over the dead bear, the fox had been quietly eating her. He called back his answer.
        - id: ch06-b07
          speaker: fox
          text: Only her legs and the soles of her feet are left now. Give me five more minutes, and those will be gone too!
        - id: ch06-b08
          speaker: narrator
          text: When the bear heard this terrible answer, he ran back to the cave for the kitchen ladle. He meant to give the traitor the beating he deserved. But Michael heard him coming and was ready. The moment the bear opened the storehouse door, the fox slipped between his legs and raced straight into the forest.
        - id: ch06-b09
          speaker: narrator
          text: The bear saw that the traitor was escaping and hurled the ladle after him. It struck the very tip of Michael's tail.
        - id: ch06-b10
          speaker: narrator
          text: And that is why every fox has a spot of white at the end of its tail.
