  chapters:
    - id: ch01
      title: The Prince Sets Out
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, in the very middle of the middle of a great kingdom, there stood a town. In that town was a palace, and in that palace lived a king. He had one son, and he believed no prince had ever been wiser or cleverer. The king had spared no effort to make him so. He chose the boy's tutors and governors with the greatest care. When the prince became a young man, his father sent him traveling. He wanted his son to see how other people lived and learn that their ways were often just as good as his own.
        - id: ch01-b02
          speaker: narrator
          text: The prince had now been home for a year. His father thought the time had come for him to learn how to rule the kingdom he would one day inherit. Yet during his long absence, the prince seemed to have changed completely. The merry, lighthearted boy had returned a gloomy, thoughtful man. The king knew of nothing that could explain it. He worried from morning until night, until at last an answer came to him. The prince must be in love.
        - id: ch01-b03
          speaker: narrator
          text: The prince barely spoke at all, and he never spoke about his feelings. If the king meant to discover the reason for that dismal face, he would have to begin the conversation himself. One day after dinner, he took his son by the arm and led him into another room. Portraits of beautiful young women covered every wall, and each seemed lovelier than the last.
        - id: ch01-b04
          speaker: old_king
          text: My dear boy, you've been so unhappy. Perhaps life here with only me feels lonely after all your travels. You should marry. These are the most beautiful women in the world who are of royal rank. Choose the one you want, and I'll ask her father for her hand.
        - id: ch01-b05
          speaker: prince
          text: Your Majesty, love and marriage aren't troubling me. Day and night, one thought follows me. Every man must die, even a king. I can never be happy until I find a kingdom where death is unknown. I won't rest until I discover the Land of Immortality.
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: The old king listened in dismay. Matters were far worse than he had imagined. He tried to reason with his son. For all those years, he explained, he had looked forward to the prince's return. Now he hoped to give up the throne and the cares of ruling, which had begun to weigh heavily on him. He talked and pleaded, but all in vain. The prince would listen to nothing. The very next morning, the young man buckled on his sword and set out.

    - id: ch02
      title: The Tree and the Mountain
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The prince traveled for many days and left his homeland far behind. Then, close beside the road, he came upon a huge tree. An eagle sat on its highest branch, shaking the limbs with all his strength. It was such a strange thing for an eagle to do that the prince stopped in surprise. The bird noticed him, flew to the ground, and changed into a king the moment his feet touched the earth.
        - id: ch02-b02
          speaker: eagle_king
          text: Why are you staring at me like that?
        - id: ch02-b03
          speaker: prince
          text: I was wondering why you were shaking those branches so fiercely.
        - id: ch02-b04
          speaker: eagle_king
          text: I am bound to this task. Neither I nor any of my family can die until I tear this great tree out by its roots. But evening has come, so my work is done for today. Come home and spend the night as my guest.
        - id: ch02-b05
          speaker: narrator
          text: Tired and hungry, the prince gratefully accepted the invitation. At the palace, the eagle king's beautiful daughter welcomed them and ordered dinner to be served at once. While they ate, the king questioned his guest. Was he wandering only for pleasure, or did he have some special purpose? The prince told him the whole story. He explained why he had left home and why he could never turn back until he discovered the Land of Immortality.
        - id: ch02-b06
          speaker: eagle_king
          text: Dear brother, you've already found it! Stay here with us. Death cannot touch my family until I uproot that tree, and the work will take six hundred years. Marry my daughter, and we can all live happily together. Six hundred years is an eternity!
          emotion: happy
        - id: ch02-b07
          speaker: prince
          text: Dear king, your offer is tempting. But after those six hundred years, we would still die. That won't do. I must keep searching for a country where death never comes.
          emotion: sad
        - id: ch02-b08
          speaker: narrator
          text: Then the princess herself tried to persuade their guest to change his mind. The prince only shook his head sorrowfully. At last, she understood that his decision was firm. She went to a cabinet, took out a little box, and showed him that it held her portrait.
        - id: ch02-b09
          speaker: eagle_princess
          text: Since you won't stay, please keep this box to remember us. If your travels weary you before you reach the Land of Immortality, open it and look at my picture. It will carry you over earth or through the air, as quick as thought and as swift as a whirlwind.
        - id: ch02-b10
          speaker: narrator
          text: The prince thanked her, tucked the box into his tunic, and sadly said farewell to the eagle king and his daughter.
        - id: ch02-b11
          speaker: narrator
          text: Never had any traveler received a more useful gift. Again and again, the little box carried the prince onward, and each time he blessed the princess for her kindness. One evening, it brought him to the top of a high mountain. There a bald-headed man was hard at work. He dug up one spadeful of earth after another and threw each one into a basket. When the basket was full, he carried it away. Then he returned with it empty and filled it once more. The prince stood watching for some time before the man finally looked up.
        - id: ch02-b12
          speaker: bald_king
          text: Dear brother, what is it that surprises you?
        - id: ch02-b13
          speaker: prince
          text: I was wondering why you keep filling that basket.
        - id: ch02-b14
          speaker: bald_king
          text: I am bound to do this. No one in my family can die until I dig away this entire mountain and make it level with the plain. But it's nearly dark, and I'll work no longer today.
        - id: ch02-b15
          speaker: narrator
          text: He plucked a leaf from a nearby tree and changed from a rough laborer into a stately bald-headed king.
        - id: ch02-b16
          speaker: bald_king
          text: Come home with me. You must be hungry and tired, and my daughter will have supper waiting.
        - id: ch02-b17
          speaker: narrator
          text: The prince went gladly. At the palace door, the king's daughter welcomed them. She was even more beautiful than the first princess. She led them into a great hall, where a table stood covered with silver dishes. While they ate, the bald-headed king asked how the prince had wandered so far from home. The young man told him the entire story and explained that he was seeking the Land of Immortality.
        - id: ch02-b18
          speaker: bald_king
          text: Then you've found it. My family cannot die until I finish leveling that mountain, and the work will take another eight hundred years. Stay and marry my daughter. Surely eight hundred years is long enough to live.
        - id: ch02-b19
          speaker: prince
          text: It is a very long life. Even so, I'd rather keep searching for the land where there is no death at all.
        - id: ch02-b20
          speaker: narrator
          text: The next morning, the prince said farewell. The princess begged him to stay, but when she could not persuade him, she gave him a gold ring as a remembrance. The ring was even more useful than the box. Anyone wearing it could wish to be somewhere and arrive at once, without flying through the air. The prince put it on, thanked her warmly, and continued on his way.

    - id: ch03
      title: The Blue Kingdom and the City in the Air
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The prince walked on for some distance before he remembered the ring. Then he decided to find out whether the princess had spoken truly about its power.
        - id: ch03-b02
          speaker: prince
          text: I wish I were at the end of the world.
        - id: ch03-b03
          speaker: narrator
          text: He closed his eyes. When he opened them, he stood in a street lined with marble palaces. Tall, strong men in magnificent clothes passed him on every side. The prince stopped several of them and asked the city's name. He tried every one of the twenty-seven languages he knew, but not a single man answered. His heart sank. What could he do in this strange place if nobody understood a word he said? Just then, he noticed a man dressed in the fashion of his own country. The prince ran up and spoke to him in their native tongue.
        - id: ch03-b04
          speaker: prince
          text: My friend, what city is this?
        - id: ch03-b05
          speaker: countryman
          text: This is the capital of the Blue Kingdom. The king is dead, and his daughter rules now.
        - id: ch03-b06
          speaker: narrator
          text: Satisfied with the answer, the prince asked his countryman to show him the way to the young queen's palace. The man led him through street after street until they entered a wide square. One whole side was taken up by a splendid building. It seemed to be carried on slender pillars of soft green marble. On the steps in front sat the queen, wrapped in a veil like shining silver mist. She listened to her people's complaints and gave justice to each of them.
        - id: ch03-b07
          speaker: narrator
          text: As soon as the prince approached, the queen saw that he was no ordinary man. She told her chamberlain to dismiss the rest of the petitioners for the day, then motioned for the stranger to follow her into the palace. Luckily, she had learned his language as a child, so they could easily understand each other. The prince told his whole story and described his search for the Land of Immortality. When he finished, the queen rose, took his arm, and led him to the doorway of another room. Its entire floor was made of needles. They stood so close together that there was no space for even one more.
        - id: ch03-b08
          speaker: blue_queen
          text: Look at these needles, prince. Neither I nor anyone in my family can die until I wear out every one of them with my sewing. That will take at least a thousand years. Stay here and share my throne. A thousand years is long enough to live!
        - id: ch03-b09
          speaker: prince
          text: It certainly is. But when the thousand years end, I would still have to die. No, I must find the land where death does not exist.
        - id: ch03-b10
          speaker: narrator
          text: The queen tried everything she could to make him stay. When she saw that her words were useless, she finally gave up.
        - id: ch03-b11
          speaker: blue_queen
          text: If you must leave, take this little golden rod to remember me. Whenever you're in need, it can become anything you wish.
        - id: ch03-b12
          speaker: narrator
          text: The prince thanked her, slipped the rod into his pocket, and went on. He had barely left the city behind when he reached a broad river that no person could cross. He truly stood at the end of the world, beside the river that flowed all the way around it. Unsure what to do, he walked a little way along the bank. Then he looked up and saw a beautiful city floating in the air above his head. He longed to reach it, but there was no road and no bridge anywhere. Still, the city seemed to draw him upward. He felt certain that at last he was looking at the country he had sought.
        - id: ch03-b13
          speaker: narrator
          text: Suddenly, he remembered the golden rod given to him by the mist-veiled queen. His heart pounded as he threw it to the ground and wished with all his strength for it to become a bridge. He feared that such a task might be beyond its power after all. But the rod vanished, and in its place stood a golden ladder leading straight up to the city in the air.
        - id: ch03-b14
          speaker: narrator
          text: As the prince reached the golden gates, a marvelous beast sprang at him. He had never seen anything like it.
        - id: ch03-b15
          speaker: prince
          text: Sword, out of your sheath!
          emotion: fearful
        - id: ch03-b16
          speaker: narrator
          text: The prince sprang backward with a cry. His sword leaped from its scabbard and cut off several of the monster's heads, but new heads grew back at once. The prince stood frozen where he was, pale with terror. He called out for help and ordered the sword back into its sheath.
        - id: ch03-b17
          speaker: narrator
          text: The city's queen heard the noise and looked down from her window to see what was happening. She summoned one of her servants and ordered him to rescue the stranger and bring him before her. The prince thankfully obeyed and entered the queen's presence. The moment she saw him, she too felt certain that he was no ordinary man. She welcomed him graciously and asked what had brought him to the city. The prince answered with his whole story and told her how long and far he had traveled in search of the Land of Immortality.
        - id: ch03-b18
          speaker: immortal_queen
          text: You have found it. I am queen over life and death, and here you may live among the immortals.

    - id: ch04
      title: A Thousand Years and the Journey Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: A thousand years passed after the prince entered the city, yet they flew by so quickly that they seemed no longer than six months. Not one instant of those thousand years was unhappy. Then one night, the prince dreamed of his father and mother. All at once, a fierce longing for home swept over him. In the morning, he went to the Queen of the Immortals and told her he had to see his parents once more.
        - id: ch04-b02
          speaker: immortal_queen
          text: Prince, have you lost your senses? Your father and mother died more than eight hundred years ago. Not even their dust will remain!
          emotion: surprised
        - id: ch04-b03
          speaker: prince
          text: Even so, I must go.
        - id: ch04-b04
          speaker: immortal_queen
          text: Then don't rush away. Wait while I prepare you for the journey.
        - id: ch04-b05
          speaker: narrator
          text: She understood that nothing would stop him. The queen unlocked her great treasure chest and took out two beautiful flasks, one made of silver and the other of gold. She hung both around the prince's neck. Then she led him to a small trapdoor in one corner of the room and opened it. In another corner, she showed him a well.
        - id: ch04-b06
          speaker: immortal_queen
          text: Fill the silver flask with the water below this door. It is enchanted. Sprinkle it on anyone, even someone who has lived for a thousand years, and that person will die at once. Fill the golden flask from the well in the other corner. That water springs from the rock of eternity. A few drops will restore a body to life, even after a thousand years of death.
        - id: ch04-b07
          speaker: narrator
          text: The prince thanked the queen, said farewell, and began his journey.
        - id: ch04-b08
          speaker: narrator
          text: He soon reached the city of the mist-veiled queen, but everything had changed. He could barely find his way through the streets. Inside the palace, all was silent. The prince wandered from room to room without meeting anyone who might stop him. At last, he entered the queen's own chamber. She lay there with her embroidery still held in her hands, as though she were fast asleep. He pulled at her dress, but she did not wake.
        - id: ch04-b09
          speaker: narrator
          text: A dreadful thought struck him. He ran to the room where the needles had been kept and found it completely empty. The queen had broken the final needle while sewing the very piece she still held. When that last needle broke, the spell had broken too, and she had died. Quick as thought, the prince drew out the golden flask and sprinkled a few drops over her. She moved gently, raised her head, and opened her eyes.
        - id: ch04-b10
          speaker: blue_queen
          text: Oh, my dear friend, I'm so glad you woke me. I must have been asleep for a very long time!
          emotion: happy
        - id: ch04-b11
          speaker: prince
          text: Without me, you would have slept forever.
        - id: ch04-b12
          speaker: narrator
          text: The queen remembered the needles and understood that she had died. She thanked the prince from her heart and promised to repay him if she ever had the chance.
        - id: ch04-b13
          speaker: narrator
          text: After taking his leave, the prince continued toward the bald-headed king's country. As he drew near, he saw that the entire mountain had been dug away and the land was level with the plain. The king lay dead on the ground, with his spade and basket beside him. As soon as the water from the golden flask touched him, he yawned, stretched himself, and slowly rose to his feet.
        - id: ch04-b14
          speaker: bald_king
          text: My dear friend, how glad I am to see you! I must have slept a long time!
          emotion: happy
        - id: ch04-b15
          speaker: prince
          text: You would have slept forever if I hadn't come to wake you.
        - id: ch04-b16
          speaker: narrator
          text: The king remembered the mountain and the spell. He too promised to repay the prince if he ever could.
        - id: ch04-b17
          speaker: narrator
          text: Farther along the road toward his old home, the prince found the great tree torn out by its roots. The eagle king sat dead on the ground beside it. His wings were spread as though he had been ready to fly. The prince let drops from the golden flask fall across the feathers. A flutter ran through them, and the eagle slowly lifted his beak from the earth.
        - id: ch04-b18
          speaker: eagle_king
          text: How long I must have slept! My dear, good friend, how can I ever thank you for waking me?
          emotion: happy
        - id: ch04-b19
          speaker: prince
          text: If I hadn't awakened you, your sleep would have lasted forever.
        - id: ch04-b20
          speaker: narrator
          text: The eagle king remembered the tree and knew that he had died. He promised to repay the prince whenever the chance came.

    - id: ch05
      title: The Wager with Death
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At last, the prince reached the capital of his father's kingdom. He went to the place where the royal palace had once stood, but the marble galleries where he had played were gone. In their place lay a great lake of sulphur, with blue flames leaping into the air. How could he find his father and mother and bring them back to life if they lay at the bottom of that horrible water? He turned away in sorrow and wandered through the streets, hardly knowing where he was going. Then a voice cried out behind him.
        - id: ch05-b02
          speaker: death
          text: Stop, prince! I've caught you at last. I began searching for you a thousand years ago.
        - id: ch05-b03
          speaker: narrator
          text: The old, white-bearded figure of Death stood beside him. The prince swiftly pulled the ring from his finger. At once, the eagle king, the bald-headed king, and the mist-veiled queen hurried to his aid, ready to repay what he had done for them. Together they seized Death and held him fast, giving the prince time to race toward the Land of Immortality.
        - id: ch05-b04
          speaker: narrator
          text: They did not know how swiftly Death could fly. The prince had only one foot across the border when Death caught the other from behind.
        - id: ch05-b05
          speaker: death
          text: Halt! Now you belong to me.
        - id: ch05-b06
          speaker: narrator
          text: The Queen of the Immortals was watching from her window.
        - id: ch05-b07
          speaker: immortal_queen
          text: You have no power in my kingdom, Death. Go elsewhere for your prey.
        - id: ch05-b08
          speaker: death
          text: That's true, but one of his feet is still in my kingdom. That foot belongs to me!
        - id: ch05-b09
          speaker: immortal_queen
          text: At least half of him is mine, and what use is the other half to you? Half a man is no good to either of us. Just this once, I'll let you enter my kingdom. We'll settle who gets him with a wager.
        - id: ch05-b10
          speaker: narrator
          text: Death crossed the narrow line around the Land of Immortality. The queen explained the wager that would decide the prince's fate.
        - id: ch05-b11
          speaker: immortal_queen
          text: I will throw the prince into the sky, all the way behind the morning star. If he lands inside this city, he is mine. If he falls beyond the walls, he belongs to you.
        - id: ch05-b12
          speaker: narrator
          text: They gathered in the great open square at the city's center, where the queen wanted the wager to take place. When everything was ready, she placed her foot beneath the prince's foot and swung him upward. Higher and higher he flew, all the way among the stars, until no human eye could follow him.
        - id: ch05-b13
          speaker: narrator
          text: The queen wondered anxiously whether she had thrown him straight. If not, he would land beyond the walls, and she would lose him forever. She and Death stood staring into the air. The moments stretched on as they waited to learn whose prize the prince would be. At last, they both saw a tiny speck no bigger than a wasp against the blue sky. Was he falling straight? No. Yes. Then, just as he neared the city, a light wind rose and pushed him toward the wall.
        - id: ch05-b14
          speaker: narrator
          text: One second more, and he would have landed halfway across the wall, with one half of him on either side. The queen sprang forward, caught him in her arms, and flung him safely into the castle. Then she ordered her servants to cast Death out of the city. They drove him away with such hard blows that he never dared show his face in the Land of Immortality again.
