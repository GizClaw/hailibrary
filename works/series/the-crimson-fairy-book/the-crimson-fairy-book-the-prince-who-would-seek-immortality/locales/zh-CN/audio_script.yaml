audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而带几分诙谐，像在讲一则古老的欧洲童话
        timbre: 温暖清亮
        pace: 舒缓，转折处有自然停顿
        pitch: 中音
    old_king:
      display_name: 老国王
      tts:
        delivery: 慈爱而忧心，劝说儿子时带着年迈君王的沉重
        timbre: 苍老浑厚
        pace: 舒缓
        pitch: 低音
    prince:
      display_name: 王子
      tts:
        delivery: 深思而执着，待人谦和，危急时果断有力
        timbre: 清朗沉稳
        pace: 中速
        pitch: 中音
    eagle_king:
      display_name: 鹰王
      tts:
        delivery: 豪爽亲切，带着长者般的自信与热忱
        timbre: 洪亮粗粝
        pace: 中速
        pitch: 中低音
    eagle_princess:
      display_name: 鹰王的女儿
      tts:
        delivery: 温柔诚挚，挽留与赠礼时情意深长
        timbre: 柔和明亮
        pace: 舒缓
        pitch: 中高音
    bald_king:
      display_name: 秃头国王
      tts:
        delivery: 爽直好客，谈起漫长岁月时轻松笃定
        timbre: 厚实开阔
        pace: 中速
        pitch: 中低音
    bald_princess:
      display_name: 秃头国王的女儿
      tts:
        delivery: 热情温婉，挽留客人时真诚恳切
        timbre: 清柔甜润
        pace: 中速
        pitch: 中高音
    countryman:
      display_name: 王子的同乡
      tts:
        delivery: 朴实直爽，回答简明
        timbre: 清晰温厚
        pace: 中速
        pitch: 中音
    mist_queen:
      display_name: 银雾女王
      tts:
        delivery: 端庄聪慧，议事时威严，待王子时温和真挚
        timbre: 清澈高雅
        pace: 从容
        pitch: 中音
    immortal_queen:
      display_name: 不死者女王
      tts:
        delivery: 威严仁厚，洞悉生死，危急时坚定果决
        timbre: 深沉明亮
        pace: 舒缓而有分量
        pitch: 中低音
    death:
      display_name: 死神
      tts:
        delivery: 冷硬执拗，索取猎物时咄咄逼人
        timbre: 阴冷苍老
        pace: 偏慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 王子的心事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个大王国。就在王国最中央，有一座城，城中有一座王宫，宫里住着一位国王。国王只有一个儿子。他认定自己的孩子比世上任何王子都聪明，也确实费尽心力教养他。王子年幼时，父亲为他精挑细选老师和教导官。长大以后，又让他四处游历，看看别人怎样生活，也学会承认人家的做法常常一样好。
        - id: ch01-b02
          speaker: narrator
          text: 王子回国已有一年。父亲觉得时机正好，该让他学习怎样治理这个终将属于他的国家。可漫长的游历过后，儿子竟像换了个人。从前那个快活开朗的少年，如今成天忧郁沉思。国王不知道什么事能让他变成这样，从早到晚都在烦恼。最后，他忽然想到了一个解释。年轻人准是爱上了谁。
        - id: ch01-b03
          speaker: narrator
          text: 可王子从不谈心事，平日也几乎不开口。父亲只好亲自问他。一天晚饭后，国王挽着儿子的手臂，把他带进一间挂满美人画像的屋子。画中姑娘一个比一个漂亮。
        - id: ch01-b04
          speaker: old_king
          text: 孩子，你总是闷闷不乐。也许在外面走过那么多地方，回家只陪着我这个老头儿，实在无聊。你该娶一位妻子。我把世上门第与你相称的美丽姑娘都找来了。选一个你喜欢的，我就派使臣去向她父亲求婚。
        - id: ch01-b05
          speaker: prince
          text: 唉，父王，我发愁不是为了爱情，也不是为了婚姻。我日日夜夜都在想，无论什么人，哪怕是国王，最终也会死。除非找到一个从来没有死亡的国度，我再也快乐不起来。我不会停下脚步，直到找到不死之国。
        - id: ch01-b06
          speaker: narrator
          text: 老国王听得心惊。事情比他猜想的还糟。他试着同儿子讲道理，又告诉他，自己盼了这么多年，就是想等他回来以后交出王位，也卸下压得人喘不过气的国事。可是任凭父亲怎样劝说，王子一句都不肯听。第二天一早，他系上佩剑，独自离开了家。
    - id: ch02
      title: 六百年与八百年
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 王子走了许多天，故国早已远在身后。这天，路边出现一棵参天大树。一只鹰坐在最高的枝头，拼命摇晃树枝。哪有鹰会做这种事？王子惊讶地停住了。鹰看见他，飞到地面，双脚刚一落地，就变成了一位国王。
        - id: ch02-b02
          speaker: eagle_king
          text: 你为什么这样吃惊？
        - id: ch02-b03
          speaker: prince
          text: 我不明白，你干吗把树枝摇得那么凶？
        - id: ch02-b04
          speaker: eagle_king
          text: 这是我的命运。我不把这棵树连根拔起，自己和所有亲族就都不会死。天已经晚了，今天的活儿到此为止。跟我回家，做我一晚的客人吧。
        - id: ch02-b05
          speaker: narrator
          text: 王子正又累又饿，便感激地答应了。到了王宫，鹰王美丽的女儿迎接他们，还立刻吩咐摆上晚餐。两人吃饭时，鹰王仔细问起客人的旅程，想知道他只是为了游玩而四处漂泊，还是另有特别的目的。王子便把离家以来的一切都说了，也讲出自己的心愿。他若找不到不死之国，绝不回头。
        - id: ch02-b06
          speaker: eagle_king
          text: 兄弟，你已经找到了！你肯留下，我真是再高兴不过。那棵大树不倒，死亡就碰不了我和我的亲族。要拔掉它，我还得苦干六百年。娶我的女儿吧，大家一起快活地生活。六百年，差不多就是永远了！
          emotion: happy
        - id: ch02-b07
          speaker: prince
          text: 国王，你的好意确实让人动心。可六百年以后，我们还是会死，那又有什么分别？我得继续走，去找一个永远没有死亡的地方。
        - id: ch02-b08
          speaker: narrator
          text: 鹰王的女儿也开口劝客人改变主意，王子却难过地摇了摇头。她劝了许久，终于看出王子的决心牢不可破，便走到柜子前，取出一只小匣子。匣子里面装着她自己的画像。
        - id: ch02-b09
          speaker: eagle_princess
          text: 王子，你既然不肯留下，就收下它，偶尔想起我们吧。如果还没找到不死之国，你已经走累了，只要打开匣子看看我的画像。它会带着你在地上或空中飞驰，像念头一样快，像旋风一样急。
        - id: ch02-b10
          speaker: narrator
          text: 王子谢过公主，把匣子仔细收进短上衣，又依依不舍地告别鹰王父女。世上再没有哪件礼物比这只匣子更实用。后来的路上，它帮了王子许多次。每逢这时，他都会感念公主当初的一片好意。
        - id: ch02-b11
          speaker: narrator
          text: 一天傍晚，匣子把他送上一座高山。山顶有个秃头男人，正一锹锹铲土装筐。筐满了，他便运走，再拿空筐回来接着装。王子看了一阵，男人抬头问他究竟在惊奇什么。
        - id: ch02-b12
          speaker: prince
          text: 我只是不明白，你为什么不停地往筐里装土？
        - id: ch02-b13
          speaker: bald_king
          text: 哦，我非做不可。这座山还没被我挖平以前，我和家人都不会死。不过天快黑了，今天不干了。
        - id: ch02-b14
          speaker: narrator
          text: 他随手摘下近旁的一片树叶，粗手粗脚的挖土人立刻变成了一位威严的秃头国王。
        - id: ch02-b15
          speaker: bald_king
          text: 跟我回去吧。你一定又累又饿，我女儿会为我们备好晚饭。
        - id: ch02-b16
          speaker: narrator
          text: 王子欣然同行。到了王宫，秃头国王的女儿已经等在门外。她比鹰王的女儿还要美丽，热情地把两人领进宽阔的大厅。那里有一张大餐桌，上面摆满了银盘。吃饭时，国王问王子怎么会游荡到这样遥远的地方。年轻人把自己的遭遇从头到尾说了一遍，也告诉国王，自己正在寻找不死之国。国王听罢，立刻笑了。
        - id: ch02-b17
          speaker: bald_king
          text: 你已经找到啦！我还要整整八百年，才能把大山削成平地。在那以前，我们一家谁也不会死。留下来娶我的女儿吧。能活八百年，总该够了。
        - id: ch02-b18
          speaker: prince
          text: 八百年的确很久。可我还是想去找那个根本没有死亡的国度。
        - id: ch02-b19
          speaker: narrator
          text: 第二天清晨，王子又要告辞。公主使出浑身解数央求他留下，却怎么也改变不了他的心意。最后，她只好送他一枚金戒指，留作纪念。这戒指比小匣子更神奇。只要心里想着某个地方，人马上就会出现在那里，连从空中飞过去的工夫都省了。王子诚心诚意地谢过公主，把戒指戴到手指上，继续前行。
    - id: ch03
      title: 世界尽头的女王
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 走了一段，王子想起那枚戒指，决定试试它是不是真有公主说的力量。他闭上眼睛许下愿望。
        - id: ch03-b02
          speaker: prince
          text: 我要到世界的尽头去。
        - id: ch03-b03
          speaker: narrator
          text: 再睁眼时，他已经站在一条满是大理石宫殿的街上。来往的男人个个高大强壮，衣着华美。王子用自己会的二十七种语言问他们城名，却没人回答。他的心顿时沉了下去。在谁也听不懂他说话的地方，该怎么办？忽然，他看见一个身穿故乡服饰的男人，赶紧跑过去，用母语发问。
        - id: ch03-b04
          speaker: prince
          text: 朋友，这座城叫什么？
        - id: ch03-b05
          speaker: countryman
          text: 这里是蓝王国的都城。国王已经去世，现在由他的女儿统治。
        - id: ch03-b06
          speaker: narrator
          text: 王子听了很满意，请同乡为自己指路，带他去见年轻的女王。他们穿过好几条街，来到一座大广场。广场的一侧立着辉煌的宫殿，仿佛被一排纤细的淡绿色大理石柱托在空中。宫前是一段台阶，女王就坐在那里。她身上笼着一层闪亮的银雾，一面倾听百姓申诉，一面为他们裁断是非。王子走近时，她一眼看出这个陌生人绝非寻常，便吩咐侍从长让其余请愿者今天先回去，又示意王子跟自己入宫。幸好女王从小就学过王子的语言，两人交谈起来毫无阻碍。
        - id: ch03-b07
          speaker: narrator
          text: 王子把经历和心愿全说了。女王听完，挽着他走到另一间屋门口。屋里满地都是针，一根紧挨一根，再也塞不进半根。
        - id: ch03-b08
          speaker: mist_queen
          text: 王子，你看见这些针了吗？我要用它们缝衣服，直到每一根都磨坏。在那以前，我和家人不会死。至少得花一千年。留下与我共享王位吧，活一千年还不够长吗？
        - id: ch03-b09
          speaker: prince
          text: 当然够长。可一千年到了，我依然会死。我非找到一个没有死亡的国度不可。
        - id: ch03-b10
          speaker: narrator
          text: 女王想尽办法挽留他，见一切都没用，终于放弃。临别时，她拿出一根小金棒。
        - id: ch03-b11
          speaker: mist_queen
          text: 你既然一定要走，就收下这根金棒，留作纪念。以后遇到难处，它能变成你想要的任何东西。
        - id: ch03-b12
          speaker: narrator
          text: 王子道谢，把金棒放进口袋，离开了都城。
    - id: ch04
      title: 空中之城
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 城市刚被抛在身后，一条无法渡过的宽阔河流便挡住去路。王子已经来到世界尽头，眼前正是那条环绕世界的大河。他不知道下一步该往哪里去，只好沿着河岸走了一会儿。抬头一看，头顶竟浮着一座美丽的城市。他渴望登上那座城，可四下既没有道路，也没有桥。那座城却像有一股力量，正牵着他向上。王子心里生出一个强烈的感觉，自己寻找的地方终于到了。
        - id: ch04-b02
          speaker: narrator
          text: 这时，王子想起银雾女王送的金棒。他心跳得厉害，把金棒扔在地上，一心一意希望它变成一座桥，心里却又害怕，这样的愿望会不会终究超出了金棒的力量。可他的担忧多余了。下一刻，地上的金棒消失，一架金梯出现在眼前，从河岸笔直通向空中之城。
        - id: ch04-b03
          speaker: narrator
          text: 王子刚要走进金色城门，一头从没见过的怪兽猛扑过来。他惊叫一声，向后跃开。
        - id: ch04-b04
          speaker: prince
          text: 宝剑，快出鞘！
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: 宝剑从鞘中跃出，斩落怪兽的几个脑袋。可脑袋刚掉，新的立刻又长出来。王子吓得面无血色，只得站在原地呼救，再把宝剑收回鞘中。
        - id: ch04-b06
          speaker: narrator
          text: 城中女王听见外面的喧闹，便从窗口向下看，看看到底出了什么事。她召来一名仆人，命他救下那个陌生人，再把人带到自己面前。王子感激地听从安排，随仆人进宫。女王一看见他，也立刻觉得这个人来历不凡。她亲切地欢迎王子，问他是什么原因来到了空中之城。王子又一次讲完自己的故事，说起自己怎样走过漫长遥远的道路，只为找到不死之国。女王听罢，终于给出他盼望已久的回答。
        - id: ch04-b07
          speaker: immortal_queen
          text: 你找到不死之国了。我掌管生命，也掌管死亡。留在这里，你就能和不死者一起生活。
        - id: ch04-b08
          speaker: narrator
          text: 王子从此留在城中。一千年飞快地过去了，在他的感觉中，却像只过了六个月。漫长的一千年里，他没有一刻不快乐。直到有天夜里，他在梦中见到了父亲和母亲。醒来以后，对故乡的思念一下子涌上心头。第二天一早，他告诉不死者女王，自己无论如何也得回去，再见父母一面。女王惊讶得久久盯着他。
        - id: ch04-b09
          speaker: immortal_queen
          text: 王子，你是不是糊涂了？你的父母已经去世八百多年，如今恐怕连一点尘土都没有留下！
          emotion: surprised
        - id: ch04-b10
          speaker: prince
          text: 就算这样，我也非去不可。
        - id: ch04-b11
          speaker: immortal_queen
          text: 那就别急着动身，等我先替你准备路上要用的东西。
        - id: ch04-b12
          speaker: narrator
          text: 女王知道已经留不住他，便用钥匙打开那只巨大的宝箱，从里面取出两个美丽的瓶子，一个是金的，一个是银的。她把两只瓶子都挂到王子颈上。接着，又带他走到房间的一个角落，让他看那里的一扇小活板门。
        - id: ch04-b13
          speaker: immortal_queen
          text: 把门下面的水装进银瓶。那水受过魔法，不管谁被洒到，都会立刻死去，哪怕已经活了一千年。金瓶要装那边井里的水。井水来自永恒之岩，只要往一具身体上洒几滴，即使死去一千年，也能重新活过来。
        - id: ch04-b14
          speaker: narrator
          text: 王子谢过女王，向她道别，踏上了归途。
    - id: ch05
      title: 三位故人醒来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 他很快回到银雾女王的都城。整座城已经面目全非，连从前走过的街道都难以辨认。王宫里静得出奇。王子走过一间又一间屋子，没有一个人出现，更没有谁上前阻拦。最后，他来到女王自己的寝殿。她手里还拿着绣活，正沉沉睡着。王子拉了拉她的衣裙，她毫无反应。一阵不祥的念头掠过心头，他急忙跑去查看那间从前铺满针的屋子。里面果然空空如也。
        - id: ch05-b02
          speaker: narrator
          text: 女王做手中绣活时折断了最后一根针，维系生命的魔法也随之破除。她已经死去。王子立刻拿出金瓶，洒了几滴水。女王轻轻一动，抬起头，睁开了眼睛。
        - id: ch05-b03
          speaker: mist_queen
          text: 亲爱的朋友，你叫醒了我，真叫人高兴。我一定睡了很久吧！
          emotion: happy
        - id: ch05-b04
          speaker: prince
          text: 要不是我来了，你会永远这样睡下去。
        - id: ch05-b05
          speaker: narrator
          text: 听到王子的话，女王想起了那些针。她终于明白，自己折断最后一根针以后已经死去，是王子赶到这里，让她重新活了过来。女王从心底感谢他所做的一切，并且发誓，日后只要有机会，一定报答这份恩情。
        - id: ch05-b06
          speaker: narrator
          text: 王子向女王告辞，接着前往秃头国王的领地。快到时，他发现整座山已经被挖得无影无踪。国王死在地上，铁锹和桶还静静放在身边。王子洒下金瓶里的水。水刚沾到国王，他就打着哈欠，伸展四肢，慢慢站了起来。
        - id: ch05-b07
          speaker: bald_king
          text: 亲爱的朋友，见到你太好了！我这一觉一定睡了很久吧！
          emotion: happy
        - id: ch05-b08
          speaker: prince
          text: 若不是我把你唤醒，你会一直睡到永远。
        - id: ch05-b09
          speaker: narrator
          text: 国王记起大山，也记起那个魔法。他同样许诺，有机会一定报答王子。
        - id: ch05-b10
          speaker: narrator
          text: 王子继续沿着通往故乡的旧路走。再往前，他发现那棵大树已经被连根拔起。鹰王死在树旁，双翼还向两边展开，仿佛下一刻就要振翅飞翔。王子把金瓶里的水滴到他身上。一阵轻颤从层层羽毛间掠过，鹰王终于从地面抬起了长喙。
        - id: ch05-b11
          speaker: eagle_king
          text: 哦，我这一觉睡得可真久！亲爱的好朋友，你把我叫醒了，我该怎样感谢你？
        - id: ch05-b12
          speaker: prince
          text: 如果我没有来，你也会永远睡下去。
        - id: ch05-b13
          speaker: narrator
          text: 鹰王想起那棵树，知道自己已经死过，也答应将来若有机会，必定报答王子的恩情。
    - id: ch06
      title: 死神追来
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 王子终于回到父亲王国的都城。可来到王宫原先矗立的地方，他才发现王宫早已消失。儿时玩耍的大理石长廊所在之处，如今只剩一片巨大的硫黄湖，蓝色火焰不断从湖面蹿向天空。父母若沉在这片可怕的水底，他该怎么找到他们，又怎么让他们复活？王子悲伤地转过身，在街上漫无目的地走着，连自己要去哪里也不知道。忽然，背后有人叫住了他。
        - id: ch06-b02
          speaker: death
          text: 站住，王子！我总算抓到你了。我找了你整整一千年！
        - id: ch06-b03
          speaker: narrator
          text: 他回头一看，身旁站着一个白胡子老人。那正是死神。王子立刻褪下金戒指。鹰王、秃头国王和银雾女王马上赶到，三人合力抓住死神，把他牢牢按住，让王子有时间逃进不死之国。
        - id: ch06-b04
          speaker: narrator
          text: 可他们不知道死神飞得有多快。王子才把一只脚跨过边界，另一只脚就被死神从后面抓住。
        - id: ch06-b05
          speaker: death
          text: 别动！这回你归我了。
        - id: ch06-b06
          speaker: narrator
          text: 不死者女王正在窗口观望。她高声喝令死神离开，因为在她的国度里，死神没有任何权力，只能到别处寻找猎物。
        - id: ch06-b07
          speaker: death
          text: 说得没错。可是他还有一只脚留在我的国度，那只脚就归我！
        - id: ch06-b08
          speaker: immortal_queen
          text: 可他至少有一半归我。你要另外半个人又能做什么？半个人对你我都没有用。这一次，我准你跨过边界。我们打个赌，看看他究竟该归谁。
        - id: ch06-b09
          speaker: narrator
          text: 死神同意了，跨过围绕不死之国的狭窄界线。女王随即说出赌法。
        - id: ch06-b10
          speaker: immortal_queen
          text: 我把王子抛上天空，一直抛到晨星背后。他若落进这座城，就归我。要是落在城墙外，便归你。
    - id: ch07
      title: 晨星背后的赌局
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 城中央有一座宽阔的露天广场，女王决定就在这里举行赌局。等一切都准备妥当，她把脚伸到王子脚下，用力一挑，将他抛向高空。王子越升越高，一直飞进群星之间。地面上的人再也看不见他，谁的眼睛都追不上了。
        - id: ch07-b02
          speaker: narrator
          text: 女王焦急地想，自己是否把他笔直抛了上去。只要稍有偏斜，王子就会落到城墙外，她将永远失去他。女王和死神仰头等着，看王子最终属于谁。每一刻都显得格外漫长。
        - id: ch07-b03
          speaker: narrator
          text: 忽然，两人同时发现蓝天高处有个小黑点，还没有黄蜂大。他落得笔直吗？不！是的！眼看王子越来越近，一阵微风却突然把他推向城墙。再过一瞬，他就要半身掉在墙外。
        - id: ch07-b04
          speaker: narrator
          text: 就在这千钧一发的时刻，女王猛地跃上前，把王子稳稳接进怀中，又立刻将他抛进城堡。赌局有了结果。随后，她命仆人把死神赶出城去。仆人照办了，一边驱赶，一边狠狠揍他。那些拳脚让死神牢牢记住了教训。从此以后，他再也不敢在不死之国露面。
