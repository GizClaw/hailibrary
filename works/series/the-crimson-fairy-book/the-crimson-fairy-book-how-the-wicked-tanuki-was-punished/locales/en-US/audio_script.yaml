audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and storylike
        timbre: clear and mellow
        pace: measured
        pitch: medium
    tanuki:
      display_name: The Tanuki
      tts:
        delivery: clever, proud, and increasingly sly
        timbre: rough and earthy
        pace: steady
        pitch: medium-low
    fox:
      display_name: The Fox
      tts:
        delivery: clever, practical, and warm
        timbre: smooth and bright
        pace: steady
        pitch: medium
    little_tanuki:
      display_name: The Little Tanuki
      tts:
        delivery: young, watchful, and determined
        timbre: clear and light
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Last Three in the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The hunters had searched the wood for so many years that no wild animals seemed to be left. A person could walk from one end to the other without seeing a hare, a deer, or a boar. Even the doves no longer cooed in their nests. Any creatures that had not been killed had gone somewhere else.
        - id: ch01-b02
          speaker: narrator
          text: Only three remained. They were hidden deep in the thickest forest, high on the mountain. There lived a grey, long-tailed tanuki, his wife the fox, who belonged to his own family, and their little son.
        - id: ch01-b03
          speaker: narrator
          text: The fox and the tanuki were clever and cautious, and both knew magic. That was how they had escaped the fate of their unfortunate friends. Whenever they heard an arrow twang or saw a spear flash, even far away, they stayed perfectly still. They would not leave their hiding place, no matter how hungry they were or how tempting the game looked.
        - id: ch01-b04
          speakers: [tanuki, fox]
          ensemble: duo
          text: We are not foolish enough to risk our lives.
        - id: ch01-b05
          speaker: narrator
          text: They said this proudly to each other. But at last, even all their care could not save them from hunger. There was no food left, and they seemed likely to starve. They had to do something, though neither knew what.
        - id: ch01-b06
          speaker: narrator
          text: Then the tanuki suddenly had an idea.
        - id: ch01-b07
          speaker: tanuki
          text: I have a plan! I'll pretend to be dead. You can turn yourself into a man and take me to the village to sell. Someone will buy me because tanuki skins are always wanted. Use the money for food and come home. I'll find a way to escape, so don't worry about me.
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: The fox laughed with delight and rubbed her paws together.
        - id: ch01-b09
          speaker: fox
          text: Good! Next time I'll go, and you can sell me.
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: She changed herself into a man, lifted the tanuki's stiff body, and started toward the village. She found him rather heavy, but there was no other safe way. She could not let him walk through the wood and risk being seen by someone.

    - id: ch02
      title: The Tanuki's Escape
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Just as the tanuki had predicted, plenty of people wanted to buy him. The fox listened to their offers and handed him to the person who promised the highest price. Then she hurried away to buy food with the money.
        - id: ch02-b02
          speaker: narrator
          text: The buyer carried the tanuki home, threw him into a corner, and went out. As soon as he was alone, the tanuki crept carefully through a crack in the window. He thought how lucky he was not to be a fox, since he could climb.
        - id: ch02-b03
          speaker: narrator
          text: Once outside, he hid in a ditch until dusk. Then he raced back into the forest.
        - id: ch02-b04
          speaker: narrator
          text: While the food lasted, the three of them were as happy as kings. They had escaped danger and had plenty to eat. But the day soon came when their store of food was just as empty as before.
        - id: ch02-b05
          speaker: fox
          text: Now it is my turn to pretend I'm dead.
        - id: ch02-b06
          speaker: narrator
          text: The tanuki changed himself into a peasant and set out for the village with his wife's body over his shoulder. Soon a buyer stepped forward.
        - id: ch02-b07
          speaker: narrator
          text: While they bargained, a wicked thought came to the tanuki. If the fox were gone, there would be more food for him and his son. As he slipped the money into his pocket, he spoke quietly to the buyer.
        - id: ch02-b08
          speaker: tanuki
          text: This fox isn't truly dead. Be careful, or she may run away from you.
        - id: ch02-b09
          speaker: narrator
          text: The man needed no second warning. He struck the poor fox on the head and killed her. The wicked tanuki smiled and walked to the nearest shop.

    - id: ch03
      title: The Little Tanuki Learns the Truth
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The tanuki had once been very fond of his little son. But after betraying his wife, he seemed to change in an instant. He would not give the boy even one bite of food.
        - id: ch03-b02
          speaker: narrator
          text: The poor little tanuki would have starved if he had not found nuts and berries for himself. Still, he waited day after day, always hoping his mother would return.
        - id: ch03-b03
          speaker: narrator
          text: In time, he began to understand the truth about his mother. He was careful not to let the old tanuki notice. Inside, though, he turned one plan after another over in his mind. From morning until night, he wondered how he could best avenge her.
        - id: ch03-b04
          speaker: narrator
          text: One morning, while he sat beside his father, he suddenly remembered that his mother had taught him all her magic. He could cast spells as well as his father, and perhaps even better.
        - id: ch03-b05
          speaker: little_tanuki
          text: I am every bit as good a wizard as you are.
        - id: ch03-b06
          speaker: narrator
          text: A cold chill passed through the old tanuki when he heard that. He laughed and acted as though it were a joke, but his son would not give way. At last, the father suggested a wager.

    - id: ch04
      title: The Wager at the Bridge
      blocks:
        - id: ch04-b01
          speaker: tanuki
          text: Take any shape you want, and I promise I will recognize you. I'll wait on the bridge over the river, along the road to the village. Change yourself into anything at all. No disguise will fool me.
        - id: ch04-b02
          speaker: narrator
          text: The little tanuki accepted the wager and went down the road his father had shown him. But he did not change his shape at all. Instead, he hid in a corner of the bridge where he could watch without being seen.
        - id: ch04-b03
          speaker: narrator
          text: Before long, his father arrived and stood near the middle of the bridge. Soon afterward, the king came along with his guards and his whole court behind him.
        - id: ch04-b04
          speaker: tanuki
          text: Ah, he thinks I won't recognize him now that he has turned himself into a king.
        - id: ch04-b05
          speaker: narrator
          text: The king passed in a splendid carriage carried by his servants. The old tanuki leaped onto it.
        - id: ch04-b06
          speaker: tanuki
          text: I have won our wager! You cannot fool me!
        - id: ch04-b07
          speaker: narrator
          text: But the old tanuki had fooled himself. The soldiers thought he was attacking their king. They seized him by the legs and hurled him into the river, where the water closed over him.

    - id: ch05
      title: His Mother Avenged
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The little tanuki saw everything and rejoiced because his mother's death had been avenged.
        - id: ch05-b02
          speaker: narrator
          text: Then he returned to the forest. If he has not found it too lonely there, he is probably living in it still.
