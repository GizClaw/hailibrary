audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    tanuki:
      display_name: 老狸
      tts:
        delivery: 起初谨慎自负，后来阴狠贪婪，受惊时强装镇定
        timbre: 略显沙哑
        pace: 中速
        pitch: 中低音
    fox:
      display_name: 狐狸
      tts:
        delivery: 聪慧爽快，对家人亲切信任
        timbre: 柔和明亮
        pace: 轻快
        pitch: 中高音
    little_tanuki:
      display_name: 小狸
      tts:
        delivery: 年幼机敏，心事藏得很深，说话简短坚定
        timbre: 清亮稚嫩
        pace: 中速
        pitch: 高音
  chapters:
    - id: ch01
      title: 山林里的最后一家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 猎人年年进山捕猎。到后来，整座森林静得可怕。从这头走到那头，看不见野兔、鹿和野猪，也听不到巢里鸽子的叫声。那些野兽不是死了，就是逃去了别处。
        - id: ch01-b02
          speaker: narrator
          text: 山上最浓密、最隐蔽的林子里，只剩下了一家三口。一只是灰毛长尾的狸，一只是与他同族的妻子狐狸，还有他们的小儿子。
        - id: ch01-b03
          speaker: narrator
          text: 夫妻俩很聪明，也十分谨慎，还会法术。远处只要弓弦一响，或有长矛闪了一下，他们马上伏低身子，再也不动。无论肚子多饿，外面的猎物多诱人，他们也绝不离开藏身之处。
        - id: ch01-b04
          speaker: tanuki
          text: 我们可没那么傻，不会拿命去冒险。
        - id: ch01-b05
          speaker: narrator
          text: 可是，森林里终于连一点食物也找不到了。再谨慎也填不饱肚子，一家三口眼看就要饿死。必须想个办法，可他们谁也没有主意。
        - id: ch01-b06
          speaker: narrator
          text: 忽然，狸想出了一条计策，高兴地叫住妻子。
        - id: ch01-b07
          speaker: tanuki
          text: 我有办法了！我躺下装死，你变成一个男人，把我拿到村里去卖。狸皮总有人买。你用那些钱买好食物，就回家等我。我会自己逃出来，别担心。
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: 狐狸听得直笑，两只前爪满意地搓在一起。
        - id: ch01-b09
          speaker: fox
          text: 好呀。下一次换我装死，你也把我卖掉。
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: 她随即变成一个男人，抱起丈夫僵硬的身子，往村里走去。狸很重，可要是让他自己穿过树林，很可能被人看见，只能一路抱着。

    - id: ch02
      title: 两场买卖
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 村里果然有许多人想买狸皮。狐狸挑了出价最高的买主，收下钱，赶紧去买食物。买主把狸带回家，随手扔进墙角，便出了门。
        - id: ch02-b02
          speaker: narrator
          text: 屋里一没人，狸就从窗缝里悄悄爬了出去。他一边爬，一边庆幸自己不是狐狸，还能攀着窗子逃走。到了外面，他先藏进沟里，等天黑以后才飞快地跑回森林。
        - id: ch02-b03
          speaker: narrator
          text: 有东西吃的那些日子，一家三口快活得像国王。可食物很快又吃光了，贮藏食物的地方重新变得空空荡荡。
        - id: ch02-b04
          speaker: fox
          text: 这次轮到我装死了！
        - id: ch02-b05
          speaker: narrator
          text: 狸变成农夫，把妻子的身体扛在肩上，走向村庄。不一会儿，就有人来买狐狸。两个人正讲价钱时，一个恶毒的念头钻进狸的心里。要是狐狸死了，食物就能多留给他和儿子。
        - id: ch02-b06
          speaker: narrator
          text: 狸收好钱，又凑近买主，压低声音开了口。
        - id: ch02-b07
          speaker: tanuki
          text: 这只狐狸没有真死。你可得看牢一点，不然她会逃走。
        - id: ch02-b08
          speaker: narrator
          text: 买主立刻明白了。他朝可怜的狐狸头上重重打了一下，她就这样死了。狠心的狸却笑着走进最近的店铺。
        - id: ch02-b09
          speaker: narrator
          text: 从前，狸很疼爱儿子。可出卖妻子以后，他一下子变了，连一口食物也不肯给孩子。小狸只好自己寻找坚果和浆果，这才没有饿死。他仍旧天天等着，总盼着母亲回家。

    - id: ch03
      title: 小狸的计策
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 日子一天天过去，小狸渐渐猜到了真相。他没有让父亲看出异样，心里却从早想到晚，反复琢磨怎样替母亲报仇。
        - id: ch03-b02
          speaker: narrator
          text: 一天早晨，他和父亲坐在一起，猛然记起一件事。母亲已经把所有法术都教给了他。论起变化的本领，他不但不输父亲，或许还要胜过父亲。
        - id: ch03-b03
          speaker: little_tanuki
          text: 我的法术跟你一样好。
        - id: ch03-b04
          speaker: narrator
          text: 老狸听了，背上顿时一阵发冷。他却哈哈大笑，装作只把这话当成孩子的玩笑。小狸始终不肯改口。争到最后，父亲提出，要跟他打一个赌。
        - id: ch03-b05
          speaker: tanuki
          text: 你随便变，想变成什么都行，我一定能认出你。我会在通往村庄的河桥上等着。无论你怎样乔装，都瞒不过我的眼睛。
        - id: ch03-b06
          speaker: narrator
          text: 小狸答应了，沿父亲指的路向桥边走去。他并没有施法变成别的东西，只藏进桥的一角。那里正好能看清外面，别人却发现不了他。

    - id: ch04
      title: 桥上的惩罚
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 小狸刚藏好不久，父亲便来到桥中央。又过了一会儿，国王坐着华丽的轿子经过，抬轿的是仆人，身后还跟着一队卫兵和满朝臣子。
        - id: ch04-b02
          speaker: narrator
          text: 老狸一看见国王，马上以为儿子变成了这副模样。
        - id: ch04-b03
          speaker: tanuki
          text: 原来你变成了国王，以为这样我就认不出来！
        - id: ch04-b04
          speaker: narrator
          text: 他纵身跳上轿子，对着国王大叫。
        - id: ch04-b05
          speaker: tanuki
          text: 这场赌是我赢了，你骗不了我！
        - id: ch04-b06
          speaker: narrator
          text: 老狸以为自己识破了骗局，真正骗倒他的却是他自己。士兵看见他扑上国王的轿子，以为国王遭到袭击，立刻抓住他的双腿，把他扔进河里。水面从老狸头顶合上，再也看不见他了。
        - id: ch04-b07
          speaker: narrator
          text: 小狸躲在桥边，看见了这一切。母亲的仇终于报了，他心中十分欢喜。随后，他独自回到森林。要是没有觉得那里太寂寞，想必直到今天，他仍住在那片林子里。
