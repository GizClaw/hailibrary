  chapters:
    - id: ch01
      title: A New Wife for Abu Nowas
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man named Abu Nowas. He was a great favorite of the Sultan, whose palace stood in the same town where Abu Nowas lived.
        - id: ch01-b02
          speaker: narrator
          text: One day Abu Nowas went to the palace. He entered the great hall weeping and came before the Sultan, who was seated there.
        - id: ch01-b03
          speaker: abu_nowas
          text: Oh, mighty Sultan, my wife has died.
          emotion: sad
        - id: ch01-b04
          speaker: sultan
          text: That is terrible news. We must find you another wife.
        - id: ch01-b05
          speaker: narrator
          text: The Sultan immediately told his Grand Vizir to send for the Sultana. When she entered the hall, the Sultan explained why Abu Nowas had come to them in tears.
        - id: ch01-b06
          speaker: sultan
          text: Poor Abu Nowas has lost his wife.
        - id: ch01-b07
          speaker: sultana
          text: Then we must find him another. I know a girl who will suit him perfectly.
        - id: ch01-b08
          speaker: narrator
          text: The Sultana clapped her hands, and a maiden appeared before her.
        - id: ch01-b09
          speaker: sultana
          text: I have found a husband for you.
        - id: ch01-b10
          speaker: maiden
          text: Who is he?
        - id: ch01-b11
          speaker: sultana
          text: Abu Nowas, the jester.
        - id: ch01-b12
          speaker: maiden
          text: I will marry him.
        - id: ch01-b13
          speaker: narrator
          text: Abu Nowas raised no objection, so the marriage was arranged then and there. The Sultana had the loveliest clothes made for the bride. The Sultan provided Abu Nowas with a wedding suit, added a thousand gold pieces, and gave the couple soft carpets for their house.
        - id: ch01-b14
          speaker: narrator
          text: Abu Nowas took his wife home, and for a while they were very happy. They spent the Sultan's money freely and never wondered what they would do when it was gone.

    - id: ch02
      title: Two False Funerals
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: But of course the money did run out. Then they had to sell their beautiful things one by one. In the end, each of them had only a cloak, and they shared one blanket to cover themselves.
        - id: ch02-b02
          speaker: abu_nowas
          text: Our whole fortune is gone. What can we do now? I dare not go back to the Sultan. He may have his servants throw me out. You should go to your mistress instead. Fall at her feet and weep. Perhaps she will help us.
        - id: ch02-b03
          speaker: maiden
          text: You should go. I wouldn't know what to tell her.
        - id: ch02-b04
          speaker: abu_nowas
          text: All right, stay here. I'll ask to see the Sultan. I'll sob and tell him my wife has died, and that I cannot pay to bury her. Perhaps he'll give us something when he hears that.
        - id: ch02-b05
          speaker: maiden
          text: Yes, that should work.
        - id: ch02-b06
          speaker: narrator
          text: Abu Nowas set off. The Sultan was in the hall of justice when he arrived. Abu Nowas had rubbed pepper into his eyes, so tears poured down his face. His eyes stung so badly that he could hardly walk straight, and everyone wondered what had happened.
        - id: ch02-b07
          speaker: sultan
          text: Abu Nowas! What has happened to you?
          emotion: surprised
        - id: ch02-b08
          speaker: abu_nowas
          text: Oh, noble Sultan, my wife is dead.
          emotion: sad
        - id: ch02-b09
          speaker: sultan
          text: We must all die.
        - id: ch02-b10
          speaker: narrator
          text: That was certainly not the answer Abu Nowas had hoped to hear. Even so, the Sultan's cool response did not embarrass or discourage him.
        - id: ch02-b11
          speaker: abu_nowas
          text: That is true, O Sultan. But I have no shroud for her and no money for her burial.
        - id: ch02-b12
          speaker: sultan
          text: Grand Vizir, give him a hundred gold pieces.
        - id: ch02-b13
          speaker: narrator
          text: The Grand Vizir counted out the money. Abu Nowas bowed very low and left the hall. The pepper still made his tears flow, but now he had joy in his heart as well.
        - id: ch02-b14
          speaker: maiden
          text: Did you get anything?
        - id: ch02-b15
          speaker: narrator
          text: His wife had been waiting anxiously. Abu Nowas tossed the bag down before her.
        - id: ch02-b16
          speaker: abu_nowas
          text: A hundred gold pieces. But they won't last long. Now you must dress in sackcloth and mourning clothes and go to the Sultana. Tell her your husband, Abu Nowas, is dead and you have no money to bury him. She is sure to ask what happened to all our money and wedding clothes. Tell her I sold everything before I died.
        - id: ch02-b17
          speaker: narrator
          text: His wife did exactly as he said. She wrapped herself in sackcloth and went to the Sultana's own palace. She had once been one of Subida's favorite attendants, so everyone knew her and the servants readily admitted her to the private rooms.
        - id: ch02-b18
          speaker: sultana
          text: What is wrong?
        - id: ch02-b19
          speaker: maiden
          text: My husband is lying dead at home. He spent all our money and sold everything we owned. Now I have nothing to bury him with.
          emotion: sad
        - id: ch02-b20
          speaker: narrator
          text: Subida picked up a purse that held two hundred gold pieces.
        - id: ch02-b21
          speaker: sultana
          text: Your husband served us faithfully for many years. Make sure he has a splendid funeral.
        - id: ch02-b22
          speaker: narrator
          text: Abu Nowas's wife accepted the purse and kissed the Sultana's feet. Then she hurried home, no longer sorrowful at all, but full of joy.

    - id: ch03
      title: The Sultan and Sultana Disagree
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: For several happy hours, the couple planned all the ways they might spend the new money. The more they talked, the cleverer their two tricks seemed to them.
        - id: ch03-b02
          speaker: abu_nowas
          text: When the Sultan visits Subida tonight, she'll tell him Abu Nowas is dead. He'll say, "No, it was his wife." Then they'll argue while we sit here enjoying ourselves. Oh, how angry they would be if they knew!
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: That evening, when the day's business was over, the Sultan went to Subida's palace for his usual visit, just as Abu Nowas had expected. The Sultana told him her news as soon as he entered the room.
        - id: ch03-b04
          speaker: sultana
          text: Poor Abu Nowas is dead!
          emotion: sad
        - id: ch03-b05
          speaker: sultan
          text: Abu Nowas isn't dead. His wife is.
        - id: ch03-b06
          speaker: sultana
          text: No, you have it completely wrong. His wife came here herself only a few hours ago. She said he had spent all their money, so I gave her enough to bury him.
        - id: ch03-b07
          speaker: sultan
          text: You must have dreamed it. Soon after noon, Abu Nowas came to the hall with tears streaming from his eyes. He told me his wife had died. They had sold everything, and he couldn't afford even a shroud for her, much less a burial.
        - id: ch03-b08
          speaker: narrator
          text: The Sultan and Sultana went on arguing for a long time. Neither one would listen to the other. At last, the Sultan called for his door-keeper and ordered him to go immediately to Abu Nowas's house. The man was to see for himself whether Abu Nowas or his wife had died.
        - id: ch03-b09
          speaker: narrator
          text: Abu Nowas and his wife happened to be sitting behind a latticed window that faced the street. When he saw the door-keeper coming, Abu Nowas leaped up.
        - id: ch03-b10
          speaker: abu_nowas
          text: The Sultan's door-keeper is coming! They've sent him to learn the truth. Quick, lie on the bed and pretend you're dead.
        - id: ch03-b11
          speaker: narrator
          text: In a moment, his wife lay stiff on the bed with a linen sheet covering her like a corpse. She had only just settled into place when the door opened and the door-keeper stepped inside.
        - id: ch03-b12
          speaker: door_keeper
          text: Has something happened here?
        - id: ch03-b13
          speaker: abu_nowas
          text: My poor wife is dead. Look, she is lying right here.
          emotion: sad
        - id: ch03-b14
          speaker: narrator
          text: The door-keeper went to the bed in the corner and saw the stiff shape beneath the sheet.
        - id: ch03-b15
          speaker: door_keeper
          text: We must all die.
        - id: ch03-b16
          speaker: narrator
          text: With that, the door-keeper left the house and returned to the palace to report to the Sultan.
        - id: ch03-b17
          speaker: sultan
          text: Well, did you find out which one is dead?
        - id: ch03-b18
          speaker: door_keeper
          text: Yes, noble Sultan. The wife is dead.
        - id: ch03-b19
          speaker: sultana
          text: He only says that to please you!
          emotion: angry
        - id: ch03-b20
          speaker: narrator
          text: Subida angrily called for her chamberlain. She commanded him to visit Abu Nowas's house at once and discover which of the two had died.
        - id: ch03-b21
          speaker: sultana
          text: Be sure you tell us the truth, or you will suffer for it.
          emotion: angry

    - id: ch04
      title: Abu Nowas Takes His Turn
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: As the chamberlain approached the house, Abu Nowas spotted him.
        - id: ch04-b02
          speaker: abu_nowas
          text: The Sultana's chamberlain is coming! Now it's my turn to die. Hurry and spread the sheet over me.
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: Abu Nowas lay down on the bed. When the chamberlain entered, Abu Nowas held his breath. His wife was in tears.
        - id: ch04-b04
          speaker: chamberlain
          text: Why are you crying?
        - id: ch04-b05
          speaker: maiden
          text: My husband is dead.
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: She pointed toward the bed. The chamberlain drew back the sheet and looked at Abu Nowas, who lay stiff and motionless. Then the chamberlain gently replaced the sheet and went back to the palace.
        - id: ch04-b07
          speaker: sultan
          text: Well, have you found out this time?
        - id: ch04-b08
          speaker: chamberlain
          text: My lord, the husband is dead.
        - id: ch04-b09
          speaker: sultan
          text: But he was standing before me only a few hours ago! I will know the truth before I go to sleep. Bring my golden coach around at once!
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: Five minutes later, the golden coach stood ready at the palace door. The Sultan and Sultana both climbed in and set out for Abu Nowas's house.

    - id: ch05
      title: The Truth Worth a Thousand Gold Pieces
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Abu Nowas had stopped playing dead and was watching the street. Then he saw the golden coach coming.
        - id: ch05-b02
          speaker: abu_nowas
          text: Quick, quick! The Sultan will be here any moment. We must both be dead when he arrives.
        - id: ch05-b03
          speaker: narrator
          text: Abu Nowas and his wife lay down side by side. They spread the sheet over themselves and held their breath. At that very moment, the Sultan entered the house. The Sultana and her chamberlain followed him inside. The Sultan went straight to the bed and found what looked like two stiff, motionless corpses.
        - id: ch05-b04
          speaker: sultan
          text: I would give a thousand gold pieces to anyone who could tell me the truth about this!
        - id: ch05-b05
          speaker: narrator
          text: At once, Abu Nowas sat up and held out his hand.
        - id: ch05-b06
          speaker: abu_nowas
          text: Then give the gold to me. You won't find anyone who needs it more.
        - id: ch05-b07
          speaker: sultan
          text: Oh, Abu Nowas, you shameless rascal! I should have known this was one of your tricks!
          emotion: happy
        - id: ch05-b08
          speaker: narrator
          text: The Sultan burst into laughter, and the Sultana could not help joining him. Abu Nowas had fooled them both. Still, the Sultan kept his word and sent him the thousand gold pieces he had promised. Let us hope that this fortune did not fly away as quickly as the last one.
