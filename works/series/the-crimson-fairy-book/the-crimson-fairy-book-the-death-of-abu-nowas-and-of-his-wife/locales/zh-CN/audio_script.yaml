audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    abu_nowas:
      display_name: 阿布·努瓦斯
      tts:
        delivery: 机敏善演，顽皮中透着厚脸皮
        timbre: 温暖灵活
        pace: 明快
        pitch: 中音
    sultan:
      display_name: 苏丹
      tts:
        delivery: 威严直率，也容易被逗笑
        timbre: 洪亮浑厚
        pace: 从容
        pitch: 中低音
    sultana:
      display_name: 苏丹后苏比达
      tts:
        delivery: 自信爽利，慷慨中带着不容置疑
        timbre: 丰润清晰
        pace: 从容
        pitch: 中音
    maiden:
      display_name: 阿布·努瓦斯的妻子
      tts:
        delivery: 直爽配合，装哭时认真卖力
        timbre: 柔和明亮
        pace: 中速
        pitch: 中高音
    door_keeper:
      display_name: 苏丹的守门人
      tts:
        delivery: 忠于职守，说话朴实
        timbre: 清楚坚实
        pace: 中速
        pitch: 中低音
    chamberlain:
      display_name: 苏丹后的内侍
      tts:
        delivery: 谨慎恭敬，回话一丝不苟
        timbre: 平稳柔和
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 苏丹为弄臣娶妻
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个名叫阿布·努瓦斯的人，深得本国苏丹宠爱。他和苏丹的宫殿住在同一座城里。一天，苏丹正坐在宫中大厅，阿布·努瓦斯忽然哭着走了进来。
        - id: ch01-b02
          speaker: abu_nowas
          text: 威严的苏丹啊，我的妻子死了。
          emotion: sad
        - id: ch01-b03
          speaker: sultan
          text: 这可真是不幸。我得替你再娶一个妻子。
        - id: ch01-b04
          speaker: narrator
          text: 苏丹马上命大维齐尔请来苏丹后，告诉她阿布·努瓦斯刚刚失去了妻子。
        - id: ch01-b05
          speaker: sultana
          text: 那我们得给他另找一个。我这里正有个姑娘，配他再合适不过。
        - id: ch01-b06
          speaker: narrator
          text: 苏丹后用力拍了拍手。一位少女听见信号，立刻出来站到她面前。
        - id: ch01-b07
          speaker: sultana
          text: 我替你找了个丈夫。
        - id: ch01-b08
          speaker: maiden
          text: 他是谁？
        - id: ch01-b09
          speaker: sultana
          text: 就是弄臣阿布·努瓦斯。
        - id: ch01-b10
          speaker: maiden
          text: 我愿意嫁给他。
        - id: ch01-b11
          speaker: narrator
          text: 阿布·努瓦斯也没有异议，婚事就这样定下了。苏丹后命人为新娘缝制最漂亮的衣裳。苏丹把自己的结婚礼服送给新郎，又添上一千枚金币，还送了几张柔软的地毯，给他们铺在家里。
        - id: ch01-b12
          speaker: narrator
          text: 阿布·努瓦斯把妻子领回家，两人快活地过了一阵。他们花起苏丹送的钱来毫不吝惜，谁也没想过钱总有花完的一天，更没想过那时该到哪里再弄钱。

    - id: ch02
      title: 两场假丧事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可那些金币终究还是花光了。两人只好把华美的东西一件一件卖掉。到了最后，屋里已经没有什么可卖的了。每人身上只剩一件斗篷，夜里还得合盖一条毯子。
        - id: ch02-b02
          speaker: abu_nowas
          text: 我们的家当全没了，现在怎么办？我不敢再去见苏丹，他也许会叫仆人把我赶出去。还是你回去找女主人吧。你伏在她脚下哭一场，她说不定会帮我们。
        - id: ch02-b03
          speaker: maiden
          text: 还是你去吧。我见了她，根本不知道该说什么。
        - id: ch02-b04
          speaker: abu_nowas
          text: 好，那你留在家里。我去求见苏丹，哭着说妻子死了，我连安葬她的钱都没有。苏丹听完，或许会赏我们一点儿。
        - id: ch02-b05
          speaker: maiden
          text: 对，这办法不错。
        - id: ch02-b06
          speaker: narrator
          text: 阿布·努瓦斯出门去了。苏丹正在司法大厅里，他先把胡椒揉进眼睛，这才走进去。泪水不停往下淌，眼睛又辣又疼，害得他连路都快走不直了。人人都在猜他出了什么事。
        - id: ch02-b07
          speaker: sultan
          text: 阿布·努瓦斯！你这是怎么了？
          emotion: surprised
        - id: ch02-b08
          speaker: abu_nowas
          text: 尊贵的苏丹啊，我的妻子死了。
          emotion: sad
        - id: ch02-b09
          speaker: sultan
          text: 人人都有一死。
        - id: ch02-b10
          speaker: narrator
          text: 这可不是阿布·努瓦斯盼着听到的回答。不过，他一点儿也没觉得难堪，马上接着说下去。
        - id: ch02-b11
          speaker: abu_nowas
          text: 您说得对，苏丹陛下。可是我没有寿衣裹她，也拿不出安葬她的钱。
        - id: ch02-b12
          speaker: sultan
          text: 大维齐尔，给他一百枚金币。
        - id: ch02-b13
          speaker: narrator
          text: 金币数好以后，阿布·努瓦斯深深鞠了一躬，退出大厅。胡椒还在催着他流泪，心里却已经乐开了花。
        - id: ch02-b14
          speaker: maiden
          text: 你拿到什么了吗？
        - id: ch02-b15
          speaker: narrator
          text: 妻子一直在焦急地等他。阿布·努瓦斯把钱袋往她面前一放。
        - id: ch02-b16
          speaker: abu_nowas
          text: 一百枚金币。不过，这些钱也撑不了多久。现在该你去了。你穿上麻衣和丧服，告诉苏丹后，丈夫阿布·努瓦斯死了，你没钱安葬他。她准会问，成婚时送我们的钱和漂亮衣裳去了哪里。你就说，我临死前把一切都卖了。
        - id: ch02-b17
          speaker: narrator
          text: 妻子完全照他说的办了。她把自己裹在麻衣里，去了苏丹后自己的宫殿。她从前是苏比达最宠爱的侍女之一，宫里人都认识她，所以一路没人阻拦，很快就把她领进了内殿。
        - id: ch02-b18
          speaker: sultana
          text: 你怎么这副模样？出了什么事？
        - id: ch02-b19
          speaker: maiden
          text: 我的丈夫死在家里。他把钱都花光了，东西也全卖了。我什么也没剩下，连安葬他都办不到。
          emotion: sad
        - id: ch02-b20
          speaker: narrator
          text: 苏比达拿起一个装着两百枚金币的钱袋。
        - id: ch02-b21
          speaker: sultana
          text: 你丈夫忠心为我们效劳了多年。一定要让他风风光光地下葬。
        - id: ch02-b22
          speaker: narrator
          text: 妻子收下钱，俯身吻了苏丹后的脚。来的时候，她还是一副愁惨的模样。离开的时候，她却已经满心欢喜，脚步匆匆地赶回家去。

    - id: ch03
      title: 苏丹和苏丹后争执
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两人兴高采烈地盘算了好几个钟头，想着怎样花这笔钱，也越想越觉得自己聪明。
        - id: ch03-b02
          speaker: abu_nowas
          text: 今晚苏丹去看苏比达，她准会说阿布·努瓦斯死了。苏丹就会反驳，说死的是他的妻子。等他们争起来，我们只管坐在家里享福。要是他们知道真相，不知会气成什么样！
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: 到了傍晚，苏丹办完一天的公事，果然像往常一样去苏比达的宫殿探望她。苏丹才刚走进房间，苏比达便把自己听到的死讯告诉了他。
        - id: ch03-b04
          speaker: sultana
          text: 可怜的阿布·努瓦斯死了！
          emotion: sad
        - id: ch03-b05
          speaker: sultan
          text: 阿布·努瓦斯没死。死的是他的妻子。
        - id: ch03-b06
          speaker: sultana
          text: 不，你真的弄错了。几个钟头前，他妻子亲自来过。她说丈夫花光了钱，我还给了她一笔安葬丈夫的钱。
        - id: ch03-b07
          speaker: sultan
          text: 你一定是在做梦。刚过正午，阿布·努瓦斯就来大厅见我，眼泪一直往下流。他说妻子死了，家里的东西全卖光了，别说安葬妻子，连寿衣也买不起。
        - id: ch03-b08
          speaker: narrator
          text: 两人你一句我一句，争了很久，谁也不肯听对方的话。苏丹只好叫来守门人，命他立刻赶到阿布·努瓦斯家里，亲眼看看死的到底是丈夫还是妻子。
        - id: ch03-b09
          speaker: narrator
          text: 阿布·努瓦斯和妻子正坐在朝街的花格窗后。他一眼望见守门人走来，立刻跳起身。
        - id: ch03-b10
          speaker: abu_nowas
          text: 苏丹的守门人来了！一定是派他来查真相的。快躺到床上装死！
        - id: ch03-b11
          speaker: narrator
          text: 妻子马上直挺挺地躺到床上，阿布·努瓦斯给她蒙上一条细麻布床单，看起来活像一具尸首。她才刚刚躺好，床单也才盖上，房门就开了，守门人走进屋来。
        - id: ch03-b12
          speaker: door_keeper
          text: 这里出什么事了吗？
        - id: ch03-b13
          speaker: abu_nowas
          text: 我可怜的妻子死了。你看，她就停在这里。
          emotion: sad
        - id: ch03-b14
          speaker: narrator
          text: 守门人走到屋角的床边，凑近仔细查看。他看见细麻布床单下面清清楚楚躺着一个僵直的人形，看起来和尸首一模一样。
        - id: ch03-b15
          speaker: door_keeper
          text: 人人都有一死。
        - id: ch03-b16
          speaker: narrator
          text: 说完，他便回宫复命。
        - id: ch03-b17
          speaker: sultan
          text: 怎么样，查清是谁死了吗？
        - id: ch03-b18
          speaker: door_keeper
          text: 查清了，尊贵的苏丹。死的是妻子。
        - id: ch03-b19
          speaker: sultana
          text: 他这么说，只是为了讨你欢心！
          emotion: angry
        - id: ch03-b20
          speaker: narrator
          text: 苏比达听完勃然大怒，马上叫来自己的内侍，命他也去阿布·努瓦斯家里，亲眼看清两人究竟是谁死了。
        - id: ch03-b21
          speaker: sultana
          text: 一定要如实回来禀报。要不然，有你好受的！
          emotion: angry

    - id: ch04
      title: 阿布·努瓦斯也来装死
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 苏丹后的内侍快走到房前时，阿布·努瓦斯又看见了他。
        - id: ch04-b02
          speaker: abu_nowas
          text: 苏丹后的内侍来了！这回轮到我死。快把床单盖到我身上！
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: 阿布·努瓦斯立刻躺上床，把身子挺得僵直。内侍进门时，他已经屏住呼吸，妻子则守在床边，不停地流泪。
        - id: ch04-b04
          speaker: chamberlain
          text: 你为什么哭？
        - id: ch04-b05
          speaker: maiden
          text: 我的丈夫死了。
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: 她指了指床。内侍掀开床单，看见阿布·努瓦斯僵硬地躺着，一动不动，便轻轻把床单盖回去，返回宫中。
        - id: ch04-b07
          speaker: sultan
          text: 怎么样，这回总查清楚了吧？
        - id: ch04-b08
          speaker: chamberlain
          text: 陛下，死的是丈夫。
        - id: ch04-b09
          speaker: sultan
          text: 可几个钟头前，他明明还在我这里！今晚不把事情弄清楚，我决不睡觉。马上把我的金马车赶来！
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: 不到五分钟，金马车就停在宫门前。苏丹和苏丹后双双上车，立刻动身去阿布·努瓦斯的家，要亲自把真相弄个明白。

    - id: ch05
      title: 谁说出了真相
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 阿布·努瓦斯早已不再装死，正在朝街上张望。一看见金马车驶来，他赶紧招呼妻子。
        - id: ch05-b02
          speaker: abu_nowas
          text: 快！苏丹马上就到。我们俩得一起装死迎接他！
        - id: ch05-b03
          speaker: narrator
          text: 两人并排躺到床上，把床单蒙在身上，一起屏住了呼吸。就在这时，苏丹走进屋，苏丹后和内侍紧跟在身后。苏丹来到床边查看，只见两具尸体躺得僵直，一动也不动。
        - id: ch05-b04
          speaker: sultan
          text: 谁能告诉我这到底是怎么回事，我就赏他一千枚金币！
        - id: ch05-b05
          speaker: narrator
          text: 话音才落，阿布·努瓦斯猛地坐了起来，还把手伸到苏丹面前。
        - id: ch05-b06
          speaker: abu_nowas
          text: 那就把金币赏给我吧。再也没有谁比我更需要它们了。
        - id: ch05-b07
          speaker: sultan
          text: 好你个阿布·努瓦斯，真是条厚脸皮的狗！我早该想到，这又是你耍的把戏！
          emotion: happy
        - id: ch05-b08
          speaker: narrator
          text: 苏丹放声大笑，苏丹后也笑了起来。不过，苏丹还是把答应的一千枚金币送给了阿布·努瓦斯。且让我们盼着，这些钱不会像上次那样，转眼就花光吧。
