audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰，带着古老童话的神秘感与淡淡讽刺
        timbre: 温暖清亮
        pace: 舒缓，险境与转折处略微加快
        pitch: 中音
    ingiborg:
      display_name: 英吉堡
      tts:
        delivery: 温和而坚定，告诫王子时焦急严肃
        timbre: 成熟柔润
        pace: 中速
        pitch: 中音
    sigurd:
      display_name: 西格德
      tts:
        delivery: 少年般率真固执，遇险时勇敢，恳求时热切
        timbre: 清亮有活力
        pace: 中速偏快
        pitch: 中高音
    giantess_one:
      display_name: 大姐女巨人
      tts:
        delivery: 粗犷爽快，威吓中带着直率
        timbre: 低沉厚重
        pace: 稍慢
        pitch: 低音
    giantess_two:
      display_name: 二姐女巨人
      tts:
        delivery: 强势直接，语气粗重而不拖沓
        timbre: 浑厚沙哑
        pace: 中速
        pitch: 低音
    giantess_three:
      display_name: 三姐女巨人
      tts:
        delivery: 雷鸣般威严凶猛，落败后坦率沉着
        timbre: 极低沉有压迫感
        pace: 稍慢
        pitch: 低音
    helga:
      display_name: 赫尔加
      tts:
        delivery: 天真友善，面对父亲的禁令时胆怯而犹豫
        timbre: 清澈柔和
        pace: 中速
        pitch: 高音
    helgas_father:
      display_name: 赫尔加的父亲
      tts:
        delivery: 凶猛多疑，说话直截了当
        timbre: 粗沉有力
        pace: 中速
        pitch: 低音
  chapters:
    - id: ch01
      title: 三次来访
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，一位国王和王后只有一个儿子，名叫西格德。小王子刚满十岁，母亲便一病不起，离开了人世。国王深深爱着妻子，为纪念她修起一座华美的陵墓。此后，他一天又一天坐在墓旁，为失去王后而悲泣。
        - id: ch01-b02
          speaker: narrator
          text: 一天早晨，国王又坐在墓边，发现近旁站着一位衣着华贵的夫人。他问她叫什么名字，她说自己叫英吉堡，还很惊讶国王为何独自待在那里。国王告诉她，自己的王后已经去世，他每天都来墓前哀悼。英吉堡听完，也说自己不久前刚刚失去丈夫。她提议，两人若能结为朋友，或许都能从中得到一些安慰。
        - id: ch01-b03
          speaker: narrator
          text: 国王很喜欢这个提议，请英吉堡来到王宫。两人时常相见，后来便结了婚。婚后，国王恢复了精神，又像从前一样外出打猎。西格德很喜欢继母，总愿意留在家中陪她。
        - id: ch01-b04
          speaker: ingiborg
          text: 明天你父王要去打猎，你必须跟他一起去。
        - id: ch01-b05
          speaker: sigurd
          text: 我不想去。我更愿意留在家里。
        - id: ch01-b06
          speaker: narrator
          text: 第二天，国王骑马出发时，西格德果然不肯同行。英吉堡很生气，无论怎样劝说，王子就是不听。最后，她警告西格德，他一定会为这次不听话后悔，以后最好叫他做什么就做什么。狩猎队伍离开后，她把王子藏在床底，叮嘱他一动也别动，直到听见自己的召唤。
        - id: ch01-b07
          speaker: narrator
          text: 西格德躺了很久，正觉得没必要再等，地板忽然像地震一样摇晃起来。他悄悄向外望，只见一个高大的女巨人走来。她的脚陷进土里，直没到脚踝，每走一步，地面都像被犁过一样翻开。
        - id: ch01-b08
          speaker: giantess_one
          text: 早上好，英吉堡妹妹。西格德王子在家吗？
        - id: ch01-b09
          speaker: ingiborg
          text: 不在。他今早跟父亲到森林里去了。
        - id: ch01-b10
          speaker: narrator
          text: 英吉堡为姐姐摆好餐桌，把食物一一端上来。两人吃完饭，女巨人谢过妹妹准备的肥美羊羔、最好的一罐啤酒，还有她这辈子喝过的最香的饮料，却又问了一遍王子是否在家。英吉堡仍旧说不在。女巨人告辞以后，她一直等到姐姐彻底走远，才让西格德从床下出来。国王夜里回宫，英吉堡没有向他提起白天发生的事。
        - id: ch01-b11
          speaker: narrator
          text: 次日，英吉堡再次求王子跟父亲去打猎，西格德还是宁愿留在家中。国王又独自走了。英吉堡狠狠训了王子一顿，把他藏到桌子底下。过了一阵，地板再次震动。第二个女巨人走来，双腿陷入地里，已经没到膝盖的一半。
        - id: ch01-b12
          speaker: giantess_two
          text: 英吉堡妹妹，西格德王子在家吗？
        - id: ch01-b13
          speaker: ingiborg
          text: 不在。他今早跟父亲打猎去了。
        - id: ch01-b14
          speaker: narrator
          text: 英吉堡走到橱柜前，照样为姐姐摆上饭菜。女巨人用完餐，称赞了这些美味的菜肴、肥美的羊羔、最好的一罐啤酒，还有她这辈子喝过的最香的饮料。可临走以前，她还是追问王子当真不在家吗。英吉堡回答说，当然不在。姐妹俩互相道别。等女巨人走得无影无踪，西格德才从桌下爬出来。
        - id: ch01-b15
          speaker: narrator
          text: 英吉堡说，第三天他无论如何也不能留在家里。西格德却不信会有什么危险，仍旧拒绝打猎。第二天一早，继母再三哀求，他半句话也听不进去，还叫她再把自己藏起来。国王走后，英吉堡只好让王子躲进墙壁与护墙板之间。
        - id: ch01-b16
          speaker: narrator
          text: 不久，地震般的巨响又传来了。第三个女巨人跨进门，每一步都陷到膝盖那么深。她的声音像雷鸣一样。
        - id: ch01-b17
          speaker: giantess_three
          text: 你好，英吉堡妹妹！西格德王子在家吗？
        - id: ch01-b18
          speaker: ingiborg
          text: 他不在。他正在森林里玩得高兴呢，恐怕天黑以后才会回来。
        - id: ch01-b19
          speaker: giantess_three
          text: 你撒谎！
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: 两人为此争吵不休，直到都吵累了，英吉堡才摆上饭菜。女巨人吃饱以后，谢过妹妹给她的种种好东西，还有最肥美的羊羔、最好的一罐啤酒，以及她许久以来喝过的最香的饮料。可话说到最后，她仍然追问英吉堡是否当真肯定王子不在家。
        - id: ch01-b21
          speaker: ingiborg
          text: 我当然肯定。我早就说过，他今早跟父亲到森林里打猎了。
        - id: ch01-b22
          speaker: giantess_three
          text: 要是他离得够近，听得见我的话，我就向他施下魔咒！叫他一半焦枯，一半萎缩。在找到我以前，他永远不得安宁！
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: 说完这道魔咒，女巨人大步离去。英吉堡一动不动地站在那里，仿佛整个人化成了石头。过了一会儿，她才惊醒过来，赶紧把西格德从墙壁后拉出来。眼前的王子果然已经一半焦枯，一半萎缩，英吉堡看得惊恐万分。

    - id: ch02
      title: 三场摔跤
      blocks:
        - id: ch02-b01
          speaker: ingiborg
          text: 这下你明白，固执给你招来了什么祸事吧。你父王就要回来了，我们不能再耽搁。
        - id: ch02-b02
          speaker: narrator
          text: 英吉堡匆匆跑到隔壁房间，打开一只箱子，从里面取出一个线团和三枚大小不同的金戒指，全都交到西格德手中。
        - id: ch02-b03
          speaker: ingiborg
          text: 把线团扔到地上，它会一直向前滚，最后停在一片高高的峭壁前。岩顶有个女巨人，她会冲你喊，说正想找你，今晚就要把你扔进锅里。接着，她会用长长的船钩把你拉上去。别害怕。替我向她问好，把最小的戒指送给她。她一高兴，就会要你跟她摔跤。等你累得没了力气，她会递给你一只角杯。她不知道，杯里的酒能让你力大无穷。喝下去，你就能轻易胜过她，也能在那里过夜。
        - id: ch02-b04
          speaker: ingiborg
          text: 到我的另外两个姐姐那里，事情也会一样。还有最要紧的一件事。要是我的小狗跑来，把前爪搭在你身上，脸上还流着眼泪，你必须马上回家。那说明我的性命有危险。再见了，千万别忘记你的继母。
        - id: ch02-b05
          speaker: narrator
          text: 英吉堡把线团放到地上，西格德向她告别。傍晚，线团在高耸的岩壁脚下停住了。王子抬头一看，一个女巨人正从崖顶向下张望。
        - id: ch02-b06
          speaker: giantess_one
          text: 哈，这正是我想要的！西格德王子来了，今晚就把他扔进锅里。上来吧，朋友，跟我摔一跤。
        - id: ch02-b07
          speaker: narrator
          text: 说完，她伸出长长的船钩，把西格德拉到崖顶。王子起初有些害怕，可他记得继母的每一句嘱咐，便替英吉堡向姐姐问好，又把最小的戒指送给她。女巨人看见妹妹的礼物，果然喜出望外，马上向西格德挑战，要同他摔一跤。
        - id: ch02-b08
          speaker: narrator
          text: 西格德一向喜欢各种游戏，听见挑战，便高高兴兴地动起手来。可他根本不是女巨人的对手，很快就累得头昏眼花。女巨人见他渐渐支撑不住，递来一只角杯让他喝。她这一步做得实在太傻了。杯中的酒让王子立刻变得力大无穷。没过多久，他便把女巨人摔倒在地。
        - id: ch02-b09
          speaker: giantess_one
          text: 今晚你可以住在这里。
        - id: ch02-b10
          speaker: narrator
          text: 西格德很高兴能歇一夜。第二天早晨，他重新放下线团。线团滚了很久，停在另一座高岩下面。崖顶站着第二个女巨人，她比姐姐更高大，也更丑陋。
        - id: ch02-b11
          speaker: giantess_two
          text: 哈，这正是我想要的！西格德王子来了，今晚就把他扔进锅里。快上来，跟我摔一跤。
        - id: ch02-b12
          speaker: narrator
          text: 女巨人片刻也不耽搁，立刻用船钩把王子拉上岩壁。西格德替继母向她问好，又送上第二大的戒指。她看到戒指，十分高兴，马上向他挑战。两人你来我往，搏斗了很久，王子终于渐渐没了力气。女巨人便递给他一只角杯。他喝下杯里的东西，再一次变得力大无穷，只用一只手就把她摔倒在地。
        - id: ch02-b13
          speaker: narrator
          text: 第三天早晨，线团又滚出很远，最后停在一座极高的岩壁下。世上最丑陋可怕的女巨人从崖顶探出身来。
        - id: ch02-b14
          speaker: giantess_three
          text: 哈，这正是我想要的！西格德王子来了，今晚就把他扔进锅里。上来吧，朋友，跟我摔一跤。
        - id: ch02-b15
          speaker: narrator
          text: 她像两个姐姐一样，用长船钩把西格德拉上岩顶。王子替英吉堡向她问好，送上最后那枚、也是最大的一枚戒指。女巨人看见闪亮的赤金，满心欢喜，马上要跟他较量。这一次，他们斗得格外凶猛，也格外长久。西格德快要耗尽力气时，女巨人拿了些东西给他喝。他喝完以后，很快就把她压得跪倒在地。
        - id: ch02-b16
          speaker: giantess_three
          text: 你胜过我了。现在听好，附近有一个湖。湖边有个小姑娘在玩船。你要同她交朋友，把这枚小金戒指送给她。你如今比过去更加强壮。祝你好运。
        - id: ch02-b17
          speaker: narrator
          text: 西格德向女巨人告别，继续赶路，终于来到湖边。那里果然有个小姑娘在玩一条小船。他走过去，问她叫什么名字。
        - id: ch02-b18
          speaker: helga
          text: 我叫赫尔加，就住在附近。

    - id: ch03
      title: 巨人家里的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 西格德把小金戒指送给赫尔加，又提议两人一起玩。赫尔加既没有兄弟，也没有姐妹，听了高兴极了。他们就在湖边玩了一整天。傍晚来到，王子请求跟她一起回家。赫尔加起初不肯答应，因为她父亲是个十分凶恶的巨人。从来没有哪个陌生人进了她家，还能瞒过父亲的眼睛。
        - id: ch03-b02
          speaker: narrator
          text: 西格德仍旧再三恳求，赫尔加终于让步。快到门口时，她把自己的手套举到他上方，王子立刻变成了一捆羊毛。赫尔加把羊毛夹在臂下带进屋，扔在自己房间的床上。几乎就在同一刻，她父亲猛冲进来，在屋里四处搜寻，把每一个角落都翻了一遍。
        - id: ch03-b03
          speaker: helgas_father
          text: 这里有人的气味。赫尔加，你刚才往床上扔了什么？
        - id: ch03-b04
          speaker: helga
          text: 我扔的是一捆羊毛。
        - id: ch03-b05
          speaker: helgas_father
          text: 哦，那我闻到的也许就是羊毛。
        - id: ch03-b06
          speaker: narrator
          text: 老巨人以为自己闻到的是羊毛味，便不再追究。第二天，赫尔加出门玩耍，把那捆羊毛夹在臂下。来到湖边，她再次把手套举到羊毛上方，西格德便恢复了原来的模样。他们又玩了一整天。王子还教赫尔加玩了许多新鲜游戏，那些游戏，她从前连听都没听说过。
        - id: ch03-b07
          speaker: helga
          text: 明天我们能玩得更痛快。父亲要进城，我们可以留在家里。
        - id: ch03-b08
          speaker: narrator
          text: 回到屋前，赫尔加再次举起手套，把西格德变成一捆羊毛，悄悄带进家，没有让任何人发现。第二天一大早，父亲进城去了。等他走得不见踪影，姑娘立刻让王子恢复原形。她想带西格德四处看看，好让他开心。父亲临走前把所有钥匙都交给了她，于是她带他走遍整座屋子，把房门一间一间打开。
        - id: ch03-b09
          speaker: narrator
          text: 到了最后，西格德发现钥匙串上还有一把没用过，便问它开的是哪扇门。赫尔加脸红了，没有回答。王子看见一扇沉重的铁门，请她打开。她说自己不敢，就算开，也只能露出一条极细的缝。西格德说，那样已经足够。
        - id: ch03-b10
          speaker: narrator
          text: 铁门实在太沉，赫尔加费了很久才推开一点。西格德等得越来越不耐烦，忽然上前把门推到大开，径直走了进去。里面站着一匹神骏非凡的马，身上已经备好鞍辔。马的正上方悬着一柄装饰华美的宝剑，剑柄上刻着一行字。那行字说，骑上此马，佩上此剑，便能寻得幸福。
        - id: ch03-b11
          speaker: narrator
          text: 西格德惊奇得说不出话，过了一会儿才开口。
        - id: ch03-b12
          speaker: sigurd
          text: 求求你，让我骑着它绕屋子跑一圈吧！只骑一次，我保证不会再求了。
        - id: ch03-b13
          speaker: helga
          text: 绕屋子骑一圈？你要骑古尔法克西！要是我答应，父亲永远也不会原谅我。
          emotion: fearful
        - id: ch03-b14
          speaker: sigurd
          text: 这又不会伤着它。我一定特别小心。在家时，我骑过各种马，一次也没摔下来。赫尔加，求你答应吧！
        - id: ch03-b15
          speaker: helga
          text: 好吧，也许可以。可你必须立刻回来，一定要快，不然父亲会发现的。
        - id: ch03-b16
          speaker: narrator
          text: 赫尔加以为西格德这就会上马，可他还站在那里，抬头望着宝剑。
        - id: ch03-b17
          speaker: sigurd
          text: 还有那把剑。我父亲是国王，却也没有这么美的剑。剑鞘上的宝石，比他王冠上的大红宝石还要华美。它有名字吗？有些宝剑是有名字的。
        - id: ch03-b18
          speaker: helga
          text: 它叫贡弗德，意思是战斗之羽。古尔法克西的意思是金鬃。既然你要骑马，我想带上宝剑也没什么。不过你拿了宝剑，也得带上那根木棍、那块石头和那截树枝。
        - id: ch03-b19
          speaker: sigurd
          text: 这些东西倒很容易带走。可它们又干又难看，你们留着它们做什么？
        - id: ch03-b20
          speaker: helga
          text: 父亲说，比起失去它们，他宁愿失去古尔法克西。骑马的人要是被追赶，只要把树枝扔在身后，它就会变成一片森林，密得连鸟都难飞过去。敌人若懂魔法，能毁掉森林，骑马的人就用木棍敲那块石头。天上会落下鸽子蛋那么大的冰雹，把方圆二十英里以内的人全都打死。

    - id: ch04
      title: 骑着金鬃逃走
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 听完这些话，赫尔加终于答应让西格德绕屋子骑仅仅一圈，还准他带上宝剑、木棍、石头和树枝。可王子骑完一圈以后，并没有像答应的那样下马。他忽然拨转古尔法克西的头，催动金鬃神马，飞快地逃走了。
        - id: ch04-b02
          speaker: narrator
          text: 不久，赫尔加的父亲回到家，发现女儿正在哭泣。他问清发生了什么，听完全部经过，马上以最快的速度冲出去，拼命追赶西格德。王子恰好回头，看见巨人正迈着大步赶来，便急忙把树枝扔到身后。转眼间，一片密林拔地而起，横在他和敌人中间。林木密得难以穿过，巨人只得跑回家取来斧头，一路砍出通道。
        - id: ch04-b03
          speaker: narrator
          text: 西格德再次回头时，巨人已经追得极近，几乎碰到了古尔法克西的尾巴。王子惊恐万分，急忙在马鞍上转过身，用木棍敲击石头。木棍刚一落下，一场可怕的冰雹便在他身后轰然爆发。鸽子蛋那么大的冰雹猛烈砸落，当场打死了巨人。
        - id: ch04-b04
          speaker: narrator
          text: 幸好西格德敲石头时回过头去。要是他面朝前方，冰雹就会迎面落下，死的反而是他自己。
        - id: ch04-b05
          speaker: narrator
          text: 巨人死后，西格德继续骑着古尔法克西，朝自己的故乡赶去。走到半路，继母的小狗忽然迎面跑来。它一见王子，就把两只前爪搭到他身上，脸上的泪水不停地往下淌。西格德想起英吉堡临别时最要紧的叮嘱，立刻催动古尔法克西，朝王宫全速飞奔。
        - id: ch04-b06
          speaker: narrator
          text: 西格德赶到王宫，只见九名男仆正在庭院里把英吉堡捆上柱子，柴火已经备好，他们正打算将王后烧死。王子顿时怒不可遏，纵身跳下马，拔出宝剑扑向那些人，将九名男仆全部杀死。随后，他赶紧解开继母身上的绳索，同她一起走进王宫，去见自己的父亲。

    - id: ch05
      title: 王子的归来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 国王以为儿子已经被王后杀害，悲伤得一病不起，整日躺在床上。他既不肯吃东西，也不肯喝水。如今看见西格德好端端地站在面前，国王欢喜极了，几乎不敢相信自己的眼睛。王子坐在父亲身边，把离家以后经历的种种奇遇，从头到尾全都告诉了他。
        - id: ch05-b02
          speaker: narrator
          text: 后来，西格德再次骑上古尔法克西，专程回到巨人的住处，把赫尔加接到自己的王国。宫中为他们举行了一场盛大的婚礼宴会，一连庆祝了整整三天。人人都说，从没有见过像赫尔加这样美丽的新娘。此后，他们幸福地生活了许多年，王国里的人人都爱戴他们。
        - id: ch05-b03
          speaker: narrator
          text: 这个故事选自《冰岛童话》。
