  chapters:
    - id: ch01
      title: The Three Visitors
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Many, many years ago, a king and queen had one son, Prince Sigurd. When Sigurd was only ten, his mother became ill and died. The king had loved her dearly. He raised a splendid monument in her memory, and every day he sat beside it, grieving for all he had lost.
        - id: ch01-b02
          speaker: narrator
          text: One morning at the grave, he noticed a richly dressed lady standing nearby. He asked her name, and she told him she was Ingiborg. She seemed surprised to find the king there alone, so he explained that his queen had died and that he came each day to weep beside her grave.
        - id: ch01-b03
          speaker: ingiborg
          text: I lost my husband not long ago. Perhaps it would comfort us both if we became friends.
        - id: ch01-b04
          speaker: narrator
          text: The idea pleased the king so much that he invited Ingiborg to his palace. They saw each other often, and before long, they married. Once the wedding was over, the king's good spirits returned. He began riding out to hunt as he had in earlier days. Sigurd had grown very fond of his stepmother, so whenever the king went hunting, the boy always stayed at home with her.
        - id: ch01-b05
          speaker: ingiborg
          text: Your father is going hunting tomorrow, Sigurd. You must ride with him.
        - id: ch01-b06
          speaker: sigurd
          text: I would much rather stay here with you.
        - id: ch01-b07
          speaker: narrator
          text: The next morning, Sigurd refused to join the king. Ingiborg became angry, but the boy would not listen.
        - id: ch01-b08
          speaker: ingiborg
          text: You will be sorry you disobeyed me. In the future, you had better do what I tell you.
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: Once the hunting party had left, Ingiborg hid Sigurd under her bed and warned him to stay there until she called. He lay perfectly still for a long time. Just as he began to think there was no reason to remain, the floor shook beneath him like an earthquake. Peering out, he saw a huge giantess coming toward the room. She waded ankle-deep through the ground and ploughed it up with every step.
        - id: ch01-b10
          speaker: first_giantess
          text: Good morning, Sister Ingiborg. Is Prince Sigurd at home?
        - id: ch01-b11
          speaker: ingiborg
          text: No. He went to the forest with his father this morning.
        - id: ch01-b12
          speaker: narrator
          text: Ingiborg set the table and gave her sister food. When they had both finished eating, the giantess rose to leave.
        - id: ch01-b13
          speaker: first_giantess
          text: Thank you, sister. That was the finest lamb, the finest can of beer, and the finest drink I have ever tasted. But tell me once more. Is Prince Sigurd truly not at home?
        - id: ch01-b14
          speaker: ingiborg
          text: No, he is not here.
        - id: ch01-b15
          speaker: narrator
          text: The giantess said farewell and went away. Only when she had vanished from sight did Ingiborg let Sigurd crawl out. The king returned that night, but the queen told him nothing about the visit.
        - id: ch01-b16
          speaker: narrator
          text: The following morning, Ingiborg again begged Sigurd to hunt with his father. He gave the same answer. He wanted to stay at home. The king rode off without him, and Ingiborg hid the boy under the table, scolding him for disobeying her. Before long, the floor began to tremble. A second giantess came wading through the earth, this time buried halfway to her knees.
        - id: ch01-b17
          speaker: second_giantess
          text: Well, Sister Ingiborg, is Prince Sigurd at home?
        - id: ch01-b18
          speaker: ingiborg
          text: No. He rode out hunting with his father this morning.
        - id: ch01-b19
          speaker: narrator
          text: Ingiborg went to the cupboard, laid the table, and ate with her sister. At the end of the meal, the giantess stood up.
        - id: ch01-b20
          speaker: second_giantess
          text: Thank you for all those delicious dishes. That was the best lamb, the best can of beer, and the loveliest drink I have ever had. But is Prince Sigurd really not here?
        - id: ch01-b21
          speaker: ingiborg
          text: No, certainly not!
        - id: ch01-b22
          speaker: narrator
          text: The sisters said goodbye. When the giantess was well out of sight, Sigurd crept from under the table. Ingiborg told him that this time it was terribly important for him not to remain at home the following day. Sigurd said he could not see what harm his staying had caused. He still had no intention of going out to hunt.
        - id: ch01-b23
          speaker: narrator
          text: The next morning, Ingiborg pleaded with him again. It made no difference. Sigurd stubbornly ignored every word.
        - id: ch01-b24
          speaker: sigurd
          text: You will simply have to hide me again.
        - id: ch01-b25
          speaker: narrator
          text: As soon as the king had gone, Ingiborg concealed Sigurd between the wall and its wooden panelling. After a while, the house shook once more. A third giantess came through the door, wading knee-deep through the ground.
        - id: ch01-b26
          speaker: third_giantess
          text: Good day, Sister Ingiborg! Is Prince Sigurd at home?
        - id: ch01-b27
          speaker: ingiborg
          text: Oh, no. He is enjoying himself in the forest. I doubt he will return before dark.
        - id: ch01-b28
          speaker: third_giantess
          text: That is a lie!
          emotion: angry
        - id: ch01-b29
          speaker: narrator
          text: The sisters argued until both were tired. Then Ingiborg laid the table. When the giantess had eaten everything she wanted, she spoke again.
        - id: ch01-b30
          speaker: third_giantess
          text: I must thank you for these good things. That was the finest lamb, the finest can of beer, and the finest drink I have tasted in a long while. Now, are you completely sure Prince Sigurd is not at home?
        - id: ch01-b31
          speaker: ingiborg
          text: Completely sure. I have already told you. He rode into the forest with his father this morning.
        - id: ch01-b32
          speaker: narrator
          text: Then the giantess roared in a terrible voice.
        - id: ch01-b33
          speaker: third_giantess
          text: If the prince is close enough to hear me, I put this spell upon him. Let half of him be scorched and half of him withered. Let him find no rest and no peace until he finds me!
          emotion: angry
        - id: ch01-b34
          speaker: narrator
          text: With that, she stalked away. Ingiborg stood frozen for a moment. Then she pulled Sigurd from his hiding place. To her horror, the spell had worked. Half of him was scorched, and half was withered.

    - id: ch02
      title: The Three Wrestling Matches
      blocks:
        - id: ch02-b01
          speaker: ingiborg
          text: Now you see what your stubbornness has done. We have no time to lose. Your father will be home soon.
        - id: ch02-b02
          speaker: narrator
          text: She hurried into the next room, opened a chest, and brought out a ball of string and three gold rings. She placed them in Sigurd's hands and told him what he must do.
        - id: ch02-b03
          speaker: ingiborg
          text: Throw this ball onto the ground. It will roll until it reaches some high cliffs. A giantess will be watching from the rocks. She will say that you are just what she wanted and that you will go into her pot that night. Do not be afraid. She will pull you up with a long boat hook. Give her my greeting and the smallest ring.
        - id: ch02-b04
          speaker: ingiborg
          text: The gift will please her, and she will challenge you to wrestle. When you are worn out, she will offer you a drinking horn. She does not know the wine will make you strong enough to defeat her. Then she will let you sleep there. The same things will happen when you meet my other two sisters.
        - id: ch02-b05
          speaker: ingiborg
          text: Above all, remember this. If my little dog comes to you, puts his paws on you, and cries, hurry home. It will mean that my life is in danger. Farewell, Sigurd, and do not forget your stepmother.
        - id: ch02-b06
          speaker: narrator
          text: Ingiborg dropped the ball onto the ground, and Sigurd said goodbye. It rolled onward until evening, when it stopped at the bottom of some high rocks. Sigurd looked up and saw the first giantess watching from the top.
        - id: ch02-b07
          speaker: first_giantess
          text: Ah, this is exactly what I wanted! Prince Sigurd has come, and tonight he goes into the pot. Come up here, my friend, and wrestle with me.
        - id: ch02-b08
          speaker: narrator
          text: She reached down with a long boat hook and hauled him up the cliff. Sigurd was frightened at first. Then he remembered Ingiborg's instructions, gave the giantess her sister's greeting, and offered her the smallest ring.
        - id: ch02-b09
          speaker: narrator
          text: The giantess was delighted by the ring and challenged him to wrestle. Sigurd loved every kind of game, so he accepted gladly. At first, though, he was no match for her. They struggled until he began to grow faint. When the giantess noticed his weakness, she handed him a horn to drink from. That was a foolish thing for her to do. She did not know the wine would make him strong. Soon Sigurd had enough power to overthrow her.
        - id: ch02-b10
          speaker: first_giantess
          text: You may sleep here tonight.
        - id: ch02-b11
          speaker: narrator
          text: Sigurd was grateful for the rest. In the morning, he put the ball down once more. It rolled for a long time and stopped beneath another high rock. A second giantess looked down at him. She was even larger and uglier than the first.
        - id: ch02-b12
          speaker: second_giantess
          text: Ah, this is exactly what I wanted! Prince Sigurd is here, and tonight he goes into the pot. Come up quickly and wrestle with me.
        - id: ch02-b13
          speaker: narrator
          text: She wasted no time pulling him up. Sigurd delivered his stepmother's greeting and gave her the middle ring. The sight of it pleased the giantess greatly, and she challenged him at once.
        - id: ch02-b14
          speaker: narrator
          text: They struggled for a long while. At last Sigurd began to feel faint. The giantess passed him a drinking horn. As soon as he drank, fresh strength poured into him, and he threw her down with one hand.
        - id: ch02-b15
          speaker: narrator
          text: On the third morning, Sigurd set the ball down again. It rolled far away before stopping under the highest rock yet. Over its top peered the most hideous giantess anyone had ever seen.
        - id: ch02-b16
          speaker: third_giantess
          text: Ah, this is exactly what I wanted! Here comes Prince Sigurd, and tonight he goes into the pot. Come up, my friend, and wrestle with me.
        - id: ch02-b17
          speaker: narrator
          text: She hauled him to the top just as her sisters had. Sigurd gave her Ingiborg's message and presented the last and largest ring. The red gold filled her with delight, and she called for a wrestling match.
        - id: ch02-b18
          speaker: narrator
          text: This fight was long and fierce. When Sigurd's strength finally began to fail, the giantess gave him a drink. Once he had swallowed it, he forced her down onto her knees.
        - id: ch02-b19
          speaker: third_giantess
          text: You have beaten me. Now listen. There is a lake not far from here. A little girl will be playing there with a boat. Become her friend and give her this small gold ring. You are stronger now than you have ever been. I wish you good luck.
        - id: ch02-b20
          speaker: narrator
          text: They said farewell, and Sigurd continued on his way.

    - id: ch03
      title: Helga and the Hidden Room
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At the lake, Sigurd found a little girl playing with a boat, just as the giantess had promised. He went to her and asked her name.
        - id: ch03-b02
          speaker: helga
          text: My name is Helga, and I live nearby.
        - id: ch03-b03
          speaker: narrator
          text: Sigurd gave her the little gold ring and suggested a game. Helga was delighted. She had no brothers or sisters, and the two children played together for the rest of the day.
        - id: ch03-b04
          speaker: narrator
          text: When evening came, Sigurd asked to go home with her. Helga refused at first. Her father was a fierce giant, and no stranger had ever entered their house without being discovered. Sigurd kept asking until she finally agreed.
        - id: ch03-b05
          speaker: narrator
          text: Near the door, Helga held her glove above Sigurd. At once he became a bundle of wool. She tucked the bundle under her arm, carried it to her room, and tossed it onto the bed. Almost immediately, her father rushed in and searched every corner.
        - id: ch03-b06
          speaker: giant_father
          text: This place smells of men. What did you throw onto the bed, Helga?
        - id: ch03-b07
          speaker: helga
          text: It is only a bundle of wool.
        - id: ch03-b08
          speaker: giant_father
          text: Oh. Perhaps that is what I smelled.
        - id: ch03-b09
          speaker: narrator
          text: The old giant decided that the wool must have caused the smell, and he stopped worrying about it. The next day, Helga went outside with the bundle tucked under her arm. At the lake, she passed her glove over it once more, and Sigurd took his own shape again. They spent the whole day playing, and the prince taught Helga all sorts of games she had never even heard of before.
        - id: ch03-b10
          speaker: helga
          text: Tomorrow we can play even better. My father has to go into town, so we can stay inside the house.
        - id: ch03-b11
          speaker: narrator
          text: That evening, as they approached the house, Helga changed Sigurd back into wool and smuggled him inside. Very early the next morning, her father left for town. As soon as he was far away, she lifted her glove and restored the prince.
        - id: ch03-b12
          speaker: narrator
          text: Helga showed him around the whole house. Her father had left her the keys, and she opened one room after another to amuse her guest. At the final room, Sigurd noticed that one key on the ring had not been used. He asked what it opened. Helga blushed and said nothing.
        - id: ch03-b13
          speaker: sigurd
          text: You do not mind if I see that room too, do you?
        - id: ch03-b14
          speaker: narrator
          text: Then he spotted a heavy iron door and begged her to unlock it. Helga said she did not dare. If she opened it at all, it could only be the tiniest crack. Sigurd promised that a crack would be enough.
        - id: ch03-b15
          speaker: narrator
          text: The iron door was so heavy that Helga needed a long time to move it even a little. Sigurd grew impatient. He pushed it wide open himself and walked into the room. There stood a splendid horse, already saddled and ready to ride. Just above the horse hung a richly decorated sword. Carved into its handle were words promising that whoever rode this horse and wore this sword would find happiness.
        - id: ch03-b16
          speaker: narrator
          text: The horse filled Sigurd with such wonder that for a while he could not speak. At last, he found his voice.
        - id: ch03-b17
          speaker: sigurd
          text: Please let me mount him and ride once around the house. Only once. I promise I will not ask again.
        - id: ch03-b18
          speaker: helga
          text: Ride him around the house? Ride Gullfaxi? My father would never forgive me if I allowed that!
          emotion: fearful
        - id: ch03-b19
          speaker: sigurd
          text: It cannot hurt him. I will be very careful. At home, I have ridden every kind of horse, and I have never fallen off. Please, Helga.
        - id: ch03-b20
          speaker: helga
          text: Well, perhaps you may, if you come straight back. But be quick, or my father will discover it.
        - id: ch03-b21
          speaker: narrator
          text: Yet Sigurd did not mount. He stood looking up at the sword.
        - id: ch03-b22
          speaker: sigurd
          text: What about the sword? My father is a king, but even he owns nothing so beautiful. The jewels on that sheath are finer than the great ruby in his crown. Does the sword have a name? Some swords do.
        - id: ch03-b23
          speaker: helga
          text: It is Gunnfoder, the Battle Plume. Gullfaxi means Golden Mane. If you are going to ride the horse, I suppose you might as well take the sword. But then you must carry the stick, the stone, and the twig too.
        - id: ch03-b24
          speaker: sigurd
          text: Those are easy enough to carry. What miserable, dried-up things they are! Why does anyone keep them?
        - id: ch03-b25
          speaker: helga
          text: Father says he would rather lose Gullfaxi than lose those things. If the rider is chased, he can throw the twig behind him. It becomes a forest so thick that even a bird can hardly fly through it.
        - id: ch03-b26
          speaker: helga
          text: If the enemy knows magic and brings the forest down, the rider can strike the stone with the stick. Then hailstones as big as pigeons' eggs fall from the sky and kill everyone for twenty miles around.
        - id: ch03-b27
          speaker: narrator
          text: After telling him all this, Helga let Sigurd take Gullfaxi once around the house, with the sword, twig, stick, and stone. Sigurd completed the circle. But instead of getting down, he turned the horse's head and galloped away.

    - id: ch04
      title: The Giant's Pursuit
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Soon afterward, Helga's father returned from town and found his daughter in tears. He demanded to know what was wrong, and Helga told him everything that had happened. She explained how Sigurd had taken Gullfaxi, the sword, and the three little objects. As soon as the giant heard the story, he rushed from the house and pursued the prince as fast as his enormous strides could carry him.
        - id: ch04-b02
          speaker: narrator
          text: Sigurd happened to glance behind him and saw the giant coming in enormous strides. He quickly threw the twig over his shoulder. In an instant, a forest sprang up between them. It was so thick that the giant had to return home for an axe before he could cut a path through it.
        - id: ch04-b03
          speaker: narrator
          text: The next time Sigurd looked back, the giant had caught up. He was so close that he could almost touch Gullfaxi's tail. Sigurd was terrified. He twisted around in the saddle and struck the stone with the stick.
        - id: ch04-b04
          speaker: narrator
          text: At once, a dreadful hailstorm burst behind him. The giant was killed where he stood. If Sigurd had struck the stone without turning around, the hail would have blown into his own face and killed him instead.

    - id: ch05
      title: Sigurd Comes Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: With the giant dead, Sigurd rode toward home. On the way, he suddenly met Ingiborg's little dog. It ran up to him with tears streaming down its face. Sigurd remembered the queen's warning and urged Gullfaxi onward as fast as the horse could go.
        - id: ch05-b02
          speaker: narrator
          text: He reached the palace courtyard and found nine servants tying Queen Ingiborg to a post. They meant to burn her there. Sigurd flew into a fury. He leaped from Gullfaxi, drew his sword, and attacked the men. He killed all nine and set his stepmother free.
        - id: ch05-b03
          speaker: narrator
          text: Together, Sigurd and Ingiborg went inside to see the king. The king lay sick in bed, overcome with sorrow. He had stopped eating and drinking because he believed the queen had killed his son.
        - id: ch05-b04
          speaker: narrator
          text: When Sigurd appeared, the king could hardly believe what he saw. Joy swept away his grief, and the prince told him everything that had happened.
        - id: ch05-b05
          speaker: narrator
          text: Afterward, Sigurd rode back to bring Helga home. The palace held a magnificent feast that lasted for three days. Everyone said that no bride had ever been as beautiful as Helga.
        - id: ch05-b06
          speaker: narrator
          text: Sigurd and Helga lived happily for many, many years, and everybody loved them.
