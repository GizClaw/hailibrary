audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带一点英式童话的机智
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明自信，挖苦人时一本正经
        timbre: 清脆的少年声
        pace: 中等偏快
        pitch: 中高
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴敏锐，急切时仍然清楚
        timbre: 柔和明亮的少女声
        pace: 中等
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 坚持己见，认真里常带几分莽撞
        timbre: 结实清朗的少年声
        pace: 中等
        pitch: 中等
    jane:
      display_name: 简
      tts:
        delivery: 天真直率，话里带着小孩子的认真
        timbre: 稚嫩柔软的女孩声
        pace: 稍慢
        pitch: 偏高
    phoenix:
      display_name: 凤凰
      tts:
        delivery: 文雅自负，庄重中带着敏锐的幽默
        timbre: 华美清润，中性而成熟
        pace: 从容
        pitch: 中高
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔能干，管教孩子时明快而坚定
        timbre: 温暖柔和的成年女声
        pace: 中等
        pitch: 中等
    father:
      display_name: 爸爸
      tts:
        delivery: 爽朗风趣，着急时仍说得干脆
        timbre: 明朗厚实的成年男声
        pace: 中等偏快
        pitch: 中低
    lamb:
      display_name: 小羊羔
      tts:
        delivery: 天真活泼，只会说简单稚嫩的话
        timbre: 软糯清脆的幼儿声
        pace: 稍慢
        pitch: 高
    attendant:
      display_name: 剧场服务员
      tts:
        delivery: 守规矩而不耐烦，语气直接
        timbre: 清楚结实的成年男声
        pace: 中等
        pitch: 中等
    audience_1:
      display_name: 观众甲
      tts:
        delivery: 受惊时仓促响亮
        timbre: 清亮的成年声
        pace: 快
        pitch: 中高
    audience_2:
      display_name: 观众乙
      tts:
        delivery: 受惊时急切有力
        timbre: 厚实的成年声
        pace: 快
        pitch: 中等
    audience_3:
      display_name: 观众丙
      tts:
        delivery: 受惊时尖锐慌乱
        timbre: 较高的成年声
        pace: 快
        pitch: 偏高
  chapters:
    - id: ch01
      title: 地毯的坏名声
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 妈妈回家的第一个早晨，许愿地毯摊在育儿室地上。它到处是补丁，背面还衬着亮闪闪的美国油布。妈妈看了一阵，终于忍不住开口。
        - id: ch01-b02
          speaker: mother
          text: 我非得说，这辈子没买过这么不划算的东西。二十二先令九便士呀，本该用上好多年，现在却糟成这样。当然，你们补得很用心，这样做真贴心。宝贝们，你们已经尽力了。下回还是铺椰棕席吧，地毯待在这间屋里，日子可太难过了。
        - id: ch01-b03
          speakers: [anthea, jane]
          ensemble: duo
          text: 男孩子们也帮忙了。
        - id: ch01-b04
          speaker: robert
          text: 妈妈，我们的靴子偏偏特别结实，这也不能怪我们吧？
        - id: ch01-b05
          speaker: mother
          text: 靴子是没办法，不过进屋时可以换下来呀。我才回家第一个早晨，可舍不得骂你们。小羊羔，你怎么能这样！
        - id: ch01-b06
          speaker: narrator
          text: 这番话是在早餐桌上说的。大家望着地毯时，小羊羔只用一转眼的工夫，就把一盘黏稠的黑莓果酱扣到了头上。要把果酱再弄干净，却花了好几个人好些分钟。这件有趣的工程把大家的心思引开，地毯划不划算，妈妈对椰棕席有什么希望，暂时都没人提了。接下来得有人照看小羊羔，好让妈妈处理家事。她揉乱头发，手指也染上墨水，对着厨娘写在脏纸片上的家用账目发愁。那些弯弯绕绕的数字照说该解释清楚，寄去的家用钱为什么只剩五个半便士和一堆没付的账单，可连聪明的妈妈也看不懂。
        - id: ch01-b07
          speaker: narrator
          text: 哥哥姐姐只好照看小羊羔。他很高兴又有人陪玩，一点没忘记从前那些累人的游戏。先让大家抓着他的双手，一圈圈转成“旋转的世界”；再抓住一只脚踝和一只手腕，左右荡成“腿和翅膀”。最后是攀登维苏威火山。他踩着西里尔一路爬上肩头，西里尔尽力大吼，算作火山轰鸣，再轻轻把他翻到地板上滚几下，这便是庞贝城的毁灭。
        - id: ch01-b08
          speaker: cyril
          text: 妈妈下回再问地毯，我们到底该怎么回答？最好先商量好。
        - id: ch01-b09
          speaker: anthea
          text: 你们商量吧。漂亮的小鸭鸭羊羔，到黑豹这里玩诺亚方舟。
        - id: ch01-b10
          speaker: narrator
          text: 小羊羔漂亮的头发乱成一团，脸上沾满庞贝城毁灭时的灰尘。他一到安西娅怀里，立刻变成一条嘶嘶叫、扭来扭去、爬个不停的小蛇。安西娅唱起小蛇歌，说自己爱这条小蛇，它醒着会嘶嘶唱歌，扭着身子爬呀爬，就连睡着也扭个不停。
        - id: ch01-b11
          speaker: lamb
          text: 鳄鳄。
        - id: ch01-b12
          speaker: narrator
          text: 安西娅便改唱小鳄鱼。她爱它那张满是真牙的大嘴，只是更爱从外面远远地看。
        - id: ch01-b13
          speaker: cyril
          text: 麻烦还是老样子。地毯的真相明明是真的，妈妈偏偏不会相信。
        - id: ch01-b14
          speaker: phoenix
          text: 西里尔啊，你说的乃是真话。现在且听凤凰之子凤凰的智慧之言。
        - id: ch01-b15
          speaker: narrator
          text: 凤凰从碗柜里钻出来。那里住着黑甲虫，还堆满撕破的书、摔裂的石板，以及各种失去其余部分的玩具零件。西里尔听见“凤凰之子”，马上说世上真有一个团体叫这个名字。
        - id: ch01-b16
          speaker: phoenix
          text: 社团是什么？我倒想见见那些自称凤凰之子的人。
        - id: ch01-b17
          speaker: cyril
          text: 社团就是一群人联合在一起，像一种兄弟会。怎么说呢，很像你的神庙，不过又完全不同。可你刚才要说的智慧之言呢？
        - id: ch01-b18
          speaker: phoenix
          text: 智慧永远受人欢迎。
        - id: ch01-b19
          speaker: lamb
          text: 漂亮鹦鹉！
        - id: ch01-b20
          speaker: narrator
          text: 小羊羔朝金光闪闪的说话者伸出双手，凤凰谦逊地退到罗伯特身后。安西娅赶紧用歌谣引开小羊羔。她说自己爱那只小兔子，可它有个糟糕的习惯，总爱跑到水里和石头间嬉戏，把两只兔袜泡得透湿。
        - id: ch01-b21
          speaker: robert
          text: 你大概不会喜欢凤凰之子。听说他们不做什么火热的事，只会喝很多柠檬水和冒泡泡的饮料。他们觉得喝得越多，人就越好。
        - id: ch01-b22
          speaker: jane
          text: 心里也许会变好，身体可不会。你会胀成大气球。
        - id: ch01-b23
          speaker: narrator
          text: 凤凰听得打起哈欠。安西娅忽然想到，这不是普通地毯，魔法厉害得很。要是给它抹些塔乔生发水，再让它好好休息，带魔法的绒毛也许会像人的头发一样长出来。罗伯特说煤油大概同样管用，至少气味跟塔乔完全一样，而气味看起来正是塔乔最了不起的地方。安西娅的主意虽有种种缺点，至少给了大家一件能做的事，于是他们真的动起手来。
        - id: ch01-b24
          speaker: narrator
          text: 西里尔从爸爸的盥洗架上拿来塔乔，可瓶里只剩一点。简坚决不肯全拿走。万一爸爸的头发突然开始脱落，又没有药水可抹，等伊丽莎抽出空去药房买一瓶新的，头发也许早掉光了。家里有个秃头爸爸多可怕，而且责任全在他们。安西娅又想到假发很贵，便决定留下足够在紧急时抹湿爸爸整个脑袋的分量，不够的部分用同味道的煤油补足。
        - id: ch01-b25
          speaker: narrator
          text: 他们取了一小茶匙塔乔，抹到最糟的补丁边缘，仔细揉进绒毛根部。凡是塔乔不够用的地方，就拿法兰绒蘸煤油来擦。最后，大家把那块布烧掉。火焰烧得欢快，凤凰和小羊羔看得十分高兴。妈妈却正好在这时推门进来。
        - id: ch01-b26
          speaker: mother
          text: 到底要说多少次，你们才记住不许玩煤油？刚才做什么了？以后别再这样。
        - id: ch01-b27
          speaker: anthea
          text: 烧了一块沾煤油的布。
        - id: ch01-b28
          speaker: narrator
          text: 他们没法解释地毯上的事。妈妈不知道它有魔法，谁也不愿让人嘲笑自己拿灯油修补一张普通地毯。妈妈只叫他们别再这样，随后又让所有人收起愁眉苦脸。爸爸拍来了一封电报。孩子们捏住那张软纸的四角，一起读出上面的话。孩子们去加里克剧院的包厢，爸爸妈妈去干草市场剧院的正厅，六点半在查令十字车站会合。
        - id: ch01-b29
          speaker: mother
          text: 你们可以自己去看《水孩子》，爸爸和我送你们过去，再来接。安西娅，把小羊羔给我。你和简去换晚礼服上的花边，那衣服多半还得熨。这里的煤油味真够呛。
        - id: ch01-b30
          speaker: narrator
          text: 两件番茄红的利伯蒂绸礼服皱得厉害，因为演活人画需要红衣服时，它们总能派上用场。那些画很精彩，真希望能全讲给你们听，可一个故事没法什么都说。你们准会喜欢“伦敦塔里的小王子”那一幕。有一回枕头忽然裂开，两位年幼的王子落得满身羽毛，那幅画改名叫“米迦勒节前夕，或拔鹅毛”也完全合适。熨衣服、缝花边花了不少时间，可晚上有戏可盼，地毯也可能长出新绒毛，所以没人无聊。大家一次次焦急地去看，到四点，简几乎确信有几根绒毛正在长。
    - id: ch02
      title: 凤凰觉得自己老了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 凤凰栖在壁炉围栏上。它的谈话照旧既有趣又有教益，据说学校发的奖品也是这样。可今天它说话时有些心不在焉，甚至显得悲伤。安西娅俯身从炉火上拿熨斗时，不放心地问起它来。
        - id: ch02-b02
          speaker: anthea
          text: 亲爱的凤凰，你是不是不舒服？
        - id: ch02-b03
          speaker: phoenix
          text: 我没有生病，只是正在老去。
        - id: ch02-b04
          speaker: anthea
          text: 可你才孵出来没多久呀。
        - id: ch02-b05
          speaker: phoenix
          text: 时间由心跳来丈量。自从认识你们，我受过的惊吓足以让任何鸟的羽毛变白。
        - id: ch02-b06
          speaker: robert
          text: 你不是能活五百年吗？这五百年才刚开头，前面还有那么久呢。
        - id: ch02-b07
          speaker: phoenix
          text: 你们大概知道，时间不过是为了方便才编出的东西，世上根本没有时间。这两个月里，我活得那么快，足以慷慨地抵消在沙漠中生活的五百年。我老了，也倦了。我觉得自己该生下那枚蛋，再躺进烈火长眠。可要是不够小心，我会立刻从蛋里重新孵出来，那种不幸我实在受不了。不过，别让这些绝望的个人感慨打扰你们年少的欢乐。今晚演什么？摔跤、角斗，还是长颈豹大战独角兽？
        - id: ch02-b08
          speaker: cyril
          text: 都不是。戏叫《水孩子》。要是跟书里一样，会有扫烟囱的人、教授、龙虾、水獭、鲑鱼，还有住在水里的孩子。
        - id: ch02-b09
          speaker: phoenix
          text: 听起来冷冰冰的。
        - id: ch02-b10
          speaker: jane
          text: 不会真有水吧。剧院又暖和又漂亮，到处是金色装饰和灯。你不想跟我们去吗？
        - id: ch02-b11
          speaker: robert
          text: 我刚才正要请它呢，只是不想打断别人。来吧，凤凰老兄，看戏准能让你高兴。伯契尔先生的戏顶呱呱，真该让你看看去年的《蓬头彼得》。
        - id: ch02-b12
          speaker: phoenix
          text: 你的话虽古怪，我还是愿意去。这个伯契尔的欢宴，也许能让我忘掉岁月的重负。
        - id: ch02-b13
          speaker: narrator
          text: 当晚，凤凰挤进罗伯特伊顿制服的背心里，无论罗伯特还是凤凰，都觉得紧得难受。他们先去餐厅吃饭，那里灯火璀璨，四面镜光闪烁。爸爸穿晚礼服，白衬衫胸前亮得耀眼。妈妈的灰礼服美极了，走动时衣料会变成粉红和绿色。罗伯特只好装成怕冷，不肯脱下大衣。原本该叫人兴奋的晚餐，他却从头到尾热得要命。他觉得自己成了全家优雅光彩里的一块污点，只盼凤凰明白他为它受了多少罪。我们当然都愿意为别人受苦，不过除非是最高尚无私的人，总希望对方知道，而罗伯特正是个普通人。
        - id: ch02-b14
          speaker: narrator
          text: 爸爸不停说笑，大家从头笑到尾，连嘴里塞满食物时也笑，这可不合礼数。爸爸拿罗伯特不肯脱大衣的事开了不少玩笑。罗伯特心想，要是爸爸知道全部真相，大概不会觉得那么可笑。这一点，他多半想得没错。最后一颗葡萄吃完，大家也在手指洗钵里拨完最后一下水。这确实是一顿大人才吃的晚餐。随后，孩子们被带到剧院，引进一个靠近舞台的包厢，独自留在那里。
        - id: ch02-b15
          speaker: father
          text: 不管发生什么，你们都不许走出这个包厢。我会在戏结束以前回来接你们。乖乖听话，自然就会快活。鲍勃斯，这个地带还不够炎热，不能让你舍得抛弃大衣吗？还不能？那我看你准是要生什么病。也许是腮腺炎，也许是麻疹、鹅口疮，或者干脆正在长牙。再见。
        - id: ch02-b16
          speaker: narrator
          text: 爸爸一走，罗伯特总算能脱掉大衣。他擦去满头汗水，放出那只已经压扁、揉乱的凤凰。罗伯特对着包厢后面的镜子整理湿漉漉的头发，凤凰也花了好一阵梳理凌乱的羽毛。等他们两个终于勉强能够见人，演出还远没开始。他们来得实在太早。后来所有灯光终于亮起，凤凰站到镀金椅背上保持平衡，陶醉得前后摇晃。
        - id: ch02-b17
          speaker: phoenix
          text: 多么美丽，比我的神庙美得太多了！你们带我来，是要让我的心充满惊喜吗？我的罗伯特，这里才是我真正的神庙，对不对？从前那座只是被社会抛弃的人去的小祠？
        - id: ch02-b18
          speaker: robert
          text: 我不知道什么被社会抛弃的人。不过你喜欢的话，就把这里叫神庙吧。嘘，音乐开始了。
    - id: ch03
      title: 凤凰的真正神庙
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那出戏的情节就不讲了。前面说过，一个故事没法什么都说。你们自己多半看过《水孩子》，没看过的话，本来想说真可耻，不过还是说很可惜更合适。西里尔、简、罗伯特和安西娅已经享受到了孩子所能享受的最大快乐，可凤凰得到的快乐还要大得多。
        - id: ch03-b02
          speaker: phoenix
          text: 这里果然是我的神庙！多么辉煌的仪式，而且全是为了向我致敬！
        - id: ch03-b03
          speaker: narrator
          text: 凤凰把剧中的每一首歌都当成献给自己的圣歌，把所有合唱当成颂扬自己的赞美诗。它说，那些电灯是专为它点亮的魔法火炬。脚灯更令它着迷，孩子们费了好大劲才劝住它，让它安静坐好。等聚光灯亮起来，它终于按捺不住满心的赞许，拍动金色翅膀，用全剧院都听得见的声音高呼。
        - id: ch03-b04
          speaker: phoenix
          text: 干得好，我的仆人们！你们得到了我的恩宠与嘉许！
        - id: ch03-b05
          speaker: narrator
          text: 舞台上的小汤姆正说着话，听见声音猛地停住。几百个人同时深吸一口气，全场每一双眼睛都转向孩子们的包厢。倒霉的四个人缩成一团。大多数人都在嘘他们，有人叫他们安静，还有人喊着要把他们赶出去。随后戏重新开始，过了一会儿，剧场服务员怒气冲冲地走进包厢训斥他们。
        - id: ch03-b06
          speaker: anthea
          text: 真的不是我们，是这只鸟说的。
        - id: ch03-b07
          speaker: attendant
          text: 那就让你们的鸟安静点。这样打扰所有人可不行。
        - id: ch03-b08
          speaker: robert
          text: 它不会再犯了，我保证。
        - id: ch03-b09
          speaker: phoenix
          text: 你可以退下了。
        - id: ch03-b10
          speaker: attendant
          text: 它倒真漂亮。不过演出时最好盖起来，别让它扰乱表演。
        - id: ch03-b11
          speaker: anthea
          text: 乖凤凰，求你别再开口。你也不想妨碍自己神庙里的仪式吧？
        - id: ch03-b12
          speaker: narrator
          text: 凤凰答应不再高声说话，却不停地对孩子们窃窃私语。它想知道这里为何没有祭坛，没有圣火，也没有香烟。孩子们一次次叫它安静，它却越问越激动，越等越焦躁，最后烦人到了极点。五个同伴中至少有四个打心底希望把它留在家里。下面发生的一切，全是凤凰的错，一点也不能怪剧院里的人。事后谁也不明白火究竟是怎样烧起来的。说谁也不明白并不完全准确，那只有罪的鸟和四个孩子当然知道。
        - id: ch03-b13
          speaker: narrator
          text: 凤凰站在镀金椅背上保持平衡，前后摇摆，又上下晃动，就像你自己家养的鹦鹉会做的那样。我说的是灰色身子、红色尾巴的那一种。所有人的眼睛都望着舞台。那里的龙虾正在唱一首妙不可言的歌，歌名叫《要是不能直着走，那就横着走！》，逗得全场观众心花怒放。就在这时，凤凰却热切地低声抱怨。
        - id: ch03-b14
          speaker: phoenix
          text: 没有祭坛，没有圣火，也没有香烟！
        - id: ch03-b15
          speaker: narrator
          text: 孩子们甚至还来不及想到要阻止，凤凰已经展开明亮的翅膀，绕剧院飞了一圈。闪光的羽毛一路擦过精致的帷幔和镀金木饰。它似乎只在空中划了一道圆弧，便重新落回椅背，快得像暴风雨里掠过灰色水面的海鸥。可它飞过的地方先亮起细小火星，像一粒粒金银丝种子。接着，一缕缕轻烟像正在生长的植物般卷起，一朵朵小火苗又像花苞般绽开。人群起先低声议论，随后便尖叫起来。
        - id: ch03-b16
          speakers: [audience_1, audience_2, audience_3]
          ensemble: chorus
          text: 着火了！着火了！
          emotion: fearful
        - id: ch03-b17
          speaker: narrator
          text: 幕布落下，全场灯光骤然亮起。观众喊叫着冲向出口。
        - id: ch03-b18
          speaker: phoenix
          text: 多么壮丽的主意！一座巨大无比的祭坛，圣火还免费供给。你们没闻见香烟多么芬芳吗？
        - id: ch03-b19
          speaker: narrator
          text: 哪有什么芬芳的香烟，空气里只有令人窒息的烟味、绸缎燃烧的焦味和清漆烤煳的气味。刚才还是花苞的小火苗，此刻已经盛开成巨大的火焰之花。剧院里的人一边大喊，一边推挤，全都拼命朝出口涌去。
        - id: ch03-b20
          speaker: jane
          text: 你怎么能这样！我们快出去！
          emotion: fearful
        - id: ch03-b21
          speaker: anthea
          text: 爸爸叫我们留在这里。
          emotion: fearful
        - id: ch03-b22
          speaker: robert
          text: 他可没叫我们留着被烤熟。我才不学男孩站在燃烧的甲板上呢，多谢了。
        - id: ch03-b23
          speaker: cyril
          text: 谁会学呀。
        - id: ch03-b24
          speaker: narrator
          text: 西里尔打开包厢门，一股猛烈的浓烟和热浪立刻扑进来，逼得他重新把门关上。这条路完全走不通。孩子们又探身越过包厢前沿往下看。他们能不能爬下去？当然可以，可到了下面，处境又能好到哪里去？出口边的人群像熬果酱的季节爬在果酱上的苍蝇，挤得密密麻麻。他们根本穿不过去。
        - id: ch03-b25
          speaker: jane
          text: 真希望我们从来没见过凤凰！
          emotion: fearful
        - id: ch03-b26
          speaker: narrator
          text: 即使在这样可怕的时候，罗伯特仍回头去看凤凰有没有听见。这句话当然很自然，可终究不大礼貌，也谈不上感激。罗伯特不希望凤凰听到以后伤心。然而椅背上已经空了，包厢里也找不到那片金光。凤凰不见了。
        - id: ch03-b27
          speaker: cyril
          text: 我在报纸上读过火灾。我相信不会出事。照爸爸说的，留在这里等吧。
        - id: ch03-b28
          speaker: anthea
          text: 反正我们也没有别的办法。
        - id: ch03-b29
          speaker: robert
          text: 我不害怕，一点也不怕。凤凰从没做过卑鄙的事，它一定会带我们脱险。我信凤凰！
        - id: ch03-b30
          speaker: phoenix
          text: 凤凰感谢你，罗伯特啊。
        - id: ch03-b31
          speaker: narrator
          text: 一个金灿灿的声音忽然从罗伯特脚边响起。大家低头一看，凤凰已经回来了，而他们一直盼望的许愿地毯就铺在它脚下。原来这只鸟并没有丢下他们。
        - id: ch03-b32
          speaker: phoenix
          text: 快站到地毯上真正古老、货真价实的部分，然后——
        - id: ch03-b33
          speaker: narrator
          text: 一道火焰突然蹿起，截断了它的话。唉，凤凰说到自己的本领，不知不觉便热情起来。一时无意间生出的高温，点燃了早晨抹在地毯上的煤油。火烧得十分欢快，孩子们拼命用脚踩，却怎么也踩不灭，只好退到一旁，看着它自行烧尽。煤油烧光时，用苏格兰石南花杂色细绒线补成的地方也全给带走了。最后只剩老地毯原来的织物，而那上面到处都是破洞。
    - id: ch04
      title: 从火场回家
      blocks:
        - id: ch04-b01
          speaker: phoenix
          text: 来吧，我已经凉下来了。
        - id: ch04-b02
          speaker: narrator
          text: 四个孩子小心登上地毯残存的部分。每个人都仔细收好手脚，绝不敢让一只手或一条腿从某个破洞里伸出去。剧院里热得怕人，四周全是火光和浓烟，整座大厅已经变成一口火坑。幸运的是，除了他们，其他人全都逃出去了。地毯剩下的地方实在太少，四个人怎么挪都坐不下，简只好坐到安西娅腿上。
        - id: ch04-b03
          speaker: cyril
          text: 回家！
        - id: ch04-b04
          speaker: narrator
          text: 下一刻，育儿室门缝下的凉风已经吹上他们的腿。他们仍旧坐在地毯上，而地毯正安稳地躺在育儿室原来的位置。它平静得一动不动，仿佛这辈子从未去过剧院，更没参加过一场火灾。四个人同时长长地松了一大口气。过去总惹人讨厌的穿堂风，此刻也舒服极了。他们安全了，其他人也安全。离开火场时，剧院确实已经空无一人，这一点每个人都敢肯定。
        - id: ch04-b05
          speaker: narrator
          text: 过了一会儿，四个人同时说起话来，谁也等不及让别人先说完。他们已经经历过许多奇遇，可从前没有哪一场留下这么多可谈的事，也没有哪一场像这次这样真实。每个人都有一大堆刚才看到、听到和记住的东西，急着提醒其他人。
        - id: ch04-b06
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 你们注意到没有？你们还记不记得？
        - id: ch04-b07
          speaker: narrator
          text: 安西娅的脸忽然在黑灰底下变白了。
        - id: ch04-b08
          speaker: anthea
          text: 妈妈和爸爸！他们会以为我们烧成了灰。我们马上去告诉他们，我们没有烧死！
          emotion: fearful
        - id: ch04-b09
          speaker: cyril
          text: 这样出去，只会跟他们错过。
        - id: ch04-b10
          speaker: anthea
          text: 那你去，不然我去。不过先洗脸。妈妈看见你黑成这样，准会以为你烧焦了，接着昏倒或者病倒。真希望我们没认识凤凰。
        - id: ch04-b11
          speaker: robert
          text: 对它无礼也没用。它大概管不住自己的天性。我们也都该洗洗，我的手还真有点儿——
        - id: ch04-b12
          speaker: narrator
          text: 自从凤凰叫他们踏上地毯，谁也没再留意它。更没人留意到，原来大家都忘了留意它。四个孩子急急忙忙洗脸洗手，不过都只洗掉了一部分黑灰。西里尔正把身子塞进大衣，准备出去寻找父母。他说这件事就像在一捆干草里找一根针，而且这样形容一点也不过分。就在这时，前门忽然响起爸爸插进锁孔的钥匙声。所有孩子立刻跳起来，朝楼梯上奔去。
        - id: ch04-b13
          speaker: mother
          text: 你们都平安吗？都平安吗？
          emotion: fearful
        - id: ch04-b14
          speaker: narrator
          text: 下一刻，妈妈已经跪在门厅的油毡上。她搂住四个刚洗过、还湿漉漉的孩子，想在同一时间把每个人都亲一遍。她一会儿笑，一会儿又哭，完全停不下来。爸爸站在旁边看着，嘴里说着自己真是有福气，或者别的意思差不多的话。又过了好一阵，大家才终于平静到能够交谈。西里尔这才问起，父母怎么会猜到他们已经回了家。
        - id: ch04-b15
          speaker: father
          text: 这事真有些古怪。我们听说加里克剧院着火，当然马上赶了过去。找不到你们，我们也进不去，不过消防员告诉我们，所有人都已经平安出来。随后，有个声音贴着我的耳朵，依次念出西里尔、安西娅、罗伯特和简。还有什么东西碰了碰我的肩膀。我转头只看见一只黄色大鸽子，它正好挡住视线，让我没看清是谁说话。鸽子扑棱着飞开，另一边耳朵又听见一句“他们平安在家”。我再回头找说话的人，要命，那只讨厌的鸽子竟又站到另一边肩上。大概是火场把我弄糊涂了。你们妈妈却说——
        - id: ch04-b16
          speaker: mother
          text: 我说是那只鸟在讲话，本来就是它。至少当时我是这样觉得的。再说，它根本不是鸽子，而是一只橙色的凤头鹦鹉。不管是谁说了那句话，我都不在乎。话是真的，这就够了。你们全都平安在家。
        - id: ch04-b17
          speaker: narrator
          text: 妈妈知道那句报平安的话是真的，也亲眼看见孩子们全都好端端站在面前，可她还是忍不住又哭起来。爸爸看着这一群又湿又黑、疲惫不堪的孩子，说享受完舞台带来的种种乐趣以后，床正是个好去处。于是这场漫长又惊险的夜晚终于安静下来，大家全都上床去了。
    - id: ch05
      title: 必须送走的究竟是谁
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 那天晚上，罗伯特并没有忘记火灾，也没有忘记凤凰闯下的祸。他找到那只金鸟，认真谈了一番，把自己对剧院、火焰和众人安危的感受全说了出来。凤凰听完，并不认为事情已经无法挽回。
        - id: ch05-b02
          speaker: phoenix
          text: 哦，好吧。难道你不知道我有支配火焰的力量吗？不必为剧院的损失烦恼，也不要再为此折磨自己。我和伦巴德街上的那些大祭司一样，能够把火焰做过的事全部撤销，把烧坏的东西恢复原样。现在，请你劳驾替我打开窗户。
        - id: ch05-b03
          speaker: narrator
          text: 罗伯特照办，凤凰从打开的窗口飞了出去。正因如此，第二天的报纸才会说，剧院火灾造成的损失比原先预料的小。其实那场火根本没有造成任何损失，因为凤凰忙了整整一夜，把所有烧坏的东西都一件件恢复了原样。天亮以后，帷幔、木饰和剧场里的其他东西都像从未着过火。剧院经理后来怎样向人解释这件事，有多少剧院工作人员直到今天还相信自己那天晚上发了疯，这些事我们永远不会知道。
        - id: ch05-b04
          speaker: narrator
          text: 第二天早晨，昨晚的惊险似乎已经过去。那张地毯仍铺在育儿室里。妈妈走进来，一眼便看见它本来就补得乱七八糟，如今又多了煤油烧出的一个个破洞。她当然马上追问这是怎么回事。
        - id: ch05-b05
          speaker: anthea
          text: 沾过煤油的地方着火了。
        - id: ch05-b06
          speaker: mother
          text: 我非得马上把这张地毯扔掉不可。
        - id: ch05-b07
          speaker: narrator
          text: 妈妈想摆脱的是地毯。可四个孩子回想着昨晚发生的一切，想起凤凰怎样把整座剧院点燃，又怎样把他们带回家，还怎样连夜修好火场。无论凤凰最后补救得多么彻底，那场大火都实在太惊险了。孩子们彼此望着，用悲伤的声音低低商量。他们说的，却是另一件必须送走的东西。
        - id: ch05-b08
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 我们非得把那只凤凰送走不可。
          emotion: sad
