  chapters:
    - id: ch01
      title: THE BEGINNING OF THE END
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The wishing carpet lay on the nursery floor, patched and darned, with shiny American cloth sewn across its back. Mother looked down at it during breakfast.
        - id: ch01-b02
          speaker: mother
          text: >-
            Well, I must say, I have never bought such a bad bargain in my life.
        - id: ch01-b03
          speakers: [cyril, robert, jane, anthea]
          ensemble: chorus
          text: >-
            Oh!
        - id: ch01-b04
          speaker: narrator
          text: >-
            Mother glanced at them quickly.
        - id: ch01-b05
          speaker: mother
          text: >-
            Of course, I can see that you have mended it very nicely. That was very sweet of you, dears.
        - id: ch01-b06
          speakers: [anthea, jane]
          ensemble: duo
          text: >-
            The boys helped too.
        - id: ch01-b07
          speaker: mother
          text: >-
            Even so, it cost twenty-two shillings and ninepence. For that price, it ought to have lasted for years, and now it looks simply dreadful. Never mind, darlings. You did your best. Next time, I think we'll have coconut matting instead. A carpet certainly does not have an easy life in this room.
        - id: ch01-b08
          speaker: robert
          text: >-
            It isn't our fault that our boots are the really reliable kind, is it, Mother?
        - id: ch01-b09
          speaker: mother
          text: >-
            We cannot help our boots, dear. We might change out of them when we come indoors, though. It is only a little idea of mine. I would never dream of scolding on the very first morning after coming home. Oh, my Lamb! How could you do such a thing?
        - id: ch01-b10
          speaker: narrator
          text: >-
            This conversation happened at breakfast. Until then, the Lamb had behaved beautifully. But while everyone watched the carpet, he needed only a moment to turn a glass dish of sticky blackberry jam upside down on his head. Getting the jam off again took several people and many minutes. The work was interesting enough to drive the carpet from everyone's thoughts. For the moment, no one said another word about Mother's bad bargain or her hopes for coconut matting.

            Once the Lamb was clean, his brothers and sisters had to mind him. Mother was busy with Cook's tangled household accounts. They came on dirty scraps of paper and were meant to explain why all the housekeeping money had become fivepence halfpenny and a pile of unpaid bills. Mother was very clever, but even she could not make sense of them.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The Lamb was delighted to have his brothers and sisters back and had not forgotten a single one of their exhausting games. In Whirling Worlds, they swung him round and round by his hands. In Leg and Wing, they swung him from side to side by one wrist and one ankle. Then came Climbing Vesuvius. The Lamb walked right up one of them until he stood on their shoulders. The child beneath him shouted as loudly as possible to make the burning mountain rumble, then tumbled him gently to the floor and rolled him about for the destruction of Pompeii.
        - id: ch01-b12
          speaker: cyril
          text: >-
            Still, we ought to decide what to say the next time Mother asks about the carpet.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Cyril stopped being a volcano and tried to catch his breath.
        - id: ch01-b14
          speaker: anthea
          text: >-
            You decide, then. Come here, my lovely Lamb. Come and play Noah's Ark with Panther.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The Lamb's hair was rumpled and his face was dusty from the fall of Pompeii. He wriggled into Anthea's arms and became a hissing baby snake.
        - id: ch01-b16
          speaker: anthea
          text: >-
            I love my little baby snake. He hisses when he is awake. He creeps with such a wriggly creep. He wriggles even in his sleep.
        - id: ch01-b17
          speaker: lamb
          text: >-
            Crocky!
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: >-
            He showed every one of his little teeth, so Anthea changed the verse.
        - id: ch01-b19
          speaker: anthea
          text: >-
            I love my little crocodile. I love his truthful, toothful smile. It is so wonderful and wide. I like to see it from outside.
        - id: ch01-b20
          speaker: cyril
          text: >-
            It is the same old trouble. Mother cannot believe the real truth about the carpet, and—
        - id: ch01-b21
          speaker: narrator
          text: >-
            The Phoenix came out of the cupboard among the black beetles, torn books, broken slates, and lonely pieces of toys.
        - id: ch01-b22
          speaker: phoenix
          text: >-
            You speak truly, O Cyril. Now listen to the wisdom of the Phoenix, son of the Phoenix—
        - id: ch01-b23
          speaker: cyril
          text: >-
            There is a society with that name.
        - id: ch01-b24
          speaker: phoenix
          text: >-
            Where is it? And what is a society?
        - id: ch01-b25
          speaker: cyril
          text: >-
            It is a group of people joined together. A brotherhood, sort of. Well, it is something a little like your temple, except that it is completely different.
        - id: ch01-b26
          speaker: phoenix
          text: >-
            I understand. I should like to see these people who call themselves Sons of the Phoenix.
        - id: ch01-b27
          speaker: cyril
          text: >-
            What happened to your wisdom?
        - id: ch01-b28
          speaker: phoenix
          text: >-
            Wisdom is welcome at any time.
        - id: ch01-b29
          speaker: lamb
          text: >-
            Pretty Polly!
          emotion: happy
        - id: ch01-b30
          speaker: narrator
          text: >-
            The Lamb reached for the golden bird. The Phoenix modestly slipped behind Robert, while Anthea distracted the Lamb with another rhyme.
        - id: ch01-b31
          speaker: anthea
          text: >-
            I love my little baby rabbit, but oh, he has a dreadful habit of paddling out among the rocks and soaking both his bunny socks.
        - id: ch01-b32
          speaker: robert
          text: >-
            I don't think you would really like the Sons of the Phoenix. From what I have heard, they do nothing fiery at all. They simply drink a great deal. They drink lemonade and fizzy things, and much more than other people, because they believe the more they drink, the more good it does them.
        - id: ch01-b33
          speaker: jane
          text: >-
            Better in their minds, perhaps. It would not improve their bodies. They would get all balloony.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The Phoenix yawned.
        - id: ch01-b35
          speaker: anthea
          text: >-
            Wait, I have an idea. This is not an ordinary carpet. It is very magical. What if we put Tatcho on it and let it rest? Perhaps the magical part would grow again, the way hair is supposed to.
        - id: ch01-b36
          speaker: robert
          text: >-
            Perhaps. Paraffin might work just as well, though. Tatcho's smell seems to be the important part.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Anthea's idea had faults, but at least it gave them something to do. Cyril fetched the Tatcho from Father's washstand. There was not much left.
        - id: ch01-b38
          speaker: jane
          text: >-
            We must not use every drop. Father's hair might suddenly start falling out. If he had nothing to put on it, he might lose every bit before Eliza could get around to the chemist for another bottle. Having a bald father would be dreadful, especially when it was all our fault.
        - id: ch01-b39
          speaker: anthea
          text: >-
            Wigs are terribly expensive too, I believe. Leave enough in the bottle to wet Father's whole head if an emergency happens. We can make up the rest with paraffin. I expect the smell is what really does the good, and the two things smell exactly alike.
        - id: ch01-b40
          speaker: narrator
          text: >-
            They poured one small teaspoonful of Tatcho around the edges of the carpet's worst darn and carefully rubbed it into the roots of the remaining hairs. There was not enough for every damaged place, so they rubbed paraffin into all the other parts with a piece of flannel. When the work was done, they burned the flannel. It made a bright, cheerful flame that delighted both the Phoenix and the Lamb.
        - id: ch01-b41
          speaker: mother
          text: >-
            How many times must I tell you not to play with paraffin? What have you been doing?
          emotion: angry
        - id: ch01-b42
          speaker: anthea
          text: >-
            We burned a rag with paraffin on it.
        - id: ch01-b43
          speaker: narrator
          text: >-
            There was no point explaining what they had done to the carpet. Mother did not know it was magical, and nobody likes being laughed at for treating an ordinary carpet with lamp oil.
        - id: ch01-b44
          speaker: mother
          text: >-
            Do not do it again. Now, no more gloomy faces. Father has sent a telegram. Look!
        - id: ch01-b45
          speaker: narrator
          text: >-
            The children held the telegram by its floppy corners and read Father's message. He had booked a box for them at the Garrick Theatre and stalls for himself and Mother at the Haymarket. They were all to meet at Charing Cross at half past six.
        - id: ch01-b46
          speaker: mother
          text: >-
            You four are going to see The Water Babies all by yourselves. Father and I will take you there and collect you afterward. Give me the Lamb. You and Jane must put clean lace on your red evening dresses. They may need ironing too. This paraffin smell is ghastly, so run along and fetch them.
        - id: ch01-b47
          speaker: narrator
          text: >-
            The dresses needed a great deal of ironing. They were made of tomato-red Liberty silk and had often served in tableaux whenever Cardinal Richelieu needed a red robe. Those tableaux had been splendid, and there were many stories to tell about them. Once, during the Princes in the Tower, a pillow burst and covered both young princes in feathers. The picture might just as well have been called Michaelmas Eve, or Plucking the Geese.

            Sewing in the lace and ironing the dresses took a long time, but nobody was bored. They had the theatre to look forward to. They also had the possible return of the carpet's hairs, and everyone kept looking anxiously for signs of growth. By four o'clock, Jane felt almost certain that several new hairs had begun to appear.
        - id: ch01-b48
          speaker: narrator
          text: >-
            The Phoenix sat on the fender. Its talk was as entertaining and instructive as school prizes are said to be, but the bird seemed distracted and rather sad.
        - id: ch01-b49
          speaker: anthea
          text: >-
            Are you feeling ill, dear Phoenix?
        - id: ch01-b50
          speaker: narrator
          text: >-
            Anthea bent to take an iron from the fire. The golden bird shook its head gloomily.
        - id: ch01-b51
          speaker: phoenix
          text: >-
            I am not ill. I am growing old.
          emotion: sad
        - id: ch01-b52
          speaker: anthea
          text: >-
            But you were only hatched a little while ago.
        - id: ch01-b53
          speaker: phoenix
          text: >-
            Time is measured in heartbeats. Since meeting you, I have had enough palpitations to turn any bird's feathers white.
        - id: ch01-b54
          speaker: robert
          text: >-
            I thought you lived for five hundred years. You have hardly started this set. Think how much time you still have.
        - id: ch01-b55
          speaker: phoenix
          text: >-
            Time, as you surely know, is only a convenient fiction. There is really no such thing. I have lived these last two months at such a pace that they easily balance five hundred years in the desert. I am old. I am tired. I feel ready to lay my egg and lie down for my fiery sleep. Yet if I am not careful, I shall hatch again at once, and I truly could not endure that misfortune. But I must not force these desperate personal thoughts upon your young happiness. Tell me about tonight's entertainment. Will there be wrestlers? Gladiators? A battle between cameleopards and unicorns?
          emotion: sad
        - id: ch01-b56
          speaker: cyril
          text: >-
            I don't think so. It is called The Water Babies. If it follows the book, there will be chimney sweeps and professors, a lobster, an otter, a salmon, and children who live in water. No gladiators.
        - id: ch01-b57
          speaker: phoenix
          text: >-
            It sounds cold.
        - id: ch01-b58
          speaker: narrator
          text: >-
            The Phoenix shivered and moved onto the tongs.
        - id: ch01-b59
          speaker: jane
          text: >-
            There probably won't be real water. Theatres are warm and pretty, with gold everywhere and lots of lamps. Would you like to come?
        - id: ch01-b60
          speaker: robert
          text: >-
            I was just going to ask that. I only waited because I know how rude it is to interrupt. Do come, old chap. It will cheer you up and make you laugh like anything. Mr. Bourchier always puts on ripping plays. You should have seen Shock-Headed Peter last year.
        - id: ch01-b61
          speaker: phoenix
          text: >-
            Your expressions are strange, but I shall come. Perhaps the festivities of this Bourchier will help me forget the burden of my years.
        - id: ch01-b62
          speaker: narrator
          text: >-
            That evening, the Phoenix tucked itself inside the waistcoat of Robert's Eton suit. Both Robert and the Phoenix found it a very tight fit.

            At the glittering restaurant, mirrors shone on every wall. Father wore evening clothes with a dazzling white shirtfront. Mother looked lovely in a gray evening dress that changed to pink and green whenever she moved. Robert had to pretend he was cold so he could keep on his greatcoat and hide the Phoenix beneath it.
        - id: ch01-b63
          speaker: narrator
          text: >-
            He sweltered through what should have been a thrilling meal. Beside all the smart beauty of his family, he felt like an ugly spot, and he hoped the Phoenix understood what he was enduring for its sake. Most of us are glad to suffer for others, but unless we belong to the very best and noblest sort, we do like those people to know about it. Robert was quite ordinary.

            Father filled the dinner with jokes, and everyone laughed even when their mouths were full. Robert thought Father would not tease him so much about his greatcoat if he knew the truth. He was probably right.
        - id: ch01-b64
          speaker: narrator
          text: >-
            At last, after the final grape and the final paddle in the finger bowls, the grown-up dinner ended. Father and Mother took the children to the Garrick, showed them into a box near the stage, and left them there.
        - id: ch01-b65
          speaker: father
          text: >-
            Whatever happens, do not leave this box. I will return before the play ends. Be good, and you will be happy. Is this tropical region still too cold for you to remove your greatcoat, Bobs? No? Then you must be coming down with something. Mumps, measles, thrush, or perhaps teething. Goodbye.
        - id: ch01-b66
          speaker: narrator
          text: >-
            As soon as Father had gone, Robert pulled off his coat, wiped his streaming forehead, and released the crushed, untidy Phoenix. Robert smoothed his damp hair at the mirror behind the box. The Phoenix spent just as long putting its feathers in order.

            They had arrived very early. When all the lights rose, the Phoenix balanced on the gilded back of a chair and swayed with delight.
        - id: ch01-b67
          speaker: phoenix
          text: >-
            What a beautiful sight! It is far lovelier than my temple. Or have I understood at last? Did you bring me here to fill my heart with joyful surprise? Tell me, Robert. Is this my true temple, while the other was only a poor little shrine used by outcasts?
          emotion: happy
        - id: ch01-b68
          speaker: robert
          text: >-
            I don't know about the outcasts. You may call this your temple if you like. Quiet now. The music is starting.
        - id: ch01-b69
          speaker: narrator
          text: >-
            There is no need to describe the play. Perhaps you saw The Water Babies yourself. If you did not, that was a pity.

            Cyril, Jane, Robert, and Anthea enjoyed it as much as children possibly could. The Phoenix enjoyed it far more.
        - id: ch01-b70
          speaker: phoenix
          text: >-
            This truly is my temple. What glorious ceremonies! And every one of them is performed in my honor!
          emotion: happy
        - id: ch01-b71
          speaker: narrator
          text: >-
            Every song in the play sounded to the Phoenix like a hymn in its honor. Every chorus seemed to sing its praises. It declared that the electric lights were magical torches kindled especially for it. The footlights pleased it so much that the children could barely persuade it to sit still. Then the limelight shone. At that, the Phoenix could contain its approval no longer. It spread its golden wings and called in a voice that carried across the whole theatre.
        - id: ch01-b72
          speaker: phoenix
          text: >-
            Well done, my servants! You have earned my favor and my approval!
          emotion: happy
        - id: ch01-b73
          speaker: narrator
          text: >-
            Little Tom stopped in the middle of his speech onstage. Hundreds of lungs drew one deep breath. Every eye in the theatre turned toward the box, where the unlucky children tried to shrink out of sight. Most of the audience hissed or cried, “Shush!” Others demanded, “Turn them out!” At last the play began again. A little later, an angry attendant arrived to speak to the children.
        - id: ch01-b74
          speaker: anthea
          text: >-
            It wasn't us. Truly, it was the bird.
        - id: ch01-b75
          speaker: attendant
          text: >-
            Then you must keep your bird quiet. It is disturbing everyone.
          emotion: angry
        - id: ch01-b76
          speaker: robert
          text: >-
            It will not happen again. I'm certain it won't.
        - id: ch01-b77
          speaker: phoenix
          text: >-
            You have my permission to leave.
        - id: ch01-b78
          speaker: attendant
          text: >-
            Well, he certainly is a beauty. But cover him during the acts. He is upsetting the performance.
        - id: ch01-b79
          speaker: narrator
          text: >-
            The attendant left.
        - id: ch01-b80
          speaker: anthea
          text: >-
            Please do not speak again. You would not want to interrupt your own temple, would you?
        - id: ch01-b81
          speaker: narrator
          text: >-
            The Phoenix made no more loud speeches, but it kept whispering to the children. It wanted to know why its temple had no altar, no fire, and no incense. With every question it became more excited, fretful, and tiresome. Before long, at least four members of their party of five deeply wished they had left it at home.
        - id: ch01-b82
          speaker: narrator
          text: >-
            What followed was entirely the Phoenix's fault. None of it was the fault of the theatre staff. Afterward, no one could understand how the disaster had happened at all. No one understood, that is, except the guilty bird and the four children.

            The Phoenix rocked up and down on the gilded chair back, as a gray parrot with a red tail might do at home. Everyone was watching the stage. The lobster was singing that if you cannot walk straight, you should walk sideways.
        - id: ch01-b83
          speaker: phoenix
          text: >-
            No altar, no fire, no incense!
        - id: ch01-b84
          speaker: narrator
          text: >-
            Before any child could even begin to stop it, the Phoenix opened its bright wings and swept around the theatre. Its shining feathers brushed against delicate curtains and gilded woodwork as it flew.

            It seemed to make only one great sweep around the theatre, like a gull circling over gray water on a stormy day. The next moment, it was perched on the chair again. Along the path it had flown, tiny sparks glittered like tinsel seeds. Little wreaths of smoke curled upward like growing plants. Then small flames opened like flower buds. First people whispered to one another. Then they screamed.
        - id: ch01-b85
          speakers: [audience_member_1, audience_member_2, audience_member_3]
          ensemble: chorus
          text: >-
            Fire! Fire!
          emotion: fearful
        - id: ch01-b86
          speaker: narrator
          text: >-
            The curtain dropped and the house lights blazed. Everyone rushed toward the doors.
        - id: ch01-b87
          speaker: phoenix
          text: >-
            What a magnificent idea! One enormous altar, with the fire supplied for nothing. And does the incense not smell delightful?
          emotion: happy
        - id: ch01-b88
          speaker: narrator
          text: >-
            There was no incense at all. The air held only the choking smell of smoke, burning silk, and scorching varnish. By now, the small flames had opened into great flowers of fire. Across the theatre, people shouted and pressed toward the exits.
        - id: ch01-b89
          speaker: jane
          text: >-
            Oh, how could you do this? We have to get out!
          emotion: fearful
        - id: ch01-b90
          speaker: anthea
          text: >-
            Father told us to stay here.
          emotion: fearful
        - id: ch01-b91
          speaker: narrator
          text: >-
            Anthea had turned very pale, but she tried to use her ordinary voice.
        - id: ch01-b92
          speaker: robert
          text: >-
            He did not mean we should stay and be roasted. I am not going down with a burning ship, thank you.
        - id: ch01-b93
          speaker: cyril
          text: >-
            Neither am I.
        - id: ch01-b94
          speaker: narrator
          text: >-
            Cyril opened the box door. A fierce wave of smoke and hot air struck him and forced him to slam it shut. They could not possibly escape that way.

            They leaned over the front of the box and looked down. They could probably climb to the floor. But even if they did, would they be any safer? The crowd packed around the exits was as thick as flies during jam-making season.
        - id: ch01-b95
          speaker: anthea
          text: >-
            Look at all those people. We could never get through them.
          emotion: fearful
        - id: ch01-b96
          speaker: jane
          text: >-
            I wish we had never met the Phoenix!
          emotion: fearful
        - id: ch01-b97
          speaker: narrator
          text: >-
            Even then, Robert turned to see whether the bird had heard. Jane's words were natural enough, but they were hardly polite or grateful.

            The Phoenix had vanished.
        - id: ch01-b98
          speaker: cyril
          text: >-
            Listen. I have read newspaper stories about fires, and I am sure it will be all right. We should wait here, just as Father said.
        - id: ch01-b99
          speaker: anthea
          text: >-
            There is nothing else we can do.
          emotion: sad
        - id: ch01-b100
          speaker: robert
          text: >-
            I am not frightened. Truly, I am not. The Phoenix has never behaved like a skunk before. I know it will save us somehow. I believe in the Phoenix!
        - id: ch01-b101
          speaker: phoenix
          text: >-
            The Phoenix thanks you, O Robert.
        - id: ch01-b102
          speaker: narrator
          text: >-
            The golden voice came from their feet. There stood the Phoenix on the wishing carpet.
        - id: ch01-b103
          speaker: phoenix
          text: >-
            Quickly! Stand only on the parts of the carpet that are truly ancient and genuine, and—
        - id: ch01-b104
          speaker: narrator
          text: >-
            A sudden jet of fire cut it off. The Phoenix had grown warm while speaking and, in the heat of the moment, accidentally ignited the paraffin they had rubbed into the carpet that morning. It burned merrily. The children tried again and again to stamp out the flames, but nothing helped. At last they had to step away and let the paraffin burn itself out.

            Every darn made from Scotch heather-mixture fingering burned with it. Only the old carpet remained, and it was full of holes.
        - id: ch01-b105
          speaker: phoenix
          text: >-
            Come now. I am cool again.
        - id: ch01-b106
          speaker: narrator
          text: >-
            The four children climbed onto what was left of the carpet. They were very careful not to leave a hand or leg hanging through one of its holes. There was so little sound fabric left that Jane had to sit on Anthea's lap. Around them, the theatre had become a pit of fire. By then, everyone else had escaped.
        - id: ch01-b107
          speaker: cyril
          text: >-
            Home!
        - id: ch01-b108
          speaker: narrator
          text: >-
            At once, the cool draft beneath the nursery door played across their legs. They were all still sitting on the carpet. It lay in its proper place on the nursery floor, calm and unmoved, as though it had never visited a theatre or taken part in a fire in its life.

            Four deep breaths of relief came at once. For once, the draft they usually disliked felt pleasant. They were safe. Everyone else was safe too. The theatre had been empty when they left, and all four were certain of it.
        - id: ch01-b109
          speaker: narrator
          text: >-
            Soon all four were talking at the same time. Somehow, none of their earlier adventures had given them so much to discuss, and no other adventure had ever seemed so real. Again and again, one child began with, “Did you notice?” while another asked, “Do you remember?” Then Anthea suddenly stopped. Her face went pale beneath the dirt and soot it had gathered during the fire.
        - id: ch01-b110
          speaker: anthea
          text: >-
            Mother and Father! This is awful. They will think we were burned to cinders. We must go at once and tell them we are alive.
          emotion: fearful
        - id: ch01-b111
          speaker: cyril
          text: >-
            We would only miss them on the way.
        - id: ch01-b112
          speaker: anthea
          text: >-
            Then you go, or I will. Wash your face first. If Mother sees you as black as that, she will think you really were burned. She might faint or become ill. Oh, I wish we had never met that Phoenix.
          emotion: fearful
        - id: ch01-b113
          speaker: robert
          text: >-
            Hush. There is no reason to insult the bird. It cannot help its nature. We had better wash too. Now that I look, my hands are rather—
        - id: ch01-b114
          speaker: narrator
          text: >-
            No one had noticed the Phoenix since it told them to step onto the carpet at the theatre. Strangely enough, no one noticed that they had failed to notice it.

            They had partly cleaned themselves, and Cyril was pulling on his greatcoat to search for their parents. He called it looking for a needle in a bundle of hay, and that was not unfair. Then Father's key turned in the front door. Every child bounded upstairs.
        - id: ch01-b115
          speaker: mother
          text: >-
            Are you all safe? Are you all safe?
          emotion: fearful
        - id: ch01-b116
          speaker: narrator
          text: >-
            The next moment, Mother dropped to her knees on the hall linoleum and tried to kiss all four damp children at once. One moment she laughed, and the next she cried. Father stood watching the whole scene and said that he was blessed, or something like it.

            Later, when everyone was calm enough to talk, Cyril asked the question.
        - id: ch01-b117
          speaker: cyril
          text: >-
            How did you know we had come home?
        - id: ch01-b118
          speaker: father
          text: >-
            It was a very odd business. We heard the Garrick was burning, so naturally we went straight there. We could not find you or get inside, but the firemen said everyone had escaped safely. Then a voice beside my ear said, “Cyril, Anthea, Robert, and Jane,” and something touched my shoulder. A huge yellow pigeon was there, blocking my view of whoever had spoken. It flew off. Then a voice at my other ear said, “They are safe at home.” I turned, and that confounded pigeon was sitting on my other shoulder. The fire must have dazed me. Your mother thought the voice belonged to—
        - id: ch01-b119
          speaker: mother
          text: >-
            I said the bird had spoken, and it had. At least, that was what I thought then. It was not a pigeon. It was an orange cockatoo. I do not care who spoke. The message was true, and you are safe.
        - id: ch01-b120
          speaker: narrator
          text: >-
            Mother began to cry again. Father announced that after the pleasures of the stage, bed was the best place for everyone. So everyone went there.

            That night, Robert spoke privately with the Phoenix. He told the bird exactly how he felt about the fire.
        - id: ch01-b121
          speaker: phoenix
          text: >-
            Very well. Did you not know that I command fire? Do not upset yourself. Like my high priests in Lombard Street, I can reverse the work of flames. Please open the window.
        - id: ch01-b122
          speaker: narrator
          text: >-
            The Phoenix flew out through the open window.

            That is why the next day's papers reported that the theatre fire had caused less damage than expected. In fact, it had caused no damage at all. The Phoenix spent the entire night undoing the flames' work and putting everything right. How the theatre management explained this will never be known. Neither will anyone know how many officials still believe that they went mad on the night of the fire.
        - id: ch01-b123
          speaker: narrator
          text: >-
            The next day, Mother saw the burned holes in the carpet.
        - id: ch01-b124
          speaker: anthea
          text: >-
            It caught fire where the paraffin was.
        - id: ch01-b125
          speaker: mother
          text: >-
            I must get rid of that carpet immediately.
        - id: ch01-b126
          speaker: narrator
          text: >-
            The children thought over everything that had happened the night before. Then, in sad whispers, they reached their own decision.
        - id: ch01-b127
          speakers: [cyril, robert, jane, anthea]
          ensemble: chorus
          text: >-
            We must get rid of that Phoenix.
          emotion: sad
