audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带一点英式童话的机智
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明自信，挖苦人时一本正经
        timbre: 清脆的少年声
        pace: 中等偏快
        pitch: 中高
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴敏锐，急切时仍然清楚
        timbre: 柔和明亮的少女声
        pace: 中等
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 坚持己见，认真里常带几分莽撞
        timbre: 结实清朗的少年声
        pace: 中等
        pitch: 中等
    jane:
      display_name: 简
      tts:
        delivery: 天真直率，话里带着小孩子的认真
        timbre: 稚嫩柔软的女孩声
        pace: 稍慢
        pitch: 偏高
    mother:
      display_name: 妈妈
      tts:
        delivery: 明快稳妥，严厉时干脆利落
        timbre: 温和清晰的成年女声
        pace: 中等
        pitch: 中等
    father:
      display_name: 爸爸
      tts:
        delivery: 宽厚随和，偶尔带不自觉的幽默
        timbre: 沉稳温暖的成年男声
        pace: 从容
        pitch: 中低
    carpet_seller:
      display_name: 地毯商人
      tts:
        delivery: 油滑急促，受质疑时立刻恼火
        timbre: 粗哑的成年男声
        pace: 偏快
        pitch: 中等
    phoenix:
      display_name: 凤凰
      tts:
        delivery: 文雅自负，庄重中带着敏锐的幽默
        timbre: 华美清润，中性而成熟
        pace: 从容
        pitch: 中高
  chapters:
    - id: ch01
      title: 那枚蛋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 十一月五日眼看就要到了。就在这时候，不知是谁先犯了疑心，我猜多半是罗伯特。他开始担心，为盖伊·福克斯之夜买来的烟火会不会不大可靠。
        - id: ch01-b02
          speaker: robert
          text: 那些烟火便宜得太吓人了。要是到了晚上一个也不响，普罗瑟家的孩子非笑死我们不可。
        - id: ch01-b03
          speaker: jane
          text: 我买的肯定没事。店里的人说了，这些东西值三倍倍的价钱呢。
        - id: ch01-b04
          speaker: anthea
          text: “三倍倍”肯定不合语法。
        - id: ch01-b05
          speaker: cyril
          text: 当然不合。一个词孤零零的，哪来的语法？所以你不用摆出那么聪明的样子。
        - id: ch01-b06
          speaker: narrator
          text: 安西娅正想从脑子里翻出一句最难听的话回敬他，忽然想起外面那场大雨，也想起男孩子们没坐成电车顶层去伦敦有多失望。妈妈原来答应过，只要他们连续六天放学回来都记得在门垫上擦鞋，就奖给他们这趟电车旅行。
        - id: ch01-b07
          speaker: anthea
          text: 你自己也别那么聪明，松鼠。那些烟火看着挺好的。今天省下来的八便士车钱还能再买点东西，八便士准够买一个特别漂亮的凯瑟琳轮转花。
        - id: ch01-b08
          speaker: cyril
          text: 也许够吧。可那八便士反正不是你的。
        - id: ch01-b09
          speaker: robert
          text: 你们先听我说，我是认真的。烟火到底怎么办？我们不能在隔壁那几个孩子面前出丑。他们不过星期天穿得起红丝绒，就觉得别人谁也不算什么。
        - id: ch01-b10
          speaker: anthea
          text: 丝绒再好我也不穿。除非我是苏格兰女王玛丽，正等着人来砍头，那我才肯穿一身黑丝绒。
        - id: ch01-b11
          speaker: narrator
          text: 罗伯特还是不肯放过自己的主意。这正是他的特点。他一旦咬住一个想法，谁也别想让他松口。
        - id: ch01-b12
          speaker: robert
          text: 我看，咱们应该先试放一个。
        - id: ch01-b13
          speaker: cyril
          text: 你真是个小笨蛋。烟火和邮票一样，用过一次就没有了。
        - id: ch01-b14
          speaker: robert
          text: 那广告上说“卡特牌种子，经过检验”，你以为检验是什么意思？
        - id: ch01-b15
          speaker: narrator
          text: 大家顿时没话说了。过了一会儿，西里尔用手指敲敲自己的额头，又摇了摇头。
        - id: ch01-b16
          speaker: cyril
          text: 这儿有点不对了。我早就担心可怜的罗伯特会变成这样。谁让他那么聪明，代数又总考第一呢？脑子迟早要坏掉的。
        - id: ch01-b17
          speaker: robert
          text: 闭嘴！你还不明白吗？种子要是全种下去，就没法先检验了。只从这儿拿几粒，那儿拿几粒，要是它们都发芽，剩下的多半也会……爸爸怎么说的来着？对了，“符合样品”。烟火也该抽个样。大家闭上眼，各摸一个出来试放。
          emotion: angry
        - id: ch01-b18
          speaker: jane
          text: 可外面雨下得那么大呀。
        - id: ch01-b19
          speaker: robert
          text: 安妮女王也早就死了。我们又不用出去。把桌子挪开，在那只玩滑雪橇的旧茶盘里点就行。反正我是非找点事情做不可，而且这件事真的有用。这样咱们就不只是盼着烟火能吓到普罗瑟家，咱们还能先知道它到底响不响。
        - id: ch01-b20
          speaker: narrator
          text: 这会儿大家的脾气都不太好。
        - id: ch01-b21
          speaker: cyril
          text: 好吧，至少有件事可做了。
        - id: ch01-b22
          speaker: narrator
          text: 他们把桌子往后一推，地毯上的破洞便全露了出来，实在难看。那洞本来在窗边，后来他们把地毯掉了个头，才算遮住。安西娅踮着脚溜出去，趁厨娘没留神拿来茶盘，正好压在洞上。接着，所有烟火都摆到了桌上。四个孩子闭紧眼睛，各自伸手一抓。罗伯特抽中一挂爆竹，西里尔和安西娅各摸到一支罗马烛。偏偏简那只胖乎乎的小手，抓到了整堆烟火里最宝贝的东西，那只值整整两先令的盒中跳偶。至少有一个人咬定简是故意的。我不说是谁，因为那个人后来也后悔了。谁都不高兴。可这四个孩子天性正直，最讨厌暗地里耍花样。他们还有一条绝不能改的规矩，简直像米底人和波斯人的法律。不管是抛钱币、抽签，还是用别的办法碰运气，只要结果出来了，就一定得认。
        - id: ch01-b23
          speaker: jane
          text: 我不是故意的。我不要这个，让我再抽一次吧。
          emotion: sad
        - id: ch01-b24
          speaker: cyril
          text: 你明知道不能重抽。结果已经定了，这是米底和波斯的规矩。你抽中了就得认，我们也只能认倒霉。算了，五号之前你还会拿到零花钱。不管怎样，盒中跳偶留到最后再放，至少让我们多看一会儿。
        - id: ch01-b25
          speaker: narrator
          text: 他们先点了爆竹和罗马烛。按价钱来说，效果一点也不差。可是轮到盒中跳偶，它却只坐在茶盘里嘲笑他们。这是西里尔的说法。他们拿纸来引火，又一根接一根地点火柴。普通火柴全试过以后，他们甚至跑到门厅，从爸爸那件次好的大衣口袋里找出维苏威牌引火火柴，结果仍然点不着。安西娅便悄悄去了楼梯下面的柜子。那儿放着扫帚和簸箕，也放着带松脂的引火木块。那些木块又香又好闻，像一片长满松树的树林。柜子里还有旧报纸、蜂蜡和松节油，有擦黄铜和家具的硬脏破布，也有点灯用的煤油。她回来时，手里拿着一只小罐。罐子装满红醋栗果冻时值七个半便士，如今果冻已经吃光，安西娅往里面灌满了煤油。她进门时，西里尔正拿第二十三根火柴去点盒中跳偶。安西娅把煤油泼进了茶盘。盒中跳偶照旧不肯着，煤油的反应可完全不同。一道滚烫的火焰猛地蹿起来，西里尔的睫毛一下被烧掉。四个孩子来不及往后跳，脸都让火燎了一下。他们同时猛退，一直退到墙边，再也没地方可退。火柱已经从地板直冲天花板。
        - id: ch01-b26
          speaker: cyril
          text: 我的天哪，安西娅，这回你可真闯祸了。
          emotion: surprised
        - id: ch01-b27
          speaker: narrator
          text: 火焰贴着天花板向四周铺开，活像莱德·哈格德先生那本艾伦·夸特曼历险故事里盛开的火玫瑰。罗伯特和西里尔只看了一眼，就知道一刻也不能耽搁。他们一把掀起地毯边缘，朝茶盘踢过去。冲天的火柱被地毯截断，转眼便消失不见。屋里只剩下一片浓烟，还有灯芯调得太低时才会冒出的那股难闻气味。大家马上扑上去抢救。煤油火眼看只剩下一团被他们乱脚踩住的地毯，脚下却突然传来一声尖厉的爆裂，吓得几个业余消防员全都跳开。紧接着又是一声爆响。地毯竟然动了起来，仿佛里面裹着一只猫。原来盒中跳偶终于肯被点着了，这会儿正在地毯下面不要命地猛烈爆炸。
        - id: ch01-b28
          speaker: narrator
          text: 罗伯特摆出一副除此以外再没有别的办法的神气，冲到窗前，一把推开了窗户。安西娅尖叫起来，简干脆放声大哭。西里尔则抓住桌子，把它整个翻过来，倒扣在那堆地毯上。可盒中跳偶仍在桌子底下砰砰乱炸，爆裂声一阵接着一阵，火星也不停地向外飞溅。下一刻，妈妈听见安西娅的嚎叫，冲进了房间。又过了一小会儿，烟火总算完全安静。死一般的寂静里，四个孩子面面相觑。他们先看见彼此乌黑的脸，又从眼角偷偷去瞟妈妈煞白的脸。
        - id: ch01-b29
          speaker: narrator
          text: 育儿室的地毯毁了，谁也不觉得意外。这场冒险紧接着以“上床睡觉”收尾，同样没人惊讶。有人说条条大路通罗马。也许真是这样，可我敢肯定，一个人年纪还小时，很多条路都通向床铺，而且到了那里就戛然而止，至少你得老老实实停在那里。剩下的烟火全被没收。后来爸爸亲自在后花园放掉了。妈妈很不高兴。
        - id: ch01-b30
          speaker: father
          text: 亲爱的，不这么处理，还能拿它们怎么办呢？
        - id: ch01-b31
          speaker: narrator
          text: 要知道，爸爸忘了孩子们这会儿正在受罚。他也完全忘记了，孩子们卧室的窗户恰好正对着后花园。所以他亲手燃放的那些烟火，孩子们一个不少，全都看得清清楚楚。他们不但看见了，还十分欣赏爸爸放烟火时那套熟练的手法。
        - id: ch01-b32
          speaker: narrator
          text: 第二天，大家已经把事情忘了，也原谅了彼此。只是育儿室非得彻底大扫除一回，跟春季扫除差不多，连天花板也要重新刷白。妈妈出了门。下午正要喝茶时，一个男人送来一卷地毯。爸爸付了钱，妈妈先把话说清楚。
        - id: ch01-b33
          speaker: mother
          text: 要是这张地毯的成色不好，我会让你来换的。
        - id: ch01-b34
          speaker: carpet_seller
          text: 太太，这张地毯一根线都没坏，您再找不到这么划算的买卖了。按这个价钱卖给您，我心里还真有一大半舍不得。不过女士开了口，咱们怎么好拒绝呢，先生？
        - id: ch01-b35
          speaker: narrator
          text: 他朝爸爸眨了眨眼，这才离开。地毯随即铺进育儿室，果然从这头到那头连一个洞也没有。最后一折刚刚摊开，一个硬邦邦的东西咚地滚了出来，沿着育儿室的地板骨碌碌跑远。孩子们一齐扑过去，西里尔最先把它抢到手。他拿到煤气灯下细看。那东西形状像一枚蛋，颜色鲜黄，明亮发光，又有一点透明。里面藏着一团奇怪的光，手里的角度一变，那光也会跟着移动。它仿佛是一枚石头做成的蛋，淡淡的火焰却隔着石壳，在里面做它的蛋黄。
        - id: ch01-b36
          speaker: cyril
          text: 妈妈，这个可以留给我吧？
        - id: ch01-b37
          speaker: narrator
          text: 妈妈当然不答应。她花钱买的只是一张地毯，可没有买一枚装着火焰蛋黄的石头蛋，所以这东西必须还给送地毯的人。她告诉孩子们那家店的位置。店在肯蒂什镇路上，离一家叫“公牛与大门”的旅店不远。那地方又小又挤，地毯商正费力把家具一件件摆到人行道上，还尽量不让人看见破得最厉害的地方。他一见到孩子们就认了出来，还没等他们开口，自己先嚷上了。
        - id: ch01-b38
          speaker: carpet_seller
          text: 想也别想！我绝不会收回什么地毯。你们别打这种该死的主意。买卖已经做成，那张地毯从里到外都好得很。
          emotion: angry
        - id: ch01-b39
          speaker: cyril
          text: 我们不是来退地毯的。我们在里面找到了一样东西。
        - id: ch01-b40
          speaker: carpet_seller
          text: 那准是从你们自己家里钻进去的！我卖出去的货里没有别的东西，全都干净得像哨子一样。
          emotion: angry
        - id: ch01-b41
          speaker: cyril
          text: 我又没说它不干净。可是……
        - id: ch01-b42
          speaker: carpet_seller
          text: 哦，要是有蛀虫，拿硼砂一治就好。不过我猜最多只有一只。那地毯从里到外都没毛病。它离开我手里时，别说半只蛀虫，连一颗虫卵也没有。
        - id: ch01-b43
          speaker: jane
          text: 可我们说的正是一颗蛋呀。
        - id: ch01-b44
          speaker: narrator
          text: 男人猛冲上前一步，狠狠跺了一脚。
        - id: ch01-b45
          speaker: carpet_seller
          text: 给我滚！再不走我就叫警察。让客人听见你们跑来，说在我卖的货里找到了东西，那还得了！快滚，不然有你们好受的。警察！警察！
          emotion: angry
        - id: ch01-b46
          speaker: narrator
          text: 孩子们逃走了。他们觉得当时只能这样，爸爸也同意。妈妈可有她自己的看法。不过爸爸说，那枚蛋可以留下。
        - id: ch01-b47
          speaker: father
          text: 那个人送地毯来时，肯定不知道里面藏着蛋。你们妈妈也不知道。既然这样，我们跟他对这枚蛋有同样的权利。
        - id: ch01-b48
          speaker: narrator
          text: 于是蛋被摆到了壁炉台上，倒给昏暗的育儿室添了不少光彩。屋子在地下层，窗外正对一个用石头砌成的下沉庭院，窗前还堆着一座煤渣做成的假山。那座假山上除了虎耳草和蜗牛，什么也不长。房屋经纪人的清单把这里叫作“地下层便利早餐室”。白天，屋里确实相当阴暗。晚上点起煤气灯，暗倒不成问题了。可偏偏也是到了晚上，黑甲虫们最喜欢出来交际。它们从壁炉两旁的矮柜里爬出来，那儿就是它们的家。它们还会试着跟孩子们交朋友，至少我猜它们是这个意思。孩子们却从来不肯答应。
        - id: ch01-b49
          speaker: narrator
          text: 到了十一月五日，爸爸妈妈去剧院看戏。孩子们一点也不快活。隔壁普罗瑟家有许多烟火，他们一个也没有，连去花园点一堆篝火都不许。他们开口请求时，爸爸只给了一个回答。
        - id: ch01-b50
          speaker: father
          text: 谢谢，玩火的事到此为止。
        - id: ch01-b51
          speaker: narrator
          text: 小宝宝被抱去睡觉后，四个孩子闷闷不乐地坐在育儿室的炉火旁。
        - id: ch01-b52
          speaker: robert
          text: 我简直要无聊死了。
        - id: ch01-b53
          speaker: anthea
          text: 咱们聊聊沙仙吧。
        - id: ch01-b54
          speaker: narrator
          text: 安西娅总想把谈话领到快活一点的地方。
        - id: ch01-b55
          speaker: cyril
          text: 光聊天有什么意思？我想让事情真的发生。晚上不许出门，实在闷得人喘不过气。家庭作业写完以后，就什么事也没有了。
        - id: ch01-b56
          speaker: narrator
          text: 简写完最后一项功课，啪地合上了书。
        - id: ch01-b57
          speaker: jane
          text: 我们还可以开心地回忆呀。想想上个假期吧。
        - id: ch01-b58
          speaker: narrator
          text: 上个假期确实非常值得回想。他们是在乡下度过的，住在一座白房子里，一边是沙坑，另一边是砾石坑。在那里，发生过的事可真不少。孩子们发现了一只沙仙，也叫普萨米德。无论他们许下什么愿，它都能让愿望成真。真的，随便什么愿望都行。至于那个愿望对他们到底有没有好处，或是会不会带来别的问题，它一概不管。要是你想知道他们许过哪些愿望，愿望后来又闹成什么样，可以去读一本叫《五个孩子和沙仙》的书。书名里的“沙仙”就是它。你若没读过，我还得告诉你，第五个孩子是他们的小弟弟，大家叫他“小羊羔”，因为他生平说出的第一个字是“咩”。另外四个孩子长得并不特别漂亮，脑子也没有格外聪明，品行更谈不上好得出奇。不过总体来说，他们不坏。其实，他们和你们很有些相像。
        - id: ch01-b59
          speaker: cyril
          text: 我才不要什么回忆的快乐。我想让事情再发生一次。
        - id: ch01-b60
          speaker: jane
          text: 我们其实已经比别人幸运多了。别人从来没找到过沙仙。我们应该知足呀。
        - id: ch01-b61
          speaker: cyril
          text: 可为什么好运不能继续？我说的是继续走运，不是继续知足。为什么什么事都非得停下来？
        - id: ch01-b62
          speaker: anthea
          text: 也许还会有事情发生。你们知道吗？有时候我觉得，我们就是那种总会碰上事情的人。
        - id: ch01-b63
          speaker: jane
          text: 历史里也是这样。有些国王一辈子全是有趣的事，另一些国王什么都没遇上，只有出生、加冕和下葬。有时候，连这几样也不一定全有。
        - id: ch01-b64
          speaker: cyril
          text: 我觉得黑豹说得对。我们就是会碰上事情的那种人。我总觉得，只要咱们推一把，事情马上就会来。现在只差一个开头。
        - id: ch01-b65
          speaker: jane
          text: 真希望学校会教魔法。要是我们懂一点魔法，说不定就能让事情发生了。
        - id: ch01-b66
          speaker: narrator
          text: 罗伯特环顾屋子。褪色的绿窗帘、灰褐色的百叶窗，还有地上磨旧的棕色油布，一样也没给他半点灵感。就连那张新地毯也没有，虽然上面的图案奇妙得很，仿佛时时刻刻都快让人想起一件什么事，可那件事偏又想不起来。
        - id: ch01-b67
          speaker: robert
          text: 可魔法该从哪儿开始？
        - id: ch01-b68
          speaker: anthea
          text: 我倒知道一点开头。我读过不少这方面的东西。可是我想，《圣经》说这样不对。
        - id: ch01-b69
          speaker: cyril
          text: 《圣经》说不对，是因为那些人拿魔法害别人。一件事不伤人，怎么会错？我们谁也不想害人。就算想，也根本做不到。去拿《英戈尔兹比传奇》吧，里面有一段说“阿布拉卡达布拉”。反正没别的事，不如玩玩魔法。咱们来当圣殿骑士，他们最迷这个。爸爸说，他们过去会拿一只山羊和一只鹅来念咒什么的。
        - id: ch01-b70
          speaker: robert
          text: 那正合适。你演山羊肯定没问题，简也知道怎么演鹅。
        - id: ch01-b71
          speaker: anthea
          text: 我去拿《英戈尔兹比传奇》。你们先把炉前的小地毯掀起来。
        - id: ch01-b72
          speaker: narrator
          text: 他们在油布上画了许多古怪的图形。那块油布一直被小地毯盖着，所以还很干净。粉笔是罗伯特从学校数学老师的讲桌上顺来的。你当然知道，拿走一整根新粉笔算偷。可要是拿的只是一小截断粉笔，而且只拿一截，就不算错。为什么会有这条规矩，又是谁定的，我可不知道。他们把能想起来的最阴沉的歌全唱了一遍。什么也没发生。
        - id: ch01-b73
          speaker: anthea
          text: 我敢肯定，魔法的火得用香木来烧，还得放进魔法树胶和香精之类的东西。
        - id: ch01-b74
          speaker: robert
          text: 我只知道雪松有香味。不过我有几小截雪松木铅笔头。
        - id: ch01-b75
          speaker: narrator
          text: 他们烧了铅笔头，依然什么也没发生。
        - id: ch01-b76
          speaker: anthea
          text: 那就烧一点治伤风的桉树油吧。
        - id: ch01-b77
          speaker: narrator
          text: 他们果真烧了一点，气味浓烈得不得了。接着，他们又从大箱子里拿出樟脑块来烧。樟脑烧得很亮，还冒出难看的黑烟，看上去倒很有魔法的气氛。可什么也没发生。随后，他们去厨房碗柜的抽屉里找来几块干净茶巾，一边在粉笔画成的魔法图形上挥来挥去，一边唱起庄严十足的《伯利恒摩拉维亚修女赞美诗》。还是没有动静。他们便越挥越猛。罗伯特手里的茶巾兜住了那枚金蛋，一下把它从壁炉台扫落。蛋先掉进壁炉围栏，接着又滚到了炉栅底下。
        - id: ch01-b78
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 哎呀，糟了！
          emotion: surprised
        - id: ch01-b79
          speaker: narrator
          text: 大家立刻脸朝下趴在地上，往炉栅下面看。那枚蛋躺在一窝滚烫的灰烬里，亮得灼眼。
        - id: ch01-b80
          speaker: robert
          text: 还好，蛋没摔破。
        - id: ch01-b81
          speaker: narrator
          text: 罗伯特伸手到炉栅下面，把蛋捡了起来。可这么短的时间里，蛋已经烫得远远超过他的想象。
        - id: ch01-b82
          speaker: robert
          text: 讨厌！
          emotion: surprised
        - id: ch01-b83
          speaker: narrator
          text: 他只好松手。蛋先落在炉栅最上面那根横条上，又弹进烧得通红的炉火深处。
        - id: ch01-b84
          speaker: anthea
          text: 快拿火钳来！
        - id: ch01-b85
          speaker: narrator
          text: 可谁也想不起火钳去了哪里。上一次，小羊羔把玩偶的小茶壶掉进水桶，他们拿火钳去捞。如今育儿室的火钳正在水桶和垃圾箱之间歇着，厨娘又不肯把厨房的火钳借给他们。
        - id: ch01-b86
          speaker: robert
          text: 没事，拿通条和煤铲也能把它弄出来。
        - id: ch01-b87
          speaker: anthea
          text: 啊，先别碰！你们快看，快看呀！我真的觉得，事情要发生了！
          emotion: surprised
        - id: ch01-b88
          speaker: narrator
          text: 那枚蛋已经烧得通红，里面有东西在动。随后，一声轻轻的碎裂传了出来。蛋壳裂成两半，一只火焰颜色的鸟从里面钻出。它在火中停了一会儿。就在这一小会儿里，四个孩子眼睁睁看着它越长越大。他们每个人的嘴都张得老大，每一双眼睛也瞪得溜圆。那只鸟从火焰做成的巢里站起来，舒展开双翼，飞进了房间。它绕着屋子飞了一圈又一圈，飞到哪里，哪里的空气就暖起来。最后，它落在壁炉围栏上。孩子们先互相看了看。西里尔伸出一只手，慢慢探向那只鸟。鸟把头偏到一旁，抬眼看着他，很像你见过的那种马上要开口说话的鹦鹉。所以等它真的说了话，孩子们一点也不惊讶。
        - id: ch01-b89
          speaker: phoenix
          text: 当心，我身上还远远没有凉下来。
        - id: ch01-b90
          speaker: narrator
          text: 他们虽然不惊讶，却一下子来了极大的兴趣，仔仔细细打量起那只鸟。它确实值得看。全身羽毛都像黄金，个头和一只矮脚鸡差不多，鸟喙却绝不像矮脚鸡的嘴。
        - id: ch01-b91
          speaker: robert
          text: 我想我知道它是什么。我见过一张图。
        - id: ch01-b92
          speaker: narrator
          text: 他匆匆跑出去，在爸爸书桌的纸堆里翻找起来。借用算术课本的话说，这次仓促的搜寻终于“得出了预期结果”。他举着一张印刷品跑回房间。
        - id: ch01-b93
          speaker: robert
          text: 喂，你们看这个！
        - id: ch01-b94
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: 嘘！
        - id: ch01-b95
          speaker: narrator
          text: 罗伯特马上听话地闭了嘴，因为那只鸟正在讲话。
        - id: ch01-b96
          speaker: phoenix
          text: 你们几个人里，是谁把蛋放进火里的？
        - id: ch01-b97
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: 是他。
        - id: ch01-b98
          speaker: narrator
          text: 三根手指同时指向罗伯特。鸟低了低头。要说那不是鞠躬，还真找不到更合适的说法。
        - id: ch01-b99
          speaker: phoenix
          text: 那么，我欠你一份情。
        - id: ch01-b100
          speaker: narrator
          text: 孩子们惊奇又好奇，个个说不出话。只有罗伯特例外。他拿着那张纸。他知道答案，而且他说了出来。
        - id: ch01-b101
          speaker: robert
          text: 我知道你是谁。
        - id: ch01-b102
          speaker: narrator
          text: 他展开印刷品，举给大家看。纸的上方有一幅小图，画着一只坐在火焰窝里的鸟。
        - id: ch01-b103
          speaker: robert
          text: 你是凤凰。
        - id: ch01-b104
          speaker: narrator
          text: 那只鸟听了，高兴极了。
        - id: ch01-b105
          speaker: phoenix
          text: 原来我的盛名已经流传了两千年。请把我的肖像拿来给我看看。
          emotion: happy
        - id: ch01-b106
          speaker: narrator
          text: 罗伯特跪下来，把那张纸摊在壁炉围栏上。凤凰看了一眼。
        - id: ch01-b107
          speaker: phoenix
          text: 画得可不怎么讨喜。这些符号又是什么？
        - id: ch01-b108
          speaker: cyril
          text: 哦，那些文字挺乏味的，也没有多讲你。不过很多书里都提到过你。
        - id: ch01-b109
          speaker: narrator
          text: 西里尔无意中显得十分有礼貌。
        - id: ch01-b110
          speaker: phoenix
          text: 那些书里也有我的肖像吗？
        - id: ch01-b111
          speaker: cyril
          text: 没有。说真的，除了这幅，我好像没见过别的。不过你愿意的话，我可以读一段书上对你的介绍。
        - id: ch01-b112
          speaker: narrator
          text: 凤凰点了点头。西里尔跑去拿旧百科全书的第十卷，翻到第二百四十六页，念了起来。
        - id: ch01-b113
          speaker: cyril
          text: 凤凰，鸟类学中一种古代传说里的鸟。
        - id: ch01-b114
          speaker: phoenix
          text: “古代”两个字完全正确。可“传说里的”是什么意思？你们看我像一个传说吗？
        - id: ch01-b115
          speaker: narrator
          text: 大家一起摇头。西里尔接着念。
        - id: ch01-b116
          speaker: cyril
          text: 古人说，这种鸟在世上只有一只，也就是同类之中独一无二。
        - id: ch01-b117
          speaker: phoenix
          text: 这句话倒没有错。
        - id: ch01-b118
          speaker: cyril
          text: 据说，它的身量和鹰差不多。
        - id: ch01-b119
          speaker: phoenix
          text: 鹰有大有小。这算什么描述？
        - id: ch01-b120
          speaker: narrator
          text: 孩子们全跪到了炉前的小地毯上，好离凤凰近一点。
        - id: ch01-b121
          speaker: phoenix
          text: 你们的脑子快要煮熟了。当心些，我已经差不多凉了。
        - id: ch01-b122
          speaker: narrator
          text: 金色翅膀呼啦一振，凤凰从壁炉围栏飞到桌上。这时它差不多凉透了。它在桌布上站稳，空气里只留下很淡的一点焦味。
        - id: ch01-b123
          speaker: phoenix
          text: 只焦了一点点，洗一洗就会掉。请继续吧。
        - id: ch01-b124
          speaker: narrator
          text: 孩子们又围到了桌旁。
        - id: ch01-b125
          speaker: cyril
          text: 它的身量和鹰差不多，头上有华美的羽冠，颈部披着金色羽毛，身体其余部分是紫色。只有尾羽洁白，双眼像星辰一样闪耀。据说，它在荒野里生活大约五百年。年老以后，它会为自己堆起香木和芳香树胶，扇动翅膀点燃柴堆，把自己烧掉。灰烬里会生出一条虫，日后长成凤凰。因此，腓尼基人赠予……
        - id: ch01-b126
          speaker: phoenix
          text: 别管腓尼基人赠予什么了。反正他们没赠过多少东西。他们向来不先看到回报，就一毛不拔。这本书应该毁掉，错得实在太离谱。我的身体从来不是紫色。至于我的尾巴，我只问你们一句，它是白的吗？
        - id: ch01-b127
          speaker: narrator
          text: 凤凰转过身，郑重地把金色尾羽展示给孩子们。
        - id: ch01-b128
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 不是。
        - id: ch01-b129
          speaker: phoenix
          text: 不是，而且从来都不是。还有那条虫子的说法，简直是粗俗的侮辱。凤凰和所有体面的鸟一样，当然会下蛋。它会堆起一座柴堆，这部分说得没错。然后，它把蛋生在柴堆上，再烧掉自己。它睡过去，在蛋里醒来，钻出蛋壳，又接着活。一次又一次，永远没有尽头。我没法让你们明白，后来我有多厌倦这件事。这样没完没了地活着，连一点休息都没有。
          emotion: disgusted
        - id: ch01-b130
          speaker: anthea
          text: 可你的蛋是怎么来到这里的？
        - id: ch01-b131
          speaker: phoenix
          text: 啊，那是我一生的秘密。除非一个人真正和我心意相通，我不能告诉他。我一直是一只不被理解的鸟。你们只要看看那条虫子的说法就知道了。不过，我也许可以告诉你。
        - id: ch01-b132
          speaker: narrator
          text: 凤凰用那双真正像星星一样明亮的眼睛望着罗伯特。
        - id: ch01-b133
          speaker: phoenix
          text: 毕竟，是你把我放进火里的。
        - id: ch01-b134
          speaker: narrator
          text: 罗伯特显得很不自在。
        - id: ch01-b135
          speaker: cyril
          text: 可是香木和树胶是我们其他人放进火里的。
        - id: ch01-b136
          speaker: robert
          text: 而且，我把你放进去其实只是个意外。
        - id: ch01-b137
          speaker: narrator
          text: 罗伯特费了好大劲才把实话说出口，因为他不知道凤凰听后会怎样。凤凰的反应却完全出乎他们的意料。
        - id: ch01-b138
          speaker: phoenix
          text: 你这样坦白地承认，消除了我最后一点顾虑。我要把自己的故事告诉你们。
        - id: ch01-b139
          speaker: anthea
          text: 那你不会忽然消失，或者突然做出什么事来吧？
          emotion: fearful
        - id: ch01-b140
          speaker: narrator
          text: 凤凰蓬起金色羽毛。
        - id: ch01-b141
          speaker: phoenix
          text: 为什么这么问？你希望我留在这里吗？
        - id: ch01-b142
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 当然希望！
          emotion: happy
        - id: ch01-b143
          speaker: narrator
          text: 他们回答得再真诚不过。
        - id: ch01-b144
          speaker: phoenix
          text: 为什么呢？
        - id: ch01-b145
          speaker: narrator
          text: 凤凰谦逊地望着桌布。四个孩子同时开了口，却又同时停住。片刻之后，只有简接着说了下去。
        - id: ch01-b146
          speaker: jane
          text: 因为你是我们见过的最美丽的人。
        - id: ch01-b147
          speaker: phoenix
          text: 你是个懂事的孩子。我不会忽然消失，也不会突然做什么。我会把故事讲给你们。照你们那本书的说法，我在荒野里住过许多许多个千年。那里很大，也很安静，却几乎没有真正上等的社交。我渐渐受够了那种单调的日子。可是，我已经养成每五百年下一次蛋、再把自己烧掉的习惯。你们知道，习惯是很难改的。
        - id: ch01-b148
          speaker: cyril
          text: 是啊。简从前老是咬指甲。
        - id: ch01-b149
          speaker: jane
          text: 可我早就改掉了。你明明知道的。
          emotion: sad
        - id: ch01-b150
          speaker: cyril
          text: 那是因为他们往你指甲上涂了苦芦荟。
        - id: ch01-b151
          speaker: phoenix
          text: 我很怀疑，就连苦芦荟也治不好我的习惯。顺便说一句，芦荟自己也有个坏习惯。它在动手纠正别人以前，真该先把自己治一治。它的做派实在懒惰，整整一百年才肯开一次花。所以我认为，连苦芦荟也不可能治好我。不过，我的确把习惯改掉了。一天早上，我从一个像发热一样的梦里醒来。当时，我又快要堆起那座讨厌的火堆，在上面生下那枚烦人的蛋。就在这时候，我看见一男一女两个人坐在一张地毯上。我很有礼貌地走过去同他们交谈，他们便向我讲起自己的一生。你们还没听过这个故事，我现在就讲给你们听。他们是一位王子和一位公主。他们父母的故事，我相信你们也会爱听。公主的母亲年轻时，碰巧听说过一位魔法师。我敢肯定，你们也会对他的故事感兴趣。那位魔法师……
        - id: ch01-b152
          speaker: anthea
          text: 哦，求你别再往下讲了。这么多故事都只开了个头，我已经听不明白。你每说一句，就好像又往故事里面陷深了一层。请你只讲自己的故事吧，我们真正想听的是这个。
        - id: ch01-b153
          speaker: phoenix
          text: 好吧。那就把大约七十个长故事全跳过去。虽说我当时一个不漏，全听完了，毕竟荒野里有的是时间。那位王子和公主彼此爱得太深，谁也不愿再见别人。那位魔法师，你们放心，我不讲他的来历，曾经送给他们一张魔毯。你们听说过魔毯吧？他们刚坐上去，就叫它带自己到一个远离所有人的地方。地毯把他们送进了荒野。他们打算永远住在那里，用不着魔毯了，便把它送给了我。那真是我一生里难得的机会。
        - id: ch01-b154
          speaker: jane
          text: 可你已经有这么漂亮的翅膀了，还要地毯做什么呢？
        - id: ch01-b155
          speaker: phoenix
          text: 它们确实很漂亮，是不是？
        - id: ch01-b156
          speaker: narrator
          text: 凤凰忸怩地展开双翼，然后接着讲下去。
        - id: ch01-b157
          speaker: phoenix
          text: 我让王子把地毯好好铺平，然后把蛋生在了上面。接着我对它说：“现在，我出色的地毯，证明你的价值吧。把这枚蛋送到一个地方，让它在两千年里都孵不出来。等期限一到，会有人点燃香木和芳香树胶，再把蛋放进去孵化。”你们看，后来发生的事情完全照着我的话来了。我的喙刚吐出最后一个字，蛋和地毯就一起消失了。那对王室恋人替我堆好了柴堆，又安慰着我度过最后的时刻。我把自己烧成了灰烬。从那以后，我什么也不知道，直到今天在那边的祭坛上重新醒过来。
        - id: ch01-b158
          speaker: narrator
          text: 它伸出爪子，指了指炉栅。
        - id: ch01-b159
          speaker: robert
          text: 可那张魔毯呢？就是那张能带你去任何地方的地毯。后来它怎么样了？
        - id: ch01-b160
          speaker: phoenix
          text: 哦，你问它吗？依我看，地上这张就是。我把它的花纹记得清清楚楚。
        - id: ch01-b161
          speaker: narrator
          text: 凤凰一边说，一边指向地板。铺在那里的，正是妈妈在肯蒂什镇路上花二十二先令九便士买来的地毯。就在这个时候，门口响起爸爸用弹簧锁钥匙开门的声音。
        - id: ch01-b162
          speaker: cyril
          text: 啊，这回我们没上床睡觉，准要挨罚了！
          emotion: fearful
        - id: ch01-b163
          speaker: phoenix
          text: 快许愿回到床上，然后再让地毯回到原来的地方。
        - id: ch01-b164
          speaker: narrator
          text: 凤凰话音刚落，事情便办成了。那感觉的确让人有一点头晕，也有一点喘不过气。等周围的一切仿佛重新正过来时，孩子们已经各自躺在床上，房里的灯也全灭了。黑暗里，凤凰柔和的声音响了起来。
        - id: ch01-b165
          speaker: phoenix
          text: 我要睡在你们床帘上方的檐口上。请不要把我的事告诉你们的亲属。
        - id: ch01-b166
          speaker: robert
          text: 告诉他们也没用，他们绝不会相信。喂，女孩子们，你们刚才还说要冒险，要有事情发生。现在咱们有一张魔毯，还有一只凤凰，肯定能找出不少乐子。
        - id: ch01-b167
          speakers: [anthea, jane]
          ensemble: duo
          text: 那还用说。
        - id: ch01-b168
          speaker: narrator
          text: 女孩子们躺在床上回答。
        - id: ch01-b169
          speaker: father
          text: 孩子们，马上睡觉。都这么晚了还在讲话，你们到底想干什么？
        - id: ch01-b170
          speaker: narrator
          text: 爸爸在楼梯上问。这个问题本来并不等人回答，西里尔还是缩在被窝里嘟囔了一句。
        - id: ch01-b171
          speaker: cyril
          text: 想干什么？我也不知道。我连任何事情到底是什么意思都不知道。
        - id: ch01-b172
          speaker: robert
          text: 可咱们有一张魔毯，还有一只凤凰。
        - id: ch01-b173
          speaker: cyril
          text: 要是爸爸进来抓到你，你还会多一样东西。我叫你闭嘴。
        - id: ch01-b174
          speaker: narrator
          text: 罗伯特果真闭了嘴。不过他和你一样清楚，有了那张魔毯和那只凤凰，他们的冒险才刚刚开始，后面一定还有许多事情。
        - id: ch01-b175
          speaker: narrator
          text: 爸爸妈妈对自己不在家时发生的事一点也不知道。这样的情形常常会有，就算家里没有魔毯，也没有凤凰。
        - id: ch01-b176
          speaker: narrator
          text: 至于第二天早上发生了什么，我敢说，你宁愿等到下一章再听。
