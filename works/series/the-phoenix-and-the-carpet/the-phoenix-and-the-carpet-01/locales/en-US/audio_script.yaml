  chapters:
    - id: ch01
      title: THE EGG
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            It began when it was almost the Fifth of November. Someone, probably Robert, began to wonder whether the fireworks they had bought for Guy Fawkes Night were any good.
        - id: ch01-b02
          speaker: robert
          text: >-
            They were awfully cheap. What if none of them goes off? Those Prosser children next door will laugh at us.
        - id: ch01-b03
          speaker: jane
          text: >-
            Mine will work. The shopman said they were worth thribble what we paid.
        - id: ch01-b04
          speaker: anthea
          text: >-
            I'm sure "thribble" isn't proper grammar.
        - id: ch01-b05
          speaker: cyril
          text: >-
            Of course it isn't. One word can't be grammar on its own, so you needn't act so clever.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Anthea began rummaging through the little corner drawers of her mind, searching for a particularly nasty answer. Then she remembered what a wet day it was and how badly the boys had wanted their outing. Mother had promised them a ride to London and back on top of a tram. It was their reward because, for six whole days, neither boy had once forgotten to wipe his boots on the mat after school. Now the rain had spoiled the ride.
        - id: ch01-b07
          speaker: anthea
          text: >-
            Don't be so clever yourself, Squirrel. The fireworks look all right. And now you've still got the eightpence you didn't spend on tram fares. You could buy a perfectly lovely Catherine wheel with that.
        - id: ch01-b08
          speaker: cyril
          text: >-
            Maybe. But it isn't your eightpence.
        - id: ch01-b09
          speaker: robert
          text: >-
            Listen, this matters. We can't be disgraced in front of those children. Just because they wear red plush on Sundays, they think no one else is worth anything.
        - id: ch01-b10
          speaker: anthea
          text: >-
            I wouldn't wear plush for anything. Well, perhaps black plush, if I were Mary Queen of Scots and about to be beheaded.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Robert stayed with the subject. One of Robert's great qualities is that once he has hold of a point, he does not let go.
        - id: ch01-b12
          speaker: robert
          text: >-
            We ought to test the fireworks.
        - id: ch01-b13
          speaker: cyril
          text: >-
            You silly duffer. Fireworks are like postage stamps. Once you've used one, it's gone.
        - id: ch01-b14
          speaker: robert
          text: >-
            Then what do they mean when an advertisement says, "Carter's tested seeds"?
        - id: ch01-b15
          speaker: narrator
          text: >-
            Nobody had an answer. Cyril tapped his forehead and sadly shook his head.
        - id: ch01-b16
          speaker: cyril
          text: >-
            Poor Robert. I always feared something was wrong up here. Being clever and coming top in algebra so often was bound to have an effect.
        - id: ch01-b17
          speaker: robert
          text: >-
            Oh, shut up! Don't you see? They don't test every seed. They choose a few. If those grow, they know the rest are... what was Father's phrase? Up to sample. We can sample our fireworks the same way. We each shut our eyes, pull one out, and try it.
          emotion: angry
        - id: ch01-b18
          speaker: jane
          text: >-
            But it's pouring outside.
        - id: ch01-b19
          speaker: robert
          text: >-
            And Queen Anne is dead. We don't need to go outside. Move the table back and set them off on that old tea tray we use for tobogganing. I'm tired of doing nothing. This would be useful. Then we wouldn't merely hope our fireworks would astonish the Prossers. We'd know they would.
        - id: ch01-b20
          speaker: cyril
          text: >-
            Well, it would give us something to do.
        - id: ch01-b21
          speaker: narrator
          text: >-
            So they pushed back the table. That uncovered the terrible hole in the carpet. Once the hole had been near the window, but turning the carpet around had brought it into full view. Anthea slipped out on tiptoe, took the old tea tray while Cook was not looking, carried it into the nursery, and laid it neatly over the hole.

            They arranged every firework on the table. Then all four children squeezed their eyes tightly shut, reached out, and grabbed whatever their fingers touched. Robert drew a cracker. Cyril and Anthea each got a Roman candle. Jane's little round hand closed over the treasure of the whole collection, a Jack-in-the-box that had cost two shillings. At least one of the others declared that Jane had chosen it on purpose. I will not say which child said so, because that child was sorry afterward.

            Nobody was pleased, and choosing again would have suited nearly everyone. But the four children properly hated anything even a little sneaky. They had made a law among themselves, as unchangeable as the laws of the Medes and Persians. Whatever chance decided in a coin toss, a drawing of lots, or anything like it had to stand. It made no difference how much anyone disliked the result.
        - id: ch01-b22
          speaker: jane
          text: >-
            I didn't mean to take it. I don't mind. Let me choose again.
          emotion: sad
        - id: ch01-b23
          speaker: cyril
          text: >-
            You know you can't. It's decided. It's like the law of the Medes and Persians, and we all have to put up with it. Never mind. You'll get more pocket money before the Fifth. We'll save the Jack-in-the-box till last and get all we can out of it.
        - id: ch01-b24
          speaker: narrator
          text: >-
            They lit the cracker and the two Roman candles. For the price, those fireworks did everything anyone could expect. Then came the Jack-in-the-box. It sat in the tray and laughed at them, as Cyril put it. They held burning paper to it, but it would not catch. They struck one match after another with no result. At last they fetched the special fusees from the pocket of Father's second-best overcoat, which hung in the hall. Even those would not light it.

            Anthea slipped to the cupboard under the stairs. That cupboard held the brooms and dustpans, the pine-scented firelighters, old newspapers, beeswax and turpentine, stiff black cleaning rags, and the paraffin for the lamps. She returned with a little pot that had once held red-currant jelly. The jelly was long gone. Now the pot was full of paraffin.

            Just as Cyril tried his twenty-third match, Anthea came in and flung the paraffin over the tray. The Jack-in-the-box behaved exactly as before. The paraffin did not. A hot flash sprang up at once. It burned off Cyril's eyelashes and scorched all four faces before they could get away. Each child made one enormous backward leap. The wall stopped them, and a pillar of flame rose from the floor all the way to the ceiling.
        - id: ch01-b25
          speaker: cyril
          text: >-
            Well, Anthea. You've really done it now.
          emotion: surprised
        - id: ch01-b26
          speaker: narrator
          text: >-
            The flame spread beneath the ceiling like the rose of fire in Mr. Rider Haggard's story about Allan Quatermain. Robert and Cyril knew there was no time to waste. They lifted the carpet's edges and kicked them over the tray. The great flame vanished. Only smoke remained, with the dreadful smell of lamps turned too low.

            Every hand joined the rescue. The children stamped and trampled until the paraffin fire was nothing but a bundled carpet under their feet. Then a sharp crack beneath them made the young firefighters jump back. Another crack followed. The carpet twitched as if a cat had been wrapped inside it. At last the Jack-in-the-box had caught, and it was exploding furiously under the carpet.

            Robert rushed to open the window, looking like someone doing the only possible thing. Anthea screamed. Jane burst into tears. Cyril seized the table, turned it upside down, and dropped it over the heap. The table did not stop the firework. Beneath it, the Jack-in-the-box kept banging, bursting, and spitting.

            Mother hurried in, drawn by Anthea's howls. A few moments later the firework stopped. Silence fell. The children stared at one another's black faces while watching Mother's white one from the corners of their eyes.

            The ruined nursery carpet surprised no one very much. Nor was anyone truly astonished when bed became the immediate end of the adventure. People say all roads lead to Rome. That may be so, but in childhood a great many roads lead straight to bed, and stop there. Or you do.

            The other fireworks were taken away. Mother was not pleased when Father set them off himself in the back garden.
        - id: ch01-b27
          speaker: father
          text: >-
            Well, my dear, how else are we supposed to get rid of them?
        - id: ch01-b28
          speaker: narrator
          text: >-
            Father had forgotten two important facts. The children were in disgrace, but their bedroom windows looked straight out over the back garden. So they saw the whole firework display beautifully from upstairs and admired the skill with which Father set off every piece.

            By the next day, everyone had forgiven and forgotten what happened. The nursery had not forgotten. It needed a cleaning as deep and thorough as spring-cleaning, and the smoke-blackened ceiling had to be whitewashed.

            Mother went out that day. Then, just around teatime, a man arrived at the house carrying a rolled-up carpet. Father took the delivery and paid him.
        - id: ch01-b29
          speaker: mother
          text: >-
            If this carpet isn't in good condition, I shall expect you to exchange it.
        - id: ch01-b30
          speaker: carpet_seller
          text: >-
            Not a single thread is gone anywhere, ma'am. It's a bargain, and I'm half sorry I let it go for that price. But we gentlemen can't resist the ladies, can we, sir?
        - id: ch01-b31
          speaker: narrator
          text: >-
            He winked at Father and left. The carpet was spread across the nursery floor. Sure enough, it did not have one hole.

            As they unrolled the last fold, something hard struck the floor with a loud bump and went rolling across the nursery. All four children scrambled after it, and Cyril reached it first. He carried it to the gaslight. The thing was shaped like an egg, very yellow and shiny, yet partly transparent. A strange inner light changed whenever he held it a different way. It looked like a stone egg with a yolk of pale fire just showing through.
        - id: ch01-b32
          speaker: cyril
          text: >-
            May I keep it, Mother? Please?
        - id: ch01-b33
          speaker: narrator
          text: >-
            Of course Mother said no. They had paid for a carpet, not a stone egg with fire inside it, so the children must return it to the seller.

            Mother told them where to find the shop. It was on Kentish Town Road, not far from the hotel called the Bull and Gate. The shop itself was a cramped little place. Outside, the seller was arranging pieces of furniture on the pavement with great care. He turned each one so that its broken places showed as little as possible. The moment he saw the children approaching, he recognized them. He did not give them any chance to explain why they had come. He began shouting before they could say a word.
        - id: ch01-b34
          speaker: carpet_seller
          text: >-
            Oh no, you don't! I'm not taking back any carpet, so don't make that mistake. A bargain is a bargain, and that carpet is perfect from end to end.
          emotion: angry
        - id: ch01-b35
          speaker: cyril
          text: >-
            We don't want to return it. We found something inside.
        - id: ch01-b36
          speaker: carpet_seller
          text: >-
            Then it got in at your house. There's nothing inside anything I sell. Every bit of it is clean as a whistle.
        - id: ch01-b37
          speaker: cyril
          text: >-
            I didn't say the carpet was dirty. I only meant—
        - id: ch01-b38
          speaker: carpet_seller
          text: >-
            If you've found moths, borax will fix them. One stray moth, most likely. That carpet was sound all through when it left my hands. It hadn't so much as an egg in it.
        - id: ch01-b39
          speaker: jane
          text: >-
            But that's exactly what it had. There was an egg.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The man lunged toward them and stamped his foot.
        - id: ch01-b41
          speaker: carpet_seller
          text: >-
            Get out! Go on, or I'll call the police. What will my customers think if you stand here accusing me of putting things in my goods? Be off with you! Constable!
          emotion: angry
        - id: ch01-b42
          speaker: narrator
          text: >-
            The children fled from the shop. They believed there was nothing else they could possibly have done. Their father thought so too. Their mother, however, kept her own opinion about that.

            Father said they could keep the egg.
        - id: ch01-b43
          speaker: father
          text: >-
            The seller clearly knew no more about that egg than your mother did. We have as much right to it as he ever had.
        - id: ch01-b44
          speaker: narrator
          text: >-
            So the egg stood on the mantelpiece, where its glow made the dingy nursery brighter. The nursery was in the basement. Its windows looked into a stone area, and opposite them stood a rockery built from black furnace clinkers. Nothing grew among those clinkers except London pride and snails.

            In the house agent's list, the room had been called a convenient basement breakfast room. During the day it was rather dark. Darkness mattered less in the evening, once the gas was lit. But evening was also when the black beetles became sociable. They came out of their homes in the low cupboards on each side of the fireplace and tried to make friends with the children. At least, that must have been what they wanted. The children never wanted to make friends with them.
        - id: ch01-b45
          speaker: narrator
          text: >-
            On the Fifth of November, Father and Mother went to the theater. The children were miserable. The Prossers next door had heaps of fireworks, while they had none. They were not even allowed a bonfire in the garden.
        - id: ch01-b46
          speaker: father
          text: >-
            No more games with fire, thank you.
        - id: ch01-b47
          speaker: narrator
          text: >-
            That had been Father's answer. After the baby was put to bed, the children sat sadly around the nursery fire.
        - id: ch01-b48
          speaker: robert
          text: >-
            I'm horribly bored.
        - id: ch01-b49
          speaker: anthea
          text: >-
            We could talk about the Psammead.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Anthea generally tried to turn their talk in a cheerful direction.
        - id: ch01-b51
          speaker: cyril
          text: >-
            Talking won't help. I want something to happen. It's rotten being kept inside every evening. Once your homework is finished, there's absolutely nothing left to do.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Jane finished the last of her lessons and slammed the book shut.
        - id: ch01-b53
          speaker: jane
          text: >-
            We can enjoy remembering things. Think about last summer.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Last summer certainly gave them plenty to remember. They had stayed in a white house in the country, between a sandpit and a gravel pit, and remarkable things had happened there. The children found a Psammead, a sand fairy that granted anything they wished for. It gave them exactly what they asked, without any tiresome questions about whether the wish would really be good for them. If you want to know what they wished for and how those wishes turned out, the whole story is in a book called Five Children and It. The "It" is the Psammead.

            Perhaps you have not read it, so there is one more thing you should know. The fifth child in those adventures was their baby brother. Everyone called him the Lamb because the first thing he ever said was, "Baa!" The other four were not especially beautiful. They were not unusually clever, either, and they certainly were not extraordinarily good. Still, they were decent children on the whole. In fact, they were rather like you.
        - id: ch01-b55
          speaker: cyril
          text: >-
            I don't want to enjoy remembering. I want new things to happen.
        - id: ch01-b56
          speaker: jane
          text: >-
            We're already luckier than anyone else. Nobody else has ever found a Psammead. We ought to be thankful.
        - id: ch01-b57
          speaker: cyril
          text: >-
            Why can't we go on being lucky? I don't mean thankful. Why must everything stop?
        - id: ch01-b58
          speaker: anthea
          text: >-
            Maybe something will happen. Sometimes I think we're the kind of people that things happen to.
        - id: ch01-b59
          speaker: jane
          text: >-
            History is like that. Some kings have all sorts of interesting things happen to them. Other kings are only born, crowned, and buried. Sometimes they don't even manage all three.
        - id: ch01-b60
          speaker: cyril
          text: >-
            I think Panther is right. Things do happen to people like us. They only need a push to get started. That's all.
        - id: ch01-b61
          speaker: jane
          text: >-
            I wish they taught magic at school. If we knew even a little magic, perhaps we could start something.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Robert looked slowly around the nursery and wondered how anyone began doing magic. No idea came from the faded green curtains. The dull Venetian blinds were no help, and neither was the worn brown floorcloth. Even the new carpet told him nothing. Its pattern was very wonderful to look at, and it always seemed as if it were just on the point of making you think of something. Somehow, the thought never quite arrived.
        - id: ch01-b63
          speaker: anthea
          text: >-
            I know enough to make a start. I've read lots of things about magic. But I think the Bible says it's wrong.
        - id: ch01-b64
          speaker: cyril
          text: >-
            It was wrong there because people meant to hurt somebody. Nothing can be wrong unless it hurts someone. We don't want to hurt anybody, and we couldn't if we tried. Fetch the Ingoldsby Legends. There's something in it about abracadabra. We may as well pretend to do magic. We could be Knights Templars. Father says they were mad about spells with a goat and a goose.
        - id: ch01-b65
          speaker: robert
          text: >-
            That's easy, then. You can be the goat, and Jane already knows how to be a goose.
        - id: ch01-b66
          speaker: anthea
          text: >-
            I'll fetch Ingoldsby. You lift the hearthrug.
        - id: ch01-b67
          speaker: narrator
          text: >-
            They turned back the hearthrug. It had protected the linoleum underneath, leaving a clean patch where they could draw their strange shapes. Robert supplied a broken piece of chalk that he had taken from the mathematical master's desk at school. You know, of course, that taking a whole new stick is stealing, while taking one broken piece is not wrong, as long as you take only one. I cannot tell you who made that rule or why.

            The children chanted every gloomy song they knew. Nothing happened.
        - id: ch01-b68
          speaker: anthea
          text: >-
            A proper magic fire must use sweet-smelling wood, with special gums and essences in it.
        - id: ch01-b69
          speaker: robert
          text: >-
            Cedar is the only sweet-smelling wood I know. I've got some cedar pencil ends.
        - id: ch01-b70
          speaker: narrator
          text: >-
            They burned the pencil ends. Nothing happened.
        - id: ch01-b71
          speaker: anthea
          text: >-
            What about the eucalyptus oil we use when we have colds?
        - id: ch01-b72
          speaker: narrator
          text: >-
            Into the fire went the eucalyptus oil they used for colds, and the smell was certainly powerful. Next they took chunks of camphor from the big chest and burned those too. The camphor shone with a very bright flame and sent up nasty black smoke that looked wonderfully magical. Still nothing happened.

            They fetched clean tea towels from a dresser drawer in the kitchen. They waved the towels over the magic chalk designs and sang the Hymn of the Moravian Nuns at Bethlehem, which sounded very impressive indeed. Nothing happened. So they waved more and more wildly. Robert's towel caught the golden egg, whisked it from the mantelpiece, and sent it falling into the fender and rolling beneath the grate.
        - id: ch01-b73
          speakers: [robert, cyril]
          ensemble: duo
          text: >-
            Oh, crikey!
          emotion: surprised
        - id: ch01-b74
          speaker: narrator
          text: >-
            All four instantly dropped flat on their stomachs and peered under the grate. The egg lay there, glowing in a bed of hot ashes.
        - id: ch01-b75
          speaker: robert
          text: >-
            At least it hasn't broken.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Robert reached under the grate and picked it up. In that short time it had grown far hotter than anyone could have imagined.
        - id: ch01-b77
          speaker: robert
          text: >-
            Bother!
          emotion: surprised
        - id: ch01-b78
          speaker: narrator
          text: >-
            He dropped the egg. It struck the top bar of the grate and bounced straight into the red-hot center of the fire.
        - id: ch01-b79
          speaker: anthea
          text: >-
            Quick, get the tongs!
        - id: ch01-b80
          speaker: narrator
          text: >-
            But nobody could remember where the nursery tongs were. Everyone had forgotten that they were last used to fish the doll's teapot from the bottom of the rain barrel after the Lamb dropped it in. The missing tongs were still resting somewhere between that barrel and the dustbin. Cook, meanwhile, refused to lend them the kitchen pair.
        - id: ch01-b81
          speaker: robert
          text: >-
            Never mind. We can get the egg out with the poker and shovel.
        - id: ch01-b82
          speaker: anthea
          text: >-
            Wait! Look at it. Look, look! I really think something is about to happen!
          emotion: surprised
        - id: ch01-b83
          speaker: narrator
          text: >-
            The egg had turned red-hot, and there was no mistaking it now. Something inside it was moving. A soft cracking sound came from the shell. It broke into two pieces, and out stepped a flame-colored bird. For one moment the bird rested there among the flames. As the four children watched, it grew larger and larger right before their eyes.

            Every mouth hung open. Every eye stared.

            The bird rose in its fiery nest, stretched both wings wide, and flew out into the room. It circled them once, twice, then went around again. Wherever the bird passed, the children felt the air turn warm. At last it settled on the fender.

            The children looked at one another. Cyril reached toward it. The bird tilted its head and looked up at him, just as a parrot does before it speaks. So when it spoke, the children were hardly surprised at all.
        - id: ch01-b84
          speaker: phoenix
          text: >-
            Be careful. I am not quite cool yet.
        - id: ch01-b85
          speaker: narrator
          text: >-
            They were not surprised, but they were deeply interested.

            The bird was certainly worth seeing. Every feather looked like gold. It was about the size of a bantam hen, though its beak was not shaped like a bantam's beak at all.
        - id: ch01-b86
          speaker: robert
          text: >-
            I think I know what this bird is. I've seen its picture.
        - id: ch01-b87
          speaker: narrator
          text: >-
            Robert hurried away to Father's study. He dashed at the papers on the table and scrambled through them in great haste. The sort of arithmetic books that tell you about results might have said that his search yielded the desired result. Robert dashed back into the nursery, holding the printed page in front of him.
        - id: ch01-b88
          speaker: robert
          text: >-
            Here, look at this!
        - id: ch01-b89
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Hush!
        - id: ch01-b90
          speaker: narrator
          text: >-
            Robert obeyed at once, because the bird was speaking.
        - id: ch01-b91
          speaker: phoenix
          text: >-
            Which one of you placed my egg in the fire?
        - id: ch01-b92
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: >-
            He did.
        - id: ch01-b93
          speaker: narrator
          text: >-
            Three fingers pointed at Robert. The bird made a movement that was more like a bow than anything else.
        - id: ch01-b94
          speaker: phoenix
          text: >-
            Then I am greatly in your debt.
        - id: ch01-b95
          speaker: narrator
          text: >-
            Wonder and curiosity nearly choked all the children except Robert. He held the paper and knew exactly what the bird was.
        - id: ch01-b96
          speaker: robert
          text: >-
            I know who you are.
        - id: ch01-b97
          speaker: narrator
          text: >-
            He opened the page. At the top was a small picture of a bird sitting in a nest of flames.
        - id: ch01-b98
          speaker: robert
          text: >-
            You're the Phoenix.
        - id: ch01-b99
          speaker: narrator
          text: >-
            The bird was delighted.
        - id: ch01-b100
          speaker: phoenix
          text: >-
            So my fame has survived for two thousand years. Kindly let me see my portrait.
        - id: ch01-b101
          speaker: narrator
          text: >-
            Robert knelt and spread the page on the fender. The Phoenix studied it.
        - id: ch01-b102
          speaker: phoenix
          text: >-
            It is not a flattering likeness. And what are all these marks here?
        - id: ch01-b103
          speaker: narrator
          text: >-
            It pointed to the printed words.
        - id: ch01-b104
          speaker: cyril
          text: >-
            Oh, that part is rather dull. There isn't much about you on this page, though you appear in plenty of books.
        - id: ch01-b105
          speaker: phoenix
          text: >-
            Do those books have portraits of me?
        - id: ch01-b106
          speaker: cyril
          text: >-
            No, I don't think I've ever seen another picture. But I can read you something about yourself if you'd like.
        - id: ch01-b107
          speaker: narrator
          text: >-
            The Phoenix nodded. Cyril fetched the tenth volume of the old encyclopedia and found the entry on page two hundred and forty-six.
        - id: ch01-b108
          speaker: cyril
          text: >-
            "Phoenix. In the study of birds, a fabulous bird from antiquity."
        - id: ch01-b109
          speaker: phoenix
          text: >-
            "Antiquity" is correct. But "fabulous"? Look at me. Do I appear fabulous?
        - id: ch01-b110
          speaker: narrator
          text: >-
            Every child shook their head. Cyril read on.
        - id: ch01-b111
          speaker: cyril
          text: >-
            "Ancient writers describe this bird as the only one of its kind."
        - id: ch01-b112
          speaker: phoenix
          text: >-
            That much is true.
        - id: ch01-b113
          speaker: cyril
          text: >-
            "They say it is about the size of an eagle."
        - id: ch01-b114
          speaker: phoenix
          text: >-
            Eagles come in different sizes. That description is no use at all.
        - id: ch01-b115
          speaker: narrator
          text: >-
            All four children were kneeling on the hearthrug, trying to get as close to the Phoenix as they could.
        - id: ch01-b116
          speaker: phoenix
          text: >-
            You will boil your brains down there. Stand back. I am almost cool now.
        - id: ch01-b117
          speaker: narrator
          text: >-
            Golden wings whirred, and the Phoenix fluttered from the fender to the table. It was nearly cool. Only a faint smell of scorching rose after it settled on the tablecloth.
        - id: ch01-b118
          speaker: phoenix
          text: >-
            I have scorched it only a little. The mark will wash out. Please continue.
        - id: ch01-b119
          speaker: narrator
          text: >-
            The children gathered around the table.
        - id: ch01-b120
          speaker: cyril
          text: >-
            "It is as large as an eagle. Its head has a fine crest and beautiful feathers. Its neck is covered in gold plumage, the rest of its body is purple, its tail alone is white, and its eyes shine like stars. It lives for about five hundred years in the wilderness. When it grows old, it builds a pile of sweet wood and fragrant gums. It fans the pile into flame with its wings and burns itself. From the ashes comes a worm, which grows into another Phoenix. Because of this, the Phoenicians gave—"
        - id: ch01-b121
          speaker: phoenix
          text: >-
            Never mind what the Phoenicians gave. They never gave much. They were the sort of people who gave nothing unless they got something back. That book should be destroyed. It is terribly inaccurate. My body was never purple. And my tail! Just look at it. Is it white?
          emotion: angry
        - id: ch01-b122
          speaker: narrator
          text: >-
            The Phoenix turned around and solemnly showed its golden tail to the children.
        - id: ch01-b123
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            No, it isn't.
        - id: ch01-b124
          speaker: phoenix
          text: >-
            No, and it never was. That nonsense about a worm is a common insult. A Phoenix has an egg, like every respectable bird. It builds the pile, lays the egg, and burns itself. Then it sleeps, wakes inside the egg, hatches, and goes on living. It happens again and again, forever. You cannot imagine how tired I became of it. Such a restless life, with no chance to rest properly.
        - id: ch01-b125
          speaker: anthea
          text: >-
            Then how did your egg come here?
        - id: ch01-b126
          speaker: phoenix
          text: >-
            Ah, that is the secret of my life. I could never tell it to anyone who did not truly understand me. I have always been misunderstood. That story about the worm proves it. But perhaps I could tell you.
        - id: ch01-b127
          speaker: narrator
          text: >-
            Its star-bright eyes rested on Robert.
        - id: ch01-b128
          speaker: phoenix
          text: >-
            After all, you were the one who put me into the fire.
        - id: ch01-b129
          speaker: narrator
          text: >-
            Robert looked uncomfortable.
        - id: ch01-b130
          speaker: cyril
          text: >-
            The rest of us made the fire with sweet-smelling wood and gums.
        - id: ch01-b131
          speaker: robert
          text: >-
            And I ought to tell you that putting you in the fire was an accident.
        - id: ch01-b132
          speaker: narrator
          text: >-
            Robert told the truth, though the words did not come easily. He had no idea how the Phoenix might take such a confession. As it happened, the bird took it in the most unexpected way possible.
        - id: ch01-b133
          speaker: phoenix
          text: >-
            That honest confession has removed my final doubt. I shall tell you my story.
        - id: ch01-b134
          speaker: anthea
          text: >-
            You won't suddenly disappear or anything, will you?
          emotion: fearful
        - id: ch01-b135
          speaker: phoenix
          text: >-
            Why? Do you want me to remain here?
        - id: ch01-b136
          speaker: narrator
          text: >-
            It puffed out its golden feathers.
        - id: ch01-b137
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Oh, yes!
          emotion: happy
        - id: ch01-b138
          speaker: phoenix
          text: >-
            Why?
        - id: ch01-b139
          speaker: narrator
          text: >-
            The Phoenix looked modestly down at the tablecloth. All four children began to answer together, but they could not find the words. After a pause, Jane managed it.
        - id: ch01-b140
          speaker: jane
          text: >-
            Because you're the most beautiful person we have ever seen.
        - id: ch01-b141
          speaker: phoenix
          text: >-
            You are a sensible child. I shall not vanish or do anything sudden. Now I will tell you my story.
        - id: ch01-b142
          speaker: narrator
          text: >-
            The Phoenix began. For many thousands of years, just as the book said, it had lived in the wilderness. The place was large and quiet, with hardly any really good company. After so long there, the sameness of its life had become dreadfully tiring. Every five hundred years, the Phoenix laid its egg and burned itself. It had repeated the ceremony so many times that the whole business had become a habit, and habits are very hard to break.
        - id: ch01-b143
          speaker: cyril
          text: >-
            Yes, they are. Jane used to bite her nails.
        - id: ch01-b144
          speaker: jane
          text: >-
            But I stopped. You know I did.
          emotion: sad
        - id: ch01-b145
          speaker: cyril
          text: >-
            Only after they painted bitter aloes on your fingers.
        - id: ch01-b146
          speaker: phoenix
          text: >-
            I doubt even bitter aloes could have cured my habit. Though the aloe might correct its own bad habit first. It lazily flowers only once in a hundred years. Still, I did break my habit at last. One morning, I woke from a feverish dream. The time was drawing near when I would have to build that tiresome fire and lay that tedious egg. Then I saw two people, a man and a woman, sitting on a carpet. I greeted them politely, and they told me their whole history. Since you have not heard it, I shall tell it now. They were a prince and princess. The princess's mother, when she was young, heard a story about a certain enchanter. I am sure his story will interest you. The enchanter—
        - id: ch01-b147
          speaker: anthea
          text: >-
            Oh, please don't. I can't follow all these stories beginning inside other stories. Each minute you go another story deeper. Please tell us what happened to you. That's the story we want.
        - id: ch01-b148
          speaker: narrator
          text: >-
            On the whole, the Phoenix seemed flattered.
        - id: ch01-b149
          speaker: phoenix
          text: >-
            Very well. I shall shorten about seventy long stories, though I had to sit through every one of them. Of course, there is plenty of time for stories in the wilderness. The prince and princess loved each other so much that they did not want anyone else near them. The enchanter, whose history I promise not to tell, had given them a magic carpet. You have heard of magic carpets, I suppose. They sat on it and asked it to carry them right away from everyone. It brought them to the wilderness. They meant to remain there, so they had no further use for the carpet and gave it to me. That was truly the opportunity of a lifetime.
        - id: ch01-b150
          speaker: jane
          text: >-
            Why would you need a carpet when you have such lovely wings?
        - id: ch01-b151
          speaker: phoenix
          text: >-
            They are lovely wings, aren't they?
        - id: ch01-b152
          speaker: narrator
          text: >-
            The Phoenix spread its wings and smiled to itself before continuing.
        - id: ch01-b153
          speaker: phoenix
          text: >-
            I asked the prince to spread out the carpet, and I laid my egg on it. Then I spoke to the carpet. "My excellent carpet, show me what you can do. Carry this egg to a place where it cannot hatch for two thousand years. When those years have passed, let someone make a fire of sweet wood and fragrant gums and place the egg in it." Everything happened exactly as I asked. The moment the words left my beak, the egg and carpet vanished. The two royal lovers helped arrange my fire and comforted me at the end. I burned away and knew nothing more until I awoke upon that altar.
        - id: ch01-b154
          speaker: narrator
          text: >-
            It pointed one claw toward the grate.
        - id: ch01-b155
          speaker: robert
          text: >-
            But what happened to the magic carpet, the one that carries you anywhere you wish?
        - id: ch01-b156
          speaker: phoenix
          text: >-
            Oh, that carpet? I should say it is this one. I remember the pattern perfectly.
        - id: ch01-b157
          speaker: narrator
          text: >-
            The Phoenix pointed to the floor. There lay the very carpet Mother had bought on Kentish Town Road for twenty-two shillings and ninepence.

            At that instant, Father's key turned in the front door.
        - id: ch01-b158
          speaker: cyril
          text: >-
            Oh! Now we'll be punished for not being in bed.
          emotion: fearful
        - id: ch01-b159
          speaker: phoenix
          text: >-
            Wish yourselves into bed. Then wish the carpet back into place.
        - id: ch01-b160
          speaker: narrator
          text: >-
            No sooner had the Phoenix spoken than the children made both wishes. The journey certainly made them a little dizzy and a little breathless. When everything stopped turning and seemed to be the right way up again, all four children found themselves safely in bed. Every light was out.

            Through the darkness came the Phoenix's soft voice.
        - id: ch01-b161
          speaker: phoenix
          text: >-
            I shall sleep on the cornice above your curtains. Please do not tell your family about me.
        - id: ch01-b162
          speaker: robert
          text: >-
            There wouldn't be much point. They would never believe us. Listen!
        - id: ch01-b163
          speaker: narrator
          text: >-
            He called through the half-open door to the girls.
        - id: ch01-b164
          speaker: robert
          text: >-
            We wanted adventures and things to happen. We ought to get plenty of fun from a magic carpet and a Phoenix.
        - id: ch01-b165
          speakers: [anthea, jane]
          ensemble: duo
          text: >-
            Of course we will.
        - id: ch01-b166
          speaker: father
          text: >-
            Children, go to sleep at once. What do you mean by talking so late?
        - id: ch01-b167
          speaker: narrator
          text: >-
            Father was coming up the stairs. He did not expect an answer, but Cyril murmured one beneath the bedclothes.
        - id: ch01-b168
          speaker: cyril
          text: >-
            What do we mean? I don't know. I don't know what anything means.
        - id: ch01-b169
          speaker: robert
          text: >-
            But we have a magic carpet and a Phoenix.
        - id: ch01-b170
          speaker: cyril
          text: >-
            You'll have something else if Father comes in and catches you. Be quiet.
        - id: ch01-b171
          speaker: narrator
          text: >-
            Robert was quiet. But he knew, just as you do, that the adventures of the carpet and the Phoenix had only just begun.

            Father and Mother had no idea what had happened while they were out. That is often the way, even in houses without magic carpets or Phoenixes.

            As for the next morning, surely you would rather wait until the next chapter to hear about that.
