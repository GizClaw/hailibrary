audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带一点英式童话的机智
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明自信，挖苦人时一本正经
        timbre: 清脆的少年声
        pace: 中等偏快
        pitch: 中高
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴敏锐，急切时仍然清楚
        timbre: 柔和明亮的少女声
        pace: 中等
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 坚持己见，认真里常带几分莽撞
        timbre: 结实清朗的少年声
        pace: 中等
        pitch: 中等
    jane:
      display_name: 简
      tts:
        delivery: 天真直率，话里带着小孩子的认真
        timbre: 稚嫩柔软的女孩声
        pace: 稍慢
        pitch: 偏高
    phoenix:
      display_name: 凤凰
      tts:
        delivery: 文雅自负，庄重中带着敏锐的幽默
        timbre: 华美清润，中性而成熟
        pace: 从容
        pitch: 中高
    french_woman:
      display_name: 法国女人
      tts:
        delivery: 热情有礼，悲喜都来得真切而强烈
        timbre: 略显疲惫的成年女声
        pace: 中等偏快
        pitch: 中等
    henri:
      display_name: 小亨利
      tts:
        delivery: 稚气活泼，兴奋时脱口而出
        timbre: 清亮的男童声
        pace: 稍快
        pitch: 偏高
  chapters:
    - id: ch01
      title: 最后一天的愿望
      blocks:
        - id: ch01-b01
          speaker: robert
          text: 可是这一整个星期，我们哪儿也不能坐地毯去了。
        - id: ch01-b02
          speaker: jane
          text: 我倒觉得挺好。
        - id: ch01-b03
          speaker: cyril
          text: 挺好？这你也高兴？
        - id: ch01-b04
          speaker: narrator
          text: 大家正在吃早饭。妈妈来信说，孩子们都要去林德赫斯特的姨妈家过圣诞，爸爸妈妈也会到那里和他们会合。信已经传着看过一遍，现在躺在桌上，一只角泡着热熏肉油，另一只角沾着橘子酱。
        - id: ch01-b05
          speaker: jane
          text: 对，我就是高兴。眼下我可不想再遇上什么事了。现在的感觉，就像一个星期赶了三场聚会，还外加玩具、巧克力这些东西。以前在外婆家就有过一回。我只想让什么都变得实实在在，别再出稀奇事。
        - id: ch01-b06
          speaker: anthea
          text: 我不喜欢瞒着妈妈。也说不上为什么，可我总觉得自己又自私，又卑鄙。
        - id: ch01-b07
          speaker: cyril
          text: 要是能让妈妈相信，我们就可以带她去最好玩的地方了。可现在嘛，只能接着自私卑鄙下去，假如这真算自私卑鄙的话。反正我看不算。
        - id: ch01-b08
          speaker: anthea
          text: 我知道不算，可心里还是觉得算。一样叫人难受。
        - id: ch01-b09
          speaker: robert
          text: 那还更糟呢。明知道不对，心里却一点感觉也没有，反倒没这么要紧。
        - id: ch01-b10
          speaker: cyril
          text: 爸爸说，那种人叫惯犯。
        - id: ch01-b11
          speaker: narrator
          text: 西里尔拿起妈妈的信，用手绢擦了擦两只角。那手绢本来的颜色早就看不大出来，所以沾点熏肉油和橘子酱，也不太要紧。
        - id: ch01-b12
          speaker: robert
          text: 不管怎样，我们明天就走。可别身在福中不知福。安西娅什么办法都试过了，想把秘密交给妈妈，是妈妈不肯收。既然大家都明白，就别浪费今天，老说瞒着妈妈有多讨厌。咱们坐地毯走一趟，好好许个愿。下星期够你们慢慢忏悔了。
        - id: ch01-b13
          speaker: cyril
          text: 对，就这么办。其实这事也没错。
        - id: ch01-b14
          speaker: anthea
          text: 那你们听我说。圣诞节有个特别的地方，会让人想做个好孩子，哪怕平常根本不想。能不能让地毯带我们去一个地方，给我们机会做一件善良的好事？反正也算一场冒险呀。
        - id: ch01-b15
          speaker: cyril
          text: 我赞成。只要不知道去哪儿，就够刺激了，谁也猜不到会出什么事。最好穿上外套，万一……
        - id: ch01-b16
          speaker: jane
          text: 说不定我们会救出一个埋在雪里的旅人，就像圣伯纳犬那样，脖子上还挂着小酒桶。
        - id: ch01-b17
          speaker: robert
          text: 也许会赶上有人签遗嘱。请再给我一点茶。我们看见一个老头把遗嘱塞进暗柜。多年以后，合法继承人彻底绝望了，我们再领他找到那块暗板，然后……
        - id: ch01-b18
          speaker: anthea
          text: 对，也可能把我们送到德国城里一间冷冰冰的阁楼，那儿有个又穷、又苍白、还生了病的小孩……
        - id: ch01-b19
          speaker: cyril
          text: 可我们没有德国钱，这个不行。我最想落在一场战争正中间，拿到秘密情报，再送给将军。那样他就会任命我做中尉，或者侦察兵，也可能是骠骑兵。
        - id: ch01-b20
          speaker: narrator
          text: 早饭收拾完，安西娅把地毯仔细扫干净，孩子们一个个坐了上去。凤凰也在。大家特意请它同去，一来想让它过个愉快的圣诞节，二来也想让它亲眼看看，他们到底会做出怎样一件善良的好事。四个孩子和一只鸟全都准备妥当，愿望也清清楚楚地许了出来。接着，大家一起闭上眼睛，盼着这样能让地毯移动时那阵天旋地转的感觉轻一点。
        - id: ch01-b21
          speaker: narrator
          text: 可他们再睁眼时，还是坐在地毯上，地毯也还铺在卡姆登镇自家育儿室的地板上。
        - id: ch01-b22
          speaker: cyril
          text: 嘿，这可真妙！
        - id: ch01-b23
          speaker: robert
          text: 它是不是坏了？我是说，许愿的那部分坏了？
        - id: ch01-b24
          speaker: phoenix
          text: 不是因为这个。不过，唔，你们到底许了什么愿？
        - id: ch01-b25
          speaker: robert
          text: 哦，我知道它是什么意思了。就像星期日杂志上那些童话的结尾，真叫人恶心！
          emotion: disgusted
        - id: ch01-b26
          speaker: cyril
          text: 你是说，它觉得我们留在这儿也能做好事？我明白了。大概想叫我们替厨娘搬煤，或者给没衣服穿的异教徒做衣裳。哼，我偏不干。今天还是最后一天呢。听清楚！我们要去一个真正有意思的地方，在那里做一件善良的好事。不是在这儿，是到别处去。明白了吗？那就走吧。
        - id: ch01-b27
          speaker: narrator
          text: 听话的地毯马上出发。四个孩子和一只鸟滚成一团，才刚摔倒，就一头扎进伸手不见五指的黑暗里。
    - id: ch02
      title: 黑暗的通道
      blocks:
        - id: ch02-b01
          speaker: anthea
          text: 大家都在吗？
        - id: ch02-b02
          speaker: narrator
          text: 安西娅在黑暗里喘着气。人人都说自己还在。
        - id: ch02-b03
          speaker: jane
          text: 这是哪儿？哎呀，又冷又湿！呃，呀！我的手按进水洼了！
        - id: ch02-b04
          speaker: anthea
          text: 有谁带火柴了吗？
        - id: ch02-b05
          speaker: narrator
          text: 安西娅问得十分绝望，她认定谁也没带。就在这时，罗伯特露出了胜利的灿烂笑容，可惜四周太黑，谁也看不见。他从口袋里摸出一盒火柴，擦亮一根，点起一支蜡烛。不，是两支。突如其来的亮光照得大家张着嘴，只管眨眼。
        - id: ch02-b06
          speakers: [anthea, jane]
          ensemble: duo
          text: 干得真漂亮，鲍勃斯！
        - id: ch02-b07
          speaker: narrator
          text: 连西里尔那种天生的兄长脾气，也没能压住他对罗伯特这份先见之明的佩服。
        - id: ch02-b08
          speaker: robert
          text: 从孤塔那天起，我就一直带在身上。我早知道迟早用得着。这个秘密守得够好吧？
        - id: ch02-b09
          speaker: cyril
          text: 哦，是呀。第二个星期日，我去你那件诺福克夹克里找你借走的小刀，就看见它们了。我还以为你偷拿火柴，是想点中国灯笼，或者躲在床上看书呢。
        - id: ch02-b10
          speaker: anthea
          text: 鲍勃斯，你知道这是哪儿吗？就是那条地下通道。看呀，钱、钱袋，还有那些东西，全在这儿。
        - id: ch02-b11
          speaker: narrator
          text: 十只眼睛渐渐习惯了烛光。谁也不能不承认，安西娅说得没错。
        - id: ch02-b12
          speaker: jane
          text: 可这里不像能做好事的地方。连一个可以帮的人都没有。
        - id: ch02-b13
          speaker: cyril
          text: 别这么肯定。说不定下个弯后面，就关着一个在这里苦熬了好多年的囚犯。我们可以坐地毯带他出去，把他送回那些为他伤心的亲友身边。
        - id: ch02-b14
          speaker: robert
          text: 当然。也可能只找到一个可怜囚犯的骨头，再把骨头送给他的亲友好好安葬。书里总说这是善举，虽说我一直不明白骨头会在乎什么。
        - id: ch02-b15
          speaker: jane
          text: 真希望你别说了。
        - id: ch02-b16
          speaker: robert
          text: 我还正好知道去哪儿找。瞧见通道前面那道黑拱门了吗？就在那里面……
        - id: ch02-b17
          speaker: jane
          text: 你再说下去，我就尖叫，然后昏过去。我说到做到！
        - id: ch02-b18
          speaker: anthea
          text: 我也会。
        - id: ch02-b19
          speaker: narrator
          text: 罗伯特的想象刚要展翅高飞，就被拦住了，他很不高兴。
        - id: ch02-b20
          speaker: robert
          text: 你们女孩子永远当不了大作家。大作家最爱想地牢里的东西，还有锁链，一节一节凸出来的光秃人骨头，还有……
          emotion: angry
        - id: ch02-b21
          speaker: narrator
          text: 简已经张开嘴准备尖叫，可她还不知道，要昏过去该先做什么。凤凰金灿灿的声音先穿过黑暗，响了起来。
        - id: ch02-b22
          speaker: phoenix
          text: 安静！这里没有别的骨头，只有你们身体里那几副小小的、却很有用的骨头。你们请我出来，是让我看你们做善事，不是听你们谈骨头。
        - id: ch02-b23
          speaker: robert
          text: 在这里又做不了。
        - id: ch02-b24
          speaker: phoenix
          text: 不错。眼下看来，在这里能做的只有吓唬自己的小妹妹。
        - id: ch02-b25
          speaker: jane
          text: 他根本没吓到我，而且我也没那么小。
        - id: ch02-b26
          speaker: narrator
          text: 简这话多少有点不知好歹。罗伯特不再开口。西里尔提议，也许最好把钱带走。
        - id: ch02-b27
          speaker: anthea
          text: 那只对我们自己算好事。而且把不属于我们的钱拿走，怎么也不能叫善举。
        - id: ch02-b28
          speaker: cyril
          text: 可以拿去全都帮助贫苦的老人。
        - id: ch02-b29
          speaker: anthea
          text: 用偷来的钱行善，也不能让偷钱变成对的。
        - id: ch02-b30
          speaker: cyril
          text: 这个我可说不准。偷东西，就是拿走别人的东西。可这里又没有别人。
        - id: ch02-b31
          speaker: narrator
          text: 这时人人都站起来了。
        - id: ch02-b32
          speaker: cyril
          text: 如果……那就不能算偷……
        - id: ch02-b33
          speaker: robert
          text: 说得真好。咱们就在这儿争一天，等蜡烛烧完吧。重新黑下来，你们准喜欢得很。还有骨头呢。
        - id: ch02-b34
          speaker: anthea
          text: 先出去，边走边争。
        - id: ch02-b35
          speaker: narrator
          text: 他们卷起地毯向前走，沿通道爬到无顶塔楼下面，却发现出口被一块大石头堵得死死的，怎么也推不开。
        - id: ch02-b36
          speaker: robert
          text: 瞧吧！这下你们满意了？
        - id: ch02-b37
          speaker: phoenix
          text: 凡事都有两个尽头。争吵是这样，秘密通道也是这样。
        - id: ch02-b38
          speaker: narrator
          text: 大家只好往回走。骨头是罗伯特先提的，于是罚他拿一支蜡烛走在最前面，西里尔扛着地毯。
        - id: ch02-b39
          speaker: jane
          text: 真希望你没把骨头塞进我们脑子里。
        - id: ch02-b40
          speaker: robert
          text: 我可没塞。你们本来就有，而且骨头比脑子还多呢。
        - id: ch02-b41
          speaker: narrator
          text: 通道很长，一路尽是拱门、台阶、转弯，还有黑洞洞的壁龛。女孩子们很不喜欢从那些地方经过。通道尽头有一段石阶，罗伯特走了上去，却突然踉踉跄跄地重重退下来，一脚踩中紧跟在后面的简。
        - id: ch02-b42
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: 呀！出什么事了？
        - id: ch02-b43
          speaker: robert
          text: 没什么，不过是脑袋撞碎了。别管我，我喜欢这样。楼梯直通到天花板，还是石头的。压在一块铺路石底下，能做什么善良的好事？
        - id: ch02-b44
          speaker: phoenix
          text: 楼梯通常不是特意造来通向铺路石底下的。把肩膀抵住轮子，用力推吧。
        - id: ch02-b45
          speaker: robert
          text: 这里又没有轮子。
        - id: ch02-b46
          speaker: narrator
          text: 罗伯特还揉着撞疼的脑袋。西里尔已经从他身边挤过去，登上最顶一级，用尽全力去推头上的石块。石块当然一动不动。
        - id: ch02-b47
          speaker: cyril
          text: 如果这是扇活板门……对了，这儿有门闩。可我扳不动。
        - id: ch02-b48
          speaker: narrator
          text: 巧得很，西里尔口袋里正装着爸爸自行车的油壶。他把地毯放在台阶下面，仰面躺好，脑袋枕着最高一级，两条腿垂进弟弟妹妹中间。他往门闩上加油，铁锈和油珠直往脸上滴。有一滴还落进他嘴里，因为这个姿势太累，他正张嘴喘气。
        - id: ch02-b49
          speaker: narrator
          text: 他又试了一回，门闩还是不动。于是，他拿出自己那块沾过熏肉油和橘子酱的手绢，把一头系在门闩上，又用平结接上罗伯特的手绢。平结不管怎么拉都不会松，只会越拉越紧，可千万别同老奶奶结弄混。老奶奶结只要看上一眼，就会自己散开。西里尔和罗伯特抓住手绢一起拉，两个女孩子从后面搂住哥哥们，也跟着使劲。
        - id: ch02-b50
          speaker: narrator
          text: 门闩忽然锈声嘎吱一下，松开了。所有人立刻滚成一团，一直摔到台阶底下。凤凰除外，他们才开始拉，它就飞起来了。幸好卷着的地毯接住大家，谁也没怎么受伤。
        - id: ch02-b51
          speaker: narrator
          text: 这回，男孩子们的肩膀总算真派上了用场。两人用肩一顶，石板松动起来，灰尘纷纷落在他们身上。
        - id: ch02-b52
          speaker: robert
          text: 来吧，大家一起推。一、二、三！
          emotion: happy
        - id: ch02-b53
          speaker: narrator
          text: 石板真的被顶起来了。它沿着一道嘎吱作响、万分不情愿的铰链慢慢往上翻，耀眼的天光先露出一条缝，又变成一块越来越大的长方形。最后，石板砰地倒在某样东西上，那东西正好把它撑得直立起来。孩子们一个接一个，从洞口爬了出去。可到了外面才发现，他们竟挤在一间铺着石板的小屋里，地方小得根本容不下所有人。等凤凰也拍着翅膀从黑暗中飞上来，他们才把石板放下。它严严实实地合拢，活像一扇活板门。其实，它本来就是活板门。
    - id: ch03
      title: 路边的小神龛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 你简直想象不到孩子们有多脏，衣服和头发上又落了多少灰。幸好除了他们自己，没有别人看见。他们原来站在路边一座小神龛里。那条路穿过一片片黄绿色的田野，弯弯曲曲地往无顶塔楼爬去。往下看，到处是田地和果园。光秃秃的枝条伸向天空，褐色的犁沟一道接一道，零零落落的小屋和花园夹在中间。
        - id: ch03-b02
          speaker: narrator
          text: 小神龛像一间没有正墙的微型礼拜堂，供赶路的人歇歇脚，想一想该怎样做个好人。凤凰是这样告诉他们的。里面立着一尊像，本来涂着鲜艳的颜色，可雨雪从敞开的正面打进来，已经把它冲得黯淡斑驳。像下面写着，圣让·德·吕兹，请为我们祈祷。
        - id: ch03-b03
          speaker: narrator
          text: 这里冷清荒凉，已经很久没人照料。不过安西娅想，那些贫苦的旅人一路匆忙又忧烦，能进这座小小的歇脚屋安静几分钟，想想怎么做个好人，总是件好事。她又想到圣让·德·吕兹，他生前想必十分善良，于是比先前更想做一件善事。
        - id: ch03-b04
          speaker: anthea
          text: 告诉我们吧。地毯把我们带来，到底要做哪件善良的事？
        - id: ch03-b05
          speaker: cyril
          text: 我看，找到财宝的主人，再把这件事告诉他们，就是一桩善举。
        - id: ch03-b06
          speaker: jane
          text: 还要把财宝全给他们吗？
        - id: ch03-b07
          speaker: cyril
          text: 对。可财宝到底是谁的？
        - id: ch03-b08
          speaker: phoenix
          text: 我去第一所房子，问问城堡的主人叫什么。
        - id: ch03-b09
          speaker: narrator
          text: 这个主意听起来确实不错。他们先站在神龛里，尽量替彼此把衣服上的灰尘拍掉，这才顺着路往山下走。没走多远，便看到一股细细的泉水从山坡里冒出来，清水一直流进一只用粗石凿成的水盆。水盆四周长着一丛丛披散的鹿舌蕨，只是到了这个季节，叶子上几乎已经找不到一点绿意。
        - id: ch03-b10
          speaker: narrator
          text: 孩子们洗过手脸，又拿手绢擦干。每到这种时候，手绢都会显得小得出奇。西里尔和罗伯特那两块甚至让脸又脏回去不少。可不管怎样，他们看起来总比刚才干净了。
        - id: ch03-b11
          speaker: narrator
          text: 他们遇到的第一所房子很小，白墙、绿百叶窗、石板屋顶，端端正正立在一座整齐的小花园里。洁净的小路两旁摆着巨大的石花瓶，本来是留给人种花的，不过眼下花全都死了。房子一侧有条宽阔的游廊，用木杆和格子架搭成，葡萄藤爬满了架子。这游廊比英国常见的还宽。安西娅想，等到绿叶长满、葡萄结出来，这里一定美极了。可现在，架上只有干枯的红褐色枝蔓，勾着寥寥几片萎缩的叶子。
        - id: ch03-b12
          speaker: narrator
          text: 前门又窄又绿，旁边垂着一根带把手的链子，明明白白连着门廊下一只生锈的铃。西里尔已经拉响了它。刺耳的铃声快要消散时，一个可怕的念头才同时闯进每个人心里。
        - id: ch03-b13
          speaker: cyril
          text: 我的天！我们谁也不会说法语！
        - id: ch03-b14
          speaker: narrator
          text: 门就在这时开了。一个瘦得出奇的高个女人站在面前。她那淡色卷发像灰白褐色的纸条，又像刨下来的橡木屑。她穿着难看的灰裙子，外面罩一条黑绸围裙。小小的灰眼睛不算好看，眼圈还红着，仿佛刚哭过。
        - id: ch03-b15
          speaker: narrator
          text: 她说了一串听起来像外国语的话，最后一句显然是个问题。孩子们当然谁也答不上来。
        - id: ch03-b16
          speaker: robert
          text: 她说了什么？
        - id: ch03-b17
          speaker: narrator
          text: 罗伯特低头问夹克的凹处，凤凰正安顿在那里。凤凰还没回答，那女人脸上忽然亮起一个非常迷人的笑容。
        - id: ch03-b18
          speaker: french_woman
          text: 你们，你们是英国来的！我非常爱英国。Mais entrez，entrez donc tous！快进来，全都进来。先在地毯上擦擦脚。
          emotion: happy
        - id: ch03-b19
          speaker: narrator
          text: 她指了指脚垫。
        - id: ch03-b20
          speaker: cyril
          text: 我们只想问……
        - id: ch03-b21
          speaker: french_woman
          text: 你们想知道什么，我都告诉你们。只管进来吧！
        - id: ch03-b22
          speaker: narrator
          text: 他们全进了屋，在非常干净的脚垫上擦过鞋，又把地毯安稳地放在游廊一角。
        - id: ch03-b23
          speaker: french_woman
          text: 我这一生最美好的日子，都是在英国过的。已经好久没听到英国人的声音了，一听见，往事全回来了。
        - id: ch03-b24
          speaker: narrator
          text: 她这样热情地招待他们，反倒叫大家都局促起来，男孩子们尤其不自在。门厅铺着红白相间的地砖，干净得简直挑不出一点灰。起居室的地板更是擦得发亮，活像一面黑镜子。走在这样的屋里，人人都觉得自己脚上的靴子仿佛一下多出了好几双。每迈一步，声音也好像比平常响了好几倍。
        - id: ch03-b25
          speaker: narrator
          text: 壁炉里烧着一小堆柴火，火焰虽小，却十分明亮。整整齐齐的小木柴架在黄铜柴架上。淡色墙壁挂着几幅椭圆肖像，画里的先生太太脸上都扑着粉。壁炉台摆着银烛台，椅子和桌子也都细细瘦瘦，彬彬有礼地伸着纤巧的腿。房间空得厉害，却有一种明亮的异国式空旷。那份空旷以它独有的古怪方式，叫人觉得十分愉快。
        - id: ch03-b26
          speaker: narrator
          text: 擦得锃亮的长桌尽头，一个很不像英国人的小男孩坐在脚凳上，背后摆着一把看起来就不舒服的高背椅。他身上穿的是黑天鹅绒衣服，短裤也是黑天鹅绒的，连短短的头发看着都像天鹅绒。领口更是堆满了褶边和花边。那种领子，罗伯特觉得自己宁可死也不肯戴。不过，这个法国小男孩比罗伯特小得多。
        - id: ch03-b27
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 啊，真漂亮！
        - id: ch03-b28
          speaker: narrator
          text: 他们夸的并不是那个穿天鹅绒短裤、头发也像短短天鹅绒的小男孩，而是一棵小得不得了的圣诞树。树栽在鲜红花盆里，绿油油的枝头挂满金属箔和彩纸做的小饰物，还插着尚未点亮的小蜡烛。
        - id: ch03-b29
          speaker: french_woman
          text: 是不是很雅致？你们坐下，我们一起来看。
        - id: ch03-b30
          speaker: narrator
          text: 孩子们在靠墙的硬椅子上坐成一排。女人从柴火上点燃一支细长的红蜡烛，拉起窗帘，再把树上的小蜡烛一支支点亮。
        - id: ch03-b31
          speaker: henri
          text: Bravo, ma tante！Oh, que c’est gentil！
          emotion: happy
        - id: ch03-b32
          speaker: narrator
          text: 英国孩子们也齐声欢呼。罗伯特胸口里忽然一阵挣扎，凤凰扑着翅膀飞出来，展开金翅，落在圣诞树顶上。
        - id: ch03-b33
          speaker: french_woman
          text: 啊！快抓住它，它会把自己烧着的！你们这只雅致的长尾鹦鹉！
          emotion: fearful
        - id: ch03-b34
          speaker: robert
          text: 不会的，谢谢您。
        - id: ch03-b35
          speaker: narrator
          text: 小男孩拍起干干净净的手。女人实在担心得厉害，凤凰只得飞下来，在光亮的胡桃木桌面上来回踱步。
        - id: ch03-b36
          speaker: french_woman
          text: 它会讲话吗？
        - id: ch03-b37
          speaker: phoenix
          text: Parfaitement, madame！
        - id: ch03-b38
          speaker: french_woman
          text: 哦，多漂亮的长尾鹦鹉。它还会说别的吗？
        - id: ch03-b39
          speaker: phoenix
          text: 圣诞节就要到了，你为什么还这么伤心？
        - id: ch03-b40
          speaker: narrator
          text: 孩子们倒吸一口气，又惊又怕地看着凤凰。连最小的简都知道，发现陌生人刚哭过已经很失礼，再问人家为什么哭，就更加糟糕。
        - id: ch03-b41
          speaker: narrator
          text: 果然，女人先骂凤凰是只没心肝的鸟，接着便放声大哭起来。她一时怎么也找不到自己的手绢，安西娅连忙把自己的递过去。可那块手绢刚才洗脸时弄湿了，到现在还是湿漉漉的，半点用也没有。于是安西娅伸手抱住女人，这一抱似乎比手绢管用得多。过了一会儿，女人终于不哭了，也找到了自己的手绢。她擦干眼睛，还叫安西娅心爱的小天使。
        - id: ch03-b42
          speaker: anthea
          text: 真对不起，偏偏在您这么伤心的时候来打扰。其实我们只想问，山上那座城堡是谁的。
        - id: ch03-b43
          speaker: french_woman
          text: 哦，我的小天使。直到今天，那座城堡几百年来一直属于我们家。可明天，我就不得不把它卖给陌生人。我的小亨利什么也不知道，他永远不能继承祖传的土地了。但我又有什么办法？他的父亲，也就是我的兄弟，侯爵先生，花掉了许多钱。虽然我敬重自己的家族，也得承认，我那圣人般的父亲同样……
          emotion: sad
        - id: ch03-b44
          speaker: cyril
          text: 要是您找到了许许多多的钱呢？成百上千枚金币。那您会怎么想？
        - id: ch03-b45
          speaker: narrator
          text: 女人忧伤地笑了。
        - id: ch03-b46
          speaker: french_woman
          text: 啊，原来有人给你们讲过那个传说？据说很久很久以前，我们的一位祖先藏起过一笔财宝。金子、金子，还是金子，多得足够让我的小亨利富足一生。可那些事呀，孩子们，不过是仙女故事。
          emotion: sad
        - id: ch03-b47
          speaker: phoenix
          text: 她说的是童话。快把你们发现的事告诉她。
        - id: ch03-b48
          speaker: narrator
          text: 凤凰低声提醒罗伯特，于是罗伯特把他们发现财宝的事从头讲了出来。安西娅和简担心女人会像书里的人那样，因为太高兴而昏倒，便一左一右紧紧抱住她。两个女孩都是真心替她欢喜，所以这个拥抱既热烈又快活，里面没有半点是为了自己。
        - id: ch03-b49
          speaker: robert
          text: 我们怎么进去的，就不用解释了。您听着会觉得难懂，也更难相信。不过，我们能带您去看金子藏在哪儿，还能帮您把它运出来。
        - id: ch03-b50
          speaker: narrator
          text: 女人心不在焉地抱着两个女孩，眼睛还是半信半疑地望着罗伯特。
        - id: ch03-b51
          speaker: anthea
          text: 他没有编故事。这是真的，真的，真的！我们高兴极了！
          emotion: happy
        - id: ch03-b52
          speaker: french_woman
          text: 你们不会忍心拿一个老太婆取乐吧？这也不会是一场梦吧？
        - id: ch03-b53
          speaker: cyril
          text: 确实是真的。请容我向您表示万分恭喜。
        - id: ch03-b54
          speaker: narrator
          text: 西里尔特意摆出彬彬有礼的口气。奇怪的是，这比其他人的欢呼雀跃更让女人相信。
        - id: ch03-b55
          speaker: french_woman
          text: 如果我不是在做梦……亨利，去叫玛侬来。你们呢，全都跟我去见神父先生，好吗？
        - id: ch03-b56
          speaker: narrator
          text: 玛侬很快来了。她是个满脸皱纹的老妇人，头上包着一块红黄相间的头巾。她把小亨利抱走了。圣诞树和突然到来的客人给他带来太多兴奋，这会儿他已经困得连眼睛都睁不开。女人也准备出门。她先披上一件硬挺的黑斗篷，再戴上一顶模样奇妙的黑绸软帽，最后又在黑色羊绒居家靴外面套上一双黑木屐。
        - id: ch03-b57
          speaker: narrator
          text: 一行人沿路来到另一幢小白屋，模样同刚离开的那幢很像。一位面相慈祥的老神父迎接他们，礼貌周全得把惊讶全遮住了。
        - id: ch03-b58
          speaker: narrator
          text: 女人挥舞双手，耸动肩膀，用颤抖的法语讲完经过。不懂英语的神父也耸起肩，挥起双手，同样用法语说开了。
        - id: ch03-b59
          speaker: phoenix
          text: 他觉得，她给这些烦恼逼得脑子失常了。你们不会法语，真是可惜！
        - id: ch03-b60
          speaker: robert
          text: 我明明学过不少法语。可全是园丁儿子的铅笔、面包师侄女的小刀，没有一句是人真正想说的。
          emotion: angry
        - id: ch03-b61
          speaker: phoenix
          text: 要是由我开口，他会以为自己也疯了。
        - id: ch03-b62
          speaker: robert
          text: 那你告诉我该怎么说。
        - id: ch03-b63
          speaker: phoenix
          text: 说，C’est vrai, monsieur. Venez donc voir。
        - id: ch03-b64
          speaker: robert
          text: Say vray, mossoo; venny dong vwaw。
        - id: ch03-b65
          speaker: narrator
          text: 神父发现罗伯特的法语从这几个有用的词开头，也在这里结束，多少有些失望。不过他至少明白，就算那女人疯了，发疯的也不只她一个。于是，他戴上宽大的海狸皮帽，拿好蜡烛、火柴和铲子。众人一起上山，走向路旁那座圣让·德·吕兹神龛。
    - id: ch04
      title: 财宝的主人
      blocks:
        - id: ch04-b01
          speaker: robert
          text: 现在我走前面，带你们去看。
        - id: ch04-b02
          speaker: narrator
          text: 他们把铲子的一角塞到石板底下，大家一起使劲，把沉重的石板撬了起来。罗伯特果然第一个顺着入口下去，其他人一个接一个紧跟在后。到了通道里，他们发现那堆黄金财宝仍然好端端地留在原处，钱和钱袋一样也没有少。每个人脸上都亮了起来，满面红光，因为他们真的做成了一件了不起的善事。
        - id: ch04-b03
          speaker: narrator
          text: 女人和神父紧紧握住彼此的手，像法国人那样欢喜得流下眼泪。他们一同跪下来，伸手摸了摸那些钱，又立刻飞快地说起话来，而且两个人同时在说。女人站起来，把每个孩子都拥抱了三遍，一遍也没有少，还管他们叫小花园天使。
        - id: ch04-b04
          speaker: narrator
          text: 接着，她和神父又各自伸出两只手，紧紧握住对方，不停地讲啊讲。他们说得又快，又满是法国味，话一句追着一句，快到你根本想不到世上竟还能有这样的速度。孩子们站在一旁，看着两个人又哭又笑，自己也欢喜得一句话都说不出来。
        - id: ch04-b05
          speaker: phoenix
          text: 现在就走。
        - id: ch04-b06
          speaker: narrator
          text: 凤凰轻声开口，打断了这场光辉灿烂的美梦。孩子们没有惊动谁，只是一个接一个悄悄溜走，穿过小神龛回到外面的路上。女人和神父仍旧一边流泪，一边说个不停。他们实在太幸福了，根本没有发现自己的守护天使已经离开。
        - id: ch04-b07
          speaker: narrator
          text: 这些花园天使一路跑下山，回到女人的小屋。先前放在游廊角落里的地毯还好好留在那里。大家赶紧把它铺开，坐到上面，只说了一声回家。没有别人看见他们从游廊上消失，只有小亨利瞧见了。他把鼻子紧紧压在窗玻璃上，鼻尖挤得像一颗白纽扣。后来，他试着把看到的事告诉姨妈，姨妈却只当他做了个梦。所以，一切都很妥当。
        - id: ch04-b08
          speaker: narrator
          text: 喝茶时，大家又谈起这场经历。
        - id: ch04-b09
          speaker: anthea
          text: 这是我们做过最棒的一件事。以后坐地毯，我们就只去做好事。
          emotion: happy
        - id: ch04-b10
          speaker: phoenix
          text: 咳哼！
        - id: ch04-b11
          speaker: anthea
          text: 您说什么？
        - id: ch04-b12
          speaker: phoenix
          text: 哦，没什么。我只是在想事情！
