  chapters:
    - id: ch01
      title: DOING GOOD
      blocks:
        - id: ch01-b01
          speaker: robert
          text: >-
            We won't be able to go anywhere on the carpet for a whole week.
        - id: ch01-b02
          speaker: jane
          text: >-
            And I'm glad.
        - id: ch01-b03
          speaker: cyril
          text: >-
            Glad? You're glad?
          emotion: surprised
        - id: ch01-b04
          speaker: narrator
          text: >-
            It was breakfast time. Mother's letter had gone around the table and been read by everyone. It said they would all spend Christmas with their aunt at Lyndhurst, where Father and Mother would meet them. Now one corner of the letter soaked up hot bacon fat while another rested in the marmalade.
        - id: ch01-b05
          speaker: jane
          text: >-
            Yes, I am. I don't want anything else to happen just now. I feel the way you do after three parties in one week, like that time at Granny's, with extra treats and toys and chocolates between them. I want everything to be real for a while, with nothing magical happening.
        - id: ch01-b06
          speaker: anthea
          text: >-
            I hate having to hide things from Mother. I can't explain it, but keeping secrets from her makes me feel selfish and mean.
        - id: ch01-b07
          speaker: cyril
          text: >-
            If only we could make the mater believe us, we could take her to the most splendid places. Since we can't, I suppose we have to keep the secret. But I don't think that makes us selfish or mean.
        - id: ch01-b08
          speaker: anthea
          text: >-
            I know it doesn't. It still feels as if it does, and that's just as bad.
        - id: ch01-b09
          speaker: robert
          text: >-
            Worse, really. If you knew it was wrong but didn't feel bad, it wouldn't trouble you nearly so much.
        - id: ch01-b10
          speaker: cyril
          text: >-
            Father calls that being a hardened criminal.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Cyril picked up Mother's letter and wiped its greasy corners with his handkerchief. A little bacon fat and marmalade made no great difference to the color of that handkerchief.
        - id: ch01-b12
          speaker: robert
          text: >-
            Anyway, we're leaving tomorrow. Let's not be ungrateful for what we've got. There's no sense wasting today complaining about keeping secrets when Anthea tried her hardest to tell Mother and Mother wouldn't believe her. Let's take the carpet out and make one really good wish. We'll have all next week to repent.
        - id: ch01-b13
          speaker: cyril
          text: >-
            Yes, let's. It isn't truly wrong.
        - id: ch01-b14
          speaker: anthea
          text: >-
            Then listen. Christmas makes you want to be good, even if you don't much want to at other times. Couldn't we ask the carpet to take us somewhere we can do something good and kind? It would still be an adventure.
        - id: ch01-b15
          speaker: cyril
          text: >-
            All right. We won't know where we're going, so that should be exciting. Anything might happen. We'd better put on our outdoor things, in case we need them.
        - id: ch01-b16
          speaker: jane
          text: >-
            Perhaps we'll rescue a traveler buried in the snow, like Saint Bernard dogs with barrels around their necks.
        - id: ch01-b17
          speaker: robert
          text: >-
            Or we might arrive while an old man is signing his will. We'd watch him hide it in a secret cupboard, and years later, when the rightful heir had lost all hope, we'd show him the hidden panel. More tea, please.
        - id: ch01-b18
          speaker: anthea
          text: >-
            Or the carpet might take us to a freezing attic in a German town, where a poor, pale little child is terribly ill.
        - id: ch01-b19
          speaker: cyril
          text: >-
            We haven't any German money, so that won't work. I'd rather land in the middle of a war, discover secret information, and carry it to the general. Then he could make me a lieutenant, or a scout, or a hussar.
        - id: ch01-b20
          speaker: narrator
          text: >-
            After breakfast, Anthea swept the carpet and the four children sat down on it. The Phoenix had received a special invitation. As a Christmas treat, it was coming to watch them perform their good and kind action.

            Four children and one bird sat ready. They made the wish and shut their eyes, hoping not to feel too much of the carpet's upside-down whirl.

            When they looked again, the carpet was still in its usual place on the nursery floor in Camden Town.
        - id: ch01-b21
          speaker: cyril
          text: >-
            Well, that's a fine result!
        - id: ch01-b22
          speaker: robert
          text: >-
            Phoenix, do you think the wishing part has worn out?
        - id: ch01-b23
          speaker: phoenix
          text: >-
            No, that is not the trouble. But tell me, exactly what did you wish?
        - id: ch01-b24
          speaker: robert
          text: >-
            Oh, now I understand. It's like the ending of a fairy tale in a Sunday magazine. How perfectly beastly!
          emotion: disgusted
        - id: ch01-b25
          speaker: cyril
          text: >-
            It means we can do good right here, doesn't it? I suppose it expects us to carry coal for Cook or sew clothes for heathens who haven't any. Well, I refuse. And on our last day, too! Listen carefully. We want to go somewhere truly interesting, where we'll get a chance to do something good and kind. Not here. Somewhere else. Do you understand? Off we go!
        - id: ch01-b26
          speaker: narrator
          text: >-
            The obedient carpet moved at once, without giving them another moment to prepare. Four children and one bird tumbled into a heap together, and as they fell, complete darkness swallowed them. They could not see even the person nearest to them.
        - id: ch01-b27
          speaker: anthea
          text: >-
            Is everyone here?
        - id: ch01-b28
          speaker: narrator
          text: >-
            One by one, the others answered from the blackness.
        - id: ch01-b29
          speaker: jane
          text: >-
            Where are we? It's so cold and wet. Ugh! I've put my hand in a puddle!
        - id: ch01-b30
          speaker: anthea
          text: >-
            Has anyone brought matches?
        - id: ch01-b31
          speaker: narrator
          text: >-
            Anthea was sure no one had. But Robert smiled triumphantly, though his smile was wasted where nobody could see it. From his pocket he took a box of matches. He struck one and lit a candle, then another. Ten eyes blinked and ten lips parted in the sudden light. No one had expected Robert to be so well prepared.
        - id: ch01-b32
          speakers: [anthea, jane]
          ensemble: duo
          text: >-
            Well done, Bobs!
          emotion: happy
        - id: ch01-b33
          speaker: narrator
          text: >-
            Even Cyril's natural feelings as an older brother could not stop him admiring Robert's foresight.
        - id: ch01-b34
          speaker: robert
          text: >-
            I've carried matches ever since the day of the lonely tower. I knew we'd need them eventually. I kept my secret well, didn't I?
        - id: ch01-b35
          speaker: cyril
          text: >-
            Oh, wonderfully. I found them the next Sunday when I searched your Norfolk jacket for the knife you borrowed from me. I thought you'd pinched them for Chinese lanterns, or to read in bed.
        - id: ch01-b36
          speaker: anthea
          text: >-
            Bobs, do you see where we are? This is the underground passage. Look! The gold and the money bags are still here. Everything is here.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Their eyes had adjusted to the candlelight, and there was no denying it. Anthea was right.
        - id: ch01-b38
          speaker: jane
          text: >-
            It's a strange place for doing kind things. There isn't anyone here to be kind to.
        - id: ch01-b39
          speaker: cyril
          text: >-
            Don't be too sure. Around the next bend we might find a prisoner who's been wasting away here for years. We could fly him home on the carpet and return him to his grieving friends.
        - id: ch01-b40
          speaker: robert
          text: >-
            Of course. Or perhaps we'll find a poor prisoner's bones and carry them back so his friends can bury them properly. Books always call that a kind act, though I can't see why bones should care.
        - id: ch01-b41
          speaker: jane
          text: >-
            I wish you wouldn't talk about that.
        - id: ch01-b42
          speaker: robert
          text: >-
            I know exactly where the bones will be. See that dark arch farther along? Just inside it, we'll find them.
        - id: ch01-b43
          speaker: jane
          text: >-
            If you don't stop, I shall scream and then faint. So there!
          emotion: fearful
        - id: ch01-b44
          speaker: anthea
          text: >-
            And so shall I.
          emotion: fearful
        - id: ch01-b45
          speaker: narrator
          text: >-
            Robert did not enjoy having his imagination checked.
        - id: ch01-b46
          speaker: robert
          text: >-
            You girls will never become great writers. Writers love thinking about dungeons and chains and knobbly bare human bones, and all that.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Jane opened her mouth to scream, though she had not yet worked out how to begin fainting. Then the Phoenix's golden voice sounded through the gloom.
        - id: ch01-b48
          speaker: phoenix
          text: >-
            Peace! There are no bones here except the small and useful sets inside each of you. You invited me to see you do a good and kind action, not to listen while you talk about bones.
        - id: ch01-b49
          speaker: robert
          text: >-
            We can't do anything good down here.
        - id: ch01-b50
          speaker: phoenix
          text: >-
            No. The only thing you appear able to do here is frighten your little sisters.
        - id: ch01-b51
          speaker: jane
          text: >-
            He didn't truly frighten me. And I'm not so very little.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Robert said nothing. Cyril suggested taking the treasure and leaving.
        - id: ch01-b53
          speaker: anthea
          text: >-
            That would only be kind to us, and it couldn't be good. The money isn't ours.
        - id: ch01-b54
          speaker: cyril
          text: >-
            We could spend every bit of it helping poor and elderly people.
        - id: ch01-b55
          speaker: anthea
          text: >-
            Giving it away wouldn't make stealing right.
        - id: ch01-b56
          speaker: cyril
          text: >-
            I'm not certain it would be stealing. Stealing means taking something that belongs to someone else, and there isn't anyone else here. If nobody owns it, then surely it can't be stealing.
        - id: ch01-b57
          speaker: robert
          text: >-
            Quite right. Let's stand here arguing until the candles go out. You'll enjoy it enormously when we're in the dark again, surrounded by bones.
        - id: ch01-b58
          speaker: anthea
          text: >-
            Then let's leave. We can argue while we walk.
        - id: ch01-b59
          speaker: narrator
          text: >-
            They rolled up the carpet and crept toward the opening into the topless tower. A huge stone blocked the way, and they could not shift it.
        - id: ch01-b60
          speaker: robert
          text: >-
            There! I hope you're satisfied now.
        - id: ch01-b61
          speaker: phoenix
          text: >-
            Everything has two ends, even a quarrel or a secret passage.
        - id: ch01-b62
          speaker: narrator
          text: >-
            They turned back. Because Robert had begun the talk about bones, he had to lead with one candle. Cyril carried the rolled carpet.
        - id: ch01-b63
          speaker: jane
          text: >-
            I wish you hadn't put bones into our heads.
        - id: ch01-b64
          speaker: robert
          text: >-
            I didn't put them there. You always had them. More bones than brains, too.
        - id: ch01-b65
          speaker: narrator
          text: >-
            The passage went on and on. There were arches, steps, sharp turns, and deep black hollows along the walls. The candlelight never reached far enough into those hollows to show what might be inside, and the girls did not enjoy passing them. At last the passage ended at a flight of stairs. Robert climbed to the top, then suddenly staggered backward and landed heavily on Jane's feet. Everyone screamed.
        - id: ch01-b66
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Oh! What happened?
          emotion: surprised
        - id: ch01-b67
          speaker: robert
          text: >-
            Nothing much. I've only smashed my head in. Don't trouble yourselves. I like it. These stairs run straight into a stone ceiling, and you can't do good deeds underneath a paving stone.
        - id: ch01-b68
          speaker: phoenix
          text: >-
            Stairs do not usually lead nowhere. Put your shoulder to the wheel.
        - id: ch01-b69
          speaker: robert
          text: >-
            What wheel? There isn't one.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Robert rubbed his injured head. Cyril pushed past him and shoved as hard as he could at the stone above. It did not move at all.
        - id: ch01-b71
          speaker: cyril
          text: >-
            If this is a trapdoor, there ought to be something here. Yes, I've found a bolt, but I can't shift it.
        - id: ch01-b72
          speaker: narrator
          text: >-
            By good luck, Cyril had Father's bicycle oil can in his pocket. He left the carpet at the foot of the stairs and lay on his back, his head on the top step and his feet tangled among the others below. He oiled the bolt while rusty drops fell onto his face. One drop landed in his open mouth as he panted from holding that awkward position.

            The bolt still refused to move. Cyril tied his bacon-and-marmalade handkerchief to it, then joined Robert's handkerchief to the first with a reef knot. A reef knot grows tighter when you pull it. It is not like a granny knot, which seems to come undone if you merely look at it.

            Cyril and Robert pulled. The girls wrapped their arms around their brothers and pulled as well. With a rusty crunch, the bolt gave way. Everyone rolled to the bottom of the steps except the Phoenix, which had wisely taken wing.

            The carpet softened their fall, so no one was badly hurt. Then the boys put their shoulders to work and heaved at the stone. It shifted, and dust poured down on them.
        - id: ch01-b73
          speaker: robert
          text: >-
            Now, everyone push together! One, two, three!
        - id: ch01-b74
          speaker: narrator
          text: >-
            The stone swung upward on a creaking hinge. A bright oblong of daylight widened above them. The stone fell back with a bang against something that held it open, and they all climbed out.

            There was hardly room for everyone in the little paved shelter where they found themselves. Once the Phoenix had flown up from the passage, they lowered the stone. It shut like a trapdoor, which was exactly what it was.
        - id: ch01-b75
          speaker: narrator
          text: >-
            The children were dirtier and dustier than you could imagine. Dust covered their hair, their clothes, and every part of them that the wet handkerchiefs had missed. Luckily, no one was there to see them but one another.

            They stood in a small shrine beside a road that wound uphill through yellow-green fields toward the topless tower. Looking down, they could see field after field, rows of bare fruit trees, long brown furrows, little gardens, and small houses scattered below. The shrine itself was a tiny paved chapel with its whole front wall missing. It was not a place for a service or a crowd. It was simply a shelter where people on the road could stop, catch their breath, and think about being good. At least, that was how the Phoenix explained it.

            Inside stood an image that had once been brightly painted. Rain and snow had blown through the open front until the colors grew dull and stained. Beneath it were the words, "Saint Jean de Luz. Pray for us."

            The place looked lonely and neglected, with weather blowing straight through the open front. Still, Anthea liked to think of tired travelers stopping there amid all the hurry and worry of their journeys. For a few minutes they could rest in that small shelter, sit quietly, and think about being good. Saint Jean de Luz must once have been good and kind himself. Remembering him made Anthea more eager than ever to find the good action that had brought them there.
        - id: ch01-b76
          speaker: anthea
          text: >-
            Phoenix, please tell us what good and kind action the carpet brought us here to do.
        - id: ch01-b77
          speaker: cyril
          text: >-
            Finding the treasure's owners and telling them about it would be kind.
        - id: ch01-b78
          speaker: jane
          text: >-
            Would we have to give them every bit of it?
        - id: ch01-b79
          speaker: cyril
          text: >-
            Yes. But who does it belong to?
        - id: ch01-b80
          speaker: phoenix
          text: >-
            I suggest visiting the first house you see and asking who owns the castle.
        - id: ch01-b81
          speaker: narrator
          text: >-
            It seemed like a sensible plan. They brushed off as much dust as they could and started down the road.

            Soon they came to a tiny spring. Clear water bubbled from the hillside and dropped into a rough stone basin. Around it drooped battered hart's-tongue ferns that were scarcely green. The children washed their faces and hands, then tried to dry themselves on pocket handkerchiefs. Those handkerchiefs seemed unnaturally small for so much washing. Cyril's still carried bacon fat and marmalade, and Robert's had been tied to the rusty bolt. Both nearly undid the good work, but the whole party did look cleaner afterward.

            The first house was small and white, with green shutters and a slate roof. It stood in a neat garden. Large stone flower vases lined the path, though all their flowers were dead.

            A wide veranda made of poles and lattice ran along one side of the house. It was broader than the verandas the children knew in England, and a vine crawled all over it. Anthea imagined how lovely it must look in summer, when green leaves and bunches of grapes covered the wood. Now there were only dry reddish-brown stems, with a few withered leaves caught between them.

            At the narrow green door, Cyril pulled a handle attached by a chain to a rusty bell. Its loud clang was already dying when a terrible thought struck them all.
        - id: ch01-b82
          speaker: cyril
          text: >-
            Great Scott! None of us knows French!
          emotion: surprised
        - id: ch01-b83
          speaker: narrator
          text: >-
            The door opened before they could decide what to do. A very tall, thin lady stood there. Pale curls the color of white-brown paper hung around her face like oak shavings. She wore an ugly gray dress with a black silk apron over it. Her eyes were small and gray, and not at all pretty. Their rims were red, as though she had been crying only moments before the bell rang.

            She spoke in words that sounded foreign and ended with what was surely a question. No one knew how to answer.
        - id: ch01-b84
          speaker: robert
          text: >-
            What is she saying?
        - id: ch01-b85
          speaker: narrator
          text: >-
            Robert looked down into his jacket, where the Phoenix was hiding. Before the bird could reply, the lady's face brightened with a charming smile.
        - id: ch01-b86
          speaker: french_lady
          text: >-
            You are from England! I love England very much. Please, come in, every one of you! Wipe your feet upon the mat.
          emotion: happy
        - id: ch01-b87
          speaker: robert
          text: >-
            We only came to ask you something.
        - id: ch01-b88
          speaker: french_lady
          text: >-
            I shall tell you anything you wish. Only come inside!
        - id: ch01-b89
          speaker: narrator
          text: >-
            They wiped their feet very carefully and left the rolled carpet in a safe corner of the veranda.
        - id: ch01-b90
          speaker: french_lady
          text: >-
            The loveliest days of my life were spent in England. It has been so long since an English voice called the past back to me.
        - id: ch01-b91
          speaker: narrator
          text: >-
            Such a warm welcome embarrassed them all, especially the boys. The hall had spotless red-and-white tiles, and the sitting-room floor shone like a black mirror. Against all that polish, each boy felt as though he had far more boots than usual. Each extra boot seemed larger, dirtier, and noisier than the last.

            A tiny, bright wood fire burned on the hearth. Neat little logs rested between brass fire dogs. Portraits of powdered ladies and gentlemen hung in oval frames on the pale walls, and silver candlesticks stood on the mantelpiece. The table and chairs were slim, polite-looking things with delicate legs. The room held very little, yet its bright foreign bareness felt cheerful in its own way.

            At one end of the polished table, a little French boy sat on a footstool in a tall, stiff chair that did not look comfortable at all. His short hair was as smooth and velvety as his black velvet clothes. Around his neck spread the sort of collar that was all lace and frills. Robert would rather have died than wear such a collar, though the French boy was much younger than he was.

            Then everyone exclaimed over something pretty. They did not mean the boy in his velvet knickerbockers. They meant the tiny green Christmas tree in its tiny red flowerpot. Its branches were covered with shining little objects made from tinsel and colored paper. Tiny candles waited among them, all ready to be lit. The whole tree was so small, bright, and carefully arranged that the children admired it at once.
        - id: ch01-b92
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Oh, how pretty!
          emotion: happy
        - id: ch01-b93
          speaker: french_lady
          text: >-
            Is it not charming? Sit down, all of you, and we shall see it properly.
        - id: ch01-b94
          speaker: narrator
          text: >-
            The children sat in a row on stiff chairs against the wall. The lady lit a long red taper from the fire, drew the curtains, and touched a flame to each tiny candle on the tree.
        - id: ch01-b95
          speaker: henri
          text: >-
            Bravo, Aunt! Oh, how lovely it is!
          emotion: happy
        - id: ch01-b96
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Hooray!
          emotion: happy
        - id: ch01-b97
          speaker: narrator
          text: >-
            Something struggled inside Robert's jacket. The Phoenix fluttered out, spread its golden wings, and perched at the very top of the Christmas tree.
        - id: ch01-b98
          speaker: french_lady
          text: >-
            Catch it quickly! Your pretty parakeet will burn itself!
          emotion: fearful
        - id: ch01-b99
          speaker: robert
          text: >-
            It won't, thank you.
        - id: ch01-b100
          speaker: narrator
          text: >-
            Henri clapped his neat little hands. The lady remained so anxious that the Phoenix flew down and paced across the shining walnut table instead.
        - id: ch01-b101
          speaker: french_lady
          text: >-
            Does your bird talk?
        - id: ch01-b102
          speaker: phoenix
          text: >-
            Parfaitement, madame!
        - id: ch01-b103
          speaker: french_lady
          text: >-
            What a pretty parakeet! Can it say anything else?
        - id: ch01-b104
          speaker: phoenix
          text: >-
            Why are you sad when Christmas is so near?
        - id: ch01-b105
          speaker: narrator
          text: >-
            The children drew one horrified breath. Even Jane knew it was rude to notice that a stranger had been crying, and ruder still to ask why. The lady began weeping again and called the Phoenix a heartless bird.

            The tears came so quickly that the lady could not find her handkerchief. Anthea offered her own, but it was still damp from the spring and no use at all. Then Anthea put her arms around the lady and hugged her. That worked much better. After a while the sobbing slowed. The lady found her own handkerchief, dried her red-rimmed eyes, and called Anthea a cherished angel.
        - id: ch01-b106
          speaker: anthea
          text: >-
            I'm sorry we arrived while you were unhappy. We really came to ask who owns the castle on the hill.
        - id: ch01-b107
          speaker: french_lady
          text: >-
            Oh, my little angel, the castle belongs to our family today, as it has for hundreds of years. Tomorrow I must sell it to strangers. My poor Henri knows nothing. He will lose the lands of his fathers. But what can I do? His father, my brother the Marquis, spent so much money. And though family respect makes it painful to admit, my dear father also spent far too much.
          emotion: sad
        - id: ch01-b108
          speaker: cyril
          text: >-
            How would you feel if you discovered an enormous fortune, with hundreds of thousands of gold coins?
        - id: ch01-b109
          speaker: narrator
          text: >-
            The lady gave him a sad smile.
        - id: ch01-b110
          speaker: french_lady
          text: >-
            Ah, someone has told you the old legend. They say that long, long ago, one of our ancestors hid a treasure. Gold upon gold upon gold, enough to make Henri rich for all his life. But my children, that is only a fairy tale.
        - id: ch01-b111
          speaker: phoenix
          text: >-
            She means stories about fairies. Tell her what you found.
        - id: ch01-b112
          speaker: narrator
          text: >-
            The Phoenix whispered this to Robert. So Robert told the lady about the treasure. Anthea and Jane held her tightly in case joy made her faint, the way people did in books. Their hugs were full of honest delight for someone else's good fortune.
        - id: ch01-b113
          speaker: robert
          text: >-
            There is no point explaining how we got inside, because it would be hard to understand and even harder to believe. But we can show you the gold and help bring it out.
        - id: ch01-b114
          speaker: narrator
          text: >-
            The lady returned the girls' hugs without seeming to notice she was doing it. She still looked doubtful.
        - id: ch01-b115
          speaker: anthea
          text: >-
            He isn't inventing it. It's true, truly true, and we're so glad for you!
          emotion: happy
        - id: ch01-b116
          speaker: french_lady
          text: >-
            You would not be cruel enough to torment an old woman, would you? And yet it cannot be a dream.
        - id: ch01-b117
          speaker: cyril
          text: >-
            It is perfectly true, and I offer you my warmest congratulations.
        - id: ch01-b118
          speaker: narrator
          text: >-
            Cyril's careful politeness convinced her more than everyone else's excitement.
        - id: ch01-b119
          speaker: french_lady
          text: >-
            If I am not dreaming, then Henri must go to Manon. And all of you must come with me to the priest. Yes, that is what we shall do.
        - id: ch01-b120
          speaker: narrator
          text: >-
            Manon was an old, wrinkled woman with a red-and-yellow scarf twisted around her head. She took charge of Henri, who was already sleepy after the excitement of his Christmas tree, the golden bird, and so many unexpected visitors.

            The lady dressed for the journey with great care. She put on a stiff black cape and a marvelous black silk bonnet. Over her black cashmere house boots she fitted a pair of black wooden clogs. Then she and the children walked down the road to another little white house, much like the one they had left.

            An old priest with a kind face received them. His welcome was so deeply polite that it almost hid his astonishment at the dusty English children and their excited companion. The lady began her story. Her hands swept through the air, her shoulders rose and fell, and her French words trembled over one another. The priest knew no English. He listened, then lifted his own shoulders, waved his own hands, and answered in rapid French.
        - id: ch01-b121
          speaker: phoenix
          text: >-
            He believes her troubles have driven her out of her mind. What a pity none of you speaks French.
        - id: ch01-b122
          speaker: narrator
          text: >-
            The Phoenix whispered from its hiding place.
        - id: ch01-b123
          speaker: robert
          text: >-
            I know plenty of French. But it's all about the gardener's son's pencil and the baker's niece's penknife. None of it is anything a person ever needs to say.
        - id: ch01-b124
          speaker: phoenix
          text: >-
            If I speak, he may decide that he is mad as well.
        - id: ch01-b125
          speaker: robert
          text: >-
            Then tell me what I ought to say.
        - id: ch01-b126
          speaker: phoenix
          text: >-
            Say, "C'est vrai, monsieur. Venez donc voir."
        - id: ch01-b127
          speaker: narrator
          text: >-
            Robert suddenly spoke up, very loud and clear. What came out sounded like this.
        - id: ch01-b128
          speaker: robert
          text: >-
            Say vray, mossoo. Venny dong vwaw.
        - id: ch01-b129
          speaker: narrator
          text: >-
            Everyone respected Robert forever after that. The priest answered him, but quickly discovered that Robert's French began and ended with those few useful words. He was disappointed. Still, he could see that if the lady had lost her senses, she was not the only one telling this strange story. He put on a large beaver hat, found a candle and matches, took up a spade, and joined the whole party on the climb to the shrine of Saint John of Luz.
        - id: ch01-b130
          speaker: robert
          text: >-
            I'll go down first and show you the treasure.
        - id: ch01-b131
          speaker: narrator
          text: >-
            At the shrine they pushed one corner of the spade beneath the stone and pried it up. The dark stairway opened beneath them. Robert kept his promise and went first. The children, the lady, and the priest followed him down, carrying the candle into the underground passage. There lay the golden treasure, the coins and heavy money bags exactly where the children had left them. Every face flushed with the joy of doing something wonderfully kind.

            The lady and the priest clasped hands and wept for joy. They knelt beside the treasure, touched the gold, and talked rapidly at the same time. Then the lady embraced every child three times and called them her little guardian angels. She took both the priest's hands, and the two of them shook hands all over again. They talked and talked, faster and more Frenchly than the children would have believed possible. The children themselves could not say a word. They were too full of happiness and pleasure.
        - id: ch01-b132
          speaker: phoenix
          text: >-
            Leave now.
        - id: ch01-b133
          speaker: narrator
          text: >-
            The Phoenix's quiet words broke into their shining dream. The children slipped away and climbed out through the shrine. The lady and priest were so busy talking and crying with joy that they never noticed their guardian angels had gone.

            The four children ran downhill to the lady's house, where the carpet waited on the veranda. They spread it out and spoke one word.
        - id: ch01-b134
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Home!
        - id: ch01-b135
          speaker: narrator
          text: >-
            No one saw them vanish except Henri. He had pressed his nose so hard against the window that it looked like a little white button in the glass. He saw the four strange English children stand on their carpet and disappear. Later, when he tried to tell his aunt what had happened, she decided all the excitement had made him dream it. So that was all right.
        - id: ch01-b136
          speaker: anthea
          text: >-
            That was much the best thing we've ever done. From now on, we'll use the carpet only for kind actions.
        - id: ch01-b137
          speaker: narrator
          text: >-
            They were discussing the adventure over tea when the Phoenix cleared its throat.
        - id: ch01-b138
          speaker: phoenix
          text: >-
            Ahem!
        - id: ch01-b139
          speaker: anthea
          text: >-
            I beg your pardon?
        - id: ch01-b140
          speaker: phoenix
          text: >-
            Oh, nothing. I was merely thinking.
