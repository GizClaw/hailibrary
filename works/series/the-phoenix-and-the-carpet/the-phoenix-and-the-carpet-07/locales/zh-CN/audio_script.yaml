audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带一点英式童话的机智
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明自信，挖苦人时一本正经
        timbre: 清脆的少年声
        pace: 中等偏快
        pitch: 中高
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴敏锐，急切时仍然清楚
        timbre: 柔和明亮的少女声
        pace: 中等
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 坚持己见，认真里常带几分莽撞
        timbre: 结实清朗的少年声
        pace: 中等
        pitch: 中等
    jane:
      display_name: 简
      tts:
        delivery: 天真直率，话里带着小孩子的认真
        timbre: 稚嫩柔软的女孩声
        pace: 稍慢
        pitch: 偏高
    phoenix:
      display_name: 凤凰
      tts:
        delivery: 文雅自负，庄重中带着敏锐的幽默
        timbre: 华美清润，中性而成熟
        pace: 从容
        pitch: 中高
    policeman:
      display_name: 警察
      tts:
        delivery: 谨慎威严，询问时不容敷衍
        timbre: 浑厚结实的成年男声
        pace: 中等偏慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 没人来接的车站
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 四个孩子回到滑铁卢车站时，身边没有大人照管，也没有人来接。可千万别以为爸爸妈妈不疼他们，事情并不是这样。圣诞假期结束前，妈妈早和艾玛姨妈说好了，请她到车站接孩子。坐哪班火车已经定下，只差回程的日期。后来，妈妈把日期、钟点、行李和马车一件件写清楚，把信交给罗伯特去寄。
        - id: ch01-b02
          speaker: narrator
          text: 偏偏那天早晨，猎犬队要在鲁弗斯石附近集合。猎犬们去集合时遇见了罗伯特，罗伯特也遇见了它们。于是，寄信这件事立刻从他脑子里消失了。
        - id: ch01-b03
          speaker: narrator
          text: 到了滑铁卢，四个孩子在月台上走过去又走回来，一共走了六趟。他们撞过老先生，也仔细看过每位太太的脸。赶路的人推搡他们，脚夫推着行李车，一声声喊着劳驾让让，把他们赶到一边。等他们终于确定艾玛姨妈根本没来，罗伯特才猛然想起那封信。
        - id: ch01-b04
          speaker: robert
          text: 哎呀，我的天！
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: 他张着嘴，站在那里一动不动。一个脚夫两手各提一只格莱斯顿旅行袋，胳膊下还夹着一捆雨伞，一头撞上了他。沉些的旅行袋砸中他的膝盖，他踉跄了一下，居然连一句抱怨也没说。等另外三个孩子弄清出了什么事，他们心里怎样看罗伯特，想必全都当面告诉他了。
        - id: ch01-b06
          speaker: anthea
          text: 我们应该坐火车去克罗伊登，找艾玛姨妈。
        - id: ch01-b07
          speaker: cyril
          text: 对啊。杰文斯一家看见我们拖着这么多行李上门，一定高兴得不得了。
        - id: ch01-b08
          speaker: narrator
          text: 艾玛姨妈住在杰文斯家。那家人规矩极多，都是些穿着讲究罩衫、爱看日场戏、也爱逛商店的中年人。他们偏偏不喜欢孩子。
        - id: ch01-b09
          speaker: jane
          text: 要是我们回去，妈妈见到我们一定很高兴。
        - id: ch01-b10
          speaker: cyril
          text: 她当然高兴。可没人来接全怪鲍勃，她一定觉得不能让我们看出她高兴。我还不了解这种事吗？再说，我们也没有钱。大家凑在一起，倒是够叫一辆四轮马车，可买不起回新森林的车票。我们只能回家。等他们知道我们平安到家，就不会气得那么厉害了。反正姨妈原本也只是坐马车送我们回去。
        - id: ch01-b11
          speaker: anthea
          text: 我还是觉得，应该去克罗伊登。
        - id: ch01-b12
          speaker: robert
          text: 艾玛姨妈准不在家。我看杰文斯一家每天下午都去剧院。而且凤凰和地毯还在家呢。我赞成叫四轮马车。
        - id: ch01-b13
          speaker: narrator
          text: 他们叫来一位赶老式四轮马车的车夫，车底还铺着稻草。安西娅请他小心些，把大家送到自家的地址。车夫照办了，可他要的车钱，正好是外公圣诞节送给西里尔的那枚金币。这让大家心里都有些发沉。
        - id: ch01-b14
          speaker: narrator
          text: 西里尔却不肯屈尊同车夫争价，免得对方以为他不是一个想坐马车就能坐马车的人。大概也是为了这个缘故，他叫车夫把行李全放在台阶上。等老马车碾着砂砾，吱嘎吱嘎走远以后，他才把手放到门铃上。
        - id: ch01-b15
          speaker: cyril
          text: 你们想想，我们可不能让厨娘和伊莱扎当着车夫的面追问，为什么没人陪着我们回来，好像我们还是一群小娃娃。
        - id: ch01-b16
          speaker: narrator
          text: 西里尔按响门铃。铃声才在屋里荡开，孩子们立刻觉得，不会有人来开门了。屋里若真有人听着，门铃的声音似乎就会有点不同。为什么如此，谁也说不清，可事情就是这样。
        - id: ch01-b17
          speaker: jane
          text: 她们也许正在换衣服。
        - id: ch01-b18
          speaker: anthea
          text: 现在换衣服太晚了，肯定已经过了五点。也许伊莱扎去寄信，厨娘去外面看钟点了。
        - id: ch01-b19
          speaker: narrator
          text: 西里尔又按了一次。门铃已经使足力气告诉门外侧耳听着的孩子，这所房子里一个人也没有。他们又按，又听，心一点点沉下去。阴暗湿闷的一月傍晚，他们竟进不了自己的家，实在叫人害怕。
        - id: ch01-b20
          speaker: jane
          text: 屋里一盏煤气灯也没亮。
          emotion: fearful
        - id: ch01-b21
          speaker: robert
          text: 我猜她们又没关煤气，穿堂风把火吹灭了。现在两个人都躺在床上，已经给煤气闷死。爸爸早说过，她们总有一天会这样。
        - id: ch01-b22
          speaker: anthea
          text: 那我们去叫警察吧。
          emotion: fearful
        - id: ch01-b23
          speaker: cyril
          text: 然后叫人把我们当成入室行窃的贼抓起来吗？多谢，我不去。前几天爸爸才念过报纸，有个年轻人进了自己妈妈的房子，硬是被人当成了贼。
        - id: ch01-b24
          speaker: anthea
          text: 但愿凤凰没被煤气伤着。它说想躲在浴室的柜子里。我本来觉得那里很安全，因为佣人从不打扫那个柜子。可要是它出来了，也被煤气闷死了呢？而且门一打开，我们也会被闷死。我早知道就该去克罗伊登。哦，松鼠，我真后悔刚才没去。我们现在去吧。
          emotion: fearful
        - id: ch01-b25
          speaker: cyril
          text: 别出声，里面有人在拨门闩。
        - id: ch01-b26
          speaker: narrator
          text: 大家竖起耳朵，尽量往后退，可门前的台阶只有那么大。门闩咔嗒了几下，信箱口的盖板忽然自己抬起来。大门旁的光秃椴树后面，煤气路灯一明一暗。借着那点光，他们看见一只金色的眼睛从信箱缝里眨了眨，接着，一张谨慎的鸟喙低声开口。
        - id: ch01-b27
          speaker: phoenix
          text: 外面只有你们吗？
        - id: ch01-b28
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 是凤凰！
          emotion: happy
        - id: ch01-b29
          speaker: narrator
          text: 四个人又欢喜又放心，像是压低声音一齐欢呼。
        - id: ch01-b30
          speaker: phoenix
          text: 嘘！你们的仆人出去寻欢作乐了。大门的门闩太紧，我的喙拨不动。不过房子侧面有一扇小窗，就在放面包的架子上面。那扇窗没有闩。
        - id: ch01-b31
          speaker: cyril
          text: 好，就这么办！
        - id: ch01-b32
          speaker: anthea
          text: 亲爱的凤凰，请到那扇窗边接我们。

    - id: ch02
      title: 黑屋里的炉火和晚餐
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 孩子们绕到食品储藏室的窗下。房子侧面有扇绿门，上面写着送货入口，平时总是闩住的。不过一只脚踩住隔开邻居家的篱笆，另一只脚踩住门把手，还没想清是怎么回事，人已经翻过去了。至少西里尔和罗伯特如此，老实说，安西娅和简也一样。没过多久，四个人都到了两栋房子之间狭窄的碎石过道里。
        - id: ch02-b02
          speaker: narrator
          text: 罗伯特弯下腰，让西里尔踩着他。西里尔撑起身子，把穿灯笼裤的膝盖搭上水泥窗台，头朝下扎进储藏室，活像刚学跳水。他钻进去时，两条腿还在空中乱摆。最后，靴底两块方方的泥印也从窗口消失了。
        - id: ch02-b03
          speaker: robert
          text: 你们俩托我一把。
        - id: ch02-b04
          speaker: jane
          text: 想都别想。我才不要只和安西娅待在外面，让什么东西从黑暗里悄悄爬到我们背后。叫松鼠去开后门。
        - id: ch02-b05
          speaker: narrator
          text: 储藏室里突然亮起一盏灯。西里尔后来一直说，是凤凰用喙打开煤气，又扇动翅膀把灯点着的。不过他当时太兴奋了，也可能是自己划火柴点亮，过后却忘了。他打开后门，让其他人进屋。门重新闩好以后，孩子们走遍整栋房子，把能找到的煤气灯全点亮了。
        - id: ch02-b06
          speaker: narrator
          text: 这个冬夜阴森又凄凉，他们总觉得，一个拿着武器的窃贼随时都会冒出来。害怕窃贼的时候，没有什么比灯光更有用。其实害怕任何东西时，差不多都是这样。
        - id: ch02-b07
          speaker: narrator
          text: 灯全亮起来以后，事情便十分清楚。凤凰没有弄错，伊莱扎和厨娘果然出去了。屋里除了四个孩子、凤凰和地毯，只剩下住在育儿室壁炉两侧橱柜里的蟑螂。安西娅生起炉火以后，它们见孩子们回来，尤其高兴。可是孩子们照旧对这些热情的小蟑螂十分冷淡，还带着轻蔑。
        - id: ch02-b08
          speaker: narrator
          text: 你会从头生起一炉火吗？不是划根火柴，把别人架好的纸点着，而是整件事都自己做。安西娅先扒出一星期前留下的炉灰。伊莱扎明明有时间，却一直没有清理。安西娅扒灰时碰破了指关节，流了血。然后，她把最大、最好看的煤渣铺在炉栅下面。
        - id: ch02-b09
          speaker: narrator
          text: 她取来一张旧报纸。千万不要拿当天的报纸生火，它不好烧，而且还有别的理由。她把报纸撕成四份，每一份松松揉成纸团，摆在煤渣上。接着，她拿起一捆劈柴，扯断捆绳，把木条插进去，一头搭在炉条上，另一头靠在纸团后面。绳子在她手指上割开一道小口，两根木条弹起来，又打中了她的脸颊。
        - id: ch02-b10
          speaker: narrator
          text: 安西娅又放上煤渣和几块煤，但没有放煤屑。大半煤屑似乎都落到了她手上，剩下的也足够把她的脸弄黑。她点燃纸团边缘，一直等到木柴烧起来，发出嘶、啪、啪啪、嘶的声音，才去后厨房，在水龙头下面洗净手和脸。
        - id: ch02-b11
          speaker: narrator
          text: 当然，你生火时不必碰破指关节，也不用割伤手指，让木柴打青脸颊，更不必把自己弄黑。除了这些，这的确是在伦敦生炉火的好办法。真正的乡下另有一种更漂亮的办法。不过不管在哪里，生完火以后洗洗手脸，总不会错。
        - id: ch02-b12
          speaker: narrator
          text: 安西娅用明亮的炉火哄得小蟑螂十分欢喜时，简已经摆好桌子。我本想说她在准备茶点，可这顿饭又不完全算茶点，还是叫它差不多像茶点的一餐吧。
        - id: ch02-b13
          speaker: narrator
          text: 茶当然有。安西娅生的火亲切地噼啪响着，仿佛满怀情意地请水壶坐到自己膝上。大家便取来水壶，沏好茶。屋里没有牛奶，每一杯只好多放六块糖。吃的却比平时还好。男孩子在储藏室里找到冷牛舌、面包、黄油、奶酪，还有一块冷布丁。那布丁比孩子们在家时厨娘做的还好吃。
        - id: ch02-b14
          speaker: narrator
          text: 厨房橱柜里还有半只圣诞蛋糕、一罐草莓酱和差不多一磅什锦蜜饯。柠檬皮、橙皮和香橼皮做成的小杯子里，都盛着松软酥碎的甜糖。
        - id: ch02-b15
          speaker: jane
          text: 这顿盛宴，完全配得上《天方夜谭》里的骑士。
        - id: ch02-b16
          speaker: narrator
          text: 凤凰栖在罗伯特的椅子上，亲切而客气地听孩子们讲林德赫斯特的见闻。桌子下面，只要脚趾伸得远一些，每个人都碰得到忠实的地毯。就连腿很短的简也可以。
        - id: ch02-b17
          speaker: phoenix
          text: 你们的仆人今晚不会回来。据我所知，她们要在厨娘继母的姨妈家过夜。那里今晚大宴宾客，要庆祝她丈夫的表姐妹的小姑子的母亲九十岁生日。
        - id: ch02-b18
          speaker: anthea
          text: 不管她们有多少亲戚，也不管亲戚活了多少岁，我都觉得她们不该没得到准许就出门。不过这些碗碟应该由我们洗。
        - id: ch02-b19
          speaker: cyril
          text: 她们有没有准许，不是我们该管的事。可我绝不替她们洗碗。吃的是我们自己找出来的，我们可以把东西收回去。然后，咱们坐地毯去个什么地方。难得有一整夜没人管，我们能一直飞到赤道另一边，到热带去看太阳从辽阔的太平洋上升起来。
        - id: ch02-b20
          speaker: robert
          text: 没错。我早就想看看南十字星，还有那些大得像煤气灯的星星。
        - id: ch02-b21
          speaker: anthea
          text: 别去，因为我不能跟你们去。我知道妈妈不会愿意让我们丢下房子不管，我自己也不愿一个人留在这里。
        - id: ch02-b22
          speaker: jane
          text: 我会留下来陪你。
        - id: ch02-b23
          speaker: anthea
          text: 我知道你会。可就算你陪着我，我还是很不愿意留下。
        - id: ch02-b24
          speaker: cyril
          text: 好吧，我不想逼你做一件你认定不对的事。可是……
        - id: ch02-b25
          speaker: narrator
          text: 西里尔努力显得和气，说到这里却停住了。那阵沉默已经说了许多话。
        - id: ch02-b26
          speaker: robert
          text: 我不明白……
        - id: ch02-b27
          speaker: anthea
          text: 我非常确定。有时你只是觉得一件事不对，有时你却清清楚楚地知道它不对。现在就是清清楚楚知道的时候。
        - id: ch02-b28
          speaker: narrator
          text: 凤凰用和善的金眼睛看着安西娅，张开友好的鸟喙。
        - id: ch02-b29
          speaker: phoenix
          text: 既然这是你说的那种清清楚楚知道的时候，那就不必再争论了。你那两位高尚的哥哥绝不会把你丢下。
        - id: ch02-b30
          speaker: cyril
          text: 我当然不会。
        - id: ch02-b31
          speaker: narrator
          text: 西里尔答得稍微快了些，罗伯特也说自己不会走。
        - id: ch02-b32
          speaker: phoenix
          text: 至于我，很愿意出一份力。我可以坐地毯去，也可以自己飞去，替你们取回任何一样能让今晚过得有趣的东西。为免浪费时间，我可以趁你们洗碗时出发。不过，我一直不明白，为什么杯子要洗起来，楼梯却要洗下去？
        - id: ch02-b33
          speaker: anthea
          text: 楼梯没办法洗起来呀，除非从最下面开始，一边洗，一边脚朝上倒着走。真希望厨娘哪天试试这种洗法。
        - id: ch02-b34
          speaker: cyril
          text: 我可不希望。我不想看见她那双松紧边短靴倒竖在空中。
        - id: ch02-b35
          speaker: phoenix
          text: 这些都是没用的闲话。快决定，要我替你们取什么。只要你们喜欢，我什么都能弄来。

    - id: ch03
      title: 地毯回故乡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们自然决定不了。大家提出木马、镶宝石的国际象棋、象、自行车、汽车、图画书、乐器，还有许多别的东西。可演奏乐器的人若不高明，只有他自己听着觉得悦耳。书不会陪人说话，自行车非到屋外才能骑，汽车和象也一样。国际象棋每次只能两个人下，而且说它是游戏，未免太像功课。木马每次也只能一个人骑。
        - id: ch03-b02
          speaker: narrator
          text: 他们正争得没完，凤凰忽然展开翅膀，扑棱棱落到地板上。
        - id: ch03-b03
          speaker: phoenix
          text: 地毯告诉我，它想请你们允许它回到自己出生长大的故乡。不到一个钟头，它就会带着一大批故乡最美丽、最可爱的物产回来。
        - id: ch03-b04
          speaker: narrator
          text: 孩子们立刻问，地毯的故乡究竟在哪里。
        - id: ch03-b05
          speaker: phoenix
          text: 这件事我没有得知。不过你们一直商量不定，时间还在不停过去，茶具也没有洗下去，我是说，没有洗起来。
        - id: ch03-b06
          speaker: robert
          text: 我赞成让它去，至少大家不用再争了。有点惊喜也不错。说不定这是条土耳其地毯，会带土耳其软糖回来。
        - id: ch03-b07
          speaker: robert
          text: 也可能带回一支《土耳其巡逻曲》。
        - id: ch03-b08
          speaker: anthea
          text: 或者带回来一次土耳其浴。
        - id: ch03-b09
          speaker: jane
          text: 也可能是一条土耳其浴巾。
        - id: ch03-b10
          speaker: robert
          text: 胡说。地毯说的是美丽又可爱的东西。毛巾和洗澡就算对人有好处，也算不上美丽可爱。让它去吧。不过，它不会趁这个机会逃走吧？
        - id: ch03-b11
          speaker: narrator
          text: 罗伯特说着推开椅子，站了起来。
        - id: ch03-b12
          speaker: phoenix
          text: 嘘！你怎么能说这种话？不能因为它只是一条地毯，就随意践踏它的感情。
        - id: ch03-b13
          speaker: robert
          text: 可是没有人坐在上面许愿，它怎样出发？
        - id: ch03-b14
          speaker: narrator
          text: 罗伯特心里刚生出一个越来越有希望的念头。也许地毯非得带一个人去，为什么那个人不能是他呢？可凤凰马上给这个刚出生的美梦泼了冷水。
        - id: ch03-b15
          speaker: phoenix
          text: 只要把愿望写在纸上，再用别针钉在地毯上就可以。
        - id: ch03-b16
          speaker: narrator
          text: 大家从安西娅的算术本里撕下一页。西里尔用又大又圆的字写下愿望，请地毯回到亲爱的故乡，尽量带回那里最美丽、最可爱的物产，还请它不要离开太久。下面署了西里尔、罗伯特、安西娅和简的名字。
        - id: ch03-b17
          speaker: narrator
          text: 写好的纸放到了地毯上。
        - id: ch03-b18
          speaker: phoenix
          text: 请把写字的一面朝下。要是空白的纸背贴着地毯，它就读不见上面的字，正像你们也没法从纸背读字一样。
        - id: ch03-b19
          speaker: narrator
          text: 纸牢牢钉好，桌椅也挪开了。地毯没有一点预兆，忽然开始消失。它像旺火炉边的一摊水，边缘越缩越小，最后从眼前彻底不见。
        - id: ch03-b20
          speaker: phoenix
          text: 收集那些美丽可爱的东西，大概需要一点时间。我看你们现在该去洗起来，我是说，洗下去。
        - id: ch03-b21
          speaker: narrator
          text: 他们真的去洗了。水壶里还留着不少热水，每个人都帮了忙，凤凰也不例外。它用灵巧的爪子钩住杯柄，把杯子浸进热水，再摆到桌面上，让安西娅擦干。只是凤凰做得很慢。照它自己的说法，任何诚实的活计都不会有失身份，可摆弄洗碗水毕竟不是它从小受过的教养。
        - id: ch03-b22
          speaker: narrator
          text: 最后，样样东西都洗得干净，擦干以后放回原位。洗碗布也洗了，搭在洗衣铜锅边上晾着。擦茶巾则挂在洗涤间横着的绳子上。若你是公爵夫人、国王或某位社会名流家的孩子，或许分不清洗碗布和擦茶巾。不过那样的话，你的保姆受到的教导比你周全，她会把分别告诉你。
        - id: ch03-b23
          speaker: narrator
          text: 八只手和一双爪子正在洗涤间门后的滚轴毛巾上擦干，厨房隔壁的育儿室里突然传来一种怪声。那声音怪得很，他们从来没听过。若一定要比，熟悉的声音同它之间，大概只有玩具火车汽笛和轮船汽笛那么一点相像。
        - id: ch03-b24
          speaker: robert
          text: 地毯回来了。
        - id: ch03-b25
          speaker: narrator
          text: 其他人也认为他说得对。
        - id: ch03-b26
          speaker: jane
          text: 可它带回了什么？这声音听起来像海里的巨兽利维坦。
        - id: ch03-b27
          speaker: cyril
          text: 它总不会是在印度织成的，给我们带了一头象吧？就算是小象，挤在那个房间里也够吓人。我提议按顺序从钥匙孔里看一眼。
        - id: ch03-b28
          speaker: narrator
          text: 他们按年纪大小轮流去看。凤凰比所有人年长几千岁，本来有权第一个看，可它抖松金羽毛，轻轻打了一个喷嚏。
        - id: ch03-b29
          speaker: phoenix
          text: 请原谅。从钥匙孔往里看，总会让我的金眼睛着凉。
        - id: ch03-b30
          speaker: narrator
          text: 于是西里尔先去看。
        - id: ch03-b31
          speaker: cyril
          text: 我看见一团灰色的东西在动。
        - id: ch03-b32
          speaker: robert
          text: 我敢说，里面是某种动物园。
        - id: ch03-b33
          speaker: narrator
          text: 罗伯特看过以后，屋里仍旧传出细细的窸窣声，还夹着拥挤、抖毛、抓挠、拖步和扑腾的声音。
        - id: ch03-b34
          speaker: anthea
          text: 我什么也看不清，眼睛痒得要命。
        - id: ch03-b35
          speaker: narrator
          text: 最后轮到简。她把眼睛贴在钥匙孔上。
        - id: ch03-b36
          speaker: jane
          text: 是一只特别特别大的小猫咪，它睡得满屋子都是。
        - id: ch03-b37
          speaker: robert
          text: 大猫不就是老虎吗？爸爸说过。
        - id: ch03-b38
          speaker: jane
          text: 不对。爸爸说老虎是一种大猫。这两句话根本不是一回事。
        - id: ch03-b39
          speaker: phoenix
          text: 你们叫地毯取来珍贵的东西，它已经取回来了，你们却连看也不敢看。那还有什么意思？
        - id: ch03-b40
          speaker: narrator
          text: 凤凰说得很有道理。西里尔年纪最大，便伸手握住门把。
        - id: ch03-b41
          speaker: cyril
          text: 来吧，开门。

    - id: ch04
      title: 一百九十九只波斯猫
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 吃过那顿像茶点的饭以后，煤气灯一直开得最亮。门口的十只眼睛把房里看得清清楚楚。不过也不能说看见了所有东西。地毯明明在那里，却一点也看不见，因为它被故乡带回的一百九十九件美丽物产盖得严严实实。
        - id: ch04-b02
          speaker: cyril
          text: 好家伙！我怎么没想到，它原来是条波斯地毯！
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: 现在一切都清楚了。那些美丽物产全是猫，灰色的波斯猫，足足一百九十九只。它们一只贴着一只，拼命挤在地毯上。孩子们一进门，猫儿纷纷站起来伸懒腰，从地毯漫到地板上。转眼之间，整个地板变成了一片蠕动又喵叫的猫海。
        - id: ch04-b04
          speaker: narrator
          text: 四个孩子不约而同地爬上桌子，把腿全收起来。隔壁也有人敲墙。这实在怪不得邻居，因为这些来自波斯的叫声又尖又响。
        - id: ch04-b05
          speaker: cyril
          text: 这可一点也不好玩。这些讨厌的家伙到底怎么了？
        - id: ch04-b06
          speaker: phoenix
          text: 我想，它们是饿了。要是你们给它们吃一点……
        - id: ch04-b07
          speaker: anthea
          text: 我们根本没有东西喂它们。哦，猫咪们，安静一点吧！你们叫得这么响，我们连自己在想什么都听不见了。而且要喂饱你们，得买好几英镑、好几英镑的猫食！
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: 安西娅抚摸着离她最近的一张波斯猫脊背，不得不放声大喊，因为猫叫越来越震耳欲聋。
        - id: ch04-b09
          speaker: robert
          text: 让地毯把它们送回去。
        - id: ch04-b10
          speakers: [anthea, jane]
          ensemble: duo
          text: 不行！
        - id: ch04-b11
          speaker: jane
          text: 它们这么柔软，还是很像小猫咪呀。
        - id: ch04-b12
          speaker: anthea
          text: 而且它们很值钱。我们可以卖出好多好多钱。
        - id: ch04-b13
          speaker: phoenix
          text: 为什么不请地毯替它们带食物回来？
        - id: ch04-b14
          speaker: narrator
          text: 波斯猫叫得越来越凶。凤凰不得不使足力气喊，它那金灿灿的嗓音都喊得又粗又哑，才勉强盖过猫叫。于是，孩子们写下一条新愿望，请地毯为一百九十九只波斯猫带食物回来，又照先前那样把纸钉到地毯上。
        - id: ch04-b15
          speaker: narrator
          text: 地毯像是猛地把自己收紧，猫儿一只只从上面滚下来，活像你抖动防雨外套时滚落的雨珠。接着，地毯又消失了。
        - id: ch04-b16
          speaker: narrator
          text: 除非你曾把一百九十九只成年的波斯猫关在一间小屋里，让它们全饿着肚子，还让每一只都用清清楚楚的猫叫宣布这件事，否则你绝想不到，那声音把孩子们和凤凰震得多厉害。
        - id: ch04-b17
          speaker: narrator
          text: 这些猫似乎从没受过好管教。它们不知道跑到陌生人家讨吃的已经不大礼貌，更别说为了吃食放声号叫。它们叫呀，叫呀，叫呀，叫呀。孩子们只好把手指塞进耳朵，一声不响地忍受。他们不明白，为什么整个卡姆登镇还没有人敲门，问屋里出了什么事。
        - id: ch04-b18
          speaker: narrator
          text: 大家只盼猫食赶在邻居前面回来。要是愤怒的街坊登门追问，把地毯和凤凰的秘密问出来，那秘密恐怕再也收不回去了。猫叫还是没停，一团团波斯猫毛从人缝里钻进钻出，一条条蓬松尾巴舒展开来。孩子和凤凰全都紧紧挤在桌上。
        - id: ch04-b19
          speaker: narrator
          text: 罗伯特忽然发现，凤凰正在发抖。
        - id: ch04-b20
          speaker: phoenix
          text: 这么多猫，也许不知道我是一只凤凰。这种意外转眼就会发生，实在让我失去男子气概。
          emotion: fearful
        - id: ch04-b21
          speaker: narrator
          text: 这个危险，孩子们先前谁也没有想到。
        - id: ch04-b22
          speaker: robert
          text: 快钻进我的衣服里！
        - id: ch04-b23
          speaker: narrator
          text: 罗伯特敞开夹克，凤凰立刻钻了进去，只差一点就来不及。猫儿的绿眼睛已经瞪起来，粉红鼻头已经嗅起来，白胡须也开始颤动。罗伯特刚扣好衣服，就被一阵急切的灰色猫毛浪淹到腰间。
        - id: ch04-b24
          speaker: narrator
          text: 就在这时，好地毯啪地落到地板上。上面铺满了老鼠。我想一共有三百九十八只，正好每只猫两只。
        - id: ch04-b25
          speaker: anthea
          text: 太可怕了！快把它们弄走！
          emotion: fearful
        - id: ch04-b26
          speaker: phoenix
          text: 先把你自己弄出去，还要带上我。
        - id: ch04-b27
          speaker: anthea
          text: 我真希望我们从来没有过这条地毯。
          emotion: sad
        - id: ch04-b28
          speaker: narrator
          text: 他们推着挤着，终于出了房门，立刻关门上锁。西里尔急中生智，点燃一支蜡烛，再关掉煤气总闸。
        - id: ch04-b29
          speaker: cyril
          text: 屋里黑下来，老鼠逃走的机会还大一些。
        - id: ch04-b30
          speaker: narrator
          text: 猫叫停了。人人屏住呼吸，静静听着。我们都知道猫会吃老鼠，小棕皮读本很早就教过这件事。可是那么多猫吃那么多老鼠，实在叫人不敢去想。

    - id: ch05
      title: 提灯外的警察
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 昏暗的厨房里一片寂静。唯一的蜡烛被穿堂风吹得歪向一边。罗伯特忽然抽了抽鼻子。
        - id: ch05-b02
          speaker: robert
          text: 这是什么怪味道？
        - id: ch05-b03
          speaker: narrator
          text: 他话音刚落，一盏提灯的光从厨房窗外闪过。一张脸凑到玻璃前，一个声音响了起来。
        - id: ch05-b04
          speaker: policeman
          text: 刚才是什么声音？把门打开，让我进去。
        - id: ch05-b05
          speaker: narrator
          text: 那是警察的声音。罗伯特踮起脚走到窗边，隔着一块裂开的玻璃同他说话。玻璃上的裂纹，是西里尔有一次看过马戏以后，把手杖顶在鼻子上练平衡，不小心撞出来的。
        - id: ch05-b06
          speaker: robert
          text: 您说什么声音？这里一点也不吵。您听，现在安静得不能更安静了。
        - id: ch05-b07
          speaker: narrator
          text: 当时确实如此。那股古怪的甜香却越来越浓，凤凰从罗伯特的衣襟里伸出鸟喙。窗外的警察迟疑了一下。
        - id: ch05-b08
          speaker: phoenix
          text: 是麝鼠。我想有些猫会吃麝鼠，可波斯猫绝对不吃。一条见多识广的地毯，居然会犯这种错误！唉，今晚真够我们受的。
        - id: ch05-b09
          speaker: robert
          text: 请您走吧，我们正打算睡觉。这只是一根卧室用的蜡烛。这里没有任何吵闹，安静得连老鼠的动静都能听见。
        - id: ch05-b10
          speaker: narrator
          text: 罗伯特紧张地说着，一阵疯狂的猫叫忽然把他的话淹没了，里面还夹着麝鼠的尖叫。究竟出了什么事？难道猫先尝了一口，才决定不喜欢那个味道？
        - id: ch05-b11
          speaker: policeman
          text: 我必须进去。你们把一只猫关在里面了。
        - id: ch05-b12
          speaker: cyril
          text: 一只猫？我的亲姨妈呀，他说只有一只猫！
          emotion: surprised
        - id: ch05-b13
          speaker: robert
          text: 那您进来吧，后果得由您自己负责。我劝过您不要进。等一等，我去开侧门。
        - id: ch05-b14
          speaker: narrator
          text: 罗伯特打开侧门，警察十分谨慎地走进屋。厨房里只有一支蜡烛。猫叫和尖叫一齐爆发，听起来像十二只轮船汽笛、二十辆等客的汽车喇叭，再加上五十台吱嘎作响的水泵。
        - id: ch05-b15
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 事情不是您想的那样！我们回来时家里没人！那些猫是地毯带来的！我们只想给它们找吃的！
        - id: ch05-b16
          speaker: narrator
          text: 四个激动的孩子同时冲警察大喊。他们讲出了四套互相混杂、又完全不同的说法，想解释这一晚为什么乱成这样。
        - id: ch05-b17
          speaker: narrator
          text: 你试过向警察解释哪怕最简单的一件事吗？
