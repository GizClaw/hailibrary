  chapters:
    - id: ch01
      title: MEWS FROM PERSIA
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The four children arrived at Waterloo Station after their Christmas holiday at Lyndhurst, and no one was there to meet them. That may sound as if their parents were neither kind nor careful, but you would be wrong to think so. Mother had arranged for Aunt Emma to meet the train. The hour was settled before the day, so Mother later wrote a letter with the day, the hour, and careful instructions about the luggage and the cab. She gave it to Robert to post.

            That very morning, the hounds met near Rufus Stone. On their way to the meeting place they happened to pass Robert, and Robert happened to see them. Aunt Emma's letter went straight out of his mind. He did not remember it again until the children had walked up and down the Waterloo platform three times each way, making six walks altogether. They bumped into old gentlemen, searched the faces of ladies, got pushed by people in a hurry, and had porters with luggage trucks call for them to move aside. By then they were quite, quite certain. Aunt Emma was not there.
        - id: ch01-b02
          speaker: robert
          text: >-
            Oh, crikey!
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: >-
            Robert stopped with his mouth open. A porter carrying a Gladstone bag in each hand and a bundle of umbrellas tucked under one arm crashed heavily into him. The larger bag struck Robert on the knee and made him stagger. He did not ask where the porter was shoving, or even tell the man to watch where he was going. Robert said nothing at all. Once the others understood, they told him exactly what they thought of him.
        - id: ch01-b04
          speaker: anthea
          text: >-
            We must take a train to Croydon and find Aunt Emma.
        - id: ch01-b05
          speaker: cyril
          text: >-
            Yes, and those Jevonses will be delighted when all of us turn up with all our luggage.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Aunt Emma was staying with a family named Jevons. The Jevonses were very proper people of middle age. They dressed themselves in extremely smart blouses, and they were fond of shopping and going to afternoon plays. Children were one of the things they were not fond of at all.
        - id: ch01-b07
          speaker: jane
          text: >-
            Mother would be glad if we went back to Lyndhurst.
        - id: ch01-b08
          speaker: cyril
          text: >-
            She would be glad, but she wouldn't let us see it because this is Bob's fault. I know how that sort of thing goes. And we haven't enough money. We can just afford a four-wheeler, but we can't buy four tickets back to the New Forest. We must go home. Once they know we got there safely, they won't be so furious. Aunt Emma was only going to take us home in a cab anyway.
        - id: ch01-b09
          speaker: anthea
          text: >-
            I still think we should go to Croydon.
        - id: ch01-b10
          speaker: robert
          text: >-
            Aunt Emma is certain to be out. Those Jevonses go to the theatre every afternoon, I believe. Besides, the Phoenix and the carpet are at home. I vote we call a four-wheeled cab.
        - id: ch01-b11
          speaker: narrator
          text: >-
            They called one. It was an old-fashioned cab with straw scattered over the floor, and Anthea asked the driver to take them very carefully to their address. He did exactly that. The price he demanded at the end came to the full value of the gold coin Grandpapa had given Cyril for Christmas. Losing the whole coin at once cast a gloom over the children. Still, Cyril would never lower himself by arguing over a cab fare. The driver might think he was not accustomed to taking a cab whenever he wanted one.

            Cyril told the man to leave the luggage on the front steps. He waited until the cab wheels had grated away before he reached for the bell.
        - id: ch01-b12
          speaker: cyril
          text: >-
            We don't want Cook and Eliza asking why we came home alone while he's listening. They'd make us sound like babies.
        - id: ch01-b13
          speaker: narrator
          text: >-
            He rang. The answering clang told them at once that nobody would be coming to the door for some time. A bell has a different sound when someone inside can hear it. I cannot explain why, but it does.
        - id: ch01-b14
          speaker: jane
          text: >-
            Perhaps they're changing their dresses.
        - id: ch01-b15
          speaker: anthea
          text: >-
            It's too late for that. It must be after five. Perhaps Eliza went to post a letter, and Cook went out to see what time it is.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Cyril rang once more. This time the bell did its very best to tell the listening children that there was no human being in the house. Still they rang again and listened with all their attention. Their hearts sank lower and lower. It is a dreadful thing to stand outside your own front door, unable to get in, while a dark and muggy January evening closes around you.
        - id: ch01-b17
          speaker: jane
          text: >-
            There isn't a single gaslight on.
          emotion: sad
        - id: ch01-b18
          speaker: robert
          text: >-
            They've probably left the gas burning once too often, and a draught blew it out. Now they've suffocated in their beds. Father always said they would one day.
        - id: ch01-b19
          speaker: anthea
          text: >-
            Let's fetch a policeman.
          emotion: fearful
        - id: ch01-b20
          speaker: cyril
          text: >-
            No, thank you. We'd only be arrested for trying to burgle the place. Father read us a newspaper story about a young man who climbed into his own mother's house, and the police turned him into a burglar.
        - id: ch01-b21
          speaker: anthea
          text: >-
            I only hope the gas hasn't hurt the Phoenix. It wanted to stay in the bathroom cupboard, and I thought it would be safe because the servants never clean in there. But what if it came out and the gas choked it? And we'll be choked as soon as we open the door. I knew we should have gone to Aunt Emma in Croydon. Oh, Squirrel, I wish we had. Let's go now.
          emotion: fearful
        - id: ch01-b22
          speaker: cyril
          text: >-
            Be quiet. Something is moving the latch from inside.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Everyone listened with all their might and moved as far back as the steps allowed. The latch rattled and clicked. Then the flap of the letter box rose. By the gas lamp flickering through the bare lime tree, they saw a golden eye wink through the opening. A careful beak whispered to them.
        - id: ch01-b24
          speaker: phoenix
          text: >-
            Are you alone?
        - id: ch01-b25
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            It's the Phoenix!
          emotion: happy
        - id: ch01-b26
          speaker: narrator
          text: >-
            Their voices held so much joy and relief that the words came out like a whispered shout.
        - id: ch01-b27
          speaker: phoenix
          text: >-
            Hush. Your slaves have gone out to make merry. The latch of this portal is too stiff for my beak. But the small window at the side, above the shelf where your bread is kept, has not been fastened.
        - id: ch01-b28
          speaker: cyril
          text: >-
            Right. We'll use that.
        - id: ch01-b29
          speaker: anthea
          text: >-
            Please meet us there, dear Phoenix.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The children crept around to the pantry window at the side of the house. A green gate marked Tradesmen's Entrance blocked the way into the narrow gravel passage between their house and the one next door. That gate was always kept bolted. Still, if you planted one foot on the dividing fence and the other on the gate handle, you found yourself over it almost before you knew what you were doing. That was Cyril's experience, and Robert's too. If the truth must be told, it was also the experience of Anthea and Jane.

            Robert bent to make a step with his back. Cyril climbed onto him, got one knickerbockered knee onto the concrete sill, and dived headfirst into the pantry. His legs waved in the air like the legs of someone learning to dive, until the muddy square soles of his boots disappeared.
        - id: ch01-b31
          speaker: robert
          text: >-
            Give me a lift, girls.
        - id: ch01-b32
          speaker: jane
          text: >-
            No. I'm not staying outside in the dark with only Anthea while something creeps up behind us. Squirrel can open the back door.
        - id: ch01-b33
          speaker: narrator
          text: >-
            A light sprang up in the pantry. Cyril always claimed that the Phoenix turned on the gas with its beak and lit it with one sweep of its wing. He was excited, though. Perhaps he used matches himself and forgot.

            He let the others in through the back door, and they bolted it behind them. Then the children went through the house and lit every gas jet they could find. On such a dark and dreary winter evening, an armed burglar seemed likely to appear at any moment. When you are afraid of burglars, or anything else, there is nothing like light.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Once all the lights were burning, it was clear that the Phoenix had made no mistake. Eliza and Cook were truly out. No one remained in the house but the four children, the Phoenix, the carpet, and the black beetles that lived in the cupboards on both sides of the nursery fireplace. Those beetles were especially pleased to have the children home when Anthea lit the fire. As usual, the children answered the loving little creatures with nothing but cold disdain.

            Do you know how to build a fire for yourself? I do not mean setting a match to paper that someone else has laid. Anthea began by raking out the ashes left from the fire of a week ago. Eliza had never cleared them, though she had plenty of time. Anthea struck her knuckle and made it bleed. Then she put the largest, best-looking cinders at the bottom of the grate.

            She took one sheet of old newspaper and tore it into four equal pieces. Each piece became a loose ball, and each ball went on top of the cinders. You should never use today's newspaper to light a fire. It will not burn well, and there are other reasons against it too. Next she found a bundle of wood and broke the string around it. She arranged the sticks with their front ends resting on the iron bars and their back ends supported by the paper balls. The string gave her finger a small cut. When it snapped, two of the sticks jumped up and struck her cheek. Over the wood she placed more cinders and several pieces of coal, taking care not to add any coal dust. Most of the dust seemed to land on her hands, but there was enough left to cover her face as well.

            She lit the edges of all four paper balls. Then she waited until the wood began to burn with a fizz, a crack, another crack, and another fizz. Only then did she go to the tap in the back kitchen and wash her hands and face. If you ever have to make a fire, there is no need to scrape your knuckles, cut your finger, let the wood bruise your cheek, or blacken yourself from head to foot. Apart from those accidents, Anthea's method is a very good way to light a fire in London. In the true countryside, people light fires in another and prettier way. But wherever you build one, it is always wise to wash your hands and face afterward.
        - id: ch01-b35
          speaker: narrator
          text: >-
            While Anthea gave the beetles a cheerful blaze, Jane laid the table for a meal that was not quite tea. Let us call it a tea-like meal. There was tea, because the fire burned so warmly that it seemed to invite the kettle to sit on its lap. But there was no milk, so everyone took six lumps of sugar instead.

            The things they found to eat were better than the usual tea. The boys made a careful search of the pantry. There they discovered cold tongue, bread, butter, cheese, and part of a cold pudding. That pudding was far nicer than any pudding Cook made when the children were at home. In the kitchen cupboard they found half of a Christmas cake, a pot of strawberry jam, and about a pound of mixed candied fruit. Every cup of lemon, orange, or citron peel held a soft, crumbly slab of delicious sugar.
        - id: ch01-b36
          speaker: jane
          text: >-
            This is a banquet fit for an Arabian Knight.
          emotion: happy
        - id: ch01-b37
          speaker: narrator
          text: >-
            The Phoenix perched on Robert's chair. It listened kindly and politely while they told it all about Lyndhurst. Beneath the table lay the faithful carpet. Each child could feel it by stretching down a toe, even Jane, whose legs were very short.
        - id: ch01-b38
          speaker: phoenix
          text: >-
            Your slaves will not return tonight. They are sleeping beneath the roof of Cook's stepmother's aunt. I understand that she is giving a large party for the ninetieth birthday of her husband's cousin's sister-in-law's mother.
        - id: ch01-b39
          speaker: anthea
          text: >-
            They shouldn't have gone without permission, however many relations they have and however old those relations are. But I suppose we ought to wash the dishes.
        - id: ch01-b40
          speaker: cyril
          text: >-
            Their permission is none of our business, but I refuse to wash up for them. We found the food, so we'll clear it away. Then we can travel on the carpet. We hardly ever get the chance to stay out all night. We could cross the equator, go to the tropics, and watch the sun rise over the great Pacific Ocean.
        - id: ch01-b41
          speaker: robert
          text: >-
            That's the thing. I've always wanted to see the Southern Cross and stars as big as gas lamps.
        - id: ch01-b42
          speaker: anthea
          text: >-
            Please don't go. I couldn't come. I'm sure Mother wouldn't want us to leave the house, and I would hate to stay here alone.
          emotion: fearful
        - id: ch01-b43
          speaker: jane
          text: >-
            I would stay with you.
        - id: ch01-b44
          speaker: anthea
          text: >-
            I know you would, and I'm grateful. But even with you, I would much rather not stay behind.
        - id: ch01-b45
          speaker: cyril
          text: >-
            Well, I don't want to make you do something you believe is wrong. But still...
        - id: ch01-b46
          speaker: narrator
          text: >-
            He stopped there, but his silence said a great deal.
        - id: ch01-b47
          speaker: robert
          text: >-
            I don't see why—
        - id: ch01-b48
          speaker: anthea
          text: >-
            I am sure. Sometimes you merely think something is wrong. Sometimes you know it. This is one of the times when I know.
        - id: ch01-b49
          speaker: narrator
          text: >-
            The Phoenix looked at her with kind golden eyes and opened its friendly beak.
        - id: ch01-b50
          speaker: phoenix
          text: >-
            When it is what you call a "know time," nothing more need be said. Your noble brothers would never leave you.
        - id: ch01-b51
          speaker: cyril
          text: >-
            Of course we wouldn't.
        - id: ch01-b52
          speaker: robert
          text: >-
            No, of course not.
        - id: ch01-b53
          speaker: phoenix
          text: >-
            I am ready to help in any way I can. I could fly, or take the carpet, and fetch whatever might amuse you this evening. To save time, I could go while you wash up. Though why do you wash up teacups, but wash down the stairs?
        - id: ch01-b54
          speaker: anthea
          text: >-
            You couldn't wash stairs up unless you began at the bottom and moved upward feet first as you scrubbed. I wish Cook would try it that way for once.
        - id: ch01-b55
          speaker: cyril
          text: >-
            I don't. The sight of her elastic-sided boots sticking up would be horrible.
        - id: ch01-b56
          speaker: phoenix
          text: >-
            This is pointless trifling. Decide what I should bring you. I can fetch anything you like.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Of course, they could not decide. One child suggested a rocking horse. Others proposed jeweled chessmen, an elephant, a bicycle, a motorcar, books filled with pictures, musical instruments, and many more treasures. Each idea had something wrong with it. An instrument pleases only the player unless that player has learned to play it properly. Books are not sociable companions. You cannot ride a bicycle indoors, and the same difficulty applies to motorcars and elephants. Only two people can use one chess set at a time, and chess feels far too much like lessons to count as a game. As for a rocking horse, only one person can be in the saddle.

            In the middle of the discussion, the Phoenix spread its wings and fluttered down to the floor.
        - id: ch01-b58
          speaker: phoenix
          text: >-
            The carpet has given me to understand that it wishes to visit the old home where it was born and raised. It promises to return within an hour, carrying some of the most beautiful and delightful products of its native land.
        - id: ch01-b59
          speaker: anthea
          text: >-
            Where is its native land?
        - id: ch01-b60
          speaker: phoenix
          text: >-
            I did not gather that. But you cannot agree, time is passing, and the tea things have not been washed down. I mean washed up.
        - id: ch01-b61
          speaker: robert
          text: >-
            I vote we let it go. That will stop all this talking, and surprises aren't bad. Perhaps it's a Turkey carpet. It might bring back Turkish delight.
        - id: ch01-b62
          speaker: cyril
          text: >-
            Or a Turkish patrol.
        - id: ch01-b63
          speaker: anthea
          text: >-
            Or a Turkish bath.
        - id: ch01-b64
          speaker: jane
          text: >-
            Or a Turkish towel.
        - id: ch01-b65
          speaker: robert
          text: >-
            Don't be silly. It promised beautiful and delightful things. Baths and towels aren't beautiful or delightful, however good they may be for you. Let it go. It won't run away from us, will it?
        - id: ch01-b66
          speaker: narrator
          text: >-
            He pushed back his chair and stood.
        - id: ch01-b67
          speaker: phoenix
          text: >-
            Hush! How can you say such a thing? You must not trample on its feelings merely because it is a carpet.
        - id: ch01-b68
          speaker: robert
          text: >-
            But how can it travel unless one of us sits on it and makes the wish?
        - id: ch01-b69
          speaker: narrator
          text: >-
            His voice rose hopefully. If someone had to go, why should that someone not be Robert? The Phoenix quickly put an end to his new dream.
        - id: ch01-b70
          speaker: phoenix
          text: >-
            You need only write the wish on a piece of paper and pin it to the carpet.
        - id: ch01-b71
          speaker: narrator
          text: >-
            They tore a page from Anthea's arithmetic book. Cyril wrote the wish in his large, rounded hand.
        - id: ch01-b72
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: >-
            Please go to your dear native home. Bring back the most beautiful and delightful things it produces, and please do not stay away long.
        - id: ch01-b73
          speaker: narrator
          text: >-
            All four children signed it, and they laid the paper on the carpet.
        - id: ch01-b74
          speaker: phoenix
          text: >-
            Put the writing downward, please. A carpet cannot read a page when the blank side faces it any more than you can.
        - id: ch01-b75
          speaker: narrator
          text: >-
            They turned the page and pinned it securely. Then they moved the table and chairs. The carpet vanished simply and suddenly. It looked like a patch of water drying before a fierce fire. Its edges drew inward until nothing remained.
        - id: ch01-b76
          speaker: phoenix
          text: >-
            It may need some time to gather the beautiful and delightful objects. I recommend that you wash up. I mean wash down.
        - id: ch01-b77
          speaker: narrator
          text: >-
            So they washed the dishes. The kettle still held plenty of hot water, which meant there was enough for the entire task. Everyone took a share of the work. Even the Phoenix helped. It picked up each cup by the handle with its clever claws, dipped the cup into the hot water, and placed it on the table for Anthea to dry. The golden bird was rather slow about it. It explained that it did not consider itself too grand for any kind of honest labor. Even so, playing about in dirty dishwater was not exactly one of the accomplishments it had been raised to practice.

            Everything was properly washed, carefully dried, and put back exactly where it belonged. They washed the dishcloth itself and spread it along the edge of the copper to dry. The tea cloth went onto the line that crossed the scullery. If you are the child of a duchess, a king, or another person of very high position, you may not know that a dishcloth and a tea cloth are different things. Your nurse has probably been taught better, though, and she will be able to explain the difference.

            Eight hands and one pair of claws were being dried on the roller towel behind the door when a strange sound came through the kitchen wall from the nursery. It was unlike anything the children had heard, though a toy engine's whistle resembles a steam siren about as closely.
        - id: ch01-b78
          speaker: robert
          text: >-
            The carpet is back.
        - id: ch01-b79
          speaker: narrator
          text: >-
            The others knew he was right.
        - id: ch01-b80
          speaker: jane
          text: >-
            What has it brought? It sounds like Leviathan, the great beast.
        - id: ch01-b81
          speaker: cyril
          text: >-
            It wasn't made in India, was it? It may have brought elephants. Even baby elephants would be dreadful in that room. We should take turns looking through the keyhole.
        - id: ch01-b82
          speaker: narrator
          text: >-
            They went in order of age. The Phoenix, being older by several thousand years, had the right to look first.
        - id: ch01-b83
          speaker: phoenix
          text: >-
            Excuse me. Looking through keyholes always gives my golden eyes a cold.
        - id: ch01-b84
          speaker: narrator
          text: >-
            It ruffled its feathers and sneezed softly, so Cyril took the first look.
        - id: ch01-b85
          speaker: cyril
          text: >-
            Something gray is moving in there.
        - id: ch01-b86
          speaker: robert
          text: >-
            I bet it's some sort of zoological garden.
        - id: ch01-b87
          speaker: narrator
          text: >-
            The soft rustling, bustling, ruffling, scuffling, shuffling, fluffling sound went on. Robert finished his turn, and Anthea put her eye to the keyhole.
        - id: ch01-b88
          speaker: anthea
          text: >-
            I can't see anything. My eye tickles.
        - id: ch01-b89
          speaker: narrator
          text: >-
            Then Jane looked.
        - id: ch01-b90
          speaker: jane
          text: >-
            It's a giant kitty cat, and it's asleep all over the floor.
        - id: ch01-b91
          speaker: robert
          text: >-
            Giant cats are tigers. Father told us so.
        - id: ch01-b92
          speaker: jane
          text: >-
            No, he said tigers are giant cats. That isn't the same thing at all.
        - id: ch01-b93
          speaker: phoenix
          text: >-
            There is little point in sending the carpet for treasures if you are too frightened to look at them when they arrive.
        - id: ch01-b94
          speaker: cyril
          text: >-
            Come on, then.
        - id: ch01-b95
          speaker: narrator
          text: >-
            As the eldest child, Cyril turned the handle. The gas had been left burning brightly after tea, and the ten eyes at the doorway could see the room plainly. They could not see the carpet itself. One hundred and ninety-nine beautiful objects covered it completely.
        - id: ch01-b96
          speaker: cyril
          text: >-
            My hat! I never thought of it being a Persian carpet.
          emotion: surprised
        - id: ch01-b97
          speaker: narrator
          text: >-
            Now the truth was obvious. The carpet had returned from Persia, and the beautiful things were Persian cats. There were one hundred and ninety-nine of them, all gray, all packed together as closely as they could sit. The instant the children stepped into the room, every cat stood up and stretched. They spread beyond the carpet and overflowed across the floor. In a moment, the whole floor had become a sea of soft, moving, mewing catliness.

            All four children climbed onto the table together, gathered their legs beneath them, and tried to keep every foot beyond the cats' reach. The people in the house next door began knocking on the wall. No wonder they objected. One hundred and ninety-nine Persian cats were all calling at once, and their Persian mews were sharp enough to pierce straight through the wall.
        - id: ch01-b98
          speaker: cyril
          text: >-
            This isn't much fun. What's wrong with the creatures?
        - id: ch01-b99
          speaker: phoenix
          text: >-
            I believe they are hungry. If you were to give them food—
        - id: ch01-b100
          speaker: anthea
          text: >-
            We haven't got anything for them. Oh, pussies, please be quiet. We can't even hear ourselves think. Feeding all of you would cost pounds and pounds in cat meat.
          emotion: sad
        - id: ch01-b101
          speaker: narrator
          text: >-
            She stroked the nearest Persian back and had to shout over the ever-louder cries.
        - id: ch01-b102
          speaker: robert
          text: >-
            Let's tell the carpet to take them back.
        - id: ch01-b103
          speakers: [anthea, jane]
          ensemble: duo
          text: >-
            No!
        - id: ch01-b104
          speaker: jane
          text: >-
            They're so soft and so very pussy.
        - id: ch01-b105
          speaker: anthea
          text: >-
            And they're valuable. We could sell them for lots and lots of money.
        - id: ch01-b106
          speaker: phoenix
          text: >-
            Why not send the carpet to fetch their food?
        - id: ch01-b107
          speaker: narrator
          text: >-
            The Phoenix had to strain until its golden voice sounded cracked and harsh above the fierce mewing. The children wrote another note, asking the carpet to bring food for one hundred and ninety-nine Persian cats, and pinned it down as before.

            The carpet seemed to gather itself. The cats rolled off it like raindrops shaken from a raincoat, and then it vanished.
        - id: ch01-b108
          speaker: narrator
          text: >-
            Unless you have shared one small room with one hundred and ninety-nine fully grown Persian cats, all hungry and all announcing their hunger in unmistakable mews, you can form only the faintest idea of that deafening noise. These particular cats did not seem to have been properly brought up. They had no idea that asking for a meal in a stranger's house might be a mistake in manners. They understood even less that it was shockingly rude to howl for the meal at the tops of their voices.

            They mewed, and mewed, and went on mewing. The children pushed their fingers deep into their ears and waited in silent misery. They wondered why the whole of Camden Town had not come hammering at the front door to demand an explanation. All they could do was hope the cats' food arrived before the neighbors did. If the neighborhood came first, the secret of the carpet and the Phoenix might be revealed past all hope of taking it back.

            The cats wound their Persian bodies in and out and unfurled their Persian tails. The children and the Phoenix huddled together on the table. Then Robert noticed that the Phoenix was trembling.
        - id: ch01-b109
          speaker: phoenix
          text: >-
            There are so many cats. They may not realize that I am the Phoenix, and accidents happen very quickly. It quite unmans me.
          emotion: fearful
        - id: ch01-b110
          speaker: narrator
          text: >-
            The children had not considered that danger.
        - id: ch01-b111
          speaker: robert
          text: >-
            Get inside my jacket, quick!
          emotion: fearful
        - id: ch01-b112
          speaker: narrator
          text: >-
            The Phoenix slipped into Robert's jacket only just in time. All around the table, green eyes had begun to glare, pink noses were sniffing, and white whiskers were twitching with interest. Robert pulled his coat closed and fastened the buttons. As he did, a wave of eager gray Persian fur surged around him and swallowed him right up to the waist.

            At that very moment, the faithful carpet slapped itself onto the floor. It was covered in rats. There were three hundred and ninety-eight, I believe. Two rats for every cat.
        - id: ch01-b113
          speaker: anthea
          text: >-
            How horrible! Oh, take them away!
          emotion: disgusted
        - id: ch01-b114
          speaker: phoenix
          text: >-
            Take yourself away, and take me too.
          emotion: fearful
        - id: ch01-b115
          speaker: anthea
          text: >-
            I wish we'd never had that carpet.
          emotion: sad
        - id: ch01-b116
          speaker: narrator
          text: >-
            They pushed and crowded their way out, then shut and locked the door. Cyril kept his head. He lit a candle and turned off the gas at the main.
        - id: ch01-b117
          speaker: cyril
          text: >-
            The rats will have a better chance in the dark.
        - id: ch01-b118
          speaker: narrator
          text: >-
            The mewing stopped. Everyone listened in breathless silence. We all learn very early that cats eat rats. It is one of the first facts printed in the little brown books from which children learn to read. But knowing that simple fact was one thing. Thinking of all those cats eating all those rats at the same time was more than any of them could bear.

            The children stood in the dark kitchen. A draught made their one candle burn sideways. Then Robert sniffed.
        - id: ch01-b119
          speaker: robert
          text: >-
            What is that funny smell?
        - id: ch01-b120
          speaker: narrator
          text: >-
            A lantern flashed through the kitchen window. A face peered in.
        - id: ch01-b121
          speaker: policeman
          text: >-
            What's all this noise? Let me in.
        - id: ch01-b122
          speaker: narrator
          text: >-
            It was a policeman. Robert crept to the window and spoke through a pane that had been cracked ever since Cyril tried to balance a walking stick on his nose after a visit to the circus.
        - id: ch01-b123
          speaker: robert
          text: >-
            What noise? There isn't any. Listen. The house is perfectly quiet.
        - id: ch01-b124
          speaker: narrator
          text: >-
            At that moment, it truly was. The strange sweet smell grew stronger, and the Phoenix poked its beak out of Robert's jacket. The policeman hesitated.
        - id: ch01-b125
          speaker: phoenix
          text: >-
            They are musk rats. Some cats may eat them, I suppose, but Persian cats never do. What an error for a well-informed carpet to make. Oh, what a night this has been!
          emotion: surprised
        - id: ch01-b126
          speaker: robert
          text: >-
            Please go away. We're about to go to bed. This is our bedroom candle. There is no noise at all. Everything is as quiet as a mouse.
          emotion: fearful
        - id: ch01-b127
          speaker: narrator
          text: >-
            A wild chorus of mews drowned him out. The musk rats shrieked with them. Perhaps the cats had taken a taste before deciding they did not like the flavor.
        - id: ch01-b128
          speaker: policeman
          text: >-
            I'm coming inside. You've shut a cat in there.
        - id: ch01-b129
          speaker: cyril
          text: >-
            A cat? Oh, my only aunt! One cat?
          emotion: surprised
        - id: ch01-b130
          speaker: robert
          text: >-
            Come in if you insist, but you'll be sorry. Give me a moment to open the side gate.
        - id: ch01-b131
          speaker: narrator
          text: >-
            Robert unbolted the side gate, and the policeman came in with great caution. He found the four children crowded into the kitchen, lit by a single candle. Beyond the wall, the mewing and screaming went on like twelve steam sirens, twenty horns sounding from waiting motorcars, and fifty squeaking pumps. All four children were thoroughly agitated. They began shouting at once, each offering a different explanation of the evening's hopelessly mixed-up events.

            Have you ever tried to explain even the simplest thing to a policeman?
