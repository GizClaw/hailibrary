audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带一点英式童话的机智
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明自信，挖苦人时一本正经
        timbre: 清脆的少年声
        pace: 中等偏快
        pitch: 中高
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴敏锐，急切时仍然清楚
        timbre: 柔和明亮的少女声
        pace: 中等
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 坚持己见，认真里常带几分莽撞
        timbre: 结实清朗的少年声
        pace: 中等
        pitch: 中等
    jane:
      display_name: 简
      tts:
        delivery: 天真直率，话里带着小孩子的认真
        timbre: 稚嫩柔软的女孩声
        pace: 稍慢
        pitch: 偏高
    lamb:
      display_name: 小羊羔
      tts:
        delivery: 稚气快活，说话简短直接
        timbre: 柔软清亮的幼童声
        pace: 稍慢
        pitch: 高
    phoenix:
      display_name: 凤凰
      tts:
        delivery: 文雅自负，庄重中带着敏锐的幽默
        timbre: 华美清润，中性而成熟
        pace: 从容
        pitch: 中高
    father:
      display_name: 爸爸
      tts:
        delivery: 温和风趣，疲倦时仍有耐心
        timbre: 沉稳温暖的成年男声
        pace: 从容
        pitch: 中低
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔克制，忧心时语气依然平和
        timbre: 柔润清晰的成年女声
        pace: 中等
        pitch: 中等
    cook:
      display_name: 厨娘
      tts:
        delivery: 直爽泼辣，恼火时短促有力，快活时热烈爽朗
        timbre: 洪亮厚实的成年女声
        pace: 中等偏快
        pitch: 中等
    islander:
      display_name: 岛民
      tts:
        delivery: 郑重恭敬，带着仪式般的热忱
        timbre: 浑厚清晰的成年男声
        pace: 稍慢
        pitch: 中低
    eliza:
      display_name: 伊莱扎
      tts:
        delivery: 爽快利落，禀报事情时一口气说完
        timbre: 明亮朴实的年轻女声
        pace: 偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 厨娘女王
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 孩子们第一次坐许愿毯旅行是在星期六。第二天当然是星期日，这一点，只要你已经大到会读书，准知道。
        - id: ch01-b02
          speaker: narrator
          text: 卡姆登镇卡姆登台地十八号的星期日，总是很美好。爸爸星期六会带花回家。到了十一月，花只有黄色和古铜色的菊花，可早餐桌还是格外漂亮。桌上照例有吐司和香肠。连续六天吃过肯蒂什镇路上一先令十四个的鸡蛋，再尝香肠，简直能叫人陶醉。
        - id: ch01-b03
          speaker: narrator
          text: 那天的晚餐还准备了鸡。鸡肉平时只有生日或隆重场合才吃得到。甜点是天使布丁，米饭、牛奶、橙子和雪白糖霜一起使劲，非要叫人快活不可。
        - id: ch01-b04
          speaker: narrator
          text: 晚饭后，辛苦了一星期的爸爸困得要命，却没听心里那个劝他去睡一小时的声音。他抱着咳嗽得很厉害的小羊羔。厨娘咬定，这准是百日咳。
        - id: ch01-b05
          speaker: father
          text: 来吧，孩子们。我从图书馆借了本特别好的书，叫《黄金时代》。我来念给你们听。
        - id: ch01-b06
          speaker: narrator
          text: 妈妈在客厅沙发上安顿好，说自己闭着眼也能听。小羊羔舒舒服服地偎在爸爸臂弯里，就像坐进一张扶手椅。其他孩子快活地挤在炉前地毯上。起初，到处都是脚、膝盖、肩膀和胳膊肘，数量实在多了些。大家好不容易快找到真正舒服的姿势，也刚把凤凰和地毯收进心里最高处、靠后的搁板，准备以后随时再拿出来玩，客厅门上忽然传来一记又重又粗暴的敲击。门气冲冲地开了一英寸，厨娘的声音从门缝钻进来，请妈妈出去说句话。
        - id: ch01-b07
          speaker: narrator
          text: 妈妈绝望地看了爸爸一眼，穿上那双漂亮闪亮的星期日鞋，叹着气站起来。
        - id: ch01-b08
          speaker: father
          text: 海里的好鱼还多着呢。
        - id: ch01-b09
          speaker: narrator
          text: 孩子们过了很久才懂这句话。妈妈来到有伞架的门厅。墙上挂着金光闪闪的黄框画《峡谷之王》。早在他们搬进来以前，潮气已经给画里的王者留下棕色斑点。厨娘就站在画下，脸又红又湿。她里面那条围裙盛过可爱又美味的烤鸡，早就脏了，外面却歪歪扭扭地系着一条干净围裙。她站在那里，脸仿佛还在变得更红、更湿，手指不停绞着围裙一角，接着才又短又冲地开口。
        - id: ch01-b10
          speaker: cook
          text: 太太，请原谅。这个月做满，我就要走。
        - id: ch01-b11
          speaker: narrator
          text: 妈妈靠在帽架上。孩子们从门缝里看见，她的脸一下白了。妈妈一直待厨娘很好，昨天还给她放了假。厨娘偏在星期日说要走，实在太无情了。
        - id: ch01-b12
          speaker: mother
          text: 怎么了？出了什么事？
        - id: ch01-b13
          speaker: cook
          text: 还不是那些孩子！他们房里的新地毯，两面都糊着泥，还是恶心的黄泥，天晓得从哪儿弄来的。星期日还要我收拾这摊脏东西。这不归我干，我也不打算干，太太。要不是那几个小祸害，这份差事还不坏。我本来不想走，可是……
        - id: ch01-b14
          speaker: narrator
          text: 孩子们不知怎么，全觉得自己早料到了。最近他们好像没做过格外出格的事，可要惹恼一位厨娘，原本就很容易。
        - id: ch01-b15
          speaker: mother
          text: 真对不起。我会跟孩子们谈。你也再想想吧。如果你真的想走，明天再告诉我。
        - id: ch01-b16
          speaker: narrator
          text: 第二天，妈妈安安静静地又同她谈了一回。厨娘答应留下来，再看看情形。
        - id: ch01-b17
          speaker: narrator
          text: 在这之前，爸爸妈妈已经把地毯沾泥的事从头到尾仔细追问过。简老老实实解释说，那些泥是从一座外国高塔的底部带回来的，那里还埋着宝藏。大人们听完，只冷冷地表示不相信。其余几个孩子见状，再也不敢讲实话，只好说自己很难过，还保证以后再也不这样做。
        - id: ch01-b18
          speaker: father
          text: 一个孩子把地毯两面都弄满厚泥，问起来还只会说这种傻话，就不配再有地毯。整整一个星期，谁也不许碰它！
        - id: ch01-b19
          speaker: narrator
          text: 妈妈也赞同，因为妈妈必须赞同爸爸，并不是她自己也这样想。地毯被刷干净了，还用上了茶叶，这是安西娅唯一想得出的安慰。随后它被叠起来，锁进楼梯顶端的柜子。爸爸把钥匙放进裤袋。
        - id: ch01-b20
          speaker: father
          text: 等到星期六吧。
        - id: ch01-b21
          speaker: anthea
          text: 没事，我们还有凤凰呢。
        - id: ch01-b22
          speaker: narrator
          text: 可他们偏偏没有凤凰。哪儿都找不到它。一切忽然从魔法奇遇那玫瑰色、狂放又美丽的世界里跌下来，重新变成卡姆登镇十一月潮湿的褐色日常。育儿室中央只剩光秃秃的黄木板，四周围着棕色油布。到了晚上，可怜的黑甲虫照例钻出来，一心想跟孩子们交朋友。中央地板又亮又黄，把每只甲虫都衬得清清楚楚，模样怕人得很。可无论它们多么想交朋友，孩子们从来不肯答应。
        - id: ch01-b23
          speaker: narrator
          text: 这个星期日就在愁云惨雾中结束了。晚餐时，凝乳甜点盛在漂亮的德累斯顿蓝瓷碗里端上来，可就连这样的甜食，也几乎没能让大家的心情亮堂一点。到了第二天，小羊羔咳得更加厉害，听上去的确很像百日咳。于是，医生坐着双轮马车赶来了。
        - id: ch01-b24
          speaker: narrator
          text: 地毯锁着，凤凰失踪了。人人都在努力承受这两件伤心事，也花了许多时间寻找凤凰。
        - id: ch01-b25
          speaker: anthea
          text: 凤凰说话算话，我相信它不会丢下我们。你们想，它从原来的地方飞到罗切斯特附近，又一路飞回来，路那么远。可怜的凤凰一定累坏了，只想休息。我知道它靠得住。
        - id: ch01-b26
          speaker: narrator
          text: 其他人也努力让自己相信，可这并不容易。谁也没法喜欢厨娘。要不是她为了那么一点外国泥大惊小怪，地毯根本不会被收走。
        - id: ch01-b27
          speaker: jane
          text: 她本来可以告诉我们呀。我和潘瑟会用茶叶刷干净的。
        - id: ch01-b28
          speaker: robert
          text: 她就是一只坏脾气的猫。
        - id: ch01-b29
          speaker: anthea
          text: 我不说心里是怎么想她的。说出来，就成了恶语、谎话和诽谤。
        - id: ch01-b30
          speaker: cyril
          text: 可要说她是头讨厌的猪，是个臭烘烘的蓝鼻子博兹沃兹，那就不是撒谎。
        - id: ch01-b31
          speaker: narrator
          text: 西里尔读过《光明之眼》，正打算先教罗伯特学保罗说话，自己再去学托尼的口气。四个孩子，连安西娅也一样，都希望厨娘从来没有生下来过，哪怕她并不真是什么蓝鼻子博兹沃兹。
        - id: ch01-b32
          speaker: narrator
          text: 请你相信，接下来一星期，那些把厨娘气坏的事情，并不全是孩子们故意做的。话虽这么说，要是厨娘是他们喜欢的人，那些事情大概又不会发生。这可真是个谜，你要能解释，就请解释吧。事情是这样的。星期日，厨娘发现地毯两面都沾满外国泥。星期一，安西娅拿那只白色内壁的小炖锅煮甘草和茴香糖球，觉得这能治小羊羔的咳嗽。那锅平时专门给宝宝热牛奶。后来大家把它忘得一干二净，锅底便烧穿了。
        - id: ch01-b33
          speaker: narrator
          text: 星期二，他们在食品储藏室里发现一只死老鼠。孩子们拿煎鱼铲去给它挖坟，不幸失了手，把铲子弄断了。他们替自己辩解说，厨娘本来就不该把死老鼠留在食品储藏室。星期三，厨房桌上放着切碎的板油，罗伯特又往里面添了些切碎的肥皂。不过按他自己的说法，他以为那些板油也是肥皂。
        - id: ch01-b34
          speaker: narrator
          text: 星期四，他们在地下室前面的凹院里，玩了一场完全公平的强盗游戏。游戏中有人摔到厨房窗户上，把玻璃撞破了。星期五，他们用油灰堵住厨房水槽的排水孔，再往里面放水，把水槽做成一座湖，好让纸船航行。后来孩子们走开，却忘了关水龙头。结果，厨房炉前的地毯，还有厨娘的鞋，全都毁了。
        - id: ch01-b35
          speaker: narrator
          text: 到了星期六，地毯终于发还。孩子们这一星期早已商量好，要请它带大家去哪儿。妈妈去了外婆家。小羊羔咳得太厉害，只好留下。厨娘一遍遍说，他是百日咳，就跟鸡蛋是鸡蛋一样准。
        - id: ch01-b36
          speaker: anthea
          text: 可我们要带小宝贝出去，去一个不会得百日咳的地方。罗伯特，别犯傻。就算他以后讲出来，也不会有人当真。他总说些自己从没见过的东西。
        - id: ch01-b37
          speaker: narrator
          text: 于是孩子们给自己和小羊羔都穿好外衣。可怜的小家伙笑几声，咳起来，再笑，又咳。男孩子搬开地毯上的桌椅。简抱着小羊羔，安西娅则跑遍整所房子，发疯似的最后寻找一次凤凰。
        - id: ch01-b38
          speaker: anthea
          text: 再等也没用了。可我知道它没有抛下我们。它是一只说话算话的鸟。
        - id: ch01-b39
          speaker: phoenix
          text: 一点不错。
        - id: ch01-b40
          speaker: narrator
          text: 温柔的声音从桌子下面传来。大家全都跪下，仰头往桌底看。凤凰正栖在一根横木上。那根木头原先托着一只抽屉，后来抽屉被孩子们拿去当船。再后来，罗伯特脚上穿着拉格特真正可靠牌学生靴，不小心一脚踩穿了抽屉底。拿抽屉当船的幸福日子，也就这样结束了。
        - id: ch01-b41
          speaker: phoenix
          text: 我一直在这儿。你们要找我，就该朗诵召唤颂歌。那首颂歌有七千行，用的是非常纯正优美的希腊文。
        - id: ch01-b42
          speaker: narrator
          text: 凤凰用爪子遮住嘴，文雅地打了个呵欠。
        - id: ch01-b43
          speaker: anthea
          text: 你不能用英语念给我们听吗？
        - id: ch01-b44
          speaker: jane
          text: 七千行是不是太长了？你不能学泰特和布雷迪，编个短一点的英文版本吗？
        - id: ch01-b45
          speaker: narrator
          text: 简把膝上的小羊羔颠了颠。罗伯特伸出手。
        - id: ch01-b46
          speaker: robert
          text: 哎呀，快来吧，老凤凰。
        - id: ch01-b47
          speaker: phoenix
          text: 是美丽的老凤凰。
        - id: ch01-b48
          speaker: robert
          text: 好，美丽的老凤凰。快来，快来。
        - id: ch01-b49
          speaker: narrator
          text: 凤凰马上扑扇翅膀，落到他腕上。
        - id: ch01-b50
          speaker: phoenix
          text: 这位可爱的少年，竟然奇迹般把七千行希腊文召唤颂歌的全部意思，浓缩成了一行英语六步格诗。虽然几个词的位置不大妥当，不过……
        - id: ch01-b51
          speaker: robert
          text: 快来吧，快来吧，美丽的老凤凰！
        - id: ch01-b52
          speaker: phoenix
          text: 我承认，这一行并不完美。不过对他这个年纪的男孩子来说，已经很不错了。
        - id: ch01-b53
          speaker: robert
          text: 好啦，现在可以走了吧。
        - id: ch01-b54
          speaker: narrator
          text: 罗伯特退上地毯，金色凤凰停在他的手腕上。简抱着宝宝坐下来。
        - id: ch01-b55
          speaker: jane
          text: 你看着就像国王的养鹰人。
        - id: ch01-b56
          speaker: narrator
          text: 罗伯特努力保持养鹰人的派头。西里尔和安西娅也踏上地毯。
        - id: ch01-b57
          speaker: cyril
          text: 得在晚饭前回来，不然厨娘准去告密。
        - id: ch01-b58
          speaker: anthea
          text: 从星期日以后，她还没告过状呢。
        - id: ch01-b59
          speaker: narrator
          text: 罗伯特刚要开口，门猛地撞开。厨娘怒气冲冲地卷进来，像一阵旋风，一脚踩住地毯角。她一手拿着破盆，另一只手攥成拳头，里面仿佛握着一桩威胁。
        - id: ch01-b60
          speaker: cook
          text: 你们自己瞧！我唯一的一只盆！你们妈妈叫我晚饭做牛排腰子布丁，现在拿什么做？你们根本不配吃晚饭，今晚谁也别想吃！
          emotion: angry
        - id: ch01-b61
          speaker: anthea
          text: 厨娘，真对不起。是我错了，我忘了告诉你。我们熔铅算命的时候把盆弄破了。我原本要告诉你的。
        - id: ch01-b62
          speaker: cook
          text: 原本要告诉我？哼，我也有话要告诉你们！这一星期我一直忍着，因为太太好声好气地说，不能指望小小肩膀上长着老脑袋。可我再也不忍了。你们往布丁里放肥皂，我和伊莱扎一个字都没告诉你们妈妈。还有小炖锅，煎鱼铲，还有……我的天！你们把这个宝贝孩子穿成这样，是想带他去哪儿？
          emotion: angry
        - id: ch01-b63
          speaker: anthea
          text: 我们没打算带他出去。至少……
        - id: ch01-b64
          speaker: narrator
          text: 安西娅忽然说不下去了。他们的确不打算带小羊羔上肯蒂什镇路，却肯定要把他带到别处。可那个别处，和厨娘嘴里所说的出去，根本不是一回事。要是继续解释，就得泄露地毯的秘密。要是不解释，又好像在撒谎。这一下，诚实的安西娅真不知道该怎么说了。
        - id: ch01-b65
          speaker: cook
          text: 就是要出去！我保证你们带不走他。
        - id: ch01-b66
          speaker: narrator
          text: 厨娘一把从简膝上抢过小羊羔。安西娅和罗伯特揪住她的裙子和围裙。
        - id: ch01-b67
          speaker: cyril
          text: 听着，你能不能走开？拿烤馅饼的盘子、花盆、热水壶，随便什么东西去做布丁吧！
        - id: ch01-b68
          speaker: cook
          text: 我才不走。把这个心肝宝贝留下，叫你们害他重重受凉，送掉小命？休想！
        - id: ch01-b69
          speaker: cyril
          text: 我警告你。现在还来得及，你可要小心。
        - id: ch01-b70
          speaker: cook
          text: 你才该小心这个小乖乖。他们别想把宝宝带出去，想都别想。还有，那只黄鸟是从哪儿来的？
          emotion: angry
        - id: ch01-b71
          speaker: narrator
          text: 厨娘又生气又怜爱，伸手指向凤凰。连安西娅也明白，照这样下去，厨娘要是不丢掉差事，吃亏的就一定是他们。
        - id: ch01-b72
          speaker: anthea
          text: 我希望我们到了阳光明媚的南方海岸，那里谁也不会得百日咳。
        - id: ch01-b73
          speaker: narrator
          text: 小羊羔吓得号啕大哭，厨娘扯着嗓子责骂，安西娅就在这两种声音中说出了愿望。眨眼间，所有人都头晕目眩，不停打转，又像坐着升降梯直往下坠。厨娘一屁股坐到地毯上，把尖叫的小羊羔紧紧搂在怀里。她那胖胖的身躯裹着印花布，随着地毯一起颠来倒去。她一边高声尖叫，一边呼唤圣布里吉德来搭救。她是个爱尔兰人。
        - id: ch01-b74
          speaker: narrator
          text: 那种醉醺醺、颠来倒去的感觉刚一停止，厨娘便睁开眼睛。她看清周围以后，立刻发出一声响亮的尖叫，又马上把眼睛紧紧闭上。安西娅抓住这个机会，把还在拼命哭号的小羊羔从她怀里抱了回来。
        - id: ch01-b75
          speaker: anthea
          text: 没事啦，是你自己的潘瑟抱着你。看看那些树、沙子、贝壳，还有大乌龟。哎呀，怎么这么热！
        - id: ch01-b76
          speaker: narrator
          text: 真的很热。可靠的地毯把自己铺在一片阳光灿烂的南方海岸上。翠绿得不能再绿的山坡，一路伸向辉煌的树林。林中长着成片棕榈，还有《向西去！》和《公平游戏》里写过的各种热带花果，一派繁茂丰盛。绿山坡和蓝盈盈的大海之间，是一片珠宝织成的金布似的沙滩。这里的沙不像北方海滩那样灰暗。它金黄多彩，还在不停变幻，阳光和彩虹在上面融成蛋白石般的光。地毯带来的狂野旋转、眼花耳聋和上下颠倒刚一停止，孩子们正好看见三只活的大海龟摇摇摆摆爬向海边，消失在水里。此地热得远远超出想象，除非你想的是烘焙日里的烤炉。
        - id: ch01-b77
          speaker: narrator
          text: 所有人立刻脱下伦敦十一月的外衣。安西娅给小羊羔脱去蓝色强盗外套、三角帽和毛衣。小家伙忽然自己滑出蓝色紧身裤，只穿一件白衬衫，热乎乎地站着，快活极了。
        - id: ch01-b78
          speaker: anthea
          text: 这里肯定比夏天的海边还暖和。夏天妈妈总让我们光脚走。
        - id: ch01-b79
          speaker: narrator
          text: 于是小羊羔的鞋、袜子和绑腿也脱掉了。他站在金黄柔滑的沙上，把粉红的小脚趾一个劲儿往里钻。
        - id: ch01-b80
          speaker: lamb
          text: 我是小白鸭鸭！会游水的小白鸭鸭！
          emotion: happy
        - id: ch01-b81
          speaker: narrator
          text: 他嘎嘎叫着扑进一汪水洼，溅起水花。
        - id: ch01-b82
          speaker: anthea
          text: 让他玩吧，不会伤着他的。哎呀，真热！
        - id: ch01-b83
          speaker: narrator
          text: 厨娘忽然睁眼尖叫，又闭眼叫了一声。等她再次睁开眼，终于开口了。
        - id: ch01-b84
          speaker: cook
          text: 哎哟，我的老天爷，这都是些什么？我看自己是在做梦。
          emotion: surprised
        - id: ch01-b85
          speaker: cook
          text: 嗯，这可是我做过最好的梦。明天我得查查解梦书。海边，树林，还有一张能坐的地毯，我活这么大从没见过！
        - id: ch01-b86
          speaker: cyril
          text: 你听好了，这不是梦。全是真的。
        - id: ch01-b87
          speaker: cook
          text: 可不是嘛！梦里的人个个都这么说。
        - id: ch01-b88
          speaker: robert
          text: 我告诉你，这就是真的！我可不说是怎么做到的，那是我们的秘密。谁叫你不肯走开做布丁，我们只好连你一起带来。希望你喜欢这儿。
        - id: ch01-b89
          speaker: narrator
          text: 罗伯特跺着脚，还故意朝其他人一个个用力眨眼。
        - id: ch01-b90
          speaker: cook
          text: 我还真喜欢，一点不假。既然是梦，我说什么都没关系。哪怕说完就没命，我也非说不可。你们是我这辈子见过最最气人的小害虫……
        - id: ch01-b91
          speaker: phoenix
          text: 冷静一点，我的好女人。
        - id: ch01-b92
          speaker: cook
          text: 好女人？你才是好女人呢。哎哟，我可真没见过！这才像个梦，连黄鸟都会讲话！我听说过这种事，可从没想到自己也能碰上。
          emotion: surprised
        - id: ch01-b93
          speaker: narrator
          text: 厨娘这才看清是谁在讲话。
        - id: ch01-b94
          speaker: cyril
          text: 行啦。你就在这里坐着，好好看看这个大好日子。你们几个，到这边开会！
        - id: ch01-b95
          speaker: narrator
          text: 孩子们沿海岸走到厨娘听不见的地方。她仍坐在那里，茫然又快活地笑着，像在梦里一样四处张望。
        - id: ch01-b96
          speaker: cyril
          text: 听着，我们得把地毯卷起来藏好，放在随时拿得到的地方。让小羊羔在这里待一上午，治好百日咳，我们去四处探查。要是岛上的野蛮人吃人，就赶快溜走，也把她带回去。要是不吃人，我们就把她留下。
        - id: ch01-b97
          speaker: jane
          text: 牧师不是说过，要善待仆人和动物吗？这样也算善待吗？
        - id: ch01-b98
          speaker: cyril
          text: 可她也没善待我们。
        - id: ch01-b99
          speaker: anthea
          text: 不管怎么说，最稳妥的还是把地毯留在那儿，让她坐着。也许能给她一个教训。反正她以为这是梦，回去以后说什么都没关系。
        - id: ch01-b100
          speaker: narrator
          text: 大家把多余的外套、帽子和围巾堆在地毯上。西里尔扛起已经健康快活的小羊羔，凤凰栖在罗伯特腕上，探险队向内陆出发了。
        - id: ch01-b101
          speaker: narrator
          text: 草坡很平整，树下却缠满藤蔓，还开着鲜艳奇异的花，很难通行。
        - id: ch01-b102
          speaker: robert
          text: 我们真该有一把探险家的斧头。圣诞节我要请爸爸送我一把。
        - id: ch01-b103
          speaker: narrator
          text: 开满香花的藤蔓从树上垂下来，像一道道帘幕。羽毛鲜亮的鸟儿从孩子们脸旁飞过。
        - id: ch01-b104
          speaker: phoenix
          text: 现在，请你们诚实回答。这里有没有一只鸟比我更漂亮？不用怕伤我的感情，我可是希望自己很谦虚的。
        - id: ch01-b105
          speaker: robert
          text: 一只都没有。它们谁也远远比不上你！
        - id: ch01-b106
          speaker: phoenix
          text: 我从不虚荣。不过我得承认，你证实了我自己的看法。我要飞一圈。
        - id: ch01-b107
          speaker: narrator
          text: 凤凰在空中盘旋片刻，又落回罗伯特腕上。
        - id: ch01-b108
          speaker: phoenix
          text: 左边有条路。
        - id: ch01-b109
          speaker: narrator
          text: 那里果然有路。孩子们沿小路穿过树林，走得又快又轻松。女孩子一路采花。小羊羔则郑重地请那些漂亮鸟鸟留意，他自己是一只会下真水、会把身上弄得湿湿的小白鸭。小路弯来绕去，周围始终是缠结的藤蔓和花丛。孩子们越走越深，小羊羔却始终快活。这一路，他连一次百日咳的声音也没发出来。
        - id: ch01-b110
          speaker: narrator
          text: 小路在缠结的花丛中弯来绕去。忽然，他们转过一个弯，来到林间空地。那里有许多尖顶小屋，一眼就看得出，是野蛮人的屋子。连最大胆的心也跳快了。万一他们真吃人呢？地毯可在很远的地方。
        - id: ch01-b111
          speaker: jane
          text: 我们是不是该回去了？现在就走吧。万一他们吃掉我们呢？
          emotion: fearful
        - id: ch01-b112
          speaker: cyril
          text: 别胡说，小猫咪。看，那边拴着一只山羊。有山羊，就说明他们不吃人。
        - id: ch01-b113
          speaker: robert
          text: 咱们继续走，就说自己是传教士。
        - id: ch01-b114
          speaker: phoenix
          text: 我真心劝你们别那么做。
        - id: ch01-b115
          speaker: robert
          text: 为什么？
        - id: ch01-b116
          speaker: phoenix
          text: 至少有一个理由，那不是真的。
        - id: ch01-b117
          speaker: narrator
          text: 他们正在空地边迟疑，一名高个男人忽然从小屋里走出来。他几乎没穿衣服，全身是深沉漂亮的古铜色，正像爸爸星期六带回来的菊花，手里还握着一支长矛。他身上只有眼白和牙齿是浅色的。阳光落在光亮的棕色皮肤上时，被照到的地方看起来也像白色。下次遇见这样一位浑身光亮、几乎没穿衣服的野蛮人，只要太阳正照着，你仔细看看，就会知道这话一点不错。
        - id: ch01-b118
          speaker: narrator
          text: 那个男人直直望着孩子们，他们却无处可藏。接着，男人大喊一声，听上去最像呜咯格里巴格哇格，跟孩子们听过的任何声音都不一样。顿时，一个个古铜色的人从每间小屋跳出来，像蚂蚁一样涌满空地。已经没时间商量了，反正谁也不想商量。他们究竟吃不吃人，好像忽然也不重要了。
        - id: ch01-b119
          speaker: narrator
          text: 四个孩子片刻也没有犹豫，马上转身，沿着林中小路往回飞奔。只有安西娅稍微停了一下。她站到一旁，先让肩上扛着小羊羔的西里尔跑过去。小羊羔一点也不害怕，反而高兴得尖叫起来。自从地毯把他送上这座岛，他一次百日咳也没犯过。
        - id: ch01-b120
          speaker: lamb
          text: 驾，松鼠！驾，驾！
          emotion: happy
        - id: ch01-b121
          speaker: narrator
          text: 西里尔果然飞奔起来。这条小路比来时爬满藤蔓的路快得多。转眼间，大家便透过树林，看见沙滩和海水闪耀的蓝光、金光与蛋白石色彩。
        - id: ch01-b122
          speaker: cyril
          text: 坚持住！
        - id: ch01-b123
          speaker: narrator
          text: 他们一路冲下沙滩。奔跑时，身后传来密密麻麻的脚步。不用回头也知道，那些脚全是古铜色的。可是金光闪闪、泛着蛋白石色彩的沙滩上，竟然空空荡荡。这里只有一圈圈热带海藻、富丽堂皇的热带贝壳，还有伏在水边晒太阳的笨重海龟。那种漂亮贝壳若放到肯蒂什镇路，一对至少卖十五便士。可孩子们现在要找的厨娘、厚衣服和地毯，却全都不见了。
        - id: ch01-b124
          speaker: cyril
          text: 往前跑，下海！他们准讨厌水。我听说，野蛮人总是很脏。
        - id: ch01-b125
          speaker: narrator
          text: 西里尔上气不接下气，还没把话说完，大家已经冲进温暖的浅水，脚边溅起一片水花。平静得像婴儿的小浪，很容易就能穿过去。在热带为了逃命而奔跑，实在是件很热的活儿，清凉海水碰到身上，舒服极了。他们越走越深，水渐渐淹到大家腋下，在个子最小的简那里，已经到了下巴。
        - id: ch01-b126
          speaker: phoenix
          text: 看，他们在指什么？
        - id: ch01-b127
          speaker: narrator
          text: 孩子们转身一看。西边一点的水面上，露出一颗熟悉的脑袋，头顶还戴着一只歪帽子。那正是厨娘的脑袋。不知为什么，野蛮人全都停在岸边，不肯下水。他们扯着嗓门七嘴八舌地高喊，还把古铜色的手指直直伸向厨娘，又好奇又兴奋地指个不停。孩子们用海水所允许的最快速度，匆匆朝她赶去。
        - id: ch01-b128
          speaker: robert
          text: 你到底为什么跑到这里来了？地毯呢？
        - id: ch01-b129
          speaker: cook
          text: 愿上天保佑你，地毯不在地上，就在我底下，在水里。我坐在太阳底下太热，只说了一句，真希望泡在一池冷水里。下一刻就到了这儿！这也是梦里的一段。
          emotion: happy
        - id: ch01-b130
          speaker: narrator
          text: 大家马上明白，幸亏地毯有头脑，把厨娘送进了最近也最大的浴池，也就是大海。要是它带她回卡姆登镇，硬塞进那间狭小闷热的浴室，可就糟透了。
        - id: ch01-b131
          speaker: phoenix
          text: 打扰一下。不过我看，这些棕色的人想要你们的厨娘。
        - id: ch01-b132
          speaker: jane
          text: 要把她吃掉吗？
          emotion: fearful
        - id: ch01-b133
          speaker: narrator
          text: 小羊羔正快活地用胖手胖脚拍水，溅了简满脸。她只勉强问出这句话。
        - id: ch01-b134
          speaker: phoenix
          text: 不大可能。谁会拿厨娘来吃？厨娘是雇来做事的，不是雇来吃的。他们想雇用她。
        - id: ch01-b135
          speaker: cyril
          text: 你怎么听得懂他们说话？
        - id: ch01-b136
          speaker: phoenix
          text: 就像亲吻自己的爪子一样容易。所有语言我都会说，也都能听懂。连你们厨娘的话也不例外，虽然她说得又难懂又不好听。只要知道诀窍，一切自然就会了。我建议你们把地毯拖上岸，也让货物登陆。我是说厨娘。相信我，他们现在不会伤害你们。
        - id: ch01-b137
          speaker: narrator
          text: 凤凰叫你相信它，你便不可能不信。孩子们马上抓住地毯四角，从厨娘身下把它拉出来。他们在渐渐变浅的水中慢慢拖着，终于把地毯铺回沙滩。厨娘跟着他们上岸，立刻又坐到地毯上。古铜色的当地人这时忽然变得异常谦卑。他们围住地毯，在彩虹与黄金交织的沙滩上脸朝下伏倒。最高的男人也保持这个难受的姿势开口讲话。简后来发现，他花了很长时间才把嘴里的沙子吐干净。
        - id: ch01-b138
          speaker: phoenix
          text: 他说，他们想永远雇用你们的厨娘。
        - id: ch01-b139
          speaker: anthea
          text: 不用看她的品行证明吗？
        - id: ch01-b140
          speaker: phoenix
          text: 他们不是请她做厨娘，是请她做女王。女王不需要品行证明。
        - id: ch01-b141
          speaker: narrator
          text: 大家屏住呼吸，安静了一会儿。
        - id: ch01-b142
          speaker: cyril
          text: 好家伙，这么多人不选，偏偏选她！不过各人的口味，还真没法解释。
        - id: ch01-b143
          speaker: narrator
          text: 一想到厨娘受聘当女王，大家实在忍不住，全笑了起来。
        - id: ch01-b144
          speaker: phoenix
          text: 我劝你们别笑。这也不是他们自己选的。这个部族有个古老预言。总有一天，一位伟大的女王会从海里升起来，头戴白色王冠，而且……而且……你们看，王冠不就在那儿吗？
        - id: ch01-b145
          speaker: narrator
          text: 凤凰抖开湿透的金羽毛，用爪子指着厨娘那顶帽子。一星期已经到了末尾，帽子实在很脏。
        - id: ch01-b146
          speaker: phoenix
          text: 那就是白色王冠。至少还算白。跟他们的肤色相比，简直白得不得了。无论如何，已经足够白了。
        - id: ch01-b147
          speaker: cyril
          text: 听着！这些棕色的人要请你做女王。他们只是野蛮人，不懂事。你真愿意留下吗？只要你答应回家以后不再那么讨人厌，也不泄露今天的一个字，我们就带你回卡姆登镇。
        - id: ch01-b148
          speaker: cook
          text: 休想。我一直想当女王，愿上帝保佑女王！我也一直觉得，自己准会是个好女王。如今总算要当上了。哪怕只在梦里，也完全值得。我才不回那间讨厌的地下厨房，什么事都要怪我。只要梦还没完，只要那只讨厌的铃铛没有叮叮当当地把我吵醒，我就绝不回去。我把话放在这儿。
        - id: ch01-b149
          speaker: anthea
          text: 凤凰，你肯定她留在这里很安全吗？
        - id: ch01-b150
          speaker: phoenix
          text: 她会发现，女王的巢穴是个极其珍贵柔软的地方。
        - id: ch01-b151
          speaker: cyril
          text: 喏，你听见了。有极其珍贵柔软的好日子等着你。厨娘，那你可得做个好女王。你本来不配得到这么多，不过还是祝你万岁。
        - id: ch01-b152
          speaker: narrator
          text: 几个古铜色的臣民从树林里走来，双手捧着长长的花环。那些花洁白芬芳，美得叫人看不够。他们走到新君主面前，毕恭毕敬地把一条条花环挂在她的颈上。
        - id: ch01-b153
          speaker: cook
          text: 什么！这么多漂亮花束，全都给我？哎呀，这才真像一场梦呢！
          emotion: happy
        - id: ch01-b154
          speaker: narrator
          text: 厨娘挺直身子坐在地毯上。古铜色的人也把最鲜艳的花环缠到自己身上，又发狂似的往头发里插满鹦鹉羽毛，接着跳起舞来。你从没看过那样的舞。那些舞步小巧、古怪，又像任何地方都不会有的样子。孩子们一直看着，看着，最后几乎相信厨娘说对了，他们真的全在做梦。
        - id: ch01-b155
          speaker: narrator
          text: 形状小巧又古怪的鼓咚咚响起来，听来十分陌生的歌声也跟着唱起。舞步越来越快，也越来越奇怪。舞者不停地跳，不停地转，直到最后，每个人都精疲力竭，倒在沙滩上。新女王还坐在地毯上，头顶那只白王冠帽已经歪到一边。她看得兴高采烈，举起双手拼命鼓掌。
        - id: ch01-b156
          speaker: cook
          text: 好哇！好哇！比肯蒂什镇路的阿尔伯特·爱德华音乐厅还精彩。再来一遍！
          emotion: happy
        - id: ch01-b157
          speaker: narrator
          text: 凤凰却不肯替她翻译这个要求。等舞者喘过气，便恳求女王离开白色随从，跟他们回小屋。
        - id: ch01-b158
          speaker: islander
          text: 女王啊，请跟我们回去。最好的一间屋子将属于您。
        - id: ch01-b159
          speaker: narrator
          text: 凤凰把请求译给了厨娘。她吃力地站起来。
        - id: ch01-b160
          speaker: cook
          text: 好吧，再会啦！厨房和阁楼从此跟我没关系了，多谢你们。我要去自己的王宫啦。只盼这场梦永远、永远别结束。
          emotion: happy
        - id: ch01-b161
          speaker: narrator
          text: 她弯腰捡起拖在脚边的花环末端，准备跟臣民离开。孩子们最后看了一眼她的条纹长袜，还有那双两侧装着松紧带的旧靴子。随后，她走进树林，渐渐消失在森林的阴影里。肤色黝黑的随从紧紧簇拥着新女王，一路唱着欢乐的歌，把她送往自己的王宫。
        - id: ch01-b162
          speaker: cyril
          text: 好家伙！我想她应该不会有事。不过不管怎样，那些人好像根本没把我们放在眼里。
        - id: ch01-b163
          speaker: phoenix
          text: 哦，他们以为你们只是梦。预言说，女王会头戴白冠，从海浪里升起，身边围着白色的梦中孩子。他们大概就把你们当成那些孩子了。
        - id: ch01-b164
          speaker: robert
          text: 那晚饭怎么办？
        - id: ch01-b165
          speaker: anthea
          text: 厨娘没了，布丁盆也没了，当然不会有晚饭。不过面包和黄油总还有。
        - id: ch01-b166
          speaker: cyril
          text: 咱们回家吧。
        - id: ch01-b167
          speaker: narrator
          text: 小羊羔拼命不肯再穿那些暖和衣服。安西娅和简还是想尽办法替他穿好了。她们用的是伪装成哄劝的强力。他一次百日咳都没发作。
        - id: ch01-b168
          speaker: narrator
          text: 每个人都穿回自己的厚衣服，在地毯上坐定。树林另一边仍传来粗野的歌声。古铜色的当地人正在低声吟唱，向那位头戴白冠的女王表达仰慕和敬爱。接着，安西娅像公爵夫人或其他贵人吩咐马车夫一样，说了声回家。聪明的地毯立刻旋转起来。刹那间，它便在育儿室地板原来的位置铺得平平整整。恰好就在这一刻，伊莱扎打开了门。
        - id: ch01-b169
          speaker: eliza
          text: 厨娘不见了！我哪儿都找不到她，晚饭也没做。她没拿箱子，也没带出门的衣服。我看她只是出去看看时间，厨房那只钟她从来就不满意。也许她被车轧了，或者突然发病，倒在哪儿了。你们晚饭只能凑合吃冷熏肉。还有，你们为什么全穿着出门的衣服，我可一点也不明白。待会儿我得溜出去一趟，到警察局问问有没有她的消息。
        - id: ch01-b170
          speaker: narrator
          text: 从那以后，再也没有人知道厨娘的消息。除了这几个孩子，以及后来又去看过她的另一个人。
        - id: ch01-b171
          speaker: narrator
          text: 妈妈因为厨娘失踪，既心烦意乱，又万分担忧。安西娅也难过极了，仿佛自己真的做了什么非常坏的事。那天夜里，她醒了好几回。最后，她终于决定去求凤凰准许，把整件事原原本本告诉妈妈。可第二天，她一直没有机会说。凤凰照旧躲到某个偏僻角落睡觉去了。临睡前，它还特意请求大家，在接下来的二十四小时里不要打扰它。
        - id: ch01-b172
          speaker: narrator
          text: 整个星期日，小羊羔一次百日咳也没犯。爸爸妈妈都说，医生给他的药真有效。孩子们却知道，真正治好他的，是那片不会得百日咳的南方海岸。小羊羔还咿咿呀呀地说起彩色的沙子和海水，可是谁也没理他。毕竟，他常常谈起一些从来没有发生过的事情，大人早就习惯不当真了。
        - id: ch01-b173
          speaker: narrator
          text: 星期一一大早，天还没亮透，安西娅醒来，忽然下定决心。她穿着睡衣悄悄下楼，天气冷极了。她坐上地毯，心怦怦直跳，许愿去那片不会得百日咳的阳光海岸。下一刻，她已经到了。
        - id: ch01-b174
          speaker: narrator
          text: 沙子暖得美妙，隔着地毯，安西娅也立刻感觉到了。她把地毯仔细叠好，像披肩一样搭在肩头。不管披着它有多热，她都下定决心，片刻也不让地毯离开自己。接着，她微微发着抖，一遍又一遍告诉自己，这是我的责任，真的是我的责任。她努力用这句话给自己壮胆，然后独自沿着林间小路，一步一步向前走去。
        - id: ch01-b175
          speaker: cook
          text: 嗯，你又来啦。这个梦可真没完！
        - id: ch01-b176
          speaker: narrator
          text: 厨娘身穿一件白袍，没穿鞋袜，也没有戴帽子。她坐在一张棕榈叶做成的屏风下面，头顶戴着花环。几个古铜色的男孩子站在她身旁，正用孔雀羽毛替她扇风。岛上此时已经是下午，天气热得像火烧一样。
        - id: ch01-b177
          speaker: cook
          text: 他们把我的帽子收起来了，看得可重呢。我猜，他们从前没见过那样的帽子。
        - id: ch01-b178
          speaker: anthea
          text: 你幸福吗？
        - id: ch01-b179
          speaker: narrator
          text: 安西娅问得又认真又焦急。亲眼看见厨娘真的坐在那里当女王，她实在太惊讶了，几乎连气也喘不过来。
        - id: ch01-b180
          speaker: cook
          text: 那还用问吗，亲爱的？除非自己愿意，否则什么事也不用做。不过我现在已经歇够了。要是这个梦明天还继续，我就亲自动手，把他们的小屋一间间打扫干净，再好好教他们怎么做饭。他们现在做饭可不行，只要不是生着吃，就一定会把东西烧成焦炭。
          emotion: happy
        - id: ch01-b181
          speaker: anthea
          text: 可你能跟他们讲话吗？
        - id: ch01-b182
          speaker: cook
          text: 哎哟，我的小宝贝，当然能！学起来容易极了。我早就觉得自己学外语一定很快。现在我已经教会他们听懂晚饭、我要喝东西，还有别来烦我。
          emotion: happy
        - id: ch01-b183
          speaker: anthea
          text: 那么，你什么也不需要吗？
        - id: ch01-b184
          speaker: cook
          text: 我什么都不要，小姐。只求你快走。我怕你一直留在这里跟我说话，我就会醒过来，又听见那只铃铛响个没完。只要这个梦继续，我就像女王一样幸福。
        - id: ch01-b185
          speaker: anthea
          text: 那么，再见。
          emotion: happy
        - id: ch01-b186
          speaker: narrator
          text: 安西娅终于问心无愧，快活地告了别。她急忙转身走进树林，扑倒在地毯上，说了声回家。话音刚落，周围的一切便旋转起来。转眼间，她已经回到育儿室地板上，整个人被地毯卷在里面。
        - id: ch01-b187
          speaker: anthea
          text: 不管怎样，她过得很好。至少有人很满意，我真高兴。可就算告诉妈妈，她也绝不会相信。
        - id: ch01-b188
          speaker: narrator
          text: 这个故事的确有点难以相信。不过，你不妨试试看。
