  chapters:
    - id: ch01
      title: THE QUEEN COOK
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The children made their first glorious journey on the wishing carpet on a Saturday. So the next day, as anyone old enough to read will know, was Sunday.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Sunday at number eighteen, Camden Terrace, was always rather lovely. Father brought flowers home on Saturdays, and in November they were yellow and copper chrysanthemums. They made the breakfast table especially beautiful. Breakfast itself brought sausages on toast, a joy after six days of Kentish Town Road eggs at fourteen for a shilling.

            That Sunday there were chickens for dinner, though chickens usually appeared only on birthdays and grand occasions. Then came angel pudding, made of rice and milk and oranges and white icing, all doing their best to make you happy.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Father had worked hard all week, and after dinner he was terribly sleepy. Still, he refused to listen to the voice telling him to rest for an hour. Instead, he held the Lamb, whose dreadful cough was certainly whooping cough according to Cook.
        - id: ch01-b04
          speaker: father
          text: >-
            Come along, children. I've brought home a splendid library book called The Golden Age. I'll read it aloud.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Mother settled on the drawing-room sofa and said she could listen perfectly well with her eyes closed. The Lamb tucked himself snugly into the armchair-shaped corner of Father's arm. The other children made a happy heap on the hearthrug. At first there seemed to be far too many knees, feet, elbows, and shoulders for anyone to be comfortable. Little by little, all those limbs found places, and real comfort began to settle over them. Even the Phoenix and the carpet had been put away on the highest shelf of their minds, like beautiful playthings ready to be brought down and enjoyed later.

            Then a hard, unfriendly knock struck the door. It opened just one angry inch, and Cook spoke through the gap.
        - id: ch01-b06
          speaker: cook
          text: >-
            Please, ma'am, may I speak to you for a moment?
        - id: ch01-b07
          speaker: narrator
          text: >-
            Mother gave Father a desperate look. Then she lowered her pretty sparkling Sunday shoes from the sofa, stood up, and sighed.
        - id: ch01-b08
          speaker: father
          text: >-
            There are as good fish in the sea.
        - id: ch01-b09
          speaker: narrator
          text: >-
            He said it cheerfully, though it was years before the children understood what he meant. Mother went out into the passage that everyone called the hall. The umbrella stand was there, and so was a picture of the Monarch of the Glen in a shiny yellow frame. Brown damp spots marked the Monarch, left over from the house where the family had lived before.

            Cook stood waiting there, growing redder and damper every moment. A clean apron had been tied crookedly over the dirty one she had worn while serving those dear, delicious chickens. She kept winding one corner of the apron tightly around her fingers. Then she spoke in a fierce, clipped voice.
        - id: ch01-b10
          speaker: cook
          text: >-
            If you please, ma'am, I want to give a month's notice and leave.
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: >-
            Mother leaned against the hatstand. Through the crack in the door, the children saw her turn pale. She had been very kind to Cook and had given her a holiday only the day before. It seemed most unkind to threaten to leave now, and on a Sunday too.
        - id: ch01-b12
          speaker: mother
          text: >-
            Why? What has happened?
        - id: ch01-b13
          speaker: cook
          text: >-
            It's those children. That new carpet in their room is thick with horrible yellow mud on both sides, and goodness knows where they found it. I'm expected to clean all that filth on a Sunday! It isn't my work, and I won't pretend it is. If it weren't for those little terrors, this wouldn't be a bad place. I wouldn't want to leave, but—
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: >-
            Somehow, the children had known from the start that they were the trouble. They could not remember doing anything specially wrong, but displeasing a cook is terribly easy.
        - id: ch01-b15
          speaker: mother
          text: >-
            I'm very sorry. I'll speak to the children. Think it over, and if you truly want to leave, tell me tomorrow.
          emotion: calm
        - id: ch01-b16
          speaker: narrator
          text: >-
            The next day, Mother spoke quietly with Cook. Cook agreed to stay a little longer and see how things went.

            Meanwhile, Father and Mother had carefully examined the muddy carpet. Jane honestly explained that the mud came from the bottom of a foreign tower where treasure lay buried. Her explanation was true, but they received it with such cold disbelief that the others did not try to explain at all. They only said they were sorry and promised not to do it again.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Father said that children who covered both sides of a carpet with thick mud, then answered questions with silly nonsense, were not fit to have a carpet. Mother agreed, because mothers have to agree with fathers, and not because it was her own idea. The carpet would be taken away for a whole week.

            It was brushed with tea leaves, which was Anthea's only comfort. Then it was folded into the cupboard at the top of the stairs, and Father put the key in his trouser pocket.
        - id: ch01-b18
          speaker: father
          text: >-
            You may have it back on Saturday.
        - id: ch01-b19
          speaker: anthea
          text: >-
            Never mind. We still have the Phoenix.
        - id: ch01-b20
          speaker: narrator
          text: >-
            But they did not have the Phoenix. The bird was nowhere to be found. The rosy, wild beauty of magical happenings suddenly faded into the damp brown dullness of an ordinary November in Camden Town. The nursery looked especially dreary without its carpet. Bare boards showed in the middle, with brown oilcloth around the edges. That bare yellow floor made the black beetles horribly easy to see when they came out each evening, as usual, and tried to be friendly with the children. The poor beetles may have meant well, but the children never returned the feeling.

            Sunday ended gloomily. Even junket served in the blue Dresden bowl could hardly cheer them. On Monday the Lamb's cough grew worse and sounded very whoopy indeed, so the doctor came in his carriage.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Everyone tried to bear the sorrow of having the wishing carpet locked away and the Phoenix missing. They spent a great deal of time searching for the bird.
        - id: ch01-b22
          speaker: anthea
          text: >-
            It always keeps its word. I know it hasn't left us. Remember how far it flew, all the way from wherever it was to somewhere near Rochester and back. The poor thing must be worn out and resting. I'm sure we can trust it.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The others tried to be sure as well, but it was difficult. None of them felt kindly toward Cook. After all, her fuss over a little foreign mud was the whole reason the carpet had been taken away.
        - id: ch01-b24
          speaker: jane
          text: >-
            She could have told us first. Panther and I would have cleaned it with tea leaves.
        - id: ch01-b25
          speaker: robert
          text: >-
            She's a bad-tempered cat.
        - id: ch01-b26
          speaker: anthea
          text: >-
            I won't say what I think of her. That would be speaking evil, lying, and slandering.
        - id: ch01-b27
          speaker: cyril
          text: >-
            It isn't lying to call her a nasty pig and a beastly blue-nosed Bozwoz.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Cyril had read The Eyes of Light. He meant to speak like Tony as soon as he could train Robert to speak like Paul. Even Anthea agreed with the others that, blue-nosed Bozwoz or not, they wished Cook had never been born.

            Still, I ask you to believe that they did not deliberately do all the things that annoyed her during the following week. I dare say those things might not have happened if Cook had been a favorite. Yet the children did not plan them for the purpose of tormenting her. That is a mystery. Explain it if you can.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Here is the complete record. On Sunday, Cook discovered foreign mud thickly coating both sides of the new carpet.

            On Monday, Anthea put liquorice and aniseed balls into a saucepan to boil. She had done it only because she hoped the mixture would help the Lamb's cough. Then everyone forgot about it. The saucepan boiled dry, and its bottom burned right through. Unfortunately, it was the small white-lined saucepan kept specially for the baby's milk.

            On Tuesday, they found a dead mouse in the pantry. A dead mouse plainly needed a grave, so they took the fish slice to dig one. By a regrettable accident, the fish slice broke. Their defence was that Cook should not have kept dead mice in the pantry.
        - id: ch01-b30
          speaker: narrator
          text: >-
            On Wednesday, Cook left chopped suet on the kitchen table. Robert added a quantity of chopped soap. He insisted that he had mistaken the suet for soap as well.

            On Thursday, the children played a perfectly fair game of bandits in the area outside the house. During the game, someone fell against the kitchen window and broke it.

            On Friday, they stopped the kitchen sink's grating with putty. They filled the sink with water to make a lake where their paper boats could sail. Then they went away and left the tap running. Water overflowed, and both Cook's shoes and the kitchen hearthrug were ruined.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The carpet came back on Saturday. The children had spent the week deciding where to ask it to carry them.

            Mother had gone to Grandmother's without the Lamb because his cough was bad. Cook kept saying it was whooping cough as surely as eggs were eggs.
        - id: ch01-b32
          speaker: anthea
          text: >-
            We'll take the darling somewhere you can't have whooping cough. Don't be silly, Robert. If he talks about the journey, no one will listen. He is always describing things he has never seen.
        - id: ch01-b33
          speaker: narrator
          text: >-
            They dressed themselves and the Lamb in outdoor clothes. The Lamb chuckled and coughed, then laughed and coughed again. The boys moved every chair and table off the carpet while Jane held him. Anthea made one last frantic search through the house for the missing Phoenix. At last she hurried back into the breakfast room, quite breathless.
        - id: ch01-b34
          speaker: anthea
          text: >-
            We can't wait for it. But I know it hasn't abandoned us. It keeps its word.
        - id: ch01-b35
          speaker: phoenix
          text: >-
            Precisely.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The Phoenix's gentle voice came from beneath the table. Everyone dropped to their knees and looked up. There it sat on the wooden crossbar that had once supported a drawer. The drawer had later become a boat, until Robert's Really Reliable School Boots trod through its bottom.
        - id: ch01-b37
          speaker: phoenix
          text: >-
            I have been here all along. If you wanted me, you should have recited the ode of invocation. It is seven thousand lines long, composed in the purest and most beautiful Greek.
        - id: ch01-b38
          speaker: narrator
          text: >-
            It politely hid a yawn behind one claw.
        - id: ch01-b39
          speaker: anthea
          text: >-
            Couldn't you give it to us in English?
        - id: ch01-b40
          speaker: jane
          text: >-
            Seven thousand lines is rather long. Couldn't you make a short English version, like Tate and Brady?
        - id: ch01-b41
          speaker: robert
          text: >-
            Oh, come along, do. Come along, good old Phoenix.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Robert held out his hand.
        - id: ch01-b43
          speaker: phoenix
          text: >-
            Good old beautiful Phoenix.
        - id: ch01-b44
          speaker: robert
          text: >-
            Good old beautiful Phoenix, then. Come along!
        - id: ch01-b45
          speaker: narrator
          text: >-
            The Phoenix flew straight onto his wrist.
        - id: ch01-b46
          speaker: phoenix
          text: >-
            This charming young man has somehow compressed all seven thousand Greek lines into a single English hexameter. A few words are misplaced, perhaps. "Oh, come along, come along, good old beautiful Phoenix!" It is not perfect, but for a boy of his age, it is remarkably good.
        - id: ch01-b47
          speaker: robert
          text: >-
            Right, then.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Robert stepped backward onto the carpet with the golden bird perched on his wrist. Jane sat down with the baby in her lap.
        - id: ch01-b49
          speaker: jane
          text: >-
            You look like the King's falconer.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Robert tried to keep looking like one. Cyril and Anthea joined them on the carpet.
        - id: ch01-b51
          speaker: cyril
          text: >-
            We must be home before dinner, or Cook will tell on us.
        - id: ch01-b52
          speaker: anthea
          text: >-
            She hasn't told since Sunday.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Robert began to answer. At that moment the door burst open. Cook swept in like a furious whirlwind and planted one foot on the corner of the carpet. In one hand she carried a broken basin. The other was clenched around a threat.
        - id: ch01-b54
          speaker: cook
          text: >-
            Now look here! My only basin! What in the world am I supposed to use for the beefsteak and kidney pudding your mother ordered for dinner? You don't deserve any dinner at all.
          emotion: angry
        - id: ch01-b55
          speaker: anthea
          text: >-
            I'm terribly sorry, Cook. It was my fault, and I forgot to tell you. We broke it while we were telling fortunes with melted lead. I truly meant to tell you.
        - id: ch01-b56
          speaker: cook
          text: >-
            Meant to tell me! Well, I mean to tell too. I've held my tongue all week because your mother said we couldn't expect old heads on young shoulders. But I won't hold it any longer. You put soap in our pudding, and Eliza and I never breathed a word to your mother, though we had every right. Then there was the saucepan and the fish slice and—Merciful heavens! Why is that precious child dressed to go outdoors?
          emotion: angry
        - id: ch01-b57
          speaker: anthea
          text: >-
            We aren't taking him out. At least—
        - id: ch01-b58
          speaker: narrator
          text: >-
            Truthful Anthea stopped. They did not mean to take the Lamb out along Kentish Town Road, but they certainly meant to take him somewhere else. It simply was not the kind of out Cook meant.
        - id: ch01-b59
          speaker: cook
          text: >-
            Out? I'll make certain you don't take him out!
        - id: ch01-b60
          speaker: narrator
          text: >-
            Cook snatched the Lamb from Jane. Anthea and Robert grabbed her skirt and apron.
        - id: ch01-b61
          speaker: cyril
          text: >-
            Listen. Will you please go away and make your pudding in a pie dish, or a flowerpot, or a hot-water can? Use anything!
        - id: ch01-b62
          speaker: cook
          text: >-
            I will not. I'm not leaving this precious little poppet here for you to give his death of cold to.
        - id: ch01-b63
          speaker: cyril
          text: >-
            I warn you solemnly. Beware, before it is too late.
        - id: ch01-b64
          speaker: cook
          text: >-
            Too late yourself, you little poppet. They won't take you outside, no they won't. And where did that yellow fowl come from?
        - id: ch01-b65
          speaker: narrator
          text: >-
            Cook pointed at the Phoenix. Even Anthea understood that if Cook did not lose her position, the children would lose theirs.
        - id: ch01-b66
          speaker: anthea
          text: >-
            I wish we were on a sunny southern shore where no one can have whooping cough.
        - id: ch01-b67
          speaker: narrator
          text: >-
            She spoke over the Lamb's frightened howls and Cook's solid scolding. At once the whole group felt the dizziness of a spinning roundabout mixed with a falling lift. Cook dropped flat onto the carpet. She held the screaming Lamb tightly against her stout, print-covered body and begged Saint Bridget to save her.

            When the world stopped turning upside down, Cook opened her eyes, gave one enormous shriek, and closed them again. Anthea seized the chance to take the desperately howling Lamb.
        - id: ch01-b68
          speaker: anthea
          text: >-
            It's all right. Your own Panther has you. Look at the trees and sand and shells! Look at those enormous tortoises. Oh, it is so hot!
        - id: ch01-b69
          speaker: narrator
          text: >-
            It truly was hot. The faithful carpet had spread itself on a southern shore that was thoroughly sunny, as Robert observed. The greenest green slopes rose toward splendid groves. Palm trees grew there, along with all the tropical flowers and fruits the children had read about in Westward Ho! and Fair Play, everything flourishing together in marvelous richness.

            Between the vivid green slope and the deep blue sea lay a wide band of sand. It looked like jeweled cloth of gold. This was nothing like the grayish sand of northern shores. It gleamed yellow and changed into opal colors, as though sunshine and rainbows lived inside it. Just as the carpet stopped its wild spinning, blinding, deafening, upside-down tumble, the children saw three great living turtles waddle to the water's edge and disappear beneath the sea. The heat was beyond imagining unless you have stood beside an oven on baking day.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Everyone instantly tore off the heavy clothes meant for a London November. Anthea removed the Lamb's blue highwayman's coat, his three-cornered hat, and his jersey. Then the Lamb wriggled right out of his tight blue breeches and stood happily in his little white shirt.
        - id: ch01-b71
          speaker: anthea
          text: >-
            This is much warmer than the seaside in summer, and Mother always lets us go barefoot there.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Off came the Lamb's shoes, socks, and gaiters. He pressed his bare pink toes into the smooth golden sand.
        - id: ch01-b73
          speaker: lamb
          text: >-
            I'm a little white duck-dickie! A little white duck-dickie that swims!
          emotion: happy
        - id: ch01-b74
          speaker: narrator
          text: >-
            He quacked and splashed into a sandy pool.
        - id: ch01-b75
          speaker: anthea
          text: >-
            Let him. It can't hurt him. Oh, this heat!
        - id: ch01-b76
          speaker: narrator
          text: >-
            Cook suddenly opened her eyes and screamed. She shut them, screamed once more, then opened them again.
        - id: ch01-b77
          speaker: cook
          text: >-
            Well, drat my cats, what is all this? I suppose it's a dream. It's the best dream I've ever had, anyway. I'll look it up in the dream book tomorrow. The seaside, trees, and a carpet to sit on! Well, I never!
          emotion: surprised
        - id: ch01-b78
          speaker: cyril
          text: >-
            Listen, this isn't a dream. It is real.
        - id: ch01-b79
          speaker: cook
          text: >-
            Oh, certainly. People always say that in dreams.
        - id: ch01-b80
          speaker: robert
          text: >-
            It is real! I won't explain how we did it, because that is our secret. But you refused to go make the pudding, so we had to bring you. I hope you like it.
        - id: ch01-b81
          speaker: narrator
          text: >-
            Robert stamped his foot and winked heavily at each of the other children.
        - id: ch01-b82
          speaker: cook
          text: >-
            I like it very much. Since it's only a dream, nothing I say matters. So I'll say this, even if it's my last word. Of all the troublesome little varmints—
        - id: ch01-b83
          speaker: phoenix
          text: >-
            Calm yourself, my good woman.
          emotion: calm
        - id: ch01-b84
          speaker: cook
          text: >-
            Good woman indeed! You're a good woman yourself.
        - id: ch01-b85
          speaker: narrator
          text: >-
            Then she noticed who had spoken.
        - id: ch01-b86
          speaker: cook
          text: >-
            Well, I never! Now this is a proper dream. A talking yellow fowl! I've heard of such things, but I never thought I'd live to see one.
          emotion: surprised
        - id: ch01-b87
          speaker: cyril
          text: >-
            Then sit there and enjoy seeing it. It is a splendid day. Come on, everyone else. We need a council.
        - id: ch01-b88
          speaker: narrator
          text: >-
            They walked down the shore until Cook could not hear them. She remained on the carpet, gazing around with the happy, empty smile of a dreamer.
        - id: ch01-b89
          speaker: cyril
          text: >-
            We should roll up the carpet and hide it so we can reach it whenever we need it. The Lamb can spend the morning getting rid of his cough while we explore. If the islanders are cannibals, we'll run for it and take Cook home. If they aren't, we'll leave her here.
        - id: ch01-b90
          speaker: jane
          text: >-
            Is that being kind to servants and animals, like the clergyman told us?
        - id: ch01-b91
          speaker: cyril
          text: >-
            She isn't kind to us.
        - id: ch01-b92
          speaker: anthea
          text: >-
            Anyway, the safest plan is to leave the carpet under her. It might teach her a lesson. And if she thinks everything is a dream, it won't matter what she says when we get home.
        - id: ch01-b93
          speaker: narrator
          text: >-
            They piled the extra coats, hats, and mufflers on the carpet. Cyril lifted the happy, healthy Lamb onto his shoulders. The Phoenix settled on Robert's wrist, and the party of explorers prepared to go inland.
        - id: ch01-b94
          speaker: narrator
          text: >-
            The grassy slope was smooth. Beneath the trees, though, tangled vines and strange bright flowers made walking difficult.
        - id: ch01-b95
          speaker: robert
          text: >-
            A proper explorer needs an axe. I'll ask Father for one at Christmas.
        - id: ch01-b96
          speaker: narrator
          text: >-
            Curtains of vines hung from the trees, thick with scented blossoms. Brilliant birds flashed past, almost brushing the children's faces.
        - id: ch01-b97
          speaker: phoenix
          text: >-
            Now answer me honestly. Is any bird here more handsome than I am? You need not worry about my feelings. I hope I am a modest bird.
        - id: ch01-b98
          speaker: robert
          text: >-
            Not one of them comes close to you.
        - id: ch01-b99
          speaker: phoenix
          text: >-
            Vanity has never been one of my faults, but you have confirmed what I thought. I shall fly up and look around.
        - id: ch01-b100
          speaker: narrator
          text: >-
            It circled overhead, then returned to Robert's wrist.
        - id: ch01-b101
          speaker: phoenix
          text: >-
            There is a path on the left.
        - id: ch01-b102
          speaker: narrator
          text: >-
            There was. Now they moved through the woods much more easily. The girls gathered flowers. From Cyril's shoulders, the Lamb invited every pretty dickie to notice that he himself was a little white, real-water-wet duck.

            All this time, he did not whoop or cough once.
        - id: ch01-b103
          speaker: narrator
          text: >-
            The path turned one way and then another, always threading through a tangle of flowers. Suddenly, the children rounded a corner and stepped into a forest clearing. A great many pointed huts stood there. The moment they saw those huts, they decided that this must be the village of people they thought of as savages.

            Even the bravest heart among them began to beat faster. What if the people who lived there were cannibals? The children had come a long way from the carpet, and the twisted woodland path lay between them and safety.
        - id: ch01-b104
          speaker: jane
          text: >-
            Shouldn't we go back? Let's go now. What if they eat us?
          emotion: fearful
        - id: ch01-b105
          speaker: cyril
          text: >-
            Nonsense, Pussy. That goat is tied up. If they ate people, they wouldn't need goats.
        - id: ch01-b106
          speaker: robert
          text: >-
            We could go forward and tell them we're missionaries.
        - id: ch01-b107
          speaker: phoenix
          text: >-
            I strongly advise you not to do that.
        - id: ch01-b108
          speaker: robert
          text: >-
            Why not?
        - id: ch01-b109
          speaker: phoenix
          text: >-
            For one thing, it would not be true.
        - id: ch01-b110
          speaker: narrator
          text: >-
            While they hesitated at the clearing's edge, a tall man suddenly came out of one of the pointed huts. He wore hardly any clothes, and the skin all over his body was a dark, beautiful copper color, like the chrysanthemums Father had brought home on Saturday. He carried a spear. His teeth and the whites of his eyes were the only pale things about him. Yet wherever the sun struck his smooth brown skin, that gleamed almost white too.

            The man saw them. Hiding was impossible. He gave a shout that sounded more like "Oo goggery bag-wag" than anything the children had heard before.
        - id: ch01-b111
          speaker: islander_1
          text: >-
            Oo goggery bag-wag!
        - id: ch01-b112
          speaker: narrator
          text: >-
            Copper-colored people sprang from every hut and swarmed across the clearing like ants. There was no time to discuss whether they were cannibals. No one cared to discuss it now.

            All four children turned and raced back along the forest path. Anthea paused only to let Cyril pass because he carried the Lamb. The Lamb shrieked with delight. He had not coughed once since the carpet reached the island.
        - id: ch01-b113
          speaker: lamb
          text: >-
            Gee-up, Squirrel! Gee-gee!
          emotion: happy
        - id: ch01-b114
          speaker: narrator
          text: >-
            Cyril did gee-up. The path was shorter than their earlier route through the vines. Almost at once, the blue sea and the gold-and-opal sand flashed between the trees.
        - id: ch01-b115
          speaker: cyril
          text: >-
            Keep going!
        - id: ch01-b116
          speaker: narrator
          text: >-
            They kept going with all their strength. Behind them came the quick patter of many bare feet, and those feet were drawing nearer. The children knew only too well that the copper-colored islanders were chasing them.

            They burst out of the trees and onto the beach. The golden, opal-colored sand was bare. Wreaths of tropical seaweed lay here and there. Rich tropical shells scattered the shore, the sort you could never buy on Kentish Town Road for less than fifteen pence a pair. Great turtles basked in lumps at the water's edge. But there was no Cook. There were no clothes. Worst of all, there was no carpet.
        - id: ch01-b117
          speaker: cyril
          text: >-
            Go on, into the sea! They must hate water. I've heard that savages are always dirty.
        - id: ch01-b118
          speaker: narrator
          text: >-
            They splashed into the warm shallows before Cyril had enough breath to finish. The quiet little waves were easy to wade through. Running for your life in the tropics is hot work, so the water felt delicious. Soon it reached their armpits and came up to Jane's chin.
        - id: ch01-b119
          speaker: phoenix
          text: >-
            Look. What are they pointing toward?
        - id: ch01-b120
          speaker: narrator
          text: >-
            The children turned. A little way down the beach, a familiar head rose from the water with a crooked cap on top. It belonged to Cook.

            The islanders had stopped at the water's edge. They shouted at the tops of their voices and pointed excitedly at Cook's head. The children pushed through the water as quickly as they could.
        - id: ch01-b121
          speaker: robert
          text: >-
            Why did you come out here? And where is the carpet?
        - id: ch01-b122
          speaker: cook
          text: >-
            It isn't on the earth, bless you. It's in the water underneath me. I grew hot sitting in the sun, so I said, "I wish I was in a cold bath." The next moment, here I was. It's all part of the dream.
        - id: ch01-b123
          speaker: narrator
          text: >-
            Everyone saw how lucky they were that the carpet had chosen the nearest and largest bath, which was the sea. It might have carried Cook and itself back to the stuffy little bathroom in Camden Town.
        - id: ch01-b124
          speaker: phoenix
          text: >-
            Forgive me for interrupting, but I believe these people want your cook.
        - id: ch01-b125
          speaker: jane
          text: >-
            Do they want to eat her?
          emotion: fearful
        - id: ch01-b126
          speaker: narrator
          text: >-
            Jane whispered as well as she could while the Lamb happily kicked water into her face with his plump hands and feet.
        - id: ch01-b127
          speaker: phoenix
          text: >-
            Certainly not. Who would want cooks for eating? Cooks are engaged, not eaten. They want to engage her.
        - id: ch01-b128
          speaker: cyril
          text: >-
            How do you know what they're saying?
        - id: ch01-b129
          speaker: phoenix
          text: >-
            It is as easy as kissing your claw. I speak and understand every language. I even understand your cook's language, difficult and unpleasant though it is. Once you know how, it simply comes to you. I recommend bringing the carpet ashore and landing the cargo. By cargo, I mean Cook. Take my word for it. These people will not hurt you now.
        - id: ch01-b130
          speaker: narrator
          text: >-
            When a Phoenix gives its word, you cannot help trusting it. The children found the carpet's corners beneath the water. They pulled it out from under Cook, then slowly towed the heavy, dripping carpet through water that grew shallower with every step. At last they dragged it clear of the waves and spread it flat on the warm sand. Cook waded after them and immediately sat upon it.

            The islanders had become strangely humble. They formed a complete ring around the carpet, then fell flat on their faces upon the rainbow-and-gold beach. The tallest man began a long speech without getting up. Speaking with his mouth so near the ground must have been extremely awkward. Jane noticed afterward that it took him quite a long time to get all the sand out of his mouth.
        - id: ch01-b131
          speaker: phoenix
          text: >-
            He says that they wish to engage your cook permanently.
        - id: ch01-b132
          speaker: anthea
          text: >-
            Even without a character from her last employer?
        - id: ch01-b133
          speaker: phoenix
          text: >-
            They do not want her as their cook. They want her as their queen, and queens do not need characters.
        - id: ch01-b134
          speaker: narrator
          text: >-
            For one breathless moment, nobody spoke.
        - id: ch01-b135
          speaker: cyril
          text: >-
            Well! What a choice. Still, there is no explaining taste.
        - id: ch01-b136
          speaker: narrator
          text: >-
            Everyone burst out laughing at the thought of Cook becoming a queen. They could not help it.
        - id: ch01-b137
          speaker: phoenix
          text: >-
            I would not laugh if I were you. This is not merely their taste. Their tribe has an ancient prophecy. One day, a great queen will rise from the sea wearing a white crown. And, well, there is the crown.
        - id: ch01-b138
          speaker: narrator
          text: >-
            The Phoenix fluffed its dripping golden feathers and pointed at Cook's cap. By the end of the week, the cap was very dirty.
        - id: ch01-b139
          speaker: phoenix
          text: >-
            That is the white crown. It is almost white, and compared with their color it is extremely white. In any case, it is white enough.
        - id: ch01-b140
          speaker: cyril
          text: >-
            Listen, Cook. These people want you for their queen. They're only savages, so they don't know better. Would you honestly like to stay? If you promise to be less aggravating at home and never tell anyone about today, we'll take you back to Camden Town.
        - id: ch01-b141
          speaker: cook
          text: >-
            No, you won't! I've always wanted to be the Queen, God bless her, and I've always known what a good queen I would make. Now I shall be one. Even if it is only a dream, it is worth doing. I won't return to that nasty basement kitchen where everything is blamed on me. Not until the dream ends and I wake with that horrible bell ringing in my ears.
        - id: ch01-b142
          speaker: anthea
          text: >-
            Are you quite certain she'll be safe here?
        - id: ch01-b143
          speaker: phoenix
          text: >-
            She will discover that a queen's nest is a very precious and comfortable place.
        - id: ch01-b144
          speaker: cyril
          text: >-
            You heard that, Cook. You can expect something precious and comfortable. Be a good queen. It is more than you had any right to expect, but long may you reign.
        - id: ch01-b145
          speaker: narrator
          text: >-
            Several of Cook's new subjects came from the forest carrying long garlands of sweet white flowers. They respectfully hung them around their new queen's neck.
        - id: ch01-b146
          speaker: cook
          text: >-
            What, all those lovely bouquets for me? Now this is what I call a dream!
          emotion: happy
        - id: ch01-b147
          speaker: narrator
          text: >-
            Cook sat very straight upon the carpet beneath her garlands. The islanders crowned themselves with the brightest flowers and thrust parrot feathers wildly into their hair. Then they began a dance unlike anything the children had ever seen. The colors, movement, and strangeness of it almost convinced them that Cook was right and that the whole scene was a dream.

            Small drums of peculiar shapes beat out the time. The dancers sang odd-sounding songs as they wheeled around their queen. The dance grew faster, then faster still, and every moment it became stranger. At last all the dancers dropped onto the sand, completely worn out. Their new queen watched with her white crown-cap hanging to one side, and she clapped madly.
        - id: ch01-b148
          speaker: cook
          text: >-
            Bravo! Bravo! This is better than the Albert Edward Music Hall on Kentish Town Road. Do it again!
          emotion: happy
        - id: ch01-b149
          speaker: narrator
          text: >-
            The Phoenix refused to translate that request. Once the islanders recovered their breath, they asked their queen to leave her white escort and follow them to the village.
        - id: ch01-b150
          speakers: [islander_1, islander_2, islander_3]
          ensemble: chorus
          text: >-
            The finest hut shall belong to you, O Queen.
        - id: ch01-b151
          speaker: cook
          text: >-
            Well, goodbye! No more kitchens and attics for me, thank you. I'm going to my royal palace. I only wish this dream could last forever and ever.
        - id: ch01-b152
          speaker: narrator
          text: >-
            Cook heaved herself to her feet and gathered the flower garlands trailing around her. The children had one last glimpse of striped stockings and worn elastic-sided boots. Then she vanished into the forest shade, surrounded by her dark-skinned attendants, who sang songs of joy as they went.
        - id: ch01-b153
          speaker: cyril
          text: >-
            Well! I suppose she's safe enough, but they don't seem to care about us at all.
        - id: ch01-b154
          speaker: phoenix
          text: >-
            They believe you are only dreams. The prophecy says their queen will rise from the waves in a white crown, surrounded by white dream-children. That is how they see you.
        - id: ch01-b155
          speaker: robert
          text: >-
            What are we going to do about dinner?
        - id: ch01-b156
          speaker: anthea
          text: >-
            There can't be any dinner without Cook or the pudding basin. We can always have bread and butter.
        - id: ch01-b157
          speaker: cyril
          text: >-
            Let's go home.
        - id: ch01-b158
          speaker: narrator
          text: >-
            The Lamb was furiously unwilling to go back into his warm clothes. He twisted and protested while Anthea and Jane worked together. At last they dressed him by using force so cleverly disguised as coaxing that it almost seemed gentle. Through all the struggle, he never once gave a whooping cough.

            Then every child put on the rest of the warm London clothes and took a place on the carpet. From somewhere beyond the trees came the sound of rough, unfamiliar singing. The islanders were still crooning songs of admiration and respect to their white-crowned queen.
        - id: ch01-b159
          speaker: anthea
          text: >-
            Home.
        - id: ch01-b160
          speaker: narrator
          text: >-
            Anthea gave the order just as a duchess might speak to her coachman. In one whirling instant, the clever carpet laid itself in its proper place on the nursery floor.

            At that exact moment, Eliza opened the door.
        - id: ch01-b161
          speaker: eliza
          text: >-
            Cook has gone! I can't find her anywhere, and dinner isn't ready. She hasn't taken her box or her outdoor clothes. She may have run out to see the time, because the kitchen clock never suited her. Or she may have been run over or fallen down in a fit. You'll have to eat cold bacon for dinner. And why you're all wearing outdoor clothes, I cannot imagine. I'm going to slip out and ask at the police station whether they know anything about her.
        - id: ch01-b162
          speaker: narrator
          text: >-
            No one ever learned anything more about Cook, except the children and, later, one other person.

            Mother was deeply distressed by Cook's disappearance and could not stop worrying about what might have happened to her. Seeing that made Anthea feel wretched, as though she had done something terribly wrong indeed. Anthea woke several times during the night with the same troubled thought. At last she decided that she would ask the Phoenix to let her tell Mother the whole truth.
        - id: ch01-b163
          speaker: narrator
          text: >-
            The next day brought no chance to ask. As usual, the Phoenix had chosen some out-of-the-way hiding place and gone to sleep. Before disappearing, it had asked as a special favor not to be disturbed for twenty-four hours.

            The Lamb did not whoop or cough once during that whole Sunday. Mother and Father agreed that the doctor's medicine had done him a world of good. But the children knew better. They knew the sunny southern shore, the place where no one could have whooping cough, had cured him. The Lamb babbled about colored sand and water, but no one paid attention. He often talked about things he had never seen and events that had never happened.
        - id: ch01-b164
          speaker: narrator
          text: >-
            Very early on Monday morning, Anthea awoke with her mind made up. She crept downstairs in her nightgown, shivering in the cold. She sat on the carpet, her heart pounding, and wished herself back on the sunny shore where no one could have whooping cough.

            The next moment, she was there.
        - id: ch01-b165
          speaker: narrator
          text: >-
            Even through the carpet, the sand felt wonderfully warm. Anthea folded the carpet around her shoulders like a shawl. However hot it became, she was determined not to let it leave her for a moment.

            She trembled a little as she followed the forest path. To keep up her courage, she repeated the same words again and again.
        - id: ch01-b166
          speaker: anthea
          text: >-
            It is my duty. It is my duty.
        - id: ch01-b167
          speaker: cook
          text: >-
            Well, here you are again. This dream does go on and on!
        - id: ch01-b168
          speaker: narrator
          text: >-
            Cook spoke the instant she saw Anthea. On the island it was already afternoon, and the sun blazed with fierce heat. Cook sat in the shade beneath a screen made of palm leaves. She wore a white robe, but she had no shoes, no stockings, and no cap. A wreath of fresh flowers rested in her hair. Copper-colored boys stood around her and stirred the air with great fans of peacock feathers.
        - id: ch01-b169
          speaker: cook
          text: >-
            They've put my cap away. They think a great deal of it. I don't suppose they've ever seen one before.
        - id: ch01-b170
          speaker: anthea
          text: >-
            Are you happy here?
        - id: ch01-b171
          speaker: narrator
          text: >-
            Anthea was panting. Seeing Cook as a queen quite took her breath away.
        - id: ch01-b172
          speaker: cook
          text: >-
            I certainly am, my dear. I have nothing to do unless I choose. I'm nearly rested now, so tomorrow, if the dream continues, I'll start cleaning my hut. Then I'll teach these people to cook. At present, they either burn everything to a cinder or eat it raw.
          emotion: happy
        - id: ch01-b173
          speaker: anthea
          text: >-
            Can you speak their language?
        - id: ch01-b174
          speaker: cook
          text: >-
            Lord love a duck, yes! It's easy to learn. I always knew I'd be quick with foreign languages. I've already taught them to understand "dinner," "I want a drink," and "You leave me alone."
        - id: ch01-b175
          speaker: anthea
          text: >-
            Then there isn't anything you need?
        - id: ch01-b176
          speaker: narrator
          text: >-
            She asked the question with anxious earnestness.
        - id: ch01-b177
          speaker: cook
          text: >-
            Nothing, miss, except for you to go away. If you stay here talking, I'm afraid I'll wake up to that bell ringing. As long as this dream lasts, I am as happy as a queen.
        - id: ch01-b178
          speaker: anthea
          text: >-
            Then goodbye!
          emotion: happy
        - id: ch01-b179
          speaker: narrator
          text: >-
            Anthea could speak cheerfully now, because her conscience was clear. She hurried into the woods, threw herself onto the ground, and gave the carpet its command.
        - id: ch01-b180
          speaker: anthea
          text: >-
            Home.
        - id: ch01-b181
          speaker: narrator
          text: >-
            At once, she found herself wrapped inside the carpet on the nursery floor.
        - id: ch01-b182
          speaker: anthea
          text: >-
            At least she is all right. I'm glad someone is pleased. But Mother will never believe me when I tell her.
        - id: ch01-b183
          speaker: narrator
          text: >-
            Anthea went back to bed.

            The story is rather difficult to believe. Still, you might try.
