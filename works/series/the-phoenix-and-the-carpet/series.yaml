cover_prompt: |-
  A wordless cover scene in an Edwardian English nursery shows four siblings gathered around a newly hatched magical bird and a wishing carpet. A sturdy dark-haired older boy wears a Norfolk jacket, a practical girl has brown braids and a cream dress, a round-faced younger boy wears suspenders, and the smallest girl wears a blue pinafore. At the center, a bantam-sized bird with flame-colored plumage growing into brilliant gold rises from a split golden egg in the glowing nursery grate while the children stare in wonder. The worn carpet lifts one curling corner from the floor as if ready to carry them away, making the bird's fiery arrival the clear focal action. Use a low, wide view across the nursery, with the children and grate forming a strong lower triangle and generous calm wall and warm shadow at the top. Keep the furniture, clothing, and domestic setting faithful to England in 1904, make the magic joyful and non-frightening, and avoid any likeness to screen adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
