audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带一点英式童话的机智
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明自信，挖苦人时一本正经
        timbre: 清脆的少年声
        pace: 中等偏快
        pitch: 中高
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴敏锐，急切时仍然清楚
        timbre: 柔和明亮的少女声
        pace: 中等
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 坚持己见，认真里常带几分莽撞
        timbre: 结实清朗的少年声
        pace: 中等
        pitch: 中等
    jane:
      display_name: 简
      tts:
        delivery: 天真直率，话里带着小孩子的认真
        timbre: 稚嫩柔软的女孩声
        pace: 稍慢
        pitch: 偏高
    phoenix:
      display_name: 凤凰
      tts:
        delivery: 文雅自负，庄重中带着敏锐的幽默
        timbre: 华美清润，中性而成熟
        pace: 从容
        pitch: 中高
    policeman:
      display_name: 警察
      tts:
        delivery: 谨慎威严，询问时不容敷衍
        timbre: 浑厚结实的成年男声
        pace: 中等偏慢
        pitch: 中低
    burglar:
      display_name: 窃贼
      tts:
        delivery: 市井粗率，慌乱时语速急促，动情时朴实诚恳
        timbre: 沙哑厚重的成年男声
        pace: 中等偏快
        pitch: 中低
    eliza:
      display_name: 伊莱扎
      tts:
        delivery: 伶牙俐齿，辩解时又快又冲
        timbre: 明亮利落的年轻女声
        pace: 偏快
        pitch: 中高
    cook:
      display_name: 厨娘
      tts:
        delivery: 爽直泼辣，得意时热情大方
        timbre: 饱满有力的成年女声
        pace: 中等
        pitch: 中等
  chapters:
    - id: ch01
      title: 地毯的伤痕
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 波斯猫、麝鼠、母牛和那位不同寻常的窃贼，把前一夜闹得够呛。第二天，孩子们一直睡到十点，才只有西里尔一个醒来。他把其他人都叫起床，到十点半，四个人总算可以一同张罗早饭。屋里冷得发抖，能入口的东西也少得可怜。
        - id: ch01-b02
          speaker: narrator
          text: 罗伯特还惦记着不告而别的仆人，特意在厨房门上装了一个整齐又漂亮的恶作剧机关，要送她们一份体贴的小惊喜。前门的锁一响，四个孩子知道人回来了，马上钻进楼梯下的壁橱，兴高采烈地听着。外面先传来摔倒声，再是水泼开、手脚挣扎的声音，最后才轮到仆人们的叫骂。厨娘认定这是她们丢下房子不管遭了报应。听她的口气，恶作剧机关仿佛是一种植物，只要房子关起来没人住，它便会自己长出来。女佣倒机灵得多。她猜到一定有人进过屋，等她看见育儿室桌上的早餐餐具，这个猜想就更确定了。
        - id: ch01-b03
          speaker: narrator
          text: 楼梯下的壁橱又挤又闷，还有一股浓浓的石蜡油味。孩子们不敢出声，只能暗暗推挤，都想占到别人上面的位置。争着争着，壁橱门猛地迸开，把简一下吐了出去。她像只足球一样滚过地板，一直滚到仆人脚边。厨娘好容易不再歇斯底里地尖叫，女佣刚腾出空来数落他们，西里尔已经先板起了脸。
        - id: ch01-b04
          speaker: cyril
          text: 你们别想教训我们，我们知道的事情可不少。晚饭请做一份特别好的糖浆卷，再开一听牛舌。
        - id: ch01-b05
          speaker: eliza
          text: 想得倒美！西里尔少爷，别拿告状来吓唬我，我才不怕。太太听见我姻亲姑婆的事，只会可怜我。她从小把我养大，跟亲妈一样。昨晚她腿上痉挛，眼看就熬不过去了，特地派人叫我。厨娘心好，不放心我一个人去，所以才——
        - id: ch01-b06
          speaker: anthea
          text: 伊莱扎，别再说了。撒谎的人会去哪里，你应该知道。就算不知道——
        - id: ch01-b07
          speaker: eliza
          text: 我撒谎？我才不肯降身份跟你说话呢。
        - id: ch01-b08
          speaker: robert
          text: 威格森太太还好吗？昨晚你们一直玩到很晚吧？
        - id: ch01-b09
          speaker: narrator
          text: 伊莱扎顿时张口结舌。西里尔问她昨晚是和玛丽亚挤在一起，还是和艾米莉挤在一起。简又问，普罗瑟太太玩得开不开心。
        - id: ch01-b10
          speaker: cyril
          text: 好了，她们受得够多了。我们会不会告状，要看你们往后的表现。你们好好待我们，我们也好好待你们。糖浆卷记得做。伊莱扎，你也不妨破例打扫一次屋子。
        - id: ch01-b11
          speaker: narrator
          text: 仆人们这下彻底服了。早饭餐具收走以后，育儿室里只剩下孩子们。西里尔得意地说，人们总抱怨仆人难管，其实只要懂得方法，事情再简单不过。他相信自己已经压下了她们那股傲气。往后孩子们想做什么都行，两个仆人绝不敢告密。既然这样，何不马上坐地毯出去玩呢？
        - id: ch01-b12
          speaker: phoenix
          text: 我要是你，就不去。我暗示过你们一两回，如今看来，再遮掩也没用了。非把话说明白不可。
        - id: ch01-b13
          speaker: narrator
          text: 凤凰打着哈欠，从窗帘杆上的栖木俯冲下来，落在椅背上，像站在秋千上的鹦鹉一样前后摇摆。安西娅累得还没从昨夜那群猫的折腾里缓过来。她已经厌倦总有事情发生，因此开口时也不如平常那么温柔。
        - id: ch01-b14
          speaker: anthea
          text: 这回又出了什么事？我已经受够了。我哪儿也不去，只想补好自己的袜子。
        - id: ch01-b15
          speaker: phoenix
          text: 补袜子？这么年轻的嘴里，怎么会说出如此古怪的字眼！
        - id: ch01-b16
          speaker: anthea
          text: 那就说缝袜子吧，用针和毛线缝。
        - id: ch01-b17
          speaker: narrator
          text: 凤凰若有所思地把翅膀张开又合拢，这才请她仔细看看地毯。和眼前这件事相比，她的袜子根本没有那么要紧。地毯上已有许多地方磨得光秃，远处一只角还裂开一道大口子。它一直是孩子们忠诚的朋友，也是心甘情愿的仆人。它这样尽心服侍，他们又给了它什么回报呢？
        - id: ch01-b18
          speaker: anthea
          text: 亲爱的凤凰，别用这种训人的口气。你说得好像我犯了错。它本来就是许愿地毯，我们除了许愿，也没对它做别的呀。
        - id: ch01-b19
          speaker: phoenix
          text: 只是许愿？你们许的都是什么愿？连叫别人心情变好这种事，也推给一张地毯去做。你们踩得那么随便，它却从没退缩过。你们要求什么，它就完成什么，那得受多少磨损！昨晚的猫和麝鼠是它自己选的，我不怪你们。可哪张地毯经得住一头大母牛拴在一只角上？
        - id: ch01-b20
          speaker: robert
          text: 猫和麝鼠不是更糟吗？它们有那么多爪子。
        - id: ch01-b21
          speaker: phoenix
          text: 一共一万一千九百四十只爪子。想必你们也数过吧？要是没有留下痕迹，我才真会吃惊。
        - id: ch01-b22
          speaker: jane
          text: 天哪！你是说，地毯已经快磨坏了吗？
          emotion: surprised
        - id: ch01-b23
          speaker: narrator
          text: 简吃惊得猛地坐到地上，伸手轻轻抚摸地毯边缘。凤凰说，地毯跟着他们，过得一点也不安逸。它沾过两回法国泥，两回阳光海岸的沙，泡过一回南方的海水，到过一回印度，也去过波斯一个只有老天知道的地方。它还去过麝鼠国，又被拴着去过母牛原先住的地方。凤凰请孩子们务必小心温柔，把地毯举到亮处看看。
        - id: ch01-b24
          speaker: narrator
          text: 男孩子们照凤凰的话，小心温柔地举起地毯，对准亮光。女孩子们凑近一看，不禁懊悔得打了个寒战。一万一千九百四十只爪子已经抓穿了织物，上面密密麻麻全是小洞，还夹着几个大洞。好几处都薄得几乎透光，一只角更是撕开一长条，凄凄凉凉地垂在那里。
        - id: ch01-b25
          speaker: anthea
          text: 我们马上补好它。我的袜子不要紧，来不及好好补，就用棉线胡乱缝几下吧。我知道自尊的女孩子不该那么做，可这张可怜的好地毯，比我的傻袜子重要多了。我们现在就出门买线。
        - id: ch01-b26
          speaker: narrator
          text: 大家立刻出门买线。可卡姆登镇没有一家店出售许愿毛线，肯蒂什镇同样没有。孩子们只好买下普通的苏格兰石南花杂色细绒线。简和安西娅一整天补呀补呀，双手几乎没有停过。下午，男孩子们出去散步，温文尔雅的凤凰为了锻炼，在桌上不停来回踱步，还给两位勤劳的姑娘讲起地毯的身世。
        - id: ch01-b27
          speaker: phoenix
          text: 它可不是基德明斯特出产的普通地毯，既无知又天真。它是一张有过去的地毯，而且那是一段波斯的过去。在那些更幸福的年月里，它属于哈里发、维齐尔、国王和苏丹。可无论主人是谁，它从来没有铺在地板上供人行走。
        - id: ch01-b28
          speaker: jane
          text: 可我一直以为，地毯就是该住在地板上的。
        - id: ch01-b29
          speaker: phoenix
          text: 魔法地毯当然不是。要是一直铺在地上，它哪里能留到今天？它住过镶珍珠和象牙的香柏木箱，裹过金线织物，上面绣的都是无价宝石。它睡过公主的檀香木匣，也住过满是玫瑰香气的国王宝库。从没人用脚踩它，除非为了许愿。即使那样，人们也会先脱鞋。可你们——
        - id: ch01-b30
          speaker: jane
          text: 求你别说了！要不是妈妈买它回来给我们走，你根本也孵不出来呀。
          emotion: sad
        - id: ch01-b31
          speaker: phoenix
          text: 你们大可以少走几步，也不必踩得那么重。不过，擦掉你那滴水晶般的眼泪吧。我给你们讲祖丽卡公主、亚洲王子和魔法地毯的故事。
        - id: ch01-b32
          speaker: anthea
          text: 那就开始吧。我的意思是，请讲给我们听。
        - id: ch01-b33
          speaker: phoenix
          text: 祖丽卡公主是王室淑女中最美的一位。她还躺在摇篮里时，就中了好几重魔法。她的祖母当年曾经是——
        - id: ch01-b34
          speaker: narrator
          text: 可惜，谁也没能知道祖丽卡的祖母当年究竟是什么。西里尔和罗伯特突然冲进房间，两人额头上都有强烈情绪留下的痕迹。西里尔脸色苍白，额上冒着焦急与汗水凝成的珠子。罗伯特的额头涨得通红，上面还有一大块黑印。凤凰问他们出了什么事，又尖刻地抱怨，说每逢讲故事就有人这样冲进来打断，实在根本没法往下讲。
    - id: ch02
      title: 窃贼落了难
      blocks:
        - id: ch02-b01
          speaker: cyril
          text: 看在随便什么的分上，你先别说了！
        - id: ch02-b02
          speaker: narrator
          text: 西里尔瘫进椅子。罗伯特替凤凰抚平竖起的金羽毛，解释说，松鼠并不是存心讨人厌。只是刚刚发生了最可怕的事，眼下再好的故事也显得没那么重要。等凤凰听完，一定不会再生气。
        - id: ch02-b03
          speaker: phoenix
          text: 那么，到底出了什么事？
        - id: ch02-b04
          speaker: narrator
          text: 凤凰仍有些不高兴。安西娅和简也停下手里的针线。她们各自举着一根长针，针尖悬在空中，长长穿过针眼的苏格兰石南花杂色细绒线软软垂了下来。
        - id: ch02-b05
          speaker: cyril
          text: 是最最糟糕的事。那个好心人，就是咱们自己的窃贼，让警察抓走了。他们怀疑那些猫是偷来的。这是他嫂子亲口说的。
        - id: ch02-b06
          speaker: anthea
          text: 别只说结果，从头讲起！
        - id: ch02-b07
          speaker: cyril
          text: 我和罗伯特走到那家橱窗里摆瓷花的殡仪馆附近，看见一群人，就过去瞧了瞧。两个警察夹着窃贼，正拖他往前走。他一再说，那些猫是人家送的。他在卡姆登镇一间地下客厅里替人挤了母牛的奶，猫就是报酬。
        - id: ch02-b08
          speaker: cyril
          text: 围观的人全笑了，真是一群畜生。一个警察还问，他能不能说出那头牛的姓名和住址。窃贼说不出，可只要他们松开衣领，让他喘口气，他能带路。警察却说，有话留到明早告诉治安法官。他一直没看见我们，所以我们便走了。
        - id: ch02-b09
          speaker: anthea
          text: 西里尔，你怎么能丢下他呢？
        - id: ch02-b10
          speaker: cyril
          text: 别犯傻。就算让他看见我们，又有什么用？根本没人会信，只会当我们在胡闹。我们问出他住在哪儿，找到了那家小蔬果店，还买了一些巴西果仁。喏，都在这里。
        - id: ch02-b11
          speaker: narrator
          text: 女孩子们又嫌恶又轻蔑地把巴西果仁推开。西里尔解释，他们走进人家的小蔬果店，总得买点东西。在犹豫该买什么的时候，他听见窃贼的嫂子说，窃贼昨晚带回一大群喵喵叫的猫，她一眼便觉得事情不只表面那么简单。偏偏今天一早，他非要挑两只最体面的猫出门，一边胳膊夹一只，还打发嫂子去买蓝缎带，好系在那些讨厌东西的脖子上。
        - id: ch02-b12
          speaker: cyril
          text: 她说，要是窃贼因此判了三个月苦役，全怪那条蓝缎带，也怪他偷东西的法子太蠢。他偏拿谁都看得出不可能正经弄来的猫，却不拿那些少了也没人发觉的东西。老天知道，那种东西有的是。还有——
        - id: ch02-b13
          speaker: jane
          text: 快停下！窃贼现在到底在哪儿？
        - id: ch02-b14
          speaker: narrator
          text: 西里尔活像上足了发条的钟，要不是简拦住，他还会一直说下去。这会儿他已经喘不上气，只好由罗伯特回答。
        - id: ch02-b15
          speaker: robert
          text: 他在警察局。那个男孩说，窃贼已经关进牢房，明早要带到法官老爷面前。昨晚让他把猫带走时，我还觉得挺好玩，可现在——
        - id: ch02-b16
          speaker: phoenix
          text: 玩闹到了尽头，便是法官老爷。
        - id: ch02-b17
          speakers: [anthea, jane]
          ensemble: duo
          text: 我们去找他，把真相全说出来！他们一定得相信我们！
        - id: ch02-b18
          speaker: cyril
          text: 他们一定不会信。换成有人拿这种故事告诉你们，不管多努力，你们也信不了。我们出面，只会把他的麻烦弄得更大。
        - id: ch02-b19
          speaker: jane
          text: 总得有办法救救他呀。我亲爱的宝贝窃贼！他那么好，还说起父亲，又答应以后格外诚实。凤凰，你这么善良、漂亮又聪明，一定能帮我们。求你告诉我们该做什么。
          emotion: sad
        - id: ch02-b20
          speaker: narrator
          text: 凤凰抬起爪子，慢慢擦了擦自己的喙。
        - id: ch02-b21
          speaker: phoenix
          text: 你们可以把他救出来，先藏在这里，等维护法律的人把他忘掉。
        - id: ch02-b22
          speaker: cyril
          text: 那要等不知多少年，而且也藏不住。爸爸随时会回来。他看见家里有个窃贼，也不会相信真正的真相。真相最糟糕的地方，就是谁都不信。我们不能把人送去别处吗？
        - id: ch02-b23
          speaker: narrator
          text: 简忽然拍起手来。
        - id: ch02-b24
          speaker: jane
          text: 送他去阳光灿烂的南方海岸！厨娘正在那里做女王，他们正好互相作伴。
        - id: ch02-b25
          speaker: narrator
          text: 只要窃贼肯去，这个主意听起来确实不错。孩子们一齐说个不停，总算商定等到夜里，再去寻找牢房里孤零零的亲爱窃贼。白天，简和安西娅一针接一针，拼命把地毯补得尽可能结实。大家只要一想，珍贵的窃贼在前往阳光灿烂的海岸途中，可能从破洞里掉下去，落进明亮的南方海水，从此再也找不回来，就觉得可怕极了。
        - id: ch02-b26
          speaker: narrator
          text: 仆人们参加过威格森太太的聚会，疲倦得早早上床。等凤凰报告她们都在发自肺腑、毫不作伪地打着呼噜，孩子们马上起身。他们从一开始就没脱衣服，只在外面套上睡衣，这已经足够骗过来熄煤气灯的伊莱扎。所以他们不必再准备什么，随时都能出发。四个人一齐站到地毯上，向它许下了愿望。
        - id: ch02-b27
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 请把我们带到窃贼那间孤零零的牢房里去。
    - id: ch03
      title: 深夜越狱
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 话音才落，他们就到了牢房。来之前，大家无一例外，都把那里想成护城河下面最深的地牢。他们认定窃贼必定套着沉重镣铐，锁在湿漉漉石墙的一只铁环上。他应该正躺在稻草床上辗转难眠，身边摆着一罐没喝过的水和一块没碰过的发霉硬面包。罗伯特还想起从前的地下通道和宝藏，特地带上蜡烛与火柴。结果一样也没用着。
        - id: ch03-b02
          speaker: narrator
          text: 真正的牢房只是一间刷过白灰的小屋，约有十二英尺长、六英尺宽。靠墙有一块像架板的东西，朝墙面微微倾斜，上面铺着两条蓝黄相间的条纹毯，还有一只防水枕头。窃贼裹在毯子里，脑袋安稳地枕着枕头，正睡得香。他其实已经吃过茶点，是街角咖啡馆送来、装在厚实粗瓷器里的，只是孩子们并不知道。走廊的煤气灯从门上方一块厚玻璃照进来，屋里每一样东西都看得清清楚楚。
        - id: ch03-b03
          speaker: cyril
          text: 我堵住他的嘴，罗伯特负责按住他。安西娅、简和凤凰在一旁轻声安慰，等他慢慢醒来。
        - id: ch03-b04
          speaker: narrator
          text: 这计划原本值得成功，可窃贼哪怕睡着，力气也比两个男孩大得多。两人的手才碰到他，他便猛跳起来，喊出一句响得惊人的话。门外立刻传来脚步。安西娅扑过去抱住窃贼，贴着他低声解释。
        - id: ch03-b05
          speaker: anthea
          text: 是我们，就是送猫给你的孩子。我们来救你了。千万别让他们知道我们在这里。有没有地方能让我们藏一藏？
        - id: ch03-b06
          speaker: narrator
          text: 沉重的靴子踏过门外的石板地面，一个不容违抗的声音传了进来。
        - id: ch03-b07
          speaker: policeman
          text: 喂，你别再闹了，听见没有？
        - id: ch03-b08
          speaker: burglar
          text: 好的，长官。我只是在说梦话，没别的意思。
        - id: ch03-b09
          speaker: narrator
          text: 安西娅的胳膊还紧紧搂着窃贼。那一刻实在吓人，大家全都屏住呼吸。那双靴子和声音会不会进门？像是会，又像是不会。脚步停了片刻，门外的人最终只叫窃贼消停一点。随后，靴子沉重地沿着石板走廊远去，又一步步踏上了回声隆隆的石阶。
        - id: ch03-b10
          speaker: anthea
          text: 现在可以说话了。
        - id: ch03-b11
          speaker: burglar
          text: 蓝面摩西在上，你们到底是怎么进来的？
          emotion: surprised
        - id: ch03-b12
          speaker: jane
          text: 我们坐地毯进来的。
        - id: ch03-b13
          speaker: burglar
          text: 别逗我了。只来一个，我也许还信得下去。可你们四个一起来，还带着一只黄鸟！
        - id: ch03-b14
          speaker: cyril
          text: 要是昨晚以前，有人告诉你，我们育儿室里会有一头母牛和那么多猫，你肯相信吗？
        - id: ch03-b15
          speaker: burglar
          text: 鲍勃作证，我绝对不会信。
        - id: ch03-b16
          speaker: cyril
          text: 那你就试着相信这一回，照我们的话做。反正不会比现在更糟。只要肯信我们，我们一定能把你平安送出去，也没人看见我们进来。现在告诉我，你最想去哪儿？
        - id: ch03-b17
          speaker: burglar
          text: 我想去布洛涅。我早想走那趟旅程，可一到合适的季节，手头总没有钱。
        - id: ch03-b18
          speaker: cyril
          text: 布洛涅跟伦敦一样，也是座城。到了那里，你打算靠什么生活？
        - id: ch03-b19
          speaker: narrator
          text: 西里尔这样说是出于好意，可惜说得并不准确。窃贼满心为难，伸手挠了挠脑袋。
        - id: ch03-b20
          speaker: burglar
          text: 这年头，不论到了哪儿，想靠老实活儿过日子都难。
          emotion: sad
        - id: ch03-b21
          speaker: jane
          text: 是啊。那你愿不愿意去一处阳光灿烂的南方海岸？在那里，只要自己不想，什么活儿都不用干。
        - id: ch03-b22
          speaker: burglar
          text: 这地方正适合我，小姐。我本来就不怎么爱干活，不像有些人整天忙个不停。
        - id: ch03-b23
          speaker: anthea
          text: 你就没有真正喜欢过的活儿吗？
        - id: ch03-b24
          speaker: burglar
          text: 当然有。我最喜欢园艺。可我爸爸还没来得及送我给苗圃园主当学徒，就去世了，所以后来——
        - id: ch03-b25
          speaker: jane
          text: 那就去南方海岸吧。那里的花漂亮得超出你的想象。
        - id: ch03-b26
          speaker: anthea
          text: 我们从前的厨娘也在那里，她如今是女王。
        - id: ch03-b27
          speaker: burglar
          text: 求你们别再说了。从看见那些猫和母牛的第一刻起，我就知道报应来了。现在我连自己是拿帽子站着，还是拿靴子站着都弄不清。能救我，就快把我弄走。不能救，就请你们赶紧离开，让我想想明早该怎么说，法官老爷才肯相信。
        - id: ch03-b28
          speaker: narrator
          text: 安西娅不再争辩，只把他轻轻推向地毯。其他人也从旁悄悄地拉，免得惊动外面的看守。窃贼的两只脚刚刚在地毯上站稳，安西娅便抓紧时机，立刻开口许愿。
        - id: ch03-b29
          speaker: anthea
          text: 请把我们全都带到厨娘所在的阳光灿烂的南方海岸。
        - id: ch03-b30
          speaker: narrator
          text: 转眼之间，牢房不见了。他们脚下铺开彩虹般的沙滩，四周全是热带树叶与花朵的绚丽光彩。厨娘当然也在那里，头戴一顶白花编成的冠冕。过去那些烦躁、疲惫和辛苦劳作在她脸上刻出的皱纹，如今已经全都消失，整张脸显得年轻又舒展。
    - id: ch04
      title: 女王的婚事
      blocks:
        - id: ch04-b01
          speaker: anthea
          text: 厨娘，你如今可真漂亮！
        - id: ch04-b02
          speaker: narrator
          text: 地毯一路颠簸、猛冲、旋转，安西娅刚喘过气便赞叹起来。窃贼站在明亮的阳光下，一边揉眼，一边望着四周浓烈鲜艳的景色。
        - id: ch04-b03
          speaker: burglar
          text: 一便士买素色，两便士买彩色！眼前这些彩色，就算两便士挣得再辛苦，也完全值得。
        - id: ch04-b04
          speaker: narrator
          text: 厨娘坐在一座青草小丘上，四周围着组成她宫廷的铜肤色野人。窃贼伸出一根脏手指，心里没底地指向他们。
        - id: ch04-b05
          speaker: burglar
          text: 他们都驯服吗？会不会咬人、抓人，或者拿毒箭、牡蛎壳之类的东西来伤人？
        - id: ch04-b06
          speaker: cook
          text: 别那么胆小。你只是走进了一个梦。既然在做梦，年轻小姐该说什么、不该说什么的规矩就不用管了。我直说吧，这些日子里，我见过的男人数你最英俊。只要你好好表现，这个梦似乎就能一直做下去。这里的吃喝尝起来都跟真的一样，而且——
        - id: ch04-b07
          speaker: burglar
          text: 我可是刚从警察局直接来到这儿。这几个孩子都能作证，事情不能怪我。
        - id: ch04-b08
          speaker: anthea
          text: 可你之前确实做过窃贼，这也是真的。
        - id: ch04-b09
          speaker: burglar
          text: 那是因为不老实的家伙把我逼得没路可走，小姐，你明明知道。见鬼，这真是我好多年来遇见最热的一个一月。
        - id: ch04-b10
          speaker: cook
          text: 你想洗个澡吗？再换一套跟我一样的白衣服？
        - id: ch04-b11
          speaker: burglar
          text: 那样穿，我只会像个大傻瓜。不过还是谢谢你。洗澡我倒很愿意，毕竟我的衬衫上上个星期才洗过。
        - id: ch04-b12
          speaker: narrator
          text: 西里尔和罗伯特把窃贼带到一处岩石围成的水潭。他在那里舒舒服服、痛痛快快地洗了一个澡。随后，他只穿着衬衫和裤子，坐到温暖的沙滩上，认真说起那位厨娘，或者女王，随便别人怎样称呼吧。他又看了看她头上的白花束，觉得这位女士正合自己的心意，只是不知道人家愿不愿意跟他相好。
        - id: ch04-b13
          speaker: anthea
          text: 你应该亲自去问她。
        - id: ch04-b14
          speaker: burglar
          text: 我做事一向麻利，说干就干。这就去问。
        - id: ch04-b15
          speaker: narrator
          text: 回女王宫廷的路上，西里尔匆匆编出一圈芬芳的花冠，戴在窃贼头上。于是窃贼穿着衬衫和裤子，顶着花冠，郑重站到了厨娘面前。
        - id: ch04-b16
          speaker: burglar
          text: 听我说，小姐。你和我在这个梦里，或者不管它叫什么吧，都是孤孤单单一个人。所以我想直接告诉你，我很喜欢你的模样。
        - id: ch04-b17
          speaker: narrator
          text: 厨娘笑了，羞答答地低下头。
        - id: ch04-b18
          speaker: burglar
          text: 我是单身汉，也就是人家说的光棍。我的脾气很温和，这几个孩子都能作证。我想请你赏个脸，下星期天跟我出去走走。
        - id: ch04-b19
          speaker: cook
          text: 哎哟，先生，你这话来得可真突然。
          emotion: surprised
        - id: ch04-b20
          speaker: anthea
          text: 出去走走，就是打算结婚。为什么不索性现在结了，省得麻烦？要是换成我，我就结。
        - id: ch04-b21
          speaker: burglar
          text: 我不介意现在就结。
        - id: ch04-b22
          speaker: cook
          text: 那可不行，小姐，就算在梦里也不行。我没说这位年轻人长得不好，可我早发过誓，要结婚就一定在教堂里结。再说，就算我手把手教，这些野人恐怕也办不好登记处。多谢你的好意，先生。除非能请一位牧师走进这个梦，否则我一辈子都保持现在这样。
        - id: ch04-b23
          speaker: anthea
          text: 要是我们真的找来牧师，你愿意娶她吗？
        - id: ch04-b24
          speaker: burglar
          text: 我当然愿意，小姐。只是这束花真会挠人的耳朵！
        - id: ch04-b25
          speaker: narrator
          text: 大家赶紧铺开地毯，吩咐它去接一位牧师。手边没有纸，他们便拿出罗伯特从林德赫斯特旅馆记分员那里弄来的台球粉笔，把全部指示写在西里尔帽子的内侧。地毯眨眼消失，又在快得叫人难以想象的工夫里赶了回来。它怀里载着一位真正的牧师，名叫塞普蒂默斯·布伦金索普。
        - id: ch04-b26
          speaker: narrator
          text: 塞普蒂默斯是个颇不错的年轻人，这会儿却迷迷糊糊。在自家书房里，他看见一张陌生地毯铺到脚边，自然会走上去细看。偏巧一只脚踩在姑娘们补过的薄洞上。他一半站着许愿地毯，另一半却站着普通细绒线，而普通毛线根本没有魔法。
        - id: ch04-b27
          speaker: narrator
          text: 结果，牧师只有一半来到了岛上。孩子们能透过他的身体隐约看见后面，就像他是个幽灵。牧师本人明明白白看见阳光灿烂的南方海岸，看见厨娘、窃贼和四个孩子。可就在看见他们的同时，他也能透过所有人的身体，清清楚楚看见家里的书房、书架和图画，还有离开上一份职位时别人赠给他的那座大理石钟。
        - id: ch04-b28
          speaker: narrator
          text: 牧师认定自己精神错乱了，既然如此，做什么也无所谓。他便替窃贼和厨娘主持了婚礼。厨娘本想要一位实在些、不能让人看穿的牧师，不过她又觉得，既然是在梦里，这大概已经够真实了。
        - id: ch04-b29
          speaker: narrator
          text: 牧师虽是雾蒙蒙的，却是真正的牧师，也确实能为人主持婚礼。仪式完成以后，他开始在岛上四处采集植物标本。他本来就是了不起的植物学家，哪怕以为自己疯了，那份最强烈的爱好也丝毫不减。
    - id: ch05
      title: 波斯谜案
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 婚宴盛大极了。简、安西娅、罗伯特和西里尔手拉着手，同铜肤色的野人一起围成圆圈，绕着幸福的新人跳舞。厨娘成了女王新娘，窃贼成了她的王夫。众人采下又抛出的鲜花，比你在梦里见过的还多。孩子们临回家时，已经安顿下来的新郎站出来演说。
        - id: ch05-b02
          speaker: burglar
          text: 女士们、先生们，还有两类野人们，我知道你们听不懂我在说什么，不过这事先放到一边。要是这里是梦，我赞成留下。要是不是梦，我就更赞成。要是介乎两者之间，我只能老老实实说，我也没更多可说了。
        - id: ch05-b03
          speaker: burglar
          text: 我再也不想混什么伦敦上流社会。如今有人能让我搂着，整座岛也都是我的菜园。我要是种不出让乡村花展评委大开眼界的西蓝花，就叫我浑身变粉红！
        - id: ch05-b04
          speaker: burglar
          text: 我只求几位少爷小姐下次带些欧芹种子进梦里，再买一便士萝卜籽、三便士洋葱籽。混合羽衣甘蓝花四五便士也行，不过我身上一文没有，先跟你们说实话。还有，请把牧师带走。我不喜欢能透过去看见一半的东西。我的话说完了！
        - id: ch05-b05
          speaker: narrator
          text: 他一口喝光椰子壳里的棕榈酒。伦敦已经过了午夜，岛上却才到下午茶时分。孩子们送上所有美好祝愿，向新婚夫妇告别。他们把半透明的牧师也一并收好，带回那间书房，放到别人赠送的大理石钟旁边。
        - id: ch05-b06
          speaker: narrator
          text: 第二天，凤凰好心替新郎新娘送去了种子，回来时带来了叫人十分满意的消息。
        - id: ch05-b07
          speaker: phoenix
          text: 他已经做出一把木铲，开始开垦菜园。她正在替他织一件洁白耀眼的衬衫和一条裤子。
        - id: ch05-b08
          speaker: narrator
          text: 警察始终没弄清窃贼是怎样逃走的。直到今天，肯蒂什镇警察局的人说起那次逃脱，仍会屏住呼吸，称它为“波斯谜案”。
        - id: ch05-b09
          speaker: narrator
          text: 塞普蒂默斯·布伦金索普牧师则觉得，自己确实经历了一场严重的精神错乱，而且一定是因为用功过度。他决定稍稍放纵一下，带两位未婚姑母去了巴黎。她们兴奋地逛遍一轮博物馆和美术馆，回来后深信自己总算见过了世面。
        - id: ch05-b10
          speaker: narrator
          text: 牧师从没向姑母或任何人提起岛上的婚礼。一个人若曾精神错乱，总不愿让大家都知道，哪怕那次发作既有趣，又不同寻常。
