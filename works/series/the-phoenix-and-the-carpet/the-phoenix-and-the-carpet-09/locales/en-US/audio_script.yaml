  chapters:
    - id: ch01
      title: THE BURGLAR'S BRIDE
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The morning after the Persian cats, the musk-rats, the ordinary cow, and the very unusual burglar, the children slept until ten. Cyril woke first and roused the others. By half past ten they were all helping with breakfast, though the house was bitterly cold and there was hardly anything worth eating.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Robert had prepared a thoughtful little surprise for the absent servants. He had set a neat and delightful booby trap above the kitchen door. When the front door clicked open and the children knew the servants had come home, all four squeezed into the cupboard under the stairs. They listened happily to everything that followed. First came the entrance, then a tumble, a splash, a scuffle, and several very loud remarks. Cook called it a judgment on them for leaving the house alone. She seemed to believe that a booby trap was a sort of plant that might spring up all by itself whenever a house was left shut. Eliza was more observant. Someone must have been inside, she said, and finding the breakfast things on the nursery table confirmed it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The cupboard was cramped and smelled of paraffin. A silent battle for the top place ended when the door burst open and Jane rolled out like a football at the servants' feet. Cook's hysterics slowly quieted, and Eliza told the children exactly what she thought of them.
        - id: ch01-b04
          speaker: cyril
          text: >-
            Now, don't start scolding us. We won't put up with it, because we know too much. Make an extra-special treacle roly-poly for dinner, please, and we'll have a tinned tongue too.
        - id: ch01-b05
          speaker: eliza
          text: >-
            Oh, indeed? Don't threaten me, Master Cyril. I won't stand for it. Tell your mother we went out if you like. She'll pity me when she hears about my dear great-aunt by marriage, the woman who raised me like a mother. She sent for me because the spasms had gone to her legs and she wasn't expected to live through the night. Cook was too kind to let me go alone, so—
        - id: ch01-b06
          speaker: anthea
          text: >-
            Please don't, Eliza. You know what happens to liars. At least, if you don't—
          emotion: sad
        - id: ch01-b07
          speaker: eliza
          text: >-
            Liars! I won't lower myself by talking to you.
          emotion: angry
        - id: ch01-b08
          speaker: robert
          text: >-
            How is Mrs. Wigson? And did you keep the party going last night?
        - id: ch01-b09
          speaker: narrator
          text: >-
            Eliza's mouth fell open.
        - id: ch01-b10
          speaker: cyril
          text: >-
            Did you sleep at Maria's or Emily's?
        - id: ch01-b11
          speaker: jane
          text: >-
            Did Mrs. Prosser have a good time?
        - id: ch01-b12
          speaker: cyril
          text: >-
            Enough. They've heard plenty. Whether we tell depends on how you behave from now on. Treat us properly and we'll treat you properly. Make that treacle roly-poly. And Eliza, you might try doing a little housework for a change.
        - id: ch01-b13
          speaker: narrator
          text: >-
            That ended the matter. The servants gave in once and for all. Later, when the breakfast things had been cleared away and the children were alone in the nursery, Cyril was ready to explain how easily he had managed them.
        - id: ch01-b14
          speaker: cyril
          text: >-
            Firmness does it. People complain that servants are difficult, but it's simple once you know how. We can do whatever we like now, and they won't tell. I think we've crushed their proud spirits. Let's take the carpet somewhere.
        - id: ch01-b15
          speaker: phoenix
          text: >-
            I would not do that.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The Phoenix yawned, swooped down from the curtain pole, and perched on a chair back, rocking like a parrot on a swing.
        - id: ch01-b17
          speaker: phoenix
          text: >-
            I have offered hints before. Now concealment is useless, and I must speak plainly.
        - id: ch01-b18
          speaker: anthea
          text: >-
            What's wrong now? I'm tired of things happening after all those cats last night. I'm not going anywhere on the carpet. I'm going to darn my stockings.
        - id: ch01-b19
          speaker: phoenix
          text: >-
            Darn? What a strange expression from such young lips!
        - id: ch01-b20
          speaker: anthea
          text: >-
            Mend them, then, with a needle and wool.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The Phoenix slowly opened and closed its wings.
        - id: ch01-b22
          speaker: phoenix
          text: >-
            Your stockings matter far less than you think. Look at the carpet. See those bare patches and that great tear in the corner. It has been your faithful friend and willing servant. How have you repaid it?
        - id: ch01-b23
          speaker: anthea
          text: >-
            Dear Phoenix, please don't lecture like that. You make me feel guilty. It is a wishing carpet, and all we've done is make wishes on it.
        - id: ch01-b24
          speaker: phoenix
          text: >-
            Only wishes! And what wishes they were. You even asked it to put people into a good temper. What other carpet has ever faced such a demand? This noble fabric, which you trample so carelessly, never refused you.
          emotion: angry
        - id: ch01-b25
          speaker: narrator
          text: >-
            Everyone quickly took their boots off the carpet and stood on the linoleum.
        - id: ch01-b26
          speaker: phoenix
          text: >-
            It obeyed every time, but think of the damage. I do not blame you for the cats and rats last night, since the carpet chose those itself. But how could any carpet bear a heavy cow dangling from one corner?
        - id: ch01-b27
          speaker: robert
          text: >-
            The cats and rats must have been worse. Think of all those claws.
        - id: ch01-b28
          speaker: phoenix
          text: >-
            Eleven thousand nine hundred and forty claws, to be exact. Surely you noticed. I would be astonished if they left no marks.
        - id: ch01-b29
          speaker: jane
          text: >-
            Oh! Do you mean the carpet is wearing out?
          emotion: surprised
        - id: ch01-b30
          speaker: narrator
          text: >-
            Jane dropped to the floor and gently patted its edge.
        - id: ch01-b31
          speaker: phoenix
          text: >-
            Its life with you has hardly been luxurious. Twice in French mud, twice on sunny sands, once soaked in southern seas, once in India, once somewhere in Persia, once in musk-rat country, and once wherever that cow came from. Hold it up to the light, and please be careful.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The boys lifted the carpet toward the light with great care, and the girls leaned close to look. A shiver of regret passed through all four children. Those eleven thousand nine hundred and forty claws had gone straight through the fabric. Little holes covered it from end to end. Some holes were large, and more than one place had worn terribly thin. At one corner, a long torn strip hung sadly loose.
        - id: ch01-b33
          speaker: anthea
          text: >-
            We must mend it. My stockings can wait. If there isn't time, I'll bunch them together with sewing cotton, however dreadful that looks. The poor dear carpet matters more. Let's buy wool this minute.
        - id: ch01-b34
          speaker: narrator
          text: >-
            They all went out at once to buy wool for the repairs. There was no shop in Camden Town where anyone could buy wishing-wool, nor was there one in Kentish Town. Ordinary Scotch heather-mixture fingering seemed the best they could do, so they bought that. Jane and Anthea spent the whole day darning and darning. In the afternoon, the boys went out for a walk. The gentle Phoenix stayed with the busy girls, pacing up and down the table for exercise, as it explained, and talking about the carpet while they worked.
        - id: ch01-b35
          speaker: phoenix
          text: >-
            This is no ordinary, innocent, ignorant carpet from Kidderminster. It has a Persian past. In happier days, when caliphs, viziers, kings, and sultans owned it, the carpet never lay on a floor.
        - id: ch01-b36
          speaker: jane
          text: >-
            I thought a floor was where a carpet belonged.
        - id: ch01-b37
          speaker: phoenix
          text: >-
            Not a magic carpet! If people had left it lying on floors, almost nothing would remain. It rested in cedar chests inlaid with pearl and ivory. Cloth of gold covered it, embroidered with priceless jewels. Princesses kept it in sandalwood caskets, and kings guarded it in treasure rooms scented with rose perfume. No one ever walked on it except to make a wish, and then they removed their shoes. But you—
        - id: ch01-b38
          speaker: jane
          text: >-
            Oh, please stop! You would never have hatched if Mother hadn't wanted a carpet for us to walk on.
          emotion: sad
        - id: ch01-b39
          speaker: phoenix
          text: >-
            You did not need to walk so much or tread so hard. Still, dry that crystal tear. I shall tell you about Princess Zulieka, the Prince of Asia, and the magic carpet.
        - id: ch01-b40
          speaker: anthea
          text: >-
            Go on. I mean, please do.
        - id: ch01-b41
          speaker: phoenix
          text: >-
            Princess Zulieka, loveliest of royal ladies, had suffered several enchantments while still in her cradle. In her day, her grandmother had been—
        - id: ch01-b42
          speaker: narrator
          text: >-
            No one ever learned what Princess Zulieka's grandmother had been in her day. At that very moment, Cyril and Robert burst into the room, and anyone could see that something had shaken them deeply. Beads of sweat and agitation stood on Cyril's pale forehead. Robert's face was scarlet, with a large black smear across his brow. The Phoenix sharply asked what troubled them, then added that storytelling was quite impossible when people came bursting in with interruptions.
        - id: ch01-b43
          speaker: cyril
          text: >-
            Oh, do be quiet, please!
        - id: ch01-b44
          speaker: narrator
          text: >-
            Cyril sank into a chair. Robert gently smoothed the Phoenix's ruffled gold feathers.
        - id: ch01-b45
          speaker: robert
          text: >-
            Squirrel doesn't mean to be horrid. Something truly awful has happened, and stories don't seem important now. Please don't be cross. You won't be once you hear.
        - id: ch01-b46
          speaker: phoenix
          text: >-
            Then what has happened?
        - id: ch01-b47
          speaker: narrator
          text: >-
            Anthea and Jane stopped with their long needles raised and strands of heather-colored wool hanging from them.
        - id: ch01-b48
          speaker: cyril
          text: >-
            The worst thing you can imagine. The police arrested that nice fellow, our own burglar, because they think he stole the cats. His brother's wife told me.
        - id: ch01-b49
          speaker: anthea
          text: >-
            Start at the beginning!
        - id: ch01-b50
          speaker: cyril
          text: >-
            Robert and I went past the undertaker's, the one with china flowers in the window. A crowd had gathered, so naturally we looked. Two policemen were dragging our burglar between them. He kept saying the cats had been given to him in exchange for milking a cow in a basement parlor in Camden Town. Everyone laughed at him. One policeman asked for the cow's name and address. The burglar said he couldn't give those, but he could show them the house if they released his collar and let him breathe. The policeman told him to explain it to the magistrate tomorrow. He never saw us, so we left.
        - id: ch01-b51
          speaker: anthea
          text: >-
            Cyril, how could you leave him?
        - id: ch01-b52
          speaker: cyril
          text: >-
            Don't be silly. Seeing us wouldn't have helped. Nobody would believe our story. They'd think we were joking. We did something better. A boy told us where the burglar lived, so we went to the little greengrocer's shop there and bought Brazil nuts.
        - id: ch01-b53
          speaker: narrator
          text: >-
            He showed them the nuts. The girls waved them away in disgust.
        - id: ch01-b54
          speaker: cyril
          text: >-
            We had to buy something. While we were choosing, we heard his brother's wife talking. She suspected trouble as soon as he brought all those yowling cats home. But this morning he carried out the two finest ones, one under each arm. He had even sent her to buy blue ribbon for their necks. She said if he got three months of hard labor, the ribbon and his own foolish thieving were to blame. Anyone could see he hadn't got those cats through ordinary business. He should have taken something nobody would miss, because there are plenty of—
        - id: ch01-b55
          speaker: jane
          text: >-
            Stop! Where is he now?
        - id: ch01-b56
          speaker: narrator
          text: >-
            Cyril had run out of breath, so Robert answered.
        - id: ch01-b57
          speaker: robert
          text: >-
            In a cell at the police station. The boy said they'll take him before the magistrate tomorrow. Last night, giving him the cats seemed like a grand joke. But now—
          emotion: sad
        - id: ch01-b58
          speaker: phoenix
          text: >-
            A lark ends at the magistrate's bench.
        - id: ch01-b59
          speakers: [anthea, jane]
          ensemble: duo
          text: >-
            Let's go to him and tell the truth. They must believe us!
        - id: ch01-b60
          speaker: cyril
          text: >-
            They can't. Imagine someone telling you a story like ours. You couldn't believe it, however hard you tried. We'd only make his trouble worse.
        - id: ch01-b61
          speaker: jane
          text: >-
            There must be something we can do. My dear burglar! I can't bear it. He spoke so nicely about his father, and he meant to be especially honest. Dear Phoenix, you're good and kind and beautiful and clever. Please tell us how to help him.
          emotion: sad
        - id: ch01-b62
          speaker: narrator
          text: >-
            The Phoenix thoughtfully rubbed its beak with one claw.
        - id: ch01-b63
          speaker: phoenix
          text: >-
            You could rescue him and hide him here until the supporters of the law forget him.
        - id: ch01-b64
          speaker: cyril
          text: >-
            That would take ages, and we couldn't hide him here. Father may return any moment. If he found a burglar in the house, he wouldn't believe the real truth any more than the police would. That's the trouble with truth. Nobody believes it. Couldn't we take him somewhere else?
        - id: ch01-b65
          speaker: narrator
          text: >-
            Jane clapped her hands.
        - id: ch01-b66
          speaker: jane
          text: >-
            The sunny southern shore, where Cook is queen! They could keep each other company.
          emotion: happy
        - id: ch01-b67
          speaker: narrator
          text: >-
            The idea really did seem good, as long as the burglar agreed to go. All four children talked at once as they arranged the rescue. They would wait until evening, then use the carpet to reach his lonely cell. Until the time came, Jane and Anthea worked their needles as hard and fast as they could, making the carpet strong enough to carry him. Everyone pictured the same dreadful possibility. Their precious burglar might slip through an unmended hole during the journey, fall into the sunny southern sea, and be lost forever.
        - id: ch01-b68
          speaker: narrator
          text: >-
            The servants were worn out after Mrs. Wigson's party, so everyone in the house went to bed early. Before long, the Phoenix reported that both servants were snoring in the most heartfelt and honest way. The children immediately got up. They had never undressed at all. Pulling nightgowns over their clothes had been enough to deceive Eliza when she came in to turn out the gas. Now they needed no time to dress. They were ready for anything, and all four stepped onto the carpet.
        - id: ch01-b69
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: >-
            We wish we were in our burglar's lonely cell.
        - id: ch01-b70
          speaker: narrator
          text: >-
            At once, they were there. Every one of them had imagined the cell as the deepest dungeon beneath a castle moat. They expected to find the burglar fastened by heavy chains to an iron ring in a damp stone wall. He would be tossing miserably on a bed of straw, of course, with a jug of water and an old crumbling crust lying untouched beside him. Remembering the underground passage and its treasure, Robert had even brought a candle and matches. But there was no need to light them.
        - id: ch01-b71
          speaker: narrator
          text: >-
            The real cell was a little whitewashed room, about twelve feet long and only six feet wide. Along one side was something like a shelf, tilted slightly down toward the wall. Two rugs striped in blue and yellow lay on it, along with a waterproof pillow. The burglar was rolled snugly in the rugs, his head resting on the pillow, and he was fast asleep. He had already eaten his tea, though the children knew nothing about that. It had come from the coffee shop around the corner in very thick crockery. A gas lamp burned in the passage outside. Its light came through a pane of thick glass above the door and showed the children every part of the scene.
        - id: ch01-b72
          speaker: cyril
          text: >-
            I'll cover his mouth, and Robert can hold him. Anthea, Jane, and the Phoenix can whisper gently while he wakes.
        - id: ch01-b73
          speaker: narrator
          text: >-
            It was a carefully arranged plan and deserved to work much better than it did. Strangely enough, even in his sleep the burglar was far stronger than Cyril and Robert together. The moment their hands touched him, he sprang upright and shouted as loudly as he could. Footsteps began at once in the passage outside. Anthea flung both arms around the startled burglar and pulled herself close enough to whisper.
        - id: ch01-b74
          speaker: anthea
          text: >-
            It's us, the children who gave you the cats. We've come to save you. Don't tell anyone we're here. Is there somewhere we can hide?
        - id: ch01-b75
          speaker: narrator
          text: >-
            Heavy boots struck the stone passage, and a hard voice called through the door.
        - id: ch01-b76
          speaker: policeman
          text: >-
            You in there, stop that noise!
        - id: ch01-b77
          speaker: burglar
          text: >-
            All right, governor. I was talking in my sleep, that's all. No offense meant.
        - id: ch01-b78
          speaker: narrator
          text: >-
            It was a terrible moment for everyone in the cell. The heavy boots had reached the door. Would the policeman unlock it and come inside? For one instant the children thought he would. Then they thought he would not. At last the firm voice came once more through the door.
        - id: ch01-b79
          speaker: policeman
          text: >-
            Well, keep quiet, then.
        - id: ch01-b80
          speaker: narrator
          text: >-
            The boots moved away, down the passage and up the echoing stone stairs.
        - id: ch01-b81
          speaker: anthea
          text: >-
            Now, then.
        - id: ch01-b82
          speaker: burglar
          text: >-
            How in blue Moses did you get in here?
          emotion: surprised
        - id: ch01-b83
          speaker: jane
          text: >-
            On the carpet.
        - id: ch01-b84
          speaker: burglar
          text: >-
            Don't give me that. I might swallow a tale from one of you, but not four children and a yellow bird.
        - id: ch01-b85
          speaker: cyril
          text: >-
            Before last night, would you have believed anyone who said you'd find a cow and all those cats in our nursery?
        - id: ch01-b86
          speaker: burglar
          text: >-
            Not me. So help me, Bob, I wouldn't.
        - id: ch01-b87
          speaker: cyril
          text: >-
            Then try believing us now and do what we say. It can't hurt you. You can hardly be worse off than this. Trust us, and we'll get you out. Nobody saw us come in. Where would you like to go?
        - id: ch01-b88
          speaker: burglar
          text: >-
            I'd like to go to Boolong. I've always fancied that trip, but I never had the money at the right season.
        - id: ch01-b89
          speaker: cyril
          text: >-
            Boolong is another town like London. How would you earn a living there?
        - id: ch01-b90
          speaker: narrator
          text: >-
            The burglar scratched his head and considered this deeply.
        - id: ch01-b91
          speaker: burglar
          text: >-
            An honest living is hard to come by anywhere these days.
          emotion: sad
        - id: ch01-b92
          speaker: jane
          text: >-
            Isn't it? What about a sunny southern shore, where you needn't do anything unless you want to?
        - id: ch01-b93
          speaker: burglar
          text: >-
            That's the place for me, miss. I never cared for work, unlike those people who are always fussing over it.
        - id: ch01-b94
          speaker: anthea
          text: >-
            Was there never any work you liked?
        - id: ch01-b95
          speaker: burglar
          text: >-
            Lord love you, yes. Gardening was my hobby. But Father died before he could apprentice me to a nurseryman, and—
        - id: ch01-b96
          speaker: jane
          text: >-
            We'll take you to the sunny southern shore. You should see the flowers there.
        - id: ch01-b97
          speaker: anthea
          text: >-
            Our old cook lives there. She's the queen—
        - id: ch01-b98
          speaker: burglar
          text: >-
            Oh, stop it! The moment I saw those cats and that cow, I knew they were a judgment on me. I can't tell whether I'm standing on my hat or my boots. If you can get me out, then do it. If you can't, go away and let me think of something the magistrate might believe tomorrow.
        - id: ch01-b99
          speaker: anthea
          text: >-
            Step onto the carpet, then.
        - id: ch01-b100
          speaker: narrator
          text: >-
            Anthea gently pushed while the others quietly pulled. The instant both the burglar's feet touched the carpet, she made the wish.
        - id: ch01-b101
          speaker: anthea
          text: >-
            I wish we were all on the sunny southern shore where Cook is.
        - id: ch01-b102
          speaker: narrator
          text: >-
            Instantly, they reached the sunny southern shore. Rainbow-colored sands stretched around them, bright under the tropical sun. Everywhere they looked, glorious leaves and flowers blazed with vivid color. Cook was there, of course. She wore a crown of white flowers, and all the wrinkles that crossness, tiredness, and years of hard work had drawn on her face were completely gone.
        - id: ch01-b103
          speaker: anthea
          text: >-
            Why, Cook, you're quite pretty!
          emotion: surprised
        - id: ch01-b104
          speaker: narrator
          text: >-
            Anthea had only just caught her breath after the carpet's tumbling whirl. The burglar rubbed his eyes in the tropical sunlight and stared wildly at the vivid colors around him.
        - id: ch01-b105
          speaker: burglar
          text: >-
            Penny plain and twopence colored! And worth every hard-earned penny of the twopence.
        - id: ch01-b106
          speaker: narrator
          text: >-
            Cook sat on a grassy mound, surrounded by her court of copper-colored islanders. The burglar pointed a dirty finger toward them.
        - id: ch01-b107
          speaker: burglar
          text: >-
            Are they tame? They don't bite or scratch, do they? No poisoned arrows or oyster shells or anything like that?
          emotion: fearful
        - id: ch01-b108
          speaker: cook
          text: >-
            Don't be so timid. This is only a dream you've wandered into. Since it's a dream, I needn't worry about what a young lady should or shouldn't say. You're the finest-looking fellow I've seen in many a day. The dream seems to last as long as you behave yourself, and everything you eat or drink tastes just as good as the real thing.
        - id: ch01-b109
          speaker: burglar
          text: >-
            Listen, I've come straight from the police station. These children can tell you it wasn't my fault.
        - id: ch01-b110
          speaker: anthea
          text: >-
            You were a burglar, though.
        - id: ch01-b111
          speaker: burglar
          text: >-
            Only because dishonest fellows drove me to it, as you know, miss. Blimey, this is the hottest January I've felt in years.
        - id: ch01-b112
          speaker: cook
          text: >-
            Would you like a bath? And some white clothes like mine?
        - id: ch01-b113
          speaker: burglar
          text: >-
            I'd look a fool in the clothes, miss, though I thank you kindly. But I won't refuse a bath. My shirt was clean only the week before last.
        - id: ch01-b114
          speaker: narrator
          text: >-
            Cyril and Robert took charge of him and led him to a pool among the rocks. There the burglar bathed long and luxuriously, enjoying every moment of it. When he came out, he kept on his shirt and trousers and sat down on the warm sand to consider his new life.
        - id: ch01-b115
          speaker: burglar
          text: >-
            That cook, or queen, or whatever she is, the one with the white flowers on her head, she's just my sort. I wonder if she'd keep company with me.
        - id: ch01-b116
          speaker: cyril
          text: >-
            Ask her.
        - id: ch01-b117
          speaker: burglar
          text: >-
            I've always moved quickly. One word and then the deed. I will ask.
        - id: ch01-b118
          speaker: narrator
          text: >-
            Cyril quickly gathered sweet-smelling flowers and wove them into a wreath. The burglar set it on his head, then returned with the boys to the queen's court. In nothing but his shirt and trousers, with the scented wreath crowning him, he stood before Cook and prepared to speak plainly.
        - id: ch01-b119
          speaker: burglar
          text: >-
            Look here, miss. You and me are both alone in this dream, or whatever you call it. So I'll speak straight. I like the look of you.
        - id: ch01-b120
          speaker: narrator
          text: >-
            Cook smiled and lowered her eyes shyly.
        - id: ch01-b121
          speaker: burglar
          text: >-
            I'm a single man, what you might call a bachelor. My habits are mild, and these children will say the same. I'd be honored if you'd walk out with me next Sunday.
        - id: ch01-b122
          speaker: cook
          text: >-
            Lor, mister! You do move fast.
          emotion: surprised
        - id: ch01-b123
          speaker: anthea
          text: >-
            Walking out means you'll marry in the end. Why not marry now and finish the matter? I would.
        - id: ch01-b124
          speaker: burglar
          text: >-
            I don't mind if I do.
        - id: ch01-b125
          speaker: cook
          text: >-
            No, miss. Not even in a dream. I've nothing against the young man's looks, but I always swore I'd marry in church or not at all. These islanders wouldn't know how to run a registry office, even if I taught them. No, mister, thank you kindly. Unless you bring a clergyman into this dream, I'll stay as I am all my life.
        - id: ch01-b126
          speaker: anthea
          text: >-
            If we bring a clergyman, will you marry her?
        - id: ch01-b127
          speaker: burglar
          text: >-
            I'm quite agreeable, miss. Though these flowers do tickle a fellow's ears!
        - id: ch01-b128
          speaker: narrator
          text: >-
            There was no time to waste. They spread the carpet and gave it careful instructions to fetch a clergyman. Those instructions had to be written down, so Cyril used the inside of his cap. Robert supplied a piece of billiard chalk that he had obtained from the marker at the hotel in Lyndhurst. As soon as the message was ready, the carpet disappeared. It returned much sooner than anyone would have thought possible, carrying the Reverend Septimus Blenkinsop on its surface.
        - id: ch01-b129
          speaker: narrator
          text: >-
            The Reverend Septimus was a rather pleasant young man, but his arrival left him completely dazed and bewildered. A strange carpet had suddenly appeared at his feet while he was sitting in his own study. Naturally, he walked onto it so that he could examine it more closely. By chance, he planted himself across one of the thin places Jane and Anthea had repaired. Half of him stood on the real wishing carpet. The other half stood on plain Scotch heather-mixture fingering wool, and that ordinary wool had no magical powers at all.
        - id: ch01-b130
          speaker: narrator
          text: >-
            The result was that only half of the clergyman properly arrived. The children could see right through him, almost as if he were a ghost. From where he stood, he saw the sunny southern shore quite plainly. He also saw Cook, the burglar, and the children. Yet all the while, he could look straight through every one of them and see his study at home just as clearly. The books and pictures were still there, along with the marble clock that had been presented to him when he left his last position.
        - id: ch01-b131
          speaker: narrator
          text: >-
            The Reverend Septimus decided he must be suffering some kind of insane fit. If none of this was real, then it did not seem to matter what he did. So he married the burglar and Cook. Cook said she would have preferred a more solid sort of clergyman, someone she could not see through so plainly, but perhaps this one was real enough for a dream. The clergyman truly was real, however misty he looked, and he had every right to marry people. When the ceremony ended, he began wandering over the island and collecting botanical specimens. He was a devoted botanist, and even an insane fit could not weaken that ruling passion.
        - id: ch01-b132
          speaker: narrator
          text: >-
            Then came a splendid wedding feast. Picture Jane and Anthea, Robert and Cyril, all dancing merrily hand in hand with the copper-colored islanders. Together they made a great ring around the happy married pair, Queen Cook and her burglar husband. Flowers were gathered by the armful and thrown over everyone. There were more blossoms than the children had ever dreamed of seeing. At last, before they took the carpet home, the burglar, now married and comfortably settled, stood up to make a speech.
        - id: ch01-b133
          speaker: burglar
          text: >-
            Ladies, gentlemen, and islanders of every sort, I know you can't understand me, but never mind that. If this is a dream, I'm pleased. If it isn't, I'm even more pleased. If it's somewhere in between, then honestly, I can't say more. I want no more high London society. I've got someone to put my arm around, and this whole island can be my garden plot. If I don't grow broccoli that would make any flower-show judge stare, strike me pink! I only ask these young ladies and gentlemen to bring parsley seed, a penny's worth of radish seed, threepence of onion seed, and perhaps fourpence or fivepence of mixed kale. I haven't a farthing, so I won't pretend otherwise. One more thing. Please take the parson away. I don't care for people I can see halfway through. Here's to you all!
        - id: ch01-b134
          speaker: narrator
          text: >-
            With that toast, he drained a coconut shell filled with palm wine. By now it was past midnight where the children lived, although on the sunny island it was only teatime. The children offered the bride and groom all their best wishes and finally said goodbye. They also gathered up the transparent clergyman, carried him away on the carpet, and restored him to his own study beside the marble presentation clock.
        - id: ch01-b135
          speaker: narrator
          text: >-
            The children did not forget the seeds requested in the wedding speech. The next day, the Phoenix kindly carried them across the sea to the burglar and his bride. When the bird returned, it brought the most satisfactory report of how the newly married couple had begun their life together.
        - id: ch01-b136
          speaker: phoenix
          text: >-
            He has made a wooden spade and begun work on his garden. She is weaving him a shirt and trousers of the most dazzling white.
        - id: ch01-b137
          speaker: narrator
          text: >-
            The police never learned how the burglar had escaped from a locked cell without passing through the station. No clue ever explained his disappearance, and the puzzle was never solved. At Kentish Town Police Station, the impossible escape is remembered to this day. The officers still speak of it with lowered voices as the Persian mystery.
        - id: ch01-b138
          speaker: narrator
          text: >-
            As for Reverend Septimus Blenkinsop, he remained certain that he had suffered a very strange and serious fit. Too much study must have caused it, he decided. For a change, he planned a little dissipation. He took his two unmarried aunts all the way to Paris, where the three of them enjoyed a dazzling round of museums and picture galleries. They returned home feeling that at last they had truly seen life.
        - id: ch01-b139
          speaker: narrator
          text: >-
            He never told his aunts, or anyone else, about the island wedding. No one likes the whole world to know about an insane fit, however unusual and interesting it may have been.
