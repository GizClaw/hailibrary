  chapters:
    - id: ch01
      title: THE TOPLESS TOWER
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The children had watched the Phoenix hatch in the flames of their own nursery grate. It had told them that the carpet on their nursery floor was a wishing carpet, able to carry them wherever they chose. The carpet had taken them safely to bed, and the Phoenix had settled for the night on the pole above the boys' window curtains.
        - id: ch01-b02
          speaker: phoenix
          text: >-
            Excuse me. I hear the servants downstairs preparing food. Wake up, please. We need a word about our arrangements. And please don't strike me.
        - id: ch01-b03
          speaker: narrator
          text: >-
            A courteous beak had gently opened Cyril's right eye. Cyril struck out, as boys often do when they are suddenly awakened. The Phoenix, unused to boys, fluttered crossly back to the curtain pole. Its feelings were hurt, even if its wings were not.
        - id: ch01-b04
          speaker: cyril
          text: >-
            Sorry! Please come back. What were you saying? Was it something about bacon and rations?
        - id: ch01-b05
          speaker: narrator
          text: >-
            The Phoenix returned to the brass rail at the foot of the bed. Cyril stared at it, fully awake now.
        - id: ch01-b06
          speaker: cyril
          text: >-
            You really are real. How ripping! And what about the carpet?
        - id: ch01-b07
          speaker: phoenix
          text: >-
            The carpet is as real as it ever was. But naturally, a carpet is merely a carpet, while a Phoenix is superlatively a Phoenix.
        - id: ch01-b08
          speaker: cyril
          text: >-
            Yes, I can see that. What luck! Wake up, Bobs. There really is something worth waking for today, and it's Saturday too.
        - id: ch01-b09
          speaker: phoenix
          text: >-
            During the silent hours of the night, I reflected on your behavior. I was forced to conclude that you were not nearly astonished enough when I appeared yesterday. The ancients were always extremely surprised. Did you expect my egg to hatch?
        - id: ch01-b10
          speaker: cyril
          text: >-
            We certainly didn't.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Anthea heard the Phoenix's silvery voice and came in wearing her nightgown.
        - id: ch01-b12
          speaker: anthea
          text: >-
            Even if we'd expected it to hatch, we could never have imagined anything as splendid as you.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The bird smiled. Perhaps you have never seen a bird smile. The morning was cold, so Anthea wrapped herself in the boys' bedcover and explained that strange things had happened to them before. She told the Phoenix all about the Psammead, the sand-fairy.
        - id: ch01-b14
          speaker: phoenix
          text: >-
            Ah, yes. Psammeads were rare even in my time. I remember people used to call me the Psammead of the Desert. Compliments were always being paid to me. I cannot imagine why.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Jane had come in by then as well.
        - id: ch01-b16
          speaker: jane
          text: >-
            Can you grant wishes too?
        - id: ch01-b17
          speaker: phoenix
          text: >-
            Dear me, no. At least, that is a question for later. Someone is coming, and I must conceal myself at once.
        - id: ch01-b18
          speaker: narrator
          text: >-
            And it did. That Saturday was Cook's birthday. Mother had let Cook and Eliza go to the Crystal Palace with friends, so Jane and Anthea had to help make the beds and wash the breakfast cups. Robert and Cyril meant to spend the morning talking to the Phoenix, but the bird had plans of its own.
        - id: ch01-b19
          speaker: phoenix
          text: >-
            I must have an hour or two of peace. My nerves will fail unless I rest. Remember, I have gone two thousand years without conversation. I am out of practice and must take care of myself. I have often been told that my life is valuable.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The Phoenix curled up inside one of Father's old hatboxes, tucked its golden head beneath its golden wing, and fell asleep. The box had recently come down from the box-room because the children needed a helmet for a tournament game.

            Robert and Cyril moved the table away from the carpet. They were about to sit down and wish themselves somewhere else when Cyril hesitated.
        - id: ch01-b21
          speaker: cyril
          text: >-
            Perhaps it would be rather sneaky to start without the girls.
        - id: ch01-b22
          speaker: robert
          text: >-
            They'll be busy all morning.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Robert was impatient, but something inside him asked why he did not help them. Tiresome books sometimes call that voice the inward monitor. Cyril's inward monitor spoke at the very same moment. So the boys joined the girls. They washed the breakfast cups and dusted the drawing room together. Robert became so interested that he offered to clean the front steps, something he had never been allowed to do. He was not allowed this time either, and one reason was that Cook had already cleaned them.

            When the work was done, the girls dressed the happy, wriggling baby in his blue highwayman's coat and three-cornered hat. They kept him amused while Mother changed her dress and prepared to take him to Granny's. Mother went there every Saturday, usually with some of the children. Today they were staying behind to keep house. Every time they remembered that the house contained both a Phoenix and a wishing carpet, their hearts filled with delight.

            The Noah's Ark game could keep the Lamb good and happy for quite a long time. It was simple. He sat on someone's lap and announced what animal he was. Then the person holding him said the little verse that belonged to that animal. Some animals, such as zebras and tigers, had no verse because their names were so difficult to rhyme. The Lamb understood perfectly well which animals were poetry animals and which were not.
        - id: ch01-b24
          speaker: lamb
          text: >-
            I'm a baby bear!
          emotion: happy
        - id: ch01-b25
          speaker: narrator
          text: >-
            The Lamb snuggled down, and Anthea began his rhyme.
        - id: ch01-b26
          speaker: anthea
          text: >-
            I love my little baby bear. I love his nose and toes and hair. I like to hold him in my arm and keep him very safe and warm.
        - id: ch01-b27
          speaker: narrator
          text: >-
            On the word "very," she gave him a true bear hug. Then he became an eel, and Anthea tickled him until he wriggled like a real one.
        - id: ch01-b28
          speaker: anthea
          text: >-
            I love my little baby eel. He's very squidglety to feel. He'll be an eel when he is big, but now he's just a tiny snig!
        - id: ch01-b29
          speaker: narrator
          text: >-
            Perhaps you did not know that a snig is a baby eel. It is, and the Lamb knew it.
        - id: ch01-b30
          speaker: lamb
          text: >-
            Hedgehog now!
          emotion: happy
        - id: ch01-b31
          speaker: anthea
          text: >-
            My baby hedgehog, how I like you, though your back is prickly-spiky. Your front is very soft, I've found, so I must love you front ways round!
        - id: ch01-b32
          speaker: narrator
          text: >-
            She loved him front ways round, and he squealed with pleasure. It is a very babyish game, and the rhymes are only for very small people, not people old enough to read books, so I will tell you no more of them.

            By the time the Lamb had also been a baby lion, a baby weasel, a baby rabbit, and a baby rat, Mother was ready. Everyone kissed Mother and the Lamb. They hugged them as thoroughly as anyone can be hugged while dressed to go outdoors. The boys saw them safely to the tram. When the boys returned to the house, each child looked at all the others. They knew their moment had come.
        - id: ch01-b33
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: >-
            Now!
        - id: ch01-b34
          speaker: narrator
          text: >-
            They locked both doors and fastened every window. They moved the table and chairs off the carpet, and Anthea swept it.
        - id: ch01-b35
          speaker: anthea
          text: >-
            We ought to give it a little care. Next time we'll use tea leaves. Carpets like tea leaves.
        - id: ch01-b36
          speaker: narrator
          text: >-
            They all put on their outdoor clothes before sitting on the carpet. As Cyril pointed out, no one knew what country or climate they might reach. Besides, people stare if children go out in November wearing pinafores and no hats.

            Robert gently woke the Phoenix. It yawned, stretched, and allowed him to place it in the middle of the carpet. At once it tucked its crested head under one golden wing and fell asleep again. The four children sat down around it.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Naturally, the first question was where to go, and they discussed it warmly. Anthea wanted to see Japan. Robert and Cyril both voted for America. Jane wanted the carpet to take them to the seaside instead.
        - id: ch01-b38
          speaker: jane
          text: >-
            There are donkeys at the seaside.
        - id: ch01-b39
          speaker: cyril
          text: >-
            Not in November, silly.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The argument grew warmer and warmer. Everyone had a reason for choosing a different place, and still they could settle nothing.
        - id: ch01-b41
          speaker: robert
          text: >-
            Let's have the Phoenix choose.
        - id: ch01-b42
          speaker: narrator
          text: >-
            They stroked the Phoenix until it woke.
        - id: ch01-b43
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            We want to go somewhere abroad, but we can't agree where.
        - id: ch01-b44
          speaker: phoenix
          text: >-
            Then let the carpet decide, if it has a mind. Simply wish to go abroad.
        - id: ch01-b45
          speaker: narrator
          text: >-
            They made the wish. At once, the whole world seemed to turn upside down around them. When it righted itself, they had to wait for the dizziness to pass before they could look around. Then they saw that they were outdoors.

            But "outdoors" hardly describes it. They were outside the earth, or at least above it, floating safely and splendidly in the sharp, clear air. The pale, bright blue sky arched overhead. Far below, the sea was pale too, and the sun scattered diamonds across its waves. The carpet had somehow made itself stiff, square, and firm as a raft. It steered itself beautifully, kept a fearless, level course, and never tipped enough to make anyone afraid of falling. Ahead of them lay the land.
        - id: ch01-b46
          speaker: phoenix
          text: >-
            That is the coast of France. Where would you like to go? Of course, you should always save one wish for emergencies. Otherwise you may find yourself in an emergency from which you cannot emerge.
        - id: ch01-b47
          speaker: narrator
          text: >-
            The children were much too interested to listen.
        - id: ch01-b48
          speaker: cyril
          text: >-
            Let's keep going until we see somewhere we really want to visit, and then we'll stop. Isn't this ripping?
        - id: ch01-b49
          speaker: narrator
          text: >-
            They swept over the low coast and followed a steady path above neat fields and straight roads lined with poplar trees.
        - id: ch01-b50
          speaker: anthea
          text: >-
            It's like an express train, except you can actually see things. On trains, grown-ups always want the windows shut. Then they breathe on the glass until it turns cloudy, no one can see out, and they all go to sleep.
        - id: ch01-b51
          speaker: robert
          text: >-
            It's like tobogganing too. It's just as fast and smooth, but there's no doormat to stop you with a bump. It keeps going and going.
        - id: ch01-b52
          speaker: jane
          text: >-
            You darling Phoenix, this is all because of you. Look at that dear little church, and those women with the flappy caps on their heads!
          emotion: happy
        - id: ch01-b53
          speaker: phoenix
          text: >-
            Please do not mention it.
        - id: ch01-b54
          speaker: cyril
          text: >-
            Oh, look at everything down there! And then think of Kentish Town Road!
          emotion: happy
        - id: ch01-b55
          speaker: narrator
          text: >-
            They did look, and they did think. The glorious journey went on, smooth, steady, and swift. Strange and beautiful sights passed below one after another. Sometimes the children held their breath in wonder. Then they let it out in deep sighs. They kept pointing and crying, "Oh!" and "Ah!" until the proper time for dinner was far behind them.
        - id: ch01-b56
          speaker: jane
          text: >-
            I wish we'd brought the jam tart and the cold mutton. We could have had a lovely picnic up here.
        - id: ch01-b57
          speaker: narrator
          text: >-
            The tart and mutton were far away. They sat quietly in the larder of the Camden Town house the children were supposed to be guarding. At that very moment, a mouse was sampling the raspberry part of the tart. She had nibbled through the pastry edge until she made a little gulf, or perhaps a bay, and now she was tasting the jam beyond it. She had already eaten a very good dinner herself. What she wanted to know was whether this meal was suitable enough to ask her little mouse-husband to share. It is an ill wind that blows nobody any good.
        - id: ch01-b58
          speaker: anthea
          text: >-
            We'll stop when we find a nice place. I have threepence, and you boys each have the fourpence you saved on tram fares. We can buy food. I expect the Phoenix speaks French.
        - id: ch01-b59
          speaker: narrator
          text: >-
            The carpet sailed onward over rocks and rivers, trees and towns, farms and fields. Watching the world pass beneath them reminded every child of the day they had all possessed wings. On that adventure, they had flown to the top of a church tower and eaten a feast there. It had included chicken and tongue, new bread, and soda-water. Remembering every part of that meal made them notice their hunger much more strongly.

            Then they saw ruined walls on a hill. Rising among them, straight and strong and almost new-looking, stood a great square tower.
        - id: ch01-b60
          speaker: jane
          text: >-
            The top is exactly the size of the carpet. We ought to land there. Then none of the Abby-something people, I mean the natives, could take the carpet. Some of us could go buy food honestly instead of taking it from larder windows.
        - id: ch01-b61
          speaker: anthea
          text: >-
            I think another place might be better.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Jane suddenly clenched her hands.
        - id: ch01-b63
          speaker: jane
          text: >-
            Why should I never get what I want just because I'm the youngest? I wish the carpet would fit itself into the top of that tower. So there!
          emotion: angry
        - id: ch01-b64
          speaker: narrator
          text: >-
            The carpet gave an alarming bound. In the next moment, it hovered above the square tower. Then it began to sink, slowly and carefully, like a lift going down in the Army and Navy Stores.
        - id: ch01-b65
          speaker: robert
          text: >-
            We shouldn't make wishes unless we all agree first. Hullo! What on earth is happening?
        - id: ch01-b66
          speaker: narrator
          text: >-
            Something gray was unexpectedly rising on every side of the carpet. It looked exactly as though four stone walls were being built around them at magical speed. First the gray edge stood one foot high. Then it reached two feet, three, four, and five. More and more daylight vanished as the walls closed around their view. Anthea looked up at the patch of sky and then at the walls, which now rose six feet above them.
        - id: ch01-b67
          speaker: anthea
          text: >-
            We're sinking into the tower! It never had a top! The carpet means to fit itself into the bottom!
          emotion: fearful
        - id: ch01-b68
          speaker: narrator
          text: >-
            Robert jumped up.
        - id: ch01-b69
          speaker: robert
          text: >-
            We ought to have checked first. Hullo! There's an owl's nest.
        - id: ch01-b70
          speaker: narrator
          text: >-
            He put one knee on a smooth ledge of stone and reached into a deep window slit. It was broad inside the tower and narrowed like a funnel toward the outer wall.
        - id: ch01-b71
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Hurry, Robert!
          emotion: fearful
        - id: ch01-b72
          speaker: narrator
          text: >-
            Robert did not hurry enough. There were no eggs in the nest, and by the time he pulled out his hand, the carpet had dropped eight feet below him.
        - id: ch01-b73
          speaker: cyril
          text: >-
            Jump, you silly cuckoo!
          emotion: fearful
        - id: ch01-b74
          speaker: narrator
          text: >-
            Robert could not instantly twist himself into a jumping position. He wriggled, twisted, and finally pulled himself onto the broad ledge. By the time he was ready to leap, the others had sunk thirty feet beneath him. Robert was left alone in the window opening, and even the owls were away that day.

            The wall was too smooth to climb up, and climbing down was impossible. Robert covered his face and squirmed away from the dizzy edge until his back was wedged tightly into the narrow end of the slit. He was safe there, but the outer opening framed a view of the tower's opposite wall. Moss and tiny shining stones made it very pretty. Between Robert and that wall lay the full width of the tower, with nothing but empty air below.

            It was a dreadful position. The pretty stones across the hollow tower only made the empty air between them seem worse. In a flash, Robert understood that the carpet might lead them into the same sort of tight places as the Psammead's wishes used to do. Far below, the carpet carried the others slowly and steadily toward the ground, leaving Robert clinging to the wall above. Robert did not try to imagine their feelings. He had quite enough to do with his own, though you may imagine them if you like.
        - id: ch01-b75
          speaker: narrator
          text: >-
            At last the carpet reached the ground inside the tower. The moment it stopped, it lost the stiff, raft-like firmness that had been such a comfort on the journey from Camden Town. It spread limply over loose stones and little mounds of earth, exactly like an ordinary carpet. Then it suddenly shrank and seemed to pull itself from under their feet. The children quickly stepped over its edges onto firm ground. The carpet kept drawing itself inward until it reached its usual size. It no longer fitted the tower from wall to wall, and a wide space lay all around it.

            They stood on opposite sides of the carpet and looked at one another. Then every chin tipped upward at once. Every pair of eyes searched the shadowy height of the tower, trying in vain to discover where poor Robert had been left. From the ground, they could not see him at all.
        - id: ch01-b76
          speaker: jane
          text: >-
            I wish we hadn't come.
          emotion: sad
        - id: ch01-b77
          speaker: cyril
          text: >-
            You always do. Listen, we can't leave Robert up there. I wish the carpet would bring him down.
        - id: ch01-b78
          speaker: narrator
          text: >-
            The carpet seemed to wake from a dream and remember what it could do. It briskly pulled itself together, grew stiff again, and floated upward between the four walls. The children below craned their heads so far back that they nearly hurt their necks. Higher and higher the carpet climbed through the dim tower. For one or two anxious moments, it hung darkly above them where Robert had been trapped.

            At last it dropped back to the tower floor. As it landed on the uneven stones, it tumbled Robert out.
        - id: ch01-b79
          speaker: robert
          text: >-
            Oh, glory! That was close. You have no idea how it felt. I've had enough for now. Let's wish ourselves home and eat that jam tart and mutton. We can come out again later.
        - id: ch01-b80
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Right!
        - id: ch01-b81
          speaker: narrator
          text: >-
            The adventure had shaken everyone's nerves. They climbed onto the carpet again.
        - id: ch01-b82
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            We wish we were at home!
        - id: ch01-b83
          speaker: narrator
          text: >-
            And there they were, no more at home than before. The carpet did not move. The Phoenix had used the opportunity to fall asleep. Anthea gently woke it.
        - id: ch01-b84
          speaker: anthea
          text: >-
            Look at this.
        - id: ch01-b85
          speaker: phoenix
          text: >-
            I am looking.
        - id: ch01-b86
          speaker: jane
          text: >-
            We wished to go home, and we're still here.
        - id: ch01-b87
          speaker: phoenix
          text: >-
            Yes. I can see that perfectly.
        - id: ch01-b88
          speaker: cyril
          text: >-
            But we did wish to go home.
        - id: ch01-b89
          speaker: phoenix
          text: >-
            No doubt you did.
        - id: ch01-b90
          speaker: robert
          text: >-
            And the carpet hasn't moved at all.
        - id: ch01-b91
          speaker: phoenix
          text: >-
            No. I see that it has not.
        - id: ch01-b92
          speaker: robert
          text: >-
            I thought it was a wishing carpet.
        - id: ch01-b93
          speaker: phoenix
          text: >-
            It certainly is.
        - id: ch01-b94
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Then why didn't it work?
        - id: ch01-b95
          speaker: phoenix
          text: >-
            I did warn you. But you are all so fond of the music of your own voices. Each of us finds that particular music delightful, so perhaps I should not be surprised.
        - id: ch01-b96
          speaker: cyril
          text: >-
            What exactly did you warn us about?
          emotion: angry
        - id: ch01-b97
          speaker: phoenix
          text: >-
            Why, the carpet grants only three wishes each day, and you have used all three.
        - id: ch01-b98
          speaker: narrator
          text: >-
            A heartfelt silence followed.
        - id: ch01-b99
          speaker: cyril
          text: >-
            Then how are we supposed to get home?
        - id: ch01-b100
          speaker: phoenix
          text: >-
            I have no idea. May I fly out and fetch you some small thing?
        - id: ch01-b101
          speaker: cyril
          text: >-
            How would you carry the money to pay for it?
        - id: ch01-b102
          speaker: phoenix
          text: >-
            Payment is unnecessary. Birds take whatever they need. No one calls it stealing, except when magpies do it.
        - id: ch01-b103
          speaker: narrator
          text: >-
            The children were pleased to learn that they had been right about this on the day they had wings and ate someone else's ripe plums.
        - id: ch01-b104
          speaker: robert
          text: >-
            Yes, let the Phoenix get us something to eat, anyway.
        - id: ch01-b105
          speaker: anthea
          text: >-
            If it would be so kind, you mean.
        - id: ch01-b106
          speaker: robert
          text: >-
            If you would be so kind. We can think of a plan while you're gone.
        - id: ch01-b107
          speaker: narrator
          text: >-
            The Phoenix fluttered upward through the gray tower and disappeared over the top. Only when it was completely gone did Jane speak.
        - id: ch01-b108
          speaker: jane
          text: >-
            What if it never comes back?
          emotion: fearful
        - id: ch01-b109
          speaker: narrator
          text: >-
            It was not a pleasant thought, and it cast a new gloom over them.
        - id: ch01-b110
          speaker: anthea
          text: >-
            Of course it will return. I'm sure the Phoenix keeps its word.
        - id: ch01-b111
          speaker: narrator
          text: >-
            Strangely enough, the tower had no door anywhere that they could see. Every window opening was far, far above them, beyond the reach of even the boldest climber. The bare stone enclosure was cold as well, and Anthea began to shiver.
        - id: ch01-b112
          speaker: cyril
          text: >-
            It's like sitting at the bottom of a well.
        - id: ch01-b113
          speaker: narrator
          text: >-
            They waited in hungry, unhappy silence. Again and again, they tipped their small heads backward and stared all the way up the inside of the tall gray tower. They watched the bright opening above for the first sign of the Phoenix, until holding their heads that way made all their necks stiff.
        - id: ch01-b114
          speaker: narrator
          text: >-
            At last the Phoenix appeared high above them. It looked enormous as it fluttered down between the walls, and the children watched its strange shape grow nearer. Soon they saw the reason for its size. One claw held a whole basket of boiled chestnuts. The other claw carried a piece of bread, while its beak gripped a very large pear.

            The pear was juicy enough to serve as a very small drink. They shared everything, and after the meal, everyone felt better. Now they could discuss how to get home without becoming disagreeable. Yet no one could discover a way out of their difficulty, or even a way out of the tower itself. The Phoenix's beak and claws had fortunately been strong enough to carry food for them. It was plainly not strong enough to fly through the air carrying four well-fed children.
        - id: ch01-b115
          speaker: robert
          text: >-
            I suppose we'll have to stay here and shout now and then. Someone will hear us, bring ropes and ladders, and rescue us like miners. Then they'll collect money to send us home, the way people do for castaways.
        - id: ch01-b116
          speaker: cyril
          text: >-
            But we won't get back before Mother. Father will take the carpet away and say it's dangerous, or something like that.
        - id: ch01-b117
          speaker: jane
          text: >-
            I do wish we hadn't come.
          emotion: sad
        - id: ch01-b118
          speakers: [robert, cyril]
          ensemble: duo
          text: >-
            Oh, shut up!
        - id: ch01-b119
          speaker: narrator
          text: >-
            Anthea did not join them. Instead, she suddenly woke the Phoenix.
        - id: ch01-b120
          speaker: anthea
          text: >-
            I believe you can help us. Oh, please do!
        - id: ch01-b121
          speaker: phoenix
          text: >-
            I will do everything within my power. What is it you want now?
        - id: ch01-b122
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            We want to go home!
        - id: ch01-b123
          speaker: phoenix
          text: >-
            Oh. Ah. Yes. You said "home." What do you mean by that?
        - id: ch01-b124
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            The place where we live. Where we slept last night. Where the altar stands that your egg hatched on.
        - id: ch01-b125
          speaker: phoenix
          text: >-
            Oh, that place. I shall do my best.
        - id: ch01-b126
          speaker: narrator
          text: >-
            The Phoenix stepped onto the carpet and walked slowly up and down across it. For several minutes, it remained deep in thought while the children waited. At last, the bird stopped pacing and drew itself up proudly.
        - id: ch01-b127
          speaker: phoenix
          text: >-
            I can help you. I am almost certain of it. Unless I am grossly mistaken, I can help. You will not mind if I leave you for an hour or two?
        - id: ch01-b128
          speaker: narrator
          text: >-
            Without waiting for an answer, it soared through the dim tower into the bright sky.
        - id: ch01-b129
          speaker: cyril
          text: >-
            It said an hour or two. I've read about prisoners in dungeons and catacombs waiting to be freed, and every moment feels like forever. They always find something to do while they wait. There isn't time for us to tame spiders, though.
        - id: ch01-b130
          speaker: jane
          text: >-
            I hope there isn't.
        - id: ch01-b131
          speaker: cyril
          text: >-
            We ought to scratch our names on the stones, or do something like that.
        - id: ch01-b132
          speaker: robert
          text: >-
            Speaking of stones, look at that pile in the corner. I'm sure there's an opening behind it. I think it's a door. See the arch in the wall? And here's a hole. It's completely black inside.
        - id: ch01-b133
          speaker: narrator
          text: >-
            As he spoke, Robert climbed the heap, pulled away its top stone, and uncovered a small dark space. In an instant, everyone was dragging down stones. Soon they took off their jackets because the work was so warm.
        - id: ch01-b134
          speaker: cyril
          text: >-
            It really is a door. That may turn out to be lucky.
        - id: ch01-b135
          speaker: narrator
          text: >-
            He had been going to say, "if anything happens to the Phoenix," but stopped because it might frighten Jane. Cyril was not an unkind boy whenever he had enough time to think before he spoke.

            The arched opening grew larger and larger. It looked very black, even beside the twilight at the tower's base. The children kept tugging down the old stones and throwing them onto a second heap. The stones must have blocked the opening for a very long time. Moss covered them, and in places it stuck one stone tightly to the next. Pulling them apart was hard work, as Robert took care to point out.

            When the opening reached halfway up the arch, Robert and Cyril carefully lowered themselves inside and struck matches. They were grateful that their sensible father let them carry matches. He only insisted that the boys use the kind that would strike on their own box and nowhere else.
        - id: ch01-b136
          speaker: robert
          text: >-
            It isn't a door. It's a tunnel. Stand back, and we'll shove down more stones!
        - id: ch01-b137
          speaker: narrator
          text: >-
            They worked with great excitement. More stones came loose and crashed onto the new heap until almost all the old pile was gone. Before the girls stood the dark archway, leading inward toward things no one knew. The danger of being trapped in the tower disappeared from every mind. So did every worry about getting home. That black opening was too thrilling. It felt like an adventure from Monte Cristo.
        - id: ch01-b138
          speaker: anthea
          text: >-
            Come out at once! Shut-up places always have bad air. It puts out your torches, and then you die. I think it's called fire-damp. Come out, I tell you!
          emotion: fearful
        - id: ch01-b139
          speaker: narrator
          text: >-
            Her voice was so urgent that the boys obeyed. Everyone picked up a jacket and fanned air into the arch. When Anthea decided it must be fresh enough, Cyril led the way inside.

            The girls followed Cyril into the arch, and Robert brought up the rear. Jane flatly refused to walk last. She was certain that "something" might come into the tunnel behind her and catch at her from the darkness. Cyril advanced cautiously, striking one match after another and peering ahead into each small circle of light.
        - id: ch01-b140
          speaker: cyril
          text: >-
            The roof is vaulted, and everything is stone. Panther, stop tugging my jacket. The matches keep burning, so the air must be safe. Wait. There are steps going down.
        - id: ch01-b141
          speaker: jane
          text: >-
            Please don't go any farther. There must be snakes, or lions' dens, or something. Let's come back another day with candles and bellows for the fire-damp.
          emotion: fearful
        - id: ch01-b142
          speaker: robert
          text: >-
            Then let me go in front. This is exactly where buried treasure would be, and I'm going on. You may stay here if you want.
        - id: ch01-b143
          speaker: narrator
          text: >-
            Of course, Jane agreed to continue rather than remain behind. Very slowly and carefully, the children went down the stone steps. There were seventeen of them altogether. At the bottom, more passages branched away in four different directions. On the right was a low arch. It was much too low to be the start of another ordinary passage, and Cyril wondered what could be inside it.

            Cyril knelt, lit a match, bent almost double, and looked inside.
        - id: ch01-b144
          speaker: cyril
          text: >-
            There's something in here.
        - id: ch01-b145
          speaker: narrator
          text: >-
            He reached one hand into the low opening. His fingers met something that felt less like a treasure than a damp canvas sack stuffed full of marbles. It was unlike anything else Cyril had ever touched.
        - id: ch01-b146
          speaker: cyril
          text: >-
            I think it really is buried treasure!
          emotion: surprised
        - id: ch01-b147
          speaker: anthea
          text: >-
            Hurry, Squirrel! Pull it out!
          emotion: surprised
        - id: ch01-b148
          speaker: narrator
          text: >-
            Cyril dragged out a rotting canvas bag, about the size of the paper sacks a greengrocer used for sixpence worth of Barcelona nuts.
        - id: ch01-b149
          speaker: cyril
          text: >-
            There's much more in there. A whole lot more.
        - id: ch01-b150
          speaker: narrator
          text: >-
            As he dragged it toward him, the rotten canvas gave way. Gold coins spilled in every direction. They ran and spun over the stone, jumped and bumped against one another, and filled the dark passage with chinks and clinks.

            What would you say if you suddenly discovered buried treasure? Cyril spoke just as the match flame touched him.
        - id: ch01-b151
          speaker: cyril
          text: >-
            Oh, bother! I've burned my fingers. And that was the last match!
          emotion: angry
        - id: ch01-b152
          speaker: narrator
          text: >-
            He dropped it. For one terrible moment, no one spoke. Then Jane began to cry.
        - id: ch01-b153
          speaker: anthea
          text: >-
            Don't cry, Pussy. You'll use up the air. We can find our way out.
          emotion: calm
        - id: ch01-b154
          speaker: jane
          text: >-
            Yes, and when we get back, the Phoenix will have come and gone again. It will think we found another way home. Oh, I wish we had never come!
          emotion: sad
        - id: ch01-b155
          speaker: narrator
          text: >-
            Everyone stood perfectly still. Anthea hugged Jane and tried to wipe her eyes in the darkness.
        - id: ch01-b156
          speaker: jane
          text: >-
            D-don't! That's my ear. I don't cry with my ears.
          emotion: sad
        - id: ch01-b157
          speaker: robert
          text: >-
            Come on. Let's get out of here.
        - id: ch01-b158
          speaker: narrator
          text: >-
            That was easier to say than to do. No one could remember exactly which of the branching passages they had used. It is extremely hard to remember such things in complete darkness unless you have matches with you. Then, of course, remembering is quite different, even if you do not actually strike one.

            By now, everyone had come to share Jane's constant wish that they had never come. Despair seemed to make the blackness deeper than before. Then, without warning, the floor felt as if it had tipped beneath them. Every child had the strong sensation of being whirled around in a moving lift. Every eye was shut. One's eyes always are shut in the dark, do you not think? When the whirling feeling stopped, Cyril spoke.
        - id: ch01-b159
          speaker: cyril
          text: >-
            Earthquake!
          emotion: surprised
        - id: ch01-b160
          speaker: narrator
          text: >-
            They all opened their eyes together. They were standing in their own dingy breakfast room at home. After that black underground passage, the familiar room looked wonderfully light and bright. It felt safe, pleasant, and altogether delightful. The carpet lay calmly on the floor, looking as though it had never taken an excursion in its life. The Phoenix stood upon the mantelpiece. With an air both modest and full of sterling worth, it waited for the children to thank it.

            The children thanked it again and again. Then they all asked the same question.
        - id: ch01-b161
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            But how did you do it?
        - id: ch01-b162
          speaker: phoenix
          text: >-
            Oh, I merely went to your friend the Psammead and obtained a wish.
        - id: ch01-b163
          speaker: cyril
          text: >-
            How did you know where to find the Psammead?
        - id: ch01-b164
          speaker: phoenix
          text: >-
            The carpet told me. Wishing creatures always know about one another. They are very clannish, rather like the Scots. They are all related, you know.
        - id: ch01-b165
          speaker: jane
          text: >-
            The carpet can't talk, can it?
        - id: ch01-b166
          speaker: phoenix
          text: >-
            No.
        - id: ch01-b167
          speaker: cyril
          text: >-
            Then how did it tell you?
        - id: ch01-b168
          speaker: phoenix
          text: >-
            I have already said that I got the Psammead's address from the carpet.
        - id: ch01-b169
          speaker: jane
          text: >-
            So it did speak?
        - id: ch01-b170
          speaker: phoenix
          text: >-
            No. It said nothing. I gathered the information from something in its manner. I have always been an exceptionally observant bird.
        - id: ch01-b171
          speaker: narrator
          text: >-
            First came the cold mutton and the jam tart. Then came tea and bread-and-butter as well. Not until all of it had been eaten did anyone find time to regret the golden treasure they had left scattered across the floor of the underground passage. From the moment Cyril burned his fingers in the flame of the final match until now, not one of them had thought of the coins at all.
        - id: ch01-b172
          speaker: robert
          text: >-
            What complete owls and goats we were! We've always wanted treasure, and now we've left it behind.
        - id: ch01-b173
          speaker: anthea
          text: >-
            Never mind. We'll go back and collect it all. Then we can give presents to everyone.
        - id: ch01-b174
          speaker: narrator
          text: >-
            For more than a quarter of an hour, they happily planned which gifts to give and who should receive them. Every claim of generosity had to be considered and satisfied. After that pleasant duty was complete, their thoughts turned to themselves. For another fifty minutes, they discussed all the things they would buy with the treasure.

            Robert was deep in a very technical description of the motorcar that would carry him to and from school when Cyril cut him off.
        - id: ch01-b175
          speaker: cyril
          text: >-
            That's enough. Stop talking. None of it matters, because we can never go back. We don't know where the tower is.
        - id: ch01-b176
          speaker: jane
          text: >-
            Don't you know where it is?
          emotion: sad
        - id: ch01-b177
          speaker: phoenix
          text: >-
            I have not the least idea.
        - id: ch01-b178
          speaker: cyril
          text: >-
            Then the treasure is lost.
        - id: ch01-b179
          speaker: narrator
          text: >-
            And it was.
        - id: ch01-b180
          speaker: anthea
          text: >-
            At least we still have the carpet and the Phoenix.
        - id: ch01-b181
          speaker: phoenix
          text: >-
            Excuse me. I greatly dislike interfering, but surely you mean the Phoenix and the carpet?
