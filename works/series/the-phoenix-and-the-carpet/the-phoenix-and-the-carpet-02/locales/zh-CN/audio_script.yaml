audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带一点英式童话的机智
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明自信，挖苦人时一本正经
        timbre: 清脆的少年声
        pace: 中等偏快
        pitch: 中高
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴敏锐，急切时仍然清楚
        timbre: 柔和明亮的少女声
        pace: 中等
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 坚持己见，认真里常带几分莽撞
        timbre: 结实清朗的少年声
        pace: 中等
        pitch: 中等
    jane:
      display_name: 简
      tts:
        delivery: 天真直率，话里带着小孩子的认真
        timbre: 稚嫩柔软的女孩声
        pace: 稍慢
        pitch: 偏高
    lamb:
      display_name: 小羊羔
      tts:
        delivery: 稚气快活，说话简短直接
        timbre: 柔软清亮的幼童声
        pace: 稍慢
        pitch: 高
    phoenix:
      display_name: 凤凰
      tts:
        delivery: 文雅自负，庄重中带着敏锐的幽默
        timbre: 华美清润，中性而成熟
        pace: 从容
        pitch: 中高
    exasperated_child:
      display_name: 恼火的孩子
      tts:
        delivery: 急躁直率，忍不住插话
        timbre: 清亮的少年声
        pace: 偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 凤凰的星期六早晨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 孩子们已经亲眼见过凤凰从自家育儿室的炉火里孵出来，也听它讲过，铺在育儿室地板上的旧地毯原来是一张许愿毯。只要说出想去的地方，它就能带人前往。昨晚，地毯赶在恰到好处的时候把他们送回了床上，凤凰则飞到男孩子房间里支撑窗帘的檐口上，栖在那里过夜。第二天一早，一个温柔的声音响起来。一只彬彬有礼的鸟喙又轻又巧，十分体贴地扒开了西里尔的右眼。
        - id: ch01-b02
          speaker: phoenix
          text: 恕我打扰。我听见楼下的奴仆在准备食物。请醒一醒，我们有些事情需要解释，还得好好商量。真希望你别……
        - id: ch01-b03
          speaker: narrator
          text: 西里尔猛然惊醒，像所有突然被叫醒的男孩子一样挥手乱打。凤凰气恼地飞回横杆。它没见识过男孩子，翅膀虽然没受伤，自尊心却很受伤。
        - id: ch01-b04
          speaker: cyril
          text: 对不起，快回来！你刚才说什么？是不是熏肉和口粮？
        - id: ch01-b05
          speaker: narrator
          text: 凤凰落到床脚的黄铜栏杆上。西里尔这才确信，眼前的一切都是真的。
        - id: ch01-b06
          speaker: cyril
          text: 你真的活着，太棒了！那张地毯也是真的吗？
        - id: ch01-b07
          speaker: phoenix
          text: 地毯当然是真的。不过，地毯到底只是一张地毯，凤凰却是无与伦比的凤凰。
        - id: ch01-b08
          speaker: cyril
          text: 的确，我看出来了。鲍勃斯，醒醒！今天可有件了不起的事值得起床，而且还是星期六！
        - id: ch01-b09
          speaker: phoenix
          text: 昨夜万籁俱寂的时候，我想了很久。你们昨天见到我，惊讶得实在不够。古人见到我，总是惊讶万分。难道你们早知道我的蛋会孵出来？
        - id: ch01-b10
          speaker: cyril
          text: 我们哪知道。
        - id: ch01-b11
          speaker: narrator
          text: 安西娅听见凤凰银铃般的声音，穿着睡衣走了进来。天气很冷，她把男孩子们的床罩裹在身上。
        - id: ch01-b12
          speaker: anthea
          text: 就算猜到蛋会孵化，我们也绝不会想到，里面会出来像你这么光彩夺目的凤凰。只是我们以前也遇见过神奇的事。
        - id: ch01-b13
          speaker: narrator
          text: 凤凰笑了。也许你从没看过一只鸟微笑。安西娅把普萨米德，也就是沙仙的故事讲给它听。
        - id: ch01-b14
          speaker: phoenix
          text: 原来如此。即使在我的时代，普萨米德也很罕见。以前人们还叫我“荒漠中的普萨米德”。我总受到这样的恭维，真不明白为什么。
        - id: ch01-b15
          speaker: narrator
          text: 这时，简也进来了。
        - id: ch01-b16
          speaker: jane
          text: 那么，你也能让愿望成真吗？
        - id: ch01-b17
          speaker: phoenix
          text: 哎呀，当然不能。至少……有人走来了，我得赶快藏起来。
        - id: ch01-b18
          speaker: narrator
          text: 这天是星期六，又正好赶上厨娘的生日。妈妈准许厨娘和伊莱扎跟一群朋友去水晶宫，所以简和安西娅得帮忙铺床、洗早餐杯，再做些诸如此类的小事。两个男孩子本想跟凤凰聊上一上午，凤凰却坚持自己必须安静一两个钟头。它说，自己两千年没有跟谁交谈，早已生疏了，再不休息，神经准会垮掉。它还提醒大家，别人常说它的生命十分珍贵。几天前，孩子们玩比武游戏，忽然需要一顶头盔，便从储藏室搬下来一只爸爸的旧帽盒。凤凰钻进盒里，把金色脑袋藏进金色翅膀，很快睡着了。
        - id: ch01-b19
          speaker: narrator
          text: 罗伯特和西里尔挪开桌子，准备坐上地毯，到别处去。还没想好目的地，西里尔先犹豫了。
        - id: ch01-b20
          speaker: cyril
          text: 把女孩子们丢下，咱们自己先走，好像有点不光明正大。
        - id: ch01-b21
          speaker: robert
          text: 可她们得忙上一上午。
        - id: ch01-b22
          speaker: narrator
          text: 罗伯特心里有个声音问他，既然女孩子们要忙上一上午，他为什么不去帮忙。烦人的书有时管这个声音叫“内心的监督者”。碰巧就在同一刻，西里尔的监督者也问了他同样的问题。于是，两个男孩子去帮忙洗茶杯，还给客厅掸了灰。罗伯特干得兴致勃勃，甚至主动提出要擦洗门前的台阶。这件事从前从不准他做，今天仍然没得到许可。其中一个理由是，厨娘早已经擦过了。
        - id: ch01-b23
          speaker: narrator
          text: 家务结束后，女孩子们给快活得扭来扭去的小羊羔穿上蓝色强盗外套，戴好三角帽。妈妈换衣服、准备带他去外婆家时，她们负责逗他开心。每逢星期六，妈妈总会去外婆家，平时往往也带上几个孩子，今天却要把四个大的留在家里看家。等待的时候，女孩子们陪小羊羔玩“诺亚方舟”。玩法很简单。小羊羔坐在膝上，说自己是哪种动物，抱着他的人就念那种动物的儿歌。有些动物，比如斑马和老虎，名字太难押韵，所以没有儿歌。哪些动物有儿歌，小羊羔清楚得很。
        - id: ch01-b24
          speaker: lamb
          text: 我是熊宝宝！
        - id: ch01-b25
          speaker: anthea
          text: 我爱我的小熊宝，爱他鼻子、脚趾和茸毛。我要把他抱在怀里，让他又安全，又暖和得不得了。
        - id: ch01-b26
          speaker: narrator
          text: 念到“不得了”，安西娅就像真正的熊那样紧紧抱他。接着，小羊羔变成鳗鱼。安西娅不停胳肢他，直到他扭得和真鳗鱼一样。
        - id: ch01-b27
          speaker: anthea
          text: 我爱我的鳗鱼宝宝，摸起来滑溜溜、摇呀摇。长大以后他是大鳗鱼，如今只是小小鳗鱼苗。
        - id: ch01-b28
          speaker: narrator
          text: 也许你不知道，小鳗鱼还有这个叫法，可小羊羔知道。接着，他又要当刺猬。
        - id: ch01-b29
          speaker: lamb
          text: 现在是刺猬！
        - id: ch01-b30
          speaker: anthea
          text: 我的刺猬宝宝真可爱，背上尖刺一排排。前胸摸着软绵绵，我要从前面把你爱！
        - id: ch01-b31
          speaker: narrator
          text: 安西娅果真从前面把小羊羔好好爱了一番，他快活得尖声直笑。这是个十足的婴儿游戏，那些儿歌当然也只念给很小很小的人听，不是念给已经大到会读书的人听的，所以余下的就不告诉你们了。后来，小羊羔又先后做了狮子宝宝、鼬鼠宝宝、兔子宝宝和老鼠宝宝。等这些动物全做过一遍，妈妈也终于准备好了。
        - id: ch01-b32
          speaker: narrator
          text: 每个人都亲了妈妈和小羊羔，又隔着出门穿的厚衣服，尽可能结结实实地拥抱了他们。两个男孩子一直把他们送上电车。平常的星期六，总有几个孩子跟妈妈一起去外婆家。可是今天，四个孩子要独自在家。他们每次想起自己要照看的这所房子里，既藏着一只凤凰，又铺着一张许愿毯，心里就满是欢欣喜悦。两个男孩子从电车站回来，四个人互相望着，那个等待已久的时刻终于到了。
        - id: ch01-b33
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 现在就开始！
        - id: ch01-b34
          speaker: narrator
          text: 他们锁好前后门，闩紧所有窗户，搬开地毯上的桌椅。安西娅还把地毯扫了一遍。
        - id: ch01-b35
          speaker: anthea
          text: 也该稍微照料它一下。下次给它撒些茶叶，地毯都喜欢茶叶。
        - id: ch01-b36
          speaker: narrator
          text: 大家穿好外衣。正如西里尔所说，谁也不知道他们最后会去到哪里。况且，十一月里只穿围裙、不戴帽子走到户外，肯定会惹人盯着看。罗伯特轻轻叫醒凤凰。凤凰打了个呵欠，伸展翅膀，任由罗伯特把它抱到地毯中央。它一落下，又把戴羽冠的头埋进金色翅膀，继续睡觉。孩子们围着它坐好，热烈争论起目的地。安西娅想去日本，罗伯特和西里尔投票去美国，简却希望去海边。
        - id: ch01-b37
          speaker: jane
          text: 因为海边有驴子。
        - id: ch01-b38
          speaker: cyril
          text: 十一月才没有呢，傻瓜。
        - id: ch01-b39
          speaker: narrator
          text: 大家越争越起劲，仍然没有结果。最后，罗伯特提议让凤凰决定。孩子们把凤凰摸醒，告诉它，他们想去国外，却拿不定主意。
        - id: ch01-b40
          speaker: phoenix
          text: 要是地毯有主意，就让它来选。你们只要许愿到国外去。
        - id: ch01-b41
          speaker: narrator
          text: 他们照着说了。下一刻，整个世界像是倒过来转了一圈。等世界恢复原样，孩子们不再头晕，才发现自己已经到了户外。
    - id: ch02
      title: 飞越法国
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 只说“户外”，根本形容不了他们的位置。他们像是已经出了地球，或者至少离开了地面，正安全、平稳又神气十足地飘在清冽澄澈的高空。上方是明亮的淡蓝天空，遥远的下方是浅色海浪，灿烂的阳光在浪尖闪烁，仿佛撒满钻石。地毯不知用了什么办法，把自己绷得方方正正，坚实得像一只木筏。它驾驭自己驾驭得极好，始终平展而无所畏惧地向前飞，谁也不怕从边缘摔下去。前面终于出现了陆地。凤凰醒来，用翅膀指向那里。
        - id: ch02-b02
          speaker: phoenix
          text: 那是法国海岸。你们想去哪里？我劝你们永远留一个愿望，以备不时之需。不然真到了紧急关头，也许就再也脱不了身。
        - id: ch02-b03
          speaker: narrator
          text: 可孩子们看得太入迷，谁也没有听进去。
        - id: ch02-b04
          speaker: cyril
          text: 就让它一直飞吧。等看到一个我们真想停的地方，再叫它停。这样多棒！
        - id: ch02-b05
          speaker: narrator
          text: 地毯掠过低平的海岸，沿着整齐田野和白杨夹道的笔直道路向前飞。
        - id: ch02-b06
          speaker: anthea
          text: 这就像坐特快列车。不过火车上的大人总爱关窗，又把气呵在玻璃上，窗子变得像毛玻璃，什么也看不见。然后他们就睡着了。
        - id: ch02-b07
          speaker: robert
          text: 也像坐雪橇，又快又稳。只是前面没有门垫让它突然停住，它会一直滑下去。
        - id: ch02-b08
          speaker: jane
          text: 亲爱的凤凰，这都是你的功劳。快看那座小教堂，多可爱！那些女人头上的帽子还飘来飘去呢。
        - id: ch02-b09
          speaker: phoenix
          text: 不值一提。
        - id: ch02-b10
          speaker: cyril
          text: 啊！你们看看这一切，再想想肯蒂什镇路！
        - id: ch02-b11
          speaker: narrator
          text: 大家全都低头看着陌生而美丽的景物，也全都想起了肯蒂什镇路。地毯继续那场光辉灿烂、流畅、平稳的飞驰。他们望着下方从未见过的风光，一会儿屏住呼吸，一会儿又把那口气化成长长的叹息。他们只顾着发出一声又一声“哦”和“啊”，等到回过神来，午饭时间已经过去很久。
        - id: ch02-b12
          speaker: jane
          text: 真该把果酱馅饼和冷羊肉带来。能在天上野餐，一定快活极了。
        - id: ch02-b13
          speaker: narrator
          text: 可馅饼和羊肉远在别处，正安静地待在卡姆登镇那所房子的食品储藏室里。那所房子本来应该由孩子们照看。就在这个时候，一只母老鼠正在试吃馅饼边缘的树莓果酱。她已经从酥皮边上啃出一道海湾似的缺口，想尝尝这顿饭够不够好，值不值得请她的小老鼠丈夫也来入席。她自己倒早已经美美地吃过一顿。可见再坏的风，也能给谁吹来一点好处。
        - id: ch02-b14
          speaker: anthea
          text: 一看到合适的地方，我们就停。我有三便士，你们两个还各有四便士没花掉，足够买吃的。我想凤凰一定会说法语。
        - id: ch02-b15
          speaker: narrator
          text: 地毯像船一样航行，越过岩石、河流、树林、城镇、农庄和田野。眼前的飞行让孩子们想起从前的一次经历。那时候，他们每个人都长出了翅膀，飞到一座教堂塔顶，在那里大吃烤鸡、牛舌和新鲜面包，还喝了苏打水。回忆起那顿盛宴，他们越发觉得饥肠辘辘。就在饥饿的念头强烈得不能再强烈时，他们看见前方有一座山丘。几堵残墙之间耸立着一座巨大的方塔，坚固挺拔，看起来几乎完好如新。
        - id: ch02-b16
          speaker: jane
          text: 塔顶跟地毯正好一样大。我看停在那里最好。那些阿比什么来着，我是说当地人，就算想拿走地毯也拿不走。我们还可以派人去买吃的，老老实实花钱买，不从别人的储藏室窗户里拿。
        - id: ch02-b17
          speaker: anthea
          text: 我觉得，我们还是另选一个地方吧。
        - id: ch02-b18
          speaker: narrator
          text: 简猛地攥紧双手。
        - id: ch02-b19
          speaker: jane
          text: 为什么只因为我最小，就永远不能做自己想做的事？我希望地毯正好嵌进那座塔的顶上。我偏要！
        - id: ch02-b20
          speaker: narrator
          text: 地毯猛地一跃，叫所有人都吃了一惊。下一刻，它已经悬在方形塔顶的正上方。随后，它托着孩子们，缓慢而又小心地向下降落。那感觉就像你站在陆海军百货公司的升降梯里，由升降梯载着一点点往下走。只是这一次，四周并没有商店的楼层从眼前经过。
        - id: ch02-b21
          speaker: robert
          text: 没有先商量好，我们就不该乱许愿。咦，这是怎么回事？
        - id: ch02-b22
          speaker: narrator
          text: 灰色的东西忽然从地毯四边升起来，完全出乎每个人的意料。那情形就像有四堵墙正在他们身旁，用魔法般的速度飞快砌起。起初只有一英尺，转眼长到两英尺、三英尺，接着又越过四英尺、五英尺。墙壁越来越高，把外面的光线一层层挡住，四周也越来越暗。安西娅抬头看看仍在上方的天空，又看看身边的墙，这时墙顶已经高出他们六英尺。
        - id: ch02-b23
          speaker: anthea
          text: 我们正在落进塔里！这座塔根本没有顶，地毯要嵌进去的是塔底！
          emotion: fearful
        - id: ch02-b24
          speaker: narrator
          text: 罗伯特跳起来，正想说他们早该怎样，忽然看见一个猫头鹰窝。他把膝盖抵在凸出的灰石上，伸手探进一道漏斗形的深窗缝。
        - id: ch02-b25
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: 快点儿！
          emotion: fearful
        - id: ch02-b26
          speaker: narrator
          text: 可罗伯特不够快。猫头鹰窝里没有蛋，等他抽出手，地毯已经沉到脚下八英尺的地方。
        - id: ch02-b27
          speaker: cyril
          text: 跳呀，你这只傻杜鹃！
          emotion: fearful
        - id: ch02-b28
          speaker: narrator
          text: 罗伯特没法在一眨眼间转过身，摆好跳跃的姿势。他扭来蹭去，终于爬上宽阔的窗台。等他准备好，塔墙已经高出仍随地毯下沉的其他人三十英尺。他独自困在窗洞里，连猫头鹰也不在家。墙面相当光滑，向上爬不成，至于往下爬，那就更不可能了。罗伯特捂住脸，从叫人眩晕的边缘一点点向后退，最后，身子后半截紧紧卡在窗缝最狭窄的地方。
        - id: ch02-b29
          speaker: narrator
          text: 罗伯特暂时安全了。窗洞朝外的那一端像一只画框，正好框住对面塔墙的一角。石头缝里长着苔藓，还嵌着亮晶晶的小宝石，那片景色其实非常美。可是他和那幅景色之间横着整座塔的宽度，空荡荡的，除了高处的空气，什么也没有。眼前的处境实在可怕。罗伯特突然明白，这张地毯很可能也会让他们陷进一个又一个窘境，跟从前普萨米德替他们实现愿望时一模一样。
        - id: ch02-b30
          speaker: narrator
          text: 地毯缓慢而平稳地继续沉向塔底，其他三个孩子只能眼看着罗伯特留在越来越高的墙上。想象一下，这时他们心里该是什么滋味。罗伯特自己连试着想象他们感受的念头都没有。此刻，他孤零零地卡在狭窄的窗洞里，脚下是空荡荡的高塔，光应付自己的恐惧和窘境，就已经够他忙的了。不过，你倒可以替他们每个人想一想。
    - id: ch03
      title: 三个愿望已经用完
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 地毯一落到塔底，立刻失去了木筏般的硬挺。那份硬挺在从卡姆登镇飞来的路上一直让人十分安心，如今它却软塌塌地铺在碎石和一个个小土堆上，跟普通地毯完全一样。接着，它又突然缩小，仿佛要从孩子们的脚下抽走。三个孩子赶紧跨出边缘，站到坚实的地面。等地毯收拢到原本的尺寸，四周便空出了一大片地方。孩子们隔着它互望，又一起仰起头，徒劳地寻找罗伯特。当然，他们什么也看不见。
        - id: ch03-b02
          speaker: jane
          text: 真希望我们没有来。
        - id: ch03-b03
          speaker: cyril
          text: 你每次都这么说。我们不能把罗伯特留在上面。我希望地毯把他接下来。
        - id: ch03-b04
          speaker: narrator
          text: 地毯像是从梦里突然醒来，马上收拢身子，抖擞起精神。它轻快地重新绷硬，沿着塔的四面墙之间往上浮。下面的三个孩子把头拼命向后仰，仰得脖子都快折了。地毯越升越高，最后化成一片黑影，在他们头顶悬了一两个叫人焦急的瞬间。接着，它重新落回塔底，扑在高低不平的地面上，同时也把罗伯特从自己身上摔了下来。
        - id: ch03-b05
          speaker: robert
          text: 谢天谢地，刚才真险！你们不知道我是什么滋味。这一阵我可受够了。咱们许愿回家，去吃馅饼和冷羊肉，过会儿再出来。
        - id: ch03-b06
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 好，我们就这么办！
        - id: ch03-b07
          speaker: narrator
          text: 这场惊险让所有人的神经都受了震动。他们重新坐上地毯，一起许愿。
        - id: ch03-b08
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 我希望我们回到家里。
        - id: ch03-b09
          speaker: narrator
          text: 可他们还是待在原地，地毯纹丝不动。凤凰趁机睡着了，安西娅轻轻叫醒它。
        - id: ch03-b10
          speaker: anthea
          text: 你看看。
        - id: ch03-b11
          speaker: phoenix
          text: 我看着呢。
        - id: ch03-b12
          speaker: jane
          text: 我们明明许愿回家，可还是在这里。
        - id: ch03-b13
          speaker: phoenix
          text: 不错，我看得很清楚。
        - id: ch03-b14
          speaker: cyril
          text: 可我们确实许了愿。
        - id: ch03-b15
          speaker: phoenix
          text: 这点毫无疑问。
        - id: ch03-b16
          speaker: robert
          text: 地毯连一英寸都没动。
        - id: ch03-b17
          speaker: phoenix
          text: 不错，我看见了。
        - id: ch03-b18
          speaker: cyril
          text: 它不是许愿毯吗？
        - id: ch03-b19
          speaker: phoenix
          text: 它当然是。
        - id: ch03-b20
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 那为什么没有用？
        - id: ch03-b21
          speaker: phoenix
          text: 我早就告诉过你们。只怪你们太爱听自己声音奏出的音乐。对每个人来说，那确实是世上最美的音乐，所以……
        - id: ch03-b22
          speaker: exasperated_child
          text: 你到底告诉过我们什么？
          emotion: angry
        - id: ch03-b23
          speaker: phoenix
          text: 地毯每天只能实现三个愿望，而你们今天的三个愿望已经全用完了。
        - id: ch03-b24
          speaker: narrator
          text: 一阵发自内心的沉默落了下来。
        - id: ch03-b25
          speaker: cyril
          text: 那我们怎么回家？
        - id: ch03-b26
          speaker: phoenix
          text: 我一点办法也没有。要不要我飞出去，给你们弄点东西？
        - id: ch03-b27
          speaker: robert
          text: 可你怎么带钱付账？
        - id: ch03-b28
          speaker: phoenix
          text: 用不着。鸟儿想要什么，一向自己拿。除了喜鹊，人们并不把这当作偷窃。
        - id: ch03-b29
          speaker: narrator
          text: 孩子们听了很高兴。从前他们长出翅膀，吃过别人家的熟李子，当时就猜鸟类的规矩该是这样，如今可算得到了证实。
        - id: ch03-b30
          speaker: robert
          text: 那就让凤凰给我们弄点吃的吧。
        - id: ch03-b31
          speaker: anthea
          text: 你该说，如果它肯这么好心。
        - id: ch03-b32
          speaker: robert
          text: 如果它肯这么好心。它出去的时候，我们正好想想办法。
        - id: ch03-b33
          speaker: narrator
          text: 凤凰飞过塔内灰蒙蒙的高处，从顶端消失了。等它完全看不见，简才开口。
        - id: ch03-b34
          speaker: jane
          text: 要是它再也不回来呢？
          emotion: fearful
        - id: ch03-b35
          speaker: anthea
          text: 它一定会回来。我相信它是一只说话算话的鸟。
        - id: ch03-b36
          speaker: narrator
          text: 可那个念头还是给大家心头多添了一层阴影。这座塔有件很奇怪的事：四周竟然找不到一扇门。所有窗户又高得远远超出他们的头顶，就连最敢冒险的攀爬者也不可能够到。塔底照不进多少阳光，空气越来越冷，安西娅忍不住打起寒战。要是凤凰真的不回来，他们谁也不知道还能向谁求救。
        - id: ch03-b37
          speaker: cyril
          text: 这里真像一口井的底下。
        - id: ch03-b38
          speaker: narrator
          text: 孩子们又饿又伤心，只能默默等待。他们一直把小脑袋向后仰，望着灰色高塔的内部，盼着凤凰回来，最后一个个脖子都僵了。凤凰终于出现。它在四面墙之间扑着翅膀向下降落，看上去大得惊人。等它飞近以后，大家才看清，它之所以显得那么大，是因为一只爪子提着满满一篮煮栗子，另一只抓着一块面包，嘴里还衔着一个硕大的梨。梨子汁水丰盈，差不多抵得上一小杯饮料。
        - id: ch03-b39
          speaker: narrator
          text: 四个孩子把栗子、面包和梨分着吃完，肚子里有了东西，所有人都舒服多了。他们重新商量回家的办法，这一次谁也没有闹脾气。可是大家想来想去，仍然找不到摆脱困境的法子，甚至连怎样离开这座塔都不知道。凤凰的喙和爪子幸好足够有力，能为他们带来一顿饭。可要它抓着四个营养良好的孩子，从这么高的塔里飞出去，那显然远远超出了它的力量。
        - id: ch03-b40
          speaker: robert
          text: 看来只能留在这里，隔一会儿就喊几声。总会有人听见，带着绳子和梯子来，像救矿井里的人那样救我们。他们还会为我们募捐，再像送遇难漂流的人一样送我们回家。
        - id: ch03-b41
          speaker: cyril
          text: 可妈妈回来以前，我们肯定赶不到家。爸爸会把地毯没收，说它太危险，或者说些别的。
        - id: ch03-b42
          speaker: jane
          text: 我真希望我们没有来。
        - id: ch03-b43
          speakers: [cyril, robert]
          ensemble: duo
          text: 闭嘴！
        - id: ch03-b44
          speaker: narrator
          text: 安西娅没有叫简闭嘴。她突然唤醒凤凰。
        - id: ch03-b45
          speaker: anthea
          text: 我相信你能帮我们。求你想想办法吧！
        - id: ch03-b46
          speaker: phoenix
          text: 只要力所能及，我一定帮忙。你们现在想要什么？
        - id: ch03-b47
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 我们想回家。
        - id: ch03-b48
          speaker: phoenix
          text: 哦。嗯，好。你们说的“家”，具体是指什么？
        - id: ch03-b49
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 我们住的地方，昨晚睡觉的地方，你的蛋在祭坛上孵出来的地方。
        - id: ch03-b50
          speaker: phoenix
          text: 原来是那里。好吧，我尽力。
        - id: ch03-b51
          speaker: narrator
          text: 凤凰跳上地毯，沉思着来回踱了几分钟，随后骄傲地挺起身子。
        - id: ch03-b52
          speaker: phoenix
          text: 我能帮你们。我几乎可以肯定，除非我受到了极其严重的蒙骗，否则我一定能帮忙。你们不会介意我离开一两个钟头吧？
        - id: ch03-b53
          speaker: narrator
          text: 它没等回答，便穿过塔内的昏暗，飞进上方的光明。
    - id: ch04
      title: 黑暗地道里的宝藏
      blocks:
        - id: ch04-b01
          speaker: cyril
          text: 它说要一两个钟头。我读过俘虏，还有被关在地牢、地下墓穴里的人等待获救的故事。对他们来说，每一刻都像永恒。他们总要做点什么，熬过绝望的时间。咱们没必要驯蜘蛛，应该不会在这里待那么久。
        - id: ch04-b02
          speaker: jane
          text: 但愿如此。
        - id: ch04-b03
          speaker: cyril
          text: 不过，我们该在石头上刻下名字，或者做点类似的事。
        - id: ch04-b04
          speaker: robert
          text: 说到石头，你们看那边墙角的石堆。我敢肯定，后面的墙上有个洞，也许是一扇门。你们过来，石头围成了拱形，这里还有个黑漆漆的洞。
        - id: ch04-b05
          speaker: narrator
          text: 罗伯特走到石堆边，爬上去，推落最顶上的石头，露出一小片幽暗的空间。所有人立刻动手拆石堆。没多久，大家都热得脱下外套。
        - id: ch04-b06
          speaker: cyril
          text: 真是一扇门。有这么一条出路，说不定正好能派上用场。
        - id: ch04-b07
          speaker: narrator
          text: 他本想说，只要凤凰出了什么事。可他怕吓到简，没有说完。只要有空想一想，西里尔并不是个不厚道的男孩子。
        - id: ch04-b08
          speaker: narrator
          text: 墙上的拱形洞口越来越大。塔底的光线本来就像黄昏，洞里却比那片黄昏还要黑得多。孩子们不断把石头一块块搬开，再扔到另一边，重新堆成一堆。这些石头想必已经堵在那里很久，每一块上都长满了苔藓，有些甚至被苔藓牢牢粘在一起。所以，正如罗伯特指出的，这活儿干起来相当费劲。
        - id: ch04-b09
          speaker: narrator
          text: 石堆只剩下从拱顶到塔底大约一半的高度时，两个男孩子小心地从洞口里面放低身子，跳了下去，又划亮火柴。这时，他们非常庆幸自己有位通情达理的爸爸。他不像有些男孩子的爸爸那样，完全禁止孩子随身携带火柴。罗伯特和西里尔的爸爸只有一条要求：他们必须使用那种只能在盒子上划燃的安全火柴。第一根火柴猛地亮起来，火苗摇曳了几下，照出近处的石壁，随后又熄灭了。
        - id: ch04-b10
          speaker: robert
          text: 这不是门，是一条地道。你们让开，我们再推些石头下去！
        - id: ch04-b11
          speaker: narrator
          text: 他们兴奋地继续搬。石堆很快消失，黑洞洞的拱道通向无人知道的地方。这个时刻太激动人心，大家完全忘了能不能回家。这就像《基督山伯爵》，又像……
        - id: ch04-b12
          speaker: anthea
          text: 快出来！封闭很久的地方总有坏空气。火把会熄灭，人也会死。我想那叫沼气。快出来！
          emotion: fearful
        - id: ch04-b13
          speaker: narrator
          text: 安西娅的声音急迫得让两个男孩子果真退了出来。随后，四个孩子每人拿起自己的外套，一起对着黑漆漆的拱道用力扇风，想让新鲜空气灌进去。他们扇了一阵又一阵。等安西娅终于认定，洞里的坏空气现在一定已经换掉，西里尔才走在最前面，领着大家进入拱道。谁也不知道那片黑暗里究竟藏着什么。
        - id: ch04-b14
          speaker: narrator
          text: 两个女孩子走在中间，罗伯特垫后。简不肯走最后，生怕有什么东西跟进来，从背后一把抓住她。西里尔一根接一根地点火柴，小心地往前看。
        - id: ch04-b15
          speaker: cyril
          text: 上面是石头砌的拱顶。好啦，黑豹，别老扯我的外套。火柴一直能燃，空气肯定没问题。这里还有……当心，有台阶往下走。
        - id: ch04-b16
          speaker: jane
          text: 别再往前了。我敢肯定，里面有蛇，或者有狮子的巢穴。咱们回去吧，改天带上蜡烛，再带一只给沼气换气的风箱，然后再来。
          emotion: fearful
        - id: ch04-b17
          speaker: robert
          text: 那就让我走到你前面。这里正适合埋宝藏，我反正要继续走。你愿意的话，可以自己留下。
        - id: ch04-b18
          speaker: narrator
          text: 简当然只好答应继续。孩子们走得又慢又小心，一级一级下了台阶。台阶一共有十七级。到了底下，他们发现更多通道朝四个方向岔开。右边还有个低矮的拱洞，引起了西里尔的好奇。那洞实在太低，不可能是另一条通道的入口。他跪到地上，划亮一根火柴，把身子弯得很低，探头向里面张望。
        - id: ch04-b19
          speaker: cyril
          text: 里面有东西。
        - id: ch04-b20
          speaker: narrator
          text: 他把手伸进去，碰到一个东西。那手感就像一袋潮湿的玻璃弹珠。他这辈子还没摸过更像一袋湿弹珠的东西。
        - id: ch04-b21
          speaker: cyril
          text: 我看这真是埋起来的宝藏！
          emotion: surprised
        - id: ch04-b22
          speaker: anthea
          text: 快点，松鼠，把它拖出来！
        - id: ch04-b23
          speaker: narrator
          text: 西里尔拖出一只腐烂的帆布袋，大小跟蔬果商装六便士巴塞罗那坚果的纸袋差不多。
        - id: ch04-b24
          speaker: cyril
          text: 里面还有，很多很多。
        - id: ch04-b25
          speaker: narrator
          text: 西里尔继续往外拉，腐烂的袋子突然裂开。金币一下子全跑了出来，在黑暗通道的地面上滚动、旋转、蹦跳、碰撞，叮叮当当，清脆地响成一片。不知道你突然发现一处埋藏的宝藏，会说些什么？西里尔眼前明明全是金币，嘴里说出的却是另一件事。
        - id: ch04-b26
          speaker: cyril
          text: 真讨厌，我的手指烧着了！而且这是最后一根火柴！
          emotion: surprised
        - id: ch04-b27
          speaker: narrator
          text: 绝望的寂静持续了片刻，简哭了起来。
        - id: ch04-b28
          speaker: anthea
          text: 别哭，猫咪。哭会把空气耗光的。我们一定能出去。
        - id: ch04-b29
          speaker: jane
          text: 是呀。等我们出去，凤凰已经回来又走了。它会以为我们从别的路回了家。啊，我真希望我们没有来。
          emotion: sad
        - id: ch04-b30
          speaker: narrator
          text: 大家一动不动。只有安西娅抱住简，在黑暗里替她擦眼泪。
        - id: ch04-b31
          speaker: jane
          text: 别擦，那是我的耳朵。我又不是用耳朵哭的。
        - id: ch04-b32
          speaker: robert
          text: 来吧，我们出去。
        - id: ch04-b33
          speaker: narrator
          text: 可出去没有说起来那么容易。黑暗里看不见任何记号，也没有一个人能准确记起，他们刚才究竟是从四条岔路里的哪一条走进来的。人在黑暗中实在很难把事情记清楚。身上若还带着火柴，情形当然完全不同。只要知道口袋里还有火柴，哪怕暂时连一根也没有划亮，人也会觉得方向比现在清楚得多。可他们的最后一根已经熄灭，四周只剩下一模一样的黑暗。
        - id: ch04-b34
          speaker: narrator
          text: 现在，每个人都赞同简反复说的那句愿望了。绝望让黑暗显得更深。忽然，地面像是倾斜起来，所有人都觉得自己站在一架旋转的升降梯里。黑暗中的人总会闭上眼睛，你说是不是？旋转停下时，西里尔喊了一声。
        - id: ch04-b35
          speaker: cyril
          text: 难道是地震吗？
          emotion: surprised
        - id: ch04-b36
          speaker: narrator
          text: 大家睁开眼睛，发现自己回到了家里那间昏暗的早餐室。经历过地下地道的黑暗以后，这里显得那么光亮、明朗、安全、舒服，简直没有一处不好。地毯平静地铺在地板上，像是这一辈子从没出去游历过。凤凰站在壁炉台上，神情里既有谦逊，又有一种真正可敬的价值感，正等着孩子们向它道谢。
    - id: ch05
      title: 丢失的宝藏
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 大家谢了凤凰一遍又一遍，终于问它究竟是怎么办到的。
        - id: ch05-b02
          speaker: phoenix
          text: 没什么。我只是去找你们的朋友普萨米德，要来了一个愿望。
        - id: ch05-b03
          speaker: cyril
          text: 可你怎么知道去哪里找它？
        - id: ch05-b04
          speaker: phoenix
          text: 地毯告诉我的。能实现愿望的生灵总是很了解彼此，它们特别抱团。就像苏格兰人，你们知道，彼此全是亲戚。
        - id: ch05-b05
          speaker: jane
          text: 可地毯不会说话，对吗？
        - id: ch05-b06
          speaker: phoenix
          text: 不会。
        - id: ch05-b07
          speaker: cyril
          text: 那你怎么……
        - id: ch05-b08
          speaker: phoenix
          text: 你是问我怎么拿到普萨米德的地址？我已经说过，是从地毯那里得到的。
        - id: ch05-b09
          speaker: jane
          text: 那么，地毯刚才开口了？
        - id: ch05-b10
          speaker: phoenix
          text: 没有。它一句话也没说，不过我从它的举止里搜集到了这个消息。我向来是一只观察力格外敏锐的鸟。
        - id: ch05-b11
          speaker: narrator
          text: 回到家以后，孩子们先吃了冷羊肉和果酱馅饼，又喝了茶，吃了黄油面包。直到这些东西全都下了肚，才终于有人想起那些金灿灿的宝藏。金币仍然散落在地下通道的石头地面上。说来实在奇怪，从最后一根火柴的火苗烫到西里尔手指的那一刻起，一直到现在，四个孩子竟然没有一个人再想起过它们。
        - id: ch05-b12
          speaker: robert
          text: 我们真是又像猫头鹰，又像山羊，笨透了！我们一直那么想找到宝藏，可现在……
        - id: ch05-b13
          speaker: anthea
          text: 不要紧。我们可以回去，把宝藏全拿回来，再给每个人送礼物。
        - id: ch05-b14
          speaker: narrator
          text: 接下来的一个多刻钟，大家兴致勃勃地安排该给谁送什么礼物。等慷慨大方的要求全都满足以后，他们又足足谈了五十分钟，商量要给自己买些什么。罗伯特打算买一辆汽车，每天乘着它上学，再乘着它回家。此刻，他正在用几乎过于专业的口气描述那辆汽车的各种细节，西里尔忽然打断了他。
        - id: ch05-b15
          speaker: cyril
          text: 行啦，别说了。全都没用。我们永远也回不去，因为根本不知道那个地方在哪里。
        - id: ch05-b16
          speaker: jane
          text: 凤凰，你也不知道吗？
        - id: ch05-b17
          speaker: phoenix
          text: 一点也不知道。
        - id: ch05-b18
          speaker: cyril
          text: 那么，我们把宝藏弄丢了。
        - id: ch05-b19
          speaker: narrator
          text: 他们确实把宝藏弄丢了。
        - id: ch05-b20
          speaker: anthea
          text: 不过，我们还有地毯和凤凰。
        - id: ch05-b21
          speaker: phoenix
          text: 恕我打扰。我实在不喜欢显得自己多嘴，可你想说的当然应该是“凤凰和地毯”，对吧？
