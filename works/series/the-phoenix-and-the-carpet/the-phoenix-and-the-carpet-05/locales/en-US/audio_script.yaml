  chapters:
    - id: ch01
      title: THE TEMPLE
      blocks:
        - id: ch01-b01
          speaker: jane
          text: >-
            I wish we could find the Phoenix. It's much better company than the carpet.
        - id: ch01-b02
          speaker: cyril
          text: >-
            Little children are horribly ungrateful.
        - id: ch01-b03
          speaker: jane
          text: >-
            I'm not ungrateful. The carpet never says anything, and it can't look after itself. It gets sold or carried out to sea or something. No one would ever manage to sell the Phoenix.
        - id: ch01-b04
          speaker: narrator
          text: >-
            This was two days after the bazaar. Everyone felt a little cross. Some days are like that, especially Mondays, and this was a Monday.
        - id: ch01-b05
          speaker: cyril
          text: >-
            Perhaps your precious Phoenix has left for good. I wouldn't blame it, either. Look at this weather.
        - id: ch01-b06
          speaker: robert
          text: >-
            The weather isn't worth looking at.
        - id: ch01-b07
          speaker: anthea
          text: >-
            I'm sure the Phoenix hasn't gone. I'll search again.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Anthea searched under every table and chair. She looked through boxes and baskets, inside Mother's workbag, and even in Father's portmanteau. After all that, she did not find so much as the tip of one shining feather. Then Robert suddenly remembered the invocation. He had once squeezed all seven thousand lines of its Greek song into a single English hexameter. He stepped onto the carpet and chanted it aloud.
        - id: ch01-b09
          speaker: robert
          text: >-
            Oh, come along, come along, you good old beautiful Phoenix!
        - id: ch01-b10
          speaker: narrator
          text: >-
            Wings rustled on the kitchen stairs almost at once. The Phoenix sailed into the room on broad golden wings.
        - id: ch01-b11
          speaker: anthea
          text: >-
            Where in the world have you been? I've searched everywhere.
        - id: ch01-b12
          speaker: phoenix
          text: >-
            Not everywhere. You failed to look where I actually was. You must admit that you overlooked that hallowed place.
        - id: ch01-b13
          speaker: cyril
          text: >-
            What hallowed place?
        - id: ch01-b14
          speaker: narrator
          text: >-
            Cyril was growing impatient. Time was passing, and the wishing carpet had done nothing yet.
        - id: ch01-b15
          speaker: phoenix
          text: >-
            I hallowed the Lutron with my golden presence.
        - id: ch01-b16
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            The what?
        - id: ch01-b17
          speaker: phoenix
          text: >-
            The bath. The place where one washes.
        - id: ch01-b18
          speaker: jane
          text: >-
            You couldn't have been there. I looked three times, and I moved every towel.
        - id: ch01-b19
          speaker: phoenix
          text: >-
            I was hidden on top of an enchanted metal column. At least, I believe it was enchanted. It warmed my golden toes as if the glorious desert sun always shone upon it.
        - id: ch01-b20
          speaker: cyril
          text: >-
            You mean the hot-water cylinder. It does feel comforting in weather like this. Now, where shall we go?
        - id: ch01-b21
          speaker: narrator
          text: >-
            The usual argument began. Each child wanted to do the very thing the others did not want to do.
        - id: ch01-b22
          speaker: cyril
          text: >-
            I'm the eldest. Let's go to the North Pole.
        - id: ch01-b23
          speaker: robert
          text: >-
            In this weather? Not likely. Let's go to the Equator.
        - id: ch01-b24
          speaker: anthea
          text: >-
            The diamond mines at Golconda might be lovely. Don't you think so, Jane?
        - id: ch01-b25
          speaker: jane
          text: >-
            No. I don't agree with you. I don't agree with anyone.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The Phoenix lifted one claw in warning.
        - id: ch01-b27
          speaker: phoenix
          text: >-
            If you cannot agree among yourselves, I fear I must leave you.
        - id: ch01-b28
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Then where should we go? You choose!
        - id: ch01-b29
          speaker: phoenix
          text: >-
            In your place, I would let the carpet rest. Besides, if it carries you everywhere, you will forget how to use your legs. Why not take me outside and explain your ugly city?
        - id: ch01-b30
          speaker: robert
          text: >-
            We can, if the sky clears. Just look at the rain. And why does the carpet need a rest?
        - id: ch01-b31
          speaker: phoenix
          text: >-
            Are you greedy, grasping, heartless, and selfish?
        - id: ch01-b32
          speaker: robert
          text: >-
            No!
          emotion: angry
        - id: ch01-b33
          speaker: phoenix
          text: >-
            Well, then. I dislike rain myself. If the sun knew I was here, it would surely shine. The sun loves shining on me because I am so bright and golden. It says I reward a little attention. Do you have no useful words for wet weather?
        - id: ch01-b34
          speaker: anthea
          text: >-
            We say, "Rain, rain, go away," but the rain never does.
        - id: ch01-b35
          speaker: phoenix
          text: >-
            Perhaps you invoke it incorrectly.
        - id: ch01-b36
          speaker: anthea
          text: >-
            Rain, rain, go away. Come again another day. Little baby wants to play.
        - id: ch01-b37
          speaker: phoenix
          text: >-
            That is quite wrong. No wonder the rain ignores such a dull performance. Open the window and shout this as loudly as you can. Rain, rain, go away. Come again another day. Now we want the sun, and so, pretty rain, be kind and go! Always be polite when you ask people to do things, especially when you want them to go away. Today you may add this. Shine, great sun, the lovely Phoenix is here and wants to be shone on, splendid sun, by thee!
        - id: ch01-b38
          speaker: cyril
          text: >-
            That's poetry.
        - id: ch01-b39
          speaker: robert
          text: >-
            It's rather like poetry.
        - id: ch01-b40
          speaker: phoenix
          text: >-
            I had to include "lovely" so the line would be long enough.
        - id: ch01-b41
          speaker: jane
          text: >-
            Plenty of nasty words are just as long.
        - id: ch01-b42
          speakers: [robert, cyril, anthea]
          ensemble: chorus
          text: >-
            Hush!
        - id: ch01-b43
          speaker: narrator
          text: >-
            They opened the window and shouted all seven lines as loudly as they could. The Phoenix recited every word along with them, except when they reached the word "lovely." At that point, it lowered its eyes and gave a bashful little cough. The rain hesitated for one moment, as if considering the polite request. Then it went away.
        - id: ch01-b44
          speaker: phoenix
          text: >-
            That is true politeness.
        - id: ch01-b45
          speaker: narrator
          text: >-
            In the very next moment, the Phoenix perched on the window ledge. It opened and closed its radiant wings and flapped out its golden feathers. A flood of glorious sunshine poured over them, the kind of light one sometimes sees at sunset in autumn. People said afterward that there had not been sunshine like it in December for years and years and years.
        - id: ch01-b46
          speaker: phoenix
          text: >-
            Now we shall go into the city, and you shall show me one of my temples.
        - id: ch01-b47
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Your temples?
        - id: ch01-b48
          speaker: phoenix
          text: >-
            The carpet has informed me that this country contains many of them.
        - id: ch01-b49
          speaker: jane
          text: >-
            How can the carpet tell you anything? It never speaks.
        - id: ch01-b50
          speaker: phoenix
          text: >-
            One can pick things up from a carpet. I have watched you do it. I picked up several facts that way. The papyrus where you showed me my picture also gives the street where my finest temple stands. My image is carved in stone and metal beside its entrance.
        - id: ch01-b51
          speaker: robert
          text: >-
            You mean the fire insurance office. It isn't really a temple, and the people there don't—
        - id: ch01-b52
          speaker: phoenix
          text: >-
            Excuse me. You are entirely mistaken. It is a temple, and they do.
        - id: ch01-b53
          speaker: anthea
          text: >-
            Let's not waste the sunshine. We can argue while we walk.
        - id: ch01-b54
          speaker: narrator
          text: >-
            The Phoenix agreed to make a nest inside Robert's Norfolk jacket, and they set out in the splendid sunshine. A tram seemed the best way to reach the temple, so they climbed on top. The children talked as they rode. Now and then a cautious golden beak appeared from Robert's coat, followed by one watchful eye, and the Phoenix contradicted whatever they happened to be saying.

            It was a delightful ride, and the children felt very lucky to have enough money for the fare. They stayed aboard until the tram reached the end of its route. Since it could go no farther, neither could they, so they climbed down at the end of Gray's Inn Road. Cyril believed there must be a shortcut to the Phoenix Office through the tightly packed little streets and courts between Fetter Lane and Ludgate Circus. He was quite wrong. Robert told him so at the time and made sure to remind him afterward.

            The narrow streets were close, stuffy, and ugly. Printers' boys and binders' girls were pouring out from work, and they stared hard at the sisters' pretty red coats and caps. Some advised Jane to have her hair cut. Others demanded to know where Anthea had bought her hat. Jane and Anthea scorned to answer. Cyril and Robert found they were no match for the rough crowd, because neither boy could think of anything nasty enough to say.

            The children turned a corner sharply. Anthea pulled Jane into an archway and then through a door. Cyril and Robert rushed in behind them. The jeering crowd streamed past without noticing where they had gone.
        - id: ch01-b55
          speaker: anthea
          text: >-
            That was horrible. I thought people like that only existed in books.
        - id: ch01-b56
          speaker: cyril
          text: >-
            It was pretty bad. Still, you girls helped it along by wearing those showy coats.
        - id: ch01-b57
          speaker: jane
          text: >-
            We thought we ought to dress brightly when we were going out with the Phoenix.
        - id: ch01-b58
          speaker: phoenix
          text: >-
            Quite right, too.
        - id: ch01-b59
          speaker: narrator
          text: >-
            The Phoenix carelessly poked out its head to wink at Jane. At that instant, a dirty hand reached through the grim staircase rails and seized it.
        - id: ch01-b60
          speaker: ike
          text: >-
            Well, Urb, if this ain't our lost Poll parrot! Much obliged, lady, for bringing him home.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Two large, ragged boys crouched in the darkness on the stairs. Both were much bigger than Robert and Cyril. The one called Ike held the Phoenix high above the children's heads.
        - id: ch01-b62
          speaker: cyril
          text: >-
            Give that bird back. It belongs to us.
        - id: ch01-b63
          speaker: ike
          text: >-
            Good afternoon, and thank you kindly. Sorry there's no twopence reward. I spent my whole fortune advertising my valuable bird in every newspaper. Come back next year and collect it.
        - id: ch01-b64
          speaker: urb
          text: >-
            Mind yourself, Ike. That thing's got a beak.
        - id: ch01-b65
          speaker: ike
          text: >-
            Other people will have the Beak after them if they claim my Poll parrot. Shut it, Urb. Now, you four little girls, clear out.
        - id: ch01-b66
          speaker: robert
          text: >-
            Little girls? I'll show you little girls!
          emotion: angry
        - id: ch01-b67
          speaker: narrator
          text: >-
            Robert sprang up three steps and struck out. The Phoenix gave the most birdlike squawk anyone had ever heard from it. Wings fluttered, and someone laughed in the dark.
        - id: ch01-b68
          speaker: ike
          text: >-
            Now you've gone and hit my Poll parrot right in the feathers. That was cruel, that was.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Robert stamped with fury. Cyril went pale with rage and strained his mind to think of some clever way to get even with the two larger boys. Anthea and Jane were every bit as angry as their brothers, but their anger made them want to cry. Even so, Anthea was the one who managed to speak.
        - id: ch01-b70
          speaker: anthea
          text: >-
            Please, please give us the bird.
          emotion: sad
        - id: ch01-b71
          speaker: ike
          text: >-
            Please, please go away and leave us with our bird.
        - id: ch01-b72
          speaker: anthea
          text: >-
            If you don't give it back, I'll fetch the police.
        - id: ch01-b73
          speaker: urb
          text: >-
            You do that. Ike, twist the pigeon's neck. It ain't worth twopence.
        - id: ch01-b74
          speaker: jane
          text: >-
            Oh, don't hurt it! Please don't. It's our dear pet.
          emotion: fearful
        - id: ch01-b75
          speaker: ike
          text: >-
            I won't hurt it. Shame on you, Urb, for suggesting it. Half a shiner, miss, and the bird is yours forever.
        - id: ch01-b76
          speaker: anthea
          text: >-
            Half a what?
        - id: ch01-b77
          speaker: ike
          text: >-
            Half a sovereign. Ten shillings.
        - id: ch01-b78
          speaker: anthea
          text: >-
            I haven't got that, and the bird is ours already.
        - id: ch01-b79
          speaker: cyril
          text: >-
            Don't bother talking to him.
        - id: ch01-b80
          speaker: jane
          text: >-
            Phoenix, dear Phoenix, we can't do anything. You must get yourself free.
        - id: ch01-b81
          speaker: phoenix
          text: >-
            With pleasure.
        - id: ch01-b82
          speaker: narrator
          text: >-
            Ike nearly dropped it.
        - id: ch01-b83
          speaker: ike
          text: >-
            It talks! And properly, too.
          emotion: surprised
        - id: ch01-b84
          speaker: phoenix
          text: >-
            Young men, sons of misfortune, listen to me.
        - id: ch01-b85
          speaker: ike
          text: >-
            Would you look at that!
        - id: ch01-b86
          speaker: urb
          text: >-
            Careful, Ike. Don't choke it. I can see it's worth its weight in banknotes.
        - id: ch01-b87
          speaker: phoenix
          text: >-
            Hear me, Eikonoclastes, despiser of sacred images, and you, Urbanus, dweller in the sordid city. Abandon this adventure before something worse befalls you.
        - id: ch01-b88
          speaker: ike
          text: >-
            Blimey, hasn't it learned its lessons well!
        - id: ch01-b89
          speaker: phoenix
          text: >-
            Return me to my young acolytes, and you may escape unharmed. Keep me, and—
        - id: ch01-b90
          speaker: ike
          text: >-
            They trained the parrot to say all this in case somebody pinched it. What crafty little kids!
        - id: ch01-b91
          speaker: urb
          text: >-
            Punch them in the mouth and get away with the goods. That's what I say.
        - id: ch01-b92
          speaker: ike
          text: >-
            Right you are.
        - id: ch01-b93
          speaker: phoenix
          text: >-
            Stop! Who stole the watch from the old gentleman in Aldermanbury? Who took the handkerchief from the young girl's hand in Bell Court? Who—
        - id: ch01-b94
          speaker: ike
          text: >-
            Shut up! Ugh, let go of me! Knock him off, Urb! He'll have my eyes out!
          emotion: fearful
        - id: ch01-b95
          speaker: narrator
          text: >-
            There were howls, scuffling feet, and beating wings in the dark stairway. Ike and Urb fled upstairs, and the Phoenix swept through the doorway. The children raced after it. Outside, the bird settled on Robert like a butterfly on a rose, as Anthea said later. Then it wriggled into the front of his Norfolk jacket like an eel into mud, as Cyril described it afterward.

            They hurried through the maze of narrow courts with the Phoenix safely hidden. Only when they reached the broad, open safety of Farringdon Street did they stop.
        - id: ch01-b96
          speaker: robert
          text: >-
            Why didn't you burn him? You could have done it, couldn't you?
        - id: ch01-b97
          speaker: phoenix
          text: >-
            Naturally. But it would not have been dignified to grow heated over such a little matter. The Fates have treated me generously. I have many friends among London's sparrows, and I possess both a beak and claws.
        - id: ch01-b98
          speaker: narrator
          text: >-
            Everything that had happened in the dark doorway shook the children's adventurous spirits. For a while, they no longer felt at all eager to continue their expedition. The Phoenix had to exert all its golden charm to cheer them and persuade them onward toward the temple.
        - id: ch01-b99
          speaker: narrator
          text: >-
            At last they reached a great building in Lombard Street. A stone Phoenix stood on each side of the door, and bright brass letters announced, "Phoenix Fire Office."
        - id: ch01-b100
          speaker: phoenix
          text: >-
            One moment. Does "fire" refer to altar fires?
        - id: ch01-b101
          speaker: robert
          text: >-
            I don't know.
        - id: ch01-b102
          speaker: narrator
          text: >-
            Robert was feeling shy, which always made him rather cross.
        - id: ch01-b103
          speaker: cyril
          text: >-
            Yes, you do know. When someone's house burns down, the Phoenix gives them a new one. Father explained it to me.
        - id: ch01-b104
          speaker: phoenix
          text: >-
            So the house rises from its ashes, just as the Phoenix does. My priests have served the sons of men well!
        - id: ch01-b105
          speaker: anthea
          text: >-
            People pay them, you know. But only a small amount each year.
        - id: ch01-b106
          speaker: phoenix
          text: >-
            Of course. That supports my priests, who comfort the afflicted and rebuild their homes. Lead the way and ask for the High Priest. I shall not burst upon them suddenly in all my glory. These noble people undo the evil work of the lame and unpleasant Hephaestus.
        - id: ch01-b107
          speaker: cyril
          text: >-
            I wish you wouldn't confuse us with strange names. Fires just happen. No one does them on purpose. If someone did, the Phoenix Office wouldn't help, because setting fires is a crime. It's called arsenic, or something like that, because it's as bad as poisoning people. Father told me they wouldn't help anyone who did it.
        - id: ch01-b108
          speaker: phoenix
          text: >-
            My priests behave admirably. Lead on.
        - id: ch01-b109
          speaker: cyril
          text: >-
            But I don't know what to say when we go in.
        - id: ch01-b110
          speakers: [robert, anthea, jane]
          ensemble: chorus
          text: >-
            Neither do we.
        - id: ch01-b111
          speaker: phoenix
          text: >-
            Ask for the High Priest. Say you carry a secret concerning my worship. He will take you into the innermost sanctuary.
        - id: ch01-b112
          speaker: narrator
          text: >-
            All four children went inside, though none of them liked doing it. They found themselves in a large and beautiful hall lined with Doulton tiles. Stately pillars held up the roof. The place looked rather like an enormous beautiful bath with no water in it. A rather ugly brown pottery Phoenix spoiled one wall. Mahogany-and-brass counters and desks stood around the hall. Clerks bent over the desks or walked behind the counters, and a great clock hung above an inner doorway.
        - id: ch01-b113
          speaker: phoenix
          text: >-
            Ask for the High Priest.
        - id: ch01-b114
          speaker: narrator
          text: >-
            A young clerk in respectable black came over. He managed to control his mouth, but not his eyebrows. The children expected the sort of welcome one heard in a draper's shop. They got something else.
        - id: ch01-b115
          speaker: young_clerk
          text: >-
            Well? What do you want?
        - id: ch01-b116
          speaker: cyril
          text: >-
            We want to see the High Priest.
        - id: ch01-b117
          speaker: young_clerk
          text: >-
            Be off with you.
        - id: ch01-b118
          speaker: elder_clerk
          text: >-
            Perhaps they mean Mr. Blank. He is a Masonic High Priest, you know.
        - id: ch01-b119
          speaker: narrator
          text: >-
            A porter went to find the gentleman whose name must not be revealed. The children remained in the hall, looking at all the men behind the mahogany desks while those men looked back at them. Anthea and Jane decided that the gentlemen looked kind. Robert and Cyril thought the gentlemen were staring and considered it very cheeky of them.

            The porter returned with news that Mr. Dot Dash Dot was out. He began to offer the name of someone else, but before he could finish, another gentleman appeared. This one was truly delightful. He had a beard and kind, merry eyes. All four children knew at once that he must have children of his own and would understand what they meant when they spoke to him. Even so, their story was not easy to explain.
        - id: ch01-b120
          speaker: gentleman
          text: >-
            What is it? Mr. Blank is away. Is there something I can do for you?
        - id: ch01-b121
          speaker: phoenix
          text: >-
            The inner sanctuary.
        - id: ch01-b122
          speaker: gentleman
          text: >-
            I beg your pardon?
        - id: ch01-b123
          speaker: cyril
          text: >-
            We have something private to tell you. This hall is rather public.
        - id: ch01-b124
          speaker: narrator
          text: >-
            The porter was lingering much closer than he needed to. The gentleman laughed.
        - id: ch01-b125
          speaker: gentleman
          text: >-
            Then come upstairs.
        - id: ch01-b126
          speaker: narrator
          text: >-
            He led them up a broad and beautiful staircase. Anthea always said afterward that the stairs were made of white marble, though one cannot be certain. At the top, a beautiful dark metal Phoenix stood on the corner post. Flat images of the same bird decorated the walls on both sides.

            Upstairs, the gentleman took them into a room furnished with chairs covered in reddish leather. Even the tables had reddish leather over them. He turned to the four children and waited for them to explain themselves.
        - id: ch01-b127
          speaker: gentleman
          text: >-
            Don't be frightened. Tell me exactly what you need.
        - id: ch01-b128
          speaker: cyril
          text: >-
            May I close the door?
        - id: ch01-b129
          speaker: narrator
          text: >-
            The gentleman looked surprised, but he closed it.
        - id: ch01-b130
          speaker: cyril
          text: >-
            This will surprise you. You'll probably think it isn't true and that we're lunatics, but we aren't, and it is true. Robert has something inside his Norfolk jacket. He's my younger brother. Please don't have a fit, sir. When this office was named after the Phoenix, you probably never thought a real one existed. But it does, and Robert has it buttoned against his chest.
        - id: ch01-b131
          speaker: gentleman
          text: >-
            If you mean some antique ornament shaped like a Phoenix, perhaps the Board might—
        - id: ch01-b132
          speaker: anthea
          text: >-
            It certainly is old, if we can believe what it says, but—
        - id: ch01-b133
          speaker: narrator
          text: >-
            Robert fumbled with his buttons. The Phoenix gave one last wriggle, turned it into a flutter, and stepped from its nest onto the leather-covered table.
        - id: ch01-b134
          speaker: gentleman
          text: >-
            Good gracious! What a remarkably fine bird. I have never seen anything quite like it.
          emotion: surprised
        - id: ch01-b135
          speaker: phoenix
          text: >-
            I should think not.
        - id: ch01-b136
          speaker: narrator
          text: >-
            The Phoenix answered with perfectly understandable pride. At the sound of the bird's voice, the gentleman gave a startled jump.
        - id: ch01-b137
          speaker: gentleman
          text: >-
            Oh! Someone taught it to talk. Is it a kind of parrot?
          emotion: surprised
        - id: ch01-b138
          speaker: phoenix
          text: >-
            I am the Head of your House. I have come to my temple to receive your homage. I am not a parrot. I am the one and only Phoenix, and I demand homage from my High Priest.
        - id: ch01-b139
          speaker: gentleman
          text: >-
            In our manager's absence, perhaps I could assist you. But what am I saying? Children, the weather is unusually warm, and I am not quite myself. For a moment, I truly imagined your extraordinary bird had called itself the Phoenix. Worse still, I believed it.
        - id: ch01-b140
          speaker: narrator
          text: >-
            He had gone pale and passed a hand across his forehead.
        - id: ch01-b141
          speaker: cyril
          text: >-
            It did say that, sir, and you did believe it.
        - id: ch01-b142
          speaker: gentleman
          text: >-
            It truly— Please allow me.
        - id: ch01-b143
          speaker: narrator
          text: >-
            He rang a bell, and the porter appeared.
        - id: ch01-b144
          speaker: gentleman
          text: >-
            Mackenzie, can you see that golden bird?
        - id: ch01-b145
          speaker: porter
          text: >-
            Yes, sir.
        - id: ch01-b146
          speaker: narrator
          text: >-
            The gentleman sighed with relief.
        - id: ch01-b147
          speaker: gentleman
          text: >-
            Then it is real?
        - id: ch01-b148
          speaker: porter
          text: >-
            Certainly, sir. Take it in your hand and see.
        - id: ch01-b149
          speaker: narrator
          text: >-
            Mackenzie reached out. The Phoenix drew back on toes curled with furious dignity.
        - id: ch01-b150
          speaker: phoenix
          text: >-
            Forbear! How dare you try to lay hands upon me?
          emotion: angry
        - id: ch01-b151
          speaker: narrator
          text: >-
            The porter saluted.
        - id: ch01-b152
          speaker: porter
          text: >-
            Beg pardon, sir. I thought you were a bird.
        - id: ch01-b153
          speaker: phoenix
          text: >-
            I am a bird. I am the bird. I am the Phoenix.
        - id: ch01-b154
          speaker: porter
          text: >-
            Of course, sir. I saw that the instant I got my breath back.
        - id: ch01-b155
          speaker: gentleman
          text: >-
            Thank you, Mackenzie. Please ask Mr. Wilson and Mr. Sterry to come up.
        - id: ch01-b156
          speaker: narrator
          text: >-
            Mr. Wilson and Mr. Sterry came upstairs. Each was overcome with amazement in his turn, and in each case amazement was quickly followed by conviction. To the children's astonishment, every person in the office accepted the Phoenix's word. Once the first shock had passed, it seemed perfectly natural to all of them that the living Phoenix, while passing through London, should call at the temple that carried its name.
        - id: ch01-b157
          speaker: gentleman
          text: >-
            We must arrange some kind of ceremony. There is no time to summon all the directors and shareholders today, though perhaps we can bring them together tomorrow. Yes, the boardroom will be the best place. I would hate the Phoenix to feel that we had not done everything in our power to show how deeply we value the honor of this friendly visit.
        - id: ch01-b158
          speaker: narrator
          text: >-
            The children could hardly believe what they heard. Until that moment, it had never occurred to them that anyone besides themselves would believe in the Phoenix. Yet every employee in the office was brought upstairs, two or three at a time. The moment the bird opened its beak, its manner convinced the cleverest gentlemen as completely as it convinced those who were not quite so clever.

            Cyril began to wonder how the story would look in the newspapers the next morning. In his mind, he could already see great posters in the streets. They would announce that the Phoenix had appeared at the Phoenix Fire Office, that a meeting had welcomed it to its temple, and that the manager and everyone else were delighted.
        - id: ch01-b159
          speaker: gentleman
          text: >-
            Please excuse us for one moment.
        - id: ch01-b160
          speaker: narrator
          text: >-
            The men went out and left the children alone with the Phoenix. Through the half-open door came the tramp of many boots on the stairs. Excited voices hummed as people explained, suggested, and argued. Heavy furniture made a thumping scrape as it was dragged across the floor. While its worshippers hurried to prepare the ceremony, the Phoenix strutted up and down the leather-covered table and kept looking over its shoulder at its handsome back.
        - id: ch01-b161
          speaker: phoenix
          text: >-
            You see how convincing my manner is.
        - id: ch01-b162
          speaker: narrator
          text: >-
            A new official entered and bowed very low.
        - id: ch01-b163
          speaker: official
          text: >-
            Everything is ready. We have done our best with so little notice. The ceremony will take place in the boardroom. Would the Honorable Phoenix care to walk the few steps, or would it prefer some kind of conveyance?
        - id: ch01-b164
          speaker: phoenix
          text: >-
            My Robert will carry me to the boardroom, if that is truly the ugly name of my temple's innermost court.
        - id: ch01-b165
          speaker: narrator
          text: >-
            They all followed the official, with Robert carrying the Phoenix. The boardroom held a very large table, but someone had pushed it right against the long windows along one wall. Rows of chairs filled the rest of the room. They looked like the seats arranged at school when a magic-lantern lecture was about to begin. The subject might be "Our Eastern Empire," or perhaps "The Way We Do in the Navy." A carved Phoenix crowned the beautiful wooden doors.

            Anthea noticed the chairs in the front rows. They were just the sort her mother loved to ask about in old furniture shops and could never buy, because the price was always nearly twenty pounds for each chair.

            Heavy bronze candlesticks stood on the mantelpiece beside a clock. On top of the clock sat yet another image of the Phoenix.
        - id: ch01-b166
          speaker: phoenix
          text: >-
            Remove that image.
        - id: ch01-b167
          speaker: narrator
          text: >-
            The gentlemen hurried to remove the image. The living Phoenix fluttered to the center of the mantelpiece and stood there looking more golden than ever. Then everyone from both the house and the office filed into the boardroom. The cashier came, along with the managers, secretaries, clerks, and porters. Even the women who cooked the clerks' dinners in the beautiful kitchen at the very top of the building came down. Each person bowed to the Phoenix before taking a chair.
        - id: ch01-b168
          speaker: gentleman
          text: >-
            Ladies and gentlemen, we have gathered here today—
        - id: ch01-b169
          speaker: phoenix
          text: >-
            I do not see any incense.
        - id: ch01-b170
          speaker: narrator
          text: >-
            Its golden beak turned slowly from side to side, and it gave an injured sniff. A hurried conference followed. Someone fetched plates from the kitchen. Brown sugar, sealing wax, and tobacco were arranged on them, and something from a square bottle was poured over the mixture. Then a match set it alight. This was the only incense anyone could find at short notice in the Phoenix Office. It certainly burned fiercely, and it produced a tremendous amount of smoke.
        - id: ch01-b171
          speaker: gentleman
          text: >-
            We have gathered on an occasion without equal in the history of this office. Our respected Phoenix—
        - id: ch01-b172
          speaker: phoenix
          text: >-
            Head of the House.
        - id: ch01-b173
          speaker: gentleman
          text: >-
            I was coming to that. Our respected Phoenix, Head of this ancient House, has at last done us the honor of coming among us. I think I may say that none of us is blind to the greatness of this occasion. With one united and certain voice, we welcome the bird we have wished for so long to see here in our midst.
        - id: ch01-b174
          speaker: narrator
          text: >-
            Several younger clerks nearly called, "Hear, hear," but feared that might be disrespectful.
        - id: ch01-b175
          speaker: gentleman
          text: >-
            I will not spend time repeating the benefits of properly used fire insurance. We all know that our purpose has always been to deserve the noble bird whose name we bear and whose presence now adorns our mantelpiece. Three cheers for the winged Head of the House!
        - id: ch01-b176
          speakers: [gentleman, clerk_one, clerk_two, cook]
          ensemble: chorus
          text: >-
            Hip, hip, hooray! Hip, hip, hooray! Hip, hip, hooray!
        - id: ch01-b177
          speaker: narrator
          text: >-
            The cheers rose around the boardroom with a deafening force. When the last of the noise had finally died away, the Phoenix was invited to say a few words in return.
        - id: ch01-b178
          speaker: phoenix
          text: >-
            It gives me great pleasure to find myself at last inside my own temple. You have received me with great warmth and cordiality. Please do not imagine that I fail to appreciate it when I ask you to recite an ode or sing a choric song. That form of homage is what I have always been accustomed to.
        - id: ch01-b179
          speaker: narrator
          text: >-
            The four children had watched this astonishing scene in silence. Now they glanced nervously across a foam of pale faces above a sea of black coats. It seemed to them that the Phoenix was asking too much.
        - id: ch01-b180
          speaker: phoenix
          text: >-
            Time is short. The original invocation ode is long and written in Greek. Besides, there is no sense invoking me when I am already here. Surely you have a song in your own language for a great day like this.
        - id: ch01-b181
          speaker: narrator
          text: >-
            The manager began to sing almost absently, as if the first tune had come into his head before he could stop it. One voice after another joined his until the whole room was singing.
        - id: ch01-b182
          speakers: [gentleman, clerk_one, clerk_two, cook]
          ensemble: chorus
          text: >-
            Absolute security! No liability! All kinds of property insured against fire. Terms most favorable, expenses reasonable, moderate rates for annual insurance.
        - id: ch01-b183
          speaker: phoenix
          text: >-
            That is not my favorite song. I also think you have forgotten part of it.
        - id: ch01-b184
          speaker: narrator
          text: >-
            The manager hurried into another tune.
        - id: ch01-b185
          speakers: [gentleman, clerk_one, clerk_two, cook]
          ensemble: chorus
          text: >-
            O Golden Phoenix, fairest bird, the whole great world has often heard of all the splendid things we do, Great Phoenix, just to honor you.
        - id: ch01-b186
          speaker: phoenix
          text: >-
            Better.
        - id: ch01-b187
          speakers: [gentleman, clerk_one, clerk_two, cook]
          ensemble: chorus
          text: >-
            Class one, for private dwelling-house, for household goods and shops allows, provided these are built of brick or stone, and tiled and slated thick.
        - id: ch01-b188
          speaker: phoenix
          text: >-
            Try a later verse.
        - id: ch01-b189
          speakers: [gentleman, clerk_one, clerk_two, cook]
          ensemble: chorus
          text: >-
            In Scotland our insurance yields the price of burnt-up stacks in fields.
        - id: ch01-b190
          speaker: phoenix
          text: >-
            Skip that verse.
        - id: ch01-b191
          speakers: [gentleman, clerk_one, clerk_two, cook]
          ensemble: chorus
          text: >-
            Thatched dwellings and their whole contents, we deal with, also with their rents. O glorious Phoenix, look and see that these are dealt with in class three. The glories of your temple throng too thick to go in any song. And we attend, O good and wise, to days of grace and merchandise. When people's homes are burned away, they never have a cent to pay, if they have done as all should do, O Phoenix, and have honored you. So let us raise our voice and sing the praises of the Phoenix King. In classes one and two and three, O trust to him, for kind is he!
        - id: ch01-b192
          speaker: phoenix
          text: >-
            You are certainly very kind. Now we must leave. Thank you for a most pleasant time. May you prosper exactly as you deserve. I have never met a nicer or more pleasantly spoken company of temple attendants, and I never wish to meet one. Good day to you all!
        - id: ch01-b193
          speaker: narrator
          text: >-
            The Phoenix fluttered onto Robert's wrist and drew all four children out of the boardroom. The entire office staff followed them down the broad stairs. Then the employees filed back into their accustomed places. The two most important officials came out onto the steps and stood bowing. They stayed there until Robert had buttoned the golden bird safely into the breast of his Norfolk jacket and all five visitors had disappeared into the London crowd.

            The two important gentlemen looked at each other for a long moment. Their expressions were both earnest and strange. Then they withdrew into the sacred inner rooms where they worked without ceasing for the good of the House.

            As soon as every manager, secretary, clerk, and porter was back in place, each one gave a start. Each glanced cautiously around to see whether anyone else was watching. Every man believed he had fallen asleep for a few minutes and dreamed a very peculiar dream about the Phoenix and the boardroom. Of course, nobody mentioned the dream to anybody else. Falling asleep at the office was something one simply must not do.

            The extraordinary disorder in the boardroom would have proved at once that the visit was no dream but a radiant reality. The plates still held the remains of the strange incense. The chairs and great table were out of place. Yet nobody entered the boardroom again that day. Before the office opened next morning, a woman whose business did not include asking questions cleaned everything and put the room in perfect order.

            That was why Cyril searched the newspapers the next day, and then searched them again the day after that, without finding a single word about the visit. No sensible person thinks a dream is worth putting in the newspaper, and no one will admit to having fallen asleep in the daytime.
        - id: ch01-b194
          speaker: narrator
          text: >-
            The Phoenix was extremely pleased with its visit to the temple and with the welcome it had received there. Even so, it decided that it ought to compose an ode for itself. In the Phoenix's opinion, the odes it had heard at the temple had all been composed far too hastily. Its own new ode began with these words.
        - id: ch01-b195
          speaker: phoenix
          text: >-
            For beauty and for modest worth, the Phoenix has not its equal on earth.
        - id: ch01-b196
          speaker: narrator
          text: >-
            The Phoenix went on working at its poetry for the rest of the evening. When the children went to bed that night, it was still struggling with the ode. The last line was not the proper length, so the bird tried again and again to make it shorter. Yet it refused to remove any of the things it wanted the line to say.

            That is what makes poetry so difficult.
