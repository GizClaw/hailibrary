audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带一点英式童话的机智
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明自信，挖苦人时一本正经
        timbre: 清脆的少年声
        pace: 中等偏快
        pitch: 中高
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴敏锐，急切时仍然清楚
        timbre: 柔和明亮的少女声
        pace: 中等
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 坚持己见，认真里常带几分莽撞
        timbre: 结实清朗的少年声
        pace: 中等
        pitch: 中等
    jane:
      display_name: 简
      tts:
        delivery: 天真直率，话里带着小孩子的认真
        timbre: 稚嫩柔软的女孩声
        pace: 稍慢
        pitch: 偏高
    phoenix:
      display_name: 凤凰
      tts:
        delivery: 文雅自负，庄重中带着敏锐的幽默
        timbre: 华美清润，中性而成熟
        pace: 从容
        pitch: 中高
    ike:
      display_name: 艾克
      tts:
        delivery: 粗野油滑，挖苦人时拖腔拿调
        timbre: 沙哑的少年声
        pace: 中等偏快
        pitch: 中低
    herb:
      display_name: 厄布
      tts:
        delivery: 粗声粗气，逞强里带着警觉
        timbre: 干涩的少年声
        pace: 中等偏快
        pitch: 中等
    young_clerk:
      display_name: 年轻职员
      tts:
        delivery: 冷淡不耐烦，语气生硬
        timbre: 清晰的年轻男声
        pace: 中等
        pitch: 中等
    older_clerk:
      display_name: 年长职员
      tts:
        delivery: 一本正经，措辞谨慎
        timbre: 稳重的成年男声
        pace: 中等
        pitch: 中低
    kind_gentleman:
      display_name: 好心先生
      tts:
        delivery: 亲切快活，困惑时仍然彬彬有礼
        timbre: 温厚清朗的成年男声
        pace: 从容
        pitch: 中等
    porter:
      display_name: 门房麦肯齐
      tts:
        delivery: 恭敬机敏，回答干脆
        timbre: 朴实沉稳的成年男声
        pace: 中等
        pitch: 中低
    wilson:
      display_name: 威尔逊先生
      tts:
        delivery: 庄重克制，带着受宠若惊的敬意
        timbre: 清晰稳重的成年男声
        pace: 从容
        pitch: 中低
    sterry:
      display_name: 斯特里先生
      tts:
        delivery: 郑重恭敬，措辞讲究
        timbre: 圆润稳重的成年男声
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 神庙
      blocks:
        - id: ch01-b01
          speaker: jane
          text: 真希望能找到凤凰。它可比地毯会陪人多了。
        - id: ch01-b02
          speaker: cyril
          text: 小孩子忘起恩来，真叫人受不了。
        - id: ch01-b03
          speaker: jane
          text: 我没有忘恩。可地毯又不会说话，也照顾不好自己。不是被人卖掉，就是给带到海里。凤凰才不会让人卖了呢。
        - id: ch01-b04
          speaker: narrator
          text: 义卖会已经过去两天，大家心里都有点不痛快。也说不上究竟为什么，有些日子就是这样。顺便告诉你，这种日子通常都是星期一，而这一天恰好正是星期一。
        - id: ch01-b05
          speaker: cyril
          text: 说不定你那宝贝凤凰早飞走了。我也不能怪它，你看看这天气。
        - id: ch01-b06
          speaker: robert
          text: 这天气根本不值得看。
        - id: ch01-b07
          speaker: narrator
          text: 的确没什么可看的。
        - id: ch01-b08
          speaker: anthea
          text: 凤凰没有走，我敢肯定。我再去找一次。
        - id: ch01-b09
          speaker: narrator
          text: 安西娅趴下来找遍桌椅下面，又把箱子和篮子一只只翻过。连妈妈的针线袋和爸爸的旅行箱，她也没漏掉。可无论她往哪里看，凤凰连一丁点闪亮的羽毛尖儿都没露出来。
        - id: ch01-b10
          speaker: narrator
          text: 罗伯特忽然想起，他曾把整整七千行希腊召唤歌，缩成一句英文六音步诗。他站到地毯上，唱了起来。
        - id: ch01-b11
          speaker: robert
          text: 来吧，来吧，美丽又善良的老凤凰。
        - id: ch01-b12
          speaker: narrator
          text: 几乎就在同时，厨房楼梯上传来翅膀的窸窣声。凤凰展开宽阔的金翅膀，轻盈地飞进了屋。
        - id: ch01-b13
          speaker: anthea
          text: 你到底去哪儿了？我什么地方都找过了。
        - id: ch01-b14
          speaker: phoenix
          text: 你没有找遍。因为我待的地方，你就没去找。承认吧，你漏掉了一处神圣之地。
        - id: ch01-b15
          speaker: cyril
          text: 什么神圣之地？
        - id: ch01-b16
          speaker: narrator
          text: 西里尔已经有点不耐烦了。时间一直在走，许愿毯却还闲着。
        - id: ch01-b17
          speaker: phoenix
          text: 那里有我的金身驾临，自然就成了圣地。它名叫卢特隆。
        - id: ch01-b18
          speaker: cyril
          text: 叫什么？
        - id: ch01-b19
          speaker: phoenix
          text: 浴室，也就是洗涤身体的地方。
        - id: ch01-b20
          speaker: jane
          text: 你不可能在那里。我找了三遍，连毛巾都挪开看过。
        - id: ch01-b21
          speaker: phoenix
          text: 我藏在一根金属圆柱顶上。那东西一定施过魔法，它把我金色的脚趾烘得暖暖的，就像荒漠里辉煌的太阳一直照着我。
        - id: ch01-b22
          speaker: cyril
          text: 原来是热水筒。这种天气摸起来确实舒服。现在我们去哪儿？
        - id: ch01-b23
          speaker: narrator
          text: 接下来，大家照例又争起了该去哪里、该做什么。这种争论他们已经有过很多次了。每个人兴冲冲想出的主意，偏偏都叫另外三个人提不起兴趣。
        - id: ch01-b24
          speaker: cyril
          text: 我年纪最大。去北极吧。
        - id: ch01-b25
          speaker: robert
          text: 这种天气还去北极？你怎么想的？去赤道才对。
        - id: ch01-b26
          speaker: anthea
          text: 我想去戈尔康达的钻石矿。简，你呢？
        - id: ch01-b27
          speaker: jane
          text: 不去。我不赞成你，也不赞成任何人。
        - id: ch01-b28
          speaker: narrator
          text: 凤凰抬起一只爪子，提醒他们当心。
        - id: ch01-b29
          speaker: phoenix
          text: 你们要是连自己都商量不拢，那我恐怕只能离开了。
        - id: ch01-b30
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 那该去哪儿？你来决定！
        - id: ch01-b31
          speaker: phoenix
          text: 换作是我，就让地毯休息一天。你们去哪儿都坐着它，迟早连腿都不会用了。不如带我出去走走，再给我介绍一下这座难看的城市。
        - id: ch01-b32
          speaker: robert
          text: 要是天晴，我们就去。你看看这场雨。还有，为什么非得让地毯休息？
        - id: ch01-b33
          speaker: phoenix
          text: 难道你又贪婪，又霸道，还没心肝又自私吗？
          emotion: angry
        - id: ch01-b34
          speaker: robert
          text: 我才不是！
          emotion: angry
        - id: ch01-b35
          speaker: phoenix
          text: 那不就结了。至于这场雨，我也不喜欢。太阳最爱照耀我，因为我的金光能让它更加光彩。它要是知道我在这里，准会出来。你们碰到雨天，没有什么管用的口诀吗？
        - id: ch01-b36
          speaker: anthea
          text: 有一句“雨呀雨呀快走开”，可雨从来不听。
        - id: ch01-b37
          speaker: phoenix
          text: 也许是你们念召唤词的方法不对。
        - id: ch01-b38
          speaker: anthea
          text: 雨呀雨呀快走开，改天再请你回来，小小宝宝要玩耍。
        - id: ch01-b39
          speaker: phoenix
          text: 全念错了。你还念得这么没精神，难怪雨不理你。你应该打开窗户，使劲大声喊。雨呀雨呀快走开，改天再请你回来。如今我们盼太阳，好雨行行好，且请往别方！
        - id: ch01-b40
          speaker: phoenix
          text: 请别人走开，更应该客客气气。今天还可以加上这几句。伟大太阳放光明，美丽凤——凰在此停，灿烂太阳照金翎！
        - id: ch01-b41
          speaker: cyril
          text: 这是诗！
        - id: ch01-b42
          speaker: robert
          text: 听着挺像诗的。
        - id: ch01-b43
          speaker: phoenix
          text: 我非得加上“美丽”两个字，不然那一行就不够长。
        - id: ch01-b44
          speaker: jane
          text: 一样长的难听词也多得是。
        - id: ch01-b45
          speakers: [cyril, anthea, robert]
          ensemble: chorus
          text: 嘘！
        - id: ch01-b46
          speaker: narrator
          text: 他们打开窗户，扯开嗓子喊完了七行诗。凤凰也念了，只把“美丽”两个字跳过去。念到那里，它低下头，很不好意思地咳了一声。
        - id: ch01-b47
          speaker: narrator
          text: 雨迟疑了一会儿，终于走了。
        - id: ch01-b48
          speaker: phoenix
          text: 这才叫真正的好礼貌。
        - id: ch01-b49
          speaker: narrator
          text: 转眼间，凤凰已经栖在窗台上。它迎着突然洒进来的辉煌阳光，慢慢开合灿烂的双翅，又把金色羽毛一根根抖开。那种阳光，平常只有秋日黄昏偶尔才看得到。后来人们提起这一天，都说伦敦的十二月已经好多年、好多年、好多年没出现过这样的阳光了。
        - id: ch01-b50
          speaker: phoenix
          text: 现在去城里吧。带我瞻仰一座属于我的神庙。
        - id: ch01-b51
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 你的神庙？
        - id: ch01-b52
          speaker: phoenix
          text: 我从地毯那里知道，这片国土上有许多我的神庙。
        - id: ch01-b53
          speaker: jane
          text: 地毯从来不开口，你怎么能从它那里知道事情？
        - id: ch01-b54
          speaker: phoenix
          text: 它虽然不说话，人还是能从地毯上捡到东西。我就见你捡过。我也这样捡到了几条消息。你们给我看画像的那张纸草卷上，写着城里一条街的名字。我最壮丽的神庙就在那里，门前对面还有石头和金属做成的圣像。
        - id: ch01-b55
          speaker: robert
          text: 你说的是火灾保险公司。那不是真的神庙，他们也没有……
        - id: ch01-b56
          speaker: phoenix
          text: 请原谅，你知道的完全不对。那里就是神庙，他们也确实有圣像。
        - id: ch01-b57
          speaker: anthea
          text: 别浪费这场阳光。我们边走边争，还能省点时间。
        - id: ch01-b58
          speaker: narrator
          text: 凤凰答应在罗伯特的诺福克夹克胸前做个窝，大家便一起走进灿烂的阳光。商量以后，他们觉得去凤凰神庙最方便的办法是坐电车。孩子们坐在车顶一路聊天。凤凰藏在衣襟里，不时小心地探出一点鸟喙，警觉地转转眼珠，听见不同意的话还要反驳几句。
        - id: ch01-b59
          speaker: narrator
          text: 这趟车一路坐得非常畅快，孩子们都很庆幸，口袋里还剩下足够付车费的钱。他们一直坐到电车线路的终点。车不再往前，他们也只好停下，在格雷律师学院路尽头下了车。
        - id: ch01-b60
          speaker: narrator
          text: 西里尔以为，从费特巷和卢德门广场之间那些拥挤的小街窄院穿过去，能抄近道到凤凰公司。他当然错了。罗伯特当时就明明白白说过这条路不对。后来一路上只要有机会，他也没忘记再次提醒哥哥，自己早就说过。
        - id: ch01-b61
          speaker: narrator
          text: 那里的街道又窄又闷，还很难看。刚下工的印刷厂男孩和装订厂姑娘挤满了路，盯着姐妹俩鲜亮的红外套和红帽子猛瞧。两个女孩后悔没走另一条路。有人冲简嚷嚷，叫她剪掉头发，又有人追问安西娅的帽子是在哪里买的。女孩们不屑理睬。西里尔和罗伯特倒想还击，可对方太粗野，他们怎么也想不出同样难听的话。
        - id: ch01-b62
          speaker: narrator
          text: 他们猛地拐过街角。安西娅拉着简冲进一道拱门，又躲进里面的一扇门。西里尔和罗伯特赶紧跟上。那群起哄的人没看见他们，径直走远了。
        - id: ch01-b63
          speaker: narrator
          text: 安西娅长长地松了口气。
        - id: ch01-b64
          speaker: anthea
          text: 太可怕了！我还以为这样的人只有书里才有呢。
        - id: ch01-b65
          speaker: cyril
          text: 是有点过分。不过也怪你们，偏要穿这么显眼的外套出来。
        - id: ch01-b66
          speaker: jane
          text: 我们要和凤凰一起出门，当然该这么穿嘛。
        - id: ch01-b67
          speaker: phoenix
          text: 一点不错。
        - id: ch01-b68
          speaker: narrator
          text: 凤凰一时大意，探出脑袋朝简眨眼赞许。就在这时，一只脏手从阴暗的楼梯栏杆间伸出来，一把抓住了它。
        - id: ch01-b69
          speaker: ike
          text: 嘿，厄布，这不就是咱们丢的波莉鹦鹉吗？多谢您啦，太太，还把它送回家歇窝。
        - id: ch01-b70
          speaker: narrator
          text: 四个孩子猛地转过身。两个衣衫褴褛的大男孩蹲在楼梯阴影里。他们比西里尔和罗伯特高大得多。艾克抢走凤凰，把它高高举在孩子们头顶。
        - id: ch01-b71
          speaker: cyril
          text: 把鸟还给我。它是我们的。
        - id: ch01-b72
          speaker: ike
          text: 午安，多谢您嘞。可惜没法给您两便士跑腿钱。我为了在所有报纸上登广告找这只值钱的鸟，家产都花光啦。明年再来领赏吧。
        - id: ch01-b73
          speaker: herb
          text: 小心点，艾克。它那张嘴会啄人。
        - id: ch01-b74
          speaker: ike
          text: 谁敢来认领我的波莉鹦鹉，自然有“鹰嘴”警察啄他。厄布，你闭嘴。你们四个小丫头，赶紧滚出去。
        - id: ch01-b75
          speaker: robert
          text: 小丫头？我这就让你看看谁是小丫头！
          emotion: angry
        - id: ch01-b76
          speaker: narrator
          text: 罗伯特一步冲上三级台阶，挥拳打去。先是一声尖叫，那是凤凰叫得最像鸟的一次。接着翅膀乱扑，黑暗里传来笑声。
        - id: ch01-b77
          speaker: ike
          text: 瞧，你一拳正打在我的波莉鹦鹉羽毛上。下手真狠，把它打惨喽。
        - id: ch01-b78
          speaker: narrator
          text: 罗伯特气得直跺脚。西里尔觉得自己连脸都气白了，拼命转动脑筋，想逼它聪明起来，好找出一个法子收拾这两个大男孩。安西娅和简也气坏了，可她们一生气，眼泪就要往上涌。最后还是安西娅先忍住眼泪，开了口。
        - id: ch01-b79
          speaker: anthea
          text: 求求你，把我们的鸟还回来吧。
        - id: ch01-b80
          speaker: ike
          text: 求求您快走吧，让我们跟自己的鸟安生待着。
        - id: ch01-b81
          speaker: anthea
          text: 你们不还，我就去叫警察。
        - id: ch01-b82
          speaker: herb
          text: 快去啊！艾克，要我说，干脆把这只该死的鸽子脖子拧断。它连两便士都不值。
        - id: ch01-b83
          speaker: jane
          text: 不要伤害它！千万别伤害它！它多招人喜欢呀。
          emotion: fearful
        - id: ch01-b84
          speaker: ike
          text: 我不会伤它。厄布，你居然能想出这种事，真该害臊。小姐，只要半个金闪闪，这只鸟就永远归你。
        - id: ch01-b85
          speaker: anthea
          text: 半个什么？
        - id: ch01-b86
          speaker: ike
          text: 半个金闪闪。半镑，一枚厚家伙，就是半个金镑。
        - id: ch01-b87
          speaker: anthea
          text: 我没有那么多钱。再说，它本来就是我们的鸟。
        - id: ch01-b88
          speaker: cyril
          text: 别再跟他说了。
        - id: ch01-b89
          speaker: jane
          text: 凤凰，亲爱的凤凰，我们实在没办法了。你得自己想个法子。
        - id: ch01-b90
          speaker: phoenix
          text: 乐意效劳。
        - id: ch01-b91
          speaker: narrator
          text: 艾克惊得差点把凤凰掉在地上。
        - id: ch01-b92
          speaker: ike
          text: 嘿，它真的会说话！
          emotion: surprised
        - id: ch01-b93
          speaker: phoenix
          text: 年轻人，不幸之子，听我一言。
        - id: ch01-b94
          speaker: ike
          text: 我的老天！
          emotion: surprised
        - id: ch01-b95
          speaker: herb
          text: 小心啊，艾克。你快把这滑稽东西掐死了。我一眼就看得出来，它值跟自己一样重的钞票。
        - id: ch01-b96
          speaker: phoenix
          text: 听着，破坏圣像的艾科诺克拉斯特斯。还有你，住在污秽城市里的乌尔巴努斯。马上住手，不然更大的灾祸就要落到你们头上。
        - id: ch01-b97
          speaker: ike
          text: 老天爷呀！他们把这鸟教得可真有学问。
        - id: ch01-b98
          speaker: phoenix
          text: 把我交还给年轻的侍祭，你们就能全身而退。要是还扣着我，那么……
        - id: ch01-b99
          speaker: ike
          text: 这只波莉准是给他们偷去以后，才学会了这套话。我的妈呀，这帮小鬼真够狡猾的！
        - id: ch01-b100
          speaker: herb
          text: 照我说，揍他们的嘴，再带着赃物溜掉。
        - id: ch01-b101
          speaker: ike
          text: 就这么办。
        - id: ch01-b102
          speaker: phoenix
          text: 住手。是谁在奥尔德曼伯里，从那个老家伙身上摸走了怀表？又是谁在贝尔院，从那个小姑娘手里顺走了手绢？是谁……
          emotion: angry
        - id: ch01-b103
          speaker: ike
          text: 闭嘴！你！呸！呀！放开我！把它打掉，厄布。它要把我的眼珠子从脑袋里挖出来啦！
          emotion: fearful
        - id: ch01-b104
          speaker: narrator
          text: 黑暗里顿时响起一阵嚎叫，接着是一场乱七八糟的扭打。凤凰的翅膀不停扑动，撞得到处都是声响。艾克和厄布再也顾不上扣住这只值钱的鸟，转身逃上楼梯。凤凰从门口疾飞出去，四个孩子也拔腿跟着跑了。
        - id: ch01-b105
          speaker: narrator
          text: 凤凰从门口疾飞出去，落到罗伯特身上。后来安西娅说，那一下轻得像蝴蝶停在玫瑰上。接着它把身子一扭，飞快钻进罗伯特的诺福克夹克胸前。西里尔后来却说，那样子分明像鳗鱼钻进泥里。
        - id: ch01-b106
          speaker: narrator
          text: 大家匆匆逃过窄巷，到了宽阔安全的法灵顿街，罗伯特才开口。
        - id: ch01-b107
          speaker: robert
          text: 你为什么不干脆烧他一下？你明明能做到，对不对？
        - id: ch01-b108
          speaker: phoenix
          text: 我当然能。可为了这点小事就让自己发热，未免有失体面。命运三女神待我还不算吝啬。我在伦敦的麻雀里有许多朋友，自己也有嘴有爪。
        - id: ch01-b109
          speaker: narrator
          text: 这场遭遇多少挫伤了孩子们冒险的兴致。刚才那些威吓和扭打还压在心头，谁都不像出门时那么快活。凤凰只好使出自己金光灿烂的本领，一路给他们鼓劲，才让大家继续往神庙走。
        - id: ch01-b110
          speaker: narrator
          text: 不久，孩子们来到伦巴第街一座宏伟的大楼前。高大的门两边各有一尊石刻凤凰，正对着街道。门旁那块黄铜牌擦得闪闪发亮，上面清清楚楚写着“凤凰火灾保险公司”。
        - id: ch01-b111
          speaker: phoenix
          text: 等一等。火？想必指的是祭坛上的圣火吧？
        - id: ch01-b112
          speaker: robert
          text: 我可不知道。
        - id: ch01-b113
          speaker: narrator
          text: 罗伯特听见凤凰把保险公司当成神庙，渐渐觉得不好意思。可他又不知道该怎样说明白。罗伯特一觉得难为情，脾气总会跟着变坏，说出来的话也就不那么客气了。
        - id: ch01-b114
          speaker: cyril
          text: 你明明知道。要是谁家的房子烧了，凤凰公司就赔他一座新房子。爸爸告诉我的，我还特意问过。
        - id: ch01-b115
          speaker: phoenix
          text: 原来房屋也和凤凰一样，能从自己的灰烬里重生。我的祭司把世人照顾得真周到！
        - id: ch01-b116
          speaker: anthea
          text: 不过人们得付钱，只是每年付一点点。
        - id: ch01-b117
          speaker: phoenix
          text: 那是用来供养我的祭司，让他们在灾难过后安慰人们，再把房屋建起来。带路吧，我要见大祭司。我不愿突然把全部荣光压到他们身上。瘸足又丑陋的赫淮斯托斯做下恶事，他们却能让恶果消失，实在高贵可敬。
        - id: ch01-b118
          speaker: cyril
          text: 我听不懂。真希望你别拿这些新名字来绕晕我们。火灾是自己发生的，不能有人故意放火。故意放火是犯罪，叫砒霜罪，还是什么差不多的词，因为那跟下毒害人一样坏。凤凰不会帮助那种人，爸爸说过。
        - id: ch01-b119
          speaker: phoenix
          text: 我的祭司做得很好。带路。
        - id: ch01-b120
          speaker: cyril
          text: 可我不知道进去该说什么。
        - id: ch01-b121
          speakers: [anthea, robert, jane]
          ensemble: chorus
          text: 我们也不知道。
        - id: ch01-b122
          speaker: phoenix
          text: 就说要求见大祭司。再说，你们有一个关系到我受人供奉的秘密要禀告，他自然会带你们进入最深处的圣殿。
        - id: ch01-b123
          speaker: narrator
          text: 四个孩子虽然谁都不大情愿，还是一起走了进去。大厅又宽敞又漂亮，四周镶着光洁的道尔顿陶砖，像一间没有水、却大得出奇的浴室。庄严的柱子一直撑到屋顶。一面墙上却有个难看的褐色陶凤凰，难看到连整面墙都跟着丢脸。
        - id: ch01-b124
          speaker: narrator
          text: 大厅里摆着桃花心木配黄铜的柜台和书桌，擦得都很体面。职员们有的埋头伏案工作，有的拿着纸张在柜台后面来回走动。穿过大厅的内门上方，还挂着一座人人看得见的大钟。
        - id: ch01-b125
          speaker: phoenix
          text: 求见大祭司。
        - id: ch01-b126
          speaker: narrator
          text: 一个穿着整齐黑衣的年轻职员走过来。他管住了嘴，却没能管住两道眉毛。他俯身撑着柜台，孩子们本以为他会像布店伙计那样客气，谁知他一开口却不是那么回事。
        - id: ch01-b127
          speaker: young_clerk
          text: 你们几个来干什么？
        - id: ch01-b128
          speaker: cyril
          text: 我们要见大祭司。
        - id: ch01-b129
          speaker: young_clerk
          text: 一边玩儿去。
        - id: ch01-b130
          speaker: narrator
          text: 另一个同样穿着整齐黑外套、年纪大些的职员走了过来。
        - id: ch01-b131
          speaker: older_clerk
          text: 也许他们找的是某某先生。你知道，他是共济会的大祭司。
        - id: ch01-b132
          speaker: narrator
          text: 至于那个名字，就算天塌下来，讲故事的人也绝不会说。一名门房奉命去找星号先生。孩子们只能留在原地，一边看着桃花心木桌边的先生们，一边让所有先生盯着自己。安西娅和简觉得这些人看上去很和善。西里尔和罗伯特却觉得，他们只会毫不客气地瞪人。
        - id: ch01-b133
          speaker: narrator
          text: 门房回来报告，点横点先生已经出去了，不过某某先生还在。讲故事的人依旧万万不能泄露这些名字。就在这时，一位真正讨人喜欢的先生出现了。他留着胡子，眼神亲切又快活。四个孩子一眼就看出来，他自己也有孩子，所以能听懂小孩子到底在说些什么。尽管这样，要把凤凰的事解释清楚，依然很难。
        - id: ch01-b134
          speaker: kind_gentleman
          text: 有什么事？某某先生出去了，我能帮忙吗？
        - id: ch01-b135
          speaker: phoenix
          text: 最深处的圣殿。
        - id: ch01-b136
          speaker: kind_gentleman
          text: 请再说一遍？
        - id: ch01-b137
          speaker: narrator
          text: 好心先生还以为刚才说话的是罗伯特。
        - id: ch01-b138
          speaker: cyril
          text: 我们有件事想告诉您，可这里人太多了。
        - id: ch01-b139
          speaker: narrator
          text: 西里尔看了一眼门房。那人磨磨蹭蹭待在旁边，离得远没有他该站的那么远。好心先生笑了。
        - id: ch01-b140
          speaker: kind_gentleman
          text: 那就到楼上去吧。
        - id: ch01-b141
          speaker: narrator
          text: 他领着大家走上一道宽阔漂亮的楼梯。安西娅坚持说，整道楼梯都是白色大理石砌成的，不过讲故事的人不能肯定。楼梯顶端的角柱上，立着一尊深色金属铸成的美丽凤凰。左右两边的墙上，也各有一幅扁平的凤凰像。
        - id: ch01-b142
          speaker: narrator
          text: 好心先生领他们进了一间屋子。椅子蒙着红褐色皮革，连桌子也一样。他询问似的望着孩子们。
        - id: ch01-b143
          speaker: kind_gentleman
          text: 不用害怕。你们到底想要什么，只管告诉我。
          emotion: calm
        - id: ch01-b144
          speaker: cyril
          text: 我能把门关上吗？
        - id: ch01-b145
          speaker: narrator
          text: 那位先生很惊讶，不过还是把门关了。
        - id: ch01-b146
          speaker: cyril
          text: 您听了肯定会大吃一惊，还会觉得这是假的，觉得我们是疯子。可我们没疯，事情也是真的。罗伯特的诺福克夹克里藏着一样东西。罗伯特就是我弟弟。先生，您千万别害怕，也别晕过去。你们给这家公司起名叫“凤凰”时，当然没想到世上真有凤凰。可凤凰确实存在，现在就藏在罗伯特的衣服里，贴着他的胸口。
        - id: ch01-b147
          speaker: kind_gentleman
          text: 如果是一件凤凰形状的古董，我想董事会也许……
        - id: ch01-b148
          speaker: narrator
          text: 罗伯特已经摸索着解起了纽扣。
        - id: ch01-b149
          speaker: anthea
          text: 按它自己说的年纪，确实算得上古老，可是……
        - id: ch01-b150
          speaker: narrator
          text: 凤凰最后一扭，伴着一阵翅膀声，从罗伯特胸前的窝里钻出来，站在蒙皮桌面上。
        - id: ch01-b151
          speaker: kind_gentleman
          text: 我的老天爷！多么漂亮又稀奇的鸟！我从没见过跟它一样的。
          emotion: surprised
        - id: ch01-b152
          speaker: phoenix
          text: 我想你当然没见过。
        - id: ch01-b153
          speaker: narrator
          text: 凤凰的骄傲完全情有可原。好心先生却吓得跳了起来。
        - id: ch01-b154
          speaker: kind_gentleman
          text: 原来它受过训练，会说话！也许是某种鹦鹉？
          emotion: surprised
        - id: ch01-b155
          speaker: phoenix
          text: 我是这座会社的首领。我来到自己的神庙，是为了接受你们的敬奉。我不是鹦鹉。我是世间独一无二的凤凰。我要大祭司向我致敬。
        - id: ch01-b156
          speaker: kind_gentleman
          text: 经理不在。也许我可以……我到底在说什么？
        - id: ch01-b157
          speaker: narrator
          text: 他的脸白了，抬手擦了擦额头。
        - id: ch01-b158
          speaker: kind_gentleman
          text: 亲爱的孩子们，今天这天气热得反常，我有点不舒服。刚才有那么一会儿，我竟然觉得这只特别的鸟真的开口说话，自称凤凰。更糟的是，我居然还信了。
        - id: ch01-b159
          speaker: cyril
          text: 它确实说了，先生。您也确实相信了。
        - id: ch01-b160
          speaker: kind_gentleman
          text: 真的吗？请稍等。
        - id: ch01-b161
          speaker: narrator
          text: 他按铃叫人，门房走了进来。
        - id: ch01-b162
          speaker: kind_gentleman
          text: 麦肯齐，你看见那只金色的鸟了吗？
        - id: ch01-b163
          speaker: porter
          text: 看见了，先生。
        - id: ch01-b164
          speaker: narrator
          text: 那位先生松了一口气。
        - id: ch01-b165
          speaker: kind_gentleman
          text: 这么说，它是真的？
        - id: ch01-b166
          speaker: porter
          text: 当然是真的，先生。您拿在手里试试就知道了。
        - id: ch01-b167
          speaker: narrator
          text: 门房很同情他，说着便伸手去抓凤凰。凤凰往后一缩，弯曲的每根脚趾都透着愤怒。
        - id: ch01-b168
          speaker: phoenix
          text: 住手！你怎么敢向我伸手？
          emotion: angry
        - id: ch01-b169
          speaker: narrator
          text: 门房敬了个礼。
        - id: ch01-b170
          speaker: porter
          text: 请原谅，先生。我还以为您是一只鸟。
        - id: ch01-b171
          speaker: phoenix
          text: 我的确是鸟。是那只至高无上的鸟，凤凰。
        - id: ch01-b172
          speaker: porter
          text: 您当然是，先生。我一开始就看出来了，只是刚刚才喘过气来。
        - id: ch01-b173
          speaker: kind_gentleman
          text: 好了，请威尔逊先生和斯特里先生上来一趟。
        - id: ch01-b174
          speaker: narrator
          text: 斯特里先生和威尔逊先生轮流惊得说不出话，紧接着又都深信不疑。更让孩子们吃惊的是，公司里每个人都相信凤凰亲口说出的身份。最初那一下震惊过去以后，大家便觉得，凤凰当然是活的。它路过伦敦时特地来自己的神庙看看，也完全是天经地义的事。
        - id: ch01-b175
          speaker: kind_gentleman
          text: 我们应该举行一个仪式。今天来不及召集董事和股东，也许明天还可以。对，董事会议室最合适。凤凰这样亲切地屈尊来访，要是我们没有尽力表示感激，我心里实在过意不去。
        - id: ch01-b176
          speaker: narrator
          text: 孩子们几乎不敢相信自己的耳朵。他们从来没想到，除了自己，世上竟还有人肯相信凤凰。可这家公司里人人都信。职员们两三个一拨，不断被带进这间屋子。凤凰只要开口说上几句，不管来人是最聪明的，还是不那么聪明的，马上都会彻底信服。
        - id: ch01-b177
          speaker: narrator
          text: 西里尔暗暗猜想，第二天报纸会怎么写。他仿佛已经看见街头海报，说凤凰驾临自己的神庙，公司举行盛会恭迎圣驾，经理和全体人员欢欣鼓舞。
        - id: ch01-b178
          speaker: kind_gentleman
          text: 请允许我们暂时失陪。
        - id: ch01-b179
          speaker: narrator
          text: 好心先生和其他人一起出去了。门只关了一半，孩子们从门缝里听见许多双靴子在楼梯上急匆匆地奔走。兴奋的人声嗡嗡作响，一会儿有人解释，一会儿有人出主意，马上又有人争论。远处还有沉重家具被拖过地板的声音，一顿一顿地传来。
        - id: ch01-b180
          speaker: narrator
          text: 凤凰昂首挺胸，在蒙皮桌面上来回踱步，还不时回头欣赏自己漂亮的后背。
        - id: ch01-b181
          speaker: phoenix
          text: 你们看，我的举止多么让人信服。
        - id: ch01-b182
          speaker: narrator
          text: 这时，威尔逊先生走进屋，深深鞠了一躬。
        - id: ch01-b183
          speaker: wilson
          text: 一切都准备好了。时间太仓促，我们已经尽了全力。这场集会，也就是这场仪式，会在董事会议室举行。尊贵的凤凰愿意自己走过去吗？只有几步路。还是愿意乘坐某种交通工具？
        - id: ch01-b184
          speaker: phoenix
          text: 就让我的罗伯特背我去吧。你们居然把我神庙最深处的庭院叫作董事会议室，这名字实在难听。
        - id: ch01-b185
          speaker: narrator
          text: 大家跟着威尔逊先生走了。董事会议室里原本有一张很大的桌子，现在已经被推到一侧的长窗下面，给仪式腾出地方。一排排椅子横着摆满了整个房间。那样子就像学校要放映“我们的东方帝国”或“我们的海军作风”幻灯片，人人都得面朝前坐好。
        - id: ch01-b186
          speaker: narrator
          text: 房门用木头精雕而成，上面还刻着一只凤凰。安西娅注意到，前排椅子正是妈妈每次在旧家具店里都爱问价，却永远买不起的那一种。每一把的价钱差不多都要二十英镑。壁炉台上摆着几只沉甸甸的青铜烛台，还有一座钟，钟顶又立着一尊凤凰像。
        - id: ch01-b187
          speaker: phoenix
          text: 把那尊偶像搬走。
        - id: ch01-b188
          speaker: narrator
          text: 那座像立刻被匆匆拿走。凤凰飞到壁炉台正中央，看起来比任何时候都更金光灿烂。
        - id: ch01-b189
          speaker: narrator
          text: 整栋楼、整间公司的人全都进了董事会议室。从负责钱款的出纳员，到楼顶漂亮厨房里给职员做饭的女厨师，一个也没少。每个人走到凤凰面前时，都先恭恭敬敬地鞠一躬，然后才找到椅子坐下。
        - id: ch01-b190
          speaker: kind_gentleman
          text: 先生们，今天我们聚在这里……
        - id: ch01-b191
          speaker: phoenix
          text: 我怎么没有看见焚香？
        - id: ch01-b192
          speaker: narrator
          text: 凤凰委屈地吸了吸鼻子。众人赶紧凑在一起商量，又从厨房拿来几只盘子。盘子里放上红糖、封蜡和烟草，再从一只方瓶子里倒出些液体浇在上面。公司里一时只能找到这些当香料。火柴一点，它们烧得倒很旺，还冒出了许多烟。
        - id: ch01-b193
          speaker: kind_gentleman
          text: 今天我们聚在这里，是为了本公司创立以来从未有过的大事。我们尊敬的凤凰……
        - id: ch01-b194
          speaker: phoenix
          text: 会社首领。
        - id: ch01-b195
          speaker: kind_gentleman
          text: 我正要说到这里。我们尊敬的凤凰，这座古老会社的首领，今天终于赏光来到我们中间。我想，在座诸位都明白这是多大的荣耀。我们盼望这位贵客已经很久，如今大家一致热烈欢迎它。
        - id: ch01-b196
          speaker: narrator
          text: 几个年轻职员很想喊一声“说得好”，又怕这样对凤凰不够尊敬。
        - id: ch01-b197
          speaker: kind_gentleman
          text: 我不打算耽误各位太久，也不必再复述妥善使用本公司火灾保险的种种好处。诸位和我都知道，我们一直努力做一家配得上这只卓越之鸟的公司。我们用了它的名字，今天它又亲临壁炉台，为这里增添光彩。先生们，为生着双翼的会社首领欢呼三声！
        - id: ch01-b198
          speakers: [kind_gentleman, wilson, sterry, porter]
          ensemble: chorus
          text: 万岁！万岁！万岁！
          emotion: happy
        - id: ch01-b199
          speaker: narrator
          text: 欢呼声震耳欲聋。声音终于平息，众人又请凤凰讲几句话。凤凰用优雅的言辞说，它终于来到自己的神庙，心里十分欢喜。
        - id: ch01-b200
          speaker: phoenix
          text: 我还想请人朗诵一首颂诗，或者唱一支合唱歌。可不要以为我不感激诸位这么热烈又真诚的欢迎。我只是向来都习惯有这样的节目。
        - id: ch01-b201
          speaker: narrator
          text: 四个孩子默默看着眼前这场不可思议的仪式。他们越过一大片黑外套汇成的海，看着海面上一张张白花花的人脸，又彼此有些不安地交换眼色。谁都没敢当众开口，可在他们看来，凤凰刚受到这样隆重的欢迎，又马上索要颂诗，这个要求实在有点过分。
        - id: ch01-b202
          speaker: phoenix
          text: 时间不多。原来的召唤颂歌很长，又是用希腊文写的。何况我已经来了，没必要再召唤。难道你们自己的语言里，没有适合今天这种伟大日子的歌吗？
        - id: ch01-b203
          speaker: narrator
          text: 好心先生心不在焉地唱了起来，其他人也一个接一个加入。
        - id: ch01-b204
          speakers: [kind_gentleman, wilson, sterry, porter]
          ensemble: chorus
          text: 绝对有保障，不负半点债。各种各样财产，火灾都承保。条件最优惠，花费很公道。年度保险费率，适中又可靠。
        - id: ch01-b205
          speaker: phoenix
          text: 这首我不喜欢。而且你们好像还漏了一部分。
        - id: ch01-b206
          speaker: narrator
          text: 好心先生赶紧换了一首。
        - id: ch01-b207
          speaker: kind_gentleman
          text: 金色凤凰，百鸟之冠，天下早把美名传遍。我们事事做得辉煌，只为向伟大的你致敬。
        - id: ch01-b208
          speaker: phoenix
          text: 这首好些。
        - id: ch01-b209
          speakers: [kind_gentleman, wilson, sterry, porter]
          ensemble: chorus
          text: 第一类保私人住宅，家居货物与店铺。只须砖石砌墙壁，厚瓦石板盖屋顶。
        - id: ch01-b210
          speaker: phoenix
          text: 试试后面另一节。
        - id: ch01-b211
          speakers: [kind_gentleman, wilson, sterry, porter]
          ensemble: chorus
          text: 在那苏格兰田野上，草垛烧毁也照价赔偿。
        - id: ch01-b212
          speaker: phoenix
          text: 这一节跳过去。
        - id: ch01-b213
          speakers: [kind_gentleman, wilson, sterry, porter]
          ensemble: chorus
          text: 茅屋连同屋中家当，还有租金我们都管。辉煌凤凰，请你看看，第三类中全有保障。
        - id: ch01-b214
          speakers: [kind_gentleman, wilson, sterry, porter]
          ensemble: chorus
          text: 神庙荣光数不胜数，一支歌儿哪里装得下。仁慈智慧的凤凰啊，宽限期和货物我们都管。
        - id: ch01-b215
          speakers: [kind_gentleman, wilson, sterry, porter]
          ensemble: chorus
          text: 人们的家若烧成灰，便士也不用自己赔。只要人人尽本分，凤凰啊，把你来敬奉。
        - id: ch01-b216
          speakers: [kind_gentleman, wilson, sterry, porter]
          ensemble: chorus
          text: 让我们放声歌唱，赞美凤凰之王。一类二类和三类，都请信赖它的慈祥！
        - id: ch01-b217
          speaker: phoenix
          text: 你们实在太亲切了。现在我们该走了。非常感谢诸位，让我过得很愉快。愿你们得到与功绩相称的兴旺。我敢肯定，我从没见过，也绝不想再见到，比你们更和气、更会说好听话的一群神庙侍从。诸位，日安！
        - id: ch01-b218
          speaker: narrator
          text: 凤凰轻轻飞到罗伯特的手腕上，领着四个孩子离开董事会议室。公司全体人员都跟在他们身后，一路送下宽阔的楼梯。等凤凰和孩子们走出大门，这些人才一个接一个回到平日工作的地方。
        - id: ch01-b219
          speaker: narrator
          text: 两位职位最高的职员亲自送到门外，站在台阶上，一直朝凤凰鞠着躬。罗伯特在那里把金鸟重新扣进诺福克夹克胸前。直到它、罗伯特和另外三个孩子一起汇入街上的人群，再也看不见了，两位先生才终于直起身来。
        - id: ch01-b220
          speaker: narrator
          text: 两位先生一本正经又神情古怪地互相看了一会儿，随后退回神圣的内室，继续为了会社的福祉不停操劳。
        - id: ch01-b221
          speaker: narrator
          text: 经理、秘书、职员和门房刚刚各归其位，忽然全都吃了一惊。每个人都小心地看看四周，生怕有人正在瞧自己。原来，他们全以为自己刚才打了几分钟瞌睡，做了一个关于凤凰和董事会议室的怪梦。
        - id: ch01-b222
          speaker: narrator
          text: 谁也没有对别人提起那个怪梦。每个人都装作什么也没发生，免得旁人问起自己刚才在做什么。毕竟，在办公室里大白天打瞌睡，是万万不该做的事，承认出来就更不应该了。
        - id: ch01-b223
          speaker: narrator
          text: 董事会议室里其实乱得出奇。椅子还排成一列列，家具也没有归位，盘子里更留着焚香烧过的残渣。只要进去看上一眼，大家立刻就会明白，凤凰来访绝不是一场梦，而是真实发生过的光辉盛事。可偏偏那天谁也没再走进董事会议室。
        - id: ch01-b224
          speaker: narrator
          text: 第二天公司开门以前，一位职责里不包括多嘴提问的女士，已经把房间收拾得干干净净，整整齐齐。所有能证明仪式发生过的痕迹，也跟着消失了。所以第二天和第三天，西里尔一张接一张地翻遍报纸，什么消息也没找到。有理智的人不会觉得自己的梦值得登报，更没人肯承认自己在办公时间大白天睡着了。
        - id: ch01-b225
          speaker: narrator
          text: 凤凰对这一天的经历非常满意，从神庙受到的敬奉也很合它的心意。不过，它还是决定亲自给自己写一首颂诗。它觉得神庙里听到的那几首都是临时凑出来的，写得实在太仓促，不能充分赞美它。凤凰自己写下的颂诗这样开头。
        - id: ch01-b226
          speaker: phoenix
          text: 若论美貌与谦逊品性，世间无物能与凤凰比并。
        - id: ch01-b227
          speaker: narrator
          text: 到了那天晚上，孩子们一个个上床睡觉时，凤凰还在认真修改自己的颂诗。它反复琢磨，想把最后一行削短到正合适的长度。可那一行里的每个意思，它都觉得非说不可，一个也舍不得删掉。
        - id: ch01-b228
          speaker: narrator
          text: 既要句子长短合适，又舍不得删掉想说的话。这正是写诗如此困难的缘故。
