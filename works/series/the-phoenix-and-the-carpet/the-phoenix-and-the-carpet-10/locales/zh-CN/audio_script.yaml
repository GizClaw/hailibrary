audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带一点英式童话的机智
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明自信，挖苦人时一本正经
        timbre: 清脆的少年声
        pace: 中等偏快
        pitch: 中高
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴敏锐，急切时仍然清楚
        timbre: 柔和明亮的少女声
        pace: 中等
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 坚持己见，认真里常带几分莽撞
        timbre: 结实清朗的少年声
        pace: 中等
        pitch: 中等
    jane:
      display_name: 简
      tts:
        delivery: 天真直率，话里带着小孩子的认真
        timbre: 稚嫩柔软的女孩声
        pace: 稍慢
        pitch: 偏高
    phoenix:
      display_name: 凤凰
      tts:
        delivery: 文雅自负，庄重中带着敏锐的幽默
        timbre: 华美清润，中性而成熟
        pace: 从容
        pitch: 中高
    uncle_reginald:
      display_name: 雷金纳德舅舅
      tts:
        delivery: 风趣爽朗，忙碌中仍带着亲切
        timbre: 清朗温厚的成年男声
        pace: 中等偏快
        pitch: 中等
    lady:
      display_name: 阁楼里的女士
      tts:
        delivery: 胆小多疑，受惊时声音尖利
        timbre: 饱满的老年女声
        pace: 中等偏快
        pitch: 中高
    selina:
      display_name: 塞莱娜姑妈
      tts:
        delivery: 古板谨慎，慌乱时仍强作镇定
        timbre: 瘦削清厉的老年女声
        pace: 中等
        pitch: 中高
    amelia:
      display_name: 阿米莉亚姑妈
      tts:
        delivery: 武断严厉，认定一件事便不容分辩
        timbre: 干脆有力的老年女声
        pace: 中等
        pitch: 中等
    septimus:
      display_name: 塞普蒂默斯牧师
      tts:
        delivery: 认真善良，困惑时疲惫而迟疑
        timbre: 温和清瘦的年轻男声
        pace: 中等偏慢
        pitch: 中等
  chapters:
    - id: ch01
      title: 给妈妈的礼物
      blocks:
        - id: ch01-b01
          speaker: jane
          text: 好哇，好哇，好哇！妈妈今天要回家，妈妈今天要回家。好哇，好哇，好哇！
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: 早餐一结束，简就唱起这首简单的小歌。凤凰听得十分感动，眼里竟滚下水晶般的泪珠。
        - id: ch01-b03
          speaker: phoenix
          text: 孩子对母亲的孝心，真是美极了！
        - id: ch01-b04
          speaker: robert
          text: 可妈妈要到我们睡觉以后才回来。今天还能再坐地毯出去一次。
        - id: ch01-b05
          speaker: narrator
          text: 罗伯特当然盼着妈妈回家，真的很盼，非常盼。可这份高兴偏偏撞上了另一种强烈的难过。妈妈一回来，他们就不能再整天坐着地毯四处游历了。安西娅也想趁最后一天为妈妈找件好礼物，可礼物的来历又让人发愁。妈妈一定会追问从哪里得来，他们若照实讲，她一定不信。事情只要稍微有趣，大人不知为什么就不肯相信真话。
        - id: ch01-b06
          speaker: robert
          text: 让地毯带我们去捡一只装钱的钱包吧。有了钱，我们就能给妈妈买东西。
        - id: ch01-b07
          speaker: cyril
          text: 要是它带我们去了外国呢？捡到的钱包上满是古怪的东方花纹，还用华丽丝线绣着图案。里面装的东西在那个国家或许是钱，到了伦敦却一枚也花不了，只能当外国古玩。别人肯定还会追问我们从哪里弄来的，到时怎么解释，怎么脱身？
        - id: ch01-b08
          speaker: narrator
          text: 西里尔说着去挪桌子，好给地毯腾出地方。偏偏一条桌腿钩住安西娅补过的地方，随着桌子一动，大半补线都被扯了下来。不但如此，原先那处破损还扩大成一道长长的裂口。罗伯特看着那片狼藉，马上说，这回西里尔可真闯了祸。
        - id: ch01-b09
          speaker: narrator
          text: 安西娅却是个难得的好姐姐。她先找齐杂色绒线、补针、顶针和剪刀，等那股想狠狠发脾气的劲儿过去，才和和气气地开口。
        - id: ch01-b10
          speaker: anthea
          text: 没关系，松鼠。我一会儿就补好。
        - id: ch01-b11
          speaker: narrator
          text: 西里尔明白她刚才忍得多辛苦，也知道姐姐没有故意刁难他，于是感激地重重拍了拍她的背。凤凰用闪亮的爪子挠着那只看不见的耳朵，认真提醒大家，如果真要找钱包，最好把国家、金额和钱币种类都说清。要是费尽力气只找到三枚奥波尔，那一刻未免太叫人心寒。
        - id: ch01-b12
          speaker: robert
          text: 一枚奥波尔有多少钱？
        - id: ch01-b13
          speaker: phoenix
          text: 大约两个半便士。
        - id: ch01-b14
          speaker: jane
          text: 钱包总是别人丢的呀。我们捡到了，应该交给警察。
        - id: ch01-b15
          speaker: phoenix
          text: 看来这件事的确处处为难。
        - id: ch01-b16
          speaker: narrator
          text: 西里尔提议去挖一份主人全都死去的宝藏，可不止一个声音马上指出，妈妈同样不会相信。罗伯特又想叫地毯带他们去捡钱包，再把钱包还给主人，等人家为了答谢而送他们一点东西。安西娅提醒他，孩子们不许收陌生人的钱，鲍勃斯明明知道这条规矩。她说话时还在苏格兰石南花杂色细绒线的末端打了个结。补东西时这样可不对，你们千万别学。
        - id: ch01-b17
          speaker: cyril
          text: 这些主意全不行。干脆算了，我们去北极，或者去个真正有意思的地方。
        - id: ch01-b18
          speakers: [anthea, jane]
          ensemble: duo
          text: 不，一定还有办法。
        - id: ch01-b19
          speaker: anthea
          text: 先别说话，我快想到主意了。对了！让地毯带我们去一个地方，在那里，我们能得到给妈妈买礼物的钱。最要紧的是，钱必须用一种说得清楚的办法得到。等妈妈问起来，我们讲出的来历要让她相信，也不能让她觉得这钱拿得不对。
        - id: ch01-b20
          speaker: cyril
          text: 你现在可真懂得怎么把地毯的本事用足了。
        - id: ch01-b21
          speaker: narrator
          text: 西里尔说得比平常热心，也比平常亲切，因为他记得自己撕破地毯时，安西娅忍住了，没有冲他冷言冷语。凤凰也说她确实学会了怎样许一个周全的愿。不过它又补了一句，要是从一样东西里取走了什么，那东西就不会还留在里面。当时谁也没把这话放在心上，后来却人人都想了起来。
        - id: ch01-b22
          speaker: narrator
          text: 罗伯特叫了一声“黑豹”，催安西娅快些。她这一着急，地毯中央的大补丁就没补紧。线脚松松透透，活像一张渔网，一点也不像织得紧密的布。而一块安分守己的好补丁，本来就该补得像布一样。大家穿好外衣，凤凰飞上壁炉台，对着镜子细细理顺金羽毛。等它打扮满意，所有人才一同踏上地毯。
        - id: ch01-b23
          speaker: anthea
          text: 亲爱的地毯，请慢一点。我们想看看沿途的景色。现在，请带我们去一个能照刚才说的办法得到礼物钱的地方。
        - id: ch01-b24
          speaker: narrator
          text: 安西娅把那个难说清楚的愿望完整讲完，地毯立刻变得又硬又平，像只木筏似的驶过肯蒂什镇的屋顶。它飞得实在太低，边缘竟擦过一只烟囱帽。安西娅脱口说出“我希望”，又赶紧声明自己不是在许愿，把后半句改成飞得不够高实在可惜。坐在这种地毯上，一个词说错了都可能出大事。
        - id: ch01-b25
          speaker: phoenix
          text: 小心，说得很好。坐在许愿地毯上，一出口说希望怎样，愿望就会成真，再也收不回来。
        - id: ch01-b26
          speaker: narrator
          text: 大家暂时不敢再说话。地毯平静而庄严地飞过圣潘克拉斯车站、国王十字车站和克勒肯维尔拥挤的街道，又越过一道水流粗粝、浪花翻滚的泰晤士河。西里尔看出这是去格林尼治的方向，还想顺路看看宫殿。地毯继续向前疾驰，却始终挨着烟囱帽飞，近得谁都不觉得舒服。到了新十字区上空，可怕的事终于发生了。
    - id: ch02
      title: 地毯破了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 简和罗伯特坐在地毯正中央。他们身上一部分落在真正的地毯上，另一部分，也就是最沉的那一部分，恰好压着那块松散的大补丁。简先觉得四周雾蒙蒙的，看起来一半像在屋外，一半又像家里的育儿室。她说自己仿佛快出麻疹了，因为上回生麻疹时，看见的每一样东西也都古怪得要命。罗伯特说，他的感觉和她一模一样。
        - id: ch02-b02
          speaker: phoenix
          text: 那是破洞造成的。不管麻疹是什么，反正不是麻疹。
        - id: ch02-b03
          speaker: narrator
          text: 两个孩子一听，忽然同时朝结实的地方跳。补丁顿时裂开，他们的靴子向上一翘，沉重的脑袋和身体却穿过破洞掉了下去。两人最后落成一种说坐不算坐、说四脚朝天也不完全算的姿势。脚下是新十字区阿默舍姆路七百零五号的平坦铅皮屋顶。那栋房子又高又灰，阴沉沉的，却处处显得十分体面。
        - id: ch02-b04
          speaker: narrator
          text: 一卸下他们两人的重量，地毯仿佛突然醒来，重新有了精神，立刻直往高处升。其余的人全趴下身子，从不断上升的地毯边缘向下看。西里尔放开嗓子，问他们有没有受伤。罗伯特在屋顶大声回答没有。可下一刻，地毯已经飞远，一排冒着煤烟的烟囱横在中间，把两个孩子彻底挡住了。
        - id: ch02-b05
          speaker: anthea
          text: 太可怕了！
          emotion: fearful
        - id: ch02-b06
          speaker: phoenix
          text: 还可能更糟。要是在过河时裂开，留下来的人心里会是什么滋味？
        - id: ch02-b07
          speaker: cyril
          text: 说得也是。他们不会有事。他们会一直喊，等人救他们下去，也可以把瓦片扔进前院，引起路人的注意。鲍勃斯还有我那一先令五便士。幸好黑豹忘了补我口袋的洞，不然钱也不会掉到他那里。他们有车钱，能坐电车回家。
        - id: ch02-b08
          speaker: anthea
          text: 都怪我。我明明知道补丁应该怎么补，却没认真做。我们回家吧，用你的伊顿制服打一块结实补丁，再让地毯接他们。
          emotion: sad
        - id: ch02-b09
          speaker: cyril
          text: 好吧，不过你的星期日外套更结实。妈妈的礼物只好不买了。我希望——
        - id: ch02-b10
          speaker: phoenix
          text: 别说！地毯正在下降。
        - id: ch02-b11
          speaker: narrator
          text: 地毯飞快而平稳地落到德特福德路的人行道上。它稍稍一斜，西里尔和安西娅便走了下来。地毯立刻卷好，藏进门柱后面，快得没有一个路人发现。凤凰刚钻进西里尔衣襟，他们就听见一个熟悉的声音。
        - id: ch02-b12
          speaker: uncle_reginald
          text: 哎呀，真想不到！你们两个来这里做什么？
          emotion: surprised
        - id: ch02-b13
          speaker: narrator
          text: 来人正是孩子们最喜欢的舅舅，雷金纳德舅舅。西里尔不敢把地毯和屋顶的事全说出来，只挑出舅舅能够相信的那部分实话。他说，他们原本想到格林尼治宫走走，顺便谈谈纳尔逊。舅舅随即问起另外两个孩子。至于简和罗伯特究竟在哪里，西里尔这回完全不用编故事，只能老老实实承认自己不知道。
        - id: ch02-b14
          speaker: uncle_reginald
          text: 我得赶紧去郡法院办案。做律师最讨厌的就是，好不容易有点生活的乐趣，却没空享受。真想陪你们去看彩绘大厅，再到“船”餐馆请你们吃午饭。可惜不行。
        - id: ch02-b15
          speaker: narrator
          text: 舅舅伸手摸了摸口袋。他说，自己不能去快活，可没有理由让孩子们也跟着扫兴。于是，他交给他们一枚金镑，叫他们把它除以四，算出的结果应该能换来一点各自想要的东西。他叮嘱孩子照顾好自己，说了声再会，便挥动那把齐整的雨伞，快活地走远。西里尔和安西娅望着他留下的闪亮金币，彼此交换了一个不用说话也能明白的眼神，又和凤凰一道连说了三声“哎呀”。
        - id: ch02-b16
          speaker: cyril
          text: 好地毯！它真的把钱送来了。
          emotion: happy
        - id: ch02-b17
          speaker: phoenix
          text: 它办得很聪明。完全合乎要求，又简单得出奇。
        - id: ch02-b18
          speaker: anthea
          text: 快回家补地毯吧。我真坏，刚才竟把他们忘了一会儿。
        - id: ch02-b19
          speaker: narrator
          text: 他们避开路人的眼睛，迅速而悄悄地铺开地毯。双脚一站上去，安西娅便许愿回家，他们立刻回到了育儿室。舅舅给的钱让他们不必剪坏西里尔的伊顿制服，也不必牺牲安西娅的星期日外套。她马上把裂开的补丁两边拢好，西里尔则匆匆出去，买来一大块大理石花纹的美国油布。精打细算的主妇常拿这种东西铺碗柜和厨房桌，而这是他能想到最结实的材料。
        - id: ch02-b20
          speaker: narrator
          text: 两人开始给整张地毯衬上油布。少了简和罗伯特，育儿室显得又空又怪。西里尔也不再像刚才那样确信他们能坐电车回来，于是拿起针线试着帮安西娅。一个哥哥肯这样做，心意实在很好，可惜对安西娅并没有多少实际用处。凤凰起先站在一旁看，后来越来越不安。它蓬起华丽的羽毛，一会儿用这只金光闪闪的爪子站立，一会儿又换另一只。
        - id: ch02-b21
          speaker: phoenix
          text: 我再也受不了这种悬念。我的罗伯特，是他让我的蛋孵化。我又有多少次舒舒服服地偎在他的诺福克上衣里！如果你们不反对，我想——
        - id: ch02-b22
          speaker: anthea
          text: 快去吧！真该早点想到请你去找他们。
        - id: ch02-b23
          speaker: narrator
          text: 西里尔打开窗。凤凰拍动阳光般明亮的翅膀，转眼就不见了。西里尔总算放心，重新拿起针，却立刻在手上另一个地方又扎了一下。
    - id: ch03
      title: 阿默舍姆路七百零五号
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我知道，你们真正着急想听的，是简和罗伯特掉到阿默舍姆路七百零五号以后怎样了。不过故事不能同时讲两处发生的事，我只好先把西里尔那一边讲完。这正是故事最气人的地方之一。
        - id: ch03-b02
          speaker: narrator
          text: 罗伯特坐在又湿、又冷、满是煤烟的铅皮屋顶上，第一句话是“这下可妙了”。简做的第一件事却是哭。
        - id: ch03-b03
          speaker: robert
          text: 别哭了，小猫咪，别犯傻。我们不会有事的。
        - id: ch03-b04
          speaker: narrator
          text: 他像西里尔料到的那样，四下寻找可以扔到街上的东西，好叫远在下面的行人注意。可屋顶上连一块石头也没有，更别提松动的瓦片了。屋面铺着石板，每一片都很清楚自己的位置，牢牢守在那里。不过，事情常常如此，一个人寻找某样东西时，偏会发现另一样。罗伯特找到了一扇通往屋内的活板门。更幸运的是，门没有上闩。
        - id: ch03-b05
          speaker: robert
          text: 简，别抽搭了，快来帮我抬门。只要进了屋，运气好就能避开所有人，偷偷溜下楼。
        - id: ch03-b06
          speaker: narrator
          text: 两人把门抬到直立，正探头看下面，门板忽然朝后倒下，在屋顶砸出一声空洞的巨响。下面同时传来一声毛骨悚然的尖叫。
        - id: ch03-b07
          speaker: robert
          text: 被发现了！哎呀，我那些活猫啊！
          emotion: fearful
        - id: ch03-b08
          speaker: narrator
          text: 他们的确被发现了。活板门下面是一间阁楼，也是一间杂物室，塞着箱子、破椅子、旧壁炉挡板和画框，钉子上还挂着一袋袋破布。地板中央有个敞开的箱子，半箱衣服装在里面，其余衣服整整齐齐堆在四周。那些衣服正中坐着一位胖得不得了的女士，两条腿笔直伸在前面。刚才那声尖叫是她发出的，而事实上，她这会儿还没有停。
        - id: ch03-b09
          speaker: jane
          text: 求求你别叫！我们不会伤害你。
        - id: ch03-b10
          speaker: lady
          text: 你们那伙人的其他成员在哪里？
        - id: ch03-b11
          speaker: jane
          text: 他们坐着许愿地毯继续飞了，凤凰也和他们在一起。你一定在书里读到过许愿地毯吧？
        - id: ch03-b12
          speaker: narrator
          text: 简老老实实地说完这些，罗伯特还来不及叫她住口，那位女士已经站起来，小心绕过一堆堆衣服，走出阁楼，又把房门关在身后。孩子们听见她用一个又响亮又害怕的声音，不停呼唤塞普蒂默斯。罗伯特知道没有时间可浪费，马上决定自己先跳进阁楼。他用双手吊住门边，松手落到地上，再让简照着做。
        - id: ch03-b13
          speaker: robert
          text: 用双手吊住，我在下面接你。没时间多说了，快跳！
        - id: ch03-b14
          speaker: narrator
          text: 简跳了。罗伯特所谓的接住，最后却变成两个人在衣服堆里滚成一团，喘得说不出话。还没滚完，他就想好了办法。
        - id: ch03-b15
          speaker: robert
          text: 躲到壁炉挡板和那些破东西后面。他们会以为我们沿着屋顶跑了。等没人了，我们再溜下楼，见机行事。
        - id: ch03-b16
          speaker: narrator
          text: 两人匆忙藏好。一截铁床架正好硌进罗伯特的肋下，简甚至只剩下容一只脚站立的位置，他们也咬牙忍着。胖女士回来时，带来的不是塞普蒂默斯，而是另一位女士。两个孩子屏住呼吸，心跳又重又快，一点声音也不敢弄出来。
        - id: ch03-b17
          speaker: lady
          text: 不见了！可怜的小东西，他们全疯了，还在外面乱跑。我们得锁上阁楼，再去叫警察。
        - id: ch03-b18
          speaker: selina
          text: 让我看看屋顶。
        - id: ch03-b19
          speaker: narrator
          text: 要是这还有可能，后来的女士比前一位更老、更瘦，也更古板。她们把一只箱子拖到活板门下，又在上面叠上一只，两个人极其小心地爬高，把两个齐整端庄的脑袋伸到屋顶外面，四处寻找所谓的疯孩子。趁她们只顾盯着空荡荡的铅皮屋顶，罗伯特从肋下推开那截铁床腿。他和简从藏身处爬出来，悄悄穿过房门。等姑妈们看够了，他们早已不在阁楼。
        - id: ch03-b20
          speaker: narrator
          text: 他们踮脚下了一层，又下一层，从栏杆边探头一看，顿时吓坏了。正有个仆人提着满满的煤斗往上走。两个孩子不约而同，飞快钻进第一扇开着的门。那是间安静体面的书房，四周排着书，有一张写字台，壁炉挡板里还有一双绣花拖鞋在暖脚。两人躲进窗帘后面。经过桌边时，他们看见一只传教捐款箱，箱底的封条撕掉了，盒盖敞着，里面空空如也。
        - id: ch03-b21
          speaker: jane
          text: 太可怕了，我们绝不可能活着逃出去。
          emotion: fearful
        - id: ch03-b22
          speaker: narrator
          text: 罗伯特刚叫她安静，楼梯就响起脚步声。两位女士走进书房，没有发现孩子，却一眼看见了空捐款箱。
        - id: ch03-b23
          speaker: amelia
          text: 塞莱娜，我早就知道他们是一伙贼，从一开始就看出来了。那两个孩子根本没疯，是有人故意派来的。他们先在阁楼里弄出动静，把我们的注意都引到屋顶上，好让那些同伙趁机进屋，把值钱的东西偷走。
        - id: ch03-b24
          speaker: selina
          text: 恐怕你猜对了。可他们现在在哪里？
        - id: ch03-b25
          speaker: amelia
          text: 他们准在楼下，正在搜罗家里的银器。银牛奶壶、银糖缸，还有乔舅舅留下的潘趣酒勺，这会儿说不定已经进了他们的口袋。杰鲁莎姑妈的茶匙也保不住。我现在就下楼抓他们。
        - id: ch03-b26
          speaker: selina
          text: 别这么鲁莽逞强。阿米莉亚，我们从窗口叫警察。先把门锁住。我来——
        - id: ch03-b27
          speaker: narrator
          text: 塞莱娜扑向窗口，却和帘后的孩子撞个正着，后半句话顿时成了尖叫。
        - id: ch03-b28
          speaker: jane
          text: 你们怎么能这么不讲理？我们不是窃贼，也没有什么团伙，更没有打开你们的传教捐款箱。我们从前倒是打开过自己的捐款箱，可后来根本不需要用那笔钱，于是良心告诉我们不该拿。我们把钱全放回去了。求求你别抓我，也别再喊了！
        - id: ch03-b29
          speaker: narrator
          text: 塞莱娜一把抓住简，阿米莉亚也擒住罗伯特。两双瘦而有力的手紧紧扣住他们，手腕处泛着粉红，捏紧的指节却白得没有血色。阿米莉亚说，无论如何，总算抓住了这两个。塞莱娜手里的俘虏比罗伯特小，比较容易看住，所以应该由她马上打开窗户，用最大的声音喊“杀人啦”。
        - id: ch03-b30
          speaker: narrator
          text: 塞莱娜照着吩咐打开窗，却没有喊杀人。就在那一刻，她恰好看见侄子从大门进来，于是改为大声喊塞普蒂默斯。不到一分钟，他已用随身钥匙开门进屋，快步跑上楼来。他刚踏进书房，两个孩子便认出了他，同时发出一声又响又突然的欢喜尖叫。两位女士吓得跳了起来，手上差点一松，让俘虏逃掉。
    - id: ch04
      title: 牧师的难题
      blocks:
        - id: ch04-b01
          speaker: jane
          text: 是我们自己的牧师！
          emotion: happy
        - id: ch04-b02
          speaker: robert
          text: 你不记得我们了吗？你去过那个岛，还替我们的窃贼和厨娘主持了婚礼！
        - id: ch04-b03
          speaker: amelia
          text: 我就知道是团伙。塞普蒂默斯，这两个没人管教的坏孩子，是一伙穷凶极恶的窃贼中的成员。他们正在洗劫这栋房子，已经强行撬开传教捐款箱，把里面的东西全偷走了。
        - id: ch04-b04
          speaker: narrator
          text: 塞普蒂默斯牧师疲惫地抹过额头，说自己跑上楼以后有些发晕。罗伯特马上声明，他们根本没碰那个讨厌的盒子，塞莱娜却认定一定是同伙干的。
        - id: ch04-b05
          speaker: septimus
          text: 不，不，是我亲手打开的。今早我没有足够的零钱，付母亲独立互助会的麻疹和哮吼保险费，只好从里面拿。请告诉我，这不是梦吧？
        - id: ch04-b06
          speaker: amelia
          text: 当然不是梦。你去搜遍整栋房子，我坚持要搜。
        - id: ch04-b07
          speaker: narrator
          text: 副牧师脸色苍白，浑身发抖，还是把整栋房子搜了一遍。屋里当然清清白白，连半个窃贼也没有。他回来后疲惫地陷进椅子里。罗伯特却仍被人牢牢抓着，已经气得血都快沸腾了。一个男孩落到力气很大的女人手里，无法挣脱时，最容易同时感到愤怒和绝望。
        - id: ch04-b08
          speaker: robert
          text: 还不放开我们？我们什么也没做，是地毯把我们从破洞里掉到屋顶上的。你知道它能飞。它还带你去过岛上，让你给窃贼和厨娘主持婚礼。
          emotion: angry
        - id: ch04-b09
          speaker: septimus
          text: 哦，我的头！
        - id: ch04-b10
          speaker: robert
          text: 先别管头疼。你得诚实正直，在上天安排给你的身份中尽好责任！
          emotion: angry
        - id: ch04-b11
          speaker: septimus
          text: 这大概是我做过什么事以后遭的惩罚，可我现在实在想不起来。
        - id: ch04-b12
          speaker: selina
          text: 叫警察。
        - id: ch04-b13
          speaker: septimus
          text: 叫医生。
        - id: ch04-b14
          speaker: amelia
          text: 你认为这两个孩子真的疯了吗？
        - id: ch04-b15
          speaker: septimus
          text: 我觉得疯的是我。
        - id: ch04-b16
          speaker: narrator
          text: 简从被抓住起一直在哭。这时她告诉牧师，他现在还没疯，可再这样下去也许会疯，而且真疯了也是活该。
        - id: ch04-b17
          speaker: septimus
          text: 塞莱娜姑妈，阿米莉亚姑妈，请相信我，这只是一场发疯似的梦。你们很快就会明白，因为我以前也遇见过这种事。可即使身在梦里，我们也不能做不公正的事，不能冤枉别人。孩子们没有伤害任何人，那个捐款箱也确实是我亲手打开的。请你们放开他们吧。
        - id: ch04-b18
          speaker: narrator
          text: 两位姑妈那双瘦骨嶙峋而又有力的手，这才不情不愿地松开。罗伯特用力抖了抖身子，满脸怨气地站到一边，仿佛还在为刚才受制于人而生气。简的反应却完全不同。她突然跑到副牧师面前，一把抱住了他，动作快得让他连挡一下的时间都没有。
        - id: ch04-b19
          speaker: jane
          text: 你真好。刚开始是很像做梦，不过慢慢就习惯了。请放我们走吧，你是个善良、好心又正直的牧师。
        - id: ch04-b20
          speaker: septimus
          text: 这实在很难判断，因为这个梦太不同寻常了。也许它是一种别的生活，真实得足够叫人发疯。要是你们疯了，梦里也许也有疯人院。那里的人会好好照顾你们，慢慢让你们恢复理智，最后痊愈，回到悲痛的亲人身边。即使在平常生活中，一个人也很难清楚看见自己的责任。如今梦里的情形又这么复杂，我更不知道该怎么做。
        - id: ch04-b21
          speaker: robert
          text: 既然这是梦，你马上就会醒来。要是现在把我们送进梦里的疯人院，等你醒了，一定会后悔。因为你可能永远也进不了同一个梦，没法找到那家疯人院，更没法放我们出来。我们就会永远关在那里。到那时候，那些根本不在梦里的悲痛亲人又该怎么办？
        - id: ch04-b22
          speaker: septimus
          text: 哦，我的头！
        - id: ch04-b23
          speaker: narrator
          text: 简和罗伯特什么也做不了，心里又无助又绝望，难受得几乎生病。一个真正认真讲良心的副牧师，实在是世上最难对付的东西之一。就在无助和绝望快要超过他们所能忍受的限度时，两人忽然觉得身体奇异地收缩起来。他们很熟悉这种感觉。每次快要消失，身上都会这样。下一刻，两个孩子果然无影无踪，只留下塞普蒂默斯牧师和他的两位姑妈。
        - id: ch04-b24
          speaker: septimus
          text: 我就知道是梦！以前也有过差不多的事。塞莱娜姑妈，阿米莉亚姑妈，你们也梦见了吗？我刚才梦见你们也做了同一个梦。
        - id: ch04-b25
          speaker: narrator
          text: 塞莱娜先盯着侄子看了一会儿，又转头看看阿米莉亚。她看得出来，可怜的年轻人再也受不住更多古怪的真相，于是大胆地否认她们做过任何梦。她一本正经地说，两位姑妈什么也没有看见，他一定只是坐在椅子上打了个盹。听说怪事只发生在自己的梦里，副牧师顿时松了一大口气。
        - id: ch04-b26
          speaker: septimus
          text: 只要只有我一个人做梦就好。要是我们三个人梦见同一件事，我永远也没法相信！
        - id: ch04-b27
          speaker: narrator
          text: 事后，塞莱娜对另一位姑妈承认，那是一句假话，她也知道自己迟早会为此受罚。可她亲眼看着可怜的侄子就要失去理智，他绝承受不了三个人同时做同一个梦的压力。说来也怪，她们三人竟真的在同一时刻梦见同一件事。她们约好永远瞒着亲爱的塞比，塞莱娜却要把经过寄给心灵研究学会，姓名当然全用星号代替。她真的这样做了。你们还能在学会一本厚厚的蓝皮书里读到全部经过。
    - id: ch05
      title: 妈妈回家
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 你们当然已经猜到真相。聪明的凤凰离开窗户以后，没有去阿默舍姆路的屋顶，也没有闯进那栋房子。它径直飞去找赛米德，请它许愿让简和罗伯特回家。愿望一说出口，两个孩子当然立刻离开那间叫人绝望的书房，回到了育儿室。而这时候，西里尔和安西娅连地毯的一半都还没有补完。
        - id: ch05-b02
          speaker: narrator
          text: 重逢的喜悦平静下来以后，孩子们拿着舅舅那枚金镑剩下的钱，一同出门给妈妈选礼物。他们买了粉红丝绸手帕、一对蓝白花瓶、一瓶香水、一包圣诞蜡烛，还有两块古怪的香皂。一块做成番茄的形状，连颜色也像番茄。另一块像极了橙子，几乎任何收到它的人都会伸手剥皮，当然啦，前提是那个人喜欢橙子。他们还买了一只裹着糖霜的蛋糕。最后剩下的钱全换成鲜花，正好插进那对新花瓶。
        - id: ch05-b03
          speaker: narrator
          text: 大家把所有礼物精心摆在一张桌上，又把圣诞蜡烛一支支插在盘子里。蜡烛暂时不点，只等听见妈妈的马车驶到门外，便立刻把它们全点亮。等布置得再也挑不出毛病，孩子们又把自己从头到脚彻底洗干净，各自换上一身比较整齐、比较适合迎接妈妈的衣服。
        - id: ch05-b04
          speaker: robert
          text: 赛米德真是我们的好朋友。这一次多亏了它！
        - id: ch05-b05
          speaker: narrator
          text: 其他孩子也跟着称赞赛米德。可罗伯特想了想，觉得凤凰同样功不可没。要不是它想到去许那个愿，谁也不知道事情会怎样。
        - id: ch05-b06
          speaker: phoenix
          text: 你们不妨想一想，我是一只如此能干而且遇事有办法的鸟，这对你们也许实在是一件幸事。
        - id: ch05-b07
          speaker: anthea
          text: 妈妈的马车来了！
          emotion: happy
        - id: ch05-b08
          speaker: narrator
          text: 凤凰赶快藏好，孩子们点亮盘子里的蜡烛。下一刻，妈妈真的回到了家。她很喜欢所有礼物，手帕、花瓶、香水、蜡烛、香皂、蛋糕和鲜花，没有一样不叫她高兴。孩子们说钱是雷金纳德舅舅给的，这个故事既平常又真实，她轻轻松松就相信了，听着甚至十分开心。
        - id: ch05-b09
          speaker: narrator
          text: 那天晚上，西里尔睡意朦胧时说的最后一句话，是“好地毯”。
        - id: ch05-b10
          speaker: phoenix
          text: 地毯如今虽然只剩下那么一点点，那一点倒确实很好，很不错。
