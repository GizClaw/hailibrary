  chapters:
    - id: ch01
      title: THE HOLE IN THE CARPET
      blocks:
        - id: ch01-b01
          speaker: jane
          text: >-
            Hooray, hooray, hooray! Mother comes home today! Mother comes home today! Hooray, hooray, hooray!
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: >-
            Jane sang her little song just after breakfast. The Phoenix was so touched that crystal tears ran from its eyes.
        - id: ch01-b03
          speaker: phoenix
          text: >-
            How beautiful it is to see children devoted to their mother!
        - id: ch01-b04
          speaker: robert
          text: >-
            She won't arrive until after bedtime, though. We could still have one more day on the carpet.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Robert truly was glad that Mother was coming home. He was very glad. Even so, he felt sorry that their all-day journeys on the carpet were about to end.
        - id: ch01-b06
          speaker: anthea
          text: >-
            I wish we could find something lovely for Mother. But she'd ask where it came from, and she'd never believe the truth. People never believe anything interesting.
        - id: ch01-b07
          speaker: robert
          text: >-
            What if we asked the carpet to take us somewhere we could find a purse full of money? Then we could buy her a present.
        - id: ch01-b08
          speaker: cyril
          text: >-
            And what if it carried us abroad? We might find a silk purse covered in strange Eastern patterns, full of coins nobody here could spend. Everyone would ask where we got it, and we'd never explain our way out of the mess.
        - id: ch01-b09
          speaker: narrator
          text: >-
            As Cyril spoke, he pushed the table off the carpet. One leg caught in a place Anthea had darned. It tore most of the mending loose and ripped a long slit in the carpet too.
        - id: ch01-b10
          speaker: robert
          text: >-
            Well, you've done it now.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Anthea was an excellent sister. She said nothing while she fetched heather-colored wool, a darning needle, a thimble, and scissors. By then she had mastered her strong wish to be thoroughly unpleasant.
        - id: ch01-b12
          speaker: anthea
          text: >-
            Never mind, Squirrel. I'll mend it in no time.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Cyril thumped her on the back. He knew exactly how she had felt, and he was grateful.
        - id: ch01-b14
          speaker: phoenix
          text: >-
            About this purse of coins, you should name the exact sum, the country where it must be found, and the sort of coins you require. Imagine the chilly disappointment of finding a purse that held only three obols.
        - id: ch01-b15
          speaker: jane
          text: >-
            How much is an obol?
        - id: ch01-b16
          speaker: phoenix
          text: >-
            About twopence halfpenny.
        - id: ch01-b17
          speaker: jane
          text: >-
            If we find a purse, somebody must have lost it. We'd have to give it to a policeman.
        - id: ch01-b18
          speaker: phoenix
          text: >-
            The problem is certainly covered in difficulties.
        - id: ch01-b19
          speaker: cyril
          text: >-
            What about buried treasure that belonged to people who are all dead?
        - id: ch01-b20
          speakers: [robert, anthea, jane]
          ensemble: chorus
          text: >-
            Mother would never believe that!
        - id: ch01-b21
          speaker: robert
          text: >-
            Then suppose the carpet took us to a purse, we returned it to its owner, and the owner gave us a reward.
        - id: ch01-b22
          speaker: anthea
          text: >-
            We aren't allowed to accept money from strangers, Bobs. You know that.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Anthea knotted the end of her new length of wool, though making a knot is a very wrong way to begin darning.
        - id: ch01-b24
          speaker: cyril
          text: >-
            That plan is no good either. Let's forget the whole thing and go to the North Pole, or somewhere else worth seeing.
        - id: ch01-b25
          speakers: [anthea, jane]
          ensemble: duo
          text: >-
            No. There must be some way.
        - id: ch01-b26
          speaker: anthea
          text: >-
            Wait. I can feel an idea coming. Nobody talk.
        - id: ch01-b27
          speaker: narrator
          text: >-
            She held the darning needle in the air while everyone waited. Then the idea arrived.
        - id: ch01-b28
          speaker: anthea
          text: >-
            I know! We'll ask the carpet to take us somewhere we can get money for Mother's present, but we must get it in a way she'll believe and won't think is wrong.
        - id: ch01-b29
          speaker: cyril
          text: >-
            You're getting very good at making the carpet give you exactly what you want.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Cyril sounded warmer than usual. He had not forgotten that Anthea had spared him a scolding when he tore the carpet.
        - id: ch01-b31
          speaker: phoenix
          text: >-
            You certainly are improving. But remember, when you take a thing out, it does not stay in.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Nobody noticed that warning then. Later, every one of them remembered it.
        - id: ch01-b33
          speaker: robert
          text: >-
            Hurry up, Panther.
        - id: ch01-b34
          speaker: narrator
          text: >-
            So Anthea hurried, just because Robert told her to. That was why the great darn in the carpet's center came out loose and open, like a fishing net, instead of tight and close like proper woven cloth. A well-behaved darn should never have looked like that.

            Everyone put on outdoor clothes. The Phoenix perched on the mantelpiece and arranged its golden feathers in the mirror. Then they all climbed onto the carpet.
        - id: ch01-b35
          speaker: anthea
          text: >-
            Please travel slowly, dear carpet. We like seeing where we're going.
        - id: ch01-b36
          speaker: narrator
          text: >-
            She added the careful wish they had agreed upon. A moment later, the carpet was stiff as a raft and sailing over the roofs of Kentish Town.
        - id: ch01-b37
          speaker: anthea
          text: >-
            I wish—no, I don't mean that! I only mean it's a pity we aren't flying higher.
        - id: ch01-b38
          speaker: narrator
          text: >-
            The carpet's edge brushed a chimney pot.
        - id: ch01-b39
          speaker: phoenix
          text: >-
            Yes, be careful. If you say a wish while riding a wishing carpet, the wish comes true. That is all there is to it.
        - id: ch01-b40
          speaker: narrator
          text: >-
            For a while nobody dared speak. The carpet sailed grandly over St Pancras and King's Cross stations, then above the crowded streets of Clerkenwell.
        - id: ch01-b41
          speaker: cyril
          text: >-
            We're heading toward Greenwich. Perhaps we could visit the Palace.
        - id: ch01-b42
          speaker: narrator
          text: >-
            They crossed the Thames, a rough strip of tumbling water below them. Still the carpet swept on, much closer to the chimney pots than the children liked. Then, over New Cross, something terrible happened.

            Jane and Robert were sitting in the middle. Part of each child rested on the carpet, but their heaviest parts rested on the wide central darn.
        - id: ch01-b43
          speaker: jane
          text: >-
            Everything looks misty. I can see outdoors and our nursery at the same time. It feels like when I had measles and everything looked so strange. Do you remember?
        - id: ch01-b44
          speaker: robert
          text: >-
            I feel exactly like that too.
        - id: ch01-b45
          speaker: phoenix
          text: >-
            That is the hole, not measles, whatever measles may be.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Jane and Robert both sprang toward the sound part of the carpet at exactly the same moment. The weak darn gave way beneath them. Their boots flew up, while their heavier heads and bodies went down through the opening. They landed in a position somewhere between sitting and sprawling on a flat lead roof. It belonged to a tall, gray, gloomy, respectable house at 705 Amersham Road, New Cross.

            Freed from their weight, the carpet seemed to wake with fresh energy and shot upward. The others lay flat and peered over its edge.
        - id: ch01-b47
          speaker: cyril
          text: >-
            Are you hurt?
        - id: ch01-b48
          speaker: robert
          text: >-
            No!
        - id: ch01-b49
          speaker: narrator
          text: >-
            The carpet raced away. A bank of smoky chimneys hid Robert and Jane from sight.
        - id: ch01-b50
          speaker: anthea
          text: >-
            Oh, this is awful!
          emotion: fearful
        - id: ch01-b51
          speaker: phoenix
          text: >-
            It could have been worse. How would the survivors have felt if the darn had broken while we were crossing the river?
        - id: ch01-b52
          speaker: cyril
          text: >-
            That's true. They'll manage. They'll shout until someone gets them down, or throw roof tiles into the front garden so people notice. Bobs has my one shilling and fivepence. Good thing you forgot the hole in my pocket, Panther, or he wouldn't have it. They can take the tram home.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Anthea could not be comforted.
        - id: ch01-b54
          speaker: anthea
          text: >-
            It's all my fault. I knew how to darn it properly, and I didn't. We must go home, patch the carpet with your Eton suit—something really strong—and send it back for them.
          emotion: sad
        - id: ch01-b55
          speaker: cyril
          text: >-
            All right, though your Sunday jacket is stronger than my Etons. We'll have to give up Mother's present.
        - id: ch01-b56
          speaker: phoenix
          text: >-
            Stop! The carpet is going down.
          emotion: surprised
        - id: ch01-b57
          speaker: narrator
          text: >-
            Cyril had just begun to say the dangerous words "I wish" when the Phoenix stopped him. The carpet was indeed descending. It sank quickly but steadily and landed on the pavement in Deptford Road. It tipped just enough for Cyril and Anthea to walk off naturally. Then it rolled itself up and slipped behind a gatepost. It moved so quickly that not one person in the busy road noticed. The Phoenix rustled into the breast of Cyril's coat. At almost the same moment, a familiar voice spoke.
        - id: ch01-b58
          speaker: uncle_reginald
          text: >-
            Well, I never! What in the world are you doing here?
          emotion: surprised
        - id: ch01-b59
          speaker: narrator
          text: >-
            They were standing face to face with their favorite uncle, Uncle Reginald.
        - id: ch01-b60
          speaker: cyril
          text: >-
            We thought we might visit Greenwich Palace and talk about Nelson.
        - id: ch01-b61
          speaker: narrator
          text: >-
            That was as much truth as Cyril thought his uncle would believe.
        - id: ch01-b62
          speaker: uncle_reginald
          text: >-
            Where are the other children?
        - id: ch01-b63
          speaker: cyril
          text: >-
            I don't quite know.
        - id: ch01-b64
          speaker: narrator
          text: >-
            This answer was completely true.
        - id: ch01-b65
          speaker: uncle_reginald
          text: >-
            Well, I must rush. I have a case in the County Court. That's the trouble with being a beastly solicitor. When life offers you some fun, you can't take it. I wish I could visit the Painted Hall with you and buy you lunch at the Ship afterward. Sadly, it cannot be.
        - id: ch01-b66
          speaker: narrator
          text: >-
            Uncle Reginald reached into his pocket.
        - id: ch01-b67
          speaker: uncle_reginald
          text: >-
            I may not enjoy myself, but you still can. Divide this into four, and the answer should buy you something you want. Take care of yourselves. Farewell!
        - id: ch01-b68
          speaker: narrator
          text: >-
            He waved his neat umbrella and cheerfully went on his way. Cyril and Anthea stared at each other over the bright gold sovereign in Cyril's hand.
        - id: ch01-b69
          speaker: anthea
          text: >-
            Well!
          emotion: surprised
        - id: ch01-b70
          speaker: cyril
          text: >-
            Well!
          emotion: surprised
        - id: ch01-b71
          speaker: phoenix
          text: >-
            Well!
          emotion: surprised
        - id: ch01-b72
          speaker: cyril
          text: >-
            Good old carpet!
          emotion: happy
        - id: ch01-b73
          speaker: phoenix
          text: >-
            It was remarkably clever. The answer was so simple and yet exactly right.
        - id: ch01-b74
          speaker: anthea
          text: >-
            Let's hurry home and mend the carpet. I'm horrible. For one whole minute I forgot about the others.
          emotion: sad
        - id: ch01-b75
          speaker: narrator
          text: >-
            They unrolled the carpet quickly and secretly, to avoid drawing attention. As soon as their feet touched it, Anthea wished them home. They arrived at once.

            Their kind uncle's sovereign meant they no longer needed to cut up Cyril's Etons or Anthea's Sunday jacket. Anthea immediately began drawing the torn edges together. Cyril ran out and bought a large piece of marble-patterned American oilcloth, the sort careful housekeepers put on dressers and kitchen tables. It was the strongest material he could think of.

            They spread the oilcloth beneath the carpet and began lining the whole thing. It was careful, awkward work. The nursery felt strange and empty without Robert and Jane. As the minutes passed, Cyril became much less certain that they could simply take the tram home. He stayed close and tried to help Anthea with the sewing. It was kind of him to try, even though his help was not much use to her.
        - id: ch01-b76
          speaker: narrator
          text: >-
            The Phoenix watched for a while, growing more restless every minute. It puffed out its magnificent feathers and shifted from one golden claw to the other. At last it could stand the waiting no longer.
        - id: ch01-b77
          speaker: phoenix
          text: >-
            I can bear this suspense no longer! My Robert set my egg to hatch. I have rested so often and so pleasantly inside his Norfolk jacket. If you will excuse me, I think I must go after him.
        - id: ch01-b78
          speaker: anthea
          text: >-
            Yes, please go! I wish we'd thought of asking you sooner.
        - id: ch01-b79
          speaker: narrator
          text: >-
            Cyril opened the window. The Phoenix spread its sun-bright wings and vanished.
        - id: ch01-b80
          speaker: cyril
          text: >-
            That's all right, then.
        - id: ch01-b81
          speaker: narrator
          text: >-
            Cyril picked up his needle and at once pricked his hand in a new place.
        - id: ch01-b82
          speaker: narrator
          text: >-
            Of course, what you really wanted to know all this time was not what Anthea and Cyril were doing. You wanted to hear what happened to Jane and Robert after they fell through the carpet onto the roof of number 705, Amersham Road. But the other part had to be told first. That is one of the most irritating things about stories. Several things may happen at the same time, but a storyteller cannot tell every part at once.

            Robert sat on the damp, cold, sooty lead roof and spoke first.
        - id: ch01-b83
          speaker: robert
          text: >-
            Well, this is a fine mess!
        - id: ch01-b84
          speaker: narrator
          text: >-
            Jane's first response was to cry.
        - id: ch01-b85
          speaker: robert
          text: >-
            Don't cry, Pussy. Don't be silly. It will turn out all right.
        - id: ch01-b86
          speaker: narrator
          text: >-
            Just as Cyril had expected, Robert looked around for something he could throw into the street. The noise would attract the attention of people passing far below. But the roof offered nothing at all. There were no stones, and not even one loose tile. It was covered in slate, and every single slate seemed to know its place and keep it. As so often happens, Robert found something else while searching for the thing he wanted. A trapdoor led down into the house.

            It was not locked.
        - id: ch01-b87
          speaker: robert
          text: >-
            Stop crying and help me, Jane. We'll lift this door. If we can get inside, perhaps we can slip downstairs without meeting anybody. Come on.
        - id: ch01-b88
          speaker: narrator
          text: >-
            Together they raised the trapdoor until it stood upright. As they leaned over to look down, it fell backward and struck the roof with a hollow clang. From the room below came a scream that froze their blood.
        - id: ch01-b89
          speaker: robert
          text: >-
            We've been discovered! Oh, my cats alive!
          emotion: fearful
        - id: ch01-b90
          speaker: narrator
          text: >-
            They certainly had been discovered. Below them was an attic that also served as a lumber room. It was crowded with boxes, broken chairs, old fireplace fenders, and empty picture frames. Rag bags hung from nails along the walls.

            An open box in the center was half full of clothes, and neat piles of clothing lay around it. In the middle sat a very fat lady with both feet stretched straight before her. She had given that terrible scream, and she was still screaming.
        - id: ch01-b91
          speaker: jane
          text: >-
            Please stop! We aren't going to hurt you.
        - id: ch01-b92
          speaker: amelia
          text: >-
            Where is the rest of your gang?
        - id: ch01-b93
          speaker: narrator
          text: >-
            The lady stopped halfway through a scream.
        - id: ch01-b94
          speaker: jane
          text: >-
            The others went on without us. They're riding the wishing carpet.
        - id: ch01-b95
          speaker: amelia
          text: >-
            A wishing carpet?
          emotion: surprised
        - id: ch01-b96
          speaker: jane
          text: >-
            Yes. You must have read about wishing carpets. The Phoenix is with them.
        - id: ch01-b97
          speaker: narrator
          text: >-
            Jane answered before Robert could silence her. The lady rose and picked her way between the piles of clothes. She went through the door and shut it. The children heard her calling in a voice both loud and frightened.
        - id: ch01-b98
          speaker: amelia
          text: >-
            Septimus! Septimus!
          emotion: fearful
        - id: ch01-b99
          speaker: robert
          text: >-
            Quick. I'll drop down first.
        - id: ch01-b100
          speaker: narrator
          text: >-
            Robert hung by his hands and let himself fall through the opening.
        - id: ch01-b101
          speaker: robert
          text: >-
            Your turn. Hang from your hands and drop. I'll catch you. We haven't time to argue, Jane. Drop!
        - id: ch01-b102
          speaker: narrator
          text: >-
            Jane dropped. Robert tried to catch her, but they both rolled breathlessly through the piles of clothes.
        - id: ch01-b103
          speaker: robert
          text: >-
            We'll hide behind those fenders and the other things. They'll think we've escaped across the roofs. When everything is quiet, we'll sneak downstairs and take our chance.
        - id: ch01-b104
          speaker: narrator
          text: >-
            They squeezed behind the old fenders and furniture as quickly as they could. The corner of an iron bedstead pressed painfully into Robert's side. Jane found only enough floor space for one foot and had to keep the other raised. Neither child moved or complained. Soon the lady returned, bringing another lady instead of Septimus. Robert and Jane held their breath, and their hearts beat thickly while the two women stood nearby.
        - id: ch01-b105
          speaker: amelia
          text: >-
            They're gone! The poor little creatures must be mad and wandering loose. We must lock this room and send for the police.
        - id: ch01-b106
          speaker: selina
          text: >-
            Let me look outside.
        - id: ch01-b107
          speaker: narrator
          text: >-
            The second lady was even older, thinner, and more proper than the first. Together they dragged a box beneath the trapdoor and stacked another box on top. Then they carefully climbed up and put their two neat heads through the opening to search the empty roof for the mad children.
        - id: ch01-b108
          speaker: robert
          text: >-
            Now.
        - id: ch01-b109
          speaker: narrator
          text: >-
            Robert pulled himself away from the bedstead leg. He and Jane crept from their hiding place and through the door while the two ladies were still looking across the roof.

            The children tiptoed down one flight of stairs, then another. They peered over the banisters. To their horror, a servant was climbing toward them with a full coal scuttle. Without a word, they darted through the first open door.

            It was a calm, gentlemanly study with rows and rows of books. A writing table stood inside, and a pair of embroidered slippers seemed to be warming themselves by the fender. The children hurried behind the long window curtains. As they passed the table, they noticed a missionary collection box resting there. Its bottom label had been torn away. The lid stood open, and the box was completely empty.
        - id: ch01-b110
          speaker: jane
          text: >-
            This is terrible. We'll never get out alive.
          emotion: fearful
        - id: ch01-b111
          speaker: robert
          text: >-
            Hush!
        - id: ch01-b112
          speaker: narrator
          text: >-
            Robert spoke just in time. Footsteps sounded on the stairs, and the two ladies entered. They did not see the children, but they immediately saw the empty missionary box.
        - id: ch01-b113
          speaker: amelia
          text: >-
            I knew it, Selina. They are a gang. I was certain from the beginning. Those children aren't mad at all. They distracted us while the rest of the burglars robbed the house.
        - id: ch01-b114
          speaker: selina
          text: >-
            I'm afraid you're right. But where are they now?
          emotion: fearful
        - id: ch01-b115
          speaker: amelia
          text: >-
            Downstairs, of course. They must be taking the silver milk jug and sugar bowl, Uncle Joe's punch ladle, and Aunt Jerusha's teaspoons. I shall go down there.
        - id: ch01-b116
          speaker: selina
          text: >-
            Amelia, don't be so reckless and heroic! We must call the police from the window. Lock the door. I will call them myself.
        - id: ch01-b117
          speaker: narrator
          text: >-
            Selina rushed toward the window before she had quite finished speaking. Her words turned into a yell when she came face to face with the children behind the curtain.
        - id: ch01-b118
          speaker: jane
          text: >-
            Please don't! Why are you being so unkind? We aren't burglars, we have no gang, and we never opened your missionary box. We once opened our own, but we didn't need the money, so our consciences made us put it back. Please, don't!
          emotion: fearful
        - id: ch01-b119
          speaker: narrator
          text: >-
            Miss Selina seized Jane, and Miss Amelia caught Robert. Strong, narrow hands held them fast, pink at the wrists and white across the knuckles.
        - id: ch01-b120
          speaker: amelia
          text: >-
            At least we have caught you two. Selina, yours is the smaller prisoner. Open the window and shout "Murder!" as loudly as you can.
        - id: ch01-b121
          speaker: narrator
          text: >-
            Selina opened the window. But instead of shouting murder, she called a name. At that exact moment she had seen her nephew coming through the gate.
        - id: ch01-b122
          speaker: selina
          text: >-
            Septimus!
        - id: ch01-b123
          speaker: narrator
          text: >-
            Within a minute, Septimus had let himself through the front door with his latchkey and hurried up the stairs. The moment he stepped into the study, Jane and Robert both recognized him. Their shrieks of joy were so loud and sudden that the two ladies leaped in surprise and nearly let their prisoners escape.
        - id: ch01-b124
          speaker: jane
          text: >-
            It's our own clergyman!
          emotion: happy
        - id: ch01-b125
          speaker: robert
          text: >-
            Don't you remember us? You performed the wedding for our burglar. Surely you remember!
        - id: ch01-b126
          speaker: amelia
          text: >-
            I knew there was a gang! Septimus, these dreadful children belong to dangerous burglars who are robbing this house. They have already broken open the missionary box and stolen the money.
          emotion: angry
        - id: ch01-b127
          speaker: narrator
          text: >-
            Reverend Septimus passed a tired hand across his forehead.
        - id: ch01-b128
          speaker: septimus
          text: >-
            I feel rather faint. I ran up those stairs too quickly.
        - id: ch01-b129
          speaker: robert
          text: >-
            We never touched that horrible box.
          emotion: angry
        - id: ch01-b130
          speaker: selina
          text: >-
            Then the rest of your gang opened it.
        - id: ch01-b131
          speaker: septimus
          text: >-
            No, no. I opened it myself. This morning I was short of small change for the Mothers' Independent Unity Measles and Croup Insurance payments. This isn't another dream, is it?
        - id: ch01-b132
          speaker: amelia
          text: >-
            A dream? Certainly not. Search the house. I insist.
        - id: ch01-b133
          speaker: narrator
          text: >-
            Still pale and trembling, the curate searched every room. Naturally, he found no burglars anywhere. When he returned, he dropped wearily into his chair.
        - id: ch01-b134
          speaker: robert
          text: >-
            Aren't you going to make them release us? We haven't done anything to you! It was the carpet's fault. It dropped us onto your roof, and we couldn't stop it. You know how it carried you to the island, where you had to marry the burglar and the cook.
          emotion: angry
        - id: ch01-b135
          speaker: narrator
          text: >-
            Robert spoke with furious indignation. Being held helpless by a strong lady filled him with a terrible mixture of anger and despair, and it made his blood boil.
        - id: ch01-b136
          speaker: septimus
          text: >-
            Oh, my head!
        - id: ch01-b137
          speaker: robert
          text: >-
            Never mind your head for a minute. Be honest and honorable. Do your duty, whatever state of life you're in!
          emotion: angry
        - id: ch01-b138
          speaker: septimus
          text: >-
            This must be a punishment for something I've done, though I cannot remember what it was.
        - id: ch01-b139
          speaker: selina
          text: >-
            Send for the police.
        - id: ch01-b140
          speaker: septimus
          text: >-
            Send for a doctor.
        - id: ch01-b141
          speaker: amelia
          text: >-
            Then do you believe they really are mad?
        - id: ch01-b142
          speaker: septimus
          text: >-
            I believe I am.
        - id: ch01-b143
          speaker: narrator
          text: >-
            Jane had cried ever since the ladies caught her. Now she managed to speak.
        - id: ch01-b144
          speaker: jane
          text: >-
            You aren't mad yet. But perhaps you will be, and it would serve you right too.
          emotion: sad
        - id: ch01-b145
          speaker: septimus
          text: >-
            Aunt Selina, Aunt Amelia, please believe that this is only a mad dream. You will understand that soon. It has happened to me before. But even in a dream, we must not be unjust. Let the children go. They have done no harm, and I have already told you that I opened the box.
          emotion: calm
        - id: ch01-b146
          speaker: narrator
          text: >-
            The strong, bony hands loosened their grip, though both aunts did so unwillingly. Robert pulled himself free, shook his clothes into place, and stood apart in sulky resentment. Jane reacted very differently. She ran straight to the curate and threw her arms around him so suddenly that he had no time to defend himself.
        - id: ch01-b147
          speaker: jane
          text: >-
            You are a dear. It does feel like a dream at first, but you get used to it. Now please let us leave. Be a good, kind, honorable clergyman.
        - id: ch01-b148
          speaker: septimus
          text: >-
            I don't know. It is a difficult question. This is such an unusual dream. Perhaps it is another kind of life, real enough for you to go mad in. If you are mad, there may be a dream asylum where people would treat you kindly and cure you. Then you could return to your grieving family. Even in ordinary life, duty is hard to see clearly. These dream conditions make it much harder.
        - id: ch01-b149
          speaker: robert
          text: >-
            If this is a dream, you'll wake in a moment. Then you'd regret sending us to a dream asylum. You might never enter this same dream again, so you could never let us out. We might be trapped forever. And what would happen to our grieving family when they aren't even inside your dream?
        - id: ch01-b150
          speaker: septimus
          text: >-
            Oh, my head!
        - id: ch01-b151
          speaker: narrator
          text: >-
            That was all the curate could say now. Jane and Robert felt quite ill with helplessness and despair. They could not argue him into a decision, and they could not simply leave. A truly conscientious curate can be extremely hard to manage.

            Just when they could bear the hopeless feeling no longer, both children felt the strange shrinking sensation that always came before they vanished. The next instant, they were gone. Reverend Septimus stood alone with his aunts.
        - id: ch01-b152
          speaker: septimus
          text: >-
            I knew it was a dream! Something like this has happened before. Did you dream it too, Aunt Selina? Did you, Aunt Amelia? In my dream, both of you did.
          emotion: surprised
        - id: ch01-b153
          speaker: narrator
          text: >-
            Aunt Selina looked carefully at Septimus. Then she turned and exchanged a look with Aunt Amelia. She seemed to decide something before answering him in a bold, certain voice.
        - id: ch01-b154
          speaker: selina
          text: >-
            What are you talking about? We haven't dreamed anything. You must have fallen asleep in your chair.
        - id: ch01-b155
          speaker: narrator
          text: >-
            The curate sighed with relief.
        - id: ch01-b156
          speaker: septimus
          text: >-
            Oh, if it was only me, that's all right. If all three of us had dreamed it, I could never have believed it. Never!
        - id: ch01-b157
          speaker: narrator
          text: >-
            Later, Aunt Selina spoke privately to Aunt Amelia.
        - id: ch01-b158
          speaker: selina
          text: >-
            Yes, I know I told an untruth, and no doubt I shall be punished for it. But I could see the poor dear man's mind breaking down before my eyes. He could never have endured three people sharing the dream. It was strange, though, wasn't it? All three of us dreamed the same thing at the same moment. We must never tell dear Seppy. Still, I shall send a report to the Psychical Society, using stars instead of our names.
        - id: ch01-b159
          speaker: narrator
          text: >-
            And she kept her word. She wrote down the strange shared dream, hiding the real names behind rows of stars, and sent the report away. The whole account can be found in one of the Psychical Society's thick Blue-books.

            You understand what happened, of course. The clever Phoenix had flown straight to the Psammead. There it used a wish to send Robert and Jane home. Magic answered immediately. The two children appeared back in the nursery before Cyril and Anthea had even half finished repairing the carpet.

            When the first joyful excitement of being together again had settled, they all went shopping with what remained of Uncle Reginald's sovereign. They bought Mother a pink silk handkerchief, two blue-and-white vases, a bottle of perfume, a packet of Christmas candles, and a cake of soap shaped and colored like a tomato. They found another soap so exactly like an orange that anyone who liked oranges might have tried to peel it. They also bought an iced cake. Every coin left after that went on flowers for the vases.

            Back at home, they arranged every present on a table. They filled the new vases with the flowers and stood the Christmas candles on a plate. Everything was ready for the instant Mother's cab could be heard outside. With the display finished, all four children washed themselves thoroughly and changed into tidier clothes.
        - id: ch01-b160
          speaker: robert
          text: >-
            Good old Psammead!
        - id: ch01-b161
          speakers: [cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Good old Psammead!
        - id: ch01-b162
          speaker: robert
          text: >-
            Really, we ought to say good old Phoenix just as much. What if it hadn't thought of going for the wish?
        - id: ch01-b163
          speaker: phoenix
          text: >-
            Ah, perhaps you are fortunate to have such a capable bird beside you.
        - id: ch01-b164
          speaker: anthea
          text: >-
            Mother's cab is here!
          emotion: happy
        - id: ch01-b165
          speaker: narrator
          text: >-
            The Phoenix hid, and the children lit the candles. A moment later, Mother was home.

            She liked every present. She also found the story about Uncle Reginald and the sovereign easy, and even pleasant, to believe.
        - id: ch01-b166
          speaker: cyril
          text: >-
            Good old carpet.
        - id: ch01-b167
          speaker: narrator
          text: >-
            Those were Cyril's last sleepy words.
        - id: ch01-b168
          speaker: phoenix
          text: >-
            What there is of it.
