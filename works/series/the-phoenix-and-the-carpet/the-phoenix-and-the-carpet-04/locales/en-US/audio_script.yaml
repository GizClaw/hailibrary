  chapters:
    - id: ch01
      title: TWO BAZAARS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Mother really was a dear. She was pretty and loving, wonderfully good when anyone was ill, always kind, and almost always fair. She was fair whenever she understood what was happening. But no one understands everything. Mothers are not angels, though many come very close.

            The children knew she always wanted what was best for them, even when she was not clever enough to know exactly what the best thing was. So keeping the wishing carpet and the Phoenix secret made all of them uneasy. It troubled Anthea most. Her inside mind seemed built to feel discomfort much more strongly than anyone else's. At last she decided to tell Mother the truth, whether Mother believed her or not.
        - id: ch01-b02
          speaker: anthea
          text: >-
            Then I'll have done the right thing. If she doesn't believe me, that won't be my fault, will it?
        - id: ch01-b03
          speaker: phoenix
          text: >-
            Not in the least. And she will not believe you, so you are perfectly safe.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Anthea chose a time when she had home lessons to do. There were algebra, Latin, German, English, and Euclid. She asked to work in the drawing room where it was quiet. To herself she admitted that quiet was not her real reason, and hoped she was not growing into a liar.
        - id: ch01-b05
          speaker: mother
          text: >-
            Of course you may, dearie.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Anthea began swimming through a sea of x's, y's, and z's. Mother sat at the mahogany bureau writing letters.
        - id: ch01-b07
          speaker: anthea
          text: >-
            Mother dear, may I ask you something?
        - id: ch01-b08
          speaker: mother
          text: >-
            Yes, love-a-duck. What is it?
        - id: ch01-b09
          speaker: anthea
          text: >-
            It's about Cook. I know where she is.
        - id: ch01-b10
          speaker: mother
          text: >-
            Do you, dear? Well, after the way she behaved, I would not take her back.
        - id: ch01-b11
          speaker: anthea
          text: >-
            It wasn't her fault. May I explain everything from the beginning?
        - id: ch01-b12
          speaker: narrator
          text: >-
            Mother put down her pen. Her nice face took on a resigned look, and a resigned look always makes you wish you had said nothing.
        - id: ch01-b13
          speaker: anthea
          text: >-
            This is what happened. You remember the egg that came inside the carpet? We put it in the fire, and a Phoenix hatched out. And the carpet turned out to grant wishes, and—
        - id: ch01-b14
          speaker: mother
          text: >-
            What a nice game, darling. Now please be quiet. I have so many letters to finish. I'm taking the Lamb to Bournemouth tomorrow, and then there is the bazaar.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Mother picked up her pen, and Anthea returned to the x's, y's, and z's. The pen scratched busily until Mother paused to lick an envelope.
        - id: ch01-b16
          speaker: anthea
          text: >-
            But Mother, the carpet can carry us anywhere we ask it to, and—
        - id: ch01-b17
          speaker: mother
          text: >-
            I wish it would carry you somewhere that has pretty Eastern things for my bazaar. I promised to bring some, and now I have no time to go to Liberty's.
        - id: ch01-b18
          speaker: anthea
          text: >-
            It will do that. But I still need to tell you something, Mother.
        - id: ch01-b19
          speaker: mother
          text: >-
            What is it, dear?
        - id: ch01-b20
          speaker: anthea
          text: >-
            The carpet took us to a place where no one could have whooping cough. The Lamb hasn't whooped since then. We brought Cook because she was being so tiresome, and she chose to stay there as queen of the savages. They thought her cap was a crown, and—
        - id: ch01-b21
          speaker: mother
          text: >-
            Darling, I do love hearing the stories you make up, but I am terribly busy.
        - id: ch01-b22
          speaker: anthea
          text: >-
            But it really happened.
          emotion: sad
        - id: ch01-b23
          speaker: mother
          text: >-
            You mustn't say that, my sweet.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Then Anthea knew there was no hope of convincing her.
        - id: ch01-b25
          speaker: anthea
          text: >-
            Will you be away long?
        - id: ch01-b26
          speaker: mother
          text: >-
            I have a cold, and Daddy is worried about it and about the Lamb's cough.
        - id: ch01-b27
          speaker: anthea
          text: >-
            He hasn't coughed once since Saturday.
        - id: ch01-b28
          speaker: mother
          text: >-
            I wish I could believe that. Daddy must go to Scotland too. I do hope all of you will behave.
        - id: ch01-b29
          speaker: anthea
          text: >-
            We will. We truly will. When is the bazaar?
        - id: ch01-b30
          speaker: mother
          text: >-
            Saturday, at the schools. Now, there's a treasure, don't say any more. My head is spinning, and I've forgotten how to spell whooping cough.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Mother and the Lamb went away, and Father left for Scotland. A new cook came to look after the house. She looked so much like a frightened rabbit that no one had the heart to do anything that might scare her more than she already expected to be scared.

            The Phoenix begged to be excused from any adventures. It said that it needed a full week of rest and asked the children not to disturb it. Then it hid its golden, gleaming self somewhere in the house. They searched, but nobody could find it.

            On Wednesday afternoon, the children unexpectedly had a holiday. Everyone wanted a carpet journey, though they had to go without the Phoenix. Evening journeys were forbidden. In the confusion of leaving, Mother had suddenly made them promise never to be out after six. Saturday was the one exception because they had to attend the bazaar. For that event, they were pledged to wear their best clothes and wash themselves as thoroughly as possible. Their nails must be cleaned with the flattened ends of wooden matches, which did no harm, and never with scratchy scissors.
        - id: ch01-b32
          speaker: jane
          text: >-
            Let's go and see the Lamb.
        - id: ch01-b33
          speaker: narrator
          text: >-
            They all agreed that appearing without warning in Bournemouth might frighten Mother out of her wits, or even into a fit. So they sat on the carpet and thought until they nearly began to squint.
        - id: ch01-b34
          speaker: cyril
          text: >-
            I've got it. Carpet, please take us somewhere we can see Mother and the Lamb, but no one can see us.
        - id: ch01-b35
          speaker: jane
          text: >-
            Except the Lamb. He must be able to see us.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The world turned upside down for a moment. When their senses settled, the wishing carpet lay on another soft carpet made of brown pine needles. Green branches spread overhead. A quick, clear stream raced as fast as it could between steep banks. There sat Mother without her hat, with the November sun shining brightly upon her. Beside her was the Lamb, cheerful as could be and not whooping at all.
        - id: ch01-b37
          speaker: robert
          text: >-
            The carpet has tricked us. Mother will see us as soon as she turns around.
        - id: ch01-b38
          speaker: narrator
          text: >-
            But the faithful carpet had done exactly what they asked. Mother turned her dear head and looked straight at them without seeing a thing.
        - id: ch01-b39
          speaker: cyril
          text: >-
            We're invisible. What tremendous fun!
        - id: ch01-b40
          speaker: narrator
          text: >-
            The girls did not find it fun. Mother looked directly through them, and her face stayed unchanged, as if they were not there at all.
        - id: ch01-b41
          speaker: jane
          text: >-
            I hate this. Mother never looked at us that way before. It's as if she doesn't love us, as if we're someone else's children and not very nice ones. She looks as if she doesn't care whether she ever sees us.
          emotion: sad
        - id: ch01-b42
          speaker: anthea
          text: >-
            It is horrible.
          emotion: sad
        - id: ch01-b43
          speaker: narrator
          text: >-
            Anthea was close to tears. Then the Lamb saw them. He rushed toward the carpet with a shriek.
        - id: ch01-b44
          speaker: lamb
          text: >-
            Panty! My own Panty! And Pussy, and Squiggle, and Bobs! Oh, oh!
          emotion: happy
        - id: ch01-b45
          speaker: narrator
          text: >-
            Anthea caught him and kissed him. Jane kissed him too. They could not help it. His blue three-cornered hat sat crooked on his head, and his dear face was dirty in the old familiar way.
        - id: ch01-b46
          speaker: lamb
          text: >-
            I love you, Panty! I love you, and you, and you, and you!
          emotion: happy
        - id: ch01-b47
          speaker: narrator
          text: >-
            It was a delicious moment. Even the boys joyfully thumped their baby brother on the back.

            Then Anthea looked at Mother. Mother's face had turned pale sea green. She stared at the Lamb as if he had gone mad, which was exactly what she thought.
        - id: ch01-b48
          speaker: mother
          text: >-
            My Lamb! My precious baby! Come to Mother!
          emotion: fearful
        - id: ch01-b49
          speaker: narrator
          text: >-
            Mother jumped up and ran to him. The invisible children had to leap away before she touched them, because feeling something you cannot see is the worst kind of ghostly feeling. She snatched up the Lamb and hurried out of the pinewood.
        - id: ch01-b50
          speaker: jane
          text: >-
            Let's go home. It feels exactly as if Mother doesn't love us.
          emotion: sad
        - id: ch01-b51
          speaker: narrator
          text: >-
            After a miserable silence, they followed long enough to see Mother meet another lady and know she was safe. You cannot leave your mother green in the face in a faraway pinewood, with no one to help her, and simply fly home as if nothing happened.

            Once she was safe, the children returned to the carpet, said, "Home," and home they went.
        - id: ch01-b52
          speaker: cyril
          text: >-
            I don't much care for being invisible, at least not around my own family. It would be different if you were a prince, a bandit, or a burglar.
        - id: ch01-b53
          speaker: narrator
          text: >-
            All four kept thinking tenderly of Mother's dear greenish face.
        - id: ch01-b54
          speaker: jane
          text: >-
            I wish she hadn't gone away. The house is beastly without her.
        - id: ch01-b55
          speaker: anthea
          text: >-
            We ought to do what she asked. I read somewhere that the wishes of the departed are sacred.
        - id: ch01-b56
          speaker: cyril
          text: >-
            That means people who have departed much farther away. India with its coral strands, or Greenland's icy mountains. Not Bournemouth. Besides, we don't know what she wished for.
        - id: ch01-b57
          speaker: anthea
          text: >-
            She did say to get Indian things for her bazaar. I know she thought it was only a game and that we couldn't really do it.
          emotion: sad
        - id: ch01-b58
          speaker: robert
          text: >-
            Then let's get them anyway. We'll go first thing Saturday morning.
        - id: ch01-b59
          speaker: narrator
          text: >-
            And on Saturday morning, first thing, they went.
        - id: ch01-b60
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            We want Indian things for Mother's bazaar. Please take us somewhere people will give us heaps of Indian things.
        - id: ch01-b61
          speaker: narrator
          text: >-
            The Phoenix was still nowhere to be found. The four children sat alone on the beautiful carpet and made their wish. Their senses whirled away and came back on the edge of a shining white Indian town.

            The domes and roofs told them at once that it was Indian. Then a man passed on an elephant, and two English soldiers walked down the road talking like soldiers in Mr. Kipling's books. After that, no doubt was possible. The children rolled up the carpet, Robert carried it, and all four walked bodily into town.

            It was so warm that they once again had to take off their London-in-November coats and carry them over their arms. The streets were narrow and unfamiliar. The clothes worn by the people in those streets looked stranger still, and the words they spoke were strangest of all.
        - id: ch01-b62
          speaker: cyril
          text: >-
            I can't understand a single word. How are we supposed to ask for bazaar things?
        - id: ch01-b63
          speaker: jane
          text: >-
            These people look poor too. What we need is a rajah or someone like that.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Robert started to unroll the carpet, but the others begged him not to waste a wish.
        - id: ch01-b65
          speaker: anthea
          text: >-
            We asked the carpet to bring us where we could get Indian things for bazaars. It will manage somehow.
        - id: ch01-b66
          speaker: narrator
          text: >-
            Her faith was rewarded. Just then a very brown gentleman in a turban approached and bowed deeply. When he spoke, English words thrilled their ears.
        - id: ch01-b67
          speaker: interpreter
          text: >-
            My ranee thinks you are very nice children. She asks whether you are lost and whether you wish to sell your carpet. She sees you from her palanquin. You will come to her, yes?
        - id: ch01-b68
          speaker: narrator
          text: >-
            They followed the stranger and his smile, which seemed to contain far more teeth than most smiles, through crooked streets to the ranee's palace. I will not describe that palace, because I have never seen one and Mr. Kipling has. You may read his descriptions in his books. But I do know exactly what happened there.

            The old ranee sat on a low seat covered in cushions. Many ladies sat around her in trousers and veils, sparkling with tinsel, gold, and jewels. The turbaned gentleman stood behind a carved screen and interpreted everything the children and the queen said.

            The ranee offered to buy the carpet. The children refused.
        - id: ch01-b69
          speaker: ranee
          text: >-
            Why will you not sell it?
        - id: ch01-b70
          speaker: narrator
          text: >-
            Jane briefly explained why, and the interpreter repeated her words to the queen.
        - id: ch01-b71
          speaker: interpreter
          text: >-
            My mistress says that is a fine story. You must tell her the whole of it and forget about the time.
        - id: ch01-b72
          speaker: narrator
          text: >-
            They had to obey, and they had to begin at the beginning. It became a very long story because every part was told twice, first by Cyril and then by the interpreter. Cyril began to enjoy himself and warmed to the work. He described the Phoenix and the Carpet, the adventure at the Lone Tower, and Cook staying behind to become queen. As he went on, his language sounded more and more like the Arabian Nights. The ranee and her ladies listened to the translation and rolled on their fat cushions with laughter.

            When the tale was finished, the queen spoke. Then she took a string of turquoises from her neck and tossed it to Cyril.
        - id: ch01-b73
          speaker: interpreter
          text: >-
            She says, "Little one, you were born in heaven to tell stories."
        - id: ch01-b74
          speakers: [anthea, jane]
          ensemble: duo
          text: >-
            Oh, those are beautiful!
          emotion: surprised
        - id: ch01-b75
          speaker: narrator
          text: >-
            Cyril bowed several times, cleared his throat, and answered.
        - id: ch01-b76
          speaker: cyril
          text: >-
            Please thank her very much. But I would rather have some inexpensive things from the bazaar. We need to sell them today and use the money to buy clothes for poor people who have none.
        - id: ch01-b77
          speaker: ranee
          text: >-
            He may sell my gift and use its price to clothe the poor.
        - id: ch01-b78
          speaker: cyril
          text: >-
            No, thank you. The things must be sold today at our English bazaar. No one there would buy a turquoise necklace. They would think it was fake, or they would ask where we got it.
        - id: ch01-b79
          speaker: narrator
          text: >-
            So the queen sent servants to buy small, pretty objects, and they piled them on the carpet. There were brass trays and pots, carved ornaments, colored fabrics, and many other things that would shine splendidly on an English bazaar stall.
        - id: ch01-b80
          speaker: ranee
          text: >-
            I shall have to lend you an elephant to carry all this away.
        - id: ch01-b81
          speaker: narrator
          text: >-
            She laughed, but Anthea had another plan.
        - id: ch01-b82
          speaker: anthea
          text: >-
            If Your Majesty will lend us a comb and let us wash our hands and faces, we can show you real magic. We shall disappear like smoke, along with the carpet and every brass tray, pot, carved ornament, and piece of cloth.
        - id: ch01-b83
          speaker: narrator
          text: >-
            The idea delighted the queen. She clapped her hands and lent them a sandalwood comb set with ivory lotus flowers. They washed their faces and hands in silver basins.

            Then Cyril gave a very polite farewell speech. Quite suddenly, he ended it with a wish.
        - id: ch01-b84
          speaker: cyril
          text: >-
            And now I wish we were at the bazaar in our schools.
        - id: ch01-b85
          speaker: narrator
          text: >-
            Of course, they vanished. The ranee and her ladies sat openmouthed, staring at the bare patch of inlaid marble where the children and carpet had been.
        - id: ch01-b86
          speaker: ranee
          text: >-
            If that was not magic, nothing ever was!
          emotion: happy
        - id: ch01-b87
          speaker: narrator
          text: >-
            The queen loved what had happened. It gave the ladies of her court something marvelous to discuss, and they have talked about that sudden disappearance on rainy days ever since.

            Cyril's stories had taken a long time. So had the strange sweet meal served while the pretty things were bought. By the time the children reached the schoolroom, the gas was already lit, and winter dusk was settling over the houses of Camden Town.
        - id: ch01-b88
          speaker: cyril
          text: >-
            I'm glad we washed in India. We'd have been terribly late if we'd gone home to scrub first.
        - id: ch01-b89
          speaker: robert
          text: >-
            Washing is much nicer in India because it's warm. I wouldn't mind it nearly so much if we lived there.
        - id: ch01-b90
          speaker: narrator
          text: >-
            The thoughtful carpet had placed them in a dim space behind the meeting point of two stalls. String and brown paper littered the floor, while baskets and boxes stood piled against the wall.
        - id: ch01-b91
          speaker: narrator
          text: >-
            The children crawled beneath a stall covered in tablecloths, mats, and other things beautifully embroidered by idle ladies with no real work to do. They came out at the end, pushing aside a sideboard cloth decorated with blue geraniums. The girls slipped out unseen, and so did Cyril. But as Robert carefully emerged, Mrs. Biddle, who ran the stall, stepped squarely on his hand. Her foot was large and solid. Robert's hand was small and solid. Who could blame him for yelling?

            A crowd gathered instantly. Yells are rare at bazaars, so everyone was deeply interested. For several seconds, the three free children tried to make Mrs. Biddle understand what had happened. At first she believed her foot was simply on the schoolroom floor. Then she decided she must have stepped on a dropped pincushion. At last they convinced her that the thing beneath her large, firm foot was a living child's suffering hand.

            When she realized she had hurt him, she became very angry. People who hurt someone by accident are often much angrier than the person they hurt. I wonder why.
        - id: ch01-b92
          speaker: mrs_biddle
          text: >-
            I am very sorry, I'm sure. Now come out! What do you mean by crawling under the stalls like an earwig?
          emotion: angry
        - id: ch01-b93
          speaker: robert
          text: >-
            We were looking at the things in the corner.
        - id: ch01-b94
          speaker: mrs_biddle
          text: >-
            Those nasty, prying habits will never make you successful. There is nothing back there except packing material and dust.
        - id: ch01-b95
          speaker: jane
          text: >-
            Oh, isn't there? That just shows how much you know.
        - id: ch01-b96
          speaker: narrator
          text: >-
            Mrs. Biddle flushed violet.
        - id: ch01-b97
          speaker: mrs_biddle
          text: >-
            Little girl, do not be rude.
          emotion: angry
        - id: ch01-b98
          speaker: cyril
          text: >-
            She isn't trying to be rude. There really are some nice things there.
        - id: ch01-b99
          speaker: narrator
          text: >-
            Cyril suddenly saw that they could not tell the listening crowd those treasures were Mother's bazaar gifts. No one would believe them. Or worse, someone might believe them and write to thank Mother. Goodness knew what she would think then. The other children understood the same thing.
        - id: ch01-b100
          speaker: miss_peasmarsh
          text: >-
            I should very much like to see them.
        - id: ch01-b101
          speaker: narrator
          text: >-
            This very nice lady had been disappointed by her friends and hoped the mysterious objects might be late gifts for her poorly stocked stall. She looked at Robert.
        - id: ch01-b102
          speaker: robert
          text: >-
            I will show you with pleasure. Don't mention it.
        - id: ch01-b103
          speaker: narrator
          text: >-
            Robert dived back under Mrs. Biddle's stall.
        - id: ch01-b104
          speaker: mrs_biddle
          text: >-
            I cannot imagine why you encourage such behavior, Miss Peasmarsh. You know I always speak my mind, and I must say I am surprised.

            There is no entertainment here. A very naughty boy has accidentally hurt himself, but only a little. Please move along. If he remains the center of attention, it will only encourage his bad behavior.
        - id: ch01-b105
          speaker: narrator
          text: >-
            The crowd slowly scattered. Anthea was too furious to speak. Then she heard a nice curate murmur something.
        - id: ch01-b106
          speaker: curate
          text: >-
            I feel sorry for that poor little fellow.
        - id: ch01-b107
          speaker: narrator
          text: >-
            Anthea loved him at once and forever.

            Robert wriggled out carrying pieces of Benares brass and sandalwood boxes with inlaid patterns.
        - id: ch01-b108
          speaker: miss_peasmarsh
          text: >-
            They're from Liberty! So Charles did remember after all.
          emotion: happy
        - id: ch01-b109
          speaker: mrs_biddle
          text: >-
            Excuse me. These objects were placed behind my stall. Some unknown giver has done a good deed in secret and would blush to hear you claim the credit. Naturally, the things are meant for me.
        - id: ch01-b110
          speaker: miss_peasmarsh
          text: >-
            But the corner of my stall touches yours, and my cousin did promise to send something.
        - id: ch01-b111
          speaker: narrator
          text: >-
            Poor Miss Peasmarsh spoke timidly. The children edged away from such an unequal contest and disappeared into the crowd. For some time their feelings were too deep for words.
        - id: ch01-b112
          speaker: robert
          text: >-
            She is a stiff, starched pig!
          emotion: angry
        - id: ch01-b113
          speaker: cyril
          text: >-
            After all our trouble! I've talked myself hoarse telling stories to that lady in trousers in India.
          emotion: angry
        - id: ch01-b114
          speaker: jane
          text: >-
            That pig-lady is very, very nasty.
          emotion: angry
        - id: ch01-b115
          speaker: anthea
          text: >-
            She certainly isn't nice, and Miss Peasmarsh is nice and pretty. Has anyone got a pencil?
        - id: ch01-b116
          speaker: narrator
          text: >-
            Anthea crawled beneath three stalls. In the corner she found a large sheet of pale blue paper among the rubbish. She folded it into a square and wrote on it. She licked the pencil before every word so the marks would come out dark.
        - id: ch01-b117
          speaker: anthea
          text: >-
            "All these Indian things are for pretty, nice Miss Peasmarsh's stall. From an unknown donna."
        - id: ch01-b118
          speaker: narrator
          text: >-
            Anthea thought of adding that Mrs. Biddle was to get nothing. That might have aroused suspicion, so she stopped and crawled back through the boards and trestles.

            Mrs. Biddle appealed to the bazaar committee. They lifted and shifted the corner of the stall so stout clergymen and heavy ladies could reach the hidden things without crawling under any stalls. There among the treasures lay Anthea's blue note. Because it plainly named Miss Peasmarsh, every splendid, shining Indian object was handed over to her. By the end of the bazaar she had sold them all and made thirty-five pounds.
        - id: ch01-b119
          speaker: mrs_biddle
          text: >-
            I do not understand that blue paper. It looks like something written by a lunatic. Calling you nice and pretty! No sane person wrote that.
        - id: ch01-b120
          speaker: narrator
          text: >-
            Anthea and Jane asked to help sell the goods because their brother had been the one to announce their arrival. Miss Peasmarsh gladly accepted. Her stall had been sadly neglected before, but now it was surrounded by people wanting to buy, and she needed every pair of hands. The children noticed that Mrs. Biddle had no more customers than she could easily manage by herself.

            I hope that did not please them. You should forgive your enemies, even if they tread on your hand and blame you for it. Still, I fear the children were less sorry for her than they ought to have been.

            Arranging everything took time. They spread the wishing carpet across the stall, and its dark colors made the brass, silver, and ivory glow. The afternoon was busy and happy. Miss Peasmarsh and the girls sold every single pretty object that had come from the faraway Indian bazaar. Only then did Anthea and Jane join the boys. They fished in the fishpond, dived into the bran pie, listened to the cardboard band and the phonograph, and heard a chorus of singing birds. The bird calls were secretly produced behind a screen with glass tubes and glasses of water.

            The nice curate suddenly treated them to a wonderful tea. Miss Peasmarsh joined them before anyone had managed to eat more than three cakes. It was a merry party. The curate was extremely pleasant to everyone, even to Miss Peasmarsh, as Jane later remarked with special interest.
        - id: ch01-b121
          speaker: anthea
          text: >-
            We should go back to the stall.
        - id: ch01-b122
          speaker: narrator
          text: >-
            No one could possibly eat another bite. The curate had lowered his voice and was talking to Miss Peasmarsh about something happening after Easter.
        - id: ch01-b123
          speaker: miss_peasmarsh
          text: >-
            There is nothing left to go back for. Thanks to you dear children, we sold everything.
          emotion: happy
        - id: ch01-b124
          speaker: cyril
          text: >-
            But the carpet is still there.
        - id: ch01-b125
          speaker: miss_peasmarsh
          text: >-
            Oh, don't trouble about that. I sold the carpet too. Mrs. Biddle paid ten shillings for it. She says it will go in her servant's bedroom.
        - id: ch01-b126
          speaker: jane
          text: >-
            Her servants don't have carpets. Our old cook worked for her, and she told us so.
        - id: ch01-b127
          speaker: curate
          text: >-
            No scandal about Queen Elizabeth, if you please.
        - id: ch01-b128
          speaker: narrator
          text: >-
            Miss Peasmarsh laughed and looked at the curate as if she had never dreamed anyone could be so amusing. The children were speechless. How could they claim the carpet? Who brings a carpet to a bazaar unless it is meant to be sold?

            They were thoroughly miserable, but misery did not make them forget their manners. Even grown-ups sometimes forget theirs, though they should know much better. One child thanked the curate for the jolly tea. Another thanked him for being so jolly, and another for giving them such a jolly time. He had paid for their turns at the fishponds and bran pies, and for the phonograph and the chorus of birds. He had borne every expense like a man. The girls hugged Miss Peasmarsh.

            As they left, they heard the curate speaking.
        - id: ch01-b129
          speaker: curate
          text: >-
            Jolly little children, yes. But what about us? You will let it be directly after Easter, won't you? Please say you will.
        - id: ch01-b130
          speaker: narrator
          text: >-
            Jane ran back before Anthea could stop her.
        - id: ch01-b131
          speaker: jane
          text: >-
            What are you going to do after Easter?
        - id: ch01-b132
          speaker: narrator
          text: >-
            Miss Peasmarsh smiled and looked prettier than ever.
        - id: ch01-b133
          speaker: curate
          text: >-
            I hope to take a journey to the Fortunate Islands.
        - id: ch01-b134
          speaker: jane
          text: >-
            I wish we could carry you there on the wishing carpet.
        - id: ch01-b135
          speaker: curate
          text: >-
            Thank you, but I fear I cannot wait for that. I must visit the Fortunate Islands before they make me a bishop. Afterward, I would have no time.
        - id: ch01-b136
          speaker: jane
          text: >-
            I've always thought I would marry a bishop. His aprons would be so useful. Wouldn't you like to marry a bishop, Miss Peasmarsh?
        - id: ch01-b137
          speaker: narrator
          text: >-
            That was when the others dragged Jane away.
        - id: ch01-b138
          speaker: narrator
          text: >-
            Since Mrs. Biddle had stepped on Robert's hand, everyone agreed that he should not remind her of it and make her angry again. Anthea and Jane had helped at her rival's stall, so Mrs. Biddle was unlikely to welcome them either.

            A quick council of four decided she would dislike Cyril least. The other three blended into the crowd while he approached her.
        - id: ch01-b139
          speaker: cyril
          text: >-
            Mrs. Biddle, we meant to buy that carpet ourselves. Would you sell it to us? We could give you—
        - id: ch01-b140
          speaker: mrs_biddle
          text: >-
            Certainly not. Go away, little boy.
        - id: ch01-b141
          speaker: narrator
          text: >-
            Her tone made it perfectly clear that no argument would help. Cyril found the others.
        - id: ch01-b142
          speaker: cyril
          text: >-
            It's hopeless. She's like a lioness whose cubs have been stolen. Anthea, I don't care what you say. That carpet belongs to us. Taking it back would not be burglary. It would be a desperate rescue, brave and daring, and not wrong at all.
        - id: ch01-b143
          speaker: narrator
          text: >-
            They kept wandering among the bright crowd, but all the pleasure was gone. The chorus of singing birds no longer sounded like birds at all. It sounded like people blowing through glass tubes into water. The phonograph made a horrible noise so loud that they could hardly hear themselves speak. People bought things they could not possibly need. The whole bazaar seemed stupid.

            Mrs. Biddle had bought their wishing carpet for ten shillings. All of life felt sad, gray, and dusty. It smelled of small gas leaks, hot people, cake, and crumbs. Every child was very tired.

            They found a corner where they could watch the carpet and waited miserably, long past bedtime. At ten o'clock, the buyers left. The sellers stayed to count their money.
        - id: ch01-b144
          speaker: robert
          text: >-
            And talk endlessly about it. I will never attend another bazaar as long as I live. My hand has swollen as big as a pudding. I expect the nails in her dreadful boots were poisoned.
        - id: ch01-b145
          speaker: bazaar_attendant
          text: >-
            It is all over now. You children had better go home.
        - id: ch01-b146
          speaker: narrator
          text: >-
            So they went outside. They waited beneath a gas lamp on the pavement where ragged children had stood all evening listening to the band. Their feet slid in greasy mud until Mrs. Biddle came out. She climbed into a cab with the many things she had failed to sell and the few she had bought, including the carpet.

            The other stallholders were content to leave their unsold goods at the school until Monday morning. Mrs. Biddle was afraid someone would steal something from her collection, so she packed it all into the cab instead.

            The four children were too desperate to care about mud or what anyone thought of them. They clung to the back of her cab all the way to her house. Mrs. Biddle climbed down with the carpet, carried it indoors, and shut the front door behind her.
        - id: ch01-b147
          speaker: anthea
          text: >-
            Let's not burgle—I mean, attempt a brave and daring rescue—until we've given her one last chance. We should ring the bell and ask to see her.
        - id: ch01-b148
          speaker: narrator
          text: >-
            The others hated the idea. At last they agreed, but only if Anthea promised not to make a silly fuss about burglary afterward, should burglary truly be necessary.

            They knocked and rang. A frightened-looking parlormaid opened the door. As they asked for Mrs. Biddle, they caught sight of her in the dining room. She had already pushed the table aside and spread the carpet on the floor to see how it looked.
        - id: ch01-b149
          speaker: jane
          text: >-
            I knew she didn't want it for her servant's bedroom.
        - id: ch01-b150
          speaker: narrator
          text: >-
            Anthea marched past the uncomfortable maid, and the others followed. Mrs. Biddle had her back to them. She was smoothing the carpet with the same boot that had trampled Robert's hand. All four children entered, and Cyril had the good sense to shut the dining-room door before she noticed them.
        - id: ch01-b151
          speaker: mrs_biddle
          text: >-
            Who is it, Jane?
        - id: ch01-b152
          speaker: narrator
          text: >-
            She turned suddenly and saw the children. Once again her face deepened to a dark violet.
        - id: ch01-b153
          speaker: mrs_biddle
          text: >-
            You wicked, shameless little creatures! How dare you come into my house, and at this hour? Leave at once, or I shall call the police.
          emotion: angry
        - id: ch01-b154
          speaker: anthea
          text: >-
            Please don't be angry. We only came to ask for the carpet. Between us, we have twelve shillings, and—
        - id: ch01-b155
          speaker: mrs_biddle
          text: >-
            How dare you!
          emotion: angry
        - id: ch01-b156
          speaker: narrator
          text: >-
            Her voice shook with rage.
        - id: ch01-b157
          speaker: jane
          text: >-
            You do look horrid.
        - id: ch01-b158
          speaker: narrator
          text: >-
            Mrs. Biddle stamped her booted foot.
        - id: ch01-b159
          speaker: mrs_biddle
          text: >-
            You are a rude, barefaced child!
          emotion: angry
        - id: ch01-b160
          speaker: narrator
          text: >-
            Anthea nearly shook Jane, but Jane pushed ahead.
        - id: ch01-b161
          speaker: jane
          text: >-
            It truly is our nursery carpet. You can ask anyone if you don't believe me.
        - id: ch01-b162
          speaker: cyril
          text: >-
            Let's wish ourselves home.
        - id: ch01-b163
          speaker: narrator
          text: >-
            Cyril whispered, and Robert whispered back.
        - id: ch01-b164
          speaker: robert
          text: >-
            That won't work. She would come with us, and she'd probably be madder than ever. Horrid woman. I hate her.
        - id: ch01-b165
          speaker: anthea
          text: >-
            I wish Mrs. Biddle were in an angelically good temper!
        - id: ch01-b166
          speaker: narrator
          text: >-
            It was worth trying. Mrs. Biddle's face changed from purple to violet, from violet to mauve, and from mauve to pink. Then she gave them a truly cheerful smile.
        - id: ch01-b167
          speaker: mrs_biddle
          text: >-
            Why, so I am! What a funny thing to say. Why shouldn't I be in a good temper, my dears?
          emotion: happy
        - id: ch01-b168
          speaker: narrator
          text: >-
            Once more, the carpet had worked its magic. It worked not only on Mrs. Biddle. The children suddenly felt good and happy too.
        - id: ch01-b169
          speaker: cyril
          text: >-
            You're a wonderfully good sort. I can see it now. I'm sorry we annoyed you at the bazaar today.
        - id: ch01-b170
          speaker: mrs_biddle
          text: >-
            We won't say another word about it. Of course you may have the carpet if you like it so much. No, no, I will accept only the ten shillings I paid.
        - id: ch01-b171
          speaker: anthea
          text: >-
            It feels unfair to ask after you bought it. But it truly is our nursery carpet. It reached the bazaar by accident with some other things.
        - id: ch01-b172
          speaker: mrs_biddle
          text: >-
            Did it really? How annoying for you! Well, my dears, I can easily spare the extra ten shillings. Take your carpet, and we shall say no more. Have some cake before you leave. And, my boy, I am very sorry I stepped on your hand. Does it feel better now?
        - id: ch01-b173
          speaker: robert
          text: >-
            Yes, thank you. I say, you really are good.
        - id: ch01-b174
          speaker: mrs_biddle
          text: >-
            Not at all. I am delighted to give you dear children some small pleasure.
        - id: ch01-b175
          speaker: narrator
          text: >-
            She helped them roll the carpet, and the boys carried it between them.
        - id: ch01-b176
          speaker: anthea
          text: >-
            You really are a dear.
          emotion: happy
        - id: ch01-b177
          speaker: narrator
          text: >-
            Anthea and Mrs. Biddle kissed each other warmly.

            The children went down the street with their carpet.
        - id: ch01-b178
          speaker: cyril
          text: >-
            Well, that was extraordinary!
          emotion: surprised
        - id: ch01-b179
          speaker: robert
          text: >-
            Yes. The strange thing is, it feels real. I mean her being so friendly. It doesn't feel as though the carpet merely forced her to be nice.
        - id: ch01-b180
          speaker: anthea
          text: >-
            Perhaps it is real. Maybe her true niceness was buried under crossness and tiredness, and the carpet swept those things away.
        - id: ch01-b181
          speaker: jane
          text: >-
            I hope they stay away. She isn't ugly at all when she laughs.
        - id: ch01-b182
          speaker: narrator
          text: >-
            The carpet has worked many wonders in its long life, but I think the change in Mrs. Biddle was the most wonderful of them all. It did not fade when the children carried the carpet away. From that very day onward, she was never anything like as disagreeable as she had been before.

            When pretty Miss Peasmarsh married the nice curate just after Easter, Mrs. Biddle sent them a lovely silver teapot and a kind letter. The happy pair went to Italy for their honeymoon.
