        delivery: 亲切从容，带一点英式童话的机智
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明自信，挖苦人时一本正经
        timbre: 清脆的少年声
        pace: 中等偏快
        pitch: 中高
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴敏锐，急切时仍然清楚
        timbre: 柔和明亮的少女声
        pace: 中等
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 坚持己见，认真里常带几分莽撞
        timbre: 结实清朗的少年声
        pace: 中等
        pitch: 中等
    jane:
      display_name: 简
      tts:
        delivery: 天真直率，话里带着小孩子的认真
        timbre: 稚嫩柔软的女孩声
        pace: 稍慢
        pitch: 偏高
    lamb:
      display_name: 小羊羔
      tts:
        delivery: 稚气快活，说话简短直接
        timbre: 柔软清亮的幼童声
        pace: 稍慢
        pitch: 高
    phoenix:
      display_name: 凤凰
      tts:
        delivery: 文雅自负，庄重中带着敏锐的幽默
        timbre: 华美清润，中性而成熟
        pace: 从容
        pitch: 中高
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔克制，忧心时语气依然平和
        timbre: 柔润清晰的成年女声
        pace: 中等
        pitch: 中等
    interpreter:
      display_name: 翻译
      tts:
        delivery: 恭敬周到，措辞略显正式
        timbre: 清晰温厚的成年男声
        pace: 中等
        pitch: 中低
    rani:
      display_name: 拉妮
      tts:
        delivery: 雍容爽朗，带着好奇和威严
        timbre: 圆润沉静的老年女声
        pace: 从容
        pitch: 中等
    mrs_biddle:
      display_name: 比德尔太太
      tts:
        delivery: 强势刻薄，转为和善时热情爽快
        timbre: 洪亮结实的成年女声
        pace: 中等偏快
        pitch: 中等
    miss_peasemarsh:
      display_name: 皮斯马什小姐
      tts:
        delivery: 温柔腼腆，快活时轻盈明朗
        timbre: 柔和悦耳的年轻女声
        pace: 中等
        pitch: 中高
    curate:
      display_name: 副牧师
      tts:
        delivery: 亲切风趣，说话温和而真诚
        timbre: 清朗温暖的年轻男声
        pace: 从容
        pitch: 中等
    official:
      display_name: 工作人员
      tts:
        delivery: 公事公办，简短明确
        timbre: 平实清楚的成年声
        pace: 中等
        pitch: 中等
  chapters:
    - id: ch01
      title: 两个义卖会
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 妈妈真是个大大的宝贝。她长得漂亮，心里满是爱。你生病的时候，她尤其好，好得简直没法说。平常日子里，她也总是和气，几乎总是公正，只是得先弄明白事情的原委。可她当然不可能件件事都明白。世上没有谁什么都懂，妈妈也不是天使，尽管许多妈妈已经很接近天使了。
        - id: ch01-b02
          speaker: narrator
          text: 孩子们知道，妈妈总想把最好的给他们。就算她不够聪明，未必每次都能准确知道什么才是最好，她的心意也不会变。所以，瞒着她不说凤凰和许愿毯的大秘密，大家心里都不好受，安西娅尤其难受。她的心天生比别人更容易不安。她终于决定，不管妈妈相信的可能有多小，也一定要把真相说出来。
        - id: ch01-b03
          speaker: anthea
          text: 只要我说了真话，就算尽到责任了。妈妈不相信，也不能怪我，对吧？
        - id: ch01-b04
          speaker: phoenix
          text: 当然不能。而且她肯定不信，你完全可以放心。
        - id: ch01-b05
          speaker: narrator
          text: 做家庭功课时，安西娅挑了个机会，问妈妈能不能去客厅学习。功课里有代数、拉丁文、德文、英文，还有欧几里得几何。
        - id: ch01-b06
          speaker: anthea
          text: 客厅里安静一点。
        - id: ch01-b07
          speaker: narrator
          text: 她心里却明白，这不是真正的理由，还暗暗希望自己长大以后别成为骗子。妈妈答应了。安西娅一头扎进由x、y、z组成的大海，妈妈坐在桃花心木写字桌前写信。
        - id: ch01-b08
          speaker: anthea
          text: 妈妈。
        - id: ch01-b09
          speaker: mother
          text: 什么事，小宝贝？
        - id: ch01-b10
          speaker: anthea
          text: 是厨娘的事。我知道她在哪儿。
        - id: ch01-b11
          speaker: mother
          text: 是吗，亲爱的？可她做出那种事，我不会再请她回来了。
        - id: ch01-b12
          speaker: anthea
          text: 那件事不能怪她。我能不能从头说给你听？
        - id: ch01-b13
          speaker: narrator
          text: 妈妈放下笔，脸上露出一副只好听下去的神情。一个人摆出这种脸色，你马上就会不想再告诉他了。
        - id: ch01-b14
          speaker: anthea
          text: 是这么回事。地毯带回来的那只蛋，你还记得吧？我们把蛋放进火里，孵出了一只凤凰。那张地毯又是一张许愿毯，后来……
        - id: ch01-b15
          speaker: mother
          text: 这游戏真有意思，宝贝。现在安静一会儿吧，我还有好多信要写。明天我要带小羊羔去伯恩茅斯，还有义卖会的事要忙。
        - id: ch01-b16
          speaker: narrator
          text: 安西娅只好回到x、y、z中间。妈妈的笔不停地沙沙响。等妈妈放下笔去舔信封时，她又试了一次。
        - id: ch01-b17
          speaker: anthea
          text: 可是妈妈，那张地毯真能带我们去任何想去的地方，而且……
        - id: ch01-b18
          speaker: mother
          text: 那我倒希望，它能带你们去找些漂亮的东方东西，捐给我的义卖会。我答应过人家，现在却来不及去利伯蒂商店了。
        - id: ch01-b19
          speaker: anthea
          text: 它真的能办到。可是妈妈……
        - id: ch01-b20
          speaker: mother
          text: 又怎么了，亲爱的？
        - id: ch01-b21
          speaker: narrator
          text: 妈妈又拿起了笔，已经有点不耐烦。
        - id: ch01-b22
          speaker: anthea
          text: 地毯带我们去了一个不会得百日咳的地方，小羊羔从那以后再没咳过。厨娘太烦人，我们也把她带去了。后来她自己要留下来，给那些野蛮人当女王。他们还把她的帽子当成王冠……
        - id: ch01-b23
          speaker: mother
          text: 小宝贝，你编的故事确实很好听，可我忙得实在顾不上听。
        - id: ch01-b24
          speaker: anthea
          text: 可这都是真的！
          emotion: sad
        - id: ch01-b25
          speaker: mother
          text: 甜心，你不该这样说。
        - id: ch01-b26
          speaker: narrator
          text: 妈妈的语气很温和，可安西娅明白，再说也没用了。
        - id: ch01-b27
          speaker: anthea
          text: 你要离开很久吗？
        - id: ch01-b28
          speaker: mother
          text: 我感冒了，爸爸很担心，小羊羔又在咳嗽。
        - id: ch01-b29
          speaker: anthea
          text: 他从星期六以后，一声也没咳过。
        - id: ch01-b30
          speaker: mother
          text: 但愿我也能相信。爸爸又得去苏格兰。真希望你们几个能乖一点。
        - id: ch01-b31
          speaker: anthea
          text: 我们会乖的，一定会！义卖会是哪天？
        - id: ch01-b32
          speaker: mother
          text: 星期六，就在学校里。好了，小乖乖，别再问了！我的脑袋都转晕了，连百日咳怎么拼都想不起来。
        - id: ch01-b33
          speaker: narrator
          text: 妈妈带小羊羔走了，爸爸也离开了。新厨娘像只受惊的兔子。除了那些她自己认定该害怕的事，孩子们什么也不忍心做，免得再吓着她。
        - id: ch01-b34
          speaker: narrator
          text: 凤凰请大家原谅，说它想安静休息一星期，随后便把金光闪闪的身子藏了起来，谁也找不到。
        - id: ch01-b35
          speaker: narrator
          text: 星期三下午忽然放了半天假，大家一致决定，不带凤凰也要坐地毯出去。妈妈临走时心慌意乱，忽然逼他们答应，晚上六点以后绝不出门，星期六去义卖会除外。那天他们必须穿上最好的衣服，从头到脚洗得干干净净，还要清理指甲。不能用剪刀，剪刀会把指甲刮伤，很不好。得用削扁的木火柴头，那才不会伤到谁的指甲。这份突如其来的承诺，把晚间乘地毯出游的路彻底堵死了。
        - id: ch01-b36
          speaker: jane
          text: 我们去看看小羊羔吧。
        - id: ch01-b37
          speaker: narrator
          text: 可大家都认为，他们要是忽然出现在伯恩茅斯，妈妈就算不昏倒，也会吓得魂飞魄散。四个人坐在地毯上想了又想，眼睛都快想斜了。
        - id: ch01-b38
          speaker: cyril
          text: 我有办法。地毯，请带我们去一个地方，让我们看得见妈妈和小羊羔，他们却看不见我们。
        - id: ch01-b39
          speaker: jane
          text: 小羊羔除外！
        - id: ch01-b40
          speaker: narrator
          text: 上下颠倒的感觉一过去，他们仍坐在地毯上，可地毯已经铺在另一张厚实柔软的地毯上。那是满地棕色松针。头顶全是青翠的松树，一条清澈湍急的小溪在陡岸间拼命奔跑。虽然已经到了十一月，阳光依然明亮。妈妈没戴帽子，就坐在松针地毯上。小羊羔也在那儿，快活得不能再快活，一声也没咳。
        - id: ch01-b41
          speaker: robert
          text: 地毯骗了我们。妈妈一回头，马上就会看见。
        - id: ch01-b42
          speaker: narrator
          text: 可忠实的地毯没有骗人。妈妈转过亲爱的脑袋，直直看向他们，却什么也没看见。
        - id: ch01-b43
          speaker: cyril
          text: 我们隐形了。太好玩了！
          emotion: happy
        - id: ch01-b44
          speaker: narrator
          text: 女孩子们一点也不觉得好玩。妈妈明明看着他们，脸上的神情却丝毫没变，好像他们根本不在那里。这情形实在可怕。
        - id: ch01-b45
          speaker: jane
          text: 我不喜欢。妈妈从来没有这样看过我们。就好像她不爱我们了，好像我们是别人家的孩子，还是不怎么讨人喜欢的那种。她像是根本不在乎能不能看见我们。
          emotion: sad
        - id: ch01-b46
          speaker: anthea
          text: 这感觉真难受。
          emotion: sad
        - id: ch01-b47
          speaker: narrator
          text: 安西娅的眼泪都快出来了。就在这时，小羊羔看见了他们，一头朝地毯扑过来。
        - id: ch01-b48
          speaker: lamb
          text: 潘瑟，我的潘瑟！还有小猫咪，还有西咕噜，还有鲍勃斯！哦，哦！
          emotion: happy
        - id: ch01-b49
          speaker: narrator
          text: 安西娅接住他，亲了又亲，简也一样。谁能忍得住呢？他歪戴着蓝色三角帽，宝贝小脸脏兮兮的，正是大家最熟悉、最喜爱的模样。
        - id: ch01-b50
          speaker: lamb
          text: 我爱你，潘瑟！我也爱你，还有你，你，你！
          emotion: happy
        - id: ch01-b51
          speaker: narrator
          text: 这一刻甜蜜极了，连男孩子们也高兴地拍着小弟弟的背。安西娅忽然看向妈妈。妈妈的脸已经变成惨淡的海绿色，正盯着小羊羔，以为他发了疯。
        - id: ch01-b52
          speaker: mother
          text: 我的小羊羔，我的宝贝！快到妈妈这儿来！
          emotion: fearful
        - id: ch01-b53
          speaker: narrator
          text: 妈妈跳起来，飞快地跑向宝宝。几个隐形的孩子急忙后退，免得她碰到他们。摸到看不见的东西，那种闹鬼似的感觉最吓人。妈妈抱起小羊羔，匆匆走出了松林。
        - id: ch01-b54
          speaker: narrator
          text: 大家痛苦地沉默了好一阵。
        - id: ch01-b55
          speaker: jane
          text: 我们回家吧。感觉就像妈妈不爱我们了。
          emotion: sad
        - id: ch01-b56
          speaker: narrator
          text: 可他们一定要看到妈妈遇见另一位太太，确认她平安无事，才忍心离开。你不能把脸色发绿的妈妈独自留在遥远的松林里，四周一个能帮她的人也没有，自己却乘许愿毯回家，装作什么都没发生。
        - id: ch01-b57
          speaker: narrator
          text: 等妈妈看起来安全了，孩子们才坐回地毯，说了声回家。于是，他们回了家。
        - id: ch01-b58
          speaker: cyril
          text: 我反正不喜欢隐形，至少在自己家人身边不喜欢。要是做王子、强盗或者窃贼，那就另说。
        - id: ch01-b59
          speaker: narrator
          text: 四个孩子都依恋地想着妈妈那张亲爱的、微微发绿的脸。
        - id: ch01-b60
          speaker: jane
          text: 真希望她没有走。她不在家，什么都糟透了。
        - id: ch01-b61
          speaker: anthea
          text: 我觉得，我们应该照妈妈说的去做。我前几天在书里看到，逝者的愿望是神圣的。
        - id: ch01-b62
          speaker: cyril
          text: 那是说人家去了更远的地方，什么印度的珊瑚海岸、格陵兰的冰山之类。伯恩茅斯可不算。再说，我们也不知道妈妈有什么愿望。
        - id: ch01-b63
          speaker: anthea
          text: 她明明说过，希望我们替义卖会弄些印度东西来。不过我知道，她以为我们做不到，只是在玩。
          emotion: sad
        - id: ch01-b64
          speaker: robert
          text: 那我们还是替她弄来吧。星期六一早就去。
        - id: ch01-b65
          speaker: narrator
          text: 到了星期六，他们果然很早就出发了。
        - id: ch01-b66
          speaker: narrator
          text: 凤凰还是不见踪影。孩子们坐上美丽的许愿毯，向它说出了愿望。
        - id: ch01-b67
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 我们想替妈妈的义卖会找些印度东西。请带我们去一个地方，让那里的人送给我们一大堆印度东西，好吗？
        - id: ch01-b68
          speaker: narrator
          text: 听话的地毯把他们的知觉卷走，又在一座闪着白光的印度城镇外还给了他们。只看圆顶和屋顶的形状，他们就知道到了印度。何况还有人骑着大象经过，两个英国士兵沿路走来，说话的口气就像吉卜林先生书里的人物。这下，谁也不会怀疑了。
        - id: ch01-b69
          speaker: narrator
          text: 孩子们把地毯卷了起来，让罗伯特扛在肩上，决定靠自己的双脚走进城里。天气热得很，他们只好又一次脱下伦敦十一月穿的厚外套，把它们全搭在胳膊上。
        - id: ch01-b70
          speaker: narrator
          text: 街道窄窄的，样子陌生。路人的衣裳更陌生，他们说的话最陌生。
        - id: ch01-b71
          speaker: cyril
          text: 一句话也听不懂。我们要怎么开口，请人家捐东西给义卖会？
        - id: ch01-b72
          speaker: jane
          text: 而且他们看起来都很穷，我敢肯定。我们得找一位罗阇什么的。
        - id: ch01-b73
          speaker: narrator
          text: 罗伯特刚要铺开地毯，另外三个赶紧拦住他，求他别白白浪费一次愿望。
        - id: ch01-b74
          speaker: anthea
          text: 我们已经请地毯带我们去一个能弄到印度东西的地方了。它一定会办到。
        - id: ch01-b75
          speaker: narrator
          text: 她果然没有信错。一位缠着包巾、皮肤深褐的先生走过来，深深鞠了一躬。他一开口便说英语，孩子们激动得浑身一震。
        - id: ch01-b76
          speaker: interpreter
          text: 我的拉妮认为，你们是很好小孩。她问你们有没有迷路，也问你们卖不卖这张地毯。她从轿子里看见了你们。你们愿意去见她吗？
        - id: ch01-b77
          speaker: narrator
          text: 孩子们跟着这个陌生人走了。他一笑，露出的牙齿仿佛比普通人多出许多。他领着大家在陌生城镇里转来转去，穿过一条又一条弯弯曲曲的街道，最后来到拉妮的宫殿。
        - id: ch01-b78
          speaker: narrator
          text: 我不准备描写那座宫殿，因为我自己从没亲眼见过，也就不能装作知道。吉卜林先生却真正见过那样的地方，你们想知道宫殿的模样，可以到他的书里去读。不过孩子们进宫以后发生的事，我可是知道得一清二楚。
        - id: ch01-b79
          speaker: narrator
          text: 年老的拉妮坐在一张铺着低矮软垫的椅子上。身边许多女士都穿长裤、戴面纱，浑身的金箔、黄金和珠宝亮闪闪的。缠包巾的先生站在雕花屏风后，替孩子们和女王传话。女王问他们卖不卖地毯。
        - id: ch01-b80
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 不卖。
        - id: ch01-b81
          speaker: rani
          text: 为什么不卖？
        - id: ch01-b82
          speaker: narrator
          text: 简简短地说明了缘故，翻译又把她的话译给女王听。女王说了几句。
        - id: ch01-b83
          speaker: interpreter
          text: 我的女主人说，这个故事很好。请你们从头到尾讲给她听，不必担心花多少时间。
        - id: ch01-b84
          speaker: narrator
          text: 他们只好开讲。这个故事本来就很长，每句话还得讲两遍，西里尔先讲一次，翻译再讲一次。不过西里尔很享受。他越讲越有兴致，把凤凰和地毯的来历、孤塔里的历险，还有厨娘怎样做了女王，一件件讲给大家听。他的措辞不知不觉越来越像《一千零一夜》。拉妮和女士们听着翻译，笑得在肥厚的软垫上东倒西歪。
        - id: ch01-b85
          speaker: narrator
          text: 故事终于讲完。拉妮说了句话，翻译告诉他们，她夸西里尔天生就是讲故事的奇才。接着，女王从颈上取下一串绿松石，抛给了他。
        - id: ch01-b86
          speakers: [jane, anthea]
          ensemble: duo
          text: 啊，真漂亮！
          emotion: surprised
        - id: ch01-b87
          speaker: narrator
          text: 西里尔一连鞠了好几个躬，又清了清嗓子。
        - id: ch01-b88
          speaker: cyril
          text: 请您替我万分感谢她。不过，我更想要一些集市上便宜的小东西。请告诉女王，我们会把东西卖掉，用卖来的钱给没有衣服的穷人买衣裳。
        - id: ch01-b89
          speaker: narrator
          text: 翻译把这番话传过去，女王作了回答。
        - id: ch01-b90
          speaker: interpreter
          text: 女王准许你卖掉她的礼物，再拿所得的钱给赤身裸体的人添衣服。
        - id: ch01-b91
          speaker: cyril
          text: 不，谢谢。这些东西今天就得摆到我们的义卖会上。英国义卖会上的人不会买一串绿松石项链。他们要么当它是假货，要么非追问我们从哪儿拿来的不可。
        - id: ch01-b92
          speaker: narrator
          text: 女王便派人到外面采买精巧漂亮的小东西。过了一阵，仆人们陆续回来，把铜盘、铜壶、雕花器物、布料和许多别的东西，一件接一件地搬进宫殿，全都堆到许愿毯上。
        - id: ch01-b93
          speaker: rani
          text: 看来，我非得借一头大象给你们搬运不可了。
          emotion: happy
        - id: ch01-b94
          speaker: anthea
          text: 女王要是肯借我们一把梳子，再让我们洗洗手脸，就能看见一桩魔法。我们、地毯，还有所有这些东西，会像烟一样突然消失。
        - id: ch01-b95
          speaker: narrator
          text: 女王一听，高兴得拍起手。她借给孩子们一把檀木梳，上面嵌着象牙莲花。大家又用银盆洗干净手脸。西里尔说了一大篇非常客气的告别话，最后突然用一句愿望收了尾。
        - id: ch01-b96
          speaker: cyril
          text: 我希望我们已经到了学校的义卖会上。
        - id: ch01-b97
          speaker: narrator
          text: 他们当然立刻到了。女王和女士们张着嘴，呆呆看着镶嵌花纹的大理石地面。方才还铺着地毯、站着孩子的地方，已经空空如也。
        - id: ch01-b98
          speaker: rani
          text: 这要还不算魔法，世上就再没有魔法了！
          emotion: surprised
        - id: ch01-b99
          speaker: narrator
          text: 女王喜欢极了。从此以后，每到下雨天，宫廷里的女士们就多了一件可以谈论的事。
        - id: ch01-b100
          speaker: narrator
          text: 西里尔把长长的故事从头讲到尾，花了不少时间。等待仆人采买那些漂亮小东西时，孩子们又吃了一顿古怪的甜食，也耽搁了很久。所以，他们回到学校大厅时，煤气灯已经全部点亮。大厅外面，冬日的暮色正悄悄笼罩卡姆登镇一排排房屋。
        - id: ch01-b101
          speaker: cyril
          text: 幸亏我们在印度洗干净了。要是还得先回家擦洗，准会迟得不得了。
        - id: ch01-b102
          speaker: robert
          text: 再说，在印度洗脸暖和多了。我要是住在那里，就不会这么讨厌洗脸。
        - id: ch01-b103
          speaker: narrator
          text: 体贴的地毯把孩子们放在一块昏暗的空地上，正好藏在两个货摊相接的角落后。地面散着细绳和牛皮纸，墙边堆满篮子和箱子。
        - id: ch01-b104
          speaker: narrator
          text: 他们从一个货摊底下往外爬。摊上尽是桌布和垫子，全由那些没正经事可做的太太们精心绣成。孩子们钻到尽头时，碰歪了一块餐具柜罩布，上面很有品位地围着一圈蓝色天竺葵。
        - id: ch01-b105
          speaker: narrator
          text: 两个女孩子悄悄出来了，西里尔也没被发现。可罗伯特刚小心探出头，就被摊主比德尔太太一脚踩住。她那只又大又结实的脚，稳稳压在他那只又小又结实的手上。罗伯特叫了一声，这总不能怪他。
        - id: ch01-b106
          speaker: narrator
          text: 人群马上围了过来。义卖会上很少有人惨叫，所以大家全都兴致勃勃。三个还能自由行动的孩子花了好几秒，才让比德尔太太弄明白，脚下踩的既不是学校大厅的地板，也不是她紧接着猜到的、掉在地上的针插，而是一个受苦孩子的活手。知道自己确实把罗伯特踩疼了，她顿时火冒三丈。真奇怪，一个人不小心伤了别人，发火最厉害的往往还是伤人的那个。
        - id: ch01-b107
          speaker: mrs_biddle
          text: 我当然非常抱歉。出来！你们像蠼螋一样钻在摊子底下，到底想干什么？
          emotion: angry
        - id: ch01-b108
          speaker: robert
          text: 我们在看角落里的东西。
        - id: ch01-b109
          speaker: mrs_biddle
          text: 这么讨厌，还鬼鬼祟祟的，你们一辈子也不会有出息。那儿除了包装纸和灰尘，什么都没有。
          emotion: angry
        - id: ch01-b110
          speaker: jane
          text: 哦，是吗？你也就知道这么多。
        - id: ch01-b111
          speaker: mrs_biddle
          text: 小姑娘，不许无礼！
          emotion: angry
        - id: ch01-b112
          speaker: narrator
          text: 比德尔太太的脸涨成了紫罗兰色。
        - id: ch01-b113
          speaker: cyril
          text: 她不是故意顶嘴。不过那个角落里确实有好东西。
        - id: ch01-b114
          speaker: narrator
          text: 西里尔忽然明白，绝不能当着人群说，那些珍宝都是妈妈捐给义卖会的。别人不会相信。就算相信了，再写信谢谢妈妈，妈妈又会怎么想呢？另外三个也同时想到了。
        - id: ch01-b115
          speaker: miss_peasemarsh
          text: 我倒想看看是什么。
        - id: ch01-b116
          speaker: narrator
          text: 这位女士很和气。答应来帮忙的朋友没来，她正盼着那些东西是迟到的捐赠，好填满自己空荡荡的货摊。她询问似的看向罗伯特。
        - id: ch01-b117
          speaker: robert
          text: 乐意效劳，小事一桩。
        - id: ch01-b118
          speaker: narrator
          text: 罗伯特说完，又钻回比德尔太太的货摊下面。
        - id: ch01-b119
          speaker: mrs_biddle
          text: 你居然还鼓励他，我真想不到。皮斯马什小姐，你知道我一向有话直说，我必须说，这太让我吃惊了。
        - id: ch01-b120
          speaker: mrs_biddle
          text: 这里没有热闹可看。一个非常淘气的小男孩不小心弄伤了自己，不过只是轻伤。请大家散开。让他发现自己成了众人注意的中心，只会使他更加淘气。
        - id: ch01-b121
          speaker: narrator
          text: 人群慢慢散开。安西娅气得一句话也说不出来，却听见一位和善的副牧师开口。
        - id: ch01-b122
          speaker: curate
          text: 可怜的小家伙！
        - id: ch01-b123
          speaker: narrator
          text: 安西娅立刻爱上了这位副牧师，而且一辈子都爱他。随后，罗伯特抱着几件贝拿勒斯铜器和几个镶嵌花纹的檀木盒，从货摊底下扭了出来。
        - id: ch01-b124
          speaker: miss_peasemarsh
          text: 是利伯蒂商店的货！这么说，查尔斯到底没有忘记。
          emotion: happy
        - id: ch01-b125
          speaker: mrs_biddle
          text: 请恕我直言，这些东西放在我的货摊后面。某位不留姓名的捐赠人悄悄做了好事，要是听见你把东西当成自己的，一定会羞红脸。它们当然该归我。
        - id: ch01-b126
          speaker: miss_peasemarsh
          text: 可我的货摊也在这个角落，正好和你的相接。而且我表兄确实答应过……
        - id: ch01-b127
          speaker: narrator
          text: 孩子们侧着身，悄悄退出这场强弱悬殊的争斗，混进人群。他们心里感慨太深，一时说不出话。最后，罗伯特终于骂了出来。
        - id: ch01-b128
          speaker: robert
          text: 那头浆得硬邦邦的母猪！
          emotion: angry
        - id: ch01-b129
          speaker: cyril
          text: 我们费了这么大的劲！我在印度对那位穿长裤的太太讲个不停，嗓子都哑了。
        - id: ch01-b130
          speaker: jane
          text: 那个母猪太太坏透了，坏透了。
          emotion: angry
        - id: ch01-b131
          speaker: anthea
          text: 她确实不怎么好，皮斯马什小姐却又漂亮又和气。谁带了铅笔？
        - id: ch01-b132
          speaker: narrator
          text: 得从三个货摊底下爬过去，路并不短，可安西娅还是去了。角落的垃圾间有一大张淡蓝色纸。她把纸折成方块，每写一个词就舔舔铅笔，让字迹更黑。
        - id: ch01-b133
          speaker: narrator
          text: 她写道，所有印度东西都归又漂亮又和气的皮斯马什小姐的货摊。她本想再写一句，比德尔太太一件也没有，又怕引人怀疑，便改写成一位不知名的贵妇敬赠。写完后，她从木板和支架间爬回伙伴身边。
        - id: ch01-b134
          speaker: narrator
          text: 后来，比德尔太太向义卖会委员会申诉。大家把货摊的一角抬起来挪开，好让胖牧师和沉甸甸的太太们不用爬摊底，也能走进角落。那张蓝纸就这样被发现了。所有耀眼的印度东西都判给了皮斯马什小姐，她把东西全卖掉，得了三十五英镑。
        - id: ch01-b135
          speaker: mrs_biddle
          text: 我真不懂那张蓝纸是怎么来的。依我看，准是疯子写的。居然说你又和气又漂亮，神志正常的人哪会写这种话。
        - id: ch01-b136
          speaker: narrator
          text: 安西娅和简请求帮皮斯马什小姐卖东西，说正是她们的兄弟最先报告了这批货。皮斯马什小姐很愿意。她的摊位原先无人问津，如今挤满顾客，她正庆幸有人帮忙。
        - id: ch01-b137
          speaker: narrator
          text: 孩子们注意到，比德尔太太那边的生意并不多，她一个人完全忙得过来。我希望孩子们没有因此感到高兴。因为即使一个仇人踩伤了你的手，还坚持说全怪你自己淘气，你也应该宽恕她。可我恐怕，他们并没有像应有的那样替她难过。
        - id: ch01-b138
          speaker: narrator
          text: 把货物一件件陈列到摊上，颇费了一番工夫。地毯铺在摊面，深沉的颜色把铜器、银器和象牙器物衬得格外醒目。这个下午又忙又快活。皮斯马什小姐和两个女孩子终于把遥远的印度集市送来的每一件漂亮小东西全卖光了。随后，女孩子们才和男孩子一起去鱼池钓奖品，伸手到麸皮堆里摸彩，还听了纸板乐队、留声机和屏风后面的鸣禽合唱。那些鸣禽，其实只是有人对着玻璃管和水杯吹气。
        - id: ch01-b139
          speaker: narrator
          text: 那位和气的副牧师忽然请他们吃了一顿丰盛的茶点。每个人还没吃到三块蛋糕，皮斯马什小姐也来了。一桌人快活极了，副牧师对谁都亲切得不得了。简后来特意说，连对皮斯马什小姐也是这样。
        - id: ch01-b140
          speaker: narrator
          text: 大家再也吃不下一口时，副牧师正低声和皮斯马什小姐谈着复活节以后的事。
        - id: ch01-b141
          speaker: anthea
          text: 我们该回货摊去了。
        - id: ch01-b142
          speaker: miss_peasemarsh
          text: 已经没什么可回去的啦。多亏你们这些亲爱的孩子，东西全卖光了。
          emotion: happy
        - id: ch01-b143
          speaker: cyril
          text: 可是……还有地毯呢。
        - id: ch01-b144
          speaker: miss_peasemarsh
          text: 别担心地毯。连它也卖掉了。比德尔太太出了十先令，说正好铺在女仆的卧室里。
          emotion: happy
        - id: ch01-b145
          speaker: jane
          text: 才不是。她家的女仆房里根本没铺地毯。我们以前的厨娘在她家做过，是厨娘告诉我们的。
        - id: ch01-b146
          speaker: curate
          text: 请你别说伊丽莎白女王的闲话。
          emotion: happy
        - id: ch01-b147
          speaker: narrator
          text: 皮斯马什小姐笑着望向他，好像从没想过世上会有这么风趣的人。孩子们却全哑了。他们怎么能说地毯是自己的？有谁会把自家的地毯带到义卖会上来呢？
        - id: ch01-b148
          speaker: narrator
          text: 他们这下彻底陷进了悲惨里。不过值得欣慰的是，孩子们没有因为心里悲惨，就把该有的礼貌全忘掉。有时连大人也会因为自己不痛快而忘记礼貌，可大人明明年纪更大，应该比孩子懂事得多。
        - id: ch01-b149
          speakers: [cyril, anthea, robert, jane]
          ensemble: chorus
          text: 谢谢您请我们吃这么好的茶点，也谢谢您一直对我们这么好，还让我们玩得这么开心。
        - id: ch01-b150
          speaker: narrator
          text: 副牧师替他们付了鱼池钓奖品、麸皮堆摸彩、留声机和鸣禽合唱的钱，而且付得痛痛快快，很有男子气概。两个女孩子临走前都拥抱了皮斯马什小姐。孩子们正要离开时，听见副牧师又提起刚才那个关于复活节以后才会发生的话题。
        - id: ch01-b151
          speaker: curate
          text: 他们确实是几个可爱的孩子。可是那件事呢？就定在复活节以后，好不好？快说你答应。
        - id: ch01-b152
          speaker: narrator
          text: 简挣开安西娅的手，又跑了回去。安西娅根本来不及拖住她。
        - id: ch01-b153
          speaker: jane
          text: 你们复活节以后要做什么？
        - id: ch01-b154
          speaker: narrator
          text: 皮斯马什小姐微微一笑，显得漂亮极了。
        - id: ch01-b155
          speaker: curate
          text: 我希望自己要去幸运岛旅行。
        - id: ch01-b156
          speaker: jane
          text: 真希望我们能用许愿毯带你去。
        - id: ch01-b157
          speaker: curate
          text: 谢谢你，可我怕等不及。趁他们还没让我当主教，我一定得先去一次幸运岛。等做了主教，就没有时间啦。
        - id: ch01-b158
          speaker: jane
          text: 我一直觉得，将来应该嫁给一位主教。他的围裙肯定很有用。皮斯马什小姐，你不想嫁给一位主教吗？
        - id: ch01-b159
          speaker: narrator
          text: 这下，大家终于把简拖走了。
        - id: ch01-b160
          speaker: narrator
          text: 被比德尔太太踩伤手的是罗伯特，大家认为最好别让他再去提醒她，免得她又生气。安西娅和简帮过竞争对手卖东西，当然也不会讨她喜欢。
        - id: ch01-b161
          speaker: narrator
          text: 四个人匆匆开了个会，一致认定，比德尔太太大概没有那么讨厌西里尔。于是另外三个混进人群，由他独自上前。
        - id: ch01-b162
          speaker: cyril
          text: 比德尔太太，我们本来就想要那张地毯。您能卖给我们吗？我们愿意出……
        - id: ch01-b163
          speaker: mrs_biddle
          text: 当然不能。走开，小男孩。
        - id: ch01-b164
          speaker: narrator
          text: 她的口气再明白不过，想劝她改变主意，半点希望也没有。西里尔回去找其他人。
        - id: ch01-b165
          speaker: cyril
          text: 没用。她像一头幼崽被抢走的母狮。我们得盯着，看地毯最后送到哪儿。还有，安西娅，不管你怎么说，那本来就是我们的地毯。拿回来不算入室行窃，只能算孤注一掷的营救行动。既英勇，又大胆，还很威风，根本没错。
        - id: ch01-b166
          speaker: narrator
          text: 孩子们继续在快活的人群中游荡，可这里再没有一样东西能让他们开心。鸣禽合唱听来不过是对着玻璃管里的水吹气，留声机只会发出难听的噪音，吵得人连自己说话也听不见。四周的人却还在买那些他们绝不可能用得上的东西。一切都显得愚蠢透顶。
        - id: ch01-b167
          speaker: narrator
          text: 比德尔太太只花十先令，就买走了他们独一无二的许愿毯。整个人生一下变得悲伤、灰暗，仿佛蒙满尘土。空气里又混着煤气微微泄漏的气味、热烘烘的人群味，还有蛋糕和满地碎屑的味道。四个孩子个个都累得要命。
        - id: ch01-b168
          speaker: narrator
          text: 他们找了个看得见地毯的角落，愁眉苦脸地等着，早已过了平日上床的时间。十点钟，顾客终于走光，摊主们却还留下清点钱款。
        - id: ch01-b169
          speaker: robert
          text: 还要没完没了地嚼舌头。我这辈子再也不来义卖会了。我的手肿得像块布丁，她那双可怕靴子上的钉子准有毒。
        - id: ch01-b170
          speaker: official
          text: 现在已经结束了，你们最好回家去。
        - id: ch01-b171
          speaker: narrator
          text: 孩子们走到外面，在煤气路灯下的人行道上等着。衣衫褴褛的孩子们整晚都站在那里听乐队演奏。人行道上满是油腻的泥，四个人站也站不稳，脚底不停地滑来滑去。
        - id: ch01-b172
          speaker: narrator
          text: 比德尔太太终于出来了。她带着一大堆没有卖掉的东西，还有少数刚买来的东西，那张地毯也在其中。她把东西全装上一辆出租马车，自己也坐上车走了。别的摊主都把货物留在学校，等星期一早上再来取。可比德尔太太生怕有人偷走她的东西，所以一件也不肯留下。
        - id: ch01-b173
          speaker: narrator
          text: 孩子们早已绝望，顾不上脚下的泥，也顾不上什么体面。他们紧紧攀在马车后面，一路跟到比德尔太太家。等她和地毯都进了屋，大门也在身后关严，安西娅才开口。
        - id: ch01-b174
          speaker: anthea
          text: 先别入室行窃，我是说，先别开始那场英勇大胆的营救。我们得给她一次机会。按门铃，请求见她吧。
        - id: ch01-b175
          speaker: narrator
          text: 另外三个很不情愿，最后还是答应了。条件是，如果真到了非入室行窃不可的时候，安西娅事后不许再傻乎乎地大惊小怪。
        - id: ch01-b176
          speaker: narrator
          text: 他们先敲门，又按了门铃。一位满脸惊恐的客厅女仆打开大门。孩子们正在请求见比德尔太太，忽然看到她本人就在饭厅里。她早已把桌子推到一边，将地毯铺得平平整整，正仔细端详它铺在房间里的模样。
        - id: ch01-b177
          speaker: jane
          text: 我早知道，她根本不是要把它铺在女仆卧室里。
        - id: ch01-b178
          speaker: narrator
          text: 安西娅径直走过局促不安的女仆身边，其他人紧跟着。比德尔太太背对他们，正用那只踩过罗伯特手掌的靴子抹平地毯。等她发现时，四个孩子已经都进了屋。西里尔急中生智，顺手关上房门。
        - id: ch01-b179
          speaker: mrs_biddle
          text: 是谁呀，简？
        - id: ch01-b180
          speaker: narrator
          text: 她没好气地转过身。一看清来人，她的脸又变成深沉、浓暗的紫罗兰色。
        - id: ch01-b181
          speaker: mrs_biddle
          text: 你们这些又坏又大胆的小东西！这么晚了，怎么还敢闯到我家里？快滚，不然我就叫警察！
          emotion: angry
        - id: ch01-b182
          speaker: anthea
          text: 请别生气。我们只想求您把地毯让给我们。四个人凑在一起有十二先令，而且……
          emotion: calm
        - id: ch01-b183
          speaker: mrs_biddle
          text: 你们怎么敢！
          emotion: angry
        - id: ch01-b184
          speaker: jane
          text: 你现在看起来真难看。
        - id: ch01-b185
          speaker: narrator
          text: 比德尔太太竟然用那只穿靴子的脚狠狠跺地。
        - id: ch01-b186
          speaker: mrs_biddle
          text: 你这个无礼又厚脸皮的小东西！
          emotion: angry
        - id: ch01-b187
          speaker: narrator
          text: 安西娅几乎忍不住想摇晃简。可简全然不管，反倒挤到前面。
        - id: ch01-b188
          speaker: jane
          text: 它真的就是我们育儿室里的地毯。你去问谁都行，大家都会告诉你。
        - id: ch01-b189
          speaker: cyril
          text: 我们许愿回家吧。
        - id: ch01-b190
          speaker: robert
          text: 不行，她也会跟着去，多半还会气疯。这个讨厌鬼，我恨她。
          emotion: angry
        - id: ch01-b191
          speaker: anthea
          text: 我希望比德尔太太现在像天使一样心情好！
        - id: ch01-b192
          speaker: narrator
          text: 安西娅心想，这值得试一试。比德尔太太的脸先从深紫变成紫罗兰色，又变成淡紫，最后成了粉红色。接着，她露出相当爽朗的笑容。
        - id: ch01-b193
          speaker: mrs_biddle
          text: 哎呀，我本来就心情很好呀！这想法真古怪。亲爱的孩子们，我为什么不该心情好呢？
          emotion: happy
        - id: ch01-b194
          speaker: narrator
          text: 地毯又施展了魔法，而且不只影响了比德尔太太。孩子们也忽然觉得自己既善良又快活。
        - id: ch01-b195
          speaker: cyril
          text: 您真是个顶好的人，我现在才看明白。今天在义卖会上惹您生气了，对不起。
        - id: ch01-b196
          speaker: mrs_biddle
          text: 一个字也别再提。亲爱的孩子们，你们这么喜欢这张地毯，当然可以拿走。不，不，我只付了十先令，多一便士也不肯收。
          emotion: happy
        - id: ch01-b197
          speaker: anthea
          text: 您已经在义卖会上买下它，我们却来讨，实在让您为难。可它真是我们育儿室里的地毯，只是和别的东西混在一起，阴差阳错才到了义卖会上。
        - id: ch01-b198
          speaker: mrs_biddle
          text: 真的吗？那可太叫人生气了！好了，亲爱的孩子们，我完全出得起多花的十先令。把地毯拿回去，这件事谁也别再提。走之前吃块蛋糕吧。孩子，我踩了你的手，真对不起。现在不要紧了吗？
        - id: ch01-b199
          speaker: robert
          text: 已经不要紧了，谢谢您。我说，您真的太好了。
        - id: ch01-b200
          speaker: mrs_biddle
          text: 哪里。能让你们这些亲爱的孩子得到一点点快乐，我高兴极了。
          emotion: happy
        - id: ch01-b201
          speaker: narrator
          text: 她帮忙卷起地毯，两个男孩子各抬一头，准备离开。
        - id: ch01-b202
          speaker: anthea
          text: 您真是个宝贝。
          emotion: happy
        - id: ch01-b203
          speaker: narrator
          text: 安西娅和比德尔太太亲热地吻了吻对方。孩子们抬着地毯走上街。
        - id: ch01-b204
          speaker: cyril
          text: 嘿！
          emotion: surprised
        - id: ch01-b205
          speaker: robert
          text: 是啊。最奇怪的是，你会觉得这一切都是真的。我是说，她本来真的就这么好，不只是地毯逼她变和气。
        - id: ch01-b206
          speaker: anthea
          text: 也许那本来就是真的，只是一直被坏脾气、疲倦之类的东西盖住了。地毯把那些东西拿走啦。
        - id: ch01-b207
          speaker: jane
          text: 希望地毯一直别让它们回来。她笑起来一点也不难看。
        - id: ch01-b208
          speaker: narrator
          text: 许愿毯一生创造过许多奇迹。可依我看，比德尔太太这件事才是最神奇的。
        - id: ch01-b209
          speaker: narrator
          text: 从那天起，比德尔太太再也不像以前那么惹人讨厌。漂亮的皮斯马什小姐后来嫁给那位和气的副牧师，比德尔太太还特意送去一把可爱的银茶壶，附上一封亲切的信。婚礼就在复活节过后不久举行，他们去了意大利度蜜月。
