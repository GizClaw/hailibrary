audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带一点英式童话的机智
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明自信，挖苦人时一本正经
        timbre: 清脆的少年声
        pace: 中等偏快
        pitch: 中高
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴敏锐，急切时仍然清楚
        timbre: 柔和明亮的少女声
        pace: 中等
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 坚持己见，认真里常带几分莽撞
        timbre: 结实清朗的少年声
        pace: 中等
        pitch: 中等
    jane:
      display_name: 简
      tts:
        delivery: 天真直率，话里带着小孩子的认真
        timbre: 稚嫩柔软的女孩声
        pace: 稍慢
        pitch: 偏高
    phoenix:
      display_name: 凤凰
      tts:
        delivery: 文雅自负，庄重中带着敏锐的幽默
        timbre: 华美清润，中性而成熟
        pace: 从容
        pitch: 中高
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔能干，管教孩子时明快而坚定
        timbre: 温暖柔和的成年女声
        pace: 中等
        pitch: 中等
    lamb:
      display_name: 小羊羔
      tts:
        delivery: 天真活泼，只会说简单稚嫩的话
        timbre: 软糯清脆的幼儿声
        pace: 稍慢
        pitch: 高
  chapters:
    - id: ch01
      title: 地毯最后的日子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 妈妈头痛，躺在床上休息。安西娅把鸡蛋、烤面包、茶和牛奶一样样放好，又添上茶杯、茶碟、蛋匙、餐刀和黄油。她反复确认没有遗漏，才用十根手指紧紧端住早餐托盘。上楼时，她的脚尖先试探每一级台阶，生怕托盘一歪，毁掉这顿精心准备的早餐。进了妈妈的房间，她悄悄把托盘放到椅子上，只轻轻拉起一扇百叶窗。
        - id: ch01-b02
          speaker: anthea
          text: 亲爱的妈妈，头好一点了吗？我把早饭拿来了，还铺了那块三叶草小布，就是我给你做的那块。
        - id: ch01-b03
          speaker: mother
          text: 真好。
        - id: ch01-b04
          speaker: narrator
          text: 妈妈头痛，又要在床上吃早饭时该怎么照料，安西娅最清楚。她端来温水，往里面滴进恰到好处的古龙水，再用这香喷喷的水替妈妈洗脸洗手。妈妈这才有精神去想早餐。等眼睛也慢慢习惯了亮光，她才发现女儿神色不对。
        - id: ch01-b05
          speaker: mother
          text: 我的姑娘怎么啦？
        - id: ch01-b06
          speaker: anthea
          text: 你病了，我心里真难受。都是那场可怕的火，把你吓成这样。爸爸也这么说。我们总觉得，好像是我们的错。我说不清，可是……
          emotion: sad
        - id: ch01-b07
          speaker: mother
          text: 一点儿也不是你们的错，你这只可爱的小傻鹅。怎么会怪你们呢？
        - id: ch01-b08
          speaker: anthea
          text: 这正是我说不清的地方。我可没有你和爸爸那种“无用”的脑子，能想出办法解释每件事。
        - id: ch01-b09
          speaker: narrator
          text: 妈妈笑了。安西娅本来想说的是“有用”，却说成了“无用”。
        - id: ch01-b10
          speaker: mother
          text: 我这颗“无用”的脑子？你是不是想说“有用”？不管怎样，今天早上它又僵又疼，过一会儿就会好的。别做傻乎乎的小乖乖了，那场火不是你们的错。鸡蛋我不吃了，我想再睡一会儿。你别担心，也告诉厨娘，别来问我吃饭的事。午饭想吃什么，你自己点吧。
        - id: ch01-b11
          speaker: narrator
          text: 安西娅像小老鼠一样轻轻关好门，立刻下楼，真的照自己喜欢的点起午饭。她要了一对火鸡、一大只葡萄干布丁、乳酪小饼，还有杏仁和葡萄干。厨娘听完，只叫她赶快走开。到了午饭时间，桌上照旧只有羊肉碎和粗面粉布丁。羊肉碎该配的烤面包丁忘了放，粗面粉布丁还烤焦了。看来，她刚才就算什么也没点，结果也不会有一点分别。
        - id: ch01-b12
          speaker: narrator
          text: 安西娅回到育儿室，发现其他人也愁眉不展，跟她心里的光景一模一样。大家都知道，地毯的日子已经不多了。它破得太厉害，连剩下的线头都快能一根根数清。近一个月里，他们经历了数不清的魔法奇遇。可眼看着，生活又要照沉闷、平常的老样子继续下去。他们会变得跟卡姆登镇那些普通孩子一样。过去，他们还常常可怜那些孩子，也许还稍微瞧不起他们呢。
        - id: ch01-b13
          speaker: cyril
          text: 我们也要跟他们一样了。
        - id: ch01-b14
          speaker: robert
          text: 可我们记得的东西更多。以后想起那些再也得不到的东西，也会比他们更难过。
        - id: ch01-b15
          speaker: anthea
          text: 妈妈一好起来，就会把地毯送走，换成椰棕席。我们居然要铺椰棕席！可我们明明在那座不会得百日咳的岛上，从真的椰子树下面走过。
        - id: ch01-b16
          speaker: lamb
          text: 漂亮岛岛。沙沙像颜料盒，海亮晶晶，闪呀闪。
        - id: ch01-b17
          speaker: narrator
          text: 哥哥姐姐一直不知道小羊羔还记不记得那座岛，现在总算知道了。
        - id: ch01-b18
          speaker: cyril
          text: 是啊，以后再也不能坐地毯，来一趟便宜的往返旅行了。这事已经定了。
        - id: ch01-b19
          speaker: narrator
          text: 他们嘴里说的是地毯，心里想的却全是凤凰。那只金色的鸟一直那么和善、那么友好、那么有礼貌，又教给他们许多东西。可是，它刚刚烧了一座剧院，还害得妈妈生病。谁也没有责怪它，因为凤凰只是照自己的天性行事。可大家都看得清清楚楚，不能再请它把这次拜访延长下去了。用最直白的话来说，他们必须请凤凰走。
        - id: ch01-b20
          speaker: narrator
          text: 四个孩子觉得自己又像卑鄙的密探，又像背叛朋友的坏蛋。他们各自在心里盘算，究竟谁最不该去告诉凤凰，这个幸福的家里不能再给它留位置了。每个人都很肯定，应该有人光明磊落、勇敢坦率地把话说清楚。可每个人也都认为，那个人最好别是自己。偏偏凤凰就在碗柜里，跟黑甲虫、单只的旧鞋和残缺的棋子待在一起，他们没法照自己的心意，把事情从头到尾痛痛快快商量一遍。
        - id: ch01-b21
          speaker: anthea
          text: 这事太讨厌了。你心里对别人有了想法，却不能说。因为他们一知道你在想什么，就会觉得不好受，还会琢磨自己做了什么，才让你这么想，又会问你为什么这么想。
        - id: ch01-b22
          speaker: narrator
          text: 安西娅一心不让凤凰听懂，结果谁都没听懂。直到她指了指碗柜，西里尔才明白。
        - id: ch01-b23
          speaker: cyril
          text: 最近发生过这一连串事情，我们必须翻开新的一页。归根结底，妈妈比任何低等生物的感受都重要，不管那种生物多么不合天性。
        - id: ch01-b24
          speaker: anthea
          text: 你真会把话搅在一起。我们应该多练练，遇上神秘场合就能用。简，罗伯特，我们说的是那个。
        - id: ch01-b25
          speaker: narrator
          text: 她皱着眉，朝碗柜点头。简和罗伯特总算懂了，刚要说话，安西娅又连忙拦住。
        - id: ch01-b26
          speaker: anthea
          text: 等等。这个游戏就是把话绕来绕去，别人谁也听不懂，只有你想让他懂的人才懂。有时候，连他们也不懂。
        - id: ch01-b27
          speaker: phoenix
          text: 古代的哲人，很懂得你说的这门艺术。
        - id: ch01-b28
          speaker: narrator
          text: 原来凤凰根本不在碗柜里。整个谈话期间，它一直站在檐口，歪着一只金色眼睛看他们。
        - id: ch01-b29
          speaker: lamb
          text: 漂亮鸟鸟！金丝雀鸟鸟！
        - id: ch01-b30
          speaker: phoenix
          text: 可怜的、误入歧途的小婴儿。
        - id: ch01-b31
          speaker: narrator
          text: 屋里出现了一阵难堪的沉默。凤凰那么聪明，孩子们觉得，它很可能已经听懂那些遮遮掩掩的话。再说，他们开口时还一直朝碗柜比画，简直等于替那些暗示加上了图解。
        - id: ch01-b32
          speaker: cyril
          text: 我们刚才只是在说……
        - id: ch01-b33
          speaker: narrator
          text: 西里尔的话没能说完。凤凰打断了他，孩子们反而全松了一口气。
        - id: ch01-b34
          speaker: phoenix
          text: 依我看，你们有一桩生死攸关的消息，要告诉那边那些永远跑来跑去、身份低贱的黑色弟兄。
        - id: ch01-b35
          speaker: narrator
          text: 凤凰伸爪指向黑甲虫居住的碗柜。
        - id: ch01-b36
          speaker: lamb
          text: 金丝雀说话！给妈妈看。
        - id: ch01-b37
          speaker: narrator
          text: 小羊羔欢欢喜喜地从安西娅腿上滑了下去。
        - id: ch01-b38
          speaker: jane
          text: 妈妈睡着了。来，我们到桌子底下的笼子里扮野兽。
        - id: ch01-b39
          speaker: narrator
          text: 大家本想把桌子当成野兽笼子，可小羊羔的脚、手，连同脑袋，一次次深深陷进地毯的破洞。那些洞实在太多，也太大，游戏根本玩不下去。大家只好把充当笼子的桌子挪到旁边的油布地板上。这样一来，破破烂烂的地毯就完全露了出来，所有可怕的窟窿都看得清清楚楚。
        - id: ch01-b40
          speaker: phoenix
          text: 唉，它留在这世上的日子不多了。
        - id: ch01-b41
          speaker: robert
          text: 是啊，什么东西都有完结的一天。真可怕。
        - id: ch01-b42
          speaker: phoenix
          text: 有时候，完结就是安宁。要是这张地毯还不快点迎来结局，它的结局恐怕就是变成碎片。
        - id: ch01-b43
          speaker: cyril
          text: 没错。
        - id: ch01-b44
          speaker: narrator
          text: 西里尔很恭敬地踢了踢地毯的残余。鲜艳的颜色一动，小羊羔马上趴下，伸手揪住红蓝线头。
        - id: ch01-b45
          speaker: lamb
          text: 阿格迪达格迪嘎格迪，达格迪，阿格阿格阿格！
        - id: ch01-b46
          speaker: narrator
          text: 谁都没来得及眨一下眼睛。就算他们当时真想眨眼，那也丝毫无济于事。转眼间，屋子正中的地板已经露出来，像一座光秃秃的木板小岛，四周围着油布的海洋。刚才还摊在那里的魔毯不见了，更可怕的是，坐在上面的小羊羔也不见了。

    - id: ch02
      title: 小羊羔的愿望
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 屋里静得可怕。小羊羔还是个小宝宝，却独自被那张不可靠的魔毯带走了。地毯上满是破洞，也满是魔法。谁也不知道他去了哪里，更没法乘着已经消失的地毯追过去。简放声大哭。安西娅脸色惨白，急得几乎发狂，眼睛却干干的，一滴泪也没有。
        - id: ch02-b02
          speaker: anthea
          text: 这一定是在做梦。
          emotion: fearful
        - id: ch02-b03
          speaker: robert
          text: 那位牧师上次也这么说，可上次不是梦，这次也不是。
          emotion: sad
        - id: ch02-b04
          speaker: cyril
          text: 可小羊羔根本没有许愿。他只是在说胡话。
        - id: ch02-b05
          speaker: phoenix
          text: 地毯听得懂一切语言，包括胡话。我不知道胡话国在什么地方，不过，那里的语言对地毯并不陌生。
        - id: ch02-b06
          speaker: anthea
          text: 那么，他说“阿格里迪达格”，或者不管那是什么时，心里真的有一个意思？
          emotion: fearful
        - id: ch02-b07
          speaker: phoenix
          text: 一切话语都有含义。
        - id: ch02-b08
          speaker: cyril
          text: 这一点我可不赞成。就连说英语的人，有时也会讲些根本没有特别意思的话。
        - id: ch02-b09
          speaker: anthea
          text: 现在别管这个了。你认为“阿格迪达格”对小羊羔和地毯来说，确实有某种意思？
        - id: ch02-b10
          speaker: phoenix
          text: 毫无疑问。对地毯和那个不幸的婴儿来说，它的意思完全相同。
          emotion: calm
        - id: ch02-b11
          speaker: anthea
          text: 可到底是什么意思？到底是什么？
          emotion: fearful
        - id: ch02-b12
          speaker: phoenix
          text: 不幸的是，我从没学过胡话。
        - id: ch02-b13
          speaker: narrator
          text: 简抽泣得很响，其他人却陷入了那种被人称作“绝望的平静”的状态。小羊羔是他们自己最珍爱的小弟弟。他幸福的小小一生里，从来没有一刻离开过爱他的目光。可如今，他独自去了茫茫世界，唯一的同伴和保护者，只是一张满是破洞的地毯。孩子们以前从未真正明白，世界原来大得吓人，而小羊羔可能落在这个世界的任何一个地方。
        - id: ch02-b14
          speaker: cyril
          text: 去找他也没有用。
          emotion: sad
        - id: ch02-b15
          speaker: phoenix
          text: 你们希望他回来吗？
          emotion: surprised
        - id: ch02-b16
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 当然希望！
        - id: ch02-b17
          speaker: phoenix
          text: 他惹的麻烦，不是比他的好处还多吗？
        - id: ch02-b18
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 不，不是！我们真的要他回来！真的！
        - id: ch02-b19
          speaker: phoenix
          text: 那么，请原谅。我这就出去看看能做些什么。
        - id: ch02-b20
          speaker: narrator
          text: 西里尔猛地推开窗，凤凰飞了出去。
        - id: ch02-b21
          speaker: anthea
          text: 但愿妈妈一直睡着。要是她醒来想要小羊羔呢？要是仆人们进来呢？简，别哭了，哭也没有用。我自己没哭。至少你说以前，我还没哭。要是世上还有任何办法，我怎么也不会哭的。哦，哦，哦！
          emotion: fearful
        - id: ch02-b22
          speaker: narrator
          text: 西里尔和罗伯特是男孩子，而男孩子当然从来不哭，至少故事里总是这样说。可眼下的处境实在太可怕了。他们只好绷紧脸，做出种种怪相，竭力让自己表现得像真正的男子汉。就在这最糟糕的时候，妈妈的铃响了。
        - id: ch02-b23
          speaker: narrator
          text: 所有人都屏住呼吸。安西娅擦擦眼睛，抓起拨火棍，递给西里尔。
        - id: ch02-b24
          speaker: anthea
          text: 用力打我的手。我得给妈妈一个理由，解释眼睛为什么红了。再用力一点！
        - id: ch02-b25
          speaker: narrator
          text: 西里尔先用铁柄轻轻碰了一下。安西娅催他，他只好一边发抖，一边鼓起勇气。结果这一下远比他打算的重。
        - id: ch02-b26
          speaker: anthea
          text: 啊！
        - id: ch02-b27
          speaker: cyril
          text: 哦，潘瑟，我真的没想打疼你！
        - id: ch02-b28
          speaker: narrator
          text: 西里尔哐啷一声把拨火棍放回去。安西娅用另一只手捂住伤处，疼得喘不过气。
        - id: ch02-b29
          speaker: anthea
          text: 没关系。已经开始红了。罗伯特，你出去吧。坐到垃圾箱上也行，随便去哪儿。我会告诉妈妈，你和小羊羔出去了。
        - id: ch02-b30
          speaker: narrator
          text: 她手背上果然鼓起一个红蓝色的圆肿包。安西娅现在准备好欺骗妈妈了，能瞒多久就瞒多久。我们都知道，欺骗是很不对的。可在安西娅看来，只要还有一点办法，就应该尽量不让妈妈为小羊羔担惊受怕。这明明是她眼下的责任。何况，凤凰也许能帮上忙。
        - id: ch02-b31
          speaker: robert
          text: 它一直都帮我们。它救我们离开过塔楼。剧院那场火虽然是它惹的，它也把我们平安救出来了。这次它一定也有办法。
        - id: ch02-b32
          speaker: narrator
          text: 妈妈的铃又响了一次。
        - id: ch02-b33
          speaker: anthea
          text: 伊丽莎从来不理铃声，她一向不理。我非去不可了。
        - id: ch02-b34
          speaker: narrator
          text: 安西娅上楼时，心怦怦直跳。妈妈肯定会看出她哭过，好在手上的伤能解释。可小羊羔怎么办？她立刻命令自己，绝不能去想小羊羔。为了让脑子里有别的事情，她使劲咬住舌头，直到疼得眼里重新有了泪。她的手臂、双腿、后背，连那张哭红的脸，都因为一股决心绷得发僵。只要自己办得到，就绝不能让妈妈担心。她轻轻推开门。
        - id: ch02-b35
          speaker: anthea
          text: 妈妈，什么事？
        - id: ch02-b36
          speaker: mother
          text: 亲爱的，小羊羔……
        - id: ch02-b37
          speaker: narrator
          text: 安西娅想说，小羊羔和罗伯特出去了。可她张开嘴，一个字也说不出来，只好一直张着。奇怪的是，嘴巴这样张着，反倒比较容易忍住眼泪。
        - id: ch02-b38
          speaker: mother
          text: 小羊羔起先很乖，后来却把梳妆台罩布扯了下来，刷子和瓶瓶罐罐全掉了。现在他一点儿声音也没有，准是在干什么可怕的淘气事。我躺在这里看不见他。要是下床去看，我一定会晕倒。
        - id: ch02-b39
          speaker: anthea
          text: 你是说，他在这里？
          emotion: surprised
        - id: ch02-b40
          speaker: mother
          text: 他当然在这里。你以为他在哪儿？
        - id: ch02-b41
          speaker: narrator
          text: 安西娅绕过桃花心木大床的床尾，却没看见小羊羔。
        - id: ch02-b42
          speaker: anthea
          text: 他现在不在这儿。
        - id: ch02-b43
          speaker: narrator
          text: 不过，他刚才确实来过，这一点再清楚不过。梳妆台罩布落在地上，瓶瓶罐罐滚得到处都是，刷子和梳子也四散乱躺。它们全都缠进了一大团丝带和花边里。显然，一个敞开的抽屉把里面的宝物交给了宝宝那双好奇的小手。
        - id: ch02-b44
          speaker: mother
          text: 那他一定爬出去了。亲爱的，把他留在你们身边吧。要是睡不成这一觉，等爸爸回家，我就要累垮了。
        - id: ch02-b45
          speaker: narrator
          text: 安西娅轻轻关门，飞奔下楼，冲进育儿室。
        - id: ch02-b46
          speaker: anthea
          text: 他一定许愿要到妈妈身边去。他刚才一直在那儿。“阿格迪达格……”
        - id: ch02-b47
          speaker: narrator
          text: 正像书里常说的，那句不寻常的胡话一下冻结在她唇边。因为地毯已经回来了，就铺在育儿室的地板上。小羊羔安然坐在上面，身边围着两个哥哥和简，凤凰也在。他把凡士林和紫罗兰香粉涂得满脸满身，活像给自己做了一番乔装。不过大家还是一眼就认出了他。
        - id: ch02-b48
          speaker: phoenix
          text: 你说得对。“阿格迪达格”在胡话里，显然就是“我要到妈妈所在的地方去”。忠实的地毯听懂了。
        - id: ch02-b49
          speaker: narrator
          text: 安西娅一把抱起小羊羔，紧紧搂住。
        - id: ch02-b50
          speaker: anthea
          text: 可他是怎么回到这里的？
        - id: ch02-b51
          speaker: phoenix
          text: 我飞去找赛米德，许愿让你们的小弟弟回到你们中间。愿望立刻就实现了。
        - id: ch02-b52
          speaker: anthea
          text: 太好了，太好了！你这个小宝贝！简，别说了。他往我身上蹭掉多少东西，我都不在乎。西里尔，你和罗伯特把地毯卷起来，放进甲虫碗柜。他也许又会说“阿格迪达格”，下回可能是完全不同的意思。来吧，我的小羊羔，潘瑟替你擦一擦。
          emotion: happy
        - id: ch02-b53
          speaker: cyril
          text: 希望甲虫们别许起愿来。

    - id: ch03
      title: 凤凰告别
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两天后，妈妈已经好到能出门了。当天晚上，椰棕席也送到了家。孩子们说了又说，想了又想，还是没找到一个礼貌的办法，告诉凤凰他们不愿让它继续住下去。这两天里，孩子们一直在尴尬中度过，凤凰却一直在睡梦中度过。等椰棕席铺好，它终于醒来，扑扇着翅膀落了上去，又不满意地摇了摇头顶的冠羽。
        - id: ch03-b02
          speaker: phoenix
          text: 我不喜欢这张地毯。它又粗糙又僵硬，弄疼了我的金足。
        - id: ch03-b03
          speaker: cyril
          text: 可我们非得习惯它弄疼我们的金足不可。
        - id: ch03-b04
          speaker: phoenix
          text: 那么，它取代了许愿地毯？
        - id: ch03-b05
          speaker: robert
          text: 是的。如果你说的“取代”，就是它顶替了那张地毯。
        - id: ch03-b06
          speaker: phoenix
          text: 那张魔法织物呢？
        - id: ch03-b07
          speaker: anthea
          text: 明天收破烂和旧瓶子的人会来。他会把它拿走。
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: 凤凰忽然急切起来。它飞上最喜欢的椅背，朝孩子们发表讲话。
        - id: ch03-b09
          speaker: phoenix
          text: 听我说！人类年幼的孩子们，收起你们悲惨绝望的泪水。命中注定的事总要发生。我可不愿几千年以后想起你们时，只记得一群忘恩负义的卑鄙小人，一群由低贱私心捏成的爬虫。
        - id: ch03-b10
          speaker: cyril
          text: 我当然希望你不会。
        - id: ch03-b11
          speaker: phoenix
          text: 不要哭泣，我当真求你们别哭。我不想委婉地把消息慢慢说出来。让这一击立刻落下吧。如今，我必须离开你们的时刻已经到了。
        - id: ch03-b12
          speaker: narrator
          text: 四个孩子同时长长地松了一口气。
        - id: ch03-b13
          speaker: cyril
          text: 我们根本用不着为怎么开口发愁。
        - id: ch03-b14
          speaker: phoenix
          text: 唉，不要这样叹息。天下没有不散的相聚。我必须离开你们，也一直在设法让你们做好准备。唉，千万别支撑不住！
        - id: ch03-b15
          speaker: anthea
          text: 你真的非走不可吗？这么快就走？
        - id: ch03-b16
          speaker: narrator
          text: 这句话，安西娅常听妈妈在下午对来访的太太们说。
        - id: ch03-b17
          speaker: phoenix
          text: 真的非走不可。亲爱的，太感谢你了。
        - id: ch03-b18
          speaker: narrator
          text: 凤凰回答得就像它也是一位来访的太太。
        - id: ch03-b19
          speaker: phoenix
          text: 我累了，也想休息。上一个月发生了那么多事以后，我当真想好好休息。现在，我只求你们最后一桩恩惠。
        - id: ch03-b20
          speaker: robert
          text: 只要是我们办得到的小事。
        - id: ch03-b21
          speaker: narrator
          text: 凤凰一直最喜欢罗伯特。刚才听见凤凰主动提出离开时，他也曾松一口气。可如今真的到了分别的时候，罗伯特心里几乎跟凤凰以为他们大家的心情一样悲惨。
        - id: ch03-b22
          speaker: phoenix
          text: 我只求得到那件原本要给收破烂人的遗物。把地毯剩下的部分交给我，让我走吧。
        - id: ch03-b23
          speaker: anthea
          text: 我们敢这样做吗？妈妈会介意吗？
        - id: ch03-b24
          speaker: phoenix
          text: 为了你们，我冒过天大的险。
        - id: ch03-b25
          speaker: robert
          text: 那好，我们给你。
        - id: ch03-b26
          speaker: narrator
          text: 凤凰欢喜地蓬起全身羽毛。
        - id: ch03-b27
          speaker: phoenix
          text: 金子般心肠的孩子们，你们不会后悔。快把地毯铺开，让我单独待着。不过，先把炉火添旺。等我举行神圣的预备仪式时，你们去准备芬芳的木料和香料，用在最后的诀别上。
        - id: ch03-b28
          speaker: narrator
          text: 孩子们把地毯残余的部分铺开。这明明正是他们一直希望发生的事，可真到了这一刻，每个人的心还是沉了下去。他们往炉火上添了整整半煤斗煤，然后一个接一个走出房间，随手关好门。凤凰终于独自留下来，和那张地毯待在一起。
        - id: ch03-b29
          speaker: robert
          text: 我们得留一个人在门口守着，其他人去买香木和香料。一定买最好的，还要多买一些。别为了三便士左右舍不得。我想好好送它走。只有这样，我们心里才不会那么难受。
        - id: ch03-b30
          speaker: narrator
          text: 大家都认为，罗伯特是凤凰的宠儿，应该让他享有最后这份伤心的安慰，亲自为凤凰的葬身火堆选择材料。
        - id: ch03-b31
          speaker: cyril
          text: 你们愿意的话，我留下守门。我不介意。再说，雨下得很大，我的靴子会进水。你们可以顺路问问，我另外那双现在是不是又“真正可靠”了。
        - id: ch03-b32
          speaker: narrator
          text: 于是，西里尔像一名罗马哨兵，站在紧闭的房门外。门里面，凤凰正在为那场伟大的转变做准备。他不能看见，也不敢离开。其余几个则冒着大雨出了门，要把最后一场悲伤仪式需要的珍贵物品一样样买回来。

    - id: ch04
      title: 最后的火堆
      blocks:
        - id: ch04-b01
          speaker: anthea
          text: 罗伯特说得对，现在不是省钱的时候。先去文具店，买一整包铅笔吧。整包买更便宜。
        - id: ch04-b02
          speaker: narrator
          text: 他们早就想买整整一包铅笔了，只是从前一直舍不得。如今，为心爱的凤凰搭葬身火堆，又要永远和它分别，这样激动人心的大事总算让他们鼓起勇气，肯花这笔奢侈的钱。文具店的人保证，铅笔是货真价实的雪松木。但愿那是真的，因为文具商理应永远说真话。那包铅笔花了一先令四便士。他们又花了七又四分之三便士，买下一只镶着象牙的小檀香木盒。
        - id: ch04-b03
          speaker: anthea
          text: 我知道檀香木很香，烧起来更是香得很。
        - id: ch04-b04
          speaker: robert
          text: 象牙本来一点儿气味也没有，可烧起来准会臭得可怕，跟骨头一样。
        - id: ch04-b05
          speaker: narrator
          text: 到了杂货店，他们把所有叫得出名字的香料都买了一些。肉豆蔻衣弯得像贝壳，丁香像一颗颗钝头钉子，胡椒则有长粒和圆粒两种。还有姜，当然是干姜；表面蒙着美丽白霜、香气扑鼻的肉桂皮；以及多香果和葛缕子籽。后来葛缕子籽烧起来时，那气味简直要命。他们又去药房买了樟脑和薰衣草油，还买了一小袋香料，上面写着“帕尔马紫罗兰”。
        - id: ch04-b06
          speaker: narrator
          text: 回到家，西里尔还在站岗。大家敲敲门，听见凤凰那金灿灿的声音说“进来”，便走进房间。残破的地毯铺在地上，上面有一枚蛋，跟凤凰当初孵出来的那枚一模一样。凤凰围着蛋走了一圈又一圈，欢喜又骄傲地咯咯叫。
        - id: ch04-b07
          speaker: phoenix
          text: 你们看，我把它生下来了。我有生以来生过的蛋里，再没有比这更好的。
          emotion: happy
        - id: ch04-b08
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 没错，真是一枚漂亮的蛋。
        - id: ch04-b09
          speaker: narrator
          text: 孩子们拆开一层层包装纸，把买来的东西全摆到桌上。凤凰舍不得离开那枚蛋，大家劝了好一阵，才让它暂时走开几步，来看看为自己最后一场烈火准备的材料。看清那些铅笔、香木和香料以后，凤凰感动得几乎承受不住。
        - id: ch04-b10
          speaker: phoenix
          text: 我从来没有过比这更华美的葬身火堆。你们绝不会后悔。快写：“去告诉赛米德，实现凤凰最后的愿望，并立刻回来。”
        - id: ch04-b11
          speaker: narrator
          text: 凤凰擦去一滴金色的泪。罗伯特却觉得，纸条应该写得更客气。
        - id: ch04-b12
          speaker: robert
          text: 请去请求赛米德发发慈悲，实现凤凰最后的愿望。劳驾你立刻回来。
        - id: ch04-b13
          speaker: narrator
          text: 纸条别到地毯上，地毯消失了，又在一眨眼间回来。接着，他们再写一张纸条，命令地毯把蛋送到一个地方，让它再过两千年也不会孵化。凤凰忍痛离开刚生下的、心爱的蛋，一直依依不舍地望着它。纸条刚别好，地毯就急忙把自己卷起来，把蛋裹在里面。从此，魔毯和凤凰蛋永远离开了卡姆登镇那座房子的育儿室。
        - id: ch04-b14
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 哦，天哪！哦，天哪！哦，天哪！
          emotion: sad
        - id: ch04-b15
          speaker: phoenix
          text: 振作起来。难道你们以为，我这样离开刚生下的珍贵蛋，心里就不痛苦吗？来吧，克制住感情，替我搭好火堆。
        - id: ch04-b16
          speaker: robert
          text: 哦，我受不了你要走！
          emotion: sad
        - id: ch04-b17
          speaker: narrator
          text: 罗伯特忽然彻底忍不住了。凤凰飞到他肩上，用喙轻轻蹭了蹭他的耳朵。
        - id: ch04-b18
          speaker: phoenix
          text: 少年时的悲伤，很快便会像梦一样遥远。永别了，我心爱的罗伯特。我一直深深爱着你。
          emotion: sad
        - id: ch04-b19
          speaker: narrator
          text: 炉火已经烧得通红。孩子们把香料和香木一样样放进去。有些闻起来很香，有些却臭得难以想象，葛缕子籽和“帕尔马紫罗兰”香袋就是这样。
        - id: ch04-b20
          speaker: phoenix
          text: 永别了，永别了，永别了，永别了！
          emotion: sad
        - id: ch04-b21
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 哦，再见！
          emotion: sad
        - id: ch04-b22
          speaker: narrator
          text: 所有人都哭了。明亮的凤凰绕房间飞了整整七圈，最后落进炉火滚烫的中心。芳香的树胶、香料和木料在它四周腾起火焰，忽明忽暗地跳动，可凤凰的金色羽毛始终没有燃烧。它仿佛一直红热到最深的心脏。随后，就在四个朋友的八只眼睛前，凤凰一下塌落，变成一堆白色灰烬。雪松铅笔和檀香木盒的火焰在灰烬上方相遇，融到了一起。

    - id: ch05
      title: 凤凰最后的礼物
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天，妈妈终于发现旧地毯不见了，便向孩子们问起它的下落。
        - id: ch05-b02
          speaker: mother
          text: 你们究竟把地毯怎么了？
        - id: ch05-b03
          speaker: jane
          text: 我们送给一个非常想要它的人了。那个人的名字，是用一个“P”开头的。
        - id: ch05-b04
          speaker: narrator
          text: 另外几个立刻叫简别再说。
        - id: ch05-b05
          speaker: mother
          text: 哦，反正它连两便士也不值。
        - id: ch05-b06
          speaker: jane
          text: 那个名字用“P”开头的人还说，我们不会吃亏。
        - id: ch05-b07
          speaker: narrator
          text: 别人还没来得及拦，简就把话说完了。
        - id: ch05-b08
          speaker: mother
          text: 我想也是！
        - id: ch05-b09
          speaker: narrator
          text: 可就在当天夜里，一只大箱子送到了家，收件人写着几个孩子的全名。后来伊丽莎怎么也想不起送货的公司叫什么，只知道既不是卡特·帕特森，也不是包裹速递公司。箱子一到，孩子们马上动手。那是一只结实的大木箱，非得用锤子和厨房的拨火棍才撬得开。长钉子被拔出来时吱吱叫，木板硬生生撬脱时也嘎吱作响。
        - id: ch05-b10
          speaker: narrator
          text: 箱子里垫着柔软的纸，上面印着蓝、绿、红、紫各色美丽的中国式图案。揭开纸以后，下面几乎是你想得到的一切可爱东西。当然，我说的是尺寸合理的东西，所以没有汽车、飞行器，也没有纯种战马。那几样东西毕竟装不进木箱。可除此以外，真的差不多什么都有。
        - id: ch05-b11
          speaker: narrator
          text: 那里有孩子们一直想要的玩具、游戏和书，还有巧克力、蜜饯樱桃、颜料盒与照相机。更妙的是，里面还有他们一直想送给爸爸、妈妈和小羊羔，却从来没钱买的所有礼物。孩子们一样样往外拿，几乎每一件都是从前盼望过的。箱子最底下，藏着一根小小的金色羽毛。只有罗伯特看见了。他悄悄捡起来，藏进上衣胸口。那地方过去一次又一次给金色的凤凰做过窝。
        - id: ch05-b12
          speaker: narrator
          text: 罗伯特把羽毛贴身藏好，可等他上床睡觉时，它已经不见了。他再也没有找到。这根在宝箱底下闪过一下的金羽毛，是他最后一次见到凤凰留下的痕迹。
        - id: ch05-b13
          speaker: narrator
          text: 妈妈一直想要的漂亮皮斗篷上，还别着一张纸。上面写着：“作为地毯的回礼。谨致谢意。P。”
        - id: ch05-b14
          speaker: narrator
          text: 你们可以想象，爸爸妈妈把这件事翻来覆去谈了多久。最后，他们认定得到地毯的人准是个疯疯癫癫的百万富翁，喜欢假扮成收破烂的人取乐。奇怪的是，孩子们竟然完全说不出那个人长什么模样，这仿佛更证明大人猜得有道理。不过，孩子们知道得更清楚。他们知道爸爸妈妈猜错了。
        - id: ch05-b15
          speaker: narrator
          text: 孩子们知道事情的真相。神通广大的赛米德实现了凤凰最后的愿望，箱子就是凤凰用地毯换给他们的谢礼。里面那些灿烂、可爱、盼望已久的珍宝，不只替地毯付清了代价，也完成了凤凰的告别。这只宝箱，才真正是《凤凰与地毯》彻彻底底、完完全全的结局。
