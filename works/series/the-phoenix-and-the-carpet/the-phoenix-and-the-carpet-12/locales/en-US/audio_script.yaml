  chapters:
    - id: ch01
      title: THE END OF THE END
      blocks:
        - id: ch01-b01
          speaker: anthea
          text: >-
            Egg, toast, tea, milk, cup and saucer, egg spoon, knife, butter. Yes, I think that's everything.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Anthea gave Mother's breakfast tray one last look. Then she carried it upstairs with great care, feeling for each step with her toes and gripping the tray with every finger. She crept into Mother's room, set the tray on a chair, and gently raised one blind.
        - id: ch01-b03
          speaker: anthea
          text: >-
            Is your head any better, Mammy dear? I've brought your brekkie. I used the little cloth with clover leaves, the one I made for you.
        - id: ch01-b04
          speaker: narrator
          text: >-
            This was the special soft voice Anthea kept for Mother's headaches.
        - id: ch01-b05
          speaker: mother
          text: >-
            That's very nice.
          emotion: calm
        - id: ch01-b06
          speaker: narrator
          text: >-
            Mother still sounded sleepy. Anthea knew exactly how to care for a mother with a headache who was having breakfast in bed. She fetched warm water, added just enough eau de Cologne, and bathed Mother's face and hands with the sweet-smelling water. After that, Mother could think about breakfast. Once her eyes had grown used to the light, she looked at Anthea.
        - id: ch01-b07
          speaker: mother
          text: >-
            But what's wrong with my girl?
        - id: ch01-b08
          speaker: anthea
          text: >-
            Oh, I'm so sorry you're ill. Father says it was that horrible fire and the fright you had. We all feel somehow as if it was our fault. I can't explain it, but...
          emotion: sad
        - id: ch01-b09
          speaker: mother
          text: >-
            It wasn't your fault at all, you darling goosie. How could it be?
          emotion: calm
        - id: ch01-b10
          speaker: anthea
          text: >-
            That's what I can't tell you. I haven't got a futile brain like you and Father, so I can't think of ways to explain everything.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Mother laughed.
        - id: ch01-b12
          speaker: mother
          text: >-
            My futile brain? Did you mean fertile? Whichever it is, it feels stiff and sore this morning. I'll be all right later. Don't be silly, pet. The fire wasn't your fault. No, dear, I don't want the egg. I think I'll sleep again. Don't worry, and tell Cook not to bother me about meals. You may order whatever you like for lunch.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Anthea closed the door as quietly as a mouse. Then she went straight downstairs and ordered exactly what she liked. She asked for two turkeys, a large plum pudding, cheesecakes, and almonds and raisins. Cook told her to run along. Anthea might as well have ordered nothing. When lunchtime came, there were no turkeys or cheesecakes. There was only hashed mutton, and Cook had forgotten its sippets. The semolina pudding was burnt as well.

            When Anthea joined the others, they were as gloomy as she was. Everyone knew the carpet's days were numbered. It was so worn that they could almost have counted its threads. After nearly a month of magic, ordinary life was coming back. Jane, Robert, Anthea, and Cyril would soon be just like all the other children in Camden Town, whom they had often pitied and perhaps looked down on a little.
        - id: ch01-b14
          speaker: cyril
          text: >-
            We'll be just like them.
        - id: ch01-b15
          speaker: robert
          text: >-
            Except we'll have more things to remember, and more things to be sorry we've lost.
        - id: ch01-b16
          speaker: anthea
          text: >-
            Mother will send the carpet away as soon as she's well enough to arrange that coconut matting. Imagine coconut matting for us! We've walked under real coconut trees on that island where nobody can catch whooping cough.
        - id: ch01-b17
          speaker: lamb
          text: >-
            Pretty island. Paint-box sand, and the sea all shiny-sparkly.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The older children had often wondered whether the Lamb remembered the island. Now they knew.
        - id: ch01-b19
          speaker: cyril
          text: >-
            Yes. No more cheap return trips by carpet for us. That's certain.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Every word they said was about the carpet, but all their thoughts were about the Phoenix. The golden bird had been so kind and friendly. It had always been polite, and it had taught them so much. Now it had set a theater on fire and made Mother ill.

            No one blamed the Phoenix. It had behaved in a perfectly natural way. Still, everyone could see that they must not ask it to make its visit any longer. To put it in plain English, they had to ask it to go. The four children felt like base spies and faithless friends. Inside, each child was busy deciding which of the others ought not to be given such a painful task. They all believed that someone should speak honestly and bravely, but no one wanted to be that someone.

            They could not discuss it properly because the Phoenix was supposed to be in the cupboard. It was in there among the black beetles, odd shoes, and broken chessmen, or so they believed. Anthea tried anyway.
        - id: ch01-b21
          speaker: anthea
          text: >-
            It's horrid when you're thinking things about someone, but you can't say what you're thinking because they'd wonder what they'd done, and why you were thinking those things, and then they'd feel awful.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Anthea was so anxious not to be understood by the Phoenix that no one understood her. Then she pointed at the cupboard, and Cyril caught her meaning. Jane and Robert were still telling each other how thoroughly they had failed to understand.
        - id: ch01-b23
          speaker: cyril
          text: >-
            Yes. After all these recent eventfulnesses, we must turn over a new leaf. Mother matters more than the feelings of any lower form of creation, however unnatural.
        - id: ch01-b24
          speaker: anthea
          text: >-
            You mix things up beautifully. That's what I mean. We should practice, in case we ever need to be mysterious. We're talking about that.
        - id: ch01-b25
          speaker: narrator
          text: >-
            She frowned and nodded toward the Phoenix's cupboard. At last Jane and Robert understood. They both opened their mouths.
        - id: ch01-b26
          speaker: anthea
          text: >-
            Wait. The game is to twist what you mean so no one understands except the people you want to understand. Sometimes even they shouldn't understand.
        - id: ch01-b27
          speaker: phoenix
          text: >-
            The ancient philosophers understood that art very well.
        - id: ch01-b28
          speaker: narrator
          text: >-
            The Phoenix had not been in the cupboard at all. It had watched the entire conversation from the cornice with one golden eye.
        - id: ch01-b29
          speaker: lamb
          text: >-
            Pretty dickie! Canary dickie!
          emotion: happy
        - id: ch01-b30
          speaker: phoenix
          text: >-
            Poor, misguided infant.
        - id: ch01-b31
          speaker: narrator
          text: >-
            An uncomfortable silence followed. The children feared that the Phoenix, which was certainly intelligent, had understood their hidden meaning and all those gestures toward the cupboard.
        - id: ch01-b32
          speaker: cyril
          text: >-
            We were only saying...
        - id: ch01-b33
          speaker: narrator
          text: >-
            Perhaps Cyril meant to tell the truth. He never got the chance. The Phoenix interrupted, and everyone felt relieved.
        - id: ch01-b34
          speaker: phoenix
          text: >-
            I gather you have fatal news for our degraded black brothers, those creatures forever running to and fro in there.
        - id: ch01-b35
          speaker: narrator
          text: >-
            It pointed one claw toward the beetles' cupboard.
        - id: ch01-b36
          speaker: lamb
          text: >-
            Canary talk! Go show Mammy.
          emotion: happy
        - id: ch01-b37
          speaker: narrator
          text: >-
            The Lamb wriggled off Anthea's lap.
        - id: ch01-b38
          speaker: jane
          text: >-
            Mammy's asleep. Come and be wild animals in a cage under the table.
        - id: ch01-b39
          speaker: narrator
          text: >-
            But the Lamb kept catching his hands, feet, and even his head in the holes in the carpet. They had to move the table onto the linoleum. The carpet lay uncovered, with every dreadful hole on display.
        - id: ch01-b40
          speaker: phoenix
          text: >-
            Ah. It has not long to remain in this world.
        - id: ch01-b41
          speaker: robert
          text: >-
            No. Everything ends. It's awful.
          emotion: sad
        - id: ch01-b42
          speaker: phoenix
          text: >-
            An ending can sometimes bring peace. Unless this one comes soon, I believe your carpet's ending will be pieces.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Cyril respectfully kicked the little that remained. Its bright colors moved, catching the Lamb's eye. He dropped onto all fours and tugged at the red and blue threads.
        - id: ch01-b44
          speaker: lamb
          text: >-
            Aggedydaggedygaggedy! Daggedy ag ag ag!
        - id: ch01-b45
          speaker: narrator
          text: >-
            Before anyone could have blinked, even if blinking could have helped, the center of the floor was bare. Boards made an island inside a sea of linoleum. The magic carpet had vanished, and so had the Lamb.

            A terrible silence filled the room. The Lamb, their baby, had gone away alone on an unreliable carpet full of holes and magic. No one knew where he was, and with the carpet gone, no one could follow. Jane burst into tears. Anthea was pale and frantic, but her eyes were dry.
        - id: ch01-b46
          speaker: anthea
          text: >-
            It must be a dream.
          emotion: fearful
        - id: ch01-b47
          speaker: robert
          text: >-
            That's what the clergyman said. It wasn't a dream then, and this isn't one now.
          emotion: sad
        - id: ch01-b48
          speaker: cyril
          text: >-
            But the Lamb didn't make a wish. He was only talking Bosh.
        - id: ch01-b49
          speaker: phoenix
          text: >-
            The carpet understands every kind of speech, including Bosh. I do not know the land of Bosh, but its language is clearly familiar to the carpet.
        - id: ch01-b50
          speaker: anthea
          text: >-
            Do you mean that when he said "Agglety dag," or whatever it was, he actually meant something?
          emotion: fearful
        - id: ch01-b51
          speaker: phoenix
          text: >-
            All speech has meaning.
        - id: ch01-b52
          speaker: cyril
          text: >-
            I think you're wrong there. Even people speaking English sometimes say things that mean nothing in particular.
        - id: ch01-b53
          speaker: anthea
          text: >-
            Never mind that now! You think "Aggety dag" meant the same thing to him and to the carpet?
          emotion: fearful
        - id: ch01-b54
          speaker: phoenix
          text: >-
            Without question. The carpet understood exactly what the unfortunate infant meant.
          emotion: calm
        - id: ch01-b55
          speaker: anthea
          text: >-
            Then what did he mean? Oh, what?
          emotion: fearful
        - id: ch01-b56
          speaker: phoenix
          text: >-
            Unfortunately, I never studied Bosh.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Jane sobbed aloud. The others had reached that strange stillness sometimes called the calmness of despair. The Lamb was gone. Their own precious baby brother had never spent one happy moment beyond the sight of loving eyes. Now he had gone out into the enormous world alone. His only companion and protector was a carpet full of holes. Until then, the children had never understood how very large the world was. The Lamb might be anywhere in it.
        - id: ch01-b58
          speaker: cyril
          text: >-
            There's no use even trying to look for him.
          emotion: sad
        - id: ch01-b59
          speaker: narrator
          text: >-
            Cyril said flatly what all of them were thinking.
        - id: ch01-b60
          speaker: phoenix
          text: >-
            Do you wish the infant to return?
          emotion: surprised
        - id: ch01-b61
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Of course we do!
        - id: ch01-b62
          speaker: phoenix
          text: >-
            Is he not more trouble than he is worth?
        - id: ch01-b63
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            No! We want him back. We truly do!
          emotion: fearful
        - id: ch01-b64
          speaker: phoenix
          text: >-
            Then, if you will excuse me, I shall pop out and see what can be done.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Cyril threw open the window, and the Phoenix flew out.
        - id: ch01-b66
          speaker: anthea
          text: >-
            Oh, if only Mother keeps sleeping! Suppose she wakes and asks for the Lamb. Suppose the servants come. Jane, stop crying. It can't help. No, I'm not crying. At least I wasn't until you said I was. And I wouldn't cry at all if there were one single thing we could do. Oh, oh, oh!
          emotion: fearful
        - id: ch01-b67
          speaker: narrator
          text: >-
            Cyril and Robert were boys, and boys never cry, of course. Even so, the position was dreadful. It is no wonder that their faces twisted strangely while they struggled to behave in what they considered a truly manly way.

            At that awful moment, Mother's bell rang. The children went breathlessly still. Then Anthea dried her eyes, looked around, and picked up the poker. She held its iron handle toward Cyril.
        - id: ch01-b68
          speaker: anthea
          text: >-
            Hit my hand hard. I need a reason for Mother when she sees my eyes. Harder!
        - id: ch01-b69
          speaker: narrator
          text: >-
            Cyril tapped her gently. Then, shaking with distress, he forced himself to strike harder and hit far harder than he meant to. Anthea screamed.
        - id: ch01-b70
          speaker: cyril
          text: >-
            Oh, Panther! I truly didn't mean to hurt you.
          emotion: fearful
        - id: ch01-b71
          speaker: narrator
          text: >-
            He dropped the poker noisily back into the fender.
        - id: ch01-b72
          speaker: anthea
          text: >-
            It's all right. It's getting red.
        - id: ch01-b73
          speaker: narrator
          text: >-
            She clutched the injured hand with the other one. A round red-and-blue bump was rising on its back.
        - id: ch01-b74
          speaker: anthea
          text: >-
            Robert, go outside. Sit on the dustbin, or anywhere. I'll tell Mother you and the Lamb are out.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Anthea was now prepared to deceive Mother for as long as she possibly could. We know that deceit is wrong. Yet to Anthea, keeping Mother from being frightened about the Lamb seemed like a plain duty. She would hide the truth until hiding it became impossible. Besides, the Phoenix might still help them.
        - id: ch01-b76
          speaker: robert
          text: >-
            It has always helped us. It rescued us from the tower. Even after it started the theater fire, it got us safely out. I'm sure it will manage somehow.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Mother's bell rang again.
        - id: ch01-b78
          speaker: anthea
          text: >-
            Eliza hasn't answered. She never does. I have to go.
        - id: ch01-b79
          speaker: narrator
          text: >-
            Anthea's heart thumped as she climbed the stairs. Mother would notice her eyes, but the injured hand would explain those. The Lamb was harder.

            Anthea told herself not to think about him. She bit her tongue until her eyes watered, just to give herself something else to think about. Her arms, legs, and back felt stiff with her determination not to worry Mother. Even her tear-reddened face felt stiff. She opened the door softly.
        - id: ch01-b80
          speaker: anthea
          text: >-
            Yes, Mother?
        - id: ch01-b81
          speaker: mother
          text: >-
            Dearest, the Lamb...
        - id: ch01-b82
          speaker: narrator
          text: >-
            Anthea tried to say that Robert and the Lamb had gone out. Perhaps she tried too hard. No words came when she opened her mouth, so she simply stood there with it open. Somehow that made it easier not to cry.
        - id: ch01-b83
          speaker: mother
          text: >-
            The Lamb was good at first. Then he pulled the cover off my dressing table, brushes and pots and everything. Now he's so quiet that I'm sure he's doing something dreadful. I can't see him from bed, and if I got up to look, I know I'd faint.
        - id: ch01-b84
          speaker: anthea
          text: >-
            Do you mean he's here?
          emotion: surprised
        - id: ch01-b85
          speaker: mother
          text: >-
            Of course he's here. Where did you think he was?
        - id: ch01-b86
          speaker: narrator
          text: >-
            Mother sounded a little impatient. Anthea walked around the foot of the large mahogany bed and stopped.
        - id: ch01-b87
          speaker: anthea
          text: >-
            He isn't here now.
        - id: ch01-b88
          speaker: narrator
          text: >-
            He had certainly been there. The dressing-table cover lay on the floor, and all its pots and bottles had gone with it. Brushes and combs had wandered in every direction. They were mixed up with a tangle of ribbons and lace that the baby's curious fingers had pulled from an open drawer.
        - id: ch01-b89
          speaker: mother
          text: >-
            Then he must have crept out. Please keep him with you, darling. If I don't sleep, I'll be a wreck when Father comes home.
        - id: ch01-b90
          speaker: narrator
          text: >-
            Anthea quietly closed the door. Then she raced downstairs and burst into the nursery.
        - id: ch01-b91
          speaker: anthea
          text: >-
            He must have wished to be with Mother! He was there all along. "Aggety dag" must have...
        - id: ch01-b92
          speaker: narrator
          text: >-
            The strange words froze on her lips, as people say in books. The carpet lay on the floor again. The Lamb sat right in the middle of it, surrounded by his brothers and Jane. He had covered his face and clothes with petroleum jelly and violet powder. In spite of this disguise, he was easy to recognize. The Phoenix was there too.
        - id: ch01-b93
          speaker: phoenix
          text: >-
            You were correct. Clearly, "Aggety dag" is Bosh for "I want to be where my mother is," and the faithful carpet understood.
        - id: ch01-b94
          speaker: narrator
          text: >-
            Anthea swept up the Lamb and hugged him.
        - id: ch01-b95
          speaker: anthea
          text: >-
            But how did he come back here?
        - id: ch01-b96
          speaker: phoenix
          text: >-
            I flew to the Psammead and wished for your infant brother to be restored to you. It happened at once.
        - id: ch01-b97
          speaker: anthea
          text: >-
            Oh, I'm so glad! You darling! Jane, stop that. I don't care how much of this mess rubs off on me. Cyril, you and Robert roll up the carpet and put it in the beetle cupboard. He might say "Aggety dag" again, and next time it could mean something completely different. Come along, my Lamb. Panther will clean you up a little.
          emotion: happy
        - id: ch01-b98
          speaker: cyril
          text: >-
            I hope the beetles don't start making wishes.
        - id: ch01-b99
          speaker: narrator
          text: >-
            Two days later, Mother was well enough to go out. That evening the coconut matting arrived. The children had talked and talked, then thought and thought. Still, none of them had found a polite way to tell the Phoenix that they no longer wanted it to stay. Those two days passed in a peculiar way. The children spent them in embarrassment, while the Phoenix spent them asleep.

            When the new matting had been laid, the Phoenix woke and fluttered down onto it. The bird shook its crested head.
        - id: ch01-b100
          speaker: phoenix
          text: >-
            I do not care for this carpet. It is hard and unyielding, and it hurts my golden feet.
        - id: ch01-b101
          speaker: cyril
          text: >-
            Well, we've jolly well got to get used to it hurting our golden feet.
        - id: ch01-b102
          speaker: phoenix
          text: >-
            Then this has replaced the Wishing Carpet?
        - id: ch01-b103
          speaker: robert
          text: >-
            Yes, if that's what you mean by replaced it.
        - id: ch01-b104
          speaker: phoenix
          text: >-
            And what will become of the magic web?
        - id: ch01-b105
          speaker: anthea
          text: >-
            The rag-and-bottle man comes tomorrow. He'll take it away.
          emotion: sad
        - id: ch01-b106
          speaker: narrator
          text: >-
            The Phoenix flew up to its favorite place on the back of a chair.
        - id: ch01-b107
          speaker: phoenix
          text: >-
            Hear me, young children of men! Hold back your tears of misery and despair. What must be, must be. I would not wish to remember you thousands of years from now as vile ingrates and crawling worms made entirely of selfishness.
        - id: ch01-b108
          speaker: cyril
          text: >-
            I should certainly hope not.
        - id: ch01-b109
          speaker: phoenix
          text: >-
            Do not weep. I truly beg you not to. I will not soften the news. Let the blow fall at once. The time has come for me to leave you.
        - id: ch01-b110
          speaker: narrator
          text: >-
            All four children let out one long sigh of relief.
        - id: ch01-b111
          speaker: cyril
          text: >-
            So we needn't have worried about how to tell it.
        - id: ch01-b112
          speaker: phoenix
          text: >-
            Ah, do not sigh like that. Every meeting ends in parting. I must leave, though I have tried to prepare you. Please, do not give way!
          emotion: calm
        - id: ch01-b113
          speaker: anthea
          text: >-
            Must you really leave so soon?
        - id: ch01-b114
          speaker: narrator
          text: >-
            Anthea had often heard Mother say that to ladies who called in the afternoon.
        - id: ch01-b115
          speaker: phoenix
          text: >-
            I really must. Thank you so much, dear. I am weary. After everything that has happened during this last moon, I truly long to rest. I ask only one final favor.
        - id: ch01-b116
          speaker: robert
          text: >-
            We'll do any little thing we can.
        - id: ch01-b117
          speaker: narrator
          text: >-
            Now that parting had truly arrived, Robert felt nearly as miserable as the Phoenix believed they all were. He had always been the bird's favorite.
        - id: ch01-b118
          speaker: phoenix
          text: >-
            I ask only for the relic meant for the rag-and-bottle man. Give me what remains of the carpet, and let me go.
        - id: ch01-b119
          speaker: anthea
          text: >-
            Dare we do that? Would Mother mind?
        - id: ch01-b120
          speaker: phoenix
          text: >-
            I have dared greatly for your sake.
        - id: ch01-b121
          speaker: robert
          text: >-
            Then we'll do it.
        - id: ch01-b122
          speaker: narrator
          text: >-
            The Phoenix joyfully puffed out its feathers.
        - id: ch01-b123
          speaker: phoenix
          text: >-
            Children with hearts of gold, you will not regret this. Quickly, spread out the carpet and leave me alone. First, build the fire high. Then, while I perform the sacred preparations, gather sweet-smelling woods and spices for our final parting.
        - id: ch01-b124
          speaker: narrator
          text: >-
            The children spread out what remained of the carpet. The Phoenix had solved their impossible problem for them, and this was exactly what they had hoped would happen. Even so, every heart was sad. They piled half a scuttle of coal onto the fire. Then they went out, shut the nursery door, and left the Phoenix alone with the carpet at last.
        - id: ch01-b125
          speaker: robert
          text: >-
            One of us should stand guard while the others buy the sweet woods and spices. Get the best things money can buy, and plenty of them. Don't worry over a few pennies. I want the Phoenix to have a splendid send-off. It's the only thing that will make us feel less horrible inside.
        - id: ch01-b126
          speaker: narrator
          text: >-
            Since Robert was the Phoenix's special favorite, everyone agreed that he should have the last sad pleasure of choosing the things for its funeral fire.
        - id: ch01-b127
          speaker: cyril
          text: >-
            I'll keep watch. I don't mind. Besides, it's pouring, and my boots leak. You can ask whether my other pair is "really reliable" again yet.
        - id: ch01-b128
          speaker: narrator
          text: >-
            They left Cyril standing like a Roman guard outside the closed door. On the other side, the Phoenix was preparing itself for the great change. Robert, Anthea, and Jane went out into the rain to buy precious things for the final sad ceremony.
        - id: ch01-b129
          speaker: anthea
          text: >-
            Robert is right. This isn't the time to save our money. Let's start at the stationer's and buy a whole packet of lead pencils. They cost less by the packet.
        - id: ch01-b130
          speaker: narrator
          text: >-
            Buying a whole packet of pencils was something they had always longed to do. Until now, they had never dared such extravagance. It took the excitement of a funeral fire and farewell to a beloved Phoenix to give them courage. The people in the stationer's shop promised that the pencils were made of real cedar. One hopes that was true, because people who sell stationery ought to speak the truth. The packet cost one shilling and fourpence. The children also spent sevenpence and three farthings on a small sandalwood box inlaid with ivory.
        - id: ch01-b131
          speaker: anthea
          text: >-
            I know sandalwood smells sweet. When it burns, it smells sweeter still.
        - id: ch01-b132
          speaker: robert
          text: >-
            Ivory doesn't smell at all now, but I expect it smells horribly vile when it burns. Like bones.
        - id: ch01-b133
          speaker: narrator
          text: >-
            At the grocer's they bought every spice whose name they could remember. There was mace shaped like delicate shells and cloves that looked like blunt little nails. They bought two sorts of peppercorns, the long kind and the round kind. They chose dry ginger and fragrant cinnamon wrapped in beautiful shells with a soft bloom over them. They added allspice and caraway seeds, though the caraway smelled deadly when the time came to burn it.

            Next they visited the chemist. There they bought camphor and oil of lavender. They also chose a small scent sachet with "Violettes de Parme" written on its label. Then they carried all their parcels home and found Cyril still at his post. They knocked on the nursery door. Only when the Phoenix's golden voice called for them to enter did they go in.

            What remained of the carpet lay spread across the floor. On it rested an egg exactly like the one from which the Phoenix had hatched. The Phoenix was walking around and around this egg. As it went, it clucked with pride and delight.
        - id: ch01-b134
          speaker: phoenix
          text: >-
            There it is. I have laid as fine an egg as any in all my life.
          emotion: happy
        - id: ch01-b135
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Yes, it is beautiful.
        - id: ch01-b136
          speaker: narrator
          text: >-
            The children took every purchase out of its paper and arranged the whole collection on the table. The Phoenix did not want to leave its new egg, even for a moment. At last they persuaded it to come and inspect the materials for its final fire. The sight quite overwhelmed the bird.
        - id: ch01-b137
          speaker: phoenix
          text: >-
            Never have I had a finer funeral fire than this one will be. You will not regret your kindness.
          emotion: happy
        - id: ch01-b138
          speaker: narrator
          text: >-
            The Phoenix wiped away one golden tear.
        - id: ch01-b139
          speaker: phoenix
          text: >-
            Write this at once. "Go and tell the Psammead to fulfill the Phoenix's last wish, and return immediately."
        - id: ch01-b140
          speaker: narrator
          text: >-
            Robert wanted to be polite. Instead of copying the Phoenix's order, he wrote, "Please go and ask the Psammead to be so kind as to fulfill the Phoenix's last wish, and come straight back, if you please." He pinned the paper to the carpet. It vanished and returned in the blink of an eye.

            Then they wrote a second note. This one ordered the carpet to carry the egg somewhere it could not hatch for another two thousand years. The Phoenix had to tear itself away from its cherished egg. It watched with tender longing as the paper was pinned down. At once, the carpet hurriedly rolled itself around the egg. Then carpet and egg vanished forever from the nursery in the Camden Town house.
        - id: ch01-b141
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Oh, dear! Oh, dear! Oh, dear!
          emotion: sad
        - id: ch01-b142
          speaker: phoenix
          text: >-
            Bear up! Do you imagine I do not suffer, torn from my precious new-laid egg? Come, master your feelings and build my fire.
        - id: ch01-b143
          speaker: robert
          text: >-
            Oh! I can't bear for you to go!
          emotion: sad
        - id: ch01-b144
          speaker: narrator
          text: >-
            Robert broke down completely. The Phoenix perched on his shoulder and gently rubbed its beak against his ear.
        - id: ch01-b145
          speaker: phoenix
          text: >-
            The griefs of childhood soon seem no more than dreams. Farewell, Robert of my heart. I have loved you well.
          emotion: sad
        - id: ch01-b146
          speaker: narrator
          text: >-
            By then the fire had burned down to a deep red glow. One by one, the children laid the spices and sweet woods upon it. Some gave off the lovely scents they had expected. Others did not. The caraway seeds and the Violettes de Parme sachet smelled worse in the flames than anyone could have imagined possible.
        - id: ch01-b147
          speaker: phoenix
          text: >-
            Farewell, farewell, farewell, farewell!
          emotion: sad
        - id: ch01-b148
          speakers: [robert, cyril, anthea, jane]
          ensemble: chorus
          text: >-
            Oh, goodbye!
          emotion: sad
        - id: ch01-b149
          speaker: narrator
          text: >-
            Now every one of them was crying. The bright bird lifted its wings and flew seven times around the room. Then it settled into the hot heart of the fire. The sweet gums, spices, and woods flared and flickered all around it, but its golden feathers did not burn. Instead, the Phoenix seemed to grow red-hot, all the way through to its very heart. Then, before the eight eyes of its four friends, it fell together into a mound of white ash. The flames from the cedar pencils and the sandalwood box rose above it, met, and joined.

            The next day, Mother asked what had become of the carpet.
        - id: ch01-b150
          speaker: mother
          text: >-
            Whatever did you do with it?
        - id: ch01-b151
          speaker: jane
          text: >-
            We gave it to someone who wanted it very much. The name began with P.
        - id: ch01-b152
          speaker: narrator
          text: >-
            The others instantly hushed her.
        - id: ch01-b153
          speaker: mother
          text: >-
            Oh, well. It wasn't worth twopence.
        - id: ch01-b154
          speaker: jane
          text: >-
            The person whose name began with P said we wouldn't lose anything by giving it away.
        - id: ch01-b155
          speaker: mother
          text: >-
            I daresay!
        - id: ch01-b156
          speaker: narrator
          text: >-
            Mother laughed. But that very night, a great box arrived at the house after dark. It was addressed to the children, with every one of their names written on it. Eliza could never afterward remember the name of the carrier who brought it. She knew only that it was neither Carter Paterson nor the Parcels Delivery.

            Naturally, the children opened it at once. It was a large wooden box, strongly fastened, so they needed both a hammer and the kitchen poker. The long nails squealed as they came out. Boards made a crunching sound as the children wrenched them free. Inside was soft paper covered with beautiful Chinese patterns in blue, green, red, and violet.

            Under that paper was nearly every lovely thing you can imagine, at least every lovely thing of a sensible size. Of course there were no motorcars, flying machines, or thoroughbred horses. Almost everything else was there. The children found the toys and games and books they had always wanted. There were chocolates and candied cherries, paint boxes and cameras. Best of all, the box held all the presents they had longed to give Father, Mother, and the Lamb but had never had the money to buy.

            At the very bottom of the box lay one tiny golden feather. Only Robert saw it. He picked it up without showing the others and hid it against the breast of his jacket. That place had so often served as a nest for the golden bird. When Robert went to bed, the feather was gone. It was the last thing he ever saw of the Phoenix.

            A note was pinned to the lovely fur cloak Mother had always wanted.
        - id: ch01-b157
          speaker: narrator
          text: >-
            It read, "In return for the carpet. With gratitude. P."

            You can imagine how Father and Mother talked the matter over. At last they reached an explanation. The mysterious person who had taken the carpet must be a mad millionaire who amused himself by pretending to be a rag-and-bone man. Curiously enough, the children seemed completely unable to describe this person.

            But the children knew better. This was the powerful Psammead fulfilling the Phoenix's final wish. The glorious and delightful box filled with treasure had come in return for the carpet. And it was truly the very, very, very end of the Phoenix and the Carpet.
