  chapters:
    - id: ch01
      title: THE CATS, THE COW, AND THE BURGLAR
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The wishing carpet had filled the nursery with Persian cats and musk-rats. There seemed to be animals everywhere. The cats mewed, the rats squeaked, and together they made such a noise that no one could hear themselves speak. The four children had retreated to the kitchen. There stood one candle, one Phoenix carefully hidden from view, and one policeman who was extremely visible.
        - id: ch01-b02
          speaker: policeman
          text: >-
            Now then, what's all this howling and caterwauling? There's a cat in here, and someone's treating it cruelly. What have you been doing to it?
        - id: ch01-b03
          speaker: narrator
          text: >-
            The policeman pointed his lantern at each child. Counting the Phoenix, there were five against one, but he was unusually large and all five of them were small. As the mewing and squeaking softened, Cyril answered.
        - id: ch01-b04
          speaker: cyril
          text: >-
            Yes, there are a few cats here, but we haven't hurt them. We've been feeding them.
        - id: ch01-b05
          speaker: policeman
          text: >-
            Doesn't sound much like feeding to me.
        - id: ch01-b06
          speaker: jane
          text: >-
            Perhaps they aren't real cats. Perhaps they're dream cats.
        - id: ch01-b07
          speaker: policeman
          text: >-
            I'll give you dream cats, my lady.
        - id: ch01-b08
          speaker: robert
          text: >-
            I'd explain if you understood anything besides murders, stealing, and that sort of wickedness, but you don't. Private cat-keeping isn't your business. You're supposed to interfere when people shout "Murder!" or "Stop thief!" in the street. So there.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The policeman firmly assured them that he would soon see about that. While he spoke, the Phoenix made itself as small as it could on the pot shelf beneath the dresser. It hid among the saucepan lids beside the fish kettle. Then, moving on the tips of its claws in the quietest and most modest way, it slipped out of the kitchen without anyone noticing.
        - id: ch01-b10
          speaker: anthea
          text: >-
            Oh, please don't be horrid. We love cats, dear soft things. We would never hurt them. Would we, Pussy?
        - id: ch01-b11
          speaker: jane
          text: >-
            Of course we wouldn't.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Their heartfelt words did not move the policeman.
        - id: ch01-b13
          speaker: policeman
          text: >-
            I'm going to see what's in that room through there, and—
        - id: ch01-b14
          speaker: narrator
          text: >-
            A wild burst of mewing and squeaking swallowed the rest. When it faded, all four children poured out four different explanations at once. The animals were no longer at their loudest, but they still made quite enough noise. With four children talking over them and over one another, the policeman could not understand a single word.
        - id: ch01-b15
          speaker: policeman
          text: >-
            Enough! I'm going into that room in the course of my duty. I'll use my eyes, because you and those cats have driven my ears out of their senses.
        - id: ch01-b16
          speaker: narrator
          text: >-
            He pushed Robert aside and marched through the door.
        - id: ch01-b17
          speaker: robert
          text: >-
            Don't say I didn't warn you.
        - id: ch01-b18
          speaker: jane
          text: >-
            They're really tigers. Father said so. I wouldn't go in there if I were you.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Nothing anyone said made the least difference. The policeman strode down the passage. He was one step from the room full of cats and musk-rats when a thin, sharp voice screamed from the street.
        - id: ch01-b20
          speaker: phoenix
          text: >-
            Murder! Murder! Stop thief!
        - id: ch01-b21
          speaker: narrator
          text: >-
            The policeman froze with one heavy boot in the air.
        - id: ch01-b22
          speaker: policeman
          text: >-
            Eh?
          emotion: surprised
        - id: ch01-b23
          speaker: narrator
          text: >-
            The cries rang out again from the dark street.
        - id: ch01-b24
          speaker: robert
          text: >-
            Go on, then. Stay here fussing over cats while someone is being murdered outside.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Robert had a strong feeling that he knew exactly who was screaming.
        - id: ch01-b26
          speaker: policeman
          text: >-
            You young rascal. I'll deal with you later.
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: >-
            The policeman rushed out. The children heard his heavy boots pounding along the pavement. Ahead of him, the screams raced along the street as well. The cries of murder and the thud of police boots grew fainter together until both disappeared in the distance. Robert slapped the leg of his knickerbockers.
        - id: ch01-b28
          speaker: robert
          text: >-
            Good old Phoenix! I'd know that golden voice anywhere.
          emotion: happy
        - id: ch01-b29
          speaker: narrator
          text: >-
            Then everyone understood. The Phoenix had listened when Robert explained what policemen were really meant to do. It had used those very words to draw this policeman away from the cats and send him chasing an imaginary murderer and thief instead. Every child felt a rush of admiration and affection for the clever golden bird.
        - id: ch01-b30
          speaker: anthea
          text: >-
            But he'll come back when he finds that the murderer was only a dream and there wasn't one at all.
          emotion: sad
        - id: ch01-b31
          speaker: narrator
          text: >-
            The Phoenix flew in, speaking in its softest voice.
        - id: ch01-b32
          speaker: phoenix
          text: >-
            No, he will not. He has no idea where your house is. I heard him admit it to another paid servant. What a night! Lock the door, and let us remove this unbearable smell of musk-rat and barber's shop. If you will excuse me, I am going to bed. I am exhausted.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Cyril wrote a note asking the carpet to take away the rats and bring milk. Whatever Persian cats might be, surely they liked milk.
        - id: ch01-b34
          speaker: anthea
          text: >-
            I only hope it doesn't bring musk-milk. Is there such a thing as a musk-cow? I hope not. Maybe we should have asked it to take the cats away instead. It's late, and we can't keep them all night.
        - id: ch01-b35
          speaker: narrator
          text: >-
            She pinned the note face down on the carpet. It shriveled and vanished while Robert fastened the side door.
        - id: ch01-b36
          speaker: robert
          text: >-
            Can't we? You might have asked me first. I'm not as stupid as some people.
        - id: ch01-b37
          speaker: anthea
          text: >-
            What do you mean?
        - id: ch01-b38
          speaker: robert
          text: >-
            Don't you see? We have to keep the cats all night. Oh, get down, you furry beasts! We've used all three wishes, and the carpet won't give us any more until tomorrow.
          emotion: angry
        - id: ch01-b39
          speaker: narrator
          text: >-
            A miserable silence would have followed if the Persian cats had not kept filling it with mews.
        - id: ch01-b40
          speaker: anthea
          text: >-
            Never mind. I think they're growing quieter. Perhaps they heard us say milk.
        - id: ch01-b41
          speaker: jane
          text: >-
            Persian cats can't understand English, Panther.
        - id: ch01-b42
          speaker: anthea
          text: >-
            How do you know "milk" isn't Persian for milk? Plenty of English words are the same in French. I know "miaow" is, and "croquet," and "fiancé." Oh, pussies, please be quiet! Let's stroke them with both hands as hard as we can. Maybe that will stop them.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Anthea was tired and anxious, which made her answer sharply. Then everyone stroked gray fur until their hands ached. They used both hands and worked as hard as they could. Whenever one cat had been stroked enough to stop mewing, they gently pushed it aside and reached for another noisy one. By degrees the sound changed, until there was more purring than mewing. That was when the carpet suddenly returned to its proper place.

            There were no milk cans or jugs upon it. There was a cow.

            She was not Persian and, fortunately, not a musk-cow. She was a sleek, dun-colored Jersey. She blinked her large soft eyes at the gaslight and gave a friendly, questioning moo.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Anthea had always feared cows, but now she forced herself to be brave.
        - id: ch01-b45
          speaker: anthea
          text: >-
            At least she can't chase me. There isn't even room for her to start running.
        - id: ch01-b46
          speaker: narrator
          text: >-
            The cow was perfectly peaceful. She behaved like a duchess who had wandered away from home. That lasted until someone brought a saucer and someone else tried to milk her into it. Milking is much harder than it looks, whatever you may think. By then, the children had been stretched to a kind of courage they could never have managed on an ordinary night. Robert and Cyril took hold of the horns. Jane first made quite sure that they had their end of the cow secure. Only then did she agree to stand near the other end, ready to seize the tail if necessary. Anthea approached with the saucer held tightly in her hands.

            She had heard that a stranger could soothe a cow by speaking to it. She clutched the saucer and searched her tired mind for the right words. Nothing suitable for a Jersey cow would come.
        - id: ch01-b47
          speaker: anthea
          text: >-
            Poor pussy. Lie down, good dog. Lie down!
        - id: ch01-b48
          speaker: narrator
          text: >-
            No one laughed. The room was too full of gray, mewing cats, and the matter was far too serious. With her heart pounding, Anthea tried to milk the cow. In the very next moment, the cow knocked the saucer from Anthea's hand and crushed it beneath one hoof. At the same time, she moved each of her other three feet. One landed on Robert's foot, one on Cyril's, and one on Jane's.
        - id: ch01-b49
          speaker: jane
          text: >-
            Oh, everything is much too horrid! Let's go to bed and leave the nasty cats with the hateful cow. Perhaps they'll eat one another, and it will serve them right!
          emotion: sad
        - id: ch01-b50
          speaker: narrator
          text: >-
            Jane burst into tears. The children did not go to bed. Instead, they held a shivering council in the drawing room. It smelled of soot, and a heap of soot lay in the fender to prove why. No fire had burned there since Mother left. Every chair and table stood in the wrong place. The chrysanthemums were dead, and the water in their pot had nearly dried away. Anthea wrapped the embroidered wool blanket around Jane and herself. Robert and Cyril fought for the larger share of the fur hearthrug. Their struggle was silent and brief, but very fierce.
        - id: ch01-b51
          speaker: anthea
          text: >-
            This really is dreadful, and I'm so tired. Let's turn the cats loose.
        - id: ch01-b52
          speaker: cyril
          text: >-
            And the cow too, perhaps? The police would find us at once. That cow would stand at the gate and mew—I mean moo—to be let in. So would the cats. No, there's only one thing to do. We'll put them in baskets and leave them on doorsteps like foundling babies.
        - id: ch01-b53
          speaker: jane
          text: >-
            We have three baskets if we count Mother's workbasket.
        - id: ch01-b54
          speaker: anthea
          text: >-
            But there are nearly two hundred cats, as well as the cow. She would need a much bigger basket, and how could you carry it? You'd never find a doorstep large enough, except the church steps, and—
        - id: ch01-b55
          speaker: cyril
          text: >-
            Oh, well, if you're determined to make difficulties—
        - id: ch01-b56
          speaker: robert
          text: >-
            I'm with you, Cyril. Don't worry about the cow, Panther. She has to stay tonight. I've read that a cow is a remunerating creature, which must mean it sits still and thinks for hours. The carpet can take her away in the morning. As for the cats, we'll wrap them in dusters, pillowcases, or bath towels. Come on, Squirrel. The girls can stay out of it if they like.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Robert sounded contemptuous, but the girls were too tired and desperate to care. At any other time they could not have borne being left out. Now it seemed rather comforting. They curled beneath the sofa blanket, and Cyril threw the hearthrug over them.
        - id: ch01-b58
          speaker: cyril
          text: >-
            That's all women are good for. They stay safe and warm while men do the work and face all the danger.
        - id: ch01-b59
          speaker: anthea
          text: >-
            I'm not like that. You know I'm not.
        - id: ch01-b60
          speaker: narrator
          text: >-
            But Cyril had gone. It was warm beneath the blanket and the hearthrug. Jane nestled close to Anthea, and Anthea held her closely and kindly. As if in a dream, they heard the cats rise into a wave of mewing when Robert opened the nursery door. They heard booted feet hunting for baskets in the back kitchen. Then the side door opened and shut, opened and shut. The girls knew that each brother had gone out carrying at least one cat.

            Anthea's last thought was that carrying away one hundred and ninety-nine cats, two at a time, would take all night. It meant ninety-nine journeys, with one cat left over.
        - id: ch01-b61
          speaker: anthea
          text: >-
            Perhaps we could keep the last cat. I don't care much for cats now, but I expect I will again someday.
        - id: ch01-b62
          speaker: narrator
          text: >-
            After saying this, Anthea fell asleep. Jane was sleeping too.

            It was Jane who woke with a start. As she woke, she accidentally kicked her sleeping sister. For one drowsy moment she wondered why they had gone to bed wearing boots. Then she remembered where they were and why they had slept in the drawing room.

            Muffled, shuffling feet moved on the stairs. Like the girl in the old poem, Jane thought the boys had returned. She felt wide awake now and much less tired, so she gently crept away from Anthea and followed. The footsteps went down toward the basement. The exhausted cats had fallen asleep, but the approaching feet woke them, and they began to mew pitifully.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Jane reached the bottom of the stairs before she saw that the newcomer was not one of her brothers. It was a burglar. She knew at once because he wore a fur cap and a red-and-black charity-check comforter. Besides, he had no business being inside the house.

            If you had been in Jane's shoes, you might have run away in them while screaming for the neighbors and police. Jane knew better. She had read many pleasant stories and touching poems about burglars. They taught her that no burglar ever hurt a little girl he met while burgling. In every story, he forgot his criminal business almost at once because the child's innocent prattle interested him so much. Jane hesitated only because she could not think of a suitably innocent remark to begin with. The children in those stories never spoke plainly, though they looked quite old enough in the pictures. Jane could not make herself lisp and talk like a baby, even to a burglar.

            While she was deciding, he quietly opened the nursery door.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Jane followed just in time to see him sit flat on the floor. Cats scattered around him like water splashed by a stone. She softly closed the door. She was still wondering whether she could call him "Mithter Wobber," and whether ordinary speech would work, when the burglar drew a long breath.
        - id: ch01-b65
          speaker: burglar
          text: >-
            This is judgment, that's what it is. Help me, what a thing to happen to a man! It brings everything home to you, doesn't it? Cats and cats and cats. There can't really be so many cats. And then there's the cow. Why, she's the very image of my old man's Daisy. She's like a dream from when I was a boy, so I don't mind her nearly as much. Here, Daisy. Daisy?
        - id: ch01-b66
          speaker: narrator
          text: >-
            The cow turned and looked at him.
        - id: ch01-b67
          speaker: burglar
          text: >-
            She's all right. She's company, in a way. Though heaven knows how she got into this downstairs parlor. But those cats—take them away! I'll give up the whole business. Only take them away!
          emotion: fearful
        - id: ch01-b68
          speaker: jane
          text: >-
            Burglar, I can't take the cats away.
        - id: ch01-b69
          speaker: narrator
          text: >-
            The burglar jerked around. His face was blank, and his pale lips trembled.
        - id: ch01-b70
          speaker: burglar
          text: >-
            Lord love me, there's another one! Are you real, miss, or will I wake up from you in a minute?
          emotion: surprised
        - id: ch01-b71
          speaker: jane
          text: >-
            I'm perfectly real. So are the cats.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Jane was relieved. She had not needed to lisp after all.
        - id: ch01-b73
          speaker: burglar
          text: >-
            Then call the police, and I'll go quietly. If you're no more real than those cats, I'm done for. I'm completely out of my senses. Call the police. I'll go without any trouble. Mind you, there wouldn't be room for half these cats in any police cell I've ever seen, but call them anyway.
        - id: ch01-b74
          speaker: narrator
          text: >-
            He dragged his fingers through his short hair and stared wildly around the crowded room.
        - id: ch01-b75
          speaker: jane
          text: >-
            Burglar, if you don't like cats, why did you come here?
        - id: ch01-b76
          speaker: burglar
          text: >-
            Call the police. Honestly, miss, I'd rather you did.
        - id: ch01-b77
          speaker: jane
          text: >-
            I don't dare, and there's no one I can send. I hate the police. I wish that policeman had never been born.
        - id: ch01-b78
          speaker: burglar
          text: >-
            You have a tender heart, miss. But these cats are a bit too much.
        - id: ch01-b79
          speaker: jane
          text: >-
            Listen. I won't call the police. I'm a real little girl, though I speak better than the ones you've met in stories while burgling. These are real cats, and they need real milk. Didn't you say the cow looked like someone called Daisy?
        - id: ch01-b80
          speaker: burglar
          text: >-
            She's the very spit of her, or may I drop dead.
        - id: ch01-b81
          speaker: jane
          text: >-
            Then perhaps you know how to milk a cow?
        - id: ch01-b82
          speaker: narrator
          text: >-
            A thrill of pride ran through Jane at her own cleverness.
        - id: ch01-b83
          speaker: burglar
          text: >-
            Perhaps I do.
        - id: ch01-b84
          speaker: jane
          text: >-
            If you'll only milk our cow, you can't imagine how much we'll always love you. Loving may be all very well, but think about the cats. If they get one good, long, wet drink of milk, they'll probably lie down and go to sleep. Then the policeman won't come back. If they keep mewing like this, he will, and I don't know what will happen to us—or to you.
        - id: ch01-b85
          speaker: narrator
          text: >-
            The burglar said that love was all very well, but Jane's argument decided him. She brought the washbowl from the sink. He spat on his hands and prepared to milk the cow. Just then, boots sounded on the stairs.
        - id: ch01-b86
          speaker: burglar
          text: >-
            It's over! This was a trap. That's the police!
          emotion: fearful
        - id: ch01-b87
          speaker: narrator
          text: >-
            He moved to open the window and jump out.
        - id: ch01-b88
          speaker: jane
          text: >-
            It's all right, I promise! I'll say you're my friend, or a kind clergyman, or my uncle—anything at all. Only please milk the cow. Don't go! Oh, thank goodness. It's only the boys!
          emotion: fearful
        - id: ch01-b89
          speaker: narrator
          text: >-
            It was the boys. Their arrival woke Anthea, and all three crowded into the doorway. The burglar looked around like a rat caught in a trap.
        - id: ch01-b90
          speaker: jane
          text: >-
            This is my friend. He stopped by, and he's going to milk the cow for us. Isn't that kind of him?
        - id: ch01-b91
          speaker: narrator
          text: >-
            Jane winked. The others did not understand, but they loyally followed her lead.
        - id: ch01-b92
          speaker: cyril
          text: >-
            How do you do? Very pleased to meet you. Please don't let us interrupt the milking.
        - id: ch01-b93
          speaker: burglar
          text: >-
            I'll have a head and a half in the morning, and that's no mistake.
        - id: ch01-b94
          speaker: narrator
          text: >-
            Still, he began to milk. Jane signaled to Robert with a wink, telling him to remain behind and make sure the burglar neither stopped nor escaped. The other children went looking for anything that could hold milk. It was already spurting and foaming into the washbowl. All around the cow, the cats stopped mewing and crowded closer. Hope and eager expectation showed on every whiskered face.
        - id: ch01-b95
          speaker: cyril
          text: >-
            We can't carry away any more cats. The police nearly caught us as it was. It wasn't even the same policeman. This one was a much stronger sort. He really believed we had a foundling baby in those bags. If I hadn't thrown both bags of cats straight into his face, we would have been caught. Then I dragged Robert over a railing, and we lay as quiet as mice under a laurel bush. It's lucky I'm such a good shot. The policeman pranced away after he pulled the cat bags off his face. He thought we'd run in the other direction. And here we are.
        - id: ch01-b96
          speaker: narrator
          text: >-
            Cyril and his sisters piled a tray high with saucers, soup plates, platters, and pie dishes. The steady swish of milk into the washbowl soothed the burglar more and more. He kept milking as if he had drifted into a happy dream. Meanwhile, the children found a cup. They dipped the warm milk out of the bowl and filled the pie dishes, plates, platters, and saucers. One after another, they set them on the floor to the music of Persian purrs and busy lapping tongues.
        - id: ch01-b97
          speaker: burglar
          text: >-
            It takes me back. There were apples in the orchard at home, rats at threshing time, rabbits and ferrets, and the pretty sight of the pigs being killed.
          emotion: sad
        - id: ch01-b98
          speaker: narrator
          text: >-
            He wiped his eyes with the frayed cuff of his coat. Seeing how softhearted he had become, Jane questioned him.
        - id: ch01-b99
          speaker: jane
          text: >-
            Please tell us why you chose our house tonight. I'm awfully glad you did. You've been so kind, and I don't know what we would have done without you. We all love you ever so much. Please tell us.
        - id: ch01-b100
          speaker: narrator
          text: >-
            The others joined in with affectionate pleas. At last the burglar answered.
        - id: ch01-b101
          speaker: burglar
          text: >-
            This was my very first job. I certainly didn't expect to be made so welcome, and that's the truth, young ladies and gentlemen. Now I think it may be my last job as well. This cow brings my father back to me. I know exactly how he would have thrashed me if I had laid a hand on one halfpenny that wasn't mine.
        - id: ch01-b102
          speaker: jane
          text: >-
            I'm sure he would. But what brought you here?
        - id: ch01-b103
          speaker: burglar
          text: >-
            Well, miss, you know better than I do how you came by all these cats. You also know why you don't care to have the police around. So I'll give myself away freely and trust your noble hearts. But first you'd better dip out some of that milk. The bowl is getting rather full.

            I sell oranges from a barrow. I'm not a burglar by trade, however freely you've used the name. A lady bought three halfpennies' worth from me. She took great care choosing every orange. I never mind that kind of customer, because she usually ends up with a few overripe ones. While she was still picking them out, two other ladies stood talking across a fence.
        - id: ch01-b104
          speaker: burglar
          text: >-
            One told the other that she had invited both girls. They could sleep beside Maria and Jane because their master and mistress were miles away, and the children were gone too. The servants could simply lock the house and leave the gas burning so nobody would guess it was empty. They would be home bright and early by eleven in the morning. Until then, the women meant to make a night of it together. The first lady said she only had to run out and put a letter in the post.

            The lady buying my oranges saw that the woman's hands were covered in soapsuds. She wondered why the poor woman should go out like that. A good gentleman like me would surely post the letter, she said, especially since she was already my customer. So they handed it to me. Naturally, I read the address written on the envelope before I slipped it into the post.
        - id: ch01-b105
          speaker: burglar
          text: >-
            Later, after I sold the whole barrowful, I started home with the money safe in my pocket. Then some thieving scoundrel stole every coin while I was stopping to wet my whistle. Calling out oranges all day is dry work. The villain took the whole lot. I didn't have one farthing left to carry home to my brother and his wife, though I had bought every orange from them in the first place.
        - id: ch01-b106
          speaker: anthea
          text: >-
            How awful!
          emotion: sad
        - id: ch01-b107
          speaker: burglar
          text: >-
            Awful is right, miss. You don't know my sister-in-law's temper when it gets going, and I sincerely hope you never do. Once the money was gone, I remembered the address written on that envelope. I said to myself, why not? Someone had robbed me, after all. And if a family kept two servant girls, there ought to be something worth taking in their house. That's how I came to be here. But these cats have brought me back to honest ways. Never again.
        - id: ch01-b108
          speaker: cyril
          text: >-
            Listen, these cats are extremely valuable. We'll give you every one if you'll take them away.
        - id: ch01-b109
          speaker: burglar
          text: >-
            I can see they're well bred, but I don't want trouble with the police. Did you get them honestly? Tell me straight.
        - id: ch01-b110
          speaker: anthea
          text: >-
            They're all ours. We did ask for them, but the confidement—
        - id: ch01-b111
          speaker: cyril
          text: >-
            Consignment.
        - id: ch01-b112
          speaker: anthea
          text: >-
            The consignment was larger than we wanted, and they're a terrible bother. If you brought your barrow and some sacks or baskets, your brother's wife would be delighted. Father says Persian cats are worth pounds and pounds apiece.
        - id: ch01-b113
          speaker: burglar
          text: >-
            I can see you're in a difficult spot, and I don't mind lending a hand. I won't ask how you came by the cats. But I have a friend who's an expert on them. I'll fetch him and bring him here. If he thinks these cats could be sold for anything more than the value of their skins, I don't mind doing you this kindness.
        - id: ch01-b114
          speaker: jane
          text: >-
            You won't disappear and never come back, will you? I don't think I could bear it.
          emotion: sad
        - id: ch01-b115
          speaker: narrator
          text: >-
            Jane's feeling touched the burglar deeply. In the most sentimental way, he swore that he would come back, whether he was alive or dead.

            After he left, Cyril and Robert sent the girls to bed. The boys sat up to wait for his return. Before long, staying awake began to seem ridiculous, and they fell asleep. Yet the burglar's stealthy tap at the window woke them easily enough. He had kept his promise. He returned with his friend, his barrow, and a supply of sacks.
        - id: ch01-b116
          speaker: narrator
          text: >-
            His friend examined the cats and approved of them. By then they were lying asleep, full of milk and wrapped in complete Persian satisfaction. The men bundled the sleepy animals into sacks, carried the sacks outside, and loaded them onto the barrow. The cats did mew as they were taken away, but their voices were far too drowsy to attract anyone's attention.
        - id: ch01-b117
          speaker: burglar
          text: >-
            Now I'm a fence, a receiver of stolen goods. I never thought I'd sink so low, and all because of my kind heart.
          emotion: sad
        - id: ch01-b118
          speaker: narrator
          text: >-
            Cyril knew what a fence meant.
        - id: ch01-b119
          speaker: cyril
          text: >-
            I give you my sacred word that the cats aren't stolen. What time is it?
        - id: ch01-b120
          speaker: burglars_pal
          text: >-
            I haven't got a watch, but it was closing time when I passed the Bull and Gate. I shouldn't wonder if it's nearly one now.
        - id: ch01-b121
          speaker: narrator
          text: >-
            Once the last cat had gone, the boys and the burglar said goodbye with warm expressions of friendship on both sides. The crowded house was quiet at last. Only the cow remained behind.
        - id: ch01-b122
          speaker: robert
          text: >-
            She'll have to stay all night. Cook will have a fit when she sees her.
        - id: ch01-b123
          speaker: cyril
          text: >-
            All night? If it's one o'clock, it's already tomorrow morning. We can have another wish!
          emotion: surprised
        - id: ch01-b124
          speaker: narrator
          text: >-
            They hastily wrote another note. It told the carpet to take the cow back wherever she belonged and then return to its proper place on the nursery floor. There was only one difficulty. No matter what the boys tried, they could not persuade the cow to put one foot on the carpet. Robert went to the back kitchen and fetched the clothesline. He tied one end very firmly around the cow's horns. Then he gathered one corner of the carpet into a bundle and tied the other end of the line around it.
        - id: ch01-b125
          speaker: robert
          text: >-
            Fire away.
        - id: ch01-b126
          speaker: narrator
          text: >-
            At Robert's command, the carpet vanished. The rope pulled tight, and the cow vanished with it. The boys went to bed at last. They were worn out by everything that had happened and deeply thankful that the long evening was finally over.

            The next morning, the carpet lay calmly in its usual place on the nursery floor, as if nothing strange had happened. But one corner was very badly torn. It was the same corner where the clothesline had tied the cow to the carpet.
