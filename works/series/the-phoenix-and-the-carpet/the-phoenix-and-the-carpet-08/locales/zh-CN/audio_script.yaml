audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带一点英式童话的机智
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明自信，挖苦人时一本正经
        timbre: 清脆的少年声
        pace: 中等偏快
        pitch: 中高
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴敏锐，急切时仍然清楚
        timbre: 柔和明亮的少女声
        pace: 中等
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 坚持己见，认真里常带几分莽撞
        timbre: 结实清朗的少年声
        pace: 中等
        pitch: 中等
    jane:
      display_name: 简
      tts:
        delivery: 天真直率，话里带着小孩子的认真
        timbre: 稚嫩柔软的女孩声
        pace: 稍慢
        pitch: 偏高
    phoenix:
      display_name: 凤凰
      tts:
        delivery: 文雅自负，庄重中带着敏锐的幽默
        timbre: 华美清润，中性而成熟
        pace: 从容
        pitch: 中高
    policeman:
      display_name: 警察
      tts:
        delivery: 谨慎威严，询问时不容敷衍
        timbre: 浑厚结实的成年男声
        pace: 中等偏慢
        pitch: 中低
    burglar:
      display_name: 窃贼
      tts:
        delivery: 市井粗率，慌乱时语速急促，动情时朴实诚恳
        timbre: 沙哑厚重的成年男声
        pace: 中等偏快
        pitch: 中低
    burglar_friend:
      display_name: 窃贼的朋友
      tts:
        delivery: 老练随意，说话简短直接
        timbre: 粗粝的成年男声
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 警察和凤凰的妙计
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 育儿室里塞满了许愿地毯带来的波斯猫和麝鼠。猫一声声喵，麝鼠一阵阵吱，谁说什么都听不清。厨房里则站着四个孩子，点着一支蜡烛，凤凰躲了起来，还有一位格外显眼的警察。
        - id: ch01-b02
          speaker: policeman
          text: 喂，都听着！这屋里又喊又叫，到底出了什么事？我听见里头有只猫，还有人在虐待它。你们究竟在干什么？
        - id: ch01-b03
          speaker: narrator
          text: 警察一边高声盘问，一边提着灯挨个照孩子的脸。算上凤凰，他们是五个对一个。可那一个警察身材格外魁梧，孩子们和凤凰却都很小，这个数目上的优势并没有多少用处。猫叫和鼠叫总算稍微低下去时，西里尔赶紧抓住这一小会儿安静，开口解释。
        - id: ch01-b04
          speaker: cyril
          text: 这里确实有几只猫，可我们一点也没伤害它们。正好相反，我们才喂过它们。
        - id: ch01-b05
          speaker: policeman
          text: 听着可完全不像。
        - id: ch01-b06
          speaker: jane
          text: 也许它们根本不是真猫，只是梦里才有的猫。
        - id: ch01-b07
          speaker: policeman
          text: 小姐，我倒要让你梦一回猫。
        - id: ch01-b08
          speaker: robert
          text: 你要是除了杀人、偷窃那些坏事，还懂点别的，我就全告诉你。可你肯定不懂。我们在自己家养猫，不归你管。街上有人喊杀人啦、抓贼呀，那才是你的事！
        - id: ch01-b09
          speaker: narrator
          text: 警察说，他自会把事情查清。凤凰原本缩在碗柜下的锅架上，夹在锅盖和煮鱼锅之间。这时，它踮着爪尖，悄悄走出了厨房，谁也没发现。
        - id: ch01-b10
          speaker: anthea
          text: 请别这么凶。我们最爱猫了，这么柔软、这么可爱的猫，我们怎么会伤害它们呢？对不对，咪咪？
        - id: ch01-b11
          speaker: narrator
          text: 简连忙说当然不会。可两个女孩说得再好听，也没能打动警察。
        - id: ch01-b12
          speaker: policeman
          text: 好了，我现在就去看看那间屋里藏着什么，还有……
        - id: ch01-b13
          speaker: narrator
          text: 猫和麝鼠忽然一起狂叫，把他后面的话全淹没了。声音刚低一点，四个孩子便同时抢着解释。吱吱声和喵喵声还没有停，四种完全不同的说法又一股脑儿冲向警察。他站在这一片声音里，任凭怎样用力去听，也连一个字都听不明白。
        - id: ch01-b14
          speaker: policeman
          text: 全都闭嘴！我要到隔壁执行公务，亲眼看个清楚。你们和这些猫，已经快把我的耳朵逼疯了。
        - id: ch01-b15
          speaker: narrator
          text: 他推开罗伯特，大步走进过道。
        - id: ch01-b16
          speaker: robert
          text: 我可是警告过你了。
        - id: ch01-b17
          speaker: jane
          text: 其实那是老虎，爸爸亲口说的。要是我，我绝不会进去。
        - id: ch01-b18
          speaker: narrator
          text: 可警察硬得像石头，谁也拦不住。他又迈一步，就要走进那间挤满猫和麝鼠的屋子。正在这时，黑暗的街上传来一声尖利的呼喊。
        - id: ch01-b19
          speaker: phoenix
          text: 杀人啦！杀人啦！抓贼呀！
        - id: ch01-b20
          speaker: narrator
          text: 警察立刻停下，一只穿着大皮靴的脚沉甸甸地悬在半空。街上又响起同样凄厉的叫声。
        - id: ch01-b21
          speaker: policeman
          text: 什么？
          emotion: surprised
        - id: ch01-b22
          speaker: robert
          text: 快去呀！外面都有人被杀了，你还守在这里管猫。
        - id: ch01-b23
          speaker: policeman
          text: 你这个小坏蛋，我回头再跟你算账。
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: 警察冲出门，沉重的靴子踏过人行道，追着尖叫一路跑远。那道尖锐的声音也一路往前移动，总比他快上一点。孩子们留在门里听着，直到杀人般的叫喊和警察的靴声越来越轻，最后全都消失在遥远的夜色里。罗伯特这才抬起手，在自己的灯笼裤上啪地拍了一下。
        - id: ch01-b25
          speaker: robert
          text: 凤凰干得漂亮！它那把金嗓子，我到哪儿都认得出来。
          emotion: happy
        - id: ch01-b26
          speaker: narrator
          text: 大家这才明白，凤凰刚才躲在厨房时，听见罗伯特说，警察真正该管的是杀人犯和窃贼，不是别人家里的猫。它不但把这话牢牢记住，还马上想出了这个绝妙的办法。孩子们对它佩服得不得了，心里也比先前更加喜欢它。
        - id: ch01-b27
          speaker: anthea
          text: 可等他发现根本没有杀人犯，只有梦里才有那么灿烂的幻影，他还会回来的。
          emotion: fearful
        - id: ch01-b28
          speaker: phoenix
          text: 他不会回来。他连你们家在哪儿都不知道，我亲耳听见他对另一个领薪水的同伴承认了。唉，今晚真叫人受不了！把门锁好，再想办法除掉这股麝鼠和修胡子铺才有的怪味吧。请恕我不奉陪了，我累得一点力气也没有，必须睡觉。

    - id: ch02
      title: 地毯带回一头母牛
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 西里尔写了张纸条，叫地毯送走麝鼠，再带些牛奶回来。不管波斯猫多么特别，孩子们都相信它们一定爱喝牛奶。安西娅把纸条字朝下别在地毯上。地毯缩成一团，转眼不见了。
        - id: ch02-b02
          speaker: anthea
          text: 但愿它别带回一股麝香味的牛奶。世上有麝香牛吗？希望没有。也许叫地毯送走猫才更聪明。天已经很晚了，总不能把它们留一整夜。
        - id: ch02-b03
          speaker: robert
          text: 不能吗？你们许愿前本来可以问问我。我可不像有些人那么笨。
        - id: ch02-b04
          speaker: anthea
          text: 你到底是什么意思？
        - id: ch02-b05
          speaker: robert
          text: 还没明白？这些猫非在这儿过夜不可。下去，你们这些毛茸茸的家伙！老地毯今天三个愿望都用完了，明天以前，谁也别想再许愿。
        - id: ch02-b06
          speaker: narrator
          text: 幸好波斯猫还在欢快地叫，这才没有落下一阵悲惨的沉默。安西娅先打起了精神。
        - id: ch02-b07
          speaker: anthea
          text: 别发愁。你们听，它们好像安静一点了，也许听见我们说牛奶啦。
        - id: ch02-b08
          speaker: jane
          text: 它们又听不懂英语。豹豹，你忘了它们是波斯猫。
        - id: ch02-b09
          speaker: anthea
          text: 谁说波斯语的牛奶不叫牛奶？好多英语词到了法语里也不变。我至少知道，喵、槌球、未婚夫都一样。好了，猫咪们，安静些吧！我们两只手一起摸，说不定能让它们别叫。
        - id: ch02-b10
          speaker: narrator
          text: 她又累又着急，说话便有些尖。大家不停抚摸灰色的猫毛，直到两手发酸。一只猫给摸够了，不再叫，他们就轻轻推开它，再把手伸向另一只还在喵喵叫的捕鼠能手。就这样一只接一只，谁也不敢停。等大半喵喵声终于变成呼噜声，地毯忽然回到原处。大家原以为会看见一排排牛奶罐，至少也该有一只牛奶壶。可地毯上什么盛奶的东西都没有，只有一头母牛。
        - id: ch02-b11
          speaker: narrator
          text: 万幸，它既不是波斯牛，也不是麝香牛——要是世上真有那种牛。它是一头黄褐色的泽西牛，皮毛光滑发亮。它眨着温柔的大眼睛，在煤气灯下和和气气地哞了一声，像是在问自己来到了哪里。
        - id: ch02-b12
          speaker: narrator
          text: 安西娅一直怕牛，这会儿却努力鼓起勇气。
        - id: ch02-b13
          speaker: anthea
          text: 反正它追不了我，这儿连让它跑起来的地方都没有。
        - id: ch02-b14
          speaker: narrator
          text: 在孩子们拿来碟子，又试着把奶挤进去以前，母牛一直很安详，端庄得像一位迷路的公爵夫人。你也许觉得挤奶很容易，其实一点也不容易。何况孩子们已经折腾了一整夜，勇气绷得再也不能更紧。若在平常，他们绝不可能壮着胆子抓牛角、守牛尾巴，还拿一只小碟子去挤奶。
        - id: ch02-b15
          speaker: narrator
          text: 罗伯特和西里尔抓住牛角。简确定牛头真的被抓牢以后，才肯站在后面，准备随时揪住牛尾巴。安西娅捧着碟子走上前。她听说陌生人挤奶时，说话能叫母牛安心。可这一夜没完没了的乱子搅乱了她的脑子，她怎么也想不出一句适合说给泽西牛听的话。
        - id: ch02-b16
          speaker: anthea
          text: 可怜的小猫，乖乖的。好狗狗，趴下，快趴下！
        - id: ch02-b17
          speaker: narrator
          text: 谁也没有笑。满屋的灰猫还在喵喵叫，情形太严重了，实在容不得谁发笑。安西娅的心怦怦直跳，还是壮着胆子伸手挤奶。下一刻，母牛猛地把碟子撞出她的手。一只蹄子正好把碟子踩碎，另外三只蹄子也没有闲着，分别踩中了罗伯特、西里尔和简的一只脚。简疼得哇一声哭了起来。
        - id: ch02-b18
          speaker: jane
          text: 为什么每件事都这么讨厌！走吧，我们去睡觉，把可恶的猫和这头坏牛留在这里。也许它们会互相吃掉，那也是它们活该！
          emotion: angry
        - id: ch02-b19
          speaker: narrator
          text: 他们并没上床，而是哆哆嗦嗦地去客厅开会。屋里满是煤烟味，壁炉前也确实堆着一摊煤烟。自从妈妈离开，这里再没生过火，桌椅全摆错了位置，菊花早已枯死，花盆里的水也快干了。安西娅扯过绣花羊毛沙发毯，把自己和简一起裹住。两个男孩则看中了毛皮炉前毯，为了让自己多占一点，进行了一场没有出声、时间很短却格外激烈的争夺。
        - id: ch02-b20
          speaker: anthea
          text: 这真是糟透了，我也快累死了。我们把猫放出去吧。
        - id: ch02-b21
          speaker: cyril
          text: 连母牛也放出去吗？警察马上就会找到我们。那头牛准会站在大门口喵喵叫——不对，是哞哞叫——闹着要进来，猫也一样。我知道该怎么办。把猫装进篮子，放到别人家的门阶上，就像被人丢下的孤儿。
        - id: ch02-b22
          speaker: jane
          text: 加上妈妈装针线的那个，我们一共有三个篮子。
        - id: ch02-b23
          speaker: anthea
          text: 可这里差不多有两百只猫，还有一头牛。牛得装进多大的篮子呀？你们也抬不动，更找不到放得下它的门阶。除非放在教堂门口，而且……
        - id: ch02-b24
          speaker: cyril
          text: 唉，你要是什么事都只会挑困难，那当然办不成。
        - id: ch02-b25
          speaker: robert
          text: 我赞成西里尔。豹豹，别再为母牛操心，它今晚只能留下。我在书里见过，母牛是有收益的动物，就是说，它能坐上好几个钟头，安安静静地思考。明早再让地毯送它回去。猫可以拿抹布、枕套或浴巾包起来。走吧，松鼠。你们女孩子不想参加，那就别参加。
        - id: ch02-b26
          speaker: narrator
          text: 罗伯特的口气很轻蔑。换作平时，两个女孩绝不会容许别人把她们排除在外。可她们已经又累又绝望，反而觉得不去很舒服。两人紧紧依偎在沙发毯里，西里尔又把毛皮炉前毯盖到她们身上。
        - id: ch02-b27
          speaker: cyril
          text: 女人也就适合这样，暖暖和和、安安全全地待着，让男人出去干活、冒险、经历危险。
        - id: ch02-b28
          speaker: anthea
          text: 我才不是这样，你明明知道。
        - id: ch02-b29
          speaker: narrator
          text: 可西里尔已经走了。两层毯子下面暖烘烘的，简紧挨着姐姐，安西娅也亲热地搂着她。两个人渐渐睡得迷迷糊糊。她们听见罗伯特打开育儿室门，猫叫顿时像浪头一样高高涌起，又听见穿靴子的脚在后厨房里四处寻找篮子。后来，侧门开了一次，又关上了。她们知道，两个哥哥每人至少带走了一只猫。
        - id: ch02-b30
          speaker: narrator
          text: 安西娅睡着前还在算，一百九十九只猫，每次送两只，至少要跑九十九趟，最后还会剩下一只。
        - id: ch02-b31
          speaker: anthea
          text: 最后一只也许可以留下。我现在不大喜欢猫了，可说不定以后又会喜欢。
        - id: ch02-b32
          speaker: narrator
          text: 说完，她睡着了。简也早已入睡。

    - id: ch03
      title: 简遇见窃贼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 简猛地醒来，一脚踢中了还在睡的安西娅。她先迷迷糊糊地纳闷，自己上床怎么没有脱靴子，下一刻便想起她根本不在床上，也想起了这一夜所有的乱子。楼梯上传来拖拖沓沓的脚步，听着像是被什么裹得严严实实。简起初以为是男孩子们。她这时已经完全清醒，也不像先前那么疲倦，便从姐姐身边轻轻爬出毯子，顺着脚步声一路追下去。
        - id: ch03-b02
          speaker: narrator
          text: 猫群本来累得睡着了，一听有人走近，又凄惨地叫起来。到了楼梯脚下，简才看清，来的并不是哥哥，而是一个窃贼。他戴着皮帽子，围着慈善机构发的红黑格子围巾，而且根本不该出现在这里。凭这几点，简一眼就认定他是窃贼。
        - id: ch03-b03
          speaker: narrator
          text: 要是你处在简的境地，多半早就穿着靴子逃走，一边尖叫，一边喊警察和邻居。可简觉得自己懂得更多。她读过许多写窃贼的好故事，也读过几首动人的诗。照那些故事说的，窃贼行窃时一旦撞见小女孩，便绝不会伤害她。他几乎总会立刻忘掉自己是贼，只顾听她天真地说话。
        - id: ch03-b04
          speaker: narrator
          text: 所以简没有逃。她迟疑，只是因为一时想不出该用哪句足够天真、足够像小孩子絮语的话开口。故事和诗里的孩子总是说不清楚话，哪怕插图上的年纪早该口齿清楚了。可就算面对一个窃贼，简也拿不准自己该不该故意装成小娃娃。就在她犹豫时，窃贼已经悄悄打开育儿室的门，走了进去。
        - id: ch03-b05
          speaker: narrator
          text: 简跟进去，正看见他一屁股坐在地上。猫群朝四面散开，像石子落进池塘，溅起一圈水花。她轻轻关好门，还在琢磨，自己能不能狠下心说出那句故意含混的“泥在介里干什喵呀，强盗蜀黍”。这时，窃贼深深吸了一口气。
        - id: ch03-b06
          speaker: burglar
          text: 这是报应，老天作证，这就是报应！一个人怎么会碰上这种事？真能叫人一下子醒悟。猫，猫，还是猫，哪可能有这么多！更别说这头牛了，它跟老头子的黛西一模一样，简直像我小时候的梦又回来了。牛我倒不太怕。来吧，黛西，黛西？
        - id: ch03-b07
          speaker: narrator
          text: 母牛转头看着他。
        - id: ch03-b08
          speaker: burglar
          text: 它倒没什么，还能做个伴。可谁能告诉我，它怎么跑进楼下客厅的？至于这些猫……快把它们弄走！我一只也不要，快弄走吧！
          emotion: fearful
        - id: ch03-b09
          speaker: jane
          text: 窃贼，这些猫我可弄不走。
        - id: ch03-b10
          speaker: narrator
          text: 简的声音突然从身后传来，窃贼吓得浑身猛地一抽。他慢慢转过脸，脸上空白一片，好像连自己在哪里都不知道了，苍白的嘴唇也不停发颤。
        - id: ch03-b11
          speaker: burglar
          text: 老天爷呀，怎么又出来一个？小姐，你是真人，还是我醒来就会消失的东西？
          emotion: fearful
        - id: ch03-b12
          speaker: jane
          text: 我当然是真人，这些猫也是真的。
        - id: ch03-b13
          speaker: narrator
          text: 简发现不用故意说不清楚，窃贼也能听懂，心里轻松多了。
        - id: ch03-b14
          speaker: burglar
          text: 那你快去叫警察，我会老老实实跟他走。要是你还不如这些猫真实，我就彻底完了，阳寿也到头了。快叫吧。不过我见过的牢房，没有一间装得下这里一半的猫。
          emotion: fearful
        - id: ch03-b15
          speaker: narrator
          text: 他抬手用手指梳过短短的头发，两只眼睛惊恐地转来转去，把这间被猫塞满的屋子看了一遍又一遍，像是怎么也不能相信眼前的一切。
        - id: ch03-b16
          speaker: jane
          text: 窃贼，你既然不喜欢猫，干吗还要到这里来？
        - id: ch03-b17
          speaker: burglar
          text: 去叫警察吧。我宁可你去，真的，我宁可这样。
        - id: ch03-b18
          speaker: jane
          text: 我不敢去，也没有人能替我去。我讨厌警察，真希望他根本没出生过。
        - id: ch03-b19
          speaker: burglar
          text: 小姐，你心肠真软。可这些猫实在多得过了头。
        - id: ch03-b20
          speaker: jane
          text: 你听我说，我不会叫警察。我真是一个小女孩，只是说话比你以前行窃时碰见的孩子老成一点。这些也都是真猫，它们需要真的牛奶。你刚才是不是说，这头牛很像你从前认识的黛西？
        - id: ch03-b21
          speaker: burglar
          text: 要不是一模一样，就叫我不得好死。
        - id: ch03-b22
          speaker: narrator
          text: 简心里涌起一阵又快乐又骄傲的颤抖。
        - id: ch03-b23
          speaker: jane
          text: 那么，你也许会挤牛奶？
        - id: ch03-b24
          speaker: burglar
          text: 也许会。
        - id: ch03-b25
          speaker: jane
          text: 只要你肯帮我们挤奶，你不知道我们会爱你多久。
        - id: ch03-b26
          speaker: narrator
          text: 窃贼说，爱不爱的倒也没什么。
        - id: ch03-b27
          speaker: jane
          text: 只要这些猫痛痛快快喝上一大顿，解了渴，也许就会躺下睡觉，警察也不会回来。可它们要是一直叫，警察一定会再来。到时候你会怎样，我们会怎样，我就不知道了。
        - id: ch03-b28
          speaker: narrator
          text: 这个道理说服了他。简从水槽里取来洗脸盆，窃贼朝两只手上吐了口唾沫，正要挤奶，楼梯上忽然传来靴子声。
        - id: ch03-b29
          speaker: burglar
          text: 全完了，这是圈套，警察来了！
          emotion: fearful
        - id: ch03-b30
          speaker: narrator
          text: 他转身就想推开窗户跳出去。
        - id: ch03-b31
          speaker: jane
          text: 没事，我告诉你，真的没事！我会说你是我的朋友，是顺路来的好牧师，或者是我舅舅，随便什么都行。只求你留下来挤奶。挤吧，快挤吧！别走……哦，谢天谢地，原来只是哥哥们！
        - id: ch03-b32
          speaker: narrator
          text: 果然是两个男孩。他们进门的动静惊醒了安西娅，她连忙跟着两个哥哥下楼，三个人一起挤在育儿室门口。窃贼看看这一张脸，又看看那一张脸，怎么也找不到可以逃走的方向，活像一只困在捕鼠器里的老鼠。
        - id: ch03-b33
          speaker: jane
          text: 这是我的朋友，刚好顺路进来，要替我们挤牛奶。他是不是特别好心，特别善良？
        - id: ch03-b34
          speaker: narrator
          text: 简朝大家眨眨眼。他们虽然不懂发生了什么，还是忠心地配合她。
        - id: ch03-b35
          speaker: cyril
          text: 你好，见到你真高兴。你只管挤，我们绝不打扰。
        - id: ch03-b36
          speaker: burglar
          text: 明早我的脑袋准会变成一个半那么大，绝不会错。
        - id: ch03-b37
          speaker: narrator
          text: 他嘴里嘟囔着，手上却开始挤奶。大家用眼色叫罗伯特留下盯着他，免得他停手或逃跑，其余人去找盛奶的器皿。等他们拿着茶碟、汤盘、大浅盘和馅饼盘回来，牛奶已经一道道喷进洗脸盆，浮起了白沫。猫群不再叫喊，全都围到母牛旁边，一张张带胡须的脸满怀希望，眼巴巴等着喝奶。
        - id: ch03-b38
          speaker: cyril
          text: 我们一只猫也不能再送了。刚才差点被另一个警察抓住，那家伙比先前的还厉害，真把我们当成拎着弃婴的人。幸好我把两袋猫朝他脸上扔过去，又拖着罗伯特翻过栏杆，像老鼠一样趴进月桂树丛。他从脸上扯下猫袋，一路追错了方向，我们才溜回来。全靠我扔得准。
        - id: ch03-b39
          speaker: narrator
          text: 牛奶温柔而均匀地落进盆里，发出一成不变的唰唰声。那声音显然大大安抚了窃贼，他像待在一场幸福的梦里，低着头继续挤奶。孩子们拿来一只杯子，把温热的奶一勺勺舀进茶碟、汤盘、大浅盘和馅饼盘，再小心放到地上。很快，喵喵声完全消失，屋里只剩此起彼伏的呼噜声和舔奶声。
        - id: ch03-b40
          speaker: burglar
          text: 这让我想起从前了。老家果园里的苹果，打谷时跑出来的老鼠，还有兔子、雪貂和杀猪时那番好看的场面。
        - id: ch03-b41
          speaker: narrator
          text: 说起从前，他用破外套的袖口擦了擦眼睛。简看见这个动作，知道母牛和挤奶声已经让他的心软了下来，便趁这个机会继续问他。
        - id: ch03-b42
          speaker: jane
          text: 你能告诉我们，今晚为什么偏偏来偷我们家吗？我真高兴你来了。你这样好，要是没有你，我们简直不知道怎么办。我们大家都会非常爱你。告诉我们吧。
        - id: ch03-b43
          speaker: narrator
          text: 其他孩子也亲亲热热地求他。最后，窃贼终于开了口。
        - id: ch03-b44
          speaker: burglar
          text: 好吧，这是我头一次干这种事，没想到会这么受欢迎。少爷小姐们，我说的是实话。我也不知道这是不是最后一次。这头牛让我想起了我爸爸。我要是敢动不属于自己的一枚半便士，他准会狠揍我一顿。
        - id: ch03-b45
          speaker: jane
          text: 我相信他一定会。可你究竟为什么到我们家来？
        - id: ch03-b46
          speaker: burglar
          text: 小姐，你们怎么弄来这些猫，又为什么不喜欢警察，你们自己最清楚。所以我也把自己的事白白说出来，相信你们都有高贵的心肠。先舀走一点吧，盆快满了。
        - id: ch03-b47
          speaker: burglar
          text: 我本来推着小车卖橙子，并不是靠偷东西过日子，虽说你们一直毫不客气地管我叫窃贼。有位太太花三个半便士买橙子，还挑得特别仔细。我最喜欢这种客人，因为她们通常会把熟过头的橙子挑走。她一只只挑的时候，另外两个太太正在篱笆那边说话，我把她们的话全听见了。
        - id: ch03-b48
          speaker: burglar
          text: 一个说，她已经把两个姑娘都叫来了，可以跟玛丽亚和简挤一挤。老爷太太远在几十英里外，孩子也不在家。只要锁好门，煤气灯还亮着，别人就看不出屋里没人。她们早点回来，十一点准能到，还能痛痛快快玩一夜。说完，她就要去寄一封信。
        - id: ch03-b49
          speaker: burglar
          text: 买橙子的太太见她满手肥皂沫，便说，这位好心的先生一定肯代劳，反正她刚照顾过我的生意。她们就把信交给了我。投进邮筒以前，我当然看了信封上的地址。
        - id: ch03-b50
          speaker: burglar
          text: 后来我卖光一车橙子，带着钱回家。谁知我不过去润润喉咙，卖橙子喊久了实在口渴，就有个该死的贼把钱摸得一文不剩。我连一个法寻也没留下，没法回去见哥哥和嫂子。
        - id: ch03-b51
          speaker: anthea
          text: 那真是太可怕了！
          emotion: sad
        - id: ch03-b52
          speaker: burglar
          text: 可不是吗，小姐。你们不知道我嫂子发起火是什么样，我真心希望你们一辈子也别知道。那些橙子还是向他们赊来的。我想起信封上的话，就对自己说，既然我也被偷了，为什么不能去偷？那家人雇得起两个女佣，总有东西可拿。所以我来了。可这些猫已经把我领回了诚实的路。从今往后，我再也不干了。

    - id: ch04
      title: 一点钟以后的愿望
      blocks:
        - id: ch04-b01
          speaker: cyril
          text: 听我说，这些猫很值钱，真的很值钱。你只要肯全都带走，我们就把它们送给你。
        - id: ch04-b02
          speaker: burglar
          text: 看得出都是有品种的猫，可我不想再惹警察。老实说，这些猫来路正不正？
        - id: ch04-b03
          speaker: anthea
          text: 全是我们自己的，是我们自己想要的。只是这一批……
        - id: ch04-b04
          speaker: cyril
          text: 是一批货。数量比我们想要的多了一点，也麻烦得多。你有小车，再找几个袋子或篮子，你嫂子一定会特别高兴。爸爸说过，一只波斯猫就值好多好多英镑。
        - id: ch04-b05
          speaker: narrator
          text: 窃贼看看那些吃饱后安静下来的波斯猫，又看看面前几个筋疲力尽的孩子。安西娅说他们遇上了麻烦，这句话显然打动了他。
        - id: ch04-b06
          speaker: burglar
          text: 好吧，看得出你们确实遇上了难处，我也不介意帮忙。我不问猫是怎么来的。不过我认识一个懂猫的人。我去叫他来。只要他说这些猫不只是值一张猫皮的钱，我就帮你们带走。
        - id: ch04-b07
          speaker: jane
          text: 你不会走了就不回来吧？那样的话，我觉得自己真受不了。
        - id: ch04-b08
          speaker: narrator
          text: 窃贼被她的感情深深打动，郑重而多情地发誓，不论自己是活着还是死了，他都会回来。说完，他便走了。
        - id: ch04-b09
          speaker: narrator
          text: 西里尔和罗伯特打发女孩们上床，自己坐着等他。没过多久，硬撑着不睡便显得很荒唐，两个人不知不觉还是睡着了。不过窃贼偷偷敲响窗户时，他们倒立刻醒来。他果然守信回来了，还带着那个懂猫的朋友、一辆小车和许多口袋。
        - id: ch04-b10
          speaker: narrator
          text: 猫儿吃饱喝足，带着波斯式的满足昏昏欲睡。那个朋友仔细看过，觉得这些猫很不错。于是几个大人和男孩一起，把猫装进口袋，再一袋袋抬上小车。猫当然还在叫，可叫声又困又轻，已经不至于引起外面行人的注意。
        - id: ch04-b11
          speaker: burglar
          text: 我现在成了销赃的，就是收受赃物的那种人。真没想到，我会堕落到这一步，全怪自己心肠太好。
          emotion: sad
        - id: ch04-b12
          speaker: narrator
          text: 西里尔知道，“销赃的”就是收受赃物的人。他也知道这些猫根本不是偷来的，于是毫不迟疑，十分爽快地回答了窃贼。
        - id: ch04-b13
          speaker: cyril
          text: 我拿自己的人格担保，这些猫绝不是偷来的。现在几点了？
        - id: ch04-b14
          speaker: burglar_friend
          text: 我没带钟。刚才经过“公牛与大门”酒馆时，他们正赶客人。我看差不多一点了。
        - id: ch04-b15
          speaker: narrator
          text: 猫全搬走以后，两个男孩和窃贼站在门边，又说了许多热情而友好的话。他们一遍遍告别，终于还是分开了。小车载着一袋袋波斯猫离开，屋里一下空了许多，只剩下那头泽西母牛。
        - id: ch04-b16
          speaker: robert
          text: 它只能留在这里过夜。明早厨娘看见它，一定会大发作。
        - id: ch04-b17
          speaker: cyril
          text: 过夜？等等，如果已经一点钟，那现在就是明天早晨！我们又有一个愿望了！
          emotion: surprised
        - id: ch04-b18
          speaker: narrator
          text: 两人赶紧写好一张纸条，催地毯把母牛送回它原本属于的地方，然后再回到育儿室地板上的老位置。可不论他们怎么想办法，母牛就是不肯踏上地毯。罗伯特只好跑进后厨房，取来一根晾衣绳。他把绳子的一头牢牢绑住牛角，另一头系在拢起来的一只地毯角上。
        - id: ch04-b19
          speaker: robert
          text: 出发吧。
        - id: ch04-b20
          speaker: narrator
          text: 罗伯特的话刚说完，地毯和母牛便一起消失了。两个男孩这才终于上床。他们已经累得筋疲力尽，连多说一句话的力气也没有，心里却庆幸得很，这个仿佛永远过不完的夜晚，总算真正结束了。
        - id: ch04-b21
          speaker: narrator
          text: 第二天早晨，孩子们看见地毯已经平安回来了。它安安静静地铺在育儿室原来的地方，仿佛漫长的一夜里什么也没发生过。可是孩子们走近以后仔细一看，立刻发现它有一只角被撕坏得很厉害。正是昨晚用晾衣绳绑过母牛的那只角。
