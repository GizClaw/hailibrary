audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, playful, and assured
        timbre: clear and rounded
        pace: measured with lively rhythmic turns
        pitch: medium
    taffy:
      display_name: Taffy
      tts:
        delivery: bright, inventive, and eagerly direct
        timbre: clear and youthful
        pace: quick with thoughtful pauses
        pitch: medium-high
    tegumai:
      display_name: Tegumai
      tts:
        delivery: patient, playful, and warmly attentive
        timbre: rich and gently weathered
        pace: unhurried with bursts of excitement
        pitch: medium-low
    teshumai:
      display_name: Teshumai
      tts:
        delivery: practical, affectionate, and mildly amused
        timbre: warm and grounded
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: The First Sound-Pictures
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The next week, Taffimai Metallumai went carp-fishing with her Daddy again. We will still call her Taffy, Best Beloved. This was after her little mistake about Daddy's spear, the Stranger-man, and the picture-letter. Her Mummy wanted her at home to help hang hides on the great drying-poles outside their Neolithic Cave. But Taffy slipped down to the river early, and she and her Daddy fished. After a while, she began to giggle.
        - id: ch01-b02
          speaker: tegumai
          text: Don't be silly, child.
        - id: ch01-b03
          speaker: taffy
          text: But wasn't it exciting? Remember the Head Chief puffing out his cheeks? And the nice Stranger-man looked so funny with mud in his hair!
        - id: ch01-b04
          speaker: tegumai
          text: I remember very well. I had to give the Stranger-man two soft deerskins with fringes because of what we did to him.
        - id: ch01-b05
          speaker: taffy
          text: We didn't do anything. Mummy and the other Neolithic ladies did it, and the mud did too.
        - id: ch01-b06
          speaker: tegumai
          text: We won't talk about that. Let's eat lunch.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Taffy took a marrow-bone and stayed mousy-quiet for ten whole minutes. Her Daddy scratched marks on pieces of birch-bark with a shark's tooth. Then Taffy spoke.
        - id: ch01-b08
          speaker: taffy
          text: Daddy, I've thought of a secret surprise. Make a noise. Any noise at all.
        - id: ch01-b09
          speaker: tegumai
          text: Ah! Will that do for a start?
        - id: ch01-b10
          speaker: taffy
          text: Yes. You look just like a carp-fish with its mouth open. Please say it again.
        - id: ch01-b11
          speaker: tegumai
          text: Ah! Ah! Ah! Don't be rude, my daughter.
        - id: ch01-b12
          speaker: taffy
          text: >-
            I truly don't mean to be rude. It's part of my secret-surprise thinking. Say ah and leave your mouth open at the end. Lend me the tooth too. I'm going to draw a carp-fish with its mouth wide open.
        - id: ch01-b13
          speaker: tegumai
          text: What for?
        - id: ch01-b14
          speaker: taffy
          text: >-
            Don't you see? This will be our secret surprise. If I draw an open-mouthed carp-fish in the smoke at the back of our Cave, if Mummy lets me, it will remind you of the ah-noise. Then we can pretend I jumped from the dark and surprised you with it, the way I did in the beaver-swamp last winter.
        - id: ch01-b15
          speaker: tegumai
          text: Really? Go on, Taffy.
        - id: ch01-b16
          speaker: narrator
          text: He spoke in the special voice grown-ups use when they are truly paying attention.
        - id: ch01-b17
          speaker: taffy
          text: >-
            Oh, bother! I can't draw a whole carp-fish. But I can make a mark that means its mouth. You know how carp-fish stand on their heads and root in the mud. We'll pretend the rest of the fish is there. I'll draw only the mouth, and that will mean ah.
        - id: ch01-b18
          speaker: narrator
          text: Taffy scratched her first sound-picture into the bark.
        - id: ch01-b19
          speaker: tegumai
          text: >-
            That's not bad. But you forgot the feeler hanging across the carp-fish's mouth.
        - id: ch01-b20
          speaker: taffy
          text: But I can't draw, Daddy.
        - id: ch01-b21
          speaker: tegumai
          text: >-
            You only need the open mouth and the feeler across it. Then we'll know it is a carp-fish, because perch and trout don't have feelers. Look here, Taffy.
        - id: ch01-b22
          speaker: narrator
          text: Tegumai drew the mouth and its feeler on his own piece of bark.
        - id: ch01-b23
          speaker: taffy
          text: I'll copy it. When you see this, will you understand it?
        - id: ch01-b24
          speaker: tegumai
          text: Perfectly.
        - id: ch01-b25
          speaker: narrator
          text: Taffy copied the mark.
        - id: ch01-b26
          speaker: taffy
          text: >-
            Whenever I see it, I'll be just as surprised as if you had jumped from behind a tree and shouted, "Ah!"
        - id: ch01-b27
          speaker: taffy
          text: Now make another noise.
        - id: ch01-b28
          speaker: narrator
          text: Taffy was very proud.
        - id: ch01-b29
          speaker: tegumai
          text: Yah!
        - id: ch01-b30
          speaker: narrator
          text: He said it very loudly.
        - id: ch01-b31
          speaker: taffy
          text: >-
            Hmm. That's a mixed-up noise. The end is the ah sound, like the carp-fish mouth. But what can we do with the beginning? Yer-yer-yer and ah. Ya!
        - id: ch01-b32
          speaker: tegumai
          text: It sounds close to the carp-fish-mouth noise. Let's draw another part of the fish and join the two parts.
        - id: ch01-b33
          speaker: narrator
          text: Tegumai was excited now too.
        - id: ch01-b34
          speaker: taffy
          text: >-
            No, I'll forget them if they're joined. Draw the tail separately. When a carp-fish stands on its head, its tail comes first. Besides, I think tails will be easiest for me to draw.
        - id: ch01-b35
          speaker: tegumai
          text: Good idea. Here is a carp-fish tail for the yer-noise.
        - id: ch01-b36
          speaker: narrator
          text: He drew a tail.
        - id: ch01-b37
          speaker: taffy
          text: >-
            Now I'll try. Remember, I can't draw like you. Can I make only the split end of the tail, with a line hanging down where it joins the fish?
        - id: ch01-b38
          speaker: narrator
          text: She drew it. Her Daddy nodded, and his eyes shone with excitement.
        - id: ch01-b39
          speaker: taffy
          text: That's beautiful. Make another noise, Daddy.
        - id: ch01-b40
          speaker: tegumai
          text: Oh!
        - id: ch01-b41
          speaker: narrator
          text: Again, he said it very loudly.
        - id: ch01-b42
          speaker: taffy
          text: That one's easy. Your mouth goes round like an egg or a stone. An egg or a stone can stand for that sound.
        - id: ch01-b43
          speaker: tegumai
          text: We won't always find an egg or a stone. We'll have to scratch a round mark that looks like one.
        - id: ch01-b44
          speaker: narrator
          text: He drew the round mark.
        - id: ch01-b45
          speaker: taffy
          text: My gracious! We have so many noise-pictures now. A carp-mouth, a carp-tail, and an egg! Make one more noise, Daddy.
        - id: ch01-b46
          speaker: tegumai
          text: Ssh!
        - id: ch01-b47
          speaker: narrator
          text: He frowned as he said it, but Taffy was too excited to notice. She began scratching on the bark.
        - id: ch01-b48
          speaker: tegumai
          text: Eh? I only meant that I was thinking and didn't want anyone to bother me.
        - id: ch01-b49
          speaker: taffy
          text: >-
            It is still a noise. It's the sound a snake makes when it is thinking and doesn't want to be disturbed. Let's make a snake mean ssh. Will this do?
        - id: ch01-b50
          speaker: narrator
          text: She drew a snake.
        - id: ch01-b51
          speaker: taffy
          text: >-
            There. That's another secret surprise. If you draw a hissy-snake beside the door of the little back-cave where you mend spears, I'll know you're thinking hard. I'll come in mousy-quiet. If you draw it on a tree beside the river while you're fishing, I'll know to walk most, most mousy-quiet so I don't shake the banks.
        - id: ch01-b52
          speaker: tegumai
          text: >-
            Perfectly true. And this game holds more than you think. Taffy, dear, I believe your Daddy's daughter has discovered the finest thing since the Tribe of Tegumai began using shark's teeth instead of flint for spearheads. We may have found the great secret of the world.
        - id: ch01-b53
          speaker: narrator
          text: Taffy's eyes began to shine with excitement too.
        - id: ch01-b54
          speaker: taffy
          text: Why?
        - id: ch01-b55
          speaker: tegumai
          text: I'll show you. What is the Tegumai word for water?
        - id: ch01-b56
          speaker: taffy
          text: Ya, of course. It means river too, as in Wagai-ya, the Wagai River.
        - id: ch01-b57
          speaker: tegumai
          text: And what do we call the bad black water in a swamp, the water that gives you fever if you drink it?
        - id: ch01-b58
          speaker: taffy
          text: Yo, of course.
        - id: ch01-b59
          speaker: tegumai
          text: Now suppose you found this scratched beside a pool in the beaver-swamp.
        - id: ch01-b60
          speaker: narrator
          text: He drew a carp-tail followed by a round egg.
        - id: ch01-b61
          speaker: taffy
          text: >-
            A carp-tail and a round egg. Two sounds put together! Yo means bad water. I wouldn't drink from that pool, because I would know you said the water was bad.
        - id: ch01-b62
          speaker: tegumai
          text: But I would not need to be by the water. I might be hunting miles away, and still...
        - id: ch01-b63
          speaker: taffy
          text: >-
            And still the marks would speak as if you stood there saying, "Go away, Taffy, or you'll catch a fever." A carp-fish tail and a round egg can say all that! Oh, Daddy, we must tell Mummy quickly!
        - id: ch01-b64
          speaker: narrator
          text: Taffy danced all around him.
        - id: ch01-b65
          speaker: tegumai
          text: >-
            Not yet. We must go a little farther first. Now, yo means bad water. But so means food cooked over the fire, doesn't it?
        - id: ch01-b66
          speaker: narrator
          text: He drew a snake followed by the egg mark.
        - id: ch01-b67
          speaker: taffy
          text: >-
            Yes. Snake and egg makes so, and so says that dinner is ready. If you found it scratched on a tree, you would know it was time to come home to the Cave. So would I.
        - id: ch01-b68
          speaker: tegumai
          text: >-
            My Winkie! That's true as well. But wait. I see a problem. So means, "Come and eat dinner," while sho means the drying-poles where we hang our hides.
    - id: ch02
      title: The Secret of Written Words
      blocks:
        - id: ch02-b01
          speaker: taffy
          text: >-
            Horrid old drying-poles! I hate hanging heavy, hot, hairy hides on them. What if you drew the snake and egg, and I thought dinner was ready, but when I came out of the wood Mummy wanted me to help hang two hides? What would I do then?
        - id: ch02-b02
          speaker: tegumai
          text: >-
            You would be cross, and Mummy would be cross too. We need a new picture for sho. We could draw a spotted snake that says sh-sh, and let the plain snake say ssss.
        - id: ch02-b03
          speaker: taffy
          text: >-
            I might put the spots in the wrong places. Or you might be in a hurry and leave them out. Then I would read so instead of sho, and Mummy would catch me anyway. No! Let's draw the horrid tall drying-poles themselves so there can be no mistake. I'll put them just after the hissy-snake. Look!
        - id: ch02-b04
          speaker: narrator
          text: Taffy drew the drying-poles.
        - id: ch02-b05
          speaker: tegumai
          text: >-
            That may be safest. It looks very much like our drying-poles. Now I'll make a new word with the snake sound and the drying-pole sound. Shi. In Tegumai-talk, shi means spear.
        - id: ch02-b06
          speaker: narrator
          text: Tegumai laughed.
        - id: ch02-b07
          speaker: taffy
          text: Don't make fun of me. You draw it, Daddy.
        - id: ch02-b08
          speaker: narrator
          text: She was remembering her picture-letter and the mud in the Stranger-man's hair.
        - id: ch02-b09
          speaker: tegumai
          text: No beavers or hills this time, eh? I'll use one straight line for my spear.
        - id: ch02-b10
          speaker: narrator
          text: He drew it.
        - id: ch02-b11
          speaker: taffy
          text: Even Mummy couldn't mistake that for a picture of me being killed.
        - id: ch02-b12
          speaker: taffy
          text: Please don't talk about that, Daddy. It makes me uncomfortable. Make more noises. We're doing beautifully.
        - id: ch02-b13
          speaker: tegumai
          text: Er-hm! Let us try shu. That means sky.
        - id: ch02-b14
          speaker: narrator
          text: Taffy drew the snake and the drying-pole, and then she stopped.
        - id: ch02-b15
          speaker: taffy
          text: We need a different picture for the last sound, don't we?
        - id: ch02-b16
          speaker: tegumai
          text: Shu-shu-u-u-u! Why, it sounds like the round egg's O-sound stretched thin.
        - id: ch02-b17
          speaker: taffy
          text: Then we could draw a thin round egg and pretend it is a frog that hasn't eaten for years.
        - id: ch02-b18
          speaker: tegumai
          text: >-
            N-no. If we drew it quickly, we might confuse it with the round egg. Shu-shu-shu! I know. We'll leave a little opening at the end of the egg, to show the O-sound running out thin. Ooo-oo-oo. Like this.
        - id: ch02-b19
          speaker: narrator
          text: He drew the new mark.
        - id: ch02-b20
          speaker: taffy
          text: Oh, that's lovely! Much better than a thin frog. Go on.
        - id: ch02-b21
          speaker: narrator
          text: >-
            Taffy scratched with her shark's tooth while her Daddy kept drawing. His hand shook with excitement. At last, he set down a whole row of marks.
        - id: ch02-b22
          speaker: tegumai
          text: >-
            Don't look up, Taffy. See if you can work out what this says in Tegumai-talk. If you can, then we have found the Secret.
        - id: ch02-b23
          speaker: taffy
          text: >-
            Snake, pole, broken egg, carp-tail, and carp-mouth. Shu-ya. Sky-water. Rain.
        - id: ch02-b24
          speaker: narrator
          text: Just then, a drop fell on Taffy's hand. The sky had clouded over.
        - id: ch02-b25
          speaker: taffy
          text: Why, Daddy, it's raining! Is that what you meant to tell me?
        - id: ch02-b26
          speaker: tegumai
          text: Of course. And I told you without saying a word, didn't I?
        - id: ch02-b27
          speaker: taffy
          text: >-
            I think I would have understood in another minute, but the raindrop made me certain. I'll always remember now. Shu-ya means rain, or that rain is coming. Why, Daddy! If you left before I woke and drew shu-ya in the smoke on the wall, I would know it might rain and take my beaver-skin hood. Wouldn't Mummy be surprised?
        - id: ch02-b28
          speaker: narrator
          text: Taffy sprang up and danced around him. Tegumai stood and danced too. Daddies did not mind doing such things in those days.
        - id: ch02-b29
          speaker: tegumai
          text: >-
            There is more! Much more! Suppose I wanted to say that the rain would soon end and you should come down to the river. What would we draw? First, say it in Tegumai-talk.
        - id: ch02-b30
          speaker: taffy
          text: >-
            Shu-ya-las, ya maru. Sky-water ending. Come to the river. That's a great many new sounds. I don't know how we can draw them.
        - id: ch02-b31
          speaker: tegumai
          text: >-
            But I do! Just pay attention for one more minute, and then we will stop for today. We already know shu-ya. The hard part is las. La-la-la.
        - id: ch02-b32
          speaker: narrator
          text: He waved his shark's tooth as he thought.
        - id: ch02-b33
          speaker: taffy
          text: >-
            The hissy-snake gives us the sound at the end. Put the carp-mouth before it and we have as-as-as. All we still need is la-la.
        - id: ch02-b34
          speaker: tegumai
          text: >-
            I know, but we must invent la-la. Taffimai, we are the first people in the whole world who have ever tried to do this!
        - id: ch02-b35
          speaker: narrator
          text: Taffy was growing tired, and she yawned.
        - id: ch02-b36
          speaker: taffy
          text: Las can mean breaking or finishing as well as ending, can't it?
        - id: ch02-b37
          speaker: tegumai
          text: >-
            It can. To-las means there is no water in the tank for Mummy to cook with, which always happens just when I am going hunting.
        - id: ch02-b38
          speaker: taffy
          text: >-
            And shi-las means your spear is broken. If I had only thought of that instead of drawing silly beaver pictures for the Stranger-man!
        - id: ch02-b39
          speaker: tegumai
          text: La! La! La! Oh, bother!
        - id: ch02-b40
          speaker: narrator
          text: Tegumai waved his stick and frowned.
        - id: ch02-b41
          speaker: taffy
          text: >-
            I could have drawn shi easily. Then I would have drawn your spear broken, like this!
        - id: ch02-b42
          speaker: narrator
          text: Taffy made the picture.
        - id: ch02-b43
          speaker: tegumai
          text: >-
            That's the very thing! That mark is la from end to end, and it does not look like any of our other marks.
        - id: ch02-b44
          speaker: narrator
          text: Tegumai copied it.
    - id: ch03
      title: Words in a String
      blocks:
        - id: ch03-b01
          speaker: tegumai
          text: >-
            Now we need ya, but we have already made that. Next comes maru. Mum-mum-mum. The mum sound closes your mouth, so we will draw a closed mouth.
        - id: ch03-b02
          speaker: narrator
          text: He drew one.
        - id: ch03-b03
          speaker: tegumai
          text: Then comes the open carp-mouth. Together they make ma-ma-ma. But what can we do with that rrrrr sound, Taffy?
        - id: ch03-b04
          speaker: taffy
          text: >-
            It sounds rough and jagged, like your shark-tooth saw when you cut a plank for the canoe.
        - id: ch03-b05
          speaker: tegumai
          text: You mean sharp along the edge, like this?
        - id: ch03-b06
          speaker: narrator
          text: He drew a row of teeth.
        - id: ch03-b07
          speaker: taffy
          text: Exactly. But we don't need all those teeth. Just put in two.
        - id: ch03-b08
          speaker: tegumai
          text: >-
            I'll use only one. If our game becomes what I believe it will, the easier we make these sound-pictures, the better it will be for everyone.
        - id: ch03-b09
          speaker: narrator
          text: He drew one sharp tooth.
        - id: ch03-b10
          speaker: tegumai
          text: Now we have the whole message! I'll draw all the marks in a line, like fish on a string.
        - id: ch03-b11
          speaker: narrator
          text: He stood on one leg as he said it.
        - id: ch03-b12
          speaker: taffy
          text: >-
            Shouldn't we put a little piece of stick between the words? Otherwise they may rub and bump against each other like carp-fish.
        - id: ch03-b13
          speaker: tegumai
          text: I'll leave a space instead.
        - id: ch03-b14
          speaker: narrator
          text: >-
            In great excitement, he took a fresh piece of birch-bark and drew the marks without stopping.
        - id: ch03-b15
          speaker: taffy
          text: Shu-ya-las ya-maru. The rain is ending. Come to the river.
        - id: ch03-b16
          speaker: narrator
          text: She read the message one sound at a time.
        - id: ch03-b17
          speaker: tegumai
          text: >-
            That is enough for today. Besides, you're tired, Taffy. Never mind, dear. We will finish everything tomorrow. Then people will remember us for years and years after the biggest trees you can see have all been chopped into firewood.
        - id: ch03-b18
          speaker: narrator
          text: >-
            They went home. All evening, Tegumai sat on one side of the fire and Taffy sat on the other. They drew ya and yo and shu and shi in the smoke on the wall, giggling together, until Teshumai spoke.
        - id: ch03-b19
          speaker: teshumai
          text: Really, Tegumai, you are worse than Taffy.
        - id: ch03-b20
          speaker: taffy
          text: >-
            Please don't mind us, Mummy dear. It is only our secret surprise. We will tell you everything the moment it is finished. But please don't ask what it is now, or I will have to tell you.
        - id: ch03-b21
          speaker: narrator
          text: So her Mummy took great care not to ask.
    - id: ch04
      title: The Alphabet Completed
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Bright and early the next morning, Tegumai went down to the river to think of more sound-pictures. When Taffy woke, she found ya-las chalked on the side of the great stone water-tank outside the Cave. Ya-las meant the water was ending, or running out.
        - id: ch04-b02
          speaker: taffy
          text: >-
            Hmm. These picture-sounds can be rather troublesome! Daddy might as well have come here and told me himself to fetch more water for Mummy's cooking.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Taffy took a bark bucket to the spring behind the house and filled the tank. Then she ran down to the river and pulled her Daddy's left ear, the ear that belonged to her whenever she had been good.
        - id: ch04-b04
          speaker: tegumai
          text: Come along. Today we'll draw all the sound-pictures we still need.
        - id: ch04-b05
          speaker: narrator
          text: >-
            They spent a most exciting day at it, drawing every sound-picture still left over from the day before. In the middle, they stopped for a beautiful lunch and played two games of romps. Then they went straight back to work. When they reached the T-sound, Taffy had an idea.
        - id: ch04-b06
          speaker: taffy
          text: >-
            My name begins with that sound. So does yours, and so does Mummy's. We should draw the three of us holding hands, like a family group.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The family group worked well the first time and the second. It showed Taffy, Tegumai, and Teshumai together, all holding hands. But after drawing it six or seven times, Taffy and Tegumai made it scratchier and scratchier. At last, their T-sound was only a thin, tall Tegumai with his arms stretched out to hold Taffy and Teshumai. That is how the three pictures changed.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Many of their first pictures were far too beautiful, especially the ones they invented before lunch. As they drew each one over and over on piece after piece of birch-bark, it grew plainer and easier. In the end, even Tegumai looked over the simple marks and could find nothing wrong with them.
        - id: ch04-b09
          speaker: narrator
          text: >-
            They turned the hissy-snake around for the Z-sound, so it seemed to hiss backward in a soft, gentle way. They used a simple twiddle for E because that sound appeared so often. For B, they drew the sacred Beaver of the Tegumais. For the nasty, nosy N-sound, they drew noses until they were tired of them.
        - id: ch04-b10
          speaker: narrator
          text: >-
            The greedy Ga-sound became the open mouth of the great lake-pike. For the scratchy, hurting Ka-sound, they drew the pike's mouth again with a spear behind it. A little bend of the winding Wagai River became the pleasant, windy Wa-sound. They went on like that until they had made every sound-picture they wanted. And there it stood, the whole Alphabet, complete.
    - id: ch05
      title: Taffy Dancing Through the Fern
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Thousands upon thousands of years passed. Hieroglyphics came, and Demotics, Nilotics, Cryptics, Cufics, Runics, Dorics, and Ionics. There were all kinds of other ricks and tricks too, because the Woons, the Neguses, the Akhoonds, and the Keepers of Tradition could never leave a good thing alone once they found it.
        - id: ch05-b02
          speaker: narrator
          text: >-
            After all that time, the fine old easy Alphabet came back to its proper, understandable shape. A, B, C, D, E, and all the rest were ready for every Best Beloved to learn when old enough.
        - id: ch05-b03
          speaker: narrator
          text: >-
            But I remember Tegumai Bopsulai, Taffimai Metallumai, and her dear Mummy, Teshumai Tewindrow. I remember all those days gone by. And it happened so, just so, a little time ago, on the banks of the great Wagai.
        - id: ch05-b04
          speaker: narrator
          text: |-
            Of all the Tribe of Tegumai
            Who cut that figure, none remain.
            On Merrow Down the cuckoos cry.
            The silence and the sun remain.

            But as the faithful years return
            And hearts unwounded sing again,
            Comes Taffy dancing through the fern
            To lead the Surrey spring again.

            Her brows are bound with bracken-fronds,
            And golden elf-locks fly above.
            Her eyes are bright as diamonds,
            And bluer than the skies above.

            In moccasins and deer-skin cloak,
            Unfearing, free, and fair she flits,
            And lights her little damp-wood smoke
            To show her Daddy where she flits.
        - id: ch05-b05
          speaker: narrator
          text: |-
            For far, oh, very far behind,
            So far she cannot call to him,
            Comes Tegumai alone to find
            The daughter that was all to him.
