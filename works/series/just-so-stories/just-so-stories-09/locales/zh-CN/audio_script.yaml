audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖俏皮，语气笃定
        timbre: 清亮圆润
        pace: 从容，遇到韵律段落时轻快
        pitch: 中
    taffy:
      display_name: 塔菲
      tts:
        delivery: 热心直率，满怀自信和奇思妙想
        timbre: 明亮稚嫩
        pace: 轻快活泼
        pitch: 高
    tegumai:
      display_name: 泰古迈
      tts:
        delivery: 耐心慈爱，带着不动声色的幽默
        timbre: 温暖结实
        pace: 从容
        pitch: 中低
    teshumai:
      display_name: 泰舒迈
      tts:
        delivery: 爽利爱问，对家人热烈又护短
        timbre: 清晰饱满
        pace: 明快
        pitch: 中
  chapters:
    - id: ch01
      title: 鲤鱼嘴的声音
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            图画信惹出那场误会之后，才过了一个星期，塔菲又跟爸爸去叉鲤鱼了。妈妈本来要她留在新石器时代洞穴外面，帮着把兽皮挂上大晾皮架晒干。塔菲却一早就溜到爸爸身边，跟他钓起鱼来。钓了一会儿，她想起上次的事，忽然咯咯笑了起来。
        - id: ch01-b02
          speaker: tegumai
          text: 孩子，别犯傻。
        - id: ch01-b03
          speaker: taffy
          text: >-
            可那件事真带劲！大酋长把腮帮子鼓得圆圆的，你不记得啦？还有那个好心的陌生男人，头发里全是泥，样子多好笑呀！
        - id: ch01-b04
          speaker: tegumai
          text: >-
            我当然记得。为了大家对他做的那些事，我还赔了他两张带穗边的软鹿皮呢。
        - id: ch01-b05
          speaker: taffy
          text: 我们俩什么也没做。那是妈妈和新石器时代夫人们干的，还有那些泥巴。
        - id: ch01-b06
          speaker: tegumai
          text: 这事不说了。咱们吃午饭吧。
        - id: ch01-b07
          speaker: narrator
          text: >-
            塔菲拿起一根骨髓骨，像小老鼠一样安静了整整十分钟。泰古迈用鲨鱼牙在一片片白桦树皮上刻画。塔菲看着看着，又有了主意。
        - id: ch01-b08
          speaker: taffy
          text: 爸爸，我想出一个秘密惊喜。你发个声音吧，什么声音都行。
        - id: ch01-b09
          speaker: tegumai
          text: 啊！先用这个，行不行？
        - id: ch01-b10
          speaker: taffy
          text: 行。你现在像极了一条张嘴的鲤鱼。请你再说一遍。
        - id: ch01-b11
          speaker: tegumai
          text: 啊！啊！啊！女儿，不许没礼貌。
        - id: ch01-b12
          speaker: taffy
          text: >-
            我真的不是故意没礼貌。这是秘密惊喜的一部分。你说完“啊”，先把嘴张着，再把鲨鱼牙借给我。我要画一张大张着的鲤鱼嘴。
        - id: ch01-b13
          speaker: tegumai
          text: 画它有什么用？
        - id: ch01-b14
          speaker: taffy
          text: >-
            这就是我们的秘密呀。只要妈妈不反对，我就在洞穴后墙的烟灰里画一条张嘴的鲤鱼。你一看见它，就会想起“啊”的声音。咱们还可以假装，是我从黑暗里跳出来，用这个声音吓你，就像去年冬天我在海狸沼泽里做的那样。
        - id: ch01-b15
          speaker: tegumai
          text: 真的吗？好，你接着说，塔菲。
        - id: ch01-b16
          speaker: taffy
          text: >-
            糟糕，我画不出整条鲤鱼。不过，我可以画个东西来表示它的嘴。鲤鱼不是会头朝下，在泥里拱来拱去吗？咱们假装其余的身子也画好了，只留下这张嘴。它表示“啊”。
        - id: ch01-b17
          speaker: narrator
          text: >-
            塔菲刻下了第一个图形，只画鲤鱼张开的嘴，假装整条鱼都在那里。泰古迈也拿起一片树皮，照着刻了一遍。
        - id: ch01-b18
          speaker: tegumai
          text: 画得不坏。不过你漏了鲤鱼嘴上那根横着的须。
        - id: ch01-b19
          speaker: taffy
          text: 可我不会画呀，爸爸。
        - id: ch01-b20
          speaker: tegumai
          text: >-
            不用画整条鱼。只要画张开的嘴，再横上一根须，咱们就认得出它是鲤鱼。鲈鱼和鳟鱼可没有须。看，我这样画。
        - id: ch01-b21
          speaker: taffy
          text: 我也照着画一遍。你以后看见它，真的能明白吗？
        - id: ch01-b22
          speaker: tegumai
          text: 完全明白。
        - id: ch01-b23
          speaker: taffy
          text: >-
            那我不管在哪里看见它，都会像你突然从树后跳出来，对我喊“啊”那样吃一惊。现在，再发一个声音！
        - id: ch01-b24
          speaker: narrator
          text: >-
            塔菲画好第三个图形，得意极了。她说，以后看见它，准会像爸爸从树后跳出来喊她那样吃惊。接着，她又叫爸爸发一个声音。泰古迈照她说的，扯着嗓子喊了一声“呀”。
        - id: ch01-b25
          speaker: taffy
          text: >-
            嗯，这是两个声音混在一起。后半截是鲤鱼嘴的“啊”，前半截要怎么办？咿——咿——咿，再加上啊，就成了呀！
        - id: ch01-b26
          speaker: tegumai
          text: 它跟鲤鱼嘴很像。再画一截鲤鱼，跟嘴接起来吧。
        - id: ch01-b27
          speaker: narrator
          text: 这一下，连泰古迈也兴奋起来了。
        - id: ch01-b28
          speaker: taffy
          text: >-
            不行，连在一起我会忘。分开画它的尾巴吧。鲤鱼头朝下时，尾巴就在前面。而且我觉得，尾巴最好画。
        - id: ch01-b29
          speaker: tegumai
          text: 好主意。这条鲤鱼尾巴就表示“咿”。
        - id: ch01-b30
          speaker: taffy
          text: >-
            让我来试试。你知道我没你画得好。只画尾巴分叉的地方，再添一条向下的线，表示它跟身子接在一起，行吗？
        - id: ch01-b31
          speaker: narrator
          text: >-
            塔菲只画了尾巴分叉的部分，又添一条向下的线，表示尾巴连着鱼身。爸爸点了点头，眼睛兴奋得亮晶晶的。塔菲夸那幅图真漂亮，又催他发一个声音。泰古迈大声喊了一个“哦”。
        - id: ch01-b32
          speaker: taffy
          text: >-
            这个容易。你发“哦”时，嘴巴圆得像鸡蛋，也像石头。咱们用鸡蛋或石头表示它吧。
        - id: ch01-b33
          speaker: tegumai
          text: 鸡蛋和石头不能随时找到。咱们得刻一个圆圆的图形。
        - id: ch01-b34
          speaker: narrator
          text: >-
            泰古迈说，不能每次都去找真的鸡蛋和石头，于是在树皮上刻了一个圆。塔菲数着鲤鱼嘴、鲤鱼尾巴和鸡蛋，惊叹他们已经造出这么多声音图画。她还想要一个声音。泰古迈正在思考，皱着眉“嘘”了一声，可塔菲兴奋得没看出爸爸只是不想受打扰。
        - id: ch01-b35
          speaker: taffy
          text: 这个也容易！
        - id: ch01-b36
          speaker: tegumai
          text: 咦？我是在想事情，不愿让人打扰。
        - id: ch01-b37
          speaker: taffy
          text: >-
            可“嘘”还是个声音。蛇在想事情、不想让人打扰时，就会这样响。咱们用蛇来表示它吧。
        - id: ch01-b38
          speaker: narrator
          text: 她画出了第七个图形，一条嘶嘶叫的蛇。
        - id: ch01-b39
          speaker: taffy
          text: >-
            这也是秘密惊喜。你在修鱼叉的后洞门边画一条蛇，我就知道你在认真想事，会像小老鼠一样悄悄进去。你钓鱼时在河边树上画一条，我就知道自己该走得特别安静，免得震动河岸。
        - id: ch01-b40
          speaker: tegumai
          text: >-
            对极了。不过，这个游戏里面藏着的东西，比你想的还要多。亲爱的塔菲，你爸爸的女儿也许想出了世上最好的东西。自从泰古迈部落不用燧石，改用鲨鱼牙做矛头以来，还没有过这么大的事。我想，咱们找到了世界的大秘密。
    - id: ch02
      title: 天空的水
      blocks:
        - id: ch02-b01
          speaker: taffy
          text: 为什么呀？
        - id: ch02-b02
          speaker: narrator
          text: 塔菲看着这些刚造出来的图形，眼睛也兴奋得发亮。泰古迈决定让她亲眼看看这个秘密究竟有多大。
        - id: ch02-b03
          speaker: tegumai
          text: 泰古迈话里的“水”怎么说？
        - id: ch02-b04
          speaker: taffy
          text: 当然是“呀”。它也表示河。比如“瓦盖呀”，就是瓦盖河。
        - id: ch02-b05
          speaker: tegumai
          text: 那种喝了会发烧的坏水呢？黑水、沼泽水，怎么说？
        - id: ch02-b06
          speaker: taffy
          text: 当然是“哟”。
        - id: ch02-b07
          speaker: tegumai
          text: 那你想想，要是在海狸沼泽的水潭边看见这个图呢？
        - id: ch02-b08
          speaker: narrator
          text: 泰古迈把鲤鱼尾巴和圆鸡蛋画到了一起。
        - id: ch02-b09
          speaker: taffy
          text: >-
            两个声音合起来，就是“哟”，坏水。我当然不会喝。因为我一看就知道，你说这水不好。
        - id: ch02-b10
          speaker: tegumai
          text: 可我根本不用待在水边。哪怕我在几英里外打猎，这幅图还是能……
        - id: ch02-b11
          speaker: taffy
          text: >-
            还是能像你站在那里说“走开，塔菲，不然会发烧”一样！一条鲤鱼尾巴加一个圆鸡蛋，居然能说这么多话。爸爸，快去告诉妈妈！
        - id: ch02-b12
          speaker: narrator
          text: 塔菲高兴得绕着爸爸跳起舞来。泰古迈却说，还得再试一试。
        - id: ch02-b13
          speaker: tegumai
          text: >-
            “哟”是坏水。可“嗦”是火上煮熟的食物，对吧？你看，我把蛇和鸡蛋画在一起。
        - id: ch02-b14
          speaker: taffy
          text: >-
            对，这就是晚饭好了。你在树上看见它，就知道该回洞穴吃饭。我看见了也一样。
        - id: ch02-b15
          speaker: tegumai
          text: >-
            我的温基，你又说对了！可是有个麻烦。“嗦”是来吃晚饭，“硕”却是挂兽皮的晾皮架。
        - id: ch02-b16
          speaker: taffy
          text: >-
            那些晾皮架最讨厌了！我恨不得离又沉、又热、又毛茸茸的兽皮远远的。万一你画了蛇和鸡蛋，我以为是开饭，跑回来才发现妈妈要我挂两张兽皮，我怎么办？
        - id: ch02-b17
          speaker: tegumai
          text: >-
            你会生气，妈妈也会。那就给“硕”另造一幅图。带斑点的蛇发“嘘——嘘”，没有斑点的蛇只会“嘶——”。
        - id: ch02-b18
          speaker: taffy
          text: >-
            我不一定能把斑点画对。你要是画得急，可能还会漏掉斑点。到时候我还是把“硕”看成“嗦”，照样会被妈妈逮住。咱们干脆把那讨厌的高晾皮架原样画下来，接在蛇后面。这样肯定不会错。
        - id: ch02-b19
          speaker: narrator
          text: >-
            塔菲把高高的晾皮架接在蛇后面，画出了第十个图形。泰古迈笑了，说它确实很像自家的晾皮架。他把蛇声和晾皮架声合到一起，发出了“希”。在泰古迈话里，“希”就是鱼叉。说到鱼叉，爸爸又想起了那封惹祸的图画信。
        - id: ch02-b20
          speaker: taffy
          text: >-
            别取笑我。那会让我想起图画信，还有陌生男人头发里的泥巴。爸爸，这次你来画。
        - id: ch02-b21
          speaker: tegumai
          text: 这回不用海狸，也不用小山。我给鱼叉画一条直线就够了。
        - id: ch02-b22
          speaker: narrator
          text: >-
            泰古迈只画了一条直线来表示鱼叉，成了第十一幅图。他还笑着说，这回没有海狸和小山，连妈妈也不会误以为塔菲给人杀死了。这话听得塔菲很不自在。
        - id: ch02-b23
          speaker: taffy
          text: >-
            爸爸，别说啦，听着怪不自在的。再发些声音吧，咱们做得多漂亮呀！
        - id: ch02-b24
          speaker: tegumai
          text: 那就说“舒”。这个词表示天空。
        - id: ch02-b25
          speaker: narrator
          text: 塔菲先画嘶嘶蛇，再画晾皮架，画到最后却停住了。
        - id: ch02-b26
          speaker: taffy
          text: “舒”最后那个声音，还需要一幅新图，对吧？
        - id: ch02-b27
          speaker: tegumai
          text: 舒——舒——呜——呜！这个声音不就是圆鸡蛋的声音变细了吗？
        - id: ch02-b28
          speaker: taffy
          text: 那就画一个瘦鸡蛋，假装它是好多年没吃过东西的青蛙。
        - id: ch02-b29
          speaker: tegumai
          text: >-
            不行。画得急了，会把它看成圆鸡蛋。我有办法了。在圆鸡蛋末端开个小口，表示“哦”的声音从那里细细地跑出去。呜——呜——呜，就是这样。
        - id: ch02-b30
          speaker: taffy
          text: 真好看！比瘦青蛙强多了。接着画，爸爸。
        - id: ch02-b31
          speaker: narrator
          text: >-
            塔菲握着自己的鲨鱼牙，催爸爸继续。泰古迈的手兴奋得发抖。他把蛇、晾皮架、破口的圆鸡蛋、鲤鱼尾巴和鲤鱼嘴一个个画下去，一直画出了第十三幅图。然后他叫塔菲别抬头，要她猜一猜图里的泰古迈话。如果猜得出，他们就真的找到了秘密。
        - id: ch02-b32
          speaker: taffy
          text: >-
            蛇、架子、破口鸡蛋、鲤鱼尾巴和鲤鱼嘴。舒——呀。天空的水，就是雨。咦，爸爸，真的下雨了！你就是要告诉我这个吗？
        - id: ch02-b33
          speaker: narrator
          text: 天已经阴了下来，恰好有一滴雨落在塔菲手上。
        - id: ch02-b34
          speaker: tegumai
          text: 当然。我一个字也没说，却把这件事告诉你了。
        - id: ch02-b35
          speaker: taffy
          text: >-
            就算没有雨滴，我很快也能猜到。不过这滴雨落在手上，我就完全确定了。现在我会一直记得，“舒——呀”表示雨，也表示要下雨。要是我还没醒，你就出了门，只要在洞穴墙上的烟灰里画下它，我一睁眼就知道天气，也知道该带上海狸皮兜帽。妈妈看见我自己明白了，一定会大吃一惊！
        - id: ch02-b36
          speaker: narrator
          text: >-
            塔菲绕着爸爸跳舞，泰古迈也站起来跳。在那个年代，爸爸们做这种事一点也不介意。
        - id: ch02-b37
          speaker: tegumai
          text: >-
            还不止这些！假如我要告诉你，雨不会下很久，你得下来到河边，咱们要画什么？先用泰古迈话说出来。
        - id: ch02-b38
          speaker: taffy
          text: >-
            舒——呀——拉斯，呀——马鲁。意思是，天空的水结束，到河边来。这里有好多新声音，我不知道该怎么画。
        - id: ch02-b39
          speaker: tegumai
          text: >-
            可我知道！你再专心一会儿，做完这个，今天就不画了。“舒——呀”已经有了，现在难的是“拉斯”。拉——拉——拉……
    - id: ch03
      title: 一串像鱼的词
      blocks:
        - id: ch03-b01
          speaker: taffy
          text: >-
            “拉斯”的末尾是嘶嘶蛇，蛇前面还有鲤鱼嘴，合起来是“阿斯”。咱们只缺“拉——拉”。
        - id: ch03-b02
          speaker: tegumai
          text: >-
            我知道，可这个“拉——拉”必须由咱们造出来。塔菲迈，全世界从来没人试过，咱们是头两个！
        - id: ch03-b03
          speaker: narrator
          text: 塔菲有点累了，忍不住打了个哈欠。
        - id: ch03-b04
          speaker: taffy
          text: “拉斯”除了表示结束，也表示折断或用完，对不对？
        - id: ch03-b05
          speaker: tegumai
          text: >-
            没错。“托——拉斯”就是说水槽里没有水给妈妈做饭了，而且偏偏赶上我要去打猎的时候。
        - id: ch03-b06
          speaker: taffy
          text: >-
            “希——拉斯”就是说你的鱼叉断了。我要是早想到这个，就不必给陌生男人画那些傻乎乎的海狸图了。
        - id: ch03-b07
          speaker: narrator
          text: >-
            泰古迈皱着眉，挥动手里的小棍，一遍遍念着“拉”。塔菲却还在惋惜。要是上回她先画出表示鱼叉的“希”，再把鱼叉画断，就用不着画那些叫陌生男人误会的海狸。她说着，当场画了一柄断鱼叉。泰古迈一看，难题解开了。
        - id: ch03-b08
          speaker: taffy
          text: >-
            “希”本来很好画。接着，只要把你的鱼叉画成断掉的样子，像这样！
        - id: ch03-b09
          speaker: tegumai
          text: >-
            就是它！这幅图正好表示“拉”，还跟别的记号全都不一样。
        - id: ch03-b10
          speaker: narrator
          text: >-
            他们有了“拉”，又用先前的鲤鱼尾巴和鲤鱼嘴拼出了“呀”。接下来，该想办法画出“马鲁”了。
        - id: ch03-b11
          speaker: tegumai
          text: >-
            姆——姆——姆。发“姆”的时候，人的嘴闭起来。那就画一张闭着的嘴。后面添上张开的鲤鱼嘴，就成了“马——马——马”。可那个颤巍巍的“尔”声该怎么办？
        - id: ch03-b12
          speaker: taffy
          text: >-
            它听起来又粗糙又带棱角，像你用鲨鱼牙锯子锯独木舟的木板。
        - id: ch03-b13
          speaker: tegumai
          text: 是不是四边都尖尖的，像我画的这样？
        - id: ch03-b14
          speaker: taffy
          text: 对极了。不过不用留这么多锯齿，两个就够啦。
        - id: ch03-b15
          speaker: tegumai
          text: >-
            我只留一个。如果这个游戏真会变成我想的那样，声音图画越简单，对大家越好。
        - id: ch03-b16
          speaker: narrator
          text: >-
            最后一个图形也画好了。泰古迈单脚站着，准备把所有图形排成一串。
        - id: ch03-b17
          speaker: taffy
          text: >-
            每个词中间最好放一小截棍子什么的。这样它们就不会像一群鲤鱼那样，互相擦碰、互相挤来挤去了。
        - id: ch03-b18
          speaker: tegumai
          text: 我留个空儿就行。
        - id: ch03-b19
          speaker: narrator
          text: >-
            他兴奋万分，在一大片新白桦树皮上不停手地画完了整句话。
        - id: ch03-b20
          speaker: taffy
          text: 舒——呀——拉斯，呀——马鲁。
        - id: ch03-b21
          speaker: narrator
          text: 塔菲把它一个声音一个声音地读了出来。
        - id: ch03-b22
          speaker: tegumai
          text: >-
            今天就画到这里，你已经累了。明天咱们会把它全部做完。等你看得见的最高大树木都被砍成柴以后，世上的人还会一年又一年地记得咱们。
        - id: ch03-b23
          speaker: narrator
          text: >-
            父女俩回了家。整个晚上，泰古迈坐在火堆一边，塔菲坐在另一边。他们不停地在烟灰墙上画“呀”、“哟”、“舒”和“希”，还一起咯咯地笑。最后，妈妈实在忍不住了。
        - id: ch03-b24
          speaker: teshumai
          text: 说真的，泰古迈，你比我的塔菲还淘气。
        - id: ch03-b25
          speaker: taffy
          text: >-
            妈妈，请别介意。这只是我们的秘密惊喜。等它一做好，我们马上全告诉你。可是现在别问它是什么，不然我就只好说出来啦。
        - id: ch03-b26
          speaker: narrator
          text: >-
            妈妈格外小心，果真没有问。第二天一早，泰古迈下到河边，继续琢磨新的声音图画。塔菲起床以后，看见洞外的大石水槽侧面，用白垩画着“呀——拉斯”。那两个声音合起来是在说，水快结束了，也就是水槽快空了。
        - id: ch03-b27
          speaker: taffy
          text: >-
            嗯，这些声音图画还真有点麻烦！爸爸虽然没回来，却跟亲自站在这里，叫我添水给妈妈做饭一样。
        - id: ch03-b28
          speaker: narrator
          text: >-
            爸爸的图就像本人回来吩咐她一样。她用树皮桶从屋后泉水里提水，把水槽装满，好让妈妈有水做饭。接着她跑到河边，扯了扯爸爸的左耳朵。塔菲表现好时，那只耳朵就归她扯。
        - id: ch03-b29
          speaker: tegumai
          text: 来吧，今天把剩下的声音图画全都造出来！
        - id: ch03-b30
          speaker: narrator
          text: >-
            他们过了极其带劲的一天。中间吃了一顿美美的午饭，还打闹了两回。轮到 T 的声音时，塔菲发现，自己的全名塔菲迈、爸爸的泰古迈、妈妈的泰舒迈，都从这个声音开始。她说，应该画一幅一家三口手拉着手的图来表示它。
        - id: ch03-b31
          speaker: narrator
          text: >-
            一家人的图画一两次还好，画到六七次时，父女俩越来越潦草。塔菲和泰舒迈先被省成了两边的小线，最后，T 只剩下一个瘦长的泰古迈，伸开两只胳膊去拉女儿和妻子。从那三幅图里，多少能看出 T 是怎么变成后来的模样。
        - id: ch03-b32
          speaker: narrator
          text: >-
            其他图画起初也漂亮过了头，午饭以前画的尤其漂亮。可一幅声音图画不能只画一次。父女俩要把它们反复刻在一片又一片白桦树皮上。每画一遍，他们就少留一点用不着的细节，线条也变得更清楚。这样画了一遍又一遍，所有图形越来越简洁，也越来越好画。到最后，就算泰古迈仔细查看，也挑不出毛病。
        - id: ch03-b33
          speaker: narrator
          text: >-
            他们把嘶嘶蛇反过来，表示 Z，意思是蛇正在轻轻柔柔地倒着嘶叫。E 在声音图画里出现得太多，就只留下一道小弯。B 用泰古迈族神圣的海狸来表示。他们把海狸越画越简单，一连改了四次。N 的声音讨厌又带鼻音，他们便只管画鼻子，画到厌倦才停。
        - id: ch03-b34
          speaker: narrator
          text: >-
            大湖狗鱼那张贪吃的大嘴表示 Ga。把狗鱼嘴再画一遍，在后面添上一柄鱼叉，就成了刺刺挠挠、叫人疼的 Ka。画一小段弯弯曲曲的瓦盖河，则表示悦耳的、风吹似的 Wa。别的声音也照这个办法一个个有了图形。就这样，他们一直画下去，画完了需要的每一幅声音图画。字母表终于完整地诞生了。
    - id: ch04
      title: 远去的瓦盖河畔
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            几千几千又几千年过去了。象形体、通俗体、尼罗体、秘文体、库法体、如尼体、多利亚体、爱奥尼亚体，一个接一个登场。各式各样翻来覆去的花招，也都来把字母变来变去。因为乌恩、内格斯、阿洪德和那些掌管传统的人，只要看见一样好东西，就绝不肯让它保持原样。
        - id: ch04-b02
          speaker: narrator
          text: >-
            到了最后，那套古老、漂亮、简单易懂的字母表，A、B、C、D、E 和其余字母，总算又恢复了本来的模样。这样，所有亲爱的宝贝长到足够大的时候，就都能一个接一个地学会那些字母了。
        - id: ch04-b03
          speaker: narrator
          text: >-
            可我仍然记得泰古迈·博普苏莱，记得塔菲迈·梅塔卢迈，也记得她亲爱的妈妈泰舒迈·特温德罗。我还记得那些远去的日子。事情就是这样，正是这样，就在不久以前，在宽阔的瓦盖河畔。
        - id: ch04-b04
          speaker: narrator
          text: >-
            泰古迈族人已无踪，当年模样谁留存？梅罗丘上杜鹃啼，唯余静寂与阳春。
        - id: ch04-b05
          speaker: narrator
          text: >-
            忠贞岁月去还来，无伤的心又歌吟。塔菲舞过蕨草丛，领着萨里再逢春。
        - id: ch04-b06
          speaker: narrator
          text: >-
            蕨叶编环绕眉间，金色乱发精灵般飞扬。双眸灿亮如钻石，比头顶的天空更蓝。
        - id: ch04-b07
          speaker: narrator
          text: >-
            鹿皮斗篷软皮鞋，无畏、自在又明艳。她点起一缕湿柴烟，告诉爸爸她在哪里流连。
        - id: ch04-b08
          speaker: narrator
          text: >-
            因为在远方，哦，远远的后面，远得她再也唤不到他身边。泰古迈独自走来寻找，寻找那个曾是他全部的女儿。
