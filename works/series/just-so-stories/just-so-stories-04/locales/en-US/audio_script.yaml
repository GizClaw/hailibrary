  chapters:
    - id: ch01
      title: The High Veldt
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In the days when everybody started fair, Best Beloved, the Leopard lived on the High Veldt. It was not the Low Veldt, or the Bush Veldt, or the Sour Veldt. It was the bare, hot, shiny High Veldt, with sand, sandy-colored rocks, and tufts of sandy-yellow grass.
        - id: ch01-b02
          speaker: narrator
          text: The Giraffe, Zebra, Eland, Koodoo, and Hartebeest lived there too. Every one of them was sandy-yellow-brown from end to end. But the Leopard was the sandiest, yellowest, brownest of all. He was a greyish-yellow, cat-shaped kind of beast. Against the yellow-grey-brown High Veldt, every single hair of him disappeared into the color around it.
        - id: ch01-b03
          speaker: narrator
          text: That was very bad for the other animals. The Leopard would lie beside a yellow-grey-brown stone or a clump of grass. When Giraffe, Zebra, Eland, Koodoo, Bush-Buck, or Bonte-Buck passed, he would leap out and frighten them nearly out of their jumping lives.
        - id: ch01-b04
          speaker: narrator
          text: An Ethiopian lived on the High Veldt with him. In those days, he too was greyish-brownish-yellowish. They hunted together. The Ethiopian used his bows and arrows, while the Leopard used his teeth and claws. Soon Giraffe, Eland, Koodoo, Quagga, and all the rest never knew which way to jump. They truly did not, Best Beloved.
        - id: ch01-b05
          speaker: narrator
          text: After a very long time, the animals learned to keep away from anything that looked like a Leopard or an Ethiopian. Little by little, they left the High Veldt. Giraffe began the journey because his legs were longest, and the others followed.
        - id: ch01-b06
          speaker: narrator
          text: They hurried on for days and days until they reached a great forest. It was packed with trees, bushes, and stripy, speckly, patchy-blatchy shadows. There they hid.
        - id: ch01-b07
          speaker: narrator
          text: Another long time passed. The animals stood half in shade and half outside it while the slippery, sliding tree shadows moved over them. Giraffe slowly became blotchy. Zebra slowly became stripy. Eland and Koodoo grew darker, and little wavy grey lines appeared along their backs like the bark of a tree trunk.
        - id: ch01-b08
          speaker: narrator
          text: You could still hear those animals moving and smell that they were near. But you could almost never see them, and then only if you knew exactly where to look. Hidden among the speckly-spickly forest shadows, they had a beautiful time.
        - id: ch01-b09
          speaker: narrator
          text: Outside, Leopard and Ethiopian raced this way and that over the grey-yellow-red High Veldt. They could not understand where all their breakfasts, dinners, and teas had gone. At last hunger drove them to rats, beetles, and rock-rabbits instead. After that meal, both of them came down with the Big Tummy-ache together.
        - id: ch01-b10
          speaker: narrator
          text: Then they met Baviaan, the dog-headed, barking Baboon, who is Quite the Wisest Animal in All South Africa. It was a very hot day when Leopard questioned him.
        - id: ch01-b11
          speaker: leopard
          text: Where has all the game gone?
        - id: ch01-b12
          speaker: narrator
          text: Baviaan only winked. He knew.
        - id: ch01-b13
          speaker: ethiopian
          text: Can you tell me the present habitat of the aboriginal Fauna?
        - id: ch01-b14
          speaker: narrator
          text: That meant the same thing, but Ethiopian was a grown-up and always used long words. Baviaan winked again. He knew.
        - id: ch01-b15
          speaker: baviaan
          text: The game has gone into other spots. Leopard, I advise you to go into other spots as soon as you can.
        - id: ch01-b16
          speaker: ethiopian
          text: Very fine, but I want to know where the aboriginal Fauna has migrated.
        - id: ch01-b17
          speaker: baviaan
          text: The aboriginal Fauna has joined the aboriginal Flora because it was time for a change. Ethiopian, I advise you to change as soon as you can.
        - id: ch01-b18
          speaker: narrator
          text: Leopard and Ethiopian were thoroughly puzzled, but they set out together to find the aboriginal Flora.
    - id: ch02
      title: The Shadowy Forest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After ever so many days of searching, they found a great, high, tall forest. Tree trunks rose everywhere inside it. Shadows speckled and sprottled and spottled them. They were dotted and splashed and slashed, then hatched and cross-hatched from top to bottom. Say all that quickly aloud, and you will hear just how very shadowy the forest must have been.
        - id: ch02-b02
          speaker: leopard
          text: What is this place? It is so very dark, yet it is filled with little pieces of light.
        - id: ch02-b03
          speaker: ethiopian
          text: I don't know, but it ought to be the aboriginal Flora. I can smell Giraffe and hear Giraffe, but I cannot see Giraffe.
        - id: ch02-b04
          speaker: leopard
          text: That is curious. Perhaps our eyes have not settled after the sunshine. I can smell Zebra and hear Zebra, but I cannot see Zebra.
        - id: ch02-b05
          speaker: ethiopian
          text: Wait. We haven't hunted them for a long time. Perhaps we've forgotten what they look like.
        - id: ch02-b06
          speaker: leopard
          text: Fiddle! I remember them perfectly from the High Veldt, especially their marrow-bones. Giraffe is about seventeen feet tall and golden-yellow from head to heel. Zebra is about four and a half feet tall and grey-fawn all over.
        - id: ch02-b07
          speaker: ethiopian
          text: Hmm. Then in this dark place, they ought to stand out like ripe bananas in a smokehouse.
        - id: ch02-b08
          speaker: narrator
          text: But they did not. Leopard and Ethiopian hunted all day. They heard the animals and smelled them, yet never saw a single one.
        - id: ch02-b09
          speaker: leopard
          text: For goodness' sake, let's wait for darkness. Hunting in daylight here is a perfect scandal.
        - id: ch02-b10
          speaker: narrator
          text: So they waited until darkness covered the forest. Starlight slipped through the branches in long stripes. Then Leopard heard something nearby, breathing in a sniffly way. He sprang straight at the noise. The creature smelled like Zebra when he caught it and felt like Zebra under his paws. When he knocked it down, it kicked exactly like Zebra. Yet even then, Leopard could not see it.
        - id: ch02-b11
          speaker: leopard
          text: Keep still, you person with no shape. I am sitting on your head until morning, because there is something about you I do not understand.
        - id: ch02-b12
          speaker: narrator
          text: Soon there came a grunt, a crash, and a scramble. Ethiopian called through the darkness.
        - id: ch02-b13
          speaker: ethiopian
          text: I've caught something I can't see. It smells like Giraffe and kicks like Giraffe, but it has no shape at all.
        - id: ch02-b14
          speaker: leopard
          text: Don't trust it. Sit on its head until morning, just as I am doing. None of them has any shape.
        - id: ch02-b15
          speaker: narrator
          text: They sat down hard on their captives and stayed there until bright morning.
        - id: ch02-b16
          speaker: leopard
          text: Brother, what have you got at your end of the table?
        - id: ch02-b17
          speaker: narrator
          text: Ethiopian scratched his head before he answered.
        - id: ch02-b18
          speaker: ethiopian
          text: It ought to be Giraffe, rich orange-tawny from head to heel. But this creature is covered with chestnut blotches. Brother, what have you got at your end?
        - id: ch02-b19
          speaker: narrator
          text: Leopard scratched his head too.
        - id: ch02-b20
          speaker: leopard
          text: It ought to be Zebra, delicate grey-fawn all over. But it is covered with black and purple stripes. Zebra, what in the world have you done to yourself? On the High Veldt, I could see you ten miles away. Now you have no shape.
        - id: ch02-b21
          speaker: zebra
          text: Yes, but this is not the High Veldt. Can't you see that?
        - id: ch02-b22
          speaker: leopard
          text: I can see you now, but I could not see you all yesterday. How do you do it?
        - id: ch02-b23
          speaker: zebra
          text: Let us get up, and we'll show you.
    - id: ch03
      title: The Trick Worth Learning
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Leopard and Ethiopian let them rise. Zebra walked toward some little thorn bushes where the sunlight fell in stripes. Giraffe moved beneath taller trees where the shadows lay in blotches.
        - id: ch03-b02
          speakers: [zebra, giraffe]
          ensemble: duo
          text: Watch now. This is how it's done. One, two, three! And where's your breakfast?
        - id: ch03-b03
          speaker: narrator
          text: Leopard stared into the thorn bushes, and Ethiopian stared among the taller trees. They searched every patch of light and darkness. All they could make out were striped shadows in one place and blotched shadows in another. There was not one clear sign of Zebra or Giraffe. In three steps, both animals had walked away and hidden themselves in the shadowy forest.
        - id: ch03-b04
          speaker: ethiopian
          text: Hi! That trick is worth learning. Take the lesson, Leopard. In this dark place, you stand out like a bar of soap in a coal-scuttle.
        - id: ch03-b05
          speaker: leopard
          text: Ho! Would you be surprised to learn that you stand out like a mustard-plaster on a sack of coal?
        - id: ch03-b06
          speaker: ethiopian
          text: Calling each other names won't catch our dinner. The truth is, neither of us matches the background. I shall follow Baviaan's advice. He told me to change, and the only thing I can change is my skin.
        - id: ch03-b07
          speaker: leopard
          text: What will you change it to?
          emotion: surprised
        - id: ch03-b08
          speaker: ethiopian
          text: A useful blackish-brownish color, with a little purple and touches of slaty blue. It will hide me nicely in hollows and behind trees.
        - id: ch03-b09
          speaker: narrator
          text: Ethiopian changed his skin then and there. Leopard grew more excited than ever, because he had never watched a man change his skin before. Ethiopian worked even his last little finger into the fine new black skin.
        - id: ch03-b10
          speaker: leopard
          text: But what am I supposed to do?
        - id: ch03-b11
          speaker: ethiopian
          text: Follow Baviaan's advice. He told you to go into spots.
        - id: ch03-b12
          speaker: leopard
          text: I did! I went into other spots as fast as I could. I came into this very spot with you, and look how much good that did me.
        - id: ch03-b13
          speaker: ethiopian
          text: Oh, Baviaan did not mean spots in South Africa. He meant spots on your skin.
        - id: ch03-b14
          speaker: leopard
          text: What good would spots do?
        - id: ch03-b15
          speaker: ethiopian
          text: Think of Giraffe. Or think of Zebra, if you would rather have stripes. Their spots and stripes give them per-feet satisfaction.
        - id: ch03-b16
          speaker: leopard
          text: Hmm. I would never want to look like Zebra.
        - id: ch03-b17
          speaker: ethiopian
          text: Then decide. I would hate to hunt without you, but I must if you insist on looking like a sunflower against a tarred fence.
        - id: ch03-b18
          speaker: leopard
          text: I'll have spots, then. Just don't make them vulgarly large. I would never want to look like Giraffe either.
        - id: ch03-b19
          speaker: ethiopian
          text: I'll make them with my fingertips. There is still plenty of black on my skin. Stand over here.
    - id: ch04
      title: The Leopard Gets His Spots
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Ethiopian held up one hand and pressed all five fingers close together. Plenty of black still remained on his new skin, even after he had worked his last little finger into it. He set those five fingertips against Leopard's coat, lifted them, and pressed them down again somewhere else. He did this all over Leopard, and every touch left five small black marks crowded close together.
        - id: ch04-b02
          speaker: narrator
          text: You may see those marks on any Leopard's skin you like, Best Beloved. Sometimes Ethiopian's fingers slipped as he worked, so a few of the marks became blurred instead of neat. Even so, look closely at any Leopard today. Among the blurred marks you will always find five spots close together, left by five fat black fingertips.
        - id: ch04-b03
          speaker: ethiopian
          text: Now you are a beauty! On bare ground, you can look like a heap of pebbles. On naked rock, you can look like a piece of pudding-stone. On a leafy branch, you can look like sunshine falling through the leaves. You can even lie across a path and look like nothing in particular. Think of that and purr!
          emotion: happy
        - id: ch04-b04
          speaker: leopard
          text: If spots can do all that for me, why didn't you make yourself spotty too?
        - id: ch04-b05
          speaker: ethiopian
          text: Oh, plain black suits me best. Come along. Let's see if we can get even with Mister One-Two-Three, Where's Your Breakfast!
        - id: ch04-b06
          speaker: narrator
          text: So Leopard and Ethiopian went away and lived happily ever afterward, Best Beloved. That is all.
    - id: ch05
      title: Quite Contented
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Now and then, you may hear grown-ups ask whether Ethiopian can change his skin or Leopard his spots. I do not think even grown-ups would keep saying such a silly thing unless Leopard and Ethiopian had done it once, do you? But they will never do it again, Best Beloved. They are quite contented as they are.
        - id: ch05-b02
          speaker: child
          text: |-
            I am the Most Wise Baviaan, speaking in wisest tones,
            "Let's melt into the landscape, just the two of us alone."
            People have come in a carriage, calling, but Mummy is there.
            Yes, I can go if you take me. Nurse says she doesn't care.
            Let's climb up by the pigsties and sit on the farmyard rails.
            Let's talk to all the bunnies and watch them skitter their tails.
            Let's do anything, Daddy, as long as it's you and me,
            Going truly exploring and not coming home till tea!
            Here are your boots. I brought them. Here are your cap and stick.
            Here are your pipe and tobacco. Oh, come along out of it, quick!
