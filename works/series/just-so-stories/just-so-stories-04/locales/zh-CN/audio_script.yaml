audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖俏皮，语气笃定
        timbre: 清亮圆润
        pace: 从容，遇到韵律段落时轻快
        pitch: 中
    leopard:
      display_name: 花豹
      tts:
        delivery: 自信挑剔，机警中带着一点虚荣
        timbre: 灵活清晰
        pace: 中等，兴奋时略快
        pitch: 中低
    ethiopian:
      display_name: 埃塞俄比亚人
      tts:
        delivery: 一本正经，爱用大词，偶尔机敏风趣
        timbre: 温厚清楚
        pace: 从容
        pitch: 中
    baviaan:
      display_name: 巴维安
      tts:
        delivery: 高深笃定，话里藏着双关
        timbre: 粗哑结实
        pace: 缓慢
        pitch: 低
    zebra:
      display_name: 斑马
      tts:
        delivery: 镇定机灵，回答干脆
        timbre: 明亮清脆
        pace: 中等
        pitch: 中高
    giraffe:
      display_name: 长颈鹿
      tts:
        delivery: 从容机灵，带一点胜利后的得意
        timbre: 柔和清朗
        pace: 舒缓
        pitch: 中
  chapters:
    - id: ch01
      title: 高原草原上的猎手
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，世上的大家都从一身素色起步，亲爱的宝贝。那时花豹住在高原草原。记住，那不是低地草原，不是灌木草原，也不是酸草原。那片高原草原独独光秃秃、热烘烘、亮晃晃，只有沙子、沙土色的岩石，还有一丛丛沙黄的草。
        - id: ch01-b02
          speaker: narrator
          text: >-
            长颈鹿、斑马、大羚羊、捻角羚和狷羚都住在那里，浑身都是沙黄棕褐色。花豹却比谁都沙黄，比谁都棕褐。他是一头灰黄灰黄、长得像猫的野兽。从毛尖到脚爪，他和高原草原那片黄灰棕褐的颜色丝丝相合，一根毛也不差。
        - id: ch01-b03
          speaker: narrator
          text: >-
            这可苦了长颈鹿、斑马和别的动物。花豹只要伏在一块黄灰棕褐的石头旁，或是一丛同色的草旁，等长颈鹿、斑马、大羚羊、捻角羚、薮羚或白纹牛羚经过，猛地扑出去，就能把它们吓得连蹦带跳，魂都飞了。真的能！
        - id: ch01-b04
          speaker: narrator
          text: >-
            草原上还住着一个拿弓带箭的埃塞俄比亚人。那时他也是灰棕带黄的。他常跟花豹一起打猎。埃塞俄比亚人独独用弓箭，花豹独独用牙齿和爪子。他们追得长颈鹿、大羚羊、捻角羚、斑驴和所有别的动物全不知道该往哪边逃。它们真的不知道，亲爱的宝贝。
        - id: ch01-b05
          speaker: narrator
          text: >-
            过了很久。那年月，凡事一过就是好久好久。动物们渐渐学会了避开一切像花豹或埃塞俄比亚人的东西，又一点点离开了高原草原。长颈鹿腿最长，所以最先动身。它们跑了一天又一天又一天，来到一座大森林。那里长满树木和灌丛，地上铺着条一道、点一点、斑一块、花一片的影子。动物们全藏了进去。
        - id: ch01-b06
          speaker: narrator
          text: >-
            又过了好久。它们半身站在阴影里，半身露在光里，树影又在身上溜来滑去。慢慢地，长颈鹿长出了斑块，斑马长出了条纹。大羚羊和捻角羚的毛色变深，背上也添了一道道灰色小波纹，就像树干的皮。
        - id: ch01-b07
          speaker: narrator
          text: >-
            从此，你能听见它们，也能闻见它们，却很少能看见它们。只有确切知道该往哪儿找，才会偶尔瞧见一眼。它们在森林里那片独独点点斑斑的影子中，日子过得美极了。
        - id: ch01-b08
          speaker: narrator
          text: >-
            花豹和埃塞俄比亚人却还在外头那片独独灰黄带红的高原草原上奔来跑去。他们怎么也想不明白，所有的早餐、午餐和下午茶都去了哪里。最后，两人饿得只能一起吃老鼠、甲虫和岩兔，结果又一起闹起了厉害的肚子疼。
        - id: ch01-b09
          speaker: narrator
          text: >-
            这时，他们遇见了巴维安。那是一只长着狗头、会汪汪叫的狒狒，也是整个南非最最聪明的动物。那天热得很，花豹先开口问他。
        - id: ch01-b10
          speaker: leopard
          text: 所有的野味都跑哪儿去了？
        - id: ch01-b11
          speaker: narrator
          text: 巴维安眨了眨眼。他知道。
        - id: ch01-b12
          speaker: ethiopian
          text: 请问，本土原生动物目前栖居何处？
        - id: ch01-b13
          speaker: narrator
          text: 这话和花豹问的一模一样，只是埃塞俄比亚人总爱用长词儿。他是个大人。巴维安又眨了眨眼。他知道。
        - id: ch01-b14
          speaker: baviaan
          text: 野味已经去了别的斑点。花豹，我劝你也赶快去别的斑点。
        - id: ch01-b15
          speaker: ethiopian
          text: 这话固然不错，可我想知道，本土原生动物究竟迁往何方。
        - id: ch01-b16
          speaker: baviaan
          text: 本土原生动物已经投奔了本土原生植物，因为它们早该换一换了。埃塞俄比亚人，我劝你也赶快换一换。
    - id: ch02
      title: 看不见的斑马和长颈鹿
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            花豹和埃塞俄比亚人听得糊里糊涂，却还是出发去找本土原生植物。走了不知多少天，他们看见一座又大又高、树木直挺挺的森林。里面的树干让影子点了又点、洒了又洒、染了又染，一处点点，一处泼泼，一道斜划，一道直排，一层斜纹，一层交叉斜纹。把这一长串快快念出来，你就知道那森林的影子有多么多了。
        - id: ch02-b02
          speaker: leopard
          text: 这是什么地方？怎么黑成这样，又到处漏着一小片一小片的光？
        - id: ch02-b03
          speaker: ethiopian
          text: 我也不知道，不过这里应该就是本土原生植物。我闻得见长颈鹿，也听得见长颈鹿，可我看不见它。
        - id: ch02-b04
          speaker: leopard
          text: 真奇怪。也许是因为我们刚从大太阳底下进来。我闻得见斑马，也听得见斑马，可我也看不见它。
        - id: ch02-b05
          speaker: ethiopian
          text: 先等等。我们太久没猎过它们，说不定忘了它们长什么样。
        - id: ch02-b06
          speaker: leopard
          text: >-
            胡说！它们在高原草原上的样子，我记得清清楚楚，尤其是它们的骨髓。长颈鹿大约十七英尺高，从头到脚都是浓浓的金黄赤褐色。斑马大约四英尺半高，从头到脚都是淡淡的灰黄褐色。
        - id: ch02-b07
          speaker: narrator
          text: 埃塞俄比亚人望着森林里点点斑斑的影子，琢磨了一会儿。
        - id: ch02-b08
          speaker: ethiopian
          text: 唔。照你这么说，它们在这黑地方应该显眼得像熏房里的熟香蕉。
        - id: ch02-b09
          speaker: narrator
          text: >-
            可它们一点也不显眼。两人猎了一整天，能闻见动物，也能听见动物，却一只都没看到。到了下午茶时，花豹终于受不了了。
        - id: ch02-b10
          speaker: leopard
          text: 看在老天的分上，我们等天黑吧。大白天这样打猎，简直岂有此理。
        - id: ch02-b11
          speaker: narrator
          text: >-
            他们等到天黑。星光穿过树枝，一条条落下来。花豹听见有什么东西在星光里呼哧呼哧地喘气，就朝声音扑过去。那东西闻着像斑马，摸着像斑马，被撞倒以后踢起人来也像斑马，可花豹就是看不见它到底是什么模样。
        - id: ch02-b12
          speaker: leopard
          text: 安静点，你这个没形没状的家伙。你身上有件事我弄不明白，所以我要坐在你头上，一直坐到天亮。
        - id: ch02-b13
          speaker: narrator
          text: 不久，旁边传来一声哼哼、一声轰响，接着又是一阵乱蹬。埃塞俄比亚人喊了起来。
        - id: ch02-b14
          speaker: ethiopian
          text: 我抓到了一个看不见的东西。它闻着像长颈鹿，踢起人来也像长颈鹿，可它一点形状都没有。
        - id: ch02-b15
          speaker: leopard
          text: 别信它。跟我一样，坐在它头上直到天亮。它们全都没形没状，一个也没有。
        - id: ch02-b16
          speaker: narrator
          text: >-
            于是，两人使劲压住那两头动物，一直坐到天光大亮。花豹看看自己捉住的东西，又朝伙伴那边望去。
        - id: ch02-b17
          speaker: leopard
          text: 兄弟，你那一头的桌边摆着什么菜？
        - id: ch02-b18
          speaker: narrator
          text: 埃塞俄比亚人挠了挠头。
        - id: ch02-b19
          speaker: ethiopian
          text: >-
            它本该从头到脚都是浓艳的金黄橙褐色，也本该是一头长颈鹿。可现在，它浑身上下盖满了栗色斑块。兄弟，你那一头的桌边又摆着什么？
        - id: ch02-b20
          speaker: narrator
          text: 花豹也挠了挠头。
        - id: ch02-b21
          speaker: leopard
          text: >-
            它本该从头到脚都是淡淡的灰黄褐色，也本该是一头斑马。可现在，它浑身上下全是黑色和紫色的条纹。斑马，你究竟把自己弄成什么样了？在高原草原上，我隔着十英里都能看见你。你根本没形没状。
        - id: ch02-b22
          speaker: zebra
          text: 没错，可这里不是高原草原。难道你还没看出来？
        - id: ch02-b23
          speaker: leopard
          text: 我现在看出来了，可昨天一整天都没看出来。你是怎么办到的？
        - id: ch02-b24
          speaker: zebra
          text: 先放我们起来，我们做给你看。
    - id: ch03
      title: 森林里的把戏
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            他们这才让斑马和长颈鹿站起来。斑马走到几丛矮矮的小荆棘旁，那里一道道落着阳光。长颈鹿走到几棵高高的树边，那里一块块落着树影。
        - id: ch03-b02
          speakers: [zebra, giraffe]
          ensemble: duo
          text: 看好了。就是这么办的。一——二——三！你的早餐哪儿去了？
        - id: ch03-b03
          speaker: narrator
          text: >-
            花豹瞪大眼睛，埃塞俄比亚人也瞪大眼睛。他们只看见森林里一道道的影子和一块块的影子，斑马和长颈鹿却连一点踪影也没有。那两头动物不过走开几步，就把自己藏进了满是阴影的森林。
        - id: ch03-b04
          speaker: ethiopian
          text: 嗨！这招值得学。花豹，你也学一学吧。你在这黑地方显眼得像煤斗里的一条肥皂。
        - id: ch03-b05
          speaker: leopard
          text: 嚯！要是我告诉你，你在这里显眼得像煤袋上的芥末膏药，你会不会大吃一惊？
        - id: ch03-b06
          speaker: ethiopian
          text: >-
            互相骂几句可抓不到晚饭。说到底，我们和周围的颜色对不上。我要听巴维安的忠告。他叫我换一换。我除了这身皮，没别的可换，那就换皮吧。
        - id: ch03-b07
          speaker: leopard
          text: 换成什么？
          emotion: surprised
        - id: ch03-b08
          speaker: ethiopian
          text: 换成好用的黑棕色，里面带一点紫，再添几抹石板蓝。藏在坑洼里、躲在树后头，这颜色正合适。
        - id: ch03-b09
          speaker: narrator
          text: >-
            埃塞俄比亚人说换就换，当场换掉了自己的皮。花豹看得比刚才更加兴奋，因为他这辈子从没见过一个人换皮。等埃塞俄比亚人把最后一根小指也套进那身漂亮的新黑皮里，花豹赶紧问他。
        - id: ch03-b10
          speaker: leopard
          text: 可是我怎么办？
        - id: ch03-b11
          speaker: ethiopian
          text: 你也照巴维安的忠告办。他叫你去斑点里。
        - id: ch03-b12
          speaker: leopard
          text: >-
            我去了呀。我用最快的速度去了别的地点，还跟你一起来到这个地点。可它给我带来了什么好处？
        - id: ch03-b13
          speaker: ethiopian
          text: 哎呀，巴维安说的不是南非的地点。他说的是你皮肤上的斑点。
        - id: ch03-b14
          speaker: leopard
          text: 那有什么用？
        - id: ch03-b15
          speaker: ethiopian
          text: 想想长颈鹿。你要是喜欢条纹，就想想斑马。斑点和条纹叫它们从头到脚，称心到脚。
        - id: ch03-b16
          speaker: leopard
          text: 唔，我才不要长得像斑马。永远也不要。
        - id: ch03-b17
          speaker: ethiopian
          text: >-
            那就快拿定主意。我不愿意丢下你独自去打猎，可你要是非得像刷了柏油的篱笆前面那朵向日葵一样显眼，我也只能丢下你了。
        - id: ch03-b18
          speaker: leopard
          text: 那我选斑点。不过别弄得又大又俗气。我才不要长得像长颈鹿，永远也不要。
        - id: ch03-b19
          speaker: ethiopian
          text: 我用指尖给你点上。这身新皮还剩着许多黑色呢。站过来！
    - id: ch04
      title: 五个黑指尖
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            埃塞俄比亚人把五根手指紧紧并拢。他的新皮上确实还剩着许多黑色。他就在花豹全身到处按下手掌。五根手指每碰到一个地方，那里便留下五个紧挨在一起的小黑点。
        - id: ch04-b02
          speaker: narrator
          text: >-
            随便看哪一头花豹的皮，你都能瞧见这些印记，亲爱的宝贝。有时埃塞俄比亚人的手指滑了一下，五个小黑点就会有点模糊。不过你若仔细看看今天的任何一头花豹，总能发现斑纹里五个一组的斑点。那正是五个肥肥的黑指尖留下的。
        - id: ch04-b03
          speaker: ethiopian
          text: >-
            这下你可漂亮了！你卧在光秃秃的地上，会像一堆小卵石。你卧在裸露的岩石上，会像一块布丁石。你卧在长满叶子的树枝上，会像从叶缝里筛下的阳光。就算横躺在小路正中间，你也会像个说不清是什么的东西。想想这些，快呼噜几声吧！
        - id: ch04-b04
          speaker: leopard
          text: 可要是我能像这么多东西，你为什么不给自己也添上斑点？
        - id: ch04-b05
          speaker: ethiopian
          text: 嗐，黑鬼还是一身纯黑最好。现在走吧，看看能不能找“一——二——三！你的早餐哪儿去了”先生算算账！
        - id: ch04-b06
          speaker: narrator
          text: 于是他们走了，从此一直快快乐乐地生活，亲爱的宝贝。故事讲完了。
    - id: ch05
      title: 大人爱问的傻问题
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            哦，你偶尔会听见大人这样问：“埃塞俄比亚人能改变自己的皮肤吗？花豹能改变自己的斑点吗？”要不是花豹和埃塞俄比亚人曾经真的变过一次，我想，就连大人也不会一直把这么傻的问题挂在嘴边。你说是不是？
        - id: ch05-b02
          speaker: narrator
          text: 可他们从今以后再也不会变了，亲爱的宝贝。他们对自己现在的模样满意得很。
        - id: ch05-b03
          speaker: narrator
          text: >-
            我是最最聪明的巴维安，口气最最有智慧：“让我们融进这片风景，只有我和你。”有客人坐马车来了，正在门前叫人。可妈妈会在那里……好吧，你带我去，我就能去，保姆说她才不管呢。
        - id: ch05-b04
          speaker: narrator
          text: >-
            咱们到猪圈那边去，坐上农场的栏杆！咱们跟小兔子说说话，看它们翘着尾巴乱窜！咱们——哦，做什么都行，爸爸，只要是你和我。真真正正去探险，下午茶以前绝不回窝！
        - id: ch05-b05
          speaker: narrator
          text: >-
            这是你的靴子，我拿来了。这是你的帽子和手杖，这是你的烟斗和烟草。哦，快出来吧，快跟我走一趟！
