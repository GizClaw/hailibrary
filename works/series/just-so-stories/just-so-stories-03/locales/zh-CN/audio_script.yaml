audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖俏皮，语气笃定
        timbre: 清亮圆润
        pace: 从容，遇到韵律段落时轻快
        pitch: 中
    parsee:
      display_name: 帕西人
      tts:
        delivery: 沉着机灵，得意时含而不露
        timbre: 温润清晰
        pace: 从容
        pitch: 中
    rhinoceros:
      display_name: 犀牛
      tts:
        delivery: 粗鲁蛮横，开口短促
        timbre: 粗厚有力
        pace: 缓慢
        pitch: 低
  chapters:
    - id: ch01
      title: 帕西人的大饼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，红海岸边有一座荒无人烟的小岛。岛上住着一个帕西人。阳光一照，他的帽子就映出万丈光华，那光彩比东方还要东方。
        - id: ch01-b02
          speaker: narrator
          text: >-
            帕西人守着红海过日子。他除了一顶帽子、一把刀和一只万万碰不得的炉子，什么也没有。一天，他把面粉、水、醋栗、李子、糖，还有种种东西拌在一起，做了一只饼。那饼有两英尺宽、三英尺厚，真是一份上等佳肴。这可是魔法。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他可以用那只炉子做饭，于是把饼放上去，烤了又烤。一直烤到饼皮焦黄，香气闻来好不伤感，他才准备开吃。
        - id: ch01-b04
          speaker: narrator
          text: >-
            就在这时，一头犀牛从那彻彻底底荒无人烟的内陆走到海滩上。它鼻头长着一只角，两只眼睛小得像猪眼，而且没多少礼貌。那时候，犀牛的皮紧紧贴着身子，一道皱褶也没有。它活像诺亚方舟玩具里的犀牛，只是大得多。
        - id: ch01-b05
          speaker: narrator
          text: >-
            不过，这头犀牛从前没有礼貌，如今没有礼貌，将来也永远不会有礼貌。它一见帕西人，就粗声吼道。
        - id: ch01-b06
          speaker: rhinoceros
          text: 嗬！
        - id: ch01-b07
          speaker: narrator
          text: >-
            帕西人丢下饼，爬到棕榈树顶，浑身只戴着那顶光芒万丈的帽子。犀牛用鼻子拱翻油炉。饼滚到沙滩上，它拿鼻角一挑，就把整只饼吃掉了。
        - id: ch01-b08
          speaker: narrator
          text: >-
            犀牛摇着尾巴回了内陆。那片专门荒无人烟的地方，紧挨着马赞德兰群岛、索科特拉岛，还有大昼夜平分点的几处海角。
    - id: ch02
      title: 一首意味深长的颂诗
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            帕西人从树上下来，把炉子重新扶正。随后，他吟了一首《颂诗》。你既然没有听过，我就念给你听。
        - id: ch02-b02
          speaker: parsee
          text: >-
            偷吃帕西人亲手烤的饼，准会铸成大错。
        - id: ch02-b03
          speaker: narrator
          text: 这几句话里的深意，可比你想的多得多。
    - id: ch03
      title: 犀牛把皮脱了下来
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            果然，五个星期以后，红海闹起了热浪。人人都把身上的衣服脱得一件不剩。帕西人摘下帽子，犀牛却脱下自己的皮，搭在肩头，到海滩来洗澡。
        - id: ch03-b02
          speaker: narrator
          text: >-
            那时候，犀牛皮在肚皮底下用三颗纽扣扣着，看起来活像一件防水雨衣。犀牛根本不提帕西人的饼，因为它早把饼吃光了。它从前、后来以及从今往后，一向都没有礼貌。
        - id: ch03-b03
          speaker: narrator
          text: >-
            它摇摇摆摆走进水里，用鼻子吹起泡泡，把皮留在沙滩上。过了一会儿，帕西人来了。他一看见那张皮，笑容就在脸上足足绕了两圈。
        - id: ch03-b04
          speaker: narrator
          text: >-
            他围着犀牛皮跳了三圈舞，又搓了搓手，然后回到营地，把帽子装满饼屑。帕西人只吃饼，而且从来不打扫营地，所以那里正好有许多陈年的饼屑。
        - id: ch03-b05
          speaker: narrator
          text: >-
            他拿起那张皮，抖了又抖，刷了又刷，擦了又擦。干巴巴的、走了味的、扎得人发痒的旧饼屑，还有几颗烤焦的醋栗，全给他塞进了皮里。能塞多少，他就塞多少。
        - id: ch03-b06
          speaker: narrator
          text: >-
            做完这一切，帕西人爬上棕榈树顶，等着犀牛从水里出来，再把皮穿回去。
    - id: ch04
      title: 皮上磨出了大褶子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            犀牛果然把皮穿上了。它扣好三颗纽扣，马上就觉得浑身发痒，像是睡在撒满饼屑的床铺里。它伸手去抓，可越抓越痒。
        - id: ch04-b02
          speaker: narrator
          text: >-
            犀牛只好躺在沙地上，滚过来，滚过去，一遍又一遍地滚。可它每滚一回，饼屑就把它扎得更痒、更痒、更痒。
        - id: ch04-b03
          speaker: narrator
          text: >-
            它又冲到棕榈树下，拿身子在树干上擦呀，擦呀，擦呀。它擦得又多又狠，肩头的皮给擦出了一道大褶子。肚皮底下原来有纽扣的地方也多了一道，纽扣全给磨掉了。它的腿上还磨出了好几道褶子。
        - id: ch04-b04
          speaker: narrator
          text: >-
            这么一来，犀牛的脾气彻底坏了。可皮里的饼屑一点也没变，照旧扎得它发痒。它只好回家，一路气得不得了，身上也痒得难受。
        - id: ch04-b05
          speaker: narrator
          text: >-
            从那一天直到今天，每头犀牛的皮上都有一道道大褶子，脾气也坏得很。这一切，全是因为皮里那些饼屑。
    - id: ch05
      title: 荒岛之歌
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            帕西人戴着帽子，从棕榈树上下来。阳光照在帽子上，仍旧映出比东方还要东方的万丈光华。他收起炉子，朝奥罗塔沃、阿米格达拉、安南塔里沃高地草原和索纳普特沼泽的方向走了。
        - id: ch05-b02
          speaker: narrator
          text: >-
            这座荒无人烟的小岛，就在瓜达富伊角海外，靠着索科特拉的沙滩，也靠着粉红的阿拉伯海。可那里太热。从苏伊士往南，热得你我都受不来。我们永远不会搭上半岛东方公司的船，去拜访那位烤饼的帕西人！
