audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, playful, and assured
        timbre: clear and rounded
        pace: measured with lively rhythmic turns
        pitch: medium
    parsee:
      display_name: Parsee
      tts:
        delivery: clever, patient, and quietly triumphant
        timbre: warm and lightly textured
        pace: measured
        pitch: medium
    rhinoceros:
      display_name: Rhinoceros
      tts:
        delivery: blunt, gruff, and ill-mannered
        timbre: heavy and rumbling
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: The Cake on the Beach
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, on an uninhabited island beside the Red Sea, there lived a Parsee. The sun shone from his hat with more-than-oriental splendour. He owned nothing but that hat, a knife, and a cooking-stove of the kind you must particularly never touch.
        - id: ch01-b02
          speaker: narrator
          text: One day, the Parsee mixed flour and water with currants, plums, sugar, and other good things. He made one cake, two feet across and three feet thick. It was indeed a Superior Comestible. That is magic. Since the Parsee was allowed to use the stove, he put the cake on it and baked and baked. At last, it was brown all over and smelled most sentimental.
        - id: ch01-b03
          speaker: narrator
          text: Just as he was about to eat, a Rhinoceros came down to the beach from the Altogether Uninhabited Interior. He had one horn on his nose, two piggy eyes, and very few manners. In those days, his skin fitted tightly, without a wrinkle anywhere. He looked exactly like a Noah's Ark rhinoceros, only much bigger. But he had no manners then. He has none now, and he never will.
        - id: ch01-b04
          speaker: rhinoceros
          text: How do you do!
        - id: ch01-b05
          speaker: narrator
          text: The Parsee left his cake and climbed to the top of a palm tree. He wore nothing but the hat that flashed in the sun with more-than-oriental splendour. The Rhinoceros tipped over the oil-stove with his nose. The cake rolled onto the sand. He speared it on his horn, ate every bit, and went away waving his tail. Back he went to the desolate, Exclusively Uninhabited Interior, near the islands of Mazanderan and Socotra and the Promontories of the Larger Equinox.
        - id: ch01-b06
          speaker: narrator
          text: The Parsee climbed down, set the stove back on its legs, and recited a Sloka. You have not heard it, so I shall tell it to you now.
        - id: ch01-b07
          speaker: parsee
          text: |-
            Them that takes cakes
            Which the Parsee-man bakes
            Makes dreadful mistakes.
        - id: ch01-b08
          speaker: narrator
          text: And there was much more in that Sloka than you might think.
    - id: ch02
      title: The Skin on the Sand
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Five weeks later, a heat wave came over the Red Sea. Everyone took off every piece of clothing they had. The Parsee removed his hat. The Rhinoceros took off his skin, slung it over his shoulder, and came down to the beach for a bath.
        - id: ch02-b02
          speaker: narrator
          text: In those days, the skin buttoned underneath with three buttons and looked like a waterproof coat. The Rhinoceros said nothing at all about the Parsee's cake, because he had eaten the whole thing. And he had no manners then, afterward, or ever again.
        - id: ch02-b03
          speaker: narrator
          text: He waddled straight into the water and blew bubbles through his nose. His skin stayed behind on the beach.
        - id: ch02-b04
          speaker: narrator
          text: Before long, the Parsee came past and found it. One smile spread all the way around his face twice. Then he danced around the skin three times and rubbed his hands together.
    - id: ch03
      title: The Cake Crumbs
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Parsee went back to his camp and filled his hat with cake crumbs. You see, he never ate anything but cake, and he never swept out his camp. So there were plenty of old, dry, stale, tickly crumbs, along with a few burned currants.
        - id: ch03-b02
          speaker: narrator
          text: He picked up the Rhinoceros's skin. He shook it, scrubbed it, and rubbed those crumbs and currants into every part of it. He packed in as many as the skin could possibly hold.
        - id: ch03-b03
          speaker: narrator
          text: Then the Parsee climbed to the top of his palm tree. There he waited for the Rhinoceros to leave the water and put his skin back on.
    - id: ch04
      title: The Great Folds
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: And that is exactly what the Rhinoceros did. He pulled on the skin and fastened all three buttons. At once, it tickled like cake crumbs in a bed.
        - id: ch04-b02
          speaker: narrator
          text: He tried to scratch himself, but the itching only grew worse. Then he dropped onto the sand and rolled and rolled and rolled. Every time he rolled, the crumbs tickled worse and worse and worse.
        - id: ch04-b03
          speaker: narrator
          text: Next he ran to the palm tree and rubbed himself against it. He rubbed and rubbed, so long and so hard that his skin bunched into one great fold across his shoulders. Another fold gathered underneath, where the buttons had been, because he had rubbed every button off. Still more folds formed over his legs.
        - id: ch04-b04
          speaker: narrator
          text: All that rubbing ruined his temper, but it did nothing at all to the crumbs. They were still inside his skin, and they still tickled. So the Rhinoceros went home horribly scratchy and very angry indeed.
        - id: ch04-b05
          speaker: narrator
          text: From that day to this, every rhinoceros has great folds in his skin and a very bad temper, all because of the cake crumbs inside.
    - id: ch05
      title: The Parsee Goes Away
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Parsee climbed down from the palm tree and put on his hat. Once more, the sun flashed from it with more-than-oriental splendour. He packed up his cooking-stove and set off toward Orotavo, Amygdala, the Upland Meadows of Anantarivo, and the Marshes of Sonaput.
        - id: ch05-b02
          speaker: narrator
          text: |-
            This Uninhabited Island
            Is off Cape Gardafui,
            By the Beaches of Socotra
            And the Pink Arabian Sea.
            But it's hot, too hot from Suez,
            For the likes of you and me
            Ever to go
            In a P. and O.
            And call on the Cake-Parsee!
