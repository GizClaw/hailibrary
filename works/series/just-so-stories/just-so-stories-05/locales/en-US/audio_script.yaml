audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, playful, and assured
        timbre: clear and rounded
        pace: measured with lively rhythmic turns
        pitch: medium
    elephants_child:
      display_name: Elephant's Child
      tts:
        delivery: endlessly curious, polite, and bright
        timbre: young and clear
        pace: eager and lightly quick
        pitch: medium-high
    kolokolo_bird:
      display_name: Kolokolo Bird
      tts:
        delivery: mournful and mysterious
        timbre: light and plaintive
        pace: measured
        pitch: high
    python:
      display_name: Bi-Coloured-Python-Rock-Snake
      tts:
        delivery: grand, precise, and dryly superior
        timbre: smooth and resonant
        pace: deliberate
        pitch: medium-low
    crocodile:
      display_name: Crocodile
      tts:
        delivery: coaxing, sly, and threatening
        timbre: rough and heavy
        pace: slow
        pitch: low
    elephant_brother_1:
      display_name: First Elephant Brother
      tts:
        delivery: boisterous and easily startled
        timbre: young and sturdy
        pace: lively
        pitch: medium
    elephant_brother_2:
      display_name: Second Elephant Brother
      tts:
        delivery: boisterous and easily startled
        timbre: young and sturdy
        pace: lively
        pitch: medium-high
    baboon:
      display_name: Baboon Uncle
      tts:
        delivery: blunt, skeptical, and gruff
        timbre: hairy and rasping
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Question Nobody Liked
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In the High and Far-Off Times, O Best Beloved, the Elephant had no trunk. He had only a blackish, bulging nose, as big as a boot. He could wriggle it from side to side, but he could not pick up a thing with it.
        - id: ch01-b02
          speaker: narrator
          text: One young Elephant's Child lived in Africa, and he was full of 'satiable curtiosity. That means he asked question after question, until he had filled all Africa with his questions. He asked his tall Ostrich aunt why her tail feathers grew just so. She answered by spanking him with her hard, hard claw. Then he asked his tall Giraffe uncle what had made his skin spotty. The Giraffe spanked him with his hard, hard hoof. After all that, the Elephant's Child was still just as curious.
        - id: ch01-b03
          speaker: narrator
          text: Next he asked his broad Hippopotamus aunt why her eyes were red. She spanked him with her broad, broad hoof. Then he asked his hairy Baboon uncle why melons tasted just as they did. The Baboon spanked him with his hairy, hairy paw. Yet the questions kept coming. He asked about every single thing he saw or heard, felt or smelled, or touched. Every aunt and every uncle spanked him, and still he was full of 'satiable curtiosity.
        - id: ch01-b04
          speaker: narrator
          text: One fine morning, right in the middle of the Precession of the Equinoxes, he thought of a fine new question.
        - id: ch01-b05
          speaker: elephants_child
          text: What does the Crocodile have for dinner?
        - id: ch01-b06
          speakers: [elephant_brother_1, elephant_brother_2, baboon]
          ensemble: chorus
          text: Hush!
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: Everybody cried out in a loud and dreadful voice. Then they all spanked him at once, without stopping, for a very long time.
        - id: ch01-b08
          speaker: narrator
          text: When that was over, he found Kolokolo Bird sitting in the middle of a wait-a-bit thorn bush.
        - id: ch01-b09
          speaker: elephants_child
          text: My father and mother have spanked me. All my aunts and uncles have spanked me for my 'satiable curtiosity. But I still want to know what the Crocodile has for dinner!
        - id: ch01-b10
          speaker: kolokolo_bird
          text: Go to the banks of the great grey-green, greasy Limpopo River, all set about with fever-trees. You can find out there.
          emotion: sad
        - id: ch01-b11
          speaker: narrator
          text: The very next morning, nothing remained of the Equinoxes, because the Precession had preceded according to precedent. The Elephant's Child prepared for his journey. He packed one hundred pounds of bananas, choosing the little, short, red kind. He took another hundred pounds of sugar cane, of the long, purple kind. Then he added seventeen melons, all of them the green and crackly kind.
        - id: ch01-b12
          speaker: elephants_child
          text: Goodbye, dear family. I am going to the great grey-green, greasy Limpopo River, all set about with fever-trees. I mean to find out what the Crocodile has for dinner.
        - id: ch01-b13
          speaker: narrator
          text: They all spanked him once more for luck, though he asked them very politely to stop. So he went away feeling a little warm, but not at all astonished. He ate melons as he walked and tossed away the rinds, because he could not pick them up.
    - id: ch02
      title: The Great Grey-Green Limpopo
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: He traveled from Graham's Town to Kimberley, then on to Khama's Country. From there he went east by north, eating melons all the way. At last he reached the great grey-green, greasy Limpopo River, all set about with fever-trees, exactly as Kolokolo Bird had promised.
        - id: ch02-b02
          speaker: narrator
          text: Until that very week, day, hour, and minute, the Elephant's Child had never seen a Crocodile. He did not know what one looked like. That was why his 'satiable curtiosity had brought him so far.
        - id: ch02-b03
          speaker: narrator
          text: The first creature he found was a Bi-Coloured-Python-Rock-Snake curled around a rock.
        - id: ch02-b04
          speaker: elephants_child
          text: Excuse me, but have you seen anything called a Crocodile around here?
        - id: ch02-b05
          speaker: python
          text: Have I seen a Crocodile? Whatever will you ask me next?
        - id: ch02-b06
          speaker: elephants_child
          text: Excuse me, but would you kindly tell me what he eats for dinner?
        - id: ch02-b07
          speaker: narrator
          text: The Python uncoiled himself from the rock in a flash and spanked the Elephant's Child with his scaly, flailing tail.
        - id: ch02-b08
          speaker: elephants_child
          text: That is strange. My father, my mother, my uncles, and my aunts have all spanked me for my 'satiable curtiosity. I suppose this must be the same sort of thing.
        - id: ch02-b09
          speaker: narrator
          text: He politely said goodbye to the Bi-Coloured-Python-Rock-Snake. Then he even helped the Python coil himself around the rock again. After that, he continued on his way, feeling a little warm but not at all astonished. As he walked, he ate more melons and threw the rinds about. With nothing but his boot-sized nose, he still had no way to pick them up.
        - id: ch02-b10
          speaker: narrator
          text: He went on until he reached the very edge of the great grey-green, greasy Limpopo River, where the fever-trees grew all around. There he stepped on something that looked exactly like a log of wood. But it was not a log at all, O Best Beloved. It was the Crocodile himself, lying in the mud, and the Crocodile slowly winked one eye.
        - id: ch02-b11
          speaker: elephants_child
          text: Excuse me, but have you happened to see a Crocodile anywhere around here?
        - id: ch02-b12
          speaker: narrator
          text: The Crocodile winked his other eye and raised half his tail from the mud. The Elephant's Child politely stepped back. He did not want another spanking.
        - id: ch02-b13
          speaker: crocodile
          text: Come closer, Little One. Why are you asking these questions?
        - id: ch02-b14
          speaker: elephants_child
          text: Excuse me, but my father and mother have spanked me. So have my Ostrich aunt, my Giraffe uncle, my Hippopotamus aunt, my Baboon uncle, and that Bi-Coloured-Python-Rock-Snake up the bank. His scaly, flailing tail spanks hardest of all. So, if you do not mind, I would rather not be spanked again.
        - id: ch02-b15
          speaker: crocodile
          text: Come closer, Little One. I am the Crocodile.
        - id: ch02-b16
          speaker: narrator
          text: He even wept crocodile tears to prove it. The Elephant's Child grew breathless. He panted and knelt on the bank.
        - id: ch02-b17
          speaker: elephants_child
          text: You are the very one I have searched for all these days! Please tell me what you have for dinner.
        - id: ch02-b18
          speaker: crocodile
          text: Come closer, Little One, and I will whisper the answer.
    - id: ch03
      title: The Great Pull
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Elephant's Child lowered his head until it was very close to the Crocodile's musky, tusky mouth. At once, the Crocodile snapped his jaws around the little elephant's nose. Until that very week, day, hour, and minute, the nose had been no bigger than a boot. Of course, it was much more useful than a boot.
        - id: ch03-b02
          speaker: crocodile
          text: I think that today I shall begin my dinner with Elephant's Child!
        - id: ch03-b03
          speaker: narrator
          text: The Elephant's Child was very annoyed. With the Crocodile gripping his nose, his words came out all squeezed.
        - id: ch03-b04
          speaker: elephants_child
          text: Led go! You are hurtig be!
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: The Bi-Coloured-Python-Rock-Snake scrambled down the bank.
        - id: ch03-b06
          speaker: python
          text: My young friend, pull as hard as you possibly can, this instant. Otherwise, that acquaintance of yours in the large-pattern leather overcoat will drag you into the clear stream before you can say Jack Robinson.
        - id: ch03-b07
          speaker: narrator
          text: That is how Bi-Coloured-Python-Rock-Snakes always talk.
        - id: ch03-b08
          speaker: narrator
          text: The Elephant's Child sat back on his little haunches. He pulled, and pulled, and pulled, and his nose began to stretch. The Crocodile floundered backward into the water. Great sweeps of his tail churned the river until it turned creamy. From the water, the Crocodile pulled, and pulled, and pulled.
        - id: ch03-b09
          speaker: narrator
          text: The Elephant's Child's nose kept stretching. He planted all four of his little legs wide apart and pulled, and pulled, and pulled, but the nose only stretched farther. The Crocodile thrashed his tail like an oar and pulled from the other end. Each new tug made the little elephant's nose longer and longer, and every bit of it hurt him horribly.
        - id: ch03-b10
          speaker: narrator
          text: His feet began to slip. By then, his nose was nearly five feet long.
        - id: ch03-b11
          speaker: elephants_child
          text: This is too butch for be!
          emotion: fearful
        - id: ch03-b12
          speaker: narrator
          text: The Python came down, tied himself in a double clove hitch around the Elephant's Child's hind legs, and prepared to pull.
        - id: ch03-b13
          speaker: python
          text: Rash and inexperienced traveler, we must now apply some serious tension. If we do not, that self-propelled warship with the armored upper deck will permanently spoil your future career.
        - id: ch03-b14
          speaker: narrator
          text: That, too, is how all Bi-Coloured-Python-Rock-Snakes talk.
        - id: ch03-b15
          speaker: narrator
          text: So the Python pulled, the Elephant's Child pulled, and the Crocodile pulled. For a while all three strained against one another. But the Elephant's Child and the Bi-Coloured-Python-Rock-Snake pulled harder than the Crocodile. At last those great jaws let go of the Elephant's Child's nose. They came free with a plop that could be heard all the way up and down the Limpopo.
    - id: ch04
      title: The New Nose
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Elephant's Child fell backward and landed very hard and very suddenly. Even so, the first thing he did was thank the Bi-Coloured-Python-Rock-Snake. The next thing he did was care for his poor, pulled nose. He wrapped the whole aching length in cool banana leaves. Then he hung it in the great grey-green, greasy Limpopo River and let the water cool it.
        - id: ch04-b02
          speaker: python
          text: Why are you doing that?
        - id: ch04-b03
          speaker: elephants_child
          text: Excuse me, but my nose is badly out of shape. I am waiting for it to shrink.
        - id: ch04-b04
          speaker: python
          text: Then you will wait a very long time. Some people do not recognize what is good for them.
        - id: ch04-b05
          speaker: narrator
          text: For three whole days the Elephant's Child sat beside the river, waiting for his nose to shrink. It did not shorten by so much as a little bit. Besides that, its new length made him squint whenever he looked at it. You see, O Best Beloved, the Crocodile had pulled that nose out into a real and truly trunk, the same kind that every Elephant has today.
        - id: ch04-b06
          speaker: narrator
          text: At the end of the third day, a fly stung his shoulder. Before he knew what he was doing, he lifted his trunk and struck the fly dead with its tip.
        - id: ch04-b07
          speaker: python
          text: Advantage number one! You could never have done that with your little smear of a nose. Now try eating something.
        - id: ch04-b08
          speaker: narrator
          text: Without thinking, the Elephant's Child reached out with his trunk. He tore up a large bundle of grass, dusted it against his front legs, and stuffed it into his mouth.
        - id: ch04-b09
          speaker: python
          text: Advantage number two! Your old smear of a nose could not do that. Is the sun not terribly hot here?
        - id: ch04-b10
          speaker: elephants_child
          text: It is.
        - id: ch04-b11
          speaker: narrator
          text: Without thinking, he schlooped up a schloop of mud from the Limpopo's bank. He slapped it on his head, making a cool, schloopy-sloshy mud cap that trickled behind his ears.
        - id: ch04-b12
          speaker: python
          text: Advantage number three! You could not do that with your old nose. Now, how would you feel about being spanked again?
        - id: ch04-b13
          speaker: elephants_child
          text: Excuse me, but I would not like it at all.
        - id: ch04-b14
          speaker: python
          text: And how would you like to spank somebody else?
        - id: ch04-b15
          speaker: elephants_child
          text: I would like that very much indeed.
        - id: ch04-b16
          speaker: python
          text: Well, you will find that your new nose is extremely useful for spanking people.
        - id: ch04-b17
          speaker: elephants_child
          text: Thank you. I will remember that. Now I think I shall go home and try it on all my dear family.
    - id: ch05
      title: The Journey Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Elephant's Child set off for home across Africa, frisking and whisking his trunk as he went. Whenever he wanted fruit, he reached up and pulled it straight from a tree. In the old days, he would have had to wait for the fruit to fall. Whenever he wanted grass, he plucked it from the ground with his trunk. In the old days, he would have had to kneel down and crop it with his mouth.
        - id: ch05-b02
          speaker: narrator
          text: When the flies bit him, he broke a branch from a tree and used it as a fly whisk. When the sun grew hot, he scooped up mud and made himself another cool, slushy-squshy cap. And when he felt lonely on that long walk through Africa, he sang to himself down his trunk. The noise that came out was louder than several brass bands playing together.
        - id: ch05-b03
          speaker: narrator
          text: He went especially far out of his way to find a broad Hippopotamus who was no relation of his. He spanked her very hard, just to make sure the Python had told the truth about his trunk. The rest of the time, he picked up all the melon rinds he had dropped on the outward journey, because he was a Tidy Pachyderm.
    - id: ch06
      title: Nobody Spanks Anybody
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: One dark evening, he returned to his dear family. He curled up his trunk and greeted them.
        - id: ch06-b02
          speaker: elephants_child
          text: How do you do?
        - id: ch06-b03
          speaker: narrator
          text: All his dear family were very glad to see him home again. But the moment their greetings were over, they told him to come closer. They meant to spank him once again for his 'satiable curtiosity.
        - id: ch06-b04
          speaker: elephants_child
          text: Pooh! I do not think any of you know how to spank properly. I do, and I will show you.
        - id: ch06-b05
          speaker: narrator
          text: He uncurled his trunk and knocked two of his brothers head over heels.
        - id: ch06-b06
          speakers: [elephant_brother_1, elephant_brother_2]
          ensemble: duo
          text: O Bananas! Where did you learn that trick, and what happened to your nose?
          emotion: surprised
        - id: ch06-b07
          speaker: elephants_child
          text: The Crocodile gave me a new nose beside the great grey-green, greasy Limpopo River. I asked what he ate for dinner, and he gave me this to keep.
        - id: ch06-b08
          speaker: baboon
          text: It looks very ugly.
        - id: ch06-b09
          speaker: elephants_child
          text: It does, but it is very useful.
        - id: ch06-b10
          speaker: narrator
          text: He picked up his hairy Baboon uncle by one hairy leg and tossed him into a hornet's nest.
        - id: ch06-b11
          speaker: narrator
          text: Then that bad Elephant's Child began spanking all his dear family, and he kept at it for a long time. By the end, every one of them felt very warm and greatly astonished. He pulled the tail feathers from his tall Ostrich aunt. He seized his tall Giraffe uncle by one hind leg and dragged him through a thorn bush. He shouted at his broad Hippopotamus aunt. When she slept in the water after meals, he blew bubbles right into her ear. There was only one creature he protected. He never allowed anyone to lay a hand on Kolokolo Bird.
        - id: ch06-b12
          speaker: narrator
          text: At last, life at home became so exciting that his dear family could bear it no longer. One by one, each of them hurried away to the banks of the great grey-green, greasy Limpopo River, all set about with fever-trees. Each one went there to borrow a new nose from the Crocodile.
        - id: ch06-b13
          speaker: narrator
          text: When they returned from the Limpopo, every one of them had a new nose. After that, nobody in the family ever spanked anybody anymore. And from that day onward, O Best Beloved, every Elephant you will ever see, and every Elephant you will not see, has had a trunk exactly like the trunk of the 'satiable Elephant's Child.
    - id: ch07
      title: Six Honest Serving-Men
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: |-
            I keep six honest serving-men.
            They taught me all I knew.
            Their names are What and Where and When,
            And How and Why and Who.
            I send them over land and sea.
            I send them east and west.
            But after they have worked for me,
            I give them all a rest.
        - id: ch07-b02
          speaker: narrator
          text: |-
            I let them rest from nine till five,
            For I am busy then,
            As well as breakfast, lunch, and tea,
            For they are hungry men.
            But different folk have different views.
            I know a person small.
            She keeps ten million serving-men,
            Who get no rest at all!
            She sends them out on her affairs
            From the second she opens her eyes.
            One million Hows, two million Wheres,
            And seven million Whys!
