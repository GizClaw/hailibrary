audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖俏皮，语气笃定
        timbre: 清亮圆润
        pace: 从容，遇到韵律段落时轻快
        pitch: 中
    taffy:
      display_name: 塔菲
      tts:
        delivery: 热心直率，满怀自信和奇思妙想
        timbre: 明亮稚嫩
        pace: 轻快活泼
        pitch: 高
    tegumai:
      display_name: 泰古迈
      tts:
        delivery: 耐心慈爱，带着不动声色的幽默
        timbre: 温暖结实
        pace: 从容
        pitch: 中低
    teshumai:
      display_name: 泰舒迈
      tts:
        delivery: 爽利爱问，对家人热烈又护短
        timbre: 清晰饱满
        pace: 明快
        pitch: 中
    stranger:
      display_name: 陌生男人
      tts:
        delivery: 彬彬有礼，认真而越来越困惑
        timbre: 温和浑厚
        pace: 稳健
        pitch: 中低
    head_chief:
      display_name: 大酋长
      tts:
        delivery: 威严宏亮，郑重其事
        timbre: 低沉饱满
        pace: 稍缓
        pitch: 低
    neolithic_lady_1:
      display_name: 第一位新石器时代夫人
      tts:
        delivery: 义愤填膺，大惊小怪
        timbre: 坚定清晰
        pace: 明快
        pitch: 中
    neolithic_lady_2:
      display_name: 第二位新石器时代夫人
      tts:
        delivery: 义愤填膺，大惊小怪
        timbre: 清脆有力
        pace: 明快
        pitch: 中高
    neolithic_lady_3:
      display_name: 第三位新石器时代夫人
      tts:
        delivery: 义愤填膺，大惊小怪
        timbre: 圆润有力
        pace: 明快
        pitch: 中
    tribesperson_1:
      display_name: 第一位部落成员
      tts:
        delivery: 激动有力，急着弄清真相
        timbre: 清晰强健
        pace: 轻快
        pitch: 中
    tribesperson_2:
      display_name: 第二位部落成员
      tts:
        delivery: 激动有力，急着弄清真相
        timbre: 粗犷强健
        pace: 轻快
        pitch: 中低
    tribesperson_3:
      display_name: 第三位部落成员
      tts:
        delivery: 激动有力，急着弄清真相
        timbre: 明亮强健
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 折断的鱼叉
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            太古洪荒的时候，有个新石器时代的人。他不是朱特人，不是盎格鲁人，甚至不是很可能成为的达罗毗荼人。亲爱的宝贝，其中的缘故就别去管了。他只是个原始人，住在洞里，过着洞里洞气的日子，身上没穿几件衣服。他不会读，不会写，更不想学。只要肚子不饿，他就过得相当快活。
        - id: ch01-b02
          speaker: narrator
          text: >-
            他的大名是泰古迈·博普苏莱，意思是“从不急着把脚迈出去的人”。亲爱的宝贝，为了省事，咱们叫他泰古迈就好。他的妻子叫泰舒迈·特温德罗，意思是“提出许许多多问题的夫人”。为了省事，咱们就叫她泰舒迈。他们的小女儿叫塔菲迈·梅塔卢迈，意思是“毫无规矩、该挨一顿打的小人儿”。我呢，只管她叫塔菲。
        - id: ch01-b03
          speaker: narrator
          text: >-
            塔菲是泰古迈最最亲爱的宝贝，也是妈妈最最亲爱的宝贝。她挨的打，还不到对她有好处的一半。一家三口过得很快活。塔菲刚会到处跑，就走到哪里都跟着爸爸。有时父女俩玩到肚子饿了才回洞里，浑身脏得吓人。泰舒迈一见他们就问，这两个家伙究竟去了哪里。她还说，我的泰古迈，你跟我的塔菲也好不到哪儿去。
        - id: ch01-b04
          speaker: narrator
          text: >-
            现在可要留神听了！一天，泰古迈带着塔菲穿过海狸沼泽，到瓦盖河叉鲤鱼当晚饭。他的木鱼叉尖上装着鲨鱼牙。鱼还没叉到，他先用力过猛，把鱼叉狠狠戳在河底，咔嚓一下，齐齐折成了两截。他们离家有好几英里。当然，小袋子里装着午饭，可泰古迈偏偏忘了带备用鱼叉。
        - id: ch01-b05
          speaker: tegumai
          text: 鱼没叉着，倒惹来一场麻烦。修好它，半天都得搭进去。
        - id: ch01-b06
          speaker: taffy
          text: 家里不是还有你的黑柄大鱼叉吗？让我跑回洞里，找妈妈拿来。
        - id: ch01-b07
          speaker: tegumai
          text: >-
            那么远的路，你那两条胖乎乎的小腿走不了。万一掉进海狸沼泽，还会淹死呢。事情已经糟了，咱们只好尽量修好它。
        - id: ch01-b08
          speaker: narrator
          text: >-
            泰古迈坐下来，打开一只小小的皮修补袋。里面塞满了驯鹿筋、皮条、蜂蜡块和树脂块。他拿出这些东西，开始修理断掉的鱼叉。塔菲也坐下，把脚趾浸在水里，一手托着下巴，非常认真地想了又想。
        - id: ch01-b09
          speaker: taffy
          text: 爸爸，咱们俩都不会写字，真是烦死人了，对吧？要是会写，就能叫人送新鱼叉来啦。
        - id: ch01-b10
          speaker: tegumai
          text: >-
            塔菲，我说过多少次，不要讲俚话？“烦死人”可不好听。不过你倒提醒了我。眼下要是能写信回家，确实方便。
        - id: ch01-b11
          speaker: narrator
          text: >-
            正说着，一个陌生男人沿河走来。他来自遥远的特瓦拉部落，泰古迈的话一个字也听不懂。他站在岸上冲塔菲微笑，因为自己家里也有一个小女儿。泰古迈却只顾从修补袋里抽出一束鹿筋，低下头继续修理断掉的鱼叉。
        - id: ch01-b12
          speaker: taffy
          text: 过来呀。你知道我妈妈住在哪儿吗？
        - id: ch01-b13
          speaker: stranger
          text: 唔！
        - id: ch01-b14
          speaker: narrator
          text: >-
            因为他是特瓦拉人，只能这样回答。恰好一大群肥鲤鱼沿河游过去，爸爸的鱼叉却偏偏不能用。塔菲看在眼里，急得跺脚，还骂陌生男人是个傻瓜。
        - id: ch01-b15
          speaker: tegumai
          text: 别去缠大人。
        - id: ch01-b16
          speaker: taffy
          text: 我没有缠他。我只是想叫他照我的话做，可他偏听不懂。
        - id: ch01-b17
          speaker: tegumai
          text: 那也别来缠我。
        - id: ch01-b18
          speaker: narrator
          text: >-
            泰古迈嘴里衔满零碎筋头，继续又拉又拽。货真价实的特瓦拉人坐到草地上，看塔菲指着爸爸比比画画。他心想，这孩子可真了不得。她冲我跺脚，还朝我做鬼脸，一定是那位尊贵酋长的女儿。那位酋长一定伟大极了，所以连理都不肯理我。于是，他笑得比先前更加客气。
        - id: ch01-b19
          speaker: taffy
          text: >-
            你去找我妈妈吧。你的腿比我的长，也不会掉进沼泽。请她把爸爸挂在火塘上方的那柄黑把手鱼叉交给你。
        - id: ch01-b20
          speaker: narrator
          text: >-
            特瓦拉人却想，这孩子真是非常、非常了不得。她又挥胳膊又冲我喊，我却一句也听不懂。要是不照办，我很怕那位傲慢的酋长，也就是“背朝来客的人”，会对我发火。他站起来，从白桦树上拧下一大片平整的树皮递过去。亲爱的宝贝，他想表示自己的心像白桦树皮一样洁白，绝无恶意。塔菲却会错了意。
        - id: ch01-b21
          speaker: taffy
          text: >-
            原来你想要我妈妈家的住址！我不会写字，不过有尖东西就能画画。把你项链上的鲨鱼牙借给我吧。
        - id: ch01-b22
          speaker: narrator
          text: >-
            陌生男人一声不响，塔菲便伸出小手，去扯他颈上那串漂亮的珠子、种子和鲨鱼牙项链。他又想，这孩子真是非常、非常、非常了不得。这颗鲨鱼牙有魔力，人家一直告诉我，别人没经允许一碰，就会立刻肿起来，或者砰地炸掉。可她既没肿，也没炸。那位重要的酋长，也就是“一心一意办自己事情的人”，到现在还没理过我，似乎也不怕女儿出事。看来我最好再客气一点。
    - id: ch02
      title: 树皮上的口信
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            他把鲨鱼牙交给塔菲。塔菲肚皮贴地趴着，两条腿翘在空中，就像有人趴在客厅地板上画画那样。
        - id: ch02-b02
          speaker: taffy
          text: >-
            我来给你画几幅漂亮的画。你可以从我肩膀上方看，可别碰得我手乱晃。先画爸爸在捕鱼。虽然画得不太像，妈妈看到他那柄断掉的鱼叉，就会认出他。好啦，再画爸爸想要的另一柄，就是那柄黑把手的鱼叉。它看起来好像插在爸爸背上，那是因为鲨鱼牙滑了一下，树皮又不够大。你要替我拿来的就是它。
        - id: ch02-b03
          speaker: taffy
          text: >-
            再画我自己，正在给你讲明白。我的头发不这样竖着，可这样好画。现在画你。其实你人很好，可我画不出好看的你。你别生气。你生气了吗？
        - id: ch02-b04
          speaker: narrator
          text: >-
            特瓦拉人笑了。他却认定，某处就要打大仗。这个非同寻常的孩子拿了他的魔法鲨鱼牙，既没肿起来，也没有炸掉。她一定是在叫他召集伟大酋长的整个部落，赶来援救。那人一定是位伟大的酋长，要不然早就理睬他了。
        - id: ch02-b05
          speaker: taffy
          text: >-
            看，我已经把你画好了，还把爸爸要的鱼叉放在你手里，免得你忘记要带回来。现在告诉你怎么走。你一直走，先到两棵树那里。画上的这两个就是树。然后翻过一座小山，这个就是山。再往前，是一片到处都有海狸的海狸沼泽。我不会画海狸，所以没把它们全画出来，只画了露在水面上的脑袋。反正你过沼泽时也只能看到这些。千万小心，别掉进去！
        - id: ch02-b06
          speaker: taffy
          text: >-
            过了海狸沼泽就是我们的洞。洞其实没有山那么高，只是我不会把东西画得很小。洞外面那个就是妈妈。她很美，是世上最最最美的妈妈。就算看见我把她画得这么普普通通，她也不会生气。她会因为我已经会画画了，好好夸我的。
        - id: ch02-b07
          speaker: taffy
          text: >-
            为了防止你忘记，我又把爸爸要的鱼叉画在洞外面。它其实放在洞里，不过你只要把这幅图拿给妈妈看，她就会交给你。我还画了妈妈高举着双手，因为我知道，她看见你一定高兴极了。这幅画是不是很美？你全都明白了吗？要是还不懂，要不要我再讲一遍？
        - id: ch02-b08
          speaker: narrator
          text: >-
            特瓦拉人看着图，使劲儿点头，心里却说，要是不把酋长的部落叫来，他就会被敌人杀死。那些敌人正从四面八方挺着鱼叉冲来。现在我明白了！伟大酋长装作没看见我，是怕藏在灌木里的敌人发现。他才背过身，让聪明又了不得的孩子画出可怕的处境。我得赶紧求援！他连路也没问，拿着树皮就像风一样冲进灌木。塔菲满意地坐下。亲爱的宝贝，那就是她画出的第一封图画信。
        - id: ch02-b09
          speaker: tegumai
          text: 塔菲，你刚才忙什么呢？
        - id: ch02-b10
          speaker: narrator
          text: 这时候，泰古迈已经把折断的鱼叉修好了，正握在手里，小心翼翼地来回挥动，试试它是不是又能用了。
        - id: ch02-b11
          speaker: taffy
          text: >-
            是我自己的一点小安排。你只要别问，过一会儿就全知道了，而且会大吃一惊。你想不到会有多吃惊！爸爸，答应我一定要吃惊。
        - id: ch02-b12
          speaker: tegumai
          text: 好吧，我答应你，一定会好好吃上一惊。
        - id: ch02-b13
          speaker: narrator
          text: >-
            泰古迈接着捕鱼。那个特瓦拉人呢，你知道他是特瓦拉人吧？他带着图匆匆跑了好几英里，碰巧在洞口找到泰舒迈。她正跟几位来吃原始人午餐的新石器时代夫人说话。塔菲很像妈妈，尤其是上半张脸和眼睛。这个始终纯正的特瓦拉人一眼认定没错，便客气地微笑，递上树皮。他跑得直喘气，两条腿也被荆棘划伤了，可还是尽力保持礼貌。
        - id: ch02-b14
          speaker: narrator
          text: >-
            泰舒迈刚看见那幅图，立刻扯开嗓子尖叫，朝陌生男人扑了过去。其余的新石器时代夫人也马上动手，把他打倒在地。六个人排成长长一列，齐齐坐在他身上，泰舒迈则用力揪住了他的头发。
        - id: ch02-b15
          speaker: teshumai
          text: >-
            事情跟他脸上的鼻子一样清楚！他把我的泰古迈浑身插满鱼叉，又吓得可怜的塔菲头发根根直竖，居然还把行凶的样子画下来送给我。你们看！
        - id: ch02-b16
          speaker: teshumai
          text: >-
            这里是我的泰古迈，他的胳膊断了。这里有一柄鱼叉插在他背上。这里有个人举着鱼叉正要投，另一个人从洞里投出鱼叉。瞧，还有一大群人从泰古迈身后冲上来。多吓人哪！
        - id: ch02-b17
          speakers: [neolithic_lady_1, neolithic_lady_2, neolithic_lady_3]
          ensemble: chorus
          text: 实在太吓人了！
        - id: ch02-b18
          speaker: narrator
          text: >-
            那群人其实是塔菲画的海狸，可确实有点像人。夫人们把泥巴塞满陌生男人的头发，这令他十分吃惊。接着，她们敲响震天价响的部落大鼓。所有酋长和他们手下的赫特曼、多尔曼，还有组织里全体的内格斯、乌恩、阿洪德，以及术士、安格科克、巫师、僧侣等等，全被召来了。大家决定，砍掉陌生男人的头以前，先叫他立刻带路去河边，指出他把可怜的塔菲藏在了哪里。
        - id: ch02-b19
          speaker: narrator
          text: >-
            到这时，特瓦拉人真的恼火了。他们往他头发里塞泥，塞得结结实实。又在疙疙瘩瘩的石子上推着他来回滚。六个人排成长长一列坐在他身上。还对他又捶又撞，害他几乎喘不过气。他虽听不懂，却敢肯定夫人们骂他的那些话一点也不淑女。不过，他一直没开口。等整个部落集合好，才领着他们回到瓦盖河。大家在那里看见了安然无恙的塔菲和泰古迈。
    - id: ch03
      title: 整个部落赶来了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 回到瓦盖河岸，大家看见塔菲正安安稳稳地坐在那里编雏菊花环。泰古迈也好端端的，正拿着修好的鱼叉，小心地叉着一条条小鲤鱼。
        - id: ch03-b02
          speaker: taffy
          text: 哎呀，你回来得真快！可是，你为什么带了这么多人？亲爱的爸爸，这就是我要送给你的惊喜。怎么样，你真的吃惊了吗？
        - id: ch03-b03
          speaker: tegumai
          text: >-
            非常吃惊。不过，他们把我今天一整天的捕鱼全毁了。你瞧，整个亲爱、和善、友好、干净、安静的部落，一个不少，全都赶到这里来了，塔菲。
        - id: ch03-b04
          speaker: narrator
          text: >-
            的确一个不少。泰舒迈和那些新石器时代夫人走在最前面，紧紧抓着满头泥巴的陌生男人，尽管他是个特瓦拉人。后面是大酋长、副酋长、次酋长、助理酋长，个个武装到了上牙床。再后面跟着赫特曼、百人长、率领各自队伍的普拉托夫、率领各自支队的多尔曼。乌恩、内格斯和阿洪德排在队尾，也都武装到了牙齿。
        - id: ch03-b05
          speaker: narrator
          text: >-
            最后才是按等级排开的整个部落。最上等的富户拥有四座洞穴，每个季节住一座，还有一处私人驯鹿场和两道鲑鱼跃水场。往下是封建制下颌突出农奴，冬夜里只有一半资格披半张熊皮，还得坐在离火堆七码远的地方。再往下，是依附土地的奴仆。按照领主继承权，他们日后可以得到一根刮净了的骨髓骨。这些词多漂亮呀，亲爱的宝贝！人人蹦跳喊叫，把方圆二十英里的鱼全吓跑了。泰古迈只好用一篇流利的新石器时代演说向大家致谢。
        - id: ch03-b06
          speaker: narrator
          text: >-
            接着，泰舒迈跑到河边，抱住塔菲，对她又亲又抱，怎么也亲不够。可是泰古迈部落的大酋长走向泰古迈，一把揪住他顶髻上的羽毛，十分严厉地来回摇晃。
        - id: ch03-b07
          speakers: [tribesperson_1, tribesperson_2, tribesperson_3]
          ensemble: chorus
          text: 解释！解释！快解释！
        - id: ch03-b08
          speaker: tegumai
          text: >-
            我的老天爷，放开我的顶髻！一个人不过折断一柄鱼叉，难道方圆各处的人都得压到他头上？你们也太爱管闲事了。
        - id: ch03-b09
          speaker: taffy
          text: >-
            我看你们到头来还是没有带来爸爸那柄黑把手的鱼叉。还有，你们为什么这样对待我那个好心的陌生男人？
        - id: ch03-b10
          speaker: narrator
          text: >-
            大家还在两个一伙、三个一伙、十个一伙地捶陌生男人，直捶得他的眼珠团团转。他一句话也说不出来，只能喘着气，伸手指向塔菲。
        - id: ch03-b11
          speaker: teshumai
          text: 我的宝贝，那些拿鱼叉刺你的坏人在哪里？
        - id: ch03-b12
          speaker: tegumai
          text: >-
            这里根本没有什么坏人。今天早上，我唯一见过的客人就是这个可怜人，而你们眼下正想把他活活掐死。泰古迈部落啊，你们究竟是好好的，还是全都病了？
        - id: ch03-b13
          speaker: head_chief
          text: 他送来一幅可怕的图。上面画着你浑身都是鱼叉。
        - id: ch03-b14
          speaker: taffy
          text: 呃……也许我最好讲明白。那幅图是我交给他的。
        - id: ch03-b15
          speaker: narrator
          text: 话虽然说出来了，可塔菲这会儿心里却不大自在。
        - id: ch03-b16
          speakers: [tribesperson_1, tribesperson_2, tribesperson_3]
          ensemble: chorus
          text: 是你？那个毫无规矩、该挨一顿打的小人儿？
        - id: ch03-b17
          speaker: tegumai
          text: 亲爱的塔菲，恐怕咱们惹上一点麻烦了。
        - id: ch03-b18
          speaker: narrator
          text: 爸爸伸手搂住她，于是她也不在乎了。大酋长却单脚跳来跳去，一遍又一遍地喊着，要她赶快解释清楚。
        - id: ch03-b19
          speaker: taffy
          text: >-
            我想让陌生男人拿来爸爸的鱼叉，才把它画下来的。图里不是许多鱼叉，只有一柄。我把同一柄鱼叉画了三遍，是为了叫他弄清楚。它看着好像插进了爸爸的脑袋，我也没办法，因为那块白桦树皮上实在没有地方了。
        - id: ch03-b20
          speaker: taffy
          text: >-
            妈妈说的那些坏人，其实是我画的海狸。我画下它们，是想告诉陌生男人怎么穿过沼泽。洞口那个是妈妈。我把她画在那里，是因为她看见这么好心的陌生男人，当然会很高兴。
        - id: ch03-b21
          speaker: taffy
          text: >-
            我觉得，你们简直是全世界最最最愚蠢的人。这个陌生男人明明非常好。你们为什么要把他的头发塞满泥巴？现在快去给他洗干净！
        - id: ch03-b22
          speaker: narrator
          text: >-
            很久很久，没有任何人说一句话。后来，大酋长先笑了。接着，至少始终还是个特瓦拉人的陌生男人也笑了。再后来，泰古迈笑得一跤摔倒在河岸上。整个部落跟着越笑越厉害，越笑越响。只有泰舒迈和那些新石器时代夫人没有笑。她们对各自的丈夫都非常有礼貌，只不过时不时要说一声“笨蛋”。
    - id: ch04
      title: 第一封图画信
      blocks:
        - id: ch04-b01
          speaker: head_chief
          text: 毫无规矩、该挨一顿打的小人儿啊，你想出了一项了不起的发明！
        - id: ch04-b02
          speaker: taffy
          text: 我不是故意要发明什么。我只想要爸爸那柄黑柄鱼叉。
        - id: ch04-b03
          speaker: head_chief
          text: >-
            那不要紧。这是一项了不起的发明，将来有一天，人们会管它叫文字。如今它还只有图画，而大家今天已经亲眼看见，图画并不总能叫人正确明白。可是，总有一天，泰古迈家的小宝贝，我们会造出所有的字母，整整二十六个。那时候，人人既会读，也会写，就能永远准确说出自己的意思，再也不会出错。现在，让那些新石器时代夫人把陌生男人头发里的泥洗掉吧。
        - id: ch04-b04
          speaker: taffy
          text: >-
            那我可太高兴了。因为你们虽然把泰古迈部落里每一柄别的鱼叉全都带来了，到头来却偏偏忘掉了爸爸真正要用的那柄黑柄鱼叉。
        - id: ch04-b05
          speaker: head_chief
          text: >-
            亲爱的塔菲，下次你再写图画信，最好叫一个会说我们这种话的人跟着，让他向大家解释图里的意思。我自己倒不介意，毕竟我是大酋长。可是，这样的误会对泰古迈部落里的其他人很不好。你也亲眼看见了，它还会把收到信的陌生人吓一大跳。
        - id: ch04-b06
          speaker: narrator
          text: >-
            后来，他们把这个来自特瓦拉地方、货真价实的特瓦拉人收进泰古迈部落。因为他是位真正的绅士，新石器时代夫人往他头发里塞了那么多泥，他也没有为此大吵大闹。可是从那一天直到今天，我猜这全怪塔菲，很少有小姑娘喜欢学习读书写字。她们大多更爱画画，也更爱跟爸爸一起到处玩，就像塔菲一样。
        - id: ch04-b07
          speaker: narrator
          text: >-
            有一条路傍着梅罗丘冈，如今是长满青草的小径。离吉尔福德不过一小时路程，高高俯瞰着韦河河滨。
        - id: ch04-b08
          speaker: narrator
          text: >-
            当年马铃声叮当响起，古不列颠人便整装上马，去看皮肤黝黑的腓尼基人，沿西部大道运来百货繁华。
        - id: ch04-b09
          speaker: narrator
          text: >-
            他们就在这里，或是附近相逢，举行各族的会谈等等。拿珠子交换惠特比黑玉，拿锡换彩贝做的颈环等等。
        - id: ch04-b10
          speaker: narrator
          text: >-
            可在那以前很久很久，野牛还曾在丘冈上漫游。塔菲和爸爸爬上这片高地，还把自己的家安在这头。
        - id: ch04-b11
          speaker: narrator
          text: >-
            海狸在布罗德斯通溪筑起堤坝，布拉姆利所在之处便成了泥塘。熊从希尔前来四处寻找塔菲，一直找到沙姆利所在的地方。
        - id: ch04-b12
          speaker: narrator
          text: >-
            塔菲称作瓦盖的那条韦河，当年比今天宽大六倍有余。泰古迈部落的男女老少，那时候可真是气派非凡的一族！
