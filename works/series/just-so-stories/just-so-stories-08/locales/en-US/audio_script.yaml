  chapters:
    - id: ch01
      title: The Broken Spear
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In a very early time, there lived a Neolithic man. He was not a Jute, an Angle, or even a Dravidian, though he might well have been. Never mind why, Best Beloved. He was a Primitive. He lived cavily in a Cave and wore very few clothes. He could not read, and he could not write, and he did not want to learn either one. Except when he was hungry, he was quite happy with things exactly as they were.
        - id: ch01-b02
          speaker: narrator
          text: His name was Tegumai Bopsulai, meaning Man-who-does-not-put-his-foot-forward-in-a-hurry. We shall call him Tegumai. His wife was Teshumai Tewindrow, or Lady-who-asks-a-very-many-questions. We shall call her Teshumai. Their little daughter was Taffimai Metallumai, meaning Small-person-without-any-manners-who-ought-to-be-spanked. I shall call her Taffy.
        - id: ch01-b03
          speaker: narrator
          text: Taffy was her Daddy's Best Beloved and her Mummy's Best Beloved. She was not spanked half as often as was good for her, and all three were very happy. From the time she could first run about, she followed Daddy Tegumai wherever he went. Sometimes the two of them stayed away from the Cave all day. They would not turn for home until they were hungry, and then they came back together for Teshumai to see how dirty they had become.
        - id: ch01-b04
          speaker: teshumai
          text: Where in the world have you two been? Just look how shockingly dirty you are! Really, Tegumai, you're no better than Taffy.
        - id: ch01-b05
          speaker: narrator
          text: Now attend and listen!
        - id: ch01-b06
          speaker: narrator
          text: One day, Tegumai went through the beaver-swamp to the Wagai River to spear carp for dinner, and Taffy went with him. His wooden spear had shark's teeth at the tip. Before he caught one fish, he drove it too hard into the riverbed and snapped it clean across. They were miles from home, though they had brought lunch in a little bag, and Tegumai had forgotten every spare spear.
        - id: ch01-b07
          speaker: tegumai
          text: Well, here's a pretty kettle of fish! Mending this will take me half the day.
        - id: ch01-b08
          speaker: taffy
          text: Your big black spear is at home. Let me run to the Cave and ask Mummy for it.
        - id: ch01-b09
          speaker: tegumai
          text: That's too far for your little fat legs. You might fall into the beaver-swamp and drown. No, we'll have to make the best of this.
        - id: ch01-b10
          speaker: narrator
          text: Tegumai sat down and opened his little leather mendy-bag. It held reindeer sinews, strips of leather, lumps of beeswax, and sticky resin. He laid out what he needed and began binding the broken shaft together. Taffy sat down beside him. She put her toes in the water and rested her chin in one hand, thinking as hard as she could about the spear waiting at home.
        - id: ch01-b11
          speaker: taffy
          text: Daddy, isn't it an awful nuisance that neither of us can write? If we could, we could send home for the other spear.
        - id: ch01-b12
          speaker: tegumai
          text: Taffy, how often have I told you not to use slang? “Awful” is not a pretty word. Still, writing home would be convenient just now.
        - id: ch01-b13
          speaker: narrator
          text: Just then, a Stranger-man came along the river. He belonged to the far-off Tewara tribe and understood not one word of Tegumai's language. He smiled at Taffy because he had a little daughter of his own at home. Tegumai pulled a hank of deer sinew from his bag and kept working.
        - id: ch01-b14
          speaker: taffy
          text: Come here! Do you know where my Mummy lives?
        - id: ch01-b15
          speaker: stranger
          text: Um!
        - id: ch01-b16
          speaker: narrator
          text: A shoal of very large carp swam upriver just when Tegumai could not use his spear. Taffy saw them and stamped her foot.
        - id: ch01-b17
          speaker: taffy
          text: Silly!
          emotion: angry
        - id: ch01-b18
          speaker: tegumai
          text: Don't bother grown-ups.
        - id: ch01-b19
          speaker: narrator
          text: He was so busy with the repair that he never turned around.
        - id: ch01-b20
          speaker: taffy
          text: I'm not bothering him. I only want him to do what I want, and he won't understand me.
        - id: ch01-b21
          speaker: tegumai
          text: Then please don't bother me.
        - id: ch01-b22
          speaker: narrator
          text: Tegumai pulled and strained at the sinews, with loose ends filling his mouth. The Stranger-man sat on the grass while Taffy showed him what her Daddy was doing.
        - id: ch01-b23
          speaker: stranger
          text: What a remarkable child! She stamps at me and makes faces. She must be the daughter of that noble Chief, who is too great even to notice me.
        - id: ch01-b24
          speaker: narrator
          text: So he smiled more politely than ever.
    - id: ch02
      title: Taffy's Picture-Letter
      blocks:
        - id: ch02-b01
          speaker: taffy
          text: I need you to go to my Mummy. Your legs are longer than mine, so you won't fall into the beaver-swamp. Ask her for Daddy's other spear, the black-handled one above our fireplace.
        - id: ch02-b02
          speaker: stranger
          text: This child is very, very remarkable. She waves her arms and shouts, and I cannot understand her. If I refuse, that proud Chief called Man-who-turns-his-back-on-callers may grow angry.
        - id: ch02-b03
          speaker: narrator
          text: The Stranger-man rose, peeled a broad flat piece of bark from a birch tree, and handed it to Taffy. Best Beloved, he meant to show that his heart was as white as the bark and that he wished no harm. Taffy understood something quite different.
        - id: ch02-b04
          speaker: taffy
          text: Oh, now I see! You want my Mummy's living-address. I can't write, but I can draw if I have something sharp. Please lend me that shark's tooth from your necklace.
        - id: ch02-b05
          speaker: narrator
          text: The Stranger-man said nothing. Taffy reached up and tugged at the lovely necklace of beads, seeds, and shark's teeth around his neck.
        - id: ch02-b06
          speaker: stranger
          text: This is a very, very, very remarkable child! That tooth is magic. I was taught that anyone touching it without permission would swell up or burst at once. Yet she does neither. And that important Chief, Man-who-attends-strictly-to-his-business, shows no fear for her. I had better be still more polite.
        - id: ch02-b07
          speaker: narrator
          text: He gave her the tooth. Taffy lay flat on her stomach with her legs in the air, just as some people lie on the drawing-room floor to make pictures.
        - id: ch02-b08
          speaker: taffy
          text: Now I'll make you some beautiful pictures! You may look over my shoulder, but you mustn't joggle me. First, I'll draw Daddy fishing. It doesn't look much like him, but Mummy will know who it is because I drew his spear broken in two. Next I'll draw the other spear, the one with the black handle. It looks as if it is sticking right into Daddy's back. That only happened because the shark's tooth slipped and this bark isn't big enough. It is really the spear I want you to fetch.
        - id: ch02-b09
          speaker: taffy
          text: Now here's me explaining it all. My hair doesn't truly stick up like that, but it's easier to draw. And now I'll draw you. I do think you're nice, but I can't make you pretty in the picture. Please don't be offended. Are you offended?
        - id: ch02-b10
          speaker: narrator
          text: The Stranger-man smiled.
        - id: ch02-b11
          speaker: stranger
          text: A great battle must be coming. This extraordinary child took my magic tooth without swelling or bursting, and now she is telling me to summon the great Chief's entire tribe. He must be a mighty Chief, or surely he would have noticed me.
        - id: ch02-b12
          speaker: taffy
          text: Look, I've drawn you now. I put Daddy's spear in your hand so you will remember that you must bring it back. Next I'll show you exactly how to find Mummy's living-address. Go along until you reach two trees. Those marks are the trees. Then you must go over one hill. That curved mark is the hill. After that, you will come to a beaver-swamp, and the whole swamp is full of beavers.
        - id: ch02-b13
          speaker: taffy
          text: I couldn't draw whole beavers, so I only drew their heads. Their heads are all you'll see when you cross. Mind you don't fall in! Our Cave is just beyond the swamp. It isn't really as tall as the hills, but I can't draw tiny things.
        - id: ch02-b14
          speaker: taffy
          text: That's Mummy outside. She's beautiful. She's the most beautifullest Mummy ever, but she won't be offended that I drew her so plain. She'll be pleased because I can draw. I put Daddy's spear outside the Cave so you won't forget it. It's truly inside. Show Mummy this picture, and she'll give it to you.
        - id: ch02-b15
          speaker: taffy
          text: I drew Mummy with her hands up because she'll be so pleased to see you. Isn't this a beautiful picture? Do you understand everything, or shall I explain it again?
        - id: ch02-b16
          speaker: narrator
          text: The Stranger-man studied the picture and nodded very hard.
        - id: ch02-b17
          speaker: stranger
          text: If I fail to bring this great Chief's tribe, his enemies will attack from every side and kill him with their spears. Now I understand why he pretended not to see me. He feared enemies were hiding in the bushes and watching. So he turned his back while the wise and wonderful child drew this terrible picture of his danger. I must hurry away and bring his tribe!
        - id: ch02-b18
          speaker: narrator
          text: He did not ask Taffy for directions. With the birch bark in his hand, he raced into the bushes like the wind. Taffy sat down, thoroughly pleased with herself.
        - id: ch02-b19
          speaker: narrator
          text: And that was the picture Taffy had drawn for him!
        - id: ch02-b20
          speaker: tegumai
          text: What have you been doing, Taffy?
        - id: ch02-b21
          speaker: narrator
          text: Tegumai had repaired his spear and was carefully waving it to and fro.
        - id: ch02-b22
          speaker: taffy
          text: It's a little arrangement of my own, Daddy dear. Don't ask questions. You'll understand soon, and you will be surprised. You don't know how surprised you'll be! Promise me you'll be surprised.
        - id: ch02-b23
          speaker: tegumai
          text: Very well.
        - id: ch02-b24
          speaker: narrator
          text: And he went on fishing.
    - id: ch03
      title: The Picture at the Cave
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Stranger-man, who was a Tewara, hurried for miles with the picture. Quite by accident, he found Teshumai at the door of her Cave. She was talking with several Neolithic ladies who had come for a Primitive lunch. Taffy looked very like her Mummy, especially around the eyes and the top of her face. So the pure Tewara smiled politely and handed Teshumai the birch bark. He had run so hard that he panted, and brambles had scratched his legs, but he still tried to be courteous.
        - id: ch03-b02
          speaker: narrator
          text: The moment Teshumai saw the picture, she screamed and sprang at him. The other ladies knocked him down and sat on him in a long row of six, while Teshumai pulled his hair.
        - id: ch03-b03
          speaker: teshumai
          text: The meaning is as plain as the nose on this Stranger-man's face! He has stuck my Tegumai full of spears and frightened poor Taffy until her hair stands on end. Then he brought me this horrible picture to show how he did it. Look!
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: She held the bark up for all the Neolithic ladies who were sitting patiently on the Stranger-man.
        - id: ch03-b05
          speaker: teshumai
          text: Here is Tegumai with a broken arm. Here is a spear in his back. One man is ready to throw another spear, and someone else is throwing one from a Cave. And look at that whole crowd coming up behind him!
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: The crowd was really Taffy's beavers, though they did look rather like people.
        - id: ch03-b07
          speaker: teshumai
          text: Isn't it shocking?
          emotion: angry
        - id: ch03-b08
          speakers: [neolithic_lady_1, neolithic_lady_2, neolithic_lady_3]
          ensemble: chorus
          text: It is perfectly shocking!
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: The ladies packed the Stranger-man's hair with mud, which surprised him greatly. Then they beat on the Reverberating Tribal Drums and called together all the chiefs of Tegumai's tribe. The Hetmans and Dolmans came, and all the Neguses, Woons, and Akhoonds of the organization. The Warlocks arrived too, with the Angekoks, Juju-men, Bonzes, and everyone else who mattered. Together they decided what to do. Before they chopped off the Stranger-man's head, he must lead them straight down to the river and show them where he had hidden poor Taffy.
        - id: ch03-b10
          speaker: narrator
          text: By now the Stranger-man was truly annoyed, Tewara or not. The ladies had packed his hair solid with mud. They had rolled him backward and forward over knobby pebbles. Six of them had sat on him in one long row, and they had thumped and bumped him until he could scarcely breathe. He could not understand their language, but the sound of it told him enough. He felt nearly certain that the names those Neolithic ladies were calling him were not at all ladylike.
        - id: ch03-b11
          speaker: narrator
          text: Still, he said nothing. Once the whole Tribe had gathered, he led them back to the Wagai River. There they found Taffy making daisy chains while Tegumai carefully speared little carp with his mended spear.
    - id: ch04
      title: The Tribe Comes to the River
      blocks:
        - id: ch04-b01
          speaker: taffy
          text: You came back quickly! But why did you bring so many people? Daddy dear, here is my surprise. Are you surprised?
        - id: ch04-b02
          speaker: tegumai
          text: Very. It has spoiled all my fishing for today. Why, Taffy, our whole dear, kind, pleasant, clean, quiet Tribe is here.
        - id: ch04-b03
          speaker: narrator
          text: And it was. Teshumai and the Neolithic ladies came first, gripping the Stranger-man so tightly that he could not get away. His hair was full of mud, though he was a Tewara. Behind them marched the Head Chief, the Vice-Chief, the Deputy Chief, and all the Assistant Chiefs. Every one was armed to the teeth. Then came the Hetmans and the Heads of Hundreds. Platoffs led their Platoons, and Dolmans led their Detachments. Woons, Neguses, and Akhoonds ranked behind them, and they were still armed to the teeth.
        - id: ch04-b04
          speaker: narrator
          text: After them came the rest of the Tribe, arranged from highest rank to lowest. At the grand end were people who owned four caves, one for every season, together with a private reindeer-run and two salmon-leaps. At the other end came feudal and prognathous Villeins. On winter nights, they were partly entitled to half a bearskin at a place seven yards from the fire. Last came the adscript serfs, who might someday inherit a scraped marrow bone under heriot. Aren't those beautiful words, Best Beloved? Every rank and title was there.
        - id: ch04-b05
          speaker: narrator
          text: Every one of them pranced and shouted. They frightened away all the fish for twenty miles, and Tegumai thanked them with a flowing speech in Neolithic.
        - id: ch04-b06
          speaker: narrator
          text: Teshumai ran down to kiss and hug Taffy over and over. But the Head Chief grabbed Tegumai by his top-knot feathers and shook him severely.
        - id: ch04-b07
          speakers: [tribesperson_1, tribesperson_2, tribesperson_3]
          ensemble: chorus
          text: Explain! Explain! Explain!
          emotion: angry
        - id: ch04-b08
          speaker: tegumai
          text: Goodness' sake, let go of my top-knot! Can't a man break his carp spear without the whole countryside rushing down upon him? You people interfere with everything.
          emotion: angry
        - id: ch04-b09
          speaker: taffy
          text: I don't believe you brought Daddy's black-handled spear at all. And why are you hurting my nice Stranger-man?
        - id: ch04-b10
          speaker: narrator
          text: They were thumping him in twos, threes, and tens until his eyes rolled around. All he could do was gasp and point at Taffy.
        - id: ch04-b11
          speaker: teshumai
          text: My darling, where are those wicked people who speared you?
        - id: ch04-b12
          speaker: tegumai
          text: There were no wicked people. The only visitor I saw this morning was the poor man you're trying to choke. Is the Tribe of Tegumai feeling well, or has everyone gone ill?
        - id: ch04-b13
          speaker: head_chief
          text: He brought us a dreadful picture. It showed you stuck all over with spears.
        - id: ch04-b14
          speaker: taffy
          text: Er... perhaps I should explain. I was the one who gave him that picture.
        - id: ch04-b15
          speaker: narrator
          text: Taffy no longer felt quite comfortable.
        - id: ch04-b16
          speakers: [tribesperson_1, tribesperson_2, tribesperson_3]
          ensemble: chorus
          text: You? Small-person-without-any-manners-who-ought-to-be-spanked? You?
          emotion: surprised
        - id: ch04-b17
          speaker: tegumai
          text: Taffy dear, I think we may be in a little trouble.
        - id: ch04-b18
          speaker: narrator
          text: He put his arm around her, and then she did not mind.
        - id: ch04-b19
          speaker: head_chief
          text: Explain! Explain! Explain!
          emotion: angry
        - id: ch04-b20
          speaker: narrator
          text: The Head Chief hopped on one foot.
    - id: ch05
      title: What the Picture Meant
      blocks:
        - id: ch05-b01
          speaker: taffy
          text: I wanted the Stranger-man to fetch Daddy's spear, so I drawded it. There weren't lots of spears. There was only one, but I drawded it three times to make certain. It looked as if it went into Daddy's head because there wasn't enough room on the birch bark.
        - id: ch05-b02
          speaker: taffy
          text: And those things Mummy thought were bad people were my beavers. I drawded them to show the road through the swamp. I drawded Mummy at the Cave mouth looking pleased, because he is a nice Stranger-man. I think all of you are the stupidest people in the world! He is very nice. Why did you fill his hair with mud? Wash him!
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: For a long time, nobody spoke. Then the Head Chief laughed. The Stranger-man, who was at least a Tewara, laughed next. Tegumai laughed until he fell flat on the riverbank. Then the whole Tribe laughed harder, worse, and louder.
        - id: ch05-b04
          speaker: narrator
          text: Only Teshumai and the Neolithic ladies did not laugh. They were very polite to their husbands, and every so often they said one word.
        - id: ch05-b05
          speakers: [teshumai, neolithic_lady_1, neolithic_lady_2, neolithic_lady_3]
          ensemble: chorus
          text: Idiot!
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: Then the Head Chief cried, spoke, and sang.
        - id: ch05-b07
          speaker: head_chief
          text: O Small-person-without-any-manners-who-ought-to-be-spanked, you have discovered a great invention!
          emotion: surprised
        - id: ch05-b08
          speaker: taffy
          text: I didn't mean to invent anything. I only wanted Daddy's black-handled spear.
        - id: ch05-b09
          speaker: head_chief
          text: Never mind what you intended. It is a great invention, and someday people will call it writing. At present, it is only a set of pictures. As all of us have seen today, pictures are not always understood in the right way. But the time will come, O Babe of Tegumai, when we shall make letters, all twenty-six of them. Then we shall learn to read as well as write. We shall always be able to say exactly what we mean, without making any mistakes. Now let the Neolithic ladies wash the mud out of the Stranger-man's hair.
        - id: ch05-b10
          speaker: taffy
          text: I'll be glad when they do. After all, you brought every other spear in the Tribe of Tegumai, but you forgot Daddy's black-handled one.
        - id: ch05-b11
          speaker: narrator
          text: Once more the Head Chief cried, spoke, and sang.
        - id: ch05-b12
          speaker: head_chief
          text: Taffy dear, next time you send a picture-letter, send someone who speaks our language too. Then he can explain it. I do not mind for myself, because I am a Head Chief. But picture-letters are very bad for the rest of the Tribe of Tegumai, and, as you see, they surprise the stranger.
        - id: ch05-b13
          speaker: narrator
          text: Then the Tribe adopted the Stranger-man, a true Tewara of Tewar. He was a gentleman and never made a fuss about the mud the Neolithic ladies had put in his hair.
        - id: ch05-b14
          speaker: narrator
          text: But from that day to this, and I suppose it is all Taffy's fault, very few little girls have enjoyed learning to read or write. Most would rather draw pictures and play with their Daddies, just like Taffy.
    - id: ch06
      title: Merrow Down
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            There runs a road by Merrow Down,
            A grassy track today it is,
            An hour out of Guildford town,
            Above the river Wey it is.
        - id: ch06-b02
          speaker: narrator
          text: |-
            Here, when they heard the horse bells ring,
            The ancient Britons dressed and rode
            To watch the dark Phoenicians bring
            Their goods along the Western Road.
        - id: ch06-b03
          speaker: narrator
          text: |-
            And here, or hereabouts, they met
            To hold their racial talks and such,
            To barter beads for Whitby jet,
            And tin for gay shell torques and such.
        - id: ch06-b04
          speaker: narrator
          text: |-
            But long and long before that time,
            When bison used to roam on it,
            Did Taffy and her Daddy climb
            That down, and had their home on it.
        - id: ch06-b05
          speaker: narrator
          text: |-
            Then beavers built in Broadstone Brook
            And made a swamp where Bramley stands,
            And bears from Shere would come and look
            For Taffimai where Shamley stands.
        - id: ch06-b06
          speaker: narrator
          text: |-
            The Wey, that Taffy called Wagai,
            Was more than six times bigger then,
            And all the Tribe of Tegumai,
            They cut a noble figure then!
