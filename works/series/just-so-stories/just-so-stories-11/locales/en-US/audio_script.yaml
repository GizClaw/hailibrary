  chapters:
    - id: ch01
      title: When All the Animals Were Wild
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Hear and attend and listen, Best Beloved. This happened when all the Tame animals were wild. Dog, Horse, Cow, Sheep, and Pig were as wild as wild could be. They walked through the Wet Wild Woods, each by a wild lone. The wildest was Cat. He walked by himself, and all places were alike to him.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Man was dreadfully wild too. He only began to grow tame after he met Woman, and she told him she would not live in his wild way. Until then, a heap of wet leaves had been good enough for him to sleep upon. Woman chose a pleasant, dry Cave instead. She spread clean sand across its floor and built a good wood fire at the very back. Across the open mouth of the Cave, she hung a dried wild-horse skin with its tail pointing downward.
        - id: ch01-b03
          speaker: woman
          text: Wipe your feet when you come in, dear. Now we'll keep house.
        - id: ch01-b04
          speaker: narrator
          text: >-
            That night they ate wild sheep roasted on hot stones with wild garlic and pepper. There was wild duck stuffed with rice, fenugreek, and coriander, then marrow-bones, wild cherries, and wild grenadillas. Man fell happily asleep before the fire. Woman stayed awake, combing her hair. She studied the wonderful marks on a big mutton shoulder-blade, threw more wood on the fire, and made the world's First Singing Magic.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Far out in the Wet Wild Woods, all the wild animals gathered together. From a long way off, they could see the fire shining in the Cave. None of them knew what that great light meant, so they wondered about it among themselves.
        - id: ch01-b06
          speaker: horse
          text: Friends and Enemies, why have Man and Woman made that great light in that great Cave? What harm will it do us?
        - id: ch01-b07
          speaker: narrator
          text: Wild Dog raised his nose and caught the smell of roast mutton.
        - id: ch01-b08
          speaker: dog
          text: I'll go and find out. I think that smell is good. Cat, come with me.
        - id: ch01-b09
          speaker: cat
          text: Nenni! I am the Cat who walks by himself, and all places are alike to me. I will not come.
        - id: ch01-b10
          speaker: dog
          text: Then we can never be friends again.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Wild Dog trotted toward the Cave. After he had gone a little way, Cat began to think.
        - id: ch01-b12
          speaker: cat
          text: All places are alike to me. Why shouldn't I go and have a look, then leave whenever I please?
        - id: ch01-b13
          speaker: narrator
          text: >-
            He slipped after Wild Dog, softly, very softly. He did not mean to join him or to be seen. When he came near the Cave, he hid in a place where he could hear every word.
        - id: ch01-b14
          speaker: narrator
          text: >-
            At the Cave, Wild Dog lifted the horse-skin curtain with his nose and sniffed the lovely roast-mutton smell. Woman heard him while she studied the blade-bone. She laughed.
        - id: ch01-b15
          speaker: woman
          text: Here comes the first. Wild Thing from the Wild Woods, what do you want?
        - id: ch01-b16
          speaker: dog
          text: Enemy, and Wife of my Enemy, what is making that delicious smell in the Wild Woods?
        - id: ch01-b17
          speaker: narrator
          text: Woman tossed him a roasted mutton-bone.
        - id: ch01-b18
          speaker: woman
          text: Wild Thing from the Wild Woods, taste this and see.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Wild Dog took the bone and gnawed it clean. The roasted meat tasted better than anything he had found in the Wet Wild Woods, and at once he wanted more.
        - id: ch01-b20
          speaker: dog
          text: Enemy, and Wife of my Enemy, give me another one.
        - id: ch01-b21
          speaker: woman
          text: Help my Man hunt by day and guard this Cave at night. Then you may have all the roast bones you need.
        - id: ch01-b22
          speaker: cat
          text: Ah! This Woman is very wise, but she is not as wise as I am.
        - id: ch01-b23
          speaker: narrator
          text: Wild Dog crawled inside and rested his head on Woman's lap.
        - id: ch01-b24
          speaker: dog
          text: Friend, and Wife of my Friend, I will hunt with your Man by day and guard your Cave at night.
        - id: ch01-b25
          speaker: cat
          text: Ah! That is a very foolish Dog.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Cat went back through the Wet Wild Woods, waving his wild tail and walking by his wild lone. But he told nobody what had happened.
        - id: ch01-b27
          speaker: narrator
          text: When Man woke, he stared at the animal in the Cave.
        - id: ch01-b28
          speaker: man
          text: What is Wild Dog doing here?
        - id: ch01-b29
          speaker: woman
          text: >-
            He isn't Wild Dog any longer. His name is First Friend, because he will be our friend for always and always and always. Take him hunting with you.
    - id: ch02
      title: First Servant and Giver of Good Food
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The next night, Woman gathered fresh green grass from the water-meadows and dried it by the fire until it smelled like new-mown hay. At the Cave entrance, she braided a horse-hide halter. Then she studied the broad blade-bone and made the world's Second Singing Magic.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The wild animals wondered what had become of Wild Dog. At last Wild Horse stamped his foot.
        - id: ch02-b03
          speaker: horse
          text: I'll go and learn why Wild Dog never came back. Cat, come with me.
        - id: ch02-b04
          speaker: cat
          text: Nenni! I am the Cat who walks by himself, and all places are alike to me. I will not come.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Even so, Cat followed Wild Horse softly, very softly. Once again he hid close enough to hear everything. Wild Horse came tripping and stumbling over his long wild mane. Woman heard him outside the Cave and laughed.
        - id: ch02-b06
          speaker: woman
          text: Here comes the second. Wild Thing from the Wild Woods, what do you want?
        - id: ch02-b07
          speaker: horse
          text: Enemy, and Wife of my Enemy, where is Wild Dog?
        - id: ch02-b08
          speaker: woman
          text: You didn't come for Wild Dog. You came for this good grass.
        - id: ch02-b09
          speaker: horse
          text: That is true. Give me some to eat.
        - id: ch02-b10
          speaker: woman
          text: Bend your wild head and wear what I give you. Then you may eat this wonderful grass three times each day.
        - id: ch02-b11
          speaker: cat
          text: Ah! This Woman is clever, but she is not as clever as I am.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Wild Horse lowered his head. Woman slipped the braided halter over it, and he breathed upon her feet.
        - id: ch02-b13
          speaker: horse
          text: Mistress, and Wife of my Master, I will serve you for the sake of this wonderful grass.
        - id: ch02-b14
          speaker: cat
          text: Ah! That is a very foolish Horse.
        - id: ch02-b15
          speaker: narrator
          text: >-
            Cat returned through the Wet Wild Woods, waving his wild tail and walking by his wild lone. Again, he told nobody.
        - id: ch02-b16
          speaker: narrator
          text: When Man and Dog returned from hunting, Man saw Horse.
        - id: ch02-b17
          speaker: man
          text: What is Wild Horse doing here?
        - id: ch02-b18
          speaker: woman
          text: >-
            He isn't Wild Horse any longer. His name is First Servant, because he will carry us from place to place for always and always and always. Ride him when you hunt.
        - id: ch02-b19
          speaker: narrator
          text: >-
            The next day, Wild Cow came to the Cave. She held her wild head high so her wild horns would not catch in the wild trees. Cat followed and hid, just as he had before. Everything happened in the same way. Woman offered the wonderful grass, and Wild Cow promised to give Woman her milk every day in return. Cat called Woman clever but not as clever as himself. Then he called Cow foolish. He went back through the Wet Wild Woods, waving his wild tail and walking by his wild lone, but he never told anyone what he had seen.
        - id: ch02-b20
          speaker: narrator
          text: >-
            When Man, Horse, and Dog came home from hunting, they saw Wild Cow and asked the same question they had asked before. Woman gave them her answer.
        - id: ch02-b21
          speaker: woman
          text: >-
            She isn't Wild Cow any longer. Her name is Giver of Good Food. She will give us warm white milk for always and always and always. I will care for her while you, First Friend, and First Servant go hunting.
    - id: ch03
      title: The Cat Makes a Bargain
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            On the following day, Cat waited to see whether another Wild Thing would visit the Cave. He waited and watched, but nothing stirred in the Wet Wild Woods. At last he walked to the Cave by himself. There he watched Woman milk Cow. Through the Cave mouth he could see the warm fire, and beside it he could smell the warm white milk.
        - id: ch03-b02
          speaker: cat
          text: Enemy, and Wife of my Enemy, where has Wild Cow gone?
        - id: ch03-b03
          speaker: woman
          text: >-
            Go back to the Woods, Wild Thing. My hair is braided, the magic blade-bone is put away, and our Cave needs no more friends or servants.
        - id: ch03-b04
          speaker: cat
          text: I am neither friend nor servant. I am the Cat who walks by himself, and I want to enter your Cave.
        - id: ch03-b05
          speaker: woman
          text: Why didn't you come with First Friend on the first night?
        - id: ch03-b06
          speaker: narrator
          text: Cat grew very angry.
        - id: ch03-b07
          speaker: cat
          text: Has Wild Dog been telling tales about me?
          emotion: angry
        - id: ch03-b08
          speaker: woman
          text: >-
            You call yourself the Cat who walks by himself, and you say all places are alike. You are no friend and no servant. Those are your own words. Go walk by yourself wherever you please.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Cat saw that Woman meant to send him away. He did not truly give up his proud ways, but he lowered his manner and pretended to be sorry.
        - id: ch03-b10
          speaker: cat
          text: >-
            Must I never enter the Cave? May I never sit beside the warm fire or drink the warm white milk? You are very wise and very beautiful. Surely you need not be cruel, even to a Cat.
        - id: ch03-b11
          speaker: woman
          text: >-
            I knew I was wise, but I didn't know I was beautiful. Very well. If I ever speak one word in your praise, you may enter the Cave.
        - id: ch03-b12
          speaker: cat
          text: What if you speak two words in my praise?
        - id: ch03-b13
          speaker: woman
          text: I never will. But if I do, you may sit beside the Cave fire.
        - id: ch03-b14
          speaker: cat
          text: And what if you speak three?
        - id: ch03-b15
          speaker: woman
          text: >-
            I never will. But if I speak three words in your praise, you may drink warm white milk three times a day for always and always and always.
        - id: ch03-b16
          speaker: narrator
          text: Cat arched his back.
        - id: ch03-b17
          speaker: cat
          text: >-
            Let the Curtain at the Cave mouth, the Fire at the back, and the Milk-pots beside it remember what my Enemy, and Wife of my Enemy, has promised.
        - id: ch03-b18
          speaker: narrator
          text: >-
            With the Cave, Fire, and Milk-pots called as witnesses, Cat turned away. He went through the Wet Wild Woods, waving his wild tail and walking by his wild lone. That night, Man, Horse, and Dog returned from hunting together. Woman did not tell any of them about the bargain she had made with Cat, because she was afraid they might not like it.
    - id: ch04
      title: The First and Second Praises
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Cat went far and far away. Deep in the Wet Wild Woods, he hid by his wild lone and waited a long time. He waited until Woman forgot all about him and the bargain. Only Bat knew where Cat was. The little upside-down Bat hung inside the Cave by day, and every evening he flew out to Cat's hiding place with news of what was happening.
        - id: ch04-b02
          speaker: bat
          text: >-
            There is a Baby in the Cave now. He is new and pink and fat and small, and Woman loves him dearly.
        - id: ch04-b03
          speaker: cat
          text: Ah. And what does Baby like?
        - id: ch04-b04
          speaker: bat
          text: >-
            He likes soft things that tickle. He likes warm things to hold while he sleeps, and he likes being played with. Those are the things he likes.
        - id: ch04-b05
          speaker: cat
          text: Ah. Then my time has come.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The next night, Cat crossed the Wet Wild Woods and hid very near the Cave. He stayed hidden until morning, when Man, Dog, and Horse left together to hunt. Woman had cooking to do, but Baby cried and interrupted her again and again. She carried him outside the Cave and put a handful of pebbles before him to play with. Even then, Baby went on crying.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Cat reached out a padded paw and touched Baby's cheek. Baby cooed. Cat rubbed against his fat knees and tickled his chin with his tail. Baby laughed, and Woman heard him and smiled.
        - id: ch04-b08
          speaker: bat
          text: >-
            Hostess, Wife of my Host, and Mother of my Host's Son, a Wild Thing from the Wild Woods is playing beautifully with your Baby.
        - id: ch04-b09
          speaker: woman
          text: >-
            Bless that Wild Thing, whoever it is. I have been very busy this morning, and it has helped me.
        - id: ch04-b10
          speaker: narrator
          text: >-
            At that very minute and second, Best Beloved, the dried horse-skin Curtain remembered the bargain. It had hung tail-down across the Cave mouth, but now it dropped with a great whoosh. Woman went to pick it up. And there, if you please, sat Cat, quite comfortable inside the Cave.
        - id: ch04-b11
          speaker: cat
          text: >-
            Enemy, Wife of my Enemy, and Mother of my Enemy, here I am. You spoke one word in my praise, so I may stay inside the Cave for always and always and always. Still, I am the Cat who walks by himself, and all places are alike to me.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Woman was very angry when she saw how Cat had used the bargain. She shut her lips tightly, took up her spinning-wheel, and began to spin without answering him. But Cat had moved away from Baby, and Baby began to cry for him. Woman tried to hush the child, but he struggled and kicked and cried until his face grew black.
        - id: ch04-b13
          speaker: cat
          text: >-
            Enemy, Wife of my Enemy, and Mother of my Enemy, tie a strand of your spinning thread to the little spindle-whorl. Pull it across the floor, and I will show you a magic that can make Baby laugh as loudly as he is crying.
        - id: ch04-b14
          speaker: woman
          text: I'll do it because I don't know what else to try, but I will not thank you.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Woman took a strand of the thread she was spinning and tied it to the little clay spindle-whorl. Then she pulled the whorl across the Cave floor. Cat raced after it and patted it with both paws. He rolled head over heels, tossed it backward over his shoulder, and chased it between his hind legs. He pretended he had lost it, then sprang upon it again. Baby laughed as loudly as he had cried. He scrambled after Cat, and the two of them frolicked all over the Cave. At last Baby grew tired and settled down to sleep with Cat held in his arms.
        - id: ch04-b16
          speaker: cat
          text: Now I will sing Baby a song that will keep him asleep for an hour.
        - id: ch04-b17
          speaker: narrator
          text: >-
            Cat purred, loud and low, then low and loud, until Baby slept soundly. Woman looked down at them and smiled.
        - id: ch04-b18
          speaker: woman
          text: That was wonderfully done. There is no doubt that you are very clever, Cat.
        - id: ch04-b19
          speaker: narrator
          text: >-
            At that very minute and second, Best Beloved, the Fire remembered Woman's bargain. Smoke came rolling down in clouds from the Cave roof with a puff. For a moment, it filled the Cave and hid everything near the hearth. Then it cleared away. And there, if you please, Cat was sitting quite comfortably close beside the warm fire.
        - id: ch04-b20
          speaker: cat
          text: >-
            Enemy, Wife of my Enemy, and Mother of my Enemy, here I am. You spoke a second word in my praise, so I may sit beside the warm Cave fire for always and always and always. Still, I am the Cat who walks by himself, and all places are alike to me.
    - id: ch05
      title: The Third Praise and Two More Bargains
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Woman grew very, very angry when the second bargain came true. She let down her hair, piled more wood on the fire, and brought out the broad blade-bone from the shoulder of mutton. This time she made a Magic that would keep her from ever speaking a third word in Cat's praise. It was not a Singing Magic, Best Beloved. It was a Still Magic. Little by little, the whole Cave became so silent that a tiny, tiny mouse dared to creep from a corner and run across the floor.
        - id: ch05-b02
          speaker: cat
          text: Enemy, Wife of my Enemy, and Mother of my Enemy, is that little mouse part of your magic?
        - id: ch05-b03
          speaker: woman
          text: Ouh! Chee! No, indeed!
          emotion: fearful
        - id: ch05-b04
          speaker: narrator
          text: >-
            Woman dropped the blade-bone, jumped onto the footstool, and quickly braided her hair so the mouse could not run up it.
        - id: ch05-b05
          speaker: cat
          text: Ah. Then it won't hurt you if I eat it?
        - id: ch05-b06
          speaker: woman
          text: No. Eat it quickly, and I will always be grateful.
        - id: ch05-b07
          speaker: narrator
          text: Cat sprang once and caught the little mouse.
        - id: ch05-b08
          speaker: woman
          text: >-
            A hundred thanks! Even First Friend cannot catch a little mouse that quickly. You must be very wise.
        - id: ch05-b09
          speaker: narrator
          text: >-
            At that very moment and second, Best Beloved, the Milk-pot beside the fire remembered Woman's bargain. It split cleanly into two pieces with a sharp ffft. Woman jumped down from the footstool and looked. And there, if you please, Cat was already lapping the warm white milk that had gathered inside one of the broken pieces.
        - id: ch05-b10
          speaker: cat
          text: >-
            Enemy, Wife of my Enemy, and Mother of my Enemy, here I am. You spoke three words in my praise, so I may drink warm white milk three times a day for always and always and always. Still, I am the Cat who walks by himself, and all places are alike to me.
        - id: ch05-b11
          speaker: narrator
          text: Woman laughed and set down a bowl of warm white milk.
        - id: ch05-b12
          speaker: woman
          text: >-
            Cat, you are as clever as a man. But remember, you made no bargain with Man or Dog. I don't know what they will do when they return.
        - id: ch05-b13
          speaker: cat
          text: >-
            What does that matter to me? If I have my place beside the fire and warm white milk three times a day, I do not care what Man or Dog may do.
        - id: ch05-b14
          speaker: narrator
          text: >-
            That evening, Man and Dog came home from hunting and entered the Cave. Cat did not hide or move from his new place. He sat beside the fire and smiled while Woman told Man and Dog the whole story of her bargain, from the first word of praise to the third.
        - id: ch05-b15
          speaker: man
          text: Yes, but Cat made no bargain with me, or with all proper Men who come after me.
        - id: ch05-b16
          speaker: narrator
          text: >-
            Man took off both leather boots and laid them down. Then he placed his little stone axe beside them. That made three things. He fetched a piece of wood and a hatchet as well. That made five altogether, and he arranged all five in a row where Cat could see them.
        - id: ch05-b17
          speaker: man
          text: >-
            Now for our bargain. If you do not catch mice whenever you are in the Cave, I will throw these five things at you whenever I see you. Every proper Man after me will do the same.
        - id: ch05-b18
          speaker: woman
          text: Ah! Cat is very clever, but he is not as clever as my Man.
        - id: ch05-b19
          speaker: narrator
          text: Cat counted the five things. They looked very knobby.
        - id: ch05-b20
          speaker: cat
          text: >-
            I will catch mice whenever I am in the Cave, for always and always and always. Still, I am the Cat who walks by himself, and all places are alike to me.
        - id: ch05-b21
          speaker: man
          text: >-
            Not when I am near. If you had left out those last words, I would have put these things away forever. Now, whenever we meet, I will throw my two boots and my stone axe at you. Every proper Man after me will do the same.
        - id: ch05-b22
          speaker: dog
          text: Wait. Cat made no bargain with me, or with all proper Dogs who come after me.
        - id: ch05-b23
          speaker: narrator
          text: Dog showed his teeth.
        - id: ch05-b24
          speaker: dog
          text: >-
            If you are not kind to Baby whenever I am in the Cave, I will hunt you until I catch you, and then I will bite you. Every proper Dog after me will do the same.
        - id: ch05-b25
          speaker: woman
          text: Ah! Cat is very clever, but he is not as clever as Dog.
        - id: ch05-b26
          speaker: narrator
          text: Cat counted Dog's teeth. They looked very pointed.
        - id: ch05-b27
          speaker: cat
          text: >-
            I will be kind to Baby whenever I am in the Cave, as long as he does not pull my tail too hard, for always and always and always. Still, I am the Cat who walks by himself, and all places are alike to me.
        - id: ch05-b28
          speaker: dog
          text: >-
            Not when I am near. If you had left out those last words, I would have kept my mouth shut forever. Now I will chase you up a tree whenever we meet. Every proper Dog after me will do the same.
        - id: ch05-b29
          speaker: narrator
          text: >-
            The bargains were settled. Then Man picked up his two boots and his little stone axe and threw all three at Cat. Cat dashed out through the Cave mouth. Dog raced after him through the open air and chased him all the way up a tree.
        - id: ch05-b30
          speaker: narrator
          text: >-
            From that day to this, Best Beloved, three proper Men out of five will throw something at a Cat when they meet him. And from that day to this, all proper Dogs will chase a Cat up a tree. But Cat has never forgotten his own side of the bargains. Whenever he is in a house, he catches mice. He is kind to Babies too, so long as they do not pull his tail too hard.
        - id: ch05-b31
          speaker: narrator
          text: >-
            But when his work is done, and in all the times between, Cat belongs to himself. When the moon climbs into the sky and night comes down, he is still the Cat who walks by himself, and all places are alike to him. Out he goes, leaving the house and fire behind. He may walk into the Wet Wild Woods, climb among the Wet Wild Trees, or travel over the Wet Wild Roofs. Wherever he chooses to go, he waves his wild tail and walks by his wild lone.
    - id: ch06
      title: The Firstest Friend
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Pussy can sit by the fire and sing, or Pussy can climb a tree. She can play with a silly old cork and string to amuse herself, not me. But I like Binkie my dog, because he knows how to behave. Binkie's the same as the First Friend was, and I am the Man in the Cave.
        - id: ch06-b02
          speaker: narrator
          text: >-
            Pussy will play man-Friday until it's time to wet her paw and walk along the window-sill, making the footprint Crusoe saw. Then she fluffles her tail and mews. She scratches and will not attend. But Binkie will play whatever I choose, and he is my true First Friend.
        - id: ch06-b03
          speaker: narrator
          text: >-
            Pussy will rub my knees with her head, pretending she loves me hard. But the very minute I go to bed, Pussy runs out into the yard and stays there until morning-light. So I know it is only pretend. But Binkie snores at my feet all night, and he is my Firstest Friend!
