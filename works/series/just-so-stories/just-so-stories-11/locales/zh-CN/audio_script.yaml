audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖俏皮，语气笃定
        timbre: 清亮圆润
        pace: 从容，遇到韵律段落时轻快
        pitch: 中
    woman:
      display_name: 女人
      tts:
        delivery: 聪慧果断，沉着中带着幽默
        timbre: 温暖明净
        pace: 平稳利落
        pitch: 中
    man:
      display_name: 男人
      tts:
        delivery: 直率自信，带着原始的粗犷
        timbre: 厚实清晰
        pace: 稳健
        pitch: 中低
    cat:
      display_name: 猫
      tts:
        delivery: 独立机敏，骄傲又善于盘算
        timbre: 柔滑清亮
        pace: 从容灵巧
        pitch: 中高
    dog:
      display_name: 狗
      tts:
        delivery: 忠诚坦率，行动干脆
        timbre: 洪亮温厚
        pace: 明快
        pitch: 中低
    horse:
      display_name: 马
      tts:
        delivery: 朴实郑重，略显笨拙
        timbre: 宽厚低沉
        pace: 舒缓
        pitch: 低
    bat:
      display_name: 蝙蝠
      tts:
        delivery: 机警热心，说话一本正经
        timbre: 细亮轻巧
        pace: 轻快
        pitch: 高
  chapters:
    - id: ch01
      title: 世上第一道歌唱魔法
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            听好啦，亲爱的宝贝。这件事发生在驯兽还没有被驯服的年月。狗、马、牛、羊和猪全是野的，一个个独自在湿漉漉的荒野树林里生活。所有野兽当中，数猫最野。他从来独来独往，觉得哪里都没有分别。
        - id: ch01-b02
          speaker: narrator
          text: >-
            男人当然也很野，野得不得了。他遇见女人以后，才有了一点要变驯服的样子。女人不肯再陪他过野日子。她找了个干爽的洞穴，在地上铺好净沙，在最里面点起木柴，又把晒干的野马皮挂在洞口，尾巴朝下，当作门帘。
        - id: ch01-b03
          speaker: woman
          text: 亲爱的，回来时记得把脚擦干净。从现在起，我们要好好过日子了。
        - id: ch01-b04
          speaker: narrator
          text: >-
            那天晚上，他们吃了一顿丰盛的野味。野羊肉放在滚烫的石头上烤熟，又用野蒜和野胡椒调味。野鸭的肚子里塞满野米、野胡芦巴和野芫荽。桌上还有野牛骨髓、野樱桃和野西番莲果。男人吃得心满意足，在火前舒舒服服睡着了。女人却没有睡，只坐在那里梳头。她拿起又宽又肥的羊肩胛骨，细看上面的奇异纹路，又往火里添了些木柴，施出了世上第一道歌唱魔法。
        - id: ch01-b05
          speaker: narrator
          text: >-
            湿漉漉的荒野树林里，动物们聚到了一处。从很远的地方，它们就能望见洞穴里的那片火光。谁也没见过这种光，谁也猜不透它是什么意思。
        - id: ch01-b06
          speaker: horse
          text: 朋友们，敌人们，男人和女人为什么在大洞穴里造出那么大的光？那东西会不会害我们？
        - id: ch01-b07
          speaker: narrator
          text: 野狗抬起鼻子，闻到了烤羊肉的香气。
        - id: ch01-b08
          speaker: dog
          text: 我去瞧瞧，也问问。我闻着像是好东西。猫，跟我一起去。
        - id: ch01-b09
          speaker: cat
          text: 才不！我是独来独往的猫，哪里对我都一样。我不跟你去。
        - id: ch01-b10
          speaker: dog
          text: 那我们以后再也不是朋友。
        - id: ch01-b11
          speaker: narrator
          text: >-
            野狗小跑着奔向洞穴。等他走远一点，猫又对自己说，既然哪里都一样，自己为什么不能也去瞧一瞧、看一看，再随心离开呢？于是猫溜到野狗后面，悄悄地跟着，脚步轻得不能再轻。到了洞穴附近，他藏进一个不会被发现、又能听见所有动静的地方。
        - id: ch01-b12
          speaker: narrator
          text: >-
            野狗来到洞口，用鼻子顶起马皮门帘，贪婪地嗅着烤羊肉。正在端详肩胛骨的女人听见声音，笑了。
        - id: ch01-b13
          speaker: woman
          text: 第一个客人来了。荒野树林里的野家伙，你想要什么？
        - id: ch01-b14
          speaker: dog
          text: 我的敌人，我敌人的妻子，树林里这么香的东西究竟是什么？
        - id: ch01-b15
          speaker: narrator
          text: 女人把一根烤羊骨扔给野狗。
        - id: ch01-b16
          speaker: woman
          text: 野家伙，先尝尝再说。
        - id: ch01-b17
          speaker: narrator
          text: 野狗一口口啃着，只觉得这比他从前吃过的一切都鲜美。
        - id: ch01-b18
          speaker: dog
          text: 我的敌人，我敌人的妻子，请再给我一根。
        - id: ch01-b19
          speaker: woman
          text: 白天替我的男人打猎，晚上守住洞穴，你想吃多少烤骨头，我就给你多少。
        - id: ch01-b20
          speaker: cat
          text: 啊，这个女人很有智慧，不过还没有我聪明。
        - id: ch01-b21
          speaker: narrator
          text: 野狗爬进洞里，把头放到女人膝上。
        - id: ch01-b22
          speaker: dog
          text: 我的朋友，我朋友的妻子，我愿意白天帮你的男人打猎，夜里替你们看守洞穴。
        - id: ch01-b23
          speaker: cat
          text: 啊，这条狗可真傻。
        - id: ch01-b24
          speaker: narrator
          text: >-
            猫摇着自己的野尾巴，独自穿过湿漉漉的荒野树林，仍旧孤零零地走自己的路。他把看到的一切全藏在心里，一个字也没有告诉别的动物。等男人从火前醒来，忽然看到野狗待在洞穴里面，自然十分不解。
        - id: ch01-b25
          speaker: man
          text: 野狗为什么在这里？
        - id: ch01-b26
          speaker: woman
          text: 他不再是野狗了。他叫第一个朋友，会永远、永远、永远做我们的朋友。以后你去打猎，把他带上。
    - id: ch02
      title: 第一个仆人与美食的赐予者
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天晚上，女人从水草甸割回一大抱一大抱鲜嫩的青草，摊在火前慢慢烘干。洞里很快飘起新割干草的香味。女人坐到洞口，用马皮条编出一副笼头。接着，她又望向那块又宽又大的羊肩胛骨，施出了世上第二道歌唱魔法。
        - id: ch02-b02
          speaker: narrator
          text: 荒野树林里的动物都在纳闷，野狗怎么一去不回。野马终于跺起蹄子。
        - id: ch02-b03
          speaker: horse
          text: 我要去看个究竟，问问野狗为什么没回来。猫，你也来。
        - id: ch02-b04
          speaker: cat
          text: 才不！我是独来独往的猫，哪里对我都一样。我不去。
        - id: ch02-b05
          speaker: narrator
          text: >-
            可猫嘴上说不去，脚下却照旧极轻极轻地跟在后面，最后藏起来偷听。野马的鬃毛太长，垂下来绊住脚步，害得他一路跌跌撞撞。女人听到他磕磕绊绊地走近，又笑了起来。
        - id: ch02-b06
          speaker: woman
          text: 第二个客人来了。荒野树林里的野家伙，你要什么？
        - id: ch02-b07
          speaker: horse
          text: 我的敌人，我敌人的妻子，野狗去了哪里？
        - id: ch02-b08
          speaker: woman
          text: 你不是来找野狗的。你真正想要的，是这些香喷喷的草。
        - id: ch02-b09
          speaker: horse
          text: 没错。给我吃吧。
        - id: ch02-b10
          speaker: woman
          text: 那就低下你的野脑袋，戴上我给你的东西。这样，你每天都能吃三顿好草。
        - id: ch02-b11
          speaker: cat
          text: 啊，这个女人很聪明，不过还没有我聪明。
        - id: ch02-b12
          speaker: narrator
          text: 女人把皮笼头套上野马低下来的头。野马朝她脚边呼出热气。
        - id: ch02-b13
          speaker: horse
          text: 我的女主人，我男主人的妻子，为了这些好草，我愿意做你们的仆人。
        - id: ch02-b14
          speaker: cat
          text: 啊，这匹马可真傻。
        - id: ch02-b15
          speaker: narrator
          text: >-
            猫又摇着尾巴，独自走回湿漉漉的树林，仍旧没告诉任何人。男人和狗打猎归来，看见野马待在洞边。
        - id: ch02-b16
          speaker: man
          text: 野马为什么在这里？
        - id: ch02-b17
          speaker: woman
          text: 他不再是野马了。他叫第一个仆人，会永远、永远、永远驮着我们来来去去。你去打猎时，可以骑他。
        - id: ch02-b18
          speaker: narrator
          text: >-
            第三天，轮到野母牛来了。她高高昂着野脑袋，小心不让一双野角钩住野树。猫仍旧尾随，仍旧躲到原来的地方。一切都像前两次那样发生，猫也在暗处说了同样的话。最后，野母牛答应每天把奶交给女人，用来换取那种鲜美的草。猫这才摇着野尾巴，独自穿过湿漉漉的荒野树林。他还是谁也没告诉。
        - id: ch02-b19
          speaker: narrator
          text: 男人、马和狗打猎回来，也像先前一样问起野母牛。
        - id: ch02-b20
          speaker: woman
          text: >-
            她不再叫野母牛了。她现在叫美食的赐予者，会永远、永远、永远把温热洁白的奶送给我们。以后，你带着第一个朋友和第一个仆人出去打猎，我会留在这里照料她。
        - id: ch02-b21
          speaker: narrator
          text: >-
            隔天，猫留在树林里等了又等，想看看还有没有别的野家伙去洞穴。可湿漉漉的树林里没有谁动身。他只好一个人走过去。到了那里，他看见女人挤牛奶，看见洞中的火光，也闻到了温热白奶的香气。
        - id: ch02-b22
          speaker: cat
          text: 我的敌人，我敌人的妻子，野母牛去了哪里？
        - id: ch02-b23
          speaker: woman
          text: >-
            回树林去吧。我已经编好头发，收起了施魔法的肩胛骨。洞里不再需要朋友，也不再需要仆人。
        - id: ch02-b24
          speaker: cat
          text: 我既不是朋友，也不是仆人。我是独来独往的猫，可我想进你的洞穴。
        - id: ch02-b25
          speaker: woman
          text: 那第一个晚上，你为什么不跟第一个朋友一起过来？
        - id: ch02-b26
          speaker: narrator
          text: 猫顿时发起火来。
        - id: ch02-b27
          speaker: cat
          text: 难道野狗在背后说了我的坏话？
          emotion: angry
        - id: ch02-b28
          speaker: woman
          text: >-
            你自己说过，你是独来独往的猫，哪里对你都一样。你不是朋友，也不是仆人。那就走开吧，独自到处走你的路。
        - id: ch02-b29
          speaker: narrator
          text: 猫马上装出一副伤心样。
        - id: ch02-b30
          speaker: cat
          text: >-
            难道我永远不能进洞？不能挨着暖火坐一坐？不能喝一口温热的白奶？你有智慧，又这么美丽，就算面对一只猫，也不该如此狠心。
        - id: ch02-b31
          speaker: woman
          text: >-
            我早知道自己有智慧，倒不知道自己还很美。这样吧，我们打个赌。只要我说一句赞美你的话，你便可以进洞。
        - id: ch02-b32
          speaker: cat
          text: 要是你说了两句呢？
        - id: ch02-b33
          speaker: woman
          text: 我才不会。不过，如果真说了两句，你可以坐到洞里的火边。
        - id: ch02-b34
          speaker: cat
          text: 那么三句呢？
        - id: ch02-b35
          speaker: woman
          text: >-
            我绝不会说三句。可要是真说了，你每天都能喝三顿温热的白奶，永远、永远、永远都有。
        - id: ch02-b36
          speaker: narrator
          text: 猫弓起了背。
        - id: ch02-b37
          speaker: cat
          text: >-
            洞口的门帘，洞穴深处的火，还有火边的奶罐，你们都记住我的敌人、我敌人的妻子刚才说过什么。
        - id: ch02-b38
          speaker: narrator
          text: >-
            猫说完，又摇着野尾巴，独自穿过湿漉漉的荒野树林，孤零零地走了。当天晚上，男人、马和狗打猎回来，女人没有把这个赌约告诉他们。她心里明白，他们听了这件事，多半不会高兴。
    - id: ch03
      title: 猫走进了洞穴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            猫走到很远很远的地方，独自藏在湿漉漉的荒野树林里。他在那里待了很久，久到女人把他和赌约忘得一干二净。只有倒挂在洞穴里面的小蝙蝠知道猫藏在哪里。每天傍晚，蝙蝠都会飞过树林，把洞穴里发生的新鲜事一件件告诉猫。
        - id: ch03-b02
          speaker: bat
          text: 洞里有了一个婴儿。他才出生，粉红粉红的，又胖又小。女人可疼他了。
        - id: ch03-b03
          speaker: cat
          text: 啊，那婴儿喜欢什么？
        - id: ch03-b04
          speaker: bat
          text: >-
            他喜欢柔软、能挠痒痒的东西，睡觉时喜欢抱着暖和的东西，也喜欢有人陪他玩。这些他样样都爱。
        - id: ch03-b05
          speaker: cat
          text: 啊，我等的机会来了。
        - id: ch03-b06
          speaker: narrator
          text: >-
            第二天还没亮，猫已经穿过荒野树林，藏到离洞穴很近的地方。清早，男人、狗和马全都出门打猎。女人忙着做饭，婴儿却不停哭闹，一次又一次打断她。她只好把孩子抱到洞外，塞给他一把小石子玩，可婴儿还是哭个不停。
        - id: ch03-b07
          speaker: narrator
          text: >-
            猫从藏身处伸出软绵绵的爪子，轻轻拍了拍婴儿的脸颊。婴儿不哭了，嘴里开始咿咿呀呀。猫又走近一些，用身子蹭着孩子胖乎乎的膝盖，再把野尾巴绕过去，挠他胖乎乎的下巴。婴儿终于大笑起来。女人听到这阵笑声，忙里抬起头，也露出了微笑。
        - id: ch03-b08
          speaker: bat
          text: >-
            我的女主人，我男主人的妻子，我男主人儿子的母亲，有个荒野树林来的野家伙，正陪你的婴儿玩得开心极了。
        - id: ch03-b09
          speaker: woman
          text: >-
            不论那个野家伙是谁，都愿福气落到他身上。我一早忙得脱不开手，他真是帮了我一个大忙。
        - id: ch03-b10
          speaker: narrator
          text: >-
            就在那一分、那一秒，亲爱的宝贝，洞口那张尾巴朝下的干马皮想起了赌约，哗啦一声整个落下来。女人弯腰去捡。等她重新抬起头，哎呀，你瞧，猫早已舒舒服服地坐在洞穴里面了。
        - id: ch03-b11
          speaker: cat
          text: >-
            我的敌人，我敌人的妻子，我敌人的母亲，正是我。你说了第一句赞美我的话，所以我能永远待在洞里。不过，我还是独来独往的猫，哪里对我都一样。
        - id: ch03-b12
          speaker: narrator
          text: >-
            女人气极了，紧紧抿住嘴唇，拿起纺车，一声不响地纺起线来。可是猫一离开婴儿，孩子马上又哭了。他在女人怀里又踢又挣，哭得脸都发黑。女人想尽办法，也没法叫他安静下来。
        - id: ch03-b13
          speaker: cat
          text: >-
            从你纺的线上抽出一根，系住纺锤轮，在地上拖着走。我让你看看一种魔法，能叫婴儿笑得像现在哭得一样响。
        - id: ch03-b14
          speaker: woman
          text: 我已经没别的办法，只好照做。不过，我可不会谢你。
        - id: ch03-b15
          speaker: narrator
          text: >-
            女人把线系在小小的陶制纺锤轮上，沿着地面慢慢拖过去。猫追着它扑来扑去，先用爪子拍打，再一头翻过跟头。他把纺锤轮从肩后甩开，又让它钻过两条后腿。他故意装作找不到，转眼又猛扑上去。婴儿笑得和方才哭得一样响，又爬着追赶猫，跟他闹遍整个洞穴。最后孩子终于玩累了，这才把猫抱在怀里，安安稳稳地睡下。
        - id: ch03-b16
          speaker: cat
          text: 现在，我来唱一支歌，让他安睡整整一个钟头。
        - id: ch03-b17
          speaker: narrator
          text: >-
            猫呼噜呼噜地唱起来，先响后轻，又先轻后响，直到婴儿睡得沉沉的。女人低头望着这一大一小，露出了笑容。
        - id: ch03-b18
          speaker: woman
          text: 这件事做得太漂亮了。猫，谁都看得出你确实聪明。
        - id: ch03-b19
          speaker: narrator
          text: >-
            就在那一分、那一秒，亲爱的宝贝，洞穴深处的火也记起了赌约。烟雾忽然从洞顶一团团压下来，噗的一声，遮住了整个洞穴。等烟慢慢散开，哎呀，你瞧，猫已经换了位置，舒舒服服坐在洞穴深处的暖火旁边。
        - id: ch03-b20
          speaker: cat
          text: >-
            我的敌人，我敌人的妻子，我敌人的母亲，还是我。你说了第二句赞美我的话，所以我能永远坐在温暖的火边。不过，我还是独来独往的猫，哪里对我都一样。
    - id: ch04
      title: 第三句赞美
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            女人这回气坏了，真是气得不能再气。她放下头发，往火里添了更多木柴，又拿出那块宽大的羊肩胛骨。她要施一道魔法管住自己，绝不说出第三句赞美猫的话。亲爱的宝贝，这回可不是歌唱魔法，而是寂静魔法。洞里一点点静下来，越来越静。过了一会儿，一只小得不能再小的老鼠从墙角钻出，飞快跑过地面。
        - id: ch04-b02
          speaker: cat
          text: 我的敌人，我敌人的妻子，我敌人的母亲，这只小老鼠也是你变出来的吗？
        - id: ch04-b03
          speaker: woman
          text: 呜！咦！当然不是！
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: >-
            女人吓得把肩胛骨扔在地上，一下跳到火前的小脚凳上。刚才放下来的头发还垂着，她赶快抓起来编好，唯恐老鼠顺着长发一直爬到自己身上。猫待在原地，把这一切看得清清楚楚。
        - id: ch04-b05
          speaker: cat
          text: 这么说，我吃掉它，也不会有危险吧？
        - id: ch04-b06
          speaker: woman
          text: 没有。快点吃掉它，我会一直感激你。
        - id: ch04-b07
          speaker: narrator
          text: 猫只跳了一下，就把小老鼠捉住了。
        - id: ch04-b08
          speaker: woman
          text: >-
            万分感谢！就算第一个朋友也没你这么快，捉不住这样的小老鼠。你一定非常有智慧。
        - id: ch04-b09
          speaker: narrator
          text: >-
            就在那一分、那一秒，亲爱的宝贝，放在火边的奶罐也记起了女人和猫的赌约。它发出嘶的一声，从正中裂成了两片。女人赶紧跳下脚凳。哎呀，你瞧，温热的白奶流进半片破罐，猫已经低下头，津津有味地舔了起来。
        - id: ch04-b10
          speaker: cat
          text: >-
            我的敌人，我敌人的妻子，我敌人的母亲，又是我。你说了第三句赞美我的话，所以我每天能喝三顿温热的白奶，永远、永远、永远都有。不过，我还是独来独往的猫，哪里对我都一样。
        - id: ch04-b11
          speaker: narrator
          text: 女人笑了，又给猫盛了满满一碗温热的白奶。
        - id: ch04-b12
          speaker: woman
          text: >-
            猫啊，你和男人一样聪明。不过别忘了，你只同我立了约，没有同男人和狗立约。他们回家以后会做什么，我可说不准。
        - id: ch04-b13
          speaker: cat
          text: >-
            那关我什么事？只要火边有我的位置，每天有三顿热奶，男人和狗想做什么，我都不在乎。
    - id: ch05
      title: 猫仍旧独来独往
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            傍晚，男人和狗打猎归来，走进洞穴。猫坐在温暖的火边微笑，女人便把整个赌约从头到尾讲给他们听。
        - id: ch05-b02
          speaker: man
          text: >-
            是这样没错。可他没有同我立约，也没有同我以后的正派男人们立约。
        - id: ch05-b03
          speaker: narrator
          text: >-
            男人先脱下自己的两只皮靴，又拿起一把小石斧。两只靴子加一把石斧，这已经是三样东西。接着，他取来一块木头和一把短柄斧。现在总共有五样了。他把这五样东西一件挨一件，整整齐齐摆成一排。
        - id: ch05-b04
          speaker: man
          text: >-
            现在轮到我们立约。只要你住在洞里，就要永远、永远、永远捉老鼠。不然，我每次看见你，都会拿这五样东西扔你。我以后的正派男人也会这样做。
        - id: ch05-b05
          speaker: woman
          text: 啊，这只猫的确聪明，可他还没有我的男人聪明。
        - id: ch05-b06
          speaker: narrator
          text: 猫数了数那五样东西。它们一个个棱角坚硬，看着就不好惹。
        - id: ch05-b07
          speaker: cat
          text: >-
            只要我待在洞里，我就永远、永远、永远替你们捉老鼠。不过，我还是独来独往的猫，哪里对我都一样。
        - id: ch05-b08
          speaker: man
          text: >-
            我在附近时可不一样。你要是没说最后那句话，我本来会把东西永远收起来。可现在，每次遇见你，我都要拿两只皮靴和小石斧扔你，一共三样。我以后的正派男人也会照办！
        - id: ch05-b09
          speaker: dog
          text: 等等！他没有同我立约，也没有同我以后的正派狗立约。
        - id: ch05-b10
          speaker: narrator
          text: 狗露出了尖牙。
        - id: ch05-b11
          speaker: dog
          text: >-
            只要我住在洞里，你就要永远、永远、永远好好待婴儿。不然，我会一直追，直到捉住你，再狠狠咬你。我以后的正派狗也会这样做。
        - id: ch05-b12
          speaker: woman
          text: 啊，这只猫是很聪明，可他还没有狗聪明。
        - id: ch05-b13
          speaker: narrator
          text: 猫数了数狗的牙齿。每一颗都尖得很。
        - id: ch05-b14
          speaker: cat
          text: >-
            只要婴儿不使劲扯我的尾巴，只要我待在洞里，我就会永远、永远、永远好好待他。不过，我还是独来独往的猫，哪里对我都一样。
        - id: ch05-b15
          speaker: dog
          text: >-
            我在附近时可不一样。你若没说最后那句话，我本来会永远闭紧嘴巴。可现在，每次碰见你，我都要追得你爬上树。我以后的正派狗也会照办。
        - id: ch05-b16
          speaker: narrator
          text: >-
            男人说到做到，立刻把两只皮靴和那把小石斧全扔向猫，一共三样东西。猫飞快冲出洞穴，狗紧紧追在后面，一步也不放松，最后把他一路赶到树上。
        - id: ch05-b17
          speaker: narrator
          text: >-
            从那时直到今天，亲爱的宝贝，每五个正派男人里，总有三个一见到猫，就忍不住拿起手边的东西扔他。每一条正派的狗见了猫，也会紧追不放，一直追得他爬上树。可是猫并没有赖掉自己许下的约。只要待在屋里，他就会替人捉老鼠，也会好好对待婴儿。当然，孩子不能把他的尾巴扯得太用力。
        - id: ch05-b18
          speaker: narrator
          text: >-
            可等该做的事做完，在两件事之间的空闲里，月亮一升起，夜色一落下，他就又成了独来独往的猫，哪里对他都一样。他走出人住的洞穴，走进湿漉漉的荒野树林，爬上湿漉漉的荒野大树，或是跳上湿漉漉的荒野屋顶。他一路摇着自己的野尾巴，仍旧孤零零地走自己的路。
        - id: ch05-b19
          speaker: narrator
          text: >-
            小猫能坐在火边唱歌，小猫能爬到树梢。或拿木塞拴根线胡闹，自己玩，不陪我玩耍。可我喜欢小狗宾基，因为他懂得怎样听话。宾基就像第一个朋友，我就是洞穴里的男人呀。
        - id: ch05-b20
          speaker: narrator
          text: >-
            小猫肯扮星期五，直到该把她的爪子沾湿，再叫她走过窗台，留下鲁滨孙看见的脚迹。她便蓬起尾巴喵喵叫，又抓又挠，不肯再听。可宾基肯玩我挑的游戏，他是我真正的第一个朋友。
        - id: ch05-b21
          speaker: narrator
          text: >-
            小猫拿脑袋蹭我的膝盖，假装她把我爱得厉害。可我刚刚钻进被窝，小猫就往院子里跑，一直待到天光照进来。所以我知道她只是假装爱。可宾基整夜在我脚边打鼾，他是我最最第一个朋友！
