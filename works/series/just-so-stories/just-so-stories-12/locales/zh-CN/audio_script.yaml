audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖俏皮，语气笃定
        timbre: 清亮圆润
        pace: 从容，遇到韵律段落时轻快
        pitch: 中
    suleiman:
      display_name: 苏莱曼·本·达乌德
      tts:
        delivery: 睿智宽厚，庄重中带着诙谐
        timbre: 温暖浑厚
        pace: 从容稳健
        pitch: 中低
    balkis:
      display_name: 巴尔基丝
      tts:
        delivery: 聪慧沉静，温柔而机敏
        timbre: 明净柔和
        pace: 舒缓利落
        pitch: 中
    sea_animal:
      display_name: 海中动物
      tts:
        delivery: 恭敬坦率，不慌不忙
        timbre: 深沉宽厚
        pace: 缓慢
        pitch: 低
    butterfly:
      display_name: 蝴蝶
      tts:
        delivery: 爱吹牛又好面子，慌张时仍强装镇定
        timbre: 轻快清亮
        pace: 灵活偏快
        pitch: 中高
    butterfly_wife:
      display_name: 蝴蝶太太
      tts:
        delivery: 伶俐直率，争辩时咄咄逼人
        timbre: 轻盈明亮
        pace: 明快
        pitch: 高
    egyptian_queen:
      display_name: 埃及王后
      tts:
        delivery: 大胆高傲，受惊后仍言辞果断
        timbre: 清晰饱满
        pace: 稍快
        pitch: 中高
    queen_2:
      display_name: 第二位王后
      tts:
        delivery: 惊慌急切
        timbre: 明亮
        pace: 快
        pitch: 高
    queen_3:
      display_name: 第三位王后
      tts:
        delivery: 惊慌急切
        timbre: 柔亮
        pace: 快
        pitch: 中高
    queen_4:
      display_name: 第四位王后
      tts:
        delivery: 惊慌急切
        timbre: 清脆
        pace: 快
        pitch: 高
  chapters:
    - id: ch01
      title: 最有智慧的君王
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            亲爱的宝贝，这回要讲的是一篇崭新又奇妙的故事，和前面的故事都不一样。故事的主人公，是最有智慧的君王苏莱曼·本·达乌德，也就是大卫之子所罗门。
        - id: ch01-b02
          speaker: narrator
          text: >-
            关于他的故事足足有三百五十五篇。可这一篇既不讲凤头麦鸡怎样找到水源，也不讲戴胜鸟怎样替他遮挡炎热。它不讲玻璃地面、歪孔红宝石或巴尔基丝的金条。它讲的，是一只会跺脚的蝴蝶。好啦，再从头留神听！
        - id: ch01-b03
          speaker: narrator
          text: >-
            苏莱曼·本·达乌德听得懂走兽、飞鸟、游鱼和昆虫说的话。地底深处，岩石朝彼此弯下去，互相挤压着呻吟，他明白它们在说什么。清晨过半，树木的叶子沙沙作响，他也听得懂。从长凳上的主教到墙头的牛膝草，世间万物都瞒不过他。王后之首巴尔基丝不但最美丽，也差不多和他一样聪明。
        - id: ch01-b04
          speaker: narrator
          text: >-
            这位君王还有无边的法力。他右手第三根手指上戴着一枚戒指。把戒指转一下，阿弗里特和精灵就从地下出来，无论他吩咐什么都会照办。转两下，仙子便从天空降下，同样听从他的一切命令。转三下，那位佩剑的大天使阿兹拉伊勒会扮成挑水人，前来告诉他上界、下界和此间三个世界的消息。
        - id: ch01-b05
          speaker: narrator
          text: >-
            这么大的本领，却没有让他变得骄傲。他极少炫耀，偶尔炫耀一回，事后也总会后悔。有一次，他要在一天里宴请全世界所有的动物。食物才预备好，一头动物便从深海冒了出来，只吃三口，就把一切吃得干干净净。苏莱曼·本·达乌德从没想到会有这种事，惊讶极了。
        - id: ch01-b06
          speaker: suleiman
          text: 动物啊，你是谁？
          emotion: surprised
        - id: ch01-b07
          speaker: sea_animal
          text: 愿我王万寿无疆！我们兄弟三万，我是最小的那个，家住海底。听说您要宴请全世界的动物，哥哥们派我来问，晚饭几时才好？
        - id: ch01-b08
          speaker: suleiman
          text: 可你刚才吃掉的，就是我为全世界所有动物预备的晚饭。
          emotion: surprised
        - id: ch01-b09
          speaker: sea_animal
          text: 愿我王万寿无疆，可那也能叫晚饭吗？在我们那里，每个兄弟两顿饭之间吃的点心，都有那分量的两倍。
        - id: ch01-b10
          speaker: narrator
          text: 苏莱曼·本·达乌德一下伏倒在地。
        - id: ch01-b11
          speaker: suleiman
          text: >-
            动物啊，我办这场宴席，不是真心要善待大家，只想炫耀自己多么伟大、多么富有。如今我这样羞愧，实在是活该。
        - id: ch01-b12
          speaker: narrator
          text: >-
            亲爱的宝贝，他的确有真正的智慧。从此再没有忘记，炫耀本领是一件傻事。现在，真正的故事就开始了。
        - id: ch01-b13
          speaker: narrator
          text: >-
            除了最美丽的巴尔基丝，他还有九百九十九位妻子。她们都住在一座宏伟的黄金宫殿里。宫殿坐落在美丽的大花园中央，园中到处都有喷泉。其实他根本不想娶那么多人，只因那年月人人都娶许多妻子，国王为了显出自己是国王，当然只好比别人娶得更多。
        - id: ch01-b14
          speaker: narrator
          text: >-
            有些妻子很好，有些却坏透了。坏的去跟好的争吵，把好的也闹坏了，最后所有人一起去吵苏莱曼·本·达乌德，让他苦不堪言。只有最美丽的巴尔基丝从不跟他争吵。她太爱他了。无论坐在黄金宫殿自己的房间里，还是独自在宫苑中散步，她都真心为他难过。
        - id: ch01-b15
          speaker: narrator
          text: >-
            其实君王只须转动戒指，叫来精灵和阿弗里特，它们就能施展魔法，把九百九十九位吵闹的妻子全都变成沙漠里的白骡、猎犬或一颗颗石榴籽。可他认定那样做就是卖弄本领。所以她们吵得太厉害时，他只能独自走进美丽宫苑的一角，心里巴不得自己从没出生。
        - id: ch01-b16
          speaker: narrator
          text: >-
            有一天，九百九十九个人一齐吵了整整三个星期。苏莱曼·本·达乌德像平常那样走出宫殿，想找一点安宁和清静。他在橙树之间遇见了巴尔基丝。巴尔基丝看到自己的君王被折磨得满心忧愁，也十分伤心。
        - id: ch01-b17
          speaker: balkis
          text: >-
            我的君王，我眼中的光啊，转动戒指吧。让埃及、美索不达米亚、波斯和中国的王后们看看，您是多么伟大而威严的国王。
        - id: ch01-b18
          speaker: suleiman
          text: >-
            我的夫人，我生命中的欢愉啊，别忘了那头海里的动物。我那次炫耀，结果在全世界的动物面前蒙了羞。要是这些波斯、埃及、阿比西尼亚和中国的王后只因惹我心烦，我就对她们炫耀，恐怕会比上回更加羞愧。
        - id: ch01-b19
          speaker: balkis
          text: 我的君王，我灵魂中的珍宝啊，那您怎么办呢？
        - id: ch01-b20
          speaker: suleiman
          text: 我的夫人，我心中的慰藉啊，我只好继续忍受命运，让这九百九十九位王后没完没了地争吵，继续折磨我。
        - id: ch01-b21
          speaker: narrator
          text: >-
            他继续向花园深处走去，沿途有百合、枇杷、玫瑰、美人蕉，还有香气浓重的姜花。最后，他来到那棵名叫“苏莱曼·本·达乌德的樟树”的大树下。巴尔基丝没有离开。她悄悄藏到树后高高的鸢尾、带着斑点的竹子和红百合之间，好离自己真正爱着的人近一点。
    - id: ch02
      title: 蝴蝶夸下海口
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 不久，两只蝴蝶吵着架飞到树下。苏莱曼·本·达乌德听见其中一只大声夸口。
        - id: ch02-b02
          speaker: butterfly
          text: >-
            你竟敢这样跟我说话！难道你不知道，只要我跺一跺脚，苏莱曼·本·达乌德的宫殿连同这座花园，立刻会在一声雷响里消失吗？
        - id: ch02-b03
          speaker: narrator
          text: >-
            君王一听这番夸口，立刻把九百九十九位烦人的妻子全忘了。他放声大笑，笑得整棵樟树都摇晃起来。随后，他伸出一根手指，把这位小小的吹牛大王叫来。蝴蝶怕得要命，还是勉强飞上他的手，紧紧攀在那里，一边不停扇动翅膀给自己透气。君王低下头，把声音压得极轻，悄悄问他。
        - id: ch02-b04
          speaker: suleiman
          text: 小兄弟，你明知道跺断不了一片草叶，为什么还要对妻子撒这样吓人的谎？她一定是你的妻子吧。
        - id: ch02-b05
          speaker: narrator
          text: >-
            蝴蝶抬头看见，这位最有智慧的君王眼里闪着光，像严寒夜空里的星星。他这才用两边翅膀鼓足勇气，把小脑袋歪向一旁回答。
        - id: ch02-b06
          speaker: butterfly
          text: 愿我王万寿无疆。她当然是我妻子。您也知道，妻子都是怎样的。
        - id: ch02-b07
          speaker: narrator
          text: 苏莱曼·本·达乌德藏在胡须里笑了。
        - id: ch02-b08
          speaker: suleiman
          text: 是啊，小兄弟，我知道。
        - id: ch02-b09
          speaker: butterfly
          text: 总得想办法管住她。她跟我吵了一整个早晨，我说那句话，只为让她安静。
        - id: ch02-b10
          speaker: suleiman
          text: 但愿有用。回妻子身边去吧，让我听听你怎么说。
        - id: ch02-b11
          speaker: narrator
          text: 蝴蝶飞回叶子后面，蝴蝶太太还在那里浑身发抖。
        - id: ch02-b12
          speaker: butterfly_wife
          text: 他听见了！苏莱曼·本·达乌德亲耳听见你了！
          emotion: fearful
        - id: ch02-b13
          speaker: butterfly
          text: 听见我？那当然。我原本就想让他听见。
        - id: ch02-b14
          speaker: butterfly_wife
          text: 他怎么说？快告诉我，他到底说了什么？
        - id: ch02-b15
          speaker: butterfly
          text: >-
            这话只在你我之间说，亲爱的。当然，我一点也不怪他。那座宫殿准花了很多钱，花园里的橙子眼看又要成熟了。他很担心我一跺脚会毁掉这一切，所以特意求我别跺。我已经答应了他。
        - id: ch02-b16
          speaker: butterfly_wife
          text: 天哪，真没想到！
          emotion: surprised
        - id: ch02-b17
          speaker: narrator
          text: >-
            蝴蝶太太惊叹了一声，马上坐好，再也不动了。苏莱曼·本·达乌德却被那只坏心眼的小蝴蝶的厚脸皮逗得眼泪直流。巴尔基丝从树后红百合之间站起来，独自微笑。刚才所有的话，她全都听见了。她心想，只要自己足够聪明，也许还能把君王从吵闹王后的折磨中救出来。于是她伸出一根手指，把蝴蝶太太轻声叫来。蝴蝶太太虽然怕得厉害，还是飞过去，紧紧攀住了她雪白的手。
        - id: ch02-b18
          speaker: balkis
          text: 小妹妹，你相信丈夫刚才说的话吗？
        - id: ch02-b19
          speaker: narrator
          text: >-
            蝴蝶太太抬眼望着巴尔基丝。最美丽的王后双眼明亮，像两潭很深的水，水面洒满了星光。蝴蝶太太也用两边翅膀鼓足勇气，终于开了口。
        - id: ch02-b20
          speaker: butterfly_wife
          text: 愿王后永远美丽。您也知道，男人都是怎样的。
        - id: ch02-b21
          speaker: narrator
          text: 智慧的示巴女王用手遮住嘴角，不让笑意露出来。
        - id: ch02-b22
          speaker: balkis
          text: 小妹妹，我知道。
        - id: ch02-b23
          speaker: butterfly_wife
          text: >-
            他们动不动就发火，可我们只好顺着他们。他们的话，一半都不算数。要是我丈夫喜欢以为，我真信他一跺脚就能弄没那座宫殿，那也随他。明天他自己就忘了。
        - id: ch02-b24
          speaker: balkis
          text: >-
            你说得对。不过下次他吹牛，你就当真。叫他跺一脚，看看会怎样。我们都知道男人是什么样的，对吧？到时他会羞得抬不起头。
        - id: ch02-b25
          speaker: narrator
          text: 蝴蝶太太飞回去。不到五分钟，两口子吵得比先前更凶。
        - id: ch02-b26
          speaker: butterfly
          text: 你可记住！记住我一跺脚能做什么！
        - id: ch02-b27
          speaker: butterfly_wife
          text: 我一个字也不信。真有本事，你现在就跺给我看。
        - id: ch02-b28
          speaker: butterfly
          text: 我答应苏莱曼·本·达乌德不跺脚。我不能说话不算数。
        - id: ch02-b29
          speaker: butterfly_wife
          text: >-
            失信又怎样？你连一片草叶都压不弯。我偏要激你试试。跺呀！跺呀！跺呀！
        - id: ch02-b30
          speaker: narrator
          text: >-
            坐在樟树下的君王把每一个字都听得清清楚楚，笑得比一生中任何时候都快活。他忘了自己的王后们，忘了那头从海里来的动物，也忘了炫耀本领这回事。他什么也不想，只管欢喜地放声大笑。树的另一边，巴尔基丝看到真正心爱的人如此快乐，也含笑望着他。
        - id: ch02-b31
          speaker: narrator
          text: 没过多久，蝴蝶又热又气，鼓着身子，打着旋儿飞回树阴下。
        - id: ch02-b32
          speaker: butterfly
          text: >-
            她非要我跺脚！她非要亲眼看看会发生什么！苏莱曼·本·达乌德啊，您明明知道我根本办不到。如今她再也不会相信我说的任何一句话了。她会不停地笑我，一直笑到我生命的最后一天！
          emotion: fearful
    - id: ch03
      title: 惊天动地的一跺
      blocks:
        - id: ch03-b01
          speaker: suleiman
          text: 不会的，小兄弟。她以后再也不敢笑你。
        - id: ch03-b02
          speaker: narrator
          text: >-
            苏莱曼·本·达乌德说完，便转动了指上的戒指。这一回只为帮助那只小蝴蝶，绝不是为了炫耀自己的本领。瞧啊，就在那一刹那，四个无比高大的精灵从地下冒了出来。每一个都高大得惊人。
        - id: ch03-b03
          speaker: suleiman
          text: >-
            奴仆们，等我手指上这位先生跺一下左前脚，你们就把我的宫殿和周围这些花园一同搬走，让它们随着一声雷响消失。等他再跺一次，你们就小心地把宫殿和花园送回原处。
        - id: ch03-b04
          speaker: narrator
          text: 那只厚脸皮的蝴蝶，此刻正坐在君王手指上。
        - id: ch03-b05
          speaker: suleiman
          text: 去吧，小兄弟。回到妻子那里，想跺多少就跺多少。
        - id: ch03-b06
          speaker: narrator
          text: 蝴蝶飞了回去。蝴蝶太太还在不住地叫阵。
        - id: ch03-b07
          speaker: butterfly_wife
          text: 我就激你跺！现在跺呀！快跺！
        - id: ch03-b08
          speaker: narrator
          text: >-
            巴尔基丝看见四个巨大的精灵弯下腰，分别抓住花园四角，宫殿就在正中央。她轻轻拍起双手。
        - id: ch03-b09
          speaker: balkis
          text: >-
            苏莱曼·本·达乌德终于肯为了蝴蝶，去做早该为自己做的事。那些爱吵架的王后，这回准要吓坏了！
        - id: ch03-b10
          speaker: narrator
          text: >-
            于是蝴蝶真的跺了一脚。四个精灵猛地将整座宫殿和花园拔到一千英里高的空中。紧接着，一声可怕至极的雷鸣炸开，四周一下黑得像墨。蝴蝶太太什么也看不见，只能在黑暗中乱飞，吓得哭出了声。
        - id: ch03-b11
          speaker: butterfly_wife
          text: >-
            我会听话！我真后悔说了那些话。亲爱的好丈夫，只要你把花园送回来，我再也不顶嘴了！
          emotion: fearful
        - id: ch03-b12
          speaker: narrator
          text: >-
            蝴蝶自己也吓得不轻。苏莱曼·本·达乌德却笑了好几分钟，才攒够一口气说话。
        - id: ch03-b13
          speaker: suleiman
          text: 再跺一次，小兄弟。伟大的魔法师，请把我的宫殿还回来吧。
        - id: ch03-b14
          speaker: butterfly_wife
          text: >-
            对，快把他的宫殿还给他！我们不要再弄这种可怕又讨厌的魔法了，一次也不要了。
          emotion: fearful
        - id: ch03-b15
          speaker: narrator
          text: 蝴蝶太太仍在黑暗里飞来飞去，活像一只飞蛾。蝴蝶尽量装出勇敢的样子。
        - id: ch03-b16
          speaker: butterfly
          text: >-
            好吧，亲爱的。你看看，都是你唠叨才闹成这样。我自己当然无所谓，这种场面早就见惯了。不过看在你和苏莱曼·本·达乌德的情面上，我就把一切恢复原样。
        - id: ch03-b17
          speaker: narrator
          text: >-
            他又跺了一脚。就在那一瞬间，精灵把宫殿和花园稳稳放回地面，连轻轻一下颠簸也没有。阳光重新照在深绿色的橙树叶上，喷泉又在粉红的埃及百合之间跳跃，鸟儿从刚才停下的地方继续歌唱。蝴蝶太太侧身躺在樟树下，来回摆着翅膀，大口大口喘气。
        - id: ch03-b18
          speaker: butterfly_wife
          text: 我会听话！我会听话！
          emotion: fearful
        - id: ch03-b19
          speaker: narrator
          text: 苏莱曼·本·达乌德笑得浑身发软，连嗝都打起来。他向后靠着，朝蝴蝶晃晃手指。
        - id: ch03-b20
          speaker: suleiman
          text: 伟大的巫师啊，你还我宫殿，却又要让我活活笑死，这是什么道理？
        - id: ch03-b21
          speaker: narrator
          text: >-
            忽然，一阵可怕的喧闹从宫殿里涌来。九百九十九位王后全冲了出来。她们一路尖叫，一路高声呼喊自己的孩子。她们一排一百人，急急忙忙奔下喷泉下方宽阔的大理石台阶。最有智慧的巴尔基丝端庄地走上前去，迎住了她们。
        - id: ch03-b22
          speaker: balkis
          text: 王后们，你们遇到了什么麻烦？
        - id: ch03-b23
          speakers: [egyptian_queen, queen_2, queen_3, queen_4]
          ensemble: chorus
          text: >-
            什么麻烦？我们本来像平常一样，安安稳稳住在黄金宫殿里。可宫殿突然不见了！只剩下我们坐在又浓又臭的黑暗里。四周雷声轰鸣，精灵和阿弗里特还在黑暗中来回走动。这就是我们的麻烦，王后之首啊！我们被它搅得苦不堪言，因为从来没有一场麻烦像它这么麻烦！
          emotion: fearful
        - id: ch03-b24
          speaker: narrator
          text: >-
            最美丽的巴尔基丝，是苏莱曼·本·达乌德最最亲爱的宝贝。她统治着示巴、塞布尔和南方流淌黄金的河流，疆土从津恩沙漠一直延伸到津巴布韦高塔。她的智慧，差不多赶得上最有智慧的苏莱曼·本·达乌德。面对惊慌的人群，她从容地回答。
        - id: ch03-b25
          speaker: balkis
          text: >-
            没什么，王后们！有一只蝴蝶前来告妻子的状，因为妻子总和他争吵。我们的君王苏莱曼·本·达乌德便乐意教教蝴蝶太太，要她轻声说话，为人谦逊。在蝴蝶的妻子当中，这可是大家都看重的美德。
        - id: ch03-b26
          speaker: narrator
          text: 法老的女儿，那位埃及王后忍不住开口。
        - id: ch03-b27
          speaker: egyptian_queen
          text: >-
            我们的宫殿绝不可能为了一只小虫，像一棵韭葱似的被连根拔起！不，一定是苏莱曼·本·达乌德死了。刚才听到的雷声和眼前降下的黑暗，都是大地得知这消息后的反应。
        - id: ch03-b28
          speaker: narrator
          text: 巴尔基丝连看也没看这位大胆的王后，只向她和其他人招了招手。
        - id: ch03-b29
          speaker: balkis
          text: 你们亲自过来看看。
    - id: ch04
      title: 巴尔基丝的智慧
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            王后们仍旧一排一百人，一齐走下大理石台阶。她们来到樟树下，看见最有智慧的君王还笑得全身无力，坐在那里前后摇晃。他的两只手上各停着一只蝴蝶，而他正在对它们说话。
        - id: ch04-b02
          speaker: suleiman
          text: >-
            我空中兄弟的妻子啊，以后凡事都要让丈夫称心，免得他再跺一脚。他说自己早就习惯这种魔法，看来果然是位了不起的魔法师，连我的宫殿也能偷走。小家伙们，安心去吧！
        - id: ch04-b03
          speaker: narrator
          text: >-
            君王说完，亲了亲两只蝴蝶的翅膀，它们便一同飞走了。最美丽、最光彩照人的巴尔基丝独自站在一旁微笑。除了她，所有王后都惊慌地伏倒在地。
        - id: ch04-b04
          speakers: [egyptian_queen, queen_2, queen_3, queen_4]
          ensemble: chorus
          text: >-
            一只蝴蝶被自己的妻子惹恼，尚且会闹出这种可怕的事。我们却连续许多天高声叫嚷，当面争吵，惹恼了自己的国王。他又会怎样处置我们？
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: >-
            她们赶紧把面纱盖到头上，又用双手紧紧捂住嘴巴。随后，所有人都踮起脚尖，一步一步回宫殿去了，安静得像一群最胆小的小老鼠。最美丽、最出色的巴尔基丝穿过红百合，走进樟树的阴影，把一只手轻轻放在君王肩头。
        - id: ch04-b06
          speaker: balkis
          text: >-
            我的君王，我灵魂中的珍宝啊，高兴吧。我们给埃及、埃塞俄比亚、阿比西尼亚、波斯、印度和中国的王后，上了一堂永远忘不了的课。
        - id: ch04-b07
          speaker: narrator
          text: 苏莱曼·本·达乌德仍看着两只蝴蝶在阳光中嬉戏。
        - id: ch04-b08
          speaker: suleiman
          text: >-
            我的夫人，我幸福中的明珠啊，这是什么时候发生的？我进花园以后，一直只顾同蝴蝶开玩笑。
        - id: ch04-b09
          speaker: narrator
          text: 他把自己刚才怎样帮助蝴蝶、怎样转动戒指叫来四个精灵，一一说给巴尔基丝听。
        - id: ch04-b10
          speaker: balkis
          text: >-
            我的君王，我生命的主宰啊，我一直藏在樟树后面，从开头到结尾全都看见了。是我教蝴蝶太太把丈夫的话当真，叫他当场跺脚。我盼着您会为了这个玩笑施展一场大魔法，让那些王后亲眼看见您的力量，也让她们从此害怕。
        - id: ch04-b11
          speaker: narrator
          text: >-
            温柔而最可爱的巴尔基丝又把王后们说过什么、亲眼看见什么、心里怎样猜想，一件一件全告诉了他。苏莱曼·本·达乌德听完，便从樟树下的座位上站起来。他舒展双臂，满心都是欢喜。
        - id: ch04-b12
          speaker: suleiman
          text: >-
            我的夫人，我岁月里的甘甜啊，如果我因为骄傲或愤怒，对王后们施展魔法，就会像当初宴请所有动物那样，最后一定蒙羞。可借助你的智慧，我这回施展魔法，只为一个玩笑，也只为帮助小蝴蝶。没想到，它还把我从烦人妻子的折磨里救了出来！我的夫人，我心中之心啊，你怎么会如此聪明？
        - id: ch04-b13
          speaker: narrator
          text: 美丽高挑的巴尔基丝仰望他的眼睛，像那只蝴蝶一样微微歪着头。
        - id: ch04-b14
          speaker: balkis
          text: 第一，因为我爱您。第二，因为我知道女人都是怎样的。
        - id: ch04-b15
          speaker: narrator
          text: >-
            随后，他们一同走回黄金宫殿，从此一直幸福地生活下去。故事讲完了，不过，亲爱的宝贝，你说巴尔基丝是不是聪明极了？
        - id: ch04-b16
          speaker: narrator
          text: >-
            从这里直到世界尽头，从没有王后能像巴尔基丝。可她同一只蝴蝶谈心，就像同朋友谈心一般亲密。

            自从世界有了开端，从没有国王能像所罗门。可他同一只蝴蝶说话，就像男人对男人那样认真。

            她是示巴的女王，他是亚洲的君王。可他们出门散步时，都会同蝴蝶聊上一场！
