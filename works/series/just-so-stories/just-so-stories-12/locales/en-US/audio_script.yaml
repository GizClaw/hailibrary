  chapters:
    - id: ch01
      title: The Wisest King and Queen
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            This, O my Best Beloved, is a new and wonderful story. It is different from all the others, because it tells of the Most Wise Sovereign Suleiman-bin-Daoud, Solomon the Son of David, and of the Butterfly that Stamped.
        - id: ch01-b02
          speaker: narrator
          text: >-
            There are three hundred and fifty-five stories about Suleiman-bin-Daoud, but this is none of those. It is not about the Lapwing who found the Water, the Hoopoe who shaded the King from the heat, the Glass Pavement, the Ruby with the Crooked Hole, or the Gold Bars of Balkis. So listen closely, all over again.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Suleiman-bin-Daoud was wise. He understood the speech of beasts, birds, fishes, and insects. He heard what the rocks said when they bowed toward one another and groaned far underground. He knew what the trees were saying when their leaves rustled in the middle of the morning. Nothing escaped his understanding, from the bishop on the bench to the hyssop on the wall. His Head Queen was the Most Beautiful Queen Balkis, and she was almost as wise as he was.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He was powerful too. On the third finger of his right hand, he wore a ring. If he turned it once, Afrits and Djinns rose out of the earth and did whatever he commanded. If he turned it twice, Fairies came down from the sky and did whatever he asked. If he turned it three times, the very great angel Azrael of the Sword appeared, dressed as a water-carrier, and brought him news from all three worlds, Above, Below, and Here.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Yet Suleiman-bin-Daoud was not proud. He seldom showed off, and whenever he did, he regretted it. Once he prepared enough food to feed every animal in the world for a day. But when it was ready, an Animal rose from the deep sea and swallowed the whole feast in three mouthfuls.
        - id: ch01-b06
          speaker: suleiman
          text: O Animal, who are you?
          emotion: surprised
        - id: ch01-b07
          speaker: sea_animal
          text: >-
            O King, live for ever! I am the smallest of thirty thousand brothers who live at the bottom of the sea. We heard you meant to feed every animal in the world, so my brothers sent me to ask when dinner would be ready.
        - id: ch01-b08
          speaker: suleiman
          text: But you have eaten the dinner I prepared for every animal in the world!
          emotion: surprised
        - id: ch01-b09
          speaker: sea_animal
          text: >-
            O King, live for ever, do you truly call that dinner? Where I come from, each of us eats twice that much between meals.
        - id: ch01-b10
          speaker: narrator
          text: Suleiman-bin-Daoud fell flat on his face.
        - id: ch01-b11
          speaker: suleiman
          text: >-
            O Animal, I gave that feast to show everyone what a great and wealthy king I was. I did not do it out of kindness. Now I am ashamed, and it serves me right.
          emotion: sad
        - id: ch01-b12
          speaker: narrator
          text: >-
            He was a truly wise man, Best Beloved. After that, he never forgot how foolish it was to show off. And now the real part of the story begins.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Suleiman-bin-Daoud had nine hundred and ninety-nine wives besides Balkis. They all lived in a great golden palace in the middle of a lovely garden filled with fountains. He did not really want nine hundred and ninety-nine wives. But in those days everyone married ever so many, and of course the King was expected to marry ever so many more than anyone else, just to show that he was the King.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Some of the wives were pleasant and some were simply horrid. The horrid ones quarreled with the pleasant ones until the pleasant ones became horrid too. Then all of them turned and quarreled with Suleiman-bin-Daoud, which was horrid for him. Balkis the Most Beautiful never quarreled with him. She loved him too much. Whether she sat in her rooms in the Golden Palace or walked alone in the Palace garden, she felt truly sorry for him.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The King could have turned his ring and called up the Djinns and Afrits. They could have changed all those quarrelsome Queens into white mules of the desert, swift greyhounds, or even tiny pomegranate seeds. But Suleiman-bin-Daoud believed that would be showing off. So whenever their quarreling became unbearable, he only walked alone in a distant part of the beautiful Palace gardens and wished he had never been born.
        - id: ch01-b16
          speaker: narrator
          text: >-
            One day, after all nine hundred and ninety-nine wives had quarreled together for three weeks, he went out as usual in search of peace. Among the orange trees he met Balkis, who was deeply troubled to see him so worried.
        - id: ch01-b17
          speaker: balkis
          text: >-
            O my Lord and Light of my Eyes, turn the ring on your finger. Show the Queens of Egypt, Mesopotamia, Persia, and China that you are the great and terrible King.
        - id: ch01-b18
          speaker: narrator
          text: Suleiman-bin-Daoud shook his head.
        - id: ch01-b19
          speaker: suleiman
          text: >-
            O my Lady and Delight of my Life, remember the Animal from the sea. I showed off, and it shamed me before every animal in the world. If I used my power merely because these Queens trouble me, I might be shamed even more.
        - id: ch01-b20
          speaker: balkis
          text: O my Lord and Treasure of my Soul, then what will you do?
        - id: ch01-b21
          speaker: suleiman
          text: >-
            O my Lady and Content of my Heart, I shall endure my fate and bear the endless quarreling of these nine hundred and ninety-nine Queens.
        - id: ch01-b22
          speaker: narrator
          text: >-
            He walked on past lilies, loquats, roses, cannas, and strongly scented ginger-plants until he reached the great Camphor Tree of Suleiman-bin-Daoud. Balkis followed unseen. She hid behind the tree among tall irises, spotted bamboos, and red lilies, so she could remain close to her own true love.
        - id: ch01-b23
          speaker: narrator
          text: Before long, two Butterflies flew beneath the tree, quarreling.
    - id: ch02
      title: The Butterfly's Boast
      blocks:
        - id: ch02-b01
          speaker: butterfly
          text: >-
            How dare you speak to me that way! Don't you know that one stamp of my foot would make Suleiman-bin-Daoud's whole Palace and this garden vanish in a clap of thunder?
        - id: ch02-b02
          speaker: narrator
          text: >-
            Suleiman-bin-Daoud forgot all about his nine hundred and ninety-nine troublesome wives. He laughed so hard at the Butterfly's boast that the camphor-tree shook. Then he held out one finger.
        - id: ch02-b03
          speaker: suleiman
          text: Come here, little man.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The Butterfly was terribly frightened, but he managed to fly onto the King's hand. He clung there, fanning himself, while Suleiman-bin-Daoud bent close and spoke very softly.
        - id: ch02-b05
          speaker: suleiman
          text: >-
            Little man, all your stamping could not bend a single blade of grass. Why did you tell your wife such a dreadful lie? She is your wife, isn't she?
        - id: ch02-b06
          speaker: narrator
          text: >-
            The Butterfly looked up. The wise King's eye was twinkling like stars on a frosty night. That gave him courage enough for both wings, and he tilted his head to one side.
        - id: ch02-b07
          speaker: butterfly
          text: O King, live for ever. Yes, she is my wife, and you know what wives are like.
        - id: ch02-b08
          speaker: narrator
          text: Suleiman-bin-Daoud smiled into his beard.
        - id: ch02-b09
          speaker: suleiman
          text: Yes, little brother. I know.
        - id: ch02-b10
          speaker: butterfly
          text: >-
            A husband has to keep some sort of order. She has been quarreling with me all morning, so I said it to make her quiet.
        - id: ch02-b11
          speaker: suleiman
          text: >-
            Then I hope it quiets her. Go back to your wife, little brother, and let me hear what you tell her.
        - id: ch02-b12
          speaker: narrator
          text: >-
            The Butterfly flew back to his wife. She was hidden behind a green leaf, all of a flutter and trembling nervously from wing to wing.
        - id: ch02-b13
          speaker: butterfly_wife
          text: He heard you! Suleiman-bin-Daoud himself heard everything you said!
          emotion: fearful
        - id: ch02-b14
          speaker: butterfly
          text: Heard me? Of course he did. I wanted him to hear.
        - id: ch02-b15
          speaker: butterfly_wife
          text: And what did he say? Tell me! What did he say?
        - id: ch02-b16
          speaker: narrator
          text: The Butterfly fanned himself with great importance.
        - id: ch02-b17
          speaker: butterfly
          text: >-
            Well, my dear, this is only between you and me. I cannot blame the poor King, because that Palace must have cost a great deal, and all the oranges in the garden are just ripening. He asked me not to stamp my foot, and I gave him my solemn promise that I would not.
        - id: ch02-b18
          speaker: butterfly_wife
          text: Good gracious!
          emotion: surprised
        - id: ch02-b19
          speaker: narrator
          text: >-
            She sat perfectly still. Suleiman-bin-Daoud laughed until tears ran down his face at the impudence of that bad little Butterfly.
        - id: ch02-b20
          speaker: narrator
          text: >-
            Behind the tree, among the red lilies, Balkis rose and smiled to herself. She had heard the whole conversation. If she used her wisdom, she thought, she might still save her Lord from those quarrelsome Queens. She held out one finger and whispered to the Butterfly's Wife.
        - id: ch02-b21
          speaker: balkis
          text: Come here, little woman.
        - id: ch02-b22
          speaker: narrator
          text: >-
            The Butterfly's Wife flew up in great fear and clung to Balkis's white hand. The beautiful Queen bent her head close.
        - id: ch02-b23
          speaker: balkis
          text: Little woman, do you believe what your husband just told you?
        - id: ch02-b24
          speaker: narrator
          text: >-
            The Butterfly's Wife looked into the Queen's eyes. They shone like deep pools with starlight on them. She gathered courage into both wings before she answered.
        - id: ch02-b25
          speaker: butterfly_wife
          text: O Queen, be lovely for ever. You know what men-folk are like.
        - id: ch02-b26
          speaker: narrator
          text: Wise Balkis of Sheba raised a hand to her lips to hide her smile.
        - id: ch02-b27
          speaker: balkis
          text: I do know, little sister.
        - id: ch02-b28
          speaker: butterfly_wife
          text: >-
            Men become angry over nothing at all, O Queen, and we have to humor them. They never mean half of what they say. If it pleases my husband to imagine that I believe he can make Suleiman-bin-Daoud's Palace disappear merely by stamping one foot, I do not mind. By tomorrow he will have forgotten the whole thing.
        - id: ch02-b29
          speaker: balkis
          text: >-
            You are quite right, little sister. But the next time he boasts, take him at his word. Ask him to stamp and see what happens. We know what men-folk are like. He will be terribly ashamed.
        - id: ch02-b30
          speaker: narrator
          text: >-
            The Butterfly's Wife flew back to her husband. Within five minutes they were quarreling worse than before.
        - id: ch02-b31
          speaker: butterfly
          text: Remember what I can do! Remember what happens if I stamp my foot!
        - id: ch02-b32
          speaker: butterfly_wife
          text: >-
            I do not believe a bit of it. I would very much like to see you do it. Go on, then. Stamp now.
        - id: ch02-b33
          speaker: butterfly
          text: I gave Suleiman-bin-Daoud my promise not to stamp, and I will not break it.
        - id: ch02-b34
          speaker: butterfly_wife
          text: >-
            It would make no difference if you did. Your stamping could not bend one blade of grass. I dare you. Stamp! Stamp! Stamp!
    - id: ch03
      title: The Stamp and the Thunder
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Suleiman-bin-Daoud sat beneath the camphor-tree and heard every word. He laughed as he had never laughed in his life. He forgot all nine hundred and ninety-nine Queens. He forgot the Animal that had risen from the sea, and he forgot every worry about showing off. For that moment, he simply laughed with joy. On the other side of the tree, Balkis smiled because her own true love was so joyful again.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Soon the Butterfly came whirling into the tree's shadow. He was hot, puffed up, and desperate.
        - id: ch03-b03
          speaker: butterfly
          text: >-
            She wants me to stamp, O Suleiman-bin-Daoud! She wants to see what happens. You know I cannot do it. Now she will never believe me again, and she will laugh at me for the rest of my days!
          emotion: fearful
        - id: ch03-b04
          speaker: suleiman
          text: No, little brother. She will never laugh at you again.
        - id: ch03-b05
          speaker: narrator
          text: >-
            He turned the ring on his finger for the little Butterfly's sake, not to show off. At once, four enormous Djinns rose out of the earth.
        - id: ch03-b06
          speaker: suleiman
          text: >-
            Slaves, watch this gentleman sitting on my finger. When he stamps his left front foot, make my Palace and all these gardens vanish with a clap of thunder. When he stamps once more, bring everything back carefully.
        - id: ch03-b07
          speaker: suleiman
          text: Now go back to your wife, little brother, and stamp as much as you please.
        - id: ch03-b08
          speaker: narrator
          text: The Butterfly flew straight back. His wife was still calling to him.
        - id: ch03-b09
          speaker: butterfly_wife
          text: I dare you! Do it now! Stamp! Stamp!
        - id: ch03-b10
          speaker: narrator
          text: >-
            Balkis watched the four huge Djinns bend over the four corners of the gardens, with the Palace in the middle. She clapped her hands softly.
        - id: ch03-b11
          speaker: balkis
          text: >-
            At last Suleiman-bin-Daoud will do for a Butterfly what he should have done for himself long ago. The quarrelsome Queens will be frightened at last.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Then the Butterfly stamped. At once, the four Djinns jerked the Palace and the whole garden a thousand miles into the air. The most dreadful thunderclap crashed around them, and everything turned black as ink. The Butterfly's Wife could see nothing at all. She fluttered wildly through the darkness and cried out to her husband.
        - id: ch03-b13
          speaker: butterfly_wife
          text: >-
            Oh, I will be good! I am so sorry I spoke that way. Please bring the gardens back, my dear darling husband, and I will never contradict you again!
          emotion: fearful
        - id: ch03-b14
          speaker: narrator
          text: >-
            The Butterfly was nearly as frightened as she was. Suleiman-bin-Daoud laughed so hard that several minutes passed before he found enough breath to whisper.
        - id: ch03-b15
          speaker: suleiman
          text: >-
            Stamp again, little brother. Give me back my Palace, O most great magician.
        - id: ch03-b16
          speaker: butterfly_wife
          text: >-
            Yes, give him back his Palace! Put it back where it belongs, and let us have no more of this horrible magic.
          emotion: fearful
        - id: ch03-b17
          speaker: butterfly
          text: >-
            Well, my dear, now you see what your nagging has caused. It makes no difference to me, of course. I am used to this sort of thing. But as a favor to you and Suleiman-bin-Daoud, I will put everything right.
        - id: ch03-b18
          speaker: narrator
          text: >-
            He stamped once more. In that same instant, the Djinns lowered the Palace and gardens without so much as a bump. The sun shone again upon the dark green leaves of the orange trees. The fountains played among the pink Egyptian lilies, exactly as before, and all the birds went on singing. Under the camphor-tree, the Butterfly's Wife lay on her side, panting for breath and slowly waving her wings.
        - id: ch03-b19
          speaker: butterfly_wife
          text: Oh, I will be good! I will be good!
          emotion: fearful
        - id: ch03-b20
          speaker: narrator
          text: >-
            Suleiman-bin-Daoud could scarcely speak for laughing. Weak and hiccuping, he leaned back and shook one finger at the Butterfly.
        - id: ch03-b21
          speaker: suleiman
          text: >-
            O mighty wizard, what good is it to return my Palace if you kill me with laughter at the same time?
        - id: ch03-b22
          speaker: narrator
          text: >-
            Then a terrible noise came from the Palace. All nine hundred and ninety-nine Queens rushed outside at once, shrieking, shouting, and calling for their babies. They hurried down the broad marble steps beneath the fountain, packed one hundred abreast. While all the others cried out in confusion, Most Wise Balkis walked forward with perfect dignity to meet them.
        - id: ch03-b23
          speaker: balkis
          text: What troubles you, O Queens?
        - id: ch03-b24
          speakers: [queen_egypt, queen_persia, queen_china, queen_abyssinia]
          ensemble: chorus
          text: >-
            What troubles us? We were living peacefully in our golden palace, as we always do, when the Palace suddenly vanished! We were left sitting in thick, foul darkness. Thunder crashed around us, and Djinns and Afrits moved through the blackness. That is our trouble, O Head Queen. It was the most troublesome trouble we have ever known, and we are extremely troubled by it!
          emotion: fearful
        - id: ch03-b25
          speaker: narrator
          text: >-
            Balkis was the Most Beautiful Queen, Suleiman-bin-Daoud's Very Best Beloved, Queen of Sheba and Sable and the Rivers of the Gold of the South, from the Desert of Zinn to the Towers of Zimbabwe. She was almost as wise as the Most Wise King himself.
        - id: ch03-b26
          speaker: balkis
          text: >-
            It is nothing, O Queens. A Butterfly complained that his wife had quarreled with him. Our Lord Suleiman-bin-Daoud chose to teach her to speak softly and be humble, as the wives of butterflies are expected to be.
        - id: ch03-b27
          speaker: narrator
          text: Then a bold Egyptian Queen, the daughter of a Pharaoh, spoke up.
        - id: ch03-b28
          speaker: queen_egypt
          text: >-
            A little insect cannot pull our Palace out by the roots like a leek! No. Suleiman-bin-Daoud must be dead. The earth thundered and the sky went dark because of the news.
        - id: ch03-b29
          speaker: narrator
          text: Balkis beckoned to the bold Queen without even looking at her.
        - id: ch03-b30
          speaker: balkis
          text: Come and see.
    - id: ch04
      title: The Wisdom of Balkis
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The Queens came down the great marble steps, still marching one hundred abreast. Beneath his camphor-tree they found the Most Wise King Suleiman-bin-Daoud. He was still weak from laughing and rocked helplessly backward and forward, with one little Butterfly resting upon each hand.
        - id: ch04-b02
          speaker: suleiman
          text: >-
            O wife of my brother in the air, remember this. You must please your husband in all things, or you may provoke him to stamp again. He says he is accustomed to such magic, and he is clearly a very great magician. Why, he can steal away the Palace of Suleiman-bin-Daoud himself! Go in peace, little folk.
        - id: ch04-b03
          speaker: narrator
          text: >-
            He kissed both Butterflies on their wings, and away they flew. Every Queen except Balkis fell flat on her face. The Most Beautiful and Splendid Balkis stood apart, smiling.
        - id: ch04-b04
          speakers: [queen_egypt, queen_persia, queen_china, queen_abyssinia]
          ensemble: chorus
          text: >-
            If this happens when a Butterfly is angry with his wife, what will happen to us? We have angered our King with days and days of loud voices and open quarreling!
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: >-
            The Queens pulled their veils over their heads, covered their mouths with their hands, and rose without another shout. Then all nine hundred and ninety-nine of them tiptoed back toward the Palace, as quiet as mice.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Balkis, the Most Beautiful and Excellent Balkis, walked through the red lilies into the shade of the camphor-tree. She placed one hand upon Suleiman-bin-Daoud's shoulder.
        - id: ch04-b07
          speaker: balkis
          text: >-
            O my Lord and Treasure of my Soul, rejoice! We have given the Queens of Egypt, Ethiopia, Abyssinia, Persia, India, and China a great lesson that they will never forget.
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: Suleiman-bin-Daoud was still watching the Butterflies play in the sunlight.
        - id: ch04-b09
          speaker: suleiman
          text: >-
            O my Lady and Jewel of my Happiness, when did that happen? Ever since I entered the garden, I have only been joking with a Butterfly.
        - id: ch04-b10
          speaker: narrator
          text: Then he told Balkis everything he had done.
        - id: ch04-b11
          speaker: balkis
          text: >-
            O my Lord and Regent of my Life, I was hidden behind the camphor-tree, and I saw it all. I told the Butterfly's Wife to ask him to stamp. I hoped you would make some great magic for the sake of the joke, and that the Queens would see it and be frightened.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Tender and Most Lovely Balkis told him what the Queens had heard, seen, and believed. Then Suleiman-bin-Daoud rose from his seat beneath the camphor-tree. He stretched out his arms and rejoiced.
        - id: ch04-b13
          speaker: suleiman
          text: >-
            O my Lady and Sweetener of my Days, if I had used magic against my Queens out of pride or anger, as I did when I made that feast for every animal, I would surely have been put to shame. But your wisdom led me to make magic for a joke and for a little Butterfly. And look! The same magic has freed me from the quarreling of my troublesome wives. Tell me, O my Lady and Heart of my Heart, how did you grow so wise?
          emotion: happy
        - id: ch04-b14
          speaker: narrator
          text: >-
            Balkis the Queen, beautiful and tall, looked into Suleiman-bin-Daoud's eyes. She tilted her head a little to one side, just as the Butterfly had done.
        - id: ch04-b15
          speaker: balkis
          text: >-
            First, O my Lord, because I loved you. And second, O my Lord, because I know what women-folk are like.
        - id: ch04-b16
          speaker: narrator
          text: Then they returned to the Palace and lived happily ever after.
        - id: ch04-b17
          speaker: narrator
          text: But wasn't Balkis clever?
        - id: ch04-b18
          speaker: narrator
          text: >-
            There was never a Queen like Balkis, from here to the wide world's end. Yet Balkis spoke to a butterfly just as you would speak to a friend.
        - id: ch04-b19
          speaker: narrator
          text: >-
            There was never a King like Solomon, not since the world began. Yet Solomon spoke to a butterfly as a man would speak to a man.
        - id: ch04-b20
          speaker: narrator
          text: >-
            She was Queen of Sabaea, and he was Asia's Lord. But both of them spoke to butterflies whenever they walked abroad.
