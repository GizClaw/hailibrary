audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, playful, and assured
        timbre: clear and rounded
        pace: measured with lively rhythmic turns
        pitch: medium
    whale:
      display_name: Whale
      tts:
        delivery: grand, blunt, and easily troubled
        timbre: deep and booming
        pace: slow
        pitch: low
    stute_fish:
      display_name: Small 'Stute Fish
      tts:
        delivery: quick, clever, and politely sly
        timbre: light and crisp
        pace: brisk
        pitch: high
    mariner:
      display_name: Shipwrecked Mariner
      tts:
        delivery: resourceful, bold, and dryly humorous
        timbre: weathered and resonant
        pace: steady
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Last Fish in the Sea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, O my Best Beloved, there was a Whale in the sea, and he ate fishes. He ate the starfish and the garfish, the crab and the dab, the plaice and the dace, the skate and his mate, the mackerel and the pickerel, and the really truly twirly-whirly eel. He opened his mouth and ate every fish he could find, just so.
        - id: ch01-b02
          speaker: narrator
          text: At last, only one small fish remained in the whole sea. He was a small 'Stute Fish, and he kept close behind the Whale's right ear, where the Whale could not harm him. The Whale stood upright on his tail.
        - id: ch01-b03
          speaker: whale
          text: I'm hungry.
        - id: ch01-b04
          speaker: narrator
          text: The small 'Stute Fish answered in his small, clever voice.
        - id: ch01-b05
          speaker: stute_fish
          text: Noble and generous Cetacean, have you ever tasted Man?
        - id: ch01-b06
          speaker: whale
          text: No, I haven't. What does Man taste like?
        - id: ch01-b07
          speaker: stute_fish
          text: Man tastes nice, but nubbly.
        - id: ch01-b08
          speaker: whale
          text: Then go and fetch me one.
        - id: ch01-b09
          speaker: narrator
          text: The Whale beat his tail until the sea frothed around him.
        - id: ch01-b10
          speaker: stute_fish
          text: One at a time will be quite enough. Swim to Fifty North and Forty West. That is magic. There, in the middle of the sea, you will find one shipwrecked Mariner sitting on a raft. He has nothing on but blue canvas breeches, a pair of suspenders, and a jack-knife. Do not forget the suspenders, Best Beloved. And I should tell you fairly that this man has infinite resource and sagacity.
    - id: ch02
      title: Down into the Whale
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Off went the Whale, swimming as fast as he could to Fifty North and Forty West. There, on a raft in the very middle of the sea, he found one single, solitary shipwrecked Mariner. The Mariner was trailing his toes in the water. He wore blue canvas breeches and suspenders, and he carried a jack-knife.
        - id: ch02-b02
          speaker: narrator
          text: He had his mummy's permission to paddle. Without it, he would never have put his toes in the water, because he was a man of infinite resource and sagacity.
        - id: ch02-b03
          speaker: narrator
          text: The Whale opened his mouth wider and wider and wider, until it nearly reached his tail. Then he swallowed the shipwrecked Mariner, the raft beneath him, the blue canvas breeches, the suspenders that you must remember, and the jack-knife. He swallowed the whole lot into the warm, dark cupboards inside him. After that, he smacked his lips and spun around three times on his tail.
        - id: ch02-b04
          speaker: narrator
          text: But the Mariner soon discovered that he was truly inside the Whale's warm, dark cupboards. So he stumped and jumped. He thumped and bumped. He pranced and danced, banged and clanged, hit and bit, leaped and crept. He prowled and howled, hopped and dropped, cried and sighed, crawled and bawled, stepped and leapt. Then he danced hornpipes in places where hornpipes should never be danced.
        - id: ch02-b05
          speaker: narrator
          text: All of this made the Whale most unhappy indeed. And have you remembered the suspenders?
    - id: ch03
      title: A Very Nubbly Meal
      blocks:
        - id: ch03-b01
          speaker: whale
          text: This man is terribly nubbly. And now he's making me hiccup. What am I supposed to do?
        - id: ch03-b02
          speaker: stute_fish
          text: Tell him he must come out.
        - id: ch03-b03
          speaker: narrator
          text: The Whale called all the way down his own throat to the shipwrecked Mariner.
        - id: ch03-b04
          speaker: whale
          text: Come out now, and behave yourself. You've given me the hiccups.
        - id: ch03-b05
          speaker: mariner
          text: Nay, nay, I will not come out! Carry me home to my native shore and the white cliffs of Albion. Then I may consider it.
        - id: ch03-b06
          speaker: narrator
          text: And the Mariner danced harder than ever.
        - id: ch03-b07
          speaker: stute_fish
          text: You had better take him home. I really should have warned you. That man has infinite resource and sagacity.
    - id: ch04
      title: The Grating in the Throat
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Whale swam and swam and swam. He drove himself onward with both flippers and his tail, as hard as he could swim while hiccupping. At last, he saw the Mariner's native shore and the white cliffs of Albion.
        - id: ch04-b02
          speaker: narrator
          text: The Whale rushed halfway up the beach and opened his mouth wide and wider and widest.
        - id: ch04-b03
          speaker: whale
          text: Change here for Winchester, Ashuelot, Nashua, Keene, and every station on the Fitchburg Road.
        - id: ch04-b04
          speaker: narrator
          text: The instant the Whale reached the word "Fitch," the Mariner walked straight out of his mouth.
        - id: ch04-b05
          speaker: narrator
          text: While the Whale had been swimming, though, that resourceful and sagacious Mariner had been busy. With his jack-knife, he cut the raft into a small square grating, with the pieces crossing over one another. Then he tied it firmly together with his suspenders. Now you see why you had to remember them.
        - id: ch04-b06
          speaker: narrator
          text: The Mariner pulled the grating tight into the Whale's throat, and there it stuck. Then he recited a Sloka for the Whale. Since you have not heard it yet, I shall tell it to you now.
        - id: ch04-b07
          speaker: mariner
          text: By means of a grating, I have stopped your ating.
        - id: ch04-b08
          speaker: narrator
          text: You see, the Mariner was also an Hibernian.
    - id: ch05
      title: Fifty North and Forty West
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Mariner stepped onto the shingle and went home to his mother, who had given him permission to trail his toes in the water. Later, he married and lived happily ever after. The Whale lived happily ever after too.
        - id: ch05-b02
          speaker: narrator
          text: But the grating stayed in the Whale's throat from that day onward. He could neither cough it up nor swallow it down, and it kept him from eating anything but very, very small fish. That is why whales today never eat men, or boys, or little girls.
        - id: ch05-b03
          speaker: narrator
          text: As for the small 'Stute Fish, he went and hid in the mud beneath the Door-sills of the Equator. He was afraid the Whale might be angry with him.
        - id: ch05-b04
          speaker: narrator
          text: The Sailor carried his jack-knife home, and he still wore the blue canvas breeches when he stepped onto the shingle. The suspenders stayed behind because they were holding the grating together. And that is the end of that tale.
        - id: ch05-b05
          speaker: narrator
          text: |-
            When the cabin portholes look dark and green
            From the seas outside,
            When the ship goes wop, with a wiggle between,
            And the steward falls into the soup tureen,
            And all of the trunks begin to slide,
            When Nursey lies in a heap on the floor,
            And Mummy says, "You must let her sleep,"
            And nobody wakes you or washes or dresses you,
            Then, if you haven't already guessed,
            You'll know you're at Fifty North and Forty West!
