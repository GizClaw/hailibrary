audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖俏皮，语气笃定
        timbre: 清亮圆润
        pace: 从容，遇到韵律段落时轻快
        pitch: 中
    whale:
      display_name: 鲸鱼
      tts:
        delivery: 气派直率，遇事容易慌张
        timbre: 低沉洪亮
        pace: 缓慢
        pitch: 低
    stute_fish:
      display_name: 小机灵鱼
      tts:
        delivery: 反应敏捷，聪明中带着客气的狡黠
        timbre: 轻巧清脆
        pace: 轻快
        pitch: 高
    mariner:
      display_name: 遇难的水手
      tts:
        delivery: 胆大机敏，带着不动声色的幽默
        timbre: 粗粝浑厚
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 大海里最后一条小鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前呀，我最最亲爱的孩子，大海里有一条鲸鱼，专门拿鱼当饭吃。海星、雀鳝、螃蟹、鲽鱼、欧鲽、雅罗鱼，鳐鱼和它的伴儿，鲭鱼、梭鱼，还有那条真真正正弯弯绕、绕弯弯的鳗鱼，他逮着什么就吃什么。只要是海里找得到的鱼，他把嘴一张，啊呜一口，就吞下去了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            最后，整片大海里只剩下一条小鱼。这条小机灵鱼总躲在鲸鱼右耳朵后面一点点，免得遭殃。鲸鱼用尾巴撑着，直立起来。
        - id: ch01-b03
          speaker: whale
          text: 我饿了。
        - id: ch01-b04
          speaker: narrator
          text: 小机灵鱼用他那细细的机灵嗓音答话了。
        - id: ch01-b05
          speaker: stute_fish
          text: 尊贵又慷慨的鲸类先生，您吃过人吗？
        - id: ch01-b06
          speaker: whale
          text: 没吃过。人尝起来怎么样？
        - id: ch01-b07
          speaker: stute_fish
          text: 味道鲜美，不过有点疙疙瘩瘩。
        - id: ch01-b08
          speaker: whale
          text: 那就给我弄一个来。
        - id: ch01-b09
          speaker: narrator
          text: 鲸鱼甩动尾巴，把周围的海水搅成了一片白沫。
        - id: ch01-b10
          speaker: stute_fish
          text: >-
            一次吃一个就尽够了。您游到北纬五十度、西经四十度去吧，这几个字可是咒语。到了那儿，您会在茫茫大海的正中央看见一只木筏。筏子上坐着一个遇难的水手，身上只穿着蓝帆布裤，系着一副背带，还带了一把折刀。那副背带可千万别忘了呀，我最最亲爱的孩子。还有一句话，我得先说在前面，这个人有无穷无尽的办法，也有过人的机智。
    - id: ch02
      title: 鲸鱼肚里的水手
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            鲸鱼就这么游啊，游啊，使出全身力气，一直游到北纬五十度、西经四十度。果然，茫茫大海正中央漂着一只木筏，筏子上孤零零坐着一个遇难的水手。他除了蓝帆布裤和那副千万要记住的背带，再没穿别的衣裳，手边只有一把折刀。水手把脚趾垂在水里，正划着玩呢。他妈妈准许他玩水，他才敢这么做。要不然，他绝不会做，因为他有无穷无尽的办法，也有过人的机智。
        - id: ch02-b02
          speaker: narrator
          text: >-
            鲸鱼张开大嘴，越张越大，越张越大，眼看嘴角就要碰到尾巴了。他一口吞下水手，又吞下木筏、蓝帆布裤、那副千万不能忘的背带，还有折刀。这些东西一下子全进了鲸鱼温暖又黑暗的肚内橱柜。他咂咂嘴，再用尾巴撑住身子，转了整整三圈。
        - id: ch02-b03
          speaker: narrator
          text: >-
            水手发现自己当真落进了鲸鱼温暖又黑暗的肚内橱柜，立刻闹腾起来。别忘了，他可是个既有办法又机智过人的家伙。他跺脚，跳跃，又捶又撞。他腾挪起舞，砰砰地敲，锵锵地闹。他又打又咬，又蹿又爬。他四处潜行，放声号叫，跳起来又摔下去。他哭过，叹过，爬过，喊过，走了几步又蹦了几下，还偏偏挑了最不该跳舞的地方，大跳水手舞。鲸鱼被折腾得难受极了。对了，你没忘记那副背带吧？
        - id: ch02-b04
          speaker: whale
          text: 这个人也太疙疙瘩瘩了！而且他害得我一直打嗝。我现在该怎么办？
        - id: ch02-b05
          speaker: stute_fish
          text: 叫他出来呀。
        - id: ch02-b06
          speaker: narrator
          text: 鲸鱼只好对着自己的喉咙深处喊下去。
        - id: ch02-b07
          speaker: whale
          text: 快出来，规矩一点！你害得我直打嗝。
    - id: ch03
      title: 回到白色峭壁
      blocks:
        - id: ch03-b01
          speaker: mariner
          text: 不成，不成！不能这么办，得反过来才行。你先把我送回出生的海岸，送到阿尔比恩的白色峭壁那儿。等到了地方，我再考虑出不出来。
        - id: ch03-b02
          speaker: narrator
          text: 说完，水手跳得比刚才还要起劲。
        - id: ch03-b03
          speaker: stute_fish
          text: 依我看，您最好还是送他回家。我早该提醒您的，这个人有无穷无尽的办法，还有过人的机智。
        - id: ch03-b04
          speaker: narrator
          text: >-
            鲸鱼没有别的办法，只得摆动两只鳍和一条尾巴，游啊，游啊，又游啊。他一路打着嗝，还是使尽力气往前赶。终于，水手出生的海岸出现了，阿尔比恩的白色峭壁也出现了。鲸鱼猛冲过去，半个身子都上了沙滩，再把嘴张得大大的，又大大的，再大大的。
        - id: ch03-b05
          speaker: whale
          text: 去温彻斯特、阿舒洛特、纳舒厄、基恩，还有菲奇堡铁路沿线各站的旅客，请在这里换车。
        - id: ch03-b06
          speaker: narrator
          text: >-
            鲸鱼刚说出“菲奇”两个字，水手就从他嘴里走了出来。不过在回来的路上，水手可没闲着。这个人确实有无穷无尽的办法，还有过人的机智。他拿折刀把木筏削开，做成一小块纵横交错的方格栅，再拿那副背带把格栅牢牢扎紧。这下你总该明白，为什么一直不能忘记那副背带了吧？
        - id: ch03-b07
          speaker: narrator
          text: 水手使足力气，把格栅拖进鲸鱼的喉咙，紧紧卡在里面。然后，他吟了一首《颂诗》。你以前一定没听过，现在就让我讲给你听。
        - id: ch03-b08
          speaker: mariner
          text: 一方格栅喉中挡，从今休想饱吃粮。
    - id: ch04
      title: 喉咙里的格栅
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            这个水手还是个爱尔兰人哩。他踏上满是卵石的岸滩，回家见妈妈去了。原本就是妈妈准许，他才把脚趾垂进水里划着玩的。后来，水手结了婚，从此过着幸福的日子。鲸鱼也一样，往后的日子过得很快活。
        - id: ch04-b02
          speaker: narrator
          text: >-
            可是从那一天起，那块格栅就一直卡在鲸鱼的喉咙里。他咳也咳不出，咽也咽不下，从此只能吃非常非常小的鱼。这就是为什么直到今天，鲸鱼也从不吃男人，不吃男孩，也不吃小姑娘。
        - id: ch04-b03
          speaker: narrator
          text: 小机灵鱼呢，钻进赤道门槛下面的泥里躲了起来。他怕鲸鱼会生他的气。
        - id: ch04-b04
          speaker: narrator
          text: >-
            水手把折刀带回了家。踏上卵石滩的时候，他还穿着那条蓝帆布裤。背带当然没能带走，因为它留在鲸鱼肚里，拿来绑格栅了。好啦，这个故事到这里就讲完啦。
    - id: ch05
      title: 北纬五十度，西经四十度
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            舱房舷窗暗幽幽，海水映得绿汪汪。船身哐地一摇晃，中间还要晃一晃。乘务员跌进汤盆中央，行李箱也滑来撞去，满船乱闯。保姆瘫在地板上，缩成一团，妈妈叫你别出声，让她安安静静睡一场。没人叫你起床，也没人替你洗脸穿衣裳。这时候，要是你还没有猜到，就该知道，你正在北纬五十度，西经四十度上！
