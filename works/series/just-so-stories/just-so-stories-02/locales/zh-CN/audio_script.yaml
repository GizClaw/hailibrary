audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖俏皮，语气笃定
        timbre: 清亮圆润
        pace: 从容，遇到韵律段落时轻快
        pitch: 中
    camel:
      display_name: 骆驼
      tts:
        delivery: 懒散傲慢，惜字如金
        timbre: 粗厚含混
        pace: 拖沓
        pitch: 中低
    horse:
      display_name: 马
      tts:
        delivery: 勤快爽直，讲理时认真
        timbre: 明亮结实
        pace: 稳健
        pitch: 中
    dog:
      display_name: 狗
      tts:
        delivery: 忠实利落，不满时直截了当
        timbre: 清脆有力
        pace: 轻快
        pitch: 中高
    ox:
      display_name: 牛
      tts:
        delivery: 踏实沉着，话语简短
        timbre: 低沉宽厚
        pace: 缓慢
        pitch: 低
    man:
      display_name: 人
      tts:
        delivery: 务实严肃，带着无奈
        timbre: 温厚清楚
        pace: 平稳
        pitch: 中
    djinn:
      display_name: 镇尼
      tts:
        delivery: 威严机敏，施展魔法时从容诙谐
        timbre: 深沉通透
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 只会说“哼”的骆驼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            现在轮到下一个故事了。我最最亲爱的孩子，这个故事要告诉你，骆驼背上那个大驼峰，究竟是怎么来的。
        - id: ch01-b02
          speaker: narrator
          text: >-
            岁月才刚开始，整个世界都还新得很，动物们也刚刚替人做起了事。偏偏有一头骆驼不肯干活，独自住在呼啸沙漠正中央。他自己也只会吼叫，每天懒洋洋地嚼着树枝、荆棘、柽柳、马利筋和带刺的草。谁来找他，他都不肯多说。
        - id: ch01-b03
          speaker: camel
          text: 哼！
        - id: ch01-b04
          speaker: narrator
          text: 就这一声，别的什么也没有。
        - id: ch01-b05
          speaker: narrator
          text: >-
            到了星期一早晨，马来了。他背上有鞍，嘴里有嚼子，是特意来叫骆驼做事的。
        - id: ch01-b06
          speaker: horse
          text: 骆驼呀，骆驼，出来吧，跟我们一起小跑干活。
        - id: ch01-b07
          speaker: camel
          text: 哼！
        - id: ch01-b08
          speaker: narrator
          text: 马只得回去，把骆驼的回答告诉了人。
        - id: ch01-b09
          speaker: narrator
          text: 接着，狗嘴里叼着棍子，也来叫他。
        - id: ch01-b10
          speaker: dog
          text: 骆驼呀，骆驼，来跟大家一起衔东西、驮东西。
        - id: ch01-b11
          speaker: camel
          text: 哼！
        - id: ch01-b12
          speaker: narrator
          text: 狗也只得回去，把这话告诉了人。
        - id: ch01-b13
          speaker: narrator
          text: 后来，脖子上套着轭的牛又来找骆驼。
        - id: ch01-b14
          speaker: ox
          text: 骆驼呀，骆驼，来吧，跟我们一起耕地。
        - id: ch01-b15
          speaker: camel
          text: 哼！
        - id: ch01-b16
          speaker: narrator
          text: 牛没办法，也去把这事告诉了人。
    - id: ch02
      title: 三位动物的会议
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天干完活，人把马、狗和牛一起叫了过来。
        - id: ch02-b02
          speaker: man
          text: >-
            三位呀，三位，真是对不起。世界才刚开始，我也不愿意让你们受累。可沙漠里那个只会“哼”的家伙就是不来干活，我只好不管他了。往后你们得做双份，把他那一份也补起来。
        - id: ch02-b03
          speaker: narrator
          text: >-
            三位听完，气得不得了。世界明明才刚开始呀！他们跑到沙漠边上，开了一场帕拉弗会议，又接连开了印达巴会议、潘查耶特会议和帕瓦会议，要商量这件事。
        - id: ch02-b04
          speaker: narrator
          text: >-
            骆驼这时慢吞吞地走过来，嘴里还在嚼马利筋。他懒得叫人受不了，竟然还嘲笑他们。
        - id: ch02-b05
          speaker: camel
          text: 哼！
        - id: ch02-b06
          speaker: narrator
          text: 说完，他又走了。
        - id: ch02-b07
          speaker: narrator
          text: >-
            不久，一团尘云朝他们滚来。那是掌管所有沙漠的镇尼。镇尼出门总裹着尘云，因为这是魔法。他停下来，同三位开起了帕拉弗和帕瓦会议。
        - id: ch02-b08
          speaker: horse
          text: 掌管所有沙漠的镇尼，世界才刚刚开始，难道谁都可以这样偷懒吗？
        - id: ch02-b09
          speaker: djinn
          text: 当然不可以。
        - id: ch02-b10
          speaker: horse
          text: >-
            您的呼啸沙漠正中央就有这么个家伙。他脖子长，腿也长，自己还只会吼叫。从星期一早晨起，他一点活也没干，连小跑都不肯。
        - id: ch02-b11
          speaker: narrator
          text: 镇尼“咻”地吹了一声口哨。
        - id: ch02-b12
          speaker: djinn
          text: 拿阿拉伯所有的黄金来打赌，那一定是我的骆驼！他怎么回答你们？
        - id: ch02-b13
          speaker: dog
          text: 他就说“哼！”，还不肯衔东西、驮东西。
        - id: ch02-b14
          speaker: djinn
          text: 除了这个，他还说过什么吗？
        - id: ch02-b15
          speaker: ox
          text: 只有“哼！”。他也不肯耕地。
        - id: ch02-b16
          speaker: djinn
          text: 很好，那我就把他的“哼”变成哼包。请你们在这里稍等一会儿。
    - id: ch03
      title: 镇尼的大魔法
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            镇尼卷起身上的尘土斗篷，看准方向，越过沙漠去找骆驼。他发现那个懒得叫人受不了的家伙正守着一池水，出神地瞧着自己的倒影。
        - id: ch03-b02
          speaker: djinn
          text: 我这位又长又鼓的朋友，世界才刚开始，我怎么听说你半点活也不做？
        - id: ch03-b03
          speaker: camel
          text: 哼！
        - id: ch03-b04
          speaker: narrator
          text: 镇尼坐下来，用手托住下巴，默默琢磨起一个大魔法。骆驼还是只顾看水里的自己。
        - id: ch03-b05
          speaker: djinn
          text: >-
            你懒得实在叫人受不了。从星期一早晨到现在，那三位每天都得替你多干一份活。
        - id: ch03-b06
          speaker: narrator
          text: 镇尼说着，仍旧托着下巴，继续想他的魔法。
        - id: ch03-b07
          speaker: camel
          text: 哼！
        - id: ch03-b08
          speaker: djinn
          text: >-
            我要是你，就不再说这个字了。再说一次，也许就说得太多了。鼓泡泡的家伙，我要你去干活。
        - id: ch03-b09
          speaker: narrator
          text: 骆驼偏偏又开了口。
        - id: ch03-b10
          speaker: camel
          text: 哼！
        - id: ch03-b11
          speaker: narrator
          text: >-
            这声“哼”才出口，骆驼一向引以为傲的后背就鼓了起来。越鼓越高，越鼓越大，最后成了一个摇摇晃晃的大哼包。
        - id: ch03-b12
          speaker: djinn
          text: >-
            你看见了吧？这就是你自己的“哼”。你不肯干活，才给自己招来这个哼包。今天已经是星期四了。大家星期一开始做事，你却一天也没做。现在，该你去干活了。
    - id: ch04
      title: 骆驼背起了驼峰
      blocks:
        - id: ch04-b01
          speaker: camel
          text: 背上多了这么个哼包，我还怎么干活？
        - id: ch04-b02
          speaker: djinn
          text: >-
            这个哼包正是特意给你造的，因为你白白错过了三天。靠着它，你可以三天不吃东西，照样做事。你可别说我从来没帮过你。现在走出沙漠，到那三位那里去，规矩一点。把你的哼包背起来吧！
        - id: ch04-b03
          speaker: narrator
          text: >-
            骆驼只好驮着自己的哼包，连峰带哼，动身去找那三位。从那天直到今天，他一直背着这个“哼包”。如今我们叫它“驼峰”，这样才不会伤了他的心。
        - id: ch04-b04
          speaker: narrator
          text: >-
            可是，开天辟地时耽误的那三天活，他到现在也没有补上。至于该怎样守规矩，他也一直没有学会。
    - id: ch05
      title: 驼峰气
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            骆驼背上有个丑陋的峰包，动物园里你一眼就能瞧着。可我们若闲得无事可做，长出的驼峰气还要更糟。

            小孩子，大人也一样——呀——样。要是没有足够的事可忙——可——忙，我们就会生驼峰气，骆驼一样的驼峰气，又黑又青的一肚子气！

            我们爬下床，头发蓬乱，嗓音又凶又冲，叫人心烦。洗澡也嘟囔，穿靴也皱眉，对着玩具又哼又吼个没完。

            这时该有个墙角留给我，我知道也有一个留给你。每逢我们生驼峰气，骆驼一样的驼峰气，又黑又青的一肚子气！

            要治这毛病，可不能呆坐，也不能捧本书在炉边闷着。得拿起大锄头，再带把铲子，一直挖到身上微微出汗。

            这时你就会发现，太阳和风，还有花园里的镇尼，已经搬走了驼峰气，可怕的驼峰气，又黑又青的一肚子气！

            我和你一样——呀——样，也会生气。要是没有足够的事可忙——可——忙，人人都会生驼峰气，骆驼一样的驼峰气，小孩子，大人也一样！
