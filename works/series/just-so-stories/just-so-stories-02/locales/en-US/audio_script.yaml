  chapters:
    - id: ch01
      title: The Idlest Camel
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Now this is the next tale, and it tells how the Camel got his big hump.
        - id: ch01-b02
          speaker: narrator
          text: In the beginning of years, the world was still new, and the Animals were just starting to work for Man. But one Camel lived all by himself in the middle of a Howling Desert. He stayed there because he did not want to work, and besides, he was a Howler himself. All day he ate sticks, thorns, tamarisks, milkweed, and prickles, and he was most 'scruciating idle. Whenever anyone spoke to him, he gave the same answer and nothing more.
        - id: ch01-b03
          speaker: camel
          text: Humph!
        - id: ch01-b04
          speaker: narrator
          text: On Monday morning, the Horse came to him with a saddle on his back and a bit in his mouth.
        - id: ch01-b05
          speaker: horse
          text: Camel, O Camel, come out and trot with the rest of us.
        - id: ch01-b06
          speaker: camel
          text: Humph!
        - id: ch01-b07
          speaker: narrator
          text: So the Horse went away and told the Man. Then the Dog came with a stick in his mouth.
        - id: ch01-b08
          speaker: dog
          text: Camel, O Camel, come and fetch and carry with the rest of us.
        - id: ch01-b09
          speaker: camel
          text: Humph!
        - id: ch01-b10
          speaker: narrator
          text: The Dog went away and told the Man. After that, the Ox came with the yoke on his neck.
        - id: ch01-b11
          speaker: ox
          text: Camel, O Camel, come and plough with the rest of us.
        - id: ch01-b12
          speaker: camel
          text: Humph!
        - id: ch01-b13
          speaker: narrator
          text: And the Ox went away and told the Man.
    - id: ch02
      title: The Three Work Double-Time
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At the end of the day, the Man called the Horse, the Dog, and the Ox together.
        - id: ch02-b02
          speaker: man
          text: Three, O Three, I am very sorry for you, with the world so new and all. But that Humph-thing in the Desert cannot work, or he would have come here by now. I shall leave him alone, and you must work double-time to make up for it.
        - id: ch02-b03
          speaker: narrator
          text: That made the Three very angry, with the world so new and all. Now they had to do their own work and the Camel's work as well. They gathered at the edge of the Desert and talked the matter over in every way they knew. They held a palaver, an indaba, a punchayet, and a pow-wow. While they were talking, the Camel came by. He chewed on milkweed, laughed at them, and stayed most 'scruciating idle.
        - id: ch02-b04
          speaker: camel
          text: Humph!
        - id: ch02-b05
          speaker: narrator
          text: Then he went away again.
    - id: ch03
      title: The Djinn of All Deserts
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Before long, the Djinn in charge of All Deserts came rolling along in a cloud of dust. Djinns always travel that way because it is Magic. He stopped to palaver and pow-pow with the Three.
        - id: ch03-b02
          speaker: horse
          text: Djinn of All Deserts, is it right for anyone to sit idle, with the world so new and all?
        - id: ch03-b03
          speaker: djinn
          text: Certainly not.
        - id: ch03-b04
          speaker: horse
          text: Well, there is a thing in the middle of your Howling Desert, and he is a Howler himself. He has a long neck and long legs, and he has not done one bit of work since Monday morning. He refuses to trot.
        - id: ch03-b05
          speaker: narrator
          text: The Djinn whistled.
        - id: ch03-b06
          speaker: djinn
          text: Whew! For all the gold in Arabia, that must be my Camel. What does he say when you ask him to work?
        - id: ch03-b07
          speaker: dog
          text: He says, "Humph!" And he refuses to fetch and carry.
        - id: ch03-b08
          speaker: djinn
          text: Does he say anything else?
        - id: ch03-b09
          speaker: ox
          text: Nothing but "Humph!" And he refuses to plough.
        - id: ch03-b10
          speaker: djinn
          text: Very good. I will humph him. Kindly wait here for a minute.
    - id: ch04
      title: A Great Big Humph
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Djinn wrapped himself in his dust-cloak, took a bearing across the desert, and found the Camel. The lazy creature was staring at his own reflection in a pool of water.
        - id: ch04-b02
          speaker: djinn
          text: My long and bubbling friend, what is this I hear about you doing no work, with the world so new and all?
        - id: ch04-b03
          speaker: camel
          text: Humph!
        - id: ch04-b04
          speaker: narrator
          text: The Djinn sat down with his chin in his hand and began to think a Great Magic. The Camel went on staring at himself in the pool.
        - id: ch04-b05
          speaker: djinn
          text: You have made the Three do extra work ever since Monday morning, all because you are so 'scruciating idle.
        - id: ch04-b06
          speaker: narrator
          text: The Djinn kept thinking Magics, with his chin still in his hand.
        - id: ch04-b07
          speaker: camel
          text: Humph!
        - id: ch04-b08
          speaker: djinn
          text: If I were you, I would not say that again. You may say it once too often. Bubbles, I want you to work.
        - id: ch04-b09
          speaker: narrator
          text: But the Camel said it again.
        - id: ch04-b10
          speaker: camel
          text: Humph!
        - id: ch04-b11
          speaker: narrator
          text: The moment he said it, the back he was so proud of began puffing up and puffing up. It grew into a great big lolloping humph.
        - id: ch04-b12
          speaker: djinn
          text: Do you see that? It is your very own humph, and you brought it on yourself by refusing to work. Today is Thursday. The work began on Monday, and you have done nothing since then. Now you are going to work.
        - id: ch04-b13
          speaker: camel
          text: How can I work with this humph on my back?
        - id: ch04-b14
          speaker: djinn
          text: It was made on purpose because you missed those three days. Now you can work for three days without eating, because you can live on your humph. Do not ever say I did nothing for you. Leave the Desert, join the Three, and behave yourself. Humph yourself!
    - id: ch05
      title: The Hump We Get
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: So the Camel humphed himself, humph and all, and went off to join the Three. From that day to this, the Camel has always worn a humph. We call it a hump now, so we do not hurt his feelings. But he has never caught up with the three days he missed at the beginning of the world, and he has never learned how to behave.
        - id: ch05-b02
          speaker: narrator
          text: |-
            The Camel's hump is an ugly lump
            Which well you may see at the Zoo;
            But uglier yet is the hump we get
            From having too little to do.

            Kiddies and grown-ups too-oo-oo,
            If we haven't enough to do-oo-oo,
            We get the hump,
            Cameelious hump,
            The hump that is black and blue!
        - id: ch05-b03
          speaker: narrator
          text: |-
            We climb out of bed with a frouzly head
            And a snarly-yarly voice.
            We shiver and scowl and we grunt and we growl
            At our bath and our boots and our toys;

            And there ought to be a corner for me,
            And I know there is one for you,
            When we get the hump,
            Cameelious hump,
            The hump that is black and blue!
        - id: ch05-b04
          speaker: narrator
          text: |-
            The cure for this ill is not to sit still,
            Or frowst with a book by the fire;
            But to take a large hoe and a shovel also,
            And dig till you gently perspire.

            And then you will find that the sun and the wind,
            And the Djinn of the Garden too,
            Have lifted the hump,
            The horrible hump,
            The hump that is black and blue!
        - id: ch05-b05
          speaker: narrator
          text: |-
            I get it as well as you-oo-oo,
            If I haven't enough to do-oo-oo.
            We all get hump,
            Cameelious hump,
            Kiddies and grown-ups too!
