      display_name: Camel
      tts:
        delivery: lazy, dismissive, and stubborn
        timbre: dry and throaty
        pace: slow
        pitch: medium-low
    horse:
      display_name: Horse
      tts:
        delivery: earnest, hardworking, and direct
