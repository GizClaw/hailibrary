audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, playful, and assured
        timbre: clear and rounded
        pace: measured with lively rhythmic turns
        pitch: medium
    kangaroo:
      display_name: Old Man Kangaroo
      tts:
        delivery: proud, demanding, and increasingly weary
        timbre: woolly and resonant
        pace: brisk with emphatic turns
        pitch: medium
    nqa:
      display_name: Little God Nqa
      tts:
        delivery: abrupt and impatient
        timbre: light and dry
        pace: quick
        pitch: medium-high
    nquing:
      display_name: Middle God Nquing
      tts:
        delivery: sharp and dismissive
        timbre: firm and earthy
        pace: quick
        pitch: medium
    nqong:
      display_name: Big God Nqong
      tts:
        delivery: grand, courteous, and mischievously practical
        timbre: deep and smooth
        pace: unhurried
        pitch: low
    dingo:
      display_name: Yellow-Dog Dingo
      tts:
        delivery: hungry, dogged, and bewildered
        timbre: lean and dusty
        pace: energetic
        pitch: medium-low
  chapters:
    - id: ch01
      title: Three Wishes Before Five
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, Kangaroo did not look as he does today. He was a Different Animal with four short legs. He was grey and woolly, and far too proud. One morning, he danced on a rocky outcrop in the middle of Australia, then went to see the Little God Nqa.
        - id: ch01-b02
          speaker: kangaroo
          text: By five this afternoon, make me different from every other animal.
        - id: ch01-b03
          speaker: narrator
          text: This was at six, before breakfast. Nqa sprang up from his seat on the sandflat.
        - id: ch01-b04
          speaker: nqa
          text: Go away!
        - id: ch01-b05
          speaker: narrator
          text: Kangaroo was still grey and woolly, and still far too proud. He danced on a rock ledge in the middle of Australia, then went to the Middle God Nquing.
        - id: ch01-b06
          speaker: kangaroo
          text: By five this afternoon, make me different from every other animal. And make me wonderfully popular too.
        - id: ch01-b07
          speaker: narrator
          text: This was at eight, after breakfast. Nquing leaped from his burrow in the spinifex.
        - id: ch01-b08
          speaker: nquing
          text: Go away!
        - id: ch01-b09
          speaker: narrator
          text: But Kangaroo was as grey, woolly, and proud as ever. He danced on a sandbank in the middle of Australia, then went to the Big God Nqong.
        - id: ch01-b10
          speaker: kangaroo
          text: By five this afternoon, make me different from every other animal. Make me popular too, and make everyone run after me.
        - id: ch01-b11
          speaker: narrator
          text: This was at ten, before dinner-time. Nqong jumped out of his bath in the salt-pan.
        - id: ch01-b12
          speaker: nqong
          text: Yes. I will!
    - id: ch02
      title: Yellow-Dog Dingo Gives Chase
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Nqong called for Dingo. Yellow-Dog Dingo was always hungry and dusty in the sunshine. Nqong pointed out Kangaroo.
        - id: ch02-b02
          speaker: nqong
          text: Wake up, Dingo! See that gentleman dancing on the ashpit? He wants to be popular. He truly wants someone to run after him. Go and make it happen.
        - id: ch02-b03
          speaker: dingo
          text: What? That cat-rabbit?
        - id: ch02-b04
          speaker: narrator
          text: Up jumped Yellow-Dog Dingo. Always hungry, and grinning like a coal-scuttle, he raced after Kangaroo. The proud Kangaroo fled on his four little legs, running like a bunny.
        - id: ch02-b05
          speaker: narrator
          text: And that, O Beloved of mine, ends the first part of the tale!
        - id: ch02-b06
          speaker: narrator
          text: Kangaroo ran across the desert and through the mountains. He crossed salt-pans, reed-beds, blue gums, and spinifex. He ran until his front legs ached.
        - id: ch02-b07
          speaker: narrator
          text: He had to!
        - id: ch02-b08
          speaker: narrator
          text: Yellow-Dog Dingo kept running behind him. He was always hungry and grinning like a rat-trap. He never came any closer, but he never fell any farther behind.
        - id: ch02-b09
          speaker: narrator
          text: He had to!
        - id: ch02-b10
          speaker: narrator
          text: Old Man Kangaroo ran on through the ti-trees and the mulga, through long grass and short grass, and through the Tropics of Capricorn and Cancer. He ran until his hind legs ached.
        - id: ch02-b11
          speaker: narrator
          text: He had to!
        - id: ch02-b12
          speaker: narrator
          text: Yellow-Dog Dingo ran on too, hungrier and hungrier, and grinning like a horse-collar. He still came no nearer and dropped no farther back. At last they reached the Wollgong River.
    - id: ch03
      title: Kangaroo Learns to Hop
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: There was no bridge over the river and no ferry-boat. Kangaroo did not know how to cross. So he stood up on his legs and hopped.
        - id: ch03-b02
          speaker: narrator
          text: He had to!
        - id: ch03-b03
          speaker: narrator
          text: He hopped through the Flinders and through the Cinders. He hopped across the deserts in the middle of Australia. Now he was hopping like a Kangaroo.
        - id: ch03-b04
          speaker: narrator
          text: First he hopped one yard. Then he hopped three yards. Then he hopped five. As he went, his legs grew stronger and longer. He had no time to rest or eat, though he badly wanted both.
        - id: ch03-b05
          speaker: narrator
          text: Yellow-Dog Dingo kept running. He was terribly hungry and completely bewildered. He wondered what in this world, or out of it, could make Old Man Kangaroo hop.
        - id: ch03-b06
          speaker: narrator
          text: Kangaroo bounced like a cricket, like a pea in a saucepan, or like a new rubber ball on a nursery floor.
        - id: ch03-b07
          speaker: narrator
          text: He had to!
        - id: ch03-b08
          speaker: narrator
          text: He tucked up his front legs and hopped on his hind ones. He stretched his tail behind him as a balance-weight, and away he went through the Darling Downs.
        - id: ch03-b09
          speaker: narrator
          text: He had to!
        - id: ch03-b10
          speaker: narrator
          text: Tired-Dog Dingo still ran behind him, growing hungrier with every step. He was more bewildered than ever. When in this world, or out of it, would Old Man Kangaroo stop?
    - id: ch04
      title: Five O'Clock
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Then Nqong came out from his bath in the salt-pans.
        - id: ch04-b02
          speaker: nqong
          text: It is five o'clock.
        - id: ch04-b03
          speaker: narrator
          text: Poor Dog Dingo sat down. He was still hungry and now looked dusky in the sunshine. He hung out his tongue and howled. Old Man Kangaroo sat down too, with his tail sticking out behind him like a milking-stool.
        - id: ch04-b04
          speaker: kangaroo
          text: Thank goodness. It is over!
        - id: ch04-b05
          speaker: narrator
          text: Nqong, who is always a gentleman, answered him.
        - id: ch04-b06
          speaker: nqong
          text: Why aren't you grateful to Yellow-Dog Dingo? Why don't you thank him for everything he has done for you?
        - id: ch04-b07
          speaker: kangaroo
          text: He chased me away from the places where I grew up. He drove me right past all my usual mealtimes. He changed my shape for good, and he has played Old Scratch with my legs.
        - id: ch04-b08
          speaker: nqong
          text: Perhaps I remember wrongly. Didn't you ask to be different from every other animal? And didn't you want to be truly sought after? Well, now it is five o'clock.
        - id: ch04-b09
          speaker: kangaroo
          text: Yes, I did, and now I wish I hadn't. I thought you would use charms and incantations. This is a practical joke.
        - id: ch04-b10
          speaker: narrator
          text: Nqong spoke from his bath among the blue gums.
        - id: ch04-b11
          speaker: nqong
          text: A joke? Say that once more, and I will whistle for Dingo and have him run your hind legs off.
          emotion: angry
        - id: ch04-b12
          speaker: kangaroo
          text: No. I must apologize. Legs are legs, and you need not change mine any further. I only wished to explain to Your Lordliness that I have eaten nothing since morning. I am extremely empty.
        - id: ch04-b13
          speaker: dingo
          text: I am in exactly the same situation. I made him different from every other animal, but what do I get for my tea?
        - id: ch04-b14
          speaker: nqong
          text: Come back and ask me tomorrow. I am going to wash now.
        - id: ch04-b15
          speaker: narrator
          text: So Old Man Kangaroo and Yellow-Dog Dingo were left together in the middle of Australia.
        - id: ch04-b16
          speakers: [kangaroo, dingo]
          ensemble: duo
          text: This is your fault.
    - id: ch05
      title: The Mouth-Filling Song
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            This is the mouth-filling song
            Of the race run by a Boomer,
            A race in one single burst, the only one of its kind.
            Big God Nqong began it at Warrigaborrigarooma,
            Old Man Kangaroo in front, with Yellow-Dog Dingo behind.
        - id: ch05-b02
          speaker: narrator
          text: |-
            Kangaroo bounded away,
            His back legs pumping like pistons.
            He bounded from morning till dark,
            Twenty-five feet at a bound.
            Yellow-Dog Dingo followed
            Like a yellow cloud in the distance.
            He was far too busy to bark.
            My, how they covered the ground!
        - id: ch05-b03
          speaker: narrator
          text: |-
            Nobody knows where they went,
            Or followed the path they flew over,
            For that whole Continent
            Had not yet been given a name.
            They ran across thirty degrees,
            From Torres Straits to the Leeuwin.
            You can look at the Atlas, please.
            Then they ran all the way back again.
        - id: ch05-b04
          speaker: narrator
          text: |-
            Suppose you could trot
            From Adelaide to the Pacific,
            In one afternoon's run,
            Half as far as those gentlemen did.
            You would certainly feel rather hot,
            But your legs would grow terrific.
            Yes, my importunate son,
            You would be a Marvellous Kid!
