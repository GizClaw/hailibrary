audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖俏皮，语气笃定
        timbre: 清亮圆润
        pace: 从容，遇到韵律段落时轻快
        pitch: 中
    kangaroo:
      display_name: 老袋鼠
      tts:
        delivery: 傲慢自负，奔跑后疲惫抱怨
        timbre: 结实明亮
        pace: 中等，疲惫时放慢
        pitch: 中
    nqa:
      display_name: 小神奈夸
      tts:
        delivery: 不耐烦，直截了当
        timbre: 清脆利落
        pace: 快
        pitch: 中高
    nquing:
      display_name: 中神奈奎因
      tts:
        delivery: 不耐烦，回答干脆
        timbre: 稳实清晰
        pace: 快
        pitch: 中
    nqong:
      display_name: 大神奈孔
      tts:
        delivery: 一本正经，带着捉弄人的从容
        timbre: 浑厚洪亮
        pace: 舒缓
        pitch: 低
    dingo:
      display_name: 黄狗野狗
      tts:
        delivery: 饥饿急切，越到后来越疲惫困惑
        timbre: 粗粝干爽
        pace: 略快，疲惫时拖长
        pitch: 中低
  chapters:
    - id: ch01
      title: 傲慢的愿望
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            袋鼠并不是生来就像今天这样。早先，他长着四条短腿，一身灰毛，蓬蓬松松，傲气却大得没边。他站在澳大利亚中央的突岩上跳舞，随后去找小神奈夸。
        - id: ch01-b02
          speaker: kangaroo
          text: 请在今天下午五点以前，把我变得跟所有动物都不一样。
        - id: ch01-b03
          speaker: narrator
          text: 那是早饭前六点。奈夸听完这番话，立刻从沙滩上的座位一跃而起。
        - id: ch01-b04
          speaker: nqa
          text: 走开！
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: >-
            袋鼠还是一身灰毛，还是那么蓬松，心里的傲气也照旧大得没边。他换到澳大利亚中央的一处岩架上跳舞，等早饭后八点，又去找中神奈奎因。
        - id: ch01-b06
          speaker: kangaroo
          text: 请在下午五点以前，把我变得与众不同，还要让我出奇地受欢迎。
        - id: ch01-b07
          speaker: narrator
          text: 奈奎因从三齿稃草丛里的洞穴跳了起来。
        - id: ch01-b08
          speaker: nquing
          text: 走开！
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: >-
            袋鼠仍旧灰灰的、毛茸茸的，心里的傲气一点没少。他又到澳大利亚中央的一道沙洲上跳舞。午饭前十点，他终于找到了大神奈孔。
        - id: ch01-b10
          speaker: kangaroo
          text: 请在下午五点以前把我变得与众不同，让我受欢迎，还要让大家拼命追着我跑。
        - id: ch01-b11
          speaker: narrator
          text: 奈孔从盐碱滩的浴池里跳起来。
        - id: ch01-b12
          speaker: nqong
          text: 好，我成全你！
        - id: ch01-b13
          speaker: narrator
          text: >-
            奈孔叫来黄狗野狗。野狗总是饿着肚子，在阳光下落满尘土。奈孔把正在灰堆上跳舞的袋鼠指给他看。
        - id: ch01-b14
          speaker: nqong
          text: 野狗，醒醒！看见那位先生了吗？他想受欢迎，想让大家真心实意地追着他跑。你就成全他吧！
        - id: ch01-b15
          speaker: dingo
          text: 什么？就那只猫兔子？
          emotion: surprised
        - id: ch01-b16
          speaker: narrator
          text: >-
            黄狗野狗撒腿追了出去。他饿着肚子，咧开的嘴像只煤斗。傲慢的袋鼠也赶紧用四条小短腿逃跑，活像一只兔子。亲爱的宝贝，故事的第一部分到这里就讲完啦！
    - id: ch02
      title: 非跑不可
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            袋鼠跑过沙漠和群山，穿过盐碱滩、芦苇荡、蓝桉林和三齿稃草原，一直跑到两条前腿酸痛不堪。可他非跑不可！
        - id: ch02-b02
          speaker: narrator
          text: >-
            黄狗野狗也非追不可。他总是饿着肚子，咧开的嘴像捕鼠夹。他一路不停地跑，却既没有追近，也没有落远，就这样紧紧跟在袋鼠后面。
        - id: ch02-b03
          speaker: narrator
          text: >-
            老袋鼠接着跑。他跑过茶树丛、穆尔加金合欢林、长草地和短草地，又越过南回归线和北回归线，一直跑到两条后腿也酸痛起来。可他非跑不可！
        - id: ch02-b04
          speaker: narrator
          text: >-
            黄狗野狗越来越饿，嘴巴咧得像副马项圈。他还是不近不远地追着，一步也没有停，直到他们来到沃尔贡河。
        - id: ch02-b05
          speaker: narrator
          text: >-
            河上没有桥，也没有渡船。袋鼠不知道怎么过去，只得直起双腿，开始蹦。他非蹦不可！
        - id: ch02-b06
          speaker: narrator
          text: >-
            他蹦过弗林德斯，又蹦过辛德斯，接着蹦过澳大利亚中央的沙漠。他如今蹦得活脱脱就是一只袋鼠。
        - id: ch02-b07
          speaker: narrator
          text: >-
            起初一蹦只有一码，接着变成三码，后来足有五码。他的腿越来越长，也越来越有力。他一路蹦个不停，连片刻也不能耽搁。他没工夫歇脚，更没工夫喝一口、吃一点，偏偏这些他都想得要命。
        - id: ch02-b08
          speaker: narrator
          text: >-
            黄狗野狗仍旧一路跑着，饿得厉害，也糊涂得厉害。他怎么也想不通，这世界里面，或是世界外面，到底有什么东西逼得老袋鼠不停地蹦。
        - id: ch02-b09
          speaker: narrator
          text: >-
            袋鼠蹦起来像蟋蟀，像平底锅里跳动的豌豆，也像育儿室地板上的新橡皮球。因为他非蹦不可！
        - id: ch02-b10
          speaker: narrator
          text: >-
            他把前腿缩到胸口，用后腿跳，尾巴直直伸在身后当秤砣，帮自己保持平衡。他就这样蹦过达令草原。他非蹦不可！
        - id: ch02-b11
          speaker: narrator
          text: >-
            黄狗野狗也彻底累坏了。他越来越饿，越想越糊涂，却还得一路追下去。他只想知道，这世界里面，或是世界外面，老袋鼠究竟要到什么时候才会停下。
    - id: ch03
      title: 五点钟到了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这时，奈孔也从盐碱滩的浴池里赶来了。
        - id: ch03-b02
          speaker: nqong
          text: 五点钟到了。
        - id: ch03-b03
          speaker: narrator
          text: >-
            可怜的黄狗野狗一屁股坐下。他依然饿着肚子，阳光下灰扑扑的，只能伸出舌头放声哀号。老袋鼠也一屁股坐了下来，把尾巴直直撑在身后，活像一张挤奶凳。
        - id: ch03-b04
          speaker: kangaroo
          text: 谢天谢地，总算完了！
        - id: ch03-b05
          speaker: narrator
          text: 奈孔一向是位绅士。他看了看筋疲力尽的袋鼠。
        - id: ch03-b06
          speaker: nqong
          text: 黄狗野狗为你做了这么多，你为什么不感激他，也不向他道谢？
        - id: ch03-b07
          speaker: kangaroo
          text: >-
            他把我赶出了从小长大的家，害我错过平日的饭点，还改了我的模样，叫我再也变不回去。我的腿更让他折腾得活见鬼啦！
        - id: ch03-b08
          speaker: nqong
          text: >-
            也许是我记错了。可你不是求我把你变得跟所有动物都不一样，还让大家真心实意地追着你跑吗？现在正好五点钟。
        - id: ch03-b09
          speaker: kangaroo
          text: >-
            是啊，但愿我从没求过。我以为你会念念咒语、施施法术，没想到你竟给我开了这样一个实打实的玩笑。
        - id: ch03-b10
          speaker: nqong
          text: 玩笑？你再说一遍，我就吹声口哨把野狗叫回来，让他追到你的两条后腿都跑掉。
          emotion: angry
        - id: ch03-b11
          speaker: kangaroo
          text: >-
            不说了，我得赔个不是。腿就是腿，阁下不用再改了。我只是想说明，从早上起我一口东西都没吃，现在肚子实在空得很。
        - id: ch03-b12
          speaker: dingo
          text: >-
            我的处境也一样。我已经把他变得跟所有动物都不同了，可我的下午茶能吃点什么呢？
        - id: ch03-b13
          speaker: nqong
          text: 这件事明天再来问我吧，我现在要洗澡了。
        - id: ch03-b14
          speaker: narrator
          text: >-
            奈孔回去洗澡了。于是，老袋鼠和黄狗野狗双双留在澳大利亚中央。他们又饿又累，望着彼此，同时认定了一件事。
        - id: ch03-b15
          speakers: [kangaroo, dingo]
          ensemble: duo
          text: 这都怪你。
    - id: ch04
      title: 一场了不起的赛跑
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            下面这首歌，念起来满嘴都是热闹。它唱的是一位大汉参加的那场赛跑，一口气从头跑到底，天下只有这么一遭。发令的是来自瓦里加博里加鲁马的大神奈孔，老袋鼠跑在最前头，黄狗野狗在后面紧追不放。
        - id: ch04-b02
          speaker: narrator
          text: >-
            袋鼠一跳就蹿出去，两条后腿像活塞一样猛推。从早晨一直蹦到天黑，每一跳都有二十五英尺。黄狗野狗伏在远处追赶，像一团黄色的云。他忙得连一声也顾不上叫。我的天，他们可真能跑啊！
        - id: ch04-b03
          speaker: narrator
          text: >-
            谁也不知道他们去了哪里，也没人能沿着他们飞奔的足迹追寻，因为那时那片大陆还没有得到自己的名字。他们一口气纵贯三十度，从托雷斯海峡一直跑到露纹角。请你看看地图，再瞧瞧他们怎样沿着原路飞奔回来。
        - id: ch04-b04
          speaker: narrator
          text: >-
            假如你也能一路小跑，从阿德莱德直奔太平洋，只用一个下午就跑完这两位先生一半的路程，你一定会热得浑身发烫，两条腿却会练得惊人地强壮。是啊，我那缠着问个不停的孩子，你准会成为一位了不起的小英雄！
