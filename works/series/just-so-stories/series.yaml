cover_prompt: |-
  A wordless cover gathers the transforming animals of the Just So Stories in an imagined ancient landscape beside a tropical river and sea. A young elephant with an especially long newly stretched trunk sprays water, a tall camel bears a proud hump, a leopard shows fresh rosettes, and a great whale surfaces beyond the shore. Near the elephant stands a curious dark-haired child in a loose plain tunic, watching without fear as birds and reeds bend in the spray. The elephant testing his remarkable trunk is the focal action, with the other creatures arranged as distant echoes across the landscape. Use a broad low-angle composition with rhythmic land and water bands and ample quiet sky at the top. Keep the imagery original and child-friendly, avoiding caricature of any people and avoiding designs from later adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
