  chapters:
    - id: ch01
      title: The Crab That Played with the Sea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Before the High and Far-Off Times, Best Beloved, came the Time of the Very Beginnings. The Eldest Magician was getting everything ready. First he prepared the Earth, and then the Sea. When it was done, he called all the Animals out to play.
        - id: ch01-b02
          speakers: [animal_1, animal_2, animal_3]
          ensemble: chorus
          text: Eldest Magician, what shall we play?
        - id: ch01-b03
          speaker: eldest_magician
          text: I will show you.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He took All-the-Elephant-there-was between his hands and told him to play at being an Elephant, and the Elephant began to play. He told All-the-Beaver-there-was to play at being a Beaver, and the Beaver began too. All-the-Cow-there-was learned to play at being a Cow, and All-the-Turtle-there-was learned to play at being a Turtle. One after another, every beast and bird and fish received its own game and began to play it.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Toward evening, when everyone and everything was growing restless and tired, the Man arrived. And was his own little girl-daughter with him? Yes. His own best beloved little girl-daughter sat upon his shoulder.
        - id: ch01-b06
          speaker: man
          text: Eldest Magician, what is this game?
        - id: ch01-b07
          speaker: eldest_magician
          text: Son of Adam, this is the play of the Very Beginning. But you are much too wise to join it.
        - id: ch01-b08
          speaker: narrator
          text: The Man saluted him.
        - id: ch01-b09
          speaker: man
          text: Yes, I am too wise for it. Only be sure you make every Animal obey me.
        - id: ch01-b10
          speaker: narrator
          text: >-
            While they talked, Pau Amma the Crab came next in line. He scuttled away sideways and stepped into the Sea before the Eldest Magician could teach him.
        - id: ch01-b11
          speaker: pau_amma
          text: I will play my own game in the deep water. I will never obey this Son of Adam.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Only the little girl-daughter saw Pau Amma leave. She watched from the Man's shoulder but said nothing. The game continued until there was not one Animal left without its orders. Then the Eldest Magician wiped the fine dust from his hands and walked around the world to see how every Animal was playing.
        - id: ch01-b13
          speaker: narrator
          text: >-
            In the North, All-the-Elephant-there-was dug with his tusks and stamped his feet in the clean new earth prepared for him.
        - id: ch01-b14
          speaker: elephant
          text: Kun? Is this right?
        - id: ch01-b15
          speaker: eldest_magician
          text: Payah kun. That is quite right.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The Eldest Magician breathed on the rocks and heaps of earth the Elephant had thrown up. They became the great Himalayan Mountains. You can find them on the map.
        - id: ch01-b17
          speaker: narrator
          text: >-
            In the East, All-the-Cow-there-was fed in her new field. She curled her tongue around a whole forest, swallowed it, and sat down to chew her cud.
        - id: ch01-b18
          speaker: cow
          text: Kun? Is this right?
        - id: ch01-b19
          speaker: eldest_magician
          text: Payah kun. That is quite right.
        - id: ch01-b20
          speaker: narrator
          text: >-
            He breathed on the bare ground where she had eaten and on the place where she had sat. One became the great Indian Desert. The other became the Sahara. You can find those on the map too.
        - id: ch01-b21
          speaker: narrator
          text: >-
            In the West, All-the-Beaver-there-was built a dam across the mouths of the broad rivers prepared for him.
        - id: ch01-b22
          speaker: beaver
          text: Kun? Is this right?
        - id: ch01-b23
          speaker: eldest_magician
          text: Payah kun. That is quite right.
        - id: ch01-b24
          speaker: narrator
          text: >-
            He breathed on the fallen trees and quiet water, and they became the Everglades in Florida. You may look them up on the map.
        - id: ch01-b25
          speaker: narrator
          text: >-
            In the South, All-the-Turtle-there-was scratched at the new sand with his flippers. Sand and rocks whirled through the air and landed far out at sea.
        - id: ch01-b26
          speaker: turtle
          text: Kun? Is this right?
        - id: ch01-b27
          speaker: eldest_magician
          text: Payah kun. That is quite right.
        - id: ch01-b28
          speaker: narrator
          text: >-
            He breathed on the sand and rocks where they had fallen. They became the beautiful islands of Borneo, Celebes, Sumatra, Java, and the rest of the Malay Archipelago. And those, Best Beloved, are on the map as well.
        - id: ch01-b29
          speaker: narrator
          text: Later, the Eldest Magician met the Man beside the Perak River.
        - id: ch01-b30
          speaker: eldest_magician
          text: Son of Adam, do all the Animals obey you?
        - id: ch01-b31
          speaker: man
          text: Yes.
        - id: ch01-b32
          speaker: eldest_magician
          text: Does all the Earth obey you?
        - id: ch01-b33
          speaker: man
          text: Yes.
        - id: ch01-b34
          speaker: eldest_magician
          text: Does all the Sea obey you?
        - id: ch01-b35
          speaker: man
          text: >-
            No. Once by day and once by night, the Sea rushes up the Perak River. It drives the fresh water into the forest and floods my house. Then, once by day and once by night, it runs away again and drags all the water with it. Nothing remains but mud, and my canoe tips over. Is that the game you taught the Sea?
        - id: ch01-b36
          speaker: eldest_magician
          text: No. That is a new game, and a bad one.
        - id: ch01-b37
          speaker: man
          text: Look!
        - id: ch01-b38
          speaker: narrator
          text: >-
            Even as he spoke, the great Sea swept into the mouth of the Perak and forced the fresh river water backward. The river rose over its banks, spread through the dark forests for miles and miles, and flooded the Man's house.
        - id: ch01-b39
          speaker: eldest_magician
          text: This is wrong. Put your canoe in the water. We will discover who is playing with the Sea.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The Eldest Magician and the Man climbed into the canoe, and the little girl-daughter came with them. The Man carried his kris, a curving, wavy dagger whose blade looked like a flame. They pushed out onto the Perak River. Just then, the Sea began to run back and back. The water caught their canoe and sucked it out through the river mouth. They swept past Selangor, past Malacca, and past Singapore, and then went farther and farther out to the Island of Bingtang, as though an unseen string were pulling them.
        - id: ch01-b41
          speaker: narrator
          text: The Eldest Magician stood in the canoe and called across the water.
        - id: ch01-b42
          speaker: eldest_magician
          text: >-
            Beasts, birds, and fishes! At the Very Beginning, I held you in my hands and taught each of you your proper game. Which one of you is playing with the Sea?
        - id: ch01-b43
          speakers: [animal_1, animal_2, animal_3]
          ensemble: chorus
          text: >-
            Eldest Magician, we and our children's children still play exactly as you taught us. None of us plays with the Sea.
        - id: ch01-b44
          speaker: narrator
          text: >-
            A great full Moon rose over the water. In it sat a hunchbacked old Fisherman, spinning the fishing line with which he hoped one day to catch the world.
        - id: ch01-b45
          speaker: eldest_magician
          text: Fisherman of the Moon, is it you who plays with the Sea?
        - id: ch01-b46
          speaker: moon_fisherman
          text: No. I am spinning the line that will one day catch the world. I do not play with the Sea.
        - id: ch01-b47
          speaker: narrator
          text: The old Fisherman went on spinning.
        - id: ch01-b48
          speaker: narrator
          text: >-
            A Rat lived in the Moon too. As fast as the Fisherman made his line, the Rat bit through it.
        - id: ch01-b49
          speaker: eldest_magician
          text: Rat of the Moon, are you playing with the Sea?
        - id: ch01-b50
          speaker: moon_rat
          text: I am far too busy biting through this old Fisherman's line. I do not play with the Sea.
        - id: ch01-b51
          speaker: narrator
          text: The Rat went straight back to biting it.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Then the little girl-daughter raised her soft brown arms. Beautiful white shell bracelets circled them.
        - id: ch01-b53
          speaker: girl_daughter
          text: >-
            Eldest Magician, I remember the Very Beginning. I was leaning on my father's shoulder while you taught the beasts their games. One beast was naughty. He slipped away into the Sea before you could teach him his game.
        - id: ch01-b54
          speaker: eldest_magician
          text: Little children who watch in silence are very wise. Tell me what that beast looked like.
        - id: ch01-b55
          speaker: girl_daughter
          text: >-
            He was round and flat. His eyes stood on stalks, and he walked sideways like this. Strong armor covered his back.
        - id: ch01-b56
          speaker: eldest_magician
          text: Little children who tell the truth are very wise. Now I know where Pau Amma went. Give me the paddle!
        - id: ch01-b57
          speaker: narrator
          text: >-
            He took the paddle, though he never needed to dip it in the water. The current flowed steadily past every island and carried the canoe to Pusat Tasek, the Heart of the Sea. There, a vast hollow went down toward the heart of the world. Inside that hollow grew Pauh Janggi, the Wonderful Tree that bore the magic twin nuts.
        - id: ch01-b58
          speaker: narrator
          text: >-
            The Eldest Magician slid one arm through the deep, warm water, right up to his shoulder. Beneath the Wonderful Tree's roots, his hand touched the broad back of Pau Amma the Crab. Pau Amma settled down beneath that touch, and the whole Sea rose, just as water rises in a basin when you put your hand into it.
        - id: ch01-b59
          speaker: eldest_magician
          text: Ah! Now I know who has been playing with the Sea. Pau Amma, what are you doing down there?
        - id: ch01-b60
          speaker: pau_amma
          text: Once each day and once each night, I leave to find food. Once each day and once each night, I come home. Leave me alone.
        - id: ch01-b61
          speaker: eldest_magician
          text: >-
            Listen to me, Pau Amma. Each time you leave your cave, the waters of the Sea pour down into Pusat Tasek. The beaches of every island lie bare, the little fish die, and mud covers the legs of Raja Moyang Kaban, King of the Elephants. Each time you come home and settle into Pusat Tasek, the Sea rises across the world again. Half the little islands drown beneath it, the Man's house floods, and the mouth of Raja Abdullah, King of the Crocodiles, fills with salt water.
        - id: ch01-b62
          speaker: narrator
          text: Pau Amma laughed far below them.
        - id: ch01-b63
          speaker: pau_amma
          text: >-
            I never knew I mattered so much. From now on, I will go out seven times every day. Then the water will never be still!
        - id: ch01-b64
          speaker: eldest_magician
          text: >-
            I cannot make you play the game intended for you, Pau Amma. You escaped me at the Very Beginning. But if you are not afraid, come up here and talk with us.
        - id: ch01-b65
          speaker: pau_amma
          text: I am not afraid.
        - id: ch01-b66
          speaker: narrator
          text: >-
            Pau Amma rose through the water and into the moonlight. No one in the whole world was as large as he was, for Pau Amma was King Crab of all Crabs. He was no common Crab at all. One side of his enormous shell reached the beach at Sarawak, while the other touched the beach at Pahang. When he stood at his full height, he towered above the smoke rising from three volcanoes.
        - id: ch01-b67
          speaker: narrator
          text: >-
            As he pushed through the Wonderful Tree, he tore away one of its twin fruits. Those magic, double-kernelled nuts could make people young. The little girl-daughter saw the fruit bobbing beside the canoe. She pulled it in and used her tiny golden scissors to pick out its soft centers.
        - id: ch01-b68
          speaker: eldest_magician
          text: Now make some Magic, Pau Amma. Show us how important you truly are.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Pau Amma rolled his eyes and waved every one of his enormous legs, trying to show his power. But the only thing he could do was stir the Sea. Though he was King Crab of all Crabs, he was still nothing more than a Crab. The Eldest Magician laughed at him.
        - id: ch01-b70
          speaker: eldest_magician
          text: You are not quite so important after all, Pau Amma. Now watch what I can do.
        - id: ch01-b71
          speaker: narrator
          text: >-
            The Eldest Magician made Magic with his left hand, using only its little finger. And there, Best Beloved, Pau Amma's hard blue-green-black shell dropped away like the husk from a coconut. The great Crab was left as soft as the little crabs you sometimes find upon the beach.
        - id: ch01-b72
          speaker: eldest_magician
          text: >-
            You must be terribly important. Shall I ask this Man to cut you with his kris? Shall I call Raja Moyang Kaban to pierce you with his tusks? Or would you rather have Raja Abdullah bite you?
        - id: ch01-b73
          speaker: pau_amma
          text: I am ashamed! Give me my hard shell again and let me return to Pusat Tasek. I promise to leave for food only once each day and once each night.
        - id: ch01-b74
          speaker: eldest_magician
          text: >-
            No, Pau Amma. I will not return it. You would only grow larger, stronger, and prouder. Perhaps you would forget your promise and begin playing with the Sea again.
        - id: ch01-b75
          speaker: pau_amma
          text: >-
            Then what can I do? I am so large that Pusat Tasek is the only place where I can hide. If I go anywhere else while I am soft, the sharks and dogfish will eat me. Yet if I return to Pusat Tasek, I may be safe, but I can never stir outside to find food. I will starve and die there.
        - id: ch01-b76
          speaker: narrator
          text: Pau Amma waved all his legs and lamented.
        - id: ch01-b77
          speaker: eldest_magician
          text: >-
            Listen, Pau Amma. You escaped before I could teach you your proper game, so I cannot force you to play it now. But you may choose a gift. I can make every stone, every hole, and every clump of seaweed into a safe Pusat Tasek for you and your children, forever.
        - id: ch01-b78
          speaker: pau_amma
          text: >-
            That is a good gift, but I will not choose yet. The Man distracted you at the Very Beginning. If he had not, I would not have tired of waiting and run away. None of this would have happened. What will he give me?
        - id: ch01-b79
          speaker: man
          text: >-
            If you choose, I will make Magic so that both deep water and dry ground can be homes for you and your children. You will be able to hide on land as well as in the Sea.
        - id: ch01-b80
          speaker: pau_amma
          text: >-
            I still will not choose. That girl saw me escape at the Very Beginning. If she had spoken, the Eldest Magician would have called me back, and this would never have happened. What will she give me?
        - id: ch01-b81
          speaker: girl_daughter
          text: >-
            This nut tastes very good. If you choose, I will make Magic and give you these strong, sharp scissors. When you come onto land, you and your children can eat coconuts like this all day. If no stone or hole is near, your scissors can dig you a Pusat Tasek. And when the ground is too hard to dig, they will help you run up a tree.
        - id: ch01-b82
          speaker: pau_amma
          text: >-
            I still cannot choose. While I am soft, none of those gifts can help me. Return my shell, Eldest Magician, and then I will play your game.
        - id: ch01-b83
          speaker: eldest_magician
          text: >-
            I will give your shell back for eleven months of every year. In the twelfth month, it will become soft again. That will remind you and all your children of my Magic, and it will keep you humble. I can see that living underwater and on dry land might make you too bold. And if those scissors let you climb trees, crack nuts, and dig your own hiding places, you might grow far too greedy.
        - id: ch01-b84
          speaker: narrator
          text: Pau Amma considered the offer.
        - id: ch01-b85
          speaker: pau_amma
          text: I have chosen. I will take every gift.
        - id: ch01-b86
          speaker: narrator
          text: >-
            This time, the Eldest Magician made Magic with his right hand, using all five fingers. Pau Amma grew smaller and smaller and smaller. At last, only a little green crab swam beside the canoe.
        - id: ch01-b87
          speaker: pau_amma
          text: Give me the scissors!
        - id: ch01-b88
          speaker: narrator
          text: >-
            The girl-daughter lifted the tiny Crab on the palm of her little brown hand. She carefully set him in the bottom of the canoe and gave him her golden scissors. Pau Amma held one in each little arm. He waved them, opened and shut them, and snapped them together.
        - id: ch01-b89
          speaker: pau_amma
          text: >-
            I can eat nuts and crack shells. I can dig holes and climb trees. I can breathe on dry land, and beneath every stone I can find a safe Pusat Tasek. I never knew I was so important. Kun? Is this right?
        - id: ch01-b90
          speaker: eldest_magician
          text: Payah kun. That is quite right.
        - id: ch01-b91
          speaker: narrator
          text: >-
            The Eldest Magician laughed and blessed him. Little Pau Amma scuttled over the canoe's side and into the water. Now he was small enough to hide beneath the shadow of a dry leaf on land or a dead shell at the bottom of the Sea.
        - id: ch01-b92
          speaker: eldest_magician
          text: Was that well done?
        - id: ch01-b93
          speaker: man
          text: >-
            Yes. But we must go all the way back to Perak now, and that is a tiring distance to paddle. If we had waited for Pau Amma to leave Pusat Tasek and return, the water would have carried us home by itself.
        - id: ch01-b94
          speaker: eldest_magician
          text: >-
            You are lazy, and so your children will be lazy too. They will be the laziest people in the world. They shall be called the Malazy, the lazy people.
        - id: ch01-b95
          speaker: narrator
          text: The Eldest Magician pointed one finger toward the Moon.
        - id: ch01-b96
          speaker: eldest_magician
          text: Fisherman, this Man is too lazy to row home. Catch his canoe with your line and pull it back for him.
        - id: ch01-b97
          speaker: man
          text: >-
            No. If I must be lazy for the rest of my days, make the Sea work for me twice every day. Then I will never need to paddle.
        - id: ch01-b98
          speaker: narrator
          text: The Eldest Magician laughed.
        - id: ch01-b99
          speaker: eldest_magician
          text: Payah kun. That is right.
        - id: ch01-b100
          speaker: narrator
          text: >-
            The Rat of the Moon stopped biting the fishing line. The Fisherman lowered it from the Moon until its end touched the Sea. Then he pulled the whole deep Sea behind the canoe. Back they went past the Island of Bingtang, past Singapore, past Malacca, and past Selangor. At last the racing water whirled the canoe into the mouth of the Perak River again.
        - id: ch01-b101
          speaker: moon_fisherman
          text: Kun? Is this right?
        - id: ch01-b102
          speaker: eldest_magician
          text: >-
            Payah kun. From now on, pull the Sea twice each day and twice each night. That will save the Malazy fishermen from paddling. But do not pull too hard, or I shall work the same Magic on you that I worked on Pau Amma.
        - id: ch01-b103
          speaker: narrator
          text: Then they all went up the Perak River and went to bed, Best Beloved.
        - id: ch01-b104
          speaker: narrator
          text: Now listen and attend!
        - id: ch01-b105
          speaker: narrator
          text: >-
            From that day to this, the Moon has always pulled the Sea up and down, twice by day and twice by night. That endless pulling makes what we call the tides. Sometimes the Fisherman of the Sea tugs a little too strongly, and the water gives us spring tides. At other times he pulls a little too softly, and then we have what are called neap tides. Nearly always, though, the old Fisherman is careful with his line because he remembers the warning of the Eldest Magician.
        - id: ch01-b106
          speaker: narrator
          text: >-
            And what became of Pau Amma? Go down to the beach and look closely. You can see his babies making their own little Pusat Taseks beneath every stone and every clump of seaweed on the sand. You can watch them wave the little scissors they carry in their arms. In some parts of the world, they truly do leave the Sea, live upon dry land, race up palm trees, and eat coconuts, exactly as the little girl-daughter promised.
        - id: ch01-b107
          speaker: narrator
          text: >-
            But once every year, every one of the Pau Ammas must shake off its hard armor and become soft again. That is how they remember what the Eldest Magician could do to their proud old ancestor. So it is not fair to hunt or kill Pau Amma's babies merely because old Pau Amma himself was stupidly rude so very long ago.
        - id: ch01-b108
          speaker: narrator
          text: >-
            Oh yes, there is one more thing. Pau Amma's babies hate it when you take them from their little Pusat Taseks and carry them home in pickle bottles. That is why they pinch you with their scissors, and it serves you right!
        - id: ch01-b109
          speaker: narrator
          text: >-
            China-going P's and O's pass close by Pau Amma's playground, and his Pusat Tasek lies near the track of most B.I.'s. U.Y.K. and N.D.L. know his home as well as the Fisherman of the Sea knows Bens, M.M.'s, and Rubattinos.
        - id: ch01-b110
          speaker: narrator
          text: >-
            But here is something rather queer. A.T.L.'s cannot come that way. O. and O. and D.O.A. must travel by another route. Orient, Anchor, Bibby, and Hall never go that way at all. U.C.S. would have a fit if it found itself there.
        - id: ch01-b111
          speaker: narrator
          text: >-
            If Beavers carried their cargo to Penang instead of Lagos, or a fat Shaw-Savill bore passengers to Singapore, or a White Star tried a little journey to Sourabaya, or a B.S.A. sailed past Natal to Cheribon, then great Mr. Lloyds would send a wire and drag them home.
        - id: ch01-b112
          speaker: narrator
          text: You will understand my riddle after you have eaten mangosteens.
        - id: ch01-b113
          speaker: narrator
          text: >-
            But perhaps you cannot wait until you have eaten mangosteens. In that case, ask someone to give you the outside page of the Times. Turn it over to page two and look for Shipping at the upper left. Then take out the Atlas, which is the finest picture book in all the world. Find the names of the places where those steamers go, and see how each one fits the names printed on the map. Any steamer-kiddy ought to manage that. If you cannot read yet, ask someone to show you how.
