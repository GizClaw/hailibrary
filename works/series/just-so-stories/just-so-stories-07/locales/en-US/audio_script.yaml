audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, playful, and assured
        timbre: clear and rounded
        pace: measured with lively rhythmic turns
        pitch: medium
    stickly_prickly:
      display_name: Stickly-Prickly
      tts:
        delivery: quick-witted, playful, and daring
        timbre: small and bright
        pace: lively
        pitch: medium-high
    slow_solid:
      display_name: Slow-and-Solid
      tts:
        delivery: steady, clever, and dryly amused
        timbre: smooth and grounded
        pace: unhurried
        pitch: medium-low
    painted_jaguar:
      display_name: Painted Jaguar
      tts:
        delivery: proud, impulsive, and easily bewildered
        timbre: rich and feline
        pace: moderately quick
        pitch: medium-low
    mother_jaguar:
      display_name: Mother Jaguar
      tts:
        delivery: gracious, knowing, and firmly instructive
        timbre: deep and polished
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: A Very Mixy Supper
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: This, O Best Beloved, is another story from the High and Far-Off Times. In the very middle of those times, Stickly-Prickly Hedgehog lived beside the turbid Amazon, where he ate shelly snails and such things. His friend Slow-and-Solid Tortoise lived there too, eating green lettuces and such things. So that was all right. Do you see?
        - id: ch01-b02
          speaker: narrator
          text: At that very same time, a Painted Jaguar lived on those same riverbanks. He ate anything he could catch. When he could not catch deer or monkeys, he ate frogs and beetles instead. When he could not catch frogs or beetles either, he went to Mother Jaguar. She knew how hedgehogs and tortoises should be eaten, and she taught him what to do.
        - id: ch01-b03
          speaker: mother_jaguar
          text: My son, if you find a Hedgehog, drop him into the water. Then he will uncoil. If you catch a Tortoise, scoop him out of his shell with your paw.
        - id: ch01-b04
          speaker: narrator
          text: She told him this many times, graciously waving her tail. So that was all right too, Best Beloved.
        - id: ch01-b05
          speaker: narrator
          text: One beautiful night beside the turbid Amazon, Painted Jaguar found Stickly-Prickly and Slow-and-Solid sitting beneath the trunk of a fallen tree. The trunk blocked their escape, so neither one could run away. Stickly-Prickly curled himself tightly into a ball, because that is what a Hedgehog can do. Slow-and-Solid drew his head and all four feet as far inside his shell as they would go, because that is what a Tortoise can do. So that was all right, Best Beloved. Do you see?
        - id: ch01-b06
          speaker: painted_jaguar
          text: Listen carefully, because this matters. Mother says I must drop a Hedgehog into the water so he uncoils, and scoop a Tortoise from his shell with my paw. But which one of you is which? Save my spots, I can't tell!
        - id: ch01-b07
          speaker: stickly_prickly
          text: Are you quite sure that is what your Mummy said? Perhaps you must uncoil a Tortoise, shell him out of the water with a scoop, and drop a pawed Hedgehog onto his shell.
        - id: ch01-b08
          speaker: slow_solid
          text: Are you perfectly sure? Perhaps you should water a Hedgehog by dropping him into your paw, then shell a Tortoise until he uncoils.
        - id: ch01-b09
          speaker: painted_jaguar
          text: That doesn't sound right at all. Still, please tell me again, and make it clearer this time.
        - id: ch01-b10
          speaker: narrator
          text: Painted Jaguar was already feeling a little puzzled.
        - id: ch01-b11
          speaker: stickly_prickly
          text: When your paw scoops water, you uncoil it with a Hedgehog. Be sure to remember. It is important.
        - id: ch01-b12
          speaker: slow_solid
          text: No, no. When you paw your meat, you drop it into a Tortoise with a scoop. What is so hard about that?
        - id: ch01-b13
          speaker: painted_jaguar
          text: You are making my spots ache! I never asked for advice. I only want to know which one is Hedgehog and which one is Tortoise.
        - id: ch01-b14
          speaker: stickly_prickly
          text: I won't tell you. But you may scoop me out of my shell if you like.
        - id: ch01-b15
          speaker: painted_jaguar
          text: Aha! Then you are Tortoise. You thought I wouldn't discover it, but I did. Now I'll scoop you out!
        - id: ch01-b16
          speaker: narrator
          text: Painted Jaguar shot out his paddy-paw at Stickly-Prickly. At that very moment, the Hedgehog curled himself up as tightly as he could. Of course, Jaguar's whole paddy-paw came away full of prickles. Worse still for Jaguar, the swipe knocked Stickly-Prickly away and away into the woods and bushes. It was much too dark there for Painted Jaguar to find him again.
        - id: ch01-b17
          speaker: narrator
          text: Jaguar put the sore paw into his mouth, which made the prickles hurt worse than ever. At last, he could speak. Then he scratched his head with the paw that had no prickles in it.
        - id: ch01-b18
          speaker: painted_jaguar
          text: Now I know that one wasn't Tortoise. But how can I be sure this other one is?
        - id: ch01-b19
          speaker: slow_solid
          text: I truly am Tortoise. Your mother was right. She said to scoop me from my shell with your paw. Go ahead.
        - id: ch01-b20
          speaker: painted_jaguar
          text: A moment ago, you said she told me something completely different.
        - id: ch01-b21
          speaker: narrator
          text: Painted Jaguar spoke while sucking prickles from his paddy-paw.
        - id: ch01-b22
          speaker: slow_solid
          text: Suppose you say I said that she said something different. If she said what you said I said she said, that is just the same as my saying what she said she said. If you think she told you to uncoil me with a scoop instead of pawing me into drops with a shell, I can't help that, can I?
        - id: ch01-b23
          speaker: painted_jaguar
          text: But you asked me to scoop you out with my paw.
        - id: ch01-b24
          speaker: slow_solid
          text: Think again. I never said that. I said your mother told you to scoop me out of my shell.
        - id: ch01-b25
          speaker: painted_jaguar
          text: And what happens if I do?
        - id: ch01-b26
          speaker: narrator
          text: Jaguar sounded very sniffy, and very cautious.
        - id: ch01-b27
          speaker: slow_solid
          text: I don't know. No one has scooped me out before. But I tell you truly, if you want to watch me swim away, you only need to drop me in the water.
        - id: ch01-b28
          speaker: painted_jaguar
          text: I don't believe you. First you mixed up everything Mother told me to do with all the things you asked whether I was sure she had not said. You kept at it until I no longer knew whether I was standing on my head or my painted tail! Now you suddenly tell me something I can understand, and that makes me even more mixed up than before. Mother said I must drop one of you two into the water. You are so eager to be dropped that I think you cannot truly want it. So jump into the turbid Amazon, and be quick about it!
        - id: ch01-b29
          speaker: slow_solid
          text: Your Mummy won't be pleased. Remember that I warned you.
        - id: ch01-b30
          speaker: painted_jaguar
          text: If you say one more word about what my mother said—
        - id: ch01-b31
          speaker: narrator
          text: Before Jaguar could finish, Slow-and-Solid quietly dived into the turbid Amazon. He swam a long way underwater, then climbed onto the bank where Stickly-Prickly was waiting.
        - id: ch01-b32
          speaker: stickly_prickly
          text: That was very close. I don't envy Painted Jaguar. What did you tell him you were?
        - id: ch01-b33
          speaker: slow_solid
          text: I honestly told him I was an honest Tortoise. He refused to believe me, so he made me jump into the river to prove it. I did, and now he is surprised. He has gone to tell his Mummy. Listen!
    - id: ch02
      title: Mother Jaguar's Directions
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Painted Jaguar roared up and down through the trees and bushes beside the turbid Amazon until Mother Jaguar came to him.
        - id: ch02-b02
          speaker: mother_jaguar
          text: Son, son! What have you been doing that you ought not to have done?
        - id: ch02-b03
          speaker: narrator
          text: She asked him many times, graciously waving her tail.
        - id: ch02-b04
          speaker: painted_jaguar
          text: I tried to scoop out a creature that said it wanted scooping from its shell, and now my paw is full of per-ickles!
        - id: ch02-b05
          speaker: mother_jaguar
          text: Son, son! Those prickles in your paddy-paw prove that it was a Hedgehog. You should have dropped him in the water.
        - id: ch02-b06
          speaker: painted_jaguar
          text: I did drop the other creature into the water. He told me he was a Tortoise, and I would not believe him, but he was telling the truth. He dived beneath the turbid Amazon, and he has not come up again. Now I have nothing at all to eat. I think we had better find somewhere else to live, because everyone beside the turbid Amazon is far too clever for poor me!
        - id: ch02-b07
          speaker: mother_jaguar
          text: Son, son! Listen now, and remember. A Hedgehog rolls into a ball, with prickles pointing in every direction at once. That is how you know a Hedgehog.
        - id: ch02-b08
          speaker: narrator
          text: Once again, Mother Jaguar spoke many times while she graciously waved her tail.
        - id: ch02-b09
          speaker: stickly_prickly
          text: I don't like that old lady one little bit. What else does she know?
        - id: ch02-b10
          speaker: narrator
          text: Stickly-Prickly was hiding beneath the shadow of a broad leaf.
        - id: ch02-b11
          speaker: mother_jaguar
          text: A Tortoise cannot roll himself into a ball. He only pulls his head and legs inside his shell. That is how you know a Tortoise.
        - id: ch02-b12
          speaker: slow_solid
          text: I don't like that old lady at all. Not at all! Even Painted Jaguar can remember instructions as plain as those. What a pity you cannot swim, Stickly-Prickly.
        - id: ch02-b13
          speaker: stickly_prickly
          text: Don't talk to me. Just think how much better things would be if you could curl up. What a mess! Listen to Painted Jaguar.
        - id: ch02-b14
          speaker: narrator
          text: Painted Jaguar sat beside the turbid Amazon, pulling prickles from his paws and repeating a rhyme to himself.
        - id: ch02-b15
          speaker: painted_jaguar
          text: |-
            Can't curl, but can swim—
            Slow-and-Solid, that's him!
            Curls up, but can't swim—
            Stickly-Prickly, that's him!
        - id: ch02-b16
          speaker: stickly_prickly
          text: He won't forget that for a month of Sundays. Hold up my chin, Slow-and-Solid. I am going to learn to swim. It may come in useful.
    - id: ch03
      title: Lessons Through the Night
      blocks:
        - id: ch03-b01
          speaker: slow_solid
          text: Excellent!
        - id: ch03-b02
          speaker: narrator
          text: Slow-and-Solid held Stickly-Prickly's chin above the water while the Hedgehog kicked in the turbid Amazon.
        - id: ch03-b03
          speaker: slow_solid
          text: You will be a fine swimmer yet. Now loosen my back-plates a little, and I will see whether I can learn to curl. That may come in useful too.
        - id: ch03-b04
          speaker: narrator
          text: Stickly-Prickly helped to unlace the Tortoise's back-plates, making them a little looser than before. Then Slow-and-Solid twisted his body and strained with all his might. In the end, he truly managed to curl himself up, though only by the tiniest little bit.
        - id: ch03-b05
          speaker: stickly_prickly
          text: Excellent! But stop there for now. Your face is turning black. Please lead me back into the water, and I will practise that easy side-stroke you told me about.
        - id: ch03-b06
          speaker: narrator
          text: Stickly-Prickly practised the side-stroke while Slow-and-Solid swam beside him.
        - id: ch03-b07
          speaker: slow_solid
          text: Excellent! With a little more practice, you will swim like a whale. Now, would you loosen my back and front plates by two more holes? I want to try that wonderful bend you say is so easy. Painted Jaguar will be surprised!
        - id: ch03-b08
          speaker: stickly_prickly
          text: Excellent! I am wet through, but I declare you could belong to my own family now. Two holes, did you say? Put a little more feeling into it, and try not to grunt so loudly. Painted Jaguar may hear. When you finish, I want to practise that easy long dive. Won't he be surprised!
        - id: ch03-b09
          speaker: narrator
          text: Stickly-Prickly dived, with Slow-and-Solid diving beside him.
        - id: ch03-b10
          speaker: slow_solid
          text: Excellent! Pay a little more attention to holding your breath, and soon you could live at the bottom of the turbid Amazon. Now I will try putting my hind legs around my ears. You say that is particularly comfortable. Won't Painted Jaguar be surprised!
        - id: ch03-b11
          speaker: stickly_prickly
          text: Excellent! But your back-plates are straining a little. They overlap now instead of lying next to one another.
        - id: ch03-b12
          speaker: slow_solid
          text: Oh, exercise does that. And I notice your prickles are melting into each other. You look more like a pine cone now, and less like a chestnut burr.
        - id: ch03-b13
          speaker: stickly_prickly
          text: Do I? That must come from soaking in the water. Oh, Painted Jaguar will be surprised!
        - id: ch03-b14
          speaker: narrator
          text: All through the rest of the night, they went on with their exercises. Stickly-Prickly helped Slow-and-Solid bend and curl, and Slow-and-Solid helped Stickly-Prickly swim and dive. Morning came, but still they kept at it. At last, when the sun stood high, they stopped to rest and let themselves dry. Only then did they see that both of them looked quite different from the way they had looked the day before.
        - id: ch03-b15
          speaker: slow_solid
          text: Stickly-Prickly, I am not what I was yesterday. Still, I think I can give Painted Jaguar some amusement.
        - id: ch03-b16
          speaker: narrator
          text: Slow-and-Solid said this after breakfast.
        - id: ch03-b17
          speaker: stickly_prickly
          text: I was thinking exactly the same thing. Scales are a great improvement on prickles, and now I can swim as well. Won't Painted Jaguar be surprised! Let us find him.
    - id: ch04
      title: Two New Animals
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Before long, the two friends found Painted Jaguar beside the turbid Amazon. He was still nursing the paddy-paw that Stickly-Prickly had filled with prickles the night before. The two creatures in front of him looked nothing like the Hedgehog and Tortoise he remembered. He was so astonished that he fell backward over his own painted tail three times without stopping once.
        - id: ch04-b02
          speaker: stickly_prickly
          text: Good morning! And how is your dear, gracious Mummy today?
        - id: ch04-b03
          speaker: painted_jaguar
          text: She is very well, thank you. But please forgive me. Just now, I cannot seem to remember your name.
        - id: ch04-b04
          speaker: stickly_prickly
          text: That is rather unkind. Only yesterday, you tried to scoop me out of my shell with your paw.
        - id: ch04-b05
          speaker: painted_jaguar
          text: You had no shell! You were covered in prickles. I know you were. Look at my paw!
        - id: ch04-b06
          speaker: slow_solid
          text: And you ordered me into the turbid Amazon to drown. Why are you being so rude and forgetful today?
        - id: ch04-b07
          speaker: stickly_prickly
          text: |-
            Don't you remember what your mother said?
            Can't curl, but can swim—
            Stickly-Prickly, that's him!
            Curls up, but can't swim—
            Slow-and-Solid, that's him!
        - id: ch04-b08
          speaker: narrator
          text: Then both animals curled themselves up. They rolled round and round Painted Jaguar until his eyes truly turned cartwheels inside his head. He hurried away to fetch his mother.
        - id: ch04-b09
          speaker: painted_jaguar
          text: Mother, there are two new kinds of animal in the woods today! The one you told me could not swim is swimming, and the one you told me could not curl up is curling. I think they have shared all their prickles between them. Both creatures are covered in scales now, instead of one being smooth and the other being terribly prickly. Besides all that, they keep rolling round and round me in circles, and I do not feel comfortable at all.
        - id: ch04-b10
          speaker: mother_jaguar
          text: Son, son! A Hedgehog is a Hedgehog. It cannot be anything else. A Tortoise is a Tortoise. It can never become something different.
        - id: ch04-b11
          speaker: narrator
          text: Mother Jaguar said it many times, graciously waving her tail.
        - id: ch04-b12
          speaker: painted_jaguar
          text: But this is neither Hedgehog nor Tortoise. It is a little of each, and I do not know what it is called.
        - id: ch04-b13
          speaker: mother_jaguar
          text: Nonsense! Everything has a proper name. Until I learned the real one, I would call such a creature an Armadillo. And I would leave it alone.
        - id: ch04-b14
          speaker: narrator
          text: Painted Jaguar obeyed her, especially the part about leaving them alone.
    - id: ch05
      title: The Beginning of the Armadillos
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Here is the curious thing, O Best Beloved. From that day to this, no one beside the turbid Amazon has called Stickly-Prickly or Slow-and-Solid anything except Armadillo.
        - id: ch05-b02
          speaker: narrator
          text: There are still Hedgehogs and Tortoises in other places, of course. There are even some in my own garden. But the real old and clever kind came from the High and Far-Off Days. Their scales lay lippety-lappety, one over another, just like the scales of a pine cone. Those were the creatures that lived beside the turbid Amazon. They were so clever that, from that day onward, everyone has always called them Armadillos.
        - id: ch05-b03
          speaker: narrator
          text: So that is all right, Best Beloved. Do you see?
    - id: ch06
      title: Roll Down to Rio
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            I've never sailed the Amazon,
            I've never reached Brazil;
            But the Don and Magdalena,
            They can go there when they will!

            Yes, weekly from Southampton,
            Great steamers, white and gold,
            Go rolling down to Rio
            (Roll down—roll down to Rio!)
            And I'd like to roll to Rio
            Some day before I'm old!
        - id: ch06-b02
          speaker: narrator
          text: |-
            I've never seen a Jaguar,
            Nor yet an Armadill—
            O dilloing in his armour,
            And I suppose I never will,

            Unless I go to Rio
            These wonders to behold—
            Roll down—roll down to Rio—
            Roll really down to Rio!
            Oh, I'd love to roll to Rio
            Some day before I'm old!
