audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖俏皮，语气笃定
        timbre: 清亮圆润
        pace: 从容，遇到韵律段落时轻快
        pitch: 中
    stickly_prickly:
      display_name: 尖刺猬
      tts:
        delivery: 机灵顽皮，胆大又爱打趣
        timbre: 小巧明亮
        pace: 轻快
        pitch: 中高
    slow_solid:
      display_name: 慢吞吞龟
      tts:
        delivery: 稳当聪明，带着不动声色的幽默
        timbre: 温厚平滑
        pace: 从容
        pitch: 中低
    painted_jaguar:
      display_name: 花斑美洲豹
      tts:
        delivery: 骄傲冲动，很容易糊涂
        timbre: 浓厚有力
        pace: 稍快
        pitch: 中低
    mother_jaguar:
      display_name: 美洲豹妈妈
      tts:
        delivery: 优雅老练，教训人时坚定从容
        timbre: 深沉圆润
        pace: 舒缓
        pitch: 低
  chapters:
    - id: ch01
      title: 一顿糊里糊涂的晚餐
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            亲爱的宝贝，这也是一个发生在太古洪荒时代的故事。就在那个遥远时代的正中央，尖刺猬住在浑浊的亚马孙河边，吃带壳的蜗牛一类东西。他有个朋友，名叫慢吞吞龟，也住在浑浊的亚马孙河边，吃青莴苣一类东西。所以一切都好好的，亲爱的宝贝。明白吗？
        - id: ch01-b02
          speaker: narrator
          text: >-
            同一个太古洪荒时代，也就在同一条浑浊的亚马孙河岸边，还住着花斑美洲豹。他逮住什么就吃什么。逮不到鹿和猴子，就改吃青蛙和甲虫。连青蛙和甲虫也抓不到，他便去找美洲豹妈妈，请妈妈仔细教他，该怎样捉住刺猬和乌龟，又该怎样把他们吃掉。
        - id: ch01-b03
          speaker: mother_jaguar
          text: >-
            儿子，你听好。碰到刺猬，就把他扔进水里，他自然会把蜷着的身子松开。逮住乌龟，就把爪子伸过去，把他从那副硬壳里掏出来。
        - id: ch01-b04
          speaker: narrator
          text: 美洲豹妈妈优雅地摆着尾巴，把这些话讲了一遍又一遍。
        - id: ch01-b05
          speaker: narrator
          text: >-
            一个美丽的夜晚，在浑浊的亚马孙河边，花斑美洲豹发现尖刺猬和慢吞吞龟坐在一棵倒下的树干底下。树干挡住去路，他们谁也没法逃。尖刺猬立刻蜷成一团，因为刺猬原本就会这样。慢吞吞龟则把脑袋和四只脚尽量缩进壳里，因为乌龟原本就会这样。亲爱的宝贝，这当然都没有错。明白吗？
        - id: ch01-b06
          speaker: painted_jaguar
          text: >-
            现在都仔细听我说，这件事非常要紧。妈妈告诉我，遇见刺猬，就要把他扔进水里，让他松开身子。遇见乌龟，就要用爪子把他从壳里掏出来。可是，你们两个到底谁是刺猬，谁是乌龟？拿我的斑点起誓，我实在分不出来。
        - id: ch01-b07
          speaker: stickly_prickly
          text: >-
            你真肯定妈妈说的是这些？也许她说，松开乌龟时，要拿勺子把他从水里剥出来。抓住刺猬时，要把他扔到壳上。
        - id: ch01-b08
          speaker: slow_solid
          text: >-
            你真的肯定吗？也许她说，把刺猬弄进水里时，要把他扔进爪子。碰上乌龟，就剥他的壳，直到他松开。
        - id: ch01-b09
          speaker: painted_jaguar
          text: 这听着一点儿也不对。不过你们再说一遍吧，这回说清楚些。
        - id: ch01-b10
          speaker: narrator
          text: 花斑美洲豹已经有点儿糊涂了。
        - id: ch01-b11
          speaker: stickly_prickly
          text: 用爪子舀水时，拿刺猬把水松开。千万记住，这很要紧。
        - id: ch01-b12
          speaker: slow_solid
          text: 不对。用爪子抓肉时，拿勺子把肉扔进乌龟里。你怎么还听不懂？
        - id: ch01-b13
          speaker: painted_jaguar
          text: >-
            你们害得我的斑点都疼了！我又没请你们出主意。我只想知道，你们谁是刺猬，谁是乌龟。
        - id: ch01-b14
          speaker: stickly_prickly
          text: 我不告诉你。不过你愿意的话，可以用爪子把我从壳里掏出来。
        - id: ch01-b15
          speaker: painted_jaguar
          text: 哈！原来你是乌龟。你以为我猜不出来，可我偏猜出来了。我这就掏！
        - id: ch01-b16
          speaker: narrator
          text: >-
            花斑美洲豹猛伸出软垫大爪，正要把尖刺猬从他以为存在的硬壳里掏出来。尖刺猬恰在那一刻把身子蜷得紧紧的，于是美洲豹的整只软垫大爪都扎满了刺。更糟的是，这一扑还把尖刺猬打得飞呀飞，一直飞进树林和灌木深处。那里实在太黑，美洲豹再也找不着他。
        - id: ch01-b17
          speaker: narrator
          text: >-
            花斑美洲豹把受伤的软垫大爪塞进嘴里，尖刺反而扎得比刚才更疼。等他终于说得出话，便用那只没有扎刺的爪子挠着脑袋。
        - id: ch01-b18
          speaker: painted_jaguar
          text: 现在我知道，那个根本不是乌龟。可我怎么知道剩下这个就是呢？
        - id: ch01-b19
          speaker: slow_solid
          text: >-
            我就是乌龟。你妈妈说得很对，她叫你用爪子把我从壳里掏出来。动手吧。
        - id: ch01-b20
          speaker: painted_jaguar
          text: 一分钟前，你明明说她讲的是完全不同的东西。
        - id: ch01-b21
          speaker: narrator
          text: 他说这话时，还在一根根吮出爪子里的尖刺。
        - id: ch01-b22
          speaker: slow_solid
          text: >-
            就算你说，我说过她说的是别的东西，那又有什么不同？要是她说过你说我说她说的那番话，就等于我说了她说她说的那番话。反过来，要是你认定她叫你拿勺子把我松开，而不是用壳把我抓成水滴，我又有什么办法？
        - id: ch01-b23
          speaker: painted_jaguar
          text: 可你说过，你想让我用爪子把你从壳里掏出来。
        - id: ch01-b24
          speaker: slow_solid
          text: >-
            你再想想。我没说过那种话。我说的是，你妈妈叫你把我从壳里掏出来。
        - id: ch01-b25
          speaker: painted_jaguar
          text: 我要真这么做，会怎么样？
        - id: ch01-b26
          speaker: narrator
          text: 花斑美洲豹吸着鼻子，问得万分小心。
        - id: ch01-b27
          speaker: slow_solid
          text: >-
            我也不知道会怎么样，因为从来没人把我从壳里掏出来过。不过我可以老老实实告诉你，你要是想亲眼看着我游开，越游越远，只消把我扔进水里就行。
        - id: ch01-b28
          speaker: painted_jaguar
          text: >-
            我不信。你把妈妈吩咐我的事，跟你们问我“肯不肯定她没说过”的那些事全搅在一起。你们搅呀搅，害得我连自己是倒栽在脑袋上，还是站在花尾巴上都不知道。现在你忽然说起我听得懂的事，反倒叫我比刚才更糊涂了。妈妈明明说，我得把你们两个当中的一个扔进水里。你这么急着被扔，我看你一定不是真想下水。快跳进浑浊的亚马孙河，别再磨蹭！
        - id: ch01-b29
          speaker: slow_solid
          text: 我先警告你，妈妈会不高兴的。你可别说我没提醒过。
        - id: ch01-b30
          speaker: painted_jaguar
          text: 你要再提一句我妈妈说过什么——
        - id: ch01-b31
          speaker: narrator
          text: >-
            花斑美洲豹的话还没说完，慢吞吞龟已经悄悄潜进浑浊的亚马孙河。他在水下游了很长一段路，才从另一处河岸爬上来。尖刺猬正在那里等着他。
        - id: ch01-b32
          speaker: stickly_prickly
          text: 真险啊。我可不想跟花斑美洲豹换位置。你告诉他自己是什么了吗？
        - id: ch01-b33
          speaker: slow_solid
          text: >-
            我老老实实告诉他，我是一只老实的乌龟。他偏不相信，非叫我跳进河里，看看我究竟是不是。我跳了，我果然是只乌龟，他这才大吃一惊。现在他已经找妈妈告状去了。你听听他的声音！
    - id: ch02
      title: 美洲豹妈妈的诀窍
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            他们听见花斑美洲豹在浑浊的亚马孙河边，穿过一片片树林和灌木，来来回回地吼叫。那吼声一直没有停，直到美洲豹妈妈赶来。
        - id: ch02-b02
          speaker: mother_jaguar
          text: 儿子，儿子！你做了什么不该做的事？
        - id: ch02-b03
          speaker: narrator
          text: 她优雅地摆着尾巴，一遍又一遍地问。
        - id: ch02-b04
          speaker: painted_jaguar
          text: >-
            有个东西说，他想让我用爪子把他从壳里掏出来。我动手掏了，现在我的爪子里全是尖——尖——刺！
        - id: ch02-b05
          speaker: mother_jaguar
          text: >-
            儿子，儿子！只要看看你软垫大爪里扎着的那些尖刺，我就知道，那东西一定是刺猬。你本来应该把他扔进水里。
        - id: ch02-b06
          speaker: painted_jaguar
          text: >-
            我把另一个东西扔进水里了。他说自己是乌龟，我偏不相信，可他说的竟然全是真话。他潜进浑浊的亚马孙河，再也不肯露面了。现在我什么吃的也没有。我看我们还是搬到别处找住处吧。浑浊的亚马孙河边，这些家伙实在太聪明，可怜的我根本对付不了！
        - id: ch02-b07
          speaker: mother_jaguar
          text: >-
            儿子，儿子！现在仔细听，把我的话牢牢记住。刺猬会把整个身子蜷成一个球，身上的尖刺同时朝四面八方竖起来。只要看见这个样子，你就能认出刺猬。
        - id: ch02-b08
          speaker: narrator
          text: 她依旧优雅地摆着尾巴，把话讲了一遍又一遍。
        - id: ch02-b09
          speaker: stickly_prickly
          text: 我一点儿也不喜欢这个老太太。她还知道些什么呢？
        - id: ch02-b10
          speaker: narrator
          text: 尖刺猬藏在一片大叶子的阴影里。
        - id: ch02-b11
          speaker: mother_jaguar
          text: >-
            乌龟没法把自己蜷成一个球。他只能把脑袋和四条腿全都缩进硬壳里面。只要看见这个样子，你就能认出乌龟。
        - id: ch02-b12
          speaker: slow_solid
          text: >-
            我一点儿也不喜欢这个老太太，一点儿也不！连花斑美洲豹也忘不了这么明白的诀窍。尖刺猬，真可惜你不会游泳。
        - id: ch02-b13
          speaker: stickly_prickly
          text: >-
            别跟我说话。你要是能蜷起来，不知会好上多少。事情真糟！听听花斑美洲豹在念什么。
        - id: ch02-b14
          speaker: narrator
          text: 花斑美洲豹坐在河岸边，一面从爪子里吮出尖刺，一面念叨。
        - id: ch02-b15
          speaker: painted_jaguar
          text: >-
            不会蜷，会游泳——慢吞吞，就是他！会蜷起，不会游——尖刺猬，就是他！
        - id: ch02-b16
          speaker: stickly_prickly
          text: >-
            就算过上八百个星期天，他也绝不会忘记这几句话。慢吞吞，快托住我的下巴。我要下水试一试，学会怎么游泳，以后也许真能用得着。
        - id: ch02-b17
          speaker: slow_solid
          text: 好极了！
        - id: ch02-b18
          speaker: narrator
          text: 慢吞吞龟托住尖刺猬的下巴，尖刺猬就在浑浊的亚马孙河水里一下一下地蹬腿。
        - id: ch02-b19
          speaker: slow_solid
          text: >-
            只要这样练下去，你早晚会成为游泳好手。现在轮到你帮我了。你能不能把我背甲上的系带松开一点？我也想试一试，看看自己能不能把身子蜷起来。以后也许真能用得着。
        - id: ch02-b20
          speaker: narrator
          text: 尖刺猬动手替乌龟松开背甲上的系带。慢吞吞龟使劲扭，使劲挣，居然真把身子蜷起了一丁点儿。
        - id: ch02-b21
          speaker: stickly_prickly
          text: >-
            好极了！不过眼下先别再往下练，你用力太猛，整张脸都憋黑啦。劳驾再领我下水一次吧。现在我要练练你说很容易学会的那种侧泳。
        - id: ch02-b22
          speaker: narrator
          text: 于是尖刺猬又下了水，继续练习侧泳，慢吞吞龟始终在旁边陪着他游。
        - id: ch02-b23
          speaker: slow_solid
          text: >-
            好极了！再多练上一点儿，你简直就能变成一条真正的鲸。现在，劳驾把我的背甲和胸甲各多松开两个扣眼。我要试试你说很容易的那种迷人弯法。想想看，花斑美洲豹见了该多吃惊啊！
        - id: ch02-b24
          speaker: stickly_prickly
          text: >-
            好极了！我刚从浑浊的亚马孙河里出来，浑身还湿淋淋的。说真的，我简直要把你当成自家亲戚了。你说松两个扣眼，对吧？再做得有神气些，也别哼哼得那么响，不然花斑美洲豹会听见。等你练完，我要试试你说很容易的长距离潜水。花斑美洲豹见了该多吃惊啊！
        - id: ch02-b25
          speaker: narrator
          text: 尖刺猬说完便潜进水里，慢吞吞龟也在旁边陪着他，一起潜进浑浊的亚马孙河。
        - id: ch02-b26
          speaker: slow_solid
          text: >-
            好极了！憋气时再稍稍用心一点儿，你就能在浑浊的亚马孙河底安家过日子了。现在，我要试试你说格外舒服的那种练法，把两条后腿一直绕到耳朵旁边。花斑美洲豹见了该多吃惊啊！
        - id: ch02-b27
          speaker: stickly_prickly
          text: 好极了！不过这样会抻着你的甲片。它们都一片压着一片，不再并排挨着了。
        - id: ch02-b28
          speaker: slow_solid
          text: >-
            噢，那一定是锻炼带来的结果。我也留意到了，你身上的尖刺好像正在一根根融到一起。跟从前相比，你现在越来越像一只松果，越来越不像那种扎手的栗子刺壳了。
        - id: ch02-b29
          speaker: stickly_prickly
          text: 是吗？那是让水泡的。哎呀，花斑美洲豹见了该多吃惊啊！
    - id: ch03
      title: 两种新动物
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            他们就这样一个帮着另一个，一项接一项地练习，一直练到天亮。太阳高高升起以后，他们才终于停下来休息，让清晨的阳光把湿漉漉的身体慢慢晾干。这时他们仔细看了看彼此，才发现两个都跟从前大不一样了。
        - id: ch03-b02
          speaker: slow_solid
          text: 尖刺猬，我已经不是昨天的我了。不过，我想我还能逗一逗花斑美洲豹。
        - id: ch03-b03
          speaker: narrator
          text: 慢吞吞龟吃过早饭，看着自己的新模样，才说了这句话。
        - id: ch03-b04
          speaker: stickly_prickly
          text: >-
            我刚才想的也是这个。长鳞甲可比长尖刺强多了，更别说我还会游泳。花斑美洲豹见了该多吃惊啊！我们去找他。
        - id: ch03-b05
          speaker: narrator
          text: >-
            过了一阵，他们找到花斑美洲豹。他还在小心照看头天夜里受伤的软垫大爪。一看见他们的新模样，他吃惊得一次、两次、三次，接连向后栽倒在自己的花尾巴上，中间连半点儿也没停。
        - id: ch03-b06
          speaker: stickly_prickly
          text: 早安！你那亲爱又优雅的妈妈，今天早上身体好吗？
        - id: ch03-b07
          speaker: painted_jaguar
          text: 她很好，谢谢。不过请你原谅，我眼下实在想不起你的名字。
        - id: ch03-b08
          speaker: stickly_prickly
          text: >-
            这么说可真无情。昨天这个时候，你还想用爪子把我从壳里掏出来呢。
        - id: ch03-b09
          speaker: painted_jaguar
          text: 但你那时没有壳，只有满身尖刺。我记得清清楚楚。你瞧我的爪子！
        - id: ch03-b10
          speaker: slow_solid
          text: >-
            你还叫我跳进浑浊的亚马孙河淹死。今天怎么又没礼貌，又这么健忘？
        - id: ch03-b11
          speaker: stickly_prickly
          text: >-
            你不记得妈妈教你的话了吗？不会蜷，会游泳——尖刺猬，就是他！会蜷起，不会游——慢吞吞，就是他！
        - id: ch03-b12
          speaker: narrator
          text: >-
            话音一落，他们俩都把身体蜷成圆圆的一团，围着花斑美洲豹滚了一圈又一圈。花斑美洲豹盯着他们来来回回地转，两只眼睛真像车轮一样在脑袋里打转。最后，他转身跑去找妈妈。
        - id: ch03-b13
          speaker: painted_jaguar
          text: >-
            妈妈，今天树林里来了两种从没见过的新动物。你说不会游泳的那个，如今会游泳了。你说不会蜷起来的那个，如今也会蜷了。我想，他们一定还把尖刺分着用了。因为他们两个现在都披着满身鳞甲，不再是一个光溜溜、一个尖刺刺的了。再说，他们还绕着圈儿滚个不停，滚得我心里很不自在。
        - id: ch03-b14
          speaker: mother_jaguar
          text: >-
            儿子，儿子！刺猬就是刺猬，除了刺猬，他不可能成为别的东西。乌龟就是乌龟，除了乌龟，他也永远不可能成为别的东西。
        - id: ch03-b15
          speaker: narrator
          text: 美洲豹妈妈还是优雅地摆着尾巴，把话说了一遍又一遍。
        - id: ch03-b16
          speaker: painted_jaguar
          text: >-
            可那不是刺猬，也不是乌龟。他两样都沾一点儿，我不知道他正经叫什么。
        - id: ch03-b17
          speaker: mother_jaguar
          text: >-
            胡说！世上每一样东西都有自己的正经名字。在弄清这种动物真正的名字以前，我会先管他叫“犰狳”。然后，我会离他远远的，绝不去招惹他。
        - id: ch03-b18
          speaker: narrator
          text: >-
            花斑美洲豹完全照妈妈的话做了，尤其把离他们远远的这一条做得格外认真。可最奇怪的是，从那一天直到今天，浑浊的亚马孙河岸边再也没有人管尖刺猬和慢吞吞龟叫过别的名字。不管是谁看见他们，大家只叫他们犰狳。
        - id: ch03-b19
          speaker: narrator
          text: >-
            别的地方当然还有刺猬和乌龟，我的花园里就有几只。可是，那种真正古老又聪明的家伙，住在太古洪荒时代浑浊的亚马孙河岸边。他们披着满身鳞片，一片搭着一片，像松果的鳞片一样。因为他们实在太聪明，人们总把他们叫作犰狳。所以一切都好好的，亲爱的宝贝。明白吗？
    - id: ch04
      title: 滚向里约
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            我从未乘船航行在亚马孙河，也从未亲自到过巴西。可唐号和玛格达莱娜号两艘大船，只要它们愿意，随时都能航行到那里！
        - id: ch04-b02
          speaker: narrator
          text: >-
            是啊，每个星期都有金白相间的大轮船，从南安普敦的港口启航，一路摇摇滚滚，驶向遥远的里约。滚吧，滚吧，滚向里约！我真想也乘上一艘轮船，跟着它滚向里约，趁我还没有年老！
        - id: ch04-b03
          speaker: narrator
          text: >-
            我从未亲眼见过美洲豹，也没见过一只犰——狳穿着满身甲胄，在河岸边游来荡去。我想啊，我这一辈子大概永远也见不到。
        - id: ch04-b04
          speaker: narrator
          text: >-
            除非我亲自动身去里约，亲眼看看那些奇妙景象。滚吧，滚吧，一路滚向里约，真真正正滚向里约！啊，我是多么想滚向里约，趁我还没有变老！
