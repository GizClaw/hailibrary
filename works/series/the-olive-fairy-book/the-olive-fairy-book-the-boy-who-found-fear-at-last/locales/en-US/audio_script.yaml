  chapters:
    - id: ch01
      title: In Search of Fear
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a woman who dearly loved her only son. Their little cottage stood at the edge of a forest, far from any neighbors. It was a lonely place, so the mother kept the boy at home to keep her company.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One winter evening, as they sat together, a storm sprang up. The wind burst through the door and flung it open. The woman started, shivered, and looked over her shoulder as though something horrible might be standing behind her.
        - id: ch01-b03
          speaker: mother
          text: Shut the door quickly. I'm frightened.
          emotion: fearful
        - id: ch01-b04
          speaker: boy
          text: Frightened? What does being frightened feel like?
        - id: ch01-b05
          speaker: mother
          text: >-
            Well, you just feel afraid. Something takes hold of you, though you hardly know what you're afraid of.
        - id: ch01-b06
          speaker: boy
          text: >-
            That must be a very strange feeling. I'll travel through the world and look for fear until I find it.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The next morning, before his mother was out of bed, the boy had already left the forest behind him. He walked for hours until he reached a mountain and began to climb. Near the top, in a wild place covered with rocks, he found a band of fierce robbers sitting around a fire. The boy was cold and tired, and the bright flames delighted him. He wished the men a good greeting, squeezed himself in among them, and stretched his feet so close that they almost touched the burning logs.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The robbers stopped drinking and eyed the boy curiously. For a while, they only sat around the fire and watched him. At last, their captain broke the silence and spoke.
        - id: ch01-b09
          speaker: robber_captain
          text: >-
            Even an armed caravan wouldn't dare come here. The birds themselves keep away from our camp. Who are you, to walk in so boldly?
        - id: ch01-b10
          speaker: boy
          text: >-
            Oh, I've left my mother's house to look for fear. Perhaps you can show me where it is.
        - id: ch01-b11
          speaker: robber_captain
          text: Wherever we are, fear is there.
        - id: ch01-b12
          speaker: boy
          text: But where is it? I don't see anything.
        - id: ch01-b13
          speaker: robber_captain
          text: >-
            Take this pot, flour, butter, and sugar down to the churchyard. Bake us a cake there for supper.
        - id: ch01-b14
          speaker: narrator
          text: >-
            By then the boy was warm again. He sprang up cheerfully, hung the pot over his arm, and ran downhill. In the churchyard, he gathered sticks and made a fire. A little stream flowed close by, so he filled the pot with water there. Then he mixed the flour, butter, and sugar and set the cake to cook. It did not take long to turn crisp and brown. He lifted it from the pot, laid it on a stone, and began putting out the fire.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Just then, a hand reached out of a grave.
        - id: ch01-b16
          speaker: first_maiden
          text: Is that cake meant for me?
        - id: ch01-b17
          speaker: boy
          text: >-
            Do you think I'd give a living person's food to the dead?
        - id: ch01-b18
          speaker: narrator
          text: >-
            The boy laughed, tapped the hand with his spoon, picked up the cake, and climbed the mountain while whistling merrily.
        - id: ch01-b19
          speaker: robber
          text: Well? Did you find fear down there?
        - id: ch01-b20
          speaker: boy
          text: >-
            No. Was fear there? I only saw a hand reach from a grave and try to take my cake. I rapped its fingers with my spoon and told it the cake wasn't for the dead. Then it vanished. Oh, this fire feels wonderful!
        - id: ch01-b21
          speaker: narrator
          text: >-
            He dropped to his knees before the flames. He never noticed the astonished looks that passed between the robbers.
        - id: ch01-b22
          speaker: robber
          text: >-
            You still have another chance. There's a deep pool on the far side of the mountain. Go there. Perhaps you'll meet fear along the way.
        - id: ch01-b23
          speaker: boy
          text: I truly hope I do.
        - id: ch01-b24
          speaker: narrator
          text: And he set out at once.
    - id: ch02
      title: The Swing Above the Pool
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Before long, the boy saw the pool shining in the moonlight. A tall swing stood directly above the water, and a child sat in it, weeping bitterly. The boy thought it a strange place for a swing and wondered why the child was crying. He hurried toward it, but then a maiden ran up to him.
        - id: ch02-b02
          speaker: second_maiden
          text: >-
            I want to lift my little brother out of that swing, but it's too high for me to reach. Go closer to the edge and let me stand on your shoulders. Then I think I can get him down.
        - id: ch02-b03
          speaker: boy
          text: Gladly.
        - id: ch02-b04
          speaker: narrator
          text: >-
            In a moment, the girl had climbed onto his shoulders. From there, she could easily have lifted the child down, but she did not even try. Instead, she drove her feet hard against both sides of the boy's neck. He felt that one more moment would leave him choking or tumbling into the water below. He gathered every bit of his strength, gave one tremendous heave, and threw her backward off his shoulders.
        - id: ch02-b05
          speaker: narrator
          text: >-
            When she struck the ground, a bracelet slipped from her arm. The boy picked it up.
        - id: ch02-b06
          speaker: boy
          text: >-
            I may as well keep this to remember all the strange things that have happened since I left home.
        - id: ch02-b07
          speaker: narrator
          text: >-
            He turned to look for the child. Both the child and the swing had vanished. The first streaks of dawn were showing in the sky.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The boy slipped the bracelet onto his own arm and started for a small town on the plain beyond the mountain. By the time he entered its main street, he was both hungry and thirsty. A man noticed the bracelet as he passed and stopped him.
        - id: ch02-b09
          speaker: bracelet_claimant
          text: Where did you get that bracelet? It belongs to me.
        - id: ch02-b10
          speaker: boy
          text: No, it belongs to me.
        - id: ch02-b11
          speaker: bracelet_claimant
          text: >-
            It does not. Hand it over now, or there will be trouble for you!
          emotion: angry
        - id: ch02-b12
          speaker: boy
          text: >-
            Let's tell our stories to a judge. If he decides it's yours, you can have it. If he decides it's mine, I'll keep it.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The man agreed, and they went together to the great hall where the kadi gave judgment. He listened carefully to both of them before announcing his decision.
        - id: ch02-b14
          speaker: kadi
          text: >-
            Neither one of you has proved that the bracelet is his. I will keep it here until one of you brings me its matching bracelet.
        - id: ch02-b15
          speaker: narrator
          text: >-
            The two claimants looked at each other. Their faces asked the same question. Where in the world could they go to find the other bracelet? Neither one had any idea. Still, they knew that arguing would not change the kadi's decision. They bowed low before him and left the hall of audience together.
    - id: ch03
      title: The Ship on the Hidden Rock
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The boy wandered without knowing where he was going, until he found himself beside the sea. Not far from shore, a ship had struck a hidden rock and was sinking fast. The crew crowded the deck, their faces white as death. They shrieked and wrung their hands.
        - id: ch03-b02
          speaker: boy
          text: Have you found fear?
        - id: ch03-b03
          speakers: [sailor_1, sailor_2, sailor_3]
          ensemble: chorus
          text: Help us! Help us! We're drowning!
          emotion: fearful
        - id: ch03-b04
          speaker: narrator
          text: >-
            Their cries carried over the crashing waves. Without waiting, the boy threw off his clothes on the beach and swam out to the ship. When he reached its side, many hands stretched toward him and hauled him up onto the deck.
        - id: ch03-b05
          speakers: [sailor_1, sailor_2, sailor_3]
          ensemble: chorus
          text: >-
            The ship is pitching from side to side. Soon it will be dragged under! Death is close, and we're terrified!
          emotion: fearful
        - id: ch03-b06
          speaker: boy
          text: Give me a rope.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The sailors gave him a rope. He made one end secure around his body and fastened the other end to the mast. Then he sprang overboard. Down he went, and down again, sinking through the water until at last his feet touched the sea floor. There he stood upright and looked around him.
        - id: ch03-b08
          speaker: narrator
          text: >-
            There he saw a sea-maiden with a wicked face. She had caught the ship with a grappling iron and was tugging hard at the chain, dragging the vessel little by little beneath the waves. The boy gripped both her arms and forced her to drop it. At once, the ship above stopped being tossed about. The sailors could steady her and gently float her away from the hidden rock.
        - id: ch03-b09
          speaker: narrator
          text: >-
            A rusty knife lay in a heap of seaweed at the boy's feet. He cut the rope from his waist and used it to bind the sea-maiden tightly to a stone, so she could do no more harm. Then he bade her farewell, swam back to the beach, and found his clothes where he had left them.
    - id: ch04
      title: The Three Maidens
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The boy dressed quickly and walked on. Soon he came to a beautiful, shady garden filled with flowers, and a clear little stream ran through it. The day was hot and he was tired, so he went through the gate. He sat beneath a thick clump of bushes covered in sweet-smelling red blossoms. The shade was pleasant, and before long he fell asleep.
        - id: ch04-b02
          speaker: narrator
          text: >-
            A sudden beating of wings and a cool breeze woke him. He raised his head carefully and saw three doves plunge into the stream. They splashed happily, shook the water from their feathers, and dived to the bottom of a deep pool.
        - id: ch04-b03
          speaker: narrator
          text: >-
            When they rose again, they were no longer doves. They had become three beautiful maidens, and between them they carried a table made of mother-of-pearl. They set it down and placed drinking cups of pink and green shell upon it. One maiden poured a drink into a cup from a crystal goblet. She was just lifting it to her mouth when her sister stopped her.
        - id: ch04-b04
          speaker: second_maiden
          text: Whose health are you drinking to?
        - id: ch04-b05
          speaker: first_maiden
          text: >-
            To the youth who baked the cake. When I reached my hand out of the earth, he struck it with his spoon. Other men would have been afraid, but he was not. Now, whose health will you drink to?
        - id: ch04-b06
          speaker: second_maiden
          text: >-
            To the youth who let me climb onto his shoulders beside the pool. He threw me off with such force that I lay senseless on the ground for hours. And you, sister, whose health will you drink to?
        - id: ch04-b07
          speaker: third_maiden
          text: >-
            Deep in the sea, I caught hold of a ship. I shook it and pulled until it was almost lost. Then a youth came. He freed the ship and bound me to a rock. I drink to his health.
        - id: ch04-b08
          speaker: narrator
          text: >-
            As the third maiden spoke, she looked nothing like the wicked creature who had gripped the chain beneath the waves. All three raised their cups and drank without another word. As they lowered the cups, the boy stepped out before them.
        - id: ch04-b09
          speaker: boy
          text: >-
            I am the youth whose health you just drank. Now give me the bracelet that matches the jeweled band one of you dropped. A man tried to claim it, but I refused to give it up. He took me before the kadi, and the kadi kept it until I could bring him its mate. I've wandered here and there looking for it, and that is how I came to so many strange places.
        - id: ch04-b10
          speaker: first_maiden
          text: Then come with us.
        - id: ch04-b11
          speaker: narrator
          text: >-
            The maidens led him down a passage and into a great hall. Many chambers opened from it. As they passed from one to another, every chamber was more splendid than the last. One shelf was heaped with gold and jewels. From that treasure, the eldest sister chose a bracelet that matched the one in the judge's keeping in every way. She fastened it around the boy's arm.
        - id: ch04-b12
          speaker: first_maiden
          text: >-
            Go straight to the kadi and show him this. He will give you the matching bracelet.
        - id: ch04-b13
          speaker: boy
          text: >-
            I will never forget you. But we may not meet again for a long while, because I cannot rest until I find fear.
        - id: ch04-b14
          speaker: narrator
          text: >-
            The boy went on his way. He showed the second bracelet to the kadi and won back the first. Then he set out once more to search for fear.
    - id: ch05
      title: Fear at Last
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            On and on the boy walked, but fear never came across his path. One day, he entered a large town. Its streets and squares were packed so tightly that he could barely move between the people.
        - id: ch05-b02
          speaker: boy
          text: Why have all these people gathered here?
        - id: ch05-b03
          speaker: townsman
          text: >-
            The ruler of this country has died without children, so we must choose the next king. Each morning, a sacred pigeon is released from that tower. The man it lands on becomes our ruler. The pigeon will fly in a few minutes. Stay and see what happens.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Every eye turned toward the tall tower in the middle of the main square. The crowd waited until the sun stood directly above it. At that exact moment, a door in the tower opened. A beautiful pigeon rushed into the air, its feathers gleaming pink and gray, blue and green. On it flew across the square, farther and farther, until at last it came down and rested on the boy's head.
        - id: ch05-b05
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: The king! The king!
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: >-
            As the cries rang around him, a vision flashed through the boy's mind, swift as lightning. He saw himself sitting on a throne. He would spend his whole life trying, and always failing, to make the poor rich, the miserable happy, and the bad good. He would never do anything he wanted. He could not even marry the girl he loved.
        - id: ch05-b07
          speaker: boy
          text: No! No!
          emotion: fearful
        - id: ch05-b08
          speaker: narrator
          text: >-
            He cried out and covered his face with his hands. The people thought the grandeur ahead had overwhelmed him, so they paid no attention to his protest.
        - id: ch05-b09
          speaker: citizen_1
          text: Release more pigeons, then. We must be completely sure.
        - id: ch05-b10
          speaker: narrator
          text: >-
            More pigeons flew from the tower, and every one followed the first. The shouting grew louder than ever.
        - id: ch05-b11
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: The king! The king!
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: >-
            A cold shiver ran through the young man. He did not understand it.
        - id: ch05-b13
          speaker: mysterious_voice
          text: This is the fear you have searched for so long.
        - id: ch05-b14
          speaker: narrator
          text: >-
            The whisper seemed meant for his ears alone. The vision flashed before him once more. He bowed his head, accepted his doom, and prepared to spend his life with fear beside him.
