        delivery: 从容温厚，悲剧转折处克制而沉静
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    boy:
      display_name: 男孩
      tts:
        delivery: 坦率无畏，好奇而干脆
        timbre: 清亮自然的少年男声
        pace: 适中偏快
        pitch: 中高
    mother:
      display_name: 母亲
      tts:
        delivery: 慈爱敏感，惊惧时声音发紧
        timbre: 柔和朴素的成年女声
        pace: 适中
        pitch: 中
    robber_captain:
      display_name: 强盗头领
      tts:
        delivery: 粗豪逼人，带着傲慢的威吓
        timbre: 低沉粗粝的成年男声
        pace: 稍慢
        pitch: 低
    robber:
      display_name: 强盗
      tts:
        delivery: 狡黠试探，说话直截了当
