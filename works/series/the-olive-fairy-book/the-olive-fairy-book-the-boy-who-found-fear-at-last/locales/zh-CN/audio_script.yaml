        pace: 适中
        pitch: 中低
    grave_maiden:
      display_name: 坟中姑娘
      tts:
        delivery: 神秘从容，语气里藏着顽皮
        timbre: 空灵清冷的年轻女声
        pace: 稍慢
        pitch: 中高
    pool_maiden:
      display_name: 潭边姑娘
      tts:
        delivery: 表面恳切，回忆时爽快坦然
        timbre: 明亮灵巧的年轻女声
        pace: 适中
        pitch: 中高
    sea_maiden:
      display_name: 海中姑娘
      tts:
        delivery: 冷峻有力，平静中带着奇异威严
        timbre: 深澈清亮的年轻女声
