audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    physician:
      display_name: 异国御医
      tts:
        delivery: 谨慎专业，说话沉着而有分寸
        timbre: 清晰稳重的成年男声
        pace: 适中
        pitch: 中
    prince:
      display_name: 王子
      tts:
        delivery: 善良坦率，年轻而有教养，危急时仍守住勇气
        timbre: 清朗温和的年轻男声
        pace: 适中
        pitch: 中
    old_king:
      display_name: 老国王
      tts:
        delivery: 久病忧愤，发怒时暴烈急促
        timbre: 沙哑厚重的老年男声
        pace: 稍缓
        pitch: 中低
    queen:
      display_name: 王后
      tts:
        delivery: 慈爱果断，叮嘱时郑重而克制
        timbre: 温厚端庄的成年女声
        pace: 舒缓
        pitch: 中
    arab:
      display_name: 阿拉伯人
      tts:
        delivery: 忠诚机敏，胸有成竹，话语简短坚定
        timbre: 沉静结实的成年男声
        pace: 适中
        pitch: 中低
    governor:
      display_name: 总督
      tts:
        delivery: 爽快威严，喜悦时热情慷慨
        timbre: 洪亮饱满的成年男声
        pace: 适中
        pitch: 中低
    foreign_king:
      display_name: 异国国王
      tts:
        delivery: 矜持冷静，惊慌时掩不住局促
        timbre: 威严而略显苍老的男声
        pace: 从容
        pitch: 中低
    messenger:
      display_name: 埃及使者
      tts:
        delivery: 恭敬郑重，禀报时清楚利落
        timbre: 晒得粗粝的成年男声
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 百日寻鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，埃及有位国王，一场重病夺去了他的视力。他从此活在黑暗里，十分痛苦。日子一月月过去，国内最好的医生都来诊治，却没有一个能让他复明。国王越来越绝望，忧愁折磨得他日渐消瘦。人人看着都觉得他将不久于人世，连他唯一的儿子王子也这样担心。
        - id: ch01-b02
          speaker: narrator
          text: 一天，一位旅人乘船沿尼罗河而来。他见一路遇到的埃及人全都满面愁容，便询问出了什么事。听完缘由，他说自己侍奉着远方的一位国王，是那里的宫廷御医。若能获准，他愿意为这位失明的国王诊察眼睛。这个消息让全国的人都欢喜起来。旅人很快被领到国王面前。他细细诊察了好一会儿，终于说，病情虽重，却还有一线希望。
        - id: ch01-b03
          speaker: physician
          text: 大海里有一条金头鱼。你们若能捉来，我就用它的血配成药膏，让陛下重见光明。我只在这里等一百天。到时还捉不到鱼，我就得回去侍奉自己的君主。
        - id: ch01-b04
          speaker: narrator
          text: 第二天一早，王子带上一百个人出发，每人手里都拿着一张渔网。一支小小的船队已经在等着他们。众人登船驶向大海中央，连续三个月，每天从太阳升起一直忙到太阳落下。网里的鱼多得数不清，可他们逐条找遍，也没见到一条金色的头。
        - id: ch01-b05
          speaker: prince
          text: 再找也来不及了。一个钟头后，一百天就满了。即使今晚捉到它，等我们回到埃及，医生也早已离开。不过，我还要亲手再撒最后一网。
        - id: ch01-b06
          speaker: narrator
          text: 第一百天将尽时，王子果真亲自出海。期限届满的那一刻，他拉起渔网，苦苦寻找的金头鱼竟困在网中。
        - id: ch01-b07
          speaker: prince
          text: 成功偏偏来得太晚。把它放进盛水的容器吧。至少带回去让父王看看，知道我们已经尽力了。
        - id: ch01-b08
          speaker: narrator
          text: 王子在哲学学堂读过书，这才发出那番感叹。可等他走近，金头鱼却抬起一双哀求的眼睛望着他。那眼神实在可怜，王子再也下不了决心，不能为了一个早已错过的药方让它送命。他知道，本国医生虽不懂那个秘密，也一定会拿这条鱼反复尝试，千方百计想从鱼血里提炼出什么来。于是，他亲手捧起这份百日辛劳换来的收获，将金头鱼放归大海。看着它游走以后，王子才带着船队踏上回宫的路。
        - id: ch01-b09
          speaker: narrator
          text: 他抵达王宫时，国王正因失望而发着高烧，根本不信儿子的解释。
        - id: ch01-b10
          speaker: old_king
          text: 就拿你的脑袋来抵！拿你的脑袋来抵！立刻把刽子手召进宫！
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: 国王命群臣立刻召来刽子手。宫中有人听了，赶忙把消息报给王后。王后不敢耽误，给儿子换上平民衣服，把他的口袋装满黄金，又匆匆带他赶到港口。那里恰好有一艘船，当夜便要驶向遥远的岛屿。她把儿子送上船，催他马上离开埃及。
        - id: ch01-b12
          speaker: queen
          text: 你父王总有一天会后悔。到那时，他知道你还活着，一定会庆幸。临走前再记住一句话，凡是要按月领工钱的人，都不要收作仆人。
        - id: ch01-b13
          speaker: narrator
          text: 王子觉得这句忠告很奇怪。仆人的工钱无论如何总要付，按月还是按年，究竟能有什么分别？他怎么想也想不通。不过，以往许多事情都证明母亲比他更有智慧，他便郑重答应，无论如何都会照办。
    - id: ch02
      title: 海岛上的忠仆
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 王子在海上航行了几个星期，终于来到母亲所说的岛。岛上青山起伏，树林葱郁，遍地开满鲜花。许多漂亮的白房子坐落在花园里，从这一处望到那一处，满眼都是明媚景色。他觉得这里实在适合居住，一点时间也没浪费，很快买下一座最美的住宅。
        - id: ch02-b02
          speaker: narrator
          text: 房子买好以后，许多仆人争相登门，求王子雇用自己。可每个人都说明，工钱必须在每个月底结清。王子始终记着母亲的叮嘱，所以不管来人怎样自荐，他都一个也没收。终于，有一天早晨，一个阿拉伯人来到门前，恳请王子让自己服侍他。王子仔细问过他的本领和经历，觉得这个人十分合适。
        - id: ch02-b03
          speaker: prince
          text: 你要多少工钱？
        - id: ch02-b04
          speaker: arab
          text: 我不要钱。一年以后，您自会知道我的服侍值多少。到时，您想怎样酬谢都行。
        - id: ch02-b05
          speaker: narrator
          text: 王子听了很满意，就收下阿拉伯人做仆人。岛屿这一边处处美丽，从这里根本看不出另一边是什么模样。其实，那边早已成了荒漠。一个可怕的怪物常从海里爬出来，把田里的庄稼和人们饲养的牲畜全都吞掉。总督一队接一队地派出士兵，让他们藏好，等怪物出现就将它杀死。可也不知是什么缘故，每当怪物前来破坏，士兵们偏偏全在睡觉。总督一次次严惩这些贪睡的人，下一回仍旧没有改变。最后，他只能派传令官走遍全岛，宣布谁能杀死怪物，谁就会得到重赏。
        - id: ch02-b06
          speaker: narrator
          text: 阿拉伯人听到消息，马上去见总督。
        - id: ch02-b07
          speaker: arab
          text: 如果我的主人杀了怪物，您会怎样酬谢他？
        - id: ch02-b08
          speaker: governor
          text: 我把女儿嫁给他。除此以外，他想要什么，我就给什么。
        - id: ch02-b09
          speaker: arab
          text: 女儿嫁给他就够了，财富请您留下。不过以后无论得到什么收益，都得分给她一份。
        - id: ch02-b10
          speaker: governor
          text: 好，就照你说的办。
        - id: ch02-b11
          speaker: narrator
          text: 总督同意这个条件，命人拟好契约，双方签字作证。当晚，阿拉伯人独自到海边守候。出发以前，他把一种刺激皮肤的油涂遍全身。皮肤疼得火辣辣的，他就绝不会像先前的士兵那样睡过去。来到岸边，他藏在一块巨岩后面，耐心等待。过了一阵，海面仿佛忽然鼓起一道浪头。几分钟后，怪物现身了。它一部分像鸟，一部分像野兽，还有一部分像蛇。它没有发出一点声音，悄悄踏上礁石，蹑手蹑脚地朝田野潜去。
        - id: ch02-b12
          speaker: narrator
          text: 阿拉伯人早已做好准备。怪物从岩石旁经过时，他冲出来，把匕首猛刺进它耳后的柔软处。怪物踉跄了几步，发出一声震耳的吼叫，随后翻身倒下，两只脚还泡在海水里。阿拉伯人没有立刻走近。他又在藏身处观察了一会儿，直到那具庞大的身体始终一动不动，确定敌人已经断气，才出来割下它的两只耳朵。这双耳朵就是杀死怪物的凭证，他把它们带回去交给主人。
        - id: ch02-b13
          speaker: arab
          text: 把这双耳拿给总督，就说怪物是您亲手杀的，谁也没有帮忙。
        - id: ch02-b14
          speaker: prince
          text: 可杀它的人明明是你，不是我。
        - id: ch02-b15
          speaker: arab
          text: 没关系，请照我说的做。我这样安排，自有理由。
        - id: ch02-b16
          speaker: narrator
          text: 王子不愿把从未做过的事算成自己的功劳，可阿拉伯人一再坚持，他最后还是听从了。总督看见怪物的双耳，欢喜极了，当天就恳请王子迎娶自己的女儿。王子没有答应这桩婚事。他说，自己只想要一艘船，好继续周游世界。总督当然马上满足了这个请求。等王子与忠诚的阿拉伯人登船时，才发现船舱里已经堆满钻石和宝石。那是心怀感激的总督瞒着他们放进去的。主仆二人带着这份厚礼，就此扬帆远行。
    - id: ch03
      title: 公主的新郎
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们航行了很久很久，终于来到一个大国的海岸。阿拉伯人请王子留在船上，自己进城打听这里的情形。几小时后，他回来告诉主人，这个国家的公主被人称作世上最美丽的女子，王子应该去向她求婚。王子很乐意接受这个建议。他挑出几串最精美的项链拿在手中，又骑上阿拉伯人为他买来的骏马。忠心的随从紧跟在后，两人一路来到王宫。那天，异国国王恰好心情不错，很快便召见了他们。王子把项链放在宝座的台阶上，请国王把公主嫁给自己。
        - id: ch03-b02
          speaker: narrator
          text: 异国国王那天心情很好，听完请求，却沉默了一阵。
        - id: ch03-b03
          speaker: foreign_king
          text: 年轻人，我可以答应你的愿望。不过你要知道，她已经和一百九十个年轻人举行过婚礼，没有一个人在婚后活过十二个钟头。现在还来得及，你再想想。
        - id: ch03-b04
          speaker: narrator
          text: 王子这一想，吓得差点直接逃回船上。正要收回求婚的话，阿拉伯人却低声劝他。
        - id: ch03-b05
          speaker: arab
          text: 不用怕，娶她。
        - id: ch03-b06
          speaker: prince
          text: 运气总会转变。为了这样一位举世无双的公主，谁不肯拿性命冒一次险？
        - id: ch03-b07
          speaker: foreign_king
          text: 随你吧。我马上吩咐下去，今晚举行婚礼。
        - id: ch03-b08
          speaker: narrator
          text: 当晚，婚礼果真举行了。仪式结束后，新娘和新郎回到自己的房间，依照当地风俗，两个人单独享用晚餐。窗外月色明亮，王子走到窗前，想看看流过王宫的河水和远处群山。可他的目光忽然落到一张长榻上。那里整整齐齐铺着一件丝绸裹尸布，正面还用金线绣了他的名字。这也是国王特意给女婿安排的乐事。
        - id: ch03-b09
          speaker: narrator
          text: 王子看得毛骨悚然，赶紧把脸转向别处。谁知这一回，他又看见窗下有一群人正在忙着挖土。已经这么晚了，他们为什么还在干活？那个坑又是拿来做什么的？坑的形状又长又窄，越看越像一座坟。王子忽然明白过来，他们挖的正是自己的坟墓。他震惊得说不出话，像被什么钉在窗前，一步也迈不开。
        - id: ch03-b10
          speaker: narrator
          text: 就在此刻，一条小黑蛇从桌边公主的口中窜出，直奔王子而来。阿拉伯人早有防备，一手用铁钳夹住蛇，一手挥起匕首，斩下蛇头。
        - id: ch03-b11
          speaker: narrator
          text: 次日一早，新女婿前来觐见。国王看见他活着走进门，简直不敢相信双眼。
        - id: ch03-b12
          speaker: foreign_king
          text: 怎么会是你？
          emotion: surprised
        - id: ch03-b13
          speaker: prince
          text: 是我，为什么不能是我？我早说过，运气总会转变，果然如此。我来是想请您让园丁填上我窗下那个大坑。它把景色都破坏了。
        - id: ch03-b14
          speaker: foreign_king
          text: 当然！当然会填！你还有别的要求吗？
          emotion: surprised
        - id: ch03-b15
          speaker: prince
          text: 没有了，多谢您。
        - id: ch03-b16
          speaker: narrator
          text: 王子说完便鞠躬告退。自从阿拉伯人砍下蛇头，公主身上的魔咒，或者不管那究竟是什么东西，也像是随之解开了。她和丈夫从此过得很幸福。日子轻快地向前流去。白天，两人到森林里打猎，或在流过王宫的宽阔河面上扬帆游览。夜幕落下，公主会弹着竖琴唱歌，王子则给她讲述遥远埃及的故事。
    - id: ch04
      title: 金头鱼的报答
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一天傍晚，一个衣着陌生、脸被太阳晒得黝黑的人来到宫中。他俯伏在王子面前，说自己奉埃及王后之命而来。老国王已经去世，王子如今继承了王位。
        - id: ch04-b02
          speaker: messenger
          text: 王国的事务有些混乱。王后陛下请您不要耽搁，立刻带着新娘一同回去。
        - id: ch04-b03
          speaker: narrator
          text: 王子马上去见岳父，把埃及传来的消息告诉他。岳父原以为这个女婿只是某个行省的总督，如今得知他竟是一国之君，而且统治着强大的埃及，自然十分高兴。他立刻命人备妥一艘华丽的大船，让年轻夫妇尽快启程。一个星期后，他又亲自骑马来到港口，为女儿女婿送行。
        - id: ch04-b04
          speaker: narrator
          text: 王后仍在为丈夫的死哀伤，可见儿子平安归来，又满心欢喜。她下令用华美的织物装点整座王宫，隆重迎接儿媳。埃及百姓吃够了老国王残酷统治的苦，都盼望新君能带来不同的日子。每天早晨，人们成群结队来到宫前，手里拿着一份份请愿书，都想说服国王答应自己的请求。
        - id: ch04-b05
          speaker: narrator
          text: 新国王忙得没有片刻清闲，心里却很幸福。直到一天夜里，阿拉伯人前来请求准他返回故乡。
        - id: ch04-b06
          speaker: prince
          text: 离开我？你真的想离开我吗？
          emotion: sad
        - id: ch04-b07
          speaker: narrator
          text: 阿拉伯人难过地低下头。
        - id: ch04-b08
          speaker: arab
          text: 不，我的主人，我绝不会想离开您。可是我收到了召唤，不能不服从。
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: 国王沉默了。他想到就要失去这位忠仆，只得拼命忍住悲痛。
        - id: ch04-b10
          speaker: prince
          text: 好吧，我不能留住你。你为我做了这么多，我若不让你走，算什么报答？我的一切都是你的，想拿什么都可以。没有你，我早就没命了！
          emotion: sad
        - id: ch04-b11
          speaker: arab
          text: 要是没有您，我也早就没命了。因为，我就是那条金头鱼。
