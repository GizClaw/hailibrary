  chapters:
    - id: ch01
      title: The Fish in the Great Sea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a king of Egypt who lost his sight after a terrible illness. Month after month, the finest doctors in the country tried to cure him, but nothing helped. The king was so unhappy that he grew thin and weak. Everyone feared he would die, including his only son, the young prince.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Then a traveler came sailing down the Nile. He saw how troubled the people looked and asked them why. When he heard about their king, he said he served as court physician to a ruler in a distant land and asked to examine the blind man's eyes. They hurried him into the royal presence. After studying the king for several minutes, he declared that the case was grave, but there was still a little hope.
        - id: ch01-b03
          speaker: foreign_physician
          text: >-
            A Golden-headed Fish lives somewhere in the Great Sea. Catch it and bring it to me. I can make an ointment from its blood that will give you back your sight. I will remain here for one hundred days. If the fish has not been caught by then, I must go home to my own king.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The next morning, the prince went to search for the fish. A hundred men went with him, and each carried a net. A small fleet waited for them, and they sailed out to the middle of the Great Sea. For three months they worked from sunrise until sunset. Day after day, they cast the nets and hauled them in again. They caught great numbers of fish, but not one had a golden head. At last, the final night of the hundred days arrived.
        - id: ch01-b05
          speaker: prince
          text: >-
            There is no use now. Even if we catch it tonight, the hundred days will end within the hour. The doctor will be gone long before we can reach the capital. Still, I will make one last trip and cast the net myself.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The prince went out once more. At the very moment the hundred days ended, he pulled in his net. There, tangled in its meshes, was the Golden-headed Fish.
        - id: ch01-b07
          speaker: prince
          text: >-
            We have succeeded, but we are too late. That often happens. Put the fish in the vessel of water anyway. We will take it home and show my father that we did all we could.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The young man had studied philosophy, and that was how he tried to accept his bad luck. But when he bent over the fish, it looked up at him with such pitiful eyes that he could not condemn it to death. He knew the doctors in Egypt did not understand the secret ointment. Even so, they would do everything they could to take something from the creature's blood. The prince lifted the prize they had worked so hard to catch and threw it back into the sea.
        - id: ch01-b09
          speaker: narrator
          text: >-
            When he finally returned to the palace, he found his father burning with fever from disappointment. The king refused to believe a word of his son's story.
        - id: ch01-b10
          speaker: egyptian_king
          text: Your head will pay for this! Your head will pay for it!
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: >-
            He ordered the courtiers to summon the executioner at once. Someone ran to warn the queen. She dressed her son in common clothes, filled his pockets with gold, and rushed him aboard a ship that would sail that very night for a distant island.
        - id: ch01-b12
          speaker: queen
          text: >-
            One day your father will be sorry, and then he will be grateful to learn that you are alive. Remember one last piece of advice. Never hire a man who asks to be paid by the month.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The advice seemed strange to the prince. A servant had to be paid sooner or later, so why should it matter whether the wages came every month or every year? He could see no sense in it. Still, his mother had often proved wiser than he was. He trusted her judgment and promised to obey.
    - id: ch02
      title: The Faithful Servant
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            After several weeks at sea, the prince reached the island his mother had named. Hills, woods, and flowers covered the land. Beautiful white houses stood in gardens everywhere.
        - id: ch02-b02
          speaker: prince
          text: What a lovely place this would be to live.
        - id: ch02-b03
          speaker: narrator
          text: >-
            He quickly bought one of the prettiest houses. Servants crowded around to offer their help, but every one of them wanted wages at the end of each month. The prince remembered his promise and turned them all away. Then, one morning, an Arab came and asked to serve him. The prince questioned the newcomer, decided he was suitable, and asked what wages he wanted.
        - id: ch02-b04
          speaker: arab
          text: >-
            I ask for no money now. At the end of a year, decide what my service has been worth and pay me however you choose.
        - id: ch02-b05
          speaker: narrator
          text: >-
            This pleased the prince, and he hired the Arab. From the pleasant side of the island, no one would have guessed that the other half had become a desert. A horrible monster rose from the sea and devoured all the corn and cattle there. The governor repeatedly sent groups of soldiers to hide and wait for it. Yet whenever the creature came ashore, every soldier somehow happened to be asleep. The governor punished the men severely, but it made no difference. The same thing happened to the next group, and the group after that. At last, heralds crossed the whole island offering a great reward to whoever could kill the monster.
        - id: ch02-b06
          speaker: narrator
          text: The moment the Arab heard the news, he went to the governor's palace.
        - id: ch02-b07
          speaker: arab
          text: If my master kills the monster, what reward will you give him?
        - id: ch02-b08
          speaker: governor
          text: He may marry my daughter, and he may name anything else he wants.
        - id: ch02-b09
          speaker: arab
          text: >-
            Give him your daughter and keep your riches. From that day onward, let her share in everything you earn.
        - id: ch02-b10
          speaker: governor
          text: Agreed.
        - id: ch02-b11
          speaker: narrator
          text: >-
            The governor ordered a deed to be written, and both men signed it. That night, the Arab secretly went down to the shore. Before leaving, he rubbed his body with oil that made his skin sting so fiercely that he could never fall asleep like the soldiers. He hid behind a great rock and waited.
        - id: ch02-b12
          speaker: narrator
          text: >-
            After a while, the water began to swell. A few minutes later, a hideous monster stepped soundlessly onto the rocks. It was part bird, part beast, and part serpent. It crept toward the fields, but the Arab was ready. As it passed, he drove his dagger into the soft place behind its ear. The creature staggered, let out a terrible cry, and fell dead with its feet in the sea.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The Arab watched until he was certain it would not move again. Then he came out from behind the rock, cut off the monster's ears, and carried them to his master.
        - id: ch02-b14
          speaker: arab
          text: Show these ears to the governor. Tell him that you killed the monster, and that no one else did it.
        - id: ch02-b15
          speaker: prince
          text: But you killed it. I did not.
        - id: ch02-b16
          speaker: arab
          text: Never mind that. Please do as I say. I have a reason.
        - id: ch02-b17
          speaker: narrator
          text: >-
            The prince disliked taking credit for another man's deed. He argued with the Arab, but at last he gave in and carried the ears to the palace. The governor was delighted by the news. He begged the prince to marry his daughter that very day, just as he had promised. The prince refused the marriage and asked for only one thing, a ship that would carry him away to see the world. The governor granted his wish at once. When the prince and his faithful Arab went aboard, they discovered heaps of diamonds and precious stones stored inside the vessel. The grateful governor had placed them there in secret, although the prince had asked for none of his wealth.
    - id: ch03
      title: The Princess and the Snake
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            They sailed on and on until they came to the shore of a great kingdom. The prince stayed aboard while the Arab went into town to learn what sort of country they had found. Several hours later, he returned. He had heard that the king's daughter was the most beautiful princess in the world, and he advised his master to ask for her hand.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The prince was glad to follow that advice. He took several of the finest necklaces from the ship. Then he mounted a splendid horse the Arab had bought for him and rode to the palace, with his faithful servant following close behind. The strange king happened to be in a cheerful mood that day, so the travelers were soon admitted to his presence. The prince placed the jeweled necklaces on the steps of the throne. Then he asked the king to give him his daughter in marriage. The king listened in silence and paused before giving his answer.
        - id: ch03-b03
          speaker: princess_king
          text: >-
            Young man, if you truly wish it, I will give you my daughter as your wife. But you must first know this. She has already married one hundred and ninety young men, and not one of them lived for twelve hours afterward. Think carefully while you still have time.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The prince did think. He became so frightened that he nearly returned to his ship without another word. Just as he was about to take back his proposal, the Arab whispered to him.
        - id: ch03-b05
          speaker: arab
          text: Do not be afraid. Marry her.
        - id: ch03-b06
          speaker: prince
          text: >-
            Luck must turn sooner or later. Who would refuse to risk his head for a princess without equal?
        - id: ch03-b07
          speaker: princess_king
          text: As you wish. I will have the wedding held tonight.
        - id: ch03-b08
          speaker: narrator
          text: >-
            And so the wedding took place that very night. After the ceremony, the bride and groom went to their own rooms to eat supper alone, as people in that country always did. The moon was shining brightly. The prince walked to the window and looked out across the river toward the distant hills. Then his eyes fell on a silk burial shroud spread neatly on a couch. His own name had been sewn across the front in golden thread. Preparing that shroud was another pleasure of the king.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Horrified, the prince turned away. Now he saw a group of men digging beneath his window. Why were they working at such an hour? And why was the hole so long and narrow? Then he understood. They were digging his grave.
        - id: ch03-b10
          speaker: narrator
          text: >-
            The discovery struck the prince so hard that he could neither speak nor move. He stood frozen at the window, staring at his own grave. At that instant, a small black snake shot from the mouth of the princess, who was still sitting at the supper table. It dropped down and wriggled quickly toward him. But the Arab had been watching for just such a thing. He already held a pair of pincers in one hand. He seized the serpent with them and cut off its head with a sharp dagger.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Early the next morning, the prince asked to see the king. When the young bridegroom walked in, the king could scarcely believe his eyes.
        - id: ch03-b12
          speaker: princess_king
          text: You? You are here?
          emotion: surprised
        - id: ch03-b13
          speaker: prince
          text: >-
            Yes, of course. Why shouldn't I be? I told you luck had to turn, and it has. I only came to ask if your gardeners could fill in the huge hole beneath my window. It ruins the view.
        - id: ch03-b14
          speaker: princess_king
          text: Yes, certainly. Of course they will. Is there anything more?
          emotion: surprised
        - id: ch03-b15
          speaker: prince
          text: No, thank you. Nothing else.
        - id: ch03-b16
          speaker: narrator
          text: >-
            The prince bowed and left without revealing what had happened. From the moment the Arab cut off the snake's head, the spell, or whatever it was, seemed to leave the princess. She and her husband lived very happily together. Their days passed swiftly. Sometimes they hunted in the forests, and sometimes they sailed on the broad river that flowed past the palace. When evening came, the princess sang to her harp, or the prince told her stories about his own country.
    - id: ch04
      title: A Crown in Egypt
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            One evening, a stranger came to court. His clothing was unfamiliar, and the sun had burned his face brown. He asked to see the princess's husband. When he was brought before the prince, he fell on his face and announced that he carried a message from the queen of Egypt. The news was grave. The prince's father was dead, and the prince must succeed him as king.
        - id: ch04-b02
          speaker: egyptian_messenger
          text: >-
            Her Majesty asks you to leave at once and bring your bride with you. The kingdom's affairs have fallen into disorder.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The young man hurried to ask his father-in-law for an audience. The older king was delighted to discover that his daughter's husband was not merely the governor of some province, as he had believed, but the ruler of a mighty country. He ordered a splendid ship prepared immediately for the journey to Egypt. One week later, he rode down to the harbor himself to say farewell to his daughter and her husband.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The queen of Egypt still grieved for her dead husband, but she was overjoyed to welcome her son home. She commanded that magnificent cloths be hung throughout the palace in honor of his bride. The people hoped for great things from their new ruler. They had suffered badly under the old king's harsh rule. Every morning, crowds came before the palace with petitions in their hands, hoping to persuade the young king to grant their requests. He had more than enough to keep him busy, yet he was very happy.
    - id: ch05
      title: The Golden-headed Fish
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Then, one night, the Arab came to the king and asked for permission to return to his own country. The young man was filled with dismay.
        - id: ch05-b02
          speaker: prince
          text: Leave me? Do you truly want to leave me?
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: The Arab bowed his head sadly.
        - id: ch05-b04
          speaker: arab
          text: No, my master. I could never wish to leave you. But I have been summoned, and I dare not disobey.
          emotion: sad
        - id: ch05-b05
          speaker: narrator
          text: >-
            The king fell silent. He struggled to hold back his grief at the thought of losing the servant who had stayed beside him through every danger. At last, he managed to answer.
        - id: ch05-b06
          speaker: prince
          text: >-
            Then I must not keep you. After everything you have done for me, that would be a poor way to repay you. All I possess is yours. Take whatever you want. Without you, I would have died long ago.
          emotion: sad
        - id: ch05-b07
          speaker: arab
          text: And without you, I would have died long ago. I am the Golden-headed Fish.
