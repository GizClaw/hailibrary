  chapters:
    - id: ch01
      title: The Flying Peepul Tree
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long ago, in a city in India, there lived a poor oil-seller named Dena. Money never stayed in his pockets. He had borrowed one hundred rupees from a banker named Lena, and Lena's heavy interest had turned it into a debt of three hundred. Business was bad, and Dena had nothing to pay with.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Every evening, Lena came to Dena's house and shouted abuse at him. He always seemed to arrive while Dena's wife was cooking supper. He made such a scene that Dena, his wife, and their daughter lost their appetites. After weeks of this, Dena could bear no more. He decided to run away, and because traveling with a wife and daughter would be difficult, he meant to leave them behind. That evening, after work, he passed his own door and slipped out of the city without knowing where he would go.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At about ten that night, Dena reached a roadside well beside a giant peepul tree. He was exhausted, so he decided to climb into the great branches and rest there before continuing his journey in the morning. He found a comfortable place, curled up, and soon fell fast asleep. Certain spirits wander around such places on certain nights. While Dena slept, some of them picked up the whole tree. They carried it through the air to a distant shore where no creature lived, and long before sunrise, they set it down.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Just then, Dena woke and stared around him. He expected to find himself in the forest. Instead, there was nothing to see but an empty shore and a wide sea. Horror and astonishment left him speechless. He sat up and tried to gather his senses. Then, here and there, he began to notice tiny lights flashing and sparkling all around him like little fires. He wondered what they could be. One came so close that he reached out and caught it. In his hand lay a glittering red stone, almost as large as a walnut.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Dena tied the stone into a corner of his loincloth. Before long, he found another, then a third and a fourth, and carefully tied them all inside. Just as day began to break, the tree rose into the air. It flew swiftly back to the well and settled where it had stood the night before.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Once Dena recovered from the terror of the tree's strange journey, he thanked Providence for keeping him alive. He had lost all desire to wander. He hurried home, where his wife greeted him with scolding, questions, and reproaches. When she finally stopped to take a breath, Dena answered.
        - id: ch01-b07
          speaker: dena
          text: I have only one thing to say. Look at what I brought back!
        - id: ch01-b08
          speaker: narrator
          text: >-
            He carefully shut every door, untied the corner of his loincloth, and showed her the four stones. They glittered and flashed as he turned them in his hands.
        - id: ch01-b09
          speaker: denas_wife
          text: >-
            Pooh! They're only silly pebbles. If they were something to eat, they might be useful. What good are things like those?
        - id: ch01-b10
          speaker: narrator
          text: >-
            She sniffed and turned away. The night before, Lena had come to shout at Dena as usual. Finding his victim gone had only made him more threatening, and he had terrified Dena's wife. The moment he heard that Dena was home, the banker appeared in the doorway. He yelled at the oil-seller until he wore himself out. Then Dena spoke.
        - id: ch01-b11
          speaker: dena
          text: If your honor will step inside my humble home, I have something to tell you.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Lena entered. Dena closed all the doors again and showed him the four great, flashing stones.
        - id: ch01-b13
          speaker: dena
          text: >-
            This is everything I have to offer against my debt. As your honor knows, I do not have a single penny. Still, the stones are pretty.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Lena knew at once that they were magnificent rubies, and he longed to possess them. He was careful not to reveal it.
        - id: ch01-b15
          speaker: lena
          text: >-
            Why should I care about your foolish stones? I want my money, the lawful debt you owe me. One way or another, I will get it from you, or you will be sorry.
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: >-
            Dena had no answer to all these reproaches. He sat with his hands clasped and begged Lena for time and mercy. At last, the banker pretended to give in. He said that rather than leave a bad debt unpaid, he would suffer the loss of accepting the stones instead of his money. Dena nearly wept with gratitude. Lena wrote him a receipt for all three hundred rupees, wrapped the four rubies in a cloth, tucked them inside his clothes, and went home.
    - id: ch02
      title: Four Rubies Change Hands
      blocks:
        - id: ch02-b01
          speaker: lena
          text: >-
            How can I turn these rubies into money? I dare not keep them. They are so valuable that if the rajah hears of them, he may find some excuse to imprison me and seize the stones along with everything else I own. But what a bargain! Four rubies worth a king's ransom, and they cost me only one hundred rupees. I must take care not to give away my secret.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Lena made plan after plan as he walked, always thinking about how to protect his secret and keep his bargain. At last he decided what to do. He put on his cleanest clothes and went to the home of the chief wazir, Musli. There he asked for a private audience. Once they were alone, Lena brought out the four rubies and laid them before him. The wazir's eyes gleamed at the sight of the splendid gems.
        - id: ch02-b03
          speaker: musli
          text: >-
            Fine stones indeed. I cannot pay their true value, but I will give you ten thousand rupees for all four, if you are willing.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Lena gratefully agreed to the offer. He handed over the stones in exchange for the ten thousand rupees, then hurried home. All the way, he thanked his stars. He believed he had made a wonderfully sensible bargain and gained an enormous profit.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Musli then wondered what he should do with the gems. He soon decided to present them to Rajah Kahre. That very day, he went to the palace and asked to see the rajah alone. Then he placed the four jewels before his royal master.
        - id: ch02-b06
          speaker: kahre
          text: >-
            Oh, ho! These gems are priceless, and you have done well to give them to me. In return, you and your heirs shall receive the revenues from ten villages.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Musli was overjoyed, though he showed it only by making his deepest bow. The rajah tucked the rubies into his turban, and the wazir hurried away. He was beaming with happiness. For ten thousand rupees, he had become lord of ten villages, and those villages would belong to his heirs after him.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The rajah was just as pleased. He carried his new treasures to the women's quarters and showed them to the rani. She was almost beside herself with delight. She turned the stones over and over in her hands.
        - id: ch02-b09
          speaker: rani
          text: >-
            Ah, what a necklace these would make if I had eight more! You must get me eight more rubies like these, or I shall die!
        - id: ch02-b10
          speaker: kahre
          text: >-
            You are the most unreasonable woman! Where could I find eight more jewels like these? I gave ten villages for just four, and still you are not satisfied!
          emotion: angry
        - id: ch02-b11
          speaker: rani
          text: >-
            What does that matter? Do you want me to die? Surely you can find more wherever these came from.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Then she began to weep and wail. She kept on until the rajah promised that, in the morning, he would make arrangements to find more rubies. If she would only be patient, he told her, she would have what she wanted.
        - id: ch02-b13
          speaker: narrator
          text: >-
            In the morning, Kahre summoned Musli and ordered him to find eight more rubies like the first four.
        - id: ch02-b14
          speaker: kahre
          text: >-
            You will get them for me, or I will have you hanged!
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: >-
            Musli protested that he had no idea where to look, but the cross rajah refused to hear him.
        - id: ch02-b16
          speaker: kahre
          text: >-
            You must find them. The rani shall not die for lack of a few rubies. Go back to wherever the others came from.
        - id: ch02-b17
          speaker: narrator
          text: >-
            Musli left the palace in deep trouble. He ordered his slaves to bring Lena before him. The moment the banker appeared, the wazir gave his command.
        - id: ch02-b18
          speaker: musli
          text: >-
            Bring me eight more rubies like the ones you brought yesterday. I need eight, and I need them quickly, or I am a dead man.
        - id: ch02-b19
          speaker: lena
          text: How can I possibly do that? Rubies like those do not grow on bushes!
        - id: ch02-b20
          speaker: musli
          text: Then tell me where you got them.
        - id: ch02-b21
          speaker: lena
          text: Dena the oil-seller gave them to me.
        - id: ch02-b22
          speaker: musli
          text: >-
            Send for him and make him tell us where he found them. I am not going to be hanged for twenty men like Dena!
        - id: ch02-b23
          speaker: narrator
          text: >-
            More slaves were sent for Dena. When he arrived, the two men questioned him closely. Then all three went to the rajah, and Dena told Kahre the whole story.
        - id: ch02-b24
          speaker: kahre
          text: Which night did you sleep in the peepul tree?
        - id: ch02-b25
          speaker: dena
          text: I cannot remember, but my wife will know.
        - id: ch02-b26
          speaker: narrator
          text: >-
            Dena's wife was summoned to answer the question. She explained that it had happened on the last Sunday of the new moon. Everyone knew that spirits had special power to play tricks on mortals on the Sunday of a new moon. The rajah warned every one of them that they would be put to death if they spoke a word of the matter to anyone. Then he announced his plan. On the next Sunday of the new moon, Kahre, Musli, Lena, and Dena would all sit together in the peepul tree and see what happened.
    - id: ch03
      title: Grasping at the Shore
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The days dragged slowly by until the appointed Sunday finally came. That evening, the four men met in secret and entered the forest together. They did not have far to walk before they reached the peepul tree. Then all four climbed among its branches, just as the rajah had planned.
        - id: ch03-b02
          speaker: narrator
          text: >-
            At midnight, the tree began to sway. A moment later, it rose and moved through the air.
        - id: ch03-b03
          speaker: dena
          text: Look, sire. The tree really is flying!
          emotion: surprised
        - id: ch03-b04
          speaker: kahre
          text: >-
            Yes, yes. You told the truth. Now be quiet, and let us see what comes next.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Away and away the tree flew, while the four men clung tightly to its branches. At last, it settled beside the same empty shore. A great, wide sea came tumbling onto the deserted beach. Before long, just as Dena had seen on his first visit, little points of light appeared all around them. They glistened in the darkness like fires.
        - id: ch03-b06
          speaker: dena
          text: >-
            Think of it! Last time, I took only four stones that came close to me, and they cleared away my whole debt. This time, I will gather every one I can and become rich.
        - id: ch03-b07
          speaker: lena
          text: >-
            Four stones brought me ten thousand rupees. If I collect forty for myself, I will be so wealthy that they may even make me a wazir!
        - id: ch03-b08
          speaker: musli
          text: >-
            I received ten villages for only four stones. Now I will gather enough to buy a kingdom. I will become a rajah and have wazirs of my own!
        - id: ch03-b09
          speaker: kahre
          text: >-
            Why stop at eight stones? There are enough here for twenty necklaces, and wealth means power!
        - id: ch03-b10
          speaker: narrator
          text: >-
            Greed and desire filled them all. Each man scrambled down from the tree and spread out his cloth. Then all four darted this way and that, picking up every precious stone they could reach. Even as they gathered the jewels, they kept looking over their shoulders. Each man wanted to know whether his neighbor was finding more than he was.
        - id: ch03-b11
          speaker: narrator
          text: >-
            They were so absorbed in collecting riches that dawn arrived without their noticing. Suddenly, the peepul tree lifted into the air and flew away. The four men could only stand on the shore and stare after it. Each still held a cloth weighed down with priceless jewels.
    - id: ch04
      title: Neither Dena nor Lena Remain
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Morning came to the city. At the palace, there was great alarm when the chamberlains reported that the rajah had gone out the evening before and had not returned. One of them tried to reassure the others.
        - id: ch04-b02
          speaker: chamberlain
          text: >-
            It will be all right. Wazir Musli will know where the rajah is, because he went with him.
        - id: ch04-b03
          speaker: narrator
          text: >-
            They went to Musli's house. There they learned that the wazir had also left the night before and had not come home.
        - id: ch04-b04
          speaker: wazirs_servant
          text: >-
            Lena the banker will know where he is. Musli went away with him.
        - id: ch04-b05
          speaker: narrator
          text: >-
            So they visited Lena's house. The banker had gone out the evening before, and he had not returned either.
        - id: ch04-b06
          speaker: bankers_porter
          text: >-
            Dena the oil-seller was with him. Dena should know where they are.
        - id: ch04-b07
          speaker: narrator
          text: >-
            At last they went to Dena's house. His wife met them with a flood of reproaches and wailing. Dena had left for Lena's house the evening before, and he too had never come home.
        - id: ch04-b08
          speaker: narrator
          text: >-
            They waited for the missing men, but they waited in vain. They searched for them, but the search was useless. Not one of those four unfortunate men ever returned to his home. All that remained was the confused account given by Dena's wife, and that was the only clue anyone ever found to what had become of them.
        - id: ch04-b09
          speaker: narrator
          text: >-
            To this day, when a greedy man in that country reaches for too much and loses everything, people have a saying.
        - id: ch04-b10
          speaker: narrator
          text: >-
            All has he lost! Neither Dena, nor Lena, nor Musli, nor Kahre remain.
        - id: ch04-b11
          speaker: narrator
          text: >-
            Yet not five people in a hundred know how that proverb began, or what it truly means.
