audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    dena:
      display_name: 德纳
      tts:
        delivery: 老实软弱，受窘时局促，起贪念时急切
        timbre: 朴实略显疲惫的成年男声
        pace: 适中
        pitch: 中
    dena_wife:
      display_name: 德纳的妻子
      tts:
        delivery: 直率泼辣，抱怨时又急又快
        timbre: 清亮粗粝的成年女声
        pace: 稍快
        pitch: 中高
    lena:
      display_name: 莱纳
      tts:
        delivery: 精明刻薄，盘算利益时压低声音
        timbre: 干脆偏尖的成年男声
        pace: 适中偏快
        pitch: 中高
    musli:
      display_name: 穆斯利
      tts:
        delivery: 官气十足，得意时矜持，受威胁时慌乱
        timbre: 浑厚圆润的成年男声
        pace: 适中
        pitch: 中低
    kahre:
      display_name: 卡赫尔国王
      tts:
        delivery: 威严任性，发怒时短促有力
        timbre: 洪亮沉实的成年男声
        pace: 适中
        pitch: 低
    rani:
      display_name: 王后
      tts:
        delivery: 娇纵执拗，哭求时夸张而急切
        timbre: 华丽明亮的成年女声
        pace: 稍快
        pitch: 中高
    palace_attendant:
      display_name: 王宫侍从
      tts:
        delivery: 谨慎恭敬，遇事慌张
        timbre: 清晰的年轻男声
        pace: 适中偏快
        pitch: 中
    musli_servant:
      display_name: 大臣府仆人
      tts:
        delivery: 恭顺克制，如实回话
        timbre: 朴实的成年男声
        pace: 适中
        pitch: 中
    lena_porter:
      display_name: 莱纳家的守门人
      tts:
        delivery: 谨慎本分，回答简短
        timbre: 略显苍老的男声
        pace: 稍缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 飞往海岸的菩提树
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，印度一座城里住着穷油贩德纳。他挣不到什么钱，手里偶尔有几个子儿，也总是留不住。故事开始时，他欠钱庄老板莱纳三百卢比。原本借的只有一百，可算上莱纳一向索取的利息，就成了三百。德纳的生意又糟得很，根本无力偿还。"
        - id: ch01-b02
          speaker: narrator
          text: "莱纳非常恼火，每天傍晚都找上门来责骂德纳。他还专挑德纳的妻子烧晚饭时闹。油贩夫妻和女儿被他搅得一点胃口也没有，常常一口饭都吃不下。几个星期过去，德纳再也忍受不了，决定逃走。可带着妻女不容易远走高飞，他便打算丢下她们。那天收工以后，他没有回家，只身溜出城外。至于该往哪里去，他心里根本没数。"
        - id: ch01-b03
          speaker: narrator
          text: "夜里大约十点，德纳来到路边一口井旁。井边长着一棵巨大的菩提树。他已经累坏了，便爬到树上，想先歇一夜，天亮再赶路。他在粗大的枝杈间蜷起身子，很快睡熟了。偏偏有些夜晚，精怪会在这种地方游荡。德纳睡着以后，一群精怪把整棵树拔起来，带着它飞向远方，最后落在一片杳无人烟的海岸。那时离日出还早得很。"
        - id: ch01-b04
          speaker: narrator
          text: "大树刚落下，德纳就醒了。他睁眼一看，周围哪里还有森林？眼前只有荒凉的海滩和望不到边的大海。他吓得呆住，一句话也说不出来。等他坐起身，勉强定下神来，四周渐渐出现了一点点闪烁的亮光，好像许多小火苗在移动。德纳看不出那是什么。后来，一点亮光靠得很近，他伸手抓住，才发现那是块红光闪闪的石头，只比核桃略小一些。"
        - id: ch01-b05
          speaker: narrator
          text: "德纳解开腰布一角，把石头包好。过了一会儿，他又捡到一块，接着是第三块和第四块，都仔细扎进腰布里。就在天快亮时，大树忽然升空，飞快地穿过长空，又落回前一晚的井边。德纳被这一番折腾吓得不轻。等他缓过神来，连忙感谢上天保住自己的性命。他再也不想流浪了，立刻返回城里，走回自己家。"
        - id: ch01-b06
          speaker: narrator
          text: "妻子迎面就是一顿痛骂，又质问，又数落，几乎不给他开口的机会。直到她停下来喘气，德纳才终于说出一句话。"
        - id: ch01-b07
          speaker: dena
          text: "我只说一件事。你先看看，我带回了什么！"
        - id: ch01-b08
          speaker: narrator
          text: "他关紧门窗，解开腰布，把四块石头拿给妻子看。石头在他手中翻来覆去，闪着灿烂的光。"
        - id: ch01-b09
          speaker: dena_wife
          text: "呸，几颗没用的石子！要是能吃，好歹还有点用。这种东西拿来做什么？"
        - id: ch01-b10
          speaker: narrator
          text: "妻子哼了一声，扭过头去。头天晚上，莱纳照例来找德纳吵闹，却发现债户不在家，便用一通威吓把她吓坏了。此刻他一听德纳回来，立刻堵在门口，扯开嗓子骂了好一阵。直到莱纳自己也骂累了，德纳才敢开口。"
        - id: ch01-b11
          speaker: dena
          text: "大人若肯屈尊进屋，我就把话说给您听。"
        - id: ch01-b12
          speaker: narrator
          text: "莱纳走进屋去。德纳再次关好所有门，解开腰布，让他看那四块光芒四射的大石头。"
        - id: ch01-b13
          speaker: dena
          text: "我全副身家只有这些，可以拿来抵债。大人也知道，我一个子儿都没有。不过，这些石头确实很漂亮。"
        - id: ch01-b14
          speaker: narrator
          text: "莱纳一眼就认出，那是四颗上好的红宝石，馋得心里直痒。可这种心思绝不能让德纳看出来。"
        - id: ch01-b15
          speaker: lena
          text: "谁稀罕你的破石头？我要的是钱，是你欠我的正经债！无论如何，我总会从你身上讨回来。不还钱，你就等着受罪吧。"
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: "德纳一句也答不上来。他双手合十，苦苦央求莱纳宽限几日，发发慈悲。最后，莱纳假装勉为其难，说与其让这笔债烂在手里，不如自己吃点亏，收下石头抵账。德纳感激得几乎哭出来。莱纳写下一张三百卢比的收据，再用布包起四颗宝石，塞进怀里，回家去了。"
    - id: ch02
      title: 四颗红宝石
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "莱纳一路走，一路盘算。"
        - id: ch02-b02
          speaker: lena
          text: "怎样才能把红宝石换成钱？这么贵重的东西，我可不敢留着。国王要是听到消息，多半会找个借口把我关进牢里，不但抢走宝石，连其他家产也一并拿走。可这买卖真划算！一百卢比，竟换来四颗足以赎回一位国王的宝石。我得小心，千万不能泄密。"
        - id: ch02-b03
          speaker: narrator
          text: "他很快有了主意，便换上最干净的衣裳，前往首席大臣穆斯利的府邸。得到私下拜见的机会以后，他取出四颗红宝石，摆在大臣面前。穆斯利望着华美的宝石，双眼也亮了。"
        - id: ch02-b04
          speaker: musli
          text: "果然是好东西。真正的价钱我出不起。不过，你若肯卖，四颗我出一万卢比。"
        - id: ch02-b05
          speaker: narrator
          text: "莱纳满心感激地答应下来。他交出宝石，换来一万卢比，匆匆赶回家去。一路上，他还在庆幸这笔买卖如此公道，让自己赚到惊人的利润。"
        - id: ch02-b06
          speaker: narrator
          text: "莱纳走后，穆斯利也开始盘算。他很快认定，最好的办法是把宝石献给卡赫尔国王。当天，他便赶到王宫，请求单独觐见。等身边只剩君臣二人，他取出四颗宝石，呈到国王面前。"
        - id: ch02-b07
          speaker: kahre
          text: "哎呀，这些宝石价值连城！你把它们献给我，做得很好。作为回报，我把十个村庄的税收赐给你和你的后人。"
          emotion: happy
        - id: ch02-b08
          speaker: narrator
          text: "穆斯利欣喜若狂，脸上却不敢显露，只向国王深深行礼。国王把红宝石收入头巾，他便喜气洋洋地离开了。一万卢比换来十个村庄，穆斯利觉得自己实在走运。国王也同样满意。他带着宝石走进后宫，拿给王后看。王后欢喜得几乎发狂，把它们拿在手中翻来覆去。"
        - id: ch02-b09
          speaker: rani
          text: "啊，要是再有八颗这样的宝石，串成的项链该多美！你再给我找八颗来，不然我就活不成了！"
        - id: ch02-b10
          speaker: kahre
          text: "你也太不讲理！这样的宝石，我到哪里再找八颗？这四颗已经花了我十个村庄，你还不满足！"
          emotion: angry
        - id: ch02-b11
          speaker: rani
          text: "那又怎么样？难道你想让我死吗？既然这些宝石有来处，你当然还能从那里再弄到几颗。"
        - id: ch02-b12
          speaker: narrator
          text: "王后说完便又哭又闹。国王只得答应，第二天就想办法再找些红宝石。只要她耐心等待，一定会得到想要的东西。"
        - id: ch02-b13
          speaker: narrator
          text: "次日早晨，国王召来穆斯利，命他无论如何再弄到八颗与昨日相同的红宝石。国王正憋着一肚子火，话说得毫不客气。"
        - id: ch02-b14
          speaker: kahre
          text: "你要是弄不到，我就绞死你！"
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: "可怜的穆斯利再三申辩，说自己根本不知道去哪里寻找。国王一句也不肯听。"
        - id: ch02-b16
          speaker: kahre
          text: "你非弄到不可！王后不能因为少几颗红宝石就活不成。到原来的地方再找些来！"
          emotion: angry
        - id: ch02-b17
          speaker: narrator
          text: "穆斯利忧心忡忡地离开王宫，命奴仆把莱纳带来。钱庄老板刚一出现，他便下了命令。"
        - id: ch02-b18
          speaker: musli
          text: "再给我弄八颗和昨天一样的红宝石。要八颗，而且越快越好，不然我的命就没了！"
          emotion: fearful
        - id: ch02-b19
          speaker: lena
          text: "可我上哪儿弄去？这样的红宝石又不会长在灌木丛上！"
          emotion: fearful
        - id: ch02-b20
          speaker: musli
          text: "原来那些宝石，你是从哪里弄来的？"
        - id: ch02-b21
          speaker: lena
          text: "是油贩德纳给我的。"
        - id: ch02-b22
          speaker: musli
          text: "那就把他叫来，问问他是从哪里弄来的。我可不愿为了二十个德纳送命！"
        - id: ch02-b23
          speaker: narrator
          text: "穆斯利又派出奴仆去传唤德纳。德纳来到以后，几个人仔细盘问了他一番，随后一同进宫。到了国王面前，德纳把整件事从头到尾讲了一遍。"
        - id: ch02-b24
          speaker: kahre
          text: "你是哪一晚睡在菩提树上的？"
        - id: ch02-b25
          speaker: dena
          text: "我记不得了，不过我妻子一定知道。"
        - id: ch02-b26
          speaker: narrator
          text: "于是，德纳的妻子也被传来。她说，那天正是上一个朔月的星期日。谁都知道，朔月逢星期日，精怪就格外有力量捉弄凡人。国王用死刑威胁众人，不许他们向外人泄露一个字。接着他宣布，等到下一个朔月的星期日，卡赫尔、穆斯利、莱纳和德纳四人要一起坐到那棵菩提树上，看看到底会发生什么。"
    - id: ch03
      title: 贪心的四个人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "等待的日子过得慢极了。约定的星期日终于到来。当晚，四个人秘密会合，一同走进森林。没走多远，他们便来到菩提树下，照国王的安排爬到树上。午夜时分，大树开始摇晃，不久便腾空而起。"
        - id: ch03-b02
          speaker: dena
          text: "陛下快看，这棵树真的飞起来了！"
          emotion: surprised
        - id: ch03-b03
          speaker: kahre
          text: "是，是，你说的都是真话。安静坐好，我们看看接下来会怎样。"
        - id: ch03-b04
          speaker: narrator
          text: "大树越飞越远。四个人紧紧抓着树枝，最后落在那片荒凉的海岸。浩瀚的大海翻滚着波涛，一阵阵扑上空寂的沙滩。过了一会儿，四周又出现了点点微光，像小火苗一样闪烁。德纳看着那些光，先打起了主意。"
        - id: ch03-b05
          speaker: dena
          text: "上回我只拿到身边的四颗石头，就还清了所有债。这次能拿多少，我就拿多少。我也要做个有钱人！"
        - id: ch03-b06
          speaker: narrator
          text: "莱纳也在暗自盘算。"
        - id: ch03-b07
          speaker: lena
          text: "四颗石头就卖了一万卢比。这一回，我要为自己捡四十颗。有了那么多钱，他们说不定至少会让我当个大臣！"
        - id: ch03-b08
          speaker: narrator
          text: "穆斯利心里的念头更大。"
        - id: ch03-b09
          speaker: musli
          text: "四颗石头让我得到十个村庄。现在我要捡够宝石，买下一整个王国。等我当了国王，也任命一群大臣来听我使唤！"
        - id: ch03-b10
          speaker: narrator
          text: "卡赫尔国王同样没有满足。"
        - id: ch03-b11
          speaker: kahre
          text: "只拿八颗有什么意思？这里的宝石足够做二十条项链。财富越多，权力也就越大！"
        - id: ch03-b12
          speaker: narrator
          text: "四个人满心都是贪欲，争先恐后地爬下大树。他们各自铺开衣布，四处奔忙，拼命捡拾珍贵的宝石，还不停回头张望，生怕别人拿得更多。他们只顾搜罗财富，连黎明已经到来都没有察觉。大树忽然升到空中，径直飞走了。四个人站在海岸上，只能眼睁睁看着它远去。他们每个人的衣布里，都沉甸甸地装满了价值连城的宝石。"
    - id: ch04
      title: 一个流传至今的说法
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "城里天色渐渐亮了。王宫的侍从发现，国王前一晚出了门，到现在还没回来。宫中顿时乱作一团。"
        - id: ch04-b02
          speaker: palace_attendant
          text: "啊，没关系！穆斯利大臣一定知道陛下在哪里。昨晚陪陛下出去的就是他。"
        - id: ch04-b03
          speaker: narrator
          text: "众人赶到大臣府上，却得知穆斯利前一晚离家后也没有回来。"
        - id: ch04-b04
          speaker: musli_servant
          text: "钱庄老板莱纳一定知道大人去了哪里，因为穆斯利大人正是跟他一起走的。"
        - id: ch04-b05
          speaker: narrator
          text: "他们又来到莱纳家，才知道钱庄老板前一晚出门以后，同样没有回来。"
        - id: ch04-b06
          speaker: lena_porter
          text: "莱纳老爷当时和油贩德纳在一起。德纳一定知道他们去了哪里。"
        - id: ch04-b07
          speaker: narrator
          text: "于是众人赶去德纳家。德纳的妻子迎面便是一阵责骂和哭号，因为丈夫前一晚去了莱纳家，也一直没有回来。大家苦苦等待，又四处寻找，却始终一无所获。那四个不幸的人，从此再也没有回家。关于他们究竟遭遇了什么，唯一的线索，只有德纳妻子那番混乱不清的讲述。"
        - id: ch04-b08
          speaker: narrator
          text: "直到今天，在那个国家里，要是一个贪心的人索取得太多，反而把一切都丢了，人们便会说这样一句话。"
        - id: ch04-b09
          speaker: narrator
          text: "全都没了！德纳没了，莱纳没了，穆斯利没了，卡赫尔也没了。可每一百个人里，还没有五个人知道这句话从何而来，又到底是什么意思。"
        - id: ch04-b10
          speaker: narrator
          text: "这个故事由费罗兹普尔的坎贝尔少校记录。"
