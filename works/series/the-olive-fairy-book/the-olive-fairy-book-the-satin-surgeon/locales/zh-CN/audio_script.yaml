audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    emperor:
      display_name: 皇帝
      tts:
        delivery: 年轻坦率，深情而勇敢，受伤后带着克制的忧郁
        timbre: 清朗端正的年轻男声
        pace: 适中
        pitch: 中
    younger_princess:
      display_name: 小公主
      tts:
        delivery: 温柔聪慧，身处险境仍坚定沉着
        timbre: 清澈柔美的年轻女声
        pace: 稍缓
        pitch: 中高
    love:
      display_name: 爱神
      tts:
        delivery: 顽皮自信，说话轻巧又带着神秘意味
        timbre: 明亮稚嫩的男童声
        pace: 轻快
        pitch: 高
    citizen_1:
      display_name: 市民甲
      tts:
        delivery: 兴奋响亮，充满期待
        timbre: 明朗的成年男声
        pace: 稍快
        pitch: 中
    citizen_2:
      display_name: 市民乙
      tts:
        delivery: 兴奋响亮，充满好奇
        timbre: 清亮的成年女声
        pace: 稍快
        pitch: 中高
    soldier:
      display_name: 士兵
      tts:
        delivery: 洪亮热烈，语气爽直
        timbre: 结实的年轻男声
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 两位公主与一桩求婚
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位富甲天下、权势无边的国王。他结过几次婚，却只有两个女儿。大公主斜眼驼背，相貌很不好看，可她聪明风趣，很会讨父王欢心。哪怕她心肠恶毒，又爱撒谎，国王仍把她当作掌上明珠。小公主正好相反。她容貌秀美，性情温柔，熟悉她的人都说不准，究竟是她的脸更动人，还是她和善可亲的举止更迷人。
        - id: ch01-b02
          speaker: narrator
          text: 邻国有位年轻的皇帝，才二十出头，作战却十分勇敢。只要他愿意，或许真能征服天下。幸好他爱和平，不爱战争，只把心思放在如何英明妥善地治理自己的国家上。臣民们盼着他早日成婚，而年龄、身份都相称的贵族小姐，听来只有国王的两个女儿。皇帝便派使臣前去，向其中一位求婚。不过，他决意只娶一个自己真心爱慕、能够幸福相守的人，所以还要亲自看看，才肯作出选择。
        - id: ch01-b03
          speaker: narrator
          text: 使臣出发后不久，他瞒住所有人，乔装赶往国王的宫廷，结果还是迟了一步。使臣不知道他的打算，已经替他向大公主求了婚。他这才明白，自己把计划藏得密不透风，实在愚蠢。其实，皇帝的身份很快便泄露了。国王表面装作一无所知，暗中却按君王的礼节盛情准备起来。最后，众人商定由使臣把主人说成一位王子，以这个身份将他引见。
        - id: ch01-b04
          speaker: narrator
          text: 当晚，宫中举行盛大舞会。皇帝见到大公主那副模样，又听见她刻薄的话，心里厌恶极了。就算她有十个王国，他也不肯娶。小公主的容貌和举止却深深迷住了他。哪怕她只是个牧羊女，他也愿意和她共享皇位。
        - id: ch01-b05
          speaker: narrator
          text: 接下来的几天，皇帝所见所闻的一切，都让他越发爱慕小公主。他尽力对姐姐保持礼貌，也想给她身份所应得的殷勤，可心意实在藏不住。最后，他坦白说，最大的愿望就是娶妹妹为妻，只盼她和父王答应。他还叫使臣把辞行觐见一再推迟，希望国王自己看出端倪。等到再也拖不下去时，他才正式命他们向小公主求婚。
        - id: ch01-b06
          speaker: narrator
          text: 这消息和国王原先的期待完全不同，他听了几乎压不住怒火。他一向偏爱长女，又事事受她摆布。觐见刚结束，他就把皇帝竟敢向妹妹求婚的“无礼举动”告诉大公主。大公主比父亲还愤怒。父女俩决定把妹妹送到远方，不让皇帝找到。可是该送到哪里，他们一时也没主意。两人绞尽脑汁，终于选中一座孤零零的荒原塔，认定那里是一座安全的牢笼。
        - id: ch01-b07
          speaker: narrator
          text: 为了不露声色，宫里的宴会照旧举行，各种华丽的庆典也照常筹办。小公主被带走的那天，整个宫廷都受邀参加一场盛大的森林狩猎。皇帝和公主原先一直数着时辰，盼这个愉快的清晨早些到来。可皇帝随国王来到会合处，却怎么也看不见她。他焦急地四处张望，连国王的话都听不进去。狩猎开始后，她仍没出现。皇帝拒绝随行，找了她整整一天，最后还是空手而归。
        - id: ch01-b08
          speaker: narrator
          text: 一名侍从告诉他，几小时前，自己见过公主的马车。车子两旁全是护送的士兵，谁也无法靠近，更别说和公主交谈。他一路远远跟随，看见车停在荒原塔前，后来车子返回时，里面已经空了。皇帝听罢悲痛万分，立刻离开宫廷。他命使臣第二天宣战，除非国王答应释放公主。回国后，他马上召集一支大军，趁敌人还来不及集结兵马，夺下了边境城镇。
        - id: ch01-b09
          speaker: narrator
          text: 离开之前，皇帝还写了一封信，请心爱的公主耐心等待，相信他一定会救她。他把信交给最宠信的掌马官，因为此人愿意为他舍命。
    - id: ch02
      title: 荒原塔下的陷阱
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 掌马官小心探查荒原塔，终于找到公主住的房间。那里有一扇小窗，窗外是一片长满荆棘的荒地。可看守公主的是大公主从前的乳母。她仿佛从不合眼，时时守在公主身边，连最轻微的动作也不放过。公主想靠近唯一的窗子透口气都不成。
        - id: ch02-b02
          speaker: narrator
          text: 一天，老妇人难得独自在房里给大公主写禀报。公主立刻探身窗外，看见灌木中藏着一个人。那人走出来，从衣中举起一封信。她认出这是皇帝的侍从，赶紧放下一根长绳。掌马官把信系好，她飞快地拉上来。看守写完信、走进房间时，她恰好已经读完。
        - id: ch02-b03
          speaker: narrator
          text: 第二天，公主设法从记事本撕下一页，写好回信，扔给掌马官。掌马官赶忙把信送回主人手中。皇帝终于得到心爱之人的消息，欢喜得不顾一切，哪怕只能见她片刻，也一定要亲自前往。他让掌马官先去征求公主的意见。公主当然愿意见他，却担心看守太过警觉。他只有趁老妇人独自在房中写信的短短一会儿赶来，才可能不白跑一趟。
        - id: ch02-b04
          speaker: narrator
          text: 困难反而让皇帝更加急切。他愿意冒任何风险，掌马官却劝他智取，不要硬闯。于是他在下一封信里附上一包安眠药，公主设法混进看守的晚饭。傍晚，皇帝来到塔下，发出约定的信号。公主不再害怕看守，放心地出现在窗口，两人愉快地谈了很久。他们分别时还满怀希望，以为相会无人察觉。其实老妇人根本没睡，任何安眠药都骗不过她警觉的眼睛。她看见、听见了一切，马上写信禀报给大公主。
        - id: ch02-b05
          speaker: narrator
          text: 恶毒的小驼子气得发狂，决意狠狠报复皇帝对自己的轻蔑。她让乳母继续装作什么也没看见，又暗中命人造好一副机关，藏进塔脚的荆棘。只要皇帝拨开枝条往里走，机关就会像捕鼠器一样夹住他，同时射出许多毒箭，把他全身刺穿。机关布置妥当时，没有惊动小公主，她对危险毫不知情。
        - id: ch02-b06
          speaker: narrator
          text: 当晚，皇帝急匆匆来到塔下。还没走近，他便听见公主发出一阵欢快的笑声。他正要发信号，脚下忽然踩中机关。尖锐的疼痛猛然穿过身体，他顿时脸色煞白。幸亏机关只张开一点，仅有几支毒箭射出。皇帝摇晃几下，浑身是血地倒在地上。
        - id: ch02-b07
          speaker: narrator
          text: 若是独自前来，他很快就会死去。幸好忠心的侍从就在近旁，把他抱到树林里。其他随从包扎伤口，砍下树枝搭成担架。皇帝几乎失去知觉，被众人抬出敌国，送回自己的宫殿。
        - id: ch02-b08
          speaker: narrator
          text: 塔里的公主一直不安。先前，她逗弄一只宠爱的小猴子。猴子扮出滑稽鬼脸，她虽然满怀忧愁，仍忍不住放声大笑。皇帝听见的就是这笑声。可她越等越久，始终没有等到信号。原本应该熟睡的看守忽然命她马上上床，她若不是害怕，几乎就要反抗了。
        - id: ch02-b09
          speaker: narrator
          text: 两个星期过去，公主在忧虑中日渐消瘦。一天早晨，乳母又去写每日的禀报，却把钥匙留在门上。公主悄悄转动钥匙，把她反锁在里面。老妇人写完信，要起身寻找公主时，才发现自己出不来了。
        - id: ch02-b10
          speaker: narrator
          text: 一恢复自由，公主便奔到窗前。她看见染血的荆棘间散落着一支支箭，顿时吓得心神俱乱。她溜下楼梯，逃出高塔，沿小路跑了很久，万幸遇见了自己乳母的丈夫。那人刚刚得知公主被囚禁，正赶来看看能不能为她效劳。公主请他去找一套男装，自己躲在附近的小树林里等候。好心人终于有机会帮助她，简直喜出望外。
        - id: ch02-b11
          speaker: narrator
          text: 好心人立刻赶到最近的城镇，很快找到一家店铺。宫廷里的仆役常把主人不要的旧衣拿到那里出售。他从店中买来一套男装，衣料十分华贵，上面还缀满宝石。公主马上换好，把自己的衣服装进袋子，让仆人背在肩上。两人就这样上路了。他们都没想到，前面的旅程会比预料中漫长许多。
    - id: ch03
      title: 爱神的药膏
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 白天，只要公主的体力还能支撑，两人便尽可能多赶些路，夜里只能睡在露天下。一天傍晚，他们停在一处秀美的山谷，身旁有溪水潺潺流过。快到清晨时，公主被一个悦耳的声音唤醒。那人正在唱歌，唱的竟是她儿时熟悉的一支曲子。她急着找出歌声从哪里来，便独自朝一丛香桃木走去。
        - id: ch03-b02
          speaker: narrator
          text: 她循声走向一丛香桃木，看见一个小男孩背着箭囊，手握象牙弓，一面整理箭羽，一面低声唱歌。
        - id: ch03-b03
          speaker: love
          text: 看见我睁着眼睛，你很惊讶吗？我可不是永远都瞎着。有时候，我最好先看清哪一颗心该被射中。你和皇帝相遇那天，箭正是我放的。既然伤是我造成的，我就该找来治伤的药！
        - id: ch03-b04
          speaker: narrator
          text: 男孩给她一只小瓶，里面装着神奇的药膏，让她找到皇帝后敷在他的伤口上。
        - id: ch03-b05
          speaker: love
          text: 再走两天，你就能到他的宫殿。别耽搁，有时候，时间就是生命。
        - id: ch03-b06
          speaker: narrator
          text: 公主含着眼泪向男孩道谢，赶紧叫醒向导，两人立刻出发。果然，两天后，城中的高塔和城墙出现在远处。想到马上就能和皇帝面对面，她的心跳得飞快。可一打听病情，她才惊恐地知道，他的生命正在飞快流逝。那一瞬间，公主悲痛得险些暴露身份。随后，她鼓起全部勇气，宣称自己是一名医生。只要众人让她照料皇帝几天，她保证能把人治好。
        - id: ch03-b07
          speaker: narrator
          text: 为了在宫廷中显得体面，这位新医生决定做一整套浅蓝色缎衣。她买来店铺里最华贵、最绚丽的料子，请来一名裁缝，还答应只要两小时内完工，就付给他双倍工钱。接着，她又去集市买下一头健壮漂亮的骡子，命仆人用同样的浅蓝色缎带装饰鞍辔。一切都得配得上那位声名显赫的新医生。
        - id: ch03-b08
          speaker: narrator
          text: 准备期间，公主得知房东的表亲恰好是皇帝的贴身男仆。她便请房东逢人就说，有位著名的外科医生听闻皇帝病重，特意赶来救治。他保证让陛下完全康复，若是失败，甘愿被活活烧死。
        - id: ch03-b09
          speaker: narrator
          text: 这位善良的房东最爱听点闲话，也最爱传点闲话，马上带着消息赶去宫中。故事经她一说，不但没有缺少什么，反而变得更加惊人。御医们听说来了个陌生医生，全都嗤之以鼻。皇帝的侍从们却觉得，他们用尽各种药方，陛下仍在众人眼前日渐垂危，再请这个陌生人看看，也不会更坏。
        - id: ch03-b10
          speaker: narrator
          text: 宫廷总管请年轻医生马上进宫。公主立即骑上骡子出发。百姓和士兵看见那身耀眼的浅蓝缎衣，纷纷高喊起来。
        - id: ch03-b11
          speakers: [citizen_1, citizen_2, soldier]
          ensemble: chorus
          text: 缎衣神医来了！快看缎衣神医！缎衣神医万岁！
        - id: ch03-b12
          speaker: narrator
          text: 她抵达宫门时，通报的人也用了“缎衣神医”这个名号，随后马上把她领进濒死病人的寝室。皇帝闭着眼躺在床上，脸和枕头一样白。他一听见新医生的声音，便睁眼微笑，又抬手示意她留在身边。神医深深行礼，保证能够治愈皇帝，却坚持让所有人离开，只留下那位最宠信的掌马官。她将爱神给的魔药敷上伤口。皇帝的疼痛很快减轻，那一夜睡得十分安稳。
    - id: ch04
      title: 缎衣神医
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 天刚亮，群臣和御医便匆匆赶到皇帝的寝室。他们原以为会看见一个垂危的病人，没想到皇帝已经不再疼痛，全都惊讶极了。缎衣神医不肯让他们妨碍治疗，马上又把所有人赶出去，重新为皇帝敷药。药膏再次显出奇效。到了第二天早晨，皇帝几乎痊愈，已经能够离开病床。
        - id: ch04-b02
          speaker: narrator
          text: 可身体越强健，他的心情反倒越低沉。他越来越常想起自己为什么受伤。新医生的面容与声音，又一次次让他想到小公主。在他的想象中，正是公主背叛了自己，故意让他落入陷阱，害他遭受那些可怕的折磨。明明仍深爱着她，却又相信她如此残酷。这个念头令他再也无法忍受，眼中渐渐充满泪水。
        - id: ch04-b03
          speaker: narrator
          text: 神医看出病人的悲伤，便尽其所能，用轻快的谈吐和有趣的故事逗他振作。她终于赢得皇帝的信任，听他讲出了全部心事。他爱着一位小姐，对方残酷地伤害了他，让他受尽折磨。可无论发生什么，他还是无法停止爱她。身体上的箭伤快要愈合了，这颗心上的伤却仍旧留着。
        - id: ch04-b04
          speaker: narrator
          text: 缎衣神医同情地听完，耐心劝他说，事情也许不是表面看来的样子，公主未必真有那么多过错。皇帝急切地想相信这些话，因为他始终放不下心爱的人。可眼前的证据又让他迟疑。神医只好一次次开解，用了很久，才终于让他相信公主或许没有背叛自己。
        - id: ch04-b05
          speaker: narrator
          text: 终于有一天，皇帝几乎完全康复。医生最后一次用珍贵的药膏敷好伤口。随后，两人都感到一种说不出的疲惫，各自沉沉睡去，一睡便是几个钟头。
        - id: ch04-b06
          speaker: narrator
          text: 第二天一早，公主重新穿上带来的女装，仔细梳妆，戴好全部珠宝，让自己显得更加美丽。她刚刚收拾妥当，皇帝便醒了。他觉得身体强健舒畅，还以为自己在做梦。看见公主拉开床帘时，他更不敢相信眼前的一切是真的。
        - id: ch04-b07
          speaker: narrator
          text: 两人凝望了好几分钟，谁也说不出话，只能断断续续地发出喜悦与感激的低叹。过了一会儿，公主才把荒原塔分别后的所有经历一一告诉他。从自己如何发现血迹和毒箭，如何逃出高塔，到怎样遇见爱神、得到药膏，又怎样乔装成医生前来救治，她全都说了。皇帝虽然身体虚弱，仍扑倒在她脚边，发誓永远爱她，永远感激她。那一刻，他眼里只有失而复得的公主，全然忘了宫中侍从和御医还等在前厅，盼着他召见。
    - id: ch05
      title: 两个王国合而为一
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 皇帝急着让众人知道自己欠缎衣神医多大一份恩情，便亲手打开房门。大家见他恢复得这样完好，又惊又喜。廷臣们果然十分称职，赶紧涌进来，争着赞美神医的奇妙本领，还要向他连声道贺。可是他们很快发现，那位身穿浅蓝缎衣的年轻医生已经消失了。原来神医站立的地方，如今竟站着全世界最美丽的公主。众人惊讶得几乎说不出话。
        - id: ch05-b02
          speaker: emperor
          text: 你们感谢神医救了我的性命时，也该向你们的皇后行礼。
          emotion: happy
        - id: ch05-b03
          speaker: narrator
          text: 皇帝恨不得当天就举行婚礼。公主却坚持，自己必须先得到父王允许，不能就这样成婚。于是，几名信使立刻动身赶往邻国都城，又很快带着国王的应允归来。原来国王不久前终于查清，大女儿究竟闯下了多少祸，也明白小女儿承受了怎样的委屈。
        - id: ch05-b04
          speaker: narrator
          text: 恶毒的大公主眼看所有阴谋全都失败，气得卧床不起，最后在一阵暴怒与嫉妒中死去。她死后，没有一个人肯为她哀悼。国王也早已厌倦治理国家带来的种种辛劳，便摘下自己的王冠，把王位交给小女儿。从此，两个王国合而为一。
        - id: ch05-b05
          speaker: narrator
          text: 这个故事选自《仙女宝库》。
