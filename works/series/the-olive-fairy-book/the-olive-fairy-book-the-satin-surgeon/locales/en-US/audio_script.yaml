  chapters:
    - id: ch01
      title: The Emperor Chooses
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a rich and powerful king who had married several times, yet had only two daughters. His elder daughter squinted and had a crooked back. She was clever and amusing, but she was also spiteful and dishonest. Even so, she was her father's favorite.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The younger princess was lovely and sweet-natured. Those who knew her could hardly decide whether her face or her gentle manner was more charming.
        - id: ch01-b03
          speaker: narrator
          text: >-
            A young emperor ruled the neighboring country. Though barely twenty, he had already shown great courage in battle. He might have conquered the world if he had wanted to, but he preferred peace. He spent his time trying to govern his own people wisely.
        - id: ch01-b04
          speaker: narrator
          text: >-
            His people wanted him to marry. Since the two princesses were the only suitable women anyone knew of, he sent ambassadors to ask their father for one daughter's hand. But the emperor meant to marry only someone he could love and live happily with. Soon after his ambassadors left, he followed in disguise so that he could see the lady before deciding.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He had foolishly told no one about his plan. By the time he reached the palace, his ambassadors had already asked for the elder princess. His disguise did little good, for the court soon learned who he was. The king prepared a royal welcome while pretending not to know his guest's true identity. Everyone agreed that the ambassadors would present their emperor as one of the princes traveling with them, and the king received him under that name.
        - id: ch01-b06
          speaker: narrator
          text: >-
            That night, a grand ball gave the emperor his first chance to meet both sisters. The elder princess's cruel remarks displeased him so much that ten kingdoms could not have persuaded him to marry her. The younger sister's sweet face and gentle ways charmed him so deeply that he would have shared his throne with her even if she had been a shepherdess.
        - id: ch01-b07
          speaker: narrator
          text: >-
            He tried to hide his feelings and give the elder princess all the attention that courtesy required. It was difficult, though he did his best to remain polite. Over the next few days, everything he saw and heard made him love the younger sister more. At last he confessed that his dearest wish was to make her his wife, if both she and her father would grant it.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The emperor had delayed his ambassadors' farewell audience, hoping the king would notice where his heart lay. When they could wait no longer, he ordered them to ask for the younger princess in his name.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The king had expected a very different request. He adored his elder daughter and did whatever she wanted, so he could hardly contain his anger. As soon as the audience ended, he summoned her and told her that the emperor had dared to ask for her sister instead.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The elder princess was even more furious than her father. Together they decided to send the younger princess somewhere far beyond the emperor's reach. They struggled to choose a prison, then settled on a lonely castle called the Desert Tower. There, they believed, she would be perfectly secure.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Meanwhile, the court celebrations continued as if nothing were wrong. On the day chosen for the princess's abduction, the whole court was invited to a magnificent hunt in the forest.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The emperor and the younger princess had both counted the hours until that happy morning. The king and his guest arrived together, but the emperor could not find the lady he loved among the women. He watched for her so anxiously that he heard none of the king's conversation. When the hunt began without her, he refused to join it. He searched all day and found no trace of her.
        - id: ch01-b13
          speaker: narrator
          text: >-
            That evening, one of his attendants brought troubling news. Hours earlier, the man had passed the princess's carriage. Soldiers rode on both sides so no one could speak to her. He had followed at a distance and watched the carriage stop at the Desert Tower. When it came back, it was empty.
        - id: ch01-b14
          speaker: equerry
          text: >-
            Your Majesty, the soldiers took the princess into the Desert Tower. Her carriage returned without her.
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: >-
            The emperor was overwhelmed with grief. He left the court at once and ordered his ambassadors to deliver a warning the very next day. Unless the king promised to free the princess, war would begin. As soon as the emperor reached his own country, he raised a great army. He moved so quickly that he seized the frontier towns before his enemy had time to gather any troops.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Before leaving, however, he wrote to the princess. He begged her to be patient and trust him. He placed the letter in the hands of his favorite equerry, a servant he knew would give his life for him.
    - id: ch02
      title: The Trap at the Desert Tower
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The equerry carefully explored the land around the tower. At last he discovered the princess's room. Its one small window overlooked a deserted patch thick with brambles.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The princess was not even allowed to breathe the air at that window. Her keeper was the elder sister's former nurse, a woman whose watchful eyes seemed never to sleep. She stayed beside the prisoner every moment and noticed her slightest movement.
        - id: ch02-b03
          speaker: narrator
          text: >-
            One day, the old nurse went into her own room to write a report for the elder princess. The prisoner quickly leaned out of the window. A man hidden among the bushes stepped forward and held up a letter from inside his coat. She recognized one of the emperor's attendants at once.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The princess lowered a long string, and the equerry tied the letter to it. She pulled it up as quickly as she could. She had just enough time to read it before her keeper finished the report and returned.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The letter filled her with joy. The next day she found a chance to write an answer on a page from her notebook. She threw it down to the waiting equerry, who hurried back to his master. The emperor was so happy to hear from the princess that he resolved to visit the Desert Tower himself. Whatever the danger, he had to see her, even if it was only for a moment.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Through the equerry, he asked whether he might come. The princess answered that seeing him would bring her great joy. But with her keeper watching so closely, his journey would be useless unless he came during the short time when the old woman wrote alone in her room.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Difficulties only made the emperor more determined. He would have risked anything, but his equerry advised cunning instead of force. The emperor enclosed a sleeping powder in his next letter, and the princess slipped it into her keeper's supper.
        - id: ch02-b08
          speaker: narrator
          text: >-
            That evening, the emperor reached the tower and gave his signal. The sleeping powder seemed to have done its work, so the princess came fearlessly to the window. For a long and delightful while, they talked together across the distance below. At last they parted, full of hope that no one had seen their meeting.
        - id: ch02-b09
          speaker: narrator
          text: >-
            They were sadly mistaken. No sleeping powder could defeat the old nurse's watchful eyes. She had seen and heard everything, and she promptly reported it to her mistress.
        - id: ch02-b10
          speaker: narrator
          text: >-
            The elder princess flew into a rage. She meant to take a cruel revenge for the contempt the emperor had shown her. She told the nurse to pretend that she noticed nothing whenever another meeting took place. Meanwhile, she had a trap built among the brambles below the tower. If the emperor pushed through them, it would catch him like a mouse and release a shower of poisoned arrows to pierce him. The trap was hidden without the younger princess seeing it.
        - id: ch02-b11
          speaker: narrator
          text: >-
            That same evening, the emperor hurried toward the tower. As he drew near, he heard the princess give a long, joyful laugh. He rushed forward to make their usual signal. Then his foot struck something hidden.
        - id: ch02-b12
          speaker: narrator
          text: >-
            A sharp, burning pain shot through him. His face went white and he grew faint. Luckily, the trap opened only partway, so only a few arrows flew. The emperor staggered, then fell bleeding to the ground.
        - id: ch02-b13
          speaker: narrator
          text: >-
            He would soon have died if he had come alone. His faithful squire was nearby and carried him away from the trap to the wood, where the rest of his escort waited. They bound his wounds and cut poles to make a rough litter. Then they lifted their almost unconscious emperor onto it and bore him out of the enemy country, all the way back to his own palace.
        - id: ch02-b14
          speaker: narrator
          text: >-
            Up in the tower, the princess waited anxiously. Before the meeting, her little pet monkey had made such comical faces that she had laughed in spite of all her troubles. That was the laugh the emperor had heard. But his signal never came. As the hours passed, she grew restless. She nearly rebelled when the keeper, whom she believed asleep, ordered her straight to bed.
        - id: ch02-b15
          speaker: narrator
          text: >-
            Two weeks passed. The princess knew nothing of the emperor's fate, and the uncertainty left her thin and weak. Then one morning, the nurse went to her room to write the usual report and carelessly left the key in the door. The princess noticed. She turned the key so swiftly and quietly that the nurse did not discover she was locked in until her letter was finished.
        - id: ch02-b16
          speaker: narrator
          text: >-
            Free at last, the princess ran to the window. Among the bloodstained brambles below, she saw the scattered arrows. Horrified by what they revealed, she slipped down the stairs and out of the tower. She ran along a path until good fortune brought her face to face with her own nurse's husband. He had only just learned of her imprisonment and was on his way to discover whether he could help her.
        - id: ch02-b17
          speaker: narrator
          text: >-
            The princess begged him to find men's clothing while she hid in a nearby wood. Delighted to serve her, the good man hurried to the nearest town. There he found a shop where court servants sold their masters' discarded clothes.
        - id: ch02-b18
          speaker: narrator
          text: >-
            The clothes he brought were made of rich cloth and covered with jewels. The princess put them on at once. She packed her own garments into a bag, which her servant carried over his shoulder, and together they began their journey.
    - id: ch03
      title: The Little Archer's Gift
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The journey took longer than either traveler expected. Each day they walked as far as the princess could manage. Each night they slept outdoors. One evening they rested in a lovely valley where a rippling stream ran through the grass.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Near morning, the princess awoke to a beautiful voice singing a song from her childhood. She followed the sound to a thicket of myrtle. There sat a little boy with a quiver on his back and an ivory bow in his hand. He sang softly while smoothing the feathers on his arrows.
        - id: ch03-b03
          speaker: cupid
          text: >-
            Does it surprise you that my eyes are open? I am not always blind. Sometimes I must see exactly which heart needs my arrow. I sent my darts flying on the day you met the emperor. Since I made the wound, I must also find the cure.
        - id: ch03-b04
          speaker: narrator
          text: >-
            He gave her a small bottle filled with a wonderful salve and told her to put it on the emperor's wounds when she found him.
        - id: ch03-b05
          speaker: cupid
          text: >-
            You can reach his palace in two days. Hurry, because sometimes time itself is life.
        - id: ch03-b06
          speaker: narrator
          text: >-
            With tears in her eyes, the princess thanked the boy. She woke her guide, and they set off at once.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Just as the little archer had promised, two days brought the city's towers and walls into view. The princess's heart beat wildly at the thought that she would soon stand face to face with the emperor. Then she asked about his health and learned with horror that he was growing weaker and was now close to death.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Grief nearly made her reveal herself. She gathered her courage in time and announced that she was a doctor. If the emperor were left in her care for a few days, she promised to cure him.
        - id: ch03-b09
          speaker: narrator
          text: >-
            The new doctor needed to make an impressive appearance at court. She bought the richest and most splendid pale blue satin in the shops, then ordered a complete suit from it. She promised the tailor twice his usual price if he could finish the work in two hours. Next she went to the market, chose a fine mule, and told her servant to have its harness decorated with pale blue satin too.
        - id: ch03-b10
          speaker: narrator
          text: >-
            While everything was prepared, the princess questioned the woman in whose house she was staying. Did the woman know anyone who served the emperor? To the princess's delight, the woman's cousin was his chief valet.
        - id: ch03-b11
          speaker: narrator
          text: >-
            The disguised doctor asked the woman to spread the news. A famous surgeon had heard of the emperor's illness and hurried to save him. The surgeon promised a complete cure and was willing to be burned alive if he failed.
        - id: ch03-b12
          speaker: narrator
          text: >-
            The good woman loved nothing better than gossip, and she hurried to the palace with the news. Her tale grew even grander as she passed it on. The court physicians were scornful of an unknown surgeon who made such an astonishing promise. But the emperor's attendants pointed out that every remedy used so far had failed. Their master was dying before their eyes, so consulting this stranger could do no harm.
        - id: ch03-b13
          speaker: narrator
          text: >-
            The lord chamberlain sent an urgent request for the young doctor to come at once. The answer came back immediately.
        - id: ch03-b14
          speaker: younger_princess
          text: >-
            Tell the lord chamberlain that I will present myself at the palace without delay.
        - id: ch03-b15
          speaker: narrator
          text: >-
            The doctor mounted the mule and rode through the city. People and soldiers stared at the pale blue clothes and matching harness, then began to cheer.
        - id: ch03-b16
          speakers: [crowd_voice_1, crowd_voice_2, crowd_voice_3]
          ensemble: chorus
          text: >-
            Here comes the Satin Surgeon! Look, it is the Satin Surgeon! Long live the Satin Surgeon!
        - id: ch03-b17
          speaker: narrator
          text: >-
            That was the name used to announce the stranger at the palace. The Satin Surgeon was taken straight to the dying emperor's room.
    - id: ch04
      title: The Satin Surgeon
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The emperor lay with his eyes shut, his face as white as the pillow. The moment he heard the newcomer's voice, he opened his eyes and smiled. Then he motioned for the young doctor to stay beside him.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The Satin Surgeon bowed low and spoke with confidence.
        - id: ch04-b03
          speaker: younger_princess
          text: >-
            Your Majesty, I am certain I can cure you. But everyone must leave this room except your favorite equerry.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Once the room was cleared, the surgeon dressed the emperor's wounds with the little archer's magic salve. His pain eased so completely that he slept soundly through the night.
        - id: ch04-b05
          speaker: narrator
          text: >-
            At daybreak, the courtiers and doctors hurried to the emperor's chamber. They were amazed to find him entirely free from pain. The Satin Surgeon promptly ordered them all out again, then renewed the dressings with the wonderful salve. The second treatment worked so well that by the following morning the emperor was almost recovered and strong enough to leave his bed.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Yet as his body grew stronger, his spirits sank. The young doctor's face and voice reminded him of the princess. He believed she had betrayed him and caused his terrible suffering. The thought became more than he could bear, and tears filled his eyes.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The Satin Surgeon saw his sadness and tried to cheer him with pleasant talk and amusing stories. In time, the emperor trusted the doctor enough to tell the whole tale of his love. The lady had treated him cruelly, he said, but he still could not stop loving her.
        - id: ch04-b08
          speaker: emperor
          text: >-
            I believed she loved me. Then she led me into that dreadful trap. After all she has done, I still cannot drive her from my heart.
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: >-
            The Satin Surgeon listened with deep sympathy. Again and again, the doctor gently suggested that the princess might not be as guilty as everything made her appear. The emperor was eager to believe this, for he still loved her. Even so, it took a long while before he could be persuaded that the princess might be innocent.
        - id: ch04-b10
          speaker: younger_princess
          text: >-
            Perhaps there is more to her story than you know. She may not have chosen any of the things that happened at the tower.
        - id: ch04-b11
          speaker: narrator
          text: >-
            At last the day came when the emperor was nearly well. The doctor dressed his wounds one final time with the precious salve. Then patient and surgeon both felt exhausted by something neither could explain. They fell asleep and slept for hours.
    - id: ch05
      title: The Surgeon Revealed
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Early the next morning, the princess took her own clothes from the bag she had carried all this way. She dressed with great care and put on every jewel, making herself look as lovely as she could. She had just finished when the emperor awoke.
        - id: ch05-b02
          speaker: narrator
          text: >-
            He felt so strong and well that he wondered if he was dreaming. Then the princess drew back his curtains, and the sight of her made him doubt that he was awake at all.
        - id: ch05-b03
          speaker: narrator
          text: >-
            For several minutes they could only gaze at one another, unable to speak. Little gasps of joy and thankfulness were the first sounds they made. When words finally came, the princess told him the whole story of her adventures since their last meeting at the Desert Tower.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Though he was still weak, the emperor threw himself at her feet and poured out his love and gratitude. He completely forgot that the royal household and all the court physicians were waiting to be summoned from the next room.
        - id: ch05-b05
          speaker: narrator
          text: >-
            The emperor was eager to show everyone how much he owed to the Satin Surgeon. He went to the door and opened it himself. The people waiting outside cried out with surprise and joy when they saw him in perfect health. Like dutiful courtiers, they hurried into the room to praise and compliment the wonderful surgeon.
        - id: ch05-b06
          speaker: narrator
          text: >-
            But the Satin Surgeon had vanished. In the doctor's place stood the loveliest princess in the world. The emperor explained the mystery.
        - id: ch05-b07
          speaker: emperor
          text: >-
            As you thank the surgeon for this marvelous cure, you may also bow to your empress.
        - id: ch05-b08
          speaker: narrator
          text: >-
            He wanted their marriage celebrated that very day. The princess insisted that they must first ask her father's permission.
        - id: ch05-b09
          speaker: younger_princess
          text: >-
            We must wait until my father gives his consent.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Messengers were sent at once to the neighboring capital. They soon returned with the king's consent, for he had recently discovered all the harm his elder daughter had caused.
        - id: ch05-b11
          speaker: narrator
          text: >-
            The elder princess was so furious that her schemes had failed that she took to her bed and died in a fit of rage and jealousy. No one mourned her.
        - id: ch05-b12
          speaker: narrator
          text: >-
            The king had grown tired of the burdens of ruling. He gave his crown to his younger daughter, and from that time onward, the two kingdoms became one.
