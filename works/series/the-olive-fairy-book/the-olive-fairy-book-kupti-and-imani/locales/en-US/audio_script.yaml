  chapters:
    - id: ch01
      title: In Whose Hands?
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a king with two daughters, Kupti and Imani. He loved them dearly and often spent hours talking with them. One day, he turned to Kupti, the elder sister, with a question.
        - id: ch01-b02
          speaker: father_king
          text: Would you be content to leave your life and your fortune in my hands?
        - id: ch01-b03
          speaker: kupti
          text: Why, of course! Whose hands would I trust, if not yours?
          emotion: surprised
        - id: ch01-b04
          speaker: narrator
          text: Then the king put the same question to his younger daughter, Imani.
        - id: ch01-b05
          speaker: imani
          text: No, I would not. If I had the chance, I would make my own fortune.
        - id: ch01-b06
          speaker: narrator
          text: Her answer displeased the king greatly.
        - id: ch01-b07
          speaker: father_king
          text: You are too young to understand what you are saying. Still, you shall have the chance you want.
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: He summoned an old, lame fakir who lived in a crumbling hut at the edge of the city.
        - id: ch01-b09
          speaker: father_king
          text: You are old and nearly crippled. Surely you would welcome a young person to live with you and serve you. I shall send you my younger daughter. She wishes to earn her own living, and she may do it with you.
        - id: ch01-b10
          speaker: narrator
          text: The old fakir had no answer. Even if words came to him, he was far too astonished and troubled to speak them. Imani left with him smiling, and stepped along quite cheerfully while he hobbled home beside her in puzzled silence.
        - id: ch01-b11
          speaker: narrator
          text: As soon as they reached the hut, the fakir wondered how he could make a princess comfortable. But he was a poor fakir, after all. His bare home held only one bedstead, two old cooking pots, and a clay water jar. None of those things could provide much comfort. Imani soon ended his worrying.
        - id: ch01-b12
          speaker: imani
          text: Do you have any money?
        - id: ch01-b13
          speaker: old_fakir
          text: I think there is a penny somewhere.
        - id: ch01-b14
          speaker: imani
          text: Good. Give me the penny, then go and borrow a spinning wheel and a loom for me.
        - id: ch01-b15
          speaker: narrator
          text: After searching here and there, the fakir finally found his one penny and set out to borrow the tools. Imani went shopping. She spent one farthing on oil and the other three on flax. Back at the hut, she seated the old man on the bedstead and rubbed oil into his crippled leg for a full hour.
        - id: ch01-b16
          speaker: narrator
          text: Then she sat at the spinning wheel and worked through the whole night while he slept. By morning she had made the finest thread anyone had ever seen. She moved to the loom and wove until evening, when a beautiful silver cloth lay finished before her.
        - id: ch01-b17
          speaker: imani
          text: Take this cloth to the marketplace and sell it while I rest.
        - id: ch01-b18
          speaker: old_fakir
          text: How much should I ask for it?
        - id: ch01-b19
          speaker: imani
          text: Ask for two gold pieces.
        - id: ch01-b20
          speaker: narrator
          text: The fakir hobbled to the marketplace with the cloth. Before long, Kupti drove past. She saw it, stopped, and asked its price.
        - id: ch01-b21
          speaker: old_fakir
          text: Two gold pieces.
        - id: ch01-b22
          speaker: narrator
          text: Kupti gladly paid him, and the old fakir carried the money home.
    - id: ch02
      title: A Fortune of Her Own
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Imani repeated that day's work again and again. Every day she spent one penny on oil and flax. Every day she tended the old man's lame leg, then spun fine thread and wove another beautiful cloth. The cloths fetched high prices. Little by little, the whole city became famous for the wonderful fabrics made there. The fakir's leg grew straighter and stronger, and the hiding place beneath the hut floor filled with more and more gold pieces.
        - id: ch02-b02
          speaker: imani
          text: I think we have enough now to live more comfortably.
        - id: ch02-b03
          speaker: narrator
          text: She called in builders, and they made a beautiful house for her and the old fakir. In the entire city, no other home was finer. Only the king's own palace surpassed it. Before long, news of this splendid house reached the king. He asked who owned such a place, and his people told him that it belonged to his daughter Imani.
        - id: ch02-b04
          speaker: father_king
          text: She said she would make her own fortune. Somehow, she really has done it!
          emotion: surprised
        - id: ch02-b05
          speaker: narrator
          text: Not long afterward, the king had business in another country. Before leaving, he asked Kupti what gift she wanted him to bring home.
        - id: ch02-b06
          speaker: kupti
          text: Bring me a ruby necklace.
        - id: ch02-b07
          speaker: narrator
          text: The king decided to ask Imani as well, and sent a messenger to learn what she wanted. The man arrived while she was struggling with a knot in her loom. He bowed low.
        - id: ch02-b08
          speaker: royal_messenger
          text: The king asks what gift you would like him to bring you from the country of Dur.
        - id: ch02-b09
          speaker: narrator
          text: Imani was thinking only of loosening the knot without snapping the thread.
        - id: ch02-b10
          speaker: imani
          text: Please, have patience!
        - id: ch02-b11
          speaker: narrator
          text: She meant that the messenger should wait until she could attend to him. Instead, he hurried away and told the king that the one thing Imani wanted was patience.
        - id: ch02-b12
          speaker: father_king
          text: I don't know if patience can be bought in Dur. I have never had any myself. But if it can be found, I shall buy it for her.
        - id: ch02-b13
          speaker: narrator
          text: The next day the king began his journey. Once his business in Dur was finished, he bought Kupti a beautiful ruby necklace. Then he called a servant.
        - id: ch02-b14
          speaker: father_king
          text: Princess Imani has asked for patience. I never knew it was a thing one could buy. Go through the market, and if anyone sells it, bring some to me.
        - id: ch02-b15
          speaker: narrator
          text: The servant saluted and went out. He walked through the market calling to everyone he passed.
        - id: ch02-b16
          speaker: royal_messenger
          text: Does anyone have patience for sale? Patience for sale?
        - id: ch02-b17
          speaker: narrator
          text: Some people laughed and made fun of him. Others, who had no patience themselves, told him to stop being a fool and go away. Wherever he called, people stared at this servant who thought patience could be bought in a market.
        - id: ch02-b18
          speaker: market_voice_1
          text: Just listen to this fool trying to buy patience!
        - id: ch02-b19
          speaker: market_voice_2
          text: The man must be mad. Nobody can buy or sell patience!
        - id: ch02-b20
          speaker: narrator
          text: At last, word reached the king of Dur that a madman was wandering the market in search of patience. The king laughed.
        - id: ch02-b21
          speaker: subbar_khan
          text: I should like to meet this fellow. Bring him to me!
          emotion: happy
        - id: ch02-b22
          speaker: narrator
          text: The king's attendants quickly found the servant and led him into the royal presence.
        - id: ch02-b23
          speaker: subbar_khan
          text: Tell me, what exactly are you looking for?
        - id: ch02-b24
          speaker: royal_messenger
          text: Your Majesty, I was ordered to ask for patience.
        - id: ch02-b25
          speaker: subbar_khan
          text: Then you must serve a very strange master. What does he need it for?
        - id: ch02-b26
          speaker: royal_messenger
          text: My master wants it as a gift for his daughter, Princess Imani.
        - id: ch02-b27
          speaker: subbar_khan
          text: Well, I know of some patience the young lady may have, if she wants it. But it cannot be bought.
        - id: ch02-b28
          speaker: narrator
          text: The king's name was Subbar Khan, and the word Subbar means patience. That was the patience he meant. But the messenger did not know the meaning of the name, so he missed the joke completely. Instead, he began praising Imani. He said she was not only young and beautiful, but also the cleverest, most hardworking, and kindest-hearted of princesses. He might have gone on listing her virtues much longer, but Subbar Khan raised a hand, laughing.
        - id: ch02-b29
          speaker: subbar_khan
          text: That will do. Wait here a moment, and I shall see what I can arrange.
        - id: ch02-b30
          speaker: narrator
          text: He went to his private rooms and took out a small casket. He placed a fan inside, shut the lid with care, and brought it back.
        - id: ch02-b31
          speaker: subbar_khan
          text: Take this casket. It has no lock and no key, yet only the person who needs what is inside can open it. Whoever opens it will receive patience. Whether it is quite the sort of patience your master wants, I cannot say.
        - id: ch02-b32
          speaker: narrator
          text: The servant bowed low and accepted the mysterious casket. Then he asked what he must pay for it, but Subbar Khan would take nothing at all. The man left the palace, returned to his own king, and handed over the casket along with a full account of everything that had happened in Dur.
    - id: ch03
      title: The King in the Fan
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When their father came home, Kupti and Imani received their gifts. Imani stared in surprise when a messenger placed the casket in her hands.
        - id: ch03-b02
          speaker: imani
          text: What is this? I never asked for a gift. Your messenger ran off before I had even untangled my thread!
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: The servant insisted that the casket was meant for her, so curiosity made her accept it. She carried it to the old fakir and let him try to open it. He pulled and pried, but the lid would not move at all. It fitted so closely that the casket seemed sealed tight. Still, there was no lock, no bolt, no spring, and nothing else that could be holding it shut. When the fakir grew tired of trying, he passed it to Imani. She had hardly touched it before the lid opened with ease. Inside lay a beautiful fan.
        - id: ch03-b04
          speaker: narrator
          text: Imani cried out with delight, took up the fan, and fanned herself. She had scarcely waved it three times when Subbar Khan, king of Dur, appeared from nowhere at all. Imani gasped and rubbed her eyes. The old fakir could only stare. Several minutes passed before he found his voice.
        - id: ch03-b05
          speaker: old_fakir
          text: If you please, fair sir, who are you?
        - id: ch03-b06
          speaker: subbar_khan
          text: I am Subbar Khan of Dur. This lady called me, so here I am.
        - id: ch03-b07
          speaker: imani
          text: I called you? But I have never seen you or heard of you before. How could I possibly have summoned you?
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: Subbar Khan told them about the servant who had searched the markets of Dur for patience, and about the fan he had placed inside the casket.
        - id: ch03-b09
          speaker: subbar_khan
          text: The fan and the casket are both magic. Wave the fan three times, and I come to the person holding it. Fold it and tap it on a table three times, and I return home. The casket will not open for everyone. But this lady asked for patience, and Subbar is my name. So here I am, ready to serve her.
        - id: ch03-b10
          speaker: narrator
          text: Imani was proud-spirited. She wanted to fold the fan at once, tap it three times, and send this unexpected king straight home. The old fakir, however, was delighted with their guest and wanted him to stay. One thing led to another, and all three spent a very pleasant evening together before Subbar Khan finally took his leave.
        - id: ch03-b11
          speaker: narrator
          text: >-
            After that, they often summoned him. He and the fakir both loved chess and played it well, so they would sit over the board for half the night. Before long, one little chamber became known as the king's room. Whenever Subbar Khan stayed too late, he slept there and returned to Dur in the morning.
        - id: ch03-b12
          speaker: narrator
          text: >-
            In time, Kupti heard that a rich and handsome young man often visited her sister's house. She became bitterly jealous. One day she came to see Imani and pretended to be full of sisterly affection. She acted deeply interested in the fine house, in the life Imani shared with the old fakir, and most of all in their mysterious visitor, who was said to be a king.
        - id: ch03-b13
          speaker: narrator
          text: >-
            As Imani led her from room to room, Kupti saw Subbar Khan's chamber. Soon she made an excuse to slip inside alone. From her clothes she drew poisoned glass, ground into tiny, sharp splinters, and scattered it beneath the sheet on his bed. A little later, she said goodbye. She claimed she could never forgive herself for staying away so long and promised to make up for neglecting her sister.
        - id: ch03-b14
          speaker: narrator
          text: >-
            That very evening, Subbar Khan arrived and played chess with the old fakir until late. At last, exhausted, he wished the fakir and Imani good night. The moment he lay down, thousands of poisoned glass splinters pierced him. He twisted one way and then another, until they pricked him everywhere and his whole body seemed to burn.
        - id: ch03-b15
          speaker: narrator
          text: >-
            He never spoke a word or called for help. All night he sat in agony from the poison, with an even sharper pain in his mind. As far as he could tell, someone had tried to kill him in Imani's own house. In the morning, he was nearly fainting, but he still told them nothing. He used the magic fan and was carried home as usual.
        - id: ch03-b16
          speaker: narrator
          text: >-
            Subbar Khan summoned every physician and doctor in his kingdom, but none could discover what ailed him. For weeks he tried every cure anyone could think of. Fever and pain filled his days, and he could not sleep at night. At last, he lay close to death.
    - id: ch04
      title: The Secret in the Tree
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Meanwhile, Imani and the old fakir were deeply troubled. They waved the magic fan over and over, but Subbar Khan never appeared. They feared he had grown tired of visiting them, or that some evil fate had found him. At last, Imani could bear the doubt no longer. She resolved to travel to Dur and learn what had happened.
        - id: ch04-b02
          speaker: narrator
          text: >-
            She dressed herself in men's clothes so that she looked like a young fakir. Then she set out alone and traveled on foot, as a fakir should. One evening, she reached a forest and lay down beneath a great tree to spend the night. She could not sleep. Her thoughts stayed with Subbar Khan, and she kept wondering what could have happened to him. Presently, she heard two large monkeys talking in the branches above her head.
        - id: ch04-b03
          speaker: first_monkey
          text: Good evening, brother. Where have you come from, and what news do you bring?
        - id: ch04-b04
          speaker: second_monkey
          text: I have come from Dur, and the news is bad. The king is dying.
        - id: ch04-b05
          speaker: first_monkey
          text: I am sorry to hear it. He is wonderfully skilled at killing leopards and other creatures that should not be allowed to live. What is wrong with him?
          emotion: sad
        - id: ch04-b06
          speaker: second_monkey
          text: >-
            No man knows. But birds see everything and carry every message. They say he is dying because Kupti, the king's daughter, scattered poisoned glass across his bed.
        - id: ch04-b07
          speaker: first_monkey
          text: >-
            That is sad indeed. If people only knew, the berries from this very tree would cure him. Steep them in hot water, and in no more than three days he would be well.
          emotion: sad
        - id: ch04-b08
          speaker: second_monkey
          text: >-
            True. What a pity we cannot tell a man about such a simple cure and save a good man's life. But men are foolish. They shut themselves inside stuffy houses in stuffy cities instead of living in pleasant, airy trees. That is why they miss all the best knowledge.
        - id: ch04-b09
          speaker: narrator
          text: >-
            When Imani heard that Subbar Khan was dying, she began to weep without a sound. But as the monkeys described the cure, she dried her tears and sat upright to catch every word. The moment daylight spread across the forest, she gathered berries from the tree. She did not stop until she had tied a whole load of them inside her cloth. Then she walked as fast as she could and reached the city of Dur in two days.
        - id: ch04-b10
          speaker: narrator
          text: Her first act was to walk through the marketplace calling out her offer.
        - id: ch04-b11
          speaker: imani
          text: Medicine for sale! Is anyone ill and in need of my medicine?
        - id: ch04-b12
          speaker: first_townsman
          text: Look there. That young fakir is selling medicine. Perhaps he could help the king.
        - id: ch04-b13
          speaker: second_townsman
          text: Nonsense. So many grey-bearded doctors have failed. What use could a boy like that be?
        - id: ch04-b14
          speaker: first_townsman
          text: Even so, we could let him try.
        - id: ch04-b15
          speaker: narrator
          text: >-
            The first townsman approached Imani, and together they went to the palace. There they announced that another doctor had come to try to save the king.
        - id: ch04-b16
          speaker: narrator
          text: >-
            After waiting some time, Imani was allowed into the sickroom. Her disguise was so good that Subbar Khan did not recognize her beneath it. His long illness had wasted him so terribly that she scarcely recognized him either. Though the sight pained her, she began her work at once, full of hope. She asked for rooms where she could work alone and for a pot in which to boil water.
        - id: ch04-b17
          speaker: narrator
          text: >-
            When the water was hot, she steeped some berries in it. Then she gave the liquid to the king's attendants and told them to wash him with it. That first washing helped so much that Subbar Khan slept peacefully all night.
        - id: ch04-b18
          speaker: narrator
          text: >-
            She treated him in the same way on the second day. This time he said he was hungry and asked for food. After the third day, he was completely cured, though still weak from his long illness.
    - id: ch05
      title: Imani's Reward
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            On the fourth day, Subbar Khan was strong enough to rise from bed and sit upon his throne. Then he sent messengers to fetch the physician who had cured him. When the disguised Imani appeared before the court, everyone marveled that so young a man could be such a wise and skillful doctor. The grateful king offered her immense sums of money and every kind of precious treasure.
        - id: ch05-b02
          speaker: narrator
          text: >-
            At first, Imani refused every gift. At last she said that, if she must accept a reward, she would take only the king's signet ring and his handkerchief. Since she would have nothing else, Subbar Khan gave her both. She left Dur and traveled home as quickly as she could.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Once she returned, Imani told the old fakir everything that had happened. A little while later, they used the magic fan to summon Subbar Khan. When he appeared, they asked why he had stayed away so long.
        - id: ch05-b04
          speaker: narrator
          text: >-
            He told them about his terrible illness and the young doctor who had cured him. When he finished, Imani stood up. She opened a cabinet, brought out the ring and handkerchief, and laughed.
        - id: ch05-b05
          speaker: imani
          text: Are these the rewards you gave your doctor?
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: >-
            Subbar Khan looked at the two objects. He recognized Imani and understood everything in an instant. He sprang to his feet, put the magic fan in his pocket, and declared that no one would ever send him home again unless Imani came with him as his wife.
        - id: ch05-b07
          speaker: narrator
          text: >-
            And so it was settled. Imani and the old fakir went to the city of Dur. There she married Subbar Khan, and they lived happily ever after.
