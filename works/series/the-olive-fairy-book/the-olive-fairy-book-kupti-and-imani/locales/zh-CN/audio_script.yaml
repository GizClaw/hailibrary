audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    father_king:
      display_name: 老国王
      tts:
        delivery: 威严而固执，惊叹时直率爽朗
        timbre: 浑厚的老年男声
        pace: 舒缓
        pitch: 低
    kupti:
      display_name: 库普蒂
      tts:
        delivery: 表面柔顺端庄，嫉妒时甜蜜中藏着冷意
        timbre: 圆润清亮的年轻女声
        pace: 适中
        pitch: 中高
    imani:
      display_name: 伊玛尼
      tts:
        delivery: 聪慧自信，做事果断，动情时依然坚韧
        timbre: 清澈坚定的年轻女声
        pace: 适中，紧要处稍快
        pitch: 中高
    old_fakir:
      display_name: 老苦行僧
      tts:
        delivery: 谦和质朴，惊讶时略显迟疑
        timbre: 温厚略带沙哑的老年男声
        pace: 舒缓
        pitch: 低
    messenger:
      display_name: 信使
      tts:
        delivery: 恭敬认真，理解事情时有些一板一眼
        timbre: 清晰的成年男声
        pace: 适中
        pitch: 中
    servant:
      display_name: 国王的仆人
      tts:
        delivery: 忠实恭谨，办差时认真而略显笨拙
        timbre: 平稳的成年男声
        pace: 适中
        pitch: 中
    subbar_khan:
      display_name: 苏巴尔汗
      tts:
        delivery: 风趣从容，待人坦荡，病痛时克制隐忍
        timbre: 明朗沉稳的青年男声
        pace: 适中
        pitch: 中低
    market_voice:
      display_name: 集市上的人
      tts:
        delivery: 直率嘲讽，说话短促响亮
        timbre: 粗亮的成年男声
        pace: 偏快
        pitch: 中
    monkey_1:
      display_name: 猴子甲
      tts:
        delivery: 好奇健谈，口气机灵活泼
        timbre: 明亮灵巧的成年男声
        pace: 适中偏快
        pitch: 中高
    monkey_2:
      display_name: 猴子乙
      tts:
        delivery: 消息灵通，评论人类时一本正经又带讥诮
        timbre: 清脆敏捷的成年女声
        pace: 适中偏快
        pitch: 高
    townsman_1:
      display_name: 杜尔城民甲
      tts:
        delivery: 热心爽快，愿意给人机会
        timbre: 明亮的成年男声
        pace: 适中
        pitch: 中
    townsman_2:
      display_name: 杜尔城民乙
      tts:
        delivery: 多疑轻蔑，说话干脆
        timbre: 略显沙哑的成年男声
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 自己挣来的家业
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有位国王生了两个女儿，大女儿叫库普蒂，小女儿叫伊玛尼。国王很爱她们，常常陪她们聊上几个钟头。有一天，他忽然问库普蒂，愿不愿意把自己的一生和命运都交给父亲安排。
        - id: ch01-b02
          speaker: father_king
          text: 库普蒂，你愿意把一生和命运都放在我手里吗？
        - id: ch01-b03
          speaker: kupti
          text: 当然愿意呀。除了父王，我还能把它们交给谁呢？
        - id: ch01-b04
          speaker: narrator
          text: 国王又去问伊玛尼。小女儿给出的答案，却完全不同。
        - id: ch01-b05
          speaker: imani
          text: 我不愿意。只要有机会，我能凭自己挣出一份家业。
        - id: ch01-b06
          speaker: narrator
          text: 国王听了很不高兴。
        - id: ch01-b07
          speaker: father_king
          text: 你还太小，不明白这句话有多重。既然你这样说，我就给你机会，看你怎样实现愿望。
        - id: ch01-b08
          speaker: narrator
          text: 城郊住着一个腿瘸的老苦行僧，栖身的小屋破败不堪。国王把他叫来，说他年纪很大，身子又几乎残废，想必很愿意有个年轻人陪他生活、服侍他。因此，国王要把小女儿送到他那里。伊玛尼既然想靠自己谋生，跟老人同住，正好可以实现愿望。老苦行僧又惊又愁，一句话也说不出来。就算有话，他也慌得开不了口。伊玛尼倒笑吟吟地跟他走了，一路脚步轻快，心情愉快。老人只能满腹困惑，一声不响地在她身边蹒跚而行。
        - id: ch01-b09
          speaker: narrator
          text: 小屋里只有一张床架、两口旧锅和一只水罐。老苦行僧正发愁怎样让公主住得舒服，伊玛尼先问起另一件事。
        - id: ch01-b10
          speaker: imani
          text: 你手里有钱吗？
        - id: ch01-b11
          speaker: old_fakir
          text: 我记得还有一便士，只是不知道放在哪里了。
        - id: ch01-b12
          speaker: imani
          text: 找到以后交给我。你再去借一架纺车和一台织布机。
        - id: ch01-b13
          speaker: narrator
          text: 老人翻了半天，总算找到那枚便士，随即出门借东西。伊玛尼拿钱上街，用一法新买油，剩下三法新全买了亚麻。回来以后，她先让老人坐在床架上，用油揉了整整一个钟头的瘸腿。老人睡下以后，她坐到纺车前，一刻不停地纺了一整夜。等到天亮，世间最细的线已经纺成。她顾不上休息，又坐到织布机前，从早织到晚，终于织出一匹美丽的银色布料。
        - id: ch01-b14
          speaker: imani
          text: 请把这匹布拿到集市上卖吧。我得休息一会儿。
        - id: ch01-b15
          speaker: old_fakir
          text: 我该开多少价钱？
        - id: ch01-b16
          speaker: imani
          text: 两枚金币。
        - id: ch01-b17
          speaker: narrator
          text: 老人拿着布站到集市上。恰好库普蒂乘车经过，一见那匹布便停下来问价。
        - id: ch01-b18
          speaker: old_fakir
          text: 两枚金币。
        - id: ch01-b19
          speaker: narrator
          text: 库普蒂高高兴兴地付出两枚金币，买下了布。老苦行僧拿着钱回了家。此后，伊玛尼日复一日，都照着头一天的办法做。她总拿一便士去买油和亚麻，先细心照料老人的瘸腿，再纺出最细的线，织成最美的布料，拿去卖出高价。渐渐地，整座城都因她织的布出了名。老人的瘸腿越来越直，也越来越有力。小屋地板下藏钱的洞里，金币更是一天比一天多。终于，伊玛尼觉得这些钱已经足够让两个人住得舒服些，便请来工匠，盖起一所漂亮的房子。全城只有王宫比它更好。事情很快传到国王耳中。他问是谁的房子，得到的答案正是自己的女儿。
        - id: ch01-b20
          speaker: father_king
          text: 她说要自己挣出一份家业。没想到，她还真的做到了！
    - id: ch02
      title: 名叫耐心的礼物
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 不久，国王要到另一个国家办事。临行前，他问库普蒂想要什么礼物。
        - id: ch02-b02
          speaker: kupti
          text: 请给我带一串红宝石项链。
        - id: ch02-b03
          speaker: narrator
          text: 国王想到小女儿也该有一份礼物，便派信使去问伊玛尼。那人到的时候，她正忙着解织布机上的线结，还要小心不把线扯断。信使走到她面前，深深鞠了一躬，问她想要父亲从杜尔国带回什么。
        - id: ch02-b04
          speaker: imani
          text: 耐心等着！
        - id: ch02-b05
          speaker: narrator
          text: 伊玛尼只是让他稍候，等自己把线结解开。信使却以为这就是答案，回去告诉国王，伊玛尼唯一想要的礼物是“耐心”。
        - id: ch02-b06
          speaker: father_king
          text: 杜尔国有没有耐心卖，我可不知道。我自己从来没有这东西。不过，若是找得到，我一定给她买。
        - id: ch02-b07
          speaker: narrator
          text: 国王到杜尔办完事，先给库普蒂买好红宝石项链，又叫一名仆人去集市寻找耐心。仆人认真领命，在人群中走来走去，扯着嗓子吆喝。
        - id: ch02-b08
          speaker: servant
          text: 谁家有耐心卖？我想买些耐心！
        - id: ch02-b09
          speaker: narrator
          text: 有人笑他，有人没耐心听，叫他别犯傻，赶紧走开。还有人当面骂道：
        - id: ch02-b10
          speaker: market_voice
          text: 这家伙一定疯了！耐心怎么可能拿来买卖？
        - id: ch02-b11
          speaker: narrator
          text: 杜尔国王听说集市上有个疯子在买耐心，笑着命人把他带来。
        - id: ch02-b12
          speaker: subbar_khan
          text: 说说看，你究竟想买什么？
        - id: ch02-b13
          speaker: servant
          text: 陛下，主人叫我来找耐心。
        - id: ch02-b14
          speaker: subbar_khan
          text: 你这位主人可真特别。他拿耐心做什么？
        - id: ch02-b15
          speaker: servant
          text: 他要把耐心送给女儿伊玛尼公主。
        - id: ch02-b16
          speaker: subbar_khan
          text: 我倒知道一份耐心。那位小姐若愿意，尽管拿去，只是这东西不能花钱买。
        - id: ch02-b17
          speaker: narrator
          text: 原来，这位年轻国王名叫苏巴尔汗，“苏巴尔”恰好就是“耐心”的意思。仆人不懂这个双关，还一本正经地夸起伊玛尼，说她年轻美丽，是世上最聪明、最勤劳、心地最好的公主。苏巴尔汗笑着抬手，拦住了他。
        - id: ch02-b18
          speaker: subbar_khan
          text: 好了，先等等。我看看能替你想出什么办法。
        - id: ch02-b19
          speaker: narrator
          text: 苏巴尔汗回到自己的内室，拿出一个小匣子。他把一柄扇子放进去，仔细合好，又亲手拿给仆人。他说，匣子无锁无钥匙，看上去什么也没扣住，可只有真正需要里面东西的人轻轻一碰，它才会打开。谁能打开匣子，谁就会得到耐心。至于这份耐心是不是伊玛尼想要的那一种，他可不敢保证。仆人深深鞠躬，接过匣子，又问该付多少钱。苏巴尔汗却一文不收。仆人回到主人身边，把匣子和自己一路上的奇遇全都交代清楚。
        - id: ch02-b20
          speaker: narrator
          text: 父亲一回到自己的国家，姐妹俩便各自拿到了礼物。库普蒂得到那串美丽的红宝石项链，伊玛尼却从信使手中接过一只从未见过的小匣子。她看着这件莫名其妙的礼物，大吃一惊。
        - id: ch02-b21
          speaker: imani
          text: 这是什么？我根本没要礼物呀！那个信使跑得太快，我连线结都没解开呢。
        - id: ch02-b22
          speaker: narrator
          text: 仆人坚持说礼物就是给她的。伊玛尼带着好奇收下匣子，拿去给老苦行僧看。老人又掰又推，用尽办法，匣盖还是纹丝不动，合得严丝合缝。奇怪的是，上面明明没有锁，没有门闩，也看不见弹簧或别的机关。最后，他试得疲倦了，只好把匣子递给公主。伊玛尼刚一碰，匣子就轻轻松松地开了，里面躺着一柄漂亮的扇子。她又惊又喜，叫出声来，拿起扇子给自己扇风。才扇满三下，苏巴尔汗便忽然凭空出现在他们面前。伊玛尼倒抽一口气，不敢相信似的揉着眼睛。老人坐在那里盯了好几分钟，终于能开口说话了。
        - id: ch02-b23
          speaker: old_fakir
          text: 请问，这位俊美的先生，您到底是谁？
        - id: ch02-b24
          speaker: subbar_khan
          text: 我是杜尔国王苏巴尔汗。这位小姐召我前来，所以我就到了。
        - id: ch02-b25
          speaker: imani
          text: 是我召您来的？可我从没见过您，也从没听说过您呀！
          emotion: surprised
        - id: ch02-b26
          speaker: narrator
          text: 苏巴尔汗讲起集市上那个寻找耐心的人，又说匣子和扇子都有魔力。
        - id: ch02-b27
          speaker: subbar_khan
          text: 扇子只要扇三下，我就会来到使用它的人身边。把扇子合拢，在桌上敲三下，我便回家。匣子也不是谁都能开。是您想要耐心，而耐心正是我的名字，所以我很愿意为您效劳。
        - id: ch02-b28
          speaker: narrator
          text: 伊玛尼性情高傲，恨不得马上把扇子合起来，在桌上敲满三下，把这个不请自来的国王送回去。老苦行僧却很喜欢这位客人。三个人你一句我一句，竟一起度过了一个愉快的夜晚，苏巴尔汗才告辞离开。此后，他们常用扇子召他前来。国王和老人都爱下棋，也都是好棋手，两人一坐到棋盘前，常常对弈到半夜。房子里渐渐有一间小屋被叫作“国王的房间”。苏巴尔汗待得太晚，便在那里睡上一夜，等到清晨再回杜尔。
    - id: ch03
      title: 床单下的毒玻璃
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 库普蒂听说有个富有又英俊的年轻人常到妹妹家做客，妒忌得不得了。她特意登门探望，装得格外亲热，还假意关心妹妹的新房子、她和老苦行僧怎样生活，以及那位身份神秘的王族客人。姐妹俩从一个房间走到另一个房间，伊玛尼也让姐姐看见了苏巴尔汗留宿的小屋。没过多久，库普蒂找了个借口，独自溜进去。她从衣服里取出早已藏好的毒玻璃，把磨得极细的粉末和尖利碎片，全都迅速撒到床单下面。告辞时，她还说自己这么久没来探望妹妹，实在无法原谅自己，从今以后一定好好弥补过去的冷落。
        - id: ch03-b02
          speaker: narrator
          text: 当晚，苏巴尔汗照常来找老苦行僧下棋。他们一直下到很晚。国王疲倦极了，向老人和公主道过晚安，刚躺上床，成千上万片细得不能再细的毒玻璃便扎进身体。他不知道发生了什么，猛地翻向这边，又躲向那边，反而被刺得浑身是伤，从头到脚像烧起来一样。他一个字也没说，只在身体的剧痛中坐了一整夜。比这更折磨他的，是想到自己竟在伊玛尼家里中了毒。他猜，那一定是有人下毒害他。天亮时，他几乎昏厥，却仍然闭口不提，只用魔扇回了杜尔。
        - id: ch03-b03
          speaker: narrator
          text: 回到王宫，苏巴尔汗召来全国所有的医师和大夫，谁也查不出病因，更没有人能让他好起来。他拖着病体熬过一个星期又一个星期，试遍了每一个人想得出的药方。夜里，他始终无法入睡。白天，他也在疼痛、高热和苦楚中度过。到最后，他终于走到了死亡边缘。
        - id: ch03-b04
          speaker: narrator
          text: 伊玛尼和老苦行僧也忧虑万分。他们一次又一次挥动扇子，苏巴尔汗却始终没有出现。两人不知道他是厌倦了这里，不想再来，还是遭遇了什么可怕的灾祸。伊玛尼困在疑惑和不安里，痛苦得无法忍受，终于决定亲自去杜尔查个明白。她换上男子的衣服，扮成年轻苦行僧，独自徒步上路，因为苦行僧原本就该这样旅行。一天傍晚，她走进一片森林，在一棵大树下躺下过夜。她一心惦记着苏巴尔汗，翻来覆去猜测他出了什么事，怎么也睡不着。这时，头顶树上的两只大猴子说起了话。
        - id: ch03-b05
          speaker: monkey_1
          text: 晚上好，兄弟。你从哪里来？那边有什么新消息？
        - id: ch03-b06
          speaker: monkey_2
          text: 我刚从杜尔过来。那里的国王快要死了。
        - id: ch03-b07
          speaker: monkey_1
          text: 那可太遗憾了。他很会猎杀豹子，也能除掉那些不该活着的恶兽。他到底得了什么病？
          emotion: sad
        - id: ch03-b08
          speaker: monkey_2
          text: 人类谁也不知道。可鸟儿看得见一切，也会传遍所有消息。它们说，一个国王的女儿库普蒂在床上撒了毒玻璃，苏巴尔汗就是被那些玻璃害的。
        - id: ch03-b09
          speaker: monkey_1
          text: 真是坏消息。其实，把我们这棵树上的果子泡进热水，用不了三天，就能治好这种病。
        - id: ch03-b10
          speaker: monkey_2
          text: 没错。可惜我们不能把这么简单的药方告诉人类，救回那个好人。他们实在太傻了，不住在通风的树上，偏把自己关进闷房子、闷城市，难怪什么好东西都不知道。
        - id: ch03-b11
          speaker: narrator
          text: 伊玛尼听说苏巴尔汗快死了，悄悄流下眼泪。可她继续听着，听到那份药方，便马上擦干泪水，坐了起来。天光刚刚照进森林，她就开始采摘头顶树上的果子，一直摘到衣布里兜了满满一大包。随后，她带着果子尽可能快地向前赶路，只用了两天，便抵达杜尔城。一进城，她做的第一件事，就是穿过熙攘的集市，一路大声叫卖自己的药。
    - id: ch04
      title: 年轻苦行僧的药
      blocks:
        - id: ch04-b01
          speaker: imani
          text: 我这里有药！谁生了病，快来买我的药！
        - id: ch04-b02
          speaker: narrator
          text: 一个男人听见了，便对身边的人说：
        - id: ch04-b03
          speaker: townsman_1
          text: 你看，那个年轻苦行僧在卖药。也许他能替国王想点办法。
        - id: ch04-b04
          speaker: townsman_2
          text: 那么多白胡子老大夫都没治好，他一个年轻人能有什么用？
        - id: ch04-b05
          speaker: townsman_1
          text: 就算如此，也该让他试一试。
        - id: ch04-b06
          speaker: narrator
          text: 热心的男人上前和伊玛尼说话，带着她一起去王宫。他们禀报说，又来了一位大夫，愿意试着医治国王。经过一番耽搁和等待，伊玛尼终于获准进入病房。她的男装打扮骗过了国王，国王却已经被病痛折磨得瘦脱了形，伊玛尼也差一点认不出他。她心里仍旧充满希望，马上动手医治，只先要来一套只供自己使用的房间，又要了一口烧水的锅。
        - id: ch04-b07
          speaker: narrator
          text: 水烧热后，伊玛尼把带来的果子泡进去，再将药水交给国王的侍从，叫他们替国王擦洗全身。第一次擦洗就有了很大效果，苏巴尔汗安安稳稳地睡过一整夜。第二天，伊玛尼用同样的办法再洗一次。这一回，国王说自己饿了，还叫人送来食物。第三天过后，他已经完全痊愈，只因病得太久，身体依然十分虚弱。到了第四天，他终于起身，重新坐上王座，又派出信使，请来那位救了自己性命的大夫。
        - id: ch04-b08
          speaker: narrator
          text: 伊玛尼来到王座前，众人见这位大夫如此年轻，竟有这样高明的医术，全都惊叹不已。苏巴尔汗满心感激，要赏给她大笔金钱和各种珍贵的宝物。伊玛尼起初什么也不肯收。国王再三要她接受酬谢，她最后才开口，说出自己真正想要的东西。
        - id: ch04-b09
          speaker: imani
          text: 如果陛下一定要酬谢我，就把您的印章戒指和手帕送给我吧。除此以外，我什么也不要。
        - id: ch04-b10
          speaker: narrator
          text: 既然这位救命恩人不肯多收，苏巴尔汗只好取下印章戒指，又拿出自己的手帕，一起交给她。伊玛尼收好这两件东西，立即告辞离开王宫，以最快的速度赶回自己的国家。
    - id: ch05
      title: 耐心留下来了
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 回家后，伊玛尼把一路经历从头到尾都讲给老苦行僧听。过了不久，两人再次挥动魔扇，苏巴尔汗果然出现在面前。他们问国王，为什么离开了这么长时间，一直没有回来。苏巴尔汗这才讲起自己怎样突然得了怪病，全国的大夫又怎样束手无策，最后，一个年轻苦行僧用了三天时间，把他从死亡边缘救了回来。等他说完，伊玛尼站起身，走到柜子前打开柜门，取出那枚印章戒指和那条手帕，笑着问：
        - id: ch05-b02
          speaker: imani
          text: 您送给那位大夫的酬礼，就是这两样东西吗？
        - id: ch05-b03
          speaker: narrator
          text: 苏巴尔汗低头看清那两样东西，又抬头望向伊玛尼，立刻认出了她。就在这一瞬间，他也明白了事情的全部经过。国王猛地跳起来，一把抓过魔扇，塞进自己的口袋。他郑重宣布，从今以后，谁也不能再把他送回杜尔，除非伊玛尼愿意和他一起走，做他的妻子。
        - id: ch05-b04
          speaker: narrator
          text: 事情就这样定了。伊玛尼和老苦行僧一同前往杜尔。她在那里嫁给苏巴尔汗，从此过上幸福的生活。
        - id: ch05-b05
          speaker: narrator
          text: 这个故事来自旁遮普。
