  chapters:
    - id: ch01
      title: The King’s Secret
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a king who understood the speech of every bird, beast, and insect. A fairy godmother had given him this troublesome gift. If he ever repeated anything he learned through it, he would turn to stone. How he managed to keep quiet for so many years, no one can say. But he guarded the secret until he was grown, married a wife, and became about as happy as kings usually are.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The king was a Hindu. When he ate, he sat lightly dressed in the middle of a little patch of ground that had just been plastered with clean mud. His way of taking a meal was quite different from ours, but it was the proper way for him.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One day, the king ate dinner in such a place while the queen sat opposite, serving him and keeping him company. A few grains of rice fell to the ground. A little ant, busy looking for food, picked one up and carried it toward its hole. Just beyond the king’s eating place, the ant met another ant. The king heard the second one speak.
        - id: ch01-b04
          speaker: second_ant
          text: >-
            Dear friend, please give me that grain and fetch another for yourself. My boots are so muddy that I would spoil the king’s clean eating place if I crossed it. That would be terribly rude.
        - id: ch01-b05
          speaker: first_ant
          text: >-
            If you want rice, go and fetch it yourself. No one will ever notice those dirty boots of yours. And do you really imagine I mean to carry rice for every one of our relations?
        - id: ch01-b06
          speaker: narrator
          text: The king burst out laughing.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The queen looked herself over. She could find nothing about her appearance that should make him laugh.
        - id: ch01-b08
          speaker: queen
          text: What made you laugh?
        - id: ch01-b09
          speaker: king
          text: Did I laugh?
        - id: ch01-b10
          speaker: queen
          text: >-
            Of course you did. If you think I look ridiculous, say so. Do not sit there behaving foolishly. Tell me what amused you.
          emotion: angry
        - id: ch01-b11
          speaker: king
          text: Nothing amused me.
        - id: ch01-b12
          speaker: queen
          text: But you did laugh, and I mean to know the reason.
        - id: ch01-b13
          speaker: king
          text: I am afraid I cannot tell you.
        - id: ch01-b14
          speaker: queen
          text: >-
            You have to tell me. If you laugh when nothing is funny, then you must be sick or out of your mind. What is wrong?
          emotion: angry
    - id: ch02
      title: A Ride to the River
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The king would not explain, and the queen would not stop demanding an answer. Their quarrel lasted for days. She gave him no peace until the poor king was nearly beside himself. At last he felt that life could hardly be worth living this way. He decided to reveal the secret and face what followed.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Still, if he had to become a stone, he did not want to lie on some dusty road. People and animals would kick him this way and that. Someone might pick him up and throw him at a dog. Naughty children might make him their plaything. A stone treated like that would never be still, and the king wanted a quieter fate.
        - id: ch02-b03
          speaker: king
          text: >-
            I will become a stone at the bottom of the cool river. Down there, the water can roll me gently along. In time I will find a safe resting place where no one will disturb me, and I can stay there forever.
        - id: ch02-b04
          speaker: narrator
          text: >-
            So the king told his wife he would explain his laughter if she rode with him to the middle of the river. She had no idea what he meant to do. She thought he was joking and agreed with a laugh. Their horses were ordered, made ready, and brought to them. Then the king and queen set off together.
        - id: ch02-b05
          speaker: narrator
          text: >-
            On the way, they reached a fine well shaded by lofty trees whose branches spread wide overhead. The king suggested that they dismount, rest awhile, and drink some cool water before going on toward the river. The queen agreed. They got down from their horses and sat together in the shade beside the well.
    - id: ch03
      title: The Goats by the Well
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            An old billy goat and his wife happened to be browsing nearby. As the king and queen rested, the nanny goat wandered to the very edge of the well and peered over. There, out of the wall of the well, grew tender green shoots covered with lovely leaves. The sight of them made her long for a bite.
        - id: ch03-b02
          speaker: nanny_goat
          text: >-
            Oh, come and see these lovely leaves! They make my mouth water. Hurry and get them for me!
        - id: ch03-b03
          speaker: narrator
          text: >-
            The billy goat strolled over and looked into the well. Then he gave his wife a rather cross look.
        - id: ch03-b04
          speaker: billy_goat
          text: >-
            You expect me to fetch those leaves? Have you even thought about how I could reach them? If I leaned down far enough to bite them, I would fall into the well and drown.
        - id: ch03-b05
          speaker: nanny_goat
          text: >-
            Oh, why would you fall? Please, just try to get them!
        - id: ch03-b06
          speaker: billy_goat
          text: I will not do anything so foolish.
        - id: ch03-b07
          speaker: narrator
          text: But the nanny goat kept weeping and begging him.
        - id: ch03-b08
          speaker: billy_goat
          text: >-
            Listen to me. There are plenty of fools in this world, but I am not one of them. Look at that silly king. He cannot stop his wife from asking questions, so he means to throw his life away. I know how to stop your foolishness, and I am going to do it.
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: >-
            With that, he butted the nanny goat so hard that within two minutes she had become quite submissive. She moved away from the well and began meekly feeding somewhere else. By then, she had firmly decided that the green leaves were really not worth having at all.
        - id: ch03-b10
          speaker: narrator
          text: The king had understood every word, and once again he laughed.
    - id: ch04
      title: The King Changes His Mind
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The queen watched him with suspicion. The king rose and crossed to where she sat.
        - id: ch04-b02
          speaker: king
          text: Do you still insist on knowing why I laughed the other day?
        - id: ch04-b03
          speaker: queen
          text: I certainly do.
          emotion: angry
        - id: ch04-b04
          speaker: king
          text: >-
            Then hear this. I have decided not to tell you. I have also decided that you will not mention it again.
        - id: ch04-b05
          speaker: narrator
          text: As he spoke, the king tapped his leg with his riding whip.
        - id: ch04-b06
          speaker: queen
          text: What do you mean by that?
          emotion: fearful
        - id: ch04-b07
          speaker: king
          text: >-
            I noticed that when the billy goat is displeased with his wife, he simply butts her. That seems to end the argument.
        - id: ch04-b08
          speaker: queen
          text: Are you saying you would beat me?
          emotion: surprised
        - id: ch04-b09
          speaker: king
          text: >-
            I would be extremely sorry to do it. But I must persuade you to go home quietly and stop asking foolish questions when I tell you I cannot answer. If you choose to keep insisting, then—
        - id: ch04-b10
          speaker: narrator
          text: >-
            The queen went home, and the king went home too. It is said that from then on, they were both happier and wiser than ever before.
