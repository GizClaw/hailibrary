audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: genial, reflective, and lightly amused
        timbre: warm and clear
        pace: measured
        pitch: medium
    king:
      display_name: The King
      tts:
        delivery: dignified and patient, with a thoughtful reserve
        timbre: mature and resonant
        pace: measured
        pitch: medium-low
    queen:
      display_name: The Queen
      tts:
        delivery: proud and insistent, quickening when vexed
        timbre: clear and polished
        pace: measured
        pitch: medium-high
    first_ant:
      display_name: The First Ant
      tts:
        delivery: brisk, practical, and slightly selfish
        timbre: light and crisp
        pace: brisk
        pitch: high
    second_ant:
      display_name: The Second Ant
      tts:
        delivery: polite, earnest, and careful
        timbre: light and delicate
