audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    badshah:
      display_name: 巴德沙
      tts:
        delivery: 威严急躁，历险后转为诚恳而好奇
        timbre: 浑厚有力的中年男声
        pace: 适中
        pitch: 中低
    wazir:
      display_name: 维齐尔
      tts:
        delivery: 沉着睿智，答话简洁，幽默不露声色
        timbre: 温厚略带沙哑的老年男声
        pace: 舒缓
        pitch: 低
    gaoler:
      display_name: 狱卒
      tts:
        delivery: 恭敬拘谨，只据实回话
        timbre: 朴实清晰的成年男声
        pace: 适中
        pitch: 中
    rajah:
      display_name: 罗阇
      tts:
        delivery: 犹豫谨慎，如释重负时坦率直白
        timbre: 稳重略显紧张的中年男声
        pace: 适中
        pitch: 中低
    chief_brahman:
      display_name: 首席婆罗门
      tts:
        delivery: 煞有介事，激动时夸张而尖锐
        timbre: 洪亮偏尖的老年男声
        pace: 时缓时急
        pitch: 中高
  chapters:
    - id: ch01
      title: 一截指尖
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，印度斯坦有两位国王，国土正好相邻。一位是信奉印度教的罗阇，另一位是信奉伊斯兰教的巴德沙。他们都想在财富和权势上胜过对方，关系自然很不好。为了不让两国天天争吵，他们只好签字盖印，订下一份盟约。盟约说，两边的臣民不论身份高低，谁越过边界，谁就可能被抓起来治罪。
        - id: ch01-b02
          speaker: narrator
          text: 一天早晨，巴德沙正要和首席维齐尔一起处理国事。他拿起一支笔，用锋利的小刀削起笔尖。刀锋忽然一滑，把他的一截指尖削了下来。
        - id: ch01-b03
          speaker: badshah
          text: 哎哟，维齐尔！我把指尖削掉了！
          emotion: surprised
        - id: ch01-b04
          speaker: wazir
          text: 这倒是个好消息！
        - id: ch01-b05
          speaker: badshah
          text: 放肆！别人倒霉，你觉得快活，现在连我倒霉，你也高兴吗？卫兵，把他关进宫里的监牢！等我有了工夫，再好好惩罚他！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 侍立的军官立刻抓住维齐尔，把他拖出御前，带向那道通往监牢和刑场的窄门。门打开时，维齐尔对着自己的白胡子低声说了句话，押送他的士兵没能听清。
        - id: ch01-b07
          speaker: badshah
          text: 那个恶棍说什么？
          emotion: angry
        - id: ch01-b08
          speaker: gaoler
          text: 他在感谢陛下。
        - id: ch01-b09
          speaker: narrator
          text: 巴德沙又惊又气，瞪着慢慢合拢的门。
        - id: ch01-b10
          speaker: badshah
          text: 他准是疯了！别人遭祸，他要感恩，自己遭祸，他居然也感恩。他的脑子一定出了毛病！
        - id: ch01-b11
          speaker: narrator
          text: 其实，巴德沙很喜欢这位老维齐尔。御医替他敷上清凉的药膏，包好伤指，疼痛是止住了，心里的难受却怎么也止不住。大臣和侍从同样没办法，只能看着陛下整整一天都在发脾气。
    - id: ch02
      title: 越过边界
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天一早，巴德沙吩咐人备马，说要出去打猎。马厩和厅堂里立刻忙碌起来。等他收拾停当，二十来名大臣和猎手已经准备好陪他上路。可巴德沙谁也不带，还狠狠瞪了众人一眼。众人见他脸色凶狠，反倒庆幸不用跟去，赶紧退开。
        - id: ch02-b02
          speaker: narrator
          text: 巴德沙独自越过田野，穿过森林，越走越远。他心里烦闷，连肥壮的雄鹿和羽毛鲜艳的野鸡从眼前逃走也没看见，更没留意自己走到了哪里。等灌木丛四周突然冒出人来，他才发现已经闯进罗阇的领地。四面都被围住，眼前再没有别的路，只能投降。
        - id: ch02-b03
          speaker: narrator
          text: 他被捆起来，押进罗阇的监牢。一路上，巴德沙总想着同样身陷牢狱的维齐尔。他多希望自己也能像那位老人一样，从这场灾祸里找出一件值得感恩的事。
        - id: ch02-b04
          speaker: narrator
          text: 当天夜里，罗阇召集群臣，专门商议该怎样处置这位送上门来的对手。他还叫来了所有婆罗门。那些胖祭司自称无所不知，尤其懂得哪天吉利，哪天不吉利。谋臣们七嘴八舌，各有各的主张，闹得罗阇又气又烦，几乎发疯。只有首席婆罗门蹲在角落里，推算数字和征兆。一群小祭司围着他，满脸敬佩。过了很久，他才站起来，走向王座。
        - id: ch02-b05
          speaker: rajah
          text: 怎么样？你有什么主张？
        - id: ch02-b06
          speaker: chief_brahman
          text: 大不吉，真是大不吉！提毗神正在震怒。神明命你明天砍下这个巴德沙的头，把他当作祭品献上去！
        - id: ch02-b07
          speaker: rajah
          text: 唉，那就照办吧。执行判决的事，全交给你了。
        - id: ch02-b08
          speaker: narrator
          text: 罗阇向祭司们欠了欠身，离开房间。天还没亮，人们就开始筹备献给提毗大神的盛大庆典。几百面旗帜迎风飘动，几百名鼓手一起擂鼓，几百名歌者吟唱颂歌，几百名沐浴涂油的祭司举行仪式。罗阇坐在成群的廷臣和仆从中间，浑身不自在，只盼事情快点结束。
        - id: ch02-b09
          speaker: narrator
          text: 献祭的时辰终于到了。巴德沙被绳索捆着带出来，就要遭人砍头。首席婆罗门面带笑容，提着一柄大刀走近，却忽然看见巴德沙的手指裹着破布。他扔下刀，眼睛激动得几乎鼓出来，扑过去一把扯掉破布。祭品竟然少了一截指尖！婆罗门顿时气红了脸，把巴德沙领到疑惑不解的罗阇面前。
        - id: ch02-b10
          speaker: chief_brahman
          text: 罗阇啊，你看！这个祭品已经没用了，他少了一截指尖！不完整的祭品，根本算不得祭品！
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: 首席婆罗门又羞又恼，竟然哭了起来。罗阇却没跟着哀号，反而长长地松了一口气。
        - id: ch02-b12
          speaker: rajah
          text: 好吧，这下不用再争了。要是换了别人，我倒不介意。可他毕竟是位国王……拿一位国王献祭，好像确实不大妥当。
        - id: ch02-b13
          speaker: narrator
          text: 罗阇立刻起身，用镶着宝石的匕首割断巴德沙身上的绳索，领他离开神庙，回到王宫。
    - id: ch03
      title: 两国的新盟约
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 罗阇让客人沐浴休息，又送给他许多礼物。随后，他亲自带着大队随从，把巴德沙一路护送到两国边境。那里响起礼炮，也响起了欢呼。两位国王撕掉旧盟约，重新订下一份新的。从今以后，无论对方的臣民身份高低，也无论他们为何越过边界，都会受到欢迎，得到安全通行的保护。
        - id: ch03-b02
          speaker: narrator
          text: 新盟约订好以后，两位国王彼此拥抱，然后各自回国。巴德沙当天傍晚一到王宫，马上命人带来关在牢里的维齐尔。
        - id: ch03-b03
          speaker: badshah
          text: 维齐尔，你猜猜看，我这些时候遇上了什么事？
        - id: ch03-b04
          speaker: wazir
          text: 人关在监牢里，怎么会知道外面发生的事？
        - id: ch03-b05
          speaker: narrator
          text: 巴德沙便从头到尾，把自己的遭遇全讲了一遍。说到最后，他告诉维齐尔，自己还有一个问题。
    - id: ch04
      title: 维齐尔为何感恩
      blocks:
        - id: ch04-b01
          speaker: badshah
          text: 我能逃过一劫，心里十分感激，所以决定完全宽恕你。不过，你要告诉我，那天我削掉指尖，你为什么反而感恩？
        - id: ch04-b02
          speaker: wazir
          text: 陛下，您削掉那截指尖，不正是一件天大的幸运吗？否则，您一定会丢掉整个脑袋。少一小截手指和丢掉脑袋相比，当然算是小得多的灾祸。
        - id: ch04-b03
          speaker: narrator
          text: 巴德沙一边回答，一边摸了摸自己的头，好像非得确定它还好端端地留在那里不可。
        - id: ch04-b04
          speaker: badshah
          text: 说得对。可我把你关进监牢时，你为什么也要感恩？
        - id: ch04-b05
          speaker: wazir
          text: 我感恩，是因为无论什么时候，懂得感恩总是好事。要是我当时就知道，自己被关在牢里，反而能逃过提毗神的挑选，不会代替陛下成为那个完整无缺的祭品，那我一定会更加感恩。
        - id: ch04-b06
          speaker: narrator
          text: 这个故事来自旁遮普。
