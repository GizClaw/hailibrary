  chapters:
    - id: ch01
      title: The Wazir Gives Thanks
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long ago in Hindustan, two kings ruled countries that shared a border. One was a Hindu rajah, and the other was a Mohammedan badshah. Each wanted to be wealthier and more powerful than the other, so they were far from friendly. Still, they needed some way to prevent one quarrel after another. They drew up an agreement and placed their signatures and seals upon it. If anyone crossed from one kingdom into the other, whether that person was the least important subject or the greatest, the other king could seize and punish him.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One morning, the badshah and his chief wazir were about to begin the day's affairs. The king picked up a pen and used a sharp knife to trim it as he liked. The blade slipped and sliced off the tip of his finger.
        - id: ch01-b03
          speaker: badshah
          text: Wazir! I've cut off the tip of my finger!
          emotion: surprised
        - id: ch01-b04
          speaker: wazir
          text: That is good news to hear.
        - id: ch01-b05
          speaker: badshah
          text: >-
            You insolent man! Do my troubles please you, even when I am the one who suffers? Guards, take him to the court prison until I have time to give him the punishment he deserves!
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: >-
            The officers standing in attendance seized the unlucky wazir at once. They dragged him out of the king's presence and toward a narrow doorway. It was the door through which unhappy criminals were led away to prison or execution. As it opened to receive him, the wazir murmured something into his great white beard. The soldiers could not make it out.
        - id: ch01-b07
          speaker: badshah
          text: What did that rascal say?
          emotion: angry
        - id: ch01-b08
          speaker: gaoler
          text: He says he thanks Your Majesty.
        - id: ch01-b09
          speaker: narrator
          text: The king stared in anger and amazement as the door closed.
        - id: ch01-b10
          speaker: badshah
          text: >-
            He must be mad! He is grateful for other people's troubles and for his own as well. Something has surely turned his head.
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: >-
            Yet the king was very fond of his old wazir. The court physician bound the wounded finger with cool, healing ointment and eased its pain. But no one could ease the soreness in the king's heart. None of his ministers or courtiers could comfort him, and he remained cross all day.
    - id: ch02
      title: Across the Border
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Early the next morning, the king ordered his horse and announced that he was going hunting. At once, the stable and palace filled with bustle and preparation. By the time he was ready, twenty ministers and huntsmen were mounted and waiting to ride with him. To everyone's astonishment, he refused to let a single one come along. He glared so fiercely that they were glad to get away from him.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The badshah rode on and on, across fields and through forests. He was so gloomy and lost in thought that he never noticed the fat deer or bright pheasants escaping him. He paid just as little attention to his path. Without realizing it, he wandered across the border into the rajah's country.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Suddenly, men stepped out of a thicket on every side. There was nothing the king could do but surrender. They bound him and carried him to the rajah's prison. Most of the way, he thought about his wazir, now suffering much the same fate. He wished he, too, could believe there was something here to be thankful for.
        - id: ch02-b04
          speaker: narrator
          text: >-
            That night, the rajah called a special council to decide what to do with the rival who had placed himself so completely in his hands. He summoned all the Brahmans, fat priests who understood everything, including which days were lucky and which were unlucky. The rest of the council crowded around the rajah. One adviser offered a plan, then another pressed a different one, until the king was nearly mad with anger and uncertainty.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Meanwhile, the chief Brahman squatted in a corner, working through sums and signs. A group of lesser priests gathered around and watched admiringly. At last, he stood and approached the throne.
        - id: ch02-b06
          speaker: rajah
          text: Well? What do you advise?
        - id: ch02-b07
          speaker: chief_brahman
          text: >-
            This is a terribly unlucky day! The god Devi is furious. He commands you to cut off the badshah's head tomorrow and offer it to him as a sacrifice.
        - id: ch02-b08
          speaker: rajah
          text: Very well. It shall be done. I leave the sentence in your hands.
        - id: ch02-b09
          speaker: narrator
          text: The rajah bowed to the priests and left the room.
    - id: ch03
      title: The Sacrifice
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Before dawn, great preparations began for a festival honoring the idol Devi. Hundreds of banners waved overhead. Hundreds of drummers beat their drums, hundreds of singers chanted, and hundreds of priests washed and anointed themselves before performing the sacred rites. The rajah sat among hundreds of courtiers and servants. He was nervous and ill at ease, and he wished the whole business were safely over.
        - id: ch03-b02
          speaker: narrator
          text: >-
            At last, the moment came for the sacrifice. The poor badshah was led out in bonds to have his head cut off. The chief Brahman approached with a smile on his face and a large sword in his hand. Then he suddenly noticed a piece of cloth tied around the prisoner's finger.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The priest dropped the sword at once. His eyes bulged with excitement as he snatched away the cloth. There, for everyone to see, the tip of the badshah's finger was missing. The Brahman turned red with anger and led the prisoner to the puzzled rajah.
        - id: ch03-b04
          speaker: chief_brahman
          text: >-
            Look, O rajah! This sacrifice is worthless. The tip of his finger is gone, and an offering must be complete before it can be a true sacrifice.
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: The chief Brahman began to weep with rage and disappointment. The rajah did nothing of the kind. He sighed with relief.
        - id: ch03-b06
          speaker: rajah
          text: >-
            Then that settles it. I might not have minded if he were anyone else. But somehow, since he is a king, it never seemed quite right to sacrifice him.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The rajah sprang up, cut the badshah's ropes with his jeweled dagger, and marched beside him out of the temple and back to the palace.
    - id: ch04
      title: A New Agreement
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            After the badshah had bathed and refreshed himself, the rajah heaped gifts upon his guest. Then he personally escorted him, with a large company, all the way to the frontier between their kingdoms.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Salutes greeted the kings at the border, and people rejoiced all around them. Together, the two rulers tore their old agreement into pieces. Then they drew up another in its place. Each king promised to welcome the other king's people and protect them on their journey. From then on, anyone could cross the border on any errand, from the least important person in either kingdom to the greatest.
        - id: ch04-b03
          speaker: narrator
          text: The kings embraced. Then each returned to his own country.
    - id: ch05
      title: Why the Wazir Was Thankful
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: That very evening, as soon as the badshah reached home, he sent for his imprisoned wazir.
        - id: ch05-b02
          speaker: badshah
          text: Well, O wazir, what do you suppose has been happening to me?
        - id: ch05-b03
          speaker: wazir
          text: How could a man shut in prison know what is happening outside?
        - id: ch05-b04
          speaker: narrator
          text: >-
            The badshah told him the whole adventure. When he reached the end, he explained the decision he had made.
        - id: ch05-b05
          speaker: badshah
          text: >-
            I am so grateful to have escaped that I will pardon you freely. But first, tell me why you gave thanks when I cut off the tip of my finger.
        - id: ch05-b06
          speaker: wazir
          text: >-
            Sire, wasn't losing that fingertip very lucky for you? Without it, you would certainly have lost your head. Surely a tiny piece of a finger is the smaller of those two losses.
        - id: ch05-b07
          speaker: narrator
          text: The king touched his head as if to make absolutely sure it was still there.
        - id: ch05-b08
          speaker: badshah
          text: That is quite true. But why did you also give thanks when I put you in prison?
        - id: ch05-b09
          speaker: wazir
          text: >-
            I gave thanks because it is always good to be thankful. If I had known that prison would keep the god Devi from taking me in Your Majesty's place as a perfect offering, I would have given even greater thanks.
