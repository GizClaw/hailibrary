audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    geirlaug_father:
      display_name: 盖尔劳格的父王
      tts:
        delivery: 威严宽厚，对亲人温柔而信任
        timbre: 浑厚稳重的成年男声
        pace: 适中偏慢
        pitch: 低
    geirlaug_mother:
      display_name: 盖尔劳格的母后
      tts:
        delivery: 温柔慈爱，受惊时气息轻颤
        timbre: 柔和端庄的成年女声
        pace: 舒缓
        pitch: 中
    grethari_father:
      display_name: 格雷塔里的父王
      tts:
        delivery: 果断正直，年老后多一分慈爱
        timbre: 明朗厚实的成年男声
        pace: 适中
        pitch: 中低
    grethari_mother:
      display_name: 格雷塔里的母后
      tts:
        delivery: 温婉真挚，重逢时满含激动
        timbre: 温润柔和的成年女声
        pace: 舒缓
        pitch: 中
    old_attendant:
      display_name: 老女侍从
      tts:
        delivery: 忠诚慈祥，忧虑中仍沉着周全
        timbre: 温厚略显苍老的女声
        pace: 舒缓
        pitch: 中低
    witch_queen:
      display_name: 女巫王后
      tts:
        delivery: 外表高贵，言语中藏着冷酷与暴躁
        timbre: 冷艳尖锐的成年女声
        pace: 适中偏慢
        pitch: 中低
    guard_1:
      display_name: 卫士甲
      tts:
        delivery: 忠厚谨慎，回答干脆
        timbre: 结实清楚的成年男声
        pace: 适中
        pitch: 中低
    guard_2:
      display_name: 卫士乙
      tts:
        delivery: 老实克制，随同同伴应答
        timbre: 平实的成年男声
        pace: 适中
        pitch: 中
    guard_3:
      display_name: 卫士丙
      tts:
        delivery: 谨慎顺从，语气简短
        timbre: 清晰的青年男声
        pace: 适中
        pitch: 中
    steward:
      display_name: 管事
      tts:
        delivery: 恭敬小心，面对王后时压着恐惧
        timbre: 平稳清楚的成年男声
        pace: 适中
        pitch: 中
    courtier_1:
      display_name: 臣子甲
      tts:
        delivery: 小心翼翼，私语中带着如释重负
        timbre: 低沉的成年男声
        pace: 适中偏快
        pitch: 中低
    courtier_2:
      display_name: 臣子乙
      tts:
        delivery: 谨慎含蓄，随声附和
        timbre: 清楚的成年男声
        pace: 适中
        pitch: 中
    geirlaug:
      display_name: 盖尔劳格
      tts:
        delivery: 聪慧坚韧，温柔中自有决断
        timbre: 清澈沉静的年轻女声
        pace: 适中
        pitch: 中
    grethari:
      display_name: 格雷塔里
      tts:
        delivery: 真诚直率，年轻时略显莽撞迟钝
        timbre: 明亮结实的青年男声
        pace: 适中偏快
        pitch: 中
    forester_daughter:
      display_name: 守林人的女儿
      tts:
        delivery: 爽快朴实，待人热心
        timbre: 自然清亮的年轻女声
        pace: 适中
        pitch: 中
    foreign_princess:
      display_name: 邻国公主
      tts:
        delivery: 骄矜任性，不耐烦时尖刻急促
        timbre: 华丽偏冷的年轻女声
        pace: 适中偏快
        pitch: 中高
    hen:
      display_name: 母鸡
      tts:
        delivery: 哀怨质问，吐字清楚有力
        timbre: 细亮而奇异的女声
        pace: 适中
        pitch: 高
  chapters:
    - id: ch01
      title: 龙从天而降
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天，一位强大的国王和美丽的王后坐在都城花园里，认真商量小王子的将来。孩子睡在身边的金摇篮中。夫妻俩多年没有儿女，自从这个婴儿降生，就觉得自己比世上任何人都幸福。小王子长得结实，爱蹬腿，也爱挥动小拳头。其实，不管他长成什么模样，在父母眼里，他都是世上最了不起的宝贝。两人只顾着替孩子筹划，根本没发现一个巨大的黑影已经悄悄罩过来。等那颗长着闪亮利齿的可怕脑袋伸到眼前，一切都迟了。眨眼之间，孩子和摇篮都被抢走了。
        - id: ch01-b02
          speaker: narrator
          text: 国王和王后吓得呆住，一句话也说不出来。过了一会儿，国王才慢慢站起，伸手扶起妻子，领着哭泣的她回宫。此后许多天，臣民们都没有再见到他们。
        - id: ch01-b03
          speaker: narrator
          text: 龙用牙齿衔着摇篮，直飞到高空，婴儿却还安稳地睡着。它很快越过国境，又看见另一个国家的国王和王后坐在花园里。他们身边有个小姑娘，睡在白缎和蕾丝装点的摇篮中。龙从背后俯冲下去，也想抢走她。就在这时，国王猛地起身，用金杖狠狠打中它。龙痛得往后一缩，展翅逃走，嘴里的男婴也掉了下来。
        - id: ch01-b04
          speaker: grethari_father
          text: 好险，差一点就让它得手了。
        - id: ch01-b05
          speaker: narrator
          text: 王后脸色惨白，把自己的女儿紧紧抱住。
        - id: ch01-b06
          speaker: grethari_mother
          text: 太可怕了。可是你看，那边亮闪闪的东西是什么？
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: 国王顺着她指的方向走去，竟看见另一架摇篮，里面也有一个婴儿。
        - id: ch01-b08
          speaker: grethari_father
          text: 那怪物准是来抢盖尔劳格时，把这个孩子带来的。
        - id: ch01-b09
          speaker: narrator
          text: 他俯身读出细麻布上的字。孩子名叫格雷塔里，是邻国格雷塔里国王的儿子。偏偏两位君主曾经大吵一场，已经多年不相往来。这位国王没有派人去报平安，而是收养了男婴，让他和盖尔劳格公主一起长大。
        - id: ch01-b10
          speaker: narrator
          text: 两个孩子天天一起玩，过得无忧无虑。后来，王后病了。起初，她还能躺在软垫上看他们赛跑、捉迷藏。渐渐地，她连这也做不到了。宫里人人压低声音，孩子们走近她的房间，也会放轻脚步。终于有一天早晨，国王红着双眼告诉他们，王后去世了。
        - id: ch01-b11
          speaker: narrator
          text: 盖尔劳格和格雷塔里伤心极了。幸好，照顾他们的老女侍从善良又慈爱。两个孩子从小住在国王为他们修建的高塔里。国王忙于政务或远行时，老妇便照顾他们的生活，也让他们学会王子和公主应当懂得的一切。这样又过了两三年。一天，他们正焦急地等候父亲从远方回来，一名传令官快马赶进王宫，说国王将带着新妻子回来了。
    - id: ch02
      title: 女巫王后的追杀
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 国王再婚本不是什么怪事，可老女侍从很快看出，新王后虽然美貌，却是个女巫。她嫉妒每一个可能影响丈夫的人。老妇想到两个孩子，夜夜睡不安稳。几个月后，隔海的国家挑起战争，国王亲自领兵出征。老妇最担心的事终于来了。一天夜里，她一反常态地沉沉睡去。事后她确信，有人在食物里下了药。女巫趁机登上高塔。没有人知道她做了什么，可天亮时，两个孩子的床全空了。
        - id: ch02-b02
          speaker: narrator
          text: 王后召来三名卫士，说自己梦见野兽会带来灾祸，命他们杀掉王宫方圆两英里内的每一只动物。卫士们找遍四周，只看见两匹漂亮得出奇的黑色小马驹。他们觉得两匹小马不可能伤害谁，也舍不得杀，便放任它们蹦跳着跑过平原。
        - id: ch02-b03
          speaker: witch_queen
          text: 你们当真什么也没看见？一点也没有？
        - id: ch02-b04
          speakers: [guard_1, guard_2, guard_3]
          ensemble: chorus
          text: 什么也没看见，陛下。
        - id: ch02-b05
          speaker: narrator
          text: 王后根本不信。她叫管事在晚餐时不断给卫士灌烈酒，再把他们酒后说漏的话一字不差地报上来。深夜，管事来到王后的寝宫。
        - id: ch02-b06
          speaker: steward
          text: 陛下，我照您的吩咐办了。可他们确实说了实话。我听完了所有醉话，他们真的只见过两匹黑色小马驹。
        - id: ch02-b07
          speaker: narrator
          text: 他还想解释，王后眼里的怒火却吓得他连忙鞠躬，倒退着逃了出去。一个星期后，国王凯旋，臣子们总算松了口气。
        - id: ch02-b08
          speakers: [courtier_1, courtier_2]
          ensemble: duo
          text: 这下她也许会找别人吼叫了。
        - id: ch02-b09
          speaker: narrator
          text: 这些天，王后不停拿侍从出气。臣子们以为国王回来作主，日子就会好起来。可第一天夜里，王后就讲起那个噩梦，央求国王第二天出城，把两英里内见到的所有活物都杀死。国王总相信她的话，便答应了。
        - id: ch02-b10
          speaker: narrator
          text: 第二天，他还没骑出环绕王宫的花园，便听见两只蓝色小鸟在结着红果的冬青树上歌唱。那歌声让他想起自己听过、想象过的一切美好事物。他坐在那里听了一个钟头又一个钟头，怎么也不知道，这两只鸟正是盖尔劳格和格雷塔里。天黑以后，鸟儿终于收声，国王也猛然惊醒。当天，他已经来不及兑现承诺了。
        - id: ch02-b11
          speaker: witch_queen
          text: 你看见什么了吗？
        - id: ch02-b12
          speaker: geirlaug_father
          text: 亲爱的，说来惭愧。我还没骑到西门，就听见两只奇异的蓝鸟唱歌。那声音让我忘了世上的一切。直到天黑，我才想起自己本来要去做什么。不过明天，我一定满足你的心愿。
        - id: ch02-b13
          speaker: witch_queen
          text: 不会有明天了。
          emotion: angry
        - id: ch02-b14
          speaker: narrator
          text: 她转过身去，眼里闪着诡异的光。国王没有听见那句话。当天夜里，他为庆祝胜利举行盛宴。三名卫士负责保护王后，宴会上总坐在国王身旁。王后悄悄把发作缓慢的毒药撒进他们的酒杯。天还没亮，国王便死了，三名卫士也只剩最后一口气。王后哭得比任何人都响。隆重的葬礼一结束，她却宣布，要去远方的城堡守丧一年。她留下摄政者，只带着一个知晓全部秘密的女仆上路。
        - id: ch02-b15
          speaker: narrator
          text: 离开王宫以后，女巫立刻施法寻找两个孩子。盖尔劳格曾跟一位旧日的家庭女教师学过魔法，及时看穿了继母的图谋。她把自己变成鲸，把义兄变成鲸鳍。女巫则化作鲨鱼，在海中追上来。鲸和鲨鱼恶战了几个钟头，海水都被染红。围观的小鱼一会儿觉得鲨鱼要赢，一会儿又看见鲸占了上风。最后，鲸终于杀死鲨鱼，自己也筋疲力尽，只能拖着伤躯游进安静的小海湾。她在那里躺了三天，几乎像死去一样。三天后伤口愈合，她才开始思量以后的路。
        - id: ch02-b16
          speaker: geirlaug
          text: 我们去你父亲的王国吧。
        - id: ch02-b17
          speaker: grethari
          text: 你真聪明！我怎么一点也没想到？
        - id: ch02-b18
          speaker: narrator
          text: 格雷塔里说的是实话，他本来就不聪明。盖尔劳格拿出一小盒白色粉末，朝两人身上撒了撒。比闪电还快，他们已经来到格雷塔里幼年失踪的王宫庭园。
    - id: ch03
      title: 被遗忘的盖尔劳格
      blocks:
        - id: ch03-b01
          speaker: geirlaug
          text: 把绣着金字的带子系在额头上，大胆走进城堡。可是记住，不论有多渴，见到你父亲以前，什么也不能喝。你若喝了，我们两个都会遭殃。
        - id: ch03-b02
          speaker: grethari
          text: 我怎么会口渴？走到城堡大门连五分钟也用不了。
        - id: ch03-b03
          speaker: narrator
          text: 盖尔劳格没有回答，只忧伤地看着他。最后，她说了声再见，转身吻了吻他。格雷塔里本来没说错，那段路看起来怎么也走不了五分钟。可敞开的城堡大门一直在眼前，连里面帷幔的颜色都看得清，偏偏怎么走也走不近。太阳越来越热，他的舌头也越来越干。
        - id: ch03-b04
          speaker: grethari
          text: 我到底怎么了？为什么走了这么久，还到不了城堡？
        - id: ch03-b05
          speaker: narrator
          text: 他的膝盖累得发抖，脑袋也开始眩晕。又踉跄着走了几步，他忽然听见水声。路边的小树林里，一道溪流正从岩石上落下来。他立刻忘记了自己的承诺，穿过扯破衣服的荆棘，扑倒在泉边，拿起挂在树上的金杯，痛快地喝了一大口。
        - id: ch03-b06
          speaker: narrator
          text: 等他站起来，盖尔劳格和从前的生活已经全从记忆里消失。城堡门口，一对白发苍苍的男女向他张开双臂。看见他们，他心里还有一种说不清的感觉轻轻动了一下。
        - id: ch03-b07
          speakers: [grethari_father, grethari_mother]
          ensemble: duo
          text: 格雷塔里！你终于回家了！
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: 盖尔劳格在原地等了三个钟头，终于猜到出了什么事。她虽然难过，却马上拿定主意。她绕着王家园林的高墙走到一座小屋。那里住着守林人和他的两个女儿。
        - id: ch03-b09
          speaker: geirlaug
          text: 你们需要姑娘扫地、挤牛奶吗？
        - id: ch03-b10
          speaker: forester_daughter
          text: 正需要呢。你看起来强壮又爱干净，愿意的话，就来我们家做女佣吧。不过，你叫什么名字？
        - id: ch03-b11
          speaker: geirlaug
          text: 劳弗莎。
        - id: ch03-b12
          speaker: narrator
          text: 她不愿暴露身份，随口给自己取了这个名字。进屋以后，她立刻请新主人教自己做事。她又聪明又能干，很快整个王国都传开了。人人都说，住在守林人家的陌生姑娘，无论本领还是美貌都无人能比。岁月过去，盖尔劳格长大成人。她有时看见格雷塔里骑马进森林打猎，总会躲到大树后面。想到他已经忘了自己，她的心仍然会疼。
        - id: ch03-b13
          speaker: narrator
          text: 一天，盖尔劳格正在采药草，格雷塔里突然来到她面前，她再也来不及躲。她把脸和双手染成褐色，又用红帽子盖住美丽的头发，所以格雷塔里没有认出自己的义妹。
        - id: ch03-b14
          speaker: grethari
          text: 美丽的姑娘，你叫什么名字？
        - id: ch03-b15
          speaker: geirlaug
          text: 我叫劳弗莎。
        - id: ch03-b16
          speaker: narrator
          text: 她向他屈膝行礼。
        - id: ch03-b17
          speaker: grethari
          text: 原来你就是大家常说的那个姑娘。你这样美，不该一辈子服侍守林人的女儿。跟我回王宫吧，我母后会让你做她的女侍从。
        - id: ch03-b18
          speaker: geirlaug
          text: 那真是天大的福气。您要是当真，我就跟您走。可是，我怎么知道您不是在取笑我？
        - id: ch03-b19
          speaker: grethari
          text: 你让我替你做一件事吧。不论什么，我都办到。
        - id: ch03-b20
          speaker: geirlaug
          text: 那就去牲口棚，把小牛好好拴住，别让它夜里挣脱跑掉。守林人一家待我很好，我不能把没做完的活儿丢给他们。
        - id: ch03-b21
          speaker: narrator
          text: 格雷塔里走进牲口棚，把绳子绕上牛角，又把牛系在墙边。可一圈绳索忽然缠住了他的手腕，怎么拉也挣不开。他扭动挣扎了一整夜，累得只剩半条命。太阳升起时，绳子突然松开了。他气冲冲地拖着身子回宫。
        - id: ch03-b22
          speaker: grethari
          text: 她是个女巫，我再也不理她了。
          emotion: angry
        - id: ch03-b23
          speaker: narrator
          text: 他倒在床上，整整睡了一天。
    - id: ch04
      title: 一头牛拉来的婚礼
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 不久，国王和王后派格雷塔里出使邻国，让他从七位公主中挑一位新娘。他当然挑中了最美的那位。两人立刻乘船回国。一路顺风，船也很快，不久便抵达离城堡最近的港口。海滩旁停着华丽的马车，却连一匹马也没有。原来，国王为了庆祝儿子成婚，要在当天举行盛大校阅，所有马匹都被牵走了。
        - id: ch04-b02
          speaker: foreign_princess
          text: 我可不在这里等上一整天。我已经累坏了。你去找个东西拉车，哪怕找头驴也行。要是找不到，我马上坐船回父王那里。
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: 格雷塔里十分为难。航行途中，公主好几次显出虚荣和坏脾气，他并没有多么爱她。可是身为王子和新郎，他受不了有人怠慢自己的新娘，便赶紧派随从去找牲畜。
        - id: ch04-b04
          speaker: narrator
          text: 公主坐在金马车里，用缀满银蜜蜂的蓝丝绒斗篷把自己裹得严严实实，连鼻尖也不露出来。等了很久，一个姑娘终于赶着小公牛出现，身后还跟着王子的使者。
        - id: ch04-b05
          speaker: grethari
          text: 美丽的姑娘，你能把牛借给我吗？价钱随你开，我一定痛快付清。王子落到这种窘境，可真是从来没有过。
        - id: ch04-b06
          speaker: geirlaug
          text: 我要的价钱，是婚宴上在你和新娘身后给我和两个朋友留下三个座位。
        - id: ch04-b07
          speaker: narrator
          text: 格雷塔里高兴地答应了。一头牛拉起马车，跑得比六匹马还快。树木和田野从窗外飞过，公主被颠得头晕，以为马车随时都会翻倒。可他们平安到了王宫，国王和王后都看呆了。婚礼筹备得飞快，不到周末，一切都安排好了。这些天，公主一门心思挑衣裙首饰，没有工夫理会格雷塔里。等婚礼来到，他也差不多忘了她在路上有多蛮横。
        - id: ch04-b08
          speaker: narrator
          text: 城里最年长的人都说，从未见过这样华丽的婚礼队伍。仪式开始以前，众人先到大厅赴宴。公主知道所有目光都在自己身上，心情好极了。她挽着王子的手，一路微笑点头，骄傲地走到长桌上首，在新郎身边坐下。
        - id: ch04-b09
          speaker: narrator
          text: 三位陌生女子随后悄悄走进来。她们穿着蓝、绿、红三色闪亮长裙，就坐在年轻人身后的空长凳上。红衣女子是盖尔劳格，另外两人是守林人的女儿。盖尔劳格一手握着桦树皮魔杖，一手提着盖严的篮子。宴席继续，几乎没人留意她们。看见的人，也只当她们是未来王后的侍女。
        - id: ch04-b10
          speaker: narrator
          text: 欢宴正热闹时，盖尔劳格打开篮子。一只公鸡和一只母鸡飞出来，绕着王子和新娘盘旋。公鸡不停啄掉母鸡尾巴上的羽毛，母鸡拼命闪躲，却怎么也逃不开。
        - id: ch04-b11
          speaker: hen
          text: 你也要像格雷塔里对待盖尔劳格那样狠心地对待我吗？
          emotion: sad
        - id: ch04-b12
          speaker: narrator
          text: 格雷塔里听见这句话，猛地站起。所有往事在一瞬间涌回心头。他忘了身边的新娘，只看见许多年前陪自己玩耍的那个孩子。
        - id: ch04-b13
          speaker: grethari
          text: 盖尔劳格在哪里？
          emotion: surprised
        - id: ch04-b14
          speaker: narrator
          text: 他环顾大厅，终于望见陌生的红衣女子。盖尔劳格微笑着伸出手，掌心里放着一枚戒指。那是他们小时候，格雷塔里在她十二岁生日时送出的礼物。那时两人还从没想过未来。
        - id: ch04-b15
          speaker: grethari
          text: 我要娶的人只有你，谁也不能代替。
        - id: ch04-b16
          speaker: narrator
          text: 他握住盖尔劳格的手，把她领到宾客中间。
    - id: ch05
      title: 真正的新娘
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 接下来的场面很难说清。谁也不知道发生了什么，国王和王后还以为儿子突然疯了。遭到抛弃的公主更是怒不可遏。宾客们赶紧离开大厅，让王室一家自己处理这场风波。
        - id: ch05-b02
          speaker: narrator
          text: 最后，众人商定，不给那位公主一个丈夫，而把半个王国送给她补偿。她立刻乘船回国，不久便和一位年轻贵族订了婚。其实，她喜欢那位贵族，远远胜过喜欢格雷塔里。
        - id: ch05-b03
          speaker: narrator
          text: 当天晚上，格雷塔里和盖尔劳格举行了婚礼。他们幸福相伴，一直活到生命尽头，也让所有臣民都过上了幸福的日子。
        - id: ch05-b04
          speaker: narrator
          text: 这个故事选自《冰岛民间故事集》。
