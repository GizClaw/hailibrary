  chapters:
    - id: ch01
      title: The Dragon and the Two Children
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One day, a powerful king and his beautiful wife sat together in the gardens of their capital city. Beside them, their little son slept soundly in a beautiful golden cradle while they talked earnestly about the life he would have. They had been married for many years without a child. When this baby finally came, they believed they were the happiest couple in the whole world. He was a fine, sturdy little boy who loved to kick and strike out with his fists. Yet even if he had been weak and tiny, they would still have thought him the most wonderful creature on earth.
        - id: ch01-b02
          speaker: narrator
          text: >-
            They were so busy making plans that they never saw the enormous shadow creeping toward them. A horrible head bent over the cradle, its teeth gleaming. In an instant, a dragon snatched their beloved baby away. The king and queen sat frozen with horror. At last the king rose, held out his hand, and led his weeping wife into the palace. For many days, their people saw nothing of them.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The dragon soared high into the air with the cradle gripped between his teeth, and still the baby slept. He flew so fast that he soon crossed into another kingdom. There he saw another king and queen in a garden, with their baby daughter lying in a cradle of white satin and lace. The dragon swooped down behind them. Just as he reached for the cradle, the king leaped up and struck him with a golden staff. The blow drove the dragon back, and the pain made him drop the little boy before he escaped into the sky.
        - id: ch01-b04
          speaker: geirlaug_father
          text: That was far too close.
        - id: ch01-b05
          speaker: narrator
          text: The queen sat pale with fear, clutching her daughter tightly.
        - id: ch01-b06
          speaker: geirlaug_mother
          emotion: fearful
          text: Terrible! But look over there. What is that shining thing on the ground?
        - id: ch01-b07
          speaker: narrator
          text: >-
            The king followed her pointing finger. To his amazement, he found another cradle with another baby inside.
        - id: ch01-b08
          speaker: geirlaug_father
          emotion: surprised
          text: The monster stole this child, just as he tried to steal Geirlaug!
        - id: ch01-b09
          speaker: narrator
          text: The king bent down and read the words sewn onto the fine linen wrapped around the boy.
        - id: ch01-b10
          speaker: geirlaug_father
          text: This is Grethari, son of King Grethari.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Unfortunately, the two neighboring kings had quarreled bitterly. For several years, they had refused to communicate with each other. So Geirlaug's father did not send a messenger to tell King Grethari that his son was safe. He simply adopted the baby instead, and the little boy was brought up beside Princess Geirlaug.
        - id: ch01-b12
          speaker: narrator
          text: >-
            For a time, the children were happy from morning to night. Their queen raced with them and played hide-and-seek in the garden. Then she grew too weak to play and could only watch from a heap of soft cushions. Before long, even that was too much. People lowered their voices near her room, and Geirlaug and Grethari learned to walk quietly there. One morning, the king called them to him. His eyes were red from weeping as he told them the queen had died.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Both children grieved deeply, for they had loved the queen dearly, and without her the whole world seemed dull. A kind and good old lady-in-waiting cared for them in the tower that had been built for them when they were babies. Whenever the king was busy or traveling through some distant part of his kingdom, she found ways to make them happy. She also saw that they were taught everything a prince and princess ought to know.
    - id: ch02
      title: The Witch in the Palace
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Two or three years passed. Then, while the children anxiously waited for their father to return from a distant city, a herald galloped into the palace courtyard. The king was coming home with a new wife.
        - id: ch02-b02
          speaker: narrator
          text: >-
            There was nothing so strange or dreadful in the king marrying again. But the old lady-in-waiting soon understood that the beautiful new queen was a witch. Anyone who might gain influence over the king made the queen jealous, and that meant danger for Geirlaug and Grethari. Their faithful guardian lay awake at night worrying about the children in her care. A few months after the wedding, war broke out against a country across the sea. The king rode away at the head of his troops, and the old woman's heart sank.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Then the thing she had feared came to pass. One night, she slept far more heavily than usual. Later she was certain someone had drugged her food. The witch entered the tower, though no one ever knew exactly what she did there. By sunrise, the children's beds were empty.
        - id: ch02-b04
          speaker: narrator
          text: >-
            At dawn, the queen called several guards before her. She claimed that a dream had warned her some wild beast would bring her harm.
        - id: ch02-b05
          speaker: witch_queen
          text: Go out and kill every animal you find within two miles of the palace.
        - id: ch02-b06
          speaker: narrator
          text: >-
            The guards searched the whole area, but the only animals they found were two wonderfully beautiful black foals. The pair looked as if they would one day be fine enough for the king himself to ride. The men thought it would be a great shame to kill them. After all, what harm could two little foals possibly do to anyone? They let the animals run away, frisking freely across the plain, and returned to the palace without them.
        - id: ch02-b07
          speaker: witch_queen
          text: You saw nothing? Truly nothing at all?
        - id: ch02-b08
          speakers: [guard_1, guard_2, guard_3]
          ensemble: chorus
          text: Nothing, Your Majesty.
        - id: ch02-b09
          speaker: narrator
          text: >-
            The queen did not believe them. After they left, she ordered her steward to fill their cups with strong drink at supper. He was to listen closely once their tongues loosened and report every word they let slip.
        - id: ch02-b10
          speaker: steward
          text: >-
            I carried out your orders, Your Majesty, but the men really did tell you the truth. I listened to their talk from beginning to end. They saw nothing at all except two black foals.
        - id: ch02-b11
          speaker: narrator
          text: >-
            The steward might have said more, but the queen's blazing eyes frightened him. He bowed and hurried backward out of the room.
        - id: ch02-b12
          speaker: narrator
          text: >-
            A week later, the king returned home. All the courtiers were very glad to see him. During those days, the queen had poured out her rage on one attendant after another, though no one knew what had happened to make her so angry.
        - id: ch02-b13
          speakers: [courtier_1, courtier_2]
          ensemble: duo
          text: Perhaps now she'll find someone else to shout at.
        - id: ch02-b14
          speaker: narrator
          text: >-
            They hoped life would improve with the king ruling the palace again. Their relief did not last. On his very first night home, the queen told him about her dream. She begged him to ride out the next morning and kill every living creature he saw within two miles of the city. The king believed everything she told him, so he promised.
        - id: ch02-b15
          speaker: narrator
          text: >-
            He had not even passed through the lovely palace gardens when two little blue birds caught his attention. They perched on a holly bush covered in scarlet berries and sang more beautifully than anything he had ever heard or imagined. He listened hour after hour, never guessing that the birds were Geirlaug and Grethari. Darkness fell before their song stopped. The king came to himself with a start and realized he had not kept his promise.
        - id: ch02-b16
          speaker: witch_queen
          text: Well? Did you find anything?
        - id: ch02-b17
          speaker: geirlaug_father
          text: >-
            My dear, I am almost ashamed to admit what happened. Before I even rode as far as the western gate, I heard two strange little blue birds singing. Their song made me forget everything else in the world. You may find it hard to believe, but darkness had already fallen before I remembered where I was and what I should have been doing. Tomorrow, though, nothing will keep me from carrying out your wish.
        - id: ch02-b18
          speaker: witch_queen
          text: There will be no tomorrow.
        - id: ch02-b19
          speaker: narrator
          text: She turned away with a curious gleam in her eyes, and the king did not hear her.
    - id: ch03
      title: The Battle at Sea
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            That night, the king gave a great supper at the palace to celebrate his victory over the enemy. The three guards whom the queen had sent to kill the wild animals held trusted positions in the royal household. They were responsible for protecting the queen herself. Whenever a feast was held, their places were always next to the king. This made it easy for the queen to scatter a slow but deadly poison into their cups and the king's cup without anyone noticing.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Before dawn, the whole palace woke to terrible news. The king was dead, and the three officers of the guard were dying too. No one's cries and mourning were louder than the queen's. Once the magnificent funeral was over, she announced that she would shut herself away in a distant castle until her year of mourning had ended. She appointed a regent to govern the kingdom, then set out with only one maid, a woman who knew every one of her secrets.
        - id: ch03-b03
          speaker: narrator
          text: >-
            As soon as she left the palace, the witch began casting spells to discover the forms in which Geirlaug and Grethari were hiding. Luckily, a former governess had taught the princess magic. Geirlaug uncovered her stepmother's wicked plan just in time. She changed herself into a whale and Grethari into the whale's fin. The queen became a shark and raced after them.
        - id: ch03-b04
          speaker: narrator
          text: >-
            For several hours, whale and shark fought fiercely, and the sea around them turned red with blood. At first one gained the advantage, and then the other fought back. A crowd of little fish gathered around to watch the battle. At last, it became clear to them that the whale would win. After one final, mighty struggle, the shark floated dead and harmless on the surface of the water.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The whale had won, but she was almost spent. She barely had strength to drag her wounded body into a quiet bay. For three days, she lay as still as if she too were dead. At the end of the third day, her wounds had healed, and she began to consider what they should do next.
        - id: ch03-b06
          speaker: narrator
          text: Geirlaug and Grethari took their own shapes again and sat on a high cliff above the sea.
        - id: ch03-b07
          speaker: geirlaug
          text: We should go back to your father's kingdom.
        - id: ch03-b08
          speaker: grethari
          text: How clever you are! That never would have occurred to me.
        - id: ch03-b09
          speaker: narrator
          text: >-
            In truth, Grethari was not clever at all. Geirlaug took a little box of white powder from her dress and scattered some over each of them. Quicker than lightning, they appeared in the palace grounds where the dragon had stolen Grethari so many years before.
    - id: ch04
      title: The Cup by the Stream
      blocks:
        - id: ch04-b01
          speaker: geirlaug
          text: >-
            Tie the band with the golden letters around your forehead, then walk boldly up to the castle. And remember this. However thirsty you become, do not drink anything before you speak to your father. If you do, harm will come to both of us.
        - id: ch04-b02
          speaker: grethari
          text: >-
            Why would I become thirsty? The castle gate is less than five minutes away.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Geirlaug said nothing, but sadness showed in her eyes.
        - id: ch04-b04
          speaker: geirlaug
          emotion: sad
          text: Good-bye.
        - id: ch04-b05
          speaker: narrator
          text: Then she turned and kissed him.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Grethari had spoken truly when he said he could reach the castle in five minutes. At least, no one looking at it would have dreamed the walk could take any longer. Yet, to his surprise, the castle never came nearer. Its door stood so widely open that he could see the color of the hangings inside, but the distance between them did not seem to shrink. The sun burned hotter every moment, and his tongue grew parched with thirst.
        - id: ch04-b07
          speaker: grethari
          text: >-
            I don't understand. What is happening to me? Why haven't I reached the castle yet?
        - id: ch04-b08
          speaker: narrator
          text: >-
            His knees began knocking with weariness, and his head started to swim. He staggered blindly forward for a few more steps. Then the sound of rushing water reached his ears. In a little wood beside the path, he saw a stream tumbling over a rock. The sight drove Geirlaug's warning from his mind. He fought through brambles that tore at his clothes, threw himself down beside the spring, and seized a golden cup that hung from a tree. Then he filled it and took one deep drink.
        - id: ch04-b09
          speaker: narrator
          text: >-
            When Grethari rose from the spring, every memory of Geirlaug had vanished. His whole past life had disappeared with it. Yet something stirred faintly inside him at the sight of a white-haired man and woman. They stood together in the open castle door, holding out their arms to welcome him.
        - id: ch04-b10
          speakers: [grethari_father, grethari_mother]
          ensemble: duo
          emotion: happy
          text: Grethari! You have come home at last!
        - id: ch04-b11
          speaker: narrator
          text: >-
            Geirlaug waited for three hours in the very place where Grethari had left her. By then, she understood what must have happened. Her heart was heavy, but she soon decided what she had to do. She pushed her way out of the wood and walked beside the high wall enclosing the royal park and gardens. At last she reached a small house where the king's forester lived with his two daughters.
        - id: ch04-b12
          speaker: geirlaug
          text: Do you need a girl to sweep the house and milk the cows?
        - id: ch04-b13
          speaker: forester_daughter
          text: >-
            We badly need one. You look strong and clean, so you may work for us if you wish. But first, what is your name?
        - id: ch04-b14
          speaker: geirlaug
          text: Lauphertha.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Geirlaug answered quickly because she wanted no one to know who she really was. She followed her new mistress inside and asked to begin learning her work at once. She was so capable that, before long, people across the kingdom were saying no one could match the strange girl's skill or beauty.
    - id: ch05
      title: Lauphertha's Task
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The years slipped by, and Geirlaug grew into a woman. From time to time, she caught a glimpse of Grethari as he rode into the forest to hunt. Whenever she saw him coming, she hid behind the great trees because the pain of his forgetting her had never left. One day, she was gathering herbs when he appeared so suddenly that she had no chance to escape. She had stained her face and hands brown and covered her beautiful hair with a scarlet cap. Grethari looked at her, but he did not guess that the servant girl was the foster sister of his childhood.
        - id: ch05-b02
          speaker: grethari
          text: What is your name, pretty maiden?
        - id: ch05-b03
          speaker: narrator
          text: The girl made a low curtsy.
        - id: ch05-b04
          speaker: geirlaug
          text: Lauphertha.
        - id: ch05-b05
          speaker: grethari
          text: >-
            So you are the girl everyone praises. You are much too beautiful to spend your life serving the forester's daughters. Come to the palace with me. My mother, the queen, will make you one of her ladies-in-waiting.
        - id: ch05-b06
          speaker: geirlaug
          text: >-
            That would be a wonderful change in my fortune. If you truly mean it, I will go. But how can I be sure you are not making fun of me?
        - id: ch05-b07
          speaker: grethari
          text: Give me any task, and I will do it for you.
        - id: ch05-b08
          speaker: narrator
          text: Geirlaug lowered her eyes before she answered.
        - id: ch05-b09
          speaker: geirlaug
          text: >-
            Go to the stable and tie up the calf so it cannot break loose and wander off tonight. The forester and his daughters have been good to me. I will not leave while any of my work for them remains undone.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Grethari went straight to the stable where the calf stood. He wound the rope around its horns and tied the animal firmly to the wall. Then he discovered that one coil had somehow twisted around his own wrist. He pulled at it again and again, but he could not get free. All night long he wriggled and struggled until he was half dead with exhaustion. The instant the sun rose, the rope suddenly fell away. Grethari was furious with the maiden, and he dragged himself slowly back to the palace.
        - id: ch05-b11
          speaker: grethari
          emotion: angry
          text: She is a witch. I want nothing more to do with her.
        - id: ch05-b12
          speaker: narrator
          text: He threw himself onto his bed and slept all day.
        - id: ch05-b13
          speaker: narrator
          text: >-
            Not long after this strange adventure, the king and queen sent their beloved son as an ambassador to a neighboring country. His task was to choose a bride from among seven princesses. He chose the most beautiful sister, of course, and the young pair boarded a ship without delay to return to his parents' kingdom. The wind stayed fair, and the vessel was so swift that they reached the harbor nearest the castle much sooner than anyone could have expected.
        - id: ch05-b14
          speaker: narrator
          text: >-
            A splendid carriage waited by the beach, but there were no horses. Every horse had been taken to a great review the king was holding in honor of his son's marriage.
        - id: ch05-b15
          speaker: foreign_princess
          emotion: angry
          text: >-
            I will not sit here all day. I am worn out already. Find something to pull this carriage, even if it is only a donkey. Otherwise, I am sailing straight home to my father.
        - id: ch05-b16
          speaker: narrator
          text: >-
            The princess's words greatly troubled poor Grethari. It was not that he loved her very much. During the voyage, she had shown him several times just how vain and bad-tempered she was. But he was both a prince and a bridegroom, and he could not bear to think that anyone had treated his bride with disrespect. He hurriedly ordered his attendants to search for some animal, any animal, and bring it at once to the place where they waited.
    - id: ch06
      title: The Wedding Feast
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            During the long wait, the princess stayed inside the beautiful golden coach. She wrapped her blue velvet cloak tightly around herself. It was patterned all over with silver bees, and she pulled it so close that not even the tip of her nose could be seen. At last, a girl appeared on the road, driving a young ox ahead of her. One of the prince's messengers followed close behind and talked to her eagerly as they approached.
        - id: ch06-b02
          speaker: grethari
          text: >-
            Fair maiden, will you lend me your ox? Name your price, and I will gladly pay it. Never has a king's son found himself in such trouble.
        - id: ch06-b03
          speaker: geirlaug
          text: >-
            My price is three seats at the wedding feast, for me and my two friends. We must sit behind you and your bride.
        - id: ch06-b04
          speaker: narrator
          text: >-
            Grethari gladly agreed to her price. The young ox set off, and even six horses could not have pulled the coach at such speed. Trees and fields seemed to fly past the windows. The bride grew so dizzy that she expected the carriage to overturn at any moment. Yet, despite all her fears, nothing went wrong. The ox brought them safely to the palace door, where their arrival filled the waiting king and queen with amazement.
        - id: ch06-b05
          speaker: narrator
          text: >-
            The palace hurried on with the marriage preparations, and by the end of the week everything was ready. During those busy days, it was perhaps fortunate that the princess paid very little attention to Grethari. She was far too occupied with her clothes and jewels. By the time the wedding day arrived, he had almost managed to forget how cross and rude she had been during their journey.
        - id: ch06-b06
          speaker: narrator
          text: >-
            The oldest men and women in town agreed that no one had ever seen such a splendid bridal procession. It made its way to the great hall, where a banquet would be served before the marriage ceremony in the palace. The guests had already assembled when the bridal pair entered. The princess was in excellent spirits because every eye was fixed upon her. She bowed and smiled to the right and left. Then she took Grethari's hand and swept proudly down the room to her place beside the bridegroom at the head of the table.
        - id: ch06-b07
          speaker: narrator
          text: >-
            Three unfamiliar ladies glided in behind the couple. Their gowns shone blue, green, and red. They sat on an empty bench, and no one paid them much attention. Anyone who noticed them assumed they were attendants to the future queen. The lady in red was Geirlaug. The forester's two daughters had come with her. In one hand, she carried a birch-bark wand. In the other, she held a closed basket.
        - id: ch06-b08
          speaker: narrator
          text: >-
            The three women sat silently while the feast went on. At the height of the merriment, Geirlaug opened her basket. A cock and hen flew out. Everyone watched in astonishment as the birds circled before the royal pair. The cock kept pulling feathers from the hen's tail, and she tried in vain to get away.
        - id: ch06-b09
          speaker: enchanted_hen
          text: Will you treat me as cruelly as Grethari treated Geirlaug?
        - id: ch06-b10
          speaker: narrator
          text: >-
            Grethari heard her and sprang wildly to his feet. In an instant, his whole past came rushing back. He forgot the princess beside him. All he could see was the face of the child who had played with him so many years before.
        - id: ch06-b11
          speaker: grethari
          emotion: surprised
          text: Where is Geirlaug?
        - id: ch06-b12
          speaker: narrator
          text: >-
            He searched the hall until his eyes found the strange lady in red. Smiling, she held out the ring he had given her on her twelfth birthday, when they were still children and had no thought of what the future might bring. Grethari took her hand and led her into the center of the company.
        - id: ch06-b13
          speaker: grethari
          text: You, and no one else, will be my wife.
        - id: ch06-b14
          speaker: narrator
          text: >-
            The scene that followed is not easy to describe. No one in the hall understood what had happened. The king and queen could only imagine that their son had suddenly gone mad. As for the foreign princess, her rage and fury were beyond belief. The guests hurried out of the hall as quickly as they could, leaving the royal family alone to arrange its own tangled affairs.
        - id: ch06-b15
          speaker: narrator
          text: >-
            In the end, the royal family agreed that the rejected princess must receive half the kingdom in place of the husband she had expected. She sailed back to her own country at once. Before long, she became engaged to a young nobleman. The truth was that she liked him much better than she had ever liked Grethari.
        - id: ch06-b16
          speaker: narrator
          text: >-
            That evening, Grethari married Geirlaug. They lived happily for the rest of their lives, and they made all their people happy too.
