  chapters:
    - id: ch01
      title: A Light in the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there were a king and queen of Denmark with one son, a handsome, clever prince. They loved the boy dearly, and he loved them. When the prince was eighteen, the old king became terribly ill. The queen and prince did everything they could for him, but he only grew worse. At last there was no hope that he would recover. Summer came, and the birds were singing when he lifted his head for one long look through the window. Then he fell back and died.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The queen grieved so deeply that for many weeks she could hardly eat or sleep. Her son watched her weep and began to fear that he would lose her too. He knew of a beautiful place on the far side of the forest, and he begged her to travel there with him. She refused at first, but after some time she agreed. The prince was overjoyed and arranged for them to leave early the next morning.
        - id: ch01-b03
          speaker: narrator
          text: >-
            They traveled all day, stopping now and then to rest. The change began to help the queen. She looked around her and took a little interest in the things along the way. Evening was falling when they entered the forest. It was dark beneath the trees because they grew too close together for the sunlight to pass through. Soon the travelers lost the path. They wandered helplessly among the trees, wondering what they should do.
        - id: ch01-b04
          speaker: queen
          text: >-
            If we spend the night in this dreadful forest, the wild beasts will devour us!
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: The queen was tired and frightened, and she began to cry.
        - id: ch01-b06
          speaker: prince
          text: >-
            Don't lose heart, Mother. I feel sure some good luck is about to find us.
        - id: ch01-b07
          speaker: narrator
          text: >-
            At the next turn, they saw a little house with a light in its window.
        - id: ch01-b08
          speaker: prince
          text: >-
            There, you see? Wait here while I ask if we may have food and a place to sleep.
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: >-
            He ran to the house as fast as he could. By then, they were both painfully hungry. They had brought very little food and had eaten every scrap, since no one wants too much to carry on a long journey by foot. The prince entered the house and looked all around. He searched one room after another, but found neither a person nor anything to eat.
        - id: ch01-b10
          speaker: narrator
          text: >-
            He was about to leave sadly when he noticed a sword and a shirt of chain mail on the wall of an inner room. A paper beneath them promised that whoever wore the mail and carried the sword would be safe from every danger.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The prince was so delighted by the promise on the paper that he forgot all about his hunger. He immediately slipped the chain mail beneath his tunic and hid the sword under his cloak. He did not mean to tell anyone what he had found. Then he returned to his mother, who had grown very impatient while she waited alone.
        - id: ch01-b12
          speaker: queen
          text: >-
            Where have you been all this time? I was certain robbers had killed you!
          emotion: angry
        - id: ch01-b13
          speaker: prince
          text: >-
            I was searching the place, that's all. I looked everywhere, but there wasn't a bite to eat.
        - id: ch01-b14
          speaker: queen
          text: >-
            I fear it's a robbers' den. Hungry or not, we should keep moving.
        - id: ch01-b15
          speaker: prince
          text: >-
            It isn't, but we shouldn't stay when there is no food. Perhaps another house lies farther on.
        - id: ch01-b16
          speaker: narrator
          text: >-
            They walked until they found a second house, also with a lamp shining in the window.
        - id: ch01-b17
          speaker: prince
          text: We'll try this one.
        - id: ch01-b18
          speaker: queen
          text: >-
            No! I'm afraid we'll be attacked and killed. This must be a robbers' den!
          emotion: fearful
        - id: ch01-b19
          speaker: prince
          text: >-
            It does look like one, but what else can we do? We haven't eaten for hours, and I'm almost as tired as you are.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The poor queen was completely worn out. She could barely stand because she was so tired. For all her terror, part of her wanted to be persuaded to step inside and rest.
        - id: ch01-b21
          speaker: prince
          text: And a storm is coming.
        - id: ch01-b22
          speaker: narrator
          text: >-
            The hidden sword had made the prince fearless. They entered the empty house and found a table laid with fine food and drink, though some dishes had already been emptied.
        - id: ch01-b23
          speaker: prince
          text: Now, this is a welcome sight.
        - id: ch01-b24
          speaker: narrator
          text: >-
            He sat down and helped himself to delicious strawberries heaped on a golden dish, along with a glass of icy lemonade. After the long, hungry walk, nothing had ever tasted better. Yet the queen's fear had been right. This truly was a robbers' den. The robbers had only just finished eating, which explained the empty dishes, and they had gone into the forest to look for someone to rob.
        - id: ch01-b25
          speaker: narrator
          text: >-
            When the travelers could eat no more, their weariness returned. In the next room, the prince found a comfortable bed with silk sheets.
        - id: ch01-b26
          speaker: prince
          text: >-
            Sleep in the bed, Mother. I'll lie beside it. You needn't be afraid. I'll keep you safe until morning.
        - id: ch01-b27
          speaker: narrator
          text: >-
            He lay on the floor beside her with the sword in his hand. While his mother slept, he kept watch through the whole night. Only when the first daylight began to appear did the queen wake. She said that she felt completely rested and was ready to begin their journey again.
        - id: ch01-b28
          speaker: prince
          text: >-
            I'll find our road first. While I'm gone, light the fire and make coffee. We need a good breakfast before we set out.
        - id: ch01-b29
          speaker: narrator
          text: >-
            He ran into the woods. The queen lit the fire, then began exploring. One room was especially pretty, with pictures on the walls, pale blue curtains, soft yellow cushions, and comfortable chairs. As she looked around, a trapdoor flew open. The robber-chief climbed through it and seized her by the ankles.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The queen screamed and nearly died of fright. She dropped to her knees and begged him to spare her.
        - id: ch01-b31
          speaker: robber_chief
          text: >-
            I will, if you promise me two things. Take me to your country and crown me king in your son's place. Then, if he tries to claim the throne, you must kill him. Refuse, and I will kill you now.
        - id: ch01-b32
          speaker: queen
          text: Kill my own son?
          emotion: fearful
        - id: ch01-b33
          speaker: narrator
          text: She stared at the robber in horror.
        - id: ch01-b34
          speaker: robber_chief
          text: >-
            You needn't do it with your own hands. When he returns, lie on the bed and pretend you're ill. Say you dreamed of beautiful apples growing in a forest a mile away. Tell him those apples alone can cure you, and without them you will die.
        - id: ch01-b35
          speaker: narrator
          text: >-
            The queen shuddered as she listened to the plan. She was fond of her son, but she was a terrible coward, and fear overcame her. In the end she agreed, though she hoped something would happen to save the prince. She had barely made the promise when they heard someone approaching. The robber hurried out of sight before the prince entered.
        - id: ch01-b36
          speaker: prince
          text: >-
            Mother, I've found the road through the forest. Once we've had breakfast, we can leave at once.
        - id: ch01-b37
          speaker: queen
          text: >-
            Oh, I'm terribly ill. I can't walk one step, and only one thing can make me well.
        - id: ch01-b38
          speaker: prince
          text: What could that be?
        - id: ch01-b39
          speaker: queen
          text: >-
            I dreamed that beautiful apples grow in another forest, only a mile from here. If I had some, I would soon recover.
        - id: ch01-b40
          speaker: prince
          text: >-
            A dream doesn't mean anything. A magician lives nearby. I'll ask him for a spell to cure you.
        - id: ch01-b41
          speaker: queen
          text: >-
            My dreams always have meaning. If you don't bring me those apples, I shall die.
        - id: ch01-b42
          speaker: narrator
          text: >-
            The queen did not know why the robber had chosen that forest. In truth, it swarmed with wild animals that tore every traveler to pieces.
        - id: ch01-b43
          speaker: prince
          text: >-
            Very well, I'll go. But I must eat first. With some breakfast in me, I'll walk much faster.
        - id: ch01-b44
          speaker: queen
          text: >-
            If you don't hurry, you'll come back and find me dead.
        - id: ch01-b45
          speaker: narrator
          text: >-
            She murmured fretfully that he must hurry. She thought her son was not nearly anxious enough about her danger. By now, after pretending so earnestly, the queen had begun to believe that she truly was as ill as she claimed.
    - id: ch02
      title: The Apples and the Princess
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The prince refused to leave without food. When he had eaten and drunk enough for the journey, he set out. Before long he reached the dangerous forest. Lions, tigers, bears, and wolves came rushing toward him from every side. Yet not one beast sprang upon him. Instead, they lay down on the ground around him and gently licked his hands.
        - id: ch02-b02
          speaker: narrator
          text: >-
            He quickly found the tree that carried the apples his mother wanted. But the branches grew so high above him that he could not reach a single fruit. The trunk was perfectly smooth, with no hold for his hands or feet, so there was no way to climb it.
        - id: ch02-b03
          speaker: prince
          text: >-
            So all this was useless. I can't reach the apples. What am I supposed to do now?
        - id: ch02-b04
          speaker: narrator
          text: >-
            He gave up and turned away. By chance, the sword beneath his cloak touched the tree, and two apples fell to the ground at once. The prince picked them up with joy. He was about to start back when a little dog appeared from a nearby hill. It ran straight to him, caught at his clothes, and pulled while it whined.
        - id: ch02-b05
          speaker: prince
          text: What is it, little dog? What do you want?
        - id: ch02-b06
          speaker: narrator
          text: >-
            He bent to stroke its soft black head. The dog ran to a hole in the hillside and sat looking out, plainly asking him to follow.
        - id: ch02-b07
          speaker: prince
          text: I may as well find out what's inside.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The opening was too small for him. He pushed his sword into it, and at once the hole grew larger.
        - id: ch02-b09
          speaker: prince
          text: Ha! This sword is worth having.
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: >-
            He crouched down and crawled through. A dark passage led him to a room where a beautiful princess stood chained to an iron pillar.
        - id: ch02-b11
          speaker: prince
          text: What terrible luck brought you to a place like this?
          emotion: surprised
        - id: ch02-b12
          speaker: princess
          text: >-
            Telling you won't help me, and it may bring the same fate down on you.
          emotion: sad
        - id: ch02-b13
          speaker: prince
          text: >-
            That doesn't frighten me. Please tell me who you are and how you came here.
        - id: ch02-b14
          speaker: princess
          text: >-
            It is a short story. I am a princess of Arabia. Twelve robbers live here, and they are fighting over which one will force me to become his wife.
          emotion: sad
        - id: ch02-b15
          speaker: prince
          text: Shall I free you?
        - id: ch02-b16
          speaker: princess
          text: >-
            Yes, if you could. But how would you even break this chain?
        - id: ch02-b17
          speaker: prince
          text: That part is easy.
        - id: ch02-b18
          speaker: narrator
          text: >-
            The prince drew his sword. The moment it touched the iron chain, every link fell apart, and the princess was free.
        - id: ch02-b19
          speaker: prince
          text: Come with me.
        - id: ch02-b20
          speaker: narrator
          text: He took her hand, but she pulled away.
        - id: ch02-b21
          speaker: princess
          text: >-
            I don't dare! If we meet the robbers in that passage, they'll kill us both.
          emotion: fearful
        - id: ch02-b22
          speaker: prince
          text: >-
            They will not. But tell me, how long have you been imprisoned here?
        - id: ch02-b23
          speaker: princess
          text: About twenty years, I think.
        - id: ch02-b24
          speaker: narrator
          text: She counted the years on her fingers.
        - id: ch02-b25
          speaker: prince
          text: >-
            Twenty years! Then close your eyes. After so long in this room, sudden daylight may hurt them. So you are the Arabian princess whose beauty is famous throughout the world. I am a prince too.
          emotion: surprised
        - id: ch02-b26
          speaker: princess
          text: >-
            Since you've saved me, will you return to Arabia and marry me? If my father is still alive, he must be old. After him, you could be king.
        - id: ch02-b27
          speaker: prince
          text: >-
            No. I must live and die in my own country. But one year from now, I will follow you to Arabia and marry you.
        - id: ch02-b28
          speaker: narrator
          text: >-
            He would promise nothing more. The princess removed a heavy ring and placed it on his finger. Her name and the names of her parents were engraved upon it. She asked him to keep it in memory of his promise.
        - id: ch02-b29
          speaker: prince
          text: >-
            I will sooner die than give it up. If I am alive when the year ends, I will come. I have heard that ships sail for Arabia from a port beyond this forest. We must hurry there now.
        - id: ch02-b30
          speaker: narrator
          text: >-
            Hand in hand, they hurried through the forest. When they reached the port, a ship stood ready to sail. The princess said goodbye to the prince and went aboard alone. In Arabia, her arrival brought great rejoicing. Her parents had given up all hope of ever seeing her again. She told them how a prince had freed her from the robbers, and how he had promised to come in one year and marry her. The king and queen were greatly pleased with the match.
        - id: ch02-b31
          speaker: king_of_arabia
          text: >-
            Even so, I wish he were here today. A whole year is a long time to wait.
    - id: ch03
      title: The Queen's Betrayal
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            While the princess stood before him, the prince had forgotten everything except her safety. Once her ship was out of sight, he remembered why he had gone into the forest in the first place. He made all possible haste back to the robbers' house. The robber-chief had a nose like an ogre's, and he smelled the apples while the prince was still far away.
        - id: ch03-b02
          speaker: robber_chief
          text: >-
            What a strange young man! Wild beasts should have eaten him in that forest. He must carry a powerful charm, and we must take it from him.
        - id: ch03-b03
          speaker: queen
          text: He has no charm.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The queen had become fascinated with the robber, but he did not believe her.
        - id: ch03-b05
          speaker: robber_chief
          text: >-
            We need a way to learn his secret. Tell him you're well, and have food waiting. While he eats, say you dreamed that wild animals attacked him. Ask how he escaped. Once he tells you, I can take his protection away.
        - id: ch03-b06
          speaker: narrator
          text: The prince came in soon afterward.
        - id: ch03-b07
          speaker: prince
          text: >-
            How are you feeling, Mother? Here are the apples. You'll soon be well, and then we can leave together.
          emotion: happy
        - id: ch03-b08
          speaker: queen
          text: >-
            I already feel better. Your hot dinner is ready. Eat it, and then we'll start.
        - id: ch03-b09
          speaker: narrator
          text: While he ate, she began the robber's questioning.
        - id: ch03-b10
          speaker: queen
          text: >-
            While you were gone, I had a dreadful dream. You stood among fierce, growling beasts that ran all around you. How did you get away?
        - id: ch03-b11
          speaker: prince
          text: It was only a dream, Mother.
          emotion: happy
        - id: ch03-b12
          speaker: queen
          text: But you know my dreams come true. Tell me what happened.
        - id: ch03-b13
          speaker: narrator
          text: >-
            The prince wondered for some time whether he should reveal his secret. In the end, he decided that he could trust her. A son ought to tell his mother everything, he thought, never dreaming how she would use the truth against him.
        - id: ch03-b14
          speaker: prince
          text: >-
            Look. In the first house, I found this sword and shirt of mail. As long as I have them, nothing can harm me. That is why the beasts spared me.
        - id: ch03-b15
          speaker: queen
          text: How thankful I am that you found them!
          emotion: happy
        - id: ch03-b16
          speaker: narrator
          text: >-
            The moment his back was turned, she rushed to tell the robber. He prepared a sleeping drink and ordered her to give it to her son that night. As soon as the prince grew drowsy, she brought him the cup.
        - id: ch03-b17
          speaker: queen
          text: >-
            Drink this for my sake. After everything you've endured, it will do you good and help you sleep.
        - id: ch03-b18
          speaker: prince
          text: What a strange taste.
        - id: ch03-b19
          speaker: narrator
          text: >-
            He swallowed it and fell asleep at once. The robber entered and took the magic sword and mail.
        - id: ch03-b20
          speaker: robber_chief
          text: These belonged to my brother.
        - id: ch03-b21
          speaker: narrator
          text: With both treasures in his hands, he woke the prince.
        - id: ch03-b22
          speaker: robber_chief
          text: >-
            I am master now. Make your choice. You may die here, or lose your eyes and be driven back into the forest.
        - id: ch03-b23
          speaker: narrator
          text: >-
            The prince's blood ran cold. Then a thought came to him, and he turned sternly to his mother.
        - id: ch03-b24
          speaker: prince
          text: Did you do this to me?
          emotion: angry
        - id: ch03-b25
          speaker: narrator
          text: >-
            The queen burst into tears and denied it, but her son knew she was lying.
        - id: ch03-b26
          speaker: prince
          text: >-
            Well, while there is life, there is hope. Send me into the forest.
        - id: ch03-b27
          speaker: narrator
          text: >-
            The robber chose a cruel punishment. He put out the prince's eyes, placed a stick in his hand, and gave him a little food and drink. Then he drove the blind young man deep into the forest. Now that the prince had lost both sword and armor, the robber expected the wild beasts to find him and kill him.
        - id: ch03-b28
          speaker: robber_chief
          text: Now we will return to your country.
        - id: ch03-b29
          speaker: narrator
          text: >-
            The next day, the robber and queen sailed for Denmark. They married as soon as they arrived, and the robber became king.
        - id: ch03-b30
          speaker: narrator
          text: >-
            Meanwhile, the poor prince wandered blindly through the forest. He hoped to meet someone who would help him and perhaps employ him as a servant, because he had no money and no home left. By good fortune, a great hunt had recently swept through those woods. The wild beasts had fled from the hunters and were still hiding, so none of them harmed him.
        - id: ch03-b31
          speaker: narrator
          text: >-
            At last his food ran out. Just when he believed he must die of hunger, he reached the port where ships left for Arabia. A vessel was ready to sail, and its captain noticed him while going aboard.
        - id: ch03-b32
          speaker: captain
          text: >-
            Why, here is a poor blind fellow. The robbers must have done this. We'll take him with us to Arabia. Would you care to come, my good man?
        - id: ch03-b33
          speaker: narrator
          text: >-
            After so much cruelty, the prince was overjoyed to hear a human voice speak kindly to him again. He gladly accepted the captain's offer, and the sailors helped him climb the side of the ship. When they landed in Arabia, the captain did not abandon him. He took the blind traveler to the public baths and ordered one of the slaves there to wash him.
        - id: ch03-b34
          speaker: narrator
          text: >-
            During the bath, the princess's ring slipped from the prince's finger. Later, the slave who cleaned the room found it and showed it to a friend from the palace.
        - id: ch03-b35
          speaker: palace_friend
          text: This belongs to the princess. Where did you find it?
          emotion: surprised
        - id: ch03-b36
          speaker: bath_slave
          text: >-
            It fell from a blind man's finger. He must have stolen it, but perhaps you can return it to her.
        - id: ch03-b37
          speaker: narrator
          text: >-
            That evening, the palace servant carried the ring home. His daughter served as the princess's favorite attendant, so he gave the ring to her. The girl brought it directly to her mistress. The princess recognized the names engraved upon it and cried out with joy.
        - id: ch03-b38
          speaker: princess
          text: >-
            This is the ring I gave the prince I am to marry! Take me to him this instant.
          emotion: happy
        - id: ch03-b39
          speaker: narrator
          text: >-
            The bath-keeper found it strange that she could be promised to a blind beggar, but he obeyed. When the princess saw the prince, she rushed to greet him.
        - id: ch03-b40
          speaker: princess
          text: >-
            You have come at last! The year ended, and I thought you must be dead. We will marry at once.
          emotion: happy
        - id: ch03-b41
          speaker: narrator
          text: >-
            She went home and told the king to send an escort for her promised husband. The prince's sudden arrival surprised the king, and the news that he was blind greatly annoyed him.
        - id: ch03-b42
          speaker: king_of_arabia
          text: >-
            A blind man cannot inherit my throne. The whole idea is absurd!
          emotion: angry
        - id: ch03-b43
          speaker: narrator
          text: >-
            But the princess had always had her own way. As usual, her father finally yielded. The prince was brought to the palace with grand ceremony and splendor, though none of it made the king content. Still, he could not prevent the marriage, and it truly was time his daughter chose a husband. She looked as young as ever, even after twenty years in the cave. Hundreds of knights and princes had begged her to marry them, but she had refused every one. Now she had set her heart upon this blind prince, and no one else would do.
    - id: ch04
      title: The Queen's Bed
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            One fine evening, the prince and princess sat beneath a tree in the garden. Two ravens were perched in a nearby bush. The prince could understand the language of birds, and he listened to their talk.
        - id: ch04-b02
          speaker: raven_one
          text: Do you know that tonight is Midsummer Eve?
        - id: ch04-b03
          speaker: raven_two
          text: Yes, I do.
        - id: ch04-b04
          speaker: raven_one
          text: And do you know the part of this garden called the Queen's Bed?
        - id: ch04-b05
          speaker: raven_two
          text: Yes.
        - id: ch04-b06
          speaker: raven_one
          text: >-
            Then perhaps you haven't heard its secret. Anyone with damaged eyes, or no eyes at all, can regain his sight by bathing them in the dew that falls there tonight. But it must be done between midnight and one.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The prince and princess were overjoyed by what they heard. He asked her to lead him to the place called the Queen's Bed. It was a little plot of grass where her mother often lay down for her midday rest. They waited for the proper hour. Between twelve and one, the prince gathered the falling dew and bathed his empty eye sockets with it. At once, he found that he could see as clearly as ever.
        - id: ch04-b08
          speaker: prince
          text: I can see you!
          emotion: happy
        - id: ch04-b09
          speaker: narrator
          text: He gazed at her as though he had never seen anything before.
        - id: ch04-b10
          speaker: princess
          text: I don't believe you.
          emotion: surprised
        - id: ch04-b11
          speaker: prince
          text: >-
            Hang your handkerchief on a bush. If I walk straight to it, you must believe me.
        - id: ch04-b12
          speaker: narrator
          text: >-
            The princess did so, and he went directly to the handkerchief.
        - id: ch04-b13
          speaker: princess
          text: >-
            You truly can see! My mother's garden bed has given your sight back.
          emotion: happy
        - id: ch04-b14
          speaker: narrator
          text: >-
            She returned to the bank beneath the tree and sat down. After a while, the heat of the day made her sleepy, and she closed her eyes. As the prince watched her, he suddenly noticed something shining at her neck. It was a tiny golden lamp that gave off a bright light, and it hung from a chain of gold. He wanted to examine it more closely, so he carefully unfastened the chain. As he did, the lamp slipped and fell to the ground.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Before he could bend down and pick it up, a hawk swooped from the sky. It seized the lamp and flew away. The prince immediately ran after it. He chased the bird on and on, but could not catch it or make it drop the lamp. By the time he stopped, he had lost his way. He wandered back and forth, searching for a familiar road, until at last he came to the forest where he had once found the princess.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Meanwhile, the princess awoke beneath the tree. When she saw that she was alone, she set out to search for the prince. Before long, she also lost the path and wandered without knowing which way to turn. The robbers found her there, captured her, and took her back to the very cave from which the prince had rescued her. After all their suffering, the two were no better off than they had been before.
        - id: ch04-b17
          speaker: narrator
          text: >-
            The prince continued wandering through the forest, always trying to find his way back to Arabia. One day, twelve young men came walking cheerfully among the trees. They laughed and sang as they went. Glad to meet other travelers, the prince asked where they were going. They told him they were on the road in search of work.
        - id: ch04-b18
          speaker: prince
          text: May I travel with you?
        - id: ch04-b19
          speakers: [youth_one, youth_two, youth_three, youth_four]
          ensemble: chorus
          text: Of course! The more of us, the merrier.
        - id: ch04-b20
          speaker: narrator
          text: >-
            The prince joined them. They journeyed together until an old troll met them on the road.
        - id: ch04-b21
          speaker: troll
          text: Where are you going, my masters?
        - id: ch04-b22
          speakers: [youth_one, youth_two, youth_three, youth_four]
          ensemble: chorus
          text: We are looking for service.
        - id: ch04-b23
          speaker: troll
          text: >-
            Then serve me. You'll have plenty to eat and drink and very little work. At the end of one year, I will ask three questions. Answer them, and each of you receives a sack of gold. Fail, and I turn you all into beasts.
        - id: ch04-b24
          speaker: narrator
          text: >-
            The young men thought the bargain sounded easy, so they followed him to his castle.
        - id: ch04-b25
          speaker: troll
          text: >-
            Everything you need is here. Only keep the house while I am away. I will return when the year is over.
        - id: ch04-b26
          speaker: narrator
          text: >-
            The troll went away, leaving the young men alone in the castle. They had a fine time. Instead of working, they spent their days amusing themselves with songs and drink. Every day, they found the table already laid with all the good things they could want. Once they had eaten their fill, invisible hands carried away the plates and dishes and left everything clean.
        - id: ch04-b27
          speaker: narrator
          text: >-
            Only the prince did not join in their careless life. He was too sad over the loss of his princess to enjoy the feasts. He ate and drank sparingly, and while the other youths amused themselves, he worked hard and kept the castle in order.
    - id: ch05
      title: The Troll's Three Questions
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            One day, while the prince sat in his room, he heard the old troll beneath his window. The troll was speaking with another of his kind.
        - id: ch05-b02
          speaker: troll
          text: Tomorrow, their year is finished.
        - id: ch05-b03
          speaker: second_troll
          text: What questions will you give them?
        - id: ch05-b04
          speaker: troll
          text: >-
            First, I will ask how long they have been here. The young fools have no idea. Then I will ask what shines upon my castle roof.
        - id: ch05-b05
          speaker: second_troll
          text: And what is shining there?
        - id: ch05-b06
          speaker: troll
          text: >-
            It is the lamp I stole from the princess while she slept in the garden.
        - id: ch05-b07
          speaker: second_troll
          text: What will your last question be?
        - id: ch05-b08
          speaker: troll
          text: >-
            I will ask where their daily food and drink come from. I steal it all from the king's own table, but they know nothing of that.
        - id: ch05-b09
          speaker: narrator
          text: >-
            The next day, the old troll entered the castle and called everyone before him.
        - id: ch05-b10
          speaker: troll
          text: >-
            It is time for my questions. First, how long have you lived here?
        - id: ch05-b11
          speaker: narrator
          text: >-
            The young men had been so busy drinking, singing, and making merry that they had forgotten all about the agreement. Now they could not even remember when their service had begun. They stared at one another, and for a while no one dared to speak.
        - id: ch05-b12
          speaker: youth_one
          text: One week.
        - id: ch05-b13
          speaker: youth_two
          text: Perhaps two months?
        - id: ch05-b14
          speaker: prince
          text: We have been here for one year.
        - id: ch05-b15
          speaker: troll
          text: Correct. Now tell me, what is shining on the roof?
        - id: ch05-b16
          speaker: narrator
          text: The young men made guess after guess.
        - id: ch05-b17
          speaker: youth_three
          text: Is it the sun?
        - id: ch05-b18
          speaker: youth_four
          text: The moon, perhaps?
        - id: ch05-b19
          speaker: narrator
          text: None of them knew.
        - id: ch05-b20
          speaker: prince
          text: May I give the answer?
        - id: ch05-b21
          speaker: troll
          text: You may.
        - id: ch05-b22
          speaker: prince
          text: >-
            It is the lamp you stole from the princess as she slept in the garden.
        - id: ch05-b23
          speaker: narrator
          text: The troll nodded. Then came the hardest question.
        - id: ch05-b24
          speaker: troll
          text: Where have all your meals and drink come from?
        - id: ch05-b25
          speaker: narrator
          text: Not one of the young men could guess.
        - id: ch05-b26
          speaker: prince
          text: Shall I answer this one too?
        - id: ch05-b27
          speaker: troll
          text: If you can.
        - id: ch05-b28
          speaker: prince
          text: They come from the king's table.
        - id: ch05-b29
          speaker: narrator
          text: >-
            Those three words completed the test. The troll could not turn any of them into beasts. Instead, they were allowed to take the promised sacks of gold and leave the castle. The twelve young men snatched up their rewards and hurried away so eagerly that the prince was left behind to follow alone.
        - id: ch05-b30
          speaker: narrator
          text: >-
            On the road, the youths met an old man who asked them for money.
        - id: ch05-b31
          speakers: [youth_one, youth_two, youth_three, youth_four]
          ensemble: chorus
          text: We don't have any money to spare.
        - id: ch05-b32
          speaker: narrator
          text: >-
            They hurried on. A little later, the prince came along, and the old man stopped him too.
        - id: ch05-b33
          speaker: troll
          text: My lord, can you spare one coin for a poor old man?
        - id: ch05-b34
          speaker: prince
          text: Yes. You may have all of this.
        - id: ch05-b35
          speaker: narrator
          text: The prince handed over his whole sack of gold.
        - id: ch05-b36
          speaker: troll
          text: >-
            I don't need your gold. I am the troll you just served, and because you are so generous, I will give you the princess's lamp. The princess herself is chained in the cave where you first found her. How you will save her without the magic sword, though, I cannot say.
        - id: ch05-b37
          speaker: narrator
          text: >-
            At those words, the prince finally knew where his beloved had been taken. The troll's warning also told him that he must recover the magic sword before he attempted another rescue. He disguised himself so that he looked like a traveling peddler. Then he made the long journey to his own city, where his mother and the robber-chief were living as queen and king.
        - id: ch05-b38
          speaker: narrator
          text: >-
            In the city, the prince entered a goldsmith's shop and ordered a great number of kitchen pots made from pure gold. It was certainly not an order the craftsman received every day, and the work took time. At last, the strange collection was ready. There were saucepans, kettles, gridirons, and every other sort of kitchen vessel, all made of solid gold. The prince packed them into his peddler's basket, carried them to the palace, and asked to show his wares to the queen.
        - id: ch05-b39
          speaker: narrator
          text: >-
            The moment the queen heard that a stranger had brought golden pots and pans, she came out to see them. She unpacked the basket herself and admired one shining piece after another. The prince waited until she was completely absorbed. Then he quietly slipped away into the bedroom. There on the wall hung his magic sword and shirt of mail. He took both, returned to his basket, and stood before the queen again without her ever noticing his absence.
        - id: ch05-b40
          speaker: queen
          text: These are all beautiful. What price do you want for them?
        - id: ch05-b41
          speaker: prince
          text: Your Majesty may choose the price.
        - id: ch05-b42
          speaker: queen
          text: >-
            I hardly know what to offer. Wait until my husband returns. Men understand prices better, and since you are a stranger, he will want to speak with you.
        - id: ch05-b43
          speaker: narrator
          text: >-
            The prince bowed and waited silently in a corner. Before long, the robber came home.
        - id: ch05-b44
          speaker: queen
          text: Come and look at these lovely golden saucepans!
          emotion: happy
        - id: ch05-b45
          speaker: narrator
          text: >-
            As the robber entered, the prince touched him with the magic sword. The false king fell to the floor. Then the prince removed his disguise.
        - id: ch05-b46
          speaker: prince
          text: >-
            Perhaps you recognize me now, Mother. Repent of all the harm you have done me, or you will not live much longer.
          emotion: angry
        - id: ch05-b47
          speaker: queen
          text: >-
            Have mercy on me! I couldn't help myself. I was so frightened.
          emotion: fearful
        - id: ch05-b48
          speaker: narrator
          text: >-
            The prince chose to spare his mother's life. The wicked robber was stripped of the fine clothes he had worn as king and driven out into the forest. There, the wild beasts that once bowed before the magic sword tore him to pieces. The queen lost the place she had gained through her betrayal, and her son sent her away to her own country.
        - id: ch05-b49
          speaker: narrator
          text: >-
            Then the prince set out for the robbers' cave. He found the princess sitting there, chained to the iron pillar exactly as she had been the first time. With the magic sword in his hand, freeing her was easy, and no danger could stop them on their way out. They soon reached the port and took ship for Arabia. There the prince and princess were married. They ruled both countries happily together, and their reign lasted until they died many years later.
