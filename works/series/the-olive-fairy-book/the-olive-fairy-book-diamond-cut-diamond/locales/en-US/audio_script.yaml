  chapters:
    - id: ch01
      title: The Merchant’s Treasure
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long ago, a merchant lived in a village in Hindustan. He rose early, worked hard, and went to bed late, yet he stayed poor. At last, after one piece of bad luck too many, he left for a distant country to seek his fortune.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Twelve years went by, and his luck changed. He became so wealthy that he could live comfortably for the rest of his days. Then he began to long for his own village and his own people. To carry his fortune safely over the long road home, he bought magnificent jewels, locked them in a little box, and hid the box beneath his clothes. The highways were full of thieves, so he dressed like a poor man with nothing worth stealing.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He traveled quickly. When he was only a few days from home, he came to a city and decided to buy better clothes. The worst part of the road was behind him, so he no longer feared the thieves and was ready to look like the rich man he had become. Dressed in his new garments, he walked toward the city. Near the great gate stood a bazaar crowded with costly silks, carpets, and goods from many countries. One shop was finer than all the rest. Its wares had been arranged to look their very best, and the owner sat among them, smoking a long silver pipe.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The merchant greeted him politely, sat down, and bought several things. The shopkeeper was Beeka Mull, a very shrewd man. As they talked, he guessed that his customer had more money than he showed. Beeka Mull offered him refreshments, and soon they were chatting pleasantly. When he heard which village the merchant was bound for, he gave him a warning.
        - id: ch01-b05
          speaker: beeka_mull
          text: You must be careful on that road. Thieves make it a dangerous place.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The merchant went pale. How bitter it would be to lose his carefully earned fortune at the very end of his journey. He had spent twelve years gathering it, and now home was almost in sight. This prosperous, agreeable shopkeeper must know the road well, he thought. The warning stayed in his mind until he could bear it no longer. Then he made a request.
        - id: ch01-b07
          speaker: merchant
          text: >-
            Lala-ji, would you keep a small box locked away for me? Once I reach my village, I can return with six strong kinsmen and carry it home safely.
        - id: ch01-b08
          speaker: beeka_mull
          text: >-
            I am sorry, but I cannot. Keeping other people’s treasures is not my business. I would be afraid to take such a responsibility.
        - id: ch01-b09
          speaker: merchant
          text: >-
            But I know no one else in this city. Surely you have a safe place for your own valuables. Please do this as a great favor to me.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Beeka Mull kept refusing, politely but firmly. The merchant knew he had already revealed that he carried something valuable. If he asked at another shop, still more strangers would learn his secret. That thought made him press Beeka Mull again and again, until the shopkeeper finally agreed. The merchant drew the hidden jewel box from beneath his clothes. Beeka Mull placed it in a strong chest beside other precious stones and turned the lock. After many promises and polite compliments, the two men parted.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Shops in that bazaar stood wide open to the narrow street. Their goods spilled beyond the shops onto raised terraces and verandas beside the road, so neighboring shopkeepers could easily watch one another. The merchant and Beeka Mull had talked for a long time, and the whole exchange had attracted attention. Almost every shop owner in that district was a thief, and Beeka Mull was the cleverest and greatest thief of them all. The merchant knew none of this. Still, as he walked away, he could not help feeling uneasy. He had handed every bit of his wealth to a man he had only just met.
        - id: ch01-b12
          speaker: narrator
          text: >-
            As he wandered down the street, buying one thing here and another there, he found ways to ask whether Beeka Mull was honest. Each rogue guessed there must be a profitable reason for such a question. Hoping Beeka Mull would share whatever he gained, every one praised him as a perfect model of virtue. Their answers quieted the merchant’s fears. He continued to his village with a much lighter heart. Within a week or so, he returned to the city with six sturdy young nephews and friends. He had recruited them to help carry his precious box safely home.
    - id: ch02
      title: Beeka Mull Denies Him
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            In the city’s great marketplace, the merchant asked his companions to wait while he fetched the jewels. He went to Beeka Mull’s shop and offered a polite greeting. Beeka Mull acted as though he had not seen him. The merchant greeted him again.
        - id: ch02-b02
          speaker: beeka_mull
          text: >-
            What do you want? You have said good day twice. Stop wasting time and tell me your business.
          emotion: angry
        - id: ch02-b03
          speaker: merchant
          text: Don’t you remember me?
        - id: ch02-b04
          speaker: beeka_mull
          text: >-
            Remember you? Why should I? I have enough good customers to remember without keeping track of every beggar who whines for charity.
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: The merchant began to tremble.
        - id: ch02-b06
          speaker: merchant
          text: >-
            Lala-ji, you must remember me. I gave you a little box to keep safe. You kindly promised I could come back and claim it.
          emotion: fearful
        - id: ch02-b07
          speaker: beeka_mull
          text: >-
            You scoundrel! Get out of my shop, you shameless rogue! Everyone knows I never guard treasures for anyone. I have trouble enough guarding my own. Go on, get out!
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: >-
            With that, Beeka Mull began shoving him toward the street. The poor man resisted, but two bystanders rushed to the shopkeeper’s aid. Together they flung the merchant into the road like a bale of goods dropped from a camel. Bruised, battered, and bleeding, he slowly lifted himself out of the dust. Yet he felt none of the pain in his body. A dreadful numbness had swallowed everything else. After twelve years of work, he was ruined and lost.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Fat and furious, Beeka Mull still stood among the silks and carpets that had been thrown into disorder. The merchant dragged himself a little farther down the street. When he reached a wall that could support him, he crouched against it and buried his head in his hands. There he gave himself over to misery and despair.
        - id: ch02-b10
          speaker: narrator
          text: >-
            He sat without moving as darkness fell, as still as if he had turned to stone. Around eleven that night, a lively young man named Kooshy Ram passed with a friend. He noticed the hunched figure beside the wall.
        - id: ch02-b11
          speaker: kooshy_ram
          text: That must be a thief.
        - id: ch02-b12
          speaker: kooshy_friend
          text: >-
            No, you are mistaken. Even at night, a thief would not sit where everyone could see him.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The two went on and thought no more about him. At five the next morning, Kooshy Ram came home by the same way. To his astonishment, the miserable merchant was still sitting exactly as he had sat hours earlier. Something must be badly wrong with a man who remained all night in the open street. Kooshy Ram decided to learn what it was and gently shook the stranger’s shoulder.
        - id: ch02-b14
          speaker: kooshy_ram
          text: Who are you? Why are you sitting here? Are you ill?
        - id: ch02-b15
          speaker: merchant
          text: Yes. I have a sickness no medicine can cure.
          emotion: sad
        - id: ch02-b16
          speaker: kooshy_ram
          text: >-
            Nonsense. Come with me. I believe I know a medicine that can cure you.
        - id: ch02-b17
          speaker: narrator
          text: >-
            Kooshy Ram seized him by the arm, hauled him to his feet, and led him to his own lodging. First he gave the man a large glass of wine. Then he brought him food. Only after the merchant had eaten and recovered a little did Kooshy Ram ask him to tell the whole story of his troubles.
    - id: ch03
      title: Kooshy Ram’s Medicine
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Meanwhile, the merchant’s companions had grown tired of waiting in the marketplace. They were not very clever. They decided he must have gone home alone, so they returned to their village and left him to manage his own affairs.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Without Kooshy Ram, the merchant would have fared badly. Kooshy Ram had inherited a great deal of money while he was still a boy, and no one had been there to advise him how to spend it. He was high-spirited, kindhearted, and shrewd as well. But he scattered money like water, usually on whoever or whatever happened to be nearest. Unfortunately, that person was most often Kooshy Ram himself.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Now, for once, Kooshy Ram had chosen someone else. He had decided to befriend the miserable merchant, and once the idea entered his head, he meant to see it through. The merchant felt his confidence begin to return. Without further delay, he told Kooshy Ram everything that had happened. Kooshy Ram laughed heartily at the thought of any stranger trusting his wealth to Beeka Mull.
        - id: ch03-b04
          speaker: kooshy_ram
          text: >-
            Why, Beeka Mull is the greatest rogue in the whole city, unless you believe what certain people say about me! There is nothing we can do today. Stay here quietly. Before long, I think I will find the medicine for your sickness.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The merchant took courage, and a little ease returned to his heart as he gratefully accepted the invitation to stay. A few days later, Kooshy Ram gathered some friends and spoke with them for a long time. The merchant could not hear their words, but again and again he heard bursts of laughter, as though they shared a wonderful joke. That laughter echoed dully in his own heart. The more he considered his plight, the more certain he became that he would never free his fortune from Beeka Mull’s grasp.
        - id: ch03-b06
          speaker: narrator
          text: A little later, Kooshy Ram came to him with instructions.
        - id: ch03-b07
          speaker: kooshy_ram
          text: Do you remember the wall near Beeka Mull’s shop where I found you that night?
        - id: ch03-b08
          speaker: merchant
          text: I certainly do.
        - id: ch03-b09
          speaker: kooshy_ram
          text: >-
            This afternoon, stand in that same place and watch. When someone signals to you, walk up to Beeka Mull and greet him. Then say, “Lala-ji, would you kindly return the box you are holding for me?”
        - id: ch03-b10
          speaker: merchant
          text: >-
            What good will that do? He will refuse, just as he did before.
        - id: ch03-b11
          speaker: kooshy_ram
          text: >-
            Never mind that. Do exactly as I tell you, and repeat those words exactly. I will take care of everything else.
        - id: ch03-b12
          speaker: narrator
          text: >-
            That afternoon, at the appointed time, the merchant returned to the wall. Beeka Mull noticed him, but neither man acknowledged the other.
    - id: ch04
      title: The Palanquin at the Shop
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Before long, a splendid palanquin came through the bazaar, the kind used by ladies of high rank. Four bearers in rich uniforms carried it at a quick pace. Its curtains and every part of its decoration were magnificent. A solemn-looking gentleman walked beside it as an attendant. The merchant recognized him as one of the friends who had visited Kooshy Ram. Behind them came a servant with a cloth-covered box balanced on his head.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The bearers set the palanquin down before Beeka Mull’s shop. The shopkeeper jumped to his feet and bowed deeply as the gentleman approached.
        - id: ch04-b03
          speaker: beeka_mull
          text: >-
            May I ask who honors my humble shop with a visit? And how may I serve the lady?
        - id: ch04-b04
          speaker: narrator
          text: >-
            Before answering, the gentleman stepped to the palanquin and whispered through its curtain. Then he explained that the lady inside was a relative of his and was making a journey. Her husband had been traveling with her, but he could go no farther. For safety, she wished to leave a box of jewels in Beeka Mull’s keeping until it could be reclaimed.
        - id: ch04-b05
          speaker: beeka_mull
          text: >-
            Such a service is not usually part of my business. Still, if it will please the lady, I shall be delighted. I will guard her box with my life.
        - id: ch04-b06
          speaker: narrator
          text: >-
            He bowed almost to the ground. The servant carrying the box was summoned, and the lid was unlocked. A great mass of jewelry glittered inside. Beeka Mull gazed at the rich gems in delight. His mouth watered as he picked them up and turned them over, one after another, while the supposed owners watched him.
        - id: ch04-b07
          speaker: narrator
          text: >-
            From his distant place by the wall, the merchant had watched everything. Then he saw a hand appear through the curtain on the side of the palanquin hidden from the shop. It beckoned to him. Could he be mistaken? Was this the signal? The hand appeared again and beckoned more impatiently. The merchant walked quietly forward and greeted Beeka Mull. The shopkeeper was still turning over the amazing jewels that fortune, helped by a band of fools, seemed ready to place in his care.
        - id: ch04-b08
          speaker: merchant
          text: >-
            Lala-ji, would you kindly return the box you are holding for me?
        - id: ch04-b09
          speaker: narrator
          text: >-
            Beeka Mull jerked his head up as though something had stung him. But his mind worked quickly. If this man began making a fuss again, the lady and her attendant would hear it. Then he would lose the confidence of customers who were far richer than the merchant. Beeka Mull swallowed his anger and mastered himself.
        - id: ch04-b10
          speaker: beeka_mull
          text: Why, yes, of course. I had completely forgotten it.
        - id: ch04-b11
          speaker: narrator
          text: >-
            Beeka Mull went away, fetched the little box, and placed it in the merchant’s trembling hands. The key still hung on a string around the merchant’s neck. He pulled it out and opened the lock at once. Every one of his treasures lay safely inside. He rushed into the road with the box tucked under his arm. There he began dancing like a madman, shouting and screaming with laughter.
    - id: ch05
      title: A Fourteenth Way
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Just then, a messenger ran up and bowed to the gentleman beside the palanquin.
        - id: ch05-b02
          speaker: messenger
          text: >-
            The lady’s husband has returned and can continue the journey with her. She no longer needs to leave the jewels here.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The gentleman quickly shut and locked the jewel box, then handed it back to the waiting servant. A great laugh burst from inside the palanquin. Out jumped Kooshy Ram, not a lady at all. He ran to the merchant in the middle of the road, and the two danced wildly together.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Beeka Mull stared at them, looking utterly foolish. Then he gave a shrill cackle, threw off his turban, and bounced into the road. He danced with the other two, snapping his fingers until he had no breath left.
        - id: ch05-b05
          speaker: attendant
          text: >-
            Lala-ji, why are you dancing? The merchant dances because he has recovered his fortune. Kooshy Ram dances because he is a madman who tricked you. But what reason do you have?
        - id: ch05-b06
          speaker: narrator
          text: Beeka Mull glared at him with bloodshot eyes and answered between gasps.
        - id: ch05-b07
          speaker: beeka_mull
          text: >-
            I am dancing because I knew thirteen ways to deceive people by pretending to trust them. I thought there were no more. Now I have discovered a fourteenth. That is why I dance!
