audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    merchant:
      display_name: 商人
      tts:
        delivery: 老实谨慎，受骗后悲痛惶恐，得救时欣喜若狂
        timbre: 朴实略显疲惫的成年男声
        pace: 适中，焦急时稍快
        pitch: 中
    beeka_mull:
      display_name: 比卡·穆尔
      tts:
        delivery: 圆滑世故，翻脸时凶狠，败露后仍有无赖式的机敏
        timbre: 肥厚洪亮的成年男声
        pace: 从容，发怒时急促
        pitch: 中低
    kooshy_ram:
      display_name: 库希·拉姆
      tts:
        delivery: 快活豪爽，足智多谋，说话干脆而有玩笑意味
        timbre: 明朗有活力的年轻男声
        pace: 轻快
        pitch: 中高
    friend:
      display_name: 同行的朋友
      tts:
        delivery: 清醒随意，随口纠正同伴
        timbre: 清楚平稳的年轻男声
        pace: 适中
        pitch: 中
    attendant:
      display_name: 随轿的绅士
      tts:
        delivery: 庄重周全，演戏时恭谨，揭晓骗局时含笑发问
        timbre: 沉稳清晰的成年男声
        pace: 从容
        pitch: 中低
    messenger:
      display_name: 信使
      tts:
        delivery: 匆忙而恭敬，传话简洁明白
        timbre: 明亮的年轻男声
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 商人的宝石匣
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，印度斯坦有个村庄，住着一位穷商人。他每天起得早，干得苦，歇得晚，霉运却像认准了他，怎么也不肯走。商人终于离开故乡，到遥远的地方去碰碰运气。十二年后，他时来运转，积下的财富已经足够安度余生，便决定回乡和亲友一起生活。回家的路又远又险，他把财产换成几颗名贵宝石，锁进一只小匣，贴身藏好。大路上常有强盗打劫旅客，他又换上穷人的旧衣服，让自己看起来一无所有，这才上路。
        - id: ch01-b02
          speaker: narrator
          text: 商人一路走得很快。离故乡只剩几天路程时，他来到一座大城。如今快到家了，他以为不必再怕强盗，便买来体面衣裳，恢复富商的气派。他穿着新衣向城中走去，城门旁正是一片热闹的市集。铺子里陈列着昂贵的绸缎、地毯和各国货物，其中最气派的一家，主人名叫比卡·穆尔。他坐在精心铺开的货物之间，悠闲地吸着长长的银烟管。商人上前问候，也坐下来挑选货物。比卡·穆尔十分精明，一边陪客人闲谈，一边仔细观察。几句话下来，他已经看出眼前的人远比外表富有，只是故意藏着秘密。
        - id: ch01-b03
          speaker: narrator
          text: 商人买过几样东西，比卡·穆尔又请他吃点心，两个人很快亲热地聊起来。听说商人正要返回自己的村庄，比卡·穆尔像是好意提醒他。
        - id: ch01-b04
          speaker: beeka_mull
          text: 那条路上的盗贼可多得很，你千万要小心。
        - id: ch01-b05
          speaker: narrator
          text: 商人的脸一下白了。他辛苦十二年才攒下家业，要是在最后几天被人抢走，那才真叫苦不堪言。眼前这位店主体面、富足，又熟悉当地情形，他越想越觉得应该听从忠告。
        - id: ch01-b06
          speaker: merchant
          text: 拉拉吉，能不能请您替我保管一只小匣子？我回到村里，就带五六个强壮的亲友来取。
        - id: ch01-b07
          speaker: narrator
          text: 比卡·穆尔摇了摇头。
        - id: ch01-b08
          speaker: beeka_mull
          text: 抱歉，这不是我做的买卖。责任太大，我可不敢答应。
        - id: ch01-b09
          speaker: merchant
          text: 我在城里谁也不认识。您存放自己的贵重东西，总有安全的地方。请您无论如何帮我一次。
        - id: ch01-b10
          speaker: narrator
          text: 比卡·穆尔仍旧客气地拒绝，而且态度十分坚决。可商人已经泄露了自己身怀财物，又怕四处找人会让更多人知道秘密，只好一次次恳求。比卡·穆尔这才勉强答应。商人从贴身的地方取出宝石匣，亲手交给他。比卡·穆尔当着客人的面，把小匣和其他珍宝一同锁进一口坚固的大箱。两个人说尽客套话，又互相许下保证，然后才告别。
        - id: ch01-b11
          speaker: narrator
          text: 东方的市集里，店门全都大敞着。货物从铺子深处一直摆到高出街面几尺的台子和廊檐下。两个人谈了那么久，窄街上的店主自然全看在眼里。商人并不知道，这一带几乎家家店主都是贼，其中最狡猾、最贪心的，就是比卡·穆尔。走出铺子以后，他想到全部家当如今落在陌生人手里，终究有些不安，便一边闲逛，一边拐弯抹角地打听比卡·穆尔的人品。每个奸商都猜到这件事有利可图，盼着以后分到赃物，于是人人都把比卡·穆尔夸成正人君子。
        - id: ch01-b12
          speaker: narrator
          text: 听过街坊众口一词的赞美，商人的担忧终于平息。他带着轻松了许多的心情回到村庄。大约一星期后，他带着五六个强壮的年轻侄儿和朋友再次进城，请他们帮忙把珍贵的宝石匣平安抬回家。到了城中心的大市集，他让同伴们留在那里等候，自己去店里取匣子。众人全都答应了。商人独自来到比卡·穆尔的铺前，走上台阶，先客气地行礼。
    - id: ch02
      title: 无药可治的病
      blocks:
        - id: ch02-b01
          speaker: merchant
          text: 您好，拉拉吉。
        - id: ch02-b02
          speaker: narrator
          text: 比卡·穆尔装作没看见。商人只好再问候一次，店主这才不耐烦地抬起头。
        - id: ch02-b03
          speaker: beeka_mull
          text: 你已经说过两遍“您好”了。到底想干什么，为什么不快讲？
        - id: ch02-b04
          speaker: merchant
          text: 您真的不记得我了吗？
        - id: ch02-b05
          speaker: beeka_mull
          text: 我为什么要记得你？好主顾已经够我费心了，难道每个来讨施舍的叫花子，我也得记住？
        - id: ch02-b06
          speaker: narrator
          text: 商人听得浑身发抖，还是急忙提醒他。
        - id: ch02-b07
          speaker: merchant
          text: 拉拉吉，您一定记得那只小匣子。我把它交给您保管，您还亲口答应，我回来就能取走。您当时明明说过——
        - id: ch02-b08
          speaker: beeka_mull
          text: 无赖，滚出我的铺子！你这个不要脸的恶棍，谁不知道我从不替别人保管财宝？我看住自己的东西都嫌麻烦。快滚！
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: 比卡·穆尔一边吼，一边把商人往外推。商人竭力抵抗，不肯离开，两个看客便上来帮忙。他们把他扔到大路上，活像从骆驼背上卸下一捆货。可怜人从尘土里慢慢爬起，浑身青肿，衣衫破损，鲜血也流了出来，却一点感觉不到肉体的疼。他心里只剩一个可怕又麻木的念头：十二年积下的全部家业都没了，自己已经彻底破产。比卡·穆尔还站在散乱的绸缎和地毯中间，肥胖的身子气得发抖。商人拖着脚步离远一些，找到一堵墙，蜷缩着靠上去。他双手抱住头，任由痛苦和绝望将自己吞没。
        - id: ch02-b10
          speaker: narrator
          text: 他一动不动，像是变成了石头。天渐渐黑了。夜里大约十一点，一个快活的年轻人和朋友路过。年轻人名叫库希·拉姆，他看见墙边弓着身子的商人，随口说道：
        - id: ch02-b11
          speaker: kooshy_ram
          text: 那准是个贼。
        - id: ch02-b12
          speaker: friend
          text: 不对。就算到了夜里，贼也不会这样坐在人眼前。
        - id: ch02-b13
          speaker: narrator
          text: 两个人继续赶路，很快忘了这件事。清晨五点左右，库希·拉姆回家时，竟发现商人还在原处，姿势和几小时前一模一样。他从深夜一直坐到天亮，露天街道上来往的人都能看见。一个人这样熬过整夜，必定遇到了大麻烦。库希·拉姆决定问个明白，便走过去，轻轻摇动商人的肩膀。
        - id: ch02-b14
          speaker: kooshy_ram
          text: 你是谁？为什么一直坐在这里？是不是病了？
        - id: ch02-b15
          speaker: merchant
          text: 是啊，我得了病，而且世上没有药能治。
          emotion: sad
        - id: ch02-b16
          speaker: kooshy_ram
          text: 别胡说。跟我走吧，我知道一服药，说不定正好能治你。
        - id: ch02-b17
          speaker: narrator
          text: 库希·拉姆抓住商人的胳膊，把他拉起，硬是带回自己的住处。他先让商人喝下一大杯酒，又拿来食物。等这个可怜人恢复了些精神，他才请对方讲出遭遇。
        - id: ch02-b18
          speaker: narrator
          text: 至于那些留在大市集的同伴，他们的头脑实在迟钝。见商人一直没回来，众人竟以为他早已独自回家。等得不耐烦后，他们也返回村庄，丢下他自己收拾残局。若没有库希·拉姆相救，商人真不知会落到什么地步。
        - id: ch02-b19
          speaker: narrator
          text: 库希·拉姆还是个孩子时便继承了一大笔钱，却没有人教他应该怎样使用。他天性豪爽，心地善良，脑筋也很机敏，只可惜花钱像泼水。无论眼前碰到什么人、什么事，只要离他最近，他便肯把钱花上去。偏偏离他最近的，往往就是他自己，所以钱大多浪费在自己身上。这一回，他忽然想帮助眼前这个绝望的商人，而且一旦打定主意，便一定要做到底。商人也从他的热心里重新找回信心，不再迟疑，把事情从头到尾讲了一遍。听说一个陌生人竟敢把全部财富托付给比卡·穆尔，库希·拉姆忍不住放声大笑。
        - id: ch02-b20
          speaker: kooshy_ram
          text: 他是全城最大的无赖。当然，也有人说我才是。眼下先不要急，你安心住在这里。过不了多久，我准能找到治你那种病的药。
        - id: ch02-b21
          speaker: narrator
          text: 这话给了商人一点勇气。他感激地接受邀请，暂时住了下来。几天后，库希·拉姆请来几位朋友，关起门商量了很久。商人听不清他们在说什么，只听到一阵又一阵大笑，仿佛那些人想出了一个绝妙的笑话。可笑声传到他耳里，却沉闷得很。他越想越觉得，比卡·穆尔绝不会把吞下的财宝吐出来。
    - id: ch03
      title: 墙边的信号
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 没过多久，一天，库希·拉姆来找商人，问起比卡·穆尔店铺附近的那堵墙。
        - id: ch03-b02
          speaker: kooshy_ram
          text: 还记得我发现你的地方吗？
        - id: ch03-b03
          speaker: merchant
          text: 我当然记得。
        - id: ch03-b04
          speaker: kooshy_ram
          text: 今天下午，你还去那里站着。仔细看，等有人给你信号，你就走到比卡·穆尔面前行礼，再问他：“拉拉吉，能请您把我寄放的那只匣子还给我吗？”
        - id: ch03-b05
          speaker: merchant
          text: 这能有什么用？上回讨要，他都不肯还。如今更不会答应了。
        - id: ch03-b06
          speaker: kooshy_ram
          text: 你只管照我的话做，一个字也别改。其余的事，全交给我。
        - id: ch03-b07
          speaker: narrator
          text: 那天下午，商人按时站到墙边。比卡·穆尔明明已经看见他，两个人却都装作若无其事。不久，一顶华丽的轿子沿着市集大街过来了。那正是贵妇出行所乘的样式，由四名身穿富丽号衣的轿夫抬着，轿帘和装饰华美得叫人移不开眼。旁边跟着一位神情庄重的绅士。商人认出，他曾经到库希·拉姆家做客。绅士身后还有一名仆役，头顶着蒙布的箱子。
        - id: ch03-b08
          speaker: narrator
          text: 轿子轻快地来到铺前，稳稳落地。胖店主马上起身，对走近的绅士深深鞠躬。
        - id: ch03-b09
          speaker: beeka_mull
          text: 敢问轿中是哪位贵人，竟肯屈尊光临小店？在下能为她做些什么？
        - id: ch03-b10
          speaker: narrator
          text: 绅士先凑到轿帘边，低声说了几句，然后转身解释。
        - id: ch03-b11
          speaker: attendant
          text: 轿中是我的一位女眷。她正在远行，丈夫却不能继续陪伴，所以想把一箱珠宝交给您保管。
        - id: ch03-b12
          speaker: narrator
          text: 比卡·穆尔又一躬鞠到地面。
        - id: ch03-b13
          speaker: beeka_mull
          text: 小店原本不做这样的买卖。不过能为夫人效劳，在下实在荣幸。哪怕拼上性命，我也一定守好箱子。
        - id: ch03-b14
          speaker: narrator
          text: 仆役被叫到跟前，放下头顶的箱子。箱锁一开，成堆的珠宝立刻映入比卡·穆尔眼中。他看得心醉神迷，拿起一颗又一颗名贵宝石翻看，馋得几乎流出口水。远处的商人把这一切看得清清楚楚。这时，轿帘后忽然伸出一只手，在背向店铺的一侧朝他招了招。他先怀疑自己看错了，心想这会不会就是约好的信号。那只手很快再次招动，看起来已经有些不耐烦。商人终于明白，动手的时候到了。
        - id: ch03-b15
          speaker: narrator
          text: 他安静地走上前，先向比卡·穆尔行礼。此刻，店主还坐在珠宝箱前，认定命运和几个傻瓜正把巨大的财富送进自己手里。
        - id: ch03-b16
          speaker: merchant
          text: 拉拉吉，能请您把我寄放的那只匣子还给我吗？
        - id: ch03-b17
          speaker: narrator
          text: 比卡·穆尔猛地抬头，仿佛突然挨了一针。可他马上想到，如果商人又闹起来，这些新来的富客一定会失去信任。为了更大的一箱珠宝，他只好咽下怒气。
        - id: ch03-b18
          speaker: beeka_mull
          text: 哎呀，当然可以！瞧我，竟然把这件事全忘了。
        - id: ch03-b19
          speaker: narrator
          text: 比卡·穆尔离开片刻，果然取来了那只小匣，把它放进商人颤抖的双手。商人赶紧从衣襟里扯出钥匙，那钥匙一直用细绳挂在他的脖子上。他当场打开匣盖，低头仔细查看。十二年辛苦换来的宝石全都还在，一颗不少。商人再也压不住狂喜，抱紧匣子冲到大路中央，像个疯子似的跳起舞来。他一面高声欢呼，一面放声大笑，整座市集都听得见。
    - id: ch04
      title: 第十四种骗术
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 就在这时候，一个信使飞奔而来，向随轿的绅士行过礼，匆匆传话。
        - id: ch04-b02
          speaker: messenger
          text: 夫人的丈夫已经回来，愿意陪她继续赶路。那箱珠宝不必寄存在这里了。
        - id: ch04-b03
          speaker: narrator
          text: 绅士听完消息，立刻合上装满珠宝的箱盖，重新锁好，再交还给一直等候的仆役。比卡·穆尔只能眼看着箱子离开。这时，轿中猛然爆发出一阵大笑。紧接着，跳出来的根本不是什么贵妇，而是库希·拉姆。骗局终于揭晓，他马上冲到路中央，加入那个失而复得的商人。两个人一起发疯似的跳舞、大笑。比卡·穆尔呆呆看着他们，忽然也发出一串尖厉的笑声。他扯掉头巾，蹦到大路上，和两个人一同跳起来，还不停打着响指，直到累得气喘吁吁才停下。
        - id: ch04-b04
          speaker: attendant
          text: 拉拉吉，你为什么也跳？商人拿回全部家产，所以要跳。库希·拉姆是个疯子，又成功耍了你一回，所以也跳。可你究竟为什么跳呢？
        - id: ch04-b05
          speaker: narrator
          text: 比卡·穆尔气喘吁吁，一双充血的眼睛狠狠瞪着他。
        - id: ch04-b06
          speaker: beeka_mull
          text: 我原本知道十三种骗人的办法，每一种都是先假装信任别人，再叫对方上当。我还以为世上再没有别的法子。今天竟让我见识了第十四种，所以我也要跳！
        - id: ch04-b07
          speaker: narrator
          text: 这是坎贝尔少校在费罗兹普尔采录的一则旁遮普故事。故事里人们说的“拉拉”，是一种尊敬的称号，“吉”是礼貌的后缀，合起来大致相当于“尊敬的先生”。
