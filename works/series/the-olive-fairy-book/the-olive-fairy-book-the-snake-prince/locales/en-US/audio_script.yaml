  chapters:
    - id: ch01
      title: The Snake in the Brass Pot
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once, in a city, an old woman lived all alone. She was desperately poor. One day she looked around her house and found only a handful of flour. She had no money for more, and no hope of earning any. Sadly, she carried her little brass pot down to the river. She meant to bathe, fetch water, and go home to bake one last flat cake. After that, she had no idea what would become of her.
        - id: ch01-b02
          speaker: narrator
          text: >-
            While she bathed, she left the pot on the bank with a cloth over its mouth to keep it clean. When she came out and lifted the cloth, she saw the shining coils of a deadly snake inside. She quickly stuffed the cloth back into the pot and held it tight.
        - id: ch01-b03
          speaker: old_woman
          text: >-
            Ah, kind death! I will carry you home, shake you out of my pot, and let you bite me. Then I shall die, and all my troubles will be over.
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: >-
            With that sorrowful thought, she hurried home, keeping the cloth pressed firmly in place. She shut every door and window, pulled away the cloth, and turned the pot upside down over the hearthstone. But no snake fell out. Instead, something landed with a rattle and a clang: a magnificent necklace blazing with jewels.
        - id: ch01-b05
          speaker: narrator
          text: >-
            For several moments she could neither think nor speak. She only stared. Then her hands began to tremble. She picked up the necklace, wrapped it in a corner of her veil, and hurried to the king’s public hall.
        - id: ch01-b06
          speaker: old_woman
          text: >-
            I have a petition, Your Majesty. Please hear it where no one else can listen.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The king granted her request. When they were alone, she opened her veil at his feet, and the splendid necklace tumbled out in glittering coils. The king stared in amazement and delight. The longer he looked, the more certain he became that he must own it. He paid her five hundred silver pieces and slipped the necklace straight into his pocket.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The old woman went away full of happiness. She had entered the hall with nothing and left with enough money to support herself for the rest of her life. As soon as the king could leave his work, he hurried to the queen and showed her his prize. She turned the flashing necklace over and admired it every bit as much as he did. When they had both finished looking at it, they locked it in the great chest that held all her jewels. No one else carried the key. It always hung safely around the king’s neck.
    - id: ch02
      title: A Child in the Jewel Chest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Before long, a neighboring king sent wonderful news. A beautiful baby girl had been born to him, and he invited the nearby rulers to a great feast. The queen said that of course she and her husband must go, and she would wear her new necklace. There was little time to prepare. At the last moment, the king opened the jewel chest. The necklace was gone. In its place sat a plump baby boy, crowing and shouting.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The king nearly fell backward. Then he shouted for his wife so loudly that she came running, certain the necklace had been stolen.
        - id: ch02-b03
          speaker: king
          text: >-
            Come and see! We have always wished for a son, and now heaven has sent us one!
          emotion: happy
        - id: ch02-b04
          speaker: queen
          text: What are you talking about? Have you gone mad?
          emotion: surprised
        - id: ch02-b05
          speaker: king
          text: >-
            Mad? I hope not! Look inside the chest. That is what we have instead of the necklace!
        - id: ch02-b06
          speaker: narrator
          text: >-
            The king danced around the open chest. At that moment the baby gave a joyful crow, almost as if he wanted to dance too. The queen cried out and hurried closer.
        - id: ch02-b07
          speaker: queen
          text: Oh, what a darling! Where in the world did he come from?
          emotion: surprised
        - id: ch02-b08
          speaker: king
          text: >-
            I cannot tell you. We locked a necklace in this chest. I opened it just now, and found no necklace at all. There was only this baby, and he is as fine a child as anyone has ever seen.
        - id: ch02-b09
          speaker: narrator
          text: The queen had already gathered the baby into her arms.
        - id: ch02-b10
          speaker: queen
          text: >-
            Oh, blessed child! No necklace ever made would look half so fair against a queen’s heart. Write to our neighbor. Tell him we cannot attend his feast, because now we have a feast and a baby of our own. What a happy day!
          emotion: happy
        - id: ch02-b11
          speaker: narrator
          text: >-
            So they canceled their visit. For an entire week, the city’s bells, guns, trumpets, and people scarcely rested. Bells rang, guns boomed, trumpets blared, fireworks burst, and everyone feasted and rejoiced as never before.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Years passed. The king’s boy and the neighboring king’s girl both grew strong and well. Their fathers decided that the children should marry as soon as they were old enough. There was a great deal of business to settle first. Papers and agreements were drawn up and signed. Wise heads nodded, gray beards were stroked, and at last the bargain was sealed. Then it waited for the children to grow. When the prince and princess reached eighteen, both kings agreed that the time had come. The young prince traveled to the neighboring kingdom to claim his bride, and there they were married amid another great celebration.
    - id: ch03
      title: The Secret of the Prince
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            There was something the princess had not been told. After the old woman sold the necklace, the king brought her into the palace to nurse the young prince. She loved the boy dearly and never failed in her care of him. Still, she could not help talking just a little. As the years passed, whispers began to spread. People said there must have been magic in the way the prince was born. Like most rumors, this one traveled far. In time it reached the parents of the princess. Now that their daughter was about to marry him, her mother wanted to know the truth. On the night before the ceremony, she called the princess aside and gave her private advice.
        - id: ch03-b02
          speaker: princess_mother
          text: >-
            The first thing you must do is learn the truth about the prince. Do not answer him, whatever he says, until he asks why you are silent. Then ask about his magical birth. Say nothing more until he tells you the secret.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The princess promised. After the wedding, the prince spoke to his bride, but she gave him no answer. Even when he asked about the home she had left behind, she would not say a word. At last, he asked why she refused to speak.
        - id: ch03-b04
          speaker: princess
          text: Tell me the secret of your birth.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The prince was hurt and deeply displeased. She pressed him again and again, but he would not explain. He always gave the same warning.
        - id: ch03-b06
          speaker: prince
          text: If I tell you, you will wish you had never asked.
          emotion: sad
        - id: ch03-b07
          speaker: narrator
          text: >-
            Several months passed this way. The princess kept pressing him for an answer, and the prince kept refusing. It was not the happy beginning that marriage ought to have brought either of them. The secret was still a secret. It lay between them like a cloud between the sun and earth, leaving everything that should have been fair and bright looking dull and sad.
        - id: ch03-b08
          speaker: narrator
          text: At last, the prince could endure it no longer. One day he spoke to his wife.
        - id: ch03-b09
          speaker: prince
          text: >-
            At midnight, I will tell you my secret if you still want to know it. But you will regret it for the rest of your life.
          emotion: sad
        - id: ch03-b10
          speaker: narrator
          text: >-
            The princess was delighted that she had won. She paid no attention to his warning. That night the prince ordered two horses to be ready shortly before midnight. He helped her onto one and mounted the other. Together they rode to the river, to the very place where the old woman had found the snake in her brass pot. There he stopped his horse.
        - id: ch03-b11
          speaker: prince
          text: Do you still insist that I tell you?
          emotion: sad
        - id: ch03-b12
          speaker: princess
          text: Yes.
        - id: ch03-b13
          speaker: prince
          text: If I do, remember this. You will regret it all your life.
        - id: ch03-b14
          speaker: princess
          text: Tell me!
        - id: ch03-b15
          speaker: prince
          text: >-
            Then know the truth. I am the son of a king in a faraway country, but an enchantment changed me into a snake.
        - id: ch03-b16
          speaker: narrator
          text: >-
            The word “snake” had scarcely left his lips when he vanished. The princess heard a rustle and saw the river ripple. In the pale moonlight, a snake swam out into the water and soon disappeared. She waited with her heart pounding, hoping something would happen and the prince would return. No one came. The wind moaned through the riverside trees. Night birds called, a jackal howled far away, and the black river flowed silently below her.
        - id: ch03-b17
          speaker: narrator
          text: >-
            Morning came, and people found her still on the riverbank. She was weeping, with her hair and clothing in disorder. They questioned her, and they searched for news, but neither she nor anyone else could tell them what had become of her husband. The princess asked them to build her a little house of black stone on that very bank. When it was finished, she moved there and put on mourning. A few servants stayed with her, and guards stood outside to watch over the lonely house.
    - id: ch04
      title: The Midnight Visitor
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            A long, long time went by, but the princess never stopped mourning her prince. She would see no one. She would go nowhere beyond the black stone house and the garden around it. Then, one morning, she woke and saw a strange stain of fresh mud upon the carpet. Someone seemed to have entered her room during the night. She immediately sent for the guards who kept watch outside the house by day and by night, and asked them who had come in while she slept.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The guards declared that no one could possibly have entered. Their watch was so careful, they said, that not even a bird could fly into the house without their knowledge. Yet when the princess showed them the stain, not one guard could explain it. The following morning, another patch of wet river mud appeared on the carpet. Again the princess called everyone and questioned each person with the greatest care. Everyone denied entering, and no one could tell her how the mud had reached her room.
        - id: ch04-b03
          speaker: narrator
          text: >-
            On the third night, the princess decided that she would solve the mystery herself. She lay awake and watched the room. To make certain sleep could not overcome her, she cut one finger with a small knife and rubbed salt into the wound. The sharp pain kept her eyes open. When midnight came, she saw a snake wriggling across the floor. It had come from the river, and it carried a lump of wet mud in its mouth. The snake moved close to the bed, raised its head, and dropped its muddy head upon the bedclothes. The princess was terribly frightened. Even so, she struggled to master her fear and called out to it.
        - id: ch04-b04
          speaker: princess
          text: Who are you? What are you doing here?
          emotion: fearful
        - id: ch04-b05
          speaker: prince
          text: I am the prince, your husband. I have come to visit you.
        - id: ch04-b06
          speaker: narrator
          text: The princess began to weep. The snake went on.
        - id: ch04-b07
          speaker: prince
          text: >-
            Did I not warn you that you would regret learning my secret? Have you not regretted it?
          emotion: sad
        - id: ch04-b08
          speaker: princess
          text: >-
            Oh, yes! I have regretted it, and I will regret it all my life. Is there nothing I can do?
          emotion: sad
        - id: ch04-b09
          speaker: prince
          text: There is one thing, if you are brave enough to do it.
        - id: ch04-b10
          speaker: princess
          text: Just tell me. I will do anything!
        - id: ch04-b11
          speaker: prince
          text: >-
            On a certain night, place a large bowl of milk and sugar in each corner of this room. Every snake in the river will come to drink. The snake leading them will be their queen. Stand in her path at the door and call, “Oh, Queen of Snakes, give me back my husband!” Perhaps she will grant it. But if fear makes you step aside, you will never see me again.
        - id: ch04-b12
          speaker: narrator
          text: Then he glided away.
    - id: ch05
      title: The Queen of Snakes
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The princess waited for the night her husband had named. When it came, she brought four large bowls into her room, filled every one with milk and sugar, and placed one in each corner. Then she took her place in the doorway and waited. At midnight, a great hissing and rustling rose from the direction of the river. It grew louder and nearer. Soon the ground seemed to be alive with dreadful, twisting bodies. Snakes were coming in a vast procession toward the house. Their eyes glittered in the darkness, and their forked tongues flickered as they moved.
        - id: ch05-b02
          speaker: narrator
          text: >-
            At the front crawled a huge, repulsive creature covered in scales. She led the terrible procession. The guards were so frightened that every one of them ran away. But the princess stayed in the doorway. Her face was white as death, and she clasped her hands tightly to keep herself from screaming or fainting before she had done her part.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The snakes drew near and found her blocking their path. They raised their horrible heads, swayed from side to side, and fixed their wicked little eyes upon her. Their breath seemed to poison the air itself. Still, the princess did not move. When the leading snake came within a few feet, she cried out.
        - id: ch05-b04
          speaker: princess
          text: Oh, Queen of Snakes, Queen of Snakes, give me back my husband!
          emotion: fearful
        - id: ch05-b05
          speakers: [river_snake_1, river_snake_2, river_snake_3]
          ensemble: chorus
          text: Her husband? Her husband?
        - id: ch05-b06
          speaker: narrator
          text: >-
            The rustling crowd seemed to pass those words from snake to snake. Their queen kept coming until her head was almost against the princess’s face. Her tiny eyes flashed like fire. The princess held her ground and called once more.
        - id: ch05-b07
          speaker: princess
          text: Oh, Queen of Snakes, Queen of Snakes, give me back my husband!
          emotion: fearful
        - id: ch05-b08
          speaker: snake_queen
          text: Tomorrow you shall have him. Tomorrow!
        - id: ch05-b09
          speaker: narrator
          text: >-
            The princess heard the promise and knew that she had won. Only then did her courage give way. She staggered back from the doorway, sank upon her bed, and fainted. Through her faint, it seemed as though she were dreaming. The room filled from wall to wall with snakes. They crowded around the four bowls, jostling and quarreling with one another as they drank the sweet milk. They did not leave until they had finished it all. Then, one after another, they slipped out of the house and returned to the river.
    - id: ch06
      title: The Prince Comes Home
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Early the next morning, the princess rose and removed the mourning clothes she had worn for five full years. She dressed in bright and beautiful colors. Then she swept and cleaned the house. She decorated it with garlands, sweet flowers, and green ferns, as though she were preparing for her wedding all over again.
        - id: ch06-b02
          speaker: narrator
          text: >-
            When darkness came, she hung lanterns through the woods and gardens. She laid a table for a feast and lit a thousand wax candles inside the house. Then she waited. She did not know what form her husband would take when he came.
        - id: ch06-b03
          speaker: narrator
          text: >-
            At midnight, the prince strode up from the river. He was laughing, though tears shone in his eyes. The princess ran to him and threw herself into his arms, laughing and crying with him.
        - id: ch06-b04
          speaker: narrator
          text: >-
            The prince had come home. The next day, husband and wife returned together to the palace. The old king wept for joy when he saw them. The bells that had been quiet for so long rang again. Guns fired, trumpets blared, and the city filled once more with feasting and celebration.
        - id: ch06-b05
          speaker: narrator
          text: >-
            The old woman who had nursed the prince became nurse to his children too. At least, that was what everyone called her. She was far too old to do much for them except love them. Still, she believed she was useful, and she knew she was happy.
        - id: ch06-b06
          speaker: narrator
          text: >-
            The prince and princess were truly happy as well. In time, they became king and queen, and they lived and ruled for many long and prosperous years.
