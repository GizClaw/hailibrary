audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容温厚，悲剧转折处克制而沉静
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    king:
      display_name: 国王
      tts:
        delivery: 威严爽朗，喜悦时率真热烈
        timbre: 浑厚明亮的成熟男声
        pace: 适中
        pitch: 中低
    queen:
      display_name: 王后
      tts:
        delivery: 高贵敏锐，惊喜时真挚温柔
        timbre: 清澈端庄的成年女声
        pace: 适中
        pitch: 中高
    old_woman:
      display_name: 老妪
      tts:
        delivery: 谦卑朴实，悲伤克制，惊奇时微微发颤
        timbre: 苍老柔和的女声
        pace: 稍缓
        pitch: 中高
    prince:
      display_name: 王子
      tts:
        delivery: 温柔庄重，警告时低沉而忧伤
        timbre: 清朗沉稳的年轻男声
        pace: 适中
        pitch: 中低
    princess:
      display_name: 公主
      tts:
        delivery: 清晰坚定，从执拗转为悔恨与勇敢
        timbre: 明净柔韧的年轻女声
        pace: 适中
        pitch: 中高
    princess_mother:
      display_name: 公主的母亲
      tts:
        delivery: 郑重私密，带着不容置疑的好奇
        timbre: 成熟端庄的女声
        pace: 适中
        pitch: 中
    snake_queen:
      display_name: 蛇后
      tts:
        delivery: 冰冷威严，一字一顿
        timbre: 低沉带嘶声的女声
        pace: 缓慢
        pitch: 低
    river_snake_1:
      display_name: 河蛇一
      tts:
        delivery: 低声疑问，气息细长
        timbre: 尖细带嘶声
        pace: 适中
        pitch: 中高
    river_snake_2:
      display_name: 河蛇二
      tts:
        delivery: 低声疑问，阴冷迟疑
        timbre: 干涩带嘶声
        pace: 适中
        pitch: 中
    river_snake_3:
      display_name: 河蛇三
      tts:
        delivery: 低声疑问，幽沉缓慢
        timbre: 低哑带嘶声
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 铜罐里的蛇
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，一座城里住着一位孤苦的老妪。她穷得几乎活不下去了。一天，她翻遍家中，只找到一把面粉。她没有钱再买，也不指望能挣到钱，只好提着小铜罐，伤心地走向河边。她想先洗个澡，再取些水，回家把最后一点面粉烙成一张无酵饼。吃完以后怎么办，她心里一点主意也没有。
        - id: ch01-b02
          speaker: narrator
          text: >-
            老妪洗澡时，把铜罐留在岸上，还用布蒙住罐口，免得里面弄脏。等她上岸揭开布，准备打水，却看见罐里盘着一条毒蛇。蛇鳞在光里闪闪发亮。她赶紧把布塞回罐口，用手死死按住。
        - id: ch01-b03
          speaker: old_woman
          text: >-
            啊，仁慈的死神！我把你带回家，再从罐里抖出来。你只要咬我一口，我死了，一切苦难也就到头了。
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: >-
            怀着这个悲苦的念头，老妪匆匆回到家。她一路按紧罐口的布，进屋后又关严所有门窗，这才揭掉布，把铜罐倒扣在炉台上。可是，掉出来的哪里是什么毒蛇。只听一阵叮叮当当，一串华美无比的项链落了下来，满串宝石亮得耀眼。
        - id: ch01-b05
          speaker: narrator
          text: >-
            老妪怔在原地，好一会儿不能思想，也说不出话。后来，她才伸出发抖的双手，拾起项链，包进面纱的一角，急忙赶往国王接见臣民的大殿。
        - id: ch01-b06
          speaker: old_woman
          text: >-
            陛下，我有一事相求！求您单独听我禀告，不能让旁人听见。
        - id: ch01-b07
          speaker: narrator
          text: >-
            国王答应了。等殿里只剩他们两人，老妪便在国王脚边抖开面纱。那串项链盘曲着落下，珠光闪烁。国王看得又惊又喜。他越看越舍不得，非要立刻拥有它不可。于是，他付给老妪五百枚银币，把项链直接揣进了口袋。
        - id: ch01-b08
          speaker: narrator
          text: >-
            老妪高高兴兴地走了。那些钱足够让她安度余生。国王一办完政务，也马上去找王后，把这件宝物拿给她看。王后喜欢得不得了，甚至比国王还要欢喜。两人赏玩够了，便把项链锁进存放王后珠宝的大箱子。那把钥匙从不离开国王，一直挂在他的颈上。
    - id: ch02
      title: 珠宝箱里的孩子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            没过多久，邻国国王传来喜讯。他添了一位非常可爱的女婴，要请邻近诸国的君主赴宴庆贺。王后说，他们当然得去，她还要戴上那串新项链。启程前时间紧迫，直到最后一刻，国王才去开珠宝箱。可项链不见了。原先放项链的地方，竟坐着一个白白胖胖的男婴，正咿咿呀呀地欢叫。
        - id: ch02-b02
          speaker: narrator
          text: >-
            国王惊得差点向后摔倒。等他回过神来，立刻扯开嗓子呼唤妻子。王后听见喊声，连忙跑来，还以为项链一定被偷了。
        - id: ch02-b03
          speaker: king
          text: >-
            快来看！我们不是一直想要个儿子吗？现在上天真的送来一个！
          emotion: happy
        - id: ch02-b04
          speaker: queen
          text: >-
            你到底在说什么？难道你疯了？
          emotion: surprised
        - id: ch02-b05
          speaker: king
          text: >-
            疯了？但愿我还没有！你快看看箱子里。那串项链换成了这个！
        - id: ch02-b06
          speaker: narrator
          text: >-
            国王兴奋得绕着敞开的箱子跳起舞来。就在这时，婴儿也响亮地欢叫了一声，仿佛很想站起来陪他一起跳。王后惊呼着跑到箱边，低头一看。
        - id: ch02-b07
          speaker: queen
          text: >-
            啊，多可爱的宝贝！他究竟是从哪儿来的？
          emotion: surprised
        - id: ch02-b08
          speaker: king
          text: >-
            我也说不清。我只知道，我们锁进去的明明是一串项链。可我刚才打开箱子，项链没了，只看见这个婴儿。他可真是世上再俊美不过的孩子。
        - id: ch02-b09
          speaker: narrator
          text: >-
            王后早已把婴儿抱进怀里。
        - id: ch02-b10
          speaker: queen
          text: >-
            啊，上天眷顾的孩子！再美的项链戴在王后胸前，也比不上你。快写信告诉邻国国王，我们不能赴宴了。我们自己也有宴会要办，自己也有了一个婴儿！今天真是幸福！
          emotion: happy
        - id: ch02-b11
          speaker: narrator
          text: >-
            于是，他们取消了出访。为了庆贺这个孩子，城里整整热闹了一个星期。钟不停地敲，礼炮不停地响，号角不停地吹。无论大人孩子，都忙着放烟火、赴宴席，尽情欢呼庆祝。这样的盛况，人们从来没有见过。
        - id: ch02-b12
          speaker: narrator
          text: >-
            几年过去，国王家的男孩和邻国国王家的女孩都健健康康地长大了。两位国王商定，等孩子们到了年纪，就让他们成婚。为这门亲事，他们签署文书，订立契约。贤明的脑袋点个不停，灰白的胡须捻了又捻。最后，约定终于签字盖印，只等孩子长大。王子和公主一满十八岁，两位国王便说婚期到了。年轻的王子前往邻国迎娶新娘，两人又在一场盛大的欢庆中结为夫妻。
    - id: ch03
      title: 王子的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            有一件事，公主起初并不知道。卖掉项链以后，老妪被国王召进宫中，做了小王子的乳母。她很疼爱王子，照料他也始终尽心，只是有一点点多嘴。慢慢地，外面传起流言，说王子的降生一定带着魔法。这话后来传到了公主父母耳中。女儿就要嫁给王子，母亲也像许多人一样，非弄清真相不可。婚礼前夜，她把女儿叫到一旁，悄悄叮嘱起来。
        - id: ch03-b02
          speaker: princess_mother
          text: >-
            你嫁过去以后，头一件事就是查清王子的传言。不管他说什么，你都别回答，等他亲口问你为什么沉默。那时，你就追问他那场神奇的降生究竟藏着什么秘密。他若不肯说，你也不要再开口。
        - id: ch03-b03
          speaker: narrator
          text: >-
            公主答应了母亲。婚后，王子同新娘说话，她一句也不回应。哪怕王子问起她从前的家，她仍然不开口。王子怎么也想不明白，最后只好问她为什么不肯说话。
        - id: ch03-b04
          speaker: princess
          text: >-
            先告诉我，你的降生藏着什么秘密。
        - id: ch03-b05
          speaker: narrator
          text: >-
            王子听了很伤心，也很不高兴。公主一次次逼问，他却始终不肯透露，只反复给她同一个回答。
        - id: ch03-b06
          speaker: prince
          text: >-
            我要是说了，你一定会后悔自己问过这件事。
          emotion: sad
        - id: ch03-b07
          speaker: narrator
          text: >-
            他们这样过了好几个月。公主不停追问，王子始终拒绝。两人的新婚生活，本来应该幸福，却变得一点也不快活。秘密仍旧是秘密，横在他们中间，就像挡在太阳与大地之间的一片乌云，让原本明媚的一切都暗了下来，染上了忧伤。
        - id: ch03-b08
          speaker: narrator
          text: >-
            王子终于忍不下去了。一天，他对妻子开了口。
        - id: ch03-b09
          speaker: prince
          text: >-
            你若还是非知道不可，午夜时我就告诉你。可是，你会为这件事悔恨一辈子。
          emotion: sad
        - id: ch03-b10
          speaker: narrator
          text: >-
            公主只顾着为自己终于如愿而高兴，根本没有理会警告。当天夜里，王子吩咐人在午夜前备好两匹马。他扶公主骑上一匹，自己骑上另一匹。两人来到河边，停在老妪当初从铜罐里发现毒蛇的地方。王子勒住了马，神情悲伤。
        - id: ch03-b11
          speaker: prince
          text: >-
            到了现在，你还坚持要我说吗？
          emotion: sad
        - id: ch03-b12
          speaker: princess
          text: >-
            是的，我一定要知道。
        - id: ch03-b13
          speaker: prince
          text: >-
            那你记住，一旦我说出口，你会悔恨一生。
        - id: ch03-b14
          speaker: princess
          text: >-
            告诉我吧！
        - id: ch03-b15
          speaker: prince
          text: >-
            那就听清真相。我原本是遥远国度里一位国王的儿子，却中了魔法，变成了一条蛇。
        - id: ch03-b16
          speaker: narrator
          text: >-
            “蛇”字才离开王子的嘴唇，他就不见了。公主听见窸窣一响，又看见河面荡开波纹。朦胧的月光下，一条蛇游进河里，很快消失无踪。公主独自站在那里，心跳得厉害。她一遍遍等着，盼望会有什么事发生，盼望王子能回来。可是谁也没有回来。只有风在河岸的树间呜咽，夜鸟不停哀啼，远处传来豺狼的长嗥，脚下那条黑沉沉的河依旧无声流淌。
        - id: ch03-b17
          speaker: narrator
          text: >-
            清晨，人们在河岸找到了公主。她哭个不停，衣服和头发全乱了。人们问她，也到处打听，却始终没人知道王子去了哪里。公主请人在那片河岸上建一座黑石小屋。屋子建好后，她住了进去，从此穿起丧服。只有几名仆人陪着她，还有卫兵守在外面。
    - id: ch04
      title: 午夜来客
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            很久很久过去了，公主仍在为王子服丧。她不见任何人，也从不离开河边的小屋和四周的花园。一天早晨，她醒来以后，发现地毯上多了一块新鲜的泥迹。她叫来日夜守在屋外的卫兵，问自己睡着时有谁进过房间。卫兵们坚称，绝不可能有人进去。他们看守得那么严，连一只鸟飞过都瞒不过眼睛。可是，那块泥迹从哪儿来，谁也解释不了。
        - id: ch04-b02
          speaker: narrator
          text: >-
            第二天早晨，地毯上又出现了一块湿泥。公主仔细盘问每一个人，还是得不到答案。第三天夜里，她决定亲自醒着守候。为了不让自己睡着，她用小刀割破手指，又把盐揉进伤口，让疼痛驱走睡意。
        - id: ch04-b03
          speaker: narrator
          text: >-
            到了午夜，公主看见一条蛇贴着地面爬来，嘴里还衔着河泥。它来到床边，抬起头，把沾满泥的脑袋放在被褥上。公主怕得要命，却努力压住恐惧，向它问话。
        - id: ch04-b04
          speaker: princess
          text: >-
            你是谁？到我这里来做什么？
          emotion: fearful
        - id: ch04-b05
          speaker: prince
          text: >-
            我就是王子，是你的丈夫。我回来看看你。
        - id: ch04-b06
          speaker: narrator
          text: >-
            公主一听便哭了起来。蛇接着问她。
        - id: ch04-b07
          speaker: prince
          text: >-
            唉，我早就说过，一旦告诉你秘密，你一定会后悔。如今，你后悔了吗？
        - id: ch04-b08
          speaker: princess
          text: >-
            我当然后悔！我已经悔恨不已，而且会悔恨一辈子！难道我什么都不能做吗？
          emotion: sad
        - id: ch04-b09
          speaker: prince
          text: >-
            有一件事可以做，就怕你没有胆量。
        - id: ch04-b10
          speaker: princess
          text: >-
            只要你肯告诉我，无论是什么事，我都愿意去做！
        - id: ch04-b11
          speaker: prince
          text: >-
            那么，到了我说的那个夜晚，你要准备四大碗牛奶和糖，在房间四个角落各放一碗。河里的蛇都会爬出来喝奶。走在最前面的，就是蛇后。你必须守在门口，拦住她，对她说：“蛇后啊，蛇后，请把我的丈夫还给我！”她也许会答应。可你要是害怕了，不敢拦她，就永远也见不到我了。
        - id: ch04-b12
          speaker: narrator
          text: >-
            王子说完，便蜿蜒着离开了。
    - id: ch05
      title: 蛇后的承诺
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            到了约定的夜晚，公主备好四大碗加糖的牛奶，把它们放在房间四角，自己站到门口等候。午夜一到，河边传来一片响亮的嘶嘶声和窸窣声。很快，地面仿佛活了过来。无数可怕的蛇扭动着身躯，朝公主的小屋爬去。它们的眼睛闪着幽光，分叉的舌头不停颤动。队伍最前方，是一条庞大丑恶、浑身鳞片的怪蛇。那正是率领蛇群的蛇后。
        - id: ch05-b02
          speaker: narrator
          text: >-
            卫兵们全吓跑了。公主却还站在门口，脸色白得像死人。她把双手紧紧扣在一起，生怕自己尖叫，或是昏过去，没能完成该做的事。蛇群越来越近。它们发现公主挡住去路，便昂起骇人的头颅，一边左右摇摆，一边用恶毒的小眼睛盯着她。它们吐出的气息，仿佛连周围的空气也有了毒。
        - id: ch05-b03
          speaker: narrator
          text: >-
            公主还是一步不退。蛇后爬到离她只有几尺的地方，她终于喊出了那句话。
        - id: ch05-b04
          speaker: princess
          text: >-
            蛇后啊，蛇后，请把我的丈夫还给我！
          emotion: fearful
        - id: ch05-b05
          speakers: [river_snake_1, river_snake_2, river_snake_3]
          ensemble: chorus
          text: >-
            她要找的是她的丈夫吗？真的是她的丈夫吗？
        - id: ch05-b06
          speaker: narrator
          text: >-
            窸窣爬动的蛇群互相低语。蛇后却继续逼近，直到她的头几乎贴上公主的脸。她那两只小眼睛，像是要迸出火来。公主守在门口，身子一动不动，又一次开口。
        - id: ch05-b07
          speaker: princess
          text: >-
            蛇后啊，蛇后，请把我的丈夫还给我！
          emotion: fearful
        - id: ch05-b08
          speaker: snake_queen
          text: >-
            明天，你就会见到他。明天！
        - id: ch05-b09
          speaker: narrator
          text: >-
            公主听见这句承诺，知道自己赢了。她摇摇晃晃地离开门口，倒在床上，昏了过去。恍惚之间，她看见房里挤满了蛇。它们围着几碗牛奶推来搡去，争得不可开交，直到把牛奶喝得一滴不剩，这才纷纷离开。
        - id: ch05-b10
          speaker: narrator
          text: >-
            第二天，公主一早便起了床。她脱下那身已经穿了整整五年的丧服，换上鲜艳漂亮的衣裳。她把屋里清扫洗刷干净，又用芳香的花朵和蕨叶编成花环，扎成花束，四处装点。看上去，她仿佛又在筹备自己的婚礼。
        - id: ch05-b11
          speaker: narrator
          text: >-
            夜幕降临，公主在树林和花园里点亮灯笼，在屋中燃起一千支蜡烛，还摆开了一桌宴席。她不知道丈夫会变成什么模样出现，只能静静等候。到了午夜，王子大步从河里走来。他脸上带着笑，眼中却含着泪。公主飞奔过去，一头扑进他的怀抱。她也在流泪，也在笑。
        - id: ch05-b12
          speaker: narrator
          text: >-
            王子终于回来了。第二天，夫妻两人一同返回王宫。老国王见到他们，欢喜得流下泪来。沉寂了许久的钟声再次响起，礼炮再次轰鸣，号角再次高奏。城里又摆开宴席，人人尽情庆贺。
        - id: ch05-b13
          speaker: narrator
          text: >-
            那位做过王子乳母的老妪，后来又成了王子孩子们的乳母，至少大家仍这样称呼她。其实她实在太老了，除了疼爱孩子，已经什么也做不了。可是，她一直觉得自己还有用，也知道自己过得很幸福。王子与公主同样幸福。后来，他们成了国王与王后，长久而兴盛地治理着国家。
        - id: ch05-b14
          speaker: narrator
          text: >-
            这个故事由坎贝尔少校记于费罗兹普尔。
