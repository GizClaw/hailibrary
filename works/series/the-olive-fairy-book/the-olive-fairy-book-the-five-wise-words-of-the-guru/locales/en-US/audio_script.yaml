  chapters:
    - id: ch01
      title: Five Parting Counsels
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a handsome young man named Ram Singh. He was a favorite with everyone, but he was unhappy at home because his stepmother scolded from morning till night. Her endless talking distracted him so badly that at last, he could bear it no longer. He decided to go somewhere far away and seek his fortune. As soon as his mind was made up, he arranged everything. The very next morning, he set off with a few clothes in a wallet and a little money in his pocket.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Before he left the village, there was one person he wished to visit. A wise old guru, or teacher, had taught him much, and Ram Singh wanted to say goodbye. So he turned first toward his master's hut. He was knocking at the door before the sun was fully up. The old man welcomed his pupil with affection. He also knew how to read a face, and one look told him that Ram Singh was in trouble.
        - id: ch01-b03
          speaker: guru
          text: My son, what has happened?
        - id: ch01-b04
          speaker: ram_singh
          text: Nothing has happened, father. I have decided to go into the world and find my fortune.
        - id: ch01-b05
          speaker: guru
          text: Take my advice and stay in your father's house. Half a loaf at home is better than a whole loaf sought in a distant land.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Ram Singh was not ready to listen, and the old man soon stopped trying to persuade him.
        - id: ch01-b07
          speaker: guru
          text: >-
            Well, if your mind is settled, you must go. But listen carefully and remember five counsels before we part. Keep them, and no evil will befall you. First, obey every order given by the person you serve, without question. Second, never speak harshly or unkindly to anyone. Third, never tell a lie. Fourth, never try to seem equal to those above you in rank. Fifth, whenever you meet people reading or teaching from the holy books, stay and listen for a few minutes. Their words will strengthen you in the path of duty.
        - id: ch01-b08
          speaker: narrator
          text: Ram Singh promised to remember every word, then began his journey.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Several days later, he reached a great city. By then, he had spent all the money he had brought from home, so he resolved to take any work he could find, however humble it might be. He saw a prosperous-looking merchant outside a shop piled with every kind of grain and asked if the man could give him something to do. The merchant studied him for so long that Ram Singh began to lose hope. At last, the man answered.
        - id: ch01-b10
          speaker: merchant
          text: Yes, there is a place waiting for you.
        - id: ch01-b11
          speaker: ram_singh
          text: What place do you mean?
        - id: ch01-b12
          speaker: merchant
          text: >-
            Yesterday, our rajah's chief wazir dismissed his personal servant, and he needs another. You are young, tall, and handsome, just the kind of man he wants. Go and offer him your service.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Ram Singh thanked the merchant and went straight to the wazir's house. His fine appearance helped him, and before long he was engaged as the great man's servant.
    - id: ch02
      title: The Haunted Well
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Soon afterward, the rajah set out on a journey, and the chief wazir went with him. An army of people followed. There were servants, soldiers, mule drivers, camel drivers, merchants carrying food, singers, and musicians. Elephants, camels, horses, mules, ponies, donkeys, and goats moved among carts and wagons of every kind. The whole company looked like a town marching down the road.
        - id: ch02-b02
          speaker: narrator
          text: >-
            After several days, they entered a land that seemed like a sea of sand. Dust whirled in clouds until people and animals could scarcely breathe. Near evening, they came to a village. Its headmen hurried out to salute the rajah, their faces long and serious. They assured him that they and everything they owned were at his service. Still, his enormous company had put them in dreadful trouble. There was not one well or spring anywhere in their country. They had no water to offer such a host of thirsty people and beasts.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Fear spread through the camp. The rajah simply told the wazir to find water somehow, and for him, that settled the question. The wazir quickly summoned the oldest villagers and asked if there were any wells nearby. They looked helplessly at one another. At last, one grey-bearded elder spoke.
        - id: ch02-b04
          speaker: village_elder
          text: >-
            Sir Wazir, there is one well a mile or two from here. A king built it hundreds of years ago. People say it is vast and never runs dry. Heavy stonework covers it, and steps lead down to water deep inside the earth. But no one goes near it. Evil spirits haunt the place, and anyone who goes down that well is never seen again.
        - id: ch02-b05
          speaker: narrator
          text: The wazir stroked his beard and thought for a moment. Then he turned to Ram Singh, who stood behind his chair.
        - id: ch02-b06
          speaker: wazir
          text: There is a saying that you cannot trust a man until he has been tested. Go to this well and bring water for the rajah and his people.
        - id: ch02-b07
          speaker: narrator
          text: >-
            At once, Ram Singh remembered the guru's first counsel. Always obey the person you serve without question. He said he was ready and prepared for the task. He fastened two great brass vessels to a mule and tied two smaller ones across his own shoulders. Then he set out with the old villager as his guide.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Before long, tall trees rose above the barren land. Beneath their shade stood the dome of an ancient building. The elder pointed to it as the well, but would go no farther. He said he was old and tired, and sunset was near, so he must return home. Ram Singh said goodbye and continued alone with the mule.
        - id: ch02-b09
          speaker: narrator
          text: >-
            At the trees, he tied the animal and lifted down the vessels from his shoulders. He found the mouth of the well and followed a stairway into darkness. Broad white slabs of alabaster gleamed faintly in the shadows as he went lower and lower. Everything was silent. Even his bare footsteps seemed to wake an echo in that lonely place. Then one of his vessels slipped and struck the stone. The clang rang out so loudly that Ram Singh jumped.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Still, he kept going. At last, he reached a wide pool of sweet water. He carefully washed the jars before filling them. Then he started back up. The great vessels were so heavy that he would have to carry them one at a time, so he took the smaller ones first. Suddenly, something moved on the stairway above him. Ram Singh looked up and saw a huge giant blocking his path.
        - id: ch02-b11
          speaker: narrator
          text: >-
            The giant held a dreadful mass of bones tightly against his heart. In his other hand was a lamp that threw long shadows over the walls and made him look more terrible still.
        - id: ch02-b12
          speaker: giant
          text: Tell me, mortal. What do you think of my fair and lovely wife?
        - id: ch02-b13
          speaker: narrator
          text: >-
            He raised the lamp toward the bones and gazed at them lovingly. Long ago, the giant had lost a beautiful wife whom he dearly loved. He would not believe she was dead, and he still carried her with him, though nothing remained but bones. Ram Singh knew none of this. He only remembered the guru's second counsel, never to speak harshly or without thought.
        - id: ch02-b14
          speaker: ram_singh
          text: Truly, sir, you could search everywhere and never find another like her.
        - id: ch02-b15
          speaker: giant
          text: >-
            Ah, you have eyes that can really see! So many men have insulted her by calling her nothing but dry bones, and I killed them for it. You are a fine young man. I will help you.
          emotion: happy
        - id: ch02-b16
          speaker: narrator
          text: >-
            The delighted giant laid the bones down with the greatest care. Then he snatched up the enormous brass vessels and carried them all the way to the top as if they weighed nothing. He even put them back on the mule. By the time Ram Singh reached the open air with the smaller jars, every bit of the heavy work was done.
        - id: ch02-b17
          speaker: giant
          text: >-
            You have pleased me, so you may ask one favor. Whatever you choose, I will do it. Would you like me to show you where the treasures of dead kings lie buried?
        - id: ch02-b18
          speaker: narrator
          text: Ram Singh shook his head at the offer of buried riches.
        - id: ch02-b19
          speaker: ram_singh
          text: I ask only that you stop haunting this well, so people may come and draw water safely.
        - id: ch02-b20
          speaker: narrator
          text: >-
            The giant may have expected a harder request. His face brightened, and he promised to leave at once. As Ram Singh carried the precious water away through the gathering dark, he saw the giant striding off with his dead wife's bones in his arms.
        - id: ch02-b21
          speaker: narrator
          text: >-
            Wonder and joy filled the camp when Ram Singh returned. He said nothing about meeting the giant. He told the rajah only that nothing prevented them from using the well. So everyone used it, and no one ever saw the giant there again.
    - id: ch03
      title: The Prince's Plot
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The rajah was so pleased with Ram Singh's conduct that he ordered the wazir to give up the young man in exchange for one of the royal servants. That was how Ram Singh became the rajah's own attendant. As the days passed, the king grew more and more delighted with him. Ram Singh always remembered the guru's third counsel. He was honest in everything and always told the truth.
        - id: ch03-b02
          speaker: narrator
          text: >-
            His favor at court grew quickly. At last, the rajah made him treasurer, and Ram Singh found himself in a high position with wealth and power under his care.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Now, the rajah had a brother who was a very wicked man. The prince thought that if he could win over the young treasurer, Ram Singh might help him steal from the royal treasury, a little at a time. Once the prince had enough money, he could bribe some soldiers and royal advisers. Then he could lead a rebellion, drive his brother from the throne, kill him, and rule in his place.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Of course, the prince was too cautious to tell Ram Singh about any of these wicked plans. Instead, he began by flattering the young man whenever they met. He praised him and tried to gain his confidence. At last, the prince offered Ram Singh his own daughter in marriage.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Then Ram Singh remembered the guru's fourth counsel. Never try to make yourself equal to people above you in rank. He respectfully refused the great honor of marrying a princess.
        - id: ch03-b06
          speaker: narrator
          text: >-
            His refusal stopped the prince's scheme before it had begun. The prince was furious and resolved to ruin him. He entered the rajah's presence and invented a story. He claimed that Ram Singh had spoken insulting words about his sovereign and about the princess. No one knew what those insults were supposed to be. Since the whole tale was false, even the wicked prince could not have explained it.
        - id: ch03-b07
          speaker: narrator
          text: The rajah's face grew red with anger as he listened.
        - id: ch03-b08
          speaker: rajah
          text: Until the treasurer's head is cut off, neither I, nor the princess, nor my brother will eat or drink.
          emotion: angry
        - id: ch03-b09
          speaker: rajah
          text: But no one must know that this is being done on my orders. Anyone who speaks of it will be severely punished.
        - id: ch03-b10
          speaker: narrator
          text: The prince had to be content with that.
        - id: ch03-b11
          speaker: narrator
          text: >-
            The rajah called for an officer of his guard. He ordered the man to take a band of soldiers to a tower that was being built just outside the town. If anyone came to ask when the building would be finished, or came with any other question about it, the officer was to cut off that person's head and bring it to the palace. The body could be buried there on the spot.
        - id: ch03-b12
          speaker: narrator
          text: >-
            The old officer found the command very strange, but it was not his place to question the king. He saluted and left to obey.
    - id: ch04
      title: The Fifth Counsel
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Early the next morning, the rajah sent for Ram Singh. The king had not slept all night. He told the treasurer to go at once to the new hunting tower. Ram Singh must ask the people there how the work was going and exactly when the tower would be finished. Then he must hurry straight back with their answer.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Ram Singh set out at once. On the road, he passed a small temple at the edge of the city and heard someone reading aloud inside. The guru's fifth counsel came back to him. Whenever you meet those who read or teach from the holy books, stop and listen, even if only for a few minutes.
        - id: ch04-b03
          speaker: narrator
          text: >-
            He stepped into the temple and sat down. He meant to stay for only a minute, but the teacher's wisdom held his attention. Ram Singh sat on and on while the sun climbed higher in the sky.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Meanwhile, the wicked prince was growing very hungry. He did not dare disobey the rajah's order to fast. The princess sat quietly crying in a corner. She too was waiting for news that Ram Singh had been killed, because only then could she eat her breakfast.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Hours passed. The prince stared from the window, but no messenger appeared. At last, he could wait no longer. He disguised himself so that no one would recognize him, mounted a horse, and galloped to the hunting tower. The rajah had told him the execution would happen there.
        - id: ch04-b06
          speaker: narrator
          text: >-
            When the prince arrived, no execution was taking place. Some workmen were building the tower, while a group of soldiers watched them idly. The prince forgot that his disguise hid his identity. He rode straight up and shouted.
        - id: ch04-b07
          speaker: wicked_prince
          text: Why are you men standing idle instead of finishing the work you came to do? When will it be done?
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: >-
            The soldiers looked toward their commanding officer. Without the prince noticing, the officer gave a small sign. A sword flashed in the sunlight, and a head fell to the ground.
        - id: ch04-b09
          speaker: narrator
          text: >-
            A thick beard was part of the dead man's disguise, so no one recognized him as the rajah's brother. To them, he was only a stranger who had asked the forbidden questions. The soldiers wrapped the head in a cloth and buried the body as their commander ordered. When that was done, the officer took the bundle and rode away toward the palace.
    - id: ch05
      title: The Bundle in the Road
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            In the meantime, the rajah returned from his council. To his great surprise, neither his brother nor Ram Singh's head was waiting for him. As more time passed, he became uneasy. At last, he decided to ride out alone and discover what had happened.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Just as the rajah came near the temple, Ram Singh was still sitting inside. The young treasurer heard a horse's hooves, glanced over his shoulder, and saw the king himself riding past. Ashamed that he had forgotten his errand, Ram Singh leaped up and hurried out to meet him. The rajah reined in his horse, astonished to see Ram Singh alive.
        - id: ch05-b03
          speaker: narrator
          text: >-
            At that moment, the guard officer arrived carrying his bundle. He gave the rajah a grave salute, dismounted, and placed the parcel in the road. As the king watched with curiosity, the officer began to undo the wrappings.
        - id: ch05-b04
          speaker: narrator
          text: >-
            When the final string came loose, the rajah saw his brother's head. He sprang from his horse and seized the soldier by the arm. As soon as he found his voice, he demanded to know what had happened.
        - id: ch05-b05
          speaker: narrator
          text: >-
            The officer answered the king's questions and told the story little by little. As the rajah listened, a dark suspicion flashed through his mind. He briefly told the soldier that he had done well, then drew Ram Singh aside. Within a few minutes, the king learned exactly why his treasurer was still alive. Ram Singh had delayed the royal errand because he had stopped at the temple and followed the guru's counsel.
    - id: ch06
      title: The Wisdom Remembered
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            In the end, the rajah searched through his dead brother's papers and found proof of the whole treacherous plan. Everyone could see that Ram Singh was innocent and that he had served with complete honesty.
        - id: ch06-b02
          speaker: narrator
          text: >-
            Ram Singh continued to serve the rajah with unwavering loyalty for many years. He married a young woman of his own rank in life, and they lived happily together. When he died at last, he was honored and loved by everyone who knew him.
        - id: ch06-b03
          speaker: narrator
          text: >-
            Ram Singh had sons of his own, and in time, he taught them the five wise sayings of the old guru.
