audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    ram_singh:
      display_name: 拉姆·辛格
      tts:
        delivery: 诚恳正直，年轻而沉着，面对危险时坚定
        timbre: 清朗结实的年轻男声
        pace: 适中
        pitch: 中
    guru:
      display_name: 老古鲁
      tts:
        delivery: 慈爱睿智，劝诫时温和而郑重
        timbre: 苍老温厚的男声
        pace: 舒缓
        pitch: 低
    merchant:
      display_name: 粮商
      tts:
        delivery: 热心爽直，说话实在
        timbre: 饱满清楚的成年男声
        pace: 适中
        pitch: 中
    wazir:
      display_name: 首席维齐尔
      tts:
        delivery: 威严审慎，发号施令时不容置疑
        timbre: 沉稳浑厚的成年男声
        pace: 从容
        pitch: 中低
    elder:
      display_name: 白胡子老人
      tts:
        delivery: 敬畏谨慎，讲起古井时压低声音
        timbre: 干涩苍老的男声
        pace: 缓慢
        pitch: 低
    giant:
      display_name: 巨人
      tts:
        delivery: 声势骇人，对亡妻却深情而天真
        timbre: 粗厚低沉的男声
        pace: 缓慢有力
        pitch: 低
    rajah:
      display_name: 王公
      tts:
        delivery: 高傲果断，盛怒时急躁，醒悟后严肃
        timbre: 威严洪亮的成年男声
        pace: 适中
        pitch: 中低
    prince:
      display_name: 王弟
      tts:
        delivery: 阴险傲慢，焦躁时盛气凌人
        timbre: 冷硬尖锐的成年男声
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 五句临别箴言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个英俊的年轻人名叫拉姆·辛格。他人缘很好，日子却很不快活，因为继母从早到晚骂个不停。他被吵得心烦意乱，决定远走他乡，寻找自己的前程。主意一定，他马上安排好一切。第二天一早，他在包袱里装上几件衣裳，口袋里揣着不多的盘缠，离开了家。
        - id: ch01-b02
          speaker: narrator
          text: 临走前，他还想向一个人道别。那是一位睿智的老古鲁，也是教给他许多道理的师父。太阳还没升高，拉姆·辛格就敲响了小屋的门。老人亲切地迎进弟子，一看他的脸色，便知道他有心事。
        - id: ch01-b03
          speaker: guru
          text: 孩子，出了什么事？
        - id: ch01-b04
          speaker: ram_singh
          text: 没什么，师父。我已经决定到外面的世界去闯一闯，寻找自己的前程。
        - id: ch01-b05
          speaker: guru
          text: 听我一句，留在父亲家里吧。与其远赴异乡求一整块面包，不如守着家中的半块。
        - id: ch01-b06
          speaker: narrator
          text: 可拉姆·辛格心意已决，根本听不进劝。老人见他不肯回头，也就不再勉强。
        - id: ch01-b07
          speaker: guru
          text: 好吧，既然你一定要走，就牢牢记住我送你的五句箴言。只要都能守住，灾祸便伤不了你。第一，受雇于谁，就毫不迟疑地服从他的命令。第二，绝不对任何人说粗暴伤人的话。第三，绝不撒谎。第四，不要妄想与地位高过自己的人平起平坐。第五，无论到了哪里，若遇见有人诵读或讲授圣典，哪怕只有片刻，也要留下听一听，好让自己在尽责的正道上更加坚定。
        - id: ch01-b08
          speaker: narrator
          text: 拉姆·辛格答应把老人的话铭记在心，这才踏上旅程。几天后，他来到一座大城，出发时带的盘缠已经用尽，只好找活儿干，不管差事多么低微都肯接受。他看见一家铺子堆满各色谷物，一位富足的商人正站在门前，便上去询问。商人把他打量了好久，久得让年轻人几乎泄气，才终于开口。
        - id: ch01-b09
          speaker: merchant
          text: 有啊，正有一个位子等着你呢。
        - id: ch01-b10
          speaker: ram_singh
          text: 您说的是什么位子？
        - id: ch01-b11
          speaker: merchant
          text: 王公的首席维齐尔昨天辞退了贴身仆人，正在另找一个。你年轻、高大，模样又好，正合他的需要。快去试试吧。
        - id: ch01-b12
          speaker: narrator
          text: 拉姆·辛格谢过商人，立刻赶到维齐尔府上。凭着端正出众的相貌，他很快如愿受雇，做了这位大人物的仆人。不久，本地王公出门远行，维齐尔也随同前往。队伍浩浩荡荡，有仆役、随从、士兵、赶骡人、驼夫，有为人畜运送粮食和物资的商贩，还有沿路献艺的歌手和伴奏的乐师。大象、骆驼、马、骡子、矮种马、驴、山羊，以及形形色色的车驾也都跟在队中。远远望去，那根本不像一支赶路的队伍，简直像一整座城在迁徙。
    - id: ch02
      title: 古井里的巨人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一行人走了几天，进入一片沙海般的荒原。飞尘成团翻滚，人和牲畜都被呛得透不过气。黄昏前，他们来到一个村庄。村中头人赶来向王公行礼致敬，一个个愁眉苦脸，神情郑重。他们说，自己和自己拥有的一切，当然都任凭王公取用。可是这么庞大的队伍突然到来，实在叫村民为难到了极点。这一带既没有井，也没有泉，他们根本拿不出水给这么多人和牲畜解渴。
        - id: ch02-b02
          speaker: narrator
          text: 众人听了都慌了。王公却只命维齐尔无论如何弄到水，仿佛一句话便把难题解决了，余下的麻烦全都与他无关。维齐尔急忙召来当地所有年纪最大的居民，追问附近究竟有没有水井。老人们你看我、我看你，谁也不作声。最后，一位白胡子老人开了口。
        - id: ch02-b03
          speaker: elder
          text: 维齐尔大人，离村子一两英里的地方，确实有一口井。那是几百年前一位国王开凿的，据说又大又深，永远不会枯竭。井上盖着厚重的石屋，一段台阶直通大地腹中的水。可那里有恶灵作祟，谁要走下去，就再也回不来了，所以从没人敢靠近。
        - id: ch02-b04
          speaker: narrator
          text: 维齐尔捋着胡须想了片刻，转向站在椅后的拉姆·辛格。
        - id: ch02-b05
          speaker: wazir
          text: 俗话说，一个人不经考验，便不值得信任。你去那口井里取水，供王公和众人饮用。
        - id: ch02-b06
          speaker: narrator
          text: 拉姆·辛格马上想起第一句箴言，受雇于谁，就毫不迟疑地服从他的命令。他当即说自己已经准备好，转身去安排这场冒险。他把两只大铜罐绑在骡背上，又把两只小罐缚在肩头，请白胡子老人带路。没过多久，他们看见荒原上耸立着几棵大树，树荫底下卧着一座古老建筑的圆顶。老人指着那里，说井就在下面，却推辞不肯再走。他说自己年老体乏，太阳又快落山，必须赶回家。拉姆·辛格与他道别，独自牵着骡子向前。
        - id: ch02-b07
          speaker: narrator
          text: 到了树下，他拴好骡子，卸下肩头的水罐，找到井口，沿台阶走入黑暗。宽阔的白色雪花石膏石板在阴影里微微发亮，他越走越深，四周一片死寂。连赤脚踏过石面的声音，也会惊醒这荒凉地方的回声。一只罐子突然从手中滑落，撞在台阶上。铿然巨响吓得他浑身一跳。他还是继续向下，终于来到一片宽阔清甜的水池边。他先仔细洗净水罐，再把它们装满。小罐可以提着往回走，大罐却实在太重，每次只能搬一个。
        - id: ch02-b08
          speaker: narrator
          text: 水已经装好，拉姆·辛格提着较轻的罐子登上台阶。忽然，上方有什么东西动了一下。他抬头看见一个巨人堵在那里。巨人一只手把一堆骇人的白骨紧紧搂在胸前，另一只手提着灯。灯光把长长的影子投在四周墙上，让他显得比原来的模样更加可怕。
        - id: ch02-b09
          speaker: giant
          text: 凡人，你看看我这位美丽可爱的妻子。你觉得她怎么样？
        - id: ch02-b10
          speaker: narrator
          text: 巨人把灯凑近怀里的白骨，满眼爱怜。原来，他曾有一位非常美丽的妻子，也深深爱着她。妻子死后，他不肯相信她已经离世。哪怕她早已只剩白骨，他仍把她带在身边。拉姆·辛格并不知道这些，却想起古鲁的第二句箴言，绝不说粗暴伤人的话。
        - id: ch02-b11
          speaker: ram_singh
          text: 先生，我敢说世上再也找不出第二位像她这样的女子。
        - id: ch02-b12
          speaker: giant
          text: 啊，你这双眼睛可真了不起！至少你看得见！不知有多少人侮辱她，说她不过是一把枯骨，全叫我杀了。你是个好年轻人，我来帮你。
          emotion: happy
        - id: ch02-b13
          speaker: narrator
          text: 巨人温柔地放下白骨，一把提起两只大铜罐，轻轻松松搬上了地面。拉姆·辛格带着小罐走到露天处时，一切早已安置妥当。
        - id: ch02-b14
          speaker: giant
          text: 你让我很高兴，可以求一个恩惠。无论想要什么，我都替你办到。要不要我告诉你，那些死去国王的宝藏埋在哪里？
        - id: ch02-b15
          speaker: narrator
          text: 拉姆·辛格听到宝藏，却摇了摇头。
        - id: ch02-b16
          speaker: ram_singh
          text: 我只求你离开这口井，不要再在这里作祟。这样，人们就能自由进出，来井里取水了。
        - id: ch02-b17
          speaker: narrator
          text: 巨人大概以为他会提出更难的要求，听后顿时眉开眼笑，答应马上离开。拉姆·辛格载着珍贵的清水，在渐浓的暮色中返回，亲眼看见巨人抱着亡妻的白骨大步远去。
        - id: ch02-b18
          speaker: narrator
          text: 他带水回到营地，众人又惊又喜，欢呼不止。可他对井底遇见巨人的事只字不提，只向王公说明，已经没有什么能阻止大家使用那口井。后来，人们果然都去那里取水，再也没人见过那个抱着白骨的巨人。
    - id: ch03
      title: 宫廷里的阴谋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王公十分欣赏拉姆·辛格，命维齐尔用他换走自己的一名仆人。拉姆·辛格就这样成了王公的贴身随从。他牢记第三句箴言，始终诚实，从不说谎，越来越受王公喜爱。后来，他被任命为司库，在宫中身居高位，手里掌管着财富与权力。
        - id: ch03-b02
          speaker: narrator
          text: 王公有个心术极坏的弟弟。王弟盘算，只要拉拢年轻的司库，就能按照自己的需要，一点点偷走国库财宝。有了大把钱财，他便可以收买士兵和王公的几名谋臣，带头发动叛乱，废掉并杀死兄长，自己登上王位。他当然很狡猾，没有把这些毒计告诉拉姆·辛格，只在每次见面时说些奉承话，最后还提出把女儿嫁给他。
        - id: ch03-b03
          speaker: narrator
          text: 拉姆·辛格记得第四句箴言，不要妄想与地位高过自己的人平起平坐。因此，他恭敬地谢绝了迎娶公主这份天大的荣耀。王弟的阴谋刚开头就受阻，气得暴跳如雷，决心毁掉他。王弟走进王公面前，编了一番谎话，诬告拉姆·辛格曾出言侮辱君主和公主。那些话到底是什么，谁也不知道。谎言本是凭空捏造，连狠毒的王弟自己也说不清楚。
        - id: ch03-b04
          speaker: narrator
          text: 王公却越听越气，脸涨得通红。他宣布，在司库人头落地以前，自己、王弟和公主谁都不许吃喝。
        - id: ch03-b05
          speaker: rajah
          text: 不过，不能让任何人知道这是我的旨意。谁敢提起这件事，必受严惩。
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: 王弟也只得接受。王公随即召来一名卫队军官，叫他带士兵赶往城外不远的一座高塔。无论谁来到那里，只要询问高塔何时完工，或问起其他任何事情，军官都要砍下他的头，带回来交给王公，尸身则就地掩埋。老军官觉得命令古怪，可这不是他该管的事，便敬礼领命去了。
        - id: ch03-b07
          speaker: narrator
          text: 第二天清早，一夜未眠的王公叫来拉姆·辛格。
        - id: ch03-b08
          speaker: rajah
          text: 到新建的狩猎塔去，问问工程进展如何，什么时候才能竣工。得到回答，马上回来复命！
        - id: ch03-b09
          speaker: narrator
          text: 拉姆·辛格上路了。经过城郊一座小庙时，他听见里面有人高声诵读。第五句箴言立刻浮上心头。于是，他走进去坐下，本来只想听一小会儿。可是老师讲授的智慧深深吸引了他。他坐着，坐着，一直没有离开，太阳也升得越来越高。
        - id: ch03-b10
          speaker: narrator
          text: 这时，狠毒的王弟不敢违背王公的禁令，肚子已经饿得难受。公主则躲在角落里默默流泪，一边等着拉姆·辛格的死讯传来，一边等着自己终于可以吃早饭。几个钟头过去了。王弟站在窗前，朝外望了又望。无论他怎样盯着远处的道路，始终不见信使的踪影。
        - id: ch03-b11
          speaker: narrator
          text: 他终于忍耐不住，匆匆乔装改扮，免得有人认出自己，然后骑马直奔狩猎塔。王公说过，行刑会在那里进行。可是他赶到以后，并没看见任何人被处死，只有工匠忙着建塔，一队士兵闲站在旁边。他忘了自己换过装束，谁也不认识他，骑马上前就高声喝问。
        - id: ch03-b12
          speaker: prince
          text: 喂，你们这些人！该做的事还没做完，为什么全在这里闲站着？到底什么时候才能办完？
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: 士兵们听了，全都望向站在稍远处的军官。军官趁王弟没有察觉，轻轻做了个手势。阳光下一道剑光闪过，一颗人头顿时飞落在地。
    - id: ch04
      title: 箴言应验
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王弟乔装时粘了一把浓密的胡子，士兵们没有认出死者就是王公的弟弟。他们用布包好人头，又照军官的命令把尸体就地掩埋。等这一切都办完，军官提起那个布包，骑上马，朝王宫的方向赶去复命。
        - id: ch04-b02
          speaker: narrator
          text: 与此同时，王公结束议事回到宫中。他原以为弟弟和送来的人头都该在那里等候，却惊讶地发现两样都不见踪影。时间拖得越久，他心里越不安，最后觉得还是亲自去看看出了什么事。他命人备好坐骑，一个人出了城。
        - id: ch04-b03
          speaker: narrator
          text: 王公靠近小庙时，仍坐在里面的拉姆·辛格听见了马蹄声。他回头一看，骑马而来的竟是王公本人。想到自己听得入迷，完全忘了奉命办事，他又惭愧又着急，马上跳起来，跑出去迎接主人。王公勒住坐骑，看见本该已经死去的拉姆·辛格还活生生站在眼前，自然显得万分惊讶。
        - id: ch04-b04
          speaker: narrator
          text: 就在这时，卫队军官带着布包赶到了。他神情郑重地向王公行礼，随后翻身下马，把布包放在路上，一层层解开外面的包裹。王公又诧异又好奇，一直盯着他的动作。最后一根绳子终于松开，王弟的头赫然出现在眼前。王公猛地跳下马，一把抓住军官的胳膊。他震惊得一时说不出话。等终于开得了口，立刻追问事情的经过。军官一点点讲明原委，一个可怕的疑念也猛然划过王公心头。
        - id: ch04-b05
          speaker: narrator
          text: 王公只简短地告诉军官，他完全照命令行事，做得很好，随即把拉姆·辛格拉到一旁。没过几分钟，他便从年轻人口中知道了全部经过。拉姆·辛格在路上听见有人诵读圣典，为了遵从古鲁的教诲，进去听了片刻，结果听得入迷，这才耽误了王公交代的差事。
        - id: ch04-b06
          speaker: narrator
          text: 事情并没有停在猜疑上。后来，王公查到一些文书，从中找到了亡弟谋反的确凿证据，拉姆·辛格也证明了自己的清白与正直。他又忠贞不贰地侍奉王公许多年，后来娶了一位与自己门第相当的姑娘，两人生活得很幸福。直到离世，拉姆·辛格始终受到众人的敬重和爱戴。他有了儿子。等孩子们长大，他也把老古鲁的五句箴言一一传给了他们。
        - id: ch04-b07
          speaker: narrator
          text: 这是一则旁遮普故事。故事里的古鲁，是印度教的宗教导师或圣人，而拉姆·辛格的师父是一位锡克教徒。
