audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容温厚，悲剧转折处克制而沉静
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    king:
      display_name: 国王
      tts:
        delivery: 威严爽朗，喜悦时率真热烈
        timbre: 浑厚明亮的成熟男声
        pace: 适中
        pitch: 中低
    minister:
      display_name: 大臣
      tts:
        delivery: 恭谨急切，话语干脆
        timbre: 清楚稳重的成年男声
        pace: 稍快
        pitch: 中
    weaver:
      display_name: 织工
      tts:
        delivery: 沉着机敏，谦逊中带着自信
        timbre: 朴实温和的成年男声
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 黑圈之谜
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，遥远的国度里有一位国王。一天早晨，他坐在王座上，听百姓诉说冤屈，再替他们评断是非。那天的案子不多，国王正打算去花园走走，殿外忽然喧闹起来。宫廷总管进殿禀报，说东方一位强大的皇帝派来了使臣，请国王决定是否召见。邻近各国的君主都惧怕那位皇帝，这位国王也不例外。他立刻命人请使臣进殿，还吩咐备下宴席款待。随后，他重新坐好，等着听使臣的来意。
        - id: ch01-b02
          speaker: narrator
          text: >-
            可使臣一句话也没说。他走到王座前，弯下腰，用手里的杖在地上画了一个黑圈，把王座围在中间。画完以后，他就在旁边坐下，谁也不理。
        - id: ch01-b03
          speaker: narrator
          text: >-
            国王和群臣都摸不着头脑，又被这无礼的举动气得不轻。使臣却安静地坐着，像一尊石像。大家很快明白了，无论怎么问，都不会从他口中得到解释。国王急忙召集大臣商议，可谁也猜不出黑圈的意思。国王越想越怒，最后下了严令。日落以前，要是找不到能解开谜团的人，所有大臣都要被绞死。
    - id: ch02
      title: 会动的小屋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            大臣们知道，国王说得出就做得到。他们把全城分成几片，挨家挨户地询问，看有没有人能猜透使臣的举动。人们听了，大都只会茫然地瞪眼。幸好，有位大臣特别善于观察。他走进一间空屋，看见一架秋千没人推动，却自行荡个不停，便想见见屋子的主人。他再推开一道门，发现里面还有一架秋千，也在轻轻摇荡。窗外是一小片庄稼，旁边的柳木杆明明没有风，也一直摆动着驱赶麻雀。
        - id: ch02-b02
          speaker: narrator
          text: >-
            大臣越看越好奇，便沿着楼梯下去，来到一间宽敞明亮的工坊。织工坐在织机前，只需用手引导丝线。原来，他发明了一套机器，不但能带动两架秋千和那根柳木杆，还能让织机自己运转。
        - id: ch02-b03
          speaker: narrator
          text: >-
            大臣看见墙角那只巨轮，也明白了它的用处，总算松了口气。就算织工解不开谜，也许能给他指一条路。他马上把黑圈的事讲了一遍，还告诉织工，能解释其中含意的人会得到重赏。
        - id: ch02-b04
          speaker: minister
          text: >-
            快跟我走吧。太阳已经西斜，不能再耽搁了。
        - id: ch02-b05
          speaker: narrator
          text: >-
            织工想了一会儿，走到窗前。窗外有个鸡笼，旁边放着两块羊拐骨。他捡起骨头，又把母鸡从笼里抓出来，夹在腋下。
        - id: ch02-b06
          speaker: weaver
          text: >-
            好，我准备好了。
    - id: ch03
      title: 无声的较量
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            他们回到大殿时，国王仍坐在王座上，使臣也还坐在原处。织工示意大臣留在后面，自己走上前，把两块羊拐骨放在使臣身旁的地上。使臣从口袋里拿出一把小米，向四周撒开。织工随即放下母鸡。只一会儿，母鸡就把米啄得一粒不剩。使臣见了，站起身来，还是一言不发，就这样离开了大殿。
        - id: ch03-b02
          speaker: narrator
          text: >-
            使臣一走，国王马上招手，让织工到跟前来。
        - id: ch03-b03
          speaker: king
          text: >-
            看来，只有你猜中了谜底。我一定会重重赏你。不过你先告诉我，刚才这一切究竟是什么意思？
    - id: ch04
      title: 织工的回答
      blocks:
        - id: ch04-b01
          speaker: weaver
          text: >-
            陛下，使臣在王座四周画下黑圈，是替皇帝问您：“如果我派大军包围你们的都城，你们会不会放下武器投降？”我把羊拐骨摆在他面前，是回答他：“跟我们相比，你们不过是一群孩子，只配玩这样的小玩意儿。”
        - id: ch04-b02
          speaker: weaver
          text: >-
            他撒出那么多小米，是说他的主人能派上战场的士兵多得数不清。我让母鸡把米全吃光，就是告诉他，我们只要一个人，就能消灭他们一整支大军。
        - id: ch04-b03
          speaker: weaver
          text: >-
            依我看，那位皇帝不会宣战了。
        - id: ch04-b04
          speaker: king
          text: >-
            你救了我，也保住了我的荣誉！财富和荣耀都该归你。说吧，你想要什么赏赐？哪怕要我半个王国，我也会给你。
        - id: ch04-b05
          speaker: weaver
          text: >-
            我只求城门外那座小农庄，给女儿作嫁妆。
        - id: ch04-b06
          speaker: narrator
          text: >-
            除此之外，织工什么也不肯接受。临走以前，他又向国王说了最后几句话。
        - id: ch04-b07
          speaker: weaver
          text: >-
            陛下，请您记住，织工对国家也很有用。有时候，我们织工甚至比大臣还聪明呢！
