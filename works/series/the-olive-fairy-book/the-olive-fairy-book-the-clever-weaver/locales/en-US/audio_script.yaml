  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: genial, reflective, and lightly amused
        timbre: warm and clear
        pace: measured
        pitch: medium
    king:
      display_name: The King
      tts:
        delivery: proud and commanding, quick to anger but generous in gratitude
        timbre: broad and resonant
        pace: measured
        pitch: low
    chamberlain:
      display_name: A Chamberlain
      tts:
        delivery: formal and reassuring
        timbre: polished and clear
        pace: measured
        pitch: medium
    envoy:
      display_name: The Envoy
      tts:
        delivery: controlled, grave, and quietly confident
        timbre: cool and firm
        pace: unhurried
        pitch: medium-low
    minister:
      display_name: A Minister
      tts:
        delivery: anxious and urgent, with growing hope
        timbre: clear and restrained
