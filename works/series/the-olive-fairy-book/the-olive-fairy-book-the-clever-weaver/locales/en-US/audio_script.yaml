  chapters:
    - id: ch01
      title: The Circle Around the Throne
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once, in a faraway country, a king sat on his throne hearing his people's complaints and settling their disputes. There were fewer cases than usual that morning. He was just about to leave for his gardens when a commotion rose outside, and the lord high chamberlain came in.
        - id: ch01-b02
          speaker: chamberlain
          text: >-
            Your Majesty, will you receive an ambassador from the powerful emperor of the east?
        - id: ch01-b03
          speaker: narrator
          text: >-
            All the neighboring rulers feared that emperor, and this king feared him too. He ordered the envoy to be admitted at once and called for a banquet in his honor. Then he settled back on the throne and wondered what message the man had brought.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The envoy said nothing. He walked up to the throne, bent down, and used the rod in his hand to draw a black circle on the floor all around it. Then he took a nearby seat and paid no attention to anyone.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The king and his courtiers were baffled, and they were furious at such strange behavior. But the envoy sat as calm and still as an image. No explanation would come from him. The ministers were summoned in haste, yet not one could make sense of the circle.
        - id: ch01-b06
          speaker: narrator
          text: >-
            That made the king angrier still. He warned the ministers that if they had not found someone to solve the mystery by sunset, he would hang them all.
    - id: ch02
      title: The House That Moved by Itself
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The ministers knew their king always kept his word. They quickly divided the city into districts and began going from house to house. At every door, they asked whether anyone could understand the ambassador's strange act. Most people could only stare at them in confusion.
        - id: ch02-b02
          speaker: narrator
          text: >-
            One minister, however, noticed something unusual. He entered an empty cottage and saw a swing moving all by itself. Thinking the owner might be worth meeting, he opened the door to another room. There, a second swing rocked gently on its own.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Through the window, the minister saw a patch of corn. Beside it stood a willow pole that kept moving although there was no wind, frightening the sparrows away. His curiosity grew. He went downstairs and entered a large, bright workshop, where a weaver sat at his loom.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The weaver only had to guide the threads. A machine of his own invention did the rest. It worked the loom while also moving the two swings and the willow pole. When the minister saw the great wheel in the corner and understood what it did, he sighed with relief. Even if this clever man could not solve the riddle, perhaps he could point the search in the right direction.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Without wasting another moment, the minister told him about the circle around the throne. He promised a handsome reward to anyone who could explain its meaning.
        - id: ch02-b06
          speaker: minister
          text: >-
            Come with me now. The sun is already low, and we have no time to spare.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The weaver thought for a moment. Then he crossed to a window. Outside it stood a hen-coop, with two knuckle-bones lying beside it. He picked up the bones, took the hen from the coop, and tucked her under his arm.
        - id: ch02-b08
          speaker: weaver
          text: I am ready. Let us go.
    - id: ch03
      title: The Silent Answer
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Back in the great hall, the king remained on his throne, and the envoy remained in his seat. The weaver motioned for the minister to stay where he was. Then he walked up to the envoy and laid the two knuckle-bones on the floor beside him.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The envoy answered by taking a handful of millet seed from his pocket and scattering it around them. At once, the weaver put down the hen. In a moment, she had eaten every seed.
        - id: ch03-b03
          speaker: narrator
          text: >-
            At that, the envoy rose. Without saying a word, he left the hall.
        - id: ch03-b04
          speaker: narrator
          text: >-
            As soon as the envoy was gone, the king beckoned the weaver closer.
        - id: ch03-b05
          speaker: king
          text: >-
            You are the only one who understood this riddle, and I will reward you greatly. But please tell me what it all meant.
    - id: ch04
      title: The Weaver Explains
      blocks:
        - id: ch04-b01
          speaker: weaver
          text: >-
            This is the meaning, O King. The circle around your throne carried the emperor's message. He was asking, "If I send an army to surround your capital, will you lay down your arms?"
        - id: ch04-b02
          speaker: weaver
          text: >-
            I answered with the knuckle-bones. I told him, "Beside us, your people are only children. Little bones like these are the only toys fit for you."
        - id: ch04-b03
          speaker: weaver
          text: >-
            Then he scattered the millet to show how many soldiers his emperor could send into battle. My hen ate all the seed. That told him that one of our men could destroy a whole host of theirs.
        - id: ch04-b04
          speaker: weaver
          text: I do not think the emperor will declare war.
        - id: ch04-b05
          speaker: king
          text: >-
            You have saved me and saved my honor! I will heap wealth and glory upon you. Name your reward, and it is yours, even if you ask for half my kingdom.
        - id: ch04-b06
          speaker: weaver
          text: >-
            I ask only for the small farm outside the city gates, as a marriage portion for my daughter.
        - id: ch04-b07
          speaker: narrator
          text: >-
            That was all the weaver would accept. Before he left, he had one last thing to say.
        - id: ch04-b08
          speaker: weaver
          text: >-
            I ask you to remember one thing, O King. Weavers are valuable to a country too, and sometimes they are even cleverer than ministers!
