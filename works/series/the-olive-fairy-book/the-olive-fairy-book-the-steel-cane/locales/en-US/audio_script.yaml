audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: genial, reflective, and lightly amused
        timbre: warm and clear
        pace: measured
        pitch: medium
    old_woman:
      display_name: The Old Woman
      tts:
        delivery: firm and plainspoken, with stern authority
        timbre: dry and weathered
        pace: measured
        pitch: medium-low
    young_man:
      display_name: The Young Man
      tts:
        delivery: rough and defiant, with bitter impatience
        timbre: coarse and strong
        pace: brisk
        pitch: medium-low
    wife:
      display_name: The Wife
      tts:
        delivery: gentle and hardworking, quickened by alarm
        timbre: soft and clear
        pace: measured
        pitch: medium-high
    son:
      display_name: The Son
      tts:
        delivery: young and direct, shaken by fear
        timbre: light and clear
        pace: quick
        pitch: high
    passerby:
      display_name: A Passerby
      tts:
        delivery: brisk and possessive, with practical confidence
        timbre: full and earthy
        pace: brisk
