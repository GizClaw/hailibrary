    companion_1:
      display_name: First Companion
      tts:
        delivery: coarse and vengeful
        timbre: hard and raspy
        pace: brisk
        pitch: medium-low
    companion_2:
      display_name: Second Companion
      tts:
        delivery: coarse and vengeful
        timbre: nasal and sharp
        pace: brisk
