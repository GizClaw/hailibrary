  chapters:
    - id: ch01
      title: The Boy from Across the Plain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once upon a time, an old woman lived in a little cottage at the edge of a forest. Behind her house was a garden filled with every sort of vegetable. Beyond the garden lay a field where two or three cows grazed. Her neighbors thought all this made her quite rich, and they envied her for it.
        - id: ch01-b02
          speaker: narrator
          text: >-
            While she was strong enough to spend each day working in the garden, she never felt lonely. Then she fell seriously ill. The illness left her much weaker, and she began to wish she had someone to talk to now and then. At just that time, she heard that a shepherd and his wife had died on the far side of the plain. Their little boy had been left all alone in the world.
        - id: ch01-b03
          speaker: old_woman
          text: That is just what I need.
        - id: ch01-b04
          speaker: narrator
          text: >-
            She sent a man to fetch the child and meant to raise him as her own son. The boy was about twelve. He should have counted himself fortunate, because his new mother treated him with all the kindness his first mother had shown him. Sadly, he made friends with rude, wicked boys. Their tricks frightened everyone around them, and before long the old woman found herself longing for the quiet life she had lost.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The years passed, and the boy grew into a man. The old woman wondered whether marriage might finally make him settle down. She asked the neighbors about young women of a suitable age. At last they found one who was pretty, good-hearted, and hardworking. The young man did not object, so the wedding was held at once. He and his bride came to live with the old woman in her cottage.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Marriage changed nothing. The husband spent every day amusing himself with his old companions. When he came home, his wife only had to speak against his behavior, and he would beat her with his stick. The next year they had a baby, and he beat the child too.
    - id: ch02
      title: The First Stroke of the Cane
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            At last, the old woman's patience came to an end. It was useless to keep hoping that this lazy, idle man would change. One day, she faced him and spoke plainly.
        - id: ch02-b02
          speaker: old_woman
          text: >-
            Do you mean to live this way forever? You are not a boy anymore, so stop acting like one. Give up these wicked habits. Work to support your wife and child, and above all, never beat them again. If you refuse, I will turn you into an ass. Men will heap heavy loads on your back and ride you. You will eat briars, and a goad will prick your hide. Then you will learn what it feels like to be beaten.
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: >-
            Her warning did no good at all. The young man only became angry and shouted at her rudely.
        - id: ch02-b04
          speaker: young_man
          text: Bah! Be quiet, or I will whip you too!
          emotion: angry
        - id: ch02-b05
          speaker: old_woman
          text: Oh, will you?
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: >-
            Her answer was grim. As quick as lightning, she seized a steel cane that stood in the corner and struck it across his shoulders. At once, his ears stretched long and his face grew longer. His arms turned into legs, and close gray hair covered his body. He had truly become an ass, and an exceedingly ugly one.
        - id: ch02-b07
          speaker: old_woman
          text: Get out of this house!
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: >-
            The ass shambled awkwardly through the door. He stood on the path outside with no idea what to do. Then a man happened to pass the cottage and saw him there.
        - id: ch02-b09
          speaker: passerby
          text: >-
            Well now, you are exactly the animal I have been looking for! You do not seem to belong to anyone, so you can come with me. I will soon find work for you.
        - id: ch02-b10
          speaker: narrator
          text: >-
            The man took the ass by one ear and led him away. For seven years, the ass endured the hard life the old woman had promised him. Yet he never remembered that his own cruelty had brought this suffering upon him. He never regretted the way he had lived. Instead, his heart grew harder and more bitter with every year.
        - id: ch02-b11
          speaker: narrator
          text: >-
            When the seven years were over, the ass skin finally wore out. He became a man once more, and one day he made his way back to the cottage.
    - id: ch03
      title: Seven Years as a Wolf
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            His wife answered his knock. The moment she recognized him, she dropped the door latch and ran back inside, calling out as she went.
        - id: ch03-b02
          speaker: wife
          text: Grandmother! Grandmother! Your son has returned!
          emotion: surprised
        - id: ch03-b03
          speaker: old_woman
          text: >-
            I expected him to come back. We managed perfectly well without him. Still, since he is standing outside, I suppose we must let him in.
        - id: ch03-b04
          speaker: narrator
          text: >-
            So the young man entered the cottage. Just as the old woman feared, he behaved even worse than he had before. She let him have his own way for several weeks. Then she could bear it no longer.
        - id: ch03-b05
          speaker: old_woman
          text: >-
            So those seven years taught you nothing! Very few people have enough sense to learn from experience, and you are clearly not one of them. Take care. I may turn you into a wolf, and then dogs and men will hunt you down.
          emotion: angry
        - id: ch03-b06
          speaker: young_man
          text: You never stop talking. I will smash your head!
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: >-
            If he had looked at the old woman's face, he might have understood the danger. But he was busy making a pipe and paid no attention to her. A moment later, the steel cane touched his shoulders. A huge gray wolf sprang through the doorway.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Dogs began yapping on every side. The neighbors shouted and rushed after him. For another seven years, he lived as a hunted animal. He was often cold and almost always hungry. He never dared to give himself over to a deep sleep.
        - id: ch03-b09
          speaker: narrator
          text: >-
            At last, the wolf skin wore out just as the ass skin had done. Once again, the young man appeared at the cottage door.
    - id: ch04
      title: The Black Crow
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The second seven years had taught him no more than the first. His behavior was now worse than ever. One day, he beat his wife and his son with such cruelty that they screamed for the old woman to help them.
        - id: ch04-b02
          speakers: [wife, son]
          ensemble: duo
          text: Grandmother, come and help us!
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: >-
            The old woman came at once, and the steel cane was in her hand. One stroke was enough. The brutal man vanished, and in his place a great black crow flapped around the room.
        - id: ch04-b04
          speaker: young_man
          text: Gour! Gour!
        - id: ch04-b05
          speaker: narrator
          text: >-
            The window stood open. The crow shot through it and flew off to find the companions who had first led him into wickedness. Somehow, he made them understand everything that had happened to him.
    - id: ch05
      title: Feathers That Never Wore Out
      blocks:
        - id: ch05-b01
          speakers: [companion_1, companion_2, companion_3]
          ensemble: chorus
          text: We will take revenge for you!
          emotion: angry
        - id: ch05-b02
          speaker: narrator
          text: >-
            The companions picked up a rope and set out for the cottage. They meant to strangle the old woman. But she was ready when they arrived.
        - id: ch05-b03
          speaker: narrator
          text: >-
            She struck once with her steel cane, and every one of them changed into a black crow. This time, their feathers have never worn out. They are black crows still.
