audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    prince:
      display_name: 王子
      tts:
        delivery: 善良坦率，年轻而有教养，危急时仍守住勇气
        timbre: 清朗温和的年轻男声
        pace: 适中
        pitch: 中
    dorani:
      display_name: 多拉妮
      tts:
        delivery: 聪慧矜持，言语轻柔，心意坚定
        timbre: 清澈柔美的年轻女声
        pace: 稍缓
        pitch: 中高
    king:
      display_name: 国王
      tts:
        delivery: 威严持重，面对家事时直率宽厚
        timbre: 浑厚端正的成年男声
        pace: 适中
        pitch: 中低
    scent_seller:
      display_name: 香料商人
      tts:
        delivery: 谦恭谨慎，对女儿信任而顺从
        timbre: 温和略显苍老的男声
        pace: 稍缓
        pitch: 中
    gardener:
      display_name: 老园丁
      tts:
        delivery: 慈祥沉稳，说话朴素而笃定
        timbre: 苍老低柔的男声
        pace: 舒缓
        pitch: 低
    fairy:
      display_name: 仙女
      tts:
        delivery: 机灵亲昵，好奇时带着直爽的追问
        timbre: 明亮轻盈的年轻女声
        pace: 轻快
        pitch: 中高
    indra:
      display_name: 因陀罗王
      tts:
        delivery: 尊贵自信，许诺时豪爽，懊恼时冷淡克制
        timbre: 清亮威严的成年男声
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 金发姑娘的婚约
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，印度斯坦的一座城里住着一位香料商人。他的女儿多拉妮美丽非凡，还有一位仙女做朋友。两人歌唱得甜，舞跳得轻巧，整个仙界都无人能比，因此很受因陀罗王宠爱。多拉妮的一头长发更是世间少有，像纺成的金线，还带着鲜玫瑰的香气。可头发太长太厚，常压得她难受。一天，她剪下一绺，用大叶子包好，扔进了窗下的河里。
        - id: ch01-b02
          speaker: narrator
          text: 那天，王子打猎途中来到河边喝水，正好看见一片折起的叶子漂来，四周都是玫瑰香。他好奇地踏进水中，把叶包捞了起来。里面藏着一绺金丝般闪亮的头发，幽香淡淡的，妙不可言。王子回宫后满面忧愁，一句话也不说。父王担心他遇上祸事，赶紧询问。王子便从怀里取出那绺头发，举到光下。
        - id: ch01-b03
          speaker: prince
          text: 父王，您见过这样的头发吗？我一定要找到它的主人，娶她为妻。不然，我就活不下去了！
        - id: ch01-b04
          speaker: narrator
          text: 国王马上派传令官走遍自己的领地，寻找这位金发姑娘。传令官一路查访，最后发现她正是香料商人的女儿。这时，国王为何派人四处寻找金发姑娘，早已传遍全城。多拉妮当然也听说了这件事，于是把父亲叫到身边，说出了自己的打算。
        - id: ch01-b05
          speaker: dorani
          text: 既然头发是我的，国王又要我嫁给王子，我会从命。可您一定要说明白，婚后我白天留在宫里，每个夜晚都必须回家。
        - id: ch01-b06
          speaker: narrator
          text: 香料商人听得十分惊讶，却知道女儿一向比自己聪明，便没有追问。那绺头发果然属于多拉妮。传令官很快回宫禀报，国王随即召来她的父亲，明说要让多拉妮嫁给王子。老人听罢，三次俯身叩首，把女儿唯一的条件禀告上去。
        - id: ch01-b07
          speaker: scent_seller
          text: 殿下是我们的君主，您说什么，我们都会照办。小女只求一件事。婚后，她白天住在宫中，夜里仍回父亲家，请您准许。
        - id: ch01-b08
          speaker: narrator
          text: 国王虽觉得这要求古怪得很，却又想，婚事终究属于儿子。再说，姑娘每天在娘家和王宫之间奔波，早晚会感到厌倦。于是他没有为难，马上命人安排婚事。没过多久，王子和多拉妮便在举国欢庆中成了婚。
        - id: ch01-b09
          speaker: narrator
          text: 王子原以为，哪怕妻子夜夜回家，白天总能与她相伴。谁知多拉妮整日坐在一张凳上，低头伏着膝盖，无论他怎样劝说，都不肯吐出一个字。每天傍晚，她坐着轿子离宫。第二天刚过黎明，又让人抬回来。她既不看丈夫，也不回应他，仿佛看不见、听不见，更不在意眼前这个人。王子怎么能不苦恼呢？
    - id: ch02
      title: 隐身追随的夜晚
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天傍晚，王子独自在宫旁的古老花园里徘徊。老园丁从他曾祖父在位时就已在这里服侍，一眼便看出王子心事重重，于是上前行礼。
        - id: ch02-b02
          speaker: gardener
          text: 孩子，你怎么这样难过？究竟出了什么事？
        - id: ch02-b03
          speaker: prince
          text: 老朋友，我的妻子美得像星星，却从不跟我说话。她夜夜回父亲家，日日坐在宫里，像石头一样一动不动。无论我做什么、说什么，她都不肯开口。我实在没有办法了。
        - id: ch02-b04
          speaker: narrator
          text: 老园丁想了一会儿，一瘸一拐地回到小屋，又拿着五六个纸包走来，把它们放进王子手里。
        - id: ch02-b05
          speaker: gardener
          text: 明天新娘离宫后，把一包药粉撒在身上。你仍看得见周围的一切，别人却看不见你。我只能帮到这里，愿事情顺利。
        - id: ch02-b06
          speaker: narrator
          text: 王子道了谢，把纸包仔细收进头巾。第二天夜里，多拉妮的轿子刚走，他便取出一包魔粉，撒遍全身，赶紧追了上去。药粉果然灵验。他感觉和往常完全一样，眼前发生的事也看得一清二楚，旁人却谁也看不见他。王子很快追上轿子，一直走在旁边。轿子到了香料商人的住处，蒙着重重面纱的多拉妮下轿进屋，他也悄无声息地跟了进去。
        - id: ch02-b07
          speaker: narrator
          text: 多拉妮穿过第一道门，摘下一层面纱。走到长廊尽头，她又摘下一层。登上楼梯，到了女眷居室门外，她才除去第三层。她在自己的房中先用玫瑰香油和清水沐浴，又匆匆吃下一碗凝乳。随后换上银色长袍，披挂串串珍珠，把玫瑰花环戴上金发。打扮妥当，她坐进一张带丝帘华盖的四脚凳，拉好帘幕。
        - id: ch02-b08
          speaker: dorani
          text: 飞吧，凳子，带我去因陀罗王的宫殿。
        - id: ch02-b09
          speaker: narrator
          text: 凳子立刻升到空中。王子惊奇万分，急忙抓紧一条凳腿，也被带上天空，飞快前行。不久，凳子停在多拉妮那位仙女朋友的家门前。仙女穿得同她一样美丽，早已等在门槛上。她一看凳子的模样，便惊讶起来。
        - id: ch02-b10
          speaker: fairy
          text: 咦，凳子今天怎么飞得歪歪斜斜？真奇怪。你是不是跟丈夫说过话，所以它才飞不直？
        - id: ch02-b11
          speaker: narrator
          text: 多拉妮坚持说，自己连一个字也没跟丈夫讲过。至于凳子为何像一边压了重物，她也完全想不明白。仙女仍有些怀疑，却没有继续追问，只在多拉妮身旁坐下。王子再次牢牢抓住一条凳腿。魔凳载着她们继续穿过夜空，一直飞到因陀罗王的宫殿。
        - id: ch02-b12
          speaker: narrator
          text: 两位女子整夜为因陀罗王唱歌跳舞，一把无人弹奏的魔琴则自行奏出迷人的乐曲。王子坐在一旁，看着眼前的一切，渐渐听得入了迷。天快亮时，因陀罗王终于抬手示意，让歌舞停下。多拉妮和仙女再次坐上凳子，王子也依旧紧抓凳腿。魔凳飞回人间，把多拉妮和丈夫平安送到香料商人的店铺。王子一落地便独自赶回宫中。他从多拉妮的轿子旁跑过，那些轿夫还睡眼惺忪，什么也没有察觉。刚跨进自己房间的门槛，王子便重新现形，随即躺在榻上等候多拉妮。
    - id: ch03
      title: 王子的怪梦
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 多拉妮回宫后，仍旧坐在凳上，低头伏着膝盖。两人沉默了好一阵，王子先开了口。
        - id: ch03-b02
          speaker: prince
          text: 我昨夜做了个怪梦，梦里全是你的事。就算你不愿理我，我也想说给你听。
        - id: ch03-b03
          speaker: narrator
          text: 多拉妮像是根本没有听见。王子仍把昨夜发生的一切从头讲起，自己看到的、听到的，一个细节也没有漏掉。夸起她的歌声时，他的嗓音还微微发颤。多拉妮终于抬眼看了丈夫一下，心里满是惊疑。这个梦实在太奇怪了。那真会是一场梦吗？若他没有亲眼看见，又怎会知道自己做过什么、说过什么？可她仍然守住沉默，只看了王子那一眼，便又低着头坐了一整天。
        - id: ch03-b04
          speaker: narrator
          text: 第二夜，王子又把魔粉撒在身上，隐去身形，跟随多拉妮离开王宫。一切都和前夜相同，只是她的歌唱得比以往任何时候都动听。第二天早晨，王子再次假称做梦，把她昨夜做过的事一一说出。等他刚一讲完，多拉妮便抬起头，凝视着他，终于问出了心里的疑惑。
        - id: ch03-b05
          speaker: dorani
          text: 这些事真是你梦见的，还是你昨夜也在那里？
        - id: ch03-b06
          speaker: prince
          text: 我真的在那里。
        - id: ch03-b07
          speaker: dorani
          text: 那你为什么跟着我？
        - id: ch03-b08
          speaker: prince
          text: 因为我爱你。只要陪在你身边，我就很幸福。
        - id: ch03-b09
          speaker: narrator
          text: 多拉妮的眼睑轻轻颤了一下，却没再说话。直到傍晚，她正要登上轿子，才回头对王子说。
        - id: ch03-b10
          speaker: dorani
          text: 你若爱我，今晚就别再跟来。请用这件事证明你的心。
        - id: ch03-b11
          speaker: narrator
          text: 王子依从她的愿望，独自留在宫中。那晚，魔凳摇晃得格外厉害，多拉妮和仙女几乎坐不住。
        - id: ch03-b12
          speaker: fairy
          text: 它颠成这样，只可能有一个原因。你已经跟丈夫说过话了！
        - id: ch03-b13
          speaker: dorani
          text: 是的，我开口了。哦，是的，我真的和他说话了！
        - id: ch03-b14
          speaker: narrator
          text: 至于别的，多拉妮什么也不肯说。那一夜，她唱得出奇美妙。一曲终了，因陀罗王站起身，许诺她想要什么，自己就给什么。多拉妮起初沉默不语，直到因陀罗王反复催问，她才提出心愿。
        - id: ch03-b15
          speaker: dorani
          text: 请把那把魔琴送给我。
        - id: ch03-b16
          speaker: narrator
          text: 因陀罗王一听就不高兴了。他后悔自己太轻率，竟许下这样的承诺。在他的所有宝物当中，最珍爱的偏偏就是这把魔琴。可是话已经当众说出口，他不能不兑现，只好满心不情愿地把琴交给多拉妮。
        - id: ch03-b17
          speaker: indra
          text: 以后你不准再来了。你这次要走了如此贵重的宝物，往后又怎会满足于小小的礼物？
        - id: ch03-b18
          speaker: narrator
          text: 多拉妮默默低下头，接过魔琴，和仙女一起走出宫门。魔凳等在外面，载着她们飞回人间，一路比先前晃得更厉害。
    - id: ch04
      title: 爱的魔力
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 早晨，多拉妮回到王宫，主动问王子是否又做了梦。王子欢喜地笑了，因为这是她第一次出于自己的心意和他说话。
        - id: ch04-b02
          speaker: prince
          text: 没有。不过我现在倒开始做梦了。我梦的不是过去发生过什么，而是我们将来会怎样。
        - id: ch04-b03
          speaker: narrator
          text: 那一天，多拉妮还是安安静静地坐着，可王子每次开口，她都会回答。天色渐暗，平日里，她早该坐上轿子回父亲家了，这次却依然留在原处。王子等了一会儿，见她没有起身的意思，便走到她身边，轻声问她。
        - id: ch04-b04
          speaker: prince
          text: 多拉妮，你今晚不回家了吗？
        - id: ch04-b05
          speaker: narrator
          text: 多拉妮站起身，流着泪扑进他的怀里，低声说出了自己的选择。
        - id: ch04-b06
          speaker: dorani
          text: 不回了，我的夫君。我再也不会离开你！
        - id: ch04-b07
          speaker: narrator
          text: 王子就这样赢得了美丽新娘的真心。从那以后，他们两人再没有与仙女来往，也不再碰任何仙术。可是日子一天天过去，他们对爱的魔力却懂得越来越多。仙术虽然早已离开人间，这一种魔力，人们至今仍然能够学会。
