  chapters:
    - id: ch01
      title: The Golden Tress
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once, in a city of Hindustan, there lived a seller of scents and essences. His daughter, Dorani, was wonderfully beautiful. Her dearest friend was a fairy, and both of them were favorites of Indra, king of fairyland. No one in his kingdom could match the grace and beauty of their singing and dancing.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Dorani's hair was the loveliest in the world. It shone like spun gold and smelled of fresh roses. But it grew so long and thick that its weight often became too much for her. One day she cut off a shining tress, wrapped it in a broad leaf, and dropped it into the river below her window.
        - id: ch01-b03
          speaker: narrator
          text: >-
            That same day, the king's son was out hunting. He went down to the river for a drink and saw a folded leaf drifting toward him, carrying the scent of roses. Curious, he stepped into the water and caught it. Inside lay a golden lock of hair with a faint and exquisite perfume.
        - id: ch01-b04
          speaker: narrator
          text: >-
            When the prince returned home, he was so sad and silent that his father feared something terrible had happened. The king asked what troubled him. The young man drew the tress from his coat and held it up to the light.
        - id: ch01-b05
          speaker: prince
          text: Father, have you ever seen hair like this? I must find the maiden it belongs to and marry her, or I shall die!
        - id: ch01-b06
          speaker: narrator
          text: >-
            At once, the king sent heralds throughout his lands to find the girl whose hair shone like spun gold. At last they learned that she was the scent-seller's daughter. Everyone throughout the city soon knew why the heralds had come, and Dorani heard the news with the rest. One day she spoke to her father.
        - id: ch01-b07
          speaker: dorani
          text: >-
            If the lock is mine, and the king commands me to marry his son, then I must obey. But tell him this. After the wedding, I may spend each day at the palace, but every night I must return to my old home.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Her father was amazed, but he knew Dorani was wiser than he was, so he did not question her. The heralds soon confirmed that the hair was hers. The king summoned the scent-seller and asked him to give Dorani to the prince in marriage. The old man bowed three times, all the way to the ground.
        - id: ch01-b09
          speaker: scent_seller
          text: >-
            Your Highness is our lord, and we will do whatever you command. My daughter asks only one thing. If she spends the day at the palace after the wedding, she must be allowed to return to my house each night.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The king found the request very strange. Still, he decided it was his son's concern, and surely the girl would soon grow tired of traveling back and forth. He raised no objection. The arrangements were quickly made, and the wedding was celebrated with great rejoicing.
        - id: ch01-b11
          speaker: narrator
          text: >-
            At first, the prince did not worry about Dorani's condition. He thought he would at least have her company all day. Instead, she sat for hours on a stool with her head bowed over her knees. Nothing he said could persuade her to speak. Each evening, bearers carried her to her father's house in a palanquin. Soon after dawn, they brought her back. Not one sound passed her lips, and she never showed that she saw or heard her husband.
    - id: ch02
      title: The Invisible Prince
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            One evening, the unhappy prince wandered through an old and beautiful garden near the palace. Its gardener was a very aged man who had served the prince's great-grandfather. When he saw the young man, he came forward and bowed.
        - id: ch02-b02
          speaker: old_gardener
          text: My child, why do you look so miserable? What is wrong?
        - id: ch02-b03
          speaker: prince
          text: >-
            I am miserable because my wife is as lovely as the stars, but she will not speak to me. Every night she leaves for her father's house. Every day she sits in mine like a figure carved from stone. Whatever I say or do, she never answers.
          emotion: sad
        - id: ch02-b04
          speaker: narrator
          text: >-
            The old gardener thought for a moment, then hobbled away to his cottage. Soon he returned carrying five or six little packets, which he placed in the prince's hands.
        - id: ch02-b05
          speaker: old_gardener
          text: >-
            Tomorrow night, after your bride leaves the palace, scatter the powder from one packet over yourself. You will still see everything clearly, but no one will be able to see you. That is all I can do. May fortune go with you.
        - id: ch02-b06
          speaker: narrator
          text: >-
            The prince thanked him and tucked the packets safely into his turban. The following night, as Dorani's palanquin left for her father's house, he sprinkled himself with the magic powder and hurried after her. Just as the gardener had promised, he was invisible to everyone, though he felt no different and could see everything around him.
        - id: ch02-b07
          speaker: narrator
          text: >-
            He caught up with the palanquin and walked beside it to the scent-seller's home. When Dorani stepped out, closely veiled, the unseen prince followed her inside. At the first door she removed one veil. At the doorway beyond the passage she removed a second. Then she climbed the stairs and took off a third veil at the entrance to the women's rooms.
        - id: ch02-b08
          speaker: narrator
          text: >-
            In Dorani's own room stood two great basins, one filled with rose perfume and the other with water. She washed herself in them, then called for something to eat. A servant brought her a bowl of curds, and Dorani ate it quickly.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Then she put on a silver robe and wound strings of pearls around herself. At last, she crowned her golden hair with a wreath of roses.
        - id: ch02-b10
          speaker: narrator
          text: >-
            When she was ready, Dorani sat on a four-legged stool beneath a canopy hung with silk curtains. She drew the curtains around her and gave a command.
        - id: ch02-b11
          speaker: dorani
          text: Fly, stool, to the palace of Rajah Indra!
        - id: ch02-b12
          speaker: narrator
          text: >-
            At once, the stool rose into the air. The invisible prince had watched all of this in wonder. As it flew away, he seized one of its legs and was carried swiftly through the sky.
    - id: ch03
      title: The Palace of Indra
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Before long, they reached the home of Dorani's fairy friend. The fairy stood waiting at the door, dressed as beautifully as Dorani. When the stool landed, she stared at it in surprise.
        - id: ch03-b02
          speaker: fairy_friend
          text: >-
            Why did your stool fly so crookedly tonight? I wonder what caused that. Perhaps you have been talking to your husband, and now it refuses to fly straight.
          emotion: surprised
        - id: ch03-b03
          speaker: dorani
          text: I have not said one word to him. I cannot imagine why the stool feels so heavy on one side.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The fairy still looked doubtful, but she said nothing more. She sat beside Dorani, while the prince again held tightly to one leg. The stool carried all three of them through the air to the palace of Rajah Indra.
        - id: ch03-b05
          speaker: narrator
          text: >-
            All night long, Dorani and the fairy sang and danced before Indra. They moved with a grace no one else in his kingdom could equal. A magic lute played the most enchanting music all by itself. Hidden nearby, the prince watched and listened, completely spellbound.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Just before dawn, Indra signaled for the music to end. The two friends sat on the stool once more, and the prince clung to its leg. It flew them back to earth and carried Dorani and her unseen husband safely to the scent-seller's shop.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The prince hurried on alone. He passed Dorani's palanquin and its sleepy bearers and went straight to his own rooms. The moment he crossed the threshold, he became visible again. He lay down on a couch and waited.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Dorani arrived, took her usual seat, and bowed her head over her knees. For a while, the room was silent. Then the prince began to speak.
        - id: ch03-b09
          speaker: prince
          text: >-
            I had a remarkable dream last night. You were in every part of it. I know you pay no attention to me, but I am going to tell you anyway.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Dorani gave no sign that she had heard. Even so, the prince described everything that had happened the night before. He left out nothing he had seen or heard. When he praised her singing, his voice trembled a little. Dorani looked up at him then, though she still did not speak.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Inside, she was full of wonder. Could this truly have been a dream? How could a dream have shown him everything she had said and done? But after that one glance, Dorani lowered her head and remained silent for the rest of the day.
    - id: ch04
      title: Dorani Speaks
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            When night came, the prince used a second packet of powder and followed Dorani again. Everything happened as it had before, except that Dorani sang more beautifully than ever. The next morning, the prince once more told her all she had done, pretending he had seen it in a dream. This time, as soon as he finished, Dorani gazed directly at him.
        - id: ch04-b02
          speaker: dorani
          text: Tell me the truth. Did you dream all this, or were you really there?
        - id: ch04-b03
          speaker: prince
          text: I was there.
        - id: ch04-b04
          speaker: dorani
          text: Then why do you keep following me?
        - id: ch04-b05
          speaker: prince
          text: Because I love you, and being near you makes me happy.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Dorani's eyelids trembled, but she said nothing else. She stayed silent all day. That evening, just as she was about to step into her palanquin, she turned to the prince.
        - id: ch04-b07
          speaker: dorani
          text: If you truly love me, show me by staying here tonight. Do not follow me.
        - id: ch04-b08
          speaker: narrator
          text: The prince did as she asked and remained at home.
        - id: ch04-b09
          speaker: narrator
          text: >-
            That night, the magic stool lurched so badly that Dorani and the fairy could scarcely stay seated. At last, her friend cried out.
        - id: ch04-b10
          speaker: fairy_friend
          text: There can be only one reason for all this jerking. You have spoken to your husband!
          emotion: surprised
        - id: ch04-b11
          speaker: dorani
          text: Yes, I spoke to him. Oh, yes, I spoke!
          emotion: happy
        - id: ch04-b12
          speaker: narrator
          text: Dorani would tell her nothing more.
        - id: ch04-b13
          speaker: narrator
          text: >-
            At Indra's palace that night, Dorani sang so marvelously that the rajah rose when she finished. He vowed that she could ask for anything she wished, and he would give it to her. Dorani was silent at first. When he urged her to choose, she answered.
        - id: ch04-b14
          speaker: dorani
          text: Give me the magic lute.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Indra was angry with himself for making such a reckless promise. He prized the lute above everything else he owned. But he had given his word, so he had to keep it. With great reluctance, he handed the instrument to Dorani.
        - id: ch04-b16
          speaker: indra
          text: >-
            You must never return here. After asking for my greatest treasure, how could you ever be satisfied with a smaller gift?
        - id: ch04-b17
          speaker: narrator
          text: >-
            Dorani bowed her head without a word and accepted the lute. She and the fairy passed through the great gate to the waiting stool. More unsteadily than ever, it carried them back to earth.
    - id: ch05
      title: Never Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            When Dorani reached the palace that morning, she asked whether the prince had dreamed again. He laughed with happiness. For the first time, she had spoken to him because she wished to.
        - id: ch05-b02
          speaker: prince
          text: >-
            No, but now I am beginning to dream. I am not dreaming about what has already happened. I am dreaming about what might happen next.
          emotion: happy
        - id: ch05-b03
          speaker: narrator
          text: >-
            Dorani sat very quietly that day, but whenever the prince spoke, she answered him. Evening came, and with it the hour when she always left for her father's house. Yet Dorani stayed where she was. The prince stepped close and spoke softly.
        - id: ch05-b04
          speaker: prince
          text: Aren't you going home tonight, Dorani?
        - id: ch05-b05
          speaker: narrator
          text: Dorani rose, threw herself into his arms, and began to weep. Then she whispered to him.
        - id: ch05-b06
          speaker: dorani
          text: Never again, my lord. Never again will I leave you!
        - id: ch05-b07
          speaker: narrator
          text: >-
            And so the prince won his beautiful bride. Neither of them had any further dealings with fairies or fairy magic. Instead, each day they learned more about the magic of love. That magic can still be learned, even though fairy magic has vanished from the world.
