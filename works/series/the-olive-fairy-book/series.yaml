cover_prompt: |-
  A wordless cover scene beside a blue and silver forest lake shows a beautiful young girl waking on a cushion of soft moss as a circle of tiny old men gathers around her. The girl has torn shoes and stockings from her walk, while the little men have white beards reaching to their knees and one kind figure reaches down from a willow branch to stroke her fingers. Purple and gold irises and white water-lilies surround the moonlit shore, and tiny forked footprints mark the sand. Deeper in the scene, a dignified ruler less than half the girl's size wears a huge diamond crown and a royal mantle and carries a lance, while a messenger arrives riding a crow with milk, honey, and white bread. Make the girl's awakening and the gentle greeting the focal action, with the small figures forming a welcoming circle rather than a threatening crowd. Use a wide, slightly elevated composition with layered willow branches and lake reflections, leaving calm open sky and pale mist across the top. Keep every figure original, warm, child-friendly, and independent of film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
