  chapters:
    - id: ch01
      title: The Impossible Suitor
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once upon a time, a woman and her son lived in a small cottage among the hills. The son was hardly more than twenty, yet to his mother's great sorrow, he had no more hair on his head than a baby. His bald head made him look old, but he was young enough to work. He simply would not. His mother tried to teach him one trade after another. Each time, he refused to do the work and came home again after a few days.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One fine summer morning, he lay half asleep in the little garden outside the cottage, as idle as ever. Then the sultan's daughter rode past with a company of ladies in bright clothes. The young man lazily propped himself up on one elbow and looked at her. That single glance changed him completely. He decided that he would marry her and no one else. He jumped to his feet and went straight to his mother.
        - id: ch01-b03
          speaker: youth
          text: Go to the sultan at once. Tell him I want his daughter for my wife.
        - id: ch01-b04
          speaker: narrator
          text: >-
            His mother shouted and shrank back into a corner. The request was so astonishing that she thought he must have suddenly gone mad.
        - id: ch01-b05
          speaker: mother
          text: What did you say?
          emotion: surprised
        - id: ch01-b06
          speaker: youth
          text: Didn't you hear me? Go to the sultan now and tell him I mean to marry his daughter.
        - id: ch01-b07
          speaker: mother
          text: >-
            But do you understand what you're saying? You refuse to learn any trade. All you own are the five gold pieces your father left you. Do you truly think the sultan will give his daughter to a poor, bald young man like you?
          emotion: surprised
        - id: ch01-b08
          speaker: youth
          text: That's for me to worry about. Just do as I tell you.
        - id: ch01-b09
          speaker: narrator
          text: >-
            He pestered her day and night and would not stop. At last, in despair, she put on her best clothes, wrapped her veil around her, and crossed the hill to the palace.
        - id: ch01-b10
          speaker: narrator
          text: >-
            That was the day the sultan listened to the complaints and requests of his people, so the woman was allowed into his presence without difficulty.
        - id: ch01-b11
          speaker: mother
          text: >-
            Your Excellency, please don't think I'm mad, though I know I must sound mad. I have a son who saw the princess's veiled face, and since then he hasn't given me a moment's peace. Day and night, he has demanded that I come here and ask you to let him marry her. I told him I might lose my head for being so bold, but he wouldn't listen. So here I am. You may do with me whatever you wish.
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: >-
            The sultan enjoyed anything unusual, and this was certainly new. Another ruler might have had the trembling woman whipped or thrown into prison. The sultan did neither.
        - id: ch01-b13
          speaker: sultan
          text: Send your son to me.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The old woman stared at him. The sultan repeated himself even more gently, and he did not seem angry. She found her courage, bowed once more, and hurried home.
        - id: ch01-b15
          speaker: youth
          text: Well? What happened?
        - id: ch01-b16
          speaker: mother
          text: Go to the palace right away. The sultan wants to speak to you himself.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The young man's face shone at the news. His mother looked at him and thought it was a pity he had no hair, for otherwise he would have been quite handsome.
        - id: ch01-b18
          speaker: youth
          text: I'll be there faster than lightning!
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: In another instant, he had vanished from her sight.
    - id: ch02
      title: All the Birds in the World
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            When the sultan saw the bald head of the man who wanted to marry his daughter, he no longer felt like making a joke of the matter. He wanted to be rid of this unwelcome suitor. Yet he had called the young man to the palace, so he could hardly send him away without giving a reason. He quickly thought of a task.
        - id: ch02-b02
          speaker: sultan
          text: >-
            I hear you wish to marry my daughter. Very well. But first, her husband must gather every bird in the world and bring them all into my palace gardens. Until now, no bird has ever made its home in those trees.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The young man was in despair. How could he possibly catch every one of those birds? Even if he caught them, carrying them to the palace would take years. Still, he was too proud to let the sultan think he had surrendered the princess without a struggle. He set off along a road that passed the palace and walked on without noticing where it led.
        - id: ch02-b04
          speaker: narrator
          text: >-
            A week passed this way. At last he found himself crossing a desert where great rocks lay scattered across the ground. In the shade of one rock sat a holy man called a dervish. The dervish motioned for the young man to sit beside him.
        - id: ch02-b05
          speaker: dervish
          text: Something is weighing on you, my son. Tell me about it. Perhaps I can help.
        - id: ch02-b06
          speaker: youth
          text: >-
            Father, I want to marry the princess of my country. But the sultan won't give her to me unless I gather every bird in the world and bring them to his garden. How could I, or anyone else, ever do such a thing?
        - id: ch02-b07
          speaker: dervish
          text: >-
            Don't lose hope. The task isn't as hard as it sounds. Travel for two days toward the setting sun. There you will find a cypress tree larger than any other cypress on earth. Sit close to its trunk, in the deepest part of its shadow, and don't move.
          emotion: calm
        - id: ch02-b08
          speaker: dervish
          text: >-
            After a while, you will hear a tremendous rush of wings. Every bird in the world will come to rest among the branches. Make no sound until all is quiet again. Then say, “Madschun!” The birds will be held exactly where they sit. Not one will be able to leave its perch. Place them over your head, your arms, and your body, and carry them to the sultan that way.
        - id: ch02-b09
          speaker: narrator
          text: >-
            The young man thanked the dervish with a glad heart. Two days later, he found the enormous cypress and sat still in its darkest shade. The rush of wings came, and the branches filled with every bird in the world. He waited until all was quiet, then spoke the word Madschun. Not one bird could leave its perch. He lifted them from the tree and placed them across his head, his arms, and the rest of his body. A few days later, that strange figure covered in soft feathers walked into the sultan's presence.
        - id: ch02-b10
          speaker: narrator
          text: >-
            The sultan had never seen anything like it. He gazed in wonder at the lovely little bodies and their bright, frightened eyes. Soon there came a gentle rustling. Countless wings began to open around the young man. Some were blue, some yellow, some red, and some green.
        - id: ch02-b11
          speaker: youth
          text: You may all go now.
        - id: ch02-b12
          speaker: narrator
          text: >-
            The birds flew in circles around the sultan's head. Then they streamed out through the open window and chose new homes in the palace garden.
        - id: ch02-b13
          speaker: youth
          text: I have done what you asked, Sultan. Now give me the princess.
        - id: ch02-b14
          speaker: sultan
          text: >-
            Yes, yes! You have pleased me greatly. There is just one more thing you need before any girl could want you for a husband. Your head is terribly bald. Cover it with thick, handsome curls, and then I will give you my daughter. A clever man like you should have no trouble at all.
    - id: ch03
      title: The Sultan Breaks His Word
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The young man said nothing as he listened. Afterward, he sat silently in his mother's kitchen, and there he remained for many days. Then one morning he heard that the sultan had promised the princess to the vizier's son. Their wedding was to take place at once in the palace.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The young man rose in fury. Quickly and secretly, he went to a side door used only by the workers who repaired the palace. No one saw him enter the mosque. From there, he slipped through a gallery that opened directly above the great hall.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The princess, the bridegroom, and two or three friends had gathered in the hall. They were waiting for the sultan to arrive so the marriage contract could be signed. Hidden above them, the young man whispered a single word.
        - id: ch03-b04
          speaker: narrator
          text: >-
            He whispered the word Madschun. At once, everyone in the hall was fixed to the spot. Messengers sent by the sultan to see whether all was ready entered the room, and the spell caught them too.
        - id: ch03-b05
          speaker: narrator
          text: >-
            At last the sultan grew angry and impatient. He came down to see for himself what had happened. No one could explain it. So he ordered an attendant to fetch a magician who lived near one of the city gates. Some evil spirit had cast a spell, he said, and the magician must break it.
        - id: ch03-b06
          speaker: magician
          text: >-
            This is your own doing. You broke your promise to the young man, and that is why this has happened to your daughter. There is only one cure. The bridegroom you chose must step aside, and the bald young man must take his place.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The sultan's heart was sore, but he knew the magician was wiser than he was. He sent his most trusted servants to find the young man and bring him back without a moment's delay.
        - id: ch03-b08
          speaker: narrator
          text: >-
            All this time, the young man had been hiding behind a pillar. He smiled when he heard the order. Then he hurried home and told his mother exactly what to do.
        - id: ch03-b09
          speaker: youth
          text: >-
            Messengers from the sultan will come looking for me. Tell them I went away a long time ago, and you have no idea where I am. Say you will try to find me, but only if they give you enough money for the journey, because you are very poor.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Then he climbed into the loft and hid there, where he could hear everything below.
    - id: ch04
      title: A Purse of Gold
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The very next minute, someone pounded on the door. The old woman jumped up and opened it.
        - id: ch04-b02
          speaker: messenger
          text: Is your bald son here? If he is, send him with me. The sultan wants to speak to him immediately.
        - id: ch04-b03
          speaker: mother
          text: Oh, sir, he left me a long time ago. I haven't had a word of news from him since that day.
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: As she spoke, the woman lifted a corner of her veil to her eyes.
        - id: ch04-b05
          speaker: messenger
          text: >-
            Good lady, can't you think where he might be? The sultan means to give him his daughter in marriage. Whoever brings the young man back is certain to receive a great reward.
        - id: ch04-b06
          speaker: mother
          text: >-
            He never told me where he was going. Still, this is a great honor from the sultan, and it is worth making an effort. I know a few places where he might be found. But only I know them, and I'm a poor woman with no money for such a journey.
        - id: ch04-b07
          speaker: messenger
          text: >-
            Money won't stop you. This purse holds a thousand gold pieces. Spend whatever you need. Tell me where to find him, and you shall have another thousand.
        - id: ch04-b08
          speaker: mother
          text: >-
            Very well, we have a bargain. Now I must say goodbye and prepare for the journey. You will hear from me within a few days.
        - id: ch04-b09
          speaker: narrator
          text: >-
            For nearly a week, the woman and her son left the cottage only after dark, so none of their neighbors would see them. They did not light a lantern or even kindle a fire. Everyone nearby came to believe the cottage was empty.
        - id: ch04-b10
          speaker: narrator
          text: >-
            At last, on a fine morning, the young man rose early. He dressed carefully, put on his best turban, and ate a quick breakfast. Then he set out for the palace.
        - id: ch04-b11
          speaker: narrator
          text: >-
            The huge guard at the door was clearly expecting him and let him pass without a word. Another attendant waited inside and led him directly to the sultan. This time, the sultan welcomed him gladly.
    - id: ch05
      title: The Victims of Madschun
      blocks:
        - id: ch05-b01
          speaker: sultan
          text: My son! Where have you been hiding all this time?
          emotion: happy
        - id: ch05-b02
          speaker: youth
          text: >-
            Sultan, I won your daughter fairly, but you broke your promise and refused to give her to me. My own home became hateful, so I left it and wandered through the world. Now you regret your broken word, and I have returned to claim the wife who belongs to me by right. Tell your vizier to prepare the contract.
        - id: ch05-b03
          speaker: narrator
          text: >-
            A new marriage contract was prepared. At the young man's request, the sultan and the vizier signed it in the same chamber where they had met him. Once that was done, the young man asked to be taken to the princess.
        - id: ch05-b04
          speaker: narrator
          text: >-
            He and the sultan entered the great hall together. Everyone there stood exactly as they had when he spoke the fatal word.
        - id: ch05-b05
          speaker: sultan
          text: Can you break the spell?
          emotion: fearful
        - id: ch05-b06
          speaker: youth
          text: I believe I can.
        - id: ch05-b07
          speaker: narrator
          text: >-
            In truth, the young man felt a little anxious himself. He stepped forward and called out.
        - id: ch05-b08
          speaker: youth
          text: Let the victims of Madschun be free!
        - id: ch05-b09
          speaker: narrator
          text: >-
            The words had scarcely left his mouth when those motionless figures came back to life. The princess joyfully placed her hand in the hand of her new bridegroom.
        - id: ch05-b10
          speaker: narrator
          text: >-
            As for the first bridegroom, he vanished completely. No one ever knew what became of him.
