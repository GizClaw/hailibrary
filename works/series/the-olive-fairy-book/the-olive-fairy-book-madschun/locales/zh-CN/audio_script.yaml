audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    young_man:
      display_name: 年轻人
      tts:
        delivery: 骄傲执拗，话语直接，得意时透出机敏
        timbre: 清亮而略显急躁的青年男声
        pace: 适中偏快
        pitch: 中
    mother:
      display_name: 母亲
      tts:
        delivery: 朴实谨慎，忧虑中带着生活磨出的机灵
        timbre: 略显苍老而温厚的女声
        pace: 适中
        pitch: 中低
    sultan:
      display_name: 苏丹
      tts:
        delivery: 威严善变，表面从容，窘迫时语速加快
        timbre: 洪亮饱满的成年男声
        pace: 适中
        pitch: 中低
    dervish:
      display_name: 德尔维希
      tts:
        delivery: 沉静慈和，指点时清楚笃定
        timbre: 低沉平稳的老年男声
        pace: 舒缓
        pitch: 低
    magician:
      display_name: 魔法师
      tts:
        delivery: 冷静直率，不畏权势
        timbre: 干净沉着的成年男声
        pace: 适中偏慢
        pitch: 中低
    messenger:
      display_name: 苏丹的信使
      tts:
        delivery: 办事急切，说话爽快利落
        timbre: 清晰有力的成年男声
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 非公主不娶
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，群山间有一座小屋，里面住着一位母亲和她的儿子。儿子才二十出头，头发却比婴儿还少，远远看去，竟像早早老了，母亲为此伤透了心。可他一点也不勤快。母亲不管送他去学什么手艺，他都不肯好好干，过不了几天就会溜回家。
        - id: ch01-b02
          speaker: narrator
          text: 一个晴朗的夏日清晨，年轻人照旧躺在屋前的小花园里，迷迷糊糊地打着盹。苏丹的女儿骑马从门前经过，身后跟着一群穿戴鲜艳的女伴。他懒洋洋地用胳膊撑起身子，只朝公主望了一眼，整个人就像变了一个样。
        - id: ch01-b03
          speaker: young_man
          text: 我一定要娶她，别人谁也不要。
        - id: ch01-b04
          speaker: narrator
          text: 他一跃而起，跑去找母亲。
        - id: ch01-b05
          speaker: young_man
          text: 您马上去见苏丹，就说我要娶他的女儿。
        - id: ch01-b06
          speaker: mother
          text: 你说什么？
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: 老妇人吓得缩进墙角。这么离奇的差事，只能叫她以为儿子忽然疯了。
        - id: ch01-b08
          speaker: young_man
          text: 您还没听懂吗？现在就去告诉苏丹，我要他的女儿做妻子。
        - id: ch01-b09
          speaker: mother
          text: 可……可你知道自己说的是什么吗？你什么手艺都不学，父亲留给你的钱也只剩五枚金币。你一个身无分文的秃头小子，苏丹怎么可能把女儿嫁给你？
        - id: ch01-b10
          speaker: young_man
          text: 这事由我操心。您照我说的做就是了。
        - id: ch01-b11
          speaker: narrator
          text: 从那以后，年轻人没日没夜地缠着母亲，闹得她一刻也不得安生。老妇人实在没了办法，只好穿上最体面的衣裳，裹好面纱，翻过山头去见苏丹。那天，苏丹正好接见百姓，听他们诉苦和请愿，她很顺利便进到了苏丹面前。
        - id: ch01-b12
          speaker: mother
          text: 大人，请您别把我当成疯子，虽说我这样闯进来，确实很像疯了。我有个儿子，自从看见公主蒙着面纱的脸，就白天黑夜地折磨我，非逼我进宫替他求娶您的女儿。我劝他说，这样大胆会叫我掉脑袋，可他怎么也不肯听。我只好来了。您要怎么处置我，我都认了！
        - id: ch01-b13
          speaker: narrator
          text: 苏丹一向最喜欢稀奇事，眼前这件更是从没遇到过。换了别的君王，也许早就叫人鞭打这个浑身发抖的女人，或把她关进牢房。苏丹却没有这样做，只吩咐了一句。
        - id: ch01-b14
          speaker: sultan
          text: 让你儿子亲自来。
        - id: ch01-b15
          speaker: narrator
          text: 老妇人惊讶得瞪大了眼睛。苏丹又温和地说了一遍，脸上一点怒气也没有。她这才放下心，再行一礼，急忙赶回家。
        - id: ch01-b16
          speaker: young_man
          text: 怎么样？办成了吗？
        - id: ch01-b17
          speaker: mother
          text: 苏丹叫你马上进宫，亲自同他说。
        - id: ch01-b18
          speaker: narrator
          text: 年轻人的脸立刻亮了起来，亮得母亲忍不住想，他要是有头发，准是个漂亮小伙子。
        - id: ch01-b19
          speaker: young_man
          text: 闪电也赶不上我！
          emotion: happy
        - id: ch01-b20
          speaker: narrator
          text: 一眨眼，他就跑得没影了。
    - id: ch02
      title: 聚齐世上所有的鸟
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 苏丹一看见求婚者那颗光秃秃的脑袋，顿时不想再开玩笑了。他只想甩掉这个不讨人喜欢的女婿。可人是自己叫来的，总得找个理由才能赶走。
        - id: ch02-b02
          speaker: sultan
          text: 你想娶我的女儿，是吗？可以。不过，她未来的丈夫得先把世上所有的鸟都聚起来，带到王宫花园里。那里的树上直到现在还没有鸟儿安家。你办成这件事，再来谈婚事吧。
        - id: ch02-b03
          speaker: narrator
          text: 年轻人一下子绝望了。世上那么多鸟，该怎么捉？就算真的全捉到了，全部送进王宫又得花多少年？可他太骄傲了，不愿让苏丹以为自己连争也不争便放弃公主。他沿着经过王宫的路一直走，心里乱成一团，根本没看自己去了哪里。
        - id: ch02-b04
          speaker: narrator
          text: 就这样，他漫无目的地走了整整一星期，最后来到一片荒漠。那里四下散落着一块块巨大的岩石。其中一块岩石投下的阴影里，坐着一位圣人，也就是人们所说的德尔维希。老人朝年轻人招招手，请他坐到自己身旁。
        - id: ch02-b05
          speaker: dervish
          text: 孩子，你心里有烦恼。说给我听听，也许我帮得上忙。
        - id: ch02-b06
          speaker: young_man
          text: 师父，我想娶我们国家的公主。苏丹却说，除非我把世上所有的鸟聚齐，送进他的花园，不然就不肯嫁女儿。可这件事，世上有谁做得到呢？
        - id: ch02-b07
          speaker: dervish
          text: 别灰心，事情没有听上去那么难。从这里朝日落的方向走两天，你会看见一棵柏树，比世上任何柏树都大。你挨着树干，坐在树影最浓的地方，一动也别动。过一阵，你会听见无数翅膀扇动的巨响，世上所有的鸟都会飞来，落到枝头。等四周重新安静下来，你才能开口，说一声“马德申”。鸟儿听见以后，谁也不能离开栖木。你把它们放满头顶、双臂和全身，就这样送到苏丹面前。
        - id: ch02-b08
          speaker: narrator
          text: 年轻人欢欢喜喜地谢过德尔维希，把每一句叮嘱都牢牢记在心里。几天后，一个从头到脚盖满柔软羽毛的古怪身影走到苏丹面前。公主的父亲从没见过这样的景象，惊得说不出话来。那些小小的身子真可爱，一双双明亮的眼睛却吓得发慌。接着，四周响起轻柔的窸窣声，无数翅膀一齐展开，蓝的、黄的、红的、绿的，什么颜色都有。
        - id: ch02-b09
          speaker: young_man
          text: 去吧。
        - id: ch02-b10
          speaker: narrator
          text: 鸟儿先一圈又一圈地绕着苏丹的头顶飞，随后穿过敞开的窗户，消失在花园里，各自挑选树木安家。
        - id: ch02-b11
          speaker: young_man
          text: 苏丹，您交代的事我已经办妥。现在请把公主嫁给我。
        - id: ch02-b12
          speaker: sultan
          text: 好，好！这件事你办得真漂亮！如今只差最后一点，你就会成为所有姑娘都喜欢的丈夫。你那颗脑袋，实在太秃了。等你让它长出一头浓密漂亮的卷发，我就把女儿嫁给你。你本事这么大，这点小事肯定难不住你。
    - id: ch03
      title: 马德申的咒语
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 年轻人一句话也没有说。接下来的许多天，他都沉默地坐在母亲的厨房里。一天早晨，一条消息传来。苏丹已经把女儿许配给维齐尔的儿子，而且一刻也不想耽搁，婚礼马上就要在王宫举行。
        - id: ch03-b02
          speaker: narrator
          text: 年轻人气得跳起来，飞快地赶到王宫，又悄悄绕到一扇侧门。那里只有修缮宫殿的工匠出入。他没被任何人看见，先溜进清真寺，再沿着一条直通大殿的回廊进入王宫。新娘、新郎和两三个朋友都已聚在那里，正等苏丹出现，好把婚约签下来。年轻人藏在高处，轻轻念出了那个咒语：“马德申！”
        - id: ch03-b03
          speaker: narrator
          text: 这声轻轻的咒语从高处传来，殿里所有人的脚立刻像生了根，谁也动弹不得。过了一会儿，苏丹派了几个信使来查看婚礼是否准备妥当。他们一踏进来，也全被定在原地。
        - id: ch03-b04
          speaker: narrator
          text: 苏丹等了又等，越等越生气，最后只好亲自下来查看。可殿里没有一个人能告诉他发生了什么。他便命侍从去城门附近，请一位魔法师来破除恶灵施下的咒语。
        - id: ch03-b05
          speaker: magician
          text: 这全是您自己的过错。要是您没有对那个年轻人食言，您的女儿也不会遭这场祸。现在只剩一个办法。您挑中的新郎必须让位，让那个秃头年轻人娶公主。
        - id: ch03-b06
          speaker: narrator
          text: 苏丹听了，心里实在不好受。可他也知道，魔法师比自己懂得多。他派出最信任的仆人，叫他们一刻也别耽误，马上找到年轻人，带回王宫。可年轻人其实一直躲在柱子后面。听见苏丹的命令，他暗自笑了笑，立刻赶回家。
        - id: ch03-b07
          speaker: young_man
          text: 要是苏丹的信使来问，您就说我早已出门，很久没回来，您也不知道我去了哪里。再告诉他们，您穷得没有盘缠。只要他们肯给钱，您一定会尽力把我找回来。
        - id: ch03-b08
          speaker: narrator
          text: 交代完以后，年轻人躲进阁楼，留心听着下面的动静。
    - id: ch04
      title: 一千枚金币
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 没过多久，外面果然响起一阵重重的敲门声。老妇人赶紧起身开门。
        - id: ch04-b02
          speaker: messenger
          text: 你那个秃头儿子在家吗？在的话，就让他立刻跟我走。苏丹现在要见他。
        - id: ch04-b03
          speaker: mother
          text: 唉，先生，他早就离开我了。从那天起，我连他的一点消息也没有听到。
        - id: ch04-b04
          speaker: narrator
          text: 她说着，还拿面纱的一角擦了擦眼睛。
        - id: ch04-b05
          speaker: messenger
          text: 好心的太太，您总能猜到他可能去了哪里吧？苏丹要把公主嫁给他。谁能把他找回来，苏丹一定会给一大笔赏钱。
        - id: ch04-b06
          speaker: mother
          text: 他从没告诉我去了哪儿。不过，苏丹给他这么大的荣耀，倒值得我费点力气。有几个地方可能找得到他，可只有我知道。我是个穷女人，偏偏连上路的钱都没有。
        - id: ch04-b07
          speaker: messenger
          text: 钱不是问题！这里有一千枚金币，您随便用。只要告诉我能在哪里找到他，我再给您一千枚。
        - id: ch04-b08
          speaker: mother
          text: 好，那就说定了。我得先去做些准备。最多过几天，您一定能得到我的消息。
        - id: ch04-b09
          speaker: narrator
          text: 将近一个星期，母子俩都十分小心，一定要等到天黑才出门，免得被任何邻居瞧见。屋里连火也不生，灯也不点，大家便以为小屋已经没人了。终于，一个晴朗的早晨，年轻人早早起床，穿好衣裳，戴上自己最好的头巾，匆匆吃完饭，动身去王宫。
        - id: ch04-b10
          speaker: narrator
          text: 门前那个高大的黑人显然正在等他，没说一句话便把他放了进去。另一名侍从已经候在里面，直接领他去见苏丹。苏丹见到他，显得十分高兴。
        - id: ch04-b11
          speaker: sultan
          text: 啊，孩子！这么久以来，你到底躲到哪里去了？
        - id: ch04-b12
          speaker: young_man
          text: 苏丹，我明明已经凭本事赢得您的女儿，您却背弃诺言，不肯把她嫁给我。我连自己的家也不愿再待，只好出门流浪，走遍世界。如今您既然后悔失信，我便回来迎娶本来就该属于我的妻子。请您吩咐维齐尔准备婚约。
    - id: ch05
      title: 新郎归位
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 一份新的婚约备好了。照年轻人的要求，苏丹和维齐尔就在会面的房间里签了字。接着，他请苏丹带自己去见公主。两人一同走进大殿。里面每个人都还站在原处，跟咒语响起的那一刻分毫不差。
        - id: ch05-b02
          speaker: sultan
          text: 你能把咒语解开吗？
        - id: ch05-b03
          speaker: young_man
          text: 我想能。
        - id: ch05-b04
          speaker: narrator
          text: 其实，年轻人自己也不敢完全肯定，心里多少有一点不安。但他还是走上前去，高声喊了起来。
        - id: ch05-b05
          speaker: young_man
          text: 所有中了马德申咒语的人，现在都自由吧！
        - id: ch05-b06
          speaker: narrator
          text: 话音刚落，刚才还像雕像一样站着的人全都恢复了生命。公主满心欢喜，把自己的手放进新郎手中。至于先前那个新郎，他却消失得无影无踪，从此再也没有人知道他的下落。
