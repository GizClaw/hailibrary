audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    king:
      display_name: 国王
      tts:
        delivery: 温和克制，烦恼时迟疑，决断时严肃坚定
        timbre: 沉稳清晰的成年男声
        pace: 适中
        pitch: 中低
    citizen_1:
      display_name: 城中老人
      tts:
        delivery: 忠诚恳切，忧虑时沉重
        timbre: 苍老浑厚的男声
        pace: 稍缓
        pitch: 低
    citizen_2:
      display_name: 城中妇人
      tts:
        delivery: 真挚急切，忧心忡忡
        timbre: 清晰柔和的成年女声
        pace: 适中
        pitch: 中
    citizen_3:
      display_name: 城中青年
      tts:
        delivery: 坦率热切，情绪外露
        timbre: 明亮有力的年轻男声
        pace: 稍快
        pitch: 中
    zoulvisia:
      display_name: 祖尔维西娅
      tts:
        delivery: 骄傲果决，温柔时坦率明亮
        timbre: 清亮而有力量的年轻女声
        pace: 适中
        pitch: 中高
    fairy_son_1:
      display_name: 仙女的长子
      tts:
        delivery: 热心勇敢，遇到危险时果断
        timbre: 稳健清晰的年轻男声
        pace: 适中
        pitch: 中
    fairy_son_2:
      display_name: 仙女的次子
      tts:
        delivery: 友善诚恳，反应敏捷
        timbre: 明朗轻快的年轻男声
        pace: 稍快
        pitch: 中高
    fairy_son_3:
      display_name: 仙女的幼子
      tts:
        delivery: 热情直率，紧张时语气急促
        timbre: 清脆活泼的少年男声
        pace: 稍快
        pitch: 高
    old_prisoner:
      display_name: 坑底老人
      tts:
        delivery: 饱经苦难，警醒而充满怨愤
        timbre: 沙哑低沉的老年男声
        pace: 稍缓
        pitch: 低
    chamberlain:
      display_name: 内务总管
      tts:
        delivery: 精明威严，许诺时干脆
        timbre: 圆润厚实的成年男声
        pace: 适中
        pitch: 中低
    witch:
      display_name: 老女巫
      tts:
        delivery: 狡猾善变，伪装时可怜温顺，得意时冷酷
        timbre: 干涩而富于变化的老年女声
        pace: 适中
        pitch: 中低
    maid:
      display_name: 侍女
      tts:
        delivery: 天真活泼，容易受新奇事物吸引
        timbre: 轻快清亮的年轻女声
        pace: 稍快
        pitch: 中高
    cottage_woman:
      display_name: 小屋老妇人
      tts:
        delivery: 健谈爽直，谈价钱时精明实际
        timbre: 温暖朴实的老年女声
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 魔山与最后的王子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "在亚洲某处的沙漠中央，耸立着一座高山，满山都是美丽的树木。阳光照在树丛间，一道道瀑布翻着白色水花，闪闪发亮。旅人看惯了漫漫黄沙，忽然望见这样的景象，眼睛也像得到了休息。那里的空气澄澈而安静，隔着老远，还能听见鸟儿歌唱，闻见花朵的香气。山上东一处西一处散落着白色帐篷，显然住着人。可是，前往巴比伦或巴勒贝克的国王和王子，谁也不敢闯进那片森林。真有人进去，也从来没有回来。山的恶名叫人怕到了极点。父亲临终时，总会请求儿子千万别去探究山里的秘密。可每年仍有几个年轻人执意上山，随后便杳无踪影。"
        - id: ch01-b02
          speaker: narrator
          text: "沙漠另一边有个强盛的国家。老国王临死前，也这样告诫自己的七个儿子。他刚去世，继承王位的长子便要去魔山打猎。老人们怎样劝也拦不住他。他去了，没有回来。二弟继位以后，也走了同一条路。后面五个兄弟一个接一个，全都如此。最后，最小的弟弟成了国王。他也宣布要上山打猎，整座城顿时哭声四起。"
        - id: ch01-b03
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: "您这一去准会送命！您死以后，谁来统治我们？留下来吧，我们一定让您过得幸福。"
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: "国王暂时听从了大家的哀求。国家在他的治理下越来越富庶。可是几年以后，那股不安分的冲动又抓住了他。这一次，他谁的话也不听，召集朋友和侍从，在一个早晨穿过沙漠，直奔那片森林。"
        - id: ch01-b05
          speaker: narrator
          text: "一行人骑进岩石遍布的山谷，一头鹿突然从面前蹿出。国王立刻纵马追去，侍从们紧跟在后。鹿跑得太快，众人始终追不上，最后看着它消失在森林深处。国王这才第一次勒住马，向四周望去。他已经把同伴远远甩开，回头只见他们正在走进林间散落的几顶帐篷。再美味的食物，也比不上树林里的清新凉爽。国王没有过去，只随着兴致四处漫步，一逛就是好几个钟头。"
        - id: ch01-b06
          speaker: narrator
          text: "天快黑了，他才依依不舍地走出森林，准备叫大家回宫。可到了帐篷前，他发现手下横七竖八倒了一地。有些已经死了，有些只剩最后一口气。没人还能开口，可事情再明白不过，他们喝的酒里有致命的毒药。"
        - id: ch01-b07
          speaker: king
          text: "我来晚了，救不了你们了，我可怜的朋友。可我至少能替你们报仇。设下圈套的人一定会回来查看，我要藏起来，看看他们究竟是谁。"
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: "国王爬上一棵高大的胡桃树。黑夜降临，四下一片寂静。天边刚刚泛白，一阵急促的马蹄声便传了过来。他拨开树枝，看见一个骑白马的少年。骑手下马检查尸体，又把他们一个个拖到附近的峡谷，扔进谷底的湖中。仆人牵走死者的马，随从重新放出那头充当诱饵的鹿，还把帐篷里的食物和酒摆回原样。"
        - id: ch01-b09
          speaker: narrator
          text: "骑手安排完一切，缓缓走进森林，却在灌木深处发现一匹藏起来的骏马。"
        - id: ch01-b10
          speaker: zoulvisia
          text: "每个死人都有一匹马。那么，这一匹是谁的？"
        - id: ch01-b11
          speaker: king
          text: "我的！你把人诱进圈套，再下毒害死他们，到底是什么人？你以后别想再这样作恶。回你家去，不管那地方在哪里，我们就在你家门前决斗！"
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: "骑手气得半晌说不出话，最后才勉强开口。"
        - id: ch01-b13
          speaker: zoulvisia
          text: "我接受挑战。上马跟我来。我就是祖尔维西娅。"
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: "她跃上马背，快得叫国王连追赶的机会也没有，转眼就没了踪影。国王只来得及看清，她和坐骑身上仿佛有光芒流淌，头盔下面的长发就像流动的金子。到了这时，他才明白那个骑手原来是个女子。可她到底是谁？她是统领所有王后的女王，还是一伙强盗的首领？其实都不是。她只是一位美丽的少女。"
    - id: ch02
      title: 水晶塔上的较量
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "马和骑手早已消失，国王还站在胡桃树下，猜想着祖尔维西娅究竟是谁。过了许久，他猛然回过神来，记起自己还得找到仇人的住处。可那地方在哪里，他一点头绪也没有。最后，他沿着祖尔维西娅来时的路走去。走了好几个钟头，眼前终于出现三间并排的小屋。每间屋里都住着一位老仙女和她的儿子们。国王又累又饿，几乎说不出话。喝过一些牛奶，又休息片刻，他才有力气回答众人急切的询问。"
        - id: ch02-b02
          speaker: king
          text: "我要去找祖尔维西娅。她杀了我的兄长，也杀了许多臣民，我一定要替他们报仇。"
        - id: ch02-b03
          speakers: [fairy_son_1, fairy_son_2, fairy_son_3]
          ensemble: chorus
          text: "早知道就好了！她今天两次从门前经过，我们本来可以扣住她。"
        - id: ch02-b04
          speaker: narrator
          text: "话说得勇敢，他们心里却怕得发抖。"
        - id: ch02-b05
          speakers: [fairy_son_1, fairy_son_2, fairy_son_3]
          ensemble: chorus
          text: "别再找祖尔维西娅了，留下来吧。你做我们的哥哥，我们做你的弟弟。"
        - id: ch02-b06
          speaker: narrator
          text: "国王不肯。他拿出剪刀、剃刀和镜子，交给三位老仙女每人一样。"
        - id: ch02-b07
          speaker: king
          text: "我不能放弃复仇，但愿意接受你们的友情。这三件东西留作信物。哪一件表面出现鲜血，就说明我的性命危在旦夕。看在我们结拜的情分上，请赶来救我。"
        - id: ch02-b08
          speakers: [fairy_son_1, fairy_son_2, fairy_son_3]
          ensemble: chorus
          text: "我们一定来。"
        - id: ch02-b09
          speaker: narrator
          text: "国王骑上马，沿着他们所指的路继续前进。不久，月光下出现一座华美的宫殿。他绕着宫墙骑了两圈，竟找不到一扇门。正想着下一步该怎么办，一阵响亮的鼾声忽然从脚下传来。国王低头一看，宫墙外有个深坑，一位老人正躺在坑底，身旁放着一盏灯。国王心想，也许老人能替自己出个主意。他费了好大力气才爬进坑里，伸手搭在睡觉那人的肩上，把他唤醒。"
        - id: ch02-b10
          speaker: old_prisoner
          text: "你是鸟还是蛇？要不然，怎么进得了这里？"
          emotion: surprised
        - id: ch02-b11
          speaker: king
          text: "我只是一个凡人。我来找祖尔维西娅。"
        - id: ch02-b12
          speaker: old_prisoner
          text: "祖尔维西娅？那个世间的祸害？她杀了成千上万的人，只有我逃过一死。她为什么饶了我，却让我活着受这份罪？我怎么也想不明白。"
          emotion: angry
        - id: ch02-b13
          speaker: king
          text: "如果你有办法，请帮帮我。"
        - id: ch02-b14
          speaker: narrator
          text: "国王把自己的经历全告诉了老人。老人专心听完，终于说道。"
        - id: ch02-b15
          speaker: old_prisoner
          text: "你要牢牢记住我的话。每天太阳升起，祖尔维西娅都会穿上珍珠短衣，登上水晶瞭望塔。她站在那里，能看遍自己的领地。无论闯进来的是人还是魔鬼，都逃不过她的眼睛。只要发现一个，她就会发出可怕的尖叫，听见的人都会活活吓死。你躲进塔脚附近的山洞，在洞前插一根分叉的树枝。等她叫过三声，就大胆走出来，抬头看着塔顶。别害怕，那时她的法力已经被你破了。"
        - id: ch02-b16
          speaker: narrator
          text: "国王一字不差地照做了。他从山洞出来时，两人的目光正好相遇。"
        - id: ch02-b17
          speaker: zoulvisia
          text: "你战胜了我。你是第一个听见我的声音却没有死去的男人，配做我的丈夫。"
        - id: ch02-b18
          speaker: narrator
          text: "祖尔维西娅放下金色长发，那头长发就像一根从塔顶垂落的绳索。她用它把国王一直拉上塔顶，又领他走进觐见大厅，把他介绍给宫里所有的人。后来，两人离开大厅，并肩坐在溪水旁长满青苔的岸边。祖尔维西娅望着国王，脸上带着微笑。"
        - id: ch02-b19
          speaker: zoulvisia
          text: "你想要什么，只管告诉我。我都会答应。"
        - id: ch02-b20
          speaker: narrator
          text: "国王只求她释放那位救命恩人，送老人返回故乡。"
    - id: ch03
      title: 漂走的珍珠匣
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "结婚那天，祖尔维西娅对丈夫说起今后的生活。"
        - id: ch03-b02
          speaker: zoulvisia
          text: "我不再打猎，也不再骑马巡视领地了。从今以后，养活我们大家就是你的责任。"
        - id: ch03-b03
          speaker: narrator
          text: "她叫侍从牵来火焰神马。"
        - id: ch03-b04
          speaker: zoulvisia
          text: "我的火焰神马，这就是你今后的主人。你从前怎样侍奉我，以后就怎样侍奉他。"
        - id: ch03-b05
          speaker: narrator
          text: "她吻了吻马儿双眼之间，把缰绳递给丈夫。马儿打量年轻人片刻，随后低下了头。国王拍拍它的脖颈，又把尾毛轻轻理顺。一人一马还没出发，便已经觉得彼此像多年的老朋友。随后，国王跨上马背，准备照祖尔维西娅的吩咐去打猎。临行以前，她又送给他一只珍珠匣，里面珍藏着她的一根头发。国王接过匣子，小心地塞进上衣胸襟。"
        - id: ch03-b06
          speaker: narrator
          text: "他骑了许久，始终没找到能带回去做晚餐的猎物。突然，一头漂亮的雄鹿贴着马蹄蹿出来。国王立刻追去。雄鹿左躲右闪，不给他瞄准的机会。到了宽阔的河边，鹿跳进水中，朝对岸游去。国王给弩装上箭，射伤了它，可鹿还是爬上了对岸。他只顾追猎，没有发现珍珠匣已经落进河里。"
        - id: ch03-b07
          speaker: narrator
          text: "河水又深又急，匣子被水卷着向前，一英里、一英里，又一英里，不知道漂了多远，最后被冲到另一个国家。王宫里的一名挑水夫捡到它，拿去献给国王。匣子的手艺实在奇巧，上面的珍珠也罕见极了。国王越看越舍不得放手，便付给挑水夫一大笔钱，将他打发走。接着，他召来内务总管，命令对方三天之内查清匣子的来历。如果查不出来，就要丢掉脑袋。"
        - id: ch03-b08
          speaker: narrator
          text: "魔法师和智者全被难倒了。最后，一个老妇人来到王宫，声称只要两捧金子，就能解开谜团。内务总管赶紧付了钱。老妇人告诉他，匣子和头发都属于祖尔维西娅。"
        - id: ch03-b09
          speaker: chamberlain
          text: "老太婆，把祖尔维西娅带来，我就给你多得能把你埋起来的金子。"
        - id: ch03-b10
          speaker: witch
          text: "我会试试看。"
        - id: ch03-b11
          speaker: narrator
          text: "老妇人回到森林中央的小屋，站在门口轻轻吹了声口哨。地上的枯叶动了起来，窸窣作响。一长队蛇从叶子下面钻出，扭动着爬到她脚边。原来她是个女巫。她弯下腰，拍拍蛇的脑袋，又拿出一只红陶盆，让每条蛇都喝了些牛奶。蛇群全都喝完以后，她再次吹响口哨，让两三条蛇盘在自己的手臂和脖子上。她把另一条蛇变成手杖，又把一条变成鞭子。接着，她拿起一根木棍走到河边，将它变成木筏。女巫舒舒服服地坐上去，把木筏撑向河心。"
        - id: ch03-b12
          speaker: narrator
          text: "女巫顺水漂了一整天，接着又在河上漂过一整夜。直到第二天傍晚，太阳快要落山时，她才来到祖尔维西娅的花园附近。就在这个时候，年轻的国王骑着火焰神马，从外面打猎回来。"
        - id: ch03-b13
          speaker: king
          text: "你是谁？这里可没人坐着木筏旅行。你到这儿来做什么？"
          emotion: surprised
        - id: ch03-b14
          speaker: witch
          text: "孩子，我只是个可怜的朝圣者。我没赶上商队，饿着肚子在沙漠里走了许多天，才来到河边。我找到这只小木筏，就把性命交给它，不知道自己会活还是会死。既然遇见了你，求你给我一点面包，再让我今晚睡在你家看门狗旁边吧。"
          emotion: sad
        - id: ch03-b15
          speaker: narrator
          text: "这番话打动了国王。他答应给老妇人食物，也准她进宫过夜。"
        - id: ch03-b16
          speaker: king
          text: "好心的婆婆，坐到我身后吧。你走了这么远，离宫殿却还有好长一段路。"
        - id: ch03-b17
          speaker: narrator
          text: "国王从马背上弯下身，伸手去扶她。可老妇人刚要靠近，马儿便猛地闪到一旁。国王又试了第二次，马儿仍不肯让她上来。试到第三次，情形还是一样。老女巫已经猜出了缘故，国王却丝毫不明白。"
        - id: ch03-b18
          speaker: witch
          text: "我怕自己从马上掉下来。你这样好心，就请骑慢一点吧。我虽然腿脚不便，应该还能跟得上。"
    - id: ch04
      title: 女巫的圈套
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "到了宫门前，国王让老妇人歇着，自己去拿她需要的东西。祖尔维西娅得知丈夫带回什么人，脸色顿时苍白。她恳求国王给老妇人一些食物，马上将她送走，因为这个人会给他们带来灾祸。国王却笑了。"
        - id: ch04-b02
          speaker: king
          text: "听你这么说，别人会以为她是个女巫。就算她真是女巫，又能伤害我们什么？"
        - id: ch04-b03
          speaker: narrator
          text: "国王唤来侍女，吩咐她们给老妇人送去食物，还让老妇人睡在她们房里。女巫十分狡猾。那天晚上，她一个接一个地讲着种种古怪故事，害得姑娘们大半夜都没睡。第二天早晨，侍女们正在替女主人梳妆，其中一个忽然想起昨晚的故事，忍不住笑出声来，其他人也全跟着笑了。"
        - id: ch04-b04
          speaker: zoulvisia
          text: "你们怎么了？"
        - id: ch04-b05
          speaker: maid
          text: "我想起了新来的婆婆昨晚讲的滑稽故事。夫人，别人都说她是女巫，她也许真是，可我敢肯定，她绝不会施法伤害一只苍蝇！老爷不在的时候，有她讲故事，您也不会觉得无聊了。"
          emotion: happy
        - id: ch04-b06
          speaker: narrator
          text: "祖尔维西娅偏偏在这个不祥的时刻同意接见女巫。从那以后，两人几乎形影不离。一天，女巫谈起年轻的国王，说自己走过许多国家，从没见过像他这样的人。"
        - id: ch04-b07
          speaker: witch
          text: "他能猜中您的秘密，赢得您的心，真是聪明。那么，他当然也把自己的秘密告诉您了吧？"
        - id: ch04-b08
          speaker: zoulvisia
          text: "没有。我想，他根本没什么秘密。"
        - id: ch04-b09
          speaker: witch
          text: "没有秘密？胡说！每个男人都有秘密，而且一定会说给自己心爱的女人听。他要是没告诉您，那就是根本不爱您！"
        - id: ch04-b10
          speaker: narrator
          text: "祖尔维西娅听了十分不安，却不肯向女巫承认。下一次和丈夫独处时，她便软语央求，要他说明力量究竟藏在哪里。国王哄了她许久，总想把事情搪塞过去。可她不肯罢休，国王最后只好回答。"
        - id: ch04-b11
          speaker: king
          text: "我的力量来自这柄弯刀。白天黑夜，它都放在我身边。现在我把秘密告诉你，你得对这枚戒指发誓，绝不让别人知道。我把戒指送给你，换你的那一枚。"
        - id: ch04-b12
          speaker: narrator
          text: "祖尔维西娅对着戒指发了誓，却一转身就赶去找女巫，把这个重大的秘密全说了出来。四天后的深夜，所有人都已经沉入梦乡。女巫轻手轻脚地溜进国王的寝宫。国王还在熟睡，弯刀就放在身旁。她悄悄拿起刀，推开花格窗，飞到外面的露台上，再将弯刀投入宫墙下的河里。"
        - id: ch04-b13
          speaker: narrator
          text: "第二天早晨，人人都很奇怪，国王没有像往常一样早早起身，出去打猎。侍从们贴着锁孔听，只听见沉重的喘息声，却没有一个人敢进去。最后，祖尔维西娅推开众人，闯入房中。眼前的景象叫他们吓呆了。国王躺在那里，已经奄奄一息，嘴边冒着白沫，双眼也早已闭上。大家流着泪，一声声呼唤他，却始终得不到任何回应。"
        - id: ch04-b14
          speaker: narrator
          text: "后面的人突然尖叫起来。女巫大步走进房间，脖子、手臂和头发上全缠着蛇。她打个手势，蛇群便嘶叫着扑向侍女，毒牙刺进她们的皮肉。随后，女巫转向祖尔维西娅。"
        - id: ch04-b15
          speaker: witch
          text: "你自己选。跟我走，还是让这些蛇也把你咬死？"
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: "祖尔维西娅惊恐地瞪着女巫，连一个字也说不出来。女巫一把抓住她的手臂，将她拖出宫殿，带到河边。那只木筏正藏在茂密的芦苇丛中。两人都上了木筏，女巫拿起桨，沿着河水一路漂向下游。木筏最后抵达邻国。到了那里，女巫把祖尔维西娅卖给当地的国王，换来满满一袋黄金。"
    - id: ch05
      title: 河中的弯刀
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "自从年轻的国王走进森林里的三间小屋，仙女的儿子们每天早晨都要查看他留下的剪刀、剃刀和镜子，一天也没有间断。三件东西的表面一直明亮洁净，从来不曾黯淡。可就在这天早晨，他们像往常一样把信物取出来，剃刀和剪刀上竟冒出一滴滴鲜血，小镜子也失去了光亮，蒙上了一层阴影。"
        - id: ch05-b02
          speakers: [fairy_son_1, fairy_son_2, fairy_son_3]
          ensemble: chorus
          text: "小弟弟一定遇上了可怕的灾祸。我们得赶快救他，迟了就来不及了。"
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: "他们立刻穿上魔法拖鞋，赶往宫殿。仆人急忙迎上来，恨不得把知道的一切都告诉他们，可大家知道的实在不多，只能说国王的弯刀失踪了，却没人清楚它去了哪里。仙女的儿子们找了整整一天，仍旧一无所获。夜幕落下时，众人已经又累又饿。国王那天没有出去打猎，宫里什么吃的也没有。几个小个子正在绝望，一缕月光忽然照亮了宫墙下面的河水。"
        - id: ch05-b04
          speakers: [fairy_son_1, fairy_son_2, fairy_son_3]
          ensemble: chorus
          text: "我们真笨！河里当然有鱼可捉。"
        - id: ch05-b05
          speaker: narrator
          text: "他们跑到岸边，很快捞上几条肥鱼，就地烤熟吃了。填饱肚子以后，众人开始查看四周。河心突然响起古怪的扑腾声。一条大鱼露出水面，痛苦地翻来扭去。兄弟们正盯着它，大鱼忽然跃起，一道亮光划破黑夜。"
        - id: ch05-b06
          speakers: [fairy_son_1, fairy_son_2, fairy_son_3]
          ensemble: chorus
          text: "是弯刀！"
          emotion: surprised
        - id: ch05-b07
          speaker: narrator
          text: "他们纷纷跳进水中，抓住刀柄猛地一扯，从鱼身上拔出了弯刀。大鱼已经筋疲力尽，浮在水面，再也挣扎不动。兄弟们带着弯刀游回岸边，用自己的衣服仔细擦干刀身。随后，他们把刀送进宫里，轻轻放到国王的枕头上。就在那一瞬间，国王蜡白的脸恢复了血色，凹陷的双颊也重新饱满起来。他坐起身，慢慢睁开眼睛，开口只问了一件事。"
        - id: ch05-b08
          speaker: king
          text: "祖尔维西娅在哪里？"
        - id: ch05-b09
          speakers: [fairy_son_1, fairy_son_2, fairy_son_3]
          ensemble: chorus
          text: "我们也不知道。不过你已经得救，很快就能查到她在哪里。"
        - id: ch05-b10
          speaker: narrator
          text: "他们把祖尔维西娅泄露秘密以后发生的一切告诉了国王。"
        - id: ch05-b11
          speaker: king
          text: "带我去见我的马。"
        - id: ch05-b12
          speaker: narrator
          text: "国王走进马厩，看见心爱的坐骑，几乎掉下泪来。马儿的模样和主人刚才一样悲惨，虚弱得仿佛也快要死去。马厩的门在轴上转动，发出声响，它才有气无力地抬起头来。可当它看清来人是国王，便挣扎着站起身，把脑袋紧紧贴在主人身上磨蹭。"
        - id: ch05-b13
          speaker: king
          text: "我可怜的马儿，你比我聪明多了！要是我当初也像你一样明白，就不会失去祖尔维西娅。不过，我们会一起去找她，就你和我。"
          emotion: sad
    - id: ch06
      title: 戒指送来的消息
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "国王骑着马，沿着河水流去的方向走了很久，却无论到哪里都打听不到祖尔维西娅的消息。一天傍晚，他们在一座大城附近的小屋旁停下休息。国王舒展四肢躺在草地上，懒洋洋地看着马儿啃食短短的青草。一个老妇人从屋里走出来，手中端着一只盛满鲜奶的木碗，递给了他。国王渴得厉害，一口气喝完牛奶，放下木碗，便和她聊了起来。难得有人愿意听自己说话，老妇人高兴极了，立刻说个不停。"
        - id: ch06-b02
          speaker: cottage_woman
          text: "你这时候经过，运气真不错。再过五天，国王就要举行婚宴了。可那位蓝眼睛、金头发的新娘一点也不情愿。她身边总放着一杯毒药，说自己宁可喝下去，也不嫁给国王。国王又英俊，又适合做她的丈夫。她不知从哪里流落过来，还是国王从女巫手里买下的，能有这样的归宿，原本已经——"
        - id: ch06-b03
          speaker: narrator
          text: "国王猛然一惊。难道终于找到她了？他的心跳得几乎堵住喉咙，只能喘息着问。"
        - id: ch06-b04
          speaker: king
          text: "她叫祖尔维西娅吗？"
        - id: ch06-b05
          speaker: cottage_woman
          text: "是啊，她自己这样说。不过那个老女巫——咦，你怎么了？"
          emotion: surprised
        - id: ch06-b06
          speaker: narrator
          text: "年轻人跳起来，抓住了老妇人的手腕。"
        - id: ch06-b07
          speaker: king
          text: "听我说。你能保守秘密吗？"
        - id: ch06-b08
          speaker: cottage_woman
          text: "能，只要有人付钱。"
        - id: ch06-b09
          speaker: king
          text: "钱一定少不了你的。你想要多少，就能得到多少。这里先给你一把金子。照我的吩咐办好，我再给你同样多。"
        - id: ch06-b10
          speaker: narrator
          text: "老妇人点了点头。"
        - id: ch06-b11
          speaker: king
          text: "去买一套宫廷贵妇穿的衣裳，再想办法进入王宫，见到祖尔维西娅。到了她面前，就把这枚戒指给她看。之后该怎么办，她会告诉你。"
        - id: ch06-b12
          speaker: narrator
          text: "老妇人随即动身，买来一套宫廷贵妇穿的黄绸衣裳，又用面纱严严实实裹住头。当地国王正好召了几个商人进宫，要他们给祖尔维西娅送礼。老妇人便混在商人身后，穿着这身衣裳，大胆登上王宫台阶。起初，新娘根本不肯理睬任何人。可她忽然看见那枚戒指，立刻温顺得像只小羊。她向商人道过辛苦，把他们全打发走，只把带戒指的老妇人留在房中。等门稳稳关好，她立刻问道。"
        - id: ch06-b13
          speaker: zoulvisia
          text: "婆婆，这枚戒指的主人在哪里？"
        - id: ch06-b14
          speaker: cottage_woman
          text: "在我的小屋里，正等着你吩咐。"
        - id: ch06-b15
          speaker: zoulvisia
          text: "叫他在那里等三天。你现在去告诉这个国家的国王，就说已经劝得我回心转意。这样，他会让我独处，不再盯着我。第三天，我会到临河的花园里散步。你的客人会在那里找到我。余下的事，只与我自己有关。"
    - id: ch07
      title: 火焰神马归来
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: "第三天早晨终于来了。第一缕阳光刚刚照下，宫中就忙乱起来，因为国王将在当天晚上迎娶祖尔维西娅。人们支起一座座精美的猩红帐篷，用芬芳的白花环装点，再把丰盛的婚宴摆在里面。一切准备妥当，迎接新娘的队伍便排成长列，向花园出发。祖尔维西娅从天亮起就在御花园里四处闲逛。人群沿着道路挤得密密麻麻，大家都伸长脖子，等着看她从眼前经过。她从一丛开花的灌木走向另一丛，身上的金纱裙在花木之间时隐时现。"
        - id: ch07-b02
          speaker: narrator
          text: "忽然，人群一阵摇晃，挤在道路两旁的人纷纷向后退去。大家只见一道亮光仿佛霹雳，从天空直落到祖尔维西娅站立的地方。啊，那并不是什么霹雳，只是飞驰而来的火焰神马！等惊慌的人群重新站稳，再定睛看去，它已经驮着两个人奔向远方，转眼就要消失了。"
        - id: ch07-b03
          speaker: narrator
          text: "祖尔维西娅和丈夫终于都学会了，得到幸福以后，该怎样把它一直好好地留在身边。许许多多男人和女人一辈子也学不会这一课。况且，这件事谁也教不了，每个男孩和女孩都得靠自己领悟。"
        - id: ch07-b04
          speaker: narrator
          text: "这个故事选自弗雷德里克·马克莱的《亚美尼亚故事集》。"
