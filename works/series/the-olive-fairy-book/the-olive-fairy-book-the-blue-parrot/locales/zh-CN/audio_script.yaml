audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    lino:
      display_name: 利诺国王
      tts:
        delivery: 有礼而真挚，遭难时坚定克制
        timbre: 清朗温润的青年男声
        pace: 适中
        pitch: 中
    ambassador:
      display_name: 大使
      tts:
        delivery: 圆融老练，措辞谨慎而暗含机锋
        timbre: 沉稳清晰的成年男声
        pace: 适中偏慢
        pitch: 中低
    ismenor:
      display_name: 伊斯梅诺
      tts:
        delivery: 阴沉强硬，得意时透出冷酷
        timbre: 粗粝低沉的成年男声
        pace: 适中偏慢
        pitch: 低
    rabot:
      display_name: 拉博
      tts:
        delivery: 粗鲁自大，命令脱口而出
        timbre: 沙哑厚重的成年男声
        pace: 偏快
        pitch: 中低
    steward:
      display_name: 管事
      tts:
        delivery: 恭敬谨慎，受惊时略显迟疑
        timbre: 平实清楚的成年男声
        pace: 适中
        pitch: 中
    swan_fairy:
      display_name: 天鹅仙女
      tts:
        delivery: 高贵沉着，危急时果断坚韧
        timbre: 明净端庄的成年女声
        pace: 舒缓
        pitch: 中
    hermosa:
      display_name: 赫尔莫萨公主
      tts:
        delivery: 温柔敏锐，悲伤中仍有勇气
        timbre: 清澈柔和的年轻女声
        pace: 适中
        pitch: 中高
    chamberlain:
      display_name: 宫务大臣
      tts:
        delivery: 忠诚持重，忧虑时仍恪守礼节
        timbre: 稳重清晰的成年男声
        pace: 适中偏慢
        pitch: 中低
    riquette:
      display_name: 里凯特
      tts:
        delivery: 任性热烈，恼怒时尖刻急促
        timbre: 浓重而略显尖锐的年轻女声
        pace: 适中偏快
        pitch: 中高
    wizard:
      display_name: 老巫师
      tts:
        delivery: 深思熟虑，施法时从容笃定
        timbre: 苍老醇厚的男声
        pace: 舒缓
        pitch: 低
    grenadine:
      display_name: 格勒纳丁
      tts:
        delivery: 活泼亲切，好奇中带着温柔
        timbre: 明亮柔美的年轻女声
        pace: 适中偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 画像中的公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 阿拉伯有一片土地，棕榈成林，香花遍野。旅人在烈日下辛苦跋涉许久，到了这里，总能找到阴凉，好好歇一歇脚。统治这片土地的，是十九岁的利诺国王。他的父亲刚刚去世。利诺从小看着父亲贤明治国，并不觉得自己年轻聪明，就非得把所有旧法都改掉，好向众人炫耀本领。那些法律让百姓安乐，让国家富足，他便安心继续沿用。臣民提起这位年轻国王，只有一桩不满。大家一再恳求他早日成婚，他却像是完全不着急。
        - id: ch01-b02
          speaker: narrator
          text: 邻国由天鹅仙女统治。她的独生女赫尔莫萨公主，和利诺一样迷人。仙女常年派一位大使驻在利诺的宫廷。大使听见百姓抱怨国王迟迟不婚，心里有了主意。
        - id: ch01-b03
          speaker: ambassador
          text: 世上要是有人配得上赫尔莫萨公主，那个人一定就在这里。不管成不成，我总可以试着让他们见上一面。
        - id: ch01-b04
          speaker: narrator
          text: 公主当然不能主动送上门求婚。大使得想个办法，在不露痕迹的情况下打动毫不知情的国王，让求婚的话从利诺自己嘴里说出来。他深知宫廷里的门道，也知道利诺喜欢绘画。他先陪国王谈过几次画艺，等时机成熟，又慢慢把话题转到肖像上，像是不经意地提起，本国公主最近刚画了一幅极好的画像。
        - id: ch01-b05
          speaker: ambassador
          text: 不过，要说画得像，恐怕还是这幅小像更好些。这是去年画的。
        - id: ch01-b06
          speaker: narrator
          text: 国王接过去，仔细看了又看。
        - id: ch01-b07
          speaker: lino
          text: 这一定把人画美了。世上怎么可能有这样惊人的美人？
          emotion: surprised
        - id: ch01-b08
          speaker: ambassador
          text: 陛下要是能亲眼看看她就好了。
        - id: ch01-b09
          speaker: narrator
          text: 利诺没有回答。第二天一早，大使便奉召进宫。他一点也不意外。门还没关严，国王已经急着开了口。
        - id: ch01-b10
          speaker: lino
          text: 自从看过那幅小像，公主的面容就一直留在我心里，怎么也忘不掉。我准备派特使去见天鹅仙女，向她的女儿求婚。
        - id: ch01-b11
          speaker: ambassador
          text: 这样重大的事，我自然不能替女主人作主。不过我知道，她听到陛下的请求，一定十分欣喜。
        - id: ch01-b12
          speaker: narrator
          text: 大使捋着胡须，把满心的得意藏了起来。利诺却已经喜上眉梢。
        - id: ch01-b13
          speaker: lino
          text: 那就不必派特使了。我亲自去，你也同我一道。三天之内准备妥当，我们马上出发。
          emotion: happy
    - id: ch02
      title: 冒牌国王
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可利诺的另一个邻国，住着法力强大的伊斯梅诺。他既是魔法师，也是狮子岛的国王。他有个奇丑无比的女儿里凯特，在他眼里却是世上最美的姑娘。里凯特也爱上了画像里的人。那个人正是利诺。她求父亲把利诺给自己做丈夫。伊斯梅诺觉得天下男人都配不上女儿，本来还在犹豫。等他终于准备派首相去说亲，却听说利诺已经赶往天鹅仙女的宫廷。
        - id: ch02-b02
          speaker: narrator
          text: 里凯特悲痛欲绝，求父亲无论如何也要阻止这桩婚事。伊斯梅诺答应了。他叫来一个名叫拉博的丑陋驼背小矮人，念动咒语，转眼便把两人送到一座遍布岩石的山谷。利诺和护卫赶往天鹅仙女的宫廷，一定会经过那里。马蹄声越来越近，伊斯梅诺拿出一方魔法手帕。任何人只要碰着它，身形就会消失。他让拉博握住一端，自己抓着另一端。两人隐身穿行在骑手和马匹之间，四处搜寻，却没有发现国王的踪影。
        - id: ch02-b03
          speaker: narrator
          text: 原来，利诺连日来又激动又疲倦，已经累得筋疲力尽。他叫那些满载着公主礼物的沉重马车先走，自己和几个朋友留在棕榈树下休息。伊斯梅诺在那里发现了他们，人人都睡得正沉。魔法师先下了一道咒语，在他愿意解除以前，谁也别想醒来。随后，他脱光利诺的衣服，给国王换上拉博那身又脏又旧的衣裳。接着，他用戒指碰了碰拉博。
        - id: ch02-b04
          speaker: ismenor
          text: 变成利诺的模样，直到你娶到天鹅仙女的女儿。
        - id: ch02-b05
          speaker: narrator
          text: 魔法实在太强，拉博竟真的相信自己就是国王。他跨上利诺的马，转眼便走远了。伊斯梅诺这才叫醒利诺。年轻国王看见身上的脏衣服，惊得说不出话。还没等他弄清发生了什么，魔法师便用云团卷起他，送到了女儿手中。
        - id: ch02-b06
          speaker: narrator
          text: 拉博赶上大队人马，谁也没有认出这个冒牌货。他一开口便说饿了，命人马上送吃的来。
        - id: ch02-b07
          speaker: steward
          text: 陛下，帐篷还没搭好。晚餐至少要一个钟头才能送来。
        - id: ch02-b08
          speaker: rabot
          text: 谁准你自作主张了？蠢货！赶快给我弄马肉来，那才是天下最好吃的肉！
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: 管事几乎不敢相信自己的耳朵。利诺是天底下最有礼貌的人，怎么会这样辱骂一个忠心耿耿的老仆？更何况，他居然想吃马肉！国王口味一向精细，平日差不多只靠水果和糕点过活。可人会变成什么样，谁又能说得准？管事要想保住肩膀上的脑袋，只能马上服从。他一面去办事，一面暗暗猜测，也许国王只是为爱情发了疯。若真是这样，过些时候或许还能恢复正常。
        - id: ch02-b10
          speaker: narrator
          text: 老臣们一路替主人寻找借口，可等队伍抵达天鹅仙女的都城，马已经一匹也不剩，人人只好徒步走向王宫。他们心里诧异极了，脸上却不敢显露，只能装作国王原本就喜欢步行。他们甚至假装从自己的马上下来，请国王同他们一道走。没过多久，众人便看见天鹅仙女和女儿站在一座低矮的露台上等候。拉博走到露台下，停在她们面前。
        - id: ch02-b11
          speaker: rabot
          text: 夫人，我这样登门求娶您的女儿，您大概觉得很失礼。可路太远，我又饿了，只好吃掉自己的马。马肉是天下最好吃的肉，我也叫随从把他们的马吃了。不管怎样，我还是一位伟大的国王，也要做您的女婿。事情就算定下了。赫尔莫萨在哪儿？
        - id: ch02-b12
          speaker: swan_fairy
          text: 陛下，您手里有我女儿的画像。要是连她本人都认不出来，那幅画想必没给您留下多少印象。
        - id: ch02-b13
          speaker: narrator
          text: 王后又惊又恼。拉博却说自己不记得什么画像，也许画像还在口袋里。他当着侍女们的面浑身翻找，当然一无所获。搜完以后，他看向又羞又气的公主。
        - id: ch02-b14
          speaker: rabot
          text: 要是我要娶的人就是你，那你确实很漂亮。我真见过画像的话，一定会记得。婚礼越快越好。不过我现在要睡觉。你们这里和我的国家太不一样了。在石头和沙地上走了这么多天，我非得歇歇不可。
        - id: ch02-b15
          speaker: narrator
          text: 他不等回答，就叫侍童领自己回房。很快，他的鼾声响遍王宫，连城镇另一头都听得见。公主等他一走，立刻扑进母亲怀里哭了起来。十五天来，她天天看着利诺的画像，也一直带着大使的来信。信里满是对年轻国王风采的赞美。画像明明很像，为什么俊美的外表里会藏着这样粗野的灵魂？如果他还流露出一点爱慕，公主也许都能原谅。可是没有。天鹅仙女更是被这个女婿弄糊涂了，几乎说不出话。
        - id: ch02-b16
          speaker: narrator
          text: 就在这时，利诺的宫务大臣请求单独觐见王后。他怀疑主人突然疯了，或是中了什么魔法。
        - id: ch02-b17
          speaker: chamberlain
          text: 先前那些事已经让我十分惊疑。如今陛下连公主都认不出来，那幅从不离身的画像也不见了，我实在无法解释。夫人，您也许能查清楚，这个一向以礼貌闻名的国王，为何忽然变成了这样。
        - id: ch02-b18
          speaker: narrator
          text: 宫务大臣深深行礼，告退了。王后站在原地想了很久，忽然有了主意。她走进密室，从古老的箱子里取出一面小镜子。无论她想看什么，镜中都会如实显现。她现在最想看的，就是利诺真正的模样。
    - id: ch03
      title: 镜子揭开的骗局
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 宫务大臣果然说对了。躺在床上打呼噜、震得王宫发颤的家伙根本不是利诺。真正的年轻国王穿着脏衣服，被关在伊斯梅诺最坚固的一座高塔里。他手中还留着赫尔莫萨的画像，此刻正一遍遍亲吻它。原来他为了把小像藏得稳妥，将它系在发间，这才逃过魔法师的眼睛。王后赶紧叫女儿也来照镜子。赫尔莫萨看见利诺在困境中仍然如此思念自己，心里终于有了一点安慰。他的举止温柔而专一，正是公主盼望的模样。
        - id: ch03-b02
          speaker: narrator
          text: 镜子还在王后手里，牢门忽然打开，丑陋的里凯特走了进来。她抬起眼睛望着利诺，像是在求国王答应什么，可利诺坚决拒绝了。母女俩虽然听不到他们的话，但里凯特离开时满脸怒容，事情并不难猜。镜中的景象还没有结束。里凯特因为遭到拒绝而大发雷霆，叫来四个壮汉，当着赫尔莫萨的面用鞭子抽打利诺，直到他失去知觉。公主吓得手一松，镜子掉了下去。要不是母亲及时抱住她，她自己也要倒在地上。
        - id: ch03-b03
          speaker: swan_fairy
          text: 镇定些，孩子。要把国王从恶人手里救出来，我们必须保持清醒。先得查明，那个偷走他姓名和面孔的人究竟是谁。
          emotion: calm
        - id: ch03-b04
          speaker: narrator
          text: 王后拾起镜子，请它映出那个冒牌情人。镜中随即出现一个油腻肮脏的马夫。他衣服也不脱，就躺在王后的御床上。
        - id: ch03-b05
          speaker: swan_fairy
          text: 原来伊斯梅诺想用这种把戏骗我们。无论代价多大，我们都要讨回这笔账。不过他的法力胜过我，绝不能让他发现骗局已经败露。我先离开一阵。假国王要是问起，就说我去处理边境事务。你要对他十分客气，安排庆典让他消遣。他若起疑，你甚至可以暗示，等你们成婚，我会把王位交给你的丈夫。孩子，暂且别过。
        - id: ch03-b06
          speaker: narrator
          text: 天鹅仙女挥了挥手，一团云落下来遮住她。那朵美丽的白云飞快越过天空。谁也不知道，它正载着仙女前往伊斯梅诺的高塔。
        - id: ch03-b07
          speaker: narrator
          text: 高塔藏在森林深处。王后本以为能借浓密的树影遮掩，悄悄落到地面，不被任何人看见。可整座塔都受着严密的魔法保护。她越努力往下飞，便越有一股看不见的力量把她向后拉。她调动自己全部的法力，总算挣脱束缚，降到塔脚。虽然已经累得虚弱欲倒，她还是片刻也不肯耽搁，马上施法查探破解咒语的办法。结果只有一个。必须拿到吉格斯戒指上的一颗宝石，才能战胜伊斯梅诺。可魔法书也告诉她，那枚戒指被伊斯梅诺藏在最珍贵的宝物中间，日日夜夜亲自看守。
        - id: ch03-b08
          speaker: narrator
          text: 无论怎样，仙女都得拿到它。眼下，她要先见到囚禁在塔里的国王。她取出写字板，告诉利诺，送信的鸟就是赫尔莫萨的母亲。赫尔莫萨爱他，正像他爱赫尔莫萨一样。接着，她写下整个阴谋，变成一只燕子，绕塔飞翔，终于找到了牢房的窗口。
        - id: ch03-b09
          speaker: narrator
          text: 牢房的窗口高得惊人，似乎根本不需要铁栏，门外走廊上又有四名士兵把守。燕子轻易飞了进去，甚至跳到国王肩头。可利诺只顾看着公主的画像，迟迟没有留意这位小小的访客。燕子只好用信纸一角轻轻刮他的脸颊。他吓了一跳，回头看见燕子，马上明白救援终于来了。他急忙撕开信，读到赫尔莫萨依然爱着自己，忍不住喜极而泣。他接连追问公主如今是否平安。燕子不能开口回答，只能一次次点头，催他继续读完信上的计划。
        - id: ch03-b10
          speaker: lino
          text: 我真要装出愿意娶那个可怕的里凯特吗？我真的能从魔法师手里拿到宝石？
        - id: ch03-b11
          speaker: narrator
          text: 第二天，里凯特照例来探望。利诺待她忽然亲切了许多。她欣喜若狂，国王便说，自己做了一个梦。梦里，他得知赫尔莫萨已经变心。还有一位仙女告诉他，要斩断与负心公主的牵绊，转而爱上伊斯梅诺的女儿，就得把吉格斯戒指上的宝石留在身边一日一夜。
        - id: ch03-b12
          speaker: narrator
          text: 里凯特激动得搂住国王，温柔地亲吻他。利诺厌恶极了，宁可再挨士兵一顿棍打。可他只能装作高兴。幸好里凯特很快松开手，说要立刻去找父亲，拿到那颗宝石。
        - id: ch03-b13
          speaker: narrator
          text: 伊斯梅诺听见女儿的请求，马上起了疑心。他怎么也想不出，守卫森严的利诺怎样才能联系天鹅仙女。他没有轻举妄动，只对女儿说，自己唯一的愿望就是让她幸福，既然她想要宝石，他便去取。随后，他走进施法的密室，很快就发现天鹅仙女此刻正在宫中。
        - id: ch03-b14
          speaker: ismenor
          text: 原来是这么回事。好啊，我当然会给她一颗宝石。不过谁碰到这颗宝石，谁就会变成大理石。
        - id: ch03-b15
          speaker: narrator
          text: 他阴森森地笑着，把一颗小红宝石装进盒子，再交给女儿。
        - id: ch03-b16
          speaker: ismenor
          text: 这件法宝会帮你赢得利诺的爱情。一定要把盒子原封不动地交给他。只要打开，宝石就会失去魔力。
        - id: ch03-b17
          speaker: narrator
          text: 里凯特欢叫着抢过盒子，奔向牢房。伊斯梅诺手握魔法手帕，隐身跟在后面。塔下，天鹅仙女已经恢复本来模样，正等着王子扔下宝石。盒子落下来，她急忙伸手接住。指尖刚碰到红宝石，奇异的僵硬便传遍全身。她四肢凝固，舌头也快动不了了。
        - id: ch03-b18
          speaker: swan_fairy
          text: 我们中计了。
          emotion: fearful
        - id: ch03-b19
          speaker: ismenor
          text: 没错，你们就是中计了！
          emotion: angry
        - id: ch03-b20
          speaker: narrator
          text: 伊斯梅诺把利诺拖到窗口，声音变得更加可怕。
        - id: ch03-b21
          speaker: ismenor
          text: 你会变成一只鹦鹉，而且永远做鹦鹉，直到赫尔莫萨亲手砸碎你的脑袋！
          emotion: angry
    - id: ch04
      title: 奇迹森林的三棵树
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 伊斯梅诺刚说完，一只蓝鹦鹉便飞出高塔，进入森林。魔法师坐上带翅膀的车，赶到天鹅岛。他把岛上所有人都变成雕像，每个人都保持着原来的姿势，连拉博也没有逃过。只有赫尔莫萨被留下。伊斯梅诺命她坐到身旁，带她来到奇迹森林，又把不幸的公主拖下车。
        - id: ch04-b02
          speaker: ismenor
          text: 你的母亲已经变成石头，你的情人也成了鹦鹉。现在，你会变成一棵树。除非你亲手砸碎世上最爱之人的脑袋，否则永远不能恢复。我会留下你的心智和记忆，让你的痛苦增加一千倍。
        - id: ch04-b03
          speaker: narrator
          text: 伊斯梅诺自以为想出了最残酷的命运。就算再给他一百年，恐怕也没有比这更可怕的折磨。可怜的公主一动也不能动，只能熬过一个又一个漫长的时辰。她甚至盼望有个樵夫带着斧头走来，砍倒自己，替她结束苦难。他们到底怎样才能摆脱诅咒？就算利诺碰巧飞到这里，森林里有成千上万只蓝鹦鹉，她怎么认得出他，他又怎么知道哪棵树是她？至于变成石头的母亲，那件事更叫她不敢去想。可她越想停下，思绪越是翻来覆去，没有一刻安宁。
        - id: ch04-b04
          speaker: narrator
          text: 蓝鹦鹉却在世上四处飞翔，走到哪里都能交到朋友。一天，他飞进一位老巫师的城堡。老巫师刚娶了一位美丽的年轻妻子，名叫格勒纳丁。她的日子十分乏味，一见这个新玩伴便高兴极了。她给鹦鹉准备金笼子和鲜美的水果。只有一件事让她失望。这只鸟从不像别的鹦鹉那样说话。
        - id: ch04-b05
          speaker: grenadine
          text: 你要是知道听你说话会让我多开心，一定肯试着开口。
        - id: ch04-b06
          speaker: narrator
          text: 鹦鹉却像没听见。一天早晨，格勒纳丁出去采花。鹦鹉见房里没人，便跳上桌子，衔起铅笔，在纸上写了几行诗。他才写完，就被响动惊起，丢下铅笔，飞出了窗外。
        - id: ch04-b07
          speaker: narrator
          text: 原来，老巫师掀开门帘走了进来。他发现桌上的纸，拿起来一读，大吃一惊。纸上写着：“美丽公主若垂青，我愿开口诉衷情。只是学那凤头鹦，喋喋不休不如静。”
        - id: ch04-b08
          speaker: wizard
          text: 我早就有些怀疑，这只鸟中了魔法。
        - id: ch04-b09
          speaker: narrator
          text: 老巫师取来一本又一本魔法书，仔细查找，终于弄清蓝鹦鹉并不是真的鸟。他原本是一位国王，因为触怒魔法师才中了诅咒。给他下咒的人，恰好也是老巫师在世上最痛恨的仇敌。老巫师急切地继续翻阅，寻找破解魔法的办法，最后总算找到了，心里欢喜极了。他赶忙去找躺在树下软垫上的妻子，告诉她，那只心爱的鹦鹉其实是一个大国的国王。只要她吹口哨把鸟儿唤下来，三人便能一起去奇迹森林里的一个地方。老巫师会在那里让国王恢复原来的模样。
        - id: ch04-b10
          speaker: wizard
          text: 可无论我做什么，你都不能害怕，也不能喊出声。不然，一切就全毁了。
        - id: ch04-b11
          speaker: narrator
          text: 格勒纳丁高兴得立刻跳起来，吹起鹦鹉最喜欢的曲子。蓝鹦鹉不愿让人知道自己偷听了谈话，等她转过身，才从树上飞下，落在她肩头。他们坐进一艘金船，来到森林中的空地。那里孤零零地立着三棵高树。
        - id: ch04-b12
          speaker: wizard
          text: 我要用这三棵树生起魔法火焰。把鹦鹉放在那根树枝上，他不会有事。你自己站远些，免得树倒下来，砸碎你的脑袋。
        - id: ch04-b13
          speaker: narrator
          text: 蓝鹦鹉听见这句话，忽然记起伊斯梅诺的预言。这三棵树里，有一棵就是赫尔莫萨。他的心怦怦直跳，已经做好准备。老巫师拿起铁锹，挖松三棵树根旁的泥土，让它们能够同时倒下。树木刚一摇晃，鹦鹉便张开翅膀，直飞到中间那棵树下。那是三棵树里最美的一棵。一声巨响过后，利诺和赫尔莫萨已经面对面站着，双手紧紧握在一起。
    - id: ch05
      title: 咒语消散之后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 最初的惊喜过去，赫尔莫萨立刻想起了母亲。老巫师正为计划成功而满面笑容，公主跪在他脚下，求他再帮一次忙，让天鹅仙女也恢复原形。
        - id: ch05-b02
          speaker: wizard
          text: 这件事没那么容易。不过，我会尽力试一试。
        - id: ch05-b03
          speaker: narrator
          text: 老巫师施法回到自己的宫殿，取来一小瓶毒水。他一直等到天黑，随后立即动身，赶往伊斯梅诺的高塔。伊斯梅诺要是翻开魔法书查一查，本来能看见仇敌正在做什么，也完全来得及保护自己。偏偏那天他吃得太多，酒也喝得太多，早早上了床，此刻正睡得又沉又熟，对逼近的危险毫无知觉。
        - id: ch05-b04
          speaker: narrator
          text: 老巫师变成一只蝙蝠，飞进房间，藏在帷帐里。他把毒水全倒在伊斯梅诺脸上。魔法师连一声呻吟也没发出，就死去了。同一瞬间，天鹅仙女恢复了原形。原来，不管魔法师有多强，他的咒语都无法活得比自己更久。
        - id: ch05-b05
          speaker: narrator
          text: 天鹅仙女回到都城，群臣全在城门口等着迎接她。赫尔莫萨和利诺站在人群中间，脸上洋溢着幸福。拉博也在他们身后，只是离得远远的。他的脏衣服已经换成干净衣裳，心愿也得以实现。公主任命他做了马厩总管。
        - id: ch05-b06
          speaker: narrator
          text: 故事讲到这里，我们也该向他们一一道别了。经历过那么可怕的磨难，他们往后一定还有许多幸福的岁月。
