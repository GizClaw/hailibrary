  chapters:
    - id: ch01
      title: The Portrait
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            In one part of Arabia, palm groves and sweet-smelling flowers gave travelers a place to rest after hard journeys beneath the burning sky. A young king named Lino ruled there. His wise father had died not long before, and Lino had grown up under his guidance. Though the new king was only nineteen, he did not think he had to change every law just to prove how clever he was. He kept the old laws that had made his people happy and his country rich.
        - id: ch01-b02
          speaker: narrator
          text: >-
            His subjects found only one fault with him. No matter how often they begged him, he showed no hurry to marry. The neighboring kingdom belonged to the Swan Fairy. Her only daughter was Princess Hermosa, and she was every bit as charming in her way as Lino was in his. The Swan Fairy always kept an ambassador at the young king's court. The ambassador was a good man. When he heard the citizens grumbling that Lino showed no sign of taking a wife, he decided that he would try his hand at making a match himself.
        - id: ch01-b03
          speaker: ambassador
          text: >-
            If anyone alive deserves Princess Hermosa, that man must be here. At least I can try to bring the two of them together.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Of course, it would not have been proper for the ambassador simply to offer the princess in marriage. That was the difficulty. Somehow, he had to influence the unsuspecting king until the proposal came from Lino himself. The ambassador knew the ways of royal courts very well. He spoke with Lino several times about the art of painting, which the king loved, and slowly turned their conversations toward portraits. Then, as if the thought had only just occurred to him, he casually mentioned that a particularly fine picture had recently been painted of his own princess.
        - id: ch01-b05
          speaker: ambassador
          text: >-
            Still, I am not sure the new portrait looks quite like her. This little miniature may be better. It was painted a year ago.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Lino took the miniature and studied it closely.
        - id: ch01-b07
          speaker: lino
          text: >-
            Ah, the painter must have made her prettier than she is. No woman could truly be such a miracle of beauty.
        - id: ch01-b08
          speaker: ambassador
          text: >-
            If only you could see her for yourself.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Lino gave no answer. But the ambassador was not surprised when the king summoned him the next morning. Lino began speaking almost before the door had closed.
        - id: ch01-b10
          speaker: lino
          text: >-
            Ever since you showed me that picture, I have not been able to put the princess's face out of my mind. I am sending special envoys to the Swan Fairy's court to ask for her daughter's hand in marriage.
        - id: ch01-b11
          speaker: ambassador
          text: >-
            You will understand that I cannot answer for my mistress in something so important. But I know your proposal will please her greatly.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The ambassador stroked his beard as he spoke, hiding how satisfied he felt. Lino's whole face shone with joy.
        - id: ch01-b13
          speaker: lino
          text: >-
            Then I will not send envoys. I will go myself, and you will come with me. Give me three days to prepare, and we will set out.
    - id: ch02
      title: The False King
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Unluckily for Lino, his other neighbor was a powerful magician named Ismenor. He ruled the Isle of Lions and had a hideous daughter whom he believed to be the most beautiful creature ever born. Her name was Riquette. She too had fallen in love with a portrait, but hers showed King Lino. She begged her father to give her Lino as a husband. Ismenor thought no man was good enough for his precious daughter, yet he was about to send his chief minister on this errand when word came that Lino had already left for the Swan Fairy's court.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Riquette fell into wild grief and pleaded with her father to stop the marriage. Ismenor promised that he would. He called for Rabot, an ugly little hunchbacked groom, and cast spells that carried them swiftly to a rocky valley on Lino's road. Soon they heard horses approaching. Ismenor drew out an enchanted handkerchief that made anyone touching it invisible. He held one end and gave Rabot the other. Unseen, they moved among the riders, but Lino was nowhere there.
        - id: ch02-b03
          speaker: narrator
          text: >-
            There was a simple reason. Worn out by the excitement and strain of the past few days, Lino had sent the heavy coaches ahead with their gifts for Hermosa. He had stayed behind to rest beneath the palms with a few friends. Ismenor found all of them fast asleep. He cast a spell to keep them sleeping until he chose to wake them. Then he took away Lino's clothes and dressed the king in Rabot's filthy garments. After that he touched Rabot with his ring.
        - id: ch02-b04
          speaker: ismenor
          text: >-
            You will look like Lino until you have married the Swan Fairy's daughter.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The magician's power was so great that Rabot truly believed he was the king. Once the groom had mounted Lino's horse and ridden away, Ismenor woke the real Lino. The king stared in astonishment at the dirty clothes covering him. Before he could even look around, Ismenor swept him up in a cloud and carried him off to Riquette.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Rabot soon caught up with the royal party. Not one of them guessed that he was not their master.
        - id: ch02-b07
          speaker: rabot
          text: >-
            I am starving. Bring me food this instant.
        - id: ch02-b08
          speaker: steward
          text: >-
            Your Majesty, the tents are not even standing yet. Supper will take at least an hour. We thought that—
        - id: ch02-b09
          speaker: rabot
          text: >-
            Who gave you permission to think? You are a fool! Bring me horse meat at once. Nothing in the world tastes better!
        - id: ch02-b10
          speaker: narrator
          text: >-
            The steward could hardly believe what he heard. King Lino was the politest man beneath the sun. How could he speak that way to a faithful servant? And how could he ask for horse meat? Lino's taste was so delicate that he lived mostly on fruit and cakes. Yet there was no telling what a person might become. Whatever had happened, the steward had to obey at once if he wanted to keep his head on his shoulders. Perhaps love had driven the king mad. If that was the cause, perhaps he would recover in time.
        - id: ch02-b11
          speaker: narrator
          text: >-
            His old servants found every excuse they could for their master. Yet before the procession reached the Swan Fairy's capital, not a horse remained. Everyone had to walk to the palace. The courtiers hid their amazement, climbed down from their own mounts, and invited the king to follow, since they supposed he preferred walking. Soon they saw the Swan Fairy and Hermosa waiting on a low balcony. Rabot stopped beneath them.
        - id: ch02-b12
          speaker: rabot
          text: >-
            Madam, perhaps you are surprised that I came to ask for your daughter without ceremony. It was a long journey, and I was hungry, so I ate my horse. Horse is the best meat there is. I made my courtiers eat theirs too. Even so, I am a great king, and I intend to be your son-in-law. Now that we have settled that, which one is Hermosa?
        - id: ch02-b13
          speaker: swan_fairy
          text: >-
            Sire, you have my daughter's portrait. It cannot have touched you deeply if you cannot recognize her at once.
        - id: ch02-b14
          speaker: narrator
          text: >-
            The queen was amazed and more than a little offended. This king behaved nothing like the man she had expected.
        - id: ch02-b15
          speaker: rabot
          text: >-
            I remember no portrait. Maybe it is in one of my pockets after all.
        - id: ch02-b16
          speaker: narrator
          text: >-
            He searched everywhere while the ladies-in-waiting watched in wonder. Naturally, he found nothing. Then he turned toward the princess, who stood blushing with anger.
        - id: ch02-b17
          speaker: rabot
          text: >-
            If you are the woman I came to marry, I think you are very beautiful. Had I seen your portrait, I would surely remember it. Let us marry as soon as we can. For now, I want some sleep. Your country is quite unlike mine, and after walking over stones and sand for days, a man needs his rest.
        - id: ch02-b18
          speaker: narrator
          text: >-
            Without waiting for an answer, he ordered a page to show him to his room. Soon he was snoring so loudly that people could hear him at the far end of the town.
        - id: ch02-b19
          speaker: narrator
          text: >-
            The moment he was out of sight, poor Hermosa threw herself into her mother's arms and burst into tears. For fifteen days she had kept Lino's portrait constantly before her. She had never let the ambassador's letter leave her pocket, for it spoke of the young king's grace and charm. The portrait had shown his face faithfully enough, but how could such a handsome face hide so rude and rough a soul? She might even have forgiven his manners if he had shown her any sign of the love and admiration she was so used to receiving. As for the Swan Fairy, the behavior of this extraordinary new son-in-law left her so bewildered that she was nearly speechless.
    - id: ch03
      title: The Magic Mirror
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            While matters stood this way, Lino's chamberlain asked the queen for a private audience. As soon as they were alone, he told her that he feared his master had suddenly gone mad or fallen under a magician's spell.
        - id: ch03-b02
          speaker: chamberlain
          text: >-
            I was astonished before, Your Majesty. Now he has failed to recognize the princess, and he no longer has her portrait. He never let it leave him for even a moment. I cannot understand any of this. Perhaps your fairy powers can discover what changed a man whose courtesy was praised throughout his kingdom.
        - id: ch03-b03
          speaker: narrator
          text: >-
            He bowed low and left. The queen remained where he had stood, deep in thought. Then her face brightened. In a secret room, she kept an old chest. She opened it and drew out a small mirror. That mirror could faithfully show her anything she wished to see. At that moment, she wanted more than anything to behold King Lino as he truly was.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The chamberlain was right. The man lying on the bed and snoring so hard that the whole palace shook was not Lino. Her real son-in-law appeared in the glass. He wore dirty clothes and was locked inside one of Ismenor's strongest towers. There he sat, kissing Hermosa's portrait. The wizard had failed to find it when he searched the king, because Lino had wanted to conceal it well and had tied it among his hair.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The Swan Fairy quickly called her daughter to look into the mirror too. Hermosa had the pleasure of watching Lino behave exactly as she could have wished. While the mirror was still in her mother's hand, the prison door opened and the hideous Riquette entered. From the way she raised her eyes toward Lino, she seemed to be begging him for some favor. He refused her. Hermosa and her mother could not hear a word they said, but when Riquette left the room, the anger on her face made it easy to guess what had happened.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The mirror showed them more. Enraged by Lino's rejection, Riquette ordered four strong men to beat him until he fainted. Hermosa saw it happen. She dropped the mirror in horror and would have fallen if her mother had not caught her.
        - id: ch03-b07
          speaker: swan_fairy
          text: >-
            Steady yourself, my child. We will need all our wits to rescue the king from those wicked people. First, we must learn who has stolen his name and face.
          emotion: calm
        - id: ch03-b08
          speaker: narrator
          text: >-
            She picked up the mirror and wished to see Hermosa's false suitor. The glass showed a dirty, greasy groom lying fully dressed on the queen's grand bed.
        - id: ch03-b09
          speaker: swan_fairy
          text: >-
            So this is Ismenor's trick. We will have our revenge, whatever it costs. But he must not suspect that we know. His magic is stronger than mine, so I must be very careful. I have to leave you now. If the false king asks, tell him I am settling business on the borders of my kingdom. Treat him with perfect courtesy and arrange celebrations to entertain him. If he grows suspicious, you may even hint that when you marry, I mean to give your husband the crown. Farewell, my child.
        - id: ch03-b10
          speaker: narrator
          text: >-
            The Swan Fairy waved her hand. A cloud descended and hid her. No one guessed that the beautiful white cloud racing across the sky was her chariot, carrying her toward Ismenor's tower.
    - id: ch04
      title: The Stone and the Spell
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The tower stood in the middle of a forest. The queen thought the dark trees would hide her while she came down to earth. But the tower was so completely enchanted that whenever she tried to descend, an unseen force held her back more tightly. At last she used every bit of her power and reached the foot of the tower. Weak and faint from the effort, she immediately began testing spells. She discovered that only a stone from the ring of Gyges could defeat Ismenor.
        - id: ch04-b02
          speaker: narrator
          text: >-
            But how could she get the ring? Her magic book said that Ismenor guarded it night and day among his dearest treasures. Somehow, she had to obtain it. First, though, she needed to reach the royal prisoner. She took out her writing tablets and prepared a message.
        - id: ch04-b03
          speaker: swan_fairy
          text: >-
            The bird carrying this letter is the Swan Fairy, Hermosa's mother. Hermosa loves you as deeply as you love her.
        - id: ch04-b04
          speaker: narrator
          text: >-
            She went on to explain the wicked plot that had trapped him. Then she quickly changed herself into a swallow and circled the tower until she found Lino's prison window. It stood so high that no one had thought bars were needed, especially with four soldiers guarding the passage outside. The swallow flew in and hopped onto Lino's shoulder. He was staring so intently at Hermosa's portrait that she could not catch his notice at first.
        - id: ch04-b05
          speaker: narrator
          text: >-
            At last she gently scratched his cheek with the corner of the note. Lino turned with a start. The moment he saw the swallow, he knew help had arrived. He tore open the letter and wept for joy over its first words. Then he began asking question after question about Hermosa. The swallow could not answer. She kept nodding toward the letter to make him read the rest. When he reached the plan, he cried out.
        - id: ch04-b06
          speaker: lino
          text: >-
            Must I really pretend that I want to marry that horrible Riquette? And how can I ever get the stone away from the magician?
        - id: ch04-b07
          speaker: narrator
          text: >-
            The next morning, Riquette made her usual daily visit. This time Lino welcomed her much more warmly than he ever had before. The change delighted her so much that she could hardly contain herself. In answer to all her joyful words, Lino told her about a dream. In it, he had learned that Hermosa was unfaithful to him. Then a fairy had appeared and shown him how to break the bonds that tied him to that faithless princess. If he wished to give his love to Ismenor's daughter instead, he must keep a stone from the ring of Gyges in his possession for one whole day and one whole night. The magician himself now owned that ring.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Riquette was so enchanted by the news that she threw her arms around Lino's neck and kissed him tenderly. He was disgusted and would much rather have faced the soldiers' sticks again. There was nothing he could do, so he tried to look pleased. At last Riquette let go and announced that she must ask her father for the stone without delay.
        - id: ch04-b09
          speaker: narrator
          text: >-
            His daughter's request took Ismenor completely by surprise, and his suspicions rose at once. He turned the matter over and over in his mind. The king was guarded so closely that there seemed to be no possible way for him to communicate with the Swan Fairy. Still, Ismenor would do nothing in haste. He hid his alarm and told Riquette that his only wish was to make her happy. Since she wanted the stone so much, he would bring it to her. Then he went into the private room where he worked all his spells. Before long, his magic showed him that his enemy, the Swan Fairy, was inside his palace at that very moment.
        - id: ch04-b10
          speaker: ismenor
          text: >-
            So that is the game. Very well, she shall have a stone. But anyone who touches this one will turn to marble.
        - id: ch04-b11
          speaker: narrator
          text: >-
            He smiled grimly, placed a small ruby in a box, and returned to his daughter.
        - id: ch04-b12
          speaker: ismenor
          text: >-
            Here is the charm that will win King Lino's love. Give him the box without opening it, or the stone will lose all its power.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Riquette cried out with joy, snatched the box, and ran to the prison. Her father followed while gripping his enchanted handkerchief, which let him watch unseen as the spell unfolded. Just as he expected, the Swan Fairy stood in her natural form at the tower's foot. She was waiting for the prince to throw down the stone. The box fell, and she caught it eagerly. The instant her fingers touched the ruby, a strange hardness spread over her. Her limbs grew stiff. She could barely move her tongue.
        - id: ch04-b14
          speaker: swan_fairy
          text: >-
            We have been betrayed.
          emotion: fearful
        - id: ch04-b15
          speaker: ismenor
          text: >-
            Yes, you have been betrayed! And you, Lino, will become a parrot. You will remain a parrot until you can persuade Hermosa to crush your head.
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: >-
            Before Ismenor had finished, a blue parrot flew out into the forest. The magician climbed into his winged chariot and sped to the Isle of Swans. There he changed everyone into a statue, leaving each person in the exact position where he found them. He did not even spare Rabot. Hermosa alone remained alive. Ismenor ordered her into the chariot beside him, then carried her to the Forest of Wonders and dragged the unhappy princess down after him.
        - id: ch04-b17
          speaker: ismenor
          text: >-
            Your mother is stone, and your lover is a parrot. Now you will become a tree. You will stay a tree until you crush the head of the person you love more than anyone in the world. I will leave you your thoughts and memories so that your suffering will be a thousand times worse.
        - id: ch04-b18
          speaker: narrator
          text: >-
            Great magician though he was, Ismenor could not have invented a more terrible fate if he had tried for a hundred years. The weary hours dragged past for poor Hermosa. She longed for a woodcutter's axe to come and end her misery. How could she and Lino ever be released from their doom? Suppose King Lino did happen to fly that way. Thousands of blue parrots lived in the forest. How could she possibly know which bird was Lino? How could he ever recognize her among the trees? And as for her mother, that was much too painful to think about. Yet Hermosa was a woman, so she went on thinking about her all the same.
    - id: ch05
      title: The Blue Parrot
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Meanwhile, the blue parrot flew across the world and made friends wherever he went. One day he entered the castle of an old wizard who had recently married a beautiful young wife. Her name was Grenadine. Her life was very dull, so she was delighted to find a playmate. She gave the parrot a golden cage for sleeping and fed him delicious fruit. He disappointed her in only one way. He would never speak as other parrots did.
        - id: ch05-b02
          speaker: grenadine
          text: >-
            If you knew how happy it would make me to hear you talk, I am sure you would at least try.
        - id: ch05-b03
          speaker: narrator
          text: >-
            She often said this, but the parrot seemed not to hear. One morning Grenadine left the room to gather flowers. When the parrot found himself alone, he hopped onto the table, picked up a pencil, and wrote a few lines on a sheet of paper. Just as he finished, a noise startled him. He dropped the pencil and flew through the window.
        - id: ch05-b04
          speaker: narrator
          text: >-
            The pencil had scarcely fallen when the wizard lifted a corner of the curtain over the doorway and stepped inside. He saw the paper on the table, picked it up, and read with great surprise.
        - id: ch05-b05
          speaker: lino
          text: >-
            Fair princess, if I want to please you, I will speak with you. Yet silence suits me better than chattering like a cockatoo.
        - id: ch05-b06
          speaker: old_wizard
          text: >-
            I thought that bird might be enchanted.
        - id: ch05-b07
          speaker: narrator
          text: >-
            The wizard fetched his books and searched through them. He learned that the bird was truly a king under a magician's curse. Better still, the magician responsible was the man he hated most in the world. The wizard eagerly read on, hunting for a way to break the enchantment. At last, to his great joy, he found the remedy.
        - id: ch05-b08
          speaker: narrator
          text: >-
            He hurried outside to his wife. Grenadine was resting on cushions beneath the tree where the parrot had perched. The wizard told her that her favorite bird was really the king of a great country.
        - id: ch05-b09
          speaker: old_wizard
          text: >-
            Whistle for him, and we will all travel to a certain place in the Forest of Marvels. There I can give him back his true shape. Whatever I do, you must not be frightened or cry out. If you do, everything will be ruined.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Grenadine sprang up at once, so delighted was she by the news, and began to whistle the song the parrot loved. He had overheard their whole conversation, but he did not want them to know that he had been listening. He waited until she turned her back. Only then did he fly down from the tree and settle on her shoulder. The three of them climbed into a golden boat. It carried them all the way to a clearing in the Forest of Marvels, where three tall trees stood apart from all the others.
        - id: ch05-b11
          speaker: old_wizard
          text: >-
            I need these trees for my magic fire. Put the parrot on that branch, where he will be safe, and move some distance away. If you stand too close, one of the falling trees may crush your head.
        - id: ch05-b12
          speaker: narrator
          text: >-
            At those words, the parrot suddenly remembered Ismenor's prophecy. His heart pounded as he realized that one of those trees must be Hermosa. He held himself ready. The wizard took a spade and loosened the earth around all three sets of roots so the trees would fall together. The moment the parrot saw them begin to sway, he opened his wings. He flew straight beneath the middle tree, the loveliest of the three.
        - id: ch05-b13
          speaker: narrator
          text: >-
            The tree came down with a crash. Then Lino and Hermosa stood before each other, hand clasped in hand.
        - id: ch05-b14
          speaker: narrator
          text: >-
            After those first moments together, Hermosa thought of her mother. The wizard smiled with delight at the success of his plan. Hermosa fell at his feet and begged him to help them once more by restoring the Swan Fairy's true form.
        - id: ch05-b15
          speaker: old_wizard
          text: >-
            That will not be so easy, but I will do all I can.
        - id: ch05-b16
          speaker: narrator
          text: >-
            He transported himself back to his palace to collect a small bottle of poisoned water. He waited until nightfall, then set out at once for Ismenor's tower. If Ismenor had thought to consult his magic books, he would have seen exactly what his enemy was doing. He might have protected himself before the wizard arrived. But Ismenor had eaten and drunk far too much. He had already gone to bed, and he was sleeping heavily.
        - id: ch05-b17
          speaker: narrator
          text: >-
            The old wizard changed himself into a bat and flew into Ismenor's room. Hidden among the curtains, he poured every drop of the poisoned water over the sleeping magician's face. Ismenor died without a sound. At that same instant, the Swan Fairy became a woman again. No magician, however powerful, can make a spell that lasts beyond his own life.
        - id: ch05-b18
          speaker: narrator
          text: >-
            When the Swan Fairy returned to her capital, all her courtiers were waiting at the gate to welcome her. In the middle stood Hermosa and King Lino, shining with happiness. Rabot stood behind them, though a long way off. His dirty clothes had been replaced with clean ones. His deepest wish had been granted, and the princess had made him the head of her stables.
        - id: ch05-b19
          speaker: narrator
          text: >-
            And now we must say farewell to them all. After the terrible trials they had endured, we may be sure that many happy years lay ahead.
