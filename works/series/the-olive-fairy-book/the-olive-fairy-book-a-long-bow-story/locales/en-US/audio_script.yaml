  chapters:
    - id: ch01
      title: A Wager on the Road
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One day, a bunniah, a grain merchant and banker, was walking along a country road when he caught up with a farmer going the same way. Like most men of his class, he was grasping. He had found no chance to make money that day, and he had been lamenting his bad luck as he walked. But when he saw the farmer ahead, his spirits rose wonderfully.
        - id: ch01-b02
          speaker: banker
          text: That is lucky. Let me see whether I can get something out of this farmer.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He hurried forward. The two men wished each other a very good day, as politely as they could, and then the banker spoke again.
        - id: ch01-b04
          speaker: banker
          text: >-
            I was feeling terribly bored until I saw you. Since we are both headed the same way, your pleasant company will make the road seem short.
        - id: ch01-b05
          speaker: farmer
          text: >-
            Gladly. But what can we talk about? A city gentleman like you will not want to hear about crops and cattle.
        - id: ch01-b06
          speaker: banker
          text: >-
            I know what we can do. Each of us will tell the wildest tale he can imagine. The first man who says he doubts the other's story must pay him one hundred rupees.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The farmer agreed. He asked the banker to go first, since the banker was the greater man of the two. In his own mind, though, the farmer settled on one thing. However unlikely the tale became, nothing would make him hint that he doubted the banker. With such polite encouragement, the great man began.
    - id: ch02
      title: One Hundred and One Camels
      blocks:
        - id: ch02-b01
          speaker: banker
          text: >-
            I was walking down this very road one day when I met a merchant. He was traveling with a great train of camels, and every camel was loaded with merchandise.
        - id: ch02-b02
          speaker: farmer
          text: Quite likely. I have seen such a thing myself.
        - id: ch02-b03
          speaker: banker
          text: >-
            There were one hundred and one camels. They were fastened by their nose strings, nose to tail, and stretched for nearly half a mile.
        - id: ch02-b04
          speaker: farmer
          text: And then?
        - id: ch02-b05
          speaker: banker
          text: >-
            Then a kite swept down upon the first camel, seized it, and carried it struggling into the air. All the camels were tied together, so the other hundred rose from the road and had to follow.
        - id: ch02-b06
          speaker: farmer
          text: >-
            What strength that kite must have had! Still, yes, no doubt it happened. So there were one hundred and one camels. What did the kite do with them?
        - id: ch02-b07
          speaker: banker
          text: Are you saying you doubt me?
        - id: ch02-b08
          speaker: farmer
          text: Not in the least!
        - id: ch02-b09
          speaker: banker
          text: >-
            Well, the princess of a neighboring kingdom was sitting in her private garden while her maid combed her hair. The princess tipped her head back and looked up as the maid tugged the comb through. Just then, that miserable kite came soaring overhead with its prey. As luck would have it, the camels gave an extra kick at that very moment. The kite lost its grip, and all one hundred and one fell straight into the princess's left eye.
        - id: ch02-b10
          speaker: farmer
          text: Poor princess. It hurts so much when anything gets into your eye.
        - id: ch02-b11
          speaker: narrator
          text: The banker was beginning to enjoy his tale now, and he went on.
        - id: ch02-b12
          speaker: banker
          text: The princess shook her head, jumped up, and pressed her hand to her eye.
        - id: ch02-b13
          speaker: princess
          text: Oh, dear! There is something in my eye, and it stings terribly!
          emotion: surprised
        - id: ch02-b14
          speaker: farmer
          text: That is just what happens. It is perfectly true. So what did the poor princess do?
        - id: ch02-b15
          speaker: banker
          text: When the princess cried out, her maid ran over to help her.
        - id: ch02-b16
          speaker: maid
          text: Let me have a look.
        - id: ch02-b17
          speaker: banker
          text: >-
            The maid gave the princess's eyelid a quick tug, and out came one camel. She picked it up and put it into her pocket. Then she twisted the corner of her headcloth, reached into the princess's eye, and fished out the other hundred camels. She popped every one of them into her pocket with the first.
        - id: ch02-b18
          speaker: narrator
          text: >-
            The banker stopped and gasped like a man who had run out of breath. The farmer looked at him slowly.
        - id: ch02-b19
          speaker: farmer
          text: Well? What happened next?
        - id: ch02-b20
          speaker: banker
          text: >-
            I cannot think of anything else. Besides, that is the end. What do you say about my story?
        - id: ch02-b21
          speaker: farmer
          text: Wonderful indeed. And no doubt every word of it is true!
        - id: ch02-b22
          speaker: banker
          text: >-
            Now it is your turn. I am eager to hear your story. I am sure it will be interesting.
        - id: ch02-b23
          speaker: farmer
          text: Yes, I think it will be.
    - id: ch03
      title: The Wheat on the Mare
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: And so the farmer began his tale.
        - id: ch03-b02
          speaker: farmer
          text: >-
            My father was a very prosperous man. He owned five cows, three pairs of oxen, half a dozen buffaloes, and goats in abundance. But of all his possessions, he loved his mare best. She was well bred, and she was a very fine mare indeed.
        - id: ch03-b03
          speaker: banker
          text: Yes, yes. Get on with it!
        - id: ch03-b04
          speaker: farmer
          text: >-
            I am getting on. Do not rush me. Well, one unlucky day my father rode that mare to market with a torn saddle. It rubbed her so badly that when they came home, she had a sore on her back as large as the palm of your hand.
        - id: ch03-b05
          speaker: banker
          text: Yes. What came next?
        - id: ch03-b06
          speaker: farmer
          text: >-
            It was June, and you know what June is like. The air fills with dust storms, and now and then the rain comes. Dust blew into the poor mare's wound, and some grains of wheat went in with it. The dust settled there. Then the heat and rain did their work, and that wheat sprouted and began to grow.
        - id: ch03-b07
          speaker: banker
          text: Wheat will grow when it gets the chance.
        - id: ch03-b08
          speaker: farmer
          text: >-
            Yes, and before we knew it, a crop of wheat covered the mare's back. It was as great a crop as you might see in a field of one hundred acres. We had to hire twenty men to harvest it.
        - id: ch03-b09
          speaker: banker
          text: Harvest time often calls for extra workers.
        - id: ch03-b10
          speaker: farmer
          text: And that mare's back gave us four hundred maunds of wheat!
        - id: ch03-b11
          speaker: banker
          text: A fine harvest.
        - id: ch03-b12
          speaker: farmer
          text: >-
            Then your father came to mine. Your father was a poor fellow who barely had enough to stay alive.
        - id: ch03-b13
          speaker: narrator
          text: >-
            The banker snorted, but said nothing. The farmer went on. He said the banker's father had put his hands together and spoken as humbly as he could.
        - id: ch03-b14
          speaker: narrator
          text: >-
            The banker shot his companion a furious look. Still, he bit his lips and kept quiet.
        - id: ch03-b15
          speaker: bankers_father
          text: >-
            I have not eaten for a whole week. Great master, please lend me sixteen maunds of wheat from your store. I promise I will repay you.
        - id: ch03-b16
          speaker: farmers_father
          text: Of course, neighbor. Take what you need, and repay me whenever you can.
        - id: ch03-b17
          speaker: banker
          text: Well? What happened?
          emotion: angry
        - id: ch03-b18
          speaker: farmer
          text: >-
            Your father carried the wheat away, but he never paid it back. The debt is still unpaid today. Sometimes I wonder whether I ought to take the matter to court.
    - id: ch04
      title: Money or Wheat
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The banker began running his thumb quickly up and down the fingers of his right hand. His lips moved as he swiftly calculated the cost of the wheat against the hundred rupees.
        - id: ch04-b02
          speaker: farmer
          text: What is the matter?
        - id: ch04-b03
          speaker: banker
          text: Wheat costs less. I will pay you for the wheat.
        - id: ch04-b04
          speaker: narrator
          text: >-
            He spoke with the calmness of despair. He remembered that his own wager bound him to give the farmer one hundred rupees if he doubted the tale, so paying for the wheat was cheaper. And to this day, when a man in those parts owes a debt, people say, “Give me the money. Or, if you cannot do that, at least give me the wheat.”
        - id: ch04-b05
          speaker: narrator
          text: This story comes from oral tradition.
