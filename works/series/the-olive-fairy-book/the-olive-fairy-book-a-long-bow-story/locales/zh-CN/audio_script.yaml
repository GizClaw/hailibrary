audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    bunniah:
      display_name: 巴尼亚
      tts:
        delivery: 圆滑自负，算计落空时焦躁而不失体面
        timbre: 饱满油滑的成年男声
        pace: 适中偏快
        pitch: 中
    farmer:
      display_name: 农夫
      tts:
        delivery: 朴实沉稳，机智藏在不动声色的认真里
        timbre: 结实温厚的成年男声
        pace: 从容
        pitch: 中低
    princess:
      display_name: 公主
      tts:
        delivery: 娇贵直率，吃痛时慌张急切
        timbre: 清亮的年轻女声
        pace: 适中偏快
        pitch: 中高
    maid:
      display_name: 侍女
      tts:
        delivery: 利落殷勤，遇事毫不迟疑
        timbre: 清脆的成年女声
        pace: 适中
        pitch: 中
    farmer_father:
      display_name: 农夫的父亲
      tts:
        delivery: 宽厚爽直，说话朴素大方
        timbre: 沉稳的老年男声
        pace: 舒缓
        pitch: 低
    bunniah_father:
      display_name: 巴尼亚的父亲
      tts:
        delivery: 饥饿窘迫，求人时格外谦卑
        timbre: 虚弱沙哑的成年男声
        pace: 偏慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 同路人的赌约
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天，一位巴尼亚走在乡间路上。巴尼亚是兼营钱庄的粮商，他们这一行人大多贪心，这一位也不例外。他一路都在懊恼，当天竟然没碰到半点赚钱的机会。忽然，他瞧见前面有个同路的农夫，脸色一下亮了起来。
        - id: ch01-b02
          speaker: bunniah
          text: 运气总算来了。让我看看，能不能从这个农夫身上捞到点什么。
        - id: ch01-b03
          speaker: narrator
          text: 他赶紧加快脚步，追上农夫。两人先客客气气地互道日安，巴尼亚才说，自己刚才还闷得发慌，幸好遇见了这么讨人喜欢的同伴。他们既然去往同一个方向，一路说着话，这段路走起来一定会显得很短。
        - id: ch01-b04
          speaker: farmer
          text: 我当然乐意陪你。不过，咱们聊什么呢？你是城里人，恐怕不爱听牛羊和庄稼的事。
        - id: ch01-b05
          speaker: bunniah
          text: 我有个好主意。咱们一人讲一个最离奇的故事。谁先说不信对方，谁就付一百卢比。
        - id: ch01-b06
          speaker: narrator
          text: 农夫一口答应。他恭恭敬敬地说，两个人当中，巴尼亚才是大人物，理应由他先讲。嘴上这样说着，农夫心里也拿定了主意。不管这个故事离奇到什么地步，他都绝不露出半点不信的意思。巴尼亚经他这样客气地一请，便开讲了。
        - id: ch01-b07
          speaker: bunniah
          text: 有一天，我也走在这条路上，碰见一位商人。他带着好大一支骆驼队，每峰骆驼都驮满了货物。
        - id: ch01-b08
          speaker: farmer
          text: 这很平常，我也见过这样的队伍。
        - id: ch01-b09
          speaker: bunniah
          text: 那可不是普通的队伍，足足有一百零一峰骆驼。它们全用穿鼻绳前后相连，一峰的鼻子系着前一峰的尾巴，沿着大路排出去将近半英里。
        - id: ch01-b10
          speaker: farmer
          text: 嗯，后来发生了什么？
        - id: ch01-b11
          speaker: bunniah
          text: 一只鸢突然扑下来，抓住最前面那峰骆驼，把它提上了天。那峰骆驼拼命挣扎，可后面的一百峰全都连着它，只好一起飞上去。
        - id: ch01-b12
          speaker: farmer
          text: 那只鸢的力气真大！不过……嗯……是啊，这当然不是不可能。对，一百零一峰骆驼啊。后来呢？它究竟怎么处置这么多骆驼？
        - id: ch01-b13
          speaker: bunniah
          text: 怎么，你不信？
        - id: ch01-b14
          speaker: farmer
          text: 哪儿的话，我一点也没怀疑！
    - id: ch02
      title: 公主眼里的骆驼队
      blocks:
        - id: ch02-b01
          speaker: bunniah
          text: 事情偏偏这么巧。邻国的公主正坐在自己的花园里，让侍女给她梳头。侍女使劲拉着梳子，公主呢，头向后仰着，眼睛正望向天空。那只该死的鸢恰好抓着骆驼队，从她头顶高高飞过。骆驼们忽然又狠狠踢了一下，鸢再也抓不住了，一百零一峰骆驼便全掉进了公主的左眼！
        - id: ch02-b02
          speaker: farmer
          text: 可怜的公主。眼睛里进了东西，那可真疼。
        - id: ch02-b03
          speaker: narrator
          text: 巴尼亚越讲越起劲。按他的说法，公主先是用力摇头，接着猛地跳了起来，一只手紧紧捂住刺痛的眼睛。
        - id: ch02-b04
          speaker: princess
          text: 哎哟，我眼睛里进东西了，刺得好疼啊！
          emotion: surprised
        - id: ch02-b05
          speaker: farmer
          text: 可不是吗，眼睛里进东西总会疼。后来她怎么办？
        - id: ch02-b06
          speaker: narrator
          text: 侍女听见喊声，马上跑来帮忙。
        - id: ch02-b07
          speaker: maid
          text: 让我瞧瞧。
        - id: ch02-b08
          speaker: narrator
          text: 她扯了一下公主的眼皮，一峰骆驼便掉了出来。侍女顺手把它塞进口袋，农夫听到这里，也哼了一声。接着，侍女又把头巾的一角拧成细条，伸进公主眼里。剩下整整一百峰骆驼，就这样被她一峰接一峰地钓出来，全都和第一峰一起装进了口袋。
        - id: ch02-b09
          speaker: narrator
          text: 巴尼亚讲到这里，像一路跑得喘不过气似的，大口吸起气来。农夫却一点也不着急，只是慢慢望着他，等他继续。巴尼亚只好承认，自己眼下再也想不出什么了。况且故事到这里已经结束，现在该听听农夫怎么评价了。
        - id: ch02-b10
          speaker: farmer
          text: 这个故事妙极了，句句都是真的！
        - id: ch02-b11
          speaker: bunniah
          text: 那么，该你讲了。我可等不及要听呢，你的故事一定很有趣。
        - id: ch02-b12
          speaker: farmer
          text: 是啊，我想它会很有趣。
    - id: ch03
      title: 马背上的麦田
      blocks:
        - id: ch03-b01
          speaker: farmer
          text: 我父亲从前家境很兴旺。他有五头母牛、三对耕牛、六头水牛，山羊更是多得数不清。不过，这么多家产里，他最心爱的还是一匹母马。那匹马血统纯正，模样又好，实在是一匹难得的好马。
        - id: ch03-b02
          speaker: bunniah
          text: 好了，好了，赶快往下讲！
        - id: ch03-b03
          speaker: farmer
          text: 我正讲着呢，别催。有一天，父亲骑它去赶集，不巧用了一副破马鞍。鞍子磨破了马背，回到家时，伤口已经有巴掌那么大。
        - id: ch03-b04
          speaker: bunniah
          text: 那么，接下来发生了什么？
        - id: ch03-b05
          speaker: farmer
          text: 那时正是六月。你也知道，六月常有卷着沙尘的暴风，有时候又会落雨。可怜的母马伤口里进了沙土，土里偏偏还混着几粒麦种。尘土留在伤口里，又赶上热气和雨水，那些麦粒竟然发芽了！
        - id: ch03-b06
          speaker: bunniah
          text: 麦子遇上合适的时机，本来就会发芽。
        - id: ch03-b07
          speaker: farmer
          text: 没多久，马背上就长出一大片麦田，和一百英亩地里的好庄稼一样茂盛。我们只好雇来二十个人收割。
        - id: ch03-b08
          speaker: bunniah_father
          text: 收麦子嘛，通常都得多雇些人。
        - id: ch03-b09
          speaker: farmer
          text: 那匹母马背上足足收了四百芒德小麦！
        - id: ch03-b10
          speaker: bunniah
          text: 收成倒真不错。
        - id: ch03-b11
          speaker: farmer
          text: 那时你父亲穷得实在可怜，家里的粮食连维持生活都不够。他来到我父亲面前，把两只手合在胸前，低声下气，谦卑得不能再谦卑。
        - id: ch03-b12
          speaker: narrator
          text: 巴尼亚气得从鼻子里重重一哼，又狠狠瞪了同伴一眼。他咬紧嘴唇，到底没敢反驳。
        - id: ch03-b13
          speaker: bunniah
          text: 我整整一星期没有吃东西了。尊贵的老爷，请从粮仓里借我十六芒德小麦吧，我以后一定还你。
        - id: ch03-b14
          speaker: farmer_father
          text: 当然可以，邻居。你需要多少只管拿走，什么时候还得起，什么时候再还给我。
        - id: ch03-b15
          speaker: bunniah
          text: 他拿走麦子以后，又发生了什么？
          emotion: angry
        - id: ch03-b16
          speaker: farmer
          text: 他把十六芒德小麦带回了家，却一直没有归还。这笔债到今天还欠着。有时候我不免琢磨，是不是该为了这笔陈年旧账，到法庭上向你们讨回来。
        - id: ch03-b17
          speaker: narrator
          text: 巴尼亚听完，拇指立刻在右手四根指头上飞快地点来点去，嘴唇也不停地动着。他正在急急忙忙算账。
        - id: ch03-b18
          speaker: farmer
          text: 你这是怎么了？
        - id: ch03-b19
          speaker: bunniah
          text: 小麦便宜些。我赔你小麦。
        - id: ch03-b20
          speaker: narrator
          text: 巴尼亚说得平静，却是绝望后的平静。他清楚地记得，规矩是自己亲口定的。如果说农夫的故事不可信，他便要付出整整一百卢比。两相比较，他只好认下父亲欠的那笔麦债。直到今天，那一带的人遇上欠债不还的家伙，总会这样催他，“把钱给我。不给钱，至少也把麦子给我。”这个故事来自口头传说。
