audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容温厚，悲剧转折处克制而沉静
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    king:
      display_name: 国王
      tts:
        delivery: 威严中带着无奈，激动时直率响亮
        timbre: 浑厚成熟的老年男声
        pace: 适中偏慢
        pitch: 低
    princess:
      display_name: 公主
      tts:
        delivery: 坚定聪慧，温柔时真挚沉静
        timbre: 清澈端庄的年轻女声
        pace: 适中
        pitch: 中高
    widow:
      display_name: 老太太
      tts:
        delivery: 朴实直率，抱怨时干脆利落
        timbre: 略显苍老的女声
        pace: 适中
        pitch: 中
    young_man:
      display_name: 寡妇的儿子
      tts:
        delivery: 坦诚勇敢，历经岁月后沉稳克制
        timbre: 清朗结实的成年男声
        pace: 适中
        pitch: 中
    wise_old_man:
      display_name: 井边老人
      tts:
        delivery: 慈祥郑重，每句忠告都清楚有分量
        timbre: 温厚苍老的男声
        pace: 缓慢
        pitch: 低
    herald:
      display_name: 传令使者
      tts:
        delivery: 响亮清楚，带着公开宣告的气势
        timbre: 洪亮的成年男声
        pace: 适中偏慢
        pitch: 中
    merchant:
      display_name: 商人
      tts:
        delivery: 老练务实，关切时急切真诚
        timbre: 沉稳厚实的成年男声
        pace: 适中
        pitch: 中低
    merchant_1:
      display_name: 商人甲
      tts:
        delivery: 感激急切，声音响亮
        timbre: 粗厚的成年男声
        pace: 适中偏快
        pitch: 中低
    merchant_2:
      display_name: 商人乙
      tts:
        delivery: 疲惫急切，语气恳切
        timbre: 清晰的成年男声
        pace: 适中偏快
        pitch: 中
    merchant_3:
      display_name: 商人丙
      tts:
        delivery: 焦渴急迫，呼喊有力
        timbre: 沙哑的成年男声
        pace: 适中偏快
        pitch: 中
    arab:
      display_name: 阿拉伯人
      tts:
        delivery: 起初威严冷峻，获救后热烈感激
        timbre: 深沉有力的成年男声
        pace: 稍慢
        pitch: 低
    jeweller:
      display_name: 珠宝匠
      tts:
        delivery: 审慎郑重，判断明确
        timbre: 清晰稳重的老年男声
        pace: 稍慢
        pitch: 中低
    son:
      display_name: 儿子
      tts:
        delivery: 正直热诚，动情时急迫而真挚
        timbre: 明亮有力的年轻男声
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 金苹果的选择
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个国王，只有一个女儿。公主从小受尽宠爱，长得美丽，又聪明任性。到了该出嫁的时候，她偏不肯嫁给父王看中的王子，坚持要自己挑丈夫。国王知道女儿一旦拿定主意，谁劝也没用，只好问她究竟想怎么办。
        - id: ch01-b02
          speaker: princess
          text: >-
            一个月以后，把全国的年轻男子都召到我面前。我把这只金苹果交给谁，谁就是我的丈夫。
        - id: ch01-b03
          speaker: king
          text: >-
            可是，亲爱的……
        - id: ch01-b04
          speaker: princess
          text: >-
            我说了，金苹果给谁，我就嫁给谁。
        - id: ch01-b05
          speaker: narrator
          text: >-
            公主的声音抬高了。国王听懂她的意思，只得叹着气照办。一个月后，高的、矮的、黑发的、金发的、富有的、贫穷的年轻人全都赶来，在宫殿前的大院里排成一列列。公主穿着绿袍，金色面纱长长地拖在身后。她手捧苹果，从每个人面前缓缓走过。有一两次，她停下脚步，像是已经选中了谁，可迟疑片刻，又接着向前走。直到最后一排快走完时，她才停在一个青年面前。
        - id: ch01-b06
          speaker: narrator
          text: >-
            旁人看不出这青年有什么特别，更不觉得他会讨姑娘喜欢。比他英俊的少说有一百个，人人也都比他衣着体面。可他坦然迎上公主的目光，微微一笑。公主也笑了，把苹果递到他手里。国王一路看得提心吊胆，本来还暗暗盼着，最好一个人也别让女儿满意。
        - id: ch01-b07
          speaker: king
          text: >-
            一定弄错了！她怎么会想嫁给一个穷寡妇的儿子？那小子身无分文！叫她再走一遍，重新挑一个。我绝不答应！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: >-
            公主又走了两遍，每次仍把苹果交给寡妇的儿子。国王终于发怒了。
        - id: ch01-b09
          speaker: king
          text: >-
            好，你非嫁不可，那就嫁吧！不过，你休想继续住在这里。
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: >-
            公主一句也没有回答，只把头高高一扬，牵起青年的手，和他一同离开城堡。当晚，两人举行了婚礼。仪式结束后，他们回到新郎母亲的家。公主站在门前一看，那间小屋简直比鸡窝大不了多少。老太太见儿子回来时还带着一个新娘，满心都不痛快。
        - id: ch01-b11
          speaker: widow
          text: >-
            我们本来还不够穷吗？这准是哪家的小姐，什么也不会做，连自己都养不活。
        - id: ch01-b12
          speaker: narrator
          text: >-
            公主轻轻抚着她的手臂。
        - id: ch01-b13
          speaker: princess
          text: >-
            母亲，别生气。我很会纺线，在纺车前坐上一整天，也不会断一根线。
          emotion: calm
        - id: ch01-b14
          speaker: narrator
          text: >-
            她确实说到做到，每天坐在纺车前辛勤劳作。可是三个人再怎么努力，家里还是一天比一天穷。半年后，大家商量着让丈夫到邻城找份差事。他在那里遇见一位商人，对方正要带着一队骆驼出远门。骆驼背上装满了各色货物，商人还缺一个帮手。青年恳求商人收自己做仆人。商人答应了，还提前付清一年的工钱。青年回家说了这件事。第二天，他便要告别母亲和妻子，两人都舍不得他走。
        - id: ch01-b15
          speaker: princess
          text: >-
            出门以后，不要忘了我。经过城门边那口井时，去向井边的老人问好，吻他的手，再请他给你几句路上的忠告。
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: >-
            青年独自上路，经过城门附近那口井时，果然看见老人坐在井边。他走过去问候老人，恭敬地吻了老人的手，又请老人指点自己的旅程。
        - id: ch01-b17
          speaker: wise_old_man
          text: >-
            孩子，你来得很好。请记住三句话。心爱的人，在眼中永远最美。忍耐，是通往幸福之路的第一步。耐心等待的人，终会获胜。
    - id: ch02
      title: 魔井与三颗石榴
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            青年谢过老人，继续上路。第二天清早，商队启程。日落以前，他们来到第一处歇脚地。那里有几口井，另一支商队已经扎下帐篷。可是这片岩石遍地的荒原很久没有下雨，人和骆驼都渴得嗓子冒烟。半英里外倒还有一口井，里面从来不缺水，可取水的人必须沿绳子下到很深的井底。凡是下去过的人，没有一个回来。
        - id: ch02-b02
          speaker: narrator
          text: >-
            羊皮袋里装不满水，两支商队谁也不敢继续深入沙漠。青年抵达的那个晚上，商人们便约定要拿出重赏，寻找敢下魔井的人。第二天日出时，传令使者绕着营地一遍遍高声宣布。
        - id: ch02-b03
          speaker: herald
          text: >-
            谁愿意下魔井，为八十位商人和所有骆驼取水，就能从每位商人手里得到一千皮阿斯特！
        - id: ch02-b04
          speaker: narrator
          text: >-
            青年早就听过魔井的传说，也明白自己很可能送命。可要是活着回来，他便能得到八万皮阿斯特。他犹豫一会儿，叫住了使者。
        - id: ch02-b05
          speaker: young_man
          text: >-
            我愿意下去。
        - id: ch02-b06
          speaker: merchant
          text: >-
            你疯了吗？你还这么年轻，不能这样白白送命！快把使者追回来，说你不去了。
          emotion: surprised
        - id: ch02-b07
          speaker: narrator
          text: >-
            青年摇头不肯。商人劝不动他，只能让步。
        - id: ch02-b08
          speaker: merchant
          text: >-
            这是你自己的选择。你一定要去，我也拦不住。可你若能回来，我送你一整头骆驼驮的货物，再把最好的骡子也送给你。
        - id: ch02-b09
          speaker: narrator
          text: >-
            商人碰了碰自己的头巾，算是提前向他告别，随后转身进了帐篷。他刚进去，营地里便有一大群人涌出来，紧紧围住青年。
        - id: ch02-b10
          speakers: [merchant_1, merchant_2, merchant_3]
          ensemble: chorus
          text: >-
            真不知道该怎么谢你！我们和骆驼都快渴死了。绳子已经备好，我们这就放你下去。
        - id: ch02-b11
          speaker: young_man
          text: >-
            那就走吧。
        - id: ch02-b12
          speaker: narrator
          text: >-
            到了井边，人们把绳子缚在青年腋下，递给他一只大羊皮水袋，慢慢将他放到井底。清泉正从岩石间涌过。他俯身要喝，一个高大的阿拉伯人突然出现，厉声命令他。
        - id: ch02-b13
          speaker: arab
          text: >-
            跟我走！
        - id: ch02-b14
          speaker: narrator
          text: >-
            青年站起身，心想自己的最后时刻准是到了。可他没有别的办法，只好跟着阿拉伯人跨过那条小河，走进对岸一座灯火通明的大厅。阿拉伯人在那里坐下，又把两个男孩拉到身旁，一个皮肤黝黑，一个皮肤白皙，然后叫这个陌生客人回答问题。
        - id: ch02-b15
          speaker: arab
          text: >-
            我问你一个问题。答对了，你可以活命。答错了，就得像以前那些人一样把脑袋留下。你说，在我心里，这两个孩子哪一个更漂亮？
        - id: ch02-b16
          speaker: narrator
          text: >-
            这问题乍听并不难。白皮肤的孩子美得世间少有，他的兄弟却生得十分丑陋，即使在黑人当中也算难看。青年正要把眼前所见说出来，井边老人的第一句忠告忽然闪过脑海。他赶忙改口。
        - id: ch02-b17
          speaker: young_man
          text: >-
            人最爱的那个，在自己眼中永远最美。
        - id: ch02-b18
          speaker: arab
          text: >-
            你救了我！你不知道，先前那些人的愚蠢让我吃了多少苦。一个邪恶的精灵罚我困在这里，非等到有人答对这个问题，我才能离开。你为何来到这里？我该怎么报答你？
          emotion: happy
        - id: ch02-b19
          speaker: young_man
          text: >-
            请帮我取够水。外面有八十名商人，还有他们的骆驼，都快渴死了。
        - id: ch02-b20
          speaker: arab
          text: >-
            这不难。带上三只苹果。装满水袋，准备上去时，把第一只放在井底。升到半途，丢下第二只。到了井口，再扔下第三只。照做便不会受伤。还有三只石榴，一只绿的，一只红的，一只白的，也拿去吧。总有一天，你会用到它们。
        - id: ch02-b21
          speaker: narrator
          text: >-
            青年装满水袋，照着阿拉伯人的话，先后放下三只苹果，终于平安踏上井外遍布岩石的荒地。商人们早已等得心焦。啊，他们实在渴坏了！众人先喝，骆驼也跟着喝，可所有人和牲畜都喝足以后，那只羊皮袋看上去居然还和起初一样满。大家感激他救了两支商队，纷纷把许诺的赏金塞进他手中。他的主人也遵守诺言，让他任意挑选货物，又送给他最好的一头骡子。
        - id: ch02-b22
          speaker: narrator
          text: >-
            寡妇的儿子终于成了富人。后来，商人卖完全部货物，回到自己的故乡。青年雇了一个人，把赚来的钱和那头骡子送回家，交给妻子。他又想到，三只石榴一直放在头巾里，说不定哪天会掉出来，不如也送回去。可伸手一摸，果子早已不见了，原来的地方只剩下绿、白、红三颗珍贵宝石。
    - id: ch03
      title: 宝石与新宫殿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            此后很长一段日子，青年都留在商人身边。商人越来越信任他，渐渐把所有生意都交给他打理，每次赚钱也分给他很大一份。后来商人去世，青年原本想回家，商人的遗孀却求他留下帮助自己。他答应下来。直到有一天，他从梦中猛然惊醒，这才记起，自己离开妻子和母亲竟已有整整二十年。
        - id: ch03-b02
          speaker: young_man
          text: >-
            我该回去见妻子了。以后有事，只管派信使找我。眼下该办什么，我都交代给哈桑了。
        - id: ch03-b03
          speaker: narrator
          text: >-
            青年骑上骆驼，踏上归途。原来，他刚跟随商人不久，公主便生了一个男孩。她和老太太终日辛劳，才换来孩子的食物和衣裳。钱财与三颗宝石送到后，她们终于不用再干活。公主见惯珠宝，一眼就认出那不是果子。老太太却从没见过这样的东西，只当是普通石榴，还想拿给孩子吃。公主赶紧夺下来，藏进衣襟。老太太为这件事气得不轻。公主只好立刻去市场，买回能找到的三只最好的石榴，交给她拿去给小男孩。
        - id: ch03-b04
          speaker: narrator
          text: >-
            公主又给三个人买了漂亮衣裳。大家一换上，立刻显得十分气派。她把一颗宝石装进银盒，用绣金手帕包好，还在老太太的衣袋里塞满金银钱币。
        - id: ch03-b05
          speaker: princess
          text: >-
            母亲，请把这颗宝石献给国王。他若问您要什么回报，就请他亲手签署一道盖有印玺的文书，准许您做任何想做的事，谁也不能干涉。临走以前，再把衣袋里的钱分给宫中仆人。
        - id: ch03-b06
          speaker: narrator
          text: >-
            老太太带着银盒来到宫殿，按照公主的安排，把宝石献了上去。宫里的人从没见过那么美的红宝石，只好把城中最有名的珠宝匠请来。可他仔细看了又看，也说不出一个确切价钱，最后只能用一个比方回答。
        - id: ch03-b07
          speaker: jeweller
          text: >-
            假如一个男孩竭尽全力把石子抛上天空，而您能把黄金堆到石子飞过的最高处，这么多黄金也买不下它。
        - id: ch03-b08
          speaker: narrator
          text: >-
            国王听完，脸色顿时沉了下来。自从看见这颗红宝石，他就舍不得把它还回去，可即使掏空国库，也付不起它的价钱。他沉默了好一会儿，反复琢磨还能拿出什么来交换，最后才开口询问老太太。
        - id: ch03-b09
          speaker: king
          text: >-
            我拿不出等值的钱。你愿意拿别的东西交换吗？
        - id: ch03-b10
          speaker: widow
          text: >-
            请您给我一道亲手签名、盖有印玺的文书，准许我随心做事，不受任何人阻拦。
        - id: ch03-b11
          speaker: narrator
          text: >-
            国王没想到只用这么小的代价，就能得到自己渴望的宝石，立刻签好文书，盖上印玺。老太太告辞回家。那颗绝世红宝石的消息很快传遍各国，一批又一批使者来到小屋，追问是否还有宝石出售。每位国王都急于把珍宝弄到手，命令使者一定要开出高过别人的价钱。公主就这样卖掉另外两颗，所得的金币若一枚接一枚铺开，足以从这里一直铺到月亮。
        - id: ch03-b12
          speaker: narrator
          text: >-
            公主拿到钱后，做的第一件事，就是在那间小屋旁盖起一座宫殿。宫殿由黄金柱子托起，柱身上嵌着硕大的钻石，日夜都在放射光芒。父王从战场归来，最先听见的便是这座奇异宫殿的消息。他赶去观看，只见门口站着一个二十岁的年轻人。那其实是他的亲外孙，可祖孙二人都不知道。国王十分喜欢这青年的仪表，当场把他带回王宫，还任命他统领全国军队。
    - id: ch04
      title: 树上的误会
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            不久，寡妇的儿子终于回到故国。母亲那间小屋果然还在，和他离开时没有两样，旁边却多了一座陌生而华美的宫殿。他满心疑问。妻子和母亲去了哪里？宫殿里住的又是谁？可他不愿在街上拦住陌生人询问，生怕还没弄清真相，便先泄露自己的身份。于是，他爬上宫殿对面的一棵树，藏在枝叶间静静观察。
        - id: ch04-b02
          speaker: narrator
          text: >-
            过了一会儿，一位夫人走出宫殿，开始采摘门廊边垂下来的玫瑰和茉莉。他只看一眼，二十年的光阴便仿佛一下消失了。那正是他的妻子，而且看起来几乎还像分别那天一样年轻美丽。他正要跳下树，奔到她身边，一个年轻人却走了过来，还亲昵地搂住她的脖子。丈夫顿时怒火中烧，摘下弓，搭上箭，立刻拉开弓弦。可就在箭将要飞出去时，他忽然想起老人的话。
        - id: ch04-b03
          speaker: wise_old_man
          text: >-
            忍耐，是通往幸福之路的第一步。
        - id: ch04-b04
          speaker: narrator
          text: >-
            他慢慢放下了弓。公主却又拉低年轻人的头，在他两边脸颊上各吻一下。树上的丈夫再次被怒火冲昏头脑，一把抓起挂在树枝上的弓。那句多年前听过的话，又在耳边响起。
        - id: ch04-b05
          speaker: wise_old_man
          text: >-
            耐心等待的人，终会获胜。
        - id: ch04-b06
          speaker: narrator
          text: >-
            弓再一次从他手中垂落。就在这时，四周一片寂静，那个年轻人的声音清清楚楚穿过空气，传到了树上。
        - id: ch04-b07
          speaker: son
          text: >-
            母亲，您真的没有父亲的消息吗？他还活着吗？难道他永远都不会回来？
        - id: ch04-b08
          speaker: princess
          text: >-
            唉，孩子，我也不知道该怎么回答。他离家谋生已经二十年了，这些年里，我只得到过他一次消息。你今天怎么忽然想起父亲？
          emotion: sad
        - id: ch04-b09
          speaker: son
          text: >-
            昨晚我梦见他就在这里。我这才想起，自己其实还有一个父亲，可我连他的经历都不清楚。求您把知道的全告诉我吧。
        - id: ch04-b10
          speaker: narrator
          text: >-
            母子俩就站在茉莉花下。公主把丈夫当年如何离家、又如何捎回钱财与宝石的往事从头讲起。儿子第一次听见父亲完整的故事，树上的男人也一字不漏地听着。故事说完，年轻人心里十分痛苦，不由得绞起双手。
        - id: ch04-b11
          speaker: son
          text: >-
            我是全国军队的统帅，您是国王的女儿，我们还住在世上最壮丽的宫殿里。可父亲在哪里，我们竟一无所知。他也许正穷困潦倒，日子悲惨。明天我就请国王给我一支军队。我要走遍天下，一直找到父亲为止。
          emotion: sad
    - id: ch05
      title: 等待后的团聚
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            树上的男人终于爬下来，走到母子面前，把妻子和儿子一同紧紧抱进怀里。一家人有太多事要说，三个人整整谈了一夜。太阳升起时，他们还在交谈。等到适合进宫的时辰，他才离开家人，前去拜见国王。他先向国王致敬，再把这些年的经历，以及眼前这一家人各自的真正身份，全都讲明。
        - id: ch05-b02
          speaker: narrator
          text: >-
            国王这才知道，那个自己早已原谅、又思念多年的女儿，原来一直住在城门外。更让他高兴的是，她正是那位深受自己喜爱的年轻统帅的母亲。
        - id: ch05-b03
          speaker: king
          text: >-
            这一切早已由命运写定！从今以后，天下人都会知道你是我的女婿。将来，你还要继承我的王位。
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: >-
            男人低头行礼。
        - id: ch05-b05
          speaker: narrator
          text: >-
            他耐心等待，终于赢得了一切。
