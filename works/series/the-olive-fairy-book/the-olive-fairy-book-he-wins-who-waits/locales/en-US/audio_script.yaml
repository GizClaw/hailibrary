  chapters:
    - id: ch01
      title: The Golden Apple
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once upon a time, a king had one daughter. Everyone had spoiled her from the day she was born. She grew up beautiful, clever, and strong-willed. When it was time for her to marry, she rejected the prince her father preferred and announced that she would choose her own husband. Long experience had taught the king how little use there was in opposing her once her mind was made up. So he meekly asked what she wanted him to do.
        - id: ch01-b02
          speaker: princess
          text: >-
            Call every young man in the kingdom here one month from today. I will give one of them this golden apple, and that man will be my husband.
        - id: ch01-b03
          speaker: king
          text: But, my dear, surely you cannot mean—
        - id: ch01-b04
          speaker: princess
          text: >-
            The man who receives this golden apple will be my husband.
        - id: ch01-b05
          speaker: narrator
          text: >-
            This time she spoke more loudly. The king understood the warning. With a sigh, he gave the order she demanded.
        - id: ch01-b06
          speaker: narrator
          text: >-
            A month later, the young men came. They were tall and short, dark and fair, rich and poor, and they stood in rows across the palace courtyard. The princess walked slowly past them in green robes, with a golden veil streaming behind her and the apple in her hand. Once or twice she paused, but each time she moved on. Near the end of the final row, she stopped before an ordinary-looking youth. The people watching could see nothing remarkable about him, nothing that should catch a princess's eye. A hundred men there were handsomer, and every one of them was better dressed. Yet he met her eyes frankly and smiled. She smiled back and offered him the apple.
        - id: ch01-b07
          speaker: king
          text: >-
            There must be some mistake! She cannot truly mean to marry a poor widow's son who has not a penny in the world. Tell her I refuse. She must walk through the rows again and choose someone else.
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: >-
            The king had watched her anxiously, hoping that none of the candidates would please her. At his command, the princess went through the rows a second time, then a third. Each time, she placed the apple in the widow's son's hand.
        - id: ch01-b09
          speaker: king
          text: >-
            Marry him, then, if you insist! But you will not remain here afterward.
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: >-
            The princess said nothing. She lifted her head, took the young man by the hand, and left the castle with him. They were married that evening. Afterward, they went to his mother's home, a house that seemed no larger than a hen-coop to the princess.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The widow was not pleased when her son came in with a bride.
        - id: ch01-b12
          speaker: widow
          text: >-
            We were poor enough already. And now you have brought home some fine lady who probably cannot earn a living at all.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The princess gently stroked the old woman's arm.
        - id: ch01-b14
          speaker: princess
          text: >-
            Please do not be upset, dear mother. I spin very well. I can work at my wheel all day without snapping a single thread.
          emotion: calm
        - id: ch01-b15
          speaker: narrator
          text: >-
            She proved true to her word. Still, no matter how hard all three worked, they grew poorer and poorer. After six months, they agreed that her husband must seek work in the neighboring town.
    - id: ch02
      title: Three Pieces of Counsel
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            In town, the widow's son met a merchant preparing for a long journey. The merchant had a train of camels loaded with every kind of merchandise and needed another servant. The young man begged for the place. The merchant hired him and paid his whole year's wages in advance.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The young man carried the money home. The next morning, he said goodbye to his mother and his wife. Both were deeply sad to see him go. The princess put her arms around his neck and whispered to him.
        - id: ch02-b03
          speaker: princess
          text: >-
            Do not forget me while you are away. When you reach the well near the city gate, you will see an old man sitting there. Stop and greet him. Kiss his hand, and ask what advice he can give you for your journey.
          emotion: sad
        - id: ch02-b04
          speaker: narrator
          text: >-
            He set out. At the well, he found the old man and did exactly as his wife had asked.
        - id: ch02-b05
          speaker: wise_man
          text: >-
            My son, you did well to come. In return, remember three things. The one the heart loves is always the most beautiful. Patience is the first step on the road to happiness. And he wins who waits.
        - id: ch02-b06
          speaker: narrator
          text: >-
            The young man thanked him and continued on his way. Early the next morning, the caravan departed. Before sunset it reached a stopping place among some wells, where another group of merchants had already made camp.
        - id: ch02-b07
          speaker: narrator
          text: >-
            No rain had fallen for a long time in that rocky land. Men and animals alike were burning with thirst. There was another well half a mile away, and that well always held water. But it was terribly deep, and no one who had gone down into it had ever returned.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The caravans could not cross the desert until they had filled their goatskin bags. That night, the merchants promised a great reward to anyone brave enough to enter the enchanted well. At sunrise, a herald walked around the camp and woke the widow's son with his call.
        - id: ch02-b09
          speaker: herald
          text: >-
            Every merchant here will pay one thousand piastres to the man who risks his life and brings water to us and our camels!
        - id: ch02-b10
          speaker: narrator
          text: >-
            The young man hesitated. He had heard the dreadful stories about that well long ago. Yet if he returned alive, he would own eighty thousand piastres. As the herald passed his tent, the young man called to him.
        - id: ch02-b11
          speaker: widows_son
          text: I will go down.
        - id: ch02-b12
          speaker: merchant
          text: >-
            That is madness! You are far too young to throw your life away. Run after the herald and withdraw your offer.
          emotion: fearful
        - id: ch02-b13
          speaker: narrator
          text: >-
            The young man shook his head. His master saw that nothing would change his mind.
        - id: ch02-b14
          speaker: merchant
          text: >-
            Very well. It is your choice. If you must go, then go. But if you ever return, I will give you a camel-load of goods and my finest mule as well.
        - id: ch02-b15
          speaker: narrator
          text: >-
            He touched his turban in farewell and entered the tent. At once, men streamed out from every part of the camp and crowded around the youth.
        - id: ch02-b16
          speakers: [merchant_1, merchant_2, merchant_3]
          ensemble: chorus
          text: >-
            How can we ever thank you? We and our camels are almost dead from thirst. Here is the rope to lower you into the well.
        - id: ch02-b17
          speaker: widows_son
          text: Then come with me.
        - id: ch02-b18
          speaker: narrator
          text: >-
            Together, they set out for the enchanted well.
    - id: ch03
      title: The Enchanted Well
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At the well, the men knotted the rope firmly under the young man's arms. They handed him a large goatskin bottle and slowly lowered him to the bottom. A clear stream bubbled over the rocks below. He bent to drink, but a huge Arab suddenly appeared before him and spoke in a commanding voice.
        - id: ch03-b02
          speaker: arab
          text: Come with me!
        - id: ch03-b03
          speaker: narrator
          text: >-
            The widow's son stood up, certain that his final hour had arrived. There was nothing else he could do, so he followed. The Arab led him across the little river and into a brilliantly lit hall. Then the Arab sat down and drew two boys toward him. One boy was black, and the other was white.
        - id: ch03-b04
          speaker: arab
          text: >-
            I will ask you one question. Answer correctly, and I will spare your life. Answer wrongly, and you will lose your head, just as many others did before you. Which of my two children do I think is more handsome?
        - id: ch03-b05
          speaker: narrator
          text: >-
            The answer seemed obvious. The white boy was as beautiful as any child could be, while his brother was very ugly. The young man was just about to choose when the old man's first piece of counsel flashed into his mind. He answered quickly.
        - id: ch03-b06
          speaker: widows_son
          text: The child we love best always seems the most handsome.
        - id: ch03-b07
          speaker: arab
          text: >-
            You have set me free! If only you knew how I suffered because everyone else answered so foolishly. A wicked genius condemned me to remain here until someone gave the right reply. Now tell me what brought you down here, and how I can reward you.
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: >-
            The Arab sprang up and embraced him. The young man explained what he needed.
        - id: ch03-b09
          speaker: widows_son
          text: >-
            Help me draw enough water for my caravan. Eighty merchants and all their camels are dying of thirst.
        - id: ch03-b10
          speaker: arab
          text: >-
            That will be easy. Take these three apples. Fill your goatskin, and when they begin pulling you up, place one apple on the ground. Drop the second halfway to the surface, and drop the third when you reach the top. Follow those directions, and no harm will come to you. Take these three pomegranates too, one green, one red, and one white. Someday you will find a use for them.
        - id: ch03-b11
          speaker: narrator
          text: >-
            The young man followed every instruction. He emerged onto the rocky plain, where the merchants waited in great anxiety. They drank eagerly, and so did their thirsty camels. Yet even after them all, the goatskin still seemed as full as before.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Grateful to be saved, the merchants pressed their promised money into his hands. His own master kept his promise too. He told the young man to choose whatever goods he wanted, along with a mule to carry them. At last, the widow's son was rich.
    - id: ch04
      title: The Three Precious Stones
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            When the merchant finished selling his wares and returned to his own city, the young man hired someone to carry the money and the mule home to his wife. He decided to send the pomegranates too. They might fall from his turban if he kept them there. But when he reached inside, the fruit was gone. In its place lay three precious stones, one green, one white, and one red.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The young man stayed with the merchant for many years. Little by little, his master came to trust him with the whole business and gave him a large share of every profit they made. When the merchant died, the young man wished to go home. But the merchant's widow begged him to remain and help her, and he stayed. Then one morning he woke with a start. Twenty years had passed since he left his wife.
        - id: ch04-b03
          speaker: widows_son
          text: >-
            I want to see my wife. If you ever need my help, send a messenger for me. For now, I have told Hassan how to manage everything.
        - id: ch04-b04
          speaker: narrator
          text: >-
            He mounted a camel and began the journey home.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Soon after he had entered the merchant's service, the princess had given birth to a boy. She and the widow worked from morning to night to provide the baby with food and clothes. Once the money and the pomegranates arrived, they no longer needed to labor.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The princess saw at once that the three objects were precious stones, not fruit. Her mother-in-law had never been used to jewels. She thought they were ordinary pomegranates and wanted to feed them to the child. When the princess snatched them away and hid them in her dress, the old woman grew angry. So the princess went to the market, bought the three finest real pomegranates she could find, and gave those to the widow for the little boy.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Next, the princess bought splendid new clothes for the whole family. Once they were dressed, they looked as fine as anyone could wish. Then she put one of her husband's jewels into a small silver box and wrapped the box in a gold-embroidered handkerchief. She filled the widow's pockets with gold and silver coins and gave her careful instructions.
        - id: ch04-b08
          speaker: princess
          text: >-
            Dear mother, take this jewel to the palace and offer it to the king. If he asks what you want in return, request a paper bearing his seal. It must declare that no one may interfere with anything you choose to do. Before you leave, share the money in your pockets among the palace servants.
        - id: ch04-b09
          speaker: narrator
          text: >-
            The widow carried the box to the palace. No one there had ever seen such a magnificent ruby. The king summoned the most famous jeweller in the city and asked him to name its value. The jeweller could give only one answer.
        - id: ch04-b10
          speaker: jeweller
          text: >-
            Let a boy throw a stone into the air with all his strength. Even if you could pile gold as high as that stone flies, it would not be enough to purchase this ruby.
        - id: ch04-b11
          speaker: narrator
          text: >-
            The king's face fell. Now that he had seen the ruby, he could not bear to surrender it. Yet his entire treasury could not meet its price. He sat silently for a time, trying to think of another offer.
        - id: ch04-b12
          speaker: king
          text: >-
            I cannot pay what this jewel is worth. Is there something else you would accept for it?
        - id: ch04-b13
          speaker: widow
          text: >-
            Give me a paper signed by your hand and stamped with your seal. It must say that I may do whatever I wish without anyone stopping me.
        - id: ch04-b14
          speaker: narrator
          text: >-
            The king was delighted to gain the ruby so cheaply. He gave her the paper at once, and the widow returned home.
    - id: ch05
      title: The Palace Beside the Cottage
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            News of the marvelous ruby traveled far and wide. Envoys came to the little house to ask whether there were more stones for sale. Every king wanted the treasure so badly that he ordered his messenger to outbid all the others. In the end, the princess sold the two remaining jewels for an enormous fortune. If all those gold pieces had been spread out in a line, they would have reached from the earth to the moon.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Her first act was to build a palace beside the cottage. It stood on pillars of gold set with great diamonds that blazed by day and by night.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The princess's father had been away at war. When he returned, the wonderful new palace was the first news he heard, and he hurried straight there to see it with his own eyes. A young man of twenty stood in the doorway. He was the king's own grandson, though neither of them knew it, and neither guessed at the bond between them. The king was so pleased by the young man's appearance that he carried him back to the royal palace. There he gave the youth command of the whole army.
    - id: ch06
      title: He Wins Who Waits
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Not long afterward, the widow's son returned to his native land. The tiny cottage where he had once lived with his mother still stood there. Beside it rose a magnificent palace he had never seen. He wondered what had happened to his wife and mother, and who could live in such a place. Rather than reveal himself by questioning strangers, he climbed a tree across from the palace and watched.
        - id: ch06-b02
          speaker: narrator
          text: >-
            After a while, a lady came outside to gather roses and jasmine near the porch. In an instant, the twenty years since he had last seen her seemed to vanish. He knew his own wife. She looked almost as young and beautiful as she had on the day they parted.
        - id: ch06-b03
          speaker: narrator
          text: >-
            He was ready to leap from the tree and hurry to her when a young man joined her and put an affectionate arm around her neck. The husband flew into a rage and drew his bow. Before he released the arrow, the wise man's words returned to him. Patience is the first step on the road to happiness. He lowered the bow.
        - id: ch06-b04
          speaker: narrator
          text: >-
            Then the princess drew the young man's head toward her and kissed both his cheeks. Blind fury seized the watcher again. He snatched up the bow from the branch where it hung. Once more, words from long ago seemed to ring in his ears. He wins who waits. The bow dropped to his side. Through the still air, he heard the young man speak.
        - id: ch06-b05
          speaker: son
          text: >-
            Mother, can you tell me nothing about my father? Is he still alive? Will he never come home to us?
        - id: ch06-b06
          speaker: princess
          text: >-
            Oh, my son, how can I answer that? He left twenty years ago to make his fortune. In all that time, I have heard from him only once. Why are you thinking about him now?
          emotion: sad
        - id: ch06-b07
          speaker: son
          text: >-
            I dreamed last night that he was here. Then I remembered something I had almost forgotten. I have a father, yet I hardly know his story. Please tell me everything you can about him.
        - id: ch06-b08
          speaker: narrator
          text: >-
            Beneath the jasmine, the son heard his father's history. The man hidden in the tree heard it too. When the tale was finished, the young commander twisted his hands in pain.
        - id: ch06-b09
          speaker: son
          text: >-
            I command the king's army. You are the king's daughter, and we live in the finest palace in the world. But we do not even know where my father is. He may be living somewhere in poverty and misery. Tomorrow I will ask the king for soldiers. I will search the whole earth until I find him.
          emotion: sad
        - id: ch06-b10
          speaker: narrator
          text: >-
            At those words, the man could remain hidden no longer. He climbed down from the tree and gathered his wife and son into his arms. The long separation was over, and the three of them were together at last. They talked through the entire night. When the sun rose, it found them talking still.
    - id: ch07
      title: The King After Him
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            As soon as the proper hour came, the widow's son went to the royal palace. He paid homage to the king, told him everything that had happened, and explained who each of them truly was.
        - id: ch07-b02
          speaker: narrator
          text: >-
            The king was overjoyed. He had forgiven his daughter long ago and missed her bitterly. Now he learned that she had been living at his very gates, and that the young commander he loved so well was her son.
        - id: ch07-b03
          speaker: king
          text: >-
            This was written before it happened! Before all the world, you are my son-in-law, and after me, you shall be king.
          emotion: happy
        - id: ch07-b04
          speaker: narrator
          text: >-
            The man bowed his head.
        - id: ch07-b05
          speaker: narrator
          text: >-
            He had waited, and he had won.
