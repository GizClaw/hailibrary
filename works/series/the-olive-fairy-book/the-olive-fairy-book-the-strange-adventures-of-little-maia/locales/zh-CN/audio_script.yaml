audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    woman:
      display_name: 玛雅的养母
      tts:
        delivery: 温柔质朴，孤独时怅惘，欢喜时热切
        timbre: 温暖柔和的成年女声
        pace: 适中
        pitch: 中
    witch:
      display_name: 女巫
      tts:
        delivery: 从容神秘，说话爽快而胸有成竹
        timbre: 清亮略带沙哑的老年女声
        pace: 舒缓
        pitch: 中高
    maia:
      display_name: 玛雅
      tts:
        delivery: 天真善良，柔弱中有勇气，悲喜真切
        timbre: 轻盈清澈的少女声
        pace: 适中，紧张时稍快
        pitch: 高
