        delivery: 欢快活泼，声音短促悦耳
        timbre: 清脆的童声
        pace: 偏快
        pitch: 高
    bird_2:
      display_name: 林中小鸟乙
      tts:
        delivery: 欢快活泼，声音短促悦耳
        timbre: 轻巧的童声
        pace: 偏快
        pitch: 高
    bird_3:
      display_name: 林中小鸟丙
      tts:
        delivery: 欢快活泼，声音短促悦耳
