        timbre: 清朗轻快的年轻男声
        pace: 适中偏快
        pitch: 中高
    flower_king:
      display_name: 花精灵国王
      tts:
        delivery: 温柔庄重，迎接玛雅时真挚欣喜
        timbre: 明亮柔和的年轻男声
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 花中诞生的小姑娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个女人住在森林正中央。她有一座漂亮的小屋，还有一方花园。夏天，她照料花草，听鸟儿在树上唱歌，过得很快活。可冬天一来，积雪铺满地面，狼群在门外嗥叫，她就既孤独又害怕。雪下得越大，她越盼望有个孩子陪自己说话，哪怕那孩子再小也好。终于有一天，满屋的寂静让她再也待不下去。她决定走到最近的村庄，求人卖给她一个孩子，或是借一个也行。
        - id: ch01-b02
          speaker: narrator
          text: 雪深得没过脚踝。她走了将近一个钟头，才走出几百码，只好停下来张望。
        - id: ch01-b03
          speaker: woman
          text: 再这样走下去，还没到第一户人家，天恐怕就黑了。
        - id: ch01-b04
          speaker: narrator
          text: 这时，一个戴高顶帽的小个子女人忽然从树后出来，站到她面前。那其实是个女巫。
        - id: ch01-b05
          speaker: witch
          text: 这种天气可不好走路。你要去很远吗？
        - id: ch01-b06
          speaker: woman
          text: 我想到村里去，可这场雪太深了，真不知道要怎样才能走到。
        - id: ch01-b07
          speaker: witch
          text: 那么，是什么要紧事，让你非去村里不可？
        - id: ch01-b08
          speaker: woman
          text: 屋里冷冷清清，连个说话的人也没有。我实在住不下去了，想找个孩子陪伴我。她有多小都没关系。
        - id: ch01-b09
          speaker: witch
          text: 原来只是这件事，那你不必再往前走。瞧，我口袋里有一粒大麦。十二先令卖给你，算是给你一个人情。把它种进花盆，多浇些水。过不了几天，你会看到一件奇妙的事。
        - id: ch01-b10
          speaker: narrator
          text: 女巫的许诺让女人重新有了精神。她欢欢喜喜地付了十二先令，一回到家，就在花盆里挖个小洞，把种子埋进去。整整三天，她几乎没有把眼睛从暖和角落里的花盆上移开。第三天早晨，她醒来一看，睡梦中盆里竟冒出一株高高的红郁金香，绿叶紧紧护在四周。
        - id: ch01-b11
          speaker: woman
          text: 多美的花呀！
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: 她俯身亲吻花朵，红色花瓣忽然张开。花心里坐着一个只有一英寸高的小姑娘，身下是紫罗兰做的褥子，身上盖着玫瑰花瓣的被子。她睁开眼睛，对女人微笑，仿佛两人早已相识了一辈子。
        - id: ch01-b13
          speaker: woman
          text: 我的小宝贝，有了你，我再也不会孤单了！
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: 小婴孩点点头，仿佛在说，那当然不会。女人马上找来一只宽敞的核桃壳，在里面厚厚铺上白缎，再放进紫罗兰褥子。她给孩子取名玛雅，让她睡在这张小床里。核桃壳摆在养母睡觉处旁边的椅子上。每天早晨，女人都会轻轻抱出玛雅，让她坐到一大碗清水中央的叶片上，再交给她两根白马毛当桨。玛雅可以自己划着叶片，在碗里到处游荡。她是世上最快乐的小婴孩，从早到晚都用一门只有自己懂得的语言唱歌。
    - id: ch02
      title: 睡莲叶上的逃亡
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 她们亲亲热热地过了几个星期，彼此陪伴多久也不会厌倦，一场灾祸却忽然降临。一天夜里，养母辛苦了一整天，睡得正熟。敞开的窗户外忽然跳进一只又大又丑、浑身湿漉漉的青蛙。她来到核桃摇篮前，久久盯着玫瑰花被下熟睡的玛雅。
        - id: ch02-b02
          speaker: old_frog
          text: 这小姑娘长得真俊。给我儿子做妻子正合适。
        - id: ch02-b03
          speaker: narrator
          text: 老青蛙一口叼起核桃摇篮，跳到花园里的小溪边，又带回自己在泥里的家。
        - id: ch02-b04
          speaker: old_frog
          text: 儿子，快来看看我给你带了什么！
        - id: ch02-b05
          speaker: frog_son
          text: 呱呱呱，我真高兴！
          emotion: happy
        - id: ch02-b06
          speaker: old_frog
          text: 嘘，小点声，别把她吵醒。我要让她做你的妻子。咱们预备婚礼时，先把她放到溪水中央的睡莲叶上，她就逃不掉了。
        - id: ch02-b07
          speaker: narrator
          text: 清晨第一缕阳光照下来，玛雅在那座漂浮的绿色牢狱里醒了。她又怕又迷惑，直起身子，沿着叶片四处寻找逃路。哪里也走不了，她只好重新坐下，伤心地哭。老青蛙正在沼泽底下的家里忙碌。她把灯心草编成柔软的地毯，好让玛雅踩在脚下，又把芦苇和葡萄藤缠在门口，要给新娘一个漂亮的住处。忙碌中的老青蛙终于听见了哭声，心里倒很怜悯。
        - id: ch02-b08
          speaker: old_frog
          text: 可怜的孩子一定又孤单又难过。我马上就收拾好了，再和儿子去接她。她见到他这样英俊，一定会笑起来。
        - id: ch02-b09
          speaker: narrator
          text: 母子俩很快来到叶片旁。老青蛙骄傲地把儿子推到前面。
        - id: ch02-b10
          speaker: old_frog
          text: 这就是你未来的丈夫。你见过比他更出众的吗？
        - id: ch02-b11
          speaker: narrator
          text: 玛雅只看了一眼，哭得更厉害了。小鱼们纷纷游过来，很快明白了发生的事。
        - id: ch02-b12
          speakers: [fish_1, fish_2, fish_3]
          ensemble: chorus
          text: 这么漂亮的人儿，不能逼她嫁给不喜欢的丈夫，何况他还这么丑！我们来救她。
        - id: ch02-b13
          speaker: narrator
          text: 小鱼轮流去咬睡莲叶靠近根部的茎，咬了许久，终于把它彻底咬断。它们一起衔住叶片，带着玛雅越走越远，直到涓涓小溪变成宽阔的大河。起初玛雅还有些不安，等她确信青蛙再也追不上来，这趟航行便变得无比快活。她坐着绿色小船经过一座又一座城镇，岸上的人全都停下脚步，转头看她。
        - id: ch02-b14
          speakers: [onlooker_1, onlooker_2, onlooker_3]
          ensemble: chorus
          text: 多可爱的小姑娘！她究竟是从哪里来的？
        - id: ch02-b15
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: 她真是个可爱的小姑娘！
        - id: ch02-b16
          speaker: narrator
          text: 一只蓝蝴蝶爱上玛雅，怎么也不肯离开。她解下和他同样颜色的腰带，系在蝴蝶身上。有了这匹奇特的新马，她走得更快了。偏偏一只大金龟子嗡嗡飞过河面，看见玛雅，一把将她抓进爪中。蝴蝶吓得拼命挣扎，腰带上的结被扯开，他飞进了阳光。玛雅却被带走了。
        - id: ch02-b17
          speaker: narrator
          text: 金龟子倒肯从花中采来蜂蜜，给玛雅做晚饭，还一连几次夸她漂亮。可他毕竟突然把她从河上掳走，玛雅和他在一起始终不能安心。金龟子看出了她的不自在，便把自己的姐妹们全都叫来，希望她们陪玛雅玩耍。那些姐妹围上来，却不肯和她好好玩，只管无礼地从头到脚打量她。
        - id: ch02-b18
          speaker: beetle_sister_1
          text: 你从哪里捡来这个怪东西？她确实丑得很。不过，她只有两条腿，也真值得可怜。
          emotion: disgusted
        - id: ch02-b19
          speaker: beetle_sister_2
          text: 她连触角都没有，还瘦成这样。咱们兄弟的眼光真古怪！
          emotion: disgusted
        - id: ch02-b20
          speakers: [beetle_sister_3, beetle_sister_4]
          ensemble: duo
          text: 可不是吗，他的眼光太古怪了！
        - id: ch02-b21
          speaker: narrator
          text: 姐妹们把这些话说得又响又多，一遍接一遍，最后连金龟子自己也相信玛雅很丑。他抓起先前放在树上的玛雅，把她带回地面，丢在一朵低低开放的雏菊上。玛雅就在那里住了一整个夏天。她大着胆子独自四处走动，用几片草叶编成小床，再把床安在苜蓿叶下遮风挡雨。苔藓里长着红色的小杯，杯中盛的露珠足够她饮用，金龟子也教会她从花里取蜂蜜。她独自过日子，其实并不怎么难过。
        - id: ch02-b22
          speaker: narrator
          text: 可夏天终究会过去。花儿渐渐枯萎，杯中的露珠变成冰雪。玛雅的衣服早已穿成碎布。她捡起一片枯叶，想把自己裹在里面取暖，叶子却刚碰到手指就碎了。她明白，若再找不到住处，自己一定会饿死、冻死。于是她鼓起全部勇气，离开森林，穿过道路，走进夏日里麦浪起伏、如今却只剩一片硬秆的田野。她不断往前走，眼前除了头顶的天空，什么也没有，直到一个仿佛通往地下的洞口忽然出现在身旁。
    - id: ch03
      title: 田鼠家里的冬天
      blocks:
        - id: ch03-b01
          speaker: maia
          text: 洞里至少会暖和些。说不定住在那里的人还肯给我一点吃的。无论怎样，也不会比现在更糟了。
        - id: ch03-b02
          speaker: narrator
          text: 玛雅壮着胆子走进地下通道。里面果然比风雪中的田野暖和。她摸索着走了一阵，看见一扇半掩的门。探头望去，门后整整一屋都是储存的谷粒。这个发现让她心里有了指望，脚步也随之快起来。她继续沿通道向前，最后来到一间厨房，一只年老的田鼠正在那里烤饼。田鼠抬头看见她，显然从没见过像她这样的生灵。
        - id: ch03-b03
          speaker: field_mouse
          text: 可怜的小东西，你简直快饿死了！快坐下来暖一暖，再和我一起吃饭。
        - id: ch03-b04
          speaker: narrator
          text: 这番好心话让玛雅几乎喜极而泣。她不必田鼠再请第二次，立刻坐下来，吃得比从前任何一次都多。当然，这可不是蜂鸟那样小小的一顿。她把最后一口也吃完，才满足地伸出手，微笑着望向田鼠，感谢这份救命的款待。
        - id: ch03-b05
          speaker: field_mouse
          text: 你会不会讲故事？会的话，就留到太阳重新暖起来吧，也帮我照料屋子。冬天的地下很沉闷，身边得有个聪明人说些有趣的事才好。
        - id: ch03-b06
          speaker: narrator
          text: 玛雅从养母那里听过许多故事。后来，她被青蛙掳走，又从金龟子爪下落到野外，自己的冒险和几次死里逃生也足够讲很久。她还很会打扫屋子，每天一早准会起床，把田鼠的家收拾得干干净净、整整齐齐。两个人愉快地过完冬天。玛雅渐渐说起春天，盼着天气暖和以后，重新走进外面的世界，寻找自己的幸福。
        - id: ch03-b07
          speaker: field_mouse
          text: 现在还不必急着想出去。地上有句谚语，白昼渐渐长，寒气越发强。这阵子虽暖，雪随时会来。等它真的落下，你就会庆幸自己住在这里。不过，你还年轻，大概嫌这里太安静。我已经请邻居鼹鼠来做客。他睡了好几个月，听说就要醒了。他要是想娶你，你可真有福气。只可惜他眼睛看不见，不知道你多漂亮。
        - id: ch03-b08
          speaker: narrator
          text: 玛雅倒庆幸鼹鼠看不见，因为她一点也不想嫁给他。鼹鼠依约来访后，她更不喜欢他了。他尽可以富有，也尽可以学问渊博，却讨厌阳光、树木和鲜花，而那些正是玛雅最爱的东西。因为双目失明，他从未见过它们。可他像许多人一样，只要自己不知道某样东西，就断定它根本不值得知道。玛雅的故事明明逗得他很开心，他却无论如何也不肯让她看出来。她唱歌时，他也暗暗欣赏她的声音。
        - id: ch03-b09
          speaker: maia
          text: 玛丽，玛丽，真倔强，你的花园怎样长？睡吧，宝宝，树梢摇。
        - id: ch03-b10
          speaker: narrator
          text: 鼹鼠偏说这些都是废话，树和花园也愚蠢透顶。等玛雅成了他的妻子，他会教她更值得学的东西。随后，他又神气十足地说起自己挖的新通道。
        - id: ch03-b11
          speaker: mole
          text: 我从这里挖了一条路，直通我家。你们可以在里面走。不过先提醒你，路边躺着一头巨大的死东西，是从屋顶的洞里掉下来的，可别吓着。
        - id: ch03-b12
          speaker: maia
          text: 那究竟是什么东西？
        - id: ch03-b13
          speaker: mole
          text: 我可说不准。它身上盖着柔软的东西，有两条细腿，脑袋上伸出一根尖尖的长东西。
        - id: ch03-b14
          speaker: maia
          text: 那是一只鸟！我最喜欢鸟儿了。它一定是冻死的。好心的鼹鼠先生，请带我去看看吧。
        - id: ch03-b15
          speaker: mole
          text: 那就跟来吧，我也正要回家。
        - id: ch03-b16
          speaker: narrator
          text: 鼹鼠又叫上田鼠，三个一起走进通道，最后停在小燕子身边。
        - id: ch03-b17
          speaker: mole
          text: 瞧，就是它。命运没把我变成鸟，真值得庆幸。鸟儿除了啾啾叫，什么也不会，寒风才吹一口气，就没命了。
        - id: ch03-b18
          speaker: field_mouse
          text: 是啊，真是个可怜又没用的东西。
        - id: ch03-b19
          speaker: narrator
          text: 趁他们说话，玛雅绕到另一边，抚摸小燕子的羽毛，又亲了亲他的眼睛。那一夜，她怎么也睡不着，心里只想着通道里的鸟儿。最后，她偷偷去拿干草，编成一床厚被，又取来田鼠夏天从沼泽花朵上采下的棉花。她把棉花垫在燕子身下，再替他盖好草被。
        - id: ch03-b20
          speaker: maia
          text: 也许，夏天为我唱歌的燕子中就有你。真希望我能让你重新活过来。现在，我只能和你告别了。
          emotion: sad
        - id: ch03-b21
          speaker: narrator
          text: 玛雅含着眼泪，把脸贴在燕子胸前，忽然感觉到一丝轻微的颤动。她不敢相信，又安静地等了一会儿，脸颊下果然再次动了。燕子也许根本没有死，只是冻饿交加，失去了知觉。这个念头让玛雅立刻振作起来。她赶紧跑回屋里，取来几粒谷子，又用一片叶子盛了一滴水。她把水凑到燕子喙边。燕子无意识地张开嘴，先啜下那滴水，又让玛雅把谷子一粒一粒喂进去。
        - id: ch03-b22
          speaker: maia
          text: 千万别出声，不能让别人知道你还活着。今晚我再给你送吃的。我会请鼹鼠堵住洞口，就说通道太冷，我没法从这里走。现在，我得回去了。
        - id: ch03-b23
          speaker: narrator
          text: 她悄悄回到屋里，老田鼠仍在熟睡。
    - id: ch04
      title: 燕子的邀请
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 玛雅偷偷照料了好几天，燕子渐渐恢复力气，终于能够开口说话。他把自己的遭遇全都告诉了救命恩人。他还小得不能高飞时，翅膀曾被玫瑰丛划破。后来家人和朋友一起启程，要飞往温暖的地方，他受伤的翅膀却怎么也跟不上。大家飞得太快，没有发觉小兄弟已经掉队。他独自支撑了很久，最终筋疲力尽，从空中坠落到地面，大概又顺着屋顶的洞滚下来，这才落到了阴暗的通道里。
        - id: ch04-b02
          speaker: narrator
          text: 鼹鼠和田鼠都认定燕子死了，从来没有过问，反倒让他避开了打扰，安安静静地恢复过来。等真正的春天终于到来，太阳已经暖融融的，林中开出一片片蓝色风信子，篱笆边也冒出了报春花。经过玛雅整个冬天的照料，燕子又长得高大强壮，和他的任何一个同伴都没有分别。
        - id: ch04-b03
          speaker: swallow
          text: 亲爱的小玛雅，你救了我的命。现在我该离开了。不过，你愿不愿意让我背着你，一起飞出这座阴沉的牢狱，到很远的地方去？
        - id: ch04-b04
          speaker: narrator
          text: 玛雅听得眼睛发亮，却还是勇敢地摇了摇头。
        - id: ch04-b05
          speaker: maia
          text: 你该走了，可我必须留下。田鼠待我很好，我不能这样抛下她。你能自己打开洞口吗？最好现在就开始。今晚我们要到鼹鼠家吃饭，不能让养母发现你在挖洞。
        - id: ch04-b06
          speaker: swallow
          text: 你说得对，我现在就动手。
        - id: ch04-b07
          speaker: narrator
          text: 燕子飞上并不算高的屋顶，用喙啄开洞口。一大片阳光顿时涌进黑暗的通道。
        - id: ch04-b08
          speaker: swallow
          text: 玛雅，你真的不愿意跟我一起走吗？
        - id: ch04-b09
          speaker: narrator
          text: 玛雅心里那么渴望树木和鲜花，嘴上仍旧拒绝了。
        - id: ch04-b10
          speaker: maia
          text: 不，我不能走。
        - id: ch04-b11
          speaker: narrator
          text: 此后很长一段时间，那一眼便是玛雅见到的全部阳光。洞口和房屋上方长满了密密的麦子，几乎和根本没有太阳一样。她每时每刻都在想念燕子，却没有一点空闲。田鼠说，她很快要嫁给鼹鼠，便叫她不停纺羊毛和棉花，为婚礼预备嫁妆。玛雅这辈子从没做过衣服，于是他们说服四只手艺灵巧的蜘蛛，让蜘蛛整天留在地下，把羊毛和棉花做成一件件小衣裳。衣裳很漂亮，嫁给鼹鼠的念头却让玛雅厌恶。她不知道怎样才能逃走。每天傍晚，蜘蛛回家过夜时，她都会把他们送到门口，站在那里等一阵风吹开麦穗，只为了望一眼天空。
        - id: ch04-b12
          speaker: maia
          text: 燕子要是现在回来，我一定跟他走，哪怕走到世界尽头。
        - id: ch04-b13
          speaker: narrator
          text: 可燕子一直没有回来。浆果红了，树叶黄了。一天，田鼠告诉玛雅，嫁妆已经全部做好，她和鼹鼠把婚期定在四个星期以后。
        - id: ch04-b14
          speaker: maia
          text: 不要这么快！求你不要这么快！
          emotion: sad
        - id: ch04-b15
          speaker: narrator
          text: 玛雅说着便哭了起来。田鼠十分生气，说她和别的姑娘一样不懂事，根本不知道什么才是对自己好。鼹鼠随后赶来，把她驮到背上，带她参观为新婚生活挖好的房子。那里埋在极深的地下。凭玛雅的小短腿，她永远也爬不到田鼠家那么高，更不可能再从田鼠家望见阳光。婚期一天比一天近，她的心也一天比一天沉重。婚礼前最后一个傍晚，玛雅悄悄爬出地下，走进满是麦茬的田野。她想在永远告别太阳以前，独自再看一次落日。
        - id: ch04-b16
          speaker: maia
          text: 再见了，太阳。也向我的小燕子说再见吧。他要是知道我的处境，一定会来帮助我。
          emotion: sad
        - id: ch04-b17
          speaker: swallow
          text: 啾啾，我回来了！你看起来这样难过，难道真要让那只丑鼹鼠娶你？
        - id: ch04-b18
          speaker: narrator
          text: 燕子从头顶落到她身旁，玛雅流着眼泪回答他。
        - id: ch04-b19
          speaker: maia
          text: 反正我很快就会死，这倒也算一种安慰。
          emotion: sad
        - id: ch04-b20
          speaker: swallow
          text: 别说傻话，快像我从前说的那样，爬到我背上来。我带你去一个永远有阳光的国度。很快，你就会把鼹鼠忘得干干净净。
        - id: ch04-b21
          speaker: maia
          text: 好，我跟你走。
    - id: ch05
      title: 花精灵的王后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 燕子用强壮的喙扯下一根麦秆，让玛雅用它把自己牢牢系在他的翅膀上。他们就这样出发，一直朝南方飞去，一飞就是许多天。重新看见美丽的大地，玛雅心里说不出的快活。沿途景色处处动人，她有上百次盼着燕子就此停下，燕子却总说最美的还在前方。他们继续飞呀，飞呀，途中只作短暂休息，最后来到一片布满高大白色大理石柱的地方。有些柱子缠满葡萄藤，高高耸立，无数燕子的小脑袋从藤叶间探出来。另一些柱子横卧在地，四周开满白色、黄色和蓝色的花。
        - id: ch05-b02
          speaker: swallow
          text: 我住在最高的柱子上。不过，那样的家不适合你，你会掉下来摔死。你从下面挑一朵花吧，它就是你的家。夜里，你可以蜷在花瓣里睡觉。
        - id: ch05-b03
          speaker: maia
          text: 我要那朵星星一样的白花。它的花心有一圈红黄相间的皱边，长长的花茎会在风中摇摆。它是这里最美、最香的一朵。
        - id: ch05-b04
          speaker: narrator
          text: 燕子依照玛雅的选择，朝那朵随风摇摆的白花飞下去。等他们越来越近，才发现一片叶子上站着一个小小的人儿。他头戴王冠，肩生双翼，正在叶面上小心地保持平衡。燕子轻声告诉玛雅，那正是统领花中精灵的国王。国王早已望见他们。他面带微笑，向玛雅伸出双手，稳稳扶住她，让她从燕子背上跳到花瓣之间。
        - id: ch05-b05
          speaker: flower_king
          text: 我已经在这里等你很久了。如今你终于来到这里，做我的王后吧。
        - id: ch05-b06
          speaker: narrator
          text: 玛雅微笑着站到他身旁。住在花里的精灵们纷纷跑去为她取礼物。最好的礼物是一双淡蓝色的薄翼，能让玛雅像他们一样四处飞翔。就这样，小玛雅没有嫁给鼹鼠，反而加冕成了王后。精灵们围着她跳舞，燕子则为她唱起婚礼之歌。
