    onlooker_3:
      display_name: 岸上行人丙
      tts:
        delivery: 好奇惊喜，赞叹自然
        timbre: 稚嫩的童声
        pace: 适中
        pitch: 高
    bird_1:
      display_name: 林中小鸟甲
