  chapters:
    - id: ch01
      title: The Child in the Tulip
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a woman who lived in a pretty cottage and garden in the heart of a forest. Through the summer, she was happy among her flowers, with birds singing in the trees. Winter was different. Snow covered the ground, wolves howled outside her door, and she felt lonely and afraid.
        - id: ch01-b02
          speaker: foster_mother
          text: >-
            If only I had a child to talk to. I would not care how small the child was. What a comfort that would be!
        - id: ch01-b03
          speaker: narrator
          text: >-
            The harder the snow fell, the more often she said it. At last the quiet and loneliness became too much for her. She set out for the nearest village, hoping someone might sell or lend her a child. But the snow rose above her ankles. Nearly an hour passed before she had walked even a few hundred yards.
        - id: ch01-b04
          speaker: foster_mother
          text: >-
            At this pace, it will be dark before I reach the first house.
        - id: ch01-b05
          speaker: narrator
          text: >-
            She stopped and looked around. A little woman in a tall-crowned hat suddenly stepped out from behind a tree.
        - id: ch01-b06
          speaker: witch
          text: >-
            This is a terrible day for a walk. Are you going very far?
        - id: ch01-b07
          speaker: foster_mother
          text: >-
            I am trying to reach the village, but I cannot see how I will ever get there.
        - id: ch01-b08
          speaker: witch
          text: >-
            What business could be important enough to take you there today?
        - id: ch01-b09
          speaker: narrator
          text: The little woman was really a witch, though the woman did not know it.
        - id: ch01-b10
          speaker: foster_mother
          text: >-
            My house is dreary when I have no one to speak to. I cannot bear living there alone. I am looking for a child to keep me company, no matter how small she may be.
        - id: ch01-b11
          speaker: witch
          text: >-
            If that is all you need, you can stop right here. I have a grain of barley in my pocket. As a favor, I will sell it to you for twelve shillings. Plant it in a flowerpot, water it well, and in a few days you will see something wonderful.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The promise lifted the woman's spirits. She gladly paid the twelve shillings and made her slow way home through the snow. As soon as she arrived, she dug a little hole in a flowerpot and planted the barley grain. She watered it well and placed the pot in a warm corner. For three days she waited, hardly taking her eyes from it. On the third morning, she woke to find a tall red tulip standing among its sheath of green leaves. It had sprung up while she slept.
        - id: ch01-b13
          speaker: foster_mother
          text: What a beautiful flower!
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: >-
            She bent to kiss it. At once, the red petals opened. In their center sat a lovely little girl, only an inch high, on a mattress of violets beneath a quilt of rose leaves. The child opened her eyes and smiled as though she had known the woman all her life.
        - id: ch01-b15
          speaker: foster_mother
          text: >-
            Oh, you darling! I will never be lonely again!
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: >-
            The baby nodded as if to say that, of course, she would not. The woman wasted no time. She searched until she found a roomy walnut shell, lined it with thick white satin, and placed the violet mattress inside. Then she laid the child on it and named her Maia. This became Maia's bed, and each night it stood on a chair close beside her foster mother's own bed.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Each morning, Maia was placed on a leaf floating in a large bowl of water. Two white horsehairs served as her oars. She was the happiest baby anyone had ever seen. All day long she sang to herself in a language no one else could understand.
    - id: ch02
      title: The Floating Prison
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            For several weeks, Maia and her foster mother were perfectly happy together. Then, one night, her foster mother fell fast asleep after a hard day's work. A large, ugly, dripping-wet frog hopped through the open window. She stood staring at Maia beneath her rose-leaf quilt.
        - id: ch02-b02
          speaker: frog_mother
          text: >-
            Well, what a pretty little girl! She would make a fine wife for my son.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The frog lifted the walnut-shell cradle in her mouth and carried it to the stream that ran through the garden. She hopped all the way to her muddy home.
        - id: ch02-b04
          speaker: frog_mother
          text: Come and see what I brought you!
        - id: ch02-b05
          speaker: frog_son
          text: Croak! Croak! Croak!
          emotion: happy
        - id: ch02-b06
          speaker: narrator
          text: The young frog gazed happily at the sleeping child, but his mother hurried to quiet him.
        - id: ch02-b07
          speaker: frog_mother
          text: >-
            Hush! That noise will wake her. I mean her to be your wife. While we prepare the wedding, we will put her on the water-lily leaf in the middle of the brook. Then she cannot run away.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Maia woke with the first rays of sunlight and found herself on that green, floating prison in the middle of the brook. Frightened and confused, she stood as straight as she could and searched all around for some way off the leaf. There was none. She sat down again and wept bitterly. Deep in her house at the bottom of the marsh, Mother Frog heard Maia's sobs. She was twisting rushes into a soft carpet for the little bride's feet and winding reeds and grapes around the doorway to make it pretty.
        - id: ch02-b09
          speaker: frog_mother
          text: >-
            Poor child. She feels lost and miserable. I am nearly finished here. My son and I will fetch her, and when she sees how handsome he is, she will smile again.
        - id: ch02-b10
          speaker: narrator
          text: A few minutes later, the two frogs appeared beside the leaf.
        - id: ch02-b11
          speaker: frog_mother
          text: >-
            Here is your future husband. Have you ever seen anyone like him?
        - id: ch02-b12
          speaker: narrator
          text: >-
            The proud mother pushed her son forward. Maia looked once and cried harder. Little fish from the stream gathered around her to find out what was wrong.
        - id: ch02-b13
          speakers: [fish_1, fish_2, fish_3]
          ensemble: chorus
          text: >-
            This is wrong! No one should force such a pretty creature to marry someone she does not want, especially such an ugly frog. We can stop it.
        - id: ch02-b14
          speaker: narrator
          text: >-
            The fish took turns biting through the lily stem, working close to the root until the leaf finally floated free. Then they caught the stem in their mouths and pulled Maia away before the frogs could stop them. They carried her far down the water, with the lily leaf gliding behind, until the narrow stream widened into a great river.
        - id: ch02-b15
          speaker: narrator
          text: >-
            Once Maia knew the frogs could never catch her, she delighted in the voyage. She floated past town after town. People along the banks stopped to stare.
        - id: ch02-b16
          speakers: [onlooker_1, onlooker_2]
          ensemble: duo
          text: >-
            What a lovely little girl! Where could she have come from?
          emotion: surprised
        - id: ch02-b17
          speakers: [bird_1, bird_2]
          ensemble: duo
          text: What a lovely little girl!
          emotion: happy
        - id: ch02-b18
          speaker: narrator
          text: >-
            The birds twittered from the bushes. A blue butterfly fell in love with Maia and refused to leave her. Her sash was just the same color as his wings, so she took it off and tied it around him. With this strange new horse drawing her leaf, she traveled much faster.
        - id: ch02-b19
          speaker: narrator
          text: >-
            Then a great cockchafer came buzzing over the river and happened to spot her. He swooped down and snatched Maia up in his claws. The poor butterfly struggled in terror until the bow of the sash gave way, and he flew free into the sunshine. Maia was not so fortunate. The cockchafer carried her away. He gathered honey from flowers for her dinner and told her several times how pretty she was, but even with his kind words and food, she could not feel safe with him.
        - id: ch02-b20
          speaker: cockchafer
          text: >-
            You seem uneasy. I will call my sisters. They can keep you company.
        - id: ch02-b21
          speaker: narrator
          text: His sisters came, but instead of playing with Maia, they stared at her rudely.
        - id: ch02-b22
          speaker: cockchafer_sister_1
          text: >-
            Where did you find that strange thing? She is certainly ugly. We should pity her, though. She has only two legs.
          emotion: disgusted
        - id: ch02-b23
          speaker: cockchafer_sister_2
          text: >-
            She has no feelers, either, and look how thin she is! Our brother has the oddest taste.
          emotion: disgusted
        - id: ch02-b24
          speaker: cockchafer_sister_3
          text: He certainly does!
        - id: ch02-b25
          speaker: narrator
          text: >-
            The sisters said it so loudly and so often that at last their brother believed them. He seized Maia from the tree where he had left her and set her on a daisy close to the ground.
    - id: ch03
      title: Shelter for the Winter
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Maia stayed on the ground through the whole summer, and she was not unhappy. She grew brave enough to walk around alone. From blades of grass she wove herself a bed, then placed it beneath a clover leaf that sheltered her like a roof. Little red cups growing in the moss held as much dew as she could drink, and the cockchafer had taught her how to take honey from the flowers.
        - id: ch03-b02
          speaker: narrator
          text: >-
            But summer could not last. The flowers withered, and snow and ice replaced the dew. Maia's clothes wore to rags. When she tried to wrap herself in a dry leaf, it crumbled in her hands. Unless she found shelter, she would soon die from cold and hunger.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Maia gathered all her courage and left the forest. Across the road lay a field that had waved with corn in summer. Now it was nothing but hard stalks. She walked beneath the empty sky until she came to an opening that seemed to lead underground.
        - id: ch03-b04
          speaker: maia
          text: >-
            At least it may be warm down there. Perhaps whoever lives inside will give me food. Things cannot be any worse than they are now.
        - id: ch03-b05
          speaker: narrator
          text: >-
            She bravely entered the passage. Before long, she reached a half-open door and peeked into a room filled with corn. The sight encouraged her. She hurried on until she found a kitchen where an old field mouse was baking a cake.
        - id: ch03-b06
          speaker: field_mouse
          text: >-
            You poor little creature! You look nearly starved. Come sit by the warmth and share my dinner.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The kind words almost made Maia cry with joy. She needed no second invitation. She ate more than she ever had before, though it would hardly have made breakfast for a hummingbird. When she finished, she held out her hand and smiled.
        - id: ch03-b08
          speaker: field_mouse
          text: >-
            Do you know any stories? If you do, you may stay until the sun grows hot again, and you can help around my house. Winter is dull unless you have someone clever enough to entertain you.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Maia knew many stories that her foster mother had taught her. She could also tell about her own adventures and all the times she had barely escaped death. She knew how a room ought to be swept, too. Every morning she rose early without fail and had the mouse's home clean and tidy before the old mouse began her day. In this way, the winter passed pleasantly. At last Maia began to speak about spring, when she would have to go out into the world again and seek her fortune.
        - id: ch03-b10
          speaker: field_mouse
          text: >-
            Do not start thinking about that yet. People above ground have a saying. When the days grow longer, the cold grows stronger. It has been warm until now, so snow may still come. No winter passes without it. Then you will be glad you are in here, not outside.
        - id: ch03-b11
          speaker: field_mouse
          text: >-
            Still, it must be quiet for someone young. I have invited my neighbor, the mole, to visit us. He has slept all these months, but I hear he is waking. You would be lucky if he chose to marry you. Sadly, he is blind, so he cannot see how pretty you are.
        - id: ch03-b12
          speaker: narrator
          text: Maia was truly glad he was blind, because she did not want a mole for a husband.
    - id: ch04
      title: The Swallow in the Passage
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            In time, the mole came for his promised visit, and Maia disliked him at once. He might be as rich and learned as anyone could wish, but he hated the sun, the trees, the flowers, and everything Maia loved best. Because he was blind, he had never seen any of them. Like many other people, he decided that anything he did not know could not possibly be worth knowing.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Maia's stories amused him, though he would never have admitted it. He also admired her singing voice. She sang about Mary's garden and a baby in a treetop.
        - id: ch04-b03
          speaker: mole
          text: >-
            Those songs are nonsense. Trees and gardens are foolish things. When you are my wife, I will teach you subjects that are worth learning.
        - id: ch04-b04
          speaker: mole
          text: >-
            Meanwhile, I have dug a passage between this house and mine, and you may walk through it. There is one thing I should mention. A large dead creature fell through a hole in the roof and lies along one side. Do not let it frighten you.
        - id: ch04-b05
          speaker: maia
          text: What kind of creature is it?
        - id: ch04-b06
          speaker: mole
          text: >-
            I really could not say. Something soft covers it. It has two thin legs and a long, sharp thing coming from its head.
        - id: ch04-b07
          speaker: maia
          text: >-
            It is a bird! I love birds. It must have died from the cold. Oh, good Mr. Mole, please take me to see it!
        - id: ch04-b08
          speaker: mole
          text: >-
            Come along, then. I am going home now.
        - id: ch04-b09
          speaker: narrator
          text: >-
            The mole called the field mouse, and the three of them entered the passage. At last, they reached the fallen creature.
        - id: ch04-b10
          speaker: mole
          text: >-
            Here it is. How thankful I am that Fate did not make me a bird! They say nothing but "twit, twit," and the first cold breath kills them.
        - id: ch04-b11
          speaker: field_mouse
          text: Yes, the poor useless creature.
        - id: ch04-b12
          speaker: narrator
          text: >-
            While they talked, Maia slipped around to the other side. She stroked the little swallow's feathers and kissed his eyes. That night she lay awake, thinking about him alone in the tunnel. At last, she could bear it no longer. She stole to the hay store and wove a thick carpet. Then she took cotton that the field mouse had gathered from marsh flowers in summer. Maia carried both down the passage, tucked the cotton beneath the bird, and spread the hay quilt over him.
        - id: ch04-b13
          speaker: maia
          text: >-
            Perhaps you were one of the swallows who sang to me last summer. I wish I could bring you back to life. Goodbye, little bird.
          emotion: sad
        - id: ch04-b14
          speaker: narrator
          text: >-
            With tears on her face, she laid her cheek against his breast. Something faintly moved beneath it. Then it moved again. Perhaps the bird was not dead at all. Perhaps cold and hunger had only left him senseless.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Maia hurried to the house for grains of corn and a drop of water held in a leaf. She brought the water to the swallow's beak. He opened it without waking, drank, and swallowed the grains she fed him one by one.
        - id: ch04-b16
          speaker: maia
          text: >-
            Do not make a sound. No one must guess that you are alive. Tonight I will bring more food. I will tell the mole to close the hole because it makes the passage too cold for me. Goodbye for now.
        - id: ch04-b17
          speaker: narrator
          text: Maia returned to the field mouse, who was still sound asleep.
        - id: ch04-b18
          speaker: narrator
          text: >-
            Maia brought food and water in secret and nursed the swallow with great care. After several days, he was strong enough to speak and tell her what had happened. Before he had grown big enough to fly very high, he tore his wing in a rosebush. When his family and friends left for warmer lands, the injured wing kept him from matching their speed. They flew so swiftly that they never noticed their little brother was missing. At last he dropped to the ground from sheer exhaustion and must have rolled through the hole into the passage.
        - id: ch04-b19
          speaker: narrator
          text: >-
            Luckily, the mole and field mouse still believed he was dead and left him alone. By the time true spring arrived, when sunlight was warm, blue hyacinths filled the woods, and primroses lined the hedges, the swallow was as tall and strong as any of his companions.
        - id: ch04-b20
          speaker: swallow
          text: >-
            Dear little Maia, you saved my life. Now I must leave. Unless you will let me carry you on my back, far away from this gloomy prison?
        - id: ch04-b21
          speaker: narrator
          text: Maia's eyes shone at the thought, but she bravely shook her head.
        - id: ch04-b22
          speaker: maia
          text: >-
            You must go, but I must stay. The field mouse has been kind to me. I cannot desert her this way. Can you open the hole by yourself? You should begin now. We are having supper with the mole tonight, and my foster mother must not find you working here.
        - id: ch04-b23
          speaker: swallow
          text: You are right.
        - id: ch04-b24
          speaker: narrator
          text: >-
            The roof was not very high. The swallow flew up and worked with his beak until a flood of sunshine poured into the darkness.
        - id: ch04-b25
          speaker: swallow
          text: Won't you come with me, Maia?
        - id: ch04-b26
          speaker: narrator
          text: Maia's heart yearned for the trees and flowers, but her answer stayed the same.
        - id: ch04-b27
          speaker: maia
          text: No, I cannot.
    - id: ch05
      title: The Mole's Bride
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            For a long while, that glimpse of sunlight was Maia's last. Corn grew so thickly over the hole and around the field mouse's house that the sun might as well have vanished. Maia missed her bird friend every moment, but she had no time to sit idle.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The field mouse announced that Maia would soon marry the mole. From then on, she kept Maia busy spinning wool and cotton for her wedding clothes. Maia had never made a dress in her life, so four clever spiders were persuaded to spend their days underground, turning the wool and cotton into a whole set of tiny garments. Maia liked the beautiful clothes they made. She hated the thought of marrying the blind mole, but she could see no way to escape him.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Each evening, when the spiders left for home, Maia walked with them to the door. She waited for the wind to part the ears of corn so she could see the sky.
        - id: ch05-b04
          speaker: maia
          text: >-
            If only the swallow would come now. I would go with him to the end of the world.
        - id: ch05-b05
          speaker: narrator
          text: But the swallow never came.
        - id: ch05-b06
          speaker: field_mouse
          text: >-
            Your wedding clothes are finished. The berries are red, the leaves are yellow, and the mole and I have chosen the day. You will marry him in four weeks.
        - id: ch05-b07
          speaker: maia
          text: Please, not so soon! Not so soon!
          emotion: sad
        - id: ch05-b08
          speaker: narrator
          text: >-
            Maia burst into tears. The field mouse grew angry and said Maia had no more sense than other girls. She simply did not understand what was good for her.
        - id: ch05-b09
          speaker: narrator
          text: >-
            Then the mole arrived and carried Maia on his back to see the new home he had dug for her. It lay far below the ground, much deeper than the field mouse's home. Once Maia lived there, her tiny legs could never carry her even as high as the field mouse's dwelling, the one place underground where the parted corn sometimes allowed her to see the sunlight.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Maia's heart grew heavier with every passing day. On the final evening, she crept into the stubbled field. She watched the sunset, knowing she must say goodbye to it forever.
        - id: ch05-b11
          speaker: maia
          text: >-
            Goodbye, dear sun. Goodbye, my little swallow. If only he knew, he would come and help me.
          emotion: sad
        - id: ch05-b12
          speaker: swallow
          text: >-
            Twit, twit! You look miserable. Are you truly going to let that ugly mole marry you?
        - id: ch05-b13
          speaker: narrator
          text: The swallow fluttered down beside her.
        - id: ch05-b14
          speaker: maia
          text: >-
            I will die soon. At least that will end it.
          emotion: sad
        - id: ch05-b15
          speaker: swallow
          text: >-
            Tut, tut! Climb onto my back, just as I told you before. I will carry you to a country where the sun always shines. Soon you will forget that a creature like the mole ever lived.
        - id: ch05-b16
          speaker: maia
          text: Yes, I will go with you.
        - id: ch05-b17
          speaker: narrator
          text: >-
            With his strong beak, the swallow tore off a corn stalk. He told Maia to tie it securely around his wing. Then they rose into the air and flew south, on and on, for many days.
    - id: ch06
      title: Queen of the Flower Spirits
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Maia was overjoyed to see the beautiful earth spread beneath them again. A hundred times she longed for the swallow to stop among the places they passed, but each time he told her that the best still lay ahead. They flew on and on toward the south, day after day, landing only now and then for a short rest.
        - id: ch06-b02
          speaker: narrator
          text: >-
            At last they reached a place filled with tall white marble pillars. Some stood high, wrapped in curling vines, with countless swallow heads peeping from nests above. Other pillars lay stretched across the ground among masses of white, yellow, and blue flowers.
        - id: ch06-b03
          speaker: swallow
          text: >-
            I live up there, in the tallest pillar. But that home would never suit you. You might fall out and be killed. Choose one of the flowers below instead. It can be your own home, and at night you can sleep curled inside its leaves.
        - id: ch06-b04
          speaker: maia
          text: >-
            I choose that one. The white flower shaped like a star, with the tiny red-and-yellow wreath in its center. It is the prettiest one here, and it smells so sweet.
        - id: ch06-b05
          speaker: narrator
          text: >-
            Its long stem swayed in the wind. The swallow flew down toward it. As they came closer, they saw a tiny man standing on one of its leaves. A crown rested on his head, wings rose from his shoulders, and he balanced lightly above the petals.
        - id: ch06-b06
          speaker: swallow
          text: That is the king of the flower spirits.
        - id: ch06-b07
          speaker: narrator
          text: >-
            The king reached out both hands and helped Maia jump down from the swallow's back.
        - id: ch06-b08
          speaker: flower_king
          text: >-
            I have waited for you a long time. At last you have come to be my queen.
          emotion: happy
        - id: ch06-b09
          speaker: narrator
          text: >-
            Maia smiled and stood beside him. Fairies came running from every flower with gifts for her. The finest gift was a pair of lovely, gauzy blue wings, so Maia could fly about as they did.
        - id: ch06-b10
          speaker: narrator
          text: >-
            So Little Maia did not marry the mole. She was crowned a queen. The fairies danced in a ring around her, and the swallow sang the wedding song.
