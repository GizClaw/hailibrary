audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容温厚，悲剧转折处克制而沉静
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    elder_duck:
      display_name: 大野鸭
      tts:
        delivery: 稳重体贴，劝告时郑重清楚
        timbre: 清朗沉稳的成年男声
        pace: 适中
        pitch: 中
    younger_duck:
      display_name: 小野鸭
      tts:
        delivery: 真诚温和，伤感中仍保持理智
        timbre: 清亮柔和的年轻男声
        pace: 适中
        pitch: 中高
    turtle:
      display_name: 乌龟
      tts:
        delivery: 年迈多情，恳求时急切，得意时忘形
        timbre: 略显沙哑的老年男声
        pace: 稍缓
        pitch: 中低
    farmer:
      display_name: 农夫
      tts:
        delivery: 朴实响亮，惊奇时脱口而出
        timbre: 粗犷的成年男声
        pace: 适中偏快
        pitch: 中
    weaver:
      display_name: 织布妇人
      tts:
        delivery: 爽直明快，惊奇时声音高扬
        timbre: 明亮的成年女声
        pace: 适中偏快
        pitch: 中高
    village_child:
      display_name: 村童
      tts:
        delivery: 天真直接，见到奇景时兴奋
        timbre: 清脆的儿童声
        pace: 稍快
        pitch: 高
  chapters:
    - id: ch01
      title: 干涸的小湖
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "在遥远的东方，有一个十分炎热的国度。那里有一方美丽的小湖，两只野鸭在湖里安了家，每天都在清澈的水中游泳嬉戏。湖里还住着一只年迈的乌龟，他比野鸭来得更早。野鸭并没有因为只有这一个伙伴便厌烦他，反而和他成了最要好的朋友。它们一天里大半光景都相伴在一起。"
        - id: ch01-b02
          speaker: narrator
          text: "日子原本过得安稳又快活。可有一年夏天，雨一直不下，太阳晒得格外凶猛。每天早晨醒来，它们都会发现湖水又少了一点，岸上的泥滩又多了一点。湖边的睡莲渐渐垂下去，棕榈树也耷拉着脑袋。野鸭最爱游水的地方，原先可以潜得很深，如今却一天比一天浅。"
        - id: ch01-b03
          speaker: narrator
          text: "终于有一天，两只野鸭不安地彼此望了望。太阳落山以前，它们悄声商定，再等两天，如果还不下雨，就得飞走，另找一个家。它们万分舍不得这方小湖，可继续留在这个深爱的旧家里，准会渴死。它们忧心忡忡地望了好几个钟头的天空，直到累得把头藏进翅膀底下睡着。夜空没有一小片云，只有又大又亮的星星低低悬着，仿佛一伸手就能摸到。天一亮，它们决定去向乌龟说明打算，同他告别。"
        - id: ch01-b04
          speaker: narrator
          text: "乌龟正舒舒服服地蜷在一堆枯芦苇上，睡意蒙眬。他年纪大了，已经不能像从前那样冒着酷热四处活动。"
        - id: ch01-b05
          speaker: turtle
          text: "啊，你们总算来了！我还以为再也见不到你们了。湖虽然变小了，我的身子好像也越来越弱。日日夜夜独自待着，实在寂寞啊！"
        - id: ch01-b06
          speaker: elder_duck
          text: "唉，我的朋友，你受了苦，我们也一样难熬。还有一件事，恐怕会让你更加伤心。我们要是不想渴死，就得马上离开，去找太阳晒不到的地方。一想到要告诉你这些，我的心都要碎了。若不是迫不得已，世上没有任何事能让我们离开你。"
        - id: ch01-b07
          speaker: narrator
          text: "乌龟又震惊又悲痛，一时说不出话来。好容易忍住眼泪，他才颤声开口。"
        - id: ch01-b08
          speaker: turtle
          text: "这么多年来，你们一直是我仅有的朋友。没有你们，我怎么活得下去？你们一走，死亡很快就会来结束我的悲伤。"
          emotion: sad
        - id: ch01-b09
          speaker: younger_duck
          text: "我们的悲伤不比你少，可我们还能怎么办呢？我们走了，就不会再喝湖里的水，剩给你的也会多些。若不是这场可怕的灾祸，无论什么都不能把我们同深爱的朋友分开。"
          emotion: sad
        - id: ch01-b10
          speaker: turtle
          text: "朋友们，我和你们一样离不开水。死亡已经逼到你们面前，也逼到了我的面前。看在我们共同生活这么多年的情分上，求你们别把我独自留下等死！你们无论去哪里，都带我一起走吧！"
          emotion: fearful
    - id: ch02
      title: 野鸭的办法
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "大家沉默了一会儿。两只野鸭想到要抛下老朋友，心里难受极了。可是，它们又怎么可能带他走呢？这件事实在办不到。过了半晌，其中一只终于开了口。"
        - id: ch02-b02
          speaker: younger_duck
          text: "唉，我怎么忍心拒绝你！可你想想，我们和你一样，身子沉，脚又小。要陪你翻山越岭，再穿过荒漠，直到阳光不再灼人的地方，我们怎么走得到？恐怕一天还没过完，我们三个就都累死、饿死了。我们唯一的希望是这双翅膀，可你不会飞呀！"
          emotion: sad
        - id: ch02-b03
          speaker: turtle
          text: "是啊，我当然不会飞。可你们这么聪明，又见过那么大的世面，一定能想出什么办法吧？"
        - id: ch02-b04
          speaker: narrator
          text: "乌龟满怀期待地盯着它们。两只野鸭见他如此盼望同行，心便软了。它们示意乌龟留在原处，自己游到湖里商量。乌龟听不见它们在说什么，只能远远望着它们的一举一动。它们谈了不过半个钟头，他却觉得足有一百年。终于，两只野鸭并肩游了回来。它们还没到跟前，乌龟已经急得心都快停了，只想立刻知道等待自己的究竟是什么命运。"
        - id: ch02-b05
          speaker: elder_duck
          text: "我们想出了一个办法，也许能带你走。不过先得警告你，这个办法非常危险。要是你不肯照我们的吩咐做，危险就更大了。"
        - id: ch02-b06
          speaker: turtle
          text: "我的性命和幸福都系在这上面，我怎么可能不听呢？快告诉我该怎么做吧，我一定心怀感激，句句照办。"
          emotion: happy
        - id: ch02-b07
          speaker: elder_duck
          text: "那你听好。我们会用商量好的办法带你飞过天空。那时候，你得像死了一样，一动也不动。无论飞得多高，都不许害怕，不许动脚，也不许张嘴。不管看见什么、听见什么，你都得纹丝不动。不然会有什么后果，我可不敢保证。"
        - id: ch02-b08
          speaker: turtle
          text: "我一定绝对服从！不只这一次，从今往后一辈子都听你们的话。我再郑重答应一遍，一路上不动头，不动脚，什么也不怕，更不说一个字。"
        - id: ch02-b09
          speaker: narrator
          text: "事情商定以后，两只野鸭在湖里四处寻找，终于发现一根漂在水面上的结实木棍。它们用坚韧的睡莲根把木棍系在颈上，尽快游回乌龟身边。"
        - id: ch02-b10
          speaker: elder_duck
          text: "现在，用嘴牢牢咬住这根木棍。在我们把你重新放到地面以前，千万别松口。"
        - id: ch02-b11
          speaker: narrator
          text: "乌龟依言咬住木棍，两只野鸭也各自衔住一端。它们展开翅膀，迅速飞上天空，乌龟就悬在它们中间。"
    - id: ch03
      title: 天空中的奇景
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "起初，一切都很顺利。它们一路向前，先掠过一道道山谷，再越过一座座高山，又从许多荒废的城池上方飞过，可放眼望去，哪里都找不到湖泊。乌龟仍旧信赖自己的朋友，一路勇敢地紧咬着木棍，始终没有松口。"
        - id: ch03-b02
          speaker: narrator
          text: "终于，它们远远望见一座小村庄，很快就飞到了房顶上空。人们看见这奇异的景象，全都惊讶极了。男人、女人和孩子纷纷跑出来，朝天上望着，大声呼喊。"
        - id: ch03-b03
          speakers: [farmer, weaver, village_child]
          ensemble: chorus
          text: "快看！快看！真是奇迹！两只野鸭托着一只乌龟！世上几时有过这样的事！"
          emotion: surprised
        - id: ch03-b04
          speaker: narrator
          text: "人们实在太惊奇了。正在耕地的男人丢下手里的活儿，正在织布的女人也停了下来，全都赶来和亲友一起叫喊。两只野鸭仍旧平稳地向前飞，对下面的喧闹充耳不闻。乌龟却做不到。起初，他还记得野鸭的嘱咐，把嘴闭得紧紧的。可下面的喊声越来越响，终于叫他忍无可忍。他越听越觉得，所有人都在嫉妒他竟然能飞过天空。"
    - id: ch04
      title: 乌龟的命运
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "就在那糟糕的一刻，乌龟把自己郑重许下的诺言忘得一干二净。他张开嘴，想要回答下面那些人。可是一个字还没说出口，他已经飞快地从空中坠落。下坠的速度越来越快，他很快就失去了知觉，最后撞上房屋的一面墙，摔得粉身碎骨。"
        - id: ch04-b02
          speaker: narrator
          text: "两只野鸭把那根木棍丢了下去。木棍曾经托住它们的朋友，如今再也没有用了。它们悲伤地彼此望了望，摇了摇头。"
        - id: ch04-b03
          speakers: [elder_duck, younger_duck]
          ensemble: duo
          text: "我们早就担心会这样收场。不过，也许他终究没有错。这样死去，想必还胜过留在那里等死。"
          emotion: sad
