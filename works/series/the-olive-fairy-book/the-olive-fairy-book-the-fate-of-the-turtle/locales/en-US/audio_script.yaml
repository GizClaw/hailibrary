  chapters:
    - id: ch01
      title: The Drying Lake
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Far away in the east, in a country where the weather was very hot, there lay a beautiful little lake. Two wild ducks lived there, swimming and playing all day in the clear water. They had the lake almost entirely to themselves. Only one other creature shared it with them. He was a turtle, much older than the ducks, who had lived beside the lake before they came. Sometimes, having only one neighbor to talk to can make creatures grow tired of each other. Luckily, that did not happen here. The ducks and the turtle became close friends and spent most of every day together.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Everything went happily until one summer when no rain came. The sun beat down so fiercely that each morning brought less water and more mud along the bank. The water lilies around the edge of the lake began to droop. The palms hung their heads. The ducks had one favorite place where they could dive deeper than anywhere else, but even that part grew shallower day by day.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At last, the ducks looked at each other anxiously. Before that day ended, they had agreed in whispers that they could wait only two more days for rain. Then they would have to fly away and find another home. They loved their lake, but if they stayed, they would surely die of thirst.
        - id: ch01-b04
          speaker: narrator
          text: >-
            For hours they watched the sky with all their hearts, hoping for some sign of rain. Weariness finally made them tuck their heads beneath their wings and sleep. Not one tiny cloud had crossed the great, brilliant stars. The stars seemed to hang so low in the heavens that anyone might have reached up and touched them. When morning came, the ducks knew their decision was made. They must tell the turtle their plan and say goodbye.
        - id: ch01-b05
          speaker: narrator
          text: >-
            They found their old friend curled comfortably on a heap of dead rushes and more than half asleep. Age had weakened him, and he could no longer go out in the heat as he once had.
        - id: ch01-b06
          speaker: turtle
          text: >-
            Ah, there you are! I was beginning to wonder whether I would ever see you again. The lake may be smaller, but somehow I feel weaker too. It is terribly lonely to spend every day and night by myself.
        - id: ch01-b07
          speaker: elder_duck
          text: >-
            Oh, my dear friend, we have suffered too. And I am afraid I must tell you something that will hurt even more. If we mean to escape dying of thirst, we must leave at once and look for a place where the sun does not burn so fiercely. It breaks my heart to say it. Nothing else in the world could ever have made us leave you.
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: >-
            The turtle was both shocked and miserable. For a moment, he could not answer. He fought back his tears, and when he finally spoke, his voice shook.
        - id: ch01-b09
          speaker: turtle
          text: >-
            How could I live without you? For so long, you have been my only friends. If you leave, I will soon die of grief.
          emotion: sad
        - id: ch01-b10
          speaker: younger_duck
          text: >-
            We are just as sorry as you are, but what else can we do? Remember, if we are gone, there will be more water left for you. Without this dreadful trouble, nothing could have separated us from a friend we love so dearly.
          emotion: sad
        - id: ch01-b11
          speaker: turtle
          text: >-
            My friends, I need water as much as you do. If death is staring at you, it is staring at me as well. For the sake of all our years together, please do not leave me here to die alone. Wherever you go, take me with you!
          emotion: fearful
    - id: ch02
      title: A Dangerous Plan
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            No one spoke for a while. The ducks were heartsick at the thought of abandoning their old companion. Yet how could they possibly grant his request? At last, one duck answered him.
        - id: ch02-b02
          speaker: younger_duck
          text: >-
            Oh, how can I bring myself to refuse you? But how can we do what you ask? Our bodies are heavy, just like yours, and our feet are small. We could never walk beside you over mountains and deserts until we reached a cooler land. Before one day had passed, all three of us would die from hunger and exhaustion. Our wings are our only hope, and you cannot fly.
          emotion: sad
        - id: ch02-b03
          speaker: turtle
          text: >-
            No, of course I cannot fly. But you are clever, and you have seen so much of the world. Surely you can think of some way to take me?
        - id: ch02-b04
          speaker: narrator
          text: >-
            The turtle fixed his eyes eagerly on the ducks. When they saw how deeply he longed to go with them, their hearts softened. They signaled that they needed to speak alone, then swam out into the lake to consult each other.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The turtle could watch them, though he could not hear a word. Their half hour of talking felt like a hundred years to him. At last, he saw them return side by side. He was so anxious to learn his fate that the excitement nearly killed him before they reached the shore.
        - id: ch02-b06
          speaker: elder_duck
          text: >-
            We think we have found a plan that may work. But you must understand that it is very dangerous, especially if you fail to follow our instructions exactly.
        - id: ch02-b07
          speaker: turtle
          text: >-
            How could I disobey when my life and happiness depend on it? Tell me what to do. I promise I will obey you gratefully.
          emotion: happy
        - id: ch02-b08
          speaker: elder_duck
          text: >-
            While we carry you through the air, you must be as still as if you were dead. However high you rise, do not be afraid. Do not move your feet, and do not open your mouth. Whatever you may see or hear, you must remain perfectly still. Otherwise, I cannot answer for what will happen.
        - id: ch02-b09
          speaker: turtle
          text: >-
            I will obey you completely, now and for the rest of my life. I give you my solemn promise. During the whole journey, I will not move my head or my feet. I will fear nothing, and I will not speak one word.
        - id: ch02-b10
          speaker: narrator
          text: >-
            With that settled, the ducks swam this way and that around the shrinking lake. At last, they found a good strong stick floating in the water. They gathered some tough water-lily roots and used them to tie the stick securely to their necks. Then they returned to the turtle as quickly as they could.
        - id: ch02-b11
          speaker: elder_duck
          text: >-
            Now take a firm grip on this stick with your mouth. Do not let go until we have placed you safely on the ground again.
        - id: ch02-b12
          speaker: narrator
          text: >-
            The turtle obeyed. Each duck seized one end of the stick. They spread their wings and rose swiftly into the air, with the turtle hanging between them.
    - id: ch03
      title: High Above the Earth
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            For a time, everything went well. The three friends swept across valleys, over towering mountains, and above cities that had fallen into ruin. Still, there was no lake anywhere in sight. The turtle trusted his friends and held bravely to the stick.
        - id: ch03-b02
          speaker: narrator
          text: >-
            After a while, they saw a small village in the distance. Soon they were flying over its rooftops. Men, women, and children ran outside, amazed by the strange sight above them.
        - id: ch03-b03
          speakers: [farmer, weaver, village_child]
          ensemble: chorus
          text: >-
            Look up! It is a miracle! Two ducks are carrying a turtle! Has anyone ever seen such a thing?
          emotion: surprised
        - id: ch03-b04
          speaker: narrator
          text: >-
            The whole village was in an uproar. Men left their plows, and women left their weaving so they could join the others in shouting.
        - id: ch03-b05
          speaker: farmer
          text: Look at that turtle flying between the ducks!
          emotion: surprised
        - id: ch03-b06
          speaker: weaver
          text: I never dreamed I would see such a wonder!
          emotion: surprised
        - id: ch03-b07
          speaker: village_child
          text: How can a turtle fly so high?
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: >-
            The ducks kept flying steadily and paid no attention to the noise below. The turtle did not do so well. At first, he kept silent as they had ordered. But the clamor grew too much for him. He began to imagine that everyone below envied him because he could travel through the air.
    - id: ch04
      title: The Turtle's Fate
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Then came one terrible moment. The turtle forgot every solemn promise he had made and opened his mouth to answer the villagers. Before he could say a single word, he was falling through the air. He dropped so fast that he soon lost consciousness, then struck the side of a house and was dashed to pieces.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The ducks let the useless stick fall after their friend. They looked sadly at each other and shook their heads.
        - id: ch04-b03
          speakers: [elder_duck, younger_duck]
          ensemble: duo
          text: >-
            We were afraid it would end this way. And yet, perhaps he was right after all. This death may have been better than the one waiting for him at the lake.
          emotion: sad
