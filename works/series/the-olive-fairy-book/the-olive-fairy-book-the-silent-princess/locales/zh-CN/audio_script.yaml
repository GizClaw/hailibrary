  chapters:
    - id: ch01
      title: 金球的诅咒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，土耳其有一位帕夏，只有一个儿子。他把这孩子爱得不得了，任他整天玩耍，从来不叫他像别的孩子那样学本领。男孩最喜欢一只金球，从早玩到晚，倒也很少去打扰别人。
        - id: ch01-b02
          speaker: narrator
          text: >-
            一天，男孩坐在花园凉亭里，把金球沿着四壁滚出去，再伸手接住。他看见一个老妇人提着陶罐到井边打水，忽然接住金球，朝那只陶罐扔了过去。陶罐应声落地，摔得粉碎。老妇人吓了一跳，却因为惧怕帕夏，一句话也没说，只转身去拿另一只罐子。她刚走远，男孩便跑出去捡回了球。
        - id: ch01-b03
          speaker: narrator
          text: >-
            老妇人很快又扛着陶罐回来。她才握住罐柄，正要把罐子放进井里，只听啪的一声，陶罐又碎在脚边。她气得厉害，还是忍住没有出声，还拿出身上最后几个钱去买了新罐子。谁知第三只罐子也被金球击中，摔成了碎片。老妇人再也忍不住了。她朝男孩藏身的凉亭挥起拳头，高声喊了起来。
        - id: ch01-b04
          speaker: old_woman
          text: >-
            愿你爱上沉默的公主，受尽惩罚！
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: >-
            话一说完，老妇人便消失了。男孩起初根本没把这句话放在心上，后来甚至忘得一干二净。可是随着年岁增长，他开始懂得思量事情，那句诅咒也重新回到了脑海里。老妇人的脸和声音，连同那位从未见过的公主，又一次缠住了他。
        - id: ch01-b06
          speaker: prince
          text: >-
            沉默的公主究竟是谁？爱上她，为什么会是一种惩罚？
        - id: ch01-b07
          speaker: narrator
          text: >-
            他一遍又一遍地问自己，却始终找不到答案。这个谜不肯放过他，他也不肯放过这个谜。渐渐地，他忧思成疾，一天比一天虚弱，什么也吃不下，最后只能整日躺在床上。帕夏眼看儿子得了这种怪病，吓得不知如何是好。他把全国的医生都请到床前，一个接一个为年轻人诊治，可没有一个人说得出病因，更没有一个人找得到药方。
        - id: ch01-b08
          speaker: pasha
          text: >-
            儿子，你的病最初是怎么来的？或许我们弄清缘由，才能知道该怎样救你。
        - id: ch01-b09
          speaker: narrator
          text: >-
            年轻人便把童年时打碎陶罐的事，还有老妇人的那句话，全都告诉了父亲。讲完以后，他苦苦请求父亲让自己离开家乡。
        - id: ch01-b10
          speaker: prince
          text: >-
            请您答应，让我到外面的世界寻找那位公主吧。也许等我找到她，这场怪病就会好了。
        - id: ch01-b11
          speaker: narrator
          text: >-
            帕夏舍不得同独子分别，可他也明白，再把儿子留在家里，这年轻人一定会死。
        - id: ch01-b12
          speaker: pasha
          text: >-
            去吧，愿平安与你同在。
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: >-
            帕夏叫来最信任的总管拉拉，命他陪少主人上路。两人很快备好行装，在一个清晨出发了。这是一老一少两个人，谁也不知道该往哪里走，更不知道前面有什么在等着他们，只能一边赶路，一边寻找公主的踪迹。
    - id: ch02
      title: 通往黄宫的路
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            他们先在密林里迷了路，好不容易走出去，又闯进一片荒野。整整六个月，他们看不见半个活物，也几乎找不到水和食物。两人饿得只剩皮包骨头，破衣裳一条条挂在身上。他们早已忘了公主，只盼着能回到宫殿。
        - id: ch02-b02
          speaker: narrator
          text: >-
            一天，他们忽然发现自己站在一座山的半腰，脚下的石头像钻石一样灿烂。一个小老头迎面走来，两个人顿时快活起来。这个身影让许多往事重新浮现在心头，笼罩他们多时的麻木也像被魔法一扫而空。他们赶紧迎上去，问这是什么地方。老人告诉他们，这正是苏丹女儿端坐的山峰。公主裹着七重面纱，山石上的光就是从她身上照出来的。听见这消息，一路的艰难立刻从他们心里消失了。
        - id: ch02-b03
          speaker: prince
          text: >-
            怎样走，才能最快到她那里？
        - id: ch02-b04
          speaker: old_man
          text: >-
            耐心些，我的孩子。你还要再走六个月，才能到她同宫中女眷居住的宫殿。即便到了，也要趁着还能回头，仔细想清楚。你若不能叫她开口，就得像前面那些人一样，用性命抵偿。千万当心！
        - id: ch02-b05
          speaker: narrator
          text: >-
            王子只把这番告诫当成笑话。从前赶去见公主的那些人，也都是这样。三个月后，主仆二人登上另一座山顶，发现整片山坡竟是美丽的红色。悬崖不远处有个小村庄，村民热情地给他们饭吃，也给他们床睡。两个疲惫的旅人终于能伸直四肢，好好歇上一夜。
        - id: ch02-b06
          speaker: narrator
          text: >-
            第二天早晨，他们问主人还要走多久，也问起山坡为何如此红艳。
        - id: ch02-b07
          speaker: host
          text: >-
            再走三个半月，你们就能到公主的宫门前。这山上的红色，是她双颊和嘴唇的柔光穿过七重面纱照出来的。可从没有人见过她的脸。她总是坐在那里，一句话也不说。听说已经有许多人为了她丢了性命。
        - id: ch02-b08
          speaker: narrator
          text: >-
            王子不肯再听。他谢过主人的热情款待，立刻和拉拉继续攀登山路。他们走啊，走啊，一天也不停。夜里没有住处，便睡在树下或山洞里。路上没有饭食，就靠采来的野果和河里捉到的鱼充饥。最后，两个人的衣服几乎成了碎布，双腿也疲惫得再难迈动。就在这时，他们抬头望见一座黄大理石宫殿，正高高矗立在前方山顶。
        - id: ch02-b09
          speaker: prince
          text: >-
            终于到了！
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: >-
            王子像是忽然恢复了全部力气，连身体里的血也重新鲜活地奔流起来。可他和拉拉才朝山顶攀去，便惊恐地停在原地。前面的路上，到处都是死人的白骨和头颅。两个人一时谁也说不出话。还是王子先找回声音，竭力装出若无其事的样子，转头安慰同伴。
        - id: ch02-b11
          speaker: prince
          text: >-
            这些人一定都没能叫公主开口。好吧，要是我们也失败了，我们的骨头同样会留在这里。
        - id: ch02-b12
          speaker: lala
          text: >-
            殿下，现在回头还来得及！您父亲把您托付给我，可我们出发时，我根本不知道前面是一条必死的路。
          emotion: fearful
        - id: ch02-b13
          speaker: prince
          text: >-
            振作一点，拉拉！人反正只能死一次。再说，公主总有一天要开口，为什么不能是今天呢？
        - id: ch02-b14
          speaker: narrator
          text: >-
            他们又向前走，从一片又一片颜色深浅不同的头骨和尸骨间穿过。没过多久，两人来到另一座村庄，决定在这里稍稍休息，让头脑恢复清醒，好迎接前面的考验。这里的人也很亲切友善，脸上却全笼罩着愁苦，悲痛的哭喊不时撕开长空。
        - id: ch02-b15
          speakers: [villager_1, villager_2]
          ensemble: duo
          text: >-
            哥哥啊，你真的回不来了吗？儿子啊，我再也见不到你了吗？
          emotion: sad
        - id: ch02-b16
          speaker: narrator
          text: >-
            王子和拉拉问起缘由，虽然他们其实已经猜到了答案。
        - id: ch02-b17
          speaker: villager_1
          text: >-
            唉，你也是来这里送死的吗？这座城属于公主的父亲。谁想叫公主开口，都得先求苏丹准许。苏丹答应以后，他才会被带到公主面前。后来会怎样，你看看那些尸骨就知道了。
        - id: ch02-b18
          speaker: narrator
          text: >-
            王子低头道谢，想了一会儿，转身对拉拉说出了打算。
        - id: ch02-b19
          speaker: prince
          text: >-
            看来，我们的命运很快就要决定了。先尽量多打听消息，千万不要贸然行事。
        - id: ch02-b20
          speaker: narrator
          text: >-
            接下来两三天，他们一直在集市里走动，四处看，也四处听。一天早晨，王子遇见一个提着鸟笼的男人。笼里关着一只夜莺，那鸟儿唱得如此欢快，王子不由得停下脚步，站在那里听了好一阵。他当即提出要买下它，付清卖鸟人索要的高价，才把夜莺带回客店，挂在自己的房里。
        - id: ch02-b21
          speaker: lala
          text: >-
            为什么还要带上这个没用的累赘？您手上和心里的麻烦，难道还不够多吗？
        - id: ch02-b22
          speaker: narrator
          text: >-
            王子向来爱照自己的意思行事，根本没有理会。当天晚上，他独自坐在房里，苦苦思索怎样才能让公主开口。夜莺啄开虚掩的笼门，飞到他肩头，在耳边轻声问他。
        - id: ch02-b23
          speaker: nightingale
          text: >-
            殿下，你为什么这样忧愁？
        - id: ch02-b24
          speaker: narrator
          text: >-
            年轻人吃了一惊。他的故乡没有会说话的鸟，他也像许多人一样，害怕自己不能理解的事。不过他很快为这份胆怯感到羞愧，便说自己跋涉一年多，只为了娶苏丹的女儿，如今终于抵达，却想不到办法逼她开口。
        - id: ch02-b25
          speaker: nightingale
          text: >-
            这有什么可愁的？事情容易得很。今晚把我带进女眷居住的宫室，藏在金烛台宽大的底座下面。公主裹着七重厚面纱，谁也看不见她的脸。你先问候她，她一定不回答。接着，你就说只好同烛台聊几句。你负责问，我来回答。
    - id: ch03
      title: 烛台讲的故事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            王子用斗篷遮住夜莺，前去请求苏丹召见。他先把夜莺留在门外暗处，独自走到宝座前深深行礼。苏丹打量着这个高大英俊的年轻人，问他有何请求。听完来意，苏丹怜悯地摇了摇头。
        - id: ch03-b02
          speaker: sultan
          text: >-
            你若能叫她开口，她就是你的妻子。要是不能，山坡上的那些头骨，你已经看见了吧？
        - id: ch03-b03
          speaker: prince
          text: >-
            陛下，总有一天会有人打破魔咒，为什么不能是我？我已经立过誓，到了这里便不能退缩。
        - id: ch03-b04
          speaker: sultan
          text: >-
            既然你一定要去，那就去吧。
        - id: ch03-b05
          speaker: narrator
          text: >-
            苏丹命侍从把王子带到公主寝宫，只准他独自进去。众人走进黑沉沉的长廊时，天色已经渐渐暗了。王子趁人不注意，顺手取回藏在暗处的斗篷和鸟笼。很快，他独自站进一间空空荡荡的屋子。房里除了一堆丝绸软垫，就只有一座高高的金烛台。他望着那些软垫，知道自己日思夜想的公主正躺在那里，藏在一层层闪亮的面纱下面，心怦怦直跳。他又怕暗处还有别的眼睛盯着，便匆忙把夜莺放进支撑烛台的镂空底座。
        - id: ch03-b06
          speaker: narrator
          text: >-
            他转过身，尽力稳住声音，恭敬地问公主是否安好。公主连一根手指也没动，仿佛根本没有听见。王子又讲起自己的旅程和一路见过的奇异国度，房间里依旧没有一点回应。
        - id: ch03-b07
          speaker: prince
          text: >-
            看来这些事都不能让你感兴趣。我已经沉默着赶了这么久的路，现在实在想找个人说说话。既然如此，我只好同烛台聊几句了。最美丽的烛台，你好吗？
        - id: ch03-b08
          speaker: nightingale
          text: >-
            我好得很，大人。只是我真想知道，已经多少年没有人同我说过话了。既然你来了，不妨歇一歇，听我讲个故事。
        - id: ch03-b09
          speaker: prince
          text: >-
            我很乐意听。
        - id: ch03-b10
          speaker: narrator
          text: >-
            房间里没有给他的软垫，王子只好盘腿坐在地上。夜莺讲起一位帕夏的女儿。她是全国最美的姑娘，追求者多得数不清，可她眼光极高，最后只有三个人还值得她考虑。她偏偏拿不定主意，不知道自己最喜欢哪一个，便去请父亲指点。帕夏把三位年轻人召到面前，命他们各自学会一门技艺。六个月以后，谁学到的本领最出色，谁就能迎娶公主。
        - id: ch03-b11
          speaker: narrator
          text: >-
            三个人虽然有些失望，也承认这场考验很公平。他们结伴离开宫殿，一路商量该学什么。天气炎热，走到山腰的一眼泉水旁，他们停下来喝水休息。其中一个提议，三人把戒指压在石头下面，再分头寻找机会。谁先回来，就先拿走自己的戒指。这样既知道谁完成了命令，也能知道有没有人遭遇不测。
        - id: ch03-b12
          speakers: [suitor_second, suitor_third]
          ensemble: duo
          text: >-
            好，就这样办。
        - id: ch03-b13
          speaker: narrator
          text: >-
            他们挖了一个小洞，放进三枚戒指，再用石头仔细盖好。此后整整六个月，三人彼此没有一点消息。约定的日子一到，他们重新在泉边相见，欢喜地争着讲自己学会了什么。
        - id: ch03-b14
          speaker: suitor_eldest
          text: >-
            我看，公主一定会选我。世上有几个人能在一个钟头里走完一年的路程？
        - id: ch03-b15
          speaker: suitor_second
          text: >-
            这本领确实厉害。不过治理国家时，看见远方正在发生什么，也许更有用。这就是我学到的技艺。
        - id: ch03-b16
          speaker: suitor_third
          text: >-
            两位朋友，你们的本领都不错。可我能让死人复活，帕夏一听便会知道该选谁做女婿。快走吧，六个月只剩最后几个钟头了！
        - id: ch03-b17
          speaker: suitor_second
          text: >-
            先等等。我们最好看看宫里正在发生什么。
        - id: ch03-b18
          speaker: narrator
          text: >-
            第二个人从树上摘下几片叶子，一边低声念词，一边比画，再把叶子盖在眼睛上。刹那间，他脸色惨白，失声叫了起来。
        - id: ch03-b19
          speakers: [suitor_eldest, suitor_third]
          ensemble: duo
          text: >-
            出什么事了？你到底看见了什么？
          emotion: surprised
        - id: ch03-b20
          speaker: suitor_second
          text: >-
            公主躺在床上，只剩几分钟可活了！难道没有人能救她吗？
          emotion: fearful
        - id: ch03-b21
          speaker: suitor_third
          text: >-
            我能救她。这盒药膏可以治好任何疾病。可我们怎样才能及时赶到她身边？
        - id: ch03-b22
          speaker: suitor_eldest
          text: >-
            交给我。
        - id: ch03-b23
          speaker: narrator
          text: >-
            第一个人只让心念一动，三个人转眼便从泉边来到公主床前。苏丹和哭泣的群臣都围在那里。眼看一刻也不能再耽搁，公主已经失去知觉，脸也冷了。会配药膏的年轻人赶紧打开小盒，把手指探进药膏，再依次涂在公主的眼睛、嘴唇和耳朵上。做完这一切，他只能站在床边，心跳如鼓地等着结果。
        - id: ch03-b24
          speaker: narrator
          text: >-
            药膏生效得比他想象中还快。公主的双颊重新有了血色，她抬起头，对父亲微笑。苏丹欢喜得几乎说不出话，先疼爱地抱住女儿，再转向救了她的年轻人。
        - id: ch03-b25
          speaker: sultan
          text: >-
            你是不是六个月前被我派出去学艺的三个人之一？
        - id: ch03-b26
          speaker: narrator
          text: >-
            年轻人说正是，还告诉苏丹，另外两个人也正在赶回宫殿，等他评判谁的本领最高。夜莺讲到这里停了下来，问王子三人之中谁最有资格娶公主。
        - id: ch03-b27
          speaker: prince
          text: >-
            应该是配出药膏的人。
        - id: ch03-b28
          speaker: nightingale
          text: >-
            可要是没有那个能看见远方的人，他们根本不会知道公主病了。依我看，公主该嫁给他。
        - id: ch03-b29
          speaker: narrator
          text: >-
            一人一鸟越争越激烈。一直偷听的公主终于忍不住，从软垫上坐了起来。
        - id: ch03-b30
          speaker: princess
          text: >-
            你们这两个蠢人！若不是那个能及时赶到宫殿的人，药膏再好也来不及，公主早就被死神带走了。只有他才应该娶公主！
          emotion: angry
        - id: ch03-b31
          speaker: narrator
          text: >-
            公主一出声，守在门口的女奴便飞奔去向苏丹禀报这个奇迹。喜出望外的父亲急忙赶来。可公主已经明白自己中了精心安排的圈套，从此紧闭双唇，再也不肯说一个字。无论众人怎样劝说，她只肯用手势告诉父亲，想娶她的男人必须叫她开口三次。想到这件事根本不可能办到，她藏在七重面纱下面暗暗微笑。
        - id: ch03-b32
          speaker: narrator
          text: >-
            苏丹告诉王子，他虽然成功了一次，却还要再通过两次同样的考验。王子的脸顿时沉下来。他觉得这实在很不公平，又不敢当面反对，只好向苏丹深深行礼，趁机退到夜莺藏身的地方。天已经完全黑了，他偷偷把小鸟和笼子塞进斗篷，离开了宫殿。
        - id: ch03-b33
          speaker: nightingale
          text: >-
            你为什么愁眉不展？事情明明顺利极了。公主既然开了口，当然会恼恨自己。你看见没有？她说第一句话时，身上的面纱已经开始裂开。明晚再带我来，把我放到窗边的柱子上。什么都别怕，只要信任我。
    - id: ch04
      title: 柱子讲的故事
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            第二天太阳将落时，王子把鸟笼留在住处，让夜莺藏进衣褶，悄悄来到公主寝宫。守门女奴立刻放他进去。他故意从窗边走过，夜莺趁人不备跳上柱顶。王子向公主深深行礼，问了几个问题，她仍旧一声不出，连听见的样子也没有。过了一会儿，他再次行礼，走向窗边。
        - id: ch04-b02
          speaker: prince
          text: >-
            柱子啊，公主连一个字都不肯回答，我只好来找你说话了。这么久以来，你过得怎么样？
        - id: ch04-b03
          speaker: nightingale
          text: >-
            多谢关心，我好得很。幸亏公主不说话，不然你也不会想到我。为了报答你，我讲个最近听来的故事。我一直拿不定主意，正想听听你的看法。
        - id: ch04-b04
          speaker: prince
          text: >-
            那一定很有意思，请快讲吧。
        - id: ch04-b05
          speaker: narrator
          text: >-
            从前有个女人，美得让每个见到她的男人都倾心。她极难取悦，谁也不肯嫁，却又有办法让所有追求者继续做她的朋友。年复一年，她几乎没有察觉时光正在流逝。那些年轻人却一个接一个等得厌倦，转身娶了容貌或许不如她、性情却没有那么高傲的女子。最后，只剩巴尔德希、雅格德希和菲雷德希三个人还守着她。
        - id: ch04-b06
          speaker: narrator
          text: >-
            她仍旧孤芳自赏，认定自己比别的女人高贵，也比她们美丽。直到一天晚上，她坐在镜前，像往常一样慢慢梳理卷发，才终于看清了真相。在一片乌黑的发丝之间，竟藏着一根长长的白发。看见这个可怕的东西，她的心猛地一跳，仿佛紧接着就要停住。
        - id: ch04-b07
          speaker: vain_woman
          text: >-
            我正在变老！再不赶快选一个丈夫，以后就没人肯娶我了。那三个人明天都愿意娶我，可我偏偏不知道该选谁。必须想个办法，看出他们之中谁最好。
        - id: ch04-b08
          speaker: narrator
          text: >-
            她整夜没有合眼，一直盘算主意。第二天早晨，她穿好衣服，拔掉那根叫她烦恼了一夜的白发。
        - id: ch04-b09
          speaker: vain_woman
          text: >-
            就这么办吧。主意虽然不算高明，我也想不出更好的了。何况他们三个都不聪明，多半很容易上当。
        - id: ch04-b10
          speaker: narrator
          text: >-
            她叫女奴通知雅格德希，一个钟头后可以来拜访，又走进花园，在一棵树下挖好一座坟，旁边放上一幅白色裹尸布。雅格德希接到这份亲切的邀请，高兴得不得了。他特意穿上最新的衣服，急急忙忙赶到女子家中。可他走进屋，只见心爱的女子倒在软垫上伤心痛哭，一下便慌了神。
        - id: ch04-b11
          speaker: yagdashi
          text: >-
            美人，究竟出了什么事？
        - id: ch04-b12
          speaker: vain_woman
          text: >-
            一件可怕的事！两天前夜里，我父亲去世了，我把他埋在花园里。现在才知道，他原来是个巫师，根本没有死。坟已经空了，也不知道他正在什么地方游荡。
          emotion: sad
        - id: ch04-b13
          speaker: yagdashi
          text: >-
            这消息真糟。难道我不能替你做点什么吗？
        - id: ch04-b14
          speaker: vain_woman
          text: >-
            你可以裹上这幅白布，躺进坟里。三个钟头后他若还不回来，就会失去控制我的力量，只能去别处游荡。
        - id: ch04-b15
          speaker: narrator
          text: >-
            雅格德希见她把这么重要的事交给自己，得意极了。他用裹尸布包住全身，直挺挺躺进坟里。过了一阵，巴尔德希也应邀而来，看见那女子仍在呻吟哭泣。她告诉他，自己的父亲原来是个巫师，很可能会从坟墓里爬出来加害她。巴尔德希必须拿一块石头守在旁边，只要死人露出一点想动的迹象，就立刻砸碎他的脑袋。
        - id: ch04-b16
          speaker: narrator
          text: >-
            巴尔德希想到能替心爱的女子效劳，快活极了。他捡起石头，坐到埋着雅格德希的坟边。这时，正好到了菲雷德希平日来访的时辰。女子又告诉他，父亲有个仇敌，也是巫师。那恶巫师把父亲的尸体扔出坟墓，自己躺了进去。
        - id: ch04-b17
          speaker: vain_woman
          text: >-
            你只要把那个巫师带到我面前，他的魔力就会全部消失。否则，我可就完了。
        - id: ch04-b18
          speaker: feredashi
          text: >-
            夫人，为了你，还有什么事是我不肯做的！
        - id: ch04-b19
          speaker: narrator
          text: >-
            菲雷德希飞奔到坟边，拦腰抱起大吃一惊的雅格德希，把这具尸体甩到肩上，扛起来便往屋里跑。巴尔德希万万没有料到事情会这样发展，那女子先前也没教过他该如何应付。他惊得坐在原处，一动也不动。过了一会儿，他才猛地跳起来，把手里的石头朝两个飞奔的身影狠狠掷去，巴不得一下把他们砸死。幸好那块石头谁也没碰着。
        - id: ch04-b20
          speaker: narrator
          text: >-
            很快，三个人都到了女子面前。雅格德希还以为自己已经解除了巫师的魔力，便从菲雷德希背上滑下来，一把扯掉裹尸布。夜莺讲完，问王子谁最该娶那女子。
        - id: ch04-b21
          speaker: nightingale
          text: >-
            依我看，应该选菲雷德希。
        - id: ch04-b22
          speaker: prince
          text: >-
            不对。巴尔德希出力最多，那女子当然该嫁给他。
        - id: ch04-b23
          speaker: narrator
          text: >-
            夜莺偏不赞同，两人一本正经地争了起来。忽然，房里响起第三个声音，紧接着又传来面纱撕裂的声响。
        - id: ch04-b24
          speaker: princess
          text: >-
            你们怎么能说出这种蠢话！雅格德希在坟里躺了整整三个钟头，头顶还有石头随时会砸下来。那女子当然应该嫁给他！
          emotion: angry
        - id: ch04-b25
          speaker: narrator
          text: >-
            没过几分钟，消息便传到苏丹耳中。可他还是不答应婚事，除非女儿第三次开口。夜莺告诉王子，公主恼恨自己再次中计，已经命人把柱子砸碎。所以下一次，它必须藏进门边垂下的帷幔里。
    - id: ch05
      title: 帷幔讲的故事
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            次日傍晚，王子又走进宫殿，勇敢地直奔公主寝宫。一进门，夜莺便从他的臂弯下飞出来，落在门楣上，把整个身子藏进深色帷幔的褶皱。王子像前两晚一样，对公主说了许多话，可半句回答也没有。最后，他离开仍躺在闪亮面纱下的公主。七重面纱已经裂开了许多道口子。他穿过整个房间，慢慢朝门口走去。就在这时，帷幔那边传来一个声音，高高兴兴地回答了他。
        - id: ch05-b02
          speaker: narrator
          text: >-
            一人一鸟说了一会儿话。夜莺问王子爱不爱听故事，因为它最近听到一件事，觉得既有意思，又怎么也想不明白。王子马上请它讲下去。
        - id: ch05-b03
          speaker: nightingale
          text: >-
            从前，一个木匠、一个裁缝和一个学生结伴出门游历世界。几个月过去，他们走得疲惫不堪，便决定在一座合心意的小城里住下来，好好歇息。他们租了一间小屋，然后各自出门寻找能做的活计。每天太阳落山时，三个人回到同一个屋檐下，一边抽着烟斗，一边谈论当天各自见到的人和发生的事。
        - id: ch05-b04
          speaker: narrator
          text: >-
            一个仲夏夜比往常更热，木匠怎么也睡不着。他没有继续躺在软垫上翻来覆去，让自己越来越难受，而是聪明地起身喝了些咖啡，又点燃一支长烟斗。屋角的几块木头忽然映入眼帘。木匠有一双巧手，没过多久，就雕出一尊完美的少女像，看起来大约十四岁。他望着自己的作品，心满意足，心情也慢慢平静下来。困意终于涌上来，他回到床上，很快便睡熟了。
        - id: ch05-b05
          speaker: narrator
          text: >-
            那一夜，睡不着的并不只有木匠。空气里酝酿着一场雷雨，裁缝躺得心烦意乱，便打算下楼，到花园门外的小喷泉里泡一泡双脚，好让自己凉快些。要去门口，他必须经过木匠方才坐着抽烟的房间。他一走进去，便看见墙边站着一个美丽少女，顿时惊得说不出话。过了好一会儿，他才敢伸手触碰她。更让他吃惊的是，这位少女原来是木头做的。
        - id: ch05-b06
          speaker: tailor
          text: >-
            啊，我还能让你变得更美。
        - id: ch05-b07
          speaker: narrator
          text: >-
            裁缝从架子上取下一卷当天刚买来的黄绸。他仔细裁剪，披挂，再一针针缝合，终于替苗条的木像穿上一袭美丽长袍。衣裳做好，他也不再焦躁，回到床上睡觉去了。
        - id: ch05-b08
          speaker: narrator
          text: >-
            黎明将到，学生起身梳洗，准备迎着第一线阳光去清真寺。他一看见少女，便欣喜若狂地跪下，举起双手。
        - id: ch05-b09
          speaker: student
          text: >-
            你比暮色里的空气还美，仿佛披着万千星光。这样非凡的身体，不该没有灵魂。
        - id: ch05-b10
          speaker: narrator
          text: >-
            学生用全部心力祈祷，请求上天把生命吹进少女体内。他一心一意，久久不肯停下。终于，他的祈祷得到了回应。美丽的木像在他眼前活了过来，成了一个真正的少女。等木匠和裁缝醒来，三个人全都爱上了她。每个人都认定自己的功劳最要紧，每个人都想娶她做妻子。
        - id: ch05-b11
          speaker: nightingale
          text: >-
            那么，这个少女究竟属于谁？依我看，木匠最有资格得到她。
        - id: ch05-b12
          speaker: prince
          text: >-
            可要是裁缝没有用长袍衬出她的美，学生也不会想到祈求上天给她灵魂。
        - id: ch05-b13
          speaker: narrator
          text: >-
            他们很快便煞有介事地争吵起来。公主听见两人谁也不肯提学生的功劳，气得把沉默的誓言忘得一干二净。
        - id: ch05-b14
          speaker: princess
          text: >-
            你们这些蠢货！她除了学生，还能属于谁？没有学生，另外两个人做的一切都会白费。娶到少女的当然应该是学生！
          emotion: angry
        - id: ch05-b15
          speaker: narrator
          text: >-
            她的话音一落，七重面纱便从身上一层层滑落。那道把她藏了许久的屏障终于完全消失。公主从丝绸软垫上站起身，显露出世间从未有过的美貌。她微笑着向王子伸出了手。
        - id: ch05-b16
          speaker: princess
          text: >-
            你赢得了我。
          emotion: happy
        - id: ch05-b17
          speaker: narrator
          text: >-
            就这样，王子终于叫公主开口三次，赢得了她。两个人结为夫妻，宫中为他们举行了婚宴。宴会结束以后，他们没有忘记多年前那位被王子打碎陶罐的老妇人，特意派人把她接进宫殿。老妇人从此住在那里，做了他们孩子的乳母，一直幸福地生活到去世。
