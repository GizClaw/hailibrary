  chapters:
    - id: ch01
      title: The Old Woman's Wish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a pasha in Turkey who had only one son. He loved the boy so dearly that he let him spend every day amusing himself, while his friends were learning how to be useful.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The boy's favorite toy was a golden ball. He played with it from morning until night and generally troubled no one. One day he sat in a summerhouse in the garden. Again and again, he sent the ball running along the walls and caught it when it came back. While he played, he noticed an old woman entering the garden. She carried an earthen pitcher and was making her way toward the well in the corner.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At once he caught the ball and threw it straight at her pitcher. The pitcher struck the ground and shattered into a thousand pieces. The old woman jumped, but she said nothing. She turned to fetch another pitcher, and the boy hurried out to retrieve his ball as soon as she was gone.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He had barely returned to the summerhouse when she came back with a second pitcher on her shoulder. She had just taken hold of the handle and was about to lower it into the water. Crash! The golden ball struck again, and broken pieces fell around her feet. Of course she was angry now. Still, she feared what the pasha might do, so she forced herself to remain silent. With no pitcher left, she spent her last coins to buy one more.
        - id: ch01-b05
          speaker: narrator
          text: >-
            When the boy broke that one too, her anger could no longer be held in. She shook her fist at the summerhouse where he was hiding.
        - id: ch01-b06
          speaker: old_woman
          text: >-
            May you be punished by falling in love with the silent princess!
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: >-
            The moment she had spoken, she vanished.
        - id: ch01-b08
          speaker: narrator
          text: >-
            For a long time, the boy paid no attention to her words. He forgot them completely. But the years passed, and as he began to think more seriously, the old woman's wish came back to him.
        - id: ch01-b09
          speaker: prince
          text: >-
            Who is the silent princess? And why would loving her be a punishment?
        - id: ch01-b10
          speaker: narrator
          text: >-
            No answer came, yet that did not stop him. The questions circled through his mind again and again. Before long, he became weak and ill. He lost all desire for food, and in the end he could not leave his bed at all. His father was terrified by this strange sickness. The pasha called every physician in the kingdom and begged them to cure his son, but not one could discover a remedy.
        - id: ch01-b11
          speaker: pasha
          text: >-
            My son, how did this illness begin? If we knew that, perhaps we would know how to help you.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The young man told his father what had happened when he was a boy and repeated the old woman's strange wish.
        - id: ch01-b13
          speaker: prince
          text: >-
            Please let me go out into the world and search for this princess. Perhaps then this sickness will leave me.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The pasha could hardly bear to part from his only son. Still, he knew the young man would surely die if he remained at home.
        - id: ch01-b15
          speaker: pasha
          text: Go, my son, and may peace go with you.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Then the pasha called his trusted steward, the Lala, and ordered him to travel with his young master.
    - id: ch02
      title: Across the Mountains
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Their preparations did not take long. Early one morning, the prince and the Lala set out. Neither the young man nor the old one knew where to go or what lay ahead.
        - id: ch02-b02
          speaker: narrator
          text: >-
            First they lost their way in a thick forest. When they finally found a path out, it led them into a wilderness. For six whole months they wandered through that empty land without seeing another living creature. They could scarcely find enough food or water to keep themselves alive. Their bodies wasted until they were little more than skin and bone, and their torn clothes hung loosely from them. By then, both men had forgotten all about the silent princess. They had only one wish left. They wanted to find themselves safely back at the pasha's palace.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Then one day they found themselves on the shoulder of a mountain. The stones underfoot shone like diamonds. A tiny old man came toward them, and the sight of him stirred all their old memories. The numbness of their long wandering seemed to fall away, and they greeted him gladly.
        - id: ch02-b04
          speakers: [prince, lala]
          ensemble: duo
          text: Friend, where are we?
        - id: ch02-b05
          speaker: mountain_old_man
          text: >-
            This is the mountain where the sultan's daughter sits beneath seven veils. The stones shine because they reflect her own brilliance.
        - id: ch02-b06
          speaker: narrator
          text: >-
            At that news, the dangers of the journey vanished from their thoughts.
        - id: ch02-b07
          speaker: prince
          text: How can I reach her as quickly as possible?
        - id: ch02-b08
          speaker: mountain_old_man
          text: >-
            Be patient a little longer, my son. You must travel for another six months before you reach the palace where she lives among the women. Think carefully whenever you can. If you fail to make her speak, you will pay with your life, just as others have. Beware!
        - id: ch02-b09
          speaker: narrator
          text: >-
            The prince only laughed at the warning, as many men before him had done.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Three months later, the travelers reached the top of another mountain. The prince was surprised to see that its slopes were colored a beautiful red. Not far away, a little village clung to the cliffs. He proposed that they go there and rest. The villagers were glad to welcome strangers. They brought the travelers food and found beds where they could sleep. After so long on the road, the prince and the Lala were deeply thankful to stretch their aching bodies and truly rest.
        - id: ch02-b11
          speaker: narrator
          text: >-
            In the morning, they asked their host how much farther they had to travel. They also asked why this mountain was redder than all the others.
        - id: ch02-b12
          speaker: village_host
          text: >-
            You must keep going for another three and a half months. Then you will stand at the gate of the princess's palace. This mountain is red because the soft color of her cheeks and lips shines through the seven veils around her. No one has ever seen her face. She sits without speaking, though we hear that many men have died because of her.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The prince would hear no more. He thanked the man, rose at once, and set off up the mountain with the Lala.
        - id: ch02-b14
          speaker: narrator
          text: >-
            On and on they went, day after day. At night they slept wherever they could, sometimes beneath the trees and sometimes inside caves. They lived on wild berries and any fish they managed to catch in the rivers. The road seemed to have no end. At last, their clothes were almost nothing but rags, and their tired legs could scarcely carry them another step. Then they looked up. On top of the next mountain, they saw a palace built of yellow marble.
        - id: ch02-b15
          speaker: prince
          text: There it is at last!
          emotion: happy
        - id: ch02-b16
          speaker: narrator
          text: >-
            New strength seemed to fill him. But as the two men began climbing toward the palace, they stopped in horror. The ground was white with the skulls of dead men. The prince found his voice first and tried to sound careless.
        - id: ch02-b17
          speaker: prince
          text: >-
            These must belong to the men who tried to make the princess speak and failed. If we fail too, our bones will lie here with theirs.
        - id: ch02-b18
          speaker: lala
          text: >-
            Oh, turn back while we still can, my prince! Your father placed you in my care. When we left home, I never knew we were walking toward certain death.
          emotion: fearful
        - id: ch02-b19
          speaker: prince
          text: >-
            Take heart, Lala. A man can only die once. Besides, the princess must speak someday.
        - id: ch02-b20
          speaker: narrator
          text: >-
            So they continued upward. On either side lay skulls and dead men's bones, some newly white and some bleached by many years beneath the open sky.
    - id: ch03
      title: The Nightingale's Plan
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Before long, the prince and the Lala reached another village and decided to rest. They wanted their minds fresh for the task ahead. The people were kind, but their faces were gloomy, and mournful cries kept breaking through the air.
        - id: ch03-b02
          speaker: mourner
          text: >-
            Oh, my brother, have I lost you? Oh, my son, will I never see you again?
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: >-
            The travelers asked what these laments meant, though the bones had already made the answer plain.
        - id: ch03-b04
          speaker: mourner
          text: >-
            Ah, have you come here to die as well? This town belongs to the princess's father. Any reckless man who wants to make her speak must first ask the sultan's permission. If permission is granted, he is led before her. You can guess what happens next from all those bones.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The prince bowed his thanks and stood thinking for a little while. Then he turned to the Lala.
        - id: ch03-b06
          speaker: prince
          text: >-
            We will soon know our fate. Until then, we must learn everything we can and do nothing foolish.
        - id: ch03-b07
          speaker: narrator
          text: >-
            For two or three days, they walked through the bazaars, watching everything and listening to everyone. One morning they met a man carrying a nightingale in a cage. The bird's song was so joyful that the prince stopped in the middle of the market to listen. He liked it at once and offered to buy the nightingale from its owner.
        - id: ch03-b08
          speaker: lala
          text: >-
            Why burden yourself with something so useless? Your hands and your mind are already full. Must you carry one more thing?
          emotion: disgusted
        - id: ch03-b09
          speaker: narrator
          text: >-
            The prince liked his own way and ignored the objection. He paid the bird seller's high price, carried the cage to the inn, and hung it in his room.
        - id: ch03-b10
          speaker: narrator
          text: >-
            That evening he sat alone, trying and failing to invent some way to make the princess talk. The nightingale pushed aside the stick that fastened her cage, perched on his shoulder, and whispered in his ear.
        - id: ch03-b11
          speaker: nightingale
          text: What has made you so sad, my prince?
        - id: ch03-b12
          speaker: narrator
          text: >-
            The young man jumped in surprise. In his own country, birds did not talk. Like many people, he felt afraid when faced with something he could not understand. A moment later, he was ashamed of his foolishness and answered the bird. He had traveled for more than a year and crossed thousands of miles, he explained, all to win the hand of the sultan's daughter. Now he had finally reached his goal, but he could not think of any plan that would force the silent princess to speak.
        - id: ch03-b13
          speaker: nightingale
          text: >-
            Do not worry about that. It is easy. Take me to the women's apartments tonight. When you enter the princess's private room, hide me under the base of the great golden candlestick. She will be wrapped in seven thick veils, so she cannot see, and no one can see her face.
        - id: ch03-b14
          speaker: nightingale
          text: >-
            Ask about her health first. She will say nothing. Then tell her you are sorry to disturb her and that you will talk with the candlestick instead. Whenever you speak to it, I will answer.
        - id: ch03-b15
          speaker: narrator
          text: >-
            The prince covered the bird with his mantle and went to the palace. He asked for an audience with the sultan. Once it was granted, he left the hidden nightingale in a dark corner outside the door, approached the throne, and bowed low.
        - id: ch03-b16
          speaker: sultan
          text: What do you ask of me?
        - id: ch03-b17
          speaker: narrator
          text: >-
            The sultan studied the tall, handsome stranger. When he heard the prince's request, he shook his head with pity.
        - id: ch03-b18
          speaker: sultan
          text: >-
            If you make my daughter speak, she will become your wife. But if you fail, did you notice the skulls scattered over the mountainside?
        - id: ch03-b19
          speaker: prince
          text: >-
            Someone must break the spell one day, O Sultan. Why should that man not be me? I have given my word, and I cannot turn back now.
        - id: ch03-b20
          speaker: sultan
          text: Then go, if you must.
        - id: ch03-b21
          speaker: narrator
          text: >-
            The sultan ordered his attendants to show the prince the way to the princess's chamber. They were to take him as far as the door, but the young man must enter alone. By this time, evening had come and the palace corridors were growing dark. As the little procession passed the shadowy corner where he had left his things, the prince picked up his mantle and the hidden cage without anyone seeing what he had done.
        - id: ch03-b22
          speaker: narrator
          text: >-
            The room beyond was bare except for a heap of silk cushions and one tall golden candlestick. The prince's heart pounded as he looked toward the cushions. He knew that beneath the shining veils piled over them lay the princess he had wanted to find for so long. Then another thought struck him. Other eyes might be watching every move he made. He wasted no time and quickly slipped the nightingale beneath the open base that supported the golden candlestick.
        - id: ch03-b23
          speaker: narrator
          text: >-
            He turned, steadied his voice, and asked the princess how she was. Not even her hand moved to show that she had heard. He had expected her silence, so he told her about his travels and the strange lands he had crossed. Still, the room remained perfectly quiet.
    - id: ch04
      title: The First Answer
      blocks:
        - id: ch04-b01
          speaker: prince
          text: >-
            I can see that none of this interests you. I have had to keep quiet for so many months that now I must speak to someone. I think I will talk to the candlestick.
        - id: ch04-b02
          speaker: narrator
          text: >-
            He crossed the room behind the princess and addressed it.
        - id: ch04-b03
          speaker: prince
          text: Fairest candlestick, how are you?
        - id: ch04-b04
          speaker: nightingale
          text: >-
            Very well, my lord. I wonder how many years have passed since anyone last spoke to me. Now that you are here, sit down for a while and listen to my story.
        - id: ch04-b05
          speaker: prince
          text: I will listen gladly.
        - id: ch04-b06
          speaker: narrator
          text: >-
            There was no cushion for him, so he curled up on the floor while the nightingale began.
        - id: ch04-b07
          speaker: nightingale
          text: >-
            Once there was a pasha whose daughter was the most beautiful maiden in the kingdom. She had plenty of suitors, but she was hard to please. In time, only three men remained whom she could imagine marrying. She could not decide which she liked best, so she asked her father for advice.
        - id: ch04-b08
          speaker: nightingale
          text: >-
            The pasha summoned the three young men into his presence. He told each one to learn a trade and come back after six months. At the end of that time, they would show him what they had learned, and the cleverest man would become the princess's husband. The suitors may have hidden some disappointment, but none could deny that the test was fair. They left the palace together, talking as they went about which crafts they might choose.
        - id: ch04-b09
          speaker: nightingale
          text: >-
            The day was hot. When they came to a spring flowing from the mountainside, they stopped to drink and rest. Then one of them made a suggestion.
        - id: ch04-b10
          speaker: first_suitor
          text: >-
            We should each seek our fortune alone. Let us place our rings beneath this stone before we part. When each man returns, he can take his own ring. Then we will know whether everyone obeyed the pasha or whether some accident kept one of us away.
        - id: ch04-b11
          speakers: [second_suitor, third_suitor]
          ensemble: duo
          text: That is a good plan.
        - id: ch04-b12
          speaker: nightingale
          text: >-
            They made a little hollow beneath the stone, placed all three rings inside, and carefully covered them again. Then they parted and went off in three different directions. For the next six months, none of them knew what had happened to the others. On the exact day the pasha had appointed, all three arrived back at the spring. Each man found his ring waiting beneath the stone. They were overjoyed to meet again and quickly began telling one another where they had gone, how they had spent the time, and what they had learned.
        - id: ch04-b13
          speaker: first_suitor
          text: >-
            I believe I will win the princess. Not everyone can cross a journey of a whole year in a single hour!
        - id: ch04-b14
          speaker: second_suitor
          text: >-
            That is certainly clever. But a man who may govern a kingdom might find it even more useful to see what is happening far away. That is the skill I learned.
        - id: ch04-b15
          speaker: third_suitor
          text: >-
            No, my friends. Those trades are fine, but I can bring the dead back to life. When the pasha hears that, he will know which of us should be his son-in-law. Come, only a few hours remain. We must hurry to the palace.
        - id: ch04-b16
          speaker: second_suitor
          text: Wait. First, let me discover what is happening there.
        - id: ch04-b17
          speaker: nightingale
          text: >-
            He plucked a few small leaves from a nearby tree, spoke some words, made signs over them, and laid them across his eyes. In an instant, his face turned pale and he cried out.
        - id: ch04-b18
          speakers: [first_suitor, third_suitor]
          ensemble: duo
          text: What is it? What did you see?
          emotion: surprised
        - id: ch04-b19
          speaker: second_suitor
          text: >-
            The princess is in bed, and she has only minutes to live. Oh, can no one save her?
          emotion: fearful
        - id: ch04-b20
          speaker: third_suitor
          text: >-
            I can save her. This ointment will cure any sickness. But how can we reach her in time?
        - id: ch04-b21
          speaker: first_suitor
          text: Give the ointment to me.
        - id: ch04-b22
          speaker: nightingale
          text: >-
            He wished himself to the princess's bedside, and in an instant he was there. The sultan and his weeping courtiers stood around her bed. Anyone could see there was not a second to lose. The princess had fallen unconscious, and her face had already grown cold. The young man opened the little box, dipped his finger into the ointment, and touched the paste to her eyes, her mouth, and her ears. Then he stood beside her with his heart pounding and waited to see what would happen.
        - id: ch04-b23
          speaker: nightingale
          text: >-
            The cure worked sooner than he expected. Color returned to her cheeks, and she smiled at her father. The sultan could scarcely speak for joy. He embraced his daughter and turned to the man who had saved her life.
        - id: ch04-b24
          speaker: sultan
          text: >-
            Are you one of the three young men I sent away to learn a trade six months ago?
        - id: ch04-b25
          speaker: first_suitor
          text: >-
            Yes, O Sultan. The other two are already traveling here, so you may judge between us.
        - id: ch04-b26
          speaker: narrator
          text: >-
            The nightingale ended the tale and asked the prince which suitor had the best right to marry the princess.
        - id: ch04-b27
          speaker: prince
          text: >-
            The man who learned to make the healing ointment deserves her.
        - id: ch04-b28
          speaker: nightingale
          text: >-
            But without the man who could see across a great distance, they would never have known she was ill. I would choose him.
        - id: ch04-b29
          speaker: narrator
          text: >-
            Their argument grew hotter and hotter. Suddenly, the listening princess sprang up from her cushions.
        - id: ch04-b30
          speaker: princess
          text: >-
            You fools! Do you not understand? Without the man who could reach the palace in time, the ointment would have been useless. Death would already have taken her. He is the one who deserves the princess!
          emotion: angry
        - id: ch04-b31
          speaker: narrator
          text: >-
            At the very first sound of the princess's voice, the slave standing outside the door ran as fast as possible to tell the sultan that a miracle had happened. The delighted father hurried to his daughter's chamber. But by the time he arrived, the princess understood that the prince and the candlestick had tricked her into speaking. She closed her lips and would not utter another word.
        - id: ch04-b32
          speaker: narrator
          text: >-
            She would only make signs to her father. The man who wanted to marry her, she insisted, must make her speak three times. Beneath her seven veils, she smiled at the thought that such a thing was impossible.
        - id: ch04-b33
          speaker: narrator
          text: >-
            When the sultan explained that the prince had to pass the same test twice more, the young man's face darkened. It seemed unfair, but he dared not protest. He bowed and managed to step back near the hidden bird. Since it was fully dark now, he slipped the small cage beneath his cloak and left unseen.
        - id: ch04-b34
          speaker: nightingale
          text: >-
            Why do you look so gloomy? Everything happened exactly as it should. Of course the princess is angry with herself for speaking. Did you notice that the veils began to tear the moment she spoke? Take me back tomorrow evening and put me on the pillar beside the lattice. Do not be afraid. Trust me.
    - id: ch05
      title: The Second Answer
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Near sunset the next evening, the prince left the cage behind and hid the nightingale in the folds of his clothes. He slipped into the palace and went straight to the princess's rooms. The slaves at the door admitted him at once. He made sure to pass close to the window, where the bird hopped unseen onto a pillar.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The prince bowed low and asked the princess several questions. Just as before, she answered nothing and gave no sign that she could hear. After a few minutes, he bowed again and crossed to the window.
        - id: ch05-b03
          speaker: prince
          text: >-
            O pillar, talking to the princess is no use. She will not say a single word. Since I must speak to someone, I have come to you. How have you been all this time?
        - id: ch05-b04
          speaker: nightingale
          text: >-
            I am quite well, thank you. It is fortunate for me that the princess is silent. Otherwise, you would never have wanted my company. To repay you, I will tell you an interesting tale I recently overheard. Then you can give me your opinion.
        - id: ch05-b05
          speaker: prince
          text: That sounds delightful. Please begin at once.
        - id: ch05-b06
          speaker: nightingale
          text: >-
            Once there was a woman so beautiful that every man who saw her fell in love. But she was very hard to please. She refused every offer of marriage, though somehow she managed to remain friendly with all her admirers. The years slipped past almost without her noticing. One after another, the young men grew tired of waiting for a woman who would never choose. They went away and found wives who may not have been as handsome, but who were certainly less proud.
        - id: ch05-b07
          speaker: nightingale
          text: >-
            At last, only three suitors remained. Their names were Baldschi, Jagdschi, and Firedschi. Still the woman kept her distance and believed herself lovelier and better than everyone else. Then, one evening, the truth finally reached her. She was combing her dark curls before a mirror when she found one long white hair.
        - id: ch05-b08
          speaker: nightingale
          text: >-
            Her heart gave a leap and seemed to stop.
        - id: ch05-b09
          speaker: vain_woman
          text: >-
            I am growing old. If I do not choose a husband soon, I will never have one. Any of those three would marry me tomorrow, but how can I decide? I must find a way to discover which man is best, and I cannot waste any more time.
        - id: ch05-b10
          speaker: nightingale
          text: >-
            She lay awake all night making plans. In the morning she rose, dressed, and pulled out the white hair that had caused so much trouble.
        - id: ch05-b11
          speaker: vain_woman
          text: >-
            This plan will have to do. It is not very good, but I cannot think of a better one. None of them is clever, so they will probably fall into the trap.
        - id: ch05-b12
          speaker: nightingale
          text: >-
            She ordered her slave to tell Jagdschi that she would receive him in an hour. Then she went into the garden, dug a grave beneath a tree, and laid a white shroud beside it.
        - id: ch05-b13
          speaker: nightingale
          text: >-
            Jagdschi was delighted by the invitation. He put on his newest clothes and hurried to her house. Instead of the welcome he expected, he found her lying on her cushions and weeping bitterly.
        - id: ch05-b14
          speaker: jagdschi
          text: What has happened, O Fair One?
        - id: ch05-b15
          speaker: vain_woman
          text: >-
            Something terrible has happened. My father died two nights ago, and I buried him in the garden. Now I have discovered that he was a wizard and never truly died. His grave is empty, and he is wandering somewhere in the world.
          emotion: sad
        - id: ch05-b16
          speaker: jagdschi
          text: >-
            That is dreadful news. Is there anything I can do to comfort you?
        - id: ch05-b17
          speaker: vain_woman
          text: >-
            There is one thing. Wrap yourself in the shroud and lie inside the grave. If my father does not return within three hours, he will lose his power over me and must wander somewhere else.
        - id: ch05-b18
          speaker: nightingale
          text: >-
            Jagdschi was proud that she trusted him. He wrapped himself in the shroud and stretched out inside the grave.
        - id: ch05-b19
          speaker: nightingale
          text: >-
            After Jagdschi had been lying there for some time, Baldschi arrived for his visit. He too found the woman groaning and lamenting as if her heart would break. She told him that her dead father had been a wizard. There was every chance, she said, that he might try to leave his grave and return to do her harm. Baldschi must take a heavy stone, sit beside the grave, and watch closely. At the first sign that the body was moving, he was to crush its head.
        - id: ch05-b20
          speaker: nightingale
          text: >-
            Baldschi was delighted to serve her. He picked up a stone and sat beside the grave where Jagdschi lay.
        - id: ch05-b21
          speaker: nightingale
          text: >-
            Then the usual hour came for Firedschi's visit. He found the lady overcome with grief, just as the others had. She told him that a wizard who hated her father had thrown the dead man out of his grave and taken his place.
        - id: ch05-b22
          speaker: vain_woman
          text: >-
            If you can bring that wizard before me, all his power will disappear. If you cannot, I am lost.
        - id: ch05-b23
          speaker: firedschi
          text: >-
            My lady, there is nothing I would not do for you!
        - id: ch05-b24
          speaker: nightingale
          text: >-
            Firedschi ran straight to the grave. He seized the astonished Jagdschi around the waist, lifted the shrouded body over one shoulder, and hurried toward the house. Baldschi was so surprised by this turn of events that at first he sat perfectly still. The woman had given him no warning that anyone would carry the supposed wizard away. At last he leaped to his feet and hurled the stone after the two running figures, hoping that one blow might kill them both.
        - id: ch05-b25
          speaker: nightingale
          text: >-
            Luckily, the stone missed. Soon all three men stood before the woman. Jagdschi believed he had freed her from the wizard's power. He slid from Firedschi's back and threw off the shroud.
        - id: ch05-b26
          speaker: nightingale
          text: >-
            Now tell me, my prince. Which man deserved to win the lady? I would choose Firedschi.
        - id: ch05-b27
          speaker: prince
          text: >-
            No, it must be Baldschi. He went to the greatest trouble, so the lady belonged with him.
        - id: ch05-b28
          speaker: narrator
          text: >-
            The prince had understood the nightingale's wink. The bird refused to agree, and soon they were quarreling. Then a third voice burst in.
        - id: ch05-b29
          speaker: princess
          text: >-
            How can you speak such nonsense? You have forgotten Jagdschi! He lay in a grave for three hours with a stone held over his head. Of course the lady chose him for her husband!
          emotion: angry
        - id: ch05-b30
          speaker: narrator
          text: >-
            As she spoke, the sound of tearing cloth ran through the room.
    - id: ch06
      title: The Third Story
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Within minutes, the news reached the sultan. Even now, he would not consent to the marriage until his daughter had spoken for a third time. The prince asked the nightingale how they could manage it. The bird told him that the furious princess had ordered the pillar smashed to pieces, so this time he must hide inside the folds of the curtain beside the door.
        - id: ch06-b02
          speaker: narrator
          text: >-
            The next evening, the prince entered the palace and walked boldly to the princess's apartments. As he stepped inside, the nightingale flew from beneath his arm to the top of the door. The folds of the dark curtain hid the bird completely.
        - id: ch06-b03
          speaker: narrator
          text: >-
            As usual, the prince spoke to the princess and received no answer. At last he left her beneath the heap of shining veils, now torn in many places, and crossed toward the door. A voice from the curtain gladly replied to him.
        - id: ch06-b04
          speaker: narrator
          text: >-
            They talked for a while. Then the nightingale asked whether the prince enjoyed stories. The bird had recently heard one that was both interesting and puzzling. The prince begged to hear it at once.
        - id: ch06-b05
          speaker: nightingale
          text: >-
            Once a carpenter, a tailor, and a student set out together to see the world. They wandered from place to place for several months. At last, they grew tired of traveling and decided to stay for a while in a little town that pleased them. The three friends rented a small house and looked around for work. Every evening they came home at sunset, settled down with their pipes, and talked together about everything that had happened during the day.
        - id: ch06-b06
          speaker: nightingale
          text: >-
            One night in the middle of summer, the heat was worse than usual, and the carpenter could not sleep. He knew that tossing around on his cushions would only make him more uncomfortable. So he wisely got up, drank some coffee, and lit his long pipe. As he sat there, he noticed pieces of wood lying in a corner. He was very clever with his fingers. Before much time had passed, he had shaped the wood into a perfect statue of a girl about fourteen years old.
        - id: ch06-b07
          speaker: nightingale
          text: >-
            The work pleased him and quieted his mind. At last he felt sleepy again, so he returned to bed and fell fast asleep.
        - id: ch06-b08
          speaker: nightingale
          text: >-
            The carpenter was not the only one who could not sleep that night. Thunder hung in the heavy air, and the tailor grew so restless that he decided to go downstairs. He thought the cool water in the little fountain outside the garden door might soothe his hot feet. To reach that door, he had to cross the room where the carpenter had sat smoking his pipe. As he entered, he saw what looked like a beautiful girl standing against the wall.
        - id: ch06-b09
          speaker: nightingale
          text: >-
            For a moment, the tailor could not speak. When he finally dared to touch her hand, he was amazed to discover that she was made of wood.
        - id: ch06-b10
          speaker: tailor
          text: Ah, I can make you even more beautiful.
        - id: ch06-b11
          speaker: nightingale
          text: >-
            He fetched a roll of yellow silk that he had bought that day. He cut, draped, and stitched until the slender figure wore a lovely robe. Once the work was finished, his restlessness disappeared, and he went back to bed.
        - id: ch06-b12
          speaker: nightingale
          text: >-
            Near dawn, the student rose to attend the mosque at the first ray of sunlight. When he saw the maiden, he fell to his knees and lifted his hands in wonder.
        - id: ch06-b13
          speaker: student
          text: >-
            You are fairer than the evening air, clothed in the beauty of ten thousand stars. Surely such a rare form was never meant to exist without a soul.
        - id: ch06-b14
          speaker: nightingale
          text: >-
            Right there, the student began to pray with all his strength that life might be breathed into the figure. His prayer was heard. The beautiful wooden statue stirred and became a living girl. When the carpenter and the tailor woke, they saw what had happened. All three men fell in love with the maiden, and each one declared that he wanted her for his wife.
        - id: ch06-b15
          speaker: nightingale
          text: >-
            So tell me, who had the true right to the maiden? I think the carpenter deserved her.
        - id: ch06-b16
          speaker: prince
          text: >-
            But the student might never have thought to pray for her soul if the tailor's robe had not shown him how lovely she was.
        - id: ch06-b17
          speaker: narrator
          text: >-
            The prince knew exactly what answer the bird wanted from him. Soon the two were deep in another fine quarrel. The princess could bear it no longer. Furious that neither one had mentioned the student's part, she forgot her vow of silence.
        - id: ch06-b18
          speaker: princess
          text: >-
            You idiots! How could she belong to anyone but the student? Without him, everything the other two did would have been useless. Of course the student married the maiden!
          emotion: angry
    - id: ch07
      title: The Veils Fall
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            As the princess spoke, all seven veils fell away. She rose before them, the fairest princess the world had ever seen.
        - id: ch07-b02
          speaker: princess
          text: You have won me.
          emotion: happy
        - id: ch07-b03
          speaker: narrator
          text: >-
            Smiling, she held out her hand to the prince.
        - id: ch07-b04
          speaker: narrator
          text: >-
            And so the prince and the silent princess were married. When the wedding feast was over, they remembered the old woman whose earthen pitchers the prince had broken so many years before. They sent people to find her and bring her to the palace. From then on, she lived there with them. In time, she became nurse to their children, and she remained in the palace, safe and happy, until the end of her life.
