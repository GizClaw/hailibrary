  chapters:
    - id: ch01
      title: The Tiny Kingdom
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a king and queen whose country was so small that anyone could walk all the way around it in a day. They were good, simple people, always eager to be kind, though they were not especially wise. Their wish to please everybody often led them into trouble. The king let every subject speak at once. Anyone could advise him about governing the country or about another person's private affairs. With so many voices talking together, it was hard to make any law at all. Getting people to obey one was harder still.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Travelers always asked how the kingdom had become so tiny. The answer went back to King Petaldo's birth. His parents had promised him to a future niece of their friend, the fairy Gangana, if Gangana ever had one. Years passed, but no niece appeared. Petaldo forgot the promise. At twenty-five, he secretly married the beautiful daughter of a rich farmer, for he had fallen deeply in love with her.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Gangana flew into a rage when she heard. She hurried to the old king and demanded justice. In his heart, he thought his son had waited quite long enough for a girl who did not exist. He dared not say that to Gangana. She might cast some dreadful spell over the whole family. They could become birds or snakes, or worst of all, cold stones. Against his wishes, the old king disinherited Petaldo and forbade him to return to court. Petaldo would have become a beggar if his wife's father had not given her property. The young couple received permission to make that land a kingdom of their own.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Most princes would have been furious at such treatment, especially when the old king soon died and Petaldo's mother was delighted to rule in his place. But Petaldo was content. He arranged his tiny court just like his father's and asked for nothing more. He had a lord chamberlain, a high steward, and several gentlemen in attendance. His young queen chose ladies-in-waiting and maids of honor. Petaldo opened a mint to make his own coins, too. He appointed a seneschal over the capital's five policemen. They kept order and punished boys caught throwing stones at the palace windows.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The first seneschal was Petaldo's father-in-law, Caboche. Everyone loved him. Though he had risen from ordinary farmer to important minister, he was too sensible to grow vain. He still went out to his fields every day. Petaldo admired that so much that before long, he consulted Caboche about everything.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Each morning, the two men ate breakfast together. Then Petaldo opened his iron chest and pulled out great bundles of government papers. Sometimes they spent two hours deciding what to do. More often, Caboche listened for a few minutes and stopped him.
        - id: ch01-b07
          speaker: caboche
          text: >-
            Forgive me, Your Majesty, but you do not understand this matter at all. Let me handle it. I will put it right.
        - id: ch01-b08
          speaker: petaldo
          text: Then what am I supposed to do?
        - id: ch01-b09
          speaker: caboche
          text: >-
            You can manage your wife and tend your fruit garden. Those two things should keep you busy all day.
        - id: ch01-b10
          speaker: petaldo
          text: Perhaps you are right.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Secretly, Petaldo was pleased to escape the burdens of ruling. Caboche did all the work, but Petaldo never missed a grand occasion. He would appear in his royal mantle of red linen with a wooden scepter covered in gold. In the mornings, he studied books that taught him the right seasons for planting fruit trees and the proper time to prune them. In the afternoons, he practiced what he had learned in his garden. Each evening, he played cards with Caboche and ate supper in public beside the queen. By ten o'clock, everyone in the palace was fast asleep.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Queen Gillette was just as content. She loved her dairy, and no one in the kingdom made better cheese. However busy she was, she always baked a little barley cake and made a tiny cream cheese, then placed them beneath one particular rosebush. She could not say who took them. She only knew that on her wedding night, a fairy had appeared in a dream and told her to perform this ceremony.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The king and queen had six children. Then another little boy was born wearing a small red cap. He looked quite different from his brothers and sisters, and his parents loved Cadichon best of all.
    - id: ch02
      title: The Children Fly Away
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The children grew bigger. One day, after Gillette had baked the usual cake and turned it onto a plate, a lovely blue mouse climbed the table leg and ran toward it. Instead of chasing the mouse away, Gillette pretended not to notice. To her amazement, the creature picked up the cake and carried it toward the chimney.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Gillette sprang forward to stop it. At once, the mouse and cake disappeared. In their place stood an old woman only a foot tall, with ragged clothes hanging around her. She picked up a sharp, pointed iron stick and drew strange signs across the earthen floor. As she drew, she gave seven cries. Then she murmured so softly that Gillette understood almost nothing. Only three words reached her clearly. They were faith, wisdom, and happiness. The tiny woman seized the kitchen broom, whirled it three times around her head, and vanished.
        - id: ch02-b03
          speaker: narrator
          text: >-
            At that very moment, a tremendous noise burst from the next room. Gillette opened the door. Three huge cockchafers hovered there, each holding one princess between its feet. The three princes sat astride three swallows. In the middle floated a carriage made from a single pink shell and drawn by two robins. Cadichon sat inside beside the blue mouse. The mouse now wore a magnificent black velvet cloak fastened beneath her chin. Gillette could only stare. Before she recovered from her surprise, the cockchafers, robins, swallows, mouse, and all seven children flew singing toward the window. Then they disappeared from sight.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Gillette screamed so loudly that Petaldo and Caboche came running. Her words broke apart between sobs, but at last they understood. Each man grabbed a stout stick and rushed out to rescue the children, one searching in one direction and one in another.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Gillette sat where the men had left her and sobbed for at least an hour. At last, a folded paper dropped at her feet and made her look up. She bent down eagerly, hoping it held news of her lost children. The message was short, but it comforted her. The children were well and happy under a fairy's protection. Her own faith and good sense would decide whether happiness followed. The writer explained that she had eaten the food beneath the rosebush through all those years. Someday, she promised, Gillette's faithful gifts would be rewarded.
        - id: ch02-b06
          speaker: fairy_of_the_fields
          text: >-
            Everything comes to the one who knows how to wait. That is the advice of the Fairy of the Fields.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Comforted, Gillette washed her face and combed her shining hair. As she turned from the mirror, she saw a linnet on her bed. Yesterday, it would have seemed like an ordinary bird. After all the wonders of that morning, she felt certain that the writer of the letter had come to her.
        - id: ch02-b08
          speaker: gillette
          text: >-
            Pretty linnet, I will try to do everything you ask. Only please, from time to time, bring me news of my little Cadichon.
        - id: ch02-b09
          speaker: narrator
          text: >-
            The linnet flapped her wings, sang, and flew away. Gillette knew she had guessed correctly and silently thanked her.
        - id: ch02-b10
          speaker: narrator
          text: >-
            After a while, Petaldo and Caboche returned from their useless search, hungry and exhausted. They had left Gillette weeping, so her cheerful face astonished them. Soon astonishment turned to anger. Could she truly care so little for her children? Could she have forgotten all seven so quickly? What else could explain such a sudden change? They questioned her again and again, but Gillette would tell them nothing more.
        - id: ch02-b11
          speaker: gillette
          text: Everything comes to the one who knows how to wait.
        - id: ch02-b12
          speaker: caboche
          text: >-
            That is true. Besides, Your Majesty, the kingdom's income could hardly support seven royal children in the style their rank requires. We should be grateful to whoever has lifted that expense from us.
        - id: ch02-b13
          speaker: petaldo
          text: You are right! You are always right!
          emotion: happy
        - id: ch02-b14
          speaker: narrator
          text: >-
            Petaldo's smile returned, and palace life continued as before. Then news arrived that troubled him deeply.
    - id: ch03
      title: The Old Queen's New Youth
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Petaldo's mother had been a widow for some time. Now she suddenly decided to marry again. She had chosen the young king of the Green Isles. He was younger than her own son, handsome, and fond of every pleasure, while Petaldo was none of those things. Foolish as the old queen could be, she understood one truth clearly. An old and plain woman could hardly expect such a young man to fall in love with her. If she wanted the marriage, she would need a spell that gave back her youth and beauty.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Gangana could have made the change with one wave of her wand, but she and the queen were no longer friends. Gangana had tried hard to persuade her to name Gangana's niece as heir to the crown. The queen had refused. A second husband would be certain to inherit from her, so there was little hope that Gangana would help bring about the marriage. The queen sent messengers through every neighboring kingdom. They searched for any witch or fairy powerful enough to perform the miracle. None had the needed skill. If the king of the Green Isles was ever to become her husband, the queen had only one choice left. She must throw herself upon Gangana's mercy.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Gangana was furious when she heard the request. Yet she knew the king of the Green Isles had spent all his money and might marry even an old woman to gain more. Hiding her anger so she could gain time, she promised the spell would be finished in three days.
        - id: ch03-b04
          speaker: gangana
          text: In three days, you will have the change you desire.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The promise made the queen so happy that twenty years seemed to fall from her at once. For all three days, she counted not only the hours but every minute. The appointed moment finally came. Gangana appeared in a long robe of pink and silver. A tiny brown dwarf held up its train and carried a small box beneath one arm. The queen welcomed Gangana with every sign of respect she could think of. At the fairy's request, she ordered the great hall's doors and windows shut. Then she dismissed every attendant, leaving herself alone with her guest.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Kneeling, the dwarf offered the box. Gangana took out a little vellum book with silver clasps, a wand that grew longer when touched, and a crystal bottle of perfectly clear green water. She seated the queen in the center of the room and placed the dwarf opposite her. With a golden rod, she drew three circles around them. She touched each circle three times with her wand and sprinkled both figures with the green liquid.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Slowly, the queen's large features shrank and her face grew fresher. At the same time, the dwarf doubled in height. Blue flames leaped from the circles. The sight terrified the queen so badly that she fainted. When she woke, Gangana and the dwarf were gone.
        - id: ch03-b08
          speaker: narrator
          text: >-
            At first, the queen felt confused and could not clearly remember what had happened. Then the whole scene returned to her. She leaped from the chair and ran to the nearest mirror. How happy she was! Her long nose and jutting teeth had changed into beautiful features. Her hair was thick and curly, and it shone like bright gold. Gangana had truly kept her promise. In her hurry and delight, however, the queen missed something important. She had not become a beautiful young woman. She had become a very tall little girl, perhaps eight or nine years old.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Her velvet gown, fur edging, and gold embroidery were gone. She wore a straight muslin dress and a little lace apron. Instead of being twisted up with diamond pins, her hair fell in curls down her back. An even greater change had taken place. Except for her love of the king of the Green Isles, her mind had become a child's as surely as her face had.
        - id: ch03-b10
          speaker: narrator
          text: >-
            The courtiers noticed, though the queen did not. They had no idea what had happened or how to behave until the chief minister ordered his wife and daughters to copy the queen's clothes and speech. Soon the whole court, men included, dressed and talked like children. They played with dolls and tin soldiers. State dinners offered only iced fruit and sweet cakes shaped like birds and horses.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Whatever she was doing, the queen talked constantly about the king of the Green Isles, calling him her little husband. Weeks passed without his arrival. She grew so cross and impatient that the courtiers avoided her. They were tired of pretending to be children and whispered about serving another ruler. Then one day, a loud trumpet blast announced the long-awaited guest.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Everyone smiled again. Ignoring court rules, the queen rushed to meet the young king at the foot of the stairs. She tripped over her dress and tumbled down several steps, screaming with fright like a child. She was not badly hurt, though her nose was scratched and her forehead bruised. Her servants carried her away and bathed her face with cold water. Still, she ordered them to bring the king to her the instant he entered.
        - id: ch03-b13
          speaker: narrator
          text: >-
            By now, the queen's head ached badly. A shrill trumpet sounded outside her door, sending a fresh stab of pain through it, but she was too excited to care. Between two lines of deeply bowing courtiers, the young king came quickly toward her. Then he saw the queen with her scratched nose, bruised forehead, and wet bandages. He burst into such violent fits of laughter that he could not remain in the room. He fled from her chamber and even left the palace.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Once the queen recovered from the insult, she sent her attendants after him. No promise or plea could bring him back. Her temper grew worse, and her courtiers began a plot to take away her crown. They would have succeeded if Gangana, who had only meant to prevent the marriage, had not restored the queen's proper form. The queen gave her no thanks. One sight of her old face in the mirror filled her with despair, and from that day she hated Gangana with deadly hatred.
    - id: ch04
      title: The Children on Bambini
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            And where had Petaldo's children been through all these events? They were living on the island of Bambini. There they had as many playmates as their hearts could desire and plenty of fairies to care for every one of them. Yet of all seven princes and princesses who had flown through Gillette's window, Cadichon alone was good and obedient. His six brothers and sisters were rude, noisy, and forever quarreling. At last, no child on the island would play with them. As punishment, the Fairy of the Fields turned all six into marionettes. They would stay that way until they learned better behavior.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Then, at the worst possible moment, the Fairy of the Fields decided to visit her friend, the queen of the fairies, on a distant island. She wanted advice about Cadichon's future. As she entered the Hall of Audience, Gangana was coming out. The two enemies exchanged sharp words, and Gangana flew away in a rage. The Fairy of the Fields told the queen the whole story of Gangana's wickedness and begged for guidance.
        - id: ch04-b03
          speaker: fairy_queen
          text: >-
            Do not lose hope. For a little while, Gangana must be allowed to have her way. At this very moment, she is carrying Cadichon to the island where she still keeps her own niece imprisoned. But if she makes an evil use of the power she holds, her punishment will be both swift and terrible. Now take this precious bottle. Guard it with great care. The liquid inside will make you invisible and protect you from the piercing eyes of every fairy. Remember, though, it has no power at all against the eyes of mortals.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Feeling somewhat lighter, the Fairy of the Fields returned to Bambini. To protect the six marionettes from Gangana, she sprinkled them with the invisible water. She left only the very tips of their noses untouched, so she could recognize them herself. Then she hurried to Petaldo's kingdom.
        - id: ch04-b05
          speaker: narrator
          text: >-
            She found Petaldo's kingdom in open revolt. For the first time since he took the throne, the king had dared to charge his subjects a tax. The people were so angry that the trouble might have ended in war. They might even have cut off Petaldo's head. The Fairy of the Fields discovered a way to satisfy everyone before either disaster happened. Then she secretly whispered to Gillette once more that all was well with her children. She could not bring herself to tell the anxious mother that Cadichon had been lost to Gangana.
    - id: ch05
      title: Beyond the Dragons
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            By consulting her magic books, the Fairy of the Fields discovered what had happened to Cadichon. Gangana had placed the poor little boy on an enchanted island. A rapid river flowed all around it. The current was so powerful that it swept whole rocks and trees along with it. Even anyone who crossed that torrent would meet a second defense. Twenty-four enormous dragons guarded the shore. They breathed flames without stopping, forming a wall of fire that no one seemed able to pass.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The Fairy of the Fields knew every danger that waited there, but she had a brave heart. By one means or another, she was determined to overcome each obstacle and rescue Cadichon from Gangana's power. She took the invisible water with her and sprinkled it over her body. Then she mounted her favorite winged lizard and set out. When the enchanted island appeared in the distance, she wrapped herself securely in a mantle that fire could not burn. She told the lizard to return home without her. Invisible beneath her fireproof covering, she slipped past all twenty-four dragons and entered the island.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Almost at once, Gangana approached. She was speaking loudly and angrily to a genius flying beside her. Hidden from their fairy eyes, the Fairy of the Fields listened. Petaldo's mother had died in a rage after learning that the king of the Green Isles had married a young and beautiful bride. Instead of leaving her kingdom to Gangana, the old queen had given it to one of Petaldo's children.
        - id: ch05-b04
          speaker: gangana
          text: >-
            All the trouble I took over that foolish old woman will not be wasted! Go to my stables now. Choose the strongest, fastest griffins and harness them to the yellow coach. Drive to Bambini as quickly as you can and seize the six children of Petaldo who are still there. I will deal with Petaldo and Gillette myself. Once the whole family is here, I will turn the parents into rabbits and the children into dogs. I have not yet decided what to do with Cadichon.
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: >-
            The Fairy of the Fields waited to hear no more. If Petaldo's family was to escape that dreadful fate, she had to reach the fairy queen at once. There was no time to call her lizard. She flew across the island, passed the dragons, and touched the ground beyond them.
        - id: ch05-b06
          speaker: narrator
          text: >-
            At that exact instant, a black cloud rolled above her. Thunder tore through the air, and the ground rocked under her feet. Then wild flashes of lightning lit the sky. Each flash showed her the twenty-four dragons fighting among themselves. They shrieked and howled until it seemed the whole earth must hear the uproar. The Fairy of the Fields, brave as she was, trembled with terror. She stood rooted to the spot through the darkness, unable to take another step.
        - id: ch05-b07
          speaker: narrator
          text: >-
            At daybreak, the island, the rushing river, and every dragon were gone. A barren rock stood in their place. On its peak was a black ostrich. Cadichon sat on its back beside Gangana's little niece, the child for whose sake the fairy had committed so many evil deeds.
        - id: ch05-b08
          speaker: narrator
          text: >-
            As the Fairy of the Fields stared in amazement, the ostrich spread its wings and flew toward the Fortunate Isle. Still unseen, the good fairy followed. The ostrich entered the great hall where the fairy queen sat upon her throne.
    - id: ch06
      title: Gangana's Punishment
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            In her new ostrich form, Gangana was proud and certain of victory. The laws of fairydom were clear. If she could lay Cadichon at the fairy queen's feet and receive him back from the queen's hands, the boy would remain in her power for the rest of his life. She could do anything she wished with him, and no one could interfere. The Fairy of the Fields knew that law just as well as Gangana did. The dreadful events of the night had almost used up her strength. Even so, she drove herself onward, knowing she had only moments to act.
        - id: ch06-b02
          speaker: narrator
          text: >-
            With one mighty effort, the good fairy snatched both children from the ostrich's back and placed them on the fairy queen's lap.
        - id: ch06-b03
          speaker: narrator
          text: >-
            The ostrich screamed in defeated rage and turned away. Gangana appeared in its place. She stood before the throne and waited for the doom she had brought upon herself.
        - id: ch06-b04
          speaker: fairy_queen
          text: >-
            You ignored every warning I gave you. This is my sentence. For two hundred years, you will lose every privilege of a fairy. You will live as an ostrich and serve the lowest and most wicked of the genii you chose as friends. I will keep these children with me and raise them here at my court.
          emotion: angry
    - id: ch07
      title: Everything Comes in Time
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            And so Cadichon and Gangana's niece remained together at the fairy queen's court. Under her care, they grew from children into young adults. When they were old enough, the two were married. Then the Fairy of the Fields brought them home to the kingdom that Petaldo's mother had left behind. Petaldo was reigning there now, just as the old queen's will had intended for his family.
        - id: ch07-b02
          speaker: narrator
          text: >-
            After so many years of peaceful country life, the daily cares of government weighed too heavily on both Petaldo and Gillette. They were delighted to step away from the throne. Together, they laid aside their crowns and placed them upon the heads of Cadichon and his bride. The new queen was as good as she was beautiful, even though she was the niece of wicked Gangana.
        - id: ch07-b03
          speaker: narrator
          text: >-
            Cadichon had learned his lessons well at the fairy queen's court. Never, in all the kingdom's history, had its people been governed so wisely or lived so happily. They walked through the streets and fields, smiling at the difference between the old days and the new. Softly, they whispered to one another.
        - id: ch07-b04
          speakers: [citizen_one, citizen_two, citizen_three]
          ensemble: chorus
          text: Everything comes to the one who knows how to wait.
