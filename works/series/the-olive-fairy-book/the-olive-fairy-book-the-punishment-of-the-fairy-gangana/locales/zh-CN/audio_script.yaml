audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容温厚，悲剧转折处克制而沉静
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    petaldo:
      display_name: 佩塔尔多
      tts:
        delivery: 随和知足，遇事常带几分天真和迟疑
        timbre: 温和明亮的成年男声
        pace: 适中
        pitch: 中
    caboche:
      display_name: 卡博什
      tts:
        delivery: 务实直率，说话笃定而不失恭敬
        timbre: 厚实沉稳的老年男声
        pace: 适中偏慢
        pitch: 中低
    gillette:
      display_name: 吉莱特
      tts:
        delivery: 朴实温柔，惊惧时急促，安心后坚定
        timbre: 柔和清亮的成年女声
        pace: 适中
        pitch: 中高
    gangana:
      display_name: 冈加娜
      tts:
        delivery: 骄傲强势，愤怒时尖锐狠厉
        timbre: 冷亮有穿透力的成年女声
        pace: 适中偏快
        pitch: 中高
    field_fairy:
      display_name: 田野仙女
      tts:
        delivery: 慈爱勇敢，危急时清醒果断
        timbre: 温润清澈的成年女声
        pace: 适中
        pitch: 中
    fairy_queen:
      display_name: 仙女王后
      tts:
        delivery: 威严端庄，安慰人时沉着，宣判时严峻
        timbre: 饱满庄重的成年女声
        pace: 舒缓
        pitch: 中低
    old_queen:
      display_name: 王太后
      tts:
        delivery: 爱慕虚荣，孩子心性时尖细任性
        timbre: 华贵却略显苍老的女声
        pace: 适中偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 小小的王国
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有一对国王和王后，统治着一个小得出奇的国家。一个人走上一天，就能沿着国境绕完一圈。夫妻俩善良又朴实，也一心想对所有人好，只是并不十分聪明。国王准许臣民们同时开口，不光议论国家大事，连别人家的私事也要出主意。这样一来，订立一条法律很难，要叫人服从就更难了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            每个路过的旅人，总要问这个国家怎么会如此之小。原来，佩塔尔多刚出生时，父母就把他许配给好友冈加娜仙女未来的侄女。当然，前提是冈加娜以后真能有一位侄女。可一年又一年，仙女始终没有侄女，年轻王子也渐渐把命定的新娘忘得一干二净。二十五岁那年，他深深爱上一位富农的美丽女儿，瞒着家里，悄悄娶了她。
        - id: ch01-b03
          speaker: narrator
          text: >-
            冈加娜听说后怒不可遏，立刻赶去向老国王问罪。老国王心里明白，儿子等这位始终没有出现的新娘，已经等得够久了。可他半句也不敢替儿子辩解，生怕仙女向全家施下可怕的魔法，把他们变成鸟，变成蛇，或者更糟，变成毫无知觉的石头。他只好违心地剥夺儿子的继承权，也禁止他再进宫。幸好儿媳从农夫父亲那里得到一片产业，佩塔尔多获准把它建成自己的王国，才没有沦为乞丐。
        - id: ch01-b04
          speaker: narrator
          text: >-
            多数王子遭到这种待遇，一定会气愤不平。何况老国王不久便去世，王后还欢欢喜喜地接过王位。佩塔尔多却并不怨恨。他生性知足，只照着父亲的样子，给自己的小朝廷配上宫务大臣、总管和几位侍从绅士。年轻王后也有自己的女官和宫女。他还开办铸币所，又任命宫廷总管，带领京城仅有的五名警察维持秩序，还管教那些朝宫窗扔石头时被抓个正着的男孩。
        - id: ch01-b05
          speaker: narrator
          text: >-
            第一任宫廷总管正是国王的岳父卡博什。他原本只是普通农夫，骤然做了大官也毫不虚荣，仍每天照常巡视田地。人人都爱戴他，国王也佩服他的明理，从此无论做什么，都要先听他的意见。
        - id: ch01-b06
          speaker: narrator
          text: >-
            翁婿俩每天一起吃早餐。饭后，佩塔尔多从铁箱里搬出一捆捆国事文书，请总管商议。有时他们要谈两个钟头，可更多时候，没过几分钟，卡博什就会打断他。
        - id: ch01-b07
          speaker: caboche
          text: >-
            请陛下恕罪，这件事您实在不懂。还是交给我，我会把它办妥。
        - id: ch01-b08
          speaker: petaldo
          text: >-
            那么，我该做些什么呢？
        - id: ch01-b09
          speaker: caboche
          text: >-
            您可以管管王后，再照料果园。这两件事，足够占满您一整天了。
        - id: ch01-b10
          speaker: petaldo
          text: >-
            嗯，你说得大概没错。
        - id: ch01-b11
          speaker: narrator
          text: >-
            佩塔尔多暗自庆幸，治理国家的烦恼总算有人承担。不过每逢大典，他必定披上红麻布王袍，手持镀金木权杖，隆重露面。平日里，他上午读园艺书，学习何时栽树修枝，下午便到果园实践。晚上，他陪岳父打牌，同王后当众用餐。十点一到，全宫上下都睡熟了。
        - id: ch01-b12
          speaker: narrator
          text: >-
            吉莱特王后同样快活。她爱待在乳品房里，做出的奶酪美味极了，全国找不到第二个人能同她相比。无论手里有多少活，她每天都会烤一块小大麦饼，再做一枚小小的奶油奶酪，把它们放到花园里一株特定的玫瑰树下。若有人问这是为谁准备的，食物又去了哪里，她自己也回答不出。她只记得新婚那夜，一位仙女曾在梦中出现，吩咐她天天照这个仪式去做。
        - id: ch01-b13
          speaker: narrator
          text: >-
            夫妻俩有了六个孩子以后，又生下一个男孩。小家伙出生时头上便戴着红帽子，跟哥哥姐姐全不一样。父母叫他卡迪雄，也最疼爱他。
    - id: ch02
      title: 飞出窗口的孩子们
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            孩子们渐渐长大。一天，吉莱特刚把烤好的饼倒进盘子，一只漂亮的蓝老鼠就沿桌腿爬上来。王后没有赶它，只装作没看见。小老鼠捧起饼，向壁炉搬去。王后正要阻拦，老鼠和饼忽然同时消失，那里竟站着一个一英尺高、衣衫褴褛的老太婆。
        - id: ch02-b02
          speaker: narrator
          text: >-
            老太婆拿起尖头铁棍，在泥地上画出几个古怪的符号。她一边画，一边叫了七声，嘴里还低低念着听不清的咒语。王后竖起耳朵，只辨出“信念”“智慧”和“幸福”几个词。接着，老太婆抓起厨房扫帚，在头顶转了三圈，转眼不见了。
        - id: ch02-b03
          speaker: narrator
          text: >-
            隔壁随即传来一阵巨响。王后推门一看，三只大金龟子各自用脚挟着一位公主，三只燕子背上则各坐着一位王子。它们中间还有一辆用整只粉红贝壳做成的小车，由两只知更鸟拉着。卡迪雄坐在车里，旁边正是那只蓝老鼠，此刻它却披着华丽的黑丝绒斗篷，颏下的带子系得整整齐齐。王后还没从惊愕中回过神，所有孩子和鸟兽已经唱着歌，一齐飞向窗口，从她眼前消失了。
        - id: ch02-b04
          speaker: narrator
          text: >-
            她的尖叫引来丈夫和父亲。王后断断续续说清经过，两人便抓起粗棍，分头出门寻找孩子。她独自哭了一个多钟头，忽然有一张折好的纸落到脚边。
        - id: ch02-b05
          speaker: narrator
          text: >-
            吉莱特赶忙弯腰捡起纸条，盼着上面会有失踪孩子的消息。信虽短短几行，却让她安下心来。信上说，孩子们正受一位仙女保护，平安又快乐。她日后的幸福，全看自己能不能守住信念，谨慎行事。这些年玫瑰树下的食物，写信人全都吃了，将来一定报答她。信末署名田野仙女，并留下一句忠告：懂得等待的人，终会等到一切。
        - id: ch02-b06
          speaker: narrator
          text: >-
            王后于是站起来，洗去脸上的泪痕，又把闪亮的头发梳理整齐。她刚从镜前转过身，就看见床上停着一只红雀。无论谁来看，都只会觉得它是一只寻常小鸟。要是在昨天，王后也一定这样想。可这个早晨已经发生了太多奇事，她半点没有怀疑，立刻认定写信的仙女就在眼前。
        - id: ch02-b07
          speaker: gillette
          text: >-
            美丽的红雀，我会尽力按你的吩咐去做。只求你偶尔带来一点小卡迪雄的消息。
        - id: ch02-b08
          speaker: narrator
          text: >-
            红雀拍着翅膀唱了几声，飞走了。吉莱特知道自己猜对，默默向它道谢。
        - id: ch02-b09
          speaker: narrator
          text: >-
            过了一阵，国王和卡博什一无所获，又累又饿地回来。他们离开时，王后还哭个不停，如今竟已神色欢欣。两人又惊讶又有点生气，忍不住怀疑，她难道真的不在乎孩子，才过这么一会儿就把他们忘了？又是什么让她突然变了模样？可不管两人怎样追问，吉莱特始终只有一个回答。
        - id: ch02-b10
          speaker: gillette
          text: >-
            懂得等待的人，终会等到一切。
        - id: ch02-b11
          speaker: caboche
          text: >-
            这话不错。陛下也该想想，王国那点收入，恐怕养不起七位按照身份生活的王子公主。既然有人替您卸下重担，您应该感谢才是。
        - id: ch02-b12
          speaker: petaldo
          text: >-
            你说得对！你总是对的！
          emotion: happy
        - id: ch02-b13
          speaker: narrator
          text: >-
            国王重新笑逐颜开，宫里的生活又恢复了旧日模样。后来，一个消息传来，终于打破了佩塔尔多的安宁。
    - id: ch03
      title: 王太后的青春
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            佩塔尔多的母亲寡居已久，忽然决定再婚。她看中了绿岛的年轻国王。那人比她亲生儿子还年轻，又英俊又爱享乐。王太后虽然常犯糊涂，却知道自己年老貌平，年轻人很难爱上她。要让婚事成功，她必须借助魔法恢复青春和美貌。
        - id: ch03-b02
          speaker: narrator
          text: >-
            冈加娜挥一挥魔杖，本来就能办到。可仙女曾要求王太后立自己的侄女为王位继承人，遭到拒绝，两人早已绝交。王太后派使者走遍邻国，始终找不到法力足够高强的女巫或仙女。想嫁给绿岛国王，她最后只能低头求冈加娜。
        - id: ch03-b03
          speaker: narrator
          text: >-
            冈加娜听完来意，心里怒火熊熊。她也知道，绿岛国王已经花光钱财，为了得到新的财富，连这位老妇人也可能愿意娶。仙女藏住真实心思，只说三天后便会完成魔法。
        - id: ch03-b04
          speaker: narrator
          text: >-
            这句承诺让王太后高兴得像是立刻年轻了二十岁。三天里，她不只数着每个钟点，甚至数着每一分钟，盼望约定的时刻快些到来。时候终于到了。冈加娜穿着粉红与银色相间的长袍现身，一个棕色小矮人跟在后面，替她提起长长的袍摆，臂下还夹着一只小盒子。
        - id: ch03-b05
          speaker: narrator
          text: >-
            王太后恭敬迎接，又照仙女吩咐关紧大厅门窗，叫侍从全部退下。小矮人跪地献上盒子，冈加娜从中取出带银扣的羊皮书、一碰便伸长的魔杖，还有一瓶澄澈的绿水。
        - id: ch03-b06
          speaker: narrator
          text: >-
            王太后坐在大厅中央，小矮人站在她对面。冈加娜用金杖在两人周围画了三个圈，又拿魔杖各点三下，把绿水洒向他们。王太后的五官渐渐缩小，脸庞越来越鲜嫩，小矮人却长高了一倍。三个圆圈还蹿出蓝火。王太后吓得昏了过去，醒来时，仙女和侍童都不见了。
        - id: ch03-b07
          speaker: narrator
          text: >-
            她先是迷迷糊糊，随后想起一切，连忙奔向镜子。长鼻子和龅牙变美了，浓密的金发卷曲闪亮。冈加娜果真实现了承诺。只是王太后太过欢喜，没有发现自己并非年轻女子，而是一个身量很高的八九岁女孩。
        - id: ch03-b08
          speaker: narrator
          text: >-
            那件镶着毛皮、绣满金线的华贵丝绒礼服，也变成了直筒薄纱裙和蕾丝小围裙。原本总要仔细盘起、再用钻石发针固定的头发，如今卷曲着披在背后。更糟的是，除了仍旧爱慕绿岛国王，她的心智也同容貌一起退回了孩童时代。她自己一点没有察觉，廷臣们却看得明明白白。
        - id: ch03-b09
          speaker: narrator
          text: >-
            大家既猜不出发生过什么，也不知道从今往后该怎样服侍她。首相先做出榜样，命令妻子和女儿模仿王太后的穿着和说话方式。没过多久，整个宫廷都跟着学了起来。就连男人也打扮成孩子，说话学孩子的口气，整日玩洋娃娃和锡皮小兵。国宴上再也没有别的菜，只剩冰镇水果，还有做成小鸟和马匹模样的甜饼。
        - id: ch03-b10
          speaker: narrator
          text: >-
            王太后无论正在做什么，嘴里几乎都不停谈起绿岛国王，总把他叫作“我的小丈夫”。可几个星期过去，这位小丈夫仍不见踪影。她越等越不耐烦，脾气也越来越暴躁，廷臣们见了她便尽量躲开。大家早已厌倦每天假装孩子，开始私下商量离开王宫，投奔邻国的君主。就在这一天，一阵响亮的号角突然传来，宣告大家盼望已久的客人终于到了。
        - id: ch03-b11
          speaker: narrator
          text: >-
            人人立刻重新堆起笑容。王太后不顾礼仪，坚持到楼梯底下迎接。匆忙中，她踩住裙子，像受惊的孩子一样尖叫着滚下几级台阶。她只擦破鼻子、撞青额头，却不得不让人抬回房间，用冷水敷脸。即便如此，她仍命令众人，国王进宫后必须马上来见她。
        - id: ch03-b12
          speaker: narrator
          text: >-
            门外尖锐的号角让她疼痛的脑袋又抽了一下，可迎接未来丈夫的喜悦压过了一切。年轻国王穿过两列鞠躬的廷臣，快步走来。谁知他一看见王太后满脸绷带，就狂笑不止，只得先退出房间，最后干脆离开王宫。
        - id: ch03-b13
          speaker: narrator
          text: >-
            王太后受不了这般无礼，羞恼了好一阵。等她缓过来，立刻催促侍从追赶，把年轻国王请回宫中。可是无论许下多少好处，怎样苦苦哀求，他都不肯回来。她的脾气变得比从前更坏，廷臣们甚至开始谋划废黜她。那场阴谋本来必定成功，幸好冈加娜只想破坏婚事，并不想叫她失去王位，便及时让她恢复了本来面貌。
        - id: ch03-b14
          speaker: narrator
          text: >-
            冈加娜恢复了王太后的本来形貌，也保住了她的王位。可王太后重新看到镜中那张年老而平常的脸，不但没有感谢这位朋友的帮助，反而绝望万分。从那一天起，她对冈加娜怀着致命的仇恨，再也没有消散。
    - id: ch04
      title: 烈焰环绕的魔岛
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            佩塔尔多的七个孩子，此时都在班比尼岛。那里有数不清的玩伴，也有仙女照顾他们。可七个孩子中，只有卡迪雄善良听话。其他六个无礼又爱争吵，谁也不愿陪他们玩。仙女只好把他们变成提线木偶，等他们学会好好待人再说。
        - id: ch04-b02
          speaker: narrator
          text: >-
            偏偏在这个不凑巧的时刻，田野仙女决定前往一座遥远的岛，拜访自己的朋友仙女王后。她想同王后商量，卡迪雄以后究竟该怎么办。她刚走进议事大厅，正遇上冈加娜从里面出来。两个仇敌迎面碰上，恶狠狠地争执了几句。冈加娜怒气冲冲地飞走后，田野仙女便把她做过的所有恶事从头讲了一遍，恳求王后指点。
        - id: ch04-b03
          speaker: fairy_queen
          text: >-
            放下心来。眼下还得暂时由她妄为。她正在把卡迪雄带往囚禁侄女的岛上。不过她若滥用力量，严厉的惩罚很快就会降临。这个珍贵的小瓶交给你，务必收好。里面的液体能让你隐身，任何仙女都看不见你，不过凡人的眼睛仍能看见。
          emotion: calm
        - id: ch04-b04
          speaker: narrator
          text: >-
            田野仙女带着稍稍轻快一些的心情，回到自己的岛。为了保护六个新变成的木偶，不让邪恶的冈加娜找到他们，她给每一个木偶都洒上几滴隐身之水，只留下鼻尖没有沾湿，这样自己日后还能认出他们。随后，她赶到佩塔尔多的王国，却见全国正在叛乱。国王登基以来第一次胆敢征税，百姓便闹了起来，事情差点发展成战争，连佩塔尔多的脑袋都险些保不住。
        - id: ch04-b05
          speaker: narrator
          text: >-
            仙女想出办法，让所有人满意，又悄悄告诉吉莱特，孩子们一切安好。她没有勇气说出卡迪雄已经失踪。
        - id: ch04-b06
          speaker: narrator
          text: >-
            后来，田野仙女从自己的魔法书中查到，冈加娜把可怜的卡迪雄关在一座魔岛上。全岛被一条湍急的河流环绕，奔腾的水中卷着岩石和整棵大树。河流之外，还有二十四条硕大无比的喷火巨龙把守。它们吐出的火焰连成一道高墙，看来世上没有谁能够穿过。
        - id: ch04-b07
          speaker: narrator
          text: >-
            田野仙女并不退缩。她决心越过所有障碍，救回卡迪雄。她带上隐身之水，洒遍全身，骑着心爱的翼蜥出发。魔岛一出现，她就裹紧防火斗篷，叫翼蜥先回家，自己从巨龙间溜过，踏上小岛。
        - id: ch04-b08
          speaker: narrator
          text: >-
            她刚进去，就看见冈加娜走来，正冲着一名飞在身边的精灵高声发怒。田野仙女从她的话中得知，佩塔尔多的母亲已经死了。王太后听说绿岛国王娶了年轻美貌的新娘，竟活活气死。她没有把王国留给冈加娜，而是遗赠给佩塔尔多的一个孩子。
        - id: ch04-b09
          speaker: gangana
          text: >-
            我在那个愚蠢的老太婆身上费了那么多工夫，绝不能白费！马上去马厩，挑出最强壮、最快的狮鹫，套上黄马车。你用最快速度赶到班比尼岛，把佩塔尔多留在那里的六个孩子全抓来。
          emotion: angry
        - id: ch04-b10
          speaker: gangana
          text: >-
            佩塔尔多和吉莱特由我亲自处置。等把全家关到这里，我就让父母变成兔子，让孩子变成狗。至于卡迪雄，我还没决定拿他怎么办。
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: >-
            田野仙女没有留下来再听一句。若要救这一家人逃过如此可怕的命运，必须立刻请仙女王后相助，半点时间也不能浪费。她甚至来不及召回自己的翼蜥，便独自飞越整座岛，从喷火的巨龙身旁穿过。她的双脚刚重新落到地面，一团黑云便从头顶滚过。震耳的雷声撕开天空，大地也在她脚下猛烈摇晃。
        - id: ch04-b12
          speaker: narrator
          text: >-
            一道道狂乱的闪电照亮天空，也照亮二十四条互相厮杀的巨龙。它们发出尖叫和咆哮，那场喧嚣仿佛传遍了整个世界。田野仙女吓得浑身发抖，双脚像扎了根，站在原地动弹不得。直到天亮，小岛、激流和巨龙竟全都消失了，眼前只剩下一块荒凉的巨岩。
        - id: ch04-b13
          speaker: narrator
          text: >-
            巨岩顶端站着一只黑鸵鸟，背上坐着卡迪雄，还有冈加娜的小侄女。冈加娜正是为了这个孩子，才做下那么多恶事。田野仙女惊讶地望着眼前的奇景。黑鸵鸟忽然展开双翼，朝幸运岛飞去。善良的仙女仍隐着身形，紧紧跟在后面。鸵鸟飞进一座宏伟的大厅，仙女王后正端坐在自己的宝座上。
    - id: ch05
      title: 冈加娜的惩罚
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            变成鸵鸟的冈加娜骄傲极了，还以为胜利已经握在手中。按照仙界所有律法，只要她成功地把卡迪雄放在仙女王后脚下，再由王后把男孩交还给她，卡迪雄这一生就归她掌控，任她怎样处置都可以。田野仙女也很清楚这条律法。虽然一夜的惊险已经几乎耗尽体力，她还是拼命赶上去。
        - id: ch05-b02
          speaker: narrator
          text: >-
            冈加娜即将飞到宝座之前。最后一刻，田野仙女使出全身力气，猛地从鸵鸟背上夺下两个孩子，抢先把卡迪雄和小姑娘一起放到仙女王后的膝头。
        - id: ch05-b03
          speaker: narrator
          text: >-
            鸵鸟发出一声挫败的怒叫，转身退开。冈加娜随即现出原形，站在那里，等待自己招来的惩罚。
        - id: ch05-b04
          speaker: fairy_queen
          text: >-
            我一次次警告你，你却从不理会。现在听我的判决。两百年内，你会失去仙女的一切权力，变成鸵鸟，给你那些精灵朋友当中最卑微、最邪恶的一个做奴隶。这两个孩子由我留下，在我的宫廷中长大。
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: >-
            仙女王后的判决立刻生效。两个孩子果真留在她身边，在仙女宫廷中接受细心的抚养和教导。他们就这样平安地一年年长大，直到成了大人，也到了可以结婚的年纪。随后，田野仙女亲自把他们送回王太后的国家。那时，佩塔尔多已经在那里继承了母亲留下的王位。
        - id: ch05-b06
          speaker: narrator
          text: >-
            佩塔尔多和吉莱特过惯了多年的清静日子，重新承担国事以后，才发现那副重担对两个人都太沉了。因此，他们能够摘下自己的王冠，分别戴到卡迪雄和新娘头上时，简直高兴极了。那位姑娘既善良又美丽，尽管她偏偏是邪恶的冈加娜的亲侄女。
        - id: ch05-b07
          speaker: narrator
          text: >-
            卡迪雄在仙女王后的宫廷里受到悉心教导，把学到的道理牢牢记在心里。等他接过王位，治理国家的本领也显露出来。自从这个王国建立以来，从未有过如此清明妥善的治理，百姓也从未生活得这样幸福。人们走过城里的街道，又走过乡间的田野，想着旧日和如今有多么不同，脸上个个带着喜悦的笑，还彼此轻声说着那句熟悉的话。
        - id: ch05-b08
          speaker: narrator
          text: >-
            懂得等待的人，终会等到一切。
