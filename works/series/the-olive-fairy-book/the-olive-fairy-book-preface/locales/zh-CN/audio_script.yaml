audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    unnamed_speaker:
      display_name: 一位读者
      tts:
        delivery: 直截了当，略带不耐烦的提醒
        timbre: 清晰自然的成年声音
        pace: 适中
        pitch: 中
    child_1:
      display_name: 孩子甲
      tts:
        delivery: 天真笃定，兴致勃勃
        timbre: 明亮清脆的童声
        pace: 稍快
        pitch: 较高
    child_2:
      display_name: 孩子乙
      tts:
        delivery: 好奇活泼，语气真诚
        timbre: 轻快自然的童声
        pace: 稍快
        pitch: 高
    child_3:
      display_name: 孩子丙
      tts:
        delivery: 热切爽朗，毫不拘束
        timbre: 清亮有力的童声
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 佩罗与《仙女宝库》
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 许多年前，我的朋友兼出版商查尔斯·朗曼先生送了我一套《仙女宝库》。这套书大得惊人，几乎得像安放《不列颠百科全书》那样，专门找一架旋转书柜才盛得下。我也的确把它放进了这样的书柜。可我的书房实在太窄，窄到连“抡一只猫”都做不到。家里又出了些与这狭窄地方“并非全无关系”的状况，于是，那架会转的书柜眼下偏偏转不动了。
        - id: ch01-b02
          speaker: narrator
          text: 即便如此，我还能看见其中至少四十卷，整套大概有六十卷。里面的童话来自四面八方，仙女、巫婆、精灵、巨灵、怪兽、恶龙、狠心的继母都在其中。还有美貌或平凡的公主，走运或倒霉的王子，以及巨人、侏儒和形形色色的魔法。最先出现的，是孩子最喜欢的老故事：《蓝胡子》《穿靴子的猫》《大拇指汤姆》《小红帽》《睡美人》，还有《蛤蟆与珍珠》。
        - id: ch01-b03
          speaker: narrator
          text: 一六九七年，这些故事第一次在巴黎被收集、写定，印成了书。作者夏尔·佩罗先生头戴硕大的假发，是当时赫赫有名的人物。他还写过许多厚重的书，如今都没人读了。他哪里想得到，真正让后人记住自己的，竟是一本不起眼的小书，书眉上只有小小的插图。那些画跟福特先生笔下的仙境当然没法比。爱打板球的作家们据说叫福特“越墙福特”，因为他一挥棒，球就会被狠狠打过墙去。
        - id: ch01-b04
          speaker: narrator
          text: 佩罗的故事来自儿子的保姆。她讲的是乡间流传的旧故事，佩罗听来以后，又用优雅机智的宫廷口吻讲了一遍。将近三十年过去，它们似乎才被译成英文。伊顿的书商波特先生把英法文字排在相对的两页上出版。伊顿那些年纪较小的学生肯学多少法语，大概有不少就是从这些童话里学来的。毕竟，它们可比《忒勒马科斯历险记》有趣得多。那本书的作者费讷隆大人，头衔长得吓人。他既是法兰西王室子弟的老师，又是康布雷大主教兼公爵，还是神圣罗马帝国亲王。
    - id: ch02
      title: 宫廷童话的盛衰
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 佩罗会成功，是因为路易十四的宫廷本来就爱听童话。塞维涅夫人在信中提过，宫廷贵妇们会聚在一起讲这些故事。佩罗出了名，模仿者自然跟着来了。欧诺瓦夫人便是其中一位。这位四处漂泊的女士，才智比名声好得多。我们今天能读到《美女与野兽》和《黄矮人》，都要归功于她。
        - id: ch02-b02
          speaker: narrator
          text: 安东尼·汉密尔顿也写过一篇《公羊》，只是故事太长，头绪又太乱。人们记得最牢的，反而是故事里那句提醒。
        - id: ch02-b03
          speaker: unnamed_speaker
          text: 公羊，我的朋友，还是从头讲起吧！
        - id: ch02-b04
          speaker: narrator
          text: 这提醒一点也不冤枉，《公羊》确实讲得不够明白。再后来，加朗先生译出了《一千零一夜》。直到今天，也没有人能比他译得更好。他的做法跟严谨的学术翻译正好相反，可读起来实在痛快。要是亚历山大·仲马曾经答应翻译荷马，后来真把诺言兑现了，那么《伊利亚特》和《奥德赛》大概也会这样好读。
        - id: ch02-b05
          speaker: narrator
          text: 加朗删掉了诗歌，也删掉了一大批没人会想念的段落。后来那些读来无趣的学术译本又把它们收入，人类学家据说还觉得那些内容很宝贵，很有教益。接着，勤勉的作者们写出了波斯故事、海上故事，也编出不少模仿童话的新作。可惜它们长得过了头，根本成了小说。孩子不爱看，有品位的大人也不会喜欢。
        - id: ch02-b06
          speaker: narrator
          text: 一七八六年，就在大革命前夕，这些作品被统统收进那套浩大的《仙女宝库》。当时的社会极其矫揉造作，人们嘴上却热衷于“简朴生活”和“自然状态”。也许，故事故意摆出的质朴模样正合他们心意。可革命已在眼前。很快，人性最原始的一面，就要在血腥的狂欢中显露出来。宫廷和宫廷童话也就此走到了尽头。
    - id: ch03
      title: 孩子自己会选书
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 宫廷童话倒下的时候，另一批故事受到了注意。格林兄弟、沃尔特·司各特爵士等学者，开始搜集世界各地农民和原始部族口耳相传的故事。他们发现，各地的故事表面不同，骨子里却差不多。《灰姑娘》到处都有。考克斯小姐甚至写了整整一本书来研究它。那是本很好的书，只不过孩子不会觉得有趣。
        - id: ch03-b02
          speaker: narrator
          text: 真要给孩子挑外国童话，最好的有格林兄弟的德国故事、达森特爵士的《北欧故事集》，还有弗里尔小姐收集的印度故事。有些糊涂的“大人”曾说《北欧故事集》“有伤风化”。此外，原始部族和乡民童话还有成百上千种集子，不少都很有意思。卡拉韦主教的祖鲁故事尤其出色，还附着祖鲁语原文。可是父母和叔伯接触不到它们，孩子当然也就看不到。
        - id: ch03-b03
          speaker: narrator
          text: 我希望大人准许孩子自己挑书。把钱交给他们，让他们进书店自由选择吧。孩子很清楚自己喜欢什么。倘若孩子天生爱书，亲爱的父母却不爱，这样的事确实有，那孩子往往选得更好。他们不会装模作样。有的想拥有一套自己的莎士比亚，有的宁愿要一本《巴斯特·布朗》。喜欢诗歌的孩子已经少得叫人叹气，喜欢历史的就更少了。
        - id: ch03-b04
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: 我们知道世上没有仙女，可历史故事都是真的呀！
        - id: ch03-b05
          speaker: narrator
          text: 这些小家伙真天真。我不敢肯定世上没有仙女，却很清楚一件事：那些最精彩的“历史故事”，往往并不是真的。
        - id: ch03-b06
          speaker: narrator
          text: 孩子真正爱听的是鬼故事。他们一开口，总会提出同一个要求。
        - id: ch03-b07
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: 给我们讲个鬼故事！
        - id: ch03-b08
          speaker: narrator
          text: 这话正合我意，我也完全有本事满足他们。我昨天才听到一个最新的真实鬼故事，只靠着极大的克制，才忍住没在这里讲出来。那个故事特别适合孩子。《灰色鬼故事书》准会很受欢迎。我很小的时候看过许多书籍广告，因为买不起其中几十本书，伤心得哭了。后来有人倒真送了我一本书，却是植物学著作！绿色布面装帧得很漂亮，看上去像模像样，翻开来却全是各种无聊东西。
    - id: ch04
      title: 这一卷故事
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我们这套《仙女宝库》不可能真的出到六十卷。编书时，我们想讨孩子欢心，不想迎合那些“大人”。从前的法国作家，写传奇故事才是冲着大人去的。我们却到世界各处寻找童话，并不只盯着欧洲。本卷承蒙伊格纳兹·库诺斯博士相助，用一则土耳其故事开篇。《小洛克国王》则是阿纳托尔·法朗士先生的原创作品。他十分慷慨，准许兰夫人根据《蜜蜂公主》加以改写。
        - id: ch04-b02
          speaker: narrator
          text: 坎贝尔少校跟以前一样，讲述自己在印度当地人中间收集的故事。各篇故事通常会在末尾标明出处。偶尔没有注明，孩子也不会想念这些资料。除了另有说明的篇目，本书大部分故事都由兰夫人翻译，再按照小读者的需要改写。斯科夫高-彼得森夫人从丹麦文译出了《绿骑士》。最后，我要特别感谢马克莱先生。他准许我们选用《亚美尼亚故事集》中的几篇。那部书由欧内斯特·勒鲁出版社在巴黎出版。
