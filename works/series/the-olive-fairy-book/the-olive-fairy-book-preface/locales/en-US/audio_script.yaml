  chapters:
    - id: ch01
      title: The Fairy Cabinet
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Many years ago, my friend and publisher, Mr. Charles Longman, gave me Le Cabinet des Fees, or The Fairy Cabinet. It is such an enormous collection that it almost needs one of those swinging bookcases made for the Encyclopaedia Britannica. I put the volumes in a revolving bookcase instead. But my study is so narrow that there is no room to swing a cat, as the saying goes, and now the bookcase cannot revolve. Even so, I can see at least forty volumes on it, and I believe the complete set has about sixty.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Those volumes are packed with fairy tales from every quarter. There are fairies and witches, genii, or Djinn, monsters and dragons, wicked stepmothers, pretty princesses and plain ones, lucky princes and unlucky ones, giants, dwarfs, and enchantments. The collection begins with the old stories children like best: Blue Beard, Puss in Boots, Hop o' My Thumb, Little Red Riding Hood, The Sleeping Beauty, and Toads and Pearls.
        - id: ch01-b03
          speaker: narrator
          text: >-
            These tales were first collected, written down, and printed in Paris in 1697. Their author was Monsieur Charles Perrault, a famous gentleman who wore a magnificent periwig. In his own day he wrote large books that nobody reads now. He could never have guessed that people would remember him chiefly for one shabby little volume with tiny pictures at the tops of its pages.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Those little pictures were nothing like Mr. Ford's fairy drawings. Authors who play cricket are said to call him Over-the-wall Ford because he hits the ball with such force. Perrault gathered the country tales told by his little boy's nurse, then retold them in his own witty, courtly fashion.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Nearly thirty years passed before the tales seem to have reached English readers. Then Mr. Pote, a bookseller at Eton, published them with English on one page and French on the facing page. The younger Eton boys probably learned as much French as they cared to learn from those fairy tales. They were certainly more entertaining than Telemaque, written by Messire Francois de Salignac de la Motte-Fenelon, tutor to the children of France, Archbishop Duke of Cambrai, and Prince of the Holy Roman Empire.
    - id: ch02
      title: Fairy Tales at Court
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Perrault succeeded because the court of Louis the Fourteenth delighted in fairy tales. A letter from Madame de Sevigne tells us that court ladies shared such stories among themselves. Of course, other writers soon followed Perrault. One was Madame d'Aulnoy, a wandering lady better known for her wit than for her reputation. We owe Beauty and the Beast and The Yellow Dwarf to her.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Anthony Hamilton tried the same sort of writing in The Ram. His story is so long and muddled that it is chiefly remembered for one remark: “Ram, my friend, begin at the beginning!” The Ram could certainly have told his tale more clearly.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Next came The Arabian Nights in Monsieur Galland's translation. No one has translated it better. His version is not scientific in the least, but it is wonderfully pleasant to read. It is the kind of book the Iliad and the Odyssey might have become if Alexandre Dumas had kept his promise to translate Homer. Galland left out the poems and many other passages that no ordinary reader would miss. Anthropologists are supposed to value those passages in later, more scientific translations, but those versions do not amuse.
        - id: ch02-b04
          speaker: narrator
          text: >-
            After that came Persian tales, sea tales, and new inventions shaped more or less like fairy stories. Industrious men and women wrote them, but they are much too long. They are really novels, and they would please neither a child nor a grown person with any taste. All of them were gathered into the huge Fairy Cabinet, published in 1786 just before the Revolution.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Perhaps their effort to sound simple pleased a society that was extremely artificial. People talked about the simple life and the state of nature. Meanwhile, they stood on the edge of a revolution in which human nature would show its most primitive side in orgies of blood.
    - id: ch03
      title: The Books Children Choose
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The Revolution ended the court and its fairy tales. Just as both were swept away, scholars such as the Brothers Grimm and Sir Walter Scott began studying the popular stories told by peasants and peoples then called savages, all around the world. Everywhere they looked, they found tales that were essentially the same. Cinderella, for example, appears everywhere. Miss Cox wrote an entire and very good book about Cinderella, though children would not find it interesting.
        - id: ch03-b02
          speaker: narrator
          text: >-
            For children, the finest foreign collections are the German stories gathered by the Grimms, Sir G. W. Dasent's Tales from the Norse, which some foolish grown-ups condemned as improper, and Miss Frere's Indian stories. There are hundreds of collections of peasant tales and tales from peoples then called savages. Many are deeply interesting, especially Bishop Callaway's Zulu stories with the original Zulu beside them. Yet parents and uncles seldom come across such books, so children seldom see them either.
        - id: ch03-b03
          speaker: narrator
          text: >-
            I wish children could choose their own books. Their friends should give them the money and let them loose in the bookshops. Children know what they enjoy. Sometimes a child is born loving books while the dear parents do not love them at all. It truly happens, and then the child chooses better. Children are honest about what they want. Some want their own Shakespeare. Others would rather have a book called Buster Brown. A few, though sadly very few, love poetry. Still fewer care for history.
        - id: ch03-b04
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: We know fairies aren't real, but stories from history are true!
        - id: ch03-b05
          speaker: narrator
          text: >-
            So say these little innocents. I am not at all certain that there are no fairies. And I know only too well that the best stories from history are not true.
    - id: ch04
      title: Ghosts and Botany
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            What children truly love is a ghost story.
        - id: ch04-b02
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: Tell us a ghost story!
        - id: ch04-b03
          speaker: narrator
          text: >-
            That is their cry, and I am delighted to oblige them because I feel exactly the same way. Only great self-control keeps me from telling the last true ghost story I heard yesterday. It would be perfect for children. A Grey Ghost Story Book would surely become a favorite.
        - id: ch04-b04
          speaker: narrator
          text: >-
            When I was very young, I read advertisements for books and wept because I could not buy dozens of them. Then someone gave me a book about botany. It looked promising, handsomely bound in green cloth. Inside, however, it contained every possible kind of dullness.
    - id: ch05
      title: This Collection
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Our own Fairy Cabinet cannot possibly fill sixty volumes. We have tried to please children, not the grown-ups for whom the old French authors wrote their romances. We have searched everywhere for fairy tales instead of looking only in Europe. This volume begins with a Turkish story, thanks to Dr. Ignaz Kuenos. Little King Loc is an original tale by M. Anatole France, who kindly allowed Mrs. Lang to adapt it from L'Abeille.
        - id: ch05-b02
          speaker: narrator
          text: >-
            As before, Major Campbell tells stories that he collected among the people of India. We usually name a story's source at its end. When we do not, children will not miss it. Except where another contributor is named, Mrs. Lang translated and adapted most of this collection for young readers. Mrs. Skovgaard-Pedersen translated The Green Knight from Danish. I must give special thanks to Monsieur Macler for allowing us to use tales from his Contes Armeniens, published in Paris by Ernest Leroux.
