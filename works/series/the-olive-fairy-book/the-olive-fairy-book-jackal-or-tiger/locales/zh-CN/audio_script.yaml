audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容机敏，带着温和而克制的诙谐
        timbre: 温暖清晰的成熟男声
        pace: 舒缓而富有变化
        pitch: 中低
    king:
      display_name: 国王
      tts:
        delivery: 自负急躁，受挫时色厉内荏
        timbre: 浑厚的中年男声
        pace: 适中
        pitch: 中低
    queen:
      display_name: 王后
      tts:
        delivery: 坦率坚定，历经磨难后温和而有分寸
        timbre: 沉静端庄的成年女声
        pace: 从容
        pitch: 中
    guard_1:
      display_name: 卫兵甲
      tts:
        delivery: 谨慎世故，说话压低声音
        timbre: 朴实的成年男声
        pace: 适中偏快
        pitch: 中低
    guard_2:
      display_name: 卫兵乙
      tts:
        delivery: 顺从谨慎，回答干脆
        timbre: 清晰的年轻男声
        pace: 适中
        pitch: 中
    farmer:
      display_name: 农夫
      tts:
        delivery: 朴实沉稳，机智藏在不动声色的认真里
        timbre: 结实温厚的成年男声
        pace: 从容
        pitch: 中低
    ameer_ali:
      display_name: 阿米尔·阿里
      tts:
        delivery: 勇敢诚恳，言语利落而不失温厚
        timbre: 明朗坚实的年轻男声
        pace: 适中
        pitch: 中
    old_woman:
      display_name: 老妇
      tts:
        delivery: 起初尖刻抱怨，受善待后亲切神秘
        timbre: 略显沙哑的老年女声
        pace: 适中
        pitch: 中低
    servant:
      display_name: 仆人
      tts:
        delivery: 胆怯慌张，语气恭敬
        timbre: 发紧的成年男声
        pace: 偏快
        pitch: 中高
    witch:
      display_name: 老女巫
      tts:
        delivery: 假意哀怜，显露本性后凶狠残酷
        timbre: 干涩阴沉的老年女声
        pace: 由缓慢转为急厉
        pitch: 中低
    starling:
      display_name: 椋鸟
      tts:
        delivery: 好奇活泼，问话轻快自然
        timbre: 清脆灵巧的中性声线
        pace: 轻快
        pitch: 高
    tote:
      display_name: 托特
      tts:
        delivery: 挑剔刻薄，牢骚里带着滑稽劲
        timbre: 粗哑鲜明的中性声线
        pace: 适中偏快
        pitch: 中高
    princess:
      display_name: 公主
      tts:
        delivery: 骄纵任性，欢喜和愤怒都毫不掩饰
        timbre: 明亮华贵的年轻女声
        pace: 偏快
        pitch: 中高
    forest_fairy:
      display_name: 森林仙女
      tts:
        delivery: 温柔坚定，面对危险从容无惧
        timbre: 柔和澄澈的年轻女声
        pace: 舒缓
        pitch: 中高
    usher:
      display_name: 礼官
      tts:
        delivery: 庄重守礼，声音清楚洪亮
        timbre: 清朗的成年男声
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 豺狼的嗥叫
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 印度斯坦有一座王城。一个闷热的夜晚，国王和王后躺在城中央的宫殿里，怎么也睡不着。窗格间偶尔漏进一丝风，两个人刚觉得睡意来了，宫外却忽然响起一声嗥叫，把他们惊得彻底清醒。
        - id: ch01-b02
          speaker: king
          text: 听见了吗？那是老虎！
        - id: ch01-b03
          speaker: queen
          text: 老虎？城里哪会有老虎。那不过是豺狼在叫。
        - id: ch01-b04
          speaker: king
          text: 我说是老虎，那就是老虎。
        - id: ch01-b05
          speaker: queen
          text: 要是你真听成了别的，那一定是睡糊涂了。明明就是豺狼。
        - id: ch01-b06
          speaker: king
          text: 是老虎！不许再顶撞我。
          emotion: angry
        - id: ch01-b07
          speaker: queen
          text: 胡说，明明是豺狼。
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 这场争吵越来越凶。国王气急了，提出把外面的卫兵叫来作证。要是豺狼，他就把王国留给王后，自己离开。要是老虎，走的人便是王后，他还要另娶一位妻子。
        - id: ch01-b09
          speaker: queen
          text: 随你吧。反正那是什么，根本用不着怀疑。
        - id: ch01-b10
          speaker: narrator
          text: 两人的嗓门那么大，守在宫外的两名士兵早把赌约听了个大概。国王召见他们以前，其中一人赶紧提醒同伴。
        - id: ch01-b11
          speaker: guard_1
          text: 一定要说国王是对的。咱们都知道那是豺狼，可要是照实讲，国王多半不会真走，最后吃苦头的还是咱们。站在他那边最安全。
        - id: ch01-b12
          speaker: narrator
          text: 另一名士兵点头同意。等国王问起，两个人便异口同声，说他们看见的是老虎，国王当然一向正确。
        - id: ch01-b13
          speakers: [guard_1, guard_2]
          ensemble: duo
          text: 陛下说得对，那确实是老虎。
        - id: ch01-b14
          speaker: narrator
          text: 国王一句话也没说，只叫人抬来轿子，把哭泣的王后强行送进去。他命四名轿夫把她带到遥远的森林深处，再独自丢在那里。王后虽然流泪，却没有反抗的余地。轿夫们抬着她走了三天三夜，直到四周尽是密林，才连人带轿一起放下，转身踏上归途。
        - id: ch01-b15
          speaker: narrator
          text: 王后相信，国王只是怒气未消，迟早会召她回宫。她静静等了很久，一心听着有没有脚步走近，可四周始终无人。天渐渐亮了，鸟虫开始活动，暖风吹得树叶沙沙作响。她从轿中探出头，望遍四周，连一个人影也没有。直到这时，王后才绝望地哭起来。
        - id: ch01-b16
          speaker: narrator
          text: 附近住着一对农夫夫妻。他们守着森林中的一小块田地，离邻居很远。天气炎热，农夫睡在平屋顶上，被哭声惊醒后，立刻跑下楼，循声找到了轿子。
        - id: ch01-b17
          speaker: farmer
          text: 那边哭泣的可怜人，你是谁？
        - id: ch01-b18
          speaker: narrator
          text: 陌生人的声音让王后害怕，她马上止住了哭声。农夫站在稍远的地方，又温和地开口。
        - id: ch01-b19
          speaker: farmer
          text: 别怕，也别不敢回答。在我眼里，你就像我的女儿。告诉我，你是谁？
        - id: ch01-b20
          speaker: narrator
          text: 王后听出他的善意，终于鼓起勇气，说出了自己的遭遇。农夫叫来妻子。妻子把王后接进家中，拿食物给她充饥，又铺好一张床，让她安心休息。几天以后，一个小王子就在这座森林农庄里出生了。依照母亲的心愿，他被取名为阿米尔·阿里。
    - id: ch02
      title: 森林里的相遇
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一年又一年，国王始终没有消息，仿佛王后是死是活都与他无关。王后仍住在农夫家里，小王子却已经长成强健、英俊又充满活力的青年。森林远离尘世，平日几乎没有外人经过。阿米尔·阿里一再请求母亲和那位睿智的农夫，准他出去闯荡，靠自己谋生。两位长辈每次都劝他再等一等。直到十八岁那年，他们终于不忍再阻拦。
        - id: ch02-b02
          speaker: narrator
          text: 一个清早，阿米尔·阿里佩剑在身，带上装水的大铜锅和几枚银币，手里还拿着一张双弦弹弓。这种弹弓能把坚硬的干泥丸又准又有力地射出去，他打算一路用它猎鸟。就这样，他离开了家。他日复一日地跋涉，走过许多疲惫的长路。一天早晨，眼前出现一片熟悉的森林，模样就像他出生长大的地方。他仿佛正去迎接一位老朋友，欢欢喜喜地走了进去。
        - id: ch02-b03
          speaker: narrator
          text: 穿过灌木时，他看见一只正好能做晚餐的鸽子，便射出弹丸。鸽子扑棱着逃开，弹丸却击中了别处。灌木后立刻响起一阵叫骂。他赶过去，只见一个丑陋的老妇浑身是水，正从头顶取下破了洞的陶罐。看见他手中的弹弓，老妇越发恼火。
        - id: ch02-b04
          speaker: old_woman
          text: 你为什么偏拿我这个老太婆取乐？水罐让你打破了，我上哪儿再找一只？走这一趟已经快累死我，难道还要我再走那么远去打水？
          emotion: angry
        - id: ch02-b05
          speaker: ameer_ali
          text: 大娘，我没有捉弄你。我只想打那只鸽子做晚餐，没打中它，才误伤了水罐。我的铜锅赔给你，它不容易打破。你再告诉我水在哪里，趁你晒衣服的时候，我替你打满水，也替你送回去。
        - id: ch02-b06
          speaker: narrator
          text: 老妇听了，脸色顿时和缓下来。她指出水源，等王子几分钟后把铜锅装得满满回来，便一言不发地在前面带路。阿米尔·阿里替她提着水，跟到林中的一间小屋。快到门口时，他看见一位绝美的少女，那是他这一生见过最美的人。少女一发现陌生人，便拢起面纱，退回屋里。王子多想再看她一眼，却怎么也找不到请她出来的借口，只好心情沉重地向老妇行礼告辞。
        - id: ch02-b07
          speaker: old_woman
          text: 要是以后碰上危险，就回到这里喊：“森林仙女！森林仙女，快来救我！”我会听见的。
        - id: ch02-b08
          speaker: narrator
          text: 王子谢过老妇，继续上路。他没怎么在意那句承诺，心里想的全是美丽的少女。不久，他走进一座城市。这时银币已经用尽，处境十分困难，他便径直赶到王宫，请求一份差事。国王告诉他，宫中仆从已经够多，不再需要人手。阿米尔·阿里却再三恳求，不肯轻易离开。拉贾终于动了恻隐之心，答应让他加入贴身卫队，但有一个条件。以后凡是格外艰难、格外危险的差事，都要由他承担。王子要的正是这种机会，当场答应，无论国王吩咐什么，他都会尽力完成。
        - id: ch02-b09
          speaker: narrator
          text: 后来，一个暴风雨之夜，河水在宫墙下咆哮。风雨声里，隐约传来女人的哭喊。国王让仆人出去查看，可那人吓得跪倒在地，说这样可怕的夜里，恶灵和女巫一定都在外面游荡。他无论如何也不敢去。国王心软，又点了几个人，人人都怕得要命。
        - id: ch02-b10
          speaker: servant
          text: 陛下，求您别让我在这种夜里出去。外面一定有恶灵和女巫！
          emotion: fearful
        - id: ch02-b11
          speaker: ameer_ali
          text: 陛下，这正是我的职责。我去看看。
        - id: ch02-b12
          speaker: narrator
          text: 国王点了头。阿米尔·阿里走进漆黑如墨的雨夜，顶着扑面的狂风大雨，来到宫墙下的浅滩。他踏进暴涨的河流，一寸一寸、一步一步地向前挣扎。突如其来的旋涡几次险些把他冲倒。洪水里的大树翻滚摇摆着扑来，伸出的枝杈也差点把他缠住。终于，他气喘吁吁地爬上对岸，从头到脚都在滴水。岸边不远处有一座绞刑架，架上吊着一个罪人的尸体。国王听见的抽泣声，正从架子下面传来。
    - id: ch03
      title: 绞刑架下的女巫
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 阿米尔·阿里只顾同情那个哭泣的人，根本不在意狂暴的黑夜和身后的急流。他也从来不怕什么鬼怪女巫，便走向绞刑架下蜷缩的女人。
        - id: ch03-b02
          speaker: ameer_ali
          text: 你遇到什么难事了？
        - id: ch03-b03
          speaker: narrator
          text: 可那并不是普通女人。她是女巫国来的老女巫，本不该出现在人间。女妖一向会吃掉误入女巫国的男人，这一个也想抓个男人做晚餐。她故意在这里哭，就是想骗来一个心软的人。
        - id: ch03-b04
          speaker: witch
          text: 好心的先生，架上吊着我可怜的儿子。求你帮我把他取下来，我会一辈子祝福你。
        - id: ch03-b05
          speaker: narrator
          text: 她的声音听起来，与其说悲伤，不如说急切。阿米尔·阿里怀疑她撒了谎，马上留了心。
        - id: ch03-b06
          speaker: ameer_ali
          text: 架子那么高，又没有梯子，恐怕不好办。
        - id: ch03-b07
          speaker: witch
          text: 你只要弯下腰，让我踩上你的肩膀，我想就能够着他。
        - id: ch03-b08
          speaker: narrator
          text: 老女巫的声音忽然透出残忍。王子确信她想害人，脸上却没有显露。他答应试试，拔出宝剑，装作要用它撑住身体，然后弯腰让老妇爬上后背。她轻巧地攀了上去。紧接着，一个绳套突然扣住王子的脖子。老女巫从他肩上跃到绞刑架上，凶相毕露。
        - id: ch03-b09
          speaker: witch
          text: 蠢货，这回你落在我手里了！我要杀了你做晚餐。
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: 阿米尔·阿里挥剑向上一削，斩断了颈上的绳索，也砍掉了女巫悬在头顶的一只脚。她痛苦又愤怒地尖叫着，转眼消失在黑暗里。
        - id: ch03-b11
          speaker: narrator
          text: 王子坐下定了定神，伸手在身旁的地上摸到一只脚镯，显然是从女巫断掉的脚上落下来的。他把它收入衣袋。暴风雨这时已经过去，他便回到王宫，把整件事从头到尾讲给国王听。随后，他掏出脚镯交了上去。那只脚镯由一颗颗华美绝伦的宝石组成，国王和在场的人全都看呆了。连王子自己也十分惊讶，因为他在黑暗里捡起脚镯以后，随手放进口袋，根本没有看过一眼。国王非常喜爱这件宝物。他称赞并赏赐了阿米尔·阿里，又把脚镯送给自己那个骄傲任性的女儿。
        - id: ch03-b12
          speaker: narrator
          text: 公主的住处挂着两只鸟笼，里面分别住着鹦鹉托特和一只椋鸟。它们都会说人话，也是公主亲手喂养的宠物。第二天，公主把脚镯戴在一只脚上，得意地来回走动。椋鸟看见后，便问托特。
        - id: ch03-b13
          speaker: starling
          text: 托特，你瞧公主戴上新首饰以后，好看吗？
        - id: ch03-b14
          speaker: tote
          text: 好看？今天早晨没人给我洗澡，我可没心情说好话。她现在活像洗衣妇的女儿，一只脚穿着鞋，另一只光着！为什么不戴上一对？一条腿珠光宝气，另一条却什么也没有，算什么打扮？
        - id: ch03-b15
          speaker: narrator
          text: 公主听见这话，立刻放声大哭。她派人叫来父亲，坚持要在另一只脚上戴一只相同的脚镯，否则自己一定会羞愧而死。国王只好召见阿米尔·阿里，命他在一个月内找来第二只与第一只分毫不差的脚镯。国王说，公主得不到它，一定会失望而死。要是王子到期交不出脚镯，就要被送上绞刑架。
    - id: ch04
      title: 森林仙女的宝石
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 阿米尔·阿里忧心忡忡，不过还有一个月可以设法。他离开王宫，日夜打听最好的珠宝，却始终找不到能与脚镯相比的东西。眼看只剩七天，他终于记起森林里的承诺。赶了一天路，他来到那间小屋前，站在老妇从前叫住他的地方，高声呼唤。
        - id: ch04-b02
          speaker: ameer_ali
          text: 森林仙女！森林仙女！快来救救我！
        - id: ch04-b03
          speaker: narrator
          text: 那位令他念念不忘的美丽少女出现在门口，柔声问他发生了什么。王子听得出了神，少女问了第二遍，他才说出自己的困境。她回屋取出两根魔杖和一锅沸水，把魔杖相隔六英尺插进土里。
        - id: ch04-b04
          speaker: forest_fairy
          text: 我会躺在两根魔杖中间。你要拔剑砍下我的一只脚，马上把它悬在锅上。血滴进沸水，每一滴都会变成宝石。等宝石够了，就把两根魔杖的位置互换，再把断脚贴回伤口。它会重新长好，我也会恢复原样。
        - id: ch04-b05
          speaker: narrator
          text: 阿米尔·阿里一听便坚决拒绝。他说，自己宁愿被绞死二十次，也不肯如此残忍地伤害少女。可她耐心地一再劝说，王子最终只得照办。宝剑落下，砍断了她的脚。少女随即倒在那里，一动不动，仿佛已经死去。王子吓得自己也几乎昏倒，却不敢耽误，仍按她的指示，把断脚举到滚沸的锅上。鲜血一滴滴落入水中，每一滴都化成闪亮的宝石。他亲眼看到这番奇迹，才渐渐鼓起勇气。
        - id: ch04-b06
          speaker: narrator
          text: 锅里很快便有了足够的珠宝。王子赶紧调换两根魔杖的位置，把断脚贴回伤口。两边立刻长合，看起来与从前完全一样。少女睁开眼睛，一跃而起，拢紧面纱跑进小屋，不肯再出来，也不肯和他说话。阿米尔·阿里在外面等了很久，始终不见她露面，只好收好宝石回宫。他很容易就找来工匠镶嵌这些珍宝。宝石不但够做一只脚镯，竟然做出了三只世间罕见的美丽脚镯。一个月期限恰好在这一天结束，他及时把它们献给国王。
        - id: ch04-b07
          speaker: narrator
          text: 国王高兴地拥抱阿米尔·阿里，又送给他许多贵重礼物。第二天，爱慕虚荣的公主把新脚镯全戴了起来，每只脚上都有两只。她昂首挺胸，在房间里来来回回地摆着架子。四周墙上全是镜子，她走到哪里都能看见珠光宝气的自己，怎么也欣赏不够。
        - id: ch04-b08
          speaker: starling
          text: 托特，这回公主戴了这么多漂亮珠宝，你觉得怎么样？
        - id: ch04-b09
          speaker: tote
          text: 呸！她把所有美貌都堆到身体的一头了。要是脖子和手腕上也有几件好东西，也许还能顺眼些。可现在，她比从前更像那个硬要盛装打扮的洗衣妇女儿。
        - id: ch04-b10
          speaker: narrator
          text: 托特每天早晨都脾气很坏，非到午饭后才会好起来。这番话却让公主又哭又叫，又吵又闹，最后竟把自己折腾得病倒。她对父亲宣称，要是没有与脚镯相配的手镯和项链，自己一定会死。国王又召来阿米尔·阿里，命他在一个月内找齐这两样珠宝。到了期限还做不到，等待王子的就不只是绞刑，而是一场残酷的死亡。
        - id: ch04-b11
          speaker: narrator
          text: 王子再次找遍各处，直到一个月快要过去，仍然一无所获。他只好回到森林小屋，站在门外呼唤仙女。
        - id: ch04-b12
          speaker: ameer_ali
          text: 森林仙女！森林仙女！请再救我一次！
        - id: ch04-b13
          speaker: narrator
          text: 少女应声而来。她听完王子的请求，说这次仍要照原来的方法做，只是必须砍下她的双手和头颅。阿米尔·阿里吓得脸色惨白。少女提醒他，上一次自己安然无恙，他这才答应。
        - id: ch04-b14
          speaker: narrator
          text: 王子照着少女的吩咐，砍下她的双手和头颅。鲜血从断处滴进锅中，化成无比精美的手镯，还有由红宝石、钻石、祖母绿和珍珠串成的项链。这样的珠宝，世上还从来没有人见过。等头颅和双手重新接上身体，少女身上没有留下一点痕迹，连一道伤疤也没有。阿米尔·阿里满心感激，正想开口对她说话，她却又跑回屋里，再也不肯出来。他等不到她，只能带着满身珠宝离开。
        - id: ch04-b15
          speaker: narrator
          text: 到了约定的日子，阿米尔·阿里献上项链和手镯，每一件都珍贵得无可比拟。国王惊讶极了，公主则欢喜得近乎发狂。第二天一早，她把所有珠宝都戴在身上，认定那只刻薄的鹦鹉再也挑不出毛病，便专心听着椋鸟发问。
        - id: ch04-b16
          speaker: starling
          text: 托特，你看公主现在怎么样？
        - id: ch04-b17
          speaker: tote
          text: 当然漂亮。可只打扮给自己看，有什么用？她该有个丈夫了。替她弄来这些宝贝的男人不是正合适吗？为什么不嫁给他？
        - id: ch04-b18
          speaker: narrator
          text: 公主立刻去找父亲，宣布自己要嫁给阿米尔·阿里。
    - id: ch05
      title: 王宫里的豺狼
      blocks:
        - id: ch05-b01
          speaker: king
          text: 你真是一天一个新念头，实在难讨好。不过你确实该出嫁了。既然你选中这个男人，那就让他娶你。
        - id: ch05-b02
          speaker: narrator
          text: 国王召来阿米尔·阿里，说要赐给他无上的荣誉。一个月内，他将迎娶公主，成为王位继承人。
        - id: ch05-b03
          speaker: ameer_ali
          text: 陛下，我过去尽力为您效劳，今后也愿做一切力所能及的事。只有这一件，请恕我不能答应。
        - id: ch05-b04
          speaker: narrator
          text: 王子深深行礼，态度却很坚决。国王一直把女儿的婚事看作任何男人求之不得的奖赏，听见拒绝，立刻怒不可遏。公主比父亲还要愤怒。阿米尔·阿里当场被卫兵抓走，投入他们所能找到的最阴森、最凄惨的牢房。国王命人把他一直关在那里，等自己有了工夫，再慢慢想出一种处死他的办法。
        - id: ch05-b05
          speaker: narrator
          text: 国王仍决定尽快嫁掉公主。他派传令官走遍邻国，宣布在指定的日子，凡适合做公主丈夫和王位继承人的人，都可以到王宫来。
        - id: ch05-b06
          speaker: narrator
          text: 到了那天，宫廷上下全都到场。年轻的、年老的男人挤成一片，组成一大群求婚者。人人都觉得自己的机会不比别人差，既可能娶到公主，也可能得到王位。国王刚坐好，便吩咐礼官传第一位求婚者上前。就在这时，站在人群最前面的一个农夫忽然提高声音，说自己有一件事要向国王禀告。
        - id: ch05-b07
          speaker: king
          text: 那就快说，我没有时间等你。
        - id: ch05-b08
          speaker: farmer
          text: 陛下在这座城里主持公道多年，一定知道，百兽之王老虎只在森林里捕猎。豺狼可不同，哪里有东西可捡，它们就到哪里去。
        - id: ch05-b09
          speaker: king
          text: 这是什么胡话？这个人一定疯了！
        - id: ch05-b10
          speaker: farmer
          text: 陛下，我只是提醒您，今天这里聚集了许多豺狼。每座城市都送来一些，它们饥肠辘辘，等着抢走您的女儿和王国。可是这一次，请别再把豺狼的嗥叫错认成老虎的吼声，也别明知是豺狼，还故意说成老虎。
        - id: ch05-b11
          speaker: narrator
          text: 国王的脸先红透了，接着变得惨白。
        - id: ch05-b12
          speaker: farmer
          text: 有一只生长在森林里的王族之虎。只有他真正有权继承王位，而且他的权利排在所有人前面。
        - id: ch05-b13
          speaker: king
          text: 他在哪里？你到底在说什么？
          emotion: fearful
        - id: ch05-b14
          speaker: farmer
          text: 他在牢里。请陛下先把满宫廷的豺狼清出去，我就解释给您听。
        - id: ch05-b15
          speaker: king
          text: 所有人都离开宫廷！
        - id: ch05-b16
          speaker: narrator
          text: 求婚者们极不情愿地退出王宫。国王等人群走净，马上催农夫揭开谜底。
        - id: ch05-b17
          speaker: king
          text: 现在告诉我，这番话究竟是什么意思。
        - id: ch05-b18
          speaker: narrator
          text: 农夫当着国王和大臣们的面，说起多年前的那个清晨。他怎样在森林里听见哭声，怎样救下被遗弃的王后，又怎样把阿米尔·阿里抚养成人。说完，他走到宫外，把一直等在那里的老王后请了进来。国王一见她，羞愧和悔恨一起涌上心头。他真希望自己能够把这一生重活一遍。那样，他不会赶走这位王后，也不会另娶骄傲公主的母亲。后来的那位妻子直到死去，都给他带来没完没了的烦恼。
    - id: ch06
      title: 真正的王族之虎
      blocks:
        - id: ch06-b01
          speaker: king
          text: 我的时代已经过去了。
          emotion: sad
        - id: ch06-b02
          speaker: narrator
          text: 国王把王冠交给自己的儿子阿米尔·阿里。新王随后回到森林，呼唤仙女，请她为自己找一位能够共享王位的王后。
        - id: ch06-b03
          speaker: ameer_ali
          text: 我只愿意娶一个人。
        - id: ch06-b04
          speaker: narrator
          text: 阿米尔·阿里心里只有森林少女，再容不下别人。这一次，少女没有拢着面纱跑回小屋。她留在原地，答应成为他的妻子，与他共同治理王国。两人没有耽搁，很快举行了婚礼。从此，他们相伴多年，也幸福地统治了这个王国许多年。
        - id: ch06-b05
          speaker: narrator
          text: 还有最初在林中遇见的老妇，也就是那个水罐被阿米尔·阿里误打破的人。她其实并非普通农妇，而是森林少女的仙女教母，一直留在那里照看自己的教女。如今少女已经成了王后，不再需要她守护，老妇便放下心来，高高兴兴地回到了仙境。
        - id: ch06-b06
          speaker: narrator
          text: 至于老国王，从此再也不敢顶撞自己的妻子。哪怕脸上只露出一点不赞同，老王后也会微笑着问他。
        - id: ch06-b07
          speaker: queen
          text: 那么，是老虎，还是豺狼？
        - id: ch06-b08
          speaker: narrator
          text: 每到这时，老国王便一个字也说不出来，只能乖乖闭上嘴了。
