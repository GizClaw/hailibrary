        timbre: 清冷回响的中性声线
        pace: 适中
        pitch: 中
    sheath_3:
      display_name: 刀鞘丙
      tts:
        delivery: 空洞神秘，重复话语时短促清楚
        timbre: 低沉回响的中性声线
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 项圈与梳子的试验
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，伦巴第有个国王。他自己比所有臣民都丑，却格外爱看美人，于是娶了一个公认最美的女人。也有人悄悄说，她恐怕还是脾气最坏的女人。王后容不下任何漂亮的人，身边侍女个个相貌平平，对国王前妻留下的一双儿女更是嫉妒得要命。
        - id: ch01-b02
          speaker: narrator
          text: 国王明知妻子恶毒，还是成了她言听计从的奴仆。她对王子已经坏透了，美丽的公主所受的折磨却要多上十倍。王后给女孩安排了一个同样刻薄的女管教，又想尽一切办法毁掉她的容貌。她让公主穿丑得吓人的衣服，往脸上涂厚厚的棕色颜料，恨不得把她变得和自己一样难看。可任凭王后怎样折腾，只要洗去颜料，脱掉那些衣服，公主还是一样光彩照人。
        - id: ch01-b03
          speaker: narrator
          text: 伦巴第国王的表兄是皮亚琴察大公。大公忽然失去神智，儿子佩拉特里特斯和女儿费兰迪娜请遍医生，也没人能治好他。兄妹俩只得派人去问一位女巫。人们叫她刀鞘之母，因为访客都要送上一把刀，让她插进洞壁悬挂的刀鞘里。
        - id: ch01-b04
          speaker: mother_of_sheaths
          text: 你们的父亲在哪里丢了神智，就到哪里把它找回来。
        - id: ch01-b05
          speaker: narrator
          text: 这句话没给兄妹多少安慰。他们不听大臣劝阻，骑马赶到父亲出事前住过的神秘城堡。两人一进城门，从此便没有消息。
        - id: ch01-b06
          speaker: narrator
          text: 三星期过去，还是没有半点消息。首席大臣召集众人商议。最后，他们决定派一群身份显赫的人再次求见刀鞘之母，还让每个人带去一把镶满宝石的纯金刀。女巫一看见这些华美的礼物便十分高兴。她仔细听完众人的来意，走到洞中一个窟窿前，拿出一只小匣子。匣中装着一把梳子，旁边还有一只钢项圈，圈上扣着一把金锁。
        - id: ch01-b07
          speaker: mother_of_sheaths
          text: 带着梳子和项圈，走遍一座座宫廷。你们要找到一个美得足以打开项圈的女子，再找到一个品性足以从匣中抽出梳子的男子。找到以后，就可以回来了。
        - id: ch01-b08
          speaker: chamberlain
          text: 可这样做，怎么能帮我们找回失踪的王子和公主呢？
        - id: ch01-b09
          speaker: mother_of_sheaths
          text: 我能替你们做的，只有这些。
        - id: ch01-b10
          speaker: narrator
          text: 她说完便转身走进洞穴深处，没人敢跟上去追问。大臣们只好照她的话，带着梳子和项圈，从一座宫廷走到另一座宫廷，始终找不到合适的人。几个月后，他们终于来到伦巴第，发现自己的故事早已先一步传遍这里。使臣们一走进接见厅，国王便张开双臂欢迎。他没有半点怀疑，认定妻子就是能打开项圈的绝世美人。若脂粉、染发剂和华服真能保证她成功，他的判断倒不会错。可惜国王被爱情蒙住眼睛，根本不知道王后的魅力并非天生。
        - id: ch01-b11
          speaker: narrator
          text: 到了约定的时辰，王后带着年轻公主走进王座厅。公主的处境凄惨得叫人难以想象。她的衣服被故意做得像背上长了驼峰，白里透红的皮肤厚厚涂满黄颜料，一头黑发也全藏在紧绷的棕布帽里。四周顿时响起愤怒的低语。使臣们常听人说，她美得能和费兰迪娜相比，如今全都惊得说不出话。国王也羞得几乎抬不起眼睛，只好示意儿子替自己主持，然后独自退出王座厅。
        - id: ch01-b12
          speaker: narrator
          text: 王子登上王座，下令立刻开始试验。他先叫那个世间少有的丑女管教试项圈，她果然转不动钥匙。王子趁暂时掌权，决定惩罚她长期虐待妹妹的罪行，尤其不能饶过她这次怂恿王后丑化公主。他命人把女管教带出去处死，侍从们很乐意执行。接着，他让宫女陪妹妹回房沐浴，再换上王后最华丽的衣服，因为公主自己连一件像样的衣裳也没有。王后气得咬牙切齿，这次却不敢拦。
        - id: ch01-b13
          speaker: narrator
          text: 公主回来得比众人预料的还快。沐浴以后，她换上王后最华丽的长袍，美得叫所有原本心存怀疑的人一望便相信，能打开项圈的非她莫属。王子只看了妹妹一眼，没有多说，便示意一名使臣先试梳子。在场的男人一个接一个，使尽力气也抽不出来，只得承认失败。王子身为裁判，要留到最后。随后，宫廷里的女人按身份高低依次接过项圈，没有一个能转动钥匙。最后，王后竟把锁打开了一条缝。她的心刚因得意怦怦直跳，项圈却咔嗒一声重新合拢，她失望得向后一倒，当场昏了过去。
        - id: ch01-b14
          speaker: narrator
          text: 只剩下王子和妹妹。王子刚碰匣子，盖子便自己弹开。公主一握金钥匙，项圈也应手而开。满厅欢呼声才响起来，一阵旋风便卷着浓黑扑进宫殿，脚下的大地跟着震动。
        - id: ch01-b15
          speaker: narrator
          text: 等黑暗散去，太阳重新照进来，王子和公主都消失了。
    - id: ch02
      title: 白狐狸与贝壳仙女
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 风暴里只有兄妹二人消失，可旋风偏偏把他们吹向相反的方向。公主在空中飞得太快，早已昏了过去；等她独自落在密林深处，恐惧又让她险些失去知觉。她慌忙奔跑，高声呼唤哥哥来救自己，却只引来了饥饿的狼群。狼张着大嘴，垂着鲜红的舌头，越扑越近。公主跪倒在地，一只手遮住脸，另一只手无意间抓紧项圈，等着被狼吞掉。最前面的狼已经把热气喷到她脸颊，她越伏越低。就在这时，那头狼忽然看见项圈，发出一声响彻森林的长嗥，转身逃走，其他狼也全跟着跑了。
        - id: ch02-b02
          speaker: narrator
          text: 公主从惊吓中缓过神，站起身来，不知该往哪里去，只能继续奔逃。她终于来到一条宽阔的大路上，看见两名牧羊人赶着羊群迎面走来。公主以为遇见了救星，急忙朝他们奔去。可她还没来得及开口，羊群便看见了项圈，立刻向四面八方逃散。
        - id: ch02-b03
          speaker: lombardy_princess
          text: 我身上一定有样东西，会把所有野兽都吓跑。
        - id: ch02-b04
          speaker: narrator
          text: 这想法让她安心不少。她走到一座古堡门前，正想进去借宿，一只雪白的狐狸跑过道路，停在她面前。狐狸漂亮极了，明亮的眼睛像在恳求她。公主怕它也被项圈吓跑，赶紧把项圈塞进衣襟，轻轻走近。狐狸却朝另一个方向跑去。她虽然疲倦，还是忍不住跟上。
        - id: ch02-b05
          speaker: narrator
          text: 狐狸跑过一个拐角，在河岸上一座小巧宫殿门前坐下，公主总算松了一口气。她刚走近，狐狸便用牙咬住裙边，把她领进一个房间。桌上摆满牛奶和水果。公主吃饱喝足以后，躺到一堆软垫上，狐狸安静地卧在她脚边。她想着失散的哥哥，沉沉睡去，梦里也全是他的身影。
        - id: ch02-b06
          speaker: narrator
          text: 公主在梦里思念哥哥时，哥哥也一刻不停地想着她。旋风把王子抛到荒凉的海岸，四周全是光秃萧瑟的景象。只有远方一座翠绿的小岛是例外，岛上的棕榈迎风摇曳，瀑布隔着海面闪闪发亮。可只有登上一块高耸的岩石，王子才能望见那里。他每天都爬上岩顶，一待就是许久，目光始终落在那座岛上。
        - id: ch02-b07
          speaker: lombardy_prince
          text: 妹妹会不会就在那里？
        - id: ch02-b08
          speaker: narrator
          text: 他明知妹妹在那里并不比在别处更有可能，却怎么也放不下这个念头。忽然，一阵从未听过的美妙歌声打断了沉思。声音仿佛近在身边，可他什么人也看不见。每当他赶到一处，歌声又从另一个方向传来。他这样上上下下追了许久，忽然看见海水和岩石之间摊着一张巨大的鱼皮，丑得叫人恶心。他厌恶地退开一步，身后立刻有东西跃入海里。王子连忙回头，鱼皮已经不见了，后面的岩洞里却出现一只内镶黄金的乌木浴盆，在日光下闪闪发亮。
        - id: ch02-b09
          speaker: narrator
          text: 此后几天，海岸上再没发生怪事。王子几乎已经拿定主意，要离开这里，到内陆寻找妹妹。就在这时，那阵令他着迷的歌声又传来了。血淋淋的鱼皮再次躺在沙上，岩洞里的浴盆也已经装满清水。王子那一夜几乎没有合眼。天还没亮，他便藏到岩石后面，决心守在原地，不等那条鱼回来，绝不挪动一步。
        - id: ch02-b10
          speaker: narrator
          text: 他并没有等多久。第一缕阳光刚照上海面，远处便出现一团闪亮的白影，乘着柔风缓缓靠近。那白影越来越近，王子终于看清，原来是一只巨大的贝壳，壳上的蓝色、粉色和绿色彼此交融。里面坐着一位美得耀眼的少女，手中握着一根驾驭贝壳的缆绳。
        - id: ch02-b11
          speaker: narrator
          text: 王子看呆了，忘记自己还在躲藏。他冲出去，跪在沙上，朝少女伸开双手。梳子和匣子却从口袋掉了出来。少女见状尖叫一声，立刻掉转贝壳，飞快驶向小岛。王子脱掉衣服，正要游泳追赶，身旁忽然出现一只雪白狐狸。它也望着小岛，拼命挥动前爪。直到岛上驶来一条小船，狐狸才欢喜起来。
        - id: ch02-b12
          speaker: narrator
          text: 小船靠岸，狐狸朝王子的衣服挥爪子。王子明白它在叫自己重新穿好，便照做了。两人上船，才刚离开海滩，王子忽然想到正是梳子吓走了少女。他怒不可遏，抬手便要把它扔进海里。狐狸立刻扑上去，死死抱住他的手臂，让他怎么也抬不起来。就在这时，岸上一名骑士张弓放箭，箭射得奇准，正中狐狸。小家伙重重跌进船舱，闭上眼睛，像是受了致命伤。王子悲痛万分，立刻跳回岸上，可凶手早已跑远。等年轻人转过身，小船和狐狸都不见了。
        - id: ch02-b13
          speaker: narrator
          text: 风暴将至，王子躲进岩洞。洞中亮着无数蜡烛，每支都像一把半露出鞘的刀。浴盆上罩着白帐篷，布面绣满刀鞘。帐中传出少女的声音。
        - id: ch02-b14
          speaker: ferrandina
          text: 王子，不管发生什么，你都愿意信我吗？我的心属于你，我也知道你的心属于我。可帐幕一开，你哪怕露出一点害怕，也会永远失去我。
        - id: ch02-b15
          speaker: narrator
          text: 这警告一点也不多余。帐幕才打开，一只鳄鱼脑袋便张合着大嘴，朝他逼近。王子费尽力气，才让脸上没有失去血色，也压住了发抖的双手。他站着不动，始终直视那头可怕的怪物。终于，鳄鱼头慢慢向后仰去，下面露出了贝壳仙女美丽的脸。
        - id: ch02-b16
          speaker: ferrandina
          text: 快，王子，时间就要到了！马上替我梳头，不然我会从你眼前消失！
        - id: ch02-b17
          speaker: narrator
          text: 王子听见催促，立刻拿出梳子，却惊讶地发现，自己必须用尽全身力气，才能把它一点点从鞘中抽出。更奇怪的是，梳子每出来一分，少女的头便从可怕的鳄鱼皮下解脱一分，身体也从浴盆的水里升高一点。王子继续用力，直到她的肩膀和双臂都恢复自由。就在这时，少女又开口催促。
        - id: ch02-b18
          speaker: ferrandina
          text: 够了，你到现在都照我的话做了。接下来，烧掉我的皮。
        - id: ch02-b19
          speaker: lombardy_prince
          text: 不行，这件事我绝对做不到！
        - id: ch02-b20
          speaker: ferrandina
          text: 那我们两个会永远后悔。只有肯烧掉这张皮的人，才能成为我的丈夫。
        - id: ch02-b21
          speaker: narrator
          text: 王子还站在原地迟疑，帐幕已经重新合上，把少女彻底遮住，洞里的蜡烛也噼啪几声全灭了。他痛恨自己刚才迟迟不肯动手，恍恍惚惚地朝森林里的火光走去，几乎不知道自己在做什么。半路上，他险些被横在小径上的一张皮绊倒。
        - id: ch02-b22
          speaker: lombardy_prince
          text: 我真傻！她要我烧的，一定就是这张皮。
        - id: ch02-b23
          speaker: narrator
          text: 他双手抓起那张皮，扔进火中。那东西发出惊天巨响，猛地炸开。王子不知道接下来还会发生什么，吓得跑出很远。可过了一阵，他发现自己的脚步不知不觉又把他带回火堆旁。皮已经消失得不留痕迹，余烬里只剩一样东西在闪闪发光，原来正是魔法项圈。他立刻想到，自己日夜思念的妹妹一定就在附近。还没来得及回头，也没来得及捡起项圈，妹妹已经搂住他的脖子。那一刻，两人忘了其他一切。
    - id: ch03
      title: 兄妹重逢
      blocks:
        - id: ch03-b01
          speaker: lombardy_princess
          text: 哥哥，你先把自己的经历告诉我。
        - id: ch03-b02
          speaker: narrator
          text: 王子从头讲起。可他满脑子都是贝壳仙女，竟忘了提白狐狸。幸好他没提，因为妹妹说完自己的遭遇，最后讲的正是那只狐狸。
        - id: ch03-b03
          speaker: lombardy_princess
          text: 你根本想不到，它在小宫殿里把我照顾得多么周到。没有谁能比它更温柔体贴。可我从它的眼睛里看得出来，它希望我给它一样东西，我却总猜不出是什么。后来那一天终于来了，我付出代价才弄明白。我怕它像狼和羊一样被项圈吓跑，就把项圈藏在浓密的灌木里。一天，我们正在花园里，阳光恰好直直照在项圈上。狐狸发现以后，满心欢喜地扑过去。它刚要用牙叼住项圈，那东西忽然咔嗒一声合拢。狐狸发出一声凄厉的惨叫，转身逃走了。我找遍许多地方，从此再也没有见到它。
        - id: ch03-b04
          speaker: lombardy_princess
          text: 你把皮扔进火里时，我就在附近。刚才急着躲开，项圈一定是从我身上掉下来的。哥哥，我不能没有心爱的小狐狸。求你帮我找到它吧。
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: 妹妹伤心得厉害，王子不敢说出那只可怜的狐狸中了箭，只盼时间能慢慢安慰她。他向公主保证，只要她肯让自己在海岸多留这一天，此后无论她想到哪里去，他都会陪着同行。公主虽然满心牵挂狐狸，也只得接受这个请求。
        - id: ch03-b06
          speaker: narrator
          text: 王子又站上高岩，望着那座美丽的绿岛。他拼命睁大眼睛，只盼白帆再次出现。忽然，不远处的树林里传来可怕的尖叫。他用最快的速度飞奔过去，看见一名骑士坐在马上，背后挂着弓，正挣扎着要把一个女人拖上马鞍。骑士没想到这片荒野里竟会有人，惊得松开了女人的手臂。她赶紧跑到救命恩人身后躲起来。王子定睛一看，竟认出那是自己的继母。
        - id: ch03-b07
          speaker: lombardy_prince
          text: 你怎么会到这里来？
        - id: ch03-b08
          speaker: narrator
          text: 他的语气冷得像冰，心里甚至后悔救了她。王后看懂了，立刻跪下。
        - id: ch03-b09
          speaker: lombardy_queen
          text: 请原谅我从前的恶行！我早已后悔了。现在我正要救你的父亲，他被那个疯大公打成重伤。刚才挟持我的也是他。别去追，已经来不及了！
          emotion: fearful
        - id: ch03-b10
          speaker: narrator
          text: 马蹄声已经远去。王后和王子沿小径向前，一边走，一边讲述分别后的事。
        - id: ch03-b11
          speaker: lombardy_queen
          text: 国王知道我虐待你妹妹后，发誓再也不见我，离开宫廷寻找你们。我暗中跟着，却打听不到他的消息，只得去找刀鞘之母。她带我到那座棕榈摇曳的小岛，还让我见到一位中了魔法的美丽公主。每天到了可怕的时辰，那位公主就要变成鳄鱼。鳄鱼皮会出现在她面前，不管她多么害怕，总有一股看不见的力量逼她裹上那张皮，跳进海里。
        - id: ch03-b12
          speaker: lombardy_queen
          text: 我正要带你去那座岛。不过，我们必须先找到你妹妹。白狐狸能不能活下来，全看她能不能及时赶去。当然，也许狐狸已经死了。
        - id: ch03-b13
          speaker: lombardy_prince
          text: 白狐狸？你知道它出了什么事？
          emotion: surprised
        - id: ch03-b14
          speaker: lombardy_queen
          text: 知道得不多。我上岛以后，它一直和我们在一起，所有人都喜欢它。昨天狐狸失踪了，傍晚却有一条小船漂上沙滩，它满身是血地躺在里面。宫里的人尽力替它治伤，我出发去请教巫师。巫师说，我必须坐小船找到伦巴第的王子和公主，在二十四小时内把你们带到狐狸面前，它才有救。
        - id: ch03-b15
          speaker: lombardy_queen
          text: 我沿海滩寻找，在一块岩石上发现了你父亲。他的肩膀中了一箭，是那个疯大公，也就是他的表兄亲手射的。我看见疯大公又从箭囊里抽出一支箭，那一箭是留给我的。我只能转身逃进森林，后来才遇上你。
        - id: ch03-b16
          speaker: lombardy_prince
          text: 父亲就在附近！我们回去找他，也把妹妹找来。
    - id: ch04
      title: 白狐狸的真身
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 他们回到岩洞，发现公主也在那里。国王的头枕在她膝上，她正徒劳地按住伤口，怎么也止不住血。王子、公主和王后三人一同用力，总算把受伤的国王抬上小船。船随即飞快驶向小岛。途中，王子才尽量委婉地告诉妹妹，白狐狸受了重伤，眼下的情形十分危急。
        - id: ch04-b02
          speaker: lombardy_princess
          text: 带我去见它！
        - id: ch04-b03
          speaker: narrator
          text: 船刚靠岸，王后便一言不发，领着她沿小路走向宫殿。白狐狸躺在炉火前的柔软褥子上，双眼紧闭，脸上的神情表明死期已经不远。可它不知怎么感觉到了公主就在身边，于是睁开眼睛，虚弱地摇了摇尾巴。公主再也忍不住，顿时哭得泪流满面，直到有人把手放上她的肩，她才停住。
        - id: ch04-b04
          speaker: island_governor
          text: 剩下的时间不多了，你为什么还这样浪费？把你戴的项圈套在它脖子上，它马上就会痊愈。快一点。
        - id: ch04-b05
          speaker: narrator
          text: 公主听见这话，整个人像石头一样僵住了。她以为最后的希望也没有了，连声音都变成了喘息。
        - id: ch04-b06
          speaker: lombardy_princess
          text: 项圈？可我没有项圈了，我把它丢在森林里了！
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: 墙上悬挂着上千只刀鞘，听见这话，全都叫了起来。
        - id: ch04-b08
          speakers: [sheath_1, sheath_2, sheath_3]
          ensemble: chorus
          text: 项圈丢了！项圈丢了！
        - id: ch04-b09
          speaker: lombardy_king
          text: 你们说的是哪只项圈？那个疯子射伤我以前，我从一堆余烬里捡到一只。也许正是你们要找的。就算不是，说不定也能用。
        - id: ch04-b10
          speaker: narrator
          text: 国王躺在另一张床上，医生们正俯身围着他。他示意侍从从自己的天鹅绒紧身上衣口袋里取出项圈。公主一看见这件珍宝，便欢喜地冲上去，一把从侍从手中夺过，套在狐狸颈上。所有人都屏住呼吸，盯着眼前的变化。狐狸的四条腿越来越长，尖尖的鼻吻却越来越短。转眼间，白狐狸不见了，原地躺着的竟是佩拉特里特斯，身上还穿着一件厚厚的白毛皮外套。
    - id: ch05
      title: 梳子的最后一道魔法
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 伦巴第王子见好友兼表兄恢复人形，当然高兴得不得了。可神秘消失的贝壳仙女仍压在他心头。他想到她可能正在受苦，脸上怎么也露不出真正的喜色。岛上总管留意到他的愁容，便问他究竟发生了什么。
        - id: ch05-b02
          speaker: lombardy_prince
          text: 求你帮帮我！那位中了魔法的仙女不知正在受什么折磨，我一想到她，就难受得不得了。
        - id: ch05-b03
          speaker: island_governor
          text: 她受的苦，比你能想象的还要可怕。不过，只要梳子还在，你也许还能救她。
        - id: ch05-b04
          speaker: narrator
          text: 王子立刻从鞘中抽出梳子。
        - id: ch05-b05
          speaker: island_governor
          text: 很好。现在跟我来。
        - id: ch05-b06
          speaker: narrator
          text: 不只是王子，在场的其他人也都跟了上去。总管领他们走过一条长廊，来到一扇沉重的铁门前。铁门自行打开了。眼前的景象让王子心惊。那位上次还美得无与伦比的少女，如今正坐在椅子上，浑身裹着火焰。火苗像一绺绺头发，扭动着缠绕她的脑袋。她的脸又红又肿，嘴巴大张着，像是已经喘不过气，只有双臂和颈项还像从前一样洁白美丽。
        - id: ch05-b07
          speaker: island_governor
          text: 这是你造成的。你烧掉鳄鱼皮，才让她变成这样。现在替她梳头，看看能不能减轻她的痛苦。
        - id: ch05-b08
          speaker: narrator
          text: 王子举起梳子。梳齿碰她第一下，缠在身上的火焰便突然全部熄灭。梳到第二下，她脸上的痛苦消失了，红肿的面庞也恢复到原来的模样。梳到第三下，她从椅子上站起身来，比王子从前见到她时还要美丽。接着，她一头扑进哥哥佩拉特里特斯怀中。
        - id: ch05-b09
          speaker: narrator
          text: 到了这一步，只剩一件事要做，那就是尽快让两对年轻人成婚。婚礼结束后，佩拉特里特斯带着新娘回到皮亚琴察，费兰迪娜和丈夫则返回伦巴第。他们从此幸福地生活在一起，直到生命尽头。
