  chapters:
    - id: ch01
      title: The Comb and the Collar
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a king of Lombardy who was uglier than any of his subjects, though he dearly loved beauty in other people. He married a woman everyone called the handsomest alive. Some whispered that she was also the most ill-natured. She could not bear to look at anyone pretty, so every lady around her was chosen for plainness. Worst of all, she was fiercely jealous of the king's son and daughter by his first wife.
        - id: ch01-b02
          speaker: narrator
          text: >-
            For all her wicked ways, the queen ruled the king completely, and he gave in to whatever she wanted. She treated his son badly, but made the lovely princess suffer ten times more. She gave the girl a governess with a temper as cruel as her own. Then she tried everything she could to ruin the princess's beauty and make her seem ugly. She dressed her in hideous clothes and covered her in dreadful brown paint. Yet whenever the clothes and paint came off, the girl's beauty shone as brightly as before.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The king of Lombardy had a cousin, the Archduke of Placenza, who had recently lost his reason. His son and daughter, Perarthrites and Ferrandina, were filled with grief. When every doctor failed to cure their father, they sent a messenger to a famous enchantress called the Mother of Sheaths. Everyone who came to her brought a knife, and she pushed each blade into one of the countless sheaths lining her cavern.
        - id: ch01-b04
          speaker: mother_of_sheaths
          text: Seek your father's wits in the very place where he lost them.
        - id: ch01-b05
          speaker: narrator
          text: >-
            That was all the comfort the witch would give. Against the wishes of the chief ministers, Perarthrites and Ferrandina rode to the mysterious castle where their father had slept when madness overtook him. They passed through its gates, and no one heard another word of them.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Three weeks went by without news. The chief minister called a council, and in the end they chose a company of distinguished people to visit the Mother of Sheaths. This time their knives were made of pure gold and set thickly with precious stones. The witch was delighted by such beautiful gifts. She listened closely, then reached into a hole in the cavern and drew out a small case containing a comb and a steel collar locked with a golden key.
        - id: ch01-b07
          speaker: mother_of_sheaths
          text: >-
            Take this comb and collar from court to court. You must find a woman beautiful enough to unlock the collar and a man good enough to draw the comb from its case. Once you find them, you may return to the place you came from.
        - id: ch01-b08
          speaker: chamberlain
          text: But how will that bring our missing prince and princess home?
        - id: ch01-b09
          speaker: mother_of_sheaths
          text: That is all I can do for you.
        - id: ch01-b10
          speaker: narrator
          text: >-
            She withdrew into the deepest part of the cavern, and none of them dared follow.
    - id: ch02
      title: The Trial at Lombardy
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            For months, the mad archduke's chief ministers went from one royal court to another. At last they reached Lombardy, where their strange errand had arrived ahead of them. The king welcomed them with open arms. In his heart, he felt certain that his wife was the matchless beauty meant to open the collar. If paint, hair dye, and splendid gowns could have done it, he would have been right. His love for the wicked queen had left him blind to the truth about her charms.
        - id: ch02-b02
          speaker: narrator
          text: >-
            At the chosen hour, the queen entered the throne room with the young princess beside her. The girl looked pitiful. Her dress had been shaped to make her seem hunchbacked. Thick yellow paint hid her pink-and-white skin, and a tight brown cap covered every strand of her black hair. Angry murmurs passed through the room. The ambassadors had often heard that she was as lovely as Ferrandina, and they could only stare. The king was so ashamed that he kept his eyes on the floor. He motioned for his son to take his place, then left.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The prince mounted the throne and ordered the trial to begin at once. First the collar went to the princess's governess, one of the ugliest women anyone had ever seen. Of course, she could not turn the key. The prince knew this short time of power was his chance to punish her for all the cruelty she had shown his sister. Worst of all, it was the governess who had urged the queen to disguise the girl so shamefully that day. He ordered her taken away and executed. The attendants carried out the command with very good will.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Next he told the ladies in waiting to take his sister to her rooms, bathe her, and dress her in the queen's finest robes, since the princess had none of her own. The queen ground her teeth in fury, but for once she did not dare interfere.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The princess returned sooner than anyone expected. She looked so beautiful in the splendid robes that anyone who had doubted which woman could unlock the collar was convinced at once. Her brother gave her one glance but said nothing. Then he signaled to an ambassador to begin the trial of the comb. One by one, every man present did his best to draw it from the case. One by one, they were forced to admit defeat. At last only the prince remained, but as judge he had to wait until everyone else had tried.
        - id: ch02-b06
          speaker: narrator
          text: >-
            When the men had finished with the comb, the court ladies received the collar one by one, in order of rank. Not one of them could even make the key turn. Finally the collar came to the queen. She strained at the golden key and managed to open it the smallest way. Her heart beat fast with triumph, but in the next instant the lock snapped shut again. The queen sank back and fainted from disappointment.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Now only the prince and princess were left. The instant the prince touched the case, it opened by itself. The collar's lock yielded as soon as his sister took the key. Courtiers and attendants cried out in delight. Then a whirlwind roared through the room. Thick darkness followed, and the earth shook beneath them.
        - id: ch02-b08
          speaker: narrator
          text: >-
            When calm returned and sunlight filled the room again, the prince and princess were gone.
    - id: ch03
      title: The White Fox
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The storm had carried the king's two children in opposite directions. Their flight through the air left the princess senseless. When she awoke alone in a thick forest, terror nearly overcame her again. She ran wildly among the trees, calling for her brother. Her cries brought no help. Instead, hungry wolves sprang toward her with open jaws and red tongues hanging out.
        - id: ch03-b02
          speaker: narrator
          text: >-
            She dropped to her knees and covered her face with one hand. Without knowing it, she gripped the collar in the other and waited to die. The wolves came nearer. She could already feel their hot breath against her cheek, and she crouched lower and lower. Then the leading wolf's eyes fell upon the collar. He gave a howl that rang through the forest and bounded away. Every one of his companions raced after him.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Once the shock had passed, the princess stood and fled without knowing where she was going. She reached a broad road and saw a flock of sheep coming toward her, driven by two shepherds. She hurried over to ask for help, but the sheep caught sight of the collar and scattered at once.
        - id: ch03-b04
          speaker: princess
          text: There must be something on me that frightens every animal.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The thought gave her great comfort, and she continued in better spirits until she reached the gates of an old castle. Just as she was about to enter and ask for shelter that night, a snow-white fox crossed the road and stopped before her.
        - id: ch03-b06
          speaker: narrator
          text: >-
            He was so pretty, and his bright eyes pleaded so sweetly, that she quickly tucked the collar under her dress. She could not bear to frighten him away. She approached very gently, hoping he might follow her into the castle. But the fox ran off in another direction. Though she was tired, something compelled her to go after him.
        - id: ch03-b07
          speaker: narrator
          text: >-
            She was thankful when he finally turned a corner and sat outside a tiny palace built on the bank of a river. As she came near, he caught the hem of her dress in his teeth and led her through the door. In one room stood a table spread with milk and fruit. The princess ate and drank until she was satisfied. Then she lay on a heap of cushions, with the white fox curled at her feet, and fell asleep dreaming of her lost brother.
    - id: ch04
      title: The Lady of the Shell
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Her brother was thinking just as deeply of her. The whirlwind had thrown him onto a wild seashore where everything was bleak and bare. Only one place was green: a distant island that he could see from the top of a high rock. He spent his days there, watching palm trees wave and waterfalls glitter far away.
        - id: ch04-b02
          speaker: prince
          text: What if my sister is on that island?
        - id: ch04-b03
          speaker: narrator
          text: >-
            He had no more reason to expect his sister there than in any other place, but he could not drive the idea from his mind. Then a song broke into his thoughts. It was sung in the loveliest voice he had ever heard. The prince turned toward it at once. The singer sounded very close, yet he saw no one. As soon as he reached one place, the voice called from another direction. He followed it up and down the shore, always searching and never catching sight of the singer.
        - id: ch04-b04
          speaker: narrator
          text: >-
            He followed it back and forth until a large fish skin stopped him. It lay stretched across the sand between the sea and the rocks. The ugly thing disgusted him, and he stepped aside. At that instant, something leaped into the water behind him. When he turned, the skin had vanished. In a cave behind it he saw an ebony bath lined with gold, flashing in the sun.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Several uneventful days passed. The prince had nearly decided to leave the shore and look for his sister inland when that enchanting voice returned. The bloody skin lay on the sand again, and the bath in the grotto was full of water. He slept little that night. Before dawn he hid among the rocks, determined to stay until the fish returned.
        - id: ch04-b06
          speaker: narrator
          text: >-
            He did not wait long. With the sun's first rays, a shining white shape appeared far out at sea. Gentle breezes carried it toward shore. As it came closer, he saw a dazzlingly beautiful maiden seated in a shell where blue, pink, and green melted together. She held the rope that guided it.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Her beauty so bewildered him that he forgot his hiding place. He rushed onto the sand, fell to his knees, and held out his hands to the marvelous vision. The comb and its case tumbled from his pocket. At the sight of them, the lady gave a wild shriek. She turned her shell around and sped away toward the island.
        - id: ch04-b08
          speaker: narrator
          text: >-
            The prince threw off his clothes and prepared to swim after her. Then he noticed a snow-white fox beside him, staring toward the island and waving its paws frantically. A small boat soon put out from shore and sailed toward them, to the fox's great joy.
        - id: ch04-b09
          speaker: narrator
          text: >-
            When the boat reached the beach, the fox waved one paw toward the prince's clothes. The prince understood the sign and dressed again. He and the fox climbed aboard, and they had only just pushed away when he remembered how the sight of the comb had frightened the beautiful lady. Fury swept over him. He raised his hand to fling the comb into the sea, but the fox sprang upon him. The little creature clung so tightly to his arm that he could not lift it.
        - id: ch04-b10
          speaker: narrator
          text: >-
            At that very moment, a horseman on shore shot an arrow. His aim was true. The little fox fell heavily into the bottom of the boat and closed his eyes as if the wound were mortal. The prince was overcome with grief. He leaped ashore at once, but the killer was already far away. When he turned back, both the boat and the fox had disappeared.
        - id: ch04-b11
          speaker: narrator
          text: >-
            A storm was coming, so the prince took refuge in the grotto. Countless lights glowed inside, each one shaped like a knife halfway out of its sheath. A white, tentlike covering hung above the bath, embroidered all over with sheaths. From beneath it, a voice spoke.
        - id: ch04-b12
          speaker: lady_of_the_shell
          text: >-
            Prince, will you trust me, no matter what happens? My heart belongs to you, and I know yours belongs to me. But take care. If you show even the smallest fear when this tent opens, you will lose me forever.
        - id: ch04-b13
          speaker: narrator
          text: >-
            The warning was needed. A crocodile's head came toward him, its jaws snapping. Even after what the lady had said, the prince could barely keep the color in his cheeks or stop his hand from trembling. With a great effort, he remained perfectly still and fixed his eyes upon the horrible creature. As he watched, the crocodile's head bent backward. Beneath it appeared the lovely face of the Lady of the Shell.
        - id: ch04-b14
          speaker: lady_of_the_shell
          text: Hurry, Prince! There is no time. Comb my hair now, or I will disappear from your sight!
        - id: ch04-b15
          speaker: narrator
          text: >-
            He took out the comb, but drawing it from the case demanded all his strength. As the comb slowly emerged, the horrible covering released the lady's head. Her body rose farther from the water. When her shoulders and arms were free, she called to him again.
        - id: ch04-b16
          speaker: lady_of_the_shell
          text: You have obeyed me this far. That is enough. Now burn my skin.
        - id: ch04-b17
          speaker: prince
          text: I can never do that!
          emotion: fearful
        - id: ch04-b18
          speaker: lady_of_the_shell
          text: >-
            Then we will both regret it forever. I can only marry the man who will burn my skin.
        - id: ch04-b19
          speaker: narrator
          text: >-
            The prince still hesitated. The tent curtains fell around the lady, and every light went out.
        - id: ch04-b20
          speaker: narrator
          text: >-
            Bitterly sorry that he had waited, the prince wandered toward the forest, where a fire was burning. He barely knew what he was doing. On the way, he nearly tripped over the skin lying across his path.
        - id: ch04-b21
          speaker: prince
          text: What a fool I was! This is the skin she wanted me to burn.
        - id: ch04-b22
          speaker: narrator
          text: >-
            He seized it with both hands and hurled it into the flames. It exploded with a terrible noise. The prince ran some distance away at first, for he had no idea what might happen next. After a while, he discovered that his wandering steps had brought him back to the fire. The skin was gone and had left no trace. But something shone among the cinders. When he looked closer, he saw that it was the magic collar.
        - id: ch04-b23
          speaker: narrator
          text: >-
            Then his sister, whom he had missed so deeply, must be close. Before he could turn or pick up the collar, her arms were around his neck, and they forgot everything else.
    - id: ch05
      title: The Search for the Fox
      blocks:
        - id: ch05-b01
          speaker: princess
          text: You must tell your story first.
        - id: ch05-b02
          speaker: narrator
          text: >-
            When they could finally speak again, the prince told her all that had happened. His thoughts were so full of the Lady of the Shell that he said nothing about the fox. That was fortunate, because after the princess poured out her own adventures, she ended by telling him how much she owed the little white creature.
        - id: ch05-b03
          speaker: princess
          text: >-
            You cannot imagine how carefully he looked after me in the little palace. He was kinder than anyone could be. Still, I could see in his eyes that he wanted me to give him something, though I had no idea what it was. Then the day came when I learned, and it cost me dearly.
        - id: ch05-b04
          speaker: princess
          text: >-
            I had hidden the collar deep in a bush so he would not see it and run away like the other animals. One day we were in the garden, and sunlight fell straight upon it. The fox sprang toward it with every sign of delight. Just as he was about to take it in his teeth, the collar snapped shut with a loud crack. He fled with a piercing scream. I have searched everywhere, but I have never seen him since.
        - id: ch05-b05
          speaker: princess
          text: >-
            I was nearby when you threw the skin into the fire. In my rush to get away, I must have dropped the collar. Dear brother, I cannot live without my beloved fox. Please help me find him.
          emotion: sad
        - id: ch05-b06
          speaker: narrator
          text: >-
            Tears filled her eyes, and her grief was so great that the prince could not bring himself to tell her what had happened to the poor little animal. He hoped that time might ease her sorrow. He assured her that he would go with her wherever she wished. He asked only for one more day beside the sea before they began the search. The princess did not like the delay, but she had to agree.
        - id: ch05-b07
          speaker: narrator
          text: >-
            The prince stood on the high rock, watching the lovely island and straining to see the white sail again. Suddenly, dreadful screams rose from a nearby wood. He ran toward them as fast as he could.
        - id: ch05-b08
          speaker: narrator
          text: >-
            He found a knight on horseback with a bow slung across his back. The man was struggling to lift a woman onto his saddle. Seeing someone else in that desolate place startled the knight so badly that he let go of her arm. The woman rushed behind the prince and took shelter there. He turned to look at her, and to his amazement recognized his own stepmother.
        - id: ch05-b09
          speaker: prince
          text: How did you get here?
        - id: ch05-b10
          speaker: narrator
          text: >-
            His voice was cold. He more than half wished he had left her where she was. The queen understood what he felt and dropped to her knees.
        - id: ch05-b11
          speaker: queen
          text: >-
            Please forgive all the wicked things I did. I repented long ago, and I came here to help your father. The mad archduke you just drove away has wounded him badly. Do not chase that man now. There is no time.
          emotion: sad
        - id: ch05-b12
          speaker: narrator
          text: >-
            The prince had started at the sound of the retreating horse. As he and the queen pushed along the path, she told him what had happened since they last met.
        - id: ch05-b13
          speaker: queen
          text: >-
            As soon as the king learned how cruel I had been to your sister, he swore he would never see me again. He left court to search for both of you. I secretly followed, but I found no word of him, so I went to the Mother of Sheaths. She took me to the island where the palm trees wave.
        - id: ch05-b14
          speaker: queen
          text: >-
            On that island she showed me a beautiful princess under a spell. Every day, the girl had to become a crocodile. When the dreadful moment came, the skin appeared before her. No matter how she shuddered, an unseen force made her wrap herself in it and plunge into the sea. I am taking you to that island now. But first we must find your sister, because the white fox's life depends on her being there, if he is still alive.
        - id: ch05-b15
          speaker: prince
          text: The white fox! What do you know about him?
          emotion: surprised
        - id: ch05-b16
          speaker: queen
          text: >-
            Not very much. He was always with us after I reached the island, and everyone loved him. Yesterday he disappeared. That evening, a little boat drifted onto the sand, and the fox lay inside it covered in blood. They cared for his wounds at the palace while I went to ask a wizard for help.
        - id: ch05-b17
          speaker: queen
          text: >-
            The wizard told me to enter the boat and find the prince and princess of Lombardy. If I could bring you both to the fox within twenty-four hours, he would live. On a rock along the shore, I found your father with an arrow through his shoulder. The mad archduke had shot him and was drawing another arrow for me. I escaped into the forest.
        - id: ch05-b18
          speaker: prince
          text: My father is so close! We must find him, and we must find my sister too.
        - id: ch05-b19
          speaker: narrator
          text: >-
            They discovered the princess in the grotto. She sat with her father's head in her lap, trying in vain to stop the blood from his wounds. Between them, the prince, princess, and queen managed to lift the injured king and carry him down to the boat. Once they were all aboard, it sailed swiftly across the water toward the island. During the journey, the prince gently broke the news to his sister that the white fox was badly wounded and very near death.
        - id: ch05-b20
          speaker: princess
          text: Take me to him!
        - id: ch05-b21
          speaker: narrator
          text: >-
            The moment the boat touched the island, the princess was ready. Without a word, the queen led them down the path to the palace.
    - id: ch06
      title: The Two Enchantments
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            The white fox lay on a soft mattress before a fire. His eyes were shut, and his face showed that death was close. Somehow he knew the princess had come. He opened his eyes and weakly wagged his tail. The princess broke into sobs. Then a hand on her shoulder stopped her.
        - id: ch06-b02
          speaker: governor
          text: >-
            Why spend the few moments you have left weeping? Put the collar around his neck, and he will be healed at once. You must hurry.
        - id: ch06-b03
          speaker: narrator
          text: >-
            The princess stood as still as stone.
        - id: ch06-b04
          speaker: princess
          text: The collar? But I do not have it. I lost it in the forest!
          emotion: fearful
        - id: ch06-b05
          speaker: narrator
          text: >-
            A thousand sheaths hung upon the walls, and all of them echoed her cry.
        - id: ch06-b06
          speakers: [sheath_1, sheath_2, sheath_3]
          ensemble: chorus
          text: The collar is lost! The collar is lost!
        - id: ch06-b07
          speaker: king
          text: >-
            What collar do you mean? I found one among some ashes, before that madman shot me. Perhaps it is the one you need. Even if it is not, maybe it will serve.
        - id: ch06-b08
          speaker: narrator
          text: >-
            The king lay on another bed while physicians bent over him. He motioned to an attendant, who took the collar from the pocket of his velvet coat. At the sight of it, the princess leaped forward in joy. She snatched it from the man's hand and placed it around the fox's neck.
        - id: ch06-b09
          speaker: narrator
          text: >-
            Everyone held their breath and watched. The fox's legs began to stretch, growing longer and longer before their eyes. At the same time, his pointed nose grew shorter and shorter. In another moment, the white fox was gone. Lying where he had been was Perarthrites himself, dressed in a coat of thick white fur.
        - id: ch06-b10
          speaker: narrator
          text: >-
            The prince of Lombardy rejoiced to see his friend and cousin alive. Still, his heart ached for the beautiful lady who had vanished so mysteriously. The governor noticed his troubled face and asked what was wrong.
        - id: ch06-b11
          speaker: prince
          text: >-
            Please help me if you can. I cannot bear to think what the enchanted lady may be suffering.
          emotion: sad
        - id: ch06-b12
          speaker: governor
          text: >-
            Her suffering is far worse than you can imagine. But if you still have the comb, you may be able to free her.
        - id: ch06-b13
          speaker: narrator
          text: >-
            The prince quickly drew the comb from its case.
        - id: ch06-b14
          speaker: governor
          text: Good. Now follow me.
        - id: ch06-b15
          speaker: narrator
          text: >-
            Not only the prince but everyone else followed. The governor led the whole company down a long gallery until they came to a heavy iron door. It flew open by itself. A terrible sight waited beyond it. The lady whom the prince had last seen in perfect beauty sat in a chair wrapped in flames. They curled and twisted around her head like locks of fiery hair. Her face was swollen and red, and her open mouth looked as though she were gasping for breath. Only her neck and arms remained as lovely and white as ever.
        - id: ch06-b16
          speaker: governor
          text: >-
            You caused this when you burned the crocodile skin. Now use the comb and see if you can ease her pain.
        - id: ch06-b17
          speaker: narrator
          text: >-
            At the comb's first touch, the flames went out. At the second, the pain left her face and its swelling disappeared. At the third, she rose from the chair more beautiful than ever and threw herself into the arms of her brother, Perarthrites.
        - id: ch06-b18
          speaker: narrator
          text: >-
            Nothing remained but to marry the two couples as quickly as possible. After the weddings, Perarthrites returned to Placenza with his bride. Ferrandina went to Lombardy with her husband. And all of them lived happily for the rest of their lives.
