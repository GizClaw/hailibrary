  chapters:
    - id: ch01
      title: The Children of Clarides
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            On a calm day, anyone sailing two or three miles off the coast of France can look deep, deep into the water and see the trunks of great trees still standing below. Hundreds of years ago, those trees belonged to a broad forest filled with every sort of wild animal. Beyond the forest stood a fine city, watched over by the castle of the Dukes of Clarides. Little by little, the sea crept closer to the town. Water undermined the foundations of the houses, and one after another they fell. At last, a shining sea flowed over all the land. But that happened many years after the tale I am about to tell.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The Dukes of Clarides had always lived among their people and defended them in peace as well as war. When our story begins, Duke Robert was dead. His young and beautiful duchess ruled in his place. Everyone expected her to marry again, but she turned away every suitor. She said she had only one soul and could therefore have only one husband. Besides, her baby daughter was enough for her.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One summer day, the duchess sat in a tower overlooking a rocky heath bright with purple and yellow flowers. A band of riders came toward the castle. In their midst, on a white horse with black-and-silver trappings, rode her friend, the Countess of Blanchelande. The countess was also a young widow. Her son, Youri, was two years older than little Abeille des Clarides. The duchess welcomed her gladly, but her delight turned to tears when the countess sank onto the cushions beside her and explained why she had come.
        - id: ch01-b04
          speaker: countess
          text: >-
            You know that whenever a Countess of Blanchelande is near death, she finds a white rose on her pillow. I went to bed last night happier than usual. This morning, I woke with the rose against my cheek. You are the only person in the world who can help me. Will you take my son, Youri, and let him grow up as a brother to Abeille?
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: >-
            The duchess could not answer. Tears stopped her voice, and she threw her arms around her friend. The two women said farewell without another word. Then the countess mounted her horse and rode home. She placed her sleeping boy in the care of her steward, Francoeur, and lay quietly down upon her bed. The next morning, they found her there, peaceful and dead.
        - id: ch01-b06
          speaker: narrator
          text: >-
            So Youri and Abeille grew up side by side. The duchess faithfully kept her promise and became a mother to them both. As the children grew older, she often took them with her on journeys through the duchy. They saw the places she ruled and met the people who lived there. She taught them to know those people, to feel pity when they suffered, and to give help wherever they could.
        - id: ch01-b07
          speaker: narrator
          text: >-
            On one such journey, they crossed meadows thick with flowers. Beneath distant mountains, Youri saw a vast glittering surface. He waved toward it.
        - id: ch01-b08
          speaker: youri
          text: What is that, godmother? It looks like a giant's shield.
        - id: ch01-b09
          speaker: abeille
          text: No, it is a silver plate as big as the moon!
        - id: ch01-b10
          speaker: narrator
          text: Abeille twisted around on her pony while the duchess looked toward the shining water.
        - id: ch01-b11
          speaker: duchess
          text: >-
            It is not a shield or a silver plate. It is a beautiful lake. But however lovely it looks, you must never go near it. Undines, the spirits of the water, live in its depths, and they draw travelers down to their deaths.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The duchess said no more about the lake, but the children remembered it. One morning, after they had returned to the castle, Abeille hurried up to Youri and lowered her voice.
        - id: ch01-b13
          speaker: abeille
          text: The tower door is open. Let's climb up. We might find fairies there.
        - id: ch01-b14
          speaker: narrator
          text: >-
            They found no fairies. Yet when they reached the roof, the lake appeared bluer and more enchanting than before. Abeille stared at it for a moment.
        - id: ch01-b15
          speaker: abeille
          text: Look at it. I am going there.
        - id: ch01-b16
          speaker: youri
          text: >-
            You can't! You heard what your mother told us. And it is much too far away. How would we ever reach it?
        - id: ch01-b17
          speaker: abeille
          text: >-
            You ought to know. What is the use of being a man and learning so many things if you have to ask me? Never mind. There are plenty of other men. I will find one who can tell me.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Youri flushed. Abeille had never spoken to him that way. Though she was two years younger, she suddenly seemed far older. She kept her mocking eyes fixed on him until anger overcame his fear of the lake. He seized her hand and spoke boldly.
        - id: ch01-b19
          speaker: youri
          text: Very well. We will both go.
    - id: ch02
      title: The Lake
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The next afternoon, the duchess worked at her tapestry among her maidens while the children went to play in the garden. As soon as they were alone, Youri held out his hand.
        - id: ch02-b02
          speaker: youri
          text: Come with me.
        - id: ch02-b03
          speaker: abeille
          text: Where are we going?
        - id: ch02-b04
          speaker: youri
          text: To the lake, of course.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Abeille said nothing. Pretending that she might disobey someday was very different from setting off for a distant lake without anyone knowing she had left the garden. And she was wearing satin shoes. Boys could be terribly foolish.
        - id: ch02-b06
          speaker: youri
          text: >-
            Foolish or not, I am going, and you are coming. Unless you are frightened. If you are, I will go alone.
        - id: ch02-b07
          speaker: narrator
          text: >-
            That was more than Abeille could bear. She burst into tears, flung her arms around Youri's neck, and swore that she would follow wherever he went. Their quarrel ended, and they set out together.
        - id: ch02-b08
          speaker: narrator
          text: >-
            It was a very hot day. The townspeople stayed indoors, waiting for the sun to sink low before they went out to work or play. No one saw the children pass through the streets. They crossed the river by the bridge and entered the flowered meadows, following the same road they had ridden with the duchess. After a while, Abeille became terribly thirsty. But the heat had drunk up all the water along the way, and there was not a single drop left for her.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Farther on, good luck brought them to a cherry tree covered with ripe fruit. They rested beneath it and ate until they felt refreshed. Afterward, they were certain they had enough strength to reach the lake in only a few minutes. Soon Abeille began to limp and complained that her foot hurt. Youri untied the ribbons holding her shoe and looked inside. A stone was rubbing her foot, so the trouble was easily fixed. For a while, they skipped down the path, singing and talking together. Then Abeille stopped once more. This time, her shoe had fallen off. She turned to pick it up and caught sight of the castle towers. They looked terribly far away. Her heart sank, and she began to cry.
        - id: ch02-b10
          speaker: abeille
          text: It is getting dark. The wolves will eat us!
          emotion: fearful
        - id: ch02-b11
          speaker: narrator
          text: Youri put his arms around her and tried to comfort her.
        - id: ch02-b12
          speaker: youri
          text: >-
            We must be very close now. There is nothing to fear. We will see the lake and still be home in time for supper.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Abeille dried her eyes and trotted beside him. And there the lake was at last, blue and silver beneath the evening sky. Purple and golden irises grew thickly along its banks, and white water lilies floated on its surface. Abeille looked everywhere. There was no sign of a person and no trace of one of the great beasts she had feared would find them. Across the smooth sand ran only the marks of tiny, forked feet.
        - id: ch02-b14
          speaker: narrator
          text: >-
            Abeille pulled off her torn shoes and stockings and let the cool water run over her feet. Youri searched for nuts or strawberries, but found nothing.
        - id: ch02-b15
          speaker: youri
          text: >-
            I saw some blackberry bushes a little way back. Stay here while I gather fruit. Then we will go home.
        - id: ch02-b16
          speaker: narrator
          text: >-
            Abeille murmured an answer and rested her sleepy head on a cushion of soft moss. Soon she was asleep. She dreamed that a crow hovered over her, carrying the smallest man she had ever seen, and then vanished. At that very moment, Youri returned and laid a broad leaf piled with strawberries beside her.
        - id: ch02-b17
          speaker: narrator
          text: >-
            He thought it would be a shame to wake her so soon. Beyond a clump of silver willows, he found a place where he could see the whole lake. Moonlight shone on the thin mist above the water, making it seem like fairyland. Slowly, the silver veil broke apart. Beautiful women with long green hair drifted toward him, their hands reaching out. A sudden terror seized Youri. He turned to run, but he was too late.
        - id: ch02-b18
          speaker: narrator
          text: >-
            Abeille knew nothing of the dreadful fate that had overtaken her foster brother. She slept even when a crowd of tiny men gathered around her. Every one of them had a white beard reaching to his knees.
        - id: ch02-b19
          speaker: pic
          text: What are we going to do with her?
        - id: ch02-b20
          speaker: narrator
          text: Pic seemed older than the others, though every one of them was very old.
        - id: ch02-b21
          speaker: rug
          text: We should build a cage and put her inside.
        - id: ch02-b22
          speaker: dig
          text: No, no! A beautiful princess does not belong in a cage.
        - id: ch02-b23
          speaker: narrator
          text: >-
            Tad, the kindest among them, wanted to carry her home to her parents. But the others were delighted with their new plaything and refused to listen.
        - id: ch02-b24
          speaker: pau
          text: Look. She is waking up.
        - id: ch02-b25
          speaker: narrator
          text: >-
            Abeille opened her eyes slowly. At first, she thought she must still be dreaming. Then she saw that the little men did not vanish or move, and she understood they were real. She sprang up and shouted.
        - id: ch02-b26
          speaker: abeille
          text: Youri! Youri, where are you?
          emotion: fearful
        - id: ch02-b27
          speaker: narrator
          text: >-
            The gnomes crowded closer. Abeille trembled and covered her face. They did not know what to do with her. Then Tad climbed onto a willow branch above her, leaned down, and gently stroked her fingers. She understood that he meant to be kind. She lowered her hands and studied her captors.
        - id: ch02-b28
          speaker: abeille
          text: >-
            Little men, it is a great pity that you are so ugly. But I will love you anyway if you give me something to eat. I am starving.
        - id: ch02-b29
          speaker: narrator
          text: >-
            A rustle passed through the group when she called them ugly. Some of the gnomes were furious and said she deserved no better than to be abandoned beside the lake. Others laughed. What did it matter, they asked, if a mere mortal thought them ugly? Tad ignored the quarrel. He ordered Bog, their messenger, to bring Abeille milk and honey, along with the finest white bread baked in their ovens under the earth.
        - id: ch02-b30
          speaker: narrator
          text: >-
            Bog returned on his crow in less time than Abeille would have needed to tie one shoe. She ate the bread and honey and drank the milk. Her fear disappeared, and she was ready to talk.
        - id: ch02-b31
          speaker: abeille
          text: >-
            Thank you, little men. That was a very good supper. My name is Abeille, and my brother is Youri. Please help me find him and show me the road to the castle. Mother must think something terrible has happened to us.
        - id: ch02-b32
          speaker: dig
          text: >-
            Your feet are too sore for walking, and we are forbidden to cross into your country. We can make a litter from twigs, cover it with moss, and carry you into the mountains to meet our king.
        - id: ch02-b33
          speaker: narrator
          text: >-
            Many little girls would have been terrified to be carried away alone without knowing where they were going. Once Abeille's first fright had passed, though, the strange adventure pleased her. What stories she would tell her mother and Youri when she returned! They might live a hundred years and never enter a mountain. She curled up comfortably in her bed of moss and waited to see what came next.
    - id: ch03
      title: The Kingdom Under the Mountain
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Up and up the gnomes went. Before long, Abeille fell asleep again. She did not wake until sunlight shone around her. Still they climbed, for the little men walked slowly, though they could spring over rocks faster than any mortal. Then the light filtering through the litter began to change. It was almost as bright as daylight, yet somehow different. The bearers set down the litter, gathered around Abeille, and helped her out.
        - id: ch03-b02
          speaker: narrator
          text: >-
            A man less than half her height stood before her, dressed with royal splendor and filled with dignity. Enormous diamonds covered his crown, so heavy-looking that it was a wonder his small body could bear them. A royal cloak hung from his shoulders, and he carried a lance.
        - id: ch03-b03
          speaker: forest_gnome
          text: >-
            King Loc, we found this beautiful child sleeping beside the lake. Her name is Abeille, and she says her mother is the Duchess of Clarides.
        - id: ch03-b04
          speaker: king_loc
          text: You did well. She will become one of us.
        - id: ch03-b05
          speaker: narrator
          text: >-
            King Loc rose onto his toes to kiss her hand. He promised that everyone would care for her and make her happy, and that she could have anything she desired at once.
        - id: ch03-b06
          speaker: abeille
          text: I want some shoes.
        - id: ch03-b07
          speaker: king_loc
          text: Bring her shoes!
        - id: ch03-b08
          speaker: narrator
          text: >-
            The king struck the ground with his lance. At once, a gnome slipped a lovely pair of silver shoes embroidered with pearls onto Abeille's feet. She looked at them uncertainly.
        - id: ch03-b09
          speaker: abeille
          text: >-
            They are beautiful. But will they carry me all the way home to my mother?
        - id: ch03-b10
          speaker: king_loc
          text: >-
            They are not made for rough roads. They are for the smooth paths inside our mountain. We have many wonders to show you here.
        - id: ch03-b11
          speaker: abeille
          text: >-
            Little King Loc, take these lovely slippers away. Give me wooden shoes instead, and please let me return to my mother.
        - id: ch03-b12
          speaker: narrator
          text: King Loc shook his head. Abeille spoke again, and now her voice trembled.
        - id: ch03-b13
          speaker: abeille
          text: >-
            Let me go back to Mother and Youri. If you do, I will love you with all my heart, almost as much as I love them.
          emotion: sad
        - id: ch03-b14
          speaker: king_loc
          text: Who is Youri?
        - id: ch03-b15
          speaker: abeille
          text: >-
            Why, Youri has lived with us since I was a baby. Surely everyone knows him.
        - id: ch03-b16
          speaker: narrator
          text: >-
            Abeille never guessed that speaking Youri's name had decided her fate. King Loc had already imagined that, after a few years, she might make him a good wife. He did not want Youri standing between them. The king fell silent. When Abeille saw his displeasure, she burst into tears and caught the corner of his cloak.
        - id: ch03-b17
          speaker: abeille
          text: >-
            Little King Loc, think of Mother. She will believe a wild beast ate me, or that I drowned in the lake.
          emotion: sad
        - id: ch03-b18
          speaker: king_loc
          text: >-
            Do not despair. I will send your mother a dream, and then she will know you are safe.
          emotion: calm
        - id: ch03-b19
          speaker: narrator
          text: Abeille's sorrowful face brightened.
        - id: ch03-b20
          speaker: abeille
          text: >-
            Little King Loc, how clever you are! But send her a dream every night so she can see me. And send me a dream too, so I can see her.
          emotion: happy
        - id: ch03-b21
          speaker: narrator
          text: King Loc gave her his promise.
        - id: ch03-b22
          speaker: narrator
          text: >-
            Once Abeille grew used to living without her mother and Youri, she found ways to be happy in the mountain. Everyone treated her kindly, petted her, and tried to please her. There always seemed to be something new to see. The gnomes were never idle. Their clever hands could fashion toys as beautiful as those made by people on the earth, and sometimes even more beautiful. Abeille often wandered with Tad or Dig through the long underground passages. Now and then, a break in the rocks gave her a glimpse of blue sky. Of all the mountain's wonders, she loved that little piece of sky the most. In this way, six years passed.
        - id: ch03-b23
          speaker: tad
          text: His Highness King Loc requests your presence in his chamber.
        - id: ch03-b24
          speaker: narrator
          text: >-
            Abeille had been singing to herself while playing a golden lute. She wondered why the king had suddenly become so formal with her, but she rose at once and obeyed his summons. As soon as she entered his presence, King Loc opened a hidden door in the wall. Beyond it lay his treasure chamber, a place Abeille had never been allowed to see before.
        - id: ch03-b25
          speaker: narrator
          text: >-
            Splendid things lay everywhere. Gold, jewels, rich cloth, and carpets filled the room. Abeille moved from one glittering object to another while King Loc climbed onto a throne of gold and ivory and watched her.
        - id: ch03-b26
          speaker: king_loc
          text: Choose anything you want.
        - id: ch03-b27
          speaker: narrator
          text: >-
            A necklace of perfect pearls hung on the wall. Abeille hesitated between it and a circlet set with diamonds and sapphires, then reached toward the pearls. Before her fingers touched them, she noticed a tiny patch of sky through a crack in the rock. Her hand fell.
        - id: ch03-b28
          speaker: abeille
          text: Little King Loc, let me go back to the earth just once.
        - id: ch03-b29
          speaker: narrator
          text: >-
            The king signaled to his treasurer. A coffer opened, filled with precious stones larger and more dazzling than those of any human king.
        - id: ch03-b30
          speaker: king_loc
          text: Choose whatever you please, Abeille.
        - id: ch03-b31
          speaker: narrator
          text: Abeille shook her head.
        - id: ch03-b32
          speaker: abeille
          text: >-
            One drop of dew in the garden at Clarides shines more brightly to me than your finest diamond. And none of those blue stones is as blue as Youri's eyes.
        - id: ch03-b33
          speaker: narrator
          text: >-
            A sharp pain struck King Loc's heart. For a moment, he could not speak. Then he raised his head and looked at her.
        - id: ch03-b34
          speaker: king_loc
          text: >-
            Only someone who cares nothing for riches deserves to own them. Take this crown. From today, you are Princess of the Gnomes.
        - id: ch03-b35
          speaker: narrator
          text: >-
            For thirty full days, no work was done anywhere in the underground kingdom. Instead, the gnomes held a great feast in honor of their new princess. When those thirty days of celebration had ended, King Loc appeared before Abeille dressed in the most splendid garments he possessed. With all the ceremony of a king, he asked her to become his wife.
        - id: ch03-b36
          speaker: abeille
          text: >-
            Little King Loc, I love you for all your goodness and kindness. But I can never love you in that other way. Never.
        - id: ch03-b37
          speaker: narrator
          text: >-
            The king sighed. He had expected her answer, but it still caused him great pain. He bravely tried to hide his disappointment and even managed a smile.
        - id: ch03-b38
          speaker: king_loc
          text: >-
            Then promise me one thing. If the day comes when you find someone you can love that way, will you tell me?
        - id: ch03-b39
          speaker: narrator
          text: Abeille gave him her promise.
    - id: ch04
      title: A Longing for Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Everyone remained as kind as ever, but Abeille was no longer the merry child who spent her days playing with the gnomes. Those who live under the earth grow much faster than people above it, and at thirteen Abeille was already a woman. King Loc's question had awakened new thoughts in her. She stayed alone for hours. Her round, rosy face became thin and pale. The gnomes tried to tempt her back to their games, but she no longer cared for them. Even her golden lute lay forgotten.
        - id: ch04-b02
          speaker: narrator
          text: >-
            One morning, something changed. Abeille left the silk-hung room where she usually sat alone and went before the king. Taking his hand, she led him through long corridors until they reached a place where a narrow strip of blue sky could be seen.
        - id: ch04-b03
          speaker: abeille
          text: Little King Loc, let me see my mother again, or I know I will die.
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: >-
            Her voice shook, and she trembled from head to foot. Even an enemy would have pitied her. King Loc loved her, yet he gave no answer. Abeille stayed there all day, watching the light fade and the sky turn pale. The stars came out, and still she did not move.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Suddenly, a hand touched her. King Loc stood behind her, covered from head to foot in a dark cloak. He carried another cloak over his arm.
        - id: ch04-b06
          speaker: king_loc
          text: Put this on and follow me.
        - id: ch04-b07
          speaker: narrator
          text: >-
            He said nothing more, but Abeille somehow knew he was taking her to her mother. They went on and on through passages she had never entered before, turning farther into the mountain and then climbing toward the surface. At last, Abeille was out in the world again. Everything around her seemed more beautiful than she remembered. The night air felt wonderfully fresh after the halls beneath the earth, and the flowers smelled sweet. The joy of being aboveground again was so great that she felt it might overwhelm her.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Then King Loc lifted her from the ground. Small as he was, he carried her easily across the garden and through an open door into the silent castle.
        - id: ch04-b09
          speaker: king_loc
          text: >-
            Listen carefully, Abeille. You have guessed where we are going. Every night, I send your mother a vision of you. She speaks to it in her sleep and smiles. Tonight she will see the real Abeille. But you must not touch her or speak. If you do, my power will vanish, and she will never see you or your image again.
        - id: ch04-b10
          speaker: narrator
          text: >-
            They reached the room Abeille remembered so well. Her heart beat fiercely as King Loc carried her across the threshold. A lamp above the bed shone on her mother. The duchess was still beautiful, but her face had become pale and sorrowful. As she looked at Abeille, the sorrow disappeared and a radiant smile took its place. She stretched out her arms.
        - id: ch04-b11
          speaker: narrator
          text: >-
            Tears of joy filled Abeille's eyes. She bent toward her mother's embrace. Before they touched, King Loc snatched Abeille up and carried her back to the kingdom of the gnomes.
        - id: ch04-b12
          speaker: narrator
          text: >-
            If the king hoped the visit would make her happy, he quickly learned otherwise. Abeille sat weeping all day and paid no attention when her friends tried to comfort her. At last, King Loc came to her.
        - id: ch04-b13
          speaker: king_loc
          text: Tell me what has made you so unhappy.
        - id: ch04-b14
          speaker: abeille
          text: >-
            Little King Loc, all of you have been so good to me. I know my sadness makes you miserable too. I would be happy if I could, but I cannot command my heart. I weep because I may never see Youri de Blanchelande again, and I love him with all my heart. Losing him hurts even more than leaving Mother. At least I know where she is and what she is doing. I do not even know whether Youri is alive.
          emotion: sad
        - id: ch04-b15
          speaker: narrator
          text: >-
            Every gnome fell silent. They were kind creatures, and Abeille's pain troubled them, but they were not mortal. None of them had ever known the greatest human joys or the deepest human sorrows. Only King Loc had begun to understand a little of both. He left the others and went to consult Nur, an ancient gnome who lived in the very lowest depth of the mountain. Nur possessed spectacles of every possible kind. With one pair or another, he could see all that was happening on the earth, and even what was hidden beneath the sea.
        - id: ch04-b16
          speaker: narrator
          text: Nur tried pair after pair before he found any trace of Youri de Blanchelande.
        - id: ch04-b17
          speaker: nur
          text: >-
            There he is! He sits in the Undines' palace beneath the great lake. He hates his prison. He longs to return to the world and perform brave deeds.
        - id: ch04-b18
          speaker: narrator
          text: >-
            Nur had seen the truth. Seven years had passed since Youri left Clarides with Abeille, and he too had grown into an adult. As he grew older, he became more and more tired of being petted and spoiled by the green-haired maidens. One day, he threw himself at the feet of the Undine queen and begged her to let him go home.
        - id: ch04-b19
          speaker: narrator
          text: The queen bent over him and stroked his hair.
        - id: ch04-b20
          speaker: undine_queen
          text: >-
            We cannot let you leave us. Stay here. You will become king, and you will marry me.
        - id: ch04-b21
          speaker: youri
          text: But Abeille is the one I mean to marry.
        - id: ch04-b22
          speaker: narrator
          text: >-
            He might as well have spoken to the wind. At last, the queen became angry and ordered a crystal cage built around him on a pointed rock.
        - id: ch04-b23
          speaker: narrator
          text: >-
            Many weeks later, King Loc reached the prison with Nur's spectacles to guide him. Gnomes travel slowly, and the road had been long and hard. Fortunately, the king had brought his magic ring. The instant it touched the crystal wall, the cage split from top to bottom.
        - id: ch04-b24
          speaker: king_loc
          text: Follow that path. It will lead you back into the world.
        - id: ch04-b25
          speaker: narrator
          text: >-
            King Loc did not wait for Youri's thanks. He turned at once toward his own kingdom. On the road, Bog came riding to meet him on the crow.
        - id: ch04-b26
          speaker: king_loc
          text: >-
            Bog, fly to the palace. Tell Princess Abeille that Youri de Blanchelande, after seven years as a prisoner of the Undines, has returned to the castle of Clarides.
    - id: ch05
      title: Youri Returns
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            When Youri came out of the mountain, the first person he met was the tailor who had made his clothes ever since he came to live at the castle. The old man was nearly beside himself with joy at seeing his young master, who had been lost for so many years. Youri begged him for news of his foster mother and Abeille.
        - id: ch05-b02
          speaker: tailor
          text: >-
            My lord, where can you have been? Do you not know that Princess Abeille vanished on the very day you did? We believe the gnomes carried her away. That day has left deep marks on our duchess. Still, she has one small reason to hope her daughter lives. Every night, a dream comes to her and shows her everything the princess is doing.
          emotion: surprised
        - id: ch05-b03
          speaker: narrator
          text: >-
            The tailor went on, telling Youri about all the changes seven years had brought to the village. Youri heard none of it. His thoughts were entirely with Abeille. At last, he collected himself. Ashamed that he had waited even this long, he hurried to the duchess's chamber.
        - id: ch05-b04
          speaker: narrator
          text: >-
            The duchess held him in her arms as if she would never release him. When she was calmer, Youri asked what she knew of Abeille and how he might free her from the gnomes.
        - id: ch05-b05
          speaker: narrator
          text: >-
            The duchess told him that, as soon as the children were found to be missing, she had sent men searching in every direction. One searcher saw a troop of tiny figures far away on the mountain. They were plainly carrying a litter between them. He hurried after the gnomes as fast as he could. Then, right at his feet, he noticed a tiny satin slipper. Thinking it must belong to Abeille, he stopped and bent to pick it up.
        - id: ch05-b06
          speaker: narrator
          text: >-
            A dozen gnomes swarmed over him like flies. They struck his head until he dropped the slipper, seized it, and left him stunned with pain. By the time he recovered his senses, the figures on the mountain had disappeared.
        - id: ch05-b07
          speaker: narrator
          text: >-
            That night, when the castle slept, Youri and his old servant Francoeur slipped into the armory. They put on light chain armor, helmets, and short swords. Then they mounted two horses that Francoeur had hidden in the forest and rode toward the gnomes' kingdom.
        - id: ch05-b08
          speaker: narrator
          text: >-
            After an hour of hard riding, they reached a cavern. Since childhood, Francoeur had heard that it led to the center of the earth. They dismounted and entered carefully, expecting darkness as thick as the night outside. Instead, after only a few steps, a blaze of light nearly blinded them. It came from a gate like a portcullis, barring the passage ahead.
        - id: ch05-b09
          speaker: gatekeeper
          text: Who are you?
        - id: ch05-b10
          speaker: youri
          text: I am Youri de Blanchelande. I have come to rescue Abeille des Clarides.
        - id: ch05-b11
          speaker: narrator
          text: >-
            The gate swung slowly open. As soon as the two men passed through, it closed behind them with a clang. Fear gripped Youri's heart when he heard it. Then the danger of his position gave him courage. There was no way back now.
        - id: ch05-b12
          speaker: narrator
          text: >-
            Ahead of him, a great army of gnomes stood ready for battle. Their arrows began to fall around Youri like a storm of hail. He raised his shield to turn them aside. As he did, his eyes found one little man standing on a rock above all the rest. A crown shone on the small figure's head, and a royal cloak hung from his shoulders. Youri recognized his deliverer at once. He flung away his shield and sprang forward, giving no thought to the arrows that still fell around him.
        - id: ch05-b13
          speaker: youri
          text: >-
            Can it truly be you, the king who set me free? Are these your people, and are they the ones keeping Abeille, whom I love, as their prisoner?
          emotion: surprised
        - id: ch05-b14
          speaker: king_loc
          text: >-
            I am King Loc. Abeille has lived among us for many years, and she was happy for most of them. You judge the gnomes too harshly. They are a just people, and they will never hold her here against her wishes.
        - id: ch05-b15
          speaker: king_loc
          text: Rug, please ask the princess to come before us.
        - id: ch05-b16
          speaker: narrator
          text: >-
            Silence filled the vast hall as Abeille entered. She looked around and saw only the host of gnomes perched along the walls and packed across the floor. Then she found Youri's eyes. With a cry from her heart, she ran to him and threw herself against his chest.
        - id: ch05-b17
          speaker: narrator
          text: King Loc watched them for a moment, pain showing in his face.
        - id: ch05-b18
          speaker: king_loc
          text: Abeille, is this the man you wish to marry?
        - id: ch05-b19
          speaker: abeille
          text: >-
            Yes, Little King Loc. It is Youri, and no one else. Look at me! I can laugh again. I am so happy!
          emotion: happy
        - id: ch05-b20
          speaker: narrator
          text: And as she said it, Abeille began to cry.
        - id: ch05-b21
          speaker: youri
          text: >-
            Hush, Abeille. There must be no tears today. Dry your eyes and thank King Loc. He is the one who freed me from the crystal cage in the Undines' kingdom.
          emotion: calm
        - id: ch05-b22
          speaker: narrator
          text: >-
            Abeille lifted her head. A great brightness came over her face as she finally understood what King Loc had done.
        - id: ch05-b23
          speaker: abeille
          text: You did that for me? Oh, Little King Loc...!
          emotion: surprised
        - id: ch05-b24
          speaker: narrator
          text: >-
            And so Abeille went home, loaded with presents from the gnomes and followed by the regrets of the friends she left behind. A few days later, she and Youri were married. Yet however happy she was in her new life, and however busy her days became, Abeille never forgot the little people who had cared for her. She never allowed a single month to pass without visiting her friends in the kingdom of the gnomes.
        - id: ch05-b25
          speaker: narrator
          text: >-
            This tale was adapted and shortened from Abeille, by M. Anatole France.
