        pace: 偏慢
        pitch: 低
  chapters:
    - id: ch01
      title: 湖边的失踪
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 离法国海岸两三英里的地方，风平浪静时，乘船的人只要俯身望进水底，就能看见很深很深的地方，许多大树的躯干仍然直立着。几百年前，那些树都长在一片辽阔的森林里，林中住满各式各样的野兽。森林外有一座美丽的城市，一座城堡守护着它，克拉里德历代公爵就住在那里。后来海水一步步逼近城市，慢慢掏空房屋的地基。房子接连坍塌，最终，闪亮的海水漫过整片土地。不过，那是这个故事之后很久的事。克拉里德的公爵世代住在百姓中间，无论战争还是和平时期，都会保护他们。故事开始时，罗贝尔公爵已经去世，年轻美丽的公爵夫人代他治理领地。人人都盼着她再嫁，她却拒绝所有求婚者。她说，自己只有一个灵魂，所以也只能有一个丈夫，何况年幼的女儿阿贝耶已经足以让她满足。
        - id: ch01-b02
          speaker: narrator
          text: 一天，公爵夫人坐在塔楼里，望着窗外铺满岩石的荒原。每到夏天，那里便会开遍紫色和黄色的花朵。她忽然看见一队骑手正向城堡奔来。队伍中央有一匹白马，马具是黑银两色，马上坐着她的好友布朗什朗德伯爵夫人。伯爵夫人和她一样，年纪轻轻便守了寡。她还有一个小男孩，名叫尤里，比阿贝耶大两岁。朋友突然来访，公爵夫人欢喜极了，连忙把她迎进塔楼。可是伯爵夫人在一堆软垫上坐下，握住她的手，开始说明来意。公爵夫人听着听着，刚才的喜悦便完全消失，泪水也从眼中落了下来。
        - id: ch01-b03
          speaker: countess
          text: 你知道，布朗什朗德家的伯爵夫人临死前，枕边总会出现一朵白玫瑰。昨晚我还格外欢喜，今早醒来，那朵玫瑰却贴着我的脸。世上只有你能帮我。请你收留尤里，让他做阿贝耶的哥哥，好吗？
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: 公爵夫人泪水盈眶，哽咽得无法回答，只能扑到朋友颈间，紧紧抱住她。两个女人默默告别。那位知道自己死期已到的伯爵夫人也没有多说什么，只是重新骑上马，踏上回家的路。到家后，她把仍在熟睡的儿子交给管家弗朗克尔照料，自己安静地躺到床上。第二天早晨，人们发现她已经去世，神情十分安详。公爵夫人忠实地守住诺言，把尤里接到城堡，同阿贝耶一起养大。她像母亲一样疼爱两个孩子。等他们长大一些，公爵夫人常常带他们巡视整个公国，让他们亲眼看看百姓怎样生活，也教他们同情那些遭受苦难的人，遇见需要帮助的人就伸出手。
        - id: ch01-b05
          speaker: narrator
          text: 一次出行中，尤里望见远山脚下有一大片东西闪闪发光。
        - id: ch01-b06
          speaker: youri
          text: 教母，那是什么？我猜是巨人的盾牌。
        - id: ch01-b07
          speaker: abeille
          text: 才不是呢，那是一只和月亮一样大的银盘子！
        - id: ch01-b08
          speaker: duchess
          text: 既不是盾牌，也不是银盘，那是一座美丽的湖。可是千万别走近。湖底住着水妖，她们会把过路人引去送死。
        - id: ch01-b09
          speaker: narrator
          text: 两个孩子把这番话牢牢记住了。回到城堡以后，阿贝耶发现塔门开着，便拉尤里登上塔顶。那里没有仙女，远方的湖却比以往更蓝、更迷人。
        - id: ch01-b10
          speaker: abeille
          text: 你看，我一定要到湖边去！
        - id: ch01-b11
          speaker: youri
          text: 不行！你忘了你母亲怎么说的吗？再说，湖那么远，我们怎么去？
        - id: ch01-b12
          speaker: abeille
          text: 这该由你来想。你是男子，又学了那么多东西，怎么反倒问我？算了，世上还有别的男子，我去问他们。
        - id: ch01-b13
          speaker: narrator
          text: 尤里脸红了。阿贝耶明明小他两岁，此刻却像比他大了许多。她嘲弄地望着他，直到他因为输给一个姑娘而恼火起来。
        - id: ch01-b14
          speaker: youri
          text: 好，我们两个一起去湖边。
        - id: ch01-b15
          speaker: narrator
          text: 第二天下午，两个孩子照常到花园玩。刚走到没人看见的地方，尤里便伸出手，叫阿贝耶出发。她瞪大眼睛，仿佛根本不知道他在说什么。真的瞒着所有人走那么远，可不像嘴上说说那么容易，何况她还穿着缎鞋。
        - id: ch01-b16
          speaker: youri
          text: 不管你觉得我多傻，我都要去，你也得跟我走。除非你怕了。要是害怕，我就自己去。
        - id: ch01-b17
          speaker: narrator
          text: 这句激将的话让阿贝耶再也忍不住了。她哭着搂住尤里，说他去哪里，自己就去哪里。两人就这样和好，悄悄离开花园。那天热得厉害，城里人都躲在屋里，等太阳落低以后才肯出门，所以没有谁看见他们。他们走过街道，从桥上过了河，又沿着上次陪公爵夫人走过的路，进入开满鲜花的草原。没过多久，阿贝耶便渴了，可太阳仿佛把水全喝光，一滴也没留下。两人继续赶路，幸好找到一棵结满熟樱桃的树。他们在树下歇脚，吃饱果子，又觉得浑身有了力气，几分钟后准能走到湖边。可是阿贝耶很快一瘸一拐起来，说脚疼。尤里替她解开鞋带，发现里面进了石子。取出石子以后，他们又唱又说，蹦跳着向前。后来她的鞋又掉了。阿贝耶转身去捡，无意间望见城堡尖塔。它们已经远得叫人心慌，她顿时哭了起来。
        - id: ch01-b18
          speaker: abeille
          text: 天都快黑了，狼会吃掉我们的！
          emotion: fearful
        - id: ch01-b19
          speaker: youri
          text: 湖已经很近了，别怕。吃晚饭以前，我们一定能回家。
        - id: ch01-b20
          speaker: narrator
          text: 湖果然就在前方。蓝色水面泛着银光，岸边开满紫色和金色的鸢尾，白睡莲安静地漂在水上。这里看不见一个人，也没有阿贝耶一路担心的巨兽，只有一些小小的分趾足印留在沙地里。她立刻脱下已经磨破的鞋袜，让清凉的湖水漫过双脚。尤里在附近找了一圈，既没有坚果，也不见草莓。他想起刚才走过的地方有一丛黑莓，便叫阿贝耶留在原处等候。等他摘回果子，两人就动身回家。女孩昏昏欲睡，把脑袋靠在柔软如垫子的苔藓上，含糊地应了一声。
        - id: ch01-b21
          speaker: narrator
          text: 阿贝耶很快睡着了。梦里，一只乌鸦驮着世上最矮小的男子，在她头顶停留片刻，又忽然消失。就在这时，尤里回来了。他把一片盛满草莓的大叶子放在女孩身旁，觉得现在叫醒她实在可惜，便独自走到银白色的柳树后面。那里可以望见整座湖。月光洒下来，薄雾像一层银纱，轻轻罩着水面，湖泊美得像一片仙境。尤里看着看着，那层银纱似乎渐渐裂开了。雾中浮现出许多美丽女子，她们留着绿色长发，向他伸出双手，一点点飘近。恐惧猛然攫住了尤里。他转身想逃，可已经迟了。
    - id: ch02
      title: 地精王国
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 阿贝耶全然不知道义兄遭遇了怎样可怕的命运。她仍旧沉沉睡着，一群白胡子拖到膝头的小矮人来到身旁，围成了一个圆圈，依旧没能惊醒她。
        - id: ch02-b02
          speaker: pic
          text: 我们该拿这个孩子怎么办？
        - id: ch02-b03
          speaker: rug
          text: 造一只笼子，把她关进去。
        - id: ch02-b04
          speaker: dig
          text: 不成！这样美丽的公主，怎么能关在笼子里？
        - id: ch02-b05
          speaker: narrator
          text: 最善良的塔德提议把她送回父母身边，其他地精却舍不得这个刚到手的新玩物，谁也不肯听。就在大家争论的时候，波压低声音提醒他们，女孩就要醒了。阿贝耶慢慢睁开眼睛。最初，她以为梦还没有结束。可是身边的小矮人既没有消失，也没有变样，仍然一动不动地围着她。她这才突然明白，他们全都是真的，慌忙站起身来。
        - id: ch02-b06
          speaker: pau
          text: 大家快看，她醒过来了。
        - id: ch02-b07
          speaker: abeille
          text: 尤里！尤里！你在哪里？
          emotion: fearful
        - id: ch02-b08
          speaker: narrator
          text: 地精们围得更紧，阿贝耶害怕得蒙住脸。塔德爬上柳枝，轻轻摸她的手指。她看出对方没有恶意，便放下双手，大胆打量众人。
        - id: ch02-b09
          speaker: abeille
          text: 小矮人们，你们长得这么难看，真是太可惜了。不过，只要给我吃点东西，我还是会喜欢你们的。我就要饿死啦。
        - id: ch02-b10
          speaker: narrator
          text: 她的话在人群里激起一阵骚动。有些地精因为被说成难看，气得主张把她留在原地，让她自己承受命运。另一些地精却哈哈大笑，觉得一个凡人怎么看他们，根本无关紧要。塔德没有加入争吵，只叫传信使波去取牛奶、蜂蜜，还有地底烤炉做出的最精细的白面包。阿贝耶系一根鞋带的工夫还没过，波已经骑着乌鸦赶回来了。食物送到面前，她立刻大口吃起来。等她吃完蜂蜜面包，又喝光牛奶，心里的恐惧已经消失，很愿意同这些小矮人说话。她笑着道谢，告诉大家自己和尤里的名字，又请他们帮忙寻找哥哥，指给她回城堡的路。母亲发现两个孩子都不见了，一定以为他们遭遇了可怕的事情。阿贝耶一想到这里，就更加急着回去。
        - id: ch02-b11
          speaker: dig
          text: 你的脚伤得这么重，已经走不了。我们也不能越过边界，进入你们的国家。我们只能扎一副担架，抬你进山去见国王。
        - id: ch02-b12
          speaker: narrator
          text: 许多小姑娘听说要被独自带到陌生地方，也许早就吓坏了。阿贝耶最初的恐惧一过去，却觉得这场奇遇很有意思。她想着，回去以后一定有许多事能讲给母亲和尤里听。就算他们活到一百岁，大概也不会走进大山里面。于是，她舒舒服服地蜷在苔藓铺成的小窝里，等着看会发生什么。地精抬着她不停向山上走。走了很久，阿贝耶又睡着了，直到太阳照下来才醒。他们还在继续向上。小矮人平时步子很慢，跳过岩石时却比任何凡人都快。忽然，穿过担架枝条的光线发生了变化。光并没有暗多少，却和先前完全不同。地精们这才放下担架，围上来扶她走出去。
        - id: ch02-b13
          speaker: narrator
          text: 阿贝耶站稳以后，看见面前的小人还不到自己一半高，却衣着华美，威严十足。他头上戴着一顶王冠，上面镶着无比巨大的钻石，叫人忍不住怀疑，那副小小的身躯怎么承受得了这样的重量。一件庄严的王袍从他的肩头垂下，他手中还握着一支长矛。森林地精们见到他，全都恭敬地站好，等候首领禀报。
        - id: ch02-b14
          speaker: forest_gnome
          text: 洛克国王，我们在湖边发现这个孩子。她叫阿贝耶，母亲是克拉里德公爵夫人。
        - id: ch02-b15
          speaker: king_loc
          text: 你们做得很好。她从今以后就是我们中的一员。阿贝耶，我们都会照顾你，让你快活。你想要什么，马上就能得到。
        - id: ch02-b16
          speaker: abeille
          text: 我想要一双鞋。
        - id: ch02-b17
          speaker: king_loc
          text: 拿鞋来！
        - id: ch02-b18
          speaker: narrator
          text: 一个地精立刻替她穿上绣满珍珠的银鞋。阿贝耶承认鞋很漂亮，却问它能不能带自己回到母亲身边。国王说，这双鞋只能走山中平坦的小路，他们还有许多奇观要带她看。
        - id: ch02-b19
          speaker: abeille
          text: 洛克小王，那就收回银鞋，给我一双木鞋吧。请让我回到母亲那里。
        - id: ch02-b20
          speaker: narrator
          text: 国王只是摇头。阿贝耶声音发颤，答应回家后会全心爱他，几乎像爱母亲和尤里一样。洛克小王立刻问，尤里是谁。
        - id: ch02-b21
          speaker: abeille
          text: 尤里从我还是婴儿时起，就一直住在我们家。人人都知道他呀。
        - id: ch02-b22
          speaker: narrator
          text: 阿贝耶很惊讶，人人都知道尤里，洛克小王怎么会从没听说过。她更想不到，一说出这个名字，自己的命运便被决定了。洛克小王早已在心中盘算，再过几年，这个美丽的女孩正好可以做他的妻子。他决不愿让尤里挡在自己和阿贝耶之间。国王想到这里，沉默着不肯回答。阿贝耶看出他不高兴，泪水一下涌了出来。她抓住王袍的一角，求洛克小王想想自己的母亲会多么悲痛。母亲一定以为她被野兽吞吃了，或者已经淹死在湖里。
        - id: ch02-b23
          speaker: king_loc
          text: 别难过。我会送给她一个梦，让她知道你平安无事。
          emotion: calm
        - id: ch02-b24
          speaker: abeille
          text: 洛克小王，你真聪明！可是每晚都要让她梦见我，也要让我梦见她。这样我们就能彼此看见了。
          emotion: happy
        - id: ch02-b25
          speaker: narrator
          text: 洛克小王答应了。阿贝耶渐渐习惯没有母亲和尤里的生活，在新家也过得相当快活。地精们个个对她亲切，把她宠在心上，这里还有数不清的新鲜事物等着她去看。地精永远忙忙碌碌，制作玩具的手艺和地面上的工匠一样好，有时甚至更加精巧。阿贝耶偶尔会跟着塔德或迪格，在曲折的地下通道里散步。走到某些地方，她能从岩石裂隙中瞥见一小片蓝天。在所有奇观里，她最爱看的还是这一小片天空。日子就这样流逝，转眼过去了六年。
    - id: ch03
      title: 阿贝耶的心愿
      blocks:
        - id: ch03-b01
          speaker: tad
          text: 洛克国王殿下请您到觐见厅相见。
        - id: ch03-b02
          speaker: narrator
          text: 阿贝耶不明白国王为何突然这样讲究礼数，还是放下手中的金竖琴，顺从地去了。她刚一出现，洛克小王便打开墙上的一道门，第一次领她进入自己的宝库。眼前的景象叫阿贝耶惊叹不已。黄金、珠宝、锦缎和地毯沿墙堆放，每一件都闪烁着光芒。她在大厅中慢慢走动，一件接一件地细看。洛克小王则坐上另一端的黄金象牙宝座，始终注视着她，最后请她任意挑选。墙上挂着一串极美的珍珠项链。阿贝耶在项链和一顶镶满钻石、蓝宝石的小冠之间犹豫片刻，伸手正要去拿，目光却忽然越过宝物，看见岩缝中露出一小片天空。她的手立刻垂了下来。
        - id: ch03-b03
          speaker: abeille
          text: 洛克小王，我什么都不要。让我再到地面上去一次吧。
        - id: ch03-b04
          speaker: narrator
          text: 司库又打开一箱比人间君王所有珠宝都更耀眼的宝石。阿贝耶仍旧摇头。
        - id: ch03-b05
          speaker: abeille
          text: 克拉里德花园里的一滴露水，也比这些钻石明亮。这里最蓝的宝石，也没有尤里的眼睛那样蓝。
        - id: ch03-b06
          speaker: narrator
          text: 这句话像尖刺一样扎进洛克小王心里。他一时什么也说不出来，只能抬起头，静静望着阿贝耶。过了一会儿，他告诉她，只有真正轻视财富的人才配拥有财富。随后，他把那顶王冠交给阿贝耶，当众宣布，从今以后，她就是地精公主。为了庆祝新公主加冕，整个地下王国一连三十天没有人做工，日日举办盛宴。庆典终于结束时，洛克小王换上自己最华美的礼服，郑重地来到阿贝耶面前，请求她做自己的妻子。
        - id: ch03-b07
          speaker: abeille
          text: 洛克小王，我爱你现在的样子，因为你善良，又一直待我很好。可是，我永远不能用另一种方式来爱你。
        - id: ch03-b08
          speaker: narrator
          text: 国王早已料到这个回答，仍旧十分失望。他竭力藏起痛苦，勉强露出微笑。
        - id: ch03-b09
          speaker: king_loc
          text: 那么，请你答应我一件事。将来如果你发现自己爱上了谁，一定要告诉我。
        - id: ch03-b10
          speaker: abeille
          text: 我答应你。
        - id: ch03-b11
          speaker: narrator
          text: 阿贝耶从此不再是那个整天同小地精玩耍的快乐孩子。大家依然像从前一样疼爱她，可洛克小王的话已经唤醒了她心中的思念。地下的人长得比地面上的人快，十三岁的阿贝耶已经成了一位女子。她常常独自坐上许久，原本圆润红亮的脸庞日渐清瘦苍白。地精们使出各种办法，引她重玩从前喜爱的游戏，可那些游戏已经不能让她开心。就连她曾经爱不释手的金竖琴，也被冷落在地上。一天早晨，阿贝耶忽然像是下定了决心。她离开挂满美丽丝绸的房间，来到国王面前，牵起他的手。两人走过一条又一条长廊，最后停在一处能望见一线蓝天的地方。
        - id: ch03-b12
          speaker: abeille
          text: 洛克小王，让我再见母亲一面吧。不然，我真的会死。
          emotion: sad
        - id: ch03-b13
          speaker: narrator
          text: 阿贝耶说话时声音发颤，浑身也在颤抖。就连仇敌见了她，也会心生怜悯。国王深爱着她，却什么也没有回答。阿贝耶整天守在那里，看着明亮的天光一点点退去，那一线蓝天也越来越苍白。后来星星出现了，她仍旧留在原处，一步也没有挪动。忽然，有一只手轻轻碰了碰她。阿贝耶吃惊地回头，只见洛克小王站在身后。他从头到脚裹着一件黑色斗篷，手臂上还搭着另一件，只叫她穿好衣服跟自己走。国王没有解释要去哪里，阿贝耶却立刻知道，自己就要见到母亲了。
        - id: ch03-b14
          speaker: narrator
          text: 他们不断向前，走过一条又一条阿贝耶从未来过的通道，终于重新回到地面上的世界。眼前的一切都显得那么美丽。空气清新得像能洗净胸膛，花朵送来的香气又清甜又温柔。阿贝耶离开地面太久了，这一刻欢喜得几乎承受不住。就在这时，洛克小王把她抱离地面。尽管他身形矮小，抱着阿贝耶却毫不费力。他就这样走过花园，穿过一扇敞开的门，进入寂静无声的城堡。
        - id: ch03-b15
          speaker: king_loc
          text: 今晚，你母亲看见的不再是梦里的影像，而是真正的你。可是记住，你不能碰她，也不能开口。否则我的法力会消失，她以后再也见不到你，连梦中的影像也见不到。
        - id: ch03-b16
          speaker: narrator
          text: 他们终于来到阿贝耶无比熟悉的房间。洛克小王抱她跨过门槛时，她的心跳得又快又重。床头悬着一盏灯，借着灯光，她看见母亲依旧美丽，脸色却已经变得苍白而悲伤。公爵夫人凝望着女儿，那份悲伤便慢慢消失，脸上露出明亮的笑容。她伸出双臂，仿佛要把孩子搂进怀里。阿贝耶眼中盛满喜悦的泪水，不由自主地俯身迎过去。就在母女快要碰到彼此时，洛克小王赶紧把她抱紧，迅速带回地下。国王原以为满足这个愿望能使她快活，却很快发现自己错了。此后阿贝耶整日坐着哭泣，朋友们轮番安慰，她也听不进去。
        - id: ch03-b17
          speaker: king_loc
          text: 告诉我，究竟是什么让你这样难过？
        - id: ch03-b18
          speaker: abeille
          text: 你和这里的朋友都待我很好，我知道我难过时，你们也不好受。我也想快活，可做不到。我哭，是因为再也见不到我全心爱着的尤里。失去他，比离开母亲更痛苦。母亲在哪里、过着怎样的日子，我都知道。尤里却不一样，我连他是死是活都不知道。
          emotion: sad
    - id: ch04
      title: 两个囚徒重返人间
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 听完阿贝耶的话，地精们全都沉默了。他们虽然善良，却并非凡人，从来没有感受过巨大的喜悦，也没有经历过这样深切的悲伤。只有洛克小王依稀懂得这两种感情。他独自离开众人，走到山腹最深的地方，去拜访一位极其年迈的地精。老人名叫努尔，收藏着各式各样的眼镜。有些眼镜能让他看见地面上正在发生的事，另一些甚至能穿透海水，望见海底的一切。努尔为了寻找尤里，一副接一副地试戴。换了许多次以后，他终于从镜片里看见那个年轻人。
        - id: ch04-b02
          speaker: nur
          text: 找到了！他被关在大湖底下的水妖宫殿里。他不喜欢那座牢狱，一心想回到世间建功立业。
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: 七年过去，尤里也已长大。他越来越厌烦绿发女子的娇宠，终于有一天，扑倒在水妖女王脚下，请求回家。女王俯身抚摸他的头发。
        - id: ch04-b04
          speaker: undine_queen
          text: 我们舍不得你。留下吧，你可以做国王，还可以娶我。
        - id: ch04-b05
          speaker: youri
          text: 可我只想娶阿贝耶。
        - id: ch04-b06
          speaker: narrator
          text: 尤里的回答完全不起作用，如同说给风听。水妖女王一再挽留，他仍然不肯改变心意。最后，女王终于动怒，下令把他关起来。水妖选中一块尖利的岩石，围着它建起透明的水晶牢笼，尤里就被困在中央。洛克小王借助努尔的眼镜找到这里时，已经在路上跋涉了好几个星期。地精本来就走得很慢，从地下王国通往湖底的路又遥远又艰险。幸好出发以前，洛克小王带上了自己的魔法戒指。他走到牢笼前，让戒指轻轻碰上水晶墙。只听一声脆响，坚硬的牢笼从顶端一直裂到底部，顿时分成两半。
        - id: ch04-b07
          speaker: king_loc
          text: 沿这条路走，你就能回到人间。
        - id: ch04-b08
          speaker: narrator
          text: 洛克小王替尤里指明一条道路，告诉他沿路走下去，便能重新回到人间。说完以后，他甚至没有留下来听年轻人道谢，立刻转身，踏上漫长的归途。走出一段路，他遇见骑着乌鸦赶来迎接的波。洛克小王当即叫住传信使，命他用最快的速度飞回地下王宫，禀告阿贝耶公主，被关在水妖王国整整七年的尤里·德·布朗什朗德已经获得自由，如今正沿着道路返回克拉里德城堡。
        - id: ch04-b09
          speaker: narrator
          text: 尤里走出山中，第一个遇见的是从小替他缝衣服的老裁缝。失踪多年的小主人突然出现，老人喜得几乎发狂。尤里急忙向他打听义母和阿贝耶。
        - id: ch04-b10
          speaker: tailor
          text: 大人，您这些年究竟去了哪里？就在您失踪那天，阿贝耶公主也被地精带走了，至少大家都这样猜。那一天让公爵夫人受尽折磨。幸好她每晚都会做梦，梦会告诉她女儿正在做什么，所以她始终相信公主还活着。
        - id: ch04-b11
          speaker: narrator
          text: 老裁缝接着讲起七年来村里发生的种种变化，尤里却满心想着阿贝耶，一个字也没听见。过了好一阵，他才回过神来，又为自己的耽搁感到惭愧，立刻赶去见公爵夫人。她把尤里紧紧抱在怀里，仿佛一松手，他便会再次消失。等她的情绪渐渐平静，尤里连忙追问阿贝耶的下落，还问怎样才能把她从地精手中救出来。公爵夫人告诉他，两个孩子失踪以后，她马上派人向各处搜寻。其中一个人在遥远的山上看见一队小矮人，显然正抬着一副担架。那人匆忙追赶，忽然在脚边发现一只小小的缎鞋。他刚弯腰去捡，十几个地精就像苍蝇般扑到身上，对着他的脑袋乱打。那人疼得头晕目眩，只得丢下鞋子。地精抢回缎鞋，等他终于恢复神志，山上的队伍早已无影无踪。
        - id: ch04-b12
          speaker: narrator
          text: 当晚，等城堡里所有人都睡熟，尤里和老仆人弗朗克尔悄悄进入武器库。他们各自穿好一套轻便而完整的锁子甲，戴上头盔，佩好短剑，又走进森林，骑上弗朗克尔事先拴在那里的两匹马。两人纵马疾驰一个钟头，来到一座洞窟前。弗朗克尔从小便听说，这个洞口一直通往大地中心。他们下马以后，小心地走了进去，本以为洞里会和外面的黑夜一样漆黑。可才走几步，一阵突如其来的强光便刺得两人几乎睁不开眼。光芒来自前方一道闸门般的大门，那扇门横在路上，不许他们再向前一步。
        - id: ch04-b13
          speaker: gate_voice
          text: 你们是什么人？
        - id: ch04-b14
          speaker: youri
          text: 我是尤里·德·布朗什朗德，来营救克拉里德家的阿贝耶。
        - id: ch04-b15
          speaker: narrator
          text: 尤里报出姓名和来意，大门便缓缓打开。等两个陌生人走进去，它又在他们身后轰然合拢。尤里听见那声巨响，心中猛地掠过一阵恐惧。可眼下身后已经无路，危险的处境反倒逼出了他的勇气。前方整整齐齐列着一支庞大的地精军队，数不清的箭像冰雹般落在他周围。他立刻举起盾牌抵挡。就在盾牌抬起的一刻，尤里忽然看见一个小人站在高过众人的岩石上。那人头戴王冠，肩披王袍。尤里认出了自己的救命恩人，立刻丢开盾牌，不顾箭雨还在身旁纷纷落下，径直朝那块岩石冲去。
        - id: ch04-b16
          speaker: youri
          text: 是你吗？真的是救我出来的那个人吗？可是，把我心爱的阿贝耶囚禁起来的，也是你的臣民？
          emotion: surprised
        - id: ch04-b17
          speaker: king_loc
          text: 我就是洛克国王。阿贝耶在这里住了许多年，其中大部分日子，她都很幸福。你轻视地精，可我们是公正的民族，不会违背她的心愿强留她。拉格，请公主到这里来。
    - id: ch05
      title: 重逢
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 拉格奉命去请公主，四周静得没有一点声音。阿贝耶走进这片宽阔的地方，停下来向四面张望。起初，她只看见无数地精。有的栖身墙头，有的挤满大厅地面，密密麻麻，到处都是。接着，她的目光越过人群，和尤里的目光碰在一起。阿贝耶从心底发出一声呼喊，不顾一切地飞奔过去，扑进他的怀中。洛克小王默默看了他们片刻，脸上浮现出无法掩饰的痛苦，随后才开口询问。
        - id: ch05-b02
          speaker: king_loc
          text: 阿贝耶，这就是你想嫁的人吗？
          emotion: sad
        - id: ch05-b03
          speaker: abeille
          text: 是他，洛克小王，除了他再没有别人！你看，我终于会笑了，我现在多么幸福！
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: 她这样说着，却流下眼泪。尤里轻轻抚摸她的头发。
        - id: ch05-b05
          speaker: youri
          text: 阿贝耶，今天不该流泪。擦干眼睛，好好谢谢洛克小王。是他把我从水妖王国的牢笼里救出来的。
          emotion: calm
        - id: ch05-b06
          speaker: narrator
          text: 阿贝耶抬起头，脸上骤然焕发光彩。她终于全明白了。
        - id: ch05-b07
          speaker: abeille
          text: 你是为了我才去救他的吗？啊，洛克小王……
          emotion: surprised
        - id: ch05-b08
          speaker: narrator
          text: 洛克小王没有再拦住他们。地精们取来许多礼物，装得满满当当，又依依不舍地送阿贝耶踏上归途。她终于回到母亲身边，也终于能和尤里长久相伴。几天以后，两人举行了婚礼。阿贝耶从此过得十分幸福，可她从来没有忘记地下王国的朋友。无论生活多么忙碌，也无论手边有多少事情，每个月她都一定会回去探望他们，一次也没有间断。这个故事改编并节选自阿纳托尔·法朗士的《阿贝耶》。
