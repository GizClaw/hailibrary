audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 从容淘气，打趣时眼里带笑
        timbre: 圆润略低沉
        pace: 从容偏慢
        pitch: 中低音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 见多识广，直率中带着固执
        timbre: 粗粝厚实
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十六章　吉米臭鼬大吃一惊
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 吉米臭鼬沿着弯弯小径，不慌不忙地下山。要知道，他根本不赞成急急忙忙。只有看见一只肥甲虫眼看就要藏得无影无踪，他才会真正快上一回。可这会儿，吉米虽然一路都在找，却连一只肥甲虫也没看见。他自然慢慢走着，好像天底下所有时间都是他的。事实上，他也确实有的是时间。
        - id: ch01-b02
          speaker: narrator
          text: 吉米的心情好得不得了。他当然有理由高兴，身边的每一样东西都叫他高兴。夏天来了，而且打定主意要留下。四周到处是欢快的声音，大黄蜂还在嗡嗡地唱歌。最叫他开心的是，吉米这天早晨已经找到了三只甲虫。他知道，只要继续找，准能找到更多。这么好的日子，怎么能不高兴呢？
        - id: ch01-b03
          speaker: narrator
          text: 从前，吉米还笑过兔子彼得，说他盼夏天盼得太着急。如今夏天真的来了，吉米其实和彼得一样开心。不过就算全世界的人都来问，他也绝不会承认。一路上，他那双锐利的小眼睛亮晶晶的，周围很少有什么能逃过它们。附近没有别人能听见，吉米便边走边自言自语。他说的正是下面这些话。
        - id: ch01-b04
          speaker: jimmy_skunk
          text: 甲虫甲虫，光溜溜，说到底呀一只虫。虫儿生来给臭鼬吃，快从藏处钻出来。
        - id: ch01-b05
          speaker: jimmy_skunk
          text: 嘿，你瞧那边那块大树皮！底下怎么也该藏着十来只肥甲虫吧。把树皮掀开，看它们一股脑儿往四处乱跑，最好玩了。我一定得看看这下面究竟有什么。
        - id: ch01-b06
          speaker: narrator
          text: 吉米踮着脚，轻轻走到那块大树皮跟前。他站在那里，做好了把树皮翻过来的准备。就在动手之前，他又念起那首傻乎乎的小诗。
        - id: ch01-b07
          speaker: jimmy_skunk
          text: 甲虫甲虫，光溜溜，说到底呀一只虫。
        - id: ch01-b08
          speaker: narrator
          text: 最后一个“虫”字才说完，吉米猛地掀开了树皮。
        - id: ch01-b09
          speaker: old_mr_toad
          text: 你说谁是虫？
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 一个古怪的声音冒了出来，听着很不高兴。吉米吓得差点儿仰面摔倒，足足愣了一阵，连一句话也找不出来。他原以为树皮下面准有肥甲虫，可那里坐着的偏偏是老蟾蜍先生。瞧老先生的脸色，他可一点儿也不快活。
        - id: ch01-b11
          speaker: old_mr_toad
          text: 我再问一遍，你说谁是虫？
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: 吉米没有答话，反而笑了。老蟾蜍先生的火气更大了。
        - id: ch01-b13
          speaker: old_mr_toad
          text: 到底谁是虫？
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: 这下，吉米总算想起了礼貌。
        - id: ch01-b15
          speaker: jimmy_skunk
          text: 这里没有虫，蟾蜍先生，真对不起。我刚才以为树皮下面有虫，没想到您在这里。请您别见怪。对了，您今天早晨见过肥甲虫吗？
        - id: ch01-b16
          speaker: old_mr_toad
          text: 没见过。
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: 老蟾蜍先生没好气地说完，打了个大哈欠，又揉了揉眼睛。
        - id: ch01-b18
          speaker: jimmy_skunk
          text: 咦，蟾蜍先生，您该不会才刚睡醒吧！
          emotion: surprised
        - id: ch01-b19
          speaker: old_mr_toad
          text: 我刚睡醒，又有什么关系？
          emotion: angry
        - id: ch01-b20
          speaker: jimmy_skunk
          text: 没关系，当然没关系。只是今天早晨我遇见的人里，您已经是第二个刚睡醒的了。
        - id: ch01-b21
          speaker: old_mr_toad
          text: 那第一个是谁？
        - id: ch01-b22
          speaker: jimmy_skunk
          text: 黑蛇先生。他还问我您在哪里呢。
        - id: ch01-b23
          speaker: narrator
          text: 老蟾蜍先生的脸一下子变得煞白。
        - id: ch01-b24
          speaker: old_mr_toad
          text: 我……我看，我还是赶快走吧。
          emotion: fearful
