audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, curious, and gently teasing
        timbre: mellow and bright
        pace: relaxed
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: Jimmy Skunk Is Surprised
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jimmy Skunk ambled down the hill along the Crooked Little Path. Jimmy did not believe in hurrying. The only time he ever hurried was when he saw a fat beetle trying to slip out of sight. Then he could move quickly enough. Just now he was watching for beetles, but he saw none, so he strolled as though he had all the time in the world. And really, he did.
        - id: ch01-b02
          speaker: narrator
          text: Jimmy felt especially good-natured, and he had every reason to feel that way. Summer had come to stay. Glad voices sounded on every side, and Bumble the Bee hummed a song. Best of all, Jimmy had already found three beetles that morning. He knew there were more if only he could find them. With a morning like that, how could he help feeling good?
        - id: ch01-b03
          speaker: narrator
          text: Jimmy had laughed at Peter Rabbit for being so anxious for Summer to arrive. Still, he was every bit as glad as Peter that she had come. He would not have admitted that for anything in the world. His sharp little eyes twinkled as he walked, and they missed very little. With no one nearby to hear, he talked quite happily to himself.
        - id: ch01-b04
          speaker: jimmy_skunk
          text: Beetle, beetle, smooth and smug, you are nothing but a bug. Bugs were made for Skunks to eat, so come out from your retreat.
        - id: ch01-b05
          speaker: jimmy_skunk
          text: Hello! Look at that big piece of bark over there. It looks as though there ought to be a dozen fat beetles underneath. It's great fun to turn bark over and watch the beetles run every way at once. I simply have to see what's hiding under this piece.
        - id: ch01-b06
          speaker: narrator
          text: Jimmy went softly over to the big piece of bark on tiptoe. He paused there and got ready to turn it over. Then, while he imagined all those fat beetles underneath, he began his foolish little verse again.
        - id: ch01-b07
          speaker: jimmy_skunk
          text: Beetle, beetle, smooth and smug, you are nothing but a bug.
        - id: ch01-b08
          speaker: narrator
          text: The moment he said "bug," Jimmy pulled the bark over.
        - id: ch01-b09
          speaker: old_mr_toad
          text: Who are you calling a bug?
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: The funny voice sounded rather cross. Jimmy nearly tumbled backward in surprise, and for a full minute he could not find his tongue. He had been so sure there would be fat beetles. Instead, there sat Old Mr. Toad, looking very displeased.
        - id: ch01-b11
          speaker: old_mr_toad
          text: Well? Who are you calling a bug?
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: Jimmy answered by laughing. That only made Mr. Toad crosser. At last, Jimmy remembered his manners.
        - id: ch01-b13
          speaker: old_mr_toad
          text: I asked you who the bug is!
          emotion: angry
        - id: ch01-b14
          speaker: jimmy_skunk
          text: There isn't a bug, Mr. Toad. Please forgive me. I thought one was under the bark because I didn't know you were there. I hope you'll excuse me. Have you seen any fat beetles this morning?
        - id: ch01-b15
          speaker: old_mr_toad
          text: No, I haven't.
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: Mr. Toad yawned and rubbed his eyes.
        - id: ch01-b17
          speaker: jimmy_skunk
          text: Why, Mr. Toad, I think you just woke up!
          emotion: surprised
        - id: ch01-b18
          speaker: old_mr_toad
          text: And what if I did?
          emotion: angry
        - id: ch01-b19
          speaker: jimmy_skunk
          text: Oh, nothing at all. It's only that you're the second person I've met this morning who had just woken up.
        - id: ch01-b20
          speaker: old_mr_toad
          text: Who was the first one?
        - id: ch01-b21
          speaker: jimmy_skunk
          text: Mr. Blacksnake. He asked me where you were.
        - id: ch01-b22
          speaker: narrator
          text: Old Mr. Toad turned quite pale.
        - id: ch01-b23
          speaker: old_mr_toad
          text: I... I think I'd better be moving along.
          emotion: fearful
