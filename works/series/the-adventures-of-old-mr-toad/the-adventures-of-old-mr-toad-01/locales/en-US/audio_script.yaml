audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, curious, and gently teasing
        timbre: mellow and bright
        pace: relaxed
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: Jimmy Skunk Is Puzzled
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mother West Wind had just swept down from the Purple Hills. She opened the big bag she had been carrying and let out her children, the Merry Little Breezes. They were lively and merry, and oh, how glad they were to be back! They danced and raced in every direction across the Green Meadows.
        - id: ch01-b02
          speaker: narrator
          text: Old Mother West Wind watched them for a few minutes and almost sighed. She wanted to join their fun. Spring always made her feel young, wild, carefree, and happy. But there was work waiting. She had to turn the windmill that pumped water for Farmer Brown's cows, and many more idle mills needed her too. So she puffed out her cheeks and went about her business.
        - id: ch01-b03
          speaker: narrator
          text: Jimmy Skunk sat at the very top of the hill overlooking the Green Meadows. He watched Old Mother West Wind until she disappeared. Then he ambled down the Lone Little Path to hunt for beetles. Jimmy never hurries, so he was taking his usual lazy pace when he heard someone puffing and blowing behind him.
        - id: ch01-b04
          speaker: narrator
          text: Jimmy turned around. To his great surprise, there was Old Mr. Toad. Yes, it truly was Old Mr. Toad, and he was in a tremendous hurry. He was short of breath, but he kept hopping with such determination that he plainly meant to get somewhere as fast as he could.
        - id: ch01-b05
          speaker: narrator
          text: Now, seeing Mr. Toad hurry was unusual. It was very unusual indeed. Most days he took a few hops, sat down, and thought things over before moving again. Jimmy had never seen him go farther without stopping unless he was escaping danger, perhaps Mr. Blacksnake. That was the first thing Jimmy thought of.
        - id: ch01-b06
          speaker: narrator
          text: Jimmy searched all around, but there was no sign of Mr. Blacksnake or any other danger. Then he studied Mr. Toad very closely. He could see at once that the old fellow was not frightened at all. Mr. Toad only looked determined, as though something important was on his mind.
        - id: ch01-b07
          speaker: jimmy_skunk
          text: Well, now! What got into those long back legs and made them move so fast?
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: Mr. Toad said nothing. He simply tried to squeeze past and continue on his way. Jimmy reached out one hand and rolled him onto his back. There Mr. Toad kicked and struggled, trying to stand up again, and he looked very ridiculous.
        - id: ch01-b09
          speaker: jimmy_skunk
          text: When someone speaks to you, you're supposed to answer. Don't you know that's polite?
        - id: ch01-b10
          speaker: narrator
          text: Jimmy sounded stern, though his eyes were twinkling.
        - id: ch01-b11
          speaker: old_mr_toad
          text: I... I beg your pardon. I couldn't spare the breath. You see, I'm in a terrible hurry.
        - id: ch01-b12
          speaker: narrator
          text: Mr. Toad panted out every word.
        - id: ch01-b13
          speaker: jimmy_skunk
          text: Oh, I can see that. But rushing like this can't be healthy. So tell me, what makes you hurry? There's nothing here to run from.
        - id: ch01-b14
          speaker: old_mr_toad
          text: I'm not running from anything! I have business at the Smiling Pool, and I'm already late.
          emotion: angry
        - id: ch01-b15
          speaker: jimmy_skunk
          text: Business? What kind of business could you have at the Smiling Pool?
          emotion: surprised
        - id: ch01-b16
          speaker: narrator
          text: Jimmy could hardly believe what he had heard.
        - id: ch01-b17
          speaker: old_mr_toad
          text: That's my affair. But since you truly want to know, I'll tell you. I have a very important part in the spring chorus. I'm going to the pool to sing, and I have a beautiful voice.
        - id: ch01-b18
          speaker: narrator
          text: That was more than Jimmy Skunk could bear. Down he flopped, rolling over and over with laughter. Mr. Toad was so plain and almost ugly-looking. How could he possibly think he had a beautiful voice?
        - id: ch01-b19
          speaker: jimmy_skunk
          text: Ha, ha, ha! Ho, ho, ho!
          emotion: happy
        - id: ch01-b20
          speaker: narrator
          text: At last Jimmy had no laughter left. When he looked again, Old Mr. Toad was already on his way. Hop, hop, hipperty-hop. Hop, hop, hipperty-hop. Jimmy watched him go, and he had to admit that he was puzzled.
