audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 从容淘气，打趣时眼里带笑
        timbre: 圆润略低沉
        pace: 从容偏慢
        pitch: 中低音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 见多识广，直率中带着固执
        timbre: 粗粝厚实
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第一章　臭鼬吉米想不明白
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老西风妈妈刚从紫山下来，就打开大口袋，把一路装在里面的快乐小微风全放了出来。小家伙们终于又回到绿草地，一个个快活得不得了。它们四处奔跑，跳着舞，你追我赶。老西风妈妈看了它们好一会儿，几乎叹起气来。她真想也跑过去，加入孩子们。春天总叫她觉得自己又年轻了，莽莽撞撞，什么也不用操心，满心只剩下快活。可她还有许多活儿。农夫布朗家的奶牛等着喝水，她得先推动风车，把水抽上来。这还只是其中一架。别处还有好多风车停着不动，都在等她呢。于是，她鼓起两边脸颊，忙自己的事去了。
        - id: ch01-b02
          speaker: narrator
          text: 臭鼬吉米坐在山顶，从那里正好能俯瞰绿草地。他目送老西风妈妈走远。等她再也看不见了，吉米才沿着孤独小径慢悠悠地下山，打算找几只甲虫吃。你知道，他从来不肯着急。可走着走着，身后忽然传来呼哧呼哧的喘气声。吉米当然要回头瞧瞧是谁。这一瞧，他可吃惊了。来的竟然是老蟾蜍先生！没错，就是那位老蟾蜍先生。老先生气都快喘不上来了，还是一跳接一跳，半点儿不肯停。他那股坚决的劲头，一看就是急着赶去什么地方。
        - id: ch01-b03
          speaker: narrator
          text: 老蟾蜍先生居然会赶路，这可太少见了，实在少见得很。平常，他跳上几步，总要坐下来好好想一想。只有遇到危险，他才会多跳几步。比方说，身后有黑蛇先生追着。于是吉米赶紧四下张望。可别说黑蛇先生，附近连一点儿危险的影子也没有。他再仔细看看老蟾蜍先生。老先生脸上没有半点害怕，只显得非常坚定，心里像是正惦记着一件大事。
        - id: ch01-b04
          speaker: jimmy_skunk
          text: 哎呀，你那两条长后腿今天怎么啦？是什么让它们动得这么快？
        - id: ch01-b05
          speaker: narrator
          text: 老蟾蜍先生一个字也没答，只想绕过吉米继续赶路。吉米伸出一只手，一下就把他弄得四脚朝天。老先生躺在地上又踢又挣，怎么也站不起来，那模样滑稽极了。
        - id: ch01-b06
          speaker: jimmy_skunk
          text: 人家问你话，你连一声也不答，这样可不礼貌。难道你不知道吗？
        - id: ch01-b07
          speaker: narrator
          text: 吉米故意板着脸，眼睛里却明明闪着笑。老蟾蜍先生还在喘个不停，好不容易才挤出话来。
        - id: ch01-b08
          speaker: old_mr_toad
          text: 请——请原谅。我喘气都来不及，实在没气力说话。你也看见了，我正急着赶路。
        - id: ch01-b09
          speaker: jimmy_skunk
          text: 这个我当然看得见。可这么赶路对身体不好。你究竟为什么这么急？我又没瞧见谁在后面追你。
        - id: ch01-b10
          speaker: old_mr_toad
          text: 谁说我在逃跑？我得去微笑池办事，而且已经迟到了。
          emotion: angry
        - id: ch01-b11
          speaker: jimmy_skunk
          text: 办事？你到微笑池去，能办什么事？
          emotion: surprised
        - id: ch01-b12
          speaker: old_mr_toad
          text: 那是我自己的事。不过，你要是真想知道，我就告诉你。春日大合唱里，我担着非常重要的一份。我得赶到微笑池去唱歌。我的嗓音可美妙了。
        - id: ch01-b13
          speaker: narrator
          text: 这句话可把吉米逗坏了。他往地上一躺，来来回回笑得直打滚。老蟾蜍先生长得那么不漂亮，几乎都有些丑了，居然觉得自己有一副美妙的歌喉！吉米笑得停不下来，哈，哈，哈，呵，呵，呵。
        - id: ch01-b14
          speaker: narrator
          text: 直到实在笑不动了，吉米才抬起头。老蟾蜍先生早已重新上路。跳，跳，蹦跶一跳。跳，跳，蹦跶一跳。他就是这样不停地向前赶。吉米望着他的背影，只好承认，这件事实在叫他想不明白。
