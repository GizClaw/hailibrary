audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 从容淘气，打趣时眼里带笑
        timbre: 圆润略低沉
        pace: 从容偏慢
        pitch: 中低音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    mr_redwing:
      display_name: 红翼鸫先生
      tts:
        delivery: 快活机灵，话里常带着会意的笑
        timbre: 清脆明亮
        pace: 轻快流畅
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第四章　兔子彼得找到了老蟾蜍先生
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 兔子彼得很少真的嫉妒谁。可春天一片欢腾的时候，他偶尔也会羡慕那些鸟儿。鸟儿能把心里的喜悦唱成美妙的歌，彼得却只能踢踢长长的后腿，四处蹦跳，再做几件这样的傻事。他自己倒是快活得很，可别人听见鸟儿唱歌，也会跟着高兴。他的蹦跳就没有这个本事。你知道，把快乐送给别人，自己的快乐也会更多。所以有些时候，彼得真希望自己也能唱。
        - id: ch01-b02
          speaker: narrator
          text: 这会儿，彼得正坐在微笑池岸边。他听着盛大的春日合唱，心里又冒出了这个愿望。
        - id: ch01-b03
          speaker: mr_redwing
          text: 特啦啦啦哩！欧咔啾！欧咔啾！春天多欢喜，你我都欢喜。
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: 红翼鸫先生站在芦苇丛中，唱出了这支歌。
        - id: ch01-b05
          speaker: narrator
          text: 绿草地那边，草原云雀卡罗尔的歌声清亮又婉转。欢笑溪流进微笑池的地方长着一片桤木，歌雀小友就在枝叶间唱出满腔欢欣。可爱蓝鸲的哨声甜甜的，又有一点儿哀婉，轻轻飘在空中，让人听不出是从哪里传来的。知更鸟欢迎站在大山核桃树顶上放声歌唱，像是心里装了太多喜悦，就快盛不下了。连松鸦萨米也收起平常那种刺耳的尖叫，唱出了一声铃铛般清越的鸣啭。
        - id: ch01-b06
          speaker: narrator
          text: 微笑池更像是连池水都唱了起来。四周岸边响起一片清脆嘹亮的调子，歌手却一个也看不见。彼得睁大眼睛找了又找，还是知道它们是谁。那是雨蛙，是树蟾蜍黏脚的小表亲们。
        - id: ch01-b07
          speaker: narrator
          text: 彼得听得入了迷，一时忘了自己为什么来微笑池。臭鼬吉米和负鼠比利大叔可没忘，他们还在找老蟾蜍先生。吉米悄悄走到彼得身后，戳了戳他的背。
        - id: ch01-b08
          speaker: jimmy_skunk
          text: 喂，做梦大王，你找到他了吗？
        - id: ch01-b09
          speaker: narrator
          text: 彼得猛地一惊，这才回过神来。
        - id: ch01-b10
          speaker: peter_rabbit
          text: 还没有。我刚才只顾着听歌，还在想，要是我也会唱就好了。吉米，你从来没盼过自己也能唱歌吗？
        - id: ch01-b11
          speaker: jimmy_skunk
          text: 没有。我天生做不了的事，才不费工夫去盼呢。可是老蟾蜍先生到底跑到哪儿去了？他说要来这里唱歌，红翼鸫先生好像也在等他。我能想到的地方都找遍了，还是没有见到。不过，不再试着找一次，我可不肯罢休。别发呆啦，来帮我们一起找。
        - id: ch01-b12
          speaker: narrator
          text: 彼得不再做梦，也跟着找了起来。可是有个地方，他们三个谁都没有找过，那就是微笑池里。他们认定老蟾蜍先生准在岸上的某个地方，根本没想过别的可能。
        - id: ch01-b13
          speaker: narrator
          text: 过了一会儿，彼得走到一处低低的岸边。那里的浅水向池里伸出去很远，水中传出一只雨蛙清脆的叫声。彼得停下来，盯着水面，想看看这个小小的歌手藏在哪里。
        - id: ch01-b14
          speaker: narrator
          text: 突然，彼得吃惊得直蹦起来。水面上露出了一颗熟悉的脑袋。兔子彼得找到老蟾蜍先生了！
