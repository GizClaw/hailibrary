  chapters:
    - id: ch01
      title: Peter Rabbit Finds Old Mr. Toad
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit was not often truly envious, but spring sometimes made him feel that way. He envied the birds because they could sing out all the joy inside them. Peter could only kick up his long heels, leap about, and do other foolish things. That pleased Peter very much, but it did not make anyone else happier, the way a bird's song did. And when you give joy to others, you add to your own. So now and then, Peter wished he could sing.
        - id: ch01-b02
          speaker: narrator
          text: That was exactly what he was wishing as he sat on the bank of the Smiling Pool and listened to the great spring chorus.
        - id: ch01-b03
          speaker: mr_redwing
          text: Tra-la-la-lee! Oka-chee! Oka-chee! There's joy in the spring for you and for me.
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: Mr. Redwing sang from the bulrushes. Out on the Green Meadows, Carol the Meadow Lark's clear notes rose into the air. Little Friend the Song Sparrow poured out a flood of happiness from the alders where the Laughing Brook entered the pool.
        - id: ch01-b05
          speaker: narrator
          text: Winsome Bluebird gave a sweet whistle that sounded almost sad. It seemed to float through the air, and no one could quite tell where it came from. High in the Big Hickory-tree, Welcome Robin sang as if his heart might burst with joy. Even Sammy Jay added a lovely note, clear as a bell, instead of his usual harsh scream.
        - id: ch01-b06
          speaker: narrator
          text: The Smiling Pool itself seemed to sing. Clear, piping voices rose in a mighty chorus from all around the banks, though the singers stayed hidden. Peter looked and looked, but he could not see a single one. Still, he knew who they were. They were hylas, the tiny cousins of Stickytoes the Tree Toad.
        - id: ch01-b07
          speaker: narrator
          text: As Peter listened to all those happy voices, he forgot why he had come to the Smiling Pool. But Jimmy Skunk and Unc' Billy Possum had not forgotten. They were still searching for Old Mr. Toad.
        - id: ch01-b08
          speaker: jimmy_skunk
          text: Well, Mr. Dreamer, did you find him yet?
        - id: ch01-b09
          speaker: narrator
          text: Jimmy had crept up behind Peter and poked him in the back. Peter came to himself with a start.
        - id: ch01-b10
          speaker: peter_rabbit
          text: No. I was listening to everyone sing and wishing I could sing too. Don't you ever wish you could sing, Jimmy?
        - id: ch01-b11
          speaker: jimmy_skunk
          text: No. I don't waste time wishing I could do something I was never meant to do. But where can Old Mr. Toad be? He said he was coming here to sing, and Mr. Redwing was expecting him. I've searched every place I can think of, and I still haven't found him. I'm not giving up until we try once more. Stop dreaming and help us look.
        - id: ch01-b12
          speaker: narrator
          text: Peter put his dreams aside and joined the search. But there was one place that Peter, Jimmy, and Unc' Billy had never thought to check. None of them had looked in the Smiling Pool itself. They simply supposed that Old Mr. Toad must be somewhere along the bank.
        - id: ch01-b13
          speaker: narrator
          text: After a while, Peter reached a low part of the bank. The water there stayed shallow for quite a distance out into the pool. A hyla's piping voice came from that shallow water. Peter stopped and stared, trying to spot the tiny singer.
        - id: ch01-b14
          speaker: narrator
          text: Then Peter suddenly leaped straight into the air. A familiar-looking head was sticking out of the water.
        - id: ch01-b15
          speaker: narrator
          text: Peter had found Old Mr. Toad!
