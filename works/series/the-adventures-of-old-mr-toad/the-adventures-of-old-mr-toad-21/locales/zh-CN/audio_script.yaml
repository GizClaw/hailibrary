audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 老实稳重，紧张时气息急促而不失真诚
        timbre: 粗哑温厚
        pace: 平时缓慢，慌张时断续
        pitch: 中低音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 随和机灵，客气中带着一点心照不宣的笑意
        timbre: 柔和微哑
        pace: 从容轻快
        pitch: 中低音
    buster_bear:
      display_name: 巴斯特熊
      tts:
        delivery: 爽朗直接，亲切里带着沉稳的力量
        timbre: 低沉浑厚
        pace: 不疾不徐
        pitch: 低音
  chapters:
    - id: ch01
      title: 第二十一章　老蟾蜍先生又收到邀请
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老蟾蜍先生的朋友和邻居都觉得，该让他受点教训了。起初，大家只是笑他骄傲得不肯跟人说话。可日子一久，谁也受不了这种冷眼。几位朋友便凑在一起想办法，要让他看清楚，虚荣自大究竟有多么愚蠢。
        - id: ch01-b02
          speaker: narrator
          text: 第二天，臭鼬吉米就进了绿森林，去找巴斯特熊。吉米不怕巴斯特，所以没多久便找到了他。可吉米一见面，先问的不是那件正事，而是巴斯特早晨有没有瞧见肥甲虫。谁叫吉米最爱吃肥甲虫呢？不管路上碰见谁，他头一句总要问这个。
        - id: ch01-b03
          speaker: buster_bear
          text: 我还真知道一个地方，也许能找到几只。走吧，吉米，我带你去看看。
        - id: ch01-b04
          speaker: narrator
          text: 巴斯特咧嘴笑了。果然，他在一根朽木底下找出五只肥甲虫。吉米连问也没问巴斯特想不想吃，就把五只全吞进肚里。平常的吉米很有礼貌，可一见肥甲虫，他常常就把礼貌忘了。好在巴斯特一点也没介意。
        - id: ch01-b05
          speaker: narrator
          text: 最后一只甲虫下了肚，吉米咂咂嘴，这才说出真正的来意。巴斯特原本当然以为，他就是为甲虫来的。可不是这么回事。不，先生，吉米来找他，根本不是为了甲虫。他想请巴斯特帮个忙，照大家的计划教训一下老蟾蜍先生。
        - id: ch01-b06
          speaker: narrator
          text: 吉米先说起老蟾蜍先生的变化。自从跟巴斯特吃过饭，老蟾蜍先生就骄傲得不成样子，连从前的朋友和邻居也不肯搭理。巴斯特想到又小又难看的老蟾蜍先生竟会拿这种事骄傲，忍不住笑个不停。那笑声又低又沉，轰隆隆地滚了出来。
        - id: ch01-b07
          speaker: narrator
          text: 接着，吉米讲了他们想好的办法，问巴斯特愿不愿意帮忙。巴斯特听着听着，眼睛里闪起了笑意。
        - id: ch01-b08
          speaker: buster_bear
          text: 没问题，吉米。我一定照你说的办。
        - id: ch01-b09
          speaker: narrator
          text: 吉米马上去找老蟾蜍先生。那位先生正坐在那里晒太阳，骄傲得浑身鼓鼓的。吉米走到他面前，拿出了最客气的口吻。
        - id: ch01-b10
          speaker: jimmy_skunk
          text: 巴斯特熊托我给您送个邀请。他想请问，明天您肯不肯赏光，到绿森林边那棵烂栗树桩旁边，跟他一起吃顿饭？
        - id: ch01-b11
          speaker: narrator
          text: 老蟾蜍先生本来已经鼓得够厉害了。一听这个邀请，他又猛地胀大了不少，吓得吉米真怕他一下子胀破。接着，他摆出无比尊贵的架势，慢悠悠地作了回答。
        - id: ch01-b12
          speaker: old_mr_toad
          text: 请你转告我的朋友巴斯特熊，我非常乐意赏光，跟他共进一餐。
        - id: ch01-b13
          speaker: narrator
          text: 吉米回去转告他的答复了。老蟾蜍先生还坐在那里，不住地把身子往外鼓，鼓得自己几乎喘不过气。
        - id: ch01-b14
          speaker: old_mr_toad
          text: 赏光跟他共进一餐！我这辈子还从来没有受过这么大的抬举呢。
