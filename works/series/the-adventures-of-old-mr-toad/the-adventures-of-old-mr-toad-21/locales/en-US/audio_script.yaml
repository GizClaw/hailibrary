audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, good-natured, and quietly confident
        timbre: mellow and slightly husky
        pace: relaxed
        pitch: medium-low
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: genial, direct, and good-natured
        timbre: deep and rumbling
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Old Mr. Toad Receives Another Invitation
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mr. Toad's friends and neighbors decided that he needed a lesson. At first, everyone had laughed when he became too proud to speak to them. Before long, though, they were tired of being treated that way. Some of them put their heads together. They would show Mr. Toad how very, very foolish false pride could be.
        - id: ch01-b02
          speaker: narrator
          text: The very next day, Jimmy Skunk went into the Green Forest to find Buster Bear. Jimmy wasn't afraid of Buster, and it didn't take him long to find him. As soon as he did, Jimmy asked whether Buster had seen any fat beetles that morning. Jimmy dearly loved fat beetles. In fact, that was the first question he asked almost anyone he met.
        - id: ch01-b03
          speaker: buster_bear
          text: I think I know where we might find a few. Come along with me, Jimmy, and we'll have a look.
        - id: ch01-b04
          speaker: narrator
          text: Buster grinned and led the way. Sure enough, beneath an old log he found five fat beetles. Jimmy gobbled up every one without once asking whether Buster would like one. Jimmy was usually very polite, but fat beetles sometimes made him forget his manners. Buster didn't seem to mind.
        - id: ch01-b05
          speaker: narrator
          text: When the last beetle was gone, Jimmy smacked his lips. Then he explained why he had really come. Buster had naturally thought it was the beetles. But no, sir, Jimmy had not come for beetles at all. He wanted Buster's help with a plan to teach Old Mr. Toad a lesson.
        - id: ch01-b06
          speaker: narrator
          text: First Jimmy told Buster how proud Mr. Toad had become after dining with him. Ever since that dinner, Mr. Toad had refused even to speak to his old friends and neighbors. The thought of homely little Mr. Toad being proud of anything tickled Buster so much that he laughed and laughed. His laughter rolled out deep and grumbly-rumbly.
        - id: ch01-b07
          speaker: narrator
          text: Then Jimmy told him the plan and asked whether he would help. Buster's eyes twinkled as he listened.
        - id: ch01-b08
          speaker: buster_bear
          text: Yes, Jimmy. I'll do exactly what you asked.
        - id: ch01-b09
          speaker: narrator
          text: Jimmy went straight to the place where Old Mr. Toad sat taking a sunbath, looking as puffed up as ever. Jimmy spoke in his most polite manner.
        - id: ch01-b10
          speaker: jimmy_skunk
          text: Buster Bear has sent me with an invitation. He asks whether you will honor him by dining with him tomorrow at the rotted chestnut stump near the edge of the Green Forest.
        - id: ch01-b11
          speaker: narrator
          text: Mr. Toad had looked puffed up before. When he heard that invitation, he swelled out so much more that Jimmy was truly afraid he might burst.
        - id: ch01-b12
          speaker: old_mr_toad
          text: You may tell my friend Buster Bear that I shall be delighted to honor him by dining with him.
        - id: ch01-b13
          speaker: narrator
          text: Mr. Toad answered with the grandest air he could manage. Jimmy went away to deliver the reply. Mr. Toad stayed where he was and puffed himself out until he could hardly breathe.
        - id: ch01-b14
          speaker: old_mr_toad
          text: Honor him by dining with him! Why, I have never been so flattered in all my life.
