audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    mr_blacksnake:
      display_name: 黑蛇先生
      tts:
        delivery: 圆滑狡黠，话语间藏着若无其事的得意
        timbre: 细薄柔滑
        pace: 从容偏慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 第十七章　老蟾蜍先生犯了个错误
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: “如果”这个词，看上去小得很。可你见过的那些大词，意思加起来也未必有它多。想想看，要是吉米臭鼬没有恰好走下弯弯小径，要是他没去找肥甲虫，要是他没瞧见路边的大树皮，更没想过把树皮翻开，后面的事就全不会发生。老蟾蜍先生不会犯错，咱们也就没有这个故事可听了。
        - id: ch01-b02
          speaker: narrator
          text: 可事情偏偏就是那么巧。吉米走上了弯弯小径，也找起了甲虫，还真的掀开那块大树皮。他在树皮下面发现了老蟾蜍先生。
        - id: ch01-b03
          speaker: narrator
          text: 原来，老蟾蜍先生钻到那里，是想安安稳稳睡一觉。吉米却告诉他，自己早晨碰见过黑蛇先生。更要紧的是，黑蛇先生还问起了老蟾蜍先生。这一下，他哪里还睡得着？是的，先生，他顿时清醒得不能再清醒。
        - id: ch01-b04
          speaker: narrator
          text: 老蟾蜍先生心里明白，黑蛇先生为什么要问起他。黑蛇先生最爱吃的，正是蟾蜍。听完吉米的话，他脸上血色全无。这时候，他犯下了第一个错误。他只想马上离开附近，慌乱中竟没问一句，吉米究竟是在哪里看到黑蛇先生的。老蟾蜍先生匆匆道了别，转身就用最快的速度赶路去了。
        - id: ch01-b05
          speaker: narrator
          text: 老蟾蜍先生选的方向，是沿弯弯小径往上。就在同一刻，黑蛇先生正顺着这条路往下。人怕得狠了，常会认定危险追在后头，忘了留神前方。老蟾蜍先生也是这样。他边跳边回头看，把面前的路忘得一干二净。这就是他的第二个错误。
        - id: ch01-b06
          speaker: narrator
          text: 他一门心思认定，黑蛇先生就在身后的某个地方。所以他根本不管自己正往哪里去。要知道，赶路的人若是不看前面，十有八九会结结实实地撞进麻烦。
        - id: ch01-b07
          speaker: narrator
          text: 老蟾蜍先生一路往小径上方跳，使出了自己全部的力气。可他从来就不是跳得快的那一类，所以再怎么使劲，也实在快不了多少。更糟的是，他还不停地扭头，想从身后找出黑蛇先生。
        - id: ch01-b08
          speaker: narrator
          text: 不一会儿，弯弯小径拐弯了。老蟾蜍先生急急绕过去，差一点就和黑蛇先生撞个正着。谁受到的惊吓更大，还真不好说。他们四目相对，愣了短短一瞬。随后，黑蛇先生的双眼亮了起来。
        - id: ch01-b09
          speaker: mr_blacksnake
          text: 蟾蜍先生，早上好啊。今天早晨这么美，您说是不是？我刚刚还想到您呢。
        - id: ch01-b10
          speaker: narrator
          text: 可怜的老蟾蜍先生别说回礼了，连一个字都吐不出来。他已经吓得不会说话，只能尖叫一声，掉头便逃。刚才他上山时已经拼尽全力，这会儿往山下跳，竟比刚才还快了一倍。
        - id: ch01-b11
          speaker: narrator
          text: 黑蛇先生咧开嘴，追了上去，却一点儿也不着急。他很清楚，老蟾蜍先生跑不快，自己不用费多大力气就能抓住他。何况在他看来，趁机活动一下身体也不错。
        - id: ch01-b12
          speaker: narrator
          text: 那个夏日的早晨，快活又明亮的太阳先生正在湛蓝湛蓝的天空中俯望。他见大家好像都很幸福，便含着笑。可忽然间，他发现草地上的小居民里，有一个不但不幸福，反而痛苦极了。
        - id: ch01-b13
          speaker: narrator
          text: 那正是老蟾蜍先生。他为了保住性命，拼命沿着弯弯小径往下跳。黑蛇先生从后面滑来，离他越来越近，越来越近。
