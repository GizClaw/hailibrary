audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, friendly, and matter-of-fact
        timbre: mellow and slightly husky
        pace: relaxed
        pitch: medium-low
    mr_blacksnake:
      display_name: Mr. Blacksnake
      tts:
        delivery: smooth, sly, and quietly amused
        timbre: thin and silky
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Old Mr. Toad's Mistake
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The word "if" may look very small, but it can hold more meaning than the biggest word you know. Suppose Jimmy Skunk had not ambled down the Crooked Little Path at that very moment. Suppose he had not been hunting for fat beetles, or noticed a big piece of bark beside the path, or decided to turn it over. Without all those little ifs, Old Mr. Toad would never have made his mistake, and there would be no story to tell.
        - id: ch01-b02
          speaker: narrator
          text: But Jimmy did come down the path. He did search for beetles, and he did turn over that piece of bark. Underneath it, he found Old Mr. Toad.
        - id: ch01-b03
          speaker: narrator
          text: Mr. Toad had crawled under the bark for a nap. Then Jimmy told him that he had seen Mr. Blacksnake that very morning, and that Mr. Blacksnake had been asking about him. Not one sleepy feeling remained in Mr. Toad. Yes, sir, he was wide awake at once. He knew exactly why Mr. Blacksnake wanted to find him. Mr. Blacksnake was very fond of Toads.
        - id: ch01-b04
          speaker: narrator
          text: Mr. Toad turned quite pale, and that was when he made his first mistake. He was in such a rush to leave the neighborhood that he never asked Jimmy where he had seen Mr. Blacksnake. Mr. Toad barely stayed long enough to say goodbye. Then he set off as fast as he could go.
        - id: ch01-b05
          speaker: narrator
          text: As it happened, Mr. Toad went up the Crooked Little Path. At the same time, Mr. Blacksnake was coming down it. When people are terribly frightened, they often imagine the danger must be behind them, not ahead. That was just what Mr. Toad did.
        - id: ch01-b06
          speaker: narrator
          text: He kept looking back over his shoulder instead of watching the path in front of him. That was his second mistake. He felt certain Mr. Blacksnake was somewhere behind him, so he paid no attention to where he was going. And when you do not watch where you are going, you are very likely to tumble headfirst into trouble.
        - id: ch01-b07
          speaker: narrator
          text: Up the Crooked Little Path Mr. Toad hopped, as fast as he could manage. That was not very fast, because Mr. Toad has never been a fast hopper. All the while, he kept turning his head to look for Mr. Blacksnake behind him.
        - id: ch01-b08
          speaker: narrator
          text: Before long, Mr. Toad reached a bend in the path. He hurried around it and almost bumped straight into Mr. Blacksnake. It was hard to say which of them was more surprised. For one tiny second, they simply stared at each other. Then Mr. Blacksnake's eyes began to sparkle.
        - id: ch01-b09
          speaker: mr_blacksnake
          text: Why, good morning, Mr. Toad. What a lovely morning this is. I was just thinking of you.
        - id: ch01-b10
          speaker: narrator
          text: Poor Mr. Toad did not return the greeting. He said nothing at all. He could not. He was much too frightened even to speak. A little squeal escaped him, and he spun around. Then he raced back down the Crooked Little Path, hopping twice as fast as he had on the way up.
        - id: ch01-b11
          speaker: narrator
          text: Mr. Blacksnake grinned and followed him. He did not hurry much. He knew he would not need to run fast to catch Mr. Toad, and he thought the exercise would do him good.
        - id: ch01-b12
          speaker: narrator
          text: So it was that, on that summer morning, jolly, bright Mr. Sun looked down from the blue, blue sky. He smiled because everyone seemed so happy. Then, all at once, he saw that one of the little meadow people was not happy at all. That little fellow was terribly, terribly unhappy.
        - id: ch01-b13
          speaker: narrator
          text: It was Old Mr. Toad, hopping down the Crooked Little Path for his life. Behind him glided Mr. Blacksnake, coming nearer and nearer.
