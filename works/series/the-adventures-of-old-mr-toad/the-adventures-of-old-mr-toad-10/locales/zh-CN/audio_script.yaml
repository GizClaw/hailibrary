audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 见多识广，直率中带着固执
        timbre: 粗粝厚实
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十章　小蟾蜍出发看世界
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 世界辽阔又奇妙，年轻时总要四处跑。亲自学会长辈早已懂得的道理，哪儿也不如自己的家好。
        - id: ch01-b02
          speaker: narrator
          text: 兔子彼得已经好一阵子没去微笑池看蝌蚪了。一个阴天的早晨，他忽然想起它们，便决定跑去看看。老蟾蜍先生的那群蝌蚪娃娃，如今变了多少呢？上回彼得见到它们时，有几只才刚长出腿，身后还拖着长尾巴。
        - id: ch01-b03
          speaker: narrator
          text: 彼得一蹦一跳地上了路。快到微笑池时，豆大的雨点忽然噼噼啪啪落下来。头一阵雨刚打到地上，怪事就发生了。至少在彼得看来，这事实在古怪。转眼间，他身边竟到处都是小蟾蜍。
        - id: ch01-b04
          speaker: narrator
          text: 彼得朝哪边看，都能见到小蟾蜍。它们和老蟾蜍先生长得一模一样，只是小得出奇。随便哪一只坐在十美分硬币上，都能坐得舒舒服服，旁边还空着一大块地方。
        - id: ch01-b05
          speaker: narrator
          text: 彼得吃惊得把一双大眼睛越睁越圆。这些小家伙是从哪儿一下子冒出来的？一分钟前，一只也没有。现在，他每走一步都怕踩到一只。看起来，真的看起来，就像雨点一落地，马上变成了一只小蟾蜍。
        - id: ch01-b06
          speaker: narrator
          text: 彼得当然知道，这不可能。可眼前的事还是叫他怎么也想不通。那些小蟾蜍却一个个勇敢地往前蹦，好像正急着赶到某个地方去。
        - id: ch01-b07
          speaker: narrator
          text: 彼得看了一会儿，又朝微笑池走去。刚到岸边，他竟迎面碰见了老蟾蜍先生。老蟾蜍先生瘦了些，正背对着池子往外蹦。整个春天，他一直待在微笑池里，参加那场声势浩大的合唱。如今，他居然要走了。
        - id: ch01-b08
          speaker: narrator
          text: 彼得看到他，几乎和刚才看到小蟾蜍时一样惊讶。不过这会儿，彼得最想弄清楚的，还是那些小家伙的事。
        - id: ch01-b09
          speaker: peter_rabbit
          text: 早上好，老蟾蜍先生。请问，这么多小蟾蜍都是从哪儿来的呀？
        - id: ch01-b10
          speaker: old_mr_toad
          text: 这还用问吗？它们当然是从微笑池里来的。难道你以为，它们还能从别处来？
        - id: ch01-b11
          speaker: peter_rabbit
          text: 我……我也不知道。刚才明明一只都没有，可雨一下起来，它们立刻到处都是。简直就像……像是跟着雨，从天上落下来的。
        - id: ch01-b12
          speaker: narrator
          text: 老蟾蜍先生听完，呵呵笑了。
        - id: ch01-b13
          speaker: old_mr_toad
          text: 要说我自己的孩子嘛，它们还真挺懂事。它们知道，蟾蜍只有在潮湿的天气里才适合赶路。昨夜又湿润又舒服，它们就离开了微笑池。后来太阳出来了，它们便找地方躲起来。树枝、石头、树皮、草叶，只要能遮一遮，躲在哪儿都行。
        - id: ch01-b14
          speaker: old_mr_toad
          text: 这阵雨一来，它们知道赶路的好天气到了，便一下子全蹦了出来。
        - id: ch01-b15
          speaker: peter_rabbit
          text: 可它们为什么要离开微笑池呢？
        - id: ch01-b16
          speaker: old_mr_toad
          text: 它们要去看看大千世界。傻呀，真是太傻了，可它们偏偏非去不可。我像它们这么大时，也做过同样的事。那时候谁也拦不住我，现在我也一样拦不住它们。
        - id: ch01-b17
          speaker: old_mr_toad
          text: 它们过着舒服日子，自己却不知道。唉，年轻人向来都是这样。今天这天气可真不错，是不是？
