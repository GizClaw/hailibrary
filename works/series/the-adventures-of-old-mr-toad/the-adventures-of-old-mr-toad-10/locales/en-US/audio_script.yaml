audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, curious, and politely eager
        timbre: bright and youthful
        pace: quick
        pitch: medium-high
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: The Little Toads Start Out to See the World
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The world is a wonderful, great big place, and the young must roam through it. That's how they learn what their elders already know. There's never a place like home.
        - id: ch01-b02
          speaker: narrator
          text: Peter Rabbit hadn't visited the Smiling Pool for some time. Then, one cloudy morning, he remembered the pollywogs and decided to see how they were doing. Off he went, lipperty-lipperty-lip. He wondered how much Old Mr. Toad's children had changed. When Peter last saw them, some were just starting to grow legs, though they still had long tails.
        - id: ch01-b03
          speaker: narrator
          text: Peter was nearly at the Smiling Pool when huge drops of rain began splashing down. With those first drops, something happened that struck him as very funny. Tiny little Toads suddenly surrounded him. He saw them whichever way he looked. They were just like Old Mr. Toad, but each one was so small that it could have sat on a ten-cent piece with room to spare.
        - id: ch01-b04
          speaker: narrator
          text: Peter stared, his big eyes round with surprise. Where had they all come from? There hadn't been a single Toad in sight a minute ago. Now Peter could barely move without stepping on one. It truly seemed as though every raindrop became a tiny Toad the moment it hit the ground. Peter knew that couldn't be true, of course, but he couldn't understand what he was seeing. And every little Toad hopped bravely onward, as if it had somewhere special to go.
        - id: ch01-b05
          speaker: narrator
          text: After watching them for a few minutes, Peter continued toward the Smiling Pool. Right on the bank, he met Old Mr. Toad. The old fellow looked rather thin, and his back was turned to the pool. Yes, he was leaving the place where he had spent all spring singing in the great chorus. Seeing him there surprised Peter almost as much as seeing all those little Toads. But just then, the little Toads were what Peter cared about most.
        - id: ch01-b06
          speaker: peter_rabbit
          text: Good morning, Old Mr. Toad. Would you please tell me where all these little Toads came from?
        - id: ch01-b07
          speaker: narrator
          text: Peter spoke as politely as he could.
        - id: ch01-b08
          speaker: old_mr_toad
          text: Why, certainly. They came from the Smiling Pool, of course. Where else did you think they came from?
        - id: ch01-b09
          speaker: peter_rabbit
          text: I... I didn't know. I couldn't see a single one. Then the rain started, and suddenly they were everywhere. It almost looked as if they had fallen from the sky with the rain.
          emotion: surprised
        - id: ch01-b10
          speaker: narrator
          text: Old Mr. Toad chuckled.
        - id: ch01-b11
          speaker: old_mr_toad
          text: My children have plenty of sense, though perhaps a father shouldn't brag. A Toad knows that traveling weather must be wet. They set out from the Smiling Pool last night, when the ground was damp and comfortable. Once the sun came up, they found hiding places beneath sticks, stones, bark, or grass. Sensible children! Then this shower arrived. That was their chance to travel again, and out they popped.
        - id: ch01-b12
          speaker: peter_rabbit
          text: But why did they leave the Smiling Pool?
        - id: ch01-b13
          speaker: old_mr_toad
          text: They wanted to see the Great World. Foolish, very foolish, but they wouldn't be stopped. I went off myself when I was their age, and no one could stop me either. They have no idea how well off they are. Young folks never do. Fine weather we're having, isn't it?
