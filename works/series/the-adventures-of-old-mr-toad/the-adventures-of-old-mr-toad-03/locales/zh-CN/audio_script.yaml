audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 从容淘气，打趣时眼里带笑
        timbre: 圆润略低沉
        pace: 从容偏慢
        pitch: 中低音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    uncle_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 精明随和，带着乡间长者的诙谐口吻
        timbre: 沙哑温厚
        pace: 从容中速
        pitch: 中低音
    mr_redwing:
      display_name: 红翼鸫先生
      tts:
        delivery: 快活机灵，话里常带着会意的笑
        timbre: 清脆明亮
        pace: 轻快流畅
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三章　寻找老蟾蜍先生
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老蟾蜍先生使出了全身力气赶路，累得上气不接下气。可要是跟兔子彼得、臭鼬吉米和负鼠比利大叔比，他还是一点儿也快不起来。你瞧，他不能像表兄青蛙爷爷那样纵身一跃，跳出老远，只能一小步一小步地蹦。
        - id: ch01-b02
          speaker: narrator
          text: 所以，彼得、吉米和比利大叔跟在后面，一点儿也不着急。他们走走停停，先替吉米找肥甲虫，又让彼得在每一小片香甜的三叶草旁吃个够。有一回，比利大叔还找了半天草原云雀卡罗尔的鸟巢，想碰碰运气，瞧瞧里面有没有新鲜鸟蛋。当然找不到啦，理由再明白不过，卡罗尔根本还没筑巢呢。彼得暗地里很高兴。他自己不吃鸟蛋，也总为那些被偷了蛋的长羽毛的朋友难过。
        - id: ch01-b03
          speaker: narrator
          text: 来到绿草地中央，他们又跟快乐小微风玩了起来。那里实在太舒服，三个伙伴玩得比自己以为的久多了，根本没留意时间。等他们终于接着赶路，老蟾蜍先生早已不见了。这一路上，他可一刻都没有停。跳，跳，蹦跶一跳。
        - id: ch01-b04
          speaker: peter_rabbit
          text: 没事儿。他是个慢性子，我们很快就能追上。
        - id: ch01-b05
          speaker: narrator
          text: 可是，慢性子只要埋头往前走，不把时间浪费掉，迟早会走到要去的地方。很多时候，他反倒比那些天生跑得快、一路却总贪玩的人先到。老蟾蜍先生就是这样。伙伴们玩耍时，他一直在跳，跳，蹦跶一跳。所以彼得、吉米和比利大叔到了微笑池，还是没能再看见他的影子。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 他会不会藏在什么地方，我们没看见，已经从旁边走过去了？
        - id: ch01-b07
          speaker: narrator
          text: 比利大叔摇摇头。
        - id: ch01-b08
          speaker: uncle_billy_possum
          text: 俺看不会。咱们一路只顾着胡闹，把时间都耽误啦。蟾蜍兄弟早就赶到咱们前面去喽。俺猜，他准在这岸边的什么地方坐着呢。
        - id: ch01-b09
          speaker: narrator
          text: 三个伙伴马上分头去找。他们沿着微笑池的整条岸边找了个遍，还往枯叶和树枝底下探头。老蟾蜍先生可能躲藏的地方，他们一处也没放过，可哪里都没有他的踪迹。
        - id: ch01-b10
          speaker: mr_redwing
          text: 特啦啦啦哩！欧咔啾！欧咔啾！世上数我最欢喜！
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: 红翼鸫先生在芦苇丛中前后摇晃着身子，放声歌唱。
        - id: ch01-b12
          speaker: peter_rabbit
          text: 喂，红翼鸫先生！你看见老蟾蜍先生了吗？
        - id: ch01-b13
          speaker: mr_redwing
          text: 没有。原来你们是在找他呀？我刚才还在想，你们是不是丢了什么东西。你们找老蟾蜍先生做什么？
        - id: ch01-b14
          speaker: narrator
          text: 彼得把事情说了一遍。他们一路跟着老蟾蜍先生，就是想弄明白，他到底要去做什么。
        - id: ch01-b15
          speaker: peter_rabbit
          text: 我们当然知道，他跟我一样，根本没有歌喉。可我们就是好奇，他是不是真以为自己会唱歌。他又为什么这么急着赶到微笑池？我们看呀，准是春天把老蟾蜍先生弄疯了。
        - id: ch01-b16
          speaker: narrator
          text: 红翼鸫先生听完，一双亮眼睛闪着笑意。
        - id: ch01-b17
          speaker: mr_redwing
          text: 哦，原来是这样。有些人呀，知道的事情可没有自己想的那么多。我一直纳闷老蟾蜍先生去了哪里。现在听说，他还记得自己在我们美妙的春日大合唱里有个很要紧的角色，我真是太高兴了。
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: 说完，红翼鸫先生又唱了起来。
