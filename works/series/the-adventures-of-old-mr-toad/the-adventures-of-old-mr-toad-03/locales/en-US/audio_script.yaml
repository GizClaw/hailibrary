  chapters:
    - id: ch01
      title: The Hunt for Old Mr. Toad
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mr. Toad was still hurrying with all his might, and he was quite out of breath. But he could not cross the ground nearly as fast as Peter Rabbit, Jimmy Skunk, or Unc' Billy Possum. Unlike his cousin Grandfather Frog, he could not take long jumps. He could only make short little hops, and even his fastest hops did not carry him very far across the meadow.
        - id: ch01-b02
          speaker: narrator
          text: So Peter, Jimmy, and Unc' Billy took their time following him. They stopped to let Jimmy hunt fat beetles, and Peter helped himself at every little patch of sweet clover. Once, Unc' Billy spent a long while searching for Carol the Meadow Lark's nest, hoping for fresh eggs. He found nothing for the very good reason that Carol had not built her nest yet. Peter was secretly glad. He did not eat eggs, and he always felt sorry when his feathered friends lost theirs.
        - id: ch01-b03
          speaker: narrator
          text: Halfway across the Green Meadows, the three friends stopped to play with the Merry Little Breezes. The place was so pleasant that they played much longer than they knew. By the time they moved on, Old Mr. Toad had vanished from sight. He had never stopped. All that while, he had gone steadily on. Hop, hop, hipperty-hop.
        - id: ch01-b04
          speaker: peter_rabbit
          text: It doesn't matter. He's so slow that we can catch him easily.
        - id: ch01-b05
          speaker: narrator
          text: But someone slow who keeps moving and never wastes time will get somewhere sooner or later. Often, that someone arrives before quicker folk who stop along the way. And that was exactly what happened. Old Mr. Toad kept going, hop, hop, hipperty-hop, while the others played. When Peter, Jimmy, and Unc' Billy finally reached the Smiling Pool, they still had not seen him again.
        - id: ch01-b06
          speaker: peter_rabbit
          text: Could he have hidden somewhere? Maybe we went right past him.
        - id: ch01-b07
          speaker: narrator
          text: Unc' Billy shook his head.
        - id: ch01-b08
          speaker: unc_billy_possum
          text: Ah don't reckon so. We-uns have been foolin' away our time, and Brer Toad got ahead of us. Ah reckon he's sittin' somewhere along this bank.
        - id: ch01-b09
          speaker: narrator
          text: The three friends separated at once and began to search. They went all along the bank of the Smiling Pool, peeking under old leaves and sticks. They checked every place where Old Mr. Toad might be hiding. But they could not find a single trace of him.
        - id: ch01-b10
          speaker: mr_redwing
          text: Tra-la-la-lee! Oka-chee! Oka-chee! I'm just as happy as I can be!
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: Mr. Redwing sang as he swayed back and forth among the bulrushes.
        - id: ch01-b12
          speaker: peter_rabbit
          text: Mr. Redwing! Have you seen Old Mr. Toad?
        - id: ch01-b13
          speaker: mr_redwing
          text: No. Is he what you fellows are looking for? I thought you must have lost something. Why do you want him?
        - id: ch01-b14
          speaker: narrator
          text: Peter told him how they had followed Old Mr. Toad because they wanted to learn what he was really doing.
        - id: ch01-b15
          speaker: peter_rabbit
          text: We know he can't sing any better than I can. But we want to find out whether he truly believes he has a voice, and why he hurried so much to get here. We think spring may have driven him crazy.
        - id: ch01-b16
          speaker: mr_redwing
          text: Oh, so that's the trouble?
        - id: ch01-b17
          speaker: narrator
          text: Mr. Redwing's bright eyes twinkled.
        - id: ch01-b18
          speaker: mr_redwing
          text: Some people still have a great deal to learn. I've been wondering where Old Mr. Toad was. I'm very glad he remembered that he has such an important part in our beautiful spring chorus.
        - id: ch01-b19
          speaker: narrator
          text: Then Mr. Redwing began to sing once more.
