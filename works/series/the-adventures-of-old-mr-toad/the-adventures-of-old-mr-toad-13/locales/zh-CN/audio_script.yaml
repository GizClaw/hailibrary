audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 见多识广，直率中带着固执
        timbre: 粗粝厚实
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十三章　兔子彼得真没礼貌
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 兔子彼得怎么也忘不了老蟾蜍先生。他刚刚知道了那么多新鲜事，越想越觉得，这位老邻居说不定是所有邻居里最有意思的一个。
        - id: ch01-b02
          speaker: narrator
          text: 彼得也越来越敬重老蟾蜍先生了。想想看，那双眼睛那么漂亮，声音那么甜美，还有一条神奇的舌头，谁会不敬重他呢？
        - id: ch01-b03
          speaker: narrator
          text: 可彼得又觉得自己很傻。他们认识了一辈子，彼得竟然一直没真正了解过他。还好，别的邻居知道的也不比从前的彼得多，这才让他心里好受一点儿。
        - id: ch01-b04
          speaker: peter_rabbit
          text: 真奇怪。我们明明一辈子都住在别人旁边，却可能一点儿也不了解人家。看来，真不能随随便便就评断别人。我去找老蟾蜍先生问问，看还能知道些什么。
        - id: ch01-b05
          speaker: narrator
          text: 彼得就这样一路蹦跶着出发了。老蟾蜍先生已经离开微笑池，他也不知道该往哪里找，只猜那位先生不会离昨天见面的地方太远。昨天，老蟾蜍先生正是在那里讲起了自己的神奇舌头。
        - id: ch01-b06
          speaker: narrator
          text: 可彼得到了那里，连老蟾蜍先生的影子也没看见。头一天下过雨，蟾蜍最爱趁这种天气赶路。彼得本来应该想到，可他偏偏忘了。
        - id: ch01-b07
          speaker: narrator
          text: 找了一阵以后，彼得只好放弃。他沿着弯弯小径往上走，打算去老果园拜访土拨鼠约翰尼。
        - id: ch01-b08
          speaker: narrator
          text: 又圆又亮的太阳先生快活地照着，把最灿烂的阳光洒下来。彼得很快就忘了老蟾蜍先生。他沿着小径蹦蹦跳跳，脑子里没想着什么特别的事，只觉得活着真好，高兴起来还会把后脚跟往上一踢。
        - id: ch01-b09
          speaker: narrator
          text: 彼得刚踢完一回，耳朵忽然听见小径旁边有个怪声。他马上停下来，直起身子仔细听。声音又来了，好像就在一块旧木板底下。那一点儿窸窣声轻得很，几乎听不见。
        - id: ch01-b10
          speaker: peter_rabbit
          text: 那块旧木板下面一定藏着谁。
        - id: ch01-b11
          speaker: narrator
          text: 彼得探头往木板下看，只瞧见有个东西在动。他的好奇心立刻冒了出来。躲在下面的家伙肯定不大，那就没什么可怕的。
        - id: ch01-b12
          speaker: narrator
          text: 你猜彼得做了什么？他一把掀开了那块旧木板。再猜猜木板下面是谁。没错，正是老蟾蜍先生。
        - id: ch01-b13
          speaker: narrator
          text: 可老蟾蜍先生那副模样，真把彼得看呆了。整整一分钟，他连话都说不出来。原来，老蟾蜍先生正在换衣裳！没看错，正是这么回事。他要把旧衣服脱下来，而旧衣服底下，已经露出一套崭新的了。
        - id: ch01-b14
          speaker: narrator
          text: 这身衣裳可真难脱。老蟾蜍先生不停地张嘴、闭嘴，又把两条后腿缩到身下，用后腿使劲蹭着身子。
        - id: ch01-b15
          speaker: narrator
          text: 接着，彼得看到了一件怪事。那套旧衣服裂开了好几处，老蟾蜍先生竟然把它一点一点吸进嘴里，就这样往下脱。
        - id: ch01-b16
          speaker: narrator
          text: 没过多久，他的两条后腿挣脱了旧衣服，身上剩下的部分也慢慢松开了。老蟾蜍先生忙个不停，用大嘴两边的嘴角使劲往里吸。
        - id: ch01-b17
          speaker: narrator
          text: 他气呼呼地瞪着彼得，可嘴里塞满了旧衣服，什么也说不了。那模样实在太滑稽，彼得扑倒在地，笑得来回打滚。
        - id: ch01-b18
          speaker: narrator
          text: 老蟾蜍先生瞪得更凶了，却还是一个字也说不出来。
        - id: ch01-b19
          speaker: narrator
          text: 后来，他把旧外套的袖子从里往外拉下来，两只手总算腾了出来。他赶紧用手抓住最后那一截旧衣服，从头顶扯了过去。
        - id: ch01-b20
          speaker: narrator
          text: 老蟾蜍先生用力吞了两三下，把旧衣服咽进肚里。等最后一点儿也不见了，他终于又能说话了。
        - id: ch01-b21
          speaker: old_mr_toad
          text: 别人换衣裳的时候，你怎么能一直盯着看？这是天底下最没礼貌的事，难道你不知道吗？
          emotion: angry
