audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, curious, and openly expressive
        timbre: youthful and clear
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Peter Rabbit Is Impolite
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit could not stop thinking about Old Mr. Toad. He had learned one interesting thing after another about him. Now Peter was almost ready to believe that Mr. Toad was the most interesting of all his neighbors. His respect for the old fellow had grown very great indeed. Of course it had. Who could fail to respect someone with such beautiful eyes, such a sweet voice, and such a wonderful tongue?
        - id: ch01-b02
          speaker: narrator
          text: Still, Peter felt foolish whenever he remembered that he had known Mr. Toad all his life without truly knowing him at all. One thought made him feel a little better. Most of the other neighbors knew no more about Mr. Toad than Peter had known.
        - id: ch01-b03
          speaker: peter_rabbit
          text: It is strange to live beside someone all your life and never really know him. I suppose that is why we should not judge anyone too quickly. I'll go find Mr. Toad and see what else I can learn.
        - id: ch01-b04
          speaker: narrator
          text: Away Peter went, lipperty-lipperty-lip. Since Mr. Toad had left the Smiling Pool, Peter did not know exactly where to look. He guessed that Mr. Toad might still be near the place where they had met the day before and talked about his remarkable tongue.
        - id: ch01-b05
          speaker: narrator
          text: But when Peter reached the spot, there was no sign of him anywhere. It had rained the day before, and that was exactly the kind of weather a Toad liked best for traveling. Peter should have remembered that, but he had not. After hunting for a while, he gave up. He started along the Crooked Little Path, planning to visit Johnny Chuck in the Old Orchard instead.
        - id: ch01-b06
          speaker: narrator
          text: Jolly, round, bright Mr. Sun was shining as brightly as he could, and Peter soon forgot all about Old Mr. Toad. Peter scampered up the Crooked Little Path. He was not thinking of anything in particular, only of how good it was to be alive. Every now and then, he kicked up his heels for pure joy.
        - id: ch01-b07
          speaker: narrator
          text: He had just kicked them up again when his ears caught an odd noise beside the path. Peter stopped at once and sat up to listen. There it was again. A faint rustling seemed to come from beneath an old board.
        - id: ch01-b08
          speaker: peter_rabbit
          text: Someone is under that old board.
        - id: ch01-b09
          speaker: narrator
          text: Peter peeped underneath. He could see something moving, but that was all. Now he was full of curiosity. Whoever was hiding there could not be very big. Peter was certain of that. And if the creature was small, Peter thought he had nothing to fear. So what did he do? He pulled the old board aside.
        - id: ch01-b10
          speaker: narrator
          text: And who do you think was there? Old Mr. Toad himself, to be sure.
        - id: ch01-b11
          speaker: narrator
          text: But what a sight he was! Peter stared for a full minute before he could make a sound. Old Mr. Toad was changing his clothes. Yes, he was taking off his old suit, and a brand-new one was underneath.
        - id: ch01-b12
          speaker: narrator
          text: Mr. Toad was having a terrible time with the job. He kept opening and closing his great mouth. He drew his hind legs beneath him and rubbed them against his body. Then Peter noticed something very strange. The old suit had split in several places, and Mr. Toad was actually getting it off by sucking it into his mouth.
        - id: ch01-b13
          speaker: narrator
          text: Soon his hind legs came free. Little by little, the old suit loosened from his body. All the while, Mr. Toad worked to draw its corners into his wide mouth. He glared angrily at Peter, but his mouth was too full for him to speak.
        - id: ch01-b14
          speaker: narrator
          text: Mr. Toad looked so funny that Peter threw himself down and rolled over and over, laughing. That only made Mr. Toad glare harder. Still, he could not say one word.
        - id: ch01-b15
          speaker: narrator
          text: At last, Mr. Toad freed his hands by pulling the sleeves of his old coat off inside out. Then he used those hands to tug the rest of the suit over his head. He gulped hard two or three times and swallowed it. As soon as the last bit disappeared, his voice returned.
        - id: ch01-b16
          speaker: old_mr_toad
          text: Don't you know it is terribly impolite to stare at people while they are changing their clothes?
          emotion: angry
