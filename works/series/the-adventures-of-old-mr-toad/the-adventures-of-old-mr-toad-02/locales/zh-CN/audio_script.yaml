audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 从容淘气，打趣时眼里带笑
        timbre: 圆润略低沉
        pace: 从容偏慢
        pitch: 中低音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    uncle_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 精明随和，带着乡间长者的诙谐口吻
        timbre: 沙哑温厚
        pace: 从容中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二章　臭鼬吉米向朋友们讨主意
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 臭鼬吉米挠着头，一边想，一边望着老蟾蜍先生沿孤独小径跳向微笑池。跳，跳，蹦跶一跳。吉米这回真想不明白了。就算老蟾蜍先生说自己会飞，也不会比那句“我的嗓音可美妙了”更叫他吃惊，更让他难以相信。说到底，吉米压根儿不信。他认定老蟾蜍先生是在拿自己寻开心。
        - id: ch01-b02
          speaker: narrator
          text: 没过多久，兔子彼得来了。臭鼬吉米坐在那里，想得出了神，连肥甲虫也忘了找。吉米若是连甲虫都顾不上，那就不用猜了，他准是碰到了什么难题。
        - id: ch01-b03
          speaker: peter_rabbit
          text: 你好啊，老花条纹！这么好的早晨，你一个人坐着琢磨什么呢？
        - id: ch01-b04
          speaker: narrator
          text: 吉米伸手指了指孤独小径那头，回答得很简单。
        - id: ch01-b05
          speaker: jimmy_skunk
          text: 我想的就是他。
        - id: ch01-b06
          speaker: narrator
          text: 彼得顺着他指的方向望过去。
        - id: ch01-b07
          speaker: peter_rabbit
          text: 你说的是老蟾蜍先生？
        - id: ch01-b08
          speaker: narrator
          text: 吉米点了点头。
        - id: ch01-b09
          speaker: jimmy_skunk
          text: 你没看出他有什么不对劲吗？
        - id: ch01-b10
          speaker: narrator
          text: 彼得朝孤独小径盯了好一会儿。
        - id: ch01-b11
          speaker: peter_rabbit
          text: 没看出来。不过，他好像急得很。
        - id: ch01-b12
          speaker: jimmy_skunk
          text: 不对劲的就是这个。除了受惊逃命，你哪回见他这么着急过？
        - id: ch01-b13
          speaker: narrator
          text: 彼得只好承认，他一次也没见过。
        - id: ch01-b14
          speaker: jimmy_skunk
          text: 可他这会儿一点儿也不害怕。你瞧，他跳得多快！他说自己有一副美妙的歌喉，还说他得去微笑池参加春日大合唱。因为已经迟到了，他才这么拼命赶路。
        - id: ch01-b15
          speaker: narrator
          text: 彼得死死盯住吉米的脸，想看出他是在开玩笑，还是当真。看了一阵，彼得忽然大笑起来。
        - id: ch01-b16
          speaker: peter_rabbit
          text: 老蟾蜍先生唱歌？他可真敢想！他要是会唱，那我也会唱。可我根本不会呀！
        - id: ch01-b17
          speaker: narrator
          text: 吉米也咧开嘴笑了。
        - id: ch01-b18
          speaker: jimmy_skunk
          text: 要我说，他准是疯了。不过，他刚才认真得很，就像这事儿真的一样。我看，他可能吃了什么东西，脑袋都给吃糊涂了。负鼠比利大叔就在那边。走，咱们听听他怎么说。
        - id: ch01-b19
          speaker: narrator
          text: 吉米和彼得找到负鼠比利大叔。吉米又从头讲了一遍老蟾蜍先生的事。听到老蟾蜍先生夸自己的嗓音美妙，比利大叔也咯咯笑起来，跟他们俩笑得一模一样。不过，比利大叔的脑袋虽小，却精明得很。笑了几分钟，他忽然停住了。
        - id: ch01-b20
          speaker: uncle_billy_possum
          text: 俺早就明白啦，街坊邻居的事儿，俺哪能样样都知道。咱们嫌蟾蜍兄弟长得丑，嫌了这么多年，没准儿真漏看了他的什么本事。俺是不大信他会唱歌，可他兴许真以为自个儿会。要不，咱们去微笑池瞧瞧，看他究竟在忙什么？
        - id: ch01-b21
          speaker: peter_rabbit
          text: 对，就这么办！
          emotion: happy
        - id: ch01-b22
          speaker: narrator
          text: 彼得兴奋得高高踢起后腿。你知道，只要能满足好奇心，不管去哪里，不管做什么，他都乐意得很。
        - id: ch01-b23
          speaker: narrator
          text: 臭鼬吉米又想了几分钟。他反正没什么要紧事，路上说不定还能找到肥甲虫，于是也决定一起去。他们就这样动身追赶老蟾蜍先生。照老样子，兔子彼得跑在最前面。负鼠比利大叔排在第二，脸上挂着只有他才会有的那种咧嘴笑。臭鼬吉米落在最后，不紧不慢地走着，还一路睁大眼睛，留意哪里有肥甲虫。
