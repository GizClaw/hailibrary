audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, curious, and gently teasing
        timbre: mellow and bright
        pace: relaxed
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, inquisitive, and quick to react
        timbre: light and youthful
        pace: brisk
        pitch: medium-high
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: shrewd, genial, and richly conversational
        timbre: warm and slightly raspy
        pace: leisurely
        pitch: medium-low
  chapters:
    - id: ch01
      title: Jimmy Skunk Consults His Friends
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jimmy Skunk scratched his head and watched Old Mr. Toad go down the Lone Little Path. Hop, hop, hipperty-hop, he went toward the Smiling Pool. Jimmy was truly puzzled. He would have found it just as easy to believe that Mr. Toad could fly as to believe that he had a beautiful voice. In fact, Jimmy did not believe him at all. He thought Mr. Toad was trying to fool him.
        - id: ch01-b02
          speaker: narrator
          text: Before long, Peter Rabbit came by. He found Jimmy sitting deep in thought. Jimmy had even forgotten to hunt for fat beetles, and when that happens, you can be sure he is thinking very hard.
        - id: ch01-b03
          speaker: peter_rabbit
          text: Hello, old Striped-coat! What's on your mind this fine morning?
        - id: ch01-b04
          speaker: jimmy_skunk
          text: Him.
        - id: ch01-b05
          speaker: narrator
          text: Jimmy gave that one simple answer and pointed down the Lone Little Path. Peter turned and looked to see who Jimmy meant.
        - id: ch01-b06
          speaker: peter_rabbit
          text: You mean Old Mr. Toad?
        - id: ch01-b07
          speaker: narrator
          text: Jimmy nodded.
        - id: ch01-b08
          speaker: jimmy_skunk
          text: Do you notice anything strange about him?
        - id: ch01-b09
          speaker: narrator
          text: Peter stared down the path, watching Mr. Toad as carefully as he could.
        - id: ch01-b10
          speaker: peter_rabbit
          text: No. Only that he seems to be in a great hurry.
        - id: ch01-b11
          speaker: jimmy_skunk
          text: Exactly! Have you ever seen him hurry when he wasn't frightened?
        - id: ch01-b12
          speaker: narrator
          text: Peter admitted that he never had.
        - id: ch01-b13
          speaker: jimmy_skunk
          text: Well, he isn't frightened now. Just look at him go! He says he has a beautiful voice. He has to sing in the spring chorus at the Smiling Pool, and he's late.
        - id: ch01-b14
          speaker: narrator
          text: Peter studied Jimmy's face very carefully. He wanted to know whether Jimmy was fooling him or telling the truth. Then Peter burst out laughing.
        - id: ch01-b15
          speaker: peter_rabbit
          text: Old Mr. Toad, singing? What an idea! He can sing as well as I can, which means not at all!
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: Jimmy grinned.
        - id: ch01-b17
          speaker: jimmy_skunk
          text: If you ask me, he's gone crazy. But he sounded as serious as if every word were true. Maybe he ate something that muddled his head. Look, Unc' Billy Possum is over there. Let's see what he thinks.
        - id: ch01-b18
          speaker: narrator
          text: Jimmy and Peter went over to Unc' Billy, and Jimmy told him the whole story about Old Mr. Toad. At first, Unc' Billy chuckled and laughed just as they had. The thought of Old Mr. Toad claiming to have a beautiful voice seemed very funny. But Unc' Billy had a shrewd little head on his shoulders. After a few minutes, his laughter stopped.
        - id: ch01-b19
          speaker: unc_billy_possum
          text: Ah learned a long time ago that Ah don't know everything about mah neighbors. We-uns have thought Brer Toad was ugly for so long, maybe we missed something. Ah don't reckon he can sing, though perhaps he believes he can. Why don't we-uns go down to the Smiling Pool and find out what he's really doing?
        - id: ch01-b20
          speaker: peter_rabbit
          text: That's just what we should do!
          emotion: happy
        - id: ch01-b21
          speaker: narrator
          text: Peter kicked up his heels. He was always ready to go anywhere or do anything that might satisfy his curiosity.
        - id: ch01-b22
          speaker: narrator
          text: Jimmy thought the idea over for a few minutes before deciding. He had nothing in particular to do, and he might find some fat beetles along the way, so he agreed to go too.
        - id: ch01-b23
          speaker: narrator
          text: Off they went after Old Mr. Toad. Peter Rabbit led the way, as usual. Unc' Billy Possum came next, wearing the special grin that only he could grin. Jimmy Skunk followed at the rear, taking his time and watching closely for fat beetles.
