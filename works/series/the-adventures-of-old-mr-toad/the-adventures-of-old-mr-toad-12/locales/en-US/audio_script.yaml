audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, curious, and openly expressive
        timbre: youthful and clear
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Old Mr. Toad Shows His Tongue
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Showing your tongue is not considered polite, as you know. But what if your tongue were like Mr. Toad's? You might want to show it too.
        - id: ch01-b02
          speaker: narrator
          text: I'm quite sure you would. Old Mr. Toad's tongue is so remarkable that everyone would want to see it. He considers it the finest tongue in the world. He is certain he could never manage without it, and perhaps he is right.
        - id: ch01-b03
          speaker: narrator
          text: Still, very few of his neighbors know how different it is from other tongues. Peter Rabbit knew nothing about it until Mr. Toad showed him. Before that, Peter had puzzled and puzzled over the way bugs and flies vanished whenever they came within two inches of Mr. Toad.
        - id: ch01-b04
          speaker: narrator
          text: Peter understood that Mr. Toad's tongue could reach two inches beyond his mouth. What he could not understand was where such a long tongue went when Mr. Toad was not catching bugs with it, or how he managed it at all. So he asked.
        - id: ch01-b05
          speaker: old_mr_toad
          text: I'll show you. Once you see my tongue, you'll wish you had one just like it.
        - id: ch01-b06
          speaker: narrator
          text: There was a twinkle in Mr. Toad's eyes. He opened his wide mouth and slowly stretched his tongue out as far as it would go.
        - id: ch01-b07
          speaker: peter_rabbit
          text: Why... why, it's attached at the wrong end!
          emotion: surprised
        - id: ch01-b08
          speaker: old_mr_toad
          text: It certainly is not! If it were attached at the other end, how could I stretch it out this far?
          emotion: angry
        - id: ch01-b09
          speaker: peter_rabbit
          text: But my tongue, and every other tongue I've seen, is attached far back in the throat. Yours is attached right at the front of your mouth. I've never heard of anything like that.
        - id: ch01-b10
          speaker: old_mr_toad
          text: Peter Rabbit, there are plenty of things you've never heard of. My tongue is made the right way. Since it's attached at the front, I can use every bit of it and send it out to its full length.
        - id: ch01-b11
          speaker: old_mr_toad
          text: When I pull it back with a bug on the end, I flip it over. The end that was outside goes straight to the back of my throat and carries the bug to exactly the right place for swallowing.
        - id: ch01-b12
          speaker: narrator
          text: Peter considered all of this for a few minutes. He turned the explanation over in his mind until it began to make sense. Then he dared to ask one more question.
        - id: ch01-b13
          speaker: peter_rabbit
          text: I think I understand now. But how do you keep the bug stuck to your tongue?
        - id: ch01-b14
          speaker: old_mr_toad
          text: My tongue is sticky, of course, Mr. Stupid. All I have to do is touch a bug with it, and that bug belongs to me.
          emotion: disgusted
        - id: ch01-b15
          speaker: narrator
          text: Mr. Toad looked thoroughly disgusted. Peter thought over the answer, then felt his own tongue.
        - id: ch01-b16
          speaker: peter_rabbit
          text: Mine isn't sticky.
        - id: ch01-b17
          speaker: narrator
          text: Peter said it with complete innocence, and Mr. Toad burst out laughing.
        - id: ch01-b18
          speaker: old_mr_toad
          text: Maybe that's why you can ask so many questions! Now watch while I catch that fly.
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: His funny little tongue shot out. In an instant, the fly was gone.
        - id: ch01-b20
          speaker: peter_rabbit
          text: It certainly is useful. I think we're going to have more rain, so I'd better head back to the dear Old Briar-patch. Thank you very much, Mr. Toad. I think you're quite wonderful.
        - id: ch01-b21
          speaker: old_mr_toad
          text: Not at all. I simply have what I need to live, just as you have what you need. I couldn't manage with a tongue like yours, and you couldn't manage with mine.
        - id: ch01-b22
          speaker: old_mr_toad
          text: If you live long enough, you'll learn that Old Mother Nature makes no mistakes. She gives each of us what we need, because each of us has different needs.
