audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 见多识广，直率中带着固执
        timbre: 粗粝厚实
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十二章　老蟾蜍先生亮出舌头
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 伸舌头给人看，大家都知道，这可算不上有礼貌。可要是你的舌头跟老蟾蜍先生的一样，你也会想亮出来给人瞧瞧吧？
        - id: ch01-b02
          speaker: narrator
          text: 我敢说，你一定会。那是一条多么神奇的舌头啊，谁有了它，恐怕都恨不得让大家开开眼。老蟾蜍先生更觉得，世上没有比它更称心的舌头了。少了它，他根本没法过日子。可他的邻居很少知道这条舌头有什么特别，兔子彼得起初也不知道。
        - id: ch01-b03
          speaker: narrator
          text: 彼得只发现了一件怪事。虫子和苍蝇只要来到老蟾蜍先生两英寸以内，就会莫名其妙地消失。他想来想去，怎么也猜不透。后来，老蟾蜍先生终于把自己的舌头亮了出来。
        - id: ch01-b04
          speaker: narrator
          text: 彼得首先想知道，一条能伸出嘴巴两英寸的舌头，平时到底该放在哪里。他便直接问了出来。
        - id: ch01-b05
          speaker: old_mr_toad
          text: 我把舌头亮给你看。等你看清楚了，准会希望自己也有一条一模一样的。
        - id: ch01-b06
          speaker: narrator
          text: 老蟾蜍先生眼里闪着顽皮的光。他张开大嘴，慢慢把舌头一直伸到最长。
        - id: ch01-b07
          speaker: peter_rabbit
          text: 咦！咦——！您的舌头接反啦！
          emotion: surprised
        - id: ch01-b08
          speaker: old_mr_toad
          text: 根本没有！要是接在另一头，我还怎么把它伸得这么远？
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: 老蟾蜍先生一下子生气了，可彼得还是不服。
        - id: ch01-b10
          speaker: peter_rabbit
          text: 可我的舌头，还有我见过的所有舌头，明明都接在喉咙深处。您的却接在嘴巴最前面，跟大家正好相反。我从来没听说舌头还能这样长。
        - id: ch01-b11
          speaker: old_mr_toad
          text: 兔子彼得，你没听说过的事还多着呢。像我这样接才对。舌头接在嘴巴前面，我才能把整条舌头都用上。你刚才也看见了，它能一下伸到最远。
        - id: ch01-b12
          speaker: old_mr_toad
          text: 舌尖粘住虫子以后，我再把舌头收回来，顺势一翻。刚才伸在外面的那一头就翻到了喉咙深处，也把虫子送到了正好吞下去的地方。
        - id: ch01-b13
          speaker: narrator
          text: 彼得把这番话仔细琢磨了几分钟，才又问下去。
        - id: ch01-b14
          speaker: peter_rabbit
          text: 我好像有点儿明白了。可是，虫子怎么会牢牢粘在您的舌头上呢？
        - id: ch01-b15
          speaker: old_mr_toad
          text: 我的舌头当然是黏的，傻瓜先生。只要让我碰到一只虫子，它每次都休想逃掉。
          emotion: disgusted
        - id: ch01-b16
          speaker: narrator
          text: 老蟾蜍先生满脸嫌弃。彼得却认真想了想，还伸手摸了摸自己的舌头。
        - id: ch01-b17
          speaker: peter_rabbit
          text: 我的舌头一点儿也不黏。
        - id: ch01-b18
          speaker: narrator
          text: 彼得说得天真极了，老蟾蜍先生顿时放声大笑。
        - id: ch01-b19
          speaker: old_mr_toad
          text: 哈！你的舌头要是也黏，说不定就没法问出这么多问题了。好啦，看着我怎么捉住那只苍蝇。
        - id: ch01-b20
          speaker: narrator
          text: 他那条滑稽的小舌头倏地弹了出去。下一刻，苍蝇已经没了踪影。
        - id: ch01-b21
          speaker: peter_rabbit
          text: 这条舌头的确很方便。我看天又要下雨了，还是赶快回我亲爱的老荆棘丛吧。多谢您，老蟾蜍先生。您可真了不起。
        - id: ch01-b22
          speaker: narrator
          text: 彼得说得客客气气。老蟾蜍先生却不觉得自己有什么了不起。
        - id: ch01-b23
          speaker: old_mr_toad
          text: 这没什么。我只是长着自己生活所需的东西，就像你也长着自己需要的东西。换成你的舌头，我没法过日子。可你要是换成我的，也一样过不了。
        - id: ch01-b24
          speaker: old_mr_toad
          text: 等你活得够久，就会明白大自然妈妈从不出错。她会把我们需要的东西，分别给到我们每一个人，因为每个人的需要都不一样。
