audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 见多识广，直率中带着固执
        timbre: 粗粝厚实
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十四章　老蟾蜍先生不见了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 做错事情就认错，千万别再往后拖。
        - id: ch01-b02
          speaker: narrator
          text: 老蟾蜍先生生彼得的气，彼得一点儿也不怪他。毕竟，别人换衣裳的时候偷看，本来就不体面。老蟾蜍先生费力地从旧衣裳里挣脱出来，那样子实在好笑，彼得没能忍住，竟当面笑起了他。可他也明白，自己刚才太没礼貌，于是老老实实地认了错。
        - id: ch01-b03
          speaker: peter_rabbit
          text: 事情是这样的。我听到那块旧木板下面有声音，就顺手把木板翻开，想看看那里有什么。
        - id: ch01-b04
          speaker: narrator
          text: 老蟾蜍先生只从鼻子里哼了一声。
        - id: ch01-b05
          speaker: peter_rabbit
          text: 我根本不知道您躲在下面。等我认出是您，又看到您在换衣裳，就觉得太有意思了，忍不住看了下去。您的样子真的很好笑，我这才笑出了声。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 可我真的很抱歉，蟾蜍先生，真心向您道歉。我不是故意要这么无礼。我保证，以后绝不会再犯了。您可以用这种办法换衣裳，自己也许一点儿不觉得稀奇，可在我看来实在神奇。
        - id: ch01-b07
          speaker: peter_rabbit
          text: 我早就听说，您会把脱下来的旧衣裳吞进肚里，可我以前连一半都不肯相信。现在我亲眼看见这是真的，也终于弄懂您是怎么办到的。我觉得自己学到了一件很值得知道的事。
        - id: ch01-b08
          speaker: peter_rabbit
          text: 您知道吗？在我所有的邻居当中，您大概是最有趣、也最了不起的一个。蟾蜍先生，以后我再也不会笑话您，也不会拿您打趣了。
        - id: ch01-b09
          speaker: narrator
          text: 老蟾蜍先生又哼了一声，心里却有点儿得意。彼得对他这么感兴趣，显然很让他受用，他原先的好脾气也很快就回来了。
        - id: ch01-b10
          speaker: peter_rabbit
          text: 还有件事我一直不明白。整个冬天，您都睡在哪里？您是不是也像青蛙爷爷一样，钻进微笑池底的泥里？
        - id: ch01-b11
          speaker: old_mr_toad
          text: 当然不是！兔子彼得，你动脑筋想想。我要是在微笑池里过冬，难道会先离开那里，大老远来到这儿，又立刻掉头回池子唱歌吗？我可没喜欢长途旅行到那种地步。
        - id: ch01-b12
          speaker: peter_rabbit
          text: 对呀。刚才说话的时候，我没想到这一点。
        - id: ch01-b13
          speaker: narrator
          text: 彼得看起来傻乎乎的。
        - id: ch01-b14
          speaker: old_mr_toad
          text: 你和许多人都有同一个毛病，总是先把话说出口，过后才肯动脑筋。还得是你们当真肯动脑筋才行。现在只要我愿意，我马上就能在这里消失。
        - id: ch01-b15
          speaker: peter_rabbit
          text: 我明白了。您又要像刚才那样，躲到旧木板下面去。
        - id: ch01-b16
          speaker: narrator
          text: 彼得摆出一副什么都看透了的神情。
        - id: ch01-b17
          speaker: old_mr_toad
          text: 根本不是！我不用靠近那块木板，也能消失。我连一步都不必往那边挪。
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 彼得朝四面八方仔细看了又看。除了那块旧木板，附近根本没有任何东西能让老蟾蜍先生藏身。可老蟾蜍先生已经明明白白地说了，他不会藏到木板下面。
        - id: ch01-b19
          speaker: peter_rabbit
          text: 蟾蜍先生，我不是非要怀疑您。不过，您得让我亲眼看见，我才相信。
        - id: ch01-b20
          speaker: narrator
          text: 老蟾蜍先生的眼睛闪了闪。彼得刚才偷看他换衣裳，现在机会送上了门，他总算可以把这一回还给彼得了。
        - id: ch01-b21
          speaker: old_mr_toad
          text: 你转过身去，顺着弯弯小径一直往前看。只要看足五分钟，我就会消失。不光如此，我还可以用名誉担保，绝不会跳到离我现在坐的地方三英尺以外。
        - id: ch01-b22
          speaker: peter_rabbit
          text: 好。我就朝弯弯小径前面看五分钟，保证不回头偷瞧。
        - id: ch01-b23
          speaker: narrator
          text: 彼得背过身，坐在那里直盯着弯弯小径。他特别想把眼珠往后一转，偷偷看看背后发生了什么。那股诱惑实在很难抵挡。可他已经亲口答应不偷看，就一直忍着，果真没有回头。觉得五分钟到了，他才转过身。
        - id: ch01-b24
          speaker: narrator
          text: 老蟾蜍先生不见了。彼得连忙看看这边，又看看那边，哪里都没有他的踪影。他消失得干干净净，就像从来没在那里待过一样。
