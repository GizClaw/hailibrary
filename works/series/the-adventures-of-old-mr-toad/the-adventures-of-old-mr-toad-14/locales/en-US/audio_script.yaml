audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, curious, and openly expressive
        timbre: youthful and clear
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Old Mr. Toad Disappears
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When you have done something wrong, admit it. And don't wait too long.
        - id: ch01-b02
          speaker: narrator
          text: Peter Rabbit couldn't blame Old Mr. Toad one bit for being angry. Peter had watched him change his suit, and that wasn't a nice thing to do. Mr. Toad had looked very funny as he struggled to get out of his old suit, and Peter simply hadn't been able to stop himself from laughing. But now he understood just how rude he had been. So he spoke to Mr. Toad very meekly and admitted it.
        - id: ch01-b03
          speaker: peter_rabbit
          text: This is what happened. I heard something beneath that old board, so of course I turned it over to see what was there.
        - id: ch01-b04
          speaker: old_mr_toad
          text: Hmph!
          emotion: angry
        - id: ch01-b05
          speaker: peter_rabbit
          text: I didn't have the least idea you were under it. Once I found out it was you and saw what you were doing, it was all so interesting that I couldn't help watching. And you really did look funny, so I couldn't help laughing. But I am sorry, Mr. Toad. I truly am. I never meant to be rude, and I promise I won't ever do it again.
        - id: ch01-b06
          speaker: peter_rabbit
          text: Changing your suit that way may not seem wonderful to you, but it does to me. I had heard that you swallow your old suits, though I hardly believed it. Now I've seen that it's true and learned exactly how you do it. That's something worth knowing. Why, I think you're one of the most interesting and wonderful neighbors I have. I'll never laugh at you or tease you again, Mr. Toad.
        - id: ch01-b07
          speaker: old_mr_toad
          text: Hmph!
        - id: ch01-b08
          speaker: narrator
          text: Mr. Toad still grunted, but it was easy to see that Peter's interest had flattered him a little. His good nature was coming back fast.
        - id: ch01-b09
          speaker: peter_rabbit
          text: There's still one thing I don't understand. Where do you sleep all winter? Do you bury yourself in the mud at the bottom of the Smiling Pool, the way Grandfather Frog does?
        - id: ch01-b10
          speaker: old_mr_toad
          text: Of course not! Use your common sense, Peter Rabbit. If I spent the winter in the Smiling Pool, why would I leave it, come all the way up here, and then turn around and go back there to sing? I don't enjoy long trips that much.
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: Peter looked foolish.
        - id: ch01-b12
          speaker: peter_rabbit
          text: You're right. I didn't think of that before I spoke.
        - id: ch01-b13
          speaker: old_mr_toad
          text: That's your trouble, and plenty of other people have it too. You speak first, then think afterward, if you think at all. Now, I could disappear right here if I wanted to.
        - id: ch01-b14
          speaker: peter_rabbit
          text: You mean you'd hide under that old board again.
        - id: ch01-b15
          speaker: narrator
          text: Peter looked very wise as he said it.
        - id: ch01-b16
          speaker: old_mr_toad
          text: Nothing like that! I could disappear without going anywhere near that board. I wouldn't take even one step toward it.
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: Peter looked carefully in every direction. He couldn't see a single thing that Mr. Toad could possibly hide beneath, except for the old board. And Mr. Toad had plainly said he wouldn't hide there.
        - id: ch01-b18
          speaker: peter_rabbit
          text: I don't want to doubt you, Mr. Toad, but I'll have to see it before I can believe you.
        - id: ch01-b19
          speaker: narrator
          text: Mr. Toad's eyes twinkled. Here was his chance to pay Peter back for watching him change his suit.
        - id: ch01-b20
          speaker: old_mr_toad
          text: Turn your back to me and stare straight down the Crooked Little Path for five minutes. Then I'll disappear. And I give you my word of honor that I won't hop three feet from this spot.
        - id: ch01-b21
          speaker: peter_rabbit
          text: All right. I'll watch the Crooked Little Path for five minutes, and I promise I won't peek.
        - id: ch01-b22
          speaker: narrator
          text: Peter promptly turned his back and sat gazing straight down the Crooked Little Path. It was a great temptation to roll his eyes around and steal a peep behind him. But Peter had given his word that he wouldn't peek, and he kept his promise.
        - id: ch01-b23
          speaker: narrator
          text: When Peter thought the five minutes were over, he turned around. Old Mr. Toad was nowhere to be seen. Peter looked quickly this way and that, searching all around the spot where Mr. Toad had been sitting. But there wasn't a sign of him anywhere.
        - id: ch01-b24
          speaker: narrator
          text: Old Mr. Toad had disappeared as completely as if he had never been there.
