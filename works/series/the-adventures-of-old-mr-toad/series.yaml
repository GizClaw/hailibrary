cover_prompt: |-
  A wordless cover scene at the Smiling Pool on the Green Meadows in rural America around 1920 shows a homely broad-bodied toad singing in the spring chorus. The toad sits half-submerged among fresh green reeds, his beautiful jewel-bright eyes lifted and the loose music bag beneath his chin swelling round as he sings. A curious brown rabbit with long upright ears, a black-and-white striped skunk, and a gray opossum crouch together on the low bank, watching in delighted surprise. The expanding throat and the three friends' discovery form the clear focal action, with rippling water, young meadow grass, and the Purple Hills establishing the gentle spring setting. Use a wide child-height view that keeps the animals anatomically believable and leaves calm open morning sky across the top. Keep every animal original, warm, and child-friendly, independent of all film and animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
