audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 老实稳重，紧张时气息急促而不失真诚
        timbre: 粗哑温厚
        pace: 平时缓慢，慌张时断续
        pitch: 中低音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 随和机灵，客气中带着一点心照不宣的笑意
        timbre: 柔和微哑
        pace: 从容轻快
        pitch: 中低音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直爽厚道，笑起来朴实而痛快
        timbre: 圆润厚实
        pace: 平稳适中
        pitch: 中音
    danny_meadow_mouse:
      display_name: 田鼠丹尼
      tts:
        delivery: 友善直率，话里常带一点温和的打趣
        timbre: 细小温暖
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十三章　老蟾蜍先生变得十分谦逊
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老蟾蜍先生一瞧见黑蛇先生，立刻把巴斯特熊和那顿丰盛晚餐全丢在身后。他满脑子只想着一件事，那就是赶快逃到黑蛇先生看不见的地方。
        - id: ch01-b02
          speaker: narrator
          text: 他忘了该请巴斯特原谅自己的失礼，也忘了自己又热又累。刚才还把他撑得鼓鼓的骄傲，更是一下子没了踪影。现在他除了害怕黑蛇先生，心里再也装不下别的感觉。
        - id: ch01-b03
          speaker: narrator
          text: 老蟾蜍先生拼命往前逃。蹦，蹦，扑通一跳！蹦，蹦，又扑通一跳！身后传来了兔子彼得、臭鼬吉米、土拨鼠约翰尼，还有其他老朋友和老邻居们的笑声。他连巴斯特那低沉的、轰隆隆的大笑也听见了，可这时候，他哪里还顾得上这些。
        - id: ch01-b04
          speaker: narrator
          text: 逃了一阵，他不得不停下来。两条腿实在太累，再也跳不动了。他喘得呼哧作响，钻到一大片树皮底下，紧贴着地面趴好，接着一口又一口地喘气。
        - id: ch01-b05
          speaker: narrator
          text: 他要在这里一直躲到快活、圆润、明亮的太阳先生落到紫山后面去睡觉。到那时候，黑蛇先生也会睡下，他就能平安回家了。
        - id: ch01-b06
          speaker: narrator
          text: 大树皮底下一片漆黑。老蟾蜍先生躺在那里，终于能静下心来想想刚才的事。慢慢地，他全明白了。巴斯特熊请他吃饭，原来正是朋友们计划的一部分。
        - id: ch01-b07
          speaker: narrator
          text: 他被骄傲冲昏头脑以后，冷落了老朋友和老邻居，还瞧不起他们。大家便合计出这个办法，想让他受点教训。一开始，他气得不得了。后来，他渐渐看出自己有多愚蠢、多可笑，怒气也一点点变成了羞愧。
        - id: ch01-b08
          speaker: narrator
          text: 每逢想起巴斯特那低沉的、轰隆隆的笑声，他就更觉得羞愧。
        - id: ch01-b09
          speaker: old_mr_toad
          text: 这是我应得的。不错，先生，一点也不冤。我只有一件事值得骄傲，那就是我为人诚实，靠干活养活自己。不错，先生，就这一件。
        - id: ch01-b10
          speaker: narrator
          text: 天终于黑了。老蟾蜍先生从树皮底下爬出来，准备回家。这一回，他已经谦卑多了。偏巧兔子彼得从旁边走来。老蟾蜍先生张开嘴，正要跟他搭话，彼得却猛地把头抬得老高，昂首阔步地走了过去，就像根本没看见他。
        - id: ch01-b11
          speaker: narrator
          text: 老蟾蜍先生咽了口唾沫，只好继续往前走。没多久，他又碰见臭鼬吉米。吉米只管忙自己的事，竟从老蟾蜍先生身上直接跨了过去，好像地上躺着的不过是一根木棍或一块石头。
        - id: ch01-b12
          speaker: narrator
          text: 老蟾蜍先生又咽了口唾沫，默默走开了。第二天，他下到草地去找田鼠丹尼。他想告诉丹尼，自己从前那样对待丹尼和其他朋友，实在羞愧得很。可是丹尼连一眼也没看他，就从他身边擦了过去。
        - id: ch01-b13
          speaker: narrator
          text: 老蟾蜍先生又咽了一口，只得去找土拨鼠约翰尼。约翰尼也装作没看见他。后来遇见花栗鼠，情形还是一模一样。
        - id: ch01-b14
          speaker: narrator
          text: 老蟾蜍先生终于死了心，垂头丧气地回到家。他在一片大毛蕊花叶子底下坐了大半天，心里又难过又孤单。他连一只苍蝇也不想捉来吃。
        - id: ch01-b15
          speaker: narrator
          text: 下午很晚的时候，他忽然听见一点动静。抬头一看，所有老朋友和老邻居都来了，正围着他站成一个圆圈。紧接着，大家跳起舞来，一同高声唱道。
        - id: ch01-b16
          speakers: [peter_rabbit, jimmy_skunk, johnny_chuck, danny_meadow_mouse]
          ensemble: chorus
          text: 老蟾蜍先生真是个好伙伴！他的脾气温和，性情又和善！如今骄傲的泡泡已经戳穿，他也明白朋友永远值得信赖！
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: 老蟾蜍先生这才知道，一切又都好起来了。不一会儿，他也加入大家，跟着跳起舞来。那是世上从来没人见过的、最滑稽的一支舞。
        - id: ch01-b18
          speaker: narrator
          text: 模样难看的老蟾蜍先生，他的故事暂且就说到这里。因为我得赶快讲讲另一个模样难看的家伙。他是浑身带刺的豪猪波基，身上背着一千根小长矛。下一本书，就要把他的历险全都讲给你听。
