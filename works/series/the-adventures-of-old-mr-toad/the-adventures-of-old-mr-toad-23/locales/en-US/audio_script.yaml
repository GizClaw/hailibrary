  chapters:
    - id: ch01
      title: Old Mr. Toad Is Very Humble
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The moment Old Mr. Toad saw Mr. Blacksnake, he turned away from Buster Bear and the fine dinner Buster had offered him. One thought filled his head. He had to get out of Mr. Blacksnake's sight as fast as he could.
        - id: ch01-b02
          speaker: narrator
          text: He didn't excuse himself to Buster. He forgot how hot and tired he was, and all his swollen pride vanished. Nothing mattered now except getting away. Off he went, hop, hop, hipperty-hop, hop, hop, hipperty-hop!
        - id: ch01-b03
          speaker: narrator
          text: Behind him, Peter Rabbit, Jimmy Skunk, Johnny Chuck, and the other neighbors shouted with laughter. Buster Bear's deep, grumbly-rumbly laugh joined them. Mr. Toad didn't care. Not then. He was too frightened of Mr. Blacksnake to feel anything else.
        - id: ch01-b04
          speaker: narrator
          text: After a while, his legs simply gave out and would not carry him another step. He was wheezing for breath. Mr. Toad crawled beneath a large piece of bark, stretched flat on the ground, and panted and panted. He meant to stay there until round, bright Mr. Sun went to bed behind the Purple Hills. By then Mr. Blacksnake would be asleep too, and Mr. Toad could travel home safely.
        - id: ch01-b05
          speaker: narrator
          text: It was dark under the bark, and Mr. Toad had plenty of time to think. Slowly he understood. The dinner invitation had been part of a plan. His old friends and neighbors, the very ones he had snubbed and looked down on when pride had puffed him up, had decided to teach him a lesson.
        - id: ch01-b06
          speaker: narrator
          text: At first he was furious. Then he saw how foolish he had been, and anger gave way to shame. Every time he remembered Buster's deep, grumbly-rumbly laughter, he felt more ashamed.
        - id: ch01-b07
          speaker: old_mr_toad
          text: I earned this. Yes, sir, every bit of it. The only thing I can honestly be proud of is that I work for my living. That's all.
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: Darkness finally came. Mr. Toad crept out and started home, feeling very humble. Just then Peter Rabbit came along. Mr. Toad opened his mouth to speak, but Peter tossed his head high and strutted past without seeming to notice him. Mr. Toad gulped and kept going.
        - id: ch01-b09
          speaker: narrator
          text: Soon he met Jimmy Skunk. Jimmy went on about his business and stepped straight over Mr. Toad as though he were no more than a stick or stone. Mr. Toad gulped once more and went on.
        - id: ch01-b10
          speaker: narrator
          text: The next day he went to see Danny Meadow Mouse. He wanted to tell Danny how sorry he was for the way he had treated him and all the others. But Danny brushed past without even looking at him.
        - id: ch01-b11
          speaker: narrator
          text: Mr. Toad gulped and set off to find Johnny Chuck. Once again, exactly the same thing happened. Later, when he met Striped Chipmunk, his old friend treated him in the same way too.
        - id: ch01-b12
          speaker: narrator
          text: At last Mr. Toad gave up and went home. He sat beneath a broad mullein leaf for the rest of the day, very miserable and lonely. He had so little appetite that he didn't snap at even one fly.
        - id: ch01-b13
          speaker: narrator
          text: Late that afternoon, he heard a small noise. He looked up and saw all his old friends and neighbors making a circle around him. Without warning, they began to dance and shout.
        - id: ch01-b14
          speakers: [peter_rabbit, jimmy_skunk, johnny_chuck, danny_meadow_mouse]
          ensemble: chorus
          text: Old Mr. Toad is a jolly good fellow! His temper is sweet, and his nature is mellow! Now that his big bubble of pride has been busted, we know that he knows all his friends can be trusted!
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: Then Mr. Toad knew that everything was right again. Before long, he joined the dancing with the funniest dance anyone had ever seen.
        - id: ch01-b16
          speaker: narrator
          text: That is all for now about homely Old Mr. Toad. There is another homely fellow I must tell you about. His name is Prickly Porky the Porcupine, and he carries a thousand little spears. The next book tells the story of his adventures.
