audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, eager, and openly curious
        timbre: youthful and clear
        pace: quick
        pitch: medium-high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, curious, and gently teasing
        timbre: mellow and bright
        pace: relaxed
        pitch: medium
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: soft-spoken, watchful, and warmly amused
        timbre: mellow and slightly raspy
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Old Mr. Toad's Music Bag
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Never suppose you have learned everything there is to know. Thinking that is the surest way to show how little you know.
        - id: ch01-b02
          speaker: peter_rabbit
          text: I found Old Mr. Toad!
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: Peter Rabbit called out as he hurried after Jimmy Skunk.
        - id: ch01-b04
          speaker: jimmy_skunk
          text: Where did you find him?
        - id: ch01-b05
          speaker: peter_rabbit
          text: In the water! He's sitting where it's shallow, and he never noticed me. Let's find Unc' Billy. Then we can creep over to the edge of the Smiling Pool and see if Old Mr. Toad truly does try to sing.
        - id: ch01-b06
          speaker: narrator
          text: They found Unc' Billy Possum, and all three slipped quietly to the edge of the Smiling Pool. The bank was low there, and the water was shallow. Sure enough, Old Mr. Toad sat in the pool with only his head above water. As they watched, something very strange began to happen.
        - id: ch01-b07
          speaker: peter_rabbit
          text: Wh-what's happening to him?
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: Peter whispered, and his big eyes looked ready to pop right out of his head.
        - id: ch01-b09
          speaker: jimmy_skunk
          text: If he isn't careful, he's going to swell up and burst!
          emotion: surprised
        - id: ch01-b10
          speaker: unc_billy_possum
          text: Listen! Are mah old ears hearing right? Seems to me that song is coming straight from where Brer Toad is sitting.
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: It certainly seemed to be. Of all the songs heard on that happy spring day, none was sweeter. Very few were even as sweet. There was only one trouble. The song was terribly short and lasted just two or three seconds.
        - id: ch01-b12
          speaker: narrator
          text: The moment it ended, Old Mr. Toad looked like himself again. He was as ordinary, and almost as ugly, as ever. Peter stared at Jimmy. Jimmy stared at Unc' Billy. Unc' Billy stared back at Peter. Not one of them could think of a thing to say. Then all three turned to look at Old Mr. Toad once more.
        - id: ch01-b13
          speaker: narrator
          text: While they watched, his throat began to swell. It grew bigger and bigger and bigger. Now they could understand why Jimmy had thought he might burst. At last the swelling stopped, and those lovely little notes came floating out again. They were so sweet and trembled so gently that Peter held his breath to hear them.
        - id: ch01-b14
          speaker: narrator
          text: There could be no doubt now. Old Mr. Toad was singing, exactly as he had promised. And his voice really was one of the sweetest in the whole chorus around the Smiling Pool. It might even have been the sweetest of all. That was hard to believe. But Peter, Jimmy, and Unc' Billy had seen it and heard it themselves. That was proof enough. As the three friends listened, their respect for Old Mr. Toad grew and grew.
        - id: ch01-b15
          speaker: peter_rabbit
          text: How can he do that?
        - id: ch01-b16
          speaker: jimmy_skunk
          text: He does it with that bag under his chin, of course. Look! He only sings when the bag is puffed out. It must be a real music bag. I never even knew he had one there.
        - id: ch01-b17
          speaker: peter_rabbit
          text: I wish I had a music bag like that in my throat.
        - id: ch01-b18
          speaker: narrator
          text: Peter felt his own throat as he spoke. Then he joined Jimmy and Unc' Billy in laughing, though there was still a wistful look in his eyes.
