audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 从容淘气，打趣时眼里带笑
        timbre: 圆润略低沉
        pace: 从容偏慢
        pitch: 中低音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢悠悠又诙谐，乡音亲切自然
        timbre: 沙哑温厚
        pace: 舒缓从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第五章　老蟾蜍先生的音乐袋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 千万别以为自己学会了不少，就把世间所有事情都已知晓。这样想，恰恰最能显出一个人有多么无知可笑。
        - id: ch01-b02
          speaker: narrator
          text: 兔子彼得急匆匆地追上臭鼬吉米。
        - id: ch01-b03
          speaker: peter_rabbit
          text: 我找到老蟾蜍先生啦！
        - id: ch01-b04
          speaker: jimmy_skunk
          text: 他在哪儿呀？
        - id: ch01-b05
          speaker: peter_rabbit
          text: 就在水里！他坐在那边的浅水中，根本没有瞧见我。我们叫上比利大叔，再偷偷靠近微笑池边，看看他到底会不会唱歌。
        - id: ch01-b06
          speaker: narrator
          text: 他们找到负鼠比利大叔，三个伙伴放轻脚步，悄悄来到微笑池边。这里岸低水浅。老蟾蜍先生果然坐在水中，只把脑袋露在外面。他们正盯着他，一件怪事发生了。
        - id: ch01-b07
          speaker: peter_rabbit
          text: 他……他怎么回事？
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: 彼得压低了声音，两只大眼睛瞪得快要掉出来了。
        - id: ch01-b09
          speaker: jimmy_skunk
          text: 他要是还不小心点儿，准会越胀越大，砰的一声破掉！
          emotion: surprised
        - id: ch01-b10
          speaker: unc_billy_possum
          text: 快听！俺这双老耳朵没弄错吧？这歌声听着像是从蟾蜍老弟那边传来的。
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: 歌声的确是从那里传来的。这个快活的春日里，再没有哪一支歌比它更甜美，能和它一样好听的也少极了。唯一的遗憾是歌声太短，只唱了两三秒钟就停了。歌声一停，老蟾蜍先生又变回平常的模样，普普通通，甚至和往常一样有点儿难看。
        - id: ch01-b12
          speaker: narrator
          text: 彼得望望臭鼬吉米，吉米瞧瞧负鼠比利大叔，比利大叔又看看彼得。三个伙伴一句话也说不出来，最后一齐转过头，继续望着老蟾蜍先生。
        - id: ch01-b13
          speaker: narrator
          text: 就在他们眼前，老蟾蜍先生的喉咙越胀越大，越胀越大。怪不得吉米以为他快要胀破了。等喉咙终于不再变大，那一串美妙的小音符又响了起来。歌声又甜又轻轻发颤，彼得听得连气都屏住了。
        - id: ch01-b14
          speaker: narrator
          text: 这下再也没有疑问了。老蟾蜍先生说过自己要来唱歌，他果真唱了。他的歌也是微笑池里里外外整场大合唱中最甜美的歌声之一，就算称它为最甜美的一支，也说得过去。这很难让人相信，可彼得、吉米和比利大叔全都亲眼看见、亲耳听见了。听着这歌声，他们越发敬重老蟾蜍先生。
        - id: ch01-b15
          speaker: peter_rabbit
          text: 他到底是怎么唱出来的？
        - id: ch01-b16
          speaker: jimmy_skunk
          text: 当然靠他下巴底下那个袋子。你瞧，袋子不胀起来，他就不唱。那可是个货真价实的音乐袋！我以前一点儿也不知道，他还有这么个袋子。
        - id: ch01-b17
          speaker: narrator
          text: 兔子彼得伸手摸了摸自己的喉咙。
        - id: ch01-b18
          speaker: peter_rabbit
          text: 要是我的喉咙里也有这么一个音乐袋，那该多好。
        - id: ch01-b19
          speaker: narrator
          text: 说完，彼得也跟着吉米和比利大叔笑了起来。不过，他的眼睛里仍然带着几分向往。
