audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: A Shadow Passes Over the Smiling Pool
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mr. Toad has a saying. Listen well, my dear. The time to watch for clouds is when the sky is clear.
        - id: ch01-b02
          speaker: narrator
          text: He says that is why he lives to such a good old age. I suppose he means that everyone looks for rain when the sky is cloudy, so everyone is ready. But when the sun shines, most people forget that storms exist. Then a sudden storm catches nearly everyone unprepared.
        - id: ch01-b03
          speaker: narrator
          text: Danger and trouble work the same way. Old Mr. Toad keeps watch when there seems to be no need at all, and he has found that it always pays.
        - id: ch01-b04
          speaker: narrator
          text: One beautiful spring evening, a faint, clear light still showed beyond the Purple Hills. Old Mother West Wind had taken her children, the Merry Little Breezes, over those hills, and jolly, round, red Mr. Sun had gone to bed behind them.
        - id: ch01-b05
          speaker: narrator
          text: Soft dusk covered the Green Meadows and the Smiling Pool like a curtain. Inside the Green Forest, the shadows had turned black. Little stars twinkled down from the sky, and their reflections twinkled back from the Smiling Pool. Everything around the pool was perfectly peaceful.
        - id: ch01-b06
          speaker: narrator
          text: Jerry Muskrat swam to and fro. He made little silver lines across the water and squeaked contentedly, for this was his favorite hour. Little Friend the Song Sparrow was asleep among the alders beside the Laughing Brook, with his head tucked under his wing. Redwing the Blackbird slept the same way among the bulrushes. Every feathered singer who had filled the bright day with joy had gone to bed.
        - id: ch01-b07
          speaker: narrator
          text: But the happy spring chorus was not silent. Oh, my, no! The Green Meadows and the Green Forest were quiet, but the sweet singers of the Smiling Pool made up for it. The hylas, the frogs, and Old Mr. Toad poured out their glad songs as though they had not already sung through most of the day.
        - id: ch01-b08
          speaker: narrator
          text: This was the hour they loved best, an hour that seemed made especially for singing. They did their very best to tell Old Mother Nature how much they loved her. They sang of their happiness because she had brought sweet Mistress Spring back to wake them from their long sleep.
        - id: ch01-b09
          speaker: narrator
          text: The evening was so peaceful and beautiful that no one would have believed danger could be hiding nearby. Old Mr. Toad swelled the strange music bag in his throat and sang with all his might. Even so, he never forgot his wise saying.
        - id: ch01-b10
          speaker: narrator
          text: That was why he saw it first. A tiny piece of the Green Forest's blackness seemed to break away and float toward the Smiling Pool.
        - id: ch01-b11
          speaker: narrator
          text: Old Mr. Toad stopped singing at once. That was a signal. His nearest neighbor fell silent, and then the next singer stopped, and the next. In one minute, the whole Smiling Pool was quiet. The only sound was Jerry Muskrat squeaking from somewhere among the bulrushes. The great chorus had gone out as suddenly as electric lights when someone presses a button.
        - id: ch01-b12
          speaker: narrator
          text: The shadow floated back and forth over the Smiling Pool, first one way and then another. Not one living creature could be seen in the water. After a while, the shadow drifted soundlessly away across the Green Meadows.
        - id: ch01-b13
          speaker: old_mr_toad
          text: Well, Hooty the Owl didn't catch any of us this time!
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: Old Mr. Toad chuckled with satisfaction as he spoke to his nearest neighbor. Then he puffed out his music bag and started singing once more.
        - id: ch01-b15
          speaker: narrator
          text: At once, the great chorus burst out again, just as suddenly as it had stopped. Every voice was as joyous as before. Nothing had happened to make them sad, though it might have if Old Mr. Toad had not kept watch.
