audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 见多识广，直率中带着固执
        timbre: 粗粝厚实
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第七章　一道阴影掠过微笑池
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老蟾蜍先生常说一句话。亲爱的，你可要牢牢记住。
        - id: ch01-b02
          speaker: old_mr_toad
          text: 晴空万里无云时，更要留心风雨起。
        - id: ch01-b03
          speaker: narrator
          text: 老蟾蜍先生说，他能平平安安活到这么大岁数，靠的正是这个道理。你想，天上堆满乌云时，人人都会防着下雨，也会早做准备。太阳高高照着时呢，大多数人反倒忘了，暴风雨随时可能出现。等风雨猛地来了，准备好的人就没有几个。危险和麻烦也是这么回事。所以，看起来越是用不着担心，老蟾蜍先生越会留神。他一次次发现，小心些总是值得的。
        - id: ch01-b04
          speaker: narrator
          text: 那是一个美丽的春夜。紫山背后，还亮着一抹淡淡的清光。老西风妈妈带着孩子们，也就是那些快乐小微风，已经去了山那边。圆滚滚、红彤彤、总是乐呵呵的太阳先生，也躲到山后睡觉去了。
        - id: ch01-b05
          speaker: narrator
          text: 绿草地和微笑池上，柔和的暮色像帷幕一样落下来。到了绿森林里，它就变成了浓浓的黑暗。小星星在天上眨着眼睛，低头瞧见水中的倒影也冲着它们一闪一闪。池里池外，一片安宁。
        - id: ch01-b06
          speaker: narrator
          text: 麝鼠杰里在微笑池里游来游去，水面上留下了一道道细银线。他快活得吱吱直叫，因为这是他最喜欢的时辰。歌雀小朋友已经把头藏到翅膀下面，在笑溪边的桤木丛里睡熟了。红翼黑鸟也用同样的姿势，睡在蒲草丛中。白天用歌声带来欢乐的鸟儿们，这时全都休息了。
        - id: ch01-b07
          speaker: narrator
          text: 可春天那场欢快的大合唱停下来了吗？哎呀，没有，当然没有！绿草地不出声了，绿森林也不出声了。于是，微笑池里的雨蛙、青蛙和老蟾蜍先生唱得格外起劲，好像要把四周的寂静全补回来。他们把满心的欢喜都唱进歌里，仿佛白天大半时候一直唱着的并不是他们。
        - id: ch01-b08
          speaker: narrator
          text: 一天里，他们最爱的就是这个时辰。在他们心里，它简直就是专为唱歌留下的。他们一个个拿出最好的歌声，告诉大自然妈妈，他们多么爱她。她把甜美的春姑娘送了回来，又把他们从长长的睡梦中叫醒，他们实在太高兴了。
        - id: ch01-b09
          speaker: narrator
          text: 微笑池边又安静，又美丽。任谁看见这幅景象，大概都不会相信危险就藏在附近。老蟾蜍先生却没有放松。他鼓着喉咙下那个古怪的音乐袋，正使足力气唱着，心里仍记得自己的那句老话。
        - id: ch01-b10
          speaker: narrator
          text: 所以，他第一个瞧见了那样东西。它从绿森林那边飘向微笑池，活像一小片黑暗从森林里脱落下来。老蟾蜍先生马上闭了嘴。这个动作就是信号。最近的邻居跟着停下，旁边的也不唱了，再旁边的也不唱了。没过多久，整座微笑池便听不见一点歌声。
        - id: ch01-b11
          speaker: narrator
          text: 只剩麝鼠杰里藏在蒲草丛里，还发出吱吱的叫声。那么响亮的一场大合唱，突然间全停了，就像有人按了一下开关，所有电灯同时熄灭。
        - id: ch01-b12
          speaker: narrator
          text: 那道阴影在微笑池上方来回飘动，一会儿朝这边，一会儿又转向那边。可是水里连一个活物的影子也没有。过了一阵，阴影没有发出半点声响，越过绿草地飘远了。
        - id: ch01-b13
          speaker: old_mr_toad
          text: 这回呀，猫头鹰胡迪一个也没逮着。
        - id: ch01-b14
          speaker: narrator
          text: 老蟾蜍先生满意地低声笑着，把这句话说给最近的邻居听。说完，他又把音乐袋鼓得圆圆的，重新唱了起来。
        - id: ch01-b15
          speaker: narrator
          text: 刚才，大合唱停得那么突然。现在，它又同样突然地响起来，歌声还是像先前一样欢快。本来可能降临的悲伤并没有发生，只因为老蟾蜍先生一直留心守望着。
