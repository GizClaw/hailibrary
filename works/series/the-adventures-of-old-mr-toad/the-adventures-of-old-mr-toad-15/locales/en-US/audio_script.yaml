audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, curious, and openly expressive
        timbre: youthful and clear
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Old Mr. Toad Gives Peter a Scare
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: If you play tricks on other folks, you can be sure they will take the first chance they get to play a trick on you. And now Old Mr. Toad was paying Peter back for laughing at him. While Peter's back was turned, Mr. Toad had disappeared.
        - id: ch01-b02
          speaker: narrator
          text: Peter could not understand it. He looked everywhere, but there was not even a chip for Mr. Toad to hide beneath. The only possible hiding place was the old board. Mr. Toad had given his word of honor that he would not go under it. Still, Peter could think of nowhere else to look, so he hopped over and turned the board again.
        - id: ch01-b03
          speaker: narrator
          text: Of course Mr. Toad was not there. He always kept his word, and Peter should have known better than to look.
        - id: ch01-b04
          speaker: narrator
          text: Mr. Toad had also promised not to go more than three feet from the place where he had been sitting. Peter should have remembered that too, instead of racing up the Crooked Little Path. But Peter reasoned that if Mr. Toad had nothing to hide under, he must have hopped away.
        - id: ch01-b05
          speaker: narrator
          text: Five minutes was not enough time for Mr. Toad to hop very far. Peter knew that. Even so, he ran this way and that, searching much farther away than Mr. Toad could possibly have gone. It did no good at all.
        - id: ch01-b06
          speaker: narrator
          text: At last Peter came back and sat down on the very spot where he had last seen Mr. Toad. He had never felt more foolish. Perhaps Mr. Toad was bewitched, Peter thought. Perhaps he had some strange power that could make him invisible.
        - id: ch01-b07
          speaker: narrator
          text: Peter stayed perfectly still for a long time, trying to work out how Mr. Toad had vanished. The more he thought about it, the more impossible it seemed. Yet Mr. Toad really was gone.
        - id: ch01-b08
          speaker: narrator
          text: Then Peter gave a frightened scream and jumped higher than he had ever jumped in his life. Old Mr. Toad's voice had spoken from right underneath him.
        - id: ch01-b09
          speaker: old_mr_toad
          text: Well, Peter, are you satisfied now?
        - id: ch01-b10
          speaker: narrator
          text: No wonder Peter was frightened. He turned around, and there sat Old Mr. Toad, right where Peter himself had been sitting a moment earlier. Peter rubbed his eyes and stared at him, looking very foolish indeed.
        - id: ch01-b11
          speaker: peter_rabbit
          text: Wh... where did you come from?
          emotion: surprised
        - id: ch01-b12
          speaker: narrator
          text: Old Mr. Toad grinned.
        - id: ch01-b13
          speaker: old_mr_toad
          text: Watch, and I'll show you.
        - id: ch01-b14
          speaker: narrator
          text: As Peter watched, Mr. Toad began sinking into the ground. Down he went until only the top of his head was showing. Then that disappeared too. Mr. Toad had gone beneath the sand, and the loose sand had fallen back over him.
        - id: ch01-b15
          speaker: narrator
          text: Peter simply had to rub his eyes again. Then he began digging away the sand where Mr. Toad had been sitting, just to make sure. In a moment he felt Mr. Toad beneath the surface, and Mr. Toad came straight out again.
        - id: ch01-b16
          speaker: narrator
          text: The beautiful eyes of Old Mr. Toad twinkled more brightly than ever.
        - id: ch01-b17
          speaker: old_mr_toad
          text: I believe that makes us even, Peter.
        - id: ch01-b18
          speaker: narrator
          text: Peter nodded.
        - id: ch01-b19
          speaker: peter_rabbit
          text: More than even, Mr. Toad. I think you got the better of me. But please tell me, how did you do it?
        - id: ch01-b20
          speaker: narrator
          text: Old Mr. Toad raised one of his strong hind feet. Peter could see a kind of spur on it.
        - id: ch01-b21
          speaker: old_mr_toad
          text: I have another spur just like this one on my other foot. I use them for digging. You go into a hole headfirst, Peter, but I back into mine. When the earth is soft, I dig the hole and back down at the same time. Like this.
        - id: ch01-b22
          speaker: narrator
          text: Mr. Toad began working his stout hind feet. He kicked the earth out while backing into the hole. Once he was deep enough, the loose earth fell right back over him. It had not been packed down, so it covered him completely.
        - id: ch01-b23
          speaker: narrator
          text: When Mr. Toad appeared once more, Peter thanked him. Then Peter had one last question.
        - id: ch01-b24
          speaker: peter_rabbit
          text: Is that how you dig in when you go to your winter quarters?
        - id: ch01-b25
          speaker: narrator
          text: Old Mr. Toad nodded.
        - id: ch01-b26
          speaker: old_mr_toad
          text: Yes. And that is how I get away from my enemies too.
