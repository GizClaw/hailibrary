audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 见多识广，直率中带着固执
        timbre: 粗粝厚实
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十五章　老蟾蜍先生吓了彼得一跳
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 你若爱把别人捉弄，别人一有机会，也会拿你开个玩笑，叫你尝尝滋味。
        - id: ch01-b02
          speaker: narrator
          text: 老蟾蜍先生这会儿正要回敬彼得，因为彼得刚刚笑话过他。彼得背过身去没多久，老蟾蜍先生就消失了。
        - id: ch01-b03
          speaker: narrator
          text: 这下，彼得可真没办法了。他到处看，附近连一小块能藏住老蟾蜍先生的碎木片都没有，只有那块旧木板。可老蟾蜍先生已经拿名誉担保，绝不会躲到下面。彼得实在想不出还能去哪里找，只好跳过去，又把木板翻了一遍。
        - id: ch01-b04
          speaker: narrator
          text: 木板下面当然没有老蟾蜍先生。他答应过不藏在那里，而他向来都说话算数。彼得早该知道，自己根本不必去翻那块木板。
        - id: ch01-b05
          speaker: narrator
          text: 老蟾蜍先生还说过，自己不会离开原先坐着的地方三英尺。彼得照理也不该沿着弯弯小径飞奔。可是他觉得，周围既然没有东西可藏，老蟾蜍先生当然只能跳走。五分钟又跳不了多远，他便一会儿跑这边，一会儿跑那边，一直搜到老蟾蜍先生绝不可能到达的地方。
        - id: ch01-b06
          speaker: narrator
          text: 这一通寻找全白费了。彼得只得回来，一屁股坐在最后见到老蟾蜍先生的地方。他从没觉得自己这么傻过，甚至开始怀疑，老蟾蜍先生是不是中了魔法，能用什么怪本领让自己看不见。
        - id: ch01-b07
          speaker: narrator
          text: 彼得一动不动地坐了很久，怎么也想不通老蟾蜍先生是如何消失的。他越琢磨越觉得不可能，可老蟾蜍先生偏偏就是不见了。突然，彼得吓得尖叫起来，一下跳得比平生任何一次都高。老蟾蜍先生的声音响了起来，而且正是从彼得身子底下传来的！
        - id: ch01-b08
          speaker: old_mr_toad
          text: 怎么样，这回你该满意了吧？
        - id: ch01-b09
          speaker: narrator
          text: 难怪彼得会吓成那样。他回头一看，老蟾蜍先生就坐在自己方才坐过的地方。彼得揉揉眼睛，傻愣愣地盯着他。
        - id: ch01-b10
          speaker: peter_rabbit
          text: 你……你……你是从哪儿出来的？
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: 彼得好不容易才结结巴巴地问出这句话。老蟾蜍先生咧嘴一笑。
        - id: ch01-b12
          speaker: old_mr_toad
          text: 我再做一遍，你看好了。
        - id: ch01-b13
          speaker: narrator
          text: 彼得眼睁睁地看着老蟾蜍先生慢慢沉进地里。先是只剩头顶，转眼连头顶也不见了。他已经钻进地下，沙土又落回原处，把他完全盖住。彼得不得不再揉一遍眼睛，非揉不可！
        - id: ch01-b14
          speaker: narrator
          text: 为了确认自己没有看错，彼得就在老蟾蜍先生刚才坐过的地方刨起沙来。没过多久，他碰到了老蟾蜍先生，老蟾蜍先生马上又钻出来了。
        - id: ch01-b15
          speaker: narrator
          text: 老蟾蜍先生那双漂亮的眼睛，比刚才闪得还要欢。
        - id: ch01-b16
          speaker: old_mr_toad
          text: 彼得，我看这下我们算扯平了。
        - id: ch01-b17
          speaker: narrator
          text: 彼得点了点头。
        - id: ch01-b18
          speaker: peter_rabbit
          text: 还不只是扯平呢，蟾蜍先生。这一回明明是您赢了。现在可以告诉我，您到底怎么办到的吗？
        - id: ch01-b19
          speaker: narrator
          text: 老蟾蜍先生举起一只粗壮的后脚，给彼得看脚上的一根刺状突起。
        - id: ch01-b20
          speaker: old_mr_toad
          text: 我另一只脚上也有一根同样的刺，它们就是挖土用的。你进洞总是头朝前钻，我却要倒着进去。我在松软的土里挖洞，同时一点点往后退。你瞧，就是这样。
        - id: ch01-b21
          speaker: narrator
          text: 他挥动粗壮的后脚，把土不停地往外蹬，身子同时向后退进洞里。挖到足够深的时候，松散的泥土自然落下，又把他盖了起来。这里的土一点儿也没压实。
        - id: ch01-b22
          speaker: narrator
          text: 老蟾蜍先生再次露面后，彼得先向他道了谢，接着又问了一个问题。
        - id: ch01-b23
          speaker: peter_rabbit
          text: 您过冬时，也是这样钻进住处的吗？
        - id: ch01-b24
          speaker: narrator
          text: 老蟾蜍先生点点头。
        - id: ch01-b25
          speaker: old_mr_toad
          text: 没错。我躲避敌人的时候，也用这个办法。
