audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: genial, direct, and good-natured
        timbre: deep and rumbling
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Old Mr. Toad Gets His Stomach Full
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Please don't turn up your nose at the things other people eat. Something that tastes dreadful to you may taste wonderful to someone else.
        - id: ch01-b02
          speaker: narrator
          text: Take ants, for example. You wouldn't want to eat them, even if you were terribly hungry. But Old Mr. Toad and Buster Bear could hardly think of anything nicer. Buster had found Mr. Toad beside an ants' home, catching the ants one at a time. He was glad to meet someone else who liked them, so he invited Mr. Toad to dinner right away.
        - id: ch01-b03
          speaker: narrator
          text: Poor Mr. Toad had been watching the ants so closely that he never saw Buster coming. Then Buster's deep, grumbly-rumbly voice sounded beside him, and Mr. Toad was nearly frightened to death.
        - id: ch01-b04
          speaker: narrator
          text: He toppled onto his back. It wasn't dignified at all, and Buster laughed. That only frightened Mr. Toad more. He was certain Buster meant to eat him. The invitation to dinner, he thought, must be Buster's little joke.
        - id: ch01-b05
          speaker: narrator
          text: There was no way to get away. After a moment, Mr. Toad decided he had better be polite. It always pays to be polite.
        - id: ch01-b06
          speaker: old_mr_toad
          text: I would be pleased to have dinner with you.
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: His voice was very faint. He waved his feet weakly and tried to turn himself over. Buster laughed harder than ever. It was a low, deep, grumbly-rumbly laugh, and cold shivers ran all over poor Mr. Toad.
        - id: ch01-b08
          speaker: narrator
          text: Then Buster reached out one huge paw. Its claws looked cruel, and Mr. Toad gave up completely. He no longer had enough strength even to kick. He closed his eyes and waited for the end.
        - id: ch01-b09
          speaker: narrator
          text: But what happened? That enormous paw rolled him onto his feet so gently that he gasped. Mr. Toad could hardly believe such a great paw could be so gentle.
        - id: ch01-b10
          speaker: buster_bear
          text: I know where a fine dinner is waiting, just a little way from here. Follow me, and we'll be eating in no time.
        - id: ch01-b11
          speaker: narrator
          text: Buster tried to make his voice pleasant, though it still came out grumbly-rumbly. Then he led the way. Mr. Toad followed as fast as he could because he didn't dare do anything else.
        - id: ch01-b12
          speaker: narrator
          text: Before long, Buster stopped beside a big old log that had begun to decay.
        - id: ch01-b13
          speaker: buster_bear
          text: If you're ready, Mr. Toad, we can have our dinner now.
        - id: ch01-b14
          speaker: narrator
          text: Mr. Toad couldn't see a thing to eat. His heart sank again, and he began to shake all over.
        - id: ch01-b15
          speaker: old_mr_toad
          text: I... I'm really not hungry.
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: Buster seemed not to hear him. He dug his great claws into the old log and pulled with all his might. The log rolled over. Underneath were ants and ants and ants, hurrying one way and scurrying the other. Mr. Toad had never seen so many ants in his life.
        - id: ch01-b17
          speaker: buster_bear
          text: Go right ahead and help yourself.
        - id: ch01-b18
          speaker: narrator
          text: Mr. Toad didn't need a second invitation. He forgot his fear. He forgot Buster Bear. He forgot that he had just said he wasn't hungry, and he forgot his manners too. He jumped straight into the ants and became the busiest Toad anyone had ever seen.
        - id: ch01-b19
          speaker: narrator
          text: Buster was just as busy. He swept his long tongue one way, then the other. Each time he pulled it back into his mouth, it was covered with ants.
        - id: ch01-b20
          speaker: narrator
          text: At last, Mr. Toad couldn't hold one more ant. Then he remembered Buster and looked up, still a little afraid. Buster was smacking his lips, and both his eyes were twinkling.
        - id: ch01-b21
          speaker: buster_bear
          text: They're good, aren't they?
        - id: ch01-b22
          speaker: old_mr_toad
          text: Those are the best ants I've ever eaten.
          emotion: happy
        - id: ch01-b23
          speaker: narrator
          text: Mr. Toad gave a satisfied sigh.
        - id: ch01-b24
          speaker: buster_bear
          text: Come and have dinner with me again.
        - id: ch01-b25
          speaker: narrator
          text: This time, somehow, Mr. Toad didn't mind Buster's grumbly-rumbly voice at all.
        - id: ch01-b26
          speaker: old_mr_toad
          text: Thank you. I will.
