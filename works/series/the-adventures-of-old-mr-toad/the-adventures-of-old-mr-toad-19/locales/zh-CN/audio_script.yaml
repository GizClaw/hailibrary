audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 老实稳重，紧张时气息急促而不失真诚
        timbre: 粗哑温厚
        pace: 平时缓慢，慌张时断续
        pitch: 中低音
    buster_bear:
      display_name: 巴斯特熊
      tts:
        delivery: 爽直和善，说话带着自然的憨厚劲儿
        timbre: 低沉浑厚，带有咕隆隆的共鸣
        pace: 从容不迫
        pitch: 低音
  chapters:
    - id: ch01
      title: 第十九章　老蟾蜍先生吃了个肚儿圆
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 别人吃的东西，你可别翘起鼻子笑话。你觉得难吃得碰不得，人家尝起来，说不定甜蜜蜜的。
        - id: ch01-b02
          speaker: narrator
          text: 就说蚂蚁吧。哪怕饿得要命，你大概也不想吃。可老蟾蜍先生和巴斯特熊都觉得，蚂蚁简直好吃极了。巴斯特发现老蟾蜍先生守在蚂蚁窝旁，一只一只地捉蚂蚁。难得碰上一个同样爱吃蚂蚁的伙伴，他一高兴，马上请老蟾蜍先生跟他一起吃饭。
        - id: ch01-b03
          speaker: narrator
          text: 老蟾蜍先生只顾盯着蚂蚁，完全没看见巴斯特走近。巴斯特那低沉的嗓音忽然咕隆隆地响起来，差点把他吓掉了魂。
        - id: ch01-b04
          speaker: narrator
          text: 老蟾蜍先生一下子仰面摔倒。那模样可一点儿也不体面，巴斯特忍不住哈哈大笑。这一笑，老蟾蜍先生更害怕了。他认定巴斯特要吃掉自己。至于那句请他吃饭的话，也准是在拿他开玩笑。
        - id: ch01-b05
          speaker: narrator
          text: 可他又逃不掉。想了一会儿，他觉得还是客气点儿好。待人客气，总不会吃亏嘛。
        - id: ch01-b06
          speaker: old_mr_toad
          text: 我……我很乐意陪你吃饭。
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: 他的声音细得几乎听不见。说完，他软绵绵地挥动四只脚，想翻过身来。巴斯特却笑得更响了。那又低又沉的笑声咕隆隆地滚过来，吓得老蟾蜍先生浑身直打冷战。
        - id: ch01-b08
          speaker: narrator
          text: 巴斯特接着伸出一只巨掌，上面的大爪子看起来凶狠极了。老蟾蜍先生彻底绝望，连蹬腿的力气也没剩下。他只好闭紧眼睛，等着末日来临。
        - id: ch01-b09
          speaker: narrator
          text: 可后来怎么样了？那只巨掌轻轻一拨，竟把他翻过来，稳稳放在脚上。老蟾蜍先生惊得倒抽一口气。他实在想不到，这么大的熊掌也能这样轻柔。
        - id: ch01-b10
          speaker: narrator
          text: 巴斯特尽量把声音放得和气，可开口时，嗓子还是咕隆隆的。
        - id: ch01-b11
          speaker: buster_bear
          text: 离这儿不远，有顿美餐正等着咱们。你跟我来，很快就能吃上了。
        - id: ch01-b12
          speaker: narrator
          text: 巴斯特走在前面带路，老蟾蜍先生拼命在后面跟。他哪敢不跟呀。不久，巴斯特在一根又粗又朽的老木头旁停下了。
        - id: ch01-b13
          speaker: buster_bear
          text: 蟾蜍先生，你要是准备好了，咱们现在就开饭吧。
        - id: ch01-b14
          speaker: narrator
          text: 老蟾蜍先生左看右看，什么吃的也没有。一颗心又沉了下去，浑身也跟着发起抖来。
        - id: ch01-b15
          speaker: old_mr_toad
          text: 我……我其实不饿。
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: 巴斯特像是根本没听见。他把大爪子钩进朽木，使出全身力气猛地一扳。老木头翻到一旁，底下全是蚂蚁。蚂蚁，蚂蚁，还是蚂蚁！有的匆匆往这边赶，有的慌慌张张往那边逃。老蟾蜍先生一辈子也没见过这么多蚂蚁。
        - id: ch01-b17
          speaker: buster_bear
          text: 别客气，尽管吃吧。
        - id: ch01-b18
          speaker: narrator
          text: 老蟾蜍先生哪还需要再请第二遍。他忘了害怕，忘了巴斯特熊，忘了自己刚刚还说不饿，连该有的礼貌也忘了。他一下跳进蚂蚁堆，忙得团团转，简直成了世上最忙的一只蟾蜍。
        - id: ch01-b19
          speaker: narrator
          text: 巴斯特也忙得不可开交。他把长舌头扫向这边，又扫向那边。每次把舌头收回嘴里，上面都沾得满是蚂蚁。
        - id: ch01-b20
          speaker: narrator
          text: 到后来，老蟾蜍先生的肚子里连一只蚂蚁也装不下了。他这才想起巴斯特，抬头时心里还有点儿害怕。巴斯特正咂着嘴，两只眼睛闪闪发亮。
        - id: ch01-b21
          speaker: buster_bear
          text: 味道不错吧？
        - id: ch01-b22
          speaker: old_mr_toad
          text: 我这辈子还没吃过这么好吃的东西。
          emotion: happy
        - id: ch01-b23
          speaker: narrator
          text: 老蟾蜍先生说完，满足地叹了口气。
        - id: ch01-b24
          speaker: buster_bear
          text: 下次再来跟我一起吃饭吧。
        - id: ch01-b25
          speaker: narrator
          text: 说来也怪，这一回再听见巴斯特那咕隆隆的嗓音，老蟾蜍先生一点儿也不介意了。
        - id: ch01-b26
          speaker: old_mr_toad
          text: 谢谢你，我一定来。
