audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 老实稳重，紧张时气息急促而不失真诚
        timbre: 粗哑温厚
        pace: 平时缓慢，慌张时断续
        pitch: 中低音
    danny_meadow_mouse:
      display_name: 田鼠丹尼
      tts:
        delivery: 友善直率，话里常带一点温和的打趣
        timbre: 细小温暖
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十章　老蟾蜍先生得意忘形
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老蟾蜍先生慢吞吞地沿着孤独小径往前跳。他平常就不快，这一回却比哪一次都慢。因为他浑身膨胀得太厉害，想快也快不了，再说，他根本不想快。
        - id: ch01-b02
          speaker: narrator
          text: 他的肚子已经塞满蚂蚁，连一只也装不下了。不，先生，就算硬吞，他也吞不下另一只。蚂蚁把他的肚子撑得鼓鼓的，可让他全身都鼓起来的另有一样东西。那就是骄傲。愚蠢的骄傲，最容易叫人膨胀。
        - id: ch01-b03
          speaker: narrator
          text: 老蟾蜍先生年纪可不小了，本该懂事。年轻又糊涂的家伙得意忘形，已经够难看了。他这么大年纪还这样，就更不像话。瞧，他的头昂得太高，连自己的脚也看不见，一路上接连踢痛了脚趾。
        - id: ch01-b04
          speaker: narrator
          text: 不一会儿，他碰见老朋友田鼠丹尼。老蟾蜍先生又把头翘高一点，身子再鼓大一点，装作压根儿没看见他。
        - id: ch01-b05
          speaker: danny_meadow_mouse
          text: 蟾蜍先生，你好呀！
        - id: ch01-b06
          speaker: narrator
          text: 老蟾蜍先生假装没听见。丹尼觉得奇怪，又扯开嗓子喊了一遍。
        - id: ch01-b07
          speaker: danny_meadow_mouse
          text: 蟾蜍先生，你好！我可有些日子没见着你啦！
        - id: ch01-b08
          speaker: narrator
          text: 这回再装聋可不行了。老蟾蜍先生摆出高贵的派头，仿佛刚刚才发现丹尼。
        - id: ch01-b09
          speaker: old_mr_toad
          text: 哦，是丹尼呀，你近来好吗？真对不住，我没工夫停下来。我刚跟我的朋友巴斯特熊吃完饭，现在必须回家了。
        - id: ch01-b10
          speaker: narrator
          text: 一说出巴斯特熊的名字，他又把身子鼓大了一点。丹尼望着他沿孤独小径跳远，忍不住咧嘴笑了。
        - id: ch01-b11
          speaker: danny_meadow_mouse
          text: 看来他如今连咱们这些寻常朋友都不肯搭理了。我早听说，骄傲会让人昏了头。可我真没想到，老蟾蜍先生也会变得这么骄傲。
        - id: ch01-b12
          speaker: narrator
          text: 老蟾蜍先生接着赶路，很快又遇见兔子彼得。彼得照老习惯停下来，想跟他聊几句。可老蟾蜍先生昂着头，鼓着身子，看也不看彼得，只顾往前跳。在他眼里，彼得简直跟路边的木棍和石头一样。彼得怎么也想不明白，连忙跑去告诉田鼠丹尼。
        - id: ch01-b13
          speaker: danny_meadow_mouse
          text: 我知道是怎么回事。他跟巴斯特熊吃了一顿饭，就觉得老朋友都不值得搭理了。
        - id: ch01-b14
          speaker: narrator
          text: 没多久，土拨鼠约翰尼也来了。他很生气，因为老蟾蜍先生对他就像对彼得一样。花栗鼠受了同样的冷落，负鼠比利大叔也是。老蟾蜍先生把一个又一个老朋友、老邻居都晾在一边。
        - id: ch01-b15
          speaker: narrator
          text: 只有浣熊博比是个例外。博比是巴斯特熊的小表弟，老蟾蜍先生对他客气极了。他没完没了地谈论巴斯特，还认定博比有这么一位亲戚，心里一定骄傲得很。
        - id: ch01-b16
          speaker: narrator
          text: 一开始，大家看到老蟾蜍先生让骄傲撑成这副模样，都觉得好笑。可没过多久，他们就受够了这位老朋友、老邻居的冷眼，嘴里也渐渐说起了难听话。
        - id: ch01-b17
          speaker: narrator
          text: 最后，大家认定老蟾蜍先生该受一次教训。他们把脑袋凑到一起，想出了一个办法，要让他知道，骄傲得忘乎所以，究竟有多愚蠢。
