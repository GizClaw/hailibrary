audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: friendly, plainspoken, and gently amused
        timbre: small and warm
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Old Mr. Toad Is Puffed Up
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mr. Toad went hopping slowly down the Lone Little Path. He was usually slow, but this time he was slower than ever. He was so puffed up that he couldn't have hurried if he had wanted to, and he had no wish to hurry.
        - id: ch01-b02
          speaker: narrator
          text: For one thing, his stomach was packed with ants. There wasn't room for even one more. No, sir, he couldn't have swallowed another ant if he had tried. The ants made his stomach bulge, but something else had puffed up the rest of him. It was pride. Nothing can swell a person up quite like foolish pride.
        - id: ch01-b03
          speaker: narrator
          text: Mr. Toad was old enough to know better. Pride looks bad enough in someone young and foolish. In someone as old as Mr. Toad, it looks even worse. He carried his head so high that he couldn't see his feet, and he stubbed his toes more than once.
        - id: ch01-b04
          speaker: narrator
          text: Before long he met his old friend Danny Meadow Mouse. Mr. Toad raised his head a little higher, puffed himself out a little farther, and acted as if Danny wasn't there.
        - id: ch01-b05
          speaker: danny_meadow_mouse
          text: Hello, Mr. Toad!
        - id: ch01-b06
          speaker: narrator
          text: Mr. Toad acted as though he hadn't heard. Danny was puzzled, so he called again, much louder this time.
        - id: ch01-b07
          speaker: danny_meadow_mouse
          text: Hello there, Mr. Toad! It's been quite a while since I've seen you.
        - id: ch01-b08
          speaker: narrator
          text: Mr. Toad couldn't pretend he had missed that. He put on a grand manner and acted very surprised.
        - id: ch01-b09
          speaker: old_mr_toad
          text: Oh, Danny! How are you? I'm sorry I can't stay. I've just dined with my friend Buster Bear, and now I really must be getting home.
        - id: ch01-b10
          speaker: narrator
          text: When he said Buster Bear's name, Mr. Toad puffed himself out even more. Danny grinned as he watched him hop away along the Lone Little Path.
        - id: ch01-b11
          speaker: danny_meadow_mouse
          text: So he can't stop and talk to ordinary folks now. I've heard that pride can turn a person's head, but I never thought I'd see Old Mr. Toad become proud.
        - id: ch01-b12
          speaker: narrator
          text: Mr. Toad kept going until he met Peter Rabbit. Peter stopped to chat, just as he always did. Mr. Toad paid no attention. With his head held high and his body all puffed out, he hopped straight past. He noticed Peter no more than he would have noticed a stick or a stone.
        - id: ch01-b13
          speaker: narrator
          text: Peter couldn't understand it. He hurried off to tell Danny Meadow Mouse what had happened.
        - id: ch01-b14
          speaker: danny_meadow_mouse
          text: Oh, I know what's wrong. He had dinner with Buster Bear, and now he doesn't care about his old friends.
        - id: ch01-b15
          speaker: narrator
          text: Soon Johnny Chuck came along, very upset because Mr. Toad had treated him exactly as he had treated Peter. Striped Chipmunk had the same story to tell, and so did Unc' Billy Possum. One old friend and neighbor after another was snubbed.
        - id: ch01-b16
          speaker: narrator
          text: Bobby Coon was the one exception. Bobby was Buster Bear's little cousin, and Mr. Toad was very polite to him. He talked on and on about Buster Bear. He even thought Bobby must feel very proud to be related to Buster.
        - id: ch01-b17
          speaker: narrator
          text: At first, everyone thought Mr. Toad's swollen pride was a wonderful joke. But before long, they were tired of being ignored by their old friend and neighbor. They began saying unkind things about him.
        - id: ch01-b18
          speaker: narrator
          text: Then they agreed that Old Mr. Toad needed a lesson. They put their heads together and made a plan to show him just how foolish it was to be puffed up with pride.
