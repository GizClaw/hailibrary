  chapters:
    - id: ch01
      title: The Smiling Pool Kindergarten
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Play a little, learn a little, grow a little too. That's what every pollywog tries its best to do.
        - id: ch01-b02
          speaker: narrator
          text: And of course, that's what a kindergarten is for. The babies of Grandfather Frog, Old Mr. Toad, and Stickytoes the Tree Toad did all three in the kindergarten at the Smiling Pool. These little cousins looked a great deal alike, because every one of them began as a pollywog.
        - id: ch01-b03
          speaker: narrator
          text: Peter Rabbit came to watch them every day. He had always thought pollywogs were homely little things that did nothing but wriggle. They hadn't interested him at all. Then he saw how proud Grandfather Frog and Old Mr. Toad were of their babies. That made him wonder, and soon he began watching them closely.
        - id: ch01-b04
          speaker: peter_rabbit
          text: Well, there's one good thing. These babies aren't in danger the way other babies are.
        - id: ch01-b05
          speaker: narrator
          text: Peter was talking to himself, as he often did when no one else was around. Just then, a funny little black pollywog wriggled into view. While Peter watched, a water beetle with strong jaws shot out of the water grass. It caught the pollywog by the tail and dragged him down.
        - id: ch01-b06
          speaker: narrator
          text: Peter stared. Could that ugly bug be as dangerous to a baby Toad as Reddy Fox was to a baby Rabbit? Peter began to think so. A little later, he knew it. The same small pollywog appeared again, struggling to swim because half of his long tail was gone.
        - id: ch01-b07
          speaker: narrator
          text: After that, Peter watched more sharply than ever. Before long, he discovered that pollywogs had to keep their eyes open just as carefully as baby Rabbits did if they wanted to grow up. All kinds of queer, ugly bugs kept darting at them. Hungry-looking fish waited for them, and Longlegs the Blue Heron seemed especially fond of them.
        - id: ch01-b08
          speaker: narrator
          text: But the pollywogs were quick, and they seemed to know how to watch for trouble. As far as Peter could tell, they spent every moment swimming, eating, and growing. They grew so quickly that he felt he could almost see it happen.
        - id: ch01-b09
          speaker: narrator
          text: Then one day Peter got a tremendous surprise. The very pollywog whose tail had been bitten in half had grown a new one. Peter hadn't seen anything so puzzling in a very long time.
        - id: ch01-b10
          speaker: peter_rabbit
          text: Why, I couldn't grow a new tail!
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: Peter exclaimed so loudly that Jerry Muskrat heard him as he came along.
        - id: ch01-b12
          speaker: jerry_muskrat
          text: Couldn't do what?
        - id: ch01-b13
          speaker: peter_rabbit
          text: I couldn't grow a new tail the way that pollywog did.
        - id: ch01-b14
          speaker: narrator
          text: Peter told Jerry everything he had seen, and Jerry laughed.
        - id: ch01-b15
          speaker: jerry_muskrat
          text: Watch those pollywogs a while longer. They'll show you things much stranger than a new tail. They're odd little babies, all right, and worth watching when you have the time. I never do. This whole pool is their kindergarten, with something new going on every minute. You won't find another place like it.
        - id: ch01-b16
          speaker: peter_rabbit
          text: Those huge, fat pollywogs over there, are they Grandfather Frog's children or Old Mr. Toad's?
        - id: ch01-b17
          speaker: jerry_muskrat
          text: They're Grandfather Frog's children from last year. If nothing happens to them, they'll become full-grown Frogs this summer.
        - id: ch01-b18
          speaker: peter_rabbit
          text: Then where are Old Mr. Toad's children from last year?
        - id: ch01-b19
          speaker: jerry_muskrat
          text: How should I know? They all hopped off last summer. Young Toads grow faster than any youngsters I've ever seen. In only a few weeks, the Toad pollywogs here now will be real Toads, ready to leave the Smiling Pool. Old Mr. Toad may be slow, but that isn't true of his children. Just look at that small one over there. His legs are already coming in.
        - id: ch01-b20
          speaker: narrator
          text: Peter looked. Sure enough, a pair of legs was sprouting from one pollywog. They were his front legs, and they made him look very funny indeed. Only a few days earlier, there hadn't been the smallest sign of them.
        - id: ch01-b21
          speaker: peter_rabbit
          text: My goodness, what a funny sight! I thought my babies grew quickly, but these little fellows grow even faster.
          emotion: surprised
