audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, inquisitive, and openly expressive
        timbre: youthful and bright
        pace: quick
        pitch: medium-high
    jerry_muskrat:
      display_name: Jerry Muskrat
      tts:
        delivery: practical, knowing, and good-humored
