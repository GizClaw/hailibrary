audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 实在老练，说话随和，带着善意的幽默
        timbre: 亲切而略带沙哑
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 第九章　微笑池幼儿园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 玩一会儿，学一点儿，身子也要长一点儿。每只蝌蚪小娃娃，样样都得努把劲儿。
        - id: ch01-b02
          speaker: narrator
          text: 幼儿园本来就是做这些事的地方。青蛙爷爷、老蟾蜍先生和黏脚趾树蛙家的宝宝，在微笑池幼儿园里，玩耍、学习、长身体，一样都没落下。这群小表亲刚开始全是蝌蚪，模样也就很相像。
        - id: ch01-b03
          speaker: narrator
          text: 兔子彼得每天都来看它们。以前，他觉得蝌蚪只会扭来扭去，长得不好看，也没什么可瞧的。后来，他见青蛙爷爷和老蟾蜍先生那么以它们为荣，心里也好奇起来，这才开始认真观察。
        - id: ch01-b04
          speaker: peter_rabbit
          text: 不过有一点挺好。它们不会像别的小宝宝那样碰上危险。
        - id: ch01-b05
          speaker: narrator
          text: 身边没人时，彼得总爱跟自己说话。就在这时，一只滑稽的小黑蝌蚪扭了过来。彼得正盯着它，水草里猛地冲出一只水甲虫。那虫子长着粗壮的大颚，一口咬住蝌蚪的尾巴，把它拖进了水下。
        - id: ch01-b06
          speaker: narrator
          text: 彼得看呆了。难道这种丑虫子对蟾蜍宝宝来说，就跟红狐雷迪对兔宝宝一样危险？起初他只是怀疑，过了一会儿，他就知道答案了。那只小蝌蚪又游了出来。它使足了劲，却还是游不好，因为长尾巴已经少了半截。
        - id: ch01-b07
          speaker: narrator
          text: 从那以后，彼得看得更仔细了。他很快发现，蝌蚪要想活着长大，也得像兔宝宝一样，随时睁大眼睛。好几种又怪又丑的水虫总会突然扑出来。饿巴巴的鱼躲在旁边等着，长腿苍鹭也特别爱吃蝌蚪。
        - id: ch01-b08
          speaker: narrator
          text: 好在蝌蚪动作很快，也学会了留神。彼得看来看去，觉得它们整天只忙三件事，那就是游水、吃东西、长身体。它们长得实在太快，彼得几乎觉得，自己能亲眼看见它们一点点变大。
        - id: ch01-b09
          speaker: narrator
          text: 有一天，更惊人的事发生了。那只少了半截尾巴的蝌蚪，竟然又长出了一条新尾巴。彼得已经很久没遇见过这么难懂的事了。
        - id: ch01-b10
          speaker: peter_rabbit
          text: 哎呀，换成我可办不到！
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: 彼得这一声喊得很响。麝鼠杰里正好从旁边经过，听得清清楚楚。
        - id: ch01-b12
          speaker: jerry_muskrat
          text: 什么事你办不到？
        - id: ch01-b13
          speaker: peter_rabbit
          text: 我可不能像那只蝌蚪一样，再长出一条新尾巴。
        - id: ch01-b14
          speaker: narrator
          text: 彼得把刚才看到的事全告诉了杰里。杰里听完，笑了起来。
        - id: ch01-b15
          speaker: jerry_muskrat
          text: 你再多看这些蝌蚪一阵子，还会碰见更稀奇的事。它们这群小宝宝古怪得很，有空盯着瞧，可有意思啦。可惜我没那份闲工夫。微笑池就是一所了不起的幼儿园，每一刻都有新鲜事，别处可找不到这样的地方。
        - id: ch01-b16
          speaker: peter_rabbit
          text: 那些又大又胖的蝌蚪，到底是青蛙爷爷的孩子，还是老蟾蜍先生的？
        - id: ch01-b17
          speaker: jerry_muskrat
          text: 它们是青蛙爷爷去年生的孩子。只要不出意外，今年夏天就能长成真正的青蛙。
        - id: ch01-b18
          speaker: peter_rabbit
          text: 那老蟾蜍先生去年生的孩子去哪儿了？
        - id: ch01-b19
          speaker: jerry_muskrat
          text: 这可别问我。去年夏天，它们就蹦走了。我从没见过哪家的小娃娃能像小蟾蜍那样长得飞快。眼前这些蟾蜍蝌蚪，再过几个星期就会变成真正的蟾蜍，然后离开微笑池。大家说老蟾蜍先生慢吞吞，他的孩子可一点儿也不慢。你看那边那个小家伙，已经开始长腿了。
        - id: ch01-b20
          speaker: narrator
          text: 彼得朝那边一看，果然有只蝌蚪冒出了一双腿。那是它的前腿，叫它看起来十分滑稽。可就在几天前，它身上还连腿的影子都没有。
        - id: ch01-b21
          speaker: peter_rabbit
          text: 我的天哪，这模样可真滑稽！我还以为自己的宝宝长得够快了，没想到这些小家伙比兔宝宝还快。
          emotion: surprised
