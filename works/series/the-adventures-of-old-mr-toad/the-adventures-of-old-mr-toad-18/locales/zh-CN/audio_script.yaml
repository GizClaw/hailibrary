audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 吉米臭鼬
      tts:
        delivery: 随和机灵，慵懒中透着善良和勇气
        timbre: 清朗厚实
        pace: 从容，紧要处稍快
        pitch: 中音
    mr_blacksnake:
      display_name: 黑蛇先生
      tts:
        delivery: 圆滑狡黠，话语间藏着若无其事的得意
        timbre: 细薄柔滑
        pace: 从容偏慢
        pitch: 低音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 老实稳重，紧张时气息急促而不失真诚
        timbre: 粗哑温厚
        pace: 平时缓慢，慌张时断续
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十八章　吉米臭鼬来得正是时候
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 吉米臭鼬慢悠悠地往前走，一路还在偷笑。刚才老蟾蜍先生一听说黑蛇先生打听过自己，立刻急得不得了。偏偏他又怎么也快不起来。看他拼命想赶快，那副样子真是滑稽。吉米越想，越忍不住发笑。
        - id: ch01-b02
          speaker: narrator
          text: 可他忽然笑不出来了，脚步也停在弯弯小径上。他转过身，若有所思地挠着脑袋，又朝来路望去。老蟾蜍先生走的是上山的方向，而黑蛇先生早晨出现的地方，正好就在小径上边。
        - id: ch01-b03
          speaker: jimmy_skunk
          text: 要是黑蛇先生还在那里，老蟾蜍先生可就直接跳进大麻烦里了。他怎么没问我黑蛇先生在哪儿呢？真糊涂！不过，这事跟我没关系。我还是走我的吧。
        - id: ch01-b04
          speaker: narrator
          text: 吉米继续沿着弯弯小径往山下走。才走几步，他又停了下来。别看这个小家伙平时懒洋洋的，其实心肠很好。他实在不愿去想，老蟾蜍先生接下来可能会遇到什么事。
        - id: ch01-b05
          speaker: jimmy_skunk
          text: 唉，我可真不想走那么远再折回去。可是草地要是少了老蟾蜍先生，就再也不像原来的草地了。万一他出了事，我一定会想他。何况我也有一点责任。要不是我掀开那块树皮，他大概能在下面安安全全地待上一整天。
        - id: ch01-b06
          speaker: narrator
          text: 这时，吉米心里有个小小的声音在劝他。
        - id: ch01-b07
          speaker: jimmy_skunk
          text: 说不定，他根本碰不到黑蛇先生呢。
        - id: ch01-b08
          speaker: narrator
          text: 吉米却真的开口回答了那个声音。
        - id: ch01-b09
          speaker: jimmy_skunk
          text: 可也说不定，他偏偏就会碰上。
        - id: ch01-b10
          speaker: narrator
          text: 说完，他转身沿弯弯小径往回走。真稀奇，这个一向慢吞吞的吉米，这回居然加快脚步，赶起路来了。
        - id: ch01-b11
          speaker: narrator
          text: 吉米刚来到一处转弯，老蟾蜍先生就迎面冲来，一头撞在他身上。老蟾蜍先生吓得尖叫一声，仰面摔倒，两条腿胡乱蹬个不停。他想重新站起来，可早已喘不过气，又累又怕，除了使劲蹬腿，什么也做不了。他一路只顾回头，没看见吉米，连自己撞上了谁都不知道。
        - id: ch01-b12
          speaker: narrator
          text: 黑蛇先生紧跟着赶到。他一见吉米挡在前面，猛地刹住身子，恼火地发出嘶嘶声。
        - id: ch01-b13
          speaker: jimmy_skunk
          text: 你追着蟾蜍先生，到底想干什么？
        - id: ch01-b14
          speaker: mr_blacksnake
          text: 少管闲事！快给我让路，不然你会后悔的！
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: 吉米听了只管发笑，接着便跨到可怜的老蟾蜍先生前面。黑蛇先生在小径上盘起身子，极其无礼地朝吉米吐着舌头，还故意把自己装得十分凶狠。他张开大嘴，直朝吉米扑去，却又小心地算准距离，偏偏不让自己真的碰到吉米。他只是想把吉米吓走。
        - id: ch01-b16
          speaker: narrator
          text: 可吉米一点儿也没有害怕。他太了解黑蛇先生了，知道这条蛇看着凶，其实是个胆小鬼。吉米忽然咬紧牙，发出一阵叫人听了很不舒服的声音，迎面朝他逼过去。黑蛇先生哪里还敢等？不，先生，他一刻也没等。他猛地掉头，一边气呼呼地嘶叫，一边沿弯弯小径往上滑走了。
        - id: ch01-b17
          speaker: narrator
          text: 吉米又追出一小段，这才回到老蟾蜍先生身边。
        - id: ch01-b18
          speaker: old_mr_toad
          text: 啊，你来得正是时候！我连一步都跳不动了。
        - id: ch01-b19
          speaker: jimmy_skunk
          text: 看来确实是。你先把气喘匀，再跟我一起走吧。
        - id: ch01-b20
          speaker: narrator
          text: 老蟾蜍先生果真先喘匀了气，然后跟着吉米一起走了。
