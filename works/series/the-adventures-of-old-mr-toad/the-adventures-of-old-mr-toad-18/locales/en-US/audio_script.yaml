audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, good-natured, and quietly confident
        timbre: mellow and slightly husky
        pace: relaxed
        pitch: medium-low
    mr_blacksnake:
      display_name: Mr. Blacksnake
      tts:
        delivery: sly, sharp, and threatening
        timbre: thin and hissing
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: Jimmy Skunk Is Just in Time
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jimmy Skunk ambled along, chuckling to himself. Old Mr. Toad had been in such a rush after hearing that Mr. Blacksnake had asked about him. Watching Mr. Toad try to hurry had been very funny indeed.
        - id: ch01-b02
          speaker: narrator
          text: Then Jimmy suddenly stopped laughing. He stopped ambling down the Crooked Little Path, too. He turned and looked back, scratching his head as he thought. Old Mr. Toad had gone up that path, and that was exactly where Mr. Blacksnake had shown himself that morning.
        - id: ch01-b03
          speaker: jimmy_skunk
          text: If Mr. Blacksnake is still up there, Old Mr. Toad is hopping straight into the worst kind of trouble. Why didn't he ask me where Mr. Blacksnake was? Well, it isn't my business. I suppose I'll keep going.
        - id: ch01-b04
          speaker: narrator
          text: Jimmy walked only a few more steps down the path before stopping again. Though Jimmy was naturally rather lazy, he was truly a kindhearted little fellow. Somehow, he could not bear thinking about what might happen to Old Mr. Toad.
        - id: ch01-b05
          speaker: jimmy_skunk
          text: I don't want to go all the way back there. But the Green Meadows wouldn't feel the same without Old Mr. Toad. I'd miss him if something happened. And it would partly be my fault. If I hadn't turned over that bark, he probably would have stayed there safely for the rest of the day.
        - id: ch01-b06
          speaker: narrator
          text: A little voice inside Jimmy suggested that perhaps Mr. Toad would not meet Mr. Blacksnake.
        - id: ch01-b07
          speaker: jimmy_skunk
          text: But perhaps he will.
        - id: ch01-b08
          speaker: narrator
          text: Jimmy said that aloud. Then he headed back up the Crooked Little Path. Strange as it may seem, Jimmy hurried.
        - id: ch01-b09
          speaker: narrator
          text: Jimmy had just reached a bend in the path when poor Old Mr. Toad ran straight into him. Mr. Toad squealed in fright, toppled onto his back, and kicked foolishly as he tried to stand. He was out of breath, frightened, and tired. All he could do was kick and kick. He had been looking behind him, so he had not seen Jimmy at all. He did not even know whom he had bumped into.
        - id: ch01-b10
          speaker: narrator
          text: Right behind Old Mr. Toad came Mr. Blacksnake. Of course, he saw Jimmy standing there. He stopped short and hissed angrily.
        - id: ch01-b11
          speaker: jimmy_skunk
          text: What were you planning to do to Mr. Toad?
        - id: ch01-b12
          speaker: mr_blacksnake
          text: That's none of your concern! Move aside, or you'll regret it.
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: Jimmy only laughed and stepped in front of poor Old Mr. Toad. Mr. Blacksnake coiled himself up in the path and darted his tongue at Jimmy in the rudest way. Then he did his best to look fierce. He sprang straight at Jimmy with his mouth wide open, but he took great care not to jump quite far enough to reach him. He was only trying to scare Jimmy away.
        - id: ch01-b14
          speaker: narrator
          text: But Jimmy did not scare. He knew all about Mr. Blacksnake, including the fact that the snake was really a coward. Jimmy suddenly gritted his teeth in a way that was not at all pleasant to hear, and then he started toward him.
        - id: ch01-b15
          speaker: narrator
          text: Mr. Blacksnake did not wait. No, sir, he did not wait at all. He whipped around and glided back up the Crooked Little Path, hissing angrily. Jimmy followed him for a short distance, then returned to Old Mr. Toad.
        - id: ch01-b16
          speaker: old_mr_toad
          text: Oh, you arrived just in time! I couldn't have made one more hop.
        - id: ch01-b17
          speaker: jimmy_skunk
          text: I suppose I did. Catch your breath now, and then come with me.
        - id: ch01-b18
          speaker: narrator
          text: And that was exactly what Old Mr. Toad did.
