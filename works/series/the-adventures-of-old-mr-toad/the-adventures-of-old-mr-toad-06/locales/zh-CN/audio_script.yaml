audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 见多识广，直率中带着固执
        timbre: 粗粝厚实
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第六章　彼得又有了新发现
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 世上的奇事，比你做梦时想到的还要多。许多最平常的东西也藏着美，只看你有没有一双善于发现的眼睛。
        - id: ch01-b02
          speaker: narrator
          text: 兔子彼得还小、头一回离家出走时，就认识老蟾蜍先生了。可这么多年来，他从没想到老蟾蜍先生居然会唱歌。彼得一直觉得他长得挺难看，邻居们也差不多都这么想。
        - id: ch01-b03
          speaker: narrator
          text: 大家倒是很喜欢老蟾蜍先生。他脾气和善，只管自己的事，从不多管闲事。不过，大伙儿也常拿他开玩笑。谁都没想过，他身上还会有美的地方。
        - id: ch01-b04
          speaker: narrator
          text: 现在，大家发现老蟾蜍先生真有一副美妙的嗓子，对他便敬重多了。兔子彼得尤其如此。只要一路上没有危险，他每天都要跑到微笑池，坐在岸边听老蟾蜍先生唱歌。
        - id: ch01-b05
          speaker: narrator
          text: 一天，老蟾蜍先生从池水里抬头望着彼得。彼得忍不住问他。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 你明明会唱歌，为什么以前从不告诉我们？
        - id: ch01-b07
          speaker: old_mr_toad
          text: 告诉你们有什么用？就算我说了，你们也不会相信。后来我真的说了，你们不是仍旧不信吗？
        - id: ch01-b08
          speaker: narrator
          text: 彼得知道他说得没错，一时找不到话回答。过了一会儿，他又小心地问了一句。
        - id: ch01-b09
          speaker: peter_rabbit
          text: 可我以前为什么一次也没听见你唱歌？
        - id: ch01-b10
          speaker: old_mr_toad
          text: 你听见过。去年春天，我就在这里唱过。前年春天、大前年春天，我也都在这里唱。那时候，你不知在这岸边坐过多少次。彼得，你呀，就是不会好好用自己的眼睛和耳朵。
        - id: ch01-b11
          speaker: narrator
          text: 彼得更难为情了，可他还是要问。要是有机会提问却白白放过，那可就不是彼得啦。
        - id: ch01-b12
          speaker: peter_rabbit
          text: 那我在草地上或者老果园里，也听见过你唱吗？
        - id: ch01-b13
          speaker: old_mr_toad
          text: 没有。我只在春天唱，因为春天就该唱歌。一到春天，我非唱不可。夏天太热，冬天我又在睡觉。我总要回故乡来唱歌。你知道，我就出生在这里。我们全家每年春天都会聚到这儿唱歌，我当然也会来。
        - id: ch01-b14
          speaker: narrator
          text: 老蟾蜍先生把下巴底下那个古怪的音乐袋鼓起来，又唱上了。彼得就在岸边看着。说来也巧，老蟾蜍先生正对着他，彼得低头便望进了他的双眼。
        - id: ch01-b15
          speaker: narrator
          text: 彼得以前从来没有细看过那双眼睛。这一回，他盯着看了又看，忽然发现，老蟾蜍先生的眼睛真美，实在美极了。
        - id: ch01-b16
          speaker: peter_rabbit
          text: 啊，蟾蜍先生，您的眼睛可真漂亮！
          emotion: surprised
        - id: ch01-b17
          speaker: old_mr_toad
          text: 以前也有人这样夸过我。我们这一家，向来都有漂亮的眼睛。有句老话，说每只蟾蜍的脑袋里都藏着宝石。当然不是真宝石，说的就是我们的美丽眼睛。
        - id: ch01-b18
          speaker: old_mr_toad
          text: 先不陪你了，彼得。那边的大合唱正需要我呢。
        - id: ch01-b19
          speaker: narrator
          text: 老蟾蜍先生又一次鼓起喉咙，唱了起来。
        - id: ch01-b20
          speaker: narrator
          text: 彼得继续看了一会儿，才蹦蹦跳跳地回到他心爱的老荆棘丛。一路上，他一直在想这件事。
        - id: ch01-b21
          speaker: peter_rabbit
          text: 从今以后，要是还没有把谁真正了解清楚，我再也不说他不好看、长得难看了。
        - id: ch01-b22
          speaker: narrator
          text: 这真是个很明智的决定。你说，是不是？
