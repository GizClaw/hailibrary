audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, inquisitive, and openly expressive
        timbre: youthful and bright
        pace: quick
        pitch: medium-high
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: Peter Discovers Something More
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The world holds stranger things than you may ever dream. Even the most ordinary things can be beautiful, if only you have eyes to see.
        - id: ch01-b02
          speaker: narrator
          text: Peter Rabbit had known Old Mr. Toad ever since he was little and first ran away from home. Yet Peter had never once imagined that Mr. Toad could sing. He had always thought the old fellow was almost ugly, and most of the neighbors thought so too.
        - id: ch01-b03
          speaker: narrator
          text: Everyone was fond of Mr. Toad. He was always good-natured, and he took care of his own affairs without bothering anyone else. Still, the neighbors liked to make fun of him. It never entered their heads that there might be something beautiful about him.
        - id: ch01-b04
          speaker: narrator
          text: Once they discovered his beautiful voice, though, they treated him with much more respect. Peter most of all. He soon made a habit of going to the Smiling Pool every day. Whenever the way was clear, he sat on the bank just to listen to Mr. Toad sing.
        - id: ch01-b05
          speaker: peter_rabbit
          text: Why didn't you tell us before that you could sing?
        - id: ch01-b06
          speaker: narrator
          text: One day, Peter asked that as Mr. Toad looked up at him from the pool.
        - id: ch01-b07
          speaker: old_mr_toad
          text: Why waste my breath? You wouldn't have believed me. Why, you didn't believe me even when I told you.
        - id: ch01-b08
          speaker: narrator
          text: Peter knew that was true. For a moment, he had no answer. Then he tried another question.
        - id: ch01-b09
          speaker: peter_rabbit
          text: Then how come I've never heard you sing before?
        - id: ch01-b10
          speaker: old_mr_toad
          text: You have heard me! I sang in this very spot last spring, and the spring before that, and the spring before that. You sat on that bank plenty of times while I was singing. Peter, your trouble is that you don't use your eyes or your ears.
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: Peter looked more foolish than ever. But he still had another question. Peter Rabbit never let a good chance for questions slip away.
        - id: ch01-b12
          speaker: peter_rabbit
          text: Have I ever heard you singing up in the meadows or over in the Old Orchard?
        - id: ch01-b13
          speaker: old_mr_toad
          text: No. I sing only in spring, because that's when I simply have to sing. Summer is too hot, and I sleep through winter. When it's time to sing, I always come back to my old home. I was born here, you know. My whole family gathers here each spring to sing, so naturally I join them.
        - id: ch01-b14
          speaker: narrator
          text: Mr. Toad puffed out the strange music bag beneath his chin and began to sing again. Peter watched closely. Mr. Toad happened to be facing him, so Peter looked straight down into his eyes.
        - id: ch01-b15
          speaker: narrator
          text: Peter had never looked into those eyes before. Now he stared and stared. For the first time, he saw that Mr. Toad's eyes were beautiful. They were very beautiful indeed.
        - id: ch01-b16
          speaker: peter_rabbit
          text: Oh! Mr. Toad, your eyes are beautiful!
          emotion: surprised
        - id: ch01-b17
          speaker: old_mr_toad
          text: So I've heard. My family has always had beautiful eyes. There's an old saying that every toad carries jewels in his head. We don't have real jewels, of course. The saying means our beautiful eyes.
        - id: ch01-b18
          speaker: old_mr_toad
          text: Excuse me, Peter. The chorus needs me.
        - id: ch01-b19
          speaker: narrator
          text: Once more, Mr. Toad swelled out his throat and began to sing.
        - id: ch01-b20
          speaker: narrator
          text: Peter watched a little longer. Then he hopped back to the dear Old Briar-patch, thinking hard about what he had learned.
        - id: ch01-b21
          speaker: peter_rabbit
          text: I'll never call anyone homely or ugly again until I know all about him.
        - id: ch01-b22
          speaker: narrator
          text: That was a very wise decision. Don't you think so?
