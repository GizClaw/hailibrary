audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 见多识广，直率中带着固执
        timbre: 粗粝厚实
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十一章　老蟾蜍先生古怪的舌头
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 大自然妈妈早有安排，无论孩子是大还是小。她的智慧把一切需要都料到，一个不漏，全都照料好。
        - id: ch01-b02
          speaker: narrator
          text: 你要是不信，就去问问老蟾蜍先生吧。兔子彼得就曾问过他，他走得这么慢，究竟怎么捉到足够的虫子，养活自己。彼得因此还真学到了一件新鲜事。
        - id: ch01-b03
          speaker: narrator
          text: 那时，彼得和老蟾蜍先生正坐在雨里，看一只只小蟾蜍离开微笑池里的幼儿园，动身去见识大千世界。这些小家伙全是老蟾蜍先生的孩子。最后一只也从他们身边蹦过去以后，老蟾蜍先生忽然发觉，自己已经饿得不得了。
        - id: ch01-b04
          speaker: old_mr_toad
          text: 我在微笑池里忙着唱歌，哪有工夫好好吃东西？嘴巴又不能边吃边唱。如今总算不用唱了，我才记起，光顾着嗓子可不行，还得顾顾肚子。看见那边叶子上的虫子了吗？你瞧好了。
        - id: ch01-b05
          speaker: narrator
          text: 彼得一看，果然有只肥虫在一片枯叶上飞快地爬。它离老蟾蜍先生不过两英寸。彼得明明一直盯着它，可那只虫子忽然就不见了。
        - id: ch01-b06
          speaker: narrator
          text: 彼得赶紧转头。老蟾蜍先生还端端正正地坐在原处，一步也没动。这会儿，他却咂着嘴，眼睛里闪着满足的光。彼得惊得把眼睛瞪得老大。
        - id: ch01-b07
          speaker: peter_rabbit
          text: 怎……怎么回事？
          emotion: surprised
        - id: ch01-b08
          speaker: old_mr_toad
          text: 那虫子味道真不错。我可有好久没吃到这么香的虫子了。
        - id: ch01-b09
          speaker: peter_rabbit
          text: 可是，我根本没看见您把它捉住呀！
        - id: ch01-b10
          speaker: narrator
          text: 彼得很不服气。他盯着老蟾蜍先生，简直怀疑对方是在拿他寻开心。
        - id: ch01-b11
          speaker: old_mr_toad
          text: 怎么，你的眼睛出毛病了吗？
        - id: ch01-b12
          speaker: peter_rabbit
          text: 才没有呢。我的眼睛一直好使得很。
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: 彼得回答时，已经有一点儿恼火了。
        - id: ch01-b14
          speaker: old_mr_toad
          text: 那你再看好了。瞧见前面那只苍蝇了吗？这回看我怎么捉它。
        - id: ch01-b15
          speaker: narrator
          text: 一只苍蝇落在前面的草叶上。老蟾蜍先生朝它蹦过去，在两英寸以外停下。彼得怎么看，他都只是一动不动地坐着。可那只苍蝇还是消失了，而且彼得敢肯定，它绝不是自己飞走的。
        - id: ch01-b16
          speaker: narrator
          text: 后来，彼得把这件怪事讲给彼得太太听。他是这样说的。
        - id: ch01-b17
          speaker: peter_rabbit
          text: 它先是在那儿，接着就不在了。事情就这么简单罢了。
        - id: ch01-b18
          speaker: narrator
          text: 老蟾蜍先生呵呵笑起来。
        - id: ch01-b19
          speaker: old_mr_toad
          text: 怎么样，彼得？这一次，你还是没看清它怎么不见的吧？
        - id: ch01-b20
          speaker: narrator
          text: 彼得摇了摇头。
        - id: ch01-b21
          speaker: peter_rabbit
          text: 请您别再捉弄我了。您拿我开玩笑，也已经笑够了。现在就告诉我，您究竟是怎么办到的吧。求您了，老蟾蜍先生。
        - id: ch01-b22
          speaker: narrator
          text: 彼得这样开口相求，老蟾蜍先生当然没法拒绝。其实，换了谁都拒绝不了。
        - id: ch01-b23
          speaker: old_mr_toad
          text: 有只蚂蚁正朝这边爬过来。这一次，别看蚂蚁，只管盯住我的嘴。看看会发生什么。
        - id: ch01-b24
          speaker: narrator
          text: 彼得先看见一只黑色的大蚂蚁爬近，又马上把目光转到老蟾蜍先生的嘴上。忽然，一小道红光从那张嘴里闪了出来。那道光又细又快，彼得甚至不能肯定自己到底看见了没有。
        - id: ch01-b25
          speaker: narrator
          text: 可他回头再找，那只蚂蚁已经无影无踪。彼得直直地盯着老蟾蜍先生，像是要把这个秘密看穿。
        - id: ch01-b26
          speaker: peter_rabbit
          text: 老蟾蜍先生，难道您的舌头真有那么长，能一下伸到刚才那只蚂蚁待的地方？
          emotion: surprised
        - id: ch01-b27
          speaker: narrator
          text: 老蟾蜍先生又呵呵笑了。虫子每咽下一只，他的脾气就更和气一点儿。
        - id: ch01-b28
          speaker: old_mr_toad
          text: 你猜对了，彼得。我的舌头是不是挺管用？
        - id: ch01-b29
          speaker: peter_rabbit
          text: 我看这舌头怪得很，我怎么也想不通。它既然那么长，平常不用时，您把它放在哪里？您总得把它吞下去，才不会碍事吧？要不然，它就只能一直挂在嘴巴外面了。
        - id: ch01-b30
          speaker: narrator
          text: 老蟾蜍先生听了，哈哈大笑。
        - id: ch01-b31
          speaker: old_mr_toad
          text: 我的舌头从来不碍事，而且是全世界最管用的舌头。来，我这就让你看看。
