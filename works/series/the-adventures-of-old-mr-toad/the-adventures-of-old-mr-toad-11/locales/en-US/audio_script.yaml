audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, curious, and openly expressive
        timbre: youthful and clear
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Old Mr. Toad's Queer Tongue
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mother Nature provides for every one of her children, large or small. In her wisdom, she sees what all of them will need and makes sure those needs are met.
        - id: ch01-b02
          speaker: narrator
          text: If you doubt it, ask Old Mr. Toad how someone as slow as he is can catch enough bugs and insects to stay alive. Peter Rabbit asked him and learned something new. Peter and Mr. Toad were sitting in the rain, watching the tiny Toads leave their kindergarten in the Smiling Pool. Those tiny Toads were Mr. Toad's children, and they were setting out to see the Great World. As the last little Toad passed, Mr. Toad suddenly remembered that he was hungry. He was very hungry indeed.
        - id: ch01-b03
          speaker: old_mr_toad
          text: I didn't have much time to eat while I was in the Smiling Pool. I couldn't sing and eat at the same time, and while I was down there, I was supposed to sing. Now it's time to stop singing, and I'm beginning to remember that I have a stomach to look after as well as a voice. See that bug on the leaf? Watch it.
        - id: ch01-b04
          speaker: narrator
          text: Peter looked. Sure enough, a fat bug was crawling quickly across an old leaf, only about two inches from Mr. Toad. Right while Peter was watching, the bug vanished.
        - id: ch01-b05
          speaker: narrator
          text: Peter turned to look at Mr. Toad. The old fellow had not budged. He was sitting exactly where he had been sitting all along, but now he was smacking his lips, and a satisfied twinkle shone in his eyes. Peter opened his own eyes very wide.
        - id: ch01-b06
          speaker: peter_rabbit
          text: Wha... what happened?
          emotion: surprised
        - id: ch01-b07
          speaker: old_mr_toad
          text: That was a fine bug. The best I've tasted in a long while.
        - id: ch01-b08
          speaker: peter_rabbit
          text: But I never saw you catch it!
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: Peter stared at Mr. Toad as though he suspected the old fellow of playing a joke on him.
        - id: ch01-b10
          speaker: old_mr_toad
          text: Is something the matter with your eyes?
        - id: ch01-b11
          speaker: peter_rabbit
          text: No. My eyes work as well as they ever did.
          emotion: angry
        - id: ch01-b12
          speaker: old_mr_toad
          text: Then watch while I catch that fly over there.
        - id: ch01-b13
          speaker: narrator
          text: Mr. Toad hopped toward a fly that had landed on a blade of grass just ahead. He stopped about two inches away. As far as Peter could tell, Mr. Toad sat perfectly still. Yet the fly disappeared, and Peter was certain it had not flown away. When he told Mrs. Peter about it later, he said that one moment the fly was there, and the next moment it wasn't. That was all there was to it.
        - id: ch01-b14
          speaker: narrator
          text: Old Mr. Toad chuckled.
        - id: ch01-b15
          speaker: old_mr_toad
          text: Did you miss that one too, Peter?
        - id: ch01-b16
          speaker: narrator
          text: Peter shook his head.
        - id: ch01-b17
          speaker: peter_rabbit
          text: Please stop fooling me. You've had your joke and your laugh. Now tell me how you do it, Mr. Toad. Please.
        - id: ch01-b18
          speaker: narrator
          text: When Peter said please in that way, Mr. Toad could not resist him. Nobody could.
        - id: ch01-b19
          speaker: old_mr_toad
          text: An ant is coming toward us. This time, watch my mouth instead of watching the ant. Then you'll see what happens.
        - id: ch01-b20
          speaker: narrator
          text: Peter looked and saw a big black ant coming toward them. Then he kept his eyes fixed on Mr. Toad's mouth. Suddenly, a little flash of red darted out. It was so tiny and so quick that Peter could not be completely sure he had seen it. But when he looked for the ant, it was nowhere to be seen. Peter gave Mr. Toad a long, hard look.
        - id: ch01-b21
          speaker: peter_rabbit
          text: Mr. Toad, do you really have a tongue long enough to reach all the way to that ant?
        - id: ch01-b22
          speaker: narrator
          text: Mr. Toad chuckled once more. Every insect he swallowed put him in a better mood.
        - id: ch01-b23
          speaker: old_mr_toad
          text: That's exactly right, Peter. It is a useful tongue, isn't it?
        - id: ch01-b24
          speaker: peter_rabbit
          text: I call it a very queer tongue, and I still don't understand it. If it's that long, where do you put it when you're not using it? You must have to swallow it to keep it out of the way, unless you let it hang from your mouth.
        - id: ch01-b25
          speaker: old_mr_toad
          text: Ha, ha, ha, ha, ha! My tongue never gets in my way. It's the handiest tongue in the world. I'll show it to you.
          emotion: happy
