audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 见多识广，直率中带着固执
        timbre: 粗粝厚实
        pace: 中速
        pitch: 中低音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 威严自信，说起话来响亮而干脆
        timbre: 低沉洪亮
        pace: 稳健
        pitch: 低音
  chapters:
    - id: ch01
      title: 第八章　老蟾蜍先生的孩子们
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 微笑池是一间育儿园。阳光灿烂一整天，成千逗趣的小娃娃，边玩边学乐无边。
        - id: ch01-b02
          speaker: narrator
          text: 说真的，微笑池就像一所幼儿园，而且是世上最有意思的幼儿园之一。小水獭乔的孩子们在这里学游泳。麝鼠杰里和水貂比利家的小宝宝也一样。鳟鱼、鲦鱼家的小鱼娃娃，还有许许多多别的孩子，也都在这儿玩耍。青蛙爷爷的儿孙们和老蟾蜍先生的孩子们，同样能在这里见到。
        - id: ch01-b03
          speaker: narrator
          text: 兔子彼得早就知道青蛙家的小宝宝。老蟾蜍先生明明是青蛙爷爷的亲表弟，彼得却从不了解蟾蜍家的小宝宝。他只知道，每年到了一定的时候，总会有许多小得不得了的蟾蜍冒出来，雨天尤其多。那些小家伙除了个头，简直和老蟾蜍先生一模一样。
        - id: ch01-b04
          speaker: narrator
          text: 彼得听人说过，蟾蜍是从天上跟着雨点落下来的。有时看上去，还真像那么回事。他当然知道这不可能，可又总想不明白。刚才明明一只蟾蜍也没有。雨才一下，转眼就到处都是小蟾蜍。他每跳一步都得小心，免得踩着哪一只。
        - id: ch01-b05
          speaker: narrator
          text: 这天，彼得去微笑池拜访老蟾蜍先生，照例想听听那甜美的歌声。他又记起了往年的事。今年虽然还没见过小蟾蜍，他却已经打定主意，要向老蟾蜍先生问个明白。
        - id: ch01-b06
          speaker: narrator
          text: 老蟾蜍先生坐在平常的地方，却没有唱歌。他只顾盯着水里的一样东西。彼得向他道了早安，他好像根本没听见，眼睛始终没有离开水面。
        - id: ch01-b07
          speaker: narrator
          text: 彼得也朝水里看，想知道什么能让老蟾蜍先生这样出神。可是看来看去，他只瞧见一大群扭来扭去的蝌蚪。
        - id: ch01-b08
          speaker: peter_rabbit
          text: 一本正经先生，您到底在盯着什么呀？
        - id: ch01-b09
          speaker: narrator
          text: 彼得把声音放大了一些。老蟾蜍先生这才回头看他，脸上满是骄傲。
        - id: ch01-b10
          speaker: old_mr_toad
          text: 我在看我的孩子们。你瞧，它们多可爱！
        - id: ch01-b11
          speaker: narrator
          text: 彼得把眼睛瞪得更大了，可他还是没看见任何像蟾蜍宝宝的东西。
        - id: ch01-b12
          speaker: peter_rabbit
          text: 它们在哪儿？我只看见青蛙爷爷家的小宝宝。再说句实话，我一直觉得，蝌蚪是世上最不好看的东西。
        - id: ch01-b13
          speaker: narrator
          text: 老蟾蜍先生听了，顿时气恼起来。
        - id: ch01-b14
          speaker: old_mr_toad
          text: 那不是青蛙爷爷的孩子，是我的！你可听清楚了，它们是全世界最漂亮的小宝宝！
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: 彼得赶紧用一只手挡住嘴角，好把笑容藏起来。
        - id: ch01-b16
          speaker: peter_rabbit
          text: 对不起，蟾蜍先生。我……我还以为蝌蚪都是青蛙宝宝呢。在我看来，它们的模样全都一样。
        - id: ch01-b17
          speaker: old_mr_toad
          text: 它们才不一样！怎么会有人把我的孩子错认成它们的表亲，我真想不通。我的孩子明明这么漂亮，可是……
        - id: ch01-b18
          speaker: grandfather_frog
          text: 咕——咚！你在胡说什么？真要比漂亮，你的孩子根本没法跟我的孩子比！让彼得来评评，看我说得对不对。
        - id: ch01-b19
          speaker: narrator
          text: 青蛙爷爷用低沉洪亮的声音打断了老蟾蜍先生。彼得却很聪明，只把嘴闭得紧紧的。
        - id: ch01-b20
          speaker: narrator
          text: 说实话，不管是哪一家的孩子，他都看不出哪里漂亮。在他眼里，那些小家伙全是扭来扭去的蝌蚪。
        - id: ch01-b21
          speaker: narrator
          text: 不过，现在这些蝌蚪倒更有意思了。彼得刚刚知道，其中有些是蟾蜍，有些是青蛙。他以前从不知道，蟾蜍宝宝出生时也是蝌蚪。
        - id: ch01-b22
          speaker: narrator
          text: 青蛙爷爷和老蟾蜍先生已经越吵越凶。彼得可不打算让自己也卷进这场争论。
