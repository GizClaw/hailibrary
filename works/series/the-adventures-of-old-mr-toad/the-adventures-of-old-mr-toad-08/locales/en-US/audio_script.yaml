audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, curious, and politely mischievous
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: booming, proud, and confidently outspoken
        timbre: deep and resonant
        pace: measured
        pitch: very low
  chapters:
    - id: ch01
      title: Old Mr. Toad's Babies
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Smiling Pool is a nursery. All through the sunny day, a thousand funny babies learn while they play.
        - id: ch01-b02
          speaker: narrator
          text: In fact, the Smiling Pool is a kind of kindergarten, and one of the most interesting in the whole world. Little Joe Otter's children learn to swim there. So do the babies of Jerry Muskrat and Billy Mink. There are baby Trout and Minnows, too, and many others. Among them are the children and grandchildren of Grandfather Frog and Old Mr. Toad.
        - id: ch01-b03
          speaker: narrator
          text: Peter Rabbit had known about the Frog babies for a long time. He also knew that Old Mr. Toad was Grandfather Frog's own cousin. But he knew almost nothing about Toad babies. He only knew that at a certain time each year, he kept finding tiny Toads everywhere, especially when it rained. Every little one looked just like Old Mr. Toad, only much smaller.
        - id: ch01-b04
          speaker: narrator
          text: Peter had heard people say that Toads fall from the sky with the rain. Sometimes it almost seemed true. Of course, Peter knew it couldn't be. Still, he couldn't understand what really happened. At first there wouldn't be a single Toad anywhere. Then the rain would begin, and suddenly so many tiny Toads would appear that Peter could hardly jump without landing on one.
        - id: ch01-b05
          speaker: narrator
          text: Peter was thinking about this as he went to make his daily visit to Old Mr. Toad at the Smiling Pool. He hoped to hear that sweet song again. No little Toads had appeared yet that year, but Peter remembered seeing them in years past, and today he meant to ask about them.
        - id: ch01-b06
          speaker: narrator
          text: Old Mr. Toad sat in his usual place, but he wasn't singing. He was staring down at something in the water.
        - id: ch01-b07
          speaker: peter_rabbit
          text: Good morning, Mr. Toad!
        - id: ch01-b08
          speaker: narrator
          text: Old Mr. Toad didn't seem to hear. Whatever he was watching had all his attention. Peter peered into the water to see what could be so interesting. All he saw was a great many tadpoles wriggling about.
        - id: ch01-b09
          speaker: peter_rabbit
          text: What has you staring so hard, Mr. Sobersides?
        - id: ch01-b10
          speaker: narrator
          text: This time Peter spoke a little louder. Old Mr. Toad turned toward him, and his face was full of pride.
        - id: ch01-b11
          speaker: old_mr_toad
          text: I'm watching my babies. Aren't they lovely?
        - id: ch01-b12
          speaker: narrator
          text: Peter looked harder than ever, but he couldn't find anything that looked like a baby Toad.
        - id: ch01-b13
          speaker: peter_rabbit
          text: Where are they? The only babies I see belong to Grandfather Frog. And if you want my opinion, tadpoles have always been about the homeliest things in the world.
        - id: ch01-b14
          speaker: narrator
          text: Old Mr. Toad became indignant and sputtered his answer.
        - id: ch01-b15
          speaker: old_mr_toad
          text: Those aren't Grandfather Frog's children. They're mine! And I want you to know that they are the most beautiful babies in the world!
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: Peter swept one hand across his mouth to hide a smile.
        - id: ch01-b17
          speaker: peter_rabbit
          text: I beg your pardon, Mr. Toad. I... I thought every tadpole was a baby Frog. They all look the same to me.
        - id: ch01-b18
          speaker: old_mr_toad
          text: Well, they aren't the same. I don't understand how anyone could confuse my babies with their cousins. Mine are beautiful, while...
        - id: ch01-b19
          speaker: grandfather_frog
          text: Chug-arum! What are you talking about? Your babies can't compare with mine for real beauty. Not at all! Let Peter decide which ones are prettier.
        - id: ch01-b20
          speaker: narrator
          text: That was Grandfather Frog's great, deep voice cutting in. But Peter wisely said nothing. The truth was, he couldn't see any beauty in either group. To him, they were all just wriggling pollywogs.
        - id: ch01-b21
          speaker: narrator
          text: Still, Peter found them much more interesting now. He had learned that some tadpoles were Toads and some were Frogs. Until that morning, he had never known that baby Toads begin life as tadpoles.
        - id: ch01-b22
          speaker: narrator
          text: But Peter had no intention of being pulled into the argument. Grandfather Frog and Old Mr. Toad were already quarreling more furiously by the moment.
