  chapters:
    - id: ch01
      title: Old Mr. Toad Learns a Lesson
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Pride is like a great big bubble. You'll find there's nothing in it. Prick it, and after all your trouble, it vanishes in a minute.
        - id: ch01-b02
          speaker: narrator
          text: Old Mr. Toad started toward the Green Forest to have dinner with Buster Bear. He was so puffed up with pride that everyone who saw him wondered if he might burst before he got there. They all knew where he was going, and that made him feel even more proud and important.
        - id: ch01-b03
          speaker: narrator
          text: But Mr. Toad might not have felt quite so grand if he had known why he had received this second invitation. When Jimmy Skunk brought it, he never said that Buster had been asked to invite Mr. Toad. He never said it was part of a plan made by some of Mr. Toad's old friends and neighbors. They meant to teach him a lesson, but Jimmy said nothing about that. No, indeed!
        - id: ch01-b04
          speaker: narrator
          text: So Mr. Toad hopped along, stumbling over his own feet. He held his head so high, and puffed himself out so much, that he couldn't see where he was going.
        - id: ch01-b05
          speaker: narrator
          text: All he could think about was how important Buster Bear must consider him. Why else would Buster invite him to dinner twice? And then there were all the delicious ants he was sure he would get to eat.
        - id: ch01-b06
          speaker: old_mr_toad
          text: Buster Bear certainly has excellent taste. How fortunate that he discovered I enjoy ants too.
        - id: ch01-b07
          speaker: narrator
          text: Mr. Toad was so wrapped up in these pleasant thoughts, and in the fine dinner ahead, that he noticed nothing around him. He never saw his old friends and neighbors peeping out at him and laughing at how silly he looked.
        - id: ch01-b08
          speaker: narrator
          text: He had dressed in his very best, though there was nothing there to be proud of. As you know, Old Mr. Toad has no fine clothes. And all that puffing only made him homelier than ever. That is saying a great deal, because even at his best, Mr. Toad is far from handsome.
        - id: ch01-b09
          speaker: narrator
          text: By the time he reached the Green Forest, he was growing quite tired. Then he saw the rotten old chestnut stump where he was supposed to meet Buster Bear.
        - id: ch01-b10
          speaker: narrator
          text: Buster was already waiting for him.
        - id: ch01-b11
          speaker: buster_bear
          text: How are you on this fine day, Mr. Toad? You look rather warm and a little tired.
        - id: ch01-b12
          speaker: narrator
          text: Mr. Toad was panting for breath, but he answered in his politest manner.
        - id: ch01-b13
          speaker: old_mr_toad
          text: I am a little warm. I hope you're feeling every bit as well as you look, Mr. Bear.
        - id: ch01-b14
          speaker: narrator
          text: Buster let out a great grumbly-rumbly laugh.
        - id: ch01-b15
          speaker: buster_bear
          text: I always feel fine when a dinner of fat ants is waiting for me. It was very kind of you to honor me by coming.
        - id: ch01-b16
          speaker: narrator
          text: Mr. Toad put one hand over his stomach and tried to make a grand bow. Peter Rabbit was hiding behind a nearby tree, and Mr. Toad looked so funny that Peter almost giggled out loud.
        - id: ch01-b17
          speaker: buster_bear
          text: I've also invited someone else to share our dinner.
        - id: ch01-b18
          speaker: narrator
          text: Mr. Toad's face fell. He was selfish, you see. He wanted all the honor of dining with Buster Bear to himself.
        - id: ch01-b19
          speaker: buster_bear
          text: He's running a little late, but he should be here soon. I hope you'll be pleased to meet him. Ah, here he comes now!
        - id: ch01-b20
          speaker: narrator
          text: Mr. Toad looked where Buster was looking. He gave a small gasp and turned quite pale. In an instant, all his puffiness was gone. He hardly looked like the same Toad.
        - id: ch01-b21
          speaker: narrator
          text: The other dinner guest was Mr. Blacksnake.
        - id: ch01-b22
          speaker: old_mr_toad
          text: Oh!
          emotion: fearful
        - id: ch01-b23
          speaker: narrator
          text: Mr. Toad didn't even ask to be excused. He turned his back on Buster Bear and started home the way he had come, taking long, frightened hops.
        - id: ch01-b24
          speaker: peter_rabbit
          text: Ha, ha, ha!
          emotion: happy
        - id: ch01-b25
          speaker: narrator
          text: Peter Rabbit jumped out from behind a tree.
        - id: ch01-b26
          speaker: jimmy_skunk
          text: Ho, ho, ho!
          emotion: happy
        - id: ch01-b27
          speaker: narrator
          text: Jimmy Skunk stepped out from behind another tree.
        - id: ch01-b28
          speaker: johnny_chuck
          text: Hee, hee, hee!
          emotion: happy
        - id: ch01-b29
          speaker: narrator
          text: Johnny Chuck appeared from behind a third tree.
        - id: ch01-b30
          speaker: narrator
          text: Then Old Mr. Toad understood. His old friends and neighbors had planned the whole thing to teach him a lesson.
