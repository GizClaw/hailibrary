audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: breathy, dignified, and firmly determined
        timbre: dry and gravelly
        pace: deliberate
        pitch: low
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: genial, direct, and good-natured
        timbre: deep and rumbling
        pace: unhurried
        pitch: low
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, curious, and playfully mischievous
        timbre: bright and youthful
        pace: quick
        pitch: medium-high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, knowing, and quietly amused
        timbre: mellow and smooth
        pace: relaxed
        pitch: medium-low
