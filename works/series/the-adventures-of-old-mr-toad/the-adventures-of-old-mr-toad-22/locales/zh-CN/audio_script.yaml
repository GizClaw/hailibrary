audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 老实稳重，紧张时气息急促而不失真诚
        timbre: 粗哑温厚
        pace: 平时缓慢，慌张时断续
        pitch: 中低音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 随和机灵，客气中带着一点心照不宣的笑意
        timbre: 柔和微哑
        pace: 从容轻快
        pitch: 中低音
    buster_bear:
      display_name: 巴斯特熊
      tts:
        delivery: 爽朗直接，亲切里带着沉稳的力量
        timbre: 低沉浑厚
        pace: 不疾不徐
        pitch: 低音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇活泼，说话直快，兴奋时带着顽皮劲
        timbre: 明亮轻快
        pace: 偏快而灵活
        pitch: 中高音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直爽厚道，笑起来朴实而痛快
        timbre: 圆润厚实
        pace: 平稳适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二十二章　老蟾蜍先生受到了教训
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 骄傲好比大肥皂泡，里面其实空空荡荡。轻轻一戳，任你再懊恼，转眼之间便没了踪影。
        - id: ch01-b02
          speaker: narrator
          text: 老蟾蜍先生出发去绿森林，要赴巴斯特熊的宴请。他骄傲得浑身胀鼓鼓的，路上见到他的动物都在猜，他会不会还没走到地方就先胀破。大家都知道他的去处，这让他觉得自己更了不起了。
        - id: ch01-b03
          speaker: narrator
          text: 可要是知道第二次邀请是怎么来的，他恐怕就得意不起来了。吉米送信时，没有告诉他，是朋友们请巴斯特发出的邀请。老朋友和老邻居们早就一起定下这个计策，要借这顿饭给他一点教训。吉米呢，一个字也没提。
        - id: ch01-b04
          speaker: narrator
          text: 老蟾蜍先生一路蹦跳，却常被自己的脚绊得踉踉跄跄。他的头抬得太高，身子鼓得太大，根本看不清脚下。他只顾想着，巴斯特竟然第二次请他吃饭，一定把他看得非常重要。那顿饭上，肯定还有美味的蚂蚁等着他。
        - id: ch01-b05
          speaker: old_mr_toad
          text: 巴斯特的品味真不错。幸亏他发现，我也喜欢吃蚂蚁。
        - id: ch01-b06
          speaker: narrator
          text: 老蟾蜍先生满心都是这些美事，还有那顿盼着吃到的好饭，四周发生什么，他一点也没留意。他没看见老朋友和老邻居正从藏身处探头偷看，更没发现大家见他那副又傻又可笑的样子，全都笑了起来。
        - id: ch01-b07
          speaker: narrator
          text: 他已经穿上了自己最体面的衣裳。可你知道，他根本没有什么漂亮衣裳，这实在没什么可骄傲的。再把身子鼓成这样，他显得比平时更难看了。这话的分量可不轻，因为老蟾蜍先生就算模样最好的时候，也绝对算不上英俊。
        - id: ch01-b08
          speaker: narrator
          text: 等他走进绿森林，看见约好碰面的那截烂栗树桩，已经累得够呛。巴斯特正在那里等他。
        - id: ch01-b09
          speaker: buster_bear
          text: 今天天气这么好，您过得怎么样？蟾蜍先生，您看起来有点累，也有点热。
        - id: ch01-b10
          speaker: narrator
          text: 蟾蜍先生喘个不停，却还是摆出了最客气的样子。
        - id: ch01-b11
          speaker: old_mr_toad
          text: 我是有点热。熊先生，您气色这么好，想必身体也好得很吧。
        - id: ch01-b12
          speaker: narrator
          text: 巴斯特发出一阵低沉的轰隆隆大笑。
        - id: ch01-b13
          speaker: buster_bear
          text: 只要有肥蚂蚁等着我，我的感觉就好极了。您肯来跟我一起吃饭，真是太赏脸了。
        - id: ch01-b14
          speaker: narrator
          text: 蟾蜍先生把一只手按在肚子上，想郑重其事地鞠个躬。兔子彼得躲在旁边一棵树后，看他那副滑稽样，差一点就笑出了声。
        - id: ch01-b15
          speaker: buster_bear
          text: 我还冒昧请了另一位客人，来跟我们一起吃饭。
        - id: ch01-b16
          speaker: narrator
          text: 蟾蜍先生的脸一下垮了。你看，他实在很自私。他原本只想自己一个人得到这份荣耀，做唯一一个跟巴斯特熊共进晚餐的客人。
        - id: ch01-b17
          speaker: buster_bear
          text: 他迟到了一会儿，不过应该很快就到了。希望您见到他会高兴。啊，你看，他来了！
        - id: ch01-b18
          speaker: narrator
          text: 老蟾蜍先生顺着巴斯特的目光一看，轻轻倒抽了一口气，脸色立刻变得煞白。他身上那股骄傲劲儿一下泄得干干净净，再也不是刚才那副鼓胀的模样，简直像换了一只蟾蜍。来的是黑蛇先生。
        - id: ch01-b19
          speaker: old_mr_toad
          text: 啊，是黑蛇先生！
          emotion: fearful
        - id: ch01-b20
          speaker: narrator
          text: 老蟾蜍先生连告辞都顾不上，转身背对巴斯特，沿着来路飞快地往回跳。每一下都跳得又远又慌。
        - id: ch01-b21
          speaker: peter_rabbit
          text: 哈，哈，哈！
          emotion: happy
        - id: ch01-b22
          speaker: narrator
          text: 兔子彼得从一棵树后跳了出来。
        - id: ch01-b23
          speaker: jimmy_skunk
          text: 呵，呵，呵！
          emotion: happy
        - id: ch01-b24
          speaker: narrator
          text: 臭鼬吉米也从另一棵树后现身。
        - id: ch01-b25
          speaker: johnny_chuck
          text: 嘻，嘻，嘻！
          emotion: happy
        - id: ch01-b26
          speaker: narrator
          text: 土拨鼠约翰尼藏在第三棵树后，也笑出了声。这一下，老蟾蜍先生终于明白，老朋友和老邻居们早就安排好这一切，专门要给他一点教训。
