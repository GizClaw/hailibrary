schema_version: 1
required: true
sources:
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9245314/
    authority: Peer-reviewed study in Movement Ecology; full text hosted by the U.S. National Library of Medicine
    claims:
      - Tracked Beijing-breeding common swifts of subspecies Apus apus pekinensis made annual round trips of about 30000 km.
      - They left Beijing mainly in July, travelled northwest through Mongolia and Central Asia, crossed the Red Sea, and wintered on the southern African plateau before returning in spring.
      - Tracked birds arrived back in Beijing on average around April 18, with substantial natural variation.
  - url: https://link.springer.com/article/10.1186/s40657-021-00245-w
    authority: Peer-reviewed study in Avian Research
    claims:
      - Beijing swifts are cavity nesters that breed in holes and crevices of old architecture.
  - url: https://www.rspb.org.uk/helping-nature/what-we-do/protecting-species-and-habitats/swift-conservation-take-part-in-swift-mapper
    authority: Royal Society for the Protection of Birds
    claims:
      - Swifts use holes in buildings as nest sites, and renovation can block or destroy those sites.
      - Protecting existing openings or installing purpose-built swift bricks can preserve nesting opportunities.
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3399846/
    authority: Peer-reviewed migration study; full text hosted by the U.S. National Library of Medicine
    claims:
      - Common swifts are highly aerial and ordinarily leave the air chiefly for breeding, though occasional roosting exceptions are documented.
notes: >
  The city, tower, keeper, child, repair project, nest-hole map, and individual birds are fictional.
  Migration facts are based specifically on Beijing-breeding pekinensis tracked in the cited study; the
  story does not claim that every bird follows identical dates or a pinpoint route. “Almost never land”
  is used rather than an absolute claim because occasional non-breeding roosting exceptions exist.
