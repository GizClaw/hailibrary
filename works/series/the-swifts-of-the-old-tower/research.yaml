schema_version: 1
required: true
sources:
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9245314/
    title: The migration route and population characteristics of the Beijing Swift
    authority: Peer-reviewed Movement Ecology article, full text archived by the U.S. National Library of Medicine
    claims:
      - Geolocator data from Beijing-breeding Apus apus pekinensis showed an annual round trip of roughly 30000 kilometers.
      - Tracked birds departed Beijing from mid-July to early August, first moving northwest through Mongolia and Central Asia.
      - The recorded route crossed toward the Red Sea and continued to wintering areas on the southern African plateau.
      - Tracked birds returned to Beijing from early April to mid-May; April 18 was the reported mean arrival date, not a guaranteed date for every bird.
  - url: https://link.springer.com/article/10.1186/s40657-021-00245-w
    title: Nest-site characteristics and breeding ecology of the Beijing Swift
    authority: Peer-reviewed Avian Research article
    claims:
      - Beijing swifts are colonial cavity nesters associated with holes and crevices in historic buildings.
      - Nest-site availability in old architecture is relevant to the conservation of the Beijing population.
  - url: https://www.rspb.org.uk/birds-and-wildlife/swifts
    title: Swifts
    authority: Royal Society for the Protection of Birds species and conservation guidance
    claims:
      - Common swifts feed on airborne invertebrates and gather nesting material in flight.
      - Building renovation can remove or block traditional nest openings.
      - Retaining known openings and providing integrated swift nesting spaces are established conservation responses.
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3399846/
    title: Annual 10-month aerial life phase in the common swift Apus apus
    authority: Peer-reviewed study, full text archived by the U.S. National Library of Medicine
    claims:
      - Common swifts are exceptionally aerial outside the breeding season and may remain aloft for prolonged periods.
      - Occasional non-breeding roosting means absolute claims that swifts never land should be avoided.
fact_boundaries:
  - The tower, repair project, child, keeper, workers, nest map, weather event, dates of particular observations, and individual birds are fictional.
  - The story uses the Beijing-breeding subspecies Apus apus pekinensis as its biological reference.
  - The migration route is the route shown by tracked Beijing birds, not an identical path or timetable followed by every individual.
  - Characters do not handle, open, or inspect active nests.
  - The repair solution is a fictional site-specific decision made with engineering, conservation, and bird expertise, not universal construction guidance.
