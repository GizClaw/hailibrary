audio_script:
  language: zh-CN
  cast:
    narrator: {display_name: 旁白, tts: {delivery: 像在身边讲故事，沉静而有画面感, timbre: 温暖清晰, pace: 从容，紧张处略收紧, pitch: 中}}
    child: {display_name: 小禾, tts: {delivery: 敏锐直率，急切中渐渐多了笃定, timbre: 清亮自然, pace: 稍快, pitch: 中高}}
    tower-keeper: {display_name: 老沈, tts: {delivery: 寡言耐心，每句话都说得准, timbre: 低沉温厚, pace: 偏慢, pitch: 低}}
    foreman: {display_name: 梁岚, tts: {delivery: 直接克制，话里带着现场的分量, timbre: 结实清楚, pace: 中等, pitch: 中低}}
    conservator: {display_name: 陈老师, tts: {delivery: 审慎平和，善于协调, timbre: 平稳清晰, pace: 中等, pitch: 中}}
  chapters:
    - id: ch01
      title: 空着的天空
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            四月十八日，城楼上面还是空空的。

            小禾坐在检票亭后头的石狮子脚上，仰得脖子都酸了。风一吹，槐树的新叶翻出浅白的一面。麻雀在瓦沟里叫，鸽子慢慢飞离广场。可那种像小剪刀一样掠过天空的黑影，一道也没有。

            她打开老沈的记录本。布封皮被手磨亮了，一行行日期里，记着二十三个春天。去年第一只雨燕四月十六日来，前年是十四日。还有一年，直到二十五日才来。
        - id: ch01-b02
          speaker: child
          text: 它们会不会迷路了？
        - id: ch01-b03
          speaker: narrator
          text: 老沈蹲在门口给铜锁上油，头也没抬。
        - id: ch01-b04
          speaker: tower-keeper
          text: 鸟不会照着我的本子飞。
        - id: ch01-b05
          speaker: child
          text: 不是你说的吗？它们认得这个地方。
        - id: ch01-b06
          speaker: tower-keeper
          text: 认得，也会遇上风雨。再等等。
        - id: ch01-b07
          speaker: narrator
          text: |-
            小禾最烦的就是等。墙边已经堆起脚手架，蓝色围挡也到了槐树下。五月就要修城楼。冬天，一块灰浆曾经掉在检票口旁边。幸好那天没有开馆。施工图上写着，松动的地方要清掉，砖缝要修补，孔洞也要封住。

            小禾见过雨燕钻进那些洞。可图上每条缝都像生了病，好像全部抹平，城楼才算健康。鸟要是一直不回来，工人会不会以为，洞里本来就没有东西？

            傍晚关门时，天灰蒙蒙的，像纸上蹭了一层灰。老沈忽然抬起一只手。一声又尖又亮的鸣叫先传过来。两道黑影贴着屋脊冲近，绕了个大弯，从钟洞前一闪而过。第三只从高处斜着落下来，长翅弯成两把窄镰刀。它没有停在瓦上，又向上飞去，追着前面两只没入暮色。
        - id: ch01-b08
          speaker: child
          text: 三只！我看见三只了！
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: 小禾追进院子。老沈这才笑了笑，在四月十八日下面记了个“三”，手指还压着铅笔。
        - id: ch01-b10
          speaker: tower-keeper
          text: 现在只看见这些。天黑前还得再数一遍。
        - id: ch01-b11
          speaker: narrator
          text: |-
            那晚回来的雨燕一共有十一只。它们张嘴在空中捉虫。喝水也不落下，只低低掠过护城河，从水面带走一小口水。只有繁殖的时候，它们才需要城楼屋檐下那些深洞。老沈说，雨燕把一生的大部分时间都交给了天空。

            小禾想，城楼不是关住它们的笼子。它只是远行的鸟每年都要找回的一扇门。

            她没有说出口。忽然，一只雨燕冲向东角。眼看就要撞上墙，它猛地收紧翅膀，从一块松砖下面钻了进去。

            第二天，小禾带来红铅笔，在施工图的复印件上画下第一个圆。
    - id: ch02
      title: 红圈不能猜
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            打那以后，小禾天天放学就来。她和老沈只在地面上看，不爬梯子，也不把手伸进洞里。他们只记雨燕从哪里进去。鸟飞得实在太快，小禾常常看得眼泪直流，最后也只捕捉到一道影子。

            她给可能的入口一个个编号，还在纸边列出时间、方向、飞进和飞出。有一天，两只雨燕在钟洞前交错飞过，她拿红笔一连点了四下。
        - id: ch02-b02
          speaker: child
          text: 有四只，飞进了两个洞！
        - id: ch02-b03
          speaker: narrator
          text: 老沈把望远镜递过来。
        - id: ch02-b04
          speaker: tower-keeper
          text: 你说的是哪两个洞？
        - id: ch02-b05
          speaker: narrator
          text: 小禾再往上看，灰墙安安静静的。她一个也指不出来。
        - id: ch02-b06
          speaker: child
          text: 可我刚刚明明看见了……
        - id: ch02-b07
          speaker: tower-keeper
          text: 也许真有四只。不过“也许”不能填在“亲眼看见”那一栏。
        - id: ch02-b08
          speaker: narrator
          text: 小禾不想擦掉，老沈也没催。他去扫检票亭前的槐花，扫帚擦过石地，沙沙地响。最后，小禾还是拿起橡皮。她擦得太重，纸薄了一小块，那个红圈看起来像受了伤。
        - id: ch02-b09
          speaker: child
          text: 万一少记了一个，后来被工人堵上怎么办？
        - id: ch02-b10
          speaker: narrator
          text: 老沈停住扫帚。
        - id: ch02-b11
          speaker: tower-keeper
          text: 那就多看一阵，不要为了保险多写几个。
        - id: ch02-b12
          speaker: narrator
          text: |-
            他们慢慢确认了七个入口。东角三个，钟洞上面两个，北墙的排水兽后面藏着一个，南边屋檐的阴影里还有一个。只有在不同日子都看见成鸟进出同一个洞，小禾才把红圈描深。另外三个没有再次看见的浅点，她留在旁边，写着“还要观察”。

            巢里面发生了什么，他们看不见。刚开始，成鸟偶尔叼着轻羽和草屑飞进去。后来，它们出去时嘴里空空的，回来却一次次鼓着喉囊。小禾猜，鸟蛋大概孵出来了。她几次想贴在墙上听听，都被老沈扯住书包带。
        - id: ch02-b13
          speaker: tower-keeper
          text: 飞了那么长的路回来，可不是为了让你查它们的窝。
        - id: ch02-b14
          speaker: child
          text: 那到底是多长的路？
        - id: ch02-b15
          speaker: narrator
          text: |-
            老沈从值班室拿来一份研究资料。研究人员曾给在北京繁殖的雨燕装上很轻的定位记录器。等有些鸟第二年回来，再取下记录器读取信息。追踪结果显示，北京雨燕一年往返大约三万公里。它们先往西北飞，经过蒙古和中亚，再向西南越过红海附近，最后到非洲南部的高原过冬。第二年春天，它们又飞回来。

            小禾用手指沿着地图，从北京慢慢划到非洲。越往后，她的手指越慢。
        - id: ch02-b16
          speaker: child
          text: 它们飞这么远，回来却发现门不见了，那该怎么办？
        - id: ch02-b17
          speaker: tower-keeper
          text: 我也不知道。
        - id: ch02-b18
          speaker: narrator
          text: 老沈合上那份资料。
        - id: ch02-b19
          speaker: tower-keeper
          text: 明天要开会。你只带上已经弄清楚的事，没弄清的，别先画成红圈。
    - id: ch03
      title: 图纸上的七个洞
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 会开在城楼值班室。施工负责人梁岚把安全帽搁在腿上，短发里还沾着墙灰。她指了指冬天灰浆掉落的位置，又把砖缝的近照推到桌子中间。
        - id: ch03-b02
          speaker: foreman
          text: 裂缝里进了水，冬天再一冻，砖和灰浆只会越来越松。下面天天有人经过。要是不修，谁也说不准下一块会掉在哪里。
        - id: ch03-b03
          speaker: narrator
          text: 陈老师告诉大家，修旧墙不能像盖新楼那样全部抹平。材料和做法都得适合原来的砖。老沈摊开记录了二十三年来去日期的本子，小禾把画着七个红圈的图纸压在上面。
        - id: ch03-b04
          speaker: child
          text: 现在真的有鸟在用这七个地方。
        - id: ch03-b05
          speaker: narrator
          text: 她说得比自己想象中还轻，只好再开口。
        - id: ch03-b06
          speaker: child
          text: 不是只看见一次。我们在不同日子都看到它们飞进去了。
        - id: ch03-b07
          speaker: narrator
          text: 梁岚一页一页看完他们的记录。
        - id: ch03-b08
          speaker: foreman
          text: 脚手架搭起来，鸟飞的方向会变。只有地面上这些红点，我不能让工人靠近松砖，也没办法断定洞里面安不安全。
        - id: ch03-b09
          speaker: child
          text: 所以还是要把洞全堵住？
        - id: ch03-b10
          speaker: foreman
          text: 我不是这个意思。红点能证明这里有鸟，可它还不能告诉我们该怎么施工。
        - id: ch03-b11
          speaker: narrator
          text: 小禾看向老沈，盼着他帮自己争一争。老沈问的却是另一件事。
        - id: ch03-b12
          speaker: tower-keeper
          text: 西墙没有巢，能不能先修？东面给鸟留出飞到洞口的地方。有巢的砖等幼鸟离开再碰。太松又不能等的，就先从旁边撑住。
        - id: ch03-b13
          speaker: narrator
          text: 梁岚拿铅笔在图上划了几道线。
        - id: ch03-b14
          speaker: foreman
          text: 脚手架得重新排。工期本来定到六月，材料和工人也早安排好了。还有，洞口留多宽，里面留多深，不能由咱们几个人猜。
        - id: ch03-b15
          speaker: conservator
          text: 那就找鸟类保护人员来确认，再请结构工程师一起检查。
        - id: ch03-b16
          speaker: narrator
          text: |-
            这场会没有用一句好听的话收尾。大家量安全距离，查看天气记录，还打电话商量工期。小禾坐了很久，椅子边在腿上硌出一道红印。散会时，梁岚仍没答应一定保住七个洞。她只带走了那张被擦薄的图纸。

            第二天没有消息，第三天也一样。小禾每天放学都要问老沈。
        - id: ch03-b17
          speaker: tower-keeper
          text: 他们还在计算。
        - id: ch03-b18
          speaker: child
          text: 可小鸟不会等他们算好了再长大呀。
        - id: ch03-b19
          speaker: tower-keeper
          text: 墙也不会因为大家着急，就先不往下掉。
        - id: ch03-b20
          speaker: narrator
          text: 第四天，梁岚带着鸟类保护人员和结构工程师来了。他们站在地面看雨燕进出的路线，用长镜头查看洞口周围，只在离巢腔远的地方检查裂缝。小禾想跟过去，被梁岚留在安全线外。
        - id: ch03-b21
          speaker: foreman
          text: 你的图帮我们找到了要看的地方。接下来，得听数据怎么说，也得看墙到底怎么样。
        - id: ch03-b22
          speaker: narrator
          text: |-
            又过两天，检票亭贴出新的施工表。先修西墙。东面的脚手架避开主要飞行路线。有鸟使用的地方推迟施工。危险却暂时不能碰的砖，先加临时防护。

            小禾从头看到尾，怎么也没找到自己的名字。
        - id: ch03-b23
          speaker: tower-keeper
          text: 本来就不用写你。你看，鸟也没在上面签名。
        - id: ch03-b24
          speaker: narrator
          text: 小禾刚想生气，却发现图纸上多了七个蓝色的细圈。每一个蓝圈，都正好套在她画的红圈外面。
    - id: ch04
      title: 雨里的第四号洞
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            五月底，城楼罩上浅灰色防护网。只有东面特意留着一个不太整齐的缺口。雨燕在网边猛地转向，贴着架管钻进巢洞。尖亮的叫声一靠近，工人就停一停电钻。梁岚起初每次都抬头看，后来光听声音，就知道该把钻头移开了。

            游客抱怨要绕路。还有人隔着围挡问，怎么几只鸟比一座城楼还麻烦。梁岚检查着安全绳，没有回答。小禾也没回答。她已经明白，答案不是一句话。答案是今天少修哪一段，哪辆材料车要换时间，还有哪个洞得继续观察。

            六月一连下了三天雨。第四天一早，老沈还没开门，就看见东角掉了一层新灰。第四号洞上方的裂缝从砖角伸进灰缝。昨天还只能塞下一根草，今天已经有小手指那么宽了。
        - id: ch04-b02
          speaker: narrator
          text: 梁岚马上封住东院通道。
        - id: ch04-b03
          speaker: foreman
          text: 这块砖已经动了。要是真掉下来，可能把里面的巢腔也一起扯开。
        - id: ch04-b04
          speaker: narrator
          text: 墙里传出细细的、急促的沙沙声。小禾站在围栏外，脸上还挂着跑来时沾的雨水。
        - id: ch04-b05
          speaker: child
          text: 你答应过，要等小鸟飞走以后再动。
          emotion: fearful
        - id: ch04-b06
          speaker: narrator
          text: 梁岚的眼睛发红，像是整晚没睡。
        - id: ch04-b07
          speaker: foreman
          text: 我答应的是，安全的时候可以等。现在已经不安全了。
        - id: ch04-b08
          speaker: child
          text: 可要是把洞堵住，小鸟也不安全。
          emotion: fearful
        - id: ch04-b09
          speaker: foreman
          text: 对。所以在想清楚以前，谁也不要碰它。
        - id: ch04-b10
          speaker: narrator
          text: |-
            保护人员和工程师赶到时，雨下得更密了。升降台没办法靠近最危险的地方，他们只能站在屋檐下，把照片一张张拿来比较。拆掉松砖，墙会最稳，可正在使用的巢腔就会露出来。完全不碰，砖又可能在幼鸟离巢前掉下去。工程师提出，从侧面固定周围的砖，再用窄支撑托住松砖。这样既不堵入口，也不碰巢腔。不过东院得继续关闭，临时支撑也可能撑不住。

            陈老师问要花多少钱。梁岚报了数字，又说接下来两周的安排全得重排。大家一时都没有说话。屋檐上的雨水连成了一条线。
        - id: ch04-b11
          speaker: foreman
          text: 就照这个办法做。
        - id: ch04-b12
          speaker: conservator
          text: 还得先补办审批。
        - id: ch04-b13
          speaker: foreman
          text: 那就马上报。
        - id: ch04-b14
          speaker: narrator
          text: 梁岚把手机塞进防水袋。
        - id: ch04-b15
          speaker: foreman
          text: 墙要保住，下面的人也要保住。里面那窝鸟，也不能从我们手里掉下来。
        - id: ch04-b16
          speaker: narrator
          text: |-
            下午雨小了。梁岚系好安全绳，爬上脚手架。小禾被留在院门外，只能透过围挡的缝，看见一小片东墙。锤子轻轻敲一下，隔很久才再敲一下。成鸟绕着城楼飞，一次次靠近，又一次次转回去。叫声像在潮湿的空气上划开一道口子。

            一只成鸟叼着食团直奔第四号洞。它看见升降台，立刻翻身飞开。绕过一圈，它又回来了。梁岚停下工具，双手离开墙面。工程师也站着不动。雨燕从安全帽旁擦过，收起翅膀钻进原来的小洞。等它的尾羽完全看不见，梁岚才慢慢放下手。

            傍晚，支撑装好了，裂缝旁也贴上监测标记。东院还是关着。老沈写下时间，再把铅笔递给小禾。

            小禾没有多画一个红圈。她只在第四号洞旁写下：“入口还在使用。”
    - id: ch05
      title: 留下来的门
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            临时支撑挺过了后来的雨。小禾每天先检查裂缝边的标记，然后再看洞口。她不再催老沈猜小鸟什么时候出来，只把成鸟每次飞进去的时间记准确。等待并没有变短，却不再像四月那样空荡荡的。

            七月中旬的一个傍晚，第四号洞里露出一张小小的暗脸。它缩回去，过一会儿又探出来。成鸟鸣叫着从上空飞过。幼鸟突然冲出洞口，落得太低，差一点擦到槐树梢。小禾的手心一下冒出汗。她刚要叫出声，幼鸟已经张开长翅，在市场的雨篷上方稳住，又掉头飞过屋脊。
        - id: ch05-b02
          speaker: child
          text: 两只！又出来一只！
          emotion: surprised
        - id: ch05-b03
          speaker: narrator
          text: 洞边刚好闪过另一道影子。老沈把望远镜递给小禾。
        - id: ch05-b04
          speaker: tower-keeper
          text: 先把尾巴看清楚。
        - id: ch05-b05
          speaker: narrator
          text: |-
            小禾追着影子看了半圈，这才认出来，还是刚才那只幼鸟，只是绕回来了。她接过铅笔，在本子上记下：“一只，已经确认离巢。”

            老沈没有夸她，只伸手按住那页纸，没让风把它吹起来。

            一周后，保护人员确认附近的幼鸟都离开了巢穴。梁岚拆掉临时支撑，修完东墙。确认过的入口都保留下来，里面松动的部分也加固了。修好的墙里，还在几个合适的位置留下安全巢腔，洞口接近雨燕原先使用的高度。远远望去，那些洞不过是屋檐下几道暗影。

            工程结束那天，梁岚把洗干净的施工图还给小禾。最早那个被擦薄的红圈外面，套着细蓝圈，旁边还有工程师的小勾。纸角被雨打湿过，皱巴巴的，像一片枯叶。
        - id: ch05-b06
          speaker: foreman
          text: 明年还要再来观察。把洞留下，不代表鸟就一定会住进去。
        - id: ch05-b07
          speaker: child
          text: 嗯，我明白。
        - id: ch05-b08
          speaker: narrator
          text: |-
            小禾这回是真的明白了。地图不能命令天空照着它安排。它只是人在提醒自己，已经看见的事，不能假装没看见。

            到了九月，傍晚听见的鸣叫一天比一天少。最后一群雨燕围着城楼飞了好几圈。叫声从近处突然升高，随后朝西北散开。根据研究记录，北京雨燕常从这个方向开始长途迁徙。它们会经过蒙古、中亚和红海附近，到非洲南部过冬。可站在地面的人，没有谁知道眼前的每一只鸟，当晚会停在哪里。

            小禾跑上一层开放的平台，看着那些黑点一点点融进暮色。
        - id: ch05-b09
          speaker: child
          text: 它们明年肯定还会回来吗？
        - id: ch05-b10
          speaker: narrator
          text: 老沈把记录本翻到空白的一页，却没有写日期。
        - id: ch05-b11
          speaker: tower-keeper
          text: 不知道。
        - id: ch05-b12
          speaker: narrator
          text: |-
            风从修好的砖墙旁吹过。那七道黑暗的洞口没有一点声音，可它们也没有被抹掉。

            小禾把记录本放到城垛上，用两只手压住翘起的纸角，等着老沈写下这一年最后一次看见雨燕的时间。
