"audio_script":
  "language": "zh-CN"
  "cast":
    "narrator":
      "display_name": "旁白"
      "tts":
        "delivery": "轻盈克制，带季节流动感"
        "timbre": "清澈温润的中性声线"
        "pace": "舒缓"
        "pitch": "中音"
    "child":
      "display_name": "小禾"
      "tts":
        "delivery": "敏锐好奇，认真时有倔强"
        "timbre": "清亮少女声"
        "pace": "自然偏快"
        "pitch": "中高音"
    "tower-keeper":
      "display_name": "老沈"
      "tts":
        "delivery": "寡言稳重，偶有干幽默"
        "timbre": "沉着年长男声"
        "pace": "从容偏慢"
        "pitch": "中低音"
    "foreman":
      "display_name": "梁师傅"
      "tts":
        "delivery": "务实谨慎，强调安全"
        "timbre": "结实成年男声"
        "pace": "干脆"
        "pitch": "中低音"
    "conservator":
      "display_name": "文保员"
      "tts":
        "delivery": "专业冷静，善于促成方案"
        "timbre": "清晰成年声"
        "pace": "平稳"
        "pitch": "中音"
  "chapters":
    - "id": "ch01"
      "title": "等天空出现缺口"
      "blocks":
        - "id": "ch01-b01"
          "speaker": "narrator"
          "text": "四月十六日，城楼上空仍是空的。\n小禾坐在检票亭后面的石狮子脚上，仰得脖子发酸。风把槐树的新叶翻出浅白的背面，麻雀在瓦沟里吵，只有那种像小剪刀一样掠过天空的影子没有出现。"
        - "id": "ch01-b02"
          "speaker": "child"
          "text": "去年十六号到了三只。"
        - "id": "ch01-b03"
          "speaker": "narrator"
          "text": "她翻开老沈的记录本，"
        - "id": "ch01-b04"
          "speaker": "child"
          "text": "前年十四号。它们是不是走丢了？"
        - "id": "ch01-b05"
          "speaker": "narrator"
          "text": "老沈正在给铜锁滴油，没有抬头。"
        - "id": "ch01-b06"
          "speaker": "tower-keeper"
          "text": "鸟不看我的本子。"
        - "id": "ch01-b07"
          "speaker": "child"
          "text": "你不是说它们认得这里？"
        - "id": "ch01-b08"
          "speaker": "tower-keeper"
          "text": "认得也会碰上风，碰上雨。等。"
        - "id": "ch01-b09"
          "speaker": "narrator"
          "text": "小禾最不喜欢这个字。城楼五月要修，脚手架已经堆在墙根。施工图上，箭头从裂开的灰缝指向一行字：清理、勾缝、封闭孔洞。她知道那些孔洞里有旧草、羽毛和雨燕留下的白痕。要是鸟再不回来，工人也许会说里面什么都没有。\n傍晚闭门时，天色像一张蒙灰的纸。老沈忽然举起手。小禾先听见一声尖亮的嘶鸣，接着，两道黑影贴着屋脊冲来。它们没有停，斜斜掠过城楼，兜出一个大弯，又从钟洞前穿过。第三只从更高处落下来，翅膀弯得像拉开的弓。\n小禾追到院中："
        - "id": "ch01-b10"
          "speaker": "child"
          "text": "三只！"
        - "id": "ch01-b11"
          "speaker": "narrator"
          "text": "老沈这才笑了一下，在四月十六日下面添了两笔，又停住："
        - "id": "ch01-b12"
          "speaker": "tower-keeper"
          "text": "别急着数。天黑前再看。"
        - "id": "ch01-b13"
          "speaker": "narrator"
          "text": "那晚一共回来十一只。它们追逐着空中的小虫，喝水时也只是掠低，在护城河水面点出一个个转瞬即逝的小凹。只有到了繁殖的时候，它们才真正需要城楼的墙缝和檐下深洞。老沈说，雨燕把一生的大部分时间交给天空；小禾便想，城楼不是它们的笼子，只是远行者每年要找到的一扇门。\n她没有把这句话说出来。她看见一只雨燕收拢翅膀，快得几乎撞墙，在第三层东角一块松砖下面消失了。"
    - "id": "ch02"
      "title": "七个红圈"
      "blocks":
        - "id": "ch02-b01"
          "speaker": "narrator"
          "text": "第二天，小禾用红铅笔在施工图的复印件上点了一个圆。\n从那以后，她每天放学都来。她和老沈站在地面，不爬梯子，不把手伸进洞里，只记录鸟从哪里进去。雨燕太快，常常等得眼睛流泪也只看见一道影子。有一次小禾把两只追逐的鸟算成四只，老沈让她把数字划掉。"
        - "id": "ch02-b02"
          "speaker": "child"
          "text": "可能有四只。"
        - "id": "ch02-b03"
          "speaker": "narrator"
          "text": "她争辩。"
        - "id": "ch02-b04"
          "speaker": "tower-keeper"
          "text": "可能不写进‘看见了’那一栏。"
        - "id": "ch02-b05"
          "speaker": "narrator"
          "text": "记录本上渐渐有了七处入口。东角最多，钟洞上方两处，北墙一处隐在排水兽后面。巢里发生什么，他们看不见，只能从成鸟叼着轻飘飘的羽毛进去，后来又一次次带着食物回来，猜出蛋已经孵化。小禾几次想把耳朵贴到墙上，都被老沈拉住衣领。"
        - "id": "ch02-b06"
          "speaker": "tower-keeper"
          "text": "它们飞了那么远，不是回来给你检查的。"
        - "id": "ch02-b07"
          "speaker": "narrator"
          "text": "雨燕到底飞了多远，是老沈从一份研究资料里给她看的。研究者给在北京繁殖的雨燕戴上很轻的定位记录器，再等它们第二年回来，取下记录。那些被追踪到的鸟一年往返大约三万公里：离开北京后先向西北，经蒙古和中亚，越过红海，最后到非洲南部越冬，再在春天回来。\n小禾的手指沿地图移动，越走越慢。"
        - "id": "ch02-b08"
          "speaker": "child"
          "text": "它从非洲回来，洞却被砖堵了，会怎么办？"
        - "id": "ch02-b09"
          "speaker": "narrator"
          "text": "老沈合上资料："
        - "id": "ch02-b10"
          "speaker": "tower-keeper"
          "text": "先别替工人把坏事做完。明天开会，你把图带来。"
    - "id": "ch03"
      "title": "不能靠猜"
      "blocks":
        - "id": "ch03-b01"
          "speaker": "narrator"
          "text": "会议在城楼值班室里开。施工队的梁师傅把安全帽放在膝上，指着墙体照片说，裂缝进水，冬天冻胀，再不修，松砖会掉。文保员说必须用合适的材料，不能把古墙当新楼抹平。老沈摊开多年记录本，小禾摊开七个红圈。"
        - "id": "ch03-b02"
          "speaker": "child"
          "text": "这几处现在有鸟用。"
        - "id": "ch03-b03"
          "speaker": "narrator"
          "text": "她说。\n梁师傅看了一眼："
        - "id": "ch03-b04"
          "speaker": "foreman"
          "text": "小姑娘，脚手架一搭，哪只鸟进哪个眼，谁看得清？工程不能靠猜。"
        - "id": "ch03-b05"
          "speaker": "child"
          "text": "我们没猜。"
        - "id": "ch03-b06"
          "speaker": "narrator"
          "text": "小禾把日期、时间和进入次数推过去，"
        - "id": "ch03-b07"
          "speaker": "child"
          "text": "是在下面看见的。"
        - "id": "ch03-b08"
          "speaker": "narrator"
          "text": "梁师傅翻了两页，手指停在东角。"
        - "id": "ch03-b09"
          "speaker": "foreman"
          "text": "这块砖松得厉害。不动不行。"
        - "id": "ch03-b10"
          "speaker": "child"
          "text": "那就等小鸟飞走以后再动。"
        - "id": "ch03-b11"
          "speaker": "foreman"
          "text": "工期排到六月。材料、人都定了。"
        - "id": "ch03-b12"
          "speaker": "narrator"
          "text": "屋里安静下来。小禾以为老沈会替她说话，他却问梁师傅："
        - "id": "ch03-b13"
          "speaker": "tower-keeper"
          "text": "能不能先做没有巢的墙面？有巢的区域留出飞行通道，等繁殖结束再修。松砖下面如果必须加固，能不能保留入口，里面做成安全的空腔？"
        - "id": "ch03-b14"
          "speaker": "narrator"
          "text": "梁师傅把安全帽转了半圈。"
        - "id": "ch03-b15"
          "speaker": "foreman"
          "text": "要重新排工序。入口尺寸也得让懂鸟的人确认。不是你们拿红笔一圈就能砌。"
        - "id": "ch03-b16"
          "speaker": "conservator"
          "text": "那就请人确认。"
        - "id": "ch03-b17"
          "speaker": "narrator"
          "text": "文保员说。"
    - "id": "ch04"
      "title": "给飞行留路"
      "blocks":
        - "id": "ch04-b01"
          "speaker": "narrator"
          "text": "没有人拍桌子，也没有人立刻答应。三天后，鸟类保护人员来现场复核；又过一周，新施工表贴在检票亭。脚手架避开主要入口，先修西墙。东角挂了一块小小的施工牌，提醒工人保留净空。小禾看了很久，发现表上没有写她的名字。"
        - "id": "ch04-b02"
          "speaker": "tower-keeper"
          "text": "本来就不该写。"
        - "id": "ch04-b03"
          "speaker": "narrator"
          "text": "老沈说，"
        - "id": "ch04-b04"
          "speaker": "tower-keeper"
          "text": "鸟也没签字。"
        - "id": "ch04-b05"
          "speaker": "narrator"
          "text": "五月底，城楼罩在淡灰色防护网里，只有东侧像故意留了一道不整齐的缺口。雨燕从缺口前急转，贴着架管钻回巢。每当它们靠近，工人会停一下手里的电钻。梁师傅起初总抬头，后来只听声音就能把钻头移开。\n六月的一场急雨后，东角那块松砖裂得更深。碎灰落在地上。梁师傅封了下面的通道，找到老沈："
        - "id": "ch04-b06"
          "speaker": "foreman"
          "text": "不能再等，掉下来砸着人，谁负责？"
        - "id": "ch04-b07"
          "speaker": "narrator"
          "text": "巢里还有幼鸟。小禾从地面能听见细弱而急的叫声。她觉得自己的七个红圈突然变成七个洞，风正从纸上往里灌。\n保护人员赶来后，大家在雨里商量到天黑。最终先从侧面稳固周围砖体，在不堵入口、不碰巢腔的前提下给松砖做临时支撑；危险区继续封闭，等幼鸟离巢再完成修复。梁师傅系着安全绳上架前，对小禾说："
        - "id": "ch04-b08"
          "speaker": "foreman"
          "text": "今天你别在下面守。真掉灰，不认红圈。"
        - "id": "ch04-b09"
          "speaker": "narrator"
          "text": "小禾退到院门外。她听见锤子轻轻敲击，一下，停很久，再一下。成鸟绕着城楼盘旋，几次靠近又折返。她攥得记录本边缘发软。傍晚，架子上的梁师傅把手举过头顶，示意所有人不动。一只雨燕从他身旁穿过，钻进原来的小洞。\n梁师傅等鸟进去，才慢慢放下手。"
    - "id": "ch05"
      "title": "最后一次目击"
      "blocks":
        - "id": "ch05-b01"
          "speaker": "narrator"
          "text": "七月中旬，幼鸟第一次冲出洞口。它扑得太低，险些擦到槐树，随后像忽然想起翅膀的用处，一转身升上屋脊。小禾笑出声，老沈却把望远镜递给她："
        - "id": "ch05-b02"
          "speaker": "tower-keeper"
          "text": "看清尾羽，别又一只数成两只。"
        - "id": "ch05-b03"
          "speaker": "narrator"
          "text": "修缮在八月完成。东角的旧砖被稳妥加固，几处确认过的入口留了下来，另有适合雨燕的空腔藏在修好的墙体里。从远处看，城楼仍是那座城楼；只有知道的人，才看得见檐下几道窄窄的暗口。\n九月，天空一天天安静。最后那群雨燕是在傍晚离开的。它们绕塔飞了好几圈，声音从近处猛地拔高，又向西北方向散去。小禾跑上允许开放的第一层平台，直到黑点融进暮色。"
        - "id": "ch05-b04"
          "speaker": "child"
          "text": "它们明年一定回来吗？"
        - "id": "ch05-b05"
          "speaker": "narrator"
          "text": "她问。\n老沈翻到新的一页，没有写日期。"
        - "id": "ch05-b06"
          "speaker": "tower-keeper"
          "text": "不知道。"
        - "id": "ch05-b07"
          "speaker": "narrator"
          "text": "小禾摸了摸口袋里那支磨短的红铅笔。风从修好的砖缝旁经过，没有把所有声音都堵住。她把记录本放在城垛上，压好四角，等老沈写下那天最后一次目击的时间。"
