audio_script:
  language: zh-CN
  cast:
    narrator: {display_name: 旁白, tts: {delivery: 像在身边讲故事，沉静而有画面感, timbre: 温暖清晰, pace: 从容，紧张处略收紧, pitch: 中}}
    child: {display_name: 小禾, tts: {delivery: 敏锐直率，急切中渐渐多了笃定, timbre: 清亮自然, pace: 稍快, pitch: 中高}}
    tower-keeper: {display_name: 老沈, tts: {delivery: 寡言耐心，每句话都说得准, timbre: 低沉温厚, pace: 偏慢, pitch: 低}}
    foreman: {display_name: 梁岚, tts: {delivery: 直接克制，话里带着现场的分量, timbre: 结实清楚, pace: 中等, pitch: 中低}}
    conservator: {display_name: 陈老师, tts: {delivery: 审慎平和，善于协调, timbre: 平稳清晰, pace: 中等, pitch: 中}}
  chapters:
    - id: ch01
      title: 空着的天空
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            四月十八日，城楼上空还是空的。

            小禾坐在检票亭后面的石狮子脚上，仰得脖子都酸了。风翻起槐树新叶浅白的背面，麻雀在瓦沟里吵，鸽子慢吞吞地飞过广场。可她等的黑影就是没来。那黑影飞起来，像一把把小剪刀。

            她翻开老沈的记录本。布面封皮已经磨亮，二十三个春天一行行挤在里面。去年第一只雨燕四月十六日到，前年是十四日，还有一年一直等到二十五日。
        - id: ch01-b02
          speaker: child
          text: 它们是不是走丢了？
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: 老沈蹲在门边给铜锁滴油，头也没抬。
        - id: ch01-b04
          speaker: tower-keeper
          text: 鸟不看我的本子。
        - id: ch01-b05
          speaker: child
          text: 可你说它们认得这里。
        - id: ch01-b06
          speaker: tower-keeper
          text: 认得，也会碰上风，碰上雨。再等等。
        - id: ch01-b07
          speaker: narrator
          text: |-
            小禾最不喜欢“等”。偏偏墙根已经堆起脚手架，蓝围挡也靠在槐树下。五月，城楼要修。冬天有块灰浆掉在检票口旁边，好在那天闭馆。施工图写着：清理松动部分，重新勾缝，封闭孔洞。

            可小禾见过雨燕钻进那些孔洞。到了图纸上，每道缝却都像一处病口。要是雨燕迟迟不来，工人会不会觉得洞里本来就什么也没有？

            傍晚快闭门时，天像一张蹭了灰的纸。老沈忽然抬手。先是一声尖亮的叫。两道黑影贴着屋脊冲来，兜了个大弯，又从钟洞前穿过。第三只从高处斜落，长翅弯成两把窄镰。它没落在瓦上，而是重新升高，和前两只一起追进了暮色。
        - id: ch01-b08
          speaker: child
          text: 三只！
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: 小禾追到院子中央。老沈总算笑了，在四月十八日下面写下“三”，手指还按着铅笔。
        - id: ch01-b10
          speaker: tower-keeper
          text: 这是眼下看见的。天黑前，再数。
        - id: ch01-b11
          speaker: narrator
          text: |-
            那晚一共回来了十一只。它们在空中追小虫，喝水也不停，只贴着护城河掠过去。只有到了繁殖季，它们才需要檐下的深洞。老沈说，雨燕一辈子的大部分时间，都交给了天空。

            小禾心想，城楼不是笼子，只是远行者每年都要找回的一扇门。她没把这句话说出来。就在这时，一只雨燕冲向东角，忽然收翅，钻进一块松砖下面。第二天，小禾带来红铅笔，在施工图上点下第一个圆。
    - id: ch02
      title: 红圈不能猜
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            从那以后，小禾每天放学都来。她和老沈只站在地上看，不爬梯子，也不伸手进洞。雨燕太快，她常盯到流泪，也只抓住一道影子。

            她给入口编号，又画上时间、方向、进去、飞出几栏。有一回，两只雨燕在钟洞前交叉，她一口气点了四下红笔。
        - id: ch02-b02
          speaker: child
          text: 四只，进了两个洞。
        - id: ch02-b03
          speaker: narrator
          text: 老沈递来望远镜。
        - id: ch02-b04
          speaker: tower-keeper
          text: 哪两个？
        - id: ch02-b05
          speaker: narrator
          text: 灰墙已经安静下来，小禾怎么也指不出。
        - id: ch02-b06
          speaker: child
          text: 刚才明明……
          emotion: surprised
        - id: ch02-b07
          speaker: tower-keeper
          text: 可能有四只。可“可能”，不能写进“看见了”那一栏。
        - id: ch02-b08
          speaker: narrator
          text: |-
            小禾不肯擦，老沈也不催，只去扫槐花。扫帚在石地上沙沙响。最后她还是拿起橡皮，擦得纸都薄了一块，红圈像受了伤。
        - id: ch02-b09
          speaker: child
          text: 要是漏掉一个洞，工人把它堵了呢？
          emotion: fearful
        - id: ch02-b10
          speaker: tower-keeper
          text: 所以要看得更久，不是写得更多。
        - id: ch02-b11
          speaker: narrator
          text: |-
            后来，他们确认了七个入口：东角三个，钟洞上面两个，北墙排水兽后一个，南檐阴影里一个。不同日子都看到成鸟从同一个洞进出，小禾才肯把圈描深。另有三个浅点，她写着“待看”。

            巢里怎么样，他们看不见。起初，成鸟会叼轻羽和草屑进去；后来，它们空嘴出来，又一趟趟鼓着喉囊回来。小禾猜蛋已经孵了。她几次想贴墙听，都被老沈拽住书包带。
        - id: ch02-b12
          speaker: tower-keeper
          text: 它们飞了那么远，不是回来给你检查的。
        - id: ch02-b13
          speaker: child
          text: 到底有多远？
        - id: ch02-b14
          speaker: narrator
          text: |-
            老沈拿来研究资料。研究人员曾给北京繁殖的雨燕戴上很轻的定位记录器，等一些鸟第二年回来，再读出旅程。被追踪到的雨燕一年往返约三万公里。它们向西北经过蒙古和中亚，再越过红海一带，到非洲南部高原过冬，来年春天再回来。

            小禾的手指悬在地图上，从北京一路移向非洲，越移越慢。
        - id: ch02-b15
          speaker: child
          text: 飞了这么远，回来一看，门没了。它们怎么办？
          emotion: fearful
        - id: ch02-b16
          speaker: tower-keeper
          text: 我不知道。
        - id: ch02-b17
          speaker: narrator
          text: 老沈把研究资料合上。
        - id: ch02-b18
          speaker: tower-keeper
          text: 明天开会。把知道的带去，别把不知道的也画成红圈。
    - id: ch03
      title: 图纸上的七个洞
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 会议在值班室里开。梁岚把安全帽放在膝上，短发还沾着墙灰。她指了指冬天掉灰浆的地方，又把砖缝近照推到桌子中间。
        - id: ch03-b02
          speaker: foreman
          text: 裂缝进水，再一冻，砖和灰浆会越来越松。下面每天有人走。不修，谁也不知道下一块掉在哪儿。
        - id: ch03-b03
          speaker: narrator
          text: 陈老师说，旧墙不能像新楼那样一把抹平，材料和做法都得合适。老沈摊开二十三年的记录，小禾把七个红圈压在上面。
        - id: ch03-b04
          speaker: child
          text: 这些地方现在有鸟用。
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: 她的声音比自己预想的轻，只好又说一遍。
        - id: ch03-b06
          speaker: child
          text: 我们在不同日子看见它们进去。
          emotion: fearful
        - id: ch03-b07
          speaker: narrator
          text: 梁岚逐页翻看记录。
        - id: ch03-b08
          speaker: foreman
          text: 脚手架一搭，鸟会换方向。只凭红点，我不能让工人靠近松砖，也没法保证洞里面安全。
        - id: ch03-b09
          speaker: child
          text: 那就全都封上吗？
          emotion: fearful
        - id: ch03-b10
          speaker: foreman
          text: 我没这么说。红点是证据，还不是施工办法。
        - id: ch03-b11
          speaker: narrator
          text: 小禾等老沈替她争，老沈却问起了具体的办法。
        - id: ch03-b12
          speaker: tower-keeper
          text: 能不能先修没有巢的西墙？东侧留出鸟飞近洞口的空间。有巢的砖等幼鸟离开再动；实在松的，先从旁边支住。
        - id: ch03-b13
          speaker: narrator
          text: 梁岚用铅笔在图上划了几道。
        - id: ch03-b14
          speaker: foreman
          text: 脚手架得重排。工期原定到六月，材料和人手也都已经排好了。还有，入口留多宽、里面多深，更不能靠我们几个猜。
        - id: ch03-b15
          speaker: conservator
          text: 那就请懂鸟的人来复核，再请结构工程师一起看。
        - id: ch03-b16
          speaker: narrator
          text: |-
            会议没在一句漂亮话里结束。他们量安全距离、翻天气记录、打电话问工期。小禾坐了很久，椅子边在她腿上硙出一道红印。梁岚没答应保住七个洞，却带走了那张擦薄的图。第二天没消息，第三天也没有。小禾每天放学都问。
        - id: ch03-b17
          speaker: tower-keeper
          text: 他们在算。
        - id: ch03-b18
          speaker: child
          text: 鸟可不会等他们算完才长大。
        - id: ch03-b19
          speaker: tower-keeper
          text: 墙也不会因为着急，就不往下掉。
        - id: ch03-b20
          speaker: narrator
          text: |-
            第四天，梁岚带来鸟类保护人员和结构工程师。他们从地面看飞行路线，用长镜头检查洞口，只在远离巢腔的地方看裂缝。小禾想跟上去，被拦在安全线外。
        - id: ch03-b21
          speaker: foreman
          text: 你的图告诉我们从哪儿看起。接下来，得让数据和墙说话。
        - id: ch03-b22
          speaker: narrator
          text: |-
            两天后，新施工表贴在检票亭。先修西墙；东侧脚手架让开主要飞行路线；有鸟使用的区域延后；危险却还不能动的砖先做临时防护。小禾从上看到下，没在表上找到自己的名字。
        - id: ch03-b23
          speaker: tower-keeper
          text: 本来就不该写。鸟也没签字。
        - id: ch03-b24
          speaker: narrator
          text: 她正想不高兴，却看见图上多了七个细蓝圈，每一个都套在她的红圈外面。
    - id: ch04
      title: 雨里的第四号洞
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            五月底，防护网罩住城楼，只有东面故意留着一道不整齐的口子。雨燕贴着网急转，擦过架管，钻进巢洞。叫声一靠近，工人就停钻。梁岚刚开始总会抬头，后来听声就知道该把钻头移开。

            游客抱怨绕路，有人隔着围挡问，几只鸟怎么比一座楼还麻烦。梁岚检查着安全绳，没回答。小禾也没回答。真正的答案，是今天少修哪段、哪辆材料车改时间、哪个洞还得继续看。

            六月连下三天雨。第四天一早，老沈还没开门，就发现东角落了一层新灰。第四号洞上方的裂缝从砖角一直伸进灰缝，昨天还只能塞进一根草茎，今天已有小指宽。梁岚马上封了东院。
        - id: ch04-b02
          speaker: foreman
          text: 这块砖移了。真掉下来，可能连巢腔一起扯开。
        - id: ch04-b03
          speaker: narrator
          text: 墙里传出又细又急的沙沙声。小禾站在围栏外，脸上还带着一路跑来的雨水。
        - id: ch04-b04
          speaker: child
          text: 你说过要等小鸟飞走。
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: 梁岚的眼睛红红的，像是一夜没睡。
        - id: ch04-b06
          speaker: foreman
          text: 我说安全的时候才等。现在不安全。
        - id: ch04-b07
          speaker: child
          text: 可封住洞，对它们也不安全。
          emotion: fearful
        - id: ch04-b08
          speaker: foreman
          text: 所以谁都先别动。
        - id: ch04-b09
          speaker: narrator
          text: |-
            鸟类保护人员和工程师赶到时，雨更密了。升降台没法贴近最危险的位置，他们只能站在檐下，一张张对比照片。拆掉松砖，墙最稳，可会打开正在用的巢腔；什么都不做，砖可能赶在幼鸟离巢前掉下。工程师提议从侧面固定周围的砖，再用窄支撑托住松砖，不堵入口，也不碰巢腔。这样一来，东院得继续关闭，而且支撑仍可能失败。

            陈老师问费用。梁岚报了数，又说后面两周都得重排。大家沉默了一会儿。雨点从檐口连成了线。
        - id: ch04-b10
          speaker: foreman
          text: 做吧。
        - id: ch04-b11
          speaker: conservator
          text: 还得再报批。
        - id: ch04-b12
          speaker: foreman
          text: 那就现在报。
        - id: ch04-b13
          speaker: narrator
          text: 梁岚把手机装进防水袋。
        - id: ch04-b14
          speaker: foreman
          text: 墙得保，下面的人得保，里面那窝鸟，也不能从咱们手里掉出来。
        - id: ch04-b15
          speaker: narrator
          text: |-
            下午雨小了。梁岚系着安全绳上了脚手架。小禾被赶到院门外，只能从围挡缝里看见一小块东墙。锤子轻敲一下，等很久，再敲一下。成鸟绕着城楼，几次靠近又折回，叫声像在湿空气上划开一道口子。

            一只成鸟叼着食团冲向第四号洞，看见升降台就猛地翻身。它绕一圈，又来。梁岚停下工具，两手离开墙面。工程师也不动。雨燕擦过安全帽，收翅钻进旧洞。尾羽完全消失，梁岚才放下手。

            傍晚，支撑装好，裂缝边贴了监测标记，东院仍然关着。老沈记下时间，把铅笔交给小禾。她没画新圈，只在第四号旁边写：“入口仍在使用。”
    - id: ch05
      title: 留下来的门
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            支撑经住了后面的雨。小禾每天先看裂缝标记，再看洞口。她不再催老沈猜幼鸟哪天出来，只把成鸟每次进去的时间记准。等待没变短，可它不像四月那样空了。

            七月中旬的傍晚，第四号洞探出一张小暗脸，缩回去，又探出来。成鸟从上空叫着掠过。幼鸟突然冲出洞口，掉得太低，差点擦到槐树梢。小禾的手心一下湿了。就在她要喊时，幼鸟展开长翅，贴着市场雨篷飞平，又转身升过屋脊。
        - id: ch05-b02
          speaker: child
          text: 两只！
          emotion: surprised
        - id: ch05-b03
          speaker: narrator
          text: 洞边又闪过一道影子。老沈递来望远镜。
        - id: ch05-b04
          speaker: tower-keeper
          text: 看清尾羽。
        - id: ch05-b05
          speaker: narrator
          text: |-
            小禾追了半圈，终于看清：还是刚才那只幼鸟绕回来了。她接过铅笔，写下：“一只，确认离巢。”老沈没夸她，只按住纸页，不让风翻走。

            一周后，保护人员确认那一带的幼鸟都已离巢。梁岚拆下支撑，修完东墙。确认过的入口保留下来，松动的内部也加固了。墙体里几处合适的位置还留出了安全巢腔，入口就在雨燕原来使用的高度附近。远远看去，那些洞只是檐下几笔阴影。

            工程结束那天，梁岚还回洗净的施工图。最早那个擦薄的红圈外套着细蓝圈，旁边还有工程师的小勾。纸角淋过雨，皱得像片干叶子。
        - id: ch05-b06
          speaker: foreman
          text: 明年还得重新看。洞留下了，不代表鸟一定会选。
        - id: ch05-b07
          speaker: child
          text: 我知道。
        - id: ch05-b08
          speaker: narrator
          text: |-
            小禾真的知道了。地图不能命令天空照着它走。它能做的，只是提醒人：你明明看见了，就别装作没看见。

            九月，傍晚的叫声一天比一天少。最后一群雨燕绕城楼飞了几圈，声音从近处猛地拔高，又朝西北散去。研究记录过的北京雨燕常从这里开始迁徙，经过蒙古、中亚和红海一带，去非洲南部过冬。可地上的人，谁也不知道每只鸟今晚会停在哪儿。

            小禾跑上一层平台，一直看到黑点融进暮色。
        - id: ch05-b09
          speaker: child
          text: 它们明年一定回来吗？
        - id: ch05-b10
          speaker: narrator
          text: 老沈把记录本翻到新的一页，却没写日期。
        - id: ch05-b11
          speaker: tower-keeper
          text: 不知道。
        - id: ch05-b12
          speaker: narrator
          text: 风从修好的砖墙边穿过。七道暗口没有声音，也没有被抹平。小禾把记录本放在城垛上，两手压住翘起的纸角，等老沈写下这一年最后一次看见雨燕的时间。
