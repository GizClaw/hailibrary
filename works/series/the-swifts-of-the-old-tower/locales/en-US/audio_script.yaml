audio_script:
  language: en-US
  cast:
    narrator: {display_name: Narrator, tts: {delivery: intimate and observant storytelling, timbre: warm and clear, pace: measured with tightening tension, pitch: medium}}
    child: {display_name: Mina, tts: {delivery: "alert, candid, and increasingly assured", timbre: bright and natural, pace: slightly quick, pitch: medium-high}}
    tower-keeper: {display_name: Mr. Sayeed, tts: {delivery: "spare, patient, and exact", timbre: low and weathered, pace: unhurried, pitch: low}}
    foreman: {display_name: Lena Ortiz, tts: {delivery: direct and restrained under pressure, timbre: firm and clear, pace: steady, pitch: medium-low}}
    conservator: {display_name: The conservator, tts: {delivery: careful and mediating, timbre: even and clear, pace: measured, pitch: medium}}
  chapters:
    - id: ch01
      title: The Empty Date
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            On April eighteenth, Mina came through the tower gate with a bag of apricots. Mr. Sayeed was staring up at an empty sky.

            The old gate tower stood above market roofs and new apartment blocks. Wind flashed the pale sides of locust leaves. Sparrows argued in the gutters. Pigeons flapped across the square. But Mina saw none of the long, swept-back wings she'd come for.

            She left the apricots by the ticket window and opened Mr. Sayeed's clothbound ledger. Twenty-three springs filled those pages. Last year, the first swift came on April sixteenth. The year before, three came on the fourteenth. One cold year, the first mark didn't appear until the twenty-fifth.
        - id: ch01-b02
          speaker: child
          text: Maybe they missed the tower.
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: Mr. Sayeed kept oiling the brass lock.
        - id: ch01-b04
          speaker: tower-keeper
          text: The birds don't read my dates.
        - id: ch01-b05
          speaker: child
          text: You said they knew this place.
        - id: ch01-b06
          speaker: tower-keeper
          text: Knowing a place doesn't clear every storm between here and there.
        - id: ch01-b07
          speaker: narrator
          text: |-
            Waiting felt different this year. Scaffold poles were stacked by the west wall. Blue barriers leaned under the trees. Repairs would start in May. Winter rain and frost had loosened the mortar, and one piece had fallen near the ticket window. Luckily, the tower was closed that day.

            Mina unrolled a copy of the work plan on the stone lion. Arrows pointed to scars in the wall. A note by the east cornice said the open joints would be cleaned and sealed. But Mina had watched swifts vanish into those very gaps last summer. If the birds came late, would everyone else see the openings as useless?

            Near closing time, Mr. Sayeed raised a hand. A sharp cry cut through the air. Two dark shapes swept over the roof, curved around the bell opening, and climbed. A third dropped from high above, its wings like narrow sickles. It didn't settle on the tiles. It joined the other two, and all three raced around the tower, too fast for the eye.
        - id: ch01-b08
          speaker: child
          text: Three!
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: Mina ran into the courtyard. Mr. Sayeed finally smiled. He wrote a three under April eighteenth but kept his pencil on the page.
        - id: ch01-b10
          speaker: tower-keeper
          text: Three so far.
        - id: ch01-b11
          speaker: narrator
          text: |-
            By dusk, eleven had returned. They chased insects in the air and skimmed the moat to drink. Only in breeding season did they need the deep spaces under the eaves. Swifts gave nearly all their lives to the sky. The tower wasn't a cage, Mina thought. It was a door they'd crossed half the world to find. She kept that thought to herself.

            Then one swift folded its wings and vanished beneath a loose stone at the east corner. The next morning, Mina brought a red pencil.
    - id: ch02
      title: What a Red Circle Proves
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            For twelve afternoons, Mina and Mr. Sayeed watched from the ground. No climbing. No reaching into nests. Mina marked an entrance only when she saw a bird cross the edge of a stone and disappear.

            She numbered possible openings and added columns for time, direction, entry, and exit. One afternoon, two swifts crossed at the bell opening. Mina jabbed the page four times.
        - id: ch02-b02
          speaker: child
          text: Four birds. Two holes.
        - id: ch02-b03
          speaker: narrator
          text: Mr. Sayeed handed her the binoculars.
        - id: ch02-b04
          speaker: tower-keeper
          text: Which holes?
        - id: ch02-b05
          speaker: narrator
          text: The wall was already still. Mina pointed once, then let her hand fall.
        - id: ch02-b06
          speaker: tower-keeper
          text: There could've been four. But “could've been” doesn't belong in the “seen” column.
        - id: ch02-b07
          speaker: narrator
          text: Mina wouldn't erase the marks. Mr. Sayeed didn't argue. He swept fallen blossoms from the ticket window while the broom whispered over stone. At last, she rubbed so hard the paper thinned beneath one circle.
        - id: ch02-b08
          speaker: child
          text: What if I miss an entrance and the crew seals it?
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: Mr. Sayeed stopped sweeping.
        - id: ch02-b10
          speaker: tower-keeper
          text: Then we watch longer. We don't protect a real nest by inventing one.
        - id: ch02-b11
          speaker: narrator
          text: |-
            Seven entrances passed their test: three under the east cornice, two above the bell opening, one behind a carved drainspout, and one in the southern shade. Mina darkened a circle only after birds used the same place on different days. Three faint marks stayed on the edge with question marks.

            They couldn't see inside. At first, adults brought light feathers and plant scraps caught in the air. Later, they flew out empty and returned with throats full of insects. Mina guessed the chicks had hatched. Twice she leaned toward the wall. Twice Mr. Sayeed caught her backpack strap.
        - id: ch02-b12
          speaker: tower-keeper
          text: They came a long way. They didn't come back for us to inspect them.
        - id: ch02-b13
          speaker: child
          text: How long a way?
        - id: ch02-b14
          speaker: narrator
          text: |-
            In the keeper's room, he unfolded a migration map. Researchers had fitted Beijing swifts with tiny light-recording tags. When some birds returned the next year, their recovered tags revealed the journey: about thirty thousand kilometers round trip. Northwest through Mongolia and Central Asia, on toward the Red Sea, down to the southern African plateau for winter, and back again in spring.

            Mina traced the route in the air, slower and slower.
        - id: ch02-b15
          speaker: child
          text: They fly back from Africa and find a stone where their door was. What do they do then?
          emotion: fearful
        - id: ch02-b16
          speaker: tower-keeper
          text: I don't know.
        - id: ch02-b17
          speaker: narrator
          text: Mr. Sayeed folded the map.
        - id: ch02-b18
          speaker: tower-keeper
          text: Tomorrow, bring what you do know to the meeting. Leave the question marks as question marks.
    - id: ch03
      title: Seven Openings on a Plan
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The meeting was in the keeper's room. Lena Ortiz set her helmet on her knees. Dust clung to her short hair. She showed them where the mortar had fallen and pushed a close-up of the east wall across the table.
        - id: ch03-b02
          speaker: foreman
          text: Water gets into this crack. Then it freezes and opens the joint farther. People walk below it every day. Leaving it alone isn't safe.
        - id: ch03-b03
          speaker: narrator
          text: The city conservator explained that an old wall couldn't simply be covered like a new one. The crew needed compatible mortar and careful methods. Mr. Sayeed opened his ledger to twenty-three years of arrivals and departures. Mina laid her seven red circles on top.
        - id: ch03-b04
          speaker: child
          text: Birds are using these now.
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: Her voice came out smaller than she'd expected, so she tried again.
        - id: ch03-b06
          speaker: child
          text: We saw them go in on different days.
          emotion: fearful
        - id: ch03-b07
          speaker: narrator
          text: Lena turned each observation page.
        - id: ch03-b08
          speaker: foreman
          text: I believe what you saw. But scaffolding changes how a bird approaches, and a red dot can't tell my crew whether the stone around a nest is sound.
        - id: ch03-b09
          speaker: child
          text: So you'll seal all of them?
          emotion: fearful
        - id: ch03-b10
          speaker: foreman
          text: I didn't say that. Your map is evidence. It isn't a repair plan.
        - id: ch03-b11
          speaker: narrator
          text: Mina expected Mr. Sayeed to defend her. Instead, he asked practical questions.
        - id: ch03-b12
          speaker: tower-keeper
          text: Could the crew start on the unused west wall? Could the scaffold leave a clear flight path to active openings? Could work near nests wait until the young had flown, while the most dangerous stones were supported from the side?
        - id: ch03-b13
          speaker: narrator
          text: Lena drew several lines on the plan.
        - id: ch03-b14
          speaker: foreman
          text: The scaffold would have to change. The job is due to finish in June, and the workers and materials are already booked. And no one here can decide the right size and depth for a protected nesting space.
        - id: ch03-b15
          speaker: conservator
          text: Then we bring in people who can. A bird specialist and the structural engineer, together.
        - id: ch03-b16
          speaker: narrator
          text: |-
            The meeting didn't end with a speech. They measured safe distances, compared calendars, and made calls about deliveries. Mina sat so long that the chair edge left a red line across her leg. Lena promised nothing, but she took Mina's worn map. There was no answer the next day, or the day after. Each afternoon, Mina asked again.
        - id: ch03-b17
          speaker: tower-keeper
          text: They're working it out.
        - id: ch03-b18
          speaker: child
          text: The chicks won't stop growing while they work it out.
        - id: ch03-b19
          speaker: tower-keeper
          text: The wall won't stop falling because we hurry.
        - id: ch03-b20
          speaker: narrator
          text: On the fourth day, Lena returned with the specialists. They watched flight paths, photographed openings with a long lens, and inspected cracks away from nest chambers. Lena stopped Mina at the safety line.
        - id: ch03-b21
          speaker: foreman
          text: Your map told us where to look. Now the birds and the wall have to tell us more.
        - id: ch03-b22
          speaker: narrator
          text: |-
            Two days later, a new schedule appeared at the ticket window. Work would start on the west. East-side scaffolding would leave the main flight paths clear. Occupied areas would wait. Dangerous stones that couldn't yet be repaired would get temporary protection.

            Mina read it twice. Her name wasn't on it.
        - id: ch03-b23
          speaker: tower-keeper
          text: It shouldn't be. The swifts didn't sign it either.
        - id: ch03-b24
          speaker: narrator
          text: Mina was getting ready to be offended when she saw seven fine blue circles on the work plan. Lena had drawn each one around one of Mina's red marks.
    - id: ch04
      title: Nest Four in the Rain
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            By late May, safety mesh covered the tower, except for a deliberate opening on the east that looked like a tear. Swifts banked around the mesh, skimmed the scaffold poles, and slipped into their nests. At first Lena looked up at every cry. Soon she could move a drill aside just by hearing one.

            Visitors complained about the closed walkway. One man asked through the barrier why a few birds caused more trouble than a whole tower. Lena checked a worker's safety rope and didn't answer. Mina didn't answer either. The honest answer was the work itself: which section waited, which delivery moved, which opening needed another hour of watching.

            Then it rained for three days. Before opening on the fourth morning, Mr. Sayeed found fresh dust beneath the east corner. A crack ran from the edge of the stone above Nest Four into the mortar. Yesterday it was as thin as a grass stem. Now Mina's smallest finger could fit inside. Lena closed the east courtyard.
        - id: ch04-b02
          speaker: foreman
          text: That block shifted. If it falls, it may tear open the nest chamber.
        - id: ch04-b03
          speaker: narrator
          text: A faint, urgent rustle came from inside the wall. Mina stood beyond the barrier with rain on her face.
        - id: ch04-b04
          speaker: child
          text: You said you'd wait until the chicks flew.
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: Lena looked as if she hadn't slept.
        - id: ch04-b06
          speaker: foreman
          text: I said we'd wait while it was safe. It isn't safe now.
        - id: ch04-b07
          speaker: child
          text: Sealing the hole isn't safe for them.
          emotion: fearful
        - id: ch04-b08
          speaker: foreman
          text: That's why nobody moves until the engineer gets here.
        - id: ch04-b09
          speaker: narrator
          text: |-
            The bird specialist and engineer arrived as the rain thickened. A lift couldn't stand close to the weakest ground, so they compared photographs beneath the eaves. Removing the stone would secure the wall but open an active nest. Doing nothing could let it fall before the chicks left. The engineer proposed fixing the surrounding stones from the side, then sliding a narrow brace under the loose one without blocking the entrance or entering the chamber. The courtyard would stay closed, and the brace could still fail.

            The conservator asked the cost. Lena named it and explained how two weeks of work would change. Rain streamed from the tiles while they weighed both risks.
        - id: ch04-b10
          speaker: foreman
          text: Do it.
        - id: ch04-b11
          speaker: conservator
          text: It still needs approval.
        - id: ch04-b12
          speaker: foreman
          text: Then call now.
        - id: ch04-b13
          speaker: narrator
          text: Lena sealed her phone in a clear waterproof bag.
        - id: ch04-b14
          speaker: foreman
          text: I'm not dropping the wall, a visitor, or that nest because one was easier to leave off the plan.
        - id: ch04-b15
          speaker: narrator
          text: |-
            That afternoon, Lena climbed the scaffold in a harness. Mina had been sent outside the gate and could see only a piece of the east wall through a gap in the barrier. A hammer tapped once, waited, then tapped again. Adult swifts circled the tower, their cries cutting through the wet air.

            One parent rushed toward Nest Four with insects, saw the lift, and turned away. It circled and tried again. Lena took both hands from the wall. The engineer froze. The swift passed within inches of Lena's helmet, folded its wings, and entered the old opening. Lena waited until its short, forked tail disappeared before she moved.

            By dusk, the brace was in place. A marker beside the crack would show any further movement, and the east courtyard remained closed. Mr. Sayeed recorded the time and gave Mina the pencil. She drew no new circle. Beside Nest Four, she wrote, “Entrance still in use.”
    - id: ch05
      title: The Door They Left
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            The brace survived the next rain. Mina checked the crack marker first each day, then watched the entrance. She stopped asking when the chicks would emerge and wrote down what she actually saw. Waiting wasn't shorter, but it was no longer empty.

            One July evening, a small dark face appeared at Nest Four, vanished, and appeared again. An adult called overhead. Then the young swift launched. It dropped so low Mina gasped. Just above the market awnings, it leveled its long wings, climbed past the trees, and joined the circling adults.
        - id: ch05-b02
          speaker: child
          text: Two!
          emotion: surprised
        - id: ch05-b03
          speaker: narrator
          text: Another shadow crossed the opening. Mr. Sayeed offered the binoculars.
        - id: ch05-b04
          speaker: tower-keeper
          text: Watch the tail.
        - id: ch05-b05
          speaker: narrator
          text: |-
            Mina followed it halfway around the tower. It was the same young bird circling back. She accepted the pencil and wrote, “One fledgling, confirmed.” Mr. Sayeed didn't praise her. He simply held the page when the wind tried to turn it.

            A week later, the specialist confirmed the young had left that section. Lena removed the brace and finished the east wall. Known entrances stayed open, loose material was secured behind them, and the crew added safe nesting spaces high under the cornice, close to places the swifts already used. From the square, they looked like thin shadows.

            On the final day, Lena returned Mina's cleaned plan. A blue ring circled the first red mark, the one rubbed thin. The engineer's check sat beside it. Rain had wrinkled one corner.
        - id: ch05-b06
          speaker: foreman
          text: We watch again next year. Leaving a space doesn't guarantee a bird will choose it.
        - id: ch05-b07
          speaker: child
          text: I know.
        - id: ch05-b08
          speaker: narrator
          text: |-
            And she did. The map couldn't order the sky to follow it. It could only keep people from pretending they'd seen nothing.

            In September, the evening cries grew fewer. The last group of swifts circled the tower several times, climbed above the roofs, and scattered northwest. Tracked Beijing swifts often began their long migration that way, through Mongolia and Central Asia, toward the Red Sea and southern Africa. But no one on the ground could know where each bird would stop that night.

            Mina climbed to the open first-level terrace and watched until the dark shapes dissolved into dusk.
        - id: ch05-b09
          speaker: child
          text: Will they come back next year?
        - id: ch05-b10
          speaker: narrator
          text: Mr. Sayeed opened the ledger to a clean page.
        - id: ch05-b11
          speaker: tower-keeper
          text: I don't know.
        - id: ch05-b12
          speaker: narrator
          text: Wind moved beside the repaired stones. The seven dark openings made no sound, but they hadn't been sealed. Mina held down the ledger's lifted corners while Mr. Sayeed wrote the time of the year's last confirmed sighting.
