  "chapters":
    - "id": "ch01"
      "title": "The First Return"
      "blocks":
        - "id": "ch01-b01"
          "speaker": "narrator"
          "text": "On the morning the scaffolding arrived, Mina heard the swifts before she saw them.\nTheir cries skimmed over the market roofs—sharp, joyful, impossible to hold. She dropped the paper bag of apricots she was carrying to the tower keeper and ran into the courtyard. Five black shapes swept past the clock face. One folded its wings and vanished into a crack beneath the east cornice.\nMr. Sayeed came out with an apricot rolling under his shoe."
        - "id": "ch01-b02"
          "speaker": "child"
          "text": "April nineteenth,"
        - "id": "ch01-b03"
          "speaker": "narrator"
          "text": " Mina said. "
        - "id": "ch01-b04"
          "speaker": "child"
          "text": "Write it down."
        - "id": "ch01-b05"
          "speaker": "narrator"
          "text": "He picked up the fruit, inspected the bruise, and ate it. "
        - "id": "ch01-b06"
          "speaker": "tower-keeper"
          "text": "You have my pencil."
        - "id": "ch01-b07"
          "speaker": "narrator"
          "text": "For twenty-three years, Mr. Sayeed had recorded the swifts' first arrival and last departure in a clothbound ledger. Mina had begun helping the previous spring. The birds returned from a journey she could hardly imagine and found the same old tower waiting above the square.\nThis year, trucks waited too. Rain had opened cracks between the stones. A chunk of mortar had fallen near the ticket window in winter. The city had hired a crew to repair the walls before somebody was hurt.\nMina looked at the rolled plans on the truck hood. A note beside the east wall read SEAL OPEN JOINTS."
        - "id": "ch01-b08"
          "speaker": "child"
          "text": "They can't seal that one,"
        - "id": "ch01-b09"
          "speaker": "narrator"
          "text": " she said.\nMr. Sayeed did not answer. He opened the ledger to a fresh page. "
        - "id": "ch01-b10"
          "speaker": "tower-keeper"
          "text": "Show me which one."
    - "id": "ch02"
      "title": "Eight Openings"
      "blocks":
        - "id": "ch02-b01"
          "speaker": "narrator"
          "text": "For the next twelve mornings, they watched from the courtyard. They did not climb to the nests or reach into holes. Swifts entered too quickly for careless counting. Mina marked a dot only when she saw a bird cross the edge of the stone and disappear.\nThere were eight active entrances. The east cornice had three. Another hid behind a carved drainspout. At dusk, groups of swifts tore around the tower with ringing calls, but Mr. Sayeed would not let Mina count those as nests."
        - "id": "ch02-b02"
          "speaker": "child"
          "text": "They are telling us something,"
        - "id": "ch02-b03"
          "speaker": "narrator"
          "text": " she protested."
        - "id": "ch02-b04"
          "speaker": "tower-keeper"
          "text": "That swifts are nearby. Not which hole holds eggs."
        - "id": "ch02-b05"
          "speaker": "narrator"
          "text": "He made her erase two dots. Mina erased so hard that the paper thinned.\nIn the keeper's room, they pinned a map beside an old migration chart. Researchers had fitted tiny light-recording tags to swifts breeding in Beijing and recovered some tags when the birds returned. The tracks made a vast loop: northwest through Mongolia, west through Central Asia, across the Red Sea, then down to wintering areas in southern Africa. The round trip was about thirty thousand kilometers."
        - "id": "ch02-b06"
          "speaker": "child"
          "text": "And they spend almost all that time flying?"
        - "id": "ch02-b07"
          "speaker": "narrator"
          "text": " Mina asked."
        - "id": "ch02-b08"
          "speaker": "tower-keeper"
          "text": "Swifts are extraordinarily aerial. Away from breeding sites, they may remain in the air for very long periods. ‘Never land’ is a better headline than a fact."
        - "id": "ch02-b09"
          "speaker": "narrator"
          "text": "Mina traced the route without touching the paper. "
        - "id": "ch02-b10"
          "speaker": "child"
          "text": "Then these holes are the only place they stop."
        - "id": "ch02-b11"
          "speaker": "tower-keeper"
          "text": "These holes are where this colony breeds. Be exact, even when the exact words are less dramatic."
    - "id": "ch03"
      "title": "A Different Schedule"
      "blocks":
        - "id": "ch03-b01"
          "speaker": "narrator"
          "text": "At the construction meeting, the foreman, Ms. Alvarez, listened without smiling. She studied Mina's nest map, the keeper's dates, and photographs taken from the ground."
        - "id": "ch03-b02"
          "speaker": "foreman"
          "text": "I believe you saw birds enter here,"
        - "id": "ch03-b03"
          "speaker": "narrator"
          "text": " she said. "
        - "id": "ch03-b04"
          "speaker": "foreman"
          "text": "I also have loose stone above a public walkway. Leaving it alone is not an option."
        - "id": "ch03-b05"
          "speaker": "child"
          "text": "Can you repair around the holes?"
        - "id": "ch03-b06"
          "speaker": "narrator"
          "text": " Mina asked."
        - "id": "ch03-b07"
          "speaker": "foreman"
          "text": "Sometimes. I need an engineer to tell me what can stay, and a bird specialist to tell me what the swifts need. I can't build from red dots."
        - "id": "ch03-b08"
          "speaker": "narrator"
          "text": "The city conservator proposed beginning on the empty west wall. The scaffold design could leave clear approaches to the occupied openings. Work near active nests could wait until the young had flown, while dangerous stones received temporary support from the side."
        - "id": "ch03-b09"
          "speaker": "foreman"
          "text": "That changes the schedule,"
        - "id": "ch03-b10"
          "speaker": "narrator"
          "text": " Ms. Alvarez said."
        - "id": "ch03-b11"
          "speaker": "conservator"
          "text": "Yes,"
        - "id": "ch03-b12"
          "speaker": "narrator"
          "text": " said the conservator."
        - "id": "ch03-b13"
          "speaker": "foreman"
          "text": "And the cost."
        - "id": "ch03-b14"
          "speaker": "conservator"
          "text": "Yes."
        - "id": "ch03-b15"
          "speaker": "narrator"
          "text": "Mina expected someone to make a grand argument. Instead, they compared calendars, safety barriers, mortar deliveries, and the breeding season. The new plan took three meetings and six days.\nWhen work began, the west face filled with the tapping of hand tools. The east cornice remained uncovered. Workers carried boards through the courtyard, visitors complained about the closed walkway, and dust settled on Mr. Sayeed's ledger even when he wrapped it in cloth.\nThe swifts kept coming. They hunted insects high above the river and swept low to drink. Near the tower, they approached at speed, turned upward, and slipped into the dark entrances. Mina learned to recognize the half-second in which flight became arrival."
    - "id": "ch04"
      "title": "The Fourth Nest"
      "blocks":
        - "id": "ch04-b01"
          "speaker": "narrator"
          "text": "In June, three days of rain soaked the east wall. Early on the fourth morning, a crack appeared through the stone above Nest Four. Ms. Alvarez closed the courtyard before opening time."
        - "id": "ch04-b02"
          "speaker": "foreman"
          "text": "That block shifted,"
        - "id": "ch04-b03"
          "speaker": "narrator"
          "text": " she told the conservator. "
        - "id": "ch04-b04"
          "speaker": "foreman"
          "text": "If it goes, it could take the nest cavity with it."
        - "id": "ch04-b05"
          "speaker": "narrator"
          "text": "From inside the wall came the dry whisper of young birds.\nMina stood outside the barrier. "
        - "id": "ch04-b06"
          "speaker": "child"
          "text": "You said you would wait."
        - "id": "ch04-b07"
          "speaker": "foreman"
          "text": "I said we would avoid the nests if it was safe."
        - "id": "ch04-b08"
          "speaker": "narrator"
          "text": " Ms. Alvarez's voice was tired, not angry. "
        - "id": "ch04-b09"
          "speaker": "foreman"
          "text": "It isn't safe now."
        - "id": "ch04-b10"
          "speaker": "narrator"
          "text": "The bird specialist arrived with an engineer. They examined the wall from a lift while adult swifts circled overhead. The engineer proposed bracing the loose block without opening the cavity, then finishing the repair after the young departed. It would close the courtyard longer. It might still fail."
        - "id": "ch04-b11"
          "speaker": "foreman"
          "text": "Do it,"
        - "id": "ch04-b12"
          "speaker": "narrator"
          "text": " Ms. Alvarez said."
        - "id": "ch04-b13"
          "speaker": "conservator"
          "text": "You haven't heard the price,"
        - "id": "ch04-b14"
          "speaker": "narrator"
          "text": " the conservator replied."
        - "id": "ch04-b15"
          "speaker": "foreman"
          "text": "I heard the chicks."
        - "id": "ch04-b16"
          "speaker": "narrator"
          "text": "Work stopped whenever a parent approached. From behind the barrier, Mina watched Ms. Alvarez guide a narrow support into place. A swift came screaming toward the wall, saw the lift, and wheeled away. It tried again. Ms. Alvarez froze with both hands raised. The bird passed inches from her helmet and disappeared under the cornice.\nOnly after its tail vanished did she lower her hands.\nThe brace held."
    - "id": "ch05"
      "title": "The Waiting Openings"
      "blocks":
        - "id": "ch05-b01"
          "speaker": "narrator"
          "text": "In mid-July, Mina saw the first young swift leave Nest Four. It dropped so sharply that she gasped. Just above the market awnings it leveled, beat its long wings, and climbed toward the adults. Mr. Sayeed offered her the pencil."
        - "id": "ch05-b02"
          "speaker": "tower-keeper"
          "text": "One fledgling,"
        - "id": "ch05-b03"
          "speaker": "narrator"
          "text": " he said."
        - "id": "ch05-b04"
          "speaker": "child"
          "text": "Maybe two. I saw another shadow."
        - "id": "ch05-b05"
          "speaker": "narrator"
          "text": "He waited.\nMina sighed and wrote one.\nAfter the colony left, the crew completed the east wall. They kept the confirmed entrances open and built safe cavities behind them. New nesting spaces were added high under the cornice, close to the old ones. From the square, the repairs were nearly invisible. Mina knew each opening by the neighboring stain, chip, or curve of stone.\nSummer thinned into September. The evening flights grew smaller. One day there were sixteen swifts, then seven, then none. Mina and Mr. Sayeed continued watching for a week because absence was harder to record than arrival."
        - "id": "ch05-b06"
          "speaker": "child"
          "text": "Where are they tonight?"
        - "id": "ch05-b07"
          "speaker": "narrator"
          "text": " she asked."
        - "id": "ch05-b08"
          "speaker": "tower-keeper"
          "text": "If they travel like the tracked Beijing birds, perhaps northwest first. But we didn't tag ours."
        - "id": "ch05-b09"
          "speaker": "narrator"
          "text": "Mina looked at the empty sky. The tower stood repaired, its dark openings waiting without proof that anything would return.\nMr. Sayeed opened the ledger. Mina wrote the last confirmed sighting and closed the cover against the evening damp. Above them, wind moved through one preserved gap and made a low, hollow note."
