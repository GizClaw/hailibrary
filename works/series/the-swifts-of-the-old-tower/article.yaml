schema_version: 1
id: the-swifts-of-the-old-tower
category: fiction
genre: natural-science
style: naturalistic-storybook
labels: {topics: [animals, nature, travel], themes: [curiosity, adaptation, empathy], moods: [calm, reflective]}
research: required
premise: >
  城里一座老城楼每年春天都会迎来一群雨燕。一个孩子和守楼的人一起等它们回来、
  看它们修巢育雏，在修缮城楼时想办法给雨燕留住巢洞，
  秋天又目送它们飞往遥远的非洲越冬。雨燕的迁徙路线、几乎不落地的习性等事实必须准确。
characters:
  - {id: child, description: 住在城楼附近的孩子}
  - {id: tower-keeper, description: 守城楼的人，多年记录雨燕来去的日子}
locales:
  zh-CN: {writer: 雨歌, working_title: 老城楼的雨燕, length: 3000-4500 字}
  en-US: {writer: rain-song, working_title: The Swifts of the Old Tower, length: 2000-3000 words}
picture_books:
  - {level: g, volumes: 2}
  - {level: l, volumes: 3}
