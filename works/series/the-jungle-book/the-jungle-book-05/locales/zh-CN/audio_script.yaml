audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳从容，带着古老丛林故事的气息
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    rikki_tikki:
      display_name: 里基-蒂基
      tts:
        delivery: 机敏勇敢，好奇心旺盛，说话干脆利落
        timbre: 清亮有活力
        pace: 偏快
        pitch: 中高
    teddy:
      display_name: 特迪
      tts:
        delivery: 天真直率，带着孩子的好奇与兴奋
        timbre: 明亮稚嫩
        pace: 中等偏快
        pitch: 高
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 温柔关切，危险时紧张而克制
        timbre: 柔和清晰
        pace: 中等
        pitch: 中高
    teddy_father:
      display_name: 特迪的父亲
      tts:
        delivery: 镇定务实，语气坚定可靠
        timbre: 浑厚清晰
        pace: 中等
        pitch: 中低
    darzee:
      display_name: 达西
      tts:
        delivery: 多愁善感又爱唱爱夸，情绪来得快
        timbre: 轻细响亮
        pace: 偏快
        pitch: 高
    darzee_wife:
      display_name: 达西太太
      tts:
        delivery: 聪明果断，紧急时尖锐有力
        timbre: 清脆
        pace: 偏快
        pitch: 高
    nag:
      display_name: 纳格
      tts:
        delivery: 阴冷傲慢，威胁中带着缓慢的压迫感
        timbre: 低沉沙哑
        pace: 缓慢
        pitch: 低
    nagaina:
      display_name: 娜吉娜
      tts:
        delivery: 狠毒警觉，愤怒时锋利逼人
        timbre: 冷硬沙哑
        pace: 中等偏慢
        pitch: 中低
    chuchundra:
      display_name: 楚春德拉
      tts:
        delivery: 胆怯忧郁，常像快要哭出来
        timbre: 细弱发颤
        pace: 犹疑缓慢
        pitch: 中高
    coppersmith:
      display_name: 铜匠鸟
      tts:
        delivery: 像敲钟报信一样清楚而有节拍
        timbre: 清亮坚实
        pace: 稳定
        pitch: 中高
  chapters:
    - id: ch01
      title: 洪水送来的小獴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            他追到蛇钻进去的洞口，红眼睛向皱皮蛇叫阵。小红眼睛这样唱着：纳格，出来吧，跟死神跳一支舞！眼对着眼，头抵着头，踩准拍子。你一转，我一扭，这一仗总要死一个才算完。快逃吧，纳格！哈，戴兜帽的死神扑空了。纳格，你的大祸到了！
        - id: ch01-b02
          speaker: narrator
          text: >-
            这就是里基-蒂基-塔维的大战。他在塞戈里兵营区的一座大平房里，独自穿过一间间浴室，把整场仗打到底。缝叶莺达西帮过忙，胆小的麝鼩楚春德拉也出过主意，可真正厮杀的始终是里基-蒂基。
        - id: ch01-b03
          speaker: narrator
          text: >-
            里基是一只獴。皮毛和尾巴有点像小猫，脑袋和习性却像黄鼠狼。他的眼睛和不停抽动的鼻尖都是粉红色的，哪条腿都能拿来挠痒。他还能把尾巴蓬成洗瓶刷，在长草里飞跑时，总会喊出战号：“里克—蒂克—蒂基—蒂基—嚓！”
        - id: ch01-b04
          speaker: narrator
          text: >-
            盛夏的一天，洪水冲进他和父母的洞穴，把他卷进路边水沟。里基拼命蹬腿，咯咯叫着，好不容易抱住水面的一绺草，随后便昏了过去。再醒来时，他湿淋淋地躺在花园小径上，烈日正晒着他。
        - id: ch01-b05
          speaker: teddy
          text: >-
            这儿有只死獴。咱们给他办场葬礼吧。
        - id: ch01-b06
          speaker: alice
          text: >-
            先别。把他带进屋擦干，说不定他还活着。
        - id: ch01-b07
          speaker: narrator
          text: >-
            他们把里基带进屋。特迪的父亲用两根手指拎起他，发现他只是呛昏了。大家用棉花裹住他，放在小火上烘暖。没多久，里基睁开眼睛，打了个喷嚏。
        - id: ch01-b08
          speaker: teddy_father
          text: >-
            好了，别吓他。我们安静看看，他醒来会做些什么。
        - id: ch01-b09
          speaker: narrator
          text: >-
            要吓住一只獴，可比什么都难。獴从鼻尖到尾巴都装满好奇，家族格言正是“跑去瞧个明白”。里基先检查棉花，认定不能吃，就绕桌跑了一圈，坐下来理顺皮毛，挠挠身子，又跳上特迪的肩膀。
        - id: ch01-b10
          speaker: teddy_father
          text: >-
            别害怕，特迪。他这样做，是想跟你交朋友。
        - id: ch01-b11
          speaker: teddy
          text: >-
            哎哟，他挠到我下巴了，好痒！
        - id: ch01-b12
          speaker: narrator
          text: >-
            里基从衣领旁探头往下看，又闻了闻特迪的耳朵，才爬到地上揉鼻子。
        - id: ch01-b13
          speaker: alice
          text: >-
            真没想到，这可是野生的小家伙。也许我们救了他，他才一点也不怕人。
        - id: ch01-b14
          speaker: teddy_father
          text: >-
            獴本来就这样。只要特迪不揪尾巴，也不把他关进笼子，他会整天在屋里屋外跑。给他一点吃的吧。
        - id: ch01-b15
          speaker: narrator
          text: >-
            一小块生肉很合里基的胃口。吃完后，他坐到游廊的阳光里，把毛蓬起来，一直晒到毛根都干了。这下，他觉得舒服极了。
        - id: ch01-b16
          speaker: rikki_tikki
          text: >-
            这屋里有这么多事值得查清楚，我们全家一辈子都未必查得完。我一定留下，好好瞧个明白。
        - id: ch01-b17
          speaker: narrator
          text: >-
            他探索了一整天。先跳进浴缸，差点把自己淹死。接着，他把鼻子伸进书桌上的墨水，又爬上特迪父亲的膝头，要看写字究竟是怎么回事，结果让雪茄头烫了鼻尖。傍晚，他跑进育儿室，仔细观察煤油灯怎样点亮。特迪上床，他也跟着爬上去。可这个床伴一点也不安分。夜里不管哪里传出动静，他都得起身赶过去，非查出声音的来处不可。临睡前，父母最后一次进来看孩子，发现里基仍醒着，正守在枕头上。
        - id: ch01-b18
          speaker: alice
          text: >-
            我不放心。他会不会咬特迪？
        - id: ch01-b19
          speaker: teddy_father
          text: >-
            他绝不会咬。让这小家伙陪着，特迪比有猎犬守护还安全。要是有蛇爬进育儿室……
        - id: ch01-b20
          speaker: narrator
          text: >-
            特迪的母亲可不肯再想下去。第二天一早，里基骑在特迪肩上来到游廊，同一家人吃早饭。他尝了香蕉和煮鸡蛋，又从一个人的膝头跳到另一个人的膝头，谁也没有落下，而且每个人都欢迎他。有教养的獴都盼着有朝一日成为家獴，可以在许多房间里自由奔跑。里基的母亲从前住在塞戈里将军府上，早已把这些规矩仔细教给儿子，也告诉过他，万一遇到白人，应该怎样跟他们相处。
    - id: ch02
      title: 花园里的眼镜蛇
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            饭后，里基出去查看花园。园子很大，只打理了一半。月季灌木长得像凉亭，还有酸橙树、橙树、竹丛和高高的草。里基舔舔嘴唇，尾巴立刻蓬了起来。
        - id: ch02-b02
          speaker: rikki_tikki
          text: >-
            这地方真是个好猎场！
        - id: ch02-b03
          speaker: narrator
          text: >-
            他在园里来回飞跑，一路嗅闻，忽然听见荆棘丛里传来悲伤的哭声。缝叶莺达西和妻子把两片大叶子缝在一起，里面垫满棉絮和绒毛，做成漂亮的巢。此刻，他们坐在巢边哭，鸟巢也来回摇晃。
        - id: ch02-b04
          speaker: rikki_tikki
          text: >-
            你们怎么了？
        - id: ch02-b05
          speaker: darzee
          text: >-
            我们太难过了。昨天，一个孩子掉出鸟巢，让纳格吃掉了。
          emotion: sad
        - id: ch02-b06
          speaker: rikki_tikki
          text: >-
            这真可怜。可我才刚来，纳格是谁？
        - id: ch02-b07
          speaker: narrator
          text: >-
            达西夫妇缩在巢里，一句话也不敢回答。灌木脚下的密草中突然传出低沉的嘶声，那声音阴冷得叫人害怕。里基一下退开整整两英尺。紧接着，黑色大眼镜蛇的脑袋和张开的颈兜，一寸一寸从草里升起来。从舌尖到尾梢，他足有五英尺。身体竖起三分之一后，他停在那里维持平衡，像风里的蒲公英绒球一样前后摇摆。他用邪恶的蛇眼盯住里基。无论一条蛇心里正在盘算什么，那双眼睛的神情永远不会改变。
        - id: ch02-b08
          speaker: nag
          text: >-
            你问纳格是谁？我就是纳格。当第一条眼镜蛇为熟睡的大神梵天遮住太阳时，梵天给我们全族留下了印记。看清楚，然后害怕吧！
        - id: ch02-b09
          speaker: narrator
          text: >-
            纳格把颈兜张得更大，露出背后像钩扣套圈一样的眼镜斑。里基有一刻真的怕了，可獴从来不会怕得太久。他虽没见过活眼镜蛇，母亲却喂他吃过死蛇。他知道，成年獴一生的大事，就是跟蛇搏斗，再把蛇吃掉。纳格也明白，所以那颗冷冰冰的心里同样有了惧意。
        - id: ch02-b10
          speaker: rikki_tikki
          text: >-
            有没有那道印记都一样。你从巢里叼走雏鸟吃掉，难道还算有理吗？
        - id: ch02-b11
          speaker: narrator
          text: >-
            纳格一面盘算，一面盯着里基身后的草。他知道，花园里来了獴，自己一家迟早要没命，于是稍稍低头，想让里基失去戒心。
        - id: ch02-b12
          speaker: nag
          text: >-
            那就讲讲道理。你能吃蛋，我为什么不能吃鸟？
        - id: ch02-b13
          speaker: darzee
          text: >-
            背后！快看背后！
          emotion: fearful
        - id: ch02-b14
          speaker: narrator
          text: >-
            里基没有回头，立刻跃到半空。纳格的妻子娜吉娜正从背后扑来，她的脑袋嗖地从里基身下掠过。她这一击落空，发出凶狠的嘶声。里基落下时几乎压住她的背。老练的獴会趁机咬断她的脊骨，可里基害怕她回身抽击，只短短咬了一口便跳开。娜吉娜受了伤，暴怒地甩动尾巴。
        - id: ch02-b15
          speaker: nag
          text: >-
            坏达西！你这坏达西！
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: >-
            纳格尽力昂起身子，朝鸟巢狠狠抽去，可巢筑在蛇够不着的高处，只来回晃了几下。里基的眼睛变得又红又烫。獴的眼睛一红，就说明他真正动怒了。他像小袋鼠一样坐在尾巴和后腿上，环顾四周，气得牙齿咯咯响。两条蛇却已隐入草中。蛇若扑空，从不会多说一句，也绝不会泄露下一步打算。里基没有追。他拿不准自己能否同时对付两条眼镜蛇，只好小跑到屋旁的碎石路上坐下，认真思考这件大事。
        - id: ch02-b17
          speaker: narrator
          text: >-
            旧博物书常说，獴同蛇搏斗时万一被咬，就会跑去吃一种能够解毒的草。这并不是真的。胜负只看谁的眼睛更快，谁的脚步更快，说到底，是蛇的一击对上獴的一跃。蛇头扑来时，快得没有任何一双眼睛能够追上。所以，这场较量本身就比什么魔草都更神奇。里基知道自己还只是一只年轻的獴。想到刚才竟然躲过了背后的突然袭击，他心里非常得意，也对自己更有信心了。特迪沿小路跑来时，他已经收好怒气，准备让男孩好好抚摸一番。
    - id: ch03
      title: 尘土里的死神
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            特迪刚俯下身，尘土里便有东西轻轻一动。那是卡莱特，一条灰褐色的小蛇，最爱卧在土里。它虽小，毒性却和眼镜蛇一样厉害。人们往往不把它当回事，才更容易遭它毒手。
        - id: ch03-b02
          speaker: narrator
          text: >-
            一个细小的声音从尘土里警告他们：“当心，我就是死神！”里基的眼睛马上红了。他用家族传下来的步法，摇摇摆摆地逼近。那动作看着滑稽，身体却平衡得极好，随时能向任何方向飞扑。对付蛇，这正是獴的长处。可卡莱特其实比纳格更难对付。它身体太小，转头又特别快。里基必须紧贴后脑咬中要害，不然，蛇头一转就能咬上他的眼睛或嘴唇。里基并不知道自己正在冒更大的险。他满眼通红，只顾前后晃动，寻找一个能牢牢咬住的地方。
        - id: ch03-b03
          speaker: narrator
          text: >-
            卡莱特猛扑。里基侧身跳开，又试着冲近。那颗尘灰色的小脑袋贴着他的肩头抽过，他只好越过蛇身，蛇头仍紧追脚后。
        - id: ch03-b04
          speaker: teddy
          text: >-
            快来看！我们的獴正在杀蛇！
        - id: ch03-b05
          speaker: narrator
          text: >-
            屋里传来特迪母亲的尖叫，父亲拿着棍子跑了出来。不过，他赶到以前，卡莱特已经有一次扑得太远。里基抓住机会腾空跃起，落到蛇背上。他把脑袋深深伸进两条前腿之间，在自己能够到的最高处，一口咬住蛇背，随即翻滚着离开。这一口让卡莱特全身瘫痪。里基本想照家族吃饭的习惯，从尾巴开始把蛇整个吃掉，却及时想起，饱餐会让獴的动作变慢。眼前还有纳格和娜吉娜。要保住全部力气和速度，他就得让自己的身子一直轻灵。
        - id: ch03-b06
          speaker: narrator
          text: >-
            他到蓖麻丛下洗尘土浴，特迪的父亲还在抽打那条死蛇。里基心想，这还有什么用，自己早把一切收拾妥当了。特迪的母亲从尘土里抱起他，紧紧搂在怀里，哭着说他把特迪从死亡手中救了回来。父亲说，这只小獴简直是上天派来的救星。特迪站在一旁，睁着惊恐的大眼睛。里基当然听不懂这些话，也不明白大家为何忙成一团，只觉得整件事很有趣。他想，特迪也常在土里玩，母亲还不如照样抱起特迪，好好疼爱一番呢。他自己倒彻底享受起这份热闹来了。
        - id: ch03-b07
          speaker: narrator
          text: >-
            晚餐时，里基在酒杯间来回走，要吃的话，足够把肚子填满三遍。可他还想着纳格和娜吉娜。有人疼爱他，又能坐在特迪肩上，自然很舒服，但他的眼睛时不时又变红，嘴里猛然响起战号：“里克—蒂克—蒂基—蒂基—嚓！”
        - id: ch03-b08
          speaker: narrator
          text: >-
            特迪坚持让里基睡在自己下巴底下。等男孩睡着，里基便开始夜间巡查。黑暗中，他撞见贴着墙根爬行的麝鼩楚春德拉。这个心碎的小可怜整夜呜咽，总想鼓起勇气跑到屋子中央，却一次也没成功。
        - id: ch03-b09
          speaker: chuchundra
          text: >-
            别杀我！里基-蒂基，求你别杀我！
          emotion: fearful
        - id: ch03-b10
          speaker: rikki_tikki
          text: >-
            我是杀蛇的獴，难道还会杀麝鼩？
        - id: ch03-b11
          speaker: chuchundra
          text: >-
            杀蛇的早晚会让蛇杀死。谁知道哪天夜里，纳格会不会把我错当成你？
          emotion: fearful
        - id: ch03-b12
          speaker: rikki_tikki
          text: >-
            你用不着担心。纳格在花园，而你根本不敢去那里。
        - id: ch03-b13
          speaker: chuchundra
          text: >-
            我的表亲，老鼠楚阿，曾经告诉我……
        - id: ch03-b14
          speaker: rikki_tikki
          text: >-
            他告诉你什么？
        - id: ch03-b15
          speaker: chuchundra
          text: >-
            嘘！纳格到处都在。你应该去花园里问楚阿。
        - id: ch03-b16
          speaker: rikki_tikki
          text: >-
            我没见到他，所以你来告诉我。快说，楚春德拉，不然我真要咬你了！
        - id: ch03-b17
          speaker: narrator
          text: >-
            楚春德拉坐下来哭，眼泪顺着胡须滚落。
        - id: ch03-b18
          speaker: chuchundra
          text: >-
            我是个苦命人，连走到屋子中间的胆量都没有。嘘，我不能再说了。里基-蒂基，你难道听不见吗？
          emotion: fearful
        - id: ch03-b19
          speaker: narrator
          text: >-
            里基细听。屋里静得不能再静，可他捕捉到一丝极轻的沙沙声，像黄蜂在玻璃上爬。那是蛇鳞擦过砖面的干涩声音。
        - id: ch03-b20
          speaker: rikki_tikki
          text: >-
            是纳格或娜吉娜，正从浴室排水口爬进来。楚春德拉说得对，我真该找楚阿问一问。
    - id: ch04
      title: 浴室里的决战
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            里基悄悄查看特迪的浴室，那里没有蛇，便又潜进特迪母亲的浴室。灰泥墙脚少了一块砖，那是洗澡水的排水口。他沿浴缸底座的砖边溜进去，听见两条蛇正在月光下低声商量。
        - id: ch04-b02
          speaker: nagaina
          text: >-
            等屋里的人都死了，那只獴也得离开，花园便重新归我们。你悄悄进去，先咬那个杀死卡莱特的高个子男人。然后回来告诉我，我们再一起追杀里基-蒂基。
        - id: ch04-b03
          speaker: nag
          text: >-
            杀掉这些人，当真会有好处吗？
        - id: ch04-b04
          speaker: nagaina
          text: >-
            当然。以前平房空着时，花园里哪有獴？只要里面没人，我们就是花园的国王和王后。瓜地里的蛋也许明天就孵化了，我们的孩子需要地方，也需要安宁。
        - id: ch04-b05
          speaker: nag
          text: >-
            我没想到这些。我进去就是。不过以后不必再一起追那只獴。我会咬死男人和妻子，要是能办到，也咬死孩子，再悄悄出来。屋子空了，里基自然会走。
        - id: ch04-b06
          speaker: narrator
          text: >-
            里基听得浑身发麻，又恨又怒。纳格的头钻过排水口，五英尺长的冰冷身体也跟进来。尽管满腔怒火，里基看见大眼镜蛇的个头，仍然怕得厉害。纳格盘起身子，昂头打量黑暗的浴室，双眼闪着光。
        - id: ch04-b07
          speaker: rikki_tikki
          text: >-
            在这里杀他，娜吉娜会知道。到空地板上交手，他又更占便宜。到底该怎么办？
        - id: ch04-b08
          speaker: narrator
          text: >-
            纳格摇摆一阵，低头去喝那只大水缸里的水。
        - id: ch04-b09
          speaker: nag
          text: >-
            很好。卡莱特死时，高个子手里拿着棍子。他也许还留着棍子，可早晨来洗澡时不会带。我要在凉快的浴室等到天亮。娜吉娜，你听见了吗？
        - id: ch04-b10
          speaker: narrator
          text: >-
            外面没有回答，里基知道娜吉娜已经离开。纳格把身体一圈又一圈盘在水缸底部鼓起的地方，里基则静得像死了一样。整整一个钟头过去，他才开始移动，每次只挪动一点肌肉，慢慢靠近水缸。纳格已经睡熟。里基望着那片宽阔的蛇背，苦苦寻找能一口制胜的地方。第一扑若不能咬断脊骨，纳格就还有力气反击。里基又看看颈兜下面的脖子，可那里粗得根本咬不住。要是只在尾巴附近来上一口，除了彻底激怒纳格，不会有任何用处。
        - id: ch04-b11
          speaker: rikki_tikki
          text: >-
            只能咬头，咬住颈兜上面的脑袋。一旦下口，我绝不能松开。
        - id: ch04-b12
          speaker: narrator
          text: >-
            他扑了上去。蛇头躺在水缸下方，离弯曲的缸身有一点空隙。牙齿合拢时，里基把背抵住红陶缸鼓起的肚腹，用全身力量压住蛇头。这支撑只有一秒，可他把那一秒用到了极处。随后，他像狗嘴里的老鼠一样被四处猛甩，一会儿砸向地面，一会儿抛到半空，又绕着大圈不停翻飞。纳格的身体像长鞭一样抽遍浴室，掀翻白铁水瓢、肥皂碟和搓澡刷，还一次次砰然撞上浴缸的铁皮侧面。里基双眼通红，任凭身体被甩得发痛，牙齿却越咬越紧。他认定自己一定会被活活摔死。为了獴家族的荣誉，他宁可让人发现尸体时，牙齿仍牢牢锁在蛇头上，也绝不肯松开。
        - id: ch04-b13
          speaker: narrator
          text: >-
            里基已经头昏眼花，浑身疼痛，觉得自己仿佛被彻底抖散了架。忽然，他身后炸开一声雷鸣。灼热的气浪迎面冲来，把他震得失去知觉，赤红的火光也燎焦了他的皮毛。原来，特迪的父亲被浴室里的巨大响动惊醒，及时带着猎枪赶来。他举起枪，把两个枪管里的弹药都射进纳格颈兜后面的身体。
        - id: ch04-b14
          speaker: narrator
          text: >-
            里基闭紧眼睛，仍不松口，因为他确信自己已经死了。可蛇头不动了。特迪的父亲把他拎起来。
        - id: ch04-b15
          speaker: teddy_father
          text: >-
            爱丽丝，又是这只獴。这一回，小家伙救了我们两人的命。
        - id: ch04-b16
          speaker: narrator
          text: >-
            爱丽丝白着脸走进来，看见了纳格被猎枪打过以后剩下的尸体。里基则拖着疼痛的身子，一点点挪回特迪的卧室。后半夜剩下的时间里，他有一半都在小心抖动这里，再轻轻试试那里，想确认自己是否真像感觉中那样，已经被摔成了四十块。等早晨来临，他浑身僵硬，每动一下都不舒服，却仍对自己这一夜的战绩非常满意。
        - id: ch04-b17
          speaker: rikki_tikki
          text: >-
            现在轮到娜吉娜了。她比五条纳格还难对付，那些蛋又不知何时会孵化。天哪，我必须马上去找达西！
    - id: ch05
      title: 藏在瓜地里的蛋
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            里基没吃早饭，便跑到荆棘丛。纳格的尸体已经被清扫工扔上垃圾堆，死讯传遍花园。达西正扯开嗓门唱胜利之歌。
        - id: ch05-b02
          speaker: rikki_tikki
          text: >-
            你这团蠢羽毛！现在是唱歌的时候吗？
          emotion: angry
        - id: ch05-b03
          speaker: darzee
          text: >-
            纳格死啦，死啦，死啦！英勇的里基-蒂基咬住他的脑袋，怎么也不松。高个子拿来轰响棍，把纳格打成两截！他再也吃不了我的孩子啦！
          emotion: happy
        - id: ch05-b04
          speaker: rikki_tikki
          text: >-
            这些我都知道。娜吉娜在哪儿？
        - id: ch05-b05
          speaker: darzee
          text: >-
            她去浴室排水口呼唤纳格，纳格却让清扫工用棍子挑出来，扔上垃圾堆。现在让我们继续歌唱伟大的红眼睛里基-蒂基！
        - id: ch05-b06
          speaker: rikki_tikki
          text: >-
            我要是爬得到你的巢，真想把你的孩子全滚出来！你高高待着当然安全，我在下面还打着仗。达西，先停一会儿。
          emotion: angry
        - id: ch05-b07
          speaker: darzee
          text: >-
            为了伟大又俊美的里基-蒂基，我愿意停。可怕的纳格的诛杀者啊，你要问什么？
        - id: ch05-b08
          speaker: rikki_tikki
          text: >-
            我已经问第三遍了，娜吉娜在哪里？
        - id: ch05-b09
          speaker: darzee
          text: >-
            她在马厩旁的垃圾堆，为纳格哀悼。长着白牙的里基-蒂基真伟大！
        - id: ch05-b10
          speaker: rikki_tikki
          text: >-
            别再说我的白牙。你知道她把蛋藏在哪里吗？
        - id: ch05-b11
          speaker: darzee
          text: >-
            在瓜地靠墙那一头，那里差不多整天有阳光。她几个星期前就藏好了。
        - id: ch05-b12
          speaker: rikki_tikki
          text: >-
            这么要紧的事，你居然从没告诉我？你说的是靠墙那头，对吧？
        - id: ch05-b13
          speaker: darzee
          text: >-
            里基-蒂基，你不会打算吃她的蛋吧？
        - id: ch05-b14
          speaker: rikki_tikki
          text: >-
            不完全是为了吃。你要还有一点脑子，就飞到马厩去装作翅膀折了，把娜吉娜引到这片灌木来。我得去瓜地，现在过去会让她看见。
        - id: ch05-b15
          speaker: narrator
          text: >-
            达西是个糊涂的小家伙，脑袋里一次只能放下一个念头。他想到娜吉娜的孩子和自己的孩子一样，都是从蛋里孵出来的，起初便觉得杀掉那些蛋很不公平。达西太太却比丈夫明白事理。她知道，现在看见的是眼镜蛇蛋，再过不久，可就是一条条活的小眼镜蛇了。于是，她自己飞离鸟巢，让达西留下给孩子们保暖，也让他继续唱那首纳格之死的歌。达西在某些地方，还真像人一样。
        - id: ch05-b16
          speaker: darzee_wife
          text: >-
            哎呀，我的翅膀折了！屋里的男孩拿石头砸我，把它砸断了！
        - id: ch05-b17
          speaker: narrator
          text: >-
            达西太太在垃圾堆前拼命扑腾。娜吉娜抬起头，嘶声逼近。
        - id: ch05-b18
          speaker: nagaina
          text: >-
            上次我差点杀掉里基-蒂基，是你出声警告了他。你偏偏在我面前瘸了，地方挑得可真不好。
        - id: ch05-b19
          speaker: darzee_wife
          text: >-
            是那个男孩拿石头砸断的！
          emotion: fearful
        - id: ch05-b20
          speaker: nagaina
          text: >-
            那你死时可以拿一件事安慰自己。我会找男孩算账。我丈夫今早躺在垃圾堆上，天黑以前，那男孩也会一动不动地躺下。别逃了，我一定追得上。小蠢货，看着我的眼睛！
          emotion: angry
        - id: ch05-b21
          speaker: narrator
          text: >-
            达西太太很清楚，鸟一旦望进蛇的眼睛，就会吓得全身僵住，再也动弹不得。所以，无论娜吉娜怎样命令，她始终不肯回头。她只贴着地面向前扑腾，装作伤得很重，嘴里发出一声声凄厉的哀鸣，翅膀却从未真正停下。娜吉娜相信猎物就在眼前，果然越爬越快，紧紧追着她，沿马厩旁的小路一路往屋子那边去了。
        - id: ch05-b22
          speaker: narrator
          text: >-
            里基听见她们沿马厩旁的小路一路远去，马上冲向瓜地靠墙的一头。他赶到那里，在瓜藤上方温暖的草屑中仔细搜寻，终于发现二十五枚藏得十分巧妙的蛋。每一枚都接近矮脚鸡蛋的大小，可外面没有坚硬的蛋壳，只裹着一层发白的软皮。要不是早已知道位置，很容易便会从旁边错过。
        - id: ch05-b23
          speaker: rikki_tikki
          text: >-
            幸好我没有再晚一天。
        - id: ch05-b24
          speaker: narrator
          text: >-
            里基透过发白的软皮，已经能看见小眼镜蛇蜷在里面。他很清楚，这些蛇只要一出壳，每一条都有本事杀死一个人或一只獴。他飞快咬开蛋顶，又小心压死里面的幼蛇。每毁掉几枚，他便翻动一次草屑，仔细查看有没有遗漏。忙到最后，地上只剩三枚完整的蛋。里基正对自己咯咯发笑，忽然听见达西太太从远处尖叫起来。
        - id: ch05-b25
          speaker: darzee_wife
          text: >-
            里基-蒂基！我把娜吉娜引向屋子，可她钻进游廊了。快来，她要杀人！
          emotion: fearful
    - id: ch06
      title: 游廊上的最后一枚蛋
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            里基立刻咬碎两枚蛋，把最后一枚衔在嘴里，倒退着滚下瓜地，四条腿使出全部力气，直奔游廊。特迪和父母都坐在那里吃早饭，可桌上的食物谁也没碰。三个人像石头一样僵住，脸色一片惨白。娜吉娜就盘在特迪椅旁的草席上，离男孩光着的小腿只有一扑之遥。她慢慢来回摇摆，嘴里唱着自己的胜利之歌，随时都能射出脑袋。
        - id: ch06-b02
          speaker: nagaina
          text: >-
            杀死纳格的男人的儿子，不许动，我还没准备好。你们三个都别动！动了，我就咬。不动，我也一样会咬。你们这些蠢人，竟敢杀死我的纳格！
          emotion: angry
        - id: ch06-b03
          speaker: narrator
          text: >-
            特迪死死望着父亲，父亲只能压低声音提醒他。
        - id: ch06-b04
          speaker: teddy_father
          text: >-
            特迪，坐着别动。千万不要动，保持原样。
          emotion: calm
        - id: ch06-b05
          speaker: rikki_tikki
          text: >-
            娜吉娜，转过来！回头跟我打！
        - id: ch06-b06
          speaker: nagaina
          text: >-
            不必着急，我等会儿再跟你算账。看看你的朋友，他们吓得脸白，连动都不敢。你再走近一步，我立刻咬下去。
        - id: ch06-b07
          speaker: rikki_tikki
          text: >-
            先看看你的蛋吧。它们就在靠墙的瓜地里。去看看，娜吉娜！
        - id: ch06-b08
          speaker: narrator
          text: >-
            大蛇转过半边身体，看见了游廊上的蛋。
        - id: ch06-b09
          speaker: nagaina
          text: >-
            啊！把它还给我！
          emotion: surprised
        - id: ch06-b10
          speaker: narrator
          text: >-
            里基把两只前爪放在蛋的两旁，双眼红得像血。
        - id: ch06-b11
          speaker: rikki_tikki
          text: >-
            一枚蛇蛋值什么价？一条小眼镜蛇呢？一条小眼镜王蛇呢？这是最后一枚，你整窝孩子里最后一个。其余的都在瓜地，正让蚂蚁吃掉！
        - id: ch06-b12
          speaker: narrator
          text: >-
            娜吉娜为了仅剩的蛋，猛地转过整个身子，忘掉了一切。特迪的父亲立刻伸手抓住男孩的肩膀，隔着摆有茶杯的小桌把他拖过来，拉出了蛇的攻击范围。
        - id: ch06-b13
          speaker: rikki_tikki
          text: >-
            上当啦，上当啦，上当啦！里克—蒂克—蒂克！男孩已经安全。昨晚在浴室里咬住纳格颈兜的，就是我，就是我！他把我甩来甩去，却没能甩掉我。高个子用枪把他轰成两截以前，他就死了。是我杀的！来吧，娜吉娜，跟我打。你守不了多久的寡！
          emotion: happy
        - id: ch06-b14
          speaker: narrator
          text: >-
            里基四脚并拢，上下跳跃，脑袋贴近地面。娜吉娜看出自己再也杀不了特迪，只能望着夹在里基两爪间的蛋。
        - id: ch06-b15
          speaker: nagaina
          text: >-
            里基-蒂基，把蛋给我。把我最后的蛋还来，我马上离开，永远不回来。
          emotion: sad
        - id: ch06-b16
          speaker: rikki_tikki
          text: >-
            对，你会离开，也永远不会回来。因为你要去垃圾堆陪纳格。来打呀，寡妇！高个子已经去拿枪了！
        - id: ch06-b17
          speaker: narrator
          text: >-
            里基不停绕着娜吉娜跳，总待在她扑击刚好够不到的地方，两只小眼睛亮得像烧红的炭。娜吉娜缩紧身体，猛然把头射出去。里基向上向后一跃，躲开了。她再扑，他又跳。一次、两次、三次，每一回，蛇头都啪地撞上游廊草席。撞完以后，她又像收紧的手表发条一样，把全身重新盘好。里基绕着圆圈舞动，想抢到她背后。娜吉娜也急速旋转，始终让自己的头正对他的头。她的尾巴不断扫过草席，沙沙作响，像一阵风卷着枯叶掠过地面。
        - id: ch06-b18
          speaker: narrator
          text: >-
            里基只顾着躲闪，竟忘了最后那枚蛋仍躺在游廊上。娜吉娜一面交战，一面离它越来越近。终于，里基停下来喘了一口气。就在这一瞬，娜吉娜一口衔住蛋，掉头冲向游廊台阶，又沿小路飞逃。眼镜蛇为活命而逃时，速度快得像抽过马颈的一记鞭梢。里基马上紧追在后。他知道，自己必须抓住娜吉娜。只要她带着这枚蛋逃走，花园里的所有麻烦迟早都会重新开始。
    - id: ch07
      title: 洞穴之下
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            娜吉娜直奔荆棘丛旁的长草。达西还在唱那首傻乎乎的胜利歌，达西太太却飞离鸟巢，在娜吉娜头边用力拍翅。要是达西也来帮忙，也许能逼蛇转向。可娜吉娜只是压低颈兜，继续冲向前。这一点耽搁已经足够，里基赶上了她。
        - id: ch07-b02
          speaker: narrator
          text: >-
            娜吉娜一头钻进她和纳格住过的老鼠洞，里基的一排小白牙正好咬住她的尾巴，也被带进洞里。再聪明、再年长的獴，也很少愿意追着眼镜蛇钻进她的巢穴。洞中没有一点光，里基看不见前路，也不知道狭窄的通道会在什么时候突然变宽。只要有了转身的地方，娜吉娜便能回头朝他猛咬。里基顾不上这些。他凶狠地咬住蛇尾，把四只脚全部向外撑开，当作刹车，沿温热潮湿的黑土斜坡一路滑向深处。
        - id: ch07-b03
          speaker: narrator
          text: >-
            洞口的草不再摇晃。达西以为，一切都完了。
        - id: ch07-b04
          speaker: darzee
          text: >-
            里基-蒂基死了！我们得给他唱挽歌。英勇的里基-蒂基已经死了，娜吉娜一定会在地下杀掉他！
          emotion: sad
        - id: ch07-b05
          speaker: narrator
          text: >-
            达西当场编出一支极其哀伤的歌，站在巢边唱起他自以为最合适的挽歌。就在他唱到最动人的地方时，洞口的草忽然又颤了一下。满身泥土的里基-蒂基从黑暗里出现了。他先拖出一条腿，再拖出另一条，一点点把自己拉到地面上，嘴里还若无其事地舔着胡须。达西惊喜地轻叫一声，挽歌立刻停了。里基站稳身体，抖掉皮毛间的一些尘土，然后响亮地打了个喷嚏。
        - id: ch07-b06
          speaker: rikki_tikki
          text: >-
            全结束了。那寡妇再也不会从洞里出来。
        - id: ch07-b07
          speaker: narrator
          text: >-
            草茎间的红蚂蚁听见这句话，一只接一只排队下洞，去看他说的是不是真话。里基则蜷在草中，睡了又睡，一直睡到下午很晚。这一天，他实在干了太多辛苦活。
        - id: ch07-b08
          speaker: rikki_tikki
          text: >-
            现在该回家了。达西，把消息告诉铜匠鸟。他会通知整个花园，娜吉娜已经死了。
        - id: ch07-b09
          speaker: narrator
          text: >-
            铜匠鸟的叫声就像小锤敲铜罐。他是印度花园里的报信人，总把新闻告诉所有愿意听的动物。里基沿小路回家时，先听见他像小小晚餐铃一样敲出“请注意”的调子，接着便开始正式报信。
        - id: ch07-b10
          speaker: coppersmith
          text: >-
            叮—咚—当！纳格死了——咚！娜吉娜死了！叮—咚—当！
          emotion: happy
        - id: ch07-b11
          speaker: narrator
          text: >-
            铜匠鸟的消息一响，整座花园顿时充满鸟儿的歌声，青蛙也跟着呱呱欢叫。因为纳格和娜吉娜不只吃小鸟，也从来不会放过青蛙。里基回到屋前，特迪、爱丽丝和特迪的父亲全都迎了出来。他们看见这个满身疲惫的小家伙，几乎高兴得哭了。爱丽丝的脸色仍旧苍白，不久前她还吓得昏了过去。到了晚上，家人给里基多少好吃的，他就吃下多少，一直吃到再也吃不动。随后，他爬到特迪肩上，安心睡着了。夜深以后，爱丽丝最后一次走进房间看儿子，又看见里基仍守在那里。
        - id: ch07-b12
          speaker: alice
          text: >-
            他救了我们，也救了特迪。想一想，他把我们全家的命都救下来了。
        - id: ch07-b13
          speaker: narrator
          text: >-
            獴睡觉很警醒。里基猛地醒来。
        - id: ch07-b14
          speaker: rikki_tikki
          text: >-
            哦，是你呀。还有什么好操心的？眼镜蛇全死了。就算还有，我也守在这里。
        - id: ch07-b15
          speaker: narrator
          text: >-
            里基-蒂基当然有资格骄傲，可他没有骄傲过头。从此，他像一只真正尽职的獴那样守护花园，用牙齿、跳跃、猛扑和撕咬迎敌。到了最后，再没有一条眼镜蛇敢在围墙里面露头。
