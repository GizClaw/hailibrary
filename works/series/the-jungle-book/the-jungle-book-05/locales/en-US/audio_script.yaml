  chapters:
    - id: ch01
      title: The Mongoose Comes to the Bungalow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "At the hole where he went in, Red-Eye called to Wrinkle-Skin. Hear what little Red-Eye said. Nag, come up and dance with death! Eye to eye and head to head, keep the measure, Nag. This shall end when one is dead, at your pleasure, Nag. Turn for turn and twist for twist, run and hide, Nag. Ha! The hooded Death has missed. Woe to you, Nag!"
        - id: ch01-b02
          speaker: narrator
          text: "This is the story of the great war Rikki-tikki-tavi fought alone through the bathrooms of a big bungalow in Segowlee. Darzee the Tailorbird helped him. Chuchundra the muskrat, who never crossed the middle of a room and always crept beside the wall, gave him advice. But Rikki-tikki did the fighting."
        - id: ch01-b03
          speaker: narrator
          text: "Rikki-tikki was a mongoose. His fur and tail made him look a little like a cat, while his head and habits were more like a weasel's. His eyes were pink, and so was the tip of his restless nose. He could scratch any part of himself with any paw he pleased. He could puff his tail into a bottle brush. When he raced through long grass, his war cry rang out."
        - id: ch01-b04
          speaker: rikki_tikki
          text: "Rikk-tikk-tikki-tikki-tchk!"
        - id: ch01-b05
          speaker: narrator
          text: "One summer day, a flood swept him from the burrow where he lived with his mother and father. It carried him, kicking and clucking, along a roadside ditch. He caught a little floating wisp of grass and clung to it until he fainted. When he woke, he lay soaked and bedraggled in the hot sun, right in the middle of a garden path. A small boy stood over him."
        - id: ch01-b06
          speaker: teddy
          text: "Look, a dead mongoose! Let's give him a funeral."
        - id: ch01-b07
          speaker: teddy_mother
          text: "No, Teddy. Let's bring him inside and dry him. He may still be alive."
        - id: ch01-b08
          speaker: narrator
          text: "They carried him into the house. Teddy's father lifted him between finger and thumb and saw that he was not dead, only half choked. The family wrapped him in cotton wool and warmed him over a small fire. At last he opened his eyes and sneezed. Teddy's father was an Englishman who had only just moved into the bungalow."
        - id: ch01-b09
          speaker: teddy_father
          text: "Don't scare him. Let's be quiet and see what he does."
        - id: ch01-b10
          speaker: narrator
          text: "Scaring a mongoose is one of the hardest things in the world. Curiosity fills him from nose to tail. Every mongoose lives by the same motto, run and find out, and Rikki-tikki was a true mongoose. He examined the cotton wool and decided it was not food. Then he ran around the table, sat up to smooth his fur, scratched himself, and sprang onto Teddy's shoulder."
        - id: ch01-b11
          speaker: teddy_father
          text: "Don't be afraid, Teddy. That is how he makes friends."
        - id: ch01-b12
          speaker: teddy
          text: "Ow! He's tickling me under the chin!"
        - id: ch01-b13
          speaker: narrator
          text: "Rikki-tikki peered down between Teddy's neck and collar, sniffed his ear, and climbed to the floor. There he sat and rubbed his nose."
        - id: ch01-b14
          speaker: teddy_mother
          text: "Goodness, and he is a wild animal! Perhaps he is this tame because we treated him kindly."
        - id: ch01-b15
          speaker: teddy_father
          text: "Mongooses are all like this. As long as Teddy never lifts him by the tail or shuts him in a cage, he'll spend the whole day running in and out. Let's find him some food."
        - id: ch01-b16
          speaker: narrator
          text: "They gave him a small piece of raw meat, and he loved it. When it was gone, he sat in the sunshine on the veranda and puffed out his fur until the warmth reached the roots. Soon he felt much better."
        - id: ch01-b17
          speaker: rikki_tikki
          text: "This house has more things to discover than my whole family could find in a lifetime. I'm staying here to find them out."
        - id: ch01-b18
          speaker: narrator
          text: "He spent the whole day exploring the house. He nearly drowned himself in the bathtubs, pushed his nose into the ink on a writing table, and climbed onto Teddy's father's lap to learn how writing was done. There he burned that same curious nose on the end of the man's cigar. At dusk he hurried into Teddy's room and watched the kerosene lamps being lit. When Teddy climbed into bed, Rikki-tikki climbed up beside him. He was a restless bedfellow. All through the night, every sound made him get up, search the room, and discover what had caused it."
        - id: ch01-b19
          speaker: narrator
          text: "Late that night, Teddy's parents came to look at their son. Rikki-tikki was still awake on the pillow."
        - id: ch01-b20
          speaker: teddy_mother
          text: "I don't like him sleeping there. He might bite Teddy."
        - id: ch01-b21
          speaker: teddy_father
          text: "He won't. Teddy is safer with that little animal than he would be with a bloodhound guarding him. If a snake came into the room now..."
        - id: ch01-b22
          speaker: narrator
          text: "Teddy's mother refused to imagine anything so dreadful. Early the next morning, Rikki-tikki rode on Teddy's shoulder to breakfast on the veranda. He ate banana and boiled egg, then sat on each person's lap in turn. Every well-raised mongoose hopes to become a house mongoose one day, with rooms of his own to explore. Rikki-tikki's mother had once lived in the general's house at Segowlee, and she had carefully taught him how to behave if he ever met white people."
    - id: ch02
      title: The Snakes in the Garden
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "After breakfast, Rikki-tikki went outside to discover what the garden held. It was a large place, and only half of it had been cultivated. Great Marshal Niel rosebushes stood as big as summerhouses. Lime trees and orange trees grew among clumps of bamboo and thick patches of tall grass. To a young mongoose, every shadow and scent promised something worth investigating. Rikki-tikki looked across this wild hunting ground and licked his lips."
        - id: ch02-b02
          speaker: rikki_tikki
          text: "What a splendid place to hunt!"
        - id: ch02-b03
          speaker: narrator
          text: "The thought made his tail puff up. He hurried here and there, sniffing everything, until he heard sorrowful voices inside a thornbush. Darzee the Tailorbird and his wife sat crying on the edge of their nest. They had made it by sewing two large leaves together along their edges, then lining the hollow with cotton and soft fluff. As they wept, the nest rocked on its branch."
        - id: ch02-b04
          speaker: rikki_tikki
          text: "Why are you crying?"
        - id: ch02-b05
          speaker: darzee
          text: "We are miserable. Yesterday one of our babies fell from the nest, and Nag ate him."
          emotion: sad
        - id: ch02-b06
          speaker: rikki_tikki
          text: "That is terrible. But I'm new here. Who is Nag?"
        - id: ch02-b07
          speaker: narrator
          text: "The two birds crouched low inside their nest and gave no answer. From the thick grass at the foot of the bush came a low hiss. It was such a cold and dreadful sound that Rikki-tikki leaped back two full feet. Then, inch by inch, the head and open hood of a great black cobra rose above the grass. It was Nag, and he measured five feet from tongue to tail. He lifted a third of his body clear of the ground. There he stayed, balancing from side to side exactly like a dandelion tuft moving in the wind. His wicked snake eyes watched Rikki-tikki without changing at all, no matter what Nag might be thinking."
        - id: ch02-b08
          speaker: nag
          text: "Who is Nag? I am Nag. When the first cobra opened his hood to shade the great god Brahm as he slept, Brahm marked all my people. Look at that mark, and be afraid!"
        - id: ch02-b09
          speaker: narrator
          text: "Nag spread his hood even wider. On the back was a marking shaped like the eye of a hook-and-eye clasp. For one moment, Rikki-tikki was afraid. But a mongoose cannot remain frightened for long. He had never faced a living cobra, though his mother had fed him dead ones. He knew that a grown mongoose lives to fight and eat snakes. Nag knew it too, and deep in his cold heart, Nag was afraid of him."
        - id: ch02-b10
          speaker: rikki_tikki
          text: "Marked or not, what gives you the right to eat baby birds from their nest?"
        - id: ch02-b11
          speaker: narrator
          text: "Nag watched the faintest movement in the grass behind Rikki-tikki. A mongoose in the garden would sooner or later mean death for Nag and his family. He wanted Rikki-tikki to stop paying attention, so he lowered his head and tilted it to one side."
        - id: ch02-b12
          speaker: nag
          text: "Let us reason together. You eat eggs, so why shouldn't I eat birds?"
        - id: ch02-b13
          speaker: darzee
          text: "Behind you! Look behind you!"
          emotion: fearful
        - id: ch02-b14
          speaker: narrator
          text: "Rikki-tikki knew too much to waste a heartbeat turning to look. He sprang as high into the air as he could. Nagaina, Nag's fierce wife, shot underneath him. While Nag kept him talking, she had crept through the grass behind him and meant to finish him with one strike. Her savage hiss followed the miss. Rikki-tikki came down almost across her back. If he had been an old, experienced mongoose, he would have known that this was the moment to break her back with one bite. But he feared the cobra's terrible lashing return stroke. He bit her, though he did not hold on long enough. Then he jumped clear of her whipping tail, leaving Nagaina wounded and furious."
        - id: ch02-b15
          speaker: nag
          text: "Wicked Darzee! Wicked, wicked bird!"
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: "Nag struck upward at the nest, but Darzee had built it beyond a snake's reach. It only swung on its branch. Rikki-tikki's eyes burned red, as a mongoose's eyes do when he is angry. He sat upright on his hind legs and tail, looking all around and chattering with rage. Nag and Nagaina had vanished into the grass. A snake gives no warning of what it will do after a strike has failed. Rikki-tikki did not follow. He was not sure he could manage two cobras at once. He went back to the gravel path by the house and sat down to think. This was serious."
        - id: ch02-b17
          speaker: narrator
          text: "Old natural-history books may tell you that a bitten mongoose runs away and eats a healing herb. That is not true. Victory comes from quick eyes and quick feet, the snake's strike against the mongoose's jump. No eye can follow a snake's head when it attacks, which makes the truth more wonderful than any magic herb. Rikki-tikki knew he was young. Escaping that blow from behind made him proud and gave him confidence. When Teddy ran down the path, Rikki-tikki was ready to be stroked."
        - id: ch02-b18
          speaker: narrator
          text: "As Teddy bent over him, something moved in the dust. A tiny voice spoke."
        - id: ch02-b19
          speaker: karait
          text: "Take care. I am Death."
        - id: ch02-b20
          speaker: narrator
          text: "It was Karait, a dusty-brown little snake that liked to lie on dusty ground. His bite was as deadly as a cobra's. Because he was so small, people overlooked him, and that made him even more dangerous. Rikki-tikki's eyes reddened. He danced toward Karait with the rocking, swaying step his family had given him. It looked funny, but it kept him so perfectly balanced that he could spring in any direction. Against a snake, that was a great advantage."
        - id: ch02-b21
          speaker: narrator
          text: "Without knowing it, Rikki-tikki faced more danger than he had faced with Nag. Karait was so small and could turn so quickly that one mistake would be enough. Unless Rikki-tikki bit him close behind the head, the return strike would catch his eye or lip. But Rikki-tikki did not know this. His eyes were completely red. He rocked forward and back, watching for the right place to take hold. Karait struck first. Rikki-tikki sprang sideways and tried to rush in. The wicked little gray head whipped past his shoulder by the narrowest space. He had to leap right over Karait's body, and the head twisted around and followed close behind his heels."
        - id: ch02-b22
          speaker: teddy
          text: "Come and see! Our mongoose is killing a snake!"
          emotion: surprised
        - id: ch02-b23
          speaker: narrator
          text: "Teddy's mother screamed. His father ran out carrying a stick. Before he reached them, Karait lunged once too far. Rikki-tikki sprang onto his back, thrust his head far between his own forelegs, and bit as high on the snake's back as he could reach. Then he rolled clear. The bite paralyzed Karait. Rikki-tikki was about to begin eating him from the tail, as his family always did, when he remembered that a heavy meal makes a mongoose slow. He would need every bit of his strength and speed, so he kept himself lean."
        - id: ch02-b24
          speaker: narrator
          text: "He took a dust bath beneath the castor-oil bushes while Teddy's father beat the dead snake with his stick. Rikki-tikki wondered why the man bothered when the work was already done. Teddy's mother lifted him out of the dust and hugged him, crying because he had saved Teddy from death. Teddy's father called him a blessing. Teddy stared with huge, frightened eyes. Rikki-tikki did not understand all the fuss and found it rather funny. Teddy's mother might just as well have praised Teddy for rolling in dust. Rikki-tikki was enjoying himself thoroughly."
        - id: ch02-b25
          speaker: narrator
          text: "At dinner that night, he walked among the wineglasses and could have eaten three enormous meals. Yet he remembered Nag and Nagaina. Teddy's mother petted him, and he sat happily on Teddy's shoulder, but every so often his eyes glowed red and his war cry burst out."
        - id: ch02-b26
          speaker: rikki_tikki
          text: "Rikk-tikk-tikki-tikki-tchk!"
    - id: ch03
      title: The Night Battle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Teddy carried Rikki-tikki to bed and insisted that he sleep beneath his chin. Rikki-tikki was too well mannered to scratch or bite. But the moment Teddy fell asleep, he left for his nightly tour of the house. In the darkness he bumped into Chuchundra the muskrat, who was creeping along beside the wall. Chuchundra was a brokenhearted little creature. All night he whimpered and chirped, trying to gather enough courage to cross the open floor, and he never managed it."
        - id: ch03-b02
          speaker: chuchundra
          text: "Please don't kill me, Rikki-tikki. Please!"
          emotion: fearful
        - id: ch03-b03
          speaker: rikki_tikki
          text: "Why would a snake-killer hunt muskrats?"
        - id: ch03-b04
          speaker: chuchundra
          text: "A snake-killer may be killed by snakes. And on a dark night, how can I know Nag won't mistake me for you?"
          emotion: fearful
        - id: ch03-b05
          speaker: rikki_tikki
          text: "You have nothing to fear. Nag stays in the garden, and you never go outside."
        - id: ch03-b06
          speaker: chuchundra
          text: "My cousin Chua the rat told me..."
        - id: ch03-b07
          speaker: rikki_tikki
          text: "Told you what?"
        - id: ch03-b08
          speaker: chuchundra
          text: "Hush! Nag can be anywhere. You should have spoken to Chua in the garden."
          emotion: fearful
        - id: ch03-b09
          speaker: rikki_tikki
          text: "I didn't speak to him, so you must tell me. Be quick, Chuchundra, or I'll bite."
        - id: ch03-b10
          speaker: narrator
          text: "Chuchundra sat down and wept until tears rolled from his whiskers."
        - id: ch03-b11
          speaker: chuchundra
          text: "I am only a poor creature. I have never even dared to run across the room. Hush! I must not say another word. Can't you hear it, Rikki-tikki?"
          emotion: fearful
        - id: ch03-b12
          speaker: narrator
          text: "Rikki-tikki listened. The house seemed perfectly still. Then he caught the faintest scratch in the world, as soft as a wasp walking on a windowpane. It was the dry sound of snake scales brushing brick."
        - id: ch03-b13
          speaker: rikki_tikki
          text: "That is Nag or Nagaina slipping into a bathroom drain. You were right, Chuchundra. I should have spoken to Chua."
        - id: ch03-b14
          speaker: narrator
          text: "He stole into Teddy's bathroom and found nothing. Then he went to the bathroom used by Teddy's mother. One brick had been removed from the bottom of the smooth plaster wall so bathwater could drain away. As Rikki-tikki crept beside the raised base of the tub, he heard Nag and Nagaina whispering outside in the moonlight."
        - id: ch03-b15
          speaker: nagaina
          text: "Once the people are gone, the mongoose will leave too, and the garden will belong to us again. Go in quietly. Bite the big man first, the one who killed Karait. Then come tell me, and together we'll hunt Rikki-tikki."
        - id: ch03-b16
          speaker: nag
          text: "Will killing the people truly help us?"
        - id: ch03-b17
          speaker: nagaina
          text: "It changes everything. Before people lived in the bungalow, there was no mongoose in our garden. Empty the house, and we will rule the garden again. Our eggs in the melon bed may hatch tomorrow. Our children will need peace and room."
        - id: ch03-b18
          speaker: nag
          text: "I hadn't considered the eggs. I'll go. We won't need to hunt the mongoose afterward. I'll kill the man, his wife, and the boy if I can. When the house is empty, Rikki-tikki will leave."
        - id: ch03-b19
          speaker: narrator
          text: "Rage and hatred tingled through Rikki-tikki. Then Nag's head entered through the drain, followed by five cold feet of cobra. Even in his anger, Rikki-tikki was frightened by Nag's size. The cobra coiled up, lifted his head, and peered through the darkness. His eyes glittered."
        - id: ch03-b20
          speaker: rikki_tikki
          text: "If I kill him here, Nagaina will find out. But if I fight him in the open, he has the advantage. What can I do?"
        - id: ch03-b21
          speaker: narrator
          text: "Nag swayed from side to side. Then Rikki-tikki heard him drink from the largest water jar, the one used to fill the bath."
        - id: ch03-b22
          speaker: nag
          text: "Good. When Karait died, the man carried a stick. He may still have it. But when he comes to bathe in the morning, he will carry nothing. Nagaina, can you hear me? I will wait here in the cool until daylight."
        - id: ch03-b23
          speaker: narrator
          text: "No answer came from outside. Rikki-tikki knew Nagaina had left. Nag settled down, winding himself coil after coil around the rounded base of the water jar. Rikki-tikki stayed as still as death. A whole hour passed. Then he began to move toward the jar, shifting only one muscle at a time. Nag slept on. Rikki-tikki studied the cobra's enormous back and wondered where he could take a strong enough hold. The first bite had to decide the battle."
        - id: ch03-b24
          speaker: rikki_tikki
          text: "If my first leap doesn't break his back, he'll fight. And if he fights... oh, Rikki!"
        - id: ch03-b25
          speaker: narrator
          text: "The neck beneath the hood was far too thick for his jaws. A bite near the tail would only enrage the snake. At last Rikki-tikki made his choice."
        - id: ch03-b26
          speaker: rikki_tikki
          text: "The head. I must bite above the hood, and once I have it, I must never let go."
        - id: ch03-b27
          speaker: narrator
          text: "He jumped. Nag's head rested a little way from the water jar, directly beneath its curve. The instant his teeth closed, Rikki-tikki braced his back against the bulging red earthenware and forced the head down. That gave him one second of advantage, and he used every part of it. Then Nag battered him across the floor as a dog shakes a rat. They flew back and forth over the tiles, then up and down and around in great circles. Nag's body lashed like a cart whip, scattering the metal dipper, the soap dish, and the flesh brush. Again and again it crashed against the tin side of the bathtub, and still Rikki-tikki held on."
        - id: ch03-b28
          speaker: narrator
          text: "Rikki-tikki's eyes stayed red and his teeth stayed locked. He tightened his jaws as the blows made him dizzy and sore. He believed Nag would beat him to death, and for the honor of his family he meant to be found still holding on. Suddenly a thunderclap burst behind him. A hot wind struck him senseless, and red fire singed his fur. The noise had awakened Teddy's father, who fired both barrels of a shotgun into Nag just behind the hood."
        - id: ch03-b29
          speaker: narrator
          text: "Rikki-tikki kept his eyes shut and held fast, certain he was dead. But Nag's head no longer moved. Teddy's father picked up the mongoose."
        - id: ch03-b30
          speaker: teddy_father
          text: "It's our mongoose again, Alice. The little fellow has saved our lives this time."
        - id: ch03-b31
          speaker: narrator
          text: "Teddy's mother came in with a white face and looked at what remained of Nag. Rikki-tikki dragged himself to Teddy's room. For half the rest of the night, he carefully shook each part of his body to learn whether he had truly been broken into forty pieces, as he felt he had."
        - id: ch03-b32
          speaker: narrator
          text: "Morning found him stiff but deeply pleased with his night's work."
        - id: ch03-b33
          speaker: rikki_tikki
          text: "Now I must deal with Nagaina. She is worse than five Nags, and those eggs might hatch at any time. I must find Darzee at once!"
    - id: ch04
      title: The Last Egg
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Without stopping for breakfast, Rikki-tikki ran to the thornbush. Darzee was singing a victory song at the top of his voice. Everyone in the garden knew that Nag was dead, because the sweeper had carried the body to the rubbish heap."
        - id: ch04-b02
          speaker: rikki_tikki
          text: "You silly bundle of feathers! Is this a time for singing?"
          emotion: angry
        - id: ch04-b03
          speaker: darzee
          text: "Nag is dead, dead, dead! Brave Rikki-tikki caught his head and would not let go. The big man brought the bang-stick, and Nag fell into two pieces. He will never eat my babies again!"
          emotion: happy
        - id: ch04-b04
          speaker: rikki_tikki
          text: "Yes, yes, but where is Nagaina?"
        - id: ch04-b05
          speaker: darzee
          text: "Nagaina called for Nag beside the bathroom drain. Nag came out on the end of the sweeper's stick and was thrown onto the rubbish heap. Now let us sing of the great red-eyed Rikki-tikki!"
        - id: ch04-b06
          speaker: narrator
          text: "Darzee filled his throat and began another song."
        - id: ch04-b07
          speaker: rikki_tikki
          text: "If I could reach your nest, I'd roll your babies out! You never know the right thing to do at the right time. You may be safe up there, but the war isn't over for me. Stop singing and listen."
          emotion: angry
        - id: ch04-b08
          speaker: darzee
          text: "For the sake of the great and beautiful Rikki-tikki, I will be silent. What do you ask, O Killer of terrible Nag?"
        - id: ch04-b09
          speaker: rikki_tikki
          text: "For the third time, where is Nagaina?"
        - id: ch04-b10
          speaker: darzee
          text: "She is mourning for Nag on the rubbish heap near the stables. Great indeed is Rikki-tikki with his white teeth!"
        - id: ch04-b11
          speaker: rikki_tikki
          text: "Forget my white teeth. Do you know where she hid her eggs?"
        - id: ch04-b12
          speaker: darzee
          text: "In the melon bed, close to the wall where the sun shines nearly all day. She put them there weeks ago."
        - id: ch04-b13
          speaker: rikki_tikki
          text: "And you never thought to tell me? You said the end by the wall, didn't you?"
        - id: ch04-b14
          speaker: darzee
          text: "Rikki-tikki, surely you don't mean to eat her eggs?"
        - id: ch04-b15
          speaker: rikki_tikki
          text: "Not exactly. Darzee, if you have any sense at all, fly to the stables and pretend your wing is broken. Make Nagaina chase you toward this bush. I need to reach the melon bed without her seeing me."
        - id: ch04-b16
          speaker: narrator
          text: "Darzee could hold only one idea in his head at a time. Since Nagaina's children came from eggs just as his own children did, he could not at first believe it fair to destroy them. His wife had better sense. She knew cobra eggs would soon become young cobras. She left Darzee warming the babies and singing about Nag, and flew toward the rubbish heap."
        - id: ch04-b17
          speaker: darzee_wife
          text: "Oh, my wing is broken! The boy in the house threw a stone and broke my wing!"
        - id: ch04-b18
          speaker: narrator
          text: "She fluttered desperately in front of Nagaina. The cobra raised her head and hissed."
        - id: ch04-b19
          speaker: nagaina
          text: "You warned Rikki-tikki when I tried to kill him. You have chosen a very bad place to be lame."
          emotion: angry
        - id: ch04-b20
          speaker: narrator
          text: "Nagaina slid toward her over the dust."
        - id: ch04-b21
          speaker: darzee_wife
          text: "The boy struck me with a stone!"
        - id: ch04-b22
          speaker: nagaina
          text: "When you are dead, perhaps it will comfort you to know that I will repay the boy. My husband lies on the rubbish heap this morning. Before night, the boy will lie still too. Running is useless. I will catch you. Look at me, little fool!"
          emotion: angry
        - id: ch04-b23
          speaker: narrator
          text: "Darzee's wife knew better. A bird that meets a snake's eyes becomes too frightened to move. She kept fluttering along the ground and crying sadly without once looking back. Nagaina moved faster after her."
        - id: ch04-b24
          speaker: narrator
          text: "Rikki-tikki heard them pass up the path from the stables and raced to the melon bed beside the wall. Hidden cleverly in the warm litter above the melons, he found twenty-five eggs. They were about the size of bantam eggs, with pale skin instead of shells."
        - id: ch04-b25
          speaker: rikki_tikki
          text: "I have come just in time."
        - id: ch04-b26
          speaker: narrator
          text: "Through the pale skin, he could see each baby cobra curled up inside. The moment they hatched, every one of them would already be able to kill a person or a mongoose. Rikki-tikki bit the tops from the eggs as quickly as he could. He took care to crush every young snake inside, then turned the warm litter over again and again to make sure no hidden egg had escaped him. At last only three eggs remained. Rikki-tikki had just begun to chuckle to himself when Darzee's wife screamed from above."
        - id: ch04-b27
          speaker: darzee_wife
          text: "Rikki-tikki! I led Nagaina toward the house, but she went onto the veranda. Come quickly! She means to kill!"
          emotion: fearful
        - id: ch04-b28
          speaker: narrator
          text: "Rikki-tikki smashed two eggs. Holding the last one in his mouth, he tumbled backward from the melon bed and raced for the veranda. Teddy and his parents sat at early breakfast, but no one was eating. Their faces were white, and they did not move. Nagaina lay coiled on the mat beside Teddy's chair, close enough to strike his bare leg. She swayed from side to side and sang her victory song."
        - id: ch04-b29
          speaker: nagaina
          text: "Son of the man who killed Nag, do not move. I am not ready for you yet. Wait. All three of you must sit perfectly still. If you move, I strike. If you stay still, I strike. Foolish people, you killed my Nag!"
          emotion: angry
        - id: ch04-b30
          speaker: narrator
          text: "Teddy stared at his father. The man could only whisper."
        - id: ch04-b31
          speaker: teddy_father
          text: "Stay still, Teddy. Do not move. Keep perfectly still."
          emotion: fearful
        - id: ch04-b32
          speaker: rikki_tikki
          text: "Turn around, Nagaina. Face me and fight!"
        - id: ch04-b33
          speaker: nagaina
          text: "Your turn will come. Look at your friends, Rikki-tikki. Their faces are white. They are afraid even to move. Come one step closer, and I will strike the boy."
        - id: ch04-b34
          speaker: rikki_tikki
          text: "What about your eggs in the melon bed beside the wall? Go and look at them, Nagaina."
        - id: ch04-b35
          speaker: narrator
          text: "The cobra turned halfway and saw the egg on the veranda."
        - id: ch04-b36
          speaker: nagaina
          text: "Ah! Give it to me."
        - id: ch04-b37
          speaker: narrator
          text: "Rikki-tikki set one paw on either side of the egg. His eyes were blood-red."
        - id: ch04-b38
          speaker: rikki_tikki
          text: "What is a snake's egg worth? A baby cobra? A young king cobra? This is the last one, the very last of your brood. Ants are eating all the others by the melon bed."
        - id: ch04-b39
          speaker: narrator
          text: "Nagaina whipped around, forgetting everything for the sake of that egg. Teddy's father shot out one hand, seized Teddy by the shoulder, and pulled him across the breakfast table among the teacups. The boy was beyond Nagaina's reach."
        - id: ch04-b40
          speaker: rikki_tikki
          text: "Tricked, tricked, tricked! Rikk-tck-tck! The boy is safe. And I was the one who caught Nag by the hood in the bathroom last night."
        - id: ch04-b41
          speaker: narrator
          text: "He bounced up and down on all four paws, keeping his head close to the floor."
        - id: ch04-b42
          speaker: rikki_tikki
          text: "Nag threw me everywhere, but he could not shake me loose. He was dead before the man blew him in two. I killed him! Rikki-tikki-tck-tck! Come fight me, Nagaina. You won't be a widow for long."
        - id: ch04-b43
          speaker: narrator
          text: "Nagaina knew she had lost her chance to kill Teddy. The egg still lay between Rikki-tikki's paws."
        - id: ch04-b44
          speaker: nagaina
          text: "Give me my egg, Rikki-tikki. Give me the last one, and I will leave this garden forever."
        - id: ch04-b45
          speaker: narrator
          text: "She lowered her hood."
        - id: ch04-b46
          speaker: rikki_tikki
          text: "You will leave, and you will never return, because you are going to the rubbish heap beside Nag. Fight, widow! The man has gone to fetch his gun. Fight me!"
    - id: ch05
      title: The End of Nagaina
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "Rikki-tikki bounded around Nagaina, always keeping just beyond the reach of her strike. His small eyes glowed like hot coals. Nagaina gathered her whole body beneath her and hurled her head at him. He sprang upward and backward, and her jaws missed. Again and again she struck. Each time her head hit the veranda mat with a hard thump. Each time she drew herself together like a watch spring and attacked once more. Rikki-tikki danced in a circle, trying to reach the back of her neck. Nagaina spun with him so that her head always faced his. Her tail swept over the matting with the sound of dry leaves blown along by the wind."
        - id: ch05-b02
          speaker: narrator
          text: "Rikki-tikki had forgotten the egg. It remained on the veranda, and Nagaina edged nearer and nearer. While he paused for breath, she snatched it in her mouth, turned toward the steps, and shot down the path. Rikki-tikki raced behind her. A cobra fleeing for her life moves like a whiplash flicked across a horse's neck."
        - id: ch05-b03
          speaker: narrator
          text: "Rikki-tikki knew he had to catch her. If that last egg escaped with Nagaina, every part of the struggle could begin again. She flew straight toward the long grass beside the thornbush, and Rikki-tikki put every foot down as fast as he could. Darzee was still singing his foolish victory song. His wife had more sense. As Nagaina passed the nest, Darzee's wife flew down and beat her wings around the cobra's head. If Darzee had joined her, the two birds might have turned Nagaina away from the hole. He did not. Nagaina simply lowered her hood and rushed onward. Still, that one instant of delay was enough for Rikki-tikki to close the distance between them."
        - id: ch05-b04
          speaker: narrator
          text: "Nagaina plunged into the rat hole where she and Nag had lived. Before she disappeared, Rikki-tikki's little white teeth closed on her tail, and he went down into the earth behind her. Very few mongooses, no matter how old and wise they are, will willingly follow a cobra into its hole. The tunnel was dark. Rikki-tikki never knew when it might suddenly open into a wider space and give Nagaina enough room to turn her head and strike him. He held her tail savagely. At the same time, he thrust his feet outward and used them as brakes on the steep slope of hot, damp earth."
        - id: ch05-b05
          speaker: narrator
          text: "The grass at the mouth of the hole stopped moving. Darzee looked down and spoke."
        - id: ch05-b06
          speaker: darzee
          text: "Rikki-tikki is finished! We must sing his death song. Brave Rikki-tikki is dead, for Nagaina will surely kill him underground."
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: "Darzee made up a mournful song on the spot. Just as he reached its saddest part, the grass trembled again. Rikki-tikki crawled out of the hole one leg at a time. Dirt covered him, and he licked his whiskers. Darzee broke off with a startled cry. Rikki-tikki shook dust from his coat and sneezed."
        - id: ch05-b08
          speaker: rikki_tikki
          text: "It is finished. The widow will never come out again."
        - id: ch05-b09
          speaker: narrator
          text: "Red ants living among the grass stems heard him and marched down into the hole, one after another, to learn whether he had told the truth. Rikki-tikki curled up in the grass and slept. He slept on and on until late afternoon, because he had done a hard day's work. When he woke, he stretched and spoke to Darzee."
        - id: ch05-b10
          speaker: rikki_tikki
          text: "Now I will return to the house. Tell the Coppersmith, Darzee. He will tell the whole garden that Nagaina is dead."
        - id: ch05-b11
          speaker: narrator
          text: "The Coppersmith is a bird whose call sounds exactly like a tiny hammer striking a copper pot. He makes that sound because he is the town crier of every Indian garden. He tells the news to anyone who will listen. As Rikki-tikki walked up the path, the Coppersmith rang out his little attention note like a dinner gong. Then the message sounded steadily across the garden. Ding-dong-tock! Nag is dead. Dong! Nagaina is dead. Ding-dong-tock!"
        - id: ch05-b12
          speaker: narrator
          text: "Every bird began to sing, and every frog began to croak. Nag and Nagaina had eaten frogs as well as little birds. When Rikki-tikki reached the house, Teddy and both his parents came outside. Teddy's mother was still very pale because she had fainted. They almost cried over Rikki-tikki. That night he ate everything they offered until he could hold no more. Then he went to sleep on Teddy's shoulder. Teddy's mother found him there when she came to look at her son late that night."
        - id: ch05-b13
          speaker: teddy_mother
          text: "He saved us. He saved Teddy too. Just think, he saved every one of our lives."
          emotion: happy
        - id: ch05-b14
          speaker: narrator
          text: "Rikki-tikki woke with a start, for mongooses sleep lightly."
        - id: ch05-b15
          speaker: rikki_tikki
          text: "Oh, it is only you. Why make such a fuss? Every cobra is dead. And if any were left, I am here."
        - id: ch05-b16
          speaker: narrator
          text: "Rikki-tikki had earned the right to be proud, but he never became too proud. He guarded that garden exactly as a mongoose should, with tooth and jump and spring and bite, until no cobra dared show its head inside the walls."
